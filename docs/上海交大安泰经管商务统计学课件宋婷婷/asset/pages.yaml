- pgno: 230
  md: "# Construct Test Statistics\n\nChi-Square Test Statistic\n\n+   - The test\
    \ procedure for comparing the observed frequencies with the expected frequencies\
    \ involves the computation of the following chi-square statistic:\n+   \n+   \
    \  χ² = Σᵢ Σⱼ (fᵢⱼ - eᵢⱼ)² / eᵢⱼ,\n+   \n+     where\n+   \n+     fᵢⱼ = observed\
    \ frequency for the cell in row i and column j\n+     eᵢⱼ = expected frequency\
    \ for the cell in row i and column j\n\n+   - The test statistic has a chi-square\
    \ distribution with k − 1 df."
  merge: -1
  img_proc: true
