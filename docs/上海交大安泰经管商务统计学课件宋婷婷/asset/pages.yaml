- pgno: 430
  md: '# Mann-Whitney-Wilcoxon Test


    +   - This test is another nonparametric method for determining whether there
    is a difference between two populations.

    +   - This test is based on two independent samples.

    +   - Advantages of this procedure are

    +     - It can be used with either ordinal data or quantitative data

    +     - It does not require the assumption that the populations have a normal
    distribution

    +   - Instead of testing for the difference between the medians of two populations,
    this method tests to determine whether the two populations are identical (两个总体相同)'
  merge: -1
  img_proc: true
- pgno: 431
  md: '# Example


    +   - The bank manager is monitoring the accounts balances at two branches and
    is wondering if they are identical

    +   - The hypotheses are

    +     - H₀ : The two populations of account balances are identical

    +     - Hₐ : The two populations of account balances are not identical

    +   - Two independent samples of checking accounts are taken


