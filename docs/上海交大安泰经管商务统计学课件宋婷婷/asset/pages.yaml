  md: '# Summary


    # Step 2: Point Estimation


    +   - Estimate the mean μ of rating and the proportion p that rating is higher
    than 6.


    # Estimator for μ


    +   - Sample mean x̄ = Σ rating(xi) / n = 6.1


    # Estimator for p


    +   - Sample proportion p̂ = Σ Xi / n = 0.61, where Xi = 1 if xi ≥ 6 and 0 otherwise.


    | sample id | rating (xi) | Xi |

    |---|---|---|

    | 1 | 7 | 1 |

    | 2 | 8 | 1 |

