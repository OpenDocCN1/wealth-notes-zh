  md: "# Relationship with Interval Estimation\n\n+   - For normal population with\
    \ σ known, the (1 − α)% confidence interval for μ is given by\n+   \n+     \\\
    [\n+     \\bar{x} \\pm z_{\\alpha/2}\\frac{\\sigma}{\\sqrt{n}}\n+     \\]\n\n\
    +   - We know that (1 − α)% of the confidence intervals generated will contain\
    \ the population mean\n\n+   - Therefore, we can also use confidence interval\
    \ to conduct a two-tailed test $H_0: \\mu = \\mu_0$ versus $H_1: \\mu \\ne \\\
    mu_0$\n+     - Select a simple random sample and develop the (1 − α)% confidence\
    \ interval\n+     - If it contains the hypothesized value $\\mu_0$, do not reject\
    \ $H_0$; otherwise, reject $H_0$."
