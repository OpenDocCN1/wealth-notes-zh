- pgno: 218
  md: '# F Distribution


    +   - The *F* distribution with $d_1$ and $d_2$ degrees of freedom is the distribution
    of

    +     $$\frac{U_1/d_1}{U_2/d_2},$$

    +     where $U_1 \sim \chi^2(d_1)$, $U_2 \sim \chi^2(d_2)$, $U_1$ and $U_2$ are
    **independent**.


    +   - Assume simple random samples and normal populations. When $\sigma_1^2 =
    \sigma_2^2$, the sampling distribution of

    +     $$\frac{s_1^2}{s_2^2}$$

    +     is an *F* distribution with $n_1 - 1$ and $n_2 - 1$ degrees of freedom.
    *(Why?)*'
  merge: -1
