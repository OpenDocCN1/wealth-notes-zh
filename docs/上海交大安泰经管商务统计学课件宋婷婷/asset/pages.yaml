- pgno: 69
  md: '# Cluster Sampling（整文抽样）


    +   1. The elements in the population are first divided into separate **groups**
    called **clusters**.

    +      - Each cluster is a **representative small-scale version** of the entire
    population.


    +   2. A simple random sample of the clusters is then taken and **all elements
    within each sampled cluster** form the sample.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_69_0.png)'
  merge: -1
  img_proc: true
