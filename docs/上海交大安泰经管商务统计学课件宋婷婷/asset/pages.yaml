- pgno: 247
  md: '# Multinomial Distribution


    +   - [Multinomial distribution](#) is a direct extension of the binomial distribution.

    +   - Consider a series of *n* independent trials. At each trial, one and only
    one of *k* outcomes can occur, with corresponding probability $p_1, \ldots, p_k$.
    $(\sum_{i=1}^{k} p_i = 1)$

    +   - Let $X_i$ = number of times that outcome *i* occurs, $i = 1, \ldots, k$.
    Then the vector

    +     $$(X_1, X_2, \ldots, X_k)$$

    +     follows a multinomial distribution.

    +   - Properties

    +     - $\sum_{i=1}^{k} X_i = n$

    +     - $X_i$ has a binomial distribution'
  merge: -1
  img_proc: true
