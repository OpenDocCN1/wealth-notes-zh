- pgno: 421
  md: '# When to Use Nonparametric Methods


    Principles: if you can apply both parametric and nonparametric


    +   - With **correct assumptions** (e.g., normal distribution), parametric methods
    will be more **efficient** and **powerful** than nonparametric method.

    +   - If the normality assumption grossly violated (e.g., extreme outliers), nonparametric
    tests can be much more **efficient** and **powerful** than the corresponding parametric
    test.


    If you ONLY have qualitative data, the nonparametric test may be the only choice.'
  merge: -1
  img_proc: true
