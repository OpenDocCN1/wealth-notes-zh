- pgno: 274
  md: '# ANOVA: Motivation Models


    +   - **The Goal:** to compare means among different groups. (treatments)

    +   - **ANOVA** seeks to achieve the above goal by identifying sources of variation
    in a numerical dependent variable $X = \{x_{ij}\}$.

    +     - $j$ denotes the group the subject belongs to from $1, \dots, k$

    +     - $i$ denotes the $i$th sample in the group from $1, \dots, n_j$

    +   - We consider a simple model for $x_{ij}$

    +     - Model 1 (under $H_0$): $x_{ij} = \mu + \varepsilon_{ij}$

    +     - Model 2 (under $H_a$): $x_{ij} = \mu + \alpha_j + \varepsilon_{ij}$

    +   - Intuitively, the variation in $X$ under Model 1 ONLY comes from the error
    term $\varepsilon_{ij}$.

    +   - But the variation in $X$ under Model 2 comes from two sources: treatment
    adjustments $\alpha_j$ and the error term $\varepsilon_{ij}$.'
  merge: -1
  img_proc: true
