- pgno: 334
  md: "# Example: A Survey about Dining Hall – Analysis\n\n+   - **Total sum of squares\
    \ (SST)**  \n+     SST = \\(\\sum_{i=1}^{2}\\sum_{j=1}^{3}\\sum_{k=1}^{K_{ij}}(x_{ijk}-\\\
    bar{x})^2 = 2118.31\\), \\(df_T = 417 - 1\\)\n+   \n+   - **Sum of squares for\
    \ factor A (dining hall)**  \n+     SSA = \\(\\sum_{i=1}^{3} 139(\\bar{x}_{i\\\
    cdot}-\\bar{x})^2 = 139(5.09-6.96)^2 + 139(7.61-6.96)^2 + 139(8.22-6.96)^2 = 785.11\\\
    ), \\(df_A = 3 - 1\\)\n+   \n+   - **Sum of squares for factor B (gender)**  \n\
    +     SSB = \\(\\sum_{j=1}^{2} \\sum_{i=1}^{3}\\sum_{k=1}^{K_{ij}}(\\bar{x}_{\\\
    cdot j\\cdot}-\\bar{x})^2 = 0.12\\), \\(df_B = 2 - 1\\)\n+   \n+   - **Sum of\
    \ squares for interaction**  \n+     SSAB = \\(\\sum_{i=1}^{2}\\sum_{j=1}^{3}\\\
    sum_{k=1}^{K_{ij}}(\\bar{x}_{ij\\cdot}-\\bar{x}_{i\\cdot}-\\bar{x}_{\\cdot j\\\
    cdot}+\\bar{x})^2 = 21.08\\)  \n+     \\(df_{AB}=df_A\\cdot df_B=2\\)\n+   \n\
    +   - **Sum of squares due to error**  \n+     SSE = SST − SSA − SSB − SSAB =\
    \ 1312.00  \n+     \\(df_E=df_T-df_A-df_B-df_{AB}=411\\)"
