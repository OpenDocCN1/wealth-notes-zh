- pgno: 423
  md: "# Sign Test: Testing for a Population Median\n\n+   - The Lawler Grocery Store\
    \ chain made the decision to carry a new potato chip product, based on the manufacturer’s\
    \ estimate that the median sales should be $450 per week on a per store basis.\n\
    \n+   - Three months later, Lawler’s management requested the hypothesis test\
    \ for the population median weekly sales:\n+   \n+     $H_0: \\text{median} =\
    \ 450, \\quad \\text{versus} \\quad H_a: \\text{median} \\neq 450$\n\n+   - Data:\
    \ randomly selected one-week sales from $n = 10$ Lawler’s stores\n\n| Store Number\
    \ | Weekly Sales ($) | Store Number | Weekly Sales ($) |\n|---|---|---|---|\n\
    | 56 | 485 | 63 | 474 |\n| 19 | 562 | 39 | 662 |\n| 36 | 415 | 84 | 380 |\n| 128\
    \ | 880 | 102 | 515 |\n| 12 | 426 | 44 | 721 |"
  merge: -1
  img_proc: true
- pgno: 424
  md: '# Test with Binomial Distribution


    +   - For each observation, record a sign “+” if it is greater than 450, and record
    a sign “−” otherwise.

    +   - If the median is 450, there should be 50% plus signs and 50% minus signs.

    +   - Generally, the number of “+”, X, follows $B(n,p)$ for some $p$.

    +   - The sign test converts the original hypotheses about the median into the
    hypotheses about the binomial probability $p$:


    $H_0: p = 0.5$, versus $H_a: p \ne 0.5$


    | Store Number | Weekly Sales ($) | Sign | Store Number | Weekly Sales ($) | Sign
    |

    |---:|---:|:---:|---:|---:|:---:|

    | 56 | 485 | + | 63 | 474 | + |

    | 19 | 562 | + | 39 | 662 | + |

    | 36 | 415 | − | 84 | 380 | − |

    | 128 | 360 | − | 102 | 515 | + |

    | 12 | 426 | − | 44 | 721 | + |'
  merge: -1
  img_proc: true
- pgno: 425
  md: "# Test with Binomial Distribution\n\n+   There are 7 “+” out of 10 samples.\
    \ Suppose we want to use significance level α = 0.1, what is the p-value?\n\n\
    +   Suppose H0 is true, then X ~ B(n,0.5) with n = 10\n+   \n+   p-value = 2 ×\
    \ P(X ≥ 7) = 2 × Σ_{k=7}^{n} C(n,k) 0.5^n = 0.3438 > α\n\n+   Therefore, we cannot\
    \ reject the hypothesis that the population median is 450."
  merge: -1
  img_proc: true
- pgno: 426
  md: "# Test with Normal Approximation\n\n+   - When the sample size $n$ is large,\
    \ we can use normal approximation to simplify the computation.\n+   - Since $\\\
    mu_X = 0.5n$, $\\sigma_X = \\sqrt{0.25n}$, then for large $n$\n+   \n+   $$Z :=\
    \ \\frac{X - 0.5n}{\\sqrt{0.25n}} \\sim N(0,1)$$"
  merge: -1
  img_proc: true
- pgno: 427
  md: '# Test with Normal Approximation


    +   - When the sample size n is large, we can use normal approximation to simplify
    the computation.

    +   - Since μ_X = 0.5n, σ_X = √0.25n, then for large n

    +     $$Z := \frac{X - 0.5n}{\sqrt{0.25n}} \sim N(0,1)$$

    +   - With the normal approximation, the rejection rule is obtained.

    +     - Critical value approach:

    +       reject H₀ if |Z| ≥ z_{α/2}.

    +     - p-value approach:

    +       reject H₀ if p-value = P(|N(0,1)| ≥ |Z|) ≤ α.'
  merge: -1
  img_proc: true
