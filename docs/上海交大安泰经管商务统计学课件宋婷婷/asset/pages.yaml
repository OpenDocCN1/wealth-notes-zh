- pgno: 178
  md: '# Sampling Distribution for the Difference between Two Population Means


    +   - Assume we randomly select $n_1$ and $n_2$ customers from the inner-city
    and suburban stores, respectively,

    +     - $X_{11}, X_{12}, \ldots, X_{1n_1} \sim N(\mu_1, \sigma_1^2)$,

    +     - $X_{21}, X_{22}, \ldots, X_{2n_2} \sim N(\mu_2, \sigma_2^2)$,

    +     - The two samples are independent.


    +   - The point estimator for $\mu_1 - \mu_2$ is $\bar{X}_1 - \bar{X}_2$. What
    is the sampling distribution?


    +   - **Key point:** the sum of two independent normal random variables is still
    normal, with its mean being the sum of two means, and its variance being the sum
    of two variances.'
  merge: -1
  img_proc: true
- pgno: 179
  md: "# Interval Estimation for $\\mu_1 - \\mu_2$\n\n+   - Since\n+   \n+     $\\\
    bar{x}_1 \\sim N\\left(\\mu_1, \\frac{\\sigma_1^2}{n_1}\\right), \\quad \\bar{x}_2\
    \ \\sim N\\left(\\mu_1, \\frac{\\sigma_2^2}{n_2}\\right)$\n+   \n+     we have\n\
    +   \n+     $\\bar{x}_1 - \\bar{x}_2 \\sim N\\left(\\mu_1 - \\mu_2, \\frac{\\\
    sigma_1^2}{n_1} + \\frac{\\sigma_2^2}{n_2}\\right)$\n\n+   - The **standard error**\
    \ for the estimator is $\\sigma_{\\bar{x}_1-\\bar{x}_2} = \\sqrt{\\sigma_1^2/n_1\
    \ + \\sigma_2^2/n_2}$.\n\n+   - When both $\\sigma_1^2$ and $\\sigma_2^2$ are\
    \ known, we have **interval estimation** for $\\mu_1 - \\mu_2$\n+   \n+     $\\\
    bar{x}_1 - \\bar{x}_2 \\pm z_{\\alpha/2}\\sqrt{\\frac{\\sigma_1^2}{n_1} + \\frac{\\\
    sigma_2^2}{n_2}}$\n+   \n+     with confidence coefficient of $1 - \\alpha$."
  merge: -1
  img_proc: true
- pgno: 180
  md: '# Hypothesis Testing for Two Population Means


    +   - In general, there are 3 forms of hypothesis testing:

    +     - **Two-tailed test:**

    +       \(H_0: \mu_1-\mu_2=D_0,\quad\text{versus}\quad H_a: \mu_1-\mu_2\ne D_0.\)

    +     - **Upper-tailed test:**

    +       \(H_0: \mu_1-\mu_2\le D_0,\quad\text{versus}\quad H_a: \mu_1-\mu_2>D_0.\)

    +     - **Lower-tailed test:**

    +       \(H_0: \mu_1-\mu_2\ge D_0,\quad\text{versus}\quad H_a: \mu_1-\mu_2<D_0.\)


    If we want to test whether there is any difference between the mean ages of the
    two computer populations, how to formulate the hypotheses?'
  merge: -1
  img_proc: true
- pgno: 181
  md: "# Two Population Means when Variances are Known\n\nConsider the two-tailed\
    \ hypothesis test\n\n+   Step 1: State the hypotheses\n+   \n+   $H_0: \\mu_1\
    \ - \\mu_2 = D_0$    versus    $H_a: \\mu_1 - \\mu_2 \\ne D_0$.\n\n+   Step 3:\
    \ **We need a test statistic whose distribution is known under $H_0$.**\n\n+ \
    \  When $\\sigma_1^2, \\sigma_2^2$ are known, the test statistic is specified\
    \ by\n+   \n+   $$z = \\frac{\\bar{x}_1 - \\bar{x}_2 - D_0}{\\sqrt{\\sigma_1^2/n_1\
    \ + \\sigma_2^2/n_2}}.$$\n\n+   Step 4: Under $H_0$, we have $z \\sim N(0,1)$.\
    \ Therefore, the decision rule of Z-test will be used."
  merge: -1
  img_proc: true
- pgno: 182
  md: '# Test Procedure when \(\sigma_1^2, \sigma_2^2\) are Known


    +   - The test statistic is the same, but the rejection regions are not.

    +   - The p-values are also different.

    +     - Two-tailed test: p-value = \(P(|z| \ge z_{obs} \mid \mu_1-\mu_2=D_0)\)

    +     - Upper-tailed test: p-value = \(P(z \ge z_{obs} \mid \mu_1-\mu_2 \le D_0)\)

    +     - Lower-tailed test: p-value = \(P(z \le z_{obs} \mid \mu_1-\mu_2 \ge D_0)\)


    |  | Two-tailed Test | Upper-tailed Test | Lower-tailed Test |

    |---|---|---|---|

    | **Hypotheses** | \(H_0: \mu_1-\mu_2=D_0\)<br>\(H_a: \mu_1-\mu_2\ne D_0\) | \(H_0:
    \mu_1-\mu_2\le D_0\)<br>\(H_a: \mu_1-\mu_2>D_0\) | \(H_0: \mu_1-\mu_2\ge D_0\)<br>\(H_a:
    \mu_1-\mu_2<D_0\) |

    | **Test Statistic** | \(z=\frac{\bar{x}_1-\bar{x}_2-D_0}{\sqrt{\frac{\sigma_1^2}{n_1}+\frac{\sigma_2^2}{n_2}}}\)
    | \(z=\frac{\bar{x}_1-\bar{x}_2-D_0}{\sqrt{\frac{\sigma_1^2}{n_1}+\frac{\sigma_2^2}{n_2}}}\)
    | \(z=\frac{\bar{x}_1-\bar{x}_2-D_0}{\sqrt{\frac{\sigma_1^2}{n_1}+\frac{\sigma_2^2}{n_2}}}\)
    |

    | **Rejection rule: Critical value approach** | Reject \(H_0\) if \(|z_{obs}|\ge
    z_{\alpha/2}\) | Reject \(H_0\) if \(z_{obs}\ge z_\alpha\) | Reject \(H_0\) if
    \(z_{obs}\le -z_\alpha\) |

    | **Rejection rule: p-value approach** | Reject \(H_0\) if p-value \(\le\alpha\)
    | Reject \(H_0\) if p-value \(\le\alpha\) | Reject \(H_0\) if p-value \(\le\alpha\)
    |'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# Two Population Means when σ₁² = σ₂² are Unknown


    +   - In practice, the population variances σ₁² and σ₂² are often unknown.

    +   - For point estimation, we can still use x̄₁ − x̄₂.

    +   - However, for interval estimations and hypothesis testing, we need to estimate
    its standard error σ_{x̄₁−x̄₂} = √(σ₁²/n₁ + σ₂²/n₂).

    +   - Basic idea: use sample variances to estimate population variances, and use
    t distribution instead of normal distribution.

    +     - When σ₁² = σ₂², it works

    +     - When σ₁² ≠ σ₂², it works approximately'
  merge: -1
  img_proc: true
- pgno: 184
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 185
  md: "# Test Procedure when \\(\\sigma_1^2=\\sigma_2^2\\) are Unknown\n\n+   - A\
    \ weighted average of \\(s_1^2\\) and \\(s_2^2\\), called the **pooled estimator**\
    \ is used,\n+   \n+     \\[\n+     s_p^2=\\frac{n_1-1}{n_1+n_2-2}s_1^2+\\frac{n_2-1}{n_1+n_2-2}s_2^2\n\
    +     =\\frac{\\sum_{i=1}^{n_1}(n_i-1)s_i^2}{\\sum_{i=1}^{n_1}(n_i-1)}.\n+   \
    \  \\]\n\n+   - The T-test statistic then follows a t distribution with \\((n_1+n_2-2)\\\
    ) df\n+   \n+     \\[\n+     t=\\frac{\\bar{x}_1-\\bar{x}_2-d_0}{\\sqrt{s_p^2(1/n_1+1/n_2)}}\\\
    sim t_{n_1+n_2-2},\\quad\\text{under }H_0.\n+     \\]\n\n+   - Test procedure\
    \ works as follows.\n\n+     - Critical-value approach: reject \\(H_0\\), if \\\
    (|t_{obs}|\\geq |t_{\\alpha/2}|\\).\n\n+     - p-value approach: reject \\(H_0\\\
    ), if p-value \\(=P(|t|\\geq |t_{obs}|\\mid H_0)\\leq\\alpha\\)."
  merge: -1
  img_proc: true
- pgno: 186
  md: '# Two Population Means when $\sigma_1^2 \ne \sigma_2^2$ are Unknown


    +   - Next assume the population variances $\sigma_1^2 \ne \sigma_2^2$ are unknown.

    +   - Step 1: Consider the two-tailed hypothesis test

    +     $H_0: \mu_1 - \mu_2 = D_0 \quad \text{versus} \quad H_a: \mu_1 - \mu_2 \ne
    D_0$.

    +   - Step 3: The $t$-test should be used and the corresponding $t$-test statistic
    is

    +     $$t = \frac{\bar{x}_1-\bar{x}_2-D_0}{\sqrt{s_1^2/n_1+s_2^2/n_2}}.$$

    +   - Even under $H_0$, the distribution of $t$ is **not known**. Why?

    +   - A student $t$-distribution approximation for $t$ statistic is constructed
    as

    +     $$t \sim t_{df}, \quad \text{under } H_0,$$

    +     where

    +     $$df = \frac{(s_1^2/n_1+s_2^2/n_2)^2}{\frac{(s_1^2/n_1)^2}{n_1-1}+\frac{(s_2^2/n_2)^2}{n_2-1}}.$$


    > (Reading materials Welch–Satterthwaite equation - Wikipedia)'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Test Procedure when σ₁² ≠ σ₂² are Unknown


    +   - The test statistic is the same, but the rejection regions are not.

    +   - The p-values are also different.


    +   - Two-tailed test: p-value = P(|t| ≥ |t_obs| | μ₁ - μ₂ = D₀)

    +   - Upper-tailed test: p-value = P(t ≥ t_obs | μ₁ - μ₂ ≤ D₀)

    +   - Lower-tailed test: p-value = P(t ≤ t_obs | μ₁ - μ₂ ≥ D₀)


    | | Two-tailed Test | Upper-tailed Test | Lower-tailed Test |

    |---|---|---|---|

    | Hypotheses | H₀: μ₁ - μ₂ = D₀

    H₁: μ₁ - μ₂ ≠ D₀ | H₀: μ₁ - μ₂ ≤ D₀

    H₁: μ₁ - μ₂ > D₀ | H₀: μ₁ - μ₂ ≥ D₀

    H₁: μ₁ - μ₂ < D₀ |

    | Test Statistic | t = (x̄₁ - x̄₂ - D₀) / √(s₁²/n₁ + s₂²/n₂) | t = (x̄₁ - x̄₂
    - D₀) / √(s₁²/n₁ + s₂²/n₂) | t = (x̄₁ - x̄₂ - D₀) / √(s₁²/n₁ + s₂²/n₂) |

    | Rejection rule: Critical value approach | Reject H₀ if |t_obs| ≥ t*_{α/2} |
    Reject H₀ if t_obs ≥ t*_{α, ν} | Reject H₀ if t_obs ≤ -t*_{α, ν} |

    | Rejection rule: p-value approach | Reject H₀ if p-value ≤ α | Reject H₀ if p-value
    ≤ α | Reject H₀ if p-value ≤ α |'
  merge: -1
  img_proc: true
