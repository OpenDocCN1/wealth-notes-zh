- pgno: 314
  md: '# A Brief Introduction to DOE (实和设计)


    +   - An **experiment** is a controlled study in which the researcher attempts
    to understand **cause-and-effect relationships** (因果关系).

    +   - **Design of experiments** (DOE) is a branch of statistics on planning, conducting
    and analyzing the experiments.

    +   - DOE is founded by Sir Ronald A. Fisher. Fisher applied DOE to the field
    of agriculture as early as the 1920s, when he was the primary statistician at
    the Rothamsted Experimental Station.

    +   - Now it is the fundamental method for comparing the effects of different
    treatments in virtually all fields of research.'
  merge: -1
  img_proc: true
- pgno: 315
  md: '# An Example from Academic Research


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_315_0.png)


    # The Influence of Randomized Controlled Trials on Development Economics Research
    and on Development Policy


    Paper prepared for "The State of Economics, The State of the World" Conference
    proceedings volume


    Abhijit Vinayak Banerjee Esther Duflo Michael Kremer September 11, 2014


    Many (though far from all) of the questions that development economists and policymakers
    ask themselves are causal in nature. What would be the impact of adding computers
    in classrooms? What is the price elasticity of demand for preventative health
    products? Would increasing interest rates lead to an increase in savings? In the
    past, the standard method to answer such causal questions was Randomized Controlled
    Trials (RCTs). Fisher, 1925. In an RCT, the assignment of different units to different
    treatments is done at random. This randomization has an important characteristic:
    the resulting differences in outcomes can be attributed to the treatment, and
    hence any difference between treatment and control units reflects the impact of
    the treatment. While this idea is simple, the implementation in the field can
    be more involved, and it took some time before randomization was considered to
    be a practical tool for answering questions in social science, research in general,
    and in development economics more specifically.'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# Steps for Designing an Experiment


    The practical steps needed for designing an experiment include:


    +   1 Recognition and statement of the problem

    +   2 Choice of factors, levels, and ranges

    +   3 Selection of the response variable(s)

    +   4 Choice of design

    +   5 Conducting the experiment

    +   6 Statistical analysis (统计分析)

    +   7 Drawing conclusions, and making recommendations


    In this lecture, we shall focus on choice of the design (completely randomized
    design/randomized block design/factorial design) and statistical analysis (ANOVA).'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Completely Randomized Design (二全随机设计)


    +   A completely randomized design (CRD) is an experimental design for studying
    the effects of one factor, in which the treatments are randomly assigned to the
    experimental units.


    +   In the example of AutoShine, Inc., in order to study if three different waxes
    are equally effective in durability, we adopt the completely randomized design.


    +   Randomly pick 5 new cars and wax them with Type 1, 5 with Type 2, and 5 with
    Type 3.


    +   Each car was then repeatedly run through an automatic carwash until the wax
    coating showed signs of deterioration, and the number of washes is recorded.


    +   We can carry out the analysis for CRD using one-way ANOVA.'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# Randomized Block Design (随机区组化设计)


    +   - When single experimental units are sampled among highly **heterogeneous
    conditions** (异用性), it is unlikely that these single units will adequately represent
    the populations and repeated sampling is likely to yield very different outcomes.

    +   - **Blocking** can be used to form homogeneous groups, resulting in a Randomized
    Block Design.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_318_0.png)'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Randomized Block Design: ANOVA


    +   - The model for a RBD takes the form


    $$x_{ij}=\mu+\alpha_j+\beta_i+\epsilon_{ij},\quad j=1,\ldots,k;\ i=1,\ldots,b$$


    where $x_{ij}$ is the observed value for treatment $j$ in block $i$ and $n_T=kb$.


    +   - The sum of squares total (SST) is partitioned into three groups: sum of
    squares due to treatments (SSTR), sum of squares due to blocks (SSBL), and sum
    of squares due to error (SSE).


    $$\mathrm{SST}=\mathrm{SSTR}+\mathrm{SSBL}+\mathrm{SSE}$$


    +   - The total degrees of freedom, $n_T-1$, are partitioned such that $k-1$ degrees
    of freedom go to treatments, $b-1$ go to blocks, and $(k-1)(b-1)$ go to the error
    term.'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# Randomized Block Design: ANOVA Table


    | Source of Variation | Sum of Squares | Degrees of Freedom | Mean Square | F
    | p-Value |

    |---|---|---|---|---|---|

    | Treatments | SSTR | k - 1 | MSTR = SSTR / (k - 1) | MSTR / MSE | |

    | Blocks | SSBL | b - 1 | MSBL = SSBL / (b - 1) | | |

    | Error | SSE | (k - 1)(b - 1) | MSE = SSE / [(k - 1)(b - 1)] | | |

    | Total | SST | n_T - 1 | | | |


    +   - SST = Σ_{i=1}^{b} Σ_{j=1}^{k} (x_{ij} - x̄)^2

    +   - SSTR = Σ_{i=1}^{b} Σ_{j=1}^{k} (x̄_j - x̄)^2 = b Σ_{j=1}^{k} (x̄_j - x̄)^2

    +   - SSBL = Σ_{i=1}^{b} Σ_{j=1}^{k} (x̄_i - x̄)^2 = k Σ_{i=1}^{b} (x̄_i - x̄)^2

    +   - SSE = Σ_{i=1}^{b} Σ_{j=1}^{k} (x_{ij} - x̄_i - x̄_j + x̄)^2 = SST - SSTR
    - SSBL'
  merge: -1
  img_proc: true
