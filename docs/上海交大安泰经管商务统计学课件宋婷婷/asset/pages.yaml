- pgno: 169
  md: "# Example: Lot-Acceptance Sampling\n\n+   The hypotheses are\n+   \n+   $H_0:\
    \ \\mu \\ge 120 \\quad \\text{versus} \\quad H_a: \\mu < 120$\n\n+   Select the\
    \ level of significance $\\alpha = 0.05$\n\n+   Since $\\sigma$ is known, we use\
    \ Z-test, and the test statistic\n+   \n+   $z = \\frac{\\bar{x} - \\mu_0}{\\\
    sigma / \\sqrt{n}} = \\frac{\\bar{x} - 120}{12 / \\sqrt{36}} = \\frac{\\bar{x}\
    \ - 120}{2}$\n\n+   Suppose we use critical value approach. Then we will reject\
    \ $H_0$ if $z \\le -z_\\alpha$, i.e.,\n+   \n+   $\\frac{\\bar{x} - 120}{2} \\\
    le -1.645 \\quad \\Rightarrow \\quad \\bar{x} \\le 116.71$\n\n+   Therefore, shipment\
    \ should be returned if the average useful life of sampled batteries is no larger\
    \ than 116.71 hours. The probability of returning a qualified shipment (type I\
    \ error) is no more than 5%."
