    | 4 | 925 | 4 | 850 |

    | 5 | 950 | 5 | 800 |

    | 6 | 950 | 6 | 750 |

    | 7 | 865 | 7 | 865 |

    | 8 | 985 | 8 | 1000 |

    | 9 | 875 | 9 | 1050 |

    | 10 | 1025 | 10 | 935 |

    | 11 | 1025 | | |

    | 12 | 975 | | |'
