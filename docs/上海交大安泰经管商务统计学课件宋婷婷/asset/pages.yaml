  md: '# Summary


    # Take-aways


    +   1. Sampling is unavoidable and will induce sampling error.

    +   2. To reduce sampling error, we need to choose the reasonable sampling method.

    +   3. Generally, simple random sampling is predominant for estimation.

    +   4. Under simple random sampling (i.i.d.), E(x̄) = μ and E(p̂) = p. Moreover,
    x̄ and p̂ are unbiased and consistent estimators.

    +   5. When sample size is large, sampling distribution can be approximated well
    by normal distribution and the sampling error is minor.'
