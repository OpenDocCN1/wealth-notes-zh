- pgno: 189
  md: '# Test Procedure for Matched Samples


    +   - Assume that we collect the completion times by *n* random workers using
    two different methods

    +     - $(X_{1,1}, X_{1,2}), (X_{1,2}, X_{2,2}), \dots, (X_{1,n}, X_{2,n})$ are
    i.i.d. binormal distributed (bivariate normal distributed).

    +     - $X_{1,i}$ and $X_{2,i}$ are matched and correlated samples.


    +   - Step 1: Consider the two-tailed hypothesis test $H_0: \mu_1 = \mu_2$, versus
    $H_a: \mu_1 \neq \mu_2$.


    +   - This can be reformulated as one-population mean hypothesis testing.

    +     - Let $\mu_d = \mu_1 - \mu_2$ and $Y_i = X_{1,i} - X_{2,i}$ for $i = 1,
    2, \dots, n$.

    +     - The null hypothesis is equivalent to $H_0: \mu = 0$.


    +   - Step 2-4: Then, the one-sample t-test can be used to reject or accept $H_0$
    based on the new samples $Y_1, Y_2, \dots, Y_n$.'
