  md: "# Formulation of Hypotheses\n\n+   General formulation of Null and Alternative\
    \ Hypotheses\n+   \n+   $H_0: \\theta \\in \\Theta_0 \\quad \\text{versus} \\\
    quad H_a: \\theta \\in \\Theta_0^c,$\n+   \n+   where $\\theta$ is the parameter\
    \ to test, and $\\Theta_0$ is a closed set.\n\n+   Examples: the typical tests\
    \ for the population mean $\\theta \\equiv \\mu$\n\n+   Two-tailed test: $\\Theta_0\
    \ = \\{\\mu_0\\}$\n+   \n+   $H_0: \\mu = \\mu_0, \\quad \\text{versus} \\quad\
    \ H_a: \\mu \\neq \\mu_0.$\n\n+   Upper-tailed test: $\\Theta_0 = (-\\infty, \\\
    mu_0]$ \n+   \n+   $H_0: \\mu \\le \\mu_0, \\quad \\text{versus} \\quad H_a: \\\
    mu > \\mu_0.$\n\n+   Lower-tailed test: $\\Theta_0 = [\\mu_0, \\infty)$\n+   \n\
    +   $H_0: \\mu \\ge \\mu_0, \\quad \\text{versus} \\quad H_a: \\mu < \\mu_0.$"
  merge: -1
