- pgno: 303
  md: "# What We Have Done\n\n+   - **AN**alysis **of V**ariance (**ANOVA**, 方差分析)\
    \ is a statistical procedure used to compare **means** among different **groups\
    \ (treatments)**.\n+   - We consider simple models for $x_{ij}$:\n+   \n+    \
    \ Model 1 (under $H_0$): $x_{ij} = \\mu + \\varepsilon_{ij}$  \n+     Model 2\
    \ (under $H_1$): $x_{ij} = \\mu + \\alpha_j + \\varepsilon_{ij}$\n\n+   - Construct\
    \ a **test statistic** as a variability ratio:\n+   \n+     $$F(k-1, n_T-k)=\\\
    frac{\\text{组间变差}}{\\text{组内变差}}=\\frac{SSTR/(k-1)}{SSE/(n_T-k)}$$\n+   \n+  \
    \   and reject $H_0$ if this ratio is **sufficiently large** (Rejection rule).\n\
    \n+   - **Casual inference**: experimental studies V.S. observational studies"
  merge: -1
  img_proc: true
- pgno: 304
  md: '# Multiple Comparison Procedures


    +   - Suppose that ANOVA(MSE,1/n=1/n) has provided statistical evidence to reject
    the null hypothesis of equal population means.


    +   - H₀: μᵢ = μ⁰ for all i and Hₐ: μᵢ ≠ μ⁰ for some i.


    +   - Fisher''s least significant difference ( 小样本检验 ) (LSD) procedure is a two-step
    procedure for pairwise comparisons of several treatment groups, which helps to
    determine where the differences occur.


    +     - Perform an ANOVA test (global), if rejected at the pre-specified level
    of significance


    +     - Perform all pairwise comparisons at the same level of significance.


    +   - There are two variations of the second procedure, based on two different
    test statistics:


    +     - t-statistics t = (x̄ᵢ - x̄ⱼ) / √[MSE(1/nᵢ + 1/nⱼ)]


    +     - Sample mean differences: x̄ᵢ - x̄ⱼ'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# Fisher’s LSD Procedure: t-statistics


    +   - Step 1: Hypotheses (# C_k^2)

    +     H0: μi = μj

    +     Ha: μi ≠ μj


    +   - Step 3: Test Statistic (two-sample mean test with unknown equal variance)

    +     t(nT − k) = (x̄i − x̄j) / √[MSE(1/ni + 1/nj)]


    +   - Step 4: Rejection Rule

    +     - p-value Approach: Reject H0 if p-value ≤ α

    +     - Critical Value Approach: Reject H0 if t ≤ −tα/2 or t ≥ tα/2 where the
    value of tα/2 is based on t distribution (d.f. = nT − k) Why?'
  merge: -1
  img_proc: true
- pgno: 306
  md: '# Fisher''s LSD Procedure : x̄_i − x̄_j


    +   - Step 1: Hypotheses

    +     H₀ : μ_i = μ_j

    +     Hₐ : μ_i ≠ μ_j


    +   - Step 3: Test Statistic

    +     x̄_i − x̄_j


    +   - Step 4: Rejection Rule

    +     - Reject H₀ if

    +       |x̄_i − x̄_j| ≥ LSD

    +     where

    +     LSD = t_{α/2}(n_T − k) √[MSE(1/n_i + 1/n_j)]'
  merge: -1
  img_proc: true
- pgno: 307
  md: "# Example: Reed Manufacturing – Fisher’s LSD Procedure\n\n+   - **Empirical\
    \ question:** Recall that Janet Reed wants to know if there is any significant\
    \ difference in the mean number of hours worked per week for the department managers\
    \ at her three manufacturing plants.\n+   - In the first step, ANOVA has provided\
    \ **statistical evidence** to reject the null hypothesis of equal population means.\n\
    +   - Fisher’s least significant difference (LSD) procedure (pairwise comparisons\
