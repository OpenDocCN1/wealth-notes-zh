- pgno: 110
  md: '# Construction of Interval Estimation: σ Known


    +   - **Interval Estimation:** point estimator ± Δ


    +   - **Key point:** What is Δ? ⇒ Δ is the margin of error

    +     - How well the interval estimation capture the population parameter.

    +     - Based on the sampling distribution, we choose Δ so that there is 1 − α
    probability that the error x̄ − μ is less than ±Δ, i.e.,

    +       P{ −Δ < x̄ − μ < Δ } = 1 − α


    +   - **Interval Estimation of μ (100(1 − α)% 估计为):**

    +     x̄ ± z_{α/2} * σ / √n


    +   - 1 − α is confidence coefficient, 100(1 − α)% is confidence level.


    +   - z_{α/2} is the z value providing an area of α/2 in the upper tail of the
    standard normal probability distribution.'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# Interpretation of Interval Estimation: σ Known


    +   How to understand "confidence level?"

    +   - Any sample mean x̄ will provide an interval estimation for population mean.

    +   - However, only the intervals constructed by the sample means within μ ± zα/2σx̄
    will include the population mean μ.

    +   - 100(1 − α)% of all the intervals constructed using x̄ ± zα/2σx̄ will contain
    the population mean.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_111_0.png)'
  merge: -1
  img_proc: true
