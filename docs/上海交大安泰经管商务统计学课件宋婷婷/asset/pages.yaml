- pgno: 311
  md: '# Type I Error Rates for Multiple Comparisons


    +   - In our example, we used Fisher’s LSD procedure to make **three pairwise
    comparisons**, each with a significance level α.

    +   - What is the probability that we commit a Type I error on **at least one**
    of the three tests?

    +   - The **comparisonwise Type I error rate** (比较误差率) α indicates the level of
    significance associated with a single pairwise comparison.

    +   - The **experimentwise Type I error rate** (实验误差率) αₑw rate is the probability
    of making a Type I error on at least one of the \(C_k^2 = \frac{k!}{2!(k-2)!}\)
    pairwise comparisons.


    \[\alpha_{EW}=1-(1-\alpha)^{C_k^2}\]


    +   - The experimentwise Type I error rate gets larger for problems with more
    treatments (larger k).'
  merge: -1
  img_proc: true
- pgno: 312
  md: '# Type I Error Rates for Multiple Comparisons


    +   - One approach for controlling α_EW is the Bonferroni adjustment—the overall
    α_EW=0.05.

    +   - How?

    +   - We simply adjust the comparisonwise error rate α = α_EW / C_k².


    | k | C_k² | α_EW (α=0.05) | α_EW (α=0.05 / C_k²) |

    |---|---|---|---|

    | 3 | 3 | 0.1426 | 0.0492 |

    | 5 | 10 | 0.4013 | 0.0489 |

    | 10 | 45 | 0.9006 | 0.0488 |

    | 20 | 190 | 0.9999 | 0.0488 |


    +   - **Criticism:** The correction comes at the cost of increasing the probability
    of producing false negatives, i.e., increasing type 2 error β.'
  merge: -1
  img_proc: true
