- pgno: 170
  md: '# Example: Lot-Acceptance Sampling


    +   On the other hand, if x̄ > 116.71, then H₀ cannot be rejected and the shipment
    will be accepted.


    +   Assume μ = 112 (non-qualified shipment). What is the probability of accepting
    the shipment (type II error)?


    β = P(x̄ > 116.71 | μ = 112) = P( z = (x̄ - μ)/(σ/√n) > 2.36 ) = Φ̄(2.36) = 0.91%


    +   If the population mean is 112 hours, the probability of making a type II error
