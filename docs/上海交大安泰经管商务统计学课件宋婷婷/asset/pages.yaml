    frac{1}{n_2}\\right)}} \\quad \\text{where} \\quad S^2 = \\frac{(n_1-1)s_1^2 +\
    \ (n_2-1)s_2^2}{n_1+n_2-2}$$\n\n+   - In the dataset A: $s_1^2 = 9.2$ and $s_2^2\
    \ = 17.5$\n+   - In the dataset B: $s_1^2 = 9.2$ and $s_2^2 = 2335$\n\n+   - **Conclusion:**\
    \ the mean test statistics are highly influenced by the extreme outliers."
