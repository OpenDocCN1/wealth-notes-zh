- pgno: 240
  md: '# Test of Independence


    +   - Chi-square test can be used to test for the independence of two categorical
    variables

    +   - Set up the null and alternative hypotheses.

    +     - $H_0$: The column variable is not affected by the row variable

    +     - $H_a$: The column variable is affected by the row variable

    +   - Select a random sample and record the observed frequency $f_{ij}$ for each
    cell of the contingency table.

    +   - Compute the expected frequency $e_{ij}$ for each cell.

    +     $e_{ij} = \frac{\text{Row i Total} \times \text{Column j Total}}{\text{Sample
    Size}}$'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# Test of Independence


    +   Compute the value of the test statistic.


    ```

    χ² = Σ_i Σ_j (f_ij - e_ij)² / e_ij

    ```


    Note: When there are n rows and m columns, the test statistic has a chi-square
    distribution with (n − 1)(m − 1) df provided that the expected frequencies are
    5 or more for all categories.


    +   Rejection rule:


    +   p-value approach: Reject H0 if p-value ≤ α


    +   Critical value approach: Reject H0 if χ² > χ²_{α,(n-1)(m-1)}'
  merge: -1
  img_proc: true
