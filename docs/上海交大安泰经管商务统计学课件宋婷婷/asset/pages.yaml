- pgno: 281
  md: "# ANOVA: Summary\n\n+   - The goal of ANOVA is to split the **total variation**\
    \ of a set of observations into **different** sources, such as\n+     - Treatment\
    \ adjustments αj (One-way ANOVA, Two-way ANOVA)\n+     - Error terms εij (Benchmark\
    \ under the H0)\n+   - Between-group Variance: Treatment adjustments αj + Error\
    \ term εij\n+   - Within-group Variance: Error terms εij\n+   - It motivates us\
    \ to construct a **test statistic** as a variability ratio\n+   \n+     **Between-group\
    \ Variance** (组间离差)\n+     -----------------------------\n+     **Within-group\
    \ Variance** (组内离差)\n+   \n+     and reject H0 if this ratio is sufficiently large.\n\
    +   - To formalize this idea, we shall introduce some assumptions and terminologies\
    \ from the field of **Design of Experiments**."
  merge: -1
  img_proc: true
- pgno: 282
  md: "# Assumptions of ANOVA\n\n+   - **Normality:** For each population, the response\
    \ (dependent) variable is normally distributed.\n+   - **Identical:** The variance\
    \ of the response variable, denoted by σ², is the same for all of the populations.\
    \ (But we do not assume it is known.)\n+   - **Independent:** The observations\
    \ must be independent.\n+   \n+     ⇒ εᵢⱼ ~ i.i.d. N(0, σ²)"
  merge: -1
  img_proc: true
