    - \mu_0}{s/\sqrt{n}}$ | $t = \frac{\bar{x} - \mu_0}{s/\sqrt{n}}$ |

    | Rejection rule:

    Critical value approach | Reject $H_0$ if $t \le -t_\alpha$ | Reject $H_0$ if
    $t \ge t_\alpha$ | Reject $H_0$ if $|t| \ge t_{\alpha/2}$ |

    | Rejection rule:

    p-value approach | Reject $H_0$ if p-value $\le \alpha$ | Reject $H_0$ if p-value
    $\le \alpha$ | Reject $H_0$ if p-value $\le \alpha$ |'
