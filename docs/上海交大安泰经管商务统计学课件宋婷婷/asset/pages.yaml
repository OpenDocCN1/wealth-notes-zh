  md: '# Goodness of Fit Test: Multinomial Distribution


    +   - State the null and alternative hypotheses.

    +     - $H_0$: The population is NOT different from a multinomial distribution
    with specified probabilities for each of the $k$ categories

    +     - $H_a$: The population is different from a multinomial distribution with
    specified probabilities for each of the $k$ categories

    +   - Select a random sample and record the observed frequency $f_i$ for each
    of the $k$ categories.

    +   - Assuming $H_0$ is true, compute the expected frequency $e_i$ in each category
    by multiplying the category probability by the sample size.'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# Goodness of Fit Test: Multinomial Distribution


    +   Compute the value of the test statistic.


    χ² = Σ_{i=1}^{k} (f_i - e_i)² / e_i


    Note: The test statistic has a chi-square distribution with k − 1 df provided
    that the expected frequencies are 5 or more for all categories.


    +   Rejection rule:


    +   p-value approach: Reject H0 if p-value ≤ α


    +   Critical value approach: Reject H0 if χ² > χ²_{α, k-1}'
