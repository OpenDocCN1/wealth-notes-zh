- pgno: 89
  md: '# Properties of Point Estimators


    +   - **Efficiency（三么性质）**: If a random sample can be used to provide **two unbiased
    point estimators** of the same population parameter, we would prefer to use the
    point estimator with the **smaller standard error**.

    +     - The point estimator with the **smaller standard error** is said to have
    **greater relative efficiency** than the other.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_89_0.png)'
  merge: -1
  img_proc: true
- pgno: 90
  md: "# Properties of Point Estimators\n\n+   - **Consistency（ 一致性）**: A point estimator\
    \ is **consistent** if the values of the point estimator tend to become closer\
    \ to the population parameter as the sample size becomes larger.\n+   \n+    \
    \ $$\\lim_{n\\to\\infty}P\\{\\hat{\\theta}=\\theta\\}=1.$$\n\n+   - Is the sample\
    \ mean $\\bar{x}$ a consistent and unbiased estimator of $\\mu$?\n+     - For\
    \ example: $E(\\bar{x})=\\mu$, is a consistent estimators. Recall that $\\sigma_{\\\
    bar{x}}=\\frac{\\sigma}{\\sqrt{n}}$\n+     - We conclude that a larger sample\
    \ size tends to provide point estimates closer to the population mean $\\mu$"
  merge: -1
  img_proc: true
