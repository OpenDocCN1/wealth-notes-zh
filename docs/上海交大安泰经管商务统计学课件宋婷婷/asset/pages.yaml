- pgno: 93
  md: '# Summary


    +   - Method 2: Stratified random sampling

    +     - 假设该行为学生按 丁级二丁级三丁级四丁尔 丁尔二这六个整级 组成，且每个等级的学生数为1500人

    +     - Then in each grade, select 200 students using simple random sampling.


    +   - Method 3: Cluster sampling

    +     - 假设该行为由60个学院组成，抽个学院150人

    +     - Then select 8 schools using simple random sampling

    +     - Note: The overall students in selected classes belong to the sample


