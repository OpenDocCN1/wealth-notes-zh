  md: '# Inference about Two Means: Motivating Example


    +   - A grocery retailer operates two stores. One is in the inner city and the
    other is in a suburban shopping center.

    +   - The manager notices that the products that sell well in one store may not
    sell well in the other.

    +   - This situation may be attributable to differences in customer demographics
    at the two locations.

    +   - The manager asks us to investigate the difference between the mean ages
    of the customers who shop at the two stores.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_177_0.png)'
  merge: -1
