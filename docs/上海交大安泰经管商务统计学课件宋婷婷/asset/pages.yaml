- pgno: 28
  md: '# Berkson’s Paradox


    # Example 1: University Applications in U.S.


    +   - Two commonly requirements: **high school GPA** and **SAT** scores.

    +   - **Question:** What is the relationship between **high school GPA** and **SAT**
    for students?

    +   - Your guess: the high school GPA and SAT scores are **positively correlated**.

    +   - **Question:** What is the relationship between **high school GPA** and **SAT**
    for students who attend a **middle-rank college**?

    +   - What is your guess now?

    +   - **Middle-rank college requirements:** Either a sufficiently high GPA or
    a sufficiently high SAT scores.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Berkson''s Paradox


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_29_0.png)


    +   - **Excellent Group**: Who have both high GPAs and high SAT scores will likely
    get into a higher-tier school.

    +   - **Middle Group**: The range of students that actually attend the school
    is given by the blue dots in the plot.

    +   - **Results:**

    +     - A downward trend in the middle-rank college

    +     - A upward trend for the overall population

    +   - A selection bias!'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Berkson''s Paradox


    # Example 2: Dating Problem.


    +   - Interesting Facts: Among the people you date (or you may date in future),
    the attractive ones tend to be jerks?

    +     - Psycho-social theories

    +     - A simple statistic explanation: Selection bias!

    +       - You choice of people to date depends on two factors: attractiveness
    and personality.


    |  | nice (暖) | mean (渣) |

    |---|---|---|

    | attractive (者) | ✓ | ✓ |

    | unattractive (氐) | ✓ | × |


    Results: When you censored the mean unattractive one, this creates a spurious
    negative correlation between attractiveness and personality.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Simpson''s Paradox


    # Example: Gender Bias


    +   - Some Facts: The enrollment rate for female and male in a university


    |  | Female |  |  | Male |  |  |

    |---|---|---|---|---|---|---|

    |  | Applicant | Recruit | Rate | Applicant | Recruit | Rate |

    |  | 120 | 50 | 42% | 120 | 25 | 21% |


    +   - Boys in that university try to protest over the low male enrollment rate.


    +   - Do you think the university has sexual discrimination?


    +   - A Detailed Fact:


    |  | Female |  |  | Male |  |  |

    |---|---|---|---|---|---|---|

    |  | Applicant | Recruit | Rate | Applicant | Recruit | Rate |

    | Business School | 100 | 49 | 49% | 20 | 15 | 75% |

    | Law School | 20 | 1 | 5% | 100 | 10 | 10% |


    +   - Conclusion: There is a trend in several different sets of data, but when
    these data sets are combined, this trend disappears or reverses.


    +   - Confounding variable: Because School is a hidden variable that cannot be
    ignored.'
  merge: -1
  img_proc: true
