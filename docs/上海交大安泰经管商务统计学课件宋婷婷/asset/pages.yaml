    \   Hₐ : μ₁ ≠ μ₂.\n\n+   - Matched sample design:\n+     - a random sample of\
    \ workers is selected\n+     - each worker first uses one method and then uses\
    \ the other method\n+     - the order of the two methods is assigned randomly\
    \ to the workers."
