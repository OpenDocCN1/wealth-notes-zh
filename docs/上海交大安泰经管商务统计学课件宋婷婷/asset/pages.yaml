- pgno: 117
  md: '# Interval Estimate of Population Mean: σ Unknown


    +   - **Interval Estimation**: point estimator ± Δ

    +   - **Key point**: What is Δ under σ is unknown.

    +     - When σ is known, we choose Δ = z_{α/2} σ/√n so that there is 1 − α probability
    that the error x̄ − μ is less than ±Δ, i.e.,

    +       P{ −z_{α/2} σ/√n < x̄ − μ < z_{α/2} σ/√n } = 1 − α

    +     - Now we only know sample standard deviation, s.

    +     - How to define Δ? ⇒ The key is to find the distribution of

    +       t = (x̄ − μ) / (s/√n)'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# Understand $t = \frac{\bar{x} - \mu}{s/\sqrt{n}}$


    We decompose $t = \frac{\bar{x} - \mu}{s/\sqrt{n}}$ as follows


    $t = \frac{\frac{\bar{x} - \mu}{\sqrt{\sigma^2/n}}}{\sqrt{\frac{s^2 (n-1)/\sigma^2}{n-1}}}
    = \frac{N(0,1)}{\sqrt{\chi^2 (n-1)/n-1}}$


    +   - Assumption: Let each element $x_1, x_2, ..., x_n$ be $N(\mu, \sigma^2)$
    r.v.


    +   - Numerator: $\frac{\bar{x} - \mu}{\sqrt{\sigma/n}} \sim N(0,1)$


    +   - Denominator: $\frac{(n-1)s^2}{\sigma^2} \sim \chi^2(n-1)$


    +   - $\bar{x}$ and $s$ are independent (Why?)'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Construction of CI: σ Unknown


    +   Interval Estimation: point estimator ±Δ


    +   Key point: What is Δ under σ is unknown.


    +   When σ is unknown, we choose Δ = t_{α/2, n-1} s/√n so that there is 1 − α
    probability that the error x̄ − μ is less than ±Δ, i.e.,


    P{ −t_{α/2} s/√n < x̄ − μ < t_{α/2} s/√n } = 1 − α


    +   Now we use sample standard deviation, s.


    +   t_{α/2} is the t value providing an area of α/2 in the upper tail of the t
    distribution with n − 1 degrees of freedom'
  merge: -1
  img_proc: true
