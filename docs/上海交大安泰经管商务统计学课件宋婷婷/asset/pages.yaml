- pgno: 432
  md: '# The Procedure


    +   - Rank the combined data from the lowest to highest values; the tied values
    are assigned the average rank

    +   - Sum the ranks for each sample

    +   - We use the sum of the ranks for sample 1 as the test statistic W


    | Branch 1 | | | Branch 2 | | |

    |---|---|---|---|---|---|

    | Account | Balance ($) | Rank | Account | Balance ($) | Rank |

    | 1 | 1095 | 20 | 1 | 885 | 4 |

    | 2 | 900 | 6 | 2 | 900 | 6 |

    | 3 | 1200 | 22 | 3 | 915 | 8 |

    | 4 | 1105 | 21 | 4 | 650 | 12.5 |

    | 5 | 925 | 9 | 5 | 800 | 2 |

    | 6 | 950 | 12.5 | 6 | 750 | 1 |

    | 7 | 800 | 3 | 7 | 985 | 15 |

    | 8 | 948 | 11 | 8 | 1000 | 16 |

    | 9 | 875 | 5 | 9 | 1050 | 18 |

    | 10 | 1005 | 17 | 10 | 935 | 10 |

    | 11 | 1025 | 17 | | Sum of Ranks | 92.5 |

    | 12 | 975 | 15 | | | |

    | Sum of Ranks | 189.5 | | | | |'
  merge: -1
  img_proc: true
- pgno: 433
  md: "# Sampling Distribution\n\n+   It can be show that\n+   \n+   $\\mu_W = \\\
    frac{1}{2} n_1 (n_1 + n_2 + 1), \\qquad \\sigma_W = \\sqrt{\\frac{1}{12} n_1 n_2\
    \ (n_1 + n_2 + 1)}$\n\n+   For large samples (i.e., $n_1 \\ge 7$ and $n_2 \\ge\
    \ 7$), we can use normal approximation.\n\n+   In our example, $n_1 = 12$, $n_2\
    \ = 10$, $\\mu_W = 138$, $\\sigma_W = 15.1658$, so the p-value\n+   \n+   $p\\\
    text{-value} = 2 \\times P\\left(N(0,1) \\ge \\frac{169.5 - 0.5 - 138}{15.1658}\\\
    right) = 0.0378 < \\alpha$\n+   \n+   and we reject $H_0$."
  merge: -1
  img_proc: true
- pgno: 434
  md: '# Summary of Nonparametric Tests


    | Nonparametric Test | What It Does | Parametric Counterpart |

    |---|---|---|

    | Rank Test | Compare 1 median with a specified value | 1-sample Z-test/T-test
    |

    |  | Compare 2 paired medians | paired samples T-test |

    | Wilcoxon Signed-Rank Test | Compare 2 paired medians | paired samples T-test
    |

    | The MWV Test | Compare 2 independent medians | 2-sample T-test |

    | The Kruskal-Wallis Test | Compare 3 or more medians | 1-way ANOVA |'
  merge: -1
  img_proc: true
