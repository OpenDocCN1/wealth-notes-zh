  md: "# Construct Test Statistics\n\nExpected Frequencies\n\n+   - If $H_0$ is true,\
    \ how many BYD Han owners would you expected to indicate a ‘Yes’?\n+     - If\
    \ $H_0: p_1 = p_2 = p_3$ is true, the best estimate of the proportion in the overall\
    \ sample proportion $\\hat{p} = 312/502 = 0.624$.\n+     - Therefore, we would\
    \ expect $0.624 \\times 125 = 78$ BYD Han owners to indicate they are likely to\
    \ repurchase the Han.\n\n+   - In general, the expected frequencies under the\
    \ assumption $H_0$ is correct\n+   \n+     $$e_{ij} = \\frac{(\\text{Row } i\\\
    text{ Total})(\\text{Column } j\\text{ Total})}{\\text{Total Sample Size}}$$\n\
    \n+   - If a significant difference exists between the observed and expected frequencies,\
    \ $H_0$ can be rejected."
