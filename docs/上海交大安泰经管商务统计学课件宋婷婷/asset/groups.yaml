    - The test statistic is the same, but the rejection regions are not.\n\n|  | Lower-tailed\
    \ Test | Upper-tailed Test | Two-tailed Test |\n|---|---|---|---|\n| Hypotheses\
    \ | H₀: p ≥ p₀<br>Hₐ: p < p₀ | H₀: p ≤ p₀<br>Hₐ: p > p₀ | H₀: p = p₀<br>Hₐ: p\
    \ ≠ p₀ |\n| Test Statistic | z = (p̂ - p₀) / √[p₀(1-p₀)/n] | z = (p̂ - p₀) / √[p₀(1-p₀)/n]\
    \ | z = (p̂ - p₀) / √[p₀(1-p₀)/n] |\n| Rejection rule:<br>Critical value approach\
    \ | Reject H₀ if z ≤ -zα | Reject H₀ if z ≥ zα | Reject H₀ if |z| ≥ zα/2 |\n|\
    \ Rejection rule:<br>p-value approach | Reject H₀ if p-value ≤ α | Reject H₀ if\
    \ p-value ≤ α | Reject H₀ if p-value ≤ α |\n\n## Type I and Type II Errors\n\n\
    Errors from hypothesis testing:\n\n- • **Type I Error:** Rejecting the null hypothesis,\
    \ $H_0$, when it is true. (False positive, 均球性). Well controlled by the level\
    \ of significance $\\alpha$.\n  \n- • **Type II Error:** Not to reject the null\
    \ hypothesis when it is false. (False negative, 均或性). Define it as $\\beta$.\n\
    \  \n- • **Question:** How to control Type II error?\n\n| Table of error types\
    \ | Null hypothesis ($H_0$) |\n|---|---|\n|  | True | False |\n| Decision: Reject\
    \ null hypothesis ($H_0$) | Correct inference (true negative) $(1-\\alpha)$ |\
    \ Type II error (false negative) $\\beta$ |\n| Decision: Do not reject null hypothesis\
    \ ($H_0$) | Type I error (false positive) probability $\\alpha$ | Correct inference\
    \ (true positive) $(1-\\beta)$ |\n\n## Type II Error\n\n- The quality of hypothesis\
    \ test is to **minimize** error rates.\n  - To reduce the probability of Type\
    \ I error, make the α value smaller (naive and efficient)!\n  - How to decrease\
    \ the probability of Type II error?\n\n- **Power (原力):** the probability that\
    \ the test correctly reject the *H₀* when *Hₐ* is true (i.e., 1 − β)\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_166_0.png)\n\
    \n## Type I Error and Type II Error\n\n- Ideally, we hope to find a test that\
    \ controls both the Type I and Type II errors.\n- These two types of error rates\
    \ are traded off against each other.\n- For any given sample set, the effort to\
    \ reduce one type of error generally results in increasing the other type of error.\n\
    - The power always depends on three factors:\n  - the statistical significant\
    \ level we selected in the test. α\n  - the magnitude of the effect of interest\
    \ in the population. |μₐ − μ₀|\n  - the sample size used to detect the effect.\
    \ n\n- Question: For a given significance test with significance level α, can\
    \ we control the Type II error probability β?\n- Solution: Increase the number\
    \ of samples you use.\n\n## Example: Lot-Acceptance Sampling\n\n- A supplier has\
    \ delivered a shipment of batteries. As the quality control manager, you must\
    \ make the decision that\n  - either accept the entire shipment, or\n  - return\
    \ the shipment because of poor quality.\n- Battery Standard: the mean useful life\
    \ is at least 120 hours.\n- Sample: 36 batteries will be selected and tested.\n\
    - Assume the population standard deviation is known with σ = 12 hours.\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_168_0.png)\n\
    \n## Example: Lot-Acceptance Sampling\n\nThe hypotheses are\n\n$H_0: \\mu \\ge\
    \ 120 \\quad \\text{versus} \\quad H_a: \\mu < 120$\n\nSelect the level of significance\
    \ $\\alpha = 0.05$\n\nSince $\\sigma$ is known, we use Z-test, and the test statistic\n\
    \n$z = \\frac{\\bar{x} - \\mu_0}{\\sigma / \\sqrt{n}} = \\frac{\\bar{x} - 120}{12\
    \ / \\sqrt{36}} = \\frac{\\bar{x} - 120}{2}$\n\nSuppose we use critical value\
    \ approach. Then we will reject $H_0$ if $z \\le -z_\\alpha$, i.e.,\n\n$\\frac{\\\
    bar{x} - 120}{2} \\le -1.645 \\quad \\Rightarrow \\quad \\bar{x} \\le 116.71$\n\
    \nTherefore, shipment should be returned if the average useful life of sampled\
    \ batteries is no larger than 116.71 hours. The probability of returning a qualified\
    \ shipment (type I error) is no more than 5%.\n"
  mdcn: "\n\n## 检验总体比例：正态近似\n\n- 基于中心极限定理，当 n 较大时，我们可以通过正态近似更方便地得到临界值 c。\n\n- 步骤 3：将检验统计量改为\
    \ z = (p̂ - p₀) / √[p₀(1 - p₀)/n]。\n\n- 步骤 4：对于上尾假设检验，使用 Z 检验：如果 (p̂ - p₀) / √[p₀(1\
    \ - p₀)/n] ≥ zₐ，则拒绝 H₀ : p ≤ p₀。\n\n## 总体比例的其他假设检验扩展\n\n- 下尾、上尾和双侧检验的概览如下。\n-\
    \ 检验统计量相同，但拒绝域不同。\n\n|  | 下尾检验 | 上尾检验 | 双侧检验 |\n|---|---|---|---|\n| 假设 | H₀:\
    \ p ≥ p₀<br>Hₐ: p < p₀ | H₀: p ≤ p₀<br>Hₐ: p > p₀ | H₀: p = p₀<br>Hₐ: p ≠ p₀ |\n\
    | 检验统计量 | z = (p̂ - p₀) / √[p₀(1-p₀)/n] | z = (p̂ - p₀) / √[p₀(1-p₀)/n] | z =\
    \ (p̂ - p₀) / √[p₀(1-p₀)/n] |\n| 拒绝规则：<br>临界值法 | 若 z ≤ -zα，则拒绝 H₀ | 若 z ≥ zα，则拒绝\
    \ H₀ | 若 \\|z\\| ≥ zα/2，则拒绝 H₀ |\n| 拒绝规则：<br>p 值法 | 若 p 值 ≤ α，则拒绝 H₀ | 若 p 值 ≤\
    \ α，则拒绝 H₀ | 若 p 值 ≤ α，则拒绝 H₀ |\n\n## 第一类错误与第二类错误\n\n假设检验中的错误：\n\n- • **第一类错误：**当原假设\
    \ $H_0$ 为真时，拒绝了原假设。（假阳性，概率性）。该错误由显著性水平 $\\alpha$ 很好地控制。\n\n- • **第二类错误：**当原假设为假时，未拒绝原假设。（假阴性，可能性）。将其定义为\
    \ $\\beta$。\n\n- • **问题：**如何控制第二类错误？\n\n| 错误类型表 | 原假设（$H_0$） |\n|---|---|\n| \
    \ | 为真 | 为假 |\n| 决策：拒绝原假设（$H_0$） | 正确推断（真阴性）$(1-\\alpha)$ | 第二类错误（假阴性）$\\beta$\
    \ |\n| 决策：不拒绝原假设（$H_0$） | 第一类错误（假阳性）概率 $\\alpha$ | 正确推断（真阳性）$(1-\\beta)$ |\n\n\
    ## 第二类错误\n\n- 假设检验的质量在于**最小化**错误率。\n  - 要降低第一类错误的概率，可以让 α 值更小（简单高效）！\n  - 如何降低第二类错误的概率呢？\n\
    \n- **功效（Power）：**当备择假设 *Hₐ* 为真时，检验正确拒绝 *H₀* 的概率（即 1 − β）\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_166_0.png)\n\
    \n## 第一类错误与第二类错误\n\n- 理想情况下，我们希望找到一种能同时控制第一类错误和第二类错误的检验。\n- 这两类错误率之间存在此消彼长的权衡关系。\n\
    - 对于任何给定的样本集，降低其中一类错误的努力通常会导致另一类错误的增加。\n- 功效总是取决于三个因素：\n  - 检验中所选的统计显著性水平 α\n\
    \  - 总体中所关注效应的大小 |μₐ − μ₀|\n  - 用于检测该效应的样本量 n\n- 问题：对于给定显著性水平 α 的显著性检验，我们能否控制第二类错误概率\
    \ β？\n- 解决办法：增加使用的样本数量。\n\n## 示例：批次验收抽样\n\n- 供应商交付了一批电池。作为质量控制经理，你必须做出决定：\n  -\
    \ 要么接受整批货物，\n  - 要么因质量不佳退回整批货物。\n- 电池标准：平均使用寿命至少为 120 小时。\n- 样本：将选择并测试 36 节电池。\n\
    - 假设总体标准差已知，σ = 12 小时。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_168_0.png)\n\
    \n## 示例：批次验收抽样\n\n假设为\n\n$H_0: \\mu \\ge 120 \\quad \\text{对} \\quad H_a: \\mu\
    \ < 120$\n\n选取显著性水平 $\\alpha = 0.05$\n\n由于 $\\sigma$ 已知，我们使用 Z 检验，检验统计量为\n\n$z\
    \ = \\frac{\\bar{x} - \\mu_0}{\\sigma / \\sqrt{n}} = \\frac{\\bar{x} - 120}{12\
    \ / \\sqrt{36}} = \\frac{\\bar{x} - 120}{2}$\n\n假设我们使用临界值法。那么当 $z \\le -z_\\alpha$\
    \ 时，即如下不等式成立时，我们将拒绝 $H_0$：\n\n$\\frac{\\bar{x} - 120}{2} \\le -1.645 \\quad \\\
    Rightarrow \\quad \\bar{x} \\le 116.71$\n\n因此，如果抽样电池的平均使用寿命不大于 116.71 小时，则应退回该批货物。退回合格批次（第一类错误）的概率不超过\
    \ 5%。\n\n"
