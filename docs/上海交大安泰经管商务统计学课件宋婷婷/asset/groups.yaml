  mdcn: "\n\n## 摘要\n\n- 对下尾、上尾和双尾检验的概述如下。\n- 检验统计量相同，但拒绝域不同。\n\n|  | 下尾检验 | 上尾检验 |\
    \ 双尾检验 |\n|---|---|---|---|\n| **假设** | H₀: μ ≥ μ₀<br>Hₐ: μ < μ₀ | H₀: μ ≤ μ₀<br>Hₐ:\
    \ μ > μ₀ | H₀: μ = μ₀<br>Hₐ: μ ≠ μ₀ |\n| **检验统计量** | z = (x̄ − μ₀) / (σ / √n)\
    \ | z = (x̄ − μ₀) / (σ / √n) | z = (x̄ − μ₀) / (σ / √n) |\n| **拒绝规则：临界值法** | 若\
    \ z ≤ −zₐ 则拒绝 H₀ | 若 z ≥ zₐ 则拒绝 H₀ | 若 |z| ≥ zₐ/₂ 则拒绝 H₀ |\n| **拒绝规则：p值法** | 若\
    \ p-value ≤ α 则拒绝 H₀ | 若 p-value ≤ α 则拒绝 H₀ | 若 p-value ≤ α 则拒绝 H₀ |\n\n## 方差未知时总体均值的检验\n\
    \n- 假设我们收集 *n.i.i.d.* 样本 $X_1, X_2, \\ldots, X_n$，且 $X_i \\sim N(\\mu, \\sigma^2)$。\n\
    \n- 第 1 步：陈述原假设和备择假设  \n  $H_0: \\mu = \\mu_0,\\ H_a: \\mu \\ne \\mu_0$。\n\n-\
    \ 第 2 步：选择显著性水平 $\\alpha$。\n\n- 第 3 步：当方差 $\\sigma^2$ 未知时，检验统计量由\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_155_0.png)\n\
    \n给出，其中 $\\bar{X}$ 为样本均值，$S^2$ 为样本方差。\n\n- 基于 $t$ 统计量的检验程序通常称为 $t$-检验。\n\n- 在\
    \ $H_0$ 下，$t$ 的分布已知，即 $t \\sim t_{n-1}$，其中 $n-1$ 为自由度。\n\n## 第 4 步 & 5 步：制定决策规则并做出决策\n\
    \n- **临界值法**\n  - 设拒绝域为 (−∞, −c] ∪ [c, ∞)，且\n  - 显著性水平 = P(拒绝 H₀|H₀) = P(|t| ≥\
    \ c|H₀)。\n  - 显著性水平 α 通过令 c = tₐ/₂ 实现。\n  - 拒绝规则为\n    若 |t| ≥ tₐ/₂，则拒绝 H₀ : μ\
    \ = μ₀。\n\n- **p值法**\n  - p值作为反对 H₀ 的证据的度量为\n    p-value = P(|t| ≥ |t_obs| | H₀)。\n\
    \  - 拒绝规则为\n    若 p-value ≤ α，则拒绝 H₀ : μ = μ₀。\n\n## 对其他假设的扩展\n\n- 对下尾、上尾和双尾检验的概述如下。\n\
    - 检验统计量相同，但拒绝域不同。\n\n| | 下尾检验 | 上尾检验 | 双尾检验 |\n|---|---|---|---|\n| 假设 | $H_0:\
    \ \\mu \\ge \\mu_0$<br>$H_a: \\mu < \\mu_0$ | $H_0: \\mu \\le \\mu_0$<br>$H_a:\
    \ \\mu > \\mu_0$ | $H_0: \\mu = \\mu_0$<br>$H_a: \\mu \\ne \\mu_0$ |\n| 检验统计量\
    \ | $t = \\frac{\\bar{x} - \\mu_0}{s/\\sqrt{n}}$ | $t = \\frac{\\bar{x} - \\mu_0}{s/\\\
    sqrt{n}}$ | $t = \\frac{\\bar{x} - \\mu_0}{s/\\sqrt{n}}$ |\n| 拒绝规则：<br>临界值法 |\
    \ 若 $t \\le -t_\\alpha$ 则拒绝 $H_0$ | 若 $t \\ge t_\\alpha$ 则拒绝 $H_0$ | 若 $|t| \\\
    ge t_{\\alpha/2}$ 则拒绝 $H_0$ |\n| 拒绝规则：<br>p值法 | 若 p-value $\\le \\alpha$ 则拒绝 $H_0$\
    \ | 若 p-value $\\le \\alpha$ 则拒绝 $H_0$ | 若 p-value $\\le \\alpha$ 则拒绝 $H_0$ |\n\
    \n## 总体比例的检验：动机示例\n\n- 过去一年里，SJTU 某学生社团中男女生比例为 4:1。\n- 本学期初开展了一项特别推广活动，旨在吸引女性成员。\n\
