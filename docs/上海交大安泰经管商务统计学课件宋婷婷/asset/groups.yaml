    interpreting and presenting data.'
  - '[PAGE 19]


    # What is statistics?


    +   Two important objectives:

    +   * Infer about populations from samples via probability modelling.

    +   * Predict future outcomes


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_19_0.png)


    +   * Probability: Describe how data were drawn from a population.

    +   * Statistics: Infer about population via probabilistic modeling.'
  - '[PAGE 20]


    # The History of Statistics


    Biometrika: Galton and Pearson founded Biometrika as the first journal of statistics
    in 1901, and the latter founded the world''s first statistics department at UCL.


    The Beginning of Ancient Statistics (B.C. 450): "Three Counting Problems"


    The "Probability" Foundations for Statistics in the 16th-17th Century: The probability
    concept and theory from gambling


    "Paradigm Reform and Innovation" in Modern Statistics (1900-2000): The Fourth
    Paradigm: data-intensive scientific discovery


    The Growth of Ancient Statistics (A.D. 2): The Han Dynasty of China conducted
    the first accurate census in human history


    "Four Great Discoveries" of Statistical Science in the 18th-19th Century: Law
    of Large Numbers, Bayes'' theorem, analysis of errors, regression and correlation


    Source: 郁东, 刘东升, 刘爱霞, 统计的历史与统计学发展. 2017.'
