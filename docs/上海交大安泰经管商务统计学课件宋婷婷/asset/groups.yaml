  md: "\n## Properties of Point Estimators\n\n- **Efficiency（有效性）**: If a random sample\
    \ can be used to provide two unbiased point estimators of the same population\
    \ parameter, we would prefer to use the point estimator with the **smaller standard\
    \ error**.\n  - The point estimator with the **smaller standard error** is said\
    \ to have **greater relative efficiency** than the other.\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_89_0.png)\n\
    \n- **Consistency（一致性）**: A point estimator is **consistent** if the values of\
    \ the point estimator tend to become closer to the population parameter as the\
    \ sample size becomes larger.\n\n$$\\lim_{n\\to\\infty}P\\{\\hat{\\theta}=\\theta\\\
    }=1.$$\n\n- Is the sample mean $\\bar{x}$ a consistent and unbiased estimator\
    \ of $\\mu$?\n  - For example: $E(\\bar{x})=\\mu$; $\\bar{x}$ is a consistent\
    \ estimator. Recall that $\\sigma_{\\bar{x}}=\\frac{\\sigma}{\\sqrt{n}}$.\n  -\
    \ We conclude that a larger sample size tends to provide point estimates closer\
    \ to the population mean $\\mu$.\n\n## Summary\n\n1. Introduction\n2. Sampling\
    \ Method\n3. Point Estimation and Sampling Distributions\n4. Summary\n\n### Method\
    \ 2: Stratified random sampling\n\n- 假设该学校学生由一年级、二年级、三年级、四年级、五年级、六年级这六个年级组成，且每个年级的学生数为1500人。\n\
    - Then in each grade, select 200 students using simple random sampling.\n\n###\
    \ Method 3: Cluster sampling\n\n- 假设该学校由60个学院组成，每个学院150人。\n- Then select 8 schools\
    \ using simple random sampling.\n- Note: All the students in selected classes\
    \ belong to the sample.\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_93_0.png)\n\
    \n*Figure: Stratified random sampling and Cluster sampling*\n\n### Step 2: Point\
    \ Estimation\n\n- Estimate the mean $\\mu$ of rating and the proportion $p$ that\
    \ rating is higher than 6.\n\n**Estimator for $\\mu$**\n\n- Sample mean $\\bar{x}\
    \ = \\frac{\\Sigma \\text{rating}(x_i)}{n} = 6.1$\n\n**Estimator for $p$**\n\n\
    - Sample proportion $\\hat{p} = \\frac{\\Sigma X_i}{n} = 0.61$, where $X_i = 1$\
    \ if $x_i \\geq 6$ and $0$ otherwise.\n\n| sample id | rating $(x_i)$ | $X_i$\
    \ |\n|---|---|---|\n| 1 | 7 | 1 |\n| 2 | 8 | 1 |\n| 3 | 8 | 1 |\n| 4 | 6 | 1 |\n\
    | 5 | 5 | 0 |\n| ... | ... | ... |\n| 1200 | 4 | 0 |\n\n### Step 3: Use sampling\
    \ distribution to justify the precision of estimator\n\nSuppose a priori belief\
    \ about rating is that $\\mu = 6$, $\\sigma = \\sqrt{3}$, $n=1200$.\n\n**Precision\
    \ for $\\mu$**\n\n$E(\\bar{x})=\\mu=6$; $\\sigma_{\\bar{x}} = \\sigma/\\sqrt{n}\
    \ = 1/20$.\n\nThe probability that $|\\bar{x} - \\mu| \\leq 0.1$ is\n\n$$\\Pr(5.9\
    \ \\leq \\bar{x} \\leq 6.1)\n= \\Pr\\left\\{\\frac{5.9 - E(\\bar{x})}{\\sigma_{\\\
    bar{x}}} \\leq \\frac{\\bar{x} - E(\\bar{x})}{\\sigma_{\\bar{x}}} \\leq \\frac{6.1\
    \ - E(\\bar{x})}{\\sigma_{\\bar{x}}}\\right\\}\n\\approx \\Phi(2) - \\Phi(-2)\
    \ \\approx 0.9544$$\n\nThe probability that sampling error is less than $0.1$\
    \ is $95.44\\%$.\n\nSuppose a priori belief about proportion that rating is higher\
    \ than 6 is $p = 0.6$.\n\n**Precision for $p$**\n\n$E(\\bar{p}) = p = 0.6$; $\\\
    sigma_{\\bar{p}} = \\sqrt{\\frac{p(1-p)}{n}} \\approx 0.014$.\n\nThe probability\
    \ that $|\\bar{p} - p| \\le 0.01$ is\n\n$$\\Pr(0.59 \\le \\bar{p} \\le 0.61)\n\
    = \\Pr\\left\\{\\frac{0.59 - E(\\bar{p})}{\\sigma_{\\bar{p}}} \\le \\frac{\\bar{p}\
    \ - E(\\bar{p})}{\\sigma_{\\bar{p}}} \\le \\frac{0.61 - E(\\bar{p})}{\\sigma_{\\\
    bar{p}}}\\right\\}\n\\approx \\Phi(0.714) - \\Phi(-0.714) \\approx 0.5222$$\n\n\
    The probability that sampling error is less than $0.01$ is only $52.22\\%$. If\
    \ the probability cannot meet the expectation, try to increase sample size.\n\n\
    ### Take-aways\n\n1. Sampling is unavoidable and will induce sampling error.\n\
    2. To reduce sampling error, we need to choose the reasonable sampling method.\n\
    3. Generally, simple random sampling is predominant for estimation.\n4. Under\
    \ simple random sampling (i.i.d.), $E(\\bar{x}) = \\mu$ and $E(\\hat{p}) = p$.\
    \ Moreover, $\\bar{x}$ and $\\hat{p}$ are unbiased and consistent estimators.\n\
    5. When sample size is large, sampling distribution can be approximated well by\
    \ normal distribution and the sampling error is minor.\n\n## BUSS2302: Business\
    \ Statistics\n\n### Lecture 3: Interval Estimation\n\nInstructor: Tingting SONG\
    \ (宋婷婷)\n\nAntai College of Economics and Management\nShanghai Jiao Tong University\n\
    \nTextbook: [1] Chapter 8, *Statistics for Business and Economics*, 13e, by Anderson,\
    \ Sweeney, Williams, Camm, and Cochran (2018).\n"
  mdcn: "\n\n## 点估计量的性质\n\n- **Efficiency（有效性）**：如果一个随机样本可以用来提供同一总体参数的两个无偏点估计量，我们会更倾向于使用**标准误差较小**的点估计量。\n\
    \  - 标准误差较小的点估计量被认为比另一个具有**更大的相对有效性**。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_89_0.png)\n\
    \n- **Consistency（一致性）**：如果点估计量的取值随着样本量的增大而趋向于总体参数，则该点估计量是**一致的**。\n\n$$\\lim_{n\\\
    to\\infty}P\\{\\hat{\\theta}=\\theta\\}=1.$$\n\n- 样本均值 $\\bar{x}$ 是否是 $\\mu$ 的一致且无偏估计量？\n\
    \  - 例如：$E(\\bar{x})=\\mu$；$\\bar{x}$ 是一个一致估计量。回想一下 $\\sigma_{\\bar{x}}=\\frac{\\\
    sigma}{\\sqrt{n}}$。\n  - 我们得出结论，更大的样本量倾向于提供更接近总体均值 $\\mu$ 的点估计。\n\n## Summary\n\
    \n1. Introduction\n2. Sampling Method\n3. Point Estimation and Sampling Distributions\n\
    4. Summary\n\n### Method 2: Stratified random sampling\n\n- 假设该学校学生由一年级、二年级、三年级、四年级、五年级、六年级这六个年级组成，且每个年级的学生数为1500人。\n\
    - Then in each grade, select 200 students using simple random sampling.\n\n###\
    \ Method 3: Cluster sampling\n\n- 假设该学校由60个学院组成，每个学院150人。\n- Then select 8 schools\
    \ using simple random sampling.\n- Note: All the students in selected classes\
    \ belong to the sample.\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_93_0.png)\n\
    \n*Figure: Stratified random sampling and Cluster sampling*\n\n### Step 2: Point\
    \ Estimation\n\n- Estimate the mean $\\mu$ of rating and the proportion $p$ that\
    \ rating is higher than 6.\n\n**Estimator for $\\mu$**\n\n- Sample mean $\\bar{x}\
    \ = \\frac{\\Sigma \\text{rating}(x_i)}{n} = 6.1$\n\n**Estimator for $p$**\n\n\
    - Sample proportion $\\hat{p} = \\frac{\\Sigma X_i}{n} = 0.61$, where $X_i = 1$\
    \ if $x_i \\geq 6$ and $0$ otherwise.\n\n| sample id | rating $(x_i)$ | $X_i$\
    \ |\n|---|---|---|\n| 1 | 7 | 1 |\n| 2 | 8 | 1 |\n| 3 | 8 | 1 |\n| 4 | 6 | 1 |\n\
    | 5 | 5 | 0 |\n| ... | ... | ... |\n| 1200 | 4 | 0 |\n\n### Step 3: Use sampling\
    \ distribution to justify the precision of estimator\n\nSuppose a priori belief\
    \ about rating is that $\\mu = 6$, $\\sigma = \\sqrt{3}$, $n=1200$.\n\n**Precision\
    \ for $\\mu$**\n\n$E(\\bar{x})=\\mu=6$; $\\sigma_{\\bar{x}} = \\sigma/\\sqrt{n}\
    \ = 1/20$.\n\nThe probability that $|\\bar{x} - \\mu| \\leq 0.1$ is\n\n$$\\Pr(5.9\
    \ \\leq \\bar{x} \\leq 6.1)\n= \\Pr\\left\\{\\frac{5.9 - E(\\bar{x})}{\\sigma_{\\\
    bar{x}}} \\leq \\frac{\\bar{x} - E(\\bar{x})}{\\sigma_{\\bar{x}}} \\leq \\frac{6.1\
    \ - E(\\bar{x})}{\\sigma_{\\bar{x}}}\\right\\}\n\\approx \\Phi(2) - \\Phi(-2)\
    \ \\approx 0.9544$$\n\nThe probability that sampling error is less than $0.1$\
    \ is $95.44\\%$.\n\nSuppose a priori belief about proportion that rating is higher\
    \ than 6 is $p = 0.6$.\n\n**Precision for $p$**\n\n$E(\\bar{p}) = p = 0.6$; $\\\
    sigma_{\\bar{p}} = \\sqrt{\\frac{p(1-p)}{n}} \\approx 0.014$.\n\nThe probability\
    \ that $|\\bar{p} - p| \\le 0.01$ is\n\n$$\\Pr(0.59 \\le \\bar{p} \\le 0.61)\n\
    = \\Pr\\left\\{\\frac{0.59 - E(\\bar{p})}{\\sigma_{\\bar{p}}} \\le \\frac{\\bar{p}\
    \ - E(\\bar{p})}{\\sigma_{\\bar{p}}} \\le \\frac{0.61 - E(\\bar{p})}{\\sigma_{\\\
    bar{p}}}\\right\\}\n\\approx \\Phi(0.714) - \\Phi(-0.714) \\approx 0.5222$$\n\n\
    The probability that sampling error is less than $0.01$ is only $52.22\\%$. If\
    \ the probability cannot meet the expectation, try to increase sample size.\n\n\
    ### Take-aways\n\n1. Sampling is unavoidable and will induce sampling error.\n\
    2. To reduce sampling error, we need to choose the reasonable sampling method.\n\
    3. Generally, simple random sampling is predominant for estimation.\n4. Under\
    \ simple random sampling (i.i.d.), $E(\\bar{x}) = \\mu$ and $E(\\hat{p}) = p$.\
    \ Moreover, $\\bar{x}$ and $\\hat{p}$ are unbiased and consistent estimators.\n\
    5. When sample size is large, sampling distribution can be approximated well by\
    \ normal distribution and the sampling error is minor.\n\n## BUSS2302: Business\
    \ Statistics\n\n### Lecture 3: Interval Estimation\n\nInstructor: Tingting SONG\
    \ (宋婷婷)\n\nAntai College of Economics and Management\nShanghai Jiao Tong University\n\
    \nTextbook: [1] Chapter 8, *Statistics for Business and Economics*, 13e, by Anderson,\
    \ Sweeney, Williams, Camm, and Cochran (2018).\n\n"
