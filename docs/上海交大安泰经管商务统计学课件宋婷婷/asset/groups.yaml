    \ 785.11$, $df_{TR} = 3 - 1$\n  - $\\mathrm{MSTR} = 785.11/(3 - 1) = 392.56$\n\
    - **Mean Squares Due to Blocks (MSBL)**\n  - $\\mathrm{SSBL} = \\sum_{i=1}^{5}\
    \ \\sum_{j=1}^{3} \\sum_{m=1}^{M_i} (\\bar{x}_{i.} - \\bar{x})^2 = 44.00$, $df_{BL}\
    \ = 5 - 1$\n  - $\\mathrm{MSBL} = 44.00/(5 - 1) = 11.00$\n- **Mean Squares Due\
    \ to Error (MSE)**\n  - $\\mathrm{SST} = \\sum_{i=1}^{5} \\sum_{j=1}^{3} \\sum_{m=1}^{M_i}\
    \ (x_{ijm} - \\bar{x})^2 = 2118.31$, $df_T = 417 - 1$\n  - $\\mathrm{SSE} = \\\
    mathrm{SST} - \\mathrm{SSTR} - \\mathrm{SSBL} = 1289.19$, $df_E = df_T - df_{TR}\
    \ - df_{BL} = 410$\n  - $\\mathrm{MSE} = 1289.19/410 = 3.14$\n\n- **Test Statistics**\n\
    \  - $F = \\mathrm{MSTR}/\\mathrm{MSE} = 392.56/3.14 = 124.84$\n\n### ANOVA Table\n\
    \n| Source of Variation | Sum of Squares | Degrees of Freedom | Mean Square |\
    \ F | P-value | F crit |\n|---|---|---|---|---|---|---|\n| Treatments | 785.11\
    \ | 2 | 392.56 | 124.84 | 4.54E-43 | 3.02 |\n| Blocks | 44.00 | 4 | 11.00 |  |\
    \  |  |\n| Error | 1289.19 | 410 | 3.14 |  |  |  |\n| Total | 2118.31 | 416 |\
    \  |  |  |  |\n\n- **Rejection Rule**\n  - p-value Approach: Reject $H_0$ if p-value\
    \ $\\le .05$\n  - Critical Value Approach: Reject $H_0$ if $F \\ge 3.02$, where\
    \ the value of $F_{.05} = 3.02$ is based on an F distribution with 2 numerator\
    \ d.f. and 410 denominator d.f.\n\n- **Conclusion**\n  - With $F = 124.84$, we\
    \ reject $H_0$ and conclude that there is a significant difference between the\
    \ students’ evaluations of the three dining halls.\n\n## Other Related Designs\n\
    \n- RBD reduces the residual error in an experiment by removing variability due\
    \ to a single known and controllable nuisance variable.\n- There are several other\
    \ types of designs that utilize the blocking principle:\n  - Latin Square Design\
    \ (blocking 2 nuisance variables)\n  - Graeco-Latin Square Design (blocking 3\
    \ nuisance variables)\n- The RBD we have learnt is indeed a Randomized Complete\
    \ Block Design, in which each block contains all the treatments.\n- Sometimes\
    \ it is not possible to run all the treatments in each block.\n  - Randomized\
    \ Incomplete Block Designs (balanced/unbalanced)\n"
  mdcn: "\n\n## 随机化区组设计：方差分析\n\n- 随机化区组设计（RBD）的模型形式如下\n\n$$x_{ij}=\\mu+\\alpha_j+\\\
    beta_i+\\epsilon_{ij},\\quad j=1,\\ldots,k;\\ i=1,\\ldots,b$$\n\n其中，$x_{ij}$ 是第\
    \ $i$ 个区组中第 $j$ 个处理的观测值，$n_T=kb$。\n\n- 总平方和（SST）被分解为三部分：处理平方和（SSTR）、区组平方和（SSBL）和误差平方和（SSE）。\n\
    \n$$\\mathrm{SST}=\\mathrm{SSTR}+\\mathrm{SSBL}+\\mathrm{SSE}$$\n\n- 总自由度 $n_T-1$\
    \ 的分解方式为：处理占 $k-1$ 个自由度，区组占 $b-1$ 个自由度，误差项占 $(k-1)(b-1)$ 个自由度。\n\n## 随机化区组设计：方差分析表\n\
    \n| 变异来源 | 平方和 | 自由度 | 均方 | F | p 值 |\n|---|---|---|---|---|---|\n| 处理 | SSTR\
    \ | $k - 1$ | $\\mathrm{MSTR} = \\mathrm{SSTR} / (k - 1)$ | $\\mathrm{MSTR} /\
    \ \\mathrm{MSE}$ |  |\n| 区组 | SSBL | $b - 1$ | $\\mathrm{MSBL} = \\mathrm{SSBL}\
    \ / (b - 1)$ |  |  |\n| 误差 | SSE | $(k - 1)(b - 1)$ | $\\mathrm{MSE} = \\mathrm{SSE}\
    \ / [(k - 1)(b - 1)]$ |  |  |\n| 总计 | SST | $n_T - 1$ |  |  |  |\n\n- $\\mathrm{SST}\
    \ = \\sum_{i=1}^{b} \\sum_{j=1}^{k} (x_{ij} - \\bar{x})^2$\n- $\\mathrm{SSTR}\
    \ = \\sum_{i=1}^{b} \\sum_{j=1}^{k} (\\bar{x}_j - \\bar{x})^2 = b \\sum_{j=1}^{k}\
    \ (\\bar{x}_j - \\bar{x})^2$\n- $\\mathrm{SSBL} = \\sum_{i=1}^{b} \\sum_{j=1}^{k}\
    \ (\\bar{x}_i - \\bar{x})^2 = k \\sum_{i=1}^{b} (\\bar{x}_i - \\bar{x})^2$\n-\
    \ $\\mathrm{SSE} = \\sum_{i=1}^{b} \\sum_{j=1}^{k} (x_{ij} - \\bar{x}_i - \\bar{x}_j\
    \ + \\bar{x})^2 = \\mathrm{SST} - \\mathrm{SSTR} - \\mathrm{SSBL}$\n\n## 示例：关于食堂的调查——分析\n\
    \n- **目标**：在排除不同班级所带来的误差后，检验学生对三个食堂的评价是否存在显著差异。\n- **区组**：由于同一区组内条件具有同质性，我们可以将一个班级视为一个区组。\n\
    - 设 $X_{ijm}$ 为第 $i$ 个区组（班级）中第 $j$ 个食堂的第 $m$ 名学生的评价，其中 $i = 1,2,\\cdots,5$；$j\
    \ = 1,2,3$；$m = 1,2,\\cdots,M_i$。\n\n**数据表（保留两位小数）：** 处理（食堂）\n\n| 区组（班级） | 处理\
    \ 1 | 处理 2 | 处理 3 | 区组均值 | 学生人数 |\n|---|---|---|---|---|---|\n| 1 | $x_{111},\\\
    ldots,x_{11M_1}$ | ... | ... | 6.65 | 33 |\n| 2 | ... | ... | ... | 6.40 | 16\
    \ |\n| 3 | ... | ... | ... | 7.23 | 45 |\n| 4 | ... | ... | ... | 7.24 | 27 |\n\
    | 5 | ... | ... | ... | 6.95 | 21 |\n| 处理均值 | 5.09 | 7.61 | 8.22 |  |  |\n\n-\
    \ **处理的均方**\n  - $\\mathrm{SSTR} = 139 \\sum_{j=1}^{3} (\\bar{x}_j - \\bar{x})^2\
    \ = 139(5.05 - 6.96)^2 + 139(7.61 - 6.96)^2 + 139(8.22 - 6.96)^2 = 785.11$，$df_{TR}\
    \ = 3 - 1$\n  - $\\mathrm{MSTR} = 785.11/(3 - 1) = 392.56$\n- **区组的均方（MSBL）**\n\
    \  - $\\mathrm{SSBL} = \\sum_{i=1}^{5} \\sum_{j=1}^{3} \\sum_{m=1}^{M_i} (\\bar{x}_{i.}\
    \ - \\bar{x})^2 = 44.00$，$df_{BL} = 5 - 1$\n  - $\\mathrm{MSBL} = 44.00/(5 - 1)\
    \ = 11.00$\n- **误差的均方（MSE）**\n  - $\\mathrm{SST} = \\sum_{i=1}^{5} \\sum_{j=1}^{3}\
    \ \\sum_{m=1}^{M_i} (x_{ijm} - \\bar{x})^2 = 2118.31$，$df_T = 417 - 1$\n  - $\\\
    mathrm{SSE} = \\mathrm{SST} - \\mathrm{SSTR} - \\mathrm{SSBL} = 1289.19$，$df_E\
    \ = df_T - df_{TR} - df_{BL} = 410$\n  - $\\mathrm{MSE} = 1289.19/410 = 3.14$\n\
    \n- **检验统计量**\n  - $F = \\mathrm{MSTR}/\\mathrm{MSE} = 392.56/3.14 = 124.84$\n\
    \n### 方差分析表\n\n| 变异来源 | 平方和 | 自由度 | 均方 | F | P 值 | F 临界值 |\n|---|---|---|---|---|---|---|\n\
    | 处理 | 785.11 | 2 | 392.56 | 124.84 | 4.54E-43 | 3.02 |\n| 区组 | 44.00 | 4 | 11.00\
    \ |  |  |  |\n| 误差 | 1289.19 | 410 | 3.14 |  |  |  |\n| 总计 | 2118.31 | 416 | \
    \ |  |  |  |\n\n- **拒绝法则**\n  - p 值法：若 p 值 $\\le .05$，则拒绝 $H_0$\n  - 临界值法：若 $F\
    \ \\ge 3.02$，则拒绝 $H_0$；其中 $F_{.05} = 3.02$ 基于分子自由度为 2、分母自由度为 410 的 F 分布。\n\n-\
    \ **结论**\n  - 由于 $F = 124.84$，我们拒绝 $H_0$，并得出结论：学生对三个食堂的评价存在显著差异。\n\n## 其他相关设计\n\
    \n- 随机化区组设计通过消除一个已知且可控的干扰变量所带来的变异性，来降低实验中的残余误差。\n- 还有其他几种利用区组原则的设计类型：\n  - 拉丁方设计（对\
    \ 2 个干扰变量进行区组化）\n  - 希腊拉丁方设计（对 3 个干扰变量进行区组化）\n- 我们所学到的随机化区组设计实际上是随机化完全区组设计，即每个区组包含所有处理。\n\
    - 有时在每个区组中实施所有处理是不可能的。\n  - 随机化不完全区组设计（平衡/非平衡）\n\n"
