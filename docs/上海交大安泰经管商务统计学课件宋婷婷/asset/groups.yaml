    \ parametric test.\n\nIf you ONLY have qualitative data, the nonparametric test\
    \ may be the only choice.\n\n## Sign Test: Testing for a Population Median\n\n\
    - The Lawler Grocery Store chain made the decision to carry a new potato chip\
