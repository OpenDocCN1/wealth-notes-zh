    # Necessary Ingredients


    Necessary ingredients for running useful A/B tests:


    +   - 互不干扰： There are experimental units (e.g., users) that can be assigned to
    different variants with no interference (or little interference)


    +   - 有足够多实验单元： There are enough experimental units (e.g., users)


    +   - 关键指标： Key metrics, ideally an OEC, are agreed upon and can be practically
    evaluated


    +   - 改变易实现： Changes are easy to make'
