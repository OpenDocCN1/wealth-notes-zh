    # Summary


    +   Suppose a priori belief about proportion that rating is higher than 6 is p
    = 0.6.


    +   Precision for p

    +   E(\bar{p}) = p = 0.6; \sigma_{\bar{p}} = \sqrt{\frac{p(1-p)}{n}} \approx 0.014.

    +   The probability that |\bar{p} - p| \le 0.01 is

    +   Pr {0.59 \le \bar{p} \le 0.61}

    +   = Pr \left\{ \frac{0.59 - E(\bar{p})}{\sigma_{\bar{p}}} \le \frac{\bar{p}
    - E(\bar{p})}{\sigma_{\bar{p}}} \le \frac{0.61 - E(\bar{p})}{\sigma_{\bar{p}}}
    \right\}

    +   \approx \Phi(0.714) - \Phi(-0.714) \approx 0.5222


    +   The probability that sampling error is less than 0.01 is only 52.22%. If the
    probability cannot meet the expectation, try to increase sample size.'
