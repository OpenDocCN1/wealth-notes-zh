  - '[PAGE 436]


    # Wilcoxon Signed-Rank Test


    +   - The [Wilcoxon signed-rank test](#) is a procedure for analyzing data from
    a matched samples experiment.

    +   - The test uses quantitative data but does not require the assumption that
    the differences between the paired observations are normally distributed.

    +   - It only requires the assumption that the differences have a *symmetric*
    distribution.

    +   - This occurs whenever the shapes of the two populations are the same and
    the focus is on determining if there is a difference between the two populations’
    medians.'
  - '[PAGE 437]


    # Example


    +   - A manufacturing firm is attempting to determine whether two production methods
    differ in terms of task completion time.

    +   - The hypotheses:

    +     H₀ : medianₐ = medianᵦ, versus Hₐ : medianₐ ≠ medianᵦ

    +   - The level of significance is set to be α = 0.05.

    +   - 11 randomly selected workers completed the production task two times, once
    using method A and once using method B.

    +   - The method that the worker used first was randomly selected.'
