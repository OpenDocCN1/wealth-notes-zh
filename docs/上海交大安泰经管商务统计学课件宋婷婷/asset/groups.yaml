    \ constructed by the sample means within \\(\\mu \\pm z_{\\alpha/2}\\sigma_{\\\
    bar{x}}\\) will include the population mean \\(\\mu\\).\n  - \\(100(1-\\alpha)\\\
    %\\) of all the intervals constructed using \\(\\bar{x}\\pm z_{\\alpha/2}\\sigma_{\\\
