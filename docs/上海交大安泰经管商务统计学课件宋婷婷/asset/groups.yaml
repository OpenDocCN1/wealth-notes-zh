  - "[PAGE 280]\n\n# ANOVA: A Graphic Interpretation\n\n+   - Given observations of\
    \ sample means, how to determine if they come from Model 1 or Model 2?\n+   \n\
    +   - **Basic idea:** When the **variation between the sample means** is large,\
    \ then Model 1 ($H_0$) is more likely to be rejected.\n+   \n+   - **Question:**\
    \ What is the benchmark for comparison?\n+   \n+   - The benchmark for comparison\
    \ is the **variation within each group**.\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_280_0.png)\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_280_1.png)\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_280_2.png)"
  - "[PAGE 281]\n\n# ANOVA: Summary\n\n+   - The goal of ANOVA is to split the **total\
    \ variation** of a set of observations into **different** sources, such as\n+\
    \     - Treatment adjustments αj (One-way ANOVA, Two-way ANOVA)\n+     - Error\
    \ terms εij (Benchmark under the H0)\n+   - Between-group Variance: Treatment\
    \ adjustments αj + Error term εij\n+   - Within-group Variance: Error terms εij\n\
    +   - It motivates us to construct a **test statistic** as a variability ratio\n\
    +   \n+     **Between-group Variance** (组间离差)\n+     -----------------------------\n\
    +     **Within-group Variance** (组内离差)\n+   \n+     and reject H0 if this ratio\
    \ is sufficiently large.\n+   - To formalize this idea, we shall introduce some\
    \ assumptions and terminologies from the field of **Design of Experiments**."
  - "[PAGE 282]\n\n# Assumptions of ANOVA\n\n+   - **Normality:** For each population,\
