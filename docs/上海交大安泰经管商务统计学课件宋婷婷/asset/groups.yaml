  - '[PAGE 201]


    # Motivations: Effluent Monitoring (污水发测)


    +   - **Real problems:** Government wants to ensure that the effluent (处理过的污水)
    at a plant meets certain standards.

    +     - In addition to the average PH level, the variance in the reported PH levels
    was also reviewed.


    +   - **Based on the sample PH levels, we want to know:**

    +     - What is the (estimated) variance of the PH levels?

    +       - ⇒ Point estimator

    +     - What is the 95% confidence interval of the variance?

    +       - ⇒ Interval estimator

    +     - Whether this plant has a variance of a properly functioning plant?

    +       - ⇒ Hypothesis testing


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_201_0.png)'
