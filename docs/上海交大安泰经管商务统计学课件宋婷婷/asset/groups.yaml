  - '[PAGE 441]


    # Example


    +   - A company''s personnel director wants to determine if there are differences
    in the performance ratings among the managers who graduated from three colleges

    +   - The hypotheses are

    +     * H₀ : All populations are identical in terms of performance

    +     * Hₐ : Not all populations are identical in terms of performance

    +   - We will use a 0.05 level of significance for the test.

    +   - Independent samples of performance rating data are available'
  - '[PAGE 442]


    # The Procedure


    +   - Rank the combined data from the lowest to highest values; the tied values
    are assigned the average rank

    +   - Sum the ranks for each sample

    +   - We use the sum of the ranks to construct the test statistic


    | College A | Rank | College B | Rank | College C | Rank |

    |---:|---:|---:|---:|---:|---:|

    | 25 | 3 | 6 | 1 | 5 | 1 |

    | 70 | 12 | 20 | 2 | 70 | 12 |

    | 60 | 9 | 30 | 4 | 76 | 13 |

    | 85 | 17 | 45 | 6 | 80 | 14.5 |

    | 95 | 20 | 40 | 5 | 90 | 18.5 |

    | 90 | 18.5 | 35 | 3 | 70 | 12 |

    | 80 | 14.5 | 50 | 7 | 75 | 14 |

    | **Sum of Ranks** | **95** | **Sum of Ranks** | **27** | **Sum of Ranks** | **88**
    |'
  - '[PAGE 443]


    # Sampling Distribution


    +   - Kruskal-Wallis test statistic


    $$H = \left[\frac{12}{n_T(n_T + 1)} \sum_{i=1}^{k} \frac{R_i^2}{n_i}\right] -
    3(n_T + 1)$$


    where $k$ is the number of populations, $n_i$ is the number of observations in
    sample $i$, $n_T$ is the total numbers of all the samples, and $R_i$ is the sum
    of the ranks for sample $i$


    +   - $H$ resembles the computing formula for SSTr in the ANOVA


    +   - If $H_0$ is true, the $H$ has approximately a $\chi^2_{k-1}$ distribution


    +   - In our example, $n_1 = 7$, $n_2 = 6$, $n_3 = 7$, and $n_T = 20$. Therefore
    we can calculate $H = 8.92$, and the p-value


    p-value $= P(\chi^2_2 \ge 8.92) = 0.0116 < \alpha$


    and we reject $H_0$.'
