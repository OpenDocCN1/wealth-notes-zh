  - '[PAGE 63]


    # Sampling Category


    Probability sampling: The element in population has an equal chance of getting
    sampled.


    +   - Simple random sampling (简单随机抽样)

    +   - Stratified random sampling (分层随机抽样)

    +   - Cluster sampling (整支抽样化聚簇抽样)

    +   - Systematic sampling (系统)


    Non-probability sampling (非概率): The element in population is based on the subjective
    judgment or convenience of the researcher rather than random selection.


    +   - Convenience Sampling: by convenience

    +   - Judgment Sampling: by expertise'
  - '[PAGE 64]


    # Simple Random Sampling


    Simple Random Sampling: Given sample size n and population size N, each possible
    sample of size n has the same probability of being selected.


    Example (美纸纸纸): 假设该行校为 乱三9000复学生，我们想从中抽取1200复学生，若概何在简单纯为抽样？


    +   1. Assign the students the numbers 1 to 9000.

    +   2. Generate a table of random numbers.

    +   3. Select random numbers from the table in groups of four digits.

    +   4. Discard the number if it is larger than 9000.


    See the following table for random numbers.'
  - '[PAGE 65]


    # Simple Random Sampling


    +   - We may start the selection of random numbers anywhere in the table and move
    systematically in a direction of our choice:

    +     - For example, we start from 9986 (i.e., the last four digits of the second
    number). It is greater than 9000 and is discarded.

    +   - Then, the following four digits (i.e., 7174) are smaller than 9000 and thus
    are selected.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_65_0.png)


    +   - Note: When we refer to simple random sampling, we will assume the sampling
    is without replacement.'
  - '[PAGE 66]


    # Simple Random Sampling


    +   - How about if the population is infinitely large?


    +   - 释义：概率我们在度打劳对百客四六行简单随机为抽样，百客的数量发格丸呢，那么我们可以随为抽取1200复百客?


    +   1. Each element must be selected comes from the same population

    +      - e.g., sampling from people who make a purchase as some may just come
    to use the restroom.


    +   2. Each element is selected independently

    +      - e.g., whenever a customer presented a discount coupon (randomly and independently
    of other customers), the next customer served was selected.'
  - '[PAGE 67]


    # Stratified Random Sampling (分层随机抽样)


    +   1. The elements in the population are first divided into groups called strata
    according to some features.

    +   2. After the strata are formed, a simple random sample is taken from each
    stratum.


