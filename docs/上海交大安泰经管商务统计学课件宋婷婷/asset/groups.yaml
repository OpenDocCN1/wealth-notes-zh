  - '[PAGE 138]


    # What We Want To Do


    +   - How "the Lady Tasting Tea" problem (hypothesis testing) relate to sample
    mean? x̄ → N(μ, σ²/n).

    +   - For hypothesis testing, we want to know

    +     - Hypothesis on what?

    +     - How to state a hypothesis?

    +     - How to conduct tests?

    +     - How to judge testing results?

    +     - How to reach a meaning conclusion?'
  - '[PAGE 139]


    # Hypothesis Testing


    +   - A **hypothesis** is a statement about the **population**.

    +     - Population mean \(\mu\)

    +     - Population variance \(\sigma^2\)

    +     - Population distribution (normality)


    +   - **Hypothesis testing** is a procedure based on **sample evidence** and **probability
    theory** to determine whether the hypothesis is a **reasonable statement**.


    +   - Basic steps of hypothesis testing

    +     1. State the hypothesis.

    +     2. Select a level of significance.

    +     3. Identify the test statistic.

    +     4. Formulate a decision rule.

    +     5. Take a sample, and arrive at decision.'
  - '[PAGE 140]


    # A Quick Overview of Hypothesis Testing


    # Step 1: State the hypotheses


    +   - **Two complementary statements** in the hypothesis testing

    +     - **Null hypothesis (原假设)** $H_0$: a statement which you want to challenge
    (想拒绝)

    +     - **Alternative hypothesis (标杆假设)** $H_a$: a statement which you hope to
    support (想是了)


    +   - There is usually a **not** or a **no** term in the null hypothesis.

    +     - In the Lady Tasting Tea, $H_0$: She can **NOT** distinguish the sequence
    of milk and tea.

    +     - In the COVID-19, $H_0$: The person does **NOT** have coronavirus.


    +   - **Two results:**

    +     - **Reject**: the sample provide convincing evidence that it is false. What
    is the Conclusion?

    +       ⇒ The **alternative hypothesis**: what you conclude if you reject the
    null.

    +     - **Fail to reject**: DON''T mean the hypothesis is **True**.'
