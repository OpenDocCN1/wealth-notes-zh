  mdcn: "\n\n## 示例：正态分布的拟合优度检验\n\n- 本科英语水平测试的成绩是否服从正态分布？\n- 随机抽取的 50 名学生的成绩样本：\n\n\
    | 71 | 65 | 86 | 54 | 56 | 63 | 61 | 73 | 65 | 58 |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | 60 | 77 | 63 | 56 | 76 | 65 | 60 | 76 | 56 | 64 |\n| 55 | 61 | 79 | 84 | 56\
    \ | 70 | 74 | 53 | 93 | 79 |\n| 82 | 79 | 80 | 61 | 90 | 62 | 80 | 61 | 73 | 65\
    \ |\n| 85 | 66 | 62 | 70 | 64 | 68 | 54 | 76 | 54 | 71 |\n\n- x̄ = 68.42, s =\
    \ 10.41\n- 假设：\n  - H₀：总体不偏离均值为 68.42、标准差为 10.41 的正态分布\n  - Hₐ：总体与均值为 68.42、标准差为\
    \ 10.41 的正态分布不同\n\n## 拟合优度检验：正态分布\n\n- 我们也可以使用卡方检验对正态分布进行拟合优度检验。\n- **基本思想**：连续值样本数据\
    \ ⇒ 离散类别。\n- 在我们的例子中，我们可以将正态分布划分为 10 个等概率区间（样本量 = 50，每个区间的期望频数为 5）。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_257_0.png)\n\
    \n- 如何确定这些区间的端点？\n- 一般来说，定义 *k* 个值区间，使得每个区间的期望频数至少为 5。\n- 计算检验统计量的值。\n\n$$\\chi^2\
    \ = \\sum_{i=1}^{k} \\frac{(f_i-e_i)^2}{e_i}$$\n\n**注意：** 检验统计量服从自由度为 *k − p −\
    \ 1* 的卡方分布，其中 *p* 为样本估计的参数个数。在我们的例子中，*p = 2*。\n\n- **拒绝规则：**\n  - *p*-值方法：如果 *p*-值\
    \ ≤ α，则拒绝 $H_0$。\n  - 临界值方法：如果 $\\chi^2 > \\chi^2_{\\alpha,k-p-1}$，则拒绝 $H_0$。\n\
    \n## 卡方检验总结\n\n- 我们已介绍了几种基于卡方分布的假设检验。\n- 检验统计量：\n  - χ² = Σ (观察频数 − 期望频数)² / 期望频数\n\
    - 自由度：\n  - （1）检验 k 个总体的总体比例是否相等（自由度 = k − 1）\n  - （2）检验两个分类变量是否独立（自由度 = (n −\
    \ 1)(m − 1)）\n  - （3）检验总体概率分布是否服从多项分布（自由度 = k − 1）或正态分布（自由度 = k − 3）\n\n## 回顾统计推断的内容\n\
    \n### 均值估计\n\n1. 生活中的现实问题 ⇒ 能够度量什么和检验的问题。\n   - 均值：交大美食评价，生产率，生产效率\n   - 比例：女士品茶，人口比例\n\
    2. 通过随机抽样(Random Sample)获得代表性样本。\n   - 整理数据\n   - 假设显著性检验\n3. 构造均值估计量和检验统计量\n\
