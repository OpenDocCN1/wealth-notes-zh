    \n  \\[\n  z = \\frac{\\bar{x} - \\mu_0}{\\sigma/\\sqrt{n}}\n  \\]\n\n  给出，其中\
    \ \\(\\bar{x}\\) 为样本均值。\n\n  - 基于 \\(z\\) 统计量的检验程序通常称为 **Z 检验**。\n  - 在 \\(H_0\\\
    ) 下，\\(z\\) 的分布已知：\\(z \\sim N(0,1)\\)。\n\n- **步骤 4：** 确定拒绝规则的两种方法：\n  - 临界值法\n\
