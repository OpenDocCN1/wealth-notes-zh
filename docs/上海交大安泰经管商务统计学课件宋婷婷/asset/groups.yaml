    chi^2_{(1-\\alpha)}\\) to be the \\(\\alpha\\)-quantile of the chi-square distribution\n\
    \n- Then there is a \\((1-\\alpha)\\) probability such that\n\n\\[\n\\chi^2_{(1-\\\
    alpha/2)} \\leq \\frac{(n-1)s^2}{\\sigma^2} \\leq \\chi^2_{\\alpha/2}\n\\]\n\n\
    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_203_0.png)\n\n- Performing algebraic\
    \ manipulation, we get **interval estimator** for variance\n\n\\[\n\\frac{(n-1)s^2}{\\\
