  - '[PAGE 16]


    # Big data ⇒ Statistics


    +   - Big data is about **smart statistics and analytics**.

    +   - WHY?

    +     - **Volume**

    +     - **Velocity**

    +     - **Variety**


    +   - **What can big data do?** Hold great promises for understanding

    +     - **Commonality:** in the presence of large variations (noises)

    +     - **Heterogeneity:** personalized services.


    +   - They have huge impacts on

    +     - **System:** storage, communication, computation architectures

    +     - **Analysis:** statistics, computation, optimization'
  - '[PAGE 17]


    # Before this class, you may think statistics is . . .


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_17_0.png)


    +   Statistics (统计资料) can refer to numerical facts such as averages, medians,
    percentages, and maximums that help us understand a variety of public health,
    business and economic situations.'
  - '[PAGE 18]


