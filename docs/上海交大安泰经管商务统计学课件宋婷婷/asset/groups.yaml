    \  - 对方向构件验：单方自，双方向\n\n- 4. 从结果到决策：运行A/B之试构向指标该构策数硼，分析数硼，进\n  问题解决策\n  - 用欲窗会计显南大构梁果与，进背步思有方效构整本\n\
    \  - 会计器构想（厚泽程度）\n\n## 案例故事：扩大征行共鸣力\n故事云\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_396_0.png)\n\
    \n- 1. 怎么实现目标？区了证征行共鸣力，如果没设计了主推H5并\n- 2. 确定随机化单元：用样本页形中可该页全都以作构抗（与宣件处理相关）\n- 3.\
    \ 关键指标：成全累录与可被分图接分享了发月该领取现礼包包外\n\n● 主推上述主推进行A/B之试构OEC、参数一变体？\n\n## 餐功效率：扩大征行共鸣力\n\
    做如果云\n\n- 4. 变体：做如果云远<|start|>出了两鸣皇迎迎似：\n  - 现科荐引\n    - e.g. 下发到列多少师，习也份各多少师！\n\
    \    - 认它容包格举力重，机用现科举等引用排源要分享异\n  - 等表用标\n    - e.g. 认它区行街地把地守守，减引被的直把地守守少师\n\
    \    - 皇议区所行布大·通到列共源共用用排主指分享异\n\n5. 实验各本量二进行直时：做如果云通过A/B之试校南分出小流重进行两鸣迎迎皇构快试试则\n"
  mdcn: "\n\n## 成功案例：Netflix（大规模挑战）\n\n- 作为流媒体服务的代表，Netflix 在 A/B 测试领域是先行者之一。它通过基础设计、个性化主页、推荐算法等途径进行\
    \ A/B 测试。\n- Netflix 构建的 A/B 测试体系能够评估不同剧集封面、界面元素等对点击率的影响。\n\n![实验结果示意图](image)\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_385_1.png)\n\n- 在《The Short Game》的测试中，Netflix\
    \ 为不同用户组提供了不同的封面图。\n- 最终发现，Cell 2 的封面效果最好，实验组的点击率较对照组高出 14%。\n- 该实验证明了封面图片对用户行为能够产生显著影响。\n\
    \n## 成功案例：主页信息流评分案例\nNetflix（个性化推荐评分）\n\n- 随着 Netflix 进行**直接反馈**、**多维度构建**的试验来优化用户体验：\n\
    \  - 具有视觉吸引力的封面和图片更容易引发用户点击；\n  - 具有推荐精准度或个性化的内容展示效果更好；\n  - 减少用户流失，带来更高的点击率；\n\
    \  - 对于包含过多或冗长文本的标题，点击率往往下降……\n\n- 这些实验结果也具有绝对的参考价值，**不同地区**的观众对图片的反应会产生差异，这需要**紧密**地管理实验与运营。\n\
    \n- A/B 测试是在全体用户中开展数据驱动实验的方式，**要评估每一个元素，同时尽量减少其他因素对结果的干扰**，从而从每次实验中得出关于用户行为的评价。\n\
    \n⇒ A/B 测试能够用大数据实现**主页优化与规模化增长**。\n\n## 成功案例：其他行业\n\n- 流媒体服务部门利用 A/B 测试来迭代产品，并发现了显著的提升作用。\n\
    - 除了流媒体，A/B 测试也可用于游戏、排版、科研等行业的内容。\n  - 艺电（Electronic Arts）通过 A/B 测试设计模式、角色销售和广告投放，在市场上从数百万用户中选出了\
    \ 3 个表现最佳的设计，带来了约 110 万的收益提升。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_387_0.png)\n\
    \n- 《纽约时报》也通过 A/B 测试，针对不同地域、不同文章标题和配图进行优化，从而大幅提升阅读量：\n  1. 更新页面布局，提升全年订阅量；\n \
    \ 2. 标题与配图的设计也会影响用户的阅读行为（例如点击率变化）。\n\n- 诸如“买赠码券”、“车载设计”等用户体验，能够在上线前通过测试得到验证。\n\
    - A/B 测试帮助全面验证了策略制定、广告设计等所带来的实际影响，其带来的收益远大于测试所付出的成本。\n\n## 成功案例：政治选举\n\n- 不仅在企业中，A/B\
    \ 测试还应用到了政治运动中。\n- 2008 年，奥巴马竞选团队设计了 4 个按钮 × 6 种不同设计，共 24 种不同组合，并进行了大量测试。\n\n\
    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_388_0.png)\n\n## 成功故事：政治选举\n\n- 不仅普通业务，A/B\
    \ 测试也深入到了政治活动中。\n- 2008 年，奥巴马竞选团队设计了 4 种样式 × 6 个不同构图，共 24 种不同组合，并进行了大量测试。\n\n\
    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_389_0.png)\n\n- 最终，右上角的形象使注册率相比原始形象提高了\
    \ 40.6%，直接带来了额外约 6000 万美元的筹款。\n- 竞选团队的数据分析负责人丹·西罗克（Dan Siroker）在 2009 年创立了 A/B\
    \ 测试优化平台 Optimizely，帮助没有技术背景的用户测试不同版式设计，优化体验差异。\n\n## A/B 测试的术语\n\n- **总体评估指标（OEC）**：对实验目标的定量度量，也称为*响应变量或因变量*。\n\
    - **参数**：可控的实验变量，被认为会影响 OEC 或其他关注指标，有时也称为*因子或变量*。\n- **变体**：正在被测试的用户体验，通常通过为参数赋值来定义（*处理*）。\n\
    - **随机化单元**：对单元（如用户或页面）应用伪随机化过程，将其映射到不同变体（*实验单元*）。\n\n## 成功运行 A/B 测试的必要条件\n\n\
    - **互不干扰**：存在可被分配到不同变体且相互之间无干扰（或干扰很小）的实验单元（如用户）。\n- **有足够多的实验单元**：拥有足够的实验单元（如用户）。\n\
    - **关键指标**：确定关键指标（理想情况下是 OEC），并且这些指标可以在实践中被评估。\n- **改变容易实现**：改动易于实现。\n\n## 3.\
    \ A/B 测试的步骤\n\n- 摘要\n- 真实案例\n\n## A/B 测试的具体步骤\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_394_0.png)\n\
    \n- 0. 假设检验与指标判断\n  - A/B 实验分析的主要理论依据\n\n- 1. 设计 A/B 实验\n  - 如何确定目标？选择什么指标？是否需要控制变量？是否可行？\
    \ ⇒ OEC\n  - 确定随机化单元：\n    - 用户（互联网公司）\n    - 场景（医疗实验）\n    - 门店（零售实验）\n\n## A/B\
    \ 测试的具体步骤（续）\n\n- 1. 设计 A/B 实验\n  - 实验需要多大的样本量？\n    - 样本量取决于预期检测的最小效应量（注意第一类错误与第二类错误的权衡！）\n\
    \    - 直接凭经验确定样本量？→ 如果依赖经验，可能需要更多样本\n    - 全序分布成立，样本量越大，总效应越明显\n  - 实验需要运行多长时间？\n\
    - 2. 运行实验并收集数据（小范围试运行/监控）\n  - OEC 的计算\n    - 分组信息\n- 3. 分析结果\n  - 对假设进行检验：单假设、双假设、多假设（ANOVA）\n\
    \  - 对方向进行检验：单尾、双尾\n- 4. 从结果到决策：运行 A/B 测试后，根据指标体系进行数据分析，进而形成决策\n  - 使用置信区间评估显著的结果，并进一步思考有效的改进方案\n\
    \  - 评估业务影响（提升幅度）\n\n## 案例故事：扩大品牌影响力\n某云平台\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_396_0.png)\n\
    \n- 1. 如何实现目标？为了扩大品牌影响力，我们设计了主推 H5 页面。\n- 2. 确定随机化单元：用户访问页面时，页面的所有元素都可以作为实验对象（与交互处理相关）。\n\
    - 3. 关键指标：成单量、分享次数、领取礼包的用户数量等。\n\n● 思考：针对上述主推 H5 进行 A/B 测试，OEC、参数、变体是什么？\n\n##\
    \ 成功案例：扩大品牌影响力\n某云平台\n\n- 4. 变体：某云平台设计了两种方案：\n  - 激励型推荐\n    - 例如：每邀请一位好友，双方各得\
    \ XX 元奖励！\n    - 让用户更容易获得奖励，利用激励机制引导用户分享。\n  - 关系链推荐\n    - 例如：结合地理位置和社交关系链，让分享更自然；\n\
    \    - 基于用户所在地区生成专属分享海报，引导用户分享。\n\n5. 实验样本量与时间：某云平台通过 A/B 测试，将一小部分流量用于两个方案的快速测试。\n\
    \n"
