  - '[PAGE 22]


    # Applications in Business & Economics


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_22_0.png)


    +   - **Accounting (会计)**: Public accounting firms use *statistical sampling procedures*
    when conducting audits for their clients.

    +   - **Finance (金融)**: Financial analysts use a variety of *statistical information*
    to guide their investment recommendations.

    +   - **Economics (经济学)**: Economists use *statistical information* in making
    forecasts about the future of the economy or some aspect of it.'
