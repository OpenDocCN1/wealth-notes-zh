  - '[PAGE 61]


    # Sampling Error


    +   - With **proper sampling** methods, the **sample results** will provide “good”
    estimates of the population parameters.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_61_0.png)


    +   - In other words, we want to minimize the sampling error.'
  - '[PAGE 62]


