- raw:
  - '[PAGE 325]


    # Factorial Experiment (析因实验)


    +   - In some experiments we want to draw conclusions about more than one variable
    or factor.

    +   - Factorial experiments and their corresponding ANOVA computations are valuable
    designs when simultaneous conclusions about two or more factors are required.

    +   - The term factorial is used because the experimental conditions include all
    possible combinations of the factors.

    +   - For example, for a levels of factor A and b levels of factor B, the experiment
    will involve collecting data on ab treatment combinations.'
  - '[PAGE 326]


    # Main Effect and Interaction


    +   - The **main effect** of a factor: The change in response produced by a change
    in the level of the factor.

    +   - The **interaction** between the factors: In some experiments, we may find
    the change in response between levels of one factor is **NOT** the same at all
    levels of the other factors.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_326_0.png)'
  - '[PAGE 327]


    # Advantage of Factorials


    +   - Suppose we have two factors A and B, each at two levels

    +   - A one-factor-at-a-time design

    +     - a total of 6 (3×2) observations are required to estimate the effects of
    2 factors

    +     - conclusion on interaction may be seriously in error

    +   - A 2-factor factorial design

    +     - a total of 4 observations are required

    +     - effects of a factor can be estimated at several levels of other factors

    +     - interaction can be studied


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_327_0.png)'
  - '[PAGE 328]


    # Two-Factor Factorial Experiment: Arrangement


    | Factor A \ Factor B | 1 | 2 | ... | b |

    |---|---|---|---|---|

    | 1 | $x_{111}, x_{112}, \ldots, x_{11r}$ | $x_{121}, x_{122}, \ldots, x_{12r}$
    | ... | $x_{1b1}, x_{1b2}, \ldots, x_{1br}$ |

    | 2 | $x_{211}, x_{212}, \ldots, x_{21r}$ | $x_{221}, x_{222}, \ldots, x_{22r}$
    | ... | $x_{2b1}, x_{2b2}, \ldots, x_{2br}$ |

    | ... | ... | ... | ... | ... |

    | a | $x_{a11}, x_{a12}, \ldots, x_{a1r}$ | $x_{a21}, x_{a22}, \ldots, x_{a2r}$
    | ... | $x_{ab1}, x_{ab2}, \ldots, x_{abr}$ |


    +   - $x_{ijk}$ has three dimensions:

    +     - Number of treatments in Factor A: $i = 1, \ldots, a$

    +     - Number of treatments in Factor B: $j = 1, \ldots, b$

    +     - Number of repetitions in each treatment: $k = 1, \ldots, r$'
  - "[PAGE 329]\n\n# Two-Factor Factorial Design: ANOVA\n\n+   - The ANOVA procedure\
    \ for the **two-factor** factorial experiment is similar to the completely randomized\
    \ experiment and the randomized block experiment.\n+   - The model takes the form\n\
    +   \n+     \\[\n+     x_{ijk}=\\mu+\\alpha_i+\\beta_j+(\\alpha\\beta)_{ij}+\\\
    epsilon_{ijk},\n+     \\]\n+   \n+     with \\(i=1,\\ldots,a\\), \\(j=1,\\ldots,b\\\
    ), and \\(k=1,\\ldots,r\\).\n+   - We again partition the sum of squares total\
    \ (SST) into its sources.\n+   \n+     \\[\n+     \\mathrm{SST}=\\mathrm{SSA}+\\\
    mathrm{SSB}+\\mathrm{SSAB}+\\mathrm{SSE}\n+     \\]\n+   - The total degrees of\
    \ freedom, \\(n_T-1\\), are partitioned as\n+   \n+     \\[\n+     n_T-1=(a-1)+(b-1)+(a-1)(b-1)+ab(r-1)\n\
    +     \\]"
  - '[PAGE 330]


    # Two-Factor Factorial Experiment: ANOVA Table


    | Source of Variation | Sum of Squares | Degrees of Freedom | Mean Square | F
    | p-Value |

    |---|---|---|---|---|---|

    | Factor A | SSA | a - 1 | MSA = SSA / (a - 1) | MSA / MSE | |

    | Factor B | SSB | b - 1 | MSB = SSB / (b - 1) | MSB / MSE | |

    | Interaction | SSAB | (a-1)(b-1) | MSAB = SSAB / [(a - 1)(b - 1)] | MSAB / MSE
    | |

    | Error | SSE | abr(r - 1) | MSE = SSE / [abr(r - 1)] | | |

    | Total | SST | n_r - 1 | | | |'
  - "[PAGE 331]\n\n# Two-Factor Factorial Experiment\n\n+   1. **Step 1**  Compute\
    \ the total sum of squares\n+   \n+      $$SST = \\sum_{i=1}^{a}\\sum_{j=1}^{b}\\\
    sum_{k=1}^{r}(x_{ijk}-\\bar{x})^2$$\n\n+   2. **Step 2**  Compute the sum of squares\
    \ for factor A\n+   \n+      $$SSA = br\\sum_{i=1}^{a}(\\bar{x}_{i\\cdot\\cdot}-\\\
    bar{x})^2 = \\sum_{i=1}^{a}\\sum_{j=1}^{b}\\sum_{k=1}^{r}(\\bar{x}_{i\\cdot\\\
    cdot}-\\bar{x})^2$$\n\n+   3. **Step 3**  Compute the sum of squares for factor\
    \ B\n+   \n+      $$SSB = ar\\sum_{j=1}^{b}(\\bar{x}_{\\cdot j\\cdot}-\\bar{x})^2\
    \ = \\sum_{i=1}^{a}\\sum_{j=1}^{b}\\sum_{k=1}^{r}(\\bar{x}_{\\cdot j\\cdot}-\\\
    bar{x})^2$$"
