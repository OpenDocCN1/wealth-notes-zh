  mdcn: "\n\n## 大数据 ⇒ 统计学\n\n- 大数据关乎**智能统计与分析**。\n- 为什么？\n  - **体量**\n  - **速度**\n\
    \  - **多样性**\n\n- **大数据能做什么？** 在理解以下方面拥有巨大前景：\n  - **共性：** 在存在大量变异（噪声）的情况下\n \
    \ - **异质性：** 个性化服务。\n\n- 它们对以下方面产生巨大影响：\n  - **系统：** 存储、通信、计算架构\n  - **分析：** 统计、计算、优化\n\
    \n## 上课之前，你可能认为统计是……\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_17_0.png)\n\n\
    - 统计资料（Statistics）可以指数值事实，如平均值、中位数、百分比和最大值，这些事实帮助我们了解各种公共卫生、商业和经济状况。\n\n## 学完这门课程后，你会知道统计学是\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_18_0.png)\n\n- 统计学（Statistics）也可以指收集、分析、解释和呈现数据的艺术与科学。\n\
    \n## 什么是统计学？\n\n- 两个重要目标：\n  - 通过概率建模从样本推断总体。\n  - 预测未来结果\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_19_0.png)\n\
    \n- 概率：描述数据是如何从总体中抽取的。\n- 统计：通过概率建模推断总体。\n\n## 统计学的历史\n\nBiometrika：高尔顿和皮尔逊于1901年创办了Biometrika，作为第一本统计学杂志；后者（皮尔逊）在伦敦大学学院（UCL）创立了世界上第一个统计学系。\n\
    \n古代统计学的开端（公元前450年）：“三个计数问题”\n\n16-17世纪统计学的“概率”基础：来自赌博的概率概念和理论\n\n现代统计学的“范式改革与创新”（1900-2000）：第四范式：数据密集型科学发现\n\
    \n古代统计学的成长（公元2年）：中国汉朝进行了人类历史上第一次准确的人口普查\n\n18-19世纪统计科学的“四大发现”：大数定律、贝叶斯定理、误差分析、回归与相关\n\
    \n来源：郁东，刘东升，刘爱霞，统计的历史与统计学发展. 2017.\n\n## 什么是商业统计？\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_21_0.png)\n\
    \n## 在商业与经济中的应用\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_22_0.png)\n\n- **会计（Accounting）**：会计师事务所为客户进行审计时，会使用*统计抽样程序*。\n\
    - **金融（Finance）**：金融分析师使用各种*统计信息*来指导他们的投资建议。\n- **经济学（Economics）**：经济学家使用*统计信息*对经济或其某一方面进行预测。\n\
    \n## 总结：统计学（Statistics）\n\n### 1 描述统计学（Descriptive Statistics）\n\n- 统计学用于总结和呈现数据。\n\
    - 局限性：只关注观测数据的性质，不涉及总体。\n\n### 2 统计推断（Statistical Inference）\n\n- 需要关于总体的信息，而数据只能从样本中收集。\n\
    \  - 总体：特定研究中所有感兴趣元素的集合\n  - 样本：总体的子集\n- 使用样本数据 ⇒ 推断总体性质\n  - 推导估计值：均值、方差、置信区间\n\
    \  - 进行假设检验：参数（非参数）检验、方差分析、回归、实验设计\n\n## 课程信息\n\n### 引言\n\n### 一些有趣的故事\n\n- 理解“平均值”\n\
    - 伯克森悖论\n- 辛普森悖论\n\n### 描述统计学（第2-3章）\n\n## “平均值”的不同含义\n\n- 问题1：什么是平均值？[均值、中位数、众数……](#)\n\
    - 问题2：平均值有什么用？[衡量集中趋势](#)\n- [“三个计数问题”](#)：墙有多高？\n\n- **均值**：算术平均数\n  \\(\\bar{x}=\\\
    frac{1}{n}\\sum_{i=1}^{n}x_i\\)\n- **众数**：数据集中出现频率最高的值\n- **中位数**：将较高的一半与较低的一半分开的中间值\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_26_0.png)\n\n"
