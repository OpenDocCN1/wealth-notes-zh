    \ | 54 |\n| 5 | 62 | 74 | 56 |\n| Sample Mean | 55 | 68 | 57 |\n| Sample Variance\
    \ | 26.0 | 26.5 | 24.5 |\n\n## Example: Reed Manufacturing – Analysis\n\n- Step\
    \ 1: Develop the hypotheses.\n\nH₀ : μ₁ = μ₂ = μ₃ = ⋯ = μₖ\nHₐ : Not all population\
    \ means are equal\n\nwhere:\n\nμ₁ = mean number of hours worked per week by the\
    \ managers at Plant 1\n\nμ₂ = mean number of hours worked per week by the managers\
    \ at Plant 2\n\nμ₃ = mean number of hours worked per week by the managers at Plant\
    \ 3\n\n- Step 2: Specify the level of significance. α = .05\n\n- Step 3: Compute\
    \ the value of the test statistic.\n\nx̄ = (55 + 68 + 57)/3 = 60\nSSTR = 5(55\
    \ − 60)² + 5(68 − 60)² + 5(57 − 60)² = 490\nMSTR = 490/(3 − 1) = 245\nSSE = 4(26.0)\
    \ + 4(26.5) + 4(24.5) = 308\nMSE = 308/(15 − 3) = 25.667\nF = MSTR/MSE = 245/25.667\
    \ = 9.55\n\n- ANOVA Table\n\n| Source of Variation | Sum of Squares | Degrees\
    \ of Freedom | Mean Square | F | p-Value |\n|---|---|---|---|---|---|\n| Treatment\
    \ | 490 | 2 | 245 | 9.55 | .0033 |\n| Error | 308 | 12 | 25.667 |  |  |\n| Total\
    \ | 798 | 14 |  |  |  |\n\n- Step 4: Rejection rule\n\n- p-Value Approach\n\n\
    Compute the p-value. With 2 numerator d.f. and 12 denominator d.f., the p-value\
    \ is .01 for F = 6.93. Therefore, the p-value is less than .01 for F = 9.55.\n\
    \nDetermine whether to reject H₀. The p-value ≤ .05, so we reject H₀.\n\n- Critical\
    \ Value Approach\n\nDetermine the critical value and rejection rule. Based on\
    \ an F distribution with 2 numerator d.f. and 12 denominator d.f., F₀.₀₅ = 3.89.\
    \ Reject H₀ if F ≥ 3.89\n\nDetermine whether to reject H₀. Because F = 9.55 >\
    \ 3.89, we reject H₀.\n\n- Step 5: Conclusion\n\nWe can conclude that the mean\
    \ number of hours worked per week by department managers is not the same at all\
    \ 3 plants.\n\nBut there is no evidence to support the difference coming from\
    \ the location.\n\nNo causality: Location ≠ Number of hours worked per week\n\n\
    ## What We Have Done\n\n- **AN**alysis **of V**ariance (**ANOVA**, 方差分析) is a\
    \ statistical procedure used to compare **means** among different **groups (treatments)**.\n\
    - We consider simple models for $x_{ij}$:\n\n  Model 1 (under $H_0$): $x_{ij}\
    \ = \\mu + \\varepsilon_{ij}$  \n  Model 2 (under $H_1$): $x_{ij} = \\mu + \\\
    alpha_j + \\varepsilon_{ij}$\n\n- Construct a **test statistic** as a variability\
    \ ratio:\n\n$$F(k-1, n_T-k)=\\frac{\\text{组间变差}}{\\text{组内变差}}=\\frac{SSTR/(k-1)}{SSE/(n_T-k)}$$\n\
    \nand reject $H_0$ if this ratio is **sufficiently large** (Rejection rule).\n\
    \n- **Causal inference**: experimental studies V.S. observational studies\n"
