  - '[PAGE 122]


    # Determining the Sample Size


    +   - Interval Estimation of μ (100(1 − α)%  信心为致): x̄ ± Δ

    +   - Fix the quantity of Δ: the desired margin of error, E

    +     - If σ is known, E = zα/2 σ / √n the necessary sample size is:

    +       n = (zα/2)² σ² / E²

    +     - If σ is unknown, we can obtain a preliminary or planning value for σ by
    using:

    +       - estimate of the population standard deviation computed from data of
    previous studies

    +       - sample standard deviation from the preliminary sample

    +       - judgment or a "best guess" for the value of σ'
  - '[PAGE 123]


    # Example: Determine the Sample Size


    # Example: 统. 规价


    +   - 在检查表中，我们期望控制误差E = 1元，为确定终要的样本容量，我们要得到σ的条别值


    +   - 通过对某系统样本的样本数据分析，我们发现样本标准差为5.5元，我们从5.5作为σ的条别值


    +   - 史上z0.025 = 1.96


    +   - 某用前院的公式，我们试算所 样本容量为n = 1.96² × 5.5² / 1 = 116.2. 我们 另他117作为 终所 样本量'
