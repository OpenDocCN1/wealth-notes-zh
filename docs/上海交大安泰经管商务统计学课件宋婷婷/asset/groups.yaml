  - '[PAGE 130]


    # Interval Estimate of Population Proportion p


    # Example: 统。规模


    +   - 假设我们想要在99%的置信性下观察样本比例与总体比例的差异在0.03范围内，要抽他会向样本？


    +   - $z_{\alpha/2}\sqrt{\frac{p^*(1-p^*)}{n}} = 0.03.$

    +   在99%置信率下，$z_{0.005}=2.576.$


    Recall that $p^* = 0.44$. Then, $n = \frac{(2.576)^2(0.44)(0.56)}{(0.03)^2} =
    1817.$'
