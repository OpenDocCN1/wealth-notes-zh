    \n- The favorite dishes\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_271_0.png)\n\
    \n## Introduction\n\n- ANalysis Of VAriance (ANOVA, 方差分析) is a statistical procedure\
    \ used to test for the equality of three or more population means.\n- We want\
    \ to use the sample results to test the following hypotheses:\n\n\\[\nH_0: \\\
    mu_1 = \\mu_2 = \\mu_3 = \\cdots = \\mu_k = \\mu\n\\]\n\n\\[\nH_a: \\text{Not\
    \ all population means are equal}\n\\]\n\n- If \\(H_0\\) is rejected, all population\
    \ means are different (×). Why?\n\n## ANOVA: Motivation Models\n\n- **The Goal:**\
    \ to compare means among different groups (treatments).\n- **ANOVA** seeks to\
    \ achieve the above goal by identifying sources of variation in a numerical dependent\
    \ variable \\(X = \\{x_{ij}\\}\\).\n  - \\(j\\) denotes the group the subject\
    \ belongs to from \\(1, \\dots, k\\).\n  - \\(i\\) denotes the \\(i\\)th sample\
    \ in the group from \\(1, \\dots, n_j\\).\n- We consider a simple model for \\\
    (x_{ij}\\):\n  - Model 1 (under \\(H_0\\)): \\(x_{ij} = \\mu + \\varepsilon_{ij}\\\
    ).\n  - Model 2 (under \\(H_a\\)): \\(x_{ij} = \\mu + \\alpha_j + \\varepsilon_{ij}\\\
    ).\n- Intuitively, the variation in \\(X\\) under Model 1 ONLY comes from the\
