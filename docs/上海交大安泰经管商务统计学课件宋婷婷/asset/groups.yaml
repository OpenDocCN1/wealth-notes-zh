    # Introduction


    +   - ANalysis Of VAriance (ANOVA, 迥差分析) is a statistical procedure used to test
    for the equality of three or more population means.

    +   - We want to use the sample results to test the following hypotheses:

    +     H₀ : μ₁ = μ₂ = μ₃ = ⋯ = μₖ = μ

    +     Hₐ : Not all population means are equal

    +     - If H₀ is rejected, all population means are different (×). Why?'
