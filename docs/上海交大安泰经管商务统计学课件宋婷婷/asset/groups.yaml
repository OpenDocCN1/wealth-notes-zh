    \ to conduct a two-tailed test $H_0: \\mu = \\mu_0$ versus $H_1: \\mu \\ne \\\
    mu_0$\n+     - Select a simple random sample and develop the (1 − α)% confidence\
    \ interval\n+     - If it contains the hypothesized value $\\mu_0$, do not reject\
    \ $H_0$; otherwise, reject $H_0$."
