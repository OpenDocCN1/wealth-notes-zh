  - "[PAGE 203]\n\n# Interval Estimation of Variance and Standard Deviation\n\n+ \
    \  - Denote \\(\\chi^2_{(1-\\alpha)}\\) to be the \\(\\alpha\\)-quantile of the\
    \ chi-square distribution\n+   \n+   - Then there is a \\((1-\\alpha)\\) probability\
    \ such that\n+   \n+     \\[\n+     \\chi^2_{(1-\\alpha/2)} \\leq \\frac{(n-1)s^2}{\\\
    sigma^2} \\leq \\chi^2_{\\alpha/2}\n+     \\]\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_203_0.png)"
  - "[PAGE 204]\n\n# Interval Estimation of Variance and Standard Deviation\n\n+ \
    \  - Performing algebraic manipulation, we get **interval estimator** for variance\n\
    +   \n+     $$\\frac{(n-1)s^2}{\\chi^2_{\\alpha/2}} \\leq \\sigma^2 \\leq \\frac{(n-1)s^2}{\\\
    chi^2_{(1-\\alpha/2)}}$$\n+   \n+   - Taking square root, we get **interval estimator**\
    \ for standard deviation\n+   \n+     $$\\sqrt{\\frac{(n-1)s^2}{\\chi^2_{\\alpha/2}}}\
    \ \\leq \\sigma \\leq \\sqrt{\\frac{(n-1)s^2}{\\chi^2_{(1-\\alpha/2)}}}$$"
  - '[PAGE 205]


    # Example——蜜雪现城


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_205_0.png)


    +   - 背景：如果要论2021登上半壁江山的饮算，蜜雪现城总题曲保对算得上其中测。

    +   - 君于1997整的蜜雪现城大概也务有想地，卖了20多整茶，后陈赤是凭生在想限领绷的理社而彻底合。

    +   - 由在总题曲大伙位不地个月，蜜雪现城位被排体保光食品卫生题，蜜雪现城场方也为此夺其作通整块相半邰得。'
  - '[PAGE 206]


    # Example——蜜雪冰城


    +   - Consider the production process of filling Ice Lemon Tea in mi xue bing
    cheng (蜜雪冰城).

    +   - Real problem: We are interested in estimating the population variance for
    the Ice Lemon Tea filling process.

    +   - Statistically: A sample of 20 containers is taken, and the sample variance
    for the filling quantities is found to be s² = 0.0025.

    +   - Our interest will be in developing confidence interval with α = 0.05.'
  - "[PAGE 207]\n\n# Example——蜜雪现城\n\n+   - Consider the production process of filling\
    \ Ice Lemon Tea in mi xue bing cheng (蜜雪现城).\n+   - **Real problem:** We are interested\
    \ in estimating the population variance for the Ice Lemon Tea filling process.\n\
    +   - **Statistically:** A sample of 20 containers is taken, and the sample variance\
    \ for the filling quantities is found to be $s^2 = 0.0025$.\n+   - Our interest\
    \ will be in developing confidence interval with $\\alpha = 0.05$.\n+   - Since\
    \ $\\chi_{0.975}(19)^2 = 8.907$ and $\\chi_{0.025}(19)^2 = 32.852$, the C.I. is\n\
    +   \n+   $$\\frac{(19)(0.0025)}{32.852} \\le \\sigma^2 \\le \\frac{(19)(0.0025)}{8.907},$$\n\
    +   \n+   i.e.,\n+   \n+   $$0.0014 \\le \\sigma^2 \\le 0.0053$$\n+   \n+   $$0.0380\
    \ \\le \\sigma \\le 0.0730$$"
  - '[PAGE 208]


    # Hypothesis Testing About a Population Variance


    +   Three forms for a hypothesis test about a population variance:

    +   - Two-tailed test:

    +     H₀: σ² = σ₀², versus Hₐ: σ² ≠ σ₀²

    +   - Upper-tailed test:

    +     H₀: σ² ≤ σ₀², versus Hₐ: σ² > σ₀²

    +   - Lower-tailed test:

    +     H₀: σ² ≥ σ₀², versus Hₐ: σ² < σ₀²'
