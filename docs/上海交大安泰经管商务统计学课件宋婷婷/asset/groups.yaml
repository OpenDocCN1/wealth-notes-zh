  - '[PAGE 187]


    # Test Procedure when σ₁² ≠ σ₂² are Unknown


    +   - The test statistic is the same, but the rejection regions are not.

    +   - The p-values are also different.


    +   - Two-tailed test: p-value = P(|t| ≥ |t_obs| | μ₁ - μ₂ = D₀)

    +   - Upper-tailed test: p-value = P(t ≥ t_obs | μ₁ - μ₂ ≤ D₀)

    +   - Lower-tailed test: p-value = P(t ≤ t_obs | μ₁ - μ₂ ≥ D₀)


    | | Two-tailed Test | Upper-tailed Test | Lower-tailed Test |

    |---|---|---|---|

    | Hypotheses | H₀: μ₁ - μ₂ = D₀

    H₁: μ₁ - μ₂ ≠ D₀ | H₀: μ₁ - μ₂ ≤ D₀

    H₁: μ₁ - μ₂ > D₀ | H₀: μ₁ - μ₂ ≥ D₀

    H₁: μ₁ - μ₂ < D₀ |

    | Test Statistic | t = (x̄₁ - x̄₂ - D₀) / √(s₁²/n₁ + s₂²/n₂) | t = (x̄₁ - x̄₂
    - D₀) / √(s₁²/n₁ + s₂²/n₂) | t = (x̄₁ - x̄₂ - D₀) / √(s₁²/n₁ + s₂²/n₂) |

    | Rejection rule: Critical value approach | Reject H₀ if |t_obs| ≥ t*_{α/2} |
    Reject H₀ if t_obs ≥ t*_{α, ν} | Reject H₀ if t_obs ≤ -t*_{α, ν} |

    | Rejection rule: p-value approach | Reject H₀ if p-value ≤ α | Reject H₀ if p-value
    ≤ α | Reject H₀ if p-value ≤ α |'
  - "[PAGE 188]\n\n# Matched Samples: Motivating Example\n\n+   - Suppose that employees\
    \ at a manufacturing company can use two different methods to perform a production\
    \ task.\n+   - To maximize production output, the company wants to identify the\
    \ method with the smaller population mean completion time.\n+   - Begin by tentatively\
    \ assuming that the two production methods have the same population mean completion\
    \ time. Then, the hypothesis test is written as\n+   \n+     H₀ : μ₁ = μ₂,   versus\
    \   Hₐ : μ₁ ≠ μ₂.\n\n+   - Matched sample design:\n+     - a random sample of\
    \ workers is selected\n+     - each worker first uses one method and then uses\
    \ the other method\n+     - the order of the two methods is assigned randomly\
    \ to the workers."
  - '[PAGE 189]


    # Test Procedure for Matched Samples


    +   - Assume that we collect the completion times by *n* random workers using
    two different methods

    +     - $(X_{1,1}, X_{1,2}), (X_{1,2}, X_{2,2}), \dots, (X_{1,n}, X_{2,n})$ are
    i.i.d. binormal distributed (bivariate normal distributed).

    +     - $X_{1,i}$ and $X_{2,i}$ are matched and correlated samples.


    +   - Step 1: Consider the two-tailed hypothesis test $H_0: \mu_1 = \mu_2$, versus
    $H_a: \mu_1 \neq \mu_2$.


    +   - This can be reformulated as one-population mean hypothesis testing.

    +     - Let $\mu_d = \mu_1 - \mu_2$ and $Y_i = X_{1,i} - X_{2,i}$ for $i = 1,
    2, \dots, n$.

    +     - The null hypothesis is equivalent to $H_0: \mu = 0$.


    +   - Step 2-4: Then, the one-sample t-test can be used to reject or accept $H_0$
    based on the new samples $Y_1, Y_2, \dots, Y_n$.'
