    \ = 139(5.05 − 6.96)² + 139(7.61 − 6.96)² + 139(8.22 − 6.96)² = 785.11\n  MSTR\
    \ = 785.11/(3 − 1) = 392.56\n\n- Within-group variance (组内误差)\n  SSE = 138(4.89)\
    \ + 138(2.72) + 138(2.05) = 1333.89\n  MSE = 1333.89/(417 − 3) = 3.22\n\n- Step\
    \ 3: Test Statistic (统计量)\n  F = MSTR/MSE = 392.56/3.22 = 121.90\n\n## 例：食堂调查\
