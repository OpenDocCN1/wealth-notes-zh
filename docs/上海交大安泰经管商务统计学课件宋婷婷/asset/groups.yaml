    \ Test\n\n## When the Parametric t-test Goes Wrong\n\n- Test statistics: t-statistic\n\
    \n$$\nt = \\frac{\\bar{X}_1 - \\bar{X}_2}{\\sqrt{S^2\\left(\\frac{1}{n_1}+\\frac{1}{n_2}\\\
    right)}} \\quad \\text{where} \\quad S^2 = \\frac{(n_1-1)s_1^2 + (n_2-1)s_2^2}{n_1+n_2-2}\n\
    $$\n\n- In the dataset A: $s_1^2 = 9.2$ and $s_2^2 = 17.5$\n- In the dataset B:\
    \ $s_1^2 = 9.2$ and $s_2^2 = 2335$\n- **Conclusion:** the mean test statistics\
    \ are highly influenced by the extreme outliers.\n\n## When to Use Nonparametric\
    \ Methods\n\nPrinciples: if you can apply both parametric and nonparametric\n\n\
    - With **correct assumptions** (e.g., normal distribution), parametric methods\
