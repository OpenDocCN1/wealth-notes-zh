    \ - \\bar{p}_3| = |0.5520 - 0.7029| = 0.1509$\n\n凯美瑞与Model 3：$|\\bar{p}_2 - \\\
    bar{p}_3| = |0.6000 - 0.7029| = 0.1029$\n\n- 1. 关于总体方差的推断\n- 2. 三个或多个比例的检验\n-\
    \ 3. 独立性检验\n- 4. 拟合优度检验\n\n## 动机：独立性检验\n\n- 独立性：两个变量是否相互独立？\n- 示例：父母的收入 ⇒ 子女的教育程度\n\
    \  - 对175名年轻人进行了一项关于其最高教育程度（大学、高中或两者皆无）的调查。\n  - 他们的父母被划分为富裕阶层、中产阶层或贫困阶层。\n- 样本数据：结果汇总如下\n\
    \n| 父母类别 | 教育程度 | | | |\n|---|---|---|---|---|\n| | 大学 | 高中 | 无 | 合计 |\n| 富裕 |\
    \ 20 | 15 | 10 | 45 |\n| 中产 | 40 | 25 | 20 | 85 |\n| 贫困 | 8 | 14 | 23 | 45 |\n\
    | 合计 | 68 | 54 | 53 | 175 |\n\n- 问题：个人的教育程度是否与父母的财富状况相互独立？\n\n## 独立性检验\n\n- 卡方检验可用于检验两个分类变量之间的独立性。\n\
    - 设定原假设和备择假设。\n  - $H_0$：列变量不受行变量影响。\n  - $H_a$：列变量受行变量影响。\n- 选择一个随机样本，并记录列联表中每个单元格的观测频数\
    \ $f_{ij}$。\n- 计算每个单元格的期望频数 $e_{ij}$。\n\n$$e_{ij} = \\frac{\\text{第 } i \\text{\
    \ 行合计} \\times \\text{第 } j \\text{ 列合计}}{\\text{样本量}}$$\n\n- 计算检验统计量的值。\n\n$$\\\
    chi^2 = \\sum_i \\sum_j \\frac{(f_{ij} - e_{ij})^2}{e_{ij}}$$\n\n注意：当有 $n$ 行和\
    \ $m$ 列时，检验统计量服从自由度为 $(n - 1)(m - 1)$ 的卡方分布，前提是所有类别的期望频数均为5或以上。\n\n**拒绝规则：**\n\
    \n- p值法：若 p 值 ≤ $\\alpha$，则拒绝 $H_0$。\n- 临界值法：若 $\\chi^2 > \\chi^2_{\\alpha,(n-1)(m-1)}$，则拒绝\
    \ $H_0$。\n\n### 示例\n\n**观测频数**\n\n| 父母类别 | 教育程度 | | | |\n|---|---|---|---|---|\n\
    | | 大学 | 高中 | 无 | 合计 |\n| 富裕 | 20 | 15 | 10 | 45 |\n| 中产 | 40 | 25 | 20 | 85 |\n\
    | 贫困 | 8 | 14 | 23 | 45 |\n| 合计 | 68 | 54 | 53 | 175 |\n\n**期望频数**\n\n| 父母类别 |\
    \ 教育程度 | | | |\n|---|---|---|---|---|\n| | 大学 | 高中 | 无 | 合计 |\n| 富裕 | 17.5 | 13.9\
    \ | 13.6 | 45 |\n| 中产 | 33.0 | 26.2 | 25.8 | 85 |\n| 贫困 | 17.5 | 13.9 | 13.6 |\
    \ 45 |\n| 合计 | 68 | 54 | 53 | 175 |\n\n- 检验统计量：\n  $$\\chi^2 = \\frac{(20 - 17.5)^2}{17.5}\
    \ + \\frac{(40 - 33.0)^2}{33.0} + \\cdots + \\frac{(23 - 13.6)^2}{13.6} = 15.82$$\n\
    - $\\alpha = 0.05$，自由度 = $(3 - 1)(3 - 1) = 4$\n- p值法：p 值 $= 0.003 < \\alpha$\n\
    - 临界值法：$\\chi^2 > \\chi^2_{0.05,4} = 9.49$\n- 我们拒绝原假设，并得出结论：所达到的教育程度与父母的财富状况并非相互独立。\n\
    \n"
