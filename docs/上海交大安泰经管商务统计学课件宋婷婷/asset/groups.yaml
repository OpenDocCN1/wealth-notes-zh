  - '[PAGE 304]


    # Multiple Comparison Procedures


    +   - Suppose that ANOVA(MSE,1/n=1/n) has provided statistical evidence to reject
    the null hypothesis of equal population means.


    +   - H₀: μᵢ = μ⁰ for all i and Hₐ: μᵢ ≠ μ⁰ for some i.


    +   - Fisher''s least significant difference ( 小样本检验 ) (LSD) procedure is a two-step
    procedure for pairwise comparisons of several treatment groups, which helps to
    determine where the differences occur.


    +     - Perform an ANOVA test (global), if rejected at the pre-specified level
    of significance


    +     - Perform all pairwise comparisons at the same level of significance.


    +   - There are two variations of the second procedure, based on two different
    test statistics:


    +     - t-statistics t = (x̄ᵢ - x̄ⱼ) / √[MSE(1/nᵢ + 1/nⱼ)]


    +     - Sample mean differences: x̄ᵢ - x̄ⱼ'
  - '[PAGE 305]


    # Fisher’s LSD Procedure: t-statistics


    +   - Step 1: Hypotheses (# C_k^2)

    +     H0: μi = μj

    +     Ha: μi ≠ μj


    +   - Step 3: Test Statistic (two-sample mean test with unknown equal variance)

    +     t(nT − k) = (x̄i − x̄j) / √[MSE(1/ni + 1/nj)]


    +   - Step 4: Rejection Rule

    +     - p-value Approach: Reject H0 if p-value ≤ α

    +     - Critical Value Approach: Reject H0 if t ≤ −tα/2 or t ≥ tα/2 where the
    value of tα/2 is based on t distribution (d.f. = nT − k) Why?'
  - '[PAGE 306]


    # Fisher''s LSD Procedure : x̄_i − x̄_j


    +   - Step 1: Hypotheses

    +     H₀ : μ_i = μ_j

    +     Hₐ : μ_i ≠ μ_j


    +   - Step 3: Test Statistic

    +     x̄_i − x̄_j


    +   - Step 4: Rejection Rule

    +     - Reject H₀ if

    +       |x̄_i − x̄_j| ≥ LSD

    +     where

    +     LSD = t_{α/2}(n_T − k) √[MSE(1/n_i + 1/n_j)]'
  - "[PAGE 307]\n\n# Example: Reed Manufacturing – Fisher’s LSD Procedure\n\n+   -\
    \ **Empirical question:** Recall that Janet Reed wants to know if there is any\
    \ significant difference in the mean number of hours worked per week for the department\
    \ managers at her three manufacturing plants.\n+   - In the first step, ANOVA\
    \ has provided **statistical evidence** to reject the null hypothesis of equal\
    \ population means.\n+   - Fisher’s least significant difference (LSD) procedure\
    \ (pairwise comparisons C₃² = 3) can be used to determine **where the differences\
    \ occur**.\n+   - For α = .05 and n_T − k = 15 − 3 = 12 degrees of freedom, t₀.₀₂₅\
    \ = 2.179\n+     $$\\text{LSD}=t_{\\alpha/2}\\sqrt{\\text{MSE}\\left(1/n_i+1/n_j\\\
    right)}$$ \n+     $$=2.179\\sqrt{25.667\\left(1/5+1/5\\right)}=6.98$$"
  - "[PAGE 308]\n\n# Example: Reed Manufacturing – Fisher’s LSD Procedure\n\n+   LSD\
    \ for Plants 1 and 2\n\n+   Hypotheses (A)\n+   \n+   H₀: μ₁ = μ₂\n+   Hₐ: μ₁\
    \ ≠ μ₂\n\n+   Rejection Rule\n+   \n+   Reject H₀ if |x̄₁ − x̄₂| ≥ 6.98\n\n+ \
    \  Test Statistic Rule\n+   \n+   |x̄₁ − x̄₂| = |55 − 68| = 13\n\n+   Conclusion\n\
    \nThe mean number of hours worked at Plant 1 is not equal to the mean number worked\
