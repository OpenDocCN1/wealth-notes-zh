    sum_{i=1}^{n_j}(x_{ij}-\\bar{x}_j)^2$$\n\n  and the **Mean Square Error** (MSE)\
    \ by\n\n  $$\\mathrm{MSE}=\\frac{\\mathrm{SSE}}{df_E},\\quad\\text{where }df_E=nT-k$$\n\
