  - "[PAGE 148]\n\n# Testing Population Mean when Variance is Known\n\n+   - Assume\
    \ we collect \\(n\\) i.i.d. samples \\(X_1, X_2, \\ldots, X_n\\) and \\(X_i \\\
    sim N(\\mu, \\sigma^2)\\).\n\n+   - **Step 1:** state the null and alternative\
    \ hypotheses  \n+     \\(H_0: \\mu = \\mu_0;\\ H_a: \\mu \\ne \\mu_0.\\)\n\n+\
    \   - **Step 2:** select the level of significance \\(\\alpha\\).\n\n+   - **Step\
    \ 3:** When the variance is known, the test statistic is specified by  \n+   \
    \  \\[\n+   z = \\frac{\\bar{x} - \\mu_0}{\\sigma/\\sqrt{n}}\n+   \\]  \n+   \
    \  where \\(\\bar{x}\\) is the sample mean.\n\n+     - The test procedure based\
    \ on the z statistic is often called **Z-test**.\n+     - Under \\(H_0\\), the\
    \ distribution of z is known: \\(z \\sim N(0,1)\\).\n\n+   - **Step 4:** Two approaches\
    \ to determine the rejection rule\n+     - Critical-value approach\n+     - p-value\
    \ approach"
  - '[PAGE 149]


    # Critical-Value Approach


    +   - We first specify a critical value for the test statistic.


    +   - The critical value serves as a benchmark for determining whether the value
    of test statistic is small (or large) enough to reject.


    +   - Given the critical value c, the rejection region is (−∞, −c] ∪ [c, ∞).


    +   - How to determine c to achieve a significance level of α?

    +     Significance level = P(Reject H₀|H₀) = P(|z| ≥ c|H₀) = 2Φ(−c) = 2Φ̄(c)


    +   - The significance level α is achieved by letting c = zα/2 = Φ⁻¹(α/2).


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_149_0.png)


    +   - Step 5: Comparing the test statistic to a critical value, we make a decision
    to either reject H₀ or not to reject it.'
  - "[PAGE 150]\n\n# p-Value Approach\n\n+   - P-value provides additional information:\
    \ the strength of the rejection or not to rejecting.\n\n+   - p-value: the probability\
    \ of observing a sample value as extreme as, or more extreme than, the value observed,\
    \ given that H₀ is true.\n+   \n+     p-value = P(|z| ≥ |z_obs| | μ = μ₀).\n\n\
    +   - In the statistical test, the p-value is used as a measure of the evidence\
    \ against H₀ provided by the sample.\n\n+   - Smaller p-values indicates more\
    \ evidence against the null hypothesis.\n\n+   - Step 5: The rejection rule using\
    \ the p-value approach is to\n+   \n+     reject H₀ : μ = μ₀, if p-value ≤ α."
  - '[PAGE 151]


    # Extensions to Other Hypotheses


    +   - The test procedures are similar for the upper-tailed and lower-tailed hypotheses.

    +   - Step 1: Consider the upper-tailed hypothesis

    +     $H_0: \mu \le \mu_0 \quad \text{versus} \quad H_a: \mu > \mu_0$.

    +   - Step 2: select the level of significance $\alpha$.

    +   - Step 3: Using the same test statistic $z$.

    +   - Step 4 & 5: We reject $H_0$ if $z \ge z_\alpha$, where the critical value
    $z_\alpha$ is chosen such that the significance level is $\alpha$.

    +   - P-value approach: p-value = P($z \ge z_{obs} | H_0$).


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_151_0.png)'
  - '[PAGE 152]


    # When Population is not Normally Distributed


    +   - If the population has a normal distribution, both Z-test and T-test are
    applicable even with small sample sizes (T-test is preferred).

    +   - If the population is not normally distributed, larger sample sizes are required.

    +     - Advices from the textbook: n ≥ 30

    +   - If the population is not normally distributed, and the sample size is small,
    we may use nonparametric methods.'
  - "[PAGE 153]\n\n# Relationship with Interval Estimation\n\n+   - For normal population\
    \ with σ known, the (1 − α)% confidence interval for μ is given by\n+   \n+  \
    \   \\[\n+     \\bar{x} \\pm z_{\\alpha/2}\\frac{\\sigma}{\\sqrt{n}}\n+     \\\
    ]\n\n+   - We know that (1 − α)% of the confidence intervals generated will contain\
