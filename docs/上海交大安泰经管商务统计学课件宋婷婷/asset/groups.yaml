    \ it is false (False negative, 假阴性)\n\n| Conclusion | \\(H_0\\) True | \\(H_a\\\
    ) True |\n|---|---|---|\n| Accept \\(H_0\\) | Correct | Type II Error |\n| Reject\
    \ \\(H_0\\) | Type I Error | Correct |\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_142_0.png)\n\
