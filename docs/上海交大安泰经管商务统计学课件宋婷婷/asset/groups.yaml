  md: "\n## 本次课的主要目标\n\n- 领会方差分析 ANOVA\n  - 用于广泛检验问题\n  - 方差分析的定义\n  - 方差分析的组间变异、统计量\n\
    - 有代表性的方差分析\n  - 单因素方差分析\n  - 单因素方差分析（组间分析）\n  - 双因素方差分析\n- 领会方差分析中如何进行实验和设计\n\
