  - '[PAGE 191]


    # Matched Sample V.S. Independent Samples


    +   - **Matched (paired) samples:** the members of one sample can be used to determine
    the members of other sample.

    +     - Pre-test/post-test: collect the data from the same individual units before
    and after an event/treatment/intervention.

    +     - Cross-over trials: individuals are randomized to two treatments and then
    the same individuals are crossed-over to the alternative treatment.

    +     - Matched samples: individuals are matched on personal characteristics,
    e.g., smokers and non-smokers of the same sex and the same age.

    +     - Duplicate measurements: the same biological samples, e.g., twins

    +     - Others: any circumstance in which each data point in one sample is uniquely
    matched to a data point in the second sample, e.g, married couples

    +   - **Advantages by using matched samples:** the s.d. of the differences of
    the matched pairs will be smaller than unmatched pairs. Why?

    +   - **Answer:** Few differences should exist because of the correlation between
    the two groups.'
  - '[PAGE 192]


    # Testing for Two Proportions: Motivating Example


    +   - A tax preparation firm want to compare the quality of work at two regional
    offices.

    +   - By randomly sampling tax returns prepared at each office, the firm can estimate
    the proportion of erroneous returns prepared at each office.

    +   - Step 1: The firm want to test if there is difference between these proportions.


    $H_0: p_1 = p_2, \quad \text{versus} \quad H_a: p_1 \ne p_2.$


    +   - This is a **two-tailed test for two (independent) population proportions**.
    In general, the test could be two-tailed, upper-tailed and lower-tailed.'
