  mdcn: "\n\n## 我们想要做什么\n\n- “品茶女士”问题（假设检验）如何与样本均值相关？\\(\\bar{x} \\sim N(\\mu, \\\
    sigma^2/n)\\)。\n- 对于假设检验，我们想知道：\n  - 对什么提出假设？\n  - 如何陈述一个假设？\n  - 如何进行检验？\n  -\
    \ 如何判断检验结果？\n  - 如何得出有意义的结论？\n\n## 假设检验\n\n- **假设**是对**总体**的陈述。\n  - 总体均值 \\(\\\
    mu\\)\n  - 总体方差 \\(\\sigma^2\\)\n  - 总体分布（正态性）\n- **假设检验**是一种基于**样本证据**和**概率论**的程序，用来确定该假设是否是一个**合理的陈述**。\n\
    - 假设检验的基本步骤：\n  1. 陈述假设。\n  2. 选择显著性水平。\n  3. 识别检验统计量。\n  4. 制定决策规则。\n  5. 抽取样本，并得出决策。\n\
    \n## 假设检验的快速概述\n\n### 第一步：陈述假设\n\n- 假设检验中的**两个互补陈述**：\n  - **原假设** \\(H_0\\):\
    \ 你想要挑战的陈述（想拒绝）\n  - **备择假设** \\(H_a\\): 你希望支持的陈述（想支持）\n- 原假设中通常包含 **not** 或 **no**\
    \ 术语。\n  - 在品茶女士问题中，\\(H_0\\): 她**不能**区分牛奶和茶的顺序。\n  - 在 COVID-19 中，\\(H_0\\):\
    \ 该人**没有**冠状病毒。\n- **两种结果：**\n  - **拒绝**：样本提供了令人信服的证据表明它是错误的。结论是什么？\n    ⇒ **备择假设**：拒绝原假设时得出的结论。\n\
    \  - **未能拒绝**：并不意味着该假设是**真实**的。\n\n### 第五步：得出决策\n\n- 结论并不总是正确的，因为它们是基于随机样本得出的。\n\
    - 两类错误：\n  - 第一类错误：\\(H_0\\) 为真时拒绝 \\(H_0\\)（假阳性，假阳性）\n  - 第二类错误：\\(H_0\\) 为假时接受\
    \ \\(H_0\\)（假阴性，假阴性）\n\n| 结论 | \\(H_0\\) 为真 | \\(H_a\\) 为真 |\n|---|---|---|\n\
    | 接受 \\(H_0\\) | 正确 | 第二类错误 |\n| 拒绝 \\(H_0\\) | 第一类错误 | 正确 |\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_142_0.png)\n\
    \n### 第五步：得出决策 – 如何控制错误？\n\n- 第一类错误：\n  - 显著性水平 \\(\\alpha\\) 设定了犯第一类错误的最高概率。\n\
    \  - 显著性检验：仅控制第一类错误的假设检验。\n  - 在显著性检验中，我们通常使用‘不拒绝 \\(H_0\\)’而不是‘接受 \\(H_0\\)’。\n\
    - 第二类错误：\n  - 通过功效分析可以在假设检验中控制第二类错误。\n\n## 假设检验简介\n\n### 单总体假设检验\n\n- 总体均值的检验\n\
    - 总体比例的检验\n- 第二类错误\n\n### 双总体假设检验\n\n## 动机示例：质量控制\n\n- 一家工厂购买了一条新的自动化装配线，并希望监控其制造过程的质量。\n\
    - 已知，在正常运行的情况下，产出度量服从均值为 12 的正态分布。\n- 客户想知道：该过程现在是否正常运行？\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_145_0.png)\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_145_1.png)\n\n- **解决方案：** 抽取随机样本来检验总体均值是否为\
    \ 12。\n\n## 假设的表述\n\n- 原假设和备择假设的一般表述：\n\n  \\(H_0: \\theta \\in \\Theta_0 \\quad\
    \ \\text{versus} \\quad H_a: \\theta \\in \\Theta_0^c,\\)\n\n  其中 \\(\\theta\\\
    ) 是待检验的参数，\\(\\Theta_0\\) 是一个闭集。\n\n- 示例：总体均值 \\(\\theta \\equiv \\mu\\) 的典型检验\n\
    \n- 双尾检验：\\(\\Theta_0 = \\{\\mu_0\\}\\)\n\n  \\(H_0: \\mu = \\mu_0, \\quad \\\
    text{versus} \\quad H_a: \\mu \\neq \\mu_0.\\)\n\n- 上尾检验：\\(\\Theta_0 = (-\\infty,\
    \ \\mu_0]\\)\n\n  \\(H_0: \\mu \\le \\mu_0, \\quad \\text{versus} \\quad H_a:\
    \ \\mu > \\mu_0.\\)\n\n- 下尾检验：\\(\\Theta_0 = [\\mu_0, \\infty)\\)\n\n  \\(H_0:\
    \ \\mu \\ge \\mu_0, \\quad \\text{versus} \\quad H_a: \\mu < \\mu_0.\\)\n\n"
