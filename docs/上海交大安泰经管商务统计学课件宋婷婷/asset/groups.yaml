  mdcn: "\n\n## 析因实验（Factorial Experiment）\n\n- 在某些实验中，我们希望得出关于一个以上变量或因素的结论。\n- 当需要同时得出关于两个或更多因素的结论时，析因实验及其相应的方差分析计算是很有价值的设计。\n\
    - 之所以称为“析因”，是因为实验条件包含了因素的所有可能组合。\n- 例如，对于因素A的a个水平和因素B的b个水平，实验将涉及收集ab个处理组合的数据。\n\
    \n## 主效应与交互作用\n\n- 因素的**主效应**：响应随因素水平改变而产生的变化。\n- 因素之间的**交互作用**：在某些实验中，我们可能会发现一个因素的水平间响应变化在其他因素的所有水平上**并不**相同。\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_326_0.png)\n\n## 析因设计的优势\n\n- 假设我们有两个因素A和B，每个因素各有两种水平\n\
    - 一次一因子设计\n  - 需要总共6（3×2）次观测来估计2个因素的影响\n  - 关于交互作用的结论可能严重错误\n- 2因子析因设计\n  - 总共需要4次观测\n\
    \  - 一个因素的影响可以在其他因素的多个水平下进行估计\n  - 可以研究交互作用\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_327_0.png)\n\
    \n## 双因子析因实验：安排\n\n| 因素A \\ 因素B | 1 | 2 | ... | b |\n|---|---|---|---|---|\n|\
    \ 1 | $x_{111}, x_{112}, \\ldots, x_{11r}$ | $x_{121}, x_{122}, \\ldots, x_{12r}$\
    \ | ... | $x_{1b1}, x_{1b2}, \\ldots, x_{1br}$ |\n| 2 | $x_{211}, x_{212}, \\\
    ldots, x_{21r}$ | $x_{221}, x_{222}, \\ldots, x_{22r}$ | ... | $x_{2b1}, x_{2b2},\
    \ \\ldots, x_{2br}$ |\n| ... | ... | ... | ... | ... |\n| a | $x_{a11}, x_{a12},\
    \ \\ldots, x_{a1r}$ | $x_{a21}, x_{a22}, \\ldots, x_{a2r}$ | ... | $x_{ab1}, x_{ab2},\
    \ \\ldots, x_{abr}$ |\n\n- $x_{ijk}$ 有三个维度：\n- 因素A中的处理数：$i = 1, \\ldots, a$\n\
    - 因素B中的处理数：$j = 1, \\ldots, b$\n- 每个处理中的重复数：$k = 1, \\ldots, r$\n\n## 双因子析因设计：方差分析\n\
    \n- **双因子**析因实验的方差分析过程与完全随机实验和随机区组实验类似。\n- 模型形式为\n\n\\[\nx_{ijk}=\\mu+\\alpha_i+\\\
    beta_j+(\\alpha\\beta)_{ij}+\\epsilon_{ijk},\n\\]\n\n其中 \\(i=1,\\ldots,a\\)，\\\
    (j=1,\\ldots,b\\)，\\(k=1,\\ldots,r\\)。\n- 我们再次将总平方和（SST）分解为其来源。\n\n\\[\n\\mathrm{SST}=\\\
    mathrm{SSA}+\\mathrm{SSB}+\\mathrm{SSAB}+\\mathrm{SSE}\n\\]\n\n- 总自由度 \\(n_T-1\\\
    ) 分解为\n\n\\[\nn_T-1=(a-1)+(b-1)+(a-1)(b-1)+ab(r-1)\n\\]\n\n## 双因子析因实验：方差分析表\n\n\
    | 变异来源 | 平方和 | 自由度 | 均方 | F | p值 |\n|---|---|---|---|---|---|\n| 因素A | SSA | a\
