  - "[PAGE 425]\n\n# Test with Binomial Distribution\n\n+   There are 7 “+” out of\
    \ 10 samples. Suppose we want to use significance level α = 0.1, what is the p-value?\n\
    \n+   Suppose H0 is true, then X ~ B(n,0.5) with n = 10\n+   \n+   p-value = 2\
    \ × P(X ≥ 7) = 2 × Σ_{k=7}^{n} C(n,k) 0.5^n = 0.3438 > α\n\n+   Therefore, we\
    \ cannot reject the hypothesis that the population median is 450."
  - "[PAGE 426]\n\n# Test with Normal Approximation\n\n+   - When the sample size\
    \ $n$ is large, we can use normal approximation to simplify the computation.\n\
    +   - Since $\\mu_X = 0.5n$, $\\sigma_X = \\sqrt{0.25n}$, then for large $n$\n\
    +   \n+   $$Z := \\frac{X - 0.5n}{\\sqrt{0.25n}} \\sim N(0,1)$$"
  - '[PAGE 427]


    # Test with Normal Approximation


    +   - When the sample size n is large, we can use normal approximation to simplify
    the computation.

    +   - Since μ_X = 0.5n, σ_X = √0.25n, then for large n

    +     $$Z := \frac{X - 0.5n}{\sqrt{0.25n}} \sim N(0,1)$$

    +   - With the normal approximation, the rejection rule is obtained.

    +     - Critical value approach:

    +       reject H₀ if |Z| ≥ z_{α/2}.

    +     - p-value approach:

    +       reject H₀ if p-value = P(|N(0,1)| ≥ |Z|) ≤ α.'
  - '[PAGE 428]


    # Sign Test: Testing for Two Matched Samples


