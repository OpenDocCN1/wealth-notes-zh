    - Basic steps of hypothesis testing:\n  1. State the hypothesis.\n  2. Select\
    \ a level of significance.\n  3. Identify the test statistic.\n  4. Formulate\
    \ a decision rule.\n  5. Take a sample, and arrive at a decision.\n\n## A Quick\
    \ Overview of Hypothesis Testing\n\n### Step 1: State the hypotheses\n\n- **Two\
    \ complementary statements** in the hypothesis testing:\n  - **Null hypothesis\
    \ (原假设)** \\(H_0\\): a statement which you want to challenge (想拒绝)\n  - **Alternative\
    \ hypothesis (备择假设)** \\(H_a\\): a statement which you hope to support (想支持)\n\
    - There is usually a **not** or a **no** term in the null hypothesis.\n  - In\
