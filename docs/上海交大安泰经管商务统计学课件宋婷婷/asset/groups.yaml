  mdcn: "\n## 什么是 A/B 测试？\n\n- A/B 测试源于生物医学的双盲测试\n  - 患者被随机分为两组，事先不知情地服用安慰剂或测试药物。\n\
    \  - 研究人员根据两组的表现来判断测试药物是否有效。\n  - 问题：如果你是研究人员，你会如何判断？\n\n## 互联网公司中的 A/B 测试\n\n\
    100% 用户\n50% 用户\n50% 用户\n对照组\n现有系统\n实验组\n带有功能 X 的现有系统\n对用户交互进行记录、分析和比较\n在实验结束时进行分析\n\
    \n## 案例故事：41 种蓝色\n\nGoogle\n\n- Google 一直坚信 A/B 测试，而非依靠直觉做决定。\n- 早在 2000 年，Google\
    \ 就进行了一次 A/B 测试，用来确定搜索结果页面上每页显示多少条结果最合适。\n- 这次测试验证了实验基础设施的重要性，使得实验可以快速配置和运行。\n\
    - 到 2011 年，Google 已经进行了 7000 多次 A/B 测试，例如：\n  - 当 Google 准备在 Gmail 中推出广告时，他们想知道：\n\
    \    - 带下划线的蓝色链接是否效果更好？\n\n## 案例故事：41 种蓝色\n\nGoogle\n\n- Google 的系统性 A/B 测试平台为实验提供了坚实支撑。\n\
    - 早在 2000 年，Google 进行了第一次 A/B 测试，用来确定搜索结果页面上每页显示多少条结果。\n- 该测试促进了整个公司级实验体系的建设。\n\
    - 到 2011 年，Google 已经进行了 7000 多次 A/B 测试，例如：\n  - 当 Google 准备在 Gmail 中推出广告时，他们在思考：\n\
    \    - 哪种蓝色的链接方案更有效？\n  - 方案一：依靠设计师或营销专家的直觉选择蓝色。\n  - 方案二：依靠数据驱动的方法，用实验找到正确答案。\n\
    - Google 选择了方案二，对 41 种蓝色——从略带绿调的蓝到纯蓝——进行了 A/B 测试。\n\n## 案例故事：41 种蓝色\n\nGoogle（用数据发现新颜色）\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_375_0.png)\n\n## 案例故事：41 种蓝色\n\nGoogle（内部数据和发现）\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_376_0.png)\n\n- **直觉常常会误导对颜色的判断，因此需要通过实验来比较。**\n\
    \n![Google 标志](image)\n\n- 这个微小的改动通过了 A/B 测试，为 Google 带来了每年 2 亿美元的额外广告收入。\n\n\
    - A/B 测试的作用：为广告决策提供数据支撑；同时最大化广告效果，并通过实验控制频率。\n\n## 为什么进行 A/B 测试？\n\nBing\n\n-\
    \ 2012 年，Bing 想通过 A/B 测试来优化搜索广告的展示效果，于是对广告标题与位置进行了分实验。\n- 用户会点击吗？Bing 决定用数据说话。\n\
