    \nRecall that $p^* = 0.44$. Then, $n = \\frac{(2.576)^2(0.44)(0.56)}{(0.03)^2}\
    \ = 1817.$\n\n## Take-away\n\n- Formula in Interval Estimation\n\n| | μ | | p\
