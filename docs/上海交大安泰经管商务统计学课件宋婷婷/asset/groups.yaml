    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_278_1.png)\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_279_0.png)\n\
    \nFigure: Sample observations\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_279_1.png)\n\
    \nFigure: Model 1 and Model 2 are both plausible\n\n"
