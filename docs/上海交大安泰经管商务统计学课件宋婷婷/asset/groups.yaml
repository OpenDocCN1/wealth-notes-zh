    \n## 总体比例的检验\n\n- 假设总体比例为 $p$，我们想检验 $p$ 是否大于 $p_0$。\n- 第 1 步：这是一个上尾假设检验：\n  \n\
    \  $H_0: p \\leq p_0$   versus   $H_a: p > p_0$。\n- 第 2-5 步设计检验程序。\n  - 指定显著性水平、检验统计量和拒绝规则。\n\
    \  - 收集 $n$ 名成员的随机样本并计算样本比例 $\\hat{p}$。\n\n- 对于第 i 名成员，令 Xi = 1 表示女性，Xi = 0 表示男性。则\n\
    \  \n  Xi ~ Bernoulli(p)，对于 i = 1, 2, ..., n。\n\n- 第 3 步：我们构造一个分布已知的检验统计量\n  \n\
    \  p̄ = (1/n) Σ_{i=1}^n Xi，其中 Σ_{i=1}^n Xi ~ B(n, p)\n\n- 第 2 步和第 4 步：记拒绝域为 [c,\
    \ 1]，显著性水平为\n  \n  sup_{p ≥ p0} P(Type I error) = P(p̄ ≥ c | p = p0) = Σ_{k =\
    \ nc}^n (n choose k) p0^k (1 - p0)^{n - k} = α。\n\n- 对于给定的 α，求解临界值 c 非常复杂。\n\n"
