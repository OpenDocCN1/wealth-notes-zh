  - "[PAGE 296]\n\n# Example: A Survey about Dining Hall – Discussion\n\n+   - Recall\
    \ that the three assumptions of ANOVA:  \n+     Normality, Identical Variances,\
    \ Independence\n+   - Does our design of experiment in this example satisfy these\
    \ assumptions?\n+   - Suppose you are designing the experiment for the same propose,\
    \ how would you do?"
  - '[PAGE 297]


    # Experimental Studies (实和物且其) V.S. Observational Studies (观测物且其)


    correlation→causality! 相关性是因果关系


    +   - Statistical studies can be classified as being either experimental or observational.


    +   - In an experimental study, one or more factors are controlled so that data
    can be obtained about how the factors influence the variables of interest.


    +   - In an observational study, no attempt is made to control the factors.


    +   - However, observational studies can only establish association (相关) between
    two variables.


    +   - It should be careful to generalize the results to the population and draw
    causal (因果) relationships.'
  - '[PAGE 298]


    # Example: Reed Manufacturing


    +   - **Empirical Question:** Janet Reed has three manufacturing plants (in Buffalo,
    Pittsburgh, and Detroit). She would like to know if there is any significant difference
    in the mean number of hours worked per week for the department managers at her
    three manufacturing plants.

    +   - **Data:** A simple random sample of five managers from each of the three
    plants was taken and the number of hours worked by each manager in the previous
    week is shown on the next slide.

    +   - **Techniques:** An F test will be conducted using α = .05.

    +   - **Statistical Framework (ANOVA):**

    +     - Factor: Manufacturing plant

    +     - Treatments: Buffalo, Pittsburgh, Detroit

    +     - Experimental units: Managers

    +     - Response variable: Number of hours worked'
  - '[PAGE 299]


    # Example: Reed Manufacturing Sample Data


    | Observation | Plant 1 Buffalo | Plant 2 Pittsburgh | Plant 3 Detroit |

    |-------------|-----------------|--------------------|-----------------|

    | 1 | 48 | 73 | 51 |

    | 2 | 54 | 63 | 63 |

    | 3 | 57 | 66 | 61 |

    | 4 | 54 | 64 | 54 |

    | 5 | 62 | 74 | 56 |

    | Sample Mean | 55 | 68 | 57 |

    | Sample Variance | 26.0 | 26.5 | 24.5 |'
  - '[PAGE 300]


    # Example: Reed Manufacturing – Analysis


    +   Step 1: Develop the hypotheses.


    H₀ : μ₁ = μ₂ = μ₃ = ⋯ = μₖ

    Hₐ : Not all population means are equal


    where:


    μ₁ = mean number of hours worked per week by the managers at Plant 1


    μ₂ = mean number of hours worked per week by the managers at Plant 2


    μ₃ = mean number of hours worked per week by the managers at Plant 3


    +   Step 2: Specify the level of significance. α = .05'
  - '[PAGE 301]


    # Example: Reed Manufacturing – Analysis


    +   Step 3: Compute the value of the test statistic.


    x̄ = (55 + 68 + 57)/3 = 60

    SSTR = 5(55 − 60)² + 5(68 − 60)² + 5(57 − 60)² = 490

    MSTR = 490/(3 − 1) = 245

    SSE = 4(26.0) + 4(26.5) + 4(24.5) = 308

    MSE = 308/(15 − 3) = 25.667

    F = MSTR/MSE = 245/25.667 = 9.55


    +   ANOVA Table


    | Source of Variation | Sum of Squares | Degrees of Freedom | Mean Square | F
    | p-Value |

    |---|---|---|---|---|---|

    | Treatment | 490 | 2 | 245 | 9.55 | .0033 |

    | Error | 308 | 12 | 25.667 |  |  |

    | Total | 798 | 14 |  |  |  |'
  - '[PAGE 302]


    # Example: Reed Manufacturing – Analysis


    +   Step 4: Rejection rule


    +   p-Value Approach


    Compute the p-value. With 2 numerator d.f. and 12 denominator d.f., the p-value
    is .01 for F = 6.93. Therefore, the p-value is less than .01 for F = 9.55.


    Determine whether to reject H₀. The p-value ≤ .05, so we reject H₀.


    +   Critical Value Approach


    Determine the critical value and rejection rule. Based on an F distribution with
    2 numerator d.f. and 12 denominator d.f., F₀.₀₅ = 3.89. Reject H₀ if F ≥ 3.89


    Determine whether to reject H₀. Because F = 9.55 > 3.89, we reject H₀.


    +   Step 5: Conclusion


    We can conclude that the mean number of hours worked per week by department managers
    is not the same at all 3 plants.


    But there is no evidence to support the difference coming from the location.


    No causality: Location ≠ Number of hours worked per week'
  - "[PAGE 303]\n\n# What We Have Done\n\n+   - **AN**alysis **of V**ariance (**ANOVA**,\
    \ 方差分析) is a statistical procedure used to compare **means** among different **groups\
    \ (treatments)**.\n+   - We consider simple models for $x_{ij}$:\n+   \n+    \
    \ Model 1 (under $H_0$): $x_{ij} = \\mu + \\varepsilon_{ij}$  \n+     Model 2\
    \ (under $H_1$): $x_{ij} = \\mu + \\alpha_j + \\varepsilon_{ij}$\n\n+   - Construct\
    \ a **test statistic** as a variability ratio:\n+   \n+     $$F(k-1, n_T-k)=\\\
    frac{\\text{组间变差}}{\\text{组内变差}}=\\frac{SSTR/(k-1)}{SSE/(n_T-k)}$$\n+   \n+  \
    \   and reject $H_0$ if this ratio is **sufficiently large** (Rejection rule).\n\
    \n+   - **Casual inference**: experimental studies V.S. observational studies"
