  mdcn: "\n\n## 当 σ₁² 与 σ₂² 未知时的检验步骤\n\n- 检验统计量相同，但拒绝域不同。\n- p 值也不同。\n- 双侧检验：p 值 =\
    \ $P(|t| \\ge |t_{\\mathrm{obs}}| \\mid \\mu_1 - \\mu_2 = D_0)$\n- 上侧检验：p 值 =\
    \ $P(t \\ge t_{\\mathrm{obs}} \\mid \\mu_1 - \\mu_2 \\le D_0)$\n- 下侧检验：p 值 = $P(t\
    \ \\le t_{\\mathrm{obs}} \\mid \\mu_1 - \\mu_2 \\ge D_0)$\n\n|  | 双侧检验 | 上侧检验\
    \ | 下侧检验 |\n|---|---|---|---|\n| 假设 | $H_0: \\mu_1 - \\mu_2 = D_0$<br>$H_1: \\\
    mu_1 - \\mu_2 \\neq D_0$ | $H_0: \\mu_1 - \\mu_2 \\le D_0$<br>$H_1: \\mu_1 - \\\
    mu_2 > D_0$ | $H_0: \\mu_1 - \\mu_2 \\ge D_0$<br>$H_1: \\mu_1 - \\mu_2 < D_0$\
    \ |\n| 检验统计量 | $t = \\frac{\\bar{x}_1 - \\bar{x}_2 - D_0}{\\sqrt{s_1^2/n_1 + s_2^2/n_2}}$\
    \ | $t = \\frac{\\bar{x}_1 - \\bar{x}_2 - D_0}{\\sqrt{s_1^2/n_1 + s_2^2/n_2}}$\
    \ | $t = \\frac{\\bar{x}_1 - \\bar{x}_2 - D_0}{\\sqrt{s_1^2/n_1 + s_2^2/n_2}}$\
    \ |\n| 拒绝法则：临界值法 | 若 $\\|t_{\\mathrm{obs}}\\| \\ge t^*_{\\alpha/2}$，则拒绝 $H_0$\
    \ | 若 $t_{\\mathrm{obs}} \\ge t^*_{\\alpha,\\nu}$，则拒绝 $H_0$ | 若 $t_{\\mathrm{obs}}\
    \ \\le -t^*_{\\alpha,\\nu}$，则拒绝 $H_0$ |\n| 拒绝法则：p 值法 | 若 p 值 $\\le \\alpha$，则拒绝\
    \ $H_0$ | 若 p 值 $\\le \\alpha$，则拒绝 $H_0$ | 若 p 值 $\\le \\alpha$，则拒绝 $H_0$ |\n\n\
    ## 匹配样本：引出示例\n\n- 假设某制造企业的员工可以使用两种不同的方法来完成一项生产任务。\n- 为了最大化产量，公司希望找出总体平均完成时间更小的方法。\n\
    - 首先暂定假设两种生产方法的总体平均完成时间相同。于是，检验假设写为 $H_0: \\mu_1 = \\mu_2$，备择假设为 $H_a: \\mu_1\
    \ \\neq \\mu_2$。\n- 匹配样本设计：\n  - 随机抽取一组工人作为样本\n  - 每名工人先使用一种方法，然后再使用另一种方法\n  -\
    \ 两种方法的使用顺序被随机分配给工人。\n\n## 匹配样本的检验步骤\n\n- 假设我们收集了 *n* 名随机工人使用两种不同方法的完成时间\n  -\
    \ $(X_{1,1}, X_{2,1}), (X_{1,2}, X_{2,2}), \\dots, (X_{1,n}, X_{2,n})$ 是独立同分布的二元正态分布样本。\n\
    \  - $X_{1,i}$ 和 $X_{2,i}$ 是匹配且相关的样本。\n- 第 1 步：考虑双侧假设检验 $H_0: \\mu_1 = \\mu_2$，备择假设为\
    \ $H_a: \\mu_1 \\neq \\mu_2$。\n- 这可以转化为单总体均值假设检验。\n  - 令 $\\mu_d = \\mu_1 - \\\
    mu_2$，且 $Y_i = X_{1,i} - X_{2,i}$，其中 $i = 1, 2, \\dots, n$。\n  - 原假设等价于 $H_0:\
    \ \\mu_d = 0$。\n- 第 2-4 步：然后，可以基于新样本 $Y_1, Y_2, \\dots, Y_n$，使用单样本 t 检验来拒绝或接受\
    \ $H_0$。\n\n## 匹配样本与独立样本的对比\n\n- **匹配（配对）样本：**一个样本中的成员可以用来确定另一个样本中的成员。\n  - 前测/后测：在事件/处理/干预发生前后，从相同的个体单位收集数据。\n\
    \  - 交叉试验：个体被随机分配到两种处理方案，然后同一批个体再交叉到另一种处理方案。\n  - 匹配样本：个体按个人特征进行匹配，例如同性别、同年龄的吸烟者与不吸烟者。\n\
    \  - 重复测量：相同的生物样本，例如双胞胎。\n  - 其他：一个样本中的每个数据点与第二个样本中的某个数据点唯一匹配的任何情况，例如夫妻。\n\n-\
    \ **使用匹配样本的优点：**匹配对之差的样本标准差（s.d.）将小于不匹配对。为什么？\n- **回答：**由于两组之间存在相关性，匹配对之间的差异应该很小。\n\
    \n## 两个总体比例的检验：引出示例\n\n- 一家税务准备公司想要比较两个地区办公室的工作质量。\n- 通过在每个办公室随机抽取已准备的纳税申报表，该公司可以估计每个办公室错误申报表所占的比例。\n\
    - 第 1 步：该公司想要检验这些比例之间是否存在差异：$H_0: p_1 = p_2$，备择假设为 $H_a: p_1 \\ne p_2$。\n- 这是一个**两个（独立）总体比例的双侧检验**。一般来说，检验可以是双侧、上侧或下侧。\n\
    \n"
