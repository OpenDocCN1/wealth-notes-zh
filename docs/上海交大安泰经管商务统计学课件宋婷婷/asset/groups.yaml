    +   • 泡查中我们发现在1000不学生中，440学生分 餐作为首三。想构 造 95%的报信为线条类异体性学生首三 餐的比例。


    +   • n = 1000, p̄ = 440/1000 = 0.44, zα/2 = 1.96. Then, 0.44 ± 1.96√[0.44(1 −
