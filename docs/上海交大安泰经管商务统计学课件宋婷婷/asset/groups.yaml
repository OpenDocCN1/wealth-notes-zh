    - 通过对某系统样本的样本数据分析，我们发现样本标准差为5.5元，我们从5.5作为σ的初步值\n- 查表得z0.025 = 1.96\n- 利用前面的公式，我们试算所需样本容量为n\
    \ = 1.96² × 5.5² / 1 = 116.2. 我们取他117作为最终样本量\n\n## Interval Estimate of Population\
    \ Proportion p\n\n- The sampling distribution of \\(\\bar{p}\\) \\(\\xrightarrow{d}\\\
    ) N\\(p, \\sqrt{p(1-p)/n}\\) : approximated by a normal distribution whenever\
    \ np ≥ 5 and n(1-p) ≥ 5.\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_125_0.png)\n\
    \n## Interval Estimate of Population Proportion *p*\n\n**Example:** 统计. 规范\n\n\
    某校在现有在校1000名学生中，440学生分一餐作为首选。想构造95%的置信区间来估计总体该校学生三餐的比例。\n\n## Interval Estimate\
    \ of Population Proportion p\n\n## Example: 统计. 规范\n\n- 泡查中我们发现在1000名学生中，440学生分餐作为首选。想构造95%的置信区间来估计总体学生首选三餐的比例。\n\
    - n = 1000, p̄ = 440/1000 = 0.44, zα/2 = 1.96. Then, 0.44 ± 1.96√[0.44(1 − 0.44)/1000]\
    \ = 0.44 ± 0.031\n\n## Interval Estimate of Population Proportion p\n\n## Example:\
    \ 统计. 规范\n\n- 假设我们想要在99%的置信性保证样本比例与总体比例的误差在0.03范围内，要抽取多少样本？\n\n## Interval Estimate\
    \ of Population Proportion p\n\n## Example: 统计. 规模\n\n- 假设我们想要在99%的置信性下观察样本比例与总体比例的差异在0.03范围内，要抽取多少样本？\n\
