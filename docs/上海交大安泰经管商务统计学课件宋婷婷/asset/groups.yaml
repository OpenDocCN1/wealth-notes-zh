  mdcn: "\n\n## 伯克森悖论\n\n### 示例 1：美国大学申请\n\n- 两个常见要求：**高中 GPA** 和 **SAT** 成绩。\n- **问题：**\
    \ 对于学生而言，**高中 GPA** 与 **SAT** 之间有什么关系？\n- 你的猜测：高中 GPA 和 SAT 成绩是 **正相关** 的。\n-\
    \ **问题：** 对于就读于 **中档大学** 的学生，**高中 GPA** 与 **SAT** 之间有什么关系？\n- 现在你的猜测是什么？\n- **中档大学要求：**\
    \ GPA 达到足够高或 SAT 成绩达到足够高即可。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_29_0.png)\n\
    \n- **优秀组**：同时拥有高 GPA 和高 SAT 成绩的人很可能进入更高层次的学校。\n- **中等组**：实际就读该校的学生范围由图中蓝点给出。\n\
    - **结果：**\n  - 中档大学中呈现向下趋势\n  - 总体人群中呈现向上趋势\n- 一种选择偏差！\n\n### 示例 2：约会问题\n\n- 有趣事实：在你约会的人中（或你未来可能约会的人中），有吸引力的人往往是混蛋？\n\
    \  - 心理社会理论\n  - 一个简单的统计解释：选择偏差！\n    - 你选择约会对象取决于两个因素：吸引力和性格。\n\n| 吸引力 | Nice\
    \ (暖) | Mean (渣) |\n|---|---|---|\n| Attractive (美) | ✓ | ✓ |\n| Unattractive\
    \ (丑) | ✓ | × |\n\n结果：当你剔除了性格差且不吸引人的那类人时，这就造成了吸引力与性格之间虚假的负相关。\n\n## 辛普森悖论\n\n\
    ### 示例：性别偏见\n\n- 一些事实：某大学中女性和男性的入学率\n\n| 性别 | 申请者 | 录取 | 比例 |\n|---|---|---|---|\n\
    | Female | 120 | 50 | 42% |\n| Male | 120 | 25 | 21% |\n\n- 该校的男生抗议男性入学率过低。\n\n\
    - 你认为该大学存在性别歧视吗？\n\n- 详细事实：\n\n| 学校 | Female Applicant | Female Recruit | Female\
    \ Rate | Male Applicant | Male Recruit | Male Rate |\n|---|---|---|---|---|---|---|\n\
    | Business School | 100 | 49 | 49% | 20 | 15 | 75% |\n| Law School | 20 | 1 |\
    \ 5% | 100 | 10 | 10% |\n\n- 结论：若干不同数据集中的趋势，在这些数据集合并后，该趋势会消失或逆转。\n\n- 混杂变量：因为学校是一个不可忽略的隐藏变量。\n\
    \n## 总结：Seeing⇒Doing⇒Imagining\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_32_0.png)\n\
