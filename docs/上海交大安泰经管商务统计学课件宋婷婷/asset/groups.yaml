  mdcn: "\n\n## 实验设计\n\n### 实验时长\n\n- 问题5：我们需要运行实验多长时间？\n  - 视频自11月13日起已发布。\n  - 为避免季节性和新奇效应，我们将收集感恩节（11月26日）后5天起的数据。\n\
    \  - 我们将收集两周的数据，即12月1日至14日的COVID-19每日新增病例数。\n  - 你可以从Canvas下载数据集。\n- 现在让我们来处理这些数据。\n\
    \n## 分析结果\n\n- 本示例所需的数据可从Canvas下载。\n- 从数据中我们可以获得以下结果：\n\n| 县处理组 | 处理组均值 | 对照组均值\
    \ | p值 |\n|---|---:|---:|---:|\n| 全部 | 89.70 | 92.94 | 0.25 |\n| 低强度 | 98.24 |\
    \ 90.51 | 0.195 |\n| 高强度 | 87.03 | 99.63 | 0.052 |\n\n- 这些结果合理吗？\n- 是否还有其他因素可能影响结果？\n\
    - 在作业中，你将使用这些数据进行双因素方差分析。\n\n## BUSS2302：商务统计\n\n### 第8讲：非参数检验\n\n授课教师：宋婷婷\n\n\
    安泰经济与管理学院\n\n上海交通大学\n\n教材：Anderson, Sweeney, Williams, Camm 和 Cochran 所著《商务与经济统计》第13版，第18章（2018年出版）。\n\
    \n## 大纲\n\n- ① **非参数检验**\n  - 符号检验\n  - 曼-惠特尼-威尔科克森检验\n- ② **其他检验**\n  - 威尔科克森符号秩检验\n\
    \  - 克鲁斯卡尔-沃利斯检验\n\n## 大纲\n\n- 非参数检验\n  - 符号检验\n  - 曼-惠特尼-威尔科克森检验\n- 其他检验\n  -\
    \ 威尔科克森符号秩检验\n  - 克鲁斯卡尔-沃利斯检验\n\n## 参数t检验失效时\n\n- 检验统计量：t统计量\n\n$$\nt = \\frac{\\\
    bar{X}_1 - \\bar{X}_2}{\\sqrt{S^2\\left(\\frac{1}{n_1}+\\frac{1}{n_2}\\right)}}\
    \ \\quad \\text{其中} \\quad S^2 = \\frac{(n_1-1)s_1^2 + (n_2-1)s_2^2}{n_1+n_2-2}\n\
    $$\n\n- 在数据集A中：$s_1^2 = 9.2$，$s_2^2 = 17.5$\n- 在数据集B中：$s_1^2 = 9.2$，$s_2^2 = 2335$\n\
    - **结论：** 均值检验统计量受到极端异常值的严重影响。\n\n## 何时使用非参数方法\n\n原则：如果参数方法和非参数方法均可使用\n\n- 在**假设正确**（例如正态分布）的情况下，参数方法会比非参数方法更**高效**且**有力**。\n\
    - 如果正态性假设被严重违反（例如存在极端异常值），非参数检验可能比相应的参数检验更**高效**且**有力**。\n\n如果你只有定性数据，非参数检验可能是唯一的选择。\n\
    \n## 符号检验：检验总体中位数\n\n- Lawler杂货连锁店根据制造商估计每店每周中位销售额应为450美元，决定引进一款新的薯片产品。\n- 三个月后，Lawler的管理层要求对总体周销售额中位数进行假设检验：\n\
    \n$H_0: \\text{中位数} = 450, \\quad \\text{备择假设} \\quad H_a: \\text{中位数} \\neq 450$\n\
    \n- 数据：从Lawler的$n = 10$家门店随机抽取的一周销售额\n\n| 门店编号 | 周销售额（美元） | 门店编号 | 周销售额（美元） |\n\
    |---:|---:|---:|---:|\n| 56 | 485 | 63 | 474 |\n| 19 | 562 | 39 | 662 |\n| 36\
    \ | 415 | 84 | 380 |\n| 128 | 880 | 102 | 515 |\n| 12 | 426 | 44 | 721 |\n\n##\
    \ 使用二项分布进行检验\n\n- 对于每个观测值，如果大于450则记录符号“+”，否则记录符号“−”。\n- 如果中位数为450，则应有50%的加号和50%的减号。\n\
    - 一般来说，“+”的个数$X$服从$B(n,p)$，其中$p$为某个概率。\n- 符号检验将关于中位数的原假设转化为关于二项概率$p$的假设：\n\n$H_0:\
    \ p = 0.5$，备择假设 $H_a: p \\ne 0.5$\n\n| 门店编号 | 周销售额（美元） | 符号 | 门店编号 | 周销售额（美元）\
    \ | 符号 |\n|---:|---:|:---:|---:|---:|:---:|\n| 56 | 485 | + | 63 | 474 | + |\n\
    | 19 | 562 | + | 39 | 662 | + |\n| 36 | 415 | − | 84 | 380 | − |\n| 128 | 880\
    \ | + | 102 | 515 | + |\n| 12 | 426 | − | 44 | 721 | + |\n\n"
