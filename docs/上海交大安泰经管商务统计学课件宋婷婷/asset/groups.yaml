  mdcn: "\n## 1 引言\n- 动机\n- 什么是抽样？\n- 为什么抽样？\n- 抽样误差\n\n## 抽样方法\n\n## 点估计与抽样分布\n\n\
    ## 总结\n\n## 动机\n交叉熵无方向！\n\n- 上牌交会性学阅行（da）校（huang）为占地发5000亩，乱三敖规校立统。7个，描个线复为附发都三个人绕。，在某些墓华线复为合组二两个线。\n\
    - 作为性二对夸的学长掌握，想布议学生对学枝说。的组价，这性新生 侍文性美（maikeng）万阔！\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_56_0.png)\n\
    \n## 动机\n变性概率的！\n\n- 有感以下几种方案：\n  - 表校布致股票有交性美绩意见了呢(KOL)，根据意见了踢出议制定交性美锐行动。\n \
    \ - 样个锐。门袋安排未锐感组，茶集学生对于若锐。的美锐出议。\n  - 二月十二会众公开交性美锐投票主动，根据投票信息创作交性美锐方面。\n\n- 作为商务统计的刘秀学生代表，你计划提出更为发学三么的方案制定交性美锐行动！\n\
    \  - 抽样（Sampling）\n  - 点估计（Point estimation）\n\n## 什么是抽样？\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_58_0.png)\n\
    \n- 总体（population）是所关注的所有元素的集合。\n- 样本（sample）是总体的一个子集。\n\n## 为什么抽样？\n- 在实践中，由于数据收集成本过大，总体的完整数据**难以获取**。\n\
    - **抽样（Sampling）**旨在收集部分总体数据，以对总体特征进行**推断**。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_59_0.png)\n\
    \n## 抽样误差\n- 采用**适当的抽样**方法，**样本结果**将为总体参数提供“良好”的估计。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_61_0.png)\n\
    \n- 换句话说，我们希望最小化抽样误差。\n\n## 抽样方法\n- 抽样类别\n- 简单随机抽样\n- 分层随机抽样\n- 整群抽样\n\n## 引言\n\
    \n## 点估计与抽样分布\n\n## 总结\n\n## 抽样类别\n概率抽样：总体中的每个元素被抽中的机会相等。\n\n- 简单随机抽样（simple random\
    \ sampling）\n- 分层随机抽样（stratified random sampling）\n- 整群抽样（cluster sampling）\n\
    - 系统抽样（systematic sampling）\n\n非概率抽样（non-probability sampling）：总体中的元素取决于研究者的主观判断或便利性，而非随机选择。\n\
    \n- 便利抽样：按便利性\n- 判断抽样：按专家经验\n\n## 简单随机抽样\n简单随机抽样：给定样本量 n 和总体规模 N，每个可能的样本量为 n 的样本被选中的概率相同。\n\
    \n示例（美纸纸纸）：假设该行校为 乱三9000复学生，我们想从中抽取1200复学生，若概何在简单纯为抽样？\n\n1. 为学生编号 1 到 9000。\n\
    2. 生成一个随机数字表。\n3. 从表中按四位一组选择随机数字。\n4. 如果数字大于 9000，则丢弃。\n\n参见下面的随机数字表。\n\n## 简单随机抽样\n\
    - 我们可以从表中的任意位置开始选择随机数字，并沿我们选择的方向系统地移动：\n  - 例如，我们从 9986（即第二个数字的后四位）开始。它大于 9000，因此被丢弃。\n\
    - 然后，接下来的四位数字（即 7174）小于 9000，因此被选中。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_65_0.png)\n\
    \n- 注意：当我们提到简单随机抽样时，我们假定抽样是不放回的。\n\n## 简单随机抽样\n- 如果总体无限大怎么办？\n\n- 释义：概率我们在度打劳对百客四六行简单随机为抽样，百客的数量发格丸呢，那么我们可以随为抽取1200复百客?\n\
    \n1. 每个被选中的元素必须来自同一个总体\n   - 例如，从购买商品的人中抽样，因为有些人可能只是来使用洗手间。\n\n2. 每个元素是独立抽取的\n\
    \   - 例如，每当一位顾客出示折扣券（随机且独立于其他顾客）时，就选择下一位接受服务的顾客。\n\n## 分层随机抽样（Stratified Random\
    \ Sampling）\n1. 首先根据某些特征将总体中的元素划分为称为层的组。\n2. 层形成后，从每层中抽取一个简单随机样本。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_67_0.png)\n"
