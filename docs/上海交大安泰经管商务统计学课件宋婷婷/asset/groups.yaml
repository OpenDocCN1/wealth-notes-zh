    \    - (a) \\(H_0: \\mu \\ge 330\\)， versus \\(H_a: \\mu < 330\\)\n    - (b) \\\
    (H_0: \\mu \\le 330\\)， versus \\(H_a: \\mu > 330\\)\n    - (c) \\(H_0: \\mu =\
    \ 330\\)， versus \\(H_a: \\mu \\ne 330\\)\n\n如果制造商想知道瓶装灌装过程是否正常运行会怎样？\n\n## 方差已知时检验总体均值\n\
    \n- 假设我们收集 \\(n\\) 个 i.i.d. 样本 \\(X_1, X_2, \\ldots, X_n\\) 且 \\(X_i \\sim N(\\\
