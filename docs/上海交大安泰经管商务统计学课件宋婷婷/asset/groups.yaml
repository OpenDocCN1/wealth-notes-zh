    # Terminology of A/B tests


    +   - Terminology of A/B tests:

    +     - **Overall Evaluation Criterion (OEC) (综合评估指标)**: A quantitative measure
    of the experiment''s objective, also called the *response or dependent variable
    (采测变量)*

    +     - **Parameter (参数)**: A controllable experimental variable that is thought
    to influence the OEC or other metrics of interest, sometimes also called *factors
    or variables (因子)*

    +     - **Variant (变体)**: A user experience being tested, typically by assigning
    values to parameters (*Treatments 处理*)

    +     - **Randomization Unit (随机化单元)**: A pseudo-randomization process is applied
    to units (e.g., users or pages) to map them to variants (*Experiment units 实验对象*)'
