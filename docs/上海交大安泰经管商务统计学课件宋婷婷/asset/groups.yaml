    \\]\n\n- Taking square root, we get **interval estimator** for standard deviation\n\
    \n\\[\n\\sqrt{\\frac{(n-1)s^2}{\\chi^2_{\\alpha/2}}} \\leq \\sigma \\leq \\sqrt{\\\
    frac{(n-1)s^2}{\\chi^2_{(1-\\alpha/2)}}}\n\\]\n\n## Example——蜜雪冰城\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_205_0.png)\n\
