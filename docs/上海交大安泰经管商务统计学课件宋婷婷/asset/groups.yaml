  - "[PAGE 286]\n\n# Notations\n\n+   - A simple random sample of size $n_j$ has been\
    \ selected from each of the $k$ treatments.\n\n+   - $x_{ij}$: value of observation\
    \ $i$ for treatment $j$\n\n+   - Sample mean and sample variance within treatment\
    \ $j$ are\n+   \n+   $$\\bar{x}_j = \\frac{1}{n_j} \\sum_{i=1}^{n_j} x_{ij}$$\
    \ \n+   \n+   $$s_j^2 = \\frac{1}{n_j - 1} \\sum_{i=1}^{n_j} (x_{ij} - \\bar{x}_j)^2$$\n\
    \n+   - The overall sample mean between treatments is\n+   \n+   $$\\bar{\\bar{x}}\
    \ = \\frac{1}{n_T} \\sum_{j=1}^{k} \\sum_{i=1}^{n_j} x_{ij}, \\text{ where } n_T\
