- raw:
  - '[PAGE 80]


    # Sampling Distribution of \bar{x}


    +   - **Form of the Sampling Distribution of \bar{x}**

    +     1. The population has a normal distribution

    +        - The sampling distribution of \bar{x} is normally distributed for any
    sample size.

    +     2. The population does not have a normal distribution

    +        - We need the sample size to be large, then the sampling distribution
    of \bar{x} is approximately normal (Central Limit Theorem).


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_80_0.png)'
  - '[PAGE 81]


    # Sampling Distribution of x̄


    +   - The practical value of sampling distribution for x̄

    +     - We cannot expect the sample mean x̄ to exactly equal the population mean
    μ.

    +     - Given the sampling distribution, we can provide probability information
    about the gap between x̄ and μ.


    +   - Example: 纸. 组织(计算误差在0.5分以内的概率)

    +     - Given that μ=6, σ=1 and sample size n is 16.

    +     - E(x̄)=μ=6; σ_x̄ = σ/√n =0.25


    Pr{5.5 ≤ x̄ ≤ 6.5}

    = Pr{ (5.5 − E(x̄))/σ_x̄ ≤ (x̄ − E(x̄))/σ_x̄ ≤ (6.5 − E(x̄))/σ_x̄ }

    ≈ Φ(2) − Φ(−2) = 0.9544


    +   - The probability that |x̄ − μ| ≤ 0.5 is 95.44%'
  - '[PAGE 82]


    # Sampling Distribution of x̄


    +   How about if we increase the size of sample from 16 to 25?


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_82_0.png)


    +   1. As the sample size is increased, the standard error of the mean decreases.


    +   2. The larger sample size provides a higher probability that the sample mean
    is within a specified distance of the population mean.


    +   After-class exercise: Try to estimate the probability when the sample size
    increases from 16 to 25.'
  - '[PAGE 83]


    # Sampling Distribution of p̂


    +   - The sample proportion p̂ is the point estimator of the population proportion
    p.

    +   - Recall that: p̂ = x / n

    +     - x = the number of elements in the sample that possess the characteristic
    of interest

    +   - p̂ is also a random variable.

    +   - Its probability distribution is called the sampling distribution of p̂.

    +   - Similarly, to determine how close the sample proportion p̂ is to the population
    proportion p, we need to understand the following:

    +     1. The expected value or mean of p̂;

    +     2. The standard deviation of p̂;

    +     3. The shape or form of the sampling distribution of p̂.'
  - '[PAGE 84]


    # Sampling Distribution of $\bar{p}$


    +   - The population distribution is **Bernoulli distribution**. So the sampling
    distribution of $\bar{p}$ is not exact normal.


    +   - Recall that:


    +     - Suppose we randomly pick up $n$ i.i.d. students. Here $X_i = 1$ indicates
    a female student and $X_i = 0$ indicates a male student, i.e.,


    $X_i \sim \operatorname{Bernoulli}(p),\ \text{for } i = 1, 2, \ldots, n.$


    $P(X = 1) = p$


    $P(X = 0) = 1 - p$


    $\mu \equiv E(X) = p$


    $\sigma^2 \equiv Var(X) = E(X^2) - E(X)^2 = p(1-p)$'
  - '[PAGE 85]


    <!-- no content -->'
  - '[PAGE 86]


    # Sampling Distribution of $\bar{p}$


    +   - **The Practical Value of sampling distribution for $\bar{p}$**

    +     - As similar to $\bar{x}$, given the sampling distribution, we can provide
    probability information about the gap between $\bar{p}$ and $p$.

    +     - **Example:** 统 组（假设对这 组，给定 25 个 6 的人数占主打人数的比率 $p=40\%$，随机为抽取 25 位学生的组织算到地计值
    $\bar{p}$，计算 $\bar{p}$ 的误差在 0.05 以内的概率）

    +       - Given that $p=0.4$, sample size $n$ is 25.

    +       - $E(\bar{p})=p=0.4$; $\sigma_{\bar{p}}=\sqrt{\frac{p(1-p)}{n}}=0.098$

    +       - $Pr\{0.35\leq\bar{p}\leq0.45\}=Pr\left\{\frac{0.35-E(\bar{p})}{\sigma_{\bar{p}}}\leq\frac{\bar{p}-E(\bar{p})}{\sigma_{\bar{p}}}\leq\frac{0.45-E(\bar{p})}{\sigma_{\bar{p}}}\right\}$

    +       - $\approx\Phi(0.51)-\Phi(-0.51)=0.39$

    +       - The probability that $|\bar{p}-p|\leq0.05$ is only 39%

    +     - Similarly, the **larger sample size** provides a **higher probability**
