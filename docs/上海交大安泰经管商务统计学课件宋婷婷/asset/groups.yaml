  - '[PAGE 145]


    # Motivating Example: Quality Control


    +   - A factory purchased a new automated assembly line, and wants to monitor
    the quality of its manufacturing process.

    +   - It is known that, when operating properly, the measure of output follows
    the normal distribution with mean equal to 12.

    +   - The client wants to know: Is the process operating properly now?


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_145_0.png)


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_145_1.png)


    +   - **Solution:** Take random samples to test whether the population mean is
    12.'
