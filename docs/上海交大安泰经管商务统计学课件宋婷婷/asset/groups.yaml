  - '[PAGE 142]


    # A Quick Overview of Hypothesis Testing


    # Step 5: Arrive at the decision.


    +   - The conclusions are not always correct because they are drawn based on random
    samples.

    +   - Two types of errors

    +     - Type I error: Rejecting H₀ when it is true (False positive, 均质性)

    +     - Type II error: Accept H₀ when it is false (False negative, 均质性)


    | | Population Condition | |

    | | H₀ True | Hₐ True |

    | Conclusion | Accept H₀ | Correct | Type II Error |

    | | Reject H₀ | Type I Error | Correct |


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_142_0.png)'
  - '[PAGE 143]


    # A Quick Overview of Hypothesis Testing


    # Step 5: Arrive at the decision – How to control the errors?


    +   - Type I Error

    +     - Significance level α sets the maximal probability of making the Type I
    error.

    +     - Significance tests: hypothesis tests that only control type I error.

    +     - In a significant test, we usually use the term ‘Not Reject H₀’ instead
    of ‘Accept H₀’.


    +   - Type II Error

    +     - Controlling for Type II error in hypothesis testing can be done through
    Power Analysis.'
  - '[PAGE 144]


    # Introduction to Hypothesis Testing


    # Hypothesis Tests with One Population


    +   - Testing for Population Mean

    +   - Testing for Population Proportion

    +   - Type II Error


