    \ = \\Phi^{-1}(1 - \\alpha/2)\\) 来实现显著性水平 \\(\\alpha\\)。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_149_0.png)\n\
    \n- **步骤 5：** 将检验统计量与临界值进行比较，我们做出拒绝 \\(H_0\\) 或不拒绝 \\(H_0\\) 的决策。\n\n### p 值法\n\
    \n- p 值提供额外信息：拒绝或不拒绝的强度。\n- p 值：给定 \\(H_0\\) 为真时，观察到样本值与所观察值一样极端或更极端的概率。\n\n \
    \ p 值 = \\(P(|z| \\ge |z_{\\mathrm{obs}}| \\mid \\mu = \\mu_0)\\)\n\n- 在统计检验中，p\
    \ 值被用作样本提供的反对 \\(H_0\\) 的证据的度量。\n- 更小的 p 值表示对原假设的证据更强。\n- **步骤 5：** 使用 p 值法的拒绝规则是如果\
    \ p 值 ≤ \\(\\alpha\\) 则拒绝 \\(H_0: \\mu = \\mu_0\\)。\n\n### 对其他假设的扩展\n\n- 上尾和下尾假设的检验程序类似。\n\
    - **步骤 1：** 考虑上尾假设 \\(H_0: \\mu \\le \\mu_0 \\quad \\text{versus} \\quad H_a:\
    \ \\mu > \\mu_0\\)。\n- **步骤 2：** 选择显著性水平 \\(\\alpha\\)。\n- **步骤 3：** 使用相同的检验统计量\
    \ \\(z\\)。\n- **步骤 4 & 5：** 我们在 \\(z \\ge z_\\alpha\\) 时拒绝 \\(H_0\\)，其中临界值 \\\
    (z_\\alpha\\) 被选择使得显著性水平为 \\(\\alpha\\)。\n- **p 值法：** p 值 = \\(P(z \\ge z_{\\\
    mathrm{obs}} \\mid H_0)\\)。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_151_0.png)\n\
    \n### 当总体不是正态分布时\n\n- 如果总体服从正态分布，即使样本量很小，Z 检验和 T 检验都适用（T 检验更受青睐）。\n- 如果总体不是正态分布，则需要更大的样本量。\n\
    \  - 教科书建议：\\(n \\ge 30\\)。\n- 如果总体不是正态分布，且样本量很小，我们可能使用非参数方法。\n\n### 与区间估计的关系\n\
    \n- 对于 \\(\\sigma\\) 已知的正态总体，\\(\\mu\\) 的 \\((1 - \\alpha)\\%\\) 置信区间由\n\n  \\\
    [\n  \\bar{x} \\pm z_{\\alpha/2}\\frac{\\sigma}{\\sqrt{n}}\n  \\]\n\n  给出。\n\n\
    - 我们知道 \\((1 - \\alpha)\\%\\) 的置信区间会包含总体均值。\n- 因此，我们也可以使用置信区间来进行双尾检验 \\(H_0: \\\
    mu = \\mu_0\\) versus \\(H_1: \\mu \\ne \\mu_0\\)。\n  - 选择一个简单随机样本并建立 \\((1 -\
    \ \\alpha)\\%\\) 置信区间。\n  - 如果它包含假设值 \\(\\mu_0\\)，则不拒绝 \\(H_0\\)；否则，拒绝 \\(H_0\\\
    )。\n\n"
