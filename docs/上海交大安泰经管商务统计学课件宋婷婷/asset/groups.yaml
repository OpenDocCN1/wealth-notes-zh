  mdcn: "\n\n## 本次课的主要目标\n\n- 领会方差分析 ANOVA\n  - 用于广泛检验问题\n  - 方差分析的定义\n  - 方差分析的组间变异、统计量\n\
    - 有代表性的方差分析\n  - 单因素方差分析\n  - 单因素方差分析（组间分析）\n  - 双因素方差分析\n- 领会方差分析中如何进行实验和设计\n\
    \  - 方差分析中均有因素影响\n\n在我们开始严密的理论构架之前，我们不妨先这样来认识实际问题……\n\n## 舌尖上的交大\n\n- 上海交通大学闵行校区共有7个校内食堂，想通过调查学生对食堂的评价制定一份美食指南。\n\
    - 受人力所限，只在饭点采集信息，并调查大家对一餐、二餐、四餐进行了连续评价，评选出受学生欢迎的食堂。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_266_0.png)\n\
    \n### 舌尖上的交大：案例引入\n\n- 假设随机抽取100名学生对一餐、二餐、四餐分别打分。\n- 样本均值分别为6.5、7、6分，差异显著？二餐 >\
    \ 一餐 > 四餐？\n- 仅凭样本均值能否作出此判断？\n\n## Example: A Survey about Dining Hall\n\n- 为了调查学生对不同食堂的评价，对一餐食堂、二餐食堂和四餐食堂进行了调查。\n\
    - 我们想知道学生对三个食堂的评价是否存在显著差异。\n- 实验过程如下：\n  - 为调查三个食堂的评价，设计了问卷并分发给学生。\n  - 最后，共收集到139份答卷。\n\
    \n## Example: A Survey about Dining Hall – Analysis\n\n- 最受欢迎的菜品\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_271_0.png)\n\
    \n## Introduction\n\n- ANalysis Of VAriance (ANOVA, 方差分析) 是一种用于检验三个或更多总体均值是否相等的统计方法。\n\
    - 我们希望利用样本结果检验以下假设：\n\n\\[\nH_0: \\mu_1 = \\mu_2 = \\mu_3 = \\cdots = \\mu_k =\
    \ \\mu\n\\]\n\n\\[\nH_a: \\text{Not all population means are equal}\n\\]\n\n-\
    \ 如果拒绝 \\(H_0\\)，所有总体均值都不同（×）。为什么？\n\n## ANOVA: Motivation Models\n\n- **目标：**\
    \ 比较不同组别（处理）之间的均值。\n- **ANOVA** 通过识别数值因变量 \\(X = \\{x_{ij}\\}\\) 中的变异来源来实现上述目标。\n\
    \  - \\(j\\) 表示受试者所属的组别，从 \\(1, \\dots, k\\)。\n  - \\(i\\) 表示组内第 \\(i\\) 个样本，从\
    \ \\(1, \\dots, n_j\\)。\n- 我们考虑 \\(x_{ij}\\) 的一个简单模型：\n  - Model 1（在 \\(H_0\\\
    ) 下）：\\(x_{ij} = \\mu + \\varepsilon_{ij}\\)。\n  - Model 2（在 \\(H_a\\) 下）：\\(x_{ij}\
    \ = \\mu + \\alpha_j + \\varepsilon_{ij}\\)。\n- 直观上，Model 1 下 \\(X\\) 的变异仅来自误差项\
    \ \\(\\varepsilon_{ij}\\)。\n- 但 Model 2 下 \\(X\\) 的变异来自两个来源：处理调整 \\(\\alpha_j\\\
    ) 和误差项 \\(\\varepsilon_{ij}\\)。\n\n## ANOVA: A Graphic Interpretation\n\n- 给定样本均值的观测值，如何判断它们来自\
    \ Model 1 还是 Model 2？\n- **基本思想：** 当 *样本均值之间的变异* 较大时，则 Model 1（\\(H_0\\)）更可能被拒绝。\n\
    - **问题：** 比较的基准是什么？\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_275_0.png)\n\n\
    Figure: Sample observations\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_276_0.png)\n\
    \nFigure: Sample observations\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_277_0.png)\n\
