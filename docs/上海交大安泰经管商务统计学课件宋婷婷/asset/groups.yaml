    \ = \\sqrt{\\frac{1}{12} n_1 n_2 (n_1 + n_2 + 1)}$\n- 对于大样本（即 $n_1 \\ge 7$ 且 $n_2\
    \ \\ge 7$），我们可以使用正态近似。\n- 在我们的例子中，$n_1 = 12$, $n_2 = 10$, $\\mu_W = 138$, $\\\
    sigma_W = 15.1658$, 所以 p 值\n- $p\\text{-value} = 2 \\times P\\left(N(0,1) \\ge\
    \ \\frac{169.5 - 0.5 - 138}{15.1658}\\right) = 0.0378 < \\alpha$\n- 我们拒绝 $H_0$。\n\
    \n## 非参数检验汇总\n\n| 非参数检验 | 其作用 | 参数对应检验 |\n| --- | --- | --- |\n| 秩检验 | 将 1 个中位数与指定值进行比较\
    \ | 1 样本 Z 检验/T 检验 |\n|  | 比较 2 个配对中位数 | 配对样本 T 检验 |\n| Wilcoxon 符号秩检验 | 比较 2\
    \ 个配对中位数 | 配对样本 T 检验 |\n| MWW 检验 | 比较 2 个独立中位数 | 2 样本 T 检验 |\n| Kruskal-Wallis\
    \ 检验 | 比较 3 个或更多中位数 | 单因素方差分析 |\n\n## Wilcoxon 符号秩检验\n\n- Wilcoxon 符号秩检验是对配对样本实验数据进行分析的一种方法。\n\
    - 该检验使用定量数据，但不需要假设配对观测值之间的差异呈正态分布。\n- 它仅要求差异具有 *对称* 分布的假设。\n- 当两个总体形状相同时就会出现这种情况，并且重点在于确定两个总体中位数之间是否存在差异。\n\
    \n## 示例\n\n- 一家制造公司试图确定两种生产方法在任务完成时间方面是否存在差异。\n- 假设：\n  - H₀ : medianₐ = medianᵦ,\
    \ versus Hₐ : medianₐ ≠ medianᵦ\n- 显著性水平设定为 α = 0.05。\n- 11 名随机选择的工人使用两种方法各完成一次生产任务，一次使用方法\
    \ A，一次使用方法 B。\n- 工人首先使用的方法是随机选择的。\n\n## 步骤\n\n- 丢弃差值为 0 的情况并计算绝对差值\n- 对绝对差值进行排序；对于相同的值，每个值分配秩的平均值\n\
    - 计算正符号秩之和，$T^+$\n\n| 工人 | x₁ | y₁ | 差值 | 绝对差值 | 秩 | 符号秩：负 | 符号秩：正 |\n| --- |\
    \ ---: | ---: | ---: | ---: | ---: | ---: | ---: |\n| 1 | 10.2 | 9.5 | 0.7 | 0.7\
    \ | 1 |  | 0.7 |\n| 2 | 10.6 | 9.9 | 0.7 | 0.7 | 2 |  | 0.7 |\n| 3 | 9.2 | 10.3\
    \ | -1.1 | 1.1 | 4.5 | -1.1 |  |\n| 4 | 10.6 | 10.0 | 0.6 | 0.6 | 3 |  | 0.6 |\n\
    | 5 | 10.9 | 10.3 | 0.6 | 0.6 | 3 |  | 0.6 |\n| 6 | 10.2 | 9.3 | 0.9 | 0.9 | 5\
    \ |  | 0.9 |\n| 7 | 10.6 | 10.5 | 0.1 | 0.1 | 1 |  | 0.1 |\n| 8 | 10.9 | 10.3\
    \ | 0.6 | 0.6 | 3 |  | 0.6 |\n| 9 | 11.2 | 10.6 | 0.6 | 0.6 | 3 |  | 0.6 |\n|\
    \ 10 | 10.7 | 10.2 | 0.5 | 0.5 | 3 |  | 0.5 |\n| 11 | 10.6 | 10.2 | 0.4 | 0.4\
    \ | 2 |  | 0.4 |\n\n正符号秩之和 $T^+ = 49.5$\n\n## Kruskal-Wallis 检验\n\n- Mann-Whitney-Wilcoxon\
    \ 检验已被 Kruskal 和 Wallis 扩展到三个或更多总体的情况。\n- Kruskal-Wallis 检验既可用于顺序数据，也可用于区间或比率数据。\n\
    - 此外，Kruskal-Wallis 检验不需要总体正态分布的假设。\n\n"
