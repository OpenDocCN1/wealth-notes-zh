    ## Example


    - Hypotheses:

    - H₀: σ₁² = σ₂²

    - Hₐ: σ₁² ≠ σ₂²

    - Population 1 represents the one providing the larger sample variance.


    - Test statistics:

    - F = s₁² / s₂² = 1.768 / 0.700 = 2.53


    - Rejection Rule: Reject H₀ if F ≥ Fₐ/₂


    - The F distribution table shows that with α/2 = 0.05, 9 d.f. (numerator), and
    9 d.f. (denominator), F₀.₀₅ = 3.18.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_223_0.png)


    ## Summary of Testing About Two Population Variance


    |  | One-tailed Test | Two-tailed Test |

    |---|---|---|

    | **Hypotheses** | $H_0: \sigma_1^2 \leq \sigma_2^2$  $H_a: \sigma_1^2 > \sigma_2^2$
    | $H_0: \sigma_1^2 = \sigma_2^2$  $H_a: \sigma_1^2 \neq \sigma_2^2$ |

    | **Test Statistic** | $F = \frac{s_1^2}{s_2^2}$ | $F = \frac{s_1^2}{s_2^2}$ |

    | **Rejection rule: Critical value approach** | Reject $H_0$ if $F \geq F_{\alpha}(n_1-1,
    n_2-1)$ | Reject $H_0$ if $F \geq F_{\alpha/2}(n_1-1, n_2-1)$ |

    | **Rejection rule: p-value approach** | Reject $H_0$ if p-value $\leq \alpha$
    | Reject $H_0$ if p-value $\leq \alpha$ |


    ## Inferences About Population Variances


    ## Testing for Three or More Proportions


    - Multiple Comparison Procedure

    - Chi Square Test


    ## Testing for Independence


