    ## Testing the Equality of Population Proportions


    Three or More


    - Using the notation


    $p_i =$ population proportion for population $i$


    ### 1. State the Hypotheses: the equality of population proportions when $k \ge
    3$ are as follows:


    $H_0: p_1 = p_2 = \cdots = p_k$

    $H_a:$ Not all population proportions are equal


    - Fail to Reject: If $H_0$ cannot be rejected, we cannot detect a difference among
    the $k$ population proportions.

    - Reject: If $H_0$ is rejected, we can conclude that not all $k$ population proportions
    are equal.

    - Further analyses can be done to conclude which population proportions are significantly
    different from others.


    ## Construct Test Statistics


    Expected Frequencies


    - If $H_0$ is true, how many BYD Han owners would you expected to indicate a ‘Yes’?

    - If $H_0: p_1 = p_2 = p_3$ is true, the best estimate of the proportion in the
    overall sample proportion $\hat{p} = 312/502 = 0.624$.

    - Therefore, we would expect $0.624 \times 125 = 78$ BYD Han owners to indicate
    they are likely to repurchase the Han.


    - In general, the expected frequencies under the assumption $H_0$ is correct


    $$e_{ij} = \frac{(\text{Row } i\text{ Total})(\text{Column } j\text{ Total})}{\text{Total
    Sample Size}}$$


    - If a significant difference exists between the observed and expected frequencies,
    $H_0$ can be rejected.


    ## Construct Test Statistics


    Chi-Square Test Statistic


    - The test procedure for comparing the observed frequencies with the expected
    frequencies involves the computation of the following chi-square statistic:


    χ² = Σᵢ Σⱼ (fᵢⱼ - eᵢⱼ)² / eᵢⱼ,


    where


    fᵢⱼ = observed frequency for the cell in row i and column j

    eᵢⱼ = expected frequency for the cell in row i and column j


    - The test statistic has a chi-square distribution with k − 1 df.


    ## Example


    Compute the value of the chi-square test statistic.


    | Likely to Repurchase? | Automobile Owner | Observed Frequency (f_o) | Expected
    Frequency (f_e) | Difference (f_o - f_e) | Squared Difference (f_o - f_e)^2 |
    Squared Difference Divided by Expected Frequency (f_o - f_e)^2 / f_e |

    |---|---|---|---|---|---|---|

    | Yes | Han | 69 | 78.0 | -9.0 | 81.00 | 1.04 |

    | Yes | Camry | 120 | 124.8 | -4.8 | 23.04 | 0.18 |

    | Yes | M3 | 123 | 109.2 | 13.8 | 190.44 | 1.74 |

    | No | Han | 56 | 47.0 | 9.0 | 81.00 | 1.72 |

    | No | Camry | 80 | 75.2 | 4.8 | 23.04 | 0.31 |

    | No | M3 | 52 | 65.8 | -13.8 | 190.44 | 2.89 |

    |  | Total | 500 | 500 |  |  | χ² = 7.89 |


    ## Example


    Suppose α = 0.05.


    - p-value approach:


    | Area in Upper Tail | .10 | .05 | .025 | .01 | .005 |

    | χ² Value (df = 2) | 4.605 | 5.991 | 7.378 | 9.210 | 10.597 |


    The p-value < α. We can reject the null hypothesis.


    - Critical value approach:


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_232_0.png)

