    \ 10.41\n- Hypotheses:\n  - H₀: The population does not differ from a normal distribution\
    \ with μ = 68.42 and σ = 10.41\n  - Hₐ: The population is different from a normal\
    \ distribution with μ = 68.42 and σ = 10.41\n\n## Goodness of Fit Test: Normal\
    \ Distribution\n\n- We can also use the chi-square test to conduct goodness of\
    \ fit test for a normal distribution.\n- **Basic idea**: continuous-valued sample\
    \ data ⇒ discrete categories.\n- In our example, we can divide the normal distribution\
    \ into 10 equal-probability intervals (with sample size = 50, expected frequency\
    \ in each interval is 5).\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_257_0.png)\n\
    \n- How to determine the endpoints of these intervals?\n- In general, define *k*\
    \ intervals of values so that the expected frequency is at least 5 for each interval.\n\
    - Compute the value of the test statistic.\n\n$$\\chi^2 = \\sum_{i=1}^{k} \\frac{(f_i-e_i)^2}{e_i}$$\n\
    \n**Note:** The test statistic has a chi-square distribution with *k − p − 1*\
    \ df, where *p* is the number of parameters estimated by the sample. In our example,\
    \ *p = 2*.\n\n- **Rejection rule:**\n  - *p*-value approach: Reject $H_0$ if *p*-value\
    \ ≤ α.\n  - Critical value approach: Reject $H_0$ if $\\chi^2 > \\chi^2_{\\alpha,k-p-1}$.\n\
    \n## Summary of Chi-Square Tests\n\n- We have introduced several hypothesis tests\
    \ based on chi-square distribution.\n- Test statistic:\n  - χ² = Σ (Observed Frequency\
    \ − Expected Frequency)² / Expected Frequency\n- Degrees of freedom:\n  - (1)\
    \ Testing the equality of population proportions for k populations (d.f. = k −\
    \ 1)\n  - (2) Testing the independence of two categorical variables (d.f. = (n\
    \ − 1)(m − 1))\n  - (3) Testing whether a probability distribution for a population\
    \ follows multinomial distribution (d.f. = k − 1) or normal distribution (d.f.\
    \ = k − 3)\n\n## 回顾统计推断的内容\n\n### 均值估计\n\n1. 生活中的现实问题 ⇒ 能够度量什么和检验的问题。\n   - 均值：交大美食评价，生产率，生产效率\n\
