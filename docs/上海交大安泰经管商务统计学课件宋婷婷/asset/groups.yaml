    \ milk and tea.\n  - In the COVID-19, \\(H_0\\): The person does **NOT** have\
    \ coronavirus.\n- **Two results:**\n  - **Reject**: the sample provides convincing\
    \ evidence that it is false. What is the conclusion?\n    ⇒ The **alternative\
