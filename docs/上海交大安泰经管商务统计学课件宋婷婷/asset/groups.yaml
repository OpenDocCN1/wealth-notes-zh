  - '[PAGE 58]


    # What is Sampling?


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_58_0.png)


    +   - A population (总体) is the collection of all the elements of interest.

    +   - A sample (样本) is a subset of the population.'
  - '[PAGE 59]


    # Why Sampling?


    +   - In practice, the complete data of population is **hard to acquire** due
    to undesirable cost of data collecting.

    +   - **Sampling (抽样)** aims at collecting partial data of population to make
    an **inference** about population characteristics.


    ![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_59_0.png)'
