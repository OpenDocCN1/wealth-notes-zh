    \ \\(\\beta\\)，\n\n\\[\nz_\\alpha - \\frac{\\sqrt{n}(\\mu_0-\\mu_a)}{\\sigma}\
    \ = -z_\\beta\n\\quad\\Rightarrow\\quad\nn = \\frac{(z_\\alpha + z_\\beta)^2 \\\
    sigma^2}{(\\mu_0-\\mu_a)^2}.\n\\]\n\n## 总结：单样本假设检验\n\n1. 提出 \\(H_0\\) 和 \\(H_a\\\
    )。\n   - 关于总体参数的陈述：\\(H_0: \\mu = \\mu_0;\\ H_a: \\mu \\neq \\mu_0\\)。\\(H_0:\
    \ \\mu \\geq \\mu_0;\\ H_a: \\mu < \\mu_0\\)。\\(H_0: \\mu \\leq \\mu_0;\\ H_a:\
    \ \\mu > \\mu_0\\)\n   - 示例：质量控制 / 药物有效性 / 比例\n\n2. 选择显著性水平 \\(\\alpha\\)。\n \
    \  - 控制第一类错误：0.01 / 0.05 / 0.1\n\n3. 根据样本数据计算检验统计量。\n   - Z检验（方差已知）：\\(z = \\\
    frac{\\bar{X} - \\mu_0}{\\sigma/\\sqrt{n}}\\) 或 \\(z = \\frac{\\hat{p} - p_0}{\\\
    sqrt{p_0(1-p_0)/n}}\\)\n   - t检验（方差未知）：\\(t = \\frac{\\bar{X} - \\mu_0}{S/\\sqrt{n}}\\\
    )\n\n4. 基于概率和统计理论制定决策规则。\n   - 知道检验统计量背后的概率分布。\n   - 临界值法或 p 值法。\n\n5. 收集随机样本并得出结论。\n\
    \   - 理解结论背后的风险：第一类错误或第二类错误。\n\n## 双总体假设检验\n\n- 两个总体均值的检验\n- 配对样本的检验\n- 两个总体比例的检验\n\
    \n## 两个总体均值之差的检验\n\n- **单样本假设检验当**\n  - 方差已知 \\(\\Rightarrow\\) Z检验\n  - 方差未知\
    \ \\(\\Rightarrow\\) T检验\n- **双样本假设检验当**\n  - 样本独立，其方差已知\n  - 样本独立，其方差相等但未知\n\
    \  - 样本独立，其方差不等且未知\n  - 样本配对且相关\n\n## 关于两个均值的推断：动机示例\n\n- 一家杂货零售商经营两家商店。一家位于市中心，另一家位于郊区购物中心。\n\
    - 管理员注意到，在一家商店销售良好的产品在另一家商店可能销售不佳。\n- 这种情况可能归因于两个地点的顾客人口统计差异。\n- 管理员要求我们调查在两家商店购物的顾客平均年龄之间的差异。\n\
    \n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_177_0.png)\n\n## 两个总体均值之差的抽样分布\n\n\
    - 假设我们分别从市中心和郊区商店随机抽取 \\(n_1\\) 和 \\(n_2\\) 名顾客，\n  - \\(X_{11}, X_{12}, \\ldots,\
    \ X_{1n_1} \\sim N(\\mu_1, \\sigma_1^2)\\)，\n  - \\(X_{21}, X_{22}, \\ldots, X_{2n_2}\
    \ \\sim N(\\mu_2, \\sigma_2^2)\\)，\n  - 两个样本相互独立。\n- \\(\\mu_1 - \\mu_2\\) 的点估计量为\
    \ \\(\\bar{X}_1 - \\bar{X}_2\\)。其抽样分布是什么？\n- **关键点：** 两个独立正态随机变量之和仍为正态，其均值为两个均值之和，其方差为两个方差之和。\n\
    \n## \\(\\mu_1 - \\mu_2\\) 的区间估计\n\n- 由于\n\n\\[\n\\bar{x}_1 \\sim N\\left(\\mu_1,\
    \ \\frac{\\sigma_1^2}{n_1}\\right), \\quad \\bar{x}_2 \\sim N\\left(\\mu_2, \\\
    frac{\\sigma_2^2}{n_2}\\right)\n\\]\n\n我们有\n\n\\[\n\\bar{x}_1 - \\bar{x}_2 \\\
    sim N\\left(\\mu_1 - \\mu_2, \\frac{\\sigma_1^2}{n_1} + \\frac{\\sigma_2^2}{n_2}\\\
    right)\n\\]\n\n- 估计量的**标准误差**为 \\(\\sigma_{\\bar{x}_1-\\bar{x}_2} = \\sqrt{\\\
    sigma_1^2/n_1 + \\sigma_2^2/n_2}\\)。\n\n- 当 \\(\\sigma_1^2\\) 和 \\(\\sigma_2^2\\\
    ) 均已知时，我们有 \\(\\mu_1 - \\mu_2\\) 的**区间估计**，\n\n\\[\n\\bar{x}_1 - \\bar{x}_2 \\\
    pm z_{\\alpha/2}\\sqrt{\\frac{\\sigma_1^2}{n_1} + \\frac{\\sigma_2^2}{n_2}}\n\\\
    ]\n\n置信系数为 \\(1 - \\alpha\\)。\n\n"
