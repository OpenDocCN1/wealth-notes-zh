  mdcn: "\n\n## x̄ 的抽样分布\n\n- **x̄ 的抽样分布的形式**\n  1. 总体具有正态分布\n     - 对于任意样本容量，x̄ 的抽样分布都是正态分布。\n\
    \  2. 总体不具有正态分布\n     - 我们需要足够大的样本容量，此时 x̄ 的抽样分布近似服从正态分布（中心极限定理）。\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_80_0.png)\n\
    \n## x̄ 的抽样分布\n\n- x̄ 的抽样分布的实际价值\n  - 我们不能期望样本均值 x̄ 恰好等于总体均值 μ。\n  - 在给定抽样分布的情况下，我们可以提供关于\
    \ x̄ 与 μ 之间差距的概率信息。\n\n- 示例：某总体（计算误差在0.5分以内的概率）\n  - 已知 μ=6，σ=1，样本容量 n 为 16。\n\
    \  - E(x̄)=μ=6；σ_x̄ = σ/√n =0.25\n\nPr{5.5 ≤ x̄ ≤ 6.5}\n= Pr{ (5.5 − E(x̄))/σ_x̄\
    \ ≤ (x̄ − E(x̄))/σ_x̄ ≤ (6.5 − E(x̄))/σ_x̄ }\n≈ Φ(2) − Φ(−2) = 0.9544\n\n- |x̄\
    \ − μ| ≤ 0.5 的概率为 95.44%\n\n## x̄ 的抽样分布\n\n- 如果将样本容量从 16 增加到 25，会怎样呢？\n\n![](img/ea9cdfad8dc7821ead4e68fc7aaa5ca3_82_0.png)\n\
    \n- 1. 随着样本容量增大，均值的标准误差会减小。\n\n- 2. 较大的样本容量能提供更高的概率，使样本均值落在总体均值的指定距离内。\n\n- 课后练习：尝试估计当样本容量从\
    \ 16 增加到 25 时的概率。\n\n## p̂ 的抽样分布\n\n- 样本比例 p̂ 是总体比例 p 的点估计量。\n- 回顾：p̂ = x / n\n\
    \  - x = 样本中具有感兴趣特征的元素的个数\n- p̂ 也是一个随机变量。\n- 它的概率分布称为 p̂ 的抽样分布。\n- 类似地，要确定样本比例\
    \ p̂ 与总体比例 p 有多接近，我们需要了解以下内容：\n  1. p̂ 的期望值或均值；\n  2. p̂ 的标准差；\n  3. p̂ 的抽样分布的形状或形式。\n\
    \n## $\\bar{p}$ 的抽样分布\n\n- 总体分布是**伯努利分布**。因此 $\\bar{p}$ 的抽样分布不是精确的正态分布。\n\n- 回顾：\n\
    \n  - 假设我们随机抽取 $n$ 个独立同分布的学生。这里 $X_i = 1$ 表示女生，$X_i = 0$ 表示男生，即\n\n$X_i \\sim\
    \ \\operatorname{Bernoulli}(p),\\ \\text{for } i = 1, 2, \\ldots, n.$\n\n$P(X\
    \ = 1) = p$\n\n$P(X = 0) = 1 - p$\n\n$\\mu \\equiv E(X) = p$\n\n$\\sigma^2 \\\
    equiv Var(X) = E(X^2) - E(X)^2 = p(1-p)$\n\n## $\\bar{p}$ 的抽样分布\n\n- **$\\bar{p}$\
    \ 的抽样分布的实际价值**\n  - 与 $\\bar{x}$ 类似，在给定抽样分布的情况下，我们可以提供关于 $\\bar{p}$ 与 $p$ 之间差距的概率信息。\n\
    \  - **示例：** 某总体（假设对该总体，女生人数占总人数的比率 $p=40\\%$，随机抽取 25 位学生，计算样本比例 $\\bar{p}$，求\
    \ $\\bar{p}$ 的误差在 0.05 以内的概率）\n    - 已知 $p=0.4$，样本容量 $n$ 为 25。\n    - $E(\\bar{p})=p=0.4$；$\\\
    sigma_{\\bar{p}}=\\sqrt{\\frac{p(1-p)}{n}}=0.098$\n    - $Pr\\{0.35\\leq\\bar{p}\\\
    leq0.45\\}=Pr\\left\\{\\frac{0.35-E(\\bar{p})}{\\sigma_{\\bar{p}}}\\leq\\frac{\\\
    bar{p}-E(\\bar{p})}{\\sigma_{\\bar{p}}}\\leq\\frac{0.45-E(\\bar{p})}{\\sigma_{\\\
    bar{p}}}\\right\\}$\n    - $\\approx\\Phi(0.51)-\\Phi(-0.51)=0.39$\n    - $|\\\
    bar{p}-p|\\leq0.05$ 的概率仅为 39%\n  - 类似地，**较大的样本容量**提供**更高的概率**，使样本比例落在总体比例的指定距离内。\n\
    \n## 点估计量的性质\n\n- 到目前为止，我们已经学习了一些点估计量，如样本均值（x̄）和样本比例（p̂）。\n\n- 在将样本统计量用作点估计量之前，统计学家会检查该样本统计量是否表现出与良好点估计量相关的某些性质。\n\
    \n- 此后，我们用 θ̂ 来表示相应的样本统计量，如样本均值和样本比例。\n\n- 点估计量的性质：\n\n"
