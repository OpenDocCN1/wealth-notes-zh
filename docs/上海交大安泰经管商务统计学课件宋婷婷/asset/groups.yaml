  mdcn: "\n\n## 两个总体均值的假设检验\n\n- 一般而言，假设检验有 3 种形式：\n  - **双尾检验：**\n    \\(H_0: \\\
    mu_1-\\mu_2=D_0,\\quad\\text{versus}\\quad H_a: \\mu_1-\\mu_2\\ne D_0.\\)\n  -\
    \ **上尾检验：**\n    \\(H_0: \\mu_1-\\mu_2\\le D_0,\\quad\\text{versus}\\quad H_a:\
    \ \\mu_1-\\mu_2>D_0.\\)\n  - **下尾检验：**\n    \\(H_0: \\mu_1-\\mu_2\\ge D_0,\\quad\\\
    text{versus}\\quad H_a: \\mu_1-\\mu_2<D_0.\\)\n\n如果我们想检验两个计算机总体平均年龄是否存在差异，如何建立假设？\n\
    \n### 当方差已知时两个总体均值\n\n考虑双尾假设检验\n\n- 第 1 步：陈述假设\n\n  \\(H_0: \\mu_1 - \\mu_2 =\
    \ D_0\\)   versus   \\(H_a: \\mu_1 - \\mu_2 \\ne D_0\\).\n\n- 第 3 步：**我们需要一个在\
    \ \\(H_0\\) 下分布已知的检验统计量。**\n\n当 \\(\\sigma_1^2, \\sigma_2^2\\) 已知时，检验统计量由下式给出\n\
    \n\\[\nz = \\frac{\\bar{x}_1 - \\bar{x}_2 - D_0}{\\sqrt{\\sigma_1^2/n_1 + \\sigma_2^2/n_2}}.\n\
    \\]\n\n第 4 步：在 \\(H_0\\) 下，我们有 \\(z \\sim N(0,1)\\)。因此，将使用 Z 检验的决策规则。\n\n### 当\
    \ \\(\\sigma_1^2, \\sigma_2^2\\) 已知时的检验程序\n\n- 检验统计量相同，但拒绝域不同。\n- p 值也不同。\n  -\
    \ 双尾检验：p-value = \\(P(\\lvert z\\rvert \\ge z_{\\text{obs}} \\mid \\mu_1-\\mu_2=D_0)\\\
    )\n  - 上尾检验：p-value = \\(P(z \\ge z_{\\text{obs}} \\mid \\mu_1-\\mu_2 \\le D_0)\\\
    )\n  - 下尾检验：p-value = \\(P(z \\le z_{\\text{obs}} \\mid \\mu_1-\\mu_2 \\ge D_0)\\\
    )\n\n|  | 双尾检验 | 上尾检验 | 下尾检验 |\n|---|---|---|---|\n| **假设** | \\(H_0: \\mu_1-\\\
    mu_2=D_0\\)<br>\\(H_a: \\mu_1-\\mu_2\\ne D_0\\) | \\(H_0: \\mu_1-\\mu_2\\le D_0\\\
    )<br>\\(H_a: \\mu_1-\\mu_2>D_0\\) | \\(H_0: \\mu_1-\\mu_2\\ge D_0\\)<br>\\(H_a:\
    \ \\mu_1-\\mu_2<D_0\\) |\n| **检验统计量** | \\(z=\\frac{\\bar{x}_1-\\bar{x}_2-D_0}{\\\
    sqrt{\\frac{\\sigma_1^2}{n_1}+\\frac{\\sigma_2^2}{n_2}}}\\) | \\(z=\\frac{\\bar{x}_1-\\\
    bar{x}_2-D_0}{\\sqrt{\\frac{\\sigma_1^2}{n_1}+\\frac{\\sigma_2^2}{n_2}}}\\) |\
    \ \\(z=\\frac{\\bar{x}_1-\\bar{x}_2-D_0}{\\sqrt{\\frac{\\sigma_1^2}{n_1}+\\frac{\\\
    sigma_2^2}{n_2}}}\\) |\n| **拒绝规则：临界值法** | 若 \\(\\lvert z_{\\text{obs}}\\rvert\\\
    ge z_{\\alpha/2}\\) 则拒绝 \\(H_0\\) | 若 \\(z_{\\text{obs}}\\ge z_\\alpha\\) 则拒绝\
    \ \\(H_0\\) | 若 \\(z_{\\text{obs}}\\le -z_\\alpha\\) 则拒绝 \\(H_0\\) |\n| **拒绝规则：p\
    \ 值法** | 若 p-value \\(\\le\\alpha\\) 则拒绝 \\(H_0\\) | 若 p-value \\(\\le\\alpha\\\
    ) 则拒绝 \\(H_0\\) | 若 p-value \\(\\le\\alpha\\) 则拒绝 \\(H_0\\) |\n\n### 当 \\(\\sigma_1^2\
    \ = \\sigma_2^2\\) 未知时两个总体均值\n\n- 实践中，总体的方差 \\(\\sigma_1^2\\) 和 \\(\\sigma_2^2\\\
    ) 通常未知。\n- 对于点估计，我们仍可使用 \\(\\bar{x}_1-\\bar{x}_2\\)。\n- 然而，对于区间估计和假设检验，我们需要估计其标准误\
    \ \\(\\sigma_{\\bar{x}_1-\\bar{x}_2}=\\sqrt{\\sigma_1^2/n_1+\\sigma_2^2/n_2}\\\
    )。\n- 基本思路：用样本方差估计总体方差，并使用 t 分布代替正态分布。\n  - 当 \\(\\sigma_1^2=\\sigma_2^2\\) 时可行\n\
    \  - 当 \\(\\sigma_1^2\\ne\\sigma_2^2\\) 时近似可行\n\n### 当 \\(\\sigma_1^2=\\sigma_2^2\\\
    ) 未知时的检验程序\n\n- 使用 \\(s_1^2\\) 和 \\(s_2^2\\) 的加权平均，称为 **合并估计量**，\n\n\\[\ns_p^2=\\\
    frac{n_1-1}{n_1+n_2-2}s_1^2+\\frac{n_2-1}{n_1+n_2-2}s_2^2\n=\\frac{\\sum_{i=1}^{2}(n_i-1)s_i^2}{\\\
    sum_{i=1}^{2}(n_i-1)}.\n\\]\n\n- t 检验统计量随后服从自由度为 \\((n_1+n_2-2)\\) 的 t 分布\n\n\\\
    [\nt=\\frac{\\bar{x}_1-\\bar{x}_2-D_0}{\\sqrt{s_p^2(1/n_1+1/n_2)}}\\sim t_{n_1+n_2-2},\\\
    quad\\text{under }H_0.\n\\]\n\n- 检验程序如下。\n  - 临界值法：若 \\(\\lvert t_{\\text{obs}}\\\
    rvert\\ge \\lvert t_{\\alpha/2}\\rvert\\) 则拒绝 \\(H_0\\)。\n  - p 值法：若 p-value \\\
    (=P(\\lvert t\\rvert\\ge \\lvert t_{\\text{obs}}\\rvert \\mid H_0)\\le\\alpha\\\
    ) 则拒绝 \\(H_0\\)。\n\n### 当 \\(\\sigma_1^2 \\ne \\sigma_2^2\\) 未知时两个总体均值\n\n- 接下来假设总体方差\
    \ \\(\\sigma_1^2 \\ne \\sigma_2^2\\) 未知。\n- 第 1 步：考虑双尾假设检验\n\n  \\(H_0: \\mu_1\
    \ - \\mu_2 = D_0 \\quad \\text{versus} \\quad H_a: \\mu_1 - \\mu_2 \\ne D_0\\\
    ).\n\n- 第 3 步：应使用 \\(t\\) 检验，对应的 \\(t\\) 检验统计量为\n\n  \\[\n  t = \\frac{\\bar{x}_1-\\\
    bar{x}_2-D_0}{\\sqrt{s_1^2/n_1+s_2^2/n_2}}.\n  \\]\n\n- 即使在 \\(H_0\\) 下，\\(t\\\
    ) 的分布也是 **未知的**。为什么？\n- 为 \\(t\\) 统计量构造一个 Student \\(t\\) 分布近似\n\n  \\[\n  t \\\
    sim t_{df}, \\quad \\text{under } H_0,\n  \\]\n\n  其中\n\n  \\[\n  df = \\frac{(s_1^2/n_1+s_2^2/n_2)^2}{\\\
    frac{(s_1^2/n_1)^2}{n_1-1}+\\frac{(s_2^2/n_2)^2}{n_2-1}}.\n  \\]\n\n> （阅读材料 Welch–Satterthwaite\
    \ equation - Wikipedia）\n\n"
