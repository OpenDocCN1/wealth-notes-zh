    # 第11章


    # 第六通則：交易的實踐


    首先，恭喜你一路堅持，走到這裡。現在，終點近了！第六項、也是最後一個通則，是前五項成功交易通則的累積。


    剛開始交易時，你會發現交易相當輕鬆簡單。但是，新鮮感退煥後，你可能開始覺得交易是重複、枯燥和痛苦的工作。這時不要洩氣，要滿足。因為這顯示你已經抵達正確的目的地。交易已經成為你的事業，是一份以專業方式執行的工
    作。你不再是為了刺激和興奮而交易。你交易是為了賺錢。可能有許多時候，你不喜歡自己正在做的事。當你開始厭惡交易，你應該感到振奮，因為這時你對任何個別交易結果已經無動於衷。這顯示你終於學會如何應用適當的資金管理策略。這時的你，專注於經營一個成功交易事業的程序，而不在意它們本身的成果。就在這時，你成為專業交易人。'
