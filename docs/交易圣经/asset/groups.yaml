    基本上，如果前一天的收盤價低於當天的低點，或者高於當天的高點，都會用以衡量真實區間（或者行進的真實距離）。偏好區間一旦界定，就可以選擇一段期間，計算平均值。這個例子中，我會以10日平均真實區間（average
    true range；ATR）衡量市場的波動性。


    固定波動性並不考慮單一交易的個別風險。如果市場波動性量數落在固定百分率的帳戶限制內，就執行那筆交易，而不管它的個別風險。同樣的，如果市場的波動性擴大，並且超越固定百分率的帳戶限制，那筆交易就不獲選執行，不管它的個別交易風險是多少，即使只拿100美元冒險。


    丹尼斯教導他那些著名的海龜交易人使用的，就是這套資金管理策略。


    我們來看一個例子。初始帳戶餘額為50,000美元，限制市場的波動性固定為帳戶餘額的2%，我假設貨幣市場當時的10日ATR為0.0031點。將這個點數乘以125,000美元的完全點值，算出市場的波動性為388美元（0.0031×$125,000）。也就是說，過去10天，貨幣市場平均每天的真實波動為388美元。如果我想限制市場的波動性固定在帳戶餘額的2%（$50,000×0.02=$1,000），那麼我只能交易二口合約（$1,000／$388=2.6或2.0）。


    和其他策略類似，為保守起見，我採用無條件捨去取整數。


    表8.10顯示交易的合約口數如何隨著市場的波動性而變化。


    你可以看見交易的合約口數隨著市場的波動性而起伏，而市場的波動性是以10日ATR來衡量。此外，隨著帳戶成長，或者市場的每日波動性下降，交易人可望交易更多合約。同樣的，如果帳戶減少，或者市場的每日波動性擴增，交易人將預期交易較少的合約（也就是縮減部位規模）。


