    - 風險管理人必須發展追求期望值和機會的方法\n- 交易人是為了期望值和機會而交易，而不是準確率\n\n如果你生存下來，期望值和機會就會將錢放進你的交易帳戶，不是靠趨勢線，不是靠指標，不是靠精神導師。\n\
    \n單是賺取利潤，對生存和成功是不夠的。你必須知道期望值是多少，然後設法極大化，而這不能只靠改善準確率。你現在知道，如果期望值提高，就能犧牲準確率換取較高的報酬。此外，你不應該一心一意只顧發展期望值最高的方法，以至於不顧機會的多寡。\n\
    \n如果你發展出一種期望值不錯的方法，但發現它沒有給你夠多的機會，你必須設法提高機會。\n\n要做到這一點，最簡單的方法，就是在更多的市場交易。如果你加進一個市場，機會就會加倍，加進第三個市場，機會就會增為三倍，依此類推。假設你的帳戶可以接受額外的保證金要求，而且你不擔心可能的額外賠償，以市場組合做交易，是增加機會的明智方式。\n\
    \n## 追求簡單\n\n了解簡單是發展具有穩健期望值的方法之關鍵，等於在啟蒙階段又跨出了一步。你應該在兩個層面追求簡單，一是設計求其簡單，二是支撐和阻力水準求其簡單。\n\
    \n### 設計求其簡單\n\n交易方法必須通過麥當勞（McDonald’s）測試——也就是說，青少年能夠了解你的方法並依此交易嗎？如果不然，你的方法可能太過複雜。你需要力求簡單。\n\
    \n設計方法時，少就是好。如果有太多的組成部分有可調整的變數，那麼邏輯上來說，會有更多的事請出差錯。你也要避開交易帶來的知性陷阱。交易失敗的許多人相信答案一定在複雜裡，因為市場絕不會輕易洩露秘密。他們視市場為待解的魔術方塊。所以只要是觀點聰明、思考深入的理論，都會吸引他們的注意。他們享受學習、了解理論的錯綜複雜，以及應用它分析市場的知性挑戰和刺激。\n\
    \n我建議你要抗拒理論帶來的知性吸引力。如果你禁不起誘惑，請銘記在心：有不計其數的聰明理論存在，也有比較明智的中庸之道，全都能提出深具說服力、合情合理且誘人的論點。在你聽這些吸引人的聲音之際，只要提醒自己，它們不可能全部都對，這是絕對不可能的事。因此，你最好能選到一個對的。你覺得自己幸運嗎？如果你樂於周旋於眾多理論之中，你真得靠一點運氣。但是如同我說過的，最好的做法是保持簡單。\n\
    \n### 支撐和阻力水準求其簡單\n\n追根究柢，交易之道不過是找到潛在的支撐和阻力水準而已。交易人做一筆交易，是因為他們相信潛在的支撐或阻力水準得以保持，並提供利潤。停損點要設在市場會證明潛在支撐或阻力水準不足的地方。成功的交易就是這麼做。你會買進，是因為你所用的方法相信市場已經找到潛在的支撐，而且價格會走高。這時你會將停損點放在所用方法的分析證明為誤的水準。你會賣出，是因為所用方法相信市場觸及潛在的阻力，價格即將走低。同理，你將停損點放在你相信所用方法的分析證明為誤的水準。\n\
    \n不要陷入最新軟體或錯綜複雜的市場分析。不要忘記你做分析的基本目標——找到潛在的支撐和阻力水準。\n\n除非是相信市場已經找到支撐，否則為何要買？除非市場遇到阻力，否則為何要賣？聽起來直截了當，不是嗎？可是許多交易人卻卡在他們特殊選用的分析領域中（艾略特波浪、甘恩、幾何、蠟燭、電腦系統、星象、季節性、背離等等），以致於忘了目標——尋找市場可能在哪裡找到支撐或阻力。\n\
    \n務必經常抬頭，目光離開分析，看看更大的畫面——市場是否就要走到潛在的支撐或阻力？就是這麼簡單。我會在第9章回頭深入討論簡單性，並舉些例子說明。\n\n\
    ## 涉足大多數人害怕的地方\n\n啟蒙的下一步是學會踏上大部分人害怕的地方。如果大部分積極型交易人都賠了錢，你應該踏進他們害怕去走的地方，而不是跟隨他們。你必須學會脫離群眾；抗拒想在群眾中享受安全感的本能。\n\
    \n這表示要脫離從眾思考慮。基本上，這裡的概念是：如果大部分人望西，你應該看東。只有10%或更少的交易人落在贏家圈，所以如果你想要生存，就需要屬於少數人。你不只需要在大部分人害怕的地方交易，你也必須站在少數人歡呼的地方。\n\
    \n大部分人害怕走的地方包括：\n\n- 當最優秀的輸家：大部分人討厭賠錢，經常移動停損點，好給交易多一點空間。你應該試著當個最優秀的輸家。我就是這麼做的。\n\
    - **當最優秀的贏家：** 大部分人都因為害怕賠掉已經賺到的一點小利潤而感到焦慮，結果忽視交易計畫，太早退出獲利部位。你應該盡可能做個最優秀的贏家，照著交易計畫的指示，賺錢的交易該抱多久就抱多久。我就是這麼做的。\n\
    - **當順勢交易人：** 很遺憾，市場不是隨時都有趨勢。因此，順勢交易的準確率通常較低，大約只有三分之一的交易賺錢。即使已經證明，順勢交易毫無疑問行得通，絕大多數人卻不能忍受只有三分之一的交易能夠獲利！所以你應該努力學習如何追隨趨勢，交易成功。你應該學會如何只靠賺三分之一的交易而生存。你應該設法在大部分人做不到的地方取得成功。你應該努力享受不幸的順勢交易人\
    \ 67% 的交易通常賠錢的事實。你要為自己做得到大部分交易人都做不到的事而自豪——大部分交易都賠錢。我就是這樣。\n- **擁抱簡單：** 大部分人都不信任顯而易見的簡單解決方案，轉而在複雜裡找線索和優勢。你應該努力調查、研究和發展簡單的交易解決方案，它的移動組件很少。如果證明是有價值的方法，會因為缺乏活動組件而保持穩健和獲利。我就是這麼做的。\n\
    - **懷疑商業繪圖程式：** 大部分人都擁有繪圖程式，裡面有常見的一大堆指標。把任何指標加進你的方法之前，務必自行驗證。我就是這麼做的。\n- **懷疑商業交易系統：**\
    \ 大部分人相信商業交易系統的行銷炒作。大部分人很容易聽信聰明的廣告和行銷攻勢。你應該努力保持客觀，遠離輕鬆致富的承諾，並且努力問難以回答的問題。我就是這麼做的。\n\
    - **做功課：** 大部分人都很懶。你應該努力研究、調查和驗證你覺得值得一試的每一個交易觀念。你應該努力自行做功課。我就是這麼做的。\n\n## 以TEST驗證期望值\n\
    \n驗證是指以TEST程序，驗證你的期望值。TEST是我所用「三十筆電子郵件交寄的模擬交易」(Thirty Emailed Simulated Trades)的英文首字母縮寫。以TEST驗證你的期望值，是啟蒙的最後一塊拼圖。\n\
    \n設計好擁有良好期望值和機會的簡單方法之後，在投入真正的錢去交易前，最後一步是驗證期望值。要以正確的方法驗證期望值，唯一的做法是在模擬即時交易情況時，使用樣本外資料。樣本外資料是指沒有使用的資料。最佳樣本外資料是即時的「現場」資料。\n\
    \n紙上模擬操作無法驗證期望值，因為它沒有納入獨立的觀察者。自行做紙上模擬操作是沒有意義的，因為它並沒有模擬到市場不能妥協的特質。市場不會允許你在中途改變或操弄你的交易準則。它不會在你承受某筆帳面損失時，允許你把那筆交易消除。紙上模擬操作不會像市場那樣，將你和你的心靈放在巨大的聚光燈底下。想像中的紙上模擬操作只是兒戲，沒有最後的裁判。\n\
    \n要正確驗證期望值，唯一的方法是TEST。你需要在市場開盤之前，將三十筆模擬交易的完整委託單，用電子郵件寄給你的交易夥伴。交易夥伴必須把模擬委託單印出紙本，而且只能在接到寄來的委託單之後，於市場開盤之前，根據你的指示下單。你的交易夥伴將成為你的虛擬顧問，記錄你的交易成果。一旦三十\n"
