    但是我想，剔除固定風險法相當安全，因為它未能產生良好的利潤，即使它有最低的賠損、最低的標準差，以及最高的淨利相對於賠損比率。如此一來，你現在能選的策略只剩六個。


    一個可用方法是選擇產生最低賠損百分率的策略。若此，可採取固定比率法交易，因為賠損只有區區 12%。但是，威廉斯固定風險的賠損略高，只有 17%，卻伴隨著 8
    倍的利潤，大部分人可能喜歡威廉斯固定風險甚於固定比率。


