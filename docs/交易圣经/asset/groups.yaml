    認失敗而離去。不必在意。這不是失敗。你只是暫時停止交易，直到你能帶進正期望值再說。不必沮喪。反而要為此舉大有幫助而興奮不已。賠錢並不是什麼丟臉的事——每個人都賠過。我賠過許多次，甚至以擅長此道而自豪（記住：最優秀的輸家，才是長期的贏家！）


    如果你是輸家，我希望你仔細聆聽接下來我要講的話。你會賠錢的一大理由，是你的交易方法行不通。並不是因為你腦袋裡有什麼東西阻礙你賺錢。儘管許多交易教育者要你相信不計其數的訊息，但與你為敵的並不是心理面。心理面的挑戰當然很大，但它不是你的剋星。


    問題出在你使用的方法。那套方法不管用。雖然你的交易帳戶告訴你它不好，你卻忽視它傳達給你的訊息。我可以了解為什麼。毫無疑問的，你看過不少書，參加過許多交易研討會，都說你的方法和觀念可用於交易。但很遺憾，它們就是不行。從你的交易帳戶來看，你的方法令你大失所望。究其原因，可能不是它完全沒有價值；但是整體而言，你的方法之所以行不通，在於它不具優勢，以及它的期望值還沒有獲得驗證。


    你需要驗證你所用方法的期望值。我敢說，你的發現會與你的交易帳戶狀況相呼應。你會發現那是負值。要是你在下單交易之前就驗證過期望值，你就絕對不會採用那個方法。你會將它扔掉，重新搜尋一種擁有優勢、能夠正確驗證、確定可以提供正期望值的交易方法。


    所以，請深吸一口氣，暫時離開交易。本書將帶你著手探尋真正的交易知識，包括如何正確驗證交易觀念。


    我要說，如果你現在賠錢，不用擔心，因為你並不孤單。告訴你一個不幸的事實：超過90%的交易人都賠錢。且讓我根據自


    己的了解，告訴你何以如此。


    ## 為什麼交易人十有九虧？


    90%的交易人賠錢，答案很簡單，就是無知。

    儘管許多分析師表示，心理面是主要原因，我卻認為更深層的答案，在於人容易受騙和懶惰。由於懶惰，交易人才會尋找阻力最小之路。在你能以更聰明的方式工作時，為什麼要更賣力工作，對吧？不幸的是，這會使交易人受騙，於是他們開始相信他們所讀的、所聽的，以及在電腦上所安裝的。這是因為交易人迫不及待想要相信，世界上有簡單的交易致富途徑存在。這條阻力最小之路，反而阻礙了他們，無法正確驗證他們覺得在市場上可能行得通的方法。


    雖然交易人可能飽覽群書，參加過無數的研討會，他們仍然無知。這聽起來可能令人難以置信，但是揭露交易實際運作方式的書或研討會並不多。這是因為許多作者和教育者本身對於實際運作方式一無所知；他們通常是失敗的交易人。如果你翻閱大量的金融文獻和各種產品，你會發現大部分都依賴「更笨的傻瓜」理論。也就是說，顧客或購買者是更笨的傻瓜，但他們本身並不知情！務必記住：交易觀念不會因為寫成白紙黑字，或者用
    PowerPoint 報告，就變成真理。


    但是，如果你擁有正確的知識以及足夠的耐性，去驗證交易觀念，你就不會無知——我就是要給你這方面的知識。雖然初期階段你可能賺不到錢，至少足以讓你理解，交易虧損是因為你懂得還不夠多，所以還未成功。


    ## 交易三柱


    心理面經常被人拿來做為交易人未能成功的藉口。但是雖然心理面可能是助因，卻不像許多評論者所說的那樣，是唯一的理由。交易要成功，你需要注意三個重要的領域：


    - 交易方法

    - 資金管理

    - 交易心理


    它們（幾乎）同樣重要，稍後我會更深入探討每一個領域。目前你只需要知道它們是成功交易的三項要件。


    每當我上台講演，我通常會問聽眾，他們相信交易的哪個部分最重要：


    - 交易方法：買進和賣出背後原因的分析與交易計畫

    - 資金管理：投入交易的資金金額

    - 交易心理：嚴守紀律，遵循交易計畫


    有趣的是，大多數人舉手說是心理面。對於這樣的反應，我並不驚訝，因為市面上大多數的交易教材，絕大部分的訊息都說心理面是交易最困難的部分和成功之鑰。


    一般經常聽到的訊息不外乎：「區分贏家和輸家的唯一關鍵是心理面，別無其他」；「贏家在市場上賺錢，沒有特殊的交易技巧、沒有特殊的交易秘訣、沒有秘密公式」；「贏家與輸家的區別取決於心理」；「贏家的想法和輸家不一樣」……諸如此類。


    我不同意這些說法。妨礙輸家的是他們的無知，不知道也沒有去驗證他們手中什麼行得通。雖然心理面很重要，我相信資金管理和方法的排名更高。


    前面提到無知、容易受騙和懶惰是90%的交易人賠錢的主要原因。為了讓你知道這三害如何展現在交易行為，我會深入探討許多交易人在頭三年的交易中常犯的錯誤。我會根據交易成功的三個層面（即交易方法、資金管理和交易心理），分述這些常見錯誤。


    順帶一提，我沒有宣稱自己是交易專家，但我絕對有資格討論這些常見錯誤，因為這些錯誤我都犯過！


    ## 第一年的常見錯誤


    歡迎來到交易的第一年。如果你曾經懷疑自己無知到什麼程度，別懷疑：在交易的第 一年，你是「無知之王」！


    ### 交易方法


    聽別人怎麼說，然後照小道消息去做 大部分人開始交易的時候，總是會聽別人怎麼說，然後照聽到的小道消息去做。結果肯定叫人失望。小道消息有時可能讓你賺錢，但是拉長時間來看，卻只能說是輸家的遊戲。你只應該出於自己的想法去交易，不應該聽信別人在走廊和餐桌邊說的話。


    看了晚間新聞之後有所反應 缺乏經驗的交易人會一聽到某些消息，例如大部分公司報告盈餘不錯、單季國內生產毛額（GDP）成長數字高於預測，於是隔天作多，想不到下場是停損出場。他們花了很長的時間才了解，晚上傳到居家客廳的新


    聞，其實已經是老舊的市場資訊。市場對這些新聞早就預期並有所反應。新手交易人卻不知情。


    ### 請別人提供意見


    新手交易人經常尋求別人的意見。如果他們對市場會往哪裡走沒有概念，他們會請營業員、朋友和家人提供意見。可惜，除非是全時交易人，否則他們對市場的看法，可能不比新手交易人好多少。


    ### 攤平進價水準


    新手交易人通常是世界上最糟糕的輸家。他們討厭賠錢，總是不計任何代價避免虧損，而通常的反應就是「攤平」進價水準。舉例來說，假設你以6.60美元的價格買進一支股票，之後它立刻掉到6.00美元。新手交易人經常說服自己，相信這支股票有很好的理由跌到6.00美元。他們也說服自己相信有更好的理由，它應該會反彈。他們接著在6.00美元買進更多股票，將進價水準壓低到6.30美元，並且希望從預期中的反彈獲利。但是在這種情況中，股票不可能反彈，而且所有這麼做的交易人，都讓損失雪上加霜。雖然在6.30美元作多，聽起來比在6.60美元作多要好，但是兩次投下同樣多的錢則不妙。「攤平」進價水準有違當個「最優秀的輸家」原則，新手交易人因此成為最糟糕的輸家。


    ### 沒有使用停損點


    除非新手交易人受益於一些交易經驗，否則他們很少在交易時確實執行停損點，或者執行預先計劃好的出場點。直到為時已晚和代價太過沉重，他們才恍然大悟，咦得自己可能賠錢。


    ### 沒有交易計畫


    所有這些，可以總結為這個最常犯的錯誤。聽信小道消息、對夜間新聞有所反應、請別人提供意見、攤平進價水準，以及不使用停損點，是交易人在交易時沒有交易計畫的明顯跡象。切記：交易時沒有交易計畫，遲早會栽大跟頭。


    ### 資金管理


    缺乏資金管理觀念 一般情況下，第一次交易的人唯一關切的事，是有沒有足夠的錢展開交易。幾乎沒人想到資金管理觀念。新手交易人通常缺乏「破產風險」(risk of
    ruin)的概念(稍後我會解釋)。這種風險來自把過多的帳戶餘額投注於單一筆交易去冒險。


    之前曾提及我對資金管理的重視程度，因此你應該可以想像，犯下這項錯誤對新手交易人經常是致命一擊。


    ### 交易心理


    因為刺激而交易 許多人交易的理由之一，是它能帶來刺激，脫離他們覺得秩序井然、保守無趣的生活。交易能讓心臟狂跳，腎上腺素流竄。即使正在賠錢，交易人也經常樂此不疲，因為下一筆交易總是個刺激的謎：會賺，還是會賠？


    為了報一箭之仇和打平而交易 交易人賠錢的時候，他們往往感到生氣，想要「報復」市場。賠錢就像遭到兩次打擊：一次是打擊你的自尊，另外一次是打擊你的口袋。新手交易人挨了市場一記棍，就想要立刻還手。激勵他們交易的因素，是報復，不是邏輯。情緒化是新手交易人常見的行為；這也是淪落到貧民收容所的捷徑。


    ## 第二年的常見錯誤


    如果交易人沒有賠掉所有的錢，安然度過第一年的交易，大部分人會帶著無知的決心和無端的樂觀，踏進第二年。第一年，


    大部分交易人不過是依賴偶然的機運在交易；但是第二年，他們真正危害到自己。第二年的交易人開始得到一點知識，或者他們如此認為，於是下定決心著手毀滅自己。


    ### 交易方法


    相信讀到的和聽到的 交易人常犯的一個錯誤，是相信他們讀到或聽到交易方面的事。如果有人把那些事情寫下來，或者有人講出來，大部分交易人就會信以為真，直到後來賠錢才知道不是那麼一回事。交易人想要相信那是真的，因為這是輕鬆賺錢阻力最小之路。請記住：任何交易觀念要行得通，必須由你自己去驗證，不是靠別人。


    相信技術面分析是唯一答案 技術面分析泛指藉由研究過去的價格，以洞悉未來的價格走向。但是在第二年的交易中，許多人常犯的錯誤，是相信他們只需要靠技術面分析就能賺錢，而忽視資金管理和心理面。


    相信多即是好 還算相當新的交易人奉行技術面分析時，經常犯下的一個錯誤就是相信越複雜，答案越好。他們不但不明白技術面分析本身並不足夠，還相信加進更多的技術指標可以提供更好的答案。


    交易人在購買繪圖軟體時，總是掉進一個陷阱，想在螢幕上盡可能標注最多的指標。但是試圖解釋市場的每一步，一定以災難收場。這樣的故事，我們耳熟能詳：如果指標的預測沒有出現強烈的跳空向上，交易人會主動搜尋一個如此預測的指標。這是「曲線配適」(curve
    fitting)的第一階段，即交易初學者嘗試建立模式，拿一堆指標和過去的資料配適。


    相信「紙上模擬操作」有幫助 許多缺乏經驗的交易人，


    誤信「紙上模擬操作」有幫助。紙上模擬操作是指根據你自己的交易準則，（在紙上）記錄交易的過程。一旦對「紙上」的結果感到滿意，就可以開始拿真正的錢去交易。雖然這麼做的立意良善，我卻相信它是愚不可及的練習。


    紙上模擬操作的問題，在於它並沒有反應真實的交易世界。它並沒有提供對等、中立但公平的「糾察」元素，以觀察和獨立檢核你的紙上模擬操作。它很容易動手腳。執行紙上模擬操作時，只要出現不曾見過的過濾器（filter），你隨時都可以消除虧損的交易，修改過去的行動。人們為了保護自己敏感的自尊所做的事，令人嘆為觀止。我也可以告訴你，在我二十七年的交易經驗中，從來沒有見過一個賠錢的「紙上模擬」交易人！


    ### 掉進預測陷阱


    首先是艾略特波浪（Elliott wave），然後是幾何（geometry），影響我的交易。這種情形維持了十五年之久，直到我改用簡單的型態交易（pattern
    trading）。但是在我沉迷於艾略特波浪和幾何的十五年內，我想我是犯這種錯誤的高手。「預測陷阱」是什麼？簡單說，是指交易人試圖判斷市場朝哪裡走，或者對於它往哪裡走、走多遠，以及什麼時候會走，持有某種看法。任何探討市場行為的理論，只要提到市場會形成預定的型態，都是預測理論。艾略特波浪和甘恩（W.D.
    Gann）是預測理論中最知名的兩個人。


    預測理論認為交易人能夠預先確定市場的走向和反轉點。交易新手難免受到誘惑，相信自己有可能持續掌握市場會往哪裡去。這個想法很吸引人，因為這表示你可以知道何時買低、何時賣高，交易結果就有可能相當確定。它再次提供交易成功輕鬆可得，阻力最小之路，而這當然十分吸引新手交易人。


    遺憾的是，許多交易人直到為時已晚，才曉得這些預測理論


    可能不是最有效的交易方法。直到他們的經驗使他們更窮，才開始質疑這些理論提出的觀念。一旦他們開始質疑，並根據自己的解讀去驗證理論，很快會發現手中的理論為負期望報酬。


    ### 抓取頭部和底部


    大部分交易人會犯下想要賣到頭部和買到底部的常見錯誤。當市場創下新高，缺乏經驗的交易人通常想要賣出。賣出價值高估的東西（抓取頭部）是相當合理和聰明的做法，很難想像有人想反其道而行。遺憾的是，交易人總是不由自主犯下常見錯誤，買進價格極為疲軟的股票，卻賣出價格極為強勢的股票。


    ### 沒有認清趨勢


    沒有看清趨勢，通常會因為前一個常見錯誤而雪上加霜。交易人試著和根本的市場趨勢反向操作，最後的結果就像想要逆流而上。但是定義趨勢沒有那麼容易，因為它會隨著你用於確認格局（setup；例如月、週、日）的時間架構和交易計畫（例如週、日、時）而變。


    ### 沒有遵守停損點


    如果交易人夠幸運，在第二年使用停損點進行交易，許多人常犯的一個錯誤，是偶爾會移動停損點，以免軋平交易。這個傾向源自害怕被證明錯誤。結果是：交易人最後賠掉的錢，多於讓停損點留在原始的位置。移動停損點使你成為糟糕的輸家，因此會是長期的輸家！


    ### 太快獲利了結


    一方面，交易人可能沒有遵守停損點，而將它們移得更遠。另一方面，交易人也可能害怕利潤被搶走，因為焦慮而太快獲利了結。這種交易人不只是糟糕的輸家，也是糟糕的贏家！大部分人在與市場接觸的兩個關鍵點，也就是停損和出場，執行上表現如此之差，交易失敗有什麼好奇怪的？


    太慢認賠和太快獲利會招來災難。交易人需要失敗許多年之後才會了解，成功的獲利交易有賴於交易人能夠盡快認賠，和盡


    慢收割獲利落袋。


    ### 沒有使用交易計畫


    許多交易人常犯的一個錯誤，是在沒有定義明確的交易計畫之下交易。他們極少用定義明確和毫不含糊的準則交易，以決定他們的進場水準、停損水準和出場水準。


    ### 「尾隨」其他交易人


    即使大多數交易人擁有強烈的決心，想要繼續交易到第二年，但是到了某個時候，不斷賠錢令他們備感挫折。信心一直遭到侵蝕，使得他們犯下「尾隨」其他交易人這個常見錯誤，也就是盲目跟從別人操作。


    ### 更換交易方法


    我不太願意說這是常見錯誤，因為這是偶爾該做的正確行動——如果你不去搜尋，如何得知怎麼交易才行得通？但是我在此收錄它，是因為許多人在充分調查一種方法之前，就過早換方法。交易人在搜尋時可能太沒耐心，沒花足夠的時間深入探討，以正確決定某種方法是否有價值。


    ### 更換精神導師


    我所說的精神導師，是指一般新聞媒體、各個機構，或者網路網路聊天網站吹捧為交易智慧大師的那些人。一般來說，如果交易人因為追隨某名精神導師而失敗，他們會把他或她換掉，另找一個，而不是自行摸索什麼事情行得通。


    ### 更換市場


    如果交易人更換方法和精神導師之後，還是賺不到錢，許多人會做成結論說，是市場妨礙他們，而不是他們接觸市場的方式出問題。


    ### 更換時間架構


    許多交易人相信更換時間架構會改善他們的成果。他們覺得，短期的時間架構會減低風險，因而降低損失。這通常導致他們嘗試當日沖銷交易。但是，縮短時間架構並沒有減低風險。交易人換採當日沖銷交易等較短的時間架構時，通常是在市場收盤時軋平虧損部位，因而無意間改善他們承受的風險和資金管理成果。同樣的，妨礙他們的不是時間架構，而是資金


    管理和使用的方法。


    更換顧問 許多交易人一向將不良的交易成果，怪罪於顧問的委託撮合成交價格差，即使這是市場造成的。我所謂的委託撮合成交（fills），是指執行進出市場的委託單。如果他們正在賠錢，再遇上委託撮合成交價格差，他們就會更換顧問。他們相信顧問應該為交易成果欠佳負責，而不是他們自己的交易有問題。


    ### 資金管理


    過度交易 到了交易的第二年，大部分交易人會無意間接觸到資金管理的概念。雖然許多人可能自以為了解資金管理，事實上他們並不是真的懂。相對於帳戶金額，新手交易人還是會過度交易。也就是交易帳戶有過高的比例押在單一交易上冒險。


    ### 交易心理


    沉迷於市場 交易的刺激會使交易人自然而然亢奮起來。腎上腺素翻湧，產生想要交易的不健康癮頭。渴望執行下一筆交易，會導致交易人執行不存在的邊際交易，因此為常見的不良成果所苦。


    缺乏耐性 大多數交易人會對市場失去耐性。在需要耐性的時候，反而忽視以前的信念，只在經過驗證的格局中交易。交易人於是一窩蜂搶著開始執行任何邊際機會，並且繼續賠錢。


    抱著不切實際的期望 新手交易人常誤信市場交易狂熱，從而產生不切實際的期望。期望賺得 100% 或更高的報酬率，使得交易人承受很大的壓力，進而促使他們在財務上（和情緒上）急轉直下，自我毀滅。


    當理論派 交易人經常會找理由，解釋為何虧損。他們的


    理由總是市場搶了他們的錢——「要是道瓊指數昨天晚上沒跌，我今天早上就能獲利了結！」，或者「哦，不對，我把波浪數算錯了。我怎麼會做那種事？」，或者「20根長條的週期一定反轉了！」


    在新手交易人心中，他們永遠沒錯。


    ## 第三年的常見錯誤


    跌跌撞撞走過第一年的交易，並且活過第二年，我們應該為踏進第三年繼續奮鬥的人鼓掌喝采！這些交易人通常抱著堅定的決心和身經百戰後疲憊的審慎態度在交易。


    雖然第三年的交易人在姿態上擺出像是久經沙場的老將，但他們還是有可能遇上危險。他們擁有更多的知識（或者他們是怎麼想的），而且相信市場欠他們很多——財務上是指它「借走」的錢，此外還有他們「投資」於解謎的時間，目的是為了掀開它的神秘面紗。最慘的是，他們的自尊嚴重受創，就像隨身帶著一顆汽油彈。


    歡迎來到第三年的交易。


    ### 交易方法


    不能歸零學習 不能放掉所學，歸零學習，是幾乎每一位交易人都會犯的重大錯誤，而且幾乎沒辦法避免。這是源於成功的重要因素——決心。一方面，這是成功的唯一方式，因為交易會把許多障礙丟到你的路上，少了決心，就不會往前走。可是決心又會讓你固執己見，不願拋棄賠錢的方法，即使你的交易帳戶、你的夥伴、你的會計師要你這麼做。相信我，我是過來人，因為


    我花了十五年的時間，才捨棄艾略特波浪。


    ### 忘記最重要的是簡單的支撐和阻力


    許多交易人在追求終極交易策略時，會受到誘惑，相信複雜是贏過市場的秘密。他們相信如果市場上每個人都在賭錢，那麼交易就不簡單——如果簡單，不是每個人都會賺錢嗎？於是他們開始學習複雜和深奧的方法、觀察星象和在金字塔底下偷窺，尋找打開市場的「秘密鑰匙」。他們忽略了一個簡單的事實：交易只不過是找到潛在的支撐和阻力水準。


    除非交易人相信市場可能已經找到支撐，否則為什麼要買進？除非交易人相信市場可能遇到阻力，否則為什麼要賣出？遺憾的是，交易人在追求「聰明」交易時，忽視了交易只是在尋找簡單的支撐和阻力水準這個事實。


    ### 技術面分析和交易混為一談，未能區分交易計畫和格局


    許多交易人在交易生涯之初，把技術面分析和交易混為一談。他們常犯的錯誤，是沒有把格局和交易計畫分離開來。他們也十分專注於尋找市場會往哪裡走，而一旦他們相信已經找到，就會立即進場。


    比如說，你的格局可能採用40日移動平均線確認趨勢。它可能採用某個人氣指標，告訴你市場何時超賣、確認上升趨勢拉回的安全買點。它甚至可能使用關鍵的反轉型態，以確認價格反轉和趨勢恢復。你會看到三個綠燈（趨勢向上、在人氣超賣的情況下向下折返、反轉型態顯示趨勢持續向上），並因此感到興奮。於是你立即在當天的收盤或者隔天的開盤就進場買進，因為你的分析或方法已經確認上升趨勢可能恢復。


    這時，你會犯下一個常見錯誤，就是沒有在格局之外另行發展交易計畫。單單根據格局而自動進入市場是錯的。成功的交易


    人知道，這應該是兩步驟的程序。


    第一步是完成分析和確認格局。第二步是依循獨立的交易計畫，研判如何正確掌握利用格局。


    ### 沒有發展交易計畫以支持格局


    如果你已經分別發展格局和交易計畫，那麼你會在前一夜完成分析和尋找你的格局，以建立隔天買進或賣出的偏好。隔天的唯一關注焦點，將是你的交易計畫，不是你的格局。你會根據交易計畫交易，而不是格局。許多交易人沒有做好一件事，那就是設計交易計畫，以支持和確認格局。相反的，他們的交易計畫只納入進場、停損和出場技術。


    良好的交易計畫會要求格局交出正面的市場行動，交易人才會投入資金建立部位。對於賣出格局來說，良好的交易計畫會要求較低的價格，才投入市場展開交易。至於買進格局，良好的交易計畫會要求較高的價格，才投入資金展開交易。遺憾的是，大部分人沒有將這個「支持」角色納入交易計畫。


    ### 不了解正期望值


    另一個常見錯誤，是對「正期望值」無知。雖然人們交易是為了賺錢，而且潛意識中想要賺很多錢，但他們對於實際上的「期望值」，欠缺實務上的知識。他們對於拿去交易冒險的每一塊錢，長期而言可能賺多少毫無所悉。關於期望值，稍後我會談得更多。


    ### 沒有驗證方法


    不管是新手，還是經驗豐富的老手，大多數交易人都會犯下沒有正確驗證他們所用方法的錯誤。有些人相信，經過模擬的淨值曲線（equity curve）和經過計算的期望值，加上紙上模擬操作，就能驗證系統。遺憾的是，事實並非如此。


    大部分交易人只有在市場上交易真正的金錢，才能驗證他們使用的方法好不好。如果賺錢，他們的方法就是經驗證可行；如果賠錢。他們的系統就是不好。但是，不必拿錢去冒險，正確

