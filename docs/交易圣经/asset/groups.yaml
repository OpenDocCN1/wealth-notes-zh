    ## 移動平均指標只是你的應聲蟲


    這裡有個非常少交易人懂的矛盾。所以，請務必留神。你期待移動平均指標這個工具協助你解讀趨勢，於是俯身看著它說：「指標啊指標，你能幫我確定趨勢嗎？」


    移動平均數這個小指標樂意效勞，於是一臉無辜仰望著你說：「是的，交易人先生，我樂意助你解讀趨勢。請給我的移動平均變數一個值。你要什麼，我就給你什麼……」


    所以你輸入變數值，據此獲得相對應的趨勢解讀。如果你給低數值，它會給你短期趨勢解讀。如果你輸入較大值，它會給你較長期的趨勢解讀。如果你給它中等值，它會給你較中期的解讀。你要什麼，它就給你什麼，而且讓你一目瞭然，但是不會有你還不知道的事。你問什麼，它就給你什麼，但它不會給你客觀、公正、獨立的建議。


    這個工具會自我實現，針對你的投入，給你正回饋。這就像在你面前放張鏡子，映射出你給的數值。這裡的矛盾就是你尋求工具協助你，自己卻在不知不覺間反倒成了工具！移動平均工具只是在偽裝你，卻偽裝得很不好。你對它的解讀結果有很大的影響力。你輸入數值，它將數值反射回來，只是用不同的方式偽裝。這是一面有趣的鏡子，就像你在狂歡節上看到會扭曲影像的哈哈鏡。這個工具只是將你對變數值的看法反射回來。你可能認不出自己的影像，但是相信我，那就是你，千真萬確。在你以主觀方式選擇數值，而且工具很小心且準確地將它反射給你，那個影像百分之百就是你。


    更大的諷刺是，你可能渾然不覺。在你要求移動平均工具協助你解讀趨勢時，你根本不知道其實你是在跟自己講話。


    在我看來，移動平均工具太過依賴你，沒辦法給你獨立的趨勢解讀，它太過依賴你，沒辦法做為有效的趨勢確定工具。你不知道它在決定趨勢上的有效，是因為它本身技術特殊，還是因為你運氣不錯，輸入一個不錯的變數值。它太過依賴你給的變數值。而這也是其他流行趨勢工具的缺點：它們都有一個需要主觀設定的變數。它們不過是你自身的扭曲反射，因為你才是它們解讀趨勢時的主宰。在我看來，它們的趨勢解讀都太過依賴你，以至於不可靠（見表9.2）。


    移動平均指標是交易人可用的最佳趨勢工具之一，因為它只有一個變數。影響趨勢解讀的自由度較小。它只有一個變數，而 MACD、ADX 多達三個！三個變數會給你太多的自由度，去影響它們的趨勢解讀。三個變數給你太大的彈性、太多發言權、太多影響力，以及太大的操縱空間，做出獲利向上傾斜的歷史性淨值曲線。光是一個變數（遑論三個），已給你太多的自由度，拿你的方法去和歷史資料做曲線配適。


    這就是為什麼這些趨勢工具都不好，不同的變數值會給你不同的趨勢解讀。變數越多，趨勢解讀的差異空間越大。差異越大，操弄空間越大，趨勢解讀便越不可靠。


    ## 表9.2 各種趨勢工具的變數數量


    | 趨勢工具 | 變數數量 |

    | --- | --- |

    | 移動平均數 | 1 |

    | MACD | 3 |

    | ADX | 3 |

    | 趨勢線 | 2 |


    有變數的工具過於主觀，太有彈性。它們只是你自己的電子傳真，成了樂意為你效勞的僕人，它們將你放進去的東西，分毫不差地反射回去。它們無法讓你知道新的東西，只是將你給它們的東西偽裝一下就送出來。它們不夠客觀或獨立，不值得依賴。它們成了樂意效勞的協作者，幫助你將你所用方法和歷史資料作曲線配適。


    ## 客觀與獨立是關鍵


    現在來談談趨勢工具的幾個關鍵議題（請記住，這裡的論述純屬我的個人意見，你的看法儘管有所不同，不用擔心。只要記得找到客觀的證據，支持你的立場就行）。優良的趨勢工具應該獨立於交易人之外。優良的趨勢工具應該百分之百客觀，而且不依賴任何主觀的解讀或投入。優良的趨勢工具應該獨立自主，不需要來自交易人的任何主觀訊息才能運作。優良的趨勢工具沒有交易人參與其中，交易人不會影響它的趨勢解讀。一旦趨勢工具能夠表現這些特徵，我才相信它可以列入趨勢解讀的選項。趨勢工具要先能獨立自主於交易人之外，才能來談實用性。它不需要任何變數的操弄，使它看起來似乎可行。就這麼簡單。


    需要交易人任何投入意見的趨勢工具，都不客觀，也不獨立。解讀趨勢時，不應該考慮這種工具。在我看來，任何工具或觀念如果是主觀的，用在交易上會太危險。我相信任何「主觀的」工具都很危險。我相信「主觀」會毀了交易人。


    我們應該只考慮客觀和獨立的工具。你用來協助做交易決策的任何東西，都應該通過客觀和獨立的測試。通過客觀獨立測試的工具，可能有用，也可能行不通。如果它們在簡單且客觀的交易計畫上行得通，你就有了一個可資依賴的工具。


    身為交易人，你知道你需要協助，所以你尋找能夠協助你的各種工具。在你的交易生涯之初，你相信你用的畫圖套裝軟體中包含的工具會有幫助，但是你並不了解，工具的彈性其實反而構成障礙，而不是嘉惠你。你可能要到很久以後才知道這個道理，在那之前只是百思不解、備感挫折，並且付出不少代價。


    就交易人能用的最佳技術指標之一來說，我們很容易了解移動平均指標有多主觀，趨勢解讀的差異有多大、多不可靠。交易人使用常見的趨勢工具卻陷入苦戰，因此也就不足為奇。


    移動平均數、MACD和ADX指標等趨勢工具，都被批評為過於主觀。交易相同市場的兩個人，使用的變數不同，會出現兩組不同的趨勢解讀。傳統的趨勢線也招致相同的批評，因為兩個不同的交易人看同一張走勢圖，視選擇的擺盪點可以畫出兩條不同的趨勢線。你為什麼要使用趨勢解讀如此不一致的工具？當一種工具的趨勢解讀可以因為不同的交易人而有那麼大的差異，你如何能客觀評量它的效果？這些工具就像經濟學家，解釋過去發生的事時頭頭是道，但在客觀分析未來時，卻一無是處。


    以上批評也同樣適用於更受歡迎的折返工具。


    ## 等候折返水準


    一旦確認某個趨勢，接下來就要保持耐性，等候折返水準自己浮現。遺憾的是，傳統的折返工具遭到和傳統的趨勢工具相同的批評。它們也依賴變數的參數。類似的交易人可能做成截然相反的結論，因為結論取決於對變數所用的數值。由於「主觀的」折返水準取決於「主觀的」趨勢確認，甚至讓問題雪上加霜！怪不得大部分順勢交易人都未能成功。


    ## 折返工具不良


    用於確認折返水準的一些常用方法包括：


    - 買超或賣超情況

    - 背離

    - 走勢圖型態

    - 折返百分率


    衡量買超和賣超情況的指標包括：


    - ROC〔變動率（rate of change）〕指標

    - RSI〔相對強弱指數（relative strength index）〕指標

    - 隨機擺盪指標（stochastic oscillator indicator）


    背離用於確認動能的喪失，發出價格即將反轉或者折返階段結束的訊號。衡量背離有賴於使用許多買超和賣超指標中的一個。


    折返量數和它們的趨勢表兄弟一樣，有依賴變數的缺點。一旦引進一個變數，結果就變得主觀和不可靠，因而


    身為交易人，你應該使用較少的主觀工具，運用更多百分之百客觀的工具，協助你執行交易。你要立下新格言：「……不再有迴旋餘地，不再有迴旋餘地……」


    為建構交易方法檢視各種交易工具和觀念時，你要變得十分嚴苛。你會學習排除主觀而不可靠的工具。你會再次見到，順勢交易人要找可靠的折返水準有多困難。常用的工具有太多的變數和數值，使得它們太過主觀、太過不穩定，以及太過不可靠。


    表9.3彙總了許多常用折返工具的變數數量。


    不同的變數數量會給交易人不同的折返解讀。變數越多，折返解讀的變異空間越大。變異越大，迴旋空間越大，折返解讀也越不可靠。


    ## 負負不會得正


    這裡你有兩個「負」：負趨勢工具和負折返工具。遺憾的是，交易時，負負不會得正，只會令人失望。表9.4彙總了一般交易人最常見的趨勢和折返工具。


    我點出了這些工具的弱點，也就是它們的變數。一個工具的變數越多，操弄工具以配適資料的迴旋空間或彈性越大。迴旋空間越大，解讀越不可靠。此外，這些不良的趨勢和折返指標是從價格衍生出來的，也落後於價格，使得它們很慢才確認趨勢的變動或折返的完成。即這些工具個別來看不是那麼差，結合成一套交易方法，則有致命的危險。


    ## 表9.3 折返工具的變數


