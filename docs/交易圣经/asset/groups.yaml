    不管你是機械型交易人，還是自由裁量型交易人，你所用方法的帳戶淨值曲線，都應該持續不斷更新，並且保持「實況」。此外，你必須記得，淨值曲線是根據單一合約的交易而來，並且不涉及任何資金管理。你應該關注的是，在單一合約的基礎上（或者固定部位規模），你所用方法的原始優勢、它的期望值、它持續壯大淨值或者維持淨值動量的能力。如果應用資金管理策略，這些事情可能就看不到。


