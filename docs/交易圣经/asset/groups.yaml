    \ -1% |\n\n圖 9.11 負 1% 的期望值\n\n很抱歉要在这裡再三叮嚀；但我覺得必須讓你牢牢記住。請讓我再說一遍。順勢交易時，務必記住這個簡單的目標。你進場交易不是為了立即獲利。你進場交易不是為了證明自己正確。你進場交易不是為了證明你的市場分析正確。你進場交易不是為了抓市場走向。你進場交易不是為了行動或進入市場的快感。你只往你相信是市場的趨勢走向去交易，以掌握賺取期望值的機會，而這至少需要你維持準確率和平均獲利相對於虧損比率分別高於33%和3:1。\n\
    \n表9.1總結了順勢交易人應該守住的交易邊界。\n\n我要你牢牢記住這一點，是因為我不希望見到你發展出一個令人滿意的順勢交易方法之後，因為蒙受一長串的連續虧損——不管是10筆、20筆，或者30筆虧損之後，將它丟棄一邊。這種事情會發生，不要認為它不會發生在你身上。請記住，順勢交易是很難受的。\n\
    \n我寧可見到，當你身處伸手不見五指的黑暗之地，所有的順勢交易人通常止步不前之際，你能夠記住順勢交易之所以會成功，是因為努力追求生存、避開破產風險，以及遵循良好的交易程序。此外，一個重要程序就是賺取期望值，而這不會在少數幾筆交易之後，就送上門來。你可能得花上一整年的時間，才能賺\n\
    \n## 表9.1 期望值邊界\n\n| 準確率 | 平均獲利 | 平均虧損 | 每冒險1元的期望值 |\n|---|---|---|---|\n| 33%\
    \ | 3 | 1 | 32% |\n| 50% | 3 | 1 | 100% |\n| 50% | 2 | 1 | 50% |\n| 33% | 2 |\
    \ 1 | -1% |\n\n取期望值，因為你不知道哪個市場會展開趨勢，而且你不會知道它什麼時候決定展開趨勢。你必須從程序思考，並且記住：交易就只是積極接觸市場，享受它帶來的機會，讓你賺取期望值。期望值不會在一個星期、一個月或者一季中發生。我希望你能了解這一點，並且記住我所說的事情。你的順勢交易策略也許未能在短短幾個月的交易之後，帶給你立即的利潤，請不要單單因為這樣就棄它如敝屣。不要那麼蠢，不要那麼笨，我再次為嘮叨不休而道歉，但我覺得這件事太過重要，不能只是隨便看過就好。\n\
    \n我已經將順勢交易成功的必要步驟化整為零，讓你看到它有多麼簡單。我也提醒你交易的真正目的，以及為什麼你的最低目標應該是達成33%的準確率，同時維持你的平均獲利相對於平均虧損於3:1。如果你能做到這些，那麼你會每拿1元投入交易去冒險，就賺得32分。在我解釋過為何順勢交易應該很簡單之後，我想要深入探討為何那麼多交易人覺得它很難做到。\n\
    \n## 順勢交易之難\n\n如果順勢交易那麼簡單，為什麼有那麼多人覺得那麼困難？如果你接受順勢交易確實能夠賺錢，但它賠錢的次數多於賺錢，而且順勢交易簡單到只要找到趨勢、等候折返水準和折返型態，以及等候證實用的進場訊號，那麼為什麼那麼多交易人仍然賠錢？好問題，而且我很高興你問了這個問題。\n\
    \n你現在知道順勢交易應該如同下述所說的那麼簡單：\n\n- 首先，找到交易格局的位置：\n  - 確認趨勢\n  - 等候折返水準\n  - 等候折返型態\n\
    \n- 然後，執行交易，以利用格局：\n  - 等候確認進場訊號\n  - 進入市場\n  - 下停損點\n  - 管理交易\n  - 獲利了結（理想上）\n\
    \n我們來逐步審視，觀察能否找到答案。我將檢視範圍限於交易格局和交易計畫，不觸及失敗的其他原因，因為前面幾章已深入討論過它們。且看我們是否能從交易人覺得順勢交易困難的原因，揭露更多真理。\n\
    \n## 確認趨勢\n\n我如果問你，成功的交易最常被人引用的口頭禪是什麼，你如何回答？是的，沒錯：「……順勢交易，趨勢是你的朋友……」而且這是成功的順勢交易第一個執行準則。\n\
    \n我們現在保守一點。假設只有60%的積極型交易人聽過且了解這個訊息（雖然我相信比率高得多）。如果是這樣的話，為什麼超過90%的積極型交易人仍然賠錢？沒錯，如果大多數積極型交易人知道成功交易的第一執行準則是順勢交易，為什麼會有那麼多積極型交易人賠錢？相當耐人尋味，是吧？\n\
    \n如果你相信超過60%的積極型交易人知道應該順勢交易，卻有超過90%的積極型交易人失敗，你不認為這聽起來相當予\n\n盾嗎？如果所有交易人都像他們認為的那麼聰明，大部分交易人會停止交易，回到家裡，過他們在進入市場之前的生活。他們會離開螢幕，停止交易；因為大多數人都知道要順勢交易，卻做不到，事情必有蹊蹺。如果我像我很久以前認為的那樣聰明，我早就離開交易了。在大部分人知道該做什麼事，可是卻做不到，市場一定被動了手腳。是的，我樂於承認自己不是場內最聰明的人，所以我堅持交易下去，可是這讓我長時間經歷太多的虧損，記憶中留下許多瘀傷、沮喪、失望，思考市場在什麼地方動手腳對付我。我花了約十五年的光陰，才研究出市場的最大逆境往我這邊丟出的哪顆骰子灌了鉛。竟然灌了鉛對付我！\n\
    \n是的，就是現在，大多數交易人正用灌鉛骰子在交易，雖然這些工具看起來像是設計來協助交易人的，實際上卻是在拋出市場的最大逆境。說起來很難過，卻不得不說：大部分方法在運作時都違背交易人的最佳利益。\n\
    \n但是請讓我回到原來想要傳達的訊息。你曉得大部分交易人懂得要順勢交易，你也知道大部分積極型交易人失敗了。我們必須問的問題是：為什麼？現在你知道交易人失敗的原因有許多，但是在這裡，我們將相關的討論限制在交易成功的三大支柱上。\n\
    \n- 資金管理不良：大部分人的帳戶都過度交易，未能使用明智的資金管理。這使得破產風險高於0%，並且走上財務破產之途。\n- 交易方法不良：大部分交易人並沒有一套擁有正期望值的穩定策略。大多數人擁有的是負期望值策略，使得破產風險高於0%，並且走上財務破產之途。\n\
    - 交易心態不當：大部分交易人不能遵循他們所用的方法，即使那些方法不錯。他們未能正確驗證他們的方法，而且對所用策略產生信心。他們無法緊緊盯住老虎的眼晴。他們缺乏信心、專注、一致和紀律。\n\
    \n由於這一章是談交易方法，因此我也以此為討論重點。\n\n大部分人都渾然不知自己在用不良的方法交易。如果Ring\n\n如果成功的順勢交易方法背後的核心價值動因，是趨勢和折返確認工具，那麼交易方法不良其實反映了兩大價值動因有問題：不良的趨勢工具，和不良的折返工具。\n\
    \n我要再一次遺憾地說，大部分交易人使用的趨勢和折返工具，大多數都不佳。在我看來，他們不應該採用它們。因為它們難以正確確認趨勢。大多數交易人相信自己已經透過各種工具確認趨勢時，就會進入市場，卻偏偏發現價格反轉！這樣的發展令人備感挫折。\n\
    \n所以這是技術面分析的真正困境。技術面分析有一大部分的知識著眼於確認趨勢，因為這是成功的順勢交易的第一執行準則。可是有那麼多順勢交易人賠了錢。我不想過度簡化，因為賠錢有許多原因，如同前面說過的。我只是指出另一個重大原因，是趨勢和折返確認技術本身出問題。沒錯，如果大部分趨勢和折返技術良好，那麼獲利的積極型交易人難道不會超過10%嗎？\n\
    \n## 趨勢工具不良\n\n今天的交易人所用的最流行趨勢工具可能包括下列幾種：\n\n- 移動平均數指標（moving average indicator）\n\
    - MACD〔移動平均數分合（Moving Average Convergence Divergence）〕指標\n- ADX〔平均動向指數（Average\
    \ Directional Index）〕指標\n- 趨勢線（trend lines）\n\n我認為它們是不良的趨勢工具。但是，在解釋為什麼之前，我要承認幾件事。第一，我個人認為，簡單的移動平均數指標可能是最佳趨勢指標之一。它在確認趨勢方面，效果相當不錯。第二，我個人在我的中線順勢交易上使用移動平均數。我使用比較長期的200日簡單移動平均數，以確認我所說的主趨勢（dominant\
    \ trend）。我用它來防止自己對於我相信的長期趨勢，執行中線的順勢交易。但是，雖然我確實使用移動平均數指標，卻沒有在自己的交易格局或交易計畫中採用它。我用它只是因為我寧可不要違反它而交易。所以我並不使用移動平均數於決定趨勢。我不使用移動平均數於確認折返水準。我不使用移動平均數於確認進場水準。我不使用移動平均數於確認停損水準。我不使用移動平均數於確認出場點。我不這麼用。而且，如果我將200日移動平均數從我的機械型模式中移除，它們實際上反而賺更多錢。然而，當我這麼做，每筆交易的平均利潤卻下降，所以當我對趨勢的看法和用200日移動平均數衡量的主趨勢一致，對我來說，交易確實划得來。\n\
    \n我也應該指出，我之所以使用200日，並不是因為它有何神奇之處。我總是用它，也不知道它是不是最適當的平均數，可是我不在意。我就是這樣用。\n\n所以說，雖然我認為移動平均數可能是交易人能用的最佳指標之一，而且儘管我個人確實使用200日簡單移動平均數，我仍然相信它是不良的趨勢工具，而且批評不是沒有道理。我現在要更仔細地探討移動平均數指標，並且和你分享為什麼我相信它是不良的工具。此外，我的批評也適用於我提過的其他趨勢指標。\n\
    \n## »移動平均數指標\n\n所以我們來看看如圖9.12所示的簡單移動平均數指標。這是今天交易人能夠使用的最簡單、也可能是最有效的指標之一。移動平均數指標有一個變數。趨勢的解讀取決於這個變數的值。這個指標將價格平滑化，當價格高於移動平均數，我們認為趨勢向上。當價格跌到低於移動平均數，我們認為趨勢向下。也就是說，移動平均數可以和它前一天的數值比較，如果上升，趨勢就被解讀為上漲。如果低於前一天，那麼趨勢被解讀為下跌。就那麼簡單。\n\
    \n唯一的問題是確定要使用的移動平均數長度，你應該使用10日、20日、40日或者100日？\n\n圖9.12顯示兩條移動平均線，代表變數的兩個不同值。其一是40日的數值，另一是200日的數值。價格高於移動平均線，趨勢被視為向上。價格如果低於移動平均線，趨勢被視為向下。根據200日移動平均線，走勢圖顯示的整個期間內，趨勢被視為向上。根據比較短的40日移動平均線，由於價格忽而在40日移動平均線之上，忽而在它之下，趨勢有時向上，有時向下。這是我\n\
    \n認為移動平均數指標是不良趨勢工具的原因。\n\n我可以找三個相同的交易人，要他們各自獨坐在隔音間中。他們無法彼此商量，也聽不到別人說的話。這些交易人可能各有二十年的交易經驗。他們的身高相同，髮色相同，眼睛顏色相同，而且持有相同的護照。他們都畢業於相同的大學，擁有相同的碩士學位。接下來，我拿相同期間內相同的走势图給他們看，並給他們相同的單一工具，也就是移動平均數指標。接著，我會問他們同一個問題：「今天我要在你的電腦螢幕上顯示的那個市場交易，你能告訴我趨勢嗎？」\n\
    \n現在，依他們置入移動平均指標的數值而定，我可能拿到三份不同的趨勢解讀——有個人可能說趨勢向上，另一個說向下，第三個說不上不下，他們的說法完全取決於變數的值。但是等等，你一定會說：「布倫特，但是難道你不應該把你偏愛的時間架構告訴這三位交易人嗎？這不是非常重要之事嗎？」\n\
    \n![](img/4cb0a78760f87b9407822631d12abbf8_244_0.png)\n\n圖9.12 不同變數值的影響\n\n我的回答是：交易不是辯論。市場並不關心我的時間架構是什麼。它並不在意我的需求。而且我問這三位交易人完全相同的問題：「今天我要дар電腦螢幕上顯示的那個市場交易，你能告訴我趨勢嗎？」\n\
    \n市場並不在意我的時間架構是什麼。我也不在意。我只想知道趨勢是向上、向下或者走平？我用自己偏愛的時間架構去掌握趨勢做交易，是我自己的事。我只想知道趨勢是什麼。正如我告訴這三位交易人的，我想要進入市場交易，這其實是個簡單的問題，不需要過度分析、討論、剖析、辯論。請不要把交易問題過度複雜化。\n\
    \n我那有效的論點依然存在。即使三位交易人都獨立使用很緊的區間，變數值介於18日到28日之間，我還是可能接到三份不同的趨勢解讀。誰能說哪個交易人的意見是對或錯？誰能說某個交易人的意見優於另一個，所以我應該聽哪一個的話？沒人能說這種話。他們都相同，所以不能任意選擇。他們都對，也都不對，取決於他們置入移動平均數指標的值而定。而且，誰能說使用介於18日到28日之間的區間是正確的？誰能說使用介於35日到45日的區間沒有比較好？沒人能這樣說。沒有一個統一的考試委員會有標準正確答案，因為這樣的委員會並不存在。唯一的\n\
    \n主宰是市場本身，而市場透過最大逆境隱藏了真正趨勢意圖。市場喜歡保有一切秘密，讓人去做各式各樣的猜測。\n\n所以這是我的難題，也是使用移動平均指標每一位交易人的難題：我要相信誰？變數應該使用哪個值？我的移動平均指標應該使用哪個數值？這可是個大問題。\n\
    \n移動平均指標有個變數。趨勢的解讀取決於變數的值。變數的存在，使得指標以及因此而來的趨勢解讀變得主觀，所以我認\n"
  mdcn: "\n![](img/4cb0a78760f87b9407822631d12abbf8_231_0.png)\n\n## 圖9.6 上漲趨勢中的支撐區\n\
    \n中，市場需要先上漲，然後再下跌。實務上，折返順勢交易只需要做一件事，那就是耐心等候市場在上漲趨勢中下跌到支撐區，才進場作多，以及在下跌趨勢中等候跌深反彈，找到阻力區以賣出。實務上的折返順勢交易恰恰如同上面所說，不多也不少。若有任何人表示你要做的事情不只如此，請勿聽從。\n\
    \n如圖9.6所示，當市場處於上漲趨勢，耐性十足的折返順勢交易人會等候價格拉回到支撐區，才設法進場，捕捉持續進行的趨勢。所以箇中秘訣是學習如何確認真正的支撐區和阻力區。這才是困難的部分！從現在開始，我將把折返順勢交易一詞簡稱為「順勢交易」。\n\
    \n## 力求簡單\n\n順勢交易應該很簡單，但許多人覺得很難。順勢交易就是如此簡單，並且可以分成三個定義明確而相輔相成的部分：\n\n- 哲學\n- 目標\n\
    - 執行\n\n曉得這些，你就知道如何順勢交易！很簡單！順勢交易的哲學就是相信：\n\n- 上漲趨勢中，價格需要下跌再上漲。 memo\n- 下跌趨勢中，價格需要上漲再下跌。\n\
    \n目標是：\n\n- 如果市場處於上漲趨勢，那麽交易人需要確定良好的支撐水準位於何處，以建立多頭部位，並且捕捉上漲趨勢的持續走勢。 memo\n- 如果市場處於下跌趨勢，那麽交易人需要確定良好的阻力水準位於何處，以建立空頭部位，並且捕捉下跌趨勢的持續走勢。\n\
    \n執行包括兩個步驟：\n\n- 確定交易格局的位置：\n  - 確認趨勢\n  - 等候折返水準\n  - 等候折返型態\n\n- 執行交易計畫：\n \
    \ - 等候證實用的進場訊號\n  - 進入市場\n  - 下停損點\n  - 管理交易\n  - 可望獲利了結\n\n順勢交易就是這麼簡單，不多也不少。如果任何人有其他說法，他們只是在扯後腿。\n\
    \n告訴你順勢交易的容易之後，我要提醒你，你為何要交易。許多人誤以為交易的目標是靠抓對市場的走向賺錢。事實不然。這種說法其實距真相太遠。這是我要提醒你的。\n\
    \n## 回到交易的初衷\n\n現在是我該提醒你為何要交易的時候了。在我告訴過你為何順勢交易應該很容易之後，我不想讓你覺得你能很快就開始交易，開始期待憑空收進大把鈔票。\n\
    \n我要告訴你，順勢交易不見得表示你真的要順勢交易。雖然順著你相信是趨勢的方向去交易，應該是你的偏好，但基於實務上的理由，你的趨勢方向可能是錯的。市場的最大逆境，會盡其所能，掩飾它的真正方向，而你只能往你認為它正在走的方向去交易。結果，67%的時候，你會賺不到錢，在停損出場之後，數算自己的虧損！記住：順勢交易人的生活是很難受的。\n\
    \n所以我覺得這是提醒你交易初衷的好時機。我認為，你應該只為了掌握賺取期望值的機會而交易。你不應該為了立刻獲利以求滿足而交易。你不應該為了證明你所做的市場分析正確而交易。你不應該為了行動的快感而交易。你只應該為了掌握賺取期望值的機會而交易，透過你所用方法的期望值，而不是它的準確率，在比較長的時間內賺錢。\n\
    \n雖然你會試著往市場趨勢的方向交易，但你交易不是為了預測市場的趨勢。順勢交易只是合理而穩健的交易主張。順勢交易和試著正確抓取市場趨勢不同。你當然希望市場繼續往你相信趨勢應該走的方向持續下去，但你不該依賴這件事。你進場交易的目的，是要掌握賺取期望值、賺錢的機會，而且你知道，順勢交易是明智的交易方向。\n\
    \n現在要談一個嚴峻的事實，提醒你順勢交易人的痛苦。\n\n市場很少有趨勢。它們大部分時間在箱形區間內上下起伏，將順勢交易人沖來洗去。哀嘆聲之後還是哀嘆。這對順勢交易人的意義，就是賠錢的次數多於賺錢。順勢交易人頂多只能期望在平均三分之一的交易中獲利。順勢交易人的生活很辛苦。但是，他們沒有賠掉全部錢的原因，在於他們順著趨勢的方向交易，平均獲利通常遠高於平均虧損。厚利彌補了許多較小的虧損仍有餘。所以順勢交易非常符合你為何要交易的目的。雖然準確率低得讓人難過，卻有正期望值，而且能獲利。\n\
    \n你需要記住稍早學到的期望值公式，如圖9.7所示。\n\n身為順勢交易人，你在內心深處一定要時時記住：你交易只是為了掌握賺取期望值的機會，不是為了立即獲利，不是為了\n\
    \n```\n每一塊錢的期望報酬 = (獲利機率 × 平均獲利 / 平均虧損) - (虧損機率 × 平均虧損 / 平均虧損)\n```\n\n## 圖9.7\
    \ 期望值公式\n\n證明你做對了。你進場交易，不是要抓市場的方向。你交易是為了掌握賺取期望值的機會，而惟有在一段很長的期間內執行許多交易，才能辦到。只有一路上去承受許多虧損之後，才能得到。期望值是從你的獲利和虧損交易而來。而且，身為順勢交易人，若你起碼能在三分之一的交易上賺錢，賺錢時平均獲利起碼是平均虧損金額的3倍，那麼你可以預期每投入交易1元，就能賺得32分。你可以預期賺得正期望值。你可以預期每拿1元在交易上冒險，就能賺得32分（見圖9.8）。\n\
    \n因此，身為順勢交易人，你可望賺到錢，投入交易的每1元賺得32分，既是正數，數值也不差！但是這32分不是真正的錢，它是期望值。它是考慮了你的獲利和虧損，在你拿1元去交易冒險，而產生的淨32分。它不是立即賺得的利潤。它是一段很長的期間內，執行許多筆交易，其中只有少數賺到錢，卻有許\n\
    \n| 準確率 | 33% |\n| 平均獲利 | 3 |\n| 平均虧損 | 1 |\n| 每冒險一元的期望值 | |\n| E(R)=[33% × (3/1)]\
    \ - [67% × (1/1)] | |\n| = 32% |\n\n## 圖9.8 32%的期望值\n\n| 準確率 | 50% |\n| 平均獲利 |\
    \ 3 |\n| 平均虧損 | 1 |\n| 每冒險一元的期望值 | |\n| E(R)=[50% × (3/1)] - [50% × (1/1)] | |\n\
    | = 100% |\n\n## 圖9.9 100%的期望值\n\n多賠錢，如此累積下來的期望值！\n\n現在，如果你能提高你的準確率到 50%，以及維持你的高獲利相對於虧損的比率，那麼如圖\
    \ 9.9 所示，你可望每 1 元賺得 100 分（1 元）。\n\n如果獲利相對於虧損的比率不能維持，下挫到 2:1，那麼你還是可以預期從投入交易的每 1\
    \ 元賺得 50 分，如圖 9.10 所示。\n\n但是，如果你的準確率下挫到 33%，而獲利相對於虧損的比率維持為 2:1，那麼你可以預期每投入交易 1\
    \ 元，就會損失 1 分，如圖 9.11 所示。\n\n務必切記，你的期望值來自遵循程序。這個程序就是應用獲利順勢交易策略，在一段很長的期間內執行許多筆交易。那些交易中，會有許多令人難受的虧損。那許多令人難受的虧損當中，會有兩三筆極其穩健的厚利，利潤高到足以彌補所有的虧損還有餘，因此你最後還是賺到錢。但是請記住，你賺的不是錢，而是期望值，從獲利和虧損交易兩者產生的。\n\
    \n現在，為了設定明智的順勢交易邊界，你永遠應該試著維持你的準確率和獲利相對於虧損比率至少分別等於或高於 33% 和 3:1。\n\n| 準確率 | 50%\
    \ |\n| 平均獲利 | 2 |\n| 平均虧損 | 1 |\n| 每冒險一元的期望值 | |\n| E(R)= [50% x (2/1)] - [50%\
    \ x (1/1)] | |\n| = 50% |\n\n圖 9.10 50% 的期望值\n\n| 準確率 | 33% |\n| 平均獲利 | 2 |\n\
    | 平均虧損 | 1 |\n| 每冒險一元的期望值 | |\n| E(R)= [33% x (2/1)] - [67% x (1/1)] | |\n| =\
    \ -1% |\n\n圖 9.11 負 1% 的期望值\n\n很抱歉要在这裡再三叮嚀；但我覺得必須讓你牢牢記住。請讓我再說一遍。順勢交易時，務必記住這個簡單的目標。你進場交易不是為了立即獲利。你進場交易不是為了證明自己正確。你進場交易不是為了證明你的市場分析正確。你進場交易不是為了抓市場走向。你進場交易不是為了行動或進入市場的快感。你只往你相信是市場的趨勢走向去交易，以掌握賺取期望值的機會，而這至少需要你維持準確率和平均獲利相對於虧損比率分別高於33%和3:1。\n\
    \n表9.1總結了順勢交易人應該守住的交易邊界。\n\n我要你牢牢記住這一點，是因為我不希望見到你發展出一個令人滿意的順勢交易方法之後，因為蒙受一長串的連續虧損——不管是10筆、20筆，或者30筆虧損之後，將它丟棄一邊。這種事情會發生，不要認為它不會發生在你身上。請記住，順勢交易是很難受的。\n\
    \n我寧可見到，當你身處伸手不見五指的黑暗之地，所有的順勢交易人通常止步不前之際，你能夠記住順勢交易之所以會成功，是因為努力追求生存、避開破產風險，以及遵循良好的交易程序。此外，一個重要程序就是賺取期望值，而這不會在少數幾筆交易之後，就送上門來。你可能得花上一整年的時間，才能賺\n\
    \n## 表9.1 期望值邊界\n\n| 準確率 | 平均獲利 | 平均虧損 | 每冒險1元的期望值 |\n|---|---|---|---|\n| 33%\
    \ | 3 | 1 | 32% |\n| 50% | 3 | 1 | 100% |\n| 50% | 2 | 1 | 50% |\n| 33% | 2 |\
    \ 1 | -1% |\n\n取期望值，因為你不知道哪個市場會展開趨勢，而且你不會知道它什麼時候決定展開趨勢。你必須從程序思考，並且記住：交易就只是積極接觸市場，享受它帶來的機會，讓你賺取期望值。期望值不會在一個星期、一個月或者一季中發生。我希望你能了解這一點，並且記住我所說的事情。你的順勢交易策略也許未能在短短幾個月的交易之後，帶給你立即的利潤，請不要單單因為這樣就棄它如敝屣。不要那麼蠢，不要那麼笨，我再次為嘮叨不休而道歉，但我覺得這件事太過重要，不能只是隨便看過就好。\n\
    \n我已經將順勢交易成功的必要步驟化整為零，讓你看到它有多麼簡單。我也提醒你交易的真正目的，以及為什麼你的最低目標應該是達成33%的準確率，同時維持你的平均獲利相對於平均虧損於3:1。如果你能做到這些，那麼你會每拿1元投入交易去冒險，就賺得32分。在我解釋過為何順勢交易應該很簡單之後，我想要深入探討為何那麼多交易人覺得它很難做到。\n\
    \n## 順勢交易之難\n\n如果順勢交易那麼簡單，為什麼有那麼多人覺得那麼困難？如果你接受順勢交易確實能夠賺錢，但它賠錢的次數多於賺錢，而且順勢交易簡單到只要找到趨勢、等候折返水準和折返型態，以及等候證實用的進場訊號，那麼為什麼那麼多交易人仍然賠錢？好問題，而且我很高興你問了這個問題。\n\
    \n你現在知道順勢交易應該如同下述所說的那麼簡單：\n\n- 首先，找到交易格局的位置：\n  - 確認趨勢\n  - 等候折返水準\n  - 等候折返型態\n\
    \n- 然後，執行交易，以利用格局：\n  - 等候確認進場訊號\n  - 進入市場\n  - 下停損點\n  - 管理交易\n  - 獲利了結（理想上）\n\
    \n我們來逐步審視，觀察能否找到答案。我將檢視範圍限於交易格局和交易計畫，不觸及失敗的其他原因，因為前面幾章已深入討論過它們。且看我們是否能從交易人覺得順勢交易困難的原因，揭露更多真理。\n\
    \n## 確認趨勢\n\n我如果問你，成功的交易最常被人引用的口頭禪是什麼，你如何回答？是的，沒錯：「……順勢交易，趨勢是你的朋友……」而且這是成功的順勢交易第一個執行準則。\n\
    \n我們現在保守一點。假設只有60%的積極型交易人聽過且了解這個訊息（雖然我相信比率高得多）。如果是這樣的話，為什麼超過90%的積極型交易人仍然賠錢？沒錯，如果大多數積極型交易人知道成功交易的第一執行準則是順勢交易，為什麼會有那麼多積極型交易人賠錢？相當耐人尋味，是吧？\n\
    \n如果你相信超過60%的積極型交易人知道應該順勢交易，卻有超過90%的積極型交易人失敗，你不認為這聽起來相當予\n\n盾嗎？如果所有交易人都像他們認為的那麼聰明，大部分交易人會停止交易，回到家裡，過他們在進入市場之前的生活。他們會離開螢幕，停止交易；因為大多數人都知道要順勢交易，卻做不到，事情必有蹊蹺。如果我像我很久以前認為的那樣聰明，我早就離開交易了。在大部分人知道該做什麼事，可是卻做不到，市場一定被動了手腳。是的，我樂於承認自己不是場內最聰明的人，所以我堅持交易下去，可是這讓我長時間經歷太多的虧損，記憶中留下許多瘀傷、沮喪、失望，思考市場在什麼地方動手腳對付我。我花了約十五年的光陰，才研究出市場的最大逆境往我這邊丟出的哪顆骰子灌了鉛。竟然灌了鉛對付我！\n\
    \n是的，就是現在，大多數交易人正用灌鉛骰子在交易，雖然這些工具看起來像是設計來協助交易人的，實際上卻是在拋出市場的最大逆境。說起來很難過，卻不得不說：大部分方法在運作時都違背交易人的最佳利益。\n\
    \n但是請讓我回到原來想要傳達的訊息。你曉得大部分交易人懂得要順勢交易，你也知道大部分積極型交易人失敗了。我們必須問的問題是：為什麼？現在你知道交易人失敗的原因有許多，但是在這裡，我們將相關的討論限制在交易成功的三大支柱上。\n\
    \n- 資金管理不良：大部分人的帳戶都過度交易，未能使用明智的資金管理。這使得破產風險高於0%，並且走上財務破產之途。\n- 交易方法不良：大部分交易人並沒有一套擁有正期望值的穩定策略。大多數人擁有的是負期望值策略，使得破產風險高於0%，並且走上財務破產之途。\n\
    - 交易心態不當：大部分交易人不能遵循他們所用的方法，即使那些方法不錯。他們未能正確驗證他們的方法，而且對所用策略產生信心。他們無法緊緊盯住老虎的眼晴。他們缺乏信心、專注、一致和紀律。\n\
    \n由於這一章是談交易方法，因此我也以此為討論重點。\n\n大部分人都渾然不知自己在用不良的方法交易。如果Ring\n\n如果成功的順勢交易方法背後的核心價值動因，是趨勢和折返確認工具，那麼交易方法不良其實反映了兩大價值動因有問題：不良的趨勢工具，和不良的折返工具。\n\
    \n我要再一次遺憾地說，大部分交易人使用的趨勢和折返工具，大多數都不佳。在我看來，他們不應該採用它們。因為它們難以正確確認趨勢。大多數交易人相信自己已經透過各種工具確認趨勢時，就會進入市場，卻偏偏發現價格反轉！這樣的發展令人備感挫折。\n\
    \n所以這是技術面分析的真正困境。技術面分析有一大部分的知識著眼於確認趨勢，因為這是成功的順勢交易的第一執行準則。可是有那麼多順勢交易人賠了錢。我不想過度簡化，因為賠錢有許多原因，如同前面說過的。我只是指出另一個重大原因，是趨勢和折返確認技術本身出問題。沒錯，如果大部分趨勢和折返技術良好，那麼獲利的積極型交易人難道不會超過10%嗎？\n\
    \n## 趨勢工具不良\n\n今天的交易人所用的最流行趨勢工具可能包括下列幾種：\n\n- 移動平均數指標（moving average indicator）\n\
    - MACD〔移動平均數分合（Moving Average Convergence Divergence）〕指標\n- ADX〔平均動向指數（Average\
    \ Directional Index）〕指標\n- 趨勢線（trend lines）\n\n我認為它們是不良的趨勢工具。但是，在解釋為什麼之前，我要承認幾件事。第一，我個人認為，簡單的移動平均數指標可能是最佳趨勢指標之一。它在確認趨勢方面，效果相當不錯。第二，我個人在我的中線順勢交易上使用移動平均數。我使用比較長期的200日簡單移動平均數，以確認我所說的主趨勢（dominant\
    \ trend）。我用它來防止自己對於我相信的長期趨勢，執行中線的順勢交易。但是，雖然我確實使用移動平均數指標，卻沒有在自己的交易格局或交易計畫中採用它。我用它只是因為我寧可不要違反它而交易。所以我並不使用移動平均數於決定趨勢。我不使用移動平均數於確認折返水準。我不使用移動平均數於確認進場水準。我不使用移動平均數於確認停損水準。我不使用移動平均數於確認出場點。我不這麼用。而且，如果我將200日移動平均數從我的機械型模式中移除，它們實際上反而賺更多錢。然而，當我這麼做，每筆交易的平均利潤卻下降，所以當我對趨勢的看法和用200日移動平均數衡量的主趨勢一致，對我來說，交易確實划得來。\n\
    \n我也應該指出，我之所以使用200日，並不是因為它有何神奇之處。我總是用它，也不知道它是不是最適當的平均數，可是我不在意。我就是這樣用。\n\n所以說，雖然我認為移動平均數可能是交易人能用的最佳指標之一，而且儘管我個人確實使用200日簡單移動平均數，我仍然相信它是不良的趨勢工具，而且批評不是沒有道理。我現在要更仔細地探討移動平均數指標，並且和你分享為什麼我相信它是不良的工具。此外，我的批評也適用於我提過的其他趨勢指標。\n\
    \n## »移動平均數指標\n\n所以我們來看看如圖9.12所示的簡單移動平均數指標。這是今天交易人能夠使用的最簡單、也可能是最有效的指標之一。移動平均數指標有一個變數。趨勢的解讀取決於這個變數的值。這個指標將價格平滑化，當價格高於移動平均數，我們認為趨勢向上。當價格跌到低於移動平均數，我們認為趨勢向下。也就是說，移動平均數可以和它前一天的數值比較，如果上升，趨勢就被解讀為上漲。如果低於前一天，那麼趨勢被解讀為下跌。就那麼簡單。\n\
    \n唯一的問題是確定要使用的移動平均數長度，你應該使用10日、20日、40日或者100日？\n\n圖9.12顯示兩條移動平均線，代表變數的兩個不同值。其一是40日的數值，另一是200日的數值。價格高於移動平均線，趨勢被視為向上。價格如果低於移動平均線，趨勢被視為向下。根據200日移動平均線，走勢圖顯示的整個期間內，趨勢被視為向上。根據比較短的40日移動平均線，由於價格忽而在40日移動平均線之上，忽而在它之下，趨勢有時向上，有時向下。這是我\n\
    \n認為移動平均數指標是不良趨勢工具的原因。\n\n我可以找三個相同的交易人，要他們各自獨坐在隔音間中。他們無法彼此商量，也聽不到別人說的話。這些交易人可能各有二十年的交易經驗。他們的身高相同，髮色相同，眼睛顏色相同，而且持有相同的護照。他們都畢業於相同的大學，擁有相同的碩士學位。接下來，我拿相同期間內相同的走势图給他們看，並給他們相同的單一工具，也就是移動平均數指標。接著，我會問他們同一個問題：「今天我要在你的電腦螢幕上顯示的那個市場交易，你能告訴我趨勢嗎？」\n\
    \n現在，依他們置入移動平均指標的數值而定，我可能拿到三份不同的趨勢解讀——有個人可能說趨勢向上，另一個說向下，第三個說不上不下，他們的說法完全取決於變數的值。但是等等，你一定會說：「布倫特，但是難道你不應該把你偏愛的時間架構告訴這三位交易人嗎？這不是非常重要之事嗎？」\n\
    \n![](img/4cb0a78760f87b9407822631d12abbf8_244_0.png)\n\n圖9.12 不同變數值的影響\n\n我的回答是：交易不是辯論。市場並不關心我的時間架構是什麼。它並不在意我的需求。而且我問這三位交易人完全相同的問題：「今天我要дар電腦螢幕上顯示的那個市場交易，你能告訴我趨勢嗎？」\n\
    \n市場並不在意我的時間架構是什麼。我也不在意。我只想知道趨勢是向上、向下或者走平？我用自己偏愛的時間架構去掌握趨勢做交易，是我自己的事。我只想知道趨勢是什麼。正如我告訴這三位交易人的，我想要進入市場交易，這其實是個簡單的問題，不需要過度分析、討論、剖析、辯論。請不要把交易問題過度複雜化。\n\
    \n我那有效的論點依然存在。即使三位交易人都獨立使用很緊的區間，變數值介於18日到28日之間，我還是可能接到三份不同的趨勢解讀。誰能說哪個交易人的意見是對或錯？誰能說某個交易人的意見優於另一個，所以我應該聽哪一個的話？沒人能說這種話。他們都相同，所以不能任意選擇。他們都對，也都不對，取決於他們置入移動平均數指標的值而定。而且，誰能說使用介於18日到28日之間的區間是正確的？誰能說使用介於35日到45日的區間沒有比較好？沒人能這樣說。沒有一個統一的考試委員會有標準正確答案，因為這樣的委員會並不存在。唯一的\n\
    \n主宰是市場本身，而市場透過最大逆境隱藏了真正趨勢意圖。市場喜歡保有一切秘密，讓人去做各式各樣的猜測。\n\n所以這是我的難題，也是使用移動平均指標每一位交易人的難題：我要相信誰？變數應該使用哪個值？我的移動平均指標應該使用哪個數值？這可是個大問題。\n\
    \n移動平均指標有個變數。趨勢的解讀取決於變數的值。變數的存在，使得指標以及因此而來的趨勢解讀變得主觀，所以我認\n"
