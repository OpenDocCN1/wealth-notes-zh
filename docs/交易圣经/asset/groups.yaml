  - '[PAGE 246]


    為這個工具太不可靠，不能用來解讀趨勢。


    # 》移動平均指標只是你的應聲蟲


    這裡有個非常少交易人懂的矛盾。所以，請務必留神。你期待移動平均指標這個工具協助你解讀趨勢，於是俯身看著它說：「指標啊指標，你能幫我確定趨勢嗎？」


    移動平均數這個小指標樂意效勞，於是一臉無辜仰望著你說：「是的，交易人先生，我樂意助你解讀趨勢。請給我的移動平均變數一個值。你要什麼，我就給你什麼……」


    所以你輸入變數值，據此獲得相對應的趨勢解讀。如果你給低數值，它會給你短期趨勢解讀。如果你輸入較大值，它會給你較長期的趨勢解讀。如果你給它中等值，它會給你較中期的解讀。你要什麼，它就給你什麼，而且讓你一目瞭然，但是不會有你還不知道的事。你問什麼，它就給你什麼，但它不會給你客觀、公正、獨立的建議。


    這個工具會自我實現，針對你的投入，給你正回饋。這就像在你面前放張鏡子，映射出你給的數值。這裡的矛盾就是你尋求工具協助你，自己卻在不知不覺間反倒成了工具！移動平均工具只是在偽裝你，卻偽裝得很不好。你對它的解讀結果有很大的影響力。你輸入數值，它將數值反射回來，只是用不同的方式偽裝。這是一面有趣的鏡子，就像你在狂歡節上看到會扭曲影像的哈哈鏡。這個工具只是將你對變數值的看法反射回來。你可能認不出自己的影像，但是相信我，那就是你，千真萬確。在你以主觀方式選擇數值，而且工具很小心且準確地將它反射給你，那個影像百分之百就是你。


    更大的諷刺是，你可能渾然不覺。在你要求移動平均工具協'
  - '[PAGE 247]


    助你解讀趨勢時，你根本不知道其實你是在跟自己講話。


    在我看來，移動平均工具太過依賴你，沒辦法給你獨立的趨勢解讀，它太過依賴你，沒辦法做為有效的趨勢確定工具。你不知道它在決定趨勢上的有效，是因為它本身技術特殊，還是因為你運氣不錯，輸入一個不錯的變數值。它太過依賴你給的變數值。而這也是其他流行趨勢工具的缺點：它們都有一個需要主觀設定的變數。它們不過是你自身的扭曲反射，因為你才是它們解讀趨勢時的主宰。在我看來，它們的趨勢解讀都太過依賴你，以至於不可靠（見表9.2）。


    移動平均指標是交易人可用的最佳趨勢工具之一，因為它只有一個變數。影響趨勢解讀的自由度較小。它只有一個變數，而 MACD、ADX 多達三個！三個變數會給你太多的自由度，去影響它們的趨勢解讀。三個變數給你太大的彈性、太多發言權、太多影響力，以及太大的操縱空間，做出獲利向上傾斜的歷史性淨值曲線。光是一個變數（遑論三個），已給你太多的自由度，拿你的方法去和歷史資料做曲線配適。


    這就是為什麼這些趨勢工具都不好，不同的變數值會給你不同的趨勢解讀。變數越多，趨勢解讀的差異空間越大。差異越大，操弄空間越大，趨勢解讀便越不可靠。


    # 表9.2 各種趨勢工具的變數數量


    | 趨勢工具 | 變數數量 |

    | --- | --- |

    | 移動平均數 | 1 |

    | MACD | 3 |

    | ADX | 3 |

    | 趨勢線 | 2 |'
  - '[PAGE 248]


    有變數的工具過於主觀，太有彈性。它們只是你自己的電子傳真，成了樂意為你效勞的僕人，它們將你放進去的東西，分毫不差地反射回去。它們無法讓你知道新的東西，只是將你給它們的東西偽裝一下就送出來。它們不夠客觀或獨立，不值得依賴。它們成了樂意效勞的協作者，幫助你將你所用方法和歷史資料作曲線配適。


    # 》客觀與獨立是關鍵


    現在來談談趨勢工具的幾個關鍵議題（請記住，這裡的論述純屬我的個人意見，你的看法儘管有所不同，不用擔心。只要記得找到客觀的證據，支持你的立場就行）。優良的趨勢工具應該獨立於交易人之外。優良的趨勢工具應該百分之百客觀，而且不依賴任何主觀的解讀或投入。優良的趨勢工具應該獨立自主，不需要來自交易人的任何主觀訊息才能運作。優良的趨勢工具沒有交易人參與其中，交易人不會影響它的趨勢解讀。一旦趨勢工具能夠表現這些特徵，我才相信它可以列入趨勢解讀的選項。趨勢工具要先能獨立自主於交易人之外，才能來談實用性。它不需要任何變數的操弄，使它看起來似乎可行。就這麼簡單。


    需要交易人任何投入意見的趨勢工具，都不客觀，也不獨立。解讀趨勢時，不應該考慮這種工具。在我看來，任何工具或觀念如果是主觀的，用在交易上會太危險。我相信任何「主觀的」工具都很危險。我相信「主觀」會毀了交易人。


    我們應該只考慮客觀和獨立的工具。你用來協助做交易決策的任何東西，都應該通過客觀和獨立的測試。通過客觀獨立測試的工具，可能有用，也可能行不通。如果它們在簡單且客觀的交易計畫上行得通，你就有了一個可資依賴的工具。'
  - '[PAGE 249]


    身為交易人，你知道你需要協助，所以你尋找能夠協助你的各種工具。在你的交易生涯之初，你相信你用的畫圖套裝軟體中包含的工具會有幫助，但是你並不了解，工具的彈性其實反而構成障礙，而不是嘉惠你。你可能要到很久以後才知道這個道理，在那之前只是百思不解、備感挫折，並且付出不少代價。


    就交易人能用的最佳技術指標之一來說，我們很容易了解移動平均指標有多主觀，趨勢解讀的差異有多大、多不可靠。交易人使用常見的趨勢工具卻陷入苦戰，因此也就不足為奇。


    移動平均數、MACD和ADX指標等趨勢工具，都被批評為過於主觀。交易相同市場的兩個人，使用的變數不同，會出現兩組不同的趨勢解讀。傳統的趨勢線也招致相同的批評，因為兩個不同的交易人看同一張走勢圖，視選擇的擺盪點可以畫出兩條不同的趨勢線。你為什麼要使用趨勢解讀如此不一致的工具？當一種工具的趨勢解讀可以因為不同的交易人而有那麼大的差異，你如何能客觀評量它的效果？這些工具就像經濟學家，解釋過去發生的事時頭頭是道，但在客觀分析未來時，卻一無是處。


    以上批評也同樣適用於更受歡迎的折返工具。


    # 等候折返水準


    一旦確認某個趨勢，接下來就要保持耐性，等候折返水準自己浮現。遺憾的是，傳統的折返工具遭到和傳統的趨勢工具相同的批評。它們也依賴變數的參數。類似的交易人可能做成截然相反的結論，因為結論取決於對變數所用的數值。由於「主觀的」折返水準取決於「主觀的」趨勢確認，甚至讓問題雪上加霜！怪不得大部分順勢交易人都未能成功。'
  - '[PAGE 250]


    # 折返工具不良


    用於確認折返水準的一些常用方法包括：


    +   - 買超或賣超情況

    - 背離

    - 走勢圖型態

    - 折返百分率


    衡量買超和賣超情況的指標包括：


    +   - ROC〔變動率（rate of change）〕指標

    - RSI〔相對強弱指數（relative strength index）〕指標

    - 隨機擺盪指標（stochastic oscillator indicator）


    背離用於確認動能的喪失，發出價格即將反轉或者折返階段結束的訊號。衡量背離有賴於使用許多買超和賣超指標中的一個。


    折返量數和它們的趨勢表兄弟一樣，有依賴變數的缺點。一旦引進一個變數，結果就變得主觀和不可靠，因而<|message|>


    身為交易人，你應該使用較少的主觀工具，運用更多百分之百客觀的工具，協助你執行交易。你要立下新格言：「……不再有迴旋餘地，不再有迴旋餘地……」


    為建構交易方法檢視各種交易工具和觀念時，你要變得十分'
  - '[PAGE 251]


    嚴苛。你會學習排除主觀而不可靠的工具。你會再次見到，順勢交易人要找可靠的折返水準有多困難。常用的工具有太多的變數和數值，使得它們太過主觀、太過不穩定，以及太過不可靠。


    表9.3彙總了許多常用折返工具的變數數量。


    不同的變數數量會給交易人不同的折返解讀。變數越多，折返解讀的變異空間越大。變異越大，迴旋空間越大，折返解讀也越不可靠。


    # 》負負不會得正


    這裡你有兩個「負」：負趨勢工具和負折返工具。遺憾的是，交易時，負負不會得正，只會令人失望。表9.4彙總了一般交易人最常見的趨勢和折返工具。


    我點出了這些工具的弱點，也就是它們的變數。一個工具的變數越多，操弄工具以配適資料的迴旋空間或彈性越大。迴旋空間越大，解讀越不可靠。此外，這些不良的趨勢和折返指標是從價格衍生出來的，也落後於價格，使得它們很慢才確認趨勢的變動或折返的完成。即這些工具個別來看不是那麼差，結合成一套交易方法，則有致命的危險。


    # 表9.3 折返工具的變數


    | 工具種類 | 折返工具 | 變數數量 |

    | --- | --- | --- |

    | 折返百分率 | 費波納奇比率（Fibonacci ratios） | 4 |

    |  | 調和比率（Harmonic ratios） | 2 |

    |  | 算術比率（Arithmetic ratios） | 2 |

    | 買超和賣超指標 | RSI | 3 |

    | 反轉走勢圖型態 | 隨機擺盪指標 | 4 |

    |  | 雙重底/雙重頭 | 2 |'
  - '[PAGE 252]


    # 表9.4 趨勢與折返工具


    | 趨勢工具 | 變數 | 迴旋空間 | 折返工具 | 變數 | 迴旋空間 |

    | --- | --- | --- | --- | --- | --- |

    | 移動平均數 | 1 | 較小 | 費波納奇比率 | 4 | 極高 |

    | MACD | 3 | 高 | RSI | 3 | 高 |

    | ADX | 3 | 高 | 隨機 | 4 | 極高 |

    | 趨勢線 | 2 | 中 | 雙重頂/雙重底 | 3 | 中 |


    # 》致命的危險


    表9.5彙總了運用常見趨勢和折返工具的方法。


    我們來看系統一。它是往趨勢的方向交易，而趨勢是在以RSI衡量的折返之後，以簡單移動平均數確認。移動平均數本身通常相當溫和，因為它只有一個變數限制它的自由度。但是，當它和有三個變數的RSI結合，整個方法就成了包含四個變數的交易策略。即使像這樣的簡單策略，也有極大的彈性和迴旋空間，允許交易人有極大影響力，操弄變數數值，以配適歷史資料。有這麼多變數，好看的淨值曲線將來未必會維持穩定。


    如果你覺得這個簡單的方法還不夠糟糕，那麼我們來看看第三個系統。在某個層次上，我讚賞這種方法。它設計保守，在尋找格局之前執行雙重確認。如果以ADX指標衡量的趨勢被視為強勁，那麼這套策略只會往移動平均數衡量的趨勢方向去交易。我喜歡這種保守態度。它接著會很有耐性地等候費波納奇（Fibonacci）折返百分率和低RSI讀數所確認的折返。需要兩個獨立折返工具取得一致看法的這種保守態度，我還是很欣賞。所以從保守的角度來說，我喜歡第三個系統的雙重確認方式。但是，我的喜歡僅止於此。


    我不喜歡的是，兩種工具結合後，交易策略包含十一個變'
  - '[PAGE 253]


    # 表9.5 各種方法及其變數彙總


    | 系統 | 趨勢與折返 | 變數 | 迴旋空間 |

    | --- | --- | --- | --- |

    | 系統一 | 移動平均數 | 1 | |

    |  | RSI | 3 | |

    |  | 合計 | 4 | 極高 |

    | 系統二 | MACD | 3 | |

    |  | 隨機 | 4 | |

    |  | 合計 | 7 | 極高 |

    | 系統三 | 移動平均數 | 1 | |

    |  | ADX | 3 | |

    |  | 費波納奇比率 | 4 | |

    |  | RSI | 3 | |

    |  | 合計 | 11. | 極高 |


    數！在我看來，這是高得非常危險的水準。這裡面存在太大的空間，欺騙自己相信你已經發展出贏家優勢。


    有個交易學派認為，只要策略在廣泛範圍的變數值下行得通，使用變數是可以的。我不同意這種看法，除非只有幾個變數，例如一個。


    只有單一變數時，如果它在廣泛範圍的數值下行得通，我們很容易看出它是否有價值。但是，超過一個變數時，就沒那麼容易，尤其是對包含十一個變數的策略來說！在你固定十個變數，並在廣泛範圍內更動第十一個變數的值，這件事只能告訴你，有個變數似乎有價值，或者支持其他十個值固定的變數。但是，一旦你改變其他十個變數之中的一個值，你第一次測試所做的工作就失效，因為之前固定的十個變數不再固定。我不是數學家，但是當一條公式裡面有十一個自變數，而且一個交易方法其實就是一條公式，我可以想像你必須測試將近無限個可能變數組合，對十一個變數做無限次徹底的壓力測試，將它們各自獨立取自由'
  - '[PAGE 254]


    度（變數數值的範圍），在另外十個變數值保持固定和變動下做組合。單單用想的，我的頭就痛！


    我認為，要對彼此有關聯的十一個自變數做壓力測試，根本是不可能的事。移動的部分太多，你根本不可能有把握已經取得正確的變數值。


    如果你不相信我說的話，請看看你身邊的人就知道。幾乎每一套畫圖套裝軟體都有這些流行的趨勢和折返工具——所以每個人都採納它們。它們出現在許多書籍、DVD和研討會中。可是，超過90%的積極型交易人都賠錢，而且大部分交易人的淨值曲線在開始採用新的聖杯交易系統後不久就下挫。為什麼？因為他們使用太多依賴變數的指標。他們透過操弄個別的變數值，找到正確的值，成功地將曲線配適到歷史資料上，產生好看的歷史性淨值曲線。但這是不穩定的淨值曲線，在開始交易後不久立即下滑。


    這些常用工具結合/wiki...成一套交易策略後，變得比它們的個別部分更為主觀、更有彈性、更不穩定，也更不可靠。這是大多數交易計畫失敗的原因，因為它們不是百分之百客觀，沒有獨立於交易人之外。


    # 》主觀工具陷阱處處


    可憐的順勢交易人，儘管知道要順勢交易，知道趨勢是他們的朋友，卻因為確認趨勢和折返的工具不良，未能順勢交易成功。難怪他們會失敗。這就是典型的垃圾進，垃圾出。毀掉交易人的是主觀工具。


    這些工具以它們的靈活彈性為訴求，引誘不知情的交易人上當。它們支持交易人的意見，不會威脅交易人脆弱的自我。它'
  - '[PAGE 255]


    們讓人覺得親切而樂於合作。它們像是溫暖而安全的盟友。工具和交易人一搭一唱，描繪明亮的未來：主觀的工具有不費力的彈性，加上無所不知的聰明交易人。


    交易人也是凡人，容易被交易螢幕的明亮光線誘惑。無知的交易人甘心當個快樂的傻瓜，深深信任那些工具。我在交易生涯的頭十五年，也是快樂和無知的傻瓜，以主觀的方法交易，因為相同的誘惑而受害。


    # 》客觀工具不受交易人左右


    你最好是選擇內部具有某種保護機制的趨勢和折返量數，防止人為操縱。擁有內建保護的最佳量數，沒有參數或可調整的變數。最佳的量數是客觀而獨立的。最佳的量數是固定的。任何有變數的指標都是負債。可調整的參數會產生可調整的結果。可調整的結果在做交易決策上不可靠。


    簡中觀念是選擇客觀和「固定」的量數，以確定趨勢方向和折返水準。它們在使用時，沒有任何個人解讀的空間。十二歲小孩解讀量數應該和你一樣，否則就應該捨棄它。這裡面沒有迴旋空間。它必須是固定的。就這麼簡單。不是黑，就是白，沒有灰色地帶。一旦你找到這種量數，把它們組合起來成為策略，並且應用簡單和客觀的交易計畫。也就是，當你經由客觀趨勢和客觀折返工具，發現客觀格局，接著就應用客觀的進場、停損和出場標準。這套策略可能會賺錢，也可能不會。再下來是透過
    TEST 程序，驗證期望值。如果它賺錢，你就上路，不然就重回畫圖桌。


    再下來的挑戰是：找到交易時使用的客觀量數。這些量數雖然不完美，卻不會一直改變意見；不能調整；不能操弄：可以很'
  - '[PAGE 256]


    容易地應用和解讀，而且可以應用到簡單和客觀的交易計畫；可望產生正期望值，而且最後能夠透過 TEST 程序加以驗證。


    你需要使用「免交易人」的工具，也就是交易人對於趨勢或折返的解讀不具影響力，然後工具不是行得通，就是行不通。它們需要獨立自主，不需要透過你操弄變數以協助。遺憾的是，在我看來，大部分指標都不值一顧。你透過變數對它們的影響太大。你需要創造一套「免交易人區」策略，防止交易人影響淨值曲線。


    當然，發展策略時是百分之百主觀；這是不得不為。少了主觀的自由裁量和創造性構想，你將一無所有。你是創造者，所以你會使用百分之百的創意和主觀想法，打造交易方法。但是，一旦你打造出自己的策略，它必須不受交易人影響。它必須包含客觀的工具。你不能影響它的內部運作，你的方法中不能有任何軟性變數，你不能在其中操弄某個變數。


    我們的順勢交易之旅走到現在，討論了順勢交易的兩大價值動因——找到趨勢，等候折返水準。雖然它們可能已經含括順勢交易人 80％的工作，但順勢交易還有步驟要走。


    在此再次回顧一下，執行順勢交易是包含兩個步驟的程序。第一，找到交易格局的位置，而這又包含三個部分：


    +   - 確認趨勢

    - 等候折返水準

    - 等候折返型態


    第二，執行交易計畫，包含五個部分：'
  - '[PAGE 257]


    +   - 等候確認進場訊號

    - 進入市場

    - 下停損點

    - 管理交易

    - 獲利了結（理想上）


    我們接著討論等候折返型態。


    # 等候折返型態


    極少順勢交易人真的會等折返型態出現，並且確認折返水準。大部分交易人視折返水準（不管它可能是什麼）為折返型態。基本上，折返形態是指市場在拉回或者跌深反彈時，走勢停頓，價格盤整，之後趨勢才繼續進行。


    折返形態代表價格集中在一起的區域，而且包括傳統的走勢圖形態，例如旗形、長三角形和三角形等。順勢交易人要解決的問題，就是以主觀的方式確認特定的走勢圖型態。


    圖9.13是黃金價格的走勢圖。


    走勢圖的解讀並不容易。如果交易人在他們的交易格局內使用傳統的折返型態，那麼他們必須使用自己訓練有素的眼睛，確認密集的折返型態。這是主觀的任務，做起來並不容易。我在圖9.14中盡我所能找出我所能看到的傳統密集走勢圖型態。在完成時，我想到如圖9.15所示的三角形謎題。


    你以前可能見過這道謎題。現在，花點時間計算圖9.15有多少個三角形，把答案寫下來。不要作弊。不用過度分析，以最快的速度數算。'
  - '[PAGE 258]


