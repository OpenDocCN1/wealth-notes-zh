  - '[PAGE 99]


    # 第5章


    # 第三通則：發展交易風格


    這一章要探討如何發展適當的交易風格，而這是交易的第三項必要通則。適當的交易風格取決於兩個決定：一是交易模態；二是交易的時間架構。


    # 交易模態


    交易模態（trading mode）指的是你喜歡使用的交易種類。模態有兩種：一是順勢交易；二是逆勢交易。


    交易不是順勢交易，就是逆勢交易。說起來很簡單。困難的是如何找到趨勢！逆勢交易一般稱之為短線波段交易（swing trading）。所以我會在討論時用「短線波段」，而不「逆勢」一詞。圖5.1簡明地解釋了順勢交易和短線波段交易。


    市場極少持續走某個趨勢，大約85%的時間落在箱形區間內浮沉，令順勢交易人備感挫折。順勢交易人會在認出獨特趨勢時'
  - '[PAGE 100]


    ![](img/4cb0a78760f87b9407822631d12abbf8_100_0.png)


    # 圖5.1 順勢交易與短線波段交易


    進場交易，而且往他們認定的趨勢方向交易。短線波段交易人則和市場趨勢方向背道而馳進行交易。他們相信市場趨勢會反轉，或者會提供很快的機會，在趨勢拉回時交易。


    順勢交易人的準確率通常很低，而且經常賠錢，但當他們獲利，就會賺進一大筆錢。而且他們的平均交易時間通常是幾個星期之久，或甚至長達幾個月。短線波段交易人的準確率通常較高，平均獲利則較低。他們會在幾天之內，最晚幾個星期之內，軋平部位。但是對這兩種交易人來說，困難的地方都是確定趨勢的方向。


    身為交易人，你需要選擇一種模態——順勢交易、波動短線交易，或者兩者並行。許多成功的交易人通常會將順勢交易和短線波段交易都納入交易計畫。'
  - '[PAGE 101]


    另一個重要的因素是你的時間架構。


    # 時間架構


    你必須決定交易時間架構——當日、短線、中線，或者長線交易。當日沖銷交易（day trading）是指在一天結束之前「軋平」，或者退出市場。


    當日沖銷交易人絕對不抱部位過夜，而且可能在一天當中交易許多次。採用其他三種時間架構的交易人，確實會抱著部位過夜，只是時間長短不一。短線交易人可能持有部位最多一個星期。中線交易人可能是兩三個星期，長線交易人則超過一個月。但是短、中、長線之間並沒有制式的分法。


    # 選擇的藝術


    交易模態和時間架構構成許多組合，供你選擇適合自己的交易風格。現在一般的交易書籍普遍認為，決定個人交易風格時應該使用、選擇或發展適合個性或脾氣的交易風格。你應該對你的交易風格感到自在。否則，你會很難遵循和執行。


    # 風格的「適性」是迷思


    你可能讀過或聽過這個建議許多次。而從直覺來看，這是有意義的，因為每個人的脾氣和個性都不同。找到適合個性的交易方法，是有道理的。但是這項一般指導準則有幾個小問題。它雖然立意良善，卻通常忽略了市場和交易的現實。


    首先，如果關於市場的閱讀內容都行得通，你大可精挑細'
  - '[PAGE 102]


    選一個讓你安心自在的交易方法。遺憾的是，關於交易和市場的閒聽內容大多都行不通，也鮮有證據支持。一般來說，讀者只會看到兩三個特別挑過的圖表範例，以支持作者的觀念。但是並沒有客觀的證據，顯示那個觀念可以持續不斷賺錢。我對此並不驚訝，因為關於交易的閒聽內容都行不通。這是事實。如果行得通，你不會看到90%的交易人都賠錢。可行的話，應該是90%的交易人都獲利。所以，很遺憾，最大逆境不允許你挑選適合性格的交易觀念或方法，因為大部分交易觀念都不值一眨。


    其次，在交易上讓人感覺「放心」的事情通常行不通。如果交易讓人放心，每個人都會去做，並賺進可觀的利潤。務請記住，最大逆境很少交出「讓人放心」的利潤。舉例來說，讓人覺得最放心的交易，通常發生在一般交易人覺得絕大多數人的想法和他們一樣時。交易人覺得放心而作多，是因為他們讀過的所有分析、造訪過的所有聊天網站，全都表示和他們相同的看法。交易人因為人多安全而感到放心。但是一般來說，當某種觀念傳到群眾耳裡時，通常已經反映在交易價格上。等到大部分人看法相同才進場的交易人，通常是最後進場的人。最後才進場，意味著還在場外的買家相當少，無法協助推升價格。一旦每個人都做了「讓人放心」的交易，市場往往有個令人討厭的反轉習慣——讓每個人都停損出場。根據我的經驗，最好是和少數人一起交易，而待在少數人當中或者只有少數人的看法和你一樣，並不叫人放心，因為你是群眾之外的人。一般來說，「令人放心」會害死交易人。因此，雖然一般的建議是發展一種適合你個性的交易風格，立意良善，卻忽視了「放心」的交易人很少獲利的市場事實。'
  - '[PAGE 103]


    # 風格也要適「財」適用


    此外，不是所有的交易風格都需要交易人相同的財務承諾。一般而言，短線波段交易需要的財務承諾低於長線的順勢交易。如果你擁有無限的財務資源，這層考量不會構成絆腳石。但是如果你像大部分私人交易人那樣，可用於交易的風險資本有限，那麼這會是重要考量因素。一般來說，交易期限越長，交易帳戶規模必須越大。


    舉例來說，假設你想在 20 日移動平均線和波動比較緩慢的 60 日移動平均線交叉時買進，反之則賣出。我雖然不知道這種長線方法的成果；但是，如果你對市場組合的操作正確，而且運用合理的資金管理，要是沒賺到錢，我會很驚訝。這套策略的結果可能顯示：即使你只有
    30% 的交易獲利，但平均獲利相對平均虧損比率要是能達到某個水準（比如 3:1），那你就會賺到錢。利用前一章介紹的期望值公式，你應可預期每冒險一塊錢，至少賺到
    20 分，或者報酬率至少為 20%。但是這種兩條移動平均線交叉的系統要交易成功，你必須交易 20 到 30 個市場，而這通常超越大部分散戶的財務實力。


    當你明白成功交易所需的組合規模之大，就知道小散戶遇到什麼樣的難題。長線順勢交易行得通的原因，在於交易人撒的網，盡可能涵蓋又廣又的市場，時間則盡可能久。順勢交易人能藉此提高抓住一兩個飆漲中市場的機會。長線順勢交易人需要監控和交易
    20 到 30 個市場，才會成功。


    以海龜交易系統（Turtle Trading system）為例說明。這是個很著名的長線順勢交易程式，需要交易 20 到 30 個市場。圖 5.2 顯示 2007
    年以 100 萬美元的帳戶去交易得到的結果。2007 年是出色'
  - '[PAGE 104]


    ![](img/4cb0a78760f87b9407822631d12abbf8_104_0.png)


    # 圖5.2 海龜交易系統操作100萬美元模式組合的實際合約結果


    2007年1月1日到2007年12月28日


