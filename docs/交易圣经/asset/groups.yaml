    # 克服主觀


    你應該看得出來，順勢交易雖然只是個簡單的程序，卻受許多問題所苦。決定趨勢、尋找折返水準，還有依賴有變數的指標或主觀的圖形去解讀，以確認折返形態。他們都受害於主觀的意見。等候確認進場訊號需要經驗，而進場、下停損點、管理交易以及獲利了結，都需要紀律和一致。


    遺憾的是，順勢交易計畫的三大價值動因——確定趨勢、尋找折返水準，以及確認折返型態，在整個交易程序中最為主觀。所以，那麼多順勢交易人失敗，並不足為奇！我們要回答的是這個問題：怎麼辦？在一個理想的世界，順勢交易者只用最佳的趨勢確認和折返量數工具。可惜，世界並不完美，市場的最大困境就是確據。


    就我所知，這個世界上沒有完美的趨勢工具、完美的折返量數或完美的折返型態，每次都挖到黃金。交易隱含機率，沒有十拿九穩的事，所以尋找完美的趨勢和折返工具是沒有意義的：因為它們根本不存在。但是我相信，和依賴變數、指標與傳統的走勢圖型態等主觀工具比起來，交易人在確定趨勢、尋找折返水準，以及確認折返型態方面，可以做得更好。


