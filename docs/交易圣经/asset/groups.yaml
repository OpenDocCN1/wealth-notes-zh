    # 第1章


    # 交易的現實世界


    根據《幽靈的禮物》(Phantom of the Pits) 所述，交易唯一真正的秘密是……


    最優秀的輸家就是長期的贏家。


    信不信由你，這可能是交易成功背後唯一真正的秘密。雖然你可能覺得好像陳腔濫調，但我希望看完本書，你會了解為何它是可長可久的交易生涯背後的核心真理。


    依我之見，《幽靈的禮物》一針見血指出成功的要素。大部份交易人都是糟糕的輸家。他們討厭認賠出場、移動停損點，而且尋找各式各樣的理由，合理化他們的行動，繼續在市場交易。雖然帳戶還有錢，這些可憐的交易人卻忽視賠錢的部位，直到虧損大到不能再置之不理，只好被迫認賠出場，吞下災難性的損失。他們推遲不可避免、勢必發生的事，仍然抱著部位會起死回'
  - '[PAGE 30]


    生的希望。只要交易還沒軌平，就還有機會證明他們是對的。交易尚未軌平，他們就不必承認自己錯了，因為損失還沒發生。人們討厭承認自己錯了。大部分人只是因為他們是糟糕的輸家，所以是糟糕的交易人。學習盡速認賠，是交易不可或缺的一部分，而且你會因此踏出堅實的第一步，邁向成功。繼續當個糟糕的輸家，你會流落到貧民收容所。要做到成功的長期交易，你必須當個優秀的輸家。


    就我自己的交易來說，大部分時間似乎都在賠錢。我的短線交易獲利筆數平均只有約50%，而我的中線趨勢交易獲利筆數約為30%。因此，由於我不是經常獲利，所以必須是個優秀的輸家，才能在交易上存活下去，否則我的帳戶會空空如也，再也不能交易。但願你能成為優秀的輸家。


    雖然可以只做為練習，但絕對值得回頭去檢討你所有的交易，看看如果你依循簡單的停損準則，交易成果會是如何。對長線交易而言，一個簡單的停損準則（對短線交易來說則相反）可能是在價格跌破過去三根長條的最低點時出場，或者你可以在價格跌破上個星期的低點時停損出場。只要吻合你交易的時間架構，用哪一種停損都可以。現在，你可能發現並沒有轉虧為盈，但我敢說，它會讓你的帳戶看起來比不這麼做要好。相信我，當個優秀的輸家是值得的。


    如果你現在的交易擁有利潤，那麼可以跳過這一小段的討論。要是不然，請抬起頭來，放下筆，不要再盯盯市場。這裡的討論對你有立即的好處。請停止所有的交易。


    如果你目前的交易沒有獲利，如果你想放手一搏，擺脫賠損（回補交易資本的損失），你現在所能做最好的事情，就是起身離開你的交易帳戶。我知道這麼做很難，尤其你會感覺像是承'
