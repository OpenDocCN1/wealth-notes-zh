    ## 黃達


    黃達（Dar Wong）是在新加坡深具魅力的外匯交易人。如果黃達在某個展覽會上發表演說，我一定找得到他。因為在換場時間，他身邊簇擁的人群一定最多。只要放眼展覽大廳，看到哪邊人潮洶湧，往往就是黃達對著一大群聚精會神的交易人在講話。黃達帶著友善的笑容和自信的風采，正是典型的成功外匯交易人的縮影——自信，隨和，友善。


    黃達和我（雪梨）、邁克爾·庫克（倫敦）都在1989年進入新加坡的美國銀行服務，開始交易。黃達在期貨部門。他在新加坡國際金融交易所（Singapore International
    Monetary Exchange；SIMEX）交易大廳工作，執行顧客的委託單。


    1996年，黃達離開他那時的雇主花旗集團（Citigroup Inc.），成為期貨交易所的個人會員，以自營場內交易員（local trader）的身分操作自己的帳戶。


    身為自營場內交易員，黃達專注於當日沖銷交易日經225種股價指數（Nikkei 225）期貨合約。他起初是用30分鐘的長條走勢圖交易傳統的圖形型態。早年的時候，黃達使用Metastock，但是不久就棄而不用，因為他發現，它的連續合約（continuous
    contract）資料不一致。1998年，黃達放棄所有的畫圖套裝軟體，只依賴路透和彭博即時饋送實時資料。


    2001年，由於預期新加坡交易所將關閉交易大廳，走向完全電子化（2006年完成這項作業），黃達離開交易大廳，專心在螢幕上交易。黃達就像許多以前的自營場內交易員，離開交易大廳，改為螢幕交易之初，很難找到自己的優勢。在那之前，他能見到委託單在交易大廳之內流動而受益，到了新的交易辦公室，卻覺得疏離，與外界脫節。在交易大廳交易和在螢幕上交易，是完全不同的體驗。黃達花了約兩年的時間，發展出他的新螢幕基礎當日沖銷PowerWave
    TradingTM（PowerWave）方法。


    今天，黃達繼續使用多重時間架構執行當日沖銷交易。黃達使用30分鐘長條圖進場、下停損點和管理出場，只在他的PowerWave格局出現同步，並與4小時和日長條圖一致時才交易。當他的格局同步且所有三個時間架構一致，他接著會尋求1:3的風險－獎酬機會去執行交易。他的PowerWave方法主要是以價格和型態為基礎。他尋求交易逆勢和趨勢持續型態。在逆勢型態方面，他尋找極端的價格延伸之後，迅速反轉的機會。至於趨勢持續型態，他在價格呈現密集之後尋找突破機會。他基本上是不用指標的交易人，但大家也知道他偶爾會使用慢隨機指標（slow
    stochastic）衡量反轉的強度。


    黃達採用外匯服務供應商提供的簡單蠟燭圖，以改善他的PowerWave方法，除此之外，不使用任何特殊的軟體。黃達使用的交易螢幕不雜亂。黃達交易外匯，主要是只將幾個指數丟進去。他喜歡交易歐元／美元和美元／日圓貨幣對。於指數，他會交易日經和道瓊指數期貨。


    在交易之外，黃達埋首鑽研強身健體之道。許多人在得知他對於維持良好的健康和食補，知識深厚且滿懷興趣之後，通常驚訝不已。怪不得他那麼深具魅力——原來他身上都是正確的維他命！黃達和家人住在新加坡。現在我們就來聽聽他的一段忠告是什麼。


    對於痛苦的輸家來說，交易一直是個謎團。已經發現證明可行策略的贏家，則只是在每一次辨識出某些技術型態時，分別重複使用選定的交易計畫而已！


    我個人覺得，在你可以終身追求這個生涯之前，交易概念必須正確。這個基本的理解，一般是用於強調承受低風險的行業。除了交易概念，技術策略也會變化，而且會因為多年來基本而和市場人氣的變動，參數會跟著變得多樣化。


    經驗豐富的交易人在展開市場活動之前，會確實充分了解想要操作工具的樁樑因素，接著了解他的帳戶所允許的交易上限。一般來說，建立起始交易部位時，只用到交易上限的一部分或三分之一。如果要進一步使用交易上限，那是為了建立利潤金字塔，而這通常需要是短期持有的部位。初始要控制賠錢交易在少數幾筆的水準極為不可能，這時可以根據交易預估，採用良好的風險報酬比率，以獲利機率較高的交易，最終彌補所發生的虧損。


    配合精心策劃的交易保證金分布狀態，你必須開始尋找一組高度證明可行的策略，以了解市場的行為。整體而言，各種不同的市場行為，會導致不同的走势圖型態和技術週期出現，這時便需要靠你去「診斷」，然後開立正確的處方！


    經驗豐富的交易人在抓取進場點時，會堅持讓風險報酬比率低於1:2，這點絕不妥協。理想的起始部位應該能夠預見潛在獲利和能夠忍受的後端虧損相比，為三倍或更多。


    談到下停損點的風險容量，雖然各個派別的看法分歧，但這主要取決於個人相對於預估出場區間的交易忍受度，而這會轉變到市場技術面型態的辨識！


    我個人認為，交易人必須先確認自己是當日沖銷交易人，還是趨勢（部位）交易人。確認交易目標，有助於在整個職涯的每個目標期間，達成交易目標（金錢獎賞）。在達成持續獲利之前，沒有所謂正確的定義或錯誤的定義。

    交易是機率遊戲。在做對之前，怎麼玩並沒有固定準則。總結而言，獲勝的概念是基於高效率的風險管理，而不是預測的趨勢後來真的實現。交易老手總是會在市場將形成的極端區域，或者在已經形成的高點和低點間區域裡的快速反轉，選取進場點，以賺取短線利潤。

    總言之，你能搶在別人之前預見的，才會成為你的利潤；現在出現在你眼前的，利潤已經落入別人的口袋。是的，預見是交易成功的第一關鍵！


    黃達


    黃達深信，如果不先了解交易成功的關鍵概念，就沒辦法取得成功。黃達指的是找到低風險的交易格局。對每個交易人來說，這個概念應該恆久不變。黃達認為，技術交易策略是可以變動的，能夠、也會隨著市場狀況的變化而變動。但是低曝險的概念永遠不能變。對於有志於交易生涯的人，黃達建議找到能夠提供1:3風險獎酬報酬的低曝險交易，並決定自己是偏好當日沖銷交易，還是部位交易。黃達堅信交易是機率的遊戲，在做對之前，沒有固定的遊戲準則！但是，交易人必須了解成功的首要根基是確認低風險的交易格局，否則很難成功。對黃達來說，一切都要回歸低風險的定義和接受低風險。黃達給你的忠告是：首先專注於交易格局風險，而且只執行低風險和伴隨著提供3:1報酬潛在報酬的交易。這是很棒的忠告。


    黃達的聯絡網站：www.pwforex.com。


