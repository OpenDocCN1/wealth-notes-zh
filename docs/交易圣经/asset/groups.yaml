    # 圖8.19 合約口數增加的帳戶水準


    如資料所示，固定百分率在下一個合約水準上，每一口合約只需要貢獻比較少的利潤。不同的合約水準貢獻的利潤不一樣，固定百分率法得以穩定的步調累增合約。


    圖8.18顯示Forex_Trader使用固定百分率的績效。帳戶起始規模為30,000美元，限制風險為帳戶餘額的2%，無條件捨去取整數，交易以100口合約為上限，根據這些條件，Forex_Trader賺取的利潤超過1,900萬美元，而承受最高金額和百分率賠損分別為1,363,759美元和19%。固定百分率每1美元的賠損痛苦，可以賺到14美元的利潤，而且各交易的標準差是6.5%。


    固定百分率法能否達成資金管理目標？答案為是。賠錢時，固定百分率法會約束你拿比較少的錢去冒險，交易比較少的合約。賺錢且帳戶餘額成長時，固定百分率法容許你拿更多錢去冒險，因此交易更多的合約。


    固定百分率和固定風險、固定單位、威廉斯固定風險一樣，


    也能協助管理個別交易的風險。由於你受到限制，帳戶只能曝險於一個最高的固定百分率，你能做的交易會受到限制。以 Forex_Trader 為例，固定百分率會因為金額風險對帳戶來講太高而拒絕執行一筆交易。因此，除了提供良好的資金管理策略，固定百分率也有助於管理個別的交易風險。


    固定百分率遭受的一個批評，是小額帳戶交易人難以到達交易門檻。如果你你的風險資本限於 10,000 美元，你會發現很難找到一筆交易的風險小到足以交易。如果你想要限制風險於
    10,000 美元帳戶的 2%，你也許只能交易金額風險為 200 美元或更低的訊號，而且你可能發現這樣的訊號並不多。


    專業交易人偏愛固定百分率的主要原因，是因為它能極有效地降低交易人的破產風險。務請記住，專業交易人並不注重他們能賺多少錢，而是他們能否盡其所能妥善管理風險，而固定百分率在管理風險上，效果非常好。表
    8.9 清楚顯示這一點。


    表 8.9 顯示，每一筆虧損限於帳戶餘額的固定百分率，交易需要連續虧損多少次，帳戶餘額才會成為零。舉例來說，如果以零帳戶餘額為破產點，每一筆交易拿帳戶餘額的固定
    5% 去冒險，需要連續虧損 104 筆交易，帳戶餘額才會成為零或者破產。


