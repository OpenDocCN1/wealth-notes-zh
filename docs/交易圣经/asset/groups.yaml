    \ | 1 | 0.6 | 1.2 | 4.5 |\n| 期望值 | 20% | 44% | 56% | 66% |\n\n確率，平均獲利是500美元。Jobber的準確率極高，達90%，平均獲利卻最低，只有300美元。Swinger的準確率相當高，達70%，平均獲利較高，為614美元。Trendy的準確率較低，只有30%，但平均獲利最高，達2,267美元。\n\
    \n哪一種方法勝出？答案是Trendy。它的獲利最高，達3,300美元，期望值最高，達66%。儘管它的準確率很低，只有30%，卻能達到前述成果。\n\n很奇怪，不是嗎？準確率最低的方法，獲利卻最高，期望值也最高。但這不表示所有的低準確率方法都會有最高的期望值。我只是試著說明期望值的重要性，以及如果系統的平均獲利顯著高於平均虧損，使用準確率低的系統可能有好處。\n\
    \n在發展一種方法時，準確率顯然沒有那麼重要。重要的是發展可能有正期望值的方法。期望值由準確率和報酬組成。\n\n身為風險管理人，你應該發展追求期望值的方法，而不是重視準確率的方法，一旦進入市場，你應該為了期望值而交易，不是準確率。\n\
    \n一切都是為了期望值。別太在意準確率，或者平均獲利相對於平均虧損的報酬。相反的，應該專注於期望值。改善準確率和平均獲利相對於平均虧損報酬，是降低破產風險的重要工具。當你結合準確率和平均獲利相對於平均虧損報酬，你就會得到期望值——這是對抗破產風險的關鍵武器。\n\
    \n發展可能有正期望值的方法，會帶你往前一步，更接近生存。較長期而言，這種交易計畫會產生夠多的獲利交易，不只彌補虧損還有餘，因而產生利潤。在我交易時，我的交易策略給了我正期望值。\n\
    \n期望值是交易生存的必要條件。期望值就是優勢。不以期望值交易，就像拿著刀子參加槍戰，非常不聰明。但是期望值只是我的聖杯的一半而已；另一半是機會。\n\n\
    ## 機會\n\n機會的意思很簡單，就是能應用期望值的次數。你的方法可能具備最高的期望值，但除非你有機會交易，否則沒有報酬可言。請看表4.4所示。\n\n\
    如果單純聚焦在期望值，你會偏好用High octane交易貨幣。它的期望值是100%，顯然優於Swinger和Busy bee。是這樣嗎？雖然它有最高的期望值，卻只能產生1,500美元的利潤，因為一年內出現的交易機會次數很少。因此在這個例子中，High\
    \ octane是效果最差的方法。\n\n在大部分的關鍵領域，Swinger和Busy bee似乎相同。兩者都有相同的準確率（70%）、類似的平均獲利（614美元和604美元），以及類似的期望值（56%和55%）。那麼，你要如何在這兩者之間做選擇？你要著眼於它們呈現的機會。在相同的期間內，Busy\
    \ bee產生20筆交易機會，而Swinger只有10筆。因此Busy bee產生5,450美元的利潤，高於Swinger的2,800美元。Busy bee有機會在多10筆交易中，實現它的56%期望值。因此Busy\
    \ bee優於Swinger。\n\n這裡要傳達的訊息是：你必須考慮所用方法能給的機會次數。即便你發現神秘的聖杯，如果它一年只產生一次交易機會，那也不算好。一年只交易一次是不夠的。集機會和期望值於一身的，才是交易的唯一聖杯。\n\
    \n下列兩點是啟蒙的必修課：\n\n### 表4.4 三種方法的交易機會\n\n| 每筆交易冒險的金額 | 500 | | | |\n| 一年的交易成果 |\
