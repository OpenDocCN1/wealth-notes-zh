    當你賠錢，金額風險會降低。金額風險降低，可望交易的合約數會較少，或者交易規模的部位較小。當你賺錢，金額風險會增加。金額風險提高後，你將能交易更多的合約，或者以更大的部位規模去交易，因而達到最多合約口數。如此，威廉斯固定風險能賺進超過1,300萬美元，顯著高於單一合約的255,100美元淨利。威廉斯固定風險確實允許交易人享有幾何利潤。


    和其他策略一樣，我將最大合約口數限為100口。總結而言，威廉斯固定風險產生高於1,300萬美元的淨利，最大金額和百分率賠償分別為1,363,750美元和17%。每1美元年的賠償痛苦，會產生10美元的利潤，而且這套策略在各筆交易之間的標準差是6.3%。


    雖然成果可觀，你仍然應該考慮這套策略如何處理10,000美元的災難性虧損，如圖8.17所示。


    雖然幾何利潤看起來驚人，但它們並非不必承受風險。交易七口合約時，每口合約發生災難性的10,000美元虧損，會使205,000美元的帳戶餘額產生34%的賠償。這個賠償需要獲利52%才能彌補。依我之見，以交易人受到災難性虧損重創的情況來說，這點相當合理。此外，威廉斯固定風險的一個好處是，交易人只會減少二口合約的水準。交易人可以繼續交易五口合約，而且可以合理期望相當快速地藉交易彌補賠償。這套策略遭到批評的一點，是小額帳戶交易人不易到達展開交易的門檻。


    但是總而言之，威廉斯固定風險不只達成資金管理目標，在賠錢時減少交易，賺錢時增加交易，也能相當從容自在地因應災難性虧損。


