    答案是肯定的，也是否定的。


    答案是否定的，因為當你賠錢，固定單位仍會期望你拿固定金額風險去冒險，你沒有機會在賠償時交易較少的合約，或者拿較少的錢去冒險。在賠錢時，每一筆交易都拿帳戶餘額更高的百分率去冒險，實際上是在賠償時，增加破產風險。


