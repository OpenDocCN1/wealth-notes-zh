    你現在可以決定是否要在交易生涯中往前邁步。對自己誠實的交易人會退出：他們發現自己無法負擔成功所需投入的心力；交易成功的準備工作太難，交易本身不是免費午餐的捷徑。這些是避開輸家遊戲的聰明人：把錢留在銀行；避開市場最大逆境的情緒海嘯折磨；活在相對沒有痛苦的世界中。如果你是其中之一，恭喜你。你對自己的認識，遠比90%的交易人清楚。


    有些讀者會認為我在危言聳聽，目的是把你嚇得不敢進場和我搶糖吃。信不信由你，真的有人這麼認為。我曾接到許多我第一本書的讀者來信，說這類的話。如果你對我也抱持相同的懷疑，沒關係，只是請你把我的書放在觸手可及之處，以備日後參考，因為我後來也收到那些讀者的道歉信。他們終於明白這些通則有道理，只不過是在付出了荷包縮水、自尊受損、心靈受傷，以及人際關係搞砸的慘痛代價之後。


    至於堅忍不拔、品德操守出眾、努力追求成功的人，請準備好研究許多功課、承受許多痛苦。你要接納這些通則，相信它們傳達的訊息。你需要這些通則驗證交易方法，避開破產點。在走過殘酷的交易國度之際，你需要它們做為參考點和指南針，以求生存、實現成功。沒有交大交易成功通則，進場交易保證失敗。


    六大成功交易通則在本章進入尾聲，下一章要介紹一群我稱之為「市場大師」的成功交易人，他們根據多年的經驗和成功，慷慨給予忠告。'
