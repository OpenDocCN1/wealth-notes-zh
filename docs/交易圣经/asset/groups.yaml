    人，我覺得談我真正每天在做的事，會比較容易。因此，如果你不熟悉期貨合約，而且對交易它們不感興趣，那麼請接受我的歉意。但願你能了解，對我來說，提到我每天在交易的東西，會比較容易。謝謝你的理解和耐性。現在，我們回到資金管理。


    妥善的資金管理要達成兩個目標：


    - 生存：避開破產風險

    - 厚利：產生幾何利潤


    如果你能在賠錢的時候少交易（減少部位規模），並在獲利的時候多交易（增加部位規模），妥善的資金管理會讓你達成這些目標。妥善的資金管理是生存和厚利背後的真正秘密，不是靠方法。雖然所用方法的正期望值能提供優勢，但良好的資金管理會將它放大。


    資金管理有兩個學派：


    - 馬丁格爾派（Martingale）

    - 反馬丁格爾派（anti-Martingale）


    ## 馬丁格爾資金管理


    馬丁格爾資金管理是在賠錢時交易更多合約，獲利時交易較少合約。它吻合賭徒在賠錢之後「加倍下注」的本能。馬丁格爾資金管理所根據的理論是：賠錢的交易之後，獲利交易出現的機率較高，因此應該利用這個機會，在賠錢之後交易更多合約。


    這套策略會招致災難。在賠錢之後增加交易的合約口數（也就是增加部位規模），會加快邁向破產的風險。賠錢後獲利的機率並沒有比較高。獲利或賠錢的機率總是 50%。此外，沒人能夠保證交易不會經歷一連串為時最長的虧損，致使在獲利之前到達破產點。


    馬丁格爾資金管理會加快你的破產機率。這套策略最好留給賭徒去玩。


    ## 反馬丁格爾資金管理


    反馬丁格爾派是正確的資金管理策略。反馬丁格爾資金管理能協助你生存，因為它主張賠錢時減少交易，獲利時增加交易。稍後我要討論的資金管理策略都是反馬丁格爾派。


    反馬丁格爾資金管理有兩個關鍵特徵：一是幾何利潤；二是

    不對稱槓桿。反馬丁格爾策略會在一連串的獲利交易期間，使得利潤呈現幾何成長，但在

    一連串賠錢的交易或賠損期間，會因為所謂的不對稱槓桿而受害。


    幾何利潤是指，賺取的利潤遠大於沒有運用資金管理下，從單一合約所能賺到的錢。不對稱槓桿是指，當蒙受損失，彌補損失的能力會下降。也就是說，如果虧損 10%，獲利需要
    10%以上，才能彌補虧損（見圖8.1）。如果帳戶餘額虧損50%，就需要賺100%，才能把虧損補回來。


    你可以利用圖8.1所列的計算公式，算出彌補某一虧損率所需要的獲利率。


    ```

    需要獲利率 = ( 1 / (1 - 虧損率) ) - 1

    ```


    圖 8.1 不對稱公式


    ```

    需要獲利率 = (1 / (1 - 虧損率)) - 1

    = (1 / (1 - 0.30)) - 1

    = (1 / 0.70) - 1

    = 1.4286 - 1

    = 0.4286

    = 0.43

    = 43%

    ```


    圖 8.2 虧損 30% 需要獲利 43% 才能打平


    圖 8.2 顯示虧損 30% 的情況。

    表 8.1 列舉回補若干百分率的虧損，所需的獲利百分率。

    問題並不在於反馬丁格爾策略會受害於不對稱槓桿，因為馬丁格爾策略也會。比較大的問題在於反馬丁格爾策略需要較長的時間，以回補較高百分率的獲利，因為它們必須以較少的合約或較小的部位規模做到這件事。因為反馬丁格爾策略是在賠錢後交易較少合約（部位規模較小）。這和如果仍然交易原來的合約口數（或部位規模）比起來，更為費力且耗時。


    ## 表 8.1 需要彌補虧損的各種獲利率


    | 發生的虧損率 | 需要的獲利率 |

    |---|---|

    | 10% | 11% |

    | 20% | 25% |

    | 30% | 43% |

    | 40% | 67% |

    | 50% | 100% |


    ## 關鍵概念


    第一個根本概念和風險管理有關。即使擁有最穩健和經過驗證的方法，你還是無法預測自己的績效。而且，你無法影響市場如何表現。你可以發揮掌控的一個要素，是投注在任何一筆冒險交易的資本。資金管理會告訴你應該拿多少錢去冒險。


    第二個根本概念和期望績效有關。大體而言，淨值曲線越穩定，選擇和運用資金管理策略時，可以更激進。


    一條穩定的淨值曲線代表你所用的方法，今天和過去一樣好——也就是它相當穩健。如果你滿懷信心，相信你那經過驗證的期望值會持續下去，你應該選擇能夠產生最大幾何利潤的資金管理策略。如果你對所用方法的未來績效抱持審慎態度，你應該選擇注重保本（也就是維持帳戶餘額）的資金管理策略甚於賺取利潤，並將你的破產風險降到最低。如果你只是略有信心，但也略為保持審慎態度，你可以選擇幾何利潤和保本相互平衡的資金管理策略。這個世界上沒有正確或錯誤的資金管理策略：每一種策略都有支持者和批評者。唯一正確的資金管理決策，是確保它是反馬丁格爾策略。本章將提供各種反馬丁格爾策略。


    檢視策略時，務必記得，策略的應用並不是非黑即白。只要運用一點想像力，就能調整策略，讓它更趨完善，或者結合你喜歡的兩種策略。接下來的敘述和應用，絕不是它們唯一的應用方式。只要確保在賠錢時交易得較少，獲利時交易得多，此外都能自行調整。


    此外，即使你可能對於將看到的結果感到興奮，而且開始相信資金管理是賺取厚利的唯一秘密，還是不可以相信它比你所用方法的期望值重要。這聽起來似乎相互牴觸，但即使你擁有世界上


    最佳的資金管理策略，少了產生經過驗證的正期望值，加上穩定的淨值曲線，你會一無所有。


    良好的資金管理能將低期望值的系統，化為深具報酬的體驗，以及將期望值良好的系統，化為令人興奮、改變人生的體驗。但這裡的要點是，正期望值必須先存在。此外，良好的資金管理成果有賴於所用方法的期望值持續下去，或者換句話說，淨值曲線必須保持「穩定」。良好的資金管理策略可能在漫長的賠損期間，保護你的資本，並且協助你避開破產的風險，但當期望值轉為負數，它當然不會賺錢。你的淨值曲線越平穩越好。


    ## 資金管理的重要——威廉斯的故事


    在我討論各種反馬丁格爾資金管理策略之前，我想先和你分享威廉斯所著《短線交易的長線秘密》(Long-term Secrets to Short-term Trading)一書的摘錄內容。大家都知道，威廉斯是與大眾討論資金管理策略的先驅——許多交易人並不清楚這點，也不知悉威廉斯對這個主題的貢獻。所以我認為和你分享該書的摘要有所助益。這本書敘述了威廉斯在資金管理領域中的經驗、發現和旅程。


    威廉斯自 1966 年起從事全時交易，但直到 1980 年代，威廉斯才將資金管理納入他個人的交易，產生極為驚人的影響。資金管理的成效卓著，助他贏得交易冠軍。


    雖然資金管理在今天是常見實務，也有許多人廣泛論述，但那時候，卻只有理查·丹尼斯（Richard Dennis）等專業資金經理人採用。丹尼斯在 1970 年代使用固定波動性資金管理。後來在
    1984 年和 1985 年，將這門學問教給他著名的海龜學生。但在私


    人交易人的領域，它不為人知，不受正視。它不是人們使用的詞彙。它並不存在。直到威廉斯向拉爾夫·文斯（Ralph Vince）請益，才為自己理出頭緒。文斯後來寫了三本談資金管理的書，引起大眾注意這個主題。


    我相信，以下的摘錄不只能管窺資金管理的歷史和發展，也能說明它的力量和重要性。摘錄內容取自威廉斯所寫《短線交易的長線秘密》一書的第13章，章名為「資金管理——進入王國之鑰」（Money
    Management—The Keys to the Kingdom）。


    現在來到本書最重要的一章、我人生中最重要的一章，也是我能傳授給你最寶貴的想法。我這裡能給你的，沒有任何東西比你接下來要學的更寶貴。這話一點都不誇張。


    我接著要解說一套公式，我曾用它將一小筆金額賺取不成比例的獲利，例如 2,000 美元變成超過 40,000 美元、10,000 美元變成 110,000 美元、10,000
    美元成為 1,100,000 美元。這可不是什麼紙上談兵……我們講的是即時賺到真正的錢、獲得真正的利潤……。


    資金管理最讓人驚訝的是，想要洗耳恭聽或者學習正確公式的人，很少很少。


    一般人……認為交易有魔法可用……沒有什麼比這個想法更脫離真實。在這一行要賺到錢，必須取得優勢、持續讓優勢發揮作用，再加上持續以多少資金（資本）去交易（亦即資金管理）的每一筆交易，使優勢持續不斷發揮作用。


    1986 年，我無意間看到一個玩撲克牌 21 點的資金管理公式，而這套公式起初是 1956 年的一篇論文〈資訊率新解讀〉（A New Interpretation
    of Information Rate）中發展出來


    的。這篇論文談的是資訊的流動，現在被商品交易人稱為凱利（Kelly）公式。……我使用凱利公式開始交易商品。這條公式是：


    F=[(R+1)×P-1]／R

    P＝系統獲利的準確率

    R＝獲利交易相對於虧損交易的比率


    我們用準確率為65%，獲利是虧損金額1.3倍的一個系統為例來說明。假設P為0.65，R為1.3，計算如下：


    F=[(1.3+1)×0.65−1]／1.3

    F＝38%


    這個例子中，每一筆交易你都要動用38%的錢；如果你帳戶有100,000美元，以38,000美元除以保證金，可算出合約口數。如果保證金是2,000美元，那麼可以交易19口。

    這套公式給我帶來驚人的交易成果。很短的時間內，我因為非常少的錢 commensurate 成了真實生活中的傳奇人物。我的方法是

    用帳戶中的某一百分率資金，根據凱利公式，除以保證金。結果好到我被踢出一場交易競賽，因為主辦單位無法相信不靠作弊能夠得到那樣的成果。


    容我在這裡插話，交待下一段的背景。1987年，威廉斯贏得羅賓斯世界盃期貨交易冠軍賽（Robbins World Cup Championship of Futures
    Trading®），在12個月內，把1萬美元的帳戶，交易成


    超過110萬美元，這樣的成績，其他交易人難以望其項背。他的獲利率紀錄直到今天仍然沒人能夠打破。現在回到書摘：


    今天，網際網路上有人說我使用兩個帳號，一個是用於獲利的交易，另一個用於賠錢的交易！他們似乎忘了，或者不知道，除了非常不合法的行為，所有交易都必須有帳戶號碼才能進場交易，所以營業員，或者我自己，如何能夠知道哪筆交易應該用獲利的帳戶號碼？

    但是，面對交易史上空前的優異績效，你還能怎麼想。據我所知，不曾有人有這樣的紀錄。令事情「更糟」的是，我不只一次締造這樣的佳績。輸家嘆到，如果不是一時僥倖或運氣，那一定是一路在數字或交易上做假！

    我做的事情具有革命性，和任何好的革命一樣，街頭都會濺血。我因為別人不可信會有那麼好的表現而流血，第一次是全國期貨協會（National Futures Association），其次是商品期貨交易委員會（Commodity
    Futures Trading Commission；CFTC），沒收我的所有帳戶紀錄，檢查是否有詐欺之嫌！

    CFTC鉅細靡遺檢視經紀公司的紀錄，然後取走我的所有紀錄，保留它們超過一年才還我。拿回之後約一年，猜猜又發生什麼事？他們再度把紀錄拿回去！成功真是會害人。

    所有這一切，起因於我的市場績效空前優異。我管理的一個帳戶採用新的資金管理形式，在約十八個月內，從6萬美元激增到接近50萬美元。然後有客戶到法院告我，她的律師說，她應該賺到5,400萬美元，而不是50萬美元。

    ……真是令人嘆為觀止，不是嗎？

    但這把資金管理之劍有雙刃。


    我的優異績效吸引大量資金湧入，要我管理。然後事情開始了：這把劍的另一刃在陽光底下閃閃發亮。擔任商業經理人之際（也就是經營一家資金管理公司）……我的市場系統或方法走下坡，就像一道快速移動的冷鋒，一連串差勁的表現，使得帳戶淨值以同樣驚人的速度下滑。以前我以快速穩當的方式賺錢，現在卻在賠錢，而且同樣快速穩當！

    經紀人和客戶尖叫著……我自己的帳戶從第一年開始時的1萬美元（沒錯，就是1萬美元），後來增加到210萬美元……我和其他每個人一樣遭到重擊，它也陷入漩渦之中，急速下滑到70萬美元。

    大約那個時候，除了我之外，每個人都捨著逃生。拜託，我可是商品交易人。我喜歡雲霄飛車般的行情走勢。除此之外，還有什麼生活方式比這更有趣？我不知道，所以我繼續待在市場。我透過交易，到1987年底之前，讓帳戶淨值回升到110萬美元。

    多麼戲劇性的一年！

    文斯天天盯著我，看我做所有這些……早在我看到之前，他就看出端倪……原來我們用錯了公式！這看起來似乎十分基本……但那個時候，我們置身於資金管理的革命之中，難免當局者迷。就我們所知，我們追蹤和交易的領域，是未曾開發之境。我們見到了一些驚人的交易成果，所以不想偏離我們正在做的任何事情太遠。

    ……我的交易跟著驚人的上下起伏波段而跌跌撞撞，我們繼續尋找改善之道，不管是什麼，只要讓這頭野獸聽話就好……以避免凱利公式內在的爆破現象。

    和文斯談過之後……我曉得導致急遽波動的原因，不是系統


    的準確率，也不是獲利相對於虧損的比率或賠償。運作不順源於虧損最大的交易，並且代表一個極其重要的概念……將我們生吃活吞的是一大筆賠錢的交易。那是我們需要防範的惡魔，必須納入資金管理計畫。


    方法（我解決了這個問題）是先決定任何一筆交易要拿多少錢去冒險……大體而言，你會拿帳戶餘額的10%到15%，除以最大虧損……算出你將交易的合約口數。


    所以我的資金管理公式是：


    （帳戶餘額 × 風險%）／最大虧損

    = 交易的合約口數或股數


    也許有更好和更複雜的方法，但對於我們這些不諳深奧數學的普通交易人，這是我所能知道最好的公式。它的美妙之處在於可以量身訂做，以適合你的風險／報酬性格。如果你膽子小，可以只用銀行帳戶餘額的5%；如果你認為自己是中庸的一般人，可用10%至12%；如果你有勇於以小搏大的膽量，可用15%到18%。


    我已經用這個方法賺了數百萬美元。我所能告訴你的，就是這些——巨富王國的鑰匙已經交給了你。


    前述的歷史是要告訴你，資金管理有多大的成效和有多重要——以及威廉斯如何兼具開創性和革命性！威廉斯把他的資金管理策略稱為「威廉斯固定風險」，稍後我會讓你進一步管窺他使用的策略。


    現在總結一下反馬丁格爾的資金策略（包括威廉斯固定風


    險），你可以在自己的交易上考慮運用。


