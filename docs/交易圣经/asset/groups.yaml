    圖 8.6 合約口數增加的帳戶水準


    與其用一口合約賺10,000美元，現在每一口合約只要賺7,500美元的利潤，就能達到下一個水準。一旦帳戶超越45,000美元，就能交易三口合約。到了60,000美元的帳戶餘額便開始交易四口合約，這三口合約每一口只需賺5,000美元。隨著每一口合約水準增加，你能看到所需的利潤減了多少。每一口合約只需要貢獻較少的利潤，便能增加合約口數。


    這解釋了為何固定資本產生超過1,800萬美元的高幾何利潤。在每一個後續更高的合約水準，每一個別合約需要產生的利潤越少。


    由於固定資本能夠迅速累增合約，我在Forex_Trader的例子中，將最高合約數限制在100口。我這麼做，是因為人很容易被沖昏頭，交易到1,200口合約（$18,000,000
    ／ $15,000），而這是很不切實際的。


    如果你相信你所用的策略有扎實且平穩的帳戶淨值曲線，或者能夠保證未來的期望值，你可以考慮用固定資本去交易，因為它們產生天文數字般的利潤。但是，由於交易時什麼事情都無法保證，所以固定資本可能並不適合你。


    現在來更深入觀察固定資本的表現。固定資本能夠達成適切的資金管理目標──也就是在賠錢時交易較少合約，在獲利時交易較多合約嗎？兩者的答案都為是。


    固定資本是一個簡單的算法，它能告知你，依帳戶餘額和固定資本單位，可以交易多少口合約。當你賠錢，而且帳戶餘額下降到某個水準以下，固定資本會要求你少交易一口，或者如果你
    的帳戶下降到低於二口或更多口合約水準，可能要求你減少更多口合約。當你賺錢，而且你的帳戶餘額不斷增加，你可以使用相同的算法，交易更多合約。因此，固定資本能達成資金管理的兩


    個目標，即生存和創造厚利。它確實能產生非常高的幾何利潤。


    固定資本和固定風險一樣，帳戶金額少的交易人都可以使

    用。它提供簡單的機制，迅速壯大帳戶，而當麻煩來襲，則應該

    務後撤。但是，和固定資本不一樣的是，它並沒有管理個別交易

    的風險，而是將它們一視同仁，接受所有的訊號。


    雖然固定資本的最大好處在於它允許小額帳戶迅速壯大，缺

    點則是以承受更高風險為代價。它通常會產生很高的賠償，就像

    我們的例子顯示的（如圖8.5所示，達22%）。和你賺進的1,800

    萬美元相比，虧損136萬3,750美元，看起來可能沒那麼糟；但

    我敢保證，這種事情發生時，你不會那麼神色自若。


    ## 固定比率


    圖8.7顯示應用固定比率資金管理時，Forex_Trader的成果。

    這一節將檢視固定比率資金管理策略。


    固定比率是萊恩·瓊斯（Ryan Jones）發展出來的，並於他

    所寫的《交易遊戲》（The Trading Game）一書中介紹。固定比率

    法（fixed ratio）要求交易人依照「固定比率」，調整交易合約口

    數。此一「固定比率」稱作德爾他（delta），而且和交易方法的

    賭損有關。你可以使用下列公式，計算可以多交易一口合約的下

    一個帳戶水準：


    ```

    下一個帳戶水準 =

    目前的帳戶水準 +（目前的合約口數 × 德爾他）

    ```


    如何計算德爾他，沒有硬性和快速的準則，但務必知道它是

    固定比率資金管理策略最重要的變數。德爾他的變動會影響固定比率的績效——德爾他越高，報酬和賠償會越保守，而比較激進或較小的德爾它，會產生更多的利潤，但是付出的代價，是承受更高的賠償。德爾他應該和交易方法的單一合約賠償連動。


    如果要保守操作，你應該設法讓德爾他大到單一合約在產生最大賠償的時候，仍然有足夠的錢因應起始保證金，以繼續交易，在這種情況中，德爾他需要以下列公式計算：


    德爾他 = 賠償 + 起始保證金


    下面的例子中，我使用最大賠償為14,000美元，並且假設起始保證金要求是4,000美元。因此算出德爾他是18,000美元。使用18,000美元的德爾他值，根據固定比率資金管理，在你目前交易的每一口合約能夠貢獻18,000美元利潤之前，你不應該增加到


