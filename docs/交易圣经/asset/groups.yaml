    # 選擇的兩難


    到目前為止，固定資本似乎是最佳的資金管理策略，它的 1,800萬美元假設利潤，高於固定比率的 150萬美元淨利。


    但是，固定資本的 1,800萬美元利潤，所冒的風險極高。在檢視固定資本和固定比率蒙受災難性虧損時的後果時，風險尤其明顯。


    這些例子中，我是從 20,000 美元的小額帳戶開始操作，並任意假設固定資本和固定比率的賠償都是 14,000 美元。我定義災難性損失為單一交易的虧損占歷史性賠償的
    70％ 以上——每口合約虧損 10,000 美元。這會使它顯得保守，但是就到目前為止的討論來說，卻相當務實。


