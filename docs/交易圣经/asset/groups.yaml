    # 第8章


    # 第一支柱：資金管理


    我要在這一章檢視實務交易最重要的要素——資金管理。這是交易三大支柱中的第一隻腳，也是對抗破產風險的關鍵武器。由於你的交易目標是生存，你需要了解和執行適當的資金管理。否則，你十之八九是90%輸家俱樂部的永久成員，拿不到加入10%贏家圈的邀請函。


    資金管理是生存和厚利背後的秘密。適當的資金管理，精髓很簡單——當交易賠錢，就應該減低交易暴露程度或者部位規模，而當交易賺錢，就應該增加交易暴露程度或部位規模。


    很快順帶一提：由於我個人交易期貨，所以在本章討論部位規模大小時，我會引用它們。如果你偏愛交易股票、選擇權、CFDs、保證金外匯、外匯、認購權證，或者不管是什麼，那麼請容忍我提到「期貨合約」。如果我提到交易的期貨合約口數增加，我的意思只是表示增加「部位規模」。同樣的，如果我提到減少期貨合約的口數，我是指縮減「部位規模」。身為期貨交易'
