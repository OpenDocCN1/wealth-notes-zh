    信不信由你，這可能是交易成功背後唯一真正的秘密。雖然你可能覺得好像陳腔濫調，但我希望看完本書，你會了解為何它是可長可久的交易生涯背後的核心真理。


    依我之見，《幽靈的禮物》一針見血指出成功的要素。大部份交易人都是糟糕的輸家。他們討厭認賠出場、移動停損點，而且尋找各式各樣的理由，合理化他們的行動，繼續在市場交易。雖然帳戶還有錢，這些可憐的交易人卻忽視賠錢的部位，直到虧損大到不能再置之不理，只好被迫認賠出場，吞下災難性的損失。他們推遲不可避免、勢必發生的事，仍然抱著部位會起死回生
