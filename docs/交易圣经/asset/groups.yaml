    你應該花點時間彙總這張表，將他們的忠告加進你的交易計畫。這是十分寶貴的忠告，只有真正日復一日即時在真正的市場真正打仗的交易人才說的出來。這些忠告來自一堆深沉的體驗、重大的挫折、真實的虧損、難以忍受的痛苦，以及在毫不留情的交易世界中難得一見的勝利。這些忠告，你在當地街角的商店買不到。請花時間將它們寫下來，貼在交易螢幕附近。每天讀，直到他們的話語在你心底生根。


    現在，除了他們個別的忠告，我也希望強調兩個要點。


    第一，身為交易人，他們普遍都不相同，交易不同的市場，使用不同的時間架構、不同的工具，以及不同的技術。我希望這能向你說明，交易有許多不同的方式——但是，請不要相信贏家策略不計其數，因為贏家策略沒那麼多，但數量足夠給你一些選擇的空間；你只需要找到它們。


    第二，他們給你的個別建議，都觸及本書成功交易通則的要素。這些交易通則在所有成功的交易人中十分常見，儘管他們的市場、時間架構、工具和技術不同。這就是成功交易通則的要點所在：儘管交易人接觸市場的方式和原因各異，但交易時都會遵循這些關鍵通則——相對小額交易、專注於風險、簡單的交易、和賠錢的大多數人反向交易、以優勢去交易、接受虧損是交易


