    ```\n"
  mdcn: "\n所以要保持耐心，發展一個簡單、客觀和獨立的方法，以 TEST 程序驗證期望值，將它與反馬丁格爾資金管理策略結合，當所有的條件都過關，破產風險為0%之後，才應該考慮下單交易，而不是不分青紅皂白一頭栽進去！\n\
    \n等到你真的開始交易，請專心當個優秀的輸家和優秀的贏家。迅速認賠，緩緩將獲利落袋。請記住，交易唯一真正的秘密就是：最優秀的輸家是長期的贏家。\n\n祝你輸得漂亮。\n\
    \n布倫特·潘富\n於澳洲雪梨\n\n## 附錄 A\n\n### 破產風險模擬器・觀念\n\n下述的破產風險模擬器產生的破產風險模擬結果，收錄於附錄C，並且彙總於第4章。\n\
    \n在好友兼交易人傑夫・摩根的協助之下，我根據我們對如瑙澤・鮑爾紹拉（Nauzer Balsara）所寫《期貨交易人的資金管理策略》（Money Management\
    \ Strategies for Futures Traders）邏輯的解讀，寫下一個模式如後。\n\n如果我們對鮑爾紹拉的邏輯解讀有任何錯誤，那是我的錯。此外，請注意這個模擬器只是一個假設的模擬器。它只是讓你大概了解，平均獲利大於平均虧損的交易方法有何好處，並不具絕對的確定性。\n\
    \n這個模擬器是以用於Excel的Visual Basic for Applications（VBA）寫成。如果你熟悉VBA和Excel，你可能會想自己寫一個類似的模式。即使你不熟悉程式設計，可能還是看得懂這個模擬器的腳本邏輯（如附錄B），因為我試著用白話英文寫成。\n\
    \n如果你有電腦有安裝Excel，非常歡迎索取我的破產風險模擬器複本。請透過我的網站（www.IndexTrader.com.au）和我聯絡，註明這本書和模擬器，我就會把複本寄給你。\n\
    \n## 模擬器變數\n\n這個模擬器需要你定義所用方法的兩個關鍵特性，即準確率與平均獲利相對於平均虧損的報酬比率。第4章和附錄C中，我使用50%的準確率，並從1:1的報酬比率開始模擬。\n\
    \n雖然這個模擬器會自動計算期望值，但不見得要模擬破產風險。你也需要定義交易帳戶金額。我是輸入100美元。請注意你的帳戶金額無關緊要，因為破產機率受準確率、平均獲利相對於平均虧損報酬比率，以及資金管理策略影響。\n\
    \n這個模擬器必須從兩個資金管理策略中選一個——固定百分率或固定風險。取決於你所選的資金管理策略，你將需要定義每一筆交易你要拿去冒險的帳戶百分率，或者你要將帳戶分成多少個資金單位。第4章和附錄C中，我選擇固定金額風險資金管理策略和20個資金單位，而這表示我每筆交易冒險金額是5美元。任何懂得程式設計的人，都可以改變模擬器，以納入其他的資金管理策略。\n\
    \n這個模擬器也要你定義財務破產，設定帳戶賠償的百分率。第4章和附錄C中，我定義財務破產為帳戶賠償50%。定義了這些變數之後，接著觀察模式的邏輯。\n\n\
    ## 模式邏輯\n\n模擬器的邏輯很簡單。它根據你的資金管理策略和交易方法，去模擬交易。我使用一個亂數產生器，以決定一筆交易是獲利或虧損。如果你的方法有很高的準確率，模擬器產生的獲利交易會多於虧損交易；但是亂數產生器會決定獲利和虧損的順序。在一筆交易之後，模式會建構一條連續的淨值曲線，衡量任何賠償的深度。一旦從新近的淨值高點下滑的賠償到達你定義的賠償破產水準（例如50%），這個模式會停止，並且使用下列公式計算破產風險：\n\
    \n破產風險 = 自上次淨值高點以來的虧損交易筆數 / 自上次淨值高點以來的總交易筆數\n\n請注意，這個模擬器會忽略最近一次淨值高點之前的所有交易。這是因為這個模擬器只對淨值高點和賠償破產水準之間的交易感興趣。這個模擬器想要知道在淨值高點之後，需要多長的時間，才會到達破產賠償水準，因為這將決定破產風險。\n\
    \n為了避免這個模式陷入無限的循環，如果淨值曲線達到2億美元，或者交易筆數達到1萬筆時，若還沒有達到預定的破產賠償水準，模擬器就會停止。模擬器假設，兩種情況之一都足以顯示，交易人已經「你已經躲開財務破產的惡運。\n\
    \n## 模擬器\n\n圖 A.1 顯示，一旦達到 50% 的賠償，模擬器就會停止，並計算出破產風險為 59％，這是非常高的破產風險，你不應該用於交易，因為你一定會破產。\n\
    \n## 自製模擬器\n\n對於勇者交易人，我已經將我的模擬器為 Excel 寫的 VBA 程式設計碼收在附錄 B，讀者不妨參考一下。\n\n![](img/4cb0a78760f87b9407822631d12abbf8_420_0.png)\n\
    \n圖 A.1 破產風險模擬器\n\n## 附錄B\n\n### 破產風險模擬器：程式\n\n下列的Excel用VBA腳本，是附錄A破產風險模擬器的程式設計碼。\n\
    \n如果你不熟悉VBA，不要嘗試製作自己的風險模擬器。如同我在附錄A中所說的，如果你對交易有興趣，歡迎索取我的模擬器複本。如果你想要製作自己的模擬器，以下是寫VBA程式碼之前的準備。\n\
    \n在開始討論之前，提醒你。我不會定義你複製我的模擬器時，必須採取的每一步驟。我會提供足夠的資訊，協助那些熟悉VBA的人製作自己的模擬器，但不適用於對程式設計陌生的人，因為VBA的入門課程超過本書的範疇。\n\
    \n## 自製VBA破產風險模擬器\n\n- 打開Excel工作簿，重新命名第一張工作表為「RiskOfRuin」。\n- 在「RiskOfRuin」試算表，定義以下的範圍：\n\
    \n| 範圍名稱 | 位置 |\n| --- | --- |\n| Accuracy（準確率） | C4 |\n| Payoff（報酬） | C5 |\n\
    | Start_Capital（初始資本） | C9 |\n| FixedPercentage（固定百分率） | C14 |\n| Unit_of_Money（資金單位）\
    \ | C15 |\n| Fixed_Dollar_Risk（固定金額風險） | C16 |\n| Ruin（破產） | C19 |\n| Money_Mgt_Approach（資金管理方法）\
    \ | Y1 |\n| Probability（機率） | G9 |\n\n- 在儲存格「C12」上方放一個列表框，定義它的輸入範圍為「Z1:Z2」，並且定義連結儲存格為「Y1」。\n\
    - 在儲存格「Z1」輸入「Fixed % Risk」。\n- 在儲存格「Z2」輸入「Fixed $$ Risk」。\n- 到「AA1」，並在「AA1:AA10」輸入亂數，以產生第一條假設性的淨值曲線。\n\
    - 製作一張簡單的線圖，定義輸入範圍為在「AA1:AA10」輸入的亂數。並把第一張工作表（「RiskOfRuin」）的圖表物件放在儲存格「A20」上面。調整簡單線圖的大小和格式化，直到你認為合適為止。\n\
    - 儲存工作簿為「0_Risk_of_Ruin_Simulator.xls」。\n- 打開VBA編輯器（Alt F11），並且產生一個新程序，稱作：「Simulate_Risk_of_Ruin」。\n\
    - 貼上\n- 在新的程序中編寫如下的程式碼。\n\n## 破產風險模擬器 VBA 程式碼\n\n編寫如下：\n\n### 定義變數\n\n```\nConst\
    \ NoRecords = 10001\nDim TradeResult (NoRecords) As Long\nDim EquityCurve (NoRecords)\
    \ As Long\nDim Accuracy As Variant\nDim PayOff_Ratio As Variant\nDim Money_Mgt_Approach\
    \ As String\nDim Fixed_Percent_Risked As Variant\nDim Ruin_Point_Drawdown As Variant\n\
    Dim Account_Start As Variant\nDim Account_Balance As Variant\nDim Account_New_High\
    \ As Variant\nDim Account_DrawDown As Variant\nDim Account_DrawDown_Percent As\
    \ Variant\nDim Win_or_Loss As Variant\nDim Probability_Of_Ruin As Variant\nDim\
    \ RowNumber As Variant\nDim Unit_Of_Money As Integer\nDim Fixed_Dollar_Risk As\
    \ Variant\nDim Number_Of_Trades As Long\nDim Number_of_Losses_Before_Ruin As Long\n\
    Dim Number_of_Trades_Since_Account_High As Long\nDim i As Long\nDim j As Long\n\
    Dim x As Long\n```\n\n### 凍結螢幕\n\n```\nApplication.DisplayAlerts = False\nApplication.ScreenUpdating\
    \ = False\n```\n\n### 從試算表載入變數\n\n```\nLoad Accuracy Rate\n  Sheets(\"RiskOfRuin\"\
    ).Select\n  Range(\"Accuracy\").Select\n  Accuracy = Selection\n\nLoad the Average\
    \ Win to Average Loss Payoff Ratio\n  Range(\"Payoff\").Select\n  PayOff_Ratio\
    \ = Selection\n\nLoad Money Management Approach\n  Range(\"Money_Mgt_Approach\"\
    ).Select\n  If ActiveCell = 1 Then\n    Money_Mgt_Approach = \"Fixed Percentage\
    \ Risk Money Mgt\"\n  Else\n    Money_Mgt_Approach = \"Fixed Dollar Risk Money\
    \ Mgt\"\n  End If\n\nLoad Starting Account Size\n  Range(\"Start_Capital\").Select\n\
    \  Account_Start = Selection\n\nLoad Fixed Percentage Rate of account balance\
    \ risked on each trade\n  Range(\"FixedPercentage\").Select\n  Fixed_Percent_Risked\
    \ = Selection\n\nLoad the percentage DrawDown rate we define ruin as\n  Range(\"\
    Ruin\").Select\n  Ruin_Point_Drawdown = Selection\n\nLoad the number of units\
    \ of money we have in our account\n  Range(\"Unit_Of_Money\").Select\n  Unit_Of_Money\
    \ = Selection\n```\n\n### 清空欄列\n\n```\nFor i = 1 To NoRecords\n    TradeResult(i)\
    \ = Empty\n    EquityCurve(i) = 0\nNext i\n```\n\n### 開始模擬破產機率\n\n```\nNumber_Of_Trades\
    \ = 1\nAccount_Balance = Account_Start\nAccount_New_High = Account_Start\nAccount_DrawDown_Percent\
    \ = 0\nNumber_of_Losses_Before_Ruin = 0\nFixed_Dollar_Risk = Account_Start / Unit_Of_Money\n\
    \ni = 1\nj = 1\nx = 0\n\nDo Until Account_DrawDown_Percent >= Ruin_Point_Drawdown\n\
    (i - 1) > 200000000 Or x >= 10000\n    Check For New Equity High and reset number\
    \ of losing tra\n\n    If Account_Balance > Account_New_High Then\n        Account_New_High\
    \ = Account_Balance\n        Number_of_Losses_Before_Ruin = 0\n        Number_of_Trades_Since_Account_High\
    \ = 0\n    End If\n\nGenerate random number to see whether a trade wins or los\n\
    \    Win_or_Loss = Rnd\n\nCheck for a Win\n    If Win_or_Loss >= (1 - Accuracy)\
    \ Then\nWe have a WIN!\n    Calculate the profit\n    If Money_Mgt_Approach =\
    \ \"Fixed Percentage Risk Mon\n        TradeResult(j) = ((Fixed_Percent_Risked\
    \ * Acco\n            * PayOff_Ratio)\n    End If\n\n    If Money_Mgt_Approach\
    \ = \"Fixed Dollar Risk Money Mgt\n        TradeResult(j) = Fixed_Dollar_Risk\
    \ * PayOff_Rati\n    End If\n```\n\n```\nAdd to the equity curve\nIf i = 1 Then\n\
    \    EquityCurve(i) = Account_Start\n    i = i + 1\n    EquityCurve(i) = EquityCurve(i\
    \ - 1) + TradeResult\nElse\n    EquityCurve(i) = EquityCurve(i - 1) + TradeResult\n\
    End If\n\nAdd to our account balance\n    Account_Balance = Account_Balance +\
    \ TradeResult(\nElse\n\nWe have a LOSS!\n    Calculate the loss\n    If Money_Mgt_Approach\
    \ = \"Fixed Percentage Risk Mon\n        TradeResult(j) = -(Fixed_Percent_Risked\
    \ * Acco\n    End If\n\n    If Money_Mgt_Approach = \"Fixed Dollar Risk Money\
    \ Mgt\" Then\n        TradeResult(j) = -Fixed_Dollar_Risk\n    End If\n\n    Add\
    \ to the equity curve\n        If i = 1 Then\n            EquityCurve(i) = Account_Start\n\
    \            i = i + 1\n            EquityCurve(i) = EquityCurve(i - 1) + TradeResult(j)\n\
    \        Else\n            EquityCurve(i) = EquityCurve(i - 1) + TradeResult(j)\n\
    \        End If\n\n    Add to our account balance\n        Account_Balance = Account_Balance\
    \ + TradeResult(j)\n\n    Calculate current drawdown and percentage drawdown\n\
    \        Account_DrawDown = Account_New_High - Account_Balance\n        Account_DrawDown_Percent\
    \ = Account_DrawDown / Account_New_High\n\n        Calculate the number of losses\
    \ before ruin\n            Number_of_Losses_Before_Ruin = Number_of_Losses_Before_Ruin\
    \ + 1\n\nEnd If\nCalculate number of trades\n    Number_Of_Trades = Number_Of_Trades\
    \ + 1\n    Number_of_Trades_Since_Account_High\n    =Number_of_Trades_Since_Account_High+1\n\
    ```\n\nIncrease counters.\nx = x + 1\nj = j + 1\ni = i + 1\nLoop\n\n### 計算破產機率\n\
    \n```\nProbility_Of_Ruin=Number_of_Losses_Before_Ruin/Number_of_Trades_Since_Account_High\n\
    If the Equity Curve is above $200m or we have simulated 10,000 trades then we\
    \ will\n    assume ruin has been avoided.\n    If EquityCurve(i - 1) > 200000000\
    \ Or x >= 10000 Then\n        Probility_Of_Ruin = 0\n    End If\nEnter Probability\
    \ of Ruin in Spreadsheet\n    Sheets(\"RiskOfRuin\").Select\n    Range(\"Probability\"\
    ).Select\n    ActiveCell = Probility_Of_Ruin\n    Selection.Style = \"Percent\"\
    \n```\n\n### 列印淨值曲線\n\n```\nClear Previous Equity Curve\n    Columns(\"AA:AA\"\
    ).Select\n    Selection.Clear\n\nPrint Equity Curve in Spreadsheet - Column AA\n\
    \    i = 1\nDo Until i >= Number_Of_Trades + 1\n    Sheets(1).Cells(i, 27).Value\
    \ = EquityCurve(i)\n    i = i + 1\nLoop\nChange Chart Range\n    Range(\"AA1\"\
    ).Select\n    Selection.End(xlDown).Select\n    RowNumber = ActiveCell.Row\n \
    \   ActiveSheet.ChartObjects(\"Chart 1\").Activate\n    ActiveChart.PlotArea.Select\n\
    ```\n"
