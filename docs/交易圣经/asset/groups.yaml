    - 特定交易風格的期望值、機會和驗證

    - 特定交易風格是否讓你放心並適合你的個性（如果運氣好的話）


    不當你是看星象、使用指標、確認圖形型態，還是遵循義大利數學家的理論而尋找交易訊號，只要你使用的方法擁有可能為正的獲利期望值，你有什麼感覺都無關緊要。獲利優先於感覺。交易涉及的是現實，不是細膩的感覺。下一章將討論如何選擇合適的交易市場。


    ## 第6章


    ## 第四通則：選擇交易市場


    這一章著眼於成功交易的第四項通則——如何選擇適合交易的市場。我將檢視如何評估市場是否適合交易，協助你做選擇。我也會解釋指數和貨幣市場為何是最好的市場之一。這是我喜歡交易的市場，理由稍後詳述。


    我認為，適合交易的市場應該具備表6.1列出的大部分特質。


    如果市場有這些特質，就值得考慮。任何市場需要通過檢驗的第一關，就是操作風險管理特質，這點你應該不意外。如同我說過的，生存是交易的第一目標，所以我要先探討操作風險管理的特徵。


    ## 表6.1 優異的交易特質


    | 良好的操作風險管理特質 | 良好的交易特質 |

    |---|---|

    | 價格及成交量透明 | 波動性夠大 |

    | 流動性高 | 容易研究 |

    | 二十四小時交易 | 簡單 |

    | 零交易對手風險 | 易於放空 |

    | 誠實而高效率的市場 | 專業化 |

    | 交易成本低 | 機會夠多 |

    |  | 成長 |

    |  | 槓桿 |


    ## 良好的操作風險管理特質


    ### 價格及成交量透明


    價格及成交量透明是指市場能向所有參與者顯示所有的價格與成交量活動。關於市場，幾個必問的重要問題包括：你能看到所有正在進行的交易活動，並且收到所有的價格和成交量資訊嗎？你能依賴這些資訊，在掌握充分資訊的情況下，做出交易決策嗎？操作風險：你能看到每件事嗎？


    最適交易證券，是只能在一個市場交易的證券。單一市場可以確保你在任何時刻收到由供給和需求決定的最佳價格。你應該確定你要交易的證券是否只有一個市場。務必避開有競爭市場在交易的證券，因為其他的交易人可以大量執行買賣，並且隱藏重要的市場成交量資訊。


    ### 流動性高


    一旦你確認你想要交易的證券沒有競爭市場，接著就要確定


    證券是否有足夠的流動性。操作風險：你能否迅速軋平部位？是否有足夠的流動性讓你這麼做？


    雖然進入市場通常很容易，要當個最優秀的輸家，卻意味著你需要能在你想要的時候軋平部位，而不是在成交量增加得夠多時，才讓你得以脫身出場。為了確保這一點，你需要交易流動性高的證券。


    ### 二十四小時交易


    優異的交易市場會一天二十四個小時都在交易。正確做到這一點（整整二十四個小時持續不斷交易）的唯一市場，是透過銀行間大宗交易店頭（over-the-counter；OTC）市場的外匯市場。OTC市場永遠不關閉，因為全球各地的銀行總是需要報價。但是芝加哥商業交易所（Chicago
    Mercantile Exchange；CME）的電子期貨合約一天關閉一個小時。它的Globex平臺一天交易二十三個小時。CME的貨幣期貨於下午4:00收盤，一個小時後的美國芝加哥時間下午5:00重新開盤。


    操作風險：你能在一切狀況走樣時，一夜之間軋平部位嗎？


    一天交易二十四個小時的操作優點，是停損點一天二十四個小時都能發揮作用。這是操作風險管理的重大關卡。


    ### 零交易對手風險


    交易人面對的另一個風險，是交易對手能不能履行交易。如果你收不到錢，就算執行賺錢的交易也沒用。操作風險：你能不能收到錢？


    由於以新約取代舊約，結算所可以保證所有的期貨合約都能履行。你建立一個部位之後，就不必擔心交易對手風險。但是，


    其他證券的信用就沒有那麼好。舉例來說，當你買了一張股票，沒有人能向你保證那家公司不會宣布進入清算程序。當你交易保證金外匯（margin FX）、差價合約（CFDs），或者差價賭注，沒有人能保證供應商本身不會陷入財務困難。交易這些證券，交易人確實會面對交易對手風險，因此交易時必須抵量相對於潛在獲利的風險。


    ### 誠實而高效率的市場


    若是要面對有問題的操作實務和無效率，交易要存活是難上加難。操作風險：遊戲規則是否定義明確？


    期貨交易市場是誠實而高效率的市場。因為各交易所所有政府在管理。政府要求交易所和它的服務供應商（期貨經紀商和顧問）遵循用來保護市場參與者（你和我）的法令規定。


    由於交易所和它的參與者都以最高的品格水準營運，也不能改變規則以投自己所好，所以你可以滿懷信心地進場交易。股票市場卻不是這樣。2008年全球金融危機期間，世界各地許多股票交易所禁止放空，如果那個時候你是股票交易人的話，你會失去一半的交易機會！依我之見，股票市場可能不像許多人（尤其是交易所本身）要我們相信的那樣，交易效率很高。


    ### 交易成本低


    最後一個操作風險是買賣的成本，也就是經紀費用和滑價。操作風險：交易成本具有競爭力嗎？


    交易人交易是為了期望值，而滑價和經紀費用卻會減低期望值。交易成本越低，期望值越高，生存機會越大。所以你應該尋找能將執行成本壓到最低的市場。


    我們來比較一口期貨合約和一個股票組合的經紀成本。我使用澳大利亞SPI指數期貨合約為例說明。你可以使用你交易的任何一種指數合約，結果還是會相同。SPI的點值是25澳元；每波動1點，SPI的價值就變動25澳元。指數價值如果是6,250，一口SPI合約的面值就是15萬6250澳元（$25
    × 6,250）。買賣一口SPI合約，你不必支付超過50澳元。買價值相當於15萬6250澳元的股票組合，我假設積極型股票交易人能夠拿到低至0.15%、很具競爭力的經紀費率。因此，股票交易人要買賣價值15萬6,250澳元的股票，必須支付468.75澳元（2
    × 0.0015 × $156,250）的經紀費用。如果兩位交易人每個星期執行一筆交易，SPI交易人一年將支付2,600澳元的經紀費用，而股票交易人將支付24,375澳元！你一定知道我喜歡哪一張經紀費用帳單。相對於實體股票，交易指數期貨的成本顯然很有競爭力。


    總而言之，你交易的任何證券應該要符合絕大部分的操作風險管理指標。


    我們再來看看，一個良好的市場具備哪些交易特質。


    ## 良好的交易特質


    ### 波動性夠大


    如果價格沒有波動，交易人就賺不到錢。交易特質：是否有足夠的價格波動讓你交易？


    在我看來，世界上波動最大的兩個市場是指數和貨幣市場。


    ### 容易研究


    沒有研究和調查就去交易，有如賭博。交易特質：是否有充分的歷史資料可以研究？


    最好利用盡可能最多的資料樣本，研究和回溯測試一種方法的期望值。更好的情況是，擁有夠大的資料樣本，讓你能一切為二做回測。你因此能夠利用前半部的資料發展方法，一旦滿足，則在另一半的樣本外資料上跑，看看它在前向測試（forward
    testing）中的表現如何。這樣驗證系統期望值，效果和遵循我的TEST程序一樣好。


    ### 簡單


    極端來說，和長線順勢交易人一次關注20到30個市場的組合比起來，專注於單一市場的組合會比較容易。交易特質：市場易於監控嗎？


    你要確定從交易市場蒐集、監控每日資料的容易程度如何。今天，由於網際網路和許多電子資料供應商的存在，這件事易如反掌。只要按個鍵，不到幾分鐘或更少的時間，你就能從一百多個市場下載資料！


    ### 易於放空


    交易人能在他們選擇的時點買進和賣出。交易特質：是否可以無條件放空？


    在受管理的交易所交易的期貨和選擇權，以及保證金外匯，沒有禁止交易人放空的條件（除非特定的交易所設有價格上下限，而且市場的確在盤中達到漲停板或跌停板）。


    遺憾的是，股票則非如此，正如我們在 2008 年全球金融危機股票市場崩盤時所看到的。當時有許多交易所禁止放空股票，尤其是金融股。


    ### 專業化


    對小散戶來說，專業化是值得的。聚焦於較少的類似市場，而不是交易包含各種不同市場的較大組合，在財務上比較容易執行。交易特質：是否有可能專精於某個市場，並且運用你的交易知識？


    監控和交易指數、貨幣、利率、能源、金屬、穀物或肉類等單一市場區隔的組合，絕對能促進專業化，又能善用知識。


    ### 機會夠多


    單單擁有正期望值的方法是不夠的。除非能找到交易機會，否則無法壯大交易帳戶。


    交易特質：市場是否提供夠多的交易機會？


    同時展現良好的流動性和價格波動性的市場，會提供許多交易機會。但是切記，要考慮交易風格。此外，和短線波段交易比起來，長線順勢交易的交易機會較少。


    ### 成長


    市場要夠大，交易人才能隨心所欲進出。此外，市場規模要夠大，才能在交易帳戶成長之際，擴大部位規模。交易特質：市場的日成交量是否夠大，容允提高部位規模？


    這是市場擁有良好流動性之所以重要的一個原因。


    ### 槓桿


    槓桿（leverage）能讓交易人進入他們通常沒有能力進入的市場。交易特質：市場能否以面值的很小比率交易？


    期貨、選擇權、認購權證（warrants）、外匯保證金、差價合約，以及價差交易（spread betting），都允許交易人以各自合約面值的很小百分比進入市場。


    ## 小結


    但願你現在已經知道，選擇正確的市場去交易有多重要。我認為你應該選擇具備大部分這些特質的市場，因為交易的生存可能有賴於此。我個人交易指數和貨幣期貨，因為我相信它們滿足所有的特質，而能成為積極型私人交易人最適合交易的市場。


    下一章要來探討交易成功的下一個必要通則：鞏固交易的三大支柱。


    ## 第7章


    ## 第五通則：鞏固三大支柱


    本章探討交易成功第五通則，它也是最大的通則，即交易的三大支柱。這三大支柱包括：


    - 資金管理

    - 交易方法

    - 交易心理


    這三個支柱是實務交易的基本組成部分。如果你目標是成為成功的交易人，而成功的衡量標準是銀行存款，你就必須理解交易三大支柱，並為三大支柱發展、執行計畫。


    正如前文所述，我認為資金管理是最重要的元素，其次是交易方法，接下來是交易心理。雖然許多人辯稱心理面是最重要的交易元素，我卻一直認為它不比資金管理或方法重要。我相信贏家和輸家的差別在於輸家的無知、輕信和懶惰，而不在於兩耳之


    間的六吋之地。


    你可能還記得圖2.2的交易程序，顯示三大支柱是邁向交易成功最大的一步。因此，我將分章探討各支柱。但在本章中，我會概要說明這三個層面。


    ## 資金管理


    資金管理排在第一位。它是交易人生存、繁榮的秘密。生存是避免破產，繁榮會讓你臉上綻現笑容。我將在第8章討論以下七項資金管理策略：


    - 固定風險

    - 固定資本

    - 固定比率

    - 固定單位

    - 威廉斯固定風險

    - 固定百分率

    - 固定波動性


    ## 交易方法


    交易方法是每天的戰鬥指令，是交易如何獲得期望值的詳細說明書。交易方法包含兩個部分：


    - 交易格局是找出將來可能出現支撐或阻力的地方 ——也就是，到那個時候你應該設法進場，以及決定


    是否該買或賣。


    交易計畫應該告訴你如何善用你的格局。關於如何進場、下停損點和出場，它應該有清楚而毫 close 粗的指令。


    交易方法應該簡單而且合乎邏輯。這樣你就有很好的機會拿穩健的方法去交易，而且即時產生的成果，將和經過驗證的 TEST 成果相當。


    第9章會探討交易方法的架構。了解架構元素，有助於你打造自身的交易方法，或者接受或修正別人的交易方法。


    ## 交易心理


    即使有最好的資金管理策略和交易方法，仍然需要一套計畫以因應情緒。心理面有如黏合劑，維繫著三大支柱。希望、貪婪、恐懼和痛苦三不五時會使你分心，偏離成功之路。市場的最大逆境經常折磨情緒，挑戰你繼續走在正軌上的決心。


    第10章將觀察心理層面，探討能做些什麼事，以控制那些情緒。你會明白，實務交易很像烹飪——有食譜可以參考。遵循交易計畫，交易就能支持財務目標，就像做菜能讓你得到溫飽。偏離食譜，你就會偏離目標！


    訂好涵蓋三大支柱的計畫，才可以開始考慮進場交易；在那之前，想都別想！


    ## 第8章


    ## 第一支柱：資金管理


    我要在這一章檢視實務交易最重要的要素——資金管理。這是交易三大支柱中的第一隻腳，也是對抗破產風險的關鍵武器。由於你的交易目標是生存，你需要了解和執行適當的資金管理。否則，你十之八九是90%輸家俱樂部的永久成員，拿不到加入10%贏家圈的邀請函。


    資金管理是生存和厚利背後的秘密。適當的資金管理，精髓很簡單——當交易賠錢，就應該減低交易暴露程度或者部位規模，而當交易賺錢，就應該增加交易暴露程度或部位規模。


    很快順帶一提：由於我個人交易期貨，所以在本章討論部位規模大小時，我會引用它們。如果你偏愛交易股票、選擇權、CFDs、保證金外匯、外匯、認購權證，或者不管是什麼，那麼請容忍我提到「期貨合約」。如果我提到交易的期貨合約口數增加，我的意思只是表示增加「部位規模」。同樣的，如果我提到減少期貨合約的口數，我是指縮減「部位規模」。身為期貨交易

    '
  mdcn: '

    不能給予身心所需要的正面回饋。就像生活中的任何事情，當你不斷收到正面回饋，要繼續在選定的路上走下去會比較容易。當你經常收到的回饋是負面的，你會比較難以繼續交易，你的手指頭想要按下交易鍵，但你的心卻在尖叫：「不，不要再來了，不要再來一次賠錢交易！」


    經常虧損會導致長期賠償。同樣的，當你不斷賠償，情緒上便難以繼續交易下去。


    此外，長線順勢交易會讓人感到身心交瘁。這是因為長線順勢交易人禁不起錯過一個訊號。這是因為他們不知道下一個大獲利交易會從哪裡來，或者何時來。這使得長線順勢交易令人精疲力盡，除非有人能夠為你下單，否則你幾乎不可能休假。


    ## 短線波段交易


    表5.3彙總了短線波段交易的特徵。


    表5.3 短線波段交易的關鍵特徵


    | 面向 | 關鍵量數 | 影響 |  |

    |---|---|---|--- |

    | 資金管理 | 投資組合<br>賠償<br>財務承諾 | 小<br>小<br>短<br>低 | 1+ 個市場<br><br>1 × 起始保證金 |

    | 交易方法 | 時間架構<br>準確率<br>平均獲利 : 平均虧損<br>期望值<br>每個市場的機會數<br>經紀費用與滑價 | 短<br>高<br>低<br>好<br>高<br>高
    | 1-5 日<br>50%+<br>1.0+ |

    | 交易心理 | 情緒障礙 | 低 | 經常獲利<br>短期賠償<br>容易休息 |


    ## 資金管理


    組合 短線波段交易在單一市場組合行得通。對於想要只交易單一市場的小散戶來說，這是好事。一般而言，你可以交易一個以上的市場；但是，短線波段交易不需要多個市場才能賺錢。


    賠償 由於短線波段交易能在單一市場運作，所以賠償是可以管理的。交易一個市場仍然會讓人覺得不安，但至少它不會因為多個市場而放大。


    此外，賠償的期間通常比較短。短線波段交易通常會產生比較平滑的淨值曲線，因為每一年的成果並不取決於一些巨大的獲利交易。淨值曲線平滑，意味著賠償發生時，時間會相當快速。


    財務承諾 短線波段交易的財務承諾很低。交易單一市場需要的錢，低於交易多個市場。


    ## 交易方法


    時間架構 短線波段交易人通常一到五天就出場。他們只想捕捉市場中短暫的「波段」，而不想跟著新趨勢走到日落。


    準確率 短線波段交易的準確率通常高於50%。它需要比順勢交易更高的準確率，因為它的平均獲利相對於平均虧損報酬比率通常比較低。


    平均獲利相對於平均虧損的報酬比率 由於短線波段交易人在市場中的時間相當短，他們的平均獲利相對於平均虧損的報酬比率偏低——通常介於1.0到2.0之間。


    期望值 如果準確率和報酬比率的組合足夠，短線波段交易的期望值不錯。短線波段交易法的準確率如果有55%，而且平均獲利相對於平均虧損的報酬比率是1.3，交易人可以期望每一筆


    交易每一元的冒險金額可以賺進26.5分（〔55 % × 1.3〕−〔45 % × 1.0〕）。一般來說，改善準確率或報酬比率，可以改善期望值。


    ## 機會


    短線波段交易人的機會很好，因為市場有85%的時間在箱型區間內起落。短線交易人會發現許多可以交易的支撐和阻力水準，而這提供許多交易機會。


    ## 交易成本——經紀費用與滑價


    短線波段交易的經紀費用與滑價等交易成本偏高，而且在驗證方法的期望值時，必須納入考慮。交易頻率高，因為有許多交易機會，而每筆交易的獲利金額相當低。這使得經紀費用升高。此外，由於平均獲利和長線順勢交易比較相對較低，經紀費用和滑價所占的成本百分率偏高。這是當日沖銷交易人很難賺到錢的原因。他們交易的市場波動幅度較小，還要負擔交易成本，相較之下，長線順勢交易人可以利用一整個月的價格走勢，去支付經紀費用和滑價。


    ## 交易心理


    ### 情緒障礙


    短線波段交易和較長期的系統比起來，在情緒上比較容易交易。這是因為經常的獲利交易提供經常的正面回饋，讓你覺得自己做得正確。經常的獲利交易強化了良好的交易行為，短線波段交易人繼續接收訊號進場交易因此更為容易。這使得賠損容易管理，為期也相當短暫。交易人為繼續遵循交易計畫，而必須跨越的情緒障礙也減到最低。此外，短線波段交易人能在交易中途休息，因為錯過下一個到下十個訊號，並不會威脅到一整年的交易績效。


    ## 長線與短線的比較


    檢視長線順勢交易和短線波段交易的關鍵特徵，可以發現短線波段的交易風格對小散戶較為理想。在組合、賠償、財務承諾、情緒障礙等財務和情緒特徵方面，短線波段交易的比長線順勢交易小且容易因應。


    不同的交易風格，期望值可以相同，所以這不應該是決定性因素。但是，如果你偏愛用短線波段交易的方式操作單一市場，則應該將你會接收到的機會數納入考慮。


    我比較了兩個極端的交易風格，讓你管窺兩種方法的錯綜複雜之處。交易人可以用所有的時間架構，順著趨勢操作，不管是當天、短線或中線。檢視了兩個極端之後，再來看看兩者之間的其他策略是值得的。表5.4比較了各種交易風格。


    表5.4的目的是給你一個粗略的概念，讓你知道如果採用某種交易風格，可能會體驗到什麼。你應該花點時間看它，決定你的「個性」適合哪種交易風格。我個人是交易短線和中線波段，以及趨勢持續型態。


    可惜，如同前述，最大逆境準則意味著交易人不能只是選擇適合自己個性的交易風格。影響你最後所採交易風格的因素是期望值、機會和驗證，不是你的個性；換句話說，是那些能讓你真正賺到錢的因素才算數。


    ## 小結


    根據第三項成功交易通則，選擇合適的交易風格時，需要考慮下列因素：


