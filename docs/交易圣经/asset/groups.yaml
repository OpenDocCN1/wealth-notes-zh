    然而，為便於解釋，我們必須固定兩個變數（固定百分率和波動性），以觀察合約口數如何隨著帳戶餘額成長而增加。


    固定波動性和固定資本、固定單位、威廉斯固定風險、固定百分率一樣，下一個合約水準的每一口額外合約需要貢獻的利潤減少，允許合約以穩定的步調累增。


    我們要指出，如果你的交易方法使用10日ATR區間為停損點，那麼固定百分率和固定波動性會產生相同的資金管理成果。


    圖8.21彙總了Forex_Trader使用固定波動性的績效。從30,000美元的帳戶操作起，限制帳戶餘額的2%於市場的10日ATR，無條件捨去取整數，交易上限為100口合約，如此一來，Forex_Trader的利潤超過840萬美元，而承受的最高金額和百分率賠償分別只有1,350,750美元和21%。固定波動性每1美元的賠償痛苦，對應6美元的利潤，而且交易之間的標準差是4.8%。


