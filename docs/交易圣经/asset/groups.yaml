    ## 致命的危險


    表9.5彙總了運用常見趨勢和折返工具的方法。


    我們來看系統一。它是往趨勢的方向交易，而趨勢是在以RSI衡量的折返之後，以簡單移動平均數確認。移動平均數本身通常相當溫和，因為它只有一個變數限制它的自由度。但是，當它和有三個變數的RSI結合，整個方法就成了包含四個變數的交易策略。即使像這樣的簡單策略，也有極大的彈性和迴旋空間，允許交易人有極大影響力，操弄變數數值，以配適歷史資料。有這麼多變數，好看的淨值曲線將來未必會維持穩定。


    如果你覺得這個簡單的方法還不夠糟糕，那麼我們來看看第三個系統。在某個層次上，我讚賞這種方法。它設計保守，在尋找格局之前執行雙重確認。如果以ADX指標衡量的趨勢被視為強勁，那麼這套策略只會往移動平均數衡量的趨勢方向去交易。我喜歡這種保守態度。它接著會很有耐性地等候費波納奇（Fibonacci）折返百分率和低RSI讀數所確認的折返。需要兩個獨立折返工具取得一致看法的這種保守態度，我還是很欣賞。所以從保守的角度來說，我喜歡第三個系統的雙重確認方式。但是，我的喜歡僅止於此。


    我不喜歡的是，兩種工具結合後，交易策略包含十一個變數。


    ## 表9.5 各種方法及其變數彙總


    | 系統 | 趨勢與折返 | 變數 | 迴旋空間 |

    | --- | --- | --- | --- |

    | 系統一 | 移動平均數 | 1 | |

    |  | RSI | 3 | |

    |  | 合計 | 4 | 極高 |

    | 系統二 | MACD | 3 | |

    |  | 隨機 | 4 | |

    |  | 合計 | 7 | 極高 |

    | 系統三 | 移動平均數 | 1 | |

    |  | ADX | 3 | |

    |  | 費波納奇比率 | 4 | |

    |  | RSI | 3 | |

    |  | 合計 | 11. | 極高 |


    數！在我看來，這是高得非常危險的水準。這裡面存在太大的空間，欺騙自己相信你已經發展出贏家優勢。


    有個交易學派認為，只要策略在廣泛範圍的變數值下行得通，使用變數是可以的。我不同意這種看法，除非只有幾個變數，例如一個。


    只有單一變數時，如果它在廣泛範圍的數值下行得通，我們很容易看出它是否有價值。但是，超過一個變數時，就沒那麼容易，尤其是對包含十一個變數的策略來說！在你固定十個變數，並在廣泛範圍內更動第十一個變數的值，這件事只能告訴你，有個變數似乎有價值，或者支持其他十個值固定的變數。但是，一旦你改變其他十個變數之中的一個值，你第一次測試所做的工作就失效，因為之前固定的十個變數不再固定。我不是數學家，但是當一條公式裡面有十一個自變數，而且一個交易方法其實就是一條公式，我可以想像你必須測試將近無限個可能變數組合，對十一個變數做無限次徹底的壓力測試，將它們各自獨立取自由度（變數數值的範圍），在另外十個變數值保持固定和變動下做組合。單單用想的，我的頭就痛！


    我認為，要對彼此有關聯的十一個自變數做壓力測試，根本是不可能的事。移動的部分太多，你根本不可能有把握已經取得正確的變數值。


    如果你不相信我說的話，請看看你身邊的人就知道。幾乎每一套畫圖套裝軟體都有這些流行的趨勢和折返工具——所以每個人都採納它們。它們出現在許多書籍、DVD和研討會中。可是，超過90%的積極型交易人都賠錢，而且大部分交易人的淨值曲線在開始採用新的聖杯交易系統後不久就下挫。為什麼？因為他們使用太多依賴變數的指標。他們透過操弄個別的變數值，找到正確的值，成功地將曲線配適到歷史資料上，產生好看的歷史性淨值曲線。但這是不穩定的淨值曲線，在開始交易後不久立即下滑。


    這些常用工具結合成一套交易策略後，變得比它們的個別部分更為主觀、更有彈性、更不穩定，也更不可靠。這是大多數交易計畫失敗的原因，因為它們不是百分之百客觀，沒有獨立於交易人之外。


    ## 主觀工具陷阱處處


    可憐的順勢交易人，儘管知道要順勢交易，知道趨勢是他們的朋友，卻因為確認趨勢和折返的工具不良，未能順勢交易成功。難怪他們會失敗。這就是典型的垃圾進，垃圾出。毀掉交易人的是主觀工具。


    這些工具以它們的靈活彈性為訴求，引誘不知情的交易人上當。它們支持交易人的意見，不會威脅交易人脆弱的自我。它們讓人覺得親切而樂於合作。它們像是溫暖而安全的盟友。工具和交易人一搭一唱，描繪明亮的未來：主觀的工具有不費力的彈性，加上無所不知的聰明交易人。


    交易人也是凡人，容易被交易螢幕的明亮光線誘惑。無知的交易人甘心當個快樂的傻瓜，深深信任那些工具。我在交易生涯的頭十五年，也是快樂和無知的傻瓜，以主觀的方法交易，因為相同的誘惑而受害。


    ## 客觀工具不受交易人左右


    你最好是選擇內部具有某種保護機制的趨勢和折返量數，防止人為操縱。擁有內建保護的最佳量數，沒有參數或可調整的變數。最佳的量數是客觀而獨立的。最佳的量數是固定的。任何有變數的指標都是負債。可調整的參數會產生可調整的結果。可調整的結果在做交易決策上不可靠。


    簡中觀念是選擇客觀和「固定」的量數，以確定趨勢方向和折返水準。它們在使用時，沒有任何個人解讀的空間。十二歲小孩解讀量數應該和你一樣，否則就應該捨棄它。這裡面沒有迴旋空間。它必須是固定的。就這麼簡單。不是黑，就是白，沒有灰色地帶。一旦你找到這種量數，把它們組合起來成為策略，並且應用簡單和客觀的交易計畫。也就是，當你經由客觀趨勢和客觀折返工具，發現客觀格局，接著就應用客觀的進場、停損和出場標準。這套策略可能會賺錢，也可能不會。再下來是透過
    TEST 程序，驗證期望值。如果它賺錢，你就上路，不然就重回畫圖桌。


    再下來的挑戰是：找到交易時使用的客觀量數。這些量數雖然不完美，卻不會一直改變意見；不能調整；不能操弄：可以很容易地應用和解讀，而且可以應用到簡單和客觀的交易計畫；可望產生正期望值，而且最後能夠透過
    TEST 程序加以驗證。


    你需要使用「免交易人」的工具，也就是交易人對於趨勢或折返的解讀不具影響力，然後工具不是行得通，就是行不通。它們需要獨立自主，不需要透過你操弄變數以協助。遺憾的是，在我看來，大部分指標都不值一顧。你透過變數對它們的影響太大。你需要創造一套「免交易人區」策略，防止交易人影響淨值曲線。


    當然，發展策略時是百分之百主觀；這是不得不為。少了主觀的自由裁量和創造性構想，你將一無所有。你是創造者，所以你會使用百分之百的創意和主觀想法，打造交易方法。但是，一旦你打造出自己的策略，它必須不受交易人影響。它必須包含客觀的工具。你不能影響它的內部運作，你的方法中不能有任何軟性變數，你不能在其中操弄某個變數。


    我們的順勢交易之旅走到現在，討論了順勢交易的兩大價值動因——找到趨勢，等候折返水準。雖然它們可能已經含括順勢交易人 80％的工作，但順勢交易還有步驟要走。


    在此再次回顧一下，執行順勢交易是包含兩個步驟的程序。第一，找到交易格局的位置，而這又包含三個部分：


    - 確認趨勢

    - 等候折返水準

    - 等候折返型態


    第二，執行交易計畫，包含五個部分：


    - 等候確認進場訊號

    - 進入市場

    - 下停損點

    - 管理交易

    - 獲利了結（理想上）


    我們接著討論等候折返型態。


    ## 等候折返型態


    極少順勢交易人真的會等折返型態出現，並且確認折返水準。大部分交易人視折返水準（不管它可能是什麼）為折返型態。基本上，折返形態是指市場在拉回或者跌深反彈時，走勢停頓，價格盤整，之後趨勢才繼續進行。


    折返形態代表價格集中在一起的區域，而且包括傳統的走勢圖形態，例如旗形、長三角形和三角形等。順勢交易人要解決的問題，就是以主觀的方式確認特定的走勢圖型態。


    圖9.13是黃金價格的走勢圖。


    走勢圖的解讀並不容易。如果交易人在他們的交易格局內使用傳統的折返型態，那麼他們必須使用自己訓練有素的眼睛，確認密集的折返型態。這是主觀的任務，做起來並不容易。我在圖9.14中盡我所能找出我所能看到的傳統密集走勢圖型態。在完成時，我想到如圖9.15所示的三角形謎題。


    你以前可能見過這道謎題。現在，花點時間計算圖9.15有多少個三角形，把答案寫下來。不要作弊。不用過度分析，以最快的速度數算。


