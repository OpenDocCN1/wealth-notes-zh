    # 固定波動性


    圖8.21為應用固定波動性資金管理策略時，Forex_Trader的績效。在討論它的含義之前，先探討固定波動性資金管理。


    固定波動性也可以稱做固定百分率波動性，因為它是限制市場的波動性於帳戶餘額的固定百分率。


    計算交易合約口數的公式如下：


    合約口數 = (固定百分率 × 帳戶餘額) / 市場波動性


    市場波動性指的某特定期間內市場的波動。市場波動性的量數，可能是10日、20日或30日的每日波動區間平均值。你可以只用一週或一個月的時間架構去衡量波動性。最好是調整波動性量數，與交易時間架構一致。短線交易人可以使用日量數，而長線順勢交易人（擁有大額帳戶）可以使用月量數。我們討論的時間架構和波動性量數是每天。


    要衡量市場的波動性，或者高點到低點之間的行進距離，你可以使用實際的日區間（daily range）或者它的真實區間（true range）。真實區間會將前一天的收盤價和當天實際高價或低價之'
