    # 隱藏的原理


    我們都知道，80%到90%的新手交易人都會失敗。


    為什麼會是這樣？不是因為缺乏教育。投資和交易的競技場上，研究會的生意蒸蒸日上。在了解如何更有效地學習方面，更是已有長足的進展。儘管如此，交易人和投資人的成功率，和我在1970年代初開始交易時沒有兩樣。


    部分原因出在交易本身的特質。這是一場機率遊戲，任何單一交易，新手交易人賺錢的機會和經驗豐富的專業人士一樣。新手交易人往往在一連串的連續獲利之後，誤將自己的'
  - '[PAGE 331]


    好運當作技術超群——市場很快就會導正他們的誤解，這一來，交易新手就會失去所有賺到的錢，甚至賠掉更多。


    另一部分的原因，在於新手看待交易獲得成功的方式。他們抱持錯誤觀念，以為他們需要的只是「超級交易策略」，而展開徒勞無功的聖杯搜尋。他們認為，那種方法能靠小額資本，產生無止盡的財富，並有相對極少的虧損。


    身經百戰的專業人士都知道，交易方法其實只是成功方程式的一部分：


    # 贏家心理 X 有效的風險管理 X 書面交易準則（擁有優勢）


    布倫特在本書中談到這些傳統的原理。


    但是我認為，有個原理經常遭人忽視，而且很少人談到。這個原理源於1934年的飛行安全領域。那一年冬天，美國陸軍航空兵（U.S. Army Air Corps）飛行技巧最好的飛行員似乎都死於墜機。事後來看，很清楚可以知道墜機的主要原因是訓練計畫。訓練計畫包括：


    +   - 準學員坐上飛機，由教練執行一連串的翻滾和旋轉動作。如果學員沒有嚇得臉色發白，就能進地面訓練學校；

    - 在地面訓練學校，教練在黑板上教導學員如何飛行，也讓他們親身體験；

    - 幾個星期後，學員逐步掌握控制器。


    訓練結果如何？有些學校的死亡率接近25%。


    今天航空業驚人的安全記錄，要歸功於發明林克模擬'
  - '[PAGE 332]


    器（Link Simulator）的愛德華．林克（Edward Link）。這個模擬器允許駕駛員犯錯，在沒有實際風險下，從錯誤中學習。簡而言之，林克模擬器允許駕駛員深度練習。


    「深度練習」（Deep Practice）的概念，是丹尼爾．柯伊爾（Daniel Coyle）在《天才密碼》（The Talent Code）一書中提出的。在我深入探討這種練習之前，且暫停片刻，注意交易人所受的教育和1934年駕駛員接受的教育，兩者間的相似處。


    身為交易人，我們通常靠參加二到四天的研討會與閱讀，而學得技能。在那之後，我們的學習是反覆試驗摸索，拿的是我們寶貴的資本去冒險。1934年駕駛員的反覆試驗摸索學習也類似，唯一的差別，在於他們是用自己的生命冒險，而我們是拿自己的財務資本去冒險——有時是我們的財務生命。


    ![](img/4cb0a78760f87b9407822631d12abbf8_332_0.png)


    圖12.1 深度練習


    資料來源：Daniel Coyle, The Talent Code (Bantam Dell, Random Hose 2009)'
  - '[PAGE 333]


    圖12.1解釋了深度練習的概念。我認為，這個概念將掀起交易教育的革命。我們會見到研討會和指導課程分成知識內容的傳授，之後是深度練習時間。


    「深度練習」的「去感覺」一項，表示柯伊爾相信學習需要動用知性和感性。在任何練習期間，首先把目標設定在舒適圈外不遠處。要知道這些目標是什麼，首先需要設定脈絡（組塊）：找出學習的核心宗旨，將它們化整為零，確定各個組成部分。


    目標一旦設定，就可以做模擬交易練習，在對結果有期望下採取行動。練習結束時，比較行動的成果和想要的結果，也就是注意兩者的差距。接著，我們檢討反省，決定要用什麼行動以拉近兩者的差距，並採取行動。我們重複這個循環，直到填平差距為止。


    這個「嘗試錯誤學習」急遽縮減學習時間。我認為，柯伊爾的模式如果執行得當，可以提升交易的成功結果。


