    順帶一提，這種多樣化也能證明，市場交易成功方法不只一種。你只需要找到自己的立基，找到對你有意義的一種技術或幾種技術的組合，在你手中有用，能給你優勢，讓你用經過驗證的0%風險去交易。


    我個人曾和這些市場大師促膝長談，知道他們各個都能將自己的成功通則融會貫通，舉重若輕，並指出重點。他們不像我這麼幸運，可以用一整本書和你分享想法；但是，他們會和你分享他們覺得最重要的建議。每一位市場大師分享忠告之前，我會簡短介紹他們，以及他們在技術面分析世界中的定位。在他們的忠告之後，我會留一個聯絡網址供你參考。你如果想多聽一點，可以直接洽詢他們。你永遠不知道誰的智慧能助你徹悟。


