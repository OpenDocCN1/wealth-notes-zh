    決策方程式的一邊，即風險。它並沒有提供另一半的任何回饋資訊，即報酬。這件事很重要，務請記住。選擇合適的策略，除了滿足個人風險忍受度，也必須衡量可能的報酬。


    觀察賠償百分率的另一種替代方法，是衡量實際的賠償金額相對於產生的報酬金額。這是一個簡單的風險相對於報酬問題：哪一項策略會在承受每一塊錢的賠償或風險時，產生最佳的價值或報酬？


    要回答這個問題，請觀察淨利相對於賠償金額的比率，或者我所說的價值報酬（value payoff），計算公式如下：


    價值報酬 = 淨利 / 金額賠償


    在這裡，選擇策略的著眼點在於，發生賠償、必然承受痛苦時，要能產生最高的報酬金額。也就是在最大的賠償期間，每少掉一塊錢，交易貢獻了多少金額？與其只顧風險面，你應該睜開一隻眼睛看報酬面。表8.12顯示，每投入一元的風險金額，何種策略提供最高的報酬金額。


    如表中所示，在最糟糕的賠償期間，每少掉一元風險金額，固定風險能提供最高的報酬金額。但是，由於固定風險的利潤最低，我想不會有許多交易人考慮使用它。如果你也忽視單一合約的成果，那麼固定單位在下列的標準之下，會是理想的資金管理策略：在最糟的賠償期間，每發生1元賠償的痛苦，對應了16元的獲利。使用這個標準的唯一缺點，是固定單位也產生最高的標準差，使得它的成果波動性最大（更別提在賠償期間，破產風險比較高）。


