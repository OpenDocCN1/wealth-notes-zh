    再順帶一提，我曾和在電話上與一位交易人閒聊，對方問我關於海龜系統的意見。我給了他相同的看法，也就是它並不適合小散戶。結果呢，最近他又打電話給我，說他對自己的交易很感沮喪。他對我之前給他的忠告置之不理，週末時參加了桑德斯的研討會，後來不可避免的事情終於發生了；長線順勢交易人常見的賠償幾乎掏空他那小小的帳戶。問題不是出在系統，因為他說它最近的交易填補了賠償，但是要拿資金去挾注許多未軋平的部位，加上不可避免的龐大賠償，這遠超出財務承諾的負擔。但願這給你上了一課。


    現在我們就來更深入觀察長線順勢交易和短線波段交易。


    ### 長線順勢交易


    如你所知，長線順勢交易應該是只有負擔得起以高額帳戶交易的人才適合考慮。表5.2顯示長線順勢交易的特徵，以及它們對長線順勢交易的影響。表中並依交易生存所需的三個關鍵（資金管理、交易方法和交易心理）分類特徵。


