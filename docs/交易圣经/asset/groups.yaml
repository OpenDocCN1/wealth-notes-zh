    ## 小結


    當人們開始體驗交易，他們通常幾乎沒有什麼結構和確定性可言。在這個過程中，他們同時傷害到自己的口袋和心靈。如果他們運氣不錯，他們會開始走向簡單、結構和確定性。他們會開始聚焦於程序取向。建立起這個結構的黏合劑，是發現正期望值和正確驗證的重要性。如果你能做到這一點，你的想法和行為就會開始像專業CTA。


    等到本書進入尾聲，在你學會成功交易通則後，不管你偏好自由裁量型交易，還是機械型交易，但願你不管在想法和行為上，都像個專業交易人。


    ## 第2章


    ## 交易程序


    我會在這一章介紹成功交易通則。接下來幾章，我會進一步探討各項通則。


    圖2.1指出一般交易人面臨的一大堆艱難選擇。


    有人對從何處開始交易感到困惑嗎？交易人必須做的決定似乎很多。我認為，與其描述所有技術，不如引導你思考成為成功交易人的有關程序。這套程序依循成功交易通則。


    ## 交易程序


    成功交易通則會勾勒出交易程序的輪廓。成功交易有六項不可或缺的通則，我們很快地談一下各項通則。


    - ● 觀念的準備 了解交易人可以從市場和交易期待什麼。交易人也要知道，在他們開始交易之前，能夠做些什麼事，

    以確保他們不會太過頭。準備工作做得好，是交易的堅實基礎。


    - · 思考的啟蒙 了解成功的要件。交易人應該明白要將心力投入何處。啟蒙階段會引導你走上正確的路，成為交易市場的生存者。


    - · 發展交易風格 你在選擇交易方法時需要知道的事。


    - · 選擇交易市場 了解該如何選擇最佳的交易市場，十分重要。交易已經夠難了，不要涉足容易受操縱的小型市場。


    - · 鞏固三大支柱 三大支柱是交易成功的三個有形要素，即資金管理、交易方法和交易心理。


    - · 交易的實踐 將以上各項融會貫通。


