    同時展現良好的流動性和價格波動性的市場，會提供許多交易機會。但是切記，要考慮交易風格。此外，和短線波段交易比起來，長線順勢交易的交易機會較少。


    # 成長


    市場要夠大，交易人才能隨心所欲進出。此外，市場規模要夠大，才能在交易帳戶成長之際，擴大部位規模。交易特質：市場的日成交量是否夠大，容允提高部位規模？


    這是市場擁有良好流動性之所以重要的一個原因。'
