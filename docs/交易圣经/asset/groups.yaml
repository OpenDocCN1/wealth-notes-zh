    圖 8.26 中，我建構了一條利潤通路，追蹤 40 筆交易回顧期（lookback period）的最低帳戶淨值曲線。40筆交易帳戶淨值曲線的最低點，可以做為有效的系統停損點。它會緊貼你所用的方法，在它持續寫下帳戶淨值新高之際，給它很大的損失空間。


