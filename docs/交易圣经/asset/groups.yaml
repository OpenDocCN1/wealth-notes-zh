    # 圖4.4 破產風險隨資金單位的增加而下降


    如圖所示，雖然鮑伯和莎莉都交易相同的貨幣系統，破產機率卻大不相同。鮑伯有30%的機率失去風險資本，而莎莉只有9%的機率出局。莎莉的風險顯然低於鮑伯。


