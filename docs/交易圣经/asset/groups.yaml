    ## 執行交易計畫


    ## 等候確認進場訊號


    根據我的經驗，不管是順勢交易人，還是短線波段交易人，大多數交易人都未能在進場交易之前，等候確認訊號（confirming signal）。他們一旦發現格局，就會立即進場。舉例來說，許多人會很單純地在折返50%的水準買進。聰明的交易人會依賴市場先證明他們的格局正確，才進場往格局的走向執行交易。如果他們需要50%折返發生，他們會先等候，然後如果市場接下來能夠開始上揚，就會設法作多，可能是在突破前一個、二個或三個長條高點時買進。少了這道確認程序，順勢交易人的工作當然會變得更難。


    ## 進入市場


    這是每個順勢交易人，不管成功與否，都能走的一步。


    ## 下停損點


    今天有那麼多交易書籍和研討會，我相信大部分交易人都知道要用停損點去交易。如果他們還沒採用，引入停損點絕對可以改善他們的績效。


    ## 管理交易


    我認為，管理交易涉及使用追蹤停損點，這關乎調整停損點和在趨勢持續進行時鎖住利潤。沒有人喜歡把還沒到手的利潤吐回去。


    ## 獲利了結


    顯然沒有很多交易人把這件事做得夠好而獲利。


    ## 克服主觀


    你應該看得出來，順勢交易雖然只是個簡單的程序，卻受許多問題所苦。決定趨勢、尋找折返水準，還有依賴有變數的指標或主觀的圖形去解讀，以確認折返形態。他們都受害於主觀的意見。等候確認進場訊號需要經驗，而進場、下停損點、管理交易以及獲利了結，都需要紀律和一致。


    遺憾的是，順勢交易計畫的三大價值動因——確定趨勢、尋找折返水準，以及確認折返型態，在整個交易程序中最為主觀。所以，那麼多順勢交易人失敗，並不足為奇！我們要回答的是這個問題：怎麼辦？在一個理想的世界，順勢交易者只用最佳的趨勢確認和折返量數工具。可惜，世界並不完美，市場的最大困境就是確據。


    就我所知，這個世界上沒有完美的趨勢工具、完美的折返量數或完美的折返型態，每次都挖到黃金。交易隱含機率，沒有十拿九穩的事，所以尋找完美的趨勢和折返工具是沒有意義的：因為它們根本不存在。但是我相信，和依賴變數、指標與傳統的走勢圖型態等主觀工具比起來，交易人在確定趨勢、尋找折返水準，以及確認折返型態方面，可以做得更好。


    答案就是確認並矯正傳統順勢交易的重大缺點。如同我說過的，這三大價值動因共有的關鍵缺點在於「主觀」。它們都依賴主觀意見指定變數值，或解讀走勢圖型態。我相信，如果能以客觀取代主觀，順勢交易人的績效就會大幅改善。切記，客觀並不表示完美。交易上沒有完美。


    交易人在趨勢、折返水準和折返型態的解讀上，需要獨立且百分之百客觀的建議。優良的趨勢和折返工具不需要靠交易人的投入才看起來行得通。優良的趨勢和折返水準獨立自主，以本身的價值接受評量，行得通或行不通，一翻兩瞪眼。優良的趨勢和折返工具具獨立性且有用，可以做為交易依據。


    ## 獨立


    這是妨礙大多數交易方法的關鍵問題。它們太過依賴交易人使它們看起來行得通，如圖9.18所示。


    圖9.18表示實務交易的三大支柱（資金管理、交易方法和交易心理），其中的方法面需要多個變數投入，可能是需要交易人設定一個主觀的變數值，也可能是對折返型態進行主觀的解讀。這些工具根本成了交易人的分身。諷刺的是，當交易人尋求這些主觀的工具協助時，他們只不過是在鏡子裡面看到自己。交易人需要的是獨立客觀的工具。


    只有在交易人能夠不影響工具的解讀時，才能夠依賴工具的效能。如果這些工具結合客觀的交易計畫，能夠創造正期望值的歷史淨值曲線，才能可能成為贏家的方法。這時他們就能以TEST程序驗證策略。


    交易人需要發展出一套獨立於他們之外的方法。當然，他們打造的方法絕對百分之百主觀，但一旦發展出來，就必須能夠獨立自主，而且獨立於交易人之外，不需要透過具可塑性的變數，進行任何操弄。交易人需要獨立的策略，如圖9.19所示。


    不用丟太多球到空中，交易已經夠難的了。我寧可在交易時


    ![](img/4cb0a78760f87b9407822631d12abbf8_264_0.png)


    ## 圖 9.18 依賴的策略不可靠


    只應付三顆球，如圖 9.19 所示，在執行我的客觀和獨立方法時，繼續保持專注和一致，應用明智的資金管理。我討厭像圖 9.18 那樣，丟三顆以上的球到空中，因為我必須擔心我給的變數值是否正確。我也一直憂慮我所用的方法是否只代表歷史資料配適曲線成功，而不是有效的策略。我會不斷伸手找交易心理藥丸，躺在交易教練沙發上的時間，可能多於坐在交易桌前。不管什麼時候，我只要接三顆球，而不是十顆！


    我就是這樣的人，在本書中，我只能根據自己的經驗和你分享我的想法。


    但願這樣的討論能讓你洞徹，為何大多數方法未能在即時交易中表現良好。我也想讓你知道，儘管我對主觀工具的容忍度為零，但並不是所有主觀工具都不好。


    ## 主觀客觀都用 TEST 把關


    我覺得我的意見很極端。大體來說，我確實將交易世界視為非黑即白。我很單純地相信交易是數字遊戲：了解數字、定義客觀優勢、小額交易、以一致的方式交易、保持耐性交易，就能從風險資本賺得不錯的報酬。未能了解數字，交易的破產風險會高於0%；交易會有負期望值；帳戶會過度交易；交易時會沒耐性；交易時經常處於緊張和猶疑不決；交易時不遵循交易計畫。交易會失敗。


    但那是我的個人觀點。我也不留給主觀工具和以指標為基礎的方法任何餘地。但那是我的看法，而你也許不一樣；你可能偏愛指標或其他的主觀工具。若是如此，我想讓你知道，並不是所有那樣的方法都會賠錢，因為我確實知道有些成功的指標基礎方法。但我要告訴你的是，它們也都是簡單的方法，而且最成功的只使用只有一個變數的單一指標。它就是那麼簡單。這套策略在範圍廣泛的變數值都能賺錢。所以請不要對所有的指標都失去信心，因為有一些是好的，而且確實擁有優勢。但是它們的效果有賴於簡單的策略。


    如果你你的交易方法偏向主觀工具或分析，也沒關係。我只是認為，你會發現它們較難建立可交易的優勢。但你當然可以放手打造任何方法，只是在用它交易之前，還是需要透過TEST程序，去驗證方法的期望值。這是最後一道門、最後一關、你所用方法是否有效的最終仲裁者。


    此外，選擇主觀工具的一個方法，是找出交易人已經成功使用多年的主觀工具。一種工具能長期幫交易人即時從市場獲利，它就能永存不朽。


    另一種方法可能是為自由裁量型方法尋找軟體解決方案，軟體程式將獨立提供分析和尋找交易格局。你甚至可以納入以指標為基礎的方法。但是這裡的訣竅，是不去動變數的出廠設定值。你將必須視它們為固定的，因為當你操弄變數值，方法就不再獨立於你，也不再保持客觀。從那時起，它就變得太過主觀、太有彈性、太過不穩定，也太過不可靠，以至於不能依賴。這個的觀念是接受軟體或一組指標的原貌，你要和它們保持距離。


    舉例來說，對艾略特波浪有興趣的交易人，可以考慮Advanced GET之類的程式，它會根據它對市場的艾略特波浪的解讀，獨立找到交易格局。你不要改變程式中的任何變數。你必須讓它自己去算波浪，然後提出它自己的分析。接著你需要看看交易格局是否能用TEST程序去驗證，以確定那種方法在你手中是否行得通。Advanced
    GET會隨著市場的變動而改變它計算的波浪數和交易格局，這點是挫折感所在，但至少是一致而獨立。這正是關鍵。它對市場狀況的解讀，前後一致。雖然這種方法相當主觀，交付的卻是客觀結果。只要你會去干預任何變數設定，它就會獨立且一致。你只要讓程式在電腦上跑，讓它做自己的事就行。你必須讓它獨立於你之外。請記住，不要插手操弄。我不知道它找到的交易格局是否足以獲利。你需要確定自己和交易夥伴都獨立使用TEST程序。但是，我喜歡它的地方，在於它是湯姆·約瑟夫（Tom
    Joseph）在1981和1986年之間寫的老程式，之後才在1986年公諸於世。它已經存在很久的時間。如果你能讓變數保持出廠設定值，並且成功使用TEST程序去驗證交易訊號，那麼你可能給自己找到了一個經過驗證且客觀的（由於這個軟體確實獨立於你之外做分析）主觀交易方法（艾略特波浪是主觀的）。以上提供你參考及思索。


    提醒你，如果你幸運找到一種正期望值方法，裡面包含主觀的工具，而且能用TEST程序驗證，你必須了解，和簡單而絕對客觀獨立的方法比起來，主觀方法的穩定度較低。這是因為簡單方法的活動組件較少，出錯的機會也較低。


    雖然有掃興之虞，我還是想分享柯林斯的《贏得市場》一書中，提及查理·賴特（Charlie Wright）的觀察：


    我們的研究發現一事足堪玩味，那就是指標到頭來一無是處。


    這個觀察來自經營一家成功基金管理企業的賴特。他是涉足市場三十餘年的機械型交易人。他透過在市場交易、研究、發展和基金管理的那些年頭，相信指標一點都不重要。這雖然只是賴特的個人意見，但他有資格說這些話，因為他經驗豐富而且交易非常成功。此外，這只是概述，而任何原則都有例外。


    ## 以不變應市場萬變


    有支強大的交易思想學派，相信交易方法需要保持彈性，以因應不斷變動的市場狀況。他們表示，市場會變動，所以交易人所用的方法也應該跟著變動，以因應新狀況。


    他們說得沒錯。市場確實會在你相信自己理出頭緒之後不斷且經常變動。市場不斷在多頭走勢和空頭走勢期間，從箱型區間起伏不定，走向擴張和展現趨勢。所以市場表面上確實在變動。而且持平而論，如果市場一直在變動，交易人怎麼能用一種方法應對所有市場狀況？我聽過這種說法，但我不同意。


    我相信，一個好方法面對所有市場狀況都行得通。我不是說一種方法應該能在每一年的每個市場中都賺到錢。這幾乎不可能。但我確實相信，設計良好的簡單方法，應該能在長期內，在出現各種市場狀況（多頭走勢、空頭走勢、價格密集的箱型區間交易，或是一清二楚的順勢交易）的許多市場交易中獲得利潤。


    誰對誰錯？都對，也都錯。經驗非常豐富的交易人能夠辨識訊號，知道何時將策略從空頭市場模式切換到多頭市場模式，從箱型區間擺盪交易，切換到清楚的折返和突破順勢交易。但他們經驗非常豐富，而且不是每次都對。他們是交易界的精英，非常接近交易光譜的登峰造極之境，一般交易人根本無法望其項背。他們幾乎是神隱、神話般的交易人。他們是傳奇。


    較平凡的交易人則喜歡一以貫之，不管面對什麼情況，都用簡單而客觀的穩健方法去交易，並且依賴資金管理、一致性、紀律和毅力而成功。例如我不久之後就要討論的，使用遠近馳名的海龜交易策略的那些人。至於一般交易人，我建議他們採用一種不錯的方法，在所有的市場狀況中交易，直到他們發展出必要的專門知識技能，而這是很難取得的。


    ## 方法可以互補加乘


    你可以考慮另一種方法，就是發展兩個獨立且互補的順勢與逆勢（短線波段）交易方法。


    理想情況下，它們都百分之百客觀且獨立，而且在許多市場裡，不管遇到什麼市場狀況都行得通。它們可以獲利，並且能夠獨立自主運作。但是當你結合它們的淨值曲線，你會看到曲線呈現較平滑的帳戶餘額走勢。當順勢交易方法頗難行，逆勢方法仍可望享有利潤，反之亦然。


    你的目標是發展、結合相輔相成且獨立的方法。一旦做到這一點，你也應該橫跨時間架構，進一步分散策略。你應該發展較短期或較長期的順勢與逆勢交易方法。我就是這麼做。我橫跨多個時間架構，在全球指數與貨幣市場，交易一個機械型順勢與逆勢方法的組合。


    談過我對順勢交易方法為何大多失敗的看法後，現在要討論贏家方法的基本屬性。本章的目標之一就是提供框架，讓你得以在裡面發展你自己的交易方法。傳統的順勢與折返工具為何對大部分交易人無所助益，希望你已經了解其中究竟。現在就來看看優良策略的構成元素。


    ## 贏家方法的基本屬性


    優良的策略具備兩個簡單要件：一是協助交易人避開致命的錯誤；二是顧及成功交易的基本策略要素。


    表9.6概括了大部分交易人犯下的致命錯誤。


    優良的方法能確保交易人在交易規模上維持保守態度，任何一筆交易，都只拿帳戶的一小部分去冒險。優良的方法會很快就軋平賠錢的交易。它通常會使用相當小的起始停損點，在部位移動有利於交易人的方向時，跟著調整並跟緊市場。一般來說，良好的方法會遲遲軋平賺錢的交易，允許市場告訴你所用的方法何時獲利了結。一般來說，優良的方法不會運用獲利目標。優良的方法通常會橫跨一個市場組合運作。優良的方法通常是客觀的，允許任何人用它去交易，並且享有相同的成果。一般而言，優良的方法極少運用包含主觀變數的任何工具。


    根據我的經驗，贏家方法有些通性。說通性是因為總有例外。有些成功的交易人，很快就獲利了結。還有些交易人，使用的方法只在兩三個市場行得通。也有些交易人，使用的方法用到主觀的工具。更有些交易人，確實運用獲利目標。但是，如同我說過的，他們是例外。


    成功的方法也顧及成功交易通則的基本策略要素，如圖9.20所示。


    贏家方法不是隨機而生。它們有結構，是一套有邏輯的信念，關乎市場如何運作。折返順勢交易相信市場在往趨勢行進的過程中，會穿越平均反轉值而上下波動。雖然市場並非時時都有趨勢，但一旦展現趨勢，它們會往前衝刺和停頓；它們會擴張和


    ## 表9.6 大部分交易人犯下的致命錯誤


    - 過度自信，每筆交易拿太多錢去冒險

    - 不良的輸家，不肯迅速認賠

    - 不使用停損點

    - 不尊重停損點

    - 不使用小停損點

    - 不調整停損點

    - 不良的贏家太快獲利了結

    - 太專注於一兩個市場

    - 太過相信

    - 太過主觀

    - 使用太多依賴變數的落後指標

    - 沒有驗證構想


    經由折返而收縮，之後再度擴張，繼續往趨勢的方向行進。折返順勢交易相信，交易人會有許多機會補捉到折返拉回之後，趨勢持續進行的走勢。


    再舉個例子，艾略特波浪相信市場趨勢通常包含五波上升，折返通常包含三波拉回。你也能在許多市場看到許多例子。


    贏家方法通常都很簡單。它們不複雜。簡單就可以少出錯。簡單能確保贏家方法維持穩健。複雜的策略有太多活動組件、在空中太多球，所以邏輯上而言，它們「掉球」的機會比較高，導致所用方法失去它的優勢。策略一複雜，可能出錯的東西就變得比較多。


    備受敬重的市場分析師與交易人狄馬克，曾經和市場怪傑鍾斯共事，現在則輔佐 160 億美元投資基金 SAC 資本的柯恩。他說了聽過的最佳名言之一。他在柯林斯所寫《贏得市場》一書中說：


    ……在十七名程式設計師和四、五年的測試之後，基本的四、五個系統運作得最好……


    說到你能從我寫的這本書得到什麼東西，要是你沒有把狄馬克觀察到的事情複製下來，貼到交易螢幕上方牆壁非常顯眼的位置，那麼你算是不合格的讀者。這是狄馬克給交易人的極其寶貴貢獻，因為他分享了一個洞見，讓我們知道一個重大研究發展專案的結果。鍾斯在四到五年的時間中，請得起十七名程式設計師，進行密集的市場與策略研究，這樣的交易人並不多見。單單雇用一位程式設計師就很昂貴，更別提在四到五年的期間內，雇用十七位。這是非常昂貴的研究。


    我們應該謹記狄馬克的觀察。在投入那麼多時間和心力之後，狄馬克的基本或簡單的四或五個系統（策略）運作得最好。


    - 你可以不相信我，但請相信狄馬克，請不要逆勢而為，想要推倒重來。簡單的東西就是行得通。


    順帶一提，就在昨天晚上，我和朋友談到安排雙方家人來個披薩聚會。而且如同以往，我們的話題聊到市場。朋友擁有並經營一家成功的絕對報酬基金管理事業。他管理的資金高達數億美元。我們提到另一位交易人的觀察。那是針對市場所做的簡單觀察。雖然簡單，卻十分有力。我們兩人都說，簡單是最少人知道的交易秘密之一。簡單就是行得通。


    贏家方法既簡單且客觀，不需要主觀的解讀。十名交易人遵循相同的簡單方法，應該會找到相同的格局。客觀的方法才能夠衡量，才會有簡單的交易計畫以決定方法的歷史期望值、衡量所有賺賠交易。贏家方法具正期望值，在多個市場都行得通。


    這些是贏家方法的關鍵屬性。它們簡單且客觀，期望值可以衡量。我相信這是你需要的：可靠、獨立且客觀的證據，證明它行得通！有了這些，你就往成功的交易人又接近一步。力求方法簡單，再怎麼強調也不為過。


    ## 簡單就是美


    除了發展穩健的獲利方法，策略力求簡單還有許多好處。


    ## 啟蒙


    發展、接納簡單的交易方法，表示你已經接受關於交易的一個重要事實。這意味著你已經達到「禪」的心境，了解這個世界上沒有所謂的聖杯交易解決方案。這意味著你不再覺得需要繼續永無止盡地搜尋下一個最好的交易構想。接納簡單，能讓你開竅和帶來心靈上的平靜。


    這意味著你現在了解、接受沒人能斷言市場的未來走向。你已經了解，你在交易上能夠控制的，就只是採用健全的交易邏輯和良好的資金管理策略。現在你了解，不必對市場未來走向瞭若指掌，也能在交易上賺錢。這些是你接納簡單而有的體悟。


    ## 容易


    簡單的方法沒有複雜的東西。沒有指標需要解讀，不需要畫角度，不必計算波浪數，不需要找週期，也不必計算折返百分率。統統不必。簡單，做起來就容易。


    ## 客觀


    簡單會使方法變得客觀。簡單意味著沒有東西可以操弄、修補，或者動手腳。簡單意味著格局的有無直截了當，沒有什麼好解讀的。


    ## 穩健


    穩健是指所用方法能夠長期即時獲利。你所用的方法持續增加交易帳戶的時間越長，就越穩健。採用指標等主觀變數的方法不穩健。簡單的方法通常排除使用變數，這有助於它們維持穩健。穩健意味著出錯較少。活動組件越少，方法越穩健。


    ## 情緒穩定


    和主觀的自由裁量型交易比起來，簡單的方法在情緒上比較容易交易。自由裁量型交易遠具彈性，且遠為依賴交易人做所有的決策。不管是確認格局、決定是否進行交易，還是決定在哪裡下最好的停損點、獲利了結，所有的決策都取決於交易人。採用簡單方法的交易人，在市場開盤之前，就知道格局是否存在。如果有交易格局，就知道要在哪裡進場和下停損點。他們的交易簡單到就像把點連成圖。他們知道在哪裡進場、在哪裡下停損點，以及在哪裡獲利了結。他們不需要做決策。由於不必持續做決策，簡單而百分之百客觀的交易方法，執行起來較能心平氣和。


    ## 時間管理


    交易人用簡單的方法交易，時間管理也能做得更好。由於必須做的事很少，交易人有較多自由時間可以運用。他們不必成為市場的奴隸，持續搜尋格局、決定是否交易。簡單比較快。


    ## 簡單的矛盾


    我也應該告訴你，發展簡單的交易方法有個強烈的矛盾點。沒錯，依我的經驗，策略越簡單，便越穩健，而越穩健，越好。矛盾的是，一般來說，方法越簡單，淨值曲線越是起伏不定。淨值曲線越是起伏不定，則越難交易！


    這是因為越簡單的策略，越有可能是真正的策略。簡單的策略不會運用依賴變數的指標，藉以取巧跳過大賠的交易，或者避開持續不利的交易區間。交易人很容易選擇可用的指標，引進一個過濾器，以避開若干市場狀況。交易人很容易發展複雜的指標基礎策略，產生看起來平滑的淨值曲線。


    因此矛盾由此而生。簡單通常伴隨著淨值曲線起伏不定，使得交易極具挑戰性，因為非常真實且十分正常的賠償期間會發生。所以說，雖然簡單最好，通常卻最難交易！


    講完不要做哪些事情，以及為何你應該採用百分之百客觀且獨立的工具，以打造簡單的方法之後，我想舉個例子說明我的論點才合乎公允。我應該讓你看一個簡單、百分之百客觀且獨立的交易方法，也就是贏家策略。


    ## 贏家方法實例：海龜交易策略


