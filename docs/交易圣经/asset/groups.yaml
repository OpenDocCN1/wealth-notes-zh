    # 布萊恩·沙德


    布萊恩·沙德（Brian Schad）曾經是美國海豹部隊（SEAL）隊員，也是成功的交易人。布萊恩和大部分人一樣，不是一開始就是交易人。在踏進市場之前十二年，布萊恩為美國政府工作，擔任美國海豹部隊的戴盎潛水員。他的一些經驗令人不寒而慄。他在修補美國戰艦愛荷華號（USS
    Iowa）時，因為被困在海下而缺氧。這次的瀕死經驗，使得布萊恩脊椎有氮氣泡沫、手臂癱瘓，在高壓氧艙待了八個小時。誰說交易風險高！


    你能讓一個人離開海軍，但是沒辦法抽離他的海軍經驗。在和布萊恩討論這段的編寫時，他的談話經常出現「明白」、「請查收」、「收到」等字眼，我就像在和美國海軍打交道！我必須說，布萊恩是回覆電子郵件和問題速度最快的交易人之一。我想，這反映出他在海軍服役，學會在高度壓力下嚴守紀律，以高度效率應付急迫的任務。布萊恩當然能拿海軍生活類比交易，因為兩者都會隨機經歷緊急狀況，需要明快做出決定。


    布萊恩1992年開始對市場產生興趣，以交易利潤補貼海軍'
  - '[PAGE 386]


    的收入。他主要是自由裁量型交易人，使用傳統的技術面分析，在股票選擇權尋找交易格局。


    今天我們都很容易透過網際網路，輕易取得資料，但是當年和現在不同，布萊恩在取得即時的資料方面遭遇困難。那時，他透過放在公寓一個空房間中非常大型的衛星碟形天線，接收延遲十分鐘送達的資料。唯一的問題是，有一株垂死的櫻桃樹正巧長在窗戶外邊。這棵樹干擾了他的資料饋送。幸運地，有個晚上，就像大師變魔術般，這棵枯乾的櫻桃樹瞬間消失，布萊恩就此悠遊交易場！


    但布萊恩的交易並沒有立即成功，所以他埋首閱讀和研究能夠到手的一切東西。他讀了一本拉里·威廉斯的書。1994年，布萊恩向他請益。拉里非常慷慨地同意和布萊恩喝杯咖啡。接下來的事，大家都知道了。布萊恩將成功歸功於拉里的教導和指導。1996年，布萊恩辭去海軍講師的工作，全時投入市場交易。


    布萊恩結合拉里的教導和他自己的市場觀察，成功發展出他自己獨特的進場和出場準則。2002到2005年之間，布萊恩協助拉里發表《威廉斯商品時機交易》(Williams
    Commodity Timing)新聞信，直到今天，仍然是持續出版時間第二久的商品新聞信。


    今天，布萊恩稱自己是無聊的主管級交易人，督導他自己的交易員；這些交易員會執行他下的委託單。除了他本身的交易，布萊恩還經營一個成功的諮詢顧問業務。布萊恩寧可不談他的交易方法，但他確實稱它為「自由裁量型策略法」。布萊恩使用Genesis軟體跑他的策略，尋找持續二到四天的短線交易。但是大家也知道，在他認為合適的時候，會持有長達三個星期的交易。布萊恩主要交易期貨，但會選擇性地交易包含金屬、能源、穀物、利率、貨幣和指數市場在內的大型多樣化組合。'
  - '[PAGE 387]


    布萊恩在交易之餘暇，會快樂地開車載家人到鄉下旅行和觀光。雖然他妻子有時會因出遊突如其來而感到不知所措。布萊恩說：「內人小時候從沒和父親一起打包東西，塞進汽車，來個週日午後鄉間漫遊。孩子們見到車子裡母親一臉勉強，父親快樂地握著方向盤，真不知道該怎麼想！」布萊恩和他家人住在美國愛達荷州。以下是布萊恩的交易建議。


    我想要直截了當地說：每一位新進交易人都有交易卓越的潛力。他們如何和何時達成目標，資本是否足夠，則完全是另一回事。他們選擇成為基本面或技術面為基礎的交易人，操作自由裁量型或機械型訊號，為達成目標的所有研究發展和交易與評估，都是在實現交易卓越之前，需要投入時間和金錢的步驟。


    我信奉的思想學派，相信投入時間和第一次就做對，會防止犯相同的錯誤兩次。但是 一個人要如何做到這件事？


    如果我只能給想要出人頭地的新進交易人一段忠告，那會是：在你的交易生涯之初，越早越好，努力做到你能在一個先進的交易軟體平臺，定義你的交易觀念，並且回測你的市場信念。


    世界各地的其他交易同僚，一定會告訴你，耐性、自律、準時下委託單等很重要，但在交易生涯之初，能夠盡早驗證他們對市場的強烈信念，測試對市場型態和潛在進出訊號的想法，將有助於他們比別人更早到達他們想去的地方。就像旅行者用衛星定位系統（GPS），而不是停下來問路。


    對我來說，這類先進的交易技術，自我 1994 年購買「系統寫手」（System Writer）軟體以來，肯定變得越來越'
  - '[PAGE 388]


    好（越簡單）。我（自2000年以來）使用頂級的交易軟體 GenesisFT® ，而且這一陣子，如果沒辦法回測我的市場觀念和信念、確切知道我所交易市場的歷史、知道我在任何時間的勝算，那麼我不會在市場上做任何事。

    十年前，我會建議新進交易人盡可能做紙上模擬操作，直到絕對相信自己所做的事感覺是正確的。雖然這是發自肺腑之言的建議，但紙上模擬操作的唯一問題，通常伴隨市場出現下面三件事之一時：


    +   - 趨勢來時：用真正的錢去交易，不會有錯誤和虧損（……然後出現第二點的意外）

    - 接近趨勢結束時：紙上模擬操作起伏不定，導致你放棄可能是不錯的交易方法

    - 橫盤市場或新趨勢開始：結論同第二點


    走到這一步，更常出現的情況是真正交易後不久，新進交易人很快就掉進90%的賠錢組，很快地離開市場，因為他們不想花錢填無底洞，或者在養成壞習慣後繼續強迫交易。紙上模擬操作等於是站在一個不知終點線在哪裡的起點，只能任憑命運擺布。


    回測紙上模擬操作賦予新進交易人真實的能力，能夠回溯檢查過去可能執行的每一筆交易，觀察它們在上升、下跌或橫盤趨勢市場中會有什麽樣的表現。等於是在起點線就能看清楚前頭的交易路上每個轉彎之處的情況，也知道自己的表現會如何。一旦懷有信心，而且對所做事情相當放心，他們就應該繼續去做（重複獲得成功），而且每隔兩三年左右，將'
  md: '

    點、是客戶），大部分都只交易一口。這五年內，我見過幾百個賭客來來去去，卻只有一個賺錢。這給了我一個強烈的訊息：在你能夠開始獲利之前，你必須停止賠錢。

    這個簡單的概念，形成我的交易哲學基礎。

    大部分交易人，尤其是順勢交易人，一心一意只想極大化獲利。他們需要這麼做，以回補長期的連續虧損。但一個人要有過人之處，才能在連續虧損十筆交易和淨值下跌50%之後，做出理性的決策。我則採取不同的方法，專注於極小化虧損，以避免這種心理面困境。

    我唯一發生虧損的一年，是一筆交易造成的。這件事我還記憶鮮明。那是1994年6月。我交易銀行匯票利差非常成功，而變得有點自大，將本來的五口交易增為四十口。後來我跟家人到豪勳爵島（Lord
    Howe Island）度假，和市場失去連繫十天。利差通常波動得非常緩慢，而且你其實無法使用停損點。在我離開的時候，利率急劇波動，我被逮個正著。最後，匯票利率在六個月內從4.5%上升為8.5%。我因此學到教訓：我過度交易，而且沒有將注意焦點放在極小化自己的潛在虧損上。

    我的臨別贈言：出色的防守贏得比賽。

    傑夫・摩根


    這才是我所說的傑夫。傑夫當經紀員，以取得市場知識和交易技能的個人經驗，親眼見到數百名零售客戶來了又去，進出他的大門。而在1991到1995年間，他只見到一位交易人賺錢！這是一位經紀員誠實的觀察，據我所知，很可能是在一本交易書公開分享的第一人。


    順帶一提，我是那家經紀公司沒有賺到錢的許多客戶中的一個！請不要將傑夫的觀察斷章取義，說期貨風險很高。依我的看法，傑夫的說法適用於所有的積極型交易人——不管他們積極交易期貨、股票、選擇權、認購權證、貨幣，或者任何東西。


    現在我們回到傑夫對小額私人交易人的真實觀察——他們沒辦法控制和極小化虧損。在大多數交易人專注於極大化獲利之際，傑夫相信如果你專注於極小化虧損，對成功會有幫助。請記住，期望值是兩部分的價值。如果你能降低和極小化平均虧損，你就會提高你的期望值。也請記住，你交易的理由不是為了賺錢，不是為了準確率，而是為了有機會賺取期望值。


    傑夫的忠告來自他在五年期間對數百名私人交易人的觀察。那些交易人來來去去，只有一個賺錢。賺錢的那一個，是因為專注於極小化潛在虧損。傑夫要告訴你的，是集中心力成為最優秀的輸家！正如傑夫對你的臨別贈言——出色的防守贏得比賽。


    遺憾的是，我沒辦法給你聯絡傑夫的網址。但願你能夠深切體會他補充的忠告，因為他是曾在市場兩邊都有經驗的交易人，也是非常成功的私人交易人。他在過去二十一年只有一年賠錢。此外，他也受到許多規模大得多、管理數億美元機構和私人基金的交易人讚美推崇。


    ## 格雷格利·莫里斯


    格雷格利·莫里斯（Gregory L. Morris）是如假包換的捍衛戰士！湯姆克魯斯（Tom Cruise）靠邊站——格雷格利來了，因為他是加州米拉馬海軍陸戰隊航空基地（NAS
    Miramar）壯志凌雲海軍戰鬥機武器學校（Top Gun Navy Fighter Weapons School）正宗的畢業生。對格雷格利來說，那裡不是以假亂真的電影工作室，因為他在1970年代，有七年的時間在美國獨立號航空母艦（USS
    Independence）上當海軍 F-4 戰鬥機的駕駛員。


    海軍生涯過後，格雷格利對市場產生興趣，最後取代他對飛行的熱愛。格雷格利展現他對飛行相同的專注和投入水準，很快就成為市場技術專家和成功的交易人。


    今天，格雷格利因為他的暢銷書《蠟燭圖精解》（Candlestick Charting Explained.）而知名。這本書在1995年初版，現在是第三版。它可能是談蠟燭圖分析迄今最暢銷的書之一。格雷格利在日本時，親自研究蠟燭圖分析的藝術。他也著有《市場廣度指標完全指南》（The
    Complete Guide to Market Breadth Indicators），以百科全書的格式，呈現市場內部指標的豐富歷史。


    格雷格利和技術面分析的傳奇人物約翰·墨菲（John Murphy）聯手創設墨菲莫里斯公司（MurphyMorris Inc.），並將它經營成知名頂尖的網路市場分析工具與評論供應者。2002年，他們將自己的事業賣給股票走勢圖網路公司（StockCharts.com,
    Inc.）。


    賣出公司後的若幹年裡，他繼續向墨菲莫里斯資金管理（MurphyMorris Money Management）的墨菲莫里斯指數股票型證券投資信託基金（MurphyMorris
    ETF Fund）提供諮詢顧問服務，之後當上史塔迪昂資金管理公司（Stadion Money Management, Inc.；前身為 PMFM, Inc.）的首席技術面分析師。史塔迪昂是一家大型資金管理公司，管理超過二十億美元的基金。格雷格利設計和發展以技術準則為基礎的模式，被用於監督這些基金的管理。


    由於知名度高，事業有成，格雷格利是炙手可熱的演說者，曾向北美和南美、歐洲，以及中國的交易人發表演說。《商業週刊》(Business Week) 也曾特別報導他。如果你住在美國，你會經常在福斯財經新聞網（Fox
    Business）、CNBC和彭博電視臺（Bloomberg TV）上面看到他接受訪問，發表他對市場的觀點。格雷格利和他太太蘿拉（Laura）住在美國喬治亞州北部的山區。以下是他給交易人的忠告。


    這類問題，其實我可以只用兩個字來回答——紀律。過去三十五年，我發展出技術面分析軟體、寫過文章、出版兩本談技術面分析的書、製作技術指標和交易系統，而現在使用以技術準則為基礎的模式，管理接近二十億美元的資產。根據穩健的技術原則，發展良好的技術模式，加上穩健的買進、賣出、交換操作的一組準則，只是持續不斷達成良好資金管理目標的一部分。如果使用者缺乏紀律，沒有嚴格遵循，上面所說，無一能夠運作。

    一旦你有了良好的技術面模式，接著你會需要一組準則，根據來自所用模式的各種讀數，在資產投入水準上有所依循（可用資產的百分率）。舉例來說，當你的模式起初要你投資，但限制你的曝險水準，直到你得到更多的證據，證實趨勢就要實現，因此可以交易，可能是明智之舉。隨著模式改善，買進準則會允許你投入更多的資產。在每個階段，你也必須確切知道要在哪個價格停損——然後確實遵循，好像你的生活非仰賴它不可。千萬不要事後才來揣測停損水準應該設在哪裡。

    長大成人後，大部分時間我都在節食。幾個月前，內人和我開車前往鄉間，半路停下來給車子加油。那是一座老式的加油站，所以我必須進到裡面，支付汽油費。我順便買了一大塊糖，回到車上時還在吃。內人知道我不應該吃糖果，說：「你一點紀律都沒有。」我回道：「不能這麼說，妳不曉得我希望吃多少糖果。」重點在於：紀律不是你能夠調整或部分使用的東西；遵循紀律，有就是有：沒有就是沒有。幾乎任何技術面分析方法。都會提供成功所需的紀律，而且它會發掘和組織關於市場的細節，幫助你建立一套穩健的交易準則。這套模式會協助控制缺乏耐性，而更重要的是，它會在模式多樣化存在期間，阻止你偏離到另一個方法。一個人必須嚴守紀律，遵循模式的要求，而這在使用合乎邏輯的技術面量數去設計模式，而不是使用者不完全了解的東西時，會比較容易。紀律將協助跨越分析和行動之間的缺口，而這是許多人的絆腳石。良好的紀律有助於克服恐懼、貪婪和希望這些可怕的人類情緒。紀律、紀律、紀律。


    格雷格利·莫里斯


    格雷格利認為最重要的，除了就紀律，還是紀律。這番話來自學識淵博的技術面分析高手之口。他所著的談蠟燭圖分析的一本書，可能是有史以來最好的。他和技術面分析的宗師墨菲密切合作，但他的建議不帶一絲技術面分析的成分。他給你的訊息簡單有力。你可以擁有如何接觸市場的所有知識、所有觀念，但如果你缺乏遵循計畫的紀律，那麼你將一無所有。但願你已銘記格雷格利的建議。


    你可以透過史塔迪昂的網站和格雷格利聯絡：www.stadionmoney.com。


    ## 尼克·萊吉


    尼克·萊吉（Nick Radge）可能是我認識的人當中，資歷最完整的交易人。任何市場、工具、工作或是和市場有關的職業，尼克可能都曾分析、交易或者做過。沒有什麼是尼克沒有經歷過的。他曾是交易者，也做過經紀員、基金經理人、交易教育工作者、交易作者，也曾代管論壇網站，出版諮詢服務刊物。我所認識的交易人，沒有一個人的資歷像尼克那麼完整。


    尼克自1985年開始交易，從雪梨期貨交易所（Sydney Futures Exchange）的交易大廳，到澳大利亞全球投資銀行的國際交易櫃臺，都有他的踪跡。尼克交易大部分全球期貨市場、澳大利亞、美國、英國和馬來西亞的股票。他經營自己的避險基金，而且曾經是澳大利亞投資銀行巨頭麥格理銀行（Macquarie
    Bank）的副總監。他是澳大利亞技術面分析協會（Australian Technical Analysis Association）的副主席，著有《日常交易人》（Every-day
    Traders）和《適應性分析》（Adaptive Analysis）兩本書。


    尼克的專長在於自由裁量型技術面分析（綜和艾略特波浪和傳統的走勢圖型態與成交量分析）、交易系統設計與機械型交易。尼克也對交易心理面對交易人的成敗產生的衝擊很感興趣。


    但是，和大部分人一樣，尼克並不是一夕成功。雖然尼克自己不自覺，但他剛進入市場時是機械型交易人。1985年，尼克偶然間走過一名顧問的桌子，看他在方格紙上畫紅線和藍線。那位顧問非常熱心地告訴尼克說，當藍線往上交叉，高於紅線，他會買進，而當藍線往下交叉，落到紅線之下，則會賣出。尼克一聽，當下就覺得自己找到了交易聖杯。見過那名顧問後幾分鐘，他就到街報攤買彩色筆和方格紙。幾天之內，他就開始交易指數期貨！但令他失望的是，他的移動平均交叉系統，不是他所想的那種聖杯！


    尼克的交易持續不斷獲利，是大約十年後的事。他和許多人一樣，轉了許多次彎，之後才確定順勢交易是他喜愛的方法。尼克樂在順勢交易。雖然他能執行若干自由裁量型短線波段交易，但核心仍是追隨趨勢。如同他所說的，這是「從市場擷取低壓力利潤的最好方式」。


    今天，尼克是多重時間架構的趨勢追隨者。尼克以三種不同的機械型策略，交易三種不同的時間架構。他的較短期策略，改良自海龜交易策略，可能持有交易達一個月。他的第二套策略可能持有部位達十二個月，而他的第三套策略，可能持有交易長達兩三年。尼克最早於1990年代末，發展兩套比較長期的策略，用於交易商品期貨，然後在2001年改良以交易股票。尼克喜歡根據每天結束時的資料，交易股票和差價合約，但大家都知道，當吸引人的格局出現，他也會交易貨幣和期貨。尼克在研究和發展交易策略時，使用的是TradeStation和Amibroker。尼克被視為TradeStation的專家。


    除了個人交易，尼克也經營成功的諮詢顧問服務。他在澳大利亞是熟面孔，因為經常上CNBC和天空新聞臺（Sky News），也經常接受《澳大利亞金融評論》（Australian
    Financial Review）訪問，談他的市場見解。


    尼克不交易的時候，經常可以看到他一竿在手，在努薩（Noosa）附近的釣魚場所出現。尼克喜歡釣魚。他將這項活動視為遠離市場，鬆懈身心的出口，可說已經上癮！他愛上釣魚，一週能出門幾次就出門幾次。他太太可能因此鬆了一口氣，因為尼克是個完美主義者，不太能容忍蠢事，所以有時顯得嚴肅緊張。但他表示，他已經越來越好，這無疑要感謝澳大利亞受到折磨的可憐魚兒！尼克和他家人住在澳大利亞努薩。現在就來聆聽尼克的忠告。


    堅忍：在交易的旅程上，儘管會遇到各種困難、障礙和挫折，務必不屈不撓，持之以恆。在今天的社會中，一切都要求當下：最新的玩意兒、工作升遷、汽車、連在餐廳點餐也是一樣。一切都不嫌快。對交易成功也是一樣。為什麼有那麼多人交易失敗？他們根本缺乏堅忍精神或耐心，好讓市場有機會能夠獎賞他們。你可能有最傑出的策略、最優秀的交易計畫，以及傳奇的資金管理策略。但如果你不讓這些工具按自己的時間展現魔法，它們便一無是處。這是一個簡單的概念，但在絕大多數人，實踐卻極其困難，因為每個人都想要立刻獲利。


    投資圈奉行一句老話：「重要的是時間，不是抓時機。」這通常是指買進抱牢策略。但是對交易人來說，這也是邁向成功極其重要的元素，而且可能是最重要的一個。不管你運用什麼樣的交易策略，市場在做好準備時，都會獎賞你。這不像雇主每週五準時發薪給員工。市場準備好的時候就會付錢。你要做的，就是在它掏錢時站在那裡。


    打個比方。你買房子會著眼於三個月或六個月的時限嗎？在絕大多數人，答案是斬釘截鐵的「不」。你會採取更長期的觀點。你知道在那段期間內，房屋價值會起起落落，在若干年中完全不動，甚至不漲反跌。但是你並不擔心，因為你明白，從較長期的觀點來看，價值會上揚。


    交易也相仿，特別是追隨趨勢，而這依我的看法，是從市場中撷取低壓力利潤的最好方式。我現在是趨勢追隨者，特別是從多頭面交易股票。我的平均持有期間約十個月。我運用的策略非常簡單，即盡速認賠賣出和讓利潤自行累增。當市場趨勢上揚，我希望身在其中。當市場趨勢下挫，我希望坐擁現金。此外，根本不需要更複雜的方法。


    為什麼不是每個人都能這樣做呢？因為他們認為每一個月都應該獲利。真的，他們要求每一年都要獲利。但我們面對的現實是，股價不是每一年的趨勢都走高。是的，它們在絕大多數的年頭中趨勢上揚，但不是每一年都如此。2008年當然不是，而我很快樂地坐擁現金，等待時機降臨。但是業餘交易人不想擁有現金，而是想要賺錢，想要介入市場，想要現在就獲利。


    接下來是2009年，出現過去十年來股價最強勁的漲勢之一。專業交易人擁有現金。專業交易人有信心。專業交易人不屈不撓。專業交易人用經過證明 的策略做好準備，並且介入市場。2009年，專業交易人大賺一筆。但是業餘交易人六個月前就放棄了追隨趨勢的概念，試著改用其他幾種策略，卻都徒勞無功。他們比較有可能賠錢。他們當然備感挫折。他們多次改弦易轍，試圖矯正問題，卻一直在繞圈圈。


    他們帶著遺憾的心情回顧2009年。他們當初若能堅忍、對市場利潤抱持長期觀點，那就好了。


    尼克．萊吉


    堅忍。講得太真切了。我想，許多交易人都能認同尼克的忠告，回顧他們因為表現不好而捨去的各種策略，之後才因為見到它們最近升抵淨值的新高，而重新拾回那些策略。這就像在結帳排隊時，換到可能最快的那一條，才發現排得最久！正如尼克的忠告所說的，你可能擁有一切——穩健的策略和明智的資金管理策略，但除非你有時間、耐性和堅忍，否則你將一無所有，滿目盡是遭人捨棄的策略，以及越升越高的挫折感！你必須忽視想要立即成功、立即獲利，以及立即獲得滿足的交易心理；交易很少速成。請將堅忍加進你的交易計畫。


    尼克的聯絡網站：www.thechartist.com.au。


    ## 布萊恩·沙德


    布萊恩·沙德（Brian Schad）曾經是美國海豹部隊（SEAL）隊員，也是成功的交易人。布萊恩和大部分人一樣，不是一開始就是交易人。在踏進市場之前十二年，布萊恩為美國政府工作，擔任美國海豹部隊的戴盎潛水員。他的一些經驗令人不寒而慄。他在修補美國戰艦愛荷華號（USS
    Iowa）時，因為被困在海下而缺氧。這次的瀕死經驗，使得布萊恩脊椎有氮氣泡沫、手臂癱瘓，在高壓氧艙待了八個小時。誰說交易風險高！


    你能讓一個人離開海軍，但是沒辦法抽離他的海軍經驗。在和布萊恩討論這段的編寫時，他的談話經常出現「明白」、「請查收」、「收到」等字眼，我就像在和美國海軍打交道！我必須說，布萊恩是回覆電子郵件和問題速度最快的交易人之一。我想，這反映出他在海軍服役，學會在高度壓力下嚴守紀律，以高度效率應付急迫的任務。布萊恩當然能拿海軍生活類比交易，因為兩者都會隨機經歷緊急狀況，需要明快做出決定。


    布萊恩1992年開始對市場產生興趣，以交易利潤補貼海軍的收入。他主要是自由裁量型交易人，使用傳統的技術面分析，在股票選擇權尋找交易格局。


    今天我們都很容易透過網際網路，輕易取得資料，但是當年和現在不同，布萊恩在取得即時的資料方面遭遇困難。那時，他透過放在公寓一個空房間中非常大型的衛星碟形天線，接收延遲十分鐘送達的資料。唯一的問題是，有一株垂死的櫻桃樹正巧長在窗戶外邊。這棵樹干擾了他的資料饋送。幸運地，有個晚上，就像大師變魔術般，這棵枯乾的櫻桃樹瞬間消失，布萊恩就此悠遊交易場！


    但布萊恩的交易並沒有立即成功，所以他埋首閱讀和研究能夠到手的一切東西。他讀了一本拉里·威廉斯的書。1994年，布萊恩向他請益。拉里非常慷慨地同意和布萊恩喝杯咖啡。接下來的事，大家都知道了。布萊恩將成功歸功於拉里的教導和指導。1996年，布萊恩辭去海軍講師的工作，全時投入市場交易。


    布萊恩結合拉里的教導和他自己的市場觀察，成功發展出他自己獨特的進場和出場準則。2002到2005年之間，布萊恩協助拉里發表《威廉斯商品時機交易》(Williams
    Commodity Timing)新聞信，直到今天，仍然是持續出版時間第二久的商品新聞信。


    今天，布萊恩稱自己是無聊的主管級交易人，督導他自己的交易員；這些交易員會執行他下的委託單。除了他本身的交易，布萊恩還經營一個成功的諮詢顧問業務。布萊恩寧可不談他的交易方法，但他確實稱它為「自由裁量型策略法」。布萊恩使用Genesis軟體跑他的策略，尋找持續二到四天的短線交易。但是大家也知道，在他認為合適的時候，會持有長達三個星期的交易。布萊恩主要交易期貨，但會選擇性地交易包含金屬、能源、穀物、利率、貨幣和指數市場在內的大型多樣化組合。


    布萊恩在交易之餘暇，會快樂地開車載家人到鄉下旅行和觀光。雖然他妻子有時會因出遊突如其來而感到不知所措。布萊恩說：「內人小時候從沒和父親一起打包東西，塞進汽車，來個週日午後鄉間漫遊。孩子們見到車子裡母親一臉勉強，父親快樂地握著方向盤，真不知道該怎麼想！」布萊恩和他家人住在美國愛達荷州。以下是布萊恩的交易建議。


    我想要直截了當地說：每一位新進交易人都有交易卓越的潛力。他們如何和何時達成目標，資本是否足夠，則完全是另一回事。他們選擇成為基本面或技術面為基礎的交易人，操作自由裁量型或機械型訊號，為達成目標的所有研究發展和交易與評估，都是在實現交易卓越之前，需要投入時間和金錢的步驟。


    我信奉的思想學派，相信投入時間和第一次就做對，會防止犯相同的錯誤兩次。但是 一個人要如何做到這件事？


    如果我只能給想要出人頭地的新進交易人一段忠告，那會是：在你的交易生涯之初，越早越好，努力做到你能在一個先進的交易軟體平臺，定義你的交易觀念，並且回測你的市場信念。


    世界各地的其他交易同僚，一定會告訴你，耐性、自律、準時下委託單等很重要，但在交易生涯之初，能夠盡早驗證他們對市場的強烈信念，測試對市場型態和潛在進出訊號的想法，將有助於他們比別人更早到達他們想去的地方。就像旅行者用衛星定位系統（GPS），而不是停下來問路。


    對我來說，這類先進的交易技術，自我 1994 年購買「系統寫手」（System Writer）軟體以來，肯定變得越來越好（越簡單）。我（自2000年以來）使用頂級的交易軟體
    GenesisFT® ，而且這一陣子，如果沒辦法回測我的市場觀念和信念、確切知道我所交易市場的歷史、知道我在任何時間的勝算，那麼我不會在市場上做任何事。

    十年前，我會建議新進交易人盡可能做紙上模擬操作，直到絕對相信自己所做的事感覺是正確的。雖然這是發自肺腑之言的建議，但紙上模擬操作的唯一問題，通常伴隨市場出現下面三件事之一時：


    - 趨勢來時：用真正的錢去交易，不會有錯誤和虧損（……然後出現第二點的意外）

    - 接近趨勢結束時：紙上模擬操作起伏不定，導致你放棄可能是不錯的交易方法

    - 橫盤市場或新趨勢開始：結論同第二點


    走到這一步，更常出現的情況是真正交易後不久，新進交易人很快就掉進90%的賠錢組，很快地離開市場，因為他們不想花錢填無底洞，或者在養成壞習慣後繼續強迫交易。紙上模擬操作等於是站在一個不知終點線在哪裡的起點，只能任憑命運擺布。


    回測紙上模擬操作賦予新進交易人真實的能力，能夠回溯檢查過去可能執行的每一筆交易，觀察它們在上升、下跌或橫盤趨勢市場中會有什麽樣的表現。等於是在起點線就能看清楚前頭的交易路上每個轉彎之處的情況，也知道自己的表現會如何。一旦懷有信心，而且對所做事情相當放心，他們就應該繼續去做（重複獲得成功），而且每隔兩三年左右，將

    '
  mdcn: '

    點、是客戶），大部分都只交易一口。這五年內，我見過幾百個賭客來來去去，卻只有一個賺錢。這給了我一個強烈的訊息：在你能夠開始獲利之前，你必須停止賠錢。

    這個簡單的概念，形成我的交易哲學基礎。

    大部分交易人，尤其是順勢交易人，一心一意只想極大化獲利。他們需要這麼做，以回補長期的連續虧損。但一個人要有過人之處，才能在連續虧損十筆交易和淨值下跌50%之後，做出理性的決策。我則採取不同的方法，專注於極小化虧損，以避免這種心理面困境。

    我唯一發生虧損的一年，是一筆交易造成的。這件事我還記憶鮮明。那是1994年6月。我交易銀行匯票利差非常成功，而變得有點自大，將本來的五口交易增為四十口。後來我跟家人到豪勳爵島（Lord
    Howe Island）度假，和市場失去連繫十天。利差通常波動得非常緩慢，而且你其實無法使用停損點。在我離開的時候，利率急劇波動，我被逮個正著。最後，匯票利率在六個月內從4.5%上升為8.5%。我因此學到教訓：我過度交易，而且沒有將注意焦點放在極小化自己的潛在虧損上。

    我的臨別贈言：出色的防守贏得比賽。

    傑夫・摩根


    這才是我所說的傑夫。傑夫當經紀員，以取得市場知識和交易技能的個人經驗，親眼見到數百名零售客戶來了又去，進出他的大門。而在1991到1995年間，他只見到一位交易人賺錢！這是一位經紀員誠實的觀察，據我所知，很可能是在一本交易書公開分享的第一人。


    順帶一提，我是那家經紀公司沒有賺到錢的許多客戶中的一個！請不要將傑夫的觀察斷章取義，說期貨風險很高。依我的看法，傑夫的說法適用於所有的積極型交易人——不管他們積極交易期貨、股票、選擇權、認購權證、貨幣，或者任何東西。


    現在我們回到傑夫對小額私人交易人的真實觀察——他們沒辦法控制和極小化虧損。在大多數交易人專注於極大化獲利之際，傑夫相信如果你專注於極小化虧損，對成功會有幫助。請記住，期望值是兩部分的價值。如果你能降低和極小化平均虧損，你就會提高你的期望值。也請記住，你交易的理由不是為了賺錢，不是為了準確率，而是為了有機會賺取期望值。


    傑夫的忠告來自他在五年期間對數百名私人交易人的觀察。那些交易人來來去去，只有一個賺錢。賺錢的那一個，是因為專注於極小化潛在虧損。傑夫要告訴你的，是集中心力成為最優秀的輸家！正如傑夫對你的臨別贈言——出色的防守贏得比賽。


    遺憾的是，我沒辦法給你聯絡傑夫的網址。但願你能夠深切體會他補充的忠告，因為他是曾在市場兩邊都有經驗的交易人，也是非常成功的私人交易人。他在過去二十一年只有一年賠錢。此外，他也受到許多規模大得多、管理數億美元機構和私人基金的交易人讚美推崇。


    ## 格雷格利·莫里斯


    格雷格利·莫里斯（Gregory L. Morris）是如假包換的捍衛戰士！湯姆克魯斯（Tom Cruise）靠邊站——格雷格利來了，因為他是加州米拉馬海軍陸戰隊航空基地（NAS
    Miramar）壯志凌雲海軍戰鬥機武器學校（Top Gun Navy Fighter Weapons School）正宗的畢業生。對格雷格利來說，那裡不是以假亂真的電影工作室，因為他在1970年代，有七年的時間在美國獨立號航空母艦（USS
    Independence）上當海軍 F-4 戰鬥機的駕駛員。


    海軍生涯過後，格雷格利對市場產生興趣，最後取代他對飛行的熱愛。格雷格利展現他對飛行相同的專注和投入水準，很快就成為市場技術專家和成功的交易人。


    今天，格雷格利因為他的暢銷書《蠟燭圖精解》（Candlestick Charting Explained.）而知名。這本書在1995年初版，現在是第三版。它可能是談蠟燭圖分析迄今最暢銷的書之一。格雷格利在日本時，親自研究蠟燭圖分析的藝術。他也著有《市場廣度指標完全指南》（The
    Complete Guide to Market Breadth Indicators），以百科全書的格式，呈現市場內部指標的豐富歷史。


    格雷格利和技術面分析的傳奇人物約翰·墨菲（John Murphy）聯手創設墨菲莫里斯公司（MurphyMorris Inc.），並將它經營成知名頂尖的網路市場分析工具與評論供應者。2002年，他們將自己的事業賣給股票走勢圖網路公司（StockCharts.com,
    Inc.）。


    賣出公司後的若幹年裡，他繼續向墨菲莫里斯資金管理（MurphyMorris Money Management）的墨菲莫里斯指數股票型證券投資信託基金（MurphyMorris
    ETF Fund）提供諮詢顧問服務，之後當上史塔迪昂資金管理公司（Stadion Money Management, Inc.；前身為 PMFM, Inc.）的首席技術面分析師。史塔迪昂是一家大型資金管理公司，管理超過二十億美元的基金。格雷格利設計和發展以技術準則為基礎的模式，被用於監督這些基金的管理。


    由於知名度高，事業有成，格雷格利是炙手可熱的演說者，曾向北美和南美、歐洲，以及中國的交易人發表演說。《商業週刊》(Business Week) 也曾特別報導他。如果你住在美國，你會經常在福斯財經新聞網（Fox
    Business）、CNBC和彭博電視臺（Bloomberg TV）上面看到他接受訪問，發表他對市場的觀點。格雷格利和他太太蘿拉（Laura）住在美國喬治亞州北部的山區。以下是他給交易人的忠告。


    這類問題，其實我可以只用兩個字來回答——紀律。過去三十五年，我發展出技術面分析軟體、寫過文章、出版兩本談技術面分析的書、製作技術指標和交易系統，而現在使用以技術準則為基礎的模式，管理接近二十億美元的資產。根據穩健的技術原則，發展良好的技術模式，加上穩健的買進、賣出、交換操作的一組準則，只是持續不斷達成良好資金管理目標的一部分。如果使用者缺乏紀律，沒有嚴格遵循，上面所說，無一能夠運作。

    一旦你有了良好的技術面模式，接著你會需要一組準則，根據來自所用模式的各種讀數，在資產投入水準上有所依循（可用資產的百分率）。舉例來說，當你的模式起初要你投資，但限制你的曝險水準，直到你得到更多的證據，證實趨勢就要實現，因此可以交易，可能是明智之舉。隨著模式改善，買進準則會允許你投入更多的資產。在每個階段，你也必須確切知道要在哪個價格停損——然後確實遵循，好像你的生活非仰賴它不可。千萬不要事後才來揣測停損水準應該設在哪裡。

    長大成人後，大部分時間我都在節食。幾個月前，內人和我開車前往鄉間，半路停下來給車子加油。那是一座老式的加油站，所以我必須進到裡面，支付汽油費。我順便買了一大塊糖，回到車上時還在吃。內人知道我不應該吃糖果，說：「你一點紀律都沒有。」我回道：「不能這麼說，妳不曉得我希望吃多少糖果。」重點在於：紀律不是你能夠調整或部分使用的東西；遵循紀律，有就是有：沒有就是沒有。幾乎任何技術面分析方法。都會提供成功所需的紀律，而且它會發掘和組織關於市場的細節，幫助你建立一套穩健的交易準則。這套模式會協助控制缺乏耐性，而更重要的是，它會在模式多樣化存在期間，阻止你偏離到另一個方法。一個人必須嚴守紀律，遵循模式的要求，而這在使用合乎邏輯的技術面量數去設計模式，而不是使用者不完全了解的東西時，會比較容易。紀律將協助跨越分析和行動之間的缺口，而這是許多人的絆腳石。良好的紀律有助於克服恐懼、貪婪和希望這些可怕的人類情緒。紀律、紀律、紀律。


    格雷格利·莫里斯


    格雷格利認為最重要的，除了就紀律，還是紀律。這番話來自學識淵博的技術面分析高手之口。他所著的談蠟燭圖分析的一本書，可能是有史以來最好的。他和技術面分析的宗師墨菲密切合作，但他的建議不帶一絲技術面分析的成分。他給你的訊息簡單有力。你可以擁有如何接觸市場的所有知識、所有觀念，但如果你缺乏遵循計畫的紀律，那麼你將一無所有。但願你已銘記格雷格利的建議。


    你可以透過史塔迪昂的網站和格雷格利聯絡：www.stadionmoney.com。


    ## 尼克·萊吉


    尼克·萊吉（Nick Radge）可能是我認識的人當中，資歷最完整的交易人。任何市場、工具、工作或是和市場有關的職業，尼克可能都曾分析、交易或者做過。沒有什麼是尼克沒有經歷過的。他曾是交易者，也做過經紀員、基金經理人、交易教育工作者、交易作者，也曾代管論壇網站，出版諮詢服務刊物。我所認識的交易人，沒有一個人的資歷像尼克那麼完整。


    尼克自1985年開始交易，從雪梨期貨交易所（Sydney Futures Exchange）的交易大廳，到澳大利亞全球投資銀行的國際交易櫃臺，都有他的踪跡。尼克交易大部分全球期貨市場、澳大利亞、美國、英國和馬來西亞的股票。他經營自己的避險基金，而且曾經是澳大利亞投資銀行巨頭麥格理銀行（Macquarie
    Bank）的副總監。他是澳大利亞技術面分析協會（Australian Technical Analysis Association）的副主席，著有《日常交易人》（Every-day
    Traders）和《適應性分析》（Adaptive Analysis）兩本書。


    尼克的專長在於自由裁量型技術面分析（綜和艾略特波浪和傳統的走勢圖型態與成交量分析）、交易系統設計與機械型交易。尼克也對交易心理面對交易人的成敗產生的衝擊很感興趣。


    但是，和大部分人一樣，尼克並不是一夕成功。雖然尼克自己不自覺，但他剛進入市場時是機械型交易人。1985年，尼克偶然間走過一名顧問的桌子，看他在方格紙上畫紅線和藍線。那位顧問非常熱心地告訴尼克說，當藍線往上交叉，高於紅線，他會買進，而當藍線往下交叉，落到紅線之下，則會賣出。尼克一聽，當下就覺得自己找到了交易聖杯。見過那名顧問後幾分鐘，他就到街報攤買彩色筆和方格紙。幾天之內，他就開始交易指數期貨！但令他失望的是，他的移動平均交叉系統，不是他所想的那種聖杯！


    尼克的交易持續不斷獲利，是大約十年後的事。他和許多人一樣，轉了許多次彎，之後才確定順勢交易是他喜愛的方法。尼克樂在順勢交易。雖然他能執行若干自由裁量型短線波段交易，但核心仍是追隨趨勢。如同他所說的，這是「從市場擷取低壓力利潤的最好方式」。


    今天，尼克是多重時間架構的趨勢追隨者。尼克以三種不同的機械型策略，交易三種不同的時間架構。他的較短期策略，改良自海龜交易策略，可能持有交易達一個月。他的第二套策略可能持有部位達十二個月，而他的第三套策略，可能持有交易長達兩三年。尼克最早於1990年代末，發展兩套比較長期的策略，用於交易商品期貨，然後在2001年改良以交易股票。尼克喜歡根據每天結束時的資料，交易股票和差價合約，但大家都知道，當吸引人的格局出現，他也會交易貨幣和期貨。尼克在研究和發展交易策略時，使用的是TradeStation和Amibroker。尼克被視為TradeStation的專家。


    除了個人交易，尼克也經營成功的諮詢顧問服務。他在澳大利亞是熟面孔，因為經常上CNBC和天空新聞臺（Sky News），也經常接受《澳大利亞金融評論》（Australian
    Financial Review）訪問，談他的市場見解。


    尼克不交易的時候，經常可以看到他一竿在手，在努薩（Noosa）附近的釣魚場所出現。尼克喜歡釣魚。他將這項活動視為遠離市場，鬆懈身心的出口，可說已經上癮！他愛上釣魚，一週能出門幾次就出門幾次。他太太可能因此鬆了一口氣，因為尼克是個完美主義者，不太能容忍蠢事，所以有時顯得嚴肅緊張。但他表示，他已經越來越好，這無疑要感謝澳大利亞受到折磨的可憐魚兒！尼克和他家人住在澳大利亞努薩。現在就來聆聽尼克的忠告。


    堅忍：在交易的旅程上，儘管會遇到各種困難、障礙和挫折，務必不屈不撓，持之以恆。在今天的社會中，一切都要求當下：最新的玩意兒、工作升遷、汽車、連在餐廳點餐也是一樣。一切都不嫌快。對交易成功也是一樣。為什麼有那麼多人交易失敗？他們根本缺乏堅忍精神或耐心，好讓市場有機會能夠獎賞他們。你可能有最傑出的策略、最優秀的交易計畫，以及傳奇的資金管理策略。但如果你不讓這些工具按自己的時間展現魔法，它們便一無是處。這是一個簡單的概念，但在絕大多數人，實踐卻極其困難，因為每個人都想要立刻獲利。


    投資圈奉行一句老話：「重要的是時間，不是抓時機。」這通常是指買進抱牢策略。但是對交易人來說，這也是邁向成功極其重要的元素，而且可能是最重要的一個。不管你運用什麼樣的交易策略，市場在做好準備時，都會獎賞你。這不像雇主每週五準時發薪給員工。市場準備好的時候就會付錢。你要做的，就是在它掏錢時站在那裡。


    打個比方。你買房子會著眼於三個月或六個月的時限嗎？在絕大多數人，答案是斬釘截鐵的「不」。你會採取更長期的觀點。你知道在那段期間內，房屋價值會起起落落，在若干年中完全不動，甚至不漲反跌。但是你並不擔心，因為你明白，從較長期的觀點來看，價值會上揚。


    交易也相仿，特別是追隨趨勢，而這依我的看法，是從市場中撷取低壓力利潤的最好方式。我現在是趨勢追隨者，特別是從多頭面交易股票。我的平均持有期間約十個月。我運用的策略非常簡單，即盡速認賠賣出和讓利潤自行累增。當市場趨勢上揚，我希望身在其中。當市場趨勢下挫，我希望坐擁現金。此外，根本不需要更複雜的方法。


    為什麼不是每個人都能這樣做呢？因為他們認為每一個月都應該獲利。真的，他們要求每一年都要獲利。但我們面對的現實是，股價不是每一年的趨勢都走高。是的，它們在絕大多數的年頭中趨勢上揚，但不是每一年都如此。2008年當然不是，而我很快樂地坐擁現金，等待時機降臨。但是業餘交易人不想擁有現金，而是想要賺錢，想要介入市場，想要現在就獲利。


    接下來是2009年，出現過去十年來股價最強勁的漲勢之一。專業交易人擁有現金。專業交易人有信心。專業交易人不屈不撓。專業交易人用經過證明 的策略做好準備，並且介入市場。2009年，專業交易人大賺一筆。但是業餘交易人六個月前就放棄了追隨趨勢的概念，試著改用其他幾種策略，卻都徒勞無功。他們比較有可能賠錢。他們當然備感挫折。他們多次改弦易轍，試圖矯正問題，卻一直在繞圈圈。


    他們帶著遺憾的心情回顧2009年。他們當初若能堅忍、對市場利潤抱持長期觀點，那就好了。


    尼克．萊吉


    堅忍。講得太真切了。我想，許多交易人都能認同尼克的忠告，回顧他們因為表現不好而捨去的各種策略，之後才因為見到它們最近升抵淨值的新高，而重新拾回那些策略。這就像在結帳排隊時，換到可能最快的那一條，才發現排得最久！正如尼克的忠告所說的，你可能擁有一切——穩健的策略和明智的資金管理策略，但除非你有時間、耐性和堅忍，否則你將一無所有，滿目盡是遭人捨棄的策略，以及越升越高的挫折感！你必須忽視想要立即成功、立即獲利，以及立即獲得滿足的交易心理；交易很少速成。請將堅忍加進你的交易計畫。


    尼克的聯絡網站：www.thechartist.com.au。


    ## 布萊恩·沙德


    布萊恩·沙德（Brian Schad）曾經是美國海豹部隊（SEAL）隊員，也是成功的交易人。布萊恩和大部分人一樣，不是一開始就是交易人。在踏進市場之前十二年，布萊恩為美國政府工作，擔任美國海豹部隊的戴盎潛水員。他的一些經驗令人不寒而慄。他在修補美國戰艦愛荷華號（USS
    Iowa）時，因為被困在海下而缺氧。這次的瀕死經驗，使得布萊恩脊椎有氮氣泡沫、手臂癱瘓，在高壓氧艙待了八個小時。誰說交易風險高！


    你能讓一個人離開海軍，但是沒辦法抽離他的海軍經驗。在和布萊恩討論這段的編寫時，他的談話經常出現「明白」、「請查收」、「收到」等字眼，我就像在和美國海軍打交道！我必須說，布萊恩是回覆電子郵件和問題速度最快的交易人之一。我想，這反映出他在海軍服役，學會在高度壓力下嚴守紀律，以高度效率應付急迫的任務。布萊恩當然能拿海軍生活類比交易，因為兩者都會隨機經歷緊急狀況，需要明快做出決定。


    布萊恩1992年開始對市場產生興趣，以交易利潤補貼海軍的收入。他主要是自由裁量型交易人，使用傳統的技術面分析，在股票選擇權尋找交易格局。


    今天我們都很容易透過網際網路，輕易取得資料，但是當年和現在不同，布萊恩在取得即時的資料方面遭遇困難。那時，他透過放在公寓一個空房間中非常大型的衛星碟形天線，接收延遲十分鐘送達的資料。唯一的問題是，有一株垂死的櫻桃樹正巧長在窗戶外邊。這棵樹干擾了他的資料饋送。幸運地，有個晚上，就像大師變魔術般，這棵枯乾的櫻桃樹瞬間消失，布萊恩就此悠遊交易場！


    但布萊恩的交易並沒有立即成功，所以他埋首閱讀和研究能夠到手的一切東西。他讀了一本拉里·威廉斯的書。1994年，布萊恩向他請益。拉里非常慷慨地同意和布萊恩喝杯咖啡。接下來的事，大家都知道了。布萊恩將成功歸功於拉里的教導和指導。1996年，布萊恩辭去海軍講師的工作，全時投入市場交易。


    布萊恩結合拉里的教導和他自己的市場觀察，成功發展出他自己獨特的進場和出場準則。2002到2005年之間，布萊恩協助拉里發表《威廉斯商品時機交易》(Williams
    Commodity Timing)新聞信，直到今天，仍然是持續出版時間第二久的商品新聞信。


    今天，布萊恩稱自己是無聊的主管級交易人，督導他自己的交易員；這些交易員會執行他下的委託單。除了他本身的交易，布萊恩還經營一個成功的諮詢顧問業務。布萊恩寧可不談他的交易方法，但他確實稱它為「自由裁量型策略法」。布萊恩使用Genesis軟體跑他的策略，尋找持續二到四天的短線交易。但是大家也知道，在他認為合適的時候，會持有長達三個星期的交易。布萊恩主要交易期貨，但會選擇性地交易包含金屬、能源、穀物、利率、貨幣和指數市場在內的大型多樣化組合。


    布萊恩在交易之餘暇，會快樂地開車載家人到鄉下旅行和觀光。雖然他妻子有時會因出遊突如其來而感到不知所措。布萊恩說：「內人小時候從沒和父親一起打包東西，塞進汽車，來個週日午後鄉間漫遊。孩子們見到車子裡母親一臉勉強，父親快樂地握著方向盤，真不知道該怎麼想！」布萊恩和他家人住在美國愛達荷州。以下是布萊恩的交易建議。


    我想要直截了當地說：每一位新進交易人都有交易卓越的潛力。他們如何和何時達成目標，資本是否足夠，則完全是另一回事。他們選擇成為基本面或技術面為基礎的交易人，操作自由裁量型或機械型訊號，為達成目標的所有研究發展和交易與評估，都是在實現交易卓越之前，需要投入時間和金錢的步驟。


    我信奉的思想學派，相信投入時間和第一次就做對，會防止犯相同的錯誤兩次。但是 一個人要如何做到這件事？


    如果我只能給想要出人頭地的新進交易人一段忠告，那會是：在你的交易生涯之初，越早越好，努力做到你能在一個先進的交易軟體平臺，定義你的交易觀念，並且回測你的市場信念。


    世界各地的其他交易同僚，一定會告訴你，耐性、自律、準時下委託單等很重要，但在交易生涯之初，能夠盡早驗證他們對市場的強烈信念，測試對市場型態和潛在進出訊號的想法，將有助於他們比別人更早到達他們想去的地方。就像旅行者用衛星定位系統（GPS），而不是停下來問路。


    對我來說，這類先進的交易技術，自我 1994 年購買「系統寫手」（System Writer）軟體以來，肯定變得越來越好（越簡單）。我（自2000年以來）使用頂級的交易軟體
    GenesisFT® ，而且這一陣子，如果沒辦法回測我的市場觀念和信念、確切知道我所交易市場的歷史、知道我在任何時間的勝算，那麼我不會在市場上做任何事。

    十年前，我會建議新進交易人盡可能做紙上模擬操作，直到絕對相信自己所做的事感覺是正確的。雖然這是發自肺腑之言的建議，但紙上模擬操作的唯一問題，通常伴隨市場出現下面三件事之一時：


    - 趨勢來時：用真正的錢去交易，不會有錯誤和虧損（……然後出現第二點的意外）

    - 接近趨勢結束時：紙上模擬操作起伏不定，導致你放棄可能是不錯的交易方法

    - 橫盤市場或新趨勢開始：結論同第二點


    走到這一步，更常出現的情況是真正交易後不久，新進交易人很快就掉進90%的賠錢組，很快地離開市場，因為他們不想花錢填無底洞，或者在養成壞習慣後繼續強迫交易。紙上模擬操作等於是站在一個不知終點線在哪裡的起點，只能任憑命運擺布。


    回測紙上模擬操作賦予新進交易人真實的能力，能夠回溯檢查過去可能執行的每一筆交易，觀察它們在上升、下跌或橫盤趨勢市場中會有什麽樣的表現。等於是在起點線就能看清楚前頭的交易路上每個轉彎之處的情況，也知道自己的表現會如何。一旦懷有信心，而且對所做事情相當放心，他們就應該繼續去做（重複獲得成功），而且每隔兩三年左右，將

    '
  merge: 1
- raw:
  - '[PAGE 389]


    方法「往上微調」。

    這絕對是我給本書讀者最好的忠告。交易要變容易，或者變困難，全在乎自己的選擇。衷心祝福本書讀者交易成功。

    布萊恩·沙德


    但願你已經把布萊恩的忠告聽進耳裡。不要盲目一頭栽進交易之中。傾聽布萊恩的簡單訊息——設法了解你的方法能做什麼，而且在交易生涯之初，越早做越好。大部分交易人都是比較晚才做，等市場告訴他們應該早就知道的事：他們的策略並不具有真正的優勢。所以布萊恩建議你投入金錢到市場之前，測試和設法徹底了解你的交易方法。他鼓勵你利用今天市場上買得到的交易軟體去做測試工作。越早做越好。布萊恩言下之意，如果你還沒有購買適當的軟體，那麼你應該現在就去找，不要吝惜投資。你應該騰出心力，盡快去學習系統的發展模塊。


    喜歡自由裁量型交易的讀者可能會說這段忠告不適用於你，因為以自由裁量為基礎的事難以量化。我要說的是，電腦能辦到的事，會令你驚訝不已。


    我的基本信念是：如果‟你能想到某個觀念，那麼就能將它寫下來。如果能將某個觀念寫下來，那麼通常能將那個觀念寫成程式。如果不能，那通常是因為觀念的描述還不夠清楚。


    請不要用「我太老了，學不來如何將觀念寫成程式」當藉口！想在市場上成功，就必須認真以對，在金錢、時間和心力上做必要的投資。不要偷懶，不要對方法在市場中的期望值無知。


    布萊恩的聯絡網站：www.schadcommodity.com。'
