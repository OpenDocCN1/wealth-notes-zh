    圖2.2 六大成功交易通則


    解，為何會有那麼多交易人賠錢——他們幾乎是從交易的實踐開始著手，而這應該是最後一件事。


    圖2.2概述每項通則的內涵。正如你所見，要成為成功的交易人，待辦事項繁多。對許多人來說，這項工程太過困難，但是對願意投入努力的人而言，它代表一條定義清楚的成功之路。


    下一章我會先談第一項成功交易通則，並以此展開交易程序。


    ## 第3章


    ## 第一通則：觀念的準備


    我們要先談成功交易的第一通則：觀念的準備。這個階段能幫助你衡量自己的交易決心。如果你還沒準備好接受本章介紹的觀念，你就不應該交易。如果你不認為自己準備要聽這些觀念，那麼在你還領先的時候，應該斷了交易的念頭；這樣代價低得多，也遠遠不會那麼叫人失望。


    準備這個原則，要求在你考慮交易之前，必須先思索下列各個觀念，以及接受每一觀念的後果：


    - 接受最大逆境

    - 掌握情緒定向

    - 承認賠錢遊戲

    - 認清隨機市場

    - 最優秀的輸家，贏！

    - 注重風險管理


    - 尋找交易夥伴

    - 設定財務邊界


    現在來談每一個觀念。


    ## 接受最大逆境


    最大逆境是市場的首要準則，意思是：市場會做它必須做的事，讓大多數交易人失望。這一點，你永遠都不應該忘記。


    且讓我再說一次：市場會做它必須做的事，讓大多數交易人失望。它會把每一個可能的障礙，丟到你要走的路上。雖然交易相當簡單，卻也不容易。最大逆境會盡其所能，讓交易盡可能變得困難，使你懷疑自己的每一項行動、每一筆交易是否正確。


    最大逆境是市場施加於所有參與者的紀律。市場透過最大逆境，確保金錢總是從大多數人，也就是弱者手中，轉移到少數強者手中。拜託，如果交易真有那麼容易，每個人都會來賺一筆！


    遺憾的是，大多數交易人總是等到為時已晚，才學會這個準則。但是，要成為存活的交易者，你必須承認它、理解它、順服它。否則，你的交易將自取其敗。


    不要忘了那句老話——如果某件事聽起來好得不像真的，它可能就……？（答：不是真的。）交易也是如此。如果某個特別的交易觀念聽起來好得不像真的，或者某個模擬淨值曲線看起來太過平滑，不像真的，或者某個繪圖程式讓交易看起來太過容易，不像真的，那麼它可能就不是真的。但是，不知道有最大逆境的大多數交易人，會相信他們聽到、讀到、看到的。只有透過經驗和養成健康的懷疑態度，人們才會開始客觀探討這些好得不像真的交易觀念；這些好得難以置信、格外平滑的淨值曲線；以及這些好得不像真的繪圖程式。只有透過經驗和實際去做，他們才會發現最大逆境的作用，最後終於了解，這些觀念、格外平滑的淨值曲線，以及出色的繪圖程式，確實好得不像是真的。


    最大逆境也在市場中運作。如果走勢圖出現看來顯然應該進場交易的訊號，最後的下場卻是賠錢，請不必驚訝。


    最大逆境明白告訴新手交易人：市場不會讓他們輕易得逞。閱讀和研究新的交易觀念時，務必時時銘記這點。考慮購買新繪圖程式、新交易系統，或者參加交易研討會或研習班時，務必牢牢記住這一點。研究、回溯測試（back
    testing）以及正確驗證某種交易方法時，你應該銘記最大逆境。研究走勢圖，以尋找下一個交易機會時，你都應該牢牢記住。


    因為有最大逆境，對於交易成功很簡單、龐大的利潤等著每個人去拿等所有觀念和說法，你都要保持警覺之心。因為有最大逆境，你在看走勢圖，尋找下一個交易機會時，必須保持警覺。因為有最大逆境，你在看新交易市場，或者開立交易帳戶以利用新交易平臺的廣告時，要保持警覺。因為有最大逆境，你在閱讀分析師強烈的看法和強烈的意見時，務必保持警覺。要小心那些似乎擁有所有答案的分析師。


    因為有最大逆境，你的交易人生生活絕對不致像廣告上說的那樣。交易人的生活不會像你看到的那些陽光燦爛的畫面，如舒服愜意地在棕櫚樹下曬太陽，拿著筆記本型電腦做交易。最大逆境會盡其所能，使你在交易世界盡可能坐立難安，感到洩氣而想放棄當交易人。最大逆境會確保你的交易世界痛苦不斷。它會使你的交易變得很難、更難，還要再難。最大逆境讓交易十足像個新兵訓練營。它會讓人感到絕望。最大逆境會使你的交易陷入許多級百分之百的傷害。最大逆境會確保你深陷痛苦中。當你賠錢，你覺得受到傷害。


    當你賺錢，你會想如果在市場待久一點，可以多賺多少錢。當你想到放任它溜走的金錢數量，你會心痛。當你花了很多時間和精力，研讀一個似乎很有道理的交易理論，卻行不通，最大逆境會確保你痛苦萬分。當你花了很多錢在你認為信譽卓著的研討會和講習班，卻因為利用學到的觀念執行交易而賠錢，你會感到痛苦。當你花了很多時間和精力，研究、發展、設計程式、測試和驗證一個新觀念，它卻不可行，你會覺得痛苦。儘管你在許多年內花了無數的時間和精力，改善你擁有的優勢，卻沒辦法改善，你會因此感到失望和痛苦。當你退出市場，尋找和等候下一個交易機會，最大逆境會確保你覺得自己可能會錯失下一個大波動，因此感到焦慮和痛苦。如同我所說，最大逆境會確保你的交易世界充滿痛苦和傷害。


    面對最大逆境，你必須對自己所有的行為負起百分之百的責任；你應該預期，在每一個轉彎之處，你會遭到市場的伏擊；你應該學會預期始料未及的事！面對最大逆境，你應該現在就決定自己是否有毅力和耐力，接受交易人的悲慘生活，儘管可能在財務上有所收穫。


    ## 掌握情緒定向


    要成功交易，情緒定向（emotional orientation）格外重要。它與交易的兩個基礎領域相關：目標和期望。


    如果你你的交易目標是賺錢，或者交易時總是做對事，那麼十之八九會失敗。如果你你的期望是從交易賺很多錢，那麼十之八九不會成功。


    雖然有些交易人可能會偶爾達成那些目標，但是長期而言，他們很難在不提高風險到危險地步的情況下維持。請記住，你永遠逃不掉風險／報酬取捨這個古老法則——你想要越多的報酬，就必須承受更多的風險。除非你能做到我所說的「情緒定向」，否則你會發現成功很難。


    當你開始夢想成為完美的交易人，對不切實際的報酬懷抱期待，你的情緒就會迷失方向。如此一來，你不只讓自己暴露在不可能實現的目標和不可承受的風險中，也對自己的交易寄以太多期望和壓力。


    ## 以管理風險資本為目標


    信不信由你，賺錢或者做得正確，沒那麼重要。這是大部分交易人直到為時太晚才學會的事情！要成功，交易人需要調整他們的想法。如果你進場交易時，一心只想著贏，投入無數的資源和精力，思考如何擊敗市場，這會蒙蔽你的雙眼，除了戰勝市場，看不到其他任何交易目標。


    大多數人，尤其是交易人，喜歡競爭，尤有甚者，他們喜歡贏。但是，要贏，就要做對。人們本能上想要買到正確的車子、正確的房子、正確的保單。他們想為孩子選到正確的學校、正確的股票投資、正確的樂透彩券號碼，以及勝出的馬匹。


    遺憾的是，渴望贏、正確，正好和從交易中賺錢背道而馳。稍後在我討論正期望值時，你會知道，贏只占公式的一半而已。想贏是錯的。單單聚焦於贏，交易人就已看錯方向——他們在情緒上迷失了方向。


    贏顯然是好事，但將贏當成主要目標，既不適當，也迷失方向。如果希望成功，你的交易目標應該是管理風險資本（risk capital）。管理風險資本會擴大目標和責任，讓目標從短視的一心想贏，提升到保守且專業的水準。管理風險資本，能讓你遠離靠贏賺一大筆錢的目標，轉向一致、明智且持久的交易。一旦你能訂下這個目標，你在建立情緒定向方面，就完成一半的功課。公式的另一半和你的期望有關。


    ## 建立溫和的期望


    不切實際的期望和沉迷於獲勝是雙重之害。兩者合力嚴重破壞你的情緒定向。舉例來說，如果你的期望是賺一大筆錢，那麼你的交易十之八九會失敗。想要永續成功，最重要的是抱持溫和的期望。期待賺到20%到30%的報酬率，和150%或更高的報酬率比起來，達成的可能性高得多，挑戰性則低得多。大部分人會賠錢，是因為他們想要更多。這就是人們一直以來所說的貪婪，或者不切實際的期望。


    人們通常把交易和賺錢聯想在一起——交易越多，賺進的錢也越多。我以為，這就是「更多的交易等於更多的金錢」現象，是善於畫餅的商人和編織財富夢想的交易推銷員所創造（或至少強化）的概念。所以許多交易人投入市場交易時，都帶著「活動偏見」——以為更多的交易和更多的活動，代表更多的金錢。我稱這是「由上而下」方法。這種活動偏見會制約交易人想要更多，而想要更多，會製造不切實際的期望。


    這種「越多最好」的哲學，不斷提升標準，並且製造自行持續的貪婪效應。這種貪婪，使得交易人有如脫疆野馬，即使你有穩健的交易計畫，能讓你即時賺到不少錢，但「越多最好」的先入為主之見，卻使得交易人很快就對他們擁有的感到厭倦，或者認為他們可以做得更多。在這個階段，交易人對於他們的交易和贏的方法寄以更高的期望，因而調弄他們原來贏的方法，最後導致自取其敗。


    我花了很長的時間，才發展出溫和的期望，但我還是三不五時在掙扎。利用我的模式，可以發現，只要將承受的風險提高一點點，就能輕而易舉使我的報酬率增為兩倍或三倍。令人驚訝的是，當我控制期望，交易實際上反而變得更容易。我對自己所用方法的表現感到滿意，而且不論時間好壞，都繼續採用。


    要達到情感定向，對交易要有溫和的期望。要做到這一點，就需要接受我所說的「由下而上」法，摒棄「由上而下」的幻想。


    「由下而上」法是指觀察分配於交易的風險資本，然後自問：「未來十二個月，風險資本達成多少報酬率，我會很高興？」或者「回頭檢討過去一年，什麼樣的報酬率會令我感到滿意？」


    數十年來，全球股市每年的平均報酬率似乎在8-12%之間。所以若想用風險資本賺到高於這個數字的報酬率，還算合理。現在想想，十二個月後你回頭檢視報酬率時，會對怎麼樣的風險資本報酬率感到高興？是20%或30%的報酬率？我個人只希望風險資本的年報酬率在20%到30%之間。對我來說，這個報酬率合理可行——最困難的是如何持續達成這個數字。


    如果你真的想要在交易上成功，就應該發展一套穩健的交易方法，可以在多年內，年復一年，持續不斷賺到平實的報酬率。如果你所用方法的績效顯示目標可以實現，那麼你應該感到滿意，不要操弄它。你不應該認為必須靠每天交易，風險資本才會有不錯的報酬。如果你採行「由下而上」的交易方法，你會發展出溫和的期望，達成你的情緒定向。


    如果你能藉著設定溫和期望的專業目標，在情緒上自我定向，你會發現，發展一套穩健的方法容易得多。此外，一旦你做到這一點，你會滿意它的績效，並且不管市場狀況好壞，繼續用它去交易。如果你能達成這個目標，成為成功交易人的任務就會容易許多！


    ## 承認賠錢遊戲


    接受交易是輸家遊戲的這個事實，是準備工作的一環。不要試著說服朋友相信你會是成功的交易人，因為機率對你嚴重不利。你也應該把我的「90 × 90」法則放在心上：90%的交易人會在90天之內失去風險資本。


    你不只可以讓朋友和同事知道，你追求的目標很困難，還可以加上時間因素。準備階段的你要清楚了解，選擇積極交易，等於踏進輸家遊戲。


    ## 認清隨機市場


    在準備階段，交易人也要接受市場基本上是隨機的事實。生意人的行銷炒作如果有不一樣的說法，你應該置之不理。


    由於針對市場行為有許多預測理論，例如週期、艾略特波浪、市場概況、季節性和甘恩等等。你認為有可能預測市場，這個想法可以理解。但事實是，就持續一致的統計基礎來說，我們不可能預測市場的走向。請注意，成功的交易人懂得這一點，而且他們是因為知曉如何因應市場的走向而賺錢；他們沒有嘗試去預測它。


    總之，你應該接受市場雖然不是處於完全隨機，但基本上是

