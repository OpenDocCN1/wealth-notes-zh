    除非是相信市場已經找到支撐，否則為何要買？除非市場遇到阻力，否則為何要賣？聽起來直截了當，不是嗎？可是許多交易人卻卡在他們特殊選用的分析領域中（艾略特波浪、甘恩、幾何、蠟燭、電腦系統、星象、季節性、背離等等），以致於忘了目標——尋找市場可能在哪裡找到支撐或阻力。


    務必經常抬頭，目光離開分析，看看更大的畫面——市場是否就要走到潛在的支撐或阻力？就是這麼簡單。我會在第9章回頭深入討論簡單性，並舉些例子說明。


