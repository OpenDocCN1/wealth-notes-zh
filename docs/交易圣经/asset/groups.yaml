    何策略，讓它能將災難性虧損處理得更好。


    但是，固定比率不是處理漫長的連續虧損交易的最好策略。它和固定百分率不同，無助於管理單一交易的個別風險，而是期望接收所有訊號。此外，它不允許在長期的一連串虧損交易期間，降低金額風險。在滑落到較低的合約水準時，只能縮減合約口數。除非你加快減少合約口數的速率，否則固定比率會以比較緩慢的速度，縮減和降低每筆交易的金額風險。


    雖然檢視每種策略如何在災難性虧損之後存活下來，是個有用的做法，但它並沒有真正反映交易人和資金管理策略經常身處的一般市場狀況。最有可能出現的情形是，你會經歷一長串的虧損交易，而不是發生災難性虧損。如果是這樣，威廉斯固定風險、固定百分率以及固定波動性會優於固定比率。因為它們是極小化破產風險的最佳策略，而這正是為什麼專業交易人偏愛選擇固定百分率的原因，因為它在這方面表現最好。


    ## 最大合約限制


    我為每種策略能夠交易的最大合約口數設定了上限。這是要讓分析更為務實。這種做法的缺點是限制了每種策略的全部潛力。這項限制對每種策略的成果產生顯著的影響。舉例來說，大部分金額賠償的規模類似，因為它們發生在大部分策略已經到達100口合約的限制，或者正交易100口合約時。因此，這項限制消除了大部分策略在金額賠償上的任何差異，掩蓋了你可以學到的任何真實資訊。因此，我認為最好是從許多個不同的角度，觀察它們的績效。


    ## 到達合約限制的速度


    表8.15顯示每一種策略能以多快的速度到達100口最大合約限制。


    如圖8.15所示，固定單位率先到達100口合約限制，在26%的資料樣本集時達成。如果你尋找的是最激進的策略、以最快的速度累增合約，那麼可以考慮使用固定單位。如果你格外保守，並且偏愛延後擴增部位規模，那麼可以考慮固定波動性，因為它到達合約限制的速度最慢，在76%的資料樣本集時達成。如果你偏愛比固定波動性更快，但比固定單位慢，你或許可以選擇使用威廉斯固定風險或固定百分率為你喜愛的資金管理策略。


