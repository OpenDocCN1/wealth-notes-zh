    # 理查·麥基


    理查·麥基（Richard Melki）是個成功的自由裁量型交易人，經營自己的絕對報酬基金。身為自由裁量型交易人，理查的風格被稱為全球宏觀（Global Macro）。這表示理查的交易任務沒有界限。他是個無拘無束的交易人，能夠基於任何理由，在任何時間進出任何市場。如果理查相信某個交易格局正在發展，他就會去交易——不管工具、市場、地理位置為何。


    理查可能是最優秀的自由裁量型交易人之一。2008年的全球金融危機期間，獨立的研究機構澳大利亞基金監控（Australian Fund Monitors）將理查排在他所屬策略類別的第二名。


    理查的出色表現是意料中事，因為他的整個生涯都在市場、交易和投資打滾。理查曾經是機構自營交易員，當時大部分時間為澳大利亞的商業銀行交易，信孚銀行（Bankers
    Trust）是其中之一。當時信孚令所有的市場參與者艷羨。


    身為自由裁量型交易人，理查很少使用技術面分析和技巧以支持他的交易。理查依賴本身對全球宏觀經濟事件的解讀和對市場流動的知識，支持他的交易決策。


    此外，理查也是我交情最久的摯友之一。我們1983年認識，當時都在大學主修財務。1983年12月我放棄榮譽學士學位課程，到美國銀行工作，理查則取得榮譽學士學位，1986年進入澳大利亞工業發展公司（Australian
    Industry Development Corporation）服務。這是官股占一半的商業銀行。'
  - '[PAGE 366]


    理查身為純自由裁量型交易人，不偏愛任何特定的技術面技巧。我個人認為他是特立獨行的交易人，依賴自己的「頭腦」和直覺去交易。他是難得一見之的天之驕子，擁有罕見的天分和能力，能在監控多個市場時，吸收消化許多經濟變數，然後抽絲剝繭，做成是否進場交易的清晰二元決策。他接著使用技術面，抓取進場時機。他是我所認識最優秀的經濟分析師。如果
    Enlightened 你認識理查，你會對媒體上佼佼而談的經濟學家置若罔聞。


    話說從頭。1986年，理查進入AIDC當實習自營員。理查從一開始就一直是自由裁量型交易人，設法正確解讀基本面經濟的地貌，並且運用技術面工具，抓取進場時機。二十三年來，理查真的沒有改變——除了越做越好之外。那時候，理查透過路透（Reuters）和Telerate接收經濟新聞與走勢圖。1988年，理查在AIDC主管衍生性產品，並且成為它的自營員。他的成功很快就為市場所知，沒多久被挖角到信孚銀行。1995年，理查離開信孚，自己交易，追求個人的投資利益。


    2000年，他創立自己的絕對報酬管理事業，管理外部基金。理查現在交易超過二十四年。他能不費吹灰之力，毅然決然放棄特定的市場看法、停損出場、一百八十度反轉建立部位，讓我驚異不已。理查做錯時，他心知肚明，而且不會因為對特定狀況的分析出錯，浪費任何失去的自尊。我們大部分人對於虧損，總是沮喪不已，並且責怪自己分析錯誤，可是這對理查來說是家常便飯。他將虧損拋諸腦後，繼續尋找下一個機會。


    理查另一件有趣的事，是身為自由裁量型交易人的他，非常尊重系統型或機械型交易人。自由裁量型交易人通常對系統型交易人嗤之以鼻，相信市場絕對不會那麼簡單，不管是指標或量化表達式，都不可能使用數學演算法，賺取可靠的利潤。他們相信'
  - '[PAGE 367]


    弱式效率市場假說（efficient market hypothesis），也就是無法用過去的價格走勢，預測未來的價格走勢。所以理查十分敬重系統型交易人，是十分罕見的事。


    理查在信孚的鼎盛時期加入成為自營交易員，親眼觀察機械型交易的運作。信孚在極盛時期，自營交易員是在同一張辦公桌工作的，理查是其中之一。不過，並不是所有的自營交易員都相同。有個人要求兩個年輕的畢業生不斷監控市場，一個上白天班，另一個上晚班。他們的工作是執行這位自營交易員所下的每一張委託單。理查在信孚的時候，這位自營交易員年年都是最優秀的。他用一台個人電腦跑系統性交易程式，全年無休，監控全球市場，產生買進和賣出委託單，然後交給年輕的畢業生去執行。理查在信孚時，利用機械型交易程式操盤的自營交易員表現最為突出，理查因此很敬重機械型交易。


    順帶一提，其他的自營交易員沒人知道這套程式在做什麼。這是信孚內部嚴密保守的秘密。但是每個人都知道這是國際西洋棋冠軍理查·法利（Richard Farleigh）設計的。他在信孚內部備受尊崇。法利在信孚表現非常出色，後來被挖角去百慕達操作一支避險基金，並在34歲那年退休，後來遷居蒙地卡羅。你可以在法利所寫的《馴服雄獅》（Taming
    the Lion）一書讀到更多他的故事。


    身為自由裁量型交易人，理查樂於在多個時間架構執行交易，從當日沖銷交易到短中線都有。理查極少抱牢長線部位。雖然理查不受限制，可以愛交易什麼就交易什麼，但在本書撰稿時，他偏愛交易股票指數、利率、商品和貨幣市場。他偏愛的交易工具是期貨和選擇權。如果看到好機會，他也交易澳大利亞股票。理查會閱讀所有的經濟報告。至於技術面，他會綜合簡單的'
  - '[PAGE 368]


    趨勢線突破、簡單的型態辨識、背離和動量變化。


    在交易之外的時間，理查樂於埋首閱讀傳記，渾然忘我，惹得妻子佩塔（Peta）不悅。理查有強烈的宗教信仰，在教會中很活躍，是澳大利亞、紐西蘭和菲律賓安設辰東正教大主教管區（Antiochian
    Orthodox Archdiocese）的理事。理查和家人住在澳大利亞雪梨。現在就來聽聽理查的忠告。


    我叫理查·麥基，是RTM絕對報酬基金（RTM Absolute Return Fund）的執行長。


    自1986年以來，我就在主要的資產類別十分活躍，而且每一年的交易都賺錢。這段期間，我經歷（也活過）了市場驚天動地的混亂時期，如1987年的股市崩盤、1997年的亞洲危機、1998年長期資本管理公司（Long
    Term Capital Management）的崩解、九一一恐怖份子的攻擊，以及現在的全球金融危機。此外，我建立起二十幾年連續不斷的交易生涯，沒有在交易幾年之後就灰飛煙滅。


    布倫特的問題直截了當。但我交易成功的關鍵，是根據我的資本管理系統和交易計畫，不單單只有一件事。身為自由裁量型全球宏觀交易人，我面對排山倒海而來的資訊、市場觀察和技術面分析。這些變數取得一致，攸關我的交易決策，而決策的執行，有賴於我的資本管理系統。在這段簡短的說明中，我會試著概述我所用的策略，而不是單單一個忠告。不管我是從短線或長線的觀點交易，還是交易股票、固定利率或者貨幣市場，最重要的事，是保有務實的期望、穩健的資本管理系統，以及適用於所用時間架構的交易計畫——不要試圖在頭兩三個月內就達成你的目標，因為這只會提高炸'
  - '[PAGE 369]


    毀的機率，你應該把每一個月看成是邁向目標的踏腳石。我的交易計畫相當簡單，而且這些年來，我發現最成功的交易人使用的交易計畫沒有那麼複雜。身為自由裁量型交易人，我每天被不計其數的經濟資料轟炸。我的交易方法有賴於前瞻的經濟資料和模式，結合技術面和市場觀察。市場統計數字和時機也在我的交易風格中扮演關鍵角色。舉例來說，零售業銷售額是我追蹤的一個重要經濟變數，但對我來說同等重要的是存貨相對於銷貨的比率和庫存水準。製造業
    ISM 指數是另一個重要的經濟變數，但指數中的生產和新接訂單等細類同樣重要。我的交易方法也納入市場技術面、統計和時機觀察，以及市場人氣。這是市場告訴我的事。所有這些變數取得一致，是我所用交易方法的關鍵。


    我的資本管理系統貫穿所有的交易決策。這可以確保保本、生存和資本高效率配置。資本管理系統有一部分很重要，那就是不斷提醒自己：不是每一筆交易都會獲利。事實上，大部分交易都會賠錢，所以關鍵在於管理虧損和獲利交易出場的方式，確保整體期望報酬總為正值。在一筆交易進場和出場時，為了將滑價降到最低，我只在流動性高、不受政治操弄的市場（有些貨幣可能發生這種事）交易。


    心理面的韌性對交易人很重要，因為虧損是這場遊戲的一部分。邁開步子往前走，切勿過分執著於虧損或回補虧損。幾乎每一天都會有機會現身。但願我提出的小小意見，對讀者有幫助。


    理查·麥基


    哇，理查的話絕對超過我的預期！如果你偏愛以自由裁量的'
  - '[PAGE 370]


    方式交易，那麼理查已經給你寶貴的機會，管窺他的經濟劇本，也就是他注意的基本面統計數字。理查非常慷慨，和你分享他的交易計畫，而這套交易計畫，在過去二十四年，讓他每一年交易都賺錢。理查覺得他沒辦法單單提供一個忠告，所以簡單扼要彙總了他所做的事。對他來說，重要的是見到他的前瞻經濟變數和市場的價格走勢取得一致。理查總是試著掌握獲利的勝算在他那一邊。他強力主張採用資本（資金）管理，並且學習如何忽視可能令交易人分心的市場日常雜訊。


    這些智慧之語，出自一位成功的交易人；他有連續二十四年獲利的紀錄，十分罕見且令人িঠ美。


    遺憾的是，我沒辦法給你他的聯絡網站。如果他的想法引起你的共鳴，我建議你把他的話影印下來，放在顯示器上方，時時提醒自己，一位自由裁量型交易人如何在市場取得成功。


    # 傑夫·摩根


    傑夫·摩根（Geoff Morgan）是我的好朋友和導師。他把我推上交易成功的正途。傑夫教我以不動感情、百分之百客觀、冷靜、超然物外和合乎邏輯的方式觀察市場，因而引我入門，認識使統計勝算對自己有利的重要性。


    當時，我是艾略特波浪的信徒，交易SPI。傑夫是和我往來的那家經紀公司的顧問。那些年，我打電話給我的顧問時，曾經多次和傑夫講過話。雖然我們經常談話，卻沒有真正聊到市場。


    有一天，我因為成交一筆交易再度發生虧損，對自己的交易又覺得沮喪，而打電話過去。在我看來，我似乎缺乏勝招。我的顧問剛好外出吃午餐，所以是傑夫接的電話。我問傑夫委託單'
  - '[PAGE 371]


    的撮合狀況，並首次請教他的意見，問他認為SPI會往哪裡走。傑夫冷靜地表示，SPI已經連續三天收高。他接著根據他對SPI統計價格波動的了解，指出由於SPI已經到達它的中位數，往上走，根據連續收盤的狀況，如果是他，會不太想買。相反的，他會尋求放空的機會。接下來幾天，SPI遲滯不前，而且價格越走越低。這時，我彷若當頭棒喝，靈光乍現！從那一刻開始，我開始從自由裁量型的預測者，轉型為機械型務實主義者；從依賴自己對艾略特波浪的主觀解讀，轉為依賴觀察百分之百客觀的重複價格型態。所以我要說，謝謝傑夫指引我看到那道光。


    大部分人沒聽過傑夫的大名，因為他極其低調。他是私人交易人，只為自己和家人交易。他不教導別人，不寫書，不在交易展覽會上發表演說，也不開講習班。


    我個人何其有幸，認識了傑夫，得到他的指導。我也何其有幸，他同意參與這本書。請不要因為沒聽過傑夫這個人，或者他像我只是個私人交易人而感到失望。傑夫和本書中的許多市場大師一樣，是個原創性的市場思想家，而且很講邏輯。談到市場，傑夫在邏輯、意識、和智識上十分嚴謹。他不只聰明，而且有一種獨特的天賦，能以簡單和合乎邏輯的方式解釋各種觀念。他就像你會希望所有學科都被他教到的老師。他非常擅長於教導別人，我給他取的暱稱之一是「教授」，另一個暱稱是「TG」，即「交易人傑夫」(Trader
    Geoff)。


    我經常和傑夫及其他三位全時交易人共進晚餐。傑夫和我都是私人交易人。其他人則經營他們自己的絕對報酬基金，各自管理數億美元的機構和私人資金。其中一人是你已經見過的理查·麥基。另外兩個人是兄弟，我也邀請他們參與本書，因為他們的故事和成功真的激勵人心。但是，雖然對於受邀一事受寵若'
  - '[PAGE 372]


    驚，他們卻拒絕參與，因為他們的重心放在機構市場，不是可能讀這本書的私人交易人。


    總之，我們經常一起吃飯，並且閒聊市場。最常促使我們動腦思考，並且給我們較多「啊哈」時刻的人，就是傑夫。他就是擁有驚人的洞見，以及出乎意料之外的市場觀點，而且他的解釋聽起來總是那麼合乎邏輯、簡單且明顯。關於市場，他有時會讓你自覺不足，不過是以盡可能溫和的方式。


    所以，雖然傑夫沒沒無聞，請了解他是個成功的私人交易人，擁有令人艷羨的交易紀錄，而且他有機構般的市場智識。


    現在你比較了解傑夫是什麼樣的人，且讓我談談他的背景。傑夫從很小就對風險評估感興趣。大約14歲那年，他經常到賽馬場，學習如何計算概率，好贏過賭馬莊家。1970年代，他攻讀土木工程，兼差當見習土木工程師。在他念書的時候，傑夫繼續賭博。單靠計算概率，他就能貼補收入，整體而言贏過賭馬莊家。他贏的錢助他完成大學學業。


    因此，傑夫從二十出頭起就了解市場——不管是賽馬賠率，還是交易。他知道，箇中竅門都只是找到統計上的優勢，以及掌握利用它。他能夠做到這一點，是因為他擁有一顆非常重視邏輯和懂數學的頭腦，他攻讀土木工程時，靠的也是這個。我也見過他寫了一本沒出版的書，談如何靠計算和玩弄概率，贏得西洋雙陸棋！寫這本書的動機，來自他看了一位世界西洋雙陸棋冠軍寫的一本書。他在書中見到一種策略似乎相當矛盾，可是傑夫很快就知道那是基於概率的一種優勢。我不是說過傑夫很聰明嗎？


    赴海外旅行之後，他沒有重回工程本業，而是改變方向，錄取了電腦分析和程式設計課程。他很快就在保險業找到分析師／程式設計師的工作。'
  - '[PAGE 373]


    1985年，傑夫開創自己的事業，專門替保險業發展風險評估軟體。這項事業經營得非常成功，1989年，傑夫將它賣掉，還清抵押貸款，然後再次改弦易轍。他唸完財務顧問的課程，成為有執照的財務顧問。這也給了他atorio在市場上追求興趣的資本。


    傑夫和許多市場新人841一樣，一開始並不是以自由裁量的方式交易，而是建立機率模式，給他進出市場的一個機械型程序。初步取得若干成功之後，傑夫很快就了解，市場遠比他懂得的，有更多的東西要學習。因此，傑夫決定從內而外把它摸個透徹。所以他開始和一家老字號經紀公司建立關係，後來更以領有執照的期貨經紀員的身分，和一位顧問共事。傑夫並沒有把他的角色視為工作，而是從內部學習真正的市場知識和交易專門知識，並觀察、傾聽、向經紀員和顧客學習的機會。結合這個實務經驗和他知性上對數字的熱愛，傑夫因此能夠利用他的程式設計長才，調查和研究各種交易策略。沒多久，傑夫就成功發展出波動性突破策略，造福自己和他的客戶。


    1995年，傑夫離開經紀業，專心全時交易。今天，傑夫繼續交易，一如在1995年那時，只是現在以更為自由裁量的方式執行交易。傑夫會往中期趨勢的方向，以型態為基礎的波動性突破去交易。傑夫會當日沖銷期貨，也會短線交易股票，持有交易三到十天。至於期貨交易，傑夫喜歡交易歐元／美元和澳元／美元的貨幣對和SPI。股票交易方面，本書撰稿時，傑夫正交易在澳大利亞證券交易所掛牌上市的財產信託和黃金股票。


    傑夫沒有交易的時候，通常會找些事做。他最不喜歡呆呆坐著，什麼事都不做，因此在他旁邊，很難放鬆身心。傑夫喜歡翻修房屋——是的，你可以要傑夫離開土木工程業，但抽不走他身上的工科本性。他爭強好勝，喜歡跑步，經常參加8.7哩的「雪'
  - '[PAGE 374]


    梨城市到浪灘馬拉松大賽」（City to Surf）。他喜歡解難解的填字遊戲、數獨，也愛旅行。傑夫還寫了一套解答數獨的邏輯程式。令他太太溫蒂（Wendy）氣惱的是，傑夫太講邏輯、太爭強好勝，有時太專心致志，很難和他共同生活！傑夫和他家人住在澳大利亞雪梨。現在我就來請教傑夫的一段忠告。


    我自 1989 年起開始交易。

    這段期間，我只賠過一年。

    布倫特第一次開口要我參與本書時，我受寵若驚。

    但是，我想得越多，就越發現一個哲學上的問題——我是交易人，不是教育家。期貨交易是「淨零遊戲」（zero net game），也就是說，如果我賺錢，就會有人賠錢。為什麼我要別人停止賠錢？


    傑夫．摩根


    我必須說，這不是我要的那種回應。我在外出度假時收到傑夫的回覆。我起初對傑夫講的話感到失望。我覺得這不慷慨，也不認為這些話反映了傑夫慷慨的本性。但是後來我想想，我們相識二十年，可能我誤將他對我的慷慨，以為他對任何人都那麼大器。總之，我對傑夫道謝，說等我回國和他聯絡。雖然我感到失望，卻也看出他的論點不無道理。他為什麼要幫助你，降低他獲利的前景？雖然我覺得他的話有點薄弱和小家子氣，卻也不是沒有道理。雖然他表現得很強硬，但也相當誠實而合理。如同傑夫所說，他不是教育家，而是交易人。


    總之，我度假回國後，打了電話給傑夫。我們談了很久。傑夫正等著我大發脾氣，因為他曉得自己寫的東西不是我真正想要'
  - '[PAGE 375]


    的。我同意傑夫的看法，我承認說我相當失望，但接著表示我能理解他的說法。不過，我不想讓傑夫這麼輕易脫身，我想要他說更多，因為我知道他很特別，而且我知道交易人需要認識他和他的想法。


    你噓得，不是所有的成功交易人都有很高的知名度。不是所有成功的交易人都曾經贏過交易冠軍賽。有些最優秀的交易人，就像傑夫那樣，是私人交易人，不在公共競技場上亮相。他們不管管理機構的資金。他們是私人交易人，想要保持隱密。既然我認識傑夫，所以我有機會將他從隱藏的地方拉出來，好讓你知道不是所有成功的交易人都在公開的領域有很高的知名度。我決心將他拖進鎂光燈底下，讓你知道有成功的私人交易人這回事。


    所以我堅持自己的論點，說我並不是要求他當教育家，而是要他以交易人的身分，對有志於此的交易人提供一段忠告。我們你來我往，唇槍舌劍，各說各話，直到傑夫退讓。當傑夫重新提起一段往事時，我打斷他說，有抱負的交易人需要知道他剛剛說的。那是一個有力的故事，和他當經紀員的時候有關。那是來自「內部」的故事，蘊涵有力的真理，我希望傑夫能和讀者分享。以下就是傑夫的分享。


    起初，我要說的就是前面那些，但在和布倫特長談之後，他說服我應該多說幾句話。


    從1991到1995年的五年期間，我是期貨經紀員。在我發展出自己的市場知識和交易技能之後，交易和經紀之間的衝突，交易勝出。但是這五年，我對交易、交易人和自己學到最多。


    我們那家小型經紀公司，往來的都是零售賭客（講得好聽一'
  md: '

    可以觀察價格活動，衡量他們的意見。這個行為發展出三個重要的基本關係。

    第一個基本關係是穩定的支撐和阻力。我們在走勢圖上用水平線畫出來。第二個基本關係是動態或發展中的支撐和阻力水準。我們在走勢圖中以傾斜的趨勢線畫出來。第三個基本關係是在交易人和投資人之間。我們使用顧比多重移動平均數（Guppy
    Multiple Moving Average）去了解和分析這個關係。這些是我了解市場的基礎，因為它們告訴我其他人是怎麼想的。

    謙卑意味著我接受走勢圖和價格行為型態所產生的訊息。有時候，我認為市場錯了。它不應該下跌。我已經學會，如果我的意見與市場價格行為相左，就要忽視自己的意見。謙卑意味著我會傾聽走勢圖說的話。當你傾聽，就能聽到錢在講話。所以我的一段簡單忠告就是這樣。在市場中保持謙卑，市場就會獎賞你。


    戴若 · 顧比


    謙卑。如此簡單，如此微妙，力量卻那麼強大。這是個很棒的忠告，因為謙卑通常是交易人最後才學到的情緒，而這時已經付出慘重的代價。人們到市場中交易時，通常滿懷信心、精力、熱情，以及因為年輕而不經意的傲慢。然後，透過市場的最大逆境，我們付出荷包、心靈、驕傲和自負的代價，學會我們在全知且不斷變化的高超市場腳下，永遠不會是受人尊重的學生。即使一個人擁有豐富的交易知識且十分成功，一旦停止傾聽市場，一切都會化為烏有。保持謙卑，會確保你敞開心胸，接受市場給你的訊息，而且如同戴若所說，它會獎賞你做為回報。如果不然，你就會搭上高速列車，邁向失望的終點！


    戴若的網站：www.Guppytraders.com。


    ## 理查·麥基


    理查·麥基（Richard Melki）是個成功的自由裁量型交易人，經營自己的絕對報酬基金。身為自由裁量型交易人，理查的風格被稱為全球宏觀（Global Macro）。這表示理查的交易任務沒有界限。他是個無拘無束的交易人，能夠基於任何理由，在任何時間進出任何市場。如果理查相信某個交易格局正在發展，他就會去交易——不管工具、市場、地理位置為何。


    理查可能是最優秀的自由裁量型交易人之一。2008年的全球金融危機期間，獨立的研究機構澳大利亞基金監控（Australian Fund Monitors）將理查排在他所屬策略類別的第二名。


    理查的出色表現是意料中事，因為他的整個生涯都在市場、交易和投資打滾。理查曾經是機構自營交易員，當時大部分時間為澳大利亞的商業銀行交易，信孚銀行（Bankers
    Trust）是其中之一。當時信孚令所有的市場參與者艷羨。


    身為自由裁量型交易人，理查很少使用技術面分析和技巧以支持他的交易。理查依賴本身對全球宏觀經濟事件的解讀和對市場流動的知識，支持他的交易決策。


    此外，理查也是我交情最久的摯友之一。我們1983年認識，當時都在大學主修財務。1983年12月我放棄榮譽學士學位課程，到美國銀行工作，理查則取得榮譽學士學位，1986年進入澳大利亞工業發展公司（Australian
    Industry Development Corporation）服務。這是官股占一半的商業銀行。


    理查身為純自由裁量型交易人，不偏愛任何特定的技術面技巧。我個人認為他是特立獨行的交易人，依賴自己的「頭腦」和直覺去交易。他是難得一見之的天之驕子，擁有罕見的天分和能力，能在監控多個市場時，吸收消化許多經濟變數，然後抽絲剝繭，做成是否進場交易的清晰二元決策。他接著使用技術面，抓取進場時機。他是我所認識最優秀的經濟分析師。如果你認識理查，你會對媒體上佼佼而談的經濟學家置若罔聞。


    話說從頭。1986年，理查進入AIDC當實習自營員。理查從一開始就一直是自由裁量型交易人，設法正確解讀基本面經濟的地貌，並且運用技術面工具，抓取進場時機。二十三年來，理查真的沒有改變——除了越做越好之外。那時候，理查透過路透（Reuters）和Telerate接收經濟新聞與走勢圖。1988年，理查在AIDC主管衍生性產品，並且成為它的自營員。他的成功很快就為市場所知，沒多久被挖角到信孚銀行。1995年，理查離開信孚，自己交易，追求個人的投資利益。


    2000年，他創立自己的絕對報酬管理事業，管理外部基金。理查現在交易超過二十四年。他能不費吹灰之力，毅然決然放棄特定的市場看法、停損出場、一百八十度反轉建立部位，讓我驚異不已。理查做錯時，他心知肚明，而且不會因為對特定狀況的分析出錯，浪費任何失去的自尊。我們大部分人對於虧損，總是沮喪不已，並且責怪自己分析錯誤，可是這對理查來說是家常便飯。他將虧損拋諸腦後，繼續尋找下一個機會。


    理查另一件有趣的事，是身為自由裁量型交易人的他，非常尊重系統型或機械型交易人。自由裁量型交易人通常對系統型交易人嗤之以鼻，相信市場絕對不會那麼簡單，不管是指標或量化表達式，都不可能使用數學演算法，賺取可靠的利潤。他們相信弱式效率市場假說（efficient
    market hypothesis），也就是無法用過去的價格走勢，預測未來的價格走勢。所以理查十分敬重系統型交易人，是十分罕見的事。


    理查在信孚的鼎盛時期加入成為自營交易員，親眼觀察機械型交易的運作。信孚在極盛時期，自營交易員是在同一張辦公桌工作的，理查是其中之一。不過，並不是所有的自營交易員都相同。有個人要求兩個年輕的畢業生不斷監控市場，一個上白天班，另一個上晚班。他們的工作是執行這位自營交易員所下的每一張委託單。理查在信孚的時候，這位自營交易員年年都是最優秀的。他用一台個人電腦跑系統性交易程式，全年無休，監控全球市場，產生買進和賣出委託單，然後交給年輕的畢業生去執行。理查在信孚時，利用機械型交易程式操盤的自營交易員表現最為突出，理查因此很敬重機械型交易。


    順帶一提，其他的自營交易員沒人知道這套程式在做什麼。這是信孚內部嚴密保守的秘密。但是每個人都知道這是國際西洋棋冠軍理查·法利（Richard Farleigh）設計的。他在信孚內部備受尊崇。法利在信孚表現非常出色，後來被挖角去百慕達操作一支避險基金，並在34歲那年退休，後來遷居蒙地卡羅。你可以在法利所寫的《馴服雄獅》（Taming
    the Lion）一書讀到更多他的故事。


    身為自由裁量型交易人，理查樂於在多個時間架構執行交易，從當日沖銷交易到短中線都有。理查極少抱牢長線部位。雖然理查不受限制，可以愛交易什麼就交易什麼，但在本書撰稿時，他偏愛交易股票指數、利率、商品和貨幣市場。他偏愛的交易工具是期貨和選擇權。如果看到好機會，他也交易澳大利亞股票。理查會閱讀所有的經濟報告。至於技術面，他會綜合簡單的趨勢線突破、簡單的型態辨識、背離和動量變化。


    在交易之外的時間，理查樂於埋首閱讀傳記，渾然忘我，惹得妻子佩塔（Peta）不悅。理查有強烈的宗教信仰，在教會中很活躍，是澳大利亞、紐西蘭和菲律賓安設辰東正教大主教管區（Antiochian
    Orthodox Archdiocese）的理事。理查和家人住在澳大利亞雪梨。現在就來聽聽理查的忠告。


    我叫理查·麥基，是RTM絕對報酬基金（RTM Absolute Return Fund）的執行長。


    自1986年以來，我就在主要的資產類別十分活躍，而且每一年的交易都賺錢。這段期間，我經歷（也活過）了市場驚天動地的混亂時期，如1987年的股市崩盤、1997年的亞洲危機、1998年長期資本管理公司（Long
    Term Capital Management）的崩解、九一一恐怖份子的攻擊，以及現在的全球金融危機。此外，我建立起二十幾年連續不斷的交易生涯，沒有在交易幾年之後就灰飛煙滅。


    布倫特的問題直截了當。但我交易成功的關鍵，是根據我的資本管理系統和交易計畫，不單單只有一件事。身為自由裁量型全球宏觀交易人，我面對排山倒海而來的資訊、市場觀察和技術面分析。這些變數取得一致，攸關我的交易決策，而決策的執行，有賴於我的資本管理系統。在這段簡短的說明中，我會試著概述我所用的策略，而不是單單一個忠告。不管我是從短線或長線的觀點交易，還是交易股票、固定利率或者貨幣市場，最重要的事，是保有務實的期望、穩健的資本管理系統，以及適用於所用時間架構的交易計畫——不要試圖在頭兩三個月內就達成你的目標，因為這只會提高炸毀的機率，你應該把每一個月看成是邁向目標的踏腳石。我的交易計畫相當簡單，而且這些年來，我發現最成功的交易人使用的交易計畫沒有那麼複雜。身為自由裁量型交易人，我每天被不計其數的經濟資料轟炸。我的交易方法有賴於前瞻的經濟資料和模式，結合技術面和市場觀察。市場統計數字和時機也在我的交易風格中扮演關鍵角色。舉例來說，零售業銷售額是我追蹤的一個重要經濟變數，但對我來說同等重要的是存貨相對於銷貨的比率和庫存水準。製造業
    ISM 指數是另一個重要的經濟變數，但指數中的生產和新接訂單等細類同樣重要。我的交易方法也納入市場技術面、統計和時機觀察，以及市場人氣。這是市場告訴我的事。所有這些變數取得一致，是我所用交易方法的關鍵。


    我的資本管理系統貫穿所有的交易決策。這可以確保保本、生存和資本高效率配置。資本管理系統有一部分很重要，那就是不斷提醒自己：不是每一筆交易都會獲利。事實上，大部分交易都會賠錢，所以關鍵在於管理虧損和獲利交易出場的方式，確保整體期望報酬總為正值。在一筆交易進場和出場時，為了將滑價降到最低，我只在流動性高、不受政治操弄的市場（有些貨幣可能發生這種事）交易。


    心理面的韌性對交易人很重要，因為虧損是這場遊戲的一部分。邁開步子往前走，切勿過分執著於虧損或回補虧損。幾乎每一天都會有機會現身。但願我提出的小小意見，對讀者有幫助。


    理查·麥基


    哇，理查的話絕對超過我的預期！如果你偏愛以自由裁量的方式交易，那麼理查已經給你寶貴的機會，管窺他的經濟劇本，也就是他注意的基本面統計數字。理查非常慷慨，和你分享他的交易計畫，而這套交易計畫，在過去二十四年，讓他每一年交易都賺錢。理查覺得他沒辦法單單提供一個忠告，所以簡單扼要彙總了他所做的事。對他來說，重要的是見到他的前瞻經濟變數和市場的價格走勢取得一致。理查總是試著掌握獲利的勝算在他那一邊。他強力主張採用資本（資金）管理，並且學習如何忽視可能令交易人分心的市場日常雜訊。


    這些智慧之語，出自一位成功的交易人；他有連續二十四年獲利的紀錄，十分罕見且令人讚美。


    遺憾的是，我沒辦法給你他的聯絡網站。如果他的想法引起你的共鳴，我建議你把他的話影印下來，放在顯示器上方，時時提醒自己，一位自由裁量型交易人如何在市場取得成功。


    ## 傑夫·摩根


    傑夫·摩根（Geoff Morgan）是我的好朋友和導師。他把我推上交易成功的正途。傑夫教我以不動感情、百分之百客觀、冷靜、超然物外和合乎邏輯的方式觀察市場，因而引我入門，認識使統計勝算對自己有利的重要性。


    當時，我是艾略特波浪的信徒，交易SPI。傑夫是和我往來的那家經紀公司的顧問。那些年，我打電話給我的顧問時，曾經多次和傑夫講過話。雖然我們經常談話，卻沒有真正聊到市場。


    有一天，我因為成交一筆交易再度發生虧損，對自己的交易又覺得沮喪，而打電話過去。在我看來，我似乎缺乏勝招。我的顧問剛好外出吃午餐，所以是傑夫接的電話。我問傑夫委託單的撮合狀況，並首次請教他的意見，問他認為SPI會往哪裡走。傑夫冷靜地表示，SPI已經連續三天收高。他接著根據他對SPI統計價格波動的了解，指出由於SPI已經到達它的中位數，往上走，根據連續收盤的狀況，如果是他，會不太想買。相反的，他會尋求放空的機會。接下來幾天，SPI遲滯不前，而且價格越走越低。這時，我彷若當頭棒喝，靈光乍現！從那一刻開始，我開始從自由裁量型的預測者，轉型為機械型務實主義者；從依賴自己對艾略特波浪的主觀解讀，轉為依賴觀察百分之百客觀的重複價格型態。所以我要說，謝謝傑夫指引我看到那道光。


    大部分人沒聽過傑夫的大名，因為他極其低調。他是私人交易人，只為自己和家人交易。他不教導別人，不寫書，不在交易展覽會上發表演說，也不開講習班。


    我個人何其有幸，認識了傑夫，得到他的指導。我也何其有幸，他同意參與這本書。請不要因為沒聽過傑夫這個人，或者他像我只是個私人交易人而感到失望。傑夫和本書中的許多市場大師一樣，是個原創性的市場思想家，而且很講邏輯。談到市場，傑夫在邏輯、意識、和智識上十分嚴謹。他不只聰明，而且有一種獨特的天賦，能以簡單和合乎邏輯的方式解釋各種觀念。他就像你會希望所有學科都被他教到的老師。他非常擅長於教導別人，我給他取的暱稱之一是「教授」，另一個暱稱是「TG」，即「交易人傑夫」(Trader
    Geoff)。


    我經常和傑夫及其他三位全時交易人共進晚餐。傑夫和我都是私人交易人。其他人則經營他們自己的絕對報酬基金，各自管理數億美元的機構和私人資金。其中一人是你已經見過的理查·麥基。另外兩個人是兄弟，我也邀請他們參與本書，因為他們的故事和成功真的激勵人心。但是，雖然對於受邀一事受寵若驚，他們卻拒絕參與，因為他們的重心放在機構市場，不是可能讀這本書的私人交易人。


    總之，我們經常一起吃飯，並且閒聊市場。最常促使我們動腦思考，並且給我們較多「啊哈」時刻的人，就是傑夫。他就是擁有驚人的洞見，以及出乎意料之外的市場觀點，而且他的解釋聽起來總是那麼合乎邏輯、簡單且明顯。關於市場，他有時會讓你自覺不足，不過是以盡可能溫和的方式。


    所以，雖然傑夫沒沒無聞，請了解他是個成功的私人交易人，擁有令人艷羨的交易紀錄，而且他有機構般的市場智識。


    現在你比較了解傑夫是什麼樣的人，且讓我談談他的背景。傑夫從很小就對風險評估感興趣。大約14歲那年，他經常到賽馬場，學習如何計算概率，好贏過賭馬莊家。1970年代，他攻讀土木工程，兼差當見習土木工程師。在他念書的時候，傑夫繼續賭博。單靠計算概率，他就能貼補收入，整體而言贏過賭馬莊家。他贏的錢助他完成大學學業。


    因此，傑夫從二十出頭起就了解市場——不管是賽馬賠率，還是交易。他知道，箇中竅門都只是找到統計上的優勢，以及掌握利用它。他能夠做到這一點，是因為他擁有一顆非常重視邏輯和懂數學的頭腦，他攻讀土木工程時，靠的也是這個。我也見過他寫了一本沒出版的書，談如何靠計算和玩弄概率，贏得西洋雙陸棋！寫這本書的動機，來自他看了一位世界西洋雙陸棋冠軍寫的一本書。他在書中見到一種策略似乎相當矛盾，可是傑夫很快就知道那是基於概率的一種優勢。我不是說過傑夫很聰明嗎？


    赴海外旅行之後，他沒有重回工程本業，而是改變方向，錄取了電腦分析和程式設計課程。他很快就在保險業找到分析師／程式設計師的工作。


    1985年，傑夫開創自己的事業，專門替保險業發展風險評估軟體。這項事業經營得非常成功，1989年，傑夫將它賣掉，還清抵押貸款，然後再次改弦易轍。他唸完財務顧問的課程，成為有執照的財務顧問。這也給了他足夠在市場上追求興趣的資本。


    傑夫和許多市場新人一樣，一開始並不是以自由裁量的方式交易，而是建立機率模式，給他進出市場的一個機械型程序。初步取得若干成功之後，傑夫很快就了解，市場遠比他懂得的，有更多的東西要學習。因此，傑夫決定從內而外把它摸個透徹。所以他開始和一家老字號經紀公司建立關係，後來更以領有執照的期貨經紀員的身分，和一位顧問共事。傑夫並沒有把他的角色視為工作，而是從內部學習真正的市場知識和交易專門知識，並觀察、傾聽、向經紀員和顧客學習的機會。結合這個實務經驗和他知性上對數字的熱愛，傑夫因此能夠利用他的程式設計長才，調查和研究各種交易策略。沒多久，傑夫就成功發展出波動性突破策略，造福自己和他的客戶。


    1995年，傑夫離開經紀業，專心全時交易。今天，傑夫繼續交易，一如在1995年那時，只是現在以更為自由裁量的方式執行交易。傑夫會往中期趨勢的方向，以型態為基礎的波動性突破去交易。傑夫會當日沖銷期貨，也會短線交易股票，持有交易三到十天。至於期貨交易，傑夫喜歡交易歐元／美元和澳元／美元的貨幣對和SPI。股票交易方面，本書撰稿時，傑夫正交易在澳大利亞證券交易所掛牌上市的財產信託和黃金股票。


    傑夫沒有交易的時候，通常會找些事做。他最不喜歡呆呆坐著，什麼事都不做，因此在他旁邊，很難放鬆身心。傑夫喜歡翻修房屋——是的，你可以要傑夫離開土木工程業，但抽不走他身上的工科本性。他爭強好勝，喜歡跑步，經常參加8.7哩的「雪梨城市到浪灘馬拉松大賽」（City
    to Surf）。他喜歡解難解的填字遊戲、數獨，也愛旅行。傑夫還寫了一套解答數獨的邏輯程式。令他太太溫蒂（Wendy）氣惱的是，傑夫太講邏輯、太爭強好勝，有時太專心致志，很難和他共同生活！傑夫和他家人住在澳大利亞雪梨。現在我就來請教傑夫的一段忠告。


    我自 1989 年起開始交易。

    這段期間，我只賠過一年。

    布倫特第一次開口要我參與本書時，我受寵若驚。

    但是，我想得越多，就越發現一個哲學上的問題——我是交易人，不是教育家。期貨交易是「淨零遊戲」（zero net game），也就是說，如果我賺錢，就會有人賠錢。為什麼我要別人停止賠錢？


    傑夫．摩根


    我必須說，這不是我要的那種回應。我在外出度假時收到傑夫的回覆。我起初對傑夫講的話感到失望。我覺得這不慷慨，也不認為這些話反映了傑夫慷慨的本性。但是後來我想想，我們相識二十年，可能我誤將他對我的慷慨，以為他對任何人都那麼大器。總之，我對傑夫道謝，說等我回國和他聯絡。雖然我感到失望，卻也看出他的論點不無道理。他為什麼要幫助你，降低他獲利的前景？雖然我覺得他的話有點薄弱和小家子氣，卻也不是沒有道理。雖然他表現得很強硬，但也相當誠實而合理。如同傑夫所說，他不是教育家，而是交易人。


    總之，我度假回國後，打了電話給傑夫。我們談了很久。傑夫正等著我大發脾氣，因為他曉得自己寫的東西不是我真正想要的。我同意傑夫的看法，我承認說我相當失望，但接著表示我能理解他的說法。不過，我不想讓傑夫這麼輕易脫身，我想要他說更多，因為我知道他很特別，而且我知道交易人需要認識他和他的想法。


    你噓得，不是所有的成功交易人都有很高的知名度。不是所有成功的交易人都曾經贏過交易冠軍賽。有些最優秀的交易人，就像傑夫那樣，是私人交易人，不在公共競技場上亮相。他們不管管理機構的資金。他們是私人交易人，想要保持隱密。既然我認識傑夫，所以我有機會將他從隱藏的地方拉出來，好讓你知道不是所有成功的交易人都在公開的領域有很高的知名度。我決心將他拖進鎂光燈底下，讓你知道有成功的私人交易人這回事。


    所以我堅持自己的論點，說我並不是要求他當教育家，而是要他以交易人的身分，對有志於此的交易人提供一段忠告。我們你來我往，唇槍舌劍，各說各話，直到傑夫退讓。當傑夫重新提起一段往事時，我打斷他說，有抱負的交易人需要知道他剛剛說的。那是一個有力的故事，和他當經紀員的時候有關。那是來自「內部」的故事，蘊涵有力的真理，我希望傑夫能和讀者分享。以下就是傑夫的分享。


    起初，我要說的就是前面那些，但在和布倫特長談之後，他說服我應該多說幾句話。


    從1991到1995年的五年期間，我是期貨經紀員。在我發展出自己的市場知識和交易技能之後，交易和經紀之間的衝突，交易勝出。但是這五年，我對交易、交易人和自己學到最多。


    我們那家小型經紀公司，往來的都是零售賭客（講得好聽一點）。

    '
  mdcn: '

    可以觀察價格活動，衡量他們的意見。這個行為發展出三個重要的基本關係。

    第一個基本關係是穩定的支撐和阻力。我們在走勢圖上用水平線畫出來。第二個基本關係是動態或發展中的支撐和阻力水準。我們在走勢圖中以傾斜的趨勢線畫出來。第三個基本關係是在交易人和投資人之間。我們使用顧比多重移動平均數（Guppy
    Multiple Moving Average）去了解和分析這個關係。這些是我了解市場的基礎，因為它們告訴我其他人是怎麼想的。

    謙卑意味著我接受走勢圖和價格行為型態所產生的訊息。有時候，我認為市場錯了。它不應該下跌。我已經學會，如果我的意見與市場價格行為相左，就要忽視自己的意見。謙卑意味著我會傾聽走勢圖說的話。當你傾聽，就能聽到錢在講話。所以我的一段簡單忠告就是這樣。在市場中保持謙卑，市場就會獎賞你。


    戴若 · 顧比


    謙卑。如此簡單，如此微妙，力量卻那麼強大。這是個很棒的忠告，因為謙卑通常是交易人最後才學到的情緒，而這時已經付出慘重的代價。人們到市場中交易時，通常滿懷信心、精力、熱情，以及因為年輕而不經意的傲慢。然後，透過市場的最大逆境，我們付出荷包、心靈、驕傲和自負的代價，學會我們在全知且不斷變化的高超市場腳下，永遠不會是受人尊重的學生。即使一個人擁有豐富的交易知識且十分成功，一旦停止傾聽市場，一切都會化為烏有。保持謙卑，會確保你敞開心胸，接受市場給你的訊息，而且如同戴若所說，它會獎賞你做為回報。如果不然，你就會搭上高速列車，邁向失望的終點！


    戴若的網站：www.Guppytraders.com。


    ## 理查·麥基


    理查·麥基（Richard Melki）是個成功的自由裁量型交易人，經營自己的絕對報酬基金。身為自由裁量型交易人，理查的風格被稱為全球宏觀（Global Macro）。這表示理查的交易任務沒有界限。他是個無拘無束的交易人，能夠基於任何理由，在任何時間進出任何市場。如果理查相信某個交易格局正在發展，他就會去交易——不管工具、市場、地理位置為何。


    理查可能是最優秀的自由裁量型交易人之一。2008年的全球金融危機期間，獨立的研究機構澳大利亞基金監控（Australian Fund Monitors）將理查排在他所屬策略類別的第二名。


    理查的出色表現是意料中事，因為他的整個生涯都在市場、交易和投資打滾。理查曾經是機構自營交易員，當時大部分時間為澳大利亞的商業銀行交易，信孚銀行（Bankers
    Trust）是其中之一。當時信孚令所有的市場參與者艷羨。


    身為自由裁量型交易人，理查很少使用技術面分析和技巧以支持他的交易。理查依賴本身對全球宏觀經濟事件的解讀和對市場流動的知識，支持他的交易決策。


    此外，理查也是我交情最久的摯友之一。我們1983年認識，當時都在大學主修財務。1983年12月我放棄榮譽學士學位課程，到美國銀行工作，理查則取得榮譽學士學位，1986年進入澳大利亞工業發展公司（Australian
    Industry Development Corporation）服務。這是官股占一半的商業銀行。


    理查身為純自由裁量型交易人，不偏愛任何特定的技術面技巧。我個人認為他是特立獨行的交易人，依賴自己的「頭腦」和直覺去交易。他是難得一見之的天之驕子，擁有罕見的天分和能力，能在監控多個市場時，吸收消化許多經濟變數，然後抽絲剝繭，做成是否進場交易的清晰二元決策。他接著使用技術面，抓取進場時機。他是我所認識最優秀的經濟分析師。如果你認識理查，你會對媒體上佼佼而談的經濟學家置若罔聞。


    話說從頭。1986年，理查進入AIDC當實習自營員。理查從一開始就一直是自由裁量型交易人，設法正確解讀基本面經濟的地貌，並且運用技術面工具，抓取進場時機。二十三年來，理查真的沒有改變——除了越做越好之外。那時候，理查透過路透（Reuters）和Telerate接收經濟新聞與走勢圖。1988年，理查在AIDC主管衍生性產品，並且成為它的自營員。他的成功很快就為市場所知，沒多久被挖角到信孚銀行。1995年，理查離開信孚，自己交易，追求個人的投資利益。


    2000年，他創立自己的絕對報酬管理事業，管理外部基金。理查現在交易超過二十四年。他能不費吹灰之力，毅然決然放棄特定的市場看法、停損出場、一百八十度反轉建立部位，讓我驚異不已。理查做錯時，他心知肚明，而且不會因為對特定狀況的分析出錯，浪費任何失去的自尊。我們大部分人對於虧損，總是沮喪不已，並且責怪自己分析錯誤，可是這對理查來說是家常便飯。他將虧損拋諸腦後，繼續尋找下一個機會。


    理查另一件有趣的事，是身為自由裁量型交易人的他，非常尊重系統型或機械型交易人。自由裁量型交易人通常對系統型交易人嗤之以鼻，相信市場絕對不會那麼簡單，不管是指標或量化表達式，都不可能使用數學演算法，賺取可靠的利潤。他們相信弱式效率市場假說（efficient
    market hypothesis），也就是無法用過去的價格走勢，預測未來的價格走勢。所以理查十分敬重系統型交易人，是十分罕見的事。


    理查在信孚的鼎盛時期加入成為自營交易員，親眼觀察機械型交易的運作。信孚在極盛時期，自營交易員是在同一張辦公桌工作的，理查是其中之一。不過，並不是所有的自營交易員都相同。有個人要求兩個年輕的畢業生不斷監控市場，一個上白天班，另一個上晚班。他們的工作是執行這位自營交易員所下的每一張委託單。理查在信孚的時候，這位自營交易員年年都是最優秀的。他用一台個人電腦跑系統性交易程式，全年無休，監控全球市場，產生買進和賣出委託單，然後交給年輕的畢業生去執行。理查在信孚時，利用機械型交易程式操盤的自營交易員表現最為突出，理查因此很敬重機械型交易。


    順帶一提，其他的自營交易員沒人知道這套程式在做什麼。這是信孚內部嚴密保守的秘密。但是每個人都知道這是國際西洋棋冠軍理查·法利（Richard Farleigh）設計的。他在信孚內部備受尊崇。法利在信孚表現非常出色，後來被挖角去百慕達操作一支避險基金，並在34歲那年退休，後來遷居蒙地卡羅。你可以在法利所寫的《馴服雄獅》（Taming
    the Lion）一書讀到更多他的故事。


    身為自由裁量型交易人，理查樂於在多個時間架構執行交易，從當日沖銷交易到短中線都有。理查極少抱牢長線部位。雖然理查不受限制，可以愛交易什麼就交易什麼，但在本書撰稿時，他偏愛交易股票指數、利率、商品和貨幣市場。他偏愛的交易工具是期貨和選擇權。如果看到好機會，他也交易澳大利亞股票。理查會閱讀所有的經濟報告。至於技術面，他會綜合簡單的趨勢線突破、簡單的型態辨識、背離和動量變化。


    在交易之外的時間，理查樂於埋首閱讀傳記，渾然忘我，惹得妻子佩塔（Peta）不悅。理查有強烈的宗教信仰，在教會中很活躍，是澳大利亞、紐西蘭和菲律賓安設辰東正教大主教管區（Antiochian
    Orthodox Archdiocese）的理事。理查和家人住在澳大利亞雪梨。現在就來聽聽理查的忠告。


    我叫理查·麥基，是RTM絕對報酬基金（RTM Absolute Return Fund）的執行長。


    自1986年以來，我就在主要的資產類別十分活躍，而且每一年的交易都賺錢。這段期間，我經歷（也活過）了市場驚天動地的混亂時期，如1987年的股市崩盤、1997年的亞洲危機、1998年長期資本管理公司（Long
    Term Capital Management）的崩解、九一一恐怖份子的攻擊，以及現在的全球金融危機。此外，我建立起二十幾年連續不斷的交易生涯，沒有在交易幾年之後就灰飛煙滅。


    布倫特的問題直截了當。但我交易成功的關鍵，是根據我的資本管理系統和交易計畫，不單單只有一件事。身為自由裁量型全球宏觀交易人，我面對排山倒海而來的資訊、市場觀察和技術面分析。這些變數取得一致，攸關我的交易決策，而決策的執行，有賴於我的資本管理系統。在這段簡短的說明中，我會試著概述我所用的策略，而不是單單一個忠告。不管我是從短線或長線的觀點交易，還是交易股票、固定利率或者貨幣市場，最重要的事，是保有務實的期望、穩健的資本管理系統，以及適用於所用時間架構的交易計畫——不要試圖在頭兩三個月內就達成你的目標，因為這只會提高炸毀的機率，你應該把每一個月看成是邁向目標的踏腳石。我的交易計畫相當簡單，而且這些年來，我發現最成功的交易人使用的交易計畫沒有那麼複雜。身為自由裁量型交易人，我每天被不計其數的經濟資料轟炸。我的交易方法有賴於前瞻的經濟資料和模式，結合技術面和市場觀察。市場統計數字和時機也在我的交易風格中扮演關鍵角色。舉例來說，零售業銷售額是我追蹤的一個重要經濟變數，但對我來說同等重要的是存貨相對於銷貨的比率和庫存水準。製造業
    ISM 指數是另一個重要的經濟變數，但指數中的生產和新接訂單等細類同樣重要。我的交易方法也納入市場技術面、統計和時機觀察，以及市場人氣。這是市場告訴我的事。所有這些變數取得一致，是我所用交易方法的關鍵。


    我的資本管理系統貫穿所有的交易決策。這可以確保保本、生存和資本高效率配置。資本管理系統有一部分很重要，那就是不斷提醒自己：不是每一筆交易都會獲利。事實上，大部分交易都會賠錢，所以關鍵在於管理虧損和獲利交易出場的方式，確保整體期望報酬總為正值。在一筆交易進場和出場時，為了將滑價降到最低，我只在流動性高、不受政治操弄的市場（有些貨幣可能發生這種事）交易。


    心理面的韌性對交易人很重要，因為虧損是這場遊戲的一部分。邁開步子往前走，切勿過分執著於虧損或回補虧損。幾乎每一天都會有機會現身。但願我提出的小小意見，對讀者有幫助。


    理查·麥基


    哇，理查的話絕對超過我的預期！如果你偏愛以自由裁量的方式交易，那麼理查已經給你寶貴的機會，管窺他的經濟劇本，也就是他注意的基本面統計數字。理查非常慷慨，和你分享他的交易計畫，而這套交易計畫，在過去二十四年，讓他每一年交易都賺錢。理查覺得他沒辦法單單提供一個忠告，所以簡單扼要彙總了他所做的事。對他來說，重要的是見到他的前瞻經濟變數和市場的價格走勢取得一致。理查總是試著掌握獲利的勝算在他那一邊。他強力主張採用資本（資金）管理，並且學習如何忽視可能令交易人分心的市場日常雜訊。


    這些智慧之語，出自一位成功的交易人；他有連續二十四年獲利的紀錄，十分罕見且令人讚美。


    遺憾的是，我沒辦法給你他的聯絡網站。如果他的想法引起你的共鳴，我建議你把他的話影印下來，放在顯示器上方，時時提醒自己，一位自由裁量型交易人如何在市場取得成功。


    ## 傑夫·摩根


    傑夫·摩根（Geoff Morgan）是我的好朋友和導師。他把我推上交易成功的正途。傑夫教我以不動感情、百分之百客觀、冷靜、超然物外和合乎邏輯的方式觀察市場，因而引我入門，認識使統計勝算對自己有利的重要性。


    當時，我是艾略特波浪的信徒，交易SPI。傑夫是和我往來的那家經紀公司的顧問。那些年，我打電話給我的顧問時，曾經多次和傑夫講過話。雖然我們經常談話，卻沒有真正聊到市場。


    有一天，我因為成交一筆交易再度發生虧損，對自己的交易又覺得沮喪，而打電話過去。在我看來，我似乎缺乏勝招。我的顧問剛好外出吃午餐，所以是傑夫接的電話。我問傑夫委託單的撮合狀況，並首次請教他的意見，問他認為SPI會往哪裡走。傑夫冷靜地表示，SPI已經連續三天收高。他接著根據他對SPI統計價格波動的了解，指出由於SPI已經到達它的中位數，往上走，根據連續收盤的狀況，如果是他，會不太想買。相反的，他會尋求放空的機會。接下來幾天，SPI遲滯不前，而且價格越走越低。這時，我彷若當頭棒喝，靈光乍現！從那一刻開始，我開始從自由裁量型的預測者，轉型為機械型務實主義者；從依賴自己對艾略特波浪的主觀解讀，轉為依賴觀察百分之百客觀的重複價格型態。所以我要說，謝謝傑夫指引我看到那道光。


    大部分人沒聽過傑夫的大名，因為他極其低調。他是私人交易人，只為自己和家人交易。他不教導別人，不寫書，不在交易展覽會上發表演說，也不開講習班。


    我個人何其有幸，認識了傑夫，得到他的指導。我也何其有幸，他同意參與這本書。請不要因為沒聽過傑夫這個人，或者他像我只是個私人交易人而感到失望。傑夫和本書中的許多市場大師一樣，是個原創性的市場思想家，而且很講邏輯。談到市場，傑夫在邏輯、意識、和智識上十分嚴謹。他不只聰明，而且有一種獨特的天賦，能以簡單和合乎邏輯的方式解釋各種觀念。他就像你會希望所有學科都被他教到的老師。他非常擅長於教導別人，我給他取的暱稱之一是「教授」，另一個暱稱是「TG」，即「交易人傑夫」(Trader
    Geoff)。


    我經常和傑夫及其他三位全時交易人共進晚餐。傑夫和我都是私人交易人。其他人則經營他們自己的絕對報酬基金，各自管理數億美元的機構和私人資金。其中一人是你已經見過的理查·麥基。另外兩個人是兄弟，我也邀請他們參與本書，因為他們的故事和成功真的激勵人心。但是，雖然對於受邀一事受寵若驚，他們卻拒絕參與，因為他們的重心放在機構市場，不是可能讀這本書的私人交易人。


    總之，我們經常一起吃飯，並且閒聊市場。最常促使我們動腦思考，並且給我們較多「啊哈」時刻的人，就是傑夫。他就是擁有驚人的洞見，以及出乎意料之外的市場觀點，而且他的解釋聽起來總是那麼合乎邏輯、簡單且明顯。關於市場，他有時會讓你自覺不足，不過是以盡可能溫和的方式。


    所以，雖然傑夫沒沒無聞，請了解他是個成功的私人交易人，擁有令人艷羨的交易紀錄，而且他有機構般的市場智識。


    現在你比較了解傑夫是什麼樣的人，且讓我談談他的背景。傑夫從很小就對風險評估感興趣。大約14歲那年，他經常到賽馬場，學習如何計算概率，好贏過賭馬莊家。1970年代，他攻讀土木工程，兼差當見習土木工程師。在他念書的時候，傑夫繼續賭博。單靠計算概率，他就能貼補收入，整體而言贏過賭馬莊家。他贏的錢助他完成大學學業。


    因此，傑夫從二十出頭起就了解市場——不管是賽馬賠率，還是交易。他知道，箇中竅門都只是找到統計上的優勢，以及掌握利用它。他能夠做到這一點，是因為他擁有一顆非常重視邏輯和懂數學的頭腦，他攻讀土木工程時，靠的也是這個。我也見過他寫了一本沒出版的書，談如何靠計算和玩弄概率，贏得西洋雙陸棋！寫這本書的動機，來自他看了一位世界西洋雙陸棋冠軍寫的一本書。他在書中見到一種策略似乎相當矛盾，可是傑夫很快就知道那是基於概率的一種優勢。我不是說過傑夫很聰明嗎？


    赴海外旅行之後，他沒有重回工程本業，而是改變方向，錄取了電腦分析和程式設計課程。他很快就在保險業找到分析師／程式設計師的工作。


    1985年，傑夫開創自己的事業，專門替保險業發展風險評估軟體。這項事業經營得非常成功，1989年，傑夫將它賣掉，還清抵押貸款，然後再次改弦易轍。他唸完財務顧問的課程，成為有執照的財務顧問。這也給了他足夠在市場上追求興趣的資本。


    傑夫和許多市場新人一樣，一開始並不是以自由裁量的方式交易，而是建立機率模式，給他進出市場的一個機械型程序。初步取得若干成功之後，傑夫很快就了解，市場遠比他懂得的，有更多的東西要學習。因此，傑夫決定從內而外把它摸個透徹。所以他開始和一家老字號經紀公司建立關係，後來更以領有執照的期貨經紀員的身分，和一位顧問共事。傑夫並沒有把他的角色視為工作，而是從內部學習真正的市場知識和交易專門知識，並觀察、傾聽、向經紀員和顧客學習的機會。結合這個實務經驗和他知性上對數字的熱愛，傑夫因此能夠利用他的程式設計長才，調查和研究各種交易策略。沒多久，傑夫就成功發展出波動性突破策略，造福自己和他的客戶。


    1995年，傑夫離開經紀業，專心全時交易。今天，傑夫繼續交易，一如在1995年那時，只是現在以更為自由裁量的方式執行交易。傑夫會往中期趨勢的方向，以型態為基礎的波動性突破去交易。傑夫會當日沖銷期貨，也會短線交易股票，持有交易三到十天。至於期貨交易，傑夫喜歡交易歐元／美元和澳元／美元的貨幣對和SPI。股票交易方面，本書撰稿時，傑夫正交易在澳大利亞證券交易所掛牌上市的財產信託和黃金股票。


    傑夫沒有交易的時候，通常會找些事做。他最不喜歡呆呆坐著，什麼事都不做，因此在他旁邊，很難放鬆身心。傑夫喜歡翻修房屋——是的，你可以要傑夫離開土木工程業，但抽不走他身上的工科本性。他爭強好勝，喜歡跑步，經常參加8.7哩的「雪梨城市到浪灘馬拉松大賽」（City
    to Surf）。他喜歡解難解的填字遊戲、數獨，也愛旅行。傑夫還寫了一套解答數獨的邏輯程式。令他太太溫蒂（Wendy）氣惱的是，傑夫太講邏輯、太爭強好勝，有時太專心致志，很難和他共同生活！傑夫和他家人住在澳大利亞雪梨。現在我就來請教傑夫的一段忠告。


    我自 1989 年起開始交易。

    這段期間，我只賠過一年。

    布倫特第一次開口要我參與本書時，我受寵若驚。

    但是，我想得越多，就越發現一個哲學上的問題——我是交易人，不是教育家。期貨交易是「淨零遊戲」（zero net game），也就是說，如果我賺錢，就會有人賠錢。為什麼我要別人停止賠錢？


    傑夫．摩根


    我必須說，這不是我要的那種回應。我在外出度假時收到傑夫的回覆。我起初對傑夫講的話感到失望。我覺得這不慷慨，也不認為這些話反映了傑夫慷慨的本性。但是後來我想想，我們相識二十年，可能我誤將他對我的慷慨，以為他對任何人都那麼大器。總之，我對傑夫道謝，說等我回國和他聯絡。雖然我感到失望，卻也看出他的論點不無道理。他為什麼要幫助你，降低他獲利的前景？雖然我覺得他的話有點薄弱和小家子氣，卻也不是沒有道理。雖然他表現得很強硬，但也相當誠實而合理。如同傑夫所說，他不是教育家，而是交易人。


    總之，我度假回國後，打了電話給傑夫。我們談了很久。傑夫正等著我大發脾氣，因為他曉得自己寫的東西不是我真正想要的。我同意傑夫的看法，我承認說我相當失望，但接著表示我能理解他的說法。不過，我不想讓傑夫這麼輕易脫身，我想要他說更多，因為我知道他很特別，而且我知道交易人需要認識他和他的想法。


    你噓得，不是所有的成功交易人都有很高的知名度。不是所有成功的交易人都曾經贏過交易冠軍賽。有些最優秀的交易人，就像傑夫那樣，是私人交易人，不在公共競技場上亮相。他們不管管理機構的資金。他們是私人交易人，想要保持隱密。既然我認識傑夫，所以我有機會將他從隱藏的地方拉出來，好讓你知道不是所有成功的交易人都在公開的領域有很高的知名度。我決心將他拖進鎂光燈底下，讓你知道有成功的私人交易人這回事。


    所以我堅持自己的論點，說我並不是要求他當教育家，而是要他以交易人的身分，對有志於此的交易人提供一段忠告。我們你來我往，唇槍舌劍，各說各話，直到傑夫退讓。當傑夫重新提起一段往事時，我打斷他說，有抱負的交易人需要知道他剛剛說的。那是一個有力的故事，和他當經紀員的時候有關。那是來自「內部」的故事，蘊涵有力的真理，我希望傑夫能和讀者分享。以下就是傑夫的分享。


    起初，我要說的就是前面那些，但在和布倫特長談之後，他說服我應該多說幾句話。


    從1991到1995年的五年期間，我是期貨經紀員。在我發展出自己的市場知識和交易技能之後，交易和經紀之間的衝突，交易勝出。但是這五年，我對交易、交易人和自己學到最多。


    我們那家小型經紀公司，往來的都是零售賭客（講得好聽一點）。

