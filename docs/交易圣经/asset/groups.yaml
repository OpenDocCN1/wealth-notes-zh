    ![](img/4cb0a78760f87b9407822631d12abbf8_258_0.png)


    # 圖9.13 黃金日線圖


    解決這道視覺謎題的方法，很像試著確認傳統的圖形型態。這很主觀，取決於個人感知。如果再數一遍，你可能會見到更多或更少的三角形。


    圖9.16是一位朋友挑出我漏掉的折返型態。


    圖9.17是另一位朋友指出我漏掉的其他折返型態。我也要求對方看了一下這張走勢圖。現在你應該知道使用主觀工具的問題出在哪裡了。


    正如我說過的，走勢圖的解讀沒有那麼容易，而且市場可能做了一些嘗試，才完成一個型態。此外，型態可能各有不同。舉例來說，三角形可能對稱、上升或下降。


    再說一次，確認折返形態的主觀性質，使得它們不穩定且不可靠，妨礙順勢交易人的成功。'
  - '[PAGE 259]


