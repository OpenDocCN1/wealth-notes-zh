    # 管理「貪婪」


    在你開始想要更多時，這就是貪婪的情緒。貪婪會啟動不安全感，你會開始認為自己錯過了某些東西，因為你相信別人做得遠比你好。你會開始想要更多錢，而且相信交易越多，錢越多。想要更多會導致衝動交易，導致執行邊際交易、虧損累增，以及報復性交易的循環。這個循環會加速重複，直到你醒悟或者帳戶破產為止。


    當你不滿於擁有的，貪婪就會出現。你應該停止操心做對或做錯。當情緒迷失方向，貪婪就會成為問題。情緒迷失方向是來自目標和期望有瑕疵。大部分交易人在起步時，目標都是達成100%的準確率，並期望超過50%或100%的報酬率。


    第3章曾討論達成情緒定向的重要性。如果你能以溫和的期望，訂定自己的專業目標，就是邁出管理貪婪的一大步。務必接受沒有人能連年達成儘管符合統計卻不切實際的報酬率。沒有證據顯示有人能夠做到。務必滿足於你所擁有的。建立溫和的期望。為風險資本建立溫和的報酬目標，20%、30%或40%的報酬率都好。記住，期望值越高，風險越高，破產機率也越高！


    要確知你偏愛的風險資本報酬率水準。你應該設想，在交易一年後，達成溫和的報酬率目標，那種美好的感覺。銘記那種感覺。你應該樂於堅守你的溫和報酬率期望值。'
