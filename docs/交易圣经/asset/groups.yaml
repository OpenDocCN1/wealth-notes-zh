    ## 第13章


    ## 結語


    我們來到了本書的尾聲。其實我已經沒有什麼要說。希望你喜歡我的成功交易通則，希望你樂於傾聽市場大師的忠告。希望你能吸收到我和市場大師的一些（如果不是全部）心得。


    我相信這些通則是一個起跳點。此外，當交易人身處如颶風般瞬息萬變的市場，面對琳瑯滿目的交易服務和產品，這些通則也能提供一個安全避難所。


    現在是私人交易人最好的時代，也是最壞的時代。現在是最好的時代，相對於私人交易人，機構不再擁有任何競爭優勢。進場沒有障礙，只要按個鍵，就有各式各樣的選擇。今天的交易人也不缺選擇，市場上有無數平價經紀商、電子交易平臺、自動交易程式、便宜的即時資料、畫圖程式、指標、市場、時間架構、工具、基本面和技術面交易理論、交易新聞信、交易教育工作者、交易教練和講習班。


    這也是最壞的時代。今天，超過90%的積極型交易人持續賠錢。這很糟糕。自 1983 年在美國銀行開始交易以來，一直都是如此。


    交易的矛盾就在此：這是最好的時代，也是最壞的時代！


    但願我的成功交易通則助你逃過最壞的時代。交易技術、交易服務以及交易教育的進步，製造了如此多的激情，使交易人分心，沒有先將注意力放在了解交易通則上。行銷炒作、金錢魅力以及輕鬆致富，並沒有讓交易人停下腳步，花夠多時間思考、研究交易成功的關鍵基本要素，反而把他們一頭推進交易。廣泛的選擇不只激勵和推促交易人投入市場，也製造太多的選擇和太高的複雜性，導致太多的混淆、太多的挫折，以及太多的失敗。


    正因為如此，我相信它也是最糟的時代。交易人因為可用的選擇之多而感到應付不來，因為行銷炒作和輕易致富的承諾而分心，以至於忽視了有用的基本要素——成功交易通則。但願本書能藉由適當的現實，助幻想天馬行空的交易人腳踏實地。我希望成功交易通則能讓今天成為你最好的時代。


    正如你現在已經知道的，市場基本上是隨機的，而最大逆境會確保極度的不確定性。但我確知，遵循這些通則，就會成功。只要結合明智的資金管理策略和簡單、客觀、獨立、經
    TEST 程序驗證的正期望值方法，會開始以 0% 破產風險執行交易。除此之外，開始交易沒有更好的起點。


    如果你能建立專業目標和溫和期望，情緒上會傾向於確實遵循交易計畫。如果你承認市場的最大逆境存在，並且在它面前保持謙卑之心，你就能做好準備，以忍耐和堅持，度過它在路上朝你丟過來的痛苦。


    ## 交易沒有輕鬆好走的路


    你現在知道交易並非靈丹妙藥。你知道交易不是五星級假期。我希望你現在明白，交易要做的功課多於你的想像。交易的一個小小諷刺就是，人們等不及離開正職工作，開始為自己全時交易，但是大部分成功的交易人都比以前忙，比以往更賣力工作，以求持續不斷改善。


    我現在希望你已經了解，要在比較長的時間內持續不斷交易成功，依賴良好的痛苦管理，勝於良好的交易。你會發現，交易的部份很容易執行。管理經常不斷的痛苦，才是真正的挑戰。你會發現這是一場毫不留情的戰鬥，必須因應：

    - 腐損的痛苦

    - 克制軋平以獲利入袋的強烈傾向的痛苦

    - 想到沒有落袋為安的獲利的痛苦

    - 沒有在市場待到下一段大波動的痛苦

    - 賠損的痛苦

    - 不知道獲利交易何時會到的痛苦

    - 相信其他人都做得比你好的痛苦

    - 相信其他人都做得比你容易的痛苦

    - 失去耐性的痛苦

    - 現在就樣樣都想要的痛苦

    - 持續不斷研發卻很少有效創造獲利的痛苦

    - 勞累的痛苦

    - 永遠不夠的痛苦

    - 相信別人的策略都比你好的痛苦

    - 對自己的方法永不滿意的痛苦

    - 持續不斷追求改善優勢的痛苦


    如果你能管理這些痛苦，就能享受成功的長期交易生涯。否則註定掃地出門。


    如果你發現自己在交易上正在做某些容易的事，務必提高警覺。請記住，通常是困難的選擇，才會導致交易成功。研究、學習和執行本書提到的觀念很難。研究走勢圖尋找可以交易的重複型態很難。閱讀和研究市場理論很難。學習軟體程式以回測策略很難。將策略寫成程式以回測很難。以
    TEST 程序驗證方法很難。計算個人的破產風險很難。迅速認賠很難。慢點才將獲利落袋很難。小額交易在交易上難以引起激情，所以很難。買進更高的高點很難。在更低的低點賣出很難。永遠都要提防簡單的選擇，因為那通常是錯誤的選擇。


    就像一篇好故事，交易生涯的情節也有起點、中段和終點。剛開始時，你會熱衷於賺錢；在中段，你會著手展開許多冒險，取得交易成功；到了終點，你會因為失敗的經驗而感到失望。但是，對於極少數的天之驕子來說，他們的終點會是財務獨立、為自己交易，以及不必向任何人報告。成功交易通則也有起點、中段和終點，我希望它有助於你加入交易成功的極少數天之驕子的行列。


    請記住，你不必搶著開始交易。依循交易通則，按部就班。它們會促使你回歸基本要素，回到交易成功基本面的核心真理。進場交易搶第一，沒有人會給你金牌。只要民主制度和資本主義還在，一定有某個市場、在某個地方、有許多可以進場交易的格局在等你。

