    這些都凸顯了一個要點。業餘交易人花大把時間尋找完美的進場技術，等不及要進入市場，開始交易；他們沒有花時間去學習、了解和執行成功交易通則。難怪會有那麼多人交易失敗。

    為了證明我的看法，我使用腦海中想到的交易字詞，在Google上迅速完成搜尋。表12.3彙總了每個字詞的Google搜尋結果。我這麼做並沒有依據什麼科學，我只是輸入我能想到的字詞。但是請看看點擊次數第二高的搜尋字詞——「交易進場」(trading
