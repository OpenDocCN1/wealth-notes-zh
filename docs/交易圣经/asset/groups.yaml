    第一個基本關係是穩定的支撐和阻力。我們在走勢圖上用水平線畫出來。第二個基本關係是動態或發展中的支撐和阻力水準。我們在走勢圖中以傾斜的趨勢線畫出來。第三個基本關係是在交易人和投資人之間。我們使用顧比多重移動平均數（Guppy
    Multiple Moving Average）去了解和分析這個關係。這些是我了解市場的基礎，因為它們告訴我其他人是怎麼想的。

    謙卑意味著我接受走勢圖和價格行為型態所產生的訊息。有時候，我認為市場錯了。它不應該下跌。我已經學會，如果我的意見與市場價格行為相左，就要忽視自己的意見。謙卑意味著我會傾聽走勢圖說的話。當你傾聽，就能聽到錢在講話。所以我的一段簡單忠告就是這樣。在市場中保持謙卑，市場就會獎賞你。


