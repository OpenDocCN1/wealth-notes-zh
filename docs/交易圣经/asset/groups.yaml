    為了證明我的看法，我使用腦海中想到的交易字詞，在Google上迅速完成搜尋。表12.3彙總了每個字詞的Google搜尋結果。我這麼做並沒有依據什麼科學，我只是輸入我能想到的字詞。但是請看看點擊次數第二高的搜尋字詞——「交易進場」(trading
    entry)。如果你認同Google合理反映人們對網際網路的興趣，那麼你也會認同，交易人確實花了許多時間，試圖尋找零風險、百分之百準確完美的進場技術。如果你是其中之一，我勸你不要再白費心思。世界上沒有完美的進場技術。更重要的是，時間應該花在遠比這更有效益的地方，我建議你從成功交易通則做起。

    順帶一提，市場大師的忠告有一點相當耐人尋味。他們的忠告可以用實務交易的三大支柱做分類：資金管理、交易方法和交易心理。如你所知，我個人將資金管理放在交易方法之前，交易方法又在交易心理之前。但圖12.2的分布情形和我的見解相左。

    十五個交易人中，只有兩位建議你專注於資金管理的元素。七位建議你專注於交易方法，而六位建議你專注於交易心理。

    儘管十五位交易人的樣本在統計上不具顯著性；但是，由於很難聚集這麼多經驗豐富且成功的交易人於一堂，所以我樂於觀察一致性的觀點。根據市場大師的意見，交易方法排在交易心理之前，交易心理又高於我認為最重要的資金管理！

    交易心理拿到那麼高分，我不驚訝，因為我知道我對心理面的想法和大多數人相反。但是，我對於資金管理排名較低感到驚訝。但這正是我邀請他們提供建言的理由。我希望你傾聽他們強調的重點。我已經把我的想法告訴你，而他們也告訴你他們的想法，以平衡我的意見。所以我希望我已經成功地以這些極其成功交易人的忠告，讓我的通則更平衡且圓滿。


    本書在此已接近尾聲，但在真正結束之前，我在下一章還有最後幾句話要說。


