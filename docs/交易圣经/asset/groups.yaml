  - '[PAGE 96]


    採用商業系統交易（假設它們相當穩健）。你的信念系統並沒有「轉到」系統的期望值。唯有你內心的信念系統無條件接納一種方法，才能用它於交易。這是你的「頭腦」在作用，也是為何心理面是必須跨越的障礙（但心理並非凌駕一切的征服者），好在交易中生存且壯大。


    對你所用方法發展強大信念系統的最好方式，是盡你所能，模擬即時的交易狀況，而TEST程序可以做到這點。如果你所用的方法可望得到正期望值，信念系統會知道，並且接納它，使你更容易在即時交易中遵循不悖。


    # 電子交易模擬器


    許多電子經紀商允許客戶開立假帳號，以測試交易技能。這些假帳號可以做為交易模擬器，測試方法。在使用TEST程序之前，先用這類假帳號實地測驗方法，相當有用。我不會用它們代替TEST程序，因為我相信交易夥伴監視交易績效的好處無可取代。沒有其他做法比得上有個人盯著你，真正專注去交易，彷彿在真實的市場拿真實的金錢去冒險。因此，遵循TEST程序，驗證期望值，是不可妥協的一步。這是交易旅程的必要環節。但是，我可以理解以假帳號做為TEST的前導測試的好處。


    # 小結


    啟蒙是第二項成功交易通則，而且我相信是最重要的。啟蒙畫出定義清楚的界線，讓你在裡面運作。如果你待在那裡面，你會有更高的生存機率，因而在交易上獲得成功。啟蒙的目標是協助你避開破產風險。避開破產風險，就會成為成功的交易人。'
