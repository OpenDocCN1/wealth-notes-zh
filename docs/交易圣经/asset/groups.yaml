    固定資本交易人會蒙受 70,000 美元的虧損和 58% 的報酬！固定比率交易人會蒙受 70,000 美元的虧損和 13% 的報酬。對固定資本交易人來說，這幾乎已經是財務破產！雖然這種規模的災難性虧損不可能發生，但如果真的發生，固定資本交易人很可能向市場說再見。至於固定比率交易人，就算是運氣不好，但還是能夠生存，繼續待在場內交易。


    我們來更深入觀察每一項資金管理策略，以及探討固定資本在何處和為何崩垮，而固定比率仍屹立不搖。


    前面說過，固定資本累增合約的速度比較快，因為在每一個較高的合約水準上，每一口合約需要賺取的利潤比較少。第一口合約需要賺 10,000 美元的利潤，才能交易第二口合約。當你交易七口合約，每一口合約只需要賺
    2,143 美元的利潤，就能開始交易八口合約。固定資本增加合約口數需要的努力不等。


    這種不等的努力創造了「紙牌屋」。它使得幾何利潤看起來相當驚人，卻沒有揭露根底的脆弱。每口合約發生 10,000 美元的災難性虧損，會使 120,000 美元的帳戶發生
    58% 的報酬。如果這不足以達到你的破產點，那麼 140% 的不對稱槓桿肯定會使你淚流滿面，尤其是因為你只能交易三口合約，以賺取回補虧損所需的 140% 獲利。


    現在來看看固定比率。圖 8.11 勾勒了固定比率的資金管理策略，以及災難性虧損對它的影響。


    如果採用固定比率法，交易的每一口合約要貢獻相等的利潤，才能增加合約口數。你的每一口合約都必須賺到 18,000 美元的利潤，才能提升合約水準。在下一個水準，固定比率將固定資本拋到後頭。一旦帳戶升抵
    38,001 美元，而且能交易二口合約，每一口仍必須賺進 18,000 美元的利潤，才能考慮交易三口合約。


    當交易七口合約，仍然需要每口合約賺 18,000 美元，才能考慮增加到八口合約。 在固定比率下，利潤必須有相等的德爾他貢獻，才能增加合約。這種相等的努力，為交易帳戶製造了堅實的基礎。
    雖然它們的幾何利潤不如固定資本那樣驚人，也確實讓人感覺賺了不少。如果每口合約發生災難性的 10,000 美元虧損，524,000 美元的帳戶只會賠損 13%。這個賠損水準還算容易應付，只需
    15% 的不對稱槓桿獲利就能回補。15% 的不對稱槓桿不只低於固定資本的 140%，而且固定比率即使在每口合約損失 10,000 美元之後，甚至不會掉落到一口合約的水準，而允許你繼續以七口合約去交易，賺取
    15% 以回補損失的 13%。因此，固定比率比固定資本理想。


    ## 固定單位


    圖 8.12 描繪固定單位法下，Forex_Trader 的績效。在我討論它的含義之前，先探討固定單位資金管理。


    固定單位策略是建立在固定風險之上。固定單位資金管理限制每一筆交易於預定的金額風險之內，而這個金額風險，是預定的單位數之函數。你要交易的固定單位數，由你定義。每筆交易的金額風險，計算方法和固定風險相同，也就是拿初始帳戶金額除以想要開始交易的固定資金單位數。計算方法同樣簡單，如下所示：


    每筆交易的金額風險 = 帳戶餘額 / 固定資金單位數


    ### 圖 8.1.2 使用固定單位資金管理策略，Forex_Trader的績效


