    我敢保證，這種事情發生時，你不會那麼神色自若。


    ## 固定比率


    圖8.7顯示應用固定比率資金管理時，Forex_Trader的成果。

    這一節將檢視固定比率資金管理策略。


    固定比率是萊恩·瓊斯（Ryan Jones）發展出來的，並於他

    所寫的《交易遊戲》（The Trading Game）一書中介紹。固定比率

    法（fixed ratio）要求交易人依照「固定比率」，調整交易合約口

    數。此一「固定比率」稱作德爾他（delta），而且和交易方法的

    賭損有關。你可以使用下列公式，計算可以多交易一口合約的下

    一個帳戶水準：


    ```

    下一個帳戶水準 =

    目前的帳戶水準 +（目前的合約口數 × 德爾他）

    ```


    如何計算德爾他，沒有硬性和快速的準則，但務必知道它是

    固定比率資金管理策略最重要的變數。德爾他的變動會影響固定比率的績效——德爾他越高，報酬和賠償會越保守，而比較激進或較小的德爾它，會產生更多的利潤，但是付出的代價，是承受更高的賠償。德爾他應該和交易方法的單一合約賠償連動。


    如果要保守操作，你應該設法讓德爾他大到單一合約在產生最大賠償的時候，仍然有足夠的錢因應起始保證金，以繼續交易，在這種情況中，德爾他需要以下列公式計算：


    德爾他 = 賠償 + 起始保證金


