    ## 圖 9.18 依賴的策略不可靠


    只應付三顆球，如圖 9.19 所示，在執行我的客觀和獨立方法時，繼續保持專注和一致，應用明智的資金管理。我討厭像圖 9.18 那樣，丟三顆以上的球到空中，因為我必須擔心我給的變數值是否正確。我也一直憂慮我所用的方法是否只代表歷史資料配適曲線成功，而不是有效的策略。我會不斷伸手找交易心理藥丸，躺在交易教練沙發上的時間，可能多於坐在交易桌前。不管什麼時候，我只要接三顆球，而不是十顆！


    我就是這樣的人，在本書中，我只能根據自己的經驗和你分享我的想法。


    但願這樣的討論能讓你洞徹，為何大多數方法未能在即時交易中表現良好。我也想讓你知道，儘管我對主觀工具的容忍度為零，但並不是所有主觀工具都不好。


    ## 主觀客觀都用 TEST 把關


    我覺得我的意見很極端。大體來說，我確實將交易世界視為非黑即白。我很單純地相信交易是數字遊戲：了解數字、定義客觀優勢、小額交易、以一致的方式交易、保持耐性交易，就能從風險資本賺得不錯的報酬。未能了解數字，交易的破產風險會高於0%；交易會有負期望值；帳戶會過度交易；交易時會沒耐性；交易時經常處於緊張和猶疑不決；交易時不遵循交易計畫。交易會失敗。


    但那是我的個人觀點。我也不留給主觀工具和以指標為基礎的方法任何餘地。但那是我的看法，而你也許不一樣；你可能偏愛指標或其他的主觀工具。若是如此，我想讓你知道，並不是所有那樣的方法都會賠錢，因為我確實知道有些成功的指標基礎方法。但我要告訴你的是，它們也都是簡單的方法，而且最成功的只使用只有一個變數的單一指標。它就是那麼簡單。這套策略在範圍廣泛的變數值都能賺錢。所以請不要對所有的指標都失去信心，因為有一些是好的，而且確實擁有優勢。但是它們的效果有賴於簡單的策略。


    如果你你的交易方法偏向主觀工具或分析，也沒關係。我只是認為，你會發現它們較難建立可交易的優勢。但你當然可以放手打造任何方法，只是在用它交易之前，還是需要透過TEST程序，去驗證方法的期望值。這是最後一道門、最後一關、你所用方法是否有效的最終仲裁者。


    此外，選擇主觀工具的一個方法，是找出交易人已經成功使用多年的主觀工具。一種工具能長期幫交易人即時從市場獲利，它就能永存不朽。


    另一種方法可能是為自由裁量型方法尋找軟體解決方案，軟體程式將獨立提供分析和尋找交易格局。你甚至可以納入以指標為基礎的方法。但是這裡的訣竅，是不去動變數的出廠設定值。你將必須視它們為固定的，因為當你操弄變數值，方法就不再獨立於你，也不再保持客觀。從那時起，它就變得太過主觀、太有彈性、太過不穩定，也太過不可靠，以至於不能依賴。這個的觀念是接受軟體或一組指標的原貌，你要和它們保持距離。


    舉例來說，對艾略特波浪有興趣的交易人，可以考慮Advanced GET之類的程式，它會根據它對市場的艾略特波浪的解讀，獨立找到交易格局。你不要改變程式中的任何變數。你必須讓它自己去算波浪，然後提出它自己的分析。接著你需要看看交易格局是否能用TEST程序去驗證，以確定那種方法在你手中是否行得通。Advanced
    GET會隨著市場的變動而改變它計算的波浪數和交易格局，這點是挫折感所在，但至少是一致而獨立。這正是關鍵。它對市場狀況的解讀，前後一致。雖然這種方法相當主觀，交付的卻是客觀結果。只要你會去干預任何變數設定，它就會獨立且一致。你只要讓程式在電腦上跑，讓它做自己的事就行。你必須讓它獨立於你之外。請記住，不要插手操弄。我不知道它找到的交易格局是否足以獲利。你需要確定自己和交易夥伴都獨立使用TEST程序。但是，我喜歡它的地方，在於它是湯姆·約瑟夫（Tom
    Joseph）在1981和1986年之間寫的老程式，之後才在1986年公諸於世。它已經存在很久的時間。如果你能讓變數保持出廠設定值，並且成功使用TEST程序去驗證交易訊號，那麼你可能給自己找到了一個經過驗證且客觀的（由於這個軟體確實獨立於你之外做分析）主觀交易方法（艾略特波浪是主觀的）。以上提供你參考及思索。


    提醒你，如果你幸運找到一種正期望值方法，裡面包含主觀的工具，而且能用TEST程序驗證，你必須了解，和簡單而絕對客觀獨立的方法比起來，主觀方法的穩定度較低。這是因為簡單方法的活動組件較少，出錯的機會也較低。


    雖然有掃興之虞，我還是想分享柯林斯的《贏得市場》一書中，提及查理·賴特（Charlie Wright）的觀察：


    我們的研究發現一事足堪玩味，那就是指標到頭來一無是處。


    這個觀察來自經營一家成功基金管理企業的賴特。他是涉足市場三十餘年的機械型交易人。他透過在市場交易、研究、發展和基金管理的那些年頭，相信指標一點都不重要。這雖然只是賴特的個人意見，但他有資格說這些話，因為他經驗豐富而且交易非常成功。此外，這只是概述，而任何原則都有例外。


    ## 以不變應市場萬變


    有支強大的交易思想學派，相信交易方法需要保持彈性，以因應不斷變動的市場狀況。他們表示，市場會變動，所以交易人所用的方法也應該跟著變動，以因應新狀況。


    他們說得沒錯。市場確實會在你相信自己理出頭緒之後不斷且經常變動。市場不斷在多頭走勢和空頭走勢期間，從箱型區間起伏不定，走向擴張和展現趨勢。所以市場表面上確實在變動。而且持平而論，如果市場一直在變動，交易人怎麼能用一種方法應對所有市場狀況？我聽過這種說法，但我不同意。


    我相信，一個好方法面對所有市場狀況都行得通。我不是說一種方法應該能在每一年的每個市場中都賺到錢。這幾乎不可能。但我確實相信，設計良好的簡單方法，應該能在長期內，在出現各種市場狀況（多頭走勢、空頭走勢、價格密集的箱型區間交易，或是一清二楚的順勢交易）的許多市場交易中獲得利潤。


    誰對誰錯？都對，也都錯。經驗非常豐富的交易人能夠辨識訊號，知道何時將策略從空頭市場模式切換到多頭市場模式，從箱型區間擺盪交易，切換到清楚的折返和突破順勢交易。但他們經驗非常豐富，而且不是每次都對。他們是交易界的精英，非常接近交易光譜的登峰造極之境，一般交易人根本無法望其項背。他們幾乎是神隱、神話般的交易人。他們是傳奇。


    較平凡的交易人則喜歡一以貫之，不管面對什麼情況，都用簡單而客觀的穩健方法去交易，並且依賴資金管理、一致性、紀律和毅力而成功。例如我不久之後就要討論的，使用遠近馳名的海龜交易策略的那些人。至於一般交易人，我建議他們採用一種不錯的方法，在所有的市場狀況中交易，直到他們發展出必要的專門知識技能，而這是很難取得的。


    ## 方法可以互補加乘


    你可以考慮另一種方法，就是發展兩個獨立且互補的順勢與逆勢（短線波段）交易方法。


    理想情況下，它們都百分之百客觀且獨立，而且在許多市場裡，不管遇到什麼市場狀況都行得通。它們可以獲利，並且能夠獨立自主運作。但是當你結合它們的淨值曲線，你會看到曲線呈現較平滑的帳戶餘額走勢。當順勢交易方法頗難行，逆勢方法仍可望享有利潤，反之亦然。


    你的目標是發展、結合相輔相成且獨立的方法。一旦做到這一點，你也應該橫跨時間架構，進一步分散策略。你應該發展較短期或較長期的順勢與逆勢交易方法。我就是這麼做。我橫跨多個時間架構，在全球指數與貨幣市場，交易一個機械型順勢與逆勢方法的組合。


    談過我對順勢交易方法為何大多失敗的看法後，現在要討論贏家方法的基本屬性。本章的目標之一就是提供框架，讓你得以在裡面發展你自己的交易方法。傳統的順勢與折返工具為何對大部分交易人無所助益，希望你已經了解其中究竟。現在就來看看優良策略的構成元素。


    ## 贏家方法的基本屬性


    優良的策略具備兩個簡單要件：一是協助交易人避開致命的錯誤；二是顧及成功交易的基本策略要素。


    表9.6概括了大部分交易人犯下的致命錯誤。


    優良的方法能確保交易人在交易規模上維持保守態度，任何一筆交易，都只拿帳戶的一小部分去冒險。優良的方法會很快就軋平賠錢的交易。它通常會使用相當小的起始停損點，在部位移動有利於交易人的方向時，跟著調整並跟緊市場。一般來說，良好的方法會遲遲軋平賺錢的交易，允許市場告訴你所用的方法何時獲利了結。一般來說，優良的方法不會運用獲利目標。優良的方法通常會橫跨一個市場組合運作。優良的方法通常是客觀的，允許任何人用它去交易，並且享有相同的成果。一般而言，優良的方法極少運用包含主觀變數的任何工具。


    根據我的經驗，贏家方法有些通性。說通性是因為總有例外。有些成功的交易人，很快就獲利了結。還有些交易人，使用的方法只在兩三個市場行得通。也有些交易人，使用的方法用到主觀的工具。更有些交易人，確實運用獲利目標。但是，如同我說過的，他們是例外。


    成功的方法也顧及成功交易通則的基本策略要素，如圖9.20所示。


    贏家方法不是隨機而生。它們有結構，是一套有邏輯的信念，關乎市場如何運作。折返順勢交易相信市場在往趨勢行進的過程中，會穿越平均反轉值而上下波動。雖然市場並非時時都有趨勢，但一旦展現趨勢，它們會往前衝刺和停頓；它們會擴張和


    ## 表9.6 大部分交易人犯下的致命錯誤


    - 過度自信，每筆交易拿太多錢去冒險

    - 不良的輸家，不肯迅速認賠

    - 不使用停損點

    - 不尊重停損點

    - 不使用小停損點

    - 不調整停損點

    - 不良的贏家太快獲利了結

