    # 交易人的多樣性


    正如前面提過的，本章收錄了各式各樣的市場大師，有些高調，有些低調極重隱私，有些曾經贏得交易冠軍。我相信自己非常幸運，能夠找到這麼一群形形色色的成功交易人。我也想說，他們慷慨大方，願意貢獻意見，真的令我受寵若驚。在我繼續談下去之前，我想讓你知道，除了馬克·庫克曾於1992年贏得美國投資冠軍賽（U.S.
    Investing Championship），接下來還有其他奪標交易人出場，如表12.1中的標示。我很幸運，本書能網羅最近的羅賓斯世界盃期貨交易冠軍賽（Robbins
