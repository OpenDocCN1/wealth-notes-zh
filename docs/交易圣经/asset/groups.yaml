    # 擁抱交易的聖杯


    發現交易真正的聖杯，是啟蒙的一環。你可能聽過有人（我以前就是）追求完美的交易系統。所謂完美的交易系統，是指準確率非常高，賠損少之又少——也就是交易的聖杯。我敢說，知道交易系統的聖杯並不存在，一點不叫人驚訝。


    但是我心中確實有個交易的聖杯：一種能夠產生正期望值、可以跨多重機會進場交易的方法。如圖4.7所示。


    假使你避開破產風險而存活下來，那麼你的目標就是運用經過驗證的優勢與多重交易機會。只有這樣，你的交易帳戶才會增


