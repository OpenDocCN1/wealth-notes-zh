    \ TEST 程序去驗證你所用方法的期望值，那麼你就應該使用它。\n\n預測者提供給你的分析，是你所能遇到最有趣的，即使可能不是最賺錢的。我要在這裡承認：在我的交易生涯的頭十五年，我是艾略特波浪的信徒，而在那段期間稍後，我又加上幾何。我必須說，對我而言，那段期間是我在分析市場所享有最具創意和歡樂的時光。沒有什麼事情比得上它。1998\
    \ 年之後，我成了無聊的機械型交易人。我向你保證，機械型交易人擁有的樂趣或歡笑，不及使用艾略特波浪和幾何跨越多重時間架構去分析市場價格和時間的一半。但是就我來說，我沒辦法使用艾略特波浪賺取利潤，而且我從經驗得知，對我而言，交易本是無趣的工作！\n\
    \n## 》夢想者\n\n夢想者是指使用下列指標、但不限於這些指標的交易人：\n\n- 平均動向指數（average directional index：ADX）\n\
    - 動向指數（directional movement index；DMI）\n- 包絡線（envelopes）\n- 比率分析（ratio analysis）\n\
    - 移動平均分合指標（Moving Average Convergence/Divergence；MACD）\n- 移動平均數（moving averages）\n\
    - 價格變動率（rate of price change）\n- 相對強弱指標（relative strength indicator：RSI）\n- 隨機擺盪指標（stochastic\
    \ oscillator）\n\n我把這些交易人稱為夢想者，是因為大部分指標都是從價格衍生出來的，包含可調整的參數。因此，它們代表二手的曲線配適資訊。我覺得，交易人如果相信他們交易這種二手可調整資料會賺錢，他們就是夢想者。雖然這只是概括而言，對所有的指標來說不一定成立，但大部分指標確實落後市場的價格行動，並且允許交易人依賴太多的彈性去賺錢。\n\
    \n但是，如果指標確實吸引你的注意力，那麼你應該去研究。大體而言，最好是使用比較少的指標。此外，你不應該讓指標的選擇壓垮你。指標應可以辨識以下各點：\n\n\
    - 價格\n- 趨勢\n- 折返\n- 動量\n- 人氣\n- 波動性\n- 成交量\n\n或者以上的組合。箇中秘訣是為每一個市場結構領域選擇一個指標，並且避免加倍。如果指標的選擇有助於你持續不斷確認潛在的支撐和阻力水準，而且你能使用TEST程序驗證你所用方法的期望值，那麼你應該使用它們。\n\
    \n## 》務實者\n\n務實者是指使用下列某種分析形式的交易人：\n\n- 突破分析\n- 走勢圖分析\n- 道氏理論\n- 跨市場分析\n- 市場概況\n\
    - 型態分析\n- 樞軸點分析\n- 季節性\n- 價差分析\n- 統計分析\n- 報價閱讀\n- 成交量分析\n\n務實者的注意焦點放在原始價格和原始成交量上。他們對自己無法控制的事情沒有興趣，對於展望未來也不感興趣。他們寧可不和指標等代用品打交道，而是專注於真材實料的東西，那就是價格。\n\
    \n根據我的經驗，你會在務實者這個類別找到最多的成功交易人。1983年以來，我時進時出這些不同的類別。自1998年起，我加入務實者的陣營。但在那之前，我花了整整十五年的時間當預測者，其中有十二年是使用艾略特波浪，接下來三年是用幾何。那段期間，我有時會跳進夢想者的陣營，被電腦螢幕上五顏六色的色彩所催眠。\n\
    \n![](img/4cb0a78760f87b9407822631d12abbf8_219_0.png)\n\n圖9.2 確認支撐與阻力的簡單概念\n\n\
    到頭來，你必須找到對你有用、能夠持續不斷確認潛在支撐與阻力水準的方法。只要你所用的方法管用，而且能夠使用 TEST程序加以獨立驗證，就不必限制蒐尋範圍。\n\
    \n你應該對這些選擇保持開放，並享受你的調查之旅。圖9.2說明確認潛在支撐與阻力水準的簡單觀念。\n\n這張圖顯示務實者陣營以簡單的方式使用價格和走勢圖分析的情形——前一個波段低點被用來確認潛在阻力水準。舊的支撐水準往往搖身一變而為新的阻力。這個例子中，阻力水準不只出現在下跌趨勢中，也因為見到市場越走越低，而證實下跌曲線的走勢。\n\
    \n## 交易計畫\n\n你的交易計畫應該告訴你如何掌握利用你的格局。它應該明確指示在何處：\n\n- 進場交易\n- 下停損點\n- 獲利交易出場\n\n\
    進場交易、下停損點，以及部位出場，有許多技術可用。我想跟你分享一個強有力的觀念，它比最佳的進場、停損或出場技術更重要，卻遭到大多數交易人忽視。這個觀念就是：有效的交易計畫應該支持並證實你的交易格局。\n\
    \n如果你你的格局找到一個潛在的支撐水準，你的交易計畫應該在你投入一筆交易之前，預期市場會走高。同樣的，如果你找到一個潛在的阻力水準，你的交易計畫應該等價格下跌，才投入市場。也就是說。如果有支撐，進場價格應該高一點。如果有阻力，進場價格應該低一點。交易的時候，一個好做法是，在市場證明你的格局正確之前，先假設它是錯的。\n\
    \n證實格局的交易計畫，會給市場它應得的尊重。這是如此簡單卻有力的概念，許多交易人卻未能了解。格局不會給你市場可能\n\n![](img/4cb0a78760f87b9407822631d12abbf8_220_0.png)\n\
    \n圖9.3 交易計畫支持格局\n\n可能的走向，而且它們不會時時都對。良好的交易計畫不會盲目遵循你的格局。太多交易人未能區分交易格局和交易計畫，將技術面分析和交易混為一談。有個交易計畫等著市場證實你的格局，並不能保證市場會持續往你的方向走；但是，它能防止你執行許多邊際交易。\n\
    \n本質上，優良的交易計畫應該要你付出較高的價格以作多，賣出較低的價格以放空。圖9.3即是一例。\n\n這張走勢圖畫出圖9.2看到的阻力水準。它畫出舊支撐成了新阻力。這個例子中，有兩個格局確認了潛在的阻力。優良的交易計畫不會只在阻力點設個價格掛單賣出，而是等到市場接近收盤才行動。如果市場顯得疲弱，有效的交易計畫會設法進場交易。如果市場收盤價格低於前一天的收盤價，也低於當天的開盤價，優良的交易計畫會承認市場透露疲態，並且設法放空，在市場收盤時賣出。每個例子中，阻力水準不只存在於下跌趨勢中，它們也因為見到市場越走越低，而證實跌勢展開。\n\
    \n市場結構中的許多點，可以用來做為證實交易格局的進場水準。如果你你的格局確認了一個潛在的支撐水準，交易計畫能在進場之前，藉檢查下列各點是否存在，而證實市場展現強勢：\n\
    \n- 當天的收盤價高於開盤價\n- 當天的收盤價高於前一天的收盤價\n- 當天的收盤價高於前二天、三天、四天或五天的收盤價\n- 市場衝破前一天的收盤價或最高價\n\
    - 市場衝破前一週的收盤價或最高價\n- 市場衝破前一個月的收盤價或最高價\n\n反過來說，對潛在的阻力水準而言也是一樣。在決定你的進場水準時，你想怎麼樣就怎麼樣。至於停損和出場水準，有各式各樣的觀念可以利用，而且同樣的，你想怎麼樣就怎麼樣。\n\
    \n設計交易方法，樂趣通常遠遠不及交易本身。但是，不要任令想像力如脫韁野馬，製造出複雜的系統。簡單的方法才經得起時間的考驗。備受尊重的市場參與者湯姆·狄馬克（Tom\
    \ DeMark）曾經和市場怪傑傑保羅·都德·鍾斯（Paul Tudor Jones）共事，目前是SAC資本（SAC Capital）史蒂夫·柯恩（Steve\
    \ Cohen）的顧問。SAC資本是個160億美元的投資基金。他在亞特·柯林斯（Art Collins）所寫的《贏得市場》（Market Beaters）一書說：\n\
    \n歸根究底，在十七名程式設計師和四、五年的測試之後，基本的四、五個系統運作得最好。\n\n也如同克提斯·費斯（Curtis Faith）在《海龜投資法則》（Way\
    \ of the Turtle）一書中所寫：\n\n力求簡單。經過時間考驗的簡單方法，如果執行良好，每一次都會擊敗時髦且複雜的方法。\n\n在設計你的格局和交易計畫時，有許多一般性的原則可以遵循，包括：\n\
    \n- 力求簡單勝過複雜\n- 確保方法合乎邏輯，不要依賴隨機拼湊的構想大雜燴\n- 將可調整變數的參數數目減到最少，減低曲線配適的風險\n- 使用起始、損益兩平和追蹤停損點的組合\n\
    - 在合適的時候使用時間停損點\n- 偏愛動態停損點甚於固定的金額停損點\n- 對獲利目標提高警覺，因為它們通常會減低獲利力\n- 以追蹤停損點做為獲利部位出場的有效方法\n\
    \n## 進場和出場都重要\n\n是的，沒錯。如果你 Hank 在市場待得夠久，你可能會聽到一種信念，說進場沒有那麼重要；出場才重要。支持者會指著市場趨勢強勁的一張走勢圖說，這麼大的波動，進場根本無關緊要；什麼時候出場，以確保交易人捕捉趨勢的一大段，才重要。而且，沒錯，事後來看，你能夠理解他們觀察到的事情。一段大波動之後，出場會很重要，而且相對於進場更為重要，以確保交易人將盡可能多的利潤落袋。沒人樂於將利潤吐回去。但這都是事後之見。支持者在談這件事的時候，都會拿出一張非常完美的走勢圖，上面顯示市場已經展開強烈的趨勢。當我讀到或聽到這種事，自然而然就會懷疑那個人的交易信用。\n\
    \n其實進場極其重要。它們直接界定停損點、起始風險和潛在虧損。虧損大小相對於獲利，直接影響期望值！請記住，進場交易是為了掌握賺得期望值的機會。\n\n當你進場交易，你根本不知道那筆交易會不會享有強勁的趨勢。當你進場交易，你並沒有先見之明。你手上沒有一顆水晶球。你無法當事後諸葛。你擁有的只是現在，而現在要考慮的只是控制風險，以及藉交易以掌握賺取期望值的機會。\n\
    \n此外，由於進場界定了起始風險，也直接影響部位規模資金管理策略。起始停損點越小，可以建立的部位規模越大。請記住，資金管理是生存和賺取厚利的秘密。進場因此極其重要，不管你的時間架構為何。而這對準確率非常低的長線交易人來說格外重要，意思是說，一旦他們終於逮到一筆獲利的交易，他們需要最大的部位規模，才能彌補67%的虧損交易！\n\
    \n所以我向來懷疑一些人表示進場沒那麼重要、而且比出場更不重要的說法。我認為，進場極其重要！它們直接影響起始風險，進而影響資金管理部位規模，而這直接影響生存和賺取厚利的潛力。總之，進場極其重要。\n\
    \n## 避免大停損點的致命吸引力\n\n讓交易方法看起來會獲利最簡單的技術，是使用大停損點。大停損點容允交易方法很大的空間和時間，以達到獲利目標或出場點。但是，我認為，大停損點遲早會出事而傷害你。\n\
    \n交易人通常會不斷加大停損點規模，直到他們所用的方法產生看起來可以接受的假設性淨值曲線。他們不知不覺將他們的方法以曲線配適的方式套用到歷史資料上。增加停損點規模，就能避免發生一連串的虧損交易，避免讓他們的交易方法看起來績效很差。他們相信，自己發現了最適當的停損點。但他們所做的事，不過是拿所用的方法去和資料作曲線配適。\n\
    \n由於市場的最大逆境，他們開始交易時，市場會給他們始料未及的一連串異常虧損，無一例外。虧損如此之大，他們不是打消念頭，不再交易，就是虧損損害他們的帳戶到無法修補的地步，迫使他們不得不停止交易。他們會到達破產點。\n\
    \n此外，大停損點會妨礙資金管理策略增加部位規模的能力。\n\n停損點直接界定起始風險。起始風險直接影響部位規模資金管理策略。起始停損點越小，你能建立的部位規模越大。停損點越大，起始風險越大，部位規模就越小。請記住，資金管理是生存和賺取厚利的秘密。\n\
    \n這件事極其重要。請仔細聽好。根據假設，一種方法操作單一合約，成果看起來相當好，產生不錯的正期望值。但是，當你應用你偏好的資金管理策略時，你總是會發現，所用方法的績效受到妨礙。大停損點會拖累資金管理策略累積合約或增加部位規模的能力。\n\
    \n應用資金管理時，一種方法如果使用較小的停損點，有較低的期望值，所賺的錢會遠多於使用較大的停損點，期望值較高的方法。較大的停損點會毀了資金管理的績效。較大的停損點會毀了厚利。如果資金管理是高額利潤背後的秘密（事實上就是如此），那麼小停損點是極可觀利潤背後的秘密。\n\
    \n季節性交易的支持者通常鼓吹使用大停損點，有時超過市場波動的3%。許多季節性格局需要極大的停損點，好讓「季節性」傾向因為高準確率，看起來很可靠。但是它們的高準確率往往是來自所用的大停損點，和市場的季節性無關。務必提防和避免使用大停損點。大停損點會害人。\n\
    \n## 透過 TEST 證實期望值\n\n一旦你設計好交易格局，以確認潛在的支撐和阻力水準，並且發展一套交易計畫以證實和利用格局，你接下來的一步是使用 TEST\
    \ 程序，驗證你所用方法的期望值。\n\n如果期望值是正數，而且淨值曲線相當穩定，不必依賴一兩次可觀的交易，你就可以滿懷信心地相信自己已經發展出一套不錯的方法。\n\
    \n你的最後一步，是結合你偏愛的資金管理策略和你所用經過驗證的交易方法，並且使用來自 TEST 結果的準確率和平均獲利相對於平均虧損的報酬比率，計算你的破產風險。你的目標是以統計上的\
    \ 0% 破產風險去接觸市場。請記住，能生存，交易就會成功。\n\n理論是如此，但這是個好理論，而且根據我的經驗，這是正確的。但是我現在想花點時間討論交易方法在順勢交易方面的實務意涵。\n\
    \n## 順勢交易\n\n雖然理論不錯，但我相信，看看交易方法的某些實務意涵也有幫助——尤其交易方法是期望值的支撐，而期望值是對抗破產風險的關鍵武器之一。就目前為止討論過的每一件事來說，我相信除了實際上的成功交易，交易人面對的最大挑戰，是發展穩健的正期望值方法。交易方法其實就是期望值，只是換個不一樣的名字而已，因此我覺得花點時間探究影響方法的一些關鍵問題，十分重要。\n\
    \n首先，我要討論關於順勢交易的四大重要事實。接著，我會繼續討論任何優良的順勢交易方法的核心目標，也就是尋找支撐和阻力水準。再來，我會用一些篇幅描述為何順勢交易應該求其簡單。再下來，我會提醒你為什麼要交易（而不是為何要獲利），然後深入探討許多人覺得順勢交易之所以困難的原因。這會帶出一些關鍵問題。\n\
    \n但願如此詳細討論發展交易方法的實務意涵，能給你一個有用的架構，發展順勢交易策略。希望你能藉此找到一些標竿，能夠用以調整自己的想法。此外，也願你能從中得到一些真知灼見，管窺你目前所用的方法（如果有的話）為何不如你希望的那麼成功，以及你對此可以怎麼做。\n\
    \n## 四大重要事實\n\n我們先來談順勢交易的四大重要事實：\n\n- 事實一：順勢交易是最安全的交易方式\n- 事實二：趨勢帶動市場，是所有利潤的基礎\n\
    - 事實三：順勢交易人很可憐，因為 67% 的交易會虧損！\n- 事實四：順勢交易有兩種方式\n  - 突破交易\n  - 折返交易\n\n第一，順勢交易是最安全的交易方式。反其道而行，也就是逆勢交易，會使你置身於設法抓頭部和抓底部的處境，或者成為短線波段交易人。我並不是說逆勢交易或短線波段交易行不通，因為它確實行得通。只是很難執行成功，而且本質上相當危險，因為你是逆勢交易。我不建議掙扎求生的交易人採行這種策略。逆勢交易確實需要更多的知識和技能。依我的看法，順勢交易是比較容易攀爬的山。\n\
    \n第二，市場因為趨勢而動。趨勢會帶動市場，這是所有利潤的基礎。抱牢順勢交易的時間越長，賺取厚利的潛力越大。當日沖銷交易人使盡力氣也很難賺取厚利，因為他們受限於市場在一天之中所能波動的幅度。順勢交易人則可以抱牢交易幾個星期到幾個月或更長的時間。\n\
    \n第三，順勢交易矛盾的地方在於，雖然它是最安全的交易方式，卻也是最可憐的交易方式。由於市場很少出現趨勢，順勢交易人通常只能預期三分之一的交易能夠獲利。因此，他們平均有\
    \ 67% 的時間在賠錢！如果你想做順勢交易（我也希望你這麼做），那麼你必須接受這種交易的悲慘事實。你的交易會有 67% 賠錢。你不會知道利潤何時到來。你的大部分時間會花在賠償上。這將相當痛苦，令人沮喪。這會很難受。沒有如果，沒有但是，沒得商量。順勢交易令人難受。\n\
    \n但是，如果你能接受這三個事實，那麼你會站在很好的位置，可望成為成功的順勢交易人。如果不能接受，那麼你需要重新評估你對交易的興趣。最後，順勢交易有兩種基本的方法，兩者都行得通：\n\
    \n- 往趨勢的方向執行突破交易\n  - 絕不錯失大趨勢\n  - 使用大停損點\n- 在趨勢方向折返時交易\n  - 可能錯失大趨勢\n  - 使用小停損點。\n\
    \n在趨勢方向的較高價格或較低價格突破時進場交易，例如著名的海龜通路突破策略，是成功的順勢交易策略。突破策略不等上漲趨勢折返或拉回時才進場作多。它們也不等下跌趨勢跌深反彈或者折返，才進場放空。它們會在上漲趨勢價格高出很多的地方買進，並在下跌趨勢價格低了許多的地方賣出。突破交易的優點是，交易人絕不會錯過重大的趨勢。缺點則是突破順勢交易需要比折返順勢交易較大的停損點。\n\
    \n折返順勢交易需要市場在上漲趨勢中暫停，並且拉回，或者在下跌趨勢中跌深反彈，再進場交易。折返順勢交易的缺點是，有時強勁的趨勢市場並不提供折返機會讓交易人進場。折返順勢交易能夠且確實錯失一些大趨勢。但是折返順勢交易的一個優點是，它允許交易人下小得多的起始停損點。\n\
    \n由於我相信你的交易目標是當個優秀的風險管理人，並生存下去，因此我將把重點放在折返順勢交易。它會給你較小的停損點，因此是最低的起始風險。\n\n## 支撐與阻力是王道\n\
    \n究其核心，實務上的折返順勢交易，是在尋找支撐區以買進，以及尋找阻力區以賣出。這並不是深奧的火箭科學。\n\n除非你相信市場已經找到支撐，否則為何要買？除非相信市場已經遇到阻力，否則為何要賣？這兩種情況，如果不相信，你都不會進場交易。交易不只是確認支撐和阻力水準，更是在確認良好的支撐和良好的阻力水準。良好的支撐水準存在於上漲趨勢中，並且證實上漲趨勢確實在行進之中。良好的阻力水準存在於下跌趨勢中，並且證實下跌趨勢正在行進之中。\n\
    \n這些定義一針見血，點出了成功的折返順勢交易的精義。\n\n上漲趨勢中，交易人應該只設法確認良好的支撐水準，以進場作多。下跌趨勢中，他們應該只確認良好的阻力區，以進場放空。\n\
    \n此外，交易人需要接受價格波動的一個核心信念：價格不會直線移動。它們會上下起伏，不會走直線，如圖9.4所示。\n\n![](img/4cb0a78760f87b9407822631d12abbf8_229_0.png)\n\
    \n圖9.4 價格的非線性\n\n價格會時而向上，時而向下，而且不管漲或跌，都不會以相等且十分清楚的線性量數，往一個方向行進。上漲趨勢會有彈升和拉回（折返）。下跌趨勢會有價格下跌和跌深反彈（折返）。\n\
    \n市場不會毫不停止地往一個方向行進。成功的折返順勢交易如圖9.5所示，會見到交易人在上漲趨勢拉回之後建立多頭部位，以及在下跌趨勢跌深反彈之後建立空頭部位。\n\
    \n折返順勢交易人取得成功的一個重要因素，是他們耐心等候拉回和跌深反彈，也就是上個價格趨勢的折返。他們曉得，在上漲趨勢中，市場需要先回跌，才再上漲。他們曉得，在下跌趨勢中\n\
    \n![](img/4cb0a78760f87b9407822631d12abbf8_230_0.png)\n\n# 圖9.5 折返順勢交易\n"
  mdcn: "\n狂熱，以及過高的收費，可能讓人分心，沒有考慮到甘恩的那些要素是否值得一試。\n\n如果你對甘恩感興趣，你應該去研究它，或者研究其他任何預測者的方法，並且觀察它能否持續不斷協助你找到潛在的支撐和阻力水準。如果是，而且你能透過\
    \ TEST 程序去驗證你所用方法的期望值，那麼你就應該使用它。\n\n預測者提供給你的分析，是你所能遇到最有趣的，即使可能不是最賺錢的。我要在這裡承認：在我的交易生涯的頭十五年，我是艾略特波浪的信徒，而在那段期間稍後，我又加上幾何。我必須說，對我而言，那段期間是我在分析市場所享有最具創意和歡樂的時光。沒有什麼事情比得上它。1998\
    \ 年之後，我成了無聊的機械型交易人。我向你保證，機械型交易人擁有的樂趣或歡笑，不及使用艾略特波浪和幾何跨越多重時間架構去分析市場價格和時間的一半。但是就我來說，我沒辦法使用艾略特波浪賺取利潤，而且我從經驗得知，對我而言，交易本是無趣的工作！\n\
    \n## 》夢想者\n\n夢想者是指使用下列指標、但不限於這些指標的交易人：\n\n- 平均動向指數（average directional index：ADX）\n\
    - 動向指數（directional movement index；DMI）\n- 包絡線（envelopes）\n- 比率分析（ratio analysis）\n\
    - 移動平均分合指標（Moving Average Convergence/Divergence；MACD）\n- 移動平均數（moving averages）\n\
    - 價格變動率（rate of price change）\n- 相對強弱指標（relative strength indicator：RSI）\n- 隨機擺盪指標（stochastic\
    \ oscillator）\n\n我把這些交易人稱為夢想者，是因為大部分指標都是從價格衍生出來的，包含可調整的參數。因此，它們代表二手的曲線配適資訊。我覺得，交易人如果相信他們交易這種二手可調整資料會賺錢，他們就是夢想者。雖然這只是概括而言，對所有的指標來說不一定成立，但大部分指標確實落後市場的價格行動，並且允許交易人依賴太多的彈性去賺錢。\n\
    \n但是，如果指標確實吸引你的注意力，那麼你應該去研究。大體而言，最好是使用比較少的指標。此外，你不應該讓指標的選擇壓垮你。指標應可以辨識以下各點：\n\n\
    - 價格\n- 趨勢\n- 折返\n- 動量\n- 人氣\n- 波動性\n- 成交量\n\n或者以上的組合。箇中秘訣是為每一個市場結構領域選擇一個指標，並且避免加倍。如果指標的選擇有助於你持續不斷確認潛在的支撐和阻力水準，而且你能使用TEST程序驗證你所用方法的期望值，那麼你應該使用它們。\n\
    \n## 》務實者\n\n務實者是指使用下列某種分析形式的交易人：\n\n- 突破分析\n- 走勢圖分析\n- 道氏理論\n- 跨市場分析\n- 市場概況\n\
    - 型態分析\n- 樞軸點分析\n- 季節性\n- 價差分析\n- 統計分析\n- 報價閱讀\n- 成交量分析\n\n務實者的注意焦點放在原始價格和原始成交量上。他們對自己無法控制的事情沒有興趣，對於展望未來也不感興趣。他們寧可不和指標等代用品打交道，而是專注於真材實料的東西，那就是價格。\n\
    \n根據我的經驗，你會在務實者這個類別找到最多的成功交易人。1983年以來，我時進時出這些不同的類別。自1998年起，我加入務實者的陣營。但在那之前，我花了整整十五年的時間當預測者，其中有十二年是使用艾略特波浪，接下來三年是用幾何。那段期間，我有時會跳進夢想者的陣營，被電腦螢幕上五顏六色的色彩所催眠。\n\
    \n![](img/4cb0a78760f87b9407822631d12abbf8_219_0.png)\n\n圖9.2 確認支撐與阻力的簡單概念\n\n\
