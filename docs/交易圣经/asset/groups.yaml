    市場之中，我會因為相信自己錯失了下一波的大走勢而心痛。當我費心研究新觀念之後，才發現它們沒有用，心會痛。我知道最大逆境會使我的交易經驗充滿失望和痛苦。我知道它意圖減低我的風險資本，阻止我交易。我知道最大逆境存在，也曉得它的能耐。我會忍受它帶來的痛苦。我會不屈不撓。我會成功。


    下一章要討論成功交易的最後一項通則——交易的實踐，融會貫通所有成功交易通則。'
