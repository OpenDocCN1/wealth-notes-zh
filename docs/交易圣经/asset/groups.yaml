    另一件必需了解的重要事情，是使用系統停損點的目的並不在追求最大利潤。使用系統停損點會降低獲利力，因為它會在策略開始脫離損失時，要你退場觀望。你會錯過早期的淨值動量正向恢復走勢，而令你備感挫折。但是，由於系統停損點設計的目的不在追求最大利潤，所以沒有關係。系統停損點是設計來保本用的。我相信，錯過某些獲利機會的代價相當值得，因為你因此可以保存交易風險資本。


