    ## 平衡報導


    收錄本章是為了平衡。目前為止，本書內容都只是一家之言，也就是我的個人意見。我希望借助成功交易人的實務智慧，平衡我對通則的討論。


    我只讓這些交易人了解本書梗概，就是成功交易通則。我給他們看本書各章章名的草稿，提供槪貌，做為他們提出忠告的憑藉。我問他們所有人同樣一個問題：


    以你豐富的交易知識和交易經驗，一定曾有許多人向你討教。如果要你給一位抱負不凡的交易人一段忠告，那會是什麼？為什麼？


    能夠近身觀察市場大師的機會不是常有，現在你即將聽到他們親自為你回答這個問題，我相信你會樂意洗耳恭聽，一探成功交易人的內心世界。


    ## 市場大師


    這些市場大師是誰？其中有些你可能耳熟能詳，有些你不太熟悉，還有一些你可能一無所知。但是他們都是成功的交易人，都慷慨提供寶貴忠告。


    這群超群絕倫的贏家交易人，有些是當紅炸子雞，有些是積極涉足市場超過四十年的市場傳奇，對技術面分析產生重大衝擊，而且今天活躍於市場一如剛起步時。你會遇見操盤金額最大且最活躍的私人
    E-Mini SP500 交易人之一。此外，除了老前輩和新一輩，你也會見到許多中生代交易人。他們都是市場大師，在全球金融危機之後都存活下來，並願意和你分享他們的經驗。


    他們有些是自由裁量型交易人，有些是機械型，有些是混合型；有些使用傳統的技術面分析，有些只遵循單一市場理論，有些是系統交易人；有些是深居簡出的私人交易人，有些是交易人教育界的知名人物，有些是十分多產的交易作者，除了交易成功，還擁有令人艷羨的寫作才華，能與讀者分享想法；有些經營顧問業務，出版成功的資訊信和交易建議；有些是資金經理人，管理個人帳戶和大型基金；有些交易股票，有些交易選擇權，

