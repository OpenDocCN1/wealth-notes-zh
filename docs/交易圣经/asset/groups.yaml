    驗證方法好壞的唯一方式，是將自尊放一邊，依循我的TEST程序，根據你的準則進場交易。稍後會更詳細討論TEST。


    # 資金管理


    繼續過度交易 這個領域，大部分人在交易生涯之初，都為它所苦。雖然許多交易人相信他們了解資金管理，卻仍然在每一筆交易上拿太多錢去冒險。他們的耐性不夠，不想下金額比較小的賭注，以降低自己的破產風險，並以理性的方式，讓他們的帳戶餘額與時俱增。在這些交易人看來，以保守的方式交易，一點都不刺激。


    # 交易心理


    只重利潤，不顧程序 只重利潤並不會賺錢。交易人應該專注於交易程序，而不是利潤——也就是，專注於資金管理、確認格局，並且執行交易計畫。如果你學會專注於交易程序，利潤就會隨之而來。


    缺乏紀律 缺乏紀律是另一個常見錯誤。交易人在用自己的格局和交易計畫交易時，很容易分心，以幾乎隨機的方式進場、下停損點。


    相信市場不可能交易 如果你有幸到了第三年還在交易，而且仍在賠錢，你就會接近山窮水盡的地步。如此一來，你可能犯下相信市場不可能交易的常見錯誤。


    相信有交易祕密存在 一旦你開始認為市場不可能交易，卻又想起有一小群交易人確實獲得成功。交易人因此相信，這一小群賺錢的交易人一定知道「交易秘密」。只有這樣，他們才會賺錢。這是缺乏經驗的交易人唯一的合理結論。'
  - '[PAGE 46]


    # 相信最大的風險是賠錢


    交易人另一個常犯的錯誤，是相信最大的交易風險是賠錢。但是，交易最大的風險是東修西補行得通的方法！在市場交易，感到無聊時，你要抗拒誘惑，不要修改系統，企圖擠出更多利潤。


    # 相心理面最難處理


    到了第三年年底，苦苦掙扎的交易人常犯的錯誤，是相心理面是交易最困難的部分。在買了那麼多書和軟體程式，以及上過那麼多研討會和講習班之後，他們相信自己一定擁有交易成功的知識。他們知道自己不笨，所以他們相信，一定不是交易「知識」讓他們失望，而是「應用」出了問題。他們相信自己的心理面是他們最大的障礙。而這種信念，因為大部分交易書籍表示心理面是交易成功單一最大挑戰而強化。


    雖然心理面很重要，但我個人相信，它並不是交易成功的最大挑戰。


    # 如何打入10%的贏家圈


    簡單說，就是避免私人交易人常犯的錯誤，並且向贏家學習，也就是透過積極的交易、管理數百十億美元的金錢專業商品交易顧問（professional commodity
    trading advisers；CTAs）。他們能夠教你自己的交易上以程序為取向。


    在交易上像CTAs那樣採取程序取向，能界定出探索和體驗的交易邊界。如果做得正確，你可能永遠不會進場交易，而不交易，就不會賠錢，你就會勝過90%的交易人。雖然你可能不會躋身10%的贏家圈，至少不會向贏家的口袋進貢。


    來看看新手交易人典型的旅程，如圖1.1所示。


