    - 附錄C  破產風險模擬結果................................................. 429\n\n## 自序\n\
    \n## 放諸四海皆準的\n交易成功法則\n\n投入交易的每個人都賠了錢。\n沒錯，我是說每個人。\n不管交易的是外匯、股票、商品、選擇權、認購權證，或者差價合約（contracts\
    \ for difference；CFD），每個人都賠錢。即使確實獲有利潤的頂尖交易人，也有許多筆交易賠錢。這個世界上沒有百分之百的準確率。\n關於積極型的交易，有個冷峻的事實：在長期內持續不斷獲利的積極型交易人，不到10%（可能低得多）。聽過那麼多關於交易的行銷炒作，再看這個數字，你可能會嚇一跳。\n\
    儘管光環閃亮，但能在較長的期間內持續賺錢的交易人極少，則是個令人失望的不爭事實。而且，所有的積極型交易人都是如此，不管他們選擇的交易市場、時間架構或工具如何。能在較長期間內持續獲利的交易人有如鳳毛麟角。\n\
    \n你在和別人吃晚餐時，若聽到有人侃侃而談，細數他們曾經在市場上大撈一票的往事，不但不必艷羨，更應該當做耳邊風。你可以在他們重述自己的交易勝利故事時，忽視他們得意洋洋的聲音。這些市場戰士比較有可能是交易笨蛋，不是交易冠軍。他們只編織一半的事實。他們長於顧左右而言他。他們是空心菜，只會講述自己的勝利戰果，不談過去的災難。他們不會分享自己的不幸。他們不會記得自己愚蠢的過去。他們不會談曾經承擔的巨大虧損。而且，請相信我，他們大部分確實曾經蒙受巨大虧損，因為每個人都有過這樣的經歷。這些人，你大可不必理會。\n\
    這是壞消息。\n\n### 輸家不知道的贏家秘密\n\n好消息是，確實獲利的頂尖交易人，不見得知道任何交易秘密。當然，有些人會有很有趣的交易格局和進場、停損和出場技術。但是，也有些頂尖交易人使用簡單到令人不敢相信的觀念。真的非常簡單。然而，不管頂尖交易人使用的個別交易技術是什麼，他們整體的成功都可以追溯到一套「成功交易通則」（the\
    \ universal principles of successful trading）。這些通則可見於所有持續獲利的交易人——獲有利潤的極少數10%交易人。這些通則常見於贏家之中。它們是少數贏家和多數輸家的差異所在。\n\
    \n他們的獲利不是取決於魔法般的單一指標或者交易秘技。他們的獲利不是取決於他們選擇交易的一個市場或多個市場，也不是取決於他們選擇監控的一個時間架構或多個時間架構。他們的獲利也不是取決於他們選擇交易的金融工具。不，他們的成功可以直接回溯到一套成功交易通則。這些通則，大部分交易輸家都不知道。\n\
    \n如果你真的想成為持續獲利的交易人，就需要學習、了解、接納和執行每位持續獲利的交易人了解和遵循的成功交易通則。忽視它們，你的交易註定會失敗。\n\n不管交易標的或交易方法如何，要持續獲利，就要遵循某些首要的基本交易原則。記住，市場就是市場，走勢圖就是走勢圖。所以，不管選擇哪些個別市場交易，或是選擇遵循哪個時間架構，或者選擇交易哪種證券，獲利的交易首先需要的是採用和接納良好的交易程序。選擇監控哪些市場以及交易哪些工具，和採用及執行良好的交易程序比起來，只屬次要，而良好的交易程序，正是成功交易通則所談的一切。\n\
    \n想要交易獲利，就要了解、接受一個簡單的事實：成功的交易人和賠錢的絕大多數人，兩者的關鍵差異不在於個別的進場和出場技術，而在於遵守成功交易通則與否。\n\n\
    輸家交易人不知道這一點。他們不曉得有成功交易通則。他們繼續交易，在懵懂無知中賠錢。他們繼續專注於尋找完美、無風險、百分之百準確的進場技術。他們不了解交易必須遵循一些關鍵原則。\n\
    \n### 獲利，再自然不過\n\n在我看來，不管是交易貨幣、股票、利率、能源、金屬、穀物或肉類市場，成功交易通則都是獲利不可或缺。通則適用於每個人，不管是當日沖銷交易人，或者短線、中線或較長線的部位交易人，成功交易通則都是獲利不可或缺。不管是交易選擇權、差價合約、期貨、股票、保證金外匯或認購權證，成功交易通則都是獲利不可或缺。這些話，說再多都不嫌多。不管交易是根據傳統的技術面分析、基本面分析、艾略特波浪、甘恩、蠟燭圖、賽波納奇、指標、機械型系統、季節性、幾何、型態辨識或占星術，成功交易通則仍是獲利不可或缺。\n\
    \n總而言之，如果你要做交易，不管在何處、如何或為何交易，成功交易通則都是獲利不可或缺。忽視它們，就等於忽視真理。忽視它們，等同於忽視交易帳戶的虧損。\n\n\
    依我之見，交易只有一個放之四海皆準的真理。而它就是如上面所說。如果你能選對首要的交易基本原則，那麼利潤就會滾滾而來。它們非來不可。就是這樣。絕對如此。但是，如果忽視交易的基本原則，就會繼續賠錢。就是這樣。沒有商量的餘地。不必爭論。沒有「如果」或「但是」。你會繼續賠錢。就是如此。\n\
    \n你難道不想停止持續慘賠嗎？你難道不想了解是什麼原因真正使交易人持續獲利？你難道不想以持續且可靠的方式開始獲利？你難道不想停止在失敗的交易方法之間跳來跳去，用心了解穩健和可靠的交易法背後是什麼原因？\n\
    \n如果你想，那麼本書適合你。如果你想要交易獲利，我會教你了解成功交易通則，告訴你如何回歸基本面。\n\n### 你，適合交易嗎？\n\n但是，警告放在前頭。如果你是要尋找新的進場、停損或出場技術，那麼本書不適合你。如果你是要尋找分析市場結構的新技術，那麼本書不適合你。如果你是要尋找簡單的解決方案以求獲利，那麼本書不適合你，我也幫不了你。因為只要你一旦了解，就會明白，交易和成功交易通則相當簡單，卻也不容易。要做到持續不斷的長期獲利交易，沒有簡單的捷徑。\n\
    \n如果你要找的是交易中的確定性，那麼本書不適合你，我也幫不了你。市場中沒有確定性，而且交易當然沒有確定性。有的是只是百分之百的機率。如果你這個人只能身處高度確定和有保障的環境，例如維持一段穩固的男女關係或保有穩定的工作，那麼交易不適合你。\n\
    \n如果你是個知識份子，極少承認犯錯，那麼交易不適合你，因為市場會經常不斷藐視你，讓你出錯。知識份子難以忍受不知道正確答案、無法掌控大局，而且經常被證明錯誤。\n\
    \n但是，如果你準備好好用功，交易可以提供你無限的可能。今天，交易再公平不過。每個人平等競爭。進場沒有任何障礙。今天，機構不再比私人交易人擁有競爭優勢。機構交易人可能像私人交易人般無知，對市場如何運作毫無頭緒。愚蠢沒有上限。私人交易人的獲利與某些最優秀的機構交易人相比毫不遜色，甚至略勝一籌。成功也沒有上限。今天，交易是無處不在的公平競技場。\n\
    \n如果你有耐心，如果你準備好好下一番工夫，如果你敞開心胸，那麼我相信成功交易通則會改造你的交易。但一切取決於你，完完全全操之在你，不必問其他任何人。為自己的行動負責，而行動將使你的交易帳戶面目一新。\n\
    \n用功學習，明智交易。祝你好運。\n\n布倫特·潘富\n\n於澳大利亞雪梨\n"
