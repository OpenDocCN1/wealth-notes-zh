    如果你不相信，何不回頭看圖9.15，再數一次三角形？結果是否不同？你確定自己正確嗎？再數一遍看看？這道謎題像是給小孩子玩的遊戲。如果這道謎題的答案已經讓你絞盡腦汁，你要如何準確辨識真正（但難以捉摸）的圖形型態，拿真正的錢，即時去真正的市場交易？你需要尋找、運用客觀的折返型態。


