    使用。使用市價單等於指示顧問立即交易，不管市場現在報價如何。如果你正想賣出FTSE，顧問會以最接近的「買」(bid)價（最佳的買進價格）賣出。委託單內容：


    市價賣出一口3月FTSE。


    # 》最佳價單（best）


    就像市價單，但允許顧問斟酌時間和價格，因為他或她必須幫你得到最好的價格。委託單內容是：最佳價賣出一口3月FTSE。


    # 》限價單（limit）


    在你找到特定交易價格，而且只想在那個價格完成交易時使用。例如，如果你想在FTSE從目前6,455的漲勢拉回（下跌）到6,445時買進，委託單內容：


    限價6,445買進一口3月FTSE。


    # 》到價單（stop）


    用於防範走勢對某個部位不利時使用的市價單，只在符合某些「觸發」條件時執行。到價單通常用於限制交易的虧損，又稱為停損單（stop losses）。到價單水準代表你願意在交易上冒險的最多金額。


