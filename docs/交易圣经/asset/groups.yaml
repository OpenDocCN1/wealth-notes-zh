  - '[PAGE 401]


    肇交易；並沒有一道白色光束指引我走哪條路；甚至沒有人給我完整的答案。如果你認為有這樣的答案，那麼你就踏出了錯誤的一步。

    交易這項事業結合了藝術和科學、結合數學和情緒。對一個人行得通的事，不見得適合另一個人。

    答案不是能讓你在餘生中賺錢的某個指標或某條數學公式。

    答案是：這個行業充滿問題，你需要為自己找答案。

    沒有風險，就沒有報酬；少了努力，就沒有報酬；沒有執著和堅持，也沒有報酬。

    我也但願自己能說我有答案、有道光和真相，但我的交易經驗並不是這樣。我真的但願我有答案可以幫助你找到並一直走在獲利交易的路上，但這條路充滿問題，而其中大部分似乎沒有絕對的答案。但是，這並沒有成為我的阻礙，我仍然不斷問問題，並在過程中學習，一天進步一點，朝成功的專業交易人邁進。


    拉里·威廉斯


    如何？沒有簡單的答案，只有問題，而你我卻在這裡找解答！此外，如同拉里所說，尋找問題的答案，卻沒有掌握控制權，也難以成功。你不只要問許多問題，也要自己尋找和體驗答案。交易人只有透過個人體驗，才能學習和取得交易成功所需的必要控制權。每個人都必須走過自身的個人旅程，只要一路上午夠多的問題，就可能達到一直在尋求的目的地，即永續和成功的交易生涯。


    以上的智慧之語，來自攀爬交易之山最久的交易人。他從少數交易人可及的高度分享他的觀點。他就像位名師，揭示交易的'
