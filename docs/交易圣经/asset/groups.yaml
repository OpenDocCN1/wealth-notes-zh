    ## 邁克爾·庫克


    邁克爾·庫克是交易冠軍。他在2007年贏得用真錢比賽的羅賓斯世界盃期貨交易冠軍賽，報酬率為250%。2008年排名第二。邁克爾的野心之一，是連續三次贏得冠軍——當時在這項比賽二十五年的歷史中，還沒有交易人有這樣的成就。


    邁克爾在早年的交易中，就經常獲利，這在交易人之間相當罕見。他和大部分大學生專心唸書不一樣，把時間花在申購民營化新股票上。買進這些股票之後，他會在它們掛牌上市的第一天就脫手。雖然他的學業成績可能受到影響，財務卻絕對不然！


    邁克爾不只在這方面極為罕見，他利用別人的資金學習如何交易，這種機會在交易人之間也不多見。1997年，他受雇於倫敦的美國銀行，加入他們的新興市場固定收益交易臺，有機會向身經百戰的機構交易員學習市場和交易上的種種知識。


    邁克爾在美國銀行的時候，主要是自由裁量型交易員，用他的彭博（Bloomberg）多工終端機操盤。終端機不只提供走勢圖、分析以及新聞，還是很好用的咖啡杯墊！在前後十年的期間，邁克爾從銀行到避險基金，擔任各機構的資深交易員，磨練、培養交易技能。


    2007年，邁克爾離開機構交易的安全保障，開始全時為自己操作。邁克爾從機構交易技能轉型到自身個人帳戶的操作，過程十分成功，以至於能以250%的報酬率，贏得世界盃期貨交易


    冠軍賽。根據我的經驗，這是難能可貴的表現，因為曾經當過機構交易員的人，鮮少能成功交易本身的個人帳戶。當你用自己的錢交易，在專業面和情感面上，原來交易成功所賴的置身事外態度都會發生轉變。由於每一筆交易的結果都會直接衝擊個人帳戶淨值，所以要在情感上置身事外十分困難。當交易室在你家屋簷底下，就很難把上一筆賠錢的交易留在交易室裡不去理它！因此，邁克爾從機構成功轉型到個人交易，極為罕見。


    今天，邁克爾是短線到中線的自由裁量機械型交易人。他 的交易可以從兩三天到好幾個月不等。邁克爾的模式發現機會時，他會在任何市場進行交易，不管是外匯、股票、選擇權，還
    是各種指數、金屬、能源或金融市場的期貨。他的模式使用以統計為基礎的指標，以找出交易機會。那些模式使用一組過濾器，在若干條件滿足時，就如瀑布層層而下般就定位。他偏愛使用簡單的模式進行交易，使得他的螢幕不致那麼雜亂。他的模式不使用擺盪指標或隨機指標等傳統的買超或賣超指標。他說過：「我的方法不是火箭科學；它們只有二十或三十行程式碼。」雖然他主要是機械型交易人，卻在他相信有必要的時候，加進若干自由裁量，因此他是自由裁量機械型交易人。在模式的研究、發展和測試方面，邁克爾綜合使用Genesis和Excel。至於畫圖，他則在e-Signal的FutureSource和Genesis之間轉換。


    不交易時，邁克爾會在某個地方出一些莫名其妙的小意外。他沒辦法解釋為什麼，但自他從英格蘭移居阿拉斯加，滑雪時跌倒或使用造雪機、沙灘車故障的次數之多，令他感到莫名其妙！邁克爾和他太太都是英國人，但目前住在美國的阿拉斯加。現在我們就來聽聽邁克爾的忠告。


    對於想要有一番作為的交易人來說，有個忠告超越一切：小額交易。

    這顯然有例外，但大體而言，新進交易人往往過分高估某一風險資本水準、正確的部位規模和數目。這絕對是規模攸關重大的領域，金額越小越好。

    大部分想要有一番作為的交易人，都看過市場怪傑之類的書。這些書由一連串頂尖交易人的訪問內容構成，他們靠交易賺進數千萬或數億美元，有些例子中，更賺進數十億美元。

    這些交易人在交易世界中的地位，相當於老虎伍茲（Tiger Woods）之於高爾夫球界，或費德勒（Roger Federer）之於網壇，或「球王」比利（Pele）之於足球等。這類故事值得注意的共同主軸之一，是他們在生涯之初，賠了許多錢或破產。這對於剛投入交易的凡夫俗子來說，應該是有益的教訓。

    這些是世界級的優異交易人，卻仍然在交易生涯之初，幾乎失去一切。剛開始交易的人必須理解，這場遊戲十分辛苦，競爭十分辛苦，計分方式就是賺賠。

    小額交易比起「一擲千金」沒那麼令人興奮。但有人說，想要找個忠心的人，不如養一條狗。同理，如果你想要快感，不如去跳傘。想要交易的人，必須很早就決定他們想從交易得到什麼，那應該是賺錢，不是尋求刺激。

    交易生涯之初的小額交易，不會使交易人賺到大錢（那是非常不可能的事），但那不應該是目標。目標應該是活得夠久，有時間學習其他所有教訓，讓交易能夠隨著時間流逝而獲利。接下來，天空有多高，極限就有多遠。


    讀到這段話的許多人會想：「這根本沒什麼新鮮或原創性，這我早就知道了。我聽過類似的忠告不知有幾百遍。我聽過的都是在談風險管理，現在你可以告訴我靠交易致富需要知道的其他事情……」


    這樣的回應，讓我想到有個病人去看醫生，想要知道如何減重。醫生解釋說，要減重，就要少吃多運動。病人答道：「是的，是的，我知道，我已經聽過類似的忠告不知幾百遍，現在你可以告訴我減重需要知道的其他事情……」


    跳過這一課也沒關係；如此一來，你就不需要更多建議，因為你無法在場內待到需要它們的時候。用較小金額交易，那麼好事至少有機會發生！


    邁克爾·庫克


    現在，有人看出其中的反諷嗎？這個反諷支撐了邁克爾所提忠告的力度和深度。邁克爾曾經是機構交易員，通常交易數百萬元，卻建議你小額交易。如果你接受，也據此行動，你會更能在開始交易時確保破產風險為0%。此外，如同邁克爾所說，小額交易能幫你爭取到夠多的時間，學習交易成功需要的所有事項。小額交易不見得會使你賺大錢，但有助於確保你存活得夠長。交易以小額起步能讓你受惠於你的知識。這是曾經榮獲冠軍殊榮的交易人所說的話，他在機構和個人層級上，交易都十分成功。聆聽這些肺腑之言是明智之舉。但願你有把邁克爾的話聽了進去，我當然有。


    邁克爾的電子信箱：mcook@tradingaccount.co.uk。


