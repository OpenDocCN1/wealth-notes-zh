    對各種策略更熟悉和更放心的最好方式，是在你的交易資料集上，測試每一種策略。你應該檢視每種策略對關鍵變數的敏感度。你也應該測試每種策略的災難性虧損。


    # 蒙地卡羅模擬


    蒙地卡羅（Monte Carlo）模擬是協助選擇過程的工具。這項技術有助於提高分析的穩健性。


    雖然你可能已經發展出一套穩健的方法，擁有穩定的帳戶淨值曲線，你對各種策略在交易歷史資料上看起來的樣貌也感到放心，你卻無法肯定將來的交易資料會以相同的順序重複出現。蒙地卡羅模擬允許你對各種資金管理策略作徹底的上路測試。它以隨機的方式，混合交易歷史資料，你愛模擬多少次，就模擬多少次，並且記錄賠償和價值報酬比率（淨利相對於賠償）等關鍵特徵的每一個順序。它接著計算平均值和標準差，檢視成果的分布狀況。從這些成果，你可以對策和方法的配適度更有信心。但是務請了解，它確實有其限制。它仍然有賴於將來發生相同的個別交易成果，而如果帳戶淨值曲線保持穩定，那就不會有問題。但是，如果你所用系統的成果開始惡化，那麼做多少次模擬都無關緊要，你的真實成果還是會很差。


    關於蒙地卡羅模擬的進一步資訊，你可以透過我的網站 www.IndexTrader.com.au ，和我聯絡。


    # 交易淨值動量


    你現在知道適當的資金管理有多重要，你也知道它的限制。雖然資金管理能將期望值普通的方法化為賺錢機器，卻無法將負'
  - '[PAGE 197]


    期望值的方法化為正期望值的方法。它也不能告訴你所用的方法何時發生致命的出軌，或者正期望值何時轉為負數。雖然資金管理是對抗破產風險的第一武器，它卻未能提供早期警訊。這就是交易淨值動量（trading
    equity momentum）上場的時候了。


    監視策略的淨值動量，可以給你早期的警訊，得知策略的淨值曲線是否開始變得不穩定。它會在策略完全行不通之前，提醒你注意。它會在策略的績效惡化到使你所有的風險資本消失一空之前，允許你退場觀望。


    換句話說，為何你應該等你所用的資金管理策略告訴你何時停止交易？難道不應該有個更聰明、更早期的警訊，能夠協助你退場觀望？把錢賠光似乎是一條極端的路，但如果你所用方法的期望值轉為負數，這正是資金管理的最後處境。


    你不必等到損失財務邊界的10,000美元風險資本，才知道你在賠掉5,000美元時就可能知道的事。有個早期警訊，例如在3,000美元時，就讓你知道你開始陷入麻煩，這是件好事。


    你不只應該以正期望值方法交易，更應該以正淨值動量方法交易，或者換句話說，以淨值曲線穩定的方法去交易。如果以單一合約基礎計算的淨值曲線開始下挫，就應該準備退居場外，並且停止交易，直到正淨值動量回來。


    關於這一點，我的意思是你的方法要設定停損點。交易要有停損點，交易方法也要有停損點，換句話說，就是系統停損點。


    # 系統停損點


    就像你在交易時使用停損點那樣，你也應該為交易設定系統停損點。即便你可能相信自己已經發展出穩健的正期望值方法，而且使用TEST程序，正確驗證這一點，還是不能保證你所用的'
