    - 沒有驗證構想


    經由折返而收縮，之後再度擴張，繼續往趨勢的方向行進。折返順勢交易相信，交易人會有許多機會補捉到折返拉回之後，趨勢持續進行的走勢。


    再舉個例子，艾略特波浪相信市場趨勢通常包含五波上升，折返通常包含三波拉回。你也能在許多市場看到許多例子。


    贏家方法通常都很簡單。它們不複雜。簡單就可以少出錯。簡單能確保贏家方法維持穩健。複雜的策略有太多活動組件、在空中太多球，所以邏輯上而言，它們「掉球」的機會比較高，導致所用方法失去它的優勢。策略一複雜，可能出錯的東西就變得比較多。


    備受敬重的市場分析師與交易人狄馬克，曾經和市場怪傑鍾斯共事，現在則輔佐 160 億美元投資基金 SAC 資本的柯恩。他說了聽過的最佳名言之一。他在柯林斯所寫《贏得市場》一書中說：


    ……在十七名程式設計師和四、五年的測試之後，基本的四、五個系統運作得最好……


    說到你能從我寫的這本書得到什麼東西，要是你沒有把狄馬克觀察到的事情複製下來，貼到交易螢幕上方牆壁非常顯眼的位置，那麼你算是不合格的讀者。這是狄馬克給交易人的極其寶貴貢獻，因為他分享了一個洞見，讓我們知道一個重大研究發展專案的結果。鍾斯在四到五年的時間中，請得起十七名程式設計師，進行密集的市場與策略研究，這樣的交易人並不多見。單單雇用一位程式設計師就很昂貴，更別提在四到五年的期間內，雇用十七位。這是非常昂貴的研究。


    我們應該謹記狄馬克的觀察。在投入那麼多時間和心力之後，狄馬克的基本或簡單的四或五個系統（策略）運作得最好。


    - 你可以不相信我，但請相信狄馬克，請不要逆勢而為，想要推倒重來。簡單的東西就是行得通。


    順帶一提，就在昨天晚上，我和朋友談到安排雙方家人來個披薩聚會。而且如同以往，我們的話題聊到市場。朋友擁有並經營一家成功的絕對報酬基金管理事業。他管理的資金高達數億美元。我們提到另一位交易人的觀察。那是針對市場所做的簡單觀察。雖然簡單，卻十分有力。我們兩人都說，簡單是最少人知道的交易秘密之一。簡單就是行得通。


    贏家方法既簡單且客觀，不需要主觀的解讀。十名交易人遵循相同的簡單方法，應該會找到相同的格局。客觀的方法才能夠衡量，才會有簡單的交易計畫以決定方法的歷史期望值、衡量所有賺賠交易。贏家方法具正期望值，在多個市場都行得通。


    這些是贏家方法的關鍵屬性。它們簡單且客觀，期望值可以衡量。我相信這是你需要的：可靠、獨立且客觀的證據，證明它行得通！有了這些，你就往成功的交易人又接近一步。力求方法簡單，再怎麼強調也不為過。


    ## 簡單就是美


    除了發展穩健的獲利方法，策略力求簡單還有許多好處。


    ## 啟蒙


    發展、接納簡單的交易方法，表示你已經接受關於交易的一個重要事實。這意味著你已經達到「禪」的心境，了解這個世界上沒有所謂的聖杯交易解決方案。這意味著你不再覺得需要繼續永無止盡地搜尋下一個最好的交易構想。接納簡單，能讓你開竅和帶來心靈上的平靜。


    這意味著你現在了解、接受沒人能斷言市場的未來走向。你已經了解，你在交易上能夠控制的，就只是採用健全的交易邏輯和良好的資金管理策略。現在你了解，不必對市場未來走向瞭若指掌，也能在交易上賺錢。這些是你接納簡單而有的體悟。


    ## 容易


    簡單的方法沒有複雜的東西。沒有指標需要解讀，不需要畫角度，不必計算波浪數，不需要找週期，也不必計算折返百分率。統統不必。簡單，做起來就容易。


    ## 客觀


    簡單會使方法變得客觀。簡單意味著沒有東西可以操弄、修補，或者動手腳。簡單意味著格局的有無直截了當，沒有什麼好解讀的。


    ## 穩健


    穩健是指所用方法能夠長期即時獲利。你所用的方法持續增加交易帳戶的時間越長，就越穩健。採用指標等主觀變數的方法不穩健。簡單的方法通常排除使用變數，這有助於它們維持穩健。穩健意味著出錯較少。活動組件越少，方法越穩健。


    ## 情緒穩定


    和主觀的自由裁量型交易比起來，簡單的方法在情緒上比較容易交易。自由裁量型交易遠具彈性，且遠為依賴交易人做所有的決策。不管是確認格局、決定是否進行交易，還是決定在哪裡下最好的停損點、獲利了結，所有的決策都取決於交易人。採用簡單方法的交易人，在市場開盤之前，就知道格局是否存在。如果有交易格局，就知道要在哪裡進場和下停損點。他們的交易簡單到就像把點連成圖。他們知道在哪裡進場、在哪裡下停損點，以及在哪裡獲利了結。他們不需要做決策。由於不必持續做決策，簡單而百分之百客觀的交易方法，執行起來較能心平氣和。


    ## 時間管理


    交易人用簡單的方法交易，時間管理也能做得更好。由於必須做的事很少，交易人有較多自由時間可以運用。他們不必成為市場的奴隸，持續搜尋格局、決定是否交易。簡單比較快。


    ## 簡單的矛盾


    我也應該告訴你，發展簡單的交易方法有個強烈的矛盾點。沒錯，依我的經驗，策略越簡單，便越穩健，而越穩健，越好。矛盾的是，一般來說，方法越簡單，淨值曲線越是起伏不定。淨值曲線越是起伏不定，則越難交易！


    這是因為越簡單的策略，越有可能是真正的策略。簡單的策略不會運用依賴變數的指標，藉以取巧跳過大賠的交易，或者避開持續不利的交易區間。交易人很容易選擇可用的指標，引進一個過濾器，以避開若干市場狀況。交易人很容易發展複雜的指標基礎策略，產生看起來平滑的淨值曲線。


    因此矛盾由此而生。簡單通常伴隨著淨值曲線起伏不定，使得交易極具挑戰性，因為非常真實且十分正常的賠償期間會發生。所以說，雖然簡單最好，通常卻最難交易！


    講完不要做哪些事情，以及為何你應該採用百分之百客觀且獨立的工具，以打造簡單的方法之後，我想舉個例子說明我的論點才合乎公允。我應該讓你看一個簡單、百分之百客觀且獨立的交易方法，也就是贏家策略。


