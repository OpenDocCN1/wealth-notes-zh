    ## 固定風險


    圖 8.4 顯示使用固定風險資金管理策略的 Forex_Trader 淨值曲線。我會先討論固定風險資金管理，再檢視它對 Forex_Trader 績效的影響。


    固定風險資金管理策略限制每一筆交易於預定或固定的金額風險。每筆交易固定的金額風險，可以一開始的帳戶金額除以想要開始交易的資金單位數計算出來。計算公式很簡單，如下所示：


    ```

    固定金額風險 = 帳戶餘額 / 資金單位數

    ```


    這裡的關鍵變數是帳戶餘額，和偏好的資金單位數（或者交易筆數）。


    這個例子中，一開始 2 萬美元的帳戶餘額，除以 40 個資金單位，得出固定金額風險為 500 美元。因此，你只執行金額風險等於或低於 500 美元的交易。要計算你將交易的合約口數，則將固定金額風險除以個別交易風險（也就是進場價格和停損價格之間的金額加上經紀費用），一定要化整到最接近的整數。


    使用下列的簡單公式：


    ```

    合約口數 = 固定風險 / 交易風險

    ```


