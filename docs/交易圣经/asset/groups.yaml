    三十筆用電子郵件寄送的模擬交易有其必要，因為這樣才可以確保你的模擬樣本規模，大到在統計上有效。使用電子郵件，是為了模擬真實的市場。這是為什麼擁有－位不和你住在一起的交易夥伴十分重要的原因。和真實的交易一樣，一旦你用電子郵件寄出你的模擬委託單，就再也不能回頭。你不能把電子郵件收回來（除非是在市場開盤之前，或者市場還沒有觸動你的委託單水準）。就和真實的交易一樣，你的模擬交易，命運在交易之神手中。


