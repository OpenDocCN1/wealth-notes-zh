    # 期望值


    根據我的經驗，期望值是計劃交易或正在交易的大多數人了解最少的觀念。期望值是指你拿去交易冒險的每一塊錢，平均可望賺得的金額。要計算你所用方法的期望值，你需要知道自己多常獲利、多常賠錢，以及你的平均獲利和平均虧損交易的大小。一旦有了這些資訊，就能用圖4.8的公式，計算你的可能期望值。我們來計算鮑伯從System_One所能得到的期望值。System_One的準確率是56%；但是，為了便於解釋，我要將它提高到60%。System_One的平均獲利等於平均虧損，而且每年產生10個訊號。鮑伯每筆交易拿2,000美元去冒險。下一頁的表4.2顯示鮑伯的交易績效（假設他能避開破產風險）。你可以看到，鮑伯交易一年之後，能夠賺進4,000美元。他下了十筆交易，贏了六筆，輸了四筆，拿去冒險的總金額是20,000美元。根據鮑伯的歷史績效，下一年他的期望值將是20%（$4,000／$20,000）。換句話說，假使鮑伯所用的方法，將來的表現和過去一樣好，他拿去冒險的每一塊錢，可望平均賺進20分。另外，你可以使用期望值公式，計算鮑伯的期望值，如圖4.9所示。我們也來計算莎莉從System_One得到的期望值，如圖4.10所示。


    ```

    每一塊錢的期望報酬 $$ = [ 獲利機率 × 平均獲利 / 平均虧損 ] − [ 虧損機率 × 平均虧損 / 平均虧損 ]

    ```


