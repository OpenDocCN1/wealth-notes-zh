    但是交易界卻有一整個產業，倡導費波納奇是確認支撐與阻力水準的可靠交易工具！我但願自己在第一次見到費波納奇比率時，就持懷疑態度。它花了我約十五年的時間，才親自做功課驗證它們毫無意義。但願現在這個小小的練習，能向你證明，自己做功課驗證交易觀念有多重要。


