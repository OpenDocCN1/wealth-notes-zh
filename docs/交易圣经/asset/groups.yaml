    最重要的特色是頭兩個——資金管理的目標。只有固定風險未能在賠錢時縮減交易規模，以及在賺錢時增加合約。固定單位也未能在賠錢時縮減交易，但在賺錢時交易更多合約。


    其餘策略的重要特色和合約貢獻的利潤有關。這對每一種策略因應災難性虧損的能力有直接的影響。雖然市場的最大逆境極不可能發生，我們卻應該尊重這種可能性的存在。你需要相信市場能夠且將造成「始料未及的」災難性虧損。


    一種策略能夠賺取幾何利潤的秘訣，在於它能夠累增合約的速度。累增合約最快的策略，是每增加一口合約只要貢獻較少的利潤。它們會更快開始交易更多合約，並且賺取較高的利潤。這種不等的投入，使得這些策略（固定資本、固定單位、威廉斯固定風險、固定百分率和固定波動性）看起來是顯而易見的明星。但是，壓力來臨時，例如10,000美元的災難性虧損，明星就會失


