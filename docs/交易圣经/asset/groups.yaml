    拉里最為人所知的，可能是他是羅賓斯世界盃期貨交易冠軍賽空前絕後的大贏家。1987 年，拉里在十二個月內，將 1 萬美元的帳戶，交易成超過 110 萬美元，榮獲冠軍。這項成就沒有人能望其項背。拉里愉快地承認，他一度將帳戶經營到超過
