    我們來更深入觀察固定資本如何允許你增加交易的合約口數。固定資本是累增合約最快的策略之一。它之所以能夠這麼做，是因為在進入下一個合約水準之前，只需要每個合約在新的合約水準動用利潤比較少的部分。


