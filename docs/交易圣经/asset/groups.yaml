    \ 湯姆以 System_One 交易\n\n莎莉和鮑伯唯一的差異，是莎莉的平均獲利和平均虧損是1,000美元。假設她避開了破產風險，她拿去冒險的每一塊錢，也可望平均賺進20分。當她拿1,000美元去冒險，可望平均賺進200美元，而如果她一年做十筆交易，便可望賺得2,000美元。莎莉也可能會有正期望值。\n\
    \n最後，我們來計算湯姆從System_One獲得的期望值，如圖4.11所示。\n\n這三位交易人唯一的差異仍是每筆交易冒險的金額，以湯姆來說，他是500美元。假使湯姆避開了破產風險，他拿去冒險的每一塊錢，也可望平均賺進20分。當他拿500美元去冒險，可望平均賺進100美元，而如果他在一年內做十筆交易，可望賺進1,000美元。交易人湯姆也可能有正期望值。\n\
    \n相當有趣。那麼，你認為誰的成果較優異？正確的答案是沒有哪個比較優異。他們拿去冒險的錢，都賺進20%。他們唯一的差別是破產風險，鮑伯是30%，莎莉是9%，湯姆是1%，也就是說，湯姆在交易的那一年，生存的可能性遠高於鮑伯或莎莉。\n\
    \n現在你已經知道，期望值是指拿去冒險的每一塊錢，可望從所用方法賺得的金額。從前面的例子可以知道，一種方法的期望值是所有獲利和所有虧損的累積金額。這包含四個變數：\n\
    \n- 獲利頻率\n- 虧損頻率\n- 平均獲利\n- 平均虧損\n\n期望值對所有變數一視同仁，但是你可能會偏心，在心理上\n\n也許偏愛準確率較高的某種方法。\n\
    \n我們來看看表4.3 中所述四種方法的表現，看是否能更深入理解期望值。\n\n我假設每種方法每筆交易都是500美元，也就是10個訊號的總金額是5,000美元。這些方法的差異，在於準確率和平均獲利金額。這些差異能助你理解期望值的重要性。\n\
    \n我們繼續用前面四捨五入的方式，System_One 有60%的準\n\n### 表4.3 比較不同方法的期望值\n\n| 每筆交易冒險的金額 | 500\
