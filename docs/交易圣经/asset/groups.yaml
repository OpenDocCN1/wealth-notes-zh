    # 導讀


    # 下第一張交易單前的必修課


    這本書會出版，有許多原因。


    第一，我寫的第一本書《澳大利亞股價指數期貨合約交易指南》(*Trading the SPI*) 大獲成功，令我驚訝。該書談的是交易澳大利亞的股價指數（Share
    Price Index；SPI）期貨合約。我知道一個事實，那就是私人 SPI 指數期貨交易人不够多，沒辦法保證書的銷量。雖然這個當地的指數期貨合約是澳大利亞最大的單一股票工具，但為機構所霸占，小額私人交易人不多。所以這本書暢銷，起初我覺得是個謎，後來才發現原因。那個原因成為考慮寫作本書的第一個動機。我的第一本書分成三部分，而我相信討論成為成功交易人必要準備工作的第二部分，是那本書暢銷的原因。即使交易人對於
    SPI 指數期貨合約不感興趣，但他們看到書訊，買了我的書。那是因為他們想要學習更多有關於如何做好準備，以成為成功交易人的知識。因為交易就是交易，而第二部分討論的原則適用於所有市場和所有交易人。我一直認為第二部分'
  - '[PAGE 20]


    是那本書的精華，而且我相信它是那本書成功的原因。所以寫成本書的第一個原因，是要將交易人通用的養成準備，也就是我所謂的「成功交易通則」，傳達給更廣大的讀者群。


    順帶一提，已經讀過我寫的第一本書《澳大利亞股價指數期貨合約交易指南》的讀者，請在此接受我的歉意，因為你即將重溫不少曾經看過的內容。但是，我希望你能理解我渴望與更廣大讀者群分享想法的渴望。為了內容而製造內容並非我的個性。我只能寫我相信、我所做，以及我知道行得通的事情。而這就是我正在做的事。所以我希望本書雖然有部分內容似乎重複，但也是我強化你認識成功交易通則的好機會。


    寫成本書的第二個原因，出現我在參加亞洲交易投資大會（Asian Traders and Investors Conference；ATIC）發表演說期間。那一次，我曾和澳大利亞股票交易人、教育者和作家史都華·麥克菲（Stuart
    McPhee）閒聊，他告訴我說要鼓勵人們買他的書《交易一本通》（Trading in a Nutshell）有多難。我聽了覺得很驚訝，因為我對史都華寫的書評價很高，也在《你的交易人優勢》（Your
    Trader’s Edge）雜誌發表本書第二版書評時表達我的讚賞。史都華告訴我，新加坡人不願買封面有「澳大利亞股票」字樣的書。他們告訴史都華，他們住在新加坡，看不出買「澳大利亞」的書有什麼價值。雖然史都華和我都知道，交易的學習和採用哪一種證券無關，因為一張走勢圖就是一張走勢圖，而且良好的交易習慣優先於挑選市場。可是對交易新手來說，在書封上提到外國市場會構成絆腳石。這是我想寫這本書的第二個理由。我希望不管我在哪個國家發表演說，聽我演說的人都能買到一本書，藉以更了解我如何看待交易。


    這些年來，我有幸受邀在中國、印度、新加坡、馬來西亞、'
  - '[PAGE 21]


    越南、泰國、紐西蘭，當然了，還有澳大利亞，向交易人發表演說。而在我巡迴亞太地區發表多場演講和出席講習班期間，我十分清楚了解到，市場並不會對交易人或因他們持有的護照而給予差別待遇。在全球各國，所有交易人都同樣受苦於喧囂動盪的積極型交易世界。所以我希望寫一本書，適用於任何地點的任何交易人，都能學習我認為要成為持續獲利交易人的重要條件。我想寫一本超越國界的書，任何人讀了都覺得對自己有用。這是寫成本書背後的第二個動機。


    寫成本書的第三個原因是接受挑戰，寫一本談如何成為成功的交易人、「一站購足」的好書。我想給人們一本關於交易的實質資源指南，不管他們偏好交易的市場、時間架構、工具或技術是什麼。


    # 我的交易路


    讀完本書，你將有一張藍圖在手，曉得如何成為持續不斷獲利的交易人，而這是我二十七年前起步時<|message|>但願擁有的，因為這樣我就能避開許多失望的年頭。1983年，我進入美國銀行（Bank
    America）擔任實習自營員，對於交易和市場一無所知。後來即使有了幾年的機構交易經驗，對於市場實際上如何運作，我還是一無所知，直到更多年後才了解。


    自1983年開始交易以來，我可能嘗試過幾乎每一種交易技術。如果發現有一本書、一場研討會、一個講習班，或者一套軟體程式可能對我的交易有幫助，我就會去買、去參加，或者安裝。1990年代，在我尋找優勢的期間，我覺得自己就像在走研討會的旋轉門。我參加過許多知名的研討會。我出席過羅素·桑德'
  - '[PAGE 22]


    斯（Russell Sands）的海龜（Turtles）研討會、跟著柯提斯·阿諾德（Curtis Arnold）學PPS、跟著布萊斯·吉爾摩（Bryce Gilmore）研究幾何，也參加拉里·威廉斯（Larry
    Williams）的百萬美元挑戰（Million Dollar Challenge；MDC）研討會。我到處拾人牙慧，拼拼湊湊。但是拉里·威廉斯的MDC研討會強化了我研創短線機械型價格型態的工作。


    身為交易人，我使用簡單的機械型模式，在多重時間架構中，交易全球指數和貨幣期貨。我交易的可能是地球上流動性最高和波動性最大的兩個市場區塊：指數和貨幣。我的交易組合有十四個市場。在指數期貨方面，我交易SPI、日經、臺指、恆生、Dax、Stoxx50、FTSE、Mini-Nasdaq和E-Mini
    S&P500指數期貨合約。至於貨幣期貨，我交易美元的五個主要貨幣對，包括歐元、英鎊、日圓、瑞士法郎和澳元。我幾乎一個星期七天、每天二十四個小時交易我的組合。我沒有一天不在世界上某個地方下單，交易指數或貨幣期貨。


    我主要是型態交易人。除了用200日移動平均線確定主趨勢，我單純專注於價格。但是請不要對我使用200日移動平均線想得太多。我使用200日並沒有什麼神奇之處。這只是我一貫使用的長度。我甚至不知道它是否是確定主趨勢的最適長度，但我不在意。我在交易上最不想做的事，是開始使用「優化」變數，因為那是進入貧民收容所的捷徑之一。


    此外，請了解我並沒有使用200日移動平均線尋找交易格局。我沒有用它尋找進場、停損或出場水準。我只是用它決定主趨勢，因為我不喜歡與趨勢背道而馳下單交易。


    從一開始，我就想要清楚指出，我不認為自己是交易專家或市場專家。我也不相信有這樣的人存在（世界知名的交易人兼'
  - '[PAGE 23]


    教育者拉里·威廉斯可能除外。他曾在教學時，在學員面前現場交易）。但是，有個領域，我願意將自己和大多數人拿來對照，而那就是我的賠錢經驗。如果你想要學習人們在交易上常犯的錯誤，找我就是。我比其他任何交易人受過更多大大小小的傷，也歷經更多的顛簸，所以我敢大言不慚地聲稱是這方面的專家。不過，雖然我遇過許多減速丘，卻還是生存了下來，並且一路走過技術面分析的混淆世界。我可望幫助你也生存下去。


    # 從犯錯專家到交易贏家


    現在，雖然我以幾乎一個星期七天，每天二十四個小時的方式，交易十四種全球指數和貨幣期貨，我其實並沒有投入很多時間真正 在「交易」這些市場。我不是電腦的奴隸，在螢幕盯著市場的每一檔跳動。我用日長條圖交易，而且一天只花一個小時蒐集所有資料、跑模式，並將委託單送交經紀公司。請記住，我是機械型交易人，交易簡單的機械型解決方案。我的交易模式設計程式為
    Excel 使用的 Visual Basic for Applications（VBA），以自動產生委託單。我將委託單用電子郵件寄給經紀公司。一旦經紀公司確認收到我所有的委託單（透過電子郵件回函），接下來二十四個小時，我便能放鬆心情。我的經紀公司有二十四小時的交易臺，所以我的委託單能得到妥善處理。


    身為機械型交易人，我是用正期望值在交易。我的交易策略會給我明確的買進和賣出訊號，我始終遵循。我相信我所用的方法儘管可能發生短期虧損，卻會給我長期的報酬。除了經營網站和交易，我的大部分時間用在研究和將新觀念寫成程式。


    正如我所說，我不是專家；但是這些年來，我發現了交易成'
  - '[PAGE 24]


    功真正重要的事情，以及是什麼因素真正讓我成功。但願看完本書，你會知道我所知道的事情。而且你會真正了解，贏家與輸家的差別就在於成功交易通則。


    我提過，我的目標是把這本書寫成一站購足的交易書，成為你的交易寶典。如果你真正想從市場賺到錢，我不認為本書會讓你失望。


    根據我的經驗，那麼多人交易賠錢的原因之一，是他們相信在交易書籍和雜誌上讀到的，以及在畫圖程式上看到的。一個令人遺憾的事實是，有關交易的著述，或者納入交易程式的東西，大多都行不通。它們只會為作家、出版商和軟體開發商賺錢。


    我想說的是，如果你還沒準備好，那麼在你閱讀交易書籍（包括本書）時，要保持懷疑之心。我或其他作者寫的東西，不見得就是正確的。我深信所有的交易人都應該敞開心胸，涉獵他們聽到、看到或讀到有關交易的所有意見和觀念。每位交易人都應該接納關於交易的各種選擇。但是，我相信所有的交易人，包括你，也應該有所保留，判斷你聽到、看到或讀到的觀念對你是否有價值。對我或其他作者管用的東西，對你不見得管用。在接觸所有交易觀念後，你需要自己獨立驗證觀念，之後做出判斷。請不要依賴另一個人針對交易提出的意見，包括我的意見在內。在閱讀像這樣一本交易書時，請時時保持質疑精神，而且請學會先驗證、再判定觀念是否有價值。在交易這一行，保持質疑精神是有報酬的。


    自從差價合約和保證金外匯推出以來，所有的小額私人交易人便一窩蜂地積極交易。人們現在可以舒舒服服地在家用個人電腦前面，根據自己的選擇，交易幾乎任何一種國內或國際股票、指數、貨幣或商品。由於差價合約、傳統期貨，以及金融市場自'
  - '[PAGE 25]


    由化，你現在能夠進出任何市場。而且在你學習了本書所說的成功交易通則而具備更多交易知識之後，我相信你交易起來會更胸有成竹。


    請記住，本書內容純屬個人意見，你不應該奉為絕對的真理。如果你喜歡你讀到的，那麼請先自己獨立驗證這些觀念。我希望這本書對你有益，能幫助你發現是什麼因素讓交易人真正能在較長期間內成功。如有任何問題，非常歡迎隨時透過我的網站和我聯絡：www.IndexTrader.com.au。


    # 下單前的必修課


    你將在這本書中學習交易成功的基礎。你會慢慢發現這些原則適用於所有交易人和所有市場。不管在什麼市場交易，不管交易的是股票、指數、貨幣、債券或商品，不管監控什麼樣的时间架構，不管是當日沖銷交易、短線、中線或長線交易，不管以何種證券進入偏好的市場（例如股票、差價合約、期貨、外匯、選擇權、認購權證）中操作，交易都只是交易。就是如此。相較於良好的交易程序，你選擇的市場、時間架構或工具，都屬次要。本書就是透過成功交易通則，深入探討這套良好的交易程序。


    這套通則概括我相信所有的成功交易人在下第一張委託單之前，必須走過的各個必要步驟。這套通則總結了在交易上以程序為取向的重要性，不管一個人偏愛自由裁量型或機械型交易〔自由裁量型交易（discretionary
    trading）是指交易人會做是否交易的最後決定；機械型交易（mechanical trading）是指交易人必須遵循交易計畫確切的進場、停損和出場準則，不害怕，不偏私，不遲疑，也不自行裁量〕。這套通則涵蓋實務交易的基本組成部'
  - '[PAGE 26]


    分，如破產風險、（我的）聖杯、期望值、機會、驗證、TEST、資金管理、方法論和心理面的關鍵概念。


    單單是談資金管理的第八章，本書就值回票價。一旦你知道我對資金管理的看重，就會了解為什麼它是篇幅最長的章節之一。我不相信你會找到另一本寫給一般讀者（不具數學博士學位）的書，對於各種資金管理策略的檢視如此之廣，對實務的調查如此之深。


    不管你的交易經驗如何，我相信所有交易人都能受益於這些成功交易通則。它們探討的是你需要做什麼準備、如何站好定位，邁向成功。


    遵循成功交易通則的腳步，你會遇見一群成功的交易人。我稱他們為「市場大師」。這些成功的交易人會根據他們多年的經驗和成功，給你一段忠告。其中有些人你可能已經認識，有一些人可能聽都沒聽過。有些是最近和當前的交易冠軍、交易世界年輕的新起之秀。有些是市場上的傳奇人物、聰明人，對技術面分析曾經影響重大，而且自1960年代以來就在市場上交易。有位市場大師可能是世界上操作金額最大的E-Mini
    S&P500個人交易人之一；有些是多產的作家，也是交易人教育方面的知名人物。有些交易投資基金。有些是私人交易人。他們代表世界各地形形色色的交易人，分別來自新加坡、香港、義大利、英國、美國和澳大利亞。他們的操作都成績斐然。他們都是全球金融危機的倖存者。他們都樂意慷慨給你一段鍍錫有力的忠告，幫助你邁向交易成功。


    看完本書，我希望你會得到必要的知識和信心，考慮自己是否準備好涉足積極交易。許多人不會自欺欺人，因而決定不走入交易。你會十分清楚自己無心投入必要的苦工，做好交易的準'
  - '[PAGE 27]


    備。如果你是這樣的人，恭喜你，因為你能把錢留在手上，也能免於許多次心痛。


    那些認為自己可以跳過成功交易通則的人，我幫不了忙。如果你真的不準備聽我說些什麼，後果請自負。我只能建議你記住有這本書，並在行事曆上註明，譬如在十二個月後回頭再看。也許到了那個時候，你才比較能夠開始聽進一些東西。


    至於那些曉得交易成功之路沒有免費午餐可吃、也沒有捷徑可走的人，我衷心祝福你一帆風順。你曉得前頭有許多辛苦活等著你。切記，不要急著踏入積極交易的世界。搶第一名沒有金牌可領。慢慢來。小心翼翼走過所有步驟。務必徹底周延到癡迷的地步，去驗證你的觀念，並且時常休息，因為這個過程叫人身心俱疲。真的，不騙你。攻頂的那一刻，你會記得你是從哪裡開始的，而且會很高興走了這麼長的路。投入那麼多心力的獎賞，就是躋身贏家圈。這個圈子，大部分人永遠打不進去。


    我們開始吧！'
