    # 第3章


    # 第一通則：觀念的準備


    我們要先談成功交易的第一通則：觀念的準備。這個階段能幫助你衡量自己的交易決心。如果你還沒準備好接受本章介紹的觀念，你就不應該交易。如果你不認為自己準備要聽這些觀念，那麼在你還領先的時候，應該斷了交易的念頭；這樣代價低得多，也遠遠不會那麼叫人失望。


    準備這個原則，要求在你考慮交易之前，必須先思索下列各個觀念，以及接受每一觀念的後果：


