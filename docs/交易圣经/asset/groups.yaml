    固定單位也會因為災難性虧損而受害，但它仍保有完整的七口合約，也能夠藉交易，在合理的时间內，擺脫賠償。


    其餘的策略都能在災難性虧損之後存活下來，但固定比率和固定波動性存活的狀況比較好。它們分別只需要15%和30%的獲利，就能從不對稱槓桿中回補虧損，低於固定百分率需要獲利的54%和威廉斯固定風險的52%。


    如果你是小額交易人，帳戶只有10,000美元，你會發現很難使用威廉斯固定風險、固定百分率或固定波動性資金管理策略去交易。你幾乎不可能找到夠小的單一交易，或者市場波動性夠低的時候，允許你去交易。因此，如果你是小額交易人，固定比率和固定單位似乎是比較適合你採行的策略。而如果你偏愛聚焦在風險控制上，那麼固定比率會優於固定單位，因為它從災難性虧損遭受到的賠償較小，而且個別交易的成果波動性較低。唯一的缺點是，固定比率只產生150萬美元，而固定單位高達2,200萬美元。這從來不是容易的決定。但是，正確的保守選擇，會是選固定比率勝過固定單位。務請記住，身為專業風險管理人，你的目標是生存，不是賺得厚利。而當你的帳戶成長，你接著可能考慮改為使用威廉斯固定風險、固定百分率或固定波動性。


    固定比率為何能將災難性虧損處理得那麼好，這點值得了解。和其他策略不同，它要求每一口合約貢獻相等的利潤。固定比率為它的多口合約，創造堅實的基礎。雖然在連續虧損發生的情況下，它會賠錢，但它的每一口合約賺進的利潤多於其他的任

