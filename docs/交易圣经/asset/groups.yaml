    ## 交易人的必經之路


    交易是個痛苦世界。賠錢會心痛。賠錢賠好幾個月會心痛。


    賺錢時，想到當初如果待在場內久一點可以多賺一點，心會痛。花了大量時間和精力，研究似是而非的交易理論，卻賺不到錢，心會痛。花了很多錢，上口碑不錯的講習班，卻因為執行學到的觀念而賠錢，心也會痛。花了大量的時間和精力，研究、發展、設計程式和測試某種觀念，卻得出負期望值，心還是會痛。當你和交易夥伴花了大量的時間和精力，透過TEST程序驗證期望值，卻告失靈，心會痛。花了多年時間和精力，努力改善你擁有的優勢，卻不見效果，失望之餘，心還會痛。順勢交易有67%的交易賠錢，心會痛。交易在大部分時間內發生賠償，即使所用方法的準確率較高，心會痛。退場觀望、等候下一筆交易，想到可能錯失下一波大走勢，除了焦慮，心還是痛。


    成功的交易人都經歷過這些，但他們懂得如何管理痛苦。痛苦永遠不會消失，但是可以藉由經驗，學會如何緩解，以堅持下去。缺乏經驗的交易人則沒有做好接受痛苦的準備，甚至相信交易和賺錢應該很容易。他們沿著阻力最小的線移動，聽到關於交易的痛苦，就掩耳不聞。他們不知道，正因為征服痛苦，才會有持續成功的交易。


    你需要學習如何因應那種痛苦。持續不斷的痛苦會挑戰你對交易計畫、所用方法的執著。你需要接受你可能經歷一長串連續虧損的交易，有些小，有些大得令人不安。你將需要學習如何因應那種痛徹心扉的痛苦，答案不是服用普拿疼。交易人的方法各不相同，取決本身處境而定。我將在此分享我的心得，期望你能有所得。


    ## 我的痛苦長征之旅


    我征服痛苦的方式，就是成為系統型或機械型交易人。我藉小規模交易征服痛苦：任何一筆交易，我不會拿帳戶很高比率的錢去冒險。我使用明智的資金管理策略。我的交易金額很小，任何個別交易的結果，我都不感興趣。任何個別交易的結果都不會影響我一整年的表現。我的交易金額很小，因此當我賠錢，那只不過是九牛一毛；它只會帶來很小的痛苦。我拿簡單、客觀和獨立的策略去交易，我曉得那些策略將來很有可能繼續保持穩健。雖然高低起伏不定的非優化淨值曲線，讓人交易起來相當痛苦，我卻知道我交易的是對我有利的真實市場結構。我知道，結合我那保守的資金管理策略和正期望值方法，我投入交易的破產風險是0%。我曉得我在交易上可長可久。雖然痛苦，卻會持續給我報酬；報酬高到足以接受交易經常不斷的痛苦。


    每一天，我下委託單前，會在損益試算表上借記期望虧損金額，並且正面看待虧損。我所有的交易委託單，都下給一位傳統的顧問，他的經紀公司有一天二十四小時的交易櫃檯。我所有的委託單一下達，就會收到確認電子郵件，接下來我可以一整天都不管市場。我試著在那一天之中保持忙碌，防止心思飄到市場。我在那一天中不看市場，螢幕不開走勢圖。我不會去看市場一檔檔的跳動。忽視市場有助於我忽視預期會發生虧損的交易。保持忙碌，會使我的心思與交易保持距離。如果我能分心，不去理會交易，便能減輕交易的痛苦。寫書也是很棒的做法。分心能讓我不去注意市場的走勢，在幾乎沒有痛苦下交易！


    機械型交易有助於我消除交易裡的情緒，緩解由交易而來的各種痛苦。我因此能將交易視為一種事業，或許不能讓你每分鐘笑一次，或許感覺失望多於勝利，但至少能讓你獲利，至少會獎勵認真經營交易事業的交易人。此外，它是一種事業，需要投入的心力，遠多於單純日復一日執行交易。


    這就是我個人的緩解痛苦配方，希望也對你有幫助。但我也明白，即使我苦口婆心，還是會有很多充耳不聞，帶著全部家當，一頭栽進交易，重蹈覆轍。這就是人性。因此，能夠換顆智慧腦袋的人，交易之路會更好走。


    我對管理痛苦的想法，適用於接納本書通則的交易人，以及即將以0%的破產風險展開交易的人。但如果你是缺乏耐性的交易人，發現自己處於砲彈猛烈攻擊的傘兵坑中——請深呼吸，你所做的一切都很正常，都是學習曲線的一部分。大部分交易人都是過來人，包括我自己。但是，如果你缺乏耐性，請不要開立高額交易帳戶。一切保持溫和。


    ## 痛過才懂通則的重要


    通常只有透過經驗和痛苦，交易人才會徹悟，簡單的觀念才行得通。只有透過經驗和痛苦，交易人才能欣賞、重視簡單。新手交易人因為無知，所以不理解，也不懂得欣賞。遺憾的是，大部分新手都誤信成功交易的答案只存於複雜。他們自然而然被艱深難懂和有趣的觀念所吸引。


    就像經父母告誡不要碰火的小孩，得真的燙到了才學到教訓，儘管你真的想要傾聽和學習，卻必須走過屍橫遍野的交易失敗之路，體驗過交易的失敗和痛苦，才會敞開心胸，學習交易真正行得通的事情。在親身歷經傳統技術面分析失敗的苦頭之前，你對虛假的承諾沒有免疫力。這麼說令人遺憾，卻是事實。而一旦你體驗到失敗的痛苦，準備好接納成功交易通則，請記得本書，撥出時間溫習一些內容，真的開始傾聽。


    我不想成為掃興的人。每個人都有希望；只是交易這條路可能不像到公園散步那麼簡單。但是，儘管交易成功是困難的事，伴隨經常不斷的痛苦，請記得它也有獎酬，你終究會賺到錢。相對於所有的「痛苦」努力，獎酬並不差。


    ## 提醒：謙卑，再謙卑


    市場最大逆境會為所欲為，給你許多痛苦，誘使你偏離選定的道路，無法成為成功的交易人。如果能保持謙卑、時時提防最大逆境，做好防禦工事，就足以不屈不撓，度過痛苦。不保持謙卑，不臣服於市場最大逆境，交易生涯會非常短暫。賈斯在《海龜投資法則》一書中說得好：


    想要成為出色的交易人，必須征服自尊，並且培養謙卑的態度。謙卑讓你接受將來是不可知的。謙卑會阻止你嘗試做預測。謙卑會阻止你在交易對你不利時，自行插手，最後虧損出場。謙卑會讓你接受交易是根據簡單的概念，因為你不需要知道任何秘密，好覺得自己很特別。


    莫忘市場的頭號準則：最大逆境。


    ## 小結


    交易心理面是交易實務三大支柱的最後部分，也是第五項成功交易通則的最終章。交易心理是交易生存和成功的要素。


    我和絕大多數人對心理面的看法相左。我相信資金管理和交易方法的位階高於交易心理。我也相信，交易心理是資金管理和交易方法的重要黏合劑。而交易心理只不過是管理交易人的希望、貪婪、恐懼和痛苦。


    正確運用資金管理，正確地設計、發展和驗證交易方法，能大幅緩和希望所帶來的心理障礙。發展溫和的期望，能夠管理貪婪。如果在市場開盤前，先在損益試算表上借記期望虧損，挺身面對虧損，就是在管理虧損的恐懼上邁出一大步。此外，交易是充滿痛苦的世界，即使是頂尖交易人，痛苦也避無可避。我在本章分享我個人如何緩解本身的交易痛苦。能夠接受最大逆境的存在，就能做好痛苦管理。


    我個人會將交易心理障礙管理要點彙整如下，印出來放在電腦螢幕上方。或許你也可以如法炮製。


    ## · 管理「貪婪」


    交易目標沒有對或錯，而是以溫和的期望，管理風險資本。


    ## · 管理「恐懼」


    我預期今天執行交易會發生虧損，而且是經歷歷年來虧損最長和賠償最糟的一連串交易。在我下委託單之前，我會將期望虧損借記在損益試算表上。我會正面看待所發生的虧損，因為我想要成為最優秀的輸家和長期的贏家。


    ## · 管理「希望」


    即使我今天賠錢，我也會有個美好的一天，因為我已經遵循交易計畫，而它有長期的正期望值。


    ## · 管理「痛苦」


    身為交易人，我知道我生活在一個痛苦世界。當我賠錢，心會痛。當我賺錢，想到錯失的機會，心會痛。當我不在市場之中，我會因為相信自己錯失了下一波的大走勢而心痛。當我費心研究新觀念之後，才發現它們沒有用，心會痛。我知道最大逆境會使我的交易經驗充滿失望和痛苦。我知道它意圖減低我的風險資本，阻止我交易。我知道最大逆境存在，也曉得它的能耐。我會忍受它帶來的痛苦。我會不屈不撓。我會成功。


    下一章要討論成功交易的最後一項通則——交易的實踐，融會貫通所有成功交易通則。


    ## 第11章


    ## 第六通則：交易的實踐


    首先，恭喜你一路堅持，走到這裡。現在，終點近了！第六項、也是最後一個通則，是前五項成功交易通則的累積。


    剛開始交易時，你會發現交易相當輕鬆簡單。但是，新鮮感退煥後，你可能開始覺得交易是重複、枯燥和痛苦的工作。這時不要洩氣，要滿足。因為這顯示你已經抵達正確的目的地。交易已經成為你的事業，是一份以專業方式執行的工作。你不再是為了刺激和興奮而交易。你交易是為了賺錢。可能有許多時候，你不喜歡自己正在做的事。當你開始厭惡交易，你應該感到振奮，因為這時你對任何個別交易結果已經無動於衷。這顯示你終於學會如何應用適當的資金管理策略。這時的你，專注於經營一個成功交易事業的程序，而不在意它們本身的成果。就在這時，你成為專業交易人。


    ## 融會貫通


    當你開始交易，每天的例行工作應該如下所述。


    ## 交易方法


    你的第一步是確認某個格局是否存在。如果存在，就決定交易計畫的進場水準、停損水準以及出場指令。從你估計的進場和停損水準，計算每口合約或部位規模的冒險金額。


    ## 資金管理


    第一項生存任務是確定你是否仍處於財務邊界的風險資本上限之內。如果累積交易虧損已經超過風險資本上限，你就應該停止交易，轉身離去。


    第二項生存任務是檢視系統停損點，觀察所用方法的淨值動量是否為正值。務請將系統停損點重疊在交易方法的假設單口合約淨值曲線上。淨值曲線有三部分：


    - 假設性的交易歷史

    - 在驗證期間蒐集的 30 筆 TEST

    - 假設性成果實況


    如果交易方法的單口合約淨值曲線高於系統停損點，就下委託單，進場交易。反之，就不要交易，並繼續更新淨值曲線，等候它回到系統停損點之上，才恢復開始交易。


    如果進場交易，你的第三項生存任務是計算在你的資金管理策略和帳戶規模之下，可以交易的合約口數，或者部位規模。一

