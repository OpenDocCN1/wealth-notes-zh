    之後就可以向顧問下委託單（包括設定進場和出場水準等條件）。一旦顧問確認收到且了解你的委託單，你就可以忘掉市場。使用電子交易平臺的人，應該將平臺接受委託單的畫面做截圖並儲存。


    接著就是等候，等顧問通知委託單是否成交。如果是，就必須依照交易計畫管理部位。一旦部位軋平，就更新損益試算表和單口合約淨值曲線（不計滑價）。收到交易報表時，和交易紀錄相互對照。如有出入，聯絡顧問。


    現在我們花點時間，討論寫委託單的正確方式。


    如何正確下買單和賣單看起來不難，但由於有不少術語和委託單種類，新進交易人起初可能會一頭霧水。下委託單要了解的事情，遠多於單純的買進或賣出指示。以期貨、即期外匯、外匯保證金交易、外匯、選擇權和差價合約來說，有許多委託單種類和表示方式可用。委託單可以下給顧問，或者輸入線上電子交易平臺。我在此是假設是下單給顧問。


    下期貨委託單的一個好習慣，就是確認想要交易的合約月份。雖然大部分期貨交易是以當月或即期合約月份執行。注意：外匯保證金交易、即期外匯、外匯和差價合約沒有到期日，所以不需要提及「合約月份」。接下來的例子都是指3月金融時報股價指數（FTSE）期貨合約。


