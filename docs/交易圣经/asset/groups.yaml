    \        Else\n            EquityCurve(i) = EquityCurve(i - 1) + TradeResult(j)\n\
    \        End If\n\n    Add to our account balance\n        Account_Balance = Account_Balance\
    \ + TradeResult(j)\n\n    Calculate current drawdown and percentage drawdown\n\
    \        Account_DrawDown = Account_New_High - Account_Balance\n        Account_DrawDown_Percent\
    \ = Account_DrawDown / Account_New_High\n\n        Calculate the number of losses\
    \ before ruin\n            Number_of_Losses_Before_Ruin = Number_of_Losses_Before_Ruin\
