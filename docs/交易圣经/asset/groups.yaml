    |

    |---|---|---|---|---|---|---|---|---|

    | $20,000 | $22,402,163 | -$1,363,750 | -32.2% | 16 | 1 | 4 | 100 | 8.5% |


    初始淨值 $20,000

    起始保證金 $4,000

    固定單位 30

    最大合約數 100


    ![](img/4cb0a78760f87b9407822631d12abbf8_160_0.png)


    這裡的關鍵變數是帳戶餘額，以及想要的資金單位或交易筆數。固定單位和固定風險分道揚鑣的時候，就是帳戶餘額增加之際。隨著帳戶餘額創下淨值新高，固定單位會要求你重新計算每一筆交易的金額風險。固定金額風險的計算現在成了：


    每筆交易的金額風險 = 更高 的新帳戶餘額 / 固定資金單位數


    賺錢且帳戶餘額增加時，固定單位會要求每筆交易拿更多的錢去冒險。雖然交易單位數（在帳戶減為零之前，想要交易的數目）會維持固定，每筆交易實際金額風險會增加。


    現在，只有在帳戶餘額增加時，每單位的金額風險才會發生變化。在賠錢時，它不會降低。如果你處於報酬，固定單位仍會要求你每筆交易依相同的金額風險去冒險。對交易人來說，這裡的關鍵變數是他們想要交易的固定資金「單位」數。


    根據第4章有關破產風險的討論，一位交易人應該考慮擁有的最低單位數是20。在固定風險中，我們使用40個資金單位，所以就這個例子來說，我將假設交易人的偏好是擁有30個資金單位。


    如果一名交易人一開始有20,000美元的帳戶餘額，而且希望交易固定的30個資金單位，他只要將帳戶餘額除以30，就能算出每筆交易的金額風險。這將是他準備在每一筆交易上冒險的資金數量。在本例中是667美元。因此，你將只操作金額風險等於或低於667美元的交易。


    要計算交易合約口數，只要拿固定金額風險除以個別交易風險（也就是，進場和停損價格之間的金額，加上經紀費用），務必以無條件捨去法取整數。公式如下：


    ```

    合約口數 = 金額風險 / 交易風險

    ```


    如果個別交易風險是 200 美元，根據這個公式來計算，你將交易三口合約（$667 / $200）。假設固定風險為 667 美元，將交易的合約口數如表 8.5
    所示。


