    能的走向，而且它們不會時時都對。良好的交易計畫不會盲目遵循你的格局。太多交易人未能區分交易格局和交易計畫，將技術面分析和交易混為一談。有個交易計畫等著市場證實你的格局，並不能保證市場會持續往你的方向走；但是，它能防止你執行許多邊際交易。


    本質上，優良的交易計畫應該要你付出較高的價格以作多，賣出較低的價格以放空。圖9.3即是一例。


    這張走勢圖畫出圖9.2看到的阻力水準。它畫出舊支撐成了新阻力。這個例子中，有兩個格局確認了潛在的阻力。優良的交易計畫不會只在阻力點設個價格掛單賣出，而是等到市場接近收盤才行動。如果市場顯得疲弱，有效的交易計畫會設法進場交易。如果市場收盤價格低於前一天的收盤價，也低於當天的開盤價，優良的交易計畫會承認市場  統露疲態，並且設法放空，在市場收盤時賣出。每個例子中，阻力水準不只存在於下跌趨勢中，它們也因為見到市場越走越低，而證實跌勢展開。


    市場結構中的許多點，可以用來做為證實交易格局的進場水準。如果你你的格局確認了一個潛在的支撐水準，交易計畫能在進場之前，藉檢查下列各點是否存在，而證實市場展現強勢：


    +   - 當天的收盤價高於開盤價

    - 當天的收盤價高於前一天的收盤價

    - 當天的收盤價高於前二天、三天、四天或五天的收盤價

    - 市場衝破前一天的收盤價或最高價

    - 市場衝破前一週的收盤價或最高價

    - 市場衝破前一個月的收盤價或最高價'
  - '[PAGE 222]


    反過來說，對潛在的阻力水準而言也是一樣。在決定你的進場水準時，你想怎麼樣就怎麼樣。至於停損和出場水準，有各式各樣的觀念可以利用，而且同樣的，你想怎麼樣就怎麼樣。


