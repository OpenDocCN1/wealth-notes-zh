    隨機的。在交易時，千萬不要自認你會找到一把鑰匙，打開交易成功的秘密。


    ## 最優秀的輸家，贏！


    明白成功唯一真正的祕密是管理損失，你的準備工作又邁進了一步。如果你能將損失壓低至容易管理的水準，獲利又大於損失，就可以在這場輸家遊戲脫穎而出。你手上的賺錢貨，幾乎可以置之不理，因為它們一般而言會自己照顧自己——它們起飛之後，就很少回頭。但是，想要成功，你需要將所有精力和決心集中於管理損失。


    我在閱讀亞瑟·辛普森（Arthur L. Simpson）寫的《幽靈的禮物》一書時，讀到書中匿名人物幽靈所說一句很棒的話：最優秀的輸家就是長期的贏家。我認為這句話最能描述將心力集中在管理風險的重要性。


    這本書基本上是訪問來自美國芝加哥一位三十年的資深交易人而寫成的。這位交易人希望提供他的交易洞見，但不願身分曝光，因此化名為「幽靈」。


    如果你像我是個機械型交易人，你永遠都不應該移動停損點。你必須遵守嚴格的交易計畫。此外，在設計交易計畫時，你應該執行雙重停損點啟動器（dual-stop trigger），一個是根據價格，另一個是根據時間。


    所有這些，都回歸管理風險。如果你下了一筆自由裁量型交易，而它沒有動，你應該傾聽市場的聲音，跳出來。你應該當個最優秀的輸家。不要讓賠錢的交易流連不去，一點一滴腐蝕你的信心，在一檔又一檔中磨損，最後跌到你原先設定的停損水準。


    當個最優秀的輸家，表示你應該盡快軋平賠錢的部位。


    交易成功唯一真正的秘密，是當個最優秀的輸家。所以這應該是你的目標。最優秀的輸家總是尋求縮減虧損。你應該問自己：是否有更好的方式賠得更快，而不是去操弄你的格局。


    ## 注重風險管理


    到現在為止，你應該知道交易是風險很高的事業。這表示，成功的交易其實都是在談成功的風險管理。交易人要生存，就需要將交易事業視為風險管理事業。


    如果你有機會和成功的交易人一談，你可能發現對方念茲在茲的，是如何改善風險管理。良好風險管理的核心是資金管理（稍後會談更多）：但是，在你能夠誠實應用合適的資金管理原則之前，首先最重要的是正視風險。


    優良的交易人是優良的風險管理人。這是贏家和輸家的差別。他們正視市場對他們的處置、他們了解這是一場輸家的遊戲，他們必須活著當最優秀的輸家，他們的目標則是抱持溫和的期望，管理風險資本。他們一心想的只有生存，而這有賴於他們成功地當個優秀的風險管理人。


    如果你想交易，你需要從風險管理人的觀點來執行你的任務；把將交易視為賺取利潤的偏見留給賭客。


    ## 尋找交易夥伴


    了解擁有交易夥伴的重要和價值，也是準備工作的一部分。這是準備工作的終點。在進一步往前走之前，你需要審視自己的交易決心——如果你接受前面我所說的各點，現在是往前邁步的時候；如果不接受，你可能不應該從事交易。


    在準備階段，你要找個交易夥伴。這是準備展開交易很重要的一部分。你的交易夥伴不見得必須是交易人，但必須是你敬重的人。交易夥伴必須和你保持適當的距離，也就是不能和你住在同一個屋簷底下。他對你所做的事情感興趣，而且同意幫忙。


    找個交易夥伴的目的，是防止交易人欺騙自己。市場裡的交易人故事，令人大開眼界。大部分人展開交易之前，都很理性、客觀和誠實。可是在什麼都不懂的情況下開始交易，他們就搖身一變，落入不理性和妄想。他們搞不清楚自己的能力，並且開始對自己撒些善意的小謊言。


    交易夥伴會幫助你保持理性和誠實。交易夥伴扮演兩個重要的角色：一是在交易之前，一是在實際交易期間。


    首先，交易夥伴會使用 TEST 程序（稍後會談更多），協助你正確驗證交易方法。在證明方法可能有正期望值之前，他不會鼓勵你投入市場、展開交易。其次，當你開始交易，交易夥伴會充當你的良心，要你保持誠實。


    交易夥伴知道你的財務標竿，至少應該包括財務邊界、溫和期望，以及資金管理準則。


    你應該每個向交易夥伴報告，請他就你的財務標竿，衡量你的績效。他將充當你的交易告解人。這將有助於你嚴守紀律和保持一致。當你知道有交易夥伴盯著，就比較難偏離你的交易計畫。這也有助於你保持理性。


    問題在於你能不能找到交易夥伴，如果你不能在朋友群中找到合適且願意擔任的候選人，你應該考慮加入志同道合的人組成的協會，例如許多國家都有技術面分析協會。


    ## 設定財務邊界


    這是完成準備工作的最後一步。就像交易時要使用停損點，你也應該對自己的交易生涯設定財務邊界。你應該建立個人的財務承諾，以學習如何交易成功。這個財務承諾是指你準備投資於教育的風險資本——或者你準備賠掉的總金額。讓你的交易夥伴知道你的極限，並且做出個人的承諾，表示如果你賠掉這個總額，你會接受交易並不適合你的事實，然後死心轉頭離開。


    就像交易時應該設定應變停損點，你應該在著手交易之前，就知道自己準備賠掉多少錢。我敢說，一定有許多交易人曾經想過：要是自己曾對某個尊敬的人作出類似的承諾，並在到達極限時掉頭而去，那有多好。如此一來，他們會比今天的處境快樂許多，口袋也飽滿許多！


    ## 小結


    但願第一項成功交易通則已讓你做好準備，接受交易是辛苦活。你要正視市場，承認交易成功可能是你嘗試過最困難的挑戰之一。基本上，交易就像新兵訓練營。


    如果你決定走上交易這條路，你必須接受市場會時時與你作對。市場會在每個轉彎處設置路障。由於人性，你會發現很難建立專業目標和溫和的期望。和你同樣進場交易的人，大多將是輸家，所以很難找到正面的角色模範。市場的隨機性根深柢固，關於走向，不會留下太多線索。關於獲利，恰好和一般人的直覺相反：抱走獎金的並不是贏家，而是最優秀的輸家。賺錢背後的主要動因，和交易績效的關係不是那麼大，反而和當個優秀的風險管理人較有關係。交易夥伴會幫助你走在正確的軌道上，而建立財務邊界（可望）會限制你的潛在總損失。


    如果以上這些你都能接受，你已經貫通第一項成功交易通則——觀念的準備。你已做好準備，能夠接受意料未及的事發生，而且你能在良好的狀態下繼續前行。


    做好準備之後，下一項成功交易通則要談的是「思考的啟蒙」。


    ## 第4章


    ## 第二通則：思考的啟蒙


    本章探討第二項成功交易通則——思考的啟蒙。


    第二通則將協助你避免陷入技術面分析的混淆世界，並且有助於你專注於交易生存的必要事務。你會注意到，現在的重點放在「生存」。從這裡開始，你的觀點應該從想要交易成功，轉為想在交易上「生存」。


    正如我說過的，交易有風險。為了成功，必須成為優秀的風險管理人。因此，你現在的交易重點應該是求生存。如果你能在交易上生存下去，你就會成功。


    本章會引導你到應該集中你的精力和資源的地方去。當你明白下列各項在交易上生存的條件，你就算開竅了：

    - 避免破產風險

    - 擁抱交易的聖杯

    - 追求簡單

    - 涉足大多數人害怕的地方

    - 以 TEST 驗證期望值。


    如果你想生存下去，就必須學會待在這些準則所圍築的邊界之內，如圖4.1所示。


    ## 避免破產風險


    我個人認為，避免破產風險可能是最重要的交易概念。可是大部分交易人卻無視於它。很少作者寫文章談它。很少研討會提到它。很少講習班教它。有那麼多交易人根本不知道自己的個人破產風險，所以賠錢有什麼好奇怪的？


    ![](img/4cb0a78760f87b9407822631d12abbf8_70_0.png)


    圖4.1 啟蒙圈


    計算破產風險能讓你了解為何交易會失敗。是的，你知道自己賠了錢，但可能不是非常清楚為什麼。了解破產風險會給你答案。而答案揭曉的那一刻，就是你恍然開悟之時。


    什麼是破產風險？破產風險指的是你賠錢賠到必須停止交易的可能性。就這麼簡單。避免破產風險是身為風險管理人的第一優先要務。只要能避免破產，就能生存，進而交易成功。


    破產風險是統計概念，告訴交易人破產的機率——也就是累積龐大虧損以至於停止交易的可能性。這個累積虧損稱之為「破產點」(point of ruin)。


    破產風險不見得是賠掉全部帳戶餘額。它可能是損失帳戶的 50%、75% 或 100%，取決於你個人的風險忍受度。破產點是準備階段建立的財務邊界或風險資本。


    避免破產風險的第一步，是計算達到破產點的機率。如果機率太高，你必須設法降低。降低破產機率到可接受的水準，就等同往交易生存邁進一大步。基本上，任何單筆交易的資本占比越高，出局或遭受破產風險的機率就越高。


    舉個例子。假設有兩名交易人，分別是鮑伯和莎莉。他們參加相同的研討會，學到一個簡單的貨幣交易系統，稱作 System_One。System_One 的平均獲利等於它的平均虧損，準確率有
    56%。鮑伯和莎莉各自建立 10,000 美元的財務邊界，並且把破產點訂在風險資本虧損百分之百（10,000 美元）。鮑伯屬於冒險型交易者，決定每個訊號（換句話說，這是他的交易格局）拿
    2,000 美元去冒險。莎莉比較保守，決定每個訊號（或者交易格局）只冒險 1,000 美元。


    因此，鮑伯有 5 個資金單位可交易（$10,000 ÷ $2,000），莎莉有 10 個資金單位（$10,000 ÷ $1,000）。如果鮑伯開始交易，連續虧損5筆，他就會破產。莎莉則是連賠10筆才會破產。


    鮑伯和莎莉必須問自己：我的破產風險是多少？也就是什麼時候會賠掉10,000美元？


    要回答這個問題，可以用圖4.2的破產風險公式。


    這條公式假設交易人的平均獲利等於平均虧損。圖4.3說明如何計算交易人鮑伯的破產風險。


    圖4.4表示鮑伯和莎莉各自的破產風險。


    ## 圖4.2 破產風險公式


    ## 圖4.3 鮑伯的破產風險


    ![](img/4cb0a78760f87b9407822631d12abbf8_73_0.png)


    ## 圖4.4 破產風險隨資金單位的增加而下降


    如圖所示，雖然鮑伯和莎莉都交易相同的貨幣系統，破產機率卻大不相同。鮑伯有30%的機率失去風險資本，而莎莉只有9%的機率出局。莎莉的風險顯然低於鮑伯。


    雖然System_One的準確率是56%，卻不表示不會產生一長串的賠錢訊號。因此，如果兩名交易人一開始各有10,000美元，那麼只要連續5個賠錢訊號，就會毀掉鮑伯，而莎莉必須連賠10個訊號才會落到相同的下場。


    但是，莎莉的破產機率（9%），是否低到足以在交易上生存？答案為否。身為交易人，你需要在0%破產機率下交易。只要財務破產的統計機率高於零，都算太高。這就像一紙鍍金保證書，保證你最後會破產；但是，即使你在交易時的破產風險是0%，你必須了解，這並不保證你就能避免破產。這是因為零破產風險不能保證你的交易方法準確，而且平均獲利和平均損失將來不會與時俱變。如果它們保持不變，或甚至改善，你的0%破產風險會確保你避免毀掉自己的帳戶。但是0％破產風險不能保證你的交易方法將來不會惡化和繼續行得通。你需要了解，破產風險是個統計量數，有賴於它的投入因素。如果它們保持不變或者改善，那麼0％破產風險會防止你達到破產點。但是如果它們接下來受到傷害，你的破產風險也會破0％。你需要記住，破產風險只是統計量數，不是奇蹟創造者！


    ## 降低單一資金單位金額


    接下來的問題是：你可以如何降低一種方法的破產風險？前述例子提供了第一個線索——每一筆交易拿比較少的錢去冒險。這句話凸顯了資金管理的重要性，以及身為風險管理人的你，如果要在交易上生存和成功，就必須做對資金管理。如果想把你的破產風險拉到可接受的極限，依據邏輯，你需要在任何個別的交易上，拿交易帳戶比較低的金額去冒險。如果金額太高，你會被擊倒出場。


    這是我開始交易時，所犯的最大錯誤。我對破產風險的觀念，以及如何使用資金管理以降低和管理破產風險，毫無概念。我唯一的想法是「我能從交易期貨賺到多少錢？」請不要重蹈我的覆轍！


    我們再加進另一位交易人湯姆。比較他和鮑伯、莎莉的破產風險。交易人湯姆也是用System_One交易貨幣，而且同樣有10,000美元的財務邊界和破產定義。他的經驗比另外兩個人稍多一點，知悉破產風險這個概念，也知道如何降低它。湯姆知道，每筆交易拿比較少的錢去冒險，可以降低破產機率。湯姆希望以較低的破產風險交易，所以決定每個訊號只拿500美元（或者交易格局）去冒險。因此，交易人湯姆有20個資金單位可交易（$10,000
    ÷ $500）。也就是說，最低限度而言，如果他一直沒有收到獲利訊號，他會擁有足夠的錢下20筆交易，才會破產。我們可以使用相同的公式算出湯姆的破產機率。圖4.5顯示各個交易人的破產風險。


    ![](img/4cb0a78760f87b9407822631d12abbf8_75_0.png)


    ## 圖4.5 破產風險比較


    如圖所示，湯姆將風險降到每個訊號500美元，因而有20個交易機會，而鮑伯只有5個，交易人莎莉則是10個，如此一來，他的破產風險降低到1%！1%的破產風險遠比交易人莎莉的9%更能接受。當然，如果鮑伯贏了，湯姆賺的錢不會像鮑伯那麼多；但另一方面，鮑伯有可能出場，無法享受許多次2,000美元的獲利，而這個機率則高得多（30%）。


    切記：交易成功不過是力求生存和做好風險管理。降低破產風險的第一課，就是降低每筆交易的冒險金額；換句話說，就是學習應用合理的資金管理原則。你最起碼應該將風險資本分成20份，至少擁有20個資金單位，將破產機率降低到1%（前提是你所使用的方法，準確率是
    56%，平均獲利相對於平均虧損是 1:1）。雖然這不是生存的保證，至少有助於降低破產機率，提高生存機會。


    ## 提升交易方法的準確率


    如何降低破產風險的第二課，是改善所用方法的準確率。假設 System_One 升級為 System_One_MkII。System_One_MkII 的改良在於準確率，從
    56% 的獲利筆數，提升為 63% 的獲利筆數。此外，平均獲利相對於平均虧損的報酬仍然相同。假設每個交易人的單筆冒險金額不變（分別為 2,000 美元、1,000
    美元和 500 美元），現在我們利用前述的公式，以準確率較高的系統，重新計算各人的破產風險，如圖 4.6 所示。


    以準確率較高的系統交易（平均獲利相對於平均虧損報酬仍然相同），不管每筆交易金額水準（資金單位數）如何，都能全面降低破產風險。鮑伯的破產風險從30% 降為7%，莎莉從9%降為0.5%，湯姆從1%降為0%。這沒什麼好驚訝的，因為依據定義，準確率較高的系統，失敗機率應該較低，因為它獲利的次數會多於虧損的次數（假設平均獲利相對於平均虧損報酬不變）。


    ![](img/4cb0a78760f87b9407822631d12abbf8_76_0.png)


    圖 4.6 高準確率策略的價值


    在繼續談下去之前，我要指出，數學上，破產風險不可能達到0%。但是絕對有可能低於0.5%，在四捨五入之後成為0%。


    ## 改善相對報酬比


    降低破產風險的第三種方式，是改善你所用方法的平均獲利相對於平均虧損報酬。遺憾的是，沒有一條簡單的公式，可以計算平均獲利大於平均虧損的破產風險。有文獻試著以模擬的方式，證明較高的報酬如何降低你的破產風險。在好友兼交易人傑夫·摩根（Geoff
    Morgan）的協助之下，我寫了一個類似的模式（破產風險模擬器），仿效瑙澤·鮑爾紹拉（Nauzer Balsara’s）所寫的《期貨交易人的資金管理策略》（Money
    Management Strategies for Futures Traders）邏輯，如附錄B所示。附錄A解釋了我的破產風險模擬器的邏輯，附錄B則完整揭露程式設計碼。


    我的模擬結果如表4.1所示。每一次模擬，我都假設所用方法的準確率是50%，交易人有20個資金單位。我定義破產為帳戶賠償50%。每個報酬比率，我會跑30次模擬，然後取平均值，產生一個破產風險值（附錄C彙總了30次模擬的結果）。除了1.1:1


    表4.1 各種獲利相對於虧損比率的破產風險模擬


    | 平均獲利相對於虧損比率 | | | | | | |

    |---|---|---|---|---|---|---|

    |  | 1.0 | 1.1 | 1.2 | 1.3 | 1.4 | 1.5 |

    | 破產風險 | 64% | 20% | 32% | 21% | 5% | 0% |


    的報酬比率，這個簡單的模擬顯示，較高報酬比率降低了破產風險。以這個例子來說，會讓你想要交易的唯一報酬是1.5:1，因為它模擬出來的破產風險是0%。其他都高於0，因此破產，只是時間早晚的問題。


    你現在知道，優秀的風險管理人在挑選交易方法時，是以0%破產風險為目標。


    總而言之，降低破產風險有三項關鍵工具：

    - 降低每筆交易的冒險資金金額

    - 提高準確（或者獲利）率

    - 提高平均獲利相對於平均虧損的報酬比率


    前述三項就是對抗破產風險的關鍵工具，它們可以彙總為兩個關鍵武器：

    - 資金管理

    - 期待值


    對抗破產風險的第一道防線，是良好的資金管理意識、知識和應用。第二道防線是期望值重於準確率的意識、知識和追求。我會在本章稍後進一步探討期望值，資金管理策略則在第8章深入討論。


    要知道，破產風險時時存在，身為優良的風險管理人，應該對破產風險避之唯恐不及。這麼做，就能生存；能生存，交易就會成功。


    但是在我繼續談下去之前，我要指出，決定破產風險的高低，受到許多限制。你需要了解，這個數字：

    - 只是個統計量數。它不是規避破產風險的保證，因為它取決於投入因素。如果投入因素受傷害，你也會受傷害；

    - 不是靜態的，會隨著每筆交易而變動；

    - 在實際交易上沒有實務價值。


    真正在交易時，並不會根據破產風險做部位規模或終止交易等任何決策。稍後你會學到，你需要使用淨值動量和系統停損等觀念，幫助你判斷何時停止使用某種特定的方法去交易。破產風險並非決策的根據。


    儘管有這些限制，破產風險的概念仍然是交易圭桌。它是通往生存的門道。我認為，破產風險是打開真實交易知識之門的鑰匙。因為就如同前面提過的，在我眼中，破產風險是交易最重要的概念。


    根據破產風險原則，除非破產風險是0%，否則不應該考慮交易。每個交易人都有統計上的破產風險，但大多都不知道。大部分人都是無知的。大部分人都賠了錢。不知 道自己破產風險的人，應該立刻計算，如果高於0%，就應該停止所有交易。市場的事和他們不相干，因為他們一定會破產；只是他們不知道自己什麼時候會破產。一旦交易人曉得破產風險的重要性，他們就會成為懂更多的交易人，而且如果他們不自欺欺人，他們會掉頭離開交易，直到他們能將自己的破產風險降到0%為止。務請記住，任何高於0%的破產風險都勢必讓交易人破產；這只是時間早晚的問題。


    正如我說過的，我相信破產風險是交易最重要的概念。它直指交易的真理，並且指出，如果你對交易可能受到的危害不夠敏感，就難以長久。


    如果每筆交易以較低金額冒險，就會降低破產風險，而且會有較高機率享受長期的交易生涯。如果能改善所用方法的準確率，就會降低破產風險。如果能改善報酬比率，就能降低破產風險並提升生存勝算。如何降低破產風險並不重要，做就對了。重要的是，除非破產風險是0%，否則交易市場不干你的事。非0%破產風險不交易！切記！切記！


    ## 擁抱交易的聖杯


    發現交易真正的聖杯，是啟蒙的一環。你可能聽過有人（我以前就是）追求完美的交易系統。所謂完美的交易系統，是指準確率非常高，賠損少之又少——也就是交易的聖杯。我敢說，知道交易系統的聖杯並不存在，一點不叫人驚訝。


    但是我心中確實有個交易的聖杯：一種能夠產生正期望值、可以跨多重機會進場交易的方法。如圖4.7所示。


    假使你避開破產風險而存活下來，那麼你的目標就是運用經過驗證的優勢與多重交易機會。只有這樣，你的交易帳戶才會增


    ![](img/4cb0a78760f87b9407822631d12abbf8_80_0.png)


    圖4.7 我的交易聖杯

    '
  mdcn: '

    隨機的。在交易時，千萬不要自認你會找到一把鑰匙，打開交易成功的秘密。


    ## 最優秀的輸家，贏！


    明白成功唯一真正的祕密是管理損失，你的準備工作又邁進了一步。如果你能將損失壓低至容易管理的水準，獲利又大於損失，就可以在這場輸家遊戲脫穎而出。你手上的賺錢貨，幾乎可以置之不理，因為它們一般而言會自己照顧自己——它們起飛之後，就很少回頭。但是，想要成功，你需要將所有精力和決心集中於管理損失。


    我在閱讀亞瑟·辛普森（Arthur L. Simpson）寫的《幽靈的禮物》一書時，讀到書中匿名人物幽靈所說一句很棒的話：最優秀的輸家就是長期的贏家。我認為這句話最能描述將心力集中在管理風險的重要性。


    這本書基本上是訪問來自美國芝加哥一位三十年的資深交易人而寫成的。這位交易人希望提供他的交易洞見，但不願身分曝光，因此化名為「幽靈」。


    如果你像我是個機械型交易人，你永遠都不應該移動停損點。你必須遵守嚴格的交易計畫。此外，在設計交易計畫時，你應該執行雙重停損點啟動器（dual-stop trigger），一個是根據價格，另一個是根據時間。


    所有這些，都回歸管理風險。如果你下了一筆自由裁量型交易，而它沒有動，你應該傾聽市場的聲音，跳出來。你應該當個最優秀的輸家。不要讓賠錢的交易流連不去，一點一滴腐蝕你的信心，在一檔又一檔中磨損，最後跌到你原先設定的停損水準。


    當個最優秀的輸家，表示你應該盡快軋平賠錢的部位。


    交易成功唯一真正的秘密，是當個最優秀的輸家。所以這應該是你的目標。最優秀的輸家總是尋求縮減虧損。你應該問自己：是否有更好的方式賠得更快，而不是去操弄你的格局。


    ## 注重風險管理


    到現在為止，你應該知道交易是風險很高的事業。這表示，成功的交易其實都是在談成功的風險管理。交易人要生存，就需要將交易事業視為風險管理事業。


    如果你有機會和成功的交易人一談，你可能發現對方念茲在茲的，是如何改善風險管理。良好風險管理的核心是資金管理（稍後會談更多）：但是，在你能夠誠實應用合適的資金管理原則之前，首先最重要的是正視風險。


    優良的交易人是優良的風險管理人。這是贏家和輸家的差別。他們正視市場對他們的處置、他們了解這是一場輸家的遊戲，他們必須活著當最優秀的輸家，他們的目標則是抱持溫和的期望，管理風險資本。他們一心想的只有生存，而這有賴於他們成功地當個優秀的風險管理人。


    如果你想交易，你需要從風險管理人的觀點來執行你的任務；把將交易視為賺取利潤的偏見留給賭客。


    ## 尋找交易夥伴


    了解擁有交易夥伴的重要和價值，也是準備工作的一部分。這是準備工作的終點。在進一步往前走之前，你需要審視自己的交易決心——如果你接受前面我所說的各點，現在是往前邁步的時候；如果不接受，你可能不應該從事交易。


    在準備階段，你要找個交易夥伴。這是準備展開交易很重要的一部分。你的交易夥伴不見得必須是交易人，但必須是你敬重的人。交易夥伴必須和你保持適當的距離，也就是不能和你住在同一個屋簷底下。他對你所做的事情感興趣，而且同意幫忙。


    找個交易夥伴的目的，是防止交易人欺騙自己。市場裡的交易人故事，令人大開眼界。大部分人展開交易之前，都很理性、客觀和誠實。可是在什麼都不懂的情況下開始交易，他們就搖身一變，落入不理性和妄想。他們搞不清楚自己的能力，並且開始對自己撒些善意的小謊言。


    交易夥伴會幫助你保持理性和誠實。交易夥伴扮演兩個重要的角色：一是在交易之前，一是在實際交易期間。


    首先，交易夥伴會使用 TEST 程序（稍後會談更多），協助你正確驗證交易方法。在證明方法可能有正期望值之前，他不會鼓勵你投入市場、展開交易。其次，當你開始交易，交易夥伴會充當你的良心，要你保持誠實。


    交易夥伴知道你的財務標竿，至少應該包括財務邊界、溫和期望，以及資金管理準則。


    你應該每個向交易夥伴報告，請他就你的財務標竿，衡量你的績效。他將充當你的交易告解人。這將有助於你嚴守紀律和保持一致。當你知道有交易夥伴盯著，就比較難偏離你的交易計畫。這也有助於你保持理性。


    問題在於你能不能找到交易夥伴，如果你不能在朋友群中找到合適且願意擔任的候選人，你應該考慮加入志同道合的人組成的協會，例如許多國家都有技術面分析協會。


    ## 設定財務邊界


    這是完成準備工作的最後一步。就像交易時要使用停損點，你也應該對自己的交易生涯設定財務邊界。你應該建立個人的財務承諾，以學習如何交易成功。這個財務承諾是指你準備投資於教育的風險資本——或者你準備賠掉的總金額。讓你的交易夥伴知道你的極限，並且做出個人的承諾，表示如果你賠掉這個總額，你會接受交易並不適合你的事實，然後死心轉頭離開。


    就像交易時應該設定應變停損點，你應該在著手交易之前，就知道自己準備賠掉多少錢。我敢說，一定有許多交易人曾經想過：要是自己曾對某個尊敬的人作出類似的承諾，並在到達極限時掉頭而去，那有多好。如此一來，他們會比今天的處境快樂許多，口袋也飽滿許多！


    ## 小結


    但願第一項成功交易通則已讓你做好準備，接受交易是辛苦活。你要正視市場，承認交易成功可能是你嘗試過最困難的挑戰之一。基本上，交易就像新兵訓練營。


    如果你決定走上交易這條路，你必須接受市場會時時與你作對。市場會在每個轉彎處設置路障。由於人性，你會發現很難建立專業目標和溫和的期望。和你同樣進場交易的人，大多將是輸家，所以很難找到正面的角色模範。市場的隨機性根深柢固，關於走向，不會留下太多線索。關於獲利，恰好和一般人的直覺相反：抱走獎金的並不是贏家，而是最優秀的輸家。賺錢背後的主要動因，和交易績效的關係不是那麼大，反而和當個優秀的風險管理人較有關係。交易夥伴會幫助你走在正確的軌道上，而建立財務邊界（可望）會限制你的潛在總損失。


    如果以上這些你都能接受，你已經貫通第一項成功交易通則——觀念的準備。你已做好準備，能夠接受意料未及的事發生，而且你能在良好的狀態下繼續前行。


    做好準備之後，下一項成功交易通則要談的是「思考的啟蒙」。


    ## 第4章


    ## 第二通則：思考的啟蒙


    本章探討第二項成功交易通則——思考的啟蒙。


    第二通則將協助你避免陷入技術面分析的混淆世界，並且有助於你專注於交易生存的必要事務。你會注意到，現在的重點放在「生存」。從這裡開始，你的觀點應該從想要交易成功，轉為想在交易上「生存」。


    正如我說過的，交易有風險。為了成功，必須成為優秀的風險管理人。因此，你現在的交易重點應該是求生存。如果你能在交易上生存下去，你就會成功。


    本章會引導你到應該集中你的精力和資源的地方去。當你明白下列各項在交易上生存的條件，你就算開竅了：

    - 避免破產風險

    - 擁抱交易的聖杯

    - 追求簡單

    - 涉足大多數人害怕的地方

    - 以 TEST 驗證期望值。


    如果你想生存下去，就必須學會待在這些準則所圍築的邊界之內，如圖4.1所示。


    ## 避免破產風險


    我個人認為，避免破產風險可能是最重要的交易概念。可是大部分交易人卻無視於它。很少作者寫文章談它。很少研討會提到它。很少講習班教它。有那麼多交易人根本不知道自己的個人破產風險，所以賠錢有什麼好奇怪的？


    ![](img/4cb0a78760f87b9407822631d12abbf8_70_0.png)


    圖4.1 啟蒙圈


    計算破產風險能讓你了解為何交易會失敗。是的，你知道自己賠了錢，但可能不是非常清楚為什麼。了解破產風險會給你答案。而答案揭曉的那一刻，就是你恍然開悟之時。


    什麼是破產風險？破產風險指的是你賠錢賠到必須停止交易的可能性。就這麼簡單。避免破產風險是身為風險管理人的第一優先要務。只要能避免破產，就能生存，進而交易成功。


    破產風險是統計概念，告訴交易人破產的機率——也就是累積龐大虧損以至於停止交易的可能性。這個累積虧損稱之為「破產點」(point of ruin)。


    破產風險不見得是賠掉全部帳戶餘額。它可能是損失帳戶的 50%、75% 或 100%，取決於你個人的風險忍受度。破產點是準備階段建立的財務邊界或風險資本。


    避免破產風險的第一步，是計算達到破產點的機率。如果機率太高，你必須設法降低。降低破產機率到可接受的水準，就等同往交易生存邁進一大步。基本上，任何單筆交易的資本占比越高，出局或遭受破產風險的機率就越高。


    舉個例子。假設有兩名交易人，分別是鮑伯和莎莉。他們參加相同的研討會，學到一個簡單的貨幣交易系統，稱作 System_One。System_One 的平均獲利等於它的平均虧損，準確率有
    56%。鮑伯和莎莉各自建立 10,000 美元的財務邊界，並且把破產點訂在風險資本虧損百分之百（10,000 美元）。鮑伯屬於冒險型交易者，決定每個訊號（換句話說，這是他的交易格局）拿
    2,000 美元去冒險。莎莉比較保守，決定每個訊號（或者交易格局）只冒險 1,000 美元。


    因此，鮑伯有 5 個資金單位可交易（$10,000 ÷ $2,000），莎莉有 10 個資金單位（$10,000 ÷ $1,000）。如果鮑伯開始交易，連續虧損5筆，他就會破產。莎莉則是連賠10筆才會破產。


    鮑伯和莎莉必須問自己：我的破產風險是多少？也就是什麼時候會賠掉10,000美元？


    要回答這個問題，可以用圖4.2的破產風險公式。


    這條公式假設交易人的平均獲利等於平均虧損。圖4.3說明如何計算交易人鮑伯的破產風險。


    圖4.4表示鮑伯和莎莉各自的破產風險。


    ## 圖4.2 破產風險公式


    ## 圖4.3 鮑伯的破產風險


    ![](img/4cb0a78760f87b9407822631d12abbf8_73_0.png)


    ## 圖4.4 破產風險隨資金單位的增加而下降


    如圖所示，雖然鮑伯和莎莉都交易相同的貨幣系統，破產機率卻大不相同。鮑伯有30%的機率失去風險資本，而莎莉只有9%的機率出局。莎莉的風險顯然低於鮑伯。


    雖然System_One的準確率是56%，卻不表示不會產生一長串的賠錢訊號。因此，如果兩名交易人一開始各有10,000美元，那麼只要連續5個賠錢訊號，就會毀掉鮑伯，而莎莉必須連賠10個訊號才會落到相同的下場。


    但是，莎莉的破產機率（9%），是否低到足以在交易上生存？答案為否。身為交易人，你需要在0%破產機率下交易。只要財務破產的統計機率高於零，都算太高。這就像一紙鍍金保證書，保證你最後會破產；但是，即使你在交易時的破產風險是0%，你必須了解，這並不保證你就能避免破產。這是因為零破產風險不能保證你的交易方法準確，而且平均獲利和平均損失將來不會與時俱變。如果它們保持不變，或甚至改善，你的0%破產風險會確保你避免毀掉自己的帳戶。但是0％破產風險不能保證你的交易方法將來不會惡化和繼續行得通。你需要了解，破產風險是個統計量數，有賴於它的投入因素。如果它們保持不變或者改善，那麼0％破產風險會防止你達到破產點。但是如果它們接下來受到傷害，你的破產風險也會破0％。你需要記住，破產風險只是統計量數，不是奇蹟創造者！


    ## 降低單一資金單位金額


    接下來的問題是：你可以如何降低一種方法的破產風險？前述例子提供了第一個線索——每一筆交易拿比較少的錢去冒險。這句話凸顯了資金管理的重要性，以及身為風險管理人的你，如果要在交易上生存和成功，就必須做對資金管理。如果想把你的破產風險拉到可接受的極限，依據邏輯，你需要在任何個別的交易上，拿交易帳戶比較低的金額去冒險。如果金額太高，你會被擊倒出場。


    這是我開始交易時，所犯的最大錯誤。我對破產風險的觀念，以及如何使用資金管理以降低和管理破產風險，毫無概念。我唯一的想法是「我能從交易期貨賺到多少錢？」請不要重蹈我的覆轍！


    我們再加進另一位交易人湯姆。比較他和鮑伯、莎莉的破產風險。交易人湯姆也是用System_One交易貨幣，而且同樣有10,000美元的財務邊界和破產定義。他的經驗比另外兩個人稍多一點，知悉破產風險這個概念，也知道如何降低它。湯姆知道，每筆交易拿比較少的錢去冒險，可以降低破產機率。湯姆希望以較低的破產風險交易，所以決定每個訊號只拿500美元（或者交易格局）去冒險。因此，交易人湯姆有20個資金單位可交易（$10,000
    ÷ $500）。也就是說，最低限度而言，如果他一直沒有收到獲利訊號，他會擁有足夠的錢下20筆交易，才會破產。我們可以使用相同的公式算出湯姆的破產機率。圖4.5顯示各個交易人的破產風險。


    ![](img/4cb0a78760f87b9407822631d12abbf8_75_0.png)


    ## 圖4.5 破產風險比較


    如圖所示，湯姆將風險降到每個訊號500美元，因而有20個交易機會，而鮑伯只有5個，交易人莎莉則是10個，如此一來，他的破產風險降低到1%！1%的破產風險遠比交易人莎莉的9%更能接受。當然，如果鮑伯贏了，湯姆賺的錢不會像鮑伯那麼多；但另一方面，鮑伯有可能出場，無法享受許多次2,000美元的獲利，而這個機率則高得多（30%）。


    切記：交易成功不過是力求生存和做好風險管理。降低破產風險的第一課，就是降低每筆交易的冒險金額；換句話說，就是學習應用合理的資金管理原則。你最起碼應該將風險資本分成20份，至少擁有20個資金單位，將破產機率降低到1%（前提是你所使用的方法，準確率是
    56%，平均獲利相對於平均虧損是 1:1）。雖然這不是生存的保證，至少有助於降低破產機率，提高生存機會。


    ## 提升交易方法的準確率


    如何降低破產風險的第二課，是改善所用方法的準確率。假設 System_One 升級為 System_One_MkII。System_One_MkII 的改良在於準確率，從
    56% 的獲利筆數，提升為 63% 的獲利筆數。此外，平均獲利相對於平均虧損的報酬仍然相同。假設每個交易人的單筆冒險金額不變（分別為 2,000 美元、1,000
    美元和 500 美元），現在我們利用前述的公式，以準確率較高的系統，重新計算各人的破產風險，如圖 4.6 所示。


    以準確率較高的系統交易（平均獲利相對於平均虧損報酬仍然相同），不管每筆交易金額水準（資金單位數）如何，都能全面降低破產風險。鮑伯的破產風險從30% 降為7%，莎莉從9%降為0.5%，湯姆從1%降為0%。這沒什麼好驚訝的，因為依據定義，準確率較高的系統，失敗機率應該較低，因為它獲利的次數會多於虧損的次數（假設平均獲利相對於平均虧損報酬不變）。


    ![](img/4cb0a78760f87b9407822631d12abbf8_76_0.png)


    圖 4.6 高準確率策略的價值


    在繼續談下去之前，我要指出，數學上，破產風險不可能達到0%。但是絕對有可能低於0.5%，在四捨五入之後成為0%。


    ## 改善相對報酬比


    降低破產風險的第三種方式，是改善你所用方法的平均獲利相對於平均虧損報酬。遺憾的是，沒有一條簡單的公式，可以計算平均獲利大於平均虧損的破產風險。有文獻試著以模擬的方式，證明較高的報酬如何降低你的破產風險。在好友兼交易人傑夫·摩根（Geoff
    Morgan）的協助之下，我寫了一個類似的模式（破產風險模擬器），仿效瑙澤·鮑爾紹拉（Nauzer Balsara’s）所寫的《期貨交易人的資金管理策略》（Money
    Management Strategies for Futures Traders）邏輯，如附錄B所示。附錄A解釋了我的破產風險模擬器的邏輯，附錄B則完整揭露程式設計碼。


    我的模擬結果如表4.1所示。每一次模擬，我都假設所用方法的準確率是50%，交易人有20個資金單位。我定義破產為帳戶賠償50%。每個報酬比率，我會跑30次模擬，然後取平均值，產生一個破產風險值（附錄C彙總了30次模擬的結果）。除了1.1:1


    表4.1 各種獲利相對於虧損比率的破產風險模擬


    | 平均獲利相對於虧損比率 | | | | | | |

    |---|---|---|---|---|---|---|

    |  | 1.0 | 1.1 | 1.2 | 1.3 | 1.4 | 1.5 |

    | 破產風險 | 64% | 20% | 32% | 21% | 5% | 0% |


    的報酬比率，這個簡單的模擬顯示，較高報酬比率降低了破產風險。以這個例子來說，會讓你想要交易的唯一報酬是1.5:1，因為它模擬出來的破產風險是0%。其他都高於0，因此破產，只是時間早晚的問題。


    你現在知道，優秀的風險管理人在挑選交易方法時，是以0%破產風險為目標。


    總而言之，降低破產風險有三項關鍵工具：

    - 降低每筆交易的冒險資金金額

    - 提高準確（或者獲利）率

    - 提高平均獲利相對於平均虧損的報酬比率


    前述三項就是對抗破產風險的關鍵工具，它們可以彙總為兩個關鍵武器：

    - 資金管理

    - 期待值


    對抗破產風險的第一道防線，是良好的資金管理意識、知識和應用。第二道防線是期望值重於準確率的意識、知識和追求。我會在本章稍後進一步探討期望值，資金管理策略則在第8章深入討論。


    要知道，破產風險時時存在，身為優良的風險管理人，應該對破產風險避之唯恐不及。這麼做，就能生存；能生存，交易就會成功。


    但是在我繼續談下去之前，我要指出，決定破產風險的高低，受到許多限制。你需要了解，這個數字：

    - 只是個統計量數。它不是規避破產風險的保證，因為它取決於投入因素。如果投入因素受傷害，你也會受傷害；

    - 不是靜態的，會隨著每筆交易而變動；

    - 在實際交易上沒有實務價值。


    真正在交易時，並不會根據破產風險做部位規模或終止交易等任何決策。稍後你會學到，你需要使用淨值動量和系統停損等觀念，幫助你判斷何時停止使用某種特定的方法去交易。破產風險並非決策的根據。


    儘管有這些限制，破產風險的概念仍然是交易圭桌。它是通往生存的門道。我認為，破產風險是打開真實交易知識之門的鑰匙。因為就如同前面提過的，在我眼中，破產風險是交易最重要的概念。


    根據破產風險原則，除非破產風險是0%，否則不應該考慮交易。每個交易人都有統計上的破產風險，但大多都不知道。大部分人都是無知的。大部分人都賠了錢。不知 道自己破產風險的人，應該立刻計算，如果高於0%，就應該停止所有交易。市場的事和他們不相干，因為他們一定會破產；只是他們不知道自己什麼時候會破產。一旦交易人曉得破產風險的重要性，他們就會成為懂更多的交易人，而且如果他們不自欺欺人，他們會掉頭離開交易，直到他們能將自己的破產風險降到0%為止。務請記住，任何高於0%的破產風險都勢必讓交易人破產；這只是時間早晚的問題。


    正如我說過的，我相信破產風險是交易最重要的概念。它直指交易的真理，並且指出，如果你對交易可能受到的危害不夠敏感，就難以長久。


    如果每筆交易以較低金額冒險，就會降低破產風險，而且會有較高機率享受長期的交易生涯。如果能改善所用方法的準確率，就會降低破產風險。如果能改善報酬比率，就能降低破產風險並提升生存勝算。如何降低破產風險並不重要，做就對了。重要的是，除非破產風險是0%，否則交易市場不干你的事。非0%破產風險不交易！切記！切記！


    ## 擁抱交易的聖杯


    發現交易真正的聖杯，是啟蒙的一環。你可能聽過有人（我以前就是）追求完美的交易系統。所謂完美的交易系統，是指準確率非常高，賠損少之又少——也就是交易的聖杯。我敢說，知道交易系統的聖杯並不存在，一點不叫人驚訝。


    但是我心中確實有個交易的聖杯：一種能夠產生正期望值、可以跨多重機會進場交易的方法。如圖4.7所示。


    假使你避開破產風險而存活下來，那麼你的目標就是運用經過驗證的優勢與多重交易機會。只有這樣，你的交易帳戶才會增


