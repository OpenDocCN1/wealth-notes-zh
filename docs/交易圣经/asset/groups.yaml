    ## 固定資本


    圖8.5顯示，在利用固定資本資金管理策略之後，Forex_Trader的單一合約利潤從255,100美元，激增到超過1,800萬美元。


    固定資本是以固定的資本單位交易一口合約。如果固定資本單位是15,000美元，而帳戶餘額是20,000美元，可以交易一口合約。如果帳戶餘額是30,000美元，可以交易二口合約。


    採取固定資本資金管理策略的時候，計算交易合約口數的公式如下所示：


    ```

    合約口數 = 帳戶餘額 / 每口合約的固定資本單位

    ```


    你應該以無條件捨去法化整到最接近的整數，以計算要交易的合約口數。以上面的例子來說，如果你的帳戶有32,000美元，你會交易二口合約（$32,000 ／ $15,000
    = 2.1 或化整後為2.0）。如果你發生虧損，帳戶減為29,000美元，固定資本將只允許你交易一口合約（$29,000 ／ $15,000 = 1.9 或化整後為1.0）。在你的帳戶增加到超過30,000美元之前，你不能交易二口合約。


    表8.3顯示，採取固定資本資金管理策略時，交易合約口數如何化整為最接近的整數。


    如果帳戶金額跌到低於你的固定資本單位，固定資本策略不允許交易最低一口合約，因此必須停止交易。如果你想要繼續交易，你可以使用「低於最低固定資本單位」，做為補充帳戶金額的觸發器。


    要計算固定資本單位，你會用到下列公式：


    固定資本單位 = 最大賠償（實際或預期） / 風險臨界值百分率


    這個例子中，我隨意選了15,000美元做為固定資本的資本「單位」。


    根據單一合約的例子，Forex_Trader的最糟賠償是13,638美元。用這個數字運算，有助於你了解如何計算固定資本單位。你可以使用這個歷史性的賠償數字，或者使用比較大的數字。我相信你的最糟賠償總是在你眼前。務請記住，交易談的是生存。處於守勢位置，期待市場做出最糟的事情，有助於你正視市場最大逆境的可能作為，也能讓你不忘市場可能在最不恰當的時刻讓你大失所望。


    我將取Forex_Trader的最大歷史性賠償數字，並增為14,000美元。


    風險臨界值百分率（percentage blowtorch risk）需要稍作解釋。它是指你能夠忍受多少痛苦，或者你的帳戶餘額損失多少百分比，你仍然安之若素。


    利用前面的公式，如果你對虧損帳戶的30%安之若素，根據固定資本策略，則每口合約動用你的帳戶中的46,667美元（$14,000／0.30）。在帳戶餘額增加到93,334美元（$46,667×2）之前，你不會開始交易二口合約。


    比較保守的交易人可以降低他們的臨界值百分率，而比較激進的交易人可以增加。固定資本給了交易人許多彈性。


