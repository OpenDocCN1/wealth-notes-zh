    進行 TEST 程序時，必須謹記，在寄出模擬交易時，只交易一批。你的目標應該是驗證所用方法的期望值。如果期望值為正，而且不依賴單——筆出色的交易，你就會知道所用的方法經過驗證可行。


    如果你期望值不是正的，你就必須回到繪圖桌，重複 TEST 程序，直到期望值通過驗證。


