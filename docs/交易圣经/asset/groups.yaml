    交易人在趨勢、折返水準和折返型態的解讀上，需要獨立且百分之百客觀的建議。優良的趨勢和折返工具不需要靠交易人的投入才看起來行得通。優良的趨勢和折返水準獨立自主，以本身的價值接受評量，行得通或行不通，一翻兩瞪眼。優良的趨勢和折返工具具獨立性且有用，可以做為交易依據。


    # 獨立


