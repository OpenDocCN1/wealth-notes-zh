    ## 沒有萬用策略


    交易人各不相同，有不同的風險忍受水準，也對所用方法的帳戶淨值曲線能否維持穩定，抱持不同的信心水準。他們對於個別風險和市場波動性應該如何管理，有不同的看法。交易人的帳戶規模也不同。然而，儘管有這些差異，這裡提供的資訊，應該能夠協助你選擇你偏愛的資金管理策略。


    如果你 的帳戶規模小，你可能會傾向於採用固定比率或固定單位。固定比率的保守方法下，所有合約均需貢獻同等利潤。採用固定單位，累增合約的速度比較快，產生更多利潤，且能確保你至少擁有20個資金單位交易，藉以盡可能保護你免於破產。它的危險在於如果期望值轉為負數，而交易連續很長一段時間賠錢時。固定比率可能不會給你夠多的機會，藉交易以脫離困境。固定單位可能在你剛經歷連續15次虧損，而且減少到最後5個資金單位時，挑戰你的信心。


    如果你 的帳戶規模大，你可以考慮採用威廉斯固定風險、固定百分率或固定波動性。如果你限制每一筆交易的虧損為帳戶餘額的一個很小百分率，那麼固定百分率既具備較低的破產風險，也允許你以穩定的步調累增合約，並且賺取幾何利潤。此外，固定百分率在實施100口合約的限制時，能夠產生媲美於威廉斯固定風險和固定波動性的最高利潤，賠償相當溫和，只有19%，而且它確實產生最高的淨利相對於賠償比率。


    對各種策略更熟悉和更放心的最好方式，是在你的交易資料集上，測試每一種策略。你應該檢視每種策略對關鍵變數的敏感度。你也應該測試每種策略的災難性虧損。


    ## 蒙地卡羅模擬


    蒙地卡羅模擬是協助選擇過程的工具。這項技術有助於提高分析的穩健性。


    雖然你可能已經發展出一套穩健的方法，擁有穩定的帳戶淨值曲線，你對各種策略在交易歷史資料上看起來的樣貌也感到放心，你卻無法肯定將來的交易資料會以相同的順序重複出現。蒙地卡羅模擬允許你對各種資金管理策略作徹底的上路測試。它以隨機的方式，混合交易歷史資料，你愛模擬多少次，就模擬多少次，並且記錄賠償和價值報酬比率等關鍵特徵的每一個順序。它接著計算平均值和標準差，檢視成果的分布狀況。從這些成果，你可以對策和方法的配適度更有信心。但是務請了解，它確實有其限制。它仍然有賴於將來發生相同的個別交易成果，而如果帳戶淨值曲線保持穩定，那就不會有問題。但是，如果你所用系統的成果開始惡化，那麼做多少次模擬都無關緊要，你的真實成果還是會很差。


    關於蒙地卡羅模擬的進一步資訊，你可以透過我的網站 www.IndexTrader.com.au ，和我聯絡。


    ## 交易淨值動量


    你現在知道適當的資金管理有多重要，你也知道它的限制。雖然資金管理能將期望值普通的方法化為賺錢機器，卻無法將負期望值的方法化為正期望值的方法。它也不能告訴你所用的方法何時發生致命的出軌，或者正期望值何時轉為負數。雖然資金管理是對抗破產風險的第一武器，它卻未能提供早期警訊。這就是交易淨值動量上場的時候了。


    監視策略的淨值動量，可以給你早期的警訊，得知策略的淨值曲線是否開始變得不穩定。它會在策略完全行不通之前，提醒你注意。它會在策略的績效惡化到使你所有的風險資本消失一空之前，允許你退場觀望。


    換句話說，為何你應該等你所用的資金管理策略告訴你何時停止交易？難道不應該有個更聰明、更早期的警訊，能夠協助你退場觀望？把錢賠光似乎是一條極端的路，但如果你所用方法的期望值轉為負數，這正是資金管理的最後處境。


    你不必等到損失財務邊界的10,000美元風險資本，才知道你在賠掉5,000美元時就可能知道的事。有個早期警訊，例如在3,000美元時，就讓你知道你開始陷入麻煩，這是件好事。


    你不只應該以正期望值方法交易，更應該以正淨值動量方法交易，或者換句話說，以淨值曲線穩定的方法去交易。如果以單一合約基礎計算的淨值曲線開始下挫，就應該準備退居場外，並且停止交易，直到正淨值動量回來。


    關於這一點，我的意思是你的方法要設定停損點。交易要有停損點，交易方法也要有停損點，換句話說，就是系統停損點。


    ## 系統停損點


    就像你在交易時使用停損點那樣，你也應該為交易設定系統停損點。即便你可能相信自己已經發展出穩健的正期望值方法，而且使用TEST程序，正確驗證這一點，還是不能保證你所用的方法在將來某個時間，期望值不會轉為負數。使用系統停損點是必要的風險管理工具。


    即使我知道我所用的策略擁有優勢，卻不能保證它們將來會繼續擁有優勢。我當然希望它們是這樣，而如果它們做不到，我會睜目結舌，但我仍然必須尊重市場的最大逆境，並且準備迎接最糟的狀況。衡量帳戶淨值動量，有助於確定我所用策略的期望值是否開始滑落。我的每一種策略都使用系統停損點，防止我輸個精光。


    設定系統停損點有三個目標。第一，確認所用方法的停損金額，也就是你所用系統停損點的規模。你可以藉此得知應該準備投資或者說損失多少錢風險資本於你所用的方法。第二，確認所用方法的帳戶淨值動量何時搖搖欲墜，並通知何時停止交易。第三，確認所用方法的帳戶淨值動量何時恢復，並通知何時重新開始交易。


    秘訣就在於選擇一個有效的系統停損點。正如你在交易時，有多種不同的停損點可以使用，系統停損點可以使用的觀念也是應有盡有。良好的系統停損點一方面容允足夠的交易空間，一方面不致於空間大到傷害風險資本。


    正如我說過的，千萬不要忘了一個事實，那就是如果你交易成功，並不是因為你是優秀的交易人；相反的，那是因為你是生存者，你是優良的風險管理人，而優良的風險管理人會做好準備，迎接所用的方法在將來某個時點失去優勢的可能性。


    圖8.25顯示，新方法才剛開始交易，帳戶淨值曲線就下挫，由於帳戶淨值動量喪失，達到財務邊界的10,000美元風險資本限制，迫使交易人停止交易。在財務邊界風險資本喪失之前，停止交易，顯然是理想的做法，這是交易帳戶淨值動量派上用場的地方

