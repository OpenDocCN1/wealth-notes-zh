    ## 圖 8.22 合約口數增加的帳戶水準


    固定波動性顯然達成了資金管理目標，超越單一合約 255,100 美元的利潤。不只在交易餘額下降或市場的波動性擴增時，減少交易的合約，也能在帳戶餘額成長或市場波動性縮小時，藉由交易更多的合約，賺取幾何利潤。


    固定波動性能夠做到、前文介紹的策略做不到的一件事，是它能夠管理帳戶對市場波動性的曝險。當市場波動性高，固定波動性會提示交易較少合約，因為市場狂亂且危險。當市場平靜下來，固定波動性會提示交易更多，因為市場表現井然有序。


    固定波動性無能為力的是管理交易的個別風險。不管一筆交易的風險如何，如果市場的波動性在固定百分率帳戶限制之內，這套方法都要求你接受所有的訊號。固定波動性遇到的另一個批評，與威廉斯固定風險和固定百分率相仿，即小額帳戶交易人難以交易。


    圖 8.23 列示了固定波動性如何因應災難性虧損。


    務請記住，測試固定波動性和災難性虧損的限制。(使用一個固定的10日ATR為0.0060點，或者750美元)，並不切實際。市場的波動性不會維持不變，因為每天的資訊不斷影響市場的力量。只要銘記這個限制，固定波動性在處理災難性虧損方面表現得確實相當好。假設300,000美元的帳戶，在相同的七口合約水準，發生10,000美元的虧損，你預料會承受70,000美元的虧損，或者23%的賠損。如果發生這種事，你還是能夠繼續交易。根據不對稱槓桿，需要30%的獲利才能彌補虧損，而且可能以六口合約進行，因為只減少一個合約水準。


