    使用限價單的缺點是：FTSE的交易價格到了 6,600 之後，下一個價格可能是 6,605；你雖然看對市場，卻因為限制買價而無法建立部位。


    # 》觸價單（market if touched；MIT）


    交易的成交量薄弱時，委託單不一定能以特定價格成交。舉例來說，市場價格可能走到你的到價限價水準後立即回軟，因此你的顧問無法完成執行委託單。這時，就算你的分析做對，卻無法建立部位。為了避免這種狀況，就可以用觸價單。


    例如，如果你的分析顯示 FTSE 將在 6,480 遭遇強大的阻力，而且你希望在那個水準賣出 FTSE，也強烈偏向於放空，不在意成交價格，那麼你可以使用 MIT
    指令。委託單會像這樣：


    MIT 6,480 賣出一口 3 月 FTSE。


    一旦 FTSE 的交易價格到達 6,480，你的顧問會進入市場執行放空。


    # 》開盤市價單（market on open；MOO）


    指示顧問在市場開盤時，以市價交易委託單。例如，昨夜從美國傳來某些正面消息，你想要進入市場買進。你對於必須支付什麼價格不感興趣，只想在市場一開盤時就作多 FTSE，因為你預期一整天會有強勁漲勢。委託單會是：


    MOO 買進一口 3 月 FTSE。'
  - '[PAGE 314]


    # »收盤市價單（market on close；MOC）


    與MOO相反。MOC指示顧問在市場收盤時以市價交易委託單。例如你想在一天收盤時軋平部位，因為你對美國即將出爐的重要資料感到緊張。委託單為：


    MOC 賣出一口 3 月 FTSE。


    顧問會在FTSE於下午四點半收盤前最後一分鐘的交易，以市價為你賣出一口FTSE合約。


    # »限收盤到價單（stop close only；SCO）


    包含兩個部分，第一部分是觸發到價指令的條件水準，第二部分是到價條件只在收盤時啟動。例如，你已經在6,450作多FTSE，而你的分析顯示，你需要收盤盤勢強勁，才繼續作多，也就是收盤價格需要在6,461或更高。如果FTSE以6,460或更低的價格作收，你便不希望待在市場內。如此一來，委託單內容是：


    SCO 以6,460 賣出一口 3 月 FTSE。


    如果FTSE看起來像是會以6,460或更低的價格收盤，你的顧問將必須在收盤時以市價軋平你的部位。例如，如果在FTSE交易的最後一分鐘，價格是6,455，由於低於6,460，你的顧問將為你以市價賣出一口FTSE合約。'
  - '[PAGE 315]


    # 》全部撮合否则作废单（fill or kill；FOK）


    必須立即撮合或取消的限價單。若你想要在FTSE開低時賣出，例如低於6,450，那麼委託單會是：


    如果3月FTSE開盤價是6,449或更低，


    那麼FOK開盤以市價賣出一口3月FTSE。


    如果FTSE的開盤價是6,449或更低，委託單會撮合；但如果FTSE以6,450或更高的價格開盤，委託單會取消或者「作廢」。


    # 》盡量撮合其餘作廢單（fill and kill；FAK）


    必須盡可能撮合整筆交易的委託單，但如有任何未撮合的部分，便予取消。以前述的例子來說，如果你想要在市場開盤時賣出五口FTSE合約，委託單內容則是：


    如果3月FTSE開盤價是6,449或更低，


    那麼FAK開盤時以市價賣出五口9月FTSE。


    如果FTSE以6,449或更低的價格開盤（如6,445），而且只有三口合約以開盤價交易，之後價格走軟，那麼委託單未能以6,445開盤價撮合的其餘部分就會取消。


    # 有條件委託單


    有條件委託單（conditional orders）需要某個事件發生，委託單才會觸發。下列是幾種常見的委託單種類。'
  - '[PAGE 316]


    # 》擴展單（expansion order）


    在市場開盤後，不管走勢向上或向下，走了一段距離之後，交易人進入市場之用。當交易人需要市場額外的資訊獲得確認（例如買進之前價格勁漲，或者賣出之前下跌），才使用這種委託單執行交易。例如說，你可能想要在FTSE開盤之後下跌10點，才想賣。但是，你不想在它開盤之後立即賣出，因為你認為價格可能上揚。你的委託單看起來會像這樣：


    到價以開盤-10賣出一口3月FTSE。


    你的顧問會觀察FTSE的走勢，如果在開盤之後下跌10點，就會為以市價賣出一口FTSE合約。


    # 》如果完成（if done）


    此指令是取決於前一個被觸發的指令。以従述例子來說，如果委託單撮合，你可能想要下個停損單保護自己，以妨自己判斷錯誤。例如，即使FTSE上漲略高於你的賣出水準，你可能樂意繼續放空，但如果FTSE上漲20點，就會對你不利。如果你偏愛在FTSE開盤後下跌10點時賣出，但用20點的停損單保護自己，委託單如下：


    到價以開盤-10賣出一口3月FTSE。


    如果完成


    到價以開盤+10買進一口3月FTSE。'
  - '[PAGE 317]


    「如果完成」的條件只在FTSE下跌10點時啟動；即顧問會執行第一個指令。之後，顧問會在FTSE彈升且交易價格高於當天開盤價10點時，以市價回補放空部位。


    # 》二擇一單（one cancels others；OCO）


    允許交易人同時下兩張委託單，但顧問在其中一張委託單的附帶條件先觸發時，會只執行那張委託單。


    例如，你對FTSE的分析顯示兩個相互衝突的情境：如果FTSE開低，它會立即下跌；如果FTSE開高並且勁揚10點，則可能顯著上漲；也就是說，一切取決於FTSE的開盤狀況。這時，不錯失任何一個交易機會的方法，就是下OCO委託單。如果在你的分析中，開盤走軟是指價格下跌到6,420，而開盤強勁是指價格漲到6,460，那麼你可以遞出如下所述的條件委託單：


    如果3月FTSE開盤價為6,420或更低，那麼以市價賣出一口3月FTSE。


    OCO


    如果3月FTSE開盤價是6,460或更高，那麼到價以開盤價+10買進一口3月FTSE。


    再舉個例子。假設你作多FTSE，給顧問兩個目標，一個是利潤目標（你相信市場會走到某個水準，你樂於在那裡獲利了結），另一個是停損。例如，你在6,450作多FTSE，如果FTSE能夠漲到6480，你樂於獲利了結，但是如果市場跌到6,440，你希望停損出場，那麼你的委託單看起來會像這樣：'
  - '[PAGE 318]


    6,480 賣出一口 3 月 FTSE。

    OCO

    到價 6,440 賣出一口 3 月 FTSE。


    顧問只會執行條件先被觸發的委託單。一旦如此，委託單的另一邊則取消。


    # 委託單的有效期


    委託單的有效時間長短也取決於你下的指令。


    # » 日效單


    除非你給了不同的指示，否則所有委託單都是當日有效。一天結束時，沒有撮合或執行的委託單就失效。但你最好是先與顧問或電子交易平臺確認規則。


    # » 取消前有效單（good till cancelled；GTC）


    在撮合或取消之前繼續運作和有效。如果你有一張停損單，不想每天都要下一次，就可以使用 GTC。如果你作多，而且有張在 6,400 軌平部位的停損單：到價 6,400
    賣出一口 3 月 FTSE—GTC。你的顧問會保有這張委託單，直到你在 6,400 賣出，或者你取消這張委託單。


    # » 指定日前有效單（good till date；GTD）


    是到指定日期之前都有效的委託單。例如，如果你想在市場中留下—張 6,450 的買單，而且樂於在一個月內以那個水準買進 FTSE：'
  - '[PAGE 319]


    6,450 買進一口 3 月 FTSE GTD 2008 年 3 月 14 日。


    # 完整的委託單


    下進場委託單時，不管是買進或賣出 FTSE，最好在「如果完成」(if done)的條件之後下停損單。絕對不要不下停損單就進場交易。例如，如果你想在 FTSE
    下挫到 6,400 時買進，而且你只想冒 20 點的風險，委託單如下：


    6,400 買進一口 3 月 FTSE MIT。


    如果完成


    到價 6,380 賣出一口 3 月 FTSE。


    一旦交易價格到達 6,400，你的顧問會設法以市價買進 FTSE。在你進場之後，如果價格下跌到 6,380，顧問會自動設法以市價為你賣出一口 3 月 FTSE。另外，如果你知道你的利潤水準，你可以把它包含在進場和停損指令之中。


    # 關於委託單的種類


    雖然我討論的委託單種類都很常見，但和新顧問往來時，應該確認清楚。委託單種類是交易人和顧問間的通用語言；但是向新顧問下單交易之初，難免有些混淆。


    使用限價單也應該小心謹慎，風險管理應該勝於交易獲利。交易人所冒的最大風險，不是因為用停損單或 MIT 委託單進入市場而丟失數點的風險，而是因為限制進場水準而錯失好交易的風險。市場出現滑價通常是個好兆頭，因為這表示，對你而言，供給或需求並不存在，也意味著你站在正確的一邊。同樣的，你不'
  - '[PAGE 320]


    希望只因為你想限制出場價格，而套牢在賠錢的部位。


    此外，我寧可不使用 GTC 委託單。我喜歡每天下單，即使我的獲利出場和停損水準沒有改變。這是我的風險管理策略的一部分，有助於確保委託單沒有變成漏網之魚。


    # 委託單確認


    不管你如何下單，務必確定你收到經紀公司的確認單，不管是經由線上電子平臺，還是顧問。確認單證實你的委託單將開始運作。


    請記住，這一切都是為了管理風險。我會期待顧問回電子郵件，確認我的委託單總數。我通常是在每天上午九點收到。之後我就能放鬆心情，其他所有工作都由顧問去執行！


    # 》交易通知


    委託單一旦執行，顧問會通知撮合結果（包括數量和價格資訊）。一天結束時，經紀公司會寄給你一張交易報表，彙總你的交易明細、經紀費用、保證金動向以及未軋平部位。一天結束時，你也應該和顧問確認部位。當你發現你以為已經不在的部位還在，沒有什麼事比這讓人心跳更快！


    # 月報表


    你應該把交易視為事業，月報表能強化你將交易視為事業的承諾。按月編製一張單頁報告給交易夥伴看，有助於你嚴守紀律和保持一致。當你知道交易夥伴正盯著你，會比較難以偏離交易計畫。你的報告應該彙總財務標竿，包括但不限於：'
  - '[PAGE 321]


    +   - 財務邊界風險資本上限

    - 溫和的期望

    - 資金管理準則

    - 系統停損點

    - 每月交易成果

    - 累積成果

    - 帳戶餘額


    你會發現，執行交易是成為成功交易人的旅程中最短的一步。一旦在前面五項通則打好基礎，你會發現交易相當簡單。管理經常不斷發生的痛苦才是挑戰。


    # 小結


    至此，我完成了六項成功交易通則的討論。我但願有人在二十七年前就寫出這本書，我個人的旅程會平順得多！但願你現在更加透徹了解，真正區別贏家和輸家的因素：認識和接受交易成功的六大通則。


    不管投入什麼市場，運用哪種時間架構、安全性或技術，頂尖交易人都不會偏離成功交易通則。成功交易通則有如一根金線，串連起頂尖交易人，使他們遠遠領先虧損的眾多交易人。你現在知道有這根金線，是否要將它編進你的交易計畫中，一切取決於你。但願你會這麼做。


    圖11.1總結了六大成功交易通則構成的交易程序。接受六大成功交易通則，就能如圖11.2所示，搭起一座橋，避開大部分交易人常犯的錯誤，跨越陷阱的低谷，擠身進入10%的贏家圈內。'
