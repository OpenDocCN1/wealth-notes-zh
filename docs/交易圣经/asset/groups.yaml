    ## 凱文．戴維


    凱文．戴維（Kevin Davey）是高智力、得過冠軍殊榮的交易人。凱文擁有其他大多數交易人所沒有的優勢——聰明絕頂。凱文不只以優異的成績取得航空工程學位（並在美國國家航空太空總署完成實習），也取得企管碩士學位。凱文穩坐智力金字塔的頂尖位置，令我們自覺平庸。


    凱文是成功的短線系統交易人，以智慧取得成功。由於表現出色，他2006年贏得羅賓斯世界盃期貨交易冠軍賽，報酬率達107%。而且凱文不只是過去的贏家，更持續不斷獲利，2005年（148%）和2007年（112%）都排名第二。


    凱文是我訪談的交易人中相當獨特的一位。就我所知，只有他操作全自動化的機械交易系統，他用個人電腦執行大部分的交易動作——執行進場、停損和出場。他是積極型交易人，卻沒有積極交易。他讓電腦代勞做大部分的交易。這就是我說他聰明的原因！


    凱文和大部分交易人一樣，交易生涯之初充滿失望。凱文1991年開始交易，而他初期的交易策略之一，是用移動平均線交叉系統去交易。初期發生虧損之後，他決定最好是和交易訊號反向操作，而且真的反其道而行。令他感到沮喪的是，得到的成果相同，承受更多的虧損。至少他的表現前後一致！在帳戶虧損60%之後，凱文決定結束交易，接下來幾年內盡他所能，飽讀和交易有關的一切知識。由於凱文的努力，他能夠發展出一組贏家機械策略，讓他在交易冠軍賽中表現十分傑出。儘管取得成功，凱文直到最近，也就是2008年，才辭去工作，把全部的時間投入交易。但是他接著發展全自動交易策略，不需要整天坐在螢幕


    之前。他選擇離開工作，把更多時間用在享受天倫之樂，並且撥出更多時間研究市場。


    今天，凱文側重於簡化他的機械模式。他相信，強調出場策略是模式優勢。他使用TradeStation軟體研究、發展和回測他的策略，也用於自動執行委託單。凱文主要專注於短線機會，交易時採用多重時間架構。他有些模式會交易1分鐘、10分鐘、30分鐘，以及1日的時間架構。有些比較長期，1到5日內出場，而他的價差交易可以長達數週或數個月之久。他主要交易的市場是指數期貨，但有時也交易金屬、農產品、軟性商品和貨幣市場。


    凱文在交易之餘閒，喜歡和家人共享天倫，同時關注他喜歡的足球隊賽事，也就是克利夫蘭布朗足球隊（Cleveland Browns）和密西根大學狼獾足球隊（University
    of Michigan Wolverines）。凱文和他的家人住在美國俄亥俄州。現在就來聽聽凱文的忠告。


    在將近二十年的交易中，我學到技術面分析、基本面分析、策略規劃、資金管理，以及交易心理面等方面的許多事情。可是即使在讀過不計其數的交易書籍（有些十分複雜，連我都不懂它們在說什麼）、參加許多研討會、花了不計其數的深夜將交易觀念寫成程式碼，我後來還是發現，在交易上，簡單最好。


    這句話是什麼意思？在我看來，成功的交易人用的是奧卡姆剃刀原則（譯注：Occam’s Razor，意為簡約法則），最簡單的方法幾乎一定是最好的選擇。所以我在發展策略時，傾向於避開艾哈特波浪或甘恩線等複雜的理論，反而偏愛參數很少的簡單系統。事實上，我現在交易時使用的一個策略，只用最近的兩個收盤價，去決定下一筆交易的訊號。非常簡單！


    那麼，比起複雜的策略，簡單的策略到底有何妙處，在歷史上可能有比較好的表現？發展一套策略時，「自由度」的數學概念會發揮作用。如果你試著以太多的規則配適資料，你可以得到完美的配適，但你會用完所有的自由度。這並不好，因為這種曲線配適將來不會表現得很好——它只在過去有很好的表現。簡單的策略容允非常少的自由度，因此將來有可能展現優越許多的潛力。我在交易室的布置上，也運用簡單的概念。我和許多當日沖銷交易人不一樣，我沒有一整牆的顯示器和一堆電腦。一台電腦，兩台顯示器，對我來說剛剛好。而且一天之中大部分時候，我甚至連現在的價格看也不看，因為我正忙於在歷史資料上測試新策略。我的所有系統都是半自動或全自動，在交易日，種種事情都力求簡單。我不得不承認，有些時候，看到有人根據量子力學最新的進展，寫出一萬行的電腦程式碼，發展出新的進場技術，我會有點忌妒。或者，當我看到交易人的辦公室看起來像NASA的控制室，顯示器上有數十張價格走勢圖和指標，難免眼紅。如此壯觀的場面，當然讓我讚嘆不已。但是，我接著總是會退一步問：「這些比較複雜的安排，成果有比較好嗎？」至少從我發現的答案來看，並沒有。簡單最好，因為簡單才行得通。所以要力求簡單。


    凱文．戴維


    你覺得如何？夠聰明的人才明白要力求簡單。答案不在於複雜之中，在於簡單。每個人都要聽。這段忠告來自可能是本書中最聰明的一位交易人。如果有任何人能夠發展複雜的交易策略，


    非凱文這位火箭科學家莫屬。凱文保持方法簡單，不是因為他沒辦法做別的事。不，那是因為他既聰明又成功，足以洞悉交易的一個小秘密——簡單的效果最好。但願你有把他的話聽進耳裡。我當然有。


    你可以透過凱文的網站和他聯絡：www.kjtradingsystems.com，以了解他對於交易和市場的更多想法。


    ## 湯姆·狄馬克


    湯姆·狄馬克（Tom DeMark）是機構的重量級人物。規模很大的交易人和投資基金若需要幫忙，都會找他。湯姆是他們的智囊、個人救生索。在我訪問過的所有市場大師中，湯姆的交易策略從以前到今天都是用於管理金額非常龐大的資金。1997年起，湯姆是SAC資本的史蒂文·柯恩（Steven
    Cohen）的特別顧問。億萬富翁柯恩是避險基金投資人，也於1992年創辦SAC資本公司。管理2,500萬美元的資產。本書撰稿時，他管理160億美元的資產，而且自創立以來，他的基金平均每年報酬率達40%。湯姆在和柯恩共事之前，是和已故的查理·戴·弗朗西斯卡（Charlie
    Di Francesca）共事——後者當時是芝加哥期貨交易所（Chicago Board of Trade）交易金額最大的交易人。湯姆不只是大咖，還是最最大的一咖。他和市場上一些最知名的機構或人物共事，包括保羅·都德·鍾斯、喬治·索羅斯（George
    Soros）、麥可·史坦哈特（Michael Steinhardt）、范·霍伊辛頓（Van Hoisington）、高盛（Goldman Sachs）、IBM、永備（Union
    Carbide）、摩根（JP Morgan）、花旗銀行（Citibank）、大西洋富田（Atlantic Richfield）、伊利諾州（State of
    Illinois）、


    蒂施家族（Tisch family）、MMM、里翁·庫伯曼（Leon Cooperman），以及其他許多成功的大型投資經理人與基金。


    湯姆這樣的機構重量級人物願意提供建議，我覺得非常幸運。這種建議通常需要支付機構級的顧問費用，但你只要用這本書的價格就能擁有！我要再次感謝拉里·威廉斯介紹我認識湯姆。拉里實際上為我做了三件事。他先介紹我認識湯姆。他接著鼓勵湯姆考慮接受我邀請他參與這本書。第三，當本書截稿日將屆，我仍在苦等湯姆的忠告，這時拉里幫忙催促他的夥伴。我在最後截稿日的七天內收到湯姆的忠告！所以再次謝謝拉里。


    順帶一提，所有的市場大師都是好人，不然他們就不會如此貢獻忠告。本章能夠寫成，幫助我最力的是戴若·顧比和拉里·威廉斯。他們兩位都是名人，也是大忙人，和我非親非故，只是聽到我的要求，就出手幫忙。我要再次衷心感謝戴若和拉里。現在我們回來談湯姆。


    湯姆是我心目中交易世界的巨人。他原創而出色的想法，使他成為市場上最炙手可熱、薪酬最高的市場時機交易人。從前文提到的那些名單，就可以知道，他不只是炙手可熱的顧問，本身也是個成功的交易人。


    身為交易高手的頂尖顧問，他大可自成一派。而他的存在和成功，正好打了相對投資派的老古板一巴掌。他們不斷在印刷媒體和電視上說「……重要的是市場的時機，不是去抓市場的時機……」而湯姆是市場時機先生！湯姆花了四十三年的時間，研究、發展、測試、交易和教導機構交易員和投資人他的市場時機交易技術。湯姆花了四十多年的時間，證明重要的不是市場時機，而是抓市場時機！


    湯姆1967年開始交易，起初是自由裁量型交易人，使用


    傳統的走勢圖型態。那時沒有個人電腦，沒有網際網路，沒有即時資料饋送，也沒有彭博終端機。湯姆是利用維多利亞快送（Victoria Feed）商品走勢圖、艾柏·柯恩（Abe
    Cohen）和摩根·羅傑斯（Morgan Rogers）點數圖，以及懷科夫（Wyckoff）走勢圖，執行交易。


    湯姆取得企業管理碩士學位，並念過法學院之後，進入威斯康辛州密爾瓦基（Milwaukee）的投資公司NNIS服務。湯姆必須負責決定啟動和出清投資的正確時機。他很快就發現，在市場到達底部之後，幾乎不可能累積任何有意義的部位，而在市場到達頭部之後，一樣難以軋平大量的投資持有部位。湯姆出於需要，必須在市場預判會形成底部的情況下，逐步逢低買進，並在預判市場會形成頭部時，逐步逢高賣出。由於管理龐大資金的實務需求，湯姆被迫和公認的市場實務反向而行。與其避開抓取頭部和底部，湯姆不得不去預判它們。


    1973年，湯姆遇見和他一樣勤學好問的另一位年輕交易人，他也挑戰傳統的交易概念。兩位年輕交易人一見如故，培養出堅強且持久的關係與友誼，並且持續到今天。這兩位年輕交易人當時不知道，但他們在技術面分析方面，有了開創性的發現。其中這方面的一項努力，是以艾略特波浪為中心。湯姆和他的伙伴輕易看出，市場存在艾略特定義的波浪結構。但是，他們不喜歡的是，艾略特波浪在它的彈性波浪計數和波浪中的波浪重新計數方面十分主觀。他們著手研究，是否有可能以機械型和客觀的方式，確認艾略特波浪的反轉點，有別於艾略特的主觀和可以調整的五和三波組合。在兩人的努力下，共同發展出湯姆著名的TD連續（TD
    Sequential）指標，直到今天，世界各地仍有數以千計的交易人用於所有市場和所有時間架構。即使在這兩人發現這

