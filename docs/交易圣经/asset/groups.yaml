    ## 第9章


    ## 第二支柱：交易方法


    交易方法即日常戰鬥指令，詳細說明如何透過交易，獲取期望值。交易方法包含兩個部分：一是交易格局（setups）；二是交易計畫。交易格局指找出將來可能有支撐或阻力的區域。它們指出你應該採取的交易取向——你應該尋求買進或賣出。交易計畫應該告訴你如何利用格局。對於如何進場、下停損點和出場，它應該要有明確的指示。


    交易方法應該簡單、合乎邏輯。正如我說過的，它應該能夠通過麥當勞測試。也就是，一個十來歲的小孩能用你的方法去交易嗎？如果不能，那就表示它可能太過複雜、太過深奧，十之八九會垮。


    一旦設計好方法，下一步就是使用TEST程序驗證期望值。如果結果為正值，淨值曲線相當平穩，利潤不需要依靠一兩筆出色的交易，這就是一套良好的方法。


    最後一步是計算破產風險。資金管理策略和交易方法將在此結合。從TEST結果可以得知所用交易方法經過驗證的準確率，和平均獲利相對於平均虧損的報酬。這些再加上資金管理策略，就能使用我的破產風險模擬器（見附錄A和B）或者類似的方法模擬，估計統計上的破產風險。如果估計出來的破產風險是0%，你便能對所用方法抱持信心。如果不然，便需要回頭重新擬定。


    這一章要探討交易方法的架構。當你研究各種市場行為與交易方法的理論時，把交易程序界定清楚，有助於提供堅實的邊界做為依據。


    選擇交易方法的第一步，是決定追尋什麼類型的交易方式：自由裁量型或機械型交易。


    ### 自由裁量型或機械型交易


    交易人通常分為三類：


    - 自由裁量型交易人

    - 機械型（或系統型）交易人

    - 自由裁量機械型交易人


    自由裁量型交易人採行富有彈性的交易計畫。他們發展出以準則為基礎的策略，具備寬廣的自由度，以決定要採取的行動。他們通常有一條準則是，如果不知道何去何從，或者對自己的格局沒有信心，不交易也可以。他們交易什麼和如何交易是有彈性的；他們也保留是否交易的最後決定權。


    機械型交易人則遵循嚴格的交易計畫。他們發展出以準則為基礎、絕不妥協的策略，也絕不偏離。他們不能任意決定要如何交易。他們會在每一個格局出現時，自動而有系統地交易。他們不去思考為何要交易，只想到執行交易。機械型交易人不能任意決定要執行哪些交易，系統產生的每個訊號，他們都必須交易。我自己就是機械型交易人。
    顧名思義，自由裁量機械型交易人是自由裁量型和機械型交易人的混合型。他們發展出非常結構化的交易計畫，並據此交易。但他們會自行裁量什麼時候要遵循交易計畫。當他們決定交易，則會一絲不苟地遵循交易計畫。
    分處兩端的自由裁量型和機械型交易，在情緒的層級上大不相同。機械型交易人在交易的時候，不必做任何決定。他們只要更新走勢圖、遵循他們的準則，並在見到訊號的時候執行交易就行。自由裁量型交易人總是必須做決定。自由裁量型交易人越是結構化，必須做的決定越少。自由裁量型比起機械型交易人，在情緒上總是比較吃力。
    大部分交易人一開始時是自由裁量型交易人，而隨著時間過去，經由經驗和失望，他們在自由裁量型交易上，變得更為結構化和簡化。機械型方法有助於交易人在比較平衡的情緒層級上，取得一致和紀律。
    如果你是交易新人，我勸你考慮一開始就用機械型交易方法，或者採用非常結構化而嚴格的自由裁量型交易計畫。你不必在整個交易生涯都當機械型交易人；但是，它會提供一個堅實的基礎，讓你決定最後要走哪一條路。
    成功執行交易計畫的關鍵要素是一致和紀律，而機械型方法在這個領域提供絕佳的訓練。此外，由於有各式各樣的套裝軟體可用，機械型方法通常比較容易設計和執行初期的測試。我們來看看一個完整交易方法的架構。


    ### 建立交易方法


    交易方法指的是交易機制。追根究底，交易很簡單，就只是確認潛在的支撐和阻力水準，允許交易人：


    - 下精確的停損點，一旦觸發，表示潛在的支撐或阻力水準失敗的證據浮現

    - 當潛在的支撐或阻力水準守住，便享有獲利


    這些務必謹記在心。力求簡單——不要把交易複雜化。身為交易人，你只要設法確認潛在的支撐和阻力水準就行。你的目標應該是，在你相信潛在的支撐或阻力水準成立並有利可圖時執行交易。不要讓市場理論或分析學派主宰你的想法，以至於忘掉了這一點。


    ### 交易風格


    我說過，交易方法有兩種基本交易風格：


    - 順勢交易

    - 逆勢交易；或稱短線波段交易


    我曾經建議你起初將精力集中在發展良好的順勢交易方法上，因為順勢交易最為安全。但是，假以時日，累積成功的經驗之後，你也應該發展互補的逆勢或短線波段交易方法。當順勢交易方法開始發生虧損（由於市場不是時時都有趨勢所致），逆勢或短線波段交易方法會開始享有不錯的利潤。發展和交易順勢與逆勢交易方法，能享有更為平穩的帳戶淨值曲線。此外，隨著操作成功和經驗累增，也應該設法進一步分散策略，跨越多重時間架構，發展順勢與逆勢方法。你可以發展比較短期或比較長期的
    方法，和現有策略互補。目標是以跨越多重時間架構、不重複但彼此互補的多樣化交易方法組合去交易。你所用的每一種方法，核心都會是交易格局。


    ### 交易格局


    交易格局應該確認潛在的支撐或阻力水準。良好的支撐水準不只存在於上漲趨勢；它也應該證實上漲趨勢。良好的阻力水準不只存在於下跌趨勢；它也應該證實下跌趨勢。格局是透過市場分析而發現。箇中祕訣在於決定使用何種分析學派，以確認潛在的支撐和阻力水準。如圖9.1所示，要確認潛在的支撐和阻力水準時，有許多分析領域可以選擇。


    大部分交易人把大多數時間花在鑽研市場行為的各種理論，想藉此尋找完美的進場技術。雖然這可能傷害他們的錢包和心靈，卻可能是他們在交易生涯中最迷人和富創意的經驗。尋找難以捉摸的優勢，總是令人振奮不已。相較於交易時寫出和下重複性的市場委託單，設計交易方法遠遠更富創意和令人滿足。


    現在我不會花太多時間討論各種相互競爭的分析學派，因為我的重點是放在教你了解我的成功交易通則。在「方法」中檢討「格局」只是三大支柱的一部分，而三大支柱只是我的六個成功交易必要通則中的一個。但是我會簡單介紹這些交易分析學派在整體脈絡裡的位置。


    ![](img/4cb0a78760f87b9407822631d12abbf8_210_0.png)


    圖9.1  支撑與阻力的技術分析大觀園


    假以時日，你很快就會發現，要找到擁有優勢、能夠確認潛在支撐和阻力水準的分析方法並不容易。看看市場上供售的種種方法，我相信你應該開放心胸，擁抱你擁有的選擇。你應該學習將你可能對某些技術面分析學派持有的偏見放到一旁，並且張開雙手，歡迎和交易有關的所有觀念。但是正如我在前面鼓勵你的，你要保留決定權，判斷一種觀念在你手中是否有價值。務請時時記住：你看過或聽過的某個交易觀念，不見得就適用於你。你聽過或看過的某些交易技術，不見得就是正確的選項。我或其他作者可能寫到某個交易觀念，但不見得因為這樣它就是真理。只有透過你自己的獨立驗證，交易觀念才能對你有用。而這包括我在本書寫的每一件事。你要像海棉那樣盡你所能吸收所有的觀念，但在此同時，請記住保持懷疑之心，並且準備自己做功課，


    獨立驗證那個觀念，看看那個觀念能否獨立為你的交易策略提供期望值。而且在此同時，務必不斷問自己：那個觀念是否將有助於你確認潛在的支撐和阻力水準。


    必須謹記在心的另一點，是你會聽到交易上什麼行得通的許多聲音。這些聲音從書籍和數位多功能影音光碟（DVDs），到演說和研討會都有。所有這些聲音會熱衷於談論他們特殊的分析學派。在你保持心胸開放，盡你所能傾聽許多聲音的同時，要不斷提醒你自己，在交易上什麼行得通，不可能每一種聲音都對。有些人是對的，有些人是錯的。不可能所有的人都對。你要做的是確定哪種聲音對你而言最有道理，而且在你手中能給你最多的價值。請記住：在你能獨立驗證某種「聲音」將有所報酬之前，務必保持懷疑之心。


    在你搜尋喜愛的交易方法時，有一件事很重要，務必記住，那就是在你選定的分析未能確認潛在的支撐和阻力水準時、當你的TEST程序一直跑出負值時，絕對不要因此心灰意冷。至少你可以說，你已經找到一種分析學派，在你手中無法提供任何優勢，而在交易上，知道什麼對你不適用，幾乎和知道什麼對你適用一樣好！


    ### 打開交易的「潘朵拉盒子」


    你應該相信哪個市場行為理論？確認潛在支撐和阻力水準的市場行為理論，或者技術面分析，形形色色，我將它們分成三大類：預測者、夢想者和務實者。


    ### 》預測者


    「預測者」包括：


    - 占星術

    - 週期分析

    - 艾略特波浪理論

    - 碎形分析

    - 基本面分析

    - 幾何

    - 甘恩


    這些分析學派吸引了許多追隨者。它們的實踐者相信，它們能夠確定市場的走向。這些方法的一個中心主題是市場時機，知道何時在市場的重要轉折點進場和出場。其中兩個出名的理論是艾略特波浪和甘恩。


    預測者有兩大缺點。第一，為了尋找將來的轉折點，鼓勵交易人去抓頭部和底部。如同我提過的，這是所有的新進交易人常犯的一個錯誤。雖然你可能不會這麼做，但是展望將來和使用你的分析去確認機率很高的轉折點，卻會鼓動你去交易。一個轉折點累積的證據越多，你對自己的看法越有信心，因此你會更熱切地想要利用它們。你不知不覺就會在市場中掛單，等候你的分析證明正確。


    第二個缺點是，當交易人開始將注意焦點放在未來，就會忘了現在。當你忙著搜尋市場可能的走向，很可能完全忘了眼前的交易機會。在你找到將來一個重要的日期和價格水準時，你就會完全忽視其他所有事情。這種分心，會限制你的交易機會。


    那麼多交易人被吸引到預測者身邊的原因，是因為他們持有一個相當吸引人的概念，那就是你能夠知道市場的未來走向，因此控制你自身的交易命運。他們讓人感覺未來是確定的。預測者端出一個知識幻覺，進而創造控制的假象。這些假象造成過度的樂觀和信心。


    此外，交易人可能掉進我所說的知識陷阱。他們被知識的吸引力和解開市場謎團的挑戰吸引，因為他們相信複雜是最好的。預測者喜歡複雜。


    艾略特波浪和甘恩之中，後者可能最令新進交易人感興趣，因為他們急於尋找新奇的方法。雖然我研究過甘恩，透過我對幾何的研究，熟悉它的許多要素。圍繞甘恩的「神秘氛圍」，吸引許多新手投向它的懷抱。因此，許多幾乎沒有交易經驗但長於行銷、銷售和演說技巧的交易促銷者，受到吸引而促銷甘恩的交易技術。


    圍繞著甘恩的狂熱通常可見於如下的文字：


    ### 了解甘恩和市場時機


    甘恩是有史以來最偉大的交易人之一。他能夠抓準市場的轉折點，直到如今仍是個傳奇。他在商品和股票市場的獲利交易突破驚人的90%！二十世紀上半，他的交易利潤估計高達令人驚異不已的5,000萬美元。世界各地研究他所用技巧的交易人大獲成功。


    （資料來源：www.wdgann.com）


    誰不想向有史以來最偉大的交易人學習？任何人只要準確率超過90%和賺進5,000萬美元，一定有什麼價值可取！


    遺憾的是，甘恩似乎是神化的行銷素材多於現實。備受尊崇的市場參與者亞歷山大·艾爾德（Alexander Elder）在他所寫的《操作生涯不是夢》（Trading
    for a Living）一書中檢視了甘恩傳奇。艾爾德表示：


    各式各樣的投機份子銷售「甘恩課程」和「甘恩軟體」。他們宣稱甘恩是有史以來最優秀的交易人，留下5,000萬美元的遺產等等。我訪問了甘恩的兒子，他是波士頓一家銀行的分析師。他說，他那有名的父親靠交易根本養不活家人。他是靠寫作和銷售教材維生。甘恩在1950年代去世時，他的遺產，包括房子，價值只略高於10萬美元。甘恩這位交易巨擘的傳奇，是那些銷售課程和其他產品的人編造且延續下來的，目的是說給那些容易受騙上當的顧客聽。


    拉里·威廉斯在他寫的《選對時機買對股》(The Right Stock at the Right Time)一書進一步寫到：


    我研究了甘恩、艾略特、以及其他幾位知名星象家等的探究，結果發現根本是浪費時間。我很幸運，最後見到了甘恩的兒子。他是紐約市的一位營業員。他向我解釋：他父親只是會畫走勢圖。他反問，如果他父親真的像每個人所說的那麼好，為什麼兒子還要「滿臉堆笑，撥電話打給客戶，要他們多多交易」？他似乎有點為父親的盛名所累，因為許多人來找他尋求聖杯。如果甘恩真有聖杯，那麼他顯然從來沒傳給兒子。


    在此同時，我也見了薩契爾(F.B. Thatcher)。他是甘恩的促銷者和推廣者。他在生前最後五年的通訊中向我保證，甘恩只是個很好的宣傳題材，不見得是優秀的股票交易人。


    我自己的「甘恩」經驗類似。自1983年我在美國銀行開始進入市場以來，遇過數以百計的交易人，其中許多是甘恩的學生。在所有我曾經認識和今天知道的甘恩交易人中，我要說，沒有一個人，我再說一次，沒有一個人因為根據甘恩的理論，積極交易而持續不斷賺到錢。事實就是如此。當然，許多甘恩的「分析師」能夠選擇性地應用甘恩的技術，事後驗證市場的轉折點。但是事後使用甘恩的許多技巧——不管是角度、程度、震動、折返、預估、週年紀念日或者九的平方點，這件事做起來並不困難。如果甘恩的一個工具行不通，他們通常能夠找到行得通的工具。不過，持平而論，並不是只有甘恩這個交易學派，遭到這種「曲線配適」的批判。大部分分析學派有很高的自由度，分析師因此通常能提出不同的技術，以證明他們所說的正確。

    我知道，單單一個人的觀察，並不具統計顯著性，而且不能就此蓋棺論定甘恩的好壞。但也請記住：這些只是我個人的經驗。如果你的體驗恰好相反，那麼太棒了，我只能鼓勵你和其他的甘恩學生分享你個人的甘恩經驗。我知道會有很多想要學習你如何成功解開甘恩的交易「秘密」。但是在你這麼做的時候，記住要端出你的即時積極交易成果。

    如果你想要學習甘恩並且參加甘恩的研討會，我只能勸你向促銷商要一份即時交易的報表。如果你能看到即時交易記錄，你也應該請對於在研討會結束後，向你解釋每一筆甘恩的交易。這是非常合理的要求，因為對方願意教你甘恩，而他自己也已經靠甘恩賺到錢（不是嗎？）

    看來，今日的甘恩支持者似乎只是在追隨他的腳步，不見得是成為優良的交易人，致力於揭露「贏的秘密」，而是承襲甘恩不錯的促銷工作，並且從銷售課程賺錢。圍繞著甘恩技巧的過度

    '
