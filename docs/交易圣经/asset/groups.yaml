    在我講了這些之後，如果你還有興趣讀下去，我覺得你還算有希望。很少人了解交易的「藝術」。重要不是看圖、基本面分析或技術面分析的能力。很簡單，重要的是有自知之明。我三十三年的交易經驗，告訴我幾項真理。最重要絕對真理就是你會賠錢，你必須因應這個事實。專業運動員接受他們會受傷的事實。他們的成敗取決於如何因應痛苦。

    我在投資世界虧損了數百萬美元之多，但幸運的是，也賺進更多。原因就是我接受虧損是現實的一部分，並且恢復交易生活以求治癒。

    我首次涉足交易時，遭遇持續不斷的連續虧損。起初我認為，這種事情不可能發生在我身上！後來我成了成熟的交易人，勇於面對現實：我不是受害者；是我害了自己。經驗不足的交易人沒有建構一套事業交易計畫。經驗豐富的交易人則一絲不苟地遵循他們的事業計畫。專業人士知道他們需要未雨綢繆，為世界末日做好準備以免遭殃。業餘交易人士從來不會想到世界末日，直到為時已晚。以下所說的真理，有必要一讀、記在腦海中，並吸收內化。

    以下就是我遵循不悖的「庫克氏真理」：


    真理一：我會賠錢。我接受這件事 每當交易賠錢，我會有個關機時間。我深信每個人都會有一個週期。當一個人處於低潮週期，那麼生活上所有的活動都容易受到傷害。我曉得自己可能賠錢的月份，因此設法防範；35%的賠損實在太多了！


    真理二：不聽別人的意見。根據事實交易 我每天都會有個儀式，那就是尋找交易的事實。工作過度使人成就過'
  - '[PAGE 339]


    度——這有什麼不好？一旦我權衡了所有的事實，別人的意見就沒有插手的空間。如果外頭正在下雨，那就不說艷陽普照。活在現實之中，而不是在虛假的美好歲月裡。


    # 真理三：尋找機會。去交易。不要待太久


    在我賠錢的時候，我嚴以待己，因為我知道自己沒有發現賺錢的機會。市場波動不居是個事實；因此，我必須找到、認清並參與潮流，但不能待過久。業餘人士待在交易中的時間太長！專業人士提早出場；猜猜誰賺的錢多？


    # 真理四：滿懷信心。交易是為了賺錢，不是為了避免虧損


    信心和真實是結拜兄弟。信心和虧損很快就會分道揚鑣。生活的遊戲有個保持和諧的平衡點。那個平衡必須有守有攻。我們都見過一個人放棄一切之後，身體很快也會跟進。他們不再對人生展開攻勢；他們的生活也是。防守是為了防患於未然，避免陷入逆境，同時曉得它會來到。真正的平衡，是權衡所有情境，為那些情境設想機率、承認這些機率，然後規劃一條要走的路。我們總是有辦法得分！我們有辦法阻止對手得分。兩者都要找出來！


    業餘人士找的是聖杯；專業人士則是根據真理交易！


    馬克．庫克


    看了之後有什麼感想？許多人無疑花了龐大的時間和精力，去尋找解開市場秘密的通用之鑰——也就是人力不可企及的聖杯。你應該尋找真相！你應該學會，交易成功是接受虧損，學習如何保有獲利，甚於賺取利潤。許多人寫的都是如何賺錢，極少專注於如何保有你已經賺到的錢。而箇中關鍵在於接受虧損。如'
  md: '

    有些交易指數股票型基金（ETFs），有些交易期貨，有些交易外匯，有些交易商品，有些交易CFDs；有些交易金融商品，有些混合交易各種產品；有些是當日沖銷交易人，有些是短線交易人，有些是中線交易人，有些是長線交易人，有些交易多個時間架構組合；有些贏得交易冠軍賽，有些不曾出現在公眾面前。此外，他們不只專業與方法各異，也散居世界各地。你會遇見來自新加坡、香港、義大利、英國（但目前住在阿拉斯加）、美國和澳大利亞的交易人。


    交易成功者的面貌有各式各樣。但他們都是成功的交易人。他們都是我心目中的市場大師，因為他們都活過全球金融危機。


    順帶一提，這種多樣化也能證明，市場交易成功方法不只一種。你只需要找到自己的立基，找到對你有意義的一種技術或幾種技術的組合，在你手中有用，能給你優勢，讓你用經過驗證的0%風險去交易。


    我個人曾和這些市場大師促膝長談，知道他們各個都能將自己的成功通則融會貫通，舉重若輕，並指出重點。他們不像我這麼幸運，可以用一整本書和你分享想法；但是，他們會和你分享他們覺得最重要的建議。每一位市場大師分享忠告之前，我會簡短介紹他們，以及他們在技術面分析世界中的定位。在他們的忠告之後，我會留一個聯絡網址供你參考。你如果想多聽一點，可以直接洽詢他們。你永遠不知道誰的智慧能助你徹悟。


    現在，十五位市場大師即將依英文姓氏字母順序出場。


    ## 雷蒙·巴羅斯


    雷蒙·巴羅斯（Ramon Barros）可能是我認識最勇敢的交易人。直到今天，我看到雷蒙在教聽眾標準差的情況，仍然驚嘆不已。雷蒙主張將交易成果的標準差，納入資金管理策略。在我看來，結合統計學和資金管理策略，簡直是艱鉅的挑戰，特別是聽眾經常是市場和交易的新手。我可以想像，大部分聽眾在學校學統計，不是特別美好的回憶！不管是勇敢，還是愚蠢，雷蒙肯定不是避開困難任務的人！


    雷蒙不只勇敢，也可能苦於愛交易書籍成癮的過度衝動。雷蒙走進賣交易書的書店，很難不買一本書。我們兩人曾經到印度參加交易展，我親眼目睹。雷蒙和我在孟買一家書店，接受CNBC的現場實況轉播訪問。訪問結束之後，雷蒙忍不住表示，他離開之前必須買一本書。他不但買了，而且一買就是兩本。雷蒙的熱情和收購交易書籍的過度衝動，使他成為可能是世界上閱讀最廣博的交易人之一，也許擁有今天世界上最龐大的交易圖書室之一；由於讀了很多書，以至於必須花錢租倉庫放書！


    雷蒙對於交易和交易書籍的熱愛，直到稍後的人生才開花結果。雷蒙是從父親得知市場的存在，但他父親儘管是活躍且成功的交易人，卻不允許兒子涉足交易。他霸道保守的父親壓制他對市場的興趣。他因此被迫往學術領域發展，卻仍然表現出色。和許多人一樣，雷蒙在父親去世後，才能真正追求他在交易上的真正熱情。


    因此，雷蒙在1975年開始交易，那時他已經是事業有成的執業律師。剛開始，雷蒙是自由裁量型當日沖銷交易人，憑直覺操作。成功和他擦身而過，雷蒙認為自己需要全時投入交易，才能成功。所以，儘管父親曾三申五令不准他涉足市場，1980年，雷蒙毅然決然離開法律事業，專心致力於後來成為他人生中真正熱愛的領域——交易。遺憾的是，當時成功並沒有來到，他一再失敗，蒙受巨大的虧損。


    雷蒙並沒有因此打退堂鼓，而是埋首分析自己和策略，在更了解自己和發現繪圖分析技術「市場概況」(Market Profile) 之後，成功降臨。發展市場概況的彼得·史泰德梅爾(Peter
    Steidlmayer)，後來成了雷蒙最早的導師之一。市場概況讓雷蒙更了解一天之中市場價格的流動狀況，給他在交易上的第一個真正優勢。在熟悉市場概況後沒多久，雷蒙就開始享有利益不錯的交易生涯。到1986年，雷蒙屢戰屢勝，並在市場概況之外，發展出自己的交易方法。


    不久後，他的名聲傳到銀行，銀行請他管理資金，並將交易員送去學習他的交易策略。雷蒙成了世界上首批外包貨幣交易人之一，也是受聘教導機構交易員的極少數外部交易人之一。他從成功教導機構交易員中，發現自己熱愛指導他人。我想這就是為什麼他喜歡逛書店，看到交易書總是迫不及待買兩三本帶回家。


    教學成功使得雷蒙成為炙手可熱和當紅的交易導師。直到最近，他還是只收五位學生上二十四個月的指導課程。雷蒙的指導很受歡迎，想當他學生的人，必須等上三年！我相信雷蒙是思慮縝密的人，尤其是在談到心理面對交易人績效的重要性時。他鼓吹採用神經語言程式設計，也深信交易人必須先完全認識和了解本身的心理特質，才可望在市場上取得成功。


    今天，雷蒙繼續按照他的BarroMetricTM方法，以自由裁量方式執行交易。他的方法綜合了巴羅斯擺盪(Barros Swings)、雷波(Ray Wave)和市場概況。雖然這個方法高度結構化，也以規則為基礎，但還是有規則可以打破規則。這讓雷蒙的直覺有發揮的餘地。雷蒙主要是使用應用軟體「市場分析師」(Market-Analyst)找到他的BarroMetric格局，以E-Signal和Channelyse支持週期分析。雷蒙喜歡依據18日擺盪，在一個月的時間架構，交易S&P500、主要貨幣對、黃金和30年期債券。他非常重視保存紀錄，並且記錄他使用Camtasia
    Studio執行每一筆交易背後的所有理由。利用Camtasia，雷蒙能在他的個人電腦上擷取走勢圖畫面，同時在口述每一筆交易背後理由時錄音。雷蒙接著會重播影片，觀看自己的交易。保存紀錄和播放影片，有助於雷蒙強化自己的良好交易習慣，並找出他在交易中不自覺的不一致。雷蒙用這種方式做自己的導師。聰明的傢伙！


    由於雷蒙經常上CNBC，也在他的《趨勢特質》(The Nature of Trends)一書分享他對趨勢確定的看法，所以在亞洲是知名的熟面孔。


    在交易和教學之外，雷蒙最熱愛的就是閱讀。除了交易書籍，他也閱讀任何主題的書籍，從奇幻到混沌理論都有。雷蒙熱愛閱讀，閱讀也是他放鬆心情的方式，但卻給他太太造成困擾，因為她必須不斷找更多空間放他所有的新書！雷蒙和妻子往返於香港、新加坡和澳大利亞。我們現在就來聽聽雷蒙的忠告。


    ## 隱藏的原理


    我們都知道，80%到90%的新手交易人都會失敗。


    為什麼會是這樣？不是因為缺乏教育。投資和交易的競技場上，研究會的生意蒸蒸日上。在了解如何更有效地學習方面，更是已有長足的進展。儘管如此，交易人和投資人的成功率，和我在1970年代初開始交易時沒有兩樣。


    部分原因出在交易本身的特質。這是一場機率遊戲，任何單一交易，新手交易人賺錢的機會和經驗豐富的專業人士一樣。新手交易人往往在一連串的連續獲利之後，誤將自己的好運當作技術超群——市場很快就會導正他們的誤解，這一來，交易新手就會失去所有賺到的錢，甚至賠掉更多。


    另一部分的原因，在於新手看待交易獲得成功的方式。他們抱持錯誤觀念，以為他們需要的只是「超級交易策略」，而展開徒勞無功的聖杯搜尋。他們認為，那種方法能靠小額資本，產生無止盡的財富，並有相對極少的虧損。


    身經百戰的專業人士都知道，交易方法其實只是成功方程式的一部分：


    ## 贏家心理 X 有效的風險管理 X 書面交易準則（擁有優勢）


    布倫特在本書中談到這些傳統的原理。


    但是我認為，有個原理經常遭人忽視，而且很少人談到。這個原理源於1934年的飛行安全領域。那一年冬天，美國陸軍航空兵（U.S. Army Air Corps）飛行技巧最好的飛行員似乎都死於墜機。事後來看，很清楚可以知道墜機的主要原因是訓練計畫。訓練計畫包括：


    - 準學員坐上飛機，由教練執行一連串的翻滾和旋轉動作。如果學員沒有嚇得臉色發白，就能進地面訓練學校；

    - 在地面訓練學校，教練在黑板上教導學員如何飛行，也讓他們親身體験；

    - 幾個星期後，學員逐步掌握控制器。


    訓練結果如何？有些學校的死亡率接近25%。


    今天航空業驚人的安全記錄，要歸功於發明林克模擬器（Link Simulator）的愛德華．林克（Edward Link）。這個模擬器允許駕駛員犯錯，在沒有實際風險下，從錯誤中學習。簡而言之，林克模擬器允許駕駛員深度練習。


    「深度練習」（Deep Practice）的概念，是丹尼爾．柯伊爾（Daniel Coyle）在《天才密碼》（The Talent Code）一書中提出的。在我深入探討這種練習之前，且暫停片刻，注意交易人所受的教育和1934年駕駛員接受的教育，兩者間的相似處。


    身為交易人，我們通常靠參加二到四天的研討會與閱讀，而學得技能。在那之後，我們的學習是反覆試驗摸索，拿的是我們寶貴的資本去冒險。1934年駕駛員的反覆試驗摸索學習也類似，唯一的差別，在於他們是用自己的生命冒險，而我們是拿自己的財務資本去冒險——有時是我們的財務生命。


    ![](img/4cb0a78760f87b9407822631d12abbf8_332_0.png)


    圖12.1 深度練習


    資料來源：Daniel Coyle, The Talent Code (Bantam Dell, Random Hose 2009)


    圖12.1解釋了深度練習的概念。我認為，這個概念將掀起交易教育的革命。我們會見到研討會和指導課程分成知識內容的傳授，之後是深度練習時間。


    「深度練習」的「去感覺」一項，表示柯伊爾相信學習需要動用知性和感性。在任何練習期間，首先把目標設定在舒適圈外不遠處。要知道這些目標是什麼，首先需要設定脈絡（組塊）：找出學習的核心宗旨，將它們化整為零，確定各個組成部分。


    目標一旦設定，就可以做模擬交易練習，在對結果有期望下採取行動。練習結束時，比較行動的成果和想要的結果，也就是注意兩者的差距。接著，我們檢討反省，決定要用什麼行動以拉近兩者的差距，並採取行動。我們重複這個循環，直到填平差距為止。


    這個「嘗試錯誤學習」急遽縮減學習時間。我認為，柯伊爾的模式如果執行得當，可以提升交易的成功結果。


    雷蒙·巴羅斯


    我不是說雷蒙博覽群書、深思好學嗎？你可以在此暫停一下，回頭重看雷蒙的想法。雷蒙相信，深度練習如果執行得當，將加快交易人邁向交易成功的腳步。你可以擁有所有最佳的交易知識。你可以擁有明智的資金管理策略。你可以擁有穩健的正期望值交易方法。你甚至能夠緊緊盯住老虎的眼睛。但是，如果不練習、練習、再更多的深度練習，當遇到猛烈的市場最大逆境時，你會覺得自己像個破爛洋娃娃，不堪一擊。你會迷失方向，被丟出既定的交易計畫之外。你會不知道自己應該買進或賣出。但是，持續不斷地妥善練習之後，你會有更萬全的準備，以面對經常出其不意的最大逆境伏擊。這時，你不會被推出交易計畫之外。你會繼續走在原來的路上，不屈不撓。但是，少了深度練習，你會成為另一個市場統計數字。你會發現遵循TEST程序，以驗證所用的方法，將有助於你的深度練習。因此，謝謝雷蒙為你的彈藥庫添加裝備，而且就我所知，不曾有任何交易書籍提到深度練習。你應該將巴羅斯加進你的耶誕賀卡寄送名單中！


    如果巴羅斯的忠告引起你的共鳴，如果你想要了解他對於交易和市場的更多想法，可以透過他的網站和他聯絡：www.tradingsuccess.com。


    ## 馬克·庫克


    馬克·庫克（Mark D. Cook）交易成癮。馬克熱愛市場到無法長時間離開市場。他知道自己上癮了，而且樂於向任何願意傾聽的人承認這件事。他的交易癮頭強烈到儘管事業有成，許多人求他寫書，他也不肯答應。馬克根本找不到時間從市場脫身，長到足以將想法寫下來。所以馬克有時間回應我的請求，我覺得十分幸運。我也希望你同樣珍惜。


    像馬克這麼成功的交易人並不多。馬克是E-Mini S&P500最大和最活躍的私人當日沖銷交易人之一。由於E-Mini S&P500是世界上最大的期貨合約之一，馬克因此成了世界上規模最大和最活躍的私人當日沖銷交易人之一！忙碌時，馬克一天可以執行多達四十筆交易。如果你也是傑克·史華格「金融怪傑」系列的眾多讀者之一，你應該已經對馬克非常熟悉。馬克是《股票市場怪傑》（Stock
    Market Wizards）中唯一提及的S&P期貨交易人。


    馬克的故事非常鼓舞人心。他靠著頑強的毅力和意志力，扭轉了早期一再的挫敗，其中一次浩劫差點令他破產，但他東山再起，成了世界上最成功的當日沖銷交易人之一。馬克是古諺「永不放棄」活生生的見證，也是母愛力量的證明。母親對馬克的信心激励著他，使他搖搖欲墜的財務狀況轉危為安，邁向最後的交易成功。


    如果你曾經對自己的交易感覺情緒低落，你應該重讀《股票市場怪傑》對馬克的訪談。這會使你正面看待自己的處境，對於成功的可能有所啟發。它也強調，要在市場上成功，保持良好的工作倫理十分重要。馬克可能正是市場上工作最勤奮的當日沖銷交易人之一。那段訪談甚至可能使你靈光乍現，看清自己如果不準備投入那麼多心力，則交易不適合你。請記住，如果你要做當日沖銷交易E-Mini
    S&P500，你很可能不是和馬克在同一邊，就是和他對向操作。馬克每天早上在市場開盤前，花好幾個小時做準備，如果你想和他站在同一邊操作，而不是對向操作，那麼你也需要投入等量的心力。要是你不打算為當日沖銷交易E-Mini
    S&P500那麼賣力，也許你最好考慮做別的事。你必須了解，成功的當日沖銷交易沒有捷徑可走。如果你認為有，我要提醒你重讀馬克的訪談內容。


    馬克出生於俄亥俄州東斯巴達（East Sparta）一戶農家。他在家裡的農舍中交易，而這座農舍自1870年代以來，就屬於他家。由於交易成功，馬克有能力收購鄰近和當地出售的地產，而擴張他家所持有的土地。馬克生性保守，深信應該將每年不錯的交易成果，轉化為真實的可耕農地。馬克相當幸運，結合了他熱愛的兩件事——交易和務農，並用其一以壯大另一個。


    然而，馬克不是一直都這麼幸運。1977年，馬克開始利用印出來的走势圖，以自由裁量的方式執行交易。早年的交易一再失敗。1982年，一次小小的成功，加上貪婪作崇，差一點使他一蹶不振，因為他建立的裸買權部位毀了，使得他的交易帳戶短缺35萬美元。為了彌補帳戶中的赤字，馬克被迫向父母和銀行借錢。正如馬克所說的：「借錢存入經紀帳戶，再看著它化為烏有，沒有什麼事情比這更叫人感到無力。」


    不過，經驗加上他母親對他回補虧損能力的信心，開啟了馬克生涯的分水嶺。這是個轉捩點。但是直到1986年，他才開始有可觀的獲利，而這時正逢他發展出獨家的庫克累積跳動檔（Cook
    Cumulative Tick）指標。這個指標會確認買超和賣超的情況。馬克注意到，每當累積跳動檔為很高的負值或和正值，市場往往傾向於拉回。他學到，極端的跳動檔讀數減弱時，會製造可望獲利的交易機會。


    他的庫克累積跳動檔指標給了他一直在尋求的優勢。自那時起，它一直是他交易成功的一大助因。馬克的交易繼續令人刮目相看，到了1987年，還清了為回補1982年的選擇權虧損而被迫借進的35萬美元。他的交易繼續保持成功，到了1992年，贏得美國投資冠軍，報酬率達563%。1993年再次奪魁，報酬率為322%。自1986年以來，馬克的交易持續獲利。


    今天，馬克仍然是自由裁量型當日沖銷交易人，並且繼續依照他的庫克累積跳動檔指標執行交易。馬克在多個時間架構監控他的指標，而且雖然主要是當日沖銷交易人，卻也在他的指標許可時，下短期的三日短線波段交易和比較長線的交易。馬克會持有比較長線的交易，直到他的庫克累積跳動檔指標成為中性。馬克也是狂熱的紀錄保持者，每天記錄所做的每一筆交易。馬克深信應該研究以前的交易並從中學習。


    馬克身為交易人，確實關注高準確率的策略，而且會交易對他的庫克累積跳動檔指標有敏感反應的任何市場。雖然他以他的 E-Mini S&P500 交易著稱，卻也在情況許可時，交易選擇權、股票，以及指數股票型證券投資信託基金（ETFs）。


    今天，除了操作自己的資金，馬克也管理超過一百萬美元的大型私人帳戶，並管理 CMG 絕對報酬策略基金（CMG Absolute Return Strategies
    Fund）的 10%。自 2000 年代初以來，馬克公開邀請任何交易人向他挑戰，進行交易競賽。這是百萬美元的贏家全拿挑戰。令馬克驚訝的是，不曾有一位交易人接下他的戰帖！此外，他也經營每日的諮詢顧問服務，並在時間允許時，在他的農場辦公室舉辦交易講習班，學員不只在那裡學習交易成功之道，也能享用他的合夥人吉爾（Jill）下廚做的家常菜美食！


    除了交易，馬克也樂於上台演說，教導別人如何交易。雖然他也熱愛收集古董牽引車，但這件事其實不足以讓他分心太久，忘了對市場的癡頭，以及不斷精益求精的熾烈渴望。即便他一個月有百萬美元的進帳，交易的渴望還是永遠得不到滿足！


    現在，但願你準備好，洗耳恭聽馬克的交易忠告。如前文所說，馬克不曾寫過一本交易書籍，而且由於對交易的投入，很少有空閒時間。請銘記，以下這段話出自世界上規模最大、最活躍、最成功的私人交易人和市場怪傑之一！


    我會開宗明義告訴他們，成功之路是由虧損鋪成的！關於交易，我說的話可能只能影響一位讀者。但是，那個人的生活將永遠改變。有不計其數的著述，討論如何在投資的各方面賺錢，卻幾乎沒有一個字談到如何保有賺到的錢。有一句老話說，「賺錢容易守成難」，每個老交易人聽了都心有戚戚焉。


    在我講了這些之後，如果你還有興趣讀下去，我覺得你還算有希望。很少人了解交易的「藝術」。重要不是看圖、基本面分析或技術面分析的能力。很簡單，重要的是有自知之明。我三十三年的交易經驗，告訴我幾項真理。最重要絕對真理就是你會賠錢，你必須因應這個事實。專業運動員接受他們會受傷的事實。他們的成敗取決於如何因應痛苦。

    我在投資世界虧損了數百萬美元之多，但幸運的是，也賺進更多。原因就是我接受虧損是現實的一部分，並且恢復交易生活以求治癒。

    我首次涉足交易時，遭遇持續不斷的連續虧損。起初我認為，這種事情不可能發生在我身上！後來我成了成熟的交易人，勇於面對現實：我不是受害者；是我害了自己。經驗不足的交易人沒有建構一套事業交易計畫。經驗豐富的交易人則一絲不苟地遵循他們的事業計畫。專業人士知道他們需要未雨綢繆，為世界末日做好準備以免遭殃。業餘交易人士從來不會想到世界末日，直到為時已晚。以下所說的真理，有必要一讀、記在腦海中，並吸收內化。

    以下就是我遵循不悖的「庫克氏真理」：


    真理一：我會賠錢。我接受這件事 每當交易賠錢，我會有個關機時間。我深信每個人都會有一個週期。當一個人處於低潮週期，那麼生活上所有的活動都容易受到傷害。我曉得自己可能賠錢的月份，因此設法防範；35%的賠損實在太多了！


    真理二：不聽別人的意見。根據事實交易 我每天都會有個儀式，那就是尋找交易的事實。工作過度使人成就過度——這有什麼不好？一旦我權衡了所有的事實，別人的意見就沒有插手的空間。如果外頭正在下雨，那就不說艷陽普照。活在現實之中，而不是在虛假的美好歲月裡。


    ### 真理三：尋找機會。去交易。不要待太久


    在我賠錢的時候，我嚴以待己，因為我知道自己沒有發現賺錢的機會。市場波動不居是個事實；因此，我必須找到、認清並參與潮流，但不能待過久。業餘人士待在交易中的時間太長！專業人士提早出場；猜猜誰賺的錢多？


    ### 真理四：滿懷信心。交易是為了賺錢，不是為了避免虧損


    信心和真實是結拜兄弟。信心和虧損很快就會分道揚鑣。生活的遊戲有個保持和諧的平衡點。那個平衡必須有守有攻。我們都見過一個人放棄一切之後，身體很快也會跟進。他們不再對人生展開攻勢；他們的生活也是。防守是為了防患於未然，避免陷入逆境，同時曉得它會來到。真正的平衡，是權衡所有情境，為那些情境設想機率、承認這些機率，然後規劃一條要走的路。我們總是有辦法得分！我們有辦法阻止對手得分。兩者都要找出來！


    業餘人士找的是聖杯；專業人士則是根據真理交易！


    馬克．庫克


    看了之後有什麼感想？許多人無疑花了龐大的時間和精力，去尋找解開市場秘密的通用之鑰——也就是人力不可企及的聖杯。你應該尋找真相！你應該學會，交易成功是接受虧損，學習如何保有獲利，甚於賺取利潤。許多人寫的都是如何賺錢，極少專注於如何保有你已經賺到的錢。而箇中關鍵在於接受虧損。如

