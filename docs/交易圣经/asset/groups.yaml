    ### 圖 8.8 合約口數增加的帳戶水準


    下一個合約水準。一旦目前交易的合約能夠貢獻這樣的利潤，你就能交易更多的合約，而在那個水準，以前的合約加上新合約，合在一起每一口合約必須再賺18,000美元，你才能增加更多合約。比較激進的交易人可以使用比較小的德爾他，而比較保守的交易人可以使用較大的德爾他。固定比率提供足夠的彈性，適合風險忍受度各不相同的所有交易人。


    圖8.8列示固定比率公式計算你可以增加合約規模的水準。


    本例一開始的帳戶餘額是20,000美元，並且使用18,000美元的德爾他，或者每口合約18,000美元的利潤是在你增為二口合約之前所必要。一旦你賺到18,000美元的利潤，而且帳戶餘額達到38,001美元，就可以交易二口合約。有了二口合約，固定比率要求你交易的每一口合約再賺18,000美元的利潤。一旦多賺了36,000美元的利潤，而且帳戶餘額達到74,001美元，你就可以交易三口合約，以下依此類推。


    這就是固定比率的關鍵：在現有合約各賺到額外的德爾他利潤之前，不能增加合約規模。


    當然了，如果蒙受虧損，帳戶餘額下降到低於以前的水準，則必須縮小合約規模，直到帳戶餘額回升。縮小合約規模時，可以只使用以前的帳戶水準，或者加快縮減速率。所以說，與其等候損失一整個德爾他的利潤，才縮小合約規模，你可以更早做這件事。你可以使用德爾他的一个百分率，以更快啟動合約規模的縮減。但是，這麼做的缺點是，由於不對稱規模，你要回復原來的水準，必須花更多時間和努力。和以前的虧損百分率比起來，你不只必須賺更高的獲利百分率，你也必須在比較少的合約上獲利，因此回升需要更長的時間。


    你總是要有所取捨。如果減少合約口數的速度快於增加口數

    的德爾他，風險會降低，保護了利潤，但付出的代價是在比較少數目的合約上擴大不對稱槓桿。要不然，如果減少合約口數的德爾他速率和增加時一樣，你會因為在較長時間內維持相同數目的合約，而保持幾何利潤潛力。維持幾何利潤潛力的壞處是，必須以較高的風險為代價，而且可能在賠償持續發生的情況下，導致利潤減低。


    固定比率是否符合資金管理目標——賠錢時交易較少合約，賺錢時則交易更多合約？答案為是。一旦交易的每一口合約賺到足夠的德爾他，就可以增加合約口數。如果蒙受損失，帳戶餘額下降到以前的水準之下，就必須減少合約口數。


    圖8.7顯示，固定比率法能在德爾他為18,000美元的情形下，產生高於150萬美元的淨利，而能夠實現幾何利潤成長。雖然金額不像固定資本那麼多，卻遠高於單一合約的255,100美元淨利。此外，固定比率產生淨利相對於賠償的報酬為10:1。也就是說，每1美元的賠償痛苦，對應著10美元的獲利。


    除了達成資金管理目標，固定比率也有其他吸引人的特色。固定比率和固定風險、固定資本一樣，也是適用於小額帳戶交易人的資金管理策略。有了適當的德爾他，就可以開始交易，而且隨著時間流逝，能穩定增加合約口數（或者部位規模）。德爾他也提供足夠的彈性，而這取決於保守或激進水準。比較小的德爾他能以更快的速度增加帳戶餘額，保持賠償於固定的百分率水準。


    圖8.9顯示德爾他減為11,000美元時的潛在獲利。


    你可以看到，使用一半的最大賠償和降低德爾他到11,000美元，淨利如何增加60%以上！此外，不只賠償百分率與較高的德爾他一致，淨利相對於賠償的報酬也一致，因為賠償而引起的每1美元痛苦，對應相同的10美元獲利。


