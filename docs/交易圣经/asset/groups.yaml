    從圖8.13可以看出，每一口額外的合約需要賺的利潤越少，因此能讓交易人快速累增合約。這有助於交易人賺取幾何利潤（假設這套策略維持穩定）。


    應用固定單位資金管理策略到Forex_Trader的成果，第一個要問的問題是：固定單位是否能達成資金管理目標，也就是賠錢時交易較少合約，賺錢時交易較多合約。


    答案是肯定的，也是否定的。


    答案是否定的，因為當你賠錢，固定單位仍會期望你拿固定金額風險去冒險，你沒有機會在報酬時交易較少的合約，或者拿較少的錢去冒險。在賠錢時，每一筆交易都拿帳戶餘額更高的百分率去冒險，實際上是在報酬時，增加破產風險。


    答案為肯定的，因為在你獲利時，帳戶餘額不斷增加，你的金額風險增加，允許你交易更多的合約。因此，達到最大合約數允許固定單位賺進超過2,200萬美元！這個數字顯著高於單一合約的255,100美元淨利。由此可見，固定單位確實允許交易人享有幾何利潤。


    正如我前面提到的，由於這套策略能夠迅速累增合約，我將它能夠交易的最大合約口數限於100。這是為了避免沖昏頭，交易高達1,100口合約〔（$22,000,000／30）／$667〕並不切實際。


    總而言之，固定單位的成果驚人。在最高金額和百分率報酬分別為1,363,750美元和32%下，它能達成超過2,200萬美元的淨利。固定單位法具有很高的淨利相對於報酬比率，每1美元的報酬痛苦，產生16美元的利潤，而且各筆交易之間的標準差為8.5%。


    雖然成果驚人，固定單位和固定資本一樣，在報酬期間顯得脆弱。圖8.14顯示固定單位如何因應災難性虧損。


    因此，雖然幾何利潤看起來十分驚人，卻是承受極高的風險得來的。


    ### 圖 8.14 固定比率資金管理策略如何因應災難性虧損


    ![](img/4cb0a78760f87b9407822631d12abbf8_165_0.png)


    如果交易七口合約，每口合約發生災難性的10,000美元虧損，那麼160,000美元的帳戶餘額，會有44%的賠損。這樣的賠損需要穩健的78%獲利，才彌補得回來。


    雖然需要很大的回升幅度，但是和固定資本的交易人只能在災難性虧損發生之後，以三口合約重新開始交易不同，固定單位交易人仍然保有以七口合約，繼續進行交易的火力。這對固定單位交易人而言是一大優勢，因為他們能在災難性虧損發生之後，保有賺取不錯利潤的能力。缺點是這麼做會大幅提高破產風險。


    如果你相信你所用的策略有穩定的帳戶淨值曲線，就可以考慮採用固定單位交易，因為它能產生可觀的利潤。但是，它的缺點是不能在賠損時降低冒險金額，因此提高到達破產點的風險。不過，如同我說過的，如果你相信你的策略穩健且平順，它是值得考慮的激進策略，因為在任何特定的連續30筆交易期間，非常不可能到達破產點（假設你的帳戶淨值曲線長期而言維持穩定）。此外，如果你希望保守一點，那麼你甚至可以用40個資金單位開始交易。另一個值得考慮的構想，是使用變動的「固定」單位數，也就是在某個帳戶水準，增加單位數。


    雖然固定單位未能在報酬期間，降低交易人的風險，它確實具備某些優點。它允許小額帳戶交易人展開交易。它允許交易人迅速累增合約。它有足夠的彈性，允許交易人在任何特定的連續交易和發生停損的期間，增加交易的固定單位數，以降低風險。雖然它不會產生巨額報酬，卻允許交易人維持合約水準，保有藉交易以迅速彌補虧損的能力。


    固定單位的另一個好處，是它能夠區別個別交易之間的風險。如果某筆交易的風險太高，它不會允許交易，因而降低曝險程度。雖然固定單位未能達成在報酬期間降低風險的資金管理目標，卻有助於管理個別風險，而且確實能夠賺取幾何利潤。


    ## 威廉斯固定風險


    圖8.15顯示應用威廉斯固定風險策略時，Forex_Trader的績效。在討論它的含義之前，先來探討威廉斯固定風險資金管理。


    你已經在我摘錄威廉斯所寫《短線交易的長線秘密》一書的部分內容中，了解這套策略。


    合約口數 = 金額風險 / 最大虧損


    金額風險 = 帳戶餘額 × 風險百分率

    '
  mdcn: '

    然而，固定比率和固定資本一樣，並沒有區別個別交易風險。交易人應該接受所有訊號，不管它們的個別風險如何。


    ## 選擇的兩難


    到目前為止，固定資本似乎是最佳的資金管理策略，它的 1,800萬美元假設利潤，高於固定比率的 150萬美元淨利。


    但是，固定資本的 1,800萬美元利潤，所冒的風險極高。在檢視固定資本和固定比率蒙受災難性虧損時的後果時，風險尤其明顯。


    這些例子中，我是從 20,000 美元的小額帳戶開始操作，並任意假設固定資本和固定比率的報酬都是 14,000 美元。我定義災難性損失為單一交易的虧損占歷史性報酬的
    70％ 以上——每口合約虧損 10,000 美元。這會使它顯得保守，但是就到目前為止的討論來說，卻相當務實。


    我假設每口合約的災難性虧損 10,000 美元，會發生在七口合約的相同水準上。這表示它會發生在資料集的不同時間，因為固定資本累增合約的速度，遠快於固定比率。但是就我們的例子解說而言，這並沒有關係，因為這裡的問題是和交易的合約口數有關。你需要很清楚這種虧損在相同的累增合約水準（或者部位規模）上對每一種策略造成的衝擊。此外，這也相對於它們各自的主要變數——固定資本單位和固定德爾他。不管你相信災難性虧損會發生的合約水準是多少，以下的例子仍然具有啟發性。


    如果 10,000 美元的災難性虧損突如其來發生在七口合約的水準，那會發生什麼事？圖 8.10 顯示使用固定資本資金管理的交易人會受到的影響，圖 8.11
    則顯示使用固定比率資金管理的交易人會受到的影響。


