    ## 服用安慰劑的交易人


    經過前面的討論，我想我已經被每個費波納奇交易人從耶誕賀卡名單上剔除。但我接下來要說，或許可以緩和敵意。


    雖然我做的研究證明，費波納奇比率沒有比其他百分率高明。但是，舊波納奇支持者眾，如果再加上艾略特波浪交易人，費波納奇粉絲可謂滿天下。艾略特波浪國際（Elliot
    Wave International）的羅伯·普萊契特（Robert Pretcher）可能擁有世界上最古老和最成功的新聞信之一（依發行量而言）。我何德何能，居然敢說他們採用費波納奇都沒賺到錢？想也知道，一定有人用費波納奇比率支撐交易格局，而且確實賺了錢。


    這讓我想到一個關鍵問題。如果費波納奇比率在統計上不具顯著性，交易人遵循它並獲利，是否像在是吃安慰劑？這些人交易的成功，是歸因錯誤嗎？這些比率在統計上不是堅不可摧，但在費波納奇交易人心裡，卻代表市場結構的真理。這個真理給了他們信心，敢於投入市場，而且賺了錢，他們於是相信，他們的成功來自費波納奇比率，奠基於義大利數學家李奧納多·費波納奇（Leonardo
    Fibonacci）的理論。所以費波納奇比率是實？是虛？還是信念？我認為它顯然是信念，因為它在統計上站不住腳。我稱他們為服用安慰劑的交易人。


    耐人尋味的是，他們不知道費波納奇或其他主觀工具在統計上不具顯著性，他們沒有意識到成功來自他們自身的技能。他們能夠賺錢，唯一真實的理由就是他們是極為優秀的交易人，交易金額小、迅速認賠，遲遲將利潤落袋。他們或許對費波納奇有所錯覺，但他們知道怎麼做才會交易成功。


    同理，我是否也能大膽地問，所有交易人是不是都是服用安慰劑的交易人？我越來越相信大部分人都不理性。大部分人在情況支持他們的時候，喜歡認為自己很理性。但當情況不妙，有些人就變得不理性，開始找方法支持他們的決策。這就像確認偏誤（confirmation
    bias）。當交易人作多錯了，不但不停損出場，反而一面移動停損點，一面在網路上找資料，佐證他們建立的部位沒錯。任何意見相左的資訊，他們會視而不見。他們只看到能確認他們所作所為是正確的資訊。


    成功的交易人，儘管交易格局大異其趣，獲利是他們的共同點。進入市場後面臨的是真槍實彈的交易。實際的交易才真正重要。我個人喜歡將交易信心，植基於可量化和可衡量的事實，而不是根據信念。我希望你也一樣。這做起來比較容易。許多交易人都不如自己想像的那麼理性，例如賽波納奇和類似方法的交易人。到頭來，交易是下列四項因素的函數：


    - 買進或賣出的偏見：交易格局

    - 明智的資金管理：確保採用適當的部位規模

    - 交易計畫：何處進場、下停損點和出場的準則

    - 意志力：根據交易計畫執行的能力。


    以上四項全掌握在交易人手中。


    接下來的這段話，我要甘犯自相矛盾的風險。雖然我主張使用客觀且獨立的工具，雖然我個人偏好以定義明確、客觀、獨立和可衡量的優勢進場交易，但如果你不這麼做，只要你是優秀的交易人，根據TEST程序，和你交易夥伴執行三十筆模擬交易，以驗證方法的期望值，和我不一樣也沒有什麼關係。


    這裡的重點是三十筆TEST交易。TEST程序是交易能力的最後仲裁者。不管是採用客觀或主觀方法，只要能通過TEST程序，其他可能都無關緊要。但是，如果你跳過三十筆TEST交易，交易心理會成為你必須克服的最大障礙，因為你必須和意識心靈比腕力，以協助你執行未獲證實可行的方法。這將是一場大戰。所有的交易教練都樂意靠它致富。


    ## 小結


    本章耗費相當長的篇幅談論成功交易通則的第二部分，因為我相信交易方法是實務上交易三大支柱中第二重要的元素。交易方法定義了你的優勢，是你投入市場的正當理由。除非你有具備真正優勢的真正方法，否則根本不該交易。


    本章解釋了常見的三種交易方法（自由裁量型、機械型以及自由裁量機械型）。大部分新手一開始都是自由裁量型交易人，最後慢慢走向結構化或機械型的方法。機械型交易大幅消除了自由裁量型交易的情緒混亂。所以有些專業交易人最後會成為自由裁量機械型交易人，即利用經驗和判斷，在極度結構化和機械化的交易格局中做選擇。他們相信自己能夠利用多年經驗，以自由裁量的方式，贏過機械型策略。


    你可以順勢方法和逆勢方法交易。完整的交易方法有兩部分：交易格局和交易計畫。格局應該只看潛在的支撐和阻力水準。技術面分析學派可以分為預測者、夢想者和務實者。交易計畫針對進場、停損點以及獲利交易的出場，訂定明確的準則。進場的重要在於它們直接影響期望值和部位規模。留意大停損點的致命吸引力，它們會毀了交易人。有效的交易計畫，應該在進場交易之前，就支持和證實某個格局，而方法需要
    TEST 程序驗證優劣。你要將資金管理策略和經過驗證的方法結合，計算破產風險估計值。注意交易目標：不能在財務上破產，務必生存下去，交易時的破產風險不能高於
    0%。


    順勢交易是明智且理想的交易方法。市場有趨勢，趨勢是所有利潤的基礎。順勢交易人的虧損交易比率高達 67%。交易人可以執行突破或折返順勢交易。折返順勢交易允許交易人以較低的風險建立部位，但付出的代價是有時會錯過大趨勢。突破順勢交易絕對不會錯過大趨勢，但代價是停損通常較大，賠償也較大。


    我討論了使用折返順勢交易做為交易方法的實務意涵。你現在知道折返順勢交易應該簡單，我也提醒你為何要交易。你學到折返順勢交易不應該比單純地按部就班程序困難。


    即使大部分交易人都知道順勢交易是最安全的交易方式，但還是有那麼多人失敗。常用的趨勢和折返工具，因為太過依賴交易人的主觀認定和解讀，太有彈性、不穩定及不可靠而成效不彰，不能做為交易的基礎。交易人的關鍵議題是使用既客觀且獨立的工具，趨勢和折返的解讀不受交易人影響。


    並非所有的指標都不好。有些成功的方法使用指標。最成功的方法只使用單一指標，帶有單一變數，在範圍廣泛的變數值內行得通。


    本章介紹了成功方法的基本屬性，海龜交易策略就是個好例子。方法應該力求簡單。時間架構較高的擺盪圖就是良好的客觀趨勢工具。我也分享了我的費波納奇研究，證明在採用主觀的折返工具之前，查證有多重要。


    本章也思索所有交易人是否都只是服用安慰劑的交易人，在交易格局中依賴信念，以投入市場執行交易。不管是理性的客觀或非理性的主觀，交易人對格局所持有的信念都很重要。信念驅使交易人投入市場，有機會執行良好的交易技能。我的信念偏向根據事實，而不是虛構之物。


    大多數人一開始都是自由裁量型交易人，絕大多數最後採用機械型方法。繼續交易的人終究會擅長於機械型交易，並成為市場常勝軍。真正優秀的交易人則繼續轉為自由裁量機械型交易人，借重多年經驗，選擇極結構化或機械性的格局。頂尖高手則學習如何擊敗極結構化的方法。這是一般進程，但事情沒有絕對，有些成功的交易人一直都是自由裁量型交易人。我建議剛起步的交易人，先專注於發展機械型方法。在我看來，這是最容易攀爬的交易之山。


    下一章討論交易心理，完成三大支柱的建構。


    ## 第10章


    ## 第三支柱：交易心理


    本章結束時，將完成探討實務交易的 three 個關鍵要素，也就是交易三大支柱：資金管理、交易方法、交易心理。我把交易心理放在資金管理和交易方法之後，並不是因為小看它。


    不過，交易心理雖然重要，卻不會勝過知道每個交易人都有個人帳戶破產的統計機率；不會勝過以知識、用心和努力，研究發展簡單、客觀而獨立的交易方法；不會勝過以TEST程序驗證方法的期望值所需的知識、用心和努力；不會勝過降低交易人的破產風險到0%。此外，在「登板」以真正的錢投入市場之前，心理面都無關緊要。當你開始交易，心理面會有正面的促能影響力（positive
    enabling influence）。


