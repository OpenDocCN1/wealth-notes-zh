    何策略，讓它能將災難性虧損處理得更好。


    但是，固定比率不是處理漫長的連續虧損交易的最好策略。它和固定百分率不同，無助於管理單一交易的個別風險，而是期望接收所有訊號。此外，它不允許在長期的一連串虧損交易期間，降低金額風險。在滑落到較低的合約水準時，只能縮減合約口數。除非你加快減少合約口數的速率，否則固定比率會以比較緩慢的速度，縮減和降低每筆交易的金額風險。


    雖然檢視每種策略如何在災難性虧損之後存活下來，是個有用的做法，但它並沒有真正反映交易人和資金管理策略經常身處的一般市場狀況。最有可能出現的情形是，你會經歷一長串的虧損交易，而不是發生災難性虧損。如果是這樣，威廉斯固定風險、固定百分率以及固定波動性會優於固定比率。因為它們是極小化破產風險的最佳策略，而這正是為什麼專業交易人偏愛選擇固定百分率的原因，因為它在這方面表現最好。


    # 最大合約限制


