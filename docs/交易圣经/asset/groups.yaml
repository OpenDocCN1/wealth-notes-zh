    人，我覺得談我真正每天在做的事，會比較容易。因此，如果你不熟悉期貨合約，而且對交易它們不感興趣，那麼請接受我的歉意。但願你能了解，對我來說，提到我每天在交易的東西，會比較容易。謝謝你的理解和耐性。現在，我們回到資金管理。


    妥善的資金管理要達成兩個目標：


    - 生存：避開破產風險

    - 厚利：產生幾何利潤


    如果你能在賠錢的時候少交易（減少部位規模），並在獲利的時候多交易（增加部位規模），妥善的資金管理會讓你達成這些目標。妥善的資金管理是生存和厚利背後的真正秘密，不是靠方法。雖然所用方法的正期望值能提供優勢，但良好的資金管理會將它放大。


    資金管理有兩個學派：


    - 馬丁格爾派（Martingale）

    - 反馬丁格爾派（anti-Martingale）


    ## 馬丁格爾資金管理


    馬丁格爾資金管理是在賠錢時交易更多合約，獲利時交易較少合約。它吻合賭徒在賠錢之後「加倍下注」的本能。馬丁格爾資金管理所根據的理論是：賠錢的交易之後，獲利交易出現的機率較高，因此應該利用這個機會，在賠錢之後交易更多合約。


    這套策略會招致災難。在賠錢之後增加交易的合約口數（也就是增加部位規模），會加快邁向破產的風險。賠錢後獲利的機率並沒有比較高。獲利或賠錢的機率總是 50%。此外，沒人能夠保證交易不會經歷一連串為時最長的虧損，致使在獲利之前到達破產點。


    馬丁格爾資金管理會加快你的破產機率。這套策略最好留給賭徒去玩。


    ## 反馬丁格爾資金管理


    反馬丁格爾派是正確的資金管理策略。反馬丁格爾資金管理能協助你生存，因為它主張賠錢時減少交易，獲利時增加交易。稍後我要討論的資金管理策略都是反馬丁格爾派。


    反馬丁格爾資金管理有兩個關鍵特徵：一是幾何利潤；二是

    不對稱槓桿。反馬丁格爾策略會在一連串的獲利交易期間，使得利潤呈現幾何成長，但在

    一連串賠錢的交易或賠損期間，會因為所謂的不對稱槓桿而受害。


    幾何利潤是指，賺取的利潤遠大於沒有運用資金管理下，從單一合約所能賺到的錢。不對稱槓桿是指，當蒙受損失，彌補損失的能力會下降。也就是說，如果虧損 10%，獲利需要
    10%以上，才能彌補虧損（見圖8.1）。如果帳戶餘額虧損50%，就需要賺100%，才能把虧損補回來。


    你可以利用圖8.1所列的計算公式，算出彌補某一虧損率所需要的獲利率。


    ```

    需要獲利率 = ( 1 / (1 - 虧損率) ) - 1

    ```


    圖 8.1 不對稱公式


    ```

    需要獲利率 = (1 / (1 - 虧損率)) - 1

    = (1 / (1 - 0.30)) - 1

    = (1 / 0.70) - 1

    = 1.4286 - 1

    = 0.4286

    = 0.43

    = 43%

    ```


    圖 8.2 虧損 30% 需要獲利 43% 才能打平


    圖 8.2 顯示虧損 30% 的情況。

    表 8.1 列舉回補若干百分率的虧損，所需的獲利百分率。

    問題並不在於反馬丁格爾策略會受害於不對稱槓桿，因為馬丁格爾策略也會。比較大的問題在於反馬丁格爾策略需要較長的時間，以回補較高百分率的獲利，因為它們必須以較少的合約或較小的部位規模做到這件事。因為反馬丁格爾策略是在賠錢後交易較少合約（部位規模較小）。這和如果仍然交易原來的合約口數（或部位規模）比起來，更為費力且耗時。


