    不當你是看星象、使用指標、確認圖形型態，還是遵循義大利數學家的理論而尋找交易訊號，只要你使用的方法擁有可能為正的獲利期望值，你有什麼感覺都無關緊要。獲利優先於感覺。交易涉及的是現實，不是細膩的感覺。下一章將討論如何選擇合適的交易市場。


    ## 第6章


    ## 第四通則：選擇交易市場


    這一章著眼於成功交易的第四項通則——如何選擇適合交易的市場。我將檢視如何評估市場是否適合交易，協助你做選擇。我也會解釋指數和貨幣市場為何是最好的市場之一。這是我喜歡交易的市場，理由稍後詳述。


    我認為，適合交易的市場應該具備表6.1列出的大部分特質。


    如果市場有這些特質，就值得考慮。任何市場需要通過檢驗的第一關，就是操作風險管理特質，這點你應該不意外。如同我說過的，生存是交易的第一目標，所以我要先探討操作風險管理的特徵。


    ## 表6.1 優異的交易特質


    | 良好的操作風險管理特質 | 良好的交易特質 |

    |---|---|

    | 價格及成交量透明 | 波動性夠大 |

    | 流動性高 | 容易研究 |

    | 二十四小時交易 | 簡單 |

    | 零交易對手風險 | 易於放空 |

    | 誠實而高效率的市場 | 專業化 |

    | 交易成本低 | 機會夠多 |

