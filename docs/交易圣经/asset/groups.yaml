    將固定風險基金管理策略應用到Forex_Trader的結果，第一個要問的問題是：固定風險是否達成資金管理的目標——也就是虧損時交易較少合約，獲利時交易較多合約。遺憾的是，固定風險在這兩方面都辦不到。當你賠錢，固定風險仍然期望你拿固定的500美元去冒險；也就是，你在賠損的時候，沒有機會交易較少的合約。在你賠錢時，每一筆交易都拿帳戶更高的百分率去冒險，你實際上是在賠損期間，提高自己的破產風險。在獲利時，你不被容允交易更多合約。可以交易的最大合約數只有二口。雪上加霜的是，由於交易必須限於500美元，有195個訊號必須置之不理。因此只賺到151,538美元。這個數字遠低於單一合約的淨利255,100美元。


