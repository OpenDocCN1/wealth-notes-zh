    | 系統一 | 移動平均數 | 1 | |

    |  | RSI | 3 | |

    |  | 合計 | 4 | 極高 |

    | 系統二 | MACD | 3 | |

    |  | 隨機 | 4 | |

    |  | 合計 | 7 | 極高 |

    | 系統三 | 移動平均數 | 1 | |

