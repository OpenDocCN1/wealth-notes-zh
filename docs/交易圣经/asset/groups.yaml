    \  —等候證實用的進場訊號\n  —進入市場\n  —下停損點\n  —管理交易\n  —可望獲利了結\n\n順勢交易就是這麼簡單，不多也不少。如果任何人有其他說法，他們只是在扯後腿。\n\
    \n告訴你順勢交易的容易之後，我要提醒你，你為何要交易。許多人誤以為交易的目標是靠抓對市場的走向賺錢。事實不然。這種說法其實距真相太遠。這是我要提醒你的。\n\
    \n# 回到交易的初衷\n\n現在是我該提醒你為何要交易的時候了。在我告訴過你為何順勢交易應該很容易之後，我不想讓你覺得你能很快就開始交易，開始期待憑空收進大把鈔票。\n\
    \n我要告訴你，順勢交易不見得表示你真的要順勢交易。雖然順著你相信是趨勢的方向去交易，應該是你的偏好，但基於實務上的理由，你的趨勢方向可能是錯的。市場的最大逆境，會盡其所能，掩飾它的真正方向，而你只能往你認為它正在走的方向去"
