    # 趨勢工具不良


    今天的交易人所用的最流行趨勢工具可能包括下列幾種：


    +   - 移動平均數指標（moving average indicator）

    - MACD〔移動平均數分合（Moving Average Convergence Divergence）〕指標

    - ADX〔平均動向指數（Average Directional Index）〕指標

    - 趨勢線（trend lines）


    我認為它們是不良的趨勢工具。但是，在解釋為什麼之前，我要承認幾件事。第一，我個人認為，簡單的移動平均數指標可能是最佳趨勢指標之一。它在確認趨勢方面，效果相當不錯。第二，我個人在我的中線順勢交易上使用移動平均數。我使用比較長期的200日簡單移動平均數，以確認我所說的主趨勢（dominant
    trend）。我用它來防止自己對於我相信的長期趨勢，執行中線的順勢交易。但是，雖然我確實使用移動平均數指標，卻沒有在自己的交易格局或交易計畫中採用它。我用它只是因為我寧可不要違反它而交易。所以我並不使用移動平均數於決定趨勢。我不使用移動平均數於確認折返水準。我不使用移動平均數於確認進場水準。我不使用移動平均數於確認停損水準。我不使用移動平均數於確認出場點。我不這麼用。而且，如果我將200日移動平均數從我的機械型模式中移除，它們實際上反而賺更多錢。然而，當我這麼做，每筆交易的平均利潤卻下降，所以當我對趨勢的看法和用200日移動平均數衡量的主趨勢一致，對我來說，交易確實划得來。'
  - '[PAGE 243]


    我也應該指出，我之所以使用200日，並不是因為它有何神奇之處。我總是用它，也不知道它是不是最適當的平均數，可是我不在意。我就是這樣用。


    所以說，雖然我認為移動平均數可能是交易人能用的最佳指標之一，而且儘管我個人確實使用200日簡單移動平均數，我仍然相信它是不良的趨勢工具，而且批評不是沒有道理。我現在要更仔細地探討移動平均數指標，並且和你分享為什麼我相信它是不良的工具。此外，我的批評也適用於我提過的其他趨勢指標。


    # »移動平均數指標


    所以我們來看看如圖9.12所示的簡單移動平均數指標。這是今天交易人能夠使用的最簡單、也可能是最有效的指標之一。移動平均數指標有一個變數。趨勢的解讀取決於這個變數的值。這個指標將價格平滑化，當價格高於移動平均數，我們認為趨勢向上。當價格跌到低於移動平均數，我們認為趨勢向下。也就是說，移動平均數可以和它前一天的數值比較，如果上升，趨勢就被解讀為上漲。如果低於前一天，那麼趨勢被解讀為下跌。就那麼簡單。


    唯一的問題是確定要使用的移動平均數長度，你應該使用10日、20日、40日或者100日？


