    則依數值大小彙總了各種比率。


    折返百分率的一大缺點就是數字太多！它們不可能都對。那麼，哪一個才是對的？可惜，我當年初入行時，看到那麼多斬釘截鐵的比率和理論，還不懂要先質疑。我在交易生涯的頭十五年是艾略特波浪的信徒。進入艾略特波浪等於進入費波納奇。但我似乎找不到正確的比率辨識支撑或阻力。由於我的背景包括艾略特波浪和費波納奇，所以我將集中討論它們的比率。


    如圖9.25所示，常用的費波納奇比率有38.2%、61.8%和78.6%。50%折返水準雖然不是費波納奇比率，也被視為相當重要。交易人要使用哪個比率，確定折返已經找到支撑或阻力？這是很難回答的問題。有選擇，工具就變主觀。


    然而，「選擇」是費波納奇交易人面對的兩個問題中較輕微的一個。儘管諸多文獻和軟體程式投入費波納奇，我的研究卻顯示，它在確認支撑或阻力水準方面，不比其他的百分點更占競爭優勢。


    基本上，我根據資料製作擺盪圖，並且計算圖上所有的擺盪百分率。如圖9.26所示，我記錄了所有的折返百分率，我也加進延伸百分率。如果費波納奇是確認支撐或阻力的可靠工具，那麼百分率樣本應該會充斥著38.2%、61.8%、78.6%，和161.8%，相對於非費波納奇比率，數量多得異常，呈現統計顯著性。


    為了確保擺盪組盡可能納入所有費波納奇，我也在多個市場製作多個時間架構的擺盪圖。每個市場都回溯到1990年的每日資料，如圖9.27所示；再根據每日資料製作擺盪日線圖，如圖9.28所示。每日資料可彙整成每週資料，再據以製作擺盪週線圖，如圖9.29所示。接下來，依此類推，製作擺盪月線圖、擺盪季線圖和擺盪年線圖，分別如圖9.30、圖9.31和圖9.32所示。我希望我的研究涵蓋完整的多重時間架構擺盪。


