    得考慮的激進策略，因為在任何特定的連續30筆交易期間，非常不可能到達破產點（假設你的帳戶淨值曲線長期而言維持穩定）。此外，如果你希望保守一點，那麼你甚至可以用40個資金單位開始交易。另一個值得考慮的構想，是使用變動的「固定」單位數，也就是在某個帳戶水準，增加單位數。


    雖然固定單位未能在賠償期間，降低交易人的風險，它確實具備某些優點。它允許小額帳戶交易人展開交易。它允許交易人迅速累增合約。它有足夠的彈性，允許交易人在任何特定的連續交易和發生停損的期間，增加交易的固定單位數，以降低風險。雖然它不會產生巨額賠償，卻允許交易人維持合約水準，保有藉交易以迅速彌補虧損的能力。


