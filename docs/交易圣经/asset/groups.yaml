    # 圖 8.15 使用威廉斯固定風險資金管理策略，Forex_Trader 的績效


    風險百分率代表發生最大虧損時會失去的交易帳戶金額。假設你有 30,000 美元的帳戶餘額，假設發生最大虧損時，你準備損失帳戶餘額的 10%。如果是這樣，那麼你每筆交易損失的容允度是
    3,000 美元（$30,000 × 10%）。這將成為你的每筆交易金額風險。如果你使用的策略所發生的最大虧損（或者預期最大虧損）是 2,563 美元，那麼你將只能交易一口合約。


    ```

    1.0 = $3,000（金額風險） / $2,563（最大虧損）

    ```


    和其他所有策略一樣，為保守起見，在計算交易的合約口數時，化整為整數。


    假設固定風險為 10%，最大虧損為 2,563 美元，你將交易的合約口數如表 8.7 所示。


    這裡的關鍵變數是固定百分率風險和最大虧損。


    在帳戶餘額增長的同時，威廉斯固定風險法需要重新計算每筆交易的金額風險。你可以用金額風險除以最大虧損，算出可交易的合約口數（切記要無條件捨去）。


