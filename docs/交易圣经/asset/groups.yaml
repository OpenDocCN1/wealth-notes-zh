    ### 資金管理


    組合 長線順勢交易法需要大規模的投資組合才會成功。由於市場只有15%的時間呈現趨勢，順勢交易人需要監控和交易20到30個市場，以確保他們每年能夠捕捉到一兩個趨勢最好的市場。


    賠償 長線順勢交易法有少數幾個高獲利交易和許多小虧損交易。如果你交易20到30個市場，而且經常賠錢，賠償會日積月累，而且經常累增。由於你花在賠錢上的時間多於賺錢，這個方法確實會有很長的時間賠償。


    財務承諾 如同我說過的，長線順勢交易的財務承諾很高。監控和交易20到30個市場，需要順勢交易人有能力以充分的資金同時支援那些部位。長線順勢交易系統不可能同時啟動所有市場的20到30個進場訊號；但是順勢交易人必須做好準備，以因應這種事情發生，因為他們禁不起對這些訊號做取捨。順勢交易人不知道哪個市場或訊號會使他們那一年的交易賺大錢，所以必須交易所有的市場和所有的機會，不管時點為何。


    ### 交易方法


    時間架構 順勢交易人必須準備持有部位超過一個月，而不致停損出場。他們需要學習真的讓獲利交易繼續跑下去，而這必須以支付一路上發生的損失為代價。


    準確率 長線順勢交易的準確率偏低，可能在25%到35%之間。這並不叫人驚訝，因為市場只有15%的時間呈現趨勢。


    平均獲利相對於平均虧損的報酬比率


    平均獲利相對於平均虧損的報酬比率很高。良好的長線順勢交易方法，應該交付的平均獲利至少是平均虧損交易的三倍。順勢交易人需要平均獲利交易高得足以彌補所有的小虧損還有餘，以產生風險資本的報酬率。成功的長線順勢交易人總是靠兩三筆巨大獲利撐一整年。


    期望值


    長線順勢交易的期望值不錯。一種順勢交易法如果平均30%的獲利交易有3:1的平均獲利對平均虧損報酬，就能產生20%的期望值（〔30% × 3.0〕−〔70%
    × 1.0〕）。


    機會


    每個單一市場的機會很差。順勢交易法很慢才會啟動進場格局，因此一年當中每個市場呈現的交易機會不夠多。順勢交易彌補每個市場缺乏機會的方式，是交易龐大的市場組合。同時交易20到30個市場的組合，可以帶來夠多的機會，讓交易人成功。


    但是對於想要交易單一市場的交易人來說，即使帳戶大到可以考慮使用長線順勢交易法，這麼做也不適合。這是因為長線順勢交易法和任何方法一樣，需要許多機會去實現它的期望值。交易單一市場不會給長線順勢交易法夠多的機會。要這麼做，唯一的方法是交易包含很多市場的市場組合。


    交易成本——經紀費用與滑價


    長線順勢交易的經紀費用與滑價等交易成本偏低。由於這是比較緩慢的交易方法，所以和短線波段交易比起來，交易筆數通常較少。交易筆數少，經紀費用就比較低。由於平均獲利相當高，經紀和滑價占利潤的百分率也就通常較低。


    ### 交易心理


    情緒障礙


    長線順勢交易在情緒上比較難以處理。經常虧損

    '
  mdcn: '

    筆模擬交易完成，你的交易夥伴才會用電子郵件寄回紙本給你，讓你使用本章稍早提供的公式，計算自己的期望值。


    如果你期望值是正的，你應該將淨值曲線覆蓋在標的市場上。你應該期待有一條平滑的淨值曲線。檢視淨值曲線，你會知道，你所用方法得到的成果是否取決於一兩筆（幸運的）交易。你顯然應該偏好成果分散得很平均，而且不依賴兩三筆關鍵交易，因為這麼一來，你就不知道你的成果只是「一時僥倖」，還是本來就是你該得的。


    三十筆用電子郵件寄送的模擬交易有其必要，因為這樣才可以確保你的模擬樣本規模，大到在統計上有效。使用電子郵件，是為了模擬真實的市場。這是為什麼擁有一位不和你住在一起的交易夥伴十分重要的原因。和真實的交易一樣，一旦你用電子郵件寄出你的模擬委託單，就再也不能回頭。你不能把電子郵件收回來（除非是在市場開盤之前，或者市場還沒有觸動你的委託單水準）。就和真實的交易一樣，你的模擬交易，命運在交易之神手中。


    你會發現，很難將交易心理完全裸露在交易夥伴面前。但是，「裸身交易」才會使你十分接近即時的交易。雖然這可能有點尷尬、感到羞辱，但總好過在真實市場中賠掉辛苦錢。


    進行 TEST 程序時，必須謹記，在寄出模擬交易時，只交易一批。你的目標應該是驗證所用方法的期望值。如果期望值為正，而且不依賴單一一筆出色的交易，你就會知道所用的方法經過驗證可行。


    如果你期望值不是正的，你就必須回到繪圖桌，重複 TEST 程序，直到期望值通過驗證。


    TEST 程序適用於自由裁量型交易人，也適用於機械型交易人。如果你是機械型交易人，你就不應該誤將平滑的歷史淨值曲線，當作系統得到驗證。它只是顯示已成功地將你所用的方法和歷史資料配適在一起。向後看有欺騙之嫌，向前看才是重要的。


    有些自由裁量型交易人可能認為，不可能將完整的委託單用電子郵件寄給交易夥伴。他們可能說，由於他們需要先看市場開盤的情形，所以不知道在市場開盤之前，他們要做什麼。他們可能辯稱，雖然他們擁有部位，他們還不確定何時或如何獲利了結。如果是這樣，這些交易人並沒有定義清楚的交易計畫。在你進場之前，你應該已經知道要看什麼。如果你知道要看什麼，就應該能夠在委託單中向交易夥伴說明得十分清楚。


    這也適用於希冀讓利潤繼續滾下去的自由裁量型交易人。你仍然可以寫下出場指令，給交易夥伴看，因為你應該擁有定義清楚的獲利部位出場準則，即使你希望讓利潤繼續滾下去的那些部位也是一樣。如果你使用追蹤停損點（trailing
    stop），你必須把這件事告訴交易夥伴，好讓他或她能夠隨著價格走勢而追蹤。


    即使是自由裁量型交易人，也應該有清楚分明的交易計畫，以啟動進場、下停損點和賺錢部位出場。這些準則不應該因不同的交易而變。即使你對每個格局運用不同的交易計畫，就相同的格局來說，交易計畫不應該改變。


    如果你能想出交易計畫，就能將交易計畫寫下來。如果你能寫下交易計畫，就能把交易計畫用電子郵件寄出去。如果你能用電子郵件寄出交易計畫，就能在市場開盤之前，用電子郵件寄出交易計畫。除了驗證你的期望值，你也需要相信自己所用的方法管用。


    即使你意外發展出一個期望值不錯的系統，你可能還是因為潛意識不相信它，而覺得它很難交易。這是為什麼你可能難以採用商業系統交易（假設它們相當穩健）。你的信念系統並沒有「轉到」系統的期望值。唯有你內心的信念系統無條件接納一種方法，才能用它於交易。這是你的「頭腦」在作用，也是為何心理面是必須跨越的障礙（但心理並非凌駕一切的征服者），好在交易中生存且壯大。


    對你所用方法發展強大信念系統的最好方式，是盡你所能，模擬即時的交易狀況，而TEST程序可以做到這點。如果你所用的方法可望得到正期望值，信念系統會知道，並且接納它，使你更容易在即時交易中遵循不悖。


    ## 電子交易模擬器


    許多電子經紀商允許客戶開立假帳號，以測試交易技能。這些假帳號可以做為交易模擬器，測試方法。在使用TEST程序之前，先用這類假帳號實地測驗方法，相當有用。我不會用它們代替TEST程序，因為我相信交易夥伴監視交易績效的好處無可取代。沒有其他做法比得上有個人盯著你，真正專注去交易，彷彿在真實的市場拿真實的金錢去冒險。因此，遵循TEST程序，驗證期望值，是不可妥協的一步。這是交易旅程的必要環節。但是，我可以理解以假帳號做為TEST的前導測試的好處。


    ## 小結


    啟蒙是第二項成功交易通則，而且我相信是最重要的。啟蒙畫出定義清楚的界線，讓你在裡面運作。如果你待在那裡面，你會有更高的生存機率，因而在交易上獲得成功。啟蒙的目標是協助你避開破產風險。避開破產風險，就會成為成功的交易人。


