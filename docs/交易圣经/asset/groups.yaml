    這絕對是我給本書讀者最好的忠告。交易要變容易，或者變困難，全在乎自己的選擇。衷心祝福本書讀者交易成功。

    布萊恩·沙德


    但願你已經把布萊恩的忠告聽進耳裡。不要盲目一頭栽進交易之中。傾聽布萊恩的簡單訊息——設法了解你的方法能做什麼，而且在交易生涯之初，越早做越好。大部分交易人都是比較晚才做，等市場告訴他們應該早就知道的事：他們的策略並不具有真正的優勢。所以布萊恩建議你投入金錢到市場之前，測試和設法徹底了解你的交易方法。他鼓勵你利用今天市場上買得到的交易軟體去做測試工作。越早做越好。布萊恩言下之意，如果你還沒有購買適當的軟體，那麼你應該現在就去找，不要吝惜投資。你應該騰出心力，盡快去學習系統的發展模塊。


    喜歡自由裁量型交易的讀者可能會說這段忠告不適用於你，因為以自由裁量為基礎的事難以量化。我要說的是，電腦能辦到的事，會令你驚訝不已。


    我的基本信念是：如果「你能想到某個觀念，那麼就能將它寫下來。如果能將某個觀念寫下來，那麼通常能將那個觀念寫成程式。如果不能，那通常是因為觀念的描述還不夠清楚。


    請不要用「我太老了，學不來如何將觀念寫成程式」當藉口！想在市場上成功，就必須認真以對，在金錢、時間和心力上做必要的投資。不要偷懶，不要對方法在市場中的期望值無知。


    布萊恩的聯絡網站：www.schadcommodity.com。


    ## 安德烈·昂格爾


    安德烈·昂格爾（Andrea Unger）是得過冠軍的當日沖銷交易人。他擁有工科背景，具備設計機械型交易策略的專長。2005年，贏得歐洲頂尖交易人盃（European
    Top Trader Cup）比賽。接著在2008年，以十二個月內達成672%的報酬率，而贏得以真實金錢交易的羅賓斯世界盃期貨交易冠軍賽！2009年，他再度榮獲冠軍，報酬率達115%！這時，安德烈已是這項比賽二十五年歷史以來，連續兩年贏得冠軍的第三位交易人。和邁克爾·庫克一樣，安德烈的雄心之一，是連續三年摘冠。2010年，他能不能在這項冠軍賽締造三冠王的創新紀錄呢？時間會告訴我們。（編注：昂格爾贏得2010年的冠軍，成績為240%。）


    我說過，安德烈是成功的當日沖銷交易人，但是和大部分專業交易人一樣，他的生涯並不是從電腦螢幕、鍵盤和交易帳戶開始。身為機械工程師，安德烈在十年內的大部分時間，待在義大利一家大公司的中間管理階層。直到1997年，安德烈才對市場發生興趣。頭幾年的交易，安德烈主要是自由裁量型交易人，根據他在當天螢幕所見，憑直覺建立部位。


    2001年2月，安德烈發現市場創造者（market makers）的認購權證訂價缺乏效率。他是機械工程師，數學很強，很快就知道他能從這種無效率中謀利。他的能力也很強，兩個月內就退休，開始全時交易！


    但是他並沒有一帆風順。安德烈曉得，他所利用的這種無效率，不會永遠存在，所以他著手發展一套機械型交易系統，向知名的義大利成功交易人多梅尼科·福提（Domenico
    Foti）請益，而且很快就成為頂尖的門徒。不久，他成功發展出五分鐘長條當日沖銷機械型策略。在那之後，安德烈和多梅尼科成了親密的朋友，每天共同合作發展交易觀念與系統。


    2006年，安德烈為交易人寫了第一本談資金管理的義大利文書籍，書名為《資金管理：方法與應用》(Money Management: Methods and Applications)。


    今天，安德烈繼續以五分鐘長條走勢圖執行交易。他在幾個不同的市場以幾個機械型系統交易，而且使用不同的方法。安德烈喜歡盡可能分散，綜合使用他的各種策略，在他的模式中結合順勢和逆勢方法。他使用Genesis和TradeStation，除了產生委託單，也用於研究、發展和測試各種交易策略。他交易混合型投資組合，包含指數、貨幣和債券。他喜歡的交易工具是期貨。安德烈為想要像他那樣做的人，經營一個成功的諮詢顧問服務事業。


    安德烈的休閒活動是在街頭慢跑，為半程馬拉松進行訓練。他熱愛旅行，而且和所有的義大利人一樣，十分喜愛義大利國家足球隊。安德烈和家人住在義大利阿斯科里（Ascoli）。現在就來聽聽安德烈的交易忠告。


    交易人有好幾類，但大多有個共同點：他們都想做對。要成為成功的交易人，需要接受自己的錯誤，要了解自己的信念不見得總是對的。你需要規劃交易，堅持遵循計畫，你的計畫也必須面對失敗的可能，並且據以採取行動。

    交易方法有許多種；選適合你的個性的，規劃你的成功之路。你可以用自由裁量型方法，也可以遵循交易系統，只不過一旦決定，就邁開步往前走，不要改變心意，直到計畫告訴你該停止了。

    試著選擇適合你的方法。發展交易系統務必考慮個性。在面對許多一連串虧損交易時，你能夠保持平靜，但卻對巨大虧損感覺很糟嗎？你需要一套限制停損的系統，能夠抓取大波動。如果是這樣，那麼追隨趨勢的系統可能最適合你的需求，例如可以考慮使用停損點訂得很好的簡單突破策略。相反的，如果你總是想要做對，不能忍受連續虧損，那麼內建相當大的停損，這樣的系統或許能夠滿足你。這時，擁有型態辨識能力的短線波段交易系統，可能是最佳的選擇。你將有很高的獲利百分率（如果系統設計得很好的話），偶爾發生的巨大虧損，不會過於違逆你的個性。

    不要試圖改變市場以配合你的信念。你將必須研判市場走勢、測試觀念，並且檢討成果。如果成果不合期望，那就改弦易轍，考慮改用新方法。與其把時間放在試著讓不良觀念運作，不如用在發展更為成功的新方法上。

    時時保持好奇心，思考市場的變動，而且日復一日了解它們如何表現，以及你應該做什麼事，才能繼續擁有正確的優勢。不要找藉口逃避非做不可的任務；在你擬訂計畫時，不要停止在愚蠢的障礙之前。想要成為交易人，就必須奮勇向前。

    最後，但絕非因此就不重要的是，千萬不要高估市場的潛力。觀察過去的走勢圖，你會忍不住想，「如果我在這裡買進，如果我在那裡賣出……」，似乎十分容易賺到可觀的利潤。但這是一廂情願的想法。現實不一樣。如果你碰巧買到低點和賣到高點，那比較有可能是因為運氣不錯，而不是你交易得好。那只是一筆非常幸運的交易。你不必設法抓到頭部和底部才能成功。

    安德烈．昂格爾


    這段可圈可點的忠告，來自連續兩年（編注：現為三年）的冠軍得主交易人。安德烈堅信並且建議你設法發展適合你個性的交易策略。找到和你合得來的一種策略，然後遵循不悖。你對市場如何運作的信念應該保持彈性。接受市場會與時俱變的事實，並且注意適當的訊號給你的線索。準備在必要時調整你的方法。保持好奇之心，開放心胸接納關於市場的新觀念。不要固步自封。市場不是靜態的，所以你也不應該一成不變。保持好奇、適應改變，加上活力十足，你就會成功。這是來自一位非常穩健且非常成功的金牌得主交易人給的穩健忠告。


    安德烈的聯絡網站：www.oneyear target.de。


    ## 拉里·威廉斯


    本章已接近尾聲，現在我要介紹一位空前的市場大師。據我所知，沒有一個交易人像拉里·威廉斯（Larry Williams）那樣舉足輕重。拉里 1962 年開始追蹤市場，1965
    年開始積極交易，1966 年之後全時交易。這是一段很長的時間。要是拉里決定不再分享他的觀念，我不知道誰能取代他的地位。就我所知，追隨他的人沒有人能超越他。當拉里離開這座舞台，他將留下沒有人可以填補的真空。


    我這麼說是因為在我心裡，拉里貢獻的原創性和有效的交易觀念可能多於其他任何人。在我心裡，接受他指導而踏進成功資金管理生涯的交易人，也多於其他任何交易人。我很樂意有人來糾正我，但是根據我的個人經驗與對專業資金管理人的認識，沒有任何交易人的觀念為其他許多交易人運用得如此成功。當然，拉里分享的東西，並不是樣樣都能持續無限期運作。但是，他提出的許多觀念，在首次公開分享後，至今仍然有用，我認為在未來很長一段時間，也能繼續運作。


    如同我說過的，拉里交易了一段很長的時間。若一個人在19歲那年開始留意市場，22歲那年，在人類登陸月球之前，成為積極型交易人，你可以想像，他一路走來，吸取了多少寶貴的市場知識和交易觀念。沒錯，這就是拉里的寫照。拉里在交易市場待了大半世紀，本書當然無法以幾頁篇幅就給他公正的評價。但姑且讓我試試。


    1960年代初，拉里和所有的新進交易人一樣，絞盡腦汁尋找他的優勢。那個時候，拉里主要是股票交易人，利用市場新聞和觀點在交易。而即使沒有新聞或觀點，他還是在市場交易，用盡各種方法還是賠錢！為了保住僅餘的老本，拉里下定決心充實自己。但是當時和今天不一樣的是，市場上只有五、六本談交易的書。拉里花很多時間在美國西岸各處圖書館，尋找有如鳳毛麟角的交易書籍。


    拉里不只苦於缺乏交易書籍，也不像我們今天那樣，有許多聰明的畫圖程式可以使用，只好自己動手畫點數圖。那時候，拉里專注於根據傳統的走勢圖型態進出交易股票，希望盡速獲利。直到1967年，他遇見曾是芝加哥期貨交易所會員的比爾．米恩（Bill
    Meehan），他的交易才真正起飛。比爾向拉里解釋，大錢是靠小部位的大波動賺進來的。比爾教拉里了解基本面的重要性，以及如何判斷市場何時準備大幅向上或向下波動。拉里學到如何在波動中賺大錢。一旦他學會這個，接下來就是抓準進場、下停損點，以及管理出場的時機問題。拉里花了將近十年的時間，才終於根據良好的基本面格局，以良好的技術面時機進場點，精通比較長期的交易。拉里一精通比較長期的交易，就開始發展比較短期的短線波段交易技術。


    拉里的交易生涯裡最諷刺的是，他收穫最多是在交易書籍匱乏和沒有個人電腦可用的時期。1960年代，拉里出於需要，必須自行思考，找出在市場上的優勢。拉里沒辦法參考最新的交易書籍，從這裡和那裡得到新觀念。他沒辦法將一個觀念寫成程式，看它在走勢圖上呈現什麼樣子。雖然米恩給了他概觀，拉里仍然必須自行發展實戰指令。那時候沒有那麼多免費網路資源可以參考。沒有亞馬遜網站可以搜尋最新出版的交易書籍。沒有
    Google 提供快捷的答案。拉里和我們今天擁有的相比，可以說是在黑暗中交易！不妨想像，今天的你如果手頭上沒有交易書籍；如果沒有個人電腦和畫圖套裝軟體；如果不能上網；如果沒有
    Excel；如果不能存取歷史資料或存取電子資料，你要怎麼辦？—無所有？脆弱無助？焦慮？盲目？無知？飄泊無依？感覺在黑暗中？這就是拉里那時的感受。今天的我們，有多少人能在那個電子石器時代，做到拉里所做的事？我？我想，沒有太多人。但拉里因匱乏而用功而壯大。他必須學習如何見機而作、調查和驗證觀念。他被迫成了李·葛提斯後來所說的「孜孜不倦的研究者」。他被迫在
    1960 年代發展的那些技能，有助於他成為過去半個世紀最為原創性的市場思考者和成功的交易人。


    而且，開始投入市場交易約五十年後的今天，他繼續在做研究。誰曾經想過 1960 年代缺乏交易材料和服務，反而是福不是禍？拉里出於需要，透過他的好奇心和努力，這些年來學會以別人未曾想過、深具原創性和創意的方式，觀察市場。


    1960 年代是拉里全部的起點。1965 年，他推出《威廉斯商品時機交易》新聞信。雖然在 2008 年停止出版，直到今天，它仍是這個行業中，壽命第二長的連續出版的大宗新聞信。1966
    年，他推出「威廉斯 %R 指標」(Williams percent R indicator)，直到問世後四十多年的今天，仍然是大部分暢銷畫圖套裝軟體的標準要件。同一
    年，拉里在 1969 年出版的《選股決定盈虧》(The Secret of Selecting Stocks)，率先談到樞軸點（pivot point）。今天，樞軸點在新聞信服務和交易人之間非常受歡迎。但是樞軸點不是拉里發明的；他從交易人歐文·泰勒（Owen
    Taylor）那裡得知這個觀念。泰勒在 1920 年代和 1930 年代首次寫到它們。


    1970 年，拉里率先寫到交易人部位（commitments of traders；COT）報告，因而被視為 COT 的鼻祖。在那之後，一整個產業冒出頭來，投入描繪和解讀
    COT 資料。時至今日，在拉里第一次寫到 COT 報告之後約四十年，他繼續在分析它，尋找基本面資訊，協助他做交易。1974 年，拉里率先寫到商品的季節性，之後也衍生出一整個產業。1983
    年，拉里率先確認開盤價為重要的參考點，而且有功於發展波動性突破技術。拉里率先寫到交易的週中日（day of the week）和交易的月中日（day of
    the month）。拉里率先將資金管理技術引進到私人商品交易上，而且他在進貨（accumulation）和出貨（distribution）方面，製作出許多量數。我可以繼續講下去，但由於篇幅限制，無法提及應歸功於拉里的每一個觀念。


    拉里最為人所知的，可能是他是羅賓斯世界盃期貨交易冠軍賽空前絕後的大贏家。1987 年，拉里在十二個月內，將 1 萬美元的帳戶，交易成超過 110 萬美元，榮獲冠軍。這項成就沒有人能望其項背。拉里愉快地承認，他一度將帳戶經營到超過
    200 萬美元，1987 年股市崩盤後掉到 75 萬美元。他接著藉由交易，使得帳戶在年底之前回升到超過 110 萬美元。如同我說過的，直到今天，還沒人能夠超越他的成就。十年後的
    1997 年，拉里年僅 16 歲的女兒，依循拉里的教導，以1000%的交易報酬率贏得相同的比賽。她將1萬美元的帳戶，在年底之前，交易成10萬美元。不，拉里並沒有替她找格局和下交易，女兒是根據拉里教她的準則，獨力做每一件事情！


    拉里教過世界各地數千名交易人。1982年，他率先在講習班中執行現場交易。在那之後，現場交易成了高等講習班的常見做法。據我所知，拉里是在一連串連續的講習班中，現場交易賺進超過100萬美元的唯一交易人，這在今日仍屬罕見。我曾經參加拉里的兩場百萬美元挑戰講習班（Million
    Dollar Challenge Workshops），親眼目睹他現場交易，兩次研討會都賺到錢（我和其他的參與者分享他所賺利潤的20%）。表12.2彙總了他的講習班現場交易成果。太神奇了。


    我的好友兼導師傑夫·摩根介紹我認識簡單的價格型態，但拉里開啟我的雙眼，看到型態的廣大世界。我仍能記得第一次百萬美元挑戰講習班中見到拉里的樣子，他看著走勢圖，然後將最近的每日長條圖順序輸入他的TradeStation系統寫手程式，將每日高價、低價和收盤價相對順序程式化。他接著透過走勢圖的歷史資料庫跑程式，尋找類似的型態是否發生。他想要觀察目前的價格走勢是否為可以交易的重複性型態。就在那一刻，我決定寫自己的程式，因為這可以讓我尋找和確認機率高的重複性型態。這套程式直到今天仍然是我所交易短線型態組合的守護者。


    如同我說過的，我不知道有其他的交易人曾有拉里在市場上的成就。身為交易人，拉里主要專注於交易期貨。他以日長條圖交易。根據他的基本面分析，任何市場只要呈格局趨勢上揚，他都會去交易。他偏愛進擊即將出現大幅波動的市場。因此，他可能不會交易特定的市場很長的時間，但是，拉里對個別市場不是很感興趣，寧可尋找基本面格局良好的市場。


    雖然拉里不是機械型交易人，他在如何接觸市場上，卻非常系統性。他尋找的市場，是在他大部分基本面格局標準都到位的。而我必須說，當拉里談到基本面，他不是指資產負債表或經濟分析。他是指市場的基本面結構，懂得參與者正在做什麼，以及他們可能擁有的影響力會對將來的價格走勢產生什麼樣的衝擊。拉里的基本面分析來源之一是
    COT 報告。一旦他找到基本面格局即將大幅上漲或下跌的市場，他接著會自由裁量要交易哪個市場。一旦決定好，拉里會使用他的技術面工具決定進場時機、下停損點，以及管理出場。


    拉里也深信交易的藝術。他不相信交易應該是「依數字著色、照本宣科的事業」。他不認為交易人應該採用機械型系統，而且就此永遠以此交易。他並不是說機械型交易賺不到錢；他只是相信交易人結合交易的藝術和系統化的方法，可以做得更好。拉里使用
    Genesis 軟體，以尋找他的基本面格局和確認他的技術性進場、停損和出場水準。拉里十分喜歡 Genesis，很想擁有這套軟體的所有權！


    今天，拉里仍在學習。他猜自己會一直學下去，因為市場持續不斷在變動。他現在所交易的东西，不同於他在1960年代、1970年代、1980年代或1990年代交易的东西。今天，有不同的工具和市場可以交易，而電子市場的問市，使得它和過去完全不同。沒有事是一成不變的。


    這麼多年來，拉里寫了九本書，其中許多翻譯成十種不同的語言。四十多年來，拉里一直捐出書的版稅，支持美國俄勒岡大學的獎學金計畫。


    拉里沒有埋首在市場中時，不是在研讀考古學，收藏美國本土的藝術品，就是在釣魚或者跑馬拉松（他跑了七十六場）。但是，儘管有這些興趣，拉里還是覺得沒有任何东西比得上市場那麼引人入勝，令他太太又氣又好笑。順道一提，如果有機會，你應該閱讀他1990年寫的《摩西的山：發現西奈山》(The
    Mountain of Moses: The Discovery of Mount Sinai)，你會大開眼界。拉里．威廉斯竟然有印地安納．瓊斯（Indiana
    Jones）之風！拉里和路薏絲（Louise）住在美國加州賀亞（La Jolla）。


    你即將讀到的東西非常特別。它來自積極交易市場的時間遠遠超過其他大部分市場參與者的成功交易人。請注意聆聽，拉里的忠告來自多年的經驗，有錢也買不到。


    如果我只能告訴新手交易人一件事，那我要說的就是：交易是極其簡單卻也複雜的事業。我沒辦法只談一件事。

    但是如果要我只能講一句話，那會是：要成功，你必須掌握控制權。

    控制權比你所交易的系統，或者使用的資金管理方法重要。

    有些人將專注和控制混為一談；兩者是有差別的。專注是指你注意特定的事情，而控制則超越於此。控制意味著不只處於高度注意的狀態，也持續採取特定行動。

    控制需要包括這個交易事業的許多層面。不管你選擇使用什麼形式的資金管理，你都需要擁有完全的控制權。換句話說，單單擁有資金管理策略或交易方法是不夠的。這有點像是你擁有雪地防滑輪胎，卻沒有在冬天裝到車子上，你的車子還是會在冰上打滑，你完全無法控制。這是很好的比喻。遠勝於我覺得我能想出來的！

    擁有資金管理方法：曉得自己該做什麼・指的是專注，但是沒有控制以掌握程序的運用，是交易人偏離正軌的真正原因，就像汽車在冰上打滑，撞得稀巴爛。

    只要你使用的資金管理策略合理且不過度投機，我甚至不敢說策略是否會造成什麼差異。能幫助你的不是資金管理方法，或者了解資金管理，而是應用——你的控制權。

    交易策略或個人的交易心理，道理也相同。父母的告誡都有道理，如好好吃飯、運動、別交壞朋友等，但不是每個人都做到。

    講一場勝仗遠比打一場勝仗容易。請相信我，交易事業正是一場戰鬥。這場戰鬥主要是先確定像樣而可行的方法，能使交易真正賺到錢，然後是持續不斷應用那個方法、那個方法的資金管理，以及你個人堅持遵循那個方法，並且持續努力改善那個特殊策略的戰鬥。

    但新手尋求的是簡單的答案……其實每個人都在尋找這樣的答案。簡單的答案不是沒有，但真相是：別人的答案不如你為了解決自己的困難所問的問題。

    問題，而不是答案，才能成就更好的交易人。

    我從事交易約五十年，還沒有洞見可立即用於操作或執行一


