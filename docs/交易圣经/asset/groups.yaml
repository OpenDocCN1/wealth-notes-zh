    沒有風險，就沒有報酬；少了努力，就沒有報酬；沒有執著和堅持，也沒有報酬。

    我也但願自己能說我有答案、有道光和真相，但我的交易經驗並不是這樣。我真的但願我有答案可以幫助你找到並一直走在獲利交易的路上，但這條路充滿問題，而其中大部分似乎沒有絕對的答案。但是，這並沒有成為我的阻礙，我仍然不斷問問題，並在過程中學習，一天進步一點，朝成功的專業交易人邁進。


