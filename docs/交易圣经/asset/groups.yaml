    則依數值大小彙總了各種比率。


    折返百分率的一大缺點就是數字太多！它們不可能都對。那麼，哪一個才是對的？可惜，我當年初入行時，看到那麼多斬釘截鐵的比率和理論，還不懂要先質疑。我在交易生涯的頭十五年是艾略特波浪的信徒。進入艾略特波浪等於進入費波納奇。但我似乎找不到正確的比率辨識支撑或阻力。由於我的背景包括艾略特波浪和費波納奇，所以我將集中討論它們的比率。


    如圖9.25所示，常用的費波納奇比率有38.2%、61.8%和78.6%。50%折返水準雖然不是費波納奇比率，也被視為相當重要。交易人要使用哪個比率，確定折返已經找到支撑或阻力？這是很難回答的問題。有選擇，工具就變主觀。


    然而，「選擇」是費波納奇交易人面對的兩個問題中較輕微的一個。儘管諸多文獻和軟體程式投入費波納奇，我的研究卻顯示，它在確認支撑或阻力水準方面，不比其他的百分點更占競爭優勢。


    基本上，我根據資料製作擺盪圖，並且計算圖上所有的擺盪'
