    果早在你的交易生涯之初就知道這件事，你現在的處境會該有多好！此外，馬克的第三個真理，部分有違一般接受的交易說法。馬克從來不會在賺錢的交易上待太久的時間。但是交易人被灌輸「放手讓利潤滾下去」，而不是盡早獲利了結。馬克所做的事完全相反。這件事值得你深思。


