    \ * PayOff_Rati\n    End If\n```\n\n```\nAdd to the equity curve\nIf i = 1 Then\n\
    \    EquityCurve(i) = Account_Start\n    i = i + 1\n    EquityCurve(i) = EquityCurve(i\
    \ - 1) + TradeResult\nElse\n    EquityCurve(i) = EquityCurve(i - 1) + TradeResult\n\
    End If\n\nAdd to our account balance\n    Account_Balance = Account_Balance +\
    \ TradeResult(\nElse\n\nWe have a LOSS!\n    Calculate the loss\n    If Money_Mgt_Approach\
    \ = \"Fixed Percentage Risk Mon\n        TradeResult(j) = -(Fixed_Percent_Risked\
    \ * Acco\n    End If\n\n    If Money_Mgt_Approach = \"Fixed Dollar Risk Money\
