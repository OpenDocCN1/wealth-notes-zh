    再順帶一提，我曾和在電話上與一位交易人閒聊，對方問我關於海龜系統的意見。我給了他相同的看法，也就是它並不適合小散戶。結果呢，最近他又打電話給我，說他對自己的交易很感沮喪。他對我之前給他的忠告置之不理，週末時參加了桑德斯的研討會，後來不可避免的事情終於發生了；長線順勢交易人常見的賠償幾乎掏空他那小小的帳戶。問題不是出在系統，因為他說它最近的交易填補了賠償，但是要拿資金去挾注許多未軋平的部位，加上不可避免的龐大賠償，這遠超出財務承諾的負擔。但願這給你上了一課。


    現在我們就來更深入觀察長線順勢交易和短線波段交易。


    ### 長線順勢交易


    如你所知，長線順勢交易應該是只有負擔得起以高額帳戶交易的人才適合考慮。表5.2顯示長線順勢交易的特徵，以及它們對長線順勢交易的影響。表中並依交易生存所需的三個關鍵（資金管理、交易方法和交易心理）分類特徵。


    ## 表5.2 長線順勢交易的關鍵特徵


    | 面向 | 關鍵量數 | 影響 |  |

    |---|---|---|---|

    | 資金管理 | 投資組合 | 大 | 20到30個市場 |

    |  | 賠損 | 大 |  |

    |  |  | 長 |  |

    |  | 財務承諾 | 高 | 20到30 × 起始保證金 |

    | 交易方法 | 時間架構 | 長 | 1+個月 |

    |  | 準確率 | 低 | 25%到35% |

    |  | 平均獲利:平均虧損 | 高 | 3.0+ |

    |  | 期望值 | 好 |  |

    |  | 每個市場的機會數 | 低 |  |

    |  | 經紀費用與滑價 | 低 |  |

    | 交易心理 | 情緒障礙 | 高 | 經常虧損 |

    |  |  |  | 長期賠償 |

    |  |  |  | 難以休息 |


    ### 資金管理


    組合 長線順勢交易法需要大規模的投資組合才會成功。由於市場只有15%的時間呈現趨勢，順勢交易人需要監控和交易20到30個市場，以確保他們每年能夠捕捉到一兩個趨勢最好的市場。


    賠償 長線順勢交易法有少數幾個高獲利交易和許多小虧損交易。如果你交易20到30個市場，而且經常賠錢，賠償會日積月累，而且經常累增。由於你花在賠錢上的時間多於賺錢，這個方法確實會有很長的時間賠償。


    財務承諾 如同我說過的，長線順勢交易的財務承諾很高。監控和交易20到30個市場，需要順勢交易人有能力以充分的資金同時支援那些部位。長線順勢交易系統不可能同時啟動所有市場的20到30個進場訊號；但是順勢交易人必須做好準備，以因應這種事情發生，因為他們禁不起對這些訊號做取捨。順勢交易人不知道哪個市場或訊號會使他們那一年的交易賺大錢，所以必須交易所有的市場和所有的機會，不管時點為何。


    ### 交易方法


    時間架構 順勢交易人必須準備持有部位超過一個月，而不致停損出場。他們需要學習真的讓獲利交易繼續跑下去，而這必須以支付一路上發生的損失為代價。


    準確率 長線順勢交易的準確率偏低，可能在25%到35%之間。這並不叫人驚訝，因為市場只有15%的時間呈現趨勢。


    平均獲利相對於平均虧損的報酬比率


    平均獲利相對於平均虧損的報酬比率很高。良好的長線順勢交易方法，應該交付的平均獲利至少是平均虧損交易的三倍。順勢交易人需要平均獲利交易高得足以彌補所有的小虧損還有餘，以產生風險資本的報酬率。成功的長線順勢交易人總是靠兩三筆巨大獲利撐一整年。


    期望值


    長線順勢交易的期望值不錯。一種順勢交易法如果平均30%的獲利交易有3:1的平均獲利對平均虧損報酬，就能產生20%的期望值（〔30% × 3.0〕−〔70%
    × 1.0〕）。


    機會


    每個單一市場的機會很差。順勢交易法很慢才會啟動進場格局，因此一年當中每個市場呈現的交易機會不夠多。順勢交易彌補每個市場缺乏機會的方式，是交易龐大的市場組合。同時交易20到30個市場的組合，可以帶來夠多的機會，讓交易人成功。


    但是對於想要交易單一市場的交易人來說，即使帳戶大到可以考慮使用長線順勢交易法，這麼做也不適合。這是因為長線順勢交易法和任何方法一樣，需要許多機會去實現它的期望值。交易單一市場不會給長線順勢交易法夠多的機會。要這麼做，唯一的方法是交易包含很多市場的市場組合。


    交易成本——經紀費用與滑價


    長線順勢交易的經紀費用與滑價等交易成本偏低。由於這是比較緩慢的交易方法，所以和短線波段交易比起來，交易筆數通常較少。交易筆數少，經紀費用就比較低。由於平均獲利相當高，經紀和滑價占利潤的百分率也就通常較低。


    ### 交易心理


