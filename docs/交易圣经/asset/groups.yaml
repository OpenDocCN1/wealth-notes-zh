    # 小結


    本章耗費相當長的篇幅談論成功交易通則的第二部分，因為我相信交易方法是實務上交易三大支柱中第二重要的元素。交易方法定義了你的優勢，是你投入市場的正當理由。除非你有具備真正優勢的真正方法，否則根本不該交易。


    本章解釋了常見的三種交易方法（自由裁量型、機械型以及自由裁量機械型）。大部分新手一開始都是自由裁量型交易人，最後慢慢走向結構化或機械型的方法。機械型交易大幅消除了自由裁量型交易的情緒混亂。所以有些專業交易人最後會成為自由裁量機械型交易人，即利用經驗和判斷，在極度結構化和機械化的交易格局中做選擇。他們相信自己能夠利用多年經驗，以自由裁量的方式，贏過機械型策略。


    你可以<|reserved_special_token_1527|>順勢方法和逆勢方法交易。完整的交易方法有兩部分：交易格局和交易計畫。格局應該只看潛在的支撐和阻力水準。技術面分析學派可以分為預測者、夢想者和務實者。交易計畫針對進場、停損點以及獲利交易的出場，訂定明確的準則。進場的重要在於它們直接影響期望值和部位規模。留意大停損點的致命吸引力，它們會毀了交易人。有效的交易計畫，應該在進場交易之前，就支持和證實某個格局，而方法需要
    TEST 程序驗證優劣。你要將資金管理策略和經過驗證的方法結合，計算破產風險估計值。注意交易目標：不能在財務上破產，務必生存下去，交易時的破產風險不能高於
    0%。


    順勢交易是明智且理想的交易方法。市場有趨勢，趨勢是所有利潤的基礎。順勢交易人的虧損交易比率高達 67%。交易人可以執行突破或折返順勢交易。折返順勢交易允許交易人以較低的'
  - '[PAGE 291]


    風險建立部位，但付出的代價是有時會錯過大趨勢。突破順勢交易絕對不會錯過大趨勢，但代價是停損通常較大，賠償也較大。


    我討論了使用折返順勢交易做為交易方法的實務意涵。你現在知道折返順勢交易應該簡單，我也提醒你為何要交易。你學到折返順勢交易不應該比單純地按部就班程序困難。


    即使大部分交易人都知道順勢交易是最安全的交易方式，但還是有那麼多人失敗。常用的趨勢和折返工具，因為太過依賴交易人的主觀認定和解讀，太有彈性、不穩定及不可靠而成效不彰，不能做為交易的基礎。交易人的關鍵議題是使用既客觀且獨立的工具，趨勢和折返的解讀不受交易人影響。


    並非所有的指標都不好。有些成功的方法使用指標。最成功的方法只使用單一指標，帶有單一變數，在範圍廣泛的變數值內行得通。


    本章介紹了成功方法的基本屬性，海龜交易策略就是個好例子。方法應該力求簡單。時間架構較高的擺盪圖就是良好的客觀趨勢工具。我也分享了我的費波納奇研究，證明在採用主觀的折返工具之前，查證有多重要。


    本章也思索所有交易人是否都只是服 почина安慰劑的交易人，在交易格局中依賴信念，以投入市場執行交易。不管是理性的客觀或非理性的主觀，交易人對格局所持有的信念都很重要。信念驅使交易人投入市場，有機會執行良好的交易技能。我的信念偏向根據事實，而不是虛構之物。


    大多數人一開始都是自由裁量型交易人，絕大多數最後採用機械型方法。繼續交易的人終究會擅長於機械型交易，並成為市場常勝軍。真正優秀的交易人則繼續轉為自由裁量機械型交易人，借重多年經驗，選擇極結構化或機械性的格局。頂尖高手則'
