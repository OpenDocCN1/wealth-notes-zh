    # 融會貫通


    當你開始交易，每天的例行工作應該如下所述。


    # 交易方法


    你的第一步是確認某個格局是否存在。如果存在，就決定交易計畫的進場水準、停損水準以及出場指令。從你估計的進場和停損水準，計算每口合約或部位規模的冒險金額。


    # 資金管理


    第一項生存任務是確定你是否仍處於財務邊界的風險資本上限之內。如果累積交易虧損已經超過風險資本上限，你就應該停止交易，轉身離去。


    第二項生存任務是檢視系統停損點，觀察所用方法的淨值動量是否為正值。務請將系統停損點重疊在交易方法的假設單口合約淨值曲線上。淨值曲線有三部分：


    +   - 假設性的交易歷史

    - 在驗證期間蒐集的 30 筆 TEST

    - 假設性成果實況


    如果交易方法的單口合約淨值曲線高於系統停損點，就下委託單，進場交易。反之，就不要交易，並繼續更新淨值曲線，等候它回到系統停損點之上，才恢復開始交易。


    如果進場交易，你的第三項生存任務是計算在你的資金管理策略和帳戶規模之下，可以交易的合約口數，或者部位規模。一'
  md: '

    0%破產風險執行交易，潛意識也會舒暢無比。如果沒有做好，它會藉由焦慮和壓力，盡其所能阻止你交易。切記，如果你對交易感到壓力，就應該停止交易。請傾聽潛意識的聲音，它想告訴你每個人可能都知道的事情——你對交易實際的運作一無所知，很有可能失控！


    交易心理的關鍵是管理三大情緒：希望、貪婪和恐懼。交易心理是讓資金管理和方法緊密結合的黏合劑。在開始之前，我先討論一下，關於交易心理的重要性，一般的看法是如何。此外，我必須坦承，我不是心理學家。我沒有受過正式的訓練，不曾讀過一本談交易心理的書。我只想讓你知道，我對這個討論熱烈的主題有何看法。至於要不要聽，由你決定。


    ## 一般觀點


    一般相信，你需要了解潛意識所製造的限制，了解如何接入潛意識，以釋放潛力。也就是說，一切都存乎心。但是，我不認同。我認為，只有開始交易，心理面才重要。我不相信交易成功有賴於了解潛意識製造的限制。我不相信成功有賴於知道如何接入潛意識，以釋放潛力。我認為，「限制」和「釋放」潛力的說法，根本愚不可及。


    相信心理面應該用於擊退潛意識的許多人會告訴你，要相信你的交易計畫、堅持到底、執行你的交易計畫。但我認為，潛意識如果不認為交易人真正意識到自己在做什麼，心理面就會成為障礙。就這麼簡單。


    儘管上那麼多課程、研討會和講習班，儘管看過那麼多書，儘管在電腦安裝畫圖程式，大部分交易人仍然無知，而且潛意識看得一清二楚，曉得交易人缺乏交易能力。這是為什麼它會盡其所能，阻止交易人進入市場。它使交易人的心跳加快、掌心冒汗、心悸、焦慮，偏離自己的交易計畫。


    我相信，如果交易人採用明智的資金管理策略，結合簡單且穩健的交易方法，破產風險會是0%。如果做到這一點，潛意識會曉得他們有能力，而樂於待在後院不闖事。


    ## 破除無知，回歸基本功


    資金管理和正期望值策略，是防範破產風險的兩大關鍵武器。如果交易人做好功課，曉得如何將破產風險降為0%，並以簡單、客觀而獨立的方法，正確做到這件事，潛意識會知道這個

    人明白交易是數字遊戲，知道這個人押注的勝算對自己有利。這時，潛意識在交易時會變得放鬆，促成交易人遵循交易計畫，因為它知道交易人擁有交易優勢，以0%破產風險交易。它會要交易人去賺錢；它一點都不笨。因此，與其以某種心理緊身衣綁緊潛意識，我相信交易人應該傾聽並聽從潛意識的話！因為如果交易人能夠成功地將破產風險降到0%，潛意識就不會設置路障。


    我相信資金管理在交易方法之上，而交易方法又在交易心理之上。但是，一旦開始交易，心理面會很重要，因為它對於交易人能否緊盯著老虎眼睛很重要。我認識澳大利亞一些交易金額超過十億美元的交易人，但若你和他們擦身而過，你不會知道他們在全球金融市場一週五天半交易那麼龐大的資金。你很可能會誤以為他們是住在郊區的普通專業人士，而非世界一流的超級交易人。他們看起來就像隨和的成功人士。他們不會無精打采，像個瘋子般。他們不會為遵循交易計畫而掙扎窘廹。他們不會一直和潛意識比腕力。他們不會躺在某個交易教練的躺椅上。他們神情


    輕鬆，散發滿足的神色，他們相當富有，非常富有。我的論證就是根據前述觀察到的現象。


    以上是我對心理面的簡略觀點。現在我們來探討交易心理，但是我不會過於深入。前文提過，交易心理主要是管理三大情緒：希望、貪婪和恐懼。


    ## 管理「希望」


    當你發現自己希望一筆交易賺錢，這就是希望的情緒。我敢說，你希望交易有好成果的時候，十之八九是你賠錢的時候。「希望」是在一筆交易停損出場前最後的感覺，而且通常在市場距離停損點只有幾檔之處時放大！你希望賺錢，因為你厭倦賠錢，因為如果再賠，帳戶就會受傷。


    希望的情緒有兩個源頭：沒有應用正確的資金管理，以及不知道期望值。這有如在黑暗中交易，而解決方案是停止交易，先讓破產風險降到0%。適當的資金管理能降低交易規模，進而減低對帳戶受傷的憂慮。如果你太過擔心某筆交易的结果，原因通常是在期望值、最糟賠償和帳戶規模之下，你拿太多錢去冒險。你的帳戶過度交易。發展簡單、客觀和獨立的方法，會給你擁有正期望值優勢的策略。結合明智的資金管理和正期望值方法，能達成0%的破產風險。使用TEST程序驗證方法，能確認優勢。你的潛意識會見到你做了功課，並促成你去交易。你不會再希望下一筆交易是贏家，你會開始希望你的方法找到額外的格局，給你更多賺進期望值的機會。你會開始專注於這個程序。


    以TEST驗證你的期望值，將給你信心，相信真的知道自己正在做什麼事，以及在較長的期間內，以你所用的方法，每拿一拋錢去冒險，應該期望賺得多少。你會停止希望，開始期待。


    ## 管理「貪婪」


    在你開始想要更多時，這就是貪婪的情緒。貪婪會啟動不安全感，你會開始認為自己錯過了某些東西，因為你相信別人做得遠比你好。你會開始想要更多錢，而且相信交易越多，錢越多。想要更多會導致衝動交易，導致執行邊際交易、虧損累增，以及報復性交易的循環。這個循環會加速重複，直到你醒悟或者帳戶破產為止。


    當你不滿於擁有的，貪婪就會出現。你應該停止操心做對或做錯。當情緒迷失方向，貪婪就會成為問題。情緒迷失方向是來自目標和期望有瑕疵。大部分交易人在起步時，目標都是達成100%的準確率，並期望超過50%或100%的報酬率。


    第3章曾討論達成情緒定向的重要性。如果你能以溫和的期望，訂定自己的專業目標，就是邁出管理貪婪的一大步。務必接受沒有人能連年達成儘管符合統計卻不切實際的報酬率。沒有證據顯示有人能夠做到。務必滿足於你所擁有的。建立溫和的期望。為風險資本建立溫和的報酬目標，20%、30%或40%的報酬率都好。記住，期望值越高，風險越高，破產機率也越高！


    要確知你偏愛的風險資本報酬率水準。你應該設想，在交易一年後，達成溫和的報酬率目標，那種美好的感覺。銘記那種感覺。你應該樂於堅守你的溫和報酬率期望值。


    ## 管理「恐懼」


    在達成情緒定向以管理貪婪之後，你要學習如何管理賠錢的恐懼、失敗的恐懼。恐懼來自未知，害怕因未來不確定性而無法掌控一切。


    管理恐懼很重要，你若置之不理，可能無法正確執行交易計畫，如未執行交易、移動停損點以及太早出場。你需要發展適當的心態，將恐懼丟到一邊，繼續用你的方法交易。


    要克服虧損的恐懼，唯一的方式是面對它。面對恐懼，取得控制權。經由負期望值，創造確定性，以消除將來的不確定性。期望最糟的事情會發生。如果你能做到這一點，就不必考慮是否要遵循所用方法發出的某個訊號。你會交易所有的格局、不可避免發生虧損，卻因為所用方法的正期望值，而在較長的期間內受益。務必記住：雖然交易相當簡單，卻不容易。


    恐懼是個人的事，沒有一體適用的解決方案。在此分享我如何管理自己的恐懼，希望對你有所啟發。


    我是全時的期貨交易人。撰寫本書時仍在交易。一個星期五天半、一天二十四個小時，我在九個全球指數市場交易五個主要的貨幣對。 我很少一天不在某個市場、世界上某個部分、某個地方交易。交易標的可能是指數期貨，可能是SPI、日經、臺灣、恆生、DAX、Stoxx50、FTSE、Mini
    Nasdaq或E-Mini S&P500。撰寫本段的現在，我在Mini Nasdaq和E-Mini S&P500下了兩張委託單，執行兩三筆短線逆勢交易。我目前在一筆中線順勢交易作多FTSE，而這筆交易我已經持有兩個星期。我的營業員會幫我移動追蹤停損點。在我交易的五大貨幣對之一，我可能有個格局：可能是歐元、英鎊、日圓、瑞士法郎或者澳元期貨。但今天我沒有。平均而言，我通常一天執行兩筆交易，而且必須不斷面對自己害怕虧損的恐懼。我要和你分享的方法，有助於我管理恐懼。


    雖然我所用的方法具有長期的正期望值，但我每天是抱著負短期和負中期期望在交易。我在交易時是悲觀主義者。


    ## 負短期期望值


    我所說的負短期期望值，意指是每當我交易時，我總是期望會發生虧損。我總是假設我做錯了，毫無疑問會停損出場。因此，當我有個格局可以交易，我總是在市場開盤之前，先在我的損益試算表上，借記我的期望虧損。認列我的期望虧損，就能消除和交易有關的所有情緒！


    我發現自己因此在交易時一點都不害怕！這聽起來可能有點奇怪，但在我每次交易時，預期會發生虧損，等於承認自己害怕虧損。承認我害怕，我就能征服它，而且能在我得到的每個格局都交易。由於預期會發生虧損，我就能消除未來的的不確定性。我預期會發生虧損。我知道未來。我無所畏懼。我發現，如果我預期虧損，一旦虧損發生，它們對我的影響會比較小。此外，這有助於我成為優秀的輸家，而我知道這會讓我成為長期的贏家！


    我建議你欣然迎接虧損。預期虧損發生，就能消除將來的''不''確定性，讓你心無恐懼或偏愛，交易所有格局。藉此，你不但能減輕虧損的刺痛，也會成為優秀的輸家和長期的贏家！


    ## 負中期期望值


    我的負期望值不是起於和止於每一筆個別的交易。在格局出現的那一天，我會預期發生虧損，而且我也相信我就要開始承受最長一串連續虧損的交易。如果我上一筆交易發生虧損，我相信自己正處於發生最糟賠償期間。


    我相信我的最長連續虧損和最大的連續虧損就在前頭等著我。我絕對不會忘記市場的最大逆境。我必須這麼想，做好準備，以迎接始料未及的事，這表示我必須不斷思考「防守、防守、防守」。挺身面對害怕虧損的恐懼，就能克服它！


    透過負短期和負中期期望值，創造確定性，以消除和交易有關的恐懼，助你恪遵自己的交易計畫，成為成功的交易人。


    ## 同場加映：管理「痛苦」


    現在我要提出自己對交易心理面的貢獻。儘管許多人高聲疾呼，認同心理面是交易成功的最大障礙，卻很少聽到有人在談及「希望」、「恐懼」和「貪婪」之際，提到「痛苦」，我為此十分吃驚。我現在要來矯正這個缺失。


    交易執行起來相當簡單，要成功卻很困難，而且越來越難。一旦實際交易，只會更加困難，因為那麼多的交易書籍、DVDs、研討會和講習班，都沒有提到交易帶來的痛苦。我認為「痛苦」的實務討論是第三支柱完美的平衡。如果無法處理交易的「痛苦」，前文所有成功交易通則都無關緊要。


    痛苦管理發生在心理面。所以你需要在潛意識中，推開希望、恐懼和貪婪，騰出空間給「痛苦」。


    ## 交易人的必經之路


    交易是個痛苦世界。賠錢會心痛。賠錢賠好幾個月會心痛。


    賺錢時，想到當初如果待在場內久一點可以多賺一點，心會痛。花了大量時間和精力，研究似是而非的交易理論，卻賺不到錢，心會痛。花了很多錢，上口碑不錯的講習班，卻因為執行學到的觀念而賠錢，心也會痛。花了大量的時間和精力，研究、發展、設計程式和測試某種觀念，卻得出負期望值，心還是會痛。當你和交易夥伴花了大量的時間和精力，透過TEST程序驗證期望值，卻告失靈，心會痛。花了多年時間和精力，努力改善你擁有的優勢，卻不見效果，失望之餘，心還會痛。順勢交易有67%的交易賠錢，心會痛。交易在大部分時間內發生賠償，即使所用方法的準確率較高，心會痛。退場觀望、等候下一筆交易，想到可能錯失下一波大走勢，除了焦慮，心還是痛。


    成功的交易人都經歷過這些，但他們懂得如何管理痛苦。痛苦永遠不會消失，但是可以藉由經驗，學會如何緩解，以堅持下去。缺乏經驗的交易人則沒有做好接受痛苦的準備，甚至相信交易和賺錢應該很容易。他們沿著阻力最小的線移動，聽到關於交易的痛苦，就掩耳不聞。他們不知道，正因為征服痛苦，才會有持續成功的交易。


    你需要學習如何因應那種痛苦。持續不斷的痛苦會挑戰你對交易計畫、所用方法的執著。你需要接受你可能經歷一長串連續虧損的交易，有些小，有些大得令人不安。你將需要學習如何因應那種痛徹心扉的痛苦，答案不是服用普拿疼。交易人的方法各不相同，取決本身處境而定。我將在此分享我的心得，期望你能有所得。


    ## 我的痛苦長征之旅


    我征服痛苦的方式，就是成為系統型或機械型交易人。我藉小規模交易征服痛苦：任何一筆交易，我不會拿帳戶很高比率的錢去冒險。我使用明智的資金管理策略。我的交易金額很小，任何個別交易的結果，我都不感興趣。任何個別交易的結果都不會影響我一整年的表現。我的交易金額很小，因此當我賠錢，那只不過是九牛一毛；它只會帶來很小的痛苦。我拿簡單、客觀和獨立的策略去交易，我曉得那些策略將來很有可能繼續保持穩健。雖然高低起伏不定的非優化淨值曲線，讓人交易起來相當痛苦，我卻知道我交易的是對我有利的真實市場結構。我知道，結合我那保守的資金管理策略和正期望值方法，我投入交易的破產風險是0%。我曉得我在交易上可長可久。雖然痛苦，卻會持續給我報酬；報酬高到足以接受交易經常不斷的痛苦。


    每一天，我下委託單前，會在損益試算表上借記期望虧損金額，並且正面看待虧損。我所有的交易委託單，都下給一位傳統的顧問，他的經紀公司有一天二十四小時的交易櫃檯。我所有的委託單一下達，就會收到確認電子郵件，接下來我可以一整天都不管市場。我試著在那一天之中保持忙碌，防止心思飄到市場。我在那一天中不看市場，螢幕不開走勢圖。我不會去看市場一檔檔的跳動。忽視市場有助於我忽視預期會發生虧損的交易。保持忙碌，會使我的心思與交易保持距離。如果我能分心，不去理會交易，便能減輕交易的痛苦。寫書也是很棒的做法。分心能讓我不去注意市場的走勢，在幾乎沒有痛苦下交易！


    機械型交易有助於我消除交易裡的情緒，緩解由交易而來的各種痛苦。我因此能將交易視為一種事業，或許不能讓你每分鐘笑一次，或許感覺失望多於勝利，但至少能讓你獲利，至少會獎勵認真經營交易事業的交易人。此外，它是一種事業，需要投入的心力，遠多於單純日復一日執行交易。


    這就是我個人的緩解痛苦配方，希望也對你有幫助。但我也明白，即使我苦口婆心，還是會有很多充耳不聞，帶著全部家當，一頭栽進交易，重蹈覆轍。這就是人性。因此，能夠換顆智慧腦袋的人，交易之路會更好走。


    我對管理痛苦的想法，適用於接納本書通則的交易人，以及即將以0%的破產風險展開交易的人。但如果你是缺乏耐性的交易人，發現自己處於砲彈猛烈攻擊的傘兵坑中——請深呼吸，你所做的一切都很正常，都是學習曲線的一部分。大部分交易人都是過來人，包括我自己。但是，如果你缺乏耐性，請不要開立高額交易帳戶。一切保持溫和。


    ## 痛過才懂通則的重要


    通常只有透過經驗和痛苦，交易人才會徹悟，簡單的觀念才行得通。只有透過經驗和痛苦，交易人才能欣賞、重視簡單。新手交易人因為無知，所以不理解，也不懂得欣賞。遺憾的是，大部分新手都誤信成功交易的答案只存於複雜。他們自然而然被艱深難懂和有趣的觀念所吸引。


    就像經父母告誡不要碰火的小孩，得真的燙到了才學到教訓，儘管你真的想要傾聽和學習，卻必須走過屍橫遍野的交易失敗之路，體驗過交易的失敗和痛苦，才會敞開心胸，學習交易真正行得通的事情。在親身歷經傳統技術面分析失敗的苦頭之前，你對虛假的承諾沒有免疫力。這麼說令人遺憾，卻是事實。而一旦你體驗到失敗的痛苦，準備好接納成功交易通則，請記得本書，撥出時間溫習一些內容，真的開始傾聽。


    我不想成為掃興的人。每個人都有希望；只是交易這條路可能不像到公園散步那麼簡單。但是，儘管交易成功是困難的事，伴隨經常不斷的痛苦，請記得它也有獎酬，你終究會賺到錢。相對於所有的「痛苦」努力，獎酬並不差。


    ## 提醒：謙卑，再謙卑


    市場最大逆境會為所欲為，給你許多痛苦，誘使你偏離選定的道路，無法成為成功的交易人。如果能保持謙卑、時時提防最大逆境，做好防禦工事，就足以不屈不撓，度過痛苦。不保持謙卑，不臣服於市場最大逆境，交易生涯會非常短暫。賈斯在《海龜投資法則》一書中說得好：


    想要成為出色的交易人，必須征服自尊，並且培養謙卑的態度。謙卑讓你接受將來是不可知的。謙卑會阻止你嘗試做預測。謙卑會阻止你在交易對你不利時，自行插手，最後虧損出場。謙卑會讓你接受交易是根據簡單的概念，因為你不需要知道任何秘密，好覺得自己很特別。


    莫忘市場的頭號準則：最大逆境。


    ## 小結


    交易心理面是交易實務三大支柱的最後部分，也是第五項成功交易通則的最終章。交易心理是交易生存和成功的要素。


    我和絕大多數人對心理面的看法相左。我相信資金管理和交易方法的位階高於交易心理。我也相信，交易心理是資金管理和交易方法的重要黏合劑。而交易心理只不過是管理交易人的希望、貪婪、恐懼和痛苦。


    正確運用資金管理，正確地設計、發展和驗證交易方法，能大幅緩和希望所帶來的心理障礙。發展溫和的期望，能夠管理貪婪。如果在市場開盤前，先在損益試算表上借記期望虧損，挺身面對虧損，就是在管理虧損的恐懼上邁出一大步。此外，交易是充滿痛苦的世界，即使是頂尖交易人，痛苦也避無可避。我在本章分享我個人如何緩解本身的交易痛苦。能夠接受最大逆境的存在，就能做好痛苦管理。


    我個人會將交易心理障礙管理要點彙整如下，印出來放在電腦螢幕上方。或許你也可以如法炮製。


    ## · 管理「貪婪」


    交易目標沒有對或錯，而是以溫和的期望，管理風險資本。


    ## · 管理「恐懼」


    我預期今天執行交易會發生虧損，而且是經歷歷年來虧損最長和賠償最糟的一連串交易。在我下委託單之前，我會將期望虧損借記在損益試算表上。我會正面看待所發生的虧損，因為我想要成為最優秀的輸家和長期的贏家。


    ## · 管理「希望」


    即使我今天賠錢，我也會有個美好的一天，因為我已經遵循交易計畫，而它有長期的正期望值。


    ## · 管理「痛苦」


    身為交易人，我知道我生活在一個痛苦世界。當我賠錢，心會痛。當我賺錢，想到錯失的機會，心會痛。當我不在市場之中，我會因為相信自己錯失了下一波的大走勢而心痛。當我費心研究新觀念之後，才發現它們沒有用，心會痛。我知道最大逆境會使我的交易經驗充滿失望和痛苦。我知道它意圖減低我的風險資本，阻止我交易。我知道最大逆境存在，也曉得它的能耐。我會忍受它帶來的痛苦。我會不屈不撓。我會成功。


