    # 管理「希望」


    當你發現自己希望一筆交易賺錢，這就是希望的情緒。我敢說，你希望交易有好成果的時候，十之八九是你賠錢的時候。「希望」是在一筆交易停損出場前最後的感覺，而且通常在市場距離停損點只有幾檔之處時放大！你希望賺錢，因為你厭倦賠錢，因為如果再賠，帳戶就會受傷。


