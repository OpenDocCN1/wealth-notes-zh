    SP500和美國30年期公債期貨。李仍然以具有型態辨識功能的波動性突破系統執行交易，但現在結合帶有動量的策略。不過，在這三個成分中，李比較依'
  - '[PAGE 359]


    賴型態辨識。李使用 Genesis 軟體於研究發展和委託單的產生。

    雖然他的模式屬於系統型，卻是在自由裁量的基礎上交易它們，

    根據他對市場狀況的解讀，選擇要交易那些訊號。


    交易螢幕外，李喜懈健身和打高爾夫，以鬆懈身心。給家人的一點小困擾是：李凡事喜歡往正面看，不管情況有多淒慘。李說：「我仍然寧可笑而不哭。此外，沒有人能活著離開世界，為什麼不好好享樂？」李和他的家人住在美國亞利桑那州。現在就來聽聽李的一段忠告是什麼。


    我認為一個好交易人也必須是個悲觀主義者，至少在每一筆交易上應該如此。太過正面的思維會變成一廂情願，這對交易人不是好事。我個人專注於風險，我相信這也是每位交易人必須專注的事。

    我是個非常正面的人。我投入市場交易，是為了賺錢，我敢說，幾乎每一位交易人也都是。交易是為了賠錢，豈不非常不合理？我期待隨著時間的流逝而賺錢，而且我對長期的成果非常樂觀。交易時企圖賺錢是必然的。我們都知道……我全部的注意焦點都放在我能夠賠多少上面。為什麼？因為相信自己能夠控制交易其他任何層面的人，都只是自欺欺人。

    我們都花了無數個小時，研究和分析價格走勢圖，企圖找到應該買進什麼市場，應該賣出什麼市場。但是在你做完所有的分析，也進入市場實際交易之後，對於利潤，你能做任何事情嗎？你會期待市場往對你有利的方向走。你會用自己選擇的語言大喊和詛咒，你會質疑市場是否善盡保護之責，好像市場是個活人。你甚至經常祈禱。但是你絕對無法讓市場往對你有利的方向發展，即使是有利一點點都不可能。你只'
  - '[PAGE 360]


    能希望你做對了研究，選到合適的方向，但即使如此，你必須接受你是在和機率打交道，並不是在做絕對有把握的事。即使你做對了每一件事，你還是會出差錯，而且有時必須認賠。一旦你花錢投入交易，能賺多少錢，完全在控制之外。另一方面，我們在控制自己賠多少方面，確實擁有有一點點能力。執行交易有執行成本、滑價、隔夜跳空，甚至可能有飛機撞進大樓造成的虧損大於我們的預期，但是論理，我們確實有能力控制虧損的多寡。不管你決定限制自己承受多少風險總量，絕大部分的時間內，你都能遵循不悖，由於風險是你真正能夠控制的唯一交易層面，所以在我看來，風險是優良的交易人應該注重的ж事情。這樣才合理。我是這麼做的。我也建議你這麼做。我希望機率對我有利，也希望風險能夠量化和可控制。少了任何一個因素，我寧可不要交易。


    李·葛提斯


    如何？一位成功的交易人不談賺取利潤，而是請你專注於風險，成為每一筆交易的悲觀者，專注於你能賠掉多少錢、專注於你能控制的事情；不要念玆在玆於市場的贈與，而是要注意市場的詛咒、風險。交易要可長可久，首重管理每一筆個別交易的風險。忽視風險，交易生涯會很短暫。


    李的聯絡網站：www.leegettess.com。


    # 戴若·顧比


    戴若·顧比（Daryl Guppy）很可能是中國金融市場最知名的'
  - '[PAGE 361]


    白種人之一。以中國人口之龐大，他因此可能是世界上最為人熟知的交易人之一。戴若出名有幾個原因。第一，戴若在中國廣為人知且深受歡迎，因為他寫的許多交易書籍被翻譯成中文，他經常在
    CNBC 亞洲臺（CNBC Asia）的財經論談（Squawk Box）發表走勢圖分析；第二，中國人喜歡交易；最後，戴若努力學習中文。澳大利亞不只有個會說中文的首相陸克文（Kevin
    Rudd），也有個會說中文的交易人顧比！戴若留一撮鬍子，這個標誌在中國很容易認出，而且亞洲交易人稱他為圖形人。


    雖然戴若確實有許多交易書籍印行，使得他成為當今世界上最知名的交易人教育者之一，但他不認為自己只是個教育者。戴若首先視自己為交易人，發表著作只是供他抒發對寫作的熱愛。如果
    identification  you have 幸讀到他的私人日記，你會了解他樂在這門技藝。此外，戴若下筆如行雲流水，看起來不可能而奇特的事情，在他筆下都變得可能，而且條理分明，頭頭是道，這對有志交易的讀者是一大福音。


    但是，戴若也有沒沒無聞的時候。1989年，他開始根據巴菲特的價值哲學投資股票，只買認識而了解的公司。但他不喜歡財務命運受到公司擺布的感覺，於是轉而發展交易觀念，藉此收回對財務命運的控制權。戴若每天都會做一張觀察名單，列出展現多重系統交易機會的股票。接著加上自由裁量選擇標準，以確定觀察名單上的哪些股票可以移動到他的交易清單上。他的格局主要圍繞著高機率的走勢圖型態。戴若偏好的時間架構，是使用
    Computrac 畫圖軟體所呈現的日長條圖。成功沒有立即來到，但是到了 1993年，戴若滿懷信心走入全時交易，且大獲成功。


    戴若成功的消息很快就傳了開來，人們開始請他協助。這方面的興趣，導致戴若寫出他的第一本交易書籍《股票交'
  - '[PAGE 362]


    易》( Share Trading )。這本書兩個星期內就賣光。這本經典之作出版距今十四年，已經十二刷！戴若結合了他熱愛的兩件事，也就是交易和寫作，人生可謂到了涅槃之境。在那之後，戴若總共出版了十五本交易書籍，包括翻譯的版本，其中一些更為中國市場而改寫。


    今天，戴若繼續像當年開始享有成功那樣交易——結合多重系統交易機會的自由裁量選擇標準。他積極交易股票和相關的衍生性商品市場，包括差價合約、認購權證、指數股票型證券投資信託基金（ETFs），以及澳大利亞、新加坡和香港市場的指數。此外，他密切監控中國市場，因為中國在世界市場上的影響力與日俱增。他繼續主要專注於高機率的走勢圖型態，有時做短線交易時，會讀報價行情。戴若十分相信要讓市場的狀況指引他喜愛的交易時間架構。情況許可時，他可以輕而易舉下短則五分鐘、長則兩三個星期的交易。他讓市場告訴他最佳的時間架構是多長。為了協助他找到機會，戴若使用一套畫圖軟體，包括Guppy
    Traders Essentials、Metastock、NextView Adviser，以及為中國市場使用的Gousen。


    戴若對交易的貢獻不限於出書。這麼多年來，他發展出幾個領先技術指標，包括在MetaStock、OmniTrader、Guppy Traders Essentials，以及其它的畫圖程式之中。他發展出非常成功的交易人教育和訓練業務，辦公室設在達爾文、新加坡和北京。戴若為澳大利亞、新加坡和馬來西亞市場製作非常受歡迎的教育新聞信。他經常貢獻文章和專欄給越來越多的中國財經出版品。他在亞太地區、中國、歐洲和北美，是炙手可熱的演說者。


    戴若在交易或教育之餘，通常在世界某個地方，用筆記型電腦，把想法錄製在磁碟上。雖然他喜歡寫作，但寫作相當耗費時'
  - '[PAGE 363]


    問與精神，他太太寧可他多做點家事！

    我不太願意說戴若和他家人住在澳大利亞達爾文，即使他們確實如此。這是因為我每次和戴若聯絡，他不是在北京、上海、新加坡、吉隆坡，就是在其他某個地方，絕對不會在家裡！現在，趁著戴若在交易、趕飛機、寫作的空檔，我們來請教他的交易建議。


    這似乎是個簡單的問題，但答起來很難。要在市場上成功，需要許多不同的技能。我記得我讀過的所有那些書，以及在市場上交易的許多年頭。2009年的市場行為，和我在1999年，或者1989年在市場上交易時，非常不一樣。但是，一定有一些共同的特色沒改變。

    我剛開始交易時，是向其他的高手交易人研究和學習。接下來，隨著我的技能與日俱長，我發展出自己的想法和自己的方法。我在自己寫的書中分享這些，讓別人也能學習。接著我變得太過自信，而市場提醒我，我的技能永遠需要更新，才能在不斷發展中的市場存活。我給新進交易人ss和有經驗的交易人的一段忠告，就只兩個字：謙卑。

    謙卑意味著你了解和承認市場中的其他人懂得遠比你多。他們了解某家公司業務上發生了什麼事。有些人了解經濟中、政府裡面發生了什麼事。有些人的分析技能比你好很多，或者掌握的資訊比你好很多。你個人不可能發展出這些知識。你不可能比市場或市場中的人聰明。

    謙卑意味著你讚賞他們的知識，而且學習遵循他們在市場中做成的結論。他們所有的資訊和分析技能，都顯示在價格活動的走勢圖中。每天，聰明人會在市場中買進和賣出。你'
  md: '

    個以價格為基礎的客觀型態之後三十年，今天市場上還是看得到它。這是這兩位年輕交易人所做真正開創性的貢獻。如你所知，其中之一是湯姆，另一位年輕交易人是拉里。湯姆與拉里1973年的相遇，激勵他把全部的時間投入交易，接下來締造了一連串輝煌的履歷。


    湯姆身為市場時機交易者，成了逆勢交易人。他所執行的交易，有95%專注於衡量價格耗竭、預判市場頭部和底部，或者單純的反轉會出現。看得出來，湯姆對市場的看法不一樣。大部份人努力順勢交易，湯姆卻設法預判趨勢結束，湯姆是反趨勢先生。湯姆嚴厲批評一般的技術面分析，相信它太過主觀，所以行不通。雖然湯姆同意他的研究可以被視為技術面分析的一部分，卻不認同自己是技術面分析師，而是如同你知道的，他自認是市場時機交易人。


    湯姆相信基本面會驅動比較長期的市場波動，但在比較短期的基礎上，他相信你必須抓準進場和出場時機。而且湯姆相信你能以心理面和市場時機交易工具做到這件事。


    湯姆相信簡單、非優化和客觀的機械系統，而且相信它們應該會跨越所有的市場和所有的時間架構，一體適用，也適用於所有的多頭市場和空頭市場狀況。他不認為市場會隨著時間而變動，因為市場只反映人性——恐懼和貪婪，而這永遠不會變。舉例來說，湯姆和拉里合創的TD連續指標1970年代首先應用於貨幣、債券和國庫券期貨，此後大體上沒有變動，而且儘管市場出現所謂的變動，卻繼續適用於所有的市場和所有的時間架構。湯姆說，要說服他相信市場變了，得花很大的工夫。


    湯姆製作了許多市場時機模態和指標。他的市場時機工具，也就是湯姆·狄馬克「TD」指標，主要是以型態為基礎。他的指標和從價格衍生出來的大部分指標不同。湯姆的指標百分之百反映客觀的價格型態。他們捕捉它的特別型態，而且做為一種指標，他們很容易在螢幕上看到。他的許多指標今天出現在可以使用的大型專業資料服務平臺上，如彭博、湯姆森（Thomson）、CQG和DeMark
    PRIME。湯姆的指標現在有超過三萬五千名彭博交易人使用！湯姆是重量級人物。湯姆相信簡單的系統。


    如你所知，在我讀過關於市場最好的觀察心得，湯姆是其中一則的主人翁。以下這段話，摘錄自亞特·柯林斯《贏得市場》一書。


    我在都德的時候，為保羅·鍾斯製作了四或五套系統。後來為了製作它們，他們引進一些人做出優化模式、人工智慧，也就是利用高階數學，做出可能辦得到的一切東西。歸根究底，在十七名程式設計師和四、五年的測試之後，基本的四、五個系統運作得最好。


    湯姆是為鍾斯製作那基本的四、五個系統背後的人物。湯姆發展出的簡單機械策略，十七名程式設計師在四、五年內都無法擊敗，即使他們有鍾斯的資源在背後支撐他們。


    除了顧問諮詢業務，湯姆繼續使用他個人以價格為基礎的指標，操作自己的資金。湯姆利用CQG和彭博，偏愛的時間架構是盤中和每日長條。他交易股票和期貨。


    湯姆寫了三本書：《技術面分析新科學》(The New Science of Technical Analysis)、《新市場時機交易技術》(New Market
    Timing Techniques)和《狄馬克談當日沖銷交易選擇權》(DeMark on Day Trading Options)。除了交易，湯姆不是沉浸在研究市場的時機交易中，就是看球賽，特別是籃球。湯姆和許多成功且努力不懈的人一樣，工作十分賣力，極其專注和沉迷於全球市場，而令家人感到不悅。湯姆和家人住在美國西岸。現在就來聽聽湯姆的交易建議。


    大多數新進交易人都在顯而易見的誤解底下操作，認為應該遵循市場的意見，以及大多數交易人的一致看法，認為這才是交易成功之路。這樣的信念比較有可能來自人們和其他人交際應酬所習慣的方式。具體地說，在生活中，和別人取得妥協及與他人站在同一邊，是阻力最小的路，但將類似的方法用在交易上，則往往會買到一張交易災難的門票。交易人間長期以來相信，「市場趨勢是交易人的朋友。」我要加上一句話：「……除非趨勢即將結束。」許多年前我所做的廣泛供需分析研究，證明市場底部的形成，不是因為聰明的買家在他們所認低點進場，相反的，低點會出現，用比喻的方式來說，是最後一位賣家賣出的結果。事實上，當過早進場的買盤確實發生在市場的跌勢中，那往往是因為空頭回補的關係，而一旦買盤消逝，跌勢會因為過早買進的行為造成價格真空，而使跌勢恢復得更快。相反的，市場頭部會形成，不是因為精明且消息靈通的賣家造成的，而是因為以比喻的方式來說，最後一位買家已經買進。以上這些觀察，已經證明對我的整個投資生涯所做的那種交易具有助益。具體而言，對管理龐大基金的交易人來說，當務之急是研判市場高點會出現，而開始賣出，不是在高點出現且價格開始下跌才賣。價格疲軟時也要比較謹慎地買進，而不是在低點出現之後才買。這可以防止以滑價和跳空交易，而且不會像大部分順勢交易人那樣，被迫以賣價（offer）買進，以及以買價（bid）賣出。


    換句話說，在這些趨勢耗竭和價格反轉點操作，比只是遵循市場的趨勢和交易人的心理面，可以得到更多的報酬。


    下單交易時，和普遍持有的市場期望反向操作很難，但是反向操作提供優勢，以及賺取交易利潤的機會，而順勢交易人無法得到這些利潤，尤其是如果交易人運用已經證明可行、特別用於預判可能的市場趨勢耗竭水準的交易工具。


    在市場上賣出，而不是買進時，反趨勢方法已經證明有更高的報酬。買進是個累積程序。我的意思是說，一個人可能在市場中建立起起始部位，一旦市場上揚，便加碼操作。在此同時，一個人會比較傾向於尋找正面的發展和建議，一旦他們找到，可能會融資買進，將部位做得更大。最後，不管一個人有多迷戀市場，買進的潛力都會耗竭。但是，一旦交易人對市場持負面看法，通常會將整個部位賣出。


    這是市場下跌通常比上漲快三倍的原因。交易人可以對部位有不同的的偏好程度，並在價格上漲時分批買進，但一旦如夢初醒，就會將所有賣出。


    湯姆·狄馬克


    如何？湯姆認為，順勢交易可能不像你想的那麼友善，尤其是在趨勢即將結束時！湯姆和你分享他對市場頭部和底部的重

    要觀察。和大部分人所想恰好相反，頭部不是由聰明的賣家造成的，而是因為缺少買氣形成的。底部不是聰明的買家造成的，而

    是因為賣家耗竭形成的。湯姆因為了解這一點，成為今天的市場時機交易大師。


    湯姆給你的忠告是質疑目前的想法，以及避開群眾。避開絕大多數人正在做的事。避開數字給人的安全感。找到趨勢耗竭與價格反轉點，並進場交易。研究調查逆勢或短線波段交易。這麼做，他和他的客戶賺了很多錢，你也辦得到。而且，從湯姆的經驗，逆勢或反趨勢交易在市場頭部的報酬高於在市場底部，因為市場的跌勢比它們的漲勢快三倍。


    在鼓吹順勢交易的技術面分析世界中，湯姆鶴立雞群。他像個什麼都不怕的反叛者，獨自一人站在技術面分析高速公路的正中央，毫無畏懼或者偏愛地面對傳統和絕大多數人的觀點！他能做這件事，是因為他顯然做得非常成功。湯姆極為少見且強而有力的忠告是離開群眾看法給人的舒適區，並且研究調查如何預判市場頭部和底部即將形成的策略。這是強而有力的忠告，理由有二。第一，他和絕大多數人的想法相反，因此使他產生爭議。這是非常大膽的突出觀點。第二，這是柯恩、鍾斯和索羅斯之類的投資和交易重量級人物花錢請湯姆做的事——找出市場反轉之前，進場和出場的正確時間與價格，而且用機構的規模去做。湯姆的建議是專注於逆勢或短線波段交易方法。但願你聽了進去；我曉得我有。


    你可以透過網站和湯姆聯絡，以了解他對於交易和市場的更多想法：www.demark.com；www.marketstudies.net。


    ## 李·葛提斯


    李·葛提斯（Lee Gettess）是世界一流的機械系統設計者和交易人。值得注目的是，李發展出一套經得起時間考驗的機械型交易策略，在首次設計之後二十一年仍然繼續運作。能夠這麼說的成功交易人並不多。在系統發展的競技場上，李當然有資格吹噓自己是系統大師！但如果你認識李，那麼你會知道他為人十分謙遜，不是喜歡自吹自擂的人。自豪？有。自大？沒有。


    李成功做到這件事是1988年的事，當時他發展出Volpat交易策略。除了它繼續獲利之外，本書撰稿時，監控超過五百個交易系統的獨立出版品《期貨真相》(Futures
    Truth)更評選李的Volpat策略為前十大系統。而且它不只名列最近十二個月的「前十大」，更排名第三位！二十一年前發展的策略在超過五百套交易策略中名列第三，這成就真是叫人刮目相看。


    且讓我解釋一下李的成就。他根據自己的市場行為理論，發展出以準則為基礎的客觀交易策略。遵循他的策略去交易的任何人，過去二十一年都有獲利，所賺足以彌補不可避免的虧損仍有餘，並且留下許多利潤。當然，有些年頭會有虧損。但是，它能即時顯現穩定逐步上升的淨值曲線。備受推崇的交易理論（更別說是交易策略）能夠聲稱獲得相同成功水準的並不多。


    能發展出如此持久的交易策略、成就和李相提並論的交易人少之又少。理查·唐契安1960年代發展出他的四週（20根長條）通路突破系統，在理查·丹尼斯和比爾·艾克哈特1980年代的海龜實驗之後，取得「名家」身分。1980年代中期，也有根據約翰·波林傑（John
    Bollinger）的波林傑波帶（Bollinger Bands）發展出來的另一套順勢交易系統。那套策略直到今天繼續獲利。市面上還有其他持久的策略，但是禁得起超過二十一年時間考驗的，有如鳳毛麟角。


    李並非一直都是交易人。他剛踏入職場時，在通用汽車公司（General Motors）拖地板，之後轉型寫電腦程式。1985年，他接到一通經紀商的電話，說可以輕鬆賺錢，於是對交易產生興趣。但後來李的帳戶發生巨額虧損，於是他盡其所能研究技術面分析的每一件事，並利用他的電腦背景，開始評估各種市場假設，測試各種觀念。那時他並不像今天的交易人那樣，有先進的交易軟體可用，只能自己在最早的一種個人電腦，也就是88XT電腦上，以GWBASIC寫自己的程式！儘管缺少Pentium晶片，李還是成功發展出以型態為基礎的波動性突破策略，而這套贏家策略，也給了李第一個優勢。


    李的交易表現出色，1987年，就在10月的股市崩盤前不久，他決定把全部的時間投入交易。時間真是選得再壞不過了！雖然在市場崩盤那一天，他賠了錢，幸好賠得不多，而且相對毫髮無損活了下來。事後回顧，李承認這其實對他是個好經驗，「當S&P崩跌，我見到我的一生在眼前閃過。事後來看，這對我是件非常好的事，因為在那之前，我一直以為交易很容易。這次當頭棒喝，迫使我真正用心去學習如何交易」。


    1988年，李發展出他的Volpat策略，後來在1993年以超過67.5萬美元，賣給一群專業交易人，其中包括兩個大型公共基金，以及北美最大的銀行之一。


    到目前為止，李全時交易超過二十五年。他經營一個成功的諮詢顧問服務事業，親自交易他所推薦的每一個訊號。許多專業交易人使用李的諮詢顧問服務，以分散他們本身的交易風險。今天，他仍然專注於短線。李會做當日沖銷交易和執行短線交易，持有部位二到四天。他繼續交易E-Mini
    SP500和美國30年期公債期貨。李仍然以具有型態辨識功能的波動性突破系統執行交易，但現在結合帶有動量的策略。不過，在這三個成分中，李比較依賴型態辨識。李使用
    Genesis 軟體於研究發展和委託單的產生。雖然他的模式屬於系統型，卻是在自由裁量的基礎上交易它們，根據他對市場狀況的解讀，選擇要交易那些訊號。


    交易螢幕外，李喜愛健身和打高爾夫，以鬆懈身心。給家人的一點小困擾是：李凡事喜歡往正面看，不管情況有多淒慘。李說：「我仍然寧可笑而不哭。此外，沒有人能活著離開世界，為什麼不好好享樂？」李和他的家人住在美國亞利桑那州。現在就來聽聽李的一段忠告是什麼。


    我認為一個好交易人也必須是個悲觀主義者，至少在每一筆交易上應該如此。太過正面的思維會變成一廂情願，這對交易人不是好事。我個人專注於風險，我相信這也是每位交易人必須專注的事。我是個非常正面的人。我投入市場交易，是為了賺錢，我敢說，幾乎每一位交易人也都是。交易是為了賠錢，豈不非常不合理？我期待隨著時間的流逝而賺錢，而且我對長期的成果非常樂觀。交易時企圖賺錢是必然的。我們都知道……我全部的注意焦點都放在我能夠賠多少上面。為什麼？因為相信自己能夠控制交易其他任何層面的人，都只是自欺欺人。我們都花了無數個小時，研究和分析價格走勢圖，企圖找到應該買進什麼市場，應該賣出什麼市場。但是在你做完所有的分析，也進入市場實際交易之後，對於利潤，你能做任何事情嗎？你會期待市場往對你有利的方向走。你會用自己選擇的語言大喊和詛咒，你會質疑市場是否善盡保護之責，好像市場是個活人。你甚至經常祈禱。但是你絕對無法讓市場往對你有利的方向發展，即使是有利一點點都不可能。你只能希望你做對了研究，選到合適的方向，但即使如此，你必須接受你是在和機率打交道，並不是在做絕對有把握的事。即使你做對了每一件事，你還是會出差錯，而且有時必須認賠。一旦你花錢投入交易，能賺多少錢，完全在控制之外。另一方面，我們在控制自己賠多少方面，確實擁有一點點能力。執行交易有執行成本、滑價、隔夜跳空，甚至可能有飛機撞進大樓造成的虧損大於我們的預期，但是論理，我們確實有能力控制虧損的多寡。不管你決定限制自己承受多少風險總量，絕大部分的時間內，你都能遵循不悖，由於風險是你真正能夠控制的唯一交易層面，所以在我看來，風險是優良的交易人應該注重的事情。這樣才合理。我是這麼做的。我也建議你這麼做。我希望機率對我有利，也希望風險能夠量化和可控制。少了任何一個因素，我寧可不要交易。


    李·葛提斯


    如何？一位成功的交易人不談賺取利潤，而是請你專注於風險，成為每一筆交易的悲觀者，專注於你能賠掉多少錢、專注於你能控制的事情；不要念茲在茲於市場的贈與，而是要注意市場的詛咒、風險。交易要可長可久，首重管理每一筆個別交易的風險。忽視風險，交易生涯會很短暫。


    李的聯絡網站：www.leegettess.com。


    ## 戴若·顧比


    戴若·顧比（Daryl Guppy）很可能是中國金融市場最知名的白種人之一。以中國人口之龐大，他因此可能是世界上最為人熟知的交易人之一。戴若出名有幾個原因。第一，戴若在中國廣為人知且深受歡迎，因為他寫的許多交易書籍被翻譯成中文，他經常在
    CNBC 亞洲臺（CNBC Asia）的財經論談（Squawk Box）發表走勢圖分析；第二，中國人喜歡交易；最後，戴若努力學習中文。澳大利亞不只有個會說中文的首相陸克文（Kevin
    Rudd），也有個會說中文的交易人顧比！戴若留一撮鬍子，這個標誌在中國很容易認出，而且亞洲交易人稱他為圖形人。


    雖然戴若確實有許多交易書籍印行，使得他成為當今世界上最知名的交易人教育者之一，但他不認為自己只是個教育者。戴若首先視自己為交易人，發表著作只是供他抒發對寫作的熱愛。如果讀到他的私人日記，你會了解他樂在這門技藝。此外，戴若下筆如行雲流水，看起來不可能而奇特的事情，在他筆下都變得可能，而且條理分明，頭頭是道，這對有志交易的讀者是一大福音。


    但是，戴若也有沒沒無聞的時候。1989年，他開始根據巴菲特的價值哲學投資股票，只買認識而了解的公司。但他不喜歡財務命運受到公司擺布的感覺，於是轉而發展交易觀念，藉此收回對財務命運的控制權。戴若每天都會做一張觀察名單，列出展現多重系統交易機會的股票。接著加上自由裁量選擇標準，以確定觀察名單上的哪些股票可以移動到他的交易清單上。他的格局主要圍繞著高機率的走勢圖型態。戴若偏好的時間架構，是使用
    Computrac 畫圖軟體所呈現的日長條圖。成功沒有立即來到，但是到了 1993年，戴若滿懷信心走入全時交易，且大獲成功。


    戴若成功的消息很快就傳了開來，人們開始請他協助。這方面的興趣，導致戴若寫出他的第一本交易書籍《股票交易》( Share Trading )。這本書兩個星期內就賣光。這本經典之作出版距今十四年，已經十二刷！戴若結合了他熱愛的兩件事，也就是交易和寫作，人生可謂到了涅槃之境。在那之後，戴若總共出版了十五本交易書籍，包括翻譯的版本，其中一些更為中國市場而改寫。


    今天，戴若繼續像當年開始享有成功那樣交易——結合多重系統交易機會的自由裁量選擇標準。他積極交易股票和相關的衍生性商品市場，包括差價合約、認購權證、指數股票型證券投資信託基金（ETFs），以及澳大利亞、新加坡和香港市場的指數。此外，他密切監控中國市場，因為中國在世界市場上的影響力與日俱增。他繼續主要專注於高機率的走勢圖型態，有時做短線交易時，會讀報價行情。戴若十分相信要讓市場的狀況指引他喜愛的交易時間架構。情況許可時，他可以輕而易舉下短則五分鐘、長則兩三個星期的交易。他讓市場告訴他最佳的時間架構是多長。為了協助他找到機會，戴若使用一套畫圖軟體，包括Guppy
    Traders Essentials、Metastock、NextView Adviser，以及為中國市場使用的Gousen。


    戴若對交易的貢獻不限於出書。這麼多年來，他發展出幾個領先技術指標，包括在MetaStock、OmniTrader、Guppy Traders Essentials，以及其它的畫圖程式之中。他發展出非常成功的交易人教育和訓練業務，辦公室設在達爾文、新加坡和北京。戴若為澳大利亞、新加坡和馬來西亞市場製作非常受歡迎的教育新聞信。他經常貢獻文章和專欄給越來越多的中國財經出版品。他在亞太地區、中國、歐洲和北美，是炙手可熱的演說者。


    戴若在交易或教育之餘，通常在世界某個地方，用筆記型電腦，把想法錄製在磁碟上。雖然他喜歡寫作，但寫作相當耗費時間與精神，他太太寧可他多做點家事！


    我不太願意說戴若和他家人住在澳大利亞達爾文，即使他們確實如此。這是因為我每次和戴若聯絡，他不是在北京、上海、新加坡、吉隆坡，就是在其他某個地方，絕對不會在家裡！現在，趁著戴若在交易、趕飛機、寫作的空檔，我們來請教他的交易建議。


    這似乎是個簡單的問題，但答起來很難。要在市場上成功，需要許多不同的技能。我記得我讀過的所有那些書，以及在市場上交易的許多年頭。2009年的市場行為，和我在1999年，或者1989年在市場上交易時，非常不一樣。但是，一定有一些共同的特色沒改變。我剛開始交易時，是向其他的高手交易人研究和學習。接下來，隨著我的技能與日俱長，我發展出自己的想法和自己的方法。我在自己寫的書中分享這些，讓別人也能學習。接著我變得太過自信，而市場提醒我，我的技能永遠需要更新，才能在不斷發展中的市場存活。我給新進交易人和有經驗的交易人的一段忠告，就只兩個字：謙卑。謙卑意味著你了解和承認市場中的其他人懂得遠比你多。他們了解某家公司業務上發生了什麼事。有些人了解經濟中、政府裡面發生了什麼事。有些人的分析技能比你好很多，或者掌握的資訊比你好很多。你個人不可能發展出這些知識。你不可能比市場或市場中的人聰明。謙卑意味著你讚賞他們的知識，而且學習遵循他們在市場中做成的結論。他們所有的資訊和分析技能，都顯示在價格活動的走勢圖中。每天，聰明人會在市場中買進和賣出。你

    '
  mdcn: '

    個以價格為基礎的客觀型態之後三十年，今天市場上還是看得到它。這是這兩位年輕交易人所做真正開創性的貢獻。如你所知，其中之一是湯姆，另一位年輕交易人是拉里。湯姆與拉里1973年的相遇，激勵他把全部的時間投入交易，接下來締造了一連串輝煌的履歷。


    湯姆身為市場時機交易者，成了逆勢交易人。他所執行的交易，有95%專注於衡量價格耗竭、預判市場頭部和底部，或者單純的反轉會出現。看得出來，湯姆對市場的看法不一樣。大部份人努力順勢交易，湯姆卻設法預判趨勢結束，湯姆是反趨勢先生。湯姆嚴厲批評一般的技術面分析，相信它太過主觀，所以行不通。雖然湯姆同意他的研究可以被視為技術面分析的一部分，卻不認同自己是技術面分析師，而是如同你知道的，他自認是市場時機交易人。


    湯姆相信基本面會驅動比較長期的市場波動，但在比較短期的基礎上，他相信你必須抓準進場和出場時機。而且湯姆相信你能以心理面和市場時機交易工具做到這件事。


    湯姆相信簡單、非優化和客觀的機械系統，而且相信它們應該會跨越所有的市場和所有的時間架構，一體適用，也適用於所有的多頭市場和空頭市場狀況。他不認為市場會隨著時間而變動，因為市場只反映人性——恐懼和貪婪，而這永遠不會變。舉例來說，湯姆和拉里合創的TD連續指標1970年代首先應用於貨幣、債券和國庫券期貨，此後大體上沒有變動，而且儘管市場出現所謂的變動，卻繼續適用於所有的市場和所有的時間架構。湯姆說，要說服他相信市場變了，得花很大的工夫。


    湯姆製作了許多市場時機模態和指標。他的市場時機工具，也就是湯姆·狄馬克「TD」指標，主要是以型態為基礎。他的指標和從價格衍生出來的大部分指標不同。湯姆的指標百分之百反映客觀的價格型態。他們捕捉它的特別型態，而且做為一種指標，他們很容易在螢幕上看到。他的許多指標今天出現在可以使用的大型專業資料服務平臺上，如彭博、湯姆森（Thomson）、CQG和DeMark
    PRIME。湯姆的指標現在有超過三萬五千名彭博交易人使用！湯姆是重量級人物。湯姆相信簡單的系統。


    如你所知，在我讀過關於市場最好的觀察心得，湯姆是其中一則的主人翁。以下這段話，摘錄自亞特·柯林斯《贏得市場》一書。


    我在都德的時候，為保羅·鍾斯製作了四或五套系統。後來為了製作它們，他們引進一些人做出優化模式、人工智慧，也就是利用高階數學，做出可能辦得到的一切東西。歸根究底，在十七名程式設計師和四、五年的測試之後，基本的四、五個系統運作得最好。


    湯姆是為鍾斯製作那基本的四、五個系統背後的人物。湯姆發展出的簡單機械策略，十七名程式設計師在四、五年內都無法擊敗，即使他們有鍾斯的資源在背後支撐他們。


    除了顧問諮詢業務，湯姆繼續使用他個人以價格為基礎的指標，操作自己的資金。湯姆利用CQG和彭博，偏愛的時間架構是盤中和每日長條。他交易股票和期貨。


    湯姆寫了三本書：《技術面分析新科學》(The New Science of Technical Analysis)、《新市場時機交易技術》(New Market
    Timing Techniques)和《狄馬克談當日沖銷交易選擇權》(DeMark on Day Trading Options)。除了交易，湯姆不是沉浸在研究市場的時機交易中，就是看球賽，特別是籃球。湯姆和許多成功且努力不懈的人一樣，工作十分賣力，極其專注和沉迷於全球市場，而令家人感到不悅。湯姆和家人住在美國西岸。現在就來聽聽湯姆的交易建議。


    大多數新進交易人都在顯而易見的誤解底下操作，認為應該遵循市場的意見，以及大多數交易人的一致看法，認為這才是交易成功之路。這樣的信念比較有可能來自人們和其他人交際應酬所習慣的方式。具體地說，在生活中，和別人取得妥協及與他人站在同一邊，是阻力最小的路，但將類似的方法用在交易上，則往往會買到一張交易災難的門票。交易人間長期以來相信，「市場趨勢是交易人的朋友。」我要加上一句話：「……除非趨勢即將結束。」許多年前我所做的廣泛供需分析研究，證明市場底部的形成，不是因為聰明的買家在他們所認低點進場，相反的，低點會出現，用比喻的方式來說，是最後一位賣家賣出的結果。事實上，當過早進場的買盤確實發生在市場的跌勢中，那往往是因為空頭回補的關係，而一旦買盤消逝，跌勢會因為過早買進的行為造成價格真空，而使跌勢恢復得更快。相反的，市場頭部會形成，不是因為精明且消息靈通的賣家造成的，而是因為以比喻的方式來說，最後一位買家已經買進。以上這些觀察，已經證明對我的整個投資生涯所做的那種交易具有助益。具體而言，對管理龐大基金的交易人來說，當務之急是研判市場高點會出現，而開始賣出，不是在高點出現且價格開始下跌才賣。價格疲軟時也要比較謹慎地買進，而不是在低點出現之後才買。這可以防止以滑價和跳空交易，而且不會像大部分順勢交易人那樣，被迫以賣價（offer）買進，以及以買價（bid）賣出。


    換句話說，在這些趨勢耗竭和價格反轉點操作，比只是遵循市場的趨勢和交易人的心理面，可以得到更多的報酬。


    下單交易時，和普遍持有的市場期望反向操作很難，但是反向操作提供優勢，以及賺取交易利潤的機會，而順勢交易人無法得到這些利潤，尤其是如果交易人運用已經證明可行、特別用於預判可能的市場趨勢耗竭水準的交易工具。


    在市場上賣出，而不是買進時，反趨勢方法已經證明有更高的報酬。買進是個累積程序。我的意思是說，一個人可能在市場中建立起起始部位，一旦市場上揚，便加碼操作。在此同時，一個人會比較傾向於尋找正面的發展和建議，一旦他們找到，可能會融資買進，將部位做得更大。最後，不管一個人有多迷戀市場，買進的潛力都會耗竭。但是，一旦交易人對市場持負面看法，通常會將整個部位賣出。


    這是市場下跌通常比上漲快三倍的原因。交易人可以對部位有不同的的偏好程度，並在價格上漲時分批買進，但一旦如夢初醒，就會將所有賣出。


    湯姆·狄馬克


    如何？湯姆認為，順勢交易可能不像你想的那麼友善，尤其是在趨勢即將結束時！湯姆和你分享他對市場頭部和底部的重

    要觀察。和大部分人所想恰好相反，頭部不是由聰明的賣家造成的，而是因為缺少買氣形成的。底部不是聰明的買家造成的，而

    是因為賣家耗竭形成的。湯姆因為了解這一點，成為今天的市場時機交易大師。


    湯姆給你的忠告是質疑目前的想法，以及避開群眾。避開絕大多數人正在做的事。避開數字給人的安全感。找到趨勢耗竭與價格反轉點，並進場交易。研究調查逆勢或短線波段交易。這麼做，他和他的客戶賺了很多錢，你也辦得到。而且，從湯姆的經驗，逆勢或反趨勢交易在市場頭部的報酬高於在市場底部，因為市場的跌勢比它們的漲勢快三倍。


    在鼓吹順勢交易的技術面分析世界中，湯姆鶴立雞群。他像個什麼都不怕的反叛者，獨自一人站在技術面分析高速公路的正中央，毫無畏懼或者偏愛地面對傳統和絕大多數人的觀點！他能做這件事，是因為他顯然做得非常成功。湯姆極為少見且強而有力的忠告是離開群眾看法給人的舒適區，並且研究調查如何預判市場頭部和底部即將形成的策略。這是強而有力的忠告，理由有二。第一，他和絕大多數人的想法相反，因此使他產生爭議。這是非常大膽的突出觀點。第二，這是柯恩、鍾斯和索羅斯之類的投資和交易重量級人物花錢請湯姆做的事——找出市場反轉之前，進場和出場的正確時間與價格，而且用機構的規模去做。湯姆的建議是專注於逆勢或短線波段交易方法。但願你聽了進去；我曉得我有。


    你可以透過網站和湯姆聯絡，以了解他對於交易和市場的更多想法：www.demark.com；www.marketstudies.net。


    ## 李·葛提斯


    李·葛提斯（Lee Gettess）是世界一流的機械系統設計者和交易人。值得注目的是，李發展出一套經得起時間考驗的機械型交易策略，在首次設計之後二十一年仍然繼續運作。能夠這麼說的成功交易人並不多。在系統發展的競技場上，李當然有資格吹噓自己是系統大師！但如果你認識李，那麼你會知道他為人十分謙遜，不是喜歡自吹自擂的人。自豪？有。自大？沒有。


    李成功做到這件事是1988年的事，當時他發展出Volpat交易策略。除了它繼續獲利之外，本書撰稿時，監控超過五百個交易系統的獨立出版品《期貨真相》(Futures
    Truth)更評選李的Volpat策略為前十大系統。而且它不只名列最近十二個月的「前十大」，更排名第三位！二十一年前發展的策略在超過五百套交易策略中名列第三，這成就真是叫人刮目相看。


    且讓我解釋一下李的成就。他根據自己的市場行為理論，發展出以準則為基礎的客觀交易策略。遵循他的策略去交易的任何人，過去二十一年都有獲利，所賺足以彌補不可避免的虧損仍有餘，並且留下許多利潤。當然，有些年頭會有虧損。但是，它能即時顯現穩定逐步上升的淨值曲線。備受推崇的交易理論（更別說是交易策略）能夠聲稱獲得相同成功水準的並不多。


    能發展出如此持久的交易策略、成就和李相提並論的交易人少之又少。理查·唐契安1960年代發展出他的四週（20根長條）通路突破系統，在理查·丹尼斯和比爾·艾克哈特1980年代的海龜實驗之後，取得「名家」身分。1980年代中期，也有根據約翰·波林傑（John
    Bollinger）的波林傑波帶（Bollinger Bands）發展出來的另一套順勢交易系統。那套策略直到今天繼續獲利。市面上還有其他持久的策略，但是禁得起超過二十一年時間考驗的，有如鳳毛麟角。


    李並非一直都是交易人。他剛踏入職場時，在通用汽車公司（General Motors）拖地板，之後轉型寫電腦程式。1985年，他接到一通經紀商的電話，說可以輕鬆賺錢，於是對交易產生興趣。但後來李的帳戶發生巨額虧損，於是他盡其所能研究技術面分析的每一件事，並利用他的電腦背景，開始評估各種市場假設，測試各種觀念。那時他並不像今天的交易人那樣，有先進的交易軟體可用，只能自己在最早的一種個人電腦，也就是88XT電腦上，以GWBASIC寫自己的程式！儘管缺少Pentium晶片，李還是成功發展出以型態為基礎的波動性突破策略，而這套贏家策略，也給了李第一個優勢。


    李的交易表現出色，1987年，就在10月的股市崩盤前不久，他決定把全部的時間投入交易。時間真是選得再壞不過了！雖然在市場崩盤那一天，他賠了錢，幸好賠得不多，而且相對毫髮無損活了下來。事後回顧，李承認這其實對他是個好經驗，「當S&P崩跌，我見到我的一生在眼前閃過。事後來看，這對我是件非常好的事，因為在那之前，我一直以為交易很容易。這次當頭棒喝，迫使我真正用心去學習如何交易」。


    1988年，李發展出他的Volpat策略，後來在1993年以超過67.5萬美元，賣給一群專業交易人，其中包括兩個大型公共基金，以及北美最大的銀行之一。


    到目前為止，李全時交易超過二十五年。他經營一個成功的諮詢顧問服務事業，親自交易他所推薦的每一個訊號。許多專業交易人使用李的諮詢顧問服務，以分散他們本身的交易風險。今天，他仍然專注於短線。李會做當日沖銷交易和執行短線交易，持有部位二到四天。他繼續交易E-Mini
    SP500和美國30年期公債期貨。李仍然以具有型態辨識功能的波動性突破系統執行交易，但現在結合帶有動量的策略。不過，在這三個成分中，李比較依賴型態辨識。李使用
    Genesis 軟體於研究發展和委託單的產生。雖然他的模式屬於系統型，卻是在自由裁量的基礎上交易它們，根據他對市場狀況的解讀，選擇要交易那些訊號。


    交易螢幕外，李喜愛健身和打高爾夫，以鬆懈身心。給家人的一點小困擾是：李凡事喜歡往正面看，不管情況有多淒慘。李說：「我仍然寧可笑而不哭。此外，沒有人能活著離開世界，為什麼不好好享樂？」李和他的家人住在美國亞利桑那州。現在就來聽聽李的一段忠告是什麼。


    我認為一個好交易人也必須是個悲觀主義者，至少在每一筆交易上應該如此。太過正面的思維會變成一廂情願，這對交易人不是好事。我個人專注於風險，我相信這也是每位交易人必須專注的事。我是個非常正面的人。我投入市場交易，是為了賺錢，我敢說，幾乎每一位交易人也都是。交易是為了賠錢，豈不非常不合理？我期待隨著時間的流逝而賺錢，而且我對長期的成果非常樂觀。交易時企圖賺錢是必然的。我們都知道……我全部的注意焦點都放在我能夠賠多少上面。為什麼？因為相信自己能夠控制交易其他任何層面的人，都只是自欺欺人。我們都花了無數個小時，研究和分析價格走勢圖，企圖找到應該買進什麼市場，應該賣出什麼市場。但是在你做完所有的分析，也進入市場實際交易之後，對於利潤，你能做任何事情嗎？你會期待市場往對你有利的方向走。你會用自己選擇的語言大喊和詛咒，你會質疑市場是否善盡保護之責，好像市場是個活人。你甚至經常祈禱。但是你絕對無法讓市場往對你有利的方向發展，即使是有利一點點都不可能。你只能希望你做對了研究，選到合適的方向，但即使如此，你必須接受你是在和機率打交道，並不是在做絕對有把握的事。即使你做對了每一件事，你還是會出差錯，而且有時必須認賠。一旦你花錢投入交易，能賺多少錢，完全在控制之外。另一方面，我們在控制自己賠多少方面，確實擁有一點點能力。執行交易有執行成本、滑價、隔夜跳空，甚至可能有飛機撞進大樓造成的虧損大於我們的預期，但是論理，我們確實有能力控制虧損的多寡。不管你決定限制自己承受多少風險總量，絕大部分的時間內，你都能遵循不悖，由於風險是你真正能夠控制的唯一交易層面，所以在我看來，風險是優良的交易人應該注重的事情。這樣才合理。我是這麼做的。我也建議你這麼做。我希望機率對我有利，也希望風險能夠量化和可控制。少了任何一個因素，我寧可不要交易。


    李·葛提斯


    如何？一位成功的交易人不談賺取利潤，而是請你專注於風險，成為每一筆交易的悲觀者，專注於你能賠掉多少錢、專注於你能控制的事情；不要念茲在茲於市場的贈與，而是要注意市場的詛咒、風險。交易要可長可久，首重管理每一筆個別交易的風險。忽視風險，交易生涯會很短暫。


    李的聯絡網站：www.leegettess.com。


    ## 戴若·顧比


    戴若·顧比（Daryl Guppy）很可能是中國金融市場最知名的白種人之一。以中國人口之龐大，他因此可能是世界上最為人熟知的交易人之一。戴若出名有幾個原因。第一，戴若在中國廣為人知且深受歡迎，因為他寫的許多交易書籍被翻譯成中文，他經常在
    CNBC 亞洲臺（CNBC Asia）的財經論談（Squawk Box）發表走勢圖分析；第二，中國人喜歡交易；最後，戴若努力學習中文。澳大利亞不只有個會說中文的首相陸克文（Kevin
    Rudd），也有個會說中文的交易人顧比！戴若留一撮鬍子，這個標誌在中國很容易認出，而且亞洲交易人稱他為圖形人。


    雖然戴若確實有許多交易書籍印行，使得他成為當今世界上最知名的交易人教育者之一，但他不認為自己只是個教育者。戴若首先視自己為交易人，發表著作只是供他抒發對寫作的熱愛。如果讀到他的私人日記，你會了解他樂在這門技藝。此外，戴若下筆如行雲流水，看起來不可能而奇特的事情，在他筆下都變得可能，而且條理分明，頭頭是道，這對有志交易的讀者是一大福音。


    但是，戴若也有沒沒無聞的時候。1989年，他開始根據巴菲特的價值哲學投資股票，只買認識而了解的公司。但他不喜歡財務命運受到公司擺布的感覺，於是轉而發展交易觀念，藉此收回對財務命運的控制權。戴若每天都會做一張觀察名單，列出展現多重系統交易機會的股票。接著加上自由裁量選擇標準，以確定觀察名單上的哪些股票可以移動到他的交易清單上。他的格局主要圍繞著高機率的走勢圖型態。戴若偏好的時間架構，是使用
    Computrac 畫圖軟體所呈現的日長條圖。成功沒有立即來到，但是到了 1993年，戴若滿懷信心走入全時交易，且大獲成功。


    戴若成功的消息很快就傳了開來，人們開始請他協助。這方面的興趣，導致戴若寫出他的第一本交易書籍《股票交易》( Share Trading )。這本書兩個星期內就賣光。這本經典之作出版距今十四年，已經十二刷！戴若結合了他熱愛的兩件事，也就是交易和寫作，人生可謂到了涅槃之境。在那之後，戴若總共出版了十五本交易書籍，包括翻譯的版本，其中一些更為中國市場而改寫。


    今天，戴若繼續像當年開始享有成功那樣交易——結合多重系統交易機會的自由裁量選擇標準。他積極交易股票和相關的衍生性商品市場，包括差價合約、認購權證、指數股票型證券投資信託基金（ETFs），以及澳大利亞、新加坡和香港市場的指數。此外，他密切監控中國市場，因為中國在世界市場上的影響力與日俱增。他繼續主要專注於高機率的走勢圖型態，有時做短線交易時，會讀報價行情。戴若十分相信要讓市場的狀況指引他喜愛的交易時間架構。情況許可時，他可以輕而易舉下短則五分鐘、長則兩三個星期的交易。他讓市場告訴他最佳的時間架構是多長。為了協助他找到機會，戴若使用一套畫圖軟體，包括Guppy
    Traders Essentials、Metastock、NextView Adviser，以及為中國市場使用的Gousen。


    戴若對交易的貢獻不限於出書。這麼多年來，他發展出幾個領先技術指標，包括在MetaStock、OmniTrader、Guppy Traders Essentials，以及其它的畫圖程式之中。他發展出非常成功的交易人教育和訓練業務，辦公室設在達爾文、新加坡和北京。戴若為澳大利亞、新加坡和馬來西亞市場製作非常受歡迎的教育新聞信。他經常貢獻文章和專欄給越來越多的中國財經出版品。他在亞太地區、中國、歐洲和北美，是炙手可熱的演說者。


    戴若在交易或教育之餘，通常在世界某個地方，用筆記型電腦，把想法錄製在磁碟上。雖然他喜歡寫作，但寫作相當耗費時間與精神，他太太寧可他多做點家事！


    我不太願意說戴若和他家人住在澳大利亞達爾文，即使他們確實如此。這是因為我每次和戴若聯絡，他不是在北京、上海、新加坡、吉隆坡，就是在其他某個地方，絕對不會在家裡！現在，趁著戴若在交易、趕飛機、寫作的空檔，我們來請教他的交易建議。


    這似乎是個簡單的問題，但答起來很難。要在市場上成功，需要許多不同的技能。我記得我讀過的所有那些書，以及在市場上交易的許多年頭。2009年的市場行為，和我在1999年，或者1989年在市場上交易時，非常不一樣。但是，一定有一些共同的特色沒改變。我剛開始交易時，是向其他的高手交易人研究和學習。接下來，隨著我的技能與日俱長，我發展出自己的想法和自己的方法。我在自己寫的書中分享這些，讓別人也能學習。接著我變得太過自信，而市場提醒我，我的技能永遠需要更新，才能在不斷發展中的市場存活。我給新進交易人和有經驗的交易人的一段忠告，就只兩個字：謙卑。謙卑意味著你了解和承認市場中的其他人懂得遠比你多。他們了解某家公司業務上發生了什麼事。有些人了解經濟中、政府裡面發生了什麼事。有些人的分析技能比你好很多，或者掌握的資訊比你好很多。你個人不可能發展出這些知識。你不可能比市場或市場中的人聰明。謙卑意味著你讚賞他們的知識，而且學習遵循他們在市場中做成的結論。他們所有的資訊和分析技能，都顯示在價格活動的走勢圖中。每天，聰明人會在市場中買進和賣出。你

    '
