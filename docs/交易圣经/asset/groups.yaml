    # 以TEST驗證期望值


    驗證是指以TEST程序，驗證你的期望值。TEST是我所用「三十筆電子郵件交寄的模擬交易」(Thirty Emailed Simulated Trades)的英文首字母縮寫。以TEST驗證你的期望值，是啟蒙的最後一塊拼圖。


    設計好擁有良好期望值和機會的簡單方法之後，在投入真正的錢去交易前，最後一步是驗證期望值。要以正確的方法驗證期望值，唯一的做法是在模擬即時交易情況時，使用樣本外資料。樣本外資料是指沒有使用的資料。最佳樣本外資料是即時的「現場」資料。


    紙上模擬操作無法驗證期望值，因為它沒有納入獨立的觀察者。自行做紙上模擬操作是沒有意義的，因為它並沒有模擬到市場不能妥協的特質。市場不會允許你在中途改變或操弄你的交易準則。它不會在你承受某筆帳面損失時，允許你把那筆交易消除。紙上模擬操作不會像市場那樣，將你和你的心靈放在巨大的聚光燈底下。想像中的紙上模擬操作只是兒戲，沒有最後的裁判。


    要正確驗證期望值，唯一的方法是TEST。你需要在市場開盤之前，將三十筆模擬交易的完整委託單，用電子郵件寄給你的交易夥伴。交易夥伴必須把模擬委託單印出紙本，而且只能在接到寄來的委託單之後，於市場開盤之前，根據你的指示下單。你的交易夥伴將成為你的虛擬顧問，記錄你的交易成果。一旦三十'
