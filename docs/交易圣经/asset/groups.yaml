    我的負期望值不是起於和止於每一筆個別的交易。在格局出現的那一天，我會預期發生虧損，而且我也相信我就要開始承受最長一串連續虧損的交易。如果我上一筆交易發生虧損，我相信自己正處於發生最糟賠償期間。


