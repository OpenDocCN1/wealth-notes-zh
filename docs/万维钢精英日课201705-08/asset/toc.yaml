- - '##'
  - 特别放送 | 大脑的秘密
- - '###'
  - 1.人脑和计算机。人脑中有多个声音，我们每一个决策都是多个不同声音竞争的结果。人脑中有一个区域，叫做“额叶内区（medial frontal cortex）”，负责把所有这些声音协调汇集在一起，好做出一个最终决定。也就是说，人脑的决策过程就如同是一个民主大会，额叶内区就是会议的主持人。
- - '###'
  - 2.婴儿的大脑和中年的大脑：一个15个月大的婴儿学习事物因果关系的速度，会比年龄比她大的孩子更快——孩子的学习模式不是靠数据积累，而是靠对周围人和环境的探索和测试。换句话说，这叫“贝叶斯法”：观点要随着事实发生改变。
- - '###'
  - 3.集中思维、发散思维、短期工作记忆和长期工作记忆：一个外部信息进来，你立即在大脑中给这个信息定位，专注思考，快速处理，这就是集中思维。关键词：专注。集中思维的弊端是“Einstellung
    Effect”，也就是“定势效应”，就是当局者迷，我们会用头脑里现有的定势思考。而发散思维，就是跳出这个定势去思考。
- - '###'
  - 4.上瘾和满足：科学家发现了上瘾和满足感的机制：
- - '###'
  - 5.刻意和熟练：人脑中有两个区域负责认知控制。第一个区域叫“前扣带皮层（ACC）”，功能相当于是烟雾报警器，一直开着监控局面。ACC一旦发现异常情况，就会给第二个区域，叫做“侧前叶皮层（Lateral
    PFC）”报警。而这个 lateral PFC 的作用相当于是救火队，它更重要的功能是大脑中的决策系统，它会给大脑中各个部分下命令处理这个情况。
- - '###'
  - 6.眼前和长远：人脑考虑眼前享受的时候基本上是情感区在起作用；而在考虑未来的时候，我们就需要动用大脑的前额叶皮层（prefrontal cortex），进行理性计算。而一般来说，感性总是能胜过理性，我们很容易高估当下能获得的享受，而低估了未来需要付出的代价！
- - '###'
  - 7.天才和疯子：天才和疯子之间有一个共同点，叫做“认知抑制解除（cognitive disinhibition）”。生活中我们每时每刻会接触到大量信息，意味着你必须大量地忽略信息，这就是“认知抑制”。而“认知抑制解除”，则说有的人，能解除这个认知抑制的本能，专门注意到被一般人忽略掉的信息，从中发现一些东西。
- - '###'
  - 8.分块学习："分块（chunks）"，说白了就是学习套路。你把知识拆解成各种不同的“块”，通过各种重复训练，这些“块”就会以脑神经元连接的方式“长”在你的大脑之中。——这里我们说的“长”可不是比喻，而是切切实实地，你的大脑里出现了这么一个硬件组织。
- - '###'
  - 9.忘记和记忆：人的记忆其实有两个强度：存储强度（storage strength），和提取强度（retrieval strength）。存储强度不会随时间减弱。我们每时每刻都在接收大量的信息，而其中的绝大部分都被大脑自动忽略了，剩下来的只要进入记忆，就永远在那里了。下次再见到它，它在你大脑里的存储强度会增强，但是哪怕再也见不它了，它的存储强度也不会减弱。存储强度只增不减。
- - '###'
