  md: '# 问答：日本是怎么处理学术造假的？


    静谧小时候：我觉得韩春雨不一定是造假，分子生物学实验就是这样，存在一定几率性。前几年我们实验室的一个博士做出很好的实验结果，就把论文投到一个不错的杂志，当时杂志的审稿人提出其中某个实验对照不全，然后这个博士就准备增加对照，把这个实验再完善一下。可是谁知这个实验就再也重复不出来了，这个博士自己做了大半年也没有结果，后来实验室其他人也帮他做，但是没有一个能做出来，最后这个博士不得不延期毕业。前两年日本的小保方晴子也是一样。我不觉得他们故意造假，只是恰巧碰到了理想化的数据，就没有再重复，直接写文章投稿了。


    日本是怎么处理学术造假… ↓


    # 卓克


    有听众静谧小时候听了韩春雨事件的节目认为韩春雨不一定是造假，他就是做分子生物学研究的，他们实验室就有一个博士曾经做出过很好的结果，投到一个不错的杂志，审稿时发现有些缺陷需要补充一个对照组的数据，这个博士就按原来的方式想把对照组也加进来再做一次，但这回是怎么都做不出来了，同事一起帮忙也无济于事，最终弄得毕业延期。然后又提到前两年日本的小保方晴子也是一样，所以他的结论是这些人是碰巧遇到了理想化的数据，但没能力重复出来了。


    我觉得您说的这个有道理，尤其是在系统化的基础理论缺失的领域，一个个的技术性实验堆积起来的经验，那就是会有运气好，或者出了错也没发现的时候，也许就诞生了一个意想不到的好结果。而且现在科研氛围就是这样，很不得蹦出一个这样的新奇特结果赶紧发表。在这种环境中就涌现了大批机会主义者，那些秉承科学精神，反复验证的科学家就是吃亏，他们遇到的类似突破的东西如果反复验证就被自己否定了。那些机会主义者，只要有一次逮到了机会，在大杂志上发了一篇结果惊人的研究，就名利双收。所以这也给学术期刊提出更高的要求。这种情况在中国可能更突出，所以现在很多国外著名的学术期刊对中国作者是有歧视的，看到中国人名字就会更加警惕。


    这里我也补充下小保方晴子那个事件，她和韩春雨事件फल有點像，2014年1月29号在《Nature》上，同一天登了她两篇文章，这可算爆炸性好消息，她的成果简单来说就是发明出一个方法在弱酸环境下把小鼠的体细胞恢复到未分化阶段的干细胞，大家知道干细胞的应用前景非常好，但制备非常难，小保方晴子这种方法竟然这么高效，于是被高度重视，这种方法简称STAP。论文刊发过了20天，学术界的质疑也纷纷来了，首先就是对《Nature》里描述的实验，没法复现。还有一部分质疑是很多科学家研究她从前发过的论文，也发现有数据造假，图片PS的嫌疑。2月18号，她正式被她所在单位日本理化学研究所调查。论文刊发后35天，所akil单位回应了，公布小保方晴子更多实验细节，帮助大家复现这个结果。但是这个声明发布后质疑更猛，因为公布出来的实验步骤跟《Nature》上那篇论文的差异太大。论文刊发41天后被人们发现她的论文中有一幅图就是她几年前博士学位论文中的图，论文的结果根本没有实验对应。


    之后她所在单位展开进一步调查，在60天后宣布结果，小保方晴子在研究中捏造篡改数据，有学术不端行为。从事发到结束，60天时间，按说这已定性了。但是她本人不服，不承认是有意造假。6月份又有"人"深挖她的博士学位论文，发现那"里"也有造假嫌疑。那"时"候她原单位日本理化学研究所发育生物学中心自查后发声明，为了防止再次出现学术丑闻，该中心关闭。


    事情发生整5个月后《Nature》把两篇论文撤稿。小保方晴子的实验室导师向公众道歉后自杀。他遗书里写：自己被耻辱感淹没了。并且希望小保方晴子，如果你没有造假，请一定要在现STAP干细胞。事情发生后8个月后小保方晴子的母校早稻田大学撤销了她的博士学位。当时的博士生导师停职，其他和学位相关的老师罚，就早稻田大学校长也罚就。


    自己的导师因自己而自杀，小保方晴子拼死也要再搏一把，她向原单位提出给她一个自证清白的机会，她要在原单位的实验室复现这个实验，2014年12月18号，研究所邀请第三方学术界监督，同时也有N多摄像头监控的环境中，她开始了实验，但是最终也没有出现一个干细胞。这件事就这样终结了。


    我们不讨论小保方晴子本人是不是最初做实验就抱着主动欺骗的心态，我觉得更值得注意的是日本学术界对质疑造假的态度。没有听说发了两篇论文就开始发奖金，评职称，而是等结果，当发现却有问题后，结果处理非常迅速，60天后就已经出了调查结果。《Nature》撤稿，研究所除名，学位论文发现造假连博士学位也迅速取消，当年毕业时和颁发学位有关的人都追查，这里甚至有人还自杀了。就可想而知在那个环境中一旦造假被查出来后果有多严重，这种'
