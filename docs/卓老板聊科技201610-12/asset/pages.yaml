  md: '# 问答：科学是不是万能的？


    aaayin: 我倒是很想问一个与之相关的问题，包括卓老板在内的科学极客似乎认为科学是解决一切的知识，但是大量生活中的问题也許不是科学问题，比如世界观和价值观的问题，有时就是纯粹的哲学问题。而极客是不喜欢哲学的，因为哲学的知识不像科学那么可靠。那么，（暂时）不能用科学解决的问题，该怎样面对？卓老板怎么看？


    科学是不是万能的？


    # 卓克


    有听众问，包括卓老板在内的科学极客似乎认为科学是解决一切问题的知识，但大量生活中的问题也许不是科学问题，比如世界观和价值观的问题，有时就是纯粹的哲学问题，而极客是不喜欢哲学的，因为哲学知识不像科学那么可靠。不能用科学解决的问题，该怎样面对？想问问我的看法。


    这个问题是咱們上周讨论新闻、社交APP会不会导致思想退步中的一个留言，那期留言的质量出乎意料的好，好像触动了大家的神经，所以也出现了上面又一个引申的问题。首先你认为的，有一部分人认为科学是解决一切问题的知识，这代表了楚多人对科学的误解。咱們甚至都说过好几次了，科学不是具体的知识。什么是具体的知识？比如高中教科书里的内容就是具体知识。你上大学了，生物医学专业，那你的专业课的内容就是具体的知识，等读到博士了，接触的远不止是教科书了，你每天看得最多的是论文库，那也是具体知识。你看，从中学知识，到大学知识，再到这个领域最前沿的知识，不管多精尖，终究有一个范围，范围之外的就是科学无法解释的，照这个思路就能推出，科学不能解决一切。


    ![](img/72b394a82026978f467d7c86ddc01c35_76_0.png)


    用户留言


    荣誉之剑 3

    简单来说，哲学是研究主观的感受，研究的关系包括主观与客观、主观与主观。科学是研究客观的存在，研究的关系主要是客观与客观。因此，科学研究中力求避免的就是主观的参与。但是目前在前沿的脑神经科学和现代心理学（区别于佛洛依德心理学）的研究中，科学的思维和方法遇到了极大的挑战，这一领域要解决的往往是主观对客观的反应，我认为这将是科学要跨越的又一巅峰。

