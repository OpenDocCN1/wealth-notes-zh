    +   1. 汇合与对接是两个步骤，汇合是让两个舱体靠近，对接是让两个舱体连接，后者精度要求更高。因为登月需要的耗能极高，所以最终方案是服务舱和登月舱的组合，而不是单一飞船。\n2.
