    太空行走意外身亡怎么办？


    # 太空行走意外死亡怎么办？


    在美国阿波罗计计划末期，曾经有记者采访宇航员：如果你的同伴出舱行走时意外死亡，应该如何处理？标准回答是：把他的连接绳切断，让他的身体留在太空中。这不但是标准流程也是太空条件下唯一的选项，否则会造成更多宇航员死亡。


    # 苏联的第一次太空行走的意外


    +   1. 苏联宇航员列昂诺夫第一个完成了太空行走的任务，但是这件事在2005年才披露出来，给1965年的美国又一次打击，他们在太空行走上又一次落后了苏联。\n2.
    苏联太空行走前本来安排了一艘无人飞船搜集数据，但返航时失事，珍贵数据全部丢失。之后才冒险直接把宇航员发射上天，结果造成列昂诺夫险些丧命。\n3. 造成事故的原因是列昂诺夫的宇航服气压太高，自从出舱后就一直鼓胀，手臂无法弯曲，出舱后不久身体开始旋转，缆绳缠绕在身上，无法执行后续任务，只能回舱。\n4.
