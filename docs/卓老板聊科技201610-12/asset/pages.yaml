  md: '# 问答：飞出太阳系还怎么和地球保持联系？


    裴渡：请问飞行器飞出太阳系是怎样和地球保持联系的？


    飞出太阳系还怎么和地球… ↓


    卓克


    有听众裴渡问，飞行器飞出太阳系后是怎么和地球保持联络的。这是一个很专业也有意思的问题，直接回答是，利用电磁波。我们先把这个问题理解成宇宙空间飞行器如何跟地球保持联络吧，比如以比较先进的，刚刚发射不久的木星探测器朱雀来说，探测器身上有高增益天线，这个天线的发射功率大约就是20瓦左右，因为飞行器只能靠太阳能和核燃料，各个设备都要尽量设计得节能，天线也不会有多大功率。但是接收端，就是地球这边的天线颇厉害了，比如NASA用的是深空网络，这么一个射电望远镜阵列，它的发射功率是变化的，根据探测器的距离调整，最低也是20瓦左右，最高40万瓦。这个深空网络的工作频率在2GHz和7Ghz，因为在地面上，尺寸不受限制，最长的天线能有70多米，不但天线要打，而且频率也要尽量高，这样接受质量才好一些，还得要求有很好的信号放大器和纠错编码。


    比如从木星发到地球的信号，到达地球时信号已经发散到很大区域了，这个区域大到超过地球直径2倍了，所以一根70米长的天线上能收集到的能量极其微弱，这也导致传输数据速度很慢，比如1995年围绕木星旋转的伽利略号探测器，它向地球传输数据的速度大约是每秒0.1KB，要知道，在1998年时拨号上网的下载速度也能达到这个的40倍，飞出冥王星轨道的旅行者一号跟地球通讯的速度跟这个也差不多。


    这上面回答的是飞行器和地面的通讯，但如果加上条件，飞出太阳系后怎么和地球保持联络的化，结果是，失去联络。比如现在飞出去的探测器都是1977年造的，那个年代jpg图片格式都还没有，信号的加工处理，硬件运算速度也都落后得很，他们的任务就是越飞越远，远到失去联络。最初他们的电力保障用的是身上的太阳能发电设备，只要离太阳不远，就还有电力供应，但飞到天王星再远，太阳能板就没什么用了，这时候会启动他们内部携带的核裂变发电机制，可能您想不到，旅行者1号和2号的发电机设计寿命是到2020年用光，所以其实现在这两个失去联络的探测器还在利用微弱的功率向地球发射信号，只不过信号太弱，我们再也识别不出来了。如果您对这两个飞行器的故事感兴趣，推荐您看看BBC的纪录片，旅行者号：冲出太阳系。


