  md: '罗辑思维在去年提出了时间的朋友的说法，今年贯彻的就是给大家省时间。和很多媒体还在大批量制作低质量内容相比已经截然不同了，甚至那些让投资人看好过 的，让人发呆耗费时间的轻娱乐类内容都是不接纳的。这是
    我今年在做节目中收获的一点，咱们每期节目背后准备时间平均是30个小时，最终浓缩在20多分钟里。


    我也订阅了其他节目，比如万维钢老师和吴军老师的，同样收获很多，他们的内容也是用N多年的知识积累浓缩出来的。所以在我看来直播大都是浪费时间，当然其中有两个例外，高水平体育比赛的直播，它就是顶级运动员十几年的浓缩。还有美国大选，那是最精英团队的通力合作，虽然也是直播，但准备时间上数量级的差异，让价值倍增。所以从这点收获展开来，不是制造互联网内容
    的公司，只要您制造的产品能给我们省时间，就都是有潜力的。


    比如谁能解决上下班堵车问题，我最近一直关注低速电动车标准什么时候能出国标，之前汽车之家的李想创业做的车和家，也许就能给上下班省时间。费时间的还有找停车位，各种服务机构排队，这方面现在有黄牛人工替我们服务，但还不是规范化的。去医院非常费事，也许精准医疗在病前就帮我们做到预防了，虽然现在泡沫很严重，我想等泡沫都爆炸了，留下来的再长起来一定能帮我们今后在维护健康上省时间。外卖在吃饭上给我们省了时间，那些方便面品牌、罐头品牌、火腿肠品牌的销售额就跌去一大半。吃在生活开销中占比越来越小，北上广深上班的人之前选择泡面是无奈，现在可以更快吃到想吃的饭。所以省时间，是一个分布在各行各业的需求。


    节目内容方面，除了固定更新时间和增加了浓度和期数外，进一步挑战是成体系。可能各位在最近20期越来越多感受到，我们会用4-5期说一个主题。比如微生物和人体的5期，癌症的5期，化学元素的5期，之后计划说的是复杂系统，估计也要5期。这个节奏的调整比固定时间还难了一步，因为需要预告之后的节目了，万一没有找到足够多的好素材就很麻烦，但是现在我已经渐渐适应了。


    虽然付费版的节目只做了半年，但我大致算了下时间，已经和我之前一年半做的免费节目花的时间相等了。这段高强度的训练后我再回看从前免费版的内容，觉得再让我出那样的内容已经轻轻松松毫无压力了。这个过程虽然挺费劲，但想得到什么只能费力用心，我自己也非常享受这段时间，不但掌握了更多高效的办法也提升了技能，我觉得已经从卓克1.0变成了卓克1.5。


    每期上线我都很关注大家的评论，有时候刷评论到夜里2点多，这期我最想在评论中看到的是各位听这档节目以来的收获。我准备了5本我最喜欢的书给留评论的听众们，到时候送给被点赞最多的人。感谢大家这么久以来的支持。


