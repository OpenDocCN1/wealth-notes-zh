  md: '# 问答：中药在美国批准上市了？


    鼠鼠不怕猫：想请卓老板聊一下天士力、复方丹参滴丸通过美国食品药品管理局认证，在美国上市销售这一事。身边有朋友在聊天时谈到，认为这一事件说明中药的科学性。


    中药在美国批准上市了？ ↓


    卓克


    有听众鼠鼠不怕猫听身边朋友说复方丹参滴丸通过了FDA认证，在美国上市销售了，想问问这是不是证明中医药的科学性。其实这背后是有一些故事的，那是在1996年的時候现在的科技部，从前的国家科委提出的“敲开FDA大门”这个口号，当时选了不到10种药物一起申报FDA审核，临床实验对大部分药物是3期，少部分癌症的药物是2期。现在在中国通过了二期临床试验的药有3个，天士力集团的复方丹参滴丸，绿叶集团的血脂康胶囊，还有一个是上海现代中医药股份的扶正化瘀片。但目前还没有一款中国产的药通过了三期临床试验，您身边朋友的消息有误，它只通过了二期，在8月份完成了三期实验，就像考试把卷子写完交上去了，能不能及格那还得等分数下来。如果从概率上看，平均18款通过二期临床试验的药，最终会有一款通过第三期实验上市，所以现在猜这款药最终没有被批准上市，正确率是94%。


    从96年到现在已经20年过去，虽然时间够久的，但这并不能说明这款中药无效，毕竟还在验证阶段，其他国家药物上市也不是轻易可以过关的，有统计数据，您可以记住两个数，一个是10，就是说十年前的统计数据是这样的，一款药物从申报，到最终上市平均需要花费10年和10亿美元各种费用。另一个数字是6000，就是最初申报到最后上市，6000种药物只有1款可以最终上市。所以FDA并不是拿现代科学标准为难中医药，他也一样为难自己国家的药企，他的标准是不变的，谁通过都极为困难。其实FDA非但没有特意为难复方丹参滴丸，反而因为他在中国已经使用多年了，还免去它做临床一期实验这个环节，因为这个环节是验证安全性的，直接认可了这一点。


    我们之所以在96年提出了口号要敲开FDA大门，是因为在95年FDA对药物审批做了重大改革，从前FDA坚持两个凡是，凡是化学结构不明确的不受理，凡是药物作用原理不明确的不受理。但后来他们放弃了这2个原则，还是以实际疗效做最终依据，你申报的时候说不清里面什么成分，解释不了药物如何起效的也没有关系，能证明效果好就可以。这个政策后来在2004年又得到放宽，FDA公布了《植物药研制指导原则》，设定了更多和化学药不一样的审核标准，其实更有利于植物药上市，但这个大门开放后，06年就有一款治疗痔子的茶多酚上市了，2012年又一款植物药是从秘鲁豆树的汁液提取的药物，专门针对艾滋病人拉肚子的药上市了。但到现在中国的草药也没有一款通过审核。


    ![](img/72b394a82026978f467d7c86ddc01c35_34_0.png)


    卓克


    我们就假设11月份突然传来消息，复方丹参滴丸通过FDA三期临床试验，批准上市了，那也只是这一款药物有效，证明不了中医药的科学性，证明一个体系具有科学性那是另一件更复杂的事情。比如有一只没电了，指针不动的手表，他一天也会有2次正确显示了时间，但仅仅这两次正确是说明不了手表可以计时的。审核过程不久就会出现，我们随时关注。好了，这个问题就回答到这里。


