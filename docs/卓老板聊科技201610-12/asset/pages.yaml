    电子烟有害处吗？ ↓


    # 卓克


    听众青出于蓝听了烟草行业的罪后调侃道，听的我触目惊心，先吸口电子烟压压惊。但其实您知道吗，电子烟也可能有危害。这其实又是一段故事，简单来说，香烟在欧美国家从80年代后就走入衰落，媒体宣传和香烟有关的99%以上都是危害，和如何戒烟，这时候电子烟出现了，它能营造吞云吐雾的效果，而且各个厂家研发思路不同，有的是希望烟民能通过电子烟逐渐降低对真香烟的依赖，他们怎么做呢，就是用丙二醇来模拟吸入嘴里和嗓子的时候那股辣和呛的感觉，用尼古丁来满足身体戒瘾的需求，用甘油营造吞云吐雾的视觉效果。用化学香料模拟各种味道。用电加热的方式让这些成分挥发。


    丙二醇以湿纸巾那样的方式涂抹在皮肤上，那个量不会有害处，但是加热吸入后对呼吸道粘膜是有刺激作用的，这是有害的。尼古丁更不用说了，市面销售的电子烟的说法是逐步降低身体对尼古丁的需求，有一瓶12mg的，9mg的6mg的3mg的，也有完全不含尼古丁的。但这种初衷是不是能达到戒烟的效果是存疑的，电子烟现在被FDA和各国食品药品部门监管留意的，比较混乱的部分在于香料的成分，这些都是各家按照自己的规范配制的，但这些成分在加热雾化吸入后是否安全，没有什么医学证据，也就是说现在暂时无法证明这些添加物是安全的，所以肯定不能销售。


    所以现在FDA对电子烟的监管是越来越越来越紧的。这是以戒烟为目的的销售。


    可以销售的电子烟都是成分明确的，但是这是在美国，在中国没有监管，厂商就可以跟进自己需要勾兑各种口味，比如薄荷，水蜜桃，苹果，或者模拟中华烟，中南海烟，这些香烟的味道。实话说我自己买了一只电子烟，我是不会抽烟的，所以选的不含尼古丁的烟油，按理说薄荷应该是最好凉的，可实际我吸的感觉，3种口味，薄荷的刺激性最大，最呛。所以我敢说，那些模拟其他香烟口味的烟油，味道也很難正宗，各种口味添加的烟油成分安全不安全还真说不准。


    另一种目的是电子烟厂商只是打着戒烟的口号，最终目的是让烟民停留在电子烟持续消费上，这种目的制作出的烟油成分可能会有更多不标注成分的东西。


    除了这些，还有一方面导致电子烟有可能被大力管制的是目前有很多研究显示，电子烟的出现会让本来不吸烟的群体培养出去吸香烟的习惯，这个比例不同研究数字不同，从20%-50%多，这些证据一旦最终在研究综述中被采纳，可能电子烟的监管会更严。


    那最后说说我自己的看法，电子烟，危害大概说至少比香烟小，具体小多少，不知道。它没能赶上好时机，比他害处大多了的香烟能大行其道的销售，但它却在发展中遭到更严格的监管，也只能怪命不好。如果您本来是烟民，通过电子烟能戒掉，那还是受益的，如果本来不吸烟，像我这样，好奇去抽电子烟，最后好奇心重到试了香烟，还上了瘾，那就得不偿失了。好了，这个问题就回答到这里。


