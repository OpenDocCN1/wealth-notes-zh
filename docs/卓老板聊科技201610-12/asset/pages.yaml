  md: '# 问答：人体特异功能是真的吗？


    Ricky: 卓老板，我是忠实铁杆听众，台湾有个李嗣涕教授，研究人体特异功能，比如手指认字等，还发现有神灵，李敖曾经采访过，请问你怎么评价这事，能讲讲吗？


    人体特异功能是真的吗？


    # 卓克


    我们最近在周一、三、四里聊的大都是和本周或者上周内容关系比较密切的内容，不过我偶尔也会聊一些关系不大的，它关系不大只是和当周节目关系不大，实际和整个节目关系还是很紧密，比如听众Ricky就问，台湾有个教授，研究人体特异功能，如手指认字，李敖还采访过他，问我怎么评价。


    这个问题和节目是有关联的，因为这和咱们国家民众科学素养有关，听这个节目稍微久一些的人，这方面素养就比普通人提高很多。当我们遇到这样的问题，应该怎么判断呢？很多人会觉得这是骗子，就开始找人体特异功能的负面新闻吗？不是的，我们也要本着实事求是的原则来看。


    我也查过这位台湾的教授——李嗣涕，其实他不只是教授，还是台湾大学的校长，而且台湾大学在整个亚洲就能排到前10名吧，跟咱们中科大、复旦啊，差不多水准的学校。他的专业领域是半导体材料，这也是一门和物理关系非常紧密，差不多是半个物理学的学科，这些都是令人信服的部分。但是是不是科学还得看他做了什么，我专门在台大的主页上看了他在人体特异功能上的研究内容，粗看了一下，他是按照传统科学研究的范式做的，实验设计、数据统计、双盲条件的控制，这些内容都有，从他过往经历看，我相信他对什么是伪科学比绝大部分人都清楚。


    如果对比中国曾经出现过的人体特异功能大师，有的说能治病，能长寿，背后的目的就是为了钱，跟着这股政策风儿搞研究的也是为了出人头地。但这人不相同，他其中一个身份就是台大校长了，其他什么荣誉奖章啊，这学会，那学会的名誉主席啊，那个研究所的顾问啊，这些名号多了去了，在世俗眼光中可以称之为成功名就。所以我相信他研究人体特异功能也不是名为利，就是出于自身世界观的研究选择。


    但我们还得注意，他的学术背景是电子工程，半导体材料，没有接受过生物学、医学方面的专业训练。他从上世纪90年代起突然开始对人体特异功能感兴趣，然后他做的各种研究都是和人体有关的，他并没有相关学术背景，所以他从上世纪90年代开始发的各种论文，要不是因为他任台大教务长，发在学校刊物，要不就是发在了一些专门研究人体特异功能的杂志上，没有一篇是在主流医学界上刊发的。


    这其实又转到病根儿上了，就是他研究的非主流科学。因为一篇论文有100来页，我也没时间逐字逐句看，但我知道主流科学界对这类研究是非常排斥的，相信如果真的有主流科学界的人，尤其是生物医学方面的科学家，哪怕是普通的博士，打算花上几个月时间审核他的内容，大概率说会出现很多硬伤的。


    科学的每次进步都是非主流通过大量证据把主流干掉。成功率比较高的方式是，从前一直是主流科学体系内的，在越研究越深的过程中，突然在某个观点上，和曾经的主流观点产生了分歧，在分歧上越走越远，最后竟然证明，他走的这条“歧途”是真的，然后在这个领域有名的期刊上成功把结论写成文章发表，如果这时候他的名望已经很高了，结论还是对的话，推翻主流的过程会快一些，否则有可能文章被埋没几十年的可能。


    像这位李嗣涕，压根就不是生物医学圈的，打算凭一己之力，重新建立一套人体科学、生物医学的新体系出来，几乎没有希望。那边主流学术圈曾经诞生的结论也都是成千上万的生物学家积累毕生精力，又经过同行的百般审核甚至是鸡蛋挑骨头后剩下的可信的部分。真的想发表非主流观点，最少也得有相关资历，这个资历的及格线是这个领域的博士，如果连这都没有的话，没人会承认你。你可能觉得怎么科学圈里还整这排资论辈的事儿啊？当然啊，这是一种节省精力最有效的方式，否则噪音太多干扰得谁也没时间干正事了。所以李嗣涕的特异功能，您就当噪音好了，林子大了什么鸟都有，哪怕是科学家，老了以后也有各种想法。


    好，这问题就回答到这。


