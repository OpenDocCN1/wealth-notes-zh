    说做不出来的人敢公开自己的名字，我就敢把这些小组的名字公布出来。现在这13位国内比较顶尖的生物学家都公开了身份，但还没有见到韩春雨公布那些说可以复现实验的人，而且这时候也已经不再做什么回应了。


    这是韩春雨这一支的情况，河北科技大学的反应也比较令人失望，知识分子虽 然是个科普公众号，但3个创立者可都是学术界顶尖人物，他们第一时间大力报道了韩春雨，但现在结果是这么多质疑，其实是在损坏自己的声誉。饶毅在等时间大致稳定下来后，9月7日针对这个事情，给河北科技大学校长发电子邮件，但没有回信。一周后饶毅托校长的同学询问，得到的回复是校长没收到这份邮件。14号饶毅短信询问校长，您收到没有，如果没有，能不能给我们一个准确地址，我们再发一封。校长没回。15号，饶毅的助手电子邮件给河北科技大学校长邮箱发了另一封email，说他们会重新把9月7号的内容发一封挂号信给校长，结果这封email也没有回信。


    9月21日饶毅和邵峰把纸质版的挂号信寄出，25号，河北科技大学收发室代收。10月10日饶毅终于收到了河北科技大学盖章寄出的挂号信。信里写，尊敬的饶毅教授，邵峰院士，你们好，非常感谢二位对河北科技大学的厚爱，学校将认真考虑你们的建议，同时希望继续支持河北科技大学的建设发展。完了。


    饶毅和邵峰那封信怎么写 Deke，大致意思是，5月初韩春雨那篇论文发了以后我们很高兴，是国内第一批给他做正面快速报道的媒体，尤其是他是在设备和资金比较落后的情况下做出的成果，我们真心高兴。我们之所以这么快速的给正面报道，就是因为相信nature的信誉，初步的同行评议没有问题，就按惯例肯定了他的工作。但没想到后来国内外质疑这么强烈，给河北科技大学，甚至给整个中国生物学界都带来了很大的负面影响，可事情发生了4个月，韩春雨的团队没有任何有说服力的回应。现在已经逐渐演变成中国科研界最令人瞩目的大事件了。基于上面的情况，建议各方在实验得到验证前，谨慎对待成果，别忙着奖励或者惩罚，向之前拉横幅欢迎韩春雨，争取下一个2亿元以上的资助，这些都暂缓。而且这个事情影响这么大，希望学校成立委员会专门审核成果。


    这就是两条主线下韩春雨事件到现在为止的进展。已经过了几个关键时间点都没有出现什么消息，估计之后进展不会很快了。但尽管现在韩春雨和他的大学回应很被动消极，很无力，也依然不能说他学术造假，学术不端，最值得采纳的就是信里说的那样，奖励和惩罚都别进行了，把调查做为首要任务。但是现在的情况是，国家已经批了2.2亿元建设经费，发改委批了2000万设备费，省科协副主席已经评上，河北省最美教师已经当选，长江学者和中青年科技领军人才已经成为候选。所以给调查结果的公正性留下的空间已经不是很多。我预测这件事最有可能的就是不论调查结果怎么样，都不了了之，不再给奖励也没有惩罚。


