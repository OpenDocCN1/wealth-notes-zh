  md: '# 抢鲜 | 解读诺贝尔物理学奖 “拓扑相变”


    大家好，我是卓克，这次十一假期，我和“知识新闻工作室”的小伙伴们一起加班，第一时间给您解读2016年诺贝尔奖，一共3期，今天是第2期。


    2016年诺贝尔物理学奖公布了，它颁给了3位美国科学家，分别是大卫·索利斯，邓肯·霍尔丹和迈克尔·科斯特，奖励他们在拓扑相变和拓扑相物质方面的理论发现。这是一个典型的，离所有人生活都非常远的成果，让我来帮你拉近理解。我们先从拓扑相变里的拓扑和相变这两个概念说起。


    拓扑是什么呢？这是一个纯数学分支。正是这次获奖的这三个人的努力，让这个分支第一次插入到物理学里。每次数物学家把新的数学工具领进来，都会造成物理学上的很大突破。


    拓扑和几何有一些关系，它就是研究形态相似的程度。比如说，一个圆球和一个椭圆球，虽然咱俩看起来样子是很不一样的，但是在拓扑上，却是拓扑等价的，而且他们和一个立方体，甚至和一个饭碗，都是等价的。为什么呢？你可以想象成他们都是可塑性很强的橡皮泥捏成的，如果仅仅通过揉一揉、压一压、按一按造成的改变，这就相当于没有改变，他们是拓扑等价的。但如果你把它做成了一个带把儿的茶杯的形状，那拓扑上就不等价了，因为你没法通过揉一揉、按一按、压一压把一个平面上弄出一个窝窿来。所以一个饭碗和一个带把的茶杯拓扑是不等价的，茶杯多了一个窝窿。如果是眼镜儿呢，就是那种没有眼镜片的眼镜，这下它出现了两个窝窿，所以眼镜框跟茶杯和饭碗都不一样了，是另外一种拓扑了，如果是带有三个窝窿的曲奇饼干呢，那就又是一种新的拓扑结构了。大概明白了拓扑，我们再来说相变。


    相变是什么呢？比如说固态到液态是一种相变，液态到气态也是一种，这很好理解，这中间的区别主要是因为分子间距的改变。但是还有一些相变从外观上是看不出来的，比如说给磁铁加热，温度到了一个临界点以后，磁性就会完全消失了，虽然你从外表看，还是那块吸铁石，但它在磁性上已经发生了改变，这就是一种相变。同样的，还有一些材料在温度变化的时候，会从不导电变为导电，或者在极低温下电阻从有到无，虽然从外观上看，也没有任何变化，但其实导电性大幅跳跃也是一种相变。


    知道了拓扑是什么，也知道了相变是什么，那么拓扑相变是什么呢？如果我们用拓扑学来描述一组原子的排列，那么当外界条件发生变化的时候，这组原子的排列，如果从拓扑学的规则去看，有的时候可能从几何学角度看，已经非常迥异了，但是它们仍然是拓扑等价的，而另外一些时候，连拓扑都不等价了，这个时候就相当于发生了拓扑相变。这种相变不是仅仅体现在“排列顺序”这种数学概念上，甚至也会带来一些可以测量到的，物理特性上的改变。


    我们举一个现在能找到的最最浅显易懂的例子，如果您觉得这个例子听起来也跟天书一样，那估计很难找到比这个更容易懂的了。那就是反常量子霍尔效应。


    我们先说霍尔效应，假如我们有一块材料，就像一本书那样，平放在桌面上。如果给这本书通上电，在垂直于桌面这个方向加一个磁场，会出现一个奇怪的现象。就是这本书的书脊这一侧和书脊对面翻页的那一侧，出现了电压差。也就是电子都集中跑到其中一边儿去了。这个就叫做霍尔效应，这是130年前发现的。您说这跟我有什么关系？当然有关系了，汽车的速度表显示的数字，就是靠这个原理测得的。


    到了1980年，量子霍尔效应被发现了，你看，多了量子两个字，条件跟霍尔效应只有一点不同，就是它外加的磁场是超强磁场，不是130年前那种弱磁场了，这时候虽然有一部分电子仍然会靠边走，但是在内部，更多的电子不会往边上靠，而是自己在原地打转转，这就会造成，在这个材料的某一个方向上电阻为零。电阻为零，这有什么意义呢？哪怕是有那么一点投资敏感度的人都会发病的，这就是巨大的商机啊。比如说，我们的CPU之所以按摩尔定律增长不下去了，其中一个原因就是发热太大了，没法继续提高CPU的工作频率。但如果我们可以找到一种材料，它的电阻为零，我们就可以继续提高电流、加高频率，发热的问题也就迎刃而解了。有人可能知道另外一个实现电阻为零的方法，那就是超导，但超导需要低温环境，这不太可能在几厘米范围内的CPU中实现。但量子霍尔效应也被卡住了，它卡在哪儿呢？就是实现它的必要条件是得有超强磁场，这一般都得配一个车间那么大的磁场发生器才可以，这样的东西也不可能进到CPU里面。


    这时候今年的诺贝尔奖得主邓肯·霍尔丹，就用他新的数学工具计算出，其实现量子霍尔效应还有一个更加奇特的情况，就是在不用外加超强磁场的情况下，甚至连一点磁场都不用加的情况下，也能实现量子霍尔效应，也能在某个方向上，出现电阻为零。'
