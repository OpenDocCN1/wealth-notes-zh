  md: '# 问答：热水比凉水更容易结冰？


    王子樟：印象里很小的时候在《我们爱科学》看过一篇 文章，讲的就是是否热水比冷水先结冰。先讲了这个事的历史事件，但是实验复现的时候都是冷水先结冰，并且提出了当时热水先结冰可能是实验错误。当然我也不确定这篇文章的严谨性，毕竟当年的那份杂志我现在也能回想起一些内容的
    不严谨错误。


    热水比凉水更容易结冰？


    # 卓克


    水系列节目第一期中我说水有很多奇特的性质，其中提到了热水比冷水更早结冰。有听众王子樟说，印象中很小的时候看《我们爱科学》这本杂志，看到过一篇文章，讲的就是热水是不是比冷水更快结冰。他先说了这个事情的历史，但是实验复现的时候都是冷水先结冰，并且提出当年热水先结冰可能是出现的实验错误，他说他也不确定这篇文章的严谨性。


    一提这杂志，我一下回忆起原来上小学了，我也订这个，可能订了得有3年的时间，但那时候还小，根本也没能力判断文章怎么样，都没有什么印象了。他说的这种质疑确实存在，甚至说咱们现在听众有条件，拿热水冷水做个实验，就很可能出现冷水先结冰的情况。对这个问题我先给出结论，这个现象并不是每次都会发生，可以通过控制条件复现，但发生机制是什么，现在还是众说纷纭，N多种解释，并没有统一答案。现在我们再来详细说说。


    首先就要说清楚，什么算热水，什么算冷水，什么是先结冰。这个现象是说在同等体积，同等质量，同等冷却环境下，温度略高的液体比温度略低的液体先结冰。这种现象叫姆潘巴现象。


    之所以叫这个名字是因为1960年代有个坦桑尼亚的高中生姆潘巴在做冰淇淋的时候，因为冰箱空间有限，怕其他同学先把位置占了，就只好在用热水冲的牛奶、糖等还没冷却时就赶快放进去了，结果冻了一个半小时后，他的冰淇淋已经开始结冰了，而其他同学已经晾凉了才放进去的冰淇淋还处于黏稠液体的状态。因为这些学生用的是同样的材料做的冰淇淋，冻的时候也都是用一样的冰格，所以按说条件一致，为什么会这样呢，他问老师，老师回答不上来。后来他抓住机会问了一个来他们学校访问的非洲的大学物理系系主任，也没回答上来，这个姆潘巴现象便就此传开了。后续很多人尝试验证，有的能做出来，有的做不出来，我们来说这个实验。


    这个实验用的是化学意义上的水，也就是蒸馏出来的水。为了减少微生物对实验的影响，还专门用臭氧杀菌铜杀菌。为了减少水中溶解气体的影响，还专门煮沸，排出气体。实验中用了100ml的水，水位高度是15mm，用塑料容器和玻璃容器分别做过实验，发现无论用什么材质的容器对结果影响都非常小，所以就不考虑容器材质了。


    水温选了11个温度点，从10℃到90℃，冰箱温度是-14℃，然后用数码相机监控结冰情况。最后统计开始结冰和完全冻成冰的时间。对于开始结冰所需要的时间，差不多是当初放进去的水温越高，开始结冰所需时间越长，当然中间有一些小幅波动，比如50℃的水开始结冰要52分钟，而64℃的水开始结冰用了50分钟。但大致的曲线没有反映出热水先结冰的特性。


    但是如果把结冰定义成全都冻住了的话，这个实验发现不论温度是多少，最终全冻住所需要的时间基本都是200分钟。这倒是有点姆潘巴现象的味道了，因为您想，10℃的水全冻住和90℃的水全冻住，竟然都是需要200分钟。


    后来又用了另一种水，其实就是容量和水位高度变了，这次是6ml，水位高度是1mm，结果在不同初始温度下的结冰时间就出现了两个驼峰一样的曲线。80℃的水结冰比70℃、65℃、60℃、45℃，甚至比25℃的还快。按常理说，80摄氏度的水中包含的热量远多于25℃。现在很多解释中有一
    种，就是说在热水中总是可以看到冰层不能连成冰盖，冰壳总是不能出现。总是沿着冰水的界面向液体那一侧生长出针尖一样的冰晶，随着时间增加，冰晶由细变粗。初始温度高的水，上层水冷却后到了接近4℃的时候密度最大，往下沉，这是一种对流，初始温度高这种对流就明显，单位时间里耗能就大，降温就快。


    当然这种解释是非常粗糙的，也没法解释为什么会出现两个驼峰，还不能解释水中有盐的时候的情况。现在用蒸发机制、过冷机制、溶质、可溶气体的影响，等等都能够解释一部分现象。这么常见的
    水，也不是很罕见的现象，我们现在竟然给不出圆满的定量解释，也反映出发现科学新大陆机会多么多啊。


    好，这个问题就说到这。欢迎大家把感受写在评论里，尤其是写在最新版本得到App的「1917小组」讨论模块里。'
