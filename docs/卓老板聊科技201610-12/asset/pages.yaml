  md: '以上这3个方面是最直接的、可以看到的，这个基础性研究对人类的巨大利益。


    我们再来说说这次评奖的花絮。


    这次诺贝尔奖颁奖之前，很多机构都在预测基因编辑技术，或者是癌症的免疫疗法会获奖，但是他们都没猜对，我觉得，基因编辑没获奖至少有一个原因存在，就是它没办法把功劳归功于3个人或3个团体之内。


    为这个技术做出重大突破的至少有5、6个团体。所以这就让诺奖委员会的人很为难。基因编辑这项技术其实在含金量上是足够重的，可一旦真的颁发了这个技术的奖，就会惹出一些恩怨，对于那些可以获奖，但因为人数限制没有获奖的人就是不公平的，实际上，在最近十几年来，能像今天这样单独一个人获得自然科学领域的诺贝尔奖的情况，实属罕见。


    还有一点就是，这个获奖的成果其实并没有形成系统的理论，就是说它还是非常崭新的，与细胞自噬有关的重要期刊和论文是从2005年才出现的，在2005年的时候，全球这方面的论文非常少。直到最近10年才渐渐成为热点。能在系统的理论没有完善之前，就把奖给了一个刚刚出现的分支，这种情况在诺贝尔颁奖的历史上，也比较少见。


    这个获奖的日本科学家大隅良典，可以说是这个分支的开创者，如果你要研究自噬，那你发的论文100%要引用大隅良典的论文，而且通常还不止是一篇。我们查查谷歌学术就可以看到，大隅良典有11篇论文的引用次数超过了1000次，最高的有4200多次。要知道，这跟微博的转发次数可完全不一样，一般来说一位科学家的论文引用次数能超过500，那都是国际界在这个领域的超级牛人。国际重要刊物上，如果你的论文引用次数超过50，那在国内学术界都是有话语权的，而大隅良典被上千次引用的论文就有10多篇，足以说明他的江湖地位。


    大隅良典凭借自噬过程获得诺贝尔奖，其实在2013年就有人预测过，他们预测的依据除了2013年这个领域比较火以外，还因为细胞清除体内垃圾的机制，除了自噬，还有另外一个，叫泛肽通路。这个我们就不细说了，您只要知道，自噬过程可以清理大分子垃圾，而泛肽过程只能清理小分子垃圾，只要知道这些就足够了。泛肽的研究在2004年就得了诺贝尔奖，所以这次自噬过程能获奖，从评奖委员会的公平合理性上，也能说得通。


    现在日本已经有过23个诺贝尔奖了，光在生理学医学奖就有6个了，咱中国还得加油啊。


    今天就说到这，明天继续给您讲今年的诺贝尔物理学奖。


