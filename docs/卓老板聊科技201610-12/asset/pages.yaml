  md: '# 问答：为什么三星 note7 会爆炸？


    周周：卓老板既然说到电池，那请教一下正确充电的打开方式究竟是怎样的？我发现现在的移动设备电池越来越不经用了，不知道是不是我充电不当导致。最近三星note7频现电池爆炸门，还想问一下为什么note7的电池会这么容易爆炸呀。


    为什么三星note7会爆炸？


    卓克

    有老听众周周听了一次性电池用完能不能扔后顺便问了三星note7爆炸门的事情，正好借这期答疑说一说，正好现在初步调查结果刚公布。为什么爆炸我们从两个方面聊，技术方面，我们先储备一点电池的知识，就是手机电池，那种一个长条状，扁片状的电池，内部结构是什么样的呢，不知道您吃过肉龙没有，北方的听众有人听说过这个东西。就是一层面饼平了，然后在这层面上铺上肉馅，铺平后，在从一个角开始把这两层的材料卷起来，放笼屉蒸。手机锂电池也差不多是这样的结构，�
    nuevo 一张长方形的铜箔，这上面在附着上石墨，这两层作为负极。然后在这上铺上一层绝缘层，绝缘层一般是塑料膜之类的东西，然后再把正极的锂离子材料铺上。当然细节还有很多，比如添加电解液啊，咱们就不细说了，您就知道有3层，负极，绝缘层，正极。都铺好了以后卷起来，当然，卷也各种有要求，否则电池就是圆柱形的了。卷好了以后，外观成了薄片一样的扁扁的，再封装外壳，该连上的引脚连上，该做支撑的支撑好结构，电池就做好了。


    三星NOTE7的电池出现了一个什么情况呢，我放了一张图，是note7事故调查结果，用X光对电池内部拍照找出的问题点。现在您打开手机屏幕看看资料中的，看不见也妨碍不大。我们看到的这3张图边缘都是从手机最薄的侧面看过去的图，电池也都是卷成卷的电池从侧面看过去的侧视图。有点像侧面看暖气片，每个薄片中间那个更厚一些的是绝缘层，支棱出来的薄片是一层正极，一层负极，一层正极，一层负极，这样穿插着排列的。绝缘层必须有，否则正负极接触在一起就短路了。那么这张图中右上角的就是正常情况下电池内部结构，绝缘层虽然面积比正负极都小一些，正负极在边缘都支棱出来一些，但正负极被隔开了，并不会接触在一起。您要问为什么不把绝缘层设计得面积更大，把正负极整个包裹起来呢？那是因为正负极后续还要再把引脚接出去，需要留出尺寸上的余量。好，正常的电池我们说完了。


    ![](img/72b394a82026978f467d7c86ddc01c35_22_0.png)


    卓克

    再看左上角和左下角的情况，这是在问题手机里拍摄到的，因为note手机背部不是像饭碗一样有个弧度吗，靠近外壳边缘的那部分正负极就被挤压了，远离外壳边缘的，顶部还有很多空间呢，不会挤到。这一挤压，支棱出来的正负极就容易搭在一起，一些看上去正常的手机，就拿这个note7来说，我告诉您怎么让他迅速爆炸，就是使劲按手机背部有弧度的那部分，使劲压，就会有机会让已经有些弯折变形的正负极最终搭上线。短路后就燃烧了。


    这就是技术方面的解读。咱们再说说三星为什么设计手机经验这么丰富，却犯了这么严重的错误。这可是他新一代的旗舰机啊。直接原困是他换了电池供应商，据小道消息说，原来的供应商是A开头的一家，后来因为有些问题换了，换成自己家三星SDI的电池了，结果这个电池在尺寸上就是有那么1mm左右的不合适，偏大。又时间紧迫要出货。结果硬往里塞，还真卡进去了，也没出什么问题，就开卖了。这肯定是公司工程设计团队的责任。压力重重的手机硬件竞争中已经让厂商喘不过气来，甚至设计阶段的可靠性都被迫做妥协。


    手机硬件的竞争其实就是互联网生活入口的流量竞争，所以各家都拼了，早已经不是谁技术领先谁吃香的时代，是一个全方位的竞赛，连那些根本无所谓 的，背部带不带弧度，机身上能不能有按键，要不要光滑手感，按键在左侧还是右侧，这些仁者见仁智者见智的审美选择都成了争夺评价标准的范畴。对厂商的压力实在很大，我从旁观者角度看，现在手机厂商的及格线是各个重要零部件都能拿到世界最好的型号，做出最新的功能。在此基础上加分项目就是很多个性化设计大大增加了实现难度，这时，往往很多个性化设计已经脱离了功能性，就是一些外观细节上的改变。虽然没用，但是实现难度大，证明了我的'
