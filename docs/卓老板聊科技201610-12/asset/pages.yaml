  md: '# 问答：对“熵”的误解


    拽自当中：熵的定义常常让我困惑。比如混乱程度，是否有秩序，怎样度量呢？


    胡萌：不会编程，用excel算了下那个生物数量的迭代公式，R=0到2的过程中，X的值随着迭代次数逐渐增大或减小至一个固定值（或者相邻值的差趋近于0，可视作相同值），超过2的时候，这条X值多次迭代的结果值的曲线便开始上下震荡，振幅逐渐减小，最后趋向于一个固定值，但随着R值增大，需要得到这个固定值需要的迭代次数越来越多。我只迭代了100次，但是根据卓老板讲的内容，我想，当R=3.1的时候，迭代的次数为无穷大，也就是说X不会再趋向于一个值了，而是开始在值之间反复震荡了。得到APP的回复如果能上传图片，那么大家能交流的内容就更多了。还有前两天在优酷上看到了BBC的一个纪录片叫《神秘的混沌理论》，和卓老板最近的节目内容也非常吻合，可以配合观看，对卓老板所讲的内容会有更加直观和深刻的认识。


    对“熵”的误解


    卓克


    上周讲了熵增加和混沌是怎么出现的，这两期内容相比之前的癌症、微生物与人体系列的节目要难很多。


    评论中有很多问题，我选几个典型的解释一下，首选就是有序和无序的描述容易出现误解。现在我们想象一个正方形里布满了间距相等，样式一样的豆子，它们在这里排列得整整齐齐。还有一个正方形里随意分布着一些豆子，有的豆子更紧密的凑在一起，有的豆子更分散。对这两个正方形里的豆子来说哪个熵更大呢？有条件的听众也可以打开屏幕看看资料里我给的图，您觉得哪个状态对应的熵更大呢？我们也可以用有序和无序这个标准来判断。


    可能有人会觉得第一种情况，也就是左边的正方形更有序，因为排列的整整齐齐嘛，这就是秩序嘛。而第二种情况，也就是右边的正方形乱七八糟的，所以就是没有秩序。


    ![](img/72b394a82026978f467d7c86ddc01c35_55_0.png)


    卓克


    其实这就是一个典型的误解，实际正确结果是，排得整整齐齐的那个是更加无序的，而撒得乱七八糟的那一团的豆子更加有序。听到这个结果您可能一下愕住了，明明是第一种情况更加整齐有序，难道不是吗？


    产生这样困惑的根源就是日常用语中有序的概念和物理词汇中的有序概念不一样。第一种情况下所有豆子已经排满了它所占据的空间，没有一丝一毫再变化的可能，第二张中很多豆子都可以在它所在的区域中再挪动，所以第一种情况是最大的无序状态，第二种情况相对第一种更加有序。


    还有听众说熵的定义让他感觉困惑，比如混乱程度、秩序都是怎么度量的？'
