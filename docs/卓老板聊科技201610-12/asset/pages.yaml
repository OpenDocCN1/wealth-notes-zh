  md: '# 加料：用网络游戏研究社会学


    年初海望：2011年底，Facebook和米兰大学合作，针对7亿多Facebook用户之间的好友关系网络所做的研究发现，两个用户之间的平均距离仅为4.74度。


    六度间隔理论


    在《网络思维与复杂性》这期我们聊到了六度间隔理论，牟海望给我们补充了一个例子，2011年年底，米兰大学和facebook合作，针对7亿多facebook用户的好友关系网络做了研究，发现两个用户之间平均距离是4.74度。我也看了一下，这项研究利用的是一个月内访问facebook的用户，一共7.2亿人的好友关系，这个规模超过了世界人口的10%，虽然人群有一定特殊性，就是他们普遍在15-55岁之间，但因为参与社会生活的群体也主要
    हुनि， 所以非常有参考性，有说法是六度间隔要改成四度间隔了。


    这里有一些数学、统计学量化做基础的结果是从事销售和传销从业者最喜欢的，直到现在还有很多线下直销在把东西卖给你后，还要你提供一份5个人的联系方式，他们好去继续联系扩大销售。不过六度间隔理论是1950年年初提出来的，从那时就不断被各种曲解和误用，那个年代人与人之间的交流远不如现在，所以当年不少严谨的研究是质疑这些说法的，但随着技术进步，真的在不断促进人与人的关系，20年前我们身边有谁认识个外国人是很少见的，现在有人的朋友圈有个外籍人士，你也不会卤目相看。所以这个被着力营销的卖点竟然经过了60多年成了真实情况。


    在这些年里利用互联网产品做社会学研究也挺多的，因为数据细致，可靠度高，只不过人群特征太明显，不具备普遍性。比如在PC年代微软就利用2006年某一个月的MSN短信后台数据，统计了2.4亿用户的300亿条信息，发现只要通过平均6.6个人就可以和全数据库的1800亿组配对产生关联，48%的用户在6次以内就可以产生关联，78%的人可以通过7次联系内产生关联。Facebook这次研究是任何2个用户之间通过4次关联就可以连接上的概率是92%，通过5次可以连接上的概率是99.6%。


    通过互联网产品做社会学分析的还有个特别有意思的例子，用的是魔兽世界，那还是10年前发生的一次bug。当时推出最新的副本巨魔城市祖尔格拉布，这个副本的大boss是哈卡，灵魂剥夺者，不知道大家还记不记得怎么打，它有个法术叫堕落止血，被打中的就持续掉血，不只掉血，还有传染性，一定距离里有其他玩家也会被感染。


    最初设计也考虑到传染的情况，但这种副本伤害挺大的，很难有人活下来回到主城。不过还是有人通过猎人宠物把这个掉血的疾病带回城了，还有一些角色用瞬移和传送把这个掉血功能带回了主城。所以一场游戏中的瘟疫就大爆发了，很多玩家赶紧撤离大城市，但是不断有人去打副本，把瘟疫带回来，最后有大约400万玩家感染上了。


    暴雪只能通过修改boss技能，把这场瘟疫平息下来。这本来是游戏里的事情，但引起了科学家的关注，理由嘛你也知道，科学家里很多宅男嘛，不搞科研就打魔兽，咳，就注意到这很有研究价值啊。这不就是空气传播的很好的模型嘛，每天650万人同时在线，跟现实模型都很接近了。从前只能用计算机规定一些参数，就像我们吃豆游戏那样，然后模拟感染，观察效果总结经验，但那不是真人，真人面对感染是有更多行为的，这又不能用真人感染。所以后续波士顿的塔夫茨大学和新泽西的拉各斯大学就仔细研究了这个现象，论文发表在《柳叶刀》上。


    从这个角度看，不只是杀怪感染瘟疫，像魔兽世界中财富的分配，等级的提升，贵重物品的交易，通货膨胀等参数都是可以统计的。社会学家甚至可以和暴雪这样的公司联合，开发一些为科研项目而设置的任务，玩儿起来有趣，又告诉大家你们玩这个任务是在为科学做贡献，我想游戏也会更有意思了。


    好，这个补充就到这。


