    # 问答：DDT又被启用了？


    贫瘠的鱼：网传因为禁用DDT，非洲死的人比希特勒杀的人还要多，现在又让用DDT了。这让我想起了《三体》里的那位圣母。


    DDT又被启用了？


    # 卓克


    有好几位听众都提到了《寂静的春天》 中说到的DDT，有的是从自身经历说的，说小时候在农村，用它灭蚊子、苍蝇、虱子效果非常好，它对农村卫生条件改善起到的作用非常大，还有人提供了一些素材，说因为禁用DDT，非洲死的人比希特勒杀的还要多。当然这么说是有
    些极端的比喻了，查了一下发现是惊 恐小说作家迈克尔·克莱顿说的。


    这还真是一段反转的故事。在2006年， 世界范围内已经停用了30年DDT之后， 世界卫生组织呼吁，重新提倡使用DDT 来抗击疟疾。当年DDT的害处大家可以
    读一下《寂静的春天》这本书，很薄， 半天就看完了。当时DDT的喷洒面积非 常大，造成在鸟类脂肪中积累，连南极 的企鹅体内都有DDT。后来从1969年 开始，各国陆续禁止使用和生产了。
    但禁止后直接导致的结果就是蚊子开始 传染疟疾。特别巧合的是，美国在DDT 被禁之前还持续资助斯里兰卡一个DDT 防蚊项目，1968年斯里兰卡整个国家只 有17个感染疟疾的。第二年DDT被禁，
    结果只过了1年，感染人数从17个变成 50万。这还只是斯里兰卡一个小国， DDT被禁后受影响最大的是非洲国家， 从前就指着它灭蚊，这个便宜啊。非洲 在2000年时疟疾感染人数是1.73亿，
    占全球疟疾病例的50%，而且因为非洲 医疗条件差，所以全球91%的疟疾死亡 发生在非洲。


    疟疾的死亡率平均是0.5%，但非洲肯定 比这个高，我们就按1%算，每年因为疟 疫感染死亡的非洲人大约有125万，而 且得了疟疾死亡的人中一半以上是5岁以 下儿童，这在人道主义上更难让人接
    受。世界卫生组织在作出重启DDT决定 时做过统计，这几十年来因为禁止生产 DDT导致蚊子传播疟疾 间接致死的人 数是2000万人。所以才有了那位畅销书 作家的比喻，“比希特勒杀的还要
    多”。DDT虽然可能导致一部分鸟类死 亡，但是只要在规范下使用，就能把害 处减小到最小，还能遏制住疟疾。


    对于疟疾这种病，本来是有机会从人群 中消失的。欧美国家赶上了那一拨的风 口，就是大量使用DDT的年代，所以在 欧美已经几乎没有疟疾感染了，感染的 也是因为去非洲旅游的。亚洲国家里，
    中日韩，还有北方温度低的国家也赶上 了风口的尾巴，比如咱们国家是上世纪 八十年代才官方禁止的DDT，虽然也算 早了，但是那会儿市场不规范，偷偷生 产禁也禁不住，可能真的要产生执行力
    要到1990年了，这种效果也导致咱们国 家的疟原虫差不多被消灭了。但是东南 亚很多国家没有赶上，那里经济落后， 气候潮热，印巴这些国家的疟疾还是很 常见。有这么一组数据，非洲是平均
    1000个人里220个患疟疾，南亚是 1000个人里有20个感染，全球80%的 疟疾患者都在非洲，所以非洲是一点风 口都没赶上，DDT就被禁了。尤其是南 部非洲，他们都没有自己生产DDT的能
    力，还没等发达国家成批的DDT援助到 位，发达国家自己都禁止生产了，所以 才每年死亡上百万人。


    之后非洲抗疟疾主要就是靠联合国的医 药援助，奎宁、青蒿素和蚊帐，但和泼 洒DDT相比，一个是守一个是攻。效果 差很多，医药援助的成本也远远高于 DDT援助的价格，免费药物能覆盖到的人群也少很多。像蚊帐这种东西，到了
    现在，在非洲常见的问题还是几个人用 一个蚊帐，一周用蚊帐几天，蚊帐破了 怎么办之类的，一看就是很不普及。通过防守的方式，最终钱花了不少，但效 果不太明显。所以在这种疟疾非常严重
    的地区，重启DDT的益处就远大于对环 境的害处了。从2006年到现在实施了 10年，现在非洲疟疾感染者下降了 45%，这种立竿见影的效果是青蒿素、 奎宁根本比不了的，所以DDT现在又重
    新发挥了作用。


    好，这个问题就补充到这里。


