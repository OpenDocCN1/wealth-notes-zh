    # 小行星撞击地球与铱元素的故事


    1.西班牙父子阿尔瓦雷兹在意大利研究白垩土层时发现其中铱元素含量超过土壤平均值600倍，而铱是一种重元素，只聚集在地球内部，绝大部分地表的铱都是外太空陨石带来的。


    2.铱之所以能依附在陨石上是因为陨石上的铁和铱的结构类似。老阿尔瓦雷兹曾经是1968年诺贝尔物理奖得主，所以在1980年前后帮助儿子测定含量极微小的铱时，他的测试方法起到了决定性作用。


    3.父子发表了研究结论：恐龙灭绝是因为6500万年前一颗小行星撞击地球引起的，这个结论在十多年中一直被学术界诽病，评论大都是：哗众取宠的胡说八道。


    4.1991年时人们在墨西哥湾找到了陨石坑，直径160公里，深几千米，墨西哥石油公司其实曾经在30年前勘探过这里，但没有对这里产生怀疑，这是把这篇水域定性为：没有开采价值。这里的海底岩层样本非常特殊，只有在核试验基地才会出现的冲击石英岩。这很可能是6500万年前由陨石剧烈撞击形成的。


    5.阿尔瓦雷兹父子因理论被诽病，不服气，在后续研究中又猜测太阳系其实有2颗恒星，而这一猜测的依据是元素：锆。这个故事将在下一期为大家讲述……


