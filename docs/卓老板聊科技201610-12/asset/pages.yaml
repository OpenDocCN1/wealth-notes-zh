  md: '# 抢鲜丨解读诺贝尔化学奖“分子机器”


    ![](img/72b394a82026978f467d7c86ddc01c35_7_0.png)


    抢鲜解读诺贝尔化学奖“...”


    大家好，我是卓克，这次十一假期，我和“知识新闻工作室”的小伙伴们一起加班，第一时间给大家解读2016年诺贝尔奖，一共3期，今天是最后一期。


    今年的诺贝尔化学奖，奖给了3位科学家，他们来自三个国家，分别是法国的让-皮埃尔·索瓦、英国的詹姆斯·弗雷泽·司徒塔特、荷兰的伯纳德·费灵格。奖励他们在“分子机器设计与合成”上的研究成果。


    化学是这么发展的，最开始是简单的无机物，然后是复杂一些的有机物，从小分子到高分子复杂程度不断提高。到1987年，复杂程度又提升到了超分子化学。在超分子化学出现之前的化学是什么样的呢？


    大约就是把原料找好，把反应条件设置好，然后发生反应。反应只要开始就只能等结果出来再说了，反应过程中原子和分子是怎么运动的，对我们，是个黑匣子。


    这有点像我们烧造瓷器，它的外观定型了，各种涂层也上好了，一大批送进窑里烧制。至于说在烧制过程中哪个瓷瓶身上有开裂的花纹了，那你也不知道，也没法干预，只能等这个阶段烧完之后，取出来看。而超分子化学就是要干涉窑里面的过程，比如瓶子表面出现开裂的花纹了，那么就能精确控制，让它开裂成一条龙的形状。


    我们举一个超分子化学诞生之初的例子，就是这次获奖的让-皮埃尔·索瓦做出来的，是两个钥匙环套在一起的形状，这东西整体是一个完整的大分子，而且在自然界，甚至在传统化学反应中都不可能出现的结构。它的特殊之处在于，在几十纳米的尺寸下，这个环套环的东西和真实世界中两个钥匙环套在一起之后呈现的情况差不多，也是可以来回来的动。这在从前的化学家脑中是不可想象的，因为微观世界由布朗运动主导，也就是你看每个分子都在无规则的行走，你没法涉足其中，让他们做有规则的活动。后来他们又做出了3个钥匙环套在一起的结构，叫做三叠结。沿着这条路，后续化学家做出了各种奇葩的结，比如奥运五环，100个缀起来的碗那样的结构，小人儿一样的结构，甚至是用语音无法形容清楚的、复杂的多环套多环的几何结构。


    这次获奖的另一个人司徒塔特在1991年也做出了一个奇葩形状，叫轮烷，就是在一个哑铃状的哑铃杆上套了一个环。你可能想知道，做出来这些稀奇古怪的结构有什么用啊？其实也真是不知道有什么用，只是因为化学家们从没想到现在可以用分子搭积木了，而且还能搭建出各种有机械强度的结构，从前用这些机械力维持外形的结构只能发生在宏观世界里，现在在那么微小的世界里，这些结构竟然可以抵抗布朗运动的巨大扰动，没有被打散，实在是忍不住去合成各种奇葩造型试一试。其实，这种有序的、利用机械力维持外形的、可以活动的结构就是零件儿了。


    有了零件，就离今年颁奖中说的“分子机器”不远了，机器就是由零件组装完成的嘛。今年获奖的第三个人费灵格教授就利用这些有机械强度、有功能性的部件设计出一个，可以朝一个方向转动的结构，起名叫“分子马达”，宏观世界中的马达有用电做能量、有用燃油做能量的，这个分子马达是用光做能量，只要光照射就能转动。结果他们竟然利用这个结构转动了一个28微米长的玻璃棒，别看微米是个很小的长度单位，但微米已经属于宏观世界的尺寸了。也就是说，他们利用一个微观世界的机械，推动了宏观世界的物体，那个玻璃棒比分子马达大了几千倍呢。


    后来其他科学家受到费灵格教授团队的启发，设计出车轮和连杆一样的微观结构，希望把马达装在连杆上，这车能开动起来，不过现在的尝试还是失败的，三个轮子的原地打转，四个轮子的不一定往前走，前前后后的，行驶不太有规律。但我们也可以大胆畅想下，如果把成对儿的车轮继续往后连接下去，如果它们能规则的转动，今后那就是分子18轮大卡车啊。


    上面说的是利用分子机器实现机械功能，司徒塔特后续用轮烷做出了可以实现算法的结构，这就和机械功能无关了，开始触及到开关功能了。我们知道，计算机的诞生就是因为有了MOS这种半导体开关。现在新的分子开关出现了，会不会诞生分子计算机呢？


    他们团队用几百万个轮烷叠在一起形成的开关，每一个都可以电信号的驱动下从一种状态切换到另一种状态，这时候电能转换成分子开关的动能。这个机构理论上可以在每平方厘米实现100GB的数据密度，大约是现在最好的硬盘存储密度的10倍。司徒塔特团队用这个原理确确实实记录了24个比特的数据，而且还存储和读取了“CIT”这3个字母，也就是他曾经工作的单位“加州理工学院”的缩写。


    这次化学奖颁发给的依然是基础学科科研，它是大约从1987年左右才建立起来的，到现在为止也依然没有任何商业、工业、军事上的应用，它只有实验室里的一些有意思的尝试。比如刚刚我们提到。'
