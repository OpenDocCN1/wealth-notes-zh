    # 问答：体内菌群紊乱，怎么办？


    张震：您讲了很多细菌缺失和紊乱的后果，那我们该怎么保持细菌的平衡呢？或者怎么补充缺失的那部分呢？


    体内菌群紊乱，怎么办？ ↓


    # 卓克


    有听众张震问，你讲了很多细菌缺失后和紊乱的后果，那我们该怎么保持细菌的平衡呢？或者怎么补充缺失的那部分呢？


    我自己的看法啊，因为抗生素的大量使用已经让我们不可避免的受到影响，你说我只吃自己种的菜养的鸡，但是土壤和雨水中依然包含了大量农药残留。去无人区寿命只能更短。唯一能做的是在现代社会的各种安全标准下生活，那些标准起码是经受了考验还暂时没被推翻的。说的好像很无奈，而其实我们总体上评价一下，全中国13亿人生活状况比30年前更好还是更差呢？30年前比100年前更好还是更差呢？民国时期中国人平均寿命37/8岁，1985年68岁，2015年75岁。几十年前青山绿水，空气清晰，但吃不饱，或者病了治不好。


    我们要哪种生活呢？我vest还是更多人希望多活几十年，哪里空气污浊一些，我用空气净化器，食品农药残留多一些，我多洗一洗。


    从前我们说过几期节目关于耐药菌的产生，现有的抗生素效果在减弱，今后那些对所有种类抗生素都耐药的细菌广泛传播起来怎么办，我们会不会回到1916年欧洲大流感那样，一死就死掉四分之一欧洲人口的状况呢？我觉得大概来说，不太会，科技也在起起伏伏，这40年我们在抗生素上打赢了致病菌，下20年致病菌缓过来一点，再往后40年我们还会发明新的抗生素，比如对耐药菌现在研发的药物大都是抗菌的蛋白质或者肽。比如最近一个宣传挺多的药物，就是利用一种星形蛋白把细菌的细胞壁撕裂，然后引起细胞质中成分的失调，这种失调会激发致病菌的细胞启动凋亡过程，而且因为他干扰的是细菌凋亡的机制，这是一个比较基础的生命开关，反复的实验中竟然没有观察到耐药性，这对传统抗生素来说是很難想象的，传统抗生素不论成分多新，每次总会留下百万分之几的幸存者。而这种蛋白质抗生素效果要好很多。


    当然我相信，如果今后广泛使用，仍然会有耐这种药的耐药菌产生，但新的耐药菌一定是在更基础的生命功能上都和其他真核生物有所区别了，说不定我们用新抗生素的副作用就是加速自然界产生新的生命形态，起码他们定义什么是死亡上和其他真核生物大不一样。


    回到科技对环境的影响上，我们可能很难主动回到更原始的状态，能让生活更好，让我们更健康长寿的力量就是科技了，比如水污染了，那么用技术清洁水，空气污染了，用技术过滤空气。就连精神生活上也是搭建在技术平台的，比如绘画，从前在纸上，但纸对人类来说也就是最近1000年才成为普通物品的，在之前都是很特别的一种展现艺术的平台。那么今后的绘画我们来畅想一下，可能需要在你的头枕部位有一个生物数据接口，插上以后，就相当于铺开纸了，艺术家的创作，也许并不是一种视觉，或者听觉。而是一种带开创性的神经信号刺激，你只能接好生物接口的数据线才能欣赏。


    好，这个问题就回答到这里。已经太科幻了。因为最近有不少听众都希望在回复听众的短节目中也加上文字，那么就从 Reactive 开。”


