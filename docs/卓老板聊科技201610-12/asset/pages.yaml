  md: '# 补充：计算机如何模拟进化


    计算机如何模拟进化


    上周那期节目，“计算机如何模拟进化？”大家的反响很热烈，其中评论里我却发现好几位听众甚至编了一段小程序模拟了一下这个过程，有这种动手能力和好奇心，估计您平日在朋友圈中应该也是众人心中的牛人。我想借这期和听众交流补充一点点内容，就是生物界的进化和程序模拟还是有本质区别的。


    之所以咱们听到那期内容感觉很像，只不过是因为我们把关注点放到了它们之间的相似之处。这一是源于我们对遗传、进化缺乏系统了解，只有一个大概过程的印象，另一个是我们对这个程序的细节很了解，所以两边一碰，感觉很对应。其实进化涉及的范围太广，我们印象中的只是九牛一毛，自然界是否真的这样，只能实验做了才能下结论，如果退到最最保守的区域里，这期节目说的实验只能告诉我们遗传算法可以在求大计算量最优解的时候帮我们节省一些程序运行的时间。其实这个算法最后最有用的也就是对程序员们了。


    那么在生物身上的遗传变异是一种什么样的复杂情况呢？简单的理解，基因和人体可以测量到的参数或者功能大都没有一一对应的关系，但您说我经常听说什么什么罕见病，是什么什么基因导致的，或者乳腺癌高发对应这brac1，brac2基因的变异。是，没错，但那是数十万科学家几十年的研究，就找出这么多，仅有的一些有强烈对应关系的遗传变异。


    如果真的是——对应的关系，那像人类基因组全部序列碱基对存在硬盘里大约需要占用3G的空间，而且大部分哺乳动物的基因组全序列也都在3G上下，最小的是蝙蝠，大约2.2G，最多的也就是3.1G，但是人明显比其余所有哺乳动物，不论从能力到智力都丰富很多。完全颠倒过来也有，比如小麦有16G，但复杂程度完全比不上人，现在发现的最大是一种叫重楼百合的植物，150G，是人类基因组碱基序列的50倍。即使剔除了多倍体的因素，还是会存在这种不协调，这就是因为很多时候我们只能通过外部观察找出特性，再筛选拥有这些特性的基因，往往决定一个特性的基因有n个。


    这就有点像我们那期节目里说的，用遗传算法生成的最优解，它在10×10的格子里游走时，大多是时候轨迹就像一个聪明的孩子在画一笔画，把那些豆子连在一起。我们就把这个特性总结成，一笔画。我们觉得这是一个特性。但实际上之所以能形成这种特性，在那个计算机生物的生存策略中可根本没有哪条指令是“请按一笔画走法运动”这样的基因，它之所以游走成那个样是有全部243位序列决定的。这之中体现的就是非线性的复杂系统。


    基因的复杂不光体现在一对多，还有很多，比如说甲基化，这是表观遗传的一个方式。表观遗传简单来说就是DNA的序列根本没有变，只不过在某个碱基上出现的甲基化的化学反应，于是排列顺序即使相同，最终表现出来的特性却是不同的，而采用一般的测序方法甚至都发现不了哪个位置发生了甲基化。甲基化很多发生在后天，比如长期抽烟，哈佛大学医学院最近一项重量级研究出炉，6万多名血液样本对比发现，常年吸烟的人，整个人体有超过30%的基因已经甲基化了。说白了，人一共2.2万个基因，他们因为抽烟，导致其中三分之一都发生了恶性的改变，而且这种改变是可以遗传的，这些人生下来的孩子也天生带着这些已经恶化的基因。抽烟家庭的孩子，一出生就在身体上落后别人一大块，今后癌症高发，心血管病缠身都是大概率事件。


    好，这个话题我们今后有机会详细说，这次补充就到这。'
