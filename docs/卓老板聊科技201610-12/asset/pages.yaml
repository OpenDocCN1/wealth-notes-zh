  md: '# 问答：肚脐眼会暗藏什么健康危机吗？


    哈哈：肚子眼特别不起眼，但好像暗藏了很多健康危机，卓老板能聊聊肚脐眼吗？


    肚脐眼会暗藏什么健康危…


    # 卓克


    有听众问肚脐眼是不是暗藏了什么健康危机，这问题对新生儿父母可能比较有用，因为肚脐是人生第一个伤口，出生前这里连在婴儿的脐血管，脐尿管上，但是剪断后这些东西都没用了，他们在后续几年里会腹膜化，简单说就是和腹膜融为一体，成了增厚的腹膜。出生的时候脐带是护士给处理的，一般有两种方法用脐带夹和用气门芯结扎。说到这，您可以掀开衣服看看吧，如果肚脐眼的形状是压扁的，高出皮肤1/2cm的，那就是当年护士用的脐带夹止血的。如果是内陷进去的，当年护士就是用的气门芯结扎的。两种不同的形状没有好坏之分。


    问题中说得健康危机，绝大部分指的是出生前一个月，因为虽然脐带完全封闭了，但是里面的血管和尿管的腔体结构还在。如果在医院处理过程中不小心导致病菌感染，大都是脐炎，就是脐带剪断的这部分发炎，用常规的杀菌手段处理就可以，极少数严重会导致腹腔的感染。这种情况发生比例非常低。大多数新生儿肚脐上的血痂一掉就差不多没为什么问题了，也就在出生后20天左右的时候。这20多天里需要注意的就是注意干燥，不要让这里碰水，别把尿布包到这个位置，因为一旦尿液涌上来，容易糊住，感染。也不要人为的清理这里还没自然脱落的血痂。


    孩子到了2/3岁后好奇心重，会对自己身体，小伙伴的身体好奇，你怎么有小JJ啊，我怎么没有，你的肚脐怎么鼓出来的，我的怎么凹进去，然后就用手抠，抠得比较狠时会弄破，感染，成年人也有手闲不下来的，甚至用什么镊子，耳挖勺抠的，最后一不留神，结局都是脐炎，就是肚脐眼发炎啊。治疗方法也还是跟传统治疗细菌感染一样。肚脐眼不是人体一个特殊位置，不是什么练功的窍门，也不暗藏什么健康危机。平时洗澡可以用水冲冲，不特意清理一辈子也不会有问题。而且不少腹腔镜手术是从这里把器械扎进去的，这样做的好处是，可以不用在病人身上另外钻窟窿眼了。好，这个问题就回答到这。


