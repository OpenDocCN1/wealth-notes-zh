  md: '# 问答：学渣怎么学数学？


    土豆：卓老师连续几期宣传数学，连我这个曾经的数学渣渣都忍不住要开始重新学习数学了。所以卓老师有什么推荐的系统学习数学的书吗？


    学渣怎么学数学？


    # 卓克


    最近接连有好几个听众都受我节目 cárc 开始找一些数学和物理书看了，有的人看的是《费曼物理学讲义》，有人看的是公开课。有听众说，我连续几期宣传数学，连他这样曾经的数学渣渣都忍不住要开始重新学数学，问有什么推荐的系统学习数学的书吗？


    我是最喜欢看到节目出这样效果的了，当然最满意的情况还是发现一个高中生有这样的冲动。因为实话说，高中正是好时光，如果你是高中生，甚至初中生特喜欢听这节目，其实一定程度上反映了你心智早熟，你们比听众的平均年龄要小。大部分听众是有冲动要去学的时候，突然一个电话，领导催了，客户策划案急么还没有给，或者又得去见投资人了，数学课只能先放一放了。而你们是听到动心的时候，直接就可以付诸行动，想学什么就学什么。但那些已经工作了的人有心无力也比浮游盪盪的人好上太多，因为你们知道世上还存在一种理性的世界，魅力无穷。我相信你们会把这种价值判断传递给你们的孩子，这些是节目的核心价值。


    那么说到推荐什么书呢，是这样，数学课程只看书的难度会高很多，所以我推荐网上的公开课。比如网易公开课里，你搜搜麻省理工的线性代数，再看看可汗学院的微积分预备和微积分，还有概率、统计，差不多这几门就是数学基础课，任何学科只要用数学工具，这些基础都避不开。其实只要你把这几门课的概念掌握了，不出意外，就是百里挑一的数学素养了，甚至是千里挑一的。


