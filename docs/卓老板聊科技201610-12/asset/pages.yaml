  md: '# 讨论 | 逃离地球时你带什么走？


    ![](img/72b394a82026978f467d7c86ddc01c35_44_0.png)


    370727、dou


    如果是《物种灭绝的周期》中提到的，真的存在2600万年一次的灭绝周期，我们距离下一次还有2000万年的时间。如果不是2000万年，而是还有2年时间了，各位就是被选中移民到其他星球避难的，但因为飞船容量有限，除了必需品外，只能再带3公斤物品，为了帮助幸存者在新世界的文明尽快发展，您选择带什么呢？


    讨论 | 逃离地球时你带什… ↓


    这个话题收到了非常多留言，可以归纳成下面的内容。


    要保证人类科技和文明可以传承，有人建议最好方式是集中规划，每个人都带3公斤容易重复。


    一半人提出带种子，有人还补充了一些就是带真菌的孢子和动物的基因样品，这些也可以归在种子里吧。


    带武器，这主要是受《三体》里黑森林的影响，还有刀子、剪子。


    带笔记本电脑和装满数据的硬盘，还有电子图书馆都带去，3D打印机，维基百科，太阳能发电机，DNA技术，这些东西我们都归为已有的人类文明和科技，尽可能全套搬走。


    还有分类思考的，跟科技有关的科学家都带了，历史有关的历史学家都带了，文学艺术有关的人文艺术学家都带了，音乐有关的，雪峰老师都带了，和新环境有关的知识，卓克都带了，他觉得自己在这些专业领域不用操心，他自己就多带几双鞋，准备去了那能长远的走下去。


    要看什么心态移民，如果是殖民者心态，那就要把最先进的，最有价值的东西带过去，增加竞争力量，要是作为难民心态，那带上头脑就够了，人类在任何情况都能创造新的文明，地球文明就让它留在地球。这还真有可能，因为环境变了，地理决定论，就导致我们在新星球上可以持续下去的文明是另一种形态，带过去的东西有可能大部分是不适用的。


    既然是有组织的撤离，该带的东西官方肯定不会少带，3公斤对我们也没多少，所以带上一个自己喜欢的，比如带条狗，或者一个游戏机，带个ipad，里面装满漫画和音乐，还有就是注重回忆和内心感受的，他会带全家人照片。这类人在新星球下应该是最人畜无害的种族了。


    还有心态是防备状态十足的，就是总结带物件中带武器的，他们认为去了新地方，无非就是保护自己，保护家人，保护共同的威胁，所以3公斤都带武器。


    还有几个老听众愿意把3公斤都配合给我，帮我带东西。


    还有少数几个听众，比如阿洋，他们选择不走，他们愿意接受命运安排，不愿意和欲望膨胀惴惴不安的人类逃走。


    还有从个人经济规划方面考虑的。带香烟和避孕套，他认为这两种东西在新星球上一定是快速增值的，因为新地方一开始肯定会施行配给制，食色的天性让避孕套价值提升，在参考极端配给制下的监狱或者集中营，香烟都是紧俏货，所以他带这些可以交换到今后需要的东西。


    还有一个思考角度是，我们考虑带什么，一定要从全体人类的整体利益为出发点，不要满足个人私欲。


    还有一种角度是感恩，因为还剩两年时间，他要感谢地球曾经养育过我们，感谢湖畔山川，把这些感激记录下来，3公斤带走。这是很多得到用户共有的特质，非常难得。


    卓克


    多样性的启发：


    丁晓雯说了一个故事，他们一帮同学野炊，组织者非常用心，时间和每个人的任务都安排的井井有条，木炭、炉子、肉、菜、水果、蔬菜都谁带，丁小雯是最后加入的，之前任务都分配好了，所以她去领任务时，没有需要她带的了，估计也是挺盼着野炊的，老姑娘老想，所以她出发前他鬼使神差的带了一包盐，结果那天如果没有这包盐，他们野炊就没有咸味了。


    专门挑这个例子说就是想说，其实我也更支持个人按照意愿和需求带，这保证了多样性。继承人类文明和科技，这样的大事我不相信某个机构可以考虑完善，即便是中科院组织讨论，一样有局限性。把任务分散后多样性确保了更多的机会。所以如果你要是想听我的答案，我个人会带上最值得回忆和珍惜的东西。也许是硬盘，也许是纸质的家人照片，也许是日记本。而且我也支持每个人按照自己的想法和初衷带，就像有人为了科技能延续，带浓缩资料，有人为了保护自己带武器，我无差别的支持的根源是，我知道多样性会带来更大发展的可能。组织大家发散式讨论，也为我自己也为大家提供了一个机会，感受一下多样性带来的好处。'
