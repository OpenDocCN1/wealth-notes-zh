  md: '# 问答：聊聊韩春雨事件


    Shawn：既然讲到了基因，卓老板啥时候抽空讲讲最近韩春雨事件、张峰事件以及背后的基因剪辑技术呢？我挺好奇的，但没这方面背景，看不太懂这些ngago, crisp之类的技术。


    聊聊韩春雨事件


    卓克


    有一个科学圈引人关注的事件，韩春雨事件，从5月份到现在持续发酵，不少听众都留言让我说说。这个话题其实我很想等一个明确结果再说，因为情节一直在发展，但现在看，好像陷入了僵局，我就帮大家梳理一下。韩春雨的论文在5月2号刊登在自然的子刊《生物技术》上，当时国内第一个有影响力的报道是来自知识分子，这个公众号，是饶毅，鲁白这两位在国际上都很有影响力的神经生物学家，还有谢宇这位社会学家一起创办的。分子生物学的重大成果，他们本门功课，而且因为几位科学家名望算中国顶尖的，又是最先报道，所以韩春雨受关注度一下就高涨起来，在那篇报道中评价韩春雨的NgAgo基因剪切技术是超越诺奖级别的，这已经够轰动了，而且还不止这些，因为这么好的成果是一个实力很弱的河北科技大学的一个很不受重视的副教授做出来的，自己掏腰包买试剂，欠了30万块钱的实验材料费用，这就反映不少问题，比如科研经费分配合理不合理，默默无闻的科研工作者有没有机会做出好成果。


    这波讨论在韩春雨NgAgo能不能被复现之前就已经开始发酵了。而且据说6月份的时候国务院的有关部门已经开始重视韩春雨了，7月13号他就突然当选了河北省科协副主席，8月9号资金到位了，河北省发改委批复同意总投资2.24亿人民币，建设河北科技大学基因技术研究中心，另外还有2000万是财政部拨款专门买设备的。这些是政府行为出奇的快。此时为止，就是这个事件令人鼓舞的大部分了。此后所有都是质疑，最早的实验室质疑是5月27号中科院上海分院的一家实验室，说按照韩春雨的方法没法复现结果。此后零零星星的质疑越来越多，国内和国外的都有，韩春雨本人在百度贴吧，知乎上都有账号，也都回应了，最开始的回应是，做复现实验的人应该注意细菌培养时不要污染，这是一个关键点，但实际从同行的评论看，这个实验过程和设备要求都很普通，没有太多难以把控的复杂过程，一个研一的学生都可以独立操作，但韩春雨说买来的格氏醋酸盐杆菌大都感染了支原体，这是导致实验失败的原因。而其实很多宣布实验不能复现出来的实验室都是国内还有国际顶尖的分子生物学实验室，他们不可能同时在这个不怎么复杂的实验上同时犯严重的低级错误。这就更加重了整个科学圈对韩春雨的质疑力度了。


    他们都要求韩春雨公布更多实验原始数据，韩春雨之后又多给出了几个建议，咱们行外人不一定看得懂，但是同行对这5点建议是，这些注意事项也不是什么很特殊的技巧啊，大家早就都在用了啊。越来越多的实验室没法复现这个过程并不复杂的实验，韩春雨在6月22号的一次中科院演讲中回复下面听众答疑时说，现在没有做出来和做出相同结果的实验室比例是3比1，已经有20家做出相同结果了。


    卓克


    这件事情推波助澜让更广大吃瓜群众知道是7月初方舟子发了一篇长文，质疑韩春雨的实验造假，而且把实验数据中哪张图，如何造假都做了仔细的分析。方舟子的专业和韩春雨的差不多对口，他的学术打假可以说从没失手过，只有个别其他人打假的投稿出过一次错误，他还道歉了。所以这在围观群众中差不多就算是定性了。


    7月份国内影响力比较大的南方都市报，财经网，澎湃新闻还有科研圈和知识分子有同样重量级别的赛先生都报道了《韩春雨这个实验在国内外无法复现》的情况。就在这时，韩春雨当选了河北科协副主席。到了8月2日，因为质疑声太多，河北科技大学发了声明，说在一个月之内韩春雨会公开验证，届时会有第三方作证。但是到了9月2日并没有看到什么。


