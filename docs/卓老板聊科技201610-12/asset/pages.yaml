  md: '# 问答：以面食为主的饮食习惯好 不好？


    noasquare：《谷物大脑》里面讲的吃面粉和谷物得糖尿病的概率如果很大的话，那北方人岂不是都躺枪？


    以面食为主的饮食习惯好… ↓


    # 卓克


    其实我在8月1日那期回复听众里已经说过特别火热的《谷物大脑》这本书是不是靠谱了，但在后来的两个月中至少又有十多个人问过我类似问题，而正好，就在前几天方舟子也仔仔细细评价了这本书，所以为了回答大家的疑问，我转述给大家，这个分析比我的之前回答的那个细化太多了。


    看过这本书的人都知道，这里里面说谷物会对大脑造成永久的损害，导致阿尔兹海默症，慢性头痛，失眠，焦虑，抑郁，癫痫，运动障碍，精神分裂，注意力缺陷，这些都是和大脑关系紧密的疾病。而且不光是谷物，水果和碳水化合物也有这样伤害大脑的效果。坏处还不止这些，还有加快身体老化，让人肥胖，得关节炎，糖尿病，其他慢性疾病。然后书里给出了一套健康饮食的标准，就是每天只吃非常非常少少的碳水化合物，具体来说就是不超过60克，然后多多的吃植物油和肉，让这些东西成为主要食物。这样吃就对大脑有益处。


    方舟子评论，首先一点不合理就是这些饮食建议和主流医学界推荐的均衡饮食大相径庭，这个在我8月1号回复听众的那期说了，然后说了一个小问题，就是按照书里建议的方式吃会出现明显的酮体中毒的现象，酮体是在脂肪分解过程中产生的，血液中如果含量高就会感觉恶心，头疼和口臭，同时又缺少葡萄糖的话，大脑得不到糖的能量，身体就会分解更多脂肪产生酮体，这对身体是有害的。而书里建议的高饱和脂肪酸饮食，会增加心血管疾病，这在医学界是公认的极不健康的饮食。应该怎么才健康，别想那些旁门左道了，就是按居民膳食指南吃就最健康。


    方舟子的辟谣更有力的来自于对作者的深挖，David Perlmutter 是作者，1981年获得迈阿密大学医学院博士学位，专业是神经外科。1987年获得行医执照后开私人诊所。从1996年起开始以营养对神经病症的内容频繁做演讲，出畅销书。一个神经外科医生当然可以转行营养学，但能不能被学术界认可，主要看你在营养学领域的研究成果是不是被同行高度认可。他在介绍自己学术成就中，列了四份刊物，《神经外科杂志》《神经学档案》《南方医学杂志》《应用营养学杂志》，其中最后那个《应用营养学杂志》早已停刊，而且没停刊时也没有被收录在正规学术期刊中，算是一本水平比较差的期刊。而在另外三个和神经相关的杂志，他所说的发表论文，实际上都是在他学生时代的内容，也就是1982年到1987年的文章了。没有一篇和营养相关。基本都是外科手术的内容。


    在他的履历中，他还介绍自己发表了24篇期刊论文。方舟子帮他挨篇统计了，其中10篇是当学生时写的神经外科的内容。8篇是发表在专门推销另类医学的非学术期刊的杂志上，2篇是新闻访谈，1篇是读者来信，只有2篇是和营养相关的，发表在和营养学有关的期刊上，就是那本水平比较差，而且早就停刊的杂志上那两篇。所以可以这么说，这个人在营养学上没有学术成就，但是如果你作为医生，推荐大家按照膳食指南吃，这不需要什么学术背景，这是医学界公认的健康饮食。但现在的问题是你提出的论点是和主流医学界完全背离的，特别的主张你就得有特别的证据支撑，可他在营养学上又没有什么学术背景可言。所以这是疑点之一。


    疑点之二是，他在拿到行医执照后，唯一做过的论文是2009年发表的，那篇文章是通过注射一种肽来治疗帕金森病的初步研究，离开学术界22年，之所以又发了一篇论文，其实背景是，他在2009年曾经鼓吹那种肽可以治疗帕金森病。不过他在那篇论文中作者顺序排第三。也就是比较次要的位置。当时在履历里他把自己列成了第一了。更可笑的是，这项研究的结论是，这种肽对治疗帕金森根本无效，连初步的有效性都看不到。这和他鼓吹的观点正好相反。这位作者帕尔玛特从2000年起陆续出健康养生的书，比如
    大脑复原.com 主要内容方向就是制造一些阴谋论，比如，主流医学界的研究都受到了企业资助，有利益关联。在那本书里他的观点是，饱和脂肪酸、动物脂肪、胆固醇才是大脑的杀手，应该尽量避免，提倡最好的饮食是素食加鱼肉。这和他这两
    年畅销的《谷物大脑》正好相反。


    所以结论，这人不可靠，和每年风靡的各种养生大师没太大区别。他们的方式都是宣扬跟主流医学界建议格格不入的标新立异的饮食观念。目的呢？您看看谷物大脑这本书背后那几十页的各种饮食推荐菜单就知道了。


    如果您有耐心，也可以像我似的，看看故意列上去的那几十页的参考文献，虽然数量极多，但都和他书里的主要观点无关。都是一些不痛不痒的陈述中提到的医学结论。也有人听到方舟子这三个'
