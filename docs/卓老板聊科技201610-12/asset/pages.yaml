  md: '这个问题非常好，因为熵本来就是物理学概念，不是文学，要定量描述才会让人有所感受。所以我专门用一个例子把这个问题解答了一下，因为涉及的内容根本无法语音化，所以感兴趣的听众可以看这期资料里的内容，就是如何从状态数计算出熵。如果您能用心看完相信会比只听节目的收获大。对熵这个概念来说，乱用的情况比较多，比如，什么东西一增加，一增长，就说是熵增加了，这都是过度解读。如果真要讨论熵增加，那么也得先从S=kLnW公式开始定义，我们讨论的例子里要知道谁是S，什么是状态数，状态空间的边界是什么。否则聊了半天也是一场空，就像文学里的有序和热力学中的有序不是一个“有序”那样。


    这方面我们听众里也有做的非常好的，胡萌同学的做法值得每个打算继续花功夫的人效仿，他听了混沌那期节目后用excel做工具算了一下那个包含x^2的迭代公式，复现了节目里的内容，Xn的值随着R的增加刚开始缓慢增加，超过2以后开始在几个固定值上振荡，他做了100次迭代，观察到了大致的趋势，因为excel并不是一个数学工具，不方便迭代几千次，但已经通过自己的实践产生了混沌，这种做法收获也一定是最大的，他后来还看了bbc拍的纪录片《神秘的混沌理论》继续加深了理解，我也顺带向大家推荐这个纪录片。更向大家推荐胡萌的思考方式。


    # Ⅰ 例子：通过状态数计算熵的值


    随机扔10个硬币，统计正反面结果，每种组合是一种状态。


    扔出10个正面，对应几种状态？只有1种。


    扔出9个正面+1个反面，对应几种状态？10种。


    扔出8个正面+2个反面，对应几种状态？45种。


    ......


    扔出5个正面+5个反面，对应几种状态？252种。


    ......


    扔出2个正面+8个反面，对应几种状态？45种。


    扔出1个正面+9个反面，对应几种状态？10种。


    扔出10个反面，对应几种状态？只有1种。


    所有结果是这样。


    所以每种状态对应的情况如下表：


    | 正 | 反 | 状态数 | 概率 | 熵=k×ln(状态数) |

    |---|---|---|---|---|

    | 10 | 0 | 1 | 1/1024 | k×ln(1) |

    | 9 | 1 | 10 | 10/1024 | k×ln(10) |

    | 8 | 2 | 45 | 45/1024 | k×ln(45) |

    | 7 | 3 | 120 | 120/1024 | k×ln(120) |

    | 6 | 4 | 210 | 210/1024 | k×ln(210) |

    | 5 | 5 | 252 | 252/1024 | k×ln(252) |

    | 4 | 6 | 210 | 210/1024 | k×ln(210) |

    | 3 | 7 | 120 | 120/1024 | k×ln(120) |

    | 2 | 8 | 45 | 45/1024 | k×ln(45) |

    | 1 | 9 | 10 | 10/1024 | k×ln(10) |

    | 0 | 10 | 1 | 1/1024 | k×ln(1) |


    画成曲线如下图：


    ![](img/72b394a82026978f467d7c86ddc01c35_56_0.png)


    从这个例子我们可以看出正反各5个面的概率出现有最大可能。全正全反可能性最小。这仅仅是10个硬币的情况，而一般宏观物质里的微观状态数是比较多的，比如1ml水中有水分子10^24个分子，我们可以假设他们如果也是每个分子有“正反”两个状态数的话，那么所有分子都处于同样状态的可能性非常小。而分子的状态并不是“正、反”，往往是用位置，或者能量状态，所以数量真的统计下来，S=K·ln(W)，实际上是比较难列出来的。


