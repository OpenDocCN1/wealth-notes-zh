  md: '# 讨论：新闻、社交App会导致思想退步？


    二当家的：今天在《第一财经周刊》16年45期的14页看到这样一段话：西方媒体还在进一步思考Facebook们根据用户习惯推送偏好消息，是否会导致一种封闭世界观的形成。从而成为看不见的手影响社会事件的走向。我曾经很长时间拒绝使用得到App，就是担心得到上的内容与我的基本道德观和价值观太相似，自己一旦使用得到App之后，看得过瘾，听得爽快，会变得懒惰，形成依赖，严重影响自己博览与兼听。坚持了很久，还是下载了得到App，还好，内心有警惕就可以在某种程度上避免自己被相似的价值观所束缚。


    新闻、社交APP会导致思想...


    # 卓克


    有关老众二当家的留了这么一条评论我觉得很好，他在《第一财经周刊》看到一段话，“西方媒体在进一步思考Facebook根据用户习惯推送偏好消息，是否会导致一种封闭价值观的形成，从而变成一只看不见的手，影响社会事件的走向。”


    二当家的说他很久以来拒绝用得到App，就是担心这上面的价值观和他自身太相似，一旦上瘾，人会变懒惰，形成依赖，影响自己博览与兼听，即便现在已经在用了，还是时刻保持警惕，不要被相似的价值观绑架。


    这方面我是这样看的，能有您这样警惕性的人是很少的，这种警惕性也是很有益处的，时刻保持适当的怀疑、自省，能做到这样也十分难得。您连用App都保持这种思考方式，那就能更抵御劣质内容带来的危害了。西方媒体思考的，根据用户习惯推送是好还是不好，我觉得这和保持适当的怀疑精神并不矛盾。


    怎么说呢，对于有这样精神的人，就算  是指推送同一类内容，甚至是同一个口味的内容，这个人的思维习惯也会导致他时不时地查询反面意见，主动去搜那些不在自己熟悉领域的
    内容。现在不 只是Facebook，国内的很多新闻客户端也是这样做的。我们脑子里的内容分类也许是一种理想化的概念，实际上真正论某类内容仅仅局限在某一狭窄领域的，只有学术论文了。大部分大众类内容会涉及很多方面，尤其像社会评论类  的。从另一个角度看，普通人你就是强制推送他们不关注不关心的
    内容，他们也 会忽视，就像以前的报纸，每个人手中 的报纸都一样，大部分人翻过几十版的 版面也就看其中十几版，剩下的也不 看。


    我觉得更重要是，它筛选出来的，推送给你的内容质量高不高，这才是对全 体国民影响最大的。比如像现在某些 APP，已经是国内新闻客户端最大的号 了，全国几亿人每天接收到的相当比如例的信息、观点和导向，就是它起到
    的主导作用。它的影响力比20年前任何一 份报纸都大。那么它会不会反思，是 不是要继续无休止地满足没有太高素质、 又缺乏耐性的人的阅读习惯呢？要不要 把更俗中透俗的，或者博眼球的精神刺
    激的内容大量推荐出去呢？还是说，自 己已经成了平台巨头，不需要再拼命追 求流量和在线时长了，要实现更大的价 值，能起到教育民众的作用，专门安排 一些深刻的、唤起人们心内的美好，引
    发理性思考的新闻内容推送出去呢？虽 然相比低俗内容，阅读量会少很多。


    但这也存在着天生的限制，我想很多从 中央出来出来的新闻人都会有触动。即便现 在有App了，有直播，有网上视频节 目，但只要要覆盖大多数人，国家的新 闻管制就会出现，把它纳入管理体系
    中。因为国体不一样，所以在中国是有 禁止讨论的内容的。我相信做新闻的人 和其他行业一样，至少有一小部分是有 新闻理想的，想挖出真相，剖析现实， 做新闻有很多条路可走，这是其中一条
    路，但是因为以上因素，这条路走不了 多深多远就走不通了。众媒媒体又是处 于商业竞争的环境下，那大家只好在其 他可选的路上竞争了。竞争什么呢，娱 乐八卦嘛，这个方向没有太多限制，所
    以这方面内容发展得枝繁叶茂。


    像这位听众说的，会不会导致一种封闭 的价值观形成呢？在中国，封闭的价值 观早已形成，原因不是App或者媒体一 味地按照订阅者的喜好推荐内容。我们 的封闭价值观是由内容限制形成的人，大
    众都封闭在戳的价值观下，新闻理想、 匠人理想、科学理想、冒险精神和独抒 精神就从价值观的选择中渐渐消失了。


    但我对这件事情不悲观，如果拿现在的 媒体内容和5年前比，还是有整体提升 的。现在和30年前比，言论也自由多 了。我觉得这和经济发展分不开，所以 社交媒体的智能推荐会不会导致封闭价
    值的出现，可能还不是我们现阶段担 心的。其实担心这件事情的人本身有免 疫。不担心这事的人只会受大环境影 响， thrust不来。


    好，这个话题就讨论这么多，欢迎大家 留下自己的看法。欢迎大家把感受写在 评论里，尤其是写在最新版本得到APP 的1917小组讨论模块里。


