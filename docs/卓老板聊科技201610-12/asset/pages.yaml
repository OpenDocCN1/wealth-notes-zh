  md: '# 补充：睡眠基因找到了


    睡眠基因找到了


    上周节目里有一个知识点不知道大家还有没有印象，就是遗传算法生成的最优解是不可约化的。我们想通过线性思维，通过几条特征，全面描述最优方法，这是徒劳的，但我们依然可以凭借经验分析出最优解在哪些方面更优秀。为了验证我们的判断，可以采用类似基因敲除法，把这个特征去掉看看，得分是不是降低了。


    在这个例子里我们提到了睡眠基因被找到了，这期我就把这个基因的成果介绍给大家，这项研究可以算最近十几年在睡眠上最重大的突破了。2016年11月初发表在《自然》上的，由日本科学家柳沢（ze）正史的团队做出来的。


    他们是用小鼠做研究对象的，先利用化学试剂诱导一堆小鼠产生基因突变，这种突变大都是有害的，后代估计就是有的瘫腿，有的瞎眼，还有超级爱睡觉的。这个实验一共用了1万多只小鼠，所以光是养老鼠，筛选品种的工作量就不可想象了。小鼠是不是处于睡眠状态是用脑电图判断的，所以比从前研究睡眠用果蝇要准确的多，判断果蝇睡不睡觉，你又不是果蝇，你怎么知道人家爬在那10分钟没动就是睡着了呢，也许就是跟那儿歇会儿。他们从上万只小鼠中找出睡眠时间明显长的，即每天只有7、8个小时是清醒的，正常小鼠是13个小时清醒。而且这些嗜睡的小鼠就是清醒的时候脑电波中慢波活动也比正常小鼠多得多，这就说明它们清醒时也经常犯困，如果逼迫它们长时间不睡觉，之后睡得更凶，也就是说这组筛出来的小鼠非常非常能睡。


    找到这些小鼠后再专门培育它们的后代，看看是不是也这么爱睡觉。如果是，就说明很有可能这一支，这一谱系小鼠爱睡觉是基因决定的。嗜睡基因定位后给它起名叫Sik3，这个基因处在内含子上，之前咱们说过，有些DNA上的基因表达蛋白质，有些不表达，表达的只占全部碱基对的2%不到，不表达的那部分中有些叫内含子，它们虽然不表达具体的蛋白质，但是会影响指导其他蛋白质的表达。Sik3上的不突变时，Sik3蛋白正常表达，但是
    ...


    到了这，这项成果的第一阶段达成，如果到了这就停止，那重要意义也到不了十几年来之最。他们第二阶段的工作是探明这个蛋白质和睡眠是一种什么关系，这有点像镜头前的滤镜...
    今后也许能发展出控制睡眠时间的药物了。


    另外一个重要发现是，Sik3基因可不止小鼠有，人也有，果蝇也有，甚至线虫也有，也都是对睡眠时间起作用的。甚至我们可以说，这可能是生命底层设计中的一个重要环节，并不是发展到高等动物后才出现的。而原本睡眠就是一种在生物圈非常普遍的行为，如果细想你才能体会到睡眠的重要性，睡眠状态时几乎完全没有防御能力，而且睡眠往往占生命总时长的三分之一。这么脆弱，这么容易受攻击的状态竟然在进化中得以保留，那一定包含了一种生死攸关的功能，以至于获得这种功能后的收益远比每天保持三分之一不设防的风险要大。这些是一些发散型的思考，留给大家。


    现在生物学家们正在沿着这个结果往深入找，就是为什么Sik3上外显子第13个转录时缺了一段，导致一个丙氨酸没法被磷酸化，进而表现到生物体上竟然是一个睡眠时间的长短的区别？我...
    如果只给你一个衍射图，你是没法推导出晶体微观结构的。


    目前的分子生物学就处于这个阶段，一个点位上的氨基酸没法被磷酸化，中间经过一个怎样的黑匣子，从另一边就出现了睡眠长短的差异呢？所以我想，人类下一个文明的突破就应该发生在...
    好，上期关于睡眠基因这段就补充这么多。'
