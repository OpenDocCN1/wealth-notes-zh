  md: '# 杀死癌细胞之放射治疗


    ![](img/72b394a82026978f467d7c86ddc01c35_15_0.png)


    杀死癌细胞之放射治疗


    # 所有动物都会得癌症


    +   1. 多细胞动物的发育会导致不同细胞出现分化，那么多的细胞分裂、死亡就必然会出现癌细胞，但绝大多数癌细胞会被体内免疫系统杀灭，只有少数会发展成癌症。\n2.
    癌症大都从40岁后出现，因为人体是一个十几万年前设计的机器，这部机器的设计寿命是30年，虽然不一定过了30年就报废，但起码我们还没进化出一副清除30岁以后体内癌细胞的机制。\n3.
    癌症的根源是我们的进化，现代生活下的环境、食物、压力只是癌症高发的诱因。


    # 最初治疗癌症，越切越多


    +   1. 二战前女性最主要的癌症是乳腺癌，男性最主要的癌症是胃癌，但后来变成了肺癌，这主要是因为吸烟造成的。\n2. 最初治疗癌症的手段是外科手术，1840年左右就实施过肿瘤切除手术，那个年代离抗生素大量使用还差100年，外科手术只有麻醉和消毒术。\n3.
    最初手术只切掉病变部分的组织，但是很容易复发，后来为了治疗乳腺癌就越切越多。到了1907年乳腺癌患者手术后把整个乳房、锁骨，胸小肌、胸大肌、腋窝锁骨窝的淋巴都切除。\n4.
    接受大面积切除的病人就算治好了乳腺癌，也留下了严重的身体残疾。质疑声不断，但医生们仍然采用这种激进的方法。


    # X射线在物理学上的进展推动了癌症治疗


    +   1. X射线在1896年发现，特斯拉虽然两次错过了发现它的机会，与诺贝尔奖失之交臂，但他最早注意到它对人体的危害，并写了论文发表了。\n2. 就在当年芝加哥医学院的一名学生格拉注意到X射线与人体危害的论文，认为X射线有杀灭细胞的作用，于是找来一名晚期乳腺癌患者做了人类第一次放射治疗。\n3.
    虽然第一次试验很粗糙，效果也非常有限，但这启发了无数医院和公司。


    # 居里夫人推动了γ射线治疗


    +   1. 居里夫人发现镭，提纯镭的故事为许多人所知，但这个科研项目对他们的副作用并没有太多人注意。皮埃尔居里因为胸前口袋放了几十毫克的镭，在前胸就出现了永久的疤痕。居里夫人中年后患了白血病。\n2.
    第一个做放疗的格拉比因为一辈子研究放射疗法，他的手指在中年后接连被截肢，脸上也长了肿瘤，被切除的面目全非，最后在1960年死于癌症扩散。\n3. X光、γ射线、FM广播信号、WIFI信号、可见光、紫外光、红外光都是电磁波，唯一的不同是他们的波长。每一个都有自己的波长范围，并不是一个固定波长。\n4.
    最弱的X光是最强的可见光强度的四十多倍。最弱的γ射线强度和最强X光强度相同，都是最强可见光的四千多倍。而让居里夫人受伤的γ射线是最弱γ射线强度的150倍。\n5.
    因为比X射线能量高，γ射线，甚至中子束、线性加速器等设备也用在了放射疗法中，原本这些东西都是粒子物理的实验设施。\n6. 放射疗法之所以有效，是因为正常细胞比肿瘤细胞的DNA的修复能力更强，肿瘤细胞对DNA的损伤更敏感，所以采用间歇性的放射疗法，健康细胞恢复更快。连续治疗下肿瘤细胞就会被更多的杀灭。


    # 质子放疗、重离子放疗


    +   1. 这是目前放疗中最先进的方法，也是最昂贵的。在日本最便宜的一个疗程20次放疗20万元人民币，上海已经建成中国第一座质子疗法设备，一个疗程接近28万人民币。设备本身10-15亿人民币，年维护费用一千多万。\n2.
    质子疗法的优势在于他打入身体后只有指定深处的组织会受到最大的能量，沿途被杀灭的无辜正常细胞比较少。\n3. 质子疗法比传统放疗对中度、高危病人效果更好，他还会配合其他疗法，不是单独的治疗方案。\n4.
    质子疗法之所以能出现是因为1940年后量子力学的成熟，人们可以计算出质子射入人体后出现的各种情况。


