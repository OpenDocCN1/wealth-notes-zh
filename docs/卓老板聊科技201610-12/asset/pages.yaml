  md: '# 构成世界的元素从何而来？


    构成世界的元素从何而来？


    # 科技的提升是台阶式的


    +   1. 莱特兄弟第一次的飞行高度是3米，发动机动力是8.8千瓦，过了58年，土星5号把阿姆斯朗送上了月球，它的一级火箭动力达到了1.3亿千瓦，装满燃料后的火箭有3000多吨重。


    +   2. 自从登月后，同样是过了55年，到 强


    # 元素是从哪儿来的


    +   1. 1937年以前，科学界对元素是怎么诞生的有一个统一的结论：所有元素自从宇宙诞生之时就和现在的一样多。但之后 B2FH理论让人们改变了观念。


    +   2. B2FH理论是以4个人的姓氏开头命名的，这篇论文中四个人的贡献差不多大，这种文章在科学史上并不多见。这个理论的大致意思就是告诉我们元素都是在恒星内部试炼出来的。


    +   3. 这四位作者中只有作者 “H” 获得了诺贝尔奖，另外三个人没份，这也算诺贝尔奖的一次失误了。


    # B2FH理论说了什么


    +   1. 宇宙大爆炸提供了氢和氦，在1939年时人们才知道恒星燃烧的能量是通过氘核聚变产生的，这种反应会生成氦。氢元素也会消耗完，耗光之后还要看剩下的物质质量是不是足够大，如果足够大，还会把氦压在一起聚合更重的元素，锂、铍、硼、碳元素才会诞生。


    +   2. 以太阳为例，它到现在已经烧掉了所有可用的氢元素的50%，再有50亿年会进入燃烧氦的阶段，那时候整个发光的状态就发生巨大改变，整个太阳系就很难有生命存活了，这就是太阳系生命史的终结点。太阳最终会变成一个以碳为核心的白矮星。


    +   3. 质量是太阳8倍以上的恒星会继续合成更重的元素，质量越大，合成重元素的速度就越快，最终走到铁元素这一步，就达到合成的终点了，铁是26号元素。


    +   4. 铁不能继续发生聚变反应是因为把铁中质子和中子拆出来的能量比铁聚合重元素产生的能量还要大很多，所以铁核极为稳定。如果想合成更重的元素需要外来更大的能量。这种能量来自于超新星爆炸。


    +   5. 当核心物质被压到中子状态的时候，核心体积会大幅坍缩，密度会是之前的几亿倍，外围的物质会以极高速垂直入中子组成的地面上，然后发生剧烈的爆炸和反弹，这些能量就可以让铁合成更重的元素，铜29号、银47号、白金78号、黄金79号、水银80号、铅82号就是这样来的。


    # 太阳系是怎么形成的


    +   1. 太阳系源于46亿年前两颗在太阳系附近爆炸的超新星，它们爆炸后的部分尸体形成了现在的太阳系，爆炸后尘埃曾经弥漫在现在3个太阳系直径的圆面上。


    +   2. 尘埃在温度足够高的时候会旋转凝聚成团，一旦这个过程开始了，就会快速形成星体，太阳就是这片尘埃形成的物体中最大的一个，木星是第二大的，其实木星有机会形成太阳系内第二颗恒星，只要他的质量再增加80倍。


    +   3. 星体的质量达到太阳的12分之一就可以在内部发生核聚变反应，这就是恒星的及格线，宇宙中双星系统很普遍，对银河系的研究中发现有大约35%的星系是双星系统。


    +   4. 木星因为质量不够，所以内部的氢并不会聚合氦，能聚合氦的氢也不是气体状态，而是液态。木星大气层5万公里的厚度大都是氢，再往下才是其他重元素，比如氢和氦，它们在那个深度会不断的发光，霓虹灯就是氦发光的效果。


    # 地球的年龄和铅元素的故事


    +   1. 地球之所以能测定年龄，还拜他是岩石行星所赐，因为在这种行星上物质分布更加不平均，同结构物质更容易聚在一起生长。铅就是测定地球年龄的重要元素。


    +   2. 铅有3种型号（同位素）：204/206/207，其中204是自从地球诞生后就有的物质，而且含量不变。但206和207只有部分来自于地球诞生之时，还有一部分来自于铀元素的衰变。


    +   3. 铀元素衰变的速率物理学家们已经准确测定了，所以如果存在地球诞生之初206+207与204的比例数据，就可以计算出地球年龄，这个貌似不可能的任务由陨铁来承担。


    +   4. 地球年龄推算是 有前提假设的，就是太阳系大部分星体是在同一时期快速形成的，这样从宇宙空间中坠落到地球上的陨铁和地球年龄也大致相当。但铀元素因为结构不同不存在陨铁上，铅反而会和铁抱团在一起生长，所以陨铁上的铅204、206、207维持了地球诞生时刻的比例，这样就可以通过衰变率计算地球年龄了：45.5亿岁。


    +   5. 测定地球年龄的科学家皮特斯因为被当时环境中排放的铅污染困扰很久，后来成为了一名社会活动家，他后半生的成就就是'
