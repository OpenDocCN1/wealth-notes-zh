  md: '# 网络思维与复杂性


    网络思维与复杂性


    # 蚂蚁的网络世界


    +   1. 蚁后是雌蚂，它们的从蚁巢中飞出，以千分之几的存活率在其他地方开辟新的蚁巢，自己也从普通雌蚂变成了蚁后，拥有超过30年的寿命，而工蚁（一种没有发育完全的雌蚂）的寿命只有3-5年。

    2. 蚁后自从开始产卵就居住在蚁巢中一栋大房子里，它此后的一生也不会出屋一步，它无法了解外面的世界，也无法对其他蚂蚁发号施令，一生的任务只有吃饭和产卵，“蚁后”的称号一点都没有尊严，完整是一台生育机器，一个生育奴隶。

    3. 工蚁的数量占蚁窝所有蚂蚁数量的70%以上，它们负责整个蚁窝生活的维持工作。工种分五类，窝内蚁、清洁工、建筑工、侦察兵、搬运工。

    4. 工蚁的工种存在优先级，窝内蚁 < 清洁工 < 建筑工 < 侦察兵 < 搬运工，下一级工种的蚂蚁经过一段时间可以升级到上一个工种，升级后就不会再降级。当某一工作量猛增后，下一级工人会放下当前工作协助上一级工人一起劳动。搬运工负责搬运食物，等
    级最高，即便其他工作需要人手，它们闲下来也不会帮忙。

    5. 蚂蚁通过头上的触角交换费尔蒙，这是一种信息素，蚂蚁只通过它旁边的蚂蚁了解蚁窝的信息，这里没有指令处理中心，也没有哪个蚂蚁是总司令。蚂蚁世界的信息网络是单个个体的互相连接形成的。


    # 不一样的网络思维


    +   1. “网络思维”最早是由两篇物理学领域的论文引发的。当时《小世界网络的集体动力学》和《随机网络中标度的涌现》一篇发在Nat ure上，一篇发在Science上，引起了很多科学家的关注。

    2. “六度分割”理论说人和人之间距离不超过6个人，原本是一个普通的研究，后来被各种营销课程当素材，篡改其中数据、结论，增加自己的臆断，最终变了味儿。这个研究是一九五几年做的，当年研究中有大量信件转手次数远超过6次，还有更大量信件根本没有被收到。

    3. 网络思维重视个体间的关联，比如人与芜菜都有23000个基因，但是人的复杂性远超过芜菜，一种观点认为，人的复杂体现在基因关联远超过芜菜。


    # 小世界网络


    +   1. 在一个网络中，随机把5%的短程连接改成长程连接后，平均路径长度会大幅下降，增加网络内消息传递效率。这就是小世界网络，它最早发源于1999年的《物理评论快报》上。

    2. 生活中的人际关系网就类似小世界网络，这里大部分人拥有较少的交往关系，少数人拥有大量交往关系，他们的存在让信息交流效率提高。

    3. 自然界出现小世界网络的原因：有高效传递消息的刚需和维护长程连接的高成本。所以最终只有少数大节点。

    4. 工程类网络就在研究小世界性，比如电网和互联网，都需要尽量快的走完路径，这样可以节省变压器、变电站、路由器等设备，减少延迟和线上损耗。这些网络结构因为是我们一手搭建起来的，所以更加符合数学模型。

    5. 小世界网络的脆弱体现在大节点失效上，如果有人蓄意破坏大节点，网络会陷入瘫痪。


    # 无尺度网络


    +   1. 无尺度网络和小世界网络有一点相似：都存在少数大节点，但无尺度网络从任意尺度看，大节点所占比例都是相同的，这个比例结构上的自相似和图形上的分形结构很像，分形结构是图形上的自相似嵌套，无尺度网络是比例上的自相似嵌套。

    2. 无尺度网络更加坚韧，随机选取一些节点删除除了整个网络的属性和重要参数不会大幅改变，因为总有小一些的节点承担这些负担。

    3. 互联网上的网站，入链接数量呈现无尺度网络特征，这个发现最早引起了谷歌创始人 的注意，他们通过分析每个页面入链接的特征矩阵，为搜索结果排序提出了新的算法，大大超越了上一代以关键词分类为基础的搜索结果排序法。


    # 复杂结构中的网络


    +   1. 生物代谢网络中把反应物和生成物当做节点，把反应当做连接关系，经过研究发现这个网络也呈现无尺度网络特征。从微生物到哺乳类动物的新陈代谢反应物和生成物存在几个大节点，它们是磷酸、果糖、葡萄糖这样的东西。因为这些物质在地球上
    有合理的稳定性和活跃性，所以可以保证长程连接的存在。

    2. 疾病传播中把感染者和被感染者当做节点，传染当做连接关系，这个网络也符合无尺度网络特征，预防艾滋病的新思路是控制大节点，比如增加平均路径长度，提高传染门槛，再辅以全民防控，这样
    的效果非常好。


    # 对网络思维的质疑和否定


    +   1. 复杂性研究的开创地，最有发言权的圣塔菲研究所的研究员表示：无尺度网络被滥用，这是一种对研究者的侮辱。

    2. 现实生活中很难有符合网络数学模型的例子。在现实生活中，事物的连接有强弱之分，被当做节点的个体也有类型之别，自相似嵌套也不严格相似，甚至嵌套只有3-4层，根本谈不上分形。

    3. 不少营销类培训利用蝴、非线性、小世界性、无尺度网络等名词作噱头，身披科学外衣宣传伪科学，更应该提高警惕。


