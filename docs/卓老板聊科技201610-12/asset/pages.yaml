  md: '的电阻为零，我们就可以继续提高电流、加高频率，发热的问题也就迎刃而解了。有人可能知道另外一个实现电阻为零的方法，那就是超导，但超导需要低温环境，这不太可能在几厘米范围内的CPU中实现。但量子霍尔效应也被卡住了，它卡在哪个呢？就是实现它的必要条件是得有超强磁场，这一般都得配一个车间那么大的磁场发生器才可以，这样的东西也不可能进到CPU里面。


    这时候今年的诺贝尔奖得主邓肯·霍尔丹，就用他新的数学工具计算出，其实量子霍尔效应还有一个更加奇特的情况，就是在不用外加超强磁场的情况下，甚至连一点磁场都不用加的情况下，也能实现量子霍尔效应，也能在某个方向上，出现电阻为零的情况。


    如果没有这种新的数学工具拓扑的引入，从前的人是不可能通过原有的物理学预测到有这种物质存在的，这种新的效应就被称之为反常量子霍尔效应。反常量子霍尔效应对材料有2个要求：一个是边缘导电而内部绝缘，二是材料自身有磁性。世界上这种物质吗？很多年来没有人找到，但大家都根据今天被颁发的科学家的理论知道了，先得找到一种叫做拓扑绝缘体的物质，这种物质天生就已经满足了第一个条件，就是表面导电而内部绝缘。它还差了一个条件，就是自身有磁性。


    拓扑绝缘物质有一点像一个镀了金的瓷碗，这个外层是金，导电，内部的瓷是绝缘的，但金碗是我们后续加工之后的东西，镀层脱落了就没有这种性质了，但是拓扑绝缘体可不怕外层脱落。比如说，当你把外层用砂纸打磨掉，原本是内部的东西，裸露出来之后，当它成为了表面，就马上又变成了导体。这有点不可思议，这就像有时候我们吃面包抹黄油，你随意切了一片面包，结果就在截面上自动生成了一层黄油那样。


    拓扑绝缘体就是今年颁奖的拓扑相物质理论中预测出来的、计算出来的，具体什么物质什么材料才会这样呢，很久以来谁也不知道。可没想到，这种物质竟然就隐藏在普通材料里。比如像硒化铋，碲化铋，碲化锑，您听着跟绕口令似的，可能一辈子也用不到这些词，但实际上这些物质在半导体领域是常见的。现在2个条件里，还差材料自身有磁性，还没满足。


    刚刚说的绕口令似的材料是没有磁性的，只能通过掺杂有磁性的材料来实现，就是往原有材料里像撒胡椒面一样，往里撒进一些有磁性的东西，但这一步可没有做酸辣汤那么简单，洒了胡椒粉就有辣味。因为按原有量子力学的理论，一旦掺杂了其他物质，原本基底的那些材料，很多特性都会发生改变，比如我们好不容易才得到的外部导电+内部绝缘的特性就很可能丢失了。这就好像我们往酸辣汤里加了胡椒粉，一下就变成了鸡蛋汤。


    但在在新数学工具下的拓扑相变理论中，外部导电+内部绝缘的特性是不会在掺杂后消失的，您就放心地加佐料吧。


    结果就在前几年，中国最先做出了真正可以实现反常量子霍尔效应的材料出来，是在拓扑绝缘体里掺杂了金属铬实现的。


    这就是今年这个令人费解的拓扑相变理论，应用的例子，让我们再回到实际的利益中去，现在反常量子效应的2个条件都已经满足了，零电阻可以不需要庞大的磁场发生器来实现，一个指甲盖大小的区域就能实现零电阻。也许今后我们手机芯片利用这个技术可以让性能和现在的天河二号超级计算机比拟。


    这次的诺贝尔奖让我们又一次感受到数学的重要性。微积分是牛顿力学的基礎，黎曼几何是广义相对论的基础，微分几何是弦论的基础、量子力学的发展，不太一样，它是在不断地进展，每次进展都有新的数学工具加入，比如说矩阵啊、群论啊，在1980年后，拓扑学也加入了其中。我们还能期待什么呢？数学中最大的一个分支叫做数论，它经过了2000多年的发展，仍然还站在物理学的大门外张望，什么时候数论应用到物理学，一定是一个让诺贝尔奖都引以为荣的时刻。


    今天就说到这，明天继续给你讲今年的诺贝尔化学奖。


