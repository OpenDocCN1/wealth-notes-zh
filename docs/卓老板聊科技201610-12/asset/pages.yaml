  md: '# 问答：氟利昂导致臭氧空洞是谣言吗？


    喵子sama: 卓老板提到臭氧空洞的事，想起曾在知乎上看见过这样一个匿名回答，里面否定了氟利昂破坏臭氧空洞的理论，称臭氧空洞是一个商业骗局。我其实是迷惑的，这种阴谋论在全球变暖这一事也被提及，所以就想请教卓老板怎么理解？


    氟利昂导致臭氧空洞是谣言...


    # 卓克


    咱们的老听众喵子sama留了一个知乎的链接，里面的内容否定了氟利昂破坏臭氧空洞的说法，说臭氧空洞是一个商业骗局。喵子明显预感到这是一种阴谋论，想问问我遇到这种情况怎么理解。


    为了让大家更了解背景，我来说说这个否定是怎么来的。其实这是一个传播已久的论调，这个论调认为臭氧的空洞不是氟利昂造成的，原因是南极上空的臭氧空洞不同年份有挺大起伏，比如2000年2900万平方公里，2002年2100万，2003年2500万，2004年1200万，2009年2400万，而且空洞只在9-11月出现。但导致空洞的氟利昂的数量却没有这么明显的变化，是一个稳定值。然后还有氟利昂都是北半球排放的，为什么只有南极上空有空洞？


    其实关于这个疑问，很多研究臭氧空洞的科学家都做出了解释，现在的主流观点是一种叫做冰云理论的模型，这里就不仔细说细节了。然后另一个重要的支撑是1999年吉林大学的一个教授分析，臭氧空洞的罪魁祸首是太阳风，而不是氟利昂，而且这个论点发表在《科学美国人》的中文版上。最后一个支撑点是，氟利昂破坏臭氧的说法是个阴谋，它来自于当年杜邦公司的竞争对手。咱们在水的节目里说过，氟利昂是杜邦公司推出的一系列制冷剂的商名称，因为后来实在卖得太火，这个商名称甚至成了制冷剂的代名词。这个说法就是，这些竞争对手给杜邦造谣，抹黑他们最重要的产品破坏地球臭氧，好让其倒闭。所以最终才导致人们相信氟利昂破坏了臭氧。这就是臭氧空洞是商业骗局的简单由来。


    其实这是一个很好的如何做判断的案例。首先就是，如果它是一个涉及科学话题的话，那就免不了要排资论辈地看。怎么排资论辈呢？就是看它的结论出处是哪儿。以这个为例，臭氧是太阳风造成的，这个论调是吉林大学地球探测科学与技术学院杨学教授提出的，发表在《科学美国人》杂志中文版上。加分点是吉林大学，这是正经好大学，又是教授，是专业的。还有加分点是《科学美国人》，这是一份知名的科普杂志。我们再来看氟利昂造成臭氧空洞的理论的背后是谁？其实是一众科学家，最有代表性的3位：保罗·克拉茨、马里奥·莫丽娜、舍伍德·罗兰。为什么连这么偏的名字都念出来呢？因为这3位是1995年诺贝尔化学奖得主。但是诺奖得主的话就更可信吗？在臭氧空洞上还是可信的，因为这3位科学家就是凭借他们提出的氟利昂破坏臭氧层的理论获得的诺贝尔奖。他们并不是在其他方面获奖，然后在职业余生活提到臭氧空洞的，所以这一比，高低可见，一个诺贝尔奖级别的结论，一个科普杂志上的结论，完全是职业顶级和平民选手的差距了。所以排资论辈，就可以直接相信氟利昂造成臭氧空洞就对了。


    那为什么要排资论辈？因为这是一个超级省时间和准确率超高的方法。我们都不是环境学专业的，就算是环境学专业的，在专业里还有各种细分领域，我们就算细分领域中的，要想全面获得消息，也需要花大量时间看完相关资料，可我们的目的只是为了迅速确认结论可信度，不是为了研究，所以这么做就足够了。排资论辈之所以可靠，是因为那个结论已经被那个细分领域的专家，甚至专家组们充分讨论过了，一个专家团队已经替你完成了这个任务量超级巨大的工作了。你干嘛不信呢？


    做判断的第二个标志就是，这个科学论断里是不是包含一个阴谋论的故事，如果包含了，那基本是营销号为了增加可信度加上去的。对普通人来说，你的理论我听不懂，但是后面那个商业竞争中对手抹黑产品的故事我能听懂，所以我更相信这个细节丰富的故事。而氟利昂造成臭氧空洞的理论，就算是用最简单的语言解释也要涉及催化反应，所以一般人感受不深。


    两个理论搅在一起，反而真科学吃亏了，谣言获胜了。听咱们这个节目的好处就在于，我可以帮您在不了解细节的时候，最大限度识别出谣言和不可靠结论。所以我再总结一下，识别方法，第一是论资排辈，第二是看里面有没有加阴谋论故事。好，这个问题就回答到这，欢迎大家把想法留在1917小组中。


