  md: '# 城市里的水


    城市里的水


    # 下雨后的污染


    +   1. 下雨后的排污口会有很多脏东西出来，那些都是没有来得及在污水处理厂处理的脏东西。所以大雨后在排污口附近游泳就容易出现各种感染。


    +   2. 城市水系统在遇到下雨，尤其是暴雨时，会因为水流速过快，本应该在污水处理厂沉淀的水没来得及沉淀就流走，之后很多处理过程也没进行完全就流到下一级，总之，每个过程都没充分完成就排出了。


    # 城市排水机制


    +   1. 污水和雨水走同一个管道的下水道属于：合流制管道；分开的管道属于：分流制。


    +   2. 美国 有800个城市采用合流制，覆盖了4000万人口。合改分的成本很高，对一个300万人口的城市来说，需要30亿美元。


    +   3. 一些曾把合流制管道改成分流制的城市后悔了，因为他们仍然在排水口发现了严重的污染，那是因为下雨后冲刷了街道上各种垃圾、排泄物、化工产品等，让本来干净的雨水变脏了。


    +   4. 不论是合流制还是分流制都存在一个致命的缺陷：让城市地下水无法得到补充。


    # 被排空的城市地下水


    +   1. 城市路面都是硬壳，雨水很难渗入土壤，地下的排水沟和下水道又让雨水尽快排走，所以长期以来城市地面无法得到地下水的补充，地面突然下陷的现象层出不穷。


    +   2. 想解决这个问题，最好的方法是尽量用透水的砖铺人行道，尽量用多孔柏油铺公路，但这些材料的成本也比较高。还可以在房屋顶部铺渗水的土层，种上耐干旱的植物，这样可以在小雨、中雨到来时吸收水分。把尽量多的水存在城市里，不让它们快速排走。这套设计思路名叫“低影响开发模式”。


    # 痕量成分没有害处，即使鱼都变性了


    +   1. 痕量用来形容百万分之一浓度以下的物质，曾结果测量痕量是比较困难的，但后来有了电子捕获检测仪，就 可以检测到十亿分之一的离子含量了。


    +   2. 化学家和生物学家关注到有些雄鱼会变成雌性，但这只是少数。


    +   3. 让雄鱼雌性化的成分是雌二醇，它们是雌激素受体，会让鱼表现出雌性特征。雌二醇的主要来源是人类的尿液，尤其是孕妇女性的尿液，这种尿液中的雌二醇是普通女性的75倍，普通男性的150倍。


    +   4. 经过仔细和大量的实验，水中的雌二醇和类似的痕量成分不会对人体有危害，因为这些物质的浓度离危险浓度还差几百倍。


    # 各种滤水机都是骗子的噱头


    富氧水机、碱性水机、养生水杯，这些号称能排毒的各种水机、水杯都是骗子的噱头。其实这些水机里面大部分就是很便宜的PP棉、活性炭滤芯，不同的是，除了正常的滤芯，这些水机里面都加了一根镁棒或者镁矿石，它们在水中缓慢溶解，产生微量的氢氧化镁和氢气，吹的神乎其神，但没有一个能通过国家涉水产品检验。


    # 千滚水能不能喝？


    +   1. 千滚水里缺氧气吗？缺。但我们不是鱼类，水中氧气对我们没太多作用，就算是作用，2L水中的氧气和我们吸一口气获得的氧气一样多。


    +   2. 千滚水里亚硝酸盐过高吗？千滚水里亚硝酸盐含量会微微增加，但20次烧开后的亚硝酸盐只有国家安全标准的二十分之一，完全不用担心。


