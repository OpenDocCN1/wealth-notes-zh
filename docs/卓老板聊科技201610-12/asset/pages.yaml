  md: '# 越来越干净的水，越来越脏的空气


    越来越干净的水，越来越脏…


    # 第一代环保组织的功劳


    +   1. 《寂静的春天》出版后，第一个有影响力的环保组织：环保基金会成立了。基金会中的一位成员罗伯特里克斯博士检测了很多地方的饮用水，发现饮用密西西比河水的人比喝井水的人，癌症发病率高了15%，此后又在自来水中发现了90多种化工成分，这在自然水中是不可能存在的。


    +   2. 六十年代初，一种检测离子的新型设备出现了：电子捕获探测器。它可以检测浓度为十亿分之一的离子，尤其是氯离子、溴离子、氟离子。它的出现也对人们控制臭氧空洞做了贡献。


    +   3. 环保署对饮用水中氯化烃控制不利，所以环保基金会向联邦法院提起诉讼，并且赢得了法院的支持，法院要求环保署在缺少详细科学证明的情况下，尽快控制自来水厂中氯化氯烃的污染。


    # 给水消毒，却引入了致癌物


    +   1. 在水中加入氯气是为了防止微生物繁殖，但氯气一旦和水中的有机物接触，就有机<|message|> 生成卤代物，绝对大部分卤代物是有害的。


    +   2. 有害物包括：三卤甲烷，氯氰烃等。大约每加入100份氯气，其中1份会参与反应生成这类有害物。美国科学院后来给环保署提供了科学依据，最初的规范中，一升水中的三卤甲烷不能超过100微克。这个标准发布后一些专家质疑它太宽松了。


    +   3. 三卤甲烷在当时新奥尔良的饮用水中含量最高，但也只是100微克出头，按照美国科学院的结论，就算是常年喝100微克/升三卤甲烷的水，也会让癌症发生率增加百万分之几，所以改善水质中的三卤甲烷并不能大幅提升健康水平。


    +   4. 后续的研究中，还在水中发现了卤代乙酸，这种物质比卤代物害处大，因为卤代物大都有挥发性，在沸水中3分钟，就会被挥发90%以上，但是卤代乙酸并不挥发。


    # 去掉卤代物，用氯氨、臭氧消毒


    +   1. 为了减少氯气带来的副作用，后来自来水厂尝试采用氯氨消毒，它不会生成卤代物，但问题在于一些铅做的水管在氯氨的作用下会生成二价铅盐，这是一种溶于水的盐，而铅对人体神经系统是有害的。


    +   2. 原本水管用铅，问题并不大，因为水碱会逐渐沉降在管壁上，之后铅离子就被完全隔离了，尤其在有氯气的情况下，即使有铅，也会被氧化为四价铅，不再溶于水。但是新的消毒剂氯氨的出现让四价铅逐步转变为二价铅。


    +   3. 为了避免两难，有的厂采用臭氧消毒，但臭氧也有缺点，它的问题在于杀菌持续时间短，所以在出厂前还需再补充氯气，这还是存在产生卤代物的因素。并且臭氧消毒过程中还容易生成溴酸盐，这一样也是致癌物，所以换成臭氧，一样产生同样的许多问题，于是臭氧消毒作罢。


    +   4. 水系统消毒即使出现种种问题，但都属于小剂量下的问题，水质在几十年里一直提高。能统一处理、运输饮用水，是水质大幅提升的关键。


    # 雾霾治理不利是因为供暖不统一


    +   1. 从2014年的数据看，北京集中供暖的面积是5.68亿平米，而河北省集中供暖面积是5.23亿平米，北京市人口2100万，河北省人口7400万。所以很可能仅河北省就有5000万人没有采用集中供暖。


    +   2. 华北地区，人均月消费低于1000元的人大都是没有居住在楼房的，他们都是冬天单独烧煤的人，这部分人口大约1.2亿，如果按5口人一个小煤炉，大约就有2000万左右个小煤炉。


    +   3. 集中供暖时，锅炉的效率高，污染集中控制效果好，小煤炉的燃烧效率差，污染大。而华北地区采用集中供暖的人口占比不到40%，剩下60%+的人因为单独烧煤炉会制造巨量污染，这部分污染的量甚至难以统计。


    +   4. 如果只把可以统计，可以管理，可以实施停产停工的单位管理起来，对治理雾霾的效率不大，目前大的火电厂和锅炉，还有达到排放标准的汽车，它们的污染并不大，全停产也只能减少小部分PM2.5。


    +   5. 2000万小煤炉的存在根源在于中国穷，中国的财富只在一、二、三线城市，中国城镇化还有很长的路要走，当农村也升级成中等城市时，雾霾自然会解决，不用特地治理。


    # 离子水的骗术


    +   1. 离子水的名称已经证明这是一种不符合国家安规的产品。任何可溶物在水中都是离子形式，所以叫盐水也是离子水，只是因为大家对“离子”两个字很陌生，所以感觉很高档次。


    +   2. 离子水大都宣称自己是碱性离子，有利于改善酸性体质，实际上酸性、碱性体质是一个流传了很久的伪科学。


    +   3. 人体血液pH值的正常值是7.35-7.45，超过这个范围后的症状根本不是乏力、失眠、便秘、高血压，这些大众症状。而是濒临死亡，必须马上抢救。


    +   4. 人体的pH值是不能通过吃什么食物改变的，调整pH值的系统非常精细，凡是用血液酸性、碱性做文章的，都是骗子无疑。


