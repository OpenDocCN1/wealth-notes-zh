  md: '# 讨论：中国古代科学发达吗？


    Monroe：这期卓老板明显在验证标题党的错误，该标题不就是标题党类嘛？我有个建议，就是能不能把中国及世界从古至今的发明联系起来，说说其中的原理。聊科技，个人感觉不该只现在及未来的，过来的有些发明也在延续，不是吗？还有以前学历史，什么指南针、火药、水银，各种纤维材料出现，很多感觉很熟悉，但是实际一点不透彻，从来没有一本书很连续聊过。


    中国古代科学发达吗？


    有听众说，那期“NASA发明了违反牛顿定律的引擎吗？”这个是标题党。这位听众应该是没有看全标题，这个是个问句，题日是“回答：NASA发明了违反牛顿定律的引擎了吗？”，后面有个问号呢。就像我们曾经粉碎谣言类的节目标题——一颗电池能污染600吨水？维生素吃多会导致癌吗？跟这类标题一样，所以还要仔细看看。接着他又说到另一个问题，说这个节目总说现在和未来的科技技术，但是没说过去的科技，尤其是中国是个文明古国，中国科技也是应该有延续性的，以前学历史，什么指南针、火药，能不能串起来说说。


    这是个值得说的话题。我认为这是我国长期以来不客观的史学和言论受限制下产生的非常广泛的误解，认为中国的科技是在近代才被西方超越的，言下之意是从前是超越西方的。实际上科技要分为科学和技术两部分，而科学就是从1600年左右文艺复兴开始从欧洲诞生的，这是一套逐渐完善起来的体系，我们在节目里反复说过多次科学精神啊，验证复现的过程啊，同行评议的过程啊，自我否定自我纠错的特性啊，这里不重复了。中国是在科学这套系统诞生后好几百年才参与到其中的。也就是说上世纪初那个年代才参与进来的。这是一套全新的文化现象，是一套全新的思考和行为规范。中国从前没有，所以根本谈不上中国古代的科学超越西方。我觉得只能说中国古代的一些技术，一些发现，一些发明有一些科学性，但离全套的科学系统还远得很。


    但中国古代是有技术的，实际上也没有像历史教科书里、电视里说的，全方面长期领先全世界。现代科学出现前，全世界只要有人住的地方都有技术出现，你在ABC方面做得好一些，我在DEF方面做得好一些，他在GHI方面做得好一些，但是所有这些都因为一本书籍和一个人被独红而掩盖住了，那就是李约瑟的《中国科技史》。


    这套书确实花费了这个英国科学史学者50年的心血，一共6卷，好几十册，整套书对中国古代科技的评价非常高，在那个年代，科技如此落后的情况下，有这样一个英国史学家，这么高度评价，尽毕生精力认真写出的内容，被我们高度重视。可以说，这是利强心针，国际性的荣誉，我们也需要这样的肯定了，而且能在1930年代就来中国花这么大心血研究中国的科技，这是西方发达国家的第人，所以他的观点也影响了一代西方学界。对中国的影响就更大了，以至于我们根本没有机会接触到相反方面的信息，但一个历史学上的观点，有争论才是正常的。我们因为长期落后，就一直没有出现过反面的声音。但是随着经济发展，到了2000年以后，质疑这种观点的也终于多了起来，也有很重量级的，比如《继承与叛逆——现代科学为何出现于西方》。


    这书太厚了，有兴趣的人可以仔细参考，没时间听众我给大家展示几张图，大家来感受一下吧。在康熙年间，我们有个博物馆学家，叫吴敏，他很喜欢生物，就是若于中国自古以来没有过海洋生物的图谱流传，于是决定自己画，他在我国沿海考察，然后连写带画地描述了上百种海洋动植物，就写成了一本中国清朝的海洋生物图鉴。也是历经几十年，这本图鉴叫做《海错图》。第一组对比是《海错图》中描绘的棱皮龟和真实的棱皮龟，第二组对比是同年代，《海错图》中的箱鲀和德国博物学家画的箱鲀。


    ![](img/72b394a82026978f467d7c86ddc01c35_69_0.png)


    ![](img/72b394a82026978f467d7c86ddc01c35_69_1.png)


    不知道各位看了以后有什么感触，因为是一本生物图鉴，这可不是孩子画画看玩呢，都是有学术精神，本着越画越像为目的，否则您画完，后面研究的人对着您的图鉴根本认不出来真实世界的动物，多悲催。后来《海错图》被乾隆收入宫中收藏，可见这多少是一份够档次的图鉴。但您看看棱皮龟，我反第一次看觉得像龟仙人。箱鲀也是从几个视角画的，但是跟德国的博物学家一比，那简直是萌萌哒了。以小见大，我们到了清朝，还没有发展出一套可以客观记录事物的能力。我们讲究的是写意，只可意会不可言传。


    上千年来主流中国文化宣称是“学会文武艺，货卖帝王家”。书中有黄金屋有颜如玉。中国文化中就缺少科学这个类别的定位，即便到了近现代，有人问了，为什么而读书？堂而皇之地说就是为中举崛起而读书，私下里都是为了赚钱、当官而读书。没听说主流文化中描写说那会有人回答我是只爱读书的。从前西方科学家学天文学，我们认为人家是为了航海时定位用的，有助于扩张殖民地，学完了之后成为国王分封地的总督。要是这么理解他们天文学就错了，从数学和观测开始的天文学，在西方如果真有什么目的，就是它能唤醒理性。你了解了一些宇宙的规律，感受到了理论的美妙，现实中竟然有和数学上吻合如此好的对应关系，你会发现原来真有一个理性世界，只是自己从来没有发现，然后你整个
    人就觉醒了，有一种从浑沌醒来的感觉。很多学科就这么连在了一起，甚至还产生了副用途，给大航海的船定位。


