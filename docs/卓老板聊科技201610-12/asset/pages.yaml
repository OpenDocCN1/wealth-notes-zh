    # 问答：低频率的电磁波为什么有粒子性？


    ![](img/72b394a82026978f467d7c86ddc01c35_20_1.png)


    小葛：卓老板，你好。听你的节目很长时间了，非常喜欢你的节目。我有一个问题一直不明白，光是一种电磁波，光子具有粒子特性，那低频电磁波具有粒子特性吗？低频电磁波的组成是某种粒子吗？


    低频率的电磁波为什么有…


    ![](img/72b394a82026978f467d7c86ddc01c35_20_2.png)


    # 卓克


    有听众小葛问，听了很长时间节目，有一个问题一直不明白，光是一种电磁波，光具有粒子特性，那低频电磁波具有粒子特性吗，低频电磁波的组成是某种粒子吗？直接回答您，不论频率多低，都同时具有粒子性，和波动性。就像你用什么方法去测量。


    这是一个非常好的问题，虽然可能很多听众都已经跃跃欲试的想给您解答了。光是粒子还是波，这个问题几乎贯穿了现代物理的整个历史，其实都不止是问题了，而是粗脖子红脸的争论，争吵，站队，分派系的事情。这场旷日持久的争论经历了大约400年，到了1920几年才接近有了定论，定论就是，既是波，也是微粒，至于具体是什么，看你用什么方法测量。


    什么时候是粒子呢，比如光在反射的时候，入射角等于反射角，这个规律和咱们扔小球得到的结果是差不多的。还有视觉，就好像一个个带着能量的小球打到我们视网膜上，产生了神经刺激。但人们也可以随时找到反例，比如几束光线交织的照射，他们为什么还能按照自己的光路前进呢？为什么不像一堆小球在交汇点碰撞的稀里哗啦呢？这是最简单的矛盾，稍微复杂一些的，比如为什么光线会出现绕过障碍物的现象，比如为什么会出现双缝干涉现象？这些用微粒解释不了，但是如果把他们当做是波，那就可以把所有描述波的数学工具用上，一计算，明暗条纹，或者不该出现在障碍物背后中心的亮斑就都出现了，所有这些就体现了波动性。


    比如我刚说的，光源前面一个障碍物，按说障碍物后面应该有一个完整的阴影，但泊松通过计算就发现其实背后出现的阴影应该是中心有一个亮点，在阴影四周出现一圈，一圈，水波纹一样的圆环。我们之所以没人看过这种情况是因为大家平时所见的阳光是混合了各种波长的光，如果用单色光照射就会出现，后来真的实验中用单一频率的可见光照射，就出现了。


    不光是光有波动性，连电子，甚至质子，中子，我们一直认为的典型的微粒，也有波动性。这些在我往期节目里说过，就是电子的衍射实验，质子的衍射实验。


    这些实验摆在眼前，我们往深一层想想，关于光是什么，电子是什么，这类问题并没有什么意义的。只有这样同，这种东西在什么观测手段下呈现什么结果，只有这样的问题才是有意义的。我们以为我们见到的阴影就该是那样，只不过是因为我们还没意识到，那些阴影是多种波长的光组成的，你用了什么观测方法，就看到对应的样子。所以物理学，乃至科学世界观中，只存在测出来是什么样的，而不存在它到底是什么。我觉得这种思维方式甚至和现代人文主义有关系，比如我们要尊重每个人的感受，或者这幅艺术作品是好看还是难看，都是欣赏者的感受。人家觉得美，那你无法否认，因为你没有和人家一样的观测设备，你没有他曾经的生活经历，你们俩欣赏这幅画，本质上就是不同的方式去测量。你永远无法采用我的设备去测量，你就没法证明我感受到的东西是错的，所以你只能尊重我的感受。


    好这个问题就回答这么多。


    ![](img/72b394a82026978f467d7c86ddc01c35_20_3.png)


