  md: '# 政府状告烟草企业，却形成更稳固的利益共同体


    1.1994年密西西比州政府因为需要支付大量医疗费用给肺癌患者，而把4家烟草企业告上法庭，要求他们支付所有费用，后续佛罗里达州、德州、明尼苏达州都陆续加入了诉讼。最终演化成一场更大规模的诉讼，为了解决这场诉讼，在1998年46个州和47家烟草企业签署了一个和解协议。协议的内容就是烟草公司做最大的妥协，每年上缴很大比例的利润，公布所有烟草公司内部资料，采取最严格的烟草广告限制，广泛教育公众烟草的危害，最大化公开烟草历史上上的责任和罪行。换来的是，州政府不再起诉烟草企业了，如果是个人诉讼，地方法院会对烟草企业有所保护，允许他们继续销售烟草。和解条约最终形成了一个更加封闭垄断的环境，没有竞争了，新企业不可能再进来。曾经的烟草巨头地位更稳固，而且有了保护伞。烟草公司上缴的钱大都给医疗机构，实际上形成了更稳固的利益集团。


    2.烟草企业从1979年起不在美国做任何电视广告，大部分企业把新市场定在里中国、印度、墨西哥这样的人口众多的发展中国家。在短短几年时间里就通过巨大的经济利益绑架了政府。中国在2015年才推出了最严的“禁烟令”，但实际执行效果不好，只有北上广深可以勉强及格。


    # 糖业是下一个烟草行业


    1.美国医学学会期刊揭开一个惊人的黑幕，就是制糖企业从1960几年来开始花钱收买科学家，把心血管疾病的原因尽量推到脂肪身上去，弱化糖和心血管疾病的关联。已经抓到的证据有，糖业协会资助哈佛大学的3位科学家，相当于现在一个人5万美元，让他们做一些论文，尽量把糖和疾病撇清关系。还有可口可乐公司常年大量资助此类研究。


    2.糖对身体的危害也因为利益集团的操控被弱化。而实际烟草行业到现在依然绑架着美国政策监管者。


