  md: '# 问答：小麦为什么不能像大米那么煮着吃？


    Apple：请问卓老师，为什么麦粒不能像米粒一样直接焖成饭，非要先磨成粉。如果把麦粒直接焖成饭会变成什么样。这个问题从小到大都没人能给我解释明白，求助卓老师。


    小麦为什么不能像大米那…


    卓克

    有听众apple问，从小到大有个问题一直没人给解释清楚，为什么麦粒不能像米粒一样直接焖饭，非要先磨成粉，如果把麦粒直接焖饭，回变成什么样。其实我小时候也有过类似这样的问题，我当时的问题是为了为什么米粒不给磨碎了，像面粉一样吃，不过后来马上妈妈就告诉我了，有米粉这种东西。至于您这个问题，也有一个最简单的回答，其实也有直接用麦粒炒的饭，这种吃食在山西陕西经常可以看到。我在晋城吃过，挺好吃的。也没有什么烹调上的难度。


    您问的，为什么后来人们没像吃米饭一样广泛的直接焖，蒸，煮，而是先磨成粉再吃呢，我觉得有两个马后炮似的原因，您听听看，有没有道理，一个是麦粒天生比大米强，大米基本都是直接蒸煮的原因是因为它做不成其他什么东西，什么意思呢？就是如果你把大米也磨成粉末，这些粉末兑了水以后和不成团，还是一团稀烂的米糊糊样子。但如果你把小麦磨成粉以后兑上水一和，马上成团，接着你做饼也行，押成条也行，发酵也可以继续保持各种形状，有形状马上就可以开发其他吃法，比如里面加馅儿，或者塞东西，反正是千奇百怪的做法任你想象。但大米粉末你完全拿它没办法。


    那我们再来说大米粉末为什么这么无能，这和2种蛋白质有关，叫一种是麦谷蛋白一种是醇溶蛋白，在大米中是不存在这两种蛋白质的，大米中的蛋白质绝大多数是可以溶于水的，占比总质量大约6%-9%之间，看不同品种了。可是在小麦中是存在这2种蛋白质的，有了他们淀粉就可以粘合在了一起。当然小麦中也有很多可溶于水的蛋白质，但只要这2种蛋白质含量高了，和成形状就有希望了。而且面粉中蛋白质含量本来就普遍比大米高一些，低的7%，高的18%的样子。所以更容易和成团了。


    也正是因为麦谷蛋白对能不能和成团，口感筋道不筋道影响最大，才造成了中国南北方向米食和面食的差异，相当于一段时间内如果在南方种小麦，小麦中的麦谷蛋白含量低，所以做成的面条煮熟了特别糟，软踏踏的，口感不好，久而久之南方人也就更不爱面了，但是在长江边上的居民发明了一种碱水面解决口感不佳的问题。就是用在面粉里加碳酸钠或者碳酸钾，让PH值提升到9这时候面条就利落多了。比如湖北人特别爱吃的热干面就是这样加工的。可能刚刚听到半截时有人就想问了，米粉呢，米粉呢，米粉呢，不也做成各种形状了吗？不知道您仔细观察过米粉没有，他们虽然有面条状的外观，但也非常容易撕裂。而他们之所以能形成面条一样的外观也不是直接磨碎就能和成面团一样的东西，米磨成粉后还需要高温，然米中的淀粉糊化后才勉强有了一点粘性，他们才抱成团的。第一个原因我们说完了，是因为麦谷蛋白有和没有导致加工可能性上的差异。


    咱俩再说第二个原因，就是从最原始的角度，怎么吃能容易吃饱点看，假如收获了小麦的麦粒和水稻的米粒儿，然后很自然就煮着吃试试，这就出现问题了，水稻的粒外面有壳，也就是俗称的糠，吃糠咽菜的那个糠，这个糠是带芒刺的，真扎嗓子啊，就算煮也没用，所以水稻的米粒儿一定要脱壳后才能吃，不论是煮还是蒸，就很香甜可口了。小麦也有壳，但是这个壳不但芒刺，虽然也能脱，但即使不脱，也凑合煮，凑合蒸，也不难吃，但唯独有个因素，这个壳包裹后吸收不太容易，往往都拉出来了，还是成型儿的麦粒儿，跟金针菇那样see
    you tomorrow似的，吃同样多的麦粒和脱壳的米粒，一个营养充足，一个瘦得不行。所以为了吃完了别完整的排出体外，那就试着磨碎了吧，哎，磨碎了吃就吸收好。所以后续怎么弄成饼，弄成馒，包馅儿咱们都不提呢，就这光吸收率上，人类最早的农业和饮食常识里，就传承下来，麦粒儿要磨碎了吃的概念。这就是第二个原因。


    这是一个历史问题，可能有很多角度，我说这两点供大家参考，这个问题就回答到这里。


