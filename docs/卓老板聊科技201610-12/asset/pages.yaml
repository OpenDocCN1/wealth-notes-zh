  md: '# 臭气熏天的伦敦和巴黎


    臭气熏天的伦敦和巴黎


    # 臭气熏天的伦敦


    +   1. 十六世纪初的伦敦人口已经超过百万，这时饮水公司诞生。伦敦的“新河”公司就是比较高端的饮水公司，他们从几十公里外的山泉引水给市民，收费较高，但水质很好。绝大部分平民的饮用水都是从市区的几个取水口获得，这些水常常泛着臭气和怪味。


    +   2. 到了十九世纪初，市内取水口的水因为泰晤士河的污染，变得非常危险，每隔几年就会爆发一次霍乱。霍乱是因为粪便污染了水导致的，伦敦人民那时已经习惯向泰晤士河倾倒垃圾和粪便，而政府管理不力。


    +   3. 霍乱是霍乱弧菌引起的，单次摄入量超过1亿才会发作。霍乱的症状是严重的上吐下泻，患者会在几天内脱水而亡。当时伦敦医学界认为粪便散发的臭气是霍乱的传染源，他们并不
    知道有微生物的存在。


    +   4. 伦敦政府面对这种情况只能把污水排放口尽量远离伦敦市区，引到几公里外的泰晤士河下游。这是一种治标不治本的做法，但当时没有条件处理污水。


    # 干净优雅的巴黎


    +   1. 巴黎市区环境没有被粪便污染，水源也保护的很好，这都源于法国农村对粪便需求量大，有人专门收购干燥后的粪便做肥料。后来为了提高效率，政府还修建了从巴黎市区到郊区农村的排污管，直接把粪便等污水排到郊区的农田，促进农作物生长。


    +   2. 在19世纪初，法国化学发展迅速，1850年就出现了把粪便变成化肥的方法，此后粪便成了原料，更没有人随意丢弃了。这些化肥不仅给法国农民用，也出口给伦敦，伦敦自己的粪便更没有机会抬高身价了。


    +   3. 巴黎的排水系统是当时世界上最优秀的，与其称之为地下水管线，不如称其为地下宫殿。1854年初工程开通时，这套水管总长600公里，一开通就有不少巴黎贵族乘船在地下水系统中游览。


    +   4. 其实巴黎还有很多未处理的污水，方法是排到塞纳河下游，当人口数量暴涨后，下游小城市用水就遭到严重污染。


    # 美国城市水系统效仿欧洲


    +   1. 美国有一些上游靠着河，下游挨着海的城市，这样水系统压力小一些，他们可以通过几百公里长的取水管道获得干净的饮用水，还可以把污水直接排到大海里去，但时不时会爆发伤寒。


    +   2. 伤寒杆菌只要摄入1000个就会发病，但有一部分人即使带菌也可以无症状。1900年发生了“伤寒玛丽”的故事，故事的主人公是一个无症状的带菌者，身份是爱尔兰裔厨娘。她为谁家服务，谁家就感染伤寒，被发现后拒绝配合检验和治疗，之后被强制隔离3年，仍然没有治愈，此后改名在纽约斯隆医院继续做厨师，继续感染多人。最后她被抓捕，终生隔离。26年后，她因肺炎去世，一生一共感染52人，其中7人死亡。此后，“伤寒玛丽”成了带菌者公认的外号。


    # 水系统2.0=过滤+杀菌


    +   1. 为了解决城市水污染问题，人们往沙子里补充氧气来过滤水，这是利用了沙子里微生物对有机物的分解作用。这种东西叫做砂滤器。


    +   2. 砂滤器用过一阵子后，会在沙子表面出现凝胶一样的东西，这些就是微生物的家，也是它们的食物。这层膜对过滤有益，但会大幅降低过滤速度，也会在使用一段时间后堵塞，需要定期清理。这种带生物膜的过滤器叫做慢砂滤器。


    +   3. 砂滤器对浮土颗粒清除效果很差，因为两者都带负电，起不到吸附作用，解决的办法是用无害的金属离子促进浮土颗粒沉降，经常用到的材料是明矾、三氯化铁、氢氧化钙。沉淀和砂滤器一同使用，让很多城市的伤寒发病率大幅降低（下降80%以上）。


    +   4. 严重污染的，尤其是大城市下游的城市，即使使用了上述过滤系统还是会有伤寒爆发，于是科学家们在水中添加次氯酸钙，它会与水反应生成强氧化剂次氯酸，可以消毒。


    +   5. 氧化剂消毒原理：氧化剂会夺走电子，微生物的膜一旦被夺走电子，很多营养通道、水通道都会失效，这样致病菌的新陈代谢就停止了，也就消灭了霍乱和伤寒。过滤和杀菌同时使用标志着这水系统2.0的建立。


    # 纯净水、富氧水、小分子团水、能量水能不能喝？


    +   1. 国标GB19298-2014是《食品安全国家标准包装饮用水》的规范，2014年颁布的，目的就是遏制从前市场里出现的各种坑蒙拐骗的饮用水。这个规范出来以后，包装水只能有纯天然矿泉水、纯净水和其他水三个名字可用，现在市场中还以富氧水等名字给产品命名的已经不符合国家安全标准了。


    +   2. 矿泉水的科普宣传一直存在误导。矿泉水与纯净水相比的确包含丰富的矿物质和微量元素，但如果每天饮用矿泉水，各种矿物质和微量元素每天仅仅可以多补充千分之一，这是一种几乎没有影响的量，所以人们不论老幼，都可以放心长期饮用纯净水。


    +   3. 与这个思路类似的就是各种“汤的滋补”，也都属于本末倒置，一块肌肉的营养比十盆鸡汤丰富。


