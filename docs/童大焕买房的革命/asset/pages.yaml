  md: '我认为，马少华先生所谓的资源，跟秋风先生所谓的资源，本质上？是一个概念。马少华先生文中的资源概念，是宏观资源的概念，是一个地球，至少是一个城市内的资源概念；而秋风先生文中的资源概念，只是中观层面的资源概念，更多关注的是城市资源问题，虽然其引用的论据是一个宏观资源问题。对于秋风先生的问题，我也可以提供一个故事：十八九世纪有个著名的人口学家叫马尔萨斯，他说人口是按几何级数增长的，所以粮食很快就不够吃了。当代著名经济学家张五常教授说他胡扯八道！并举例说，中国明朝初期人口是6000万，现在人口上升了20倍，人均寿命却比明朝时上升了近一倍，但每个人的生活都比明朝好了许多！


    我认为，宏观上，在一个地球或一国之内的，静态地看，或者从自然资源的自然生成规律与人口增长的矛盾上看，资源是有限的。而正是因为马少华先生所言的宏观资源的有限性，我们就更不应该实行城市人口控制，而应该敞开城市大门，让更多的人从农村自由进入城市。


    # 我的理由是：


    第一，在人口和资源相对稳定的状态下，城市化是最节约资源、最高效率的人类生存和发展方式。这一点早已无须证明。无论发达国家还是发展中国家，城市化已经成为世界性的潮流。


    第二，人们往往只看到“外来人口”进城是和城市“争夺资源”，却常常对他们带来的资金、智力、劳动力以及各种创造的资源视而不见。近20年中国的城市化进程已经证明了这一点。以珠三角地区为例，改革开放以来有的地区人口增长近10倍，不仅可以发展生存，而且发展生存得比以往都好。东莞20年前人口仅20万，现在400万以上；深圳原来人口不足几万，现在已经1200多万，而2001年这个时侯只有400万。如今这些地方是更繁荣稳定了，还是资源衰竭城市萧条了？有目共睹的事实明摆着，说明城市的人口承载量是可以不断增强的。日本是全球公认的资源短缺型国家，但东京长官周局长坂?英德提出，日本要维持目前世界第二经济大国的地位，就要在今后的50年内，接受3000万外国移民。他的观点引起日本经济界人士的共鸣。（2004年9月2日《新京报》）


    第三，我国半个多世纪以来人为阻止城市化，已经让我们付出了惨重的环境代价和人口增长代价。若干年前，中科院通过卫星遥测，曾对我国西部12省区的土地承载能力进行了评估，结果表明，西部有1/5的土地承载力处于超负荷状态，严重超载造成许多地区自然生态环境恶化。有人计算了一下，中国目前适宜生存的好地方只有国土总面积的1/3。半个多世纪以来，荒漠化及严重水土流失地区的面积各增了约1.5倍，中国等于丢失了大约350万平方公里土地。而中科院《1999年中国可持续发展战略报告》显示，中国人每年搬运的土石方量是世界人均值的1.4倍。中国的人类活动具有明显的破坏性，高出世界平均水平3~3.5倍。而据著名经济学家仲大军先生的分析，由于二元户籍制使大量人口滞留农村，中国在过去半个多世纪里多生了1亿人。国家环保总局局长潘岳日前指出，新中国成立以后，我们的人口从6亿增长到了13亿，多了一倍，而可居住土地由于水土流失从600多万平方公里减少到300多万平方公里，少了一半。


    既然城市化是最节约资源、最高效率、最文明、最能有效节制人口增长的人类发展模式，为什么今日中国的大城市普遍以“资源紧张”为由妄图实行“人口控制”呢？'
