- pgno: 64
  md: '据新华社的报道说，来自中央财经领导小组、国务院研究室、财政部、住房和城乡建设部等部门的领导和专家对这一模式给予充分肯定。他们认为“淮安共有产权住房保障模式”从制度层面上堵塞了原来经济适用房的牟利空间。


    如何“从制度层面上堵塞了原来经适房的牟利空间”？共有产权房“的独家秘籍”是：


    > “因为在《房屋登记薄》及其《房屋所有权证》上有明确的比例及权属关系，私下倒卖时，不仅购房人因无合法的产权凭证存在极大的风险，而且买卖双方均已构成侵占共有产权人即国家的利益，对此行为政府可以依法制止、纠正、打击，而且退出机制清晰可操作，不会像经济适用房那样不了之了。即使申购共有产权房弄虚作假成功，倒卖时还必须交出政府产权收益，5年内原价购买，获取的也只是这部分的贷款利息。“出口”时非法牟取暴利的空间不存在了，“入口”时弄虚作假的情况也就基本消失了，这就是以‘出口’反制‘入口’。”(摘自《淮安共有产权住房保障模式二十问》)


    共有产权房事实上比传统的经济适用房更优惠，一是政府按照经济适用房价格出售；二是在经济适用房价格基础上，个人可以按 7:3 或 5:5 的产权比例购买，也就是个人只需出七成或五成的购房款。


    考虑到购房人获得全产权的愿望及实际困难，购买政府产权的人性化操作方法为：5年内购房的按原供应价格结算；5 年以后 8 年以内购买的，按原供应价格加当年的利息结算（市场价低于原价或此价时取低价）；8
    年以后购买的按届时市场评估价格结算（不含房屋装饰装修费用）。也就是说，5 年内可以原价回购政府产权部分，5～8 年只增加政府产权部分的同期银行利息。


    这两个规定合在一起意味着什么？意味着政府为购房人提供了 5 年三成或五成的无息贷款，外加 3 年？期利率贷款。同时，还外加了一重保险：如果房价下跌，市场价低于原经济适用房价格，则按最低价取价结算。


    有这么多的好处，但对于骗购共有产权房的防范和打击措施并不比传统经济适用房严密，甚至更松。因为共有产权房的退出机制为：个人可以购买政府产权部分形成完全产权（如上所述是一种极其优惠的无息贷款式的购买）；直接通过市场转让，按比例与政府分成收益；共有产权房家庭收入高于政府规定标准时，仅对政府产权部分交纳市场租金，无须向政府退回住房。


    这种规定，没有了传统经济适用房 5 年内不得上市的规定（只要购得全部产权即可上市），也没有骗购时必须退回住房的规定，而且只要购得全部产权，购房人未来出售此房时，将不必对溢价部分和政府分成。而传统经济适用房即使在
    5 年期满后出售，无论何时出售都必须将溢价的大部分分给政府。


    如果说传统经济适用房在出售年限上是“5 年有期徒刑”，在溢价分成上是“无期徒刑”的话，共有产权房则是一切由购房人定“刑期”的“自由刑”。不论从准入、政府“无息贷款”收益等方面，都比传统经济适用房宽松多了。制度设计理论上，“出口”时非法牟取暴利的空间不存在”的自我说辞在现实中根本不存在，“以‘出口’反制‘入口’”的理想设计就更不可能实现。'
