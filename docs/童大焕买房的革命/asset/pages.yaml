  md: '前些日子，我和我的爱人说过，和一位友人也说过，5 年内某些区域的房价还会翻倍。这个观点，与金岩石的观点有不谋而合之处。大家考虑一下通货膨胀的因素、考虑一下工资收入增长的因素，特大城市局部区域房价
    5 年翻番恐怕将是一个水到渠成温水煮青蛙的事实。今天想来是一个非常恐怖的事实，但它的过程，未必如今天想象得那么恐怖，而是伴随着房地产市场的起起伏伏，甚至，可以用跌宕起伏来形容。


    对于金岩石所说的大北京将有 3 亿人、大上海将有 2 亿人的说法，我不敢肯定，但我自己有一个研究，就是：“经过近 30 年的中小城市化之后，中国将很快进入城市化的第二阶段——大城市化阶段。这个阶段，除了农村人口向中小城市迁徙的步伐依旧，中小城市人口向大城市、特大城市迁徙的步伐则会大大加快。大城市、特大城市的人口机械增长率至少将赶上甚至超过全国城市人口的平均增长率。如此，若按
    3% 的年增长率（北京 2009 年一年靠外来人口支撑的机械性增长 65 万人口，远高于 3% 的增长率）计，2020 年初北京人口将在现有基础上增加 45%，达到
    2 465 万；若按 4% 的年增长率计，则将增加 61%，达到 2 737 万。上海现有人口 1 800 万，到时时直逼 2 900 万。”我这里说的人口，指的是中心城市的人口。


    早在 2000 年，诺贝尔经济学奖获得者斯蒂格利茨就断言：影响 21 世纪人类社会进程最深刻的两件事情，一是以美国为首的新技术革命（互联网即是见证——作者注），二是中国的城市化运动。许多人没有牢记这一点，将会错过很多变革和投资的机会。我想强调的一点是，中国的城市化运动，更惊心动魄的是大城市化运动。而大城市化运动的过程，必然影响到房价。


    笔者十余年来一直呼吁中国应着重发展大中城市，而且坚信大城市化的发展方向不可逆转，即中国的大城市化发展是不以任何人和组织的意志为转移的自然历史规律。并且提出了“高密度城市化救中国”的概念。这方面的理由，除了经济还有文化、制度等方面的理由。即使大都市采取对外来人口极端排斥（如户籍壁垒）的态度，也无法阻止人口从贫困地区、低效率高内耗地区向城市尤其是大城市发达地区迁徙和转移。


    中国的权力关系和制度文化“统”，越到基层，越到人口稀少的地方，经济、文化和社会资源的权力单边化控制和垄断特征就越明显，“关系社会”的羁绊也越重，各种拉帮结派的窝里斗内耗也越显其威力。


    这种情况，只有在 100 万人以上的大城市才略见改观。城市越大，内耗越小，竞争的公平性、个人的自由度就越大，城市的集聚效益和经济效益也越高。虽然超大城市的交通不便等抵消了其中一部分效益，但是，相比较而言，对于个人来说，由交通等因素造成的时间、精力损耗，比起人与人之间过于复杂的人际关系损耗和过于严密的权力资源控制而言，几乎可以忽略不计？在大城市，有梦想且不懈保持续动力的人终会海阔天空！这就是中国大城市最根本的魅力之源！在一个小地方，要想靠手艺夺改造一种文化传统，或许只能用“老于上青天”来形容，但是在
    一个庞大的都市圈里，海阔凭鱼跃，天高任鸟飞，先进文化的胜出几乎不费吹灰之力。这就是为什么中国的三大都市圈（北京、上海、广州）有那么多对“外来人口”的种种制度的、观念的歧视，但“外来人口”仍然奋不顾身地奔涌而来，如蛟龙入海，似江河奔腾。


