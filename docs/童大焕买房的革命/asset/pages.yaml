  md: '2006 年 3 月，深圳的邹涛提出“三年不买房屋运动”，他自己也身体力行。不过今天，邹涛先生已经摇身一变成了“甘为居住者以其屋鞠躬尽孀”的“房产理财专家”，苦口婆心不厌其烦地教导人们如何买房，还亲自发起了万人购房团体运动。立誓用个人合作集资建房跳敌开发商高房价的“中国个人集资建房第一人”、北京于凌里先生，则在历经了种种高额组织成本、拿地困难等一系列艰难险阻之后，早已宣布放弃合作集资建房计划，转而教人们如何理财。


    坚持下来的有时评人时寒冰先生、中国社科院的曹建海先生，加上后来的牛刀先生，结成了“中国地产三剑客”联盟，或者说形成了这么一个市场品牌，四处演讲、出书宣传他们的观点。


