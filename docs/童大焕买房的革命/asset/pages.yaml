- pgno: 13
  md: '调控应该是非常精细的。比如房价涨幅的统计中，不应该把经济适用房放进去，和老百姓生活关系不大的别墅也不放进去，主要跟踪普通商品住宅的价格变化情况，最好是有一个价格调整的正常区间。举个例子，房价增幅在?20%—+6%之间，都属于在正常区间内波动，就不去管它，直到价格跌幅超过20%，或涨幅超过6%，才出手。为什么定6%和20%的标准：6%是因为去年人均收入增长9%，比人均收入增幅稍微低一点，老百姓容易接受；而20%则是基于房价跌幅在20%之内一般不会影响到银行的金融安全。在不同的地区，应该区别对待，不应该一刀切，现在的利率、首付等调控政策，往往是北京、上海感冒，全国跟着吃药。


    —中国发展研究基金会副秘书长汤敏


    点评：事实上，2009年至2010年4月底，一线大城市房价经过了两次暴涨：一是2009年下半年，二是2010年4月底之前。第一次暴涨，一年内平均涨幅60%以上，两次暴涨叠加，相当多的项目与2009年年初相比，涨幅将近一倍。?此，如果房价要回到2009年年初的状态，跌幅将达到50%，这是银行不可承受之重。房贷压力测试显示，银行“可容忍”房价下跌30%—40%。但这个数据不排除为了配合新政和舆论压力需要做出的“微调”，银行的实际断供线。我个人比较倾向于汤敏的观点，为房价下跌20%，道理也简单：20%之前很多住宅的首付比率。


    具体到每个项目，如果房价切实下降20%甚至更多，购房者就可以适时出手，不必非等到某个预测的时间节点。因为，每个项目、每个业主的情形不一样，具体问题应具体分析。如果遇到降价30%以上甚至更多的，更是不必再犹豫。那种情形，就跟“捡漏”一样，多数是业主急于用钱或者炒房客，房地产商资金链面临断裂，不得不断臂自救。


    个别所谓预言房价要跌50%、80%的，不是哗众取宠，就是对中国政治经济缺乏了解。不要仅从自己的“愿望?出发，听信那些胡言乱语，否则会一再错过买房时机，不是被迫高位接盘，就是从此丧失买房机会。


    当然，汤敏的房价“?20%—+6%”的涨幅区间为合理区间，可能不太现实。如果货币发行量减去GDP增长率高于6%，资产价格要强压在高于通胀率的增长区间，是不太现实的。更靠谱的办法是实行国民收入倍增计划，让工资增长高于计入房地产等资产价格增长的实际通胀。


