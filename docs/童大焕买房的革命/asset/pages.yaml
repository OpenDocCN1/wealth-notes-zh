    150 万鄂尔多斯人真正的家园。


    相反，中外城市发展的历史一再证明，在很多人群聚集的地区，哪怕没有政府的基础设施投入和建设，市场照样繁荣，房租、房价等照样上涨，比如今日各类的城中村。


    “康巴什鬼城”再次揭示了一个最浅显而又最深刻的经济学原理：人聚财聚、人散财散才是一切经济现象的最基础本质！那么，对市场和经济繁荣做出贡献的，就只有所个体聚在一起的人本身，而不是什么“公”。或者换句话说，如果在促进市场繁荣、城市发展中真有什么“公”的力量的话，这个“公”不是别人，不是政府，更不是“公务员”，而是参与聚集其中的“公众”本身！如果土地、房屋乃至其中的一切物价都因人口聚集而获得溢价，那这部分的溢价即使归公，也只能平均归还给每个人本身！但那样不仅实操中难以操作，而且会导致人们不愿意积极参与市场化的劳动和创造，导致市场和经济萧条。


    我很好奇为什么内地一些学问高深的学者每每会出现貌似极其睿智的反思倾向，比如当年钱学森三次论证“亩产万斤”，茅于轼先生亦以具有独立思考和批判精神著称，在面对高房价时却说出足以颠覆市场经济理论基础的反思理论，足见一个学者，要想始终保持独立的精神，不趋时势趋，不媚权，不媚俗，有多难！


    # 3. 没收炒房利润能否打压房价？


    茅于轼先生在《?京报》上撰文认为“住房涨价所得应归公”，遭到《中华建筑报》副总编辑朱时均及笔者等人的抨击。估计茅先生没有看到商榷文章，或者看到了仍坚持自己的独立观点，他在后来接受记者采访时又“变本加厉”地强化了其原有观点，认为只有把房价上涨收入没收（他居然用了“没收”这个词）或收更高的营业税，才能从根本上避免投机性购房。（2010
    年 5 月 18 日《河南商报》）


    笔者想分析一下把涨价部分没收（或收取更高的税，下同）的实际效果，能不能达到茅于轼先生和一切想借高税收打压房价的人们的如期目标。


    首先，为了最起码的公平起始，房价上涨要归公，要没收。那么，拆迁补偿时就不应该给被征地人、被拆迁人巨额补偿。正如茅于轼先生所说，“比如说有人买了靠近地铁的房子，这个房因为修了地铁涨价了。地铁也不是他修的，为什么因为地铁导致房子涨价的钱归他呢？”同样的道理，城市化又不是那?被征地被拆迁的人的功劳，凭什么把地价房价上涨的收益归他们呢？凭什么像北京通州、望京那些地区的人们，不费吹灰之力，仅凭凭拆迁，其世代居住的小小破房子就价值连成，动不动获得几百万上千万元的收入？不劳而获，天理不容呢！


    但是，你不给人家合理补偿，人家会你征地拆迁吗？要不然就跟你拼命，要不然就寸一寸土地也别想要。那么，没有土地，房地产商在哪里盖房子呢？盖空中楼阁吗？市场上没有房子供应，那房价是回升还是会降呢？'
