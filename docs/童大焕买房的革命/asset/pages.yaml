  md: '当然，房地产市场也始终都有唱门派，但是他们的声音常被希望房价下跌的人们当做耳旁风，甚至他们的人格和人身都会受到谩骂和言语攻击。比如著名经济学家厉以宁说：中国房地产市场整体上处在正常发展之中，国外经济学家宣扬中国房地产价格充满泡沫或市场即将崩溃是别有用心，其中潜藏着巨大的阴谋。著名经济学家、国家发展改革委中国宏观经济学会研究员、常务副秘书长王建国，作为国内“都市圈”概念的最早提出者之一，非常肯定地表示，“保守地说，今后10年，中国的大城市，无论上海、北京还是南京，房价要涨3倍；大胆地说，10年房价要涨5倍以上。”建设部政策研究中心主？、中国城乡建设经济研究所所长、中国人民大学博士生导师陈淮：中国地产泡沫说并不成立，中国房地产金融危机在可控范围内。


    # 高房价的第三个支撑：金融革命与超前消费


    通货膨胀也许不完全是政府和中央银行的错，不完全是由于它们滥发钞票的结果。在通货膨胀的背后，有一个不易为人们所察觉的制度性原因，在强迫地支持货币量的增加。


    前面说过，早在 2000 年，诺贝尔经济学奖获得者斯蒂格利茨就断言：影响 21 世纪人类社会进程最深刻的两件事情，一是以美国为首的新技术革命（互联网即是见证？作者注），二是中国的城市化运动。我认为还应该加上一条，就是发生在世界第一大国——中国的史无前例的金融革命，这三者结合，将会极大地改变中国人乃至世界的财富版图。而这个金融革命，就是美国式消费模式即金融按揭制度在中国的全面开花结果。它使一个国家和社会的金融全面告别金本位时代，进入一个提前支配和安排未来收入的时代。


    在以计划经济为特征的毛泽东时代，1976 年以前，名义上老百姓（农民除外）的生老病死国家全包，但同时人们的工资极低，那年头基本上一家人一个月的工资能够用到第
    28 天就不错了，剩下两天可能只剩米缸里的几升米。


    但是今天，尤其是 1998 年城市住房私有化以后，伴随着住房按揭制度的实施，中国的老百姓开始必须提前安排一生的收入了！按揭制度的基本原理，就是提前安排好一生的收入。经济学理论认为，消费的边际效应是递减的，也就会说，随着消费达到一定额度，再增加的消费部分并不能提高人们的幸福感。因此，均勺消费给人生一生带来的快乐最大。存钱、储蓄是为了均勺消费，因为人的收入流是不稳定的，总体上，年轻时收入低，中年时收入达到峰值，进入老年后收入又降低。而在支出方面，则是年轻时教育支出略高？生活支出也较高，但医疗支出低；而到中年时则是儿女的教育支出高，自身的生活支出也不低，赡养老人的支出也较高；老年时，则是生活支出低而医疗费用最高。为了均衡消费，所以人们需要储蓄。


    按揭制度也是同样的道理，都是为了均衡消费，使消费的幸福、快乐和自由指数达到最大化。'
