    座。当然，也许 2008 年后的 2009 年，中国多出了那么 5 座以上城市。但即使如此，像北京、上海这样千万人口的城市，要多少空置才能拉平全国平均每座城市
    10 万套的空置量？


    即使数据来源并非空穴来风，但笔者还怀疑牛刀先生偷换概念，用“城市空置房”代替了“全国闲置房”！这在牛刀的博文里可以找到蛛丝马迹。其前面说“中国 660 多个城市现有空置房
    6 540 万套”，后面说的则是“社科院城调队说，全国闲置房共有 6 540 万套间”。到底哪一个是真的？


    如果是后者，我要说，实际空置房屋可能还不止 6 540 万套间。因为我国城乡既有建筑面积达 430 多亿平方米，其中 2/3 在农村。根据中国社会科学院发布的
