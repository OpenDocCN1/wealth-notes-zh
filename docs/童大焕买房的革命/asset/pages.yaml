  md: '但这种分析同样忽视了中国的另一个事实，就是中国的区域差距非常大，房价差距也非常大。北京市中心的房价可能在 3 万元每平方米以上，但西部某城市中心的房价可能不到
    1 500 元每平方米。


    任志强在他的博文中写道：北京市人均 GDP 10 000 美元（2009 年度，下同），比中国人均 GDP 约 3 600 美元高出约 1.77 倍，比全球人均
    GDP 8 000 美元高出 25%。如果北京的农村人均人均 GDP 为 5 000 美元，则城市人口的人均 GDP 就超过了 15 000 美元，约等于世界人均
    GDP 的 2 倍，成为发达国家的水平。如西城区人均 GDP 就超过了 30 000 美元，进入了世界的前列。因此北京的房价就在这种人均 GDP 的巨大差异中颠簸，满足高
    GDP 创造者需求的是奢侈型消费，满足平均 GDP 创造者需求的是改善型消费，而那些低 GDP 生产者的则需要政府的帮助或保障。如果硬要按人均 GDP 和平均房价来制定政策，就一定无法满足不同的消费需求，并破坏市场的调节力。


    日本的国土面积是中国的二十五分之一，所以很快完成了工业化，才会有后来的房地产泡沫破裂；香港房地产泡沫也是在后工业化背景下形成的。


    未来 20 年，广袤的中国大地上，无论城市还是乡村都还要建造大量新住宅，一方面是 为了满足富裕居民升级居住环境和“农锦还乡”财富还乡的需求，另一方面也是为了给城市贫困人口和城市新移民提供住房。中国仍然需要大量的铁路、公路、桥梁，特别是住房一—这正是中国长期投资繁荣不会破灭的原因所在。


    当然，就像所有人都会生老病死一样，中国的高房价也不会永远如此上涨。但它的破裂或者软着陆应该是在二三十年以后。随着中国城市化进程的完成，随着住房更新换代基本完毕，随着中国人口高峰的过去，随着市场化的“财富还乡”的自然完成，区域发展不均衡得到极大的缓解，多数人在城市和乡村都同时拥有了住房，房价的下跌必将成为现实。


    根据人口专家的预计，30 年后的 2040 年，我国老人将会超过 4.3 亿，占总人口 30%以上。这时随着?□高峰期（20 世纪 50 ~ 60 年代）出生的人逐渐去世，大量的房子会空置出来。这时候房子很可能成为廉价的过剩产品。当然，区域性很明显，就像今天农村的衰败一样，这个过程首先是从农村和中小城镇开始的。那些中心城市的中心地区以及自然条件优越、基础设施先进的适合富人建豪宅的地方除外。


    另据 2010 年 2 月 24 日《新京报》报道，国务院专家称农村人口 30 年后将减至 4 亿。中国过去 30 年来，城镇人口增加了 4 亿人。目前中国城镇人口规模已经达到了
    6 亿人，还有 7 亿多人在农村（不包括 1.7 亿一1.8 亿已经离开农村到城镇居住半年以上的人群）?今后很长一段时间内，农村向城市的人口迁移不可避免，预计
    30 年后，中国农村将只有 4 亿人口。


    也就是说，无论从老龄化和城市化完成的角度看，30 年后，城市住宅将有可能出现过剩。当然，更新换代是任何时代都离不开的旋律。


