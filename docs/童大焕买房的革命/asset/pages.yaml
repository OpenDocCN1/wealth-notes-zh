- pgno: 47
  md: '地的使用费是多少？康桥工业区管委会告诉记者，工业项目是 25 万元/亩，房产项目则要 100 万元/亩，教育项目低一些，也要 20 万元/亩。也就是说，国家（实际上是由各级政府
    “代表”）3 500 一 5 000 元/亩的征地费（收购价）和 20 万一 100 万元/亩的国有土地使用费（售价）价格悬殊得太可怕了！达 40 ~ 285.7
    倍之巨！


    “如果说计划经济时代的 ‘剪刀差’让农民付出了 6 000 亿 ~ 8 000 亿元的代价，那改革开放以来通过低价征用农民的土地，最少使农民蒙受了 2 万亿元的损失。”在
    2003 年年初举行的 “长安论坛” 上，国务院发展研究中心副主任陈锡文以上海浦东为例一语惊人。他以浦东为例——开发浦东时向当地农民征一亩粮田补偿 2.3
    万元，一亩菜地补偿 2.8 万元，另外再投入六七万元完成 “七通一平” 工程，等出让给开发商时，已高达二三十万元一亩。


    如今，各地的征地、拆迁补偿价格有了很大的提升，但提升速度更快的是土地出让价，征收价格和出让价格的倍数差距不是在缩小而是在扩大，全国各地各级政府仅土地出让收入一项每年就以万亿元计。政府实际上成了全国最大的房地产开发商。


    一方面，征地、拆迁制造了大量房地产的 “被需求”者，但是过低的货币补偿而不是就地实物补偿方式使多数被需求者无法实现就地回迁的居住梦想，一批批的人被从城市中心
    “赶” 到城市周边的偏远区域。


    另一方面，政府全面垄断土地一级市场，市场 “计划征地计划供地市场化竞价拿地” 模式，再加上政府的土地储备模式（实际上就是政府囤地，与开发商囤地赚取土地升值收益并无二致），导致土地价格占房地产开发的成本过高。


    与此同时，由于一级土地的高度计划性、可控性供应，开发商也可以通过囤地、囤房等办法囤积居奇，与地方政府一道分享土地升值的巨额收益。而最终，土地使用年限的减少（按规定住宅土地使用年限为出让日起
    70 年，商业用地使用年限为 40 ~ 50 年）和房价上涨的成本，则全部由购房者承担。


    在土地一级垄断的背景下， “需求增加一价格提高一供应增加一价格降低”的市场规律基本不起作用，再加上房地产市场不可移动的不动产特征，?得人们趋之若鹜的中心城市和城市中心的房价上涨则性格外突出。


    与计划经济时代城市周边和山上活跃着大量 “违章建筑”相似，在今天的土地垄断制度下城市周边也活跃着大量乡村两级政府悄悄许可、在农村集体所有土地上盖的没有县一级房地产主管部门颁发房产证和土地证的
    “小产权房”。据 2007 年 8 月 10 日的《市场报》报道，小产权房的比例在北京当时占 20%，在天津、郊县地区小产权楼房销量占到整个市场的 20%。另据报道，同一地区的小产权房普遍比大产权房房价低
    30%左右甚至更低。


    这些 “小产权房”同样由正规开发?开发，品质并不亚于同类 “大产权房”。“小产权房”价格低的原因到底何在？这也不是秘密——在于省去了三部分费用：一是购地成本，二是各种税费，三是由土地和房地产市场管制造成的
    “公关成本”甚至 “腐败成本”。2007 年 6 月 29 日的一份媒体调查报道，可以清楚地告诉我们税费和土地成本到底是多少。以北京市房山区一个名为 “加州水郡”的项目为例：除了承担约
    1 902 元／平方米的土地开发成本，另外以 8 000 元／平方米售价保守计算税费，每平方米楼面需缴纳企业所得税 2 300 元、营业'
  merge: -1
  img_proc: true
- pgno: 48
  md: '税 240 元、城市维护建设税 400 元、土地增值税 80 元、耕地占用税 8 元以及契税 240 元。即便不算上述 6 个主要税种之外费用的缴纳，“加州水郡”每平方米楼面税费总额已达
    3 268 元。购房者付出过 8 543 元/平方米购买的商品房价中，有 38%将作为税费而缴纳。加上正常土地交易 1 902 元/平方米的土地成本，连带地价和各种税费总额达
    5 170 元/平方米，以 8 543 元/平方米房价计，地价和税费成本占房价的 61%。这里还没有算只有房地产商心里最清楚的所谓“公关成本”或“腐败成本”。


    如果允许土地自由入市，则不仅房价有希望得到较为合理的下降，而且因征地、拆迁而导致买不起房的现象也会大为减少。


    地价升值是政府和开发商以及房地产投资者共同的利润源泉。房地产开发商虽然在土地垄断中也赚取（分享）了巨额垄断利润，但除非他们捞一票就走人，否则，如果还想在房地产市场苟混，他们的巨额收入最终还得投入到更多的买地竞价游戏之中去。因此，土地垄断的最终和最大受益者不是别人，而是地方政府。


    历史上，国人不必因房子而痛苦，一个最重要的原因，在于土地、房产产权属于私人，个人情况各异，房价难以为操控制，反映的是市场的真实水平。而如今，地方政府为了获取更多的土地出让金而有意推高地价。另一方面，则是暴力拆迁一再上演，侵犯《物权法》赋予人们的合法权利。


    仅政府土地收入一项，全国土地出让金 2007 年近 13 000 亿元，2008 年为 9 600 多亿元，2009 年全国土地出让收入 15 910 亿元（全年
    GDP 为 33.5 万亿元）。地方政府从中获利很大，土地出让金已是地方财政的支柱；而房地产商在富豪排行榜上占据如此之多的席位，远远超过其他行业。以北京为例，北京市财政局发布的信息表明，在全球经济哀声一片的情况下，政府财政收入仍然“一枝独秀”，2009
    年北京市级财政收入达 2 026.8 亿元，增收 10.3%，GDP 总量约为 11 346 亿元。


    这其中，土地收入居功至伟。据新浪网地产统计，2009 年北京市国土局共成交地块 245 块，其中经营性地块 133 块，总成交金额约 923 亿元，相当于过去两年的总和。照此测算，今年北京市的土地收入占财政收入的比重将进一步加大，高达
    45%。而土地收入对 GDP 的贡献也将达 8%。


    土地收入的这份成绩单，还是在原定于 2009 年 12 月入市交易的 CBD“中服地块”最终未能按期入市的前提下完成的。中服地块预期将拍出 80—100 亿元的高价，如此计算，北京市的土地收入将占财政收入的一半以上。


    而根据此前的统计数据，北京 2008 年共成交地块 142 宗，成交地块面积 988.5 万平方米，总成交金额 502 亿元，占北京市财政的 27%。


    北京只是全国土地财政的一个缩影。不从根本上解决土地财政问题，要打破土地垄断，难；房地产政策要保持稳定与严肃，难；拆迁过程中要真正全面系统地考虑和维护被拆迁人利益，难；房价要实质性地下降，更难。


    # 地价如何影响房价'
