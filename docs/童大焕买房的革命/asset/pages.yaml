  md: '把房价上涨归结于开发商，于是宣言要消灭开发商，或者土地涨价要归公；把房价上涨归结于买二套、三套房的投资者，于是宣言房价涨价应归公。殊不知，如果没有投资者，今天宣称房价上涨要归公的人们，明天每到一个新地方工作就只能露宿街头或者投靠亲友，因为市场上无房可租；今天宣称房价太高买不起房于是要不顾一切打压房价，哪怕是采取巨额税收剥夺投资者也要把房价打压到自认为合理价值的人，明天可能不仅连房子也买不起，甚至连工作也找不到，因为开公司的成本被大大抬高了——开公司的前提是先要买得起房，否则只能“露天或者搭帐篷办公”进而成为各地城管清理的对象！


    有些时候房价的确是疯了，需要调控（当然最好是市场化手段调控），但我们的理性和智慧决不能疯！如果中国人的理性和智慧在作为经济局部的房价疯狂面前都扛不住，也就意味着其在很多事情面前都扛不住，那就只配回到大家一起受穷的计划经济时代，甚至于只配回到那茹毛饮血的原始森林！


    # 2. “公”在哪里？


    韩寒针对世博会有一段话。


    问：世博会的会馆等结束以后就要拆除，你认为这个浪费么？


    答：我认为不浪费，当时动迁，我们国家自己建设会馆，帮别的国家建设会馆，杂七杂八政府花了不少钱。这些会馆留在上海也没有用，也不能当成政府办公楼，拆了平整平整，好吧这一大块地给卖了做房地产，所以到最后，其实这届世博会既不是政府开的，也不是企业开的，而是房奴和炒房客们开的。


    问：那既然如此，为什么政府还要留下几个展馆不做拆除呢？


    答：当然不能全拆了，全拆了这块地就不能叫“世博板块”了，到时候就卖不出一个好价钱。


    韩寒只是个赛车手、作家，一个不到 30 岁的小伙子，却比当今中国无数经济学家都更加一眼洞穿、一语道破经济的本质。可是一贯受人尊敬、一贯以市场经济为己任的经济学家茅于轼先生，却说出了“房价上涨要归公”这么违反经济学常识、违反市场原理的话，令人错愕不已。


    当然，政府在进行城市基础设施建设的时候，有可能先期投入，打好基础，再卖地进行房地产开发，但那往往也是为了使土地卖出更好的价钱；也有可能后期投入，等有了卖地收入以后，再进行基础设施建设。但最终羊毛都出在购房人身上。


    正如“民可千日无君，君不可一日无民”一样，政府的基础设施建设也并不是城市繁荣的充分条件，鄂尔多斯的“鬼城”遭遇即是明证。内蒙古鄂尔多斯市近年来因“羊、煤、土、气”而扬眉吐气，特别是其露天开采的优质煤炭资源，使其人均
    GDP 迅速超越香港，人均收入在中国排名第二，仅次于上海，超过了北京。财大气粗的鄂尔多斯花 5 年时间、耗资 50 多亿元打造了一幅面积达 32 平方公里的康巴什新城，原意要成为鄂尔多斯对外炫耀的市中'
