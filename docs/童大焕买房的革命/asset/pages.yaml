    # 没炒房利润打压房价？


    +   1. “大白菜涨价要不要归公？”


    2009 年下半年至 2010 年 4 月间，全国房价疯涨到了人神共愤的地步。但与此同时，一些人在疯狂的房价面前似乎也到了神经错乱的地步，房地产成了替罪羊，人们似乎要把所有的愤怒和脏水都泼到地产商和买多套房的人身上。高房价似乎成了天下第一大问题，只要能把它们打下去，似乎可以无所不用其极。


    先是有湖南省临湘市副市长姜宗福撰文建议放缓城市化进程以遏制房价过快上涨，更令人骇异的是，一贯受人尊敬的经济学家茅于轼先生在《新京报》上撰文认为“住房涨价所得应归公”！


    茅于轼先生在文章中写道：“一个人买了一所住房，等周围的市场繁荣起来，或者修通了地铁，房价上涨，他就可以获利。而他对周围的经济，或新修的地铁并没有做任何贡献。”“如何避免买房者能够不劳而获？那就是把住房涨价的所得大部分归公。”


    其实早在 2006 年 2 月，周其仁教授就针对“土地涨价要归公”的谬论撰文《大白菜涨价要不要归公？》：大白菜涨价里面就没有“政府代? 社会投入”的因素吗？要小心了：倘若没有市政道路的投资建设，居民上菜场难于上青天；倘若没有警察维持秩序，买菜路上盗贼四起；倘若没有解放军保卫国防——还有大白菜的交易吗！


    天气、节假日、消费潮流、卫生疫情、人口聚散和家庭变动，等等，都有可能导致相关其他商品的价格变动，那么，这些涨价是不是也要归公？或者归上天？归流行性病毒？归聚集的人平分？


    《中华建筑报》副总编辑朱时均对茅于轼的驳斥很有力：


    “一个人买了一些股票，等股票市场繁荣起来，或者持股企业发达了，股价上涨，他就可以获利。而他对股票市场，或对持股企业的发展并没有做任何贡献。”……我们还可以按此逻辑不断地写下去。这并不是茅于轼新创的学说。20
    世纪，正是在这种学说的引导下，全球范围内进行了大规模的社会实践。上点年纪的人都不会忘记“不劳而获”、“归公”这些血红色的词汇所记录的历史。但是，在那些红色革命取得胜利的国家，打土豪、分田地、没收资本家的财产，并没有使穷人富裕起来，反而使所有的人都更穷（道理很简单：没有人愿意积极主动地创造财富了，人们被动劳动，平均分配——作者注）。诚如茅于轼所言，“周围的市场繁荣起来，或者修通了地铁”，是“房价上涨了”的原因。但正是巨额的拍地收入，使地铁等城市基础设施建设有了雄厚的资金支持；正是城市基础设施的不断完善，使“周围的市场繁荣起来”。试想，如果没有购房者出资，开发商哪来的资金去拍地？毫无疑问，正是购房者的投资使“周围的市场繁荣起来，或者修通了地铁”。由此可见，购房者，即便是纯粹的“炒房者”，都对加快房屋建设资金的运转、推动城市化进程做出了贡献。'
