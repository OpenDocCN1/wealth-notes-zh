  md: '其次，房价上涨要归公，要没收，说起来容易做起来难。以什么标准来？上涨部分呢？是以买进求出价计算吗？那些祖传房产，没有“买入价”，又该怎么计算呢？


    再次，通货膨胀因素怎么算？有人计算过，改革开放 30 余年来，平均每年实际通胀高达 20%以上。很多人买了房，实际上并没有“赚钱”，只是在保值而已。那么，在房价上涨归公或没收的时候，是否也应该先扣除通货膨胀因素？正如复旦大学金融与资本市场中心主任谢百三所言：货币发行量这么大，去年新增
    9.6 万亿元，房地产涨 50%；前年货币政策搞额度制极紧，房地产跌 20%；1999 年 M2 为 10 万亿元，现在 M2 为 66 万亿元；1999
    年复旦大学旁边房产 4 000～5 000 元每平方米，现在 3 万元；不正好是同倍率上升的吗？征物业税、保有税，该去征央行周小川行长的税啊！


    最后，如果要强行实行涨价归公或征收更高额度的营业税，那么人们将被迫采取几种方式来应对：要么改出售为持有，导致市场房源减少，房价上升；要么在出售房屋时进行大量的“税费外交易”，即在全国税费和办理银行按揭时按照房价没有上涨的价格进行交易，房价上涨部分由要买方额外全额付款。这样，相当于买房人的首付被大幅度提高。买房是更容易了呢，还是更艰难了？


    房价上涨归公的恐吓的确可能导致一手房需求也减？，进而可能降低房价，但它同样会导致一手房供给减少进而又推高房价。


    事实上，过去一切试图以抑制需求为手段的房地产宏观调控都被证明是无效的，只会反过来助推房价。房价上涨归公也难免重蹈覆辙。并不是良好的愿望就能收获甜美的果实，那些把局部领域问题过度放大，甚至不惜摧毁市场经济、公民权利、社会公平正义根基也要达到眼前、局部调控目标的做法，尤其需要警惕并应该大声反对之。


    # 房产税，征还是不征？


    很多人把房产税或物业税当成压榨房价的最后一根稻草，千呼万唤它出台。实际这是一个极大的误解。开征物业税或者为了简便程序绕道房产税，根本目的不是为了抑制房价，也不可能抑制房价，不然在房价并不高的
    2003 年，政府干嘛要试点物业税？


    征还是不征，一直是各方争议的焦点。有人总结说，仅 2010 年 5 月份短短半个月，就有 5 个典型观点纷纷登场。一是国税总局新闻处处长：税收立法权在中央，地方政府没有权力出台新税种。二是财政部科学研究所副所长：房产税实施细则的制定权在省级政府，地方可以通过实施细则将个人第二套或者第三套住房定义为经营性房产来操作保有环节的房产税，只需报财政部备案即可。三是国家发改委产业研究所长助理：房产税至少
    3 年内不会出台。四是财政部财税科学研究所所长：开征物业税势在必行，在方案设计上注重渐进。五是全国工商联房地产商会会长：年内国家可能出台房产税试点。


    2010 年 5 月 31 日，房产税话题再度成为业内外关注的焦点。据中国政府网消息，国务院同意发展改革委提出的《关于 2010 年深化经济体制改革重点工作的意见》。《意见》中明确提出，逐步推进房产税改革。另据中国证券报报道，上海有可能成为首个对部分家庭住宅征收房产税的城市，并称有关方案已上报国务院。'
