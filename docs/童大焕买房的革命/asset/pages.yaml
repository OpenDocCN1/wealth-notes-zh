    20 万出头的学生，充分说明流动人口的女大部分并不在深圳就读，试图通过控制子女就读来达到控制人口的目的，看来只能是城市管理者的一相情愿。从全国态势上，流动人口中的农民工就在
    1 亿人以上，而留守女则高达 2 000 万以上。


    在中国，市场经济是一条永远回不去的路。在市场条件下，人口和其他一切社会资源的自由流动，是任何人、任何力量都无法阻挡的社会基本规律。在这?规律下，希望各地城市管理者要有真正的前瞻性、包容性的眼光，审时度势，及时顺应时代发展的必然要求。否则，只会使自己陷入时时被动、处处被动的恶性循环。


    城市资源与人口之间政府公共资源的相对短缺，固然与区域发展不平衡、各地社会保障水平不一致有关，但更关键的原因在于落后的户籍管理模式。中国内地的城市政府恐怕是世界上权力最大责任最小的政府：他们“一视同仁”地从所有居住在本城市的居民中收取税费（中国的税收收入主要来源是消费税。而且，有国家权威数字为论证，从总体上看，各级政府收取的总税费远远高于公民的工资总额。而政府总体上提供的教育、医疗、养老等基本社会保障却几近于无），从包括大量外来人口在内支撑起来的房地产开发中获取巨额利润，却只需为其中的小部分甚至极少部分“户籍人口”提供教育、医疗、养老保险等公共服务。深圳又是这方面的“典范”：从
    1 200 万人里收税，却只需为 171 万人提供公共服务！这就是为什么各大城市政府都热衷于控制户籍人口的原因所在！


    有人说，中国的现实情况是“地少人多”，并且把一部分人口强制性地置于农业领域，使他们不得不接受半失业状态。因为一开始就进入了一个制度难题——城乡分割的户籍制度，于是便产生了对立比较严重的城乡两大利益集团。如果骤然打破两者之间的壁垒（不只是户口形式），后果无异于一场社会动荡。例如，单单宣布农民可以获得和城市居民一样的养老金或退休工资待遇，那么，城市政府财政将立刻崩溃。再比如，按一种建议，让市政府给一切愿意进城农民提供廉价租房，后果也相当惊人。所以，至今没有一个城市政府敢于采取激进的行动来结束我们的一段惊人、尴尬的历史。当初的错误让我们付出了今天的代价，所谓“死人参捉了活人”。


    这话对也不全对。真实的情况是：城市资源短缺的实质是政府公共资源短缺，政府公共资源短缺的实质不是“外来人口”和城市户籍人口争夺政府公共资源，而是城市政府只收税费不提供公共服务的职能缺位！当初的错误让我们付出了今天的代价，如果我们还不敢直面'
