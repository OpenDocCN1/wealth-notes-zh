- pgno: 11
  md: '2010年5月14日《新京报》报道，北京前期房价跌\*快的区域，区域房价松动更为明显。通州新盘成交价不到16000元，和通州前期房价暴涨，部分楼盘报价甚至达到28000元-29000元/平方米相比，通州房价已出现明显的松动迹象。而在此前，通州在售项目包括海棠湾、京贸国际城、珠江拉维家园等报价都在每平方米23000元至25000元以上。在房地产交易管理网上，珠江拉维家园新一期房源公布每套房源价格前，显示的拟售价格为19000元/平方米。


    和一手房相比，二手房的降价幅度更明显。李先生2010年初以160万元的价格购置了“北纬40度”76平方米的一居室。“回国休假，看到北京房价飙升，前景大好，就想炒房赚点钱。”李先生本打算等今年房价再涨一些的时候就卖掉，谁知好景不长，随着出国日期的一天天临近，在李先生打算出手的时候，国家出台了调控楼市的政策，一度火爆的市场急速冷却。“我所有的积蓄都买了房子，出国还等着用钱呢！”急于套现的李先生，决定以190万元的价格卖掉这套房子。然而，随着市场观望情绪不断加重，房子迟迟没有人在接盘。无奈之下，李先生不得不以不断地降低心理预期。最终，以150万元的价格卖掉了房子，算上各种费用，他赔掉了20多万元。小郭祖住在地铁四惠站附近，看号一套四惠东地铁站附近50平方米一居，这套居4月份新政刚出后总价是165万元，一个月内就跌到108万元，“我正准备把这个事儿定下来时，就接到中介电话说，有个业主抢在我前面以103万元买下了”，小郭有些遗憾，“房主主要是着急出手，机会难得。房子没有问题，没有遮挡，南向。”（《新京报》2010年5月28日）


    当然，虽然交易量急剧下挫，但总体而言，降价尤其是大面积、大幅度降价仍然是小概率事件。房价到底会降多少，何时入手“抄底”，一切都需要购房者擦亮眼睛。


    # 房价降了，租金涨


    2010年4、5月份频繁出台的房\*调控政策导致部分买房人观望，由购房转为租房，租赁需求随之上升。据北京中原三级市场研究部的数据显示，新政后一个多月以来北京市二手房屋租赁环比上涨了5.1%，单位使用面积租金首次突破50元/平方米，特别是一些租赁热点区域，一套居的租金上涨300元/月左右，上涨幅度超过7%。受新政影响较大的通州等区域，虽然房价已出现下跌，但租赁价格则出现了明显的上涨，比如亦庄、通州、望京、马家堡区域租赁价格上涨幅度超过了7%。


    根据我爱我家市场研究中心统计分析，整体租金均价比2009年4、5月份上升了近20%。


    我爱我家市场研究中心认为，4、5月份频繁出台的房地产调控政策导致部分买房人延迟购买，转为租房，导致需求上升；其次，部分改善型购房人为了享受首次置业的优惠，先卖后买，造成过渡型周转租房需求增加；第三，2010年拆迁量加大，导致拆迁周转的租房需求上升，这些因素将进一步推热市场。


    此外，报道还显示，北京有成三“抄底族”租房待购，“先卖后买”将增加20%。上海、深圳的情况大同小异。


    # 本轮调控会降多少？何时抄底？'
  merge: -1
