    显然，如此疯狂的游戏不可能持久，必将给楼市的健康发展埋下巨大的地雷和定时炸弹，如果不严加调控，楼市将会成为国内投机者最大的冒险乐园，许许许多多的产业资本、金融资本和民间的家庭金融资本都会前呼后拥地奔向房地产，后果不堪设想。


    这也就是 2010 年 4 月楼市新政最密集、最严厉出台的背景。


    # 房地产的投资属性助长房价


    # 为何房价能够脱离普通老百姓的购买力一路狂飙？


    以我的观察，2007 年 3 月以前的全国房价，基本上都只是低幅度、稳定地上涨，2007 年四五月份后发生突变，2007 年房价有过一次迅速的飙升，于是才有了
    2007 年 9 月以后的宏观调控。


    此后，是猝不及防的全球金融危机使上一轮宏观调控被迫中止，甚至出台了比调控前更宽松的房地产政策（比如放松二套房政策，首套房利率七折优惠，原来不满 5 年普通住宅收全额营业税的改为不满
    2 年收差额，满两年免收，等等），它直接带来了 2009 年以后的房地产市场回暖。加上国家 4 万亿元刺激经济计划的实施，流动性增加使房地?也迅速由回暖、升温转向炽热和过热。


    全国房价从 2007 年开始像脱缰的野马，是有宏观层面原因的：


    在缺乏投资渠道的情况下，房地产成为中国不少居民积累资产、对抗通胀压力的一个重要的载体。


    国务院发展研究中心金融研究所副所长、博士生导师巴曙松先生认为，从 1997 年的亚洲金融危机到 2008 年的全球性金融危机，发达国家和新兴市场国家的债权债务关系发生了根本性变化：1997
    年，整体上看，发达国家是债权人，而危机中的新兴市场国家是债务人，因此发达国家和 IMF 等国际机构提出的“治疗药方”？收缩流动性、加强财政纪律，这显然是出于债权人利益所作的考虑；2008
    年，恰恰相反，发达国家变成了债务人，新兴市场变成了债权人，这时的危机应对政策就变成了大规模的货币投放，提供充足的流动性，财政赤字也不断恶化。在这样的背景下，美国等发达国家的真实债务水平被稀释了；同时，中国等发展中国家的货币政策在很大程度上就被动地需要面临一个十分宽松的环境，一个持续较长时期的低利率环境，这是讨论当前的资产价格时必须高度关注的。


    同样需要关注的一个数据是，从数据上看，美联储一年多来大规模发行货币应对危机，基础货币从 8 千亿美元猛增到 2 万亿美元，广义货币迅速扩张到八万亿美元；与此形成鲜明对照的是，中国的基础货币已超
    2 万亿美元，广义货币达 65 万亿人民币、也超过美国。但中国的 GDP 只有美国的三分之一。


    如果这些大的环境没有出现根本的变化，那么，房地产作为一种金融资产的属性可能短期内难以发生根本性改变。从具体的数据测算看，大致来说，从 1998 年住房制度改革到
    2005'
