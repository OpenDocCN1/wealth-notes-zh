  md: '# 二、城市的“磁石效应”和“公共汽车效应”


    据新华社消息（记者李南玲 姚润丰），作为中国最大的移民城市，深圳的管理人口 2005年已达到 1 200 万人《中国青年报》2005 年 8 月 22 日）。耐人寻味的是该报道将深圳的人口结构分为
    4 种：一是原住民，即特区成立之前的当地人，约 31 万人；二是户籍人口，165 万人左右；三是常住人口，有 432 万多人；四是包括来深圳做小工、当保姆等的滞留人员，约有
    600 多万人。


    将非户籍人?分为常住人口和“滞留人员”，在入口分类统计中，似乎是个独特的创造，耐人寻味，它让人情不自禁地想起北京市民建议“限制低素质人口”。


    一些人在设想对城市实行“人口控制”的过程中，自觉不自觉地用最陈腐落后的身份等级观念将人分为三六九等。他们有所不知，在一个资源配置高度市场化的社会生态系统中，人口的自由流动和自由迁徙就像空气流动一样难以为人调控。于是一些人转而求诸别的办法。比如很多人认为像北京、上海这样的城市，“人口压力”越来越大，是因为享受到了更多的财政拨款和政策优惠。如果通过产业调整和解决财政预算问题来控制人口，或许是解决人口问题的釜底抽薪之举。


    这种想法很普遍，有一定道理，但也并不全面。北京 1 100 万户藉人口，外加 400 万非户籍常住人口，占全国人口 1%多一点，却占全国财政开支的 2.7%（《新京报》2005
    年 8 月 14 日）。但日本东京 20 世纪 50 年代占全国人口的 10%，财政支出也占全国的 10%。到 2000 年，其人口仍然占全国的 10%，1
    200 万左右，但是今天，却猛增到了 3 500 多万人口，占日本总人口的四分之一强。日本作为一个市场经济高度发达国家，东京之于日本享受到的特殊财政支持可不像北京之于中国那样“近水楼台?得月”。


    再说上海和深圳，上海和深圳不像北京有那么多政治资源带给它的财政倾斜，但是几年来入口一样突飞猛进。深圳 2001 年人口只有 400 万，今年常住人口己突破
    1 200 万。


    在我国，人口超过千万的特大城市还有重庆，重庆的发达程度远远比不上北京上海深圳，为什么也聚集了那么多人呢？


    因此，如果不认真研究总结城市发展本身的规律，则无论是试图通过产业政策调整，还是通过财政公平策略，抑或是通过什么“人性化”手段“限制低素质人口”进入还是“鼓励人们从城市转移出去”，都是不得要领，结果都是做无用功。


    在我看来，城市发展有一个重要的规律，用形象的比喻就是“磁石效应”：往往是越大的城市，吸附资源和人才的能力就越强，就像越大的磁铁磁性越强一样。城市发展的原因是格外复杂的，自然的，历史的，政治的，文化的，经济的，都是原因，但这一切，都摆脱不了“磁石效应”的控制。在中国，人口达到
    100 万以上的城市（为什么是 100 万，我有过专门论证，也有联合国的调查数据为证），就形成了一个巨大的“强磁场”，强烈地吸附城市以外的人口和资源。这种“磁石效应”，是自然，历史，政治，经济、文化综合作用的结果，试图用人为的、单边的力量对它做出改变，犹如蜀道之难，难于上青天。


    或许有人说“城市化完全可以通过发展更多的城市来实现，而不一定通过所有人都涌进'
