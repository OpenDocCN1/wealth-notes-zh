- pgno: 49
  md: '2009 年全国“两会”上，全国工商联的一项调查显示，房地产项目开发中，土地成本占直接成本的比例最高，达到 58. 2%。有声音据此表示，房价过高原因在于地价过高。要降房价，先要降地价。不久后，在国务院新闻办举行的发布会上，国土部副部长鹿心社介绍了该项相关的专题调查。国土部调查了
    620 个房地产开发项目，选取了东部、中部、西部的不同类型。结果显示，目前中国地价占房价的 15%～30%，平均为 23. 2%。鹿心社称中国的地价房价比低于欧美及亚洲邻国。他还表示，地价是影响房价的重要因素之一，但不是决定因素，决定房价的根本因素是供求关系。发布会后，鹿心社透露，上述
    15%～30%的比例，并不是说地价房价比最高为 30%。据调查，最高的达到 40%，但“北京并不是最高的”。具体的调查结果，国土部将会公布。


    事实上，房价和地价的关系有三种计算方法，会得出截然不同的结论：


    第一种计算方法，是当前平均房价和平均地价的关系。比如北京土地部门发布的一份监测数据显示：2008 年第一季度，北京居住用地平均为 5707 元/平方米。而据北京市统计局的数据，去年四环以内住宅期房均价为
    15 581 元/平方米。如果扣除政策性住房因素，四环路以内住宅期房均价为 16 892 元/平方米。据此，北京的地价与房价比，估算值在 35% 左右。


    第二种计算方法，是具体项目的直接地价和房价的关系，这种计算方法得出的地价占房价比例最低。由于土地从购买到开发销售有 2~3 年的间隔，在此期间房价会随市场变化和区域地价的上扬而不断调整。这时在房地产销售过程中，开发商就有一笔利润来自城市土地溢价。土地溢价由城市化和区域不断成熟而驱动。


    第三种计算方法，是当前区域房价和当前区域“地王”的价格关系。这种情况下，地价占房价比例最高。各地市场上屡屡出现地价高于房价的现象，被人们形象地称为面粉贵过面包。


    第三种计算方法最 不“科 学”，但往往最能反映出地价影响房价的关系，常常是某地一个高价“地王”一出来，马上就带动了周边房价的飙升。以北京市广渠路 10 号地为例，该地块
    7 万平方米左右的体量拍出 10. 22 亿元高价，合楼面价达 15000 元/平方米以上，这个土地价格甚至高过了周边部分项目此前刚刚打出的开盘价，区域价格立刻被明显拉升，反应最迅速的正是周边二手房市场，“最近不少挂出房源的业主纷纷给我们打电话，要求暂停出售，或者直接提价
    15%以上，最主要的原因就是周边土地价格不断攀高，很可能拉动区域房价，二手业主都愿意再等等，期待更大价格的上涨空间。”西大望路某知名中介门店销售员小王接受采访时表示。采访中了解到，受广渠路
    10 号、15 号地影响，广渠路和大望路周边二手房坐地起价，乐成国际、珠江帝景、石韵豪庭、富力城等重点项目二手房价格普遍上涨，中介报价纷纷上调 1500~2000
    元/平方米不等，区域二手房价格普遍从 15 000~18 000 元/平方米上涨到 17 000~20 000 元/平方米，甚至更高。富力城的业主更是报出了
    3 万元每平方米的天价。而这个价格，应该是广渠路 10 号地未来的赢利价格。


    也就是说，在天价地王的刺激下，房价是被提前透支的。这就是“地价推高房价”的内 在机理及根源。因此，哪怕我们根据“最符合实际”的第二种计算方法，得出并非地价推高房价的结论，这个结论本身也是不科学的。'
