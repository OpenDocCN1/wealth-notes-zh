  md: '据亚豪机构统计数据显示，2010 年 4 月及 5 月中上旬入市的项目，多以老项目后期开盘为主，新项目仅 8 个，所占比重仅?14. 5%。5 月已开盘项目仅
    13 个，大大低于 4 月底时统计的 45 个，而新政影响才刚刚开始。


    原计划在 6 月推出新盘的开发商更多的进入了“观望”。在未來的一个月中，开发商是按吋开盘，还是同机而行，还要看市场总体反应。降低預期价格者有，价格不变者亦有，还有的楼盘因位置好、人气好，依然坚挺。降价楼盘如兴创?D
    标，原计划均价 28 000 元/平方米，现在不得不調低，预计开盘价会略高于 25 000 元/平方米；天润福熙大道也把预期售价调低了 3 000 元/平方米，意在吸引仍在观望中的购房者。


    新政以來，从 5 月 1 日至 26 日，北?共有 13 个以住宅形式进行销售的楼盘，两个楼盘出现零成交现象，分别是 5 月 13 日获得预售許可的天鹅堡、5
    月 14 日获得预售许可的保利?西山林语。后者一次性获取的预售许可房源为 600 余套，至今未售出一套。此外，有 5 个在 5 月获得预售许可的楼盘成交套数为个位数。而如果把取得预售许可的时间提前至
    4 月 15 日，则有 6 个楼盘零成交。


    和 2007－2008 年的上一轮调控相比，这一轮楼市反应更为迅猛。此轮调控开始后，楼市成交量应声而落。根据中原地产统计，4 月下半月纯商品住宅期房签约 3
    097 套，比 4 月上半月 5 095 套下降 39. 21%。4 月全月日均签?量为 273 套。而 5 月 1 日至 26 日，扣除政策房，北京纯商品期房住宅签约
    2 904 套，日均签约 112 套，比 4 月全月下降 59%。这一个全国开发商愁云惨雾的 5 月，上海一手和二手住宅成交量环比皆下降七成，深圳萎缩超过六成，广州下滑三成（皆为环比）。


    上一轮调控的影响要慢得多。2007 年 8 月 7 日，国务院下发《关于解决城市低收入家庭住房困难的若干意见》明确 “7090” 政策；9 月 27 日，央行与银监会联合发出《关于加强商业性房地产信贷管理的通知》，要求第二套住房首付不得低于
    40%，利率同时提高 10%。根据交易管理网数据统计发现，2007 年 8 月，北京全市商品住宅（当时统计未扣除政策房）签约 11 833 套；2007 年
    9 月，这一数字上扬到 13 155 套；2007 年 10 月，开始下滑，为 10 488 套。


    除了成交量，房价也开始出现松动。《每日经济新闻》记者调查发现，万科五号公园楼盘内的独栋商业项目万科五号公社，实际销售均价已从 4 月的 5 万元/平方米下降至
    4.55 万元/平方米。实际上，万科在北京热销的四大楼盘：万科五号公园、万科蓝山、金隅万科城与万科假日风景均出现价格松动。虽然其最高降幅也不过 10%，但其多年业内老大的地位，其示范效应不言而喛。2008
    年万科主动降价，引领行业步入?格下降通道的一幕，人们或许记忆犹新。


    与此同时，一则关于 “万科 6 月份开始全国降价，但具体降价幅度未知” 的消息近日引发业界震动，但 6 月 3 日，万科方面对此公开否认，称该消息的内容 “不存在”。万科不会从总部向个地方公司下令进行全国性统一降价，因为全国的项目价格都有差异。万科会让各个公司根据各地的实际情况，追踪市场走势确定价格。业内人士认为，这流露出万科下一步将采取降价以适应市场趋势的可能。'
