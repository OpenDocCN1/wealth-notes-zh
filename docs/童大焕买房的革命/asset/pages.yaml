  md: '就连力主征税的财政部财科研究所所长贾康自己也承认：“从美国等市场发达国家的推行（房产税）情况来看，房价并没有明显的下降。这是因为在城市化发展过程中，各个国家都不能避免房价长期上涨的趋势，中国更是如此。“在这个城市化的过程中，我没有看到有任何可能，会在长期趋势上改变房价的上升。”在贾康看来，今后将有
    5 亿多人口从农村转移到城市，房价的上涨趋势恐怕没有任何力量能改变。


    我的判断是，短期内，房地产税也好，物业税也罢，基本可以肯定不会征，但是那根棍子会时不时林司蛇影出来舞几下，吓唬一下那些“不明真相的群众”，同时表明有关部门还有调控房价的“杀手铜”。隐而不发，对市场的威慑作用才能最大化。否则，一旦开征，人们发现它不过是银样镴枪头，反而引发楼市反弹。真要征的话，还牵涉立法程序、技术手段、中央与地方财政分权分利等，这些问题没谈妥，都不会贸然开征。


    而从长期看，物业税?房地产税一定会提上议事日程，理由很简单，这牵涉各级政府的巨额税收。在城市化初期，地方政府靠卖地获得巨额收入，一旦城市化发展到一定阶段，政府卖地收入必然逐渐减少甚至出现锐减，而此时老百姓手上开始或已经持有大量住宅，各级政府必然转向靠物业税或类似物业税的房产税来维持巨额财政收入。至于征税的理由，它可以借打压房价的名义进行，也可以拿国际惯例说事（但国际惯例的前提是土地及其地下面的矿产、文物皆私有，当然，发现者可以分成）。


    但不管是短期还是长期，房产税或物业税注定与房价无关，那些指望通过物业税或房产税来打压房价的人们一定会失望的。


    # 背离税收本质的重税主义害人已


    谈到一些人试图用来“调节房价”的物业税或房产税，我们不妨来回顾一下另外两个税种。


    一是媒体报道有机预估计未来 5 年内，中国奢侈品市场将会占据全球奢侈品消费额的首位。这其实是条老新闻，但该新闻之后有个说法，说是五成以上的奢侈品用于送礼。后面还有个讨论，就是要不要征收奢侈品税？赞成者认为可以调节社会分配不公；反对者认为这么征税只能把消费力量浪费在国外。


    其实长久以来，我们这里对于奢侈品都征收高额的关税，个别商品还征收特别消费税，弄得我们的消费者纷纷亲自到国外或中国香港等地消费，或者找朋友代购。别的地方成了消费者的天堂，我们则什么税都没有收到，更别提什么“调节收入分配”的崇高理想了。


    与此如出一辙的经验教训是，中国国内的个人所得税几乎居全世界最高，其伟大的雄心抱负也是为了“调节收入分配”，但结果和对奢侈品征税一样，逼得很多跨国公司高管大部分时间待在海外或中国的香港、台湾等地，因为那些地方个税税率低得多，只要他们一年在外待足
    183 天，就不用在内地缴税个税。结果是个税损失了，其他各种消费的税收也损失了。偷鸡不成蚀把米，赔了夫人又折兵。


    在住房保环节上征收物业税或房产税的机理与此相同。'
