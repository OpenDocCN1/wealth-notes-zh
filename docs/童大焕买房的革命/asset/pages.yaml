  md: '机性资金导致了楼价上涨。就像我前面说过的，中国的汽车价格是美国的 3 倍，且中国已经成为全球第一 大汽车消费大国，但再多的需求也不会助长车价。实体不实，虚拟不虚，如果
    我们把城市化视为扩大内需的主线，产业结构的调整就离不开城市化。股市楼市作为中国的 新兴产业，和传统制造业相比可以说是虚拟经济，但和城市服务业相比就不是虚拟经济了。


    我个人认为，做长远打算的住房价值投资行为，对社会并没有什么危害，相反是在增进 社会福利。做长远投资打算的人，一般准备好了足够的人均信用即月供准备，不影响金融体
    系的健康稳定发展。同时，做长远投资打算的人，其所购房屋一般会长期用于自住或出租， 并没有违背房屋的自身功能。再者，住房投资者为大量的城市新移民和各类公司提供了足够
    的房?，降低了全社会的创业成本和外来人口的进入门槛，相当于为社会各阶层提供了更多 更广阔的上升空间。想想看，如果没有住房投资者，开一个公司要先买房，进城只能先买房
    或住宾馆，要么就只能露宿街头。那会是一种什么状况？


    当然，出于照顾和尊重公众情绪考虑，笔者也不反对适度限制投机者。虽然比起楼市投 机者来说，中国股市更是满足买房投机者，但适度投机有时也不完全是坏事，比如有利于资
    金流动，等等。而且，不论古今，房产、地产在全世界都有投资功能，要完全抑制投机性需 求是不现实也是不可能的。但笔者还是有保留地同意适当减少和防范楼市投机者。


    关键是，如何区分投资性需求和投机性需求。其实我们过去一直都对投机性需求采取警惕 甚至防范措施，但效果并不明显，原因何在？就在于没有严格准确地区分投资和投机的区别，
    把二者一锅烩，在严厉打击投机时往往把正常的投资行为也一并打击了；为了鼓励投资时则 又把投机行为一并放松了。结果导致一管就死一放就乱的局面循环出现。


    我们现在通过限制二套房贷的办法来限制投机行为，就是一个不得要领的政策。比如提高 二套房首付和利率，不仅打击了改善型、养老型需求（比如有人要在老家或在自己居住地附
    近买房给老人住），而且对真正的投机性需求起不到打击作用。原因在于：投机与投资的最 大区别是投机者往往是手持大量现金的短期持有者，利率提高和首付提高对其影响不大，不
    少投机者甚至手中随时持有几百几千万元现金（2010 年初疯狂的海南炒房者即是如此），一 遇到机会瞬间全款拿下，再过几个月甚至更短时间就迅速脱手。


    当然，也有人说，人们有一套房就足够了，对于真正需要改善性住房的人来说，有了足 够经济实力才来改善。因此，通过二套房以上的“去银行杠杆化”，的确能够在相当程度
    上对投资者形成限制，?不会“误伤”改善性住房需求者，因为既然是改善性需求，就要在 满足一定的实力条件下来再改善。


    房产或交契税不满 5 年要缴纳 5.5 个百分点的营业税，对投机的卖房人来说也没有任何 影响，因为在卖方市场下，税费几乎毫无例外地转嫁到了买房者手里。


    因此，我们现在通过提高二套房贷的首付和利率，并且增加不足 5 年年限的二手房税费 的办法，可以说对打击投机性购房者是南辕北辙的。它不仅不可能抑制投机性购房，并且还
    有间接抬高房价之嫌，因为所有的税费成本最终都要转嫁到房价中来。


    那么，投机?购房的真正要害在哪里？在于时间！除非有特殊原因，否则，短期内买进 又卖出的房源多数可以认定为投机性购房。只要我们从“时间”上严格把关，就完全可以对'
