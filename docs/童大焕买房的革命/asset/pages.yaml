  md: '个文化过程?理由是短期的经济行为可以由经济逻辑来解释，但长期的经济行为靠经济逻辑则无法给出答案，必须求助于文化逻辑。格龙多纳认为，个人、家庭、民族、国家莫不如此。就个人或者一个家庭来说，长期赚钱的目的在于用货币来达成非货币的目的，如人们所追求的幸福、自由和安全。长期经济行为的目的在于当人们的衣食温饱获得基本满足后，必须面对非货币的文化命题：幸福、自由、尊严、慈善、等等。短期经济行为使货币目的得以实现后，接着文化目的就快速替代经济目的。文化价值观最终决定经济发展的程度。当然，非经济的目的并不是反经济的，而是亲经的。格氏指出，文化在整个经济发展过程中起着指引作用，因此一个国家或者一个家庭的不富裕，也可以归因于其文化心态的指引。他的结论是：从一个国家或地区文化观念上的某种特征，就可以判断其文化发达的程度。只要具备了某些特征，一个国家或地区即使现在不发达，一段时间之后也会发达起来。


    我的意思是，中国小城镇和乡村脆弱的政治、经济和文化生态，决定了中国的发展必经大都市圈——中等城市—小城镇和乡村的“城市包围农村”的过程。中国的人口迁徙和房价涨势也必然遵循此顺序。


    上面说的房价是长期房?走势。长期房价由城市化决定，但短期房价由货币供应量即政策决定。这就是为什么 2007 年房价高峰之后，会有一个暴跌的过程（此番“暴跌”还有全球金融危机?的原因）。一项针对
    2002—2006 年相关数据的分析结果显示：房地产?供给每增加1%，房价就增加 0.45%；反之亦然。


    # 附： “高密度城市化”拯救中国


    # 一、“资源极限”呼唤中国城市化


    鉴于北京、深圳等国内大城市试图想方法控制人口，并且人们热烈地议论这个话题，学者秋风先生提出一个观点：城市的人口最优规模无法计算，也就是通过行政手段无法达到城市人口规模的最佳效果。而在自由的城市里，资源是没有极限的。其论证之一是：1980年，一位生态学家和一位经济学家就
    5 种金属——铬、铜、镍、锡和钨一一来?的 price 打赌，以 1000 美元下注。那位生态学家是 58 岁的保罗?厄尔利奇。1974 年时他预测，到 1985
    年，人类就将进入资源匮乏时代，许多人类赖以生存的矿产将濒临枯竭。那位经济学家名叫米利安?西蒙，他认为，人口增长并非坏事，而是一种实惠，它最终会导致更干净的环境和更健康的人类，因为有更多的人奉献出了更多的创意。因此，地球上的资源是
    “取之不尽” 的。两人打赌的结果于 1990 年秋揭晓。厄尔利奇什么话也没说，只是将一纸有关金属价格的计算结果，连同一张 576.07 美元的支票寄给了西蒙。他认输了，剔除通货膨胀，自
    1980 年以来这 5 种金属的综合价格下降了。西蒙作为一位杰出的发展经济学家，他再三提醒人们注意这样一个常识：过去几十年，全球人口增长了好几倍，但资源并没有随着人口的急剧增长出现枯竭，相反，所有物品的供应更丰富了。


    对此，中国人民大学副教授马少华先生提出反驳，理由是：人口与资源的制约关系问题是当今人类面临的基本问题，不仅城市为然。所以，才有全球控制人口的基本共识和中国计划生育国策。而一座城市比一个地球的空间要小得多，它的资源制约问题更具体、更适宜，周围的余地也更小。那么，为什么我们能够接受在全球范围内控制人口，而不能接受在城市范围内控制人口呢？'
