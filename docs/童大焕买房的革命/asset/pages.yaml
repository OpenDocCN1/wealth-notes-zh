- pgno: 9
  md: '造了股市与楼市两大交易市场，人们会不知不觉地进入“股价房价螺旋生产家庭财富”的循环。当这种家庭财富变成了一种生活方式的象征，变成了多数人的追求，我们就会看到，这种财富从农村流向城市，在城市化进程中，人口的流动，货币的流动几乎必然推高房价。人口不断涌入城市会使得城市土地变成稀缺资源，从而导致房价飙升，而这个趋势只有在城市化基本完成的时候才能减速。


    也就是说，政府的行政调控之手，无法从根本上改变房价长期上涨的趋势。那么，其调控的目的，自然也不是为了让房价大幅度下降，同时也不是为了让想在城市和大城市买房的人都买得起房，因为即使它想这么做，面对“全国人民向往北、上、广、深”，它也没有那个能力。如果政府有那么多万能的手，全社会早就该跑步进入共产主义了。


    在我国，政府的调控手段很多，甚至可以在非常时期直接采用非常行政手段，比如北京 2010 年 5 月 1 日起实施（没有明确规定截止日期）的“每户限购一套”，外地户籍人口没有在北京的纳税、社保等证明不予贷款等政策。但是，政府调控不得不投鼠忌器，毕竟，不管人们承认不承认，当下中国，房地产业是结构失实的国民经济支柱产业，这是社会?史发展的客观必然。以
    2009 年为例，当年全国 GDP 总额为 33 万亿元，商品房销售额就达 43 995 亿元，占 GDP 总额的 13.15%，况且，房地产业还直接带动了国民经济
    60 多个产业。


    另一个投鼠忌器的是银行风险。如果房价下降太多，降到购房者首付都亏掉，再降到房价的价值值低于银行欠款的时候，大量弃房逃债现象就会产生，银行变成房东不说，金融危机将有可能直接导致经济和社会危机。


    既然如此，那么政府为什么又要“逆历史潮流而动”、“不自量力”、甚至不惜背着“越调越涨”的黑锅进行宏观调控呢？其实它是不得已而为之。因为马克思早就在《资本论》中说过：“一但有适当的利润，资本就胆大起来。如果有
    10%的利润，它就保证到处被使用；有 20%的利润，它就活跃起来；有 50%的利润，它就铤而走险；为了 100%的利润，它践踏一切人间法律；有 300%的利润，它就敢犯任何罪行。”像
    2009 年下半年至 2010 年 4 月 17 日那段时间，房价动不动在短时间内上涨 50%甚至翻番，如果加上银行的 5 倍的杠杆效应（以首付 20%为例），其利润何止
    300%！这样的结果，不用想都会明白。


    在认清了这样的背景下，我们将必须长期接受“两只手”，一只是看不见的手——市场，另一只是看得见的手——政策。如果没有政策调控，就难以遏制房价过快上涨。只有通过这只看得见的手，才能使房价保持平稳上涨，付出较少代价完成中国的城市化。


    认清了这一点，也就认清了政府宏观调控的真正目的：遏制房价“过快上涨”，而不是遏制房价上涨。在市场之手和调控之手的双重作用下，内地?市房价将长期呈波浪式上涨态势，短期内跌宕起伏，长期看波浪上升。


    # 史上最严调控立竿见影


    2010 年 5 月 28 日，“史上最严房房地产市场调控政策”行将“满月”之时，《新京报》做了一期专题“触‘冰’——北京房地产新政满月观察”，调查发现，此轮调控在一个月内对楼市的影响比上一轮“更生猛”：纯商品住宅期房日均成交量下降六成，个别投资者“十万火急”售房。楼市触“冰”已现。'
