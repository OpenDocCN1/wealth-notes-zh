  md: '投机性购房实施精确打击。投机者要全款买进房源，那是上帝也没有办法的事，但政策可以对其短期出售行为加以严格区分和限制，根本办法就是出其出售行为中消除银行的“杠杆效应”。必要是时也可以增加限制。投机者要买套房吗？可以，法律也无法限制你的产权自由，但是政策和法律可以规定，如果不足两年或者不足一年卖方，买方不管是二套还是三套房，利率都可以优惠，这只取决于买方的资质和?用度，但是首付却要大幅度提高，首付必须是
    80 %以上甚至银行拒绝贷款！这样，基本上就只能靠投机者本身来接单，银行的杠杆效应被降至最低，住房投机者的交易行为就相当于受到了最大限度的限制。简而言之，相当于形成了一道无形的防火墙，把投机市场和正常的自住与投资市场隔离开来，使住房投机行为被限定在数量不一定很大但能量十分了得的投机者之间，形成了一个相对独立的、与自住需求和正常投资井水不犯河水的“住房投机市场”。


    # 经济适用房何以沦为穷人“负福利”


    2008 年，河北、辽宁、山东等地先后停建经济适用房，纷纷提出以扩大廉租房保障范围解决低收入者家庭住房困难问题。其中的主因，是在我国实体经济下滑、房地产交易急剧萎缩的严峻形势下，许多城市的房价明显下跌，使得普通商品房与经济适用房价格差距越来越小，从而引发购房对象纷纷弃购。


    而很多人忙不选地站出来反对放弃经济适用房，我对此仔细分析，却认为经济适用房政策早就该停止了。何以有此动议？


    经济适用房是我国在房改过程中由政府推出、为满足中低收入家庭购房需求、具有社会保障性质的住房。从 1991 年开始酝酿，到 1998 年正式启动，2005 年达到高潮。这一时期的经济适用房，虽然对购买者有一个收入指标要求，但不少地方的审核并不严格，有的地方政府干脆把审核权下放给了开发商，从而使审核沦为走过场。一些开发商出于逐利的目的，甚至把经济适用房建成一二百平方米的豪宅，甚至更大的复式（楼中楼）结构，真正的中低收入阶层根本买不起，中高收入阶层甚至在同一个小区两套三套地买；有的地方，所谓经济适用房，干脆就是地方机关干部的“特权房”、定向销售，根本不对社会开放。开着奔驰宝马住经济适用房的，并非一时一地之景象；已售经济适用房呈现“高租高套”等，也是寻常风景。


    这个时期的经济适用房，可以说谁买谁合算。因为虽然有 5 年内不得出售、上市需后补缴成交总价 10%的综合地价款等规定，但比起与普通商品房的差价来说，还是大大占了便宜。但由于户型太大、定向销售等原因，享有者多是一些机关、事业单位人员，以及社会上一些中高收入、又能得到购房指标的“灵通人士”。一个以接济中低收入阶层的社会福利制度，就这样演变总体上“劫贫济富”的“负福利”。


    这一时期的经适房，虽然有部分拆迁户利用拆迁补偿认购，但一方面他们不占绝对多数；另一方面，他们必须为此付出时间和机会的代价，因为社会有一个基本规律，越是中低收入阶层，也就是所谓的穷人，付出的劳动时间往往越长。因为经适房普遍地处偏远，尤其是专门针对拆迁户的经济适用房，更是如此。他们又不像富裕阶层，有钱在其其他地方另购商品房自住，经济用房用来出租。于是，他们获得了部分房产福利，却必须付出下岗付出更多的艰辛、更多的“生命成本”，甚至于他们以及他们的后代，可能为地处偏远而失去更多、更好的人生选择和成长机会。这是穷人住经济适用房的“隐性负福利”。'
