  md: '人的东西。


    今日中国房价畸高的原因是政府与民争利过甚，而争利过甚的症结是政府垄断了一级土地的供应？，政府成为事实上的最大地产商。过去计划经济时代的住房分配模式导致的大量腐败低效无法解决中国城乡居民的住房问题，中国香港和新加坡主要由政府提供廉租房等的模式也解决不了中国的住房问题，当下中国由政府垄断房地产开发的土地的垄断和与民争利模式也解决不了中国的住房问题，真正的市场化才是中国住房问题唯一正确的解决之道。农村住宅和农地与国有（实为政府所有）土地同地同权则是解决土地和房地产市场化一道绕不过去的坎！


    走过这道坎，则不仅农民在土地和房屋上面的财产权得到了与城市居民同等的保护，而且因此产生的财富效应将使大量贫困的农民和城市贫民一样拥有大量财富，从而为城乡差距的最终缩小奠定础。而在此基础上城乡房地产市场，也将获得长期稳定的自由发展。尽管中心城区和成熟开发区域的房价未必因此下跌，但房价畸形走高导致多数人买不起房的局面将大为改观，因为土地的差异化供应局面得以形成，房地产的差异化供应同样得以实现。


    而那种试图让政府一揽子包下老百姓住房的住房乌托邦，表面上是在替老百姓说话，实际上是在回避主要矛盾，采取的是两边都对好的骑墙与投机姿态一除非持此观点的人有足够的理由相信政府的确有那个能力，否则正如我们所知道的，即使政府不兑现承诺，在当下的制度体系中老百姓也拿它没办法，就像教育欠账一样。


    农村集体建设用地入市，首先受到打压的将是目前价格高高在上的城郊别墅。同时农村入市将增加城市建设用地，降低准入？准，必然会催生出更多的中小房地产开发企业，从而体现更充分的竞争，改变房地产市场的供求关系，打击开发商囤积待涨的局面，让房价降到合理的水平。


    # 小产权房的合法化之路在哪里？


    中国社科院发布的2009年《农村经济绿皮书》指出，农民住房空置率在30%左右，可以考虑开放土地抵押市场，允许农民宅基地永久使用权自由买卖，允许农民“带地进城”。绿皮书分析，十七届三中全会前，地方官员积极推进村庄兼并，扩建建设用地资源的做法早已存在，土地开发商低价获得土地后建造房屋，将一部分房屋低价出售给农户，另一部分作为商品房按照市场价出让给市民。同样，农村宅基地在一些地方事实上也进入了建设用地市场，有的地方鼓励城市资本与农户合作建造房屋搞旅游用房开发，典型的做法为农户投入宅基地，城市商人投入资金，房屋工程完工后城市商人获得的部分房屋一定期限的使用权，意味着农户的宅基地使用权已经部分流转到城市商人手中。对此，绿皮书认为，“小产权”与“大产权”的区分意义已经不大，相关政策应做出调整，以适应现实变化，而农民的地事实上已进入市场，现行法规应适应形势做出修订。


    但是目前，农业土地流转中由基层？保“操刀”的情形普遍存在，它潜伏着巨大的隐患。比如各地搞的“宅基地换住房”、“土地换社保”等模式，实际上都是为地方政府的土地财政进行土地储备，农民真正得利的很少，在失地失业中形成隐患。比如小产权房，主要得利者也是基层政府和开发商、县以上政府和农民，以及城市低收入阶层及需要进城买房的农民（移民），大多数没有从中得利。现在的小产权房，实际上控制权还是在乡村政权手里，而购买'
