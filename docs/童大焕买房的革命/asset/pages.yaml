  md: '如此优惠的条件，如果你能够买得到共有产权房，我劝你赶紧买，一分钟都不要犹豫。但我相信，传统经济适用房富人豪车扎堆的现象，只会在共有产权房中更严重。


    另一方面，现有共有产权房对穷人的“准入门槛”并不低，因为其七成比例部分需要交全款。假设共有产权房是同期商品房的 一半，那么按个人七成模式，个人一次性付款部分是同期同面积商品房的
    35%；按个人五成模式，个人一次性付款部分是同期同面积商品房的 25%，都比商品房的二成首付还高。事实上共有产权房、经济适用房通常还不可能便宜到只有商品房价格的一半。因此，购买共有产权房一次性付款的额度要远高于购买商品房的首付。


    有关方面目前正在努力探索通过政府引导的国有公益性担保公司，帮助购房家庭贷款解决一次性支付个人产权部分的压力。但这样的便利同样会惠及骗购者，进一步降低骗购者的投机成本。


    # 潜新模式解决不了中国住房问题


    在民间民主主义和政府垄断利益的“一拍即合”双重推动下，中国的房地产市场呈现出越来越怪胎化的扑朔迷离景象：一是市场受到越来越严厉的打压；二是许多学者呼吁取消的经济适用房（代之以面积足够小的廉租房）不仅没有取消，而且各级政府加大了供应量，只不过把面积限制在
    60 平方米以内。除此之外，一些地方政府又相继推了非驴非马、既非保障性又非市场性的“两限房”（限面积和价格）、“三限房”（限面积、价格和收入）；三是农民绝地自救式、意义不亚于当年安徽风阳小岗村“分田到户”的小产权房再度被叫停，政府对土地的绝对垄断地位进一步被强化。


    非仅小产权房被叫停，有关部门还重申城市居民不得到农村购买农民的土地、房屋和宅基地，将农民的老宅地、土地和房屋交易严格局限在鸡犬之声相闻的同村农村居民中。这样做，不仅剥夺了许多在农村工作的城镇户籍教师、公务员就地购房居住的权利，而且？实上剥夺了农民一生中最大宗的土地和房屋的财产权，使他们的“财产性收入”陷于虚无的境地，也使城市文明向乡村的回流遭到致命性、根本性的制度性阻断，使中国乡村不断陷入经济和文化双重失血的状态，加剧了乡村的经济贫困化和文化荒漠化进程。


    此举意味着政府对农民的双重剥夺：一方面，地方政府可以通过极其廉价、世界上可能独一无二的“买方定价”的强制乃至暴力手段从农民手中征地；另一方面，它迫使大量农民加速进城的速度，又被迫接受城市高房价的第二重盘剥和掠夺。前国资委研究中心孟宏伟、北京科技大学经济管理学院教授赵锐认为：相比于真正要叫停政府对土地的垄断，此举实在是开历史的倒车，将令整个
    国家走向极其错误和危险的路途。此种左手掠夺广大农民右手盘剥广大市民的恶劣运动，使得中国的房地产发展模式越来越向中国香港、新加坡的怪胎模式——左手从老百姓口袋中掏钱，右手建经济适用房和廉租房，而不是走向市场经济国家和地区的
    normal market 模式。


    中国香港模式的形成有它的历史原因：港英政府临走前通过垄断土地获利，直到目前，整个香港的土地开发率只有 23%，而与这种挤牙膏式的土地供应相对应的，是香港居民极其恶劣的居住环境，全世界都罕见。新加坡的情况同样特殊。它是一个海岛国家，土地奇缺，'
