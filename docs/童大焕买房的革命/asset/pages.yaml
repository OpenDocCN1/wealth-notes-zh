  md: '几个特大城市来解决”。其实，“发展城市”是个自然而然的过程，也就是个体自由选择城市的过程，而不是城市来选择个体。而所谓“特大城市”是什么个标准，却是无法自我定义的。如果
    2001 年深圳 400 万人口的时候宣称自己已经特大，并且采取一切办法（事实上不可能）控制人口，那么今天其 1 200 万人口又是什么概念？同理，2000
    年东京人口 1 200 万，它也不敢宣称自己已经？大因此就阻止“外来人口”进东京，而东京今天已经有 3 500 万人口。既然所谓“大城市”和“特大城市”无法自我论证，其“控制人口”的理由自然也站不住。


    但为什么一直听到有人说要控制城市人口呢？这就是城市发展的另一个效应——魏海田先生说的“公共汽车效应”：住在城里的人，会因为外来人口不断进入而感到不满，因为他们的生活空间日渐局促，他们会觉得比起原来的生活感觉更拥挤，更嘈杂，上下班消耗的时间比原来更多。于是他们就会呼吁，对外来人口的进入要加以限制。这就是所谓的“公共汽车效应”：没有上车的人拼命挤？挤，已经上车的人就希望下面的人不要再上了。不幸的是现在有关城市发展的大部分决策，就是这些现时的“城里人”做出的。


    问题是，城里人认为不堪忍受的拥挤、嘈杂、交通拥挤，城外人也许并不觉得不堪忍受，因为他也许会觉得还是城里耗小、机会多，更能发挥自己的才华。在我国人口流动越来越自由的情况下，每个人都会寻找“个人利益最大化”的环境。当他发现某个城市更有利于实现自己的价值，他一定会向这个地方流动。任何人人都挡不住，别人无法代替他做出选择。现在的城市只达到“公共汽车效应”境界，即城外人想进来，城里人不希望城外人进入的境界；并没有达到“围城境界”——“城外人想进来、城里人想出去”的境界，说明城市的“容量”还大得很。等到城里人真正不堪忍受了，自然会有一些人乃至许多人搬出去，或者住到郊区，根本不需要任何政策动员和疏导。到那时，顺应的是另一种自然规律：中低收入人群高密度化生存，高收入人群低密度化生存。


    # 三、城市资源“短缺”的实质及对策


    深圳最近一段时期一直在强调自己面临土地、能源、人口、环境四大危机，并试图通过外来人口子女借读费，其父母必须入当地社保等措施，控制外来人口增长。


    许多大城市近？来“限制”外来人口的理由和深圳几乎如出一辙。但其所谓的资源危机，实质上不是真正的社会资源危机，而是传统僵化的人口籍为模式进行行政管理导致的政府公共资源危机。以深圳为例，其宣称管理人口已突破
    1 200 万人，而承载这几千万人的深圳总的土地面积只有 1 953 平方公里。事实上土地是可以适当向外扩张的。深圳市 2003 年就已决定将宝安、龙岗两区
    218 个村，总量为 956 平方公里的集体土地，除了“已建成区、经批准尚未使用的建设用地、山林地、坡度大于 25° 不作为建设用地的园地”之外的 260
    平方公里全部变为国有。（《新京报》2004 年 7 月 1 日）


    但深圳的教育资源却实实在在在受到了挑战。并不是“人口问题让深圳的城市资源、环境的可承载力逐步逼近极限”，使有关方面被迫做出控制人口的决定，而是“子女上学、社会治安”等现实的政府压力让有关当局面难以应付。


    面对这种局面，有两个选择：一是增加治安力量，加强学校建设，以满足人口增长之需；二是学校和警察维持现状，控制外来人口。前者需要政府加大财政投入，后者则似乎不必增加其财政投入。于是，城市管理者优先选择后者。'
