    中国城镇的住房总量已超过了 140 亿平方米，其中一半多是 1998 年住房商品化以后的产物。自 1998 年以来，全部住宅竣工总量约为 74 亿平方米（只有这部分才可能有商业贷款），其中商品房住宅竣工总量约为
