  md: '大量土地靠填海造田形成。


    中国内地与新加坡和中国香港还有一个最本质的区别，就是后两者都是相对封闭的城市国家或地区，但当代中国各城市尤其是各大中城市，却无一例外地面临着个来自全国各地大量新移民潮水般涌入的状况。这种极其动态的现实，任何一种相对静态的计划管理模式都无法适应，而只能用自身也高度动态的市场办法来调节。


    以北京为例，事实上它已经至少连续 5 年人口的自然增长率为零，但机械增长亦即新流入常住人口的数量每年高达 40 万以上且每年增加，2009 年已达 65 万。而现有的北京户籍人口中，除了极少部分在计划经济时期既没有分到房，在市场经济时代又无力购房的低收入人群需要廉租房保障之外，相当多的人已经有了两套以上的房子。一般一套是计划经济时的单位分房，另外一套则是从市场上购买的升级换代产品。北京计划经济时代遗留的房产数量庞大，光央产房就多达
    90 多万套。未来几年，北京每年要盖 300 万平方米经适房、300 万平方米限价房，还有 50 万平方米廉租房。廉租房这一块我坚决赞同，但是经济适用房和限价房却有些不伦不类。首先，它只能卖给北京户籍的人，大量更需要住房的新移民却无权享受；其次，为了防止以往经济适用房变豪宅、大量富人和有权人抢走其中大部分强规的情形，作为修正方案，经济适用房被限制在
    60 平方米以下，限价房则在 90 平方米以下。但这个办法，其实是经济适用房的面积限定办法，弄不好有可能重蹈经济时代福利分房的覆辙！以今天的眼光看，当时分的房子基本上都有太小、太差毛病，大部分人不愿居住；以未来的眼光看今天的“60
    平方米”，会不会将是一样的结局呢？


    中国健康的住房供应模式，应该主要遵循市场逻辑：打破土地垄断，形成土地的供应局面（那时，市场价房子可能比今天的经济适用房价格还低）；对城市中的拆迁行为，按市场价格足额补偿；对少数城乡贫民，实行政府兜底的廉租房政策。


    # 不能靠住房乌托邦，“温暖人心”


    中国入世首席谈判代表、现华博鳌亚洲论坛秘书长龙永图说话总能一鸣惊人。2007 年，他在南京分析房价畸高的原因时说，“老百姓没改变观念，每个人都想买房子，这种观念是非常错误的。”2009
    年，同样是在南京，他又说，“2/3 的房子都应该由政府提供，1/3 由开发商去做，这样才能解决房子问题。”


    说实在的，听到这样的话，笔者简直懒得去重复以前说过的话了。谁都知道中国香港、新加坡的住房模式是根本不适合中国内地的。因为前二者都是城市政府，而中国内地却面临着史上规模最大、持续时间最长的城市化运动。有人做过估计，我国现有城乡居民住宅总价值达
    90 万亿元。按此估算，如果 2/3 的住宅都要由政府提供，那么只有两个可能：一是几乎所有的城市政府全都破产；二是城市新移民可能三代人都排不上队住不上房，比
    1998 年前很多人一辈子住不上单位安置房还惨。


    但遗憾的是，面对龙永图这样一个画饼充饥、望梅止渴的方案，有 很 多 人，尤 其 是 相 当多的网络评论都被龙永图先生的“古道热肠”给感动了。有人说，此话中凝聚的民生情怀，在时下逼人的寒气中颇具温暖人心的力量。


    这种情形，颇像被打了麻药甚至注射了毒品的人在那儿飘飘欲仙却不知那毒品是空前害'
