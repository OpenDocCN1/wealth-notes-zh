  md: '朋友打电话给我时的喜悦，我在千里之外都能听得出来。他说，后来的博士就没有机会了。我说机会倒是有，只是比你少一次机会，而少这么一次机会，财富的差距可能就是几十万年。这就像赶班车，前面的一辆过去了，就只能等下一辆。


    我说，这下你终于体会到产权自由的好处了吧！单位的或者其他那些产权不自由的房子，再便宜也不要，最终的一切都归不归宿不归宿。单位那套房子，如果一直住下去，等你退出时，18万元已经“折旧”为零了。


    在这个世界上，有很多很多人，学历背景、收入……都一样，但不出几年，往往财富差距巨大，原因在哪里？很大程度就在于他们头脑中的理财甚至财富观念不一样。


    第一，大多数人没有认识到独立产权对于财富的极端重要意义。眼里只有“廉价”和便宜的概念。殊不知，在市场经济背景下，财富若没有独立产权，则再便宜也是贵的；而一旦拥有独立产权，随时可以资本化，那么，很多东西即使价格看起来相当昂贵，其实也是相当“便宜”的。


    第二，在多数人的观念里，欠债是一件可怕甚至危险的事情。而很多时候，欠债固然可怕，但不欠债可能更糟。为什么？世界上真正的富人很少不是负债经营的，借钱买房，借钱上大学，借钱买车，借钱经营，都是很好的例子。


    在很多情况下，通货膨胀率是高于银行贷款利率的，所以只要负债投资就能赚钱。如果通货膨胀率在10%而贷款利率为6%，举债投资的静态收益就是4%。再加上资产增值，所以年平均收益率就不止4%，此外在城市房屋还有租金可收。


    假如你有良好的还款信用，那么借钱就像贵人的帮助和上帝的恩赐。如果信用太差或理财能力太笨，连按时还款都不能，那借钱当然是可怕的绳索，将你越捆越紧直至不能动弹。


    最后，我们可以一起去看看蔡照明先生的一篇网文《人生的第一次差距从房子开始》（2009-11-22 20:58:10）：


    昨天在哈尔滨帮一个朋友公司看地，几年不见，竟有很多往事可以慨叹。公司，个人，身处急剧发展的地产界，坐过山车，或看别人坐过山车，眩晕正常，眨眼正常，眼红或两眼一抹黑都正常。


    席间，一直很少言语的公司销售部经理小隋随口说了一句话，却让我饭后陷入了思考，直到现在。


    他说，这些年大家慢慢有点悬殊了，就是从买房子开始。


    他说的不是很在意，大家也没有在意，但事后回味，我感觉他有可能说出了一个大命题。


    他说的大家，我理解就是他的同学、同事、朋友圈子。'
