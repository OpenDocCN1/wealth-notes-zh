    Z4 的车，美国是 3 万美元，我们是 60 万元人民币，是美国的 3 倍；LEVI''S 牛仔裤我们是美国的 7 倍。


    很多人只看到房价飙升，看不到其他很多东西事实上比房价飙升得更离谱，实在是一叶障目，不见森林。用这种眼光去试图撼动房价，自然只能是唐吉坷德大战风车。我们应该看到这样一个问题：中国的消费率只有
    30%，但中国却是奢侈品消费的第二大国，而且根据波士顿咨询公司 (BCG) 日前发布的最新报告显示，中国在 5~7 年内将成为全球最大的奢侈品市场。这是为什么？每个人都不妨好好想一想。'
