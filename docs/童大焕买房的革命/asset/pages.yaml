    # 高房价的第五个支撑：中国正处在迅速发展的工业化时期——兼谈中国会不会重蹈日本和香?房地泡沫覆辙


    改革开放以来中国年均 GDP 增长 10%以上，而欧美等许多发达国家充其量百分之二三，很多人据此认为这是中国奇迹，甚至抬高为“全球经济一枝独秀”，更有甚者将其上升为某种“制度优越性”。其实这是缺乏经济学基本常识的体现。


    现代社会经济发展一般可分为前工业化时期、工业化时期和后工业化时期三个历史阶段，不同历史阶段的产品特征和经济增长表现存在极大的不同。前工业化时期，一切生产皆是易耗品，像房屋这样的东西甚至都得每年重修或者推倒重来，如果使用现代经济评价指标期来衡量，每年的
    GDP 是非常高的，但并不等于人们的生活质量和生活水平高。工业化时期, GDP 处在一个很高的水平上，社会生产则全面进入耐用消费品时代（包括铁路，公路、住宅等）。后工业化时期，多数消费品都已经耐用化，GDP
    自然很低。这个道理很容易理解，就像人在不同的成长时期生长的速度不一样，但“品质”却不可以直接比较。


    欧美、日本等世界发达国家已经处于后工业化时期。美国人在自己的任何一处居住的土地上，平均半小时车程可到达一个机场。中国正处于工业化时期，现如今全国只有 140
    个机场，2015 年的目标是达到 250 个，即使目标达到，国人平均也需要一个半小时车程才能到达最近的机场。


    有人说，中国的房价如此疯狂，必然要步日本和香港房价泡沫的后尘。这样说同样没有注意到今天的中国和当时的日本及香港处在不同的工业化历史进程这样一个事实。


    20 世纪 80 年代到 90 年代初，日本—一这个曾经红极一时的经济体开始陷入泡沫经济危机的泥潭，难以自拔，直到现在还处于恢复期。当前，从经济学家到平民百姓，许多中国人都在议论人民币升值、房价大涨、股市飞涨，这一切经济的表象与日本当年何其相似。有一些人提出了善意的担忧，中国是否会重蹈日本的覆辙？'
