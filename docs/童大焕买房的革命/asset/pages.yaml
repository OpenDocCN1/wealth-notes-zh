    1/3，甚至 1/2 是投入社会保障等民生福利事业的，而我国投入社会保障方面的财政资金目前还不到 12%，20 世纪末财政教育投入要达到 GDP 的 4%，可今过了
    10 年还没有达到。另一方面，每年的中央各部委都要突击花钱。2009 年度直到 12 月 15 日，还有两万多亿财政资金没有使用。同时，每年的公款吃喝、公款旅游和用车等三公消费支出就达到
    9 千亿元、上万亿元。因此，单靠政府自我约束的“良知”怕是远远不够的。任何公权力都是必须要受到严格监督和约束的“必要的恶”，尤其要把压缩行政开支和行政成本放在突出位置。


    二是要牢管住央行滥发货币的手。劳动和社会保障部 2004 年一份报告曾披露，1993 年到 2004 年长达 12 年时间，珠三角地区月工资水平只提高了区区
    68 元。若扣除平均每年高达 20%的物价、房价增长因素，实际上是负增长。工资性收入占 GDP 的比重每况愈下，物价、房价的上涨却一日千里。


    同时，农民的宅基地和房屋却不能和城市住宅一样享受到因货币贬值而带来的资产增值的空间，也不能像城市住宅一样因享受授权利而消解通货膨胀给予?来的损失。


    因此，除了工资应该像正规外商独资企业一样享有 10%以上的正常年增长机制以外，应该放开市场，把农民对宅基地和房屋的财产权利完全还给他们，使其拥有正常的财产性收入。


    与此相关的是第三条，政府和开发商低价强征农民土地，强拆市民住宅的恶行必须在宪法和物权法的层面下得到彻底遏止和矫正。


    四是行政性垄断必须打破，少数垄断企业职工只占全国职工总人数的 8%，收入却连年稳占全国职工总收入的 55%以上的不正常局面必须改观。尤其是这些垄断上市企业内外两张皮的问题必须向全国人民解释清楚：为什么像中石油这样的企业，其海外的
    H 股股民有优先分红权利而且一元钱投入平均每年能分得两多元，而内地 A 股股民十多买一股却只能分一毛钱？一些上市公司老总甚至对不分红或少分红振振有词，说什么在
    A 股市场更多股东投资是看着二级市场股价上涨带来的回报。这种谬论等于告诉公众，上市公司除了向股东圈钱之外，只相当于为股东们提供了一个合法的赌博场。


    财富分配的公平正义本身，就需要社会的公平正义来实现，管住公权力和权力经济与民争利，成为其中重中重的课题。至于房价，则不是因为房价太高，更多的是因占大多数普通民众收入太低！3
    月 5 日，住建部部长姜新在谈到房价走势时说：“是稳定的，肯定是稳定的！总理都说了，房价必须保持一个合理的程度，这是必须做到的。”当记者再次向他询问未来房价是否能稳定时，他说：“能稳定，总理都说了，不稳定怎么行，肯定行！不行也得行！”


    但只要城市化和通货膨胀的长期趋势不变，这种政策强行打压的房价稳定只能是短期内、暂时性的稳定。增加保障性住房的供应更是杯水车薪。就拿 2010 年来说，在史上最严'
