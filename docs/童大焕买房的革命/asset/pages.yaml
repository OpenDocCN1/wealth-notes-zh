  md: '艺术品、红木等价格上涨，都有它的长期性和必然性。


    但是，政府绝不能容忍房价不受限制地暴涨，否则就是给社会合理地雷，因此，对房价的宏观调控是一种常态。但每一次调控都不要指望会使价格回到几年前，它只能使价格在一个又一个新的、更高的价格区间内震荡。


    # 中国全面进入观念决定贫富时代


    2009 年 5 月，北京大望京村开始从地图上消失。和神州大地遍地开花的“强拆”、“暴拆”、“血拆”大相径庭的是，这个村庄的村民没有一个上访、闹事，拆迁过程中也未发生任何暴力事件。村民们一次性拿到了上百万至数百万的补偿款，一般的家庭除了几套安置房，至少还有上百万元现金，而多的达七八百万甚至上千万。拆迁让大望京全村跑步进入百万元户级别，以致在
    40 多天里村庄就被拆迁完毕。这件事得到了领导和相关部门的积极评价，甚至有人称之为“大望京模式”。


    但其实“大望京模式”并没有多少特殊之处，其根本着眼点就是政府的征地和拆迁出价较充分地考虑了市场因素，给出了一个相对合理的市场价格。而在北京通州新城的建设拆迁中，同样因为给出了市场化补偿而出现半数居民首日签约、万余拆迁户排队
    100 多个小时等候签订拆迁补偿协议的场景。


    但是，北京、上海等大城市有它的特殊性，就是源源不断的“外来人口红利”可以支撑较高的土地和房屋增值溢价，加之这些大都市在连年的土地财政中已经积累了较强的财政实力，有足够的财力支持较高的拆迁和征地补偿。而这种补偿价，甚至可以超出百姓的预期，使很多人“一夜暴富”，轻松过上名车豪宅的富裕生活。


    在中国的城市化过程中，所有的城市都逃脱不了一个共同的规律，那就是城市越大，对外吸引力越大，土地和房屋增值的空间也越大。这就跟物理学中的万有引力定律一样：自身的质量（重量）越大，对外的吸引力也就越大。


    如果小城镇也学大城市大肆征地和搞土地储备，一定会两败俱伤，因为没有足够的外来人口支付高额地价增值的溢价成本，不像大城市一样始终有潮水一般的外来人口支撑这个成本，为城市化买单。比如，内蒙古鄂尔多斯和清水河县花费几十亿元巨款，打造出的却是无人居住的“鬼城”、“烂尾城”。


    当代中国，过去几十年的贫富差距主要缘于以下几方面原因：国民收入过度向政府倾斜；行政垄断企业 8%的职工长期拿着占全国比例 55%～60%的工；市场化程度不足，行政管制过多导致权力寻租；社会保障过度向党政机关和国有企业单位员工倾斜；对农副产品价格管制过严；农民土地和宅基地产权不明，资本化程度不足，等等。诚如中国经济体制改革基金会国民经济研究所副所长王小鲁所言：“现在面临的收入流失，既不是资本回报，也不是劳动回报、人力资本回报，而是权力的回报。是制度漏洞造成的结果，它对社会的危害，要远远大于正常市场条件下收入分配差距带来的危害。”


    2010 年 5 月 24 日《人民日报》曾刊登一篇文章：《户籍出身和行业垄断拉大收入差距》，文章用极再生动。写道：'
