  md: '十八年来中国房地产市场乃至中国经济的改天换地。时至今日，房地产市场和汽车市场已经不折不扣地成为中国消费乃至中国经济的两大引擎，而前者尤其成为火车头。


    城市住房的金融按揭制度，实际上是把中国人民从计划经济时代每个家庭只能将收入在一个月内做计划的桎梏中解放出来（计划经济时代，福利主义上政府全包，但个人收入基本上只能勉强维持一个月），让每个人、每个家庭都可以从容地安排一生的收入与消费计划！


    显然，这样的金融权利应该属于全中国人民，为每一个中国人所共享。闭上眼睛都可以想象未来，如果占全国总人口 70% 的 9 亿多农民盖房也能拥有按揭权利，那么，中国的农村将会带来多大的变化，中国的就业机会又将带来多大的提升，中国的中产阶层又会怎样地突飞猛进？而这其中，只需要一个小小的支点，就是与
    1998 年的城市住房私有化一样，让农民住房也全面完成私有化转变，从集体所有的牢笼中解放出来！在这个支点上，加上按揭制度这一金融杠杆，中国“撬动地球”的奇迹就必将发生。


    在支持农村住房按揭这个问题上，我们国家的经济实力或曰经济基础已经完全具备。2009 年年末我国银行业总资产已达 78.8 万亿元（占全国金融总资产的 90%），我们的外汇储备已经达到
    2 万亿美元。正愁着这些钱没有出路呢！与我们不断地借钱给富人和富国，不如借钱给我们自己的“穷人”，帮助他们改善生活改善对未来的预期。这是中国经济和社会结构转型的重要一步棋也是关键一步棋。中国经济将因此走上内需启动和非投资和外贸启动的稳健之路，中国的社会也将因此走上更加稳定的和平发展之路。有恒产者有恒心，有稳定预期者更有恒心。不是吗？


    历史性的机会再一次借着现代金融制度创新的机会给了中国，与其政府亲力亲为搞这个那个杯水车薪式的补贴（补贴过程中还难免出现偷工减料以次充好），不如建立制度性的自由经济和自由金融平台，既可靠又稳定，形成政府、银行、消费者全面多赢的局面。这一切，只需要我们有勇气捅破那层窗户纸。谁能捅破它，谁的手就是点石成金的圣手！


    中国主流经济学界历来有这样一种观点：中国改革开放以来的经济增长是一个奇迹，用西方经济学？理解难以解释。但耶鲁大学金融数学教授陈志武先生却认为，中国经济快速增长没有秘密可言，逃不出两个基本主线：一是市场经济主线使老百姓有了更大的自由选择；二是
    1990 年开始尤其是 1998 年以来的资本化主线，将“死”的财富、土地、资源和不能动的未来收入，通过各种资本化手段调动起来，加大资源配置效率，降低资源配置成本，由此增加创业资本、创造就业机会、强化财富再创造能力。


    1990 年至今的改革重心是“资本化”，核心在于政府和居民的融资机制的变革，财富迅速增长的本质是将土地、资源、优势企业与劳动力的未来收入折现，如住房按揭贷款、证券市场、信用卡消费贷款等。高度金融化带来了巨额的资本供给，人均资本的提升又促进经济的发展，使得未来收入增长速度更快。这也是中国经济增长的奥秘。他们同样可以将
    其视为资产负债务的膨胀，资产和负债同时快速增长，只要资产的收益率持续大于负债融资的成本，财富增长的游戏就可以继续下去。


    我个人认为陈志武先生是继杨小凯之后，当今世界上最好的华人经济学家。他的这一观点与诺贝尔经济学奖得主阿马蒂亚·森的看法和《资本的奥秘》作者赫尔南多·德·索托的观点互相印证。阿马蒂亚·森认为，衡量经济成就的标准应该从效率标准转向自由标准。德·'
