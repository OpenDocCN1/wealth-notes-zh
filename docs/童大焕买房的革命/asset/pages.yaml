- pgno: 50
  md: '当然，在城市化过程中，房地产开发没有土地增值溢价几乎是不可能的。但是政府应该有能力去控制“天价地王”的产生，使房价上涨维持在相对合理的水平，而不是过度透支未来。


    # 原因之二是缺乏差异化市场供应


    买房应该就像买衣服，不同消费能力的人能够在同一城市甚至同一街区选择到不同价格的衣服；就像上餐馆，同一街区也有自由选择；就像选择交通工具，可以坐汽车、火车、飞机。市场应该满足不同群体不同档次的消费需求，这是市场健康的基本体现。在房地产市场上，也应该和餐饮、交通服务、服装等市场一样，富人买豪宅，中等收入群体买大公寓，中低收入群体买小公寓，城市低收入群体体租廉府。


    但是中国内地的房地产市场，基本上是一个缺乏差异化供应的市场。有开发商公开宣称“只为富人盖房”，政府的成片拆迁货币补偿政策也没有更多考虑原住居民的回迁问题，至于在城市上无片瓦、下无寸土的农民工，更是没有人考虑他们的购房需求。于是乎，除了少数中高收入的金字塔顶端人群一套两套地不断买房之外，多数群体都大声呐喊买难、房价贵。


    有时候，甚至政府在郊区的限制别墅土地供应模式都有些不得要领。比较理想的居住状态是富人住郊区低密度的房子，穷人住密度高但交通等成本低的城中心。现在基本上是反过来。城市郊区那些好山好水的荒山野岭为什么就不能开发成豪宅让富人去住呢？正好可以促使他们手中的资金回流到社会上，政府也可以拿上他们的税进行更好的公共基础设施建设。那些地方，就是盖好别墅送给穷人，穷人也未必住得起养得起。因此，社会也不必对那些豪华住宅过于敏感甚至喊打喊杀。


    现在各地方政府有一个政策误区，就是有意无意地试图通过房地产政策将穷人赶出城区甚至赶出城市。其实，正如魔鬼教官所说的，穷人区是一个城市的福利。他打了一个比方：在广州深圳，捏一只脚的花费，大约只有北京的三分之一到一半，请个钟点工到家来搞卫生，北京也比广州深圳贵很多，而且很不方便。原因是，广州、深圳对“低素质人口”的限制性门槛很低，使得与劳动力成本密切相关的服务业都很便宜，这样一来，同样的收入，在广州深圳的生活水平要远高于北京。再一个，许就是广州深圳无法像北京那样投入巨大成本把各种小摊贩彻底从马路上赶尽杀绝，所以，这两个城市的市民不必像北京市民那样，半是为了找麻烦的得打出租车横穿半个城市，而是走下楼就可以随意选择各种小吃。正是因为有切身的现实利益体验，所以，在广州深圳，对“城中村”的意见，正好大部分市民和主张拆解的政府意见相反，根本不需要有人在报纸上激动地讲究大道理。


    这个观点，跟我的“城市生态平衡理论”异曲同工。在这个概念里，我认为，除了人与自然的和谐与平衡，城市内部，社会不同阶层之间也需要充分的互补和平衡：城市建设应该充分实现社会各阶层的互相融合和错杂“混居”，以提高城市效率，降低城市运行成本。就像森林中不只有高大的树木，而且还有各种杂草、灌木等一样，人类社会本身也是个小生态系统，在这个系统中，任何人、任何阶层、任何职业和身份的人都无法离开其他人、其他阶层、其他各种各样极其复杂的职业和身份的存在而孤立存在。在范畴不大的同一区域，互相关联的人们混居的合理程度越高，这个区域的运行效率就越高，人们的生活舒适度也越高，反之亦然。假如在一个区域居住的人们高度同质化，带来的将是生活的不便和生活成本'
  merge: -1
  img_proc: true
- pgno: 51
  md: '的上升。


    然而，自 20 世纪 80 年代末以来，全国各地风起云涌的城市化和城市改造运动，几乎没有考虑过 “城市社会生态平衡” 问题，因为其基本特征，都是由政府规划，大面积拆迁，开发商大面积开发。这导致的一个不良后果就是：同一小区的物业和居住人群高度同质化，并由此导致城市效率的低下和生活成本、生活不方便程度升高。打个比方：如果一个高档居住小区周边没有普通居住区或商业区，为他们服务的理发师、保洁、保安等工作人员就得从远处奔波而来，大大增加了交通和时间成本，也必然要因此抬高相应服务的价格；而小区可能因为环保、房租、餐厅工作人员租不起昂贵的小区房等原因，连一个像样的餐厅都开不起来，等等。


    与这种大规模拆迁模式相对应的，便是大量老城区的衰败和大量混乱不堪 “城中村” 的出现。这是城市开发权规划权被地方政府高度垄断的必然。很多城市老街区居住十分拥挤，但是人们普遍不敢自行改造或重建房屋，因为不仅拆迁的权力在地方政府，地方政府甚至
    “一口价” 规定了拆迁补偿标准，公民对自己的财产丧失了完整的支配和讨价还价的权利。其结果，又形成另一个恶性循环：老城区和 “城中村” 的拆迁改造完全依赖政府，因无人愿意有所作为而日渐衰败；而其拆迁补偿的要价，也将随着周边地段的升值而水涨船高。


    北京社科院的一份调查报告曾建议，政府应该转变过去老旧城区撤迁安置的改造思维，允许居民自行建房和改造危旧房，政府只负责筹资改造市政工程。我以为，这个建议，不仅适合大栅栏，也适合全国大部分老旧城区和城市化建设中不断新出现的
    “城中村”。


    从历史和现实的眼光看，老旧城区和 “城中村” 往往都是大量服务人员聚集之地，兼具安居、乐业、商业服务多重功能，具有一般写字楼、商业区和纯住宅区不可比拟的 “城市生态功能”。以较低成本容纳大量商业服务及其人员的老旧城区和
    “城中村”，是城市人文社会意义上的 “肺”。他们可以向周边提供较廉价、方便、齐全的生活服务，为大量服务人员提供较好的创业环境，为大量城市流动人口提供栖息、就业之地，为老居民和城市新移民带来巨大的财富和人生上升空间。


    在这个问题上，政府应该转变观念，要学会容忍所谓的 “不和谐”。城市大和谐中应该包含小小的 “不和谐” 音符，老旧城区和不断涌现的 “城中村” 绝不是城市现代化的包袱，只要其拥有足够的自我发展空间，它不仅能跟上时代的步伐、分享发展的成果，而且还是城市文脉的“续”、基础服务的活的源泉，它有一股十分强大的后拉力，为城市生活提供源源不断的商业支撑。


    中国的城市政府特别是各大城市政府，一直在矢志不移地消灭 “城中村” 而努力，政府的经济适用房也一直规划在城市的远郊，这样一种把穷人大部 “驱逐” 到远郊的做法，可以带来城市中心的表面光鲜，以及房地产商和城市政府巨大的土地收益，但其最终形成的
    “穷人包围富人” 的 “城市圈现象”，不仅人为阻碍了城市不同阶层间的细密沟通与协作，而且将大大提高城市、街区的交通成本、治安成本和生活成本，大大增加穷人上升的难度，其因此受损的社会总福利，将远远大于那点可怜的土地收益。


