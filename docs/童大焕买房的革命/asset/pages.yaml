  md: '财富的时候，中国的资本时代或者说理财消费时代已经不可逆转地迅速到来了！面对这个时代，很多人还停留在“量入为出”的老观念中，很多人甚至还没有回过神来就被时代抛在了身后！


    # 高房价的第四个支撑：被激活的全民住房梦


    我有一个观点，当代中国个人财产性收入甚至个人财富的迅速飞涨，不是从 1978 年改革开放开始，而是从 1998 年城市住宅私有化开始突飞猛进的。1998 年之前，城市居民的住宅理论上是单位和国家包分配，但绝大多数民众的居住条件极差恶劣，甚至很多人几代人都分不到一套像样的房子，市市和城市周边私搭乱建的现象极其普遍。时至今日，像北京崇文门幸福大街（老舍代表作之一《龙须沟》的所在地）这样的地方，尚有大量未拆迁的民房，破旧、狭窄程度比偏僻农村还甚。


    1998 年开始的住房私有化改革全面激活了中国老百姓的住房梦，中国人开始全面回到“安居然后乐业”的千古年梦想中来，不仅城市化过程中的住宅升值（实际上是土地升值）给社会带来极大的财富效应，而且现代化社区的市场化引进也极大地提升了人们的居住品质和对住房质量的追求。


    一旦安居乐业的千年梦想被住房私有化这个古已有之但 7 中国成几前几十年却被人为中断古老历史以及全新的住房按揭制度重新激活，其爆发出的人们渐次更新换代住房需求是极其强烈的！


    如今，一个风行的观点是：中国的房地产乃至中国的投资繁荣是不可持续的。曾通过做空安然（Enron）获得丰厚利润的对冲基金经理 1 詹姆斯· 查诺斯 (Jim
    Chanos) 相信，中国是一个有待戳破的更大泡沫。


    2009 年年底，美国知名杂志《福布斯》评出了七大迫在眼前的金融泡沫，其中中国的房地产市场位居第二，其理由是中国快速增长主要得益于宽松的货币政策，这很大程度上促成了房地产价格
    2 股票价格的虚高。


    不过，《福布斯》也指出，中国的房地产泡沫是可以避免的。


    我们也应该把房地产市场当成投资市场看待。毕竟是有巨大的需求在顽强地支撑着它。无论是城市化的人口集中导致的需求，还是住房升级更新换代的改善性需求，抑或是为了满足新进入人口和新公司租赁需要的投资性需求，本质上都是刚性需求。


    中国的城市化进程规模非常巨大，他们甚至还需要更多的投资，更多的基础设施和房地产建设，即使这些数字在许多人看来是“不可持续的”。


    打开 Google 地图，把 8 国任何一个哪怕是发达东部地区的中小城市浏览一遍，你会发现绝大多数街区都还是汽车开不进去的古老街区，它们古老而又破旧，亟须新的住宅和公共基础设施，以提高当地居民的生活水平，给从周边农村地区稳步流入的迁移人口提供住所。即便是北京、上海这样的大都市，这样破败的街区还大量存在，北京、上海还要面临每年
    60 万人口以上的人口净增长。'
