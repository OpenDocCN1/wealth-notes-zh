    而在这个物价惯性上升过程中，艺术品及翡翠玉石、钻石等奢侈品由于不是生活必需品，不会受到宏观调控限制。但是它会受到进入门槛高等一系列市场的自然限制，尽管如此，其上涨的大势仍然让人有惊?心动魄之感。


