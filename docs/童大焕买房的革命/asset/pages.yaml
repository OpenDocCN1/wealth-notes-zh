  md: '心，但却成了一座无人居住的“鬼城”。康巴什基础设施一应俱全，有办公大厦、行政中心、政府建筑、博物馆、电影院和运动场，中产阶级式的复式公寓和别墅砌成片的小区显得满满当当。政府计划在
