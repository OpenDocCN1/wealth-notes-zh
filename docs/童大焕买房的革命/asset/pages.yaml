  md: '索托也认为，穷国和穷人之所以穷，不是没有财富，而是其大量土地、房屋等财富出于产权模糊，无法成为可以进入市场流通的“资本”，进而严重影响了交易和财富再生。用今天时髦的话说，是有财产而没有“财产性收入”。德?索托领导的秘鲁自由与民主学会将《经济学家》列为世界上两个最重要的“智囊团”之一，其个人被《时代》和《福布斯》杂志称为世界上最具号召力的改革家之一。


    今天的中国，也必须回到“以自由看待发展”的基点上，以尊重财产自由、人身自由和创造自由为发展的根?依托。改革开放30年，中国的成就来自市场经济，归根结底是来自由产权和人员流动制度下人和物的解放。但过去几十年，我们只解放了极小部分的市场和资本，因为占全国土地和房屋2/3以上的农地、农房没有自由产权，不能进入现代金融体系和自由交易体系，一方面导致农业不断碎片化原子化，另一方面导致边远地区农民的土地、房屋财富不断贬值，无法变成进城创业的原始资本。而产权不明确不自由，导致不仅乡以上政府机构可以肆意侵犯农民土地和房屋权益，连“自治”的村组织也可以以集体的名义无偿占用集体财富。比如广州两级法院判定猎德村“钉子户”必须无条件服从以村集体名义做出的赔偿条件；北京草桥村几个村干部就可以背着村民向开发商借款以亿元计，且私自以几百户村民的补偿房屋作抵，导致数百户村民强行扣占开发商已售房屋。


    马克思说，每个人的自由发展是全人类自由发展的前提条件。这里的自由，就必须从人身自由和财产自由开始。今天的中国，财产自由和人身自由甚至比民主更紧迫，这些基础自由比选择领导人的权利、比民主决策的权利更迫切。否则，就像十多年来的乡村民主自治，没有财产自由和人身自由（迁徙自由）奠基，类似空中楼阁，十多年几乎都在原地踏步？


    对于农村形势，很少有人认识到的基本方面是农地、农房的产权化货币化这一趋势所带来的潜在变革力量，可以与20世纪90年代末的住房私有化相媲美，甚至具有更加伟大的摧枯拉朽的变革力量。


    农村金融改革、农地货币化和社会福利如果得以推行，必将在未来5～10年，彻底改变中国农村贫穷落后的局面，使之成为国家经济增长、缩小城市鸿沟的巨大推动力。


    在土地私有化和农房私有化及资本化，城乡自由交易的基础上，政府可以在新的相关房产领域用物业税取代现有的土地出让金模式，确保政府获得更加长期、稳定的税财收入。


    # ## 政府的政策应对


    # ### 政府政策的两难


    时至今日，房地产业已成为现在和未来数年内国民经济不折不扣的支柱产业，而不仅仅是引擎和火车头了，可以说它支撑着国民经济的半壁江山，关系到60个行业。因此，综观历来政府对于房地产市场的宏观调控，从来都是用信贷紧缩或利率、税收等手段逐渐挤去泡沫，保持持续稳定发展势头，而不是大起大落甚至大幅度下跌。这是有缘由的。


    诚如陈志武教授所言，房价会不会往下跌很多呢？很难，一方面地方政府不愿意看到这种局面，因为他们对土地财政的依赖，就像吸鸦片，上瘾了；另一方面中央政府也不愿意，因为这么多银行贷款都压在房地产上，?价下太多就会形成银行系统风险。由于过多的行'
