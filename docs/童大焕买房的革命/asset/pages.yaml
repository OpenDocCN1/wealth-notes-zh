    # 第4章：为什么很多老百姓买不起房


    既然前面说了那么多高房价的合理性甚至必然性，那么就要问一个最严峻的问题，为什么多数普通老百姓买不起房？其中的原因也是多种多样的，有制度方面的原因，也有观念方面的原因。但有一种说法是似是而非的，就是说中国地少人多，土地缺乏。事实不是这样的。一切财富的价值都是因而生因又灭，只有人流济济的地方，土地和房屋才彰显其价值。我们的症结在于真正适合自由聚居、自由创业的地方太稀缺，而不是度问题和金融制度问题。在土地制度问题中，最主要是解决地方政府的土地财政问题。如果不把中央政府和地方政府的权、财力分得更加对称，地方政府的财经过多靠土地出让认的话，高房价问题是很难解决的。


    # 原因之一是土地垄断


    1994 年，为了解决中央财政紧张的问题，我国实行了分税制改革，紧随而来的问题就变成了“事权下压，财权上收”，地方政府的财力捉襟见肘却要承担大部分公共服务职能（尤其是义务教育，因为迄今为止我们在社保、医保、住房等其他方面的政府承担基本是空缺的)。
    1998 年之后的住房有化政府土地出让及其后的土地储备制度，给了地方财政救命稻草。中国的房价?题折射出的是中国的住房制度问题，土地供制度问题和金融制度问题。在土地制度问题中，最主要是解决地方政府的土地财政问题。如果不把中央政府和地方政府的权、财力分得更加对称，地方政府的财经过多靠土地出让认的话，高房价问题是很难解决的。


    而至于根本的，是土地垄断问题。按照中国的《土地管理法》规定，中华人民共和国土地分城市国有和集体所有两种，城市居民只是租用国有土地，没有权利将房屋下面的土地进'
