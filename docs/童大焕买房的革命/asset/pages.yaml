    # 第 1 章：引子 史上最严厉调控进行时


    # 史上最严调控为何出台？


    2010 年 4 月 14 日，国务院常务会议决定提出用差别化的信贷政策调控房价：首套自住房且套型建筑面积在 90 平方米以上的家庭，贷款首付款比例不得低于
    30%——以往是无论大小首套皆 20% 首付；对贷款购买第二套住房的家庭，贷款首付款比例不得低于 50%，贷款利率不得低于基准利率的 1.1 倍；对贷款购买第三套及以上住房的，大幅度提高首付款比例和利息水平。


    4 月 17 日，国办又发布的《国务院办公厅转发住房城乡建设部关于持续做好房地产市场调控工作的通知》（简称“国发 10 条”）指出，商品住房价格过高、上涨过快、供应紧张的地区，商业银行可根据风险状况，暂停发放购买第三套及以上住房贷款；对不能提供
    1 年以上当地纳税证明或社会保险缴纳证明的非本地居民暂停发放购买住房贷款


    4 月 30 日，北京提出落实“国发 10 条”的“京 12 条”，除了严格执行国务院上述文件，“暂停对购买第三套及以上住房，以及不能提供 1 年以上本市纳税证明或社会保险缴纳证明的非本市居民发放贷款”之外，还用了个极其行政化的手段，就是规定自
    2010 年 5 月 1 日起，“暂同一一购房家庭只能在本市新购一套商品住房”。


    **政策的叠加，被业内外称为“史上最严厉房地产调控政策”。**


    “史上最严厉房地产调控政策”的出台，源于 2009 年 5 月至 2010 年 4 月 30 日一年时间内，史无前例的房价飞涨。抛开那些枯燥的数据不谈，以北京东五环外某著名小区二手房为例：2009
    年 8 月 19 日，该小区某业主 A 出售了一套 96 平方米二居室（假定为 B），合单价 10.055 元；该业主 2004 年 3 月购得此房，当时的单价是
    4879 元，5 年半时间涨了一倍。可是到 2010 年 4 月底，该套房产已经涨到一平方米两万一二，短短 8 个多月时间又翻了一倍。


    B 房屋的惊蛰跳跃只是房价疯涨的一个小小缩影，更惊心动魄的例子触手可及。房价飙升期间，一个故事在京城房地产业界和买房者中流传：一位赵姓购房者 3 月初在通州京贸国际城看中了一套
    2 居室，已经准备下定金了，结果小赵感觉每平方米 1.8 万元的价格还是太高，于是借口有点饿了，出门买个煎饼回来再谈，再回来时，售楼小姐说房子刚才已经被人'
