  md: "日后发达了，想住更好的房子，可以，政府原价收回经济适用房。这样，就不会有高收入者为了占据那便宜而委屈自己的生活质量，原价回收政策也断绝了这些人的投机幻想。第三，对于进不了市场也买不起经济适用房的人来说，政府提供廉租房，面积比经济适用房更小，学习中国香港好榜样，30\
    \ 多平方米足矣。只有在调节经济适用房和廉租房问题上，面积才是硬道理。至于房地产市场的问题，政府不用太操心，所谓政府的还给政府，市场的还给市场。界限不清，必使市场和政府两败俱伤。\n\
    \n现在的经济适用房问题多多，大户型，中高收入的人群才买得起；政府机关工作人员等社会中高收入人群近水楼台先得月，真正需要照顾的中低收入人群买不起或者买不到；相当数量的经济适用房并没有实现房主自住，而是大量用来出租谋利。在北京，一个经济适用房房号炒卖到\
    \ 16、17 万元。假设买一套 90 平方米的经济适用房，每平方米 4 000 元，总价也就 36 万元，17 万元一个房号，相当于总价的一半多了。还有的经济适用房只需\
    \ 2 650 元/平方米，还以 90 平方米计，一个房号竟占总房款的 71%！ \n\n只要经济适用房可以出租，可以买卖，可以大户型，上述现象就永远无法避免。因为巨大的差价摆在那儿，各种腐败自然难以避免。但是，如果像我上述说的，严格限制经济适用房的面积，而且只能自住，不能出租和自由买卖，只能由政府原价收回，那么就堵住了一切借经济适用房谋利的企图，而且也使得中高收入人群为了追求更舒适的生活主动放弃经济适用房，进入市场。\n\
    \n但这样一来，另一个问题又来了：既然经济适用房和廉租房都是政府的义务，那么人们为什么要选择经济适用房而?选择廉租房？如果严格按照上述条件约束经济适用房，则有可能意味着购买经济适用房比住政府的廉租房更不“合算”，因为购买经济适用房终究要一大笔资金注入，而且不能买卖、出租和继承，本质上和向政府租房住没有两样，如要比租住廉租房付出多得多的资金成本，而在政府回购时，因为是原价回购，随着货币的贬值，意味着购房人受损失一大笔钱。\n\
    \n这么一算，经济适用房就是一个完全不必要 的存在。如此看，政府只需要做好廉租房的建设就行了。我们可以搞“既往不咎”（其实这也是政府的契约责任，不能出尔反尔），以前的经济适用房，根据原来政策，只要交足足够的土地出让金，想出租的出租，想买卖的买卖。今后政府不再建设经济适用房，可以给租住廉租房的人一定的门槛，在房源问题上，则要求政府的土地出让金中拿出足够的比例用于购买小户型的二手房作为廉租房，也可以在土地出让中作为附加条件，规定开发商必须建设一定比例的廉租房交由政府管理。\n\
    \n# 共有产权房是不是富人的畏途\n\n为解决经济适用房“有限产权”界限不清、退出机制难以操作的问题及其带来的弊端，江苏省淮安市在全国首创共有产权住房保障模式，以出让土地的共有产权房替换划拨土地的经济适用房。\n\
    \n这种 共有产权有两种模式，一种是按个人出资 70%、政府出资 30% 形成 7:3 和共有产权房，相当于按相关政策确定的传统经济适用房；另一种是在 7:3\
    \ 的基础上，个人出资部分再乘以 70%，形成 5:5 的 共有产权房，后者的供应对象主要是抚?户中的特殊困难家庭等。"
