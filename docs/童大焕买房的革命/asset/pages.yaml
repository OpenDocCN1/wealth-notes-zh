  md: '当然,“任志强谬论”中有一个致命伤，就是用城镇平均工资代表了全民收入水平。笔者曾经撰文指正，又引来任志强在其博客上撰文为自己辩护，其辩护却愈显其漏洞。


    首先，职工平均工资的统计方法，历史上和今天在做抽样形式上确切任先生所言没有区别。但是，其“内容”却发生了根本性变化。20 世纪七八十年代，基本上是国企一统天下，绝大部分城镇职工都被统计在内，农民则还在农村就地“日出而作，日落而息”。那时候的国企利润也很低，平均收入也低。但是，国企改革“减员增效”之后，国企蛋糕以不止百倍的速度增长而参与分蛋糕的职工却减少近半。国有及国有控股工业企业职工从1997年年底的7
    800万人减少到2004年年底的4 500万人，减员的幅度大概是42%。在最困难的1998年，2/3以上国有企业亏损？全国国有企业加起来的利润才213.7亿元。而到了2007年，全国国有企业上缴税金1.77万亿元，占全国财政收入的34.5%。与2002年相比，全国国有企业户数虽然减少了4.36万户，但营业收入、实现利润、上缴税金分别年均增长18.7%，36%和20.4%。就在金融危机席卷全球，美国500强企业2008年利润总额仅为989亿美元，创55年以来最糟糕记录的同时，中国内地行政垄断企业却一枝独秀：国资委数据显示，2008年，仅140多家中央企业就实现利润6
    652.9亿元，接近美国500强全年利润总额。其中，更有中国石油、中国移动、中国工商银行三大企业利润过千亿元，成为行?的全球最赚钱公司。


    目前我国劳动工资统计制度的数据，只覆盖约1.1亿的城镇单位就业人员，而1.5亿乡镇企业工作人员、7 000万私营单位雇员、5 000万个体户的工资数据均未被纳入其中。9亿多农民（含2亿多农民工）的收入更是不及城镇居民的1/3。被纳入职工工资统计的，光国企员工一项就比1978年代减少了3
    300多万人，相比于1.1亿的统计基数，何其庞大！


    也就是说，当年国企改革减员增效的目的是达到了，但社会财富的分享机制却被极大扭曲了，越来越少的人在占有和分享越来越大比例的社会财富，而这少部分人，则成为国民收入的“平均工资代表”。


    其次，未纳入工资收入统计中的部分演员、作家、写手、网店店主、经纪人、股民、自由职业者、小商、小贩、小企业主等，的确有任先生所言的高收入者，甚至极高收入者，但总体而言，高收入者只占其群体的极少部分。


    最后，任先生说，农民工在城市的低收入，回到家乡也许就变成了高收入。这也是实情。但他们平均每月千元的“高收入”，也要用来在农村改善住房，更要用来给孩子支付高昂的学费和老人的医疗费。30年来，进城农民工人数已达到2亿多人，其中大部分长期居于城市，它们迫切需要在城市购房安居。但他们几乎被完全排除在了政府保障和房地产市场之外，恰恰是这个时代最需要住房的人。


    当然，我不认为收入问题说清楚了，就能把房价“压”下去。房价也是不可能强压下去的。一个社会有多少货币资产，与之相对应的实物资产就对应出价格。关键是要解决国民财富一次分配中的两极分化和“国富民穷”问题。换言之，根本问题不在于房价太高，而在于大部分国民收入太低以及垄断地价等问题。


