    # 内外交困的中国式通胀将长期困扰我们


    长远看，中国经济和社会环境将长期受到内外夹击的中国式通胀的困扰。


    如果中国不能真正实现向内需型经济和社会增长方式的转变（这里内需，除了包括全面地、大幅度地提高普通劳工阶层的工资收入比重，还包括保护和保障国内民众对水、空气等的“环境需求”），中国社会将会长期被输入型通胀和内生型通胀所困扰，可以说是“内忧外患”。


    输入型通胀的原因在于中国经济高度的外部依赖性和经济增长方式的高能耗特征。原材料和成品都高度依赖外部市场，所谓“两头在外”，成为低工资低福利高污染高破坏的“世界工厂”。代价是：中国必须满世界找油找矿，才能维持“世界工厂”的巨大胃口！美国的GDP
    是中国的3倍多，但法国能源统计公司Enerdata公布的首份2009能源分析报告指出，2009年中国能源消耗量超越美国，排名世界第一，印度超过俄罗斯排名第三。如果我们继续走高能耗、高度依赖外部原材料的发展道路，结果必然是受制于人。“我国在国际贸易体系的定价权，几乎全面崩溃。”商务部新闻发言人魏迹5月16日直言，“中国当前面临的一大问题就是大宗商品的定价权缺失”。中国买什么，什么就涨价。


    全球石油巨头埃克森美孚的一项研究表明，到2030年，全球能源需求将较2005年增长约35%，其中，发展中国家的快速成长将使其2005~2030年间的能源需求增长约65%；而发达国家这段时间的GDP虽然平均增长50%以上，但其能源需求预计将持稳。国际能源署（IEA）预计，从2007~2030年这段时间，全球能源需求将增长40%，发展中的亚洲国家是需求增长的主要因素。其中，中国将占去全球新增一次能源需求的39%，印度则占去大约15%。


    发达国家的能源消耗如何呢？英国能源和气候变化部日前公布，2009年英国能源消耗总量出现下降，石油需求下降4.5%，天然气需求减少7.5%；可再生能源占总发电量的比例增至7.5%；净二氧化碳排放量较2008年水平减少9.75%，至4.81亿吨，较《京都议定书》设定的减排基准1990年水平下降了19%。


    这些数据说明了一个重要事实，欧洲许多国家在维持很高的经济发展水平的同时，能源消耗却不断地下降。在安邦首席研究员陈劝看来，能耗的竞争也就是国家能力的竞争。欧洲国家的经济对能源的消耗降低到一定程度，就拥有了主宰这个世界的权力。中国经济需要进口石油吗？可以卖给你，但石油要涨价，而且是天价！未来石油每年涨价70%~100%不是没有可能。在这种时候，成功实现能源消费转换、掌握新能源利用、经济体系对能耗依赖低的国家，就有了相对的战略优势，有了对世界经济的掌握能力。为此，安邦分析师曾经警告说，如果我们不转变发展方式，不接受生态原则，不接受普世价值观原则，乱用资源只赚小钱，中国未来就将输掉世界！


    而中国内生型通胀则与增长方式的投资依赖形影相随。中国投资驱动型经济增长模式高度依赖于政府投资，而政府投资高度依赖于超额货币发行。当前我国的GDP只是美国的1/3，但基础货币已经超过了美国。因此，无论是中产或准中产阶层天天喊打的房价，还是事中低收入阶层基本温饱的农产品价格，抑或是专属富人阶层游戏的翡翠玉石、钻石名表，'
  merge: -1
