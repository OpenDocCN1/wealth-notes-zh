  md: '者绝大多数也并非真正的城乡低收入阶层，而是中高收入阶层——由于小产权房不能按揭贷款，虽然其单价比商品房低很多，但实际上一次性付款往往?同地区商品房的首付高得多，有能力购买的人，经济实力往往比普通商品房购买者还强。同时由于小产权房交易不被承认，县级以上政府在相关房地产交易上面的税收则全面流失。


    而由各地方政府各行其是的小产权房合法化过程，也孕育着危机。一方面，小产权房合法化与地方政府的土地财政有可能形成较为尖锐的冲突，因此，合法化的口子大小取决于地方政府的短期财的利益，有可能形成事实上的不公平；或者是先建者先得利，而后来跟进者则有可能面临着不被承认甚至建筑物被拆除的风险；其次，这种由地方政府权力主导分别认证的模式，有可能催生大量的权力寻租和腐败现象。或者是权贵资本得利，而他没有权力背景的人永远不被承认。再或者是，这个闸门随时掌握在地方政府手里，随意开关，社会公众无法对此形成明确的行为预期。


    一项好的政策和法律制度，基本要求是普适性、恒定性、公开性，既能公平地实施于一切群体，也具有相当程度的政策稳定性。因此，小产权房的合法化，需要从法律的源头上加以确认和实施；即便允许各地先行探索，国家有关部门也应该密切关注其公平性和持续性，并及时予以纠偏，同时为将来的立法和修法积累经验。


    在具体的路径选择上，笔者以为也不宜采取补收地价款和罚款模式，因为小产权房的建设主要的违法行为，充其量是没有得到国家批准的规划，至于是在自己的宅基地和建设用地上建房，多余部分转让给开发商或以相当于“羊佃”的方式卖给城里人，从法律上说，称不上多么严重的违法行为，法无禁止即可为。所以，它的合法化之路，一是采取补交房地产交易环节的税收的形式，从交易环节确认其合法性；二是通过物业税形式，与城市国有土地一次性拍卖70年使用权的形式区别开来，通过几年一交物业税的形式确认业主持有环节的合法性，并形成政府稳定的税收。小产权房合法化正好可以成为物业税探索的突破口。


    当然，我不认为农村住房和宅基地入市会对中心城市和大城市市的中心城区房价造成很大的冲击。房价最终还是和人口的集中度有关，和集中起来的人口的财富创造能力有关。


    # 农地入市如何确保农民利益？


    2009年11月底，社会上传出消息说，国土资源部正打算推“农地入市”打压房价，其正在酝酿2010年新的土地调控政策，之前试点的农村集体建设用地入市将继续推广。这种模式的核心，就是将来自宅基地置换后腾空出来的土地，用做工业用地和商业用地；原有农村土地流转后，吸引社会资本投资现代农业，大大提高土地经营效益。但很快，国土部出来辟谣，意思是说，没有说通过农地入市打压房价，农地流转与进入房地产市场是两个概念，进入房地产市场还是受到严格限制。


    但传来的总是要来，只是时间早晚的问题，一切的传闻都不会是空穴来风。因此，我们不妨提前思考一些如何保护农民的土地和房屋利益诸如此类的问题。


    坊间多关心农民住宅和农村集体建设用地入市是否够真正起到打压房价的作用，但我同时关注的是，它到底能否真正实现农民土地和住宅权利从产权意义上的回归。众所周知，'
