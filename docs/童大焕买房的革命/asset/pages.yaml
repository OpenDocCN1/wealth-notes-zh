  md: '挺税者的如意盘打得很好，在住房保有环节征税，不管叫个人住宅消贵税，还是叫物业费，保有税，都只对二套（含）以上的房屋开征，自住的首套房不在其列。但哪个权威部门答应过自住的那套房不在内？你在农村有套房，离开农村后到城市买一套算不算第二套？你卖旧换新算不算第二套？据我所知现在的二套三套房贷政策，只要你经手过的房子就算一套，哪怕你现在只拥有一套房！


    诚如一位经济学家所言，我国的房地产税费不轻也不合理。62种，30%~40%的比例，轻吗？不合理，是因为在税费交易环节而在不在持有环节。


    但不管是在持有环节还是在交易环节征税，有一点是共同的，就是税费成本最终都要转嫁给使用房屋的人。现在一些人特别一些年轻人吃不过高房价，就情绪激动要求开征新税，重税以打压拥有二套以上住房的人，但过不了多久他会发现这是自己给自己下套，不仅购房成本上升，租房成本也上升。这一做法值得商榷。


    再者，就算通过类似于限制房贷、加价等办法让房价跌了，买不起的还照样买不起。北京、上海动辄三万元一平米的房子，降价20%后是两万四，下降30%也是两万二，你就买得起么？而此时房价下降，正好给富人们以新的利润空间。李承鹏这话说得对：不要以为房价低对穷人有利，其实对富人更有利，他们会再次上演低价进高价出的把戏，养猪屠猪等待下一次奇迹。


    如果加上土地费用，当前房地产的绝大部分收益其实都已经以税或费的形式成为了地方政府收入。如果开发商不想捞一票就走的话，你会发现，如果它在50亩土地上盖楼，几年后连本带利也许在同样地段买不回20亩的地！利润到哪儿去了？还不都以税费形式进地方政府腰包了！但这么高的税费，调节居民的收入分配了吗？或者用于居民的保障性住房了吗？你分明看见保障性住房大部分都内部分配给了政府公职人员。


    从更宏的观角度，我国内地居民的税费总负担，已稳居世界最高行列，但“调节收入分配”仍然是镜花水月，因为城乡居民们享受到的只是世界最末流的社会保障水平，而我国的行政管理成本却是名列世界前茅。取之于民，用之于官，也叫调节收入分配？


    税收的宪政本质是什么？是公民和政府的契约！公民让出自己的部分利益换取国家提供的人身和财产安全、社会保障、法律公正等公共性服务，它一定要经过严格受公众权利制约的法定程序，方可实施。任何鼓吹税收为短期经济和行政目标服务，让税收成为经济和行政工具与奴仆的行为，最终必然成为这个国家和国民的绳索，越绑越紧，害人害己。


    # 附：扔向任志强的那双鞋子


    2010年5月7日下午，在大连房协主办的住宅与房地产高峰论坛上，一青年事先准备好两只落满灰尘的旧鞋，扔向正在发言的任志强，并大叫了一声“去死吧！"然后大摇大摆地离去。任志强调侃自己“看来我的待遇能比得上总统了”。


    事后证明，扔鞋者既不是听众也不是“房奴”，而是一位二十八岁、刚毕业没几年的学生，身穿蓝色阿迪达斯服，背黑色布包，头戴一顶帽子。'
