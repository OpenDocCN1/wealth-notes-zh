    社科院城调队说，全国闲置房共有 6 540 万套间，在建房有 1 250 万套间，如果以每套间 3 人居住来算，闲置房和在建房相加共有 7 790 万套，可供
    2.6 亿人口居住。我国城镇人口为 5.5 亿，假设这个 7 790 万套的 50%投向市场，就可供 1.3 亿人口使用。7 790 万套间是社科院从全国各地供电公司调查的数据。标准是，每户每月电表零读数，且
    6 个月以上。


    笔者对该数据表示怀疑，网络上追寻其信息来源，但无论百度还是谷歌，搜到的信息源几乎无一例外地来自牛刀本人；?者搜寻中国社科院网站，也找不到所谓“城调队”的踪影。3
    月 15 日是消费者打假日，下午 3 时 45 分，笔者打电话到中国社会科学学院总机 85195999，接线小姐很自然的地否定社科院有城调队这个机构。我说网络上有人说有，她说那你去问他！


    笔者的怀疑还来自本人长期以来对中国城市化的关注。平均每座城市将近十万套房屋（可供 30 万人居住）的空置，是一个极其庞大的可怕数字。中国的绝大多数城市还是小城镇，超过
