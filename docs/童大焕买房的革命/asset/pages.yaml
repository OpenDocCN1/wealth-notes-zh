    # 第3章：是什么力量在支撑节节高升的房价


    过去几年，中国房地产市场有一道奇异的风景：在房价节节高升的同时，一直有一个“国外声音”始终在向高房价宣战。这些意见领袖一度被视为百姓利益的代言人，获得了极大的个人声誉。但迄今为止，向高房价宣战基本上只能给普罗大众一点心理安慰，真正信奉房价必须降而且一定会降的人，等来的往往只是一波又一波的阶段式上升。而向房价宣战者的个人蜕变，则更有了耐人？和寻味的价值。'
