    0.4 的警戒线，并逐年上升，目前已超过 0.48。之所以出现这种状况，资本所得在初次分配中所占份额过大是一个不可忽视的因素。据了解，在发达国家，工资一般会占企业运营成本
    50%左右，而在中国则不到 10%。发达国家劳动报飮在国民收入中所占的比重一般在 55%以上，在中国则不到 42%，并呈逐年下降趋势；资本回报的比重却节节上扬。


    因此，除非货币大量回收，否则很难指望房价下跌。但大幅度回收货币对社会经济和百姓生活的危害可能更大。简单地说，大幅度回收货币的确有可能导致房价大幅度下跌，但结果是银行大量采坏账，业主断供，导致金融危机，并进而影响到经济全局，导致社会上失业人口大量增加，不要说房子那些遥远的事了，许多人就是眼前的生计都成问题！


    说到底不是房价太高，而是老百姓收入太低，国民分配结构严重失衡。所以我们不能指望房价大降，更应该指望百姓收入大涨。


    说句不怕成为众矢之的的话：幸亏房价、红木家具以及艺术品、珠宝等奢侈品以高价格吸收了大量的货币流动性，否则，只恰今天水、电、粮油等普通消费品很多老百姓都已经消费不起了。


