  md: '1998 年以后，城市居民的房屋私有产权受到了相对严格的保护，其财产性收入也因此得到大幅度提升并且因为城市化进程得以不断巩固和增长。但是，农民住宅和土地的产权化进程仍然没有突破，在“被集体”的过程中，农民的财产权和财产性收入都得不到很好的保障和实现。


    农村集体土地与城市国有土地“同地、同价、同权”，是否能够成为改变这一不平等、不合理状态的契机呢？笔者对此不太乐观。要在农地入市过程中确实保护农民利益，让其名正言顺分享土地城市化带来的巨大收益，必在以下几个方面有所突破：


    一是农民个人对住宅、宅基地拥有更完整的支配权，这个权利包括对城乡居民平等开放的自由买卖权利，也包括向银行抵押贷款，按揭等权利。如果没有这项权利，农民的宅基地和住房只能以集体的名义“打包”卖给地方政府和开发商，那么将形成彻底的由地方政府和开发商共同主导的买方市场，农民的住宅和宅基地价值被低估，几乎是一个铁板钉钉的事实。


    二是应该恢复农民和地方政府、开发商对这一谈判的权利，而不是在“被集体”的情况下由村组织代表农民行使权利。因为众所周知，现在的村一级组织名为农民自治组织，但事实上行政成分远高于自治组织成分。在这种情况下，村组织成员或迫于上级压力或出于个人私利，低价出卖村集体土地的概率大大增加，并且该行为很难以腐败论处。


    在这种情况下，即使按现时法律必须以村集体的形式共同出让土地，也宜重新组建有别于村委会的村级、组级经济组织，以更为民主的方式进行集体决策。这样的集体经济组织应该突破村一级的行政区划，实现更自由的经济组合。


    如果农民还是处在“被集体”的状态下，即使允许农民的住房和宅基地与城市国有土地“同地、同价、同权”入市，也很难保证农民的利益得到圆满实现。就像当下许多小产权房的开发，开发商和地方政府甚至村一级组织赚得盆满钵满，但农民个人却未必得利一样。


    三是应该允许村民、村集体经济组织以多种方式自发成立房地产开发公司，包括以整理出来的土地入股、以土地向银行抵押贷款等形式筹集房地产开发资金。


    四是地方政府必须完全退出农地征用市场。对于非公益性的用地，政府必须全身而退，不应介入，否则，农地入市有可能形成新一轮的政府圈地潮。政府以低价征地，然后纳入政府土地储备中心，以蛇吞象的气势大○圈地，然后又以挤牙膏的办法向市场供应土地。如此这般，那么房地产土地垄断供应的局面没有改变，高地价决定高房价的模式也不会改变，农民的利益也得不到保证。这方面，笔者并不表示乐观。对此，各地方政府准备大口号地的的气势值得警惕。比如北京市政府正在考虑由北京市土地储备中心全面垄断土地的一级开发。


    五是必须严厉控制和打击开发商的圈地行为。如果不严厉打击开发商的圈地行为，在买方市场下，土地增值收益仍然有可能被开发商所垄断，甚至不排除地方政府借开发商之手垄断土地。只要地方政府和开发商的利益有高度的重合性，二者互相“勾兑”的可能性就非常大，政府对开发商圈地行为的打击也会呈现鞭子高高举起、轻轻落下的局面。


