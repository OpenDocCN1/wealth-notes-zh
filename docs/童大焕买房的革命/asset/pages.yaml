    GDP，我们得到了利润。”《瞭望新闻周刊》2009 年 4 月 20 日）同时，大量“垄断国企”早已成了境上市企业。据悉，从 1993 年到现在，我们的垄断企业累积的未上缴利润达几万亿元。巨额垄断利润大部分拱手让给了真真假假的“海外投资者”。宁戴友邦，不李家奴。中石油在美国上市融资不过
