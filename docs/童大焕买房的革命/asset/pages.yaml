  md: '这一回，一切应该尘埃落定了吧？事实不然。上海开征的消息已经反反复复多次，都是只闻楼梯响，不见人下楼。国务院的意见也是本来就在做的工作，并没有明确出台实施的时间。如果对民用住宅征物业税或房产税，目前条件并不具备。如果强行开征，会造成许多新的不公平。


    第一个问题是要不要剔除土地价值？根据我国现行的房产税暂行条例，房产税以房屋为征税对象，按房屋余值或租金收入为计税依据。


    但在确定税基时，以目前的市场化定价原则对房屋价值进行评估，必然包含土地的价值。而土地升值才是房价上涨的主要原因。在我国城市土地国有制度下，物业持有者掌握的仅仅是土地使用权，法定“住宅70年产权”所需要缴纳的“类似约费用”已包含在土地出让金之内。如果征税时没有剔除“土地”的价值，物业税或按评估值而不是按租金征收的房产税则有重复征税的嫌疑。


    如果剔除土地的价值，那么房屋的初始价值就只有最高不超过2000元每平方米的房屋建造成本加上税费和房地产商利润，这部分价值是每年都有折损的。显然，这不是物业税或房产税的初衷。


    第二个问题是如何有效甄别征税对象。现在房地产问题的主要矛盾不是人们没有住房或没有房住，而是在城市或大城市没有属于自己产权的住房。不少人在小城镇或农村有房然后在大城市买房，那是征大城市房产的税呢还是征农村或小城镇的？有的人在不同的城市各有一套房，那么又是哪座城市对他征税？稍有差池，就会造成巨大的社会不公。


    第三个问题是如何评估。根据《中国证券报》查阅上海住房保障和房屋管理局网站发现，目前上海注册房产估价师有1351名。根据中房信提供的数据，截至2009年，上海存量房面积为4.98亿平方米。评估一套住宅大约需要3个工作日，按每套100平方米计算，上海1351名估价师大约需要28年才能完成，还不包括期间新增房屋面积。除此之外，全国房产交易信息并未联网，因此，在全国范围内同时起步，公平是个大问题。


    妥办的办法可能是只对增量房屋征收，且以每户家庭名下一定房产面积为“起征点”，如传闻中的上海对超出200平方米部分才征收；建议征收税率为0.6%。但这样不可能逼迫手中持有物业的人在短期内大幅抛盘，起不到平衡房价的作用。


    而如果不管不顾公平评估且征收太狠，则会导致租金上涨消除房产税威力。一方面是业主大量抛盘引发出租房源减少，另一方面则是买涨不买跌心理导致一些人持币待购转买房为租房。这样又使房产税和租金之间达成新的市场平衡。


    开征房产税绝不可能立竿见影地打压高房价。韩国政府也曾企图通过房产税控制房价。2006年，韩国房价飞涨，政府推出一系列控制房屋需求的政策，对多套持有家庭，提高其交易税，税率由原来买卖差价的3%~36%提高到一律为50%；对价值在9亿韩元以上的公寓征收房屋拥有税、财产税、综合地产权。但是韩国的房价却在每次新政策略出台时观望一段时间，然后又继续上行。'
