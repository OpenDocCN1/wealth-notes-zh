  md: '我现在理解他的意思是，大学毕业那会，大家都是打工，或政府，或企业，或外资，或民企，每个月或3000，4000，2000，没有1000的；开始高的，后面也被追平了，开始低的，也早挪地方了，所以这么多年平均起来，收入没有太大的差别，但买或者没买房子成了一个很大的差别。


    可以这样来假设一下：


    像隋经理这样，当时每月4000元，4年前哈尔滨市房子均价3000元，夫妻俩足可以供一套120平方米的房子，如果买了一套房子，现在身价100万元没问题，一方面这套房子的房价至少涨到了7000元，接近100万元；另一方面，他一定还会买另一套房子——注意，这是最重要的——据我们调查了解，4年前买房的，大概有76%会买第二套房。因为有了愉快的投资体验，尝到了甜头，所以会跟着体验继续走，这是中国投资者目前最典型的特征。所以很多人是选择转手卖了先前的，再买更有升值潜力的，这是更大胆了，会更买了。不管怎么折腾，当年手里的一点钱都会10倍地增值；而没买房子的，现在更买不起，存了10多万元在手里，还处于无房产的境地。所以两者口比较差别就大了，身价（家）至少差10倍。


    更大的差别呢？


    有了房子、赚了钱的，在朋友面前，有炫耀的资本了；在家人面前，有地位了，心理状态、家庭关系，都和没房子的那一家截然不同。所以夫妻关系、两代人关系，都好了，说不定在单位和领导的关系也好了。这样一来，相差的就不是一个10倍了。有了房子要孩子也早，下一代也领先了几年。


