    # 收入悬殊为因，房价太高是果


    房产问题成为 2010 年全国人大、政协两会的焦点问题。在政协的各项提案之中，关于房地产市场的提案几乎占据半壁江山，其中对保障性住房、物业税征收以及房地产信贷调控成为关注焦点。


    但比这更受关注的是收入悬殊问题。


    2月3日，中共中央总书记、国家主席胡锦涛在谈到转变经济发展方式时，把“加快调整国民收入分配结构”放在了第一位加以强调。新华网的网上调查显示，“收入分配”登上“两会最关心话题”之榜首。


    国务院总理温家宝 3 月 5 日在十一届国人大三次会议上作政府工作报告时指出，要改革收入分配制度。3 月 3 日下午，全国政协主席贾庆林在工作报告中提到：政协会高度重视收入差距过大引发的影响社会稳定的因素，就调整国民收入分配格局、推进基本公共服务均等化等问题提出对策建议，努力促进社会公平正义?此前，温家宝总理在线与网友交流时表示：“当一个社会的财富集中在少数人手里，那么注定它是不公平的，这个社会也是不稳定的。”如果说把做大社会财富这个“蛋糕”看成是政府的责任，那么，分好社会财富这个“蛋糕”，就是政府的良知。


    自 1990 年代以来，“收入分配结构调整”的提法屡现官方文件中，2007 年中共十七大还对此进行全面阐述。可见这并不是一个新鲜命题，但它如此密集地在中央领导和两会上被提及，说明收入悬殊已经成为当下社会的主要矛盾，直面社会分配不公已经成为执政党的共识，收入分配改革应该成为关键时期的关键改革。


    如果说改革开放前 30 年，我们主要集中精力在做大财富蛋糕的话，那么未来的 30 年，我们应该集中精力在财富公平正义上面。日益尖锐的房地产价格飙升矛盾，表面上是房价过高，事实上是由货币流动性的充足和收入的不均衡引起的。要打压房价也容易，收紧信贷关口就可以导致地产商的资金链危机进而引发降价出货。但货币充足和收入悬殊这个根本原因不解决，房价调控就只会给投资和投机者带来抄底的机会，信贷阀门一开，房价又会报复性反弹。


    温家宝总理在政府工作报告中谈到了调整国民收入分配格局的具体政策措施，包括逐步提高居民收入在国民收入分配中的比重，提高劳动报酬在初次分配中的比重。创造条件让更多群众拥有财产性收入；深化垄断行业收入分配制度改革；坚决打击取缔非法收入，规范灰色收入，逐步形成公开透明、公正合理的收入分配秩序，坚决扭转收入差距扩大的趋势。


    这其中，最要紧的恐怕还是如何管住公权力，缚住公权力和权势集团与民争利的手。长缨在谁手，何时缚苍龙？管住公权力与民争利，才能实现财富分配正义，否则就会如崔永元'
