  md: '赵刚在一家国有金融控股集团任部门经理，税后年薪80多万元，加上房补、车补、书费、健身费、休假补贴、补充养老保险及各种临时性的“福利”，实际年收入在百万元以上。


    赵刚的高中好友小灿在中部一个地级市的加工企业上班，企业效益好，他年工资总额4万多元，在当地属高收入。“收入的1/3还房贷，1/3供孩子上学、老人看病。国家说扩大消费，可靠这点工资收入，不顶事儿！”他说生活压力很大。


    赵刚的小学同学王培仍在老家务农，天暖种地、养鱼，天冷去铁路打零工，一年到头累的要命，纯收入只有2万多元，还不敌赵刚工作一星期。


    三个人收入悬殊的现状，正是目前我国居民收入差距不断扩大的真实写照。


    但是，这一切才刚刚开始。在经历了几十年的城乡差别、行业差别等之后，城市化背景下的中国开始进入更为迅猛的地域差别时代，一些城市在迅速崛起，一些城市和乡村在相继衰退。谁能够先行走一步，在迅速崛起的宜居城市站稳脚跟购房置业，谁的财富就将迅速升值；反之亦然。由此，中国迅速进入观念决胜财富的时代。因为在城市化的进程中，人们要的不只是房子，而是在大城市中的房子，于是人们发了财就会带着钱进城，人口带着不断贬值的货币一齐扑向城市，从农村到城市，从小城市到大城市，就像百川归入大海，源源不断的财富被城市的固定资产——房地产所吸收，于是大城市房价大涨！于是新的两极分化开始了。


    比如说，如果两家在5年前的经济状况相似，都能按揭贷款买房子，一家人买了，一家人没有买，5年后房子升值一倍，结果是出现了两极分化：一家人可以卖掉房子再按揭贷款买两栋房子，另一家人却在“蜗居”甚至是“寄居”在租来的房子里。这公平吗？不公平！合理吗？合理！在这合理而不公平的现实面前，还在“？居”的这一家人应该抱怨另一家人剥削了他们吗？不，一房变两房的那家人，其财富增值并不是来自于剥削，而是来自城市化带来的人口和货币的加入，这个加入过程，新进来的外来人口是自愿自觉地认同游戏规则，因为这个城市会带给他们更多的机会。而另一家仍然蜗居的人，只能怪自己的观念落后或者是害怕风险。


    国金证券首席经济学家金岩石先生说：在城市化的进程中，人们之所以不约而同地选择了“小富进城，大富进京”，冥冥之中是在追逐城市经济中的新财富。农业社会人们依赖土地，所以富人追求良田千顷；工业社会人们依赖劳动，所以人们崇尚天勤酬勤；现代社会是都市文明，发达国家的标准之一就是城市人口比例接近或超过2/3，而城市恰恰是土地和劳动相对较少的地方。这就告诉我们，过去在理论上被假设所排除的流动性溢价，已经逐渐上升为现代社会的主流财富，所以伴随着财富的增长，收入的两极分化日趋严重。接受了这个事实，我们还能通过分配制度来化解由此产生的收入差距吗？答案是：不能。


    我的实践经验和思考结论是：在中外历史上都史无前例的城市化进程中，观念决定财富，智慧决定财富。准确判断社会发展趋势，并且顺势而为，勇于承担风险，则想不富都难。相反，畏首畏尾，囫目寸光，则只有被时代“淘汰”的命运。


