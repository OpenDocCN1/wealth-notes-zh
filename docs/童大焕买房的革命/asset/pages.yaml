  md: '正是由于经济适用房在实际操作过程中存在如此的“扭曲”，2005 年以后，对经济适用房质疑的声音不断高涨。在舆论压力下，各地政府随之采取了更为严格的限制户型面积等策略，客观上降低了购买人的房贷压力。同时许多地方也规定了经适房不得用于出租、5
    年内不得出售，5 年后再上市溢价 70%归政府等更为严格的规定。


    这样一来，倒是有利于堵住部分高收入人群浑水摸鱼从经济适用房中取利，却又对真正有“格、有能力购买经济适用房的中低收入人群造成了新的不公——从眼前看，经济适用房照顾了社会中低收入阶层，但是从长远看，70%溢价归政府却可能变成是对穷人的长远剥夺！


    假设在同样地段购买同等面积的住房，经济适用房的单价是普通商品房的一半，则若干年后，房价只要上涨 21%以上，购买经济适用房就开始比购买普通商品房亏，涨幅越大，亏损也越大。如果按购房时总价相同（即假设购房人购买经济适用房时的经济能力已达极限，不可能再多出一分钱去购商品房），那么，若以购经济适用房同等的钱去购买同地段商品房，只能买到经济适用房的一半面积，则当房价上涨
    75%以上，购买经济适用房就不再合算，70%的溢价归政府，就等于政府向中低收入阶层多要了“回报”。这自然又是穷人生子子孙孙无穷尽地向政府隐性“进贡”的“负福利”。


    当然，上述假设基于一个前提：就是房价长远着是涨的。这个假设至少在未二三十年内没有问题。首先，即使按货币长远贬值和工资刚性增长的人类发展趋势看，年均 10%的房价增长，从购房之日起满
    5 年后平均房价将增长 61%，6 年后就是 77%，7 年后是 95%，8 年后是 114%。这是没有考虑城市化因素的“自然增长”。如果考虑中国史无前例的高密度、大规模、高速度城市化、大城市化因素，房价增长的速度可能还要更快一些。事实上，从
    2000 年至 2007 年的过去 7 年间，多数城市的房价都不止翻倍，有的甚至翻了两番，计算下来年均上涨 20%还多。


    既然大右都是对于穷人的负福利，不如干脆取消。用只能自住、不能发补贴、不能转租的廉租房方式取而代之。我坚决反对辽宁沈阳市的做法，他们打算每户按 5.5 万元的标准发放购房补贴，让享受经济适用房保障的家庭直接到市场上购买商品。无论发购房补贴，还是发租房补贴，最难避免的都是腐败问题。君不见，某些地方的局长夫人，擦着胭脂香粉，却同时领着
    3 份低保呢！


    # 经济适用房应该退出历史舞台


    多年来饱受争议的经济适用房因为受到茅于轼“炮轰”而再度成为人们关注的焦点。茅于轼先生认为，廉租房可以解决人权中的住房权，而经济适用房这条路是错误的。因为经济适用房是照顾中低收入人购买的，但实际上低收入人买不起房，因此所谓经济适用房照顾了中高收入人，而且是收入比较高的人。“经济适用房就是政府拿大家缴的税去帮助中高收入人置业！这个没有道理。”


    我曾在一篇文章中提出，有三种办法绝对可以使房价适当下降，至少不持续上扬。第一，政府征地中，留出一定比例的土地供村民实施地产开发。第二，把经济适用房都限定在
    80 平方米以下，甚至 70、60 平方米，而且只能自住，不能出租和买卖，一经发现出租或出售，即行没收。或者强制原价收回且在没收不当收益后适当罚款。如果住经济适用房的人'
