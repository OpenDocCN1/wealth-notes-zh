  md: '这里有一点点缀矛盾但非常致命的地方，就是房价的上涨并不带来“中产”或潜在中产的资产贬值。如果他持有房产等资产的话，他的财富是升值的；如果他没有房产的话，他的货币是贬值的。而在今天，当“蜗居”和“蚁族”成一个具有明显时代特征的关键词的时候，一些温情可能正在掩盖我们更深入的思考。而当某机构发布新闻说全国85%以上的大学毕业生买不起房的时候，曹德行先生却告诉我们，中国香港100%的年轻人买不起房。


    但没有人会否认，香港社会是个中产阶层高度稳定社会也高度稳定的中产社会。


    不知大家有没有想过一个问题，在1998年房改之前，中国人包括所有的城市居民几乎是人人都没有财富的，住房私有化使中国城市居民开始了1840年以来少有的政治稳定下的财富旅程。大嘴房地产商任志强说房价上涨幅度赶不上工资增长幅度，虽有偏颇，没有考虑到工资统计只统计部分中高收入阶层这一严重缺陷和贫富差距的现实，但也说出了部分的真实。如果我们今天真的通过什么手段把房价严厉地打压下去并且让它永远地一蹶不振，那么毫无疑问，它将迅速把中国和中国人重新彻头彻尾地打?原形，回到一无所有的赤贫状态。这将会比任何手段都更加迅速、更加完全彻底地消灭中国辛辛苦苦培养起来的中产阶层！


    换句话说，很多人买不起房只不过是机会不平等导致贫富差距的结果，而不是高房价本身导致贫富差距！8%的行政性行业垄断阶层长年拿着全国职工总收入55%的工资，待遇优厚的职位多数为权力阶层所垄断，这才是问题的根本。


    另一方面，中国的中产阶层不稳定或者说成长极其缓慢，还有一个极其重要的原因，就是占中国总人口70%以上的农民阶层，从制度层面上基本上还属于“无产阶级”，因为他们的土?和房屋从制度安排和理论上说都还属于集体所有，在“被集体”的过程中，其财产不仅不能资本化而增值保值，而且还随时有可能被基层官僚所代表而被极其廉价地租售出去。只要中国农村的土地和住房制度学习一下1998年以来的中国城市住房制度，中国农村一夜之间可以产生无数的十万元户、百万元户，中国的中产阶层队伍会迅速“人工兴旺”起来，从而使中国的财富结构很快由极少数暴富者居金字塔顶、绝大多数贫寒者居金字塔底层的金字塔结构，逐渐向中产成主流的橄榄形结构转变。


    简言之，中国培养中产阶层的努力，不能一叶障目、不见森林地把目光盯在房价问题上，而应该着眼于从制度上解决机会公平和产权安排上“全面消灭农民无产者”的努力上！否则，把目光着眼于打压房价，将会南辕北辙，效果适得其反。'
