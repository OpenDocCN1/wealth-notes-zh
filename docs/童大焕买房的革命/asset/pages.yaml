- pgno: 12
  md: '房价涨跌幅多少？何时抄底为妙？历来是众说纷纭，莫衷一是，甚至大相径庭。这个问题也历来是公众最关心的头题。没有任何人能够对此准确预见，否则此人必富可敌国。不过在众声喧哗中，仍然可以有比较清晰的脉络和轨迹可寻。我们不妨先看看大家怎么说：


    A. 指望房价暴跌来解决住房问题是违背经济运行规律的。因为房价暴跌大多发生在宏观经济发生衰退的情况下。房价暴跌不仅救不了中低收入者，反而还会把中国的房地产市场打垮。房价上涨是中国经济发展特定阶段的运行规律，我们必须尊重。——银河证券研究所所长滕泰


    政府可能比开发商更担心房价下跌后的影响，现行严厉打压的政策必然是临时性的。无论从中央政府层面，还是地方政府层面，都不可能置宏观经济的承受力和客观市场规律于不顾，不尊重市场规律必然会遭遇市场的报复。地方政府也不可能立即改变自己依赖“土地财政”的现状，很多地方府最近已经在主动找开发商提供低价地。


    开发商持有资金充裕，也有很多投资渠道可选择。新政在打压需求的同时，也影响到了开发商继续拿地、推出新项目的积极性，市场的存货本来就不足，一旦出现断档，政策退出后，未来还是会出现房价的大幅反弹。我过去说过，北京三环内的房价会过
    5 万，现在我不仅没有改变自己的观点，还认为应该将这一范围扩大到四环内，看看四环内还有什么地可供应？房价长期上涨的趋势是基本的市场规律，不会因为临时的政策而改变。——华远地产董事长任志强


    点评：把这两个类似观点放在一起点评好了。这两个观点的共同点一是唱多，二是都没有“时间窗口”。长期看涨不等于短期不跌，房价不能暴跌是对的，但暴涨一样危害巨大。


    B. 中国也会面对泡沫和泡沫破裂，不管经济发展有多么迅速。中国的房地产市场就是在赌博，而且赌得很大。有一群人在大面积地豪赌，财富的增长应该是逐步积累的。——“股神”巴菲特


    点评：房地产调控是为了防止泡沫破裂，但它的副作用也明显，可能在酝酿下一个泡沫。这是调控的两难，谁也没有办法。


    C. 这次，政府铁了心让住房价格回落，不达调控目的决不罢休。我预计在这轮政府密集出台政策的调控下，住房价格下跌的幅度会在 15%~20%，住房的价格会回到
    2009 年年末的水平。——SOHO 中国董事长潘石屹


    房价或在年内下调 30%。——中原地产三级市场部副总经理宫萍


    房价下跌 30%或是目标。——思源经纪董事长陶红兵


    银行对 30%左右的房价下调幅度是有风险承受能力的。——北京房协副秘书长陈志


    摩根大通董事总经理兼?国证券和大宗商品主席李晶在 2010 年 5 月中旬表示：中国的城市化进程和大规模的高铁建设中长期仍将利好房地产市场，未来政府如果不再出台针对房地产的调控措施，6
    个月后房价将止跌，投资者将迎来抄底的机会。'
