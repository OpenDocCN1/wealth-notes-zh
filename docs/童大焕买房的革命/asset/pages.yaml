- pgno: 46
  md: '行自由出售；农村居民更没有权利向城市居民自由买卖房屋和土地。所有用于房地产开发的土地，必须经过政府“一级开发”后才能上市交易。其中一个必不可少的环节是政府的征地和拆迁过程，这个过程名义上是开发商在进行，实际上是政府在进行。


    在此过程中，被拆迁户、被征地者与拆迁、征地者之间没有什么平等可言，没有平等便没有“皇帝”与“磨坊主”们的利益协调，还是不给、征还是不正，都是“皇帝”们说了算，给多少“补偿”，也是“皇帝”们说了算，不容置疑，不容商量。而且，被拆迁、被征地户没有权利和开发商直接谈判，因为中间横亘着一个政府，法律规定它“必须”在中间插一手，就是由它插一手，将农村土地或城市房?国有化后，开发商们才能使用（法律规定非农业地只能从“国有土地”中购买）。在此过程中，政府获得了几十至几百倍的土地差价，而农民获得的实际征地补偿基本上不到地价的
    5%，城市居民获得的拆迁补偿不到地价的 40%。这就导致被征地和被拆迁户被迫丧失购买力。


    2009 年 12 月 19 日《新京报》有一则报道说，“拆迁评估一般为市价的 40%”。一般情况下，土地开发招标确定开发公司之后，中标开发公司就成了拆迁人，对所开发地块进行拆迁，取得立项、规划、用地许可、安置补偿证明等一系列文件后，开发公司申请拆迁许可证。


    在拆迁前，政府部门会委托评估机构对所拆迁土地进行评估，根据《拆迁条例》等文件确定的市场价原则，要按照周边商品房售价对被拆迁人进行补偿。


    “但是从?情情况来看，评估价往往远远低于市场价，一般仅为 40%”，长期进行拆迁案法律援助的北京盛廷律师事务所律师张杰同志说。由于评估机构经过改事后与政府脱离，多为私人公司，其收费是按照拆迁面积来收的，为了获得后续业务，评估机构会选择听命于拆迁人，在拆迁人的要求和暗示下进行评估。


    之后，开发公司通常会将拆迁委托给一家拆迁公司，按平方米计算，劳务费大约为 30~50 元/平方米不等；开发公司经常把拆迁补偿也打包给拆迁公司，这样的话，对于拆迁公司来说，补偿越少自己的利润就越高。


    按规定，拆迁公示应?是贴在被拆迁范围内，至少 15 天。据知情人士透露，实际操作中，许多拆迁公司刚把公示贴好照完相就撕掉；或者去公证处做个拆迁公示，然后马上就撕掉。被拆迁人根本不知道进行了拆迁公示。


    拆迁公示之后，如果被拆迁居民对补偿方案不满，拆迁人应与其进行协商。“但现实是被拆迁人往往人数众多，很难形成成力和统一意见，甚至他们都不知道有这个协商的权利和程序”，而拆迁人也往往不会提前告知他们。


    因此，很多案例中，拆迁公示之后，拆迁人就开始申请行政强拆，由此导致很多纠纷。


    城市居民房屋被拆迁得到的货币补偿相对还是较高的，农村居民被征地得到的补偿就更少了。举一个小小的例子：2003 年，记者从上海南康桥工业区管委会了解到，国家征用农村集体土地的补偿标准，一般地块是
    3500 元/亩（不及一个地级市普通公务员三个月工资），土地条件好的或许可以达到 5000 元/亩。如果有人要在康桥工业区投资办厂（非乡镇企业），按照《土地管理法》第
    43 条规定，需要使用土地，必须申请使用国有土地。那么，国有土'
