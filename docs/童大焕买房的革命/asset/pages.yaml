    A 君从小喜欢房子，高中毕业时差点报考建筑专业。大学毕业后，看房成了他的一大业 余爱好，这个业余爱好日后给他带来了丰厚的回报。


    2002 年，A 君来到北京，他发现北京是个大工地，到处都是热火朝天的房地产建设，价 格则从一千多元到上万元不等，选择的余地比起他曾经工作过的小城，真是如鱼入海，大了
    去了。当年“五一”前后，他到国贤参加了个房展会后，当即决定用他过去工作十年仅有 的 6 万元积蓄付一半的首付，其余跟房地产商量量，给了一定的宽限期，他向亲戚朋友们借。
