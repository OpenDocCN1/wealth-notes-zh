  md: '# 政府的制度应对


    釜底抽薪的办法自然是修改法律，打破土地垄断，让农村集体土地在个人所有化的前提下与城市国有土地实现同地同权，可以自由按揭、抵押、买卖。


    我坚定并且乐观地相信，城市化是城乡融合和中国财富的千年机遇（未来财富的四大引擎：城市化，互联网，土地和农房产权资本化，现代金融体系——高密度城市化数中国；互联网改变国人价值观和方法论，且可开创新的商业模式；土地和农房产权资本化使人人都成百万富翁（含农民）不是梦；美式按揭消费模式必将引领世界潮流和经济繁荣。中国人讲“量入为出”，今天和未来的按揭消费与“量入为出”并不矛盾，差别只是把明天的人也提前预算。它使人奋进，使人更讲信用。


    笔者相信中国城乡二元体制必将在城市化过程中得到彻底变革。城乡二元体制，不仅仅表现在户籍制度对国民的桎梏，更重要地表现在城市和农村不动产的不能相互流通。这种体制上的割裂，不仅形成了城市和农村土地与房产价格的巨大落差，也为地方政府、特权阶层、有背景的开发商掠夺人民土地、攫取暴利提供了土壤。同时，由于城乡住宅体制割裂，导致农民在城市买房要忍受高昂代价，而城市居民想逃离城市购买农村低价格宅而不可得，这在体制上推高了房价。如果城乡住宅可以自由流通，城乡住宅价格的巨大落差将得到很大的“找平”。


    时间的车轮驶进公元 2010 年，继“家电下乡”、“汽车下乡”后，今年中央“一号文件”又明确提出，采取有效措施推动“建材下乡”，鼓励农民依法依权建设自住房屋。而按照工信部的计划，2010
    年还将着手推动“信息下乡”、“宽带下乡”、启·轻纺等消费品的农村市场等一系列措施。


    有业内人士估计，“建材下乡”的需求量将是汽车和摩托车的 3 倍，但多位农村专家对此则持谨慎态度。笔者比较赞同后者的意见。个人认为，中国的确已经进入或者正在进入全民性的住房改善时代，住房需求成为一个全民性的需求。但相比于农民建房所需要的庞大资金来说，“建材下乡”那点财政性补贴是微乎其微的。以我国南中部中等经济发展水平的农村来说，建一幢二层小楼至少需要
    8 万—10 万元，建一个三间平房也要五六万元。所以，如果农民自身没有住房建设需求，靠建材补贴启动这部分消费效果将十分有限。


    笔者曾经多次撰文呼吁，应该还给农民和城市居民平等的金融权利，在农房建设上也让农民平等地享受到与城市居民一样的按揭贷款权利。这将使农村发生翻天覆地的变化，并且使中国的中产阶层队伍迅速成长壮大。


    但现行的农房制度使得农民盖房只能为一己、一生之力，既不能跟自己的未来借钱，也不能跟子孙后代借钱，不仅使农民的绝大多数收入被迫投入住房建设，而且房屋质量和居住条件都无法较大幅度提升，甚至一遇风灾雨灾，就大厦倒塌。农房的被动复建率特别高，从这个意义上看农村的
    GDP 也很高；同时地·政府在遇到自然灾害时的经济补贴责任也特别大。


    中国城市的住房按揭制度给整个中国带来的变化有目共睹，甚至毫不夸张地说，它给中国人民带来了一百余年来都没有的巨大财富效应。其中，住房私有化是产权基础，而金融上的按揭制度创新（或曰引进）则如虎添翼，为产权私有化添上财富、生活质量和中产阶层腾飞的翅膀！人还是那些人，土地还是那片土地，只是制度上不动声色的一个变革，就带来了'
