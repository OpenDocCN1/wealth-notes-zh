    # 高房价的第一个支撑：史无前例的城市化运动


    国金证券首席经济学家金岩石2009年发布“惊人之论”：城市化决定房价上涨，5年内京沪房价会再翻一倍。这无异于给原本过热的楼市火上浇油。


    > 金岩石解释说，我国正处于城市化进程加速阶段，城市的土地和房产由于相对和绝对的稀缺性而成为商品，而美欧国家已经完成城市化进程，土地的开发性溢价和房产的交易性溢价基本消失，住宅回归消费品的本质，消费价格指数中包含了住宅价格。“城市化将带来的是革命性社会变革，在未来20年的城市化中，5亿人的生活方式将发生彻底改变！”为了更好地说明城市化究竟会给我们带来多大影响，金岩石拿互联网的产生做了对比，“互联网给我们生活方式带来的变革大家有目共睹，到目前为止，互联网影响了3.5亿人，而城市化将使5亿人的生活发生变化，变化有多剧烈，可想而知。”金岩石认为，在城市化的进程中，非常有可能会形成北京、上海两大超级都市，这两大超级都市的人口将超过总人口的30%，达到5亿人，未来的大北京将有3亿人，大上海将有2亿人。“在这个基础上，楼价应该涨多少？以今年1月1日的价格为基准，5年内至少翻一倍，北京、上海的房价很可能会突破30万元/平方米。”


    金岩石说的5年内北京、上海房价可能会突破30万元/平方米，指的应该是最高房价，比如如今上海的汤臣一品突破12万元，北京的银泰中心突破10万元。豪宅不会到这个价格，大家不必心慌。


