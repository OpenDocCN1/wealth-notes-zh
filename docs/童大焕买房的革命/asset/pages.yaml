- pgno: 59
  md: '政干预，房地产市场把政府卡在进退两难之中，涨跌都不行，涨了会带来过大的资产泡沫，种下未来的金融危机；跌了会带来近期的银行危机和地方财政危机。


    也正如叶檀博士所言，适当地维持房地产泡沫一可以吸引民间投资，二可以拉动居民消费，三可以维持地方财政，四可以拉动相关行业。规模放贷，房地产价格上涨救了企业，大型国有
    企业、房地产企业、股权投资企业最受益。如果房地产泡沫崩溃，则的不说，银行系统会率先崩溃，而大型企业的赢利真相与地方政府的坏账将很快浮出水面。


    而银行系统的崩溃更不是闹着玩儿的。其后果是更多的人不仅买不起房，而且还要失业。一些愤青嚷让房价下跌30%、50%的口号误导民众，其实是只管一己之“民意领袖”私利而不管社会会不会洪水滔天。依我看，按现在首套房
    20%首付的比例，如果房价整体上下跌 20%，那么银行系统就有可能随时面临扛不住的危险。个别楼盘因为资金组织形式的不同而有可能降价 20%以上甚至更低，那是有可能的，但仅限于个案。但如果房价飙升过快过高，则既是在透支未来的上涨空间也是在为银行的未来积蓄风险，因此这也是政策一再要防范的。在任
    何时侯，我们都不能只凭情绪和热情说话，而该用脑子、用理性、用真正负责任的 精神说话办事。


    在这种两难格周下，中国内地的房地产市场注定是个“政策市”，短期的波动看政策，长期的走向则是向上的。如果把波峰和波谷各自连一条线，这两条线基本是个向上走的平行线，而向上的幅度，正好就是通货膨胀的幅度，甚至略高于通胀的幅度。


    # 政府的归政府，市场的归市场


    中国内地房地产市场的诸多问题，可以归结为该市场的不够市场化（比如土地和农 房），该政府的又不够政府化（限价房，经适房/廉租房）。前者可以说，政府该退出市场的没有退出市场；后者也可以说，是政府该承担责任的没有承担起责任并且又是经适房又是廉租房
    又是所谓的限价房，复杂得很。还有人出什么个人与政府共有产权之类的馊主意。


    其实政府要做的就是两个方面，把土地、农房之类该市场的还给市场，把廉租 房担在身上，至于经适房、限价房、共有产权之类非驴非马的东西，还是不要的好。 国人的智慧和时间精力，最好不要浪费在
    这样的兜圈子上了。


    # 抑制投机性购房怎样才能对症下药


    每当房价进入阶段性低谷的时候，往往是那些久经沙场的投资性和投机性资金抄 了底，然后又慢慢地托起楼市。因为这个时候，很多自住型消费者还在期盼房价进一 步下跌的美梦中没有醒来；每当房价进入高位的时候，往往又是不明就里、追涨不追跌的菜鸟级投资者和投机者成了火上浇油的最后一勺油。


    正因为投机性和投资性购房者中“最后疯狂”中的大手笔和市场萧条中的抢先一步，使得许多人把房价上涨的责任推到投机性和投资性购房者身上，甚至视其二者为房价上涨的罪魁祸首。


    但归根结底，是地价和楼价的刚性上涨吸引了投资性和投机性资金，而不是投资 性和投'
