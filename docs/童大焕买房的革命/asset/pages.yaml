    300 万套，各类棚户区改造住房 280 万套。如果 632 亿元的投入与去年房地产销售土地出让收入比较，会发现它是那么的微不足道。2009 年房地产销售额是
    43 995 亿元，是 632 亿元的 70 倍；房地产商利润破万亿元，632 亿元只占其利润的 6%，比开发商的融资成本还低得多；2009 年全国土地出让收入
    15 910 亿元，是 632 亿元的 25 倍。这种投入不要说抑制房价，就是解决少部分人的住房问题都很难。更何况数以亿计的流动人口根本不在各级政府的保障视野之内。


    对此，消费者一定要保持清醒，凡事不要指望别人。从来就没有什么救世主，也靠神仙皇帝，要创造人类的幸福，全靠我们自己。


    # 鼓动多征税以遏制房价飙升是危险论调


    每当部分城市的房价出现高涨时，就有许多“专家”、意见领袖、人大代表、政协委员和媒体高呼抑制房价上涨的唯一方法是实行物业税。理由是现行的中国制度中房地产在生产、流通环节的税很重（包括土地出让金），但持有环节的税很轻，因此造成一个人购买多套房，而投资让房价暴涨。如果加大了持有环节的税收，则拥有多套房的投资者会减少，房价就会跌下来。生产与流通环节的税收降低、成本降低，购房的初始成本与价格也会降低。


    但事实早已证明，这多半只是有关部门多征税的一个借口，在卖方市场上，无论保有环节还是交易环节增税，都丝毫无助于打压房价，反而会将这些保有和交易过程中增加的税费成本一古脑儿地转嫁到买方头上，实际中抬高房屋价格。


    以近年来反复多次的营业税为例。2006 年 6 月 1 日前，我们实行的是二手房满 2 年即免征营业税的管理办法，但是从 2002 年到 2007 年年初，全国房价都只是持续、稳定地小幅上涨。然而，2006
    年 6 月 1 日以后，二手房营业税免征的年限由 2 年变成了 5 年，二手房交易环节的税收大大增加了，但随之而来的却是 2007 年的房价大涨！交易环节增税不是房价大涨的罪魁祸首，但指望通过增税打压房价无疑是痴人说梦。


    而住房的每一次交易，都要将各种税费打入购房成本，平均每次税费达到 10%以上，意味着每次交易都将使房价上涨 10%以上！


    物业税是同样一个道理。要使物业税达到遏制房价过快上涨的目的，必须满足两个条件：一是每年房价上涨的幅度须小于所缴纳的税收；二是增加的税费成本不会转嫁到买方头上。但在一个卖方市场上，这两个条件都不可能满足。而且，对于物业税这样牵一发而动全身的税收，如果盲目开征，还会给下游的租赁市场带来极大影响，从而有可能全面提高整个社会经济运行的成本，进一步缩小创业空间，减少就业机会。到时，现在大声疾呼通过增税来打压房价的，也许不？像现在一样买不起房，而且连工作机会都丢了！'
