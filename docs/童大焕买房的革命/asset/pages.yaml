  md: '现实，明天的后代子孙就要为今天我们的不负责任付出更大的代价！这绝非危言耸听。


    对于中央政府来说，一方面，要切实承担起自己的责任，从速建立健全覆盖全民的医疗、教育、养老等社会保障体系；另一方面，绝不能听任各地城市政府画地为牢。要综合考虑环境问题，不要以为大部分人口住在农村就没有资源和环境问题，正如我文章第一部分写到的，大量人口滞留农村只会制造更大的资源、环境乃至社会不安问题。


    我有一个基本的观点：改革开放到了今天，已经进入了一部分人剥夺另一部分人被相对剥夺的胶着阶段，随时都有可能引发社会的不安。下一个全民福利共同增进的改革，只有中国的高密度城市化，这是?价最小、效率最高，也最最容易达成妥协的改革，比中国历史上任何一次改革或革命，给未来中国带来的影响都更大、更深远。高密度城市拯救中国，这是历史的必然和对我们这一代人的召唤！我们不能在这问题上再一次处处被动。


    # 四、用城市群战略实现区域与环境协调发展


    2005 年 8 月 17 日，河北省政府与亚洲开发银行在北京正式发布了《河北省经济发展战略研究》。该报告称，根据中国的贫困标准，在国际化大都市北京和天津周围，环绕着河北省的
    32 个贫困县 3 798 个贫困村，贫困人口达到 272.6 万。该报告首先提出了“环京津贫困带”的概念——“环京津地区目前存在大规模的贫困带。”


    河北省这次采取了一种很规范、国际通行的方式，借助亚洲的援助，通过规范的调查研究，由国际与国内机构进行独立研究，然后以战略研究的方式提出问题。这一研究的科学性与中立性，通过其规范运作的方式得到了保证，这也使得研究中提出的问题和建议，不能被视为仅仅是来自地方的一己之见。


    “环京津贫困带”的概念很有冲击力，连国家发改委人士也表示，“环京津贫困带的提法的确很猛！”这一概念将京津冀区域差异问题，以极为浓缩、生动的形象进行了展示。一些参与课题的专家表示，“像河北省这样在距离首都不到
    100 公里的区域内还存在着大面积贫困化地区的现象在世界上也是极为少见的。”报告中列数据对比说，北京地区农民收入人均 7 000 元左右，而环京津贫困带的农民人均收入不到
    2 000 元。课题组专家还表示，“环京津贫困带甚至与西部地区最贫困的‘三西地区’（定西、陇西、西固）处于同一发展水平。有些指标甚至比‘三西’地区还要低！”在离北京
    256 公里处有一个四口之家，“房子是土泥房子，屋顶用柳条瓤住。家具是一个水泥柜、一口锅、几个碗，另外还有几只羊。家中全部资产不足 1 000 元。”


    “环京津贫困带”的提出，一方面把城市区域协调发展的问题用生动的形象摆在了人们面前，引起人们的强烈震撼；另一方面，也把城市发展和生态保护之间的矛盾问题给了世人一个极其直观的印象。“环京津贫困带”报告认为，“环京津贫困带”的形成有历史、现实、自然的因素，也有人因素。为保护首都及其他城市的水源和防止风沙危害，国家和地方政府不断加大对这一地区资源开发和工农业生产上的限制，不断提高水源保护标准，使当地的工业、农业和畜牧业蒙受了巨大损失。因此，对于北京和天津来说，如何给予合作甚至补偿周边地区，将是合乎情理和道义的，并且是区域协调发展所必需的。报告认为，“国家要生态、地方要财政、农民要吃饭”这三方面的关系没有处理好，导致该地区持续贫困。“环京津贫困带的根源不在贫困本身”，而是决策、管理、政策上如何协调一致的问题。'
