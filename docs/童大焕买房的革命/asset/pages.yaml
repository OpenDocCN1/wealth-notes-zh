    # 房价问题是社会结构性问题的综合反映


    在房价走势长期向好的背景下，房价也会常常出现过度投机和过度透支未来的“短期爆炒”和疯狂上涨现象，比如 2007 年下半年和 2009 年 5 月到 2010
    年 1、2 月间的疯狂上涨。社会资金向楼市过度集中，对社会经济造成严重的失衡和压力。


    这时候的政府往往会采取多种措施打压房价，而且只要政府下定决心，特别是牢牢收紧房产关口，一定能在短期内使社会资金逐步退出，从而有效部分房地产商的资金链断裂，进而带动房价回落。但中国的楼市问题是社会经济结构性问题的综合反映，如贫富差异太大：垄断企业过于动物凶猛且?量赢利不向内地股民分红而只向
    H 股民大肆分红；“两头在外”的实体经济苦苦挣扎，掌握不了定价权；民营企业政府管制过多，腐败成本过高，而且税负过重，导致大量资金过度集中于房地产投机而无法进入实体经济；普通百姓投资渠道狭窄，'
