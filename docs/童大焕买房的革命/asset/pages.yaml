  md: '冀大城市圈，通过一定的政策和经济补偿机制，有计划有目的地吸引生态保护圈的居民适时迁出，适当减少生态保护区内的人类活动，直至留在当地的人们仅凭生态保护就能發致富。有人认为，采取人性化的措施疏散京津地区的人口，也是缓解生态环境紧张的一条出路。我认为此路不可行。且不论京津地区人口是否能够让天随人愿得到疏散，中国人口就这么多，疏了此处必然塞了彼处。在人口总量不变的静态环境下，缓解生态环境压力的最有效办法，就是让更多的人进入城市。假设在农村平均一人要五亩地才能生活幸福，在城市也许平均一亩地就能够富裕幸福！这样，相当于每从农村迁出一人，就腾出了四亩生态区。


    “环京津贫困带”提法虽然很猛，但不可怕。关键是城市要有区域合作的大视野和“海纳百川”的大胸怀。


    # 高房价的第二个支撑：通货膨胀


    2009 年，一部电视剧《蜗居》据说引起了全国范围内蜗居在城市 的“房奴”和欲做房奴而不得的“蚁族”们的强烈共鸣。可不是吗？眼看着房价越来越高，但收入却不见长，甚至连工作都越来越难找，心中的焦虑感苦谁人能说？


    但过去几年里的房地产宏观调控几乎无一例外地空挂 了个“百姓代言人”的虚名，却结结实实地误导甚至坑害了他们的崇拜者追随者。2009 年年终，有人搞了个房地产名言名录年终大总结，其中有这么几个。易宪容名人雷语：上海房价将下跌
    50%；中国 13 年 GDP 没有了，13 年白干了；中国刚刚兴旺起来的中产阶层消灭掉了；香港 120 万人投资者平均每人损失 1 千万元。时寒冰名人雷语：中国拥有经济学家头衔的人漫山遍野，比野猪还多；成思危先生的不当言论，公安部应立案调查；2009
    年将是 中国房价崩盘元年，中国房价下降趋势将是长期的。牛刀雷人雷语：上海楼市谎言全球第一；韩正市长比我还幼稚；现时价位买房，一年亏损首期；开发商破产，宏观经济才开始复苏；“小阳春”危机将在六月份集中爆发。谢国忠：上海这个有史以来最大的地产泡沫将在近期破裂……这是最后的疯狂。随着中国的通货膨胀和美联储加息的不断发展，离“最后账期”的日子越来越近了，仅仅是几个月，而不是一年。


    ......


    这么多年来，除了短期波动，国内房价的确是在不 以人的意志为转移地不断走高，所谓需求，所谓悬殊的房价收入比，所谓高昂的空置率，所谓租售比，似乎都无法解释房价为什么像脱疆的野马，不受控制地一路飞奔。人们越是期待它崩溃，它越是坚挺！


    正所谓存在即合理。发生这样一种并不为大众所乐见 的事实，背后一定有它的逻辑和现实支撑。那么，支持高房价的逻辑和事实又是什么 呢？是货币量！这才是判断房价等资产价格的一个大判断，没有这个大判断，或者这个大判断出错，其他所有的小判断，什么房价会不会下跌，租售比、空置率、房价收入比是否合理，等等，都只是盲人摸象，只见一点不见全貌！


    先看一个数据：改革开放以来我国平均每年 GDP 增长 10%，而货币存量平均增长速度为 31.5%，个别年份甚至超过 40%，相当于 30 年来货币贬值速度为每年
    20%以上。乃至于有人说，一部新中国经济发展史，实际上就是一部隐蔽的通货膨胀史。货币量决定资产和奢侈品'
