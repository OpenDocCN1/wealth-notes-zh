    # 政府调控的是与不是、能与不能


    只有充分认识上述一系列宏观经济和社会背景，才可能清醒地看清楼市。如果不清醒地认识这些大背景、大趋势，我们就会一叶障目不见森林，无法准确地判断为什么政府要调控楼市？其调控的深度和广度底线何在？效果如何？局限性又在哪里？


    中国人口聚集有一条不可逾越的自然地理线——胡焕庸线。1935 年，中国人口地理学、人文地理学的扛鼎者胡焕庸提出黑河（瑗琨）一腾冲线，后来被国外称为胡焕庸线。首次揭示了中国人口分布规律。即自黑龙江瑗琨至云南腾冲画一条直线（约为
    45°），线东南半壁 36% 的土地供养了全国 96% 的人口；西北半壁 64% 的土地仅供养 4% 的人口。二者平均人口密度比为 42.6:1。


    胡焕庸线揭示了我国自宋元时期形成的南重北轻的人口分布格局。这条被称为“胡焕庸线”的人口地理分界线，同时还负载、分割着许多神奇的自然与社会的元素。有人说它只是农耕文明不可逾越的界线，但在工业文明的今天，胡焕庸线所揭示的人口分布规律依然没有被打破。


    今天，我认为中国的人口聚集除了不可逾越的自然地理线胡焕庸线之外，还应该加上一条中国人口聚集的人文社会线——百万人口城市线。由于中国特殊的政治权力构架和土地、房屋产权构架，中国社会只有百万
    口以上城市，才能逐渐摆脱权力和关系系织成的天罗地网，减少内耗。人们才能整体上生活得更自由和尊严。因此，百万人口以上的城市人口聚集会加快，这些城市的房价上涨也会加快。与此同时，中国城市发展的马太效应将愈演愈烈。


    这是任何人、任何机构都无法改变的社会历史规律。


    城市化尤其是大城市化、内外合力的中国式通胀、房产的金融投资属性，三足鼎立，牢固的三角结构是导致城市房价尤其是大城市房价不断上升的根本原因。按照中金证券首席经济学家金岩石的说话，则是：在城市化和货币化进程中，我们进入?交易经济时代，它创'
