- pgno: 223
  md: '节庆期间，看似高速公路可以免费，但其实公路公司把 11 天平摊到 354 天中，价格上涨 3%，羊毛还是出在羊身上。


    推广到全年的情况，其实结论还是一样。公路总是有成本的，虽然我们每天免费使用他，但公路其实牵涉到建造，维护，道路救援，还是有成本的。


    这个费用有多大呢，一般人没有概念。一座 600W 人的大中型城市，连市区和郊区，道路养护成本，最终可以占到市政支出的 20%左右。这是一笔天文数字。


    我们现在的情况，是纳税人缴税给政府。然后政府再去养路。其实这样的规矩不好，还不如公路收费。


    为什么呢，因为公平。譬如我是一个宅男，你是一个驴友，我们都赚 6000 元的工资，凭什么我们要交一样的税？


    公路收费，应该做到“谁使用，谁付费”。就象水电煤一样，谁用的交通量多，谁就多付公路费。而不该是打包在一起，让宅男和驴友付一样的税。


    所以正义的做法，应该是所有的高速公路都收费，连同普通公路也收税，人民路淮海路浦东南路世纪大道，统统都收费。而所有的税收打 80%折。


    以前人类没有这么做，是因为技术上不成熟。现在政府既然可以强制每个人拍一块车牌，为什么不可以强制每块车牌上，都装一个 ETC 感应器呢。


    任何一辆车，哪怕在普通公路上开，也应该交费。譬如你在杨高路开，不妨设置费用为 0.08 元/分钟。而上了高架之后，则收 0.20 元/分钟。


    每个人每月要做的事，就是往 ETC 里面充值。一旦钱被扣完，被电子眼查到，就扣钱扣车扣人，按没装车牌处理。


    当然，再提醒别忘了把所得税打 80%折。


    (yevon_ou@yahoo.com， 2012 年 9 月 30 日午)


