    # ### 你的产证，不是你的房子 #1390


    按惯例，每年 5 月是我们这一休休年假的月份。偷了好几天懒，睡到自然醒。


    接下来更新会快点，可能连更好几天。


    今天我们讲一篇很基础，极端重要 “体” 的问题。


    但 “体” 这件事，对你买房赚钱，却是一点帮助都没有的。


    因此放在闲散的编号。


    一） 谁的房子


    我们先从几个小故事开始。


    在 2008 年时，上海电视台的《案件聚焦》播出一个故事。


    说是有一个上海的老阿姨，找了一个梳小分头的男人。


    男人吃软饭，底层流氓。拆白宫照例没什么好事情。


    小分头男人混得熟了，就偷偷把老阿姨的房产证偷出来。'
  merge: -1
  img_proc: true
- pgno: 519
  md: '再伪造了全套的身份证，委托书，于是去到交易中心。把这套房子“婚内更名”转到了自己名下。新的房产证也办出来了。


    过了大约半年，上海老阿姨发现了这件事情。便跑到交易中心去闹。并起诉法院，要求将房子改回自己的名字。


    +   - 请问，这套房子，是老阿姨的。

    - 还是“房产证”户主，小分头男人的。


    答案不言而喻。肯定是老阿姨的。


    上海的法院，也是这样判的。


    这件事告诉我们的是，“房产证”并不是终极依据。“事实”才是终极依据。


    # 二） 日本地券制


    1886年，日本政府经过大量长期的准备，终于推出了“地券”制度。


    所谓地券，是指全日本地区，统一换发中央政府印制，统一格式的“房产证”。


    请问，这是一件小事，还是大事。


    绝大多数的人会说，不就是印个证么。小事。


    错。


    在日本历史上，这是大事。甚至是大如天的大事。几千年未有之大事。


    当时日本报纸的报导是：“一举将全国土地收为国有”！


    这倒是奇怪哉了。此话从何说起。


    中国人民想破脑袋，也想不清楚。


    因为你从小到大，受的所有房地产教育，全部都是错的。


    中国媒体上教育的所有房地产知识，买房要看“五证齐全”，全部都是错误的！'
