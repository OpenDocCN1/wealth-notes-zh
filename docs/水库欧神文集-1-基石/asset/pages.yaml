    吸血观认为，沿海的崛起，是建立在对内陆“**吸血**”基础上的。


    是内陆廉价的矿产，人力，被沿海深度加工之后，再“倾销”回内陆市场。这是一种“帝国主义---殖民地”经济关系。


    门户打开以后，沿海廉价的商品蜂拥而入。淘宝发达之后，全国的轻工业小商品市场，集中到了浙江。


