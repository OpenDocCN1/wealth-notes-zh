  md: '如果你能发现一个长期套利机会。毫无疑外，你会积累大量财富，无可限量。


    # 二）长期套利机会


    几乎所有的教科书，都说“长期套利机会”是不可能存在的。


    但我们生活的是一个神奇的国度，一个神奇的时代。一个千年变革的国度，一个千年未遇的时代。


    在我们这个时代，至少发生了一次“伪”大型套利机会，虽然不是完美的例子，却符合了大多数的特征。


    他比天空还宽广，比大海还辽阔，饕餮盛宴，吃到盆满钵满。


    他至少要满足几个条件：


    +   1) 这个市场要很大


    +   2) 存在严重的扭曲


    +   3) 99%，甚至 99.99% 人口是愚蠢的。他们不知道这种扭曲。


    这其中，第三条才是最难。


    很多人已经猜到了，这就是中国的房地产市场。


    房地产市场很大，这是毋庸置疑的。但很少有人承认，他是被“扭曲”的。


    什么叫“不扭曲”。门口的煎饼果子店就是不扭曲的。你想买就买，想买几个就买几个。今天忘带了钱，让煎饼王大娘赊你几个也是可以的。


    如果煎饼果子的利润太高，明天旁边摊贩就会出现李大娘，赵大娘。煎饼果子充分竞争，消费者可以自由选择。绝不会有人规定王大娘的煎饼只能卖 3 元/个。而且加鸡蛋只能加半个，不许抹沙茶酱。


    而房地产市场不是，从购买土地，土地贷款，定价，发放许可证，户型，面积，配套比例，销售对象，消费信贷，再交易年限，税务惩罚，中介掮人，每一件政府都要管。政府的手从来没插得这么深。


    有干预就有扭曲。有扭曲就有落差。


    落差就是钱。就是“2 元卖出，1 元买进”。


    而有了商机还不够。关键还要看“竞争者”的多少。


    互联网热潮一旦兴起，硅谷一个月之内就多了 3000 家公司。羊再多，也经不起狼多。


    这会极大地降低你的成功几率。


    而这会儿，就牵涉到了关键第三点。中国是一个极特殊的国家。


    其 99%，甚至 99.99% 的国民，仍未脱离“蒙昧”状态。接受的是错误的政治经济学、洗脑教育。


    这个才是核心点，赚钱核心点。


    错过这样的时间段，就再没有这样的机遇。


    内功心法不同，决定成长路线不同。


    当 2005 年政府发动“宏观调控”时，对二手房交易征收 5.5% 的营业税。几乎所持有“正确”经济学，奥地利学派经济学的人，都会倒吸一口冷气。房价这是要大涨啊！经济学如分析。


    可是持有“错误”的经济学之人呢。如果我们翻翻 05 年的舆论媒体，几乎是一片倒的 99.9999% 人口都在唱：“中央出手了，房价要大跌”。


    你说这算什么，蠢货么，白痴么，我们的同胞都是一群猪么。'
