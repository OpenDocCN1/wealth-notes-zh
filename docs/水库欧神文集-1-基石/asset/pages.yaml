    # 经济学中的“搭便车”现象 #F1900


    “公共产品”这个补丁，并不需要。


    一）前言


    前两天“米宅米宅”被封了，水庫兔死狐悲。惶惶不可终日。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '看这架势，“千死地产大号”真没法活了。黑五类


    可是呢，小伙伴们仔细研究了一下“米宅”的这张图。提了一个问题：


    水库去哪儿了？


