    最理想的解，我们只需要一个圣骑士。他擎着高高燃烧的宝剑，巡视在天界。只要看见人间

    哪里有暴力行为，就飞下来砍死丫的。


    只可惜，永不会被击败的守护神，只会存在于 YY 小说中。现实生活中不存在。


