    那你就为沦为北朝鲜。


    # 不要抢劫


    # 不要抢劫

    不要抢劫！


    # 三）政治权力


    美国人说选举权，称之为“First Right”。

    所谓“第一权力”，不是拥有土地的权力，不是拥有股票的权力，而是政治权力。

    因为美国人看得很明白，防不住抢，你有多多的钱也没用。

