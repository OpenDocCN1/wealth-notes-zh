  md: '给你一吨钢，一台数控机场。前面是火星车，刚着陆在火星表面上。


    请根据火星车返回的土壤分析，重力条件，自动设计一辆汽车。数据机床现场打印。打  印完了，队员就可以直接开走冒险。


    对于这样的要求，“数控机床”又傻眼了。它只能打印设定的程序。


    而要根据环境，反馈算出设计方案。这需要极大的智能。


    从 Step 1 到 Step 4，是越来越复杂的场景。“熵”含量增加了。因此需要更高级的文  明才能处理。


    # 四） 数码化


    我们举了这样一系列枯燥乏味的例子，是为了说明：程序员正在数码化我们这个世界。


    把整个世界，由机器不懂的方式，格式化成机器懂得的方式。


    机器的本质，力量庞大，而智慧底层。


    任何事务，只要可以交给机器完成，效率就可以提升千万倍。


    但机器又很蠢，只有“幼儿园小班”的水平。


    哪怕铁钉加绞路变螺丝，靠机器本身也是没法升级的。


    程序员的职责，是给机器增加智慧。


    代码的越积越垒，机器可以完成的功能越来越多。升级到小学一年级水平。


    有了数据机床+数控编程之后，机床就对“铁钉，螺丝，螺帽”无所不能。


    不管什么样的形状，都可以雕刻出来。


    汽车发动缸，也可以量产了。'
