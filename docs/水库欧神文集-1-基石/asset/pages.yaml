  md: '# 新一轮经济周期似已到来 #4040


    yevon_ou 水库论坛


    ![](img/f67be513638d053b62bd7b01d459b241_800_0.png)


    # 新一轮经济周期似已到来 #4040


    冬天到了，春天还会远么。


    +   一）超市


    有一项极为重要的，不可逆的，影响到十亿人民的大型经济指标，正在深刻地发生着变化。


    为了解释这个变化，我们首先要讲引言。


    众所周知，2018 年是“经济寒冬”。随着强力的环保审查，强力的金融收紧，强力的企业监管，各行各业哀鸿遍野。


    许多民营中小企业主纷纷表示，“开了 30 年的工厂，到今天再也坚持不住了”。


    微博上，财上海整天冷嘲热讽，塑料铅桶。'
  merge: -1
  img_proc: true
- pgno: 801
  md: '如果你身边有小微企业，民营工厂主，**2018 年是一个需要给予他们关怀的年份**。许多老板，就倒在了“结构调整”中。y 派的漫长，寒凛冷得让人看不到尽头。


    但是，绝大多数人，并不具备经济学常识。他们不知道“企业关厂，环保合规”，鹰派漫长的经济寒冬，其背后的意义是什么。


    意义什么，**超市里的物价大涨了**。


    物价，是供求关系的体现。供小于求，物价自然大涨。


    塑料铅桶厂，纷纷都倒闭了。*那么剩下的塑料铅桶，自然就开始涨价，老板开始赚钱。*


    需求并不会减少，中国人的消费有增无减。


    好比说，一瓶青霉素浇过，细菌杀死 99.999%。剩下的一点点抗药菌，就可以独享全部的营养。


    ![](img/f67be513638d053b62bd7b01d459b241_801_0.png)


    度假前我逛超市，最大的感受，是超市的价格“涨”了。'
