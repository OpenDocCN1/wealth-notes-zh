    # 兰博基尼工程师得花多少年才能买一辆

    Lamborghini #F650


    原文写于 2014 年 8 月 6 日


    假设有一名工程师，他是如此的全职全能。从挖铁矿，炼钢，造轮胎，造玻璃，发动机引擎，电子仪表，真皮沙发，倒车雷达，什么东西他都可以一个人造出来。


    也就是说，独立一个人。把他关到小山沟里，他就能一年造一辆 Lamborghini 出来。


    请问，现在把他扔在和蟹国。按照企业方式运营，他多少年才能买一辆兰博基尼？


    一）税费


    假设工程师卖掉了一辆 Lamborghini，售价 100W 元出厂价。


    按照中国的法律，他首先要交 17% 的增值税。也就是企业到手，只剩下 85.47 万元。'
  merge: -1
  img_proc: true
- pgno: 549
  md: '接下来，他有二种方式接受利润。以“企业”法人形式，和“个人”方式。如果以企业方式，他要交 25%平均税率。


    上一次和土肥圆大牧师讨论时，他说过一句很有道理。“25%的企业所得税，就相当于 25%的增值税”。


    因为企业的利润，是“生产减去成本”。具体来说，就是企业在环节中的增值。只不过某些企业利润是正的，某些是负的。也就是他们浪费的资源，比创造的还多。


    但总体而言，全社会企业总利润，等同于以“法人”形式入账的增值。企业所得税 25%，和 VAT 再收 25%，其效果是完全等同的。


    如果该天才工程师以“个人”方式入账。那么结果更糟糕。假设企业把工资开得很高。高到企业利润=0，而全部的产值，都成了工人工资。以“个人”方式入账，税负更高。大概达到了
    40%左右，也就是收掉一半。


    个人计算方法很复杂。简单来说，如果你工资较低的话，则“四金”是个大头。一般月薪 10000 元的人，四金占到 46%，公司实际要发你 14600 元。而月薪一万，税后你拿到手的，只有
    8700。8700/14600=60%


    如果你月薪很高，远超过一万元。那么四金会有封顶，这样危害逐渐减小。但随之你的“个人所得税”税率又开始增加。譬如你月薪 8W 的话，适合最高档税率，税后只剩下
    58730。公司再给你交一万多四金，综合到手也是 60%


    综合了以上二种方法以后，考虑到 2013 年全社会总工资，大概是企业总利润的 4 倍。则“三项所得税”的平均税负，加权后 37%


    该天才工程师拿到手的钱，还剩下 54W 元。


    # 二）销售端


    接下来我们来讲销售端。之所以要举 Lamborghini，因为这是最极端的例子。


    汽车出厂价 100W 元，绝对不意味着消费者花掉也是一百万元。汽车是一个最极端的例子。因为他还要加初次购买“车辆购置税”。大排量车还要交“价内'
