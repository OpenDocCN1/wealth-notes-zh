  md: '再深一步想，坑外有坑。千门的套路，从来都是辟谣之后，仍是谣言。


    口说无凭，人证物证。


    你完全可以虚构出一个“贾达空”，说这个人是中间人。


    徐晓东既然要约架雷雷，当中的电话来往肯定是少不了的。来来往往通讯很多次。


