  md: '你不能假设所有人都是君子。这个世界上，一定会有小人。


    对于那些“绝对的自由主义者”，他们构思的社会是小国寡民。最多数千人一个的社团。生产力倒是极大丰盛。


    没有常备兵，只有民兵。


    可是如果你遭遇外敌入侵怎么办。敌人生产力可能没你高，可人家聚集起30000人你怎么办。


    对于谭叔等无政派的回答，他们是：“哈哈，小国寡民这的确是无政派的一个弱点”。


    哈哈你个头啊！严肃点，这是要死人的。


    文明的搏弈，极端残酷。是整个整个民族的灭绝，几千万人头落地。


