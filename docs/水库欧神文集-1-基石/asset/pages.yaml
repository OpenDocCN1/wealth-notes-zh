    哥哥每周驻守“分答社区”。每次看那群屌丝提问题，我就恨不得砸电脑。


    水库科技树写得很清楚，“资金的分层”，资金成本最低的，是信用卡，年率不到 4.5%，其次是亲友内圈借款。


    可是“分答社区”向我提问的，有多少人问信用卡。


