  md: '好似古代骑士穿着铠甲一对厮杀。二军相争勇者胜，比的是勇气，无畏和牺牲。接近1：1的交换比。


    而真实的战争呢。真实的战争，阿拉伯人甚至都没有“开炮”的机会。美国大兵接受参谋本部的指示。过一段时间参谋部或者战术电脑，就会传来一道信息。“仰角xxx度，方向xxx度，初速xxx级”。


    一炮发出，战无不胜。每一次都可以准确地摧毁目标。


    对于阿拉伯人来说，这个“xxx度，xxx角，xxx位置”，简直就像是神谕一样。他们也曾向自己的神灵祈祷，可是他们的神灵没有任何法力。如果闭着眼睛开上一炮的话，其结果只能是落在沙漠里打石子。


    于是阿拉伯人不干了。头巾们纷纷跳了出来，投诉这是“不公平”的行为。


    # 这不公平，你利用了信息不对称！


    # 二）信息不对称


    为什么想写这个话题呢。因为#F740我们写了“裸条”。


    #F740《旗帜鲜明的支持裸条》，其中最重要一个观点，就是dT>0只要是自由自愿的交易，都是合理的。任何交易，对社会都是好处。


    这个时候，有一个蠢货跳了出来。回复原文如下：[2]


    楼主说交易互利dT>0未免太绝对了，是的，我不否认，假设A与B交易，A如果觉得这场交易他拿不到好处，就不会交易，B如果同样觉得他拿不到好处，也不会交易，交易之所以发生，只是因为A和B两人都觉得这场交易对自己有利。这就是楼主想要表达的的东西吧？


    但是，智商捉急的楼主忽略了上面那的基本前提，那就是信息对称和理性人，啥意思？也就是说A和B也都是理性的，不会做像楼主这样一脑袋袋就发事的蠢事，也不会看到阳光就灿烂的耍飞上天和太阳肩并肩。再者，这两个人掌握的信息要是相同的，也就是说A和B对于这场交易的认识要相同，并且必须要信守诺言。有了以上这两个前提，才是我们说的1+1>2的交易，否则未必所有交易都是有利的。


    之所以对这个话题感兴趣，主要是看见了“信息不对称”。


    对这个话题，感觉刻骨铭心。


    早在2003年，刚在上海热线讨论“炒房的正义性”时，就有人提出了“信息的不对称”来驳斥炒楼客。


    他们的意思是：从理论上，商人是降低物价的。


    但实质上，商人是赚了“信息不对称”的钱。好比A地 的货物价格高于B地。商人其实在赚老实人的便宜。所以这种交易是不道德的。


    对于这种质疑，我们一般是先骂一声SB，有妈生没妈养的文盲垃圾。


    然后我们再慢慢告诉你一个道理：信息的本质也是一种商品，信息是要花钱买的。信息从来不是免费的。信息是需要花钱的。


    你丫的是不是买盗版光盘买出快感了。


    回到我们之前“美国大兵”，对于C4ISR系统[3]的全控制，使得美国军队，宛如有神灵庇佑一样。


    给你一段坐标，打出去就百发百中。


