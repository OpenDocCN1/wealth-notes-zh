  md: '譬如说吧，你坐三小时的飞机，入住五星级酒店。出入都有朋友开着破跑车来接送，包一个院子吃饭，四个服务员，餐后大家一起拿出了手机刷抖音。


    你说让我怎么升级，我很满足呀。


    所谓的“消费升级”，指的是让人更快乐，或者消费更多。


    可是你们已经超级无敌快乐了啊。


    你在二三线，白天喝茶，晚上泡汤。每天工作不足4个小时，没有房贷压力。房子超便宜，汽车也买好了，生活得像个土豪。


    那么多人民兴高采烈地吃小龙虾，虾壳堆得象山。你说让我还能怎么升级。


