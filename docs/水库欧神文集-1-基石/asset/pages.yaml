    从大义的名分来讲，“税收”的实质是一种服务。


    无代表权不纳税。


    一群人孤苦无依地行走在文明竞赛的荒野上，生命无比残酷。为了提供互助服务，于是才有了政府。所以才有了纳税。


    从根本上讲，根本就不应该有“税”。


    富兰克林说：“人的一生有两件事不可避免：死亡与纳税”。这句话根本就是错的，是左翼文人的寄生呻吟。


