  md: '# 世界上最好的产权，只有 2~3 个业主足矣。[4]


    你说一幢“祖宅”，其实他有非常大的“产权相关者”。


    你是长房长子。


    爸爸的弟弟，还有七伯健在。


    爷爷的弟弟，还有六叔公，和六叔公的子女。


    曾爷爷的弟弟，还有曾五叔爷，和曾五叔爷的子女


    玄爷爷的弟弟，还有玄四叔祖，和玄四叔祖的后裔………


    这个表列下去，“产权”相关者，可以说是没完没了。


    而你要做的，就是“截断”。


    对的，截断，砍得干干净净。


    > 如张五常所说：权利的界定是有限度的。


    太外面延了耗不起。


    最终，祖宅的产权证上，就你，或者你和七伯两个人的名字。


    “五服”之外，统统不要列上去。


    我知道这里面会有利益损失，知道产权证写一个名字是不精确的。


    可是让二狗子给各位叔叔爷爷摆酒赔礼每人拿一个红包回去。


    拜后产权证还是只能写一两个人的名字。


    即为“产权的砍断”。


    六）产权碎片化


    # 一般而言，战争被视为产权的格式化。


    很多人分析中国和印度的差异。


    中国在 mao 时代大规模地搞了一次。虽然 wg 有害无益，但他有一个副效用“产权的格式化”。


    如果你视印度，印度的产权是高度“碎片化”的。


    同一块土地，可能有五六批人，五六种法律，对该土地宣示着主权。


    而你哪怕拿到土地，你也是“有限产权”。


    就如同叶荣添拍卖到那块限高的土地。他有“附加条款”。不可以做这个，不可以做那个。


    也就是印度“产权碎片化”程度十分恶劣。


    同样的道理，也适合于有着 1000 年历史的英国。甚至今天的美国。


    英国的问题是，他的历史实在太长了。“传承”也实在太长了。


    “产权”就其本身，存在着不断碎片化的倾向。


    每一代产权的传承，肯定是越剖越细的。各种“附加条款”，也肯定是越加越多的。


    我今天把伦敦乡下 House 卖给你，但是留一条留言“外墙颜色不能动”。


    你转手卖给下家，“屋顶十字架也不能动”


    再下家，“水井有历史纪念意义，也不能动”。


    日积月累，条款只能增加不会减少。规矩只会越来越多。


