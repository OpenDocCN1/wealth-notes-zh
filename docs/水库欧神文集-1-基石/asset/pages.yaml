- pgno: 268
  md: '举一个最简单的例子，假设二个城市，其GDP 力量都是$15000 美金/年。


    第一个城市，完全就是“工业园区”的样子。他们的工人，大部分被井挑在车间内，日夜不停地生产着产品。


    他们的物资可以不用象纺织这么低级，可以是汽车变速箱，电视显示器，15nm 芯片，甚至火箭发动机。


    这让他们的产值足够高。据说中国县级 GDP 最高的行政区是克拉玛依，石油城。


    如果你把海上油井也算进去，那单位面积产出就更惊人了。


    这一类的模式，你可以称之为“工业型城市”。


    克拉玛依的房价高不高，不高。


    另外一类城市，则是完全相反的“消费型城市”。


    我们就不说澳门，三亚，拉斯维加斯之类的变异体了。我们举的例子，主要是上海、北京。


    上海的中心，静安区，他几乎没任何工业。


    论商业的话，航运中心在虹口，金融在陆家嘴，而物流主要在外高桥。


    静安区有什么，有的只是一个又一个的 Shopping Mall ，有的是纸醉金迷，狂欢与不夜城。


    # 三）巨型城市如何维持


    2009 年时我见了一个人，是山东来的做精密光学仪器的厂长。


    当时，他对上海人不屑一顾。


    他举的例子是，在上海无论如何你请一个人，阿猫阿狗稍微有点才干。综合成本一年 20W 是少不了的。（当时钱还比较值钱，现在恐怕 40W 才有骨干）


    而 20W 元，你要卖多少光学仪器啊。


    整个市场的销量和容量是有限的，制造业根本提供不了这么多的高新岗位。所以厂长虽然赞扬上海货精度高质量好，却是无论如何不会把工厂靠近上海的。


    厂长说起了上海的前途，也是非常之悲观。因为成本实在太高。上海有约 700W 户籍劳动人口，他实在想不明白哪里可以提供这么多高薪岗位。


    据称一直有研究分析，全世界所有的制造业岗位一共不过 8000W 人口。“产能过剩”一直如同一个魔咒，紧绷在日益紧缩的中国经济体身上。


    我们知道，2009~今天，其实中国经济过得不错。上海人也在原先已“非常贵”的基础上，又发了一笔小财。现在仍是人力资本高速上涨的阶段，一点看不出 HR 用工成本的界限。


    那么问题出在哪儿呢，一个 2500W 人口巨型城市，究竟去哪里提供这么多高薪岗位呢。


    答案是：“出在城市人口的内部”。


    该厂长的错误，是他始终将工厂设想成一个“出口导向型”的单元。往外不断喷吐着商品，运回钞票。这样出口市场终究有限，终有一天会饱和。


    但是，2500W 人口的城市，其实是一个“自娱自乐”的城市。


    也就是说，在这座城内，2500W 人在狂欢，在寻欢作乐。而外部的“出口”为零或很小。


    那么，这 2500W 人狂欢所消耗的物资，从何而来。答：从 2500W 人的劳动而来。


    2500W 的人劳动，怎么发工资。答：发给他们消费和狂欢。[1]


    这就构成了一个自洽的圆。而你可以发现，这个圆是没有上限的。'
