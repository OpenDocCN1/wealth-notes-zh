    人均 GDP 一旦超过 7000 美金（大约每个月￥3500 人民币）


    后面的 GDP 增速，反而象开挂打暴击一样猛。


    假设我们把人类的需求，分为 A 高级情感，B 中级需求，C 基础湿饱。


    当 C 获得满足时，AB 才有市场。


    而 AB 几乎可以无限增长。 “你服务我，我服务你”，不消耗原料。


    “服务业” 产值高企的秘密， 关键要 A=100C


    当一个人“基础湿饱”满足以后，他就会陷入空虚，就会无所事事。


    就会愿意为一些“情感”上的触动，而支付非常高的价格。


    例如说，某些人可能会花费数百万的费用，去买一幅画，一张黑胶唱片。


