- pgno: 372
  md: '如果没有“造纸”。中国会重回春秋，以分封制为主。


    而“印刷木”的发明，使得人类科技文明传播，再大大向前走了一步。


    “羊皮纸”时代，一本书只有一本，仅限于非常重要的宗教和巫术记载。


    “造纸”时代，识字属于贵族。“洛阳纸贵”开启了东晋世代门阀。


    “印刷木”时代，掀起了报纸大众知识革命和民素浪潮。


    一般认为 1949 年之前，中国的“识字率”是 1%


    一直到 80 年代，我们读书那阵。很多小学生还有记忆，学校里有蜡染工坊，有油纸和穿着工作服的印考卷师傅。


    王选凭借其“汉字激光照排技术”，在改革开放初期获得了巨大的声誉。创立方正集团。史玉柱研制汉卡。


    他们的名字，不该被忘记。


    然后就是“五角丛书”，书籍的价格大幅降低。一直降到今天卖白纸的价格。


    收集一套全本柏杨《资治通鉴》72 册，再也不是什么难事。


    甚至在旧书市场地位至高无上的“盗版繁体”，前二天也有人递了我一套《笑傲江湖》。


    我们唠唠叨叨写了八九百个字，想表达什么意思呢；


    > “以上全错”


    # 二）买书


    +   1 任何在我出生时已经有的科技都是稀松平常的世界本来秩序的一部分。


    +   2 任何在我 15-35 岁之间诞生的科技都是将会改变世界的革命性产物。


    +   3 任何在我 35 岁之后诞生的科技都是违反自然规律要遭天谴的。


    ——道格拉斯·亚当斯的科技三定律


    ——道格拉斯·亚当斯 《怀疑的蜉蝣》


    ![](img/f67be513638d053b62bd7b01d459b241_372_0.png)


    ![](img/f67be513638d053b62bd7b01d459b241_372_1.png)'
