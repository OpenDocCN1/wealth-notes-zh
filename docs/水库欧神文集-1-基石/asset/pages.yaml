  md: '算法的优劣，一般有二种评价方法：


    +   时间复杂性，0（n），随着样本 N 的增大，所要消耗的时间成比例增长。


    +   空间复杂性，S（n），随着样本 N 的增大，所需要的计算机内存比增长。


