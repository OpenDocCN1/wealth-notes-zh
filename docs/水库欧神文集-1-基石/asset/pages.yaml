    “老铁，我们公司想贷款 3000W”


    “好的，利率 15%”


    “开什么玩笑，我们公司几十亿的规模，还会赖你账不成”。


    “那你们有什么可抵押的。把总部大厦抵押给银行，利率给你 6%”


    “棒棒哒，要不，我把公司 6 幢大厦都抵押给你，只借 3000W。利率再降半个点，5.50%”。


