    # 经济学#20


    经济学没有流派。世界上只有两种经济学，讲道理的，和不讲道理的。


    ----------yeyon_ou


    一) 坑外有坑


    当我读高中时，好友 Magnus 和我说，经济学是一门奇异的科学。是唯一“正反双方”都可以获诺贝尔奖的学科。


    当时觉得“哇，好高大上啊”。


    经济学是一门实证性科学，即他无法做实验。也不知道一些举措，譬如加息减息，刺激性财政政策，这些行为的真实效应是多少。


    因为他只有一个输出量，就是 GDP。而各项政策的效果，是无法单量的。


    据说尼克松总统曾经想要找一个独臂的国家经济顾问。因为他的经济学家总是和他说“ln one hand……in another hand……”，搞得老尼不胜其烦。最终忍不住翻脸说有没有杨过九难之类的。


    当时很年轻，很不懂事，觉得真有道理。大学生知识分子就是不一样。


    一直到许多年以后，才发现这样的“讲法”是很大问题的。


    1967 年出现了学说“理性人共识”。


    其具体的解释，指二个人，如果都是绅士，完全秉承着善意探讨的精神，没有任何偏见和不可逾越的宗教信仰。纯粹基于科学和逻辑的推论；


    则最终二人是能达成共识的。


    也就是说，科学是有的，真理的道路是唯一的。如果让一正一反，二个经济学诺贝尔奖得主关在同一间小黑屋里面。关上三个月，最终他们是会得出“共识”而出来的。


    二人中必有一个是错的。'
