    也可以选择“老实吃亏”，1 元/斤卖了。选一种营运成本最低的方法。


    这个例子告诉我们的是什么；


    +   信息是一种商品，你可以选购购买，也可以选择。


    +   决策有风险，购买信息有可能赚，也有可能赔钱。


    +   最终选择利益最大化的做法。


    所以，从来不存在“信息不对称”的说法。


