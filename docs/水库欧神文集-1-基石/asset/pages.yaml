    政治学第一定律 #70


    政治就是抢劫


    一) 公平与效率


    在开始这个话题之前，我们先要花点笔墨，聊一个俗得不能再俗的话题。“公平与效率”。


    公平，什么公平，谁的公平。


    水库论坛很久以前，有个id叫做“Likewater”。这位老兄的最大特点，就是爱喊“不公平”。


    公交车地铁要涨价，他大喊“不公平”。


    开刀医疗费用要涨价，他大喊“不公平”。


    房价要涨，他大喊“不公平”。


    柴米油盐糖草纸要涨价，他大喊“不公平”。


    最后，程序员IT的工资要涨价，他大喝一声“公平，这很公平。就该这样”。


    再之后，我们观察了一下 LikeWater 先生，关于公平不公平的选项，大致是以他自己利益为划分的。


    譬如本地户口可以申请廉租房，他大喊不公平。


    但大学生申请廉租房可以加分，低学历不加分，他就觉得很公平。


    顺着这个思路推下去，最终 LikeWater 先生的政治主张是：“大学生，985 大学毕业，男性，理科，年龄在 32~33 岁之间，身高在 172~4325px
    之间，河南驻马店或者湖南郴州出生，有秃顶早期症状，脸右颊旁有三颗大黑痣”者：


    这样的人最应该受到优待，每小时工资 1000000 元！


    其他人统统应该低工资，快递，月嫂，钟点工，饭店，医生，护士，警察，统统应该收 5 元/小时的最低工资。


    这样的“社会制度”，在这位大黑痣老兄看来，才是最“公平”，最合理，最正义的。


