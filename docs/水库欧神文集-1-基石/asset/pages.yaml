  md: '所以“暴力”的每一次行为，都导致国家总财富的减少。

    抢劫越多，国家越穷。抢劫无数多，国家无尽穷。

    如果我们纵观21cn 世界民族之林，我们需要惊讶的，并不是为什么会有 OECD 之类的富国。

    白人们为什么会如此富裕。

    我们真正惊讶的，是世界上的什么人会有穷国！

    因为人类几乎所有的初级科技树，例如化肥，农药，煤炭，水力，电力，这些科技树都是完全公开的。机器都是随便买卖的。

    如果你要借钱，国际利率都快低过 0% 了。

    你真正需要惊讶的，是这世界怎么还会饿死人！

    而饿死人的关键，在于那些国家，无法控制“抢劫”。

    抢劫是市场的大前提。抢劫所到之处，市场荡然无存。生产无法存在。

    也就像是，

    人民会自己产生财富。你只要袖手旁观站在旁边看着。类似于道家的“无为”。市场自然会像下金蛋一样：

    咕啦咕啦把所有的衣食住行，冰箱洗衣机 DVD 小轿车弹黄床电饭煲智能手机都给你生产出来。

    而真正可怕的，是“没有市场”。

    假设有一批强盗，在 Walmart 超市门口守着。

