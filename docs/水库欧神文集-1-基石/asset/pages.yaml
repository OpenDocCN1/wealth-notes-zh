    # 中国模式，才是全世界最先进的模式。


    +   四） ETC


    井F340 是一篇旧文。讲的也是二年前的科技。


    把这个思路再进一步延伸出去：


    > “普通公路”可不可以收费，


    从而使得我们整个社会更公平，更平等。


    譬如说，俺们这些不上班的，应该比上班的人更省钱。


    曾经一度，我以为这事是做不了的。因为普通公路，不具备高速公路一般“二端计费，中间封闭”的特征。


    而且普通公路，每一个红绿灯都很短。最长不过三五百米，如果要计费的话，就是几分钱。


    北京的 PE/VC 圈，从来都出怪人。前几年，我见了一个中年长毛“油腻”男。这家伙正准备砸锅卖铁，把所有的资产房子卖了，投身于“创业”的狂潮中。'
