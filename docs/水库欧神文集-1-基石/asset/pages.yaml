  md: '那怎么办，一种“文艺国家”的做法，是省吃俭用卖掉祖传的几亩薄田，换一支青霉素。而“2B 国家”的做法，则是先给自己找一个乱七八糟的“理论”理由。然后就扑上去抢了。这些都不是正确的做法。正确的做法是什么，是“切断”青霉素的购买，让病人们去死！什么叫“超出自己能力的欲望”。意思就是买不起的就别买，付不起的就别买，哪怕没青霉素，死了活该！买不起滚！


    于是有人破口大骂。


    # 五）破口大骂


    无论从哪一个标准看，1890 年的清国，都要远远强于 1840 年的道光朝。


    人均寿命大大增强，运输和通讯能力大大增强，锻造和冶炼能力大大增强，种植和物种大大增强，财政和税收能力大大增强。


    从任何一个数字看，教科书所谓的“半封建半殖民地”社会，其富裕程度都远远超过中国历史上任何一个“盛世”。


    但是这段历史，却是被人骂得最严重的历史。好比初中生刚接触史书，简直是民不聊生。


    为什么，因为生产力虽然在增加，可是“欲望”增长得更快。


    当你见过外面的花花世界之后，你的心就被撩起来了。至少你知道肺结核可治，你就绝不甘心 36 岁死。


    晚清虽然国力增长得快，可是人心增长得更快。


    “革命党”还是不满意。他们认为我们可以过得更好。


    这就解释了第一个问题，“为什么有人仇视资本主义”。


    仇视资本主义，并不是说“外国货倾销”“半封建半殖民地”剥削了中国。资本主义繁荣全世界。


    而是某些人想要享用洋货。


    他们想要大草坪西餐厅对的欧式上流社会生活；


    可是国民的生产力又有没有达到这一层次。生产力的增长是缓慢的。


    “欲望超出了能力”。


    所以他们只能骂，骂的愿望是希望你洋货便宜点给他们。最好是白抢。


    事实的真相一定要睁眼看。


    # 六）谁抢了我的房子


    +   A. “你可以拥有”和“你实际拥有”是二回事。


    +   B. “超出你能力的欲望”


    我们把 A 和 B 套入三段论，产生化学反应。于是就有了奇怪的对话。


    2003 年，网络上的主流民意，舆论的主流说法，“炒房客抢走了我们的房子”。


    2007 年，CCAV2 做深圳炒房专题报道，国世平公开说：“让他们把带血的筹码吐出来”。


    基本上主流的论调，就是“你抢了我的房子”。


    对于这件事，我倒是奇怪了。


    这套房子是我买的。这扇门是我买的，这个铝合金窗是我装的。实木地板是我铺的。电视墙是我刷的。吊灯是我淘宝的。厨房三件套是我装的。窗帘是我选的。沙发是我购的。连马桶盖子都是我买回来的。'
