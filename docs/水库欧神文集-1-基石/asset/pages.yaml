- pgno: 391
  md: '我再等幼儿园家长会，塞在老师手里。


    老师往往也抽风一拎，过一阵子才想去消费。甚至有着见闻厚厚麻麻一叠几百张卡，不知道用到猴年马月。


    一张“斯玛特卡”的平均生存周期有多长。我没有确切数据。


    但乐观的估算，可认为有 6~12 个月。


    各位，买卡的钱，是第一天才给现金的！


    而商户 12 个月之后，才有消费的指令传回来。才有结算需求。


    这里面账怎么算，至少有 6%的息差。


    这是一笔巨大的利益。


    # 3）余额损耗


    第三个问题，也是绝大多数外人忽略的问题。


    你一张卡用到什么时候用废掉的。


    一张 500 元的卡，你随身带在身上。有机会就用，有场合就用。


    但你很有可能，没有把它的余额用到 0。


    对于绝大多数的人来说，我断言说，如果这张卡的余额低于 2.5 元。


    一元几角几分，你不会再随身带在身上。


    而且你到超市购物，饭店吃饭。一本正经地掏出十张卡，一本笔记簿。


    照着笔记本上的记录：


    “第一张卡刷 1.27 元”


    “第二张卡刷 2.58 元”


    ………


    ………


    “第九张卡刷 0.46 元”


    “第十张卡，哎呦，让我先查查余额多少元”


    如果你这样做的话，营业员会给你怎样的白眼。


    如果你不幸正巧请女生吃饭的话，女生会给你怎样的白眼。


    余额损耗，一定有。平均可假设为 2.5 元。


    或者卡面值的 0.5%。


    # 3）押金损耗


    按照手册说明，斯玛特卡含有 10 元押金。


    不过这个押金，要刷出来，可真的不容易。


    自从俺家旁边的 emart 韩国超市关掉了以后，我就再也找不到任何一家可以接受“斯玛特底卡回收”的商户。


    无论是肯德基，新亚大包，都只能消费，不收底卡。


    如果你要“彻底销卡”拿回 10 元押金的话。


    请你跑一趟田林钦州路办事总部。


    可是，谁又会吃饱了撑的。花一个小时和汽油交通费，去退 10 元钱？


    所以这个“不退押金”的比例还很高的。'
