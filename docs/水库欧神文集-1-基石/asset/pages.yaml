    # 大纲的困扰#40


    椭圆是什么，椭圆就是 X²+Y²=1


    “仔子，这 x, y 是什么东西呀。还有，你画一横一竖二条直线，这是要干嘛呀”


    一）写本书


    我写过很多篇文章。


    第一篇广为转载的，是 2003 年的《我们是怎样陷入贫穷的》。指责挪用外汇储备，勾弄百姓。流传最广的，则是 2004 年的《人民币而临巨大的贬值风险》。转了超过
    1 万个网站，超过 2000 万人次阅读。还被改了很多名字，譬如《大排面 30 元一碗》。


    到了 2013 年时，有好事之人，将我的文章都搜集起来。整理成册。而我太太，则是温柔体贴，偷偷地找了出版社印刷成书。这就是《十年文集》第一稿。


    坦白说，对于这本书，我是极不满意的。


    十年来，水平涨了一个方面。现在再写，肯定比当年老练。更深入，还能纠正一些小瑕疵。


    但最主要的关键，这本《十年文集》，他是散碎零落的。


    这本旧册子，每一篇都有闪光点，每一篇都很精彩。


    3000 字一篇，任何一个单篇，取出来都足以满堂喝彩，眼前一亮。


    但这一共约 300 篇文章聚在一起呢。


    那就是狗屁不如。


    好比我们说“体，用，术”。这一系列的文章，零零碎碎大多属于“术”的范畴。


    这些文章，他会教你房子如何选择，开盘如何砍价，资金如何筹措，利息如何精算，再融资盈亏平衡点在哪里，现金如何管理………


    其中的每一篇，拿出来都堪称经典。'
