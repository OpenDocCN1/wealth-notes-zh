- pgno: 529
  md: '看《半泽直树》只能让人看得窒息。在这样的一个社会中，“体制”的力量太大太强大了。每个人只能想方设法，在体制中找到一个螺丝钉的位置，然后你就一辈子不能移动。


    美国是一个开放的社会，一个人前一分钟是个体家庭主妇，下一分钟就可以去应聘电视主播，再过一阵子可以去当体育经理人。


    在美国，存在一个职业经理人阶层。IBM 的高级经理，明天可以去 Intel 上班，后天可以去 Cisco 上班。


    所以美国经济，永远都充满了创新，21 世纪领导世界的发明基本上都出在美国。每一份资源都可以重新配置，而且人们拼搏充满了希望，充满了士气。


    至于日本，片子中戏剧性的设计了半泽的领导浅野是个贪污犯，所以一扳即倒。


    但他如果 1 不是个贪污犯呢。


    如果他仅仅是老朽昏庸，保守糊涂，“齐心服侍山大王”呢。


    我们设想一下，现实生活中，半泽的老板并不是个贪污犯，他仅仅是个庸官。


    无论什么样的业务，他总是说“有风险，有风险，再想想”。


    无论什么样的创新，他总是说“不妥，太新，有风险”。


    任人唯亲，官僚拖沓，简直就是个生产力的破坏者。但是，但是，他绝对不贪污。


    对于这样的领导，欧美制度很容易辞职了事，可是半泽他们怎么办？


    天天服侍着一个猪一样的领导，而且这样的工作你要做一辈子，一辈子没有别的拐弯，没有别的出路。


    你还别惊讶。


    真的现实生活企业界，绝对的黑，绝对的白都是很少的。更多的是灰色。


    也就是说，猪头领导是占 99% 的。


    他并没有错，任何新业务都有风险的。所以你无法从公司内部制度上扳倒他。但这样一个老朽昏庸的白痴，是多伤害士气的你知道么。


    日本企业无法克服这样的顽疾。


    所以日本企业一塌糊涂。


    日本的体制太强大，太完善，就象 1840 年的中国。


    # 六）日本沉没


    政治信仰的腐败，是最大的腐败。


    体制的腐败，是最大的腐败。


    大清朝并不缺乏勇士，在面对面投掷炸弹的游戏中，僧格林沁的骑兵震惊了英军，无法想象这是人类军队能够承受的牺牲。


    但是总体而言，清朝输掉了这场战争，而且毫无阻滞的沉沦到底。


    日本人不缺努力勤奋工作的半泽们。


    但日本的制度有问题。


    半泽越是努力的工作，越是维护这个体制，越是“神圣，尊重，坚守”这个体制，他们在错误的道路上走得越远。从第一集老头子哭着跪下坚持手工，我就知道这个民族完了，越是坚持越是完蛋。'
