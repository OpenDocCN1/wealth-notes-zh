    # 高速公路免费是极恶之事 #F340


    话说哥哥是极忙之人，打 CIV3 打得昏天暗地，惨烈的巴黎攻防战，我军已经牺牲了 20 支 Rifle，而法军则至少被灭了 60 支 Musket，整个一个穷兵赎武。


    但是，看见 weibo 上一些猪头讨论高速免费的分析；所谓猪一般的队友，看到铅笔社那帮白痴对于高速的分析，真是队友比对手还急。


    你们的分析，都是错的。


    1）效用提高


    首先说回网络上，铅笔社那帮猪头对高速免费的分析是什么。铅笔社的重点，放在了“免费必然导致拥堵”。'
