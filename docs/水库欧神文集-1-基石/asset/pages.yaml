  md: '# 假如一个系统，内存管理总是申请，永不回收。


    # 则总有一天会 Memory Full


    而中国目前的情况呢，是内存刚刚“格式化”过。还很干净。

    你要申请大块成片的内存，OK，可以。

    因此我们高铁铁路线一拉几公里。从来没有沿途的居民过来闹事。

    如果在美国想要兴建这样一条铁路，光沿途的环保，青草，小动物组织就够你喝十年了。


    # 七）内存的回收


    治乱自有秩序。

    当一个王朝刚刚建立时，其内部的产权很“纯净”，干净得就如刚刚开机格式化完内存。

    而一个王朝运行了几百年之后。其内部的条条框框，混乱得就像一部用了 8 个月的 Android 手机。

    这个时候，会发生死机，内存崩溃。

    死机的结果，是战争，秩序崩溃。全社会重新洗牌。千年秩序再也没有人遵守。

    然后你惊讶地发现，重启了。①

    一个王朝，若想要避免崩溃。则一定要增加“内存回收机制”。

    即任何产权，都要有回收，有净化机制。


    “土地七十年”远远比“土地永久制”要好得多的一个制度。

    更理想的制度，应该是在每块土地拍卖之前，加上“2086 地面建筑物回购条款”。

    至于回购条款怎么写，定价怎么定。若想续约的话怎么续。

    这些环节我还没有想好。这也是我迟迟没写这篇的原因。


    # 八）无限产权人


    老年人嘴唠的毛病真是闲话多，我们继续言归话题。

    我们知道，当一个系统有 2~3 名产权人时最佳，有 100 个产权人时，多半已经半死不活了。

    有 10000 个产权人的印第安领，基本处于必死状态。②

    但是比“N 个产权人”更进一步的，是“无限多个产权人”

    “无限多个产权人”，您是指公有制社会，共产主义么？

    No，在列宁主义制度下，产权人其实是有限的。往往就 1 个，金胖胖胖。

    这也使得社会主义国家“决策”十分之快。

    其本身属于制度优越性之一。

    真正的“无限多个产权人”，其实指的是美国。

    圣母婊盎路之地。

    白左的“政治正确”大毒瘤。

    目前白左的“政治正确”，已经到了无孔不入的地步。

    任何一件事情都要管，任何一件事情都能管。

    任何一件事，只要她们看不惯。不管你是开饭店，做科研，还是企业招聘员工。

    她们说对你指手画脚，就能对你指手画脚。'
