  md: '言归正传，高速公路节庆免费“大恶”的后果是什么呢。


    后果主要有二条，一个是高速公路平日收费要涨价。一年只有 365 天，你让我 11 天免费，那剩下的 354 天，就只能涨价。平均涨幅在 3%左右。


    第二个后果，则是高速公路业“投资风险”上升。高速公路是一个低回报的行业，平均总在11%左右。如果你政府随时随地颁新法规，动辄要求我免费打折，那么 11%的回报率就不能弥补“高风险、高收益”。投资回报可能要升到
    13%左右。


    13%意味着什么呢，意味着更少的新建公路，更贵的收费价格，更差的路面质量。


    当车主们堵在沪宁，享受寸步不动的“德政”的同时，明天菜市场的菜价，将上涨 0.10 元。


    “节庆高速公路免费”对整个商业规则都是一场破坏，其后果十分恶劣。结果是更少的人愿意经商，更多的精力花在搞政府关系，中华民族的整体国力都遭到破坏。工商业受到的损失，远远大于车主们省下
    10 元钱。


    3) 高速公路的正义


    再说第三个箭段，也是 weibo 热议话题：高速公路是正义的么，高速公路应该收费么。高速公路逃票，究竟是抢劫还是正当防卫。


    我们的结论很明确，A应该收费，B到期后仍应该收费，C原本不收费的（普通）公路，也应该改为收费。


    我们的观点是最极端的。不仅仅高速公路应该收费，而且哪怕贷款到期了，仍应该继续收费。


    中国占了全世界 80%的收费公路，这恰恰是中国最近 20 年崛起的原因之一。


    为什么，就如我们前文所说，天下没有白吃的午餐。'
