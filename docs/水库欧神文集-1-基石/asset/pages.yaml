  md: '韩国的 GDP，是北朝鲜的 110 倍。但真实国力的差距，绝没有这么离谱。


    GDP 在衡量一国国力时，甚至都没有“工商业总产出”有效。


    香港没有中国 20%的资格，中国的 1%还差不多。


    有些地区的落后，仅仅是因为“统计方法”对他不利。


    只要跨过了“工业革命”这条温饱线，当人类生存不再成为问题。各种吃喝玩乐的价格，就会不断上升。


    换言之，只要你想“刷 GDP”，你可以推高高档“心灵鸡汤”的价格，一直到无限高。


    中国近 40 年的 GDP 可以升得那么快，部分原因，中国本来就是一个大国。伪装成了小白兔。


    因为“计算方法”的不利，把滨州的产出，算得近似为零。因此全中国的 GDP，在 90 年代，还不如一个小小的荷兰。


