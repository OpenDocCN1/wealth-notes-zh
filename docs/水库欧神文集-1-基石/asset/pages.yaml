  md: '# 否则，别怪被歧视，活该。


    # 三）歧视的边界


    # 所有的私营企业，都不应受歧视原则限制。


    企业就是要歧视你。


    +   · 没有大学文凭，我就不招聘你。


    +   · 考不上985，我就不招聘你。


    +   · 笃信中概，就不适合某些岗位。


    +   · 笃信非转基因，就不适合某些岗位。


    +   · 笃信女权主义，就不适合人类岗位。


    歧视本身就是有理的。


    企业通过各种歧视，简化信息筛选，降低信息成本。


    而在“歧视”里面。还大有讲究。


    譬如说二个应聘者，应聘一个科研岗位。


    其他资料都差不多。一个信伊斯兰，一个是坚定的无神论者。


    有二个企业。


    +   · A企业“歧视”无神论者。把真主的信徒高高兴兴都录取了。


    +   · B企业“歧视”绿教徒。把诚信踏实的无神论者都录取了。


    N年之后，请问A企业存活，还是B企业存活。


    答案毫无疑问的，肯定是B存活。


    对于“歧视”好坏，本身没有固定的标准。


    有人说猪肉好，也有人哪怕蛋白质摄入不足依然坚持只吃牛羊肉。


    那么，怎么甄别呢。怎样决定“信主”“无神论”哪个更优胜呢。


    # 答案就是让企业自由竞争。


    B企业招聘的都是唯物主义，科学研究的踏实人员。


    B企业自然可以研发出拳头产品，高科技产品。抢占市场份额。


    而A企业招来的人，只会念经。


    你念经有什么用。每天朝拜五次有用么。地上会长出牛奶喷泉么。


    # 所有的私营企业，均不适用歧视原则。


    # 因为市场本身已经在优胜劣汰。


    西方的“政治正确”，歧视只应适用于政府机关，非盈利企业。


    圣母们把“歧视”应用到市场化竞争的民营企业，于是造成了大灾难。


    市场本身已经对竞争和成败做出了惩罚。不需要“看得见的手”。


