    但是知道这些错误，违背了统治者的利益。

    “经济学”本身占据了大义的名分。统治者如果不想面对这些错误，那么他最好的选择是“阉割经济学”，或者给你一门错误的经济学。

    所以我们这个世界，从来没有真正的“经济学”。有的都是“政治经济学”。也就是统治者塞给你的经济学。


    在中国，我们学的是马克思主义经济学。

    在欧洲美国，人们学的是大政府凯恩斯主义经济学。

