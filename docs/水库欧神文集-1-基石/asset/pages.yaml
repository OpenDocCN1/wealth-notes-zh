- pgno: 220
  md: '这个观察是正确的，按目前取得的数据而言，流量大概增加了 4 倍。而北京、上海、深圳、南京，已经出现了全面的堵塞现象。而交通事故更是层出不穷，完全无法被拖走。据说车龙最长有
    40 公里，许多司机从凌晨 3:00 出发，现在仍未出上海市。


    铅笔姐因此洋洋得意，包括薛兆丰那个半壶水，都在得意洋洋地批判“供给不自由，价格无意义”。队友自由主义经济学家们，纷纷批评高速免费政策，重点放在了无价格则无稀缺，无法进行价格调整则导致资源滥用浪费。


    我对此的评价只有三个字：无知 SB 弱智。我是说铅笔姐弱智。


    为什么，因为高速免费根本不会导致“大拥堵”。你拿这个作为理由，去和人辩论，那是非输不可。然后政府高官正好以此为借口，“唔，市场派都是错的”。正好继续推行恶政。世界上还有什么事，比看见队友卖了老大的破绽，自杀式攻击，太阿倒持更糟糕的了么。为什么错呢，因为市场自有其逻辑。


    上海的内环高架也是免费的，杨浦大桥刚造好时是收费的，现在也是免费的。今天的上海内环高架，有没有造成 40 公里的车龙呢？


    答案是否定的，因为市场自己会作出调整。


    市场是一个活物。内环有多堵，开车的人都知道。久而久之，大家就会考虑，高峰时期是否该上高架，高峰时期是否应该走更慢一点的地面，甚至高峰时期根本就不出门。


    市场是一个活物。人是会自我调整的。今天的北京、上海、深圳大堵塞，这是“短期”现象。是因为第一年第一次高速免费，大家不了解情况，所以有些失误。


    如果这样的免费多来几次，老百姓长记性了，明年的十一就不会有这么多人走沪宁、沪杭。明年就会有更多自驾游攻略介绍省道国道小道，甚至明年就会有更多人待在家里，不去凑黄金周的热闹。'
