  md: '既然是公司，就要遵循董事会章程。简单地说：“少数服从多数”。譬如更换物业，譬如整体翻修，甚至炸掉了重造。只要 66%或者 75%的赞成票就可以了。


    而霍英东首创的“分层产权”，这在整个人类史上都是没有的。是整个人类文明史第一次。


    霍英东一生中有二件巨大的发明，震动地球。这足以使他载入史册，这么 NB 的人。[3]


    “分层产权”的结果，是使得一幢建筑物，事实上有了 100~200 个业主。其中每一个业主，都是 100% 的产权。


    这导致了很多很多的问题。


    一个最核心的问题，就是“强拆”的问题。


    现在闹得沸沸扬扬的社会拆迁，老上海七十二家房客。原先的资本家被赶走了，房子平分给 1949 年的平民。


    好了，现在七十一家都搬走了。就剩下你最后一户。你铁了心要做钉子户。打死不搬。一开口要三个亿。


    或者象 2008 年“重庆最牛钉子户”一样，一开口要 2000 平米闹市区商铺。你说话该怎么办。


    这事情没法推行下去了。


    一幢有着 100~200 户业主的物业。其实是一幢“死物业”。


    这样的物业，既不可能改建，也不可能翻新。甚至来提升物业也非常困难。因为永远有小业主反对。你永远收集不齐 100% 支持。


    四季雅苑从大业主自持，到拆散卖给小业主。物业品质一落千丈。


    # 五）收缩产权


    我们还是看回张五常的这段话。


    ![](img/f67be513638d053b62bd7b01d459b241_337_0.png)


    张五常的意思，其实要“收缩产权”。


    一亩土地上，有 10000 个业主。印第安自治领就完蛋了。


    一幢房子，有 200 个业主，其实也不是好办法。


    最终这样的物业，无法拆迁，无法改建，甚至无法翻新。损失的还是业主本身。'
