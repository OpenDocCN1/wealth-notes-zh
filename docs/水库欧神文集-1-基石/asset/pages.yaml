  md: '还有 **24H** 不间断摄像头。做坏事马上就可以抓到。


    更高科技的是，车牌业主，瞬间识别。


    因此收费率几乎 **100%**，没什么逃票的。


    有人问，两侧的“彩钢扳”能不能省下来，摄像头能不能省下。


    单造一条公路的话，岂不是成本更低。可以多造几里。


