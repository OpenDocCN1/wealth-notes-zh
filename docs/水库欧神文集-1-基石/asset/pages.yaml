  md: '“布+米+交易”，才是国民财富的最大化。


    参考文献：稻尾独立社精神之本《稻尾的故事》[1]


    # ## 二) 不动量


    我们习惯用“<u>不动量</u>”来分析问题。


    A 有一个苹果，B 有一个梨。无论你左右看多少遍。其物理财富也是“一个苹果+一个梨”。


    只有当 A 和 B 见面了。A 喜欢吃梨不喜欢苹果，B 喜欢苹果。二者交换。则“财富总量”才可以增加。


    可是这个时候，<u>财富又达到最大化了</u>。不可能再增加。因为再也想不出“新的交易”了。


    除非这时候，再出现一个 C。C 喜欢吃苹果和梨，但有很多桔子。用桔子把梨苹果都换了。


    可见，在整个系统中：


    +   • 有了交易，<u>财富就会增加</u>。


    +   • 没有交易，<u>财富就不会增加</u>。


    如果广泛地把上班也理解成为一种交易。是“用你的 8 小时”换“雇主的工资”，则人类的全部生产活动，全部财富，可以理解成一个公式：dT>0.10


    有多少交易，就有多少财富。


    交易越多，财富越多。


    当你再也找不出任何交易机会时。财富达到最大化。这就是帕累托极限。[2]


    这是一条非常非常强大的定律。强大到象“<u>能量守恒定律</u>”一样坚不可摧。


    因为他并不是一条宏观定律，而是一条微观定律。不仅对大社团有效，拆散到每一个环节，每一个步骤，每一个场景，他都是有效的。


    “交易”就象小草，在任何一个不起眼的角落生长开来，都会使得我们的社会更美好。任何一个角落交易多了，全社会财富都会增加。


    所谓宏观，无非无数个微观累加。“能量守恒定律”并非在航天宇宙飞船上有效，他在飞船的每一个零件都有效。


    当你学会了 dT>0，秉承了“经济学第一定律”的精神，你再去看看目前的教科书，包括最近 40 年历届的诺贝尔经济学奖。其中一大半是错的，一大半可以直接扔进垃圾堆里。


    因为 dT>0，交易产生财富，有多少交易，产生多少财富。


    不增加交易，就不增加财富。


    然后你再翻翻这些经济学著作，譬如去年的法国人诺奖得主“反壅断法”。你再问问前几年的工会与博弈，环保与管制。你只要简单地问他们一句：“交易增加了么”？


    对于那些玄而又玄的计量经济学公式，洋洋洒洒的几十页论文。指手画脚的经济学高参。你只要简单地问他们一句：“先生，您既不耕地也不织布，请问您是怎样为我们的国家增加财富的”。


    拥有了经济学第一定律：dT>0，简直就象拥有了“能量守恒定律”大杀器，然后穿越回到十五世纪。


    你看起来看看十五世纪的论文，永动机或者炼金术，一大半都可以直接扔进垃圾堆。擦靴子。


    # ### 三) 现实的世界


