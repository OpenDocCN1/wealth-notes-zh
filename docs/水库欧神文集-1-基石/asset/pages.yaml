  md: '我准备 N 份试卷 ABCDEFGH，难度依次递增。


    我看你能做到哪一级。哪一卷恰好考到 80 分。就在那卷停下来。


    回到至关重要的环节，增值服务的重点：


    # “问答”


    +   - “这份卷你 80% 懂了，20% 不懂”。

    - “哪些问题不懂，为什么不 懂”。

    - “当时你做这道习题时，你是怎样想的。你为什么判断 AC 和 BD 是平行线”。


    问答才是“手把手教”的环节。“问答”是一个 1 对 1 的服务。


    收费很贵的，几百元一个小时。


    老师完全针对着学生的弱点，针对着学生的掌握程度，度身定做地解决他的思维盲点。


    按照这样的“教育模式”。其实我们的教师，不是太多，而是太少。


    这种“考试---问答”消耗的教师人力资源，远远大于传统的“授大课”方法。


    “授大课”是在低资源时代，当时的人力资源，知识份子都很少。


    所以才采取粗放式的方式，培养“低质量”的苗子。


    目前的教育改革，有识之士都在喊“小班化”，很多国际学校，已经缩减到 12~14 人一个班级。


    但是再小的班级，又哪里小得过一对一呢。'
