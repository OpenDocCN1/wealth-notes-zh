    # 程序员会不会失业 #F2140


    一）讲座


    昨天，我们在北京国际会议中心，举办《人文经济学会》经济学讲座。题目是《工业革命与市场经济学》#F30


    其中第十三节，我们讲到了“程序员失业”的问题。


    这话题实在有趣不过。值得我们展开细讲一讲。


    +   程序员是朝阳行业，还是夕阳行业。'
