    * 经济危机是对生产力的极大解放，而不是伤害。


    这个才是正确的经济学理论，才是科学。而知乎的那帮蒙昧写，没有接受过正统的教育。从小被马列洗脑，看着他们可怜又可悲。从学术上讲，“经济危机”实质是一场“新陈代谢”的过程。在生产中，肯定会有一些企业，变得越来越臃肿，越来越腐朽，越来越不合时宜。我们知道，腐朽的东西，就得让他死掉。每当看到大公司领导站在台上指手画脚，满嘴喷粪。冗长的会议开了三个小时还不结束。你就会想：“所有的错误都必须接受惩罚”。公司闹掰，就应该亏损，这才是天道。领导喷粪，就应该亏损，这才是天道。腐朽官僚，就应该亏损，这才是天道。如果让公司企业们“永远不死”，这才是不合理的。那帮混蛋上班不好好干活偷闲旷工，拉帮结伙，政治斗争，这样的企业不破产，才是不合天理的。所以正统的经济学，对于“企业破产”，是持有非常正面的态度的。你破产，说明你效率低于社会平均水准。


