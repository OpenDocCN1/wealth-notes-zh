    法庭的判决，讲究“证据链”。


    但是中国的老百姓是极度愚蠢的。百姓只相信“事实正义”。你给他们一条残缺不全的“阴谋论”。百姓High起来了，舆论自然站在你这一边。


    # 三）除火


    事情做到这一步，还不算完。


    打架要打全套。做人做事，要把手尾做完，收拾整理干净。


    “徐晓东大破太极拳”这件事，虽然可以通过洗地脱身。强行污蔑为“收钱打黑拳”。


