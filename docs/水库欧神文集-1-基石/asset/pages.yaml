  md: '这里面基础一条分水岭，是“基础温饱”。


    使民富。民富了以后，自然会去追求“声色犬马”。


    只要人口逐渐满足了“基础温饱”需求。


    过了这个槛，服务业就会爆发式增长。人们很快就愿意花 3000 元一堂课，来进行减肥指导。


    哪怕馒头才卖 3 元。


    我们纵观历史，“帝国主义都是纸老虎”。


    因为民朱，加速搞建设等历史原因。从 1960 年代，香港和内地就走上了不同的发展道路。


    香港，很早跨过了“温饱”阶段。进入了“服务业无限计价”的阶段。


    假如我们把“基础温饱”的价格，定义为 1 元。


    则香港人为“中等享受”“高档产品”愿意支付的价格，可能是 B=10，C=100.


    GDP 高得吓死人。


    而另一方面，中国内地，尤其是一些未发达地区，则长期跨不过“基础温饱线”。四五线城市一些人民，长期觉得“基础生存”还受到威胁，自然缩手缩脚。一丝一毫都不肯浪费。


    也有一些省份，例如山东，山东是 GDP 大省。但也是“国有企业”大省。


    石油，化工，汽车，机械制造，GDP 的大头，都在九家“中字头”公司手中。胜利油田的收入，直接进中央国库。山东人工资却只有几千元。'
