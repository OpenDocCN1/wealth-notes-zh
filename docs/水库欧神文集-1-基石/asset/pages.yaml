  md: '在知乎这种 SB 弱智的论坛上，文盲们对于“外部性”的理解，停留在“凡是使宝宝不开心了，就是不好的”。


    山口百惠嫁给了三浦友和，反对。

    山口百惠嫁给木村拓哉，反对。

    山口百惠嫁给梁朝伟，反对。

    山口百惠嫁给吴彦祖，反对。

    反正只要山口百惠不是嫁给你屌丝张黑牛，统统都是反对。


    你反对个鬼啊，你有资格反对么。


    可是知乎体不是这样想的。更极端一点，假设对于张黑牛这个人来说“和山口百惠结婚”就是他人生的唯一目的，唯一快活。

    那么对于张黑牛来说，目前我们所奉行的自由结婚“制度”，无疑是极端邪恶的。

    你再换一种制度，他还是不满意。

    你再换一种制度，他还是不满意。

    除非你的制度，是把“山口百惠嫁给张黑牛”，否则他统统永远都不满意。

    他天天挥舞着铁锹闹事。非要砸烂掉你们这万恶的旧社会。


    最具有嘲讽意义的，在美国，台湾，他还是真的这样去做了。

    于是，国之不国。

    二）不满

    屌丝们没能区分一个至关重要的问题。他们没有分清“不满”和“外部性”。

    * 你可以对很多事情表示不满

    * 但只有少数事你有资格阻止

    我还对 KFC 甜筒丧心病狂涨到 6.5 元不满呢。

    但难道我可以强制要求 KFC 恢复到 2009 年的 2 元么。


    知乎回帖：

    不考虑外部性么？首先这信贷这件事对借债人以后会产生什么样的影响，对整个社会的价值趋向会产生什么样的影响。或者说在提出 dt0 的时候把足够多的因素内生化了么？仅仅就像一个借债人借钱必然有正收益，否则不会去做这么一个强假设，就敢假定收益必然为正，就敢支撑与日常直觉相反的论点，人是理性的么？[1]

    在知乎上，“不满”和“外部性”这个二概念。其实是被混用了。

    如“女大学生裸条”事件，屌丝知乎男纷纷表示了不满。

    因为“廉价优质媳妇”供应被切断了。

    知乎男梦寐以求的，是

    * 媳妇读了一个体面的高学历

    * 省吃俭用一分钱不用

    * 冰清玉洁什么人也不碰

    * 被粉刺青春痘屌丝一撩就中

    * 任劳任怨做牛做马

    * 吃饭不上桌子'
