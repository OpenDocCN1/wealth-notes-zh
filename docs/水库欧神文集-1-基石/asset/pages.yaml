    # 无风险套利 \#30


    只要给我一个无风险套利方法，我就可以富可倾城。


    # 一）套利赚钱


    这个世界赚钱，一种方法是出卖劳动力。譬如下煤井搬煤，或者小白领坐办公室。坐满八小时，老板就发你一天的工资。


    另外一种方法，则是做生意。低买高卖。1 元买进，2 元卖出。


    第二种方法来钱快，但他有一个缺点。


    +   a. 价格会移动。随着你生意做多了，买进价会逐渐涨到 1.1 元，卖出价会跌到 1.9 元。

    利润空间会缩小。最理想的是你背靠一个海量般的市场，比天空还宽广，比大海还辽阔，这样价格才会仅缓慢滑动。


    +   b. 会有竞争对手。加速价格滑坡。


    对于绝大多数做生意的人，他烦恼的是 a 和 b 二个问题。所以生意也不好做。真想赚大钱也难。


    那么，有没有一个办法，能维持价格始终不动。始终维持“1 元买进，2 元卖出”。我只要在其中跑来跑去，就能躺着赚大钱。


    这种方法，学术上称为“套利”。


    但是套利是不长久的。几乎任何一本教科书都会和你说，一旦存在套利机会，就会吸引无数的“竞争者”涌入这个市场。大家竞食这块肉。最终搞到“1.4999 元买进，1.5001
    元卖出”。也没有多少利润。'
