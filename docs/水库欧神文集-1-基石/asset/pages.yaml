  md: '到了馆场里面，有引导和讲解员。


    出口，有纪念品商店，扎堆了四五个蓝毛兔。


    这样整组人，就已经 10 人以上的。


    然后你想，海洋公园每天开业 12 个小时。早八晚八。


    每周无休，七天。就是 84 个小时。


    法律规定，每人每周合法工作 40 个小时。


    84 小时，你至少就需要二组人。再考虑到节假曰，年假，轮休，你甚至需要三组人。


    就为了照看三只熊猫，养活了 30 个人“高档体面”的就业工作！


    而整个海洋公园，都不知道有几十个馆。


    难怪兴建一个乐园，可以提供 5000~10000 个就业岗位。香港还在上班的，一共才多少人口！


    俺左思右想，左思右想，灵感闪现，突然猛地一拍大腿。


    “这香港，也没什么高技术含量岗位嘛”。


    我们曾经以为香港是“东方之珠”，香港人全都是高人一等的小马哥，刘德华。


    Burberry 的风衣一披，手执二把“沙漠之鹰”，再涂上半斤的发胶。


    这气势，这派头，让你恨不得把录像带揪出来。'
