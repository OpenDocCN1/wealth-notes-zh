    # ### 经济学第一定律 #50


    经济学第一定律是什么，dT>0，这里的T代表交易。


    # **一) 国民财富**


    如果以 1773 年《国富论》出版，作为经济学科枝树萌芽的标志。则亚当·斯密斯将他呈献给英王的时候，有一个问题是无论如何绕不过去的。


    > > “尊敬的先生，你号称经济学能让我们的国家变得更富裕。可是纺织女工织布，农夫耕作。你不一织布、二不耕地，请问你创造的财富，从何而来？”


    这是一个大是大非的问题。也是后世几百年国力昌盛的分水岭。这么多年的歧视商人，打击投机倒把，剥资本主义尾巴。乃至于今天的环保恐怖主义，人权圣母 B，福利懒虫绿教泛滥。全都和他有关。这是个核心问题。


    这个问题的正确回答：“先生，财富来自于交易”。


    我们知道，财富，并不仅仅是简单的相加关系。


    一个樵夫有一把小提琴，一个音乐家有一柄斧子，他们(二人)的财富，并不是简单的“小提琴+斧子”。


    一定要非得到樵夫和音乐家见面了，二人互相“交易”。樵夫拿到斧子，音乐家拿到琴，财富才算最大化。


    一个沙漠中的部落，可能拥有大量的石油，可却没有蔬菜水果。


    一个桃花源中的部落，可能拥有蔬菜水果，可却没有石油。


    二者交换。“总财富”才能最大化。为此，我们甚至不惜加点损耗，修条铁路。


    当国王问 AdamSmith，“纺工织布，农夫耕田”时。其实“布+米”的财富，并不是国民财富的最大化。'
