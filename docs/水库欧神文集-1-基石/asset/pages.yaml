  md: '# 关键就看一件件件纷纷扰扰的事，怎样被天才程序员归纳成算法。


    有了算法，该领域人类就一定会失败。时间早晚。


    算法越精妙，算法越逻辑。则超越的时间越早。


    好比 AlphaGo，使用了“穷举+预判”算法，而不是深蓝简单粗暴的“穷举”算法。


    时间复杂度，空间复杂度，大大缩减。节约 CPU 资源。


    因此把“击败围棋”的时间提早了十几年。


    但是，迄今为止，人类对于“算法”的研究，还处于十分初级的阶段。


    仅限于部分“封闭的，简单估值”的棋类游戏。


    仍然是 2000 行，20000 行代码。而不是 2 亿行，20 亿行……


    这离真实的，纷纷攘攘的现实世界，还有无穷无尽的距离。


    象《终结者 3》这样的独立机器人，在有生之年或许都不会出现。


    按照业内一般的划分，目前的 AI 人工智能，仅仅处于“细胞级”。


    下一个世代，下一个 30 年，拼尽全力或许希望可以到达“昆虫级”。


    那些热炒 AI，夸大 AI 的资本炒作，恐怕要失望了。


    而至于人工智能的“终极成就”呢。


    终极成就则是，AI 可以自己判断解决问题。自己写出“算法”。


    到了那一天，人类就真的没戏了。


