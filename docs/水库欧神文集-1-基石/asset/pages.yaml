    # “信息不对称”是伪科学 #F750


    信息就其本质，是一种商品。作为商品，买多买少全凭随意。


    一）火炮


    美国大兵梅杰躲在坦克里，闭着眼睛，默默地数着一枚火炮二枚火炮。[1] 突然，一行字显露在他面前的显示屏上。


    “左方 37.4 度，主炮仰角 23.6 度，三级初速，榴弹准备”。


    梅杰不敢怠慢，赶紧装好了弹药。按一下发射按钮。


    “砰”，坦克主炮冒出一团火光。数十秒之后，视界之外的三公里处，一堆火光冲天而起。伴随着剧烈的连环爆炸声。


    对于这件事，阿拉伯人是极其不服气的。在阿拉伯人看来，美国人全都是奸诈的骗子和懦夫。


    象《勇闯夺命岛》拍的一样，恐怖分子冲着尼古拉斯凯奇吼道，“你们永远不敢面对面地拿着刀剑对砍，只敢躲在遥远的海上发射导弹”。


    对于阿拉伯人来说，美国人全部都是懦夫。


    仅凭机械性能来说，阿拉伯人的苏制坦克并不差。各项性能都在同代产物。可是阿拉伯人最郁闷的是，他们从来遇不到“面对面的厮杀”。


    歌颂二辆坦克在旷野中大战，所有的对抗和偶遇都是不期而遇。'
