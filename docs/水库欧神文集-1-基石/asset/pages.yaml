- pgno: 393
  md: '因为不用交企业所得税。


    绝对的现金 Cow。


    # 6）商户手续费


    第六笔利润，是向商户收的手续费。


    吃完上家吃下家。


    怎么不可以向商户收费呢。


    目前我们在饭店吃饭刷卡，无论刷的借记卡，信用卡，二维码，商家都是要付手续费给支付系统的。


    一般是 0.6% 左右。


    对此的解释，是电子化交易减少了现金假钞，加快了收银速度。


    省去了收币之后，现金盘点结算的人力。


    而且每月可以定期反馈大数据报表。


    总而言之，“商家手续费”是一定收得到的。


    只要你刷我的卡，就额外再收你 0.6%


    # 7）商户推广费


    有一些更恶劣的卡，它甚至可以收二道手续费。例如什么“中粮月饼卡”，它只能在中粮的官网使用。任何东西比市场价贵 +20%


    这种卡只要它能强行发得出去，就稳赚 20%，完全是官商。


    对于斯玛特卡，虽然它的消费范围更大一点，但依然不是万能的。不是银联标准卡。


    于是公司就可以收“推广费”。


    斯玛特卡拿到手，通常他会给你一本小册子。官网上也会有目录。在哪些商户可以消费。


    哪些商户还可以“凭卡打折”。


    注册关注之后，定期给你推送 Coupon 信息。


    这个“竞价排名”依然是要收费的。


    给商家刊登了 Coupon 广告，怎么可能不收商家 DM 费呢。


    # 8) 账期


    第八笔收费，是账期。


    今天客人来到店里，刷卡买了二件衣服。难道你就可以马上收到现金么。


    太洋，太拿衣服了。


    “结算机构”完全可以卡你。再卡你 90 天账期，180 天账期。


    # 9）报销


    斯玛特卡有这么多“擦油水”的地方。为什么企业还要去买它。


    还要拿来当福利发给员工呢。


    因为从税务上讲，斯玛特卡还可以“避税”。


    如果企业直接发 500 元给员工，那就属于“工资性”收入。必须按照工资档次缴纳所得税。


    可是企业发 500 元“斯玛特”卡，他可以归类并入“行政成本”。


    企业一次性购买 10000 张斯玛特卡，性质等价于去 Home Depot 购买储值卡，去 B&Q 购买储值卡，等价于采购预付款。


    买办公用品，公事公办。完全可以入成本。'
