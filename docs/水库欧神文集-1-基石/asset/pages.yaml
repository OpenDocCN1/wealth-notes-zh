  md: '政府扶植的“扶贫”，很容易摧毁当地公序良俗。反而搞得越发返贫。


    任佺强认为，扶贫“慈善”也应该走“企业家”道路。


    只有企业家，才能真正地四两拔千斤。才能真正把财富送到农民手中。


    任老学了“任小米”计划。


    在阿拉善 SEE 的沙漠地区，当地的水资源十分贫瘠。


    对生态威胁更大的，则是地下水的不断枯竭。


    因为大树的根，一般在-3 米左右。如果地下水位持续下降，例如降到-4~5 米，大树就吸不到水。树就会枯死。继而带动整个生态的崩溃。


    “任小米”计划，鼓励当地的农民种小米。然后统一收购。


    小米既养活了当地人的口粮，又锁住了地下水分。目前几乎可以做到水位不下降


    进一步增加微滴灌设施的话，甚至可以让地下水位回升。


    一旦地下水升到-1 米左右。整片生态绿化就全活了。沙漠化逆转。


    收购小米补贴的“差价”，对于马蔚华，柳传志，任渝这样的大巨头来说，完全可以承受。


    通过“以工代赈”，带动了当地牧民的生产习惯，勤劳分配。


