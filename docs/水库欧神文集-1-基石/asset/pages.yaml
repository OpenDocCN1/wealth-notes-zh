  md: '# 每逢佳节倍孤单 #F220


    2015-11-18yevon_ou 水车论坛


    水车论坛                      欧神文集（纸质版）


    ![](img/f67be513638d053b62bd7b01d459b241_537_0.png)


    # 每逢佳节倍孤单


    汽车的收音机，可以预设六个台。在我的设置中，一个台是99.0 中国新闻，一个台是97.7 第一财经。另外四个台则是 101.7，103，7，105.7 和
    107.7


    有时候把频道跳来跳去，跳到 FM99.0 的时候，感觉就是惨不忍睹。基本遍地都是伟大光正，清官慰民，好邻居互助社区，老阿姨光荣事迹，学习最新思想光荣团体………


    听政治有时候难免听得恶心，翻过去到隔壁财经频道。然后就听见给股民朋友们拜年，明年一定要加大仓位，把套牢赚回。专家分析楼市到顶，股市黄金十年。贺兄男专访，论楼市调控的必要性，并给股民朋友们推荐大礼包。然后切换一下放广告，同一个频道之内，目标观众既是广大股民朋友们，也是买四送二高波特盐水瓶。


    我在南非的时候，偶尔打开翻翻电视。吓了一跳，电视里几乎所有的爱情送残片，无一例外，都是“白女爱上黑男”。而且爱得死去后来，抛弃一切追逐纯粹的爱情。


    当我看着那个光头黑人跪牙，歪着头问“你是真心爱我的么，你是爱我的么”。白女毫不犹豫地说，“是的，我爱你，因为我爱你”。


    哥哥终于忍不住真心地吐了。


    为什么呢，因为媒体首先是面对观众的。有什么样的观众，就有什么样的媒体。


    屌丝占了人口的绝大多数，不论是“了“收税率考虑，还是为了洗脑考虑。电影电视，都是拍给屌丝们看的。'
