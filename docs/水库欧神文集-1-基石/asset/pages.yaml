  md: '好了，现在我问你，“登山”这个游戏，应该怎么玩。


    假设你的起点，在 A 点。


    ![](img/f67be513638d053b62bd7b01d459b241_106_0.png)


    从 A 点开始“放眼四顾”，你觉得最佳奋斗目标，应该是 B 点。


    B 点算是一个小山坡的“峰顶”。


    到了 B 点，想要继续提升的话，也是有办法的。


    视线之内，下一站是：C


