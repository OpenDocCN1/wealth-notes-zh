  md: '对传统的书商行业，是颠覆性的革命。一点不给实体书店活命。

    但我还是要说一句：

    “**以上全错**”


    # 四）书籍时代的消亡


    在我看来，Amazon 依然是落后于时代了。

    他想出了一个极具有创意的图书分销模式。但是革命不彻底。

    他没有想过，连图书这种信息形式，本身都不存在了。

    图书是什么。

    图书本身是一连串的章节。譬如《红楼梦》1~80 回。每一回大约 6000 字。

    《红楼梦》排版顺序是，第一回，第二回…………第八十回。

    那么，它简直就是 80 本薄薄的小册子。

    用订书机，蛮力装订在一起。

    我们不由得想问，这样的“格式”，合理么？


    举个例子，yevon_ou 在写“水库论坛”微信公众号。

    从第一回《毁三观，整新生》#1，到本篇，零零碎碎也有二三百篇了。

    我们的格式是，每隔几天写一篇。

    每一篇的末尾，有网友的打赏，评论，和点赞。

    作者可以不停和读者互动。读者有时候还会点菜，“什么时候写写月供啊”，“最新加息政策怎么看”。

    而作者写到一半，可以引用前几篇的文章。直接加个链接，例如《中产阶级如何保护自己的财富》#F730


    最绝妙的，是作者还可以“改”。

    譬如说，今天看到一篇非常好的文章：《易中天：“达康书记”也是你能叫的？》[2]

    我在《论儒．法．禅宗．基督自治与道教的复兴》#F10 一文中说，“儒教”也被你称之为“礼教”。

    儒的本质是等级制。而等级制需要确权，需要确定双方的长幼尊卑。

    二个人见面需要行礼。行礼的方式和言语，其实就是“地位等级”的暗中衡量。

    行礼，决定了二个人以后相处的尊卑服从次序。

    这段话写的时候，苦于没有太好的“称行礼”参照，行文寡淡无味。今天看见易中天这篇文章，如获至宝。于是俺高高兴兴地把参考“注释”加到了#F10 中去。

    如果我们把“水库论坛”视为一课“炒楼学”教科书的话。

    你是买一本书的效果好。

    还是关注一个微信公众号的效果好。

    答案毫无疑问是“微信公众号”的效果好。

    因为微信公众号他是“活”的。可以有互动，有更新，有改良。甚至每一次打开，内容都会有轻微改进不一样。

    有人说，手机拍照，手机录像，自媒体兴起了以后。'
