- pgno: 826
  md: '从制度上讲， “永久产权” 才是最差的。因为它完全没有 “内存回收” 机制。


    随着时间推移，产权只能越来越碎。系统破碎不堪。


    最后只能重启。


    从制度设计者角度， 70 年产权 > 永久产权。


    至于具体应该是 70 年， 50 年， 35 年，则要看业态和资本回报率，这是另一个话题了。


    ps. 真正聪明的人，不会去买永久产权。


