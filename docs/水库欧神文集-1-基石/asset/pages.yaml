  md: '你如果严格按照“水库”心法来操作的话，则风险是非常非常小的。


    7000W 的单子，水库至少会让你准备 2~3 套流动性非常好的小房子作为护航。


    同时搭建周边拆解网络。


    本身还有信用卡，信用贷等大量金融工具备用。


    你买的什么楼盘，买之前有没有咨询过水库。是不是买的“远郊一手品牌 CEO 贵妇”盘。


    水库在深圳只推荐过振业城，中海康城这两个楼盘。2016 年推荐时 28000，目前 40000，从任何角度看，都是赚钱的。


    小心李鬼，注意山寨网站会推荐坑多楼盘。认清正牌“水库论坛”。


    你说你亏钱了，那你是不是跟随“水库心法”呢。


    你上的真水库，还是李鬼网站。


    水库要求你“克勤克俭”，看房 200 套，你做到了没有。


    买房之前，就“选筹标的”“配置结构”，有没有付费进知识星球咨询。


    如果这些都没有的话，你冠一个“水库传人”抬头。然后说你套牢了要跳楼。


    抱歉，这锅水库不背。


