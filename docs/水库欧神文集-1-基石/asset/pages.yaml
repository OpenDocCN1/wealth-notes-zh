    # 空置税可以降低房价么 #1500


    无知，无良，无耻


    # 一）前言


    这两天没有题目可写。本想继续写《水库 90 后的故事》，静流这个小猪扒一直没把发财秘籍++糇事段子传给我。所以也只能待机。


    昨天刷朋友圈，无意中看见“光远看经济”写的《应对空置的住房征收“空置税”》，掩卷叹息。


    无知，无良，无耻！


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……'
  merge: -1
