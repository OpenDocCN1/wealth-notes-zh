  md: '再譬如说，20年前，哥哥多愁善感那个年代，《仙剑奇侠传》那真的是一行一行代码敲出来的。李逍遥见林月如，就要专门编一段“情话对话程序”。


    可是后来，《仙剑》系列出第二代，第三代。


    黑心的老板渐渐发现，不需要每次都编写新的代码。反正都是RPG游戏，拿过来把妖怪画面换一下，就是一个新的游戏。捞钱氪金。


    再后来，更弄出了叫“游戏引擎”这样一个怪东西。


    现代的游戏业制作，根本不需要自己写底层代码。而是更像我女儿玩的《Minecraft》。它有一个编辑器。你把各个素材输进去就行。直接就是一个新游戏。


    程序员抱头痛哭。“完了完了，没戏了。主程序都设计完了，我们也可以回家卖红薯了”


    直男瑟瑟发抖，不敢贷款买房子。


    # 三）制造


    如果你是这样想的，这样规划人生，这样踢了程序员的男朋友。


    那你昨天一定没来听我的讲座，《工业革命》#F30.


    昨天的讲座中，我们对程序员的描述是：


    +   • 由无序变为有序

    • 非标变成标准化

    • “熵”的处理者。


    因为这种高等智慧的理念比较难。非水库系的小白听不懂。所以我们需要展开解释一下。


    首先，我们讲一讲，什么是“熵”的概念。


    我们举一个最简单的例子：铁钉'
