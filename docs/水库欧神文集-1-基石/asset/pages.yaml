  md: '在铅笔社所有文献中，只有“知识产权”一环。我是没有完全被说服的。所以本文讲 的是，我对知识产权的一些领悟和心得。用的不是上帝视角，纯属探讨和互相讨论。
    毕竟这件事我也没完全想通。


    # 二）外星人


    在很久很久之前，就有一个问题，一直困扰着我。


    > “假如外星球月球轨道，有一艘外星飞船。他们接收到了地球信号，请问他们要不要付费”


    譬如说，任何硬盘，都是电脉冲信号。如果你拷贝文件，电磁波就以光速 C，向全宇宙扩散。 假设有一艘外星飞船，停在地球同步轨道。外星人的科技很先进，他们可以接收到微弱的硬
    盘颤动信号。


    这样，外星人就把一整部 Windows 8 软件都抄到了。他们把他刻入 DVD，高高兴兴地拿回去 研究了。


    顺带的，还拷贝了邓紫棋的二首歌，张学友的三张 CD。以及一场 S. E. S 的演唱会。 请问，外星人要不要付费？


    这个问题困扰了我很久，折磨得我废寝忘食。从答案上来讲，首先我们是确信无疑的。答案一定是：“不付”。


    因为我们甚至根本就不知道外星人的存在。我们也不知道外星人是什么样的。 我们不知道外星人用哪一种科技，躲藏在虚空中空的存在。


    那我们又有什么权力，又有哪一条法律条文，可以约束外星人的 Liability呢。 你再扩大想一想。好比一个阿米巴星球人，突然某一天，一群地球人哇呀呀地开着宇宙飞船
    冲过来了。


    地球人架起了宇宙大炮。要求阿米巴星人交出 10 吨的蓝晶。否则就要开炮。


    理由是，“偷听了 Lady Gaga 的歌曲”。


    你说，阿米巴星球人，看见一群语言不通的四肢动物，跑过来想要抢你的蓝晶。他们会怎么 反应。


    这个毫无办法，只有等离子反质子炮侍候了。轰死你这个侵略者。 所以，你问“外星人”收取所谓的“版权费用”毫不可能。


    我很担心，当我们第一次和外星文明接触时，会因为某一些圣母的神经病，而导致宇宙战争 的发生。


    “你好，地球人”。


    “你好，阿米巴星球人”。


    “很高兴初次见面”。


    “请支付十亿亿亿美金”。


    “为什么”。


    “就在刚才的分钟中，你已经被地球的无线电波扫描了无数次。你必须为 10 亿首歌曲支付 版权费”。


    “你等着，主炮充能”！'
