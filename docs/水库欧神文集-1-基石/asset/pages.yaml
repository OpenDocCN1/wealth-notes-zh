  md: '![](img/f67be513638d053b62bd7b01d459b241_807_0.png)


    # 六）经济周期的尾声


    “加工资”未必是一件好事。


    尤其是你负责的工作并没有变化，效率也没有提高。突然加工资，更不是好事。


    一年之计在于春，如果以“超市涨价”为标志，梳理产业分配的话。大致可以这样说：


    +   * 春：物价上涨，企业毛利大幅增加

    * 夏：为了攫取更多利润，企业纷纷增加产能。

    * 球：为了产能，企业提高工资招人

    * 冬：陷入新一轮高供应，高成本竞争。财务指标岌岌可危。


    人口学上有“马尔萨斯陷阱”，人口的增长，会持续维持在生存线上下。


    这原理对于工商业企业，也是一样适用的。


    如果没有外界干预，企业就会不断增加产能，互拼成本。最终导致“毛利率再次死限”。


    若毛利率很低很低，长期维持在 3~5%的水准。


    一旦风吹草动，遭遇环保、合规风暴。企业又陷于破产的边缘。


    人工降而，来一次调控。撑不过的企业，统统冻死在寒冬中。


    然后春天才会复苏。


