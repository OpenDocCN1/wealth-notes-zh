- pgno: 272
  md: '经济学的正确解释是什么呢。譬如这二天薛兆丰在北大讲“科斯定律”。百度词条的通俗解释“无论初始条件如何，市场产出总是有效率的”。


    这句话的意思是什么呢。假设一个 100 人的村庄，其中 99 人擅长农耕，只有 1 人是职业樵夫。而整个村子里，只有一把斧头。


    请问，这个村子的最终生产模式如何。答案是“99 人种地，樵夫去砍柴”。


    无论这把斧子的初始产权在谁的手里。


    无论斧子主人是张三李四王五郑六，他们必然会把斧子“借给”樵夫。而收取租金。


    所以总产出永远是“99 人种地，樵夫去砍柴”


    而区别在哪里呢。假设这个村子的总产出是 1000 斤粮食*99+500 斤柴。


    则拥有斧子产权的那个农夫，能获得 1000 斤+150 斤柴。


    其他农夫：1000 斤粮食


    樵夫：350 斤柴


    可见，科斯定律说的其实是“无论初始产权如何结构，总 GDP 不变”


    但 GDP 生产的那些财富，变成了谁的烧肥肥肉牛排呢。就看产权走了。


    即“总量不变，分配有变”。


    因为经济学家都是悲天悯人的。我们关心的只是中国的总量 GDP，关心的只是中华民族的繁荣富强伟大。


    而真正“财富分配”在哪个家族手里，哪个权贵手里。其实我们是不关心的。反正权贵也是中国人。


    这才是科斯定理的精髓。


    而 SB“基哉”的理解力呢，“匠人”们的水准和大师是远远不同的。理工男通常情况只是社会渣一般的炮灰。


    在渣滓低智商的理解力中，他理解成了“无论税收如何，GDP 总产出不变”。


    注意，科斯定理讲的是：“无论产权如何，GDP 总产出不变”。总是错的，严重的错误。


    SB 说的是：“无论税收如何，GDP 产出不变”。


    税收结构变了，GDP 会削弱么。国家会懒情腐败没落么。会的。


    税收结果变了，中国会变成北朝鲜。穷得吃不上饭，穷到民不聊生么。会的。


    如果一个村庄，99 个农民，一个樵夫，一把斧子。


    但是上山砍柴的桥断了，要绕一个大圆子，GDP 总产出会降低么。会的。


    如果路过悬崖，柴火每次要跌落-20%，GDP 会降低么。会的。


    如果路上有一伙强盗，每次抢走货物-20%，GDP 会降低么。会的。


    如果这伙强盗是 99 个村民假扮的，GDP 会降低么。还是会会的。


