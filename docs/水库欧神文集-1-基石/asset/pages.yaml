  img_proc: true
- pgno: 520
  md: '你翻开任何一本廉价地摊货“理财”杂志，动辄教导你《五证齐全》。


    《商品房销售(预售)许可证》+《国有土地使用证》，证书齐全的房子，买了才放心。


    错，全错，大错特错。


    这是彻头彻尾的毒教育（奴化教育）。


    # 三） 事实为准绳


    关于这件事，从头说起。说来话长。


    首先我们要澄清第一个概念，“怎样才能说，这套是你的房子”。


    中国人一般的回答，“看房产证”。


    错，全错，大错特错。


    法制的精神，叫做“以事实为依据，以法律为准绳”。


    这套房子到底是不是你的资产，<u>并不是看房产证的名字</u>，而是看“事实”。


    譬如说，你到荒郊野岭，大兴安岭。自己烧砖，烧泥胚，建了一所茅草房子。那么这所房子就是你的。


    跑到全世界任何一个国家，都是这个规矩。


    如果这房子是你爸，你爷爷，你爷爷的爷爷建造的。


    一路上传下来。


    那么这房子就是你的，谁也不能否认。


    如果这房子是隔壁张三的爷爷的爷爷建的。但是你花500000大洋买下来。


    那么这房子就是你的。


    谁也不可以否认。


    产权是以事实为依据，而不是以证书为依据的。'
