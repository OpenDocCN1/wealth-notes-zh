- pgno: 114
  md: '+   1) 伟人也看不到 F 点


    +   2) 伟人和众人，拉不开距离


    其一，虽然社会主义国家时常有“天降伟人”的传说。但是在现实中，历史数十年的运作结果表示，“伟大领袖”并不比普通人更聪明。


    《资本论》大约成书于 1860 年代。当时，正好是英国工业革命向欧洲扩散。而德国鲁尔区煤矿大显身手的年代。


    对于那个年代来说，最最最高科技的就是“煤铁复合体”。燃煤来炼钢，炼钢再挖更多的煤。整个国家的钢产量就不断上涨。


    而在 19 世纪，“钢产量”就等同于强国标准。


    可是遗憾的是，哪怕刚从马克思成书开始，“煤铁复合体”就落伍了。


    第二次工业革命，以电能为主，化学染料工业为辅，德国因此成了第一强国。


    再下一轮，以石油工业为主。碳氢化合物，以其低廉的成本，彻底击败煤炭。


    1890 年时，美国的石油开采量占全世界 90%以上（部分归功于洛克菲勒），是绝对的石油国。


    因为廉价的能源成本，美国才飞速 GDP，成为世界第一大国。


    可是 Distrill 在当年属于绝对的“非正常”行业。和今天的页岩气挖矿差不多，异议很大，矿产很多。'
