- pgno: 195
  md: '当一个品牌经理，准备推出一款新的牙膏。他心中惴惴不安，有两个选择。


    +   1) 花 40W 元，做一场严尽的市场调查。


    +   2) 不花钱，闭着眼睛推向市场。


    你选择市场调研，你就亏了 40W 元。


    有时候你闭着眼睛往前冲，反而赚得更多。


    “市场调研”和“制造成本”，同样都是成本。


    对于企业老总来说。只有一笔经费。应该改善品质，市场调研，还是降低价格，这三件事是完全等价的。


    企业的竞争，是各个维度上的竞争。


    同样道理，“收费科技”也不是与生俱来。天生刷满 100% 的。


    新村手可能就 30%，然后也需要你 Upgrade，逐渐提高科技树。


    譬如说，第三章讲，原来“高速公路收费”，居然不是中国人想出来的。


    早在 1820 年，全美国 98% 的公路，都是收费的。美国佬玩烂掉的东西。


    只不过当年，路上跑的是：“马车”。


    和今天财源滚滚不同，1820 年美国的“收费公路”业，巨额亏损。最后不得不全面取消。


    因为当时都是泥路。马车很容易在最后 1KM 跳下泥屋，跳到玉米田里，然后逃之夭夭。


    而今天的“高速收费公路”呢。


    今天的中国 Hwy，二边都有彩钢板。是全封闭道路。


    ![](img/f67be513638d053b62bd7b01d459b241_195_0.png)'
