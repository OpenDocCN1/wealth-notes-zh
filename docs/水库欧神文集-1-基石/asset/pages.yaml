  md: '# 咕咕哝哝了十几年的“内需不足”，其实却是伪科学。


    # 在正统经济学中，根本没有这一概念的！


    马前卒说，中国人以为每部乡村剧中都有的“东风集卡”。其实历史却不过 30 年。


    因为“东风集卡”的出现，恰巧比电视机电视剧早了几年。搞得目前全体国民的记忆，好像解放后就 有大卡车似的。


    同样道理，在目前 80 后，90 后的脑海里，“拉动内需”宛如圣经一样持久永恒。似乎从他们“读初中”开始，国家就在喊“拉动内需”。


    这个口号，宛如上古已有，贯穿了他们整个青春季。


    其实这也是一个误解。象哥哥这种半截入土的老头子，“宝刀屠龙，号令天下”我年轻的时候就没听说过。


    太祖时期，太祖的口号是“节约每一根针，每一滴水”。尽力压缩内需。


    谁要是资产阶级奢靡化，对不起，请他青海搬砖。


    难道你是在嘲讽太祖的智慧么。


    # “拉动内需”这个口号，其实是秀相在 2004 年喊出来的。


    +   - 之前的年份，并不存在这个口号。


    +   - 2013 年之后，再绝口不提这个口号。


    +   - 哪怕在当时，也就喊了三四年。


    这个口号巧合之处，它提出的时机，正好是 90 后“启蒙”阶段。


    小鸭子破壳，第一眼看到母鸡。以为母鸡就是妈妈。四处跟随一辈子。'
