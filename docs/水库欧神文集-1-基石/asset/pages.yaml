  md: '可是你整部书看完呢，你还是不懂妙楼。


    # 二）框架与脉络


    那我们缺的是什么呢。我们缺的是一根线，把这些知识点串联起来。


    又或者说的是一颗大树，有了主干，有了框架，然后再把枝枝叶页挂上去。


    如果你现在立志，大吼一声：“我要开始妙楼了”。


    你知道你要干什么么。第一步，第二步，第三步。


    分几个阶段，哪几个阶段该怎么走，每一步需要注意点什么。


    这个就是框架。


    就是“体”。


    所以当我们回顾这本《十年文集》Ver 1.0时，我们十分不满意。因为他充满了技巧，却没有整体框架。


    所以我们干脆下了一个决心。我们要写一本 Ver 2.0，这个版本不是以前的版本上加油加减减几篇文章。而是要一个全新的框架，几乎全部都重写。


    将原先重复的语录删去，缺失的几个节点补上，所有的文章，以 2015 年的水平眼界重写一遍。


    300 篇全部都是新的。


    萧逸的《廿九妹》中有一段话，“她虽然只展示了水红钓三招剑法”，但因为人一个时期的水平总处于同一水准线上。水红钓的其他剑法也是类似威力。


    同样道理，在我目前这个年龄，这个见识阅历。目前是一个大体上的平台期。在这个水平线上，将全部所学整理一下。汇集成册，告一段落，也是一件很有意义的事情。


    当 2014.8 我们刚开始准备编写这本《妙楼秘籍》2.0 时，我们十分乐观。最初的估计，是仅仅十五天。


    此后，我们发现这是一个不可完成的任务，于是改为三十天。


    再之后，我们发现三十天也写不完，又改成了二个月。


    四个月过去了，全书完成进度 11%


    为什么，卡在哪里了呢。


    问题出在《总纲》上面。没错，就是不足 500 字的总纲，卡了整整四个月。


    现在才知道，一些大师举重若轻，那是多么地不容易。


    最初刚开始整理这本书的时候，我们心里底气很足。


    既然这 300 篇都是我写的，肚子里有墨水。那我将你们都整理一遍，稍加修改润色，十五天也够了。头晕再加二篇，立即就可以成册。


    但之后我们就发现，将妙楼这件事整理成一个“系统”，是多么地不容易。


    从哪个角度切入，然后一层层剖开。


    既有循序渐进，又可以面面俱到。


    这个问题想了足足四个月。实在做不到“庖丁解牛”一样行云流水。


    但各方已经开始催稿，RP 值已经跌得不能再跌。


    眼看郭敬明都可以拍部电影自讽拖稿之王，永远不迈出第一步，那就永远没进步。


    那怎么办呢。我们用《水库论坛》订阅微信号向外开始推送文章。


    每一篇都是被人看见的。每隔 3*4 天必然会推一篇。


    这样，大家都看见了。不可逆的，终有一天会写完。


    > 一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……'
