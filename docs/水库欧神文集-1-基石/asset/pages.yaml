  md: "二战之中，各项神奇的天顶星技术，宛如神迹。奠定了之后几十年民用科技发展的方向。\n\n其中最主要的有：V2 导弹技术，喷气式飞机，核能，电子计算机，广义相对论。\n\
    \n整个 20 世纪下半叶，人类文明之善可陈。除了“互联网”，几乎没有真正意义上的突破发明。\n\n一个 1945 年的人，穿越到 2018 年，他最多只会觉得“型号更新”。但是火车铁路无线电飞机，当时已经全部发明了。\n\
    \n你可以说科技停滞。但是，难道 1945 年之后，人类的文明，就没有革新发展了么。\n\n“核心”科技不再发展，难道边缘科技也不发展么。\n\n你这么漂亮的液晶屏哪来的，这么轻薄\
    \ 的手机哪来的。还不是近几年的科技产物。\n\n飞机，高铁，廉价到人人都坐得起。难道不是时代进步。\n\n推送人类文明进步的，有且仅有二股力量：\n\n\
    +   1) 科学技术  \n2) 科学技术的大规模应用\n\n映射到楼市，整个原理也是一样的。\n\n北京，上海等城市， [接近饱和](undefined)。而且在“限购限贷限价限售”的大环境之下，操作空间极大压缩。\n\
    \n京沪的市民，也有一点“疲了”。很多人买房子，终身无望。绝望性消费，对于“买房子”，甚至不再关心了。\n\n但是中国这么大，不是仅仅只有北京，上海等一线城市啊。\n\
    \n中国还有很多个区域市场，远远没有饱和。"
