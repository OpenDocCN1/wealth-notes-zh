  md: '创业方向：ETC


    他当时的设想，他卖的 ETC 设备，像一个拱门一般。每一个收费一万多。


    目前的“国营”高速公路，ETC 设备可以贵到二三万/个。当然，里面有回扣，但总体而言还是有利润空间的。


    当时这家伙和哥哥聊天，正烦恼如何打入国企“腐败”的采购网。对事业摩拳擦掌。


    哥哥中二病发作，直接拉住他：**别做**。


    手机正在废掉我们一项又一项功能。


    譬如以前哥哥睡到 11:00，在万达广场吃个午饭，然后再看场爆米花电影。


    我需要随身携带塑料停车卡，万达影城会员储值卡。


    而现在呢，有了手机有了微信。


    你直接到 B1 的扫码支付，输入车牌号扣停车费，开出去即可。


    “影城”会员卡，也几万年积灰了。


    ETC 这么“重”的资产，客户端和服务端都需要**专用硬件**。我是不看好的。


    说不定高速出入口，关注某个微信公众号，就可以支付了。


    事情比我想象的还要快。马云爸爸，搞出了“车牌付”。


    具体的做法，是先在“支付宝/微信”里面，绑定你的车牌号码。'
