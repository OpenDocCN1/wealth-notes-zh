  md: '我想啊想，想了很久，到最后，俺发现是“价值中枢”出了问题。


    由于人类千百年来 的文明和习惯，人们习惯用“大米”作为衡量单位。


    举个例子，假设人类存在三种需求。


    A= 个性品味的需求


    B= 坐空调车 的需求


    C= 吃饭 的需求


    当人类“极度贫穷”的时候，C 的需求，是占绝对大头的。人类一切的生存与奋斗，完全以“吃饱”为准则。


    在这个基础上，冒死煤矿也好，奴颜婢膝也好，这些都不重要。先吃饭。


    也就是 C=1 的话：B=0.1，A=0.01


    但是在另一个价值体系中，生产力极大发展，“吃饱”早已不是疑难困难。


    人们在吃饱之后，就要开始追求“有质量的生活”，进而追求“个人的体面和实现”。


    在香港这个社会，如果简单生存 C=1，则舒适质量 B=10，个性释放 A=100.


    具体的表现，就是香港只要稍微“上一点档次”，奢侈品就非常贵。但也能卖。


    吃一条老鼠斑，花了哥哥四千多。


    名牌衣服，手表，动辄数万。'
