  md: '当你合同期满，镇议会对警察组织不满意，决定开除他们时：


    # 警察局长拒绝，您怎么办？


    在谭叔那群没脑子的书生中，他们似乎从来没有想过这个问题。

    整个世界纯洁如小白兔，从来没有恶人和坏人。


    # 二）更大流氓


    怎么办，该怎么办？

    在今天现实世界，例如美国西部，英国中部，那些使用“民营警察”公司的镇上，似乎从来不用担心这个问题。

    镇长花白胡子走进警察局，只要一句话，警察局长当天晚上就乖乖地卷铺盖走人。

    为什么，问题的核心，在于镇长手里有一部电话。

    “喂喂喂，省里么……”

    如果警察局长不听县处于部的话，那还了得。这是违反党纪的事！

    省政府会立刻会入手干预。

    别看你一个警察局有几把霰弹枪，省政府真的派一个连骑兵过来。马上镇压得粉碎。

    所以警察局长很识相，乖乖卷铺盖绝不敢违抗。


    “听话”的原因，“识相”的原因，“市场化”的原因，

    警察服务之所以可以包纳入“市场”框架之内，

    并不是市场本身的力量，而是“更大暴力”的力量。

    换言之，只要省政府或武装力量存在。你就可以放心地在每一个地级市搞“警察局民营化”。


    # 三）最终暴力


    但是，这个问题是无解的。递归的。

    有市场化的地方，就意味着效率，意味着文明，意味着伦理。

    “镇村级”警察局你可以外包，警察系统可以兢兢业业全面市场化高效率。那是因为有着省级机关的武装力量压着。

    “省”级的武装力量你也可以外包。甚至连地方“警务司令部”你都可以外包。如果一些二线卫戍军团仅仅是为了守护地方治安的话，这部分PLA完全可以外包。

    但是，省级力量不听指挥怎么办。那些开着装甲车自走炮火箭弹的二线部队不听话怎么办。

    你还有中央力量。有航母和核弹。

    归根到底，“中央武装”扮演了一个“最终暴力”的角色。

    只要圣祖爷还活着，哪个敢乱动一下。

    “暴力市场化”的前提，在于有“更大暴力”压制着。

    “主威素重”，没有皇帝，也就没有秩序。

    你设想一下，假如“君位”空缺。中央崩溃。

    则全国上下，不知道有几人称王，几人称帝。

    随便三五杆枪，占一个小山头。顿时就是一个土皇帝。

    你村长去找土匪，说“请警察局长立即退出本村”。

    你看看会不会把你打死重伤，挂路灯。

    谭叔等人痴人梦吃的“暴力市场化”，根本就违反最基本的方程式常量。


