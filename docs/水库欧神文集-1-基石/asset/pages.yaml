  md: '“什么，这玩意是靠你祖母留下的藏宝图才挖掘到的。那你还要交 75% 的遗产税和 15% 的过期不申报罚金”。


    总而言之，这里一大堆的黄金，美国政府收走 90%，留下 10%作为你们的税后收入。


    在南美丛林杀九死一生探险，食人奴吸血鬼都干掉了。但是你要交美国税。


    # 五）财路


    这也引起了另一个话题。如何才能“赚钱发财”？


    兰博基尼工程师如何把 Lamborghini 开回家，直接从工厂仓库里开出去。


    为 iPhone 编程序的小白领如何买爱疯买爱马仕，把“长链”变短。


    我们的生产链条，已经达到了极不合理的程度。政府象癌细胞，最多甚至可以吞噬你 80%的劳动产出。


    但是社会大分工，有时候是不得不而为之。你可以在家里 DIY 一把木椅，但你不可能在家里DIY 一架波音 747 客机。


    越是庞大复杂的设备（与服务），越是不可能小农作业单枪匹马的完成。你最终还是需要一个大方的正规的公司。兰博基尼也需要问钢厂进口钢原料。


    对于大型的，复杂的设施，你不可能通过“短链”来绕过政府的剥削，从而避免“造五辆割一车”这样骇人听闻的剥削。


    现在社会高度复杂，大型分工，造成了政府收税和盘剥的可能。谁能绕过这条线，谁就可以套利赚巨量海量的财富。


    IKEA 的老板在 2009 年成为了世界首富。因为他发明了可装卸式家具，通过把一堆木材买回家自己拼，节省了陈腐欧洲大量的劳动法人工，把家具价格降低 2/3。他自己也就成为了亿万富翁。


    对于中国，“生产——最终拥有”这个链条中，政府抽取了太多的税负。谁能把这个链条稍微缩短一点，谁就能赚取大量利润。海一样无边无垠的套利空间。


