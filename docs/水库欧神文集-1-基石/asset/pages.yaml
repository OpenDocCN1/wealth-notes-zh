    # 二）仇家


    是的，我们有仇家。

    盘古开天地。清气上升，浊气下降。浑浊人世间自有卑劣邪恶之人。

    这些人，平时你看不见，不代表他们不存在。

    只不过你生活的圈子，离他们很远。远到了干净的手，看不见社会底层的污秽与奋斗。

    水库的规矩，和其他网站不同。

    在其他网站，如果你胆敢辱骂版主。甚至仅仅是发出不同意见。'
