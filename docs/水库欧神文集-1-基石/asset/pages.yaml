    虽然他们的名字，可以是工人，企业家，政府税吏，并不重要。


    这是一条非常非常重要的基础性定理。


    # 一切成本，都是人力成本


    我觉得光凭这一条，拿个重量级的经济学科奖，应该就没有问题。


