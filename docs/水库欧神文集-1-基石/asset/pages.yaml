- pgno: 530
  md: '当半泽在公司里上班时，事实上并没有力量可以约束他的高层领导为所欲为。如果他不受贿，事实上半泽并不能扳倒任何一个人。


    在社会层面，日本的产经关系不受约束。《半泽》剧中，任何日本的公司，离开了银行的合作，都很难生存和发展。而银行本身挑剔的目光，就形成了一种筛选和垄断。


    相反的，如果看多韩剧，无论《来丽叶的男朋友》《钱的战争》，韩国的地下，有一股非常大的力量私债业。这股民间的力量支撑，使韩国经济有更多的活力。


    而在中国，温州地区，高利贷非常盛行。民间集资以及走私，吃撑起了福建，广东等大省的经济。


    我将这篇文章取名叫做“日本没有少数派”，并不是指的日本政坛上没有反对党。


    事实上，正如美国人嘲讽的，民主党共和党，其实这是同一个党。无论谁的上台，小渊和小泽的政见也是差不多的。


    我们真正在意的，其实是体制之外“草根”的力量。


    美国天天强调的，美国需要的“草根”的血活。只有体制外的血统，才能修正和改良体制的腐朽。


    美国一直强调他是一个多元化的国家，尤其关注“草根”出头的机会。这是一个全方位的系统工程。他包括到：


    +   - 普通人有没有体制外生存的机会

    - 普通人有没有体制外创业的机会

    - 普通人有没有体制外借力的机会

    - 普通人有没有体制外转为主流的机会


    以上这些机会日本都没有，日本就是个“一元”社会。至少有一事我是千万确认的，在日本，是不会产生“水库论坛”，不会产生水库这批人的。


    去死吧，日本陆沉。后清帝国万岁。


    （yevon_ou@yahoo.com，2013年10月4日晚）'
