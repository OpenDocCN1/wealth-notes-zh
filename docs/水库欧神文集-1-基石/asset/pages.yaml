    国家主储，规矩就更多了。


    这些事情的背后，一言以蔽之“信息成本”。


    +   - 当甄别成本，大于识别收益时。泛泛而谈的歧视策略是最优的。


    +   - 等甄别成本，小于识别收益时。尽可能地全方位考察真实实力。


