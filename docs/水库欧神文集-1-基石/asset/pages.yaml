  md: '那么，为什么现实生活中，克鲁格曼和哈耶克都是诺贝尔？


    # 二）万物理论


    世界上有没有“万物理论”，有没有一条褐语，直指本心。一语道出，云开雾散，大道破得干干净净。


    幸运的是，这并不是一个哲学问题。而是真实发生的事。


    据我所知，至少发生了二次。


    一次发生在古希腊时期。欧几里得发现了“几何学公理”。


    将当时繁杂又复牴的几何学知识，通过几条简单的公理。可以象房子建筑大厦一样，一层一层垒起来。


    给你几块地基，最终垒成摩天大楼。其简洁，精妙，千百年后仍让人赞叹不已。


    另一次则发生在 19 世纪。


    当时地理大发现，越来越多的物种被发现。都超出了《圣经》的描述。


    生物学，一度被认为是不可归类的。


    因为生物实在太多样化，太复杂，红翅趐蝇，巴西蜗牛，苔癣与磷虾，他们完全没有共同点和相似之处。也完全无法理解与脉络。


    这时候，出现一个人，他只用了一句话，八个字，就将地球 870 万各物种解释得清清楚楚。破得干干净净。


    这人是 CR. Darwin，他说的八个字是：“物竟天择，适者生存”。


    有了这条主线轴，寒带为什么没有常绿树，三文鱼为什么要迁徙，大猩犣为什么不会绝经，这些问题就弄清楚了。


    人类再回过头来看自然界，看得是清清楚楚。宛如公式在手，再把环境变量套上去就可以了。


    如果把人娄文明粗略地分为“自然科学”和“社会科学”。


    那么自然科学皇冠上的宝珠，是物理学。他几乎是一切实用科学的基础。


    而社会科学的总轴，皇冠上的宝珠，是“经济学”。


    # 三）政治经济学


    学木界一直有一个词，叫做“经济学帝国主义”。


    意思就是经济学如此强横，以至于任何一个社会学科他都可以插上一手。凡事都可以用经济学解释。


    为什么人们会闯红灯，因为经济学。


    为什么印度要烧死寡妇，因为经济学。


    为什么伊斯兰不吃猪肉，因为经济学。


    为什么监狱里 Gay 的比例会大幅增加，还是因为经济学。


    经济学几乎解释了人类社会的方方面面，几乎每一个宗教，习俗，道德传统，饮食烹饪，家庭亲情，婚姻恋爱，几乎每一个角度都有经济学的解释。


    就好比“进化论”对于生物学的解释无所不在。


    在这个时候，“经济学”产生了一场质变。变成了“政治经济学”。


    因为经济学这件事，本身具有“大义”的名分。


    马克思曾经说过，生产关系要适应生产力的发展。生产关系的所有调整，关键要解放生产力。


    所以对于“最大生产力”这件事，本身就具有大义的名分。'
