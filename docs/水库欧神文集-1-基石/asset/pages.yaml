    正常情况下，无论一个人武功有多高。他的武斗“巅峰时刻”，只能保持6~8分钟。


    也就是你看世界顶级的拳击手决赛，第一个回合很精彩，你直拳我勾拳，你一个冲我闪避让。


    这种可以上“电视剪辑”级的漂亮对抗，最多只能维持6~8分钟。


    到第二个回合，二人还能打得很精彩。


    到第三个回合，基本就只剩半场了。


    从2.5回合开始，无论一个拳击手多么伟大，都是眼角流着血丝。木登登的，不跑也不跳。


    二个人动甄抱在一起，靠消耗体能来磨蹭着对方获胜。


