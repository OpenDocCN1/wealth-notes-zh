  md: '目前全球的趋势，是开发 “软性毒品”。其代表作是 Icy，K。

    这种东西，可以吸很多年。有着持续不断的购买力。


    它甚至还不会太损伤你的神经系统，使得你依然能上班，能赚钱。

    铅笔社在谈到 1910 年美国 “禁酒令” 时，曾说过，是什么打败了那些桀骜不驯的私酒贩子。

    并不是无私航事的警察们，而是 “酒类合法化” 后的甜酒生产。商人击败了商人。

    因为既然 “禁酒” 了。则你无论贩卖什么酒，都是违法的。


    同样偷运一卡车的禁酒。你是运啤酒，还是运最烈最烈的 Vodka。

    任何脑子正常的黑帮，都会贩伏特加。


    所以 “禁酒令” 之后，最先消失的是 “轻酒”。啤酒，果酒，气泡酒。

    整个市场迅速转为黑帮烈酒为主导。


    就好像国际贩毒组织，主要卖的是海洛因。哪怕二三年吸死一个也在所不惜。

    可是美国放开了 “禁酒令” 之后。


    消费者无疑更喜欢的，是轻口味的啤酒。而不是天天老白干。

    当正规的商家进入了酒类市场。“干旱劲爆” 的喜力，嘉士伯，青岛崂山。

    等等大品牌挟广告优势，煽情营销，迅速击败黑帮粗制滥造的劣酒。

    对于 “毒品市场”，它也遵循同样的道理。


    现在的 “地下市场”，使得毒贩们倾向于贩卖最烈，最难以戒除的烈性毒品。

    但是，一旦 “毒品合法化”，有几百家厂商公开叫卖各种致幻剂。

    则最终胜出的，一定是 “又便宜，又轻爽，对身体副作用小” 的产品。

    消费者也不是傻子。同样有爽三十年的，为什么要选爽三年的。

    以上就是 “铅笔社” 的观点。版权所有光荣的铅笔社，以及铅笔社诸多主笔老师。

    俺只不过是一个搬运工。


    铅笔社从经济上证明了 “毒品非法” 不如 “毒品合法化”。

