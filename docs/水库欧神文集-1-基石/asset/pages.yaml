    挥动翅膀。直上云端三千里，大鹏展翅九万里。


    # 五）统一市场


    中国在 1949 年之前，一直都是传统的中古“农业社会”。


    农田的本质特性，是地理上的分散性。


    因此中国大地上，星罗密布地分散了几十万个村庄。“牛家村，李家庄”，种植业土地的分散性，决定了人口的分散性。


    今年天猫的“11.11”促销。卖了 1682 亿。


    相比之下，11 月 26 日（上周五），是美国一年一次 Black Friday 超级大促销。


    美国人骄傲地宣布，营业额涨了+18%，达到 79 亿美金。


    简单计算一下，还不到 Tmall 30%嗲。


    有人问，为什么“美，日，欧”诸国，不也搞个 11.11，而让马云巴巴独领风骚。


    问题不是不想搞，而是没法搞。'
