  md: '10 元的外卖，居然是五个寝室，五碗粥“众筹”才买的。


    每个寝室门口都要等，师傅不高兴等了。


    接着，他们又在耐克鞋，网吧，女装店，足浴店等各方面，进行了亲切而恳谈的交流。最后得出结论：“活着真不容易”。


    山东滨州这个地方，就是一个“人力成本无限接近于零”的地方。


    因为赚钱机会太少了，Job 和产业太稀缺了。


    以至于任何服务业，都开展不了。卖餐饮，馒头论斤的。


    所有人都恨不得把“附加服务”统统割掉，改为亲力亲为。


    人力价值如此之便宜。整个城市的 GDP 也上不去。


    # ## 二） 香港


    接着，我又在香港住了一段时间。


    机场快线转港铁，铜锣湾出来的时候，照例总被“地铁广告”所吸引。


    放什么广告呢，佘诗曼的减肥广告，陈豪的生发广告，曾志伟的中药堂广告。这些都是千年雷打不动的。


    HK 的灯箱，做了一些技术升级。目前多了很多 Video，会动的视频。


    最主打畅销的，显然是《女儿国》和《黑豹》'
