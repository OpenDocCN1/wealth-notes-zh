  md: '因此滨州，也没有跨过“基础湿饱”。服务业 GDP 存在，但不可以计高价。


    # 二） 刷 GDP


    那么，怎么刷 GDP 呢。 “刷高” GDP 的关键，是要尽快跨过 “基础湿饱” 线。


    +   - 像上海，广州这样的城市，是本身经济实力发达。不知不觉，本地西餐日料捏脚逗鸟就有消费者了。


