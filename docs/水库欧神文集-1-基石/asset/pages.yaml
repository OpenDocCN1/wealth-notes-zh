  md: '心血来潮，我们来讲讲“吸毒”这个话题。

    展开分析中，前半段是抄铅笔社的。后半段是我原创的。


    # 二）禁毒战争


    2010 年，美国 7 名参议员联名提出议案。要求在全美范围内“毒品合法化”。

    考虑到全美国一共才 100 名参议员，这是一股惊人的势力。


    在嘲讽之前，我们先看看这一个基本事实；


    +   - 在欧美国家，一克毒品的售价大约是 2000 元人民币。

    - 成瘾者每天至少需要吸食 1 克毒品。

    - 每个月 60000 元，每年 12 万美元。

    - 在原产地，毒品的成本不到 20 元 RMB/克。


    让我们仔细观察一下这个数值。$120000/ 年，其实并不是一个很大的数字。

    在欧美上流社会，一个公开的秘蜜，大量的上流社会精英都在吸毒。

    几乎每一个时尚界，娱乐界，乃至新闻界的人都在吸毒。[1]


    因为他们负担得起。有钱人吸毒完全吸得起。12 万美元对于那些生活在蓝爵爵士风格中的贵族而言，无非是几瓶红酒的价格。他们也绝不会为了募集毒资不堪重负，走上犯罪的道路。

    当然更不会因为无法负担每年几十万 RMB，而卖房子卖儿卖女。搞得家破人亡。


    ![](img/f67be513638d053b62bd7b01d459b241_573_0.png)


    长期吸毒是无大碍的。美国上流社会的人很清楚这一点。

    因此构成了下一条政策的核心：


    毒品太贵了！'
