  md: '整个楼市的成交，完全没有置于“公众监督”之下。


    没有几千万双眼睛盯着，谁知道你有多少暗箱交易。


    在股市中，你很容易地看到买一，买二，买三，卖一，卖二，卖三。


    在楼市中，你完全不知道买家在哪里。买家愿意出多少的心理价位。不知道承接力度有多深。


    对于“技术分析派”，他们来到楼市，顿时感觉就绝望了。


    全部的信仰，圣经，精神支柱：K线图没有了。


    没有 MACD，没有 KDJ，没有钝化金叉十字星。


    一堆楼市 V，全部都是写文章的，连一个跑“大数据”的都没有。


    人家就是要刀片服务器，跑上几十兆瓦时，这个才能叫“高科技”嘛。


    综上所述，“技术分析派”痛斥楼市低端庸俗。


    他们趾高气扬地给了一个结论：“下九流”。


    连赌场都不如。


