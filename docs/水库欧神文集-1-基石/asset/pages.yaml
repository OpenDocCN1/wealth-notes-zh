- pgno: 527
  md: '# 二）日本人


    1840年 的时候，没有一个中国人怀疑，中国拥有全世界最好的制度。


    我们相信政治应该是这样的。忠君爱国，志士成仁。“学成文武艺，货于帝王家”。


    朝为田舍郎，暮登天子堂


    臣闻天下大义，当泯为一


    当1840年，中国人看待远洋船渡而来的英国人时，眼光是这样的，一群蛮夷。他们既奉行着错误的政治制度，又做着禽兽猪狗不如的行径。士大夫还没有商人有政治地位。如此倒行逆虐，又怎能长久？


    1840 年时，“完美”的中国人看待英国人时，是充满了挑错和鄙视的。其态度，就和《半泽直树》看待2013年的中国人差不多。


    什么，差不多？


    是的，在“完美”的日本人眼中，他们拥有着全世界“最好”的制度。严谨，求是，坚韧，忠诚，诚信、在五德俱全的日本人眼中，荒唐混乱的中国人简直浑身上下充满着错误。


    和身满虱子的不列颠海盗也没什么二样。


    好吧，那就让我们打得日本人满地找牙吧。


    # 三）国制之殇


    说到中国历史，一直有个二谜。


    一个谜是，工业革命为何未发生在中国。宋代之际，中国的生产力就已经远远超过欧洲。1750年之际，当英国开始制造蒸汽机，中国仍拥有比英国更好的技术和工人。


    第二个谜是，当工业革命传至亚洲时，中国的反应为何如此慢。


    在有国信中，日本是最幸运的。他们几乎在第一时间就摆脱了儒学的传统，“脱亚入欧”明治维新飞快地成为了世界工业强国。


    在所有国家中，学中国学得更象，其官僚系统最腐朽无可救药的垃圾娘炮国家，是韩国。可是棒子现在也腾飞了。


    只有中国，历经洋务运动，戊戌变法………换了四个政体三个政权，耗了140年，一直到一七六八改革开放，才稍微看见了一线巨大的曙光。


    为什么，为什么当时1840 年中国拥有全亚洲最好的人力资本，最多的受教育民众，最广泛的道路灌溉船坞等基础设施，最悠久的城市与乡绅自治传统，但是，最终中国却是最慢的一个。


    为什么，这是《半泽直树》们该说的话。


    # 四）完善


    我们的答案很简单，因为中国太“完善”。


    用历史教科书的说法，是“高度集中的中央集权”。中国的皇杖已经长得太大，太宽，无所不在。


    日本的西南夷，可以自地地和荷兰人做贸易。可以从荷兰进口武器，可以试点荷兰的社会管理体制改革，安装荷兰的机器。{注1}


    但在1840年的中国王朝，这些事是绝对不允许的。'
