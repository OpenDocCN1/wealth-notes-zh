  md: '# #书籍时代的消亡 #F1060


    原创2017-05-03yevon_ou水库论坛


    ![](img/f67be513638d053b62bd7b01d459b241_371_0.png)


    # 书籍时代的消亡 #F1060


    您的最后一本书籍


    # 一) 书籍


    BC700，佛祖时代的经文，被称之为《贝叶经》。是用针刻在贝树叶子上的。


    贝叶经极其容易损毁，携带也不方便。


    此后漫长的封建岁月，书籍的主要载体是：羊皮。


    虽然羊不算是很贵的动物，但数百张羊皮依然是很烧钱的。


    我们想说：“在古代，书籍是非常非常稀少的”。


    书籍稀少到怎样一种程度。中世纪欧洲，如果一个人写了一本书。


    那么他就把他的左手小指砍下来。


    用根绳子，挂在书的扉页上面。表示这样的书再也不会有。


    书比人更值钱。


    在《临高启明》里讲了一个段子。临高集团想要贿赂海南书院。


    送过去任何礼品，刘大震都是不会收的。


    但是临高集团，送的是一套现代印刷机印的《四书五经》。


    海南书院，虽然也号称书院。


    但是以一县之力，甚至连一套齐弃的《四书五经》都凑不出。书籍昂贵，纸张昂贵。更不要说精装版，便册版了。


    在《文明》系列游戏中，向来把“印刷术”列为一项非常重要的科技。


    活字印刷，造纸，指南针，火药，被誉为中国古代四大发明。


    这里面是非常非常有道理的。


    “造纸”的出现，使得竹简的成本一下子降了二个零。为大规模的识字和文化传播奠定了基础。


    而文字和吏治国家，则是一个辽阔帝国运转的枢石。


    可以说，没有刀笔吏，就没有大型帝国。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文章每月一更新……'
