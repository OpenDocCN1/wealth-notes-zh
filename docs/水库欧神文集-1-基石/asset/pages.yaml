- pgno: 752
  md: '他们的理由有四点：


    +   1) 股市有精确价格，楼市没有


    +   2) 股市有精确历史价格，楼市没有


    +   3) 股市有精确交易量，楼市没有


    +   4) 股市有精确挂牌量，楼市没有


    设想一下，今天（600519）贵州茅台的收盘价是 565，昨天是 568，前天是 572，这些都是清晰可查的。


    对于理工数学男，是极大的安慰。


    可是楼市不一样。楼市根本就没有“硬核”的估值算法。


    一套房子，受楼层，朝向，采光，景观影响很大，基本都是“一房一价”。评估公司即使给了报告，最低精度也要到万位数。


    而这个价格，也还是虚的。成交还要看买卖双方角力协商。


    绝不代表，下一场交易，就可以按照“市场价”成交。


    至于“历史交易数据”呢。抱歉，不仅不提供，而是很可能，是根本就没有！


    很多房子，从 20000/m 涨到 50000/m，它是一口气涨上去的。当中根本没有经过充分的换手。


    有些市中心的小区，几年几个月的交易都是空白的。零换手。


    除了价格上面的“透明度”，交易量数据也是不透明的。


    每个月，交易中心成交多少套，各自以什么价格成交。这些是不对公众披露的。


    哪怕你披露了，申报价格，也未必是真实成交价。'
