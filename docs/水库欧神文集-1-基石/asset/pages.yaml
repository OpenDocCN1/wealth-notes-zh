  md: '所以电影之中永恒的题材，永远都是“富家女爱上穷小子”。最棒的卖座片，永远都是“屌丝宅男成功记”。无论他包装得如何曲折，如何炫彩，如何高科技，哪怕高深如
    Avatar。对于电影公司而言，其实他并不关心艺术，也不关心文学，也不关心正义感；他唯一关心的，就是收视率。


    Discovery 频道，曾经花掉巨大的金钱，拍摄过一系列的科技片。但是总体而言，“严肃”题材的观众，只有娱乐节目的 1:100，无论是科学，法律，社会，政治，哲学。


    对于媒体而言，最有效的节目，永远是“综艺”节目。包括低级庸俗的喜乐逗笑，收视率爆棚，低成本低风险，赚到盆满钵满。


    而我们知道，这样下去，其实是有问题的。


    为什么，因为如果你整天看电视，整天相信“屌丝的逆袭”；整天相信富家小姐不会嫁给富家少爷，反而会为了“伟大的爱情”看上你。


    如果你整天相信，勤劳工作是立身之道。投机好高必遭恶果。相信世间总有公道，相信付出总有回报。相信老老实实上班，相信凭双手努力干活，相信八路打赢鬼子，相信善良终究战胜邪恶——恭喜你，你终将成为老黄牛，被屠宰的那种。


    欧洲在十八世纪，有一场非常伟大的事情，叫做“启蒙运动”。


    说的就是当时的欧洲人，本来是文盲愚蠢的农人。他们相信上帝，相信皇权，相信教会。相信贵族生来就是压迫他们的，相信自己就该做牛做马，服侍贵族和教廷一辈子。


    而“启蒙运动”的结果，是告诉这些老黄牛，这事是不对的。事情不是这样子的。人生而平等，谁也不该割削谁。这些贵族仗仗特权，欺凌剥削平民，其实人生而就该站起来，而不是跪着还心甘情愿。


    “启蒙运动”的结果，就是后来浩浩荡荡的大革命，和欧洲现代化。此为题外话，暂且不提。我们要说的是，其实现在我们冷眼旁观 FM99.0, FM97.7, 这何尝又不是一场“启蒙运动”呢。如果你看得懂的话。你会知道，FM99.0
    里面全部都是骗人。官员们肥头大耳，并不如他们传说中的爱民如子，勤政廉洁。


    而百姓们心怀怨恨，诸多不满。万税万税，绝不如 CCAV 上讲的一片祥和之气。


    另一方面，电影和电视，文艺和杂志，乃至于我们所接触到的任何一款媒体。如果你存一个心眼去看，去分析；你会觉得，其实大多数是骗你的。


    这个世界不是这样子的。职场里认真的小职员，并不一定会得到提升，更大的可能性，是被排挤，被炒鱿鱼。


    如果在现实生活中，你是一个白富美。那么你千万别爱上屌丝。关于“贫家少年志更坚”，这些电影小说都是骗你的。一般来说，越是贫穷的出身，人品越是卑劣。无数被骗女性前辈，已经用血泪验证了凤凰男。


    蓝晶有一篇很好的小说，叫做“子曰”。可惜网上只能搜到三章。


    如果你是一个富翁，你千万别相信“把财产捐掉回报社会”。这也是骗你的。诛心之术。当我们的政府征收你最高税率之后，他们还记得不满足。他们还试图给你洗脑，试图让你“自愿”地把钱交出来。千万别上当，具体的结果，看看“子曰”就知道了。


    说到中国的“启蒙运动”，当我们睁开眼睛，放眼四顾，其实我们就象“呈星 451”一样。'
