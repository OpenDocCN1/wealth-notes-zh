    # 任何一个能够用算法描述的事情，人类最终必将输给电脑。


    前两天我在京东买了一个“人工智能”的神器。只花了 9.5 元。

    他彻底秒掉了 99.9999999% 的人类。堪称 AI 界的绝对里程碑。


    ![](img/f67be513638d053b62bd7b01d459b241_347_0.png)


    人类进化了几万年的文明，曾经一度养活了几万人，几十万人的会计“书算”业。

    在这个神器面前溃不成军，一败涂地。


    我想说的是，各位目前对 AI 的成就和分析，偏离了一个基本的常识。


    +   - 你不能基于人类的视角，评论一项 AI 突破是否伟大。

