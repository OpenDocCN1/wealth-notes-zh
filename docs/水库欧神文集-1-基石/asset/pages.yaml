  md: '| 30%：致命的打击 | 财富本身 |

    | 10%：交易成本的上限 | 财富的迁徙 |

    | 1%：中间人费用 | 打理佣金 |

    | 0.1%：误差 | 精度之外 |

    | 0.01%：每一天的增值 | 小费 |


    在婺剧《玉蜻蜓》中，金大娘娘烧掉了三成家产。管家就坐不住了。


    因为 30%是一个槛。任何机构，一旦失去 30%，就很难补回元气。


    会导致永久性地，规模可见地，缩小。


    -30%是一个机构兴衰的征兆。


    10%是“交易成本”的极限。


    “交易”的本质，是 A 换成 B，财富并没有减少，只不过做了更好的配置。


    10%是资产“转移与迁徙”愿意接受的成本，是 R 的红利。


    10%也是很多“税制”制订的基础。例如十一税，销售税，离岸金融的实际所得税率。


    1%是中介的“数量级”。一两个百分点，请个中间人，或者 FA。


    中间人并不提供物质商品，仅仅进行信息和撮合。


    中间人 1%这个数量级，奠定了“现代服务业”，例如基金，投行，律师，中介等各行业收费范围。


    这类人必需要提供艰辛的服务，才可以分得一杯羹。不如 R。


    0.1%是误差。误差的意思，是你“不心疼”。


    如果问哪一个数量级你不心疼，清风随雨而过，那一般是 0.1%


    1000W 净资产，被窃遗失 1W。心疼三小时，到明天就好了。


