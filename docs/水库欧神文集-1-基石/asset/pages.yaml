  md: '# 一）一百倍


    水库论坛（Shuiqu.net）是什么，水库是一个职业炒房论坛。


    先别露出你眼中鄙视的眼光。这是职业屠丝的通病。


    “房虫” “房车串”，一连串社会蛀虫的词眼已经跳入到你脑海里。不务正业的严打对象，炒股才是人生正途光辉崇高灿烂。


    先别露出你眼中鄙视的眼光，我们先问你几个问题。


    全上海炒股的论坛，股市论坛有多少。少说也有上万个吧。


    可专业的炒房论坛，你知道几个。你知道一共有几个？


    炒股有多少门槛，炒房有多少门槛。知道炒房的启动资金需要多少么。为什么在你们猪一样的脑子里，居然会认为炒股的回报比炒楼高？


    在过去十五年中，事实已经以铁一样的耳光。掭了又掭。左边十七八记，右边十七八记。


    为什么你就打不醒呢！


    当2009年时，曾经发生过一场大争论。当时“楼市/股市”回报是10:1。


    讨论话题，未来的路会怎么走。


    有一群人士，他们就是不信邪。是泡沫总该破裂。价格就该回归价值。事物一定会回到他们熟悉的“正轨”上来。过去十年，就算是恶梦一场。只要明天炒房客都跳了楼，就当是恶梦没发生过算了吧。


    所以他们给出答案是，“股市涨十倍，楼市下跌”，二者比例回到1:1很不幸。他们可能是错的。“楼市/股市”的最终关系，很可能是在拉大十倍的基础上，再拉大十倍。达到100:1


    楼市200000/mm，股市二千点。炒股的人再被屠杀一回。


    如果说2015年除夕夜的今天，则目前比例是13:1


    # 二）下九流


    炒股的看不起炒楼的，这几乎已是目前社会的公论。


    炒股的看不起炒楼的，认为炒楼是下九流。认为那是土豪和温州大妈们干的事。平均文凭不会超过初中。


    而炒股是高大大的活，要牵涉到利率，汇率，宏观经济走向，货币政策，财政政策，美国QE，日本大选，印尼局势，中东地缘政治与原油供应……


    炒股的认为自己从事的是一项高大上的事业。是知识与学历的完美集合，是技术分析与哲学勇气的揉和。每当屠丝观测K线图时，激动得浑身发抖。似乎明天他就可以成为巴菲特索罗斯


    我们知道，胜利是建立在累累尸骨之上的。


    没有一个庞大的基数蠢货DS群体，又怎能建筑起炒楼客十倍百倍的资产爆炸。动辄10:1的回报率，远远踏足在金字塔顶端。


    事实的真相是，炒楼的才看不起炒股的。炒股的才是下九流。


    真相是冰冷的，残酷的，黑暗的。


    十八世纪时，欧洲曾有一场伟大的“启蒙运动”。当时欧洲人相信黑魔法，贵族封邑，君权神授。'
