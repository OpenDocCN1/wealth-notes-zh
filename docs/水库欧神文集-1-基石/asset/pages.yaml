  md: '俺摸着胸前的红领巾，心头热乎乎的，对呀。俺也受过义务教育了，俺是开化人了。


    这是一个巨大的大坑，大坑，大坑！！！


    一直到很多很多年以后，又遇上哥哥这样一个无可救药重度怀凝论着不可知论独立思考打破传统无框架无底线人士。


    许多多年以后我回想，才知道洗脑教育从一年级开始。从一开始就挖个坑把你埋了。


    为什么，因为这里面偷换了一个巨大的概念。


    # 产权的基础，在于事实。而不是产证。


    +   - 基于事实，则是民权。


    +   - 基于产证，相当于收归国有。


    你拥有这套房子，是因为这房子是你爷爷的爷爷，一路传下来的。事实正确无可撼动。


    而不是因为房产证上写着，你是户主。


    如果你笃信“产证决定产权”，事实上你把产权的判断，交给了国家。


    财产的所有权，由国家说了算。等同于国有化。


    “日本地券制”是一个埋线将近百年，深谋远虑的政治策略。


    +   - 在最初的时候，仅仅是田垦农间竖立一个登记处。


    +   - 渐渐地所有人都熟悉“房产证”。


    +   - 老一辈的人逐渐死去。


    +   - 年轻人从小经受“产证教育”。


    +   - 100 年以后，潜移默化“产权以产证为准”。


    深谋远虑啊，深谋远虑。


    五） 限购'
