  md: '也就是你还款一年以后，你可以向银行申请，写“申请报告”。


    恳请领导，把借款人由沈鵬和马丽，改为沈鵬一个人。


    这个时候，银行要“审批”。任何一个信贷员，都不会当面告诉你“可以改”。而是说 向领导申请。


    但其实这个批复的概率，是非常大的。


    对于银行来说，他存在风险。因为以前是沈鵬和马丽，10000+8000 的总收入。


    如果改为沈鵬一个人还款，则沈鵬必须达到 18000 的收入。


    否则就覆盖不了“月供额的二倍”。


    而沈鵬如果票房大卖，工资提升的话。这个要求，是可以满足的。


    具体怎么做，就不用我教你了。


    # 五）抵押权人的文字陷阱


    银行合同中另一处文字游戏，是“抵押权人”和“借款人”。


    请注意，这两个名词，是可以不同的。


    +   - 抵押权人，可以是沈鵬+马丽

    - 借款人，仅仅是沈鵬


    抵押权人，指的这套房子，产权是谁的。抵押权人即产权人。


    而借款人，谁问银行借钱。


    如果抵押权人和借款人，必须一致的话，你就必须离婚。把马丽的名字，从产证上面撤 除。变成：'
