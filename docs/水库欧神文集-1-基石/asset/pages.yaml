    争抢。这个战场污秽而又血腥，但你绝对不可以对此视而不见。我以前有一篇《有利益的地方，就有犯规》建议可以看一看。[1] 一旦你赚了钱，就一定有人不守规则。就一定有人想掀桌子重来，或者凭拳头说话。与其斯斯文文地和人家讲道理，受欺负被掠夺，你不如：A)
