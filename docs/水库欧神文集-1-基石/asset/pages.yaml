  md: '# 如果让我来主持教育改革，


    # 我会把所有的课时，


    # 全部都改成考试。


    对的，一个学期 20 周。20 周全都是考试。一堂课也不上。


    孩子，我知道你委屈。


    别哭，别哭。


    家对面新开了一家教育机构，举行砸蛋抽奖活动。


    有个小孩砸了一个特等奖，主持人大声的说岀特等奖的奖品，一年的免费课程。


    本来好心 的孩子当场就哭了，底下的孩子拉着家长就走，没一分钟，一半人都走没了。


