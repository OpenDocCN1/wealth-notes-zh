  md: '第三重的能力，是“补救”的能力。


    我现在也不不过在您的作业本上，画一个微不足道的小叉。


    可是即使我画个大叉，把作业本涂抹。哪怕把作业本撕得粉碎。


    天就塌下来了么，值得你对你父亲大吼大叫么。


    没事的。我们做最坏的打算，哪怕我把你的作业本撕成粉碎，蝴蝶状片片飞散在空中。


    最坏的恶果，也无非家长写一篇“情况说明书”。说作业被家里的狗咬碎了，无法恢复云云。


    值得惧怕嘛，芝麻都不算。屁大点的事。


    第三重的能力，是“寻求补救”的能力。


    作业如果被污染。你首先要想的，应该是“解决问题”的方法。寻找怎样的借口，甚至捏造一个说法，让老师信服。


    实在不行，可以让老师打电话给爸爸嘛。


    学会了这三项能力，你才是一个厉害的人。


    # 四）白左


