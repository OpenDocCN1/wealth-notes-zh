  md: '# 一） 法规


    【法释〔2011〕18】是一部 2011 年的文件，迄今已有七年的历史。


    这么多年来，大家相安无事。运行平稳也很好。


    因此周二有人问了我一个问题：


    > “房贷每月 6000，还了 36 个月，请问女方应该拿多少钱走”


    我毫不犹豫回答说：


    +   - 首先，他这个是 20 年期贷款，利息约三分之二。利息 4000 元，本金占 2000 元。

    - 36 个月，“本金”减少了 72000

    - 女方分一半


    其中，每个月 4000 元“利息”是扔在水里的。


    但我们可以想，女方本来也要租房子。一个月 2000，房租也是要。


    你现在住 LG 家里。碗房东改为了碗银行，“利息”和“房租”就相互抵消了。


    而“本金”部分，是实打实还进去的。


    你本来欠银行 84W，现在就只欠 77W 了。净资产多了 72000 元。


    这部分应该和女方平摊。


    虽然具体金额小数点需要再算算。但大致意思思略也就这样了。


    想不到，重庆 MM 无比彪悍，她举出来了一个新公式：


    # 赔偿金=


    （本金偿还额 / 房屋原价）*房屋现价'
