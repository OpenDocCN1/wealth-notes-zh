- pgno: 334
  md: '所有的交易都是好事。甲方乙方都得益了。


    可是，你们确定那是你们的东西么。你们有权力交易么？！


    如图中，祈襄的那个留言。


    对于“交易”，有比交易更加底层的东西。就是“产权”。


    你确定你有处置的权力么。


    好比一幢历史保护建筑。你有房产证，可是你不能交易。


    “文物保护协会”会要求你不许卖给外国人。不许改建和经营酒店。


    这事怎么说。


    # 二) 有限产权


    对于这条留言，昨天我想了整整一夜。事情并不复杂，复杂的是怎样穿针引线，把整件事情说清楚。


    我们先从最简单的开始。


    在电视连续剧《创世纪》中，叶荣添的第三笔生意，是拍卖了一块土地。


    之前二单生意，叶荣添凭借着巨大的冒险和激进的手法获得了成功。一跃从一个穷国二年轻人，变成了小有身家的地产老板。


    可是第三笔生意，叶荣添赔了。


    赔得干干净净，输光了倾家荡产。


    那块地很好。地段不错，价格也便宜。


    唯一的问题，叶荣添太心急毛躁了。他没有看清楚一行小字。


    原本的业主，他的妻子葬于了海边。


    业主思念妻子。虽然他迫于财务压力把土地出让，可是他留了一条附加条款。


    > 任何地上建筑，不能遮挡遥望妻子的视线


    那个业主住在山上的小屋子里面。而他妻子的坟墓在海边。


    二者连线，留给建筑物的高度层就有限。


    想要不遮挡视线的话，最多只能建 8 层的小屋。


    而叶荣添原本的计划，是要建 30 层的高楼。这样才能大赚赚回本钱。


    于是叶荣添破产了，抛下女主角一个人去街角卖盒饭。


    过上了一段潦倒的日子。


    这个故事告诉我们的是，世界上存在一种“部分产权”。


    好比我拍卖这块地给你。其实你并不是 100%为所欲为的，还有“附加条款”。


    “附加条款”在商业上是很常见的。


    如国内的网游公司，代理韩国的网游。往往都会加上“附加条款”，不可以修改游戏中的道具，不可以增设自己绘制的 NPC。


    中国进口苏联的 Su-27 发动机，则是写着“仿制可以，禁止出口”。'
