- pgno: 436
  md: '凭借着卖枪炮的收入，几乎每一个欧洲人，跑到中国来，都是老爷。


    电影里拍摄的永远是洋房，公馆，别墅，大草坪，佣人和管家，银质餐具，高档生活。


    其实 1861 年英国还处于“零都孤儿”。论生活水平的差距，远远没有超出大清的地主错钟。


    当滨州遇见香港，我们也犯的是同样的错误。


    +   - 在滨州，物值钱，人力不值钱。


    +   - 在香港(经历了工业革命，商业革命)。人值钱，物不值钱。


    当我们把滨州和香港进行比较时，其实我们是把我们最值钱的东西，去和别人最不值钱的东西作比较。因此得出了一个远远高估的香港真实实力。


    现行的 GDP 计量方法，存在很大的缺陷。


    他的等价基石，是“可贸易商品”。在统计口径的选择中，又可以选择了一些“囤计民生”的东西。确切来说，就是食品和能源的比重太大。


    人力和人心的比重太低。


    如果遇见 100：10：1：0.1：0.01 的情况，就会发生非常吃亏的算法。


    # 四） 结语


    1997 年时，香港的 GDP 高达整个中国大陆的 20%。


    可是国际上公认，中国是一个大国。香港是一个弹丸之地，连相提并论的资格都没有。


    国际上的“一流政治家”是正确的。有些指标看似强大，其实却并不强大。'
