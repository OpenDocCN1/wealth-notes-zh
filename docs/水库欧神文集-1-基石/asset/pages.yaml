    # ## 荷兰效应 #F1570


    本篇为经济学科普。


    ![](img/f67be513638d053b62bd7b01d459b241_447_2.png)


    **荷兰病_百度百科**


    荷兰病 (the Dutch disease) ，是指一国(特别是中小国家)经济的某一初级产品部门异常繁荣而导致其他部门的衰落的现象。20世纪80年代，已是制成品出口主要国家的荷兰发现大量...


    产生 历史 后果 中国现状


    baike.baidu.com/ ↗


    # 一、 荷兰效应


    前两天我在山海关的高铁上，翻着宁南山写的《希望与危机——东北经济的未来十年》，实在是颇有有趣。'
  merge: -1
  img_proc: true
- pgno: 448
  md: '为了讲清楚我们今天的概念，首先我们要讲另一个故事。远在大西洋一岸的马车夫小国：荷兰


    荷兰，以其著名的“荷兰病”闻名欧洲。经济学科班学生，几乎耳熟能详。


    ![](img/f67be513638d053b62bd7b01d459b241_448_0.png)


    欧洲西北角，称之为“北海”。在国际法上，属于英国（苏格兰），荷兰，挪威三国共有。


    1959年，在北海意外地发现了：格罗宁根气田(Groningen)


    在此之前，整个欧洲大陆被认为是贫穷国。全欧洲，只有罗马尼亚有一点点少得可怜的石油矿井。


    当年希特勒为了区区 1000 万吨石油产量，战略重心极大倾斜。非得横穿匈牙利、南斯拉夫，拿下罗马尼亚。'
  merge: -1
  img_proc: true
- pgno: 449
  md: '![](img/f67be513638d053b62bd7b01d459b241_449_0.png)


    就是因为全欧洲都没油。一旦英国实行海运封锁，他连飞机坦克都发动不起来。因此重兵固 积边远之地，实在情非得已。


    可是在 1959 年，荷兰意外地发现近海就有石油，距离欧洲主要工业国超级近，政治军事安全， 产油量最高达到 1 亿吨/年，是罗马尼亚十倍。岂不令人喜出望外。


    直到今天，2016 年苏格兰独立公投，独立派一个重大的理由，是脱欧之后可以“独享”北海油田。


    挪威福利富甲天下，靠的也是 500 万人独霸 1/3 油田。


    荷兰是第一个发现油田，也是第一个开采的。其直接结果，就是 SHELL 皇家壳牌石油公司的 兴起。


    借着 1970 年代“石油危机”油价暴涨，着实发了一笔横财。


    可是“横财”对于荷兰这个国家，是不是好事呢。'
