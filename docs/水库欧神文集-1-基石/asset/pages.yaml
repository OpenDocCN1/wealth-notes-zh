- pgno: 392
  md: '押金 10 元，占 500 元的 2%  假设一半的人不退押金，直接扔垃圾桶。商家收获又是 1%


    # 4) 遗失损耗


    第四个损耗，才是大头。即“遗失损耗”。

    薛兆丰曾经有一道题目。“你有 10 元人民币，想分给尽量多的人。请问如何操作最省时省力”

    答案是：“烧掉”

    市面上流通的货币少了，自然每一个人手里现金都升值。

    **对于商家而言，他是“逆向”的。每一张 Smartpass 卡的遗失，对商家来说都是净收入。**

    我们永远有“磕磕碰碰”遗失的东西，很有可能哪张卡掉在门缝里，就再也找不到。

    剩下三四十元余额，卡被折断了。

    老太太塞来红利。

    贪官被抓。几千张卡泯灭在历史长河里。

    商家卖给你面值是 500，可是实际是用不足 500 的。

    谁知道你埋在地底下，藏在夹缝里，卡车翻车沉船掉海。

    只要是有价票据，你不去提现，就是商家赚了。

    “票据业”极大的一块利润，来自于遗失。

    在历史上，欧洲有许多家银行，纯粹是靠“遗弃”起家的。

    你在银行开了一个秘密户口，存了很多现金有价证券。承诺凭印信来取。

    可是此后这户人家可能就绝嗣了，可能就没有继承人了。

    毒枭被枪毙了。

    哪怕是平民家庭，你父母的转折，你确认每一家银行都知道？

    对外，银行可以宣称，他们是完美无瑕的声誉。

    哪怕 150 年以后，只要有人拿到印章，找到遗失的密码，一样可以打开银行秘密的账户。

    而在实际情况中，这笔钱相当于永远也不要还了。

    “遗失”的金额巨大。我个人估计，至少 1%不止。


    # 5) 避税


    顺便说一句，如果你单单看 Smartpass 的财报，他的赢利是不高的。每年也就几亿的样子。

    但是这个公司非常值钱，完全不可以以利润来计算。

    **因为“遗失”所造成的“隐性收入”，是完全不体现在资产负债表上的。**

    在资产负债表上，它永远是“预付款”。

    如果卖掉了 100 万张，就是 5 亿元的“预付款”。

    从会计上讲，这是欠客户的钱。

    只要客户拿 Smartpass 去消费，账单就会雪花片般的飞过来。这钱是要花出去的。

    依财务审慎原理，不可以确立为利润。

    而在实际操作中呢，1%的卡片是永久遗失，1%的押金是永久荒废，0.5%的余额是永久废弃的。

    这笔钱是再也不会有债主，再也不会有人向你索要的。

    管理层对这个“统计概率”现状心知肚明。

    但是谁也不会捅破。'
