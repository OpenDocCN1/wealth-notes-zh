    在老派人士眼里，他们是有一个**市场**的概念。而市场的容量，总是“计划”的。例如中国的女装市场，洗发水市场，冰淇淋市场。


    市场的“容量”是有限的。各大商家，现在已经有得你死我活。份额增加 1% 都非常困难。


    “京沪”想要获取进一步的增长幅度，绝无可能。


