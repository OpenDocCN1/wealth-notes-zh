  md: '我常说父母的高度，决定了孩子的高度。父母本身就是白痴，他策划出来的学习计划，自然只能是损伤脑子，生产白痴出来。


    站的高度不同，看问题角度自然不同。当“牛魔王”还在绞尽脑汁研究学区房攻略时，真正有文化的父母，其实考虑的已经是“毒教育”问题。


    为什么，因为送孩子去学校。就等于推孩子入火坑。


    孩子进了学校，第一件事就是泯灭天真好奇心，第二件事则是灌输马克思主义，第三件事是老师的权威和服从。


    俺家闺女犯着用得着，成为你名校“升学率”的一分么。俺家闺女多么金贵，我都舍不得打一分骂一分，难道就成为你这个瘪三老师的考核垫脚石？


    如果不是为了有一个政府承认的文凭，我甚至根本不想让子女进入正轨官方学途。


    对于我们这样的家长，最关心的真正是“毒教育”问题。我的女儿在我的培养下，充满了友善心和好奇心。对未知的世界充满了探索，却又不乏勇气。


    当我送孩子去读书时，我最重视的，是她是否仍能保持这一份纯真。小学的唯一目的，就是多认识结交一些小朋友。任何具体的知识和习题我都不需要她学习。


    而官方学校最令人不能忍受的，是从小灌输“马克思主义”，不分是非，不懂得尊重和合作，只教仇恨和抢夺。学业则多是背诵和刻苦。我的一个小侄女，已经对学校充满了刻骨的阶级仇恨。


    当属品们还在研究“学区房”的时候，上属人物其实更关心的是“毒教育”问题。如果你问我教育最核心的理念是什么，我说是“觉醒”。


