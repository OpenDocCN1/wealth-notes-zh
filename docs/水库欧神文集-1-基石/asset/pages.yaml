  md: '# 比交易更底层的东西 #F780


    2016-12-10yevon_ou水库论坛


    ![](img/f67be513638d053b62bd7b01d459b241_333_0.png)


    # 比交易更底层的东西 #F780


    本文为《交易》第四篇


    dT>0，所有的交易都是好事。


    等等等等，朋友，这是你的东西么！


    一）产权


    前天写完《交易》系列三篇。在所有的评论留言中，唯有一条，让我想了 20 分钟。


    高亮了，但没有回复。


    因为这个道理很复杂。要说清楚不容易。


    ![](img/f67be513638d053b62bd7b01d459b241_333_1.png)


    《交易》三篇发出之后，知乎那个蠢货，又跟着流窜到了水库。发了一个长贴。[1]


    那个帖子很热，短短的半天，就盖了 300 多楼。其中超过千字的回复接近 50 条。


    那个楼主本身不值一晒，初中高小文化水平。主贴又臭又长看得很累。


    精彩回复都在回帖中，水库大神轮番上场，把他扁得象猪头一样。


    可是，对方还是不服。


    不服，不服，就不服。


    不服的原因，他憋了一口气。可是却表达不出来。


    我知道他的意思。他思绪混乱，我可以帮他表达出来。'
