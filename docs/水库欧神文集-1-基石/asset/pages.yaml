  md: '消费税” 40%


    消费税的惩罚极重。价内 40%，意味着卖 100W，工厂只能拿到 60 万。

    而如果厂家要“净到手” 100 万，那至少得卖 166 万。可见税负极重，一倍就翻上去了。


    然后兰博基尼又是“进口”车。进口再加关税。最后还有一系列的进口代理牌照，4S 销售牌照，汽车金融牌照等稀缺资源。

    这些我也没有精算。一般业内惯例，毛估都是二点五倍。

    一辆 100W 元意大利的进口车，到中国良心价，经销商不赚黑心钱，都卖你 250 万。


    这样的话，就回到了我们最初的问题。一名 Lamborghini 工程师，要工作多少年才能买一辆兰博基尼？

    250/54

    答案是：五辆


    他如果按照正正规规的企业化运营，把兰博基尼到市场上卖了，然后分红拿到工资。

    然后用工资去市场上买消费税购置税税后的 Lamborghini。

    那么他平均卖掉 5 辆，才能从市场上买回一辆。


    # 三）分析


    兰博基尼是一个很极端的例子。一般市场上，销售端征收的税率没有三倍这么高。但是其实也不低。


    就全社会总体而言，“一个生产 iPhone 的工程师买一台爱疯需要多少年”。这个答案应该介于 2~5 倍之间。


    也就是说，我们的政府其实是极端疯狂的，敛财的，贪婪的。

    我们常听说，“煤矿工人买不起煤”，“造房子的买不起房子”，“绞罗绸缎不是织衣人”。


    但原因，你的收入被政府割刹了大头。你所生产，所创造的财富，最终归到你手的，连四成都不到。

    我们看到很多高学历的码农，读名牌小学，名牌中学，名牌大学，名牌幼儿园。


    拼中考，拼会考，拼英语，拼奥数，拼升学，拼排队。可最终他们如此辛苦地读出来，再加六七年工作经验，拿 30W 的年薪。日子却过得象狗一样。


