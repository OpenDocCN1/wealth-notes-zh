    # 究竟谁在投机 #1980


    根据 2011-02-16 旧贴《究竟谁在投机》改写。


    一）前言


    二天前，有人塞给我一篇帖子《一位地产高管的2018年朋友圈》。这是一个很烂的高管，遇事瘆昧不明。哪家地产高层请了他，估计会战略决策失误。'
