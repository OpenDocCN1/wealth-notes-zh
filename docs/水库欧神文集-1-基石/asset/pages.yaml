    # ## 与无政资谭叔的对答 #F580


    延续文数: 《经济学第二定律》#72


    《经济学第三定律》#75


    谭：听到欧坤在文章中点了我的名字和批评无政府反对政府垄断暴力的理论，我来说一下。


    其实上面的群友已经反驳了很多欧坤的观点。我只是重复一下。


    欧坤的文章对无政资的理解有很多错误。上面群友都提到无政府并不是建立一个完全无抢劫的社会。如果是要建立一个完美无抢劫社会，无政资根本不需要保留私人警察和私人法律。


    这一点上面群友已经说过。但可惜欧坤对无政资的批评完全基于这一点。结果欧坤自己创造了一个“纯情如小白兔，从来没有恶人和坏人”的“无政资社会”来批判。可惜欧坤这个“神仙无政资”和无政资理论完全无关。欧坤只批了一个他自己创造的稻草人。非常可惜。


    A：请问，怎样建立“完美无抢劫”社会。


    无暴力，即意味着100%的市场化。即生产力的最大化，完美社会。


    这个目标我想破了脑袋也达不到。终极政体。


    法律可以不需要。社会可以分散为100000个“游牧民族”般的社团。彼此间靠外贸而联系。从而没有统一的联邦法。


    警察也可以不需要。如果你分散到100000个“游牧民族”。每一个族团就是一个大家庭。


