    # 为什么亏损而不倒闭 #F670


    教科书错了。亏损就不应该倒闭。


    # 一）教科书


    对于俺这样“无可救药的怀疑论重度患者晚婚末期”，哥哥对于任何道理，都喜欢再想一想。


    究竟是不是这样的，是不是共产主义的教科书在骗我。


    昨天吃瓜的时候，突然想到“亏损而不倒闭”的灵感。于是今天我们写一篇。


    “亏损而不倒闭”是一个大问题。


    按照正统的经济学界说法，“利润”是调节稀缺度的按钮。


    假设一个企业大规模亏损，它就应该破产。


    假如一个行业大规模亏损，它就应该削减产能。炼钢铁的改卖盒饭去。


    众所周知，2015~2016中国经济面临了非常大的“下滑”。非常大的困难。


    在这一场艰难的“产业结构调整”中，各位经济学家给出了药方。无非是市场化配置资源，


    追逐投资回报率，引导高新技术发展。


    但是，这些“国策”的见效效果似乎不大。


    一方面，地方政府对于“削减”产能。是一百万个不愿意的。


    俗话说，一家钢厂养活一个城市。钢铁业再怎么亏损，它是利税大户。一间钢厂动辄几万名


    工。加上家属和附带衣食住行消费服务业，立刻就撑起来了一个中型城市。


    同样道理，水泥行业的拥挤情况更严重。但是水泥同样是耗能耗电大户，一家水泥厂带动了


    电厂炭厂上下游无数中小企业。地方政府哪怕你年年亏着，也指望你一輩子办下去。'
