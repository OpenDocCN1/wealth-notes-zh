  md: '# 三) 合规


    美国人，事实上从 1980 年代，就开始有这个问题了。所谓“金融市场和实体不一致”。


    在以前，“货币政策”是高度有效的。中央银行只要降低利率。过几个月，就可以看见煤爰烟囱爰隆隆闹起来了，到处都充满了大兴土木的建设。


    可是 1980 年以后，“金融和实体”逐渐切断了联系。


    美联储储“降息”的效力越来越小。“加息”被誉为核武器，渐渐也只对金融市场有效果，实体僵尸般麻木。


    这里面的秘密何在，二个字：“合规”。


    美联储对于“贷款用途”管制越来越苛刻。


    在最初的时候，“借贷”关系是如此地简单。只要一个人肯借，一个人肯贷，二者即可自由形成契约。


    渐渐地，借贷关系被要求是“正义”的。


    1907 年美国爆发金融危机，议员们围攻“J.P.摩根”，议员们要求每一笔贷款都必须是“正义”的。


    换言之，所有的贷款，只能发放给“做多的”，不能发放给“恶意做空”的。


    J.P.摩根正面回答，“不，先生，信贷的唯一标准是偿还信用”。


    这是人类历史上，最后一次大金融家对政客提出了 Say NO.


    1930 年之后，美国政府对于“信贷”的要求，变得越发复杂。'
