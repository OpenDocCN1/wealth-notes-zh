  md: '二）谁的公平


    公平，什么公平，谁的公平？！


    每一次我在舆论媒体上，听见无良小编高擎着 “公平，正义” 的大旗。我就觉得好笑。


    公平，什么公平，谁的公平。


    当那些人声嘶力竭地喊着，想要追求所谓的“公平”时，其实他们并不是\*\*真\*\*公平。而仅仅是他们个人的“政治主张”。


    其私心程度，如果完全顺着 LikeWater 先生的思路走下去，最后就是“32\~33 岁，脸颇旁长着大黑痣”的人拿到最多的姜饼。分得最多的蛋糕。


    这是公平么，我不这样认为。


    \*\*我觉得一点也不公平。\*\*


    同样道理，你把思路衍射下去。如果政府兴建很多“经济适用房”。分给屌丝和无房者们住。


    你觉得这是公平的制度么。


    还是你的屁股赞同？


    三）谁的公平


    所谓公平，既不是偏袒你，也不是偏袒我。


    虽然我们并不想讨论哲学问题。但有一点是显而易见的，一定要“大家”都认可的，才是真公平。


    如果一方面满意，一方面愤怒。那不是公平，那是抢劫。


    那么，什么是“真公平”呢。幸好这个问题是有解的。而不是一个假大空问题。


    人类在长期生产社会实践中，逐渐掌握出一套互相相处的规范。譬如不能偷盗，不能抢劫，不能欺诈。


    无论是怎样的民族，怎样的宗教，怎样的社会历史，有一些共同点是不会变的。都是“劝人为善”的。这样的一套准则，就是社会规范。


    哪怕有一些逆历史潮流而动的规定，最终都是熬不下去的。因为“生产力发展”是一股大趋势。他迟早会打破一切不适合生产力的模式。


    所以，最终形成留下来的“社会规范”，必然是最大释放生产力的。


    “最有效率”的，必然最终就是全社会奉行的。


    最有效率的，最终就是所有人都共同认可的。生产力极大释放的。


    最有效率的，就是最公平的。


    “公平和效率”，本来就是同义词。最有效率的，就是最公平的。


    最公平的，就是最有效率的。否则我们何必追求公平。


    四）装睡的人


    最公平的，就是最有效率的。最有效率的，就是最公平的。


    公平和效率，本来就是同义词。


    所有的人都点头认可。可是他们一转身，出了这个门，不妨碍他们又滔滔不绝地谈论“公平与效率”的矛盾。


    好像不给钱分他们一点，就是大得不得了的矛盾，矛盾得气场都扭曲了。'
