  md: '关于“裸条”裸贷的分析，其实我们不用另列一篇。我们只需要翻翻旧文，翻翻当年的分析。当年铅笔社关于“高利贷”的分析。在传统意义上，“高利贷”是被人口诛笔伐，骂得丧尽天良的。在传统的左翼文学中，高利贷商人都是脚底流脓的坏人。导致了农村无数的倾家荡产，杨白劳黄世仁刻骨的阶级仇恨。


    但是现代的“经济学”研究，完全不是这么一回事。经济学的基础，是dT>0，一切交易和合作都是好事。


    对于高利贷来说，他本身是一笔“交易”。对于全社会当然是巨大的好事，巨大的慈善。一个人来借高利贷，他当然也知道“九出十三归”的苛刻条款，知道利滚利的惊人利率。但是他为什么要来借呢。是因为蠢，智商不够数学不好么。不是的，农民的狡诈与残忍，远远超出你的想象。


    高利贷之所以有“客户”。当然是客户充分“权衡权衡”之后，才作出的理性选择。你又不是拿枪逼着杨白劳进黄世仁的房里。借高利贷的人，往往是春播之后，青黄不接那最困难的二三个月。你不借钱，你直接就饿死。你借了钱，至少可以熬到明年的夏收。


    而另外一方面，农民是极其“狡诈残忍”的。放高利贷的人，从来都是收不足款的。所谓100%的还款率，无非是圆脖北大新青年坐在炉子前的幻想。玩失踪，人间蒸发，死赖着不还钱，泼妇满地打滚，这些事才是“高利贷行业”的常态。只不过圣母婊的文学记者，从来不会把这些残酷的历史真相写进教科书。


    前一阵子，银行组织学习样板戏《白毛女》。财上海不无讽刺地说，“请中农工建四大行长看完之后，回来写写感受”。在微信中，可以看一篇文章《借贷最底层调查：千万个老赖与催收队博弈，一场没有赢家的战争》[S3]
