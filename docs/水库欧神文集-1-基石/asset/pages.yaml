- pgno: 163
  md: '在我看来，传统的米塞斯，罗斯巴德，对于“存款准备金”制度的抨击，并不正确。


    国内“田园奥派”的演绎，更是谬误千里。


    因为这是一个很大的话题，要解释清楚不容易。


    值得我们单独列写一篇。


    # 一）成本


    很久很久以前，我在思考一个问题。“成本”究竟是什么。


    好比我现在打字的这部笔记本电脑。售价 1199 元。它由十一个组件构成，CPU，主板，内存，硬盘，显示器，电源………


    如果一个消费者“刨根问底”。他会回答，笔记本电脑的成本=11 个零部件之和+商家的利润。


    商家的利润这一块，包括组装，广告，运输，展示，行政，税金，质保等等。你可以视为全部都是人力成本。没有物料成本。


    好了，我们接下去再考虑，这个显示屏的“成本”是什么。


    显示屏也由几十个原件组成。大头可能是那块液晶，再加一点附属电路。


    显示屏厂家外购了“液晶”，其他是人力成本。


    我们接着再考虑，“液晶”的成本是什么。液晶就是 14nm 技术，生产的一块晶圆。其他是液晶公司的管理和人力成本。


    “晶圆”的成本是什么。是沙子。你去野外随便搁一把。不要钱。


    我们层层拆解，最后得出的结论是什么：


    **所有的成本，都是人力成本！**'
