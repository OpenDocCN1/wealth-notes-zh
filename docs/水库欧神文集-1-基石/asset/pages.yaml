- pgno: 194
  md: '或许有人问，那么，为什么不能杜绝“搭便车”现象呢。


    搭便车是否严重损伤了我们的生产力。


    譬如说，你说英国灯塔的“收费率”是 50%，可是它为什么不是 100% 呢。


    如果是 100%，岂不是可以造更多的灯塔。


    如果 MS Windows 收齐每一份盗版费用，岂不是可以开发出更好的软件。


    如果《知识产权》得到完美的保护，那么我们的生产力，一定可以大大地再向前一步。


    ![](img/f67be513638d053b62bd7b01d459b241_194_0.png)


    这段话逻辑的错误，更早在《“信息不对称”是伪科学》#F750 一文，已经完美地辩解了。


    “田园教派”总是希望我们这个世界是透明的。所有的商家和消费者，可以拥有同等数量、质量、无死角、无隐藏的信息。


    如果可以做到“信息全明”，一定可以大大推进我们的生产力。


    但当年水犀说，这是不对的。


    “地图”不是明的。“开地图”是要钱的。


    “信息”本身是一种商品。是一种付费制造的商品。'
