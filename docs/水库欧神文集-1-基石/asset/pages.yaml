  md: '经济学是非常符合道家思想的。有“阴阳”，当阳的力量增长时，阴的力量也在增长。洋货越是“倾销”。中国的汇率就会降低。中国的竞争力就会增强。手工艺人越是“破产”，手工业人的工资越低。则手工制品VS机械制品的竞争力更强。最终比洋货更畅销。翻翻经济学书的话，这是入门级最简单“比较优势”原理。


    前一阵子有人问我，上海的成本这么高，工厂纷纷迁到江苏安徽等地去了。你怎么看。我回答说，“让他迁啊”。对方大惊，“这不是空心化么”。我说：“迁出去以后，江苏安徽的地价人力成本就会上升，而上海的成本物价会降低”。“只要这种行为进行到一定程度”；“江苏的成本就会比上海更高。工厂再迁回上海”。所以呢，洋货无论再怎么“倾销”。他永远无法打败土货的。没有任何一个国家会因为贸易而破产。dT\O除了一点点的情绪异常。


    # 四）欲望


    情绪异常，那是什么东西？


    我们想象一个正常国家：“美国货又涨价了，10美金=10000人民币”。


    “唉，那个剃须刀真是好，可实在买不起了”。


    “咱还是买国产剃须刀吧，京东价 199”。


    文艺国家。“美国货又涨价了，10美金=10000人民币”。


    “唉，那个剃须刀真是好，可实在买不起了”。


    “买不起也要买。省吃俭用凑钱去买”


    2B 国家。“美国货又涨价了，10美金=10000人民币”。


    “唉，那个剃须刀真是好，可实在买不起了”。


    “打倒美国帝国主义，兄弟们去抢了美国人的仓库”！


    真正会让一个国家崩盘的，是“超出自身能力的消费”。


    好比18 世纪的中国，是一个贫穷落后的农业国。


    象咸丰朝一样，老百姓没什么见识，也没什么技术。


    现在，突然涌进来了“青霉素”。但是很贵，要100两白银一支。


    老百姓眼睛一亮，这玩意可是好东西啊。能救人命啊。


    在18 世纪抗生素没滥用的年代，青霉素就是大杀器。任何细菌感染，一针见效。


    可见，“清关贸易”刚建立时，对青霉素的需求是巨大的。


    人人都怕死，谁不想多活二年呢。


    最初的时候，我们是“正常国家”。用自己的大米和瓷器出口，去换青霉素。


    可如果青霉素需求巨大，进口量超过了出口量。


    渐渐地，中国人买不起青霉素了。'
