  md: '吸毒的社会性危害，其危害“外溢”不在于对人体本身的摧残。

    毒品危害的主要原因，在于毒品太贵。

    如果你每天吸一克的话，哪怕在中国云南等比较靠近边境的地方。也要近千元费用。

    一个月好几万，一年好几十万。

    考虑到吸毒的人群众大，许多都是社会中下阶层。

    所以吸毒很容易吸到倾家荡产。而接着发生的人伦惨剧，都是为了贩毒赚钱。


    这件事情的讽刺之处在于，**商品卖得那么贵，都是由消费者付款的。**

    因为政府一而再，再而三的扫毒。毒品价格才会那么贵。差不多比原材料产地贵了 100 倍的样子。

    我们知道，商业社会，任何成本最终都是由消费者买单的。

    吸毒的一年花上几十万，一克毒品八百元。纯粹是由政府搞出来的。

    所以美国七位“务实”的参议员，乘着美利坚大陆没有历史包袱的精神，大胆地提出了“毒品合法化”。

    毒品合法化，美国政府就是最大的毒贩。直接从金三角进货。

    鸦片这个行业，基本符合“每过一道海关，涨 300% 价格”的规律。

    在金三角老巢，罂粟并不贵。大约只有 20 元/克粗制品。金三角的农民，也从来没有任何人靠种植罂粟而成为富豪。


    “七位参议员”提出的方案是，跳过中间人，直接从金三角进货。

    甚至可以说，种植罂粟也不是什么技术活，直接在美国国内种好了。

    这样做的结果，是“毒品”的价格，从每克$300 美金，一路猛跌到$3 美金。跌掉 100 倍价格。

    “吸毒家庭”的消耗，从每年$120000，降到每年$1200，就和买套高档沙发差不多了。

    **这样做导致什么结果呢。再也没有家破人亡的家庭了。**

    毒品可以变得非常便宜。和吸烟也差不多。吸烟最多也就把你自已吸成肺癌，没什么社会病。

    此外，“阳光化”的另一个好处。

    则是可以用现代科技大规模生产，公开研发，杂交水稻。

    这样，“成本”还可以进一步下降。

    按照七位参议员的计算，哪怕全体美国人一起吸毒。也就需要很小的一块土地种殖鸦片，很小的一个工厂。


    其副作用，无非是大家更加头晕一点罢了。

    至于说毒品的“上瘾”效应，其实各位不了解全球毒品市场的一个大趋势。

    **HEROIN 正在无情地丧失市场份额。哪怕不扫毒，金三角也没几年好日子了。**

    目前全球的趋势，是“软性毒品”。

    因为 HEROIN 太烈。它虽然可以给你至高无上无以伦比的享受。但是它的强度太大了。

    吸食 HEROIN 的人，无论再怎么克制。最多也就二三年的寿命。

    而毒品公司不要这样的客户。

    对于毒品产业来说，“挖掘”开发一个新客户。其成本是非常非常高昂的。

    如果新客户二三年就死了。对毒品公司是非常不划算的。


