    ![](img/f67be513638d053b62bd7b01d459b241_267_1.png)


    # 职业分布决定中产分布 #F230


    番外篇：在分析屌丝心理的系列文章中，我们岔出去讲一下屌丝的生存土壤。


    **一）纺锤形社会**


    根据某些浪费纳税人金钱养春的砖家们说，我们目前的社会结构是不合理的。


    “金字塔”型社会是不稳定的，最理想的社会模式，应该是纺锤形。大富和穷人都非常之少，中产阶级占 80%。


    为了打造纺锤型社会，所以我们要“调节”收入分配。要政府干预。


    我们要指出的是，这些砖家，无论智商或是人品都非常之差。


    为什么，因为职业分布决定中产分布。


    工作才是第一位的。你想象一下，在“苏州工业园区”内，一个车间主任带领着手下 100 个工人。


    这样的“收入分配”，会是纺锤型的么。会诞生纺锤型社会么。会诞生中产阶级么。


    相反的，在北京 CBD 内，有搞广告设计的，有卖保险的，有物流航运的，有英语培训的，有会展业，服装设计，杂志，新闻媒体。


    这样的收入足够多元化，自然而然就会产生“纺锤型”社会。就会诞生中产阶级，就会诞生五颜六色的都市文化。


    就会诞生三里屯，798，回龙观和金融街天使投资人。穷人也可以怀揣着梦想 IT 创业翻身。


    这一切都是水到渠成的事。


    **二）消费型城市**


    同样的 GDP，其含金量可能有很大的不同。不可混为一谈。同样道理，也绝对不能够以“房价/收入比”来推算合理。


    一笑如一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新......'
