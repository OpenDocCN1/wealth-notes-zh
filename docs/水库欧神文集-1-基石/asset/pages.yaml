  md: '你以为的真慈善，对社会有害，其实是假慈善。


    你以为的假慈善，对社会有利，其实是真慈善。


    “真慈善”的定义，你去了当地，大做好事，用“爱”感化了当地人。


    无论是帮助贫穷，帮助弱者，最终是获得了他们的善意。


    用“爱”弥补了贫富差异。缓解了“失意者”的愤怒。缔造和谐社会。


    “真慈善”的受益人，其实并不是穷人。而是你自己。


