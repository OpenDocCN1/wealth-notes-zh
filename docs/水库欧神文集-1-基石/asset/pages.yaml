  md: '基于穷举的算法，不是人工智能。


    具体可参见《Master 不是人工智能》


    我们说的是，哪怕 AI 达到相当高的程度。机器人相当于 20 岁民工的智慧。


    则整个社会的“就业岗位”，非但不会缩减。反而会大大增加。


    这是最基本的经济学原理。


    大学教授反驳，大学教授是 SB


    院士反驳，院士是 SB


    没有例外


    为了理解这个概念，我们首先举一个最熟悉接触的东西：“电脑”。


    在 1980 年之前，全中国可以说是：完全没有电脑的。


    当电脑业开始兴起时，很多人忧心重重。


    许许多多“低技能”的工作岗位，都会被电脑取代。


    最基本的，例如会计，统计，出版业，电报业，甚至 ICBC 一级一级的数据中心。


    而事实的结果呢，37 年以后。


    时至 2017 年，电脑使得就业岗位“减少”了，还是“增加”了。


    电脑的确“消灭”了大量低技能的工种。例如会计的人手，减少了 9/10 都不止。


    超市核查库存，只需要用 RFID 扫一扫就行了。


    盘帐都不用做，数据直接汇总到总部。


    可是，IT 行业也创造了许多就业岗位。最典型的是“程序员”。


    每一段自动运行的程序背后，都有程序员的影子。


    很多人会说，程序员的人数，抵不上会计被裁的人数。


    别急，我还没说完。


    你想象一下，《王者荣耀》创造了多少就业岗位！


    截至上一期的财务报表，《王者荣耀》创造了 86 亿的收入。


    按照 8.6 万的年薪，他可以养活 10W 员工。


    更重要的是，这些岗位全部都是新的。


    不仅仅王者荣耀是新的，连“微信”也是新的。


    在 IT 业产生之前，人们根本不知道：人与人之间，还可以 5:5 组队，一起打王者荣耀。


    也不知道，手机上装个微信，居然可以这么好玩。


    微信还可以衍生出许许多多的玩法。例如“小密圈”。'
