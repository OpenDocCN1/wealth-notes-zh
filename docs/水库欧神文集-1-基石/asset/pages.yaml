- pgno: 256
  md: '尚有一寸智商，理智暂存的人，若有所悟的坐下来了。


    他们似乎想到了什么。


    因为这个合同格式很熟悉。熟悉到几乎每天都能看到。


    # 没错，这就是标准期权合约文本。


    期权，也称之为“认购权”。


    指甲方有权以 500 元/吨的价格，向乙方购买 100 吨煤炭。


    如果煤炭价格上涨，甲方发大财。


    如果煤炭价格下跌，甲方可以“放弃”购买权。


    期权，英文称之为 Option。港澳地区也翻译为“窝轮”。


    中国上交所在 2005 年进行“股权分置”改革时，也曾经发行过“期权”。


    当时，作为股改附送的“期权”，以 T+0 的交易特征，风靡了无数人。


    “期权”最主要的特征，在于它的“输赢”是**不对称**的。


    理论上，如果“煤炭”的价格，象房价一样飙涨。则“期权”的赢利，是可以涨上天的。


    而另一方面，“期权”输钱可能性。是**有下保**的。


    下限就是煤炭价格跌破 500，譬如 499 元/吨。


    那你这份合约的价格就为零。也只能是零，不买。**不可能是负数**。


    无论如何，不可能倾家荡产的。


    “赢面无限，输面有限”，Warrant 是不是一种很好的金融产品呢。


    香港市场上，铺天盖地的“窝轮”，大伙是不是赶紧去买，赶紧发财呢。


    答案也不是的。


    因为“认购证”本身是要卖钱的。煤炭厂家又不是傻瓜。他要卖你一个“溢价”。通常是 10%。


    例如煤炭价格 500 元时，厂商卖你一个月内“500 元认购权”


    **这份认购书，价格是 50 元**。


    你要煤价涨破 550 元，你才有赢利。


    具体的“窝轮”价值计算，十分复杂。有一个拿诺奖的 Black-Scholes 公式。


    但总体而言，这是一门生意。


    买方卖方，都是平等的。买卖窝轮，绝不存在什么暴利机会。


    从香港市场经验看，窝轮是“散户——机构”博弈。


    散户还有博彩暴富的心态，容易出高价。


    从长远统计看，基本上是散户（认购证买方）输得多。


    二）卖国条约


    回到我们最初的“房屋买卖”合同中。


    +   1）违约的话，甲方赔偿 100 元。乙方赔偿 10000000 元。


    +   2）价格上涨的话，甲方享受全部利润。价格下跌的话，乙方承受全部亏损。


    请问，以上合约是“公平”的。还是“不公平”的。'
