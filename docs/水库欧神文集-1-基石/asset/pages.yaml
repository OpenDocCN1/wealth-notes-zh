  md: '一个市场中，较赚钱的都是机构。思考让人进步啊。


    # 三）房价


    2002年的时候我曾经看文科生小编写过一篇文章《老公房应该如何估值》。其中说，由于70年的房龄，老公房至少要砍掉60%的价值。而因为“房型”等设计老旧，管路老化，老公房还得这扣分那扣分。最后小编得出的结论，是卢湾区市中心的老公房卖2800元/平米比较合适。


    咳咳，当时卢湾的老公房，已经可以卖5000元/平米。到了二零一四的今天，大概可以卖四五万一平米。


    我们先不讨伐文科生小编智商有多烂。我们就想问一下，老公房的价格，是怎样从五千move到五万的？


    价格在移动。那肯定要有推动价格的力量。不可能每个人都是“挂篮子”。卖五千的地段，我挂个4600/mm²。买得到就买，买不到就算了。


    价格在移动，说明有一部不认同5000元的力量，五千一我也买，五千二我也买，一万二万我也买。


    这一股力量，就是奋战在第一线的“交易者”们。没错，交易者们，才是真正市场的主宰。


    他们有可能部分是自住客，纯粹刚需自用。部分是投资客，觉得价格偏低就该拉上。但无论如何，他们是“真金白银”奋战在第一线市场上的。


    他们用血和汗，一叠叠积累的钞票。敲定了价格的实际。阐释了市场经济的精髓。


    评估价是合理的么？不合理，不客观。


    如果按照评估的计算机模式，模型。则卢湾区的老公房，价格永远是5000元/mm²。他应该符合“客观”数据库，永远不要涨价。


    而真实的市场呢，就是对无数个否定累计起来。你的数据库是错的，是SB。应该卖5500元，6500元，165000元，50000元/mm²。


    交易者才是真神。才是真正市场决定的力量。交易者才是客观的。


    评估员是主观的。


    我对今天政府斥巨资搞的“大数据”宏观经济模型感到悲观。因为你的建成，其实就意味着你是错的，你是SB。


    市场不会“跟随”你的统计平均值。市场只会“推翻”你的大型数据库。


    # 四）中介


    今天Shinehigh那个微信群里，热烈地在讨论一个真实的中介服务中介平台。必然能对房地产市场带来客观，理性，指引的功能。“规范”市场的运作。


    哥哥进去骂了声SB，于是他们嚷嚷着要踢我出群。


    很多人没搞明白。房价是中介决定的么？房价是评估师决定的么？'
