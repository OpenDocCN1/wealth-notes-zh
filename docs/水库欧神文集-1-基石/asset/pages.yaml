    # 一）辟谣


    首先，申明一点。作为一个自由主义者，我们是不辟谣的。


    默认为每一句都是谣言。


    有一个小姑娘说，有人在 Shuiku.net 上公开发诈骗信息。你也不干预。

    我说，“抬头看置顶章”。

    水库宪章中，明确写明：“水库允许诽谤，造谣，人肉”。

    我们从来没说过，本 BBS 发的贴是纯洁如水的。小 MM 你这样想，那是你太纯洁了。

    如果你希望 Shuiku.net 是纯洁如水，没有任何诈骗欺骗。那就会引发一系列的问题；


    +   - 谁来甄别，谁来仲裁

    - 如果证据不足的话，如何办案

    - 如果证据不足，结案困难，产生费用的话，如何结算


    主持公理是要有成本的。我们从一开始，就没想要提供“安全论坛”这一款产品。

    我们提供的产品是什么呢。“只有信息，读者自负”判断。

    从这里看，水库从建立初始，就弥漫着自由主义的气息。

    我们认为“甄别”这类工作，不应该由政府来做，而应该交给“市场”。

    在水库 BBS 发的每一条帖子，都有可能是真话，可能是假话。

    水库 BBS 写的每一条“炒楼”心得，都有可能是正确的，有可能是错误的。

