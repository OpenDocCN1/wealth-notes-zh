- pgno: 193
  md: '对于“英国灯塔”这个例子。它每艘船只收几便士的费用，任何人都可以承受。收费率也不高，毛估最多 50%。


    但是这些“收入”，已经足以它建设“公海灯塔”。


    **灯塔还是造起来了。**


    这就成了。


    在现实世界中，这种“不完美”情况比比皆是。


    Windows 永远收不到每一个盗版的费用，许多人电脑里用的，都是“未激活”版本。


    “拜拜甜甜圈珍珠奶茶方便面”，满世界都在传唱。而《火箭少女》也永远收不齐版权费。


    ![](img/f67be513638d053b62bd7b01d459b241_193_0.png)


    SO WHAT! 我们的世界，依然在向前前进。


    灯塔造起来了。


    Windows 开发出来了。


    唱片界依然繁荣。扬越越拜拜。


    +   * 对之前“药神”事件，也作出了完美解答。你不需要 100%收费率。


    # 五）不 完美的世界


    以下部分，不是书的内容，是我的原创。'
