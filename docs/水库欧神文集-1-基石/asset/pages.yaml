    他需要消耗大量的能量。其中能量的大头，用于维持他自己的生存，不受于别人的挑战。


    究竟哪种政体最优。这是一个非常前沿的科学，一直到今天争吵也没有结果。


    铅笔社李子暘曾经说过，“评价一个政府的优劣，有且仅有一个指标，就是他占 GDP 的比例”。


    布尔费曼说：“君主制好于独 x 制，独 x 制好于民主制”。


    至少对二位这几句论断，我是比较赞同的。


    # 六）限购


    扯了这么多基础理论研究，我们来讲点实际的。为什么政府要推出“限购”，其背后的逻辑

    与思路是什么。


    假设有一个正宗的绅士 A，和房东 B，二人互相对眼。商议好了要以 500W 的价格，将 B 的

    房子卖给 A。


    可是旁边有一个屌丝 C，他觊觎 B 的房子，跑去要求 B 以 200W 的价格卖给他。

    B 自然不肯了。“我可以 500W 卖给绅士 A 的，为什么要 200W 卖给你。我岂不是亏了 300W”。

    面对这样的回复，屌丝 C 想的不是好去工作，努力赚钱“生产”。

    他选择的是去找政府，院外游说集团，“抢劫”。要求剥夺 A 的购买权。要求只能卖给 C。


    你如果早上推一篮子蔬菜去菜市场卖，路上被五大汉拦了下来。规定你不可以去菜场 2 元/

    斤卖菜。只能 0.2 元卖给他们。


    这是什么，这是车匪路霸。[1]


    房产限购是什么。房产限购就是车匪路霸。

    凭什么我的房子不能 500W 卖给土豪，凭什么只能 200W 卖给你屌丝。你这不是抢劫么。


    房产限购令，实质是屌丝阶层的抢劫行为。而政府为了取悦这一阶层，抑制了交易，增加了

    抢劫，成了帮凶。


    这种事多做几次，我们就成了美利坚。这种事多做几次，我们就成了北朝鲜。

    “房产限购令”本身就是土匪国度里颁布的一项土匪法令。

    心术不正，又岂会有善果。很快他们遭到经济学规律反噬的后果。


