- pgno: 265
  md: '正确的做法是什么，世界根本就不应该有税。而仅仅有“费”。什么叫“费”。


    譬如说，我用到了你的警察服务。享受到了社区安全。则我支付一笔“警察费”。再譬如说，绝大多数人，其实是享受到了“消防局”的隐性服务而不自知。相应的，你也应该支付一笔“消防费”。


    在 1949 年之前的中国，“工商局”和“消防局”都是可以外包的。其主体也都是民营机构。如果是河北的滚地龙棚户，因为他们从来不交物业费。所以一旦起火了，消防局也是向来不理的。


    “费”和“税”的区别。费用多少，算多少。


    +   * 费的本质是一种服务。

    * 而税的本质是抢劫。


    税就是你根本没享受到政府的多少好处。政府给你一张清单，说你要交“30%的所得税”。然后你就必须把三成收入上交。


    税是很邪恶的。


    本质是暴力机关的抢劫。


    所以一个真正的奥派理想中的“理想国”，它应该是没有任何税收的。仅仅存在“费”。你用多少，付多少。


    在“税制”的情况下，才有可能发生“苛捐杂税，小老板关厂民不聊生”。


    因为这个时候，税其实太重了。远远超过了政府所提供的服务，而成为了种抢劫。


    众所周知，中国的税重，税繁，税不公平。


    如果你老老实实交税，可以交到你倾家荡产。


    一般你观察中国企业的“增值”部分。一条最简单的原理，“净利润/总纳税额”这个比值，一般是低于100%的。


    也就是我开一家厂，一年辛辛苦苦为财政纳税二百万。


    我自己的剩余净利润，可能仅有几十万。


    “净利润/总纳税额”远远低于100%，国家拿的才是大头中的大头中的大头。


    这样导致的结果，是很不公平。


    政府提供了哪些服务，是计算得出来的。主要是警察，消防，路灯，以及法律法规上司法公正。


    你找“园区管委会”，把开发区每年的支出清单列出来。是可以计算的。


    但是企业承担的“税赋”，远远超过政府向他们提供的“服务”。


    这就形成了“套利”。


    好比一个钢铁厂。几万人的大厂，政府在边边的派出所，就不会少于 500 人。相应的还有环卫工人，还有医院学校，图书馆甚至体育馆。


    可是这一切“服务”，一年总成本 15 亿。


    钢铁厂一年纳税 100 亿。


    这其中还是有 85 亿的“套利空间”。'
