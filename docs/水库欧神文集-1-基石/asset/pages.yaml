    正本清源话通缩 #F1175


    2017. 11. 11 我在清华科技园作讲座，周克成代表《人文经济学会》问了我 11 个经济学的问题。


    其中，有一个问题我语焉不详，一笔带过。


    > 9

    有些奥派学者认为，

    是部分准备金制度下的商业银行制造了通货膨胀。

    您认同这种观点吗？


    人文经济学会'
