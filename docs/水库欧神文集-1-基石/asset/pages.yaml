  md: '# 一) 指令经济


    大约二年前，我在青岛涵碧楼。


    那一天，看着小孩子们在沙滩边堆城堡，玩沙子。我突然意识到，“市场经济是不可行的”。


    为什么。因为当时有五个小孩子，平均年龄约在 6 岁左右。


    她们的任务，是搭建一道沙丘城墙，长度大约 4 米。可以连接起二块巨大的岩石，形成一道山隘。


    他们为此尝试了整整一个下午，五个小孩子，来来回回地拎塑料桶，拍打沙土。


    可是他们最终失败了。


    小孩子们搭建的沙城，总是歪歪扭扭的。不仅长度拉不直，而且很容易崩塌。


    我看在眼里，其实我不说。


    要搭建好的，牢固的城堡。一个首要的秘诀，先是要掺水。


    泥沙中增加一定的水分。提高其黏度。


    其次要拍实。


    拍打一定要压实。压制紧实，压紧以后的沙堆才不会轻易崩塌。


    我在旁边看着，可是我不教。'
