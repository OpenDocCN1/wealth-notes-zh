  md: '那么，房子给你奶奶“转租”了之后，你需不需要交税？


    答案是，当然不需要。因为你没有收入呀。


    中华人民共和国的法律，明确规定了“子女有赡养老人的义务”。


    什么叫赡养老人。就是给老人吃好，住好，难得还有一些零花钱，可以买些喜欢的剪纸糖果。


    +   - 因此，你把豪宅大院“免费”给老人居住，是完全符合中国赡养法的。

    - 而老人呢，住得不习惯。非要把房子租出去，搬回去和街坊邻居一起热闹。这也是合法的。

    - 房子租出去后，有点收入。收入由老人收了，顺便买点年货糖果。这是彻底合法的。


    家有一老，如有一宝。


