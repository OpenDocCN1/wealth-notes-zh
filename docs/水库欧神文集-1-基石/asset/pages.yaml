    # 四）宏观破产


    支持马克思主义的人会说，他们讨论的，并不是一家企业的“破产”。


    而是宏观上，整体大规模企业的破产，好比今年的GDP，比去年降低了-10%


    对于他们的反驳，也非常简单。


    如果说微观上的破产，是一家企业犯的错误。


    难道宏观上的破产，不就是（同时）1000000 家企业犯的错误？


    有人说，“计划经济”不存在经济周期，不存在宏观上破产的现象。


    这纯粹是胡说八道。你 TMD 眼睛瞎了，还是良心瞎了。


    因为错误只能被转移，而从来不会被消灭。


    任何一个商业行为，都有可能产生“错误”的。


    譬如我发明了一个“无尼古丁香烟”，发明了一个 iPad，这二项都是伟大的发明。请问其市场预期销售是如何。


    答案是：前者大败，后者大胜。


    可是当你这个产品推向市场，在发布会的前一夜，“你是全然一无所知的”。


    一无所知这一点，无论你是计划经济，还是市场经济，答案都是一样的。


    谁也不能预测未来。


    那么，区别是什么呢？区别是结算单位。


    在市场经济体制下，结算单位是“企业”。无尼古丁香烟让 Philips Morris 亏掉了大约三分之一的身家。


    一大批高管和 CEO 被解职。


    我们知道，生物体其实是一个“接触---感知---反馈”过程，哪一块肌肉腐坏了，就切除他，然后剩下的就越来越健康。


    在市场经济下，犯了错的 CEO 和高管们就被解雇。犯了错的公司就股价下跌。


    而在计划经济下，他的结算单位是“国家”。


    我们常常听见了某些国营单位，某些大型项目，亏掉了几十亿上百亿。


    可是结果呢，没有惩罚。大家大锅饭，拍拍屁股。


    你炼钢会出废品，车床会有切错，高速公路会遇到地质事件。


    谁也不能预测 iPad 的销量。


    错误是不能被“消灭”的。错误时时刻刻在发生。


    计划经济和市场经济，一样地在不停地犯错误。


    区别是，市场经济的核算单位非常小。单个“企业”甚至个人。他在内部不停地优胜劣汰。


    而计划经济是“死扛”。他犯了错误之后，没有一整套的“反馈”系统来把错误停下来。所以继续犯更大的错误。


    我们真正关心的，是“接触---感知---反馈”流程，是错误的尽快改正。


    我们追求的是“尽快”。改错得越早，损失越少。


    你嘲笑经济有“危机衰退”，我们不在乎。


    你要说 1000000 家企业同时改错，“大萧条”。


    一笑加一笑（微信号：150500211）邀你加入水库交流群。群内文集每月一更新……'
