  md: '而现在呢，“廉价女大学生”供应，事实上是被切断了。知予男就像是被夹了尾巴，跳起来了。而半桶水 SB 文盲大学生引用的学术术语：“外部性”。你具有外部性么。你没有。


    +   * “外部性”得那女人是你爹养媳。你 5 岁时就买断了她的人生。

