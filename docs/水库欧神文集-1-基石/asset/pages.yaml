    # 大道随行，不忘本心 #10


    道生一，一生二，二生三，三生万物


    > — — 《道德经》


    # 一）SAP


    大约 17 年前，公司里要上 SAP。当时坐在我身边的，是一个生产部的女士。她工作极其认真严谨，拿出了一个本本，笔记记得密密麻麻。


    对于 200 多个 Form，这里是输入地址，那里是输入日期，下拉框是查库存列表。她整日眉头紧锁，觉得这个系统实在是很复杂很复杂，有 200 多个表格要学呢。


    相对于我的漫不经心，麻瓜女士表示十分不满：“xx 桑，SAP 系统对你意味着什么。难道就意味着每工作餐可以额外地吃免费水果么。而且你每次都抢最大最甜的泰国芒果，知不知道你这样形象很差耶”。


    我白了白眼睛，那你认为该是什么呢。SAP 系统其实很简单。说穿了就是一个数据库查询系统。


    无论你有多少个 Form，多少个查询表单。无非就是数据库的输入/输出工作。


    今天你下一个采购订单，是把货物输入到了系统。


    明天你填一个生产表格，是把货物 A 转换成了货物 B。


    后天你填一个销售表单，就是把货物 B 卖了。


    SAP 很简单，无非就是一个大型的数据库。仅在生产规划环节有一些 CPU 计算，但也并不脱离传统的 MRP 系统。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '扣掉掉了生产线流水钱那一些 MRP 算法，整个 SAP 就是一个超级简单，幼稚的数据库软件。其库存，运输，账本，乃至于后来画蛇添足加出来的 HR，行政，总务等系统，无不是简单之极的一个二维数据库。论技术含量，SAP
    可能还不如国内的《金蝶软件》。

    SAP 很简单。其实就是个数据库。


    但 SAP 为什么在某些人眼里这么难呢。因为她们的思考方法不同。


    在某些人眼里，SAP 是 200 个不同的 Form，每一个表格都要单独背诵和记忆。笔记记了一大本，到最后还是云里雾里多走一步都不明白。


    可是如果你懂得 SAP 的大框架，整件事就十分清晰。清晰得宛如手指上的掌纹。然后你只要关注一下一些细节就可以了。


    # 二）万物理论


    最近有一部电影十分热火，讲霍金的《万物理论》。

    科学家们试图寻找出一种理论，它可以作为其他理论的 “母理论”。从他开始可以推断出世界一切的科学与科学。


    必须承认，这是一个很诱人的想法。人类永远在寻求更低一层的规则，T-1 层的规则。

    规则，规则是一切的力量。更底层的规则，可以帮助我们更好的描述这个世界，发现新的机器，发挥无以伦比的力量。


    就好比说，中世界的炼金术士们不懂化学。无论他们做了多少的试验，最终他们也无法炼出金子。


    可是等化学学科渐渐丰满，HCl 和 NaOH 的反应渐渐普及。人类才能组合出各种各样稀奇古怪的材料。才会有塑料，铝器，汽油柴油。


    而化学渐渐的也有瓶颈。等门捷列夫排出化学元素表，人类才看清楚 “更深” 一层的规律。于是才有了 Nuclear，有了核能和原子弹。2007 年日本科学家第一次用激光照射铍，剥掉了一个中子，获得了全原子。


    但是，原子物理仍不是最终极的科学。在原子之下，还有夸克。如果能了解夸克的奥秘，就能象《三体》小说一样，制造出无敌战舰 “水滴”。

    其外壳的强度，将是现在所有材料的 100000 倍。完全不可摧毁。这靠的是强相互作用力。

    而夸克也不是最终的粒子，夸克之下，还有弦论，至少。


    讲这么多的闲话，和炒股有什么关系呢。请别忘了，这始终是一个俗不可耐讲钱的账号。

    其实我们要说的是，基础理论的重要性。


    很多人很表面，很肤浅。

    就象那个 SAP 画了二百个表格的女孩子。又或者深陷题海战术的高考学子们。

    他们看似很努力，可成绩始终升不去。

    因为他们只是忙碌于很表的东西。从没有想 T-1 层潜在的原理。其实老师出题来回就那几个套路。真正的学霸，学霸从不读。


    # 三）体，用，术


    基础的理论很重要。从一些更本来的规则，可以推出一上层的规则。这样不仅更好记，更快捷，而且可以算出别人看不见的东西。'
