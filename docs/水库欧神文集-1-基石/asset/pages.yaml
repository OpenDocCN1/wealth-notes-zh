  md: '拜托，你可以说我邪恶，可以说我恶魔。但是不能说我弱智好么。请不要侮辱我的专业素养！


    水库是一个很大度的论坛。


    我们迄今挂着陆医生 10458 条回帖，一条没删。


    昔日 2013 年的各种指责，如今回头看，宛如笑料一样。


    清者自清，浊者自浊。


    只有当你回头看，才会发现当年居然有幼稚，这么弱智的谣言。而你，还差一点相信了。


    言论自由的可贵之处：不到最后，你不知道谁才是真正的骗子。所以，每一个人的发言都要被保护。


    # 四）水库的态度


    关于 xingu 和久久丫，以及 ciaccona 的这一趟撕逼。


    水库论坛管理方，保持了一贯的态度，“关我屁事，关你屁事”。


    我们不言语，不干预，不管理。


    随便撕。


    我们所做的，就是把所有的发言记录，全部都保留下来。一条帖不删。


    把每个人发言的权力，全部都保护起来。一个 id 不封。


    是非对错，其实比你想象的更复杂。


    千门骗术，其实比你想象的更黑暗。


    事情不是你想象的那么简单。社会很复杂，千门很复杂。你看到的正义，未必是正义。你看到的黑暗，未必是黑暗。


    所以我们要保护每一个人发言的权利，100% 的“言论自由”。哪怕这个人是你们口中的“骗子”。


