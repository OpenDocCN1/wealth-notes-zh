- pgno: 190
  md: '一直看到第三章：19 世纪的美国收费公路。


    第二章：苏格兰海岸的灯塔。


    忍不住拍手击掌，哈哈大笑。


    这二篇故事，讲了一个“公共产品”的典故。待我慢慢道来。


    在古典经济学中，有一个“公共产品”的概念。指的是，某项东西，具有太大的外部性效应。收费又太艰难。因此不可能由私人来提供。


    每个人都可以“搭便车”的话，就收不到钱。


    “公共产品”是古典经济学重要概念。


    证明政府之不可或缺。某些时候，没有政府，就没有人治理黄河，修建水坝，研究水稻良种。


    英国经济学家，为了说明“公共产品”的概念。引用得最多的例子，一般是灯塔。


    ![](img/f67be513638d053b62bd7b01d459b241_190_0.png)


    （外海灯塔）


    18 世纪的英国，非常依赖海洋贸易。船运业，几乎是整个英伦的经济命脉和物资来源。


    但是古代水文条件很差。航海技术也很差。


    水中密布礁石，没有精确的航图，就很容易触礁。船货二失。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '因此英国海运，非常依赖“灯塔”。


    灯塔在茫茫大海中，提供了一个坐标。极大地纠正了航线，也减少了海盗。


    问题是，灯塔是一个非常典型的“公共产品”。


    因为你几乎没法，对来往过路的船只收费。


    你根本不知道有多少艘船，享受了你的服务。也无法屏蔽掉某一艘船，不为它服务。


    顺理成章的推论则是，灯塔这样的“公共产品”：


    +   - 只能由政府提供。


    +   - 为了“公共产品”，政府是必需的，不可或缺的。


    古往今来，几乎所有的出版社，都是这样解释，这样印刷的。


    然后呢，奥派贴上了四个大字：


    以上全错


    哈哈哈哈哈，书上说，18 世纪的时候，2/3 的“灯塔”是由私人运营的。


    只有不到 1/3 的灯塔，是由“领港工会”国营的。


    “灯塔”原来是私营企业。


    那是怎么回事呢？


    # 三）收费制度


    如果“灯塔”是私营的。那它怎么收费呢。


    如果存在“搭便车”现象，那它怎么收费呢。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '答案是，收“进港税”，每艘船几个便士。


    因为大海其实吃水很深的。真正要有“礁石”，往往已经到了浅海。


    灯塔到港口的距离，说近不近，说远也不远。一般就在 10，20，40 英里数量级。


    你既然已经开到如此靠近港口的地方，那我收你几便士的“进港税”，那也是合理的。没有问题。


    +   那么，过路的船只呢。

    海盗和渔民的船只呢。

    去下一个港口或者去外国船只呢。


    # 那~就不~收~了！


    哈哈哈哈，哥哥看到此处，仰天大笑，把书扔了出去。


    经济学千古之谜，又解决了一个。


    # 四）完美


    为什么，因为凡是讨论“公共产品”的人，都犯了一个错误。一个无可救药的错误。


    # 完美主义的错误。


    古典经济学，讨论“搭便车”现象，主要集中在“无法穷举收费”，总有人逃票，总有人漏网。


    但这是不对的。这在逻辑上犯了一个 bug。


    “我为什么要对 100% 的人口收费”？？？


    事实情况是，你并不需要对 100% 的“受益人”收费。你只要收 85% 就够了。某些情况下，50% 也够了。'
