  md: '这么多的迹象，难道您还看不出来么。


    # 一个三亿人规模的“统一市场”，正在逐步形成。


    这个才是惊天动地的大事。其他任何事，于此相比，都小得不足一提。


    # 北冥有鱼，其名为鲲。水击三千里，抟扶摇而上者九万里


    中产阶级这具大怪兽，从海底爬起。抖落着身上的水珠。


