    # 歧视经济学


    我们知知道，公司作为一个组织。它最大的目标就是不断降低成本。


    在《信息不对称是伪科学》 #750 一文中，我们说到：


    信息就其本身，是一种商品。一种需要“付费制造”的商品。


    你找二个 HR，看完一千份简历。耗时一个月。


    HR 的工资，怎么不是成本。


    你找 7 个人成立“专家小组”。耗费足足三年的时间，确定谁是最合适的 CEO 继任人选。


    7 个高级专家的工资开销，怎么不是成本。


    算上机票酒店开会食宿国际学校医疗保险，成本高得很！


    信息也是一种成本。企业在竭尽全力节约成本。


    企业尽可能地降低信息成本。


    筛选，简易筛选。大幅度地降低了成本。


    我们看到，凡是大厂大店，招聘人排长龙的。从来都是不屑于精选简历的。


