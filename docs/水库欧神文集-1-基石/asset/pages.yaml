- pgno: 189
  md: '小伙伴于是又大哭，把脸上的妆都弄黑了。


    说起来，水库也是很奇葩的号。因为你从没见过任何 Popular 的号，象水库这么热衷于“讲科学”。


    水库不仅花了很大的篇幅，讲经济学基本原理。


    而且很少追社会热点。现象级 100000+的疫苗，药神，虚壹，我们都不怎么跟。


    娱乐至死的年代，水库讨论的却是《[公路的彻底收费化](#)》《[携程提价，该不该谴责](#)》


    要不，咱们今天继续写篇经济学。


    # 二）灯塔


    这两天在看书，看一本很厚的书。派派书籍《市场失灵的神话》


    ![](img/f67be513638d053b62bd7b01d459b241_189_0.png)


    ![](img/f67be513638d053b62bd7b01d459b241_189_1.png)


    [item.jd.com/28482568897.html](#)


    书很厚，而且很枯燥。害得我更新都少了。


    我运气不好，从中间开始翻的。一开始看费雪通用的收购案，洛克菲勒的敲诈案，iMac 和 VHS 标准的陈年往事。


    虽然很精彩，但不足以写篇文章。'
