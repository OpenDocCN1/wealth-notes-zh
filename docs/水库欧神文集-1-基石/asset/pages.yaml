  md: '# 只要公路免费，就一定发生浪费现象。


    在经济学中，真正的正义，从来都是“谁使用，谁付费”。


    一个真正有经济学素养的人，从来不会指望，不会祈求，也不会发动民众“爱心泛滥”地要求“免费/降价”。


