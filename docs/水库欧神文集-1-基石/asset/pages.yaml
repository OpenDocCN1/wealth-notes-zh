  md: '你以为那个每天唠叨一百遍“公平与效率矛盾”的人，他们不懂得公平的道理么。


    你以为他们内心深处，真的“不懂得”他们是在无理取闹。他们所要主张的，根本不是公平。而是“脸上三颗大黑痣者年终奖翻倍”。


    不，不，不，他们都懂得。你懂，我懂，大家都懂。


    书本，道理，公平正义，这些我们都懂。不懂的是人心。


    当一群人在那里义愤填膺地喊着“公平，公平”。其实他们喊的不是公平，他们真正喊的口号是“抢劫，抢劫”。


