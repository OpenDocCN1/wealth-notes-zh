- pgno: 199
  md: '# # 什么才是宏观经济学

    ##F1970


    本篇为经济学。


    昨天，有人在水库“知识星球”提了一个问题。


    实在再经典不过了，值得展开写一篇。


    ![](img/f67be513638d053b62bd7b01d459b241_199_0.png)


    # 一）微观经济学


    首先，我们来看“微观经济学”。


    什么叫微观经济学。微观经济学，指的是“为人处世”，“在储蓄和消费之间选择”，“在价格和品质之间选择”的一门学问。


    举个例子，假设有一个青年“张三”，税后月薪是 10000 元。


    +   - 净储蓄 2000 元

    - 房租 2500 元

    - 吃饭 2500 元

    - 交通 500 元'
  merge: -1
  img_proc: true
- pgno: 200
  md: '+   - 衣服和淘宝 1500 元。

    - 休闲 1000 元


    那么这是一个非常简单清晰，“安置”妥当的处理方式。


    张三在“消费/储蓄”中，做出了 80:20% 的抉择。


    在“衣食住行”四大类中，也做出了 15:25:25:5% 的分配。


    好了，现在假设房东李四，找到张三。说“房租类涨价了”。


    下个月开始，房租会由 2500 元，上涨到 3500 元。


    请问张三会如何调整，手足无措？


    微观经济学对此的解释，至少有二重效应：“替代效应”和“财富效应”。


    首先是“替代效应”。人类购买一项服务，取决于消费能获得的满足感。


    “衣食住行”，任何一款消费变贵了，都会减少“该大类”的消费量。


    好比韩国牛肉特别贵，韩国人就少吃点。多买些化妆品。


    如果房租涨价了，就会促使人都搬去地下室。而维持“住房类 25%”尽量恒定。


    第二个是“财富效应”。任何一种物价的上涨，都意味着生活的更艰难。财富的缩水。


    所以，受影响的，不仅仅是“住房”类消费。而是你每一个“大类”的消费都减少了。


    以前每周周末，去村口买半只烧鹅。顺便调戏一下冰艳老板娘。


    等到房租涨了，干咽口水。花生肠子就没有了。


    一笑加一笑（微信号：150500211）邀你加入水库交流群。群内文集每月一更新……'
