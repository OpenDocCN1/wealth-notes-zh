  md: '中国进入工业革命的时间虽然晚，哥哥读小学时，老师们还在鼓励用高年级学生留下的旧书。


    可是等哥哥读初中时，所有的教材，课本，已经廉价到十几元一本。早早地，你就可以把所有课本买齐。


