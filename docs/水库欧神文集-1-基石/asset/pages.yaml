    AlphaGo 击败围棋，虽然人类史上喧器一时。

    可是就算法而言，却幼稚初级。不值一提。


    可能还比不上《Starcraft》《文明》中的电脑智慧。

    （下一项科技突破，或许是图像识别。或者全视频人脸识别。）


    这个 9.5 元的计算器。站在人类的角度，无疑是极其伟大。

    穿越回 17 世纪的话，再怎么看向都是神器。

    可是站在 AI 史上的话，计算器其实是最简单的东西。

    全部内容二行代码就行了。'
