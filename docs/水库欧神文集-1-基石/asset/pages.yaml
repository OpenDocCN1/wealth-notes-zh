    +   一、 消费欲望


    前两天，哥哥被抖音虐惨了。


    这两天出差，去二三线城市。朋友请吃小龙虾，餐馆里安开一百桌，一路排出去直到江边。


    蒸虾，蒜虾，靓虾，群众们吃得兴高采烈。


    一个象哥哥这么**久**痛的人，长期以来，一直困扰于一个问题：“**产业还可以如何升级**”。


    *在我看来，产业是没法升级的。*


