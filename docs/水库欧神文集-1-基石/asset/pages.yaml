  md: '有时候我在想，香港这个娱乐圈“港片”养活了多少人。


    有一次我在 Karaoke 点歌，华人女歌手，有名有姓的总在 600 位左右。


    考虑到这些都是出过唱片的，没出唱片的还要再翻几倍。


    而 Polygram 时间不长，这 600 位应该大多数在人世。


    更进一步呢，“台前”有 600 人。有基本“组织”常识的人都知道，中台后台，整个系统，人数肯定远远不止。


    亚视和无线，还有整个电影工业，歌手，广告人，香港“娱乐圈”40 年积累下来，从业人员至少有六七万人。占香港人口的 1%


    此外，香港的警察队伍有 30000 人，消防处有 10000 人，考虑到 40 年轮换，爸爸辈爷爷辈都还没死。


    现行 730W 人口中，应该有 10W 人左右，是从事过“警察”“消防”经历的。占人口的 1.5%


    这张清单，还可以无限延伸下去，西铁和港铁，也是庞然大物。地铁公司向来人多。


    建筑业和港口设施业，劳工密集型。


    餐饮业，贡献了香港 20% 的 GDP，最大单一产业。同样，也贡献了 20% 的就业。


    油尖旺地区，就不提了。


    前天去海洋公园玩。突然意识到大型主题乐园，对“就业”的拉动。


    一个熊猫馆门口，有二个穿蓝衣服的学生工在检票，检查食物不可带入。'
