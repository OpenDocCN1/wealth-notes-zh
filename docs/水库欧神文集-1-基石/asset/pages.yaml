    # 石油业的兴起，导致了其他产业的萧条


    当时的左翼经济学家们，对 “石油大亨” 们十分不满。咬牙切齿的给它起了一个名字叫 “荷兰病” 。也有词条叫做 “石油诅咒” 。


    按照百度词条，其具体的展开是：


    一国 (特别是中小国家) 经济的某一初级产品部门异常繁荣而导致其他部门的衰落的现象


    1982 年，荷兰属的 “北海油田” 接近枯竭，国际油价不振。荷兰石油收入一落千丈。


    在石油收入崩溃的同时，荷兰政府茫然四顾，发现满目苍夷。'
