  md: '这也是很常见的一个质疑。常见于马克思主义脑残对经济学的质疑。他们问的是：“卖亏了么”。


    例如有支股票。A 在 10 元的时候抛售，卖给了 B。

    没想到几个月一过，该股票目前价值 30 元了。

    A 那个心里悔啊，就像是连吃了 99 只苍蝇。

    千万次，他回想，如果当年没有“卖个 B”的交易就好了。

    如果能给自己找个理由，找个借口，譬如诬陷 B 为“奸商”。再主张交易取消。

    这简直就完美吉祥了。

    罗一笑的人渣是没有底线的。


    关于这件事，也有一个经济学的解释：“不确定性”。

    当 A 抛售时，他其实面临一个“不确定性”的局面。

    股票有可能涨，也有可能跌。

    有可能涨到 30 元。

    也有可能跌到 2 元。

    对于 B 来说，他买入之后，同样是有可能赚钱，有可能亏钱。

    对于人渣来说，他在“事后”回想这件事情，当不确定性开盘明盘，确立价格走势之后。

    他会开始后怕，会捶胸顿足，要求取消交易。

    而假如是股价下跌呢。你看好了，他立马会忘得干干净净。

    我们本身就生活在一个“风险”的世界中，经营风险，组织风险，是企业家最基本的工作。

    事物的发展，有可能好的一面，有可能坏的一面。

    企业家从“不确定性”中获利，这正是他们的天性。也是他们最伟大的一面。

    就公平正义而言，在交易那一刻，理性人就已经把未来各种“不确定性”走势都考虑到了。

    既然他愿意以 10 元抛。无论之后概率如何；

    那都是一笔公平的交易。


    （veyon_ou@163.com，2016 年 12 月 5 日午晚）


