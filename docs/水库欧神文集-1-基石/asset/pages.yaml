  md: '> 市场从来不会天生存在，从来不会。市场唯一不能创造的，是市场本身。当我们享受着市场的一切优点时，是因为有人扛着枪，在捍卫着国防！当你没有国防时，你也就没有市场。


    市场从来都不是免费的。当你享受着市场的一切好处时，你必须额外掏出钱来，来维护他的“国防费”。这笔钱千万不能省。吃小亏赚大便宜。


    北宋的士大夫们，勾心斗角。结果金兵杀进汴梁城，不管你几朝文墨，统统掳为奴隶。明末的东林党们，勾心斗角。崇祯哭诉国家无兵无粮。等李自成杀进城来，所有的大户统统成为了羊羔。


    # 四）昂贵开支


    我一直反对铅笔社的谭叔。在我看来，他就是“小家子气”。因为国防的原因，我们必须组织强大的政府。因为大型的政府，必然有大型的浪费。谭叔在那里痛心疾首，整天掰着指头算，这又浪费了多少，那又浪费了多少。这笔钱一定得花。不论汴梁城的长老们，花掉了多少钱，总比金兵入城要好。


    第二次布匿战争，坎尼惨败之后，罗马元老院全部元老，捐出自住不动产之外的一切财产。罗马因此组建一批新军团，百折不挠。我想，这就是罗马文明之后走向极盛的原因吧。


    我们将“最终暴力”视为一种无法纳入方程式的元素。必须另行计算。因为“暴力”的存在，必然无法做到彻底的100%的市场化，必然无法做到绝对的“生产效率最大”。但这是值得的。我还是支持爱国主义，还是支持强大国家。哪怕有时候会导致生产力损失。完美主义是种病，得治！


    照着这个思路推下去，前二天有人提出了一个问题。“川普赢，还是圣婆赢，对中国更有利”。Hillary 赢的话，美国基本上就是完蛋了。会沦为一个拉美化国家，中国也会失去进出口贸易伙伴。


    川普赢的话，美国可以续命。中美贸易可以进一步发展。但是很多人对美帝心怀有敌意。我的回答是：“看美国是不是我们的敌人，会不会以武力进攻中国”。


    如果美国不可能以武力进攻中国的话，那我希望美国一天天好起来。因为贸易伙伴活得越好，中国也活得好越好。我希望 Trump 赢。（也希望 Hillary 去俄罗斯当总统）


    同样道理，政府有时候会干预国际贸易。有些东西可以出口，有些东西不允许进口。如果按照“100%纯粹自由主义”的观点，任何贸易都不应该阻止，任何贸易都应该鼓励。但是考虑到“暴力不能包纳市场经济”。长期以来我一直思索一个问题：“打仗的时候，能不能卖给敌军炮弹”。


    答案是不能。所以和我们交战的国家，应该部分停止贸易。对我们敌意的国家，应该限制贸易。'
