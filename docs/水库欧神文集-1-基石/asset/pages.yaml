  md: '但是，事情也有其反面。若真如此，今天最富有的人，应该是“粒子物理”科学家，或者数学系研究“数论”的老学究们。因为他们，才是走在整个人类科学最前沿，最底层的学问。可是事实并非如此。真正的科学家，往往是极穷的。问题出在哪里？问题在于“体，用，术”。


    最基础的科学，好比人类文明的大树。根基地在这里。这个方向一定要把准，绝对不能出错。在基础科学之上，“用”指的是应用科学。你精通了化学，这并不能帮你赚钱。化学要转化成应用。研究出一种新型去屑洗发水，牙膏，洗衣液，奶粉配方之美的。在大科学家眼里，这些应用科学自然是小儿科，不值一晒。可正是这些在“企业”里混泥的人，其收入往往是大科学家的二倍三倍，若能做到高管，更是幸福滋润。


    为什么，因为“应用科学”离消费者更近，离钱更近。


    从“理论”到产品，当中有很长的一段路要走。这段路之困难，之复杂，绝对不在基础研究之下。就好比您知道了“万物理论”，你也造不出粒子战斗机。当中还需要工程师几十年的研究。


    “体，用，术”，在“用”之外，还有一个术。


    术指的是完全末端的，不属于理论体系的，分散的，短期的似是与非的知识。好比门口王婆婆的烧饼比较甜。


    去坐电车可以穿过弄堂小路。地铁交通卡可以互换以节省成本等等。


    # 四）炒楼界的体、用、术


    花了这么大的力气来作铺垫，我们要说的是，作为一个合格的“炒楼客”，你需要怎样的学识修养。


    首先，你需要正确的基础知识。炒楼这一行，虽然对于自然科学，物理数学要求不高。但对于社会科学，政治人文财经的分析要求很高。


    人生基于“三观”，三观一定要正。先把头脑倒空，把脑子里乱七八糟的马克思主义调控等全部倒空。


    “体”，正确的信仰，首先你的政治经济学要对。方向要对。正确的流派，目前看来是“奥地利经济学派”。在中国的代表作是铅笔社，原因以后再说。


    可是“体”无需深究。如果你不想做个大科学家，也不想研究哲学的话，只需要大致知道“奥派”“铅笔社”是正确的就可以了。铅笔最前沿的一些学术观点也无需参与讨论。


    “用”，指的是水库论坛。


    我们知道了经济学上的一些大知识。譬如 M2 超发，譬如货币失常。可是如何让他们变成商机，变成钱，变成我们赚钱。这其中仍有大学问。点点滴滴，细说起来也是篇幅巨著。一架飞机的说明书，只怕比“空气动力学”还作更厚。


    “术”则是最外围的。譬如说，你买房，每次需要谈判下定之前。不要空手，去银行取几万元现金出来。现金最好是旧钞。毛线绒的看上去去一大堆。旧钞的厚度比新钞厚。等你谈判的时候，谈到关健要警处，把钱往桌上一推。


    “叔叔，我们很诚意买的。请你卖给我吧”。'
