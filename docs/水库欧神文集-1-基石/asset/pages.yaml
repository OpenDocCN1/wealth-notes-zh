    水庫存坛ShuiKu. net


    # 日本没有少数派 F110


    这两天《半泽直树》的讨论颇为热烈，chenzg55 写了许多赞美日本的话。我是懒得理他，要反驳的话，可以从上到头皮都割下来。


    今天下午，本来想写一篇“管理学”有关的文章，后来想了，这篇写了，多半也是给俺 LP 删除的下场。


    没有什么可写的话题，来剃日本人的皮吧。


    一）一八四零


    1840 年的时候，没有一个中国人怀疑，中国拥有全世界最好的制度。


    “君君臣臣父父子子”，三纲五常，天地方圆都可以在儒家学派的范畴内找到解释。内圣外王，理学和心学的发展也达到了顶峰。


    英国人懂什么，一群蛮夷。在官方的文书上，英国人最初的翻译是 (口英) 噗咔喇，意思是西人不识王法，与禽兽无异。所以一律加上口字。当然，同样的受害者，还有 (口法)
    哒嗒呕。


    当道光皇帝和他的大臣们，听到英国 Victoria 女王年方十八，尚未婚配。而且其国历史上有过三任女王，不由得哈哈大笑。纷纷说到：“西人愚昧，不知道其国已几易其手”。


    皇权是严格地遵循男性血统的。象一国政治如此混乱，不由得被清朝皇帝们大大地看不起。


    在满清朝廷的眼中，“英国政治”充满了谬误，犯了无数个错误，当然在错误的道路上越走越远。


    后来的结果呢，不说大家也都知道了。被英国人打得满地找牙。'
