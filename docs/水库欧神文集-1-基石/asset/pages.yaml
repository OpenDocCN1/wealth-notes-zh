  md: '其中 90%的人，问的都是信用贷。而外面接触的，几乎所有“水库山寨”流浪，统统全部是走信用贷。


    信用贷有什么好处呢。申请简单，金额庞大，懒人最爱。


    信用卡搞到五六十张卡以后，光每个月的空当接龙，就是一件细心而有毅力的活。能滴水不漏地做完的人，将来前途，至少是个高级经理。


    而信用贷多简单啊。只要你去银行申请，分分钟批你 30W。


    缺点呢，缺点就是贵。


    信用贷的正规利率是 13%，只有部分“体制内”，以及农行建行，偶尔会开恩大赦，批你一笔 20W 的只要 6%


    如果你用“信用贷”构建初始资金池，则你的资金成本，必然是很贵的。


    加权动辄超过 10%。


