    这一切都说明，信息不是人权，绝对不是天赋零权之一。


    回到商业分析之中，对于信息，他本身也是一种“商品”。也是成本之一。


    掺入多少，使用多少，全凭个人心意。


    你可以视为糖果盒的包装。


    举个例子，假设你是一个果农。承包了 200 亩的苹果园。


    每年秋天，会有专门的“果农贩子”上门收购苹果。


    你也知道“商人”是要赚钱的。可能在陕西卖 1 元的苹果，到了北京上海就能卖 3 元一斤。


    哪怕运到火车站的供销站，也能卖上 2 元/斤。


    这个时候，果农有二种选择。


    1）直接卖给果农贩子，1 元/斤。


    2）派你儿子到山下转一圈，看看哪里有更好的收购渠道，更贵的卖价。


    但是也有可能会呢，是你儿子下山逛了三天，然后双手空空的回来了。


    +   花了 500 元的差旅费


    +   一无所获


    +   还耽误了三天的工分


    你把旱烟杆往地上一磕，“作孽呀，早知道就不让你出去”。


    当然，这时候老农可以进一步“追加投资”，让你儿子再去到西安、郑州等城市碰碰运气。


