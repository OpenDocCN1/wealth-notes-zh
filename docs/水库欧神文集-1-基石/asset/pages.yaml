  md: '这样的设定，AB 之间还是有商业和贸易的联系。但是频率非常低，譬如每年一艘小船。


    好了，现在 A 岛都是由“勤奋居民”组成。他们有着高尚的品质和劳动精神，日以继夜地工作，发展科技，构造基建，法制清廉。


    而 B 岛都是“懒惰民族”。整天吃吃喝喝学黑人跳舞。拿到工资立刻花光不上班。酗酒偷窃斗殴撒谎，政治腐败。


    那么，我们要问他们几个问题；


    +   * A 岛经济可以发展么

    * A 岛经济发展，是靠剥削 B 岛而来的么

    * 如果 AB 岛间的航班彻底停开。A 岛经济会停滞么。


    答案至为简单。


    +   1) A 岛经济可以独自发展

    2) 没剥削

    3) 不会


    因为 A 岛的经济发展，可以视为 A 岛“内部”的事务。任何一个经济体，总是可以独立发展经济的。


    而 A 岛对 B 岛，也完全没有剥削。我一共一年才来一艘帆船。带来的物资微不足道。你怎么可以赖在我头上。


    我们再继续提问；


    +   4) A 岛会发生“经济危机”么。

    5) A 岛经济危机，是因为 B 岛“购买力不足”么。


    答案是：

    4) 会

    5) 不是


    这个解释也非常地清晰和明显。任何一个经济体都会发生“经济危机”。新城代谢，把腐朽的老态的公司们淘汰出市场。


    可是 A 岛的经济危机，是因为 B 岛“购买力不足”么。开什么玩笑。你一年才一艘船。


