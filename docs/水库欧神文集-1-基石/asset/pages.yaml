    楼市的科技树被锁死了么 #1970


    研发无力


    一）新闻 V


    12.22 我在北京参加 “新浪微博” 房产年度互联网大会。大家给面子，位置也挺靠近 C。


    俺是抱着 “学习进步” 的心态去的。社交场合，主要是结识各大流派高手。


