    | 6 | 冯仑风马牛<br>fengluntalk<br> | 7/10 | 32万+ | 29万+ | 32863 | 85122 |


    水库每天的访问量，都超过 100000+，一周累计超过 80W。


    地产类的榜单，绝不可能没有水库的。


    小伙伴们研究了半天，才发现原来水库被归类于《投资理财》。于是抱头痛哭。有一股韩国电影《紧急措施19号》的既视感。


    事已至此，小伙伴们继续追问，“要不，咱也去买二斤雪花膏，涂在脸上”。


    从今以后，水库冒充情感八卦号好了。


    情感八卦号，动辄 1000W 粉丝。


    水库这种小虾米混在里面，连前 100 都排不进。'
