    不管你去哪一个城市，在你下场扫货之前，先要看房 200 套。耗时数百小时。


    你要比当地土著更了解这个城市，你要比房产中介更精通价格体系。


    那你们“看房 200 套”了没有呢。


    没有啊！绝大多数的人，连 50 套都看不满，甚至连 30 套都看不满。


    “马马虎虎，差不多了”，他们这样安慰自己。匆匆忙忙看了五六套，就急着下定。


