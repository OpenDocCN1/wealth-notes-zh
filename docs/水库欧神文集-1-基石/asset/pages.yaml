  md: '可是你真心想一想，“究竟谁在投机”。


    你不知道金风科技的主营收入是多少，你不知道华锐风电的业务在哪几个省份，你不知道财务报表是按哪一年版本的会计准则，你不知道一般性收益和偶然性收益的区别。在绝大多**99%**
    的情况下，你甚至不能信任 A 股财报的真与假。


    中国 A 股对上市公司的约束几乎为零，中小股东对公司治理，更是完全毫无钳制。基本上**99.99%** 的中小股东，都没有看过**200** 页的季度报表。可以这么说吧，除了一个股票名称和股票代码，“你对这家公司一无所知”。你唯一关心的，是明天股票开盘价。


    股市里面拥有完备的“交易数据”。动辄下载几十 G 的信息包。


    等你掌握了哪怕全部的 K 线信息，你能涉足“企业管理”么。


    这家公司，黑箱打开，里面究竟是什么样子的，苹果甜不甜。


    大股东有没有掏空公司，有没有关联交易，有没有采购回扣。


    你一无所知，即使你知道，你什么也管不了。


    小股东微薄权益和保护，都伸张不了。


    买卖一个黑箱子，算什么本领。


    投资和投机的区别，在于买卖房地产，房子是“捏在”你自己手里的。


    不需要再经过一层代理人陷阱，明明很好的公司，就是不分红。再过几年，莫名其妙钱都卷走了。


    “控制权”才是上流社会的分水岭。


    买卖 K 线图这种事，下九流，不入流。


    # 炒股的 都是下九流


