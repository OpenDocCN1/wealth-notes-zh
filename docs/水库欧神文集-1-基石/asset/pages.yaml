  md: '+   - 未来对程序员的需求，是会增加，还是减少。

    - 程序员个人的薪酬，是会增加，还是减少。


    # 二）讲座


    说起程序员，绝大多是人是悲观的。


    而且越是业内的人，越悲观。


    而且社会上普遍有一种“反程序员”的态度。


    大家都是 985 的毕业生，我学机械，学工民建的，你学 EE 的。


    +   - 学机械的毕业，5K 一个月。

    - 学电子工程的，进 BAT，起薪 25W。


    这样的出路，自然很多人心里不平衡。


    “程序员是吃青春饭”


    “程序员 996，就和当年出租车司机，外企员工一样”


    “程序员短期短缺，未来会象山东蓝翔，翔大规模供应”。


    包括程序员内部，对程序员的发展前景，也是普遍悲观的。'
