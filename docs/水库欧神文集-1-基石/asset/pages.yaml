    这里面有一个核心的分水岭，可称“民富”。


    +   最基本的食物，保证卡路里，米饭肉食蛋白质的摄入。


    +   最基本的衣服，日用品，吉利汽车。


    +   最基本的盗版CD，网络游戏，广场舞。


