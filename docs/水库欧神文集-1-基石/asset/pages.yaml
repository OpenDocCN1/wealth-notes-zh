- pgno: 221
  md: '可想而知，面对“市场派”铺天盖地的指责，交通部官员，只要再坚持几个回合。明年，后年，继续十一、春节的免费政策。那么明年的高速，绝对不会如此拥堵，明年的市民，将会有一个畅快的出行体验~~~而且是免费的。


    届时候，这事情一定会成为交通部的德政，并且作为政绩大肆宣扬。


    2）谁是受害者


    免费的一定比收费的好，收 1 元肯定比收 10 元好，这是无可置疑的。经过二三个回合的混乱，几次博弈之后，市场一定会把效率配置得更好。高速一定会又免费又不塞车。铅笔社在这件事情发难，那是自取其辱。


    哥哥之所以不打游戏来写文章，因为很铁不成钢。你们说话都没抓住重点，在这场游戏中，谁是输家，为什么说交通部政策是大恶？


    高速公路的所有者是输家。


    我辛辛苦苦造就这么一条高速公路，开山劈斧，填沟架桥，投巨资耗漫长岁月，才造了这么一条路。以后还要养护，维修，增设附道和网络信号，这么多劳动投入，还不就是为了你
    10 元车资路费。


    本金是我筹措的，路是我建的，贷款利息和养护费用也是我支出的，现在国务院领导出来讲话了，说出德政了，不是去我家而是去你家吃饭免费啊~~！


    按这样的逻辑，国庆期间，去中石化加油，是否可以免费提汽油走。在大超市购物，是否免费拎走一些油盐，以慰俺过节受伤的心。去吃一顿日式料理，把北极贝吃完了，也不用买单。


    本届政府最不好之处，就总是喜欢慷人之情。高速免费好事吧，是德政。中央财政不掏钱，请自己去高速公司取。房地产价格太高了吧，中央政府不补钱，请房产商自己降价，流道德的血液。


    说起来，好事名声都是你的，请到你家而不是我家来免费吃饭。'
