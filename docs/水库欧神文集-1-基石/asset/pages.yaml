  md: "# Smartpass 的赢利模式 #F1070\n\n原创 2017-05-04 eyeon_ou 水库论坛\n\n![](img/f67be513638d053b62bd7b01d459b241_389_0.png)\n\
    \n# Smartpass 的赢利模式 #F1070\n\n彩蛋在最后一句\n\n# 一）前言\n\n前两天有人问我，采棉花和榨糖，是完美互补的行业。\n\n\
    +   - 采摘棉花主要在夏季，七八月份。\n    - 甘蔗榨糖主要是冬季，十二月一月。\n\n如果一个人，夏天打工新疆摘棉花，冬天打工广西榨糖。那么真是完美。\n\
    \n同样道理，泳装批发和羽绒服批发。\n\n年货烟花爆竹，新学生“九·一”套装，也是完美的搭配。\n\n那么问题来了。和炒房最匹配的，是什么行业。\n\n\
    哥哥毫不犹豫，立即回答：“预付费卡”类。\n\n小密圈的朋友不依不饶，继续追问。“预付费卡”是什么行业。\n\n靠什么赚钱。\n\n赢利模式如何。\n\n\
