- pgno: 201
  md: '| | 原本 | 涨价后 |

    | --- | --- | --- |

    | 储蓄 | 2000 | 1800 |

    | 房租 +100 | 2500 | 3200 新+2 |

    | 吃饭 | 2500 | 2300 |

    | 交通 | 500 | 450 |

    | 衣服购物 | 1500 | 1350 |

    | 休闲 | 1000 | 900 |


    “替代效应”和“财富效应”是挺绕的。


