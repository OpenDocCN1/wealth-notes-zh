    你还不如果个思路，承认“绝对零度”不可能达到。

    世界上一定会有君王。我们唯一指望的，是君王的行动力尽可能地小。

    君王的人口尽可能地少，君王的组织尽可能地小，君王管的事尽可能 的少。

    500 个家庭的制度，就很不错。

    嘎，嘎，嘎，你这个理论听起来一点都不“完美”嘛。一点都不高大上。无政府都是完美主义者。

    通往地狱之路，往往由善心铺就。

    一个直面现实，毫不高大上的理论，实践中往往比“圣母心”更好。


    六）民主


    # 经济学第三定律，暴力无法根除，只能被尽量削减


    无论如果，美利坚一定会出现一个最强大的“海陆空”三军集团。拥有最强大的最终威力。

    美国国土上没有任何力量可以和这个组织抗衡。

    小布什有一句非常讨巧的名言，“民主和独裁的区别，就是民主把权力关进了笼子里”。

    关进了笼子里，老虎不吃人了？

    错，全错。这句话是本质错误的，因为他违背了经济学第三定律。

    既然“最终暴力”无法消除。很多人构想了一种办法，将“最终暴力”交给人民。

    “取之于民，用之于民”。

    如果我暴力的影响着全体人民，把我把“权力”交给人民。岂不就是抵消了。

    美利坚三军将领总司令，集体对议会宣誓效忠。

    人民进行“普选”。得票最多民选上台的，就是总统。总统对人民负责，岂不就是“将权力关进笼子里”。

    非常遗憾，这件事情实践的结果，非常糟糕。甚至比全世界大多数的政体制度还要更糟糕。

    民主来到这个世界，从头到尾，每一个毛孔都流淌着血和肮脏的东西。

    因为你理论上“民主”是全体人民的代表。

    而实际上，“民主”并不是全体人民的代表。民主仅仅是51%的人口代表。

    51%和100%，这是本质上的概念性区别。


