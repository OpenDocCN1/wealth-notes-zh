  md: '![](img/f67be513638d053b62bd7b01d459b241_344_0.png)


    想必，各大舆论媒体，关于 AI 的报导又会铺天盖地。

    舆论媒体小编，兴致勃勃地至少灌几百万 “AI 时代”的注水文。

    股票市场大涨，谷歌和其他 AI 概念股，会有不错的涨幅。


    我们想说的是，“以上全错”。

    为了讲清楚这个概念，我们先要从“人工智能之父”Assimov 说起。

    阿西莫夫是“科幻小说”作家。不是科学家。

    他在 1950 年代提出了著名的“机器人三定律”，并影响了整整一代人。


    +   1)     机器人不得伤害人，也不得见人受到伤害而袖手旁观。

    2)     机器人应服从人的一切命令，但不得违反第一定律。

    3)     机器人应保护自身的安全，但不得违反第一、第二定律。


    就好比我们都是听“王菲演唱会”长大的。今天统治西方的那群人，主流程工程师，主流科技精英，也都是看《阿西莫夫科幻小说》长大的。

    阿西莫夫提出了“机器人三定律”，当时仅仅 1950 年。二极管还没有取代晶体管。可以说整个计算机工业都不存在。

    而“机器人三定律”，宛如思想钢印一样，从此刻在了整整一代西方人的脑海里。被誉为“人工智能的圣经”。以及 AI 的发展方向。'
