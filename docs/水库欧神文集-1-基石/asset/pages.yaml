    # 生产与抢劫 #60


    我们这个社会的全部生产关系，大致可以概括成二样事：生产+抢劫。


    一个国家的抢劫越少，则国家越富。


    # 一）强国之路


    一个国家怎样才能叫国富民强，称雄于地球。每个月造一艘航母，打得三本五十六抬不起头。很简单，经济学第一定律，dT>0


    只要给予民众自由，让“交易”自由顺畅的发生。交易越多，国力越强。天下无敌。


    但是，为什么还有那么多的战败国？


    为什么有的国家贫穷落后，积贫积弱。虽然明知道了你的 dT>0 药方，可国家还是一穷二白。不要说 1840 年未开化未接触西方科技的清国。我们就说说 2015
    年活在地球另一角的北朝鲜。北朝鲜几乎拥有人类已知文明的所有工业科技。煤炭，炼钢，化肥，科技水准比 1850 年英国还要强上一大截。为什么北朝鲜发展不起来。穷到要饿死人。


    因为，在这些国家之内，还有另一股力量，在破坏着生产。


    # 二）生产和抢劫


    从目前来看，人类获得物质财富的方式无非二种：生产和抢劫。


    从收入来讲，“抢劫”无疑远远快于生产。其差距是十倍，数百，数千倍。


    农夫辛辛苦苦种植一年的粮食，山贼二个小时就可以抢光。


    可是从全社会的一个大框架来讲。“生产”却才是根本。


    因为抢劫不创造财富，抢来抢去，只会使全社会的资源越来越少。到最后大家一起饿死。


    抢劫至少造成了二层破坏；'
