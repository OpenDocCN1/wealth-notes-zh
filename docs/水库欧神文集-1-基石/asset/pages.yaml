  md: '这种地名，给我写，俺都不敢碰。


    # 二）科技树


    吐槽完这些不靠谱的“新闻 V”“作家 V”“悲情 V”，就遇到了我们第二个问题。


    吃饭的时候，“魔都财观”偷偷拉着我说道：“老大，最近有什么新的科技树”。


    我大为诧异，“此话怎讲”。


    观观尴尬地推了推眼镜说道，“你也知道，近两年上海楼市的经济和行情，都不是太好”。


    “按照原有的手法和技巧，大家赚不到什么钱”。


    “前二天，上海大小的 V，和管家公司们，闭门开了一个会”。


    “研究新的对策，和生存之道”。


    结果呢…………


    “结果大家二壶茶喝下来，发现整个‘楼市学’的核心体系，还是水库那一套”。


    “说来说去，最后总结的手法，还是叠债务”。


    嗯，所以新浪开会，最后还是想到了我。


    这么多做“楼市研究”的 Vs，你们都研究了啥。


    市场不好做，生意难赚，就想问问有没有新的免费的“武林秘籍”。


    难道我不说，你们就不会自己研发么。


    # 三）被锁死的科技树


    我举二个例子。第一个例子，是 1945 年之后的欧洲。


    众所周知，1945 年二战结束，是人类的一个重要分水岭。'
