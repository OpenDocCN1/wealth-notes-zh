    # 五） 节拍和起伏


    还有嘴硬的毛左坚持说，“我们知道计划经济也在犯错误，可我们就是喜欢他的稳定感”。


    举个例子，好比市场经济的增长率是 6%, 8%, 6%, 5%, 6%, 8%,

    计划经济的增长率是 5%, 5%, 5%, 5%, 5%, 5%


    可是毛左的嘴里，计划经济丑也丑得可爱。你看我们的成绩稳定呀。


    周星驰语：“人生的大起大落，实在是太刺激了”。


    对于懦夫而言，稳定也是一种享受。


    可问题是，不仅仅“无经济危机”是一种不值得追求的目标。


    它也是不可能被追求的。


    5%, 5%, 5%, 5%, 5%, 5%, 这样的稳定增长率。在理论上就是不可能实现的。


    为什么，我们来看看邻国的澳大利亚。


    时至21cn之后的国际社会分工，澳洲主要的角色是矿产出口。澳洲 2400 万人口，比北京市略少。


    其主要的国民经济，以及运转逻辑，已经越来越倾向于一个“China 的原料供应国”。


    当 2010~2014 年时，中国的经济非常好。“铁公基”大量项目开工。对能源和矿石的需求非常大。


    这一段时间，澳洲的经济非常好。澳元汇率节节上升。三大矿业巨头日夜开工。


    可是到了 2015 年时，中国经济遭遇寒冬。对铁矿石的需求大幅减少。


    China 整体的工业放缓，对能源和矿石的需求大大减少。


    而这时候，澳洲的经济就放缓了。澳元大幅下跌。哪怕保守党政府再努力也没用。


    这说明了什么道理。澳洲的经济，是严重受“外部环境”影响的。


    美国次贷危机欧洲金融风暴中经济放缓，外部世界的起伏，是你不能控制的。则澳洲的经济“起伏”也是不能控制的。


    无论你计划经济还是市场经济都一样。


    就生产力资源而言，他本身就有“起伏”的。好比山西一个煤矿被采光了，80 后某一个年龄段劳动人口减少了。中东局势动荡，原油价格波动。


    这些东西，每一个都会影响“经济衰退”。


    你非要强调“无周期”“无起伏”。这是毫无意义的。难道我抚顺煤矿光了，东三省经济还能和以前一样？


    从历史上看，苏联体制国家，也没有任何一个做到了“消除经济周期”。


    马列理论纯粹就是骗人的。骗知手上的 SB 的。


    看什么看，说的就是你！


    在正统的经济学上，从来没有“经济周期”的提法。


    看清楚，人家根本没这个提法，也不认为这是一个困难。更不认为这是马克思“解决”了一个困难。'
