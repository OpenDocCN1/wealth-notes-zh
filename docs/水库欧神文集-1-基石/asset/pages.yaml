  md: '# 二)  白领视角


    我们现在的主张，申述，要求，可以统称为 “白领视角”。


    白领视角的意思，就是我坐办公室的工资，应该高高高高高。一个月二三万不够花。


    而我的消费，应该低低低低低，所有的物价，都必需降降降降降。


    这样白领才能活得象白莲花一样。


    而在经济上，在政治上，这样的 “白领诉求” 是**绝对绝对错误的**。


    +   - 一人所失即一人所得。


    +   - 一个人的消费，就是另一个人的收入。


    你白领去按摩足浴，二小时 118 元。你的 “支出”，就是按摩技师的收入。


    如果你渴望 “降价” 到 98 元，按摩技师就会降薪，就会活不下去，就会养不活父母家人。


    白领们渴望医疗费，教师费，铁路费，餐饮费下跌。


    其实你就是在**剥削**医生，教师，铁路工作者，服务侍应生的收入。


    凭什么你坐办公室的就高人一等。


    凭什么你大学生就高人一等。'
