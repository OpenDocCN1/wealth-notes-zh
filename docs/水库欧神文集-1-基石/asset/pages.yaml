- pgno: 514
  md: '# 二）醒悟


    媒体 “正义，光荣，无冕之王” 的形象，是谁告诉你的？

    是媒体。


    那么，这句话还值得相信么？！


    很多很多年以后，我们才从这个大坑里爬出来。好大的一个坑。


    那么，媒体的真正面目是什么。


    媒体既不正义，也不善良，更不会挺身而出和强权作斗争。揭露真相，披露事实，媒体人对啥毫无兴趣。


    除了在电视电影作品中，我们从来看不见《塘鹅暗杀令》之类的媒体英雄。


    媒体舞弄事实，引导舆论。编造谎言。奉迎强权，敲诈勒索，见钱眼开，对强权的遏制力几乎为零，却大规模制造谎言。


    比较典型的。譬如 CCAV2 的《经济半小时》。


    因为我们本身是做房地产的。我们对这一行了解非常非常之深。在房产这个狭小范围领域内，几乎一眼就可以看出真伪。


    2005 年加营业税，这是对市场致命的打击和破坏。而媒体小编给出的标题却是《全国人民喜迎营业税上涨》。


    交易成本从 2%增长到 8%，是对交易量的毁灭性打击。


    可到了 CCAV2《经济半小时》口中，却变成了成交量极大放大。人群挤满了整个房产交易大厅。


    中央领导一看，加税了四倍，交易量还能放大，税收大滴漏，龙心大悦。


