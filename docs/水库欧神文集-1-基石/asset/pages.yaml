  md: '# 论买不起 #F330


    原创 2016-03-10 eyevon_ou 水库论坛


    ![](img/f67be513638d053b62bd7b01d459b241_289_0.png)


    ![](img/f67be513638d053b62bd7b01d459b241_289_1.png)


    # 论买不起 #F330


    +   - 为什么有人仇视资本主义

    - 洋货的冲击，真的使中国的手工艺人纷纷破产么

    - 经济的发展，使你买不起房么？


    # 一）脑容量


    前天兴之所至，回知乎一个贴，洋洋洒洒写了七千字《论生产过剩#F320》。


    通常，人的大脑有一个 Memory Size，16G 或者 64G 的。


    换算成人类语，也就是一篇文章，前 3000 个字你讲道理。


    超过了 3000 字，普通人就 Memory Full 了。后面的内容就象天书，来不及消化昏昏睡着。


    所以我估计前天那篇，各位也就读到了“澳洲不在乎经济周期”。


    再往后的，左耳进，右耳出。


    今天早上想想，道理还没有讲透。


    +   - 经济周期，基本上是讲明白了。

    - 购买力不足，很多人还是懵懂。


    所以我们再补一篇。当然，本篇也可以独立成章。


    # 二）草莓


    1980 年的时候，麦当劳想要搞一款草莓冰淇淋。


    产品设计得很成功，成本性价比也很好。进行了小规模的消费者试吃，反应非常热烈。


    最后，麦当劳想要全球推广这款产品，把它加入到主力菜单中去。


    临到推出前一秒，一个负责的产品经理，稍微计算了一下数量级；


    “仅仅北美地区预期月消耗量，就超出了草莓全球年产量”。'
