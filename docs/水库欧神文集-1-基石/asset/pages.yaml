- pgno: 373
  md: '我想跟各位说，你现在所熟悉的社会，未必是一个常态。


    你 35 岁时拥有的东西，往前 30 年未必存在。


    往后 30 年，也未必存在。


    # 书籍就是这样一类东西。


    # “书”的存在，难道就是亘古永恒，天长地久的么！


    你往前数，哪怕仅往前回溯 100 年。


    1917 年的中国小朋友，难道是每个孩子出生了以后，都有玩具玩，都有儿童书，都有婴儿奶粉喝的么。


    往后 1000 年，2117 年，他们会看书么。还是看 iPad。[1]


    我们习以为常的事情，校园记忆的事情。


    1990 年我刚上中学，到图书馆借武侠小说看。同学之间互相流传阅漫画书。《圣斗士星矢》都快被翻烂掉了。


    我们对这些事情熟悉，刻骨铭心，镌刻在脑海记忆里。


    可是你有没有想过，这样的青春，是天经地义的么。


    我们的儿孙，后辈，会和我过一样的校园生活么。


    当我们清醒下来，一个象哥哥这样无可救药重度怀疑论者不可知论晚期，马上就发现不对了。


    # 事实上，我们买书的频率越来越少了。


    # 三）Amazon


    Amazon 搞了一个作家计划。号名叫“彻底消灭出版商”。


    在 Amazon 看来，“中间商”这种生物是不被需要的。


    美国每年大约出版 50 万本书，而独立书店十分有限，在 1500 家的规模。


    这意味着每一本书都得不到“充分的展示”。


    书籍的竞争十分残酷。


    每一本书，一旦放上门口堆头位。必须立刻产生销售。如果不能销售，则迅速被撤换。


    象电影《2012》中，作者的书卖了 428 本。这是完全可能的。


    有人开玩笑说，“书籍已经变成一种易腐烂商品。其保质期介于牛奶和酸奶之间”。


    Amazon 于是想出了一个计划。他们直接和作家签约。


    作家写完 Word 文件，直接封打在 Amazon 的橱窗栏里面。


    +   - 没有库存

    - 没有保质期

    - 没有印刷

    - 没有展示位限制

    - 不需要听挑剔的，没有品味的，低级庸俗的出版商“买手”苛刻刁难。*老泥笨不*真经*非说我这书卖不出去不肯给我封推展示位下架鄙视你垃圾。*

    - 在我看来，Amazon 这想法是好的。也极其充满了创意。'
