    “市场创造一切，除了市场本身”。


    “暴力”这个元素，你必须单独抽出来处理。暴力不可以交给市场，因为暴力和市场是不兼容的。暴力也无法被纳入方程式中。


    当城外拥有几千名蛮族骑兵时，你也必须建立一支自卫队。人数也需要是几千人，至少不能低过蛮族的战斗力。


    当城外有几万名蛮族骑兵时，你也必须建立一支自卫队。人数不能低于几万人，不能低于蛮族的战斗力。


