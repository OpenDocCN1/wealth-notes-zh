    # 三）算法


    1997 年，IBM 公司的“深蓝”计算机。正式击败世界棋王：加里·卡斯帕罗夫。


    当时，这件事也是引起了轰动。


    几乎是吹得没边了。滥竽充数心灵鸡汤都出版了许多本。


    而如果你“踏踏实实”，仔细研究一下这件事的话。


    “深蓝”的源代码一共有多少。


    答案是，一共才 2000 行字左右。


    按照一个程序员一天写 10 行。一个 20 人的腾讯团队，十天就可以写完。


    因为“深蓝”的算法简单之至。他其实是“穷举算法”。


    也就是说，“深蓝”本身，对整个国际象棋世界一无所知。


    他就是“穷举”。就是内存大。


    当每一步国际象棋，十六枚棋子若是有 50 个分岔的话。


    则我就 50^10，十次方。


    我就仗着内存大。和你蛮算。


    其中，“国王”的定价是 1000，皇后 9，车 5，马和象 3，小兵 1。


    每一个分叉算法中，取“棋力差”最悬殊的。


    棋力相等的。选“控制格”最多的。


    所以，“深蓝”虽然被吹得神乎其神。


    但其实他的“算法”是非常简单的。非常草率的。


    甚至说，我国际象棋只要改了一个规则，你整个的算法就要重写的。


    同样道理，“Master”是怎么回事呢。


    “国际象棋”被屠掉以后。中日韩的围棋选手，还心存侥幸。


    “围棋”的生存优势，是围棋的棋盘特别大。有 19*19=361 格。


    因此每一步下棋，就有 361^10，N 次方的变化。


    这对于计算机是一笔巨大的负担。


    要达到“深蓝”级的彻底穷举，需要多得多的云计算，服务器并联。


    可是在 AlphaGo 的对阵中，他改进了算法。


    增加了“价值网络”的算法。也就是对整条分支树进行预判，如果觉得亏子，直接就不展开了。


    象虚竹这样“置之於死地而后生”的情况，就不会发生了。


    AlphaGo 的算法，要比“深蓝”复杂一点。


    肯定不止 2000 行。估计在 5000~10000 行之间。'
