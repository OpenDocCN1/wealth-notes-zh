  md: '他们觉得自己创造了大量的价值，创造了大量的财富，构建了整个社会物质富裕的阶石。可为什么他们连套房子都买不起？


    因为你的财富被政府剥削了大头。


    因为兰博基尼的工程师，耍卖掉五套 Lamborghini，拿回来的工资，才够在市场上买 1 辆正价兰博基尼。


    # 四）短链


    一名兰博基尼的工程师，如果他想拥有一辆Lamborghini，那么最好的方法是什么？


    最好的方法是，他自己造一辆。然后不要去市场上卖。就直接开回自家的后花园。


    这就是短链。英国人也称之为 DIY.


    如果你想拥有一张木椅，最好的方法是什么。


    最好的方法不是辛勤工作，拿到了工资交 45%税後。而是及早下班，回到家自己劈二块木头自己组装。


    1960 年代，因为太严重的税负，和太不合理的劳工法管制。DIY 盛行始于英国，并风靡到整个欧洲。


    如果你想要一个木椅，去宜家买二块木头，自己拼装。


    如果你想要通下水管，买本说明书自己通。


    如果你想要刷墙刷屋顶，买二罐油漆自己刷。


    毫无疑问，DIY 是历史文明的倒退。是对社会大分工的极大破坏。自己刷油漆，自己通下水管，绝对比不上找训练有素的工人。既省时间，质量也高。


    但是因为政府的税费实在太为昂贵。一个优良的心脏外科医生，他的时间绝不会拿来多救二个病人，然后交 45%的税。他宁可极不熟练地干着泥水匠的活。


    想起了美国西部片，不知道是不是“印第安纳·琼斯”某部情节。


    说主人公公历经千难万险，最终依据藏宝图，挖出了沙漠深处隐藏的黄金。


    然后他们兴冲冲地拿着宝藏回到了美国。危险丛生的丛林都度过了，食人蚁吸血虫都干掉了，困难怕什么呀。


    国税局官员抬头看了一下他们的行李，说：“外国货物进入美国，先交 45%的关税。你们二个没有申报收入，所得税的 60%要交给美国政府”。


    “嗯，这些东西要在美国销售，得交 8%的销售税还有 7%的州税，还有 2%的市税”。'
