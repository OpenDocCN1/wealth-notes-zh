  md: '# # 牛奶为什么要倒河里 #F1350


    原创 2017-10-23yevon_ou 水库论坛水库论坛


    ![](img/f67be513638d053b62bd7b01d459b241_234_0.png)


    ![](img/f67be513638d053b62bd7b01d459b241_234_1.png)


    # 牛奶为什么要倒河里 #F1350


    本文是纯经济学


    每一步都要付费


    一）前言


    前两天，有人在后台留言说：“最近什么都写，就是不写房子”。


    《水库论坛》是一个讲楼市的公众号。可是最近东一锤子，西一锤子。


    长久以往，便如同我们在#1 中所写的：


    +   - “每一篇都是精华，独立成篇都是好文”

    - “可是凑在一起，却毫无主线。珠玉不成串，无框架体系”。


    嗯，我承认，最近十几篇写的，全部都是垃圾。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '本来稿箱中的文章，应该是《一刀流心法》《拖延流》《水库 90 后》《团购的力量》等


    但是，这些都不能写。


    **开会啊！**大哥！


    加强中国梦学习，核心价值观，富强民主团结。


    封号啊，大哥！


    俺还指望这微薄的广告收入，补贴家用呢。


    麻烦别催了。再等二月吧。


    微信菜单中，有“目录——广告入口”。各位金主多多投放。感谢衣食父母。


    二）牛奶


    今天这篇，我们纯粹讲一个“经济学”原理。


    因为昨天有人在知识星球提出一个问题：


    ![](img/f67be513638d053b62bd7b01d459b241_235_0.png)'
  merge: -1
