  md: '整个社会的物质财富，纯粹由**劳动**的年轻人制造。


    对于老年人的利益，他们肯定希望**价廉物美**。


    老年人肯定希望生产者越多越好，劳动者越多，则物价越便宜。食利者才能长久生存。


    而“引进劳动力”意味着什么。


    引进的人口，全部都是青壮。


    这些人会拉低人力成本价格，**拉低工资**，拉低物价。


