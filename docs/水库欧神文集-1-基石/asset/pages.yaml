  md: '其中有一句话，让我觉得似曾相识。


    +   * 股市和楼市的两大差别，门槛和数据真实度。

    * 股市的门槛低，但是数据真实度高；

    * 楼市资金门槛高，但是往往很多城市的相关数据，都是经过美颜处理的。


    2007 年的时候，哥哥当时还在天涯晃悠。


    天涯有一堆看空的傻 V，类似于小象爸爸，天上的一朵云。较奇葩的，还有一个叫做“黄祖斌律师”的。


    黄祖斌那帮人，属于“技术分析派”。


    “技术分析”啥意思，就是完全只看 K 线图。根本不需要 F10, 从来不打开看“基本面”的。


    从来，股市里“基本面”和“技术面”就是二批人，互相都看看不起。


    只不过 2007 年那一次，黄祖斌不知道怎得，咬到了楼市身上。


    黄痛斥楼市是一个不透明的，投机的，疯狂炒作的，连赌场都不如的骗局。


    原文在这里：《房价与股价的四大区别》


    bbs.tianya.cn/post-house-62142-1.shtml


    哥哥懒得，一直到四年后才写了驳斥：《究竟谁在投机》


    bbs.tianya.cn/post-house-292892-1.shtml


    # ## 二）四大区别


    当年，有人痛斥楼市是一个“不透明的，投机的，疯狂炒作的，连赌场都不如的骗局”。'
