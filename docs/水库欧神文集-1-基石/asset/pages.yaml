  md: '唉，后继无人，后继无人啊。


    中华武林人才凋零，真的是没人啊。


    首先我们来看这个问题。


    任何智商稍属正常的人，看到这篇微博，都会知道发生了什么事：“水军+洗地”。


    这个手法实在是太拙劣的！


    你比武打不过人家。于是就去诬陷别人“不爱国，反华，汉奸”。


    技不如人，就道德人身攻击。


    令人作呕。这个“洗地”我给零分。属于有勇无谋蛮干性的乱洗。


    前二天在水库微信群，有个小妹妹被诬陷构逼得哭出来了。


    明明买了二套四万元的化妆品，却被人说是代购。后来干脆传成了化妆品柜台营业员。


    我叹了口气，“要想克服坏人，就必须懂得比坏人更坏”。


    那怎么比坏人更狡猾，更奸诈呢。


    譬如徐晓东/雷雷这个案子。怎样连消带打，洗干净武林的颜面，为武林脸上贴金。


    很简单啊。


    **雷雷根本没有输给徐晓东。太极拳根本没有输给西洋技法。**


    **雷雷收了钱，打的是假拳。**


    各大洗地稿请统一按照这个格式进行散播。


    # 二）编故事


    中华武术，博大精深。


    一挥手扔出一个原子弹，一跺脚扔出一排迫击炮。


    裤裆里藏手榴弹，扔飞刀可以打飞机。


    内力修到精深处，那是排山倒海，雷电光鸣。啪啦啪啦。


    如果论功夫，西洋武术根本不够中国高人打。随便伸出一根小指头，就打到内伤。


    那么，雷雷怎么会输给徐晓东的呢。


    很简单。雷雷收了徐晓东 200 万。


    其实太极并没有败。真要论打，一百个徐晓东也不够太极拳师推手的。


    是徐晓东塞了钱，打的假拳。


    为什么要塞钱。因为徐晓东是汉奸，是败类。他想要推广西洋武术。想让中国传统武术没有人学，消失在历史长河。


    西方反华势力，长期对中国武术心怀忌恨。西方想要入侵中国，可是被“手撕鬼子”的神功吓破了胆。如果中国人人都学太极，那么中国人就是不可战胜的。


    所以西洋汉奸徐晓东付了钱，买通了太极拳师，演这样一场“假拳”。


    善良的群众可千万要把眼睛擦清楚了，别被骗进去了。他们都是聪明人不是。


    （旁白：这鬼话也有人信。答：还真是有人信）'
