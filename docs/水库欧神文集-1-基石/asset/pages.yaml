    # 六）批改作业


    在《从来不存在四万亿 #850》一文中，我们写道：

    和傻空辩论讲道理，是一件很困难的事。因为他们的逻辑断层太多，多到了难以批改作业的程度。

    譬如一篇典型的傻空作文。写到了“因为A，所以H”的分析。

    他是这样写的：A->B->C->D->E->F->G->H

    但是你和他说的话 A->B 是错的。

    B->C 也是错的。

    所以 A->“Not B”->C，

    也就是A到C的逻辑反而是顺畅的。负负得正。

