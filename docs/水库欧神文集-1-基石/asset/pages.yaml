  md: '也就是说，这 2500W 人的快乐程度，可以无止境地向上追求。GDP 可以无止境地向上攀升。永远也不会有“失业”或“产能过剩”的烦恼。


    # 四）纸醉金迷


    今天中午去大董吃了一顿饭，1309 元。点了一只烤鸭和一条糖醋鱼，三文鱼若干。我当然知道在顺义农场买一只鸭子，或许只要 50 元。但这并不妨碍我花 268
    元买一份北京烤鸭，而且还吃得津津有味。


    这其中的 268-50=218 元，就是**服务业产生的 GDP**。而我吃得津津有味，很乐意为之付费。


    你如果细想一步，葡萄在全世界都是不值钱的。一箩筐或许就 5 欧元。但是葡萄酿成酒，最终做成陈酿，做成高档葡萄酒。其价值是没有上限的。


    我的生活真的是很简朴很简朴的。花得绝对不算多。而奢侈是无止境的，消费也是无止境的。如果每个北京人每天多吃一顿烤鸭，看一场电影，北京 GDP 立刻翻翻。


    消费型城市另一个特点，是他的收入分布，和“一个车间主任+100 个工人”很大不同。


    在整场消费之中，厨师，服务员，广告，餐厅设计，交通停车，仓储物流，银行信用卡，每一个环节都要收费。店主虽然收了我 268 元烤鸭，但其净利润只有 10%~15%。


    于是，一个以“消费为主导”的城市，诞生了众多中产阶级，专业人士，Freelance。这些中产阶级进而诞生了自己的风俗和文化。


    职业分布决定中产分布。不要抱怨中国为何没变成纺锤型社会。而是要想想：


    +   - 中国有多少个城市，是关在车间里闷头苦干的城市。


    +   - 中国有多少个城市，是纸醉金迷**互相狂欢**让大伙儿都活得很舒坦。


    # 五）消费型城市和房价


    房价和 GDP 并不直接成正比。


    中国有好几个矿业 GDP 很高的城市，譬如大庆，克拉玛依，白云鄂博，至于海上油田基地就不说了。


    但这几个矿业城市，房价并不高。


    同样的城市之中，上海和苏州，北京和唐山，人均 GDP 相差不远。但房价却相差很多。


    纵观世界，我们可以发现，凡是房价高的，一定是“消费型”城市，绝对不可能是“生产型”城市。


    因为人类最终追求的，还是愉悦的生活。


    你可以被关在航空航天基地一整年，但这并不是你希翼的生活。


    最终你的生活，还是要回到“小天堂”，要在大城市纸醉金迷一番。


    人们很少会留恋富士康般的工业园区，但是上海静安，北京金宝街，香港中环，却是多姿多彩精彩人生之必备。


    另一方面，消费型城市会诞生大量有购买力的中产阶级，而不是寡头。也为住房的购买打下了基础。


    我们曾经说，这是“一个波澜壮阔的大时代”，**屌丝进城，巨型全国性市场形成。整个社会处于巨大变革期。**


    而这一轮的进城，和 90 年代还是不同的。


    **90 年代，进的主要是“生产型”城市，一个个工业园区。**'
