  md: '全国的四五线城市，99%的物业都是“不办证”的。


    因为没有必要。


    政府提供的这“防止一房N卖”功能，抵不上4%税的诱惑力。


    农村也不会有人谋夺你的房子，都是衬亲。


    # 四） 地券的国有化


    好了，那么为什么中国的“房产证”，日本的“地券制”。


    这薄薄的一页纸，实行了之后，居然使各地方大名叼若寒蝉。如履薄冰。


    纷纷喊道“国有化”呢。


    各位，肉食者鄙。


    真正的谋略，是远远超出你的想象的。


    上层社会的算计，对于底层民众来说就如神仙般的指指。


    日本的“地券”制度，中国的“房产证”。


    最初的时候，都是在田墨农间。竖一张桌子“免费办理房产证”。


    乡工所的工作人员，费尽口舌。劝说你们办“房产证”是一项德政。


    是为了老百姓好。防止一房多卖。是政府提供的一项惠民服务。


    而另一方面，所有的小学生，都要进村公所。都要接受“义务教育”。


    朋友，你读一年级的场景。你还记得么。


    当我刚读一年级时。俺老师就教导俺们“办证”。


    “结婚要领结婚证”。那些乡野村妇粗鄙没有文化，以为摆二桌酒就算结婚了。我们都是文明人，今天上学了，是小学生了。不能再有文盲的样子。


    “买房要办房产证”，房产证才是保护你产权的唯—办法。那些没教育的文盲不懂房产证。


    现在你们都是小学生了，文盲要被小学生笑话。'
