- pgno: 390
  md: '![](img/f67be513638d053b62bd7b01d459b241_390_0.png)


    欠稿太多，挖坑要填。


    各位一直催着“Smartpass 卡赢利模式分析”。


    正巧前天2天俺老娘，花 2000 元在文峰办了一张 5 折的白金卡。心血来潮，不妨就此事分析。呵呵，你知道文峰的赢利模式么。


    # 二）赚钱


    话说前2天准备给幼儿园老师送礼。唉财务拿来了二张“斯玛特”卡。俺接过来一看，面值 500 元。但其实却是 480 元的。


    财务解释说，拿来的时候渠道费用 10 元，押金 10 元，凭卡可退。


    俺反正也不在乎，反正都是送老师的。


    付费卡这种东西，看似平平无奇。都是一张卡片。


    储值 500 元，面值也是 500 元。平白多兜了一个圈子。


    要它何用。


    但是从 Marketing 的职业病，深度分析下去。这里面赚钱的机会可真不少。慢慢道来。


    +   1）售价差异

    500 元买的卡，实际面值只有 490 元。卡销售方有时候是不足额给你的。这个问题不是太大。


    +   2）利息差额

    有一件事情一定要想清楚。斯玛特卡拿到手，并不是马上消费的！

    一张卡的消费链条，其实是很长的。

    从公司财务去统一采购，到发到我的手里。


    一笑加一笑 (微信号: 150500211) 邀您加入水库交流群。群内文集每月一更新.....'
