  md: '这件事情，要说明白不容易。让我们慢慢道来。


    # 一）歧视的本质


    首先，一个很大的话题，**“什么是歧视，歧视的本质是什么”。**


    > 答：歧视的本质，是信息成本。


    举个例子，假设我要招个文员。


    我对外开出的要求是：“大学及以上学历”。


    很多人可能会叫起来，“难道高中生就没有人才么”。


    你看汉高祖刘邦，明太祖朱元璋，不也没什么学问么。


    **Bill Gates** 中途辍学，也没大学文凭么。


    如果你坚持要求“学历”，岂不是把这些“人才”阻挡在了门外。


    对的，对的，你说的都是对的。


    我想指出的是，这其实是一个“甄别成本”的问题。


    好像你到人才招聘会上，开一份 10000 元/月的工资。


    刷啦啦，你可能收到 800~1000 份的简历。


    一份简历两页纸，如果让一个 HR 小姑娘仔细看的话，可能 20 分钟才能看一份。


    一小时三份，一天 25 份。


    二个人看一周，看完 250 份。


    1000 份简历。需要“二位全职”日夜不停地看上一个月。


    如果这样的话，你公司也不用运作了。


    更合理的做法是什么呢。是“筛选”。


    1000 份简历中，凡是没有大学文凭的。直接就剔除掉。


    凡是非 985，211 的，再剔除掉。


    简历一看就很弱鸡的，再剔除掉。


    最后剩下 100 份。二个 HR 主任花点心思慢慢看。


    且慢，且慢，这里面还有“造假”的问题呢。


    简历造假，是一个重灾区。中国的简历，几乎已经到了无人不假，无处不假的地步。


    上班三个月的，就敢吹当总监。野鸡大学毕业的，胆敢冒充北大、清华。


    HR 如果再考察“简历造假”，最终能耗时耗力“严格审核”的，可能不超过 10 个人。


    但是，我们反过来。举另外一个例子。


    假设你现在招的不是底层员工，不是月薪 10000 元的小弟。


    你招的是 CEO，是五百强行政总裁。是年薪 1000 万/年的顶层精英。


    这个时候，猎头给你提供的名单。可能十分十分地有限，可能一共只有三~五人。


    这个时候，你也不会在意“高中文凭”“出生地点”了。'
