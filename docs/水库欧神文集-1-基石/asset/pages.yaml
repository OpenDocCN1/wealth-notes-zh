    # 裸条没有外部性 #F760


    有产权的才能叫“外部性”。

    没产权仅仅是屌丝的“不满”。

    一）患子


    首先，我们要讲一个“伤心的”短故事。


    # 话说山口百惠嫁给了三浦友和，隔壁的屌丝伤透了心。


    对于屌丝来说，这简直和“天塌下来”没什么二样。

    山口百惠她怎么可以嫁人呢。这么美丽，这么柔和，心中的女神形象，她怎么可以嫁人呢。

    怎么可以以后就作为三浦友和一人的妻子，不可远观，不可亵玩。相夫教子闭门不出。

    屌丝感受到了十万点的伤害。

    如果按照今天糟糕的学术圈语境，立刻就会有人跳出来，指出这是一个“外部性”效应。

    山口百惠和三浦友和的结婚，并不是他们两个人的事。也要考虑到社会的影响。也要考虑到千千万万屌丝上街的抗议。女明星要流淌道德的血液。

    (贵如很Low)按照知乎上的某些语义逻辑，接下来就要“禁止”二位的结婚。要考虑到达社会的影响。并非所有你情我愿的事情，对社会的总“幸福度”贡献都是正值。

    而事实情况呢，现代人都知道，这是一段笑谈。

    山口百惠当然有权力嫁给三浦友和，孩子都生了好几个了。

    那么，问题出在哪里呢。

    问题出在于，对“外部性”的理解之上。'
