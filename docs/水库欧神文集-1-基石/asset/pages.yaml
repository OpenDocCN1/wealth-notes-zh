  md: '# 答案是： 公平的！


    因为无论付款方式，赔偿金额，权力义务，权力义务并不需要对待。


    一切都折合成价格。


    你正常卖一套房子，譬如 100W 元。但是愿意承受各种乱七八糟“合同条款”，你就可以卖 105W 元。


    同样一班飞机，都是把旅客从北京搬迁到上海。“运输服务”都是一样的，甚至连餐饮都是一样的。


