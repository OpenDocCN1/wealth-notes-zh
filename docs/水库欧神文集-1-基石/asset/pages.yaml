    生产是一回事。最终享受到财富的，是另外一群人。可能完全不同二组人。

    所谓“十指不沾泥，鳞鳞居大厦”。

    你拿一个钢铁厂出来研究。从最初的铁矿石，经过洗煤，融化，熔炼，去杂质，最后变成了一根根长的螺纹钢。

