    # ## 为什么滨州那么穷，为什么香港那么富 #F1550


    这个春节，又听到了一些新的奇人异事。


    接着去 HK 住了一周，


    二相对比，若有所悟，小有心得。


    +   1. 滨州


    有一位姨，是在山东滨州卖烙饼的。


    她就属于那种无知无畏，被老乡骗去接坑，从事一门 “很有前途的职业”。


    在二所技术学校的周边，卖白粥加烙饼。'
  merge: -1
  img_proc: true
- pgno: 428
  md: '新年见面，照例第一句话 “恭喜发财”。


    眼看五十岁的人，愁云满面的，俺敬了一块银鳕鱼，孝敬着问 “生意怎么样啊”。


    “唉，别提了，赚不到钱”。


    “学生的生意还赚不到钱，是不是客单价太低了”。


    “2 元”


    “噗……” 您把天聊死了。


    “你们卖粥的，属于辅餐小食。卖正餐炒菜，或许更赚一点”。


    “我们就是正餐。一杯豆浆+一个烙饼，算套餐，2 元”。


    “那晚餐呢，晚餐会不会豪华一点”。


    “吃中午剩下的烙饼”。


    “那么，你们有没有试过产品升级，改善产品线，卖更高附加值的产品”。


    “有啊，我们试图推出了高端产品。大大大脸烙饼，4 元，一个管饱一整天”。


    “卖得怎么样”


    “科技改变生活”


    “那不是测绘学院的么。学生们手机里装一个测距软件，根据你的焦距，角度，摄像头，视频光线，拍照自动推算出你大饼的直径，厚度，曲率”。'
