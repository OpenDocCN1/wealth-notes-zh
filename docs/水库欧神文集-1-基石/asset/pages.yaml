  md: '广汽本田在广州设个厂，明文约定了不许返销日本市场。

    你看似一辆车。但他其实不是同一辆车。光附加的License就有几十种不同。


    以上，均为“有限产权”的例子。


    # 三）共有产权


    比“有限产权”更进一步的，则是“共有产权”。亦即这项资产，有多人主张权利。

    我们来回看一下张五常的话：


    ![](img/f67be513638d053b62bd7b01d459b241_335_0.png)


    一个很典型的例子。譬如你要“卖祖宅”。

    祖宗传下来的苏州园林院子，房产证是你长房长孙一个人名字。现在你缺钱花，准备卖了。

    可是你卖的时候，七伯跳出来了。

    “祖宗传下来的东西，不能卖啊”。

    “虽然房产证是你的名字，可你也不能卖祖宅啊”。

    在这个情况下，七伯就是一个“利益相关者”。

    祖宅有很多利益相关者。

    你胆子再大十倍，你也不敢卖祠堂。

    对于今天的中国政府，他强制实行“不动产登记法”。

    任何不动产，都必须有房产证。任何房产证，都必须有产权人。其他的事你们家族内部自己解决。

    通过这种方法，强制达到了“确权”。

    对于房地产系统，他的确是达到了“产权清晰”。

    可是世界很大，世界非常非常大。还有大量的领域，达不到“确权”。

    譬如说，我是一个苗族村寨。

    现在有一个旅游开发公司，找上门来。说想开发他们村，搞一个“风情民俗园”。

    那么，你到底是同意还是不同意。

    同意的话，收多少钱。收钱的话，钱如何分。

