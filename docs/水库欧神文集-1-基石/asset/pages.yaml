  md: '# 机器只能处理“标准化”业务，而对“非标业务”无能为力。


    # 程序员就是扩充“标准”的范围。


    人类的文明，还处于非常初级的阶段。有太多太多的东西，需要装进电脑里去。例如前不久刚发明的“自动美颜”。


    从这个角度讲，“信息化社会”至少还有100年。


    程序员永远有饭吃。


    Oracle的CEO埃克森曾经说过，“甲骨文 的数据库软件，市场份额已达到 56%。但幸运的是，全世界只有 20%的信息数据化”。


    “数据化”三个字，实在是道破了文明的真谛。


    +   1616年时，由机器制造的铁器，占人类的比重为 0%


