    # 没有合同不公平 #1350


    （见近期热点问题）


    一）窝轮


    经甲乙双方自由平等友好协商，现达成以下决议：


    +   1）甲方违约，赔偿 100 元。乙方违约，赔偿 10000000 元。


    +   2）甲方有 90 天“犹豫期”，90 天之内可以随时撕毁合约。乙方有 1 天犹豫期。


    +   3）如果价格上涨，甲方获得全部涨价利润。


    +   如果价格下跌，乙方承担全部跌价损失。


    好了，现在“毁三规”考题来了。


    # 请问以上合同，是公平的，还是不公平的。


    对于 99%的智商欠费，脑子煤渣，人品贱格的“圣母白左婊”，他们已经忍不住要跳起来了。挥舞着小旗唳：


    +   “不公平，不公平，太不公平了”。


    +   “这是绝对的欺诈和压迫，政府应该管一管。限制这种合同无效”。


    +   “打倒奸商，打倒犹太人，让世界充满爱”。


    好了，我们再加一条，也是最至关重要的一条；


    +   4）甲方支付乙方 50000 元。'
