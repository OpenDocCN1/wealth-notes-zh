  md: '你不能去看外因，外因的话，则年年都是“利空”。


    从 2003~2018 年，整整十五年了。每一年都是“调控”，每一年都是打压。


    如果你光研究“外因”的话，你早就被吓死了。年年都是负面坏消息。


    但是现在的 V 做学问，他们不肯踏踏实实地下“苦功夫”。


    他们不肯从“看房 200 套”开始，切实地判断三房的购买人群是谁，二房的购买人群是谁，浦东和浦西的购买口味有何区别。贷款利率调整，对购房有何定量影响。


