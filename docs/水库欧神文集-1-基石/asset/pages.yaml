  img_proc: true
- pgno: 528
  md: '1840 年的中国王朝，皇帝统治着一切。既不允许你尝试新的体制，也不允许你进口新的机器，不允许开电报局，同人间，不允许办报纸文字狱。对海外的贸易，被严格地限制在广州“十三行”的手中。除此之外，片帆不得入海。


    在 1840 年的中国，如果你想出头，你只有读八股考科举一条路。除此之外，经商，务农，分分钟被贪官恶霸搞死。


    读书，你则只能依附于朝廷。并且分同乡，同榜，同科，束成一股股派系，在政治上党争不息。


    换言之，“体制”的力量太强。


    1840 年的满清中国，“体制”无所不在。做什么事都要经过体制，只有体制内才能飞黄腾达。日本的丰田，铃木，基本是靠民间的力量自发成长起来的。而中国则没有这个可能。


    【注 1】：著名的“铁枪的故事”，就是指鹿儿岛岛主卖掉了女儿，换回了荷兰人第一台蒸汽机。


    # 五) 半泽


    看《半泽直树》这部片子，我们看到的不是希望和坚韧，而是恐怖。


    如果用一句话形容《半泽直树》里面的日本社会，则是织网社会，体制力量无所不在。


    在日本，你首先要读一所像样的大学，然后要进一家像样的公司。


    我们可以看见，半泽这种算是课长级骨干人物，但却是住在公司的集体宿舍。


    看到这一节时，我们看到的不是关怀，而是恐惧。


    住集体宿舍，如果公司刁难你，不让你住了怎么办。


    住集体宿舍，如果你被降职外放，工资下降怎么办。


    住集体宿舍，如果你得罪了上司，给你穿小鞋怎么办。


    在日本的社会中，“半泽”这类工资十分低，以至于他们不能获得人身意义上的独立。


    铅笔记说，没有财产权就没有人权。


    经历过中国旧历史的人都知道，人民公社里的大队长，会怎样对待你。


    当居委会干部掌握了分配房屋权力后，他会怎样刁难你。


    80 年代最初的那批人，他们咬牙狠心下海，公家不给你租房怎么办？


    日本的“一元”势力太强大。每一个日本人踏上社会，首先要读一个大学，没有庆应社的学长们关怀，以后你在职场中几乎没有战友。


    这和中国封建社会“同榜，同乡”又有什么区别。


    进了日本公司以后，公司又有太大的权力，他既控制着你的工资，又控制着你的宿舍，最关键的你还不能跳槽。


    在片中，曾有一级渡真理忍想跳槽去欧美的外资银行。因为任何一家日本银行，一只会重用自己培养的人，二不会录用叛徒。


    经历过中国国有企业的人都知道，在这样的制度下，进棉纺厂就棉纺厂做一辈子，进纺织厂就纺织厂做一辈子，哪还会有什么前途，哪还会有什么创新。'
