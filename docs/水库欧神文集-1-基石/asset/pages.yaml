  md: '报纸“报导新闻”，就再也没有人看了。

    因为报纸是一种非常非常缓慢的工具。今天晚上发生的事情，最快也要到明天晨报才能发刊。

    朋友圈早就刷屏，刷烂掉了。

    同样道理，我对于书籍的怀疑是：


    # “作为一种知识组织形式，‘书’是否已经过期” 。


    各位，我们看待问题，一定要看清本源。

    书籍，不过是一种知识学习途径。

    上课，也是一种知识学习途径。

    刷朋友圈，刷知乎，也是一种知识学习途径。

    甚至连“社会大学”，也是一种知识学习途径。

    它们并没有什么不同。核心都是学习知识。


    目前社会上对“碎片化时代”颇有微词，学术界普遍对碎片学习时间不屑一顾。

    这是不对的，屁股决定脑袋。

    是教书匠为了维持自己的职业特权，而在进行辩护。

    真正导致“碎片化”形象低下的，是没有考试。

    没有考试，则你不能甄别学生质量。罗振宇的每一堂演讲，都必须假设台下都是完全没有基础的小白。从而降低了演讲质量。

    如果能够对学生进行真正意义上的严格考试。

    考不通则留级。

    则函授，或者网络大学的效率，是会超过课堂的。

    哪怕老师拉个群，让学生在群里自由讨论。老师不时不时插播引（小密圈），这样的效率，都好过你在课堂里枯坐 45 分钟。

    Amazon 研究的是“书籍”的分销模式。

    而我则是担心，未来连“书籍”都不复存在了。


    # 五）未来的知识


    书籍只不过一种表象，其本质是知识的传播。

    未来知识的传播，不一定要靠“80 回装订”成一本红楼梦的方式进行。完全可以 VR 趟一回。

    所谓书籍，作者写成了一篇篇 6000 字左右的“章节”，再机械地装订在一起。

    这样的“知识组织”形式，何等的可笑！

    完全是中古时代的遗留物。化石未进化完全的遗骨。

    未来的时代，“知识学习”一定有更多的组织方式。例如微信公众号，订阅推送。

    小密圈，私密辅导答疑。

    然后你再去实战一把。实战中遇到困难和困惑，到群里面来问。大家帮助。难保还能借你点钱。

    这样的成长速度，是非常非常快的。'
