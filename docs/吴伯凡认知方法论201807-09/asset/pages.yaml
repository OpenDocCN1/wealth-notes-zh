  md: '# 存量与增量4 | 利用“拉波波特法则”实现认知增量


    存量与增量4 | 利用“拉波波...


    第一模块

    认知的源代码


    第二模块

    认知治理

    “存量与增量”


    第三模块

    算法与第一性原理


    第四模块

    意义炼金术


    在前面的课程里，我们讲到了：


    +   1. “播放状态”、“打印状态”是一种非认知状态；

    2. “洗脑”不是对内容的清除和输入，而是形式上的格式化，是为了终止认知状态；

    3. 终止认知状态的还有“跳踏板式的对话”——玩跳踏板的过程同样是没有认知增量的；

    4. “雄辩症”、“红精”的共同特点是“只有存量，没有增量”。


    # 1. 共识


    我们现在经常感叹“沟通如何困难”，“共识如何破解和难以达成”，但是，到底什么是“共识”呢？


    认知常常被理解为“双方的让步”，但让步本身是存量，没有增量。辩证法是双方都带着各自的认知存量进行辩论，通过辩论，实现双方的认知增量，而这个双方共有的认知增量就是共识。


    辩证法常常是“正反合”，这个“合”恰恰就是增量。辩证法达到的认知增量是另外一个生命的出现——另外一个生命才是共识，而不是“你让点儿步，我让点儿步”的一个妥协。


    我们可以区别一下三种共识：


    强制性共识：实际上并没有达成共识，但由于一方处于绝对强势状态，另一方只好作了让步。这是一种伪共识。


    交易性共识：我有我的利益底线，你有你的利益底线，在两个利益底线之上，双方出于利益考虑形成了某种妥协。


    真正的共识：在辩论和对话中，双方的认知发生了改变。当改变发生的时候，一方发现自己的认知恰好跟对方的新认知是重叠的。


    # 2. 拉波波特法则


    我们经常把沟通理解为“消除堵塞，消除障碍”，而英文中的“沟通communication”这个词的本意是“共同在”的意思——沟通的本质是形成共识。


    很多所谓的沟通，从沟通的愿望出发，结果形成了更大的沟通障碍，甚至成为完全的对立，把对话变成对抗，甚至是变成战争。为什么会出现这种情况呢？一个很重要的原因是那种所谓的沟通，是没有规则，没有逻辑的。


    与这个问题相关的是拉波波特法则（Rapoport''s rule）：你想和对方达成共识，那么你的整个对话过程中，同意和反对的比例大概是3：1——我们通常的对话和沟通，基本上是一上来就在反对对方的观点。


    拉波波特法则有四个步骤：


    第一步：


    在你要反驳对方观点之前，要非常清楚、 vivid、不偏不倚地复述对方的想法，达到这样一种效果：对手听了你的复述以后，会在心里说，“谢谢，我刚才要是能像你这么表达就好了”。


    第二步：


    你要把对方观点当中你同意的部分列成一个清单——第一，我同意你什么；第二，我同意你什么；第三……尽可能让这个清单，既要清晰，量还要足够多，要让对方觉得你是他的另一个自我。


    第三步：


    你还要强调“对方的观点如何增进了我对问题的认识”，也就是你从对方的观点里学到了什么东西——这是在表达你的认知增量。做到这一点，不是礼貌就可以达成的，你必须要对对方的观点有深切认识，必须要在听完对方观点以后，实质性修正你的某些看法，让对方实实在在感受到你从他的观点当中学到了什么。


    这三步像下围棋：设定一个深藏不露的目标——你最不同意的那個观点，然后把它围住。在你想吃掉一颗子的时候，必须要围到它，如果你围不到这颗棋子，它是随时可以逃逸的。


    第四步：


    开始阐述你对对方不同意的地方，让对方感觉“你就是他”，是一个正在处于反省状态的他——你的这种行为不知不觉把对方带入到一种反省，或者一种“自我对话”的状态。“红花也要绿叶扶”，你所不同意的观点，在你们相同的众多观点映衬下，就会显得特别突出，对方就会进入到一种自我修正的状态，这时就很容易达成共识了——这个共识就是一种认知增量。


    所以我们说：辩证法跟一般对话不一样的地方在于它是有规则、有步骤、有逻辑的，不是比谁的声音大、谁的权势大，而是在遵循这些规则进行对话的时候，你已经远离了“播放状态”、“跳踏板状态”，让你，也让对方远离了“红精状态”。


    # 3. 存量与增量


    特别值得注意的一点是：当你提出批评的时候，不是把你既成的一个观点强加给对方，而是在你跟对方对话的过程中，悄悄地放弃了自己的很多观点——你已经通过这种对话获得了新的认知。一定要把你的批评过程，让对方感受到是他自身循序渐进改变自己认识的过程。


    更简单地说，你提出的批评，对方感受到的是他的认知增量，换句话说，是用助推的方式让对方实现某种迭代。


    我们讲过，“助推”是一种把你的意志转变为对方意志的过程，让对方的改变成为一种自觉自发的行为。在这个意义上，“助推”是一种温和的专制主义，是一种在失控当中实现控制的手段。


    通过“对话和辩论”形成的共识，已经分不出这个观点是你们双方哪一方 的，你的，还是他的了。“共识”就是双方都认为是属于自己认知的那种认知。


    这个单元的关键词是“存量与增量”。认知状态是一个进行时的状态，是thinking而不是thought，不 是过去时，也不是一个名词。衡量自己是否处于认知状态，就是看你的认知是否实现了持续地从存量变成增量的过程。


    一句话，所谓“认知”就是从播放状态、跳踏板状态、抬杠状态转变成有逻辑、有规则、 有方法的对话，也就是辩证法。


