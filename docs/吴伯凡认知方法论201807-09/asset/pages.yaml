    生态位这个概念最初提出的时候，其实是一个空间概念：有个生态学家发现一种鸟分别在一棵树的树梢、树冠、树冠中部、树冠下部、树干接近于树根的地方捕食虫子，这导致了这种鸟形成了五个亚种，它们所处的位置就叫“生态位”。


    严格说，生态位不是一种物理空间的概念。比如在蝙蝠的例子中，它是通过时间的错位跟鸟形成了一种近乎平行的生态位：


    在相当程度上，发现并占据一个生态位取决于认知能力：鸟休息，蝙蝠出来，时间上错位以后，蝙蝠面对的环境就不一样了，所以它在黑暗中也能找到飞虫，凭借的就是一种独特的认知能力。


    只有资源能形成匹配的时候才能形成一个生态位，比如火星上有无数黄金，这是一种资源，但我们不具备上火星这个能力的时候，这个资源等于零。


    生态位是特定资源和特定认知能力匹配而成的一种生存场景。


    上节课我们讲了，一个物种能否在一个场景里头生存下来取决于它的能力，包括认知能力以及与认知能力相关的其他能力是否跟这个场景高度匹配。如果不是高度匹配，它在这个生态位中就不具备优势，就会被边缘化，以至于最后完全丧失这个生态位。


    有竞争力的认知都是高度场景化的认知。


    # 可编码知识&不可编码知识


    在哲学家波拉尼（Michael Polanyi）的《个人知识》（Personal Knowledge）这本书里，他提出了一个影响深远的概念——默会知识，也可以翻译成“只可意会的知识”。


    波拉尼把知识分为两种：可编码的知识和不可编码的知识。


    # 1. 可编码知识不能形成竞争力


    可编码的知识就是可以写成明确流程，能够直接传授的知识，比如你从事任何一种运动，教练第一节课跟你讲的那些东西差不多都是可编码知识；或者写字的第一节课，老师跟你讲“笔要拿稳，身要坐直”，这些都是可编码的知识。


    但是，这些可编码知识顶多是一个必要条件，而不是充分条件，换句话说，可编码知识不能够形成你的竞争力。


    学医的朋友可能会很有感触：无论你的解剖学知识多丰富，已经动手解剖过多少活物，真的要做手术的时候，当手术刀切开病人皮肤的一瞬间，你还是可能会慌——出现在你眼前的这个对象/事物总亦无法仅仅借助你以前学的可编码知识应对。


    要形成竞争优势，或者你要让你的知识优化到具有竞争力，就必须在大量场景当中去意会那些别人没法传授给你的，你懂得也可能没法传授给别人的知识。


    # 2. 场景化知识&非场景化知识


    可编码知识在一定程度上相当于人眼跟鸟眼的差别：在捕捉飞虫这件事情上，低配认知是没办法适应复杂场景的。


    我们在上节课讲到：一种认知首先是一个对象，但是这种对象的背后是一个故事，包含着复杂精密的场景。概括性、可编码的知识，跟默会知识、高度场景化知识之间的差别，是一部电影的故事梗概跟这部电影之间的差距。


    # 3. 场景=数据


    我们现在能更容易地理解“非场景化知识”和“场景化知识”、“可编码知识”与“默会知识”的差别，因为这中间有一个关键词：数据量。


