  md: '# 直觉与数据主义3 | 认知差距的本质


    最近我在看尤瓦尔（Yuval Noah Harari）的

    ewn新书《今日简史》（21 Lessons for the 21st Century）：写完了人类的过去——《人类简史》，展望了人类的未来——《未来简史》，他把目光回到了我们的现在。实际上，这也应了那句话，“一切历史都是当代史”——我们说过去、说未来，其实都是为了说当下是一个什么样的生存境况。


    人类当下的生存漩涡向我们展示的是人类前所未有的一种生存境况：7万年以前，人逐渐从所有生物当中脱颖而出，征服了所有的物种，成为地球的主宰，但在今天，人类遭遇到了一个前所未有的竞争者，而且，这种竞争越来越显现出一种“不对称竞争”的态势。


    这个新的物种——我称它为“人工智能”也好、“机器––人”也好，或者“生命3.0”也好——给了我们提供了一个参照系。


    # 会做算术的“神马”


    在《今日简史》这本书里讲到，上世纪德国出现了一匹会做数学的神马——你说“5+7等于多少？”这匹马就会跺在地上敲12下，它甚至能够算到二十几、三十几，都不会出错。


    这件事刚开始传播的时候，很多人都认为是一个骗局，于是德国教育部就组织了一批专家对这匹马进行了认真的研究，终于是知道了真相：这匹马并不懂算术，它是主人长期刻意训练的结果。


    主人训练马的时候，说“5+7，你点12下”，马显然听不懂，但当他说“5+7等于多少”的时候，他看着马用蹄子敲地面，马每敲一下，主人的面部表情都是不一样的，在这种长期训练之后，这匹马就能够准确捕捉主人的面部表情，从中知道接下来敲一下可能是对了。甚至接近于正确答案的时候，主人的表情就会是一个固定的模式。如果主人不在，这匹马就不会做算术了。


    这件事是一个关于数据主义的故事。


    # “模式识别”式的人类直觉


    跟其它生物相比，人有显而易见的优势，但跟新出现的物种相比，人相对于所有其它物种的优势渐渐地变成不是优势了。


    举个例子：人在计算上早已放弃了跟计算机的竞争。因为在计算上，最有天赋的人永远抵不过一个小小的计算器。但是，与计算机相比，人还有一种它们完全不具备的能力——直觉。人能够发现美、创造艺术作品，而机器不行。


    我们的脑子没有电脑块，但是我们能够在瞬间识别一个东西——机器有时候往往连猫和狗都分不清，但一个2岁的孩子就很清楚知道是狗还是猫。


    这一点可以说明：人的直觉是人工智能远远不够的。但是，问题并不是那么简单。


    尤瓦尔是这么说的：


    > 过去大受赞誉的人类直觉其实不过就是“模式识别”罢了。优秀的司机、银行经理和律师，他们对路况、投资和谈判交流并没有什么神奇的直觉，只不过是辨识出了一些一再出现的模式。于是，司机能够躲过漫不经心的行人，银行经理能够识别并且拒绝无力偿还债务的借款人，律师能识破心怀不轨的骗子，这都是靠直觉。但是，不要为自己的这种直觉而高兴得太早。


    中国古代的文学评论名著《文心雕龙》里说“操千曲而后晓声，观千剑而后识器”：你弹了一千首曲子以后，就能够真正听懂音乐了，好和坏瞬间就能分别出来；你看完一千把剑以后，一把新剑放在你的面前，你就能马上识别出它的好坏。


    不管是分别音乐的好坏，还是识别剑的好坏，都是在一瞬间发生的。光从这个节点上来看，你就会觉得这个人很神奇：能够听出弹曲子的人的状态，甚至能够从聋声当中识别弹琴的这个人很隐秘的特点。就像《三国演义》里写的，诸葛亮和周瑜都是懂琴的人，他们听见彼此弹琴的声音，一下子就能听出琴里里的“火的味道”，于是，他们不约而同地采取了火攻——从这个节点来说，很神奇。


    但对于外行来说，无论什么剑放在面前，根本就没法置评它的好坏，甚至完全有可能把坏的认为是好的——这里的差别不在前台，而在后台的计算。这还是一个数据的问题。


    # 数据竞争：人与人之间认知差异的本质


    # 1. 数据主义


    尤瓦尔把“以数据为基础而形成的世界观和方法论”称为“数据主义”或者“唯数据论”。


    从“数据主义”角度看：弹一千首曲子，就是“数据积累”。那些看上去的瞬间认知，它们依赖的不是巫术和姤术，而是在毫无察觉的情况下，大脑通过分析各种信息，在瞬间做出决策。


    比如一个司机看到前面有个行人，这个行人到底是“漫不经心的”、“乱穿马路的”还是“心不在焉的”，甚至可能是“精神不正常的”，司机都能通过面部表情、步态，快速进行模式识别。在这个意义上，人是一个基于数据、算力和算法的智能设备。


    反过来，如果“人工智能”有足够多和精密的传感器，可以获得数据，它的算法就可以优化，更不用说算力的不断提高——比如“人工智能”和老司机同样开车，可以做得跟他一样好，也可能做得比他更好，而如果从一个长时段看的话，“人工智能”一定会比老司机做得更好。


    # 2. 从“数据主义”角度看“直觉”


    在人工智能技术没有出现，或者是没引起广泛关注的情况下，很多的哲学家、认知科学家都在讨论直觉问题。这种讨论要不是“陷入到神秘主义当中”，要不就“得出一些没法证实，也没法证伪的概念”——比如“第六感”，要不就“干脆否认有直觉回事情”——这都是因为他们没有从“数据主义”的角度看问题。


    人从出生，就是在收集、整理、提炼、加工各种数据。某一个场景，某一种事态反复出现，在人脑当中就会逐渐形成相对稳定的模式。当类似的场景出现，人就会在一瞬间识别这个模式，给出一个判断，作出一个决策——从“数据主义”的角度看，一点儿都不神秘，跟我们喝可乐的时候立即感觉到甜，走进一个宾馆的时候立即闻到特定的气味是一样的，不过就是各种刺激在一瞬间引发的感觉和判断。


    不同的是，这些刺激的数据是相当隐秘的，不是长期处在某种特定场景的人是不可能收集大量相关数据形成这种“模式识别”的。


    我们前面讲过“生态位决定认知”，而特定的生态位决定你接触的数据和刺激是不一样的，尤其是那些隐性微妙的数据和刺激，就像我们不能感受到红外光、超声波一样，不处在这个位置的人根本感受不到。


    我们以前讲过福尔摩斯见华生的第一面就脱口而出，“你是从阿富汗回来的”。最有意思的是，后来华生问他“怎么会得出这个结论”的时候，福尔摩斯根本想不起来——原因很简单，这个运算是沉底在后台进行的，还原这个过程是很费劲的。


    就像我们看看见蜂鸟怎么扇动翅膀，必须要用快速摄影机拍下来再看，才能知道它是怎么动的，要不然是根本看不清楚的。


    中国古代和近代从事商业的人，交易的时候也会有很多凭证，但有些商人根本不识字，也不会写字，他们就用一种特殊的符号，一个圈子类的来表示，不过交易venture
    A方都认这个东西。如果有人看这个东西很简单，也随笔画一个圈，仿造一下，立即就会被识破——原因也很简单，这是一个快速的“模式识别”，看上去是一个直觉，其实在后台发生了非常稳定的极其快速的计算。


    当然，直觉发生最多的是在“审美”领域，一个东西美不美是不需要反复理性思考的，一眼就能觉出它美和不美。大师级的作品，它的美丑以及真假，也是需要特定大师级鉴赏家来识别的——说白了，这也是一个基于大数据瞬间认知。


