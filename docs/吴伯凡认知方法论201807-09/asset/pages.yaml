    上一节课我们讲到：


    +   1. 任何一个观念、概念、知识点都是或者潜在于是一个边界很模糊的数据库，单纯的知识点没有意义。

    2. 你想试图通过对某些点状知识的获取形成自己的认知优势是不可能的。

    3. 真正的认知优势不在于模向的认知扩张，而在于将一个点状的认知逐渐丰富、复杂，成为一个知识网络——看起来是一个点，其实进去以后是一个大千世界。


    # 知识的区分：熟知与真知


    很多思想史上的哲学家试图对“知识”进行区分，其中最著名的是黑格尔说的“熟知与真知的差别”。


    熟知：你熟悉的——“那谁，认不认识？”“认识，我熟！”“但是，熟知常常不是真知。


    我们以人际关系作比喻的话，你跟另一个人的关系，基本上可以概括为跟他“熟”还是“不熟”，而这个关系细分成来的差别是非常大的，或者说，如果用不同颜色来展现关系的密切程度的话，色差是非常大的。


    对一个知识的掌握程度，粗看差别不大，但细看差别非常大，黑格尔于脆把那些我们通常以为我们知道，但其实不知道的知识叫做“熟知”，真正知道的知识叫做“真知”。


    我们以商业为例来说明“熟知和真知”之间的差别。


    当一个产业趋势出现的时候，就会出现大量玩家瞬间涌入的情况。他们之所以迅速进入到这个新兴行业，是基于他们的认知的。而他们的基本认知是两个：一，这里蕴含着巨大的机会；二，这跟以前的玩法不一样。但当你继续向第二层次的问题，他们往往就说不上来了，再往第三层次、第四层次、第五层次……你根本连问都没办法问。


    我们今天看见路边那么多共享单车的时候，就知道熟知的危害性有多大：当初疯狂涌入这个行业的人，没有一个人认为自己是不知道这个行业的，否则他也不会进来，但是他对这个行业的了解，可以说连熟知的程度都没有达到。


    但是，一个有商业常识的人是不太会对此种现象进行大肆抨击的，因为历史从来如此：大家携带着非常浅薄的认知进来，为这个行业的认知升级做贡献。这个“认知升级”也是要大量的资金作为试错成本的，所以，倒下去的第一搞一般是对这个行业认知程度最浅薄的，或者说对这个行业的坑坑洼洼、坎坎坷坷最不了解的，他们直接就被淘汰了，接下来还会淘汰第二拨、第三拨。


    最终创业成功的企业，其实现就是认知升级的速度和程度最优，得以幸存下来，因为它们以非致命的代价——有时候甚至以别人的生命为代价，快速实现了“认知升级”。


    # 辩证法：从熟知到真知


    在黑格尔看来，从熟知到真知要用一种我们上个单元讲过的方法——辩证法。


    “辩证”就是：1. 提问题、质疑；2. 质疑以后，你来反驳；3. 反驳的过程剥离了伪认知。


    这有点儿像米开朗基罗说的“雕塑的过程”：从一块大理石上不断去掉不属于大卫的那些石头。通过辩证法，你渐渐到达了真知。用我们这个单元的话来讲就是，不断地提问，每一次提问相当于一个更新、更细化、更真实的场景出现。


    我们头脑中有很多的熟知，像寒武纪物种大爆发出现的物种：我们知道，大爆发出现的物种中的绝大多数最后都被淘汰了。在寒武纪，地球表面含氧量骤增，有水，有氧气，形成生命的基本要素出现的时候，就出现了很多的物种，但这些物种能成活多少呢？


    在一无所有或者只有很少物种的世界 még，出现一个物种就是你的机会，但当很多物种都拥有这个机会的时候，其它物种对你又形成了新的约束，你能否在众多物种里活下去，那是一个新场景，相当于要接受第二次的提问。这时候，如果你回答不上来，那对不起，你被淘汰了。


    所谓“环境的变化”，其实就是环境反复在提问和质疑，你能够回答出来，你这个物种就成立了。


    # 认知优势：真知和熟知的比例


    我们的头脑当中知识的占比是不一样的，每一个人的认知里都包含着两种成分：熟知和真知。


    一个人的认知优势体现现在的他的真知跟熟知的比例：如果你头脑中净是一些熟知，基本上没有真知，或者说只能回答第一个问题，大量的知识只能经受住第一问，你的认知就没有优势。拥有“真知”的人是能够让自己的熟知经受住下一问，并且在下一问的过程中，用最快的方法找到解决方案。接下来新问题提出来的时侯，又能快速地去寻找新的答案。


    我们可以把任何一个认知理解为一个物种：这个物种要面对的环境是一个或者一堆问题，你是否能够挺通关进入下一级，就等同于你的熟知是否能够不断撕喽，在通关以后逐渐接近真知。


    为什么有的人头脑当中除了熟知，真知的含量很少呢？因为他很少接受真正的提问。如果他处在一种真实的、有选择压的环境里，被迫去回答，给不出解决方案就会被淘汰的话——他至少有50%的可能让自己的认知迭代和进化。这就像米开朗基罗做雕塑的时候把一些石头给去掉了，但这些石头最后是否能雕成大卫呢？当雕出来，琢掉一些石头以后，可能发现这里还是不行，近看远看，最后又发现了哪些是多余的，然后把它给去掉。


    认知就是去伪存真、去粗取精的过程，这个过程的主角是环境——你的认知环境。这个认知环境常常表现为一或多个问题不断出现在你头脑当中——没有这个问题出现，你头脑当中的“熟知”就会停留在原来的层级上面。


    “进化论”说：生存下来的物种不是最强、最聪明的，而是最适应环境的。你头脑中如果有很多熟知，说明你的环境不太真实，像南太平洋上某个孤岛的物种，由于跟外界不接触，不具有挑战性。大家不要以为竞争这么激烈，是不可能在与世隔绝的南太平洋岛上自己慢慢过日子的。事实上，在很多时候，我们由于外在和内在的原因，使得我们能够给自己那些离真知很远的熟知形成一个巨大的保留地。


    比如你所处的行业是一个具有高度屏蔽性或者垄断性的行业，那么，你的企业和你自己面对的问题或者环境就是相当单一的：尽管整个世界可能竞争非常激烈，你的某种“技能”，可以说是“技能”，也可以说不是“技能”，像是你会抛饰、打马虎眼，用这种非工作性的努力去弥补认知的不足，也能够混下去。


    当初学的是同样的东西，但大学毕业10年、20年以后，每个人的认知差别非常大，其中一个很重要的原因就是：一部分人不断在经受各种的质疑、提问、挑战，被迫去迭代原有的认知，一步步让现有的认知接近于真知，另外一部分人则一直滞留在一个南太平洋孤岛一样的保留地上。


    用上个单元的话说就是：你一直处于一种播放模式，而你所处的环境让这个播放模式是有效的，你就会一直处于这种模式。但播放模式是远离认知的。


    鹦鹉有简单的学习能力，接下来是长时间的“播放”，它可能根本就没有认知，而是一种“碳基录音机”，能把某个声音录下来进行播放。比如它说“欢迎光临，好久不见”，你要ߝ问它，“我昨天还来了，怎么就是好久不见呢？”它就不知道，没法回答了。


    从鹦鹉的例子能知道：认知的特点是屏蔽提问，而提问既可能是一个口头上的问题，也可能表现为一个环境的挑战。当你屏蔽了这个提问和环境的时候，你已经滞留在“非认知”状态了。


    # 总结'
