  md: '# 认知与客观化 | 本单元十大精彩留言


    认知与客观化 | 本单元十大...


    欢迎来到《吴伯凡·认知方法论》。这个单元咱们的主题是“认知与客观化”。


    第一节课我们讲了知识幻觉。很多时候，我们以为自己知道某件事，但事实上，我们并不是真的知道，或者说知道得很浅，而且在信息如此丰富今天，我们很容易觉得自己懂了很多东西，其实这都是幻觉。


    第二节课我们讲了一个概念，叫“认知的两重性”。不要以为我们的认知进化了，智商就越来越高。我们的智力当中，有可以越来越高的那一面，也有受制于地心引力，永远很笨拙的一面。这就是认知的两重性。


    第三节课我们主要讲了工具对人类认知进化 的作用。人类思维的发展、进化的历史，就是思维工具进化的历史。是工具，将纯精神的东西变成一个直观简洁的东西，让我们的思维可以更好地运行。比如数学中的“=”、“0”都是这样的工具。


    第四节课我们讲的是客观化对于认知提升的重要意义。我们说，思维其实就是自己跟自己的对话，所以只有当我们把自己分成主体和客体两个部分，并且让二者发生互动和碰撞，才能有思考，才会产生新的认知，这就是我们这个单元讲的“认知的客观化”。


    以上就是本单元的主要内容。希望这个单元的课程对你有所帮助。也推荐你看看其他同学的笔记，互相学习。也希望同学们继续踊跃留言，记录自己的学习笔记。我们下节课再见。


