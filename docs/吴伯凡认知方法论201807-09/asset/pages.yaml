  md: '# 认知阈尾4｜等级之争


    认知阈尾4｜等级之争


    第二模块

    认知治理与心智能量管理

    认知阈尾


    # 不了了之的“认知阈尾”


    有一个嗅头：


    我想静静。


    静静是谁？


    仔细分析一下，这里隐含着一个很重要的认知规律：我们在寻求一个东西——这个东西是一个对象——在你不断追逐这个对象的过程中，行为会变成一个模式；模式一旦形成，就
    可以自我运转了。


    比如，我钱不够，我想要更多的钱——这时你想的还是钱。但是，在你不断追逐“想要更多钱”的时候，钱的内涵已经逐渐被掏空了，你要的不是more money，而是more——更多的东西。


    这个时候，模式已经接管了你自身的欲望——模式自身获得了一种欲望在运转。就像吸毒：毒产生了一种模式，开始自我运转，实际上，当你吸毒的时候，是毒陌在吸毒，而不是你在吸毒。


    这个模式一旦形成，也符合阈尾的特点：①自带；②不自知；③无用，甚至有害，可能导致灾难性的结果；④我们并不知道它的存在。


    要切除“阈尾”甚至是不可能的，即使可能，也要付出极其惨重的代价，而你又不愿意忍受这种痛感，最终的结果就是放任自流、不了了之——但是永远也“不了了。这是一个普遍的模式。


    # 追求等级=认知阈尾


    我们再说一种现象：争吵、争执、较劲。


    某种行动、语言、思维方式，人一旦开始这个游戏，表面上是为某个观点、见解、认知在争论，实际上，是背后的模式和欲望接管了你——不是你在用这个模式，而是这个模式在使用你。


    举个例子，想象这样一个场景：有一群人，不知道是谁张罗凑到了一起。这些人在各自的领域都有1点点地位和声望，可能他们在自己的部落里是酋长或者副酋长，但聚在一起，彼此之间不知道。


    于是有一种东西开始发作：在一个临时形成的准部落里，他们立即开始谋求酋长的地位，当不了酋长也要当一个副酋长，哪怕是一个小头领——任何一个群体，哪怕是暂时形成的，都会立即产生一种对于等级的追求。


    拉罗什富科有句名言，“贵妇们聚在一起从来不缺乏话题，她们总会喋喋不休，假装在谈论同一个问题，不断申诉自己的观点，张扬自己的地位，实际上，那根本不是一场谈话，而是一场激烈的竞争”。表面上贵妇们的发言非常踊跃，实际上，她们根本没有谈同一个话题，而是在谋求等级。


    在一个临时，也可能是相对比较长期的群落里谋求一种等级，这种追求是一个妨碍我们的“认知阈尾”。


    就像夫妻吵架，表面上是在争论一个问题，“这事的真相是什么？到底是怎么回事？到底该怎么办？怎么解决？”好像是一个很理性的，跟认知相关的事情，实际不是，双方很可能在这里谋求的是等级。


    由于双方都在谋求等级，就意味着双方都唯恐处于弱势和下风——谁也不肯甘拜下风的情况下，就会变成“翅膀板”，我使一下劲儿，把你翘起来，你再把我翘起来——认知上没有进展，也不可能达成认知。


    这场游戏的本质是在谋求谁比谁更有力，这种状态不好。


    # 切除“阈尾”：绝不在非战略节点上消耗战略性资源


    1. “语欲胜人症”的合理性


    我们以前讲过的“语欲胜人”是一个很要命的毛病，这种相不相干、有用没用都一味争上游，总是想压人一头的欲望的确是不好的，但是，它最初有它的合理性。


    在我们还是猴子的时候，好像是没有阶级剥削和压迫，实际上，猴群里有非常严格的等级，一旦处于低等级，你各方面的权益、资源——无论是食物资源还是性资源——都处于最糟糕的状态。


    通过一代代演化，猴子对于上台阶、压倒别人的欲望就逐渐嵌入到了基因层面，我们开始自带这个东西，而且不自知。在这种情况下，这种东西会大大妨碍我们对于世界、他人以及自己的认知。


    2. 嗔：认知进化的残留物


    这又回到我们前面的话题：在特定场景下形成了某种机制、模式，而这个模式形成以后，它就会尽可能扩张自己的势力范围，会不分场合、不分青红皂白地运行，而一旦开始运行，在一个全新的根本不需要这些东西的场合，它就会对人的认知产生巨大的干扰和破坏作用。


    对这种潜藏在我们内心，力图压倒他人的心理诉求，佛教称之为“嗔”。“贪、嗔、痴”——“嗔”是佛教所说的三毒之一，包含了 很多含义：较劲、较真，甚至是怨恨、怨恐。人的“嗔”心一起，就很难看清楚他人和自己了。


    从认知心理学角度看，“嗔”在相当程度上是人在认知进化过程中的一种残留物，它的特征跟我们讲到的所有“认知阈尾”都一样：有其合理性，同时具有去场景化的特性。一旦去场景化，它就会陷入到滥用的状态。


    不管食物也好、药品也好、心理倾向也好、认知也好，一旦越界，超出了特定场景的边界以后，就变成了一种破坏性力量。


    我经常引用华为的那句口号“绝不在非战略节点上消耗战略性资源”。所有的“认知阈尾”都是由于它超出了特定场景，辗转发挥作用，在“非战略节点上消耗战略性资源”，从而对我们的认知形成了明显的干扰和破坏。


    # 总结


    这个单元的话题是“认知阈尾”，就是曾经有合理性，但是由于场景切换而逐渐丧失有效性，以至于完全无效，甚至具有潜藏破坏力的认知。


    当然，“认知阈尾”是一个比喻，我们也可以把它理解为“认知脂肪”、“认知赘肉”等等，就是那些曾经有用，但是越来越成为你障碍的东西，它最大的特点是：我自带而不自知。


    也就是说，如果我们对它的破坏力缺乏意识，就会像企业经营中越来越严重的坏账和负资产，妨碍和摧毁我们的认知，而我们浑然不知。


