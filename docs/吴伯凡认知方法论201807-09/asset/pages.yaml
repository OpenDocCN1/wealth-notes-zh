  md: '# 认知的加载与低配1 | 关注对象决定了认知构造


    认知的加载与低配1 | 关注对...


    第一模块 认知源代码

    第二模块 认知治理 “认知的加载与低配”

    第三模块 算法与第一性原理

    第四模块 意义炼金术


    不同但同样品牌、款式的设备有高配和低配，人的认知也有——这个单元我们着重讨论的一个问题就是“低配的认知是如何形成的”，这也是我们后面要讲到的“人如何能够打造高配认知”的引导。


    上个单元我们讲到了三种立场：物理立场、设计立场和意向立场。同样一句话反映的立场是很不一样的，比如“为什么不给我加薪”或者“为什么别人总是不能赏识我的才华”这个问题，到底是一种什么样的认知状态呢？


    如果你站在一个客观的第三方法立场，让自己处于独立观察角度，把自己当成一个对象，或者把自己所处的组织状态、结构当成一个认知对象，来仔细分析“我”为什么得不到提升——这种态就是一种物理立场。


    你也可以从设计立场的角度来提这样的问题：我没有被提升，到底我出了什么问题？


    很多时候，提这个问题的人采取的是一种意向立场，不是处在认知状态上，他的“为什么”不是在探讨因果关系，而是在以公平的立场发出了一种强烈的质疑：我觉得我已经很优秀了，但没有被提升，这到底是因为什么——他要的不是因果关系的答案，而是一个公平。


    # 为什么你看不清飞虫的飞行轨迹？


    我们常常不知不觉地陷入到一种“非认知”状态，即使你处在认知状态，认知的有效性、清晰度也存在着很大的差别。


    举个例子，夏日黄昏，你看见一只飞虫在不远处飞来飞去，但你发现，它是以一种非连续状态在你眼前飞：一会儿在这个位置，然后好像消失了；一会儿又出现在另外一个位置——你看不到这只飞虫飞翔的清晰轨迹。


    你眼前没有什么东西遮挡飞虫，但是为什么你看到的飞虫呈现出一种非连续状态的轨迹呢？问题不在飞虫，也不在飞虫所处的空间，而在于你眼睛本身的特性。


    # 猎物的可数/不可数属性决定眼睛的构造和分布


    你知道食草动物的脸和人脸，或者老虎、狮子的脸有什么不一样的地方吗？


    猎物是可数名词还是不可数名词决定了你眼睛的构造和分布。引申开来，一个物种所关注的对象决定了它的认知设备，也就是它的感官特性、认知模式。任何一个认知模式都是针对特定的环境和生态构造的。


    # 总结


    你关注的对象的特性决定了你的认知构造。人观测飞虫的时候之所以力不从心，是因为人没有以飞虫作为关注的对象，捕食的不是飞虫，这就导致了人眼的特性跟飞鸟有明显的差异。


    这节课的一个基本结论是：你关注什么，如何选择你的对象，决定了你如何构造你的认知特性和模式。


    吴伯凡

    大家可以思考一个问题：我们虽然和其他物种、其他人生生活在同一个世界里，但是每个个体的世界都是自定义的，我们不妨思考一下，“我关注的对象如何决定了我的认知模式”。'
