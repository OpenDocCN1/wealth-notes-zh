  md: '# 认知阑尾3 | 迷信是如何产生的？


    认知阑尾3 | 迷信是如何产生.. ↓


    第二模块

    认知治理与心智能量管理

    认知阑尾


    # “迷信”


    网上有个很短的帖子，是两个问题：


    +   1. 是什么力量让女人相信：按摩胸部可以隆胸，按摩脸部可以瘦脸？

    2. 是什么力量让股民们相信：20年前的股市是2700点，今天还是2700点，在这样一个股市上居然还能赚到钱？


    这两个问题还真不好回答——问题提得太别有用心了，答案其实也已经暗藏在问题里了：第一个问题里，两个完全不同的结果用的是完全相同的方法，你为什么会相信呢？而居然就有很多人都相信了，这个“相信”背后的机制是什么？当你回答了第一个问题，差不多也就回答了第二个问题。


    理性的旁观者一看就是谬误的事情，当局者却深信不疑，这就是“迷信”。


    万维钢老师对“迷信”有一个很生动的界定：


    所谓“迷信”，就是在没有道理的地方寻找“道理”，在没有意义的地方找到“意义”，在没有规律的地方发现“规律”，在没有因果的地方强加“因果”。


    但是，万老师还是没有回答一个问题：是什么力量让你相信那些“根本就不值得相信的”、“回头想起来觉得非常可笑的方法和真理？


    这个问题答案很简单，两个字：贪欲——欲望使你相信本不该相信的事情。


    而在“贪欲”之外再加上两个字，可能就更准确了——懒惰。


    “贪欲”是你怀有一种强烈的、不切实际的、毫无节制的欲望；“懒惰”是你希望以特别简单快捷的、不伤筋动骨的、速效的方式实现你的结果；“贪欲”+“懒惰”=迷信。


    # “贪婪和懒惰”


    苏格兰哲学家休谟的名言“理性永远是情感的奴隶”越来越受到现代认知科学的验证。简单说：你相信什么，得出什么结论，是谁说了算？你的欲望、你的情感说了算。


    欲望和情感能够制造一个强大的扭曲现实的立场，把一个明白的事情扭曲成你希望的样子，然后再让你深信不疑。


    一个很迷信的人的背后有两个东西作怪：一个是“贪欲”，一个是“懒惰”。


    # “迷信”是人类自带的一种“认知障碍”


    《人类简史》告诉我们：7万年前发生了“认知革命”，这之后，人学会了某种“超现实的力量”。


