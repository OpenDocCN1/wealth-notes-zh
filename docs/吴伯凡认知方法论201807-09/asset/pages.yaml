  md: "# 认知与客观化4 | 高级认知都是雌雄同体的\n\n认知与客观化4 | 高级认知都是... ↓\n\n第二模块\n认知治理与心智能量管理\n认知与客观化\n\
    \n# 认知中必不可少的“客观化”\n\n做几何难题的时候，要做出一 条辅助线往住是最难，也是是最重要的。当一条辅助线做出来，那些无所进展的思想，好象一下子可以往前推进，直到把它难题做出来。\n\
    \n这个过程包含着一个认知真理：由我们主观派生出来的某种客观的东西，虽然出自于我们，但它的作用往往大于我们，给我们的思路提供了一个支点——光有杠杆，没有支点，是撬不动任何东西的，这就是“客观化”的力量。\n\
    \n不管是一个棋盘，还是列一个清单，都给我们提供了一种客观化的对象：我们跟这个对象产生互动，就开始了一个游戏。如果没有这个东西，我们的思维和认知就陷在这里，既不能展开一个新的历程，也不能终止一个过去的历程。\n\
    \n我曾经讲过女孩子要哭的时候，对着镜子就哭不出来，这其实也是一个客观化的过程：你作为一个主体，借助镜子，就出现了一个客体。当主体观察客体的时候，主体的主观认知、认知情绪立即会发生变化，你终止了一个游戏，思维一下子发生了改变。\n\
    \n“客观化”在认知过程中非常重要，重要到必不可少。\n\n# 思维是自己跟自己的对话\n\n美国哲学家丹尼尔·丹尼特（Daniel Dennett）在他的一本书里列举了两个作家的的话：\n\
    \n> “在我明白我说说的之前，我怎么能说出我在想的呢？我不明白，我怎么能说呢？”\n\n这句话的意思是，我说出来的东西应该是 我明白的，但是我不说出来有可能就不明白。\n\
    \n> “我们讲话，不只是要告诉别人我们想的是什么，而且要告诉自己，我们想的是什么。”\n\n无论是说话还是写作，都是对我们思维的表达，这个过程看似是单向的，其实是双向的。语言从单向到双向，是人和猿的一个分水岭，可以说，“人猿有别”的“别”就是人类的语言从单向变成了双向，而动物的语言是单向的，它们发出一个声音、一个信号，只是为了让同伴知道这件事情。\n\
    \n刚开始的时候，人类也是这样发声的，比如我们的祖先说，“那边来了一群狮子”，这是一个信号。但他的同伴问，“到底是几只狮子？”我们的祖先可能也说不清楚，但他会去想，会用手指头来数数——就是这么一个反问，引发了一个互动游戏，让人类的语言“从表达变成了思维”：他开始自己喃喃自语“到底是几个”，这时候，他不是在跟对方说话了，他开始跟自己说话——跟自己说话就是“思维”。\n\
    \n人的自言自语，其实是一种思维跟语言的同步现象：在想一个问题的时候不自觉地说出，“到底是为什么呢”，这句话不是说给别人听的，而是说给自己听的，这就是透露了思维的一个秘密——思维是自己跟自己的对话。\n\
    \n đương人进入思维状态的时候，就出现了两个“我”：一个是说话者的“我”，另外一个是听者的“我”。\n\n我们经常会有这种体验：当你在跟一个特别聊得来的人聊天的时候，你发现自己思如泉涌，说出了好多让你自己都觉得很得意的观点和看法。而如果没有这个人在场，你可能一辈子都说不出这样的\
    \ 话来。\n\n对话的过程就是这样：你说出这句话的时候，不仅只是让对方听，而且是你一旦说出来，就进入到一种思维状态，作为一个“说话者”的同时也是一个“听话者”——你在听自己的话，在反省自己的话，在跟自己进行某种辩论——辩论就意味着有一个主观的和一个客观的人在进行对话。\n\
    \n钱钟书先生说，“‘讲学’，某人出去讲学，其实是‘学讲’。”这句话的意思就是，你讲学，只是把你所知道的东西单向发布出来，讲的时候，你的思维变成语言，这个客观化的东西，变成你思维的一个支点、一个对话伙伴了，让说的人成为自身的听者，说着说着，你进入了状态，就开始了一个游戏——认知游戏。\n\
    \n在这个游戏中，认知是一个结果，你是认知的爸爸，但光有爸爸是没有认知的，还需要一个认知的妈妈，这两个对象之间的互动产生一个增量——“认知”这个孩子出现了。如果不产生互动，爸爸和妈妈都是存量。\n\
    \n# “雌雄同体”的认知\n\n这就回到我们前面讲的观点：认知客观化的东西出于我们，又大于我们。它开启了一个创造认知增量的真正的认知游戏。\n\n电影《侏罗纪公园》里有一个让我印象深刻的情节：公园管理员为了避免恐龙的自行繁殖，就选择雄性恐龙关在那里，但他们这样做的时候忘了一个可怕的事实——恐龙是可以变性的。恐龙基因自带的繁殖欲望促使它变性，雌恐龙就变成了雄恐龙，交配以后就生出了小恐龙。\n\
    \n侏罗纪公园的悲剧就在于：公园管理者以为恐龙是一个存量，下再多的蛋，都不可能产生新的恐龙，但由于恐龙可以变性，导致数量一下子增加了好多。\n\n英国科学家培根（Francis\
    \ Bacon）说，“思想的最好方法就是写作”。把你的思想写出来的过程，其实是一个自己跟自己对话、争辩、商议的过程，同时，也是对自己的一种实时监测和评估的过程。如果\
    \ 你不把它写出来，你只是想，就如同 一个人没有棋盘，你没办法下棋。你担心犯 错误，所以你就不敢写。但是你不写，你就根本不知道你的错误在 哪儿，甚至你自己觉得很光明的想法，一旦写出来的时候，自己就立即变成自己的一个评判者，它实在在对你的思想进行检测，进行批判。\n\
    \n从这个意义上说，我们的认知是雌雄同体的，或者说，具有一种雌雄同体的潜能。只有雌雄同体，让主观变成客观，让一个无法产生存量的认知分化为“雌和雄”两个独立的可以互动的主体，你的认知才可能进入棋逢对手的状态。\n\
    \n而只有棋逢对手，你的棋艺才可能提高——如果我们不客观化，就没法遭遇一个对手，就会不自觉地停留在认知的存量状态。就像我们前面提到的“我们讲话，不只是要告诉别人我们想的是什么，而且要告诉自己，我们想的是什么”。\n\
    \n要提升认知，最重要的不是把我们的认知告诉别人，而是要把我们的认知告诉自己——我们把我们的认知告诉自己的过程，就是认知客观化的过程。\n\n# Iteration-迭代\n\
    \n英文中的iteration本意是一个人犹犹豫豫、吞吞吐吐，但又不得不把自己的话说出来的过程，它特别生动地体现了认知和语言的这种特点：\n\n+   你说出来的这句话的意思是不清楚，甚至是互相矛盾的，但一旦说出来，你就能知道它的不清楚和模糊的地方在\
    \ 哪儿；\n\n+   当别人不懂得这句话来问你是什么意思，你遇到这种挑战的时候，你就会试图改 变这些模糊和矛盾的地方；\n\n+   别人再第二次反问之后，你又重复上面的过程，意思就变得更清晰一些……这样别人不断问，直到你把你的意思讲得清楚清楚、明白白白。\n\
    \niteration就是你嘟囔着带着错误的话，不断重复，直到你的意思变得清晰的过程。这个词后来派生出一个非常重要的意思：迭代。\n\n将主观有缺陷的认知表达或者暴露出来，让它成为一个对象、一个客体，你就能清楚它的错误和缺点在什么地方的时候，就有了方向，就能有意识地去纠正和改善这些缺点和漏洞；等它反馈回来形成你的主观认知的时候，你又将你的认知客观化表\
    \ 达了出来；这么不断循环，直到形成一个相对优化的认知。\n\n“认知迭代”就是一个双向说话的过程，就是将你的理念变成产品。这种客观化的"
