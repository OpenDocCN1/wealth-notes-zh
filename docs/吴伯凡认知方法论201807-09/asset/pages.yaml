    # 5. 课程内容的实际应用


    这是6条原则里最重要的一条，它的权重高于其他所有的。因为课程的目的就是提升你的认知水平，我最希望看到的就是你去实践学到的概念、方法，然后来跟我和同学们分享经验。哪怕是还没有来得及实践，想一下能在那里实践，打算如何实践，也是好的。比如在讲“认知断舍离”的时候，大胃同学做了这样的联想，虽然不是正在进行时，但这是一个好的开始：


