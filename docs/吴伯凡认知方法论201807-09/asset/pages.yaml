    # 没有绝对的 高配和低配


    我们在上节课讲到，视觉作为一种非常重要的感知能力，它的特性与物种的捕食对象密切相关：


    如果一个物种的捕食对象是不可属名词，比如一片草，而不是一株一株的草；一窝蚂蚁，而不是一只蚂蚁的时候，它们眼睛的构造以及在头部分布的位置是不在同一平面上的；


    如果一个物种的捕食对象是可属名词，一头鹿，或者一个果子，这个物种必须准确定位它的捕食对象，它的眼睛则是在同一平面上的。


    为了维持生存，物种必须获取资源：资源特性决定了物种的感知方式。


    我们通常说“人是高级动物，鸟是低级动物”，假如鸟向人借一双慧眼的话，对鸟来说，这双眼睛管不管用？相对于鸟，人眼就变成了一种严重低配的眼睛，因为它一秒钟捕捉的帧数远少于鸟眼——从这个意义上说，就没有绝对的高配和低配了。


    # 任何一个能力的背后都包含着一个故事


    我们判断一种感知能力的好坏、优劣，只有一个标准——达尔文的标准：能够生存下来的不是最强大最聪明的，而是最适应环境的。


    我们可以把达尔文的这个观点作一个推论：一种感知/认知能力的优劣，取决于它特定的场景。


    人眼对于鸟来说是低配，因为人所处的场景与鸟是不一样的。换句话说，任何一个认知能力，表面上是一个既成的事实，但背后都包含着一个故事——这就是我们反复说过的：在观察一个事实的时候，要有一种将事实还原为故事的能力。


    我们讲过毒蛇的毒牙是怎么形成的：在所有蛇类当中，只有三分之一的蛇是有毒的。


    生长在水里的蛇，对于它的捕食对象，在体型、运行速度上都有明显优势。最重要的是，这些捕食对象的数量相当丰富。在这种情况下，蛇只需要通过它的物理能力就能够战胜猎物，不必有毒。


    只有在捕食对象数量很少，出现频率很低，蛇与捕食对象在体型、力量、速度上相比没有优势，蛇仅仅物理力量没办法一招制敌抓住院物，而一旦丧失这次机会就可能饿死的情况下，蛇才必须要动用化学武器——毒，这就是毒蛇的来源。


    我们看到的任何一个能力的背后都包含着一个故事，一个场景。当我们发现两个物种的感知能力特别悬殊，对这种差异困惑不解的时候，就意味着我们对它们之间的深层场景差异缺乏足够的认知。


    # 信鸽为什么不迷航？


    有一个难题曾经长期困扰着动物学家：信鸽到底凭什么能力不迷航？


    世界上最早的通信社——路透社，获取的竞争优势就是不为人知地使用了信鸽：从布鲁塞尔把股票的消息传到德国。


    信鸽是凭着什么样的认知能力在那么远的距离都不迷失方向呢？动物学家开始总是从“凭地面标志物”或者“特定声音”这些视觉、听觉上寻找答案，后来，他们发现，当一个地方的景观发生明显变化，比如一夜之间很多建筑被炸毁了的时候，鸽子还是能认得原来的地方——它们显然不是通过视觉和听觉给自己定位的。


    一直到大概上个世纪七十年代，有人开始怀疑，信鸽的这种导航能力跟视觉和听觉无关，而是跟一种我们还不知道的感知能力有关——科学家怀疑，鸽子是通过磁场定位的。


    科学家在鸽子头上绑了一小块磁铁，结果它完全迷航了：磁铁干扰了鸽子本身的磁场定位能力。


    北京大学的一个教授在2015年有了一个重大发现：鸽子身上有一种“磁感受蛋白（磁受体蛋白）”。事实上，除了鸽子，还有帝王蝶、大马哈鱼，都是通过磁感应定位来找到自己出生的地方和目的地的。


    我们把这种很神奇的感知能力叫“第六感”，但站在事后诸葛亮的立场上来说，这并不奇怪——还是前面说的那句话：一种独特的认知能力一定跟独特的场景有关。鸟眼单位时间内捕捉的帧数远多于人眼，是因为它是以飞虫作为食物的。


    # 生态位的红海和蓝海


    我们之前讲过“生态位决定认知”，如果把这个命题进一步推演，其实就是：所谓的生态位，本质上不是物理位置，而是一种特定的场景。在这种特定的场景下，特定的资源和获取资源的能力，这两者的适配形成了生态位和物种的关系。如果鸟的眼晴没有捕捉飞虫的能力，那这个生态位就不存在。


    有很多生物生活的物理空间是重叠的，但它们处的生态位非常不一样，比如蝙蝠是一种性状上跨界的生物，既是鸟又是兽。有人说蝙蝠的生存优势来自它的跨界，这只说对了一半，更重要的是，蝙蝠之所以能够生存下来，不在于它占据了一个独特的物理空间，而在于它占据了一种独特的场景：同样吃虫子，蝙蝠跟鸟之间不形成竞争的原因是，当鸟开始“傍鸟归巢”的时候，蝙蝠才出来——在时间上，蝙蝠抓住了特定场景，跟鸟发生了错位，这种特定场景就是管理学上的蓝海。


    红海是指许多物种的生态位重叠，导致激烈竞争的物理空间。在这个物理空间里，各种各样的物种面对的基本上是相似的场景，它们能力和资源的匹配也基本上是相似的，因此就导致了生态位的重叠，也就是管理学上的竞争；而蓝海不是另外找了一个物理空间，而是很有可能还在一个空间里，找到了一种独特的场景。


    你的屋子前后有鸟和蝙蝠，但蝙蝠出没的时间和鸟是不一样的，这就是虽然在同一个物理空间下，但它们不再形成竞争关系。


    # 总结


    +   1. 任何一个认知能力都跟极其特定的场景相关。

    2. 任何一个认知能力都可又还原为一个故事。这个故事里包含着极其生动、细致、精微的场景。

    3. 一种认知能力要形成优势，就必须与这个极其特定的场景形成一种精密的适配关系。人眼对于鸟眼之所以是低配，因为跟鸟的场景没有形成精密的适配：表面上人好像能看见飞虫，但由于不是以飞虫为食，所以相对于鸟眼来说，人眼是很粗糙的。

    4. 竞争力来自于认知能力跟微妙场景的适配。如果没有这种适配，认知能力就是一种低配的认知能力，就像你用二十万像素的数码相机拍出来的照片。

    5. 真正具有优势的认知一定是场景化的认知。去场景化的认知，或者跟场景没有精妙适配的认知，都是没有竞争力的低配认知。


