    # 认知的三位一体思维结构


    我们上节课提示大家：认知必须由繁入简。如果你不能达到一种以简驭繁的程度，证明你的认知还是在初级或者在中途。


    看《三体》也是这样，当你从纷繁复杂的事情中发现了大的3，小的3，一个个的各种三体之间的关系的时候，混乱就会变得有序。说到底，认知是一个从混乱到有序的过程。


    那我们的认知是不是存在着这样一种类似于三位一体的结构呢？答案是肯定的。但它不一定是完全的三位一体。如果我们用三位一体的思维对我们的认知进行解析，就有可能有一个更清晰的认知。


    我的一個朋友听了我们的认知方法论以后，问了他儿子一个问题，我觉得挺有意思的：


    > 爸爸：这个东西好脏，是一个判断，这个判断里到底有一些什么样的要素呢？


    小孩：（听不懂）


    > 爸爸：我们用一个干净的碗装一些不干净的东西，甚至象屎这样的，然后把脏东西倒掉，用最强力的洗涤剂把碗反复洗。洗完之后，我让你用这个碗吃饭，你干不干？


    > 小孩：我不干！


    > 爸爸：为什么？


    > 小孩：它太脏。


    > 爸爸：我都告诉你我用最强力的洗涤剂已经把碗反复洗过了，它其实不脏了，你为什么会认为它脏呢？


    > 小孩：它就是脏！我心里就是觉得它脏。我一想到它曾经装过什么，就没法用这个碗。


    > 爸爸：你爱吃猪大肠吗？


    > 小孩：爱吃啊！


    > 爸爸：猪大肠不脏吗？在某种程度上，猪大肠比那个碗还要脏，你为什么要吃它？


    > 小孩：它好好吃啊！


    答案就是“它好吃”——欲望在那儿。


    欲望决定了你的认知，你就不觉得猪大肠脏了，而碗还可以由别的碗来替代，你又不吃那个碗，碗也不好吃——没有欲望成分的时候，你的判断就不一样了。


    对一个事实的判断里，总夹着我们不知道的、非认知的东西，比如欲望。当然，除了欲望可能还存在另外的东西或者别的成分。以前我们讲过木板：一个木板放在地上，你走来走去，一点事儿都没有，但把它放在两座楼之间，放在悬崖之间，你就走不下去了。


    我们可以分析一下：“不会掉下去”是一个理智的判断，因为你在地上走的时候，在木板上跑来跑去，脚都没有触到地面，证明你的平衡能力是完全能从这个木板的这头走到那头的。但你为什么不敢走？一个很重要的因素是恐惧。恐惧一旦加入进来，你就会觉得这是一件非常危险的事情。


    我们还可以设想另外一种情况：有人悬赏说，“如果你能从放在两栋楼之间的木板上走过去，就可以得一千万奖金”，你当然还是觉得危险，但你可能突然发现：也并不是那么危险——同样一件事，因为欲望加入进来，你的判断又发生了变化。


    认知、欲望加恐惧，这三种要素在我们对一个事物的判断中都在起作用，只不过配比不一样，导致你的判断不一样。


    我们通常以为有了认知能力，就产生了认知，就如同面前有一个东西，你用照相机拍下来就成了一张照片——这就是以前讲到的镜式思维。我们在讲“镜与灯”这个单元的时候，有一派观点认为：我们对世界的认知就如同同一面镜子照着一个对象，形成的认知就是对客观世界、对象的反应。但正如我们讲到的，镜子并不那么客观，很可能是一个哈哈镜，还包含好多色彩，照出来的东西跟原来那个客观的东西符合度到底有多少，这是需要大打疑问的。


    正如不同相机拍摄同样的景物，效果是不一样的，我们认知内蕴的结构决定了我们认知的结果。所以，不要太相信自己的认知。当一个认知形成的时候，用以前的话来说，“它是产品，是我们的认知机制把它生产出来的”。工艺、设备、手法的不同，都会导致生产出来的东西不一样。


    # 感知判断+欲望+恐惧=认知三原色


    影响我们认知的诸多要素中，欲望和恐惧是两个非常重要的要素。感知或判断，是相对客观的成分，再加上欲望和恐惧这两个要素，就形成了我们的认知三原色。


    俗话说“宁拆十座庙，不拆一桩婚”。我身边也有一些朋友常常冒出想离婚的念头，我劝他们不要离婚的时候，以前都用那种常规的方法：忆苦思甜，讲各种道理，告诉他，“你现在看上的非常漂亮的女孩儿，娶到家里就不漂亮了”等等，但这些道理说再多都不管用，因为他知道这些道理还是不会回心转意。


    后来我意识到，要改变人的认知，必须要改变他认知三原色的配比。


    比如有一回，我有个朋友要跟太太离婚。这个朋友有个特点，比较信神秘主义的东西，我虽然不信，但我觉得这个东西是有威力的，就语重心长地跟他说，“你这么多年挣这么多钱，有没有想过，是你老婆旺财，她是你的一个隐秘的财神吗！你离婚以后，财神不在了，你的钱不就哗啦哗啦全没有了？”这个朋友一听，表情一下子变得非常庄重，重点了
    Jenny 一下头。


    几天以后，还发生了从for...


