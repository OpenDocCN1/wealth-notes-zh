    # —— 本单元十大精彩留言 ——


    # 获奖留言


    @清风徐来


    今天讲的韩愈的故事，让我想起了竹子成长的故事。


    一根竹子，用了四年时间仅仅长了三、五厘米，但到第五年，却能够以每天三十多厘米的速度疯狂生长，仅仅用了六周时间就长到了十四、五米高。为什么能有如此惊人的速度？是因为竹子在前四年的时间里，让自己的根在土壤里延伸了数百平方米。


    我们常说一句活，叫“画虎画皮难画骨，知人知面不知心”。画虎皮、画虎廓容易，但你想画出虎的神骨，其“后台”不知要积累多少的观察与信息。每个人的外表都是眼耳口鼻面，简洁可视，但你想视其面而知其心，却不知要拥有多少广泛阅人的经验。


    竹子成长的故事和画虎知人的喻意都表明，人生的精彩、事业的成功，其背后都有一个“疯狂”扎根和壮大“后台”的艰辛过程。终点的简单，并不意味着起点与过程的简单。


    问答 16 | 大自然没有说明书


    @斜阳


    上周万维钢老师一直在讲数字宇宙，只要我们观测的颗粒度足够小，一切都可以是数字的、量化的，在计算能力越来越发达的今天，那些隐秘在人脑后台的数据都可以被显性化地抓取出来，进行人工智能的对应训练，把人的特定生问经验数字化的过程其实就是找到合适的硬件感应器的过程，人类直觉的优势就是一座不断露出水面的“冰山”。


    关于人与人之间的对比，以即兴表演或演讲为例，容易发现其实没有真正意义上的临场发挥，即使是所谓的尽兴表演大师也都是提前准备了大量的后台“套路”去应对各种场景和突发状况，也就是准备了大量细微的模式认知链接，外行人看到的是应变能力，内行人看到的就是大量的练习和准备。


    直觉与数据主义 3 | 认知差距的本质


    @He00


    在乡下农村里，发现有一些老人特别有智慧。他们有些人甚至没读过什么书，不懂什么科学，但是处理事情来，总是让人觉得跟算命先生一样，什么都知道，而且还很准。这样的老人就是从实实在在的生活中共收集的数据，首先他们会从老一辈那里继承大部分数据，然后又通过自己的生活收集数据，到了一定的年纪，在那么小的生活范围里，就能对周围的生活了如指掌。


    为什么只有很少的人能做到对周围数据了如指掌？我应 应该是跟他们用不用这些数据有关，虽然我们都是数据训练出来的智能产品。就像老师之前讲的，如果你没有把自己置身于这样的选择压里，你就不会对出现的这些数据有感，也就不会收集这些数据，驯化这种能力。最后这些数据只会散落在记忆，毫无用处。就像散落在大地
    的草，你不收集起来进行编织，就不可能成为草席。


    直觉与数据主义 3 | 认知差距的本质


    # 其他精彩留言


    @潘小烟


    想要实现终身学习，就要时刻保持认知的活力，而维持认知活力的源动力就是要时刻保持好奇心，并且用迭代式的成长不断打破固有认知。


    有时候我们说一个人老了，其实并不是年龄上的老化，而是心态上的、认知上的老化。代表人老的标准就是是否还乐意接受新的认知、新的讯息、愿意通过新的认知作出调整和改变。像查理·芒格这样不断优化认知的人，怎么会老呢？


