    在“思维模式×热情×能力”这个公式里，你的智商、感知能力、逻辑能力、判断能力都很高，但最后的结果是三个数的乘积，如果思维方式是负，就是灾难了；如果热情是0，整个结果都是0。


    我们一直在讲“认知很重要，但认知不是唯一的”。认知是条好汉的话，“一个好汉三个帮”，周围如果要素缺乏的话，认知也是没有用的。


    我们可以想象一个很生活化的场景：


    你是一个正在相亲的女生，和相亲对象在一个屋子里聊天，忽然，窗外传来了很大的噪音，这时候有两种可能：


    +   相亲对象说，“怎么这么吵！这是什么地方？你怎么住这种地方？！ ”

    相亲对象默默去把窗户关上了。


    这实际上也代表了两种思维方式：


    +   事实导向的思维方式——镜式思维；

    效果导向的思维方式——灯式方式。


    那么，相亲成还是不成？该不该找这样的人结婚？答案是显而易见的。


    吴伯凡


    大家可以思考一个问题：我自己的思维方式是“镜式的”事实导向的思维方式，还是“灯式的”结果导向的思维方式？


    # 划重点


    认知很重要，但认知不是唯一的。稻盛和夫提出了一个“成功方程式”：成功=思维模式×热情×能力。如果认知是条好汉的话，“一个好汉三个帮”，周围如果要素缺乏的话，认知也是没有用的。


