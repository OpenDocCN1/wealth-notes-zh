  md: '# 直播回顾 | 第一模块重要概念复盘


    吴伯凡


    7月6日我来到直播间做了一场直播，带大家复盘了第一模块的三个重要概念，今天把直播的文字精华版放送给你，希望能对你学习第一模块的课程有所帮助。


    这次直播我要讲三个题目，这三个题目都是我在课里讲过的：第一，到底什么叫知行合一？第二，到底什么叫格物致知？第三，恐惧与颤栗。


    # 一、知行合一


    听过我课的同学可能都知道，“知”在中国古代不仅是知识的意思，还是了解、掌握、管控、监督的意思。有几个词一说出来大家就知道了，知县、知府、知州，就是朝廷派一个人到那个地方去管理、监督、治理、掌控那个地方的。


    “知”本来的意思就是：有个目标，有个靶子，你拿着一把弓，把箭对着那个靶子射出去，射中了。知本身就有行为的意思。在古人看来，懂得一个东西就是会做一件事情——我懂开车，我懂盖房子，懂本身就有知和行合一的意味。


    我们讲知行合一的时候，特别想提醒大家的是同步这个概念。


    同步这个概念是一个计算机术语，当然也是一个哲学术语，古希腊、印度和我们中国其实都有类似的概念，最明显的就是佛教。佛教认为，你看到的东西都是你的内在显现、同步出来的。


    知行合一是什么意思呢？就是说你的行，你内心的结构，你的代码同步到你在外的世界。


    # 二、格物致知


    如果你念过一点中国哲学的话就会发现，关于“格物致知”有好多好多解释。


    通行的解释就是：物是杂乱的，就像一堆书放在那，一个图书室要用各种各样的编目把这些书都收进来，这样它才是可用的。如果没有编目，这堆书就叫旧书仓库。我们学习的时候，也容易形成一个误区，就是不断地收集各种东西，这也存储一下，那也存储一下。所以格物，要先有格，然后再有物，有材料，把它编目整理，才形成格物致知。这是一种通行的关于格物致知的解释。


    当然还有一种解释说，格本身就是实践、博弈、格斗。


    # 三、恐惧与颤栗


    颤栗是恐惧的表现形式，恐惧是一种心理活动，颤栗是影响到心理的，实际上他们是相关的，当你足够恐惧的时候，你就会颤栗。


    这个东西是怎么来的？首先我们说恐惧是一种有用的工具，和我们所有的认知一样，它是一种生存工具。'
