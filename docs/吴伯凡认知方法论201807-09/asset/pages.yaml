  md: '# 直觉与数据主义4 | 还原事实背后的故事


    # 曾国藩： “模式识别” 高手


    有一个曾国藩的故事：李鸿章有一天带了两个他认为相当不错的得意门生来见曾国藩，想让曾国藩帮他看看这两个人到底怎么样。


    聊完以後，曾国藩送他们到门口，忽然对那两个门生说，“你们先走，我和你们老师还有点儿事”。看着这两个人出门走远了，曾国藩说：


    > “我其实没什么事，就是想看看这两个人的步态怎么样。右边这个人将来一定不可大用，你看他刚才走的时候，是蛇行的一——走路蛇行的人，表面上很机灵，但内心很狡漫，不坚定，喜欢投机，这样的人遇到大事一定会飘忽不定，守不住阵脚，甚至会背信弃义”。


    李鸿章听了曾国藩的话只是笑笑，并不是太相信。但多年以后，事实验证了曾国藩的判断。


    据说曾国藩看人 “一绝”，能够从一个人的外貌、行为举止、说话走路的方式判断这个人的内心是怎么样的。


    # 套路：发现 “万变不离其宗” 的 “宗”


    我们讲过，“模式识别”的特点是“复杂的后台、简洁的界面”。“识别”是从“简洁的界面”里，通过快速复杂的后台计算，捕捉到简洁的外在对对象深藏不露的信息。


    要实现这种“识别”，就必须从大量的数据当中，自下而上地生成模式，通过大量数据输入（我们通常把这种数据输入叫做“喂养”）养出某种模式，实现模式的建立和迭代。


    +   1. 事实，你眼前看到的这个事实；

    2. 故事，这个事实背后的故事。


    # “最重要的事情都是看不见的”


    最近两个单元的课程里，我们讲了“图形界面”和“模式识别”，这两者背后隐藏着一个话题——审美。


    《小王子》里说，“最重要的事情都是看不见的”：通常，我们只是在文学的意义上理解这句话，其实，这句话里包含着一个关于“认知”的重要道理——数据既重要又不重要。


    没有大量的数据，你没办法从数据中生成、撬炼一种模式，而仅只是不断输入数据，没有一种模式生成和学习机制的话，数据就是一堆混沌而毫无意义的材料。


