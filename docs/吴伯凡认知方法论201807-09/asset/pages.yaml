  md: '# 直觉与数据主义2 | 认知的同化、顺化与平衡


    直觉与数据主义2 | 认知的同...


    第二板块

    认知治理与心智能量管理

    直觉与数据主义


    # “碳基智能” & “硅基智能”


    上节课我们从“人工智能”讲到“人的智能”，这二者之间的差别显而易见：通常我们说，人是一个智能生物，也可以叫一个智能设备——只不过这个设备用的基质是碳，所以叫“碳基智能”。而“人工智能”的基质是硅，所以叫“硅基智能”。


    这种“材质上的不一样”还衍生出很多“不一样”，比如，电脑有“摩尔定律”（Moore''s Law），大約一年半到两年的时间，电脑性能会提高1倍，而价格会降低50%——这里的软硬件是可以分离的，或者说，硬件可以不断更新，而软件可以附着在一个新硬件上面。


    从这种差别，我们还可以进一步推演到“人工智能的三大基石”：算力、数据、算法。


    # 1. 算力


    我不久前参观一个做高性能计算公司的时候，工程师从柜机里拿出了一块类似于移动硬盘的东西，这上面存储的数据，相当于2002年整栋大楼所有设备存储数据的总量，对此我非常震惊。


    # 2. 数据


    我们每个人每天享受信息服务的同时，也都在生产各种各样的数据：位置信息这些就不用说了，有些甚至你自己都不知晓，比如你在手机上滑动的姿势产生的数据都是不一样的。


    据说有一种技术能够识别“被强迫按密码”这个行为，当这一情况发生，它能识别出来并给出发相应反应。这么看来，全人类每天都在从事数据生产，不断喂养“人工智能”。


    而人就不一样了，随着年龄的增加，人从设备上说，硬件老化，算法简化，甚至幼稚化；同时，随着年龄增加，会有意无意陷入一种自闭的状态，接触外界越来越少，导致数据量也在大减少。


    这样比较的话，作为“碳基智能”的人，跟“硅基智能”——计算机所代表的“人工智能”之间，越来越呈现出一种“剪刀差”——没得可比。


    而人类个体认知的退化、老化、固化还有一个原因：跟人的认知特质相关。


    # 3. 深度学习算法


    瑞士心理学家皮亚杰 (Jean Piaget) 把人的认知过程概括为三个步骤：


    同化


    我已经形成了一种认知模式，外界的信息一过来，我就对它进行整理过滤，让它适应于我的认知——我认为你是坏人，我就把关乎“你是好人”的信息自动剔除——反过来也一样。


    顺化


    当你拿着一个框架去“框”外界的东西的时候，你发现框不住，一次不行，二次还不行，这个时候你就会反省“我这个框架有问题，我这个看法有问题”——对自己的既有模式进行修正。这其实这也是一个“迭代”的过程。我们以前说的“认知地震”——让你既有的模式被过去改变的过程——就是“顺化”。


    平衡


    “同化”也好、“顺化”也好，都是过程性的存在，要达到一个平衡——“既有模式”跟“你接触到的材料”之间形成的平衡：“哦，是这样的，明白了，想通了”就是“平衡”。


    “学习”跟生命活动一样，是“远离平衡态的平衡态”。你衡量自己是否在学习，要看是否形成了某种平衡态，是否有收获。


    当你觉得一个东西特别有道理的时候，首先发生的是“同化”，用你既有的东西理解那个东西，证实你既有的认知——如果仅仅是这样“言言悦耳、事事顺心”的话，你就已经开始远离学习状态了。


    如果你处于学习状态，你的心智上一定在发生另外一件事情——顺化，把自己既有的框架进行调 chỉnh。


    我们为什么会产生焦虑感和恐慌感呢？因为外界的这些东西让我们 的框架觉得很无能，一直在颠覆你既有的心智模式，就成了一种恐慌状态。


    # 学习——远离平衡态的平衡态


    学习的状态是同化与顺化达到了某种动态的平衡——学习是“远离平衡态的平衡态”。


    想要让自己远离平衡态，首先就是不断接纳新的数据，对新数据、新信息始终保持一种开放的态度，让新数据不断进入到头脑当中。


    可能有同学要问：不断输入新的数据，何时是个头呢？


    我们说，数据不是目的，新数据的进来，是在挑战你的既有认知。当你的既有认知作出调整，形成某种平衡，通过这种不断重复、练习、同化与顺化之后，人的大脑就会很聪明。


    有点儿像一个会授权的CEO，在重复的事务越来越多，越来越稳定的时候，他不会事无巨细都管，而是把一部分交给手下，或者说，他不用再管这些了——通常的说法是“从大脑皮层下放到下丘脑，最后就会实现不知道的知道，形成一种意识自动化”——你掌握的东西越来越多的时候，整个认知负担并没有相应地增加。


    大家可能会恐惧，“我学的东西太多了，会不会把我的脑袋撑胀破吗？” đương nhiên不会！大脑是很会进行管理的，它会将已经形成的熟练认知下放——不管了，授权了，继续去接触新的东西了——这是一个不断吸纳、下沉的过程。


    上面我们说的是个体的认知。作为人类，作为一个物种，我们的认知更神奇的地方在于，能将很多的认知，以及认知以后的反应、决策下放，进入一种无意识状态。


    比如我们以前讲过，你吃到糖觉得甜，如果把这个过程分解的话，就是：糖意味着高热量→高热量意味着对你的身体好→对你的身体好，就要在食物稀缺的情况下，尽可能地摄取——这个摄取没有谁在指导你说“这个热量高，你赶紧吃吧！”不需要。


    人的大脑形成了一种回路，一旦探测到高热量，就尽可能地摄入，这个过程压缩成一个瞬间的行为就是“觉得甜”，而“甜”让你舒服，你舒服就会吃——这是一种我们自己不知道的“智能合约”，只要后台条件满足，它就自动执行。


    就像你作为一个公司的大老板，公司有很多很能干的人，那些对公司有利的交业务，他直接瞬间就完成了，不需要你操心。


    # 总结


    无论作为“碳基”的“人的智能”和作为“硅基”的“人工智能”差别有多大，有一点是相通的：将极其复杂的运算“后台化”，并且在瞬间完成。就像现在，一些“人脸识别”技术，能够在一个人化了妆，戴了帽子、墨镜的情况下，仅僅根据步态，或者几个表情，就能确认这个人的身份。


    1. 人在认知上的竞争优势，不是“前台”的认知，而是“后台”的认知。


    换句话说，通过反复学习和练习，将认知不断沉底，让认知冰山在水底下看不到的部分越来越大。


    2. 两个个体之间的认知能力的较量其实是两种认知体量大小的竞争。


    认知的绝大部分都是看不到的、后台化的，就像冰山的十分之九都在水面以下。


    3. 不断接触新的数据、同化数据、优化算法，将认知能力沉底，变成一种自动化的快速反应——这是人和“机器学习”共同的规律。


    4. 最后，我们的认知会表现为：当机立断、急中生智、熟能生巧的能力。'
