  md: '# 算法与认知2｜底层中立与定向选择


    算法与认知2｜底层中立与定...


    第二模块

    认知治理与智能治理

    算法与认知


    有同学说，上节课让他脑海里一直盘旋着一句歌词，“有多少爱可以重来，有多少人值得等待”。的确，“决策的机会点”与“认知的成熟度”之间看似是不可调和的矛盾，实际上是有一个定数的——37%定律。这个37%就是一个算法。


    前台的人玩得轰轰烈烈，而后台一直在操纵的是你不知道的那个东西，这有点类似我们 लेकर 讲过的“隐性玩家”：当你精确知道你在哪一天该抛你的股票的时候，你已经在巨大痛苦之中了，因为股市结束了。


    # 天算：洞悉老天的“算法”


    有句话叫“天机不可泄露”。得到天机是一种凶兆，而不是吉兆：老天会惩罚知道它算法的人。


    +   1. 任何物种都是由众多个体构成的；

    2. 个体之间是有差别的；

    3. 所有个体在特定时间段面临的是特定的环境。由于这个环境是“不变 量”，导致有差异的个体与环境的适配性就不会同。只有跟环境最适配的个体才可以拥有繁殖的机会，其他没有适配性或者适配性很差的个体就会在繁殖之前被消除。


    物种就依据这么一个非常简单的法则或者算法不断进化。


    # 算法的特点：底层中立


    # 你与算法的关系


    ![](img/274b424b97ce4eb2f1045ee5c4c6fac4_53_0.png)


    ![](img/274b424b97ce4eb2f1045ee5c4c6fac4_53_1.png)


    《阿甘正传》里，贯穿阿甘人生始终的是：不要犹豫，行动，持续地行动。这是一个特别简单的规则，阿甘从童年就知道这个规则，他记住了这个规则，并且后面所有的行为和结果都是依据这个简单的逻辑和规则运行的。


    古人说“大智若愚”，“大巧若拙”，“大成若缺”，那么巧和拙、智和愚、成和缺之间到底有什么关系呢？我们下节课再讲。'
