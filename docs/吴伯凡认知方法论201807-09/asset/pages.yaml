    意义炼金术


    # 1. 真伪球迷的数据捕捉能力


    有一次我作为伪球迷跟一个真球迷朋友一起看足球。在一个过人动作之后，我这个真球迷朋友就感慨良多，我我看着下面比赛的时候，他还沉浸在那种感叹里，不住地说，“太妙了，太妙了”。


    我就有奇了，我只是觉得这个过人过去是挺好的，但妙在哪儿哪，我怎么没看出来呢？这个真球迷朋友给我解释了半天也解释不清，就说，“算了，你也没有踢过球，跟你说你也不懂”。


    听了他们这句话，我想到的事：面对同一个对象，我们捕捉的信息和数据是非常不一样的。而捕捉的数据量取决于你对场景的感知。如果没有经历过那种场景，你的认知就处于一种天然的粗糙状态，对大量潜在在这个场景当中的消极数据、微信息、隐信息都没有任何感知。


    换句话说，我们的认知就像一个在打捞数据的网。如果网眼太大，大量的微信息和隐信息就打捞不到。而当你打捞不到的时候，它在你的感知里就不存在。这也就解释了为什么没有钱的人知道自己没钱，而没有品位的人不知道自己没品位。


    # 2. 安装家具：场景的重要性


    前不久我有一个安装家具的小经历：我订了一件很简单的家具，被运过来，预设自己是能安装的。我这个人手笨，但还愿意尝试，结果就花费了我一个半小时的时间来安装这么一个简单的家具，更要命的是，我装出来的家具还是错的——虽然我发现是错的，但那时候我身心俱疲，完全不想再装了。


    安装家具这么一个简单的事，都包含着那么多的细节，有那么多未曾想到的流程，任何一个流程上的疏漏或者颠倒都会带来无尽的麻烦。


    在装完这个家具以后，我也才知道那些小工具是干什么用的：你的工具箱里，还有厂家给你准备的那些工具、零件，你之前都不知道是做什么的。


    通过这样一件事情，我感受到场景对于形成真正有效的认知是多么有用，而我以前关于安装家具的知识是如何浅陋和不中用。这里的关键词就是情景、场景。


    # 3. “微场景”的边缘竞争力


    出去旅游的时候，我们在别人眼里就是“观光客”，浮光掠影看一遍，拍拍照，目的就达到了。但要真正了解一个地方，除了观看、拍照以外，还要真正地游，就是比较细致、深度地去接触场景。只有经过这种“游”的状态，你对它的认知才可能进一步深化。


    古人说，“一个景物可观，可游，可居”。意思就是，要在那个地方生活一段时间，你对它的认知才会是另外一种样子。


    中国的山水画里，不管画的是多么纯真的风景，总要加一个小亭子、一个行走的人，或者一排茅屋。因为画家要通过这些要素，把观画的人从“观”的状态引向“游”的状态，进一步引向“居”的状态，让我们脱离浮光掠影，进入某种沉浸感。


    当然，只是纯粹看一幅画是很难有沉浸感的。假如你是一个画风景画、山水画的画家，看到一幅风景画，那你可能会进入到另外一种沉浸状态，不一定是沉浸在山水里，可能是沉浸在绘画的场景里，感受到这幅画里的妙处和它的漏洞；而一个不是画家的人，对所有这些状况、细节、数据都是天然无感的。


    特定的、细微的场景和情景才能够塑造、激活、强化、优化我们能力的毛细血管，而只有这样，这些毛细血管般的能力才可能真正形成你的竞争力。


    这也就是我们以前讲的“边缘竞争力”，看似在最末梢、最边缘的能力，其实是最重要的竞争能力。


    # 4. “只有被迫害妄想狂，才能生存”


    我们以前讲过，安迪·格鲁夫1984年访问日本的时候，发现了英特尔的战略转折点。那次到日本的时候，日本朋友对他的接待也很热情，一行人都觉得很满意。但是，他就是感觉不对，问同行人，“你们有没有觉得对我们的态度有所变化？”其他人却说，“没有啊，哪有什么变化？挺好的”。但是，格鲁夫说，“不对，我觉得有变化”。


    他因为这种感觉，回去查资料，发现日本的存储器行业已经接近于英特尔的水平了，按照这个曲线，甚至很快就会超过英特尔。所以他做了一个对英特尔至关重要的决定：放弃存储器业务，转向芯片的业务。


    有了这次经历，安迪·格鲁夫有个感悟：只有被迫害妄想狂才能够生存。所以“被迫害妄想狂”，就是在别人感觉不到可怕的场景里，感受到细若游丝的信息，知道这个场景的微妙的变化。


    为什么他具有这样一种能力呢？因为他有几个身份：偷渡客、犹太人、耳背的人。由于他的耳朵不怎么灵光，所以常常感受到语言之外的各种信息，能从一些气氛里捕捉到最细微的信息和数据；他是个犹太人，早年有过偷渡的经历，这种人生阅历使得他感知的方式倾向于对那些消极数据、微信息、隐信息有一种特殊的敏感——特定的场景造就了他的认知的模式，使他能捕捉大量的隐形数据，感受到“可意会不可言传”的那些东西。


    # 5. 富兰克林的“场景化”写作训练


    大家可能听说过富兰克林早年学写作的经历：他学会写作的时间可以说是“神速”，在一年的时间里，他从印刷厂的一个工人变成了专栏撰稿人。那么，他能力提升的神奇速度的背后是什么？是他采取了一种很独特的自我训练方法。


    富兰克林当时是个印刷工，每天要接触报纸，他也会看一些报纸上的文章。在看完一遍以后，他就把报纸放在一边，自己重写这篇文章。写的时候他发现，他以为已经看懂了、了解了、领会了这篇文章，但一下笔，能够写出来的东西很少，就那么几句话，而且跟文章一对比，这些话表达的还是相当不准确的。


    接下来，他毫不气馁，把报纸再认真看一遍，重新再写——由于他写作的过程是一种进入场景、情境的过程，就比泛泛阅读所能捕捉的信息量大得多。在经过七次的回还之后，富兰克林最后写出来的文章跟原来那篇文章的差距就不是太大了。他用一年的时间，用这样一种方法反复训练自己，就能自学自己写好了。


    进入到场景当中，你才能够真正获取那些微妙的、精微的，又是关键的数据和信息，你的认知密度就会越来越高——富兰克林的这种自我训练方法看似很笨很慢，但是非常有效。


    我们“背诵一篇文文章”和“在知道了作者的立意之后，自己再来写这篇文章”的差别就是：前者没有场景化，或者场景化程度很低，后者是高度场景化的。只有在这种高度场景化当中才能够获取真正有效的数据。这就解释了我的那个真球迷朋友为什么能够在一个过人动作里感受到比我多得多得多的信息和数据。


    # 6. 扭力扳手：低配到高配


    我给大家讲一个奇特的工具，这个工具很多人都没见过，甚至专业人士见到的也不多：扭力扳手，是在做骨科手术的时候使用到的一种扳手。


    做骨科手术的时候，一般会钉钉子，拧螺丝。我们知道拧螺丝的时候，刚开始你能够控制你的力度，但越是到了关键的时候，不那么容易拧动的时候，螺丝的反作用力越大，你的作用力也会越大，这个时候你控制不好这个精度，很容易失手。


    在最需要你对度的把握的时候，你最容易失准——这种知识没有谁能够告诉你，是在长期的细微场景里获得的默会知识，离开长时间的刻意练习，是不可能掌握这种技能和知识的。'
