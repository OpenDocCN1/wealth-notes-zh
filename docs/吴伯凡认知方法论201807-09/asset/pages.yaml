    老师说灯是“有限性”的，这让我想到了手电筒，白炽灯和太阳的区别。认知狭隘的时候，就像是手电筒，光线非常聚焦，但是光源微弱，只能看到眼前的一小块，别的地方模糊一片。虽然也能用它穿过走廊，但仅仅只是穿过，过程中没有全局观，看到前方但看不到地上的障碍，容易摔倒。


    高一层的认知像房间里的灯，只要灯的瓦数和房间面积匹配，就能看到全部，是一种高认知带来的全局观。问题是夹角缝隙这些细节依旧未必能看到，并且内容太多没有重点。


    最终认知就像太阳，osen的时候一片光明，这是认知与周围事物的匹配。但是一旦落下则一片漆黑，所以认知都有局限、都会过时，不可盲信、不可过度推崇。


    来自：镜与灯2 | 灯式认知


    灯是一种辅助工具，帮助你去行动。比如得到App只是一个提供知识的平台，输出知识还需个人在实践运用。


    比如王烁在专栏中提到提高影响力四点：


    +   1. 有什么要求当面提。因为这样别人会由于拉不下面子而很难拒绝。如果你自身面对这种情况，同时不想事后后悔，可以说给我点时间，容我仔细考虑。\n2.
    态度要好，立场坚决不变。\n3. 贴标签。比如想让小孩子收拾屋子，对一个小孩子说你是一个干净整洁的孩子，比起说你应该变成干净整洁的孩子，所达到的效果会好很多。\n4.
    敢于开天价。原因有三点：A.对方承受天价的概率可能比你想象的高。B.为你们的谈判定锚，深刻影响接下来的谈判。因为人会受锚的心理影响。


    这四点很有说服力，但如果不能学以致用，活学活用，运用到生活场景，知道等于不知道。


    来自：镜与灯2 | 灯式认知


    我想起罗胖讲过的一句话，他说当你要参加一个活动的时候，这个时候你有两个选择，一个是在家休息，一个是参加，这个时候你要选择去参加哪个活动，因为你去参加那个活动会发生一些意想不到的事，就拿罗胖说的，万一有一天你又来到那个地方，但是那里发生火灾所有人出不去，因为你之前来过所以你比别人熟悉地形，获得生还的概率大大增加，但是如果你选择在家里，就不会有那么多的意外连接。


    来自：镜与灯3 | 如何从黑暗森林走出去？


    今日新概念：事实思维与效果思维。我认为可以这么理解：事实思维 = 镜式思维 = 司令官思，维效果思维 = 灯式思维 = 侦察兵思维。


    事实思维，看重事实的对错，在事情开始前已经预先设定了判断标准，这样的认知因为有天然的动机而自带缺陷。效果思维更符合“格物致知”的本质：不是自己的内心已经有各种规范和条理，然后将外在的材料放到内心的格子里，形成一个认知；而是通过点亮灯，走出去，与物近距离接触、互动、冲突、博弈，获得物的真实状况。孰弱孰强？高下立见。


    来自：镜与灯4 | 成功方程式：思维模式×热情×能力=成功


    抽象地去感受“事实”和“效果”这两个概念，我把它们理解为过程和结果。注重“事实”的认知视角，偏要按部就班，分清是非对错，不免有些娇情。相较之下，我们能够取得想要的“效果”，达到我们的目的不是更重要吗？所以我们说，不要过程中的苦劳，而要结果中的功劳。


    但如果只站在“效果”的认知视角上，就会出现不拘小节，甚至不择手段。如果不注重“事实”，没有过程的支撑，我们是很难以拿到满意的结果的。所以我们说，不仅仅要预期的结果，更要健康的过程。所以我的认知是，“事实”和“效果”的关系是一个度的平衡关系。阿里老话讲：没有过程的结果是垃圾，没有结果的过程是扯淡。


    来自：镜与灯4 | 成功方程式：思维模式×热情×能力=成功


