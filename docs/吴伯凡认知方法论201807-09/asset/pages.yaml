  md: '# 问答14 | 什么是“终身学习”？


    问答14 | 什么是“终身学习”… ↓


    如何判断自己是不是处于自大狂的状态？


    如何摆脱自大狂？


    如何让你身边已经陷入自大狂的人醒悟，让他意识到自己在那种状态中不能自抜？


    如何让“自大狂”从这种状态中走出来？


    “认知周期”这个单元的课后，同学们们的关注点在一个词上——自大狂。


    怎么才能判断自己正处于认知周期的哪个阶段呢？


    我们“认知周期”这个单元的4节课都围绕着一个话题：如何重新开始你的认知周期？


    一个完整的“认知周期”就是：


    从敬畏、谦卑、“说什么就是什么，全身心专注倾听”的一种明显谦卑的“空杯”状态开始，在这个过程中，一直有一个“怎么说都是对的”的权威；随着认知升级，你现有的认知和现实发生某种碰撞——外来的某个权威在你既有的认知势力范围之外，带来的某些信息、知识、事实逐渐产生某种挑衅；你终有一天会明白：这个权威是靠不住的——一个“认知周期”结束了。


    从“无条件认同权威”到“反叛权威”是一个“认知周期”，但这也只意味着完成了“一个”周期。那么，如何开启下一个周期，如何表明你已经进入到下一个周期了呢？


    正如我们前面说过的：认知的开端是敬畏、服从、空杯状态。如果你还没有进入，证明你一直还滞留在前一个周期里。


    # 如何重新回到“孩子般的谦卑”以及敬畏状态呢？


    天然的认同权威、跟随权威，一步步积累知识、认知，扩大视野，直到最后，权威被否定——这个过程也就是“子宫的最终目的是让我们脱离子宫”。


    在这个过程中，权威首先是用来崇拜的，最终才是用来反叛的。“反叛”是一个周期的结果，要开启下一个认知，就要让自己回到“敬畏”的状态。


    茨威格（Stefan Zweig）的一篇文章里说到过一种状态：年少的时候，由于某种偶然的机缘，使你变得非常成功，你获取的资源足以让你在很长时间里待在舒适区，这时候，你不可能去知道这个世界上还有比你更厉害的人。所有的教育都是不断将一种种之弥高的权威放在你面前，让你产生一种自然的敬畏。


    茨威格写的是一个象棋棋手，突然一下子赚到很多钱，随便拨弄几个棋子就比村子里所有的人千一年的活计赚的钱还多，这时候，你怎么能让他不觉得他是世界上最厉害的人呢？再说，一个从来没有听说过莎士比亚、达·芬奇、米开朗基罗、牛顿的人，他有什么理由不认为自己是世界上最不了起的人呢？


    当我们由“顺从期”到“叛逆期”，完成了一个“认知周期”的时候，无论是借助于内在的还是外在的力量，我们都需要迅速接触那些权威，让你自然产生敬畏——有时候，甚至看见街上提糖人儿的人，你都会产生一种敬畏。


    无论是儿童少年的教育，还是我们到了中年甚至老年的“终身学习”，都有一个前提：找到让自己敬畏的权威，让自己自惭形秽，感到自己明显不足、残缺的参照系——这时候，你会自然进入一种敬畏和空杯状态。


    找不到那种状态，就证明你一直滞留在前一个“认知周期”里。只能一辈子做一只“愤怒的小鸟”——年轻时是愤青，老了是老愤青——这也是在认知上的留级生。


    让自己主动进入到一种“谦卑状态”是比较难的，当然，也不是不可能——只要你愿意谦卑和有意识地打破“证明自己很伟大”的心理习惯和防御机制，留心去接触新的知识，你总会产生一种敬畏。


    但这是需要付出很大努力的，最重要的是，周围有没有人能对你进行指点——这种指点不是简单教训你，而是用一种特殊的方式，像过老师父带徒弟那样制造场景来让你进入一种状态。一辈子的恩师往往是那种没有指点你一句话，只是制造了一个场景的人，也包括那种看似为难你，甚至要嫁祸于你的人，他无意当中制造的一个场景使你突然从原来的自大狂状态一下子挣脱出来，不得已进入到一个自己觉得“自己非常渺小”的谦卑状态，然后开启了另一个新的“认知周期”。


    # 案例：“少年得志”是“自大狂”造成的人生夭折


    有一种说法：古今只有两个著名的大臣——诸葛亮和张居正。诸葛亮“三分天下”做了一个小国的丞相，而张居正是大明王朝的丞相，虽然最后下场不太好，但他的整个改革举措起到了非常明显的效果。


    张居正有这样的作为要感谢一个人：他第一次参加乡试时候的监察考官。张居正15岁第一次参加乡试，进到考场趾高气扬，操之在我，胜券在握的样子，让人一看就知道他很有才，监察考官暗暗为这个孩子担心。后来，考试的过程中，监察官看见张居正的答卷写得非常快和好，按照公正的标准，他在这次乡试中应该第一，但监察官意识到，如果这样的话会害了张居正。


    这位监察官老先生显然不知道“认知周期”、“自大狂”、“滞留在认知中转站”这些概念，他只知道一句话，“人生三大不幸，第一大不幸就是少年得志”——少年得志以后会把一个整个人生认知周期锁死，让他没办法进入到下一个周期，这个人一辈子也就做不成大事。什么“江郎才尽”、“童星效应”都是这样，年轻时候过早得到荣誉和资源，最后都泯然众人。所以，这个监察官做了一个大胆的决定：让张居正名落孙山。


    张居正从小在所有人的赞扬蔫慕中长大，乡试明明胜券在握，结果居然走到了世界的反面，发现“这个世界不是我说了算的”，他受到了种种的奚落嘲弄，这种场景或者说这种生态位，让张居正获得了一种对于世界的新认知，他知道自己什么都不是，重新回到了谦卑的状态，开始了一个崭新的认知周期。


    又苦读三年之后，张居正再来考试的时候，监察官发现他的气质已经完全不一样了：沉稳了，写的文章不发飘了。


    当然，张居正最后之所以翻船，还是因为压舱石不够，受的挫折太少——他在励精图治成了大事以后，太张扬了，坐了32人抬的大轿，得罪了很多的人。他的改革也在他死后付诸东流。


    张居正的故事告诉我们：外来的，甚至是“飞来横祸式”的场景、灾变会突然让人进入下一个“认知周期”。我们只有回到认知的第一个阶段“谦卑”，才能不断完成认知周期。


    最后补充一点：“终身学习”的意思，就是不断开启你的认知周期。“终身学习”不是说一辈子天天念小学课本，不是天天学各种英语第一册——“终身学习”是持续保持谦卑状态，循序渐进，有一天突然看清楚了你一直杵为权威的人，这才证明你完成了一个“认知周期”。然后，再开始“谦卑→狂妄→又谦卑……”这样一个过程，这才是“终身学习”。'
