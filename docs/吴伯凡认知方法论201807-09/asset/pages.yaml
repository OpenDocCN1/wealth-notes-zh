  md: '# 从对话到潜对话2 | 精于心，简于形


    从对话到潜对话2 | 精于心，... ↓


    这是我们第二模块第二单元的第二节课。这个单元的主题是：从对话到潜对话。


    上节课我们讲到了“表面”以及“表面和界面的关系”；“认知”分为“表面的认知”和“本质的认知”；“表层的感受”和“对后台的了解”是两个不同的层次。


    这里包含了一种在今天大行其道的重要产品哲学，这种产品哲学的流行不是谁提倡的结果，在我看来，它相当于“替天行道”，是大自然本身的进化过程，或者说，这种反向设计过程隐含着一种产品和设计哲学。


    # 缘鹂：不可泯灭的欲望才是真理


    今天我们先来讲一个故事。


    文艺复兴时期意大利作家薄伽丘写过一本在当时影响很大，在现在文学史上也有重要地位的小说集——《十日谈》，里面有一个“绿鹂的故事”。


    # “精于心，简于形”——“界面的简单”是最难的


    # 强助推：水果的“友好界面”


    我们说过“大自然本身就是最好的设计师和产品经理”。


