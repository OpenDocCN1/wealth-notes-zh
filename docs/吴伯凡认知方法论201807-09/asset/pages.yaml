  md: '# 认知与立场3 | 我们面对世界的三种立场


    认知与立场3 | 我们面对世界...


    第一模块 认知的源代码

    第二模块 认知治理 “认知与立场”

    第三模块 算法与第一性原理

    第四模块 意义炼金术


    # 新的认知 = 新的物种


    在我们的认知行为中，存在着一种类似于“进化论”的机制：大自然最重要的算法就是基因突变加自然选择，任何一个物种刚出现的时候，都具有相当程度“一冉情愿”的成分，或者说，有各种各样畸形怪状的物种——它们都是创新，但这种最基础的创新是需要接受检验的，这个检验的过程就是自然选择。


    自然选择是大自然的一种特殊的大规模杀伤性武器：环境是一个考官，有它自己的答案，不符合这个答案的物种都被消灭了。“一将功成万骨枯”，一个现有的物种背后，那些许许多多大小不异和大异小的个体都已经看不到了。


    但我们的认知跟自然界和商业领域不太一样，不是每个人都能在认知领域建立一种自然选择机制。


    具有认知优势的人，自身就建立了一种能够持续产生作用的自然选择和自然淘汰机制，他们把大量冗杂的、肤浅的、似是而非的认知一次又一次过滤掉，而那些剩下来的，经过过滤、拷问的认知之间又建立了各种各样的连接，就像商业和技术领域出现的借用、套用和挪用其它行业、学科，形成了新物种一样——一个新的认知本质上就是一个新的物种。


    淘汰机制到底是怎么建立的呢？概括起来可以分为两类：


    +   第一类：

    来自于外界的拷问。你既有的认知在遭遇新情况和一些谬误时，可能第一时间就消失了；还有一些认知在新的拷问下不得不应对，这个应对的过程就会产生新的认知。


    +   第二类：

    选择和淘汰机制是人自己设立的反省和淘汰体系。


    前两节课我们都在讲来自外界的拷问。这节课我们要讲的是：如何建立一种反省机制。当然，这是一个很大的问题，我们只能涉及到其中的一个方面。


    # 面对世界的三种立场


    按照哲学家的分类，我们面对世界有三种立场：


    +   1. 物理立场：一是一，二是二。


    比如小孩手里拿着一块石头，一松手它就会掉下去——这是孩子长大后会明白的物理学道理；火、装着开水的壶不能用手去摸，小孩不会因为壶不能摸而哭——我们最初的认知里是包含物理立场的。


    物理立场往往包含着你不能控制和抗拒的，这种立场下，你会对你接触的事物抱有一种理所当然的、不去控制、没法改变的态度。


    +   2. 设计立场：问题的根源在我，不在你。


    比如一个钟表匠做了一个钟，我们就觉得它必须是准的，如果走走停停，就是有问题的，但问题不在于表，而在于设计者。所以在这种败感之下，我会想办法去修好它，或者重新改变我的设计。


    因为是你想让它怎么样，你有一个既定的意图，如果不这样，你就会觉得有问题，就会有想办法去改变它的欲望和冲动。


    +   3. 意向立场：问题的根源是你，不是我。


    这种立场是设计立场派生出来的。意向立场和设计立场不太一样，比如孩子对父母，或者父母对孩子，都会有一个意向立场——你该怎么样，如果你不怎么样，我会把问题的根源归结于你，而不是我。


    孩子放学回来，张嘴就是“饭做好没有”，父母就会不高兴，因为父母设定的是，他应该进门就叫爸爸或者叫妈妈。但是，父母和钟表匠的态度不一样：钟表匠是，钟应该走得准，走不准我去想办法让它走得准；父母是觉得孩子应该这样，如果做不到这样，就是孩子的问题。


    生活当中，我们常常把这三个立场搞混。很多时候，我们出现错误反应或情绪出现动荡，可能就是因为一个很重要的原因：采取了不恰当的立场。


    # 案例


    +   1. 飞机上的噪音 Vs. 院子里的噪音


    比如坐飞机的噪音是非常大的，但常坐飞机的人从来不会抱怨噪音，该吃吃、该喝喝、该睡觉，原因是他对飞机的噪音持有的是物理立场：他也不是飞机的设计师，即便是设计师也觉得这种状态是没办法改变的。


    但是，假如你在家里休息，邻居家小孩突然在院子里制造了某种噪声，虽然这个噪音的分贝可能比飞机的噪音分贝还要多，你还是会很生气，因为你这时候采取的是意向立场。


    +   2. “小孩什么时候最烦人？”


    一个孩子什么时候最烦人？客观讲，他刚出生的時候最烦人，因为他有什么需求你也不清楚，他除了哭也不能干别的，一晚上他能醒十几次，拉屎拉尿……所有这些你从来没干过的事情，你就得去干。


    但一个很奇怪的现象是：所有的父母都不觉得小孩那个时候最烦人——因为父母对那时侯的小孩是物理立场：孩子本来就是这样的，这是一个客观事实。


    等孩子再大一点儿，也有烦人的时候。比如有一天，小孩突然说了一句他自己都不懂的脏话，大人是不太会生气的，他们的第一反应是“我是不是说过类似的话”或者“这孩子一定是接触了不该接触的人”。这个时候，父母采取的是设计立场——问题出现，原因归结到自己，同时还想着如何去改变这种状况。


    但是，等孩子十几岁的时候，父母就会觉得：这是他最烦人的时候。


    你看，这时候这个孩子生活能自理，不会乱拉屎拉尿，有什么需求也会直接说，很好沟通嘛，结果呢，你发现他是最烦人、最不好沟通的——因为你的立场在他成长过程当中，逐渐从物理立场转到设计立场，现在又转到了意向立场，也就一个潜台词出现了，“他应该怎么样”。意向立场的核心关键词就是“应该怎么样”，如果孩子不是这样的，父母自然就会产生一种“怨恨惋烦”的状态。


    # 警惕意向立场的滥用


    意向立场是我们难以摆脱的一种立场，它跟所有情绪一样，有它特定的适用范围，不能够超出它的场景，一旦超出使用，就是“滥用”。情绪所谓好坏，但超出场景就是坏情绪，就会形成一种心理黑洞，把我们的心智能量吸进去，你的注意力就会始终聚焦在“应该怎么样，而又不怎么样”上。


    那么，这些和我们的认知有什么关系呢？当意向立场作为一种自然出现的有用立场，我们不能滥用；当你的情绪处于“怨恨惋烦”的某一状况时，你可以提醒一下自己，“我现在是不是在滥用意向立场？”这时，比较有效、简便的方法就是重新回到物理立场和设计立场，让你的心智能量重新回到认知状态。


    西方哲学史上的“斯多葛主义”哲学流派的核心观点是把世界进行二分：可控的和不可控的。要想使你的心智能量避免浪费在意向立场上，你首先要把世界分成“可控”和“不可控”的——“不可控的”是物理立场，“可控的”是设计立场。不要让自己的心智长时间地逗留在意向立场上。


    总而言之，意向立场是一个值得警惕的立场，它很容易让我们远离认知状态。'
