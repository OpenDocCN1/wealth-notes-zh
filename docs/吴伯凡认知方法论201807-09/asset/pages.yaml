  md: '# 问答20｜“乌合之众”与“众愚成智”矛盾吗？


    问答20｜“乌合之众”与“... ↓


    看了大家在“算法与认知”这个单元提的问题，我觉得有必要先分享一下丹尼尔·丹尼特（Daniel Dennett）在《直觉系》这本书里的两段话：


    > “思考之所以困难，是因为通向真理的崎岖小径与诱人的捷径总是争持不下。而捷径往往只是条死胡同。我们在思考时所做的多数努力，都是在抵御诱惑。我们不断受到它们的纠缠，又必须为了手头上的任务硬着头皮想下去。”


    > “有些人是天生的天才，他们可以轻松地解开棘手的谜团；而另一些人步履蹒跚，却有天赋的意志力——这一英雄式的品质，使他们能在追逐真理的道路上坚持到底。然后就剩下我们这些人，没太多的天分，还有点儿懒。于是，我们就仍然渴望理解周遭的事物。”


    正如丹尼特说的，我们大多数人是没有天赋，还有一点儿懒的人，我们对方法，尤其是葵花宝典式的方法特别渴求——这反映了我们的两点不足：天赋不足，意志力也不足。


    # “最优停止理论”中的37%


    @ 致橡树


    每个人都知道，凡事都有一个“度”，但这个“度”需要慢慢探索，37%适用于一切需要把握“度”的事情吗？针对时间37%，适用于找房、配偶这些时间窗口比较明确的事情，而对于股票这些时间和收益总量都不明确的事物，37%的定点又在哪里呢？


    37%适用于一切需要把握“度”的事物吗？不是。万事万物的“事”既包括事物，也包括事件、事态，这里的“度”千差万别，没有适用于一切需要把握“度”的事情。


    必须强调一下：37%指“最优停止理论”。我之所以讲到这个理论，是把它作为一个例子：我们好像有很多的自由选择，经常使用自己的自由意志，其实在我们的自由意志之外，还有我们不知道背
    景，根本不在于我们的自由意志，无论你知道不知道，它都在那里的一些定数，比如“二八法则”、“黄金分割”以及37%，都是一种定数。但是，这些定数只适合于特定的情景。


    经济学里的“机会成本”常常是指“静态”的机会成本，比如你娶了这个女子，就意味着你付出了一个成本——不能娶那个女子了，而37%是“动态”的机会成本，也就是说，你的选择是在一个时间轴上发生，是不可逆的，你不可能回过头来发现选择错了的时候再回去——你回不过去。空间选择是可逆的，你走一圈看
    见不行，可以回过头来；在时间里，我们没有这个自由，不可能回来。


    37%是一个经验数字，是一个统计规律：在特定时间段里，可选项的37%既是数量上，也是时间上你作出选择的最佳时期。进入到35%-40%的时候，你如果发现遇到的这个选项、这个人、这个物，比你前面碰到的选项有明显优势的时候，你就选择它，而不要等它过去，再扩大数据量，再来作一个选择——到那个时候，你往往要后悔，甚至是后悔莫及的。


    可能有人问，那如果选车，37%在哪儿？这个选择本身就不适合“最优停止理论”：


    +   - 选车往往是空间性的，很多车都摆在你面前，你没有“必须买车”，或者“上半年必须买车”的需求；

    - 如果你“这个月必须买车”，就又是另外一回事了：你在这个时间点上，算一下一个月可以看到多少辆车；

    - 如果你处于可买可不买、持币观望的状态的话，你可以一直延续下去，因为车总是不断降价，性能不断提高的，你永远没办法作出选择。


    37%理论最早来自于选秘书：你觉得工作当中必须要有个秘书了，这个时间点是固定的——你不可能在一年之内来选；当你发出这个需求的时候，应聘的人的总量是固定的，比如你发出第一拨需求，收到100份简历，你可以看到第37个，因为看
    再多也没用的，很可能选的还不如前面的。


    通过37%的“最优停止理论”，我想分享的最重要的观点是：


    +   1. 很多事情看似你的选择是自由的，实际是不自由的。


    你的选择和决策受制于一个你也许不知道的规律。当然，你今天知道了是更好的。


    2. 忘了提醒大家，我们说的“算法”，都是在特定领域和场景的“算法”，不是一个“通用的算法”。


    如果有“通用的算法”的话，也是一种没有意义的正确。


    3. 大家始终记住：我们之所以求知、发问、渴望升级自己的认知，都是为了提高自己的竞争力。


    而竞争力来自于个体差异。如果你找到了一个所有人一看就明白的通则，它是不能对你形成竞争力的，应该趁早放弃通用适用、一抓就灵的“葵花宝典”。


    # “乌合之众”不是“众愚成智”的反面


    @ 洛可可


    如果“自下而上”的机制是靠每个个体追求自身利益最大化而导致的整个系统 的有序性，那么“自上而下”的缙减控制，就完全没有作用了吗？如果将“自上而下”和“自下而上”的次序建立看成是一条直线，我们是不是应该努力在这条线上取得某种平衡呢？群体的算法有亚当·斯密的例证，但是也不有“乌合之众”一说吗？我认为我们究竟还是不能只相信一种算法，而要从两种相持的算法中找中间的平衡。


    这个问题里提到了“自下而上”和“自上而下”这两种看起来截然相反的东西，并且把亚当·斯密（Adam Smith）和勒庞（Gustave Le Bon）的《乌合之众》放在了一起说。


    我在《伯凡·日知录》里讲到过：“乌合之众”和“众愚成智”之间看似矛盾，其实并不矛盾：


    +   1. “众愚成智”是“自下而上”形成的自发次序。这个自发次序显现为某种调节整体的“超级智能”，这里的前提是：这里的所有人都无意识、没有试图操纵别人的。


    2. “乌合之众”是“众智成愚”，也就是有些很聪明的个体聚到一起以后，很容易形成一种集体性的愚蠢。这个愚蠢是怎么来的呢？是因为中间出现了一个老谋深算、居心叵测的操盘者，利用众多个体聚集情况下的特有氛围，进行了一种情绪引导，让大家彼此成为彼此的约束，巧妙地把众人的行为和情绪引导到他期待和预谋的路径上去。


    3. “乌合之众”表现出来的“众智成愚”不是“众愚成智”的反面，而是在某种程度上证明了“众愚成智”的正确性。


