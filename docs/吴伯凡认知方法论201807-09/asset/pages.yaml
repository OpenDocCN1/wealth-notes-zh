    # 《三体》：复杂背后的简单三要素


    最近我重读了著名的科幻小说《三体》，突然有一个感悟：对一个对象的认知一定是一个由繁入简的过程。


    以前读的时候，我看到的是一堆纠缠不清的人物和情节，以至于今天再读，很多地方好像是在读一部新的小说。重读的过程中，一些特别复杂，甚至显得混乱的东西逐渐淡化，一种看上去很简单的东西浮现了出来。


    我读书和跟别人讨论一本书的时候有个习惯：给这本书取三个备选的名字。如果一个人说读了这本书很有感受，我就让他取三个备选名字，看他的三个备选名字，我就能知道他读懂了没有，或者我该跟他怎么交流。


    我今天重新阅读《三体》的时候，给它起了几个备选的名字，其中一个有点儿土，但是很接近事实：大家都知道小说《三个火枪手》，《三体》也可以取一个特别简单的名字——《三个救世主》，或者《三位一体的、人、宇宙与社会》。


    《三体》一共分三部，写的是三个救世主：一个是邪恶的化身，一个是善良的化身，一个是无善无恶的化身。


    善良的化身叫程心，被很多人说成是圣母妓；邪恶的叫叶文洁，地球的灾难很大程度上是由她导致的；而真正横穿三部曲的主人公罗辑，你不能说他善也不能说他恶——这三个人本质上是三位一体的，从善到恶，到无善无恶，这三个救世主先後出场，决定了地球人的命运。


    这里有大量“3”的思维：


    +   所谓“三体”，就是一个有三颗恒星，一颗行星的怪异体系，三体人要寻找一个适合生存的地方，就找到了地球。

    还有所谓的四个面壁人（救世主），其实是3+1，是三个人用同样的攻击性思维来对抗三体。这里的1就是罗辑，根本不知道自己是救世主的救世主，当他被选为面壁人的时候，自己也觉得莫名其妙。

    以及罗辑、程心和维德三个可能的执剑人之间的勾芡。


    “三体”里都是三，是三个属于同一系列的人之间构成了一种非常复杂的关系，从而生成各种各样的情节，编织出各种各样的命运。


    当我们面对一个对象的时候，我们看到的总是一些复杂的东西，这时我们可以告诉自己：我的认知还处于初级阶段，还没有看到那些简单的东西。


    # 各个领域的“三位一体”


    物理学有两个最权威、最根本，也是最美的公式，那么复杂ま的因素都只有三个变量：


    ```

    f=ma

    ```


    ```

    e=mc²

    ```


    三位一体本来是一个宗教概念，但在一些实证领域，我们也发现了类似于三位一体ΡΙ东西，比如：


    +   三原色原理，彩色打印机只需要三个墨盒，就能够打印出五彩缤纷的颜色；

    在文学领域里的很多描写大场面，揭示大规模律，试图洞见人和社会命运的文学作品，往往采取三部曲的形式；

    弗洛伊德揭示自我结构的时候，提出的是三个“我”：本我、自我、超我。


    在意识形态领域也有类似的情况，比如欧洲的国旗分成两种，都带有三位一体的痕迹：一个是十字架，本質是圣父、圣子、圣灵三位一体；一个是三种颜色，以法国红白蓝为代表的三色旗。


    为什么自然界，社会，人的感受，横跨物理学、心理学、社会学、文学都有三位一体式的思维？到目前为止，还没有人能够准确解释这种现象。我们只知道，在中国文化观念当中，老子在《道德经》里头说：道生一，一生二，二生三，三生万物。


    提出这个问题和现象，是想提示我们：


    +   1. 复杂现象背后，可能有特别简单的东西。这种简单的东西会简化到三要素；

    2. “多则惑、少则得，以简驭繁”既是实践的法则，也可能是认知的法则；

    3. 再往深处推，可能在客观世界里存在着一种我们今天还说不清楚的以三个要素为最终结构和图式的世界。


    # 《极简欧洲史》：欧洲历史的三原色


    除了重读《三体》，我还重读了一本很薄的一书——《极简欧洲史》，它把欧洲的历史描述得非常清晰，让人有耳目一新又茅塞顿开的感觉。而这本书之所以能够在很短的篇幅把欧洲历史说得那么清晰，我觉得是因为它采用了一个很奇特的观察模式：发现了欧洲历史的三原色。


    《极简欧洲史》认为，欧洲历史的构成，前两个是我们通常说的“两希文明”：古希腊和希伯来。古希腊代表着科学理性，希伯来代表的是信仰，同时，还有第三个因素是日尔曼蛮族的开疆拓土的强盗精神。


    科学理性、信仰、强盗精神这三种颜色在欧洲任何一个历史阶段呈现的状态是不一样的，原因在于这三种要素的配比。


    总结


    我跟大家分享这么多看上去跨度很大的内容，虽然这里的结论不一定完全正确，但是它提示我们：'
