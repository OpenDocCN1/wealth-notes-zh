    能里，而不必每一个个体都从头学起；

    2. 经过系统学习和训练掌握的基础知识，比如四则运算、拼音、语言、书写等等，它们并不直接影响生活，也很少出错，但可以帮助我们做判断；

    3. 综合各种数据对事物做判断的能力，所谓生命的过程就是不断地做价值判断的过程。恰恰是这个判断能力，因人而异，千差万别，因为正确的输出需要两个前提：正确的数据和正确的解题过程；

    4. 我们以为自己懂了，其实是一知半解，甚至是错误的知识；

    5. 我们懂了，但从未被我们有效用于正确判断的知识；

    6. 我们一直抗拒的、以认为是错误的知识，其实它才是对的，只是我们不愿意承认；

    7. "超验"的，我们根本不知道自己不知道的知识，那是被整体认知黑幕笼罩的世界，无法想象。


    我知道我知道，我知道我不知道，我不知道我知道，我不知道我不知道。认知的层次，就在于你在多大程度上觉察到这些状况的存在。认知的错误，就是因为这些知识在互相影响，都致力于参与与你的决策过程，而认知者选用了错误的数据和错误的解析方式造成的。


