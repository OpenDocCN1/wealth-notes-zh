  - '[PAGE 175]


    # 推广下载工具类的产品需要考虑什么？


    节选自「龙虾」的主题


    想推广一个下载工具类的产品，最好先想清楚下面的问题：


    +   1. 用户群体是哪些人？

    2. 主打推广点是什么？

    3. 目前竞品如何推广？

    4. 产品留存和变现优化到哪一步？

    5. 希望达成什么推广目标？

    6. 在多长时间内达成？

    7. 有多少推广预算？

    8. 团队有多少人？

    9. 负责推广的有多少人？

    10. 能否接受不那么体面的推广方式？


    # 普通人不要去做预测了


    节选自「maors」的主题'
  - '[PAGE 176]


    很多事情事后看因果很容易，事前看到的人，微乎其微，预测这个事，极难。信息的真实性获取上已经不容易，再从这些信息里面抽丝剥茧找到因果，做出判断，神人。


    所以我认为，普通人不要去做什么预测了，就算真对了，也可能是蒙对的。


    # 打造个人品牌的一个思路


    > 节选自「V先生」的主题


    一个内容平台刚开始时，你就进去，主动结识平台的老板和工作人员，献计献策，主动维护社区，写一些平台指南文章帮助别人，或者为平台制作排行榜。


    这样你可以获取一般人没有的信息、便利和流量。


    # 创业需要有坚定的赚钱信念


    > 节选自「黑少爷」的主题'
  - '[PAGE 177]


    当初创业，真不是想创造一个产品，改变世界，是因为特么的穷。2015年的某天，家里人花了3000多做了一对眉毛，哎呦，疼啊，胃疼啊，真特么奸商。气不过，跟3000块耗上了，我跑去蹲点、数人头、翻垃圾桶、问店租、问工资，发现利润很黄很暴力，立马决定也开一个店，于是拉上亲戚朋友，东拼西凑了100多万开干。


    # 赚到钱不要停止，要规模化


    节选自「乔里奥」的主题


    赚到钱了不要停止，你要马上规模化。


    赚到钱了停止，就好像你辛辛苦苦半年画了一幅画，然后画完了，你卷起来放进柜子里，再也不打开。一定要思考如何吃掉整个市场，除非你真的消化不掉订单。


    # 用户的需求其实一直在搜索引擎的How to里'
  - '[PAGE 178]


    # 节选自「亦仁」的主题


    用户的需求其实一直在搜索引擎的How to里。


    # 如何提升公众号广告收入


    # 节选自「付圣强Jason」的主题


    不能变现的公众号品牌IP没有价值。可以通过稳健的广告收入来变现。


    我们把广告收入的来源拆分为一个公式，即广告收入 = 广告单价 × 广告数量。把影响广告单价和广告数量的核心要素继续往下拆分，比如阅读量、品牌价值、用户量、广告销售等，通过提升各层面核心要素的值，最终提升广告收入。


    # Shopify+Facebook的玩法：需要有产品思维


    # 节选自「小姜」的主题'
  - '[PAGE 179]


    要有产品思维：把你的店铺当作产品来做，把自己当作用户，完整的体验从落地页到支付的全过程，看每个页面是否符合用户预期。优化每一个用户看到的页面，比如Facebook评论你有关注吗？有设置评论过滤吗？差评是很影响转化的。


    # 赚钱需要找到“可复制的稀缺资源”


    > 节选自「子柳」的主题


    赚钱是一件庸俗但人人都喜欢的事情，几乎每个人都觉得赚钱很难。但渐渐的，我发现似乎有些人赚钱很轻松，他们在这项技能上面就如同武学里说的“打通了任督二脉”，在度过一个关卡之后，变得越来越轻松。


    那么这个关卡在哪里？我认为在于找到“可复制的稀缺资源”。你发现一块黄金，发达一时，你要是发现一座金矿，那是要上天了。'
  - '[PAGE 180]


    # 抖音带货不仅仅是追求ROI


    节选自「赵鑫」的主题


    很多品牌在讨论抖音带货这件事的时候，仅仅是看到了消费者购买这个行动，至于如何产生认知，如何勾起消费者兴趣，如何在消费者做深入研究的时候，更多的展现自己正面的东西，如何让消费者给出正反馈，这些提升转化率的事情统统不管。


    根本没有搞清楚营销推广的核心，也没看到整个销售过程的全貌，盲目在追求ROI。


    # 每月躺赚35000美元的教学反馈小工具


    节选自「鱼丸出面」的主题


    利用下班后和周末的时间，他男友花了1个多月开发出了这个产品，起名叫Feedback Panda，可以集成到VIPKID教学系统里，鼠标点一下，就能把之前用过的评语模板，插入到当前学生评价体系里，原本5分钟的工作量，现在只需1秒钟就完成了，这给她腾出了非常多的时间。经过一年时'
  - '[PAGE 181]


    间的运营，最终这个工具也让他男友每个月赚到35000美元的收入。


    # 做社群只想赚钱方向就歪了


    > 节选自「夏木炯」的主题


    做社群的目的可以是赚钱，但如果只是赚钱，方向就歪了。


    社群本质还是一群同频的人圈在一起交流学习，顺便产生链接，千万不要忘了初衷。


    # 能够火的内容全平台都适用


    > 节选自「杨涛」的主题


    在其他平台火过的内容，在一个新平台肯定能再火一遍，本质上是一样的，人性！


    表现形式的不同而已，优质内容都有通性。'
  - '[PAGE 182]


    # 什么是批量思维？


    节选自「顾小北」的主题


    人眼光的敏锐度，思考的角度非常重要，要去敏锐的思考事物之间的联系。看准一个东西，能赚钱的，不要守着一棵树，该批量的批量，该扩大规模的一定要扩大规模。


    这就是批量思维！


