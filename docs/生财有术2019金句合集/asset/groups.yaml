  md: '

    # 找到自己喜欢的事情更容易赚到钱


    节选自「沈小善」的主题


    找到你喜欢的，热爱的事情。因为只有热爱才能让你不计成本的投入，才能全情贯注的研究，不要说十年二十年，只要不断行动五年，你大概率在你喜欢的行业也算是万里挑一，做能为这个世界带来美好又能赚钱的事情。


    # 学会利用那些很厉害的理论


    节选自「明白」的主题


    当我们碰到一个很厉害的理论、模式、产品的时候，一定要想一下，这个理论、模式、产品，能不能套用到其他领域、场景、用户，理解了这套组合拳的打法，你会发现，互联网到处都是赚钱机会。


    # 商旅信息不对称的套利空间


    节选自「Caorz」的主题


    商旅信息不对称的套利空间极大。简单地说，你以为订机票和订酒店的竞争白热化，没有利润，很多中介靠骗退款率赚钱。其实不然，还是有非常多可操作空间的。


    # 成功需要有冒险精神


    节选自「伟哥」的主题


    我把自己所有现金都投入到了这个广点通，可这样做真的确保万无一失吗？你无论问当时的我还是现在的我，我的回答都是，不确定，但是我一定要试一试。


    没有拼命的冒险精神，就没有资格收获成功。


    # 成功是有惯性的


    节选自「杨涛」的主题


    成功，是有惯性的，每一个成功的惯性势能，或许都能开出一朵大奇葩。


    # SEO流量获取方法


    节选自「许欢」的主题


    但是SEM不给投，我们还有SEO的办法。我们以商户的店铺为节点，每一个店铺下有不同的团购站的团购信息，有用户买完团购以后的评论，有这个商户的POI信息、开业时间、电话等信息。我们迅速的给百度和360搜索提供了大量有价值的以商户为节点的页面，导致用户搜索“北京烤鸭”、“北京温泉”、“北京亲子乐园团购”等等的时候，我们的搜索结果几乎全部在第一个，夸张到每天SEO可以来40万点击！


    # 一件事顺理成章的背后是什么


    节选自「明白」的主题


    一件事的背后，肯定有一个必须点，把那个点破掉后，其他的都顺理成章。


    # 能持续投放的广告一定是赚钱的


    节选自「黄亮」的主题


    现在互联网上信息太多了，如果什么都留意看的话，脑袋就不够用了。但是有一类信息，一定要特别留意看，那就是广告，一个能持续投放广告的业务，一定是赚钱的，不赚钱的那些都死了。


    # 创业团队需要注意什么


    节选自「胡光成」的主题


    搭建一个好的创业团队非常重要，创始人一定要让自己空下来多去思考公司的业务方向、人才建设等，不要天天做一些很基础的事情，之前我们创业财务用的是外包，人事招聘也都靠我自己，所以在人才的选拔和投入上不足，也导致了团队相对比较弱，这也是后面我们内部做孵化创新一直没有起色的原因，本质上还是团队的人才太少，不够强，很多事情的认知不足，浅尝辄止。


    # 学习投资是需要训练的


    节选自「Jason」的主题


    对资产的管理能力和回避风险的能力是需要训练的。不能等挣到钱了再从0起步学投资，越早起步，犯错误损失的绝对值越小。


    抱着“一辈子”只能买卖20只股票的心态去选股，只寻找万里挑一的机会。可以三年不出手，但一旦出手就要有all in的把握。


    风险对冲的结果就是收益也被对冲。我们不该靠概率来抵消风险，而应该靠独立思考，靠智慧来抵消风险。


    # 每个人都有自己的积累和优劣势


    节选自「Wangme」的主题


    当信息太多，自己又没有目标漫无目的，照单全收却无执行验证或者复盘吸收，你很快会觉得自己智商归零。


    要时刻牢记目标，隔行如隔山，每个人都有自己的积累和优劣势。


    # 运营一个圈子有些流程不能省


    节选自「V先生」的主题


    麻雀虽小，五脏俱全。运营一个圈子、一个群、一个公众号，不管人多人少，有些流程都是省不掉的。给一个人做菜，和给十个人做菜，买拣洗切配炒，这套工序都一样。


    # 什么是好的投资策略


    节选自「Jason」的主题


    好的投资策略三条就够了，这三条分别是品质、估值和时机，即公司好不好，股价贵不贵，时间点对不对。


    # 选择好的赛道


    节选自「Joseph」的主题


    能选择好最宽的赛道，能在赛道上酝酿足够的久，积累自己的认知与能力，提升自己的判断能力，便有机会攫取到行业发展的红利。


    # 找到自己思维的外部增量


    节选自「老李校长」的主题


    多主动出来和高手交流，高手的一句话点拨，可以让你少走非常多的弯路。而且，最好找那些你看不懂、看不清、看不起但是却有结果的人聊，他们说的话大有可能是你思维的外部增量。


    # 电商单品的全产业链布局能力


    节选自「小马哥」的主题


    当你要做某一个品类的电商单品的时候，不仅要掌握营销能力，还要掌握全产业链布局能力，不然很容易你拉动了 一个行业但是底层的最大利益和你无关。


    我就是把海南椰子油和红糖真正拉起来的人，但是一开始撇指定价收获利益之后，并没有完成底层搭建。导致最后做大宗贸易、和oem的加工厂吃了最大的红利。


    # 互联网时代流量的竞争


    节选自「钱炅」的主题


    移动互联网时代，时间是被某个App独占的，而用户在 App之间切换的成本比切换网页高很多，所以移动互联网 时代流量的竞争呈现出互联网时代更多的竞争性，巨头的
    垄断地位也更加清晰。


    # 商业机会都是从发现信息差开始


    节选自「李晨」的主题


    商业机会都是从发现信息差开始的，然后早起进入市场的人开始圈资源做规模，继而阶段性、区域性垄断细分市场（垄断核心要素资源）。再来就是从具体的资源性垄断到认识层垄断也就是做品牌，形成市场共识，最后就可以参与制定底层的商业规则。当一家公司可以制定行业标准和规则的时候，就一定是巨无霸了，因为它已经在用市场的力量参与政治利益的博弈了，比如缩短产品使用寿命。


    # 不一定要成为完美的高手才开始


    节选自「V先生」的主题


    不要自己限制了自己。光脚的不怕穿鞋的，你本来就还没有成功时，怕什么失败。盯住目标，发挥你的优势，大胆去试。你想做社群，那就去试吧。


    不一定一上来就要做一个牛逼的社群，可以先做起来，做好了就容易锻炼能力、提高名气、获得口碑，然后让更多人进来玩。在每个时间点上用心、在一条时间线上耐心。这样就可以“滚雪球”了。


    # 不停寻找新机会与更好的利润点


    节选自「萧遥」的主题


    Jeremy Schomaker 本身虽然没有大学文凭，但是有多年技术背景和银行工作经验。纵观他的路径，门槛是很高的，第一步搞出一个有2000万访问量的网站就很难，但他的其它思路也值得借鉴。


    - 总是寻求新机会，不停寻找更好的利润点；

    - 不停优化，不管是定价策略，还是流量优化，都做了很多研究；

    - 不停卖卖卖，并不把自己局限在一个途径上，开出新业务，很快就变现了。


    # 想做老大，就不做“Nice”的人


    节选自「高智豪」的主题


    想做老大，就不做“Nice”的人。


    所有Nice的人最好的结果就是当个副手，所有能挑大梁的人都是性格极其鲜明让人印象深刻。Nice的人太在意表面不得罪所有人（本质是自我保护），反而失去了大担当。


    # 投资是用判断+简单行动赚钱


    节选自「Jason」的主题


    投资是用判断+简单行动赚钱，做项目是用判断+复杂行动赚钱，这其中让我收获成就感的是“做出正确的判断并为之坚持最终得到验证”这个过程本身。


    # 互联网的本质是效率很高的“中介”


    节选自「Caprice」的主题


    互联网的本质是效率很高的“中介”。


    只用优化流程，更好的满足市场上已经存在的需求，而不用去发掘新的需求：风险小，最好的商业模式不是创造出来的，而是改进来的。


    滴滴、Uber、Airbnb、Baidu、Google、大众点评、淘宝、Facebook、微信、微博、今日头条……无一不是“中介”。


    # 信任即货币


    节选自「森淼」的主题


    未来世界有一种更坚挺的货币，叫影响力，更本质的，信任即货币。


    内容建设，通过写作建立信任，是获取影响力的一种极其有效的方式。


    # 收益是做增长坚持下去的因素


    节选自「王六六」的主题


    在增长的过程中，大多不能坚持下去的原因其实并不是效果差，而是没有收益，不赚钱，没有激励你做下去的因素。


    # 所谓蓝海也是相对于个人而言的


    节选自「王志晓」的主题


    所谓的蓝海，很多时候也是相对于个人而言的，有些项目虽然市场空间大，但是对于你可能就是死海。


    找到自己有明显竞争优势的点，就是你的蓝海。


    # 如何连接更多有价值的朋友


    节选自「沈小善」的主题


    养成了别人经验、知识付费的习惯后，你身边有能力的人会让你越来越好，你每次需要解决一个问题的时候，他们都会尽力帮助你，不会三言两句敷衍你，会渐渐成为朋友而不是资源。


    加微信不是链接的基础，尊重别人的时间和经验才是。只有这样才会有越来越多的朋友愿意帮你，和你站在一起。


    # 要长期做到持续正确的决策


    节选自「老吴」的主题


    一个企业、一个人最终能取得一些成绩，是一系列正确的决策。持续的正确决策，持续的做与想之间能力的增长是指数级的增长。所以，我们要保持敬畏之心，不断进歩，我们看到的不过是冰山一角。


    # 今天的数据对明天来说只是历史记录


    节选自「孙岩」的主题


    实际上造成产品滞销、生意萧条的原因只有一个，那就是现在的工作方法已经无法满足时代和消费者需求的变化。


    很多人误以为今天卖的好的产品，明天也会卖的好，于是会看前面的数据准备第二天甚至更长时间的库存。实际上，今天的数据对第二天而言只不过是历史记录罢了。


    # 最有效的学习是分享


    节选自「阿May」的主题


    绝大多数人加入大咖的圈子后，都是抱着学习的心态，静默观看，要不就是认为自己付费了，就可以不断地向群主索取，要不就是抱着过来打广告的心态。


    其实，最有效的学习是分享，最有效打广告的方式也是分享，最有效链接大咖的方式还是分享。


    # 提升认知，赚钱是迟早的


    节选自「明白」的主题


    我是相信爱情的，不对，我是相信个人力量的，一个人的认知提升后，赚钱是迟早的事。


    # 与用户建立沟通机制非常重要


    节选自「凯凯划」的主题


    和用户建立沟通机制非常重要，我做这个小工具的过程中就发现和用户的沟通简直就是宝藏，用户是和你站在一起的，会给你提建议，帮你解决问题。


    # 创业早期先考虑生存再考虑商业模式


    节选自「黑少爷」的主题


    创业公司的早期，简单、粗暴，快速，集中力量很重要，不规范不一定是坏事，先考虑生存，再考虑商业模式，只要业绩正向增长，有些问题并不影响企业生死。


    # 人到中年选择一个最熟悉的领域去干最重要


    节选自「胡光成」的主题


    人到中年不要试图去证明自己在所有领域都很优秀，选择一个自己最擅长，最熟悉的领域去干最重要。不足的地方一方面找人来弥补替代，一方面自己努力去补上，没有别的第三条路可选。


    # 越不以成交为目的越容易成交


    节选自「顾小北」的主题


    你所写的文章，一定要从用户的角度去出发，模拟用户看了你的文章，是一个什么样的感受。不要着急动作变形，你看现在的很多人，都意识到媒体的重要性，但是根本等不及，很多人动不动才写两篇文章都想变现，我觉得这是太急功近利了，我自己写文章都写了6年了，跑步都跑了10年了，所以我非常能沉得住气，如果一件事可行，可以花时间去慢慢沉淀。


    记住，越不以成交为目的的，到最后其实是越成交！


    # 有的时候赚钱也要看商务能力


    节选自「刘大猫」的主题


    有的时候赚钱要看商务能力，你的商务能力牛逼，即便网站没什么用户，也能赚钱，关键看如何讲，以及搞清楚买方的核心需求是什么。


    # 差异化是解药，也是毒药


    节选自「亦仁」的主题


    差异化是解药，也是毒药。


    差异化是很好的切入方式，避开厮杀的红海，找到非充分竞争的蓝海，开拓没人关注的细分市场，找到一些不同的痛点，做一些不同的产品，打一些新的品牌认知，吸引一批新的用户群体，做一个小而美，差异化是一剂良方，是解药。


    但是习惯了差异化竞争的人，习惯了小而美的利润空间，你会发现他永远在从0到1，永远在找新的细分市场，这样的差异化是毒药。


    # 怎样去运营一个账号？


    节选自「Wentao」的主题


    想要扎扎实实地成为一个大号，必须要先抖音之忧而忧。换位思考，如果你是抖音的运营，你的目标是什么？你需要鼓励什么行为来实现这个目标？


    # 没有项目就要找到一个项目


    节选自「乔里奥」的主题


    没有项目就赶紧找到一个项目，找到一个项目就去尽快跑通项目。别看自己不如别人懂得多，什么管理学、营销学各种很高级的学问。只要自己有办法有能力跑通项目就能赚到钱，这谁也拦不住，就算是目不识丁都不影响。


    # 赚钱要找到适合自己的方法


    节选自「阿彪」的主题


