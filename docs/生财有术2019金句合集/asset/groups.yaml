    节选自「沈小善」的主题


    找到你喜欢的，热爱的事情。因为只有热爱才能让你不计成本的投入，才能全情贯注的研究，不要说十年二十年，只要不断行动五年，你大概率在你喜欢的行业也算是万里挑一，做能为这个世界带来美好又能赚钱的事情。


    # 学会利用那些很厉害的理论


    节选自「明白」的主题


    当我们碰到一个很厉害的理论、模式、产品的时候，一定要想一下，这个理论、模式、产品，能不能套用到其他领域、场景、用户，理解了这套组合拳的打法，你会发现，互联网到处都是赚钱机会。'
