    节选自「李晨」的主题


    投资是一生的命题，越早接触投资越好。


    学着去判断市场的趋势，学着去判断资产的价值，学着去判断商业模式的演变，慢慢的它会给你一个新的视角让你从更宏观的角度去审视产业链环节和行业发展阶段。


    ## 内容为王


    节选自「张五哥」的主题


    抖音的长期机会是优质内容的打造能力，和最大程度利用这种蓄积来打造自身IP的机会。


    ## 小工具也可以赚大钱


    节选自「文由」的主题


    微商交易过程中用户备注与物流信息同步是一个痛点，传统微商在没有运营微店之类的工具时，用户管理通常通过聊天置顶与备注名完成。开发一个小工具，快速记录物流信息，方便买家查询，有人做了类似的小程序，收入很好。


    ## 超级符号的运用


    节选自「钱钰」的主题


    人们天然喜欢接受熟悉的内容，选择熟悉的产品，传播熟悉的语句。


    而当企业做一款新产品的时候，通过超级符号的运用，可以将一个全新的品牌一夜之间变成亿万消费者的老朋友。


    ## 销售维艰


    节选自「弗兰克」的主题


    让人掏钱从来就不是一件容易的事，不管是跳槽让新东家给你涨薪，还是让陌生人购买你的产品，销售从来就不是一件容易的事。


    ## 巨头夹缝中找创业机会


    节选自「森淼」的主题


    抱巨头大腿，挖掘他们未满足大众的细分需求，是创业一个很好的切入点。


    ## 抓住永恒不变的价值


    节选自「钱钰」的主题


    专注一个点创业并不是什么丢人的事情，要抓住永恒不变的价值创业一直是我的理念，


    人是物理动物，中国是城市聚居型国家，因此城市人口密集度太高，各种需求旺盛，一定会有层出不穷的机会。


    ## 任何商业模式都有Bug


    节选自「百川」的主题


    任何商业模式都有Bug，我们应该考虑风险，但是不应该吹毛求疵追求完美，更不应该用极小概率的事件否定自己全盘的商业。开一家饭店，可能因为食品安全问题出事故，那是不是我开饭店这生意就不用干了？


    ## 创业团队的气质


    节选自「粥左罗」的主题


    我这半年的感受就是，刚创业招人要慢，前面几个员工非常重要，影响你初次做一个团队的信心，也奠定了你后面团队整体气质。


    我的团队成员都是社群里的，我们价值观非常吻合，目标都很一致，沟通成本极低，所以现在团队上我不用操心，大家干活都非常主动高效，他们充分信任我，我也充分信任他们。


    ## 用户激励体系


    节选自「王六六」的主题


    用户激励体系：


    - 负激励：社群留级制度，积分扣减，不打卡就出局等；

    - 正激励：荣誉激励，情感激励，利益激励，社群升级制度，星球分享进群制度，排名，竞争图谱，等级，勋章，积分，社交互助，奖金激励等。


    ## 运营客户不端架子


    节选自「Max Guo」的主题


    运营客户不能端着架子，不能按照公事公办的角度和客户谈业务，而要像朋友一样坦诚、有血有肉的交心。要主动暴露自己的弱点、软肋，展示自己的不完美，请客户像朋友一样谅解自己的不完美，并且邀请客户耐着性子和我们一起成长。


    ## 新设备催生新流量


    节选自「钱昊」的主题


    一次完美的体验非常需要各种设备之间的配合，而流量可能就会以前所未有的合作性方式出现在我们面前，如何衡量、分配、利用这些流量就会变成一个全新的有趣课题。


    ## 信息茧房


    节选自「钱钰」的主题


    互联网看似让信息对称了，其实加剧了信息不对称。信息茧房已经形成，每个人看到的世界只是你一直在看的，以及你以为的那个世界。


    ## 孤岛效应


    节选自「Caoz」的主题


    要注意孤岛效应，比如智能机刚起来的时候，很多人意识不到，人人都会成为智能机的用户。因为没有意识到，一旦你身边的人都是智能机用户，你是不可能继续维持功能机的，你会成为人群里的孤岛，无法和别人在同一个层面交流，所以最终的结果一定是通杀所有用户。


    ## 不要老是盯着一个渠道赚钱


    节选自「顾小北」的主题


    不要老是盯着一个渠道赚钱。实际上我们团队非常有危机感，比如我们觉得Facebook赚钱，但是我们一定不会满足Facebook这个渠道，我们会时刻观察新的渠道，比如Instagram、Pinterest。


    ## 个人口碑的形成


    节选自「大白」的主题


    当别人在需要的时候能想到你，当别人在有机会的时候一样会能够想到你。个人的口碑，只能通过无数次的日常沟通和行为中，潜移默化的给他人形成和强化一点点印象。


    ## 宠物市场大有可为


    节选自「叶新国」的主题


    宠物是除人以外最大的生物，做宠物的吃喝拉撒有很大的市场，且随着城市、老龄化，人的孤独感不断增加，宠物市场潜在在不断增加。


    ## 没那么多精明也许会有更大收获


    节选自「小马哥」的主题


    - 一个新的机会来临的时候肯定没有前人可以参考，如果傻一点反而会有更好的收获；

    - 一个事件什么时候做都不晚，只要努力做多做一定会产生质变；

    - 要去通过自己的经验和眼光去赌未来2-3年的时代拐点，如果没有能力自己做可以考虑跟着团队一起做。


    ## 一个把用户转化为水军的案例


    节选自「xyz」的主题


    论哪个App最能把用户转化为自己的水军，我认为当属墨墨（一款背单词App）了。


    在所有App都在问用户“自己好用吗？”、“好用给个五星呗”、“不好用来吐槽一下”之类的话，墨墨成功地通过单词上限量奖励，激励了用户去写评论，又十分成功地通过“撰文教学”转化用户成为好评水军，占据最具有宣传效果和用户转化率的平台。


    ## 付费加入高质量圈子打破圈层屏障


    节选自「sitin」的主题


    优秀的人往往是扎堆的。很多时候我们没有达到一个层级，需要通过一些成本，比如「付费」才能加入，在这个过程中不断学习进步，从而让自己变的优秀，越优秀你才会遇见链接更优秀的人，不断打破圈层的屏障。


    ## 新交互是产品公司最大的红利


    节选自「钱昊」的主题


    从红利的角度来看，对于产品公司最大的红利就是新交互，这永远是大潮的基石。


    而对于流量公司来说最大的红利是新生态刚刚建立的时候，这是和大树一起成长的最佳时机。


    ## 要想赚钱，得对自己下狠手


    节选自「V先生」的主题


    时间和精力如何分配，这个没有标准答案。想在互联网上赚钱，找到核心算法，做有效动作，比别人付出更多的时间。中国人这么多，不对自己下狠手，凭什么你出名，凭什么你赚钱呢？是不是。


    ## 从主流竞品中找到产品的创新点


    节选自「鱼丸出面」的主题


    从主流的竞品中找到产品的创新点，比如对方的产品价格太贵、功能太多、社交功能太多，一定会有一些人不喜欢这些功能或者特性，于是做一个更便宜点的、精简的、隐私保护较好的工具会被欢迎。


    其实，这个不仅仅在作者的产品上是这样，很多产品越做越大、越做越重，很多人受不了会离开，这时候就会有新的产品的机会。


    ## 如何成为一个优秀的投手


    节选自「阿发Alpha」的主题


    成为一个优秀的投手，要做到这三点：


    - 胆大心细；

    - 有一套科学、系统的投放方法论，并且不断迭代这套方法论；

    - 花钱花钱花钱。


    ## 电商的爆发潜力


    节选自「David.Wen」的主题


    电商说到底还是商，只是形式不同，相比其他商，电商最大的优势：


    - 爆发能力，没有区域限制，一个产品好了，迅速能聚集大量拥趸。

    - 电商不用求全，几项能力优秀，你便可以立足之地。


    ## 赚钱背后全力以赴的精细打磨


    节选自「张佳」的主题


    我总结了生财有术的一个特点：全力以赴的精细打磨。他们确实占到了风口，这是他们的运气。但是我们也在风口上，我们却没赚到钱。


    我甚至曾自诩比他们都懂这个风口，现在想来甚是惭愧。如大家所说赚钱90%靠运气，但是运气后面藏着一个我们都看不到的“打磨”。


    ## 业务能力强是什么样？


    节选自「亦仁」的主题


    业务能力强的人，强在什么地方？


    一个新的业务告诉他，他能大概算出来赚多少钱，在整个路径上的指标大概是多少，可能有偏差，但只要经过几次执行，立即能迭代出准确的值。带着地图去做业务，很快纠偏并找到优化点。


    ## 接水管而不是搬水桶才能躺赚


    节选自「Max Guo」的主题


    自己的时间精力就是事业的天花板。想躺赢不能自己没日没夜的搬水桶，要接水管。要设计一个系统，用别人的时间精力为自己赚钱。


    ## 脏活、累活出奇迹


    节选自「亦仁」的主题


    脏活、累活出奇迹。


    整理数据这样的脏活、累活，很多产品或者文章是数据换个维度，谁把数据整理的干净、清爽、有结构，谁就提供了更高一层纬度的价值。


    如果没有生产数据的能力，那么不如考虑考虑做数据的搬运工。


    ## 运营微商化是必然趋势


    节选自「尹基跃」的主题


    私域流量是指沉淀在企业或者门店那，可以免费、自由触达和使用的，沉淀在微信群、微信号等有一定密闭空间的用户。


    更大范围的私域流量还有沉淀在自己公众号、抖音号和自有App上面的用户。


    未来门店流量私域化，运营微商化是一个必然趋势，门店持续增长的唯一路径就是找到并维护好超级用户。

    '
