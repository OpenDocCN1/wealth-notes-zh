    ## Allin


    节选自「亦仁」的主题


    有钱赚的时候，要集中所有的资源和精力，All in，不要小富即安。


    过几年你会拍大腿，那么好的捡钱的时候，为什么错过了。居安思危的人才能活得长久，富一次的人很多，富一辈子的人很少。


    ## 核心价值


    节选自「沐文」的主题


    引流也好、裂变也罢，核心仍然是提供价值。


    总会有认同价值的，也总会有怀疑价值的，我们不能因为50%的怀疑价值的人，而放弃为剩下的50%的人提供价值的机会。


    引流、裂变、发售、势能都是术而已，掌握术容易，术也能带来更快的收益，但不变的是道：核心价值。


    ## 轻创业


    节选自「惊了鹿」的主题


    我现在创业，期待越轻越好，越产品化越好，最好把内容环节都省掉才觉得好，把增长模块都做到产品中去，只要第一波倒入流量后，后面就可以自发增长和变现了。


    ## 加戏


    节选自「亦仁」的主题


    很多时候，我们会给自己加戏，觉得自己怎么正确，但放到环境大背景大平台下，你怎么想怎么做其实没那么重要，跟着平台走，想想平台需要什么，不想要什么。


    ## 信息差


    节选自「四爷」的主题


    让我们想想，用户主动搜索，用户基数很大，购买意愿强烈，这是什么地方？答案呼之欲出：淘宝！


    于是我到淘宝上调查了一下，信用卡相关关键字几乎没人做！红利啊！


    立刻用生意参谋分析了需求的分布，关键字的搜索量，竞争度，优化关键字后设计上架了这样一个产品：


    - XXX银行信用卡内部员工申请通道。

    - 比起其他渠道，超快速核卡，大概率提高30%以上下卡额度

    - 本人内部员工，上班不常看手机，挣点冰棍钱

    - 特殊通道，随时失效

    - 售价2块，核卡失败可退


    ## 损失规避


    节选自「百川」的主题


    做任何事情都要学会，不断探寻它背后最朴素的本质到底是什么？


    一家服装店的老板对进店的顾客说，买衣服打8折，几乎没有顾客心动，后来老板换了说辞，顾客进门不管有没有消费，直接送1000元会员卡，这个主张没有会员会拒绝，很多人奇怪这个怎么赚钱呢？


    会员卡每次消费只能抵扣20％现金，相当于打了8折，但是对客户来说这相当于1000元的现金，没有人会把1000元的现金扔了。


    同样的打8折，背后的本质没变，但是从营销效果上却发生了很大的变化，你说有趣不有趣？


    ## 信息源


    节选自「龙共火星」的主题


    一手信息特别重要，想要获取信息，最好是让自己成为信息源。


    当然一般来说，特别有价值的信息，很少会在公开场合说，更常见的是线下或者是极小的圈子大家相互说。那我们为什么还要参加大圈子的讨论，核心其实是找到你“情投意合“的人，私底下再去深度交流。


    ## 会算账


    节选自「百川」的主题


    忘掉所谓的创业，老老实实做一个生意人，把账算清楚。


    算账能重要到什么程度？不仅生意开始前要计算，算账贯穿了经营管理的全部环节！搞促销做活动需要算账，复制项目开分店需要算账，投放广告需要算账，人员规模扩张需要算账，裁员裁多少人都需要算账。


    很难想象一个会算账的精明生意人，能把生意做亏钱。


    ## 人设


    节选自「一本黑」的主题


    为什么抖音上那么多奇人异事装疯卖傻？其实这就是人设，你以为别人傻，但你去看看人家的粉丝量，人家可能一场直播或者一次带货就够你奋斗半年了的。


    所以，当你产生疑问，不理解别人的时候，多想想这群人玩的是什么。


    一个IP形象一定是要有特点的，他可能是口头禅、可能是某个动作，但就这一个行为就能让读者或观众记住你，那就够了。


    ## 勇敢输出


    节选自「沈小睿」的主题


    他们为什么要加我？


    用黑科技大佬的一句话说，我们看上去的业务虽然完全不相关，但是人是有力量的，有磁场的。


    来到这里的人，都是爱钱的人，也是一直追求更好东西的人，没有人会拒绝一个一直在行动，在认真分享，认真交朋友的人。


    只要认真分享你的思考，你的数据，你的业务，能帮到人，能给人思考，就会有朋友愿意加你，他日定能帮你一把。


    ## 信息不对称


    节选自「沐九哥」的主题


    今天我们遇到的所有问题，都可以用一句话概括：信息不对称。如果你知道了行业信息，就不会迷茫，如果你知道了市场信息，你的产品会卖爆。


    如何消除信息不对称？其实你消除不了，这是二八定律。你能做的，就是多和不同的人交流沟通，取长补短，在可控范围内多去尝试，扩展视野。这么做的目的不是为了让自己爬的更高，而是为了别让自己跌的很惨。


    ## 空杯心态


    节选自「亦仁」的主题


    不要路径依赖，世界变化太快，之前成功的办法很可能不再有效，过于相信自己的判断会摔的很惨，开放空杯，多听多想。


    穷人之所以穷一定是有道理的，他们有一套逻辑自洽的说辞，当然你也有自己的一套逻辑自洽的说辞，他们也可能更正确，只不过正确不代表赚钱。有这么一句话，悲观者正确，乐观者成功。


    ## 做大公众号的 5 点感受


    节选自「梁勇」的主题


    我做大Python爱好者社区公众号并实现技术类公众号变现的几点感受：


    1. 厚积薄发，内容为先，读者至上；

    2. 多和他人交流学习经验；

    3. 要敢于尝试并开发新玩法；

    4. 有人的地方就有江湖，需要制定江湖规则维系良好发展；

    5. 圈子内团结、合作、共赢。


    ## 套用


    节选自「严华培」的主题


    市场上火的内容，其实都没有绝对的新内容。


    字说制作的文字动画，其实就是换了一种形式讲段子、读鸡汤，段子还是那个段子、鸡汤还是那个鸡汤。不同的人了，不同的形式演绎了。我们的很多用户，只是找了本书，划重点读了出来，也收获了上百万的粉丝。


    做视频营销不需要刻意的创新，需要的是不同的演绎，因为用户看视频，老的内容，反而更容易理解。


    ## 爆品挖掘


    节选自「条形马」的主题


    大众普通爆品如何挖掘，有人做过这样的总结：男人怕虚怕穷、女人怕老怕丑、小孩怕笨、老人怕死。这四个怕，算是一条捷径了。但这也是竞争最为激烈，价格最没有底线的品类了。


    如果想要拥有定价权，在没有品牌力的前提下，建议先避开这些品类，试着往小众领域摸索。比如说，资格证相关的培训类；比如说，找热门的高薪知识工作者行当的路人来开课，像大数据分析、数据挖掘、小程序设计甚至区块链技术这样的口子；比如说，象征身份和品味的一些闲课，红酒品鉴、国画赏析和歌剧赏析这类。


    ## 真正赚大钱的信息


    节选自「亦仁」的主题


    真正轻松赚大钱的信息，出现在主流互联网人的眼中，大概会晚两年左右。在这两年里，基本主流互联网听不到人聊相关信息，也搜索不到有实际价值的内容，而小圈子的人都在闷声赚钱，达成了一种默契，没人会出来讲。


    两年后，到主流互联网人眼中的信息，基本都没有赚钱价值。看到一些公众号文章，就开始激动觉得找到赚钱的路，大概率上韭菜。


    生财有术的信息新鲜度大概会比主流互联网早一年，抓住机会的话，一年其实也够了。


    ## 做了好产品，怎么动员身边资源？


    节选自「沈小善」的主题


    做了好产品，怎么动员身边资源？


    有公众号、微信群资源、大量好友的大佬，他们转发宣传能力强， 可以帮助到你。但为什么要帮你？他们知道你做的 是什么吗？你提供的东西有价值吗？他们信任你这个 人吗？


    要让别人信任你，让他们知道所有细节，让他们可以安心 的推荐，给他们的粉丝带来优质产品和价值。


    谁的粉丝都是粉丝，别想利用别人薅羊毛。


    ## 品牌力


    节选自「条形码」的主题


    积累自己的品牌力。


    这个建议，第一眼给人的感觉，一定是太务虚了，没法操 作。但我们有办法让它变得更简单更接地气更可操作 一些，那就是做好两件事：


    1. 做到严格的品控水平；

    2. 告诉潜在群体，你做到了严格的品控水平。


    ## 复利思维


    节选自「刘玮冬」的主题


    要去赚有“持续复利价值“的钱。这件事不仅要赚钱，重要的是，你一直做下去，它会给你带来源源不断的复利价值。


    无论是做这种“伪咨询”，还是去做一些所谓的营销方案，去企业做培训，这些钱赚的没有任何的“持续复利价值“。


    你要赚的钱，应该在赚的过程中与你发展的道路相贴近，并且帮助你不断成长。


    ## 百万头像生意


    节选自「朱凯阳」的主题


    微博有头像加V，为什么微信头像不可以P一个呢？于是他手动给自己P了一个，发朋友圈引来一堆人询问怎么加V，他开始手动帮大家P头像，大约一周时间病毒传播，自己开通十几个微信号，手工帮大家P了几万个头像，然后开始找技术外包开发程序。


    花了2000元找外包开发了小脚本，并开通一个订阅号，所 有人须关注订阅号，再添加一个微信个人号才能获取自动 P图权，没过几天就攒出300w+粉丝，以及近似规模个人
    好友。


    ## 认知成本


    节选自「沐九哥」的主题


    为什么我要做?任何的产品, 推广, 包装, 营销, 最终只 有一个目的: 让用户知道它。如果要做成一个产品或者平 台，你知道要花多少钱在这个“用户认知成本”上吗。脑白
    金当年砸了10个亿，洗脑式的投入才有了它的压制性成 功。


    所以羊驼项目，它最大的优势在于，我不需要花一分钱去 告诉全国人民，那是神兽！我只需要让大家知道我有！


    ## 小红书运营


    节选自「王煜」的主题


    开始运营小红书账号之前，请先关注“薯管家”(非常重要！)，任何一个平台都需要先了解它的规矩，小红书的规矩，一般由薯管家发布。


    规则的改变往往意味着内容输出的方式以及玩法的改变，作为个人账号运营者，重点关注“品牌合作人”相关笔记，品牌账号运营者，重点需要阅读“推广笔记社区规范”以及“品牌账号”相关功能。


    ## 电商货源


    节选自「坤爷」的主题


    我们电商卖货也是，一个爆品出来，单量很恐怖。我记得那时我们卖暖风机，每天轻轻松松3000~5000单，有的时候冲到8000单，这还是我们压着跑，控制着预算，否则一天给你冲到一两万单没问题！


    为什么压着呢？因为没货，一个爆品出来，你会发现1688上都难找到货了，而且1688上很多都不是真实的厂家，很 多二道贩子在上面倒腾货物，赚差价，抬价格，甚至垄断货源，尤其是江浙一带的小商品，1688上的几乎大部分是二道贩子！


    ## 开放


    节选自「亦仁」的主题


    绝大多数人不够开放，脑袋里面跳出来的几个赚钱点子以为就是全部。而实际上，如果没什么赚过钱经验人，脑袋里面出来的前几个点子都应该抛弃掉，随随便便都能想得到的，一定不赚钱。


    就像很多三四线的人，但凡除了工资外赚点钱，想到的第一个点子就是“开个店”，绝大多数开个人结局，也是亏个十几万干不下去。


    ## 短视频布局


    节选自「张佳」的主题


    1. 别人火了，你照抄或者简单调整思路再来一遍，不一定能火；

    2. 即便火了，别人能带货赚钱，你不一定也能带货赚钱；

    3. 短视频导师们知道怎么做火一个短视频或者账号，但不能告诉你怎么帮你赚到钱，因为他们很少知道你的店是怎么赚钱的；

    4. 短视频不单单是做内容和做服务的思维，它甚至和做公众号是完全不一样的，所以有公众号经验的人不一定能做好短视频；

    5. 在做抖音之前，强烈建议你先了解一下什么是“算法分发”。


    ## 生财有术LOGO


    节选自「大树」的主题

    我们是如何设计出生财有术Logo的？

    解读：圈子（社群）+钱（旋转起来钱符号）¥+术（生财有术）。

    一个谈钱不伤感情的社群。


    整个形象是一个转起来的钱币，把术和钱结合到一起。通过图形化设计，既是术又是钱，紧贴主体，颜色延续了原有的绿色系印象，用了一个更“脆”更年轻的颜色。


    ## 抖音热门


    节选自「周可」的主题


    做抖音视频两个基本点：要学会蹭热点，做热门内容。


    一是做热门领域，抖音上，像奇闻、探索、励志、动画，都是热门领域，有非常多受众，选择在热门领域做内容，更容易爆，更容易出效果，事半功倍。


    二是“复制”热门内容，对绝大部分人而言，要从0到1创作一条爆款内容，几乎不可能，但，我们可以选择重做一遍爆款内容。把别人的爆款，按照我们的理解，做成自己的爆款。这种方式，目前在抖音上屡试不爽。


    ## 口碑维护


    节选自「无知」的主题


    口碑维护这场仗是需要一直打下去的，而实际情况是渠道广、媒体平台多、信息源庞大，单靠几个人没法完全覆盖到的。


    所有我们需要用到舆情监控工具，一套有内容分析功能的爬虫系统，可以基于设定的关键词，实时监控全网几万个媒体站点的信息，并对信息能做正负面识别，且可以分析各个媒体平台的发文声量、事件的传播路径等，可以帮助决策者第一事件发现负面，做出决策。在舆情事件的传播中，时间是最重要的资源。


    ## 副业


    节选自「Sky」的主题


    我们身边很多人之所以焦虑，大多数原因是我们只有一份工资收入，一旦失去这份收入，我们的房贷、车贷、生活就会失去保障，所以我们每天必须去面对我们不喜欢的人，不喜欢的事情，以及不喜欢的人际关系。


    知乎上有一个很经典的问答，月入3W感觉很焦虑？有一个点赞很高，“你收入的姿势不对，如果你是收房租月入3W 你肯定会幸福”。


    所以，趁着年轻，给自己多找一些收入的渠道。


    ## 社交红利


    节选自「条形马」的主题


    社交网络普及以后，我们不需要和大牛拥有相同量级的资源和社交生态位，只需要在某一或某几个领域上，拥有和对方认知能力相匹配的层级，就能与之对话。


    整天羡慕赶风口和追红利，其实若以时代为分野，能对话这事儿已经是我们区别于上一个时代的人的大红利之一了。


    ## 最好的时代


    节选自「许欢」的主题


    “这是最好的时代，也是最坏的时代！”


    英国文学家狄更斯曾这样描述工业革命发生后的世界。


    在5G的年代，是信息革命的时代，但上面这句话同样适用。因为跟不上时代的人，这个时代对于他来说，就是最坏的时代。而对于我们的认知来说，我们即将迎来的是最好的时代！


    ## 活动最优解


    节选自「王六六」的主题


    没有谁能把每次活动都做到爆发增长，都是经过无数测试测出的最优解，一个好的选题是要经过几十个几百个选题去测试出来的。


    ## 幸运的行为


    节选自「李晨」的主题


    我相信好运，我的好奇心也常带给我一些好运。个人努力重要，但想要有更好的发展，也很需要思考历史进程以及 运气的影响。


    幸运的人，常常善于发现周围世界的闪光点，主动增加自己接触的信息，这就是幸运的行为。


    ## 人气


    节选自「Paul 彭」的主题


    有钱赚钱，没钱赚人气。钱可以不赚，人气不会过时。心态要好。


    ## 赚什么样的钱


    节选自「亦仁」的主题


    做项目要区分是赚新鲜感的钱还是赚稳定提供价值的钱。


    判断不一样，打法不一样。现在再考虑做地图的事情，建议亏钱找渠道卖地图，作为引流款，后面有高客单价的变现端来承接。


    就跟区分是做赚钱的公司和值钱的公司一样，做项目也要区分是赚新鲜感的钱还是赚稳定提供价值的钱。


    ## 犯正确的错


    节选自「拾山」的主题


    用错误的方法赚钱，强化的是错误的方法和错误的理论，最终一定会卡到一个阶段无法再提高了。而用正确的方法亏了钱，你恰恰有了一个修正自己投资体系的机会，从而更加完善这个体系和框架。


    久而久之，你就可以找到可重复盈利的方法了。


    ## 内容为王


    节选自「一本黑」的主题


    能输出好内容的人，在这个时代，仍然是最有底气的人，哪怕是微信这艘大船沉掉，好内容在任何平台仍然是稀缺，内容为王不过时。


    ## 新一代互联网人


    节选自「钱钰」的主题


    新一代互联网人普遍具有复利意识，对平台重视但也不完全依赖，对自己更自信，在自身品牌上实现复利，珍惜自己的品牌和言行，不随意收割信任自己的粉丝，善于与粉丝实现更长久的信任和价值互换。习惯用输出倒逼自己学习。为了实现自己的目标可以坚持，可以耐得住寂寞。


    ## 第三空间


    节选自「凯凯划」的主题


    第三空间，就是指除了工作、生活之外的我们自己的空间。仔细想想，我们自己独处的时间是很多的，早起的那段时间、走路、开车、坐地铁等等，这都是属于我们自己的第三空间。


    好好利用好这些空间，就是巨大的时间。第三空间的核心是用空间来换时间。


    ## 自我介绍


    节选自「谢歆锋」的主题


    一个优秀的自我介绍很重要。人们总是关心你是谁，你曾经做过什么，以此，来推断未来你可能会做什么，你的能力如何，以及跟你可能存在的合作机会。


    信任的本质实际上是关于自我信息与他人信息的综合匹配，你披露越多，纬度越全面，与其他用户的相似或者互补度越高，就能可能建立越多的信任。人们本能会躲避威胁与风险，喜欢和自己有相同，相似经历和价值观的人，以此结伴同行。


    ## 死磕


    节选自「亦仁」的主题


    不要轻易放弃一件事，得死磕，如果你经常拿不到结果，需要反思是不是从来没成功做成过一件困难的事情，没成功过才不知道坚持可以大大提高成功的概率。


    ## 精益创业


    节选自「鱼丸出面」的主题


    在消除产品或技术风险之前，一定要使用精益创业原则，先消除市场风险。


    真正关键的问题不是“这个产品能做出来吗”，而是“这个产品应该被做出来吗?”这个问题的唯一答案只取决于这个产品能否满足用户需求。


    ## 认知独立


    节选自「乔里奥」的主题


    任何事都要自己想想是什么道理，我们要明确目标，独立思考。要带别人节奏，不要被别人带了节奏。


    无论任何事，如果你身边的人都在做，那大概率是一件不值得做的事，除非你身在一个超级厉害的圈子。

