    ## 要不断提升自己社会竞争力


    节选自「贾万兴」的主题


    我们在提升自己时，最关键的点是找到那些能给自己增加社会竞争力的优势，然后不断强化，而不是去改所谓的缺点，除非那个缺点是致命的，因为我们的人生有限，你改完了所有缺点到死那天，也不过是个“合格”的一般人罢了，有意思吗？


    ## 有目标的把钱赚了


    节选自「刘大猫」的主题


    上了一定年纪的，要多利用自己积累的资源，也要多学习把身边能做的事情、能赚的钱赚到位，评估好自己的各项能力，有的放矢。有目标的行动，而不可整天到处漫无目的像个苍蝇一样，弄这弄那，至少概率上说不会有太多取得成绩的概率。


