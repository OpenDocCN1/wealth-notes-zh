    但他知道这些人会失败，因为这些网站很垃圾，本质上，还是因为这些人不熟悉产品或业务，也不知道自己的网站建起来，能做什么，所以这位大哥想提供一些个性化、量身定制的培训服务，帮助这些人，通过持续的运营和推广，最终他成功实现一年赚到100万美金。


