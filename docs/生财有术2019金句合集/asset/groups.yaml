    ## 如何把控“大账”


    节选自「Emily」的主题


    创始人把控“大账”的思路跟所得税类似：建立好财务框架，通过几家公司合理分配业务，充分发挥企业所得税及增值税的优惠政策，以达到综合税负最低。


    ## 一切归零非常重要


    节选自「顾小北」的主题


    在创业中，无论你过去的资历如何牛逼，如何光鲜，在开启一个项目的时候，这些要素统统起不了作用，反而有时候会让你看不清方向，所以一切归零非常的有必要。


    ## 知乎引流方法


    节选自「一碗梁粉」的主题


    知乎引流一个验证有效的办法：通过合集、全集、大全帖子引流。


    - 1. 针对特定的问题，制作全集，合集Excel，或者PDF等；

    - 2. 在自己知乎的昵称，备注里做第一步引导到公众号；

    - 3. 回答热门问题，记得一定要在答案截图Excel，体现价值；

    - 4. 引导至公众号回复关键词获取资料；

    - 5. 资料里再植入相应的链接。


    ## 不要看不起每一项小业务


    节选自「亦仁」的主题


    不要看不起每一项小业务，任何一项微不足道的小业务、小痛点，在中国这么大的人口基数和杠杆下，可能都藏着一头惊人的赚钱怪兽。


    ## 精细化的过程控制


    节选自「陈勇」的主题


    只有精细化的过程控制，成功才能复制。


    也就是你知道怎么做，这件事才能成，然后坚定不移的去执行就好。执行过程中，动作不要走形，很多公司或个人最后都败在执行上。


    ## 如何广告优化？


    节选自「MOJI」的主题


    广告优化实际就是一个慢慢缩小范围的过程。


    就像出海捕鱼，为什么要用渔网？因为我们不确定鱼在哪里，首先要选定一个渔网能够覆盖的范围，撒下网后，还需要一定的时间等鱼儿游到渔网覆盖的范围内（收集的数据达到一定的统计意义），然后再慢慢收缩，最后把网拉上来，扔掉小鱼，死鱼（排除转化率不高的人群），继续撒网。慢慢地我们就知道哪个海域，什么时间段，会捕到什么样的鱼。


    ## 如何才能实现成长与进步


    节选自「Scalers」的主题


    如果你要实现成长，一定要消耗大量的脑力和体力，不可能有一种轻松愉悦的方式来获得真正的进步和突破。


    只有通过大量的时间和精力投入，才能获得自己的进步，这比所谓的技巧与方法有更高的优先级。


    ## 谋定而后动


    节选自「亦仁」的主题


    别轻易冲进一个听说赚钱的市场，谋定而后动，调研清楚机会、能力、团队，再动也不迟，不要追求成为第一波吃螃蟹的人，市场足够大，第二波、第三波也可以。


    ## 社群的玩法是多变的


    节选自「夏木姬」的主题


    社群的玩法是多变的，千万不要局限在原有的“套子”里。


    唯一不变的是变化，作为群主，要积极接受新的理念、工具，丰富更新社群的玩法，让社群的价值最大化。


    ## 人生最重要的第一桶金


    节选自「Amy」的主题


    其实相对于别人的第一桶金就赚几百万来说，我赚的真的就是渣渣了。但是我认为的第一桶金，是你能够通过这个经历所带来的思维转变，格局的扩大，阅历的提升，市场的洞察，这才是你人生最重要的第一桶金。


    ## 差异化竞争


    节选自「归途」的主题


    差异化竞争：在一个极其细分的领域（别人看不上、不屑于做或者不好做）深耕，成为该领域的“隐形冠军”，再逐步扩大。


    初入市场，如何切入市场，大众爆款 or 个性化，从小众市场切入，满足个性化的需求。


    - 1. 避开同质化，挖掘低频产品；

    - 2. 围绕被长尾产品吸引过来的精准用户，构建社群；

    - 3. 服务好这个长尾用户群体，挖掘社群延伸的个性需求，促进持续交易。


    ## 最贵的是你的时间和认知


    节选自「龙东平」的主题


    最便宜的是书、是你的钱；最贵的是你的时间、是你的认知。


    我特别认可那句：人的一生取决于你看过书和遇见的人。


    王强老师说读书一定要读一流的书，说得太好了。徐沪生老师也说要读经典，少读新书，要读死人写的书，人已经死了，书流传百年。


    一定要读那些人类历史上没被大浪淘沙淘汰掉的东西。


    ## 寻找机会，探索新的领域


    节选自「阿彪」的主题


    寻找机会，探索新的领域，竞品分析，一定一定要查看对方的Top pages和Top keyword。根据二八定理，很多网站80%以上的流量都是来源于不超过15个页面，甚至很多网站80%以上的流量都是首页流量。


    ## 要跨界学习一点知识


    节选自「沈小善」的主题


    这里想说，跨界学习一点其它知识，可能会显著提高你的竞争力。


    会表达的程序员更容易达成合伙，会数据分析的文案人更容易写出爆款文章。


    ## 不要一直追求流量红利


    节选自「大白」的主题


    大家都在找流量红利的时候，你有没有想过做那些冷门的词？冷门的关键词几乎可以没有竞争的获得自然排名，然后导入目标流量变现。


    就比如不管个人条件如何，去追一个人人都在追的校花明星，到头来精力和金钱花了不少，却什么都没得到，有时候还真不如去找个内在美相貌并不出众的！


    ## 注意力在哪，流量就在哪


    节选自「临西」的主题


    注意力在哪里，流量就在哪里，有了流量自然会产生巨大的经济效益。不是微信不行了，是我们玩抖音的时间长了，就自然而然占据了刷微信的时间。抖音抢占的，是我们最宝贵的时间。


    ## 如何才能长久赚钱


    节选自「夜息」的主题


    只有自己摸索出来的业务，才能长久赚钱，并且要花费大量时间。跟着人家业务走，最多赚一个风口，更多可能连汤都喝不上。


    见过很多对各种业务模式侃侃而谈的人，这也赚钱那也赚钱的，等到自己做就没一个能赚的。


    ## 瞻前顾后是做不成事情的


    节选自「亦仁」的主题


    你只管去做，不要太在意别人说什么，有牛逼的结果出来后，大家自然会服。太纠结太墨迹，瞻前顾后是做不成事情的。


    ## 先抄后超


    节选自「亦仁」的主题


    山寨是创新的开始，抄都抄不好，自己做更不行。先抄后超，抄的基础上微创新。


    商业不是为了证明你有能力独立完成，而是看谁在最短的时间跑最快，是否独立不重要，这是一场开卷考试。


    ## 如何持续的获取价值


    节选自「条形马」的主题


    - 1. 想要让对方帮忙，应先珍惜对方的时间；

    - 2. 想和对方对话，应先构造互益场景。和比我优秀的人做益友，本质其实是，结成了互益互助关系。持续的价值获取，从来不是伸手党索取来的，而是互益交换出来的。


    ## 任何事情都不是一蹴而就的


    节选自「鱼丸出圈」的主题


    做成一件事情，并不是一蹴而就的，而是你花费大量的时间，解决了大量的问题之后，才做成的，很多事情看着简单，做起来却不简单。


    不要担心分享你的点子，点子不值钱，值钱的是你的执行力。


    ## 市场波动的判断


    节选自「Jason」的主题


    随着不可逆的城镇化率及改善需求，龙头地产公司（掌握人口流入的优质土地资源）未来十年周期来看会更趋向于永续行业而非周期行业。


    而市场的波动和错判以及估值的打折，是依照周期性行业来判断的。


    ## 检测下你对自我的了解程度


    节选自「白一喵」的主题


    创业要成，一半在认清用户，一半在认清自己。提供个小工具，30秒检测下你对自我的了解程度。


    - 1. 我很独特，因为我_______。

    - 2. 大家认为我_______。

    - 3. 我擅长_______。

    - 4. 我和别人不同，因为我_______。

    - 5. 大家会把我 和_______联想到一起。

    - 6. 我的特别之处在于_______。


    ## 如何才能一鱼多吃


    节选自「鱼丸出圈」的主题


    一鱼多吃，在线联动，从课程到工具再到培训，用户生命周期内所有需求都可以满足，并可以赚到钱，只要你让客户信任你。


    ## 要避免试错成本高的项目


    节选自「阿彪」的主题


    试错成本太高，对于个人或小团队是非常危险的。小团队或个人应尽量避免试错成本高的项目。


    尽量精益创业，模式还没走通就想着做大做强，花了不少的钱和时间精力，做的这些都是无用功。


    看上去很简单一个生意，随随便便启动资金就是二三十万人民币。测试阶段烧钱较多，而且还不一定能测试优化出来。尽量避免试错成本高的项目，对于小团队或个人来说非常重要。


    ## 产品就是很好的系统


    节选自「Jack」的主题


    产品就是很好的系统，运营摸透了细节后就应该产品化，自动化，解放人力，扩大规模。


    ## 定位非常非常重要


    节选自「V先生」的主题


    定位非常非常重要，所以放在第一条说。定位是1，其他的事情都是后面的0。


    瞎写也有复利，但写一段时间，你会发现难赚钱，慢慢就没有信心继续写了。明确定位的写作，便于后续做成内容产品，便于为自己打造标签，便于制造成就事件，产生滚雪球效应。


    写作是有复利的，尤其是“集中一个主题、带着框架、切分知识点去写作”，把这个主题写透，发在多平台给更多人看，并把写的做成不同内容产品（一鱼多吃），复利非常大。


    ## 玩互联网的方法用的好事半功倍


    节选自「Moss」的主题


    互联网玩法可谓日新月异，方法用得好事半功倍。运用裂变玩法和社群玩法，即增长黑客的模式代替了传统的投放广告增长的模式，以及可以将海外流量的套路、思维模式和方法论，跟国内新媒体流量玩法做无缝连接。


    ## 利用信息差赚取美金的案例


    节选自「Sophie」的主题


    有一个澳大利亚人做了一个网站，专门提供查询中国公司信用的服务，每个月流量7万多，如果UV是2万，转化率为2%，一个月也能转化400个订单，平均客单价200美元，一个月收入就是8万美元。


    ## 学会利用公用版权领域的作品


    节选自「柚子」的主题


    找公用版权领域的作品，进行再加工再制作，使得其更符合大众的需求，比如水浒传、红楼梦，进行再加工再传播。


    比如，案例中的主人公，将圣经做了一份西班牙语版本的iOS App，并在一段时间后出了西班牙语频版本的App，每个月赚到10000美元以上被动收入。


    ## 尽早打造属于自己的成功案例


    节选自「李晨」的主题


    要尽早打造属于自己的成功案例。


    成功的经历帮助你更好的成功，让自己有做做事的自信，也给别人一个相信你能成事的理由，这是做事的基础；人只要不断往高处走，路上遇到的人也会愿意追随或者提供帮助，友人相助，这是做事的机缘；聪明人欣赏聪明人，登上山顶见到的也是山顶上的人，视野角度，思考方式都会不一样，这是做事的格局；最后无论我们制造的“成功案例”是大小，靠实力还是好运气，其实都特别有用，真的。


    ## 围绕大平台设计小产品


    节选自「柚子」的主题


    围绕大平台设计小产品，解决用户痛点，可以比较容易获得用户。


    如案例中的小工具，在使用Snapchat过程中发现新的机会：替小公司设计基于地理位置的滤镜。比如你在自由女神像附近旅游，你就可以选择一个与自由女神像相关的贴纸，与你的照片融合到一起。


    最终这个产品成功每个月赚到1万美元。


    ## 要利用好流量而不是依赖它们


    节选自「鱼丸出圈」的主题


    当你开始一项新的创业项目，你会因为新鲜感而获取到很多额外的流量，很多人想过来看看了解。但是，这种流量很快就会消失，利用好它们但不要依赖于它们。


    ## SEO流量公式


    节选自「托尼先生」的主题


    SEO流量=整体搜索量 X 整体收录 X 整体排名 X 整体点击率。


    有搜索的地方就有排名，有排名就有优化。


    ## 靠做社群赚到千万级收入


    节选自「Scalers」的主题


    专注把事情做好，随着时间的推移自己的社群稳稳走下来，从十万到百万，从百万到千万，数字只是阶段性结果，只是价值的体现。


    把价值观主线抓牢，始终坚持面向真正成长开展工作，调动所有成员投入脑力与体力，未来只会取决于我们的想象力。


    ## 加微信群的6大选择途径和10种实操方法


    节选自「阿May」的主题


    我们想要的客户，除了需要我们的产品和服务来满足需求，他们还有其他消费圈、生活圈和信息获取渠道，所以我们没有必要大海捞针般的广撒网寻找客户，直接找到拥有目标客户的渠道（也就是鱼塘）进行对接，这是最快，最省力的引流客户策略！


    ## 赚到24万美元收益的App


    节选自「柚子」的主题


    男主角叫Rob，在14年的6月，围绕Instagram这个巨头产品，做了一个由Gif转视频的App，转换完成后就可以发布在Instagram上，这个工具帮他赚到了24万美元的收益。


    ## 走差异化路线，众争之地勿往


    节选自「亦仁」的主题


    世上本有路，走的人多了，便没有了路。


    刚开始创业要记住上面这一条，大多数人想做和在的事情，一定不会有很高的收益率。


    走差异化路线，找差异化定位，众争之地勿往。


    ## 广告投放重要的是什么


    节选自「李大仙」的主题


    广告投放什么最重要？


    - 1. 首先是素材，一个好的甚至非常优秀的素材，可以带来极具影响力的业绩；

    - 2. 其次是对媒体的逻辑理解多少，能多大程度的去利用好媒体的流量，也是非常充满挑战；

    - 3. 最后是细节和耐心，以及突破的渴望。


    ## 微信群运营小技巧


    节选自「杨涛」的主题


    微信生态中细致运营的一百条小技巧之微信群运营：


    改昵称和发自我介绍是一种仪式感，每个人在群里的每一次发言，被每一次被@，以及在这个群里加的每一个好友，其实增加的是他自己本身对这个群的认同和彼此的凝

    '
