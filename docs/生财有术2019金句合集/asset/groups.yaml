    > 节选自「亦仁」的主题


    一个人的“审美”能力决定他做事的水平。


    这里的“审美”指广义的“审美”：他所见过好的、高水平的、厉害的人或事。


    ## 关于农产品的社群思路


    > 节选自「七」的主题


    目前正在盈利的农产品社群思路：成立一个全国土特产联盟，入会需要交会员费。交了会员费，他们在朋友圈去展示这些土特产品，实地试吃加直播加朋友圈，帮助地头的合作社曝光产品，即一头对接商家，一头对接消费者，淘宝的平台模式，利用朋友圈出货并且对接其他销售渠道。


