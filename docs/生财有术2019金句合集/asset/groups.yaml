    销售思维是一种很有必要的思维。


    我们每个人的一生，都是不断销售自己的一生，销售思维是一部梯子、一个杠杆、一种四两拨千斤，在我们想要奔向某个目标的时候为我们创造条件。


    ## 稳居App Store榜前15的照片墙贴应用


    节选自「朱凯阳」的主题


    帮助用户把手机相册的照片快速做成照片墙贴图，通过App提供服务，用户上传完照片可直接下单。


    有一段时间稳居美国App Store摄影榜前15左右，每个用户都是看得到的流水。


    ## 单枪匹马无法从1到100


    节选自「John」的主题


    Hire to scale，单枪匹马，你可以闯出一番天地，But it takes time。搞Niche站也是如此，你可以一个人完成从0到1，但绝对不可能完成从1到10或到100，这就需要招人了。


    ### 内容快准狠是第一生产力


    节选自「杨涛」的主题


    内容是第一生产力，要明白不是说要高大上，无谓辞藻，雅俗共赏，是要快准狠。


    ### 60个切入抖音的思路


    节选自「V先生」的主题


    一个主题、一种创意，做的人太多，会引起视觉疲劳。这60个做抖音的思路帮助你扩展思路，找到突破方向。


    ## SEO非一日之功


    节选自「静水流深」的主题


    有时，我们太专注于行业新闻，而忘掉了做好SEO是需要时间和积累的。


    ## 工具网站“Privacy Policy Generator”


    节选自「亦仁」的主题


    Google上搜索“Privacy Policy”出现关键词提示“Privacy Policy Generator”，搜索结果排第一的网站提供标准化的模版生成服务，在此基础上提供增值服务，并且通过免费服务获取到用户邮箱之后，后续可以做邮件营销推广主机等服务。


    网站日均IP 7000左右，付费服务15一笔，按照1/100的转化率来估算，该网站日收入估算是1050。


    ## 用足够专注和细分留住客户


    节选自「鱼丸出面」的主题


    留住客户的一个重要原因，是因为足够专注和足够细分，不是专注于律师行业的SEO服务，而是专注于个人伤害律师行业的SEO服务，这种细分和专注使得他们可以有足够大的竞争优势，并不断在这个细分领域做到极致。


    ## 小圈子的重要性


    节选自「沈小善」的主题


    我特别喜欢生财有术这个圈子，因为过去两年的失败，让我知道了大多数在创业的人，不仅要接受自我怀疑，还要接受生活的敲打，最不甘心的是，身后竟无一人叫你再试一次。


    但这里，大把人会让你一直试。


    ## 提前预演，避免踩坑


    节选自「刘大猫」的主题


    我们评估一个项目，一开始就要想明白难点到底在哪里，我们能否克服这些难点，不要做到最后才发现，有些问题根本无解。


    ## 对广告保持好奇心


    节选自「黄亮」的主题


    商业里，广告是最好的东西，它是公开的，它必须完全的暴露到所有人面前，因为它要给用户看，所以，平时看到一些创意一些广告渠道的特殊广告，要保持好奇心。


    ## 创业前期一专多能非常重要


    节选自「森淼」的主题


    - 创业前期一专多能非常重要，有效提升开发效率并降低成本，增大生存几率；

    - 注重口碑营销，降低获客成本，让产品自带流量，具有自发裂变能力，是这个流量越来越贵的环境下提升投资回报率的不二法门；

    - 技术复用，亲身体验并改善自家产品，是一个App创业者必备的自我修养。


    ## 打破常规思维方式


    节选自「贾万兴」的主题


    一群人在一起吃饭，突然有一个人，他飘起来了，这个时候所有的成年人，肯定会感觉到这事很异常，甚至有点恐怖。


    如果是一个小孩，看到一个人 在桌上飘起来，他的想法是什么？可能是有趣，我怎么才能飘起来。


    在这里几乎所有成年人都被人不能飞这个规则限制了，所以失去了可能的机会，这个例子看上去有些极端，但是你想过人为什么要工作？为什么要吃3顿饭，而不是5顿吗？


    ## 商业模式之高操作傻瓜化


    节选自「Maors」的主题


    不妨把这模式称为高手操作傻瓜化。


    比如小白不会制作精美的PPT，那么PPT模板就出来了；比如小白写法律文书会没有思路，不知如何下手，那么来个法律文书范本呗；比如大学生求职信写简历没经验写的不好，求职简历模板来了；比如沟通时表达逻辑不够清晰有逻辑，练练金字塔原理呗；比如PS软件对技能有一定要求，那美图秀秀就填补了这一空白。


    ## 一年赚千万的照片书


    节选自「朱凯阳」的主题


    前几年，有人帮助用户把他们的微博和微信朋友圈的信息流（主要是照片），免费一键排版成电子书，通过100-200元客单价的纸质书获取高额利润，一年流水2000万左右。


    ## 做一个有作品的人


    节选自「卫夕」的主题


    做一个有作品的人。


    什么叫作品？就是它花费了大量心血能拿出来让人惊叹的东西，它可以是一个项目、一篇文章、一次演讲，作品的特点就是能让人啧啧称赞、有传播性的东西。


    这一点非常重要，很多人每天工作也非常努力，投入了大量精力，但由于过于分散，因此做出来很多平庸的东西，最终没有人记住你的产出。


    ## 跳跃性成长的门槛


    节选自「李晨」的主题


    努力不一定会成功，但是人们更愿意帮助努力的人，这是线性成长转变成跳跃性成长的门槛。我们不得不承认这个社会是有阶级性的，你的努力对你的能力成长是线性的，但是你的努力被别人欣赏，有人愿意拉你一把，那就是跳跃性成长。个人努力是安身立命的后盾，也是值得别人的信任和帮助的标签。在埋头苦干的时候，也要想尽办法让别人看到你的努力，去吸引别人帮助你完成跳跃性成长。


    ## 运营的本质是人流与留人


    节选自「杨涛」的主题


    运营的本质是什么：


    - 人流；

    - 留人。


    设计是核心竞争力，运营不是，但是好的设计是好的运营的手，是运营思维的延伸。


    ## 聚焦竞争度才能抓住机会和市场


    节选自「阿彪」的主题


