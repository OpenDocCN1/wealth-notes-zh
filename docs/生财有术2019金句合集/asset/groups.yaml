    慢慢地你会发现，业务的成功在中后期同领导者对于业务的理解关系已经不大，而是整个组织是否在领导者的有效管理之下前进。


    # 一切生意的赚钱公式


    > 节选自「V先生」的主题


    不管是个人品牌、还是内容创业、还是自媒体，说到底，只要你想靠它赚钱，那本质上就是一门生意。


    生意就要按生意的逻辑来考虑，不要被情怀给迷惑了。生意的底层逻辑是一个赚钱公式：销售额=流量x转化率x客单价x购买次数。


