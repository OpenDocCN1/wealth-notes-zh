    # 要长期做到持续正确的决策


    节选自「老吴」的主题


    一个企业、一个人最终能取得一些成绩，是一系列正确的决策。持续的正确决策，持续的做与想之间能力的增长是指数级的增长。所以，我们要保持敬畏之心，不断进歩，我们看到的不过是冰山一角。


    # 今天的数据对明天来说只是历史记录


    节选自「孙岩」的主题


    实际上造成产品滞销、生意萧条的原因只有一个，那就是现在的工作方法已经无法满足时代和消费者需求的变化。


    很多人误以为今天卖的好的产品，明天也会卖的好，于是会看前面的数据准备第二天甚至更长时间的库存。实际上，今天的数据对第二天而言只不过是历史记录罢了。


    # 最有效的学习是分享


    节选自「阿May」的主题


    绝大多数人加入大咖的圈子后，都是抱着学习的心态，静默观看，要不就是认为自己付费了，就可以不断地向群主索取，要不就是抱着过来打广告的心态。


    其实，最有效的学习是分享，最有效打广告的方式也是分享，最有效链接大咖的方式还是分享。


    # 提升认知，赚钱是迟早的


    节选自「明白」的主题


    我是相信爱情的，不对，我是相信个人力量的，一个人的认知提升后，赚钱是迟早的事。


    # 与用户建立沟通机制非常重要


    节选自「凯凯划」的主题


    和用户建立沟通机制非常重要，我做这个小工具的过程中就发现和用户的沟通简直就是宝藏，用户是和你站在一起的，会给你提建议，帮你解决问题。


    # 创业早期先考虑生存再考虑商业模式


    节选自「黑少爷」的主题


    创业公司的早期，简单、粗暴，快速，集中力量很重要，不规范不一定是坏事，先考虑生存，再考虑商业模式，只要业绩正向增长，有些问题并不影响企业生死。


    # 人到中年选择一个最熟悉的领域去干最重要


    节选自「胡光成」的主题


    人到中年不要试图去证明自己在所有领域都很优秀，选择一个自己最擅长，最熟悉的领域去干最重要。不足的地方一方面找人来弥补替代，一方面自己努力去补上，没有别的第三条路可选。


    # 越不以成交为目的越容易成交


    节选自「顾小北」的主题


    你所写的文章，一定要从用户的角度去出发，模拟用户看了你的文章，是一个什么样的感受。不要着急动作变形，你看现在的很多人，都意识到媒体的重要性，但是根本等不及，很多人动不动才写两篇文章都想变现，我觉得这是太急功近利了，我自己写文章都写了6年了，跑步都跑了10年了，所以我非常能沉得住气，如果一件事可行，可以花时间去慢慢沉淀。


    记住，越不以成交为目的的，到最后其实是越成交！


    # 有的时候赚钱也要看商务能力


    节选自「刘大猫」的主题


    有的时候赚钱要看商务能力，你的商务能力牛逼，即便网站没什么用户，也能赚钱，关键看如何讲，以及搞清楚买方的核心需求是什么。


    # 差异化是解药，也是毒药


    节选自「亦仁」的主题


    差异化是解药，也是毒药。


    差异化是很好的切入方式，避开厮杀的红海，找到非充分竞争的蓝海，开拓没人关注的细分市场，找到一些不同的痛点，做一些不同的产品，打一些新的品牌认知，吸引一批新的用户群体，做一个小而美，差异化是一剂良方，是解药。


    但是习惯了差异化竞争的人，习惯了小而美的利润空间，你会发现他永远在从0到1，永远在找新的细分市场，这样的差异化是毒药。


    # 怎样去运营一个账号？


    节选自「Wentao」的主题


    想要扎扎实实地成为一个大号，必须要先抖音之忧而忧。换位思考，如果你是抖音的运营，你的目标是什么？你需要鼓励什么行为来实现这个目标？


    # 没有项目就要找到一个项目


    节选自「乔里奥」的主题


    没有项目就赶紧找到一个项目，找到一个项目就去尽快跑通项目。别看自己不如别人懂得多，什么管理学、营销学各种很高级的学问。只要自己有办法有能力跑通项目就能赚到钱，这谁也拦不住，就算是目不识丁都不影响。


    # 赚钱要找到适合自己的方法


    节选自「阿彪」的主题


    很多东西在尝试之前，看到博客，看到别人赚钱怎么怎么厉害，非常兴奋。自己去干的时候，其实并不是那么美好。几天的功夫可能就证明，这个方法在这个方面可能不适合。


    所以，要尽快找到适合自己方向的方法，然后下猛药，火力全开。方法不要多，往往绝招就是那么一两个。关键的是尽快找到那个适合你自己方向的招数。


    # 成熟市场的“价值差”红利


    节选自「HK」的主题


    成熟市场，正在由“信息差”红利，转变成“价值差”的红利。因为产品同质化必然导致价格战，价格战想逃离就只能走差异化了，而且要“客户认可的差异化”。


    所以我们现在在做一款新的产品的时候（开模真正做产品这种），都要找一堆目标客户来问意见，哪要改，有什么不满意的。


    # 当所有人认为是风口时，跟风要谨慎


    节选自「aWangWangz」的主题


    当所有人都认为是风口的时候，并且媒体各大投资机构大肆宣传的时候，就是找接盘人的时候，跟风要慎重。


    增量市场，存量市场的用户策略不同。有些人适合从0到1，但不适合从1到100，反之亦然。这时候用人方面就得及时调整，不然会拖垮整个团队。


    # 不要看不起任何业务，微信祝福也能赚钱？


    节选自「钱钰」的主题


    一个成本很低很Low，你可能不屑去做但是非常赚钱的事：就是微信祝福。


    用互联网人不能接受的乡村审美来制作的表情包和公众号，满足中国上亿中老年人互相送祝福的刚需，以前一个号叫作“传统节日祝福”，曾经排进微信总榜第二，年收入你一定想不到。


    # 趋势是我们的朋友


    节选自「Jason」的主题


    越往上，越需要顶层资源、社会位阶、应对复杂环境的能力，且都是要牺牲许多东西作为交换的。


    趋势是我们的朋友。顶级的趋势叫时代，次级的趋势是周期，再下层趋势是企业的战略。三者共振是千载难逢的机会，时代向上但被向下的周期或基本面坏的公司耽误，则是最大的遗憾。和趋势做朋友需要眼光和运气，避免趋势下的遗憾需要理性和常识。


    # 人生就像转化率是一个不断优化的过程


    节选自「陈勇」的主题


    人生就像转化率，是个不断优化的过程。人生过得怎么样，就看你优化的频率和优化的幅度。


    # 选择产品要看稀缺性和长期性


    节选自「闫寒」的主题


    这句金带给我至今受益的认知是什么？


    选择产品，要么看稀缺性，要么看长期性。也就是说，要么就当时奇货可居，要么就可以很长久的赚钱，如果两样都没有的话，那么这个生意是不值得做的。


    # 做自己产品的用户


    节选自「Luxury」的主题


    当自己就是产品的用户时，她就是最强的产品经理，做什么对什么，不要问为什么，因为她懂她们。


    # 想做有巨大的鸿沟


    节选自「老昊」的主题


    想做有巨大的鸿沟。


    行动的人，他为决策所作的各种思考可能是你的10倍；他快速执行落地，付出努力可能是你的10倍；超出自己认知范围时，他翻阅的各种书籍可能是你的10倍；遭受外部质疑和自我否定时，他心理建设付出的心力可能是你的10倍。


    在想与做之间，你与厉害的人早有云泥之别。比起空想，持续的做法让能力指数级增长。


    # 赚钱主要靠运气


    节选自「子柳」的主题


    - 赚钱主要靠运气;

    - 200万以内闲钱买房子，200万以上买科技股，2000万以上只买蓝筹科技股；

    - 不要太相信自己的判断；

    - 不要找比你穷的人讨论；

    - 最重要的是永远不要加杠杆。


    # 早期社群一定要有一个强势的IP


    节选自「闫寒」的主题


    早期的社群，是基于大家对你的认同，所以早期社群一定要有一个强势的IP，例如叶文洁之于三体社群。而成熟期的社群是基于成员的相互认同，所以在成熟期之前一定要把成员相互之间通过线上和线下活动建立起来错综复杂的链接。


    # 成功是一系列正确决策执行的结果


    节选自「老昊」的主题


    有些人迷之自信，总认为别人成功的方法他都想到了，只是客观条件限制没去做而已。然而成功是一系列正确决策执行的结果。


    因为你的100个念头中，正好有一两个与人家的决策点重合，或者人家用的路径、方法与你在网上了解的信息一致，你就误以为自己是厉害的人，这种认知太可怕了。


    你只见了冰山一角，水下庞大部分不曾窥见一二。


    # 如何理解认筹？


    节选自「杨涛」的主题


    认筹，是一种参与感，再加上表现形式，认筹的人都等于公司股东。


    # 做活动要有仪式感


    节选自「V先生」的主题


    活动要起个响亮的名字，要分环节，要隆重。搞得有仪式感、参与感、获得感。


    这些形式是为了让成员对这件事有感知。人在日常生活中，经常糊里糊涂。告诉成员他在做什么、得到了什么，他更容易感知到：原来我在做这么一件事。同样的动作，命名和不命名、名字普通和令人印象深刻，参与者的感知都不同，对他的影响也不同。


    # 发财要趁早，成功要趁小


    节选自「寂寞火山」的主题


    发财要趁早，成功要趁小，思想觉悟得越早越好。


    # 互联网不变的就是变


    节选自「钱钰」的主题


    互联网不变的就是变，赚流量快钱的能人每个时代都有，但机会永远只属于突破规则、先知先觉的小部分人。对于其他90%的人来说，追随这种浮躁速成的心态会致命。


    # 学会复制，海外市场还有机会


    节选自「Jacky」的主题


    未来大部分还没有仔細了解过海外的朋友，可以考虑把国内优秀的玩法、优秀的运营带到国际市场，那里没有四巨头，没有那么多头破血流，或许能够给你更丰厚的回报。


    # 通过开放平台寻找创业场景和切入点


    节选自「亦仁」的主题


    通过开放平台提供的各种接口，逆向思维，反过来找创业业场景和切入点，可以发现很多新的机会。正常大家的思路是，在某一个具体的场景，要用到某一项技术，会去搜索看看有没有合适的开源或者开放服务，这样可以避免重复造轮子。


    然而，其实我们可以通过开放平台倒过来找场景和切入点。通过开放平台提供的服务，我们可以找到具体的场景，然后发现对应的竞品和需求，以及流量和盈利情况。


    # 赚钱的关键在于能不能帮助别人解决问题


    节选自「鱼丸出面」的主题


    赚不赚钱完全和你提供的服务或者产品的技术含量无关，而是你提供的服务是不是真的帮助一些人解决问题。


    比如WordPress博客的搭建，在任何程序员眼里，都是一件没有技术含量的事情，但并不妨碍主人公获得了900多个忠诚的付费用户，并且每个月可以带来近2万美元的收入。

    '
