    要有产品思维：把你的店铺当作产品来做，把自己当作用户，完整的体验从落地页到支付的全过程，看每个页面是否符合用户预期。优化每一个用户看到的页面，比如Facebook评论你有关注吗？有设置评论过滤吗？差评是很影响转化的。


    ## 赚钱需要找到“可复制的稀缺资源”


    > 节选自「子柳」的主题


    赚钱是一件庸俗但人人都喜欢的事情，几乎每个人都觉得赚钱很难。但渐渐的，我发现似乎有些人赚钱很轻松，他们在这项技能上面就如同武学里说的“打通了任督二脉”，在度过一个关卡之后，变得越来越轻松。


    那么这个关卡在哪里？我认为在于找到“可复制的稀缺资源”。你发现一块黄金，发达一时，你要是发现一座金矿，那是要上天了。


    ## 抖音带货不仅仅是追求ROI


    节选自「赵鑫」的主题


    很多品牌在讨论抖音带货这件事的时候，仅仅是看到了消费者购买这个行动，至于如何产生认知，如何勾起消费者兴趣，如何在消费者做深入研究的时候，更多的展现自己正面的东西，如何让消费者给出正反馈，这些提升转化率的事情统统不管。


    根本没有搞清楚营销推广的核心，也没看到整个销售过程的全貌，盲目在追求ROI。


    ## 每月躺赚35000美元的教学反馈小工具


    节选自「鱼丸出面」的主题


    利用下班后和周末的时间，他男友花了1个多月开发出了这个产品，起名叫Feedback Panda，可以集成到VIPKID教学系统里，鼠标点一下，就能把之前用过的评语模板，插入到当前学生评价体系里，原本5分钟的工作量，现在只需1秒钟就完成了，这给她腾出了非常多的时间。经过一年时间的运营，最终这个工具也让他男友每个月赚到35000美元的收入。


    ## 做社群只想赚钱方向就歪了


    > 节选自「夏木炯」的主题


    做社群的目的可以是赚钱，但如果只是赚钱，方向就歪了。


    社群本质还是一群同频的人圈在一起交流学习，顺便产生链接，千万不要忘了初衷。


    ## 能够火的内容全平台都适用


    > 节选自「杨涛」的主题


    在其他平台火过的内容，在一个新平台肯定能再火一遍，本质上是一样的，人性！


    表现形式的不同而已，优质内容都有通性。


    ## 什么是批量思维？


    节选自「顾小北」的主题


    人眼光的敏锐度，思考的角度非常重要，要去敏锐的思考事物之间的联系。看准一个东西，能赚钱的，不要守着一棵树，该批量的批量，该扩大规模的一定要扩大规模。


    这就是批量思维！


    ## 赚钱需要留出足够的安全边际


    节选自「Scalers」的主题


    我们要留出足够的安全边际，来面对赚钱中的波动情况。


    在进行产品交付的时候，如果收10万块钱，一定要留足足够的安全边际，例如按照30万甚至100万的规模和格局来做规划。


    剩下冗余就是安全边际，是后续增长+A1空间，也是口碑生长传播的土壤，这样能够抵抗风险，也留足了增长复利空间。


    ## 保持专注，机会越多不代表越好


    > 节选自「Jack」的主题


    做SEO遇到瓶颈了，发现有人做付费流量觉得不错，做SEO太慢了，付费流量多好呀！广告设置好第二天就可以看到效果。


    做跨境电商，发现Affiliate不错，还不处理发货问题，做Affiliate去了。


    做传统行业太压抑了，没啥前景，互联网行业自由发展快，我要做互联网行业。


    做了之后才发现到处是坑，想找一个没坑赚钱容易的，直到一事无成。机会越多不代表越好，最难的是保持专注。


    ## 技术不是赚钱的核心竞争力


    节选自「stormzhang」的主题


    技术人懂点产品是好事，但不意味着以后职场你有更多的选择，关键在一些思维上的变化，你看待问题的方式会更全面，考虑事情会从全局出发，不被细节所束缚。中小创业公司不该把技术作为核心竞争力，而重视产品，找到市场需求，从赚点小钱开始，才最靠谱。


    ## 不需要抓住所有红利，一两个小势就能够了


    节选自「戴宏民」的主题


    我们经常需要权衡是应该把握红利还是应该坚持专注，是应该不给自己设限还是应该了解自己的能力边界。


    其实也不用奢望抓住所有红利，抓住一两个小势应该就能活的很好了，把握住一个大势可能就飞起来了。


    ## 知乎用户喜欢看的内容？


    > 节选自「潇潇」的主题


    很多人嘴上说不要，身体很诚实，知乎用户也一样对美女帅哥，段子抖机灵，情感故事，高薪，内幕八卦等，会忍不住点赞收藏，不信你翻翻热榜问题的高赞就知道了。


    ## 一个人的“审美”能力决定他做事的水平


    > 节选自「亦仁」的主题


    一个人的“审美”能力决定他做事的水平。


    这里的“审美”指广义的“审美”：他所见过好的、高水平的、厉害的人或事。


    ## 关于农产品的社群思路


    > 节选自「七」的主题


    目前正在盈利的农产品社群思路：成立一个全国土特产联盟，入会需要交会员费。交了会员费，他们在朋友圈去展示这些土特产品，实地试吃加直播加朋友圈，帮助地头的合作社曝光产品，即一头对接商家，一头对接消费者，淘宝的平台模式，利用朋友圈出货并且对接其他销售渠道。


    ## 狂刷存在感 ≠ 提升品牌知名度


    > 节选自「张天天」的主题


    狂刷存在感 ≠ 提升品牌知名度


    ## 什么时候去寻找增长方法？


    > 节选自「明白」的主题


    什么时候去寻找增长方法？答案是无时不刻。


    但每个时期重点也不一样，寻找增长方法除了冷启动外，最好是在自己业务属于上升或者稳固期，复合增长率平稳时候开始。


    千万不要等到增长下滑再去找，因为那会很容易心迷意乱，病急乱投医。


    ## 赚钱也需要胆识


    节选自「郑加祥」的主题


    2017年圣诞节前后，虚拟货币行情火爆，韩国交易市场Bitthumb比国内溢价超过20%。


    在国内交易市场用人民币买入虚拟货币，转账到韩国交易所卖出，换成韩国货币后，再通过当面的个人转账换成人民币。在进行了小金额测试验证后，我飞到韩国进行了半个月左右。那段时间大概赚到了50万，当然过程中也有很多问题，现在回想起来，当时胆子真不小。


