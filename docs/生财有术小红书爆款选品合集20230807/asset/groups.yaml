    # # (精华帖)(191赞)新手在小红书上做水果团购项目，半年利润近10W，我是如何从0到1的？


    作者：  许老师


    日期：2022-07-27


    多听盗坤老师言，新手也能赚到钱。


    这个项目缘起是盗坤老师去年11月份在生财里提到的一个蓝海项目 ----批发市场水果团购项目，链接： [https://articles.zsxq.com/id_rspd0llrfz4mp.html](https://articles.zsxq.com/id_rspd0llrfz4mp.html)，这个项目0投入，易模仿，很适合我这种之前还没从工作之外赚到钱的新手。


