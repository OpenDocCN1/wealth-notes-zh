    60%不能出单，测试10笔左右就放弃了。


    40%能出单但不一定赚钱，其中又8%盈亏平衡，其中又1%的能赚钱。真好像一堆沙子里面挑金子。


    以半年时间我们一共发过的2550款商品为例：出过单的为1036款，210款盈亏平衡，30款可以赚钱。


    而这30款商品才是我们最后终于需要关注的。有的款一个月能达到1万多的佣金、有的7000、有的1000、2000元。'
