    \ 商家门槛：清源4分 商多门槛：小于等于近30天差评价\n活动时间：2023-01-16 00:00:00 至 2023-02-15 00:00:00\n\
    \n注：小红书新店铺本身就有4.5分的店铺分能直接参加活动\n\n3. 喜条曝光\n\n通过参与新店成长任务来获得商品流量卡，获得之后可直接用于薯条的营销推广投放\n\
