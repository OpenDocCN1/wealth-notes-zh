    ## 【调整阶段】


    但确实当时手上也没有什么其他项目，同时这个项目还没整明白，如果放弃了下次再搞其他项目，还是会碰到波折，总不能每次都浅尝辄止。


    所以过年期间痛定思痛，开始想着怎么调整。


    主要问题就2个，一端是后端的供应链，我们还没搞好，供应商资源太少，品类太单一；另一端是流量端，需要持续地，有更多新流量进来。


    货源方面，我们仔细研究了其他同行的快团团链接，然后根据他们上架的品“反编译”，去批发市场对应的找供货商，既然同行上了这个品，证明提供这个/些品的商家对社群/社区团购的这种模式是比较认可的，想通了这个我们找货源就比较有的放矢了，不再是无头苍蝇，一家家问有什么货，价格多少；而是拿着这个货去找到对应的商家，然后问她怎么供货。


    打交道的过程中我发现有个小窍门能避免被当成散客，我去了会直接问老板“有没有快团团链接”，一般听懂这句话的老板就知道你是团长，直接拉群用链接看货，订货也是快团下单。


    如果没有链接但是供货，就让老板拉入群。这相当于一句暗号，让老板知道你是拿货的而不是散客来问价，省了很多口舌。


    就这样，经过一个月密集的跑，我们把货源整得差不多了，基本上同行有的我们也都 有。当然，这里面有一些供货商比较坑，后面再说怎么说避坑。


    ![](img/833edac43fd3eb96b57b7624b0e071d2_223_0.png)


    ![](img/833edac43fd3eb96b57b7624b0e071d2_223_1.png)


    另一端就是流量，前面说到我们的坑就是引流的时候被小红书关禁闭，所以不能再私信了，一定要在主页上放联系方式。


    后面我采用了置顶笔记放微信号的方式（这种方式从1月份用到了6月份），中间有几次被关7天禁闭但影响不大，但前段时间这篇置顶帖子被小红书判定违规被隐藏了。


    所以小红书要引流私域，怎么有更安全可靠的办法，我还在探索，这次参加了小红书航海，里面提到了 11 种方法，我还会再尝试，但这个注定是在和小红书平台打游击，方法需要常换常新。


    川 · 乐新发地批发市场给大家团购优质水果 同城快递送到家


    ![](img/833edac43fd3eb96b57b7624b0e071d2_225_0.png)


    蓝莓砂糖橘阿克苏苹果麒麟瓜等等等


    引流的方式稍微安全点了，剩下的就是怎么发帖搞到更多流量了，这里我感觉自己没发过质量太高的笔记，都是简单直接粗暴，告诉大家我从新发地给大家团水果，后面的帖子最多的时候1万多的小眼睛，几百个互动，陆陆续续发了十几篇帖子，总体浏览量加起来可能在5万左右，引流了1500个新流量到私域，不过就是这2000个的私域流量，由于我们定价还比较实在，售后也比较靠谱，所以复购还可以，营业额逐渐上升，5月份做了16万的营业额。


    所以小红书的流量一来很精准，都是冲着买水果来的，另一方面消费能力确实很不错。


