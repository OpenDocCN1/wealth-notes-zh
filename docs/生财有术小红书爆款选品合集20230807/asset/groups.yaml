    ![](img/833edac43fd3eb96b57b7624b0e071d2_373_0.png)


    相反，在抖音，赵雅芝直播间最新一场直播的客单价仅**15.44**元；柴碧云直播间客单价为**94.97**元；贾乃亮最近一场直播带货客单价也仅为**124.35**元。


    小红书走了一条区别于淘宝、抖音、快手的路线，它选择了中高端品牌和高客单价的商品。这也是为什么小红书很多产品能够溢价的原因，对数字敏感的朋友应该也知道，如果可以溢价，那么在小红书做电商利润肯定不会差，甚至可能会高于传统的电商平台。


    # 2.小书书的消费人群画像分析以及平台优势有哪些？


    无论是董洁，还是章小蕙，在选品的人群定位上与平台用户群体的消费调性是符合的。小红书平台月活用户**2.6**亿，其中**50%**都在一、二线城市，**90**后占比**70%**，女性占比**7**成。这部分人群消费更理性，但更看重生活品质，是**中高端消费的重要力量**。因此，在**2023**年，小红书无论是直播带货还是笔记带货都具有极高的增长势头。'
  - '[PAGE 374]


    而且小红书的用户群体主要是年轻女性，其中大部分集中在年龄段为18到35岁之间，其中以20到30岁的年轻女性为主，这个年龄段的女性消费者通常具有较高的消费能力和消费意愿，她们关注时尚、美妆、生活方式等领域的内容，并喜欢分享自己的时尚穿搭和美妆技巧等。


    此外，小红书的用户群体也对生活方式和旅行感兴趣。他们关注健康、健身、美食、旅行等领域的内容，喜欢了解各种生活方式的分享和体验，追求高品质的生活。


    这类数据分析，对于想要开店卖货的商家来讲，无疑是极佳的选品思路推荐。鉴于这类人群特殊，所以我们实测并且推荐的热门选品类目有：饰品，防晒类，水果，家居日用品，厨房好物，宠物用品，零食，美妆护肤，女性用品（内衣，内裤，丝袜这些），女装，各类花茶养生茶类等。


    目前的小红书其实就相当于两年前的抖音小店，但是在用户属性方便又比抖店更加精准高效。一方面，小红书的用户是优质的消费人群，本身就是种草平台，而另一方面，今年被称为小红书电商元年，以前小红书电商门槛很高，而现在0粉丝就能开店，最低1000元保证金，并且只需一张身份证就能开店了。


    对于之前没有经验的朋友，建议详细看一下下这篇文章项目拆解的文章，因为我会全面的把这个项目实操流程，完整的给你拆解一遍。


    所谓的无货源，其实本质上就是低买高卖+一件代发的模式。简言之就是客户通过小红书下单，然后我们去找一件代发的平台，让他直接给客户发货，赚取中间的差价。说白了，就是一个流量信息差的电商玩法。


    再加上小红书本身是一个兴趣电商的平台，只要你的笔记流量可以，那么带货的效果也不会差。接下来一步步的给你拆解一下，小红书无货源电商，应该怎么操作。'
