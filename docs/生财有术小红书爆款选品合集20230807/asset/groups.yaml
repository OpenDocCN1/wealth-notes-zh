    \n**作者：** 书豪\n**日期：** 2023-07-07\n\n各位朋友好，我是在杭州的圈友书豪，一个连续创业四年的 95 后，目前连续四年都年入百万。\n\
    \n前面的文章分享了我们关于小红书无货源电商低价百货的选品方法，今天我们来说说我们自己的店铺关于女装的选品方法。\n\n其实女装选品的**本质也是跟款**，只不过对标的平台变了。\n\
    \n**低价百货是在小红书上找粉丝两百以下，近七天带货笔记点赞100以上，带货商品销量100以上的品去跟。**\n\n而女装我们基本上不在小红书上找对标商品，而是在淘宝上找对标商品，原则是每天去关注淘宝天猫排名前五十的规模较大的女装店铺，他们的新品销量超过500单的品。（进入店铺后，不要直接选择【新品】，要选择【全部】栏目下方的【新品】，就可以查看销量了）\n\
    \n当然，通过之前的低粉爆文法在小红书上找到的女装，我们也是可以去跟的。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_455_0.png)\n\
    \n为什么要这样选品呢？\n\n## 一、选品能力\n\n你要相信，这些女装店铺，他能够在淘宝做到头部腰部，他们的选品能力肯定是比一般卖家，比一般人要好不少的，特别是对于我们这种大部分员工是男性的团队来说，他们是一个非常非常值得借鉴跟款的方向。\n\
    \n所以可以借助淘宝天猫的选品能力，在搜索关键词后，按照销量排名，关注前30家50家左右的店铺，然后每天去看这些店铺的新品情况，一般来说新品都是他们的主推款，而且可能一个新品昨天刚上没流量没销量，但是明天一看已经爆单了，因此需要每天都去关注这些店铺又上了什么新品，最近的新品销量如何。\n\
    \n当然，如果你有精力，也可以去关注那些腰部的卖家，把50家店铺扩大到100家，都是没问题的。不要被一些条条框框束缚住，我们的方法可以是一个方向，具体实践时依照自己的情况去进行就可以。\n\
    \n## 二、选品素材\n\n做无货源女装最头疼的就是**视频混剪素材问题**。\n\n一般来说，在小红书上有爆款潜力的百货商品，在淘宝/抖音都是已经爆过的，所以混剪素材资源丰富，有利于我们去批量制作带货视频。\n\
    \n但是女装由于成本、模特、拍摄等原因，它的**视频素材是十分有限的**。这时我们如果通过小红书平台去选品的话，很可能跟其他博主撞素材，影响流量就不划算了。\n\
    \n那么通过淘宝天猫选品可以在一定程度上解决这个问题。\n\n大部分女装店铺（非批发）在全网，都会选择在淘宝上上新品，然后再在其他平台分发，所以淘宝天猫上的女装新品的视频，一般都是最新的，甚至在抖音上都是找不到的，所以这种视频素材，我们做做去重，就能拿来直接用了，省时省力。\n\
    \n也可以扒商品主图和买家秀的图片去做**图文笔记**，百货很多需要通过视频去展示商品的功能性，但是女装可以通过图片去展示产品，不过做图文笔记一定要做二次原创，不能直接搬运图片！\n\
    \n## 三、爆款潜力\n\n通过这种选品方式，很容易发现潜力大爆款，前面说过淘宝天猫的新品，除了一些在小红书上也有旗舰店的店铺，基本上是在小红书都是没有上过的，那么**当你第一个上这个品，第一个用新品的素材时，极大可能会大爆特爆**。\n\
    \n但是需要明白的一点是，会不会爆单是**概率问题**，淘宝上的爆品，小红书不一定爆，也要做好心理准备。\n\n我们之前就通过这个方法，在春夏换季的时候找到一个爆款，就因为第一个在小红书上发了这个品，几天就爆单了，所以一定要找**30家**\
    \ **50家**店铺，去每天看它的新品内容，看最近几天新品的销量情况，都是潜在的大爆款。\n\n有一个可以比较简单地看这个品是否合适的方法，就是**看用户评价**，一件品销量大几百几千，结果评价寥寥无几，或者都是一些默认好评，那么极大可能这个品是刷单的，这种需不需要上品到小红书，就看你自己了。\n\
    \n我建议是能上就上，就算这个品不爆，也没什么大不了，就当测品了，换个品接着发，接着测就行。\n\n## 四、大词长尾\n\n虽然女装是个大类目，但如果我们一直只搜索【连衣裙】这种大词，会发现按销量排名后，基本上前十名的商品都是不变的，这样对我们选品的局限性就大了，无法找到一些新的店铺去看品测品。\n\
    \n因此我们需要用大词长尾的搜索方法去找到**源源不断的店铺** 供我们选品测品。\n\n什么是大词长尾呢？跟大家解释一下，比如说连衣裙这个品，连衣裙就是个大词，那么这时候我们搭配一个【夏季】，这就是一个长尾词。\n\
    \n长尾词可以自行更换的，比如【连衣裙 瘦身】、【连衣裙 沙滩】等等都可以，稍微换一个长尾词，搜索的关键词不一样，出来的结果也会不同，然后我们再根据销量排名去找店铺，这样我们可以选择关注的店铺也就丰富了起来。\n\
    \n然后就按前面的方法，点进商品店铺去看新品，销量不错的我们就可以发到小红书上测一下，销量不行的我们就换一家。\n\n做个总结，做小红书无货源女装，可以通过淘宝天猫去搜索对应的女装类目，按照销量进行排名，选择前30家/50家/100家的店铺，每天关注这些店铺的上新情况，和最近新品的销量情况，如果有销量超过500单的，马上跟款。\n\
    \n以上方法，把淘宝天猫换成拼多多/抖音精选联盟也同样适用，选择几家店铺，销量超过多少依自己情况而定。希望能大家能有帮助。\n\n以上，一起生财有术！欢迎各位圈友前来交流，微信\
