    # 叙利亚战火十年，我在叙利亚创业的这五年


    我是董佳。


    中国人，职场20余年。


    叙利亚总理曾玩笑的说要给我也发叙利亚国籍。


    从一块叙利亚古皂开始，而今闯荡叙利亚第五个年头，现在负责叙利亚国家馆，致力于在中国推广叙利亚贸易、文化、旅游等等，把最真实的叙利亚展现给大家。


    在小红书，我希望能够展示并带你一起了解这个经历战乱、制裁、重建，千疮百孔但仍坚强、乐观、善良、美丽的真实的叙利亚。


    为什么说点什么...


    # 为什么要做叙利亚的产品？


    老实说，在许多人看来这可能并不是一个好主意。身边每个人听我说到叙利亚，第一反应都是充满疑惑和畏惧，一个女人跑到男性占绝对地位的中东国家，冒着战火，还要做生意，大部分朋友都觉得不可思议，觉得我脑子不太正常。


    职场二十年，当经历了这么多起起伏伏，人情冷暖，钱不再衡量应该做什么事业的唯一标准了。面对叙利亚这样一个国家，就那么一瞬间触动我，让我决定要为叙利亚做点什么。


    于是，2016年，从跟当地工厂合作进口古皂开始，正式开启了叙利亚贸易之旅。而今，我们已经成为叙利亚个人消费品在中国最大的也是唯一正规化运营的公司，成为叙利亚政府唯一授权的叙利亚国家馆。


    我们把叙利亚手工艺人制作的产品带进了中国，因为我们的订单量比较大，许多叙利亚的工厂并没有受到疫情和制裁的双重影响，工人们保证了工作，他们的家人也没有因此流落街头，能每天按时吃上饱饭，有衣服穿了。


    感谢大家，感谢你们的支持和认可。中叙贸易中还有很多困难和问题，但我相信一定会越来越好。希望在小红书，我们一起分享在叙利亚的点点滴滴。


    真实体验型：我的笔记就是这种类型。


    一开始写得比较硬广，后面做了优化调整，模仿常见的探店笔记写了一篇置顶到主页，直接放了门店地址都没被系统判导流违规。如果你也有店，可以试试这种伪探店口吻；如果没有也可以模仿下素人体验口吻，有时候系统还真识别不出来你在打广告，非常好用。


