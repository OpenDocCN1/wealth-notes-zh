    # （5）文案


    小红书的文案其实并不是特别的重要，不需要特别华丽的表达


    只需要清楚的表达出自己的观点即可；跟写作文一样，我会先列出要写的文章的主题，分成哪几个部分写，想要表达什么样的思想'
  md: "\n## 1. 找准定位\n\n如果你已经有自己的产品和服务，可以直接跳过定位部分，从确定内容方向开始看。\n\n如果你没有自己产品、货源，或者你刚刚接触小红书，还在迷茫中，可以跟着步骤一步步来。\n\
    \n定位是在整个操作过程中，最重要的一环。\n\n就像做电商，选品永远是最重要的，选到一个好产品，就算是普通的运营也能做起来，在小红书也是一样的逻辑。\n\n\
    定位也就是解决我们“做什么”的问题，归根结底就是确定出一个变现模式。\n\n作为个体，我们拥有的技能、或者是熟悉的代理的产品都可以作为我们的变现模式。\n\n\
    - 我的 PPT 做得不错，通过帮助别人做 PPT 设计变现，就是一项技能变现。我前几次创业的项目也是围绕着 PPT 设计。\n- 我的舍友会写歌作曲编曲，通过帮助别人写歌变现，就是一项技能变现。这也是我们目前在小红书做的其中一个矩阵号。\n\
    \n### 培训编曲账号\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_260_0.png)\n\n比如我是留学生，那帮助其他人申请写文书、或者辅导英语等都可以是一项技能变现；比如我是律师，帮助当事人做咨询，也是一项技能变现。\n\
    \n### 案例账号\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_261_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_261_1.png)\n\
    \n那肯定有人会说，我感觉啥也不会该怎么办。那我建议你尝试去代理一种你熟悉的产品。\n\n比如说，小红书有很多卖茶花的，基本都是代理商；比如可以做小程序建站，可以找商家拿案例，你帮助推广；比如你熟悉的日常用的产品，都可以直接进行带货。\n\
    \n只要事先与商家谈好分销比例，基本很多商家都会同意你帮忙做分销的，这是一件双赢的事情。\n\n### 寻找合作\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_262_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_262_1.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_263_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_263_1.png)\n\n如果你本身就是一个商家，那就更简单了，直接把你的产品服务搬到线上来，让线上也成为你获客的渠道之一。\n\
    \n可是我们如何辨别，这个产品或服务在小红书是有没有市场的呢？\n\n我们不能看到做的人少，就认为这是一片蓝海，可以吃掉整个市场。因为你的这个产品可能就是一片死海，根本不适合小红书。\n\
    \n### 甄别市场\n\n我一般是 Through 这个方法辨别的。\n\n1. 通过千瓜等数据平台，查看关键词搜索量。首先挖掘出你的产品/服务的三个左右关键词，在数据平台或者是小红书的下拉词，查看热度。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_264_0.png)\n\n2. 通过查找同行账号，去分析市场。一般来说，就算是再细分的市场都是会有人比你先发现的，如果有\
    \ 3 个以上的账号连续更新超过了一年，那这个市场基本上是没问题的。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_265_0.png)\n\
    \n为什么呢？我们可以换位思考一下，如果你连续更新 1 个月，完全看不到一个愿意为你付费的粉丝，你还会继续坚持吗？如果你的同行连续更新几年了，一分钱都不赚，那他是打算做慈善吗？\n\
    \n我们确定好定位之后，就要去制作笔记，吸引精准粉丝啦！\n\n## 2. 确定内容方向\n\n很多人都陷入了一个误区，浏览越多就说明做得越好。\n\n这句话看似没问题，但也不完全对，特别是在小红书企业号\
    \ IP 领域。\n\n我写过很多 10 万+的爆文，但是一分钱都没有看到；我也写过很多只有两三百浏览的文章，但是每篇笔记都有几位粉丝咨询，最终有一半的人下了单，而我做的业务客单价都在\
    \ 5000+。\n\n所以能持续写出可以吸引强需求粉丝的笔记，十分重要。\n\n那我们如何把握好笔记内容方向呢？\n\n> （1）如果你是做知识付费业务（比如咨询、教学），那我建议你可以主发干货、配合发部分案例。\n\
    \n比如这位做唱歌教学的主播，干货笔记、案例笔记均有涉及。\n\n### 唱歌教学案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_267_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_268_0.png)\n\n比如这位做法律咨询的博主，干货笔记、案例笔记同样均有涉及。\n\
    \n### 法律咨询案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_269_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_270_0.png)\n\
    \n比如这位做运营咨询的博主，大部分发干货笔记、其他的都是自家的广告。\n\n### 引流运营案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_271_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_272_0.png)\n\n> （2）如果你是做带货业务的（含技能服务、卖实体物品），那我建议你直接发案例。\n\
    \n比如这位做小程序的博主，全部笔记都是自家小程序展示。\n\n### 小程序案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_273_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_274_0.png)\n\n比如这位设计师的博主，大部分笔记都是自家小程序展示，每十条笔记中只有一条干货笔记。\n\
    \n### 设计 IP 案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_275_0.png)\n\n- 恶搞小怪咖\
    \ IP 形象设计\n- 国潮风—红楼梦 IP 形象设计\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_275_1.png)\n\
    \n- 原创设计 | 新国潮茶品品牌会形象设计\n- 品牌文案 | 打造品牌 IP 的重要性\n\n- 干货笔记\n- 案例笔记\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_276_0.png)\n\
    \n- 干货笔记\n- 案例笔记\n\n比如这位养生博主，大部分笔记也都是产品展示，每四条笔记中只有一条干货笔记。\n\n### 养生茶案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_277_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_277_1.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_277_2.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_278_0.png)\n\n当然，这只是我建议的大方向，具体类目可能会有细微差别。\n\
    \n### （3）做视频还是图文\n\n在企业号 IP 领域，我个人更倾向于前期做图文。\n\n小红书本质上是图文平台，评论的权重占比更高，而图文用户更容易产生互动。\n\
    \n不可否认的是平台对视频内容有一定的倾斜，我做的第一篇视频就小爆了，总共 5000+的互动，但是我发现我们生产出一条视频需要一整天。\n\n而同样的时间做图文，可以产出\
    \ 10 余条，所以新手建议先做图文账号。\n\n目前我的图文账号团队已经稳定了下来，每天都在输出原创内容，所以我又找了一个表演天赋比较强的伙伴，让他把我们的图文账号里面的干货内容“口播”出来。\n\
    \n他就看着提词器，生动形象地把内容读出来，这种视频一天可以拍出十几条，然后再发到另外几个账号上，在我看来这也是性价比很高的一种内容输出方式。\n\n也有很多口播大神，靠着精湛的表演能力，引流都做得不错。\n\
    \n而且口播类视频可以同步快手、抖音、小红书、视频号等几个平台，单条视频的价值还是很高的，以下是我认为做得比较好的几个同行~\n\n### 口播案例\n\n\
    ![](img/833edac43fd3eb96b57b7624b0e071d2_280_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_280_1.png)\n\
    \n现在我们知道发什么笔记了，确定了内容的大方向之后，那如何快速批量生成优质内容呢？\n\n## 3. 批量生产内容\n\n**（1）寻找对标博主：**\n\
    \n首先，在确定好了定位之后，我们就要去寻找对标博主，看看有没有同行做得好的地方可以借鉴。\n\n有了 10-20 个对标账号后，我们就可以拆解、模仿、然后再创新。\n\
    \n建议新手前期都可以参考对标账号的内容选题和输出，自己进行修改优化即可，因为新手选题容易“跑偏”，等有了一定的经验后再自己去创新也不迟！\n\n寻找对标博主我一般用这三种办法：\n\
    \n### ① 搜索关键词\n\n比如我是做音乐制作的，我会把客户可能搜索用得到的词汇汇总出来。比如：作词、作曲、编曲、音乐制作、混音、修音等等。\n\n\
    在搜索栏进行搜索之后，然后点进主页进行筛选。只要目标账号每周坚持更新、评论区经常有精准粉丝询问、笔记数据稳定偶尔几篇小爆款，就可以成为我们的对标账号。\n\n\
    ![](img/833edac43fd3eb96b57b7624b0e071d2_282_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_282_1.png)\n\
    \n### ② 在频道里，找到对应类目\n\n这是一个很多人都会忽略的好方法！\n\n首先你要平时就多搜索你对应领域的内容，假设你是做澳洲留学服务的，平时经常刷澳洲留学的笔记。\n\
    \n那么你在“学习”频道里，发现页刷出来的笔记都十分精准！全都是有关于澳洲留学的。\n\n如果是新号尝试用这种方式找对标博主的话，可能就会出现不精准的现象。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_283_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_283_1.png)\n\
    \n### ③ 坚持记录，遇到好的博主就关注\n\n平时我们刷小红书的时候，在发现页经常会刷到优秀同行的博主/笔记，我们不妨点个关注、收藏，下次就可以直接找到啦。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_284_0.png)\n\n**（2）选题：**\n\n选题就是笔记的“灵魂”。\n\
    \n一篇文章能不能成为爆款，取决于我们的选题。同样的，一个人有没有持续做出爆款的能力，也取决于能不能持续找到优秀的选题。\n\n我们在选题的时候，千万不能“自嗨”！要根据数据去分析锁定用户感兴趣的内容。\n\
    \n我们团队是固定每周日前，每个人需要提交最近刷到的 5 个新选题，然后我再从选题里挑选出比较好的，完善进我们的选题库，我们负责内容制作的小伙伴就会从选题库里面制作选题。\n\
    \n我们团队一般是用以下两种方法进行选题。\n\n### ① 从对标博主挖掘\n\n刚刚有讲到如何寻找对标博主，在确定好 10-20 个对标博主后，就可以对他们的笔记进行分析，把数据从高到低排列。\n\
    \n优先做数据高的选题！坚持做小红书一段时间后，你刷到的每一篇笔记，你都可以看到它有没有爆的潜力。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_286_0.png)\n\
    \n### ② 从热门笔记挖掘\n\n在选题之前，不妨我们把自已代入为用户，从需求、人群、问题场景等方面去挖掘用户需要什么。\n\n然后列出用户可能会搜索的关键词，具体方法和上文提到的：寻找对标博主中的关键词搜索法是一样的。\n\
    \n这些选题都是经过用户和平台的验证，都是爆过的笔记，他们的选题会非常有参考价值。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_287_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_287_1.png)\n\n**（3）首图：**\n\n在小红书内容创作中，首图极其极其重要，因为小红书是一个信息流平台，首先映入眼帘的是一张张的首图，用户看到吸睛的首图，才会有点进去的冲动。\n\
    \n只有点进去了，才可能会有接下来的点赞收藏评论等互动，进而产生爆款。\n\n而我们做企业号引流，要的是制作速度够快，同时图片质量也要高。这好像是一个伪命题，不过我给你分享我们团队的做法，做到速度快的同时质量相对比较高。\n\
    \n首先需要明确小红书首图尺寸，小红书建议首图都用 3:4 的比例，在主页展示的面积比其他比例都大。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_288_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_289_0.png)\n\n第一步：在 20 个对标博主中，搜集出几个爆款封面，并进行改善模仿。\n\
    \n第二步：因为我 PPT 用的比较多，所以我们团队的固定模版都是用 PPT 制作的，我们把爆款首图拉进去 PPT 里面。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_290_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_290_1.png)\n\n元素：6 张底图 + 两行字，几乎 1:1\
    \ 模仿后再添加自己的特色。\n\n根据对标的图片，打好版式确定自己的风格，以后每一次制作笔记首图，就只需要更改里面的“文字”和“图片底图”，一个新的封面就出来了。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_291_0.png)\n\n以**编曲**类目示例：\n\n每次只需要更改\
    \ 6 张底图，然后修改文字就可以了，制作过程不到一分钟！！！\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_292_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_293_0.png)\n\n因为我所在的类目比较小众，同行做得比较普通。所以图文首图我会参考成长类目的账号，视频封面我会参考美妆类目的账号，适当的跨类目参考也是可以的。\n\
    \n如果你实在不想自己设计，可以去稿定设计等网站去找小红书配图，再进行修改，或者请专业的设计师给你打好版式，以后每次制作就只需要更改文字和底图。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_294_0.png)\n\
    \n掌握好这个方法，以后每张首图 30 秒就可以搞定。\n\n**（4）标题**\n\n最开始写小红书的时候，我也不会写标题，直到有一天想起作为一个资源学渣，每次写英语作文都要依靠模板。\n\
    \n比如提前背通好推荐信模板，每次遇到类似写作内容，就把提前背好的句子稍微修改下，然后往上写。\n\n而我们写标题也可以找出万能公式，然后往里套！举几个例子：\n\
    \n公式 1: ①文XXXX\n- 留学: ①文看懂英国学校段位, 别把青铜当王者!\n- 运营: ①文教会你详细拆解10W+书评\n\n公式 2: XX个万能XXX!\
    \ 手残党福音! 新手抄作业!\n- 运营: 99个万能标题! 手残党福音! 新手抄作业!\n- 留学: 被牛津大学秒录的文书原来这样写! 手残党福音, 新手抄作业!\n\
    \n公式 3: 人人都能学! 带你深扒XXX的小心机\n- 运营: 人人都能学! 带你深扒一秒提升首图点击率的小心机\n- 留学: 人人都能学! 带你深扒被牛津大学秒录文书的小心机\n\
    \n如何找到这些公式呢?\n\n1. 知识星球【谢无敌的红书宝】\n   在星球的标题文案库里，有无敌姐整理的 300+标题模板，全类目通用！\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_296_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_296_1.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_296_2.png)\n\
    \n2. 小红书搜索万能标题\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_297_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_297_1.png)\n\
    \n再根据万能标题，整理建立属于自己的标题库。\n\n| 编号 | 标题 | 举例 |\n|---|---|---|\n| 1 | 标题 | 拯救学弟，一本如何拉分加计学硕士上岸啦！\
    \ |\n| 2 | 如何逆袭、代过 | 如何逆袭，代过如何全过？ |\n| 3 | 不能不行 | 不能不行，hks 不能走法人大考 XXX 了个硕士 |\n\
    | 4 | 快本 | 快本，一本 XX 过法日加计学硕士上岸啦！ |\n| 5 | 直接野放 | 直接野放在职读研的硕士 |\n| 6 | 逆袭 | 逆袭，XXX\
    \ 军校 |\n| 7 | 你们都能成功硕士 | 你一定能成功硕士，XXX 军校 |\n| 8 | 我已双非成了 | 我已双非成了，半路出家成功读研的硕士\
    \ |\n| 9 | 野读题 | 野读题 |\n| 10 | 半路它 | 野读题半路它 |\n| 11 | 我死后悔 | 我不后悔，就是去 XXX 读了 |\n\
    | 12 | 天就我全后悔 | 天就我全后悔，人人都是优等生 |\n| 13 | 不如读过的 | 不如读过的，XXX 硕士 |\n| 14 | 阅读学 |\
    \ 阅读学，XXX 硕士 |\n| 15 | 大家都说 XXX 完了 | 大家都说 XXX 完了，人人都是 XXX |\n| 16 | 的学 | 学在的学\
    \ |\n| 17 | 在自的 | 在自的个 X，xxxx |\n| 18 | 优打不新 | 优打不新，XXX 野校 |\n| 19 | 横题打开 | 横题打开，野门也考学硕内理\
    \ |\n| 20 | 简单话顶以过去 | 硕士最简单可以过去 |\n| 21 | 标题就一个事儿 | 标题就一个事儿，就告诉所有别人 |\n| 22 |\
    \ 对也到题 | 对也到题，XX 也自 XXX |\n\n每次写标题前，我都会进标题库瞅一眼，脑子里立马就会浮现出好几个标题啦。\n\n**（5）文案**\n\
    \n小红书的文案其实并不是特别的重要，不需要特别华丽的表达。\n\n只需要清楚的表达出自己的观点即可；跟写作文一样，我会先列出要写的文章的主题，分成哪几个部分写，想要表达什么样的思想。\n"
  mdcn: "\n## 1. 找准定位\n\n如果你已经有自己的产品和服务，可以直接跳过定位部分，从确定内容方向开始看。\n\n如果你没有自己产品、货源，或者你刚刚接触小红书，还在迷茫中，可以跟着步骤一步步来。\n\
    \n定位是在整个操作过程中，最重要的一环。\n\n就像做电商，选品永远是最重要的，选到一个好产品，就算是普通的运营也能做起来，在小红书也是一样的逻辑。\n\n\
    定位也就是解决我们“做什么”的问题，归根结底就是确定出一个变现模式。\n\n作为个体，我们拥有的技能、或者是熟悉的代理的产品都可以作为我们的变现模式。\n\n\
    - 我的 PPT 做得不错，通过帮助别人做 PPT 设计变现，就是一项技能变现。我前几次创业的项目也是围绕着 PPT 设计。\n- 我的舍友会写歌作曲编曲，通过帮助别人写歌变现，就是一项技能变现。这也是我们目前在小红书做的其中一个矩阵号。\n\
    \n### 培训编曲账号\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_260_0.png)\n\n比如我是留学生，那帮助其他人申请写文书、或者辅导英语等都可以是一项技能变现；比如我是律师，帮助当事人做咨询，也是一项技能变现。\n\
    \n### 案例账号\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_261_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_261_1.png)\n\
    \n那肯定有人会说，我感觉啥也不会该怎么办。那我建议你尝试去代理一种你熟悉的产品。\n\n比如说，小红书有很多卖茶花的，基本都是代理商；比如可以做小程序建站，可以找商家拿案例，你帮助推广；比如你熟悉的日常用的产品，都可以直接进行带货。\n\
    \n只要事先与商家谈好分销比例，基本很多商家都会同意你帮忙做分销的，这是一件双赢的事情。\n\n### 寻找合作\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_262_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_262_1.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_263_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_263_1.png)\n\n如果你本身就是一个商家，那就更简单了，直接把你的产品服务搬到线上来，让线上也成为你获客的渠道之一。\n\
    \n可是我们如何辨别，这个产品或服务在小红书是有没有市场的呢？\n\n我们不能看到做的人少，就认为这是一片蓝海，可以吃掉整个市场。因为你的这个产品可能就是一片死海，根本不适合小红书。\n\
    \n### 甄别市场\n\n我一般是 Through 这个方法辨别的。\n\n1. 通过千瓜等数据平台，查看关键词搜索量。首先挖掘出你的产品/服务的三个左右关键词，在数据平台或者是小红书的下拉词，查看热度。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_264_0.png)\n\n2. 通过查找同行账号，去分析市场。一般来说，就算是再细分的市场都是会有人比你先发现的，如果有\
    \ 3 个以上的账号连续更新超过了一年，那这个市场基本上是没问题的。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_265_0.png)\n\
    \n为什么呢？我们可以换位思考一下，如果你连续更新 1 个月，完全看不到一个愿意为你付费的粉丝，你还会继续坚持吗？如果你的同行连续更新几年了，一分钱都不赚，那他是打算做慈善吗？\n\
    \n我们确定好定位之后，就要去制作笔记，吸引精准粉丝啦！\n\n## 2. 确定内容方向\n\n很多人都陷入了一个误区，浏览越多就说明做得越好。\n\n这句话看似没问题，但也不完全对，特别是在小红书企业号\
    \ IP 领域。\n\n我写过很多 10 万+的爆文，但是一分钱都没有看到；我也写过很多只有两三百浏览的文章，但是每篇笔记都有几位粉丝咨询，最终有一半的人下了单，而我做的业务客单价都在\
    \ 5000+。\n\n所以能持续写出可以吸引强需求粉丝的笔记，十分重要。\n\n那我们如何把握好笔记内容方向呢？\n\n> （1）如果你是做知识付费业务（比如咨询、教学），那我建议你可以主发干货、配合发部分案例。\n\
    \n比如这位做唱歌教学的主播，干货笔记、案例笔记均有涉及。\n\n### 唱歌教学案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_267_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_268_0.png)\n\n比如这位做法律咨询的博主，干货笔记、案例笔记同样均有涉及。\n\
    \n### 法律咨询案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_269_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_270_0.png)\n\
    \n比如这位做运营咨询的博主，大部分发干货笔记、其他的都是自家的广告。\n\n### 引流运营案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_271_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_272_0.png)\n\n> （2）如果你是做带货业务的（含技能服务、卖实体物品），那我建议你直接发案例。\n\
    \n比如这位做小程序的博主，全部笔记都是自家小程序展示。\n\n### 小程序案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_273_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_274_0.png)\n\n比如这位设计师的博主，大部分笔记都是自家小程序展示，每十条笔记中只有一条干货笔记。\n\
    \n### 设计 IP 案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_275_0.png)\n\n- 恶搞小怪咖\
    \ IP 形象设计\n- 国潮风—红楼梦 IP 形象设计\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_275_1.png)\n\
    \n- 原创设计 | 新国潮茶品品牌会形象设计\n- 品牌文案 | 打造品牌 IP 的重要性\n\n- 干货笔记\n- 案例笔记\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_276_0.png)\n\
    \n- 干货笔记\n- 案例笔记\n\n比如这位养生博主，大部分笔记也都是产品展示，每四条笔记中只有一条干货笔记。\n\n### 养生茶案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_277_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_277_1.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_277_2.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_278_0.png)\n\n当然，这只是我建议的大方向，具体类目可能会有细微差别。\n\
    \n### （3）做视频还是图文\n\n在企业号 IP 领域，我个人更倾向于前期做图文。\n\n小红书本质上是图文平台，评论的权重占比更高，而图文用户更容易产生互动。\n\
    \n不可否认的是平台对视频内容有一定的倾斜，我做的第一篇视频就小爆了，总共 5000+的互动，但是我发现我们生产出一条视频需要一整天。\n\n而同样的时间做图文，可以产出\
    \ 10 余条，所以新手建议先做图文账号。\n\n目前我的图文账号团队已经稳定了下来，每天都在输出原创内容，所以我又找了一个表演天赋比较强的伙伴，让他把我们的图文账号里面的干货内容“口播”出来。\n\
    \n他就看着提词器，生动形象地把内容读出来，这种视频一天可以拍出十几条，然后再发到另外几个账号上，在我看来这也是性价比很高的一种内容输出方式。\n\n也有很多口播大神，靠着精湛的表演能力，引流都做得不错。\n\
    \n而且口播类视频可以同步快手、抖音、小红书、视频号等几个平台，单条视频的价值还是很高的，以下是我认为做得比较好的几个同行~\n\n### 口播案例\n\n\
    ![](img/833edac43fd3eb96b57b7624b0e071d2_280_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_280_1.png)\n\
    \n现在我们知道发什么笔记了，确定了内容的大方向之后，那如何快速批量生成优质内容呢？\n\n## 3. 批量生产内容\n\n**（1）寻找对标博主：**\n\
    \n首先，在确定好了定位之后，我们就要去寻找对标博主，看看有没有同行做得好的地方可以借鉴。\n\n有了 10-20 个对标账号后，我们就可以拆解、模仿、然后再创新。\n\
    \n建议新手前期都可以参考对标账号的内容选题和输出，自己进行修改优化即可，因为新手选题容易“跑偏”，等有了一定的经验后再自己去创新也不迟！\n\n寻找对标博主我一般用这三种办法：\n\
    \n### ① 搜索关键词\n\n比如我是做音乐制作的，我会把客户可能搜索用得到的词汇汇总出来。比如：作词、作曲、编曲、音乐制作、混音、修音等等。\n\n\
    在搜索栏进行搜索之后，然后点进主页进行筛选。只要目标账号每周坚持更新、评论区经常有精准粉丝询问、笔记数据稳定偶尔几篇小爆款，就可以成为我们的对标账号。\n\n\
    ![](img/833edac43fd3eb96b57b7624b0e071d2_282_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_282_1.png)\n\
    \n### ② 在频道里，找到对应类目\n\n这是一个很多人都会忽略的好方法！\n\n首先你要平时就多搜索你对应领域的内容，假设你是做澳洲留学服务的，平时经常刷澳洲留学的笔记。\n\
    \n那么你在“学习”频道里，发现页刷出来的笔记都十分精准！全都是有关于澳洲留学的。\n\n如果是新号尝试用这种方式找对标博主的话，可能就会出现不精准的现象。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_283_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_283_1.png)\n\
    \n### ③ 坚持记录，遇到好的博主就关注\n\n平时我们刷小红书的时候，在发现页经常会刷到优秀同行的博主/笔记，我们不妨点个关注、收藏，下次就可以直接找到啦。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_284_0.png)\n\n**（2）选题：**\n\n选题就是笔记的“灵魂”。\n\
    \n一篇文章能不能成为爆款，取决于我们的选题。同样的，一个人有没有持续做出爆款的能力，也取决于能不能持续找到优秀的选题。\n\n我们在选题的时候，千万不能“自嗨”！要根据数据去分析锁定用户感兴趣的内容。\n\
    \n我们团队是固定每周日前，每个人需要提交最近刷到的 5 个新选题，然后我再从选题里挑选出比较好的，完善进我们的选题库，我们负责内容制作的小伙伴就会从选题库里面制作选题。\n\
    \n我们团队一般是用以下两种方法进行选题。\n\n### ① 从对标博主挖掘\n\n刚刚有讲到如何寻找对标博主，在确定好 10-20 个对标博主后，就可以对他们的笔记进行分析，把数据从高到低排列。\n\
    \n优先做数据高的选题！坚持做小红书一段时间后，你刷到的每一篇笔记，你都可以看到它有没有爆的潜力。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_286_0.png)\n\
    \n### ② 从热门笔记挖掘\n\n在选题之前，不妨我们把自已代入为用户，从需求、人群、问题场景等方面去挖掘用户需要什么。\n\n然后列出用户可能会搜索的关键词，具体方法和上文提到的：寻找对标博主中的关键词搜索法是一样的。\n\
    \n这些选题都是经过用户和平台的验证，都是爆过的笔记，他们的选题会非常有参考价值。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_287_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_287_1.png)\n\n**（3）首图：**\n\n在小红书内容创作中，首图极其极其重要，因为小红书是一个信息流平台，首先映入眼帘的是一张张的首图，用户看到吸睛的首图，才会有点进去的冲动。\n\
    \n只有点进去了，才可能会有接下来的点赞收藏评论等互动，进而产生爆款。\n\n而我们做企业号引流，要的是制作速度够快，同时图片质量也要高。这好像是一个伪命题，不过我给你分享我们团队的做法，做到速度快的同时质量相对比较高。\n\
    \n首先需要明确小红书首图尺寸，小红书建议首图都用 3:4 的比例，在主页展示的面积比其他比例都大。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_288_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_289_0.png)\n\n第一步：在 20 个对标博主中，搜集出几个爆款封面，并进行改善模仿。\n\
    \n第二步：因为我 PPT 用的比较多，所以我们团队的固定模版都是用 PPT 制作的，我们把爆款首图拉进去 PPT 里面。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_290_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_290_1.png)\n\n元素：6 张底图 + 两行字，几乎 1:1\
    \ 模仿后再添加自己的特色。\n\n根据对标的图片，打好版式确定自己的风格，以后每一次制作笔记首图，就只需要更改里面的“文字”和“图片底图”，一个新的封面就出来了。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_291_0.png)\n\n以**编曲**类目示例：\n\n每次只需要更改\
    \ 6 张底图，然后修改文字就可以了，制作过程不到一分钟！！！\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_292_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_293_0.png)\n\n因为我所在的类目比较小众，同行做得比较普通。所以图文首图我会参考成长类目的账号，视频封面我会参考美妆类目的账号，适当的跨类目参考也是可以的。\n\
    \n如果你实在不想自己设计，可以去稿定设计等网站去找小红书配图，再进行修改，或者请专业的设计师给你打好版式，以后每次制作就只需要更改文字和底图。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_294_0.png)\n\
    \n掌握好这个方法，以后每张首图 30 秒就可以搞定。\n\n**（4）标题**\n\n最开始写小红书的时候，我也不会写标题，直到有一天想起作为一个资源学渣，每次写英语作文都要依靠模板。\n\
    \n比如提前背通好推荐信模板，每次遇到类似写作内容，就把提前背好的句子稍微修改下，然后往上写。\n\n而我们写标题也可以找出万能公式，然后往里套！举几个例子：\n\
    \n公式 1: ①文XXXX\n- 留学: ①文看懂英国学校段位, 别把青铜当王者!\n- 运营: ①文教会你详细拆解10W+书评\n\n公式 2: XX个万能XXX!\
    \ 手残党福音! 新手抄作业!\n- 运营: 99个万能标题! 手残党福音! 新手抄作业!\n- 留学: 被牛津大学秒录的文书原来这样写! 手残党福音, 新手抄作业!\n\
    \n公式 3: 人人都能学! 带你深扒XXX的小心机\n- 运营: 人人都能学! 带你深扒一秒提升首图点击率的小心机\n- 留学: 人人都能学! 带你深扒被牛津大学秒录文书的小心机\n\
    \n如何找到这些公式呢?\n\n1. 知识星球【谢无敌的红书宝】\n   在星球的标题文案库里，有无敌姐整理的 300+标题模板，全类目通用！\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_296_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_296_1.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_296_2.png)\n\
    \n2. 小红书搜索万能标题\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_297_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_297_1.png)\n\
    \n再根据万能标题，整理建立属于自己的标题库。\n\n| 编号 | 标题 | 举例 |\n|---|---|---|\n| 1 | 标题 | 拯救学弟，一本如何拉分加计学硕士上岸啦！\
    \ |\n| 2 | 如何逆袭、代过 | 如何逆袭，代过如何全过？ |\n| 3 | 不能不行 | 不能不行，hks 不能走法人大考 XXX 了个硕士 |\n\
    | 4 | 快本 | 快本，一本 XX 过法日加计学硕士上岸啦！ |\n| 5 | 直接野放 | 直接野放在职读研的硕士 |\n| 6 | 逆袭 | 逆袭，XXX\
    \ 军校 |\n| 7 | 你们都能成功硕士 | 你一定能成功硕士，XXX 军校 |\n| 8 | 我已双非成了 | 我已双非成了，半路出家成功读研的硕士\
    \ |\n| 9 | 野读题 | 野读题 |\n| 10 | 半路它 | 野读题半路它 |\n| 11 | 我死后悔 | 我不后悔，就是去 XXX 读了 |\n\
    | 12 | 天就我全后悔 | 天就我全后悔，人人都是优等生 |\n| 13 | 不如读过的 | 不如读过的，XXX 硕士 |\n| 14 | 阅读学 |\
    \ 阅读学，XXX 硕士 |\n| 15 | 大家都说 XXX 完了 | 大家都说 XXX 完了，人人都是 XXX |\n| 16 | 的学 | 学在的学\
    \ |\n| 17 | 在自的 | 在自的个 X，xxxx |\n| 18 | 优打不新 | 优打不新，XXX 野校 |\n| 19 | 横题打开 | 横题打开，野门也考学硕内理\
    \ |\n| 20 | 简单话顶以过去 | 硕士最简单可以过去 |\n| 21 | 标题就一个事儿 | 标题就一个事儿，就告诉所有别人 |\n| 22 |\
    \ 对也到题 | 对也到题，XX 也自 XXX |\n\n每次写标题前，我都会进标题库瞅一眼，脑子里立马就会浮现出好几个标题啦。\n\n**（5）文案**\n\
    \n小红书的文案其实并不是特别的重要，不需要特别华丽的表达。\n\n只需要清楚的表达出自己的观点即可；跟写作文一样，我会先列出要写的文章的主题，分成哪几个部分写，想要表达什么样的思想。\n"
