    # 方法二：评论区留钩子


    除了可以在图片和正文里留钩子，还可以 在评论区留钩子。


    当你分享了行业干货，可以在评论区置顶一条钩子评论，这样做不但可以引流，还能增加笔记和账号权重，提升笔记的阅读量。


    ```

    CES =

    点赞数 x 1分 + 收藏数 x 1分 + 评论数 x 4分 + 转发数 x 4分 + 关注数 x 8分

    ```


    了解一下小红书算法的评分体系，简称CES。


    简单理解就是，笔记的点赞收藏都是打1分，评论和转发是打4分，关注打8分。'
