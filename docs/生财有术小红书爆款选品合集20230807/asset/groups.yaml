    日期：2022-03-22


    大家好，我是怡伶，是上海一家艺术店的老板，我主要做 Tufting 等线下艺术体验项目。


    直到发文，我都还有点不敢相信，几个月前濒临倒闭的手工 DIY 体验店，凭着一个只有 700 粉的小红书账号，一跃成为网红打卡店，吸引国际品牌方、明星博主、电视台、小红书官方纷纷来体验和办活动。更神奇的是，由于生意太火爆，我还被同行恶意差评了。


    目前我的门店 90% 客源都来自于小红书，月营收超过 10W。虽然这个成绩跟很多千万级别的生财大佬相比不算什么，但这段经历收获实在太多，我还是忍不住想分享出来～


    通过这篇文章，我想给大家揭秘市面上号称「近乎 0 门槛、回本快」「7 天开家店」的小众艺术项目 Tufting 到底怎么玩、开店运营需要投入什么以及有哪些注意事项。


    此外，我还会聊聊我是怎么把一个千粉不到的小红书账号运营到月入 10W 的，有经验分享也有踩坑总结。如果你是实体老板且门店生意不佳，或者是正在为客源犯愁的艺术领域同行，那部分应该会对你们有一些帮助。


    初次分享，我会努力把这个小众项目的全貌和玩法描述得清晰一些，可能会有思考不成熟或表达不当的地方，欢迎指正交流～


    ![](img/833edac43fd3eb96b57b7624b0e071d2_172_0.png)


    # 目录：


    1. 投 2W 月赚 10W：风靡小红书的 Tufting 到底是啥？

    2. 网红店风那么大，开店或加盟有哪些注意事项？

    3. 如何通过线上运营获取源源不断的流量？（大众 & 小红书）

    4. 秒杀同行的关键：产品交付与用户维护


    —Part 1—


    # 投 2W 月赚 10W：风靡小红书的 Tufting 到底是啥？


    我原本是做油画体验的，去年 3 月在上海田子坊开了自己的「梦中情店」，主要在线下成交。一开始我靠着企业 B 端客户的团建合作以及商圈流量勉强维持经营。


    后来疫情限流，再加上油画体验已是红海，同行恶意低价竞争愈发激烈，门店生意愈发惨淡、入不敷出，逼得我差点把店给关了。


    ![](img/833edac43fd3eb96b57b7624b0e071d2_174_0.png)


    但天无绝人之路，我挖掘到了新方向 —— 国外早就爆火但国内还刚起步的小众艺术体验项目 Tufting。


    Tufting 国内中文名一般叫簇绒、织毛线、戳戳绣等。其实是在地毯上画画，用毛线 DIY 编织地毯、镜框、杯垫、抱枕套、手机壳、包包等，万物皆可戳，每次耗时
    2-3 小时左右。


    这种 DIY 手作沉浸式体验极佳，深受小年轻的喜爱，现在不少中老年人也乐意来体验。


    它最早在欧美兴起，ins 上都火了好几年了，但国内知道的人还少，门店数量相比泛滥的油画体验店还不算特别多。


    ![](img/833edac43fd3eb96b57b7624b0e071d2_175_0.png)


    Tufting 在小红书上一开始也不是很火。去年 10 月调研时，小红书上才 2-3 万篇笔记，但现在一看已经 6 万多篇了，相应的话题浏览量也是暴增。我预计今年会爆发式增长，小红书官方已经搞了全国专场活动，去年年底去了我店里拍宣传片。


    前段时间，我还收到了小红书工作人员给我发的 Tufting 店铺入驻手册。当然，不止 Tufting，小红书对手工、艺术类博主的扶持一直都不错。


    归总下来，**Tufting** 还属于潜力十足的蓝海市场，这点就足够吸引我了。而且，**Tufting** 虽然小众但网红元素满满，对于国内用户来说足够新颖、热度够高，社交分享传播属性很强。因此只要精准运营，就能把生意做爆。


    当身处红海市场，要么不停内卷外卷，搏杀而出；要么挖掘小众蓝海市场，专注于小而美的领域，在不经意间突围而起。


    我更倾向于选择后者。


    除了蓝海、小众、网红等元素，**Tufting** 身上还有其他优点吸引我快速布局：


    - **投入少回报快**：不包含我的店铺租金，前期投入不多，我也就花了 2 万多块买了设备物料，比如毛线、工具枪、毛毯、画架、投影仪等。在本身有开店经验的情况下，约
    7-8 天就能营业，让资金回流（没经验的至少 1 个月起步）。

    - **沉浸式体验**：现在打工人压力太大了，「治愈」「解压」成为了他们的两大需求，手作类体验刚好可以满足需求。

    - **技术低、一教就会**：Tufting 不难操作，勾好线稿、选好毛线颜色，简单指导下就可以拿起工具枪「突突突」，覆盖的用户群较广。

    - **复购率不低**：很多客户都不是一次性消费体验，今天编织不满意改天再来，我有些客户还会拖家带口或者带闺蜜闺男、同事一起来玩。


    整体来看，开店门槛确实挺低的，我见过网上有同行一下子就开了 8-9 家。


    —Part 2—


    # 网红店风那么大，开店或加盟有哪些注意事项？


    当然，肯定不是随便开个店就能赚钱，你的选址、产品服务体验、环境都很重要。


    同行群其实每天都会有人说要关门倒闭，倒闭的要么是喜欢玩恶意低价竞争，要么是自己也不太懂，产品质量服务不太行，指导做出来的成品比较丑。


    ![](img/833edac43fd3eb96b57b7624b0e071d2_178_0.png)


    在提供服务的过程中其实会出现很多问题，比如客户作品打破了怎么处理？客户要做包怎么处理？怎么样的店铺氛围体验更好？什么毛线让作品效果更好？设备多久维护一次、怎么维护等等。


    很多人开店以后才发现客户不满意、抱怨很多，都是因为急着开店的人前期根本没有做好这些准备。


    所以别只看到网红店的表象就脑子一热，立刻疯狂找钱开店，最后关门不说可能还要倒贴钱。很多成功的例子都是「幸存者偏差」。开店前要做好调研，也要考虑下自己的实力是否接得住这样的产品和服务，能不能建立起「护城河」。


    以我自己为例。我合伙人是有三十几年功底的手艺人，熟悉高定、各类 DIY 体验；而我则是艺术专业毕业，有几次创业经验，重视产品服务交付，开店选址方面也有一定经验。普通上班族、不懂行的不一定能交付得好。


    另外，线下门店其实很容易遇到流量瓶颈，即便在商圈也是如此。因此，在互联网时代一定要学会借力于线上运营。


    自从小红书记爆了我的门店，生意迎来了前所未有的大爆发，有时候上厕所都在接预约电话。别人是每天求客户来，但我真的每天都在「劝退」客户，因为接待不过来了。不是凡尔赛，有截图有真相。


    ![](img/833edac43fd3eb96b57b7624b0e071d2_180_0.png)


    从试运营的第二个月起，我就月入 10W+ 了。现在准备开第二家场地更大的分店，制定加盟店计划；另外，我还筹备着拓展线上产品业务，丰富 SKU。


    所以，接下来我想分享我是如何通过线上运营获取流量，引爆门店生意的。真的有很多踩坑点，新手一定要看完。


    —Part 3—


    # 如何通过线上运营获取源源不断的流量？


    我精力有限，线上流量获取渠道只做了大众和小红书两个平台，后者是我的主战场。


    运营初期我先做的大众点评，但没做起来就转战小红书了。在这部分内容里，我想先分享下我在小红书的运营经验，再总结我在大众踩过的各种坑。


    ## 一、如何用小红书引爆门店生意？


    一开始也是各种踩坑，跟着小红书实战营的谢无敌和喵小C 老师学了一整套玩法才有起色。很多思维和技能实战层面的提升，都是他俩带给我的，真心特别感恩。


    言归正传。从去年 10 月运营到现在，我的小红书个人号也就 700 粉，询单爆发时才 500 粉不到。目前 90% 门店客源都来自于小红书，其中不乏单价 1W+、2W
    + 的企业单。


    我的闭环设计很简单：从小红书等公域引流到私域，客户在微信预约后到线下店后消费成交。小红书客户基本都很精准，来一个成交一个，私域没有过多维护，我甚至连朋友圈都没咋发。


    生财里教大家怎么注册账号、定位、设计主页、私域维护的分享已经很多了，我就不班门弄斧。这部分我主要想聊聊我对小红书内容种草引流的思考，有成功经验也有雷区踩坑。


    先分享我亲自实战过，非常有效的种草笔记写作经验吧。我把主营业务优化为 Tufting 类目后，主要发了两类引流种草笔记：


    - 个人引流名片

    - 案例作品种草笔记


    这两种都给我的账号、门店带来了不错的曝光，也吸引到了超多精准成交的目标客户，是高转化种草笔记。实战营同学测试过的，基本都出了效果，适用于很多类目。因此我觉得值得分享下经验。


    # 相关笔记评论词云


    ![](img/833edac43fd3eb96b57b7624b0e071d2_182_0.png)


    我的评论区词云图（高频词：预约）


    ## 1. 置顶个人引流名片


    置顶个人名片是我写的第一篇 Tufting 笔记，也是询单、客户预约最多的一篇。


    在小红书里搜索「上海 Tufting」或「Tufting 上海」，这篇基本都排在前十名（每个人的搜索呈现结果不一，会有些偏差）。


    引流名片笔记，是软性植入自家产品或服务的「神器」。那这类笔记怎么写呢？


    我分两部分说：「笔记类型」+「写作技巧」。


    从笔记类型来看，引流名片主要包含故事经历型、硬广介绍型和仿真实体验型三种。


    ### **故事经历型：** 自我介绍和故事经历描述。


    但这个描述不是流水式的，一定要重点说自己的工作部分，方便软植入产品和服务。在不明确导流的情况下暗示用户「在我这里可以买 **XXX**」。我拿实战营同学栗子姐的千赞笔记作为例子给你们展示下（这篇是无敌亲自指导写的，1
    篇涨粉两三千呐）：


    ![](img/833edac43fd3eb96b57b7624b0e071d2_184_0.png)


    **叙利亚战火十年，我在叙利亚创业的这五年**


    我是董佳。


    中国人，职场20余年。


    叙利亚总理曾玩笑的说要给我也发叙利亚国籍。


    从一块叙利亚古皂开始，而今闯荡叙利亚第五个年头，现在负责叙利亚国家馆，致力于在中国推广叙利亚贸易、文化、旅游等等，把最真实的叙利亚展现给大家。


    在小红书，我希望能够展示并带你一起了解这个经历战乱、制裁、重建，千疮百孔但仍坚强、乐观、善良、美丽的真实的叙利亚。


    为什么要说点什么...


    ### 为什么要做叙利亚的产品？


    老实说，在许多人看来这可能并不是一个好主意。身边每个人听我说到叙利亚，第一反应都是充满疑惑和畏惧，一个女人跑到男性占绝对地位的中东国家，冒着战火，还要做生意，大部分朋友都觉得不可思议，觉得我脑子不太正常。


    职场二十年，当经历了这么多起起伏伏，人情冷暖，钱不再衡量应该做什么事业的唯一标准了。面对叙利亚这样一个国家，就那么一瞬间触动我，让我决定要为叙利亚做点什么。


    于是，2016年，从跟当地工厂合作进口古皂开始，正式开启了叙利亚贸易之旅。而今，我们已经成为叙利亚个人消费品在中国最大的也是唯一正规化运营的公司，成为叙利亚政府唯一授权的叙利亚国家馆。


    我们把叙利亚手工艺人制作的产品带进了中国，因为我们的订单量比较大，许多叙利亚的工厂并没有受到疫情和制裁的双重影响，工人们保证了工作，他们的家人也没有因此流落街头，能每天按时吃上饱饭，有衣服穿了。


    感谢大家，感谢你们的支持和认可。中叙贸易中还有很多困难和问题，但我相信一定会越来越好。希望在小红书，我们一起分享在叙利亚的点点滴滴。


    ### **真实体验型**


    我的笔记就是这种类型。


    一开始写得比较硬广，后面做了优化调整，模仿常见的探店笔记写了一篇置顶到主页，直接放了门店地址都没被系统判导流违规。如果你也有店，可以试试这种伪探店口吻；如果没有也可以模仿下素人体验口吻，有时候系统还真识别不出来你在打广告，非常好用。


