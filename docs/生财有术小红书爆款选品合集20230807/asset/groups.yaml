  md: "\n然后根据列出来的大纲，进行语句的完善。\n\n如果新手不知道怎样写的话，可以根据主题找出几篇类似的文章，先模仿着。等到写出了几篇文章，你会发现文案的写作会越来越快！\n\
    \n## 4. 引流变现\n\n小红书一直想做站内转化，给知识付费的商家开通了专栏，给带货商家开通了店铺。\n\n### 店铺与专栏\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_300_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_300_1.png)\n\n但是转化率真的是太太太低了，高客单价产品还是要想办法引流到微信去做成交。\n\
    \n### （1）引流\n\n小红书对于私信引流一直都有一个阈值，只要不超过一个量，引流操作还是可以进行的。\n\n目前我所有的引流账号都认证了企业号，认证完企业号后，每天的私信人数控制在30人以下，目前还没有大规模出现问题。\n\
    \n如果当日咨询的人数不够，就私信粉丝以及点赞和收藏笔记的人，凑够30人。\n\n如果你的账号是个人号，就不要大规模去私信，只需要回复粉丝的咨询就可以啦！当心隔天会受到引流的违规提示。\n\
    \n### （2）朋友圈变现\n\n引流和转化是完全两个事情，我们从小红书吸引了用户加我们微信之后，他可能不会立即付费。\n\n特别是做高客单的，用户一般会观察一段时间，觉得靠谱之后再付费，所以我们的朋友圈一定要经营好，利用好朋友圈展示自己的产品和服务。\n\
    \n我以前也挤不出字，经常不知道怎么发朋友圈，后来和圈友柠柠讨论之后，我也总结了一套发朋友圈的方法。\n\n#### 01 文案优化对比\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_302_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_302_1.png)\n\n### 好的朋友圈到底长什么样\n\n首先，朋友圈一定要美观，看上去很舒服，只要美观而且可读性很强，发再多的量也是有人看的。\n\
    \n#### 朋友圈案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_303_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_303_1.png)\n\
    \n反之，如果是直接产品刷屏，不仅会被用户拉黑，而且也会被微信系统屏蔽。\n\n如何做到朋友圈美观呢？我认为有以下几点：\n\n- 1. 排版\n- 2.\
    \ 主题\n- 3. 文案内容\n\n**① 排版**\n\n我不太喜欢看密密麻麻都是文字的朋友圈，看起来特别挤。\n\n**朋友圈有点“挤”**\n\n\
    ![](img/833edac43fd3eb96b57b7624b0e071d2_304_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_304_1.png)\n\
    \n所以我建议先写两句话的开头，然后中间再空出写正文部分，当然这和个人喜好也有关系。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_304_2.png)\n\
    \n**文案案例**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_305_0.png)\n\n**② 主题**\n\
    \n也就是解决“发什么”的问题，朋友圈一定是把生活和营销结合起来。\n\n但是生活又不完全是生活，每一条朋友圈都需要表达出自己想被人看到的方面。\n\n这样说可能有点抽象，给大家举个例子吧。\n\
    \n**文案案例**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_306_0.png)\n\n说实话，看完柠柠的每条朋友圈我都有付费的冲动。\n\
    \n她其实也是一名大学生，在朋友圈中也会分享自己的学习、旅游、创业点点滴滴。\n\n她微信的好友很多都是同龄人，可以产生情感的共鸣，一下子一种追逐梦想，不约束自己的创始人IP就凸显了出来，也从侧面凸显了“我会赚钱”，“跟着我做你也可以有向往的生活”。\n\
    \n**③ 文案**\n\n我一般是想好了主题之后，先想一个标题。\n\n然后把主题用大白话写出来，因为朋友圈不像是写文章，只需要用平常的语言把想表达的东西表达清楚就可以了。\n\
    \n## 四、如何低成本扩大项目\n\n### 1. 打造矩阵\n\n在一个号能够持续引流变现之后，建议你可以继续放大，做第二个号第三个号，通过堆账号数量去放大。\n\
    \n因为一个账号是有瓶颈的，就算是企业号，一天私信也最好不要超过40条，多了就可能会被检测违规。\n\n目前一张营业执照可以开3个账号，建议大家前期都注册成个体工商户，后期维护成本比较低。而个体工商户和公司主体认证的蓝V功能都是一样的。\n\
    \n甚至我在入驻小红书官方MCN的时候，都不需要签约博主，提交的都是自己公司的账号。\n\n**入驻小红书官方MCN啦**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_308_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_308_1.png)\n\n同时，我会把我在小红书的图文内容发到知乎平台和公众号。\n\
    \n把视频内容同步抖音和视频号，一下子就多了N条获客渠道。\n\n知乎也是一个宝藏平台，用户质量都很高，建议做小红书图文的小伙伴都重视这几个平台的内容分发。\n\
    \n如果分发平台较多，建议可以使用账号分发平台。\n\n**文案案例**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_309_0.png)\n\
    \n- 图文\n  - 小红书\n  - 知乎\n  - 公众号\n- 视频\n  - 小红书\n  - 抖音\n  - 视频号\n  - 哔哩哔哩\n\n\
    ### 2. 扩张团队\n\n在跑通了闭环，获得了第一笔金钱反馈之后，我们就开始扩大团队规模了。\n\n因为一个人想要负责那么多账号，真的是忙不过来。\n\n\
    作为大学生，说起扩张团队我首先就想起了大学生兼职。因为大学生网感普遍不错，很多人也都是抖音小红书的重度使用者，培训起来也相对容易。\n\n相比于线下全职，成本也相对比较低。\n\
    \n那么如何找到大学生兼职呢？有几个小方法可以提供给你：\n\n#### （1）找各个学校的墙发广告\n\n可以去各大学的百度贴吧、或者非官方的公众号，就可以看到很多校园墙/师兄师姐在发广告、介绍学校，可以先用普通学生的身份去添加他们。\n\
    \n**扩大团队**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_311_0.png)\n\n一般来说，5000活跃好友的账号插播个小广告一般50元左右，因为我长期跟他们合作，所以收的都会便宜一些，具体话术如下。\n\
    \n**扩大团队**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_312_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_312_1.png)\n\
    \n不要找公众号发送，找个人微信号那种发送！效果会好很多而且便宜！\n\n#### （2）大学生服务相关群\n\n我以前是做淘宝PPT设计的，每天都有很多学生主动私信应聘设计师。\n\
    \n他们会把学生加到一个群里审核，你可以找一个比较小的店铺体验下流程，和店铺老板聊聊能不能有偿让他帮你发广告。\n\n我们设计师不够的时候，也会到其他店铺的群里发单的（需要提前给老板联系好）。\n\
    \n或者自己就购买PPT初级制作的服务，遇到的设计师都会是学生，如果制作效果好也可以长期进行合作。\n\n加到一个学生之后，让他拉你进相关的群，或者推荐好友，一个群或者好友给他1元，立马你就裂变出几十个群了。\n\
    \n#### （3）闲鱼等平台找兼职\n\n说实话，闲鱼还是一个很优质的平台，你可以去一些技能服务相关的卖家留言。\n\n比如剪辑视频、画画、代做XX、PPT设计等等，只是你觉得人群相匹配就可以。\n\
    \n**闲鱼等找兼职**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_314_0.png)\n\n然后就可引流到微信去，同样的只要加到了一个学生之后，就可以让他拉你进相关的群，或者推荐好友。\n\
    \n#### （4）我自己的团队\n\n因为我也是大学生，和我一起做的大多数是身边认识的人，平时待在一起久了，也更容易知道这个人做事风格、靠不靠谱。\n\n\
    如果你也有朋友、家人是大学生，不妨好好利用好这波资源，同时也带动大学生赚赚零花钱。\n\n同时我也要感谢我们学校的创业孵化基地收留了我们一群人。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_315_0.png)\n\
    \n让我们在学校内就有一个比较好的工作环境，说实话线下的工作效率要比线上高很多很多倍。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_316_0.png)\n\
    \n如果你也是大学生，也可以向自己学校申请一件办公室什么的，对于后续业务的开展也很重要！\n\n### 3. 完善SOP\n\n#### （1）完善工作手册\n\
    \n招人之前其实就要明确好，设置好什么岗位。\n\n我们是把选题、文案、图片、视频几项业务分开，每个人只需要负责好其中的一个部分。\n\n每个人招募进来后，都需要给他们培训，我一般是现场演示一遍给他们看，然后分发一份他岗位的工作手册。\n\
    \n**完善工作手册**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_317_0.png)\n\n因为新人还不是特别能明白我们具体是干什么的，所以需要有一份明确的工作手册指引他们，下一步需要干嘛干嘛。\n\
    \n那工作手册该如何做呢？\n\n- ① 自己跑一遍业务，然后从头到尾记录下来\n- ② 尽可能把所有工作流程化，就像生产线一样\n\n如果说你的工作手册，扔给任何一个人都能看得懂并且按照内容一步两步进行操作，那这就是一份合格的工作手册。\n\
    \n#### （2）设置好 KPI，淘汰机制\n\n同一件事情，不同的人做会产生天差地别的效果。\n\n我们一定要学会筛选出靠谱的人，其实咱们这些事情只要肯用心，每个人都可以做得很好。\n\
    \n以前我总是认为“教”很重要，毕竟没有人一开始就会，碍于朋友面子，也没有什么淘汰机制。\n\n这样子的团队必定是散漫的！现在我都给大家列出了每天需要做的事情，每个人做完后就在对应的位置打勾＋附上链接，一目了然。\n\
    \n**设置工作任务**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_319_0.png)\n\n如果有人一直持续不能完成自己的工作，那没办法只能换人了，而且我们数据透明，被淘汰的人也不会有什么异议。\n\
    \n只要把这些内容安排好，我们团队就是一台高效率的生产线，每天都在源源不断生产优质内容。\n\n## 四、写在最后\n\n有人会觉得，爆款都是靠的运气，现在做自媒体真的太晚了。\n\
    \n只有经历过的人才知道：抛开运气，没有捷径。偶尔一篇爆文可能真的是运气，但是持续输出爆文的能力绝对不止靠运气。\n\n在我和家人朋友们说起我在做小红书的时候，他们都会以为我是写文案的或者拍视频的。\n\
    \n但其实在自媒体如此商业化的时代，文案或者视频只是一种表现形式，更重要的是对账号内容方向和定位的把控能力。这也是我这篇文章内附这么多举例和图片最主要的原因之一，希望你们看完之后能有收获呀！\n\
    \n小红书是我接触到的这么多的项目之中，上手难度比较低，且收益是长久的。\n\n我最开始也只是做一个音乐制作的账号，在跑通了一个类目后，我迅速把成长类目、留学、设计的账号做了起来，还接到了机票和签证咨询的代运营。\n\
    \n所以在跑通一个类目之后，可以迅速把能力迁移到其他的类目中去。真的具有无限的可能！\n\n如果你没有更好的副业选择，小红书是一个很不错的 项目，一开始或许会有点煎熬，但是坚持下去效果绝对会远超预期。\n\
    \n这一路上的成长皆遇良人，真的很感谢@谢无敌@喵小C@K哥@欧歌圈友们的信任，也在生财结交到了很多志同道合的朋友，感谢你们的一路相伴，也让我这个普通人的大学生活有了一些不一样的经历，让我看到了这个世界更多的可能。\n\
    \n人生的意义就在于折腾嘛，不慌不忙，我们一起成长。\n\n### 评论区：\n\n辛亥：很厉害！\n\n橙子：每天能稳定持续的引流变现，值得学习\n\n\
