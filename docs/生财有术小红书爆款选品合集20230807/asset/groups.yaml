    # 巧妙反问，促成订单


    当顾客问到某种产品，不巧正好没有时，就得运用反问来促成订单。


    举例来说，顾客问：“这款有红色的吗?”


    这时，你不可回答没有，而应该反问道：“不好意思我们没有进货，不过我们有黑色、紫色、蓝色的，在这几种颜色里，您比较喜欢哪一种呢？


    # 积极的推荐，促成交易


