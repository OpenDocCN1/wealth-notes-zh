    \n首先，它没有形成品牌垄断，其次，没有形成固定打法，正处于玩法的百花齐放状态，最后，没有进入规范期，稽查也比较宽松。这三个点加起来，意味着普通人现在入场，有大把的肉可以吃。\n\
    \n虽有风口加持，但依然有大量玩家发出相同的问题：卖什么好？\n\n是的，选品定生死，而且，当大家都知道这个品好卖的时候，它的红利已经被吃掉一大半了。\n\n\
    就像我挖掘到的内衣品，当时2月1号入局，真的特别好做，新号发了2篇笔记，别看个位数点赞，但它就是当天开始出单了，再看别人5月底入局，就难受了。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_477_0.png)\n\
    \n不改变，目前的该走什么，以及该走什么路线现在在做什么，\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_477_1.png)\n\
    \n这就是选品的红利优势，随着时间推移，没有足够的矩阵号，或者内容创作的时间投入，后期是很难竞争赢别人的。\n\n所以，这就需要我们拥有提前挖掘爆款抢占先机的方法。\n\
    \n是的，在没有资源加持的情况下，普通人的选品策略就是：先下手为强。\n\n上一次，告诉了你在小红书上，如何挖掘出1000个适合普通人的赚钱项目。\n\n\
    这一次，我和你分享，怎么让小红书电商里的爆品先机，把握在自己手上。\n\n## 蛮荒领域的批量搜集\n\n小红书电商，相对于其他平台的电商项目来说，依然是一个新事物。\n\
    \n在这样的蛮荒领域，刚入场，谁也不知道哪个才是正确方向，只有足够多的成功案例，才能帮助你在小红书上快速获取选品灵感。\n\n所以，按照从无数案例中精拆的思路，第一步，我们需要搜集大量小红书商品笔记。\n\
    \n刚开始，我是在小红书上输入关键词，手动收集案例，做着做着，突然发现，这有问题！它存在信息茧房！\n\n我只能检索自己认知内的品类关键词，系统也只会做我可能感兴趣的相关推荐，那些我认知外的品类，岂不是直接被筛选掉了？\n\
    \n而商机、蓝海产品，往往就在那些你想不到的地方呀！\n\n怎么办呢，这时候，想到了万能的数据平台，它上面就有商品笔记的筛选。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_479_0.png)\n\
    \n于是，我把4月的2000条带货笔记导了出来，打开表格，连商品链接这一列都没有！\n\n我需要它，因为可以更直观的获取价格、销量等数据，只有这样，才能支撑我做更深度的分析。\n\
    \n480/514\n\n我使用八爪鱼采集器，爬取灰豚的数据，过程涉及太多细节，和消磨耐心的调整，就不占用太多篇幅展开了，一问程序员朋友，他用python\
    \ + selenium 20分钟就搞定了……\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_480_0.png)\n\
    \n拿到商品链接，顺势批量爬下了对应产品的【销量】【价格】，然后用表格计算出它们的【GMV】。\n\n小红书4月带货数据源\n\n| 5 | 欧时力 5G512G\
    \ | 129元 | 3.1万 | 6.8万 | 10万+ | 98万+ | 80万+ | 80万+ | 70万+ | 60万+ | 50万+ | 40万+\
    \ | 30万+ | 20万+ | 10万+ | 5万+ |  |  |\n|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|---|\n\
    | 6 | 5G512G512G | 100+ | 3万 |  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |\n\n\
    ok，后宫佳丽三千，已经在你面前了，接下来，就是刺激的选品环节了。\n\n正所谓选品一时爽，选错火葬场。这么多品，我咋知道哪个好做，哪个不好做，这时候，就要有分析筛选能力，等着别人告诉你，汤都要没了！\n\
    \n## 先于选品的赛道选择\n\n拿到如此详细的表格，想必你的问题终于更明确了，从“卖啥好”到“做女装咋样”\n\n这个问题问得好，下次不许再问了，我们选品最后是具体到某一个产品，不是一个大类，这种宽泛的问题，是得不到可执行的答案的。\n\
    \n482/514\n\n所以我们去思考、做分析，要从宏观出发，到微观落脚。\n\n宏观，就是开启上帝视角，从GMV窥探赛道天花板，可以分为三档：百万赛道（100w+）、十万赛道（10w-99w），和万级赛道（1w-9w）。\n\
    \n先来看看这些赛道的粉丝量分布，这是成本和门槛的一个判断维度，如果粉丝5000以上居多，那么对新手就不友好了。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_482_0.png)\n\
    \n散点图看了个寂寞，数据太多，点连成一团浆糊，那换一个方式。\n\n按照小红书对博主的分类，把三档赛道的粉丝比例做了出来，这样就很清晰了。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_483_0.png)\n\
    \n百万赛道：5000粉以下的博主没有，其中有一半的博主集中在1w-5w粉，不做IP，没有粉丝量积累，你做这个品，可能会带不动。\n\n十万赛道：5000粉以下占了三成多，和万粉以下共同占据半壁江山，门槛大大降低了。\n\
    \n万级赛道：5000粉以下占了快一半，刚入场不要眼高手低，可以来这个赛道做选品，相比前面，难度就是新手村。\n\n粉丝量本质上，反映的是一个账号内容吸粉能力，能倒推出内容质量，进而初略判断笔记制作成本。\n\
    \n同时，粉丝量越大，账号权重越大，初始流量推的也越高，就比如我18w粉的梨云娜，在用户画像同行比例飙升，扰乱了推荐人群，导致没什么点赞的情况下，基础曝光随便都能进入千级流量池。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_484_0.png)\n\n如此，对标大博主的带货，开新号来说，难度也是直线上涨的。\n\
    \n应答梨云，你的目标，要和你的能力匹配，不然又要喊怀才不遇了。\n\n接着，分析三档赛道的价格分布，看赛道消费力，有利于圈定选品的价格区间。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_485_0.png)\n\
    \n百万赛道：50-100占了4成，200-500占了2成，50块以下只占了0.5成（这得多大的销量才能拉到百万GMV）\n\n十万赛道：50块以下占了一半，50-100块占了3成。\n\
    \n万级赛道：50块以下占了7成！50-100块占了1成多。\n\n发现趋势没，想要突破十几万、上百万，客单价必须往高里走，但是与此相对的，就是带货难度更大。\n\
    \n不管你是选品中心，还是做无货源，选品的价格区间，控制到0-100块，尤其是50块以下，对新新号会友好一些。\n\n俯瞰三档赛道，最后还是选择进入相对简单的万级赛道，来看看它分布着哪些大品类赛道，有没有你喜欢的，或者，刚好你和朋友，有货源。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_486_0.png)\n\n蜜蜂恐惧症 …… 就不费你眼了，直接上结论，占前十的大品类：\n\
    \n| 首饰 | 移动配件 | 整体造型 | 上衣 | 餐厨具 |\n|---|---|---|---|---|\n| 7.88% | 5.15% | 4.52%\
    \ | 3.99% | 3.78% |\n| 裙子 | 穿搭 | 美食 | 球鞋 | 文具手账 |\n| 3.57% | 3.15% | 3.15% | 2.84%\
    \ | 2.63% |\n\n到这里就结束了吗？不是的，首饰有很多种啊，比如戒指、吊坠等等。\n\n所以，我们取前5名，来看具体是什么品类。\n\n487/514\n\
    \n取笔记关键词放词云，知道为什么不取标题吗？因为取了分类失败……原因是带货笔记某个特点，后面告诉你。\n\n分类后，整理得到这个表，因为整体造型，和上衣重合度极高，所以我整合在了一起。\n\
    \n| 首饰 | 项链 | 手链 | 耳环 | 耳钉 | 戒指 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | 出现条数 | 33 | 18 | 10 | 9 | 2 |\n\n| 移动配件 | 手机壳 | 耳机 | 手机链 | 手机支架 | |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| 出现条数 | 41 | 2 | 1 | 1 | |\n\n| 整体造型\
    \ | 裙子 | 吊带 | T恤 | 背心 | 衬衫 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 出现条数\
    \ | 12 | 11 | 10 | 9 | 6 |\n\n| 餐厨具 | 餐具 | 咖啡杯 | 茶具 | 马克杯 | |\n| :--- | :--- |\
    \ :--- | :--- | :--- | :--- |\n| 出现条数 | 13 | 4 | 3 | 3 | |\n\n通过这个表格，就发现，手机壳的笔记也很多呀，款式花里胡哨的，咋整，不慌，那就再进一步以价格区间来缩小范围。\n\
    \n用一个透视表，揭示价格、GMV、销量，和互动量之间的内在联系。\n\n在手机壳这一块，按照10元为间隔，分为了三档：7.9-17.9的1档，17.9-27.9的2档，27.9-37.9的3档。\n\
    \n打分规则一出，高下立判：GMV、互动量越大，得分越高；销量越大，得分越低。\n\n| 价格区间 | GMV-市场占有 | 销量-发货压力 | 互动量-需求强度\
    \ | 综合得分 |\n| :---: | :---: | :---: | :---: | :---: |\n| 7.9-17.9 | 2 | 1 | 2\
    \ | 5 |\n| 17.9-27.9 | 3 | 2 | 3 | 8 |\n| 27.9-37.9 | 1 | 3 | 1 | 5 |\n\n恭喜2档以2分的差距脱颖而出，那么，接下来，就直接在里面选笔记的品了，选了就可以上货开干了！\n\
    \n且慢！\n\n刚刚完成的，是宏观分析，帮助我们快速锁定一个小区间，方便做选择。\n\n但是！即便是层层筛选，也会有我们做不来的产品，所以，需要进一步，对选中笔记的品，在进一步分析。\n\
    \n只有把微观分析也整明白了，才能彻底确定，这个品，适不适合自己做。\n\n做商品笔记微观分析的宗旨：一切回归到成本计算上来。\n\n## 带货笔记的成本分析\n\
    \n在上面筛选的区间里，挑了一个粉丝量只有100多，却带出了1.2wGMV的手机壳来分析。\n"
