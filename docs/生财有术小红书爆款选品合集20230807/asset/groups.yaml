  md: "\n第一次开始接触小红书是在22年的年初，在之前我甚至都没下载过这个平台。说明一下，我是一男的，我之前的认知里小红书是女生玩的玩意儿，原谅我的偏见，但其实到现在小红书平台的男女比例仍然处于非常不均衡的状态，这其实之中蕴藏了很多机会，下面我会讲到。\n\
