    # 5.1 大淘客服


    直接采集和大淘客的商品图片和文案。发现有很多营销文案，比如买三送一，券后78元，一次拍3份到手22元。这些内容与低价引流的价格不匹配，处理起来有点麻烦，这是一方面原因。


