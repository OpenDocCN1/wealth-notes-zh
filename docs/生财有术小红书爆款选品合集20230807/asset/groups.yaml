    \ 6.小红书怎么找到适合的货源以及快速上架\n\n前面分享完选品，接着讲解一下怎么找到适合的货源？我们这里说的普通人指的是没有货源的朋友，像我一样，一定要走无货源一件代发模式，不用囤货，你可以选择自己在网上找供应商。比如，1688就是一个不错的渠道。\n\
    \n01.我们怎么筛选1688的质优上架呢？这里有点点建议参考：\n\n001.在1688上怎么区分真假货源？\n相关生产许可证和授权证书、商品的质量保证等多方面来判断货源是否真实可靠。此外，在选择供应商时，可以点进去他店铺里查看其信用评价，了解其信誉状况，尽量避免选择未经验证的商品。\n\
    \n002.在1688上如何找到更适合自己的商品？\n可以根据自己经营的品类和目标受众，使用1688搜索栏中的“筛选”模块，选择对应的类别、品牌、价格、评价等条件，缩小搜索范围。\n\
    \n003.在和供应商接洽时，如何判断价格和货源的可谈性？\n可以收集一定数量的报价信息，进行比较和协商。坚持自己的原则，但是更要适度灵活，多思考，借助优势算力，翻阅大量历史数据，分析供应商对市场的看法等，从而得出自己最合理的谈判策略。同样，根据市场的需求量，可以预测对方的谈判底线，在合理的价格范围内展开谈判。\n\
    \n004.1688上的供应商是否可信，应该选择哪些？\n在选择供应商时，要查看其资质、信誉评价、交易记录、阅读买冢好评等多个“维度”，注意排除各类不良供应商，选择实力雄厚的顶级供应商和从长远角度合作的稳定供应商，可以极大提高合作的质量和效益。\n\
    \n02.批量上架产品工具推荐:\n打开小红书商家管理后台，点击“服务市场'”，用“摸鱼铺货、蚂蚁搬家，欢乐逛”等铺货工具，在1688、拼多多、淘宝采集产品，进行商品批量上传，单店可上架500+产品。\n\
    \n一键发货工具推荐:\n还是在小红书商家管理后台的“服务市场”，用“逸淘、爱推”等一键下单工具，进行订单核对，并一键下单发货。这些工具都不贵，且有免费的体验期，过了之后一个月也就二三十元钱，且多平台适用，能极大的解放你的双手。\n\
    \n## 7.小红书如何编辑爆款笔记，图文好还是视频好\n\n小红书图文笔记好，但是视频笔记在带货功能上优势更大，且选品不是单独选一个商品，更重要的是选择相关的带货视频，二者密不可分。\n\
    \n当你选定一个商品的时候，把同类这些视频从别的平台给搬下来，前期刚开始做可以视频混剪，后期直接拿样品自己拍摄。\n\n首先我们寻找视频来源：\n\n在抖音、快手甚至视频号里面搜索：连衣裙，看看是否有相关视频（尽量不要真人露脸的）。\n\
    \n我们需要观察的内容是：\n\n- 001.专门做单一品类的达人\n    - 是否有，决定我们是否有视频来源；\n    - 是否多，决定我们是否可以筛选最好的。\n\
    - 002.某达人的视频数量是否够多\n    - 决定我们能参考多长时间，如果只有10条，那不用一个星期就发布完了！\n- 003.达人的点赞数据、销量数据，研究他们在抖音平台做的如何。\n\
    \n选择视频很重要，要找符合小红书人群调性的视频。同样的品，不同的视频去带，效果是完全不一样的，差距十分巨大。\n\n就拿连衣裙来说，不同的话术、场景、剧情、人物，带来的购物转化效果完全不同的，一定记得去选取（混剪）更适合小红书平台的视频内容。更极端一点的例子是，你发同一个品的\
    \ ABCD 四个账号，产品、话术都相同，只是场景不同，去测试哪一个场景更适合在小红书出单！\n\n量当道，内容为王：这样做内容，低粉也能高变现，其实刚才我们做的一系列工作，都是为了内容这一步在做准备内容生产也可以流程化，比如我的内容，图片是有共性的，基本每篇笔记的一组图里，都会有产品整体展示图，细节展示图，客户反馈图。\n\
    \n文案上也有大量共性，我一天可以生产这种内容10篇以上的笔记文案，我们前期在确定内容模板的时候可以多试几个，不要觉得是不是发多了就限流了，不会的，这点放心好了，只要你内容不完全重复就行。\n\
    \n先说标题，分享一个起标题简单粗暴好用的方式，直接套用数据比较高的带货标题：\n\n小红书标题可带：\n\n- 被问了x遍\n- 我要安利给所有\n- 今年最火\n\
    - 私藏\n- 我又挖到宝啦\n- 无限回购\n- 我后悔了\n- 直接炸裂\n- 每天都\n- 被问爆了的\n- 还可以这样\n- 这也太好看了吧\n-\
    \ 真想把这个\n- 我发现了\n- 啊啊啊啊\n- yyds\n- 绝绝子\n- 宝藏\n- 神器！\n- 天呐！\n- 真香\n- 拯救我的\n\n这是文案标题的通用语气词汇汇总。\n\
    \n接下来给大家分享小红书图片的细节，前面给大家分享了视频以及文案框架，但是图片也是笔记最重要的元素之一,在发图片时，有很多细节需要考虑，下面让我们来看看应该注意事项。\n\
    \n### 01. 图片美观度\n\n首先，我们需要注意图片的美观度。美丽的图片可以让人眼前一亮，而丑陋或者不清晰的图片则会让人产生逆反心理。所以，在发表图片之前，一定要选择清晰、有质感、美观的照片。此外，在拍照时也要注意光线和角度，让照片更立体、自然和艺术感。\n\
    \n### 02. 图片大小和格式\n\n图片的大小和格式也需要注意。小红书对于上传的图片有严格的大小和格式要求，一般来说，图片最大不超过**15MB**，文件格式只支持\
    \ jpg、jpeg、png、gif、bmp、tif、tiff等几种。如果您的图片不符合要求，上传会失败或者图像质量会严重受损。\n\n### 03. 图片的水印和版权\n\
    \n当然，在发表图片时，我们还需要注意图片上的水印和版权问题。水印可以保护自己的照片不被盗用，但是如果满篇都是水印，那么用户就会感觉很烦躁，所以还是要照顾用户的心情。另外，对于盗用别人的图片，必须事先获得作者的授权，如果不遵守版权规定，可能会面临重罚款甚至被起诉的风险。\n\
    \n### 04. 图片的标题和描述\n\n标题和描述在小红书发图片时也非常重要。一个精彩的标题和生动的描述可以吸引更多用户阅读和点赞。在选择标题时，可以考虑使用一些有趣的词汇、炫酷的表达、或者话题热点，同时也要适当引导用户阅读和互动，而对于描述，可以采用生动有趣的故事叙述方式，或者从图片角度出发进行详实描述，但是请不要过于冗长或者饶舌，让读者失去阅读兴趣。\n\
    \n以上就是在小红书发图片时需要注意的几个细节，如果想要做好小红书店铺无货源，一定要重视每一个环节，精心筛选每一张图片，才能取得更多的正反馈。\n\n##\
    \ 8. 小红书的售后问题以及常见的客服话术分享\n\n当出现售后纠纷时，如何妥善解决，将损失最小化？\n\n过来人都知道，电商本身就是一个不容易的行业，有出单，有爆单，就有退货退款，商品不可能每一件都是完美无缺的，当出现售后问题，怎么处理，才能够将损失降到最低呢？\n\
    \n一般有售后的情况，我们要按照承诺给买家售后，同时也要及时跟上家沟通，了解上家的退货退款流程，跟上家说明了缘由之后，上家提供退货地址，我们这边再发给客户，客户按照地址退回之后，有了退货单号，我们再补充填到上家那边，这样两边都退，我们也没有什么损失。如果上家有运费险，那就更加方便了。\n\
    \n小红书的商品也是可以开通运费险的，不过，它的名字在平台叫运费宝，在物流工具那里可以开通。一般像有尺寸的商品，比如女装，鞋子这些商品都建议开通，因为不开通的话，如果客户因为尺寸不合适要退货，但是他们那边又不想出运费的话，就比较麻烦了。\n\
    \n开通了运费宝，其实在一定的程度上也是可以提高转化率的，或许别人就是看有运费险才放心大胆购买的。\n\n顺便提一下这个7天无理由退货，可以在上架的时候，就进行选择是否支持支持七天无理由退货，一般像水果生鲜类或者农产品可以不选择7天无理由退货，但是像女装这种退货率本身就很高的，后台是一定要选择支持7天无理由退货，这种也是可以提高店铺转化率。\n\
    \n小红书平台电商也是跟其他平台电商一样，可以设置自动回复以及关键词，设置流程为：登录小红书商家版后台，在客服-智能客服-欢迎语设置-自动回复问题设置这里进行设置。\n\
    \n常见的客服话术+促单话术给大家分享参考一下，需要的可以直接搬运或者收藏，谢谢：\n\n**欢迎语**\n\n“亲，您好！在的哦，请问您看中古店的哪个宝贝了呢?我\
    \ 可以为您介绍的呢？”\n\n“亲，您好！请问有什么可以帮助您的吗？”\n\n**尺码问题**\n\n“亲，您好，本店的XX物品所标注的尺码都是标准码，亲可以按照自己的平时穿的尺码购买，如果方便的话您也可以把您的身高体重告诉我们，我们帮您选择最合适您的款式。”\n\
    \n**色差问题**\n\n“您好,亲,我们的产品都是百分百实物拍摄的,但是由于光线及显示器的原因,可能会跟实物稍有差别,但是请您放心,我们已尽量把色差降到最低,也请您谅解！”\n\
    \n**质量问题**\n\n“亲，您好！请您放心，本店的产品在发货之前都是有做检查的，保证质量是没有问题的哦，如果您还是不放心的话，可以看看评价里面都是买家对我们家的肯定的。如果之后我们的宝贝还是出现了质量问题的话，本店是支持7天内无理由退货的哦。”\n\
    \n**发货时间**\n\n“亲，我们一般每天4点半前完成支付的订单，当天可以发货，4点半之后就要第二天发货了 但是都会尽快给您发的 这个请您放心”\n\n\
    “亲，24-48个小时左右发货的哦，这边亲放心，我们会尽快给您安排发货的。”\n\n**物流问题**\n\n“您好，亲，我们是默认中通快递的，您看中通快递您那里能到吗？”\n"
  mdcn: "\n公众号懒人找资源，懒人专属群分享\n\n16:27 经营类型\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_377_0.png)\n\
    \n## 02.养号流程\n\n注册号的账号需要养3天，这个时间段不着急改昵称，而是集中看对标，选赛道，等到3天后，发一个笔记看看流量是不是正常，一般50左右就是正常的账号。那么我们就可以开店了，切记小红书账号开店前要进行养号。\n\
    \n### 001.养号前3天注意事项\n\n第一天：账号刚注册下来，不要改头像改名字，不要动。\n\n第二天：开始养号，模仿真人去操作，刷你要做的那个领域笔记。\n\
    \n比如我打算做服装店铺，就多刷服装同行笔记，适量点赞收藏评论，一定要在30秒后才操作。\n\n第三天：继续养号，刷到这个账号首页发现页都是你的领域笔记，就算是养成了垂直号。\n\
    \n如果着急的话：上午继续养号，下午包装小红书号，发干货笔记/普通笔记测试流量，流量大于50以上算正常。\n\n### 002.干货笔记类型\n\n服装干货笔记：衣服清洁小技巧，衣服保存小技巧。\n\
    \n普通笔记：风景、生活、争议型话题笔记。\n\n如果不着急的话，第四天：上午改头像改昵称，发笔记测流量。\n\n### 003.养号期间的注意事项\n\n\
    每天早中晚刷小红书，每天刷2-3个小时，同行账号，图文/视频都可以。\n\n## 养号细节\n\n每天关注3-5个权威账号或对标账号都可以，对于喜欢的内容点赞+收藏+评论，养成一个真人操作状态。\n\
    \n## 提升账号级别\n\n小红书官方设置有自己的账号等级制度，可以依照官方的等级任务，依次完成来提升账号级别。\n\n## 注意事项\n\n建议是一机一卡一号，同一个设备不要频繁切换账号，不然会被系统检测到有问题。\n\
    \n账号权重越高，平台推荐的流量就会越多。\n\n## 4.小红书账号如何定位以及对标同行\n\n一个账号最好服务一类人群的某一类需求，因为小红书的用户画像比较集中，大多数都是年轻女性，所以，从他们身上找到某一种需求，就是你这一个账号的定位，比如水果、内衣、美甲、手机挂饰等等，总之，想要做什么，就只做什么。还有一个小细节，就是这个工作应该在养号看对标的阶段，就要进行定位了。\n\
    \n当然，除了前面的用户人群分析，如果你自己对某一个领域的深入了解，也可以作为账号定位的重要参考。\n\n比如，你本身就比较种草某一类产品的话，并且，对这一类产品非常的了解，也可以作为你的账号定位。\n\
    \n### 01.确定定位，如何找对标同行\n\n新手做任何项目，最简单粗暴的方法，就是模仿，但很多人不会模仿，很多人的模仿仅仅停留在表层，经不起深扒。\n\
    \n其实，想要模仿好，就一句话的事情：就是把对方的内容看明白，每个细节留意到位，然后用自己的话说出来。秉承这个原则，你再去找对标，去参考他们的笔记、选品、封面图、详情页等等，就知道该怎么做了。\n\
    \n首先，小红书找对标同行有三种方法：\n\n- 第一.通过笔记找店铺：\n    - 搜索你要做的产品关键词，去寻找那些近期点赞比较多的，一般短期点赞能到100以上的，都算是不错的笔记。先不管他们有没有挂车，最起码，他们的爆款笔记，是值得借鉴的。如果他们挂车了，直接去看他们的店铺，按照销量排序，把销量过千的产品也都记录下来，这就是你要选的爆品备选。\n\
    \n- 第二.通过产品找笔记：\n    - 通过一个产品，可能会找到一个关联的店铺，再通过个店铺，可能会发现好几个爆款产品，再通过新的爆款产品去寻找新的店铺，如此循环往复，其实我们可以挖到很多不错的选品。每一个店铺背后都有一堆优质的笔记，尤其是爆款产品背后，一定会有至少一篇以上的爆款笔记，这些就足以满足我们的对标内容库了。\n\
    \n- 第三.通过发现页找同行：\n    - 当我们用这个账号，经常去刷某个领域后，就会养成垂直账号，在首页发现页会推出同领域的笔记出来，首页推出的笔记质量会比较高，而且低粉爆文的账号也会有很多，在这里面找到优质的同行，可以用小号去关注，去参考他的发文方式和爆款产品。\n\
    \n## 5.小红书如何选品，以家居日用品为例拆解\n\n### 01.多平台选品\n\n找好对标，建好产品库，接下来就要去各个平台去选品了，选品平台一般是：拼多多，淘宝，京东，抖音，快手，因为这些平台都是针对\
    \ C端用户的，所以这个销量是值得参考的。就以拼多多为例，同品类**10W+**销量的商品，也都可以进入我们的选品库，同时，小红书建立起来的选品库，也都建议挨个在电商平台搜索一遍，找到销量最好的品和产品链接，一方面要作为备选产品，另一方面，后面还要参考他们产品的主图、标题和详情页，现在各个平台都支持以图识图，所以找同行还是很轻松的。\n\
    \n### 02.分析能够迅速得到正反馈的类目\n\n001、功能性半标品，比如：瑜伽服，防晒服，这一类一般满足人某一需求，防晒，减肥，都是真实强需求。\n\
    \n002、红海市场中的蓝海思路：一般是只满足于特定人群的红海产品，例如专注于大胸显小或者小胸显大的内衣，专注于小个子女鞋。\n\n003、美妆护肤品，护肤产品，如有货源且资质齐全，非常建议在小红书上笔记带货。\n\
    \n004、自带流量的产品：例如，情侣内衣，JK服，汉服等。\n\n### 03.选品注意笔记和商品颜值权重\n\n作为女性为主的社区，很多商家更倾向于上架适合拍照发笔记的高颜值商品，消费者也对这类商品更感兴趣。这甚至形成了一种趋势，一位拼多多商家表示，拼多多的流量规则是“按价格分配”，谁价格低谁推。而小红书电商正在出现“按颜值分配”的迹象，所以在选品时，商品的颜值以及高颜值的商品也可作为选品的参考对象。这并非空穴来风，深入刷过小红书的朋友都知道小红书的风格普遍偏向于好看的网红风格，或者ins风。\n\
    \n### 04.以家居日用品为例子，拆解选对品带来的正反馈\n\n小红书能做的类目非常多，目前给大家推荐推荐的这几个类目，是我们这边实操过并且有效果的，有饰品，防晒帽，水果，家居日用品，宠物用品，零食，女性用品（内衣，内裤，女装等）这些类目都是目前比较容易出效果的类目。\n\
    \n接下来就以家居日用品给大家举例子，我们在定了家居日用这个类目之后，可以先去小红书或者拼多多搜索家居日用，或者百货类的关键词，例如，先在小红书搜索家居用品，我们可以看到排名在正面的，并且销量不错的是一个收纳盒。我特意在拼多多也进行了搜索，排在正面的收纳整理栏目中，也是收纳盒，那么这个收纳盒就是一个不错的选品。\n\
    \n紧接着，我们再去1688识图搜索，看看这个收纳盒的进货价，成本价如何。我们找了一家支持一家代发的，然后点击一件代发，选择代发下单，4个收纳盒的成本价是51.2元，它在小红书的定价是4个收纳盒98.9元，其中+618活动期间是89.9元，这其中的差价和利润，我们可以简单估算一下，这一个单品总利润在28-34万这个区间浮动。就光凭一个品，简简单单，30万到手了，选对品，在小红书绝对大有可为。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_382_0.png)\n\n| 收纳整理 | 日用百货 | 家庭清洁\
    \ | 清洁工具 | 水杯餐具 |\n| :--- | :--- | :--- | :--- | :--- |\n| 低岛酒店 | 厨房烹饪 | 花开四色\
    \ | 节庆礼品 | 个人护理 |\n| 图书乐器 | 文具教具 | 宠物用品 | 畜牧农资 | 锅具水壶 |\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_382_1.png)\n\
