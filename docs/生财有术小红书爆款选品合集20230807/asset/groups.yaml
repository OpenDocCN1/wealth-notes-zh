    备注：点击查看评论详情


    ![](img/833edac43fd3eb96b57b7624b0e071d2_439_0.png)


    我们也没有什么办法彻底避免这个问题，只能发挥主观能动性，积极的想办法就应付。目前能处理的措施主要有以下几种办法：


    **1. 多公众号操作**


    当你只有1个公众号的时候会比较焦虑，当你有2个公众号时感觉有个备份焦虑会少一些，当你有5个公众号每个公众号只占20%的业务量时，基本上这种焦虑就不存在了。


    **2. 引导进群备份**。


    公众号留粉丝进群二维码，引导进群查看最新爆款、享受粉丝福利等。


    **3. 引导加好友备份**。


    通过菜单提示加客服有福利，并及时给用户打标签。如果**再在5单以上**的用户提现时，偶尔设置一些莫名其妙的"故障"，让联系客服处理后，基本上**80%**的用户可以得到多重备份。以往有封号时也基本上能挽回**80%**。


