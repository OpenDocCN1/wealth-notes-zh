    计算平均阅读数作为浮动报酬的依据。


    #### 新笔记表现


    **12** 新作品数


    本周你发布了 12 篇笔记。你发布的作品数超过了 97.7% 同城作者，本周你最受欢迎的笔记是《...）


    开局1.5元，效果不好的浮动到0.5元，0.2元。效果好的涨到2.0元，3.0元，并天天在群里拿这一二个3.0元的当榜样，不停的截他的奖励图，鼓励那些报酬少的坚持下去。综合算下来，其实平均一条笔记才几毛钱。


    ![](img/833edac43fd3eb96b57b7624b0e071d2_438_0.png)


    ![](img/833edac43fd3eb96b57b7624b0e071d2_438_1.png)


    太多细节，就不一一说得那么具体了，有些规则我自己都忘记了。。。。


    ## 七、关于风控


    做公众号的返利的都担心一个问题--就是封号，确实这个问题一直困扰着大家。


    其实2022年情况还算比较宽松，很多人反馈以前发模板消息动不动就处罚，2022年好像没有管这一块了。也确实发现很多模板消息又开始多起来了。


    业绩查询结果通知

    以下是您的订单佣金概况


    统计日期：2023.01.11 00:00-23:00


    业绩结果：今日此时段佣金：￥3012.12

