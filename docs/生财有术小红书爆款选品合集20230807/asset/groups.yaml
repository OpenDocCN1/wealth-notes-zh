    # A 文档样式设置


    # 瑜伽服拍摄合作必看


    hi小姐姐，首先感谢你接受拍摄瑜伽服的合作，为让拍摄任务进展更加顺利，避免一些不必要的麻烦，希望你能仔细阅读以下拍摄要求及注意事项


    # 拍摄说明


    我们会在 you 接受合作后将产品寄出，接收产品后首先要查验是否和聊天中提及的产品数量一致，并及时试穿是否合身，拍摄过程中请维持服装整洁，合作完成后需将产品寄回（邮费到付）


    小姐姐须在接收产品2日内开始拍摄，并在规定时间内交付全部照片。


    拍摄场景尽量选择光线充足的瑜伽室，有氧操房内，拍摄模仿下面的示例


    一个文胸（上衣）+一个裤子称之为-一组搭配，一组搭配至少拍摄7张照片，要求2张全身照，1张文胸特写，2张裤子特写，1张服装展示照+服装细节照，其余可增加训练中拍摄的照片


    所有照片


    图片比例：默认竖屏4：3，苹果原相机拍摄，无需滤镜和磨脸（可用手机自然造挡面部或佩戴黑白口罩）可搭配自己的衣服，但必须有一件为合作服装


    一组图中必须有一张照片角度和展现内容一样，用于首图


