    \ 待付款 | 1,863 |\n| 待发货 | 38,895 | | |\n\n20年初YQ原因停摆，没撑到618，团队解散，自己不死心，又一头扎进去做女装，开了一家淘宝店，从此噩梦开始，中间不表，懂的都懂，21年前后创业做女装的等于找死。\n\
