    ## 二、变现模式选择


    其实，在小红书变现主要有两种方式：


    - 1. **一定粉丝量的博主，通过接广告变现**


    我们班有位女生，平日里买了衣服之后，非常乐于在小红书分享穿搭，凭借不错的颜值➕穿搭分享，确实圈了一波粉丝


    ### 小红书主页


    ![](img/833edac43fd3eb96b57b7624b0e071d2_248_0.png)


    ![](img/833edac43fd3eb96b57b7624b0e071d2_248_1.png)


    据她所说，在她几十粉丝的时候，就陆陆续续有店家找上来，愿意免费给她提供衣服，只需要她在发小红书的时候，带上店铺名字。


    ### 早期小红书后台


    ![](img/833edac43fd3eb96b57b7624b0e071d2_249_0.png)


    在空余的时间动动手发个小红书，短短半年的时间，她已经实现了“穿衣自由”，衣橱里满满的都是商家寄给她的衣服，多到穿不完。现在她的闲置衣服转卖到闲鱼，每个月又是一笔可观的收入！


    ### 闲鱼


    ![](img/833edac43fd3eb96b57b7624b0e071d2_250_0.png)


    这其实就是第一种方式，想要获得更高报价的广告，就需要更多“粉丝”，所以核心就是围绕着涨粉来做。这也是经典的变现路径：涨粉→接广告→变现。


    ### 还被凡尔赛了


    ![](img/833edac43fd3eb96b57b7624b0e071d2_252_0.png)


    我看到我同学把小红书做得风生水起，也心动了。


    于是我和朋友开了一个“个人成长号”，分享鸡汤、个人成长语录等等。


    没过多久，我们就做到了10万赞藏，6000+粉丝，正当我以为我们要“财富自由”的时候。


    ### 小红书后台


    ![](img/833edac43fd3eb96b57b7624b0e071d2_253_0.png)


    我才发现事情并没有那么简单，因为即使我们已经 6000 多粉丝了，依然没有品牌找到我们投放！


    后来我才明白，我们这种是“泛粉”账号，粉丝都不精准，而且成长号的粉丝偏低龄化，付费能力比较差。


    就算我们靠着这种方法做到了 10 万粉，账号依然是没有多大的价值。于是我们心灰意冷，账号就没有继续再更新了。


    可见，这种涨粉→接广告→变现的模式，如果一开始的定位选错，后续即使账号做起来了，也无法得到变现，而大多数人包括我又急于得到正反馈，所以很难坚持下去。


    后来我来到了无敌姐的团队实习，成为了她的贴身助理，在无敌姐的指导下，我也开始参与公司的家居矩阵号运营。


    在公司新中式家居账号不到5000粉的时候，就引流到了一位别墅大客户，后来客户直接去了无敌姐的线下家居店，买了全套家居，还把装修交给了 我们做！


    这种变现方式简直打开了我的新世界！后来实习结束我回到学校，再自己慢慢摸索，终于领悟到了这套变现模式，这也是今天我们要说的第二种变现方法：


    - 2. 有成熟的产品/服务，通过小红书获得客户，然后引流去微信/淘宝店铺下单。


    当时我淘宝店开的是ppt设计的店铺，每日的营业额也稳定在三千元左右，但是电商平台的获客成本超级高，所以也导致了我们并不怎么赚钱。


    后来在谢无敌的红书宝社群，认识了一位同样做设计的宝友——黎不甜，从她的分享中得知设计业务在小红书的流量成本很低，而且客户质量高。


    在掌握了小红书运营知识后，她做出了自己的第一篇爆款，仅仅一篇笔记就涨粉1400多。此后，她的内容输出更精准，基本每篇笔记都能给他带来两三个客户。


    她的烦恼也从“接不到单”转变成了“单子做不过来”


    于是，她成立了属于自己的工作室，招募了几位设计师，成功转型为设计工作室主理人。现在的黎不甜，每月稳定收入3w+。


    ![](img/833edac43fd3eb96b57b7624b0e071d2_255_0.png)


    ![](img/833edac43fd3eb96b57b7624b0e071d2_255_1.png)


    在这个变现方式里，我们从第一个粉丝就要开始变现，虽然可能每篇文章阅读量只有三四百，但都是有强需求的粉丝，每天总是有源源不断的人来咨询、下单。


    再举一些例子吧


    这是一家旅行社，发布小红书笔记后，就有游客想找它成团，评论区直接问起价！


    ### 小红书后台


    ![](img/833edac43fd3eb96b57b7624b0e071d2_256_0.png)


    这是一个留学博主，也是一个网红留学公司了，他们就靠十几个小红书账号做到了留学行业的头部公司，客户都非常精准直接咨询具体的留学项目。


    ### 小红书后台


    ![](img/833edac43fd3eb96b57b7624b0e071d2_257_0.png)


    ![](img/833edac43fd3eb96b57b7624b0e071d2_257_1.png)


    这是一个保险博主，平时就在小红书分享买保险的干货，帮助用户避坑，用户看到了就咨询如何在他那里买保险。


    ### 小红书后台


    ![](img/833edac43fd3eb96b57b7624b0e071d2_258_0.png)


    ![](img/833edac43fd3eb96b57b7624b0e071d2_258_1.png)


    可见，在商业化IP的领域里，很多线下商家直接把服务搬到了线上，总的来说就是：根据自身的变现模式摸清定位，通过在小红书发布内容去吸引有付费意愿的精准粉丝，再通过引流到微信去做转化变现


    ## 三、如何打造引流账号


    接下来我会从五个方面，详细说明引流账号的打造方法。

