    # 如何挖掘出这类笔记呢？


    刚才我说要看评论区，第一个评判标准是赞评比（赞同数：评论数），我一般找那种比列比例接近1：1，甚至于1：2，总之就是评论数越多越好，而且评论内容直接表明购买意向的内容，这种我建议大家用最笨的方法去找，看你要做领域内容的大量笔记，然后不断挖掘


    不建议大家上来就借助工具走捷径，因为这个过程值得我们花时间


    而且你在找这种笔记的过程中，就会逐渐感知到你要做的产品的卖点，从而对内容方向更有把控，还可能有很多意外发现


    我们把这些笔记全部搜集下来，注意在挖掘这种笔记的时候，最好点开主页看下账号其他内容，因为一般一个账号他一篇笔记好，还会有别的类似内容，如果是他篇笔记都是如此


    恭喜你，发现宝藏，建议你把这个账号的全部内容认真搜集下来，这个可以借助工具爬下来，淘宝上有类似工具。


    也可以借助小红书数据分析工具：蝉妈妈，新红，我以新红举例吧'
