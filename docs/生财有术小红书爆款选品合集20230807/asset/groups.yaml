    # 3. 种草笔记的其他注意事项


    ## 3.1. 首图


    用户第一眼看到的就是首图，前期必须好好打磨。


    我观察下来，小红书的爆款首图要么特别美好精致，要么真实接地气，主要看类目和 IP 人设。我的产品比较网红时尚，好看精致更圈粉，所以我的图都不会太丑，每张都处理美化一下。


