    ## 5.2 商品库管理


    初期的版本是为了省事，直接配置一个从大淘客获取文案的模板就可以不用管了，系统会每天更新大淘客商品。可以省掉很多人力。


    后面发现有些款根本不能出单，比如A货，而有一些款开始出单以后，想大量的发布笔记进一步提升效果，比如某个商品一天想发100篇笔记，大淘客每个商品只有一份介绍文案，会造成大量的内容重复，效果显然不好。那么大淘客的文案，这样显然就不够用了。


    所以后面就基于商品库来维护，将评语和晒图作为文案内容。为了减少文案的审核工作量，这些基本上是全自动导入和打分过滤。比如评论中的差评会去掉，图片长宽不成比例、图片模糊等。


    其实大淘客之外，还有很多长期高佣、品牌的商品可以去推广。


    ## 5.3 采集爆文笔记


    比如用某款扫地机器人引流，发现有很多关于这个品牌这个型号的其他爆文文案。别人可能是真正的分享者，或者商家的营销团队发的，也有可能是别的原因发的，总之爆了，点赞留言几百上千。


    象这种文案，我们只需要采集并稍作修改，加入引流元素就可以使用了。并作不同的伪原创修改，弄出几分类似的文案出来。


    ![](img/833edac43fd3eb96b57b7624b0e071d2_424_0.png)


    ![](img/833edac43fd3eb96b57b7624b0e071d2_424_1.png)


    这个模式也一直在使用。


    我们用来引流变现的商品并不是固定的，每一月商品都在以往的基础上增加和删除一些，但总体上商品根据赢利状一直呈现这样的分布：


    - 60%不能出单，测试10笔左右就放弃了。

    - 40%能出单但不一定赚钱，其中又8%盈亏平衡，其中又1%的能赚钱。真好像一堆沙子里面挑金子。


    以半年时间我们一共发过的2550款商品为例：出过单的为1036款，210款盈亏平衡，30款可以赚钱。


    而这30款商品才是我们最后终于需要关注的。有的款一个月能达到1万多的佣金、有的7000、有的1000、2000元。


