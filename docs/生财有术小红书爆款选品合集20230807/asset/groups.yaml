    帖子写于6月中旬，所以文章中主要放到了5月份的营业额，现在更新一下六七月份的营业额。


    6月份由于北京天堂酒吧疫情，我们公司有一例确诊，我变成了密接，在家隔离了14天，没办法去市场选品发货，严重影响了我这个水果副业，半个月没开张，最后营业额只有5万多，还好我们基本是零成本副业，不然在家干坐的14天心态肯定受影响。


    7月份开始了水果人最难熬的淡季，听批发老板说，基本上从6月底到9月中旬前都是水果淡季，这几个月天气热，水果容易坏，所以不敢多进货。


    另外夏天水果种类很单一，主要就是瓜、桃，单价高的水果比如蓝莓草莓、樱桃、各种进口水果基本都没了，大家吃瓜最多，瓜才几块钱一斤，严重影响了对其他水果的需求。


    所以这阶段主要靠熬，我们的营业额也很明显的下降了，之前开团时平均一次100单，现在只有四五十单，营业额也降到了一个月6万左右，看了一下同行的快团团链接，还有和快递小哥交流，基本上大家的单量都明显下滑了，以前新发地直播基地一天三五千单，现在只剩一两千单了；另一个做得好的同行以前一天1000单，现在500多单。


    所以这两三个月只能靠熬过去，淡季时你不在，旺季时赚钱就没你份了。


    补充这个信息，一个是让大家有更全面的信息，这个副业的营业额并不是一直不断增长，二是提醒大家如果你想起步做这个项目，这两三个月不一定是好时机，有可能一上来没啥正反馈，缺乏一个特别能快速启动的品类（除非你敢做榴莲，劝你不要，很容易亏），反而去年冬天那个时间点，我误打误撞的赶上了草莓这个品类和项目起步比较好的时间点。


    评论区：


    - 万里：很真实的经历

    - 许老师：文章里提出了我自己的困惑，是副业更进一步加大投入，想办法发展成主业，还是到某个时间点换个交割轻一点的项目，希望各位大佬不吝赐教

    - 亦仁：主要是与主业相比，看副业的空间和机会。副业空间大、机会大、可以发展成主业，那是可以考虑更多投入。

    - 许老师：主业教育行业没有增长空间了，但现在收入还行，不过有可能哪天被裁员。

    - 副业水果目前来看转化和复购还不错，只要把流量做到一定的量，按现在淡季的情况，需要把流量扩大5倍就能和我主业收入差不多；如果到了旺季，大概两三倍流量就行；但我担心这个项目门槛低，非标属性比较强，不清楚是不是能规模化运作，所以这是比较矛盾的点。

    - 现在是主业还不是很忙，所以还能兼顾，但也只是维持副业，还缺少精力去想办法扩大。

    - 高建中-扬州-婚礼庆*：有个问题要问球友：你这发货是自己拖回家发货还是批发商代发？

    - 盗坤的提议：个人觉得这个比较难以放大，交付和售后方面太重。个人建议做到一定程度，有固定客源可以作为引流，做一些其它产品。

    - 你说的社区团购，我们以前做过，当时利润还可以，有平台供货，后来美团等入场后，做的都是客单价比较低的，而且都是一斤两斤卖，太累人利润还低就不做了。

    - 一件代发的也做，也是平台供货，因为价格比较高，在三四线做的不太好。

    - 石头头：方便留个v交流吗

    - 许老师：目前还是在批发市场自己直接当场发货，所以比较重

    - Tony：我做食品行业深有体会，水果这个品，复购率很高，只要好吃会一直买。就是售后非常难，还要有一个非常强大的团队支撑，不然一个人售后会哭。


    # # (精华帖)(183赞)我如何自建小红书运营团队，通过矩阵引流月变现 20W？


    作者： 是黄Sir呀


    日期： 2022-08-17


    # 零、前言


    大家好呀，我是至川，小红书官方MCN落鲸文化主理人。


    目前我的运营团队在小红书做出了接近10个企业号，平均每天能稳定引流150人左右，高峰期每天能引流接近400人，月平均变现20万+。


    去年暑假在@谢无敌老师 团队实习开始接触家居号小红书运营，两个月的时间里，无敌老师的线下家具店通过小红书变现400万+。实习结束后，我开始在学校做小红书企业号矩阵，基本上每天都能引流超过150人到微信，高峰的时候每天400余人。


    今天分享的这篇万字长文，也是基于这些账号运营的总结与思考。这篇文章的结构如下：


    - 一：经历介绍

    - 二：变现模式选择（我将对比目前小红书两种主流的变现方式，说明我为什么选择小红书企业号方向）

    - 三：如何打造引流账号（我将详细复盘我是怎么把从0到1把账号做起来的，细节满满）

    - 四：如何低成本扩大项目（我将站在一个小团队的主理人角度，讲一下该怎么把项目放大，包括如何扩大团队、分工、以及低成本批量制作小红书图文笔记。）


    最后，是我给的一些新人入场建议。


    如果您用电脑，可以进入飞书文档 https://cg2n3p7rvr.feishu.cn/docx/doxncr1oqlrls5Q76bCl2RjtfMb，左侧目录更适合阅读


    正文如下：


    ## 一、经历介绍


    大一时，偶然间加入了生财有术，三年的时间里一直向社群里的前辈们取经、做做小项目，我的经历也绝对是很多小白初入生财的缩影。


    最开始，因为看不懂文章，产生焦虑；后来跟着一些文章里的项目去做，但始终没做出成果，变得更加焦虑；再到后来，认准了一件事情，每天坚持进步一点点，终于我也有了
    一点小成绩。


    在遇到生财之前，我做过淘宝，高峰时还组建了百人团队，但也没得很惨。


    刚入大学后不久，我就在淘宝店铺做兼职PPT设计师，每天赚点饭钱；在大一下学期，我开了自己的淘宝店铺，主要做PPT设计，刚好赶上那一年的订单高峰期，莫名其妙就做起来了，每天GMV大概在500多元。


    我也是那时在知识星球入手了某头部的PPT设计星球，然后通过推荐页加入了生财有术。


    那时我就和我舍友们分工，组建了接近百人的线上设计师兼职接单团队。但是好景不长，随着市场淡季以及每天干预的预算过少，排名就被财大气粗的天猫店们挤下去了。


    后来我尝试过不少次重新起链接，不仅店铺没有做起来，还把之前赚的钱都亏回去了。


    也是在这个时候参加了生财有术的小航海，参加了盗神老师的淘宝蓝海训练营，才算是把淘宝底层逻辑恶补了一番，然后我们就开始运营一个小类目“音乐人”申请。


    那个时候音乐人申请单价都在150以上，而且卖家比较少，而且他们水平有点堪忧，一下子就给他们干翻了。在接近三个月的时间里，我们三个店铺都稳居前三，每月GMV都在10万+。


    好景也不长，虚拟类目经常违规，小赚了三个月后我们不仅所有的店铺都被封，而且新来的同行们一个比一个专业，价格一个比一个低。这个类目就没有做下去了。


    后续我们选了小众的茶类目、编曲，都没有做起来，加上去年平台的一些变动，反倒是同样亏了不少。


    电商平台真的是需要很大的成本撬动，而小红书完全没有什么成本，这也是后来我们觉得小红书真香的原因之一。


    在我大二的下学期，我就一直在生财有术寻找项目，看到什么就试一试，不仅什么事情都没有干成，心也一直处于浮躁的状态。


    这一切的转折都在大二的暑期，我在生财社群里认识了@谢无敌老师，然后很幸运地加入了闪亮猫团队，成为她的贴身助理（喵呜一代），也参与了无敌姐姐的家居矩阵号搭建，在我们的操作下，无敌老师的线下家具店变现增加**1000**万。


    去年暑假实习结束后，我开始在学校做小红书企业号矩阵，基本上每天都能引流**150+**人到微信，高峰的时候每天**400**余人。


    后端变现我们接的都是客单比较高的咨询服务业：签证咨询、机票代理、出入境相关、音乐教学、设计……单粉价值相对比较高。


