    要提高我们的笔记权重，就是要更多的去引导评论和关注，点赞收藏的权重是很低的。


    所以我们可以评论区引导(点赞+评论+关注)，这样就可以做到权重最大化。


    结合我们引流的需求，可以让用户点赞关注后在评论区扣关键词，关键词可以设置成有引导作用的词，比如求带、想了、求分享等。


    还可以用水军评论几个，做领头羊带节奏，后面来的人就知道发生了什么事，也会跟风评论。


    当评论区越来越热闹的时候，笔记的热度也会越来越高。


