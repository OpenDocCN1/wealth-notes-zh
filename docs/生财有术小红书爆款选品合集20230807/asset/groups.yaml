    我来一个个说，先说内容展现形式，这个非常重要，关键在于如何找到真正能赚钱的笔记，再强调一遍，是**能赚钱的笔记**，而不是数据好的笔记


    我很喜欢马斯克的第一性原理模型：回溯事物本质，重新思考该怎么做。


    而找到**真正能赚钱的笔记**，并做对标，这就是我们做小红书的核心


    再例如电商的核心就是选品，做自媒体的核心就是内容。核心只占系统的**20%**，但是解决了它就是解决了**80%**的问题，找赚钱笔记这点@徐冬冬大佬这篇文章对我的启发很大


    https://articles.zsxq.com/id_61nswd110ikb.html


    在大家认知里出爆文=能赚钱，这是错误的，比我我下面这篇笔记，数据上看只有**80**个点赞，绝对算不上数据好，但看评论区有快**200**多个直接问“怎么买？”“有链接么”的精准客户


    这一篇笔记可以带来至少**500**多精准流量，转化掉一半不成问题'
