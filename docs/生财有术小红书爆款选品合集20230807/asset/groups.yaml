    \n## 4. 引流变现\n\n小红书一直想做站内转化，给知识付费的商家开通了专栏，给带货商家开通了店铺。\n\n### 店铺与专栏\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_300_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_300_1.png)\n\n但是转化率真的是太太太低了，高客单价产品还是要想办法引流到微信去做成交。\n\
    \n### （1）引流\n\n小红书对于私信引流一直都有一个阈值，只要不超过一个量，引流操作还是可以进行的。\n\n目前我所有的引流账号都认证了企业号，认证完企业号后，每天的私信人数控制在30人以下，目前还没有大规模出现问题。\n\
    \n如果当日咨询的人数不够，就私信粉丝以及点赞和收藏笔记的人，凑够30人。\n\n如果你的账号是个人号，就不要大规模去私信，只需要回复粉丝的咨询就可以啦！当心隔天会受到引流的违规提示。\n\
    \n### （2）朋友圈变现\n\n引流和转化是完全两个事情，我们从小红书吸引了用户加我们微信之后，他可能不会立即付费。\n\n特别是做高客单的，用户一般会观察一段时间，觉得靠谱之后再付费，所以我们的朋友圈一定要经营好，利用好朋友圈展示自己的产品和服务。\n\
    \n我以前也挤不出字，经常不知道怎么发朋友圈，后来和圈友柠柠讨论之后，我也总结了一套发朋友圈的方法。\n\n#### 01 文案优化对比\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_302_0.png)\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_302_1.png)\n\n### 好的朋友圈到底长什么样\n\n首先，朋友圈一定要美观，看上去很舒服，只要美观而且可读性很强，发再多的量也是有人看的。\n\
    \n#### 朋友圈案例\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_303_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_303_1.png)\n\
    \n反之，如果是直接产品刷屏，不仅会被用户拉黑，而且也会被微信系统屏蔽。\n\n如何做到朋友圈美观呢？我认为有以下几点：\n\n- 1. 排版\n- 2.\
    \ 主题\n- 3. 文案内容\n\n**① 排版**\n\n我不太喜欢看密密麻麻都是文字的朋友圈，看起来特别挤。\n\n**朋友圈有点“挤”**\n\n\
    ![](img/833edac43fd3eb96b57b7624b0e071d2_304_0.png)\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_304_1.png)\n\
    \n所以我建议先写两句话的开头，然后中间再空出写正文部分，当然这和个人喜好也有关系。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_304_2.png)\n\
    \n**文案案例**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_305_0.png)\n\n**② 主题**\n\
    \n也就是解决“发什么”的问题，朋友圈一定是把生活和营销结合起来。\n\n但是生活又不完全是生活，每一条朋友圈都需要表达出自己想被人看到的方面。\n\n这样说可能有点抽象，给大家举个例子吧。\n\
    \n**文案案例**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_306_0.png)\n\n说实话，看完柠柠的每条朋友圈我都有付费的冲动。\n\
