    那如何选品呢？


    1.其他平台火过的产品


    如果在其他平台有选品经验并且已经能够跑通销售，那么拿来小红书开店一定也是适合的，比如我们在操作闲鱼无货源的时候把以往的产品拿来小红书销售也照样能出单。


    2.热点周边及时选品


    比如，近期热门的电视剧就带动了很多周边，比如同款的穿搭，同款的饰品同款的鞋子等等..一系列的产品。


    3.细分垂直领域选品


    比如，我卖母婴产品这个范围很大，要输出内容的范围很广，如果做合集推荐不容易出单，我换成婴儿推车这个就是细分领域出单就容易了。


    4.小红书用户属性热门赛道


