    # 二、小红书选品实操


    目前小红书平台还处于高溢价阶段，拼夕夕几块钱的产品能在小红书卖十几二十几块。


    有一定的价格差，所以操作空间很大。


    例如：


    # 笔记 | 商品 | 收藏


    * 综合

    * 销量

    * 新品


    ![](img/833edac43fd3eb96b57b7624b0e071d2_164_0.png)

    苹果手机壳 iphone 透紫色卡通兔子工作字母 支架

    满 30 减 3

    ¥19.8


    ![](img/833edac43fd3eb96b57b7624b0e071d2_164_1.png)

    苹果手机壳 iphone 新年红立体小胖熊文字 防摔硅

    满 30 减 3

    ¥24.8


    ![](img/833edac43fd3eb96b57b7624b0e071d2_164_2.png)

    适用苹果手机壳 iphone


    ![](img/833edac43fd3eb96b57b7624b0e071d2_164_3.png)

    苹果手机壳 iphone 卡通


    165/514


    那如何选品呢？


    1. 其他平台火过的产品


    如果在其他平台有选品经验并且已经能够跑通销售，那么拿来小红书开店一定也是适合的，比如我们在操作闲鱼无货源的时候把以往的产品拿来小红书销售也照样能出单。


    2. 热点周边及时选品


    比如，近期热门的电视剧就带动了很多周边，比如同款的穿搭，同款的饰品、同款的鞋子等等...一系列的产品。


    3. 细分垂直领域选品


    比如，我卖母婴产品这个范围很大，要输出内容的范围很广，如果做合集推荐不容易出单，我换成婴儿推车这个就是细分领域，出单就容易了。


    4. 小红书用户属性热门赛道


    小红书目前热门的赛道有：饰品、服装、家居、美妆、护肤、食品...


    女性喜欢什么只要研究一下就可以了，如果还不知道就打开5118数据平台搜索一下吧！


    而且做女性赛道产品基本利润都会比较高，可以选择一单50以上，一天出个几单，偶尔还会爆单美滋滋。


    # 三、小红书店铺运营


    小红书开店账号垂直度很重要。


    不要当天注册就开始直接发笔记，建议养号2-3天。先把产品选好、产品上架之后再开始发笔记。


    顺序是这样的：开店-上架-发内容。


    小红书输出形式很重要。


    如果选择视频，尽量自己拍视频。目前也是视频展示的流量会比较大。如果是混剪的话过不了薯条，只能靠系统自动去推流。最好是原创，一般商家也很愿意提供样品，你提供运费就可以了。


    有了实物你可以拍几十上百个视频，这样内容输出就不会断了。


    小红书上架后台的成长任务一定要做的，因为会送推广券，相当于可以不花钱就投薯条，获得更大的流量和爆文的几率。我推广都是只花1薯币。


    | 推广方式 | 营销推广 |

    | :--- | :--- |

    | 预计推广人次 | 5000 |

    | 期望提升 | 新品访问量 |

    | 优投模式 | 已启用 |

    | 目标人群 | 自定义推广人群> |

    | 支付方式 | 零币钱包 |

    | 订单金额 | 750金币 |

    | 支付金额 | 137币 |

    | 预计推广时长 | 12小时 |


    这也是平台送了流量，不要白不要。而且前期用的好能爆单。可以这样找到爆款内容参考，找到超越爆款内容的细节或者结合热点细节，一直用免费的薯条券推这个笔记（爆款内容就是那种评论区都是问怎么买的）。


    一般我的推广会选择**12-24小时**，选择垂直类目，选择女性，根据店铺产品属性选择人群。如果选择极速投放的话，没2小时就消耗光了，这时候没出单推广基本白给。


    我每天都会花上**1个小时**的时间选品找近期爆款笔记，然后建立素材库。


    会花半个小时时间比价、改价、优化标题、上架产品。


    再花半个小时查看其他平台的商品和近期热点。


    花**1-2个小时**写笔记优化内容。


    现在已经开了五家店，给助理在运营。


    有几个赛道：服装、潮玩、家居、数码配件、鞋子。


    # 四、小红书批量引流


    我把我做私域的思路搬过来做小红书店铺。


    找兼职来发笔记，然后往店铺导流，实现店铺的曝光和关键词的优化。


    只要用户搜索某个关键词看到的都是在推荐我的店铺。


    每天文案兼职产出文案，通过助理分发给代发兼职，并在笔记当中推荐店铺评论引导。


    另外在成交之后会做一个动作就是往自己的私域去导流做售后，因为平台的流量如果不能做到私域，复购的几率很低。所以这也是我做小红书店铺的原因，通过更大的曝光来壮大我的私域流量池。


    至于，如何找兼职，如何找代发，我之前有说过，这里就不再详细描述。


    还可以建立选品库与合伙人批量开店：


    - 小红书选品库

    - 小红书无货源问题答疑

    - 小红书无货源选品


    # 五、小红书建议思考


    小红书电商目前来讲很多电商头部都还没大量的进入，所以竞争不是太激烈，可以参考2年前的闲鱼无货源。


    上架一个产品根本不需要维护就能出单，小红书目前的情况也是如此，门槛相对比较低，能够提升自己对于图片的网感和文案的能力。


    如果能在平台给与扶持的时候入局实战，一定会得到不错的反馈。


    如今电商平台都在往内容种草的方式发展，而小红书本身就是一个内容种草平台，用户的信任度会更高，质量也会更高。


    但是我认为一个动作始终要做，就是往自己的私域流量池来积累客户。我发现很多人做电商做了2-3年，可能店铺是红利过了，也可能是竞争更激烈了，店铺不出单就断了自己收入来源了。那如果把客户做到私域，用心的去维护客户，能够裂变不说还能一直获得收入。所以我也一直坚持在私域这个领域一做就是8年。


    以上，就是关于小红书无货源的实操分享，有问题欢迎在评论留言。


    欢迎交流，一起进步！


