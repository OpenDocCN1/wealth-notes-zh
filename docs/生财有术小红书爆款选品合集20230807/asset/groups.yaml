    而且做女性赛道产品基本利润都会比较高可以选择一单50以上一天出个几单偶尔还会爆单美滋滋'
  - '[PAGE 166]


    # ## 三、小红书店铺运营


    小红书开店账号垂直度很重要


    不要当天注册就开始直接发笔记建议养号2-3天先把产品选好的产品上架之后在开始发笔记


    顺序是这样的：开店-上架-发内容


    小红书输出形式很重要


    如果选择视频尽量自己拍视频，目前也是视频展示的流量会比较大，如果是混剪的话过不了薯条


    只能靠系统自动去推流，最好是原创，一般商家也很愿意提供样品你提供运费就可以了


    有了实物你可以拍几十上百个视频这样内容输出就不会断了


    小红书上架后台的成长任务一定要做的因为会送推广券相当于可以不花钱就投薯条获得更大的流量和爆文的几率


    我推广都是只花1薯币'
  - '[PAGE 167]


    | 推广方式 | 营销推广 |

    | :--- | :--- |

    | 预计推广人次 | 5000 |

    | 期望提升 | 新品访问量 |

    | 优投模式 | 已启用 |

    | 目标人群 | 自定义推广人群> |

    | 支付方式 | 零币钱包 |

    | 订单金额 | 750金币 |

    | 支付金额 | 137币 |

    | 预计推广时长 | 12小时 |


    这也是平台送了流量不要白不要，而且前期用的好能爆单，可以这样找到爆款内容参考，找到超越爆款内容的细节或者结合热点细节，一直用免费的薯条券推这个笔记（爆款内容就是那种评论区都是问怎么买的）


    一般我的推广会选择**12-24小时**，选择垂直类目选择女性根据店铺产品属性选择人群，如果选择只能投放的话没2小时就消耗光了，这时候没出单推广基本白给。


    我每天都会花上**1个小时**的时间选品找近期爆款笔记然后建立素材库


    会花半个小时时间比价改价优化标题上架产品


    再花半个小时查看其他平台的商品和近期热点


    花**1-2个小时**写笔记优化内容


    现在已经开了五家店给助理在运营


    有几个赛道：服装、潮玩、家居、数码配件、鞋子'
