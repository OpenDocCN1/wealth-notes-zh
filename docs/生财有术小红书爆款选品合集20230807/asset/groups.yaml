    # 都开通了小红书企业号，且为矩阵化运营


    # 为什么要开通企业号？


    小红书用户的目的就是狩猎好物，企业号可以直接通过展示产品来吸引目标客户，就可以把企业号理解成一个虚拟线上店铺，这个店铺可以直接摆放产品，直接叫卖，是交了入驻（baohu)费的。


    而个人账号就像没有执照的小商贩，是要被城管（官方）随时赶走的...更别说叫卖了


    总结下小红书企业号的优势：


    内容创作更加直接，缩短变现链路，开通即可投流，营销工具多，运营成本低，引流很精准


    PS：企业号并不是必需的，如果有营销需要，建议开通


    # 什么是矩阵号，为啥要做矩阵？


    矩阵号带货说话，就是一批货通过多账号运营，比如这样子的'
