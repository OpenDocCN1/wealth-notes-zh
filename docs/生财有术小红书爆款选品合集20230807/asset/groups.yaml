    每个月只要有10个这样款，就基本上可以维持住几W的佣金收入，确保投入产出的平衡，甚至在引流的过程中赚钱。


    如果有选款经验丰富，我感觉还可以节省50%以上的选款、测款成本。没有经验的话也可以慢慢积累好款，比如2022年5月开始的款我们明年就可以继续翻出来再推广。


    2022年11月24日下午8:40


    还有个观察分析跟你同步一下。


    现在我们库里超过5000佣金，就这四条。


    佣金有4.2万。


    这个现象分2方面来看。


    好的方面：说明找到一个好款可以顶半边天，这个款越多越好搞。


    坏的方面：目前没有形成有效的梯度，良好的情况应该是5000以上4条，1000-5000有20-30条。1000以下有100-200条。


    这样才能不断形成后补队伍。


    说到这里，还需要强调一点的是，其实我们最初只是为了引流的，图的是用户的留存和后续变现，并没有想着马上赚钱，而实际情况是我们在引流的过程中新粉就已经赢利了。


    我们在**10月份**就观察这个现象，并在内部调整选款和引流的侧重点。即：在确保任务足够多，养着大量兼职的情况下，还要着重商品选款和优化引爆商品的操作。


