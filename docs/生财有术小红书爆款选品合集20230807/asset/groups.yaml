  md: "\n公众号懒人找资源，懒人专属群分享\n\n16:27 经营类型\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_377_0.png)\n\
    \n## 02.养号流程\n\n注册号的账号需要养3天，这个时间段不着急改昵称，而是集中看对标，选赛道，等到3天后，发一个笔记看看流量是不是正常，一般50左右就是正常的账号。那么我们就可以开店了，切记小红书账号开店前要进行养号。\n\
    \n### 001.养号前3天注意事项\n\n第一天：账号刚注册下来，不要改头像改名字，不要动。\n\n第二天：开始养号，模仿真人去操作，刷你要做的那个领域笔记。\n\
    \n比如我打算做服装店铺，就多刷服装同行笔记，适量点赞收藏评论，一定要在30秒后才操作。\n\n第三天：继续养号，刷到这个账号首页发现页都是你的领域笔记，就算是养成了垂直号。\n\
    \n如果着急的话：上午继续养号，下午包装小红书号，发干货笔记/普通笔记测试流量，流量大于50以上算正常。\n\n### 002.干货笔记类型\n\n服装干货笔记：衣服清洁小技巧，衣服保存小技巧。\n\
    \n普通笔记：风景、生活、争议型话题笔记。\n\n如果不着急的话，第四天：上午改头像改昵称，发笔记测流量。\n\n### 003.养号期间的注意事项\n\n\
    每天早中晚刷小红书，每天刷2-3个小时，同行账号，图文/视频都可以。\n\n## 养号细节\n\n每天关注3-5个权威账号或对标账号都可以，对于喜欢的内容点赞+收藏+评论，养成一个真人操作状态。\n\
    \n## 提升账号级别\n\n小红书官方设置有自己的账号等级制度，可以依照官方的等级任务，依次完成来提升账号级别。\n\n## 注意事项\n\n建议是一机一卡一号，同一个设备不要频繁切换账号，不然会被系统检测到有问题。\n\
    \n账号权重越高，平台推荐的流量就会越多。\n\n## 4.小红书账号如何定位以及对标同行\n\n一个账号最好服务一类人群的某一类需求，因为小红书的用户画像比较集中，大多数都是年轻女性，所以，从他们身上找到某一种需求，就是你这一个账号的定位，比如水果、内衣、美甲、手机挂饰等等，总之，想要做什么，就只做什么。还有一个小细节，就是这个工作应该在养号看对标的阶段，就要进行定位了。\n\
    \n当然，除了前面的用户人群分析，如果你自己对某一个领域的深入了解，也可以作为账号定位的重要参考。\n\n比如，你本身就比较种草某一类产品的话，并且，对这一类产品非常的了解，也可以作为你的账号定位。\n\
    \n### 01.确定定位，如何找对标同行\n\n新手做任何项目，最简单粗暴的方法，就是模仿，但很多人不会模仿，很多人的模仿仅仅停留在表层，经不起深扒。\n\
    \n其实，想要模仿好，就一句话的事情：就是把对方的内容看明白，每个细节留意到位，然后用自己的话说出来。秉承这个原则，你再去找对标，去参考他们的笔记、选品、封面图、详情页等等，就知道该怎么做了。\n\
    \n首先，小红书找对标同行有三种方法：\n\n- 第一.通过笔记找店铺：\n    - 搜索你要做的产品关键词，去寻找那些近期点赞比较多的，一般短期点赞能到100以上的，都算是不错的笔记。先不管他们有没有挂车，最起码，他们的爆款笔记，是值得借鉴的。如果他们挂车了，直接去看他们的店铺，按照销量排序，把销量过千的产品也都记录下来，这就是你要选的爆品备选。\n\
    \n- 第二.通过产品找笔记：\n    - 通过一个产品，可能会找到一个关联的店铺，再通过个店铺，可能会发现好几个爆款产品，再通过新的爆款产品去寻找新的店铺，如此循环往复，其实我们可以挖到很多不错的选品。每一个店铺背后都有一堆优质的笔记，尤其是爆款产品背后，一定会有至少一篇以上的爆款笔记，这些就足以满足我们的对标内容库了。\n\
    \n- 第三.通过发现页找同行：\n    - 当我们用这个账号，经常去刷某个领域后，就会养成垂直账号，在首页发现页会推出同领域的笔记出来，首页推出的笔记质量会比较高，而且低粉爆文的账号也会有很多，在这里面找到优质的同行，可以用小号去关注，去参考他的发文方式和爆款产品。\n\
    \n## 5.小红书如何选品，以家居日用品为例拆解\n\n### 01.多平台选品\n\n找好对标，建好产品库，接下来就要去各个平台去选品了，选品平台一般是：拼多多，淘宝，京东，抖音，快手，因为这些平台都是针对\
    \ C端用户的，所以这个销量是值得参考的。就以拼多多为例，同品类**10W+**销量的商品，也都可以进入我们的选品库，同时，小红书建立起来的选品库，也都建议挨个在电商平台搜索一遍，找到销量最好的品和产品链接，一方面要作为备选产品，另一方面，后面还要参考他们产品的主图、标题和详情页，现在各个平台都支持以图识图，所以找同行还是很轻松的。\n\
    \n### 02.分析能够迅速得到正反馈的类目\n\n001、功能性半标品，比如：瑜伽服，防晒服，这一类一般满足人某一需求，防晒，减肥，都是真实强需求。\n\
    \n002、红海市场中的蓝海思路：一般是只满足于特定人群的红海产品，例如专注于大胸显小或者小胸显大的内衣，专注于小个子女鞋。\n\n003、美妆护肤品，护肤产品，如有货源且资质齐全，非常建议在小红书上笔记带货。\n\
    \n004、自带流量的产品：例如，情侣内衣，JK服，汉服等。\n\n### 03.选品注意笔记和商品颜值权重\n\n作为女性为主的社区，很多商家更倾向于上架适合拍照发笔记的高颜值商品，消费者也对这类商品更感兴趣。这甚至形成了一种趋势，一位拼多多商家表示，拼多多的流量规则是“按价格分配”，谁价格低谁推。而小红书电商正在出现“按颜值分配”的迹象，所以在选品时，商品的颜值以及高颜值的商品也可作为选品的参考对象。这并非空穴来风，深入刷过小红书的朋友都知道小红书的风格普遍偏向于好看的网红风格，或者ins风。\n\
    \n### 04.以家居日用品为例子，拆解选对品带来的正反馈\n\n小红书能做的类目非常多，目前给大家推荐推荐的这几个类目，是我们这边实操过并且有效果的，有饰品，防晒帽，水果，家居日用品，宠物用品，零食，女性用品（内衣，内裤，女装等）这些类目都是目前比较容易出效果的类目。\n\
