    \n#### （3）闲鱼等平台找兼职\n\n说实话，闲鱼还是一个很优质的平台，你可以去一些技能服务相关的卖家留言。\n\n比如剪辑视频、画画、代做XX、PPT设计等等，只是你觉得人群相匹配就可以。\n\
    \n**闲鱼等找兼职**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_314_0.png)\n\n然后就可引流到微信去，同样的只要加到了一个学生之后，就可以让他拉你进相关的群，或者推荐好友。\n\
    \n#### （4）我自己的团队\n\n因为我也是大学生，和我一起做的大多数是身边认识的人，平时待在一起久了，也更容易知道这个人做事风格、靠不靠谱。\n\n\
    如果你也有朋友、家人是大学生，不妨好好利用好这波资源，同时也带动大学生赚赚零花钱。\n\n同时我也要感谢我们学校的创业孵化基地收留了我们一群人。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_315_0.png)\n\
    \n让我们在学校内就有一个比较好的工作环境，说实话线下的工作效率要比线上高很多很多倍。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_316_0.png)\n\
    \n如果你也是大学生，也可以向自己学校申请一件办公室什么的，对于后续业务的开展也很重要！\n\n### 3. 完善SOP\n\n#### （1）完善工作手册\n\
    \n招人之前其实就要明确好，设置好什么岗位。\n\n我们是把选题、文案、图片、视频几项业务分开，每个人只需要负责好其中的一个部分。\n\n每个人招募进来后，都需要给他们培训，我一般是现场演示一遍给他们看，然后分发一份他岗位的工作手册。\n\
    \n**完善工作手册**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_317_0.png)\n\n因为新人还不是特别能明白我们具体是干什么的，所以需要有一份明确的工作手册指引他们，下一步需要干嘛干嘛。\n\
    \n那工作手册该如何做呢？\n\n- ① 自己跑一遍业务，然后从头到尾记录下来\n- ② 尽可能把所有工作流程化，就像生产线一样\n\n如果说你的工作手册，扔给任何一个人都能看得懂并且按照内容一步两步进行操作，那这就是一份合格的工作手册。\n\
    \n#### （2）设置好 KPI，淘汰机制\n\n同一件事情，不同的人做会产生天差地别的效果。\n\n我们一定要学会筛选出靠谱的人，其实咱们这些事情只要肯用心，每个人都可以做得很好。\n\
    \n以前我总是认为“教”很重要，毕竟没有人一开始就会，碍于朋友面子，也没有什么淘汰机制。\n\n这样子的团队必定是散漫的！现在我都给大家列出了每天需要做的事情，每个人做完后就在对应的位置打勾＋附上链接，一目了然。\n\
    \n**设置工作任务**\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_319_0.png)\n\n如果有人一直持续不能完成自己的工作，那没办法只能换人了，而且我们数据透明，被淘汰的人也不会有什么异议。\n\
    \n只要把这些内容安排好，我们团队就是一台高效率的生产线，每天都在源源不断生产优质内容。\n\n## 四、写在最后\n\n有人会觉得，爆款都是靠的运气，现在做自媒体真的太晚了。\n\
    \n只有经历过的人才知道：抛开运气，没有捷径。偶尔一篇爆文可能真的是运气，但是持续输出爆文的能力绝对不止靠运气。\n\n在我和家人朋友们说起我在做小红书的时候，他们都会以为我是写文案的或者拍视频的。\n\
    \n但其实在自媒体如此商业化的时代，文案或者视频只是一种表现形式，更重要的是对账号内容方向和定位的把控能力。这也是我这篇文章内附这么多举例和图片最主要的原因之一，希望你们看完之后能有收获呀！\n\
    \n小红书是我接触到的这么多的项目之中，上手难度比较低，且收益是长久的。\n\n我最开始也只是做一个音乐制作的账号，在跑通了一个类目后，我迅速把成长类目、留学、设计的账号做了起来，还接到了机票和签证咨询的代运营。\n\
    \n所以在跑通一个类目之后，可以迅速把能力迁移到其他的类目中去。真的具有无限的可能！\n\n如果你没有更好的副业选择，小红书是一个很不错的 项目，一开始或许会有点煎熬，但是坚持下去效果绝对会远超预期。\n\
    \n这一路上的成长皆遇良人，真的很感谢@谢无敌@喵小C@K哥@欧歌圈友们的信任，也在生财结交到了很多志同道合的朋友，感谢你们的一路相伴，也让我这个普通人的大学生活有了一些不一样的经历，让我看到了这个世界更多的可能。\n\
