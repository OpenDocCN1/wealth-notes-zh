    # 缇春慢花季 千呼万唤使出来，终于出货啦‼️  历时两周，在各位宝子后台不断的♥催货情况下终于安排出来啦嘤嘤战


    - 现在可以发的样板色有： 1：可可蛋奶 2：珍珠白 3：杏子灰 4：伦敦雾 5：奶咖色


    不得不说这几个神仙颜色真的好看，拍照拍不出十分之一，难怪宝子们后台疯狂嗑⛄⛄⛄


