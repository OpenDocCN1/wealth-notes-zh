    \ 1000 +2000流量 已完成 0/1 去发布\n\n- 任务期间成交至少1单 +4000流量 已完成 0/1 去带货\n\n每天11:00前更新数据，奖励任务结束后发放\n\
    \n了解了流量来源之后就可以上架产品了，如果做的无货源可以直接从电商平台直接搬运过来很多工具都有免费的试用\n\n小红书的后台有着电商的工具可以使用，同步过来然后去后台改价\n\
