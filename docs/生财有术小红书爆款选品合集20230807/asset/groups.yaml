    ![](img/833edac43fd3eb96b57b7624b0e071d2_218_0.png)


    但团完发完货很快麻烦也来了，碰到水果生意最常见的问题了 — 售后。


    草莓太娇嫩了，有快递完后草莓磕磕碰碰坏一部分的，也有说缺斤短两要补差价的（批发市场算毛重2斤，我们没特别标注，顾客要按照净重2斤算），还有的直接整盒草莓被暴力快递摔全坏的，总之我们本着做回头生意的原则，都赔到位了，最后这1000的利润赔了一半。


    这是第一次我们感受到水果行业的不容易。


    副业就这么开始了，一周开1-2次草莓团，然后隔天去批发市场发货，第一个月卖了300多盒草莓，4万的营业额，利润7千块左右，小红书引流的私域四五百人，快团团的转化率也稳定在10%左右。


