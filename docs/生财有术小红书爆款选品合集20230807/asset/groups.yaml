    ## 七、关于风控


    做公众号的返利的都担心一个问题--就是封号，确实这个问题一直困扰着大家。


    其实2022年情况还算比较宽松，很多人反馈以前发模板消息动不动就处罚，2022年好像没有管这一块了。也确实发现很多模板消息又开始多起来了。


