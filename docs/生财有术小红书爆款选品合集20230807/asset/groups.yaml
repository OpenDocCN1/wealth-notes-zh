    \ 说点什么...\n\n❤️ 686  ⭐ 475  \U0001F31F 610\n\n118 / 514\n\n### 如何挖掘出这类笔记呢？\n\n\
    刚才我说要看评论区，第一个评判标准是赞评比（赞同数：评论数），我一般找那种比例接近1：1，甚至于1：2，总之就是评论数越多越好，而且评论内容直接表明购买意向的内容。这种我建议大家用最笨的方法去找，看你要做领域内容的大量笔记，然后不断挖掘。\n\
    \n不建议大家上来就借助工具走捷径，因为这个过程值得我们花时间。\n\n而且你在找这种笔记的过程中，就会逐渐感知到你要做的产品的卖点，从而对内容方向更有把控，还可能有很多意外发现。\n\
    \n我们把这些笔记全部搜集下来，注意在挖掘这种笔记的时候，最好点开主页看下账号其他内容，因为一般一个账号他一篇笔记好，还会有别的类似内容，如果是多篇笔记都是如此，恭喜你，发现宝藏，建议你把这个账号的全部内容认真搜集下来，这个可以借助工具爬下来，淘宝上有类似工具。\n\
    \n也可以借助小红书数据分析工具：蝉妈妈，新红，我以新红举例吧。\n\n![](img/833edac43fd3eb96b57b7624b0e071d2_119_0.png)\n\
    \n在热门内容选项键入你要做的美目关键词，然后按评论数排序。\n\n不要按照赞藏数，赞藏只是糖衣炮弹，对于带货笔记来说没有参考意义，而评论数据可以，找那些评论多，且直接问产品链接的笔记。\n\
    \n![](img/833edac43fd3eb96b57b7624b0e071d2_119_1.png)\n\n借助数据工具，我们也可以找到真正的热度词，在文案中植入，增加内容的搜索曝光。\n\
    \n说白了就是蹭热度，主动Search的用户会高频次地使用小红书的搜索功能，特别是在品牌集中增加营销投放或是有新产品发布等较大事件时，小红书中关于该品牌的搜索量会明显上升。“大家在把小红书当搜索引擎用”，这是众多小红书用户的心声。\n\
    \n那我要做的就是借力，比如今年瑜伽服品牌lululemon热度很高，甚至于lululemon这个关键词的热度，要高于瑜伽服这个品类词，那我们就可以在文案中多次植入。\n\
