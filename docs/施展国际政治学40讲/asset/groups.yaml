    \n> **古娜**\n> 想请教老师一个问题\n> 美国人和中国科学家都反对，已经证明的存在在方法论和科学实证，但是很多人难以相信这个力量在当今社会的影响力居然有如此之大？\n\
    >\n> 科学只能告诉你它怎么做事，却无法告诉你为什么要做这件事。任何人可以被科学化的事物，都能说去其意义性。意义感的根基存于在自我意识上，意义感化的根源是在它自身是无法被科学化的。所谓意义，不但指这个，实际上在中国很多人不信仰，不管你信不信，它都在世界上发生，它不只是别人相信的宗教，它本身就是解人们如何想感情事情的。它真的知道如何跟对方打交道。\n\
    \n> **田凌 孟长**\n> 施展老师很讲究，真的像看一部连续剧一样，不论是中历史研究，国政研究，人类在这个地球上不断上演着历史的大剧，精彩纷呈。唏嘘感叹，当真正置身历史的深处，然后再跳出来，站在历史的视角，会感慨历史的鬼山山上，或者从更客观的心态，会感慨人类的渺小。你与伟大，短暂与卑微，无知与迅默。人类竟然与人类可以这么良民无天道德，那么宽容又那么自私。另一方面，你会觉得那些历史在留上的文字记录宏大，影像精彩，在细读和重塑历史长河时，感叹宏大的波澜壮阔的历史长河，真的是以小了坏了，太伟大了。\n\
    > 历史学给了我更多观察世界甚至观察自己的视角。\n\n> **山崎**\n> 美苏两国这种相互对抗又相互依存的关系模式，在航天事业上体现的最为明显。\n\
    > 美苏两国的航天事业发端于冷战德国的V2火箭，只不过二战结束后，美国抢到了V2火箭的总设计师冯布兰德，苏联则得到了V2火箭的总设计师冯布兰德。从苏联的V2火箭开始，到苏共第一颗人造卫星升空，第一只太空狗，第一只宇宙第一颗人造卫星。第二个月球探测器，从第一太空人加加林，人类第一次太空漫步，苏联的航天技术将美国远远抛在身后。\n\
    > 冷平局势的转，苏联第一颗人造卫星，由于官僚体制，没有美国一开始不到位，不得不借助苏联技术给小国苏维埃做科研教育，随着苏联航天技术的进一步发展，布兰特的机会来临了。美国采用紧急请其出力，花了十年时间，人类在两个美苏的带领导下了群星璀璨的大太空时代。\n\
    > 直到1966年，反59岁的普罗米修斯去太，冷法下世界的秩序体系已经动摇。1967年，冯布兰德登上了历史舞台。他的大统一合，太空8号一1号就合上卫星5号太空，两国太空竞争正式宣告结束，开始转向国际。1967年，在联合国框架下，美国、苏联航天大国签署合著了外层空间条约。国际社会的共识，太空资源、加深太空合作的共识。\n\
    \n> **咖啡们**\n> “相互依存”隐含了美苏双方在对核时代生存的基本诉求。\n> 20世纪的世界秩序经历了从“解构”到“局部重构”、“再解”“全面重构”的历史过程。冷战处于世界秩序的“局部重构”阶段。冷战局部重构是二战世界体系后的一种“二元双极”。冷战争构后的世界体系是国际体系复合意义下的国家利益竞争和国际关系中的霸权斗争。其更具实质性的两种对社会治理的差异性是意识形态之争。所以，美国学者梅斯·考夫曼将美苏冷战称为“冷战争”：图派国主义和选择意义之争。”\n\
    > 冷战争世界带来了什么？冷战争是学术界立国，“苏苏干涉主义世界体系影响了国际和国内秩序。第三世界政治、社会和变化。对非洲、华盛顿和美洲都产生了很大影响。”。华盛顿和美洲都需要改造这个世界以使它们认识形态为背景，而新兴国家则为了自己的竞争造就了场性。\n\
    \n## 28 | 中国角色：大阵营时代中国如何展开影响力？\n\n**唐砚 国际政治学研习组**\n\n![](img/f6fb9f119d5a36bef5023e2714febb8d_60_0.png)\n\
    \n28 | 中国角色：大阵营时代中... 1:57 / 45\n\n你好，欢迎收听《国际政治40讲》，我是唐砚。\n\n上一讲，我们讲了美国和苏联这两大超级大国在世界上称霸。而相互对抗又相互依存的关系。\n\
    \n我们也提到了，在美苏争霸的过程中，中国获得了一个独特的地位，并成为**国际秩序当中一个不可忽略的力量**。这一讲我们就来看一看，中国的影响力究竟是如何逐渐展开的。\n\
    \n### 中国革命的双重属性\n\n实际上，中国影响力的展开过程跟中国的革命有着直接关联。我在《中国历史》那门课程中讲过，唐文一系列史中漫的史学家可以进入20世纪之后，“革命”便一直是中国历史的关键词，最后走上了中国共产党领导的社会主义革命道路。\n\
    \n对于中国在冷战时期的历史，你应该也不陌生，对于中国来说，那也是一段极为艰难岁月，尤其是20世纪60年代，中国和苏联关系破裂后，中国两大阵营的代表，也就是美国和苏联，都在处**在对立的状态**，等于被敌人全方位包围了。\n\
    \n然而，正是在这种局面下，**中国反而打开了一种强大的世界观**，逐步获得了在国际秩序中的影响力。这一切是怎么发生的呢？\n\n为了搞清楚这个问题，我们得先来说**中国革命的本质**。中国革命的社会主义革命，在世界秩序的理解上，有着双重属性。\n\
    \n一种是普遍主义的取向，因为它主张的理想**是以全人类的解放为目的。另一种是民族主义的取向**，因为中国共产党在进行革命的时候，**大张旗鼓地实现民族独立**，改造主义与民族主义双重主张，使得大阵营时代的中国在占有一系列独特地位。\n\
    \n### 中国革命的普世性\n\n先说普世性这一面，它直接地改变二战之后的国际地缘体系。\n\n雅尔塔体系的初衷是美、英、苏、中四大国家携手**维护战后世界和平**。简单来说，就是每个国家都管理世界当中的某一部分区域，世界秩序的规定能够**确保**美国管理美洲洲，苏联管理欧洲和东欧，英国管理欧洲南部，这和当二战前的瓜分独立主义状态。\n\
    \n在上一讲，我讲过苏联共产主义原想激活了美国的首义主义，但**这个激活就反应在具体的改造**中，相当程度上是通过中国的共产主义革命而实现的。\n\n站在1949年**的世界**看中国，你会发现，中国革命的胜利相当于为共产主义阵营增加**全世界四分之一的人口和全球十二分之一的领土以及巨量的资源**。在雅尔塔的**构想**中，共产党主义阵营只有苏联独木，**也就是说**，可以谈判**制定**以**制约共产主义**，所以改造共产主义的**方案**到定看处于**个状态**的，是**可接受**的。\n\
    \n但苏联加入中，*这个**势态**的**格局***，而**且**苏联*两个国家的**的**和***，有**的**的***，**证***的***，***，*的***，***，**的***，**的***，***，***\n\
    \n所以，我们可以把上一讲的法推一步。我们*了，**美国***，***的***。这个***，***，***，***，***，***。\n\n### 中国革命的民族性\n\
    \n再来看中国革命**民族**的**这**一面。**中国共产党在革命当中**，**始终有着强烈的民族救亡诉求。既然民族救亡**，**那**就是强调民族自决以及主权独立性。但是，**苏美主张的全世界共产主义革命都有一个重要特征**，就是它要求全世界的共产革命**都从属于莫斯科的统一领导**。\n\
