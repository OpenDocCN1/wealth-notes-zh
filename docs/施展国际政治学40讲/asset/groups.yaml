    ## 民族主义与保守主义的回潮


    所以我们也会发现，民族主义在最近几年会有特别明显的大范围回潮。无论是西方国家还是发展中国家都如此，都可以看到各种各样的世界力量。民族主义其实也是从15世纪开始的，但保守主义的回潮也不是没有关系的，因为全球被退回到前几的小壳子里，与之隔阂，是不是你能得到的。


    在更加激进的普世主义和更加凸现的保守主义之外，还有一种兼具这两种特点的新保守主义又浮了出来，就是所谓“文明的冲突”，其中最为扎人眼球的的就是宗教间的冲突。


    宗教直接介入宗教的人内心和精神世界的，所以人们便能在追求宗教的过程中，找到更大的安全感。大的宗教文本本身多都有普世主义取向，并且是普世秩序的。对宗教人群的认同确实突破了国家的边界；但是，文明与宗教的非教文科中能指大量的人，它的基础是文明和世界的性重考量，这使得它在特定国家内又表现出小圈子。


    **宗教文明的冲突既表现为曾是普世的同时又是小圈子**。但是说到底宗教远远不够，所以人们必须还要讨论这个宗教，想要做一个什么样的政治秩序，所以**这种宗教教也会转化成某种新的国际秩序观**。


    文明的冲突所解决的问题，和前面所谈的其它国际问题紧密相连，文明冲突问题本身既包含古代、现代和后现代的国际化问题。


    ## 大颠覆时代的全新玩法


    历史上，在多种重大重叠问题同时出现的时候，都有一种规律，就是重叠都会考虑一种更高更宏观的适应方案，来寻找某一问题，然后由另一个角度来消解其它的问题，就是我们前面课程里讲的亚当·斯密，凯恩斯，再到后来的帕斯卡，都是这样的。


    但在文明冲突以及我们刚才说到的这一系列技术演化的条件下，当人类的关注再而外求可以升级，又有在哪个方向，如何降维，现在都很难有结论，但这些都是我们大颠覆时代必须思考的问题。


    这些严峻的挑战，一定会带来全新的玩法。但全新的玩法究竟会怎样，现在还很难去清楚。我们可以思考的是，能在大颠覆时代占据未来优势地位的，一定是**最具想象力的那个群体**。


    但是，**这个想象力又可能是天马行空的胡思乱想，我们要努力的方向，是**去想象最深的河床，也就是最深固的约束条件。**底层的河床千百年来为历史开拓新的空间。


    这就是为什么我课程要花大量的篇幅去谈国际秩序演变的原因，最核心就是，大颠覆的时代，既要想象力，在现有国际秩序的基础上，尽展想象力，**去想象未来国际秩序演化的可能性**。


    要有效地发展想象力，要能对未来可能颠覆国际秩序的技术有所把握。


