    ## 民族主义与保守主义的回潮


    所以我们也会发现，民族主义在最近几年会有特别明显的大范围回潮。无论是西方国家还是发展中国家都如此，都可以看到各种各样的世界力量。民族主义其实也是从15世纪开始的，但保守主义的回潮也不是没有关系的，因为全球被退回到前几的小壳子里，与之隔阂，是不是你能得到的。


    在更加激进的普世主义和更加凸现的保守主义之外，还有一种兼具这两种特点的新保守主义又浮了出来，就是所谓“文明的冲突”，其中最为扎人眼球的的就是宗教间的冲突。


    宗教直接介入宗教的人内心和精神世界的，所以人们便能在追求宗教的过程中，找到更大的安全感。大的宗教文本本身多都有普世主义取向，并且是普世秩序的。对宗教人群的认同确实突破了国家的边界；但是，文明与宗教的非教文科中能指大量的人，它的基础是文明和世界的性重考量，这使得它在特定国家内又表现出小圈子。


    **宗教文明的冲突既表现为曾是普世的同时又是小圈子**。但是说到底宗教远远不够，所以人们必须还要讨论这个宗教，想要做一个什么样的政治秩序，所以**这种宗教教也会转化成某种新的国际秩序观**。


