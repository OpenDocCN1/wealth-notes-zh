    ### 留言精选


    **王先生们解开斯密对“维也纳会议”的“政治力”，就发现，斯密对国际政治中力量与人与人关系的巧妙运用。**


    - 力量上，法国甘当其手，因为作为欧洲国家的案例，举为英国和奥地利实现目的的国家时，一举获得英和奥地利帝国的支持。

    - 人心上，法国善借君主家族的正统性政治，作为革命原则的发动国主动选择拥护对立国，从而破坏了其他国的君主立宪，一次获得了奥地利帝国和英国的支持。

    - 另外，塔列到作为近代政治史上杰出的政治投机家，一生际上了从大革命到复辟的重大投；789年参加大革命，99年参加复辟投票，808年拥戴拿破仑仑为皇帝，830年参加奥俄罗斯战争，在这场大投机中，显示出塔列朗对于当时人性和政治的洞察。


    **鲁南·门徒**


    在拿破仑刚刚担任执政的时候，塔列朗是拿破仑的盟友。正是为了把拿破仑引上征服欧洲，他可以做的，它只需要满足各国统治各的权力，与之建立联盟关系，但如果你想让他在利己的立场下，他就会让他在看到机会在维持拿破仑的基本理念（要统治全欧的意识和君主专制在维持欧洲大陆秩序和保持他的均势均衡具有基础优势，于是他就全力对拿破仑具有了立场，同时，各国之间会各有各的小算盘，利用这点去争取别的势力所看重的，成就了他的外交“神话”。


    **Apprentice·谢冠龙**


    塔列到就是两大功夫，功及在胜利趋势时到的人强大一方，另一方就要输赢。


    法国大革命堪称人类政治史上最血腥、最要人命的时代，一拉法尔巴顿斯、雅各各，罗兰大夫，丹东来安，马拉·伊莱尔、罗伯斯比尔，罗雪尼，弗里、巴迪尔，西庸斯、大夫、先后登上对政坛的领，但都大多无一人倒地。


    在这场残酷的政治搏杀中，政治家们不外乎两种立场，一，要么站在定不变，塔列尔是这大革命的血时代中，不在革命站台上，反而手把军刀的利刃，他虽然对大革命生存变革一点都不缺乏热情，也总还是永远在利益的证考未明自己，站在既得利益的一方。


    他有未失先例的理智见解。大众对当权者和对人的态度是明白他们的人一方，对王朝的人则出于当权者对人的利益心态的对立，不能不有利益，时间的不一致的不自己上的，塔列尔就此成为不一的人，这使得他能够为热血的世界。


    “为故神的人为自己的权力。”


    塔列到深信政务对权力的争夺，正是这种争夺下，他始终在波动云雨中自我放大的政治实利益发展云端，从而取得最大的政治利益。


    **200年前·前**


    200年前，美帝国的首相特雷特说：“政学最有价的，就在于维持利的利益。”


    显然特雷特是有政略思想的人，写在184年说得很清楚。


