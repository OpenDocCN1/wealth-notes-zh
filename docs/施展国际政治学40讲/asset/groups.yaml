    # **14｜全民战争：西班牙怎样在战场上拖垮法国？**


    ![](img/f6fb9f119d5a36bef5023e2714febb8d_31_0.png)


    你好，欢迎收听《国际政治大课40讲》，我是施晨。


    上一讲我们谈到了法国大革命如何催生了民族主义，这一讲来看一下大革命如何让战争的逻辑也发生了深刻变迁。


    考虑到拿破仑称霸时期的战争，可**当马上一就会听到拿破仑**喊得声嘶力竭的世界，法国上七之力抗敌欧洲，全欧洲不得不联合起来与之，才最终把法军给拿掉，也给了拿破仑机会。


    这历史又令人荡气回肠，也成为启发了欧洲浪漫主义思潮非常重要的一个意象。然而，仅仅半个世纪之后，法国就在1870年被德国打得一败涂地，之后一直被动受制于盟友，直到二战结束。


    那么，问题来了：大革命时期的法国怎么可能此战方成？就是因为在拿破仑这么一个伟大的军事天才面前。


    实际上是，这是因为**革命法国开创了一种前所未有的战争形态。通常我们可以称之为全民战争，**全民战争的军队不只是以军官，而是那么全民战争的军队到了极致，才造就了那么大的奇迹。但是欧洲这种全民战争扩展到其他国家的后，法国的绝对优就不再那么明显了。


    同时，**当时法国的对外战争，也让西班牙发展出了全民战争另外一种形态，**你可能不熟悉，那就是游击战。


    # ## 法国大革命之前的战争模式


    要解释战争模式的全民战争，就得先说说此欧洲战争模式是什么样子的。


    简单的说，**法国大革命之前的欧洲战争，基本上可以解释为贵族战争，而贵族战争无论从战争的目标设定上，还是从战争的发动能力上，都是比较有限的。**


    先说贵族战争的**目标设定，无非中外，贵族们都有特别强烈的等级、秩序意识，**要把自己的地位从别人那里拿出来，**以等级秩序维持，贵族对于平民的态度。**这种贵族在秩序上对普通贵族对于特权的态度，法国的贵族自然也是对其他贵族的，平民就是被动的。


    战争的**目标，基本上也就是贵族之间的利益平衡，所以会发生比较激烈的战争。因为贵族们对于彼此的血统正当性都看得很重，但是无法通过战争来达成目的，那贵族们就干脆不打了。所以战争的发动权是很少，也是贵族们发动的。


    再说贵族战争的**资源动员能力。贵族**的战争主要靠贵族自己的土地和收入，再加上国王对贵族的税收。这种税收有限，所以战争的规模和持续时间，也相对有限。'
