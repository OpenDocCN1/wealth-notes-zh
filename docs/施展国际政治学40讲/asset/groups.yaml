    \n# 08 内政和外交：英国为什么能彻底击败法国？\n\n你好，欢迎收听《国际政治学40讲》，我是施展。\n\n前面几讲里，我们随着看着各国的博弈，法国在欧洲版地上，成功推翻了强大的哈布斯堡帝国，成为新的地缘霸主；英国则转向海上争夺了早期新老西班牙成为英国的海岸线上。在打败了各自的手下之后，英法两国从17世纪中期开始了白热化的对抗。\n\
