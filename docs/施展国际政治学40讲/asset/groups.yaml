    继续处理后续内容：


    这个当然是完全符合亚当·斯密的经济理论的，并且对先行开启自由贸易的英国而言是稳赚的，但很难想象一个国家居然会为了一个道德愿景做出如此巨大的让步。


    但是你再仔细观摩一下就会发现，实际上这么做，完全符合英国的国家利益。当时英国是世界上最强大的工业国，它出口的是制成品，别的国家出口农业或采矿业，你都可以从我这里买。如果你的关税收得高，你的居民也是会通过走私的方式从我这里买。


    而英国作为唯一工业国，进口的就是粮食或原材料，各**个**都有关系，意味着它都从全球寻找最低成本的原产地，对于生产成本的控制能力最强的原产地，对于贸易的垄断能力也最强的原产地。其他国家想从英国进口工业品，只能作为英国的原材料殖民地和产业市场存在。


    工业革命让英国和其他国家之间形成了完全落差，工业经济对农业经济碾压的完全碾压的，产业贸易利益带来了降维打击的可能性，而英国的国家利益就在单方面自由贸易之中。


    在这个过程中，英国逐渐积累起巨额财富，最后变成了世界的关键中心、贸易中心，在19世纪中叶达到巅峰的时候，全欧贸易的1/3和**全球**贸易**量**（原文“贸易城市...城市”疑为“贸易量”或“贸易中心”OCR错误），以后再也未能达到**的**城市对于世界的影响力也没有这么大过。

