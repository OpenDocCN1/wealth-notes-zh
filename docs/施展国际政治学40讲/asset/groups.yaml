    \n### 美国的精神结构\n\n其实我们前几讲也提到过，二战后，**美国在政治理念上有一个很重要的改变，就是从孤立主义向普世主义的转向。**也就是说从只管自己的事变成要世界的事，甚至要全世界的事。而美国的这种理念转变，基本上可以说由苏联激发出来的。\n\
    \n为什么这么说呢？\n\n我们先在精神时代里的变化，分析美国的精神结构。它的特点就是纯粹，而美国的主体居民是清教徒，他们有一个基本信念，自己是在上帝的选民。**这种信念包含美国在国策上可能会呈现的两种相互对立的面向，一种是孤立主义的面向，另一种是普世主义的面向。**\n\
    \n这两种是清教徒精神中不可分割的部分，但不会同时表现在外。美国政策则呈现哪一面，取决于它对对方的衡量。\n\n在美国的相对力量比较弱的时候，这种清教徒，如同其他世界，但世界各地的人民都愿意了，**他们称之为自留地，全世界都对我们失去了这一个干净的种子。**我们是上帝在人世所留下的最后的，承载着人类的未来，所以要小心呵护我们这个共同体。\n\
