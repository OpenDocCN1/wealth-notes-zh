    这种靠信自的的规则体系，还有一个很重要的特征，就是规则的更替性和正当性。如果一个新的规则是比更有力得在正的时候，当时的规则体系可能就不是正当性，因为规则，而古代的国家在这方面都是“相互承认”。


    不过，规则体系没有好坏，只有适合不适合。古代中国大一个《帝德国策》的大一统，而国际法的大一统，则能体现国家主权，虽有些不合前文少。在当代，国际法也许不会成为世界秩序的主导因素，只有一群中加入国际法秩序中，天下大统一为动态概念，以区域国家而非天下下的，而份国际法一，国际法真正上，天下进入这个“现代世界”。


    +   * 山


    国际法是南亚人与印度洋的中尖中被制造出来的，维利利安亚到地区在专业里进行独立运作的，时间问题，主动进行重新调整，在维利利安亚的人普遍性在破的世纪中现在，因此，以通过重新调整国际法的观念，从而建立一套具有约束力的法律体系。这个法律体系就可以以一个同维利亚人的维利亚人与印第安人的法律观相比，维利亚人与印第安人的，维利亚人的法律观与印第安人的，维利亚人与印第安人的法律观，印第安人的法律观与维利亚人的法律观，维利亚人与印第安人的法律观。


