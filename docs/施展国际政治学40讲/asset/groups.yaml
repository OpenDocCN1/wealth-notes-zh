    \n但是，随着美国的力量变得强大，美国又可能觉得，我们这群清教徒具体体现，如此之下，我希望全世界都跟我们一样，**是上帝之许给你的东西向外的扩展，让世界上的所有罪恶都，在这种情况下，它又会表现出一种普世主义的信条。**\n\
    \n### 美国的普世主义如何被苏联激活\n\n既然美国的精神结构本来就包含看这样激越的普世主义冲动，**为什么是苏联激活了它普世主义的一面呢？**\n\n\
    看一两两次大战后的历史就明白了。一战后，在威尔逊总统的推动下，美国一度从孤立主义走向普世主义，但是他的种族性格非常决绝，这在美国内部都是，**一战的说美国会坚决地回归传统的事情，威冷逊总统没有机会。所以美国就又退回到孤立主义了。**\n\
