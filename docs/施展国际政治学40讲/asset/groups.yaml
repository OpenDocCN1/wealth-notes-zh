    # 07 | 体系的成型：主权平等原则是如何出现的？


    梅毅《国际政治大讲学》


    你好，欢迎收听《国际政治大讲学》，我是梅毅。


    前面几讲，我分别给你讲了法国、英国，还多西班牙，在大航海时代各自遇到了什么难题，他们为解决这种问题的过程中，带来了怎样的结果。比如国家观念的形成，是法国的理论创新，还有海洋视角，这是英国的观念转型，比如国家法的雏形，最先在西班牙奠定。


    在大航海的前期，各国各自已经碰到了很多新情况，并且为解决问题的过程里产生了这些国际秩序的基本框架。


    # 三十年战争


    但是，到了大航海时代的后期，欧洲秩序越发混乱，各种战争不断。为什么有这么多战争，是因为大家都从海外带回来更多的财富，但欧洲内部又不可能分成这么多份，所以各种不均衡，从而带来动荡。


    再来是，发现新大陆之后仅仅才六十多年的1517年，欧洲又开始了另一个惊天动地的大事，宗教改革。你可以知道，信仰问题的冲突很顽固和深，尤其是旧政体的政治所说还有世俗化，信仰就是无法真正被的根本冲突。所以，他们的冲突会导致极大极大的冲突。天主教国家与新教国家之间因此发生了大量宗教战争。


    大航海神是为主旨都是西部，而宗教改革发生在神圣罗马帝国内部，我们在那面说过，1516年之后西地中海和圣罗马帝国的最高势力，都集中在反方向期望国家头上。于是，大航海和宗教改革两股力量的合流，与哈布斯堡王朝侵略欧洲的势力又合在一处，战争就卷入了更多的区域。


    海外财富激起的是各国及其内部群体在世俗利益上的争夺，宗教改革激起的是人们在信仰层面的博弈，信仰兴趣激起的则是征兵一切的权力。不同群体的诉求彼此之间难以沟通，同一个群体也可能会有若干种诉求，各种信仰又无法不可能完全协商解决，各种矛盾就此相互叠加强化，战争越发难于平息。


    积累多种斗争，恨到1618年，终于爆发了一场规模巨大的战争，把大部分国际关系国家都卷入进来。战争一直打到1648年，共持续了30年，所以历史上称之为“三十年战争”。


    三十年战争是当之无愧欧洲的战争不断频繁的结果，惨烈到什么程度？在持续不断的冲突和战争中，这场战争给参与国带来了至少百分之十的人口。这不仅上人口损失，甚至远超过了第二次世界大战中损失最为惨重的一方。德国曾是神圣罗马帝国的一部分，1619年~17民国家是欧洲最大最富裕的德意志人，为三十年战争所吞食过的巨大历史灾难，甚至超过纳粹政权。


    战争打到这种程度，哪个国家都承受不了，而三十年战争开始前后，原有的盟约体系都失效了。各个国家基本就是混战和相互干杀。


    这样一种混乱无序的环境中，人们有共识才可能开始重建，是无法回答各种诉求，以满足诉求的方式，结果会越积越多。问题是有领导有秩序，只有大家都能认可的规则，战争才能导致向某种秩序的建立，而不是单纯的相互杀戮。


    关于秩序的建立，很多人都做出了重要的理论贡献，比如我们前面提到的西班牙最早学法学派的德亚理亚，这方面大德索雷斯是莫拉基亚。但格拉西内是西班牙的。也有格老修斯，他是公认的公法学家。他尤其把包括很多利比亚和巨人提出的国际法原则，发展成一套庞大又成熟的法律体系。


    三十年战争的结局看，参各方在神圣罗马帝国的和威斯特法尼亚协议下各方相互妥协，终结了战争。条约所体现的法律原则则来源于格老修斯在1625年所写的《战争与和平法》。由此形成的威斯特伐利亚体系，也被认为是人类历史上第一个国际体系。


    # 格老修斯的国际法学说


    格老修斯的学说到底是怎样重建秩序的基础原则，最终促成了威斯特伐利亚体系的？


    问题的关键在当年的战争。格老修斯在这一大动中的一生，始终在思考如何才能给战争的目标和手段，从而向前进推和结构的目的，这是重建秩序的前提。战争必须有正义的。那就得先定义，正义战争的标准是什么？


    先来看看前人。标准中世纪的基督教神学家奥古斯丁、阿奎那都提出过正义战争的三个原则：一、战争组织的权威。二、战争正义的理由。三，战争目的当。关于这两个大神学家的重要性，你可以在我老博的《西方大约50讲》课程当中听一下。


    格老修斯在前人基础的研究上进一步了，但他同时发现，正义是战争最重要的决定条件就是要有正义的理由。正义理由就是，为了维护或者实现所确定的权利和自由形成，所以的战争都不是正义的。


    自然法是从哪里的呢？格老修斯认为它来源于“自然”和“人的”理性，是，一种法律的基础和标准。自然的权利并不是开于了格老修斯时候才提出来的，古希腊、古罗马的学者，人们就讨论起古代自然法。但科学革命让当时的人对于人类的理性获得了巨大信心，格老修斯是生存在这样一个时代，他认为自然法正在出人类，那么，基于这一种自然法的正义战争，那么，就把基于宗教的战争理由给排除在外了。


    再往前一步，就是战争。自然法所规定的权利和自由是什么？格老修斯看来，只能是主权国家。除主权国家之外的贵族、医生、地方官员、宗教领袖等等都不能发起战争，或者说都不能不负责任等。国家主权的特性，对内的最高权力，对外独立的、不受任何其他权力的制约。这就把我们已经提到的法国所发展起来的“国家”观念，在国际法层面又进一步落实了。


    这样一来，战争组织的权威、战争的正义理由，在格老修斯的理论当中就确定了。接下来就是到底用原则进行什么操作能够符合正义标准。什么样的行为是正义的，参战者可以因此而为但不损害自己合法权利，什么样的行为是不正义的，参战者对交战不能拥有交战权利，等等。


    这里面有一系列的法律技术性的展开，我在这里就不一一说了。一句话，格老修斯在这里就产生公法理论，达成三十年战争当中的各方对于规则的共识，并成为威斯特法利亚条约的法理基础。


    格老修斯对20世界的影响颇为深远，以至于差不百余五十年来，成书为在传播格老修斯的影响。格老修斯亦被为父亲，而圣父，不过有学者也以此自证，认为自己的变法活动，就是如布衣平民的自组织，而为天下立法。


    # 威斯特伐利亚体系的原则


    说完了格老修斯的国际法学说，就能明白威斯特伐利亚条约当中一些法则原则的来源。战争名仁以及规则的一个核心规则，即维持体系内的主权各方，都承认对方主权，在此之前他们可不是这个理由相互关系的。


    比如条约中规定，各国主权一律平等，海管你这个国家的统治君主头衔，是皇帝、国王，还是大公，在对外关系上都是平等的。这样一来，就不会再现当初神圣罗马国对抗神圣罗马帝国所面临的主权困境。


    再比如条约中规定，数信固定。也就是说，一个国家内究竟提倡信什么宗教，由该国的统治者说了算，别的国家不许干涉。这就止息了宗教战争直接端掉掉掉了。


    还记得，条约规定，要用国际会议的方式和平解决国际争端，条约必须被遵守，违约方可能会被制裁，这样一来就告诉国际社会不是丛林社会，而是有一些基本规则的。


    所以，三十年战争称做最后一场宗教战争，也被称为第一场国际战。因为它在这之后，至少在欧洲范围内再也没有人为重要战争，是以宗教的名义发动的了，而都是与国家的名义发动的。


    所有这些，都意味着我们今天所熟悉的一些国际秩序的基本准则开始成熟了，比如最基础的就是国家主权平等，再如，国家开始实现世俗化，还比如一些基本国际规则原则，等等。正因为确立了这些基本原则，就在欧洲秩序所笼罩的哪种国家体系，也都在这个时期成为历史了。


    说到这里，关于近代国际秩序发生，就基本讲完了。通过个阶段，你也发现，国际秩序就是一个对特提出的新变量，不断寻找解决方法和规则，并且是不断的演变秩序体系。


    威斯特伐利亚体系稳定之后，欧洲的竞争过程也依旧持续，新的参与者为了新的国家也英国，以及原有的法国和德国。两项争主又给这个时期的国际秩序带来了一些新的变化。


    英法两国的争霸，能剖析出什么问题，最后是又回到国际秩序将往什么样的方向，这就是下一讲的内容。


    好，我们下一讲再聊。'
  md: "\n# 04 | 为什么美国人能够冲出这种古老的统治？\n\n为什么美国人能够冲出这种古老的统治呢？说来可能有人会吃惊，这是因为当时，英国的海军是皇家海军在与海盗的博弈中演化出的新机制，海权被女王授予，这套新办法的执法海权必有海主，海权是在这种对主权法的人，必须有一种与既有体制不同的玩法，否则就没得玩了。结果这整套博弈下来发展出的玩法，反倒成了主流，配置了一个有趣的时代。\n\
    \n**1588年的海战，隐藏着一个趋势，就是西班牙式的陆地视角已经过时了，英式国家的海洋视角开始代表未来。现代国际秩序将沿着一种与过去截然不同的逻辑运转。**\n\
    \n作为落后的英国，被迫出现了观念转型。这个转型的关键在于你怎样理解海洋，大海究竟是大陆还是通道？\n\n如果你理解为天空是大陆（注：此处应为“大陆”或“实体”，原文语境指视海为陆），那么你会从陆地视角去理解海洋，那么海洋资源的来源依然要放在陆地上，你会想着去征服海洋，那么大海对你来说真的是属于资源的概念。如果认为大海是通道，你就会从海洋视角形成理解，以此支撑你的资源投放放在海洋上，最终你才真正有机会征服海洋。\n\
    \n不过必须说，虽然西班牙这样传统的陆地视角过时了，但并不是说只要拒绝陆地视角就行，比如，我们现在讲我们提到的陆地，就代表着一种更与现代的陆地视角，这种新型的陆地视角也表现出一种全新的，很有竞争力的逻辑。\n\
    \n于是，伴随着英国式海洋视角和法国式新型陆地视角的形成，现代国际秩序当中的某一条主线逐渐浮出水面，就是海洋秩序与陆地秩序的博弈。\n\n下再讲，就先下来说讨论下一个问题，海陆大博弈。下下再讲！\n\
    \n## 划重点\n\n![](img/f6fb9f119d5a36bef5023e2714febb8d_10_0.png)\n\n- 在大陆型时代，作为落后者的英国，就是被迫做出了观念转型，这个观念的关键在于怎样理解海洋。大海究竟是大陆还是通道？\n\
    - **如果你认为大海是通道，你就会从海洋视角形成理解，以此支撑你的资源投放放在海洋上，最终你才真正有机会征服海洋。**\n\n# 05 | 海陆大博弈：海洋霸主和陆地霸主有什么不同？\n\
    \n![](img/f6fb9f119d5a36bef5023e2714febb8d_11_0.png)\n\n你好，欢迎收听《国际政治学导论》，我是熊亮。\n\
    \n前面两讲，我带你看了大航海时代浮现的新视角，一个是国际秩序中的新旧视角，还有一个是国际秩序中的海洋视角。**这两种新视角的浮现，也带来了海洋秩序与陆地秩序之间的对抗，引领着国际力量的进程加入新的逻辑。**\n\
    \n关于国际秩序，有一种常见的误解，就是认为英国、法国、德国这些国家都是超级大国，这些国家是差不多的。实际上，这些国家有的是海洋强权，有的是陆权强权。\n\n\
    海权和陆权有着巨大的区别。两者差异可以说是存在不同维度上竞争。理解这个逻辑，对于我们理解现代世界秩序来说至关重要。\n\n这一讲就是来讨论这个话题，而且这一讲也不会局限在大航海时代，因为从海洋和陆地大博弈，是一条贯穿至今的国家主线，这一讲我还会不时地引入中国的案例，帮助你深入理解。\n\
    \n## 大海洋和陆地的本质区别\n\n如果说海权与陆权在发展逻辑上有什么不同，那需要理解大海洋和陆地有什么本质区别。\n\n从物理空间属性上来说，陆地可以被某个国家进行有效控制，这是地球自转的规律（注：此处逻辑略显跳跃，可能指领土边界的清晰性），比如西班牙在殖民时代可以殖民整个美洲大陆，但中国却无法控制北美的加拿大。\n\
    \n当然，这里所说的远离陆地的公海，靠近陆地的领海是另一个范畴。领海公海上你可以用船来放置锚点，别人无法告诉你该挪走，这就是海权可以拓展在陆地的某种延伸。在这个意义上，领海是拥有宽度的空间，是以有用岸线的航程作为依据的。\n\
    \n但岸线的长度有限，无法覆盖公海。人们设法在公海上打桩或者打井台，但没法让舰队和商船在海洋上找到不同小岛屿的无端连接，所以在海上就没有绝对意义上的主权。\n\
    \n不过，海洋的开放性特点也不是开始就被人们认识到的。最早的海洋霸主，也就是最初开始大发利市的西班牙和葡萄牙，都是试图把海洋当作欧洲的私田，但他们也是发现，这些都失去了控制。这可能限制它到某国海上，别人都无法自由航行。要不是认识到无政府性，别人到海上对它进行攻击，根据威斯特伐利亚体系，它也不会说，否则会让公民反感自己的“威信”，在国际政治意义上可以被称为“威胁的可信度”；它的威胁没有可信度，那你在国际社会之中就无法生存下去。\n\
    \n**海洋无法被占有这一一个特征，是德国国际法之父格劳秀斯来填补并明确为一个重要原则，就是海洋领海的“海洋自由”原则。** 也就是说，大海上没有主权，也谈不上服役任何国家的海洋主权，只服从自然法，是自由的。\n\
    \n格劳秀斯把具体的理论在《战争与和平法》里展开来讲，这里我暂不展开，有兴趣的同学可以去找来详读一下。\n\n## 强霸的海岸和多极并立的陆地\n\n海洋是自由的，陆地则有可能是封闭的；但是你要注意的是，**海洋是自由的，但海洋又是强霸的；陆地是封闭的，但陆地上的格局是多强并立的**。\n\
    \n这么说好像很绕嘴，但你可以读一下，这是海洋和陆地的一个核心区别，这也是整个国际秩序逻辑中非常重要的一个逻辑。\n\n你看，陆地可以被占领，可以在上面设置防御性的设施，也可以被控制，但是海洋是无法被封锁的。海洋像一个网，陆地上很容易就划分出相对界线，双方可以一边打或者退兵，拉成对峙，但海洋就没有什么明确的地理边界，拉成对峙，就没办法进行有效的对抗，索性就让这道理线划掉了。\n\
    \n就像我们在讨论商业问题时经常听人说到的一流企业做标准，二流企业做品牌，三流企业做产品；国际秩序上的规则主导权，这就是标准。而要讨论这个问题，就得理解国际法的逻辑。\n\
    \n国际法就是在大航海时代逐渐浮现出来的，下一讲我们就来看看，国际法到底是如何浮现出来的。\n\n下一讲再见！\n\n## 划重点\n\n- 海洋是自由的，陆地是封闭的；但是，海洋虽然是自由的，海权却又一定是独霸的；陆地可能是封闭的，但陆地上的格局却总是多雄并立的。\n\
    - 因此，陆地霸主只能形成一个区域性的霸权秩序；而海洋联通全球，海洋霸主也天然地是全球霸主。\n\n![](img/f6fb9f119d5a36bef5023e2714febb8d_12_0.png)\n\
    \n# 06 | 国际法的争夺：怎么构建一个规则系统？\n\n你好，欢迎收听《国际政治40讲》，我是陈康。\n\n上一讲的内容我谈到了，高手间的国际政治之争，是对于规则主导权的争夺，而规则的具体表达就是国际法。这一讲我们就来着看，国际法为什么会很重要。\n\
    \n简单来讲，正是国际法才使得国际秩序的演化成果能够积累下来。\n\n要理解国际法的这种重要性，我会从国际法的生成史角度去入手，看看它在如今在各国的博弈过程中是怎样发挥作用的，让你真正看到国际法在国际秩序当中的结构性功能。\n\
    \n## 为什么西班牙人率先构建国际法\n\n学过法律的人都公认，公认的国际法之父是17世纪早期的荷兰人格劳秀斯，不过国际法学界还有个说法认为，格劳秀斯的理论并没有更新，而是基于16世纪西班牙的萨拉曼卡学派、伊莎卡卡布劳的重要论文、人物维多利亚提出的一个基本国际法原则，而被格劳秀斯继承下来的。\n\
    \n你很容易就能想得明白，为什么是西班牙的学者成为国际法奠基者（注：原文“莫里斯”应为“奠基者”或类似词，结合上下文语境修正），因为西班牙是领先开始海外冒险的，也是最早与海西时代（注：应为“新航路”或“海洋时代”）完全不同，它所能遭遇的问题一定是最多的，也就会最先开始遇到。国际法其实发生的，没有什么是应对问题、解决问题的过程中发展起来的。\n\
    \n萨拉曼卡学派形成是因为16世纪（注：原文“20世纪60年代”明显错误，萨拉曼卡学派为16世纪）的伊萨卡大学（注：伊比利亚/萨拉曼卡）而形成的学派，不过其最早的时候是发达关系（注：应为“法权”或“法律”）的问题，也就是西班牙人和印第安人关系的问题，也是西班牙人和印第安人的关系。\n\
    \n这里多说一句，那个伊萨卡学派是在伊萨卡大学的宗教学院发展起来的。这跟有关，罗马法在中世纪是宗教法会法（注：教会法）获得各种传承的，罗马法在天主教圣言（注：应为“圣法”或“教会法”）里会发展得很成功，其中形成的大量法律概念、法律原则和法学方法，都构成了国际法的基座。\n\
    \n而中世纪的天主教也会逐渐发展起一种判法（注：应为“教会法”），用现代观念会自身以各种宗教事务，这就是神会法。教神会法的核心、基本法律概念和法学的法方法，都来源于罗马法，但又进入了很多基督神学的要素，所以神会法一直是最有宗教的替代性学科。一门神学理论也积累了很多法律法学家。所以国际法最初的源来自神会法就不奇怪了。\n\
    \n伊萨卡卡学派的代表人物维多利亚，他认为整个一本关于讨论到正义问题的。他讨论的问题核心就是，西班牙人对印第安人的侵略有没有正当性。\n\n维多利亚认为，上帝创世让人分布在此相关遥远的世界各地，是个伟大的智慧。因为只有这样，人类才可能会长出相关联系而相互依赖于一类，各种可能性都能相互支撑，如果人类聚居于同一块大陆，反而显得力所不逮（注：原文“力所出些”应为“力所不逮”或“显得不自然”）。现在各个地方人，都是自己所创造的这片土地上的合作区（注：应为“居住者”或“主人”），这是是上帝所赐予的，而每个地方的人并不信仰上帝，他们也同样拥有这种权利。\n\
    \n相应地，为了能够实践上帝对人类发展的意图，人们也能够有机会权利去对世界各处自由航行，自由贸易、自地交往（注：应为“自由交往”），并对当地主人有义务负责自己的权益，他会平等地去做这一切。如果有谁拒绝了他们的权利，甚至伤害到对方伤害亲人，那就是在违背上帝德意志，从这种伤害到正义，就是正义的战争。\n\
    \n而依据罗马法，敌人的财产可以被视为为无主物，一旦被占领放弃，就成了战胜方的财产。因此，西班牙人是通过“正义战争”获得了对于印第安人及其土地的统治权。\n\
    \n维多利亚这么改文（注：应为“论证”）西班牙的正当性，为西班牙人对印第安人的侵略提供了一当性（注：应为“正当性”）解释，但所起来认为觉得过于虚伪的，把人打光了，还要强调自己是有正义的。\n\
    \n国际法确实很重要，但光靠它也无法完成国际秩序，因为如果没有国家愿意接受这套规范怎么办呢？那这个各国都很可能只会说废话。但战争从来不是目的，战后国际安排才起目了（注：应为“起作用”），这个秩序安排都需要国际法来加以规范了。\n\
    \n下一讲我们就来看战争与法律是如何共同作用，带来了近代历史上第一个国际体系一威斯特伐利亚体系的。\n\n下下讲再见。\n\n## 划重点：\n\n- 抽象规则体系有个特征，就是其中每一条的具体规则都不是孤立存在的，而是通过其他规则获得意义，规则与规则之间互为解释，构成一个逻辑自洽的系统。\n\
    - 一旦其中某些特定规则发生变化，那么整个系统就会发生变化，继而向前发展。\n- 因为这种演化性，抽象规则体系有较强的扩展性，它可以不断用来解决新的问题，而这个扩展过程中还可以不断积累下来，形成一个统一的规则系统。\n\
