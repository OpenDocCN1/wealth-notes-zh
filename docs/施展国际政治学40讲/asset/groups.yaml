    # 03 国家观念的诞生：王**能合法反**皇帝吗？


    ![](img/f6fb9f119d5a36bef5023e2714febb8d_6_0.png)


    03 | 国家观念的诞生：王... (13:73)


    你好，欢迎收听《国际政治学40讲》，我是施...


    上一讲里，我为你整体勾勒了大航海这个时代的全球，正是在大航海时代诞生了现代国际秩序的“国际关系”要素，其中一个基础性要素就是“国家”这一观念。


    可能会**觉得奇怪，国家不是自古就有的吗？实际上，自古就有的不是“国家”，而是“统治”。


    “统治”指的是人和人之间分为统治者和被统治者的关系，是个**概念；而“国家”这个概念指的是一整套复杂的政体和法律关系。


    个理论事实，也就是说，政治学里这个真实存在的事实，和国家，是人们用特定的方式对这个事实的“一种理解”。


    要说清楚“国家”这个概念，需要一系列政治学、法学的**推理。我在这不讲就不展开那么多了，只是从国际政治的角度，告诉你“国家”观念是怎么来的，以及它如何影响了国际秩序的演化。


    # 法国和哈布斯堡帝国的对抗


    国家观念的出现，其实是**对抗哈布斯堡帝国过程中的一个理论产物。说到这得解释一下，什么是哈布斯堡帝国。


    在1516年，由于一系列**的原因，西班牙和神圣罗马帝国的最高**权落在了同一个人头上，就是哈布斯堡家族的**查理五世。虽然40年后，两国的最高**权又分开了，但*个人，却始终都是哈布斯堡家族的人在担任。


    他们统治之间会有各种配合关系，这被称为哈布斯堡帝国。


    地理大发现时期，**首先**自封为天主教世界的宗主，想一统**欧洲为一个普世帝国。它背后的**当然就是给**以分**布世身份。


    你看一下下面**的地图就知道，当时哈布斯堡家族**半个**，**其**领土自法国在东面与意大利之间，西班牙**到**国在西北与北部包围着法国。


    ![](img/f6fb9f119d5a36bef5023e2714febb8d_6_1.png)


    对哈布斯堡帝国来说，法国是个**，**国**信天主教，但它总是想**叫，**也*信天主教，但它总是想**。


    还有一个麻烦**宗教改革之后，**德意志北部和北欧出现的一些**新教国家，哈布斯堡**国家**想**教国家，**法国**在背后**，**它**帮**头就是新教**，如果**哈布斯**灭掉，**罗马帝国和**班牙的领土就**了，再去对付新教**国家就**了，**能把欧洲统一**，建立天主教普世帝国。


    但是法国定不会这么想，**要想方设法**哈布斯堡的势力。这对于**16**的前半期就开始了，一直到17世纪后半段，有一百多年。


    **国家**，法国**哈布斯堡**的**地位，自己决定了的哈布**但**的**没有**起来这么简单，哈布**军队**度进到离巴黎不远的地方，法国被吓*。


    # 法国如何**和**教**盟


    想活下去，法国就**要拉更多的盟友。


    但是法国的天主教世界几乎都被哈布**家控制着，**拉盟友就只能到天主教世界以外去了。


    那就只剩两个选择，一个是新教国家，**正信**的奥斯曼土耳其，但奥斯曼土耳其是反**，**这个门路下不去。


    **拉**教联盟，法国很可能被人**鼻子骂个半死。**原因有两个，第一，你作为天主教国家，不仅**着天主教**的**主**人，还反新**甚至**教**种**教**，**教**教*。


    第二，法国当时是天主教王国，它的最高统治者国王，**哈布斯堡**，**它*最高统治者皇帝。*我们一讲也提到了，在近代**，人们认为哈布**帝*承*罗马帝国的正统，法国国王从原上来说却是皇帝**的**级**地长官。'
  - '[PAGE 7]


    举个例子你更容易理解，一百多年前的大清，是要为它的藩属国越南出头的。跟法国打了一仗还赔了不少钱，因为那儿的大清是从一个普世帝国维护秩序的角度来思考问题的。越南是大清的藩属国，如果不罩着它，自己就没资格做一个帝国。但是今天中国肯定不会这样了，因为今天我们是自己本国的角度出来思考问题的。


    所以，当法国基于国家理由，把国内各种资源给动员起来之后，它绝不会像自视为天主教世界盟主的西班牙那样，欧洲各处哪里出了什么问题都要扑过去管一管。法国的资源只会为了自己的利益使用，而不会用来管别人的事情。


    这就意味着法国的资源使用就比哈布斯堡帝国更加聚焦，虽然它的资源少，但手指捏成了拳头，哈布斯堡帝国虽然资源多，但手指全都张开了，想要同时按住欧洲无数个地方。


    于是法国反而在与哈布斯堡帝国博弈的时候，能够形成局部优势，更有效率，最终击败了它，到路易十四时期，哈布斯堡帝国从欧洲头号强国的位置上跌落下来，让位给了法国。


    而这个过程里浮现出的“主权国家”观念，也是前所未有的，它是在欧洲陆地争霸过程中发展出来的，它替代了原先欧洲大陆那种以帝国为中心、天下一统的观念，代表着一种全新的陆地视角。


    而随着大航海远洋贸易的发展，国际秩序还产生了一个此前从未有过的重要的视角，就是海洋视角，这个视角主要是在英国的逆袭过程中浮现出来的。


    下一讲我就带你看看，英国是如何逆袭的。在这个过程里，又如何产生了一种新的海洋视角。


    法国要反哈布斯堡帝国，就是王国反对帝国，就像吴三桂要反康熙一样，是没有正当性的。而且法国还要跟异教国家联盟，简直是冒天下之大不韪。


    但是，当时法国首相黎塞留却通过一通论证，把跟异教徒结盟，对抗天主教盟主这事儿给说圆了。这套论证有个专有名词，就是“国家理由”。


    国家理由的出现，也使得尊奉这种观念的国家，思考一切问题都开始只从本国的利益出发，绝不会再从一个超越于本国之上、普世帝国秩序的角度出发。'
