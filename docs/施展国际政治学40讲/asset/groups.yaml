    \n而巴西比泡沫中，法国中央银行大量发行纸币，是又一次的严重，这让法国陷入了对中央银行制度与有效，之后长期不设重，直到近两百年的拿破仑时代才重新设置中央银行。\n\
    \n如果你学过詹姆斯老师《英国简史》的课程，就知道英国在1694年设置的中央银行对于英国的制度意义大，而对于国家的对外战争能力，有着多么重大的意义。\n\n\
    # 新时代的来临\n\n长此以往，在争霸的拉锯战当中，法国当然就很难坚持得下去了。经过近百年的争斗，英国在1756-1763年的七年战争中彻底击败了法国，让法国丢掉了绝大部分在海外多年辛苦经营占领的殖民地，英国成为无人能够挑战的海洋霸主。\n\
    \n而法国在这近百年的战争中屡战屡败，积累了强烈的复仇欲望。这一欲望间接地推动了一个新的时代到来，就是大革命的时代。它终结了大航海时代在国际秩序层面的各种草创阶段，继续推动国际秩序向前演化，开始进入到一种更加壮阔、也更加具有颠覆性的时代。\n\
    \n我们今天所熟知的很多国际政治层面的要素，正是在大革命时代开始浮现出来的。\n\n下一讲就将进入下一板块，大革命时代。我会带你去看更加激动人心的历史进程和更加让人眼花缭乱的国际秩序演化逻辑。\n\
    \n下一讲再见！\n\n## 划重点\n\n- 立宪君主制能够更有效地整合国家内部不同人群的各种意愿，看上去政府权力小，但实际上国家的能力反倒更强。\n-\
    \ 绝对君主制看似君上大权独揽，政府权力很强，但君主在整合臣民意愿上麻烦大得多，国家的能力反倒较差。\n\n![](img/f6fb9f119d5a36bef5023e2714febb8d_18_0.png)\n\
    \n## 留言精选\n\n# 晚清 国际政治40讲\n\n1720年，这是起起落落的一年，也是让牛特柳被砍成1/4的一年。\n\n1月，南海公司打探英格兰银行，并购了一国股份，用英国机开方拉抬南海公司的股票，公司的人们看到在此有每股要赚到1倍的进账，就出高价买入。1月份，每股的价格超过了128英镑，到了6月份，每股的价格超过了315英镑。\n\
    \n与此同时，市面上涌现了一大波股份公司，专门赚钱的家伙，把公司的钱投在其他这些小专业计什么的，只要公司就能赚钱，大家就都热衷。\n\n6月份，英国国会通过了《泡沫法法案》。六大核心交易价格，在泡沫公司签约的1个月，民众逐渐清场。\n\
    \n7月份，民众开始抛售股票。股票暴跌，到了8月份，政府与南海公司破产清算，公司董事离开英国，南海泡沫崩塌。\n\n而牛特柳的货币发行限制也不是非人性，当时牛特柳4个月就限，股票也有限制。\n\
    \n1741年，南海泡沫事件爆发，英国经济遭遇重创。\n\n# 09 大革命时代：两场革命如何颠覆了国际秩序？\n\n张帆 | 国际政治学40讲\n\n你好，欢迎收听《国际政治学40讲》，我是张帆。\n\
    \n这一讲，我们进入到国际政治学2.0版本，大革命的起点。这一讲我们先来看席卷大革命时代的国际秩序到底跟原来的国际秩序是什么样的。\n\n大革命的起点肯定是革命了，这个时代的典型代表是两次革命，分别是1760年代开始的英国工业革命和1789年开始的法国政治革命。\n\
    \n这两场革命虽然形式不同，但都把两国的内部秩序做了一次翻新。而且这两场革命对国际秩序的扩散特别大，不断向对外扩散到整个欧洲乃至于后来带到整个世界，又把整个国际秩序也做了一次翻新。\n\
    \n这两场革命之所以有这么大的力量，在于它们打开了一个全新的玩法，让这两个国家率先进入到现代性的政治社会结构。相对于当时的其他国家来说可以说是领先了一代，所以这两国可以对他国国家展开降维打击。\n\
    \n在这种降维打击下，其他国家被迫在桌面上，都陆续先被革命家进入现代性，要么主动政治继续进行革命，要么进入到新的国际秩序体系中去。\n\n## 英法为何会爆发不同的革命\n\
    \n任何秩序都是有些体系内的不均衡导致的，这两场革命带来的不均衡都来自于革命。\n\n于是大海盗带来的新航海路和由此形成的新秩序，在法国当中呈现为不同的样态，最后也导致了在英法爆发的是工业革命，而法国发生的是政治革命。\n\
    \n我们先来看看，**英国在大航海时代时获益最多的群体，是商人和法臣及那些有利益的新贵族。旧贵族不能完全，封建在大航海时代时获益最多的新王权政府，而获得这样的不完全的，是最终导致这两个国家发生两场完全不同的革命的一个重要原因。**\n\
    \n那么，我们就是要追问了，英国两法国为什么在状态群上有若干种不同的，那么其贵族和两类的贵族群体有关，近代以来的，英国的贵族类贵族对强，而法国的贵族类方相对弱，这背后也是有复杂的历史成败的。\n\
    \n其实，英国本身也有大贵族，但是经过英国历史战争，和后来争夺王位继承权的‘玫瑰战争’，英国的贵族基本上都被消灭了，再有可能打打手和贵族王权博弈的英国国王，通过中小贵族的手段，稳定性博弈是1688年的‘光荣革命’。这种情况下，英国从封建割据走向大一统的过程，差不多就是一个自下而上的整合过程。\n\
    \n这就导致，英国君主的力量不足以压制社会，社会的力量很强大，英国的经济发展动因非常社会力，在欧洲人眼里看则不同。这种社会活力，配合上大航海带来的新航路的刺激，再加上各种各样的机缘，英国就率先发生了工业革命。\n\
    \n英国工业革命是从零到一的创新，这种创新是最难的，难度远远大于从1到N；从零到一的创新，一个核心的必要条件就是，高度有活力的社会。\n\n但是法国这边就不一样了，它的大贵族一直很多，力量也很强，国王在19世纪以来长期都拿大贵族没办法。\n\
    \n到什么程度呢？中世纪的法国国王手上只有两块直辖地，巴黎和奥尔良。巴黎和奥尔良还不连着，国王都不能直接跑到奥尔良去，国王去一块领地要，因为路上随时会被从大贵族领地里打一个大贵族才能把国王的领地打通，但当然也得付一大笔钱，但是国王的领地比有土地大多数的贵族领土少到多，这也没法跟皇家实力比，肯定打不过大贵族。\n\
    \n但是地理大发现和远洋贸易带来了一种全新的财富方式，不需要占领任何土地，商人们也能获得巨额的财富。这时，英国国王通过垄断贸易，就比从商人那里拿到的，用来自的法皇去和欧洲上最富的，终于有能力打败大贵族了。\n\
    \n但这个过程也很漫长，国王和大贵族反复拉锯，大约花了将近两年的时间，到了19世纪之后，法国的大贵族基本都消亡了，法国国王才开始大权独揽，把法国的权力给垄断了。**这和大清朝自下而上中的聚给过程一样，是一种自上而下的征服过程。**\n\
    \n这个过程锻造出了法国的王强大军队、王权政府等对于大贵族的强力压制力。正因为如此，**社会精英层对法国的政府打压，有普遍强烈的反权威情绪。这种压抑会在各种历史上的爆发机会，最终在法国就激发了政治上的革命。**\n\
    \n说到这里你应该就理解了，虽然英国工业革命和法国大革命这两革命的发生路径不同，但都是基于大航海时代所带来的新利益分配和秩序的不均衡。\n\n## 两场革命的影响\n\
    \n这两国的革命路径不一样，但影响都特别大，它们都打碎了旧秩序，对其他国家做了降维打击，这种降维打击概括来说就是用现代秩序对付传统秩序。\n\n**那么，到底什么是现代治理呢？现代政治的基础是大众政治、大众社会的出现。**举个例子，在大众政治和大众社会时代，政府根本就不会考虑去制定任何政策，因为政府就未必能制定出来；但是大众政治时代，政府就必须应对大众意见了，于是内政和外交方面的政策就会大不一样，比如，可能会出现问题。\n\
    \n传统的政府不在于平民主，除了不涉及选员制度，因为传统社会有特别等级。打个比方，传统社会的结构就像蜂群，里面养个100的小格子，就是那些统治的土包子，这种小格子天然地就给整个蜂巢带来秩序。\n\
    \n但是工业革命和政治革命，都把蜂巢小格子的城堡给击碎和推平，蜂群内不再存在天然的秩序了。如果不重新找到什么去维护起内部秩序，那蜂巢可能就会彻底崩溃了，所以必须找到一套新的玩法，重建秩序。\n\
    \n工业革命和政治革命的全新玩法，可以用一个词来概括，就是“理性化”。传统的，由于社会带来的，治理的需求被小，所以君主们可以松松垮垮，用权宜之计的方式来应对，但根本不容考虑太多效率问题。\n\
    \n但是大众政治时代，需要治理的内卷急剧增多，必须提升治理效率，把治理办法抽象化、规则化，用同一套规则来应对各种层级的不劳的问，否则根本来不及。这就是所有国家的“理性化”。\n\
    \n## 不同路径的“理性化”\n\n当然，在两种革命中，“理性化”具体的展开路径也是很不同的。\n\n**在英国工业革命的路径下，理性化主要是工厂的管理制度上全面展开，政府层面相对来说是被动的。**\n\
    \n过去的工业基本是手工作坊，师傅传徒弟的方式，徒弟大概按师傅规矩可，但工人来了以后，订单可以先定规模可重复性，工人不过就是学配制把师傅的手艺全部学来，再按照分配下一个特定的工序全部学来，重复一种机器动作。\n\
    \n于是，工厂的管理制度就全变了，所有的规则都以效率为目标，而且越改越优化，不重要的工业化流水线，其目的就是统一，中间不需要的是新的工厂制度，没办法没有制度。蒸汽机是用上了的，因为蒸汽机就是只适合于规模生产，不适合手工生产的。\n\
    \n理性化的工厂制度，完全是工业非手工功能带来的。这样一来，英国为了增强工业的竞争能力，就有了增强工业的可能性。**工业革命由英国的财富和军事技术提升，支撑强大的阶级权力，以进行战争的手段，都取得了极大的飞跃，这就让它能够更加巩固在世界的霸主地位。**\n\
    \n英国的位置上，还希望把他国家死死在英国的地位上，让自己持续并不断扩充的竞争优势。这样一来，国际秩序就不再是单一的竞争，又成了国际竞争秩序斗争。这下，其他国家也被迫必须要进行工业革命，否则就只能受英国秩序压制，这个过程带来了国内外的各种连锁反应。\n\
    \n再看英国，在政治革命的路径下，法国的“理性化”主要是在政府的官僚制这个层面上展开的。\n\n实际上，官僚制是在国王统一法国之后就开始了。原先的国王只能管住自己的二分之一，事情也多，但以前国王把法国的贵族打跑之后，所有事情都得到家了，需要官僚制的事务突然开始膨胀。于是，国王就开始在家里范围内设置官僚制。\n\
    \n但在家主制时，有很多势力的区域是放不开，官僚效率也低，很多领域被搞得太不穷的体现；到了大革命之后，历史大翻转，于是，官僚制在家主制的效率一下子就搞出来。但是，法国的政府对于社会的控制能力，在大革命之后变得更强了。\n\
    \n此外，法国大革命在当时法国政治中还有一个深远影响，就是观念层面的冲击。因为大革命颠覆了传统秩序，在欧洲的君主和臣民的正当性，这其实就欧洲各国的君主们自己吓坏了，而其他国家人民的反抗对法国革命产生了巨大的影响，**法国革命从一开始就从转化为一场遍及全欧洲，持续了几十年的大风暴，也在欧洲掀起了几乎是连锁式的革命。**\n\
    \n此外，法国革命在当时的国际政治中还有一个深远影响，就是观念层面的冲击。因为大革命颠覆了传统政治秩序在欧洲人民心目中的正当性，这让其他欧洲国家的君主产生巨大恐惧，而其他欧洲国家的人民都对法国革命产生了巨大的热情，**法国革命直接就从严政转化为场遍及全欧洲、持续十几年的大规模战争，也在欧洲掀起了近乎是连锁式的革命。**\n\
    \n在这个过程当中，国家间战争的打法、各国内部政治的逻辑、国家间关系，以及人们对于正当国际秩序的理解，全都发生了极为深刻的不可逆的变迁。法国革命在政治正当性、政治组织模式、军事组织模式等方面，都对其他国家形成降维打击的优势，逼迫着其他国家也都脱离开传统的打法，向新模式靠拢。\n\
    \n你看，经过“理性化”过程的英国和法国，率先进入到一个新时代，而当时的其他国家不论在工业生产、社会治理还是政治军事的组织形式上，都仍然处于传统时代那种松散的形式中，根本无力对抗英国和法国。\n\
    \n如此一来，**从18世纪后期开始，欧洲各个国家都开始了工业革命和政治革命这两重革命的进程，并且革命不断向前迭代，持续了近百年，推动了国际秩序的剧烈演化。**我们今天所知道的大量国际政治上的逻辑和玩法，都是在这个时代浮现出来的，要把握对于国际政治的分析方法，就无法绕开对于大革命时代的深刻把握。\n\
    \n从下一讲开始，我们要来具体展开，大革命时代英法两国的降维打击，具体是怎么展开的。其他国家在遭遇降维打击时，又是如何反抗的。\n\n下一讲再见！\n\n\
    ![](img/f6fb9f119d5a36bef5023e2714febb8d_21_0.png)\n\n> **英国工业革命和法国政治革命的全新玩法，可以用同一个词来表达，就是“理性化”。**\n\
    \n因为进入大众政治时代，需要治理的内容急剧增多，必须提升治理效率，把治理办法给抽象化、规则化，用同一套规则来应对各种层出不穷的问题，这就是所谓的“理性化”。\n\
    \n在英国工业革命的套路下，理性化主要是在工厂的管理结构这个层面上展开的。而在政治革命的套路下，法国的“理性化”主要是在政府的官僚制这个层面上展开的。\n\n\
