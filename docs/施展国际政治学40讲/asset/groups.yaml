    中国是从农耕社会过渡过来的，虽然我们很多人并没有从事过农业劳动，但是祖辈在农耕中形成的，对计划性和确定性的追求，却深深的印在了中国人的脑海里，所以才有那么多人追求稳定而不是突破。


    计划主义能带来秩序，但这种秩序的背后，是创新的锁死。短期来看，心往一块想，劲儿往一块使，有利于既定任务更有效的完成；长期来看，做什么，其实比怎么做更加重要，而做什么，是创新在引领。


