    ## 11｜国际经济学：德国如何对**付**富起来的英国？


    **作者/国际经济学40讲**


    你好，欢迎收听《国际经济学40讲》，我是施炜（**施展**）。


    上一讲谈到了率先实现工业革命的英国，如何通过与其它国家之间的产业落差，发展出了自由贸易的这种学说，对其他国家形成了经济上的降维打击。这种**优势**（原文“说法”）在美国特别成功（**适用**），但是其它国家肯定不痛快，非得想办法怎么对付英国的降维打击。


    这一讲我会带你看看两位经济学家的理论，其中一位是我们前面提到的英国的亚当·斯密，另一位是19世纪初德国著名的**政治**经济学家弗里德里希·李斯特。李斯特的理论，就代表着工业革命时代德国对英国的反击思路。


    ### 李斯特对亚当·斯密的挑战


    这两位经济学家观点很不同，你可以把他们看作辩论双方，代表英国的斯密认为，从经济的角度来看，国家只要提供一个公平的法律环境就行了，其他方面的参与越少越好，就让个人一直跑到世界市场上去折腾，这是最好的。


    而代表德国的李斯特认为，亚当·斯密看到个人在世间扮演这个角色，忽视了国家这个中间层次的作用，恰恰**是**国家在经济政策当中有着至关重要的作用。


    也就是说，斯密认为，国家在经济中的角色也应该是“**管**得更少，只要**少**替人做**决策**就行了”；李斯特认为，国家可以**干**得更主动**，**它得重新定义，要有一个整体的规划。


    不过，亚当·斯密的著作《国富论》出版于1776年，李斯特的著作《政治经济学的体系》**晚**（原文“早”错误，1841年出版）**于**斯密**作品**（或“要**晚**十年**多**，**半**拍”），所以在双方的交锋，其实就是李斯特对斯密的反击，斯密自己已经走了。这位**已故**经济学家的理论PK，后来体现在了英国和德国的政策PK上。


    也许你会问，理论对政策的影响力能有多大？这说法会不会过分拔高了理论的影响力？


    我可以换另一个伟大的经济学家凯恩斯的一段话来回应这一**问题**。凯恩斯说，“经济学家和政治哲学**家**的思想，无论**是**对还是错，实际上都是**支配**治人（**人**）**之**国家思想的力量。这个世界**里**几乎没有**不**曾经是某个思想家的奴隶，当那些已经被否定了的（**思想**），就受到被新思想冲击者信奉的，其实也不过是若干年前某个死文人（**经济学家**）狂妄思想的零碎而已。


    这样就知道理论对于政策的巨大影响力了，理论是人们用以理解世界、发现问题的基础框架，政策只不过是用来解决理论所识别出来的问题的。


    但我还得再进一步，斯密与李斯特两位理论家**的著作**并不**像**用来政策的宣示，**而**是**那样**的，随着历史的变化，他们的理论**就**没有价值了，就会成为**贬低**（原文“中传”）**他们**的**谬**话。


    他们俩是在关注人类**永恒**要面对的一些真正深刻的问题，但两个人入手角度不一样，所以会有理论上的差异，而他们的理论产生的政策效应，是理论和时代发生共振的结果。


    ### 亚当·斯密的自由贸易论


    ### 经济是否是人类**的**唯一追求


    但是有个问题仍然需要回答，就是德国崛起只是个结果，在当初，李斯特也不能保证这个结果一定能实现，但如果要实施李斯特的办法，德国就要为这个不确定的结果承担很多痛苦的努力，那么，德国为什么一定要努力超过英国呢？


    如果通过农业也能够积累起很多的财富，国民也能过得很舒适，那就做个安静的国家不好吗？实际上现代世界有不少这种国家，比如澳大利亚和新西兰，就没啥工业，主要靠第一产业发展起来，但是也非常富裕。


    其实，李斯特也不认为所有国家都有能力或者应该奉行国民经济学的路数，**多**数**一半**（**绝大多数**）国家在世界市场上获得一个被动分工状态就行了，因为国民经济学的实践过程会有很多痛苦。只有那些有着伟大的文化抱负的国家，才应该接受这些痛苦，因为它们对于人类秩序有着更加重大的责任。


    这也就是李斯特所关注的永恒问题了，就是经济是否是人类**的**唯一追求？在这之外是否还有其他的更重要的价值，如果有这种价值存在，然而它却可能被单纯的经济考虑伤害的话，那么国家在这里面是否应该起到一些作用呢？


    但是你要注意，虽然李斯特提出了经济以外的其他价值，但是我们不能说亚当·斯密的理论就是只考虑经济而不考虑其他价值。


    相反，我们在前面也说过，斯密认为自由贸易具有**着**重大的道德价值的。不过，斯密是在全人类意义上抽象谈论道德价值，忽视了具体人群可能起到的特殊作用；而李斯特就是把这个道德问题从另一个角度提出来，对斯密是一个很严肃的挑战。


    你看，英国自由贸易的打法，对欧洲其他国家形成了降维打击。而德国在对英国的反击过程中，先从理论再到实践，实现了国民经济学的路线，成功实现了对英国的反击。但是新的国际秩序不仅由经济层面来推动，政治层面的变化也直接推动了新秩序的形成。


    下面几讲，我们就来看法国的大革命，以及政治革命对全欧洲政治秩序的冲击。


    **下**一**篇**再见面！


    ### 划重点


    - 斯密的高超之处在于，他还进一步论证出了自由贸易的道德价值。


    - 他认为，各国之间的自由贸易，可以让全人类普遍享有繁荣与自由。这种论证为后来大英帝国主导的全球自由贸易秩序，提供了最高的正当性论证。


    - 而李斯特所关注的永恒问题是，经济是否是人类**的**唯一追求？


    - 如果在经济之外还有其他的更重要的价值，然而它却可能被单纯的经济考虑伤害的话，那么国家在这里面是否应该起到一些作用。


