    # 经济是否是人类是唯一追求


    但是有个问题仍然需要回答，就是德国崛起只是个结果，在当初，李斯特也不能保证这个结果一定能实现，但如果要实施李斯特的办法，德国就要为这个不确定的结果承担很多痛苦的努力，那么，德国为什么一定要努力超过英国呢？


    如果通过农业也能够积累起很多的财富，国民也能过得很舒适，那就做个安静的国家不好吗？实际上现代世界有不少这种国家，比如澳大利亚和新西兰，就没啥工业，主要靠第一产业发展起来，但是也非常富裕。


    其实，李斯特也不认为所有国家都有能力或者应该奉行国民经济学的路数，多一半国家在世界市场上获得一个被动分工状态就行了，因为国民经济学的实践过程会有很多痛苦。只有那些有着伟大的文化抱负的国家，才应该接受这些痛苦，因为它们对于人类秩序有着更加重大的责任。


    这也就是李斯特所关注的永恒问题了，就是经济是否是人类是唯一追求？在这之外是否还有其他的更重要的价值，如果有这种价值存在，然而它却可能被单纯的经济考虑伤害的话，那么国家在这里面是否应该起到一些作用呢？


    但是你要注意，虽然李斯特提出了经济以外的其他价值，但是我们不能说亚当·斯密的理论就是只考虑经济而不考虑其他价值。


    相反，我们在前面也说过，斯密认为自由贸易具有着重大的道德价值的。不过，斯密是在全人类意义上抽象谈论道德价值，忽视了具体人群可能起到的特殊作用；而李斯特就是把这个道德问题从另一个角度提出来，对斯密是一个很严肃的挑战。


    你看，英国自由贸易的打法，对欧洲其他国家形成了降维打击。而德国在对英国的反击过程中，先从理论再到实践，实现了国民经济学的路线，成功实现了对英国的反击。但是新的国际秩序不仅由经济层面来推动，政治层面的变化也直接推动了新秩序的形成。


    下面几讲，我们就来看法国的大革命，以及政治革命对全欧洲政治秩序的冲击。


    一下再见面！


    划重点


    斯密的高超之处在于，他还进一步论证出了自由贸易的道德价值。


    他认为，各国之间的自由贸易，可以让全人类普遍享有繁荣与自由。这种论证为后来大英帝国主导的全球自由贸易秩序，提供了最高的正当性论证。


    而李斯特所关注的永恒问题是，经济是否是人类是唯一追求？


    如果在经济之外还有其他的更重要的价值，然而它却可能被单纯的经济考虑伤害的话，那么国家在这里面是否应该起到一些作用。'
