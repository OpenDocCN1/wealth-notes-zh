    # 37 | 观念：文明的冲突如何挑战了世界秩序？


    你好，欢迎收听《国际政治学40讲》，我是施晨君。


    前两讲我们讲了技术对于秩序和战争的影响，也许你已经感受到了，大航海时代的各种冲突，冲突和不确定性。但是，技术不过是工具，如何运用工具，取决于人们的目标。


    而人类行动所设定的目标，在最高层面上，是以文明或宗教为替代目标的。所以，我们的下一讲，将着重阐释大航海时代下一个绕不开的话题，文明的冲突，你会发现，它远比我们最初想象的复杂得多。


    # 文明的冲突


    “文明的冲突”这个说法最早来自美国政治学家塞缪尔·亨廷顿。他在20世纪90年代末出版了一本小书，叫做《大转型与 世界秩序的重建》，他指出，在冷战结束 后，曾经靠东西两大阵营的意识形态冲突压制住的很多矛盾，有可能重新显现出来。最核心的问题
    是各种宗教、文明和语言的冲突，人类的冲突可能会在冷战的时期陷入更大的不确定性。


    亨廷顿的这个 结论 在同一世纪 就引起了很大争议，但进入21世纪之后，越来越多的观察者开始重视他。人们发现，越来越多的冲突不是发生在本国与异国之间，而是发生在不同文明之间，比如伊斯兰之
    间，因为对于现代的文明观念有某些不认同，引发了比较复杂的冲突。


    在伊斯兰教看来，真正的主权只能属于真主安拉，因为真主也是万一切标准的 制定者，人 民并不 能作为他人 的 主权， 或 作为 主权 人，就 现代 国家 理论
    中 一个 基础 观念 是 人民 的 主权， 这就 意味着 主权 的 一个 基础 观念 是 人民 的 主权。


    虽然伊斯兰教对 主权 的 理解 跟我们 不同，但 我们 不能 简单地 就 说 以 为 伊斯兰 文明 对 国家的 那种 理解 是 有 问题 的。你 可能 会
