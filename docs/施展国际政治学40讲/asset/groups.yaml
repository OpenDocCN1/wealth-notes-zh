    \n要理解这一系列过程，我们又必须得搞清楚第三世界力量的兴起与全球秩序转型之间的关系。这背后蕴含着20世纪60、70年代一系列最激动人心的历史。这就是我们下一讲的内容。\n\
    \n下一讲再见。\n\n![](img/f6fb9f119d5a36bef5023e2714febb8d_61_0.png)\n![](img/f6fb9f119d5a36bef5023e2714febb8d_61_1.png)\n\
    \n### 留言精选\n\n- **李盈**\n  政治不是一种实体，政治本来就是人类的想象共同体，谁能合情合理的描绘这种想象，谁就能在政治的博弈中，获得更大的生存空间。\n\
    \n  在冷战时期，大家对世界的最常规的理解就是两极格局，这就让大家 的政治想象，只能局限在美国或苏联两个阵营，当一个国家既不从属于美国，也不从属于苏联，它的处境就会非常被动，比如中国和南斯拉夫。\n\
    \n  而中国根据经济发展阶段，给出的三个世界的划分，迅速将世界大部分国家划到了自己的阵营，而自己作为这个阵营中最强大的国家，又无无穷的为这个群体争夺大家共同的利益，努力塑造阵营领袖的角色。\n\
    \n  总之，在政治的诸多智慧中，如何划分我们、你们和他们是是非常重要的内容。如果用meece原则来判断，我觉得中国对世界的划分，更准确的做到了相互独立和完全穷尽，一举改变了中国被边缘化的外交态势。\n\
    \n- **冯瑶**\n  在施展老师前面的课程中，我学会了用不同的视角去看世界历史，如果用超出中国的视角看大阵营时代的东亚，就能看到美苏争霸和中国的相互影响。\n\
    \n  我读到牛军教授《东亚冷战视野下的中美关系》一文，其中提到了东亚冷战的几个特点：\n  1、东亚的战略地位不是美苏竞争的中心， 是次中心或特殊中心。\n\
    \  也正是东亚的特殊地位不是竞争 中心，才有有别于中心地区的特殊情况和美苏的特殊政策。\n  2、东亚发生了一系列密集的大规模、高烈局部战争，包括中国的内战、朝鲜战争、越南战争。\n\
    \  3、东亚在冷战40多年中出现了持续繁荣局面，并持续至今。欧洲是在没有战争在美国援助下实现的复兴，东亚则是在持续大规模的局部战争结束后，出现快速发展。\n\
    \n  从东亚独特的发展环境和现实看，中国一直处于重要的角色，在周边国家迅速发展的阶段，中国的发展也受到了环境影响。\n\n  结合施展老师前面的《中国史纲》课程中，我进一步体会到这种影响实际上是各种因素相互作用的结果，东亚和中国在大阵营时代中虽然不是帝国博弈的中心，但深刻影响到两大阵营的努力均衡、相互政策和发展演化方向。\n\
    \n- **佛祖门徒**\n  无论是读老师的书，还是学习老师在得到上开设的课程或讲座，每首都让身处斗室中的我能领悟到其中宏大的视野去感受时间长度和广袤空间，其中脉络清晰的逻辑阐述更是产生一种脑洞大开的愉悦。\n\
    \n  枢纽，借用老师的书名，我看到具有双重属性的中国社会主义革命让这个古老的东方国家，建立了国际秩序和世界治理中的枢纽地位，成为影响甚至重构格局的关键力量。\n\
    \n  生态位，不仅是自身所具备的天地间物的天然条件，更是在积极的自我探索与实践，以及对周遭政治生态的敏锐把握，中国找到了独具竞争力的政治生态位，为立足、发展和强大争取了极其有利的条件。\n\
    \n- **戚志光**\n  第三世界这个概念的创造，把中国和广大的国家联系在一起，从而形成了一个 “想象的共同体”。虽然这个共同体的联系没有国家那么紧密，但是一种新的想象本身，就是被认同的开始。\n\
    \n  必须得为中国当时如此高明的政策创新手动点赞。\n"
  mdcn: "\n## 27 | 冷战：美苏两国为何相互对抗又相互依存？\n\n你好，欢迎收听《国际政治40讲》，我是施磊。\n\n上一讲里，我谈到了二战之后，欧洲如何努力打造自己的帝国。这一讲里，我们再来看看两大阵营的盟主，美国和苏联。\n\
    \n平时我们一谈到冷战，说美苏两大阵营的对峙，往往把冷战简化成两者对立的关系，但你仔细分析一下，你会发现两者的对峙建立在复杂化了。这两大帝国呈现出的关系是于你一种既相互对抗又相互成全的关系。\n\
    \n听过前面的课程你也应该知道，在二战前，美国长期实行的是孤立主义的政策，尽管是号称世界警察，但其在二战之后美国愿意为了自由主义的主导者，而且还和苏联展开激烈的对抗呢？\n\
    \n### 美国的精神结构\n\n其实我们前几讲也提到过，二战后，**美国在政治理念上有一个很重要的改变，就是从孤立主义向普世主义的转向。**也就是说从只管自己的事变成要世界的事，甚至要全世界的事。而美国的这种理念转变，基本上可以说由苏联激发出来的。\n\
    \n为什么这么说呢？\n\n我们先在精神时代里的变化，分析美国的精神结构。它的特点就是纯粹，而美国的主体居民是清教徒，他们有一个基本信念，自己是在上帝的选民。**这种信念包含美国在国策上可能会呈现的两种相互对立的面向，一种是孤立主义的面向，另一种是普世主义的面向。**\n\
    \n这两种是清教徒精神中不可分割的部分，但不会同时表现在外。美国政策则呈现哪一面，取决于它对对方的衡量。\n\n在美国的相对力量比较弱的时候，这种清教徒，如同其他世界，但世界各地的人民都愿意了，**他们称之为自留地，全世界都对我们失去了这一个干净的种子。**我们是上帝在人世所留下的最后的，承载着人类的未来，所以要小心呵护我们这个共同体。\n\
    \n所以，在这种情况下，除了跟旧世界的经济关系之外，美国很可能退回到自留地的政策，就是一种孤立主义的政策。一直到20世纪中期以前，除了短暂的例外，比如一战之后，美国基本上都是这个样子。这也导致当时的美国在国际政治上很不起眼。\n\
    \n但是，随着美国的力量变得强大，美国又可能觉得，我们这群清教徒具体体现，如此之下，我希望全世界都跟我们一样，**是上帝之许给你的东西向外的扩展，让世界上的所有罪恶都，在这种情况下，它又会表现出一种普世主义的信条。**\n\
    \n### 美国的普世主义如何被苏联激活\n\n既然美国的精神结构本来就包含看这样激越的普世主义冲动，**为什么是苏联激活了它普世主义的一面呢？**\n\n\
    看一两两次大战后的历史就明白了。一战后，在威尔逊总统的推动下，美国一度从孤立主义走向普世主义，但是他的种族性格非常决绝，这在美国内部都是，**一战的说美国会坚决地回归传统的事情，威冷逊总统没有机会。所以美国就又退回到孤立主义了。**\n\
    \n二战刚刚结束的时候，美国内部的主流声音还是打算重新回到孤立主义，并且一度也回到了过去。但是很快又转向普世主义，一度至今。为什么一战后的美国退回去，**而二战后的美国就留下来了？原因在于，它所要面对的整个世界不一样了。**\n\
    \n有者苏联这边。苏联要想让自己的帝国国内各个国家的革命方向同自己要保持一致，就必须对这个国家拥有实际的事军事控制能力。而军事控制能力的前提是苏政的财政支撑能力。苏政的势力范围所在的东欧、中亚及部分地区东欧区，恰好就是苏联军事控制能力和财政支撑能力的平衡点所在。\n\
    \n苏联从美国之外在阿富汗渗透头，除了阿富汗地区结构极其复杂之外，还有一个重要原因，就是阿富汗已经超出了苏联的军事攻防能力和财政支撑能力的均衡点。\n\n\
    因此，大阵营时期的世界格局，初看上去是两大帝国都不满足满意的状态，但实际上是两大帝国各自达到现实可行的扩张极限之后的均衡结果。\n\n在这种情况下，美苏对于对方的势力范围，不但不想承担任何责任，还认可指出对方在这些地方构建的顺序是邪恶的。这也让他们各自都能达成稳态，不至于被人指责虚伪。\n\
    \n于是，一个有趣的现象浮现出来了，对手的存在，反倒使美苏两大帝国无需背负太多理想性和现实之间的矛盾。\n\n这一步里我们看到了美苏两大帝国的复杂博弈逻辑，实际上它们的博弈给中国带来了一个全新的机会。在冷战时代的世界格局中，中国是社会主义国家，却不在苏联大陆阵营的扩展极范围之内。中国南方大范围的沿海区域，适合参与到全球性经济秩序当中，却超出了美国海洋帝国的扩展极范围之内。\n\
    \n中国就成长为世界秩序中的中性化力量，在这个时候就重新凸显出来。中国的成长改变了大阵营时代的演化逻辑，下一讲我们就来谈说，大阵营时代中国角色。\n\n一下讲更多。\n\
