    老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。\n\n# —— 识字卡片 ——\n\n![](img/6b2d826949bfddce96931988065f7fef_79_1.png)\n\
    \n# 1.北的本意是意见相悖\n\n东西南北，方向又不止一个，为什么失败了要说“败北”呢？想搞清楚这个问题，还得从甲骨文看起。\n\n“北”的甲骨文  \
    \ 是两个人形，一个朝左   ，一个朝右   ，两个人朝相反方向站立，很像两口子吵架。\n\n北的造字本义类似于两个人吵架。《说文解字》：唯一断更 更微信：699250\n\
    北，乖也。从二人相背。\n\n乖我们学过，是相违背的意思。字形采用两个相背的“人”会义。金文   、篆文   字形变化不大。隶化后楷书   把两个人形符号化成了，也更简洁有力了。\n\
    \n北的原意是意见不合，谁也不理谁，所以背向而立，背向而立就引申为人体的后背。后来字形细分，加表示肉体的月，成为“背”。\n\n![](img/6b2d826949bfddce96931988065f7fef_79_2.png)\n\
    \n# 2.引申为人体的后背\n\n意见不合给对方后背，打仗的时候，逃跑也是给对方后背。\n\n>   追亡逐北，伏尸百万。\n  （贾谊《过秦论》）\n\n\
    >   连战皆北。（《史记·项羽本纪》）\n\n这里的北，都是打败仗的意思。\n\n这就是败北。\n\n# 3.坐北朝南为什么好\n\n这就要说到中国的建筑了。中国地处北温带，地势西北高，东南低，冬季冷空气南下，刮寒冷的西北风。所以中国人的建筑都是正南正北，北边的墙很厚，窗户很小，以抵御西北风。夏季南方的暖湿气流北上，到东南风，所以中国人的房子南面开敞，以便采光通风，这就是南北通透。天子的大殿尤其讲究正南正北，天子坐在大殿上，后背的方向就是北了。\n\
    \n所以坐北朝南是尊位。在举行朝会的时候，背北面南，为尊，因此称帝叫作“南面”，南面朝帝。而为臣则叫作“北面”，北面称臣。另外，通常的看法是，右者为尊，因此遭受贬谪称为“左迁”。\n\
    \n![](img/6b2d826949bfddce96931988065f7fef_79_3.png)\n\n《史记·高祖本纪》有一段：\n\n>   发使者告诸侯曰：天下共义立帝，北面事之。今项羽放杀义帝于江南，大逆无道。\n\
    \n刘邦说我们都向义帝北面称臣，而项羽却在江南把义帝杀死，真是大逆无道。义帝是楚王的后裔，项羽、刘邦都打着拥立义帝的旗号。项羽杀义帝固然无足轻重，却让他在道义上居于不利的位置。坐北朝南是更有资格的。\n\
    \n# 4.座位的方向有讲究\n\n在厅堂上，最尊的座次是坐西面东，其次是坐北向南，再次是坐南面北，最卑是坐东向西。\n\n《史记·项羽本纪》中载有：\n\n\
    >   项王、项伯东向坐，亚父南向坐……沛公北向坐，张良西向侍。\n\n其中，项王的座次最尊，而张良的座次最卑。而在座次的排定上，地位次要的人则居于最尊者的右边。\n\
    \n# —— 总结一下 ——\n\n+   1.  北的原意是意见不合，互相违背；\n2.  由于意见不合背靠背，引申为人体的后背；\n3.  由于中国气候的特点，房屋通常坐北朝南；\n\
    4.  天子大殿坐而论道的时候，后背的方向就叫北。在传统上，坐北朝南是正位。\n\n# —— 思考题 ——\n\n我们通常说北上，南下，你认为为什么要这样说？\n\
    \n![](img/6b2d826949bfddce96931988065f7fef_79_4.png)\n\n每个字都让你\n恍然大悟"
