  md: '# 【醋】吃醋真的让人鄙视吗？


    【醋】吃醋真的让人鄙视吗...


    老湿提示：订阅专栏后，文稿中的象形文字可截可点，放大来看，细细品读。


    # 识字卡片


    ![](img/6b2d826949bfddce96931988065f7fef_8_0.png)


    # 1、要谈“醋”，得说“昔”


    篆文的醋是一个酉


    ，酒的意思；加上昔


    ，表示过去。这个字型揭示了醋的来源，它是酒在自然环境中由于微生物的发酵作用而变酸形成的。


    解释一下往昔的昔，昔的甲骨文


    ，下面是代表太阳的日


    ，上面是模仿流的水


    。


    江水流淌，表示这是泛滥成灾的洪水。水在上，日在下，表示洪水滔天的过往岁月，很像老人给年轻人讲古老故事的情景。


    这个字你想起了谁？没错，大禹治水，还有诺亚方舟。


    古老的民族传说中都有这样的水天洪大，这就是往昔的昔，加上心字旁，对过往用心，就是珍惜的“惜”。


    # 2.东西方的醋不同


    醋是酒的衍生物，酒醋同源，凡是能够酿造的古物，都会酿醋。不同的是，东方国家以谷物酿造醋，西方国家以水果和葡萄造醋。


    古埃及时期就已经出现了醋。传说埃及法老克利奥帕特拉七世就非常喜欢吃醋。她喜欢用醋醋湿珍珠，一饮而下。据说这种饮品是克里奥佩特拉的秘方妙法。


    # 3.古代称醋为“酢”


    在中国，通常认为醋在西周时开始被酿造，但也有人认为醋起于商朝或更早。


    醋在古代称“酢”（zuò），酢字出现在商代以前，周王室中已有了“酢人”，专管王室中酢的供应，日本仍用酢字称醋。


    酢的右边是乍，是作的原字，来源于用斧砍砧木头制作器物，表示人工制造。酢的意思就是人工有意酿制的酸味食品。


    # 4.醋的最大特点就是“酸”


    酸的大篆是一个酒坛子


    加上一个象的右半边，，原意是高大的神像。


    这个字符组的字通常与高大挺拔有关：


    +   - 加入俊，英俊；

    - 加马骏，骏马；

    - 加山峻，峻峭。


    那加酉酿酒呢？


    指这种味道非常刺激。


    酸、苦、甘、辛，咸，在古代的五味中，酸的味道最刺激。所以这样的味道也用来表示人的心情。


    说到醋和酸，自然就想到吃醋，人们用钻醋吃酸来形容女人因妒忌而产生的不理性行为。


    # 5. “吃醋”心情的来历


    吃醋的来由有点惨烈。


    唐太宗为了笼络右相宰张相玄龄，下令赐给他美女，为他纳妾。但房玄龄坚辞不受。


    唐太宗知道，房玄龄不是不想要，而是不敢要，他家夫人出了名的厉害，不可能同意房玄龄纳妾。


    于是唐太宗让人给房玄龄的夫人送去一壶毒酒，唐玄素让她纳妾，要么喝毒酒。


    房玄龄夫人也真是刚烈，把那壶毒酒一口喝下。


    结果那壶里不是毒酒，而是香醋。


    从此，吃醋、醋坛子就成为了女人妒忌的代名词。


    其用今天的眼光，房玄龄夫人正是在维护自己的权益，是独占的，怎么能分享呢？


    夫人不仅不遵就大官的房玄龄，就连一言九鼎的皇帝也干脆利落的怒回去，大不了把命给你，真是个女汉子。


    这醋，够刺激吧。


    # 总结一下


    +   - 醋的原意是酿酒及酸的产物；

    - 醋的右半边“昔”来自远古大洪水的记忆；

    - “酸”，是五味中最刺激的味道；

    - 形容人“吃醋”的说法，来自房玄龄的夫人大吃下喝下“毒醋”（其实是醋），也绝不受协同意皇帝给妾纳妾的故事。


    # 思考题


    醋是酸的，酸也指人的情感。有一句著名的诗句被毛泽东引用：天若有情天亦老。来自李贺的《金铜仙人辞汉歌》。这首诗里有一句“东关酸风射眸子”，你是怎样理解诗句里这个“酸”字的？


