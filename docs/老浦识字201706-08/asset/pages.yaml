  md: '又过了十天，齐王问。


    高手答：“还没有，它听到动静马上有所反应，不稳重。”


    再过十天，齐王又问。


    高手答：“还行，它眼光敏锐迅猛，傲气十足。”


    又过了十天，齐王最后一次问。


    高手终于回答：“这回可以了，别的鸡打鸣，这只鸡不为所动，看着就跟一只木鸡似得，别的鸡看见它精气内敛，渊渟岳峙的姿态，根本不敢跟它打，转身就跑。”


    其实，呆若木鸡这个成语，是形容一种不为外所动的极高的人生境界。


    ![](img/6b2d826949bfddce96931988065f7fef_2_0.png)


    # 【狗】


    狗是人类最早驯化的动物，在狩猎采集为主要生产方式阶段，狗是不可或缺的得力助手。


    甲骨文的狗是一个象形字：犬，细长的身体，长长的尾巴，一看就是一只善于奔跑、身形健美的好狗。


    ![](img/6b2d826949bfddce96931988065f7fef_2_1.png)


    和犬相关的字，反应了古人心中的狗的形象。


    臭（xiù），上面一个表示鼻子的“自”，下面一个“犬”，表示狗嗅觉的灵敏。


    狩猎的狩，一个，加上一个犬，表示手持木棍，带上狗去打猎。


    埋伏的伏，一个人带着犬趴在隐蔽的地方。


    篆文的猝，一个犬，加上一个表示声旁的卒，表示犬从草丛中猛地窜出来追逐猎物。


    这些犬字旁的汉字，是古代狩猎活动生动的写照。从这些字上，我们分明能够感觉到猎人和自己心爱的猎犬亲密无间的关系。


    再来看一个很有意思的字—戾。


    戾气的戾，上面的户代表房屋，旁边有个犬，表示狗在看门的时候极其凶恶。'
