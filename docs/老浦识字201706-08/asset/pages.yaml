  md: '# 125【问答】为什么去北边叫“北上”


    ![](img/6b2d826949bfddce96931988065f7fef_80_0.png)


    125【问答】为什么去北边... ↓


    在洞穴里人躬身曲体是“穷”，那么在洞穴里有一只老鼠 **窟** 是什么字呢？


    老浦


    是“窜” **窟** ，“穴”里面一只“鼠”，老鼠在洞穴里快速逃跑，是不是很形象？


    每次看电视节目《档案》，总觉得主持人煞有介事。这里的“介”怎么解释？


    老浦


    这是江浙一带的吴语方言。


    煞是很，煞有就是的确有，好像真有。


    介事：这样的事。介是江浙方言，意思是“这样”、“好像真有这么回事似的”。


    由于是方言，和我们正文介绍的“介”字的用法都不同。


    甲骨文 **戔** 是两个戈矛，一个矛头向上 **干** ，一个矛头向下 **王** ，显然在互相争斗。篆文 **殘** 加上一个表示死的字符 **歿**
    ，你来猜猜看，这是什么字？


    提示一下，这是“足够”的反义词。


    老浦


    足够的反义词是残缺，这是残缺的“残” **殘** 。两个戈矛相斗，表示战争的破坏性。


    篆文 **殘** 加上表示死亡或坏事的“歹” **歿** ，强调了战争造成的创伤。所以残缺、残酷、残忍均由此而来。


    表示太阳的“日”是汉字重要的组成部分，这个甲骨文 **冒** 上面是羽毛的羽 **羽** ，下面是日 **日** ，你来猜猜看，这是什么字？


    老浦


    这是练习的习 **習** ，繁体字是“習”。表示小鸟在晴空下练习飞翔，也有解读为小鸟每天反复练习。


    我们通常说北上，南下，你认为为什么要这样说？


    老浦


    +   1. 中国地势北高南低，北方多高原丘陵平原，南方多湖泊河泽，盆地丘陵。所以说“北上”“南下”；


    +   2. 风水布局讲究左青龙，右白虎，上朱雀，下玄武。落实到方位，则东方为青龙，西方为白虎，北方为朱雀，南方为玄武。所以北为上，说“北上”，南为下，说“南下”；


    +   3. 皇帝的宫殿都是坐北朝南，所以北为上；


    +   4. 地图是上北下南。


    好，今天的问答就是这样的，明天咱们继续复盘往期的内容，不要错过。'
