    # 【省】意味着清醒


    # 【省】意味着清醒


    老萧提示：订购专栏后，文稿中的象形文字可截可点，放大来看，细细品读。


    # 识字卡片


    ![](img/6b2d826949bfddce96931988065f7fef_40_1.png)


    # 1. “省(xǐng)”字是如何演变和定形的？


    甲骨文的“省(xǐng)” [甲骨文图片] 是眼睛，上面有一个代表“生”的草叶 [草叶图片]，合起来表示用眼睛仔细观察小苗的生长情况，读音是xǐng。


    金文的“省(xǐng)” [金文图片]，将甲骨文字形中的 [部件图片] 写成 [部件图片]，多了一个点，这个点是指示符号，作用是加强“生”的字形。


    篆文 [篆书图片] 把金文字形中的“生” [部件图片] 写成类似“少” [部件图片] 的字形。


    隶书 [隶书图片] 则直接将上部写成“少”。


    省字就此定形。


    # 2.观察-反省-问候-了解


    古人从事种植，需要日日查看，所以“省”最早的含义是查看、考察。


    比如《国语.鲁语下》：


    > 诸侯朝修天子之业命，昼考其职刑，夕省其刑刑。


    意思是，诸侯早上执行天子的命令，白天尽职职守，晚上检查刑罚有什么过失。这个“省(xǐng)”，就是查看、考察的意思。


    由仔细观察，进而引申为检查、反省。


    《荀子.修身》：


    > 见不善，愔(qiào)然必以自省。


    意思是，君子见到不好的行为，一定自问，自己有没有这样的毛病，这叫反省自省。


    由自省，又引申出探望、问候。《红楼梦》元妃省亲就是这个用法。


    由探望，就又引申出了解、知道。《宋史.陆九渊传》：


    > 忽大省曰：宇宙内事乃己分内事。


    这个“忽大省”，就是了解、醒悟的意思。


    至此，就可引出“省”的第二个读音省(shěng)。


    # 3.从xǐng到shěng


    由仔细观察、了解，就借用为官禁之地、官署之地。意指这样的机构负责审查、了解，并清明廉正。进而，有了减少、节省的含义。


    《后汉书》：


    > 并省官职，裁减冗计。


    这个省（shěng），就是减少的意思了。


    到了元代，中央设中书省，地方行政单位也设中书省，叫“行省(shěng)”。省（shěng）的行政区划沿用至今。


    # 4.演变中的特殊情况：省shěng


    还有一个特殊情况，“省”这个字由“生”加“目”变形为“少”加“目”。还有一个没变形的写法，是“疠(shèng)”，即“疠”“目”，原意是眼睛生病(yì)，就是白内障，进而引申出疾病、灾祸的意思。


    《后汉书 杨震传》：


    > 上天降威，灾省频作。


    在古汉语中，这两个字可以通用。《周礼》就有“七日疠礼”，这个“省”，和“省”相通。


    “省”字的演变虽然复杂，但内在的逻辑是相通的，都与认真仔细观察有关。无论是孔子的“日三省(shēn)省”的省（xǐng），还是斩舍离的省（shěng），都是让自己清醒的。


    # 总结一下


    +   1. 省(xǐng) [图片] 的原意是眼前的小草，代表每天观察；

    2. 进而引申出探望、醒悟的意思；

    3. 又引申出另一个读音省（shěng），借代官禁、官署，元代的时候成为地方行政区域的名称“行省(shěng)”，沿用至今；

    4. 由疠，又引申出减少、节省的意思。


    # 思考题


    多音字经常容易读错，请你分析一下，“定省温清（qīng）”这个成语里“省”应该读xǐng还是shěng？为什么？


    ![](img/6b2d826949bfddce96931988065f7fef_40_2.png)'
