    # 【第】第策略一定要有锋芒


    老潘提示：订阅专栏后，专栏中的象形文字 简 可戳可点，放大来看，细细品读。


    # 识字卡片


    ![](img/6b2d826949bfddce96931988065f7fef_69_1.png)


    字源演变：

    cè

    缺 策 策 策 策

    甲骨文 金文 小篆 隶书 楷书

    文字原意：

    策的甲骨文是一根带刺的荆条...


    策划在我们这个时代越来越重要了，展览会、策划会议、策划方案...（省略）


    # 1.策是用来策马扬鞭的


    策的金文 是一种带刺的荆条，有的形似树棍。在束（cì）的上面加上了竹字头。"策"的篆意就是用带刺的荆条或竹棍去驱赶马匹...（省略）


    篆文的"策" 基本承续了金文的字形，竹字头，下面是"束"。


    《说文解字》：

    策，棓（chuī）也。从竹，束声。

    《说文解字》的解读说：策是赶马的短木棍...


    汉代贾谊在《过秦论》中有一句很有力的句子形容当时秦国的强盛：及至始皇，奋六世之余烈，振长策而御宇内...（省略）


    秦国发展到秦始皇执政，秦始皇奋发前六世的积累，扬鞭驱驭天下...（省略）


    # 2.鞭子的用处太大了


    《左传•序》：

    单犗一札谓之简，连编诸简简名为策。

    意思是单根卷一策叫简，把几个简编在一起叫策。也就是说是长简大论。


    杜预《春秋经传集解序》中说：

    大事书之于策，小事简牍而已。

    说大事件要详细记载，编辑成策，小事简略记载则写到简牍木块上就可以了。可见策是郑重其事的篇章。'
