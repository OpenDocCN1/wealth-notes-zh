  md: "![](img/6b2d826949bfddce96931988065f7fef_44_0.png)\n\n# 【乖】乖乖其实最不乖\n\n老浦提示：订阅专栏后，文章中的象形文字可点一点，放大来看，细细品读。\n\
    \n【乖】乖乖其实最不乖\n\n—— 识字卡片 ——\n\n![](img/6b2d826949bfddce96931988065f7fef_44_1.png)\n\
    \n![](img/6b2d826949bfddce96931988065f7fef_44_2.png)\n\n字源演变： guāi\n\n![](img/6b2d826949bfddce96931988065f7fef_44_3.png)\n\
    \n文字原型：\n\n金文的乖，中间是羊的简化，表示反、不服从的从，合起来表示反、不驯顺。\n\n![](img/6b2d826949bfddce96931988065f7fef_44_4.png)\n\
    \n乖，是我们日常用语非常亲切的昵称：小兔子乖乖，乖乖宝宝。但是只要稍微读一点古文，就会发现“乖”这个汉字并不乖，常常用于贬义，比如出乖露丑、时乖运蹇、乖僻邪谬等等，这是怎么回事呢？\n\
    \n# 1.乖的原意\n\n我们来看看古文字，这是金文的乖\n\n![](img/6b2d826949bfddce96931988065f7fef_44_5.png)\n\
    \n，中间是“羊”的简写，下面两边合起来是一个“北”\n\n![](img/6b2d826949bfddce96931988065f7fef_44_6.png)\n\
    \n北是两个人背向而立，原意是相反、违反。和羊形合起来，表示固执、不服从、怪谬，也就是乖谬。\n\n后来的篆文、隶书、楷书字形变化不大。\n\n# 2.羊为什么代表凶狠\n\
    \n等等，不是羊是善良的化身，所有和有关的汉字都与祭祀、善良、美好有关吗？现实中的羊非常温顺，怎么这里就成了不服从了呢？\n\n这是因为，古人离大自然近，我们比他们更了解动物。有一句话你一定听过：羊狠狼毒。\n\
    \n《辞海》对“羊狠狼贪”解释为：\n\n> > 语出《史记·项羽本纪》：“猛如虎、狠如羊、贪如狼”。\n\n本来指为人凶狠，争权夺势。后多用来比喻贪婪官吏剥削压迫人民。\n\
    \n羊的狠居然和虎狼并列。这是怎么回事呢？\n\n牧民都知道，和牛马不同，羊吃起草来是连根拔起，寸草不留，所以牧羊需要经常转场。羊啃到树皮也是会不管不顾，很多小树苗就是被啃光树皮死掉的。现在我国西北地区草原荒漠化的一个重要原因，就是过度放牧，羊把草原啃秃了。另外，公羊斗起来极其凶狠，常常把角顶裂。羊的这种不留余地的特性，得了一个“狠”字。\n\
    \n狼却上背道而驰，就成了乖谬。\n\n《说文解字》：\n\n> > 乖，戾也。\n\n“戾”我们在十二生肖中解释过，是狗在自家门口，极其凶狠。\n\n《贾子道术》：\n\
    \n> > 刚柔得适谓之和，反和为乖。\n\n说明刚柔合谐就是和谐，反之就是乖。\n\n晁错《论贵粟疏》中说：\n\n> > 上下相反，好恶忿忿。\n\n\
    说明朝廷和民间想法相反，那么上下的好恶也相反，就会发生冲突。\n\n# 3.写出来的昵称\n\n那么“乖”这个贬义词是怎样变成了乖乖的昵称呢？\n\n这是民间语法的特殊用法。\n\
    \n有一次我和一个朋友在酒吧吃饭，酒吧老板特意上了一道他自制的四川凉粉。我的朋友尝了一口大叫：“好多年没吃到这么地道的凉粉了。这是哪个主儿做的，这得拉出去毙了！”\n\
    \n这种语言方式是用极端的语言表达相反的情感，表面是骂，其实是夸，骂的越狠越亲热。\n\n比如你这杀千刀的、你这老不死的等等。\n\n在民间俗语里，乖这骂人话也这样使用。\n\
    \n《西游记》十五回：\n\n> > 行者的眼乖。\n\n《水浒》第四十一回：\n\n> > 黄文炳是个乖张的人，早瞧了八分，便奔船梢后走，望江里踊身便跳。\n\
    \n这种用法大多出现在民间语言里、活本、演义里。\n\n民间这样用得多，反义就成了本意，反着说就成正着说了。\n\n在民间的文本中，会出现正说、反说同时存在的现象。\n\
    \n比如《红楼梦》：\n\n> > 行为偏僻性乖张。\n\n这用的是原意。\n\n同样在《红楼梦》：\n\n> > 他生的也还干净，嘴儿也倒乖觉。\n\n\
    这就反着用了。\n\n《西游记》里也有：\n\n> > 语言无耻法，情意两乖张。\n\n反用多了，逐渐的，乖的原意就被弃用，相反的含义却被固定下来。我们现在说一个孩子“真乖”，绝无反义。\n\
    \n—— 总结一下 ——\n\n+   1.  乖的 金 文 是 “ 羊 ” 加 “ 北 ” 构 成\n    乖，羊在这里代表狠，不留余地；北则 表 示\
    \ 相 反 、 违 背 ， 合 起 来 表 示 固 执 、 不 服 从 、 乖 谬 。\n2.  古 代 大 量 成 语 都 是 用 的 这 个 本 意 ，\
    \ 如 出 乖 露 丑 、 时 乖 运 蹇 、 乖 僻 邪 谬 等 等 ；\n3.  民 间 表 现 亲 密 的 昵 称 用 逐 渐 把 这 个 贬 义 词\n\
    \    用 成 了 褒 义 词 或 中 性 词 ， 最 终 完 成 了 民 间\n    语 文 对 严 肃 文 本 的 逆 袭 。\n\n—— 思考题\
    \ ——\n\n羊 作 字 符 ， 可 以 组 成 不 同 的 字 。 这 是一 个 有 “ 羊 ” 作 为 字 符 的 甲 骨 文\n\n![](img/6b2d826949bfddce96931988065f7fef_44_7.png)\n\
    \n由羊\n和手\n组成，你能猜 猜 这 是 什 么 字 吗 ？ 利 用 了 羊 怎 样 的 特 征 ？\n\n![](img/6b2d826949bfddce96931988065f7fef_44_8.png)\n\
    \n每个字都让你\n恍然大悟"
