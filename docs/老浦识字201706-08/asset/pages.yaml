    # 127【南】南方传来的钟声


    老潘讲史：订阅专栏后，文摘中的象形文字可截图点，放大来看，细细品读。


    # —— 识字卡片 ———


    ![](img/6b2d826949bfddce96931988065f7fef_82_1.png)


    东南西北，这些人为概念的大概念都是借借来的，假设总是是有意而不可的。但是谜回朔，你会发现原意往往出人意料。


    # 1.南的原意是一面大鼓


    南的甲骨文 <img alt=''南'' src=''''/> 上面是一个绳结 <img alt=''绳结'' src=''''/>，下面是鼓形 <img
    alt=''鼓形'' src=''''/>，合起来表示悬挂起来的鼓。


    为什么说这是一个响啊？它的形状还可以作很多其他解释啊。我们反复强调说，考察甲骨文，最重要的是研究甲骨卜辞，看看这个字的上下文。这个字出现在卜辞里通常是表示方向的。


    考察甲骨文另外一个方法是看其他相关的字。


    甲骨文还有一个字 <img alt=''敓'' src=''''/>，鼓 <img alt=''鼓'' src=''''/> 的旁边多了一个手持鼓槌（chuì）的象形
    <img alt=''敓'' src=''''/>，表示用鼓槌击鼓。这是“敓（ké）”字，表示器物的表面。由这个字，也可以反证这个字 <img alt=''南''
    src=''''/> 型。


    ![](img/6b2d826949bfddce96931988065f7fef_82_2.png)


    # 2.大鼓为什么代表南方


    南的本意是一种鼓形乐器，由于来自长江地区的南方，所以“南”字就借为方位的字。


    关于鼓为什么能够代表南方，上有一种说法，古代朝堂坐北朝南，举行仪式的时候，乐队在天子的对面，而乐队最主要的乐器是鼓。天子坐北，鼓代表的乐队就是南了。


    金文 <img alt=''金文南'' src=''''/> 在甲骨文字形 <img alt=''甲骨文南'' src=''''/> 的中间加上了一个棍棒
    <img alt=''棍棒'' src=''''/> ，表示敲击鼓形乐器。


    有的金文 <img alt=''金文南2'' src=''''/> 有所变形。篆文 <img alt=''篆文南'' src=''''/> 继承了金文字形，成为我们今天熟悉的南。


    > 《说文解字》：

    草木至南方，有枝任也。


    意思是草木到了南方生长的格外茂盛。


    > 《徐日》注释：

    南方主化育，故曰主枝任也。


    > 《前汉·律历志》：

    太阳者，南方。南，任也。阳气任养万物，故时为夏。


    这些都是根据篆文字型，用阴阳五行学说来解说的，不是甲骨原意。


    中国文化南北差异很大，以楚文化为代表的南方文化鄙视代表崇尚、崇火拜日、喜巫近鬼。以屈原为代表的楚辞浪漫华丽，想象力丰富，是中国浪漫主义文学的鼻祖。就文字而言，近年大量出土的楚简、帛书以及战国后期满出土的青铜器上的鸟篆文字，与我们常见的金文、秦简差异很大，字型非常有特点。


    # —— 总结一下 ——


    +   1. 南的原意是悬挂起来的鼓形乐器 <img alt=''南'' src=''''/> ；

    2. 鼓子来长江流域。相对于中原地区，长江流域就是南了；

    3. 还有一种说法，祭祀的时候，天子居北，与天子相对的乐队就是南了；

    4. 以楚文化为代表的南方文化是中国文化重要的组成部分，楚简、帛书以及战国后期满于青铜器上的鸟篆文字，都是极有特色的汉字形态。


    # —— 思考题 ——


    打击乐器我们学习了“鼓” <img alt=''鼓'' src=''''/>，现在有一个字形 <img alt=''思考题字'' src=''''/>，也用打击乐器，你猜猜看，这是什么字？提示一下，张玄说曾经用它很出风头，也很出糗。'
