  md: '# 夏 盘


    # 【复盘】为什么同一个字会有不同声调


    我们平时说话，有时会被一些读音困扰，明明是同一个字，组合在不同的词里就变成不同的音；也会被一些字形困扰，明明读音一样，组在不同的词里就不能写成一样的字，很难以得懂。


    这是因为，我们平时没有机会了解这些字的原意，一追溯到它们的源头——象形文字，就不会感到混淆了。


    这样的文字知识讲一些，今天为你做个梳理，以免今后再用错了字和错读。


    # 1.髮fà、發fā——发


    “髮fà”这个字最早的象形文字是金文“𩬶”，𩬶，代表是“大”；“𣞀”是“首”，代表头部、头。


    为什么和狗在一起就是头髮呢？


    这是因为，古人认为人头顶上的鬃门（鬅子）可以透过，是重要的部位，需要保护。鬅门就是人头顶上的缝隙，小孩子的鬅门是没有闭合完全的，要特别呵护。你会发现，很多小孩子会留个“锅盖头”，头顶只留一小撮头发，护着鬅门。


    在古人的生活中，最有看护鬅门本事的，就是狗了，所以“𣞀”的写法，是古人希望头发像犬一样，守护着人的头部。


    ![](img/6b2d826949bfddce96931988065f7fef_65_0.png)


    | 字源演变： | 發 | fà |

    |---|---|---|

    | 甲骨文 | 金文 | 小篆 | 隶书 | 楷书 |


    文字原意：

    鬅门是人体最重要的一大块，所以古人从鬅门开始，通过头髮来表现鬅门，也通过鬅门来表现人的整个头部。鬅门是人的智慧所在，是灵魂的窗口。鬅门闭合了，人就开始思考。


    “發fā”这个字肯定见过，起码在麻将里见过吧。發的甲骨文是“𤴔”，上面是发脚“𠂋”，下面是手持标枪“𣥂”的写法。发这个字，描绘的就是一个人手持标枪，飞矢发箭，攻击野兽或敌人的画面。


    按照这个意思，发力、出发、发射、发展、发达，这些词读什么，就好理解了。


    ![](img/6b2d826949bfddce96931988065f7fef_65_1.png)


    | 字源演变： | 發 | fà |

    |---|---|---|

    | 甲骨文 | 金文 | 小篆 | 隶书 | 楷书 |


    文字原意：

    “發”是一个动作，表示用双手或工具投掷，也引申为发射、发出。


    我们今天用的“发”，是汉字简化的时候，把“髮”和“發”合并成“发”了。现在你知道“发”，“发”这个字，和头髮有关的时候应该读四声fà，和发力有关的时候就应该读一声fā。


    > > 延伸阅读：

    > 1. 鬅门和鬅发的区别？

    > 2. 髮和發有什么关系？


    # 2.適kuò、遄tōng——通


    “遄”这个字的背景有点复杂，可能容易看晕，请集中注意力，我们一起来看这个字。


    先说“遄tōng”，它的金文是“𠃏”，上面是“帝”“𡇷”，字形是挪起木杵，下面是木把祭口，可申为“天神”；下面的“口”是祭祀有贡馐求神灵，字形的含义是向天祈求神灵佑护。


    “遄”的金文是“𠃏”，上面是“辵”，强调“走过去”的含义：有资格被去献祭祀、祭祀天神的人。


    ![](img/6b2d826949bfddce96931988065f7fef_65_2.png)


    | 字源演变： | 遄 | tōng |

    |---|---|---|

    | 甲骨文 | 金文 | 小篆 | 隶书 | 楷书 |


    文字原意：

    “遄”原意是通，通达，贯通。在古代，只有天子才能做到天地通达。


    所以“遄”是个很“高大上”的字，但“通”就可不一定了。


    在古文字中，“遄”或kuò，金文是“𠃏”，“𠃏”是“止”加“旨”，“旨”下面是“口”，意思是说话又多又快，好像舌头堵满了口一样。


    这个字的意思可就不太好了，形容人是话说得太多太杂。


    所以，胡适先生的名字应该是“遄”，他大致的名也是“遄”。胡适先生并不知道自己也简化汉字，后来，把“遄kuò”和“通tōng”合并成“通tōng”，所以在简化汉字以前的古人里，不存在“遄”的写法。


    知道了胡适先生的正确写法，来看看另外一个人的名字——南朝kuò。现在出版的很多书，都把它写成了“南朝括”，下次看到你读“南朝括”的时候，应该是“南朝kuò”。


    同样道理，有“辵”和“徽”，辵的甲骨文是“𡳿”，是朝鹿跑军征讨不义的地方军队，加个代表不义的“亠”，表示流窜军征讨不义的地方军队。


    而“徽”的原意是藏，所以魏徵的“徵”，不能读成“征”。


    > > 延伸阅读：

    > 1. 遄和通的关系？

    > 2. 遄的古代用法？


    # 3.面、鰌、麪——面


    “面”的甲骨文是“𧘂”，外面一个椭圆形外框，里面一个眼睛。外框代表面部的轮廓，眼睛代表五官，这就是一个人脸的样子。𠃏𠃏字写成“𠃏”，轮廓里面一个“首”，这是在强调脸在头部。到隶书的时候就有今天的“面”的样子了。


    当时的面，只代表脸部。


    ![](img/6b2d826949bfddce96931988065f7fef_65_3.png)


    | 字源演变： | 面 | miàn |

    |---|---|---|

    | 甲骨文 | 金文 | 小篆 | 隶书 | 楷书 |


    文字原意：

    “面”的本义是脸，人的面部。


    那么麪的是哪来的？


    篆文的“麪”字，在“面”的旁边加'
