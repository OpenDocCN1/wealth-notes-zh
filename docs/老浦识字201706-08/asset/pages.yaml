    # 【各】外来户各就各位


    老浦说字：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    ![](img/6b2d826949bfddce96931988065f7fef_50_1.png)


    在讲“正”字的时候，我问过你一个思考题：口在上脚趾在下，是出征的征，那么口在下脚趾在上，是什么字？


    很多朋友都猜出来了，是各就各位的各。


    # 1.对“各”的解读有很多种


    甲骨文的“各”，左边有一个双立人，这是十字路口的一半，表示道路；右上角有一个由上而下方向的脚趾，脚趾代表行进，由上而下的方向代表由外而来；来到哪里呢？来到右下角的一个口形。


    解读这个字的分歧，就来自对这个口形的理解。


    # 2.哪种解读更靠谱


    +   1. 第一种解读和“征”一样，说“口型”是城邑，既然“征”是向外征讨，那么脚趾向内的话，就是表示外族入侵。


    +   2. 第二种解读是与“出”相对，这是到来、外来的意思。外人来到我家为“客”、人乘往所走的道为“路”、外来的不义之财为“赂”、外来的国强占地为“略”、外来者处处谨慎小心行事为“恪”。


    +   3. 第三种解读，这个“口”形是独轮车，也就是四川的鸡公车。这种解读认为“此字像脚趾踏于独轮车，‘路’、‘客’是乘独轮车来到人家做客。‘赂’、‘客’是独轮车行驶于路上，所以‘路’是乘独轮车经营田地。


    > > 《说文解字》把“口”解读为说话：

    >

    > 各，异辞也。从口戈（suǐ ）之者，有行而止之，不相听也。


    意思是说：各，表示存在不同意见。字形采用“口、戈”会义。戈，表示有人要行进；口，有人进行阻止，互相冲突，互相怨恨。


    +   4. 我多次说过，考察甲骨文解读是不是靠谱，最好的办法是找到甲骨卜辞，联系上下文。


    查甲骨字典，我找到了这样的卜辞：


    “各云自东”、“各云自北，雷，口风，玄雨，不延。”


    > > 孙常叙先生释：

    >

    > “各云当就积雨云的体态庞大取名的，可以‘路云’读之。”


    从卜辞的上下文看，解读“各云”为积雨云应该没有问题，由“自东”、“自北”来看，这显然是动态的云。可以想象这是雷 雨 之 前 乌 云 翻 滚 的 景 象 ，
    那 么 “各”，就有外来、各自的含义。


    在我们上面列举的4种解读中，“外敌入侵”、“独轮车”的说法和《说文解字》的说法不一。


    所以结合来看，第二种表示“到来、外来”的解读胜出。


    # 3. “各”的引申义


    交由“到来”的意思，引申为每个、枝条又指、方格、规则、相抵触、匹敌、推究、击杀等含义，后来造“格”来表示这些意思。


    “各”仅保留了每个、各个这个含义。


    > > 《汉书·东方朔传》：

    >

    > 陛下行之，是以四海之内元元之民各得其所，天下幸甚。


    说皇帝您按照这种方法施行，是让普天下老百姓各自都有所安居，人民幸福。


    > > 唐·杜甫《兵车行》：

    >

    > 行人弓箭各在腰。就是说每人腰上都各自带着弓箭。


    # 总结一下


    +   1. 各 、 是脚趾向下，向城邑走来，表示到来、外来；


    +   2. 由“各”作为字符的汉字都有外来的含义，如客、路、赂、恪守；


    +   3. 后引申为“每个”、“各个”的含义；


    +   4. 其他的引申义另造“格”来表达。


    # 思考题


    脚趾的甲骨文是表示行动的，这有一个甲骨文字形，脚趾一个在上一个在下，中间隔着一个河流，你猜猜看，这是个什么字？


    ![](img/6b2d826949bfddce96931988065f7fef_50_2.png)'
