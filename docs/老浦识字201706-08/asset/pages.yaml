  md: '# ## 本周问答：“柴门”是什么意思？


    本周问答：“柴门”是什么...


    柴从神圣的祭祀品降格成为日常的燃料，那柴门是什么意思？能引用一句带“柴门”的诗句吗？


    # ### 老浦


    柴虽然最早是珍贵的祭祀品，但是随着柴的普及，它已经是人们生活中必不可少，也是最平常的东西。


    所以“柴门”就是用最普通的木头做成的门，代指普通人家，大门都普通成这般，屋里也不会豪华到哪儿去了。


    与之相对的是“朱门”，在古代，富贵人家才会住在朱红色的大门里，“朱门酒肉臭，路有冻死骨”说的就是富贵人家。


    简化字把繁体字“監”的上部简化为“士”和“卩”，已经没有逻辑了，按照你已经学过的古文知识，繁体字“监”里的“臣”、“士”、“丿”这三个字符的原意分别是什么，和“皿”合起来代表什么行为？


    # ### 老浦


    这几个字符，一个是“大臣”的“臣”，指的是人的眼睛，在这里表示用眼睛来观察；而从金文的监


    ![](img/6b2d826949bfddce96931988065f7fef_9_0.png)


    的最


    右上角可以看出来，“士”其实是一个弯曲的人体；这是监


    ![](img/6b2d826949bfddce96931988065f7fef_9_1.png)


    ，你看它的右上角，弯曲的人体加上眼睛，表示在观察，观察器皿里的卤水。


    繁体字的“鹽”虽然笔画很多，但是它携带了古人制盐情景的信息，今天简化后的“盐”，很可能就是为了书写便捷，俭省了笔画，所以我们学习汉字，还是要去了解繁休字的寓意。


    都说“五谷杂粮”，“五谷”是哪五谷呢？


    # ### 老浦


    有人讥讽孔子和他的学生：你们“四体不勤，五谷不分”。意思是你们虽然很有学问，却连生活常识都不知道。这当然是对孔子的误读，但是反映出了“五谷”应该是个人都了解的常识。


    但是我们今天确实不是很清楚“五谷”的确定种类，比较典型的有两个版本：


    第一种是：稻，水稻；黍（shǔ），黄米；稷（jì），小米；麦，麦子；菽（shū），大豆。


    第二种没有“稻”，有“麻”：麻、黍、稷、麦、菽。


    过去中原及北方地区，不产水稻，产麻。这个“麻”可不是吸的那个“大麻”，而是另一种经济作物，它的叶子和籽都可以煮粥吃，麻杆儿可以烧火，麻皮是做衣服的原料，还可以搓成麻绳。


    如果说“酱”下面的“酉”表明酱的酝酿和酒有关，那么奖励的“奖”下面的“大”和什么有关？为什么？


    # ### 老浦


    奖励的“奖”下面的“大”和“犬”有关，它的意思是说，打猎之后，猎人从锅里捞出来一点肉末、肉汁，给猎狗舔，表示对打猎归来的嘉奖。


    现在“奖”下面的“大”没有“了一点”，也是为了俭省笔画的结果。


    醋是酸的，酸也指人的情感。有一句著名的诗句被毛泽东引用：天若有情天亦老。这句诗来自李贺《金铜仙人辞汉歌》，这首诗里有一句“东关酸风射眸子”。你是怎样理解诗句里这个“酸”字的？


    # ### 老浦


    这首诗是诗人李贺因为一个典故而作的，这个典故是：传说魏明帝搬迁汉武帝留下的一尊铜鹤“金铜仙人”的时候，金铜仙人留下了眼泪。


    “东关酸风射眸子”指的是搬运金铜仙人的时候正是秋风凛冽的时候，“酸风”除了是“秋风凛冽”的意思，更表达出李贺因为一个王朝的覆灭所感受到的凄凉感。


