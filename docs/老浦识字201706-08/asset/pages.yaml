    # 猴鸡狗猪


    ![](img/6b2d826949bfddce96931988065f7fef_1_1.png)


    老猫提示：订阅专栏后，文章中的象形文字可截可点，放大来看，细细品读。


    ![](img/6b2d826949bfddce96931988065f7fef_1_2.png)


    老猫


    十二生肖还有猴、鸡、狗、猪四种动物没有讲，今天连同识字卡片，一并更新。


    十二生肖还有猴、鸡、狗、猪四种动物没有讲，今天连同识字卡片，一并更新。


    因为我想说一个消息，这个消息附在文末，你读完四种动物的字以后，就会看到了。


    # ——【猴】——


    猴是一个后造的字，在“小篆”之前，表现猴子的汉字是另外一个字：“猳”（nào）。


    ![](img/6b2d826949bfddce96931988065f7fef_1_3.png)


    《说文解字》说：


    “猳，贪兽也。一曰母猴，似人。


    | 类型 | 编号 |

    |---|---|

    | 侯（高崖意，表亭高） | 9321953 |

    | 侯（高崖意，表亭高） | 9221894 |

    | 侯（高崖意，表亭高） | 9225241 |

    | 侯（高崖意，表亭高） | 9230318 |

    | 侯（高崖意，表亭高） | 9231099 |

    | 侯（高崖意，表亭高） | 9230359 |

    | 侯（高崖意，表亭高） | 9235309 |

    | 侯（高崖意，表亭高） | 9236222 |

    | 侯（高崖意，表亭高） | 9235640 |

    | 侯（高崖意，表亭高） | 9225232 |


    “猳”字怎么就变成“猴”了呢？


    “猴”的甲骨文是：


    ![](img/6b2d826949bfddce96931988065f7fef_1_4.png)


    ，左边是一个犬字“猳”，代表古人认为猴子是


    ![](img/6b2d826949bfddce96931988065f7fef_1_5.png)


    和狗一样的兽类，右边一个诸侯的“侯”字。一个猴子怎么跟诸侯拉上关系了呢？


    “诸侯”的“侯”的甲骨文是：


    ![](img/6b2d826949bfddce96931988065f7fef_1_6.png)


    ，上面是一个“厂”字，表示山崖；下面一个“矢”字，表示箭头的矢，合起来表示用箭射向高挂在崖壁上的箭靶。


    在周代，周天子组织贵族进行射箭比赛，表现好的就能当官，所以，“侯”这样的箭靶就成为官员的代称。


    后来人们要把这种动物当做箭靶“侯”来射，作为庙席宴上的娱乐活动，这种活动就叫“射侯”，取“射侯”的谐音，久而久之，"猳"就变成了“猴”。


    ![](img/6b2d826949bfddce96931988065f7fef_1_7.png)


    ![](img/6b2d826949bfddce96931988065f7fef_1_8.png)


    # ——【鸡】——


    +   1、古人认为鸡可以带来光明、驱逐妖魔


    甲骨文的“鸡”字，是一只昂首挺胸、引吭高歌的大鸟，象形字突出了它高耸的鸡冠、美丽的羽毛，尤其突出了张开的喙，表现公鸡最大的特征。


    鸡打鸣本来就是一种生物现象，光线刺激了鸡的眼睛，它就不由自主地打鸣，宣告主权，提醒家庭成员它至高无上的地位，也警告邻近的公鸡不要打它家替的主意。


    古人不懂这个，他们以为太阳是鸡叫出来的，所以认为鸡能带来光明、驱逐妖魔。正月初一“鸡主镇宅”年画的风俗，就是这么来的。


    +   2、“杀若木鸡”到底是不是傻？


    这是甲骨文“鸡”的另外一种写法：


    ![](img/6b2d826949bfddce96931988065f7fef_1_9.png)


    ，在“鸟”字旁边，增加了一个“奚”字。


    ![](img/6b2d826949bfddce96931988065f7fef_1_10.png)


    “奚”是一只手抓住一个被捆绑起来的人，也有奴役并戏弄的意思。


    这反应了公鸡的一个特性，就是被人利用，比如斗鸡。


    ![](img/6b2d826949bfddce96931988065f7fef_1_11.png)


    这是“金文鸡”的一种写法，因为是铸造在青铜器上的，造型比较写实。这个鸡像，让我想起一个成语：杀若木鸡。


    庄子讲过一个故事，说一个训练斗鸡的高手为齐王养斗鸡，过了十天，齐王问：“鸡训练好了吗？”


    高手答：“还没有，这鸡虚浮骄傲，自恃意气。”


    又过了十天，齐王问。'
