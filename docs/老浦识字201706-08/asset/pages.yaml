  md: '# 【营】你把自己经营得漂亮吗


    老铺提示：订阅专栏后，文章中的象形文字可戳点，放大来看，细细品读。


    # 识字卡片


    ![](img/6b2d826949bfddce96931988065f7fef_67_0.png)


    你一定有自己的营生吧，不管是经营一家小点还是运营一家公司，都免不了经常营销自己，把自己和周围营造得越来越好。


    上 面 四 句 话，我 用 了 五 个 “ 营 ”， “ 营 ” 为 什 么 这 么 重 要 呢 ？ 咱 们 从 甲 骨 文 入 手 看 看 。


    # 1.营的原意是垒土聚落


    甲 骨 文 的 “ 营 ” 非 常 漂 亮 ， 是 草 本 植 物 开 出 的 闪 闪 发 光 的 花 朵 ， 是 “ 茇 ” 的 原 字 。


    金 文 的 “ 营 ” 对 甲 骨 文 作 了 变 形 ， 并 在 下 面 加 上 了 一 个 “ 埠 ” ( duì ) ， 这 个 “ 埠 ” 字 我
    们 在 “ 师 ” 那 一 期 见 过 ， 原 意 是 土 堆 。 土 堆 在 宝 盖 下 面 ， 是 皇 宫 的 营 。 “ 营 ” 是 一 个 形 声
    字 ， 营 是 形 符 ， 表 示 围 合 起 来 的 房 屋 聚 集 ， “ 茇 ” 是 声 符 ， 表 音 。


    篆 文 的 “ 营 ” 基 本 承 续 了 金 文 的 字 形 ， 用 两 个 “ 火 ” 代 表 “ 茇 ” 形 ， 下 面 还 是 “ 宫 ” 。


    东 汉 、 许 慎 《 说 文 解 字 》 ：


    > 营，居也。


    段 玉 裁 注 ：


    > 市居，谓围垣而居。


    桂 馥 义 证 ：


    > 营谓周垣。


    垣 ( y u á n ) 是 墙 ， 周 垣 就 是 一 圈 围 墙 。


    可 见 营 的 本 意 是 四 周 垒 土 作 为 防 卫 ， 围 合 出 许 多 房 屋 的 聚 居 地 。


    # 2.聚落地演化为军营


    由 聚 居 、 防 卫 ， 引 申 为 军 队 扎 营 ， 营 寨 ， 军 营 。


    公 元 前 158 年 ， 匈 奴 进 犯 北 部 边 境 ， 汉 文 帝 派 三 路 军 队 到 长 安 附 近 扎 营 。 为 鼓 舞 士 气 ， 汉
    文 帝 亲 自 到 三 路 军 队 里 去 巡 劳 慰 问 。 他 先 见 到 霸 ( bà ) 上 ， 再 到 棘 ( jí ) 门 。 士 兵 见 到
    皇 帝 的 车 驾 来 了 ， 军 营 都 主 动 放 行 。 送 文 帝 走 时 ， 主 将 都 亲 率 全 军 送 到 营 寨 门 口 。


    文 帝 到 了 周 亚 夫 的 营 寨 ， 皇 帝 的 车 驾 却 被 拦 在 营 寨 之 外 。 文 帝 派 使 者 拿 着 自 己 的 符 节 进 去
    通 报 ， 周 亚 夫 才 命 令 打 开 寨 门 迎 接 。 守 营 的 士 兵 还 严 肃 地 告 诉 文 帝 的 随 从 ： “ 将 军 有 令 营
    寨 中 不 许 车 马 急 驰 。 ” 车 只 不 得 控 制 着 缓 缓 ， 让 马 走 得 太 快 。 到 了 军 中 大 帐 前 ， 周 亚 夫 一
    身 戎 装 ， 出 来 迎 接 ， 手 持 兵 器 下 令 将 军 行 军 手 礼 ： “ 介 胄 士 不 拜 ， 请 陛 下 允 许 臣 下 以 军 中
    之 礼 拜 见 。 ” 意 思 是 我 身 着 盔 甲 ， 不 能 向 皇 帝 行 跪 拜 礼 。 文 帝 听 了 ， 非 常 感 动 ， 又 身 扶 着
    车 前 的 横 木 向 将 士 行 军 礼 。


    慰 劳 完 士 兵 ， 在 好 长 时 间 里 ， 文 帝 对 周 亚 夫 都 赞 叹 不 已 。


    可 见 在 军 营 ， 有 自 己 一 套 严 肃 的 纪 律 ， 皇 帝 来 了 ， 也 要 遵 从 营 中 的 规 矩 。 严 格 做 好 自 己 的
    本 职 ， 比 拍 马 屁 管 用 。


    由 军 营 ， “ 营 ” 字 进 一 步 引 申 为 军 队 、 军 队 的 编 制 以 及 军 队 的 指 挥 机 关 ， 比 如 大 本 营 。


    # 3.营建房屋离不开一本书


    建 造 营 建 ， 需 要 挖 壕 沟 ， 坚 密 栏 栅 ， 搭 建 帐 篷 等 等 ， 因 此 “ 营 ” 就 引 申 为 修 建 ， 后 来 泛 化
    为 一 切 建 筑 的 建 造 。


    民 国 年 间 ， 梁 思 成 给 自 己 学 建 筑 的 儿 子 梁 思 成 寄 去 一 本 当 时 没 人 能 读 懂 的 古 书 《 营 造 法 式
    》 ， 这 是 北 宋 王 安 石 时 期 的 一 本 建 筑 学 著 作 。 梁 思 成 、 林 徽 因 为 了 读 懂 这 本 书 ， 不 仅 自 己
    花 费 了 大 量 心 血 ， 还 专 门 聚 集 各 方 面 的 顶 尖 精 英 ， 成 立 了 中 国 建 营 学 社 。 为 了 真 正 读 懂 这
    本 书 ， 梁 思 成 、 林 徽 因 亲 赴 各 地 进 行 野 外 调 查 ， 积 累 了 大 量 第一手资料。最近的唐代建筑应县木塔就是这次发现的。经过十几年努力，梁思成注释完成了中国建筑学的基础著作《营造法式》。


    这 个 营 造 ， 就 是 建 筑 房 屋 。 范 式 是 建 筑 的 各 项 规 范 细 节 以 及 管 理 规 范 。


    建 造 房 屋 ， 必 须 进 行 详 细 的 规 划 和 实 施 步 骤 ， 于 是 “ 营 ” 便 引 申 出 有 谋 划 含 义 的 “ 经 营 ”
    。


    现 在 我 们 已 经 知 道 了 经 营 的 原 意 ， 如 果 想 要 经 营 好 自 己 的 生 活 ， 管 理 自 己 就 像 建 军 营 一 样
    有 纪 律 （ 自 律 ） ， 要 想 经 营 好 自 己 工 作 ， 要 像 建 造 房 屋 一 样 认 真 。 请 对 一 件 事 物 有 计 划 、
    有 目 的 的 规 划 ， 然 后 一 步 一 步 去 实 现 。


    # 总结一下


    +   1.营 的原意是垒土围合，建造房屋聚落，引申为军队扎营，进一步引申为军队、军队编制营一级单位以及军队指挥机关大本营；


    +   2.由军队扎营，引申为建造房屋，《营造法式》是宋代的建筑学著作，梁思成、林徽因耗费极大心血注释推广，为中国建筑学奠定基础；


    +   3.又由修建房屋需要规划，引申为有计划、有追求的经营。


    # 思考题


    汉 字 常 常 活 用 ， “ 蝇 营 狗 苟 ” 是 指 卑 鄙 小 人 为 了 追 求 名 利 ， 不 择 手 段 ， 像 苍蝇 一 样 飞 来 飞 去
    ， 像 狗 一 样 的 不 掉 羞 耻 。 请 你 分 析 一 下 ， 这 里 的 “ 营 ” ， 怎 样 理 解 ？


