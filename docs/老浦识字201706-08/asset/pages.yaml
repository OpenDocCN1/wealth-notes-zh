    # 【继】延续血脉要靠抢


    【继】延续血脉要靠抢


    老蒲提示：订阅专栏后，文摘中的象形文字可戳可点，放大来看，细细品读。


    另外，文中蓝色字句可以直接点会，会自动跳转到之前的文章。


    # 识字卡片


    ![](img/6b2d826949bfddce96931988065f7fef_24_1.png)


    字源演变： ji


    隹 | 8 | 繼 | 继


    文字原意：金文的造字：隹（被割断的丝线）+ 连接起


    # 1. “继”和血脉分不开


    继的金文是 ，是“绝”，表示被割断的丝线少了一截，下面的指示符号“二” ，表示将两截被切断的丝再连接起来。


    丝线不仅表示嫁丝，也可引申为血脉繁衍。


    血脉繁衍在远古是大事，我们以前谈过汉字“好”，表示女人生养孩子是公认的好事。在母系社会，女人拥有主导权，孩子只知其母不知其父。


    而随着生产力的发展，男人的力量在农业生产中发挥越来越重要的作用，男人的男 ，就是由一个代表力量的犁铧 ，和田地 组成的。


    这个时候，男人开始要求有自己的血脉。


    你看父亲的父 ，就是一手握着生殖器官，这是在宣示生殖权。


    # 2. 妻子是抢来的


    篆文 是一个表示丝线的绞丝旁 ，加上一个绝 ，合起来也是表示将割断的丝线连接起来。


    男人要接续自己的血脉，就要去抢女人，因为抢孩子没有用，你也不知道孩子到底是谁的。


    这就是妻子的妻 ，表一只手抓住了女人的头发。


    抢女人为妻，以前给你介绍过。其实，这不是中国独有的，世界上很多古老民族都有这样的风俗。


    公元前8世纪，古罗马建城初期，罗马的创建者罗慕路斯热情地邀请居住在附近的萨宾人参加罗马的祭祀活动。当时，在祭祀诸神的日子，一切战斗都是禁止的，萨宾人全体出动来到罗马。在祭祀活动达到高潮的时候，罗慕路斯一声令下，罗马的年轻人向萨宾人的年轻姑娘发起了突然袭击，劫夺了一大批妇女。


    ![](img/6b2d826949bfddce96931988065f7fef_24_2.png)


    萨宾人当然不会善罢甘休，罗马与萨宾人发生了4次战争。


    就在第四次战争的时候，萨宾妇女冲入战场，她们已经在罗马组建了自己的家庭，不愿意眼看父亲再为此流血牺牲。


    最后双方罢兵言和。


    ![](img/6b2d826949bfddce96931988065f7fef_24_3.png)


    至今欧洲国家仍然保留一个习俗：结婚的时候，新郎要抱着新娘跨过门槛。


    这个习俗就是源自罗马劫夺萨宾妇女的典故。


    # 总结一下


    +   1. 继的原意是连接被割断的丝线 ，进而引申出延续子嗣、传承血脉的含义；


    +   2. 母权时代，繁衍的主导权在于女人，而父权时代初期，组建家庭要靠抢。


    # 思考题


    我们已经介绍了好几个和丝 有关的字。纷繁的 下面也有表示丝的 ，你猜一猜在“繁”这个字里，这个丝代表什么？


