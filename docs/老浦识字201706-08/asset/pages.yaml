    方坚

    母亲（通常是母亲）背着孩子，辛勤操劳，这是‘保’。这样的情景，上世纪还是极其普遍，现在是慢慢少了，生活条件好了，可以专心有人抱孩子了。背上背着是‘保’，辛勤操劳也是‘保’，这个‘保’字真的是太感人了！'
