  md: '你原本只有一個主要收入和兩個次要收入，現在則擁有一個完全自動化經營，可以產生被動收入的系統，還有一個主要收入和兩個次要收入。重複進行上述過程，建立兩個系統收入、一個主要收入和兩個次要收入。完成一個系統收入之後，才能開創新的收入來源，這樣工作量就不會太沉重，也都能兼顧。一個樂團不會同時寫五百歌。他們一次發表一張專輯，建立支持基礎，開始舉辦循環演唱會，販賣周邊商品。如果採用這個模型，日復一日便會建立非常可觀的財富。


    # 跨越多重收入的槓桿效果


