- pgno: 227
  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_227_0.png)


    # 創造財富的公式


    世上的確存在著駕馭金錢的法則，有錢人懂得這些法則，知道怎麼借力使力讓財富最大化，而窮人只能被犧牲掉。這些都是因為，金錢會從最不珍惜的人手中，流向最珍惜的人手中，而財富也會匯聚在懂這些法則的人手中。


    我花了很長時間想出以下這個公式，它禁得起時間的考驗，不管經濟發展怎麼變化都適用，在人類六千七百年的歷史中不斷被驗證。


    我很熱衷於觀察並研究歷史上的有錢人，因而得出這個公式。我將財富公式列於下方，內容非常簡單。


    你可以和他人一樣，善用這個公式來發揮以小換大的槓桿效果。'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 價值（V, Value）


    價值即是你向他人提供服務時，對方對你這項服務的評價。


    如果你真的有服務到他們的需求，幫對方解決問題，並表達關心之意，他們就會從中得益。之後，他們就會更想付錢得到你的服務，甚至還會把口碑傳出去。


    這些人希望能夠解決問題、減輕痛苦、快狠準地完成所有事情。時間是最寶貴的財貨，只要能夠用最少時間換取最大效果，或是有辦法節省時間，這種服務就能轉換為現金收益。


    如果你在財務或情緒上感到困擾，請仔細想想要怎麼服務他人、替別人解決問題，這樣就成立了這個公式的第一個條件。


    ![](img/a9d3aeae93c5ae3f9baf5963e137b74a_228_0.png)'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 公平交易（FE; Fair Exchange）


    交易是指提供服務後，你拿到對方給你的金錢。


    製造產品、提供服務或觀念，讓其他人願意掏錢購買，建立你的自我價值，得到公平的收入。


    你心懷感激地接受任何金錢或以外的報酬，完成一筆公平交易，然後繼續擴展事業，累積口碑。你的感激之情也會轉換為具體的價值，買家將感受到你的誠意。缺乏公平交易條件，會在你的生命中創造一種財務空洞，因為你只有付出，卻沒有回收。除此之外，還會導致「不公平交易」。


    由於你負擔過高的日常成本，因此降低了獲利比例，無法維持事業發展和收入，更會導致不滿和憤恨。罪恶感、缺乏自信、被迫接受的宗教或社會觀念、市場發展受限以及極端的負面情緒，都會促使交易迎合買方，削價競爭，導致事業撐不下去，價值被壓縮，很難進一步去實現你個人的生活目標。


    另一種極端狀況是，如果你收取過高的費用，超過服務/產品的價值，那麼人們就會覺得你太貪心，甚至會覺得你在敲竹槓。


    對顧客畫大餅，或許能夠暫時衝高銷量，但只要消費者發現你的服務/產品缺乏價值，就會產生反效果。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '為了處理客訴、退款、甚至修復公共關係以及控制損失，你的成本會增加，從長期的角度而言，根本無法維持運作，甚至會造成難以解決的困境。


    也許你會心存僥倖，認為「其他人都沒事」，但價值終究會恢復平衡。想要達到公平交易的平衡，必須先試試水溫，看看市場反應怎麼樣。


    「價格彈性」（price elasticity）是一種評估產品／服務該怎麼調價，或決定供給數量該有多少的工具。


    在「消費者願意支付的最高金額」和「生產者能創造最大利潤的價格」之間，可以找到平衡的甜蜜點。


    有趣的是，價格的甜蜜點有時比你設定的價格更高，甚至超乎你的想像。除此之外，我們也要測驗產品／服務的價值。


    提升價值會造成價格上升，但想要增加消費者得到的價值，也有比較省成本的方法，例如透過網路建立口碑。


    我們應該持續傾聽想客戶的回應，保持價值和價格的公平交易平衡。只要正確完成公平交易，客戶將認為自己獲得的價值，超過產品／服務）的價格，也不會認為你是貪婪的生產者，願意將你推薦給朋友，降低你的行銷成本。你非常感激客戶的支持，專注提升產品／服務的品質，創造更多客戶。你重視自己的產品／服務，請慎重維護且提升價值。'
  merge: -1
  img_proc: true
- pgno: 231
  md: '# 槓桿效果 (Leverage)


    槓桿效果代表產品／服務創造收入的規模和速度，以及它所創造的週邊效益。


    你提供愈多服務，解決愈多問題，就能賺到愈多錢。你處理的問題愈大，交易金額就會愈高（但必須符合問題的規模和價值，才是真正的公平交易）。你的產品價值愈高，在市場中的流動速度就愈快。如果你的產品／服務具備價值，並且符合公平交易精神，就可以建立長期的槓桿效果和發展規模。


    當然，你能夠畫大餅或許下不實承諾，創造一窩蜂的購買現象，但無法真正服務他人或解決問題，只要消費者發現交易不公，市場機制就會導向平衡，讓你名聲掃地，付出代價。


    事實上，發展太快是很危險的，也很容易露出破綻。若你還沒準備好，就無法經營大規模的事業，也可能因此產生問題。


    除此之外，如果你承諾提供無法實現的價值，事業發展規模擴大之後，日常支出也會因此過度增加，甚至造成負利潤現象。許多睿智的商業顧問建議企業不要太早或太迅速擴張規模，這就是原因。


    得到客戶的推薦，代表「財富」（價值＋公平交易）＊槓桿效果」的公式有效運作，例如藉由影片、電視廣告等媒體製造行銷效果，或者其他人用觸及率更廣泛的媒體替你說好話。'
  merge: -1
  img_proc: true
- pgno: 232
  md: '行銷，創造熱門效應。


    在光纖網路的世界，社群媒體和新興科技會有鋪天蓋地的效果，可以更迅速發揮財富公式的槓桿效果。事業和服務的擴展速度更勝以往。因此，我相信現在就是歷史上最適合創造長久巨大財富的年代。你能夠在
    2020 上得到一千萬次的點閱，在多個社群媒體平臺變得熱門，取得百萬次的點讚和分享，甚至登上全國或全球新聞報導。「從一到多」的槓桿效果非常驚人。在未來，人工智慧、虛擬實境和量子效應技術發展，商業銷售速度只會愈來愈快。


    # 缺乏槓桿效果的價值和公平交易


    如果價值和公平交易的成績良好，但缺乏槓桿效益，你還是無法賺大錢。客戶的基礎數量和產品的影響力範圍，將決定你的財富成長。你的商業成績可能很好，但規模很小，或者毫無規模可言。如果你希望創造更巨大的財富，必須拓展範圍。


    # 缺乏公平交易的價值和槓桿效果


    與上述狀況相反，你可能擁有良好的價值和槓桿效果，但缺乏公平交易。倘若如此，'
  merge: -1
  img_proc: true
- pgno: 233
  md: '就會造成負成長，結果還是無法有長足的益處。


    你必須長時間勞心勞力，產生不平和悔恨之感，只為了迎合客戶的想法。你的熱情與專業將淪為絕望和幻覺，最後造成崩潰——你本人崩潰，或者銀行帳戶數字崩潰。


    # 缺乏價值的公平交易和槓桿效果


    當然，你也可能實現公平交易，建立良好的槓桿效果，但產品／服務的價值乏善可陳。在這種情況下，你的財富還是無法持久。這是最危險的情況，因為你的假設過度樂觀，擴展過於迅速。


    到最後，由於你無法在公平交易的條件下，提供相對應的價值，導致槓桿效果放大，造成財富重新平衡。為了改善商業聲譽，你付出更多維護成本，接受客戶退款，提供額外服務，消極承受負面利潤。


    財富公式的好例子就是「便利貼」這項產品。它解決了許多人的問題，建立產品價值。許多人無法隨身攜帶筆記本，需要隨時書寫，將內容貼在各處，避免遺失。便利貼可以滿足需求，也不傷害任何物品。除此之外，便利貼的價格和產品價值相等，建立公平交易環境。發揮槓桿效果之後，便利貼一年的銷售量達到六十億五千萬。


    現在，各位已經知道這個夠發財並能永續利用的財富公式了，請同時專注發展其'
  merge: -1
  img_proc: true
- pgno: 234
  md: '中三個要素，但是要按照正確順序發展（先是搞好價值、再來追求公平交易，最後才是發揮槓桿效果）。


    如果你不擅長其中某些要素，那就聘請專業員工或找好合夥人，自己投入最喜歡且擅長的關鍵要素。


    一旦你完善了財富公式中尚未建立，或是還不成熟的某個關鍵要素，就能打開財富的大門。但在拓展事業規模時，你必須持續測試，看看市場反應，並且不斷進行修正。


    過去成功的方法可能需要改變，因為市場是不斷在變的，新的挑戰也會持續出現。


    如果你願意採用上述這個公式，而不是淪為其犧牲者，就能得到夢寐以求的競爭優勢。'
