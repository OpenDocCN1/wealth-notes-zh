  md: '天才。如果你懷疑自己，這本書無法幫助你，請你閱讀或傾聽任何一位心儀或嚮往名人的傳記。我喜歡聆聽其他人的成功故事。我聽過數百位名人故事之後，發現一個反覆出現的事實：他們都面對挑戰。在某個時間點，這些名人都非常貧困。


    所有名人都是白手起家。這些人在某些領域中也會表現很蹩腳，但卻可能是你擅長的。儘管已經成為頂尖人士，他們都還是在面對挑戰。畢竟，他們都是普通人，他们都和你我一樣。


    無論你遇到何種困境，都無法改變你的本質。讓偶像成為你的啟蒙導師，但不必將他們奉為圭臬。站在巨人的肩膀上，而不是臣服在他們腳邊。


    向這些導師學習，效法他們的特質，但仍舊欣賞自己的獨特才能。偉大的前輩追尋各種理念和啟示，你應該學習他們，建立浩瀚的財富和金錢。效法發光發熱的偉大特質，並且向前輩尋求建議。你現在面對的難題，他們過去也必須處理。一開始，他們同樣費盡心力，現在才能輕鬆面對。各位讀者朋友，很快的，你就會和他們一樣優秀。


    +   - 貧窮的觀念：「我不值得富裕」；

    - 富裕的觀念：「我的使命和召喚就是變得富裕，並且向他人分享財富」


    你絕對值得更富足。富裕除了代表有錢，還要自動自發地與他人分享。你同意讓自'
