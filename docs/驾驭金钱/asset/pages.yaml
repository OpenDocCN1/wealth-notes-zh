  md: '立良好的儲蓄金額。


    +   保存現金（避險）：要有一定程度的儲蓄，才能開始投資。除此之外，儲蓄也可以避免你受到「不穩定衝擊」的傷害。根據美國聯邦準備會的資料，五十二％的美國人付不出四百美元的緊急費用，需要轉賣物品或貸款。如果沒有足夠的儲蓄，就會因為人生的突發狀況而大失血。請設定理想的避險金，這筆錢不能動。用其他資本進行投資，讓避險金額慢慢成長。


    # 把錢分成好幾桶金


    把你的錢依不同的目標和用途，以一定的比例分配，這樣的系統可以讓你有更有錢。以下是可以建立的「金桶」，你甚至可以分別把它們存放在不同的銀行帳戶里。


    這些比例只是針對初步這樣做的建議，當你的錢越賺越多時，那麼支出的那桶將會減少，而其他桶則會成長。


    +   第一桶：五％存而不用。第二桶：五％救急金。第三桶：二％作為未來的夢想基金。第四桶：五％拿來自我投資（例如用在教育或追隨導師）。'
  merge: -1
