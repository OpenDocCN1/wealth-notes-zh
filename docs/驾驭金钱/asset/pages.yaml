  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_352_0.png)


    # 銷售就是服務他人、

    解決問題和造福社會


    尋找自我最好的方法，就是在服務他人時，徹底遺忘自我。


    想要創造長久穩定的財富，必須注意三個重點，我稱之為「造福社會的三核心」：


