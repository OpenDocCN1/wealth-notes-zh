  md: '自己遭到欺騙或者蒙受損。因此，決定交換價值是否對等的關鍵並非金錢，而是非金錢交換的目標。給予更多價值，就能用更輕鬆的方式，創造更多金錢。


    不公平的交換不可能長久，因為不公平。例子很多，特別是在二〇〇八年金融危機後的房地產領域中，我當時就曾經認為，房地產的銷售價格和租金過高，房地產經銷公司販售的物件根本不符合實際價值，交易量和貸款的品質也有疑慮，「根本不可能永久持續」。我非常驚訝房地產的泡沫情況持續了如此長久，但最後依然崩解了。事實上，二〇〇八年的金融危機讓我明白，投資人或公司進行不公平交易的時間比我們想象更久，但只要他們失敗，或者被世人發現其計畫之後，崩解的速度也超乎我們的預期，就像一座紙牌屋。


    「交易行為」不代表一個人損失金錢，而另外一個人得到金錢，重點是創造並且交換非金錢形式的事物。


    你將會在本書的文字裡明白，金錢永遠不會「損失」或「消失」，而是從虛無的形式轉化為實體的產品，從理念變成行動，從物質變成精神，再從精神轉化為物質。


    一個人也不會得到「超出公平範圍的利潤」，藉由公平交易，他們準確地得到應有的利潤。


