- pgno: 105
  md: '# （羅伯）摩爾法則？


    我非常相信，在追求財富和金錢的旅途中，你會對個人與全球經濟產生良好的影響。「追求遙不可及的完美結果」聽起來令人不抱希望，請讓我澄清一下：我參加了市場有勝算的競賽，努力控制各種變項，創造有意義的改變。我也鼓勵你加入我的行列，與其責怪、抱怨、或者用各種理由解釋你無法掌握的因素，例如抱怨總統大選結果或金錢人創造不公的世界，不如專注於自己的成長。


    倘若你強烈相信自己渴望改變這個世界，就應該努力賺錢，成為領導者，發揮影響力，才能夠真正改變世界。無論你是否欣賞阿諾·史瓦辛格或川普，他们都成功了。他們不惜重本，證明自己並非空口說白話，發揮金錢與影響力的槓桿效果，成功取得重要地位。


