    你的名聲就是一實際的行為證據」加上一信任」，再乘以槓桿效果。請記得，你的名聲將會傳到世界各地。


    良好的信任經濟系統可以减少金錢流動的摩擦力，降低成本，提升利潤。其他人願意推薦你，減輕行銷的負擔。


    一個人最好的資產就是信任。言出必行。永遠都要清偿債務。順從内心的直覺，完成正確的行動。


    你的眼光必須比任何人更長遠。務必盡力幫助他人，即使無人關注，也要做正確的'
