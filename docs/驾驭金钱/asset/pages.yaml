    # 套利 (Arbitrage)


    一九九二年九月，索羅斯靠著做空一百億英鎊，單日賺到十億美元。英鎊大跌百分之十，索羅斯也被稱為「擊垮英格蘭國家銀行的男人」。索羅斯的交易觀念很單純：英鎊高價時賣出，低價時買回。金融術語稱之為「做空」，也就是趁著貨幣跌價時獲利。


    二〇一六年，英國脫離歐盟的傳聞甚囂塵上，英鎊非常弱勢，貨幣套利的機會再度出現。套利是在不同的市場或採用不同的形式，同時購買或賣出同一種貨幣或貨幣的投資獲利行爲。我必須在此強調，我並非建議各位讀者如何購買金融商品或從事金融投資，而是提醒各位注意在不景氣的環境中依然可以獲利的事業領域，培養自己觀看未來的願景。


    二〇一六年，手錶價格高涨，由於英鎊貶值，美國製造的手錶價格甚至比英國本土的手錶還高。金錶的價格漲幅特別驚人。由於投資手錶的獲利無須繳稅，只要注意進出'
