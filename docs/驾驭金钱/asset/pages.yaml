- pgno: 161
  md: '學習經驗，也是提升富裕水準的必要階段。

    如果你採納「貧窮心智」，很有可能永遠貧困；倘若你只是暫時一無所有，那麼你還是能夠改變人生，翻轉金錢逆勢。許多百萬富翁都曾一無所有，而且不只一次，最後依然重建巨大的財富，甚至更勝以往。他們絕對不會變得貧困。你可以取得他們的金錢，但永遠無法奪走他們的知識和人特質。

    請讀者試著想像在成長的過程中，不受限於特定極端的信念，能夠同時清楚地理解兩種不同的想法，選擇最適合自己的選項。我們雖然無法改變過去，但可以影響未來。

    我將在以下的內容提出各式各樣的信念，來自十餘年的研究和面對面的討論，足以代表數十萬人的兩極價值觀。你甘願將就「不貧困」的狀態，還是渴望「變有錢」？親愛的讀者朋友，請睿智地選擇。


    # ◎貧窮的觀念：「金錢是萬惡淵藪」；


    # 富裕的觀念：「金錢是萬善起源」


    「金錢是萬惡淵藺」是最常見的錯誤觀念。金錢不是萬惡淵藺，邪惡才是萬惡淵藺。

    如果「金錢是萬惡淵藺」為真，或者聖經原文提到的「熱愛金錢」真是萬惡淵藺，在金錢出現之前的時代，人類的世界就不該有惡，但事實並非如此。雖然未有定論，但'
  merge: -1
  img_proc: true
- pgno: 162
  md: '我們甚至可以主張，金錢和科技發展之後，人類種族變得更不野蠻暴力。影響人性發展的一切根源，就是人性本身。因此，萬惡淵藹其實是人性，而金錢只是無關道德的載體。


    反之亦然，金錢也可以是萬善起源，因為人性就是萬善起源。金錢可以治癒疾病，創造慈善事業，爭取幫助他人的時間。


    金錢可以解決貧困無法處理的問題。某個人確實可以花費二十英鎊，將子彈填入彈匣後，射殺二十位無辜的學童，但另一個人也能夠用二十英鎊支付價值二英鎊的漢堡，其餘十八英鎊作為小費，或者資助第三世界國家的某個家庭，提供數天甚至數週的糧食。


    金錢只是服務人性的單純載體。你決定選擇何種金錢觀，金錢就會發揮相對應的作用，無論是善是惡，並且影響金錢的使用方法，以及金錢吸引或驅散的其他元素。


    我曾經以爲金錢大多數的用途都不道德，我不希望自己成爲一個不道德的人，所以拒絕金錢。


    然而，金錢其實能夠協助實現並且拓展道德目標，卻因爲我的片面觀點而遭到拒絕。弔詭的是，我的觀點並非來自實際的經驗：我不認識任何一位百萬富翁，更不曾將金錢視爲萬善的起源，或者用於促進良善。光是想起自己曾經浪費七、八年的時間自艾自憐，我就覺得悲傷，我希望各位讀者不需要經歷這種感受，你的孩子也不需要。倘若你和我一樣，今天就來終結你的錯誤金錢觀。'
  merge: -1
