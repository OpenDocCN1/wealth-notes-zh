  img_proc: true
- pgno: 134
  md: '我們應該擁有權力時，再去思考如何控制和改變系統。從善如流比對抗潮流更好。我們應該尊重金錢和資本主義的本質，而不是跟隨自己憤世嫉俗的金錢觀和對資本主義的偏見。


    財富的巨人認真看待其中的差異，我們也會在本書往後的內容讀到財富巨人的三個共同特質。


    如果你依然想要改變現有的系統，應該努力變得富裕，擁有足夠的金錢、權力和影響力，才能做到真正的改變。這將是長達一生的使命，但億萬富翁確實擁有這種能力。如果你可以仔細效法本書提出的概念，就能善用資本主義，用合理善良的方式締造細水長流的巨大財富。


    # 資本主義的未來


    比爾・蓋茲已經呼籲，資本主義社會必須在往後的人類紀元中，更有效率地處理更大的社會及環境議題。


    他的資本主義調整計畫稱為「創造式資本主義」，實際的運作方式是一種「新的資本主義，解決社會議題是經濟活動的主要目標，而非次要目標。」蓋茲在早期的職業生涯累積了巨大的財富，步入生涯的晚年之後，他善用財富的創造更大的效益，促進人類'
  merge: -1
