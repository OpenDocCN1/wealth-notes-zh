- pgno: 326
  md: '# ◎商業合作槓桿


    少為五十萬，就是更進一步發揮槓桿效果。換言之，房租成為你的收入來源之一。藉由銀行，你同時創造三種槓桿。第一，你用銀行的錢購買資產。第二，你用房客的金錢繳納貸款。第三，房地產和房租收入提升你的金錢流動速度。你可以將房地產的管理和修繕工作委任給中介經紀人，減少時間支出，建立第四個槓桿。


    在上面的房地產投資案例中，如果你找到投資人願意支付二十五萬英鎊的購屋存款需求，或者和其他人簽訂契約，得到投資保證金，就能夠創造無限的槓桿效果。按照上一段的房地產例子，投資人提供二十五萬英鎊，剩餘的七十五萬英鎊依然向銀行貸款，就能湊齊購買房地產的一百萬英鎊成本。


    除此之外，你也可以尋找一位願意百分之百出資的商業合作夥伴，達成同樣的利潤。我在商業活動上認識了一位投資人，後來結為好友。他全額投資我們購買一棟商業建築。我們再向銀行貸款，將建築重新裝修為四十二個商業單位之後出租。我們和投資人共同擁有這些商業單位。


    隨後，我們買下隔壁的商業建築，改建為十二到二十個商業單位，可根據承租者的需求調整。這兩筆投資的年獲利估計為三十六萬三千英鎊，成本完全由投資人負擔。在這個商業合作模式中，投資人藉由我們的時間、地點、知識和經驗，建立他的槓桿效果；'
