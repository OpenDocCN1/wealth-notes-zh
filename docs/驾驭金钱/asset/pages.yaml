- pgno: 181
  md: '希望讓別人以爲你很愚笨，所以從不行動、嘗試或購買。你打擊自己的信心，不願努力，用各種理由說服自己相信「我還不夠好」，也不願開始行動。你害怕失敗，一事無成，原地空轉。


    上述的情緒極端都來自「我覺得應該如何」，而不是「什麼對我最好」。你想要「贏」，而不是找出「最好的決定」。你希望「看起來很美好」，而不是「完成正確的行為」。你出於報復心態，想要改變別人的想法，而不是得到最好的結果。無論你內心產生何種情緒，都只會引發錯誤的反應，無法滿足內心的目標。這就是情緒造成的結果。於是你開始後悔、羞愧、滿懷罪惡感，甚至否認。在投資和商業行爲中，有兩種金錢的基礎情緒原則：


    第一：過於興奮，無法做出良好的購買決策。


    第二：過於擔憂，無法做出良好的銷售決策。


    許多人經常打破上述兩個規則，所以他們不屬於人類社會中○・二四二%的百萬富翁。簡言之，正確的投資方法就是觀察群眾的行爲模式，然後反其道而行。所有人只要没受到強烈情緒的干擾，都可以提出偉大的計畫。


    讀者應該致力增強控制情緒的能力，排除偏見和情緒化。如果你正在調整飲食，就應該清理冰箱；倘若你對金錢產生情緒，就不要購物。除非事前徹底做好功課，否則不要用現金或信用卡購買任何東西。在一情緒影響下所做出的金錢決策，很有可能會令'
