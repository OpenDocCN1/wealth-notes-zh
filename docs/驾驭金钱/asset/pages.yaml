- pgno: 307
  md: '# 35 CHAPTER

    生活槓桿


    生活槓桿可以讓你事半功倍，用更少成本賺到更多錢（用其他人的金錢作為成本），用更少時間創造更多時間（減少你的個人時間支出），用更少付出得到更多成果（減少你的個人付出）。


    > 給我一根夠長的槓桿，我就能舉起全世界。


    —— 阿基米德


    許多人在生活中沒有發揮槓桿效果，相信「努力工作」就會賺更多錢，而我們必須「奉獻」和「犧牲」才能餬口。


    生活是一種權利，不需要「努力」才能得到最基礎的生活，我們值得過自己的人生。


    每個人都會經驗到槓桿效果，例如僕人和主人、員工和雇主、追隨者和領導者、借款者和貸款者、消費者或生產者等關係，兩者不僅互利共生，其中一人還會成為另一人'
  merge: -1
  img_proc: true
- pgno: 308
  md: '我們的槓桿。


    我們必須善用這種效益，實現激勵人心的夢想，善用他人的時間、金錢、資源、人脈、系統、經驗和技巧，藉此賺錢，或者成為他人的助力，實現他們的願景。


    如果你替別人工作，但內心並不快樂，或是完全為了錢而工作，不工作就沒有收入，意味著你已經淪為別人的槓桿。他們利用你賺錢，你成為價值鏈中最低層的人，愈努力工作，賺得反而愈少。你幾乎沒有決定權和自由，可能也覺得很不幸福。


    許多人受到影響，相信時間、工作和金錢之間只有一種單向關係，但富翁們和有遠見的人則明白三者能夠相互影響。


    我們被教導「努力工作才能賺錢」，但其實你該學著怎麼用錢滾錢。你被洗腦，認為長時間的付出和超時工作才能賺錢，但在真實世界中，只要善用槓桿效果、領導能力和打造菁英團隊，就可準確實現目標，創造細水長流的財富。


    然而，英國前二十五%的有錢人，全都不是聘僱人員，而是創業者或接收父執輩留下的公司。他們是雇主、企業家和投資人。全球所有的願景家也是財富創造者、改變者和風險承擔者。


    富翁們善用他人的時間、資源、知識和關係，替自己創造利益與節省時間。仔細看億萬富翁的生活方式，他們真的比礦工、僕人和清潔工更努力工作嗎？當然沒有。你可以學習槓桿效果，理解有錢人使用的策略和戰術，藉此賺錢、節省時間，更上層樓。'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 槓桿資產


    所幸運有了網際網路、光纖網路、還有那些應用程式和系統，想要以小博大比以前容易許多。


    你可將許多瑣碎的操作工作外包，以時薪制聘請數名助理，騰出更多時間，專心處理創造收入的工作。你可以將五個小時的工作外包，支付四十英鎊，請其他人處理非收入創造工作，再把五個小時重新投入重點工作，建立事業、購買房地產，帶來三萬英鎊的收入，製造每年平均數千英鎊的利潤。


    讓我們以房地產投資為例吧。我非常熱愛房地產，而且這也是我的主要事業，更是超級有錢人常見的獲利模式。


    在房地產投資中，可以分為「投資客」和「房東」兩種類型。投資客雖然也負責處理房東的經常工作，例如房地產管理和修繕，但許多房東則是親力親為，毫無發揮槓桿效果。


    這些房東通常「自聘員工」，或者把當房東視為打發時間的副業，親自處理裝潢、油漆、收房租和其他瑣碎的事務工作。然而，投資客則懷抱更大的願景，堅守理想的策略，將所有管理和修繕的瑣碎工作外包，發揮槓桿效果，騰出時間來親自處理更重要的'
  merge: -1
  img_proc: true
- pgno: 310
  md: '收入創造工作，提升事業規模。大多數的利基產業都適用這種思想和經營過程。


    很多人都受到父母傳承給他們的價值觀，而且很難翻轉，相信要「找一份穩定的工作，努力犧牲奉獻，不要輕易冒險」這個概念。


    大多數的自雇員工認為所有瑣事都不能假手他人。身為事業老闆又親力親為，使他們獲得一種「我很重要」的感覺。他們防衛心太高了，認為「沒人可以做得跟我一樣好」，不願意將工作外包給其他人。


    這些人以為自己沒錢找人外包，又或是以為親自動手可以省錢。他們剛開始創業時，藉由親自處理大小事省錢，長久下來已經習慣了。


    親自動手做確實可以節省成本，但卻相當浪費時間，也產生了什麼週邊效益。你必須完成許多不喜歡也不擅長の瑣碎工作。親自動手做的英文是DIY - Do It Yourself，我認為其實是Destroy
    It Yourself，親自摧毀事業。


    剛開始投資房地產時，我認為親自觀看物件、處理購買手續、協商貸款、重新裝修、出租和管理房客都是日常必須工作。我充滿能量、熱誠和動力，就像許多人接觸新領域一樣，最後卻耗盡了耐心。


    第一年，我購買了十餘件房地產，準備迎接人生的財務安定時，我突然想問自己：「這就是我想要的生活嗎？」真相是，我喜歡可愛的嬰兒，但討厭生產的痛苦，換言之，我想要房地產創造的金錢，但厭惡管理和修繕的細節工作。我已經陷得太深，而且開始'
  merge: -1
  img_proc: true
- pgno: 311
  md: '賺錢，我害怕自己無法逃離困境。


    即使房地產是全世界最好的資產項目，只要缺乏願景或不懂得利用槓桿效果，也會成為艱難的事業，因爲你必須處理困難的瑣事，而別人更不會珍惜你創造的價值。


    然而，只要懂得怎麼借力使力，善用時間、金錢、資源、觀念和人力，房地產可以讓你的擠身富豪名單。其他的事業也一樣，只要發揮槓桿效果，就能獲得理想結果，凡事親力親爲，到頭來換到的只是沮喪。


    大約一年後，我下定決心，不讓自己的房地產業像其他房東那樣成爲兼職工作。


    我開始尋找各種方法，讓其他人替我瀏覽、出價、購買、出租、裝修、管理和維護修繕房地產，同時保持良好的收入。我只有兩個選擇：退出房地產，或者建立槓桿。


    我的老天，我已經投入太多，不可能退出。但是，我沒有將燙手山芋交給別人，或者擺脫責任，而是神智清醒地明白自己想要追求什麼生活目標。


    我和荷馬建立合夥關係，也發現很多人其實很珍惜你覺得困難或討厭的工作，甚至表現良好，藉此賺錢謀生。他們不只能夠從事我做不到的工作，還真的喜歡我厭惡的內容，這個發現對我來說幫助很大。


    在此之前，我根本不曉得有這種人。如果我可以把瑣碎的工作外包，就能獲得成長，賺到更多，從事更多自己喜歡的工作，並且創造商業契機、就業機會和促進經濟發展。


    我當時已經二十六歲了，從來不曾有過這種體驗，也沒有人教導我槓桿效果。'
  merge: -1
