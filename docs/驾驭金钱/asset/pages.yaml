- pgno: 477
  md: '業貢獻一己之力。這些人的差別只在於年齡、出身、利基點、遵循的規範、運用的媒體、社會文化、價值觀和人格特質而已。


    不會有兩個一模一樣的有錢人，意味著每個人都有自己的機會，如果有一個人能變有錢，那麼每個人都可以，包括你。


    所以法拉利的車主到底有什麼特質？他們跟其他有錢人一樣都是獨特的個體。他們可能很高調，也可能很低調；可能很自私，也可能對世界充滿熱情，或是從小就很愛做夢……總之無法確切定義。


    但你可以定義你自己。


    何不向他們學習呢？教育拯救了我的人生，讓我走出自己的路，並且釋放所有那些對人的批判。這個世界需要更良好的教育。有很多人沒什麼機會獲得良好的教育，但是你。


    貸款制度，就金錢重分配的角度來說，可謂立意良善，不過這當中所需的不只是錢而已。事實上，金錢若是落在沒知識的人手上，情況可能會更糟。因此有許多鉅富才會創辦大學、圖書館和基金會等。這也是比爾·蓋茲夫婦創辦基金會，而巴菲特也贊助好幾億的原因。


    金錢是讓善意能夠在全球流通的動力，它有助於各種面向的成長和進化，同時也是測量價值和益處的工具。'
