  md: '# 眼界清明


    清楚理解自己的願景非常重要。如果連你自己都搞不清楚你的志向，其他人更是沒辦法。倘若你不清楚自己能帶來什麼改變，其他人也不會明白買你的東西有什麼好處，那麼你就無法鼓動他們購買你的產品或服務，完成你的使命與目標。你內心的務實想法會成為現實生活，你必須對未來的願景一清二楚，日復一日地努力實現。


    你最終極的人生願景，應該是透過許多靈感而建立起的生活價值。你的願景就是你的生活指引地圖。


    面對人生每個十字路口、艱難的選擇、挫折、轉捩點和變動的時刻，當你無法釐清思緒，經驗不足而迷惘時，願景可以作為你的嚮導。我們都有偏離軌道、被擊垮或是感到混亂的時刻，只有清澈的目標能減少途中的阻礙。


    地球上大多數的人都沒有真正的夢想，這說明了為什麼他們感受不到生命的目標、啟發和成就。


    倘若你不清楚內心的目標或你的目的地在哪，就會一事無成。我們可以將願景視為人生的藍圖，實現有目標的人生。


    缺乏願景和目標，你就沒有方向，宛如在旅途的過程，仰賴沒有設定終點的衛星導航。一旦人類失去目標，就無法促進演化并保持生存。上述的情況也部分解釋了為什麼許'
