  md: '用這筆獎金？不理解且不珍惜金錢的人，會列出一張清單，寫上他們想要購買的商品，以及各種揮霍的方法。你不會聽到他們將獎金用於教育、投資獲利、保護金錢價值、避險，或者建立自己的事業。倘若他們珍惜金錢，就不會把錢花費在稍縱即逝、只會創造負債的商品。如果他們理解金錢，就不會將錢揮霍在貶值的消耗商品。


    如果你用同樣的問題，請教一位珍惜並且理解金錢和財富的朋友。他的第一個答案一定是拒絕花錢購買樂透彩券，因為他們不會把賺錢的希望投注在一千三百九十八萬三千八百一十六分之一的機率（英國彩券的獲獎機率）。隨後，他們就會列出投資清單，藉此創造商業利潤、長期維持的複利收入、投資並且建立資產（創造非勞動收入）、建立團隊並且聘請專業會計師和稅務顧問（保存金錢價值）。他們只會花費資產創造的收入。


    金錢不會平均地分配給每個人，因為這不是金錢的本質。金錢也不會眷顧不幸運的人、更有資格的人，或者更重視精神涵養的人，因為這不是金錢的本質。金錢只會單純地從不理解且不珍惜金錢的人，流動至最珍惜且最理解金錢的人。妥善管理金錢者，更容易留住金錢。無法妥善管理金錢或者不尊重金錢的人，容易失去金錢。


    # 三、收支平衡


    經濟學和金錢領域都適用收支平衡原則：在特定的經濟系統中，金錢的支出和收入數量一定會準確地達成平衡。最不珍惜金錢的人，他的支出會相對高於收入；最珍惜金'
