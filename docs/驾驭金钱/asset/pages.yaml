  md: '候補）享受工作，將無關緊要的瑣事委任外包。


    研究最成功的人物和你的偶像，學習他們最好的優點。偶像創造了你渴望的生活理想，很有可能學會如何結合熱情和專業，賺到非常可觀的收入。理解他們追求成就的經驗和方法，發揮槓桿效果，才能更快完成自己的旅程和事業。


    你以為這個道理誰都懂。問題是，大多數的人卻以爲難如登天，或者憎恨成功人士。但其實很多人都是白手起家，成功人士只是找到正確的方法和模式，才擁有今日的成就。


    全球前百分之一的鉅富所擁有的錢，是全球半數窮人總資產的六十五倍左右。這點告訴我們什麼事？如果別人可以白手起家，發財致富，你也可以！學習他們的特質和策略，並釐清自己該堅持什麼，放棄什麼。


    在一個人發展一的領域中，放棄經常被認為是軟弱。然而，除非你放棄高價值、高回報或非常重要的目標，才是真正的軟弱。放棄低價值和時間報酬的瑣碎工作，其實是**非常睿智、堅強且勇敢的行為**。不要因爲別人說「放棄代表軟弱」，而勉強堅持某個目標。賈伯斯重返蘋果時，做了非常知名的決策。他撤除大部分的產品，讓員工專注在少數創造利潤的重要產品。我們必須明白自己該做什麼，而且做自己懂的事。不要花時間處理別人的計畫，或者聽信別人不負責任的工作和生活建議。'
