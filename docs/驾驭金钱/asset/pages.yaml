    花費了二十年，甚至更長的時間後，你以為自己終於登上高位，可以發揮影響力，才發現原來還有層層相扣的政治世界與官僚體系，完全在你的掌握之外。因此，我建議你先從自己開始改變，才能真正的改變世界系統，「從下而上」比「從上而下」更好。'
