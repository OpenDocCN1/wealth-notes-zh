- pgno: 379
  md: '# 內部創業（雖然任職於其他人的公司，依然保持自主性）


    在鼓勵創業的現代社會，內部創業是受聘和創業的結合體。內部創業讓我們可以享受員工的安全和保障，同時具備創業的自由和自主。具體而言，內部創業的形式可能是讓你在家工作，或者減少待在辦公室的時間。


    你負責管理一項計畫，而不是從事瑣碎的小工作。你擁有自主性和帶人的機會。你能夠管理自己的部門，公司主管或企業主尊重你，認為你是個領袖。在《生活槓桿》中，我曾經分享過一個故事。故事的主角將所有的工作委任外包，雖然待在辦公室，卻不需要親自處理工作。他因而遭到解雇。但是，在這個商業顛覆的年代，許多創新進步的企業歡迎內部創業精神。你必須在職場競爭良好的工作機會，也要同時吸引有才華的人與你共事，內部創業可能是最好的選項。我的團隊成員雖然是員工，但他們也經營自己的電子商務和投資房地產。如果一位員工來找我，提出一個新的計畫或部門設計，希望得到更多自由工作空間或者創造了不起的改變，我很少拒絕。我們的關係更像合作夥伴。他們藉由我的金錢發揮槓桿效果，支付日常生活的費用，我協助他們發展創業的才能。他們也可以測試自己適不適合創業，不必承擔完全失敗的風險。有些人把握機會，成功完成一項計畫，可能會就此離開，開始經營自己的公司事業。一開始，我確實很難過，以爲是自己開門送走一位傑出人才。現在我明白這是一份偉大的禮物。許多傑出的房地'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# 如何發揮內部創業的槓桿


    以下是如何在內部創業時發揮槓桿效果，賺到更多錢的方法。有些方法很像受聘槓桿，另外則與創業者的方法相似。


    +   - 尋找管理者、企業主或雇主的價值。

    - 思考如何提升公司的最高價值領域，讓公司得到最好的益處。

    - 內部創業時，努力領導計畫和公司部門，將它們視為自己的企業。

    - 將新的契機和投資計畫交給雇主，提出計畫書，包括你的分紅利潤額度。

    - 提出新的節省成本方案，交給雇主，並且要求合理的回報。

    - 每個月定期和管理者見面，討論你替公司創造的成果，傾聽回應，提升表現。

    - 詢問明確的公司理念、目標和時間規劃，配合個人的最高價值領域和收入分紅。

    - 超越預定目標。

    - 學習創業知識，例如管理、領導、招募和行銷，讓自己成為不可或缺的重要人才。

    - 建立傑出的效率，妥善管理時間生活，創造最顯著的進步。

    - 工作時保持效率，就能享受休閒生活。

    - 永遠都要服務並且在乎客戶。


    產投資者都將創業成功的契機，歸功於發展不動產。'
  merge: -1
  img_proc: true
- pgno: 381
  md: '不要害怕分享自己的理念，勇敢提出計畫書，尋找讓公司成長的方法。如果你很害怕，或許需要尋找另外一位雇主或合作夥伴。


    在這三種創造並且給予金錢的方法中，無論你選擇何者，都能夠順利成功。請讀者花時間仔細思考，也可以和伴侶討論，因為良好的選擇有助於家庭平衡和長期發展。


    這三種方法都可以培育富有且生活平衡良好的成功人物，而所有的億萬富翁都是創業家。'
  merge: -1
  img_proc: true
- pgno: 382
  md: '# CHAPTER 41


    用熱情賺錢


    你能結合熱情和專業，工作和假期嗎？你可以從事自己所愛，愛你所選嗎？你能發揮嗜好，創造財富嗎？答案是肯定的，但不見得總能夠成功。你必需學習正確的模式和系統。


    我相信一個道理：工作不該是為了餬口而從事自己討厭、憎恨或不擅長的領域。你愈想經營雙元生活，希望在辦公室照顧家庭，或者在家處理公事，就會變得疏離沮喪。將家庭生活完全隔絕於工作之外，讓你陷入兩極情緒，無法享受也不能體驗當下的快樂。根據Google網站的資料，「民眾最常見的不快樂原因」第一名就是「討厭工作」。如果你不喜歡自己的工作，就不值得浪費數十年。我鼓勵有這種心情的讀者開始思考改變生活，請參考「如何結合熱情和專業」。許多人工作餬口，但大多數改變世界、實現目標的人，都是用生活實現工作，或者同時維持工作與生活。'
  merge: -1
  img_proc: true
- pgno: 383
  md: '# 家庭生活和工作生活


    太在意工作，讓你無法在家安靜休息。太重視家庭生活，你又賺不到錢，職業生涯停滯，不能出人頭地。無論如何，犧牲其中之一，只造成內心失衡和悔恨，有時候甚至同時影響家庭和工作。但是，為什麼我們一定要壁壘分明看待工作和生活？


    「平衡」是很罕見的理想狀態，就像鐘擺在兩個方向擺動，不會停在完美的中央位置。想要追求家庭和工作的平衡，在最好的情況下只是緣木求魚，在最差的情況則是徒勞無功。你不需要犧牲奉獻，就能得到美好的家庭和生活，就像理想的工作。


    我並不是請你一邊抱著孩子，一邊用手機回覆電子郵件（我試過了，你要嘛掉了手機，要嘛掉了孩子）。你可以帶著家人度假，早上進行公務會議，讓小孩參加「孩童之島」（Kidsmith）主題館的活動。


    你也能在另一個國家安排演講行程，帶著家人同行，享受小旅行。如果家人對你的專業領域有興趣，讓他們一起參與學習。讓小孩就讀環境良好的私立學校，與其他家長一起募資或投資。倘若你想參加外地的課程和研討會，不妨帶著家人一起出門，不要遠離他們。和其他企業主或有錢人一起吃飯，向他們學習知識。在晚上安排組織管理社群網路的活動。和百萬富翁一起打高爾夫球。參加最好的俱樂部和健身房，培養興趣和照顧身體，也能夠認識傑出的朋友。拜訪新城市時，記得觀察當地的房地產。在上班的'
  merge: -1
  img_proc: true
- pgno: 384
  md: '中餐時間，和家人一起吃飯。享受多國家的生活，例如夏天待在英國，寒假時帶著孩子和家人住在溫暖的城市。


    和家人促膝長談，一起規劃家庭時光——把假期、約會、家庭聚會寫進行事曆。只要在行事曆安排絕對不能改動的計畫，其他的工作就會自動找到適合的時間。倘若你不謹慎處理，行事曆就會被各種活動佔據，無法完成重要的計畫。你愈提前安排重要計畫，全世界就會幫忙你挪出時間處理工作、演講或旅行。你可以照顧理想的家庭和工作，根本不需要過度犧牲。我討厭假日，我的妻子琴瑪不喜歡這樣。結婚的前五年，每逢假日，我都在抱怨，認為事業毫無進展，假日只是浪費時間。


    我發自內心想要一直工作，她則希望可以坐在沙灘上享受人生。我在假日時總是坐立難安，她非常高興。時至今日，我們終於可以結合工作和假期。我在世界各地舉行演講、寫作營、高水準的智囊團研討會，家人也到摩納哥、開曼、佛羅里達、特內里費和杜拜等度假聖地享受假期。工作和生活確實可以完美結合，實現熱情和專業，工作與假期。琴瑪終於可以好好放鬆，擁有美好的假期。我們一起帶著孩子享受人生，他們參與我的工作生活，我不會錯過他們的成長過程。


    我們能夠結合工作和生活，不需要埋頭苦幹十個星期，只為了與家人共度一個週末。現金不值得我們犧牲家人，只要妥善規劃，遵守稍後提出的六個重點問題。


    家庭成員的生活價值不盡相同，很難同時讓每個人快樂。你必須理解他們的價值。'
