- pgno: 55
  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_55_0.png)


    # 賺錢很難


    倘若有人可以賺大錢，那就代表其實任何人都做得到。假設你相信天生的才能勝於後天努力（雖然我個人不完全相信），因此你認為大多數的人不能做到某些事情，無論再怎麼努力都沒有辦法，例如灌籃、在十秒跑完一百公尺，或者任何屬於人類才能的特殊技藝。好吧，讓我告訴你一個致富的好消息：任何人都能成功，無論高矮胖瘦或聰明木訥。


    隨意挑選任何一個主題，你都會發現某個平凡人賺取生活費用的來源可能是無趣的嗜好、休閒活動或職業，甚至因此致富。


    你可以學會如何賺錢。賺錢有一個祕密公式（我會在稍後詳細介紹），你得以從中學會他人賺錢的方法，慢慢理解金錢的共同特性，甚至效法那些富人的特質。閱讀本書，你就能學會金錢系統和共同特性，並且發現一切相當簡單，想要不賺大錢也難。'
  merge: -1
