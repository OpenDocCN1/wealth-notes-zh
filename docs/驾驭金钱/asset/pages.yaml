  md: '口的稅制，手錶買賣變成非常好的美元英鎊獲利工具。多年來，英鎊很少呈現如此疲弱的價格，也創造了空頭機會。當然，如果英鎊非常強勢，也能進行反向操作。


    經常有人想要知道我持有哪些資產，以及各種資產的比例。我配合全球經濟環境、景氣循環、利息和通貨膨脹指數調整資產分配。


    如果利息非常低，沒有必要保留現金；利息很高，就值得保存。利息高的時候，必須減少貸款金額或槓桿設定。倘若貨幣弱勢，你就要持有更多實體資產。倘若市場價格非常強勢，你可以考慮脫手資產；假設市場價格弱勢，或者你相信景氣準備回升，請思考買入資產。你當然無法預測準確的走向，但歷史和經驗是良好的指引工具，你也可以在不同的時間點，用不同的額度進行買賣，藉此降低風險，平均分攤成本。


    市場永遠都有機會。許多人認為只有景氣繁榮時才有投資機會，但衰退時經常有更大的利多空間，因為你逆勢投資，反而減少競爭，現金流動的速度也會大幅改變。微軟就是在景氣衰退期創立的。二〇〇七年和二〇〇八年的全球景氣衰退期，我們的房地產競爭者也退出市場。我們與同領域最大的企業合併，成為少數屹立不搖的房地產公司。如果市場繁榮，我們不可能有這些機會，因為競爭者的規模比我們大一百倍。


    你的資產基礎愈大，套利空間和對抗景氣的槓桿空間也會重新分配。你可以在景氣衰退時事先做好準備，景氣繁榮時事先做好對抗衰退的預防措施。'
