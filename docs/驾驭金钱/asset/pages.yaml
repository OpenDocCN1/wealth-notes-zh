  md: '全球經濟的總金錢數量，絕對足以讓所有人成為百萬富翁。因此，我們必須提出一個重要的問題：是誰拿走你的金錢？


    絕對不是我。


    # 你應該具備的心智觀念


    你的金錢觀念是否符合現實世界的狀況，並且理解到，其實世上有充足的金錢：無所不在，而且取之不盡。還是你的金錢觀是匱乏的，認為世上的錢根本不夠？你以為經濟體系控制了你的經濟狀況，還是你可以控制自己的經濟狀態，根本不需要在意經濟體系的變遷？


    印鈔機製造了金錢，金錢存在的目標則是服務人類。


    過去、現在，以及未來的一切实體金錢，都來自於無形的理念。你可以說這就是精


    神理念化為具體物品。未來會出現許許多多的新產品、新服務和新觀念，財富和金錢當


    然也因此無窮無盡。稍後，我們將討論物質和精神之間的關係，以及匱乏和充足的金錢觀念。


    這個世界的金錢並不匱乏，所以真正的問題是：你是否願意追求自己的公平收入？'
