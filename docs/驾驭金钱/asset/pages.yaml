  md: '必須用於建設地方圖書館、推動世界和平、教育和科學研究。他用商業收益建造紐約知名的卡內基音樂廳、卡內基協會、卡內基國際和平中心、卡內基科學研究所、蘇格蘭大學的卡內基信託基金以及卡內基英雄基金會。


