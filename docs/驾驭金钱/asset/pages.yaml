  md: '迅速獲得現金。利息低的時候，貸款可以創造價值。小額貸款的速度很快，而且促進金錢流動，但金額龐大的長期個人貸款成本很高。有些人甚至申請多筆個人貸款。請謹慎應用，不要因為急需用錢就負攤高額利率。現在，你甚至可以用手機應用程式申請貸款。


    # 抵押資產淨值，申請融資


    如果你有房地產或其他資產，可以作為擔保品，重新調整財務分配，將資產淨值轉為融資金額。利息低的時候，房貸的長期成本較低，抵押淨值融資可以輕鬆創造金錢，藉此發揮槓桿效果，購買其他資產或投資事業。如果你能找到一位商業貸款者，提供良好的資產組合，可以藉由淨值融資節省數千英鎊的利息。善用資產的淨動抵押方法，也可以募款，無須實際抵押多項資產。


