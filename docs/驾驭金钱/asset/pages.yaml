- pgno: 285
  md: '我剛開始創業時，只有制訂幾個跟一般人差不多的財務目標。十年過去了，我在每一年提出新的計畫（包括建立人生的方向）。我會在下一段分享個人的目標和願景，讓讀者節省十年的摸索時間。


    讀者應該一一仔細思考人生的計畫、願景和目標、生活的主要領域、希望留在他人心中的印象和記憶、渴望留下的傳承、物質財富的領域、慈善事業、育兒家庭理想，以及事業與個人的財務目標。你的思考愈明確，例如希望擁有哪些廠牌的特定型號汽車，或者理想的度假地點，你的潛意識、宇宙的未知能量還有其他人就能協助你實現目標。


    # 個人的目標和願景


    我想和各位讀者分享自己的目標和願景，希望協助你發揮槓桿效果，或者創造獨特的願景。請用你喜歡的形式，將我的目標和願景備份在雲端系統。早上起床之後和晚上就寢之前閱讀，因為此時你的潛意識最為開放，容易接受指令。每半年，我們應該回顧目標和願景。如果你覺得進度緩慢，不妨定期檢閱，也可以仔細修改，追求更細緻的想法。當你完成小型的里程碑，就可以打勾做記號，或者在目標表旁邊繪製進度表。努力且務實追求最明確的短期目標，樂觀看待長期目標。年度目標要配合人生的整體目標，才能同步發揮功效。練習鮮明描繪目標，可以提升實現能'
