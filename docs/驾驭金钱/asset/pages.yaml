- pgno: 349
  md: '相較於直線的時間計算，經過八十／二十法則調整的收入創造價值提升了四倍（四百倍）。但是，如果繼續考慮「八十%的工作時間，只能創造二十%的收入」，就能發現缺乏效率的可怕：


    +   1. 二十%的收入創造價值＝二十%的週收入／八十%的週工作時數＝二十英鎊／四十四小時＝每小時四·五四英鎊


    相較於直線時間計算得到的十八·十八英鎊，缺乏效率的收入創造價值只有四分之一（減少四百%），但如果比較高效率的收入，只有十六分之一。


    在二十%的時間，你賺到的金錢，可能超過八十%時間的總收入。讓我們繼續加入複利效應。如果你非常清楚自己的AVK，將八十%的低價值工作全數委任外包，只要完成兩倍的高價值工作，就能創造以下結果：


    +   - 你外包了六十%的工作時間，假設一小時的成本為十英鎊，總成本就是三十三小


    +   - 時乘以十英鎊＝三百三十英鎊


    +   - 你用剩餘的四十%時間，完成兩倍的高價值工作，收入為二十二小時乘以七十二·七二英鎊＝一千六百英鎊


    +   - 你擁有六十%的空間時間，可以自由應用


    +   - 你用二十二個小時賺到一千六百英鎊。原本的方法只能在五十五個小時賺到一千


    +   - 英鎊'
