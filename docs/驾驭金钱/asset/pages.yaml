    # 活到老，學到老


    史蒂夫·席伯德 (Steve Siebold) 研究超過一千兩百名百萬富翁後認為：「走進富人的家，你會立刻看見非常豐富的藏書。他們藉由閱讀，教育自己如何追求成功。」他補充道：「中產階級只閱讀小說、八卦小報和娛樂雜誌。」


    根據《商業內幕》的報導，巴菲特一天的工作時間有 80% 用於閱讀。RustHub.net 網站的湯姆·柯里 (Tom Corley) 則說：「八十五 % 的百萬富翁，每個月閱讀兩本以上的書籍。」他們閱讀的書籍主題大多是職業發展、教學、歷史、成功人士的傳記、自我幫助、健康、時事、改善記憶和學習力、心理學、領導、科學、新紀元和培養積極正面的心態。


    我個人和其他作家的相關研究都清楚證明一件事：富人藉由閱讀書籍和文章，不斷接受教育。他們從其他鉅富身上學習，參與商業、財富、金錢和上述各種主題的活動與課程。雖然許多人不認為「閱讀使你富裕」是良言金句，但其實你該正視這句話。一個月讀兩本書並不難。柯里認為，一個月只要讀兩本書，三十幾年後，我們就會成為百萬富翁。'
