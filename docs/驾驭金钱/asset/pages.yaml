  md: '# # CHAPTER 22 主宰你的情緒


    是你在控制錢，還是錢在控制你？


    巴菲特是世上最富裕的人，他曾說過：「直到可以控制情緒之前，不要期待自己變得富裕。―除非你能控制擁有的一切，否則無法掌握更多金錢。追求富裕和金錢最大的障礙就是不認識、不瞭解並且不能控制自己的情緒。」


    過度的痛苦和喜悅是靈魂最大的疾病。因為，一個沉浸於極大喜悅或極端痛苦的人，懷抱不合時宜的渴望，想要趨樂避苦，無法正確凝視或傾聽，陷入瘋狂，最後失去理性。


    ——柏拉圖


    極端的情緒會摧毀財富。


    過度迷戀或厭惡某物，都會影響你的情緒。你變得興奮或沮喪，被情緒控制。睿智'
  merge: -1
