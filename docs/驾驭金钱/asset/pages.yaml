- pgno: 429
  md: '# ## 開創募資（Kickstarter）


    開創募資是群眾募資平臺的新型態，建立有別於傳統募資方法的新途徑。募資人必須提出計畫，設定明確的截止期間和最低投資額度。如果期限已到，募資人尚未完成目標，平臺就不會發放任何資金，這是一種保障機制。全球各地的民眾都可以使用開創募資平臺，據說已經有九千四百萬名投資人和十九億美元的資金，完成二十五萬七千項計畫。投資人會得到實體或獨特的收穫獎勵，而不是現金回饋和事業股權。


    # ## 商業合資


    商業合資是指其中一方負責經營事業或管理資產，另一方提供金錢，也可以雙方合夥經營事業，權責分明。你可以和合夥人簽訂契約，決定持股數量或投資金額分配方式。


    商業合作的角色、股份、投資金額都很有彈性。你和合夥人的專業知識技巧可能非常相似或互補，只要有助事業發展即可。商業合資是很常見的高效率經營方式，可以保持事業和資產持續成長。許多募資方式最後都會轉為商業合資，很多良好的事業體也會彼此合作。'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# 信用卡


    信用卡貸款的優點是快速，但代價很高。信用卡公司也會提供零利率貸款服務，但只要超過繳費期限，就要承受循環利息。如果你擁有多張信用卡，也可以善用所有信用卡加總的貸款額，但務必謹慎。無論個人緊急用途或商業投資，信用卡都應該是最後一道防線，必須迅速繳清。收入優渥的人提高信用卡的貸款額度，申請更多張信用卡，只是为了建立保險機制，並且享受購物紅利。二〇一五年，一位中國籍的億萬富翁用信用卡購買價值一億七千萬美元的藝術品，獲得非常可觀的免費飛航里程點數。


    # 在拍賣網站售出不需要的物品！


    如果上述的方法都沒用，請清理儲藏室、閣樓和櫥櫃，盡可能變賣二手商品。二〇〇八年時，為了配合未婚妻的想法，我賣掉我的電子鼓和很多套音響，拿到的錢足以買下一間小房子。除此之外，賣二手商品也符合財富的真空法則。我因此獲得動力，積少成多。如果你已經是有錢人了，那你也可能堆了許多用不到的物品，立刻仔細清點，讓它們發揮槓桿效果吧！'
  merge: -1
  img_proc: true
- pgno: 431
  md: '聰明的策略和方法讓我們保持良好的人脈、取得資本、妥善經營商業合作關係、減少摩擦並且降低成本：


    +   ○建立良好的現金流動管道


    +   ○在不缺錢時就建立良好的人際關係，尋找潛在的合夥人


    如果你突然需要用錢，別人也會感受到你的迫切，沒人想要和亡命之徒合作，或者借錢給你。他們不會「為了解決你的絕望」而借錢或跟你合作。他們必須擁有良好的動機。我們應該將眼光放遠，在不缺錢時，就建立良好的人際關係，等到時機到來，就能妥善應用。重點在於飛黃騰達後也要不斷學習，並且懂得付出。任何人可能是未來的投資人或合夥人，所以待人以善，保持心胸開闊。


    +   ○獲得他人關注，但不要惹人厭


    讓別人看見你的努力，經營良好的社群網絡。每個星期參加一次社交活動，一年就有五十二次。你絕對會獲得注意。將熱情和專業結合在商業社交場合。分享自己的知識，幫助朋友，讓其他人可以在安全距離觀察你。哪天你希望他們投資，這就是影響決定的關鍵。不要讓人認為你只是想賺他們的錢。'
  merge: -1
  img_proc: true
- pgno: 432
  md: '# 關注所有網絡成員的動態


    觀察所有人，記住你喜歡他們哪些特色，關注他們的動態，進行第四步驟。


    # 第三次和第十次的接觸經驗最重要


    許多人在第五次的聚會或實際接觸時，開始思考自己想不想和你合作或繼續往來。少數人不需要這麼多次，有些人則仰賴七到十次的經驗。我調查過數千名民眾意見，才得到這個結論。請睿智處理人際關係，慎選詢問募資意願或討論事業經營的時機，行為要有分寸，務必清晰表達，讓其他人理解你的想法。即使一開始無法建立合作關係，也會留下好的商業合作印象。


    # 收放自如


    所謂的收放自如，就是懂得何時保持內向，何時又該熱情。如果你只能選擇其中一種極端，外向比較好，但最好維持冷熱兼具，讓別人看見你的努力，關心他人，分享知識，繼續學習，保持相對的謙虛，留下良好的印象。


    # 理解潛在合夥人重視的價值


    練習說話的語調，保持溫柔、簡短和優雅，同時具備說服力，將焦點放在潛在合夥'
  merge: -1
  img_proc: true
- pgno: 433
  md: '人身上。理解他們重視的價值，使你的談話內容可以「播到癢處」。每一次的聚會，都要讓其他人相信從你身上學習到重要的知識，而不是讓他們覺得你只是來索取好處。


    # 。達成協議


    建立良好的關係之後，等到合適的時間，就能探討商業合資的細節。首先，你們必須先完成意向書（雖然沒有法定效率，但明文記載雙方的合作計畫），至少說明各自的角色、股權和責任。隨後，完成商業合資、合夥或入股等法律文件，切記聘請法律顧問。簽訂法律合作文件可以保障雙方利益，也強迫自己履行合約中的責任，確定金錢流向、安全條款。


    找到有錢的合夥人，他們會打開通往財富的大門，繼續和你合作，將你介紹給其他人脈廣泛的有錢人，減少拓展事業的阻礙和合作疑慮。你會在許多意想不到的場合遇到未來的商業合作伙伴或合夥人。我在彼得伯勒的第一個房地產社交圈認識荷馬。有趣的是，我最後才決定向他攀談。我和每一位朋友交換名片，關注他們的動態。四個星期之後，荷馬協助我在一間房地產投資公司找到工作。又過了三個月，我們合資購買了第一個房地產。到了年底，我們已經擁有二十個房地產。十一年過去了，我們的合作關係愈來愈堅強。你不應該還在「努力準備」，而是「準備就緒」。許多人正在觀察你，美麗的財富就在眼前了！'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# CHAPTER 46


    管理金錢、善用金錢


    你可以努力賺錢，或者用錢滾錢。你能夠用時間換錢，或者擁有創造被動收入的資產，保存珍貴的 thời gian。任何人都可以妥善規劃，遵循有系統的方法，成為有錢人。


    你的起點不重要，重要的是立刻出發。許多人知道世間萬物的價格，卻完全不了解什麼叫做價值。他們不珍惜時間，不懂工作，不明白有形商品會貶值，也不清楚資產的價值會逐漸增加。媒體傳達似是而非的觀念，教導觀衆如何省小錢，卻沒有討論如何管理金錢，創造財富。


    除非你學會妥善管理資產，否則不會賺錢。你欣賞的事物都會增值，而你期待的目的會實現，但世上沒有所謂『我應得』的道理。專注學習如何管理金錢，欣賞金錢之美，尊敬金錢法則，並且嚴格遵守金錢管理系統，才能創造真正的財富。你愈符合這些方法，就會愈輕鬆，你培養更多好習慣，就能發揮更好的槓桿效果和複利效應。'
  merge: -1
  img_proc: true
- pgno: 435
  md: '# 不知道如何測量，就無法精通其中的道理


    許多人認為理財變得愈來愈難，因為錢常常摸不到看不著。我們以前工作一個星期，就會得到一袋薪水。你可以實際接觸到錢，這是一種可以實際感受的測量單位，代表每個星期的工作報酬。時至今日，大多數的金錢都藉由匯款或電子商務交易，速度更快。薪水也會先扣除稅金和國民保險，就連帳單都變成電子帳單，愈來愈少實際接觸。錢來得快也去得快。愈辛苦賺來的錢，我們就愈珍惜。


    我們必須改變舊的觀念，用新的理財方式。


    # 建立理財系統的五個步驟


    # （一）妥善管理金錢


    只有你可以負責管理自己的金錢。父母、監護人、獨立財務顧問、理財專員、經紀人都無法，只有你可以。有一次，我到銀行想要進行一筆交易。他們剛整修改完，放新的會議桌讓你可以與理財顧問面對面討論。我我想要處理的交易非常簡單，銀行的承辦人員請我到桌子前稍坐片刻，等他們處理相關文件。該名顧問大概二十歲左右，制服的尺寸有點太大，名牌也並未配戴整齊。他在電腦上輸入我的銀行帳號後，興奮地把眼睛'
  merge: -1
  img_proc: true
- pgno: 436
  md: '睜得斗大。我的存款其實不多，他卻開始拿出一套排演過的說詞，說明我可以如何善用金錢，他又能夠提供哪些投資建議。我猜他當時的年薪大概一萬四千英鎊左右。我很有禮貌地拒絕了。他一直不死心，我依然沒妥協。交易完成後，我走出銀行，開始思考方才的事件，愈想愈不高興。那位年輕人其實沒做錯事，他才剛入職場，想要向我介紹投資建議。但是，銀行居然讓一位毫無理財經驗的小伙子向我推銷？這就是銀行的致命錯誤。我就此下定決心要好好學習理財，而且百分之百自行管理。我也建議讀者效法我的目標。


    不過，本書的目標不是批評銀行的錯誤或騙局。每個人都有權利推銷自己的業務。金錢是生活最重要的事物之一，我想請求各位讀者親自管理、保護、精通金錢的大師技巧，持續學習並且成長。金錢就像孩子，你不會把孩童的成長過程外包給其他人處理。沒錯，我非常講究槓桿效果，但有些事情絕對不能委任辦理。我的一位朋友失去大筆金錢之後，詢問他的理財顧問：「我的錢真的消失了嗎？」這位顧問回答：「當然沒有，只是被別人賺走了！」—沒有任何一位獨立財務顧問、理財專員或經紀人會像你一樣在乎你的金錢。沒有任何一種金融商品在乎你的心情。你應該學習其他人的知識，但自己掌握財富。請妥善規劃財富，衡量並且監控個人財務狀況，妥善分配金錢，追蹤記錄財務情況，並且享受金錢之美。如果你失去財富，不可以責怪任何人，只能繼續學習，提升自己的知識，賺到更多錢。'
  merge: -1
  img_proc: true
- pgno: 437
  md: '# （二）制訂未來的財務計畫


    你已經全權處理自己的財富，就得制訂詳細的短期和長期計畫。你可以開始規劃擺脫債務，制訂日常預算、每個星期和每個月的計畫，隨後就是六個月、一年、三年、十年甚至五十年計畫。終極目標就是對後世的貢獻。


    # 。擺脫債務


    為什麼一個人會負債？讓我們先理解負債的人。根據資料，美國人一辈子會繳納超過六十萬美元的利息。如果你背負債務，請記得自己並不孤單，但你已經知道債務造成的負擔。你的第一個財務目標就是快速擺脫惡劣的債務，假如債務來自資產負債，更該立刻處理。從現在開始，絕對不透支。設定自動轉帳繳納債務，每個月盡可能償還最大額度。拿到薪水時，立刻繳納貸款，可以有效阻止花錢的衝動。先償還金額最高的債務，就可以稍微減輕利息負擔。如果銀行的利息很低，也可以考慮整合債務。倘若目前的財務狀況惡劣，儘可能和銀行協商，延後還款日期，或者延長債務期限，分成數次小額繳納。設定徹底擺脫債務的日期，儘可能迅速結清。債務會產生復利效應，你必須犧牲短期享受，追求往後的財富。每半年都要檢查進度，調整支出，降低浪費，完全擺脫債務。'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# ◆ 設定生活預算


    擺脫債務之後，你應該制訂每日生活預算，儘可能存錢和投資。強迫自己學會如何妥善應用小額金錢。如果每天自己準備午餐，一生可以節省十一萬兩千美元。只要懂得管理小額支出，就能妥善處理更大的開銷。我們必須妥善應用每日預算，否則無法賺到更多金錢。減少不必要的開銷，開始打造第一筆存款——這是財富的基礎。用合乎預算的金額購物，每個星期可以找一天的時間，稍微享受消費的樂趣。即使你已經獲得財富，一樣要用謙卑的態度，盡量控制支出預算。


    有效率控制每日生活預算，時間觀念會愈來愈寬闊。你開始制訂每星期和每月的生活預算和財務規劃（取決於你領取週薪或月薪）。制訂一筆固定金額，領到薪水之後，直接轉為「不可挪動的儲蓄」。減少特定的轉帳開銷和個人支出。如果情況適合，也可以兼職，創造兩個或三個不同的收入來源，建立個人獲利空間，


    收入增加之後，我們開始提升計畫。首先，每半年到一年要增加定存的金額，準確計算儲蓄空間，設定為目標。其次，個人日常支出的金額可以稍微增加，但絕對不能超過收入增加的幅度，並限定日常支出在收入金額中的比例。增加投資金額，貢獻社會，替孩子準備重要的教育經費以及購入資產。


    到了五年至十年的計畫階段，我們可以準備建立龐大的事業了。每年的財富成長目標為一倍至兩倍之間，取決於現有的規模。企業或個人事業剛開始起步時，比較容易'
  merge: -1
  img_proc: true
- pgno: 439
  md: '迅速成長。如果你能維持五十％的年成長率長達十年或更久，你已經和發展不動產與微軟公司並駕齊驅，表現得很好。你也能夠設定充滿雄心壯志的目標，涉足尚不了解的領域，就像一九六一年，美國總統甘迺迪希望在一九六〇年代結朿前，讓美國太空人登陸月球。他的理想非常宏大，開創了一條道路和制訂日期，最後讓人類社會取得空前的成功。你可以規劃未來的志願，這些目標令人振奮，甚至有點嚇人，但可以鼓舞人心，也不需要立刻追求。不要一廂情願認為自己可以在不切實際的短時間完成目標。妥善規劃退休生活、遺產、學費，甚至是基金會或慈善事業。


    改變世界的人和企业都會思考五十年和人生傳承計畫。日本企業發揮「改善」精神，建立二十五年至五十年的未來規劃。豐田汽車思考人類社會數十年的發展。明治維新則是長達一百年的計畫。許多偉大的願景家和億萬富翁制訂超過生命長度的計畫。很多人高估短期的成績，卻低估一生的成就。從現在開始規劃，贏在起跑點，就能實現偉大且鼓舞人心的願景和目標，也不必負擔立刻實現的壓力。你可以尋求指引，制訂睿智的策略，拒絕不重要的瑣碎工作。有趣的是，長期計畫通常可以協助我們完成短期的目標和理想。長遠的計畫包括價值成長、下定决心成為世界富人，或者像馬斯克一樣移民火星。


    # ## （三）四個重要的財務基石


    這四個重要的財務基石可以讓你能從「控制個人財務」提升至「生活富足」。聰明人會立刻改變現況，瞄准重要的目標，引導自己提升財務基石的層次，追求富格和金錢。'
  merge: -1
  img_proc: true
- pgno: 440
  md: '# 一、穩定生活


    擺脫債務後，我們進入第一級的財務基石，用資產收入達到收支平衡。我們雖然可以生活無虞，但尚未享受富足。計算基礎生活支出，包括食衣住行、家庭開銷、水電瓦斯和必需品，但不可以增加其他項目。只要仔細精算，就會發現基礎支出其實非常少，絕對能夠達成目標。


    # 二、安全生活


    第二級的財務基石就是安全生活，你擁有資產創造的收入。相較於第一級，第二級的生活讓你享受假日旅行的樂趣，汽車、電視、網路和零用錢。你當然可以得到合理的生活水準。但是，在這個階段，我們還不能過度享受成果，必須謹慎注意金錢。將第一級的穩定收入提升五〇%，建立安全生活，你可以自行決定增加或減少十五%。


    # 三、自由生活


    你可以用資產創造的收入，實現理想的生活方式，享受旅行，讓孩子就讀好學校，購買奢侈品，不再為錢擔心。到了這個階段，你可以成為「生活風格的創業家」，經營一間「生活風格企業」。你還不算是發大財，但已能將第二級的安全生活收入翻倍提升。


    # 四、富足生活


    到了第四級，你可以隨時間地和任何人一起享受任何事物。更棒的是，你根本不需要支付任何費用，被動收入就足以照顧你的生活，甚至持續成長。你實現富足的生活，'
