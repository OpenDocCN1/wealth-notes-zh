  md: '# 信念從何而來


    以下各種條件，或多或少對你的信念有至關重要的影響：


    +   家庭。

    居住環境。

    經濟和政治環境。

    學校。

    啟蒙導師和學校老師。

    宗教、信念和靈性觀。

    朋友。

    媒體。


    你曝光在這些元素的程度，將影響你的信念。你可能會把某位朋友的觀點或媒體報導，看成非常有說服力的證據，最後形成特定的信念。某個單一事件或連續事件帶來的喜悅或痛苦感受，也會造就你的信念。你的信念最後變成了現實。

    所有的外部環境塑造你信以為真的觀念，但這些信念和觀念並不真實。

    雖然一眼看見為憑「沒錯，但光是一看見「不足以建立正確的信念，因為你無法看清事物的本質，而是看見你想看見的一面。'
