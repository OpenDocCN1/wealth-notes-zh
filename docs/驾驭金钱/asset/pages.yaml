  img_proc: true
- pgno: 443
  md: '步驟一：沒有這個東西，我還是過得去嗎？


    步驟二：我可以買折舊率最低的二手貨嗎？


    步驟三：我可以把它變成一項資產嗎？


    步驟四：在它貶值前，我有可能把它賣掉或拿去交換別的東西嗎？


    步驟五：最低成本的做法是什麼？


    幾乎任何物質都可以用上述五個步驟來衡量，包括一些保值的物品，像是車子、手錶、包包、珠寶、衣物、家具、電器用品，甚至假期和旅行。


    # 消費的機會成本和十五年的意義


    許多花費或投資的資本，都會產生潛在的「機會成本」，也就是可以創造更好收入的成本。很多人會思考投資成本，卻忽略消費時的機會成本。你會在稍後的文章內容中看見資本儲蓄足以創造的驚人複利效應，請在花錢時考慮這些因素。如果你更進一步思考錯誤的消費在十五年後造成的損失，其數字之驚人，會讓你明白小額的儲蓄也會相當可觀。


    # ② 儲蓄


    儲蓄是理財的第一階段，聽起來非常簡單，但許多人依然做不到。儲蓄是建立財富'
