  md: '粗塑身衣。時至今日，原本看似瘋狂的觀念也變成完整的全球品牌產品。二〇一二年，布萊克麗名列瑞士的億萬富翁，她的公司預估可達兩億五千萬美元營收。珍妮佛·泰芙（Jennifer
    Taft）看見兒子拍打柔軟的玩具，想要將玩具當成枕頭，孕育寵物枕頭的想法。讓人抱在懷裡的寵物枕頭就此暢銷。


    二〇一〇年的銷售量為三億美元。五十歲的喬爾·吉利克曼（Joel Glickman）一直在自家的塑膠工廠工作。有一天，他開始剪裁塑膠吸管，產生KOOV積木玩具的雛形概念。孩之寶和美泰爾玩具工具拒絕吉利克曼的提案，他決定挪用自家工廠的塑膠射出工具，自行生產玩具。


