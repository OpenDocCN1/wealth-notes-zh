    - 找工作。

    - 與他人分享偉大的願景，並且鼓舞他們。


    你雖然可以認為，這就是短視近利和眼光長遠造成的差異，但我相信其中的內涵更


    +   - 在對方心中建立自己的地位。

    - 確實展現自己的熱情。

    - 吸引推廣者，或者讓推薦者建立你與對方的關係。

    - 讓他們知道你也是廣大person間網絡中的一份子。

    - 展現你的魅力、吸引力以及鼓舞他人的能力。


    只要能夠將你的人際關係視野，從「第一層人際分隔提升至第二層或第三層，以'
  merge: -1
  img_proc: true
- pgno: 102
  md: '為深刻，具備更多策略性質與槓桿效果原理，用吸引力取代排斥力，用拉力取代推力。倘若你可以確實看見人際關係的六度分隔聯繫，就像一張具體存在的心智圖，你的積極心態、吸引金錢的名聲以及品牌價值，都能夠藉由六度分隔人際網絡發光發熱。雖然我們無法用肉眼看見人際網絡，不代表它不存在。


    # 最好的收入就是給予


    給予可以創造空缺，而自然世界與金錢都會填補真空，因此你的給予反而得到更多。給予加速金錢的流動速度，你的收入速度也會提升。給予扭轉了儲蓄停滯，不再阻礙個人和全球經濟成長。只要提升金錢與貨幣的流動速度，你就能夠創造全球貨幣的升值。


    為了加速個人金錢流動速度、提升個人經濟成長，並且賺取更多現金，奉獻更多。你必須深刻地相信，世上擁有富饒的金錢。倘若你相信世上的金錢供應有限，或者你賺錢的能力有限，就會小心翼翼地守著金錢。如果你認為自己的財務狀況受到經濟環境的影響，你就會陷入困境。


    上述的恐懼、匱乏和過度節儉的心態，將會關閉你的金錢供應大門，因為你的收入取決於付出。不願給予，就沒有收穫。你必須妥善儲蓄，而不是囤積，這就是金錢的矛盾。'
  merge: -1
  img_proc: true
- pgno: 103
  md: '盾祕密。你需要妥善分享，但不能過度支出。你還要公平收費，不可貪婪。你要照顧自己的需求，同時關心其他人的需要。


    任何極端的行為都不會長久，也會破壞金錢的自然流動與速度平衡。金錢始於心靈，金錢觀念決定你的用錢藝術。這本書的重點不只是賺錢的技術，也包括賺錢的心靈法則。


    # 景氣的繁榮衰退循環


    經濟景氣就如同四季，都有週期循環。個體經濟和總體經濟會循環，全球、國家與個人經濟也會循環。為了達成均衡與秩序，循環是生命和金錢的自然律則。


    年輕的時候，我希望天空永遠放晴，不要下雨，也渴望學校的飲水機提供可樂（我是可口可樂派）。雖然無知天真，但許多人確實對金錢、循環與經濟都懷抱著「我希望自己只有美好的夏天，不會面對險峻的冬天」的心情。他們也用相同的態度看待景氣繁榮衰退循環，認為景氣只會往一個方向發展，或者避免衰退，下一次就能改變結果，也許控制得宜，就能保持相同的良好狀態。


    但是，金錢和人類必須經歷自然循環過程。全球經濟與個人經濟，都無法永遠保持一致穩定的成長。風險和報酬緊密相關，就'
  merge: -1
  img_proc: true
- pgno: 104
  md: '像恐懼和貪婪一樣一體兩面。


    經濟景氣樂觀的牛市，人察覺機會，傾向於追求成長（因而變得貪婪）。經濟景氣悲觀的熊市，人趨於保守。人的行為不會永遠一致，因為我們並非基於邏輯或線性思考而行動，而是在可預期的範圍內，依據情緒做決策，產生矯枉過正的行為與情緒反應，也會因此從一個極端，擺盪到另一個極端。雖然宇宙整體依然平衡，但一個地區或國家內部的行為則鮮少保持穩定。


    以邏輯思考的經濟學家忽略了經濟市場的「個人自我」。


    經濟學家不該將「個人經濟一抽離於「整體經濟」之外。經濟學家和政策制訂者想要用理論模型與假設可預測的行為模式，例如談判理論與完美競爭模型，解決經濟市場問題。他們相信經濟市場可以也應該達成可預期的平衡狀態。但他們的想法可能只是錯覺，因為人的情緒勝過於邏輯，而情緒是必要的反應，否則人不會產生情緒。然而，我們可以藉此看出不完美的矛盾之處，因為我們依然追求成長與完美。縱然無法實現完美的競爭與均衡，我們仍渴望如此。完美的競爭不存在，因為有些人作弊，讓另一些人蒙受損失。極端的穩定也不存在，因為我們不知道明天會如何。'
