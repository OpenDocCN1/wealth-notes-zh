  md: '二十%的消費者，帶來八十%的收益。


    八十%的價值，來自二十%的努力。


    八十%的財富，集中在二十%的人口。


    八十%的抱怨，來自二十%的顧客。


    八十%的銷售額度，來自二十%的產品。


    八十%的支出，來自二十%的日常開銷。


    後來，理察·科赫（Richard Koch）推出了一本書，名為《八十/二十法則：事半功倍的成功祕密》。科赫認為：「八十/二十則是高效率人物和組織最偉大的祕密之一。」科赫將帕雷圖的原則帶入現代世界，研究如何在過度工作且生產力低落的年代，創造事倍功半的理想局面。他認為：


    +   ○ 少數的投入能創造多數產出。


    ○ 要重點放在那些會帶來最大滿足的活動。


    ○ 大多數的工作只能創造低價值，必須消除或減少八十%的低價值工作。


    ○ 少數因素創造多數效果。


    ○ 找出關鍵少數——用二十%的付出，創造八十%的結果。


    ○ 在商業世界中，專注在利潤最高的產品和顧客，減少其他工作。


    ○ 少數決策影響多數結果，例如選擇職業、處理債務、投資和經營人際關係。'
  merge: -1
  img_proc: true
- pgno: 348
  md: '• 愈努力不能保證收入愈多，要把精力放在關鍵工作，忽略其他事項。


    我認為科赫提出的原則非常精準。相同單位的時間，無法創造相同的價值。我相信帕雷圖研究財富分配時，找到普世通用的金錢、商業和生活槓桿法則。你可以接納帕雷圖原則，用最少的時間和金錢投資，創造最大利潤，用最少的努力，獲得最多的收穫。大多數的人只能艱辛工作，無法理解什麼才叫做幹事業。他們的受挫，只能慢慢累積成成果。帕雷圖原則就像硬幣，一面是八十/二十，另一面是二十/八十，而且適用於生活的所有領域。


    八十/二十法則的重點不是一努力工作一，而是找到正確的選擇，有效率地工作，才能保存最多時間，獲得最高的時薪，用槓桿效果建立財富和金錢。如果你可以結合八十/二十法則和複利效應，就會得到最可觀的動能。在第二十七章，我們討論時間和金錢的關係時，曾經介紹加總每週收入，除以工作時數之後，計算收入創造價值。


    當時，我們提出的例子是「收入創造價值」（每週）收入/（每週）工作時數」：一千英鎊/五十五小時/每小時十八·十八英鎊


    導入八十/二十法則，八十%的收入來自二十%的時間（另外八十%的時間，只能創造二十%的收入），所以收入創造價值公式產生巨大的變化：


    八十%的收入創造價值/八十%的週收入/二十%的週工作時數


    八百英鎊/十一小時/每小時七十二·七三英鎊'
  merge: -1
