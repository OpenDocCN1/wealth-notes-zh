  md: '在他身上。其實根本與他無關，我並不認識他，卻以為自己很了解他這樣的人。他可能就是我在未來想要努力學習的對象，我渴望賺到和他一樣的財富，實踐夢想，買一輛法拉利。他也許真的是一名毒販，也可能只是試駕或租車一天。他的職業或許是牙醫、心理諮商師或慈善家。或者，他是一名汽車銷售人員，正在載客戶（例如現在的我）體驗法拉利。


    這些都不重要，重要的是你不該擅自以刻板印象評斷他人，就像我當年犯下的錯誤。在本書稍後的篇幅，我也會分享過去二十五年來，我對有錢人的想法轉折。我和將近五十萬位富人分享了現在的每一份信念，我也會在本書裡傾囊相授，我相信你將對其中一些人物產生嚮往。搞不好就是你購買本書的原因。


    當我只要是『第一世界的窮人』，根本不能證明一位法拉利名車的駕駛是怎麼樣的人，因爲我一無所知。現在，我認識很多開法拉利的人，我自己就是其中之一。'
