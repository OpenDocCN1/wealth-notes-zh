  md: '顧自我和他人，達成施與受的平衡，也是計算金錢流動的速度、交易總量、金錢總價值，包括支出和收入。由於金錢是動態的單位，必定保持流動，不會受限於單一交易，金錢價值將會持續增加。我們消極固守財富，金錢價值受限於貨幣單位，倘若願意分享金錢，就能創造千百倍的價值。


