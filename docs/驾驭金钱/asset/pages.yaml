  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_394_0.png)


    # ## 價格和價值


    許多人相信，價格和價值是「先有雞或先有蛋」的難題。如果你的自我價值過低，產品或服務的價格可能也會太低；倘若定價過高，銷售量下跌，你的自我價值也會受損。假設你提升價值，價格並未改變，獲利空間則會減少。擅自提高價格，產品或服務的價值並未增加，導致客戶觀感不佳，你將失去他們的支持。我們應該怎麼處理這個難題？


    # ### 從自己開始做起


    改變自己，就會改善金錢收入。放下過去糾結的罪惡感和羞恥心，原諒自己，也原諒曾經傷害你，讓你生氣的人。停止抱怨，因為他們的程度就是如此，不要責備他們。'
  merge: -1
