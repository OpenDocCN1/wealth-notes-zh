  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_12_0.png)


    # CHAPTER

    第一世界的窮人


    探討金錢時，有一個非常重要的概念分野：「第一世界的窮人」和「第三世界的窮人」的貧富標準並不相同。

    我非常幸運，能夠生在第一世界的家庭，得以擁有充足的水源，不需要徒步三十英里才能找到水。我很幸福，可以接種疫苗，享受良好的公共衛生環境，妥善的健康照護系統，以及（大多數時候）相當公平的資本主義自由市場社會。

    我又是何其有幸，生活安全無虞，可以擁有自己的財產，取用全球網路資訊，並且發揮槓桿效果。生活在美好的家庭、社會和政府環境，擁有如此良好的機會和幸運，倘若我依然抱怨連連，是多麼不應該？如果悲嘆自己的機會不夠，又是何其可悲？在貧困的日子裡，我經常抱怨，我很確定你也是如此。然而，這些行為都會妨礙我們追求財富。人並非生而平等。在第三世界國家，甚至是一些已開發地區，人出生在極度貧困的'
  merge: -1
  img_proc: true
- pgno: 13
  md: '地區，不是因為他們自願選擇或犯錯而受到懲罰。他們注定無法擁有基礎的適宜環境，也缺乏第一世界用來存取線上免費資源的教育工具。


    然而，其他人，包括你和我，以及我們認識的多數人，都生在平等和充滿富裕機會的環境中。除了安全和適宜的生活環境之外，只要具備無線網路設備，我們的網路幾乎是免費的，提供了無盡的資源，讓我們可以提升自我。本書將會經常提到「窮人」一詞，但專門指涉第一世界的窮人。有幸擁有無限機會的人可以也應該幫助第三世界國家的居民，使其擁有公平的機會。倘若我們下定決心，絕對能幫助他們。我們足以變得非常富裕，妥善運用財富，促進平等的機會，裨益自己的生活。本書也會提供相關資訊，教導讀者如何正確地將金錢用於良善。但是，首要之務就是賺錢。請仔細傾聽家喻戶曉的大人物提出的建議：


    > 倘若你出身貧窮，並非你的錯。但如果你死於貧窮，就是你的錯。


    比爾・蓋茲'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 自由市場和機會之地


    ![](img/a9d3aeae93c5ae3f9baf5963e137b74a_14_0.png)


    我認為，在已開發世界和資本主義社會裡，你坐擁一座非常有效率的金錢貨幣系統，足以創造（幾乎完美的）公平競爭與自由，可以創立你的事業，而先決條件就是充足的利潤與成長空間。


    當然，馬克思主義者會挑戰我的觀點，但我會更进一步地挑戰他們，因為我相信就算是最忠誠的馬克思主義者也會同意我的想法。許多人抱怨大環境不好，「經濟系統」不公平，時機不對或風險過高。


    他們用稅賦、貪婪的企業和大人物，以及其他外部因素作為理由，解釋為何無法創立自己的事業或賺到更多錢。


    我們享受自由市場，我個人也非常感激能夠在這個環境中成長，自由市場是一座經濟系統，各家私人企業藉由無限制的競爭而決定市場價格。買賣雙方都有競爭能力，而'
  merge: -1
  img_proc: true
- pgno: 15
  md: '且受到激勵，可以在不受干預的情況下完成交易，只有供需法則和公平管制足以影響自由市場。


    企業喜歡也需要一座自由市場，他們才可以創造無限制也不必繳交回收款的利潤。


    自由市場的核心理念相信，供需決定價格，市場的需求會導致價格上揚或下跌。


    自由市場和自由價格系統，讓全球各地的消費者和你，都可以買到各式各樣的商


