  md: '# 信念和它們的起源


    信念就是我們信以為真的事物。信念會驅使你贊成或反對某些事物。它們就是你判斷事物的道德準則。


    信念是存在於我們內心深處的想法，幾乎沒有任何方法能讓你大張旗鼓地表達你的信念，除了金錢。


    金錢的價值受到普世認同，不但把所有人類連結在一起，也會影響眾人的生活。一金錢使人變質—其實是種迷思，金錢純粹只是放大我們的性格而已。金錢只會讓我們的特質變得更為顯著，而且總是如此。


    如果你的金錢觀與其他信念有關，金錢就會放大其他信念。倘若你決定致力於偉大的目標，就會吸引更多的金錢捐贈，然而，假設你嗜物成癮，金錢也會讓你更惡化。'
