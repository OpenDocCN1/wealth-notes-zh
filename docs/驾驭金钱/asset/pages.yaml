  md: '# 感澈和欣賞的力量


    ![](img/a9d3aeae93c5ae3f9baf5963e137b74a_294_0.png)


    感澈具備強大的能量，可以提升你的良知意識，「不知感澈」則會降低良知。無論何時，只要你無法對自己給予或接受的恩惠心存感澈，那就意味著你的發財之路被阻擋了。


    其他人看見後，會認為你不值得信任、不在乎、不知感澈，或者不重視自我價值，換言之，這會降低你的吸引力。


    欣賞（appreciate）來自拉丁文 appreciate，意指「設定價格」（set a price on），讀者也可以參考估價（appise），意思是「提升價值」。


    從字義學來說，你感謝的事物，其價值將會因而提升。藉由感謝其他事物，你自身的價值也會上升。感恩是一種更為精細複雜的情緒，來自於欣賞。即使生活發生的事件，乍看之下很像挑戰或問題，只要你心懷感澈，就會因此成長，甚至培育非常良好的態'
  merge: -1
  img_proc: true
- pgno: 295
  md: '度：「成功代表收穫，而艱困的挑戰則會讓人學到一課」。無論我們有無賺到錢，是否遇到挑戰，都要心懷感激。只要態度正確，迎向挑戰，我們都可以欣賞自己賺錢的財富，以及失敗所帶來的成長。


    只要用感激和欣賞的眼光看待世界，結果很難會是負面的。


    為了實現最大的致富潛能和延伸效益，你必須學會感激所有一切，而不是只接受自己想要的結果。


    戶頭有錢匯進來，要感激很容易，但如果是要付帳單或開銷，你又會怎麼想？如果你繳帳單或支付開銷時，表現出憤恨和不知感激的情緒，你也會收到同樣的情感回應。


    請善用本書先前提到的「財富真空原則」。即使你無法欣賞他人或自己的行爲，也要懂得釋懷，因爲憤怒與悔恨都會迅速填補情緒的真空地帶。


    從現在開始，向全世界釋放新正能量。無論何時，只要收到帳單或發票，都要心懷感激，因爲其他人一定非常高興。他們將產品和服務賣給你，收到你的錢。你的消費創造了一個真空地帶，金錢很快就會補上去。他們信任你，有信心投資你，你應該對此報以感激之情。


    你促進了經濟成長，提升個人國內生產毛額。你儲存了他們的善意，未來將變成真實的回報。放下不滿的情緒，記得產品或服務帶來的價值，用欣賞和感激支付帳單。'
