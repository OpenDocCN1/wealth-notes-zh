- pgno: 250
  md: '來最有錢的富人。《財富之書》共有十卷，只發行了四千套，一八九八年時，一套要價兩千五百美元。班克羅夫特將書賣給美國歷史上非常重要的富裕家族，例如摩根（Morgan）、羅斯柴爾德（Rothschild）、洛克斐勒（Rockefeller）、范德比（Vanderbilt）、甘迺迪、卡內基、佛里克（Etc）和福特。


    我非常尊敬這本書，以及我效法的所有前輩。《財富之書》提到西元一九○○年之前的鉅富，他們都創造了可觀的財富，考慮到通貨膨脹，其中一些巨人其實是現代世界的億萬富翁，而書中談論的重點摘要就是：擴展服務價值、建立充裕的物質、提升財富和金錢的智慧。在過去六七百年來，鉅富擁有三項共同特質。《財富之書》已經問世將近二百二十年，在這段時間出現的鉅富也具備相同的特質。我開始累積個人財富之後，發現自己慢慢形成了類似的特質。我看見自己的改變，逐漸養成鉅富的習慣，一部分是因為教育，另一部分則是基於成功致富和實現命運的渴望。


    # （一）所有的鉅富都註定要替許多人服務


