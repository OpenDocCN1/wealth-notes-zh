    但是，在其他條件不變下，你可以發揮金錢的槓桿效應，增進幸福，也能夠從事讓你快樂的各種活動。


    我曾經窮到一無所有，也曾極為富有，我可以告訴你哪些事物會帶來幸福。如果生活裡的其他好壞條件不變，擁有一輛法拉利，絕對會比擁有一輛生鏽的中古車更快樂。

    —金錢無法使你快樂—之所以成為全球流行的誤導用語，是因為他們假設人們只會用錢追求快樂，並且捨棄其他自由且免費的事物（雖然實際上仍會造成金錢支出）。


    # 生命最美好的事物都是免費？


