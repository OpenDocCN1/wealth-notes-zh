  md: '# 資本主義就是慈善事業


    所有的善心捐款或服務，都是由資本主義提供資金，因此，所有的善舉都屬於資本主義。如果你希望捐款，或者在慈善機構擔任志工，你會需要大量的錢、成功資本家的幫助，或是創造收入的資產，才能擁有空閒時間，奉獻社會。


    你擁有的一切無法決定你的人生；你付出的一切，才能決定你的人生。


    能夠結合追求財富的欲望和強欲奮鬥的使命，是一種偉大的力量和特權。比我們更偉大的理想，使我們成長、吸引其他人，讓我們更有吸引力。


    如與你想建構巨太的財富，應該立刻追求偉大的理想。不要等到發財後，立刻追求理想能夠創造更多力量。其他人發現把錢交給你，也會幫助其他人事物時，你會獲得更強大的財富能量。發揮資本和財富地位的良善價值。


    財富和偉大的理想結合，經由智者之手，可以建構文化和任何形式的大師作品。我們現在能夠親身經歷和體驗的偉大壯舉，都是資本主義和慈善事業的平衡結果。


    許多人因為內心的空缺而追求理想和慈善事業。歐普拉童年遭到虐待，索羅斯經歷納粹占領德國並且逃出布達佩斯圍城行動。他們結合資本主義的財富和慈善事業的壯


    邱吉爾'
