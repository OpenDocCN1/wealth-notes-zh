  md: '主管、運動員的偉大團隊成員、偉大的導師、教練和顧問、會計師、稅務顧問、德高望重的前輩、啟發靈感的慘思或精神治癒者。


    一個人的社交網絡就是他的個人淨值。你與個人網絡的關係決定槓桿效果可以創造的金錢價值。


    # 影響成功的關鍵因素，包括長期的人際關係，以及個人創造的信任善意，才能建構理想的社群網絡槓桿，協助實現願景理想。你替商業社群網絡帶來愈多商機，藉由提供就業機會或承擔合約，讓他們賺到愈多金錢，你也替自己創造更多的財富。


    房地產是我經營的投資事業之一。想要購買和管理房地產，你必須妥善管理中介商、過戶公證人、商業律師、銀行、私人融資者、聯合投資夥伴、商業融資者、經紀人、建造商、租賃仲介、房地產仲介、裝修團隊、商業顧問、其他百萬富翁和億萬富翁、稅務專家、會計師、商業合作夥伴、員工、專業顧問（行銷、公共關係、銷售、設計、科技等）與其他專業人士共同發揮的槓桿效果。


    你不需要具備所有知識，或者知道所有問題的答案。你必須建立最棒的工作人際網絡，因為這是追求最好結果的最短路徑，也最輕鬆。


    建立自己的人際網絡，就像增加喜歡的收藏品。即使花費三分之一的工作時間去建立人脈，都是非常值得的投資。


    最傑出的人才也曾經體驗過各種問題和痛苦，找出解決方法，並且提升自己的層'
