- pgno: 444
  md: '的基礎，也是甜美果實的種子。除此之外，儲蓄也能讓我們理解建立財富的基礎重點，例如延後享樂、紀律、眼光放遠，妥善管理金錢才能吸引更多財富。但是，扣除複利效應，儲蓄本身沒有辦法創造財富或者實現你的生活願景，所以只是第二層技巧。儲蓄的問題就是難以完全實現所有的益處。


    以下是儲蓄的力量，但讀者也可以發現，光是儲蓄，並未使用第三層的技巧，效果其實非常有限。馬修．華森（Matthew Wason）在我的社群網站中曾經提出一個問題，他說：「羅伯，根據複利效應，如果我每個月儲蓄三百英鎊，一年就是三千六百英鎊，但銀行的利率很低，複利效應要怎麼發揮作用？」我的答案是：「馬修，沒錯，第一年只能存三千六百英鎊，假設銀行的利率比通貨膨脹率高出2％」：


    +   * 第一年結束：三千六百七十二英鎊。

    * 第二年結束：七千四百一十四、四四英鎊（加上一整年的利息）。

    * 第三年結束：一萬一千二百三十七、七八英鎊

    * 第四年結束：一萬五千一百三十五、五四英鎊。


    +   * 第五十年：四十三萬八千五百八十五、五英鎊。


    你可以看見複利效應如何創造驚人的滾錢速度，投資愈久，力量愈強。除此之外，


    你也能注意一開始的小金額，就算利息只是從2%變成3%，也會造成重大差距。但複'
