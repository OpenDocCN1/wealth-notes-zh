  md: '量化寬鬆，並且擔任經濟系統的最後一道防線，許多民眾將會蒙受極大的損失，經濟衰退也會維持更久、影響更深，並且更加艱鉅。


    七、金融交易手續費提高，金流速度變慢


    倘若失去了政府、中央銀行以及法院的管制與介入，金融借貸業將會吸引各式各樣的亡命之徒，根本沒有足夠的能力管理金錢。由於金融交易的風險提高以及缺乏發展規模，交易手續費、利息以及附帶條件也會大幅提升。許多人可能會因此頓失生計！


