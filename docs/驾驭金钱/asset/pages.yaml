  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_125_0.png)


    # 資本主義和槓桿效果


    資本主義雖不完美，但確實是一個有效的系統，用利潤作為動機，在自由市場中創造公平競爭。資本主義也是一種競爭機制，應對不穩定的未來，量化評估勞力，穩定勞力價值，進行公平迅速的交換。


    資本主義的基礎是資本和資產的私有權，能夠自由製造產品且提供服務。資本主義的對照是由中央政府負責控制生產和財富分配。生產行爲是一種志願交換，部分受到公平競爭、公平交換、供需市場，以及反壟斷法的管制。資本主義代表自由累積資產，我們可以自行決定投資，不需要經過國家管制。就業市場受到工資的影響。稅收則會分配在國家需求。


    在經濟衰退、崩解和蕭條期間，資本主義有時會遭到批評，批評者通常是不珍惜或無法理解金錢價值的社會主義者、共產主義者，以及追尋自由的放任自由主義者。凱因'
  merge: -1
  img_proc: true
- pgno: 126
  md: '斯曾說：「資本主義是一種駭人聽聞的理想，他們相信最可怕的人為了追求人類的最高理想，會做出最可怕的事情。」


    儘管如此，哪些經濟系統能夠如此均衡而有效地連結個人利益與全體人類的福祉？資本主義是一種非常有效（但不完美）的論功行賞制度，可以激勵企業家和創新者。他們創業提供工作機會和金錢，平等照顧自己的利益和其他人的福祉，並且繳交稅金，支持社會共同需要的基礎建設和服務。


    或許，社會主義和共產主義的最大缺陷，就是無法鼓勵論功行賞和成長，企業家缺乏追求成長和服務他人的動力，因為他知道自已不會因此得到公平的財富分配，也沒有利潤作為刺激。


    倘若市場不自由，交易也無法流動和成長。然而，資本主義也夠鼓勵人民追求權利與和平共處，因為人性同時具備自私和人道的特質。


    回顧歷史，我們就會發現即使最閒逸的非資本主義系統，擁有權力的少數人宛如獨裁者，行為則像極端的資本主義者。許多人忽略了一「社會福利」是一種非常有效的財富再分配。


    社會福利是社會主義的觀念，但基礎則來自於物質帶來的金錢。


    資本掛帥的錢流建立了道路、醫院、警力系統、醫療照護系統、水利資源系統、衛生處理系統，並且照顧弱勢族群。'
