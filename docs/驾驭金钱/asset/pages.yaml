    # 非金錢交換


    金錢轉手時必定有交換過程，但不只是金錢交換，也包括概念、能量、啟發、服務、解決問題、帶來期盼、資訊、知識、智慧、時間、債務、債權以及良善的意圖，我可以繼續列舉各種例子，但我相信你已經知道我的意思。在金錢交換中，人並非單純蒙受損失，反而得到更多。如果付出金錢者，以上述例子的形式，得到同等的價值，就會覺得這是公平的交換，而且非常有價值。這種想法可以深入人心，逐漸茁壯。倘若付出金錢者認為收穫低於付出的價值，就會認為這場交易並不公平，在極端的例子中，也會相信'
