  md: '# 減輕痛苦法則（The Law of Lesser Pisses）


    關於自我價值和人際關係，我非常喜歡導師約翰博士（Dr. John）提出的「減輕痛苦法則」。他相信：「在惹怒他人和惹怒自己之間選擇的話，永遠都應該選擇惹怒他人。因為生命充滿過客，只有你會陪自己走到最後。」


    保持堅定的態度，就沒有人能夠惹火我們。絕對不要讓他人決定你的自我價值。他們不理解你，不清楚你承受的經歷，也不明白你為什麼會成為今天的模樣。我們必須避免陷入消極攻擊和過於沉溺的情緒，否則就會承受許多毫無必要的傷害。


    # ● 知識和經驗


    許多人自信滿滿地認為，只要得到知識和經驗，就可以改善一切。雖然上述說法無誤，但我們不可以等到自己擁有一切之後，才開始增進自我價值。因為我們不可能擁有一切，也沒有辦法完美安排所有事物。


    先求有，再求完美。只要願意學習，努力改善自己，得到更多經驗，自我價值和自信也會逐漸成長，但這個過程非常緩慢，也絕對不是唯一的方法。


    我們可以提高學習知識和經驗的速度，並且立刻找到最重要的內心價值。提升自'
