  md: '素具備不同的功能、優缺點、以及內在循環的高潮與低谷，也可以彼此照應，達成平衡。只要能夠維持平衡，發展三種不同的金錢類別，就可以創造更多金錢，在你周圍建立堅強的堡壘。你擁有更多資產，也能夠照顧更多人，例如一位房地產物業主，可以聘請更多仲介商，讓裝修團隊、水管工人、瓦斯安全工程師、維修技術人員還有其他人得到工作機會。


