  md: '仰賴你的付出，才能順利進步演化。「啟蒙後的自利」就是一個相對應的觀念。你的服務能力愈好，替社會解決愈多問題，問題的規模愈大，你的人生也會得到更多財富和幸福。比爾．蓋茲創業的願景不是「創造我的個人電腦」或「治癒一名小兒瘧瘴患者」，而是將眼光看向全球。


    銷售就是服務他人，讓買家在公平交易的條件下，獲得自己想要的價值。銷售必須關心買家，用產品提供功能和價值，藉此交換金錢或其他收益。銷售必行爲必須重視買家，並且提供價值。賺錢只是銷售行爲的自然結果，也是一種服務。我們藉由公平銷售交易，促進整體經濟發展，獲得金錢收益。他們用價值和金錢購買產品或服務，也增進他們的個人國內生產毛額。


    所有的服務行爲都會創造更繁榮的經濟市場，提供更多服務機會。服務不是單向的，並非銷售者服務買家、員工服務雇主，或者家長服務孩童。服務是一種雙向行爲，可以促進經濟發展和人類進步，但也可能造成反效果。


    足球員服務球隊的方法就是得分、救球或助攻隊友，也能因此獲得獎勵。他們不是平白無故拿到每週三十五萬英鎊的收入。他的薪資、贊助和肖像權利金，來自他對球隊、教練和支持者的貢獻。如果球員沒有辦法完成高水準的傳球、防守、得分或助攻，就可能得到良好的薪資。他對球隊的貢獻會直接影響球隊的戰績和薪資。如果其他球員提供的價值和服務較差，他們的薪資就會更低，倘若其他球員提供的價值和服務較好，他'
