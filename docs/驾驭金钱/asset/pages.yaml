- pgno: 286
  md: '# 健康和幸福


    活久一點吧，享受生活，好好照顧自己，因為生命就是最好的資產。


    > 勤加運動，定期健康檢查，確保自己生活是健康的。「健康就是財富」這句話非常正確。


    請容我提請各位讀者，巴菲特提到自己可以創造巨大財富的三個主要原因：「第一，我住在充滿機會的美國。第二，我的基因很好，健康長壽。第三，複利效果。」


    你可能無法控制基因，但如果你負責面對生活，可以改善健康狀況。追求財富時，不要像少數的富人一樣不把健康當一回事，之後才開始後悔。


    # 結合熱情和專業，職業和假期


    做你所愛，愛你所選。不要浪費時間賺錢，卻沒有時間享受成果。我相信維持財富、


    ![](img/a9d3aeae93c5ae3f9baf5963e137b74a_286_0.png)'
