  md: '# 娛樂


    數個世紀以來，人們花錢享受娛樂。中世紀和文藝復興時期，貴族或王室成員通常會聘請小丑娛樂客人。小丑也是市集常見的表演藝術家。我們強烈渴望娛樂，就像追求資訊和教育。任天堂推出
    NES 主機之後，成為全美坐擁第七大客戶群的公司，光是這臺主機就有三千九百四十萬名用戶。一般家庭認為 NES 是孩童喜歡的產品，相對應的周邊，例如 NES
    手把則協助延長主機的壽命。


