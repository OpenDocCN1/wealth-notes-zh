  md: '• 你的每週收入增加兩百七十英鎊，每週工作時間減少三十三小時。


    • 你的五十年收入增加七十萬兩千英鎊，五十年工作時間減少五萬三千五百八小時。五萬三千五百八十小時就是六年又四十二天。


    請注意，上述的金額並未計算通貨膨脹，而且你必須有紀律遵守槓桿效果、八十／二十法則和複利效應。曾經有人批評我，認為這種時間觀點過於市儈。我完全同意他的說法，畢竟這是你自己的人生。


    但是，我們的人生都在倒數，剩餘的日子可能也不多了。我們應該更重視時間，堅持採用高效率工作法。


    有錢人的時間觀念就是如此，他們也妥善投資時間，創造財富。學習這種方法很簡單，只是即便這方法很完美，還是會浪費時間。所以我只有提高兩倍的高價值工作。


    一開始，我們會習慣性地抗拒，需要透過練習才能適應。然而，時間是最珍貴的資源，也是最重要的資產。如果我們不願意將時間投資在關鍵成果領域、收入創造工作還有更多自己熱愛的目標，就會成為其他人的賺錢傀儡。倘若你不讓生命處理最重要的目標，時間就會被低價值的瑣碎工作占據。'
