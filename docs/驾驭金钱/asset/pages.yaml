  md: '理、營運管理者、管理總監甚至執行長，還有其他類型的工作夥伴，例如承包商、顧問和特聘專業人士都希望在這個關係中發揮自己的槓桿價值。


    想要建立有效率的人力資源槓桿，善用其他人的時間和專業技能，最好的方法就是重新檢視你的收入創造價值。在待辦工作清單中，只要任何工作的價值，低於你的收入創造價值，就應該委任辦理。


    用任何方式，包括現金或三十天短期支票支付薪水，讓自己得到時間，處理真正有價值的工作。


    許多中小企業家都會面臨相同的困境。他們認為「我可以做得更好」、「我沒有能力聘請員工」、「我不想聘請員工」或者「我必須讓其他人知道我很努力工作」。沃爾頓剛創業時也是如此，但現在沃瑪超市聘請超過兩百萬名員工。賈伯斯創業時和另外一位史蒂夫在車庫創造了蘋果電腦的第一個主機板。蘋果電腦公司現在的營運基礎建立在賈伯斯創造的不朽傳承。


    一九五四年，迪克（Dick）和麥克（Mac）兄弟開了第一間麥當勞。一年後，麥當勞成為連鎖餐廳。雷·克羅克（Ray Kroc）才是關鍵的願景家，讓麥當勞成為聘請一百九十萬名員工的大型連鎖餐廳，每日收入高達七十五萬美元。


    即使你不想創立如此浩大的事業，請記得，他們一開始都只有一名員工（或者孤軍奮戰），也曾猶豫是否應該聘請員工，推動成長規模。'
