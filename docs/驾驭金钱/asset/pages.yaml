  md: '紀人。


    # （七）忽略那些討厭我的人：


    總是會有不欣賞或討厭我的人。我會傾聽那些意見，並且持續改進。我會對所有批評都心存感激，並且往前邁進，不讓這些批評影響我的心情、夢想或傳承。我要走自己的路，不被他人羈絆。我會對所有事物心存感激，不管是好的或是困難的。


    # （八）總結：


    努力不懈。保持耐心、擁有信念，並且努力「聰明」的工作。每天都用座右銘和視像來提醒自己，平衡現實和樂觀主義，讓這一切成為我的動力。付出多少，就會得到多少，然後將得到的事物分享給他人。創辦一座藝術學校或基金會。讓其他沒那麼幸運的人也能擁有創意的出口。讓我的學生知道藝術不能只是藝術，而要像安迪·沃荷那樣讓人看得懂。藝術創作沒什麼不對，我也沒什麼不對，我必須堅定地相信著。我並非一無所有，所有我想要的、我做的、我擁有的都以俱足，等待著我的解放。


    這就是你，成為真實的自己，別像當藝術家那時的我一樣。釋放你對喜愛事物的渴望。與世界分享你的關心和服務，堅持下去，創造自己的故事和金錢觀。對錢了解更多、賺更多錢、付出更多。'
