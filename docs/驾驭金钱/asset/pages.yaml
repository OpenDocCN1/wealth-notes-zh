    Leggett）和伯尼．馬多夫（Bernie Madoff）2 的所作所為。我們都會說服自己相信偏見。


    六、貪婪和恐懼：人傾向於極端思考，總是過度悲觀或樂觀地評估事態。貪婪和恐懼駕馭了市場發展，使其如鐘擺般走向極端，再轉向另一個極端（而不會停滯於中央地帶），因為市場與金錢的功能就是服務人性，而情緒是人性的表達方式。索羅斯以「反射理論」解釋這種現象。反射理論強調市場因素與效應之間的循環關連。因素與效應建立了一種特殊的因果關係，彼此互為影響，無法區分何者為因、何者為果。在經濟學領域中，反射理論強調市場投資人的情緒會產生自我增強，最後影響市場發展效應。例如價格上揚導致投資人繼續買入，讓價格持續上漲，最後使市場難以自我維持（過度繁榮），於是產生完全相反的逆效果，造成衰退。


