- pgno: 10
  md: '於是我們又去了酒吧。


    那一天我的評語展現了我人生態度的新低點，也流露了我注定會負債的金錢觀，導致的變成尖酸刻薄，對人充滿歧視。我曾經是一個心胸開闊、毫無設限的孩子。青少年時期，我也被教導要珍惜辛苦賺來的錢，甚至懷抱偉大的夢想，想要用腦海的各種概念賺錢，現在卻變得充滿嫉妒的失敗主義者。我刷爆的信用卡、連比爾·蓋茲（Bill
    Gates）的皮夾都裝不下，而他代表了人們對富裕的刻板印象。


    最糟的是我根本不丁了解法拉利的主。這句話總結了世界對金錢的錯誤觀念。甚至，總結了富人和窮人之間的鴻溝，但不是能力差距，而是心態差別。詭異的諷刺生活依然繼續，到了三十歲出頭，我成為了百萬富翁，而我購買的第一輛法拉利，正是羅莎紅的1986蜘蛛跑車。就像我當年批評法拉利車主一樣（搞不好他的車只是租來的而已），你要批評我前，先和我一起回顧一下這場旅程，我出身在一個非常良好的金錢教育環境，卻一度陷入債務危機，最後好險能保住財富。


    我的人生可能和你的故事有些相似。我曾經貧困，也曾富有，你可能也是。我賺了大錢，亦曾慘賠，也和您一樣。我白手起家，但其實大家呱呱墜地時都是一無所有。我對金錢產生的所有負面想法，正如第一世界國家的窮人（詳情請見下一章）會有的想法，生活在英美等第一世界已開發國家的人所面對的挑戰以及享受的機會，我也都有。


    在那一刻，我批評那位開跑車的人，其實是將我個人的觀念、信仰和態度，都投射'
  merge: -1
