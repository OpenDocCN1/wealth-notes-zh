- pgno: 445
  md: '利效應需要經年累月的付出，即使到了第五十年，每個月三百英鎊的儲蓄也只能獲得四十三萬八千五百八十五．五英鎊。假設資本總值的每年被動利潤為五％，代表五十年後，儲蓄金額可以讓你得到一年兩萬一千九百二十九英鎊的生活費用。但五十年後的通貨膨脹可能會大幅降低兩萬英鎊的價值。根據英國住家價格調查資料，五十年前的英國房地產平均價格是三千四百六十五英鎊，這筆錢現在只能買二手車了。五十年後，這筆錢又能買到什麼？可能只有一個星期的食物或基礎生活用品。


    我們還有增加儲蓄收入的方法以及簡單的策略，讓你享受更簡單的金錢人生。過去十年來，許多身價百萬、億萬的導師，都會教導我：


    # 。先讓自己得到薪水（先投資自己）：


    這是儲蓄、賺錢和創造財富最重要的概念。許多人最後才投資自己。我們獲得收入時，已經先被扣除稅金、國民保險以及就學貸款。等到稅後薪資進入銀行戶頭，又要減少一半，支付房貸、房租、水電費、網路、第四臺、汽車、醫療、生活用品、行動電話、慈善捐款、健身房……你還沒實際用到這筆錢，就已經支出完畢。誰最後才拿到錢？就是你。我們要改變這個狀況。許多人誤以為他們不能支付自己的薪水，因為他們負擔不起。但是，他們之所以無法負擔，就是因為他們總是最後才照顧自己。我們應該準備兩個銀行帳戶。第一個是存款帳戶，第二個是花用帳戶。無論一開始的儲蓄金額多少，收到薪水時，立刻分開處理，我們可以尋找其他方法彌補差額。每個人都有尋找資源的能力，所以立刻投資自己，發揮內心的創意槓桿，建'
