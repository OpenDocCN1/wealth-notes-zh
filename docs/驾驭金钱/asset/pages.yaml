- pgno: 135
  md: '更偉大的目標。蓋茲的想法非常值得效法的，可以用於平衡社會與資本利益。布蘭森也發明了「蓋亞資本主義」，也就是「照顧社會和全球責任，能夠治療地球，也可以長久維持的資本主義」。他抵押了三十億美元的未來收益，決心對抗全球氣候變遷。


    如果沒有資本主義締造的效益，他不能實現理想。各行各業的傑出人士也決定採取健全的方法，創造有社會道義的資本主義，能夠同時保持企業的精神、願景和獲利空間。這些聰明的企業持續獲得競爭優勢，你當然也可以。這些替未來世界設想的道德典範，同時也能善用資本主義的基礎，這點長期以來已獲證明。


    曾經有效創造資本主義槓桿效果的億萬富翁，也見證了資本主義運作良好時，足以發揮美好的社會力量。財富巨人善用自己的力量和影響力，替世界創造正面的改變、維持均衡，分享財富，保持人類進步。


    我發自內心支持他們將資本主義邁向新的「慈善資本主義」紀元，也許你也會這麼想。


