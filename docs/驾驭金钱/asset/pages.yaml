- pgno: 341
  md: '時間不是線性，也不是單純的進位制度，並非所有單位之間都能創造相同的獎勵，也沒有同樣的價值。一旦你設立足夠的動能和複利效果，到後期只要付出極少的心力，就能得到最好的成果。這種情況其實也不公平，但這才是時間和金錢收入的法則。


    只關注於當下這個小時的人，很容易變成月光族。只關注每天的人，則會找到工作，執行管理階級決定的任務，而管理階級則會以一星期一為單位。層次再高一點的管理階級，著重的是每月計畫或年度計畫。


    而最高管理階級則是執行企業主構想的未來計畫和願景，為期三到五年。企業主受到有遠見的人鼓舞，因為這些人可以看見數十年後的發展。而這些有遠見的人則是受到各時代聖賢的影響，他們關注下個世代的人類和地球的永續發展。換言之，一個人的願景和財務收入，其實取決於他是否能夠看見更長久的未來。


    # ○ 無形資產


    每一天，我們都應該繼續建立足夠的動能和複利效應，創造巨大的無形資產。許多人因為無法實際一摸到一事業動能和複利效應，所以放棄賺錢的大好機會。


    還沒看見樹根，就決定放棄種樹。樹根愈深入地裡，就能長得愈高。想要得到甜美的果實，必須孕育強壯且四處蔓延的樹根。無形的資產可以將抽象的觀念化為實際的成果'
