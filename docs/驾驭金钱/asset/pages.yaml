  md: '比爾·蓋茲夫婦採用了這個方法，華倫·巴菲特（Warren Buffett）也加入了他們的行列。追求個人、國家和全球的財富和貢獻時，他們展現了自私與無私的均衡。你想要看見進步，自己就要先進步。從自己開始，讓財富進入你的世界。


    # 反覆無常是良好的商業跡象


    反覆不定是良好的商業跡象，因為這意味著錢移動的速度更快、更自由。經濟衰退時期將出現許多艱難的挑戰，但如果你敞開心胸，那麼危機也會變轉機，因為衰退期容易讓整體問題浮出檯面，獲得一次性的解決。


    錢只是在衰退期間呈現不同的律動方向。越困難的問題越會創造高報酬。你應該未雨綢繆，提前做好準備，迎戰下一次的衰退和危機。逢低買進，發揮槓桿效果，隨時保有購入資金。不只是小額買入，而是強力迎戰，就像英國知名品牌哈洛德斯（Harrods）的年初特賣會那樣！


