  md: '# 一、理想模範


    具策略性地尋找你心目中的理想模範，因為這些人擁有你渴望追求的生活方式。請他們喝杯酒，採訪一下他們，邀請他們參加烤肉聚會之類的，要鍥而不捨但保持禮貌。


    分析他們的習性、習慣和行爲。善用他們已經建立的有效人脈，藉此發揮雙倍的槓桿效果。他們曾經是你的偶像，終究會成爲你的同儕、朋友和商业合作夥伴。你的銀行帳戶數字也會和他們愈來愈接近。你仰慕金錢財富而接近他們，但無須懷抱罪惡感，因爲每個人都是爲了某些原因而結識朋友。只要你擁有足夠的能力，向他們提供有價值的服務，他們也會同樣被你吸引。


    在一九三七年出版的《致富思考》中，作者希爾提到如何在我們的心靈創造一個智囊團。他閉上眼睛，具體想像自己坐在會議桌前，身旁是他仰慕的財富巨人，例如卡內基。他提出自己面臨的挑戰，並詢問諸位前輩的意見。


    當初的我認爲希爾的說法有點「神經病」。然而，我曾經答應自己勇於嘗試所有事物。


    二〇〇五年，我開始學習希爾的方法，並且繼續保持這個習慣。


    我在腦海中的傑出前輩，最後都變成我現實生活中的好友，加入我的人際網絡。時至今日，我們早已共同度過最艱難的挑戰。我知道往後的人生還有更艱難的試煉，然而，即使我孤獨一人，我也永不孤單。我不建議讀者向第一世界的窮人分享這個方法，他們'
