  md: '不滿意，難道別人接受你的抱怨之後，心裡反而認為「我喜歡聽抱怨，謝謝你將抱怨帶到我的人生，請繼續抱怨」？


    我聽提姆·法拉利（Tim Ferriss）的網路廣播節目時，發現其中一位受訪者建議他練習「三十天不抱怨」。這個想法很棒。


    有些人甚至會配戴腕帶，發現自己正在抱怨時，就拉緊腕帶，用疼痛提醒自己，並且重新開始三十天的不抱怨挑戰。我鼓勵各位讀者試試看。三十天很長，足以形成一個新的習慣。完成這個挑戰，或許可以戒除抱怨的壞習慣。戒除抱怨可以形成巨大的改變，影響你的外在生活與朋友，吸引財富，也會對內在的幸福和快樂產生良好效果。


    # ○ 防衛


    如果你必須保衛自己的立場和決策，其實非常浪費精力。在大多數的情況下，你向其他人提出解釋，捍衛自我立場，但其實別人並不想改變心意。他們只是為了爭論而爭論，你為什麼要花時間對抗他們呢？


    無視他們才是正確作法。防衛不只浪費時間，也消耗精力和熱情，讓你無法思考自己的願景。你應該專注地平衡自私和無私，制定公平的決策，對自己和他人都能創造益處，不必在意其他人，任由他們批評吧。'
