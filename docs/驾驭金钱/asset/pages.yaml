- pgno: 378
  md: '鼓舞人心。


    管理領導團隊追求成長時，賞罰不是最關鍵的關鍵成果領域以及管理策略，而是得


    你的團隊應該接納各式各樣的人才與專業技巧，但這些人的夢想和文化觀念是相近的。如果能夠賞識對方的最大優點，他就會展現最好的一面。給予陷入低潮的夥伴支持，挑戰那些快到達巔峰的成員。


    如果你希望提升員工的生產力，讓他們從事有意義的工作，並且更上層樓，偉大的願景能夠讓員工完成驚人的成果。相反的，員工的能力也會超乎他們的想像。


    結合熱情和專業，工作與假期，你和員工之間會更團結，獲得鼓舞和動力。持續修訂徵才策略，隨時關注最優秀的人才。當他們準備好了，就可以立刻聘請他們，當你需要人才，也不必屈就其他人選。至於薪資，必須保持公平；如果你只想付出香蕉，當然只能找到猴子，但超額支付薪資，也會讓員工心生罪惡感，無法專注工作。誠心接納員工的意見回應，讓他們參與策略和願景規劃，誠心贈送禮物，表達善意，慶祝他們的人生大事和生日，還有就職紀念日。關心員工的職場表現和私人生活。讓他們表達不滿和挫折，不要因此產生不好的情緒，他們就會珍惜你的善意。協助他們滿足需求和價值，他們就會是最好的員工。'
