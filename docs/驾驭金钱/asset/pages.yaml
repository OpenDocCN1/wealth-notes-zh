- pgno: 177
  md: '腦的化學反應使你上癮，金錢也會讓你上癮。你經常聽見非常富裕的人暢談金錢和賺錢的事業，就像運動或成癮。許多人因此認為金錢成癮非常惡劣。然而，金錢只是金錢，就像李伯曼提出的定義，金錢只是追求幸福的工具。


    # 想像自己依然一貧如洗


    試想你的餘生都要貧困度日，成為周遭好友的負擔，迫於環境無奈，必須央求他人幫你支出生活費，即便努力工作，也永遠賺不到足夠的錢，不能和自己喜歡的人一起從事喜歡的事物。你必須成為公司的奴隸，就算不喜歡公司，還是必須替討厭的老闆工作。你慢慢成為自己不喜歡的人，未來沒保障，小孩沒有教育基金，沒有退休金，也沒有儲蓄和希望。


    不，這不是你註定要走的路。但是，如果你還在相信第一世界窮人主張的那種似是而非的貧窮觀念，可能就會讓上述某些或全部的情況成真。


    缺錢導致世上許多痛苦，或至少加劇某些痛苦，影響我們的情感生活，甚至成為離婚的主因。


    缺乏金錢使我們無法追求重要的目標，因為所有的目標都需要現金開銷，或者需要金錢才能爭取追求目標的時間和自由。'
