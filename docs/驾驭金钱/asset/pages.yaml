  md: '士，理解不同創業形式的結構和法規，明白相關需求。本書強調的「創業」是指替自己工作。我必須警告各位讀者，創業的最大缺點就是承受更大的風險。較大的風險代表更好的報酬。因為你必須負全責，不能躲在企業後面。你必須擁有多元技能，還要承受好幾個月沒收入，不知道怎麼餬口度日等等。


    創業之路可能非常孤獨，只有你、網路和空蕩蕩的房間。你沒有團隊或能量，也缺乏人力，找不到後盾。你不用面對辦公室政治，但必須妥善管理自己的工作時間，無法享受企業提供的職業培訓計畫。生病或懷孕時也沒有勞保或支持系統。往好處想，創業的人可能不會因為上班的憂鬱心情而生病……


    說完創業的缺點後，現在就要提出它的驚人優點了。有些人注定就是創業家，你可能就是其一。我曾經兩度受聘，其中一位僱主就是父親，但我被開除了三次，真是了不起的紀錄！我非常確定自己不適合當員工。我很幸運能找到創業這條路。你可能也非常熱愛挑戰，不會因為創業的缺點而畏懼，因為你渴望承擔風險。你知道創業的回報非常迷人。你喜歡自由的生活，並著迷於靈光一現的瞬間，更享受事業的偉大成就，所以你願意全心投入。你喜歡親力親為，不願受制於他人。你知道自己可以改變世界，也希望創造不朽的傳承。'
  merge: -1
  img_proc: true
- pgno: 373
  md: '# 創業年代


    有很多誘因會讓你萌生創業的念頭，也或許你已經是位創業家了。面對挑戰，繼續追求成長，不要裹足不前。其中有些挑戰是不變的，有些則會隨時代變動，以下是一些具有突破性的挑戰：


    +   - 光纖網路問世之後，電子商務和網路銷售蓬勃發展。

    - 虛擬實境、人工智能和物聯網科技的急速發展。

    - 地球人口快速成長，一天增加二十萬人。

    - 時間變成最稀有的資源。

    - 無人機和自動化作業取代人力。

    - 政府和退休金制度無法保障我們的未來。

    - 網路縮短世界的距離。

    - 現代世界的流動性和生活槓桿應用，用手機和筆電（雲端系統）就能創業。

    - 創業成本和日常支出持續減少。

    - 金融世界的顛覆發展，例如群眾募資和加密貨幣。'
  merge: -1
  img_proc: true
- pgno: 374
  md: '# ◎善用景氣循環而獲利


    我很期待時勢造就的機會與利益，藉由創業預防風險。在歷史上，人類世界從未像現在這樣緊密相連。然而創業之所以誘人，不只是因為上述的突破性發展。政府需要創業家，並替創業家開創了一條道路，可以打造事業、擴大規模、建立收入，並且迴避風險。你經營一間公司，繳納稅金，創造就業機會，完成重要的國家貢獻。國內建設、交通、健康保險、消防警力都仰賴於創業家的稅金。所得稅和資本稅是創業家的稅金回饋。英國政府幾乎對所有的購買行為課徵增值稅，目前的稅率是二十%。除此之外，企業家必須繳納商業稅、員工的國家保險稅（員工本人也要繳納個人國家保險稅金）、企業稅、個人所得稅、每個員工也要繳納個人所得稅、資本利得稅以及其它的隱形稅金。產出
    BGD 惡劣態度的人不瞭解稅金可以支持地方經濟，促進創業收入。


    身為創業家，我很榮幸能協助社會進步，也十分感謝各地方政府和自治單位提供的減稅機制和保護措施。以下是創業家所持續享有的益處：


    +   有限責任公司制度，讓我們足以承擔一定程度的風險，而且這些風險是由公司承擔，而非你個人。


    +   政府可以杜絕市場壟斷。


    +   讓民眾過得幸福快樂，延年益壽。'
  merge: -1
  img_proc: true
- pgno: 375
  md: '+   ○ 政府降低利息。


    +   ○ 政府提升印鈔量。


    +   ○ 累進稅率、減稅和保障。


    +   ○ 鼓勵創新。


    創業家可以用成本抵稅；員工的薪水則必須先扣稅。


    上述的機制能減少創業風險，保護創業的利潤和生產。如果創業家過度貪婪，政府也會干預管制。政府在企業收入中課徵稅金，協助社會發展。


    創業家在已開發世界中可以享有平衡的機會和管理方式。你找到目標然後創業，努力經營並且平衡風險，政府也會提供減稅服務。你可以藉由合法的方式，用公司處理個人事宜，增加商業成本，減少帳務利潤，藉此節稅。由於企業的稅金是在完成所有成本支出才計算，你可以先購入資產，無須先行繳納增值稅，將原本應該繳納的金額投資在其他事業，藉此獲利，再繳納稅金。


    除此之外，你也能合法聘請稅務專家，建立企業和個人節稅機制。許多資本支出、旅行、物品、教育和其他費用都可以抵扣稅金。等到報稅時，相較於受聘，創業可以節省超過一半的稅金。如果你在創業的數十年間，妥善利用節稅機制，發揮複利效應，可以省下將近六到八位數的金額。'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 如何發揮創業槓桿


    許多人以為創業很難。然而，無論年紀或經驗，創業其實比想像中還要容易。我們只需下定決心，準備接受創業的優缺點，就可以立刻開始。


    國際網路已經整理全世界的資訊，易於探索和吸收。只要按下鍵盤，你可以登入無線網路，設定亞馬遜書店或eBay等電子商務帳號，無須任何費用，開始販賣用不到的舊物品，賺得一小筆創業基金，添購更多產品，繼續販售。你不需要任何前置作業、庫存或日常支出。你可以在P2P的線上金融平臺或群眾募資網站找到金主，在社群網站中免費或用低價找到客群，建立個人品牌，培養品牌價值，孕育忠實的客戶基礎，甚至營造全球熱潮。


    在世界各個角落，你幾乎都能夠免費創業。你也可以支付低廉的成本，迅速建立應用程式或其他科技工具，只用一臺手持行動裝置就經營自己的事業。感謝光纖網路，我們甚至享受光速付款速度，只需要提供信用卡或手機支付工具。如果你已經擁有自己的事業，這些資訊非常重要，可以協助你拓展規模或建立更龐大的系統。以下的方法讓讀者發揮創業家的槓桿效果：


    +   □ 清楚自己的夢想、價值觀和事業目標。


    +   □ 馬上創業。一開始的事業規模可能很小，甚至只是兼職。沒關係，設定一個目標'
  merge: -1
  img_proc: true
- pgno: 377
  md: '+   日期，追求更高的收入。


    +   創業時，趁早建立槓桿系統，並且持續強化。


    +   招募最好的人力資源。


    +   你可以先承接外包工作，或者將事業當成兼職的嗜好或習慣。


    +   創造良好的創業文化，吸引其他人的注意。


    +   堅持銷售的八個步驟。


    +   藉由群众募資生產服務或產品，請教群众意見，持續改善。


    +   聘請員工或團隊成員時，務必明確描述工作內容和關鍵成果領域。


    +   藉由改變、成長和顛覆，持續啟發團隊成員。


    +   妥善管理金錢，謹慎應用關鍵績效指標。


    +   將部分獲利轉為投資，增加獲利額度。


    +   善用槓桿效果，委任辦理工作，將時間用於提升願景和策略。


    +   繼續教育自我，研究其他成功的商業案例和人物，效法其他利基產業的觀念。


    +   發展品牌價值，提升公共關係，管理信譽。


    +   發展良好的延伸商業網絡。


    +   參與慈善事業。'
