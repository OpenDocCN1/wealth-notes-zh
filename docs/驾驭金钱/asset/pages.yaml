    山姆·沃爾頓（Sam Walton）是世上最有錢的富豪之一，身後留下超過一千億美元的遺產。他創辦的沃瑪超市在二〇一五年時總共聘請兩百二十萬名員工。同一年，臉書的員工數量只有「一萬兩千六百九十一」名，但公司規模依然非常可觀。


    祖克伯本人的身價則高達五百四十八億元美金。衡量企業的關鍵指標包括「每名員工創造的平均收入」（Revenue per employee：RE）。


    我非常關心這個指數，一般企業聘請一名員工創造的平均收入為五萬一千美元，表現最好的則是蘋果電腦公司，每名員工創造的平均收入高達一百八十六萬五千三百〇六美元。


    領英公司的 RE 是三十二萬美元，雅虎則是三十七萬五千美元，亞馬遜書店的 RE 為五十八萬美元。科技創新公司的 RE 較高，在過去十年呈現顯著的成長。'
