    # （二）所有的鉅富都註定要體驗高格調的奢華生活


    幾乎所有的超級鉅富都享受到優渥的物質生活。在自戀和愛人、自利和利他取得平衡後，才能維持富裕的生活。高格調的奢華生活，意味著當事人享受生命中的精緻事物，這點其實可以促進經濟發展。


    如果你有助理、傭人、保鏢或隨扈，代表你所到之處的金錢都在快速流動。你不但提升了自己的生活品質，同時也提升了服務他人的品質。


    # （三）鉅富深諳各種金錢之道


    不了解金錢的道理，就無法累積巨大的財富，就像一個人不懂引擎的原理，就沒辦法修理汽車。雖然這句話聽起來很像常識，但我個人認為是一種啟示。我以前認為經濟學、商業思考和歷史是件很乏味的事情。好玩的是，我現在完全不想，反而非常喜歡。'
