  md: '# 顛覆的金融體系


    ![](img/a9d3aeae93c5ae3f9baf5963e137b74a_25_0.png)


    在商業、科技和金錢的領域中，我們可能都活在達爾文口中「適者生存」的世界。過去幾年來，金融世界發生了震盪移轉，金錢交易愈來愈少，智慧型裝置和晶片系統進行的光速交易日漸增加。


    縱然轉型尚未完成，但我們的確是浸淫在資訊裡，下個時代的主題可能就是「科技」。工業時代早已被我們遠拋於後。那些仰賴加工和手工業，想因此獲得自由與財富，並渴望早期退休者，不但競爭力低落、過度工作，而且只能拿到過低的薪資。他們早就落伍了。


    科技時代的速度飛快，簡直就是風馳電掣。摩爾法則（Moore''s Law）——高登．摩爾（Gordon Moore）提出的，不是我——相信電腦處理器的能力會在每兩年增加一倍。摩爾是英特爾公司的共同創辦人之一。自從微電路（Integrated
    Circuits）發明問世後，'
  merge: -1
  img_proc: true
- pgno: 26
  md: '摩爾發現每平方英尺的電晶體數量每年增加一倍。這個效益持續的時間愈久，就能累積可觀的動能，發揮復利效應。


    事實上，摩爾定律的效益已經持續了五十年，其進展成果大約是二的三十一次方，換算結果是二十億。這個現象顯著地影響全球金融，因為金錢流動的形式和平臺增加，速度變快，並且創造了重要的槓桿效果（我將在本書稍後詳細說明）。


    # 快速崛起的億萬富翁


    幾乎一眨眼，全球的互連性，以及全新的金融系統，讓早期的新創家和企業家，在前所未有的短暫時間內，迅速累積巨大財富。倘若你在「奔波一」（The Hustle）網站上查詢迅速致富的億萬富翁名單，就會發現前十名裡，有九位出生於一九八七年後。令人意外的是，致富速度最慢的是比爾・蓋茲，他也是名單裡最年長的一位。


    前十名億萬富翁裡，七位在網路上發揮槓桿效果致富，包括亞馬遜書店的傑夫・貝佐斯（Jeff Bezos）、臉書創辦人之一馬克・祖克伯（Mark Zuckerberg）以及西恩・帕克（Sean
    Parker）、eBay 的創辦人、酷朋（Groupon）的創辦人以及谷歌（Google）的創辦人。'
