- pgno: 385
  md: '請詢問你的伴侶和孩子：「你們最重視的生活價值是什麼？」但不要以為他們是在針對你。仔細傾聽，就會形成理想的藍圖，知道如何愛他們，照顧他們，和他們一起生活。


    當你希望追求自己的重要價值，也會明白如何讓他們支持你。你會慢慢知道許多人用盡一生的時間，依然無法實現所愛的理想。但是，只要方法正確，我們可以打造理想的家庭生活，滿足每位家庭成員的價值和目標。我和琴瑪就是如此。我們結合了工作和假期，所有人都實現了心願。我和數百名朋友分享結合工作和假期的觀念，徹底改變他們人生的所有領域。


    除了家人之外，你也應該知道商業合作夥伴、摯友、上司、管理總監或團隊主要成員的理想價值——所有可以協助你實現願景，在生活中扮演重要角色的人。想要長久維持關係，雙方都要實現自己的價值。讓家人和關鍵的夥伴一起參與個人事業目標規劃和願景思考。每年都和家庭成員一起討論，讓每個人提出對家庭價值和願景的想法。孩子年幼時，就讓他們設定目標，追求有價值的理想，心情變得更愉快，你也有機會教導他們正確的知識和技巧，使他們往後順利追求理想生活。再次強調，你可以在工作假期時完成上述目標。


    消除工作和家庭的隔閡，找到有效利用時間的方法，結合熱情和專業，工作和假期，就能得到更好的事業結果，創造更偉大的傳承。你跟孩子之間的關係會更融洽，和伴侶的感情也會加溫。'
  merge: -1
  img_proc: true
- pgno: 386
  md: '# 如何結合熱情和專業


    從現在開始，詢問自己六個關鍵問題。隨著你逐漸成長，每年至少要重新回顧一次這些問題和答案。


    # 一、我喜歡現在的事業嗎？


    如果你剛開始創業，雖然尚未成熟，或者你事業有成，無論是基於專業或熱情，你已經擁有足夠的興趣和靈感，願意完成第一階段的工作，承受創業那些披荊斬棘的挑戰和時間付出。這個起點很好，確保你不只想賺錢，也擁有熱情。你可以隨時轉變方向，尋找任何有趣的事物，只要遵守財富公式，解決有意義的社會問題，能夠賺錢。


    # 二、十年之後，我依然喜歡事業的生活嗎？


    我喜歡藝術、房地產和成為房東。但我是個喜新厭舊的人，只要開始拓展事業和維持發展，就會變得盲目不理性。隨著時間過去，我無法用藝術賺錢，我的熱情也消失了。我討厭支付日常生活費用的壓力和商業化的藝術經營，我的熱情也備受考驗。


    我只有在剛開始創業時，才有成為房東的熱情，因為我很興奮，終於可以成為自己的老闆，但靠著房租過活沒有未來。我對房地產的熱情不在於瀏覽物件、議價、管理房'
  merge: -1
  img_proc: true
- pgno: 387
  md: '客或者和仲介商打交道。事後仔細思考很重要。我參與且放棄了許多事業領域，獲得寶貴的經驗，我知道判斷這個領域是否值得投入的關鍵，就是「十年之後，我是否仍然熱愛這個領域」。


    我終於明白，寫作、商業世界的教學相長、個人發展和金錢才是我的終生熱情。我花了好多年，轉換了好幾個領域，才學會這個道理。但沒關係。任何領域都能創造金錢，或者讓我們學習經驗。生活中的大小事都是一場測驗。我們可以找一個合適的利息領域，當作墊腳石，追求理想的未來生活，結合熱情和專業，一步一步爬上職業生涯的階梯。只要眼光放遠，就可以預防迅速的致富的妄想，避免失敗、盲目和拖延。


    # 三、如果事業變得困難，我依然喜歡嗎？


    一帆風順時，一切都很簡單。然而，有意義且永恆的事業都會要求你面對挑戰，提升智慧和成長。如果你認為自己享受事業領域的挑戰，或者已經準備捲起袖子，實際努力，尋求他人的支持，代表你找到了適合自己的理想領域，可以實現願景和價值。


    # 四、我是否具備足夠的技巧和經驗（或者願意學習）？


    如果你只是喜歡某個領域，但缺乏技巧和經驗，那不是事業，而是嗜好。真正的事業需要興趣、技巧和經驗。每個人開創事業時的基礎不盡相同，只能逐漸獲得經驗。最'
  merge: -1
  img_proc: true
- pgno: 388
  md: '好的事業是你擅長而且非常喜歡的領域。雖然許多人都擅長自己熱愛的領域，但不是必然。


    # 五、我的事業有市場嗎？


    缺之市場的偉大理念也只是空談。只有價值和公平交易，沒有市場，更無法拓展或者維持事業。你喜歡這個事業價值，不代表全世界的人都這麼想。讀者可以觀賞《龍穴之投資創業》（Dragon’s
    Den）影集 2，看看參賽者如何盲目相信自己的想法可以解決全球問題，而五位（或六位）評審如何評論。迅速調查市場的方法很多，善用谷歌搜尋，尋找關鍵字，觀察搜尋結果的網頁數量，尋找社群網站是否有相關主題的社團或專頁，測試點閱廣告的效果和流量，在網絡論壇提問，在亞馬遜書店或
    Audible 網站尋找相關書籍。只要用一天的時間，就可以完成辛苦的研究工作，開始實際測試事業市場。


    # 六、我的事業可以持續獲利嗎？


    有些市場會產生景氣循環，另外一些市場則著重投資時機，例如聖誕節期間大量出現於商場的短期商店，都會在新年結束之後消失。有些產品講究季節時機，另外一些市場經常發生重大改變，還有一些市場已經非常成熟，難以進入。如果你選擇穩定的事業，可以長期維持，就能更有效率地發揮複利效應。請記得，重新開始需要非常龐大的能量，'
