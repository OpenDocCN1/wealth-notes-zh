    > ——艾茵·蘭德


    # 從現在開始下定決心


    本書的第六部和第七部將協助各位讀者更深刻地理解金錢系統、法律、技巧和策略，讓我們理解更多、創造更多，並且給予更多金錢。但是，我現在希望各位讀者下定決心追求金錢。正如你願意追求健康飲食與運動習慣，我們也應該專心致志保持一輩子的熱情，持續研究金錢的各種道理。各位讀者可以從這些重點開始：'
  merge: -1
  img_proc: true
- pgno: 137
  md: '+   • 接受新的金錢科技和創新，並且全心採納。

    • 研究未來趨勢。

    • 思考解決重要問題的方法。

    • 尋找特別的機會和顛覆方法，發揮網絡概念的槓桿效果。

    • 使用進階的銀行帳戶（本書將在後續篇章詳細說明）。

    • 與聰明和富裕的朋友相處。

    • 適應環境的改變，持續尋找提升自身價值和服務的方法。

    • 提升產品（服務）價格。

    • 做好最壞的準備，追求最好的結果。

    • 比其他更早設定停損點。

    • 先求有，再求好。

    • 如果出现意外，立刻著手處理，而且持續關注。'
