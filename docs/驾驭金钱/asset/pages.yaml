- pgno: 122
  md: '# 是上天的禮物，抑或是詛咒？


    物質主義當然也會有缺點，但是有捨才有得。想要得到更多，就得付出更多。物質是衡量付出與收穫是否成正比的一種方法。精神意念可以轉換成物質，如果你被認為是慷慨的，就會得到更多。我們必須樂於付出，並且增進金錢流動，才能吸引更多財富。


    許多人認為，要透過體驗及分享，人生才會因而富足，而不是透過對物質的追求。但是，經驗其實也可以是一種物質，因為物質和金錢可以替你和朋友創造美好的體驗和回憶。


    如果你喜歡抽象的體驗更勝於物質，那也很好。有些人不把昂貴的度假行程和晚餐認為是物質的一部分，但其實現和物質究竟有何差別？


    對於重視慈善和心靈層面的某些人而言，太重視物質是自私自利的行為，但他們通常忽略，其實物質也擁有慈善和心靈層面的意涵。


    但是，很多人會把時間、熱情和創造力投入於物質。一輛勞斯萊斯汽車必須花費五到六個月的製作時間，光是拋光、散熱就要投入五小時的人力。百達翡麗（Patek Philippe）手錶的時針和陀飛輪要用八年才能打造。他們聘請一千六百位員工，其生計仰賴「富裕的物質主義者」支付數萬或數十萬英鎊購買手錶，才能供養家人和孩子成長。'
