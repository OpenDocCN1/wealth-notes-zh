  img_proc: true
- pgno: 172
  md: '己變得富裕，就可以提升自我價值。


    請你務必接納財富，並且分享財富。你必須相信致富是自己的使命和召喚，就像其他的財富巨人一樣欣然接受。


    貧窮的觀念可能來自父母，或者你內心深處認為自己沒有能力，痛苦的經驗粉碎了你的自我價值。但是，你真正的召喚和使命不會因此消失。心懷感激地接納，允許自己變得富裕。


    我的一生犯下許多愚蠢的行為，特別是金錢上的錯誤。我做了非常多糟糕的財務決定。我有時付出太多，有時又過度貪心。


    我甚至好幾年都在自我厭惡，為了那些我犯過的錯責怪自己。想要改變自己，必須付出無窮的自我努力，甚至參加熱忱奉獻的課程，但如果像我這種糟糕的混蛋都可以改變，你一定也做得到。


    # ○貧窮的觀念：「我支付帳單和生活費用之後，就沒有錢了」


    富裕的觀念：「我會先投資自己，再用剩下的錢，支付帳單和生活費用」


    第一世界的窮人總是先支付帳單和生活費後，才會花錢投資自己。然而，他們發現'
  merge: -1
  img_proc: true
- pgno: 173
  md: '自己付完帳單後，什麼也不剩，正如吉姆．羅恩（Jim Rohn）所說：「每個月都要支付生活費，要支付的太多，金錢卻太少。」


    生活一定會衍生出花費，永遠沒什麼儲蓄的機會，我們必須逆轉這個惡性循環，開始學習「先投資自己」（Pay Yourself First: PYF）。


    如果你願意「先投資自己」，會強迫自己適應剩餘的金錢，日常生活支出也會相對減少。這個過程比一般人想得更簡單。


    他們可以開始逆轉惡性循環過程，改變金錢的方向，不再只是「往外支出」，而是「往內投資」。無論改變多麼微小，都能創造具體的進步。舉例而言，如果你投資自己五十英鎊，作為「絕對不能挪用的儲蓄」（Save
    and Never Touch it: SANTI）。只要開始賺到更多錢，就可以提升「絕對不能挪用的儲蓄」金額比例。你的行動其實正在改變觀念和行為，創造更好的結果。


    如果你的事業無法創造金錢，支持你的生活，就不是真正的事業。一般人認知的事業經常開銷其實並不正確。事業的成本應該包括支付你本人的薪資，所以會更高。倘若你離開自己的事業，沒人會進入你的事業，免費地替你工作，但你為什麼要免費替自己工作？


    許多企業的主人，為了減少公司成本，多年來並未領取薪資。他們認為「不領取薪資」（不投資自己、不支付自己）是一種榮耀勳章。但是，如果一個事業（一間企業）'
  merge: -1
  img_proc: true
- pgno: 174
  md: '沒有公平的薪資、股利或創業主的利潤，就沒有人願意投資，或者，他們會降低投資金額。如果你是創業家，在某個時間點之後，你很有可能會賣掉自己的公司，將位置交給優秀的執行人員，這些人領取高薪，甚至連招募他們都必須付出昂貴的手續費，還要支付大筆金額，讓他們接受訓練。因此，倘若你希望創造真正的事業，賺取真正的金錢，你應該立刻開始投資自己，支付自己的薪資。你絕對值得這些錢，而且這是公平的作法。你無法接受的原因可能與其他觀念有關，例如你的內心一直認為自己不值得，或者相信你賺到錢，代表其他人失去金錢。


    # 貧窮的觀念：「別人會批評我，認為我因金錢而變質」；富裕的觀念：「無論如何，別人可能會批評我」


    不管你做什麼，別人都不會批評你。你駕駛生鏽的老車，他們批評你，你駕駛一輛閃亮的紅色跑車，他們也會批評你。


    然而，你的財富可能會鼓舞他們，你的貧困也可能讓他們覺得自在。別人會憎恨你最偉大的特質。在人生的任何時刻，無論你做什麼，都會有人愛你，也會有另一個人同樣恨你。


    舉例而言，許多人都討厭我的紅色鬍子，除了我的母親。但是，你必須明白，重要'
  merge: -1
  img_proc: true
- pgno: 175
  md: '的事實是他們批評的不是「你」，而是受到生活經驗、信念、態度和價值的影響。換言之，他們其實是藉由你，批評自己。


    我以前總是相信，只要自己變得更好，別人的批評就會變少。哈哈，我直的太傻了，才會有一種想法。你愈偉大，別人就愈喜歡批評你。你變得更好，他們也會用更嚴苛的標準評論你。只要你不再渴望讓所有人都喜歡你（或討厭你）的片面幻象，就可以找回所有浪費的時間和能量，不必滿足別人的期待，坦率地做自己。我認為，你內心真正的期待，就是變得富裕。


    如果你是一個職業母親，家庭主婦可能會批評你，認為妳把賺錢看得比養育孩子更重要。如果你是一位藝術家，創造音樂、電影或藝術創作的風潮，並且名利雙收，還沒成功的藝術家也會批評你，抨擊你「為錢出賣靈魂」。如果你是一名企業主，必須完成艱難的決策，開除員工並且協調重大合約，其他人也會責罵你冷血或貪婪。


    他們只能看見你的表面，而不是內在，並且用表面行為批評你。只有你知道自己必須承受的掙扎，以及自己犧牲了什麼。


    你應該欣然接納批判和支持。只要有支持，就會有批判。讓他們用任何方法批評你，不要讓他人的毀譽影響自己的判斷。誠實面對自己，並且努力不懈。


    上述貧窮觀念的另一種形式是「朋友認為我變了」。但是，我只擔心自己毫無改變。世事無永恆，我們必須成長，否則只能等待死亡。想要維持成功，改變是健康、自然且'
