- pgno: 90
  md: '錢的人，他的收入會相對於支出。金錢會大量地流向少數精通金錢原則的人，這就會使世上的財富分配符合八十／二十原則：八十％的財富集中在二十％的超級富人。根據美國聯邦準備系統在二〇一四年的調查，全美工四、四％的財富集中在前三％的富人，他們擁有的財富是全美工十％家庭的兩倍。


    為什麼許多人對這個統計數據感到驚訝？為何很多人認為這種現象不公平？這是金錢的本質。全美工四、四％的財富從何而來？答案是最「貧窮」的其他九十七％美國人。但他們的錢並不是被偷走，或者遭到政府沒收（大多數的情況並非如此）。他們揮霍金錢，把钱送給富人，然後抱怨這個世界並不公平。


    # 四、金錢是一種持續流動的能量交換


    能量守恆定律主張「能量不會憑空而生或被摧毀」。宇宙的總能量從未改變，只是移動。


    金錢的流動也是買方和賣方之間的能量流動，透過的方式可以是交易、債權和債務、服務和價值，以及解決問題。如果能量無法藉由金錢流通，這個金錢形式就不會繼續存在，也不能滿足人類持續改變的目標。


    即使印製更多金錢，也不是在創造新的能量，而是將能量轉變為金錢，讓人類持續交換能量。人的觀念或決策，可以驅動鈔票的印製，正如觀念和決策能夠促進財富累積。


    即使你在鈔票上點火，鈔票被燃燒之後，能量和價值會移轉到其他的鈔票上，這就'
  merge: -1
  img_proc: true
- pgno: 91
  md: '是貨幣數量論（Quantity theory of money）。焚燒金錢反而讓其他人變得更富有，聽起來確實很諷刺。我開始好奇 KFC 樂團焚燒一百萬英鎊時是否想過此事？除了實質的意義外，「燒錢」確實也是第一世界窮人的所作所為，他們揮霍金錢，把財產的能量讓給其他人，不但迅速，而且毫無益處。


    # 五、金錢的流動仰賴服務和價值，而不是工作與時間


    不提供服務和價值，消費而不生產的人，他們的錢容易流向提供價值、服務和解決問題的人。


    「賣命工作和時間長短」與「金錢多寡」並沒有正相關，價值和服務才能轉化為符合比例的金錢。


    人類渴望輕鬆和幸福的生活，所以付出金錢，以金錢蘊藏的能量，交換產品、服務和資訊，藉此改善生活。他們購買的並不是漫長的工作時間或者辛勤的付出。金錢交易是一種能量交換，只要能提高交換的能量，你就能增加收入。


    +   1 可分割性（divisibility）是一個管理學名詞，指消費者可能無法接受一個大型的商品，因此管理者可以將商品分割為數個部分，分別賣給消費者。'
