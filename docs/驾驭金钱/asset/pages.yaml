- pgno: 158
  md: '每個人都相信自己的信念，但這些信念並非外界的真實模樣，而是我們個人經驗和視野濾鏡所創造的獨特認知。


    金錢也適用於上述道理。你的家長或生命中重要的父執輩人物，一生努力工作，並沒有因此發財。他們與金錢的關係非常惡劣，搞不好還負債累累，一生都為錢所苦，甚至仇視有錢人和整個社會系統。


    你可能因此採納與他們相同的金錢觀。你無法克制自己的想法，這也不是你的錯，因為你形成信念時，只能看見他們提供的「證據」。你的金錢觀念和信念，就是你如何理解金錢的故事，而許多人的故事都不真實。


    許多人責怪自己，或者因為個人財務狀況而產生罪惡和羞恥感。當然，很多人也責怪其他人。


    我必須強調一個重要的觀念：你根本不會知道自己有多無知。倘若成長背景讓你習慣貧困的心態，或者受到匱乏、嫉妒、罪惡感、厭惡和其他攸關金錢的情緒影響，你當然情不自禁地形成相應的信念。因為上述的條件就是你唯一的證據。


    我們絕對不能苛責或為難自己，也不應該像其他人一樣，怪罪傳遞錯誤信念的朋友或長輩，因為他們也不清楚自己的金錢信念是錯的，更不知道還有其他更好的金錢觀存在。'
