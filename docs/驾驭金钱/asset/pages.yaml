  md: '果。我是許多智囊團的成員，我既是領袖，也是團隊的一分子，但沒有其他團隊成員，我什麼都不是。


    聰明的心智相互團結，讓他們解決各種重要的問題，可以使我們獲得最偉大的洞見、益處和策略方向。坐在會議桌的同伴看見答案，用不同觀點理解挑戰，知道誰可以幫忙。


    如果我們不知道如何理解一個問題，就沒有辦法找到線索。即使以旁觀者的身分參與其他人的商務發展討論，無論討論領域是否有直接關連，都可以使你從中獲益，甚至讓你借用他們的創新觀念，發展自己的利基。我們學習成為領袖，也理解如何成為學徒。


    # 計畫、觀察、實踐、檢閱、重複


    身為個人物質生活的鍊金士，你的起點就是一個明確的計畫，理解自己希望創造的成就。俗語說：「務必謹慎許願，因為你將心想事成。」


    創造清楚且明確的計畫，制訂策略方向，設定物質和精神的目標，理解自己想要完成的欲望。


    許多人都說「吸引力法則」，我發現只要反覆練習計畫和設定目標，就能提升吸引力法則的積極效果。'
