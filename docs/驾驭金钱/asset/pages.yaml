  md: '# 31 CHAPTER 資產鍛金術


    鍛金術（alchemy）的定義是「追求改變物質的方法，特別是將基礎金屬變為黃金，或尋找萬靈藥」。有趣的是，字典定義和中世紀化學家的觀點認為「鍛金術」是將金屬變為黃金的方法。每個人都在尋找神奇的鍛金術，希望點石成金、滴水成酒──也就是成功的捷徑。


    我們的視野受到侷限，只注意將一種物質直接轉化為另一種形式的新物質。然而，將精神觀念轉變為具體物品，或者讓觀念變成黃金，其實更為簡單。每位百萬富翁、億萬富翁或超級億萬富翁，都是真正的鍛金士。他們的想法、觀念、決策和行動，最後都變成真正的黃金。


    接受你的內在天賦，明白你就是實現內心價值的鍛金士。你狀態安穩，什麼也不缺，你的內在已有實現夢想的所有條件，能夠將思想的富足轉換為豐厚的金錢。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# 資產


    你的鍊金術是理解生活、服務他人、解決問題並且擴大規模。看似虛幻的問題，都會成為物質生活的解答；原本只是精神上的念頭或想法，也會化為真實的金錢。每個人的內心都有足夠的天賦，但大多數人卻無法實現。請各位讀者勇敢成為鍊金士，而不是悲觀主義者。


    想要成就內心的鍊金士，你必須致力發展並精進自我。你本人就是最好的資產，因此請睿智投資自己，讓自己得到最棒的回報。你學得愈多，賺得就愈多。


    你的個人成長速度，會決定財富擴展的速度。專心投資自我吧，這是值得的。如果你不珍惜自己，又有誰會珍惜你？


    以下是適合發揮槓桿效果的自我投資領域：


    +   • 知識（教育）


    建立知識一共有三個階段：學習知識，認識自己，以及知道自己未來想成為怎樣的人。


    人格是商業世界最好的擔保品，信用則是最棒的資本。投資自己，其實就等於投資'
  merge: -1
  img_proc: true
- pgno: 275
  md: '事業與金錢。你可以讀遍圖書館的所有書籍，但倘若情感、信仰，對於過去和未來的憂慮控制你的思慮，所有的知識都沒有意義了。在商業和金錢的領域中，建立良好的自知和自我情緒控制也有三個階段，同樣影響個人發展：


    # 一、自知


    你知道自己的優點和缺點嗎？你如何克服缺點或藏拙？你很清楚他人如何看待你嗎？你知道何時是自己的能量高峰期與低谷期？什麼事件會觸發你的情緒和反應？你曉得自己的價值觀嗎？你願意接納哪些，又會拒絕哪些價值觀？你熱愛什麼？你希望在什麼領域發揮槓桿效果？你有沒有不斷犯下同一個錯誤？


    認識自己是一場無盡的旅程，但你愈理解自我，財富就會滾滾而來。從一分到十分，每半年，我們都應該評估自己的表現。


    # 二、自我教育


    你進行了多少自我投資？你是否發揮槓桿效果，彌補自己的缺點？你的團隊能否與你的個人特質相輔相成？你是否阻礙了周圍好友的發展？你會不會自我挑戰，還是只跟會奉承你的人待在一起？你是否擁有比你更優秀的導師？你是否每天聆聽有教育意義的有聲書？為了拓展個人事業，你有沒有參加訓練課程，接受適當的教育？


    讀者應該仔細回顧上述的問題，評估自己的表現。如果我可以替過去那個負債累累、劣根性重的自己，還有現在偶爾個性惡劣，但非常有錢，會被過去的自己憎恨的「新'
