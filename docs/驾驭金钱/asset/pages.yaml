- pgno: 186
  md: '賠金。由於這筆金額很大，有人建議我將金錢交給專業人士處理，我卻在一年之內花光所有的錢。我用一千五百英鎊購買一架數位攝影機，還有幾套西裝——大学生活最需要的就是漂亮的西裝！我雖然將剩餘的金額存在帳戶，很快就用完了。


    當時的我非常窮，也不知道怎麼理財。事後思考，我之所以如此迅速揮霍金錢，就是因為那筆錢並非辛苦賺來。


    交通意外發生之後，我等了很久才拿到理賠金，那筆錢就像一種獎勵或禮物，完全無法與努力工作得到的錢相提並論。換言之，理賠金和薪水之間完全沒有替代性。


    就讀大學時，我每週六早上都會用兩個小時開車回家，在父母親經營的酒吧打工，連續輪班三次。一個週末，我就可以賺到七十五英鎊的薪水。雖然我當時不懂如何妥善管理金錢，但非常謹慎看待薪水，因為我努力工作，而且揮灑汗水，才得到這筆錢。


    觀察別人如何理財、做商業決策和自我教育時，我發現許多人都產生了相似的情緒和「金錢的非替代性觀點」（雖然我不確定這個詞正不正確）。


    二○○○年代初、中期，每隔兩年，民眾就會抵押房屋，申請貸款。他們相信這是一筆免費資金，不必辛苦工作或提高收入，只需抵押房子，就能得到一筆錢。相較於儲蓄，他們看待次級房貸資金的態度非常隨興。不費吹灰之力，就能說服他們支付大筆金額，購買海外資產、看起來非常可疑的預售屋計畫，或者內容空洞的個人成長課程。他們也幾乎不會進行任何事前調查。更有趣的是，他們得到的資金其實是「負債」。'
  merge: -1
