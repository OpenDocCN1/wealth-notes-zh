    領錢，也可和家人一起討論，並且聘請一位傑出的稅務顧問。


    # 親朋好友支持


    這些投資人不是專業的融資者或合夥人。他們可能從來沒有提供貸款的經驗。好處 是你會獲得比銀行更好的利息。你可能需要說服他們並提供資訊，讓他們願意投資。最 重要的是，他們必須信任你。如果投資失利，你會同時失去錢和朋友。然而，相較於銀行，
    他們更容易原諒你。朋友或家人的支持是從頭開始的好起點，但不適合大型投資方案。


