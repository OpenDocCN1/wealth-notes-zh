- pgno: 362
  md: '# CHAPTER

    39

    行銷就是金錢


    假設你是一間店的老闆，銷售就是將產品賣給店內的客戶，行銷則是讓他們走進店裡的方法。沒有客戶，東西就無法銷售，行銷是商業最重要的基礎功能。行銷就是金錢。


    如果沒人購買，即便產品再好，也比不過大眾喜愛的平庸產品。當然，偉大的創新產品非常重要。我假設所有讀者都喜歡好東西。你細心設計，參考群眾意見，持續改善產品或服務，建立良好的行銷方案，將產品交給顧客。顧客非常渴望購買產品或服務，開心地向朋友推薦。你的產品或服務愈能配合客戶原本的需求，適應目標客群，就能減少行銷成本和難度。產品的市場矚合減緩金流速度，拙劣的手法，或是向不對的客群行銷，都會妨礙你賺錢。


    偉大的行銷需要藝術和科學。對市場的直覺、經驗、欲望、美學以及各種無形的特質都是藝術，有助於提升產品聲勢。科學則是分析行銷的關鍵績效指標，建立基礎行銷'
  merge: -1
  img_proc: true
- pgno: 363
  md: '投資決策。結合藝術和科學，提升品牌價值、良好的意念和經驗，同時持續測試、評估和修正方向。行銷藝術和行銷藝術的結合，會讓你在競爭市場拔得頭籌。


    # 建立品牌的稀有程度


    如果你的行銷策略是採用減少供應和促進市場需求，那麼價值自然就會上升。倘若你的品牌是以慈善掛帥，那麼很多有錢人就會成為你的忠實客戶，價值也會提高。例如Nike就是創造非常稀有的高價格商品（獻給行家的限量版喬丹鞋），創造購買熱潮，同時行銷低價商品（印刷品、書籍或六十美元的訓練器材）。


    # 行銷策略


    我提供二十四個行銷策略，讀者可以參考如何藉此發揮槓桿效果，將行銷效果轉化為具體的收入，藉由產品和服務，創造財富和金錢。


    +   一、追求獨特，並且忠於你的特質。


    +   二、創造話題和爭議。


    +   三、先尋找少人關注的商機，再開拓格局。


    +   四、永遠都要懂得行銷，把這些觀念藏在行動、電子郵件或推薦信中。'
