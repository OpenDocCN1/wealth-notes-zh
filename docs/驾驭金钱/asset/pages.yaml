- pgno: 400
  md: '產品價格或服務費用會吸引擁有消費能力的客戶。如果你的定價過低，等於拒絕高消費能力的客戶。想要設定低廉價格，藉此吸引高消費能力的客戶，只是一種無稽的想法。價格必須釋放正確的訊息。你的價格正確，可以區隔沒有能力支付或者不願支付的客戶。換言之，這是非常好的篩選方式，能夠替你節省時間，杜絕只看不買、浪費時間或者想半價購買的人，也可以吸引能夠輕鬆購買產品或服務的客戶。他們喜歡你的產品，珍惜你的價值，也更有眼光。他們的社交網絡更好，可以將你推薦給朋友。請立刻將價格提升至合理的高度，建立高水準品牌，吸引高消費能力的客戶，創造財富、金錢和獲利空間。為什麼還要猶豫？立刻進行吧！


    # 平價化商品和市場價格限制


    許多人拒絕提高價格，認為市場已經面臨價格限制。他們相信這個產業出現一個無法超越的限制，市場也成熟、飽和而且平價化（commoditise），只能採用標準化的價格。他們的想法其實是將一個開放自由的外在世界，想像成封閉的內在世界。為什麼不能顛覆一個產業？如果你認為自己的事業領域已經進入平價化階段，你有三個選擇：'
