- pgno: 441
  md: '享受奢華的物品，創造社會貢獻，繼續追求財富成長。將第三級的自由生活收入提高五倍，創造根本不可能用完的收入吧！


    以上四個等級的生活理想就是「財務基石」，因為這些目標是我們旅途的查核點，從擺脫債務，滿足日常開銷，一路提升至富足生活。每一次提升等級，我們就得到成就感，最後終於成就自我理想寓言。我強烈推薦讀者每半年都要按照這四個等級的基石設定目標。定期檢查進度。只要完成階段目標，就稍微獎勵自己，成功提升等級之後，可以大方犒賞自己。


    # （四）金錢的七種層次


    金錢一共有七種層次的使用方法，只要發揮正確的槓桿效果，以適當的順序使用，就能創造財富格局。


    # ②消費（滿足需求）


    根據需求而消費是人類的首要生存法則。許多人身陷債務，根本無法負擔基礎需求，只能背負債務。這有可能是因為缺乏理財知識、暫時無賺錢能力，或者虛榮心作祟等。但是，絕大多數人都能靠著比想像中更少的金錢而活，但他們早已奢侈成性，搞不清楚是「必要」還是「想要」。請仔細調整生活預算，符合你和家人的基礎水準，設定穩定的生活目標。


    「滿足欲望」的消費是大多數人貧窮甚或破產的原因。這種消費方法將錢用在負'
