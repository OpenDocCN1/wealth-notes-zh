  md: '# ◎ 量化寬鬆 (Quantitative Easing)


    量化寬鬆是國家中央銀行印製更多金錢投入市場，這個槓桿策略雖然也受到批評，但同樣證明可以開創新的經濟成長結果。如果經濟成長趨於緩慢，量化寬鬆政策能促進消費。量化寬鬆的理論基礎很單純：只要經濟系統擁有更多金錢，足以提升民眾消費意願，讓企業公司獲利，再將利潤轉為投資，創造就業機會，提升金錢流動速度和推進市場信心。國內金錢增加之後，刺激出口以及銀行提供貸款的意願。由於量化寬鬆政策會在長期造成利息下降，連帶鼓勵投資人融資。銀行擁有更多現金，降低借貸門檻，將更多金錢投入市場。


    量化寬鬆政策當然也要追求平衡。如果印製過多金錢鈔票，將導致金錢價值下跌，中央銀行也會擁有過大的權力。量化寬鬆政策的另外一個優點是貸款的成本會隨著通貨膨脹而減少。量化寬鬆政策的本質就是一種調整經濟系統能量平衡的槓桿。各位讀者當然沒有能力配合市場需求而印製鈔票，但我們可以創造個人的量化寬鬆政策想像，建構不同的資訊、觀念、能量和有價值的產品，協助事業和個人國內生產毛額的發展，追求獲利提升。請努力嘗試！


    # ◎ 現金的槓桿效果和反槓桿效果


    如果存款利率低於通貨膨脹率，將錢放在銀行只會創造反槓桿效果，甚至承受損失。倘若存款利率略高於通貨膨脹率，例如存款利率為五%，而通貨膨脹率為三%，代'
