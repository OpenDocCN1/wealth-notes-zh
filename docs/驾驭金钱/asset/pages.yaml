  md: '如果自己發財，就代表其他人虧錢，這個想法讓我非常驚訝。讓我進一步解釋一下：一般人必定假設，經濟系統內的金錢總量會逐漸減少，或者其他人都是在不甘願的情況下交出金錢，並且覺得自己蒙受損失，也許相信金錢從一個人的手中轉到另一個人手中是一種輸贏過程。


