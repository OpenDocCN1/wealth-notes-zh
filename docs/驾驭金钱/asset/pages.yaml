    # 三、系統（過程）槓桿


    在本書提到的哲學裡，「系統」一共有三種定義：


    +   （一）系統是「一種事物的安排，建構理想的運作機制或互動網絡，創造複雜的功能過程」。例如團隊中的人事與部門安排、人社社群網絡、社交媒體網絡、線上待辦清單與多公司的合作等等。簡言之，就是「許多單一個體組成完整的群體」。


    +   （二）系統是「硬體單位或軟體功能構成的整體，或者軟硬體兼具，用來處理單一目標」。例如電腦、電腦硬體、軟體、網路、應用程式和其他電子系統，讓人類活得更快、更輕鬆、更好，減少複雜過程和處理情緒的成本和需求。'
