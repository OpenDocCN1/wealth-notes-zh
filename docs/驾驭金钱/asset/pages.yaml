- pgno: 187
  md: '就像當初我得到的那筆「禮物」一樣，這些人的錢來得快，去得也快，完全比不上辛苦工作得到的稅後薪資。許多人揮霍遺產的原因也非常類似。


    根據「商業內幕」網站的調查結果，相較於現金消費，一個人使用信用卡消費時，金額會提升十二%至十八%。因此，不是所有的金錢都具備相同的價值（替代性）。讀者必須謹慎注意，並且小心管理所有輕鬆取得的金錢。切記：來得快，去得快。


    # ○缺乏耐心


    會促追求某個事物，通常代表這個人沒有清晰的願景和價值觀。恐懼、擔憂、貪婪，或者舒緩痛苦會導致缺乏耐心，想在別人面前變得光鮮亮麗，害怕自己沒有存在感等等。


    許多人高估自己能夠在短時間達到的目標，卻低估自己一輩子能夠創造的成就。你擁有的時間遠超過自己的想像。


    缺乏耐心，可能會讓你花不必要的冤枉錢去置產或亂買消費品，還會讓他人有機會趁虛而入。一生中有許多良好的交易機會，如果你錯過這次機會，一定還會有下次，甚至遇到更好的條件。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '如果謹慎運用，用購物來犒賞自己完成目標不失為一個好方法。但是，許多人經常


    # ◎

    買東西犒賞自己


    許多人藉由消費物質商品來改善心情，這是很經典的用錢問題，容易讓人陷入無法自拔的深淵。仔細留意自己的情緒變化，如果你想要藉由瘋狂血拚來改善心情，請遵守以下規則：


    +   （一）設定最高預算。


    （二）只用現金或額度有限的信用卡付款。


    （三）創造一種特殊的「陪伴消費經驗」，意思是陪伴一位非常喜歡花大錢的朋友（例如我）購物，但自己只看 bought。


    （四）設定「絕不當場購買」的原則。理解所有資訊之後，再購買。


    （五）購物之前，絕對不喝咖啡，或者進行任何導致情緒亢奮的行為（我也要提醒

    自己！）


    （六）記住商場的價格，回家以後比對網路店面的價格。'
