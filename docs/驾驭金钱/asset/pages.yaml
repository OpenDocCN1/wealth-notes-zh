  md: '以抵擋環境的影響，只能隨波逐流。


    改變動態方向非常困難，順勢而行較為簡單。


    因為每個人都在響應潮流，所以相對地改變了「常態」的定義。舉例而言，如果許多人向銀行申請貸款，購買房地產，「信用貸款」、「風險投資」和「房地產價格上升」就會變成「常態」。


    倘若其他人在「以小博大」，你該如何是好？繼續守著自己的小屋，還是像其他人一樣去借貸或拚拚看？


    經濟系統有其法則，不一定符合我們習以為常的想像。與其試圖改變不可改變者，或者將世間的一切錯誤歸咎於經濟狀態，不如借力使力。善用金錢潮流、通貨以及景氣循環的知識，發揮槓桿效果，從下而上地創造改變、財富和金錢（而非從上而下）。


    請記得，你的個人經濟狀態與市場景氣是兩碼子事。


    景氣衰退時，你依然可以繫榮富饒。改變你的內在思維，不要仰賴自己無法控制的外部因素。


    不要等待可遇不可求的好時機。經濟市場不可能處於完美的均衡狀態，但你可以在每次的景氣循環中保持穩定的表現。提供服務、價值和解決問題才是面對各種景氣的可靠方法。讓其他人的生活變得有效率且更便利，也是值得仰賴的方法。


