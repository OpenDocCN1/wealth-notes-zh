- pgno: 62
  md: '# 貪婪、權力和金錢


    ![](img/a9d3aeae93c5ae3f9baf5963e137b74a_62_0.png)


    貪婪和權力既不絕對，也不是現實生活的常態。有些人認為，在經濟還沒衰退前的繁華世代裡，那些銀行家都非常貪婪，但銀行家本身可能卻抱持不同的觀點。窮人或許也會主張，只有貪婪的人才會渴望擁有巨大的財富，卻不知道許多有錢人為了追求更崇高的目標，捐贈了大筆的金錢。


    有些人覺得波波營的業務非常貪婪，但有些人可能會認為業務本來就該做到無微不至。被羅賓漢洗劫的有錢人會批評他貪婪，但受到羅賓漢照顧的人當然不這麼認為。


    # 每個人都有其特質


    每個人其實都有貪心的權利和能耐。你厭惡他人的某些特質，其實你身上也有。當'
  merge: -1
  img_proc: true
- pgno: 63
  md: '你相信的價值遭到挑戰，或者你替他人挺身而出時，你的那些特質就會跑出來。你是重視自我利益以及全人類益處的個體，有造福大眾的深切渴望。你貪婪又慷慨，強悍又脆弱，內心同時懷抱著愛與恨，這些極端的特質將會發揮相同的效果，協助你完成目標，也照顧其他人。


    # 貪婪其實是一種成長


    究竟是何種權威在界定何謂貪婪，何謂成長？人性發展的本質就是追求進步，為何會被批評為貪婪？事實上，沒有任何全能的權威可以準確區分貪婪和進步。貪婪就是成長，而貪婪和成長之間確實有一條持續存在、細微且不斷改變的平衡。


    人類透過自己的感覺和直覺來界定好與壞，當你感到備受鼓舞、熱情洋溢，並且獲得正向回饋時，你就會知道自己是往好的方向成長。當你感到罪惡、憂慮或羞恥這類將你「拉回來」的感受時，也會非常清楚自己稍微逾越了界線。


    這個社會極力投射「貪婪」這個概念到我們身上。


    在某些情況下，貪婪與否只是他人的情感投射而已，並不怎麼重要，而在另一些情況下，這樣的觀念則可讓我們恢復平衡。


    人類的智慧和自我價值，來自於明白貪婪和成長之間的差異。如果你是個善於給予'
  merge: -1
  img_proc: true
- pgno: 64
  md: '的人，生命就會給予你更多，倘若你是接收者，生命就會從你那裡拿走更多；因此，假如你認知的成長，確實是成長，生命就會給予你更多，若你以為的成長，其實是贪婪，生命就會取走一些，讓你得到該有的教訓。


    # 銀行真的貪婪嗎？


    社會和媒體喜歡指控銀行貪婪，認為所有的銀行以及銀行家都是貪婪的，甚至認為二〇〇八年的全球金融風暴和衰退是他們造成的。讓我們先放下宛如集體催眠的不明就裡，才能搞清楚這個事實——如果沒有銀行負責管理你的金錢，就會發生以下問題：


    # 一、你必須自己儲藏、保護金錢


    銀行非常善於儲存、保護，以及維護金錢的安全。他們可以儲存數十億的各種貨幣，讓人免於承受損失、竊盜，甚至防止你揮霍金錢！如果沒有銀行，每個人都要自己想辦法存錢，而且大家都知道你把錢放在家裡。你必須準備金庫、保險箱甚至相當縝密的保全，才能阻止竊賊上門。除此之外，你甚至必須設立嚴格的管理政策，才能保護你和你的財富。光是承擔通貨膨脹的風險，你很有可能會在一年內損失％至十五％的財富。


    # 二、你無法賺得利息


    除非你自己開銀行，否則無法自行支付利息。許多人抱怨通貨膨脹和利率，但沒有'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# 三、你必須向私人錢莊或高利貸借錢


    銀行，他們只會抱怨更多。沒有銀行，誰能支付利息？


    如果沒有銀行，你要如何貸款？銀行消失後，最有可能取而代之的，就是一些投機份子，準備用高利率放款，藉此大賺一筆。


    這就是銀行系統出現之前的借貸體系。大多數地區都像西部荒野，動盪不安。雖然所有的私人放款者不一定都是高利貸，也有協助他人度過難關的放款者、佛心的投資人、大投資者、私人財務顧問，以及集資者，但他們的利率很高，而且附加許多條件。


    銀行的巨大資本額其實是存款者「借」給銀行的，銀行可以藉此發揮巨大的槓桿效果，但個別的存款者無法望其項背。銀行容易受到政府法令的管制，消費者（存款者）能夠因此受惠。


    由於私人放款者和高利貸只能用自己的錢，而不是存款者累積的巨大金額，他們無法放款給許多人，也不能負擔大筆貸款，更難以形成規模經濟。貸款者無法得到銀行的協助時，才會尋求私人放款者的協助，所以他們的風險較高。私人放款者收取較高的利息，藉此補償風險或貸款者無法還錢的呆帳，也必須低調行事。私人放款者沒有足夠的規模、系統以及網絡，不能使用支票、簽帳卡、信用卡或電匯等金融工具。高利貸不會配合政府，經常違反當地的法令規範。他們也缺乏藉由法院命令回收貸款的能力或影響力，必須仰'
  merge: -1
  img_proc: true
- pgno: 66
  md: '賴其他類型的收款方法，不但不合法，而且更具攻擊性。


    銀行藉由他人提供的大量存款，發揮槓桿效果，留下部分準備金之後，提供廣泛的金融商品、安全服務和市場流通服務，發展獨特的經濟體系。銀行的規模經濟使其風險低於私人放款者。各間銀行共同建立了合作網絡，得到政府許可、支持，以及管制。在危機事件當中，例如二○○八年的金融海嘯，政府或銀行甚至成為民衆的最後一道防線。


    # 四、銀行消失後，管制和保護變得更艱困


    高利貸使用自己的錢，承擔更多風險，幾乎沒有任何槓桿效果，必須承擔個人損失，只能提供貸款服務。私人貸款者通常都是高風險客戶，利率也非常高。政府反對高利貸，於是高利貸無法藉由合法管道回收帳目。他們的收款方法通常不符合人性，或是根本就違法。


    政府管制讓銀行必須遵守特定的要求、限制和指導方針，其目的就是創造市場透明和信任機制。由於銀行管理的金錢數量龐大，銀行系統的管理和網絡特質，加上保護客戶的金錢以及維持信任，都是資本主義系統的必須條件。銀行希望營造可靠、配合政府管理並且值得信任的形象。他們不想要客戶全體（everyone）提領存款，也就是一般所說的「擠兌」，這種現象會損害銀行的商業利益。因此，銀行的立場容易趨於保守。儘管轉售債權的營運方式無法長久，但如果將銀行與高利貸相提並論，銀行的金融商品依'
  merge: -1
  img_proc: true
- pgno: 67
  md: '然非常安全、可靠而且四處通行。歷史上，只有在偶發的極端個案中，銀行才會失去客戶的金錢。


    # 五、銀行消失之後，經濟成長會變得相當緩慢


    從很久以前，銀行業者就明白，在廣大的存款中，只需要保留一小部分，因應必要用途，除此之外，銀行的借款和貸款絕對可以達成每日或即時的平衡狀態，根本不需要耗費人力搬運金錢或處理幾千萬的私人交易。


    因此，我們得到契機，平常只需要領出部分存款作為生活用途，金錢的移動成本也大幅降低。銀行有部分儲備金，加上金錢採取數位化的流動（而不需要實際搬運），讓銀行可以借出比儲備金更高額度的款项，成本更低而且速度更快。這種現象能夠創造經濟體系的交流與速度，推動經濟迅速發展。銀行經營者靠著放款以及本章提到的其他金融服務，就能創造利潤空間。這是銀行規模變得巨大無比的原因。特定銀行的GDP甚至可以與一個國家相提並論。雖然銀行絕對是全球經濟衰退的部分原因，但他們在全球經濟繁榮與發展的功勞更高。每一英鎊的存款可以創造十英鎊的貸款，請你想像銀行經濟規模究竟可以多大。


    # 六、經濟衰退時期的支援和協助將會變得更困難


    批評銀行很容易，特別是中央銀行和政府在金融危機時期的錯誤，但我們又應該如何看待他們提供的保護、保險和安全？如果中央銀行和政府沒有長期保持低利率，實施'
  merge: -1
