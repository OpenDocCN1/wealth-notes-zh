- pgno: 160
  md: '每種信念都有完全相對應的信念。你相信的每件事，都會有另一個人認為是錯的。即使你無法同意，但你抱持的每一種信念，也有另一種完全相反且確實成立的信念。


    大多數人用更多的時間擔憂金錢，而不是夢想金錢，而他們幻想金錢的時間，多過於實際去思考怎麼賺錢。


    基於某些理由，許多人將貧窮的金錢觀視為榮耀的徽章，彷彿貧窮能夠創造自尊和驕傲。在本章，我們思考且比較第一世界的極端富人和極端窮人擁有、堅持且相信的金錢觀，希望讓讀者得以理解光譜兩極的觀點，在資訊充足的情況下，做出自己的決定，選擇你相信的金錢觀，並且服務你的人生。


    「一無所有」和「貧窮」之間的差別非常重要。許多人都曾經體驗「一無所有」，但短暫的缺錢不會讓你變得「貧窮」、「一文不值或毫無用處」。一無所有只是一個名詞和


