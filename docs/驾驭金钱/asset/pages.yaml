  md: '# CHAPTER 34


    # 慈善、理想和貢獻


    世上最大的邪惡勢力和最惡劣的犯罪就是貧窮。


    詩人沙拉金尼·奈都（Saroon Nadu）是甘地的好友。她曾經斥責甘地追求貧窮的生活。據說，她甚至當面質問甘地：「你知道，為了讓你活在貧窮，其他人必須付出多少代價嗎？」沒有人知道甘地的回應是什麼，但他並未覺得被冒犯，也理解奈都的指控確實有道理。他很清楚每一次的火車旅行和預定公開的行程，都讓國家支付非常高昂的費用。百萬支持者想要見他一面，政府必須安排特殊火車，畫分隔離區，才能讓甘地基離群眾。


    查爾斯·基廷（Charles Keating）是一位美國銀行家，因為「儲蓄和貸款弊案」而惡


    —— 蕭伯納'
