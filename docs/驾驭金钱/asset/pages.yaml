  md: '加密貨幣之所以盛行，是因為難以仿造，而且可以實際融入人的生活。它是一種有機體，並非由任何國家的中央貨幣機構發行。從理論上來說，加密貨幣得以免於政府干預或企業操弄。


    由於貨幣變得非常私人，不受任何機關影響，金錢開始產生發展和顛覆的巨大潛能。交易變得更容且更快速，當中的槓桿效益，減少了商業上的必要性支出，進而挑戰銀行的利潤空間。


    交易成本降低之後，交易量、和速度都提升了。交易量增加帶來經濟成長，而經濟成長蘊藏了一股浩瀚的潛能，能夠在未來實現毫無阻力的金流交易。銀行的行為造成金流之間的磨擦阻力，因為他們控制金錢，減低金錢交易速度，並且增加交易成本，而加密貨幣可以徹底減少這些弊病。


    有些人擔心，無鈔社會可能會讓政府和中央機構得到控制權力，倘若政府干預了，反而會因為加密貨幣的特質，承擔洗錢避稅的風險和恐懼。


    事實上，讓我們享受線上金錢交易和保存資料安全的平臺，才真正擁有權力，可以駭入資料庫，修改我們的身份資料。


    金錢創新的顛覆特質，使其非常不穩定，我們也會在稍後的篇幅討論，任何型式的金錢交易都必須以信賴為前提，而信賴來自於時間和檢驗。我們還有多久才會步入完全的數位金融世界？可能比你想像中還要快。'
