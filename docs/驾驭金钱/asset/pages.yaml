  md: '金錢把創意和個人特色轉化成商品，也讓社群間能夠互相關心並提供服務，建立並加速創新的事物，並且解決世上最大的問題。


    人類最偉大的發明就是用錢來平衡自私與無私。你管理錢財和駕馭錢財的方式，深植於你的形象中，成為不可磨滅的私人資產。


    像畢卡索一樣珍視你的天職吧。像安迪·沃荷一樣把藝術和商業做結合吧。現在你知道心理學和金錢的淵源了，你已經學到更多。


    現在，是否要像那些鉅富一樣，賺更多錢、分享更多，就是你的選擇了。'
