  md: '# 如何流芳後世？


    忘的理由：「明白生命意義的人，幾乎足以承受所有的境遇。」


    從某些角度而言，找到生命意義的一瞬間，所有的折磨，也就不再是折磨了。


    生命目標和願景的力量，足以擊敗無法想像的非人道虐待。目標讓我們獲得繼續生活的力量，追求巨大財富的旅途中，我們因而能夠面對急迫的危機、艱困的生活變遷、人際關係問題以及各種變動。


    用生命的目標推動願景，我們的心靈清澈且專注，期待環境變得更好、更寬闊。


    歷史上最富裕的人，大多都名垂後世。只要擁有宏觀的願景，自然就會留下傳承。對想要追求永續的巨大財富的你來說，傳承和願景的關係相輔相成，密不可分。


    想要締造比自己本身更偉大的壯舉，讓你的願景不再只是關心個人或地方發展，而是關懷整個國家或全球未來。


    或者，我們也可以從另一個角度思考，偉大的願景可以推動你的行動，讓其他人願意支持你，創造比個人生命更長久的傳承。


    所有人的內心都希望創造不朽的精神傳承，在地球上締造永恆的改善。畢竟，沒人想要人生什麼也不留地白白走這一遭。'
