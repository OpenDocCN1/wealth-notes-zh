- pgno: 370
  md: '# 受聘


    受聘的好處是得到相對安全的生活，能用穩定的薪資支付日常花費，接受妥善的訓練和支持。這條路很明確，從大學畢業後就非常穩定，一路走到退休生活。當職員也有辦法顧到你的健康，對成家及其他方面都有益處。你或許可以找到一間新創業的大公司，獲得上述好處，被升為資深人士，領取優渥的薪資，包括股份和數百萬的分紅。


    但是，你必須花上數十年才能出人頭地。近年來，工作環境的穩定性也受到影响，許多低薪工作都不安全。在上次的經濟蕭條中，許多人遭到資遣，退休金被取消或是拿不回來。受到環境影響，我們的退休年齡很快就會變成一百三十七歲！某些產業的工作益處已經受到損害，但受聘的缺點毫無改善。受聘市場並未提高三十%的工資，藉此保障員工的風險。許多人被迫尋找第二個收入來源，在某些情況下，他們最後選擇冒險一搏，自行創業。


    現在，讓我們看一看如何善用本書的哲學，發揮最大的槓桿效果，在最短的時間內，成為一位良好的員工，發展個人職業生涯。


    # 職員如何建立槓桿


    善用本書的哲學，思考受聘帶來的好處，如何平衡員工和雇主的利益，然後用'
  merge: -1
  img_proc: true
