  md: '# 多收入來源的槓桿效果


    百萬富翁平均擁有三個收入來源，許多公司甚至更多。蘋果的產品包括iPhone、iPad、桌上型電腦、AppStore、應用程式商店、iCloud雲端和其他服務。有錢人可能都有一個主要收入來源，但卻多元分配獲利組合和事業模型，藉此鞏固財富。你可以將利潤重新投入專利開發、房地產、股票、其他公司的股份，或者善用知識，舉行演講，創造資訊產品。


    只有單一收入來源，不利於長期的財富發展。如果局勢變動，你的財富也會受到影響。倘若你想要轉換跑道，甚至經歷中年危機，單一收入來源會讓你沒有餘裕。收入來源會產生複利效果，因為你可以將利潤轉投資在其他獲利管道，繼續成長或者開發新的收入來源。建立多重收入來源的關鍵挑戰在於方法和時間。


    如果你只有一種產品，就只有一種收入。倘若你希望同時經營五個產品，就會不堪重負，無法專注發展其中任何一個收入。睿智的處理方法就是保持主要收入，但將少量時間投入額外收入。將七十％的時間和資源投入主要收入，二十％的時間和資源投入次要收入，十％的時間和資源投入第三重要的收入。七十％的主要收入增加之後，進行系統化管理，交出控制權，將原本使用二十％的次要收入，改變為主要收入工作，原本十％的第三收入成為二十％的收入，開創新的十％收入。'
