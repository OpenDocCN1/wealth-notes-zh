- pgno: 359
  md: '# 銷售的八個步驟


    以下八個步驟可以創造更輕鬆自然的銷售成績：


    一、介紹自己。面帶微笑介紹自己的身分。人與人的第一印象建立在前三秒至五秒。你的聲音、穿著、眼神、行為舉止、貼心和自信都非常重要。


    二、建立友誼。維繫關係，關心他人的日常生活，找出兩人的共同話題，就能降低銷售的難度。傾聽他們說話，尋找共同點，表現真誠的關心。


    三、理解需求。他們的主要需求是什麼？他們的即刻需求又是什麼？他們認為什麼方法最重要？尋找他們生活的缺失或問題。如果你可以改善他們的痛苦或滿足需求，就能減少銷售過程中遭到拒絕的次數。他們的需求愈深刻，銷售的難度就會愈簡單。


    四、確認並且覆選對方的需求。你必須深入了解對方的真實需求。他們提出需求或問題之後，清楚地重複一次，用言語確認。絕對不要用猜的。


    五、創造並且提供價值。替對方量身訂製解答，提供他們無法拒絕的價值。如果一個人說他的經濟能力不能負擔，沒有時間，或者沒有意願，代表你尚未表達正確的價值。在這個情況下，你應該重新確認對方的需求，傳遞正確的價值。人不會缺錢，他們缺少的是動力和欲望。如果你提供動力，他們會找到足夠的金'
  merge: -1
  img_proc: true
