  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_265_0.png)


    # 信任經濟系統


    所有的經濟系統都建立在「信任」這個前提下。金錢也仰賴信任。必須先有信任，個體、總體、地方和全球經濟才能順利運作。


    如果信任消失，經濟系統就會迅速失敗。銀行擠兌的原因是客戶失去信任，認為自己的金錢沒保障。人民不再信任政府、執政當局、銀行和警方系統，就會導致暴動和無政府狀態。資本主義是一種因應不確定未來的對策。未來愈不穩定，民眾就愈無法建立信任。


    金錢貨幣政策和社会環境都會檢驗信任指數。融資公司、個人貸款者或銀行愈信任你的付能力，讓你借款的意願就會提升。你的信用指數愈高，銀行願意提供的貸款或存款比例愈高，利息隨之降低，信用擔保條件也會減少。


    提升信任，可以減少成本與摩擦。我們無法預知未來，信用貸款就是一種賭注，為'
  merge: -1
  img_proc: true
- pgno: 266
  md: '了彌補可能的風險和金錢貶值（通貨膨脹），貸款必須收取利息。


    信任是金錢可以發揮功能的關鍵，而「利息」（interest）和信用貸款（credit）的英文原意都與信任有關。


    「利息」的字意其實來自「有興趣」。收取利息讓貸方可以處理未來的不確定性和通貨膨脹，同時讓借方「有興趣」（有意願）償還貸款金額。利息愈高，借方還款的興趣（意願）就會愈高。「利息」這個字的拉丁文原意是「彌補貸方因為借款所承受的損失」，而「信用」的拉丁文credit
    則是指「信任、相信或言行一致」。


    # 人格就是最好的擔保品


    你的人格就是最好的擔保品。你的名聲、責任感和過往的行為，只要愈沒瑕疵，他人提供貸款或投資時，要求的擔保也會愈少。


    窮人通常會誤解這個觀念，但有錢人都很珍惜且看重自己的個人行為。你的信用就是求財的履歷表，你的個人行為愈好，就能給他人帶來更多信心，增添他人提供貸款的意願。


    網路信用評比是一種反映信用和可靠度的系統。你的分數愈低，借款時就要提出更多存款證明，繳納更高的利息，還得提供擔保品。'
  merge: -1
  img_proc: true
- pgno: 267
  md: '如果借貸的信任法則遭到破壞，貸款者隨意將金錢交給別人，提供高額的貸款，意味著他們對未來的發展局勢莫名有信心。


    有時這種信心過度正面，可能是因為景氣環境或傲慢，但道理都是一樣的。


    # 信任的循環


    人對金錢的信任也會產生週期循環，從不信任轉變為信任，就像四季遞嬗。


    景氣有繁榮衰退，信任也分成「堅定不移」和「害怕擔憂」兩種。


    景氣繁榮和衰敗、經濟成長和退步，社會繁榮的高潮與低潮，財富的良好局勢和騙局，都取決於人類對其他人或制度的信任。信任為人類對當前價值是否能夠保存至未來的判斷，相信自己未來能拿回相同價值的金錢。我們應該相信別人，也要相信自己，才能讓經濟系統繼續運作。


    # 你就是活動的金錢


    雖然篇幅很短，但這可能是全書最重要的觀念。你的行為就是金錢，因為信任可以創造金錢。金錢渴望迅速流動，信任能夠減少金錢流動的摩擦，加快速度。你應該敞開'
