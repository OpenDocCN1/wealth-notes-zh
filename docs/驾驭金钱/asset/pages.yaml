- pgno: 448
  md: '生活開銷帳戶，另一個帳戶則是房地產投資、其他類型資產、房貸、保險、房租等支出收入帳戶。如果你已經建立商業合作關係，也要設定一個新帳戶，雙方都能使用，作為合資用途。每一個帳戶都要有存款，並且高於銀行每月扣繳的金額。將所有帳戶密碼存在保密應用程式中，方便使用。按照上述的建議方式設定不同的「金桶」，就完成自動化管理的銀行帳戶系統了，可以立刻在全球各地立刻妥善投資、儲蓄、管理、移動金錢。你的商業銀行帳戶都要開啟線上和手機存取功能，你能夠在任何時間立刻檢查金流和帳戶餘額。你賺到更多錢之後，就會需要更多銀行帳戶，處理更多金流。這個系統有能力管理更多帳戶。


    • 儲存硬幣：妥善儲存硬幣，會發現金額的成長速度驚人。我替小孩儲蓄一便士、二便士、五便士和十便士的硬幣，讓他們以後可以練習投資。二十便士的硬幣是特殊獎品，鼓勵我的兒子贏得高爾夫球比賽（他已經食髓知味，我必須提高獎勵）。五十便士、一英鎊和兩英鎊的硬幣則全數轉為金幣，妥善儲蓄。


    • 盡量將鈔票換成硬幣：我將五元英鎊的紙鈔換成金幣，只花十英鎊、二十英鎊或五十英鎊的紙鈔。我也喜歡將面額較大的紙鈔換成更多小鈔和硬幣，便於儲蓄。一年下來，我可以累積數千英鎊的儲蓄。我與合夥人在許多房子都準備了硬幣收納盒，也用同樣的方法處理硬幣。我們還有計算硬幣的機器，只要丟入硬幣，就會嗡嗡作響，計算總金額。雖然硬幣的相對價值很低，但可以創造無比的樂趣。這也是非常好的紀律和方法，'
