  md: '提高。以下是資產基礎模型的例子，可以作為目標參考，甚至綜合採納：


    # 房地產


    直接購入房地產，設定對事業有利的貸款方案。透過它來增加事業資產，房地產可以有效保值，提升資本緩衝空間。你還能夠銷售事業股份，交換資本、合約或者聘請顧問進入董事會。最後一種方法則是創造以資本為基礎的產品或服務，例如智慧財產權和加盟經營權。


    根據富比士的調查，全球十大新興小型事業中，有五項屬於房地產、建築、不動產和建設業。這個結果令人意外，也可說不太意外，因為房地產在數個世紀以來都保持成長。自從人類社會在一八八年開始實施稅賦制度之後，房地產每年保持1%左右的增值，包括短期的大幅波動和緩慢成長。然而，房地產領域非常成熟，五項新興事業屬於房地產領域，實在令人驚訝。在許多城市，由於移民涌入，人口增加，加上當地議會和政府缺乏妥善的發展計畫，導致房屋供給短缺，加速建設業的發展，特別是在倫敦等城市造成房價上升。


    將房地產業列為多重收入來源之一是非常好的方法，只要妥善管理房地產循環利潤的槓桿效果，就能夠創造良好的收入。房地產不容易受到景氣影響，通常也是銀行唯一接納的貸款抵押品。'
