  md: '去槓桿效果。你應該善用這個優勢。我們可以輕鬆將一個房地產的資本轉為三到五個的房地產投資方案，並且保有原本的房地產。


    # 賣出事業股權


    賣出事業股權或淨值，能夠募資投入新產品研發、聘請更多員工或行銷。你依然保有一定程度的利潤。你可能需要讓投資者看見長期穩定的獲利，或者善於銷售事業願景。新創事業則可尋找天使投資人，例如倫敦的「商務天使投資中心」和「天使之巢」。


