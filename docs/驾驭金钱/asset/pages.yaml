  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_369_0.png)


    # 要創業、受聘，還是內部創業？


    長且合法的工作賺錢之道有三種，隨著時代進步，三種方法也產生融合，分別是：受聘、創業和內部創業。


    三種方法各有優缺點。你的人格特質可能只適合其中一種，不適合另外兩種。在人格發展和商業世界中，著重男子氣概的人輕視受聘或內部創業，但這種觀點非常短視。


    你應該慎重思考自己的人格特質、知識、經驗和風險承擔能力，選擇最好、最適合且最能獲利的工作方法，絕對不要認為「另外兩個選擇比較好」。當然，你能夠先在其中一个領域發展，設定另一個目標，逐漸減少轉換跑道的風險。如果你都已經努力了二十年，那就不要輕易放棄。'
  merge: -1
