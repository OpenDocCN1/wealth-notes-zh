    # ◎良好的作業程序就是最棒的效率


    想要執行系統化工作，最優秀的實踐方式就是建立良好的作業程序。


    效率就是反覆執行系統化作業，就像處理待辦清單，從A到Z，從第一項到第十五項工作，按照正確的順序進行，並且持續分析，反覆修正錯誤。


    你能不能讓作業程序更流暢，或者縮短步驟，減輕作業負擔，甚至創造槓桿效果和經濟成長？


    請讀者至少一個月用一天的時間，仔細思考，不要從事任何工作，核對事業的關鍵績效指標，管理各項帳戶，計算所有的利潤和損失，並且分析原因。


    金錢藏在細節中，你也可以請求一位事業更有成就的朋友，擔任「私人董事會的隱形執行長」，集思廣益，檢查所有缺失，降低成本並且增進收入。


    # ◎決策


    如果你希望事業成長，就不要妨礙自己。我必須承認，這是非常難以達成的挑戰。


    倘若你的事業仰賴自己的知識，你就是事業的核心人物，代表你正在妨礙事業成長。


    你不仅需要建立槓桿效果和自動化作業，更重要的是，你必须让关键的团队成员进行决策。如果你不让他们决策，代表他们永远都要请示你的意见，其实跟你亲力亲为没两样。'
