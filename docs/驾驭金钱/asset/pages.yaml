- pgno: 87
  md: '將熱情轉化為職業、志向變為假期，觀念變成現實，並且與其他人進行交易。全世界的水錢無窮無盡。你準備好要好好賺大錢了嗎？


    # ◎ 金錢的本質


    金錢本身並沒有什麼價值，只有政府與人附加的價值。我們會在稍後的章節討論你的個人觀念、情感與習性如何影響個人收入（也就是個人 GDP）。


    成功創造巨大財富的人，不會受任何人影響而改變自己的金錢觀。他們擁有足夠的智慧，能夠看穿所有的影響、誤解和非理性的因素，清楚地理解金錢的本質。只要你也能做到，就可以清晰地發現金錢的可預期運作模式，並且理解這些人如何用錢。


    在當前的法定貨幣資本主義系統中，金錢的本質傾向於符合以下的法則與運作模式：


    # 一、金錢隨著時間貶值


    由於通貨膨脹，金錢隨著時間產生相對貶值。通貨膨脹是指價格以平均且普遍的方式提高，金錢的購買能力下降。


    > 「平均」是指每一種產品和服務的價格都會上升，購買價值也提高了。今天的金錢比明天的金錢更有價值，這就是所謂的「金錢的時間價值」。人類不再以貴重金屬作為'
