  md: '名昭彰。他捐贈了一百二十五萬美元給德雷莎修女，也是主要的資助者。已故的英國媒體大亨羅伯特·麥斯威爾（Robert Maxwell）同樣鼎力資助德雷莎修女的理想。雖然麥斯威爾因為一九七一年的退休金弊案，被抨擊為「世紀騙徒」，但德雷莎修女毫不在意收取他的資助金，因為她相信「我能夠讓這些金錢發揮良善的用途。」


    我想強調的重點是，所有的慈善事業、捐款和貢獻，都來自於資本主義系統和精通信資本運作的大師。世上所有偉大的慈善事業家都非常富裕，或者就像甘地和德雷莎修女一樣，刻意選擇貧困的生活風格，但接受有錢人的資助。富人創造了興盛的私部門，私部門提供的富裕資金和稅收，才能建立運作良好的國家機構。以下是更多相關的例子：


    +   成吉思汗的蒙古帝國據說是歷史上版圖最大的帝國之一。歷史學家相信，雖然成吉思汗擁有崇高的權力，從未私自占據財富，而是分享給將軍和士兵。


    +   洛克斐勒捐贈了超過五億美元，協助各個機構推行教育、宗教和科學發展，甚至創辦芝加哥大學和洛克斐勒醫學研究中心（現在的洛克斐勒大學）。一九〇七年，洛克斐勒在十二分鐘之內，協助摩根完成歷史上最大的銀行紓困案，一共籌得兩千五百萬美元。在現代社會，只有美國中央銀行願意出手相助，才能提供如此大規模的財務協助。


    +   卡內基在美國和英國成為慈善事業的領導者。在生命最後的十八年，卡內基捐贈了高達三億五千萬美元，協助慈善事業、基金會和大學機構，並且特別強調善款的用途。'
