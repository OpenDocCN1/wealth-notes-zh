    # 過渡貸款


    過渡貸款非常昂貴，但可以快速填補金融缺口。如果你必須盡快取得現金，完成一項計畫，過渡貸款是一個選項。倘若你已經有其他妥善的應對方案，只需要迅速拿到現金，過渡貸款非常好用。然而，由於過渡貸款的利息高達每個月二%、三%，甚至更高，只適合短期資金需求。


    # 群衆募資


    群衆募資平臺可以讓你接觸一般民眾，在符合平臺的規定下，聯繫借貸雙方，凝聚資金和投資意願。你可以具體說明投資風險，增加民眾投資意願。一般而言，小額的借貸金額不必提供擔保品。這些平臺服務和應用程式讓群衆募資變得更簡單，也更有利潤。特定產業的群衆募資平臺也開始出現了，例如房地產。'
