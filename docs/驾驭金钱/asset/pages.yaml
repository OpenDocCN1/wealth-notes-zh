- pgno: 406
  md: '# # CHAPTER 44

    ## 亙古不變的賺錢之道


    雖然許多人認為賺錢很難，但我相信世上存在許多機會。本章的重點不是最新的賺錢潮流。曇花一現的方法不久就會被淘汰。真正的商業模式或賺錢機會必須長久維持，創造動力和複利效應，並且遵守本書提及的賺錢哲學。


    有些模式雖然賺錢，但你不會喜歡。另一些模式，你喜歡但不會賺錢。還有一些商業模式兩者兼具。想要成功，就要找到這個商業模式。你必須自問：


    +   1. 我如何成為這個商業領域的佼佼者，甚至是最傑出的人？


    頂尖人物具有極可觀的收入。錢來得快也去得快，但經驗和知識不會消失。妥善應用知識，就能獲得力量。在特定的商業領域中，擁有最多知識的人，能夠獲得比例驚人的收入。'
  merge: -1
  img_proc: true
- pgno: 407
  md: '職業拳擊手的平均薪資是七萬五千七百六十美元。米格爾・庫托（ Miguel Cotto）是歷史上單一拳擊賽事收入最高的第十名，可以賺到八百萬美元。他的收入高達職業拳擊手平均收入的一百〇六倍。世間萬物都不平等。如果你認為職業拳擊手擁有的是「技巧」或「天賦」，而不是知識。讓我們看看律師的薪水。根據相關資料，全球收入最高的律師身價為一百七十億美元，是第十名的兩百一十二．五倍。收入最高的律師擁有的知識，確實可能高於收入第十名的律師，但不可能超過十倍。


    如果你投入時間，努力學習，專心成為專業領域中的頂尖人物，也很可能賺到優渥的金錢、控制權和生活自由。甚至能夠發揮槓桿效果，選擇名利雙收、生活自由的專業領域。


    # （二）我能不能找到熱情所在，而且不會覺得工作無聊？


    放下無法賺錢的憂慮，思考自己真正熱愛的事物。鉅富和幸福的的人都有一個共通點：他們大部分時間都在做自己喜歡的事。你的熱情會散發吸引力，讓別人願意付錢購買你的產品或服務，支持你實現目標和理想，因為你促進人類社會的進步。


    # （三）如果錢不是問題，我想要做什麼？


    如果錢不是問題，工作就像度假一樣開心，你想要做什麼？什麼目標讓你覺得「我很快樂，根本不辛苦」？哪些目標讓你發揮最好的一面？讓其他人獲得啟發？你最大的優點是什麼？仔細思考，找出答案，建立真正的事業。'
