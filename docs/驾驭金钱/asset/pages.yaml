  md: '需要投入時間、點數、里程數，或者捐出信用卡的獎勵。這種消費方式和物質生活算是間接的慈善行為，可以透過初次交易來做慈善。如果你認為行善很重要，那麼以上都是非常睿智而且合乎倫理的選擇。


    藉由消費、直接和間接的慈善行為，物質主義者也可以成為精神主義者，創造就業機會、促進經濟發展，以及增加社會福利。購買行為的直接稅收（英國的增值稅），以及其他間接的貢獻，例如聘請員工（國家保險）、企業稅、其他企業義務和隱形稅。消費可以促進經濟發展，保持社會經濟的穩定運作，所有人都可以努力工作，讓所有「精神主義者」享受住家和其他社會福利支持。


    人並非完全屬於物質主義（貪婪）或精神主義（犧牲奉獻）。物質主義和精神主義以多種形式相輔相成，並且保持均衡。


