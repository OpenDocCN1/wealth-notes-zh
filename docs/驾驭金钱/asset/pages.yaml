  md: '聘請傑出的人才，讓他們理解你的願景，允許他們犯錯，支持他們而不要控制他們，更不能妨礙他們！


    # 四、人力資源槓桿


    建立人力資源槓桿的重點，不是聘請員工擔任你的跟班。許多企業經常產生錯誤認知，我以前也曾經如此。


    我們誤以為員工「替我們工作」，我們支付「他們的薪水」，所以他們必須「聽我們的指令」。這種想法就像我們認為自己是家長，所以小孩應該要聽話。如果你曾經對員工使用「我是老闆」的王牌，你可能已經失去他們的信任，甚至造成憤恨不平的情緒。


    人力資源槓桿的關鍵在於建立合作、情感和良好的關係，而不是薪水或聘僱關係。


    將每一位員工視為潛在的合作伙伴或承包商，建立公平交易的槓桿，他們的專業技能和職位使你獲益，而你則提供薪水和良善的對待。


    人力資源槓桿的核心是提供明確的遠景，領導員工追求理想，給他們希望、信念、收入和安全感，讓他們覺得自己受到重視。


    你和員工可以互相服務，就像是合作關係一樣，而非權力關係。想要用其他人的時間和專業技能建立最優秀的槓桿效果，關鍵就是良好的人際關係。


    聘請員工、顧問、承包商或建立合作關係時，所有的員工，包括個人助理、數位助'
