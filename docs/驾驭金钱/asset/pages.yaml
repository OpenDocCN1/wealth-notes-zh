  md: '資訊銷售事業非常容易發展，因為你可以善用光纖網路的槓桿效果，觸及全球市場，成本非常低廉。「資訊行銷」是一種現代產業，專門銷售重要的資訊，全球產值超過一千億美元，比前一年增加三十二．七％。在過去二十年，線上媒體的銷售量出現顯著成長。Angs.網站擁有超過二十萬本有聲書，Tune.在二〇一三年賣出兩百五十億首歌曲。


    網路資訊和課程幾乎沒有固定成本，唯一的成本就是創作。你可以用自家電腦創作音樂，或者把對世間的不滿和推文包裝成商品，經由免費使用的社群網站，只消一秒，就能接觸數十億的客戶。你還可以設置線上商店，不必任何成本，隨時準備就緒，使用PayPal等電子商務平臺進行金錢交易。資訊事業的成本非常低，不用儲備貨物或者支付經銷開銷，在家就能立刻創業，不需要房地產，隨時隨地享受廣大的全球客戶。


    除此之外，你可以販賣同樣的低成本資訊內容數百萬次，沒有任何的「下儲存貨」限制。重新包裝資訊，推出線上版本、實體書、CD、DVD、Kindle、iTunes……等付費線上平臺，或者在研討會、導師教學、智囊團會議和商业休養中心進行販售。就像這本書，創作一次之後，賺到許多次的收入。一旦產品完成，就能產生數年、甚至數十年的循環被動收入，創造熱潮，讓經銷商和合作夥伴大發利市，甚至受到社群網站狂熱者的轉載分享。資訊和觀念行銷或許是最好的槓桿應用，發揮時間的價值，用最少的成本創造最大的收穫。'
