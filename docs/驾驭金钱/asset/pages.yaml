  md: '缺乏金錢造就了一種惡性循環，我們必須努力工作才能生活，卻無法真正地享受生活。缺乏金錢引發的問題，加上債務與種種不快樂，共同形成可怕的惡性循環，以及恐懼、嫉妒和悔恨等負面情緒，甚至引起危及生命的健康議題。


    我們絕對不該陷入貎鳥心態，以為無視就能解決缺乏金錢的問題。我們應該挺身而出，努力解開過去相信的錯誤貧窮觀念，直到形成健康的新觀念為止。


