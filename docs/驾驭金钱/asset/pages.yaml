  md: '# Chapter


    # 7


    # 金錢無法使你快樂？


    大家都說，金錢無法使你快樂。遺憾的是，金錢確實可以讓你快樂。在過去十年來，我從沒有聽過有百萬富翁或億萬富翁說「金錢無法使他們快樂」，而我認識更多的有錢人，樣本數絕對足夠證明這個論點。我也從未聽過哪位有錢人說：「羅伯，請把我的錢全部拿走，金錢讓我不快樂。」


    我猜想，只有第一世界的窮人才會相信這種說法。那是一句極富文化影響力的名言，讓數百萬人信以為真。


    然而，倘若窮人根本沒有錢，或者不看重金錢的價值，又怎麼有辦法證明金錢無法使人快樂？這就像小孩說他們不喜歡他們沒吃過的食物一樣。


    根據密西根大學研究部門提出的一份報告指出，金錢的三種常見觀點如下：


    +   一、人最擔憂的事物：金錢。'
  merge: -1
  img_proc: true
