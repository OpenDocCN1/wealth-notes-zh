- pgno: 44
  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_44_0.png)


    # 有錢人只會變得更有钱


    你一定聽過許多人爭論：「為什麼有錢人變得更有钱，窮人變得更窮？」許多人也會因此相當不悅，要求政府採用各種平衡補償措施，例如增加稅賦、設立工會，以及慈善捐贈。


    然而，簡單的經濟學法則就能解釋為什麼有錢人變得更有钱。經濟學的基礎原理可以破除富翁之分的迷思（當然只適用第一世界）。你一定要知道，有錢人明白這些原理，藉此發揮槓桿效果，而窮人不懂，只能成為槓桿上的籌碼。


    # 常識


    一般常識相信，事物順著原本的方向移動時比較輕鬆，轉變方向較為困難。你可以'
