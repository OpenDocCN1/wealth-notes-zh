- pgno: 414
  md: '回收能源業、科技業、藥品業和探勘業，以及經過時間考驗的成熟領域，像是健康照顧、保險、食品和居住安全。只要人類依然保持本性，就要滿足需求，創造改變世界的科技。


    馬斯洛（Maslow）提出的理論認為，人類有五種不同等級的需求，其中四種需求是「匱乏需求」（deficit needs），如果無法得到滿足，就會產生追求的動機。不滿足的時間愈長，動機愈強烈。每一級的需求，都必須先滿足前面的需求。人類已經進步，即使在第三世界，也能滿足最基礎的需求。第五種需求（成長需求）變得愈來愈重要。不是人都可以實現更高層次的成長需求，也就是實現自我、完成生活目標。馬斯洛的五種需求等級為：


    第一級需求：生理需求（食物、水、溫暖、休息）。


    第二級需求：安全（居住安全、生活平安）。


    第三級需求：歸屬感和愛（親密關係、友誼）。


    第四級需求：自尊心（名譽和成就）。


    第五級需求：自我實現（實現潛能和創造力）。


    滿足上述任何需求的事業都會成長。服務生理需求的專業領域能夠持續發展，但能已達飽和。沃瑪超市提供食物，員工人數為全球第三，只有兩個政府部門的人數比沃瑪超市更多，其中之一就是滿足安全需求的美國國防部。然而，如果第二級的安全需求受到威脅，也無法滿足第一級的生理需求。保險產業非常巨大，因為它滿足了第二級的'
  merge: -1
  img_proc: true
