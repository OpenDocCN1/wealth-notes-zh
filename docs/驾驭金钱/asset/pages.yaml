  md: '影響力，締造正面的改變和貢獻，造福許多人。他們的行為效法歷史上最富有的人（我會在稍後的篇幅詳盡介紹），絕對不會被視為邪惡又貪婪的企業家。穿著西裝的典型貪婪企業家已經過時了。創造重大改變的偉大人物都會突破既有界線，連結全球能量，解決具備重大意義的問題。


