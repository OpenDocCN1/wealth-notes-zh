- pgno: 92
  md: '# 貨幣的流動和循環


    ![](img/a9d3aeae93c5ae3f9baf5963e137b74a_92_0.png)


    根據《牛津英語字典》，貨幣是一種「（在特定的國家）經常使用的金錢系統，受到廣泛的接納和流通」。紙鈔貨幣和硬幣貨幣就是流通的金錢。


    所有的貨幣都是金錢，但並非所有的金錢都是貨幣。貨幣（currency）的文字起源就透露了其意義。Currency 來自古老的法文 courir，意思是「奔跑、富有生命、熱切、迅速」（corant
    是 court 的現在分詞，意思就是「奔跑」）。除此之外，在歷史上，貨幣（currency）一詞的定義也是「流動的狀態」（即 current）。


    貨幣的詞彙意義可以協助我們理解金錢流動的特質和行為。金錢能夠持續流動和交換時，經濟系統方能順利運作。倘若人人都將現金藏在床下，金錢流通就會減少，速度也會變得很慢，就是所謂的「節儉悖論」（paradox
    of thrift）。


    儲蓄固然聰明，但如果所有人守著金錢，金錢流動就會乾涸。節儉悖論因為名聲遠'
  merge: -1
  img_proc: true
- pgno: 93
  md: '播的經濟學家凱因斯 (John Maynard Keynes) 而家喻戶曉。節儉悖論認為，經濟衰退期間，人人試圖增加儲蓄，導致總體需求減少，不利於經濟成長。經濟若要成長，金錢必須流動。因此，各國中央銀行都會在經濟衰退期間印製更多鈔票，藉此促進金錢流動。


    雖然機率相對較低，但民眾害怕通貨緊縮時，也可能產生節儉悖論心態。倘若節儉心態發展至最極端的狀態，我們或許會回到以物易物這種非現金交易。以短期小量的角度而言，儲蓄確實可以增加金錢價值，然而，儲蓄行為發展至極端，反而會大幅減損金錢價值，因為金錢的本質就是流動並且移轉能量（並非創造或摧毀，而是流動）。


    # ◎讓金錢自由流動


    停滯不動的金錢，算不上是真正的金錢。金錢必須流動，才能發揮其真正功能。因此，儲蓄、保存或堆積金錢無法讓你或經濟系統變得富裕。隨著時間流逝，通貨膨脹將減損金錢的價值，金錢的能量也會陷入潛眠。


    如果金錢停滯不動，服務和價值將無法進行交換和給予。金錢原本是一種承載或傳遞能量、價值、交換和交易的有效媒介。直到衰退或不再流動之前，金錢應該不停流動千百次，就像傳遞資訊的光纖網路。許多人可能會對這點感到驚訝。假如一張鈔票的面額是五十英鎊，其真實價值應該是五十英鎊乘以它在英國和全球經濟市場的流動交換次'
  merge: -1
  img_proc: true
- pgno: 94
  md: '數，這就是所謂的金錢速率。


    五十英鎊鈔票的使用期限大約是四十一年，其材質才會衰退，不適合繼續流通。英格蘭銀行預估，新的分子聚合物取代傳統的棉化合物之後，鈔票的使用耐久度大幅提升，可以使用超過一個世紀。


    倘若你愈來愈擅長長周轉金錢，發揮流動、轉換價值、交換和交易能量等功能，就是讓金錢擁有生命，實現金錢的本質與目標，你也將因此獲得豐厚的獎勵。金錢喜歡速率，厭惡阻力。阻力愈大，就會減少金錢的流動（或者降低流動速度），阻力愈小，金錢流動的速度愈快，流動量也會增加。貨幣就像一種液體資產，能夠迅速地轉化為可預期的現金價值，只有你能夠定義並且支配其液體特質。


    # 開創錢流


    我的其中一位導師曾經說過，走進餐廳時必須立刻給予優渥的小費，不能在用餐完畢後才給。


    起初我非常抗拒這個建議，因為我沒有足夠的財力，而且我希望先享受良好的服務，再決定要支付多少小費。我的反應顯示出我對金錢的本質和法則理解非常有限。改變態度之後，金錢流動立刻替我帶來可觀的價值，令我非常驚訝。導師的建議透'
  merge: -1
  img_proc: true
- pgno: 95
  md: '過更好的服務、口碑相傳及感激之情，締造了一連串的能量效應，讓我得到更多金錢。


    一開始，想要採用導師的建議確實需要鼓起信心，但它符合金錢的真實特質，也是讓金錢加速流向你身上的唯一方法。金錢的阻力來自於我原本的頑固想法，導師非常清楚。清除了阻力之後，金錢終於能夠從我身上向外流出，再回到我身上。


    儲蓄當然是一種良好的理財方法。我們不可以浮誇地把所有錢都送給別人，但你將在稍後的篇幅發現，儲蓄只是追求富裕的七種方法之一，如果不能融會貫通其他六種方法，那麼你就發不了財，只能勉強應對通貨膨脹，就算銀行帳戶累積可觀的儲蓄金額，你也難以發揮金錢轉移能量和高速流動的槓桿效果。


    # 自然世界不喜歡真空狀態，也會填補真空


    亞里斯多德曾經說過：「自然世界厭惡真空狀態。」他的結論來自於觀察，他發現「自然世界希望各個角落都能盈滿，就算只是填滿無色無味的空氣」。因此，亞里斯多德的重點在於，空無一物的空間違反自然和物理法則。


    自然世界不該有真空狀態，因為周圍豐富的物質會立刻填補空無。空無即是一無所有，因此空無之處沒有任何「存在」的理由。金錢也適用同樣的道理，因為金錢符合自然法則，所以厭惡真空狀態，也會填補真空。'
  merge: -1
  img_proc: true
- pgno: 96
  md: '由於世上不該有真空，金錢就會持續移動。我或許可以描繪自己在二〇〇五年時的銀行帳戶就是一個「真空虛無，只有無色無味空氣的空間」（雖然這種說法不甚美好），但當時的我確實善良地填補其他人的金錢真空，而我的空間則充滿了債務，真可惡。


    上述的自然法則是讓金錢與貨幣持續流通的部分原因。你可以藉由這個自然法則發揮槓桿效果，因為所有的觀念、服務、解答、產品、銷售與承諾，都是潛在的真空狀態，能夠吸引「周圍豐富的物質」，也就是你的金錢和更多的金錢。就像空氣和水，金錢也具備持續流動的特質。你只需要開門迎接。


    # ◎真空富裕法則


    倘若你希望吸引更多物質財富，應該立刻創造一個符合自然法則的空缺。例如，想要新衣服，你必須上網賣掉舊衣服，或者捐贈至慈善單位；如果你囤物成性，就沒有任何空間吸引新的財富。這就是所謂的「真空富裕法則」。


    你在生命中渴望追求的事物都需要空間，因此，你必須找到空間。這個想法適用於任何物質事物，但同樣能夠應用在心靈空間。倘若你不情願地支付帳單，你並未創造真空，因為你的內心充滿不悅。


    你應該清理情緒和周圍的生活空間，不光是得到收入，即使支付帳單時，也要心怀'
  merge: -1
  img_proc: true
- pgno: 97
  md: '感激。


    無論內心思緒或外在生活空間，都應該捨棄「積少成多」的成見。囤積只會阻礙財富。微薄的收入難以締造豐厚薪资。抱怨使你無法心懷感激。一杯盛滿的水，不能注入更多水。你可以發揮真空富裕法則的槓桿效果，相信自己創造的真空能夠吸引財富和金錢。


    # ○ 金錢熱愛快速流動


    雖然，你已經知道金錢熱愛快速流動了，但我會刻意在本書中反覆強調這個重要的概念，讓你的心智準備就緒，迎接即將自然孕育美好結果的財富，因此，請你不要在亞馬遜書店網站給我一顆星的評價，指責我重複提到重要的基礎原則。


    金流速動和GDP等經濟學觀念顯示了一個道理：金錢的流動速度愈快，經濟成長的情況愈好。


    儲蓄停論則讓我們明白，過度儲藏金錢或減緩金流速度，只會導致經濟成長緩慢或萎縮。你自身的成長與財富亦是如此。想要追求更大的財富，關鍵並非儲蓄的程度，而是創造了多少金錢與能量的流動。


    世上最富裕的人不光只是擁有最多金錢，他們還加速了自己和周圍的金流速度。如'
  merge: -1
  img_proc: true
- pgno: 98
  md: '果你以為他人的「收入」只是「儲蓄」的一環，你錯了，他們的收入並非儲蓄，而是以愈來愈快的速度持續金錢流動。


    舉例而言，想要建立一百萬英鎊的「儲蓄」，比較理想的實現方法是隨著時間經過，逐漸讓金錢反覆進出你的帳戶，支出投資、再回到你的帳戶，如此周而復始，金錢進出的額度將會慢慢增加，最後締造可觀的資本總額。一百萬英鎊的目標，可能讓你創造一億英鎊的個人生產總額。


    # 金錢並非從你而生，而是藉由你而流動


    金錢不會從任何事物而生。販賣產品、電匯或嵌在牆中的自動提款機都可以讓我們「取得」金錢，或者，如果一個人擁有良好的金錢知識，也可以仰賴資產而取得金錢。


    但是，人類打造了印製金錢的機器，金錢的本質是反應並且服務人性需求——因此，所有的金錢來自人類，而非其他事物。


    但「金錢來自人類」只是一種單向觀點，也是必須去除的成見。世界知名的演說家和個人成長教練鮑伯·普羅克特（Bob Proctor）曾說過：「金錢並非從你而生，而是藉由你而流動。」假設你每個月都會收到一筆固定的收入，付款方式可能是電匯。你在對帳單看見收入明細時，或許會認為錢來自於銀行。事實上，這筆款項來自支付方的人力'
  merge: -1
  img_proc: true
- pgno: 99
  md: '資源部門，他們獲得產品銷售部門、執行長或公司負責人（也是可以控制公司金流的人物）的同意之後，支付你的薪水。但他們的金錢來自消費者或客戶。消費者或客戶的金錢則來自於家人、其任職公司老闆、配偶或貸款。因此，金錢在人類之間流動，而非從人類身上誕生。普羅克特提出的「藉由你而流動，而非從你而生」其實就像「六度分隔理論」（six
    degrees of separation） 1


    # 六度分隔理論—或者，三、九分隔理論


    六度分隔理論認為，地球上的任何一個人，只要從認識的人開始建立人際網絡，最多不超過五個人，就能夠與地球上最遙遠的另一個人，建立人際關係。舉例而言，你的朋友可能認識另外一個朋友，而這個朋友的朋友還有一個朋友，最後這個朋友認識凱文．貝肯（Kevin
    Bacon）。因此，六度分隔理論也被稱爲「凱文．貝肯的六度分隔理論」。


    為了重現一九四○年代的著名實驗，實驗者撰寫了一個程式，將四十個包裹隨機寄給全球四十位民衆，請他們以「認識名字的朋友」爲基礎，藉由人際網路將包裹隨機寄給一位住在美國波士頓的科學家馬克．維達（Mark
    Vidal）。最後有三個包裹成功寄給維達，平均需要六個轉寄者。


    隨著時代科技發展，現代社會會愈來愈仰賴社群網絡，微軟在即時通（Microsoft'
  merge: -1
  img_proc: true
- pgno: 100
  md: '（Message」）的一，八億使用者創造的三百億句網路對話中進行檢驗。研究者發現，隨機挑選兩位使用者，平均只需要六，六次的人際分際，就能建立他們的人際關係。臉書的研究也發現「世上的每個人一在臉書上只需要三、五次的人際分際，就可以建立人際關係。由於社群網路仰賴光速傳輸的網際網路，世界變得愈來愈小。社群網絡人際連結的研究者認為，連結兩個人的平均分隔數字，無論連結對象是誰，居住地對點在何處，都不再是六，而是三．九。


    既然金錢藉由人際網路流動，而你與任何人之間只有三．九至六次的分隔距離，因此你與世上所有金錢之間的距離遠比想像的更近。


    第一次的人際分隔可能無法使你獲得金錢，但第二次、第三次或許能夠成功。太多人因為第一次人際分隔的失敗，形成了短視的金錢觀念，其原因可能包括遭遇到拒絕、並未尋求他人推薦、過度強硬推銷、過度軟弱推銷，或者只是無法看見全球人際網路的六度分隔關係。


    如果你與第一位人際分隔者互動時，能夠記住你與人之間的距離如此緊密，在對方心中留下深刻的印象，你的金錢心智觀念與技巧可以得到何其美好的成長。放下短視近利，不要執著在第一層人際分隔時成功銷售商品或取得金錢，而是看見貨幣、金錢能量的流動以及交換，例如：


    +   • 提升你的名聲。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '下的觀念也會產生改變：


    +   - 提升財務收入。

    - 推銷商業觀念。

    - 資產和不動產成交機會增加。

