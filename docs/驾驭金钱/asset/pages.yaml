  md: '速度，貢獻政府稅收，讓民眾得到希望、信仰和鼓舞，為衆多人提供服務。窮人只能仰賴有錢人而生存。幾乎全球的財富都集中在私人手中，根據托瑪．皮凱提（Thomas
    Piketty）在《二十一世紀資本論》（Capital）提出的資料，私人掌握的財富高達全球財富的九十九%。


