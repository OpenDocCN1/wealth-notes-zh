  md: '維持銷售和服務。價格和價值提高，銷售也會增加，吸引更好的消費者和推薦人，增強自我價值。請投資自己，原諒自己和其他人造成的錯誤與傷害。允許自己提出公平的高價格，就會找到重視服務價值的高品質客戶。


    持續提升自己，解決更大的問題，和重視你的朋友相處。愛自己的本性，而不是汲汲營營模仿他人。不要為了未來的信譽和成績，延後實現價值，甚至放棄眼前的努力。讓全世界看見你的獨特，允許其他人享受你的才華。


    # 三、在乎金錢


    允許自己熱錢、賺錢，分享錢。謹慎計算並且追蹤分析你的淨價值。注意個人財務、利潤空間、損益。替工作設下專屬的關鍵績效指標。擺脫所有的罪惡感、羞恥心，以及害怕被人批評愛錢的恐懼。


    金錢只是這個世界處理公平價值交易的機制。學習如何投資，理解金錢管理系統，讓金錢照顧你的生活。培養並且改善金錢知識和金錢關係。


    教導你的孩子認識金錢哲學，也讓不瞭解你的人有機會學習。建立良好的付款系統，迅速取得公平的報酬（～薪資）。不要貶價販賣自己的價值。'
