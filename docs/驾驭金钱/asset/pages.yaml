  md: '人，替更多人解決重要的問題。


    他們的旅途沒有終點，累積的財富也沒有上限。渴望建立服務的決心與獲利的目標結合，成就了永垂不朽的傳承。雖然他們都成為鉅富，但他們的行動不只是為了賺錢，還是為了留下美好的回憶，並且追求自己的歷史定位。


    這些鉅富面臨了全球性的挑戰，但他们總是用宏觀的視野看待挑戰，而非一味排斥。他們解決全世界最嚴重的問題。他們看起來像是在執行不可能的任務，好像這就是他們的使命一樣。他們把「服務」、「規模」和「問題解決」這三個要素合而為一。


    歷史上最富裕的兩位大亨分別是約翰·洛克菲勒（John Rockeﬁller）和安德魯·卡內基（Andrew Carnegie）。洛克菲勒的財產總值為三千四百一十億美元（一九一八年的十五億美元），卡內基的財產總值則是三千七百二十億美元。洛克菲勒控制美國九成的石油生產，希望藉此向全美人民和全世界提供優良的服務。卡內基可能是美國歷史上最富裕的大亨。一九〇一年，他以四億八千萬美元的價格，將美國鋼鐵賣給摩根家族，這個金額甚至高於全美國內生產總額的二·一%。卡內基顛覆了鋼鐵產業，打造一座巨大的鋼鐵工廠，面積超過八十座美式足球場。一九〇〇年時，卡內基鋼鐵每年生產一千一百萬公噸的鋼鐵，製造二十萬個就業機會。


    提高你的視野層次，克服內心的恐懼，就可以創造偉大的財富。這些鉅富開疆闢土，底下養了數千名員工，還有數百萬人接受他們的服务，也有遍及全球的難題要克服。但'
