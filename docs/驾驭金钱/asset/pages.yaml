  md: '我以前習慣買很多知名設計師品牌的衣物。我父親說過，人一次只能穿一雙鞋子，但我的人生卻需要十雙傑佛瑞·韋斯特（Jeffrey West）的名牌鞋。諷刺的是，我根本無法負擔名牌衣物的高額費用。我還在爸媽的酒吧工作時，每個星期會有一小筆的進帳。我一拿到薪水，就會立刻前往附近的设计師服飾店，把所有的錢揮霍在最新的服飾上。就算衣服不合身，只要它很明顯是名牌，我就會照買不誤，完全是在揮霍辛苦賺來的錢。


