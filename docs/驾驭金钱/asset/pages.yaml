  md: '只有到了盡頭，我們才能享受最美好的槓桿成果，而且必須先付出努力。你希望建立巨大長久的財富，必須懂得如何將眼光放遠。


    # 萬丈高樓平地起


    如果你有研究過太空梭的燃料，就會發現太空梭從地面起飛時，需要耗費一半的燃料，太空梭離地一英尺時已經用完九十六．二％的燃料。太空梭啟動之後的短短幾秒鐘，就要用全部的燃料了。


    換句話說，太空梭需要的燃料主要都用用在起飛這段過程。太空梭只需要剩下的少部分燃料，就可以探索無垠的宇宙和回到地球。建立財富的道理也是如此。


    從地面開始建立基礎需要最多的能量。靜止的物體傾向於靜止，我們必須努力推動這個物體，才能減輕往後的負擔。


    要把這個現象當成是阻力還是助力，完全是看你怎么想。萬事起頭難，但快到終點時，反而愈來愈輕鬆。一開始勢必得付出比較多，但能藉此減輕後續的競爭和負擔。


    如果你正在經營利基事業或創業，在單位時間之內，金錢和時間的關係的確不成正比。一開始，你必須付出最多心力，處理最低層級的工作，取得實際的結果。雖然很不公平，但時間本來就不公平。'
