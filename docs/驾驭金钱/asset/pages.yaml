  md: '公平交易並且促進經濟投資發展。


    有的時候，市場中的企業龍頭違背了反壟斷法，少數企業甚至也會靠非法手段賺錢。然而「真金不怕火煉」，消費者會用實際的行動來改變市場，根據企業提供的價值，購買良好的產品或服務。富人得到優渥的金錢，卻也得面對艱困的挑戰與掙扎。隨時間過去，市場會漸趨平衡。


    如果任何創業家或企業濫用權力，社會也有自我管束的功能。消費者可能會大舉離開，法律和管制行動會約束這些企業的行爲，甚至引發大規模的爭議。比如．蓋茲就曾強迫自己進行慈善事業。


    在最極端的情況下，創業家和企業的不良行爲，可能導致牢獄之災或人身安全問題。但是，讀者不該因此畏懼，只要在自私和人道關懷之間取得平衡，就能勇敢拓展自己的事業規模。


