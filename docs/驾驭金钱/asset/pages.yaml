  md: '重。

    如果經商者藉由適當的協助、保護、稅務制度以及動力，得以創造公平的利潤，而且市場保持公平競爭，價格能夠自我管制，系統也可以順利運作。等一等，這不就是我們說的資本主義嗎？對賭徒而言，良好的教育和協助可除賭癮，可能會比簡單的金錢補助更好。雖然這個例子有點極端，但絕大多數的人處理金錢的方法，都像賭徒一樣，只是得過且過，浪擲金錢。我們的學校和社會必須提供正確的教育，讓人理解如何管理並且精通金錢，而不是單純地重新分配財富或提供補助，反而降低人們工作和奉獻一己之力的動力。


    # 樂透重分配


