  md: '一定程度的金錢之後，才能增加投資組合。投資金額逐漸提高，也要注意避免風險，例如投資低風險低報酬的資產（黃金和債券）。隨後，你可以逐漸嘗試高風險的投資，包括不熟悉的熱門產業、特定的高風險股票、更昂貴的房地產或者附加服務（聘請租管理人處理房地產等等）。


    # ⑤嘗試高風險投資


    許多投機客以為自己是投資人。投機是超高風險的投資，獲利空間也非常可觀，但你必須夠承受損失。沒有足夠的投資經驗，貿然從事投機事業，就像沒有相關知識就直接創業，你可能會血本無歸。


    唯有經驗和技巧充足，建立多層次的投資組合，擁有風險等級各異的投資方案，可以妥善保護自己免於損失慘重後，才可以嘗試高風險的投機行為。


    它可能是你不了解但非常想要嘗試的投資，波動起伏很大的領域，或者毫無實際成果的新興科技。巴菲特不了解科技領域，所以從來沒有在那斯達克股票市場投資科技業。事實證明，他非常睿智。許多特殊的商業模型和資產類型，都需要投資人具備獨特的專業知識，才能創造美好的利潤，例如手錶、酒品和藝術。除非你可以證明利潤空間，否則這些領域看起來都非常危險。仔細理解艱困的投資領域，可以避免投資淪為投機。


    一旦你擁有充分的姿勢，才能降低風險。


    有時你必須依賴直覺，就跟賭博一樣。有些人說服自己相信賭博是一種投資，事實'
  merge: -1
  img_proc: true
- pgno: 452
  md: '並非如此。只要穩定建立多層次的美金使用方法，確實有適合投機一搏的時空條件。投機需要很多金錢，也要妥善控制情緒。


    # ⑥ 避險


    避險是一個好問題。有錢之後，這個世界就會想要和你拿錢，教導你如何成長。你需要避險才能防堵損失，就跟賺錢一樣必要。你可以發展多元經營、節稅、根據通貨膨脹調整事業、自行設置保險措施還有防護策略，藉此探索避險的世界。


    你的財富增加，稅金也會提高。你獲得愈多物質商品，維護、保險費用以及遭竊的損失也會增加。購買資產和投資時，都會產生手續續費、稅金、佣金、設備費和各種隱藏成本，必須謹慎注意。根據美國證券交易委員會提供的資料，價值十萬美金的投資組合，只要投資手續費產生○．七五％的改變，可能就會讓你在二十年後承受三萬美元的損失。雖然比例很低，但只要基礎金額夠高，損失就會相當可觀。一旦有更多錢，更多競爭對手、企業和慈善單位就會希望你捐更多錢給它們。


    你可以創造多元投資，建立多層次的資產和財富，包括低風險的基礎財富保護措施、儲備資本、購買創造循環收入的資本或事業，以及不為人所知的資產，藉此迴避風險。你需要對抗風險、竊賊還有投資損失。除了這個方法之外，你也能夠另外儲藏資本和流動資產。不要炫耀財富，應該保護並且隱藏。保護金錢比賺錢更重要。'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# 5 付出


    完成前面六階段，你就可以開始回饋社會了。當然，你一直都能夠捐出一定比例的收入。更好的方法是貢獻重要的時間和專業知識，建造六種不同層次的槓桿時間，完成更多社會貢獻。許多窮人太早開始捐贈過多金錢，因為他們有罪惡感、充滿恐懼，而且對金錢感到羞恥。他們認為捐贈金錢可以減輕痛苦。但他們根本沒有足夠的經濟能力，最後變得貧困，只能仰賴有錢人的資助而過活。還有另外一種人，從來不願意貢獻，過度自我中心。這個社會也會找到方法讓他們把錢吐出來，恢復平衡狀態。


    金錢知識愈成熟，你的經驗和專業技巧就會比金錢本身更有價值，可以賺到更多錢。你的洞見和經驗可以創造「不必花錢」的投資機會，至少「不用花自己的錢」，其他人會拿錢請你投資。你發揮槓桿效果，建立商業合作關係，善用複利效應，建立品牌價值和名聲，得到多重收入。你的金錢愈多，你就想要回饋更多，這個世界會認為你是給予者，這個世界會讓給予者得到更多益處。


    # （五）資產和負債


    資產創造循環收入，負債奪走你的收入，減少你的價值。簡單來說，資產創造金錢，負債造成金錢損失。很簡單，對吧？但現實生活中的資產負債很複雜。有些人認為家庭住宅是資產，因為房價上升，你不必支付房租，所以是一種資產。但另外一些人相信家庭住宅不能創造收入，所以應該屬於負債。實際上，許多物件只要妥善管理，就能成為'
  merge: -1
  img_proc: true
- pgno: 454
  md: '資產，但經營不善則會淪為負債。

    因此，關鍵在於你是否能夠妥善投資，創造資本收益或收入。如果你送一棟房子給傻瓜，房子很快就會變成負債。但是，你學會一個觀念，就會迅速變成資本和資產收入。

    資產的能力和強度取決於投資人的知識和經驗、市場趨勢、景氣循環時機、銀行利息、貨幣匯率狀況和更多因素。一般人認為房地產和股票屬於資產，但不見得永遠如此，請仔細閱讀以下的重點摘要：

    明確知道資產經營的策略和類型：你想要創造資本還是單純賺錢，你希望獲得主動營收還是被動收入？

    如果你買房並非用於自住，那麼這個房地產必須創造收入。倘若你購買黃金避險，就是保存資本。你親手建立事業，必須投入工作多年，結合熱情和專業，從事有意義的工作。你投資共同基金，就不應該參與管理運作。因此，請務必清楚知道各種投資的方向和目標。創造多層次的財富規模之後，就會擁有多元收入來源，包括主動和被動收入。不要過度天真，也不要情緒用事，妥善規劃並且冷靜執行，才能迴避風險。


    # 不要認為「好投資」一定有好結果，「壞投資」就會有壞結果


    好的投資方案，如果執行不當，也會有壞結果。看起來沒有吸引力的投資方案，只'
  merge: -1
  img_proc: true
- pgno: 455
  md: '要睿智處理，發揮經驗，可能創造好的收入。請無視坊間小報毫無根據的評論或者媒體刻意營造的熱潮。他們根本不了解資產和商業運作。持續漲價的完美手錶看起來可能平淡無奇。獲利空間最好的房地產或許只是符合一般標準的住家。昂貴的藝術品不見得是最傑出的創作。觀察群衆趨勢，並且忽略他們的想法，通常是最好的做法。時間、經驗、知識，可以讓你找到最好的投資方案與利潤，其他人通常都無法發現。


    # ● 渴望深入學習你投資的資產類型


    就像前面討論的內容，世上大多數的利潤來自極小部分的投資人和企業主，他們擁有最優秀的知識。這種分布不合比例。因此，睿智的方法就是選擇主要的專業領域，長期深入學習，絕對不要中斷，使用七十%至八十%的時間，投資這個產業，另外尋找兩個有熱情或興趣的領域，但不是主要獲利領域。如果你找到合夥人，發揮彼此的槓桿效果。我採納商業合夥人的股票投資建議，他則請教我投資手錶的意見。他負責購買大多數的房地產，我規劃商業經營策略。我們的主要領域就是房地產，同時提供教育和租賃服務，作為收入副領域和興趣。我們喜歡理解各種事業模型和資產類型，但僅限於此，因為我們知道自己的時間和經驗無法應對。專注發展知識，用八十%的時間繼續改善測驗，剩下二十%的時間用於多元探索（如果有意願，也有專業人士引導，就可以調整比'
  merge: -1
  img_proc: true
- pgno: 456
  md: '例）。


    # ◎比較其他資產和投資機會創造的利潤和好處


    無論在任何時間地點，沒有任何一種資產絕對比另一種資產更好或更壞。當然，有些資產的歷史悠久，但所有的資產都會經歷高低好壞的循環。銀行的貸款門檻、利息、貨幣波動和政府管制，都會在不同的時間，對所有資產造成不同程度的影響。有些人在英國脫離歐盟的期間做空英鎊，另外一些人則在美國大選期間投入更多資金，還有一些人在經濟衰退結束之後，大舉投資銀行和高端市場，或者趁著英鎊弱勢，大發匯率財。


    上述的策略都是短期操作。我們應該永遠記得比較不同的資產和機會成本。利息、手續費、獲利空間、時間都要列為變項。二〇一六年，手錶價格非常高。我從來不想賣錶，卻無法抵抗重大利潤的誘惑，這是十年來難得一見的機會。同樣在二〇一六年，英鎊對美元的匯率來到歷史最低點，我也開始注意以前沒有興趣的投資領域。


    # ◎策略性分配資產


    延續上一段的討論，讀者必須睿智分配資產。太多流動資產，如果銀行調低利率，'
  merge: -1
  img_proc: true
- pgno: 457
  md: '就會讓你同時承受通貨膨脹和機會成本造成的損失。然而，如果現金過少，物價太低，你又會錯過理想的購買時機。


    不要將雞蛋放在同一個籃子，這樣太危險。但是，資產也不能過度鬆散，會影響槓桿效果和複利效應。你的資產組合和事業規模夠龐大，重新分配和鞏固基礎就能創造良好的收入。倘若你的貸款金額是一億英鎊，年利率為四％，一年的利息就是四百萬英鎊。減少一％的利率，光是利息就能節省一百萬英鎊！額外投資金錢和時間的收入可能不到一百萬英鎊。至少一年一次，你必須重新檢查資產分配的比例是否符合策略、願景和環境機會，包括投資組合、增加或減少槓桿效果、專注資本或創造收入、投資有形商品或流動商品、加強本國或外國投資，重視短期或長期策略等等。


    # ◎ 結合熱情和專業，嗜好和投資


    你是否喜歡某個嗜好領域？我有位好友喜歡樂高，甚至願意投資。我喜歡手錶，我的未婚妻熱愛手提包。在這三個例子裡面，有兩個是理想的投資目標，可以結合熱情和專業！由於我喜歡手錶，我的手錶知識逐漸增加，我也享受研究、購買、估價和交易。我喜歡和經銷商、熱情收藏家進行互動，探索手錶的各種價位變化。我熱衷手錶的品牌歷史，想要學習手錶工藝的科技和發展，甚至訪問世界知名手錶廠牌的執行長。即使只'
  merge: -1
  img_proc: true
- pgno: 458
  md: '是興趣，我也不是笨蛋，我可以看出手錶世界的投資機會。什麼樣的商業領域或投資目標能夠引發你的熱情？藝術品？手錶？鑽石？黃金？房地產？股票？併購業？珠寶？古董？經典車？樂高？沒關係，只要你喜歡就可以，因為你一定會找到方法，學習最棒的知識，找到最好的投資方案。即使沒有賺到金錢，也得到樂趣和經驗。


    # 擴展規模之前，嘗試新的投資和建立新的收入來源


    沒有足夠的經驗和資料，尚未克服難關之前，不應該全力拓展單一領域的事業發展。請記得馬斯克和戴森的教訓，他們一度背負數百萬美元的負債，最後再度成功。他們的故事過於光彩，又遭到媒體報導的簡化，幾乎所有偉大的成功故事，都會有一位明星投入一切，最終順利成功。然而，數百人同樣付出，卻失去了一切。不要用百萬分之一的成功機率，決定投資和事業經營策略。除非擁有足夠的資料和經驗，不該貿然投入高風險的投資事業。不要把房子當成籌碼。測驗、修改、重新思考、重複上述步驟。只要你做好準備，就不會因為投資失敗而破產。'
  merge: -1
