- pgno: 183
  md: '師家具，卻不小心將中國菜灑在家具上。我積欠了將近五萬英鎊消費卡債，利息高達十八%至三十%。


    當時這些負債就像在拖累我人生的腳步，我只能繼續花錢，讓自己獲得短暫的快樂。債務和負面情緒讓我陷入了惡性循環。


    我知道這個故事聽起來很荒謬，就像滅重的人居然靠吃冰淇淋來改善情緒。過了十年，我才明白許多人都有和我相似的經驗。將時間快轉到現在，我依然對「快樂的感覺」上癮。但是，我向睿智處理金錢的前輩效法，學習特定的規則和策略，藉此控制並且管理情緒。以下就是各位讀者可能體驗的金錢情緒：


    # 金錢憂慮


    許多人都說，滿腦子想著錢的人是惡劣的。但缺錢時，我反而更常想到錢。我經常擔心缺錢，因為缺錢會讓我無法實現目標。


    你愈欣賞某個事物，就愈容易得到。你愈思考某個事物，就愈容易實現。因此，擔憂債務只會引發更多債務。我愈去想我的債務，債務狀況就變得愈惡劣，最後甚至像自我懲罰般開始打擊我的自信，甚至影響我的人際關係、自尊心和生活自由。


    我開始煩惱分期付款之後，甚至對健康和財富造成劇烈的影響。根據美聯社'
