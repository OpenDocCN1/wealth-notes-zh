  md: '# # 印刷金錢的執照


    ![](img/a9d3aeae93c5ae3f9baf5963e137b74a_390_0.png)


    這是簡單的四步驟模式，就像一張允許印刷鈔票的執照，可以繼續成長並且重複使用，絕對不是投機取巧的打帶跑策略：


    # ## 一、調查


    進行網路群衆調查，理解目標市場客戶，建立正確的觀念、系統和方法。調查重點客戶和現有顧客群，詢問他們的需求。善用問卷三大重點：一、開始，二、停止，三、保持。


    +   1. 你希望我們開始哪些新服務（產品）？

    2. 你希望我們停止哪些舊服務（產品）？

    3. 你希望我們保持哪些原有的服務（產品）？'
  merge: -1
  img_proc: true
- pgno: 391
  md: '探索客戶更深刻的需要。他們想要解決哪些問題？他們希望獲得哪種服務？哪些服務或產品可以改善他們的生活，更快速、更長久、更有娛樂價值並且更快樂？哪些服務能夠節省他們的時間，讓客戶獲得自由？沒有足夠的測驗和調查，貿然投入一項新業務領域，不但非常冒險，而且代價高昂。一九八三年，雅塔利（Atl）電腦遊戲公司推出《異形》(E)遊戲，遭逢慘烈的失敗，只能將七十萬份遊戲卡帶埋在墨西哥的垃圾處理場。千萬不要重蹈覆轍。迴避風險的最好方式，就是在製作百萬份產品之前，充分理解客戶的需要。


    成本最低的快速調查方法，就是詢問現有客戶或即將成為客戶的群衆。充分的調查結果，可以讓胸有成竹，知道飢渴的消費者想要購買哪些產品或服務。群衆調查的魅力在於，調查本身就是一種行銷策略。如果你親自參與產品或服務的開發階段，在上市之前，你已經曉得這個產品。知道上市日期之後，這個產品就會像你最愛的樂團出新專輯，不停在耳旁嘮叨絮語。倘若製作人接受你的意見，推出你渴望擁有的產品，你會認為自己參與了產品製造。你的內心認為自己是產品的主人。既然你知道自己想要，就會相信購買這個產品沒有任何風險，也會推薦朋友購買。


    這本書的英文標題和副標題就是藉由網路社群成員調查完成的。我的理念來自社群成員。我詢問意見，測試接受度，按照群衆回應，完成綜合修改，繼續請教他們的想法。許多人已經知道英文標題和副標題。我不必喜歡這個書名，我們只需要讓出版社接納即可。'
  merge: -1
  img_proc: true
- pgno: 392
  md: '可！如果你也想要寫書，除了按照上述方法，也可以事先進行網絡群眾調查，決定理想的出版形式，例如實體書、電子書或有聲書。


    # 二、解決問題


    我們必須下定決心替客戶解決問題，包括推出產品、服務、系統、標準程序、應用程式、觀念、資訊、智慧財產權、執照、連鎖經營、顧問、修復和其他形式。善用網絡群眾調查，理解最好的解決方法，採用線上服務、影片、手冊、書籍、DVD、個人服務、直播、網絡研討會、應用程式、雲端服務、盲人點字、文書謄寫處理、翻譯、面對面諮詢等等。讓客戶得到他們想要的產品和服務，而且符合理想的形式。


    # 三、服務社會


    創造產品和服務，持續測驗修改，並且拓展規模。將最低價的商品投入市場，試探小客戶的反應。讓早期購買者享受折扣，請他們提出回應，發展二○○版本的商品（服務）。先求有，但減少成本，再求完美。要求客戶提出最誠實的意見，傾聽他們的想法，建立產品優勢，讓他們向朋友推薦這項產品。持續推陳出新，發展至三○○版本或七○○版本，穩定改善產品，或者因應市場改變而進行全面更新。從一○○版本開始和群眾保持接觸，照顧他們的需求，不能只想著賺錢。'
  merge: -1
  img_proc: true
- pgno: 393
  md: '谷歌公司創業時，希望把搜尋引擎賣給商業公司，並且將演算法技術賣給其他搜尋引擎公司。銷售成果相當悲慘。谷歌決定大破大立，創造自己的廣告演算方法，讓各家商業公司向他們購買廣告。使用者搜尋特定關鍵字時，就會跳出該公司的資訊。谷歌公司幾乎在一夜之間從「受歡迎的搜尋引擎公司」變成「商業廣告的巨人」。二〇〇八年，谷歌向美國證券交易委員會申報的廣告收入為兩百一十億美元。


    # 四、拓展規模


    你的產品受到歡迎，建立非常公正的意見回應客群和測試資料庫之後，就可以準備拓展規模了。你不應該過早擴展，但也不要停下腳步。你推出新的產品或改版，就是繼續培養上一個產品（版本）的良好接受度。你可以安全輕鬆地創造更好的產品服務，增加產品附加效果，創造更長久的經營系統和作業流程，處理更廣大的銷售量。


    善用上述的四個步驟，建立一個良好的事業系統，就像申請一張印鈔許可證，讓你面對挑戰，實現願景，創造源源不絕的財富，同時避免將存貨埋在垃圾處理場的風險。


    我做了非常仔細的調查，這四個步驟可以應用在所有產品和服務。即使是最好的願景家，也幾乎無法靠著自己的才能，理解客戶的需求。美國汽車大亨福特說過一句名言：


    「如果當年我問客戶想要什麼，他們一定會說更快的馬。」福特的例子是非常少數的例子。雅塔利如此傑出的公司，缺乏正確的步驟，也會承受險峻的失敗。'
