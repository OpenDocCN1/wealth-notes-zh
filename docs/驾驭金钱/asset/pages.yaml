  md: '# 一、顛覆市場，強力提升價格和服務


    是否記得手機只能打電話的日子？後來出現了簡訊功能，手機科技持續進展。蘋果公司推出iPod，徹底改變產業，不只創造更多價值，甚至徹底改變人類對手機的認知。音樂、應用程式和所有的功能彷彿觸手可及，終於打開手機產業的價格大門。俗話說，把五百英鎊交給有錢人，他會在一天之內賺到一百萬英鎊；把五百英鎊交給窮人，他會立刻去買Hero。蘋果徹底改變了手機產業，打破既有模式，改變原本的價格限制。


    你還記得以前的廉價吸塵器嗎？看起來雖然像《超時空奇俠》（D.War）裡的反派機器人達立克斯（Dalek），但依然盡忠職守地清潔環境。後來，戴森公司出現了。我很清楚地記得，我曾經拜訪一位在銀行界擔任資深管理職的朋友。他邀請我到他的新家參觀，我非常期待。他打開大門，邀請我和其他朋友進入屋內之後，第一件事就是帶我去看他的櫥櫃以及數位新時代的工具：戴森吸塵器。他的表情很驕傲，彷彿這臺吸塵器就是他的新生兒。一九八○年代，他買了一臺老舊吸塵器時，完全沒有這種喜悅。


    請切記，如果你敲竹槓或者超收價格，絕對無法全身而退。客戶的反應和廣大的市場機制會立刻進行平衡。其他競爭者並未遵守公平交易法則，不要在意。他們遲早會被質疑。你只需要專注照顧自己的客戶和支持者。在蘋果電腦和戴森的例子中，兩間公司都創造了獨特的價值，讓人類的生活更輕鬆、迅速、簡單，並且保存寶貴的時間。他們'
