- pgno: 45
  md: '稱為「動能」、「複利效應」，或「常識」。

    牛頓第一運動定律則說：靜者恆靜，而動者恆動，並且保持同樣的速度和方向，除非另一個反作用力與動者相抵銷，達成均衡狀態。

    當然，你也可能提出更深邃的論證，認為有錢人之所以變得更富有，是因為「他們本來就有錢」，而窮人「本來就一無所有」，才會變得更貧困，但絕對不要忽略最單純的事實。

    倘若你保持正確的方向，追求金錢和財富，就算尚未滿足你渴望的水準，只要繼續保持前進，總有一天會成功。


    # ◎平衡經濟學


    在所有的貨幣系統中，所有的支出必須符合收入，這代表花費的金錢必須等於收入的金錢。

    人不會平白無故燒錢（除了英國樂團“FISH”，他們点火焚燒了數百萬英鎊的存款），就算真的有人燒錢，這些金錢也會消失在系統之外，系統內的現有金錢依然保持支出等於收入的平衡。即使系統印製了新鈔票，只要存在於系統內，就會像既有的金錢一樣，符合支出等於收入的平衡原則。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '因此，在任何時間點，有限但大量的系統金錢流動時，都會準確地從「最大消費者」（支出）的手中，移動至「最大銷售者」（收入）的手中。


    假如系統出現不平衡，事實上，系統不平衡永遠存在，因為各種產品和服務的價值並不完全一致，而每個人的金錢價值也被此迥異，金錢就會更自由且更大量地，從看重「支出」價值者的手中，流動至看重「收入」價值者的手中。


    換句話說，不珍惜金錢者（或者看重支出勝過於收入者）的金錢會流向珍惜金錢（或者看重收入勝過於支出者）並且善用儲蓄、投資，以及複利效果者。消費者的金錢流向生產者。


    無論人們想要使用權力、規則、公會、管制或政府機關，試圖追求更公平的財富分配，金錢的運作始終符合上述的平衡原則。因此，如果你希望能夠重新分配更多財富，絕對不要陷入受害者心態，認為自己被更高的權力或系統迫害，乞求或渴望他們將財富分配給你。


    在你的有生之年，資本主義不太可能改變，不要浪費時間和精力，耗損寶貴的機會成本對抗資本主義。相反的，你應該學習如何專注地管理、精通並且熟悉金錢、商品服務、社會奉獻、創業、動態、複利效果以及金錢流速，更妥善地理解金錢和財富，並且珍惜它們。如此一來，你就會得到更多。學習愈多，得到愈多。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# ● 財富分配的理論


    人們常主張要財富重分配，讓財富從擁有最多金錢者，流動至擁有最少者。深入探討之前，容我指出，這個世界已經有這種機制了，那就是稅賦。在大多數的已開發國家，收入愈高，稅金比例就會愈高。


    有時候，一個人專心致志地賺錢，卻要繳交一半，甚至更多的收入作為稅金，而收入較低的民眾繳交的稅金也較少（比例或絕對金額都較低）。一個人的收入愈高，繳交的金額數字和比例都會提高。有錢人因為高收入而遭到懲罰，窮人也已經得到支持。


    我在各種財富重分配理論看見的問題是「得到重分配財富者並未因此獲得照顧或幸福」。我絕對不反對將財富分享給最需要用的人，事實上，建立財富的重點之一，就是奉獻，我們會在稍後的篇幅裡探討。但是，如果無法妥善管理現有資源，就沒辦法管理更多的金錢，教育資源匱乏的問題和財富重分配的議題一樣重要。


    請你想像有錢人開了一間賭場，一位賭徒進入賭場，花光所有的錢，反而讓有錢人賺到更多錢，於是政府提高稅金，想要把錢重新分配給賭徒。賭徒再度回到賭場，花了更多錢賭博。賭場老闆可能必須提高獲利，才能彌補加重的稅金。這種情況讓持續下注的賭徒必須花費更多錢。上述的週期反覆循環，但無法幫助任何人或改變任何事情，賭場老闆可能因為必須繳納過多稅金而決定搬到國外，賭徒花費更多金錢，賭癮變得更嚴重。'
  merge: -1
