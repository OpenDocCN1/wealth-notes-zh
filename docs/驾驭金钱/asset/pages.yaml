    足球員的薪資是一個很好的個體觀察工具，讓我們理解銷售、服務、解決問題和薪資回報之間的關係。足球員的表現愈好，也會獲得各種周邊合約，賺到更多錢，例如品牌贊助、產品代言、銷售分紅，甚至連張貼社群網站文章都有收入。在經濟學中，這種收入被稱為「邊際收入」。他們在主要領域的表現愈好，就愈能創造邊際收入。他們在專業世界的水準愈高，代表服務更多人，解決更多問題，形成最主要的銷售能力。


