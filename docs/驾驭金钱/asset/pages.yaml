  md: '循環的人。由於他們並未直接體驗上一次的循環，或者身處無關緊要的位置，所以無法記取教訓，也不曾感受深刻的痛苦。每次的循環都有獨特之處，即使妥善學習上一次循環的教訓，當前的循環也會有所不同。


    造成景氣循環的人物、產業、戰爭、資產分類、氣象狀態，以及其他不可預測的事件和現象都不一樣。經濟危機的觸發事件亦是如此不可預測，如果能夠預測，就能避免經濟危機。


    # 二、所謂的平衡其實是不平衡：因為「平衡」是持續運作的整體狀態。例如鐘擺會在兩極之間的特定範圍進行擺盪，唯有一個稍縱即逝的瞬間，我們才能假設鐘擺「固定」在某個位置，循環和平衡亦適用此道理。以為人類世界可以在一段漫長的時間裡保持固定的平衡，其實只是一種錯覺，就像假設鐘擺在正中央停留較久。我們不該期待長久的平衡，經濟市場只會持續循環，請欣然接納這個道理，並且發揮槓桿效果。


    # 三、羊群效應：每個人都會犯錯，群衆也會彼此仿效。他們可能未經教育，或者受到錯覺誤導。市場會被群衆影響，而不是被你或評論者的想法引導。在景氣繁榮的時代，沒有任何一位銀行家會挺身而出，大聲疾呼：「各位朋友！天下無不散的宴席，請停止投資，不要賺大錢或者領取如此驚人的紅利（我也會收手）！」人會效法他人，並且依照當時的條件，做出符合最佳利益的選擇。


    # 四、追求成長的本質：人類的本性就是追求成長，因為生命的某部分的目標也是成'
