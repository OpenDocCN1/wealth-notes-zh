- pgno: 59
  md: '# 成功很容易，失敗也很簡單


    甚至不認為錢是重要的東西。


    我們可以立刻改變自己的觀念。成功致富者非常尊重金錢，不只詳盡研究，而且還會提供服務，解決他人的問題，縝密觀察金錢的法則。因此，關鍵不在於「為何致富如此困難」，而是「為什麼他們這麼容易致富」？


    我應該是從吉姆·羅恩（Jim Rohn）口中首次聽到「成功很容易，失敗也很簡單」，這個重要的概念。


    要買披薩還是沙拉之類的抉擇不難，決定儲蓄或花錢其實也一樣輕鬆。熱愛金錢並且賺大錢也不困難，就像努力工作以求溫飽一樣容易。


    追求任何目標都必須先拔得頭籌，不管是不是賺錢這回事。無論是否能賺大錢，你都必須做出犧牲。賺錢應該像在做自己喜歡的事情一樣，但同時也要像進行你不喜歡的訓練那樣努力。


    或許你現在還沒辦法用這種方式思考，也許是因為你還沒有足夠的認知，因為社會環境與成長過程讓你小看自己，其他的錯誤觀念也使你以為這就是現實。


    一九九二年的九月十六日，喬治·索羅斯（George Soros）在一天之內賺進十億美元。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '二〇一一 年，索羅斯和祖克伯分別賺進八十億和一百二十億美元，而他們的DNA裡並沒有所謂「億萬富翁」染色體。


    這些人想要不賺錢的難度比賺錢還高。克里斯欽．羅納度（Cristiano Ronaldo）發一則推特可以賺到三十三萬三千九百美元，韋恩．魯尼（Wayne Rooney）一篇推特的收入是九萬四千美元，金．卡戴珊（Kim
    Kardashian）則是二萬美元。你將在第三十四章發現，許多人賺錢的目標只是為了分享，而其他則無法分享出去。


    # ## 為什麼會陷入金錢危機？


    金錢危機是可預期的。陷入金錢危機者，通常是因為他們認為金錢或者與金錢有關的事物不重要，也可能是因為他們還沒找到一種方法，準確地理解賺錢與實現內心最高價值的關聯。


    地球上每個人都有有不同的最高價值，因此人人都是獨特的個體。倘若社會大眾各自看重某個領域，認為該領域的大師是天才，那麼人人都應該是天才。

    每個人都在自己的最高價值與目標領域中展現出卓越超凡的才能，人人各有獨特，因此我們只要忠於自我，就是負責真實的天才。


    既然不會有人和我一模一樣，我就肯定是地球上最有能力實現內心最高價值的佼佼'
  merge: -1
  img_proc: true
