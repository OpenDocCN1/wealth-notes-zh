  md: '# RAOG


    所屬族群的利益），最後就會實現自己的利益。


    善用這個哲學觀念，平衡自利和人道主義關懷，提升接受和給予的價值。你的慈善事業不需要侷限於金錢。提供教育或其他人道協助，都可以提升傳承的價值，遠遠勝過於繳納稅金。


    相較於訓練一個人的認知、喚醒他的意識，提升他的知識，將金錢交給一個不知道如何管理金錢的人，其實無法照顧他的福祉。所以最偉大的慈善事業家鼎力投資教育，提供善款建立教育基金會。你的傳承價值可以超過百萬、億萬美元的價值，讓世代世代的孩子獲得教育和啟發。即使你尚未擁有財富，也可以立刻開始投身公益，因為時間是最珍貴的資產。請發揮時間的最大價值，投入他人的生活和教育。


    開創慈善事業和財富流動的好方法，就是進行 RAOG（隨興給予行動，Random Acts of Giving）。


    在日常生活裡，請記得深思熟慮，慎重感謝他人的幫助，甚至寄送個人致謝卡片。將重要的生活事件銘記在心，例如朋友生孩子、婚禮或生日。大方送禮給朋友或陌生人。對待朋友和陌生人都要溫柔仁慈。'
