- pgno: 127
  md: '資本主義提供公平競爭，企業家和創新家在一定程度的控制下，得以創造利潤，並且繳納（非常高的）稅金。


    我不會抱怨繳稅，因為我相信這個機制，也從中獲益，並且享受資本主義式的財富重分配。我其實沒有損失任何錢，因為我繳納的稅金將創造更多利潤。我覺得自己是很有價值的，因為我盡力提升國家的增值稅、國民所得、資本所得稅、銀行利息。我創辦的公司也促進當地、國家和全球的經濟流動速度。


    除此之外，資本主義系統為了鼓勵創新、提供就業機會、修復古老的建築物以及創業，也會提供減稅和其他激勵措施。我能夠自由地賺到公平的利潤，無須繳納高額稅金。


    同行之間的競爭讓我保持均衡，平等地追個人目標和社會福祉。市場保持公平的價格。如果我的表現不佳，或者無法提供公平的服務交換，競爭者就會取代我，我將失去舞臺。


    如果我可以洞燭先機，就能獲得優勢；我照顧更多人，也會創造優勢。我的私人收入提高，國內生產總額也會增加。想要濫用資本主義系統，我們就會遭到懲罰，繳納可觀的罰金。願意接受資本主義的規範，也會得到公平的獎勵。資本主義是人類歷史上最偉大的發明之一，卻遭到許多人的誹謗和誤解。我們應該建立平衡的觀點，不能盡信充滿受害者口吻的洗腦故事。英格蘭銀行的前任總裁曾經如此描述資本主義：「多年來，資本主義經濟系統已經被證明是最有效的方法，可以消滅貧困並且促進繁榮。」'
