    # • 創造工作與生活的理想平衡


    能夠創造理想的工作生活平衡，才是幸福的生活。以下是完成這個目標的方法：


    +   一、用最輕鬆且毫無限制的方法，選擇自己能夠掌握的職業。

    二、選擇能夠結合熱情的職業。

    三、研究你崇拜的成功人士，學習他們的習慣和工作方法。

    四、明白自己應該努力追求哪些目標，放棄另外一些目標。


    你確實可以將工作和生活，結合為一種充滿熱情的理想，再也不必擔心下班以後，還要在在家繼續工作，或者上班時依然擔憂家庭生活。


