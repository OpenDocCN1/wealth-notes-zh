  md: '# ◎八十／二十法則的結論


    八十／二十法則讓我們明白財富如何分配，為什麼永遠不會平等，你又能夠如何效法這個原則，設定自己的時間和工作。我們不必藉由他人的資源，只要改變作法，就能提高賺錢速度，增加個人國內生產毛額和金錢流動。專注最重要的關鍵成果領域和收入創造工作，至少每六個月就要重新評估工作安排，這就是有錢人持續發揮複利效應的關鍵祕密。


    人際關係、旅遊地點、交通、學習、閱讀、有聲書和線上學習、消費、媒體、行銷、節省成本、購物、家務工作、社交、生活工作平衡、電子郵件、會議以及銀行業務等，生活中的一切，都能適用八十／二十法則。'
