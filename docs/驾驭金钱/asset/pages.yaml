  md: '心懷，努力提升自己的名聲、品牌價值、遠見和信用，妥善管理、維持並且精通「信任經濟學」。


    讀者朋友可以善用益百利（Equifax）網站：，檢查信用分數，找出可以改善的細節，例如將所有信用卡都設定為簽帳一次付款，絕對不能逾期未繳，萬萬不行。如果你必須貸款，無論情況多麼艱困，一定要確實還款。倘若你希望協商長期還款計畫或減輕利率，即使對方非常不悅，也要盡力溝通，因為違反合約的代價非常龐大，讓全世界的人發現你沒有信用，不值得信任。這才是最可怕的負債，而且將維持數十年。


