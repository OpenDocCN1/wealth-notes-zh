  md: '賣出公司一半的股份，換取數十萬英鎊的資金之前，請慎重思考。天下沒有白吃的午餐。發揮創意觀念，才能創造收入，你可以思考各種方法，發揮槓桿效果，順利募款。在此之前，請清楚思考想要獲得資金的原因：


    +   * 想要追求無法獨自成功的迅速成長。

    * 想要發展無法獨自製造的產品。

    * 想要讓董事會得到更有經驗的投資人。

