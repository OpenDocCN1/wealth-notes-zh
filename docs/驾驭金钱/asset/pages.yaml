  md: '如果你希望打造自己的事業版圖，就應該建立同樣偉大的人際網絡，因為你的成功取決於周圍的好友。請立刻尋找良好的同伴、專業人士和導師。從他人的錯誤中學習，向最傑出的人士學習。成功人士會相互吸引，富裕人士也會彼此為友。我會在第四十四章仔細討論這個觀念。


    # 樂觀主義和懷疑主義


    你可能會聽到一個常見的說法：「百萬富翁都是樂觀主義者」，並且建議你懷抱「杯子還有半杯水」的樂觀立場，才能成為樂觀的成功人士。


    但我認為上述的說法有點太過簡化了，這些話經常出自一些沒有賺錢務實經驗的人。任何一種極端的想法都無法讓我們獲得幸福或財富。太積極正面，使你變得鄉愿，太消極懷疑，則讓你無法好好評估利弊，導致裹足不前。


    「信任你的直覺，但避免最惡劣的結果」，這是個膽大心細的想法。你必須避免過度悲觀，但也不能陷入樂觀的幻覺，無視潛在的問題。


    整體而言，這些鉅富都具備樂觀的世界觀，才能培養創造積極改變的能力，但他們同時也會保持謹慎，留意所有環境條件。我們應該仰賴他人的協助，但拒絕被他人擺佈。公平協商，立場堅定。信任他人且據實考證。只要能夠迅速處理任何極端心態，就可以'
