  md: '志名言。然而，獨自成功可能也是一種自私——為什麼忽略曾經幫助你成功的人？


    在英文中，「團隊」(Team)這個單字中並沒有「我」（I）。夢想家和領導者從來不是單獨個人，他們讓其他人共同成就。真正的領導者讓其他人一起領導。這才是全球商業巨人、社會領導者和成功人士的行事作風。


    你不需要孤軍奮戰，因為你不能，也不會靠自己一人取得成功。不要讓自以為是成為你成功的絆腳石。


    你應該立志成為白手起家的億萬富翁，完全承擔責任，創造願景，解決問題，吸引所有傑出的人才，打造完美的團隊，共同追求偉大的成就。


    # 良好的人際關係和商業社群網絡


