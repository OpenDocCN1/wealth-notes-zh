    # ## 個人財務天花板


    川普和流浪漢的銀行戶頭都有一百萬美金時，他們心裡有何感覺？流浪漢可能會覺得自己贏了大樂透，但川普則擔心自己的財務是否出了狀況，怎麼只有一百萬美金？一個人對「很多錢」的觀念，決定了他的財務天花板。一千英鎊和一萬英鎊不是很多錢，一百萬英鎊或一千萬英鎊也不是很多錢。在這個世界上，還有數百倍、數千倍的金錢，正在迅速流動。二十%的有錢人，掌握了八十%的金流。改變「金錢非常稀有」的心態，迎接富足的觀念，才能移除個人的財務天花板。世上的金錢豐富有餘，你也應該有錢，沒有任何利益領域、平價化市場、經濟景氣循環或小氣的客戶可以定義你的價值或者你的財務發展。如果你聽見自己說「這筆錢真多」，請立刻糾正觀念。未來的你（可能是一位億萬富翁）會認為這筆錢根本微不足道。你在健身房會逐漸增加啞鈴的重量，你也應該持續提高個人的財務極限。'
