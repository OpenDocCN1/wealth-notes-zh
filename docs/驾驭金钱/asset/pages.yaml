  md: '過的人物。你可能會猜想，他可能會因為生意上門而活過來，開心地把鈔票放入收銀機。然而，當我說：「老兄，最近可好？」時，他只是繼續用黑莓機打字，甚至沒有正眼看我，一邊低語碎念。我照慣例地說：「生意如何？」，他卻說：「跟狗屎一樣。」他說了髒話，我替他向各位讀者道歉。當時，他抬起頭，眼神冰冷如石：「沒人賺得到該死的錢！」


    事實上，全球經濟體系大約有八千兆英鎊的現金流動。股票和債券的價值則是一億五千萬兆和一億八千萬兆英鎊，倘若加上債務，他估計全球金融價值的總額大約是兩億萬兆英鎊。


    某些資料來源相信，全球黃金礦產的總額超過八百二十萬兆英鎊，除此之外，有記錄前的黃金礦產總額應該更高，而且我們難以確實地追查非法黃金礦產。如果你在commodities.com網站查詢前一百名的加密貨幣，現在的第一百名是「以太坊」（Etherium），總資本額大約三百億美元，第二名是歐比茲（Onix，音譯），總值為三百七十億美元，第一名則是比特幣，總值將近三百八十億美元。


