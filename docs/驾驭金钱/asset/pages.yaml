  md: '# 智慧財產權（觀念、專利、執照、特許加盟經營、資訊和音樂）


    智慧財產權具備資本價值，能夠創造循環收入，例如樂團的專輯、特定的使用執照、專利和創造多形式的商品。擁有資本價值的智慧財產權可以直接賣出、簽訂加盟契約、租賃，或者光是擁有智慧財產權就能創造利潤。


    藉由開放特許加盟經營，單一資產（例如資訊、商業系統或專利）可以發揮槓桿效果，創造全國或全球利潤。例如麥當勞在全球授權三萬六千多間分店，聘請四十二萬名員工。加盟經營權也可直接賣出，或者繼續持有，收取盈餘。


    音樂專輯、歌曲、書籍、遊戲、線上課程或其他形式的智慧財產權，只要創作一次，就可以賣出數百份或數千份，賺到數年或數十年的利潤。這些形式的智慧財產權也能重新包裝，例如手機應用程式、實體活動、休養課程和限量款，增加獲利。發揮智慧財產權的特色，創造其他商品、贊助或代言，也可以進一步提高品牌價值。在你的專業領域中尋找創造智慧財產權的機會，增加更多資本和收入。


    # 投資（股票、債券和其他金融商品）


    我的地產業也經營投資，購買其他的房地產，創造長期的收入和資本成長，例如企業大樓和訓練機構。巴菲特收購波夏克、海瑟威控股公司之後，替自己和股東進行投資。獨立財務顧問提供建議，收取費用，建議客戶如何投資。股票市場、貴金屬市場、藝術、綠色能源和其他領域，也有受到政府管制或完全自由市場的投資行為。'
