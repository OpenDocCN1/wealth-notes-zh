  md: '有一家水果商，提供美味碩大的紅色草莓免費試吃。許多路過的人被試吃吸引，走進店內，意外地買了一大籃草莓。這是一個網路和資訊的年代，提供產品或服務的高價值電子書、使用報告、有聲書或
    YouTube 影片，都可以建立客戶信任，消除市場摩擦，提升購買機會。目標就是讓潛在的新客戶認為：「如果這個產品（服務）提供的免費體驗這麼好，正式的商品一定更棒！」我的網路廣播節目《顛覆企業家》是免費的，也沒有安排任何廣告，卻創造數十萬英鎊的商業利潤。這就是增加產品前線免費價值的好處。讀者可以思考自己的事業能夠提供哪些免費價值。


    如果你可以在上述五個例子，各自提升四%產品服務價值，代表你可以提高二十%的產品服務價格。還猶豫什麼？立刻進行吧！


    # 定價過低，會讓你無法吸引高消費水準的客戶


    許多人思考客戶、商業和金錢時，認為提高價格會造成損失。但他們的思考方向錯了。價格是吸引客戶類型和建立理想商業模式的主要方法。俗話說：「如果你只出得起香蕉，當然只能請到猴子。」這個道理也適用於定價策略。'
