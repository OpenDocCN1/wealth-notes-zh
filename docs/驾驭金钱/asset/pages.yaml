  md: '舉，填補痛楚和內心的空缺乏。你的內心是否也有同樣的洞，可以推動重要的理想，替這座世界創造積極的改變？請思考，你渴望替什麼目標而戰？你的理想究竟是什麼？尋找有意義的理想非常重要。竭盡所能列出各種理由，思考為什麼財富可以讓造福世界和自我。


    設定偉大的目標，在你離開世界之後，依然留下偉大的傳承。

    如果你每天早上都找不到值得挑戰和實現的目標，你就無法散發耀眼的光芒。


    內心沒有目標的人會流失金錢，這些錢會流向有目標的人。如果你真心想要實現理想，宇宙就會與你合作，讓你找到合適的人，支持你的慈善事業，解決問題，發展規模和價值，實現偉大的理想。


    你將成為他們的商業合作伙伴，發揮「啟蒙後的自利」的金錢價值。偉大的理想讓你獲得勇氣和資源，超越自身的極限，建立偉大的財富。


    > ——迪馬丁尼博士


