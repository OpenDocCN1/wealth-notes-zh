    **剛開始投資時，應該找尋知識門檻和風險都相對低的目標**。你可以設定每日獲利目標，將這個金額放在皮包或隨身包中，但不要用掉。這是一種純粹的心理緩衝，將這筆錢放在獨立區域，遠離日常生活費。十一年前，一位導師教我這個小技巧，我一直維持迄今。我不能解釋其中的原因，但我確實因為這樣賺到更多錢。除此之外，這個方法也代表如果你投資失敗，陷入財務困境，至少還有一筆救急金。


