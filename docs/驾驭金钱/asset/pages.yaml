- pgno: 152
  md: '多人費盡一生尋找生命的意義。我相信生命的意義就是找到獨特的生命目標，才能增進人性的價值並且促進種族的演化。


    找到生活的目標，就能有目標地實現人生。


    擁有宏大且清晰的目標的人，也可以實現成就，促成人類種族演化，留下鼓舞人心的傳承，享受自己創造的巨大財富。缺乏願景、方向或目標的人則空虛壓抑且脆弱貧困，有時甚至會萌生自殺的念頭。


    維克托·弗蘭克是一位存在主義心理治療家，他在—九五九年出版的書籍《活出意義來》（Man''s Searchlng for Meaning）中提出感動人心的「意義治療」(logotherapy）理論。


    佛洛伊德認為人類的主要動力是性與攻擊，但弗蘭克相信生命的主要動力則是「追尋意義」。


    弗蘭克承受了佛洛伊德不曾面對的經歷。一九四○年代，弗蘭克曾是納粹集中營的俘虜，目睹難以理解的現實，害怕失去一切，只能遭受恐佈的虐待。


    弗蘭克被苦痛和殘暴包圍，但生命的目標使他繼續奮戰求生，忍耐無法想像的折磨。逃出集中營之後，弗蘭克創作《活出意義來》一書，分享自己的經驗，提出意義治療的綱要。尼采的一句名言能夠簡潔描述集中營的俘虜如何堅持奮鬥，永不失去求生意


    羅賓·夏馬'
