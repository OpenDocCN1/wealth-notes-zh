- pgno: 184
  md: '(Associational Press)和美國線上（AOL）提出的研究報告，如果一個人擔心自己的財務，包括影響生活幸福的各種狀況，承受嚴重健康問題的風險就會提高。


    相較於不必擔心債務的人，那些因債務產生緊張壓力的人，罹患心臟疾病的風險是其兩倍，其他容易出現的健康問題包括發炎和消化問題——根據統計，因為財務狀況而承受緊張壓力者，罹患消化問題的比例是二十七％，而沒有財務壓力者罹患消化問題的比例只有八％。財務壓力緊張者承受偏頭痛的比例是四十四％，而財務壓力較低者承受偏頭痛的比例只有四％。財務壓力緊張者罹患憂鬱症的比例是二十三％，而財務壓力較低者罹患憂鬱症的比例只有四％。


    想要避免因為財務緊張而產生的身心健康問題，確實有一個好方法。其他研究報告指出，積極參與財務規劃，並且學習財務的人，能夠有效降低財務壓力，對財務未來更有自信，也可以減少身心疾患。


    美國教師退休基金會（TIA-CREF）的報告認為，曾經接受財務教育的人，更容易儲蓄退休金。美國大都壽（MetLife）指出，參加財務訓練計畫，可以提升二十五％參加者的信心，相信自己能夠掌握財務狀況。學習並規劃金錢財務，可以確實減少我們的擔憂和壓力，增進整體幸福感，並且創造更好的財務結果。聽起來很像一般常識？沒錯，但不是人人都做得到。'
