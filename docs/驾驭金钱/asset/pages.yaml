  md: '# 44 投資


    可以安全度過二〇〇八年的經濟大衰退，甚至得到難得一見的獲利機會。投資的利潤愈大，風險愈高，你必須慎重思考貸款，不能像二〇〇〇年代中期的許多屋主，將貸款金額視為不勞而獲的金錢。沒有良好的槓桿，借錢也無法創造美好的財富，務必謹慎選擇安全低利息的貸款，和銀行建立良好的信用關係，才能進入第四層和第五層的金錢使用方法。


