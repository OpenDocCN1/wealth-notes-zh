  md: '# 資訊和網路行銷


    全球一共有四十億人使用電子郵件，七十九%的人口使用社群網站，五十一%的人使用部落格，網路研討會的人口觸及率高達四十九%，十六%的人收看網路廣播節目。網路潮流正在急速增加，毫無消退的跡象。印刷媒體、電視廣告和傳統銷售產業面臨


