    請想像一下，假如你必須負擔沉重的債務，每個星期在辦公室承受八十個小時的高壓力工作，又如何享受「生命中最美好的免費事物」？


    金錢與幸福（快樂）其實沒有直接的關係。


    金錢不等於快樂。金錢與快樂是彼此獨立的觀念，你可以選擇以下其中一種組合：有錢但不快樂、貧窮且不快樂、有錢又快樂，或者貧窮且快樂。


    請容我提出一個令你震驚的想法：為什麼我們不能同時擁有金錢而且非常快樂呢？金錢可以創造快樂，因為只要付錢就可以讓你更輕鬆頻繁地從事使你快樂的活動。金錢是一種載體，讓你得到更多生命中的免費事物，而它們被稱為是最美好的事物。


    倘若你想要更多快樂，就要努力追求。如果你希望得到更多金錢，也要努力追求。不要將希望單獨投入在其中一方，而是允許自己快樂，只要快樂，你就可以賺到更多錢，獲得成長並且給予更多。


    讓自己活在金錢創造的富饒之中，你將在稍後的篇幅明白，這就是歷史上有錢人的處世之道，其中的重點並非不理性的消費，而是創造經濟繁榮與金錢的迅速流動。'
