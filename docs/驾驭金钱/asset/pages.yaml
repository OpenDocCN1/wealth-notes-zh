- pgno: 459
  md: '# 其他理財的概念


    哪些是會讓人聞之色變的偏門、詐欺和不切實際的賺快錢方式？你怎會知道良善且安全的被動式收入，到最後竟成為一場惡夢？觀察四十萬人的商業發展，我們發現最常被坑錢的人都是：


    +   (一) 資歷太淺：我們都是從某處開始的。「每個大師曾經都是一團亂」，這是以前其中一位啟蒙導師告訴我的。給自己一段時間，什麼都不做就只是學習。不要在幾週或幾個月內就急著下重大決定，只要邊學邊看就好。選一些值得追隨的專家，向他們學習。一開始大家都一樣嫩。


    +   (二) 過於天真：有的時候，人們太過於正面或樂觀，以至於他們無法用懷疑的眼光去看待事物。有時這是因為他們成長過程太順遂、被保護得太好所致，又是他們太優秀了。可以用第一點的方法來了解這些重大決定的風險和壞處是什麼。盡可能在樂觀和質疑的態度間取得平衡。


    +   (三) 太汲汲營營：當我們太汲汲營營的時候，就會對陷阱毫無防備和懷疑之心。我們可能會變得短視近利，並且只看到好的一面。先緩一緩，保持耐心，問題聰明和經驗豐富者的意見。當你要進入新的跑道或模式前，先冷靜一下，問缺乏明確的遠見和價值：如果你對自己的願景和價值還不是很清楚，那麼你可能會成為一名投機分子，做事絲毫沒有章法可言。你會被自己的心情和別'
  merge: -1
  img_proc: true
- pgno: 460
  md: '人的話術所擺布。如果你還搞不清楚，請看《生活槓桿》中的練習來建立價值和願景。


    # （五）


    太貪心：要有耐心，不要貪多、貪快。要在現實和樂觀間取得平衡。也不要犧牲別人來成全自己。


    # （六）


    拿自己跟他人比較：一直注意別人的成就，很容易會讓我們分心。我們常常看不見現實，其實很多人都是鴨子划水，暗自努力。只有當你不知道他人的狀況時，才會想要跟對方比較。不要看到別人都在做，或是別人成功，所以決定要用同樣策略。只要跟過去的自己比就好，還有想想你將來想成為怎樣的人，以此作為鼓舞和激勵。


    # ●現金流 vs 獲益


    現金流和獲益顯然是不一樣的。許多創新或是成長中的企業都表現得像是不知道其中的差別一樣，這對建立財富而言是很危險的。


    現金流是一門生意中，資金流入和流出的量，可以為正也可以為負。現金流就是一間公司或個人可以管理或運用的流動資產，擁有者可以用它來借貸、轉投資或回饋給股東、支付開銷或緩解未來可能的財務狀況。淨現金流量包括應收帳款和未收帳款。現金'
  merge: -1
  img_proc: true
- pgno: 461
  md: '流是以一間公司的收入和它錢財流動的狀况為基準，可以看出ㄧ間公司的償付能力。


    而獲益是指ㄧ個企業賺到的一錢，扣掉成本所剩下的餘額。這些成本可以是固定或變動的一，這些固定的成本短期內不會有變動，像是房租、員工薪資、保險費和折舊等。變動成本則會每個月不同，像是行銷費用之類的。即便是賺錢的企業，只要它沒有平衡的現金流，那麼也會導致失敗。


    一間企業或ㄧ個人有可能帳面上顯示為獲益，然而卻沒有現金可以付償立即性的開銷。一間公司也有可能貸不抵債。這是因為大部分的企業，其提供物品和服務與收款之間有一一段時間差。如果有一些突如其來的重大花費、官司或債務爆發，又或是沒收到錢，就會有許多現金被卡在股市動彈不得，又或是一些未預期的現金支出，都會導致一間公司現金短缺。


    信用和企業財務的現金流短缺，是小型企業失敗最常見的原因。請務必做一下現金流的預測，它會指出你的現金會從哪裡流入，又會支出到哪裡去。


    我的公司每個禮拜都會給我ㄧ份報表，上頭有銀行的現金數字、債權數字和借貸數字，以及保留盈餘。


    將這些數字計算後，會得到ㄧ個實際的現存現金數字。我們並沒持有許多股份，但如果有的話，我也會要求要附上。如果我們的規模是現在的十倍，我可能會更常要這些報表來看。這些可以跟前幾年的數字比較，用來衡量公司的進展和穩定性。評估ㄧ下付'
  merge: -1
  img_proc: true
- pgno: 462
  md: '款條件，確保一下收款與服務給出之間沒有太大的時間差。優化這項系統，確保顧客都準時付款，並且具備良好的素質。如果必要的话，評估顧客和產品的收益程度，將有助於你的現金頭寸。


    仔細看好你的現金流和收益。你可以透過龐大的前端銷售手續費來獲得大量金流。獲益不大的營業額有可能會隱藏或延後你的償付能力，就這方面而言，並非所有的錢都能看成獲益。


    # ◎ 你是在存錢還是在浪費時間？


    賺錢謀生沒什麼不對，只要不是因此而阻礙你發財就好。時間的投資報酬率跟其他投資報酬率一樣重要。所有的時段對生意或是人生來說，都有一定的金錢價值。不會有兩個單位的时间具備一樣的價值，如果你花一小時賺五十歐，你可能卻因此流失了一百歐的進帳。時間和錢一樣，都有機會成本。


    當你花費許多時間在某個減少負債的領域時，也許你的收益其實是遞減的。技術性人員，或是膽小怕事的人最容易深受其害。如果你想要空閒時間，就一定得讓別人幫你打理你的生意，而他們所付出的時間是有價的，你得把錢投資在他們身上，才能使自已自由。'
  merge: -1
  img_proc: true
- pgno: 463
  md: 別忘了每三個月到半年，持續測量你的收益價值，自問是否善用自已的每一個小時、每一天。看看這麼做對人生有沒有重大的轉變。把其他不重要的事情延後或刪除。
  merge: -1
  img_proc: true
- pgno: 464
  md: '# # 47

    ## 評估和提高身價的方法


    要衡量自己有多少錢，最極致且最準確的測量方式就是看看你的身價。本人值多少錢，就會賺到多少錢。你的專注力在哪裡，能量就流動到哪裡，而成果也會在哪裡。多數人並不會去衡量自己的身價，但是有錢人會這麼做。你可以等到你有錢以後再來計量自己的身價，或是現在就開始這麼做。其實評估自己的身價，也會驅動你的致富潛力。


    當我以前很窮的時候，比較容易什麼都想到錢，不斷擔心自己缺錢。由於你愈在意什麼，它就會愈猖狂，因此我的負債、擔憂和缺錢，因著我不斷想它而愈加嚴重。


    這樣的狀況令我心力耗竭，也影響到我的感情生活。我記得我當時的女友還得幫我出約會的钱，我覺得實在很丟臉，因此即便我們後來分手了，我還是寄了張支票，把錢全部還給她。雖然這舉動令她很不爽，但她還是兌現了那張支票。'
  merge: -1
  img_proc: true
- pgno: 465
  md: '直到二十五歲左右，我的工作和居住都還是靠我爸媽。我沒有一天不擔心錢的問題。但是是我當時把這些擔心，拿去好好衡量自己的價值並做一番打算，把這些時間一加，就有超過六百多個小時可以拿來好好運用。


    把你的專注點從擔憂債務，轉移到去想想自己的身價有多少，此舉將會對你的心智、物質、心情和一切都造成正面且深層的影響。


    # ◎ 你個人的身價就等於「總資產減去總支出」


    總資產就是所有實體的資產、現金、無形資產和可販售的擁有物。而總支出就是所有的負債以及貶值後的個人信用。


    你公司或是物業的淨值可能是：市場總資金減去總清算債務。


    市場總資金就是銀行裡的現金、股票，以及其他商業資產，包括全部所有物的價值。


    總清算債務則是所有的貸款、折舊和資產清算。


    我個人並不會把我公司的價值算進我的身價裡面，因為我沒打算賣掉公司。資產價值的波動很大，而把錢放在銀行裡的話，錢就只是錢而已。


    如果我把公司的價值算進個人的身價裡，我就得把這個產業所採用的資產評估標準拿來用，例如EBITDA (Earnings Before Interest, Taxes,
    Depreciation and Amortization) 的縮'
  merge: -1
  img_proc: true
- pgno: 466
  md: '寫，即未計利息、稅項、折舊及攤銷前的利潤），還得把諸多衡量指標也納進來，並扣掉二十%的變數，並且也把我持有的股份比例也考量進來。


    如果想要把你公司的價值也納入你的身價裡，我建議你按照實際狀況低估來看，並且與其他的算法區隔開來。


    以下是一些衡量身價和制定身價目標的練習，可以每半年拿出來檢閱一番。


    # 一、總身價


    從你現有的狀況開始看，即使你目前的身價很低或是負面的。設立一個想要達到的身價目標，並且每六個月檢視一次。我個人會每年鎖定一個想要達到的目標，通常是在十一月時，靠近一年的尾聲，我會每個禮拜都檢查一下，並且每半年做一次較全面的檢視。


    把你所有資產的留存價值都加起來，就是你的總資產，然後再扣除你的負債。


    # 二、資本充足率


    資本充足率就是資本總額與加權風險資產總額的比例。銀行的計算指標就是 CAR（Capital Adequacy Ratio，資產滿足率）和 CRAR（Capital
    to Risk Assets Ratio，加權風險資產率）。這些指標有助於幫銀行免於資金過低。


    而你個人的資本充足率則能夠衡量你的槓桿效益和債務比例。或許你一開始的資本充足率只有二十五%，你可以把目標訂為三十五%，然後是五十%。如果你有轉投資或'
  merge: -1
  img_proc: true
- pgno: 467
  md: '其他計畫，只要達到五十%這個目標，你就可以開始降低你的目標了。


    # 三、每月支出與收入比例


    你每月支出占收入的比例愈低，就代表你的財務愈自由。你有更多的成長和做其他投資的空間，也比較能夠因應突發狀況。從你現有的狀況開始觀察，有些人搞不好超過百分之百，那麼就從九十%開始，再來是八十%，然後是五十%甚至更低。


    # 四、(一段期間內的)可支配金錢


    日常可支配金錢 (LCC、Living Cost Covered)，就是一段時間內，你在沒有額外收入的狀況下所能花用的錢。如果你每月的日常支出是五千英鎊，而你擁有五千英鎊的存款，那麼你的日常可支配金錢就是一個月。


    每半年就制訂一下你的 LCC 目標，檢視一下你的財務有多自由，以及你的輔助金和退休金要怎麼運用。


    如果你的 LCC 比你的餘生還要長，你就知道你的財富狀況有多麼穩固了，如果有什麼突發狀況，你和你的家人也能安然度過。


    # 增加身價和自我肯定的練習


    如果想增加自己的身價，以下是一些示範練習和習慣，你可以輕鬆養成。'
  merge: -1
  img_proc: true
- pgno: 468
  md: '既然靈性和物質都很重要，那麼以下這些視覺化的自我肯定練習將有助於制訂並達成你的身價目標：


    # 自我肯定


    過去十一年，我心中一直存在著一句座右銘，它表明了我的生活風格、願景，以及我想成為什麼人。我必須承認我一開始還很懷疑這句話，也許是因為我經驗不足，而且我對有座右銘的人都有些刻板印象。


    「確立」（Affirmation）一字的本意是「穩固、堅若磐石的保證，相信某事物為真，並且無堅不摧。」這可不是吊兒郎當地踩腳踏車或走路時隨意哼唱些句子那樣，而是在創造一個堅定的基礎，確立自己的目標，並且努力讓它成真。


    好，檢視你自己的價值觀，還有你最想得到的事物，以及你想成為什麼樣的人。把這些願景濃縮成五到十個字，例如：財富、成功、力量、幸福、感激、服務之類的。這些關鍵字對你來說會有用的。一旦你建立起這些關鍵字，就把它們寫下來，或是存成聲幕保護程式也可以。又或許你可以貼在床頭，每天睡前複誦幾次，持續做幾天或幾個禮拜之後，這些關鍵字就會銘印在你的腦海裡，而你的潛意識將會開始運作，使之變成現實。


    你也可以利用早晨的時間來做，或是當你想要讓自己狀態良好，甚至是冥想時都可以這麼做。'
  merge: -1
  img_proc: true
- pgno: 469
  md: '沒有付諸行動的話，吸引力法則就只會讓你分心而已。你不可能空坐在家中，等待這些事情掉下來，這些美好事物都有賴你在日常生活中付諸行動。


    幾乎沒什麼人設下明確的目標，我至今仍對這點感到很驚訝。從運動選手到企業家，不管對任何成功人士來說，設立目標都是很基本的。每個人都知道要怎麼訂目標，然而大部分的人卻不去做。知而不行，與無知沒什麼兩樣。


    好好設立目標並養成日常習慣吧，它會讓這些目標成為現實。


    # • 做一個「夢想板」


    為了堅定自己的目標，你可以建立一些視覺線索，或是「夢想小冊」，好提醒並引導自己每天往目標與夢想邁進。建立一個「夢想板」，把它放在你常會看到的地方，像是掛在牆上，或是設為螢幕保護程式或手機桌面之類的，如此一來你就會每天不斷看到它。


    就跟舉重一樣，頭腦也會因不斷激活而成為深刻記憶。創造一個「夢想板」，把照片或名言放在上面，持續讓你的目標視覺化。科學證實這個舉動能讓你記住某種感覺。我們很常會忘記自己看到什麼或聽到什麼，但往往會記得這些東西給我們的「感覺」。


    這是你自己的感覺，所以請將會激勵或啟發你的東西變成可見的物品，並在日常生活當中把這些價值應用上去，包括感情、事業、財務、家庭、旅遊、個人健康或成長等。'
  merge: -1
  img_proc: true
- pgno: 470
  md: '# 让你的心智做好準備


    小時候我爸常說我很擅長在酒吧的地板上找人家掉落的錢。他說我哪裡都可以找到錢。他太常這麼說了，以至於我真的如此相信著，並且愈發使這句話成真。但當我負債時，我的信念完全相反，我總是把注意力放在我的債務和擔心上。我不知不覺強化了這個信念，而它又成了我的現實，更加讓我深信不疑。我當時並不知道這其實是一種預設心理。


    預設是一種記憶效應，當你受到一個原始刺激後，就會回應該項刺激，做出後續的反應。心理學家梅爾（Mayer）和施萬勒夫特（Schwartz）在一九七〇年代提出「誘發心理學」，就是在探討一開始的預設心理會影響該人之後的行為。


    腦部網狀刺激系統（The Reticular Activating System，簡稱RAS）是意識與潛意識之間的篩子，我們每天會接觸到八百萬則資訊，大部分的資訊我們都不需要，或無法有意識地處理。而腦部網狀刺激系統會將這些資訊全數吸收，然後把大部分的資訊都壓在潛意識下。


    透過心理預設、視覺化和複述洗腦，你的腦部網狀刺激系統就會以圖像而非文字的方式運作。


    透過以下步驟，你可以讓腦部網狀刺激系統中的畫面成真。當它經驗到刺激時，同時也會成為心理的預設。因此你的夢想板會喚醒你對夢想和人生渴望的畫面和感受，並'
  merge: -1
  img_proc: true
- pgno: 471
  md: '且在意識與潛意識中不斷出現。這些在牆上、畫面上或裝置上的事物，將會被帶到真實生活中。


    你愈常想到有關負債的念頭，你的預設就愈強大。因此你就會具有批判性的思考意識，給自己找藉口或出現自我設限的信念，並直接變成你的潛意識。而潛意識就像是部超級電腦一樣，它能理解的事物比我們人類還要多。


    利用聽有聲書或廣播來重組你的潛意識，把你的目標和自我肯定語錄起來，定期去聽。讓你的大腦充滿富庶有錢的畫面，讓它們不知不覺成為你的重心。把這些再加上持續的行動和修正、改進，你的幸福、成功和財富就不可限量。


    # 如何成為有錢藝術家


    當我想成為藝術家的時候，內心有很大的衝突，我認為藝術和賺錢是不可能兼得的。或許你對職業和藝術這兩者有自己的轉換方式，你的熱情和專業，若是能真實且自由自在地表達自我，那麼其實這就是一種藝術。


    我很晚才悟出這個道理：不過這對我來說是個當頭棒喝，讓我知道，其實我對自我價值的認定一直在拉低我自己的身價。


    如果我回到過去，用我現在所獲得的知識，再度成為一位藝術家，我可能會用不同的方式來實踐我的藝術創作：'
  merge: -1
  img_proc: true
- pgno: 472
  md: '+   （一）在世時就能發財：

    我會用藝術讓我在活著的時候就賺進可觀的金錢。我會專注於公平交易，並且用創作來衡量自己的價值。我不會堅守那些賺不了錢的藝術創作，等到死了才能發財。我會把——用藝術創作來服務自己和他——這件事當成我的職志，讓自己成為能流傳後世的偉大藝術家。


    +   （二）自我價值：

    我值得富裕和幸福。我生命中的點點滴滴都是我成為藝術家的養分。因此人們理應為了這些價值付我錢。我的價值必須反應在我的價格和服務上。我選擇我愛的職業，同時這也是我表達自己獨特價值和才能的美妙方式。


    +   （三）會行銷就有錢賺：

    這個世界不會白白養我，我必須跟外界分享我想傳達的訊息。我應該自豪但不自傲，並且在關心他人之餘，也不忘推銷自己的作品。成為頂尖藝術家只是藝術這門生意的一環而已，我必須將我的價值、獨特性，還有我推崇及反對的事物，都一一顯露出來。我不會害怕表現自己，只要它是真實的，並且能夠代表我是誰。

    我得平衡規模與稀少性，持續保持自己的價值。

    我還要擁抱所有的槓桿效益和媒體，讓我的作品和品牌能夠發光發熱。對於日新月異的科技懷抱開放的態度，不要整天在暗無天日的工作室裡埋頭畫畫而不去推'
  merge: -1
  img_proc: true
- pgno: 473
  md: '銷自己的創作。


    （四）提供服務、解決問題並關心他人：


    我必須關心自己，才能讓我的熱情超越恐懼，也必須關心他人，才能創造出別人想要買下的作品。我的任務是創造出顧客想要的商品，傾聽他們的需求，此外，我也該著重於客製化的內容，讓口碑能夠傳出去。


    我會傾聽客戶的問題，透過我的工作來幫他們解決這些問題，不管景氣如何都影響不了我的經濟狀況。


    （五）尋求公平交易：


    我會提供給客戶價值略高於售價的商品。我會鎖定目標客群，並且持續提高我的實際價值和定價。我一定要做對的事，解決顧客的問題，並且堅信這麼做可以給我帶來豐厚的收入。我會確保自己用市場獲利來做慈善。


    （六）使用借力使力的槓桿效應：


    我一定會珍惜時間，尋求以小換大的賺錢方式。不只賣真跡，還會考慮是否外包其他人來做我的工作。我能善用數位的形式來量產我的藝術作品？或是創立一個藝術訓練企業或學院？我必須有完整的系統和一定的規模，而不是單打獨鬥的無名藝術家。去跟一些潛在顧客和有錢的收藏家打交道，擁抱社群網站和創新的發明。合影關係也很重要，我應該找一些有力的企業夥伴，還有像喬治·梅得斯一樣的經'
