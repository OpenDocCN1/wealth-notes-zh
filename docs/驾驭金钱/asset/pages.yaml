- pgno: 189
  md: '因為「今天是週五」之類這種平凡的藉口，一個晚上就花掉一百五十英鎊。你應該仔細衡量自己的良善努力（而非結果）值得多少獎勵，節省不必要的支出，等到真的值得慶祝的事情發生再說。


    # 虛榮消費


    想要自我感覺良好、獲得關注、變得更重要，或者尋求關愛而花錢，這些都算是虛榮消費。許多人入不敷出，只為了得到更多關愛、注意、吸引力或安撫痛苦。化妝品產業的產值驚人。巴黎萊雅集團（L''Oréal）在二〇一四年的收益將近三十億美元。前二十名的化妝品生產公司總值將近一千五百六十億美元。如果你也是虛榮消費者，你並不孤單。倘若你希望節省金錢，就要學會愛自己的本質，欣然接納自然的美好。你不需要用化妝品「修復」自己。


    # 罪惡感


    為了掃除內心罪惡感而產生的消費行爲，這種現象其實出人意料地普遍。受到罪惡感的制約，我們被迫掏錢緩和激動的內在情緒。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '這些內在情緒可能是你傷害了某個人，希望買東西來彌補他們的心情。然而，真相是你希望藉此安撫自己的罪惡感。


    你有沒有遇到什麼慈善活動，觸發了內心深處的回憶或情緒，因而強迫自己捐贈？畢竟，一個月十英鎊只是小數字。也或許你無法花時間陪伴深愛的親朋好友，決定用消費或禮物，填補他們的感情？藉此向他們道歉？許多人日复一日地進行罪惡消費，只為了彌補二十年前的過錯。


    但是，這種行為會讓你一貧如洗。即使你曾犯過錯，也請原諒自己和別人。為了自己，也為了別人，用心尋找隱藏在深處的意思，才能消除反覆出現的罪惡消費。


    我有個朋友，多年來，他活在賺錢和罪惡消費的惡性循環中。他非常聰明，只要受新的事物吸引，就會全心投入其中，閃爍著認真的光芒。畢竟新的事物還沒有受到現實生活的影響，他剛轉換心情，尚未遇到挑戰，而且非常興奮，只能看見願景和金錢夢想，無法感受（過去面對的）任何問題。


    他甚至可以把冰塊賣給住在冰天雪地的愛斯基摩人。事業發展蒸蒸日上之後，終於變得更無聊，而追求進步也更為艱困。雖然賺了大錢，但營運和管理並有趣。到了這個階段，他已經達成窮人難以企及的成就，卻開始自我毀滅的過程。罪惡感、羞恥心、害怕遭到批評，以及其他的情緒浮現，他決定背棄合夥人與顧客，將事業交給他人，搬到另一座城市，尋找下一個商業模型、觀念或策略，希望再次得到新鮮感。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '他花錢來緩和痛苦。即將一無所有時，絕望、匱乏、恐懼、害怕等等情緒浮現。面對新的事業，他做出更草率的決策。每一次，這種循環的週期都會變短，精神的磨耗與傷害則愈來愈嚴重。這是一種充滿諷刺的惡性循環。在過去的十年之間，他已經承受了十餘次，甚至更多的傷害。或許，他知道自己應該戒除惡習，只是做不到。


    # ◎ 慈悲行爲（和罪惡感）


    如同以上所說，不過我們現在要深入探討慈悲行爲。有些人捐贈一切，自己卻活在貧窮的環境中，只為了減輕內心深處糾結的罪惡、羞恥或害怕。過去會影響未來。到最後，我們可能變得尖酸刻薄，並且充滿悔恨。


    我得提醒各位讀者仔細思考，你必須寬恕並且放手。為什麼不成立一個基金會，創造更大的財富，善用賺錢的能力，超越單純的「給錢」，打造完整的組織架構，提供教育資源，真正地改善其他人的生活呢？


    # ◎ 為什麼我們會見不得別人好？


    如果你因為金錢，對其他人產生更多的負面情緒，就會開始影響自己。你用負面的'
  merge: -1
  img_proc: true
- pgno: 192
  md: '方式看待其他人，你拒絕和他們一樣，因為你不喜歡別人也用同樣負面的方式看待你。更糟糕的是，你在這段過程中浪費時間，凝聚充滿毀滅性質的能量，時時刻刻懷抱尖酸刻薄的想法，無法專注發展自己的人生。


    事實上，許多人都會陷入同樣的負面模式，雖然不自覺，卻刻意地陷入尖酸刻薄和嫉妒情緒，變成非常嚴重的缺點。


    難過的是，他們的想法通常不正確。上述的問題就是我寫作這本書的主要動力：我希望讓讀者明白另一種金錢觀念和益處。停止尖酸刻薄和嫉妒的想法就是最簡單的步驟。但我們不能紙上談兵，必須立刻開始身體力行。索普（Tk.
    Tame）在Buite.com網站提供的研究成果，可以幫助我們：“嫉妒其實與一種特定的負面情緒相互影響，也就是一般認為“其他人非常善於某件事情，但他們在本质上不值得信託或不真誠”。


    嫉妒是一種針對極端富裕的偏見（所以猶太人和亞洲人遭到嫉妒），我們嫉妒他人極為優秀的能力，認為他們“沒有資格”。


    嫉妒的基礎心理則是“我希望得到其他人擁有的事物”。這種情緒來自人類的基礎演化能力，稱之為“自我評估”：我們比較自己與他人的差別，甚至相互競爭。在人類心理學的研究中，嫉妒理論認為“自我評估”是人類競爭趨勢的基礎。嫉妒促使我們產生“為什麼我沒有”的情緒狀態，激勵我們尋求“更公平”的處理方式，讓自己擁有多事物，不只於其他人，改善我們的情緒。嫉妒創造了一種欲望，使我們希望奪走其他人'
  merge: -1
  img_proc: true
- pgno: 193
  md: '的物品，努力追求成就，甚至勝過他人。但是，嫉妒也會導致疾病或痛楚。如果我們陷入嫉妒情緒，大腦將產生真實的疼痛感，就像經歷心碎或遭到社會大眾排斥的經驗。因此，我們是否應該立刻停止嫉妒？


    # 迴避損失


    人類希望迴避損失的情緒，就像我們不希望承受痛苦。這種情緒非常強烈，可以讓我們陷入錯誤的金錢觀念，或蒙受惡劣的財務結果。迴避損失和金錢上癮是兩種極端的情緒，非常節省的守財奴更容易受到迴避損失的影響。


    在經濟學和決策理論中，迴避損失是指人在面對抉擇時，更容易選擇「迴避損失」而不是積極取得相同分量的收穫。換言之，人傾向於「不要虧十英鎊」，而不是「賺到十英鎊」。


    阿摩司·特沃斯基（Amos Tversky）和丹尼爾·康納曼（Daniel Kahneman）1的研究結果認為，相較於「收穫」，相同分量的損失會在人類心理造成兩倍的影響。當我們思考可能創造利潤或承受損失的決策時，上述心態導致過度極端相信或誇大迴避風險的效用。你願意追求十英鎊的折扣，或者迴避十英鎊的超額支付？雖然傳統經濟學家認為「貪贓效應」（endowment
    effect）和迴避損失效應2都是不理性的行為，但行為金融學'
  merge: -1
  img_proc: true
- pgno: 194
  md: '的想法並非如此，你也不應該小看相關效果。


    保險業界改變定價策略之後造成的消費者反應，可以清楚呈現迴避損失的效果。根據相關研究指出，相較於調低保險售價，提高保險售價對消費者購買意願的影響效果高達兩倍。


    由於人類在一演化的過程中，以不對稱的方式看待收穫和損失，因此深刻地受到迴避損失的影響。舉例而言，如果人類的器官運作已經瀕臨失能，失去一天的食物就等於死亡，但得到額外的食物只能安撫情緒，不等於延長生命。


    讀者務必謹慎留意自己的判斷和思考是否受到迴避損失的影響，必須按照邏輯和理性進行財務決策，而不是淪為情緒用事。


    恐懼損失的情緒非常強烈，將與錯誤的經濟觀念形成複利效應。經年累月之後，你可能會因為固守財富與損失數百万元的收入。


    # 控制和掌握情緒的策略


    擁有財富的人，在成長的過程中，已經學會如何減少金錢情緒，或者理解控制情緒、欲望和避免成癮的方法。他們至少可以杜絕人不敷出。他們更容易創造財富，或者具備高價值的金錢相關企業，甚至藉由賺錢和創造財富，服務他人且實現生活目標。重點不只是克服情緒，而是實現潛能，並且取得長期勝利。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 主掌情緒


    控制情緒的方法並非否認情緒或者關閉自身感受，而是觀察並且理解。我們為什麼會產生情緒？以下是一些策略，協助讀者測驗自身情緒，藉此理解、管理並且觀察情緒，暫時將自己抽離情緒，將自己當成客觀的第三者，仔細觀察，但不要批評。我經常告訴自己：「羅伯，真有趣，讓我們看看你做爲什麼。一理解情緒和反應背後藏著什麼。我們的情緒和反應從何而來？為什麼你會產生如此反應？


    +   (二)理


    +   (三)為什麼情緒如此強烈？我們是不是還沒學到重要課題，所以無法撫平情緒？


    +   (四)我們應該藉由情緒學會哪些課題？你應該如何改善？


    +   (五)情緒能夠產生何種益處？


    +   (六)孤立自己。直到情緒平息之前，前往安靜的地點，讓情緒暫時無法影響你或其他人的生活。


    +   (七)尋找一位真正的好朋友，請他擔任你的「出氣筒」。一位誠摯的好友，不會批評你，讓你傾訴情緒。友善地詢問朋友：「我能不能發脾氣？」「獲得同意之後，盡情宣洩。只要找到情緒出口，你的感覺就會變好。壓抑且累積強烈的情緒會創造消極的攻擊行爲，導致你完全崩潰，甚至生病。


    +   (八)尋找你信任的諮詢者、顧問和導師。他們的能力足以提出睿智的建議，向他'
  merge: -1
  img_proc: true
- pgno: 196
  md: '們請益。


    （九）做出草案或情緒化的決定之前，務必三思而後行。


    （十）如果你面對挑戰，請仔細閱讀、聆聽或者實際參與各領域專家的課程。


    （十一）所有的消費和投資行為，都應該與你的最高價值有關。如果投資（消費）有助完成目標，請盡力而為；倘若無關，則立刻收手。


    與其被動地受到情緒影響之後產生反應，不如事先擬定處理策略，並且保持理智清醒和耐心。心懷感激地傾聽、學習和接受他人的回應，妥善判斷，理智思考最好的結果，而不是受到情緒狀態的影響。請記得，財富代表幸福的人生，只要可以管理情緒，就能夠管理金錢，順利成長致富，給予他人更多協助。


    +   1 特沃斯基和康納曼都是以色列裔的心理學家，兩人長年合作探討人類的認知偏差以及風險處理理論。


    +   2 票賦效應與迴避損失非常類似。傳統的經濟學相信，「得到某個商品而付出的金額」等於「失去該商品的損失」，但票賦效應認為，擁有某個商品之後，人類的心理會自然增加該商品的價值，於是「失去該商品的損失」就會變高。票賦的英文來自endowment，意指增加價值。票賦效應與迴避損失兩者可以共同解釋為什麼人們傾向於迴避「損失」。'
  merge: -1
