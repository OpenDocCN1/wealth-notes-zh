  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_83_0.png)


    # 金錢的目標和本質


    金錢存在的目的，是為了創造一種有效、公平且適用各種環境的交易價值，藉此促進人類社會的發展。


    為了處理未來的不確定性，我們認為金錢可以發揮保值效果。今日的儲蓄，可以用於明日或未來的消費。


    一開始，金錢採用了具體的有價形式，例如貴重金屬硬幣。後來，金錢演變為法定貨幣，金錢本身的材質沒有任何價值，而是由法律規範其價值，藉此取代古代時期以物的交易系統。金錢具備四種普遍的經濟目標：


    # 一、交易媒介


    金錢比以物易物系統更有效率。在以物易物系統中，商品或服務必須直接交換另外一種商品或服務，缺少所有人一致認同且接受的交易機制，必須先找到有意願以物易物'
  merge: -1
  img_proc: true
- pgno: 84
  md: '的雙方，在準確的時間，以正確與公平的數量進行交易，交易時間也無法延遲，必須立刻完成。


    假如雙方分別是一位想要交易牛的農夫，以及一位想交易鞋子的鞋匠，這筆交易就很難成功。我們究竟如何平等評估兩種商品的價值，讓交易雙方都能滿意接受，這就是經濟學說的「雙方的需求巧合」（the
    double coincidence of wants）。


    以物易物系統仰賴交易雙方達成「雙方的需求巧合」，但難度很高，因此商品的流動速度較慢，成交的次數也很低。


    以物易物系統還有其他問題。假如你用三雙鞋子換了一頭動物，動物死了，現在必須購買土地，於是你需要再度使用以物易物系統，並承擔此系統的不便。隨著交易物品如不斷增加，你承受的不便與缺乏效率也變得更多重。除此之外，你還要處理動物以及其他商品衍生的倉儲與可分割性問題。


    相較於以物易物，貨幣或鈔票更耐用，尤其是現代貨幣採用各種化合物製成，也適合存放，能夠用來多次交易，沒有耗損和折舊問題，與會死的動物完全不同。金錢可以分割，適合攜帶和流動，但其他商品則否。金錢具備法定價值，相對不易偽造，可以得到政府管制的保護。


    # 二、會計單位


    金錢是一種更具備標準化特色的衡量單位，可以用來比較價值，也能夠協助我們理'
  merge: -1
  img_proc: true
- pgno: 85
  md: '解諸如利潤損失、通貨膨脹以及一般會計等經濟學原則。相較於失去一頭死去動物的部分肢體，損失十英鎊的概念更好理解，也能準確地傳達給他人。


    十英鎊就是十英鎊，不會因為交易鏈變得比較長而改變。


    商品價格會因為貨幣波動、升值或貶值、股市表現與信心指數、景氣循環、英國脫歐、局勢動盪等因素而持續改變。在這種情況下，使用標準化的會計單位，例如英鎊、美元或歐元，才能夠完成標準化的會計評估。如果沒有金錢貨幣，你又要如何評估死去動物（可能已經略微發臭）受到通貨膨脹與貨幣變動影響的價值呢？


    # 三、儲存價值


    金錢是一種儲存價值的標準單位，非常有效而且不會腐壞衰退。我們可以儲蓄金錢，過一陣子再使用，也不會因此損失價值。金錢是人類應對未來不確定性的機制，也是經濟學說的「極端的不確定性」（radical
    uncertainty）。


    我們認為，金錢此刻儲存的價值，即使到了明天或未來，依然保持相同或近似的價值。


    數據分析無法應對極端的不確定性。金錢不是唯一具備儲存價值特質的單位，房地產、貴重金屬、名錶、珠寶和其他商品也能夠有效儲存價值。但金錢擁有最好的流動特質，可以持續交換，進行交易，也能夠在世界各地準確地評估價值。流動能力不佳的商品，其交易成本較高，而其他商品會耗損，所以儲藏、分期付款或交換都會造成貶值。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 四、分期付款的標準單位


    在以物易物系統中，你無法分期付款，因為商品可能承受腐壞、貶值或倉儲交換等風險。金錢能夠有效地保存，因此解決了上述難題。當然，通貨膨脹還是會有影響，但相較於其他商品，通貨造成的損失相對較少。


    雖然以物易物系統有其缺點，但也有優點。在金錢貨幣產生危機時，以物易物可以取代金錢，例如貨幣系統無法持續運作、極度的通貨膨脹、經濟危機，或者金錢貨幣無法完成商業交易。


    倘若交易對象的信用價值資訊過於隱密，或者缺乏信任，以物易物系統也相當可靠。金錢順利運作的前提是信任。信任就是金錢。


    金錢也能夠創造相對平等，能夠相對平等地衡量你的個人價值、貢獻和財富。如果你花了好幾個小時或好幾天做了一雙鞋，另一個人則是用多年時間畜牧一頭牛，應該如何比較兩者的內在價值？唯一的方法就是把內在價值轉化爲金錢。金錢是判斷價值的標準單位，你也會在本書稍後的章節知道如何評估自己的價值。


    總而言之，金錢只是一種有效、公平且受到所有人認可的工具，用來儲存價值，進行交易，促進人類的演化發展。


    許多人因為迷思、謬論和幻覺而無法看清金錢的本質。也因為社會、家庭、媒體或自我施加的限制，不能理解自己的本質。金錢是一種眾人接納的系統，讓你快速有效地'
  merge: -1
