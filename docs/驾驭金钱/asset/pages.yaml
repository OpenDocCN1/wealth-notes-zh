  img_proc: true
- pgno: 442
  md: '債商品或消耗品，導致價值受損，也無法創造資本或持續收入。有錢人也容易受到欲望消費的影響，特別是剛開始過富裕生活的人。根據蘇格蘭寡婦金融公司（Scottish
    Widows），有將近十五％的英國人毫無存款，三十三％的英國居民名下存款不到五百英鎊。只有十二％的英國居民擁有五萬英鎊以上的存款或投資。


    有錢人和窮人最大的差別，在於有錢人購買資產，資產創造被動收入，藉此保存資本。他們花費被動收入，購買消耗品，妥善應用時間、資本和金錢，能夠保持收支平衡，繼續增加資本。因此，應該妥善管理日常消費水準，減少欲望消費，直到擁有足夠的儲蓄和資產緩衝空間。


    此外，任何貶值的物品都會損害資本。我們應該盡量保存資本，在二手市場、樣品拍賣、網路拍賣、促銷活動、暢貨中心、購物中心購買奢侈品，或者添購過季商品。如果你用一年的收入購買非必要商品，就會產生可怕的複利效應。請小心謹慎，不要陷入邊際效應遞減的陷阱。


    # 把花費習慣變成投資習慣


    如果你可以把許多的花費習慣變成投資習慣，那麼你就運用了八十／二十法則，省下並且賺進幾千幾百萬的金錢，同時還擁有一般人所沒有的生活技能。把你買下的實體物品都想成現金流失，用投資人的角度看待每一筆花費，去思考：'
