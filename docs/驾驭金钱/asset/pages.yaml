  md: '# （三三）


    系統是「完成目標時制訂的一組原則和過程——組織良好的計畫和方法」，也就是用符合預期的方式，建立最有效的方法，追求理想的結果。整齊有序的处理方式或價值觀，反覆創造良好的結果，減少錯誤、提升效率、避免浪費資源。


    # ◎ 自動化作業


