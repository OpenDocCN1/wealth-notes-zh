  md: '# 創業


    心追求。如果你成為公司不可或缺的人才，薪資和職位都會提升。倘若他們不欣賞你的價值，其他公司就會請獵人頭公司挖角你。以下是符合公平交易、快速發展職業生涯，創造最多金錢收入的槓桿方法：


    +   □ 了解管理人員、老闆或雇主的價值。


    □ 思考如何提升公司的最高價值領域，讓公司的利益最大化。


    □ 從事自己想要的工作，不要委曲求全。


    □ 每個月定期和管理者見面，討論你的工作表現，聽聽對方的看法並改進。


    □ 提出讓公司賺錢的構想，在合理的情況下，要求分紅。


    □ 追求明確的公司理念、目標和時間規劃，以獲得最高價值和分紅。


    □ 超越預定目標。


    □ 建立傑出的效率，妥善管理時間生活，創造最顯著的進步。


    □ 客戶至上。


    本書的重點不是法律和會計制度的差距，所以我不會花時間探討個人創業、個人貿易商、經營有限公司或合資開設債務有限公司的差距。讀者可以請教會計師或專業人'
