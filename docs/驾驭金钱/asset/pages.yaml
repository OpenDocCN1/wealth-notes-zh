- pgno: 312
  md: '# 快、更快，最快


    槓桿效果是一種商業、金錢和生活策略，但不是什麼「快、更快而且最快致富」的方法。


    生活槓桿是真正能夠追求成功、自由和保存時間的捷徑。如果你願意善用人力資源，即便一單位的人力資源只能賺到微薄的利潤，但眾多人力資源的總利潤，絕對超過各自賺取的利潤加總。舉例而言，一單位人力資源的每小時利潤是十英鎊，聘請一萬人，遠遠超過你一個人一小時賺一千英鎊。


    我開始在房地產建立第一個商業投資事業時（藝術家生涯不算，當時我並不清楚什麼是真正的事業），我和合作夥伴總是親力親為，拚了老命。我們的表現還算可以，盡力維持成本，保護弱點，並且迴避風險。我們創業時，遇到歷史上最嚴重的房地產衰退事件。


    回首過去，只要改變原本的方法，就能做得更好、更快、更聰明，而且不必增加風險。我們應該更快增加槓桿。我經常問自己：「羅伯，如果你回到過去，擁有現在的知識，你會改變什麼？」答案是：找到最好的人才，發揮槓桿效果，專注構思策略、願景和建造優秀團隊，空出時間，將無趣艱困的工作外包給其他人，因為他們的技術還比我們更優秀。'
  merge: -1
  img_proc: true
- pgno: 313
  md: '委任合適人才完成相關工作的成本，遠遠低於我們親自執行。當時，我們的眼光不夠長遠，只能看見努力節省的金錢，無法察覺因為凡事自己處理而損失的成本。


    上述的原理也可以反映發展不動產（我的房地產學院之一）的學生成群成員的訓練成果。積極行動的人如果快速發揮槓桿效果，就會創造良好成績。多數成功的學員已經全心投入房地產投資，在九到十八個月之內，建立了數百萬英鎊的資產組合，每月淨收三千英鎊、五千英鎊、一萬英鎊至兩百萬英鎊不等的被動收入。很多人辭掉原本的工作，擠身百萬富翁之林，甚至開始訓練自己的學員，成為房地產業界令人尊敬的專業人士，不只回饋知識，也開創另外一項收入來源。


    相較於我和其他夥伴，學員用更快的速度，得到更好的成果，而且避免更多錯誤，因為他們善用前輩的錯誤，發揮槓桿效果，至少明白如何輕鬆成功。但是，其他不願接受積極效果的學員，步調較為緩慢。


    # 非槓桿運作造成的機會成本


    你之所以獲得成就和金錢，重點不在於你「做了什麼」，而在於你「不做什麼」。舉例來說，你選擇賣小船，就不能投資遊艇；如果你定價低廉，代表拒絕支付高額款項的客戶。'
  merge: -1
  img_proc: true
- pgno: 314
  md: '我們很容易聽從「傳統」建議，相信努力工作、付出時間並且犧牲奉獻那一套。我和荷馬剛開始創業時，也採取這個方法。我們二頭栽入，壓根沒看到其他可能性。


    我們的事業就像一艘全速前進的船，但卻找不到方向。我們每天的工作時間有限，無論多努力或提升效率，事業依然無法成長。我們遇到撞牆期，愈來愈忙碌，無法獲得真正會賺錢的工作，甚至因為太累而出錯。


    事實上，我們是把對的方式用在不對的工作上，卻忽略應該專注的任務。我們只是不斷搬石頭砸自己的腳。諷刺的是，當初想要創業的目標，就是想多一點自由的時間，追求自己熱愛的事物，但我們太忙了。我和荷馬合作的第一年購買了二十件房地產，收入還算不錯，但「不錯的收入」阻攪我們追求真正的財富。


    三十一歲那年，我終於成為百萬富翁。我日以繼夜工作，兒子已經九個月大了。某天深夜，我回到家，未婚妻和我促膝長談。她說：「我很高興看到你的事業有成，但如果你繼續這麼忙，巴比起床前就要出門工作，巴比睡覺時還沒回家，等到他十八歲，都還不知道自己的爸爸是誰。


    當時的我很難放鬆，因為我窮日落月，只為了讓家人享受更好的生活。直到放下自尊，我才看見兩種可能的未來。第一，每個星期工作八十小時，賺到很多錢，獲得社會大眾認可，將「辛苦工作」視為閃閃發亮的徽章，卻精疲力竭，家庭關係岌岌可危，為了生活而工作，追逐永遠看不到的終點。'
  merge: -1
  img_proc: true
- pgno: 315
  md: '第二，我可以在家中或世界各地工作，自由旅遊，經常陪伴家人，直到他們覺得我很煩，趕我出去走走，並且藉由被動收入，享受高品質的生活。


    就是這個啟發了我，讓我思考生活槓桿、生活經濟系統、人力資源以及建造事業的過程，並且成為另一本書《生活槓桿》討論的哲學。你和我一樣，只需做出正確的決定，將金錢視為生活槓桿的必然成果，而不用辛苦追求的目标。


    將時間快轉到現在，我個人和公司的事業已經發展妥善的槓桿效果，雖不完美，偶爾也會遇到一些意外或混亂，但卻總是能順應環境，求新求變。


    我們原本習慣自己處理房地產，後來聘請租賃仲介，甚至和租賃仲介建立商業合作夥伴關係，建立槓桿。我每年進行兩百五十場的訓練演講，現則聘請一百位教育訓練講師。


    我們成立專業的收購團隊，不再親自尋找和購買房地產了。我們原本購買小型單人套房，現在投資大型商業建築。我們的教育事業原本僅限英國當地，現在也擴展全球。


    我們原本一週的收入是六十英鎊，現在則是六十萬英鎊。我們原本親自處理所有事，現在則聘請導師、智囊團和專業人士。你也可以！這是一種成長的過程。我沒有辦法獨自依靠努力工作完成上述的成就，更沒有時間寫書和學習。我由衷希望幾年之後，我的事業更為茁壯龐大，相形之下，讓此刻的成就顯得「嬌小可愛」。但是，如果我當年沒有大徹大悟，繼續妨礙自己，就不會有這些成就。'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 槓桿的五個重點


    # （一）時間與生活


    沒有時間管理這回事。你無法控制或改變時間，所以不能管理時間。你只能管理自己，以及如何使用、節省、投資或浪費時間。時間管理應該改名為「生活管理」，藉由一保存時間」，盡可能減少時間浪費，我們的目標就是「獲得」更多時間。時間是最寶貴的稀有資產，而且不停減少。從出生開始，時間就進入倒數計時，你投資愈多時間，浪費愈少時間，就會擁有更多時間，和自己心愛的人，在喜歡的時候，從事熱愛的事物。


    你的時間觀念會直接影響控制時間和發揮槓桿效果的能力。你是否將時間視為最珍貴的資源，願意付出所有，妥善保存時間？你是否相信時間是寶貴的禮物，想要發揮每分每秒的最大效用？你是否正在尋找發揮槓桿效果，多重應用時間的方法？或者你受限制了時間困境？你希望解放自己，享受每一刻？你是否心靈感激地活在當下，或者悔恨看待過去，恐懼面對未來？


    我們必須永遠珍惜並且妥善計算時間，絕對不要錯過保存時間並且發揮槓桿效果的機會。舉例來說，我曾經在剪頭髮時，用社群網站和商業夥伴開會。請讓我計算其中的槓桿價值：如果我一個月剪頭髮兩次，一次半小時，一個月就可以進行一個小時的商務會議。假設我活到九十七歲，代表得到七百二十小時的槓桿效果，一個小時賺進一萬英'
  merge: -1
  img_proc: true
- pgno: 317
  md: '鎊，只要謹慎投資時間，六十年就能賺到七百二十萬英鎊。


    許多大規模企業的擁有者不會每天工作。他們聘請數千名員工。他們知道時間的價值，經常說：「這件事情不值得我的時間」或「我不要為了這件事情而犧牲睡眠」。你現在知道為什麼了，請睿智地採取同樣的態度，將時間視為珍貴的資源和投資。


    以下是三種最珍貴的金錢時間槓桿模型：


    # ◎ 時間投資報酬 (RoTI: Return on Time Invested)


    時間投資報酬是結合時間槓桿模型和操作方法的系統，藉此分析我們如何使用時間。關鍵的問題就是不停詢問自己：「從事這個工作會讓我得到最好的時間投資報酬嗎？」


    這個簡單的問題可以讓強迫我們時時刻刻妥善應用時間，從事正確的工作，獲得最大的槓桿效果，用最少的時間賺到最多錢，放棄沒有槓桿效果的工作，或者委任他人辦理，實現每個工作的潛能，創造循環益處和收入。


    # ◎ 時間機會成本 (Time Opportunity Cost)


    時間機會成本是指當前工作或花費時間造成的成本，包括財務和其他層面。許多人不知道什麼是時間機會成本，因為他們只能看見眼前工作的利弊，而不是他們放棄的其他工作，或者其他選項能夠創造何種優缺。從金錢的角度來說，機會成本非常容易被衡量。如果你一天用三個小時處理行政工作，只需要每小時十英鎊的價格，就能委任外包，代'
  merge: -1
  img_proc: true
- pgno: 318
  md: '表你一天失去三個小時，不能實際銷售產品，創造大於每小時十英鎊的收入。倘若你一天花三小時完成房地產文件工作，也就是一天失去三個小時，不能尋找新的房地產投資物件，失去獲得數萬英鎊利潤的機會。


    讀者務必永遠保持警惕，不要只注意眼前的工作，而是思考「我放棄了什麼」以及「我現在可以做什麼」。正如時間投資報酬的查核方法，我們時時刻刻思考兩個重點：「我如何投資時間」以及「我是否能夠將時間投資在其他更好的工作」？


    # ◎ 非剩餘時間（Net Time：No Extra Time）


    一般討論的「多工」（multi-tasking）其實只是受到太多工作的干擾，同時處理過多事項，顧此失彼，浪費時間和腦力。非剩餘時間可以做到真正的多工，減少傳統多工思維的缺點，讓你用一個單位的時間，獲得多項成果。以下是非剩餘時間的應用例子：


    +   旅行、健身、走路時聆聽有聲書。


    +   搭火車或坐車時處理聯絡事宜。


    +   觀賞傳記紀錄片（娛樂和學習兼顧）。


    +   盡可能搭乘火車或鸭請司機，在移動過程中思考更重要的工作目標或其他事項。


    +   園藝、清潔、烹飪、乾洗、駕駛、育兒和家務也要善用外包資源，發揮時間槓桿效果。


    +   度假行程結合商務計畫、願景規劃、外地演講或智囊團會議。'
  merge: -1
  img_proc: true
- pgno: 319
  md: "+   · 購物或旅遊計畫結合其他課程或各種活動。 \n · 與導師或商務人士共進晚餐。 \n · 社交場合結合商業活動。 \n 如果你需要更多詳細的資訊，請參考我的另一本書《生活槓桿》。\n\
    \n# （二）金錢（資產）\n\n建立適合的資產，完成初步階段之後，減少時間支出，在公平交易的情況下，創造財富和收入，使你享受槓桿效果。你將時間、資本和資源投入資產，創造被動收入。購買資產，完成相關設置，建立妥善的自動管理系統，或聘請專業人士處理，你不必親自處理瑣碎事務，將保養修繕工作委任外包，應對各種資產的特質，再將收入轉為投資，建立更多資產。以下是各種資產類型，我們將會在稍後的篇幅細緻探討更有關的內容：\n\
    \n+   · 商業（有形的商店、無形的網絡商店或電子商務）。 \n · 房地產。 \n · 智慧財產權（觀念、專利、執照、資訊或音樂創作）。 \n · 投資（股票、債券）。\
    \ \n · 融資。 \n · 實體物品（貴重金屬、藝術品、手錶、酒、經典車）。"
  merge: -1
  img_proc: true
- pgno: 320
  md: '。合夥（特許經營、合資）。


    # ◎ 槓桿鍊金術


    金錢槓桿就是資產鍊金術，例如許多經濟學家口中的財務奇蹟「部分儲金銀行制度」（Fractional Reserve Banking），申請貸款投資房地產或其他資產類別，選擇權和其他的金融合約使我們可以控制資產，不必準備額外的儲備金，也無須實際交易或購買。


    進階槓桿包括商業合資，由其中一方提供全額資金，但不必付出管理和經營時間。除此之外，我們也可以投資單人套房或多套房住宅提供住宿或租賃服務。金融機構甚至建構更複雜的槓桿，將貸款重新包裝成CDO（債務擔保債券，Collateralized
    Debt Obligations），也就是將房屋貸款、債券和貸款組成新的金融信用商品。槓桿鍊金術唯一的限制，就是人類的想像力和陳腐觀念。


    # ◎ 槓桿平衡


    在進一步探討怎麼減少擔保、創造更多收入的財務槓桿技巧之前，我必須強調槓桿平衡的重要性。


    建立太多金融槓桿和各種規模大小的投資決策，可能會使你陷入負債，或者背負嚴重的放款成數。如果你無法填補放款成數的虧損，將導致銀行回收融資貸款，甚至損失資產。'
  merge: -1
  img_proc: true
- pgno: 321
  md: '同樣的道理也適用於銀行。銀行必須維持一定比例的貸款／存款比例（即法定儲備金），如果過低，政府就會強制銀行收回貸款。銀行同時運作許多複雜的槓桿金融商品和機制。但是，倘若走到另一個極端，也毫無槓桿效果，你的金錢和資產就會陷入停滯狀態，形同浪費。


    沒有槓桿效果的資本會受到通貨膨脹的傷害。信用債務比例良好的槓桿資產則會創造良好收入，除此之外，由於貸款債務的真實價值也會受到通貨膨脹的影響而貶值。換言之，只要建立平衡的槓桿投資，你可以獲得兩種利潤（投資收益和貸款貶值收益）。


    # ◎部分儲備金銀行制度


    銀行接受民眾的存款，將部分存款借貸給有需要的民眾，或者轉為投資。銀行必須維持一定比例的貸款／存款比例，稱為「儲備金」。


    銀行以實際貨幣或帳戶餘額形式保持儲備金比例。瑞典中央銀行（Sveriges Riksbank）是歷史上第一間國家中央銀行，建立於一六六八年。許多國家在一六〇〇年晚期開始效法瑞典，建立自己的中央銀行，賦予央行規定法定儲備金的比例，稱之為「貨幣基礎」，也就是現金和儲備金的比例（現金儲備比例）。


    部分準備銀行制度雖然引起批評，卻讓銀行成為貸款者和儲蓄者之間的金融橋樑，向民眾提供長期貸款服務，也有金錢流動服務，讓儲蓄者可以立刻提領現金。有時候，銀行可能會遇到大規模的儲蓄者希望提領所有存款，金額超過儲備金，但這種風險發生'
  merge: -1
  img_proc: true
- pgno: 322
  md: '的機會非常稀少。


    為了應對銀行經營的風險和極爲罕見的風險，大多數國家的政府都會管制並且監控銀行運作，具體的措施包括儲備金保險、由政府擔任商業銀行的最後一道防線、制訂規則（限制銀行必須保持特定比例的最低儲備金，所有的商業銀行都必須保持儲備金，不得全額借貸或投資等），控制利息和調節通貨膨脹。


    上述的管制方法保持銀行系統有效運作。實際上，銀行系統的運作重點是信任，而不是維持金錢的妥善流通。因為幾乎每一間銀行都無法承擔所有儲蓄戶同時想要全額提取現金。只有媒體持續散播恐懼和不信任消息時，才會造成擠兌現象。由於銀行的儲備金低於儲蓄金額，部分準備銀行制度可以讓一個國家的金錢成長潛力超過中央銀行印製的金錢額度。這種經濟系統的槓桿足以推動國內生產毛額成長。


    無論生產者或消費者，都可以因為各種形式的金錢成長潛力而受惠，例如合法的超額借貸、個人貸款、房屋抵押貸款、信用卡和其他金融商品。


    如果沒有這些機制，上述的美好成果就不會發生。從一六〇〇年開始，人類已經善用金錢槓桿效果長達四百年，我們可以從中學到許多珍貴知識和運作模型，協助自己建立適合和實現價值。你是否能夠在自己的事業（商業）領域中應用相似的概念，提升金錢的流動速度？'
  merge: -1
  img_proc: true
- pgno: 323
  md: '# ○ 黃金本位主義槓桿


    為了對抗一九三〇年代初期的經濟大蕭條、險峻的失業和嚴重的通貨緊縮，美國政府提出了各項振興經濟方案。美國和其他國家決定共同提升利率，藉此有效劝阻民眾不要提領存款，並且減少黃金供給，卻讓一般民眾和投資人無法貸款。


    一九三三年，美國總統羅斯福決定切斷美元和黃金之間的關係，讓政府在市場中投入更多資金，同時降低利息。《金融之王》（Lords of Finance）的作者季奎特·阿禾德（Laird
    Alamed）表示：「絕大多數的經濟學家現在都同意，美國當年能夠解決經濟大蕭條，九成的原因是結束黃金本位主義。」直到一九七一年之前，美國依然同意讓外國人用美元換取黃金，直到時任總統的尼克森終止這項協議，避免渴望發美元財的外國人掏空美國的儲備黃金。


    世上的黃金有限。二〇二一年時，黃金的礦產紀錄是十六萬五千公噸。巴菲特曾說，地表上的黃金總量只能塞入二十平方公尺（六十七平方英尺）的大盒子中。由於產量和取得途徑有限，也無法預期人類是否會在未來找到新的黃金來源，黃金難以拓展經濟基礎和成長，只會降低經濟政策的效果，阻礙經濟發展的反應和速度。


    如果美國當年沒有終止金本位主義，印製更多金錢鈔票，經濟成長就會變慢，造成供應不應，價格大幅上升，經濟系統無法穩定運作。當初的策略也擴展現金錢流動速度和加密貨幣的成長空間。美國的策略發揮很好的槓桿效果，值得我們深思學習。'
