  md: '# ## 金錢會傳染？


    在世界的每個角落，你都可以用手中的智慧型裝置，以光速進行金錢交易。在未來，虛擬實境、人工智慧、物聯網（Internet of Things）、穿搭用品、無人商店、皮下組織晶片……將會變成交易和金錢流動的媒介，此外還有各式各樣超乎想像的奇妙管道。這一切只需透過網路就可達成。


    你也可以在別人的伺服器或網路平臺，設立自己的商店或事業，不必聘請員工，也不用囤貨，或是負擔經常性支出。只要登入，你就可以免費進入全球網絡，接觸十億名顧客或追蹤者。你能免費且迅速地發揮社交網絡和行銷平臺的槓桿效果，善用其他企業、存貨和服務責任，創造屬於你的龐大事業。


    全球最大的電子商務網站阿里巴巴沒有任何庫存，Amazon亦不擁有任何飯店，優步（Uber）同樣沒有購入任何計程車，臉書甚至不提供創作內容，網飛（Netflix）也沒有設立任何實體戲院，是不是非常聰明？


