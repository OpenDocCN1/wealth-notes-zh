- pgno: 235
  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_235_0.png)


    # 時間和金錢的關係


    俗話說：「時間就是金錢」，我本人則相信「金錢就是時間」。


    金錢和時間能夠相互服務，並且保存彼此的价值。大多數的人用盡所有時間，只能賺到微薄的金錢，勉強餬口，行將就木時才能享受自由，退休後也還是沒有足夠的時間和金錢。這是一個可悲的弔詭局面，只要理解時間和金錢的關係，就可以解決這個難題。


    # ### 逆轉工作和金錢的關係（破除努力工作的迷思）


    追求成功的最大迷思之一，就是以為自己得非常努力工作，比別人付出更多心力和時間，才能成為佼佼者。換言之，就是認為必須犧牲才能換取成就，即使痛苦也不能放棄，不能示弱，要像個男子漢一樣強硬地屢敗屢戰。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '如果我們在說的是高等體能訓練，那麼上述說法的確可能為真，但思考個人職業發展和時間投資時，考量的因素就必須更多了。


    努力工作的人相信「熟能生巧」，但聰明工作的人主張「先練巧，就能熟」。


    首先，我們應該選擇正確的投資時間方式。如果一個職業目標根本無法創造美好的成果和財富，為什麼要日以繼夜發瘋似地投入，為之鞠躬盡瘁？


    倘若每個星期工作六十小時，希望三到五年就能升職，但增加的薪水甚至無法應付通貨膨脹，還得延遲退休，不能從事自己熱愛的活動，花了三十年，年薪只從三萬英鎊提升至六萬英鎊，這些努力和奉獻都是浪費時間。


    除此之外，有可能升職以後，投入的工作時間變多，薪水的增加卻不成正比，算起來每小時的實質薪資其實不增反降。若你大半輩子都在從事能夠輕易被科技或儀器取代的技術性工作，只能仰賴國家照顧你的下半生，那你更不該付出那麼多努力和時間。


    這種行為違反了人類的求生本能。你花時間讓別人發財，卻無法親手掌握自己的財務發展，勞心勞力，卻無法給自己帶來美好的結果。


    許多人認為（並且將這些觀念傳授給其他人），只要付出時間和努力，就會變得成功和富裕。這是錯誤的想法。建立財富需要完成許多階段的努力，努力工作和付出時間只是起點，能夠讓你更上一層樓。等到你投入策略、願景、領導和解決重大問題階段時，工作和金錢的關係幾乎已經完全相反了。換言之，在後期階段，你付出愈多努力，'
  merge: -1
  img_proc: true
- pgno: 237
  md: '愈是勉強追求，結果反而會變得更糟。除此之外，努力工作可能造成「邊際效益遞減（diminishing returns）”。


    # 寫書的「拚命三郎」模式


    讓我用這本書作為例子，說明拚命三郎的工作模式：


    +   （一）建立知識。閱讀許多書籍，參加相關活動和研討會，結識個人發展和金錢知識的導師。


    +   （二）獲得經驗。用十年的时间賺錢，創造財富。


    +   （三）研究。觀看所有影片、財富金錢的書籍、課程、有聲書之後，製作筆記。研究所有的歷史文件、數據、資料、故事和傳記。


    +   （四）寫書。許多人需要數年時間寫作。大多數的人，腦海裡都有一本書的「想法」，但並未付諸行動。生活的種種一切妨礙他們寫作。他們無法專心寫書，甚至產生罪惡感和挫折感。


    +   （五）編輯全書。這個過程非常辛苦，很多人都希望自己可以順利度過，但雖然經過多次校對，依然會有疏失。


    +   （六）自行出版。作家必須自己尋找印刷廠，管理印書事務。我們曾經印過五千本之後，才發現書頁編排出錯。'
  merge: -1
  img_proc: true
- pgno: 238
  md: '(七)行銷書籍。一本書如果缺乏行銷，就是浪費數百小時的時間。二〇一五年，光是美國境內就有七十五萬本作者自行出版的書籍。根據波克報告（Dowker report），二〇一六年時，非虛構類書籍的平均銷售數字為兩百五十本。但是，其中二十%的書籍，占了八十%的銷售量，因此剩餘八十%的書籍，每年的總銷售量只有五十本左右。如果你決定印刷一百本，卻沒有妥善行銷，不但損失金錢，也浪費時間。


    (八)更新書籍內容。許多書籍在出版的當下，就已經不是最新的資料結果了。每一年至三年，作家必須更新書籍內容，否則讀者不會願意購買。


    我們會在本章結尾提出如何善用時間槓桿的聰明工作方法，而上述的「努力工作」模式則是每一位誠實付出的作家都有的經驗。這是我個人的第九本書，我體驗過這種辛苦的過程，當然也犯下各種不必要的錯誤。


    # 超時工作的迷思


    超時工作是另一種常見的錯誤觀念。你認為自己加班就可賺到更多錢，實際上，你只是用時間交換不成正比的收入和益處。


    那些超時工作的時間一去不回，最後你也只能得到微薄的加班費，用來買一些消耗'
  merge: -1
  img_proc: true
- pgno: 239
  md: '品，增加個人支出，對財務狀況毫無正面影響。


    為了保持現有的財務水準，賺錢的壓力增加了，你必須付出更多時間，卻無法彌補通貨膨脹造成的損失。


    傳統的員工，懷抱傳統的工作思維，相信「努力工作付出和超時工作」。他們確實創造了個人財富並且促進事業發展，但都是企業主或國家稅捐機構在享受最終的益處。一般員工被貸款、日常開銷、財務焦慮或退休計畫壓得喘不過氣，必須非常努力工作。可悲的是，國家機關可能會擅自挪用你的勞保退休金，只要一個人事改組，你的職位立刻變得多餘，老闆隨便一個決定就能讓你捲鋪蓋走路。


    成為企業員工不是壞事，它可能是正確的選擇。


    在提倡創業精神的企業裡，即使你只是替人做事的員工，還是能夠進行「內部創業」。你必須理解、珍惜時間的價值，發揮時間的槓桿效果，重視「時間金錢關係」的力量，才能創造最大的收入。我們會在第四十章重新探討創業、內部創業和員工等觀念。


    # ## 金錢價值不相等


    即使金錢（貨幣）的面額相同，也不代表價值相同。讀者必須明智地選擇如何使用單位時間，交換單位金錢。以下是我的意見和舉例：'
  merge: -1
  img_proc: true
- pgno: 240
  md: '# （一）工作價格


    如果你的工作價格（薪資）低於每小時可以創造的價值，代表每小時收入降低了。善用時間的槓桿效果，可以在合理的工作價格中，創造更多收入。


    # （二）每小時的生產力


    為了賺更多錢，所以付出更多時間，這樣反而有損時間資源。工作的目標是為了一讓你有經濟能力，負擔自己喜歡的事物，因為這些事物同樣需要時間和金錢。如果你已經達到個人生產力的極限，就必須增加每小時生產力，否則無法創造更多金錢。許多人害怕提升個人生產力，也不清楚增加生產力必須循序漸進，無法一次大幅提升。


    # （三）月薪和年薪


    如果工作時間很長，下班回家還要繼續工作，代表每小時薪資非常低，只能繼續付出努力和时间，降低每小時的薪資，希望公司提高你的月薪或年薪，就像倉鼠輪庸碌碌地在滾輪中奔跑，努力工作、增加工作時間，每小時的薪資不增反減，最後失去時間，無法從事自己熱愛的東西。


    上述的例子只是用時間交換金錢，甚至燃燒時間。我們無法取回時間，換言之，我們藉由減少生命週期，交換微薄的收入。實際上，即使繼續擔任小職員或承包商，我們'
  merge: -1
  img_proc: true
- pgno: 241
  md: '依然可以找到方法最大化工作價格（也就是薪資），提升每小時甚至每個月的收入，因為不是每個人都想創業或實際投入商場。


    # ## （四）發揮人力資源的槓桿效果，創造最大收入


    如果你的每小時收入或創造價值為一百英鎊，但你決定以每小時三十英鎊的價格，聘請員工或承包商讨替你做工作，他們每個小時替你賺到十英鎊的收入，只要聘請十位員工（或承包商），就能讓你得到一百英鎊的收入。


    這就是時間和金錢共同發揮的槓桿效果。於是，你可以減少自己的工作時間，或者繼續工作，每小時替自己賺進一百英鎊，但同樣聘請十名員工，讓他們替你賺一百英鎊。


    藉由人力資源的時間，你的工作時間雖然相同，收入卻增加為兩倍。


    這種擴展規模的方法沒有任何極限，完全不同於上述（一）、（二）、（三）的方法。倘若你聘請一千名員工，每小時的收入就會變成一萬英鎊，一萬名員工創造的收入則是十萬英鎊。聘請的員工數量增加之後，他們會處理各式各樣的工作任務，提升你的每小時收入。換言之，聘請的員工數量增加，代表你的每小時收入也會提升。


    一名員工可以讓你的每小時淨收入增加十英鎊，一萬名員工每週工作四十個小時，就會增加四十萬英鎊的每週淨收入。到了這個階段，你的價值已經高達數千萬英鎊，必須謹慎應用時間，選擇正確的工作，或者減少工作時間，甚至高枕無憂。'
  merge: -1
  img_proc: true
- pgno: 242
  md: '當然，你也可以繼續努力，與團隊成員一起成長，賺到更多金錢，提升產品或服務的價值，提供就業機會，增加國家稅收，讓所有人獲益。


    # （五）善用資產賺錢


    為了增加「發揮人力資源槓桿效果」的收益，我們需要妥善管理。由於每個人的情況不同，管理可能非常占用時間。你的事業（企業）規模擴展之後，必須按照不同的層級導入管理，讓高階、中階、低階管理者各司其職，才能減少你個人付出的管理時間。


    你可以將時間投入資產、事業系統、軟體開發、股市和房地產，創造被動收入。除此之外，相較於人力資源，資產需要的管理時間較少。


    在初期的設置階段，資產無法創造收入，所以許多人繼續從事每小時支領薪資的工作，因為他們沒有辦法承受這個階段的成本，或者缺乏足夠的遠見，無法看清資產創造的延後收入。完成初期階段，妥善處理資產的系統化管理之後，就會創造被動收入。你可以設置巨大的獲利組合，得到非常驚人的時間收益比例，因為資產和被動收入沒有任何極限。


    # （六）工作、每小時收入、薪資、人力資源和資產


    事業（企業）開始擴展規模，你也擁有賺錢的經驗之後，就會從標題提到的五個領'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# ## 努力賺錢和享受人生


    域獲得收入。


    你還是能夠維持每小時獲得收入的工作，享受快樂人生，用時間交換數十萬英鎊的收入。然而，你也可以開始仔細選擇，將時間投資在大型商業計畫，或者按照費伯斯的模式，建立優秀的團隊，甚至開創新的事業。


    你成功完成各種投資後，即使退居幕後，仍然能夠領取高額的薪資、股利和分紅。讓數百名、數千名員工替你賺錢，所有的資產都拿來創造被動收入。完成所有階段之後，你建立了多重收入來源，發揮多重槓桿效果，減少時間成本。


    當然，富足不是只有錢而已。而是在收入充裕的情況下，享受平衡且幸福的人生。


    只要成功善用人力資源創造的槓桿效果，就能同時賺到時間和金錢。


    你可以發揮複利效果，實現最大化的獲利潛能，或者將時間用於自己熱愛的事物。


    我沒有立場告訴你應該追求何種目標，但我希望你擁有選擇的自由。每個人所處的人生階段不同，因此想法也會不同。


    許多人認為，人生必須面對三種金錢階段：學習年代、賺錢年代和享受年代。或許，我們應該改爲：學習年代、賺錢年代和槓桿年代。'
  merge: -1
  img_proc: true
- pgno: 244
  md: '以下是三種時間管理的模型，協助讀者保存時間，獲得自由，加速財富累積。一般人處理時間的方式有四種：浪費、使用、投資、以小換大。


    # 一、浪費時間


    一個人必須建立穩定持續的收入來源，才能浪費時間，否則就是虛度光陰和人生，也沒有任何金錢收入。讀者朋友是否曾經在完成某些事情之後，感嘆地說：「唉，我不該浪費時間，現在後悔也找不回歸的的時間了」？讀者一定明白我說的道理。讓我們繼續討論。


    # 二、使用時間


    根據財務或情緒的角度，使用時間造成的結果可能值得也可能不值得。無論如何，光是花時間，無法創造持續穩定的益處。從事按時付費的工作、完成缺乏槓桿效果的工


    作、用時間交換金錢或者替別人賺錢，都屬於「使用時間」。


    # 三、投資時間


    投資時間就是讓時間創造收入，或者完成第一階段的任務之後，發揮時間的槓桿效果，得到持續穩定的長期甚至終生收入。'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# 四、發揮時間的槓桿效果


    投資時間後，讓第一階段的工作效果，推動後續的結果，就叫做以小換大的槓桿效果。例如，你可以將事業或資產的運作完全外包，繼續獲得優渥的收入。


    被動收入來自於你所投資的時間和你所創造的槓桿效果，股利、分紅和版權也是如此。「使用時間」可以創造一般薪資收入。即使你現在必須用時間交換金錢，只要投資方向明確，就沒有任何壞處。然而，請讀者切記：你可以為了金錢而努力工作，或者用錢來取代努力工作。請遵守這個最重要的原則，衡量並管理自己的時間應用，嚴格、堅決且有紀律地投資時間。


    成功賺錢的關鍵不是你付出多少努力，而是你如何善用全世界的資源。執行任何決策之前，請把心自問：「這個決定是不是最好的時間投資，能否讓我得到最好的收益？」強迫自己使用最少的個人時間，贏得最高金錢價值，創造持續穩定的收入，不必犧牲自我或者為錢出賣靈魂，就可以享受自己熱愛的生
    活。


    # 收入創造價值的計算模型


    要想知道自己是否正確發揮槓桿效果，做的是不是最有價值工作，準確地將低價值工作外包給專業人士，唯一的方法就是明白自身的價值，以及每小時創造的價值。'
  merge: -1
  img_proc: true
- pgno: 246
  md: '第一步就是計算我們的「收入創造價值」(Income Generating Value: IGV)。一個人的收入創造價值就是他的價值和每小時創造的價值，我們可以藉此得知自己應該從事哪些工作，善用槓桿效果，聘請其他專業人士協助我們完成其他工作，或者鼓舞他們一起努力。


    想要知道你的收入創造價值，請先計算每星期的工作時數，包括專職工作、兼職工作，以及所有用於創造資產的時間；簡言之，就是你用來賺錢的所有時間，例如一個星期用五十五個小時。


    隨後，請大致計算在這段時間之內，你可以賺到多少錢，包括所有的收入，薪資、利息，股利或房地產（如果你擁有這些資產）。請排除贈禮和貸款，將所有金額加總計算。一個星期之內，你的收入可能是一千英鎊。如果你只知道自己的月收入，無法計算週收入，請將月收入除以四·三，就是每週收入。再將每週收入除以總工作時數，算出收入創造價值，也就是你的每小時收入價值。


    以上述的例子而言，收入創造價值＝一千英鎊除以五十五小時＝每小時十八·一八英鎊。


    收入創造價值的計算公式：每週總收入除以每週的總工作時數。


    這個數字可以告訴我們什麼？只要一個工作的金錢價值超過十八·一八英鎊，就值得親自處理，不會降低你的收入創造價值。但是，金錢價值低於十八·一八英鎊的工作，'
  merge: -1
  img_proc: true
- pgno: 247
  md: '只要能夠用一八一七英鎊以下的價格進行外包，就一定要進行外包，建立良好的槓桿效果。如果你親自處理低價值工作，就會降低收入創造價值。將低價值工作外包處理，讓你得到更多時間，從事高價值的工作，產生複利效果，提升收入創造價值。


    許多人雖然長時間工作，甚至不斷加班，卻還是無法發財的原因正是如此。有錢愈來愈富裕，因為他們善用槓桿效果，將低價值工作外包給其他人。為了提升收入創造價值，你必須相信收入創造價值模型，並且好好遵守。

    只要價值超過收入創造價值的工作，必須親自處理，因為你可以獲得良好的收益。持之以恆，收入創造價值也會不停增加。

    更重要的是，如果任何工作的價值可能低於收入創造價值，就必須槓桿或外包處理。倘若你並未遵守這個規則，就會愈來愈貧困。執行低價值工作，只會讓你失去金錢，而不是賺到金錢。請堅持這個系統，替自己的生活和財務狀況，創造永久的正面改善。


    # LMD 模型


    LMD模型可以讓時間發揮最大的金錢價值，妥善管理工作事項，讓你完成最重要的計畫，在最短時間之內，取得最多收益。LMD模型的意義就是：

    先槓桿（Leverage）、再管理（Manage）、最後親自動手做（Do）。'
  merge: -1
  img_proc: true
- pgno: 248
  md: '開始忙碌處理事業時，你可能会覺得「為什麼我必須親手做這些事？」、「許多事情要做，我該從何開始？」「我到底何時才能做完？」或「我該怎麼辦？」


    下次請試試看我的方法。當你開始處理工作或待辦事項，不要立刻執行其中一項，而是先思考哪些可以發揮槓桿效果，先外包處理？你可以請誰處理第一項工作？誰又非常適合第二項工作？第三項工作應該請誰負責？如果今天的待辦事項共有七個工作，請將其中四項委任他人處理，自己親手處理另外三項。倘若順利外包，你只需要花費一半的時間，就能得到兩倍的成果。


    然而，原本必須親手執行的工作委任外包之後，也不代表你會在隔天遇到奇蹟，收到精美包裝的成果禮物。任何槓桿外包工作都要謹慎管理，才能順利完成。你必須仔細查核，細心管理外包工作。委任外包（槓桿）和妥善管理之後，你才需要親自處理重要工作。


    雖然LUND模型只是將數個小時的「工作時間」轉變為「外包槓桿時間」，卻能發揮重大的複利效果。你今天可以將三項工作槓桿外包，管理另外兩項工作，親自處理最後兩項工作。如果你認為自己很忙，沒有足夠的投資時間；如果你認為找不到任何人像你一樣有能力處理工作，代表你一定要遵守LUND模型的外包槓桿效果。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '# 28

    CHARTER

    鉅富的寶貴經驗


    我在這章會著墨最多，因為我相信賺大錢的最佳方法，就是向有錢人學習。有些人會認為，從錯誤中學習是最好的，但我主張其實最好的方法是從「他人」的錯誤學習。讓別人成為你賺錢的試驗工具，你知道哪些方法確實有用之後，再親身投入。換言之，建立模型化的運作方式並且學習鉅富的特質，才是真正有用，不只迅速建立財富，而且是最快建立財富的方法。


    # 財富之書


    休伯特·豪·班克羅夫特 (Hubert Howe Bancroft) 是一位美國歷史學家，在一八七四年至一九一年年間出版了二十七本著作。一八九年，他完成《財富之書》(The
