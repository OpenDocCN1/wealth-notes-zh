  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_138_0.png)


    # 資本、淨值和收入


    生產金錢的方法一共有三種，其中包括信用債務和槓桿效果，讓我們一一檢閱：


    # （一）資本


    資本是指企業體或個人擁有的財務資源或資產，能夠促成成長、發展和創造收入，包括：


    +   ・ 集資發展特定的商業模型或計畫。


    ・ 企業累積的財富（扣除累積的債務）。


    ・ 公司的股權或所有權。


    雖然，「資本」與「金錢」似乎彼此相等，但兩者之間依然有重大的差異。金錢用於購買或銷售產品和服務，目標和用途更為即時。資本則包括資產，例如投資和股票，具備長期特質，也能夠儲存未來價值。資本可以建立、提升個人或企業公司的成長，形'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 成創造收入的基礎。


    # （二）淨值


    「淨值」的簡單定義是「扣除債務之後的資產總額」，或者「所有的資產價值扣除所有的債務」。然而，淨值通常會採用如下的形式：


    +   • 持有股份或債權。


    +   • 持有基金的擁有權（股份），加上損益表計算之後的利得（或損失）。在房地產的領域中，淨值則是指該房地產的現有市場價值扣除房地產持有者債務的餘額。


    +   • 股票投資、固定收入（債券）、現金等同於現金的投資商品也能計算淨值。


    +   • 如果企業申請破產，開始進行結清，償還所有債務之後，剩餘的金錢就是淨值。淨值是一個人擁有的資產扣除資產造成的債務之後，剩餘的金錢價值。舉例而言，如果一個人擁有的汽車或房屋已經沒有任何貸款，汽車或房屋就能視為他（她）的淨值，因為物業可以立刻將汽車或房屋賣為現金，沒有債務負擔。股票也是淨值的一種，因為股票代表對該公司的持有股份，而公開交易的股票通常不會包含公司負債。


    # （三）收入


    收入為一個人或企業的營收金錢，特別是指以定期的頻率，藉由工作、投資或資本產生。以下是不同的收入交流：


    +   • 以工作形式，用時間交換金錢。銷售資產創造的淨收入（也能夠定義為資本）。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '+   資產創造的剩餘收入（物主支付購買資產的金額之後，資產繼續創造的金流，也就是被動或經常性收入）。


    +   版稅（音樂、影片或專利創造的權利金）。


    # 金錢、金錢、金錢


    想要維持既有的財富，創造上述三種金錢形式的平衡非常重要。如果你單純持有資本，並未創造收入，那麼你的金錢收入來源非常僵固，獲得金錢的機會也會較晚，更容易受到市場波動影響。倘若你的收入全數來自工作（用時間交換金錢），就會承受生命環境急促改變的風險，可能喪失熱情、健康受損，或者法規的變動導致你變得無關緊要，失去唯一的收入。有些人主張剩餘收入（被動收入）是最好的金錢來源，但如果你不專注保存並且發展資本，整體的淨資產可能會下降。


    你應該如何決定在三種金錢來源的時間和比重，取決於現在的專業技能、價值、既有的賺錢模式、年紀和冒險態度。如果你還是青少年或二十多歲，應該專注在工作，用時間賺取金錢、提升技巧，儲蓄並且獲得經驗。到了三十歲，你可以開始投資儲蓄，增加資產，打造婚姻基金，建立家庭，購買更大的家庭住宅。四十歲，你必須更為謹慎考慮未來，準備退休金和傳承基礎，發展個人資產獲利組合以及剩餘收入金流。五十歲以'
  merge: -1
  img_proc: true
- pgno: 141
  md: '後，你希望用資產創造的被動收入，取代工作收入，降低工作時間。但是，如果你是一位熱情的創業者，也可以立刻開始進行。只要迅速建立三種主要的金錢來源，就能夠賺到更多錢，獲得成長，並且給予他人協助。


    # 流動或不流動


    相較之下，資本比較傾向於不流動，而收入更容易流動。流動的定義是指一個人或組織的金錢調動能力，是否可以處理即刻或短期的需求，或者能夠迅速轉化為金錢的資產。「換句話說，流動性就是你可以立刻獲得金錢的速度。雖然流動性是一個人（企業）不可缺少的能力，但也是一把雙面刃。一般而言，資產的流動能力愈高，代表回報愈低；資產的流動性愈低，代表回報愈高。雖然這句話並非完全正確，但符合大多數的情況。例如，房地產是流動性最低的資產之一，要用好幾個月，才能創造流動，但房地產一直都是回報最好的資產。


    因此，你應該在流動性高的資產，以及流動性低的資產之間，取得良好的平衡，才能因應短期的開銷，並且創造更高的回報，避免過度支出、通貨膨脹、刮脂定價法（skimmming）、和竊賊，藉此創造且維持財富。你不會看到小偷戴著遮臉毛線帽，將你的房子綁在肩膀上偷走，然而，口袋中的現金容易受到竊賊、通貨膨脹和情緒消費的損失，'
  merge: -1
  img_proc: true
- pgno: 142
  md: '也只能創造低回報。


    # 穩固型資本和循環收入


    除了上述的平衡之外，你也要同時擁有「穩固型資產」和「循環收入」，並且維持兩者的平衡。穩固型資本非常適合保障你的生活，避免無法預測的動盪，支付經年累月的開銷，提供安全的財務生活，作為向銀行貸款的擔保品。但是，穩固型資本的流動性很低，只能創造緩慢的收入。例如，房地產的重新裝修或改建計畫必須花費一到三年才能完成，直到完工之前，不會產生任何收入。但是，只要支付裝修期間的開銷，一旦房地產銷售完成，你就會獲得非常優渥的收入。循環收入（或剩餘收入）的目標就是因應日常開銷，維持你的生活水準，降低用時間換取金錢的比例。缺乏其中之一，你就要承擔風險，無法建立、維持財富和金錢的平衡狀態。


    # 槓桿或非槓桿


    如果你的資本完全沒有進行槓桿操作，就沒有發揮資本的潛能和力量；但是，如果你過度應用槓桿效果，可能會損失一切，或者遭到市場小型波動、銀行撤回投資等風'
  merge: -1
  img_proc: true
- pgno: 143
  md: '險影響。你必須仔細思考自己的槓桿平衡，降低過度的槓桿操作，確保自己能夠應對突然的市場變遷或資產貶值；但是，你也要建立足夠的槓桿效果，適度地抵押資本，向銀行申請貸款，藉此拓展獲利組合。舉例而言，如果購買房產的貸款價值比（Loan
    to value）是六十五%至七十五%之間，代表你只需要準備二十五%至三十五%的存款比例，就可以向銀行借貸剩餘的資本款項，你不應該將槓桿比例提高至超過七十五%。


    你也可以以降低貸款價值比至五十%，建立穩定資產基礎，順利進行資本還款、資本成長，或者兩者兼具。倘若貸款價值比下降了，你可以向銀行申請提高，恢復至五十%，或者五十五%。上述的應對只是一種處理原則，實際的方法取決於你的年紀、願意承擔風險的程度、當前的財務狀況、現有的資產基礎、銀行利率和銀行貸款的意願。


    # ## 循環和非循環


    每一種資產類別都會有相對高資本價值的週期循環，慢慢地轉向相對低價值（或過度低價）的時間點。


    所有的資產類別雖然彼此相連，但也各自獨立。價值循環可分為個體循環和總體循環。


    舉例而言，利息、通貨膨脹、經濟狀況、政治局勢、法規和社會輿論風向將會影響環。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '所有資產類別在當地、全國和國際的循環發展。


    房地產價格上揚，很有可能導致黃金和貴重物品的價值下跌，反之亦然。各國之間的匯率也會產生影響，通貨膨脹指數高的時代，非貨幣類的流動資產價格相對高於流動性較低的資產。


    建立財富時，你應該在各種資產類別中，平衡處理資本、收入和淨值，才能降低風險，因應週期循環。


    # ## 風險和回饋


    風險和回饋也是相連又衝突的組合，而且缺一不可。風險愈高，回饋愈高，但我們必須承擔更高的風險！


    不願冒險付出，就不會有美麗的收穫。風險，代表在樂觀和心存疑惑中取得平衡。想要維持財富，就不應該犯常見的錯誤，無止境地一味樂觀，或質疑其中一種極端，這種想法非常危險。


    你必須仔細察覺自己的習性，並且克制犯錯的傾向，或者尋找良好的合夥人、經營團隊，讓他們與你互補。


    除此之外，在特定的產業，例如國際原油投資，你也應該考慮其他的風險，像是政'
  merge: -1
  img_proc: true
- pgno: 145
  md: '治上的風險和衝擊。法規的改變會大幅影響財務金融市場。除此之外，還有信用名譽和法律風險，例如川普在總統大選期間，因為川普大學事件而賠償兩千五百萬美元。


    思考自己的創業投資時間規劃時，年紀也是必須考慮的因素。個人經驗、知識和專業表現同樣是風險因素。我也要提醒你注意資本風險、收入風險、股息風險，以及難以察覺的盲目風險。你必須考慮上述所有因素！


    但是，風險和回報是一體兩面。如果沒有回報，為什麼要承擔風險？你也不可能享盡好處，而迴避所有風險。大多數的人只看見其中一面，他們害怕承擔任何風險，過度謹慎小心，從來不曾體驗美好的回報；或者，他們承擔過多風險，並未謹慎保護自己，或者理解「高風險不一定創造高報酬」。如果你不願承擔任何風險，就是讓自己暴露在所有的風險中。


    處理資本、淨值和收入時，加入風險因素，保護自己的財富，並且追求成長。相較於資本，收入可以承擔更多風險，因為你能够在相對迅速的時間之內，賺回收入，只要繼續工作，下個月就能得到工作創造的被動收入。但是，如果你讓穩固型資本承擔風險，必須承擔失去資本的危險，倘若發生不規則的動盪變化，將會失去資本保護。打造財富最好的方法，是讓風險位於財富核心的最外緣，保護核心資本，輕鬆處理風險。建立多層次的資本核心和多元收入來源之後，才能減少風險。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 多重收入來源


    建立多重的收入來源可以創造非常明顯而且誘人的好處。除了讓你擁有一足以與人分享」的優點，也能夠建立多層次的保護與照應。如果你的工作是高時間單位報酬的顧問（每小時獲得非常優厚的費用），從資產（房地產和股票）獲得被動收入，房屋貸款已經償還，資本獲得保障，擁有具體的資產、珠寶、智慧財產權、專利、執導電影的收入、創作史萊德樂團(Slrg)的聖誕節歌曲並且設計戴森公司的吹吸器，這本書應讓你執筆！你可能無法贏得上述的所有收入，但建立資本、淨值和收入三種形式的平衡是非常可行的建議，我個人認識、研究並且仔細理解的富人也非常強調多重收入來源。


    我在另一本書《房地產的多重收入》（Multiple Streamsof Real Estate Income）中提出如何創造多重收入的模式。在房地產的领域中，建立多重收入來源是非常重要的概念，包括設置一到三種可以隨時管理的收入來源（資產類別），如何建立系統化管理和發展方法，以及何時應該在獲利組合中增加新的收入來源（正確的時機就是系統化管理最新收入來源，並且完整測試新的來源）。你應該準備完全獨立的收入來源，避免其他來源遭到影響，也要讓不同的收入彼此接合，創造既有收入的槓桿效應。例如，如果你擁有足夠的房地產，可以聘請租賃仲介人，增加你的獲利組合。


    想要建立、維持巨大的財富，資本、淨值和收入是三個重要的關鍵因素。這三個因素'
  merge: -1
  img_proc: true
