  md: '# © 購買契約槓桿


    我們則藉由他的資金，創造我們的槓桿效果。


    如果你和交易方簽訂「選擇權契約」，在一定時間之內，你可以選擇是否收購房地產或商業公司，就能建立特殊槓桿效果。倘若約定時間為三年，你可以在這段時間按照自己的方式管理房地產或商業公司，獲取房租或銷售利潤，改變房地產的用途，增加收入，不必先支付購買房地產的原始資本。你也能夠獲得現金收入，提升資本價值，繼續增加收入來源。


    另一種槓桿契約則是分期付款選擇權契約。你依然可以在一定時間之內，決定是否收購房地產或商業公司，但採取分期付款方式。這種付款方式可以讓你用更長的時期支付款項，你能從其他資產的收入（例如房租）支付，等於實質取用資產的未來收入，支付現在的投資，降低資本支出，有時候甚至可以做到毫無資本減少。


    許多聰明的房地產創業者也開始將企業承租合約轉型為「二次租賃」房地產投資。他們不再實際購買房地產，而是用傳統的方式向地主承租房地產，確保房地產的面積廣大，擁有許多房間，再將所有房間租給單一住戶，創造多層次的收入來源。


    這種投資方法的本質是「仲介」。投資人找到理想的價格，將地租交給地主，地主非常高興房地產終於成功出租，而投資人獲得三倍以上的收入。這種投資方法建立良好的槓桿效果，因為投資人只需要按月繳交地租（房租）和手續費，將一個房間租給家庭，'
