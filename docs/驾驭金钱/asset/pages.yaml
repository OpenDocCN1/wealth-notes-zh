  md: '# CHAPTER 30

    個人 GDP


    國內生產毛額（GDP），是指一個國家在特定時間內，生產的財貨和服務創造的金錢總價值。一般都是採用「年」作為單位。


    國內生產毛額是評估一個國家經濟發展是否健康的主要指標，代表該國所有財貨和服務創造的總價值，以英鎊、美元或其他貨幣計算。讀者可以將國內生產毛額視為經濟系統大小的規模指標。


    國內生產毛額常見的計算方式有兩種：加總所有國民在一年之內的收入（收入計算法）；或者加總所有國民在二年之內的消費（消費計算法）。從邏輯上而言，兩種方法最後的結果應該相同。


    收入計算法的國內生產毛額稱為GDI，詳細的計算方式是加總勞工的總收入、企業和非企業公司的毛利和政府稅收，但排除補助津貼。'
  merge: -1
  img_proc: true
- pgno: 271
  md: '支出計算法的國內生產毛額稱為GDP（E），是較為常見的指標，加總國內所有消費、投資、政府支出和淨支出。一般而言，國內生產毛額常用於年度比較，評估每年經濟成長或衰退比例。


    你是國家或全球生產毛額計算中的一分子。我相信讀者早已知道，我們必須計算個人的國內生產毛額（YGDPI,．Your Gross Domestic Product）。


    國內生產毛額的成長是國家經濟體系的主要目標和衡量標準，也可以計算個人的經濟成長，所以我們也該以此為參考。


    如果你的個人國內生產毛額成長，代表你本人也在成長。個人國內生產毛額增強你的財富，促進周邊經濟環境成長。如果想提升生產毛額，也必須進行消費和投資，不能只靠儲蓄金錢和固守財富。


    國內生產毛額可以評估你本人所吸引、創造和生產的金錢。藉由貨幣流動、創業、將觀念轉化為具體產品、提出解決問題的理念，以及增進金錢交易速度，我們因而能賺到更多錢。


    無論所到何處，我們都應該要求自己提升金錢流動的速度。許多人相信，衡量財富的方式是計算一個人儲存的金錢價值，但這種想法只是一種迷思。個人淨價值確實是—個重要的計算指標，我也推薦讀者計算自身的淨價值，但追求繁榮富庶是一種矛盾的概忿，固守財富反而會限制個人和國家的經濟發展。因此，財富真正的評估方式，必須兼'
