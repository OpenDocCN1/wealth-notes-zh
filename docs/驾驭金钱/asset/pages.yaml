  md: '長。你希望明年的生活變得更好，而不是每況愈下。公司、政府與金融機構的主要目標和評估成功的標準也是成長。因此，人類和企業的本質難以接受、預測或是為即將到來
    的衰退做好準備，他們渴望追求繁榮。這種本質特性使得衰退永遠會發生。


