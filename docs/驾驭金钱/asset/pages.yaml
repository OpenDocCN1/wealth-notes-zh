    等你有錢後，你可能會調整成以下比例：

    第一桶：三成存而不用。

    第二桶：○成救急金。

    第三桶：一成作為未來的夢想基金。

    第四桶：一成五拿來自我投資（例如用在教育或追隨導師）。

    第五桶：三成一五拿來投資。

    第六桶：一成回饋社會。

    第七桶：二成用作日常花費。


    # 銀行帳戶管理


    感謝科技進步，我們現在可以用手機應用程式，輕鬆藉由網路管理銀行帳戶。請先確定你所有的銀行帳戶都已經開啟網路銀行和手機應用程式功能，設定為常用帳戶，就可以在任何時間地點轉換金錢，不會受到任何嚴格的限制。將其中一個帳戶當成主要的'
