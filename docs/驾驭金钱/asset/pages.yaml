- pgno: 197
  md: '# CHAPTER 23

    自我價值和淨值


    經濟環境變動的重要性，比不上你的情緒變化。整體經濟環境的重要性，也比不上你個人的經濟觀念。

    「經濟」（economic）原本的意思是「善於管理家庭或國家」，因此，也代表「善於管理個人」。如果你的自我價值低落，永遠都無法提高個人淨值。你是個謹慎思考的人，還是絕望消極的人？你只是暫時身無分文，還是永遠懷抱貧窮的心態？如果你不相信自已，誰又會相信你？


    # 你是值得的


    個人淨值就是個人價值的總和結果。自我價值是一種內在的心理狀態，相信自己'
  merge: -1
  img_proc: true
- pgno: 198
  md: '「值得」。大多數的「自我價值」起源於我們如何認知自我，以及我們愛自己的程度。你必須知道自己值得愛，無論自己愛自己，或者讓其他人愛你。你也值得成為富裕的人，就像其他人一樣。


    你為什麼認為自己不配？誰能夠決定另一個人配還是不配？這個世界上，沒有任何超越人類的崇高力量，可以不經過你的同意而決定自己不值不值得一樣。


    其他人如何看待你的價值，其實不重要，因為他們的評論來自他們的價值觀，根本與你無關。你過去的錯誤也不重要，因為每個人都會犯錯。過去不會決定未來。從前傷害你的人更不重要，你必須盡快踏步向前。


    如果你希望增加自己的個人淨值，就要提升自我價值。我還是藝術家的時候，這個觀念非常有用，但我當初太無知，並未連結自我價值和個人淨值。以下是一些策略，協助讀者提升自我價值和個人淨值：


    # 寬恕


    原諒他人對你的過錯，原諒你自己犯下的錯。放寬心胸。如果你還沒有原諒自己和他人，請回頭看看第二十二章。一開始，你的內心或許會產生抗拒，但只要在原諒的過程中發現益處，就會開始創造良好的效果。生命中的每次事件，都會同時帶來益處和壞'
  merge: -1
  img_proc: true
- pgno: 199
  md: '處、支持和挑戰。


    # 感恩


    為生命中所擁有的一切感到感恩，並且珍惜每一次的好運。感激你想感激的一切。無論你內心渴望追求何種目標，都要明確地列舉自己感激的事物。你可以透過紙上記錄、祈禱、用視覺化呈現，甚至化約成一句咒語都沒關係。


    自從我讀過拿破崙·希爾（Napoleon Hill）在一九二七年出版的《致富思考》（Think and Grow Rich）後，十一來年，我都會在睡前「練習感激」。


    我列出所有大大小小我所感激的事物，除了座右銘和勵志小語外，感恩已經成為我日常生活的一部分，有時我甚至會在毫無自覺的情況下，開始感激生命中的種種一切。


    一個人只要懂得感恩，就會感受到自我價值。你在內心列出愈多感激的事物，「感激」就會變得更有力氣，將你的自我懷疑、害怕和低落的自尊一掃而空。


    你內心愈常想某事物，它就越容易實現。除此之外，睡前練習感激的額外好處，就是可以更快入睡，而且睡得更安穩（你也可以在每天早上練習感激，但我個人會在清晨五點三十分時就會進入自動導航模式，必須飲用咖啡，直到六點十分才會完全清醒）。'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 期待財富，因為我們都有致富的權利


    期待理論（expectation theory）認為，我們都會得到內心渴望的目標，而不是「公平的目標」或「理所當然的目標」。


    我們當然都值得致富，這是所有人的權利。期待致富，希望自己可以分享更多，並且賺更多錢，那就打開心胸接納這個目標。


    讀者必須改變心態，相信自己值得成為有錢人，就像我在稍早提到畢卡索於餐巾紙作畫的故事。你定出的價格、收費或薪資，是否與你的努力和付出相符？


    你在生活中完成的種種一切都要反映出自己的價值，也會創造巨大的自我淨值。


    請重新梳理生命中體驗過的種種成就，盡力地思考，再盡力列出可以提升自我淨值的目標，包括增加個人自我價值感受以及促進他人生活福祉的事物。


    專注自己擁有的一切，而非匱乏。專注自己的能力，而非不足。


    只要能夠看見自我的價值，欣賞自己，不在乎他人的惡意批評，你就可以建立深厚的自我價值。這個世界是一面鏡子，反映你對自己的感受。只要擁有健康的自我價值，就不需要害怕鏡中的倒影。'
