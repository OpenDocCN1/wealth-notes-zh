  md: '![](img/a9d3aeae93c5ae3f9baf5963e137b74a_149_0.png)


    # 價值和願景


    你的價值就是你生命中最重要的領域。價值的概念很抽象，但它指引你的生活，例如自由、誠信、平等、家庭、樂趣、智慧、教育、旅遊、高爾夫、商業、認同、職業發展等等。


    價值觀就像濾鏡，影響你的認知、思考、決定和行為。你的價值將形塑你身處的世

    界。經過一間購物中心，你會注意到與自身價值有關的商店、行人、招牌和營業場所。

    與內心價值無關的一切，你都會視而不見。


    從個人和全球成長的角度而言，關鍵的問題在於許多人不理解自己，或至少無法有

    意識地認識自我。


    他們的內心充滿太多衝突的想法，無法忠於自我，難以實現獨特的自我價值。他們

    故步自封，臣服於其他更清楚自我價值的人。因此，實現自我價值的第一步，就是認識'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 願景


    你想在地球上創造改變嗎？大多數的人不曾思考這些重要的問題。讀者應該花點時間，仔細思考，並且明白所有人的生命都有其意義，包括你的人生。如果生命沒有意義，人類就不會存在。不要用「找不到生命意義」作為藉口，也不要讓其他人澆熄你的偉大目標。


    你渴望的人生目標是否清晰可見？你想留下什麼傳承？你又希望後世如何記得你？


    探索自我價值，並且依照價值信念生活，能夠讓你獲得解放和啟發。我可以斬釘截鐵地說，這種探索足以改變你的人生。只要你發現自己與親朋好友都願意忠於自我，實現命中注定的潛能，整個世界會瞬間成為充滿意義和啟發的生活。想要喚醒內心的天才（你早已擁有這些才能，根本不需要額外「矯正」），第一步是相信自己，第二步則是採取正確的步驟。


    第一步，你願意相信自己嗎？


    倘若如此，第二步就是尋找正確的方法（請見第二十五章，理解「積極正面的健康警告」）。'
