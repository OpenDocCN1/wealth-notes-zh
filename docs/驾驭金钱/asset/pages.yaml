  md: '理巨額獎金，可能會在幾年內揮霍一空或身無分文，但只有二%的人覺得自己得獎以後反而變得不快樂。究竟誰認為金錢不能讓你快樂？


    事實上，我們生活的世界正在進行一場巨大的財富重分配：得到巨額金錢，卻不知道如何處理的窮人，他們的錢再度回到有錢人手中。


    # 生產 vs 消費


    第一世界的窮人無法對世界有什麼貢獻，也不能創造服務、商業與經濟效應，他們也比較不在乎人類福祉，或者照顧他人。因此，貧困的消費程度高過於其生產，更趨近於自私，而不是無私。


    成為有錢人的意義是創造服務、替他人製造有形的商品（消耗品）或無形的資訊，而成為窮人的，就只能造成浪費，或是花時間創造不值錢的物品。


    有錢人替窮人生產商品，而窮人則負責消費，所以第一世界的財富重分配，讓金錢從窮人的手中，流向有錢人的手中。


    巨大的財富來自國家級或全球級的大量生產，消費和生產的逆差就是貧困的原因。


    個人、地區或政府都可能是造成貧困的推手。


    有錢人創業，促進經濟發展，提供就業機會，增進市場價值，提高金錢的流動和'
