  md: '# 沒有現金的社會


    用最新的支付方法。


    這種恐懼甚至衍生了一個專有名詞：金錢潮流恐懼症 (paymobia)。更有趣的是，只有二十五％的英國人害怕蜘蛛。因此，我認為這些資料可以充分地顯示，許多人其實對時代變遷心存恐懼。


    免觸碰卡片，1問世時，銀捷尼科 (Regino) 的研究發現，只有十三％的顧客擁有免觸碰的信用卡，只有五％的客戶曾利用免觸碰卡片付款，除此之外，六十一％的英國人害怕使用免觸碰卡片，因為他們認為自己並不是很懂相關科技。四十一％的英國人甚至表示自己根本不知道什麼是免觸碰卡片。


    現在許多人都把這種便利的付款方法視為理所當然，因此上述的資料其實也不那麼重要。也可以說，過去的現金、鈔票和紙本付款方式轉換為早期的線上付款方式，那時引起的震盪其實更大，而現在所有的數位貨幣和付款方式，其實都不過是發揮網際網路的槓桿效果罷了。網路是最大的改變因素，最早的移轉其實發生在一九九○年，卻像九百七十三年前一樣久遠。各位朋友，請接納這股新潮流吧。


    許多人害怕沒有現金的社會，但我的恐懼更嚴重：以後我再也沒辦法用鈔票賄賂未'
