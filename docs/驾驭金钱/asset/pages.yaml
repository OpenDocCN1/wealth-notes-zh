  md: '會認為你失去理智。


    別管別人怎麼說，去做就對了。


    # 二、學習導師


    我所知的成功商業人士都擁有個人教練和導師，甚至還不止一位。你可以從個人所在的職位、產業或其他領域當中，獲得寶貴的學習經驗，也能聘請專業的教練、成功的商業導師，尋找互助的同儕團體，或者支付錢打造專業智囊團隊，還有研究成功人士和企業家，閱讀他們的作品。


    在過去十年間，我養成了一項最有價值的生活習慣，那就是閱讀傳記和自傳作品。你可以藉此觀察各領域領導者的習性、特質、人生祕訣、洞見和策略。


    得到專業的導師協助，讓我的人生產生重要的改變與許多好處，也因而知許多冤枉路，不用聽信糟糕的建議，也不用壓力那麼大，什麼都要自行決定或什麼認識都要知道。


    # 三、建立智囊團


    智囊團的英文是「mastermind」，也就是一群擁有「大師心智」（mastery mind）的人。


    聰明的人可以結合獨特又互補的才能，相較於各自努力，更能完成強而有力的團隊效'
