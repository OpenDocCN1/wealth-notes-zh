- pgno: 163
  md: '# 貧窮的觀念：「你必須用錢創造更多金錢」，富裕的觀念：「你只需要觀念、能量以及提供服務，就能創造更多金錢」


    雖然我們可以用利息、複利和槓桿效果，讓金錢發揮吸引力，創造更多金錢，但倘若觀念不對，錢就會迅速蒸發，變成消費產品和負債。因此，「你必須用錢創造更多金錢」不是準確的說法，正確的觀念應該是「如果管理妥當，金錢可以讓你賺到更多金錢」。


    根據 Entrepreneur.com 網站的資料，六十二％的億萬富翁都是「白手起家」。這代表第一代的億萬富翁並沒有得到價值上億的遺產或饋贈。湯瑪斯·史坦利（Thomas
    Stanley）曾說：「我發現八十％至八十六％的富豪都是白手起家，身家高達數十億的頂級富人亦是如此。」


    如果這些說法為真，創造金錢的基礎並不是金錢和鉅額遺產。我個人相信，所有的金錢來自一個想法，想法轉為觀念，觀念形成決策，決策造就行動，行動孕育成果，經過反覆測試、修正、改善，最後提升規模。


    一切有形的物體都來自無形的觀念。思想和觀念可以轉變為照護、服務、解決問題、減輕生活負擔、加快進步速度、改善生活、緩和痛苦、治癒疾病、提出新資訊、創造智'
  merge: -1
  img_proc: true
- pgno: 164
  md: '慧財產權、專利、著作權、產品、服務、訂閱、專有經營、使用執照、資產和更多形式。想要開創上述所有的財富，都不必仰賴巨大的起手資本，而是需要願景和行動。只要願景清澈，啟發他人相信，你就可以找到足夠的資金。


    我也曾經認為一個人必須有錢，才能創造更多金錢——因為我沒有錢，於是我放棄賺錢的能力。我不願敞開心胸，上述提到各種創造金錢的財富資產，就不會來到我身邊。


    如果回到二〇〇五年，當時的我遇見現在的我，肯定會猜測「這個人必定得到了一大筆金錢」。為了讓自己感覺良好，我能夠輕而易舉地用這種方式說服自己。我甚至還會認為：「這人真是個討厭鬼！」諷刺的是，現在的我已經變成當時憎恨的模樣！


    # 貧窮的觀念：「金錢系統非常邪惡、不公而且腐敗」


    # 富裕的觀念：「金錢系統很棒，能夠有效地量化評估價值並且加速金錢流動」


    資本主義是一種系統，讓每個人都可以創造公平的生活，用完美的平衡，結合自利和服務。賺錢創造了經濟市場、服務、就業、稅賦，以及對他人的益處。公平和完美的競爭變得繁榮興盛，價值也可以在全世界順暢流動。管制法案和反壟斷法案讓人類的貪婪與給予達成平衡。企業的「有限負債」約束了公司行號的負債額度，但不會限制企業'
  merge: -1
  img_proc: true
- pgno: 165
  md: '家本人的理念，如果你願意承擔額外的風險，大膽投資，也不會因此受到懲罰。除了自我設限，資本主義社會幾乎沒有任何事物會妨礙你發揮理念，創造服務和金錢！


    貧窮的觀念：「負債很不好。」


    富裕的觀念：「（對人生有幫助的）負債很好。」


    從我個人的經驗而言，一般人对負債的觀念如下：


    +   （一）許多人舉債購買負資產，而且花費他們並未擁有的金錢

    （二）許多人完全不願負債，只購買或投資「可以負擔」的物品。

    （三）還有人發揮良好負債的槓桿效果，購買創造收入的資產。


    按照睿智的程度依序評論上述觀念，（一）代表「愚笨」，（二）是「安全和保險」，（三）則是「聰明且發揮槓桿效果」。舉債購買消費產品、消耗品和負資產，會先讓你變得一無所有，最後淪為貧困。從「一無所有」邁向「富裕」的第一步，就是明白「我只能使用自己現在擁有、能夠取得，以及能夠負擔的金錢額度，購買日常生活必需品」。絕對要避免舉債添購容易貶值的負資產，承受負面的複利危機，你可能会因此陷入三種困境：


    +   （一）負債造成金錢負擔，並且吸引更多的負債。

    （二）舉債購買的負資產也會貶值。

    （三）你必须失去投資金錢的「機會成本」。'
  merge: -1
  img_proc: true
- pgno: 166
  md: '只要清除了負責產債務，遵從「只舉債購買資產」的原則，你就能夠開始投資創造收入、自行填補日常支出的資產。我將在第六部分詳細介紹。


    # 貧窮的觀念：你必須努力工作才能賺錢；

    富裕的觀念：你必須讓金錢替你工作


    沒錯，必須先努力，才能享受成果。夏天努力耕種，秋天才能收穫豐碩的果實，甚至會讓你忘了夏天的辛勞。


    但我的重點不是「你只需要坐著休息冥想，毫無作為，宇宙的財富就會降臨在你身上」。即使強調靈性修養的人，都會明白「靈性」和「物質」都需要「信念」與「付出」。非洲的古諺語曾說：「祈禱時，記得腳踏實地。」


    然而，努力工作工作的成果也會有上限。此時，你愈是努力，收穫反而變得愈少，因為你每小時的產量已經到了極限，你一天也只能付出有限的工作時間。你的薪水不會成長，但你工作的時間愈來愈多。即使薪水增加，也不能彌補你付出的所有時間。


    許多支領高薪的人，他們的工作時數少，每小時的報酬很高。時間和付出無法直接轉換為價值和收入的潛在效能，如果你是一位創業者，情況更是如此。用正確的方式打造事業和營利能力之後，我們投入的時間，就會以等比級數的方式創造價值。藉由資產、'
  merge: -1
  img_proc: true
- pgno: 167
  md: '事業系統、軟體開發、槓桿效果、資訊和智慧財產權、專利和著作權、人力和發展過程等形式，只要付出幾個小時的高價值「工作」，就能夠創造數百萬的生涯資產。努力且聰明的工作才是正確的說法。善用願景和知識，不必辛苦舞動雙手，揮灑汗水。投資能夠讓你節省時間的資產，而不是浪費時間交換金錢。用別人的時間發揮槓桿效果，不要付出自己全部的人生。


    +   1. 貧窮的觀念：「如果我賺錢，代表別人損失金錢」；


    +   1. 富裕的觀念：「如果我賺錢，就能夠服務別人」


    只有經由偷竊和欺騙行為賺到的金錢，才代表你害別人損失金錢。如果你賺錢的方式並非上述那些偏門，其他人是因爲接受你提供的價值，選擇將金錢交給你。他們希望得到你提供的事物，認爲這些事物的價值高過他們交出的金錢。這樣的話，你是在服務他們，而不是欺騙他們。


    如果你希望增加金錢收入，就應該改善服務，提升價值，就會有更多人心存感激，心甘情願地掏錢給你。


    然而，倘若其他人後悔，你必須將這些訊號視爲他們覺得自己遭到強迫或被當成惡意的槓桿籌碼，才會有這種負面反應，讓你付出代價。'
  merge: -1
  img_proc: true
- pgno: 168
  md: '我們必須提供服務，細心關懷，並且根據公平的交易價值調整售價，如果服務價值提升，也可以增加售價。這個世界上，確實有人會藉由惡意行為，壓榨他人的金錢。或許你因此形成了錯誤的金錢觀，但惡意的賺錢方法無法維持，就像繁榮和蕭條的景氣循環，財富和金錢也要經歷調整與再分配。只要你長久觀察，就能看出這個道理。


    安隆（Enron）、馬多夫（Madoff）和李森雖然金玉其外，但不曾長久。只有公平交易才能真正服務他人，並且持續成長。


    這種觀念的另一個版本是「施比受更有福」，但這個說法其實是不良的數學觀念，任何給予代表有人接受。沒有接受，就無法給予。所以給予怎麼會比收穫更好？不可能更好，因為施和受只會相等，各占一半，而且是簡單的數學觀念：付出的人數一定等於接受的人數。


    在現實世界中，社會輿論、家長和媒體想要讓我們相信「施比受更好」的迷思。讓我們一起破除迷思。


    施和受同樣有福，而且是公平交易的必須條件。許多人需要學習如何成為一位更好的接受者。貧困的人必須學會如何成為更好的接受者。


    如果有人想要給予，為什麼不能心懷感謝地接受？倘若你付出時間、精力和愛，選購物品，或者提供溫暖的服務，想要照顧你在乎的人，他們卻交還物品，或者拒絕接受，你又作何感想？你一定會叫他們「滾開」，或者內心產生了這種不悅的想法。很多人拒'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 窮的觀念：「我沒有時間賺錢」；

    富裕的觀念：「我沒時間處理低價值工作」


    比爾·蓋茲和任何一位無名小卒一樣，一天只有二十四小時。所謂「我沒有時間」這句話真正的意思是「我認為這件事不重要」。如果有人認為自己沒有足夠的時間創造財富和賺錢，代表他們認為財富不重要。


    他們或許會反對我的說法，因為幾乎每個人都想要賺更多錢，但在潛意識裡，大多數的人都希望活在舒適圈，渴望得到比錢更重要的價值。每個人都会按照自己的價值，從事各種工作。


    一位母親也許希望賺錢，但會將時間和精力集中於扶養孩子。遊戲玩家可能想要致富，但也會將大多數的時間用於體驗主機遊戲。只要我們不再主張自己沒有時間，開始妥善管理時間和優先順序，專注在賺錢的領域，或者灌溉與自己最高價值有關的領域，藉此產生金錢效益，就能夠從時間中解放，得到更多金錢。


    絕接受照顧，向全世界釋放強烈的訊息：「我們不值得」。如果有人費盡心力，只為了讓大家知道「我不值得」，他會得到什麼？什麼都沒有。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '你必須把時間用於高價值工作（High Income-generating tasks: HGT），否則別人就會讓你進行他們的高價值工作。你是否曾經覺得，在天結束之後，發現自己沒有完成任何重要工作，而是花了許多時間替別人工作？這是因為你沒有規劃重要性，他們替你規劃了！


    你必須自己制訂計畫，否則就會成為其他人計畫的一環。


    富裕人士非常嚴謹且充滿戰略地運用時間。他們知道自己的時間價值、每小時應得的薪資，以及能夠穿針引線、創造進展的重大領域。除此之外，他們只會著重發揮上述功能。他們使用槓桿效果、外包工作、委任、拒絕或刪除其他不重要的工作。他們不見得聰明過人或老賊異稟，只是更清楚時間和優先性的價值。你一天、一週、一個月、一年，甚至一生的時間絕對足夠，可以創造巨大的財富。正如金錢，你認為時間是充裕或稀少的資源？


    ◎貧窮的觀念：「我做不到，因為我不夠好”；


    富裕的觀念：「我擁有世界需要的珍貴價值，我非常擅長某件事情，


    可以創造金錢」


    你當然可以。你也絕對夠好。如果任何人做得到，你當然也可以。你是一個獨特的'
