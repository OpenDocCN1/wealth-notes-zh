    # 你成就了這本書


    如果你和我一樣沒耐心，可能會現在就想直接開始學習本書的知識，根本不想閱讀奧斯卡式的冗長致詞。但請容我保持簡潔的致謝。


    感謝桑尼普（Sumner），你是一位非常好的研究者、經紀人和朋友，謝謝你對本書的付出。感謝我的編輯海蒂（Hid）負責校對，注意細節，並且承擔了閱讀手稿的艱辛工作。感謝我的出版商在本書完成之前，就將本書排入銷售時間表，迫使我必須快點寫完。感謝馬克·荷馬（Mark
    Homer）的支持，他是我的合夥人，細心分析商業局勢，教導我如何妥善管理金錢，學會「咬緊牙關」的真實意義。感謝琴瑪（Camma），我一生的摯愛，給我自由和愛，讓我學會如何妥善花費金錢。感謝我美麗的孩子，他們挑戰我，讓我成為一位真正的大人。他們昂貴的生活費，也催促我必須變得富有，才能讓他們接受學校教育。感謝我的公司團隊，他們每天鼓舞我。我也要感謝發展不動產、無限成功以及顛覆企業家三個網路社群的夥伴，謝謝各位在我寫作本書時，參與投票，表達意見'
