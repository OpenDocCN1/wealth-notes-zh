  md: '我們累積的個人財富，能夠創造超越生命且留給下一代的資產。人性傾向如此，如果你成為家長，就會明白這種想替孩子留下財富和知識資產的心情。當我們的生命結束時，知識和財富也隨之凋零，這是何其遺憾的浪費。


    # 如何建立極為偉大的願景？


    有些人甚至還建立了征服宇宙的願景。馬斯克、彼得·戴曼迪斯（Peter Diamandis）¹和布蘭森想要帶領人類踏上新的星球。


    他們把全世界當成一座遊樂場，因此他們的抱負甚至遠大過於地球。願景愈大，你所創造的服務就能替自己和他人帶來更多益處。增進個人福祉和財富的最佳方法，就是拓展你的抱負，從個人、家庭、地方、國家、全球，甚至到放眼宇宙。


    當你的財務目標和夢想，已經不再侷限於滿足一己之私或物質需求，而是著重在全世界所有人的需求，就會看見一股充滿魔力的財務磁鐵效應，因為所有人都被你吸引了。


    微小的目標只能帶來少量的財富，宏偉的志向則會帶來巨大的財富，不朽的目標吸引永恆的財富。'
