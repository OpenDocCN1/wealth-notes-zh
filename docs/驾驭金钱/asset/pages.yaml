  md: '次。如果你聰明，就應該發揮人際關係的槓桿效果，站在巨人的肩膀上。「我要自己慢 慢學習」、「我不希望花錢進修課程」或「我不想尋找專業導師的協助」會妨礙進步且
    磨耗精神。


    投資建構良好的智囊團、教練、導師和專業人士團隊應該是你最重要的關鍵成果 領域。


