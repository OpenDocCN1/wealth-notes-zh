  md: '每個人至少在一個領域中具備獨特的天分、技術和專業知識，勝過於許多人。別人在這個領域體驗的痛苦，你反而能夠輕鬆解決，造福社會大眾。你只是還不知道自己的價值。現在你終於明白了！


