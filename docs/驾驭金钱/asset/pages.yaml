- pgno: 57
  md: '强觍口，卻無法享受自己熱愛的事物？

    為什麼大多數的人與金錢之間產生了負面關係？為什麼他們認為金錢非常邪惡、不純淨、象徵貪婪與資本主義，倘若他們擁有財富，就會遭人批評，並且失去朋友？所有的負面金錢觀和抨擊就此浮現。


    藉由個人經驗、大量的挫敗、謙卑的成功、研究成果，以及曾經鼓勵指導我的導師和前輩，我將在本書帶領你學習金錢系統的各面向。如果別人可以建立巨大的財富，並且熱愛金錢，那你也可以。倘若這個目標確實是人類可追求的境界，那麼你當然會成功，成功是有跡可循的。你能夠師法一位西洋棋大師，當然也能夠從金錢大師身上學會金錢的藝術。許多人相信，你必須生在富裕的家庭，才能飛黃騰達，但你將會發現，你不但可以從最基礎的生活水準追求富裕生活，就算你身陷債務危機，只要研究富裕偉人，學習他們的思維和行動，也能夠擁有他們的特質，不需要走偏門！


    根據我的研究，想要成為金錢大師，根本不需要特殊的DNA基因或染色體。基因無法預先決定你能否擁有二十一億英鎊的淨資產或多少錢，因此，「你必須含著金湯匙出生才行，白手起家只是癡人說夢」的普遍想法只是種迷思罷了。


    我念國中時，經常忘記帶體育服，只能穿著一條小短褲上體育課。上課前，我們必須做熱身操，伸展身體，用手指觸碰腳趾。但我的手難以越過膝蓋，體育老師就在我的耳朵旁邊大吼大叫：「摩爾，別白費力氣了！你絕對不可能成功！」'
