- pgno: 253
  md: '歡去了解這些東西。正如各位讀者所知，金錢本身無關善惡，只是一種全球通用的價值交換機制，儲存未來價值的工具，因應不穩定的未來，並且創造公平交易。


    金錢是一種信用用工具，建立於相互信任的基礎，同時也是一種債務工具。


    金錢是精神轉化為具體物質的載體。歷史上的鉅富將激勵人心的生命意義和價值，轉變為金錢，並且具備當中所需的知識。


    明白上述三種特質，你就懂得追求富裕的物質生活，你不必感到恐懼，也不用因為遭到批評而產生罪惡感，獲得真正的心靈解放。


    # 鉅富的其他共通點


    研究百萬富翁、億萬富翁、商業領導者、創新和夢想家的過程中，我很幸運能夠與其中一些傑出人物結為好友。我們不應該用常見的刻板印象看待他們。因為這些鉅富彼此具備不同的價值觀、追求不同的獲利方式、來自不同的國家，年紀範圍很廣，而且男女皆有。


    換言之，我們無法用任何刻板印象描述億萬富翁的特質，但他們確實具備某些堅忍不拔的特質，可以成為我們的楷模，將富足轉化為金錢。


    富人不斷推動廣大的服務事業和成就，創造公平卻可觀的市場占有率，提供服務、'
