  md: '一個人就能成功獨自致富。


    在過去長達七年的時間，我的心情就像受害者，認為自己無法控制命運。那時，我突然領悟到上述的想法，雖然是我思想上的一大躍進，卻是精神飽受折磨換來的。


    我決定追求財富，但也為此受到限制。人不是無所不能，也不可能同時做這麼多事情，我們需要偉大的人才、優秀的朋友、傑出的團隊、良好的商場人脈、聰明的顧問和夥伴，建構理想的後盾、負責人和社群成員。


    一群次級的團隊成員，可以勝過孤軍奮戰的一軍；而一級人才組成的團隊，能夠帶領你登上顛峰。你領導他們，鼓舞他們，創造偉大的成就和財富。你也可以擔任支持者，成為龐大事業體中的內部創業者，找到自己的位置和價值，協助領導者追求成功。


    人類彼此相互依賴，在自利和人道關懷中找到平衡。幫助他人，自己也會快樂，這是雙贏。


    上天在創造人類時，似乎希望我們成為群居的動物，例如高爾夫球員在萊德杯中的改變。兩年一度的萊德杯，讓彼此競爭的職業球員展現從未出現的革命情感。職業足球選手羅納度將自己的成就，歸功於長年的經紀人好友荷黑·蒙德斯
    (Jorge Mendes)。網球選手安迪·穆雷 (Andy Murray) 認為伊凡·藍道 (Ivan Lendl) 改變了他的職業生涯。


    所謂的「獨自成就大業」者，其實都得到其他人的鼎力相助。


    「求人不如求己」是媒體和文化探討成功時的神話，也是現實生活中琅琅上口的勵'
