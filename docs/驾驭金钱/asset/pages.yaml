  md: '能夠與孩子分享。


    我在稍早的篇幅介紹復利效應的力量，也是為了說明愈早開始儲存硬幣，就能創造可觀的價值。你可以購買小豬撲滿，將硬幣丟入，設定一個日期，準備在未來享受紀律創造的美好成果。很多超級富豪也有類似的古怪樂趣，我認為硬幣管理反應你的金錢處理能力，也能夠吸引更大筆的金錢，甚至熱愛金錢。


    但是，銀行的儲蓄利息很少能夠跟上通貨膨脹。你儲存愈多金錢，國家的貨幣系統就會讓你承受更多損失。今天的金錢比明天的金錢更價值。只要你累積足夠的資本基礎，就可以迎接第三層的金錢使用方法，戰勝通貨膨脹和機會成本。


    # **③借錢（融資）**


    精通儲蓄和金桶管理後，就可以用好的借錢方式進行投資。你能夠抵押房地產，投資其他房地產，或者融資投資事業。投資時，務必睿智使用擔保品。景氣熱絡時，銀行會確保擔保品的價值，用最嚴格的方式審查貸款。景氣不佳時，銀行承擔更多風險，讓許多不值得信賴的人成功貸款，但利息非常高，導致貸款人無法承擔槓桿效果，容易遭受市場波動影響。


    二〇〇七年之前，許多人使用次級房貸得到金錢。每隔兩年，他們就會重新申請更高額度的房屋貸款，或者藉此取得現金，增加貸款負擔。這是一種無法長久維持的方法，傷害許多銀行和私人投資者。倘若他們妥善儲蓄這筆錢，或者進行風險較低的投資，就'
