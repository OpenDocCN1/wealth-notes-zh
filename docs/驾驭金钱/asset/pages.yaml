- pgno: 128
  md: '# 保持資本主義有效運作的重要因素


    判斷資本主義是否可以順利維持運作的主要關鍵因素如下：


    # 一、自由市場


    所謂的自由市場，是指經濟系統的價格，取決於私人企業間不受外力介入的競爭。商品和服務的價格必須是生產者（銷售者）和消費者的自由共識，供需法則不能受到政府、價格寡占或其他權威干預。自由市場的反面是「管制市場」，即政府藉由固定價格，或者制訂法律限制其他生產者進入市場，干預供需平衡。自由市場的價格不會受到外力干預，自然達成均衡狀態，也會支持創業、創新、高度競爭市場，以及生產企業的私有化經營。


    雖然一般人認為自由市場與資本主義息息相關，但無政府主義自由市場派、市場社會主義者，以及支持合作企業利潤共享的人士，也會提倡自由市場。由於成長和貪婪、管制和自由、寡占和重分配等重要環節時而平衡，時而失序，自由市場並不是完美的。


    自由市場的主要特質如下：


    # 自由選擇：


    企業主、商家、消費者和勞工可以自由生產、銷售和購買各種商品和服務，少數的'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 自利:


    限制是他們願意付出（或接受）的價格、資本額度，以及反壟斷等公平的管制措施。


    自由市場的運作動力來自人人都想將自己的產品或服務，賣給出價最高的消費者，並且保持最大利潤空間和最低的經常支出。雖然自由市場的動力是自利，但依然能夠創造長期的經濟平衡與益處，因為自由市場的「競標」系統可以制訂所有產品和服務的公平價格，在任何時刻都準確反應真實的供需條件。


    # 競爭和真實價格:


    自由市場的競爭壓力創造自我管制的適宜價格，非常公平且有效率，可以永遠真實反映市場的狀況。如果商品的需求提升，供需求法則就會提高價格。競爭者發現市場中有利潤空間，也會投入生產，提升供給。上述情況導致價格降低，市場開始淘汰，只留下最傑出的競爭者。因此，生產者和消費者都能獲得公平待遇。價格將反應製造者對自己和產品的價值認知。定價過高或過低，只會遭到市場以及供需法則的拒絕。


    # 有效率的系統:


    市場經濟完全仰賴有效率的市場，才能銷售產品和服務。一座有效率的市場可以平衡買賣雙方的自由和管制，個人和企業公司都有公平且開放的入場機制，以及影響決策的關鍵資訊。所有人都可以自由選擇進入、離開或參與市場運作。'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 二、利潤動機


    如果製造者、企業家或商業經營者認為自己努力成果會被低估，利潤也將遭到重新分配，他們就不會創造有意義的產品或服務。缺乏滿足自我需求的利潤動機，生產和創造力會劇烈下降，阻礙人類發展。基於動物的生存本能，人類的自我滿足動機幾乎永遠勝過人道主義的關懷。面對拯救自己或幫助陌生人的困境，大多數的人都會選擇拯救自己，就像飛機失事時，我們必須先替自己戴上氧氣面罩，才能幫助他人，這是人性的本質。面對金錢時，人性本質也會先找尋利潤，控制成本、支出和獲利空間。空談理論的社會主義者和共產主義者如果提出不合理的財富重分配，人性自我保存（滿足）和控制生活風險的能力就會遭到剝奪，無法掌握未來。人類也會失去動機，不願意創新、成長、就業、探索和承擔風險。創業家不希望他們的付出只是為了滿足國家的需求，也不樂於見到自己的努力並未得到公平的獎勵，甚至遭到剝奪。社會主義（共產主義）提出的合作企業模式從來沒有獲得真正的成長，也不曾成功通過歷史的檢驗。大多數的國營企業最後都被私人產業瓜分併購，才能滿足公部門的需求，或是因為國家放棄了相關經營。太多管制、國家控制和稅賦，迫使追求利潤的創造者尋找迴避規範的方法，或者搬遷至稅賦天堂國家。但是，如果過於放任自由，人性就會陷入貪婪，同樣無法照顧廣大的社會。因此，創造者和消費者，創新企業家和員工，都必須重視供法律則的平衡，以及公平交換中的定價機制。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 三、供需法則


    商品（服務）的需求是來自市場消費者的購買壓力。買方設定了最高購買價格，賣方也有理想得最低銷售價格。供給和需求的交線，就是產品（服務）的價格和數量平衡點。如果賣方願意用低於平衡點的價格銷售產品，其中的差距就是「生產者剩餘」；倘若買方答應用高於平衡點的價格購買產品，其中的差距就是「消費者剩餘」。


    上述模型常見於勞動市場的工資和人力。在勞動市場中，供給者和消費者的身份與一般消費市場不同。供給者通常是個人勞工，希望提供勞力，用最高價格賣出勞動力。消費者則是企業，他們想要用最低價格滿足需求，獲得勞動力。如果市場中的勞動賣方（供給）增加，供給曲線提高，就會改變勞動薪資的平衡點，減少平均工資。相反的，倘若市場的勞力人口減少，供給下降（或需求增加，通常兩者相互影響），就會造成勞動價格提高。市場勞動供給增加，產生剩餘，或者需求降低，勞動價格則會降低。容我重新強調，勞動市場的供給和需求經常相互影響。


    # 四、公平競爭和論功行賞


    我們因為功勞而獲得獎賞時，就會願意進行更多積極正面的行為；然而，如果我們受到憐憫的給予，行為模式會像受害者。利潤動機獎勵功勞，公平的管制讓大眾得到公平合法的報酬，有利社會中的個人和企業發展。正確的競爭行為與精神，可以促進創新'
  merge: -1
  img_proc: true
- pgno: 132
  md: '和成長，遠遠勝過社會主義提出的合作公司模式。


    我非常相信，如果沒有百事可樂的競爭，可口可樂的規模就會變小，也會更懶散，不重視消費者的需求。同樣的道理，賈伯斯也需要蓋茲和微軟的競爭刺激。蘇聯和美國曾經競爭太空創新和探索。競爭讓資本主義者願意投入更多利潤，保持最新的生產方式，獲得競爭優勢。上述的發展過程，讓消費者享受更好的產品和更優惠的價格。既然人人都是消費者，我們都可以享受競爭帶來的創新和便宜產品。公平競爭可能促成所有的人類進步，資助人類的研究和發展。由於人性追求成長，相較於當前其他的系統，資本主義對人類的幫助更大。


    # 五、公平交換、管制和重分配


    在未經管制的資本主義世界中，創造產品和服務的動機，就是追求最大利潤，容易引發貪婪且「不計代價追求利潤」的心態。


    剝削員工、薪資過低、激烈減少成本和品質，造成健康和安全隐患，無視環保以及從事非法行爲，都是顯而易見的惡劣心態。


    由於利潤空間太小，導致生產者不願創造對社會有益的產品或服務，例如建設偏鄉醫院。除此之外，廠商也可能非常重視香菸和酒精等利潤空間極大的上癮產品。如果妥善管理，管制和稅收可以解決上述的問題，同時讓創新者保有公平的利潤空間。'
  merge: -1
  img_proc: true
- pgno: 133
  md: '雖然許多人都喜歡安全且公平的環境，負責制訂管制政策卻是一項吃力不討好的工作。特定的產品雖然對社會沒有幫助，但經過重稅之後，可以資助建立造福社會的措施。對抗壟斷、不公平競爭和寡占的法律已經妥善運作，我們用合理的方式獲得智慧財產權、肖像權和專利權。洞燭先機、準備就緒的人可以獲得更大的利潤空間，而稅金也能發揮極大的用途。競爭者得以進入市場，享受自我管制的價格與價值。除此之外，公共機制可以減少非法行爲。


    過度的控制和管理則會造成不公平的措施，例如惡劣的財富重分配，妨礙創新、競爭、服務和利潤；也可能導致獨裁者施行少數的極端政策，藉此獲取龐大的私人財富，犧牲性廣大人民的福祉，滿足貪婪和權力。許多想要取代資本主義的經濟社會體系都有這類型的缺陷。


    # ○是要對抗資本主義，還是加入它的行列？


    相較於用虛幻不實的話術企圖改變資本主義，精通現有的機制並且順勢而為是否更好？我們應該接受還是拒絕資本主義？


    生活在資本社會中，我們其實都是資本主義者。搞懂錯綜複雜的資本主義，才能夠讓我們從中獲益。'
