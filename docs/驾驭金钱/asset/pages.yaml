  md: '刻銷售產品，逐漸減少經常支出和風險。


    市場能夠自行管制價格，銷售者提供的價值越高，就可以獲得更好的回報。減稅制度讓銷售者維持長久的利潤空間，並且替國家創造可觀的稅金收入。我們也得以自由建造資產、收入和利潤，並且重新投資，保持產品和服務的市場競爭力。金錢的移動速度比以往更快，我們能夠取得所有需要的資訊，創造更多金錢。我們在公平交換市場中賺到愈多金錢，就可以向社會提供更多福祉和貢獻，增強自己的價值。


