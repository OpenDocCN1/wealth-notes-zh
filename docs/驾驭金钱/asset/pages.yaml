    # 一、在乎人類


    如果生命沒有價值，那就不用實踐理想了。用自己的方式，服務社會且解決他人的問題，才能創造自己獨特的價值。改善人類生活，促進社會繁榮，就是我們支持人類進化的方法，把價值和服務投入全體，增加愈多，你就愈成為整體中珍貴的一分子，社會'
