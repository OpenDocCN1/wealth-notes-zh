  md: '# 設定目標，勇敢追求


    己的重要性遠遠超過其他所有目標。如果你希望成為商場大亨，就應該理解如何主宰自我。如果你渴望得到巨大財富，就應該建立健康的心理財富。從今天開始，找到你內心和往的目標，立志終生學習。向頂尖專家請益，閱讀他們的書籍，收看他們的網路廣播節目，聆聽他們的有聲書，參加他們舉辦的講座和活動，觀看他們製作的
    YouTube 影片，直接拜訪他們，思考自己能夠在未來與他們建立何種關係，甚至主動協助他們。付出愈多努力學習，就能創造愈多金錢。


    你願意謹慎思考，還是陷入絕望？沒錯，你希望得到財富和成功，但絕望的心情會阻止你，因為其他人不會樂於幫助你實現目標，建立財富。設定啟發人心的目標，採用任何一種具體或宛如魔法小咒語的形式，讓生活可以自然而然地實現目標，不要被結果影響，堅定意志，繼續這場旅程。讓我說明經營事業的平衡二分法：一開始，你應該飢渴，充滿動力並且永不休息，上述特質雖然有助於創業，但無法吸引其他人的幫助，也會阻礙建立財富。自我壓力過高，或者過度控制結果，只會導致不切實際的期待，造成內心的抗拒。'
