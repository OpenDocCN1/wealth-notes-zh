- pgno: 123
  md: '因此，配戴百達翡麗手錶時，我們也承接了他們的精神。可以購買手錶或汽車的富人創造了一種慈善事業，他們照顧百達翡麗或賓利的員工和家人。


    由於世間的能量的不會憑空出現或遭到摧毀，「一個人花費五萬英鎊購買手錶，就會造成第三世界窮人的損失」其實是種迷思。精神能量只是透過物質交易來流動而已。


    鉸傲音響（Bang ＆ Olufsen）設計美麗的聲音產品，其聲音和視覺成就堪稱藝術。設計師和技術人員投入的天分、熱情與奉獻，傳遞至實體產品，才能讓物質主義者獲得享受。


    當然，有些人之所以這麼推崇物質，是因為享受物質帶給他們的感覺，或者喜歡藉此提升自己在他人眼中的地位，但許多人推崇物質，只是因為他們喜歡美的事物，而物質不過是其中一種形式的美。從這個角度而論，欣賞物質與貢獻他人，兩者帶來的美好感受其實沒什麼太大的不同。許多人只購買有機或符合公平交易的食物。他們認為，這样可以將金錢用於正確的目標。這種原則適用於物質消費。


    你可以選擇特斯拉電動車，而不是一般的燃油車，也能夠將行銷成本投入谷歌，他們在二O一一年時向美國境內的非營利組織和學校捐贈了一億四千四百六十萬六千美元。成為美國運通卡和第一資本卡（Capital
    One）的會員，或使用其信用卡，就有機會得到回饋金，或者將一定程度消費金額，捐贈給數間良好的慈善單位。


    這是一種非常良好的社會回饋方法。使用這種信用卡，我們不必親自捐贈金錢，只'
