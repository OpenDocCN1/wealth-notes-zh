    打造這個系統能讓你事半功倍，列出各種目標和任務的優先順序，提供明確的方向，讓你可以從事最重要的工作、服務更多人，賺更多的錢。


    你值得擁有時間，遠離那些雜事，隔絕各種噪音，率先關注最有價值的事物，想更多事情、獲得更多財富，並且對世界付出更多。'
