  md: '# 金錢可以改變大腦的化學反應


    必須的作爲。你絕對能夠，也應該努力改變，成爲一個更富裕的人。如果你的朋友是真正的朋友，他們會和你一起成長，或者接受你的改變。倘若他們不願接受，沒關係，溫柔地讓他們離開吧。不要覺得受傷，讓他們選擇自己的人生，而你繼續努力追求成功。


    金錢和大腦相關的研究已經提出愈來愈多強烈的證據顯示，金錢確實可以讓人變得快樂，其中的關鍵就是神經傳導物質「多巴胺」（Dopamine）。


    許多人都知道，多巴胺是人體的自然獎勵系統，能夠創造許多快樂的感受，特別是「調皮」的感官，例如性感、權力和上癮。《幸福的科學》（The Science of
    Happiness）的作者、科學家大衛·李伯曼（David Liberman）曾描述幸福是「一種持續追求有意義目標的過程」。幸福的四種主要化學物質是多巴胺、催產素（Oxytocin）、血清素（Serotonin）和腦內啡（Endorphin）。


    當你成功邁向有意義的目標，大腦就會釋放上述物質。金錢是一種進展。持續賺錢也是一種進展。


    金錢可以是生活的目標，或者協助完成生活的其他目標。金錢能夠購買讓你快樂的物品，促進大腦的化學反應。金錢充滿意義，因為金錢可以让你負擔有意義的事物。大'
