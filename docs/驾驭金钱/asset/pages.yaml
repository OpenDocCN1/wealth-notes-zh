    # ◎擁有鉅富的特質，效法他們的經驗


    俗話說：成功必有訣竅。你可以從鉅富的身上，學習各種常見的特質，成為財富大師。


    事實上，你崇拜鉅富的原因，就是因為你內心早已蘊藏相同的偉大特質，研究並且學習他們，就能喚醒這些特質。他們在這個世界創造了偉大不朽的成就，你想要學習他們，就應該理解他們的特質，並且欣然接納。


    在我的研究中，這些鉅富都會與其他成功人士相處，甚至效法比他們更優秀的佼佼者。你的人際網絡是個人的淨價值。你的一生都應該用於尋找其他的鉅富，與他們相處，服務他們的需求，效法他們的特質。'
