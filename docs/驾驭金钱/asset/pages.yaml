  md: '# 。提供貸款（融資）


    提供貸款是賺錢的自然過程。銀行提供貸款，中央銀行也提供貸款。錢會滾錢，將錢藏起來是不會增加值。隨時間過去，借貸予人者都會擁有可觀的財富。某些人鄙視這種做法，有些宗教則禁止有利息的貸款行為。如果你能夠超越上述想法，認為它能提供良好的服務，滿足市場需求，就可以將之加入你的事業項目。事實上，消費者提供金錢給生產者，經濟環境才會逐漸成長。在第三世界國家，許多新興事業必須仰賴小型貸款。貸款當然有風險，但所有的事業模型都一樣。在你有錢後，你應該要開始思考這條路。


    # 。實體資產（貴重金屬、藝術品、手錶、酒、經典車）


    實體資產和商業模型可以保持資本價值。如果你的事業就是銷售資產，可以同時建立獲利空間和資產數量。你的存貨價值可能會逐漸提高，其他產業的存貨價值則是緩慢下跌。近年來，許多保持時捷經典車款的價格水漲船高。藝術品和經典錶款漲價時，經銷商也會自己買進藝術品和經典錶款。如果你非常重視資本，注意平衡資本與收入是良好的經營方法。


    # 。改變世界的重要事業領域


    能夠改變世界的領域通常可以持續成長，包括顛覆世界運作方式的科技，例如環保'
