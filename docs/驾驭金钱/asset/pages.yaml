    天真的人容易受到誘惑，以為能夠找到建立複利效應的捷徑。樹根還沒有機會成長，他們就決定放棄，尋找下一個新事物。


    他們不斷砍掉重練，從頭來過。唯一呈倍數成長的只有痛苦、可悲和低落的自尊心。


    只要事態的發展不如預期，他們便開始抱怨。諷刺的是，也許他們根本還沒失敗。雖然目前的結果不盡人意，但只要他們願意持之以恆，就會獲得財富和幸福。怎樣都比曇花一現後立刻放棄好。只要堅持下去，即便只是表現持平，還是有辦法賺到錢。'
