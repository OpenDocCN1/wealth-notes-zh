  md: '者。


    這個社會設計了各種標籤與價值，讓特定領域的少數人得以被稱為天才，其他人則


    否。因此，缺乏財富和金錢，只是因為你的獨特才還没轉化為金錢。其他人已經知道


    如何善用才能賺錢，你一定也可以成功。


