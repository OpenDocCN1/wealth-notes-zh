  md: '金錢變革的故事在不斷重演，只是每次的形式都不一樣，但每次都更為先進且迅速，而改變是唯一的恆常不變。


    在許多國家或開發中世界裡，無錫社會最脆弱的成員，其實是年邁且不願接受數位金錢的有錢人和窮人。


    是否願意接受數位金流並非科技問題，而是技術水準和訓練議題。無家可歸的人更在乎自己的經濟狀況，而不是高水準的金錢形式。由於居無定所，他們無法使用信用付款，更難妥善管理銀行帳戶，因為流浪漢不可能從路人手中接獲加密的數位貨幣。


    缺乏現金並不會讓一個人無家可歸，但確實可能加深貧富差距。你擁有絕佳的機會去參與金錢的發展，並能從中創造更多、得到更好的發展，並且分享更多資源。發展中國家的緩慢進度，讓企業家得到巨大的發展機會，也能藉此解決更具意義的重大問題。


