  md: '錢。


    六、完成交易。銷售後向對方請款，明確執行交易條件。確認會面時間、向對方索取信用卡資訊、安排運送事宜。


    七、提供服務、照顧和價值。完成服務後持續關心對方。致電給客戶了解問題，理解客戶的價值，提出往後提供的產品或服務。即使已經完成付款，仍然要維持公平交易的環境。


    八、要求推薦和回應。順利完成交易之後，客戶應該會成為你的支持者，請教他們是否認識朋友願意購買相同的產品或服務。請客戶推薦三位朋友的聯絡方式。請客戶誠實表達建議，改善服務或產品。


    # 不要耍花招


