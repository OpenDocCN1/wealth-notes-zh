  md: '# CHAPTER


    # 1


    # 你買得起法拉利嗎？


    在成長的過程中，我對父親最深刻的記憶之一，就是他的大手握著舊舊的咖啡色卡元英鎊大鈔。他習慣將鈔票收入褲子後方的口袋。他總是把那些鈔票前後對摺，鈔票上的女王頭像整齊地對著同一個方向。他只用現鈔付帳，還喜歡討價還價，爭取折扣。他經常帶著我去酒吧、旅館和餐廳，並購買店內的擺設、裝飾品與儲貨。我們在量販店結帳取貨時，父親會讓我購買一大箱的糖果。回家路上，我吃了一堆糖果，並且對父親心生敬佩，希望自己長大後能和他一樣賺那麼多錢。


    從我四歲開始，父親就教我如何工作賺錢。我的第一份工作是在酒吧「拿酒」，我得到寒冷、潮濕的地下室拿酒。


    我抬起裝滿了酒瓶的箱子，幾乎看不見眼前的路，還要補充架上和冰箱的庫存。父親教我如何用最短時間，盡可能地把大量的酒瓶塞入箱中。熱鬧的週五夜晚過後，在週'
  merge: -1
  img_proc: true
- pgno: 8
  md: '六清晨六點，我可以用半小時補滿大多數的酒瓶庫存。


    爸爸給我五十便士的工資，我在週末打工，因為媽媽不准我在上課時間工作。我把週末打工的薪水存起來，將通貨膨脹考量進去的話，我的存款應該高達現在的九十五萬六千英鎊。我將這筆鉅款帶到家中附近的雜貨店，購買裱框的汽車照片。店家陳列了我最愛，例如藍寶堅尼的康鐵克（Lamborghini
    Conrtac）、科維特（Corvette）、法拉利 的泰斯塔羅莎（Ferrari Testa Rossa）、保時捷的九一一（Porsche 911）、賓士古爾溫古董車（Mercedes
    Gullwing）和其他車種。我把這些照片一張一張全部買回家，掛在我的臥室牆壁上。


    言歸正傳，總之父親叫我和我妹一起用吸塵器打掃酒吧。酒吧的地毯是棕色的，格紋非常華麗，好處是如果有人掉了硬幣在上面，是無法被輕易找到的。地毯成為完美的捕蟲草，接獲酒吧客人身上的一英鎊硬幣。


    週末的一大清早，我和妹妹起床，一邊高唱「我想要錢，我真的想要錢」，一邊在酒吧裡搜尋客人掉落的硬幣，爸爸也同意我們自己留著用。我父親總說，無論錢掉在哪裡，只要我撿到，就是「天外飛來的財富」。


    隨著長大，我賺錢的欲望也變得愈來愈強。在酒吧和旅館長大的好處，就是我很年輕時就能夠獨立，也培養出企業家精神了。我和妹妹經常獨自待在酒吧或旅館的樓上，我非常喜歡這種自由。我們必須照顧自己，念國中時，我已經學會烹飪、打掃、洗衣服'
  merge: -1
  img_proc: true
- pgno: 9
  md: '漫衣服，甚至和妹妹打架等珍貴的生活技能。我還是青少年時，曾經向母親提出一份商業合作企劃案，詢問她是否想將燙衣工作以「生活槓桿」的形式外包給我（我當時當然沒有用「槓桿」這個字眼），大件衣服收費二十便士，褲子和小件衣服則是十便士。她接納我的提案，於是我的青少年時期，就在一邊燙衣服，一邊觀賞MTV電視台的《金屬搖頭狂熱》（Headbangus
    Ball）中度過了。通過駕照考試之後，父親常派我去買酒吧的營業時間品，我把所有找回的零錢都存起來並仔細記帳。


    讓我們將時間快轉七年，我已經二十四歲，唸完大學，度過一段愉快的時光，但喝了太多酒，也把父母親的錢揮霍光了。我曾擁有偉大的夢想和理念，但父親生了重病，我只好暫時將挑戰全世界的計畫擱置高閣幾個月，回家協助父親經營彼得伯勒（Retborough）的酒吧生意。四年後，我依然在幫忙打理父親的生意，卻積欠了相當可怕且沉重的個人債務。直到夏日的某個早晨，我和一位朋友在嚴重宿醉後，看見一輛法拉利法拉利蜘蛛跑車才終於痛定思痛，決心擺脫債務。駕駛放下敞篷車頂，車內音響震天作響，他看起來氣焰高張。直到現在，我最想要的跑車不是別的，正是那臺法拉利法拉利蜘蛛跑車。彷彿我所有的童年記憶、情緒和欲望，都化身為一輛美麗的汽车：優雅的線條，刺耳狂暴的排氣管聲浪，還有法拉利專有的羅莎紅。跑車呼嘯而過，我能夠以慢動作畫面看見並感受所有的景致、情緒和欲望，於是我轉頭對著朋友痛陳：「看看那個討厭鬼，他一定是賣毒品的。┐」'
  merge: -1
