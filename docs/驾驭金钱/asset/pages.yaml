    除此之外，你也能透過手機應用程式，將自己的存款借給他人。只需有好的創業概念，花幾分鐘建立創業募款活動，設立「不成功就退款」的條件，降低投資人的風險。


    將近半數的創業募款活動從草創階段就成功了一半。十年前，這樣的借資形式尚未出現。比十年前再更早一些，你還必須穿上西裝，準備一條擦汗用的手帕，親自登門拜訪銀行經理，求他借錢讓你創業。


