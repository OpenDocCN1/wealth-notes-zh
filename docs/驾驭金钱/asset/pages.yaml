- pgno: 111
  md: '# CHAPTER 15


    # 公平交易


    我剛踏入社會時，想成為一名職業藝術家，當時我的作品賣得很便宜。在你急著批評我之前，我必須老實說，我的作品並非水準不良，而且相當不錯。原因是彼得的居民沒錢。我知道帆布和原料的價格都非常低廉，因此，在彼得伯勒的售價不應訂到像在倫敦一樣高，那樣就太貪心了。


    我最近讀到一個故事，我希望自己剛開始創業時就知道這個故事。畢卡索坐在巴黎的一間咖啡廳，一位仰慕者前來請求畢卡索在他的紙巾上速寫畫像。畢卡索彬彬有禮地同意，很快完成作品之後，向對方要求一筆相當高額的酬勞，再將紙巾交給仰慕者。仰慕者相當驚訝，他說：「你怎能跟我要這麼多錢？這張畫像只花了你兩分鐘。」「不。」畢卡索說：「我花了四十年！」


    讀到這個故事，我彷彿被相撲力士打了一巴掌，終於明白當時我是如何低估了自己'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 作品的價值。


    我只看見材料的成本，忽略了從三歲開始，我為了學習藝術而奉獻的時間、投資、付出、機會成本、榮耀和學位、心力、痛苦和熱情。我沒有把二十年來的經驗也考量在價格內。


    這個故事的訊息非常強烈，你制訂的價格必須包含生平的努力、教育知識、經驗、服務他人的決心、解決問題與照顧他人的想法，以及奉獻犧牲。


    倘若疏忽上述環節，你就會體驗我當時的感受，包括罪惡感、羞愧、痛苦以及缺乏自尊。你會怨恨買家只願意給這麼低的價錢，諷刺的是，制訂價格的人卻是你自己。


    當然，價格是主觀且相對的。買家認知的商品價格也是公平交易過程的一環。如果賣家認為價格不公，你也不能恣意決定。


    公平的價值和公平的價格，才能創造公平的交易。


    交換和交易的目標都是讓你得到財富。你提供產品或服務，而買方所獲取的價值也會影響定價。因此，公平交易通常是雙向的，至少有一位賣家和買家。想要促成公平交易，賣家必須提供買家認為公平的價值，而買家則需支付賣家認為公平的金錢。


    只有公平交易可以創造自由的金錢流動，並且締造財富。公平交易的標準取決於市場或參與者，有時單獨決定，例如藝術，有時則必須由全體消費者共同認知，像是燃油價格。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '價格永遠不會說謊，因為賣方願意接納而買方也同意支付。我曾經創造令人相信且能反覆驗證的財富方程式，其中的變項包括價格（V）、交易（E）以及槓桿（L）。想要維持穩定長久的公平交易，就必須在自然平衡的狀態下，提供價值，並且獲得公平的金錢回報。我們會在第二十六章進行更深入的討論。


    # 缺乏公平收入的給予


    缺乏公平交易或收入的價值，就不是真正的價值。大多數的人不珍惜免費事物。你曾經免費得到一本書，卻拿來積灰塵嗎？你是否努力增進「自我發展」知識，提出價值千金的建議，其他人卻不珍惜？如果你支付了五百英鎊，才能買下那本書，你是否就比較願意閱讀呢？答案是肯定的。你甚至會把伴侶擠到床的邊邊，讓這本書大刺刺地躺在你們中間。你絕對會對那本書愛不釋手，把它當成寶一樣對待。因為金錢的多寡某種程度上決定了該物的價值，藉由金錢進行量化，讓無形的事物變成實質且有有意義的東西。


    許多努力追求財富的窮人不知道，就是因為他們的產品和服務定價過低，才會發不了財，也就是我從事藝術創作時犯下的錯誤。


    我以爲彼得伯勒的居民沒有足夠的消費力購買我的作品，但其實是我的這種想法才導致不好的結果。低價的藝術作品只會吸引只願支付低價的顧客，更糟糕的是，也趕走'
  merge: -1
  img_proc: true
- pgno: 114
  md: '願意支付高價的顧客。

    我因為恐懼與害怕，不敢定更高的價格，因此折損了自我價值，以及世界對我的價值認定。我覺得自己承受了不公平的交易，但事實上，我自己才是造成不公平交易的主因。


    如果你的定價過低，不會有人想幫你提升至公平價格，而自願支付更多金錢，也不会有人為了照顧你的自尊，而支付更多金錢。一切都是咎由自取。


    價格過低無法創造公平交易，零利潤、賠本交易，以及負面情緒，將導致賣家無法維持生產。零利潤空間與怨恨折損賣家的自尊，傷害賣家和顧客之間的關係。同樣的，買家雖然支付低廉的價格，也沒有辦法取得相對應的公平價值。由於自然和金錢的法則，同樣的情況只會愈演愈烈。諷刺的是，解決方案非常簡單，那就是立刻提高價格！

    我曾在第四十三章詳細討論。


    # 不公平的收入


    由於金錢反映人性且服務人性，造就了完美的平衡，另一種極端的不公平交易也無法持續下去。

    非法或不公平收入經常成為公平交易的反面例子，關鍵就在於「權力」。從短期的'
  merge: -1
  img_proc: true
- pgno: 115
  md: '角度而言，販毒或者建立共產主義集權政府，或許可以創造可觀的金錢利潤，但只是少數極端的案例。


    只要細心研究歷史，你就能發現極度貪婪或渴望權力的例子都無法長久維持，他們的貪婪愈強烈，發展就愈惡劣，平衡後的結果往往是積欠巨大債務、入獄服刑或更糟糕的處境。


    濫用權力，只為了追求個人金錢利益，罔顧全體人類福祉，通常會遭到罷黜、推翻，在極端的情況下則會被處死。戰爭犯和毒販無法連年登上全球富豪排行榜。


    因此，如果得到收入，卻沒有公平的付出，或是產品、服務和概念的價格過高（或在價值過低），一定會引發其他後果。買方將因此覺得失望、覺得自己遭到誘騙或詐欺。他們會激烈地傳遞訊息，影響你的聲譽，降低往後的銷售。根據《口碑行銷的祕密》（The
    Secrets of Word-of-Mouth Marketing）這本書，好的名聲只會傳遞四次，而壞的名聲則會傳遞十一次。


    使用不當的方法，也許一開始可以帶來突飛猛進的銷售結果，然而一旦顧客發現你的服務或產品缺乏價值，結局就會完全不同，因為你的價格超過了市場標準，或者你的價格無法提供對應的價值。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '# 公平且心懷感激的給予與收入


    觀察交易的兩種極端現象，藉此找出均衡狀態非常重要。

    實現金錢法則才能創造財富，唯一的方式就是持續進行公平交易。過度在乎自身利益，只會減損你在他人心中的價值。過度討好他人，則會貶抑你的自我價值，也無法長久經營。


    PayPal 發現，藉由電子郵件進行金錢交易即將成為主流，而且市場上只會有一間公司主宰該領域，相關技術非常容易，而且還沒有任何公司成功。

    他們迅速建立各種通路，但消費者沒有使用 PayPal 服務的動力，也無法感受其服務的內在價值，這是他們最大的挑戰。


    PayPal 必須創造有機強力的成長。於是他們決定提供金錢誘因。新註冊的顧客可以得到十美金，現有顧客只要推薦一個人註冊帳號，也能得到十美金。PayPal 因此獲得爆炸性的成長，他們甚至將新註冊顧客的獎金提升至二十美元。這間公司的反應能力成為他們最好的資產。他們迅速地轉換跑道，在二〇〇二年時公開提供服務。B&G
    也隨後出價十五億美元收購 PayPal。


    PayPal 公司的現值大約是四百九十億美元至五百一十億美元，而他們的起點是公平的給予。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '在公平交易的環境裡，你的時間和付出都會得到公平的報酬，你的自我價值也隨之提升，協助你提高產品或服務的價值和價格。


    你創造了利潤，提升規模，投資增加品質與價值。價格和價值提升之後，你也會吸引更好的顧客，他們珍惜你的產品或服務，也願意支付更多薪資。一旦建立良性的成長循環，你能夠給予更多更好的服務，促進金錢流動，鞏固金錢本質法則。


    這就是為什麼提升產品價格很重要的另一個原因。'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 16

    CHAPTER

    精神和物質主義


    精神和物質精神經常被視為光譜的兩極。「物質主義者」或資本主義者，可能認為精神就是雙手擁抱樹木，大喊：「肯巴亞（Kum Ba Yah）！」精神主義者或自由主義者，則相信物質主義或資本主義關切的只有貪婪、權力、自利，或者不願意照顧他人，拒絕與地球上的其他人分享。


    我可以整理出以上特質，不是因為我同意他們，只是說出社會常見的刻板印象。每個人都是獨特的，可以展現自己的特質。我越是深入探索，就越相信物質和精神本為一體——屬於自然平衡以及人性秩序的一環。


    沒有物質的精神無法傳達心意，而缺乏精神的物質毫無情感。宣稱自己「重視精神而看輕物質」或「強調物質而不在乎精神」都是一種矛盾修辭。想要實現物質欲望，我們必須完成精神使命。世間萬物都是精神和物質的融合。容我重新強調約翰·迪馬丁尼'
  merge: -1
  img_proc: true
- pgno: 119
  md: '博士（Dr. John Demartini）的名言：“沒有物質的精神無法傳達心意，而缺乏精神的物質毫無情感。”


    沒有物質的精神無法實際存在，只是一種虛無。然而，缺乏精神的物質則像石頭，沒有功能、方向、使命或生命。


    物質和精神，究竟和金錢有何關連？我們創造重要的事物，或者實現自我的理想，為了扭轉社會的刻板印象，物質主義者的目標應該是將精神化為具體存在且富有生命的物質。藝術家將靈魂注入畫中，鐵匠則投入熱情至手鍊裡，才能用物質型態傳達熱情。我們仰慕他們的熱情，願意用金錢交換。


    為了擁有豐盛的物質，我們必須將能量、精神、經濟和感激傳達給銷售者，協助他們建立企業，向其他人傳達精神和熱情。


    銷售者可以把自己的願景獻給人性成長，我們也能夠成為共同建造者。我們獎勵銷售者的努力，創造了公平交易的環境。銷售者提升個人經濟能力，支付日常費用，讓家人溫飽，孩子接受良好的教育，將知識傳遞給下一代，也都是你的功勞。


    如果沒有物質商品的購買者，許多服務將會消失，雖然很多人批評遊艇或超級跑車是不必要的奢侈支出，但是，如果它們真的毫無用途，就不會存在。


    物質商品可以真實傳達靈魂之美。你可能曾經看著一幅畫、一輛汽車或者一件家'
  merge: -1
  img_proc: true
- pgno: 120
  md: '具，認為它非常美，這是因為設計師或創造者將熱情或靈魂投入其中，成就了其精神價值。


    # ○ 付出，還是創造？


    可能許多人認為，最好的善舉就是提供教育和創業機會。捐款固然使人快樂，但他們會擔心善款未被妥善應用。特定的慈善單位捐贈大筆金錢，支付企業的活動、薪資、會計費用和其他支出，目的不是宣揚善行。在我們捐贈的款項中，究竟有多少直接用於慈善用途，其實取決於慈善單位的目標和性質。但是，如果捐款是衡量精神付出的標準形式，當前的慈善事業確實充滿浪費和錯誤的資訊。即使你選了一間慈善單位，決定每月捐出十英鎊，也只有一小部分的金額可以協助他們直接推動目標，仍然無法完成提供教育、知識（精神）和創業（工作和生計能力）等慈善事業。


    以購買作爲形式的物質主義，其實是一種終極的慈善和精神付出。一個商品的價格越高，製造者投入的精神能量也可能更高，許多人可以因此受惠，政府也得到更多稅收，藉此修繕道路、投入國防、保持醫院運作、支付照護者的費用、維護水質清澈，以及更多被視爲理所當然的生活條件。


    當然，物質主義也可能淪爲貪婪或詭異的富庶。我們應該擁有財產，而不是被財產'
  merge: -1
  img_proc: true
- pgno: 121
  md: '所支配，才能符合自然平衡，並且清楚地理解生活中的金錢矛盾困境。追求金錢和物質，發揮持續學習與成長的人性特質，提供價值並且照顧他人，就是實現目標時的評估基礎，也是實現願景以及回饋社會的一種方式。


    社會、宗教、媒體和其他外部影響力，可能會變成我們的內在聲音，說服我們產生偏見，認為物質主義是邪惡的。但他們的說法並非事實。對人性發展最有貢獻的人物，其實都創造了巨大的財富。我們將在本書往後的章節深入探討。


    我們擁有越多物質品和財富（必須保持謙卑，並且遵守消費和投資的平衡），就可以在當地、國家和全球環境促進經濟發展，藉由消費增進國內生產總額，使得經濟環境變得更好。


    物質主義和金錢是一種慈善投入，讓銷售者賺取利潤。我們付出越多，就可以幫助更多人，銷售者得到利潤之後，可以學習和成長，創造更多服務。如果慈善事業缺乏公平交換和交易，接受者的服務和成長也會減少。


    物質主義和錢財，能夠鼓舞他人一起創造更好的經濟環境。如果你開的是一輛生鏽老爺車，是能夠鼓舞到誰？


    符合謙卑和精神原則的物質主義，才能夠讓他人明白，只要努力學習，服務他人，就能夠獲得合理的回報。'
  merge: -1
