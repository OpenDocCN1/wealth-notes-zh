- pgno: 88
  md: '貨幣之後，通貨膨脹現象一直發生。


    通貨膨脹的其他可能原因包括新型貨幣的誕生（例如電子貨幣——比特幣），銀行調降利率，提升民眾貸款或花費金錢的意願，增加金錢供應，或者商品的數量品質減少（假設金錢供應保持一致）。無論價格或金錢供應提升的原因是什麼，最後都會引發通貨膨脹，如果價格或金錢供應下降，就會減少通貨膨脹速度，或者造成通貨緊縮。


    金錢的通貨膨脹其實反應了人類生命的發展演化過程與目標。由於人類追求成長，價格和服務品質都會逐漸提升。為了追求成長（或說是滿足貪婪），人類創造更多產品，使得全球資源提高供應，導致金錢的相對價值減少。人口成長也會引發通貨膨脹，因為金錢必須分配給更多人。


    你應該善用這個知識優勢，提升自我價值，以及你的商品（或服務）的價格，還有開發更多的潛在客戶。


    全球金錢的數量會一直增加，這是金錢的恆久本質，所以你必須持續精進你的商品或服務品質，才能開創收入來源。如果你無法跟上金錢的節奏，你的相對價值就會下降。


    # 二、不理解且不珍惜金錢者，他們的金錢會流向最理解且懂得珍惜的人


    金錢的運作其實有可預期的模式和法則。然而，正確應用金錢模式和法則（或者錯誤應用）的關鍵在於「人」，而非金錢本身。


