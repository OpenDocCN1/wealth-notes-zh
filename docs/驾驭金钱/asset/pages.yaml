- pgno: 185
  md: '# 減少及時行樂


    一開始，我們都很容易受到「及時行樂」的誘惑，因為缺乏長遠睿智思考的經驗。一般而言，如果某個事物聽起來非常完美到不真實的地步，那麼它就不會是真的。


    在一些無傷大雅的情況下，我們都渴望及時行樂。

    讀者朋友可能嘗試過治標不治本的激烈手段，希望克服失心瘋的狀況，例如打自己巴掌、鎖住冰箱、聘請教練或者四處貼上便利貼。刺激只是一時，唯有啟發人心才能永恆。


    經濟學家一般相信，如果某個單位與金錢具備「相互替代的能力」，能夠取代金錢。例如，一盎司的純金，可以用其他重量單位的純金取代，所以純金確實具備「替代性」，金錢也適用於這個道理。


    觀察許多人的行為之後，我個人反對經濟學家的想法。經濟學是純粹運輯的學科，但人類的行為必須將情緒考量在內。


    十七歲時，我遇到一場非常嚴重的摩托車交通意外，手臂和腿都斷了，甚至腦震盪，住院療養數日。我的左手幾乎無法動，用數個月時間進行復健，因此錯過了大學预科二年級。

    保險公司理賠的速度很慢，將近八個月之後，我才拿到一萬五百英鎊的意外傷害理'
