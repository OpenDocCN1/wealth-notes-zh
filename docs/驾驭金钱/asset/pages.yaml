  md: '表你只有∘・∘二或二%的獲利率。現金本身難以創造良好的槓桿效果，除非現金成為製造槓桿的擔保品。


    # ◎銀行槓桿效果


    如果現金成為房地產的存款抵押，銀行就會根據房地產的價值計算貸款，並且收取手續費。銀行可能會同意借出資產價格的五十%或八十%作為貸款金額。


    假設你購買房地產時，必須繳納二十五%的現金作為存款抵押，剩下的七十五%則是向銀行貸款，代表你用二十五%的現金比例購買資產，槓桿效果就是四倍，或者是四百%。


    你付出二十五萬英鎊購買價值一百萬英鎊的資產，剩餘的七十五萬向銀行貸款。銀行本身並未得到任何資本成長，價值一百萬英鎊的資產屬於你。


    根據全英房屋抵押貸款協會 (Nationwide Building Society) 的研究報告指出，一九五二年之後，英國房地產價格每十年就會成長一倍。換言之，十年之後，你的房地產價值將會變成兩百萬英鎊。如果在這十年間，你只繳納七十五萬英鎊的貸款利息，或者設定二十五年的貸款償還期限，可能已經償還三分之一的金額，代表剩餘五十萬英鎊左右的貸款。由於銀行貸款建立的槓桿效果，房地產的實際價值已經從原本的二十五萬英鎊，變成一百五十萬英鎊。原本的二十五萬資本也成長了六倍。


    讓我們再假設房地產十年來都順利出租，用房租收入繳納貸款，七十五萬的貸款減'
