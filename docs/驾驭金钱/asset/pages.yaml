  md: '富平均重分配」都是迷思。社會主義下的理想社會，不鼓勵個人提供價值，服務社會成員和解決問題。資本主義能夠平衡人的自利與人際關係，創造雙贏的服務和價值。但社會經濟系統壓抑自利，可能用非常不公的方式，獨善少數的統治者。


