    由於窮人消費的程度遠高過於生產的程度，唯有進行大規模的生產，才能達成經濟平衡，再加上八十／二十法則，粗略地說，二十%的有錢人將會替八十%的窮人進行生產。


    如此一來，原本的金錢流動方向就會因為複利效應而加速：有錢人變得更富裕，窮人變得更貧困。一旦金錢流動的方向獲得動能，就很難改變，這個原理也解釋了為什麼我們剛開始從事新職業時，在前幾年非常難獲利，但擁有數十年經驗者，卻可以更容易地累積複利財富和非勞動收入。


    為了創造真正有效的財富重分配，窮人必須承擔責任，提高生產，超過消費。給糖君子一筆錢，我們都知道他會把錢花在哪兒。倘若我們只是把金錢交給消費者，卻沒有讓他們理解相對應的責任和教育資訊，他們只會用和過去相同的方式消費金錢。


