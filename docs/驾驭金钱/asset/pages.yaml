- pgno: 56
  md: '# ## 現代的賺錢方法比以前更簡單


    放下「賺錢很難」的錯覺。請你想像自己是位活在二十一世紀的宅男女。你隨時隨地都能上網，使用父母的桌上型電腦、筆電或者 IPad，登入他們的 payPal 帳號，賣掉他們的物品，而且無須繳納任何手續費。收到貨款之後，轉到
    payPal 帳號，再匯到自己的銀行帳號，就可以用這筆錢買東西、儲蓄或者投資。


    倘若你希望進行群眾募資，或者使用哈格瑞維斯・蘭斯頓（Hargreaves Lansdown，英國的投資網站平臺）的應用程式，也都可以從網絡上完成一切手續。你甚至能夠在募資創業網站上獲得創業基金，無須割讓任何股份。


    不消五分鐘，你就能在網絡上設立任何企業，只要先登記免費的網絡帳號，無須預支任何費用或負擔長期的房屋租金，不必準備庫存或承擔資本貶值，甚至不需要管理員工或支付薪水，也或員工請病假等問題。


    隨後，你就能夠設立免費的社群網絡帳號，例如領英公司（LinkedIn）、YouTube、Instagram、臉書、推特、WhatsApp、Pinterest，再用
    IPad 拍攝影片，立刻享受高速光纖網絡的便利，觸及數千名、甚至數百萬名的客戶。一年三百六十五天的每分鐘，你都可以世界各地的任何角落，實現上述計畫。


    所以，為何這麼多人拚命賺錢？甚至鎮日擔憂金錢，為之感到罪惡和嫉妒，只能勉'
