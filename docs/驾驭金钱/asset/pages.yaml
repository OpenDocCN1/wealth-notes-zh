- pgno: 296
  md: '感激你收到的服務，感謝自己有足夠的經濟能力消費，正面的情緒也會提升你的人際關係財富。如果你不喜歡將財富送到這個世界，這個世界也不會喜歡將財富交給你。


    第一世界大多數的窮人都以為金錢交易的重點是「獲利」和「損失」，但真正的關鍵其實是「促進錢的流動」。


    如果連你都看不起你自己，也不自我感恩，還有誰會這麼做呢？倘若你不感謝自己擁有的一切，不好好欣賞自己，其他人也不會樂於與你合作，財富也不會以你想要的方式到你手上。


    你值得過得富裕且幸福，而懂得感激會讓你明白自己真的值得。


    欣賞自我價值的良好方法，就是在日常生活中練習感激他人。每一天反覆練習，讓自己在任何時刻，用自然的方法表達感激，例如孩子可愛地抓住你的大腿，咖啡發揮提神效果，看見陌生人的微笑，或者排隊的人禮讓你，不分大小事。


    常常練習表達感激，最後就會成為促進財富的習慣。每天晚上睡覺前，仔細列出內心感激的一切。這個習慣甚至有三倍的週邊效益，包括訓練你的潛意識、改善睡眠品質，以及讓你更快入睡。


    在日常生活在，竭盡所能感謝他人。你因為哪些原因而感謝別人，就會吸引那些原因。釋放感激的能量，感受能量的回應，以及金錢價值的增加。'
