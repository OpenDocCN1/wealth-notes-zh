  md: '# 提升自己的金錢極限


    每個人的賺錢能力都有極限。因此，無論一個人的自我淨值為何，他的價值也有極限。具體而言，就像每個人的顧問費、每小時的工資、薪水、年收入、藝術創作費用（無論是具體產品或藝術服務），或者被動收入的總和。


    金錢極限是指個人賺錢能力的最高點，可能是美金、英鎊、歐元等等貨幣，也是自我價值認知的高點。


    然而，最高點與自我價值觀有關，也會限制我們的收入。我們的內心會產生許多想法，認為自己不該提升薪資費用，才會形成極限，限制自己的能力水準。讀者融会贯通本書迄今談到的內容，加上第四十三章的定價和價值策略，準確提升金錢極限和定價，才能迎接財富和金錢的洪流。


