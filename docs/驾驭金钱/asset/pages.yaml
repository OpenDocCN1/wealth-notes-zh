  md: '# 第四十八章 買得起法拉利的人在想什麼？


    二〇〇五年的羅伯會在半夜驚醒，把德式重金屬音樂關掉，穿上帽T，騎著腳踏車到加油站打工以求溫飽，當時的羅伯對人生感到絕望。


    未來的羅伯開著一輛紅色法拉利來到加油站，用最好的燃油來給那頭紅色野獸加油。他花了十五分鐘和四千多英鎊來加油。此時二〇〇五年的羅伯卻滿心痛苦。


    小羅伯熱愛義大利超跑，從小就夢想擁有一輛法拉利。這是他最愛的款式和顏色，但開這種車的人一定是個討厭鬼。看看他那身西裝，那輛車一定是騙來的，或是用販毒的錢租來的。


    正當小羅伯考慮要不要跟車主說話，還是回去繼續幻想時，老羅伯看到這一幕便笑了。


    小羅伯走過來對老羅伯說：「這車不錯嘛，老兄。」'
  merge: -1
  img_proc: true
- pgno: 476
  md: '老羅伯謙卑地說：「謝謝。」


    他們得好好聊聊才行，畢竟他們童年時期都夢想擁有一輛嶄新的法拉利，但只有一人得到。小羅伯還在找尋落腳處，而老羅伯才剛剛搬進裝潢好的房子。趁著加油的空檔，老羅伯跟小羅伯要了名片，他們握手致意後，小羅伯便回去繼續賣命賺錢了。


    小羅伯心想：「那人沒像我想得那麼討厭嘛！就算他是個討厭鬼好了，如果他能賞識我的創作，我應該也會喜歡他。也許他也認識很多有錢人？」


    老羅伯開著他的法拉利，往媒體大樓那裡駛去。


    誰知道這場相遇日後會變成如何呢？也許老羅伯會請小羅伯替他量身打造一些藝術品，也或許老羅伯成為小羅伯的心靈導師，改變了他的一生？


    也許小羅伯成了有錢人，把藝術當成興趣，還創辦了學校或機構什麼的，幫助其他對藝術有興趣的莘莘學子和創業家？也許二〇〇五年的羅伯成了未來的羅伯？


    你如何界定某人是是是有錢人？用刻板印象可以正確評價他人嗎？是看他們開什麼車？還是看他們賺不賺得到一百萬英鎊，又或是身價數百萬英鎊？也許這在未來根本不是什麼了不起的數字。


    其他人定義的「有錢」，在我眼中則是「富足」。這些人都以自身的獨特才能為榮，也都奮力與自己的恐懼搏鬥，並且把挑戰視作他們進步的驅力。


    他們都是創造者，服務成千上萬的人類。他們對錢的態度都很健康，也都對慈善事'
