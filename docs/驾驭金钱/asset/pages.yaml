  md: '第二個步驟最困難，而第五個步驟可以創造最多金錢收益。全世界的人都在抱怨問題或需求，創新家則捲起袖子，實現《金錢》哲學的槓桿效果，開始面對挑戰（第二步）。因為他們知道，只要完成第五個步驟，就會取得偉大的成就和收入。


