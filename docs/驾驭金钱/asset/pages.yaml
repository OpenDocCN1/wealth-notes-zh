- pgno: 212
  md: '大的改變，同時讓我們得到精密的評估指標，確保自己的方向正確。本章的內容，是濃縮我在另一本書《生活槓桿》中用大量提及的觀念，並且專注探討系統和金錢的關連。

    如果你希望閱讀完整的內容，想要在生活的其他領域善用MBA系統，讀完本書後，請記得回頭購買《生活槓桿》，作為自我投資的禮物。


    # 願景（Vision）


    所謂的願景，就是清楚知道自己的生活目標。願景會在你生命告終後留下不朽的傳承，也藏在你在世每一天。

    你的願景鼓舞著你的生活，讓你能夠充分展現自我價值。願景就是你的生命地圖。當你覺得困惑時，它會指引你穿過每一個十字路口、艱困的選擇、挫折、分歧，以及變動不安的時刻。一個人的願景，就是他在生活中實現的目標。

    願景能夠創造浩瀚的財富，也會成為你追求財富的動力。

    歷史中最富裕的人，通常都會留下不朽的傳承，這些傳承是宏觀願景所產生的自然結果。

    傳承和願景是良好的搭檔，可以驅策彼此，讓你獲得無窮無盡的永續財富。提升祝'
  merge: -1
  img_proc: true
- pgno: 213
  md: '野的高度，想要完成比自己更偉大的目標，不再侷限地方或個人視野，進而關懷全國或全世界。這個宏願足以推動你的一切，並吸引他人的支持，創造遠比人類生命更長久的傳承。


    # 價值觀（Values）


    價值觀是對人生的概念，也是各個領域最重要的指導原則。價值觀會影響我們對萬物的認知、思考、決策和行動。


    我們藉由價值觀理解這個世界，唯有排出自己對事物的優先順序，才能有效率地處理最重要的生活領域。


    人人都是獨特的，沒有人最重視的價值和另一人完全相同。唯有忠於自我，才能展現最好的一面，在對你而言最重要的領域裡，你會做得比別人更好。尋找自我價值，遵守價值而活，就能解脫你的心靈，獲得源源不絕的靈感。


    想要喚醒蘊藏在內心深處的天才，第一步就是要打開心胸應允自己變得更好，接下來就簡單許多了。因此，你是否願意卸下心房，展現才能？如果是，請參考以下的練習步驟。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '☆健康生活須知：請注意，這個練習會改變你的人生☆


    以下的練習會讓你突然頓悟，獲得清澈的思考力和專注力，協助你珍惜自己的價值，消除所有打擊自信的情緒和幻覺，因為它們對創造財富有害。除此之外，這個練習也會發揮你的直覺，安排行動順序，本能地創造清晰思緒和美好的金錢。請立刻準備就緒，迎接生活的改變和金錢的成長。妥善應用時間，充足且完整執行以下練習步驟。排除一切干擾，專注練習：


    （一）寫下生活中最重要的目標，從最抽象的高階目標和觀念開始，例如「健康」、「家庭」、「財富」、「自由」、「學習」、「成功」、「成長」、「旅遊」或「教育知識」等，直到沒有任何想法，或者寫完所有鼓舞心靈的目標了。


    （二）謹慎評估表單，根據生活最需要改變的程度，重新安排順序（例如將金錢或家庭放在優先位置）。


    為了協助你完成第二個步驟，我提供了一些訣竅：


    +   你最常花費時間或金錢從事哪些活動？


    +   你最希望自己有沒有外部壓力干預之下，從事哪些活動？


    +   你的住家、辦公室或汽車空間中，擺放何種物品？'
  merge: -1
  img_proc: true
- pgno: 215
  md: '你最常思考哪些事物？


    你最知名的特質為何？


    你生活中最成功和最不成功的領域各為何（而你是否喜歡這些結果）？


    在這個練習中，請遵循第一直覺，不必反覆修正，也不要受到「我應該如何思考」、「我應該對其他人說什麼」或「我應該如何思考未來」的影響。誠實面對自己，尊重這個練習過程，不要批評自己，盡情享受。立刻進行上述思考，花時間愛善練習。


    完成理想生活藍圖的練習之後，你會得到一份足以代表自己的清單，就像鏡子一樣，反映出你的生命，也是你的生活指引，你的所有行動都應該遵照這份清單的優先順序。


    請讀者想像一下，如果求學時就有機會完成這份清單，能夠早一點知道自己生命中最在乎的計畫，而且每半年到一年，你都重新思考並調整這份藍圖，該有多好？


    想要實現理想生活，擁有充足的財富，實現清單中的生活價值，就必須善用所有的時間，尋找正確輕鬆的方式。


    然而，你必須經歷一段過程，將無意識的價值，化為有意識的目標，把無形的觀念，化為有形的練習，甚至時時刻刻提醒自己注意新的生活方向。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '想要將無意識的價值轉變為有意識的目標，最好的方法之一，就是在就寢睡醒時閱讀價值清單，只需要兩分鐘，就能夠閱讀三次，並且妥善思考。


    在幾星期之內，你的潛意識和本能都會記住重要的價值，你的行為也會開始轉變，接納實現價值的行為，拒絕阻礙價值的行為。


    人類的意識會在睡眠時休息，但潛意識則不會。白天發生的事件，或者睡前產生的強烈情緒，經常會變成夢境的內容。


    因此，我們在意識中清晰思考的價值，也會進入潛意識。現在，我們可以控制，也有能力重新規劃潛意識的內容。


    閱讀價值清單時，你可以看見自己的熱情和痛苦，渴望實現的職業目標，還有內心嚮往的度假生活，以及受到哪些人事物的啟發，又有哪些目標可以鼓勵自己，這些都會根據你眼前的這張清單而異。


    完成清單之後，你的生活都會發自內心追求清單中的最高價值，迴避最沒有價值的目標，按照清單中的優先順序，處理生活中的各種事宜。


    然而，如果你不喜歡清單的內容，希望改變，只要重新排序即可。將金錢和相關的價值目標移動到更重要的地位，雖然只是一個快速步驟，卻能創造更多財富和幸福。


    你的價值觀確實會改變生活，可能藉由自然有機的方式，例如年紀增長，健康的重要性也會逐漸提高，或者情感強烈的事件，導致顯著的價值轉變（例如，經濟狀況貧困'
  merge: -1
  img_proc: true
- pgno: 217
  md: '而造成情感關係破裂)，也可能是個人刻意的決定。如果你希望在生活裡創造更多金錢，唯有改變價值觀才能帶來最深刻的影响，迅速創造長久維持的財富，因為價值會驅動生活中的種種行爲。


    價值判定通常來自於「置之」，因為我們重視自己尚未完成或取得的目標。如果一個人覺得自己擁有充裕的金錢，就不會認為金錢是重要的價值。


    他們已經填補了「金錢匱乏」，所以其他事物的重要性當然會提高，例如健康、自由或社會責任。這也是減肥的人產生了「溜溜球效應」的主因，因爲他們決心減肥時，體重處於最糟糕的狀況，痛苦也最強烈。只要體重減輕，或是節食成果良好，這種痛苦消失後，他們又會開始大啖冰淇淋了。


    請各位讀者盡情享受練習，發揮內在潛力，專注實現生活價值。你賺錢的速度會超過自己的想像，我非常期待各位讀者的成就。


    每半年至一年之間，重新練習制訂藍圖。我自已會在八月初和十二月初重新練習，這個時間的英國較爲平靜，我才能有足夠的空間仔細思考。


    我重新修正願景、價值、關鍵績效指標、關鍵成果領域、傳承、任務、理想和個人目標，讓自己重新充滿能量，努力經營往後數個月的生活。


    以下是一些很好的問題，請讀者扪心自問，並且註記自己的願景和目標。

    先求有，再求好。只要開始努力，就會逐漸改善，所以不要認爲自己還沒有資格追求更好。'
  merge: -1
  img_proc: true
- pgno: 218
  md: '求偉大的願景，或者用「我不明白」、「這件事情太難」等藉口來推辭。立刻整理腦海中的思緒吧！


    +   • 你的人生究竟想要實現哪些目標？

    • 你的生活願景如何幫助他人，創造不朽的傳承？

    • 為什麼你的願景很重要？

    • 三年、五年、十年、二十五年、五十年之後，你希望自己的人生變得如何？

    • 你希望其他人用何種方式記得你？

    只要仔細思考你人生的最大目標，就能與價值觀產生聯繫。


    如果你希望自己變有錢，但明明財富就不是你最重視的事情，如此一來你的願景和價值觀毫無關連，根本無法實現彼此。因此，請立刻花時間，仔細連結願景和價值觀，妥善修改理想生活藍圖。


    MAKE 讓你按照理想生活藍圖的順序，建立生活的清澈思維、財富和金錢。你只需要依照直覺，隨興生活，就會知道應該在什麼時間從事何種行為，時時刻刻都完成正確的行動。


    然而，我們要如何知道自己的行動正確，足以實現目標？你是否曾經覺得不堪重負、沮喪挫折、難以進步、害怕犯錯、懷疑自己的方向？許多人的起點錯了，他們從最後一個 K（關鍵續效指標）開始。他們付出許多時間和努力，完成無關緊要的工作，希'
  merge: -1
  img_proc: true
- pgno: 219
  md: '望著此，覺得自己非常有生產力，賺更多錢。


    實際上，他們的時薪其實變得更低。主管、前輩和良知都告訴他們要努力、努力、再努力，於是他們加快腳步，栽入錯誤的方向，除了降低賺錢的能力之外，更嚴重傷害自我價值。


    想要檢查自己的進度和生產力是否正確，請從VARKS系統的第一個V（願景）開始。在VARKS系統中，你只需專注高層級的目標，低層級的目標可以簡單就位，也不必付出太多心力。


    # 關鍵成果領域（KRAs）


    想要專注實現自己的終極目標，就必須關心「關鍵成果領域」，也就是所謂的「最高價值領域」。關鍵成果領域，是指列出你人生中三到七個最重要的領域，你必須在此投入最多時間，創造最大的財富、收入、事業和傳承。


    關鍵成果領域需要思考策略，進行具備槓桿效果的工作和功能，例如發展並且維持良好的人際關係、建立美好的事業網絡、訓練領導者、建立經營系統、提升財務、規劃商業策略、董事會，以及持續精進自我教育等等。


    如果你花費太多時間，從事瑣碎的日常生活的正常工作，沒有實際的金錢價值，就無法促'
  merge: -1
  img_proc: true
- pgno: 220
  md: '進關鍵成果領域的發展。講究細節、重視操作流程以及過度實際的工作，通常不屬於關鍵成果領域，只是一般的「工作任務」。如果你覺得不堪重負、困惑或沮喪，可能就是你將時間用於完成其他人的關鍵成果領域。你替他們賺錢，他們非常高興。我想讀者一定明白「辛苦工作」一整天之後毫無成就的感覺。雖然努力付出，卻毫無成就，甚至缺乏金錢。


    每天、每週、每月和每年，你都應該反覆核查自己是否將時間和精力用於關鍵成果領域，確保你的收入價值能極大化，追求夢想，讓生活的步調符合最高價值。


    請立刻檢查行事曆上是否還有其他人提出的「工作任務」和「要求」違反你的關鍵成果領域。如果工作任務符合你本人的關鍵成果領域，立刻完成；倘若不能，就委任他人或直接放棄。請保持堅決的態度。關鍵成果領域讓我們的心智清澈，建立追求最高可能收入的最短途徑，並且持續預防不堪重負和沮喪等心情。由於我們知道自己的方向正確，關鍵成果領域甚至能夠促進腦內啡分泌。進步和動力使我們快樂，建立自我價值與賺錢的能力。


    倘若你已經是主管階級，或者開始聘請員工，請務必建立員工職責的關鍵成果領域。以下是員工常見的抱怨，他們可能因此討厭工作，甚至決定離職：


    +   • 我覺得自己不被賞識。


    • 我缺乏清晰的個人目標與公司發展目標。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   我不認為自己創造了正面的影響。


    +   我的主管不在乎我。


    +   工作要求不切實際。


    +   我必須同時處理太多項工作計畫。


    在上述因素中，至少四項與關鍵成果領域有關（雖然也有人認為全部都與有關）。你的員工和團隊需要清明的思緒，明確知道自己的職位目標與公司的目標相關。他們的責任也應該符合實際的期待，工作内容要有極高的價值，才能具體影響公司發展，並且理解什麼是高優先的重要事項。


    如果他們可以替自己的職業生涯和公司發揮高價值的效能，就會認為自己正在創造正面積極的改變，得到重視和鼓舞，願意用時間替自己和公司取得雙贏。


    聘請員工時，為了團隊和你自身的發展，最該首先要求的工作內容，就是請對方列出關鍵成果領域，不必遵守傳統的「工作任務」和「需求技術」表單。


    用簡單的一句話描述職位之後，立刻列出三到七項關鍵成果領域，才能符合工作要求。


    求的必備條件，也可以明確指引員工，要如何替個人和公司創造最大益處。


    你也應該將關鍵結果領域放在個人目標和願景藍圖的重要位置，僅次於願景和傳承


    之下。'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 收入創造工作 (IGTs)


    對你個人（或你的公司）而言，能賺錢的工作即具備最高的金錢價值，必須與關鍵成果領域有關，也要促進關鍵成果領域的績效表現。


    收入創造工作發揮槓桿效果，實現最好的個人財務結果，每小時的收益也會因此最大化。收入創造工作就是實現最佳槓桿效果的任務，在最佳時間之內，使用最少的資源，創造最大利潤。你完成愈多收入創造工作，就可以用愈少時間，得到愈多收益。


    如果待辦事項使你覺得不堪重負、思緒混亂和沮喪，主因就是並未專注於收入創造工作，並且犯了「將時間平等分配給所有工作」或「並未優先進行收入創造工作」的錯誤。


    請切記，並非所有的工作任務都是等價的。


    在高爾夫球場上，職業球員有四十％的時間，只會用七・一四％的推杆技巧。因此，將時間用於練習推杆，能夠用最短時間，實現最好的槓桿效果，立刻改善高爾夫球員的成績。同理可證，將收入創造工作視為最重要的任務，可以在最短的時間，創造最大利潤，讓你得到更多空閒時間，進行更多收入創造工作，或者從事自己熱愛的「非工作」計畫。


    我會在本書稍後的內容，教導讀者如何用金錢的角度思考自己目前的收入創造工作，進而發現哪些任務是可以轉為「非工作」的，哪些任務是可以外包給他人完成的。'
  merge: -1
  img_proc: true
- pgno: 223
  md: '作。除此之外，我也會討論一個簡單的演算法，讓你可以立刻獲得將近十六倍的收入。然而，讀者記得，如果你並未妥善利用時間進行收入創造工作，你的時間就會自動用在低優先的瑣碎事項，或者處理其他人的優先工作，而他們就是利用你的時間，發揮槓桿效果，替他們賺錢。


    # 關鍵績效指標（KPIs）


    「關鍵績效指標」是非常重要的觀念，可以客觀評估你的事業、企業或個人目標，督促你追求進步，減少失誤，並且提升效率。


    如果你無法客觀評估某個事物，就不能成為箇中好手。關鍵績效指標是重要的資料數據，讓你盡可能立刻明白目前局勢，或者理解事業失敗的原因。隨著個人事業規模提升，你可能會將管理職權交給專業人士，退居幕後或者專注思考事業策略，此時關鍵績效指標就會變得更為重要。


    太晚設定關鍵績效指標，或者根本沒有關鍵績效指標，導致並未投入時間進行更為緊急關鍵的工作，都是常見的錯誤。然而，這種錯誤非常不應該，就有一個人說他太忙了，所以忘了吃飯；太忙了，所以沒有時間學習；太忙了，所以忘了將支票帶到銀行兌現。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '關鍵績效指標提供即時回應，評估關鍵成果領域和收入創造工作，讓你知道自己的計畫有沒有成功創造收入，進而促進關鍵成果領域的表現。


    藉由關鍵績效指標提供的反饋，你可以測試、修訂或改變關鍵成果領域和收入創造工作。一個人無法理解他不明白的道理，因此，缺乏關鍵績效指標，很有可能導致錯誤，損失金錢，努力工作卻毫無進展。


    請讀者想像一下，如果你任職於銷售公司，沒有任何評估方法或績效指標。你努力賣出許多商品，完全不知道自己其實失去了許多利潤，這一定會造成非常嚴重的自我挫敗，因為你做了這麼多，卻徒勞無功。但是，許多的小企業都沒有足夠的關鍵績效指標。九成的新創企業會在第一年失敗，八成的新創企業會在三年之內倒閉，就是因為缺乏關鍵績效指標。


    從現在開始，謹慎建立個人和企業的關鍵績效指標，特別是與收入相關的指標。從腦海最先浮現的指標開始，設立經常查核的關鍵，包括評估銷售額度、行銷結果、財務情況的標準，並且建構完整的評估系統，用更少的時間處理更少的操作業務，達成更好的結果。


    # ・發展個人關鍵績效指標


    為了更進一步發展關鍵績效指標，我提供了一些練習方法：'
  merge: -1
  img_proc: true
- pgno: 225
  md: '讀者可以向其他企業主請教，他們也經歷過相同的階段，處理你現在正在面對，或者即將遭遇的各種問題，你能夠藉此想出更多有用的關鍵績效指標。請教他們如何評估自己的事業。倘若你向團隊成員和顧客提出正確的問題，也能夠得到正確的答案。〝我們的阻礙是什麼？〞、〝他們缺乏了何種關鍵資訊？〞、〝你應該立刻開始進行什麼、停止什麼，又該保持什麼？〞在自己的生活和事業發展中，竭盡所能解決上述問題，找出正確的指標，避免問題再度發生。仔細閱讀並且思考現有的績效指標，建立更好的新指標。如果現有的關鍵績效指標失效，代表你需要創造更好的關鍵績效指標，找到有價值的數據資料，例如員工士氣低落、健康狀況不佳或者工作出勤狀況等問題，或者員工流動率過高，離職員工數量超過遭到開除或退休者。所有問題的答案，都藏在你的眼前。


    +   （一）閱讀關鍵資料和商業成長的書籍。

    （二）詢問規模更大的企業主如何評估自己的事業。

    （三）分析個人事業問題，尋找解決問題的方法。

    （四）分析現有關鍵績效指標。

    （五）調查團隊成員和顧客意見。'
  merge: -1
  img_proc: true
