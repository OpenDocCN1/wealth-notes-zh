  md: 'Influence公司 的環境下。當時馬瑟羅想知道，如何和化妝品公司做生意，而尼爾對這領域則知識豐富。當時，他們兩個並沒有可以立刻合作的方式，但尼爾提供非常多的協助，也對馬瑟羅的點子讚賞有加。尼爾在當時根本不知道這個點子，但他願意提供協助，這也成為他進入一次神奇投資經驗的門票。根據這次初步的互動，馬瑟羅提供尼爾機會，成為ipsy的第一次投資人。想像一下，如果我把馬瑟羅介紹給尼爾時，尼爾根本懶得回應。這將會是一次多麼大的錯誤決定啊。


