  md: 一個永遠連線的社會中的精神官能症，很早以前就出現的字眼。那時根本還沒有社群媒體，但還是有很多因素，造成大家的不安全感。我同學和我才剛經歷過達康泡沫，以及九一一恐佈攻擊事件。我們全部的人都有點心靈創傷，所以我們在潛意識中決定，不管是否喜歡，一定要盡情活出每一分鐘。
    整件事件的源頭其實是 FOBO，也就是「更好選擇的恐懼」（Fear of a Better Option）。這是我自己想出來的一個詞，用來解釋我在學校認識的每一個人，一直在尋找更好的東西現象。我們對好還不滿意，我們還要卓越。你和任何人講話的時候，對方的眼神永遠在掃視整個房間，想找到下一個談話的對象。我們關心的是選擇的價值，通常也只為了選擇的價值，這現實在令人無法忍受。我們不想投入任何一件事，以免更好的機會出現。
    錯過的恐懼基本上是相反的極端。我們太害怕錯過任何有趣或獨特的經驗，以至於我們對每件事情都抱著接受的態度。這就是為什麼也許你應該待在家裡，但結果卻約了兩件或三件事。
    錯過的恐懼和更好選擇的恐懼，是無法協調的相反力量，就像陰與陽的對立，而且會把一個人逼到一種我稱為 FODA 的癱瘓狀態，也就是「做任何事的恐懼」（Fear
    of Doing Anything）。這是一種追求最佳方案而不行動的心態所導致的行為癱瘓。當你第一次嘗試新事物。
  merge: -1
