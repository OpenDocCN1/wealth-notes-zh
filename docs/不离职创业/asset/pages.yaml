  md: 夜十二點之後發郵件。在我們其他懶蟲都呼呼大睡時，他竟然願意工作到那麼晚，讓我們一票老闆們印像深刻。我對他驚人的工作態度深感敬畏，直到多年後的有―天，我才知道，原來他是有預設電子郵件在晚上隨機發送的習慣。我這才了解，原來他是個「虛擬」露臉的高手。你可能會猜，派翠克一定不常露臉。其實他在從事顧問工作時，會提供更有價值的服務，務，因此他的同事沒有人會質疑他投入的時間；但因為實在有很多人事要做，他還是要浪費很多時間出現在辦公室。根據工作屬性，企業也許會非常願意根據工作成果，而不是工作時間付員工報酬。既然在深夜或週末回電子郵件時，也不會有加班費，所以為什麼不在每天的工作時間中，為兼差計畫找出更多時間？這就是本書提到的很非
