  md: '不回覆或浪費他們的時間，那就是你的錯。說回來，在篩選的時候，你會學到所有類型的業務，也會見到川流不息的人，只要他們更了解你的條件，他們也會帶給你更多的案子。所以以當你沒有花很多時間在細節上就跳過很多你看的案子時，你的視野和人脈也會自然擴展。

