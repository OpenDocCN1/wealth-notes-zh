  md: '# 建立團隊


    # 兼差計畫：練習 6


    建立一個可以幫助你，並加入你的團隊的所有人的資料庫。為了做出這個 人脈資料庫，可以運用以下 的資源：

    · 你的家人與朋友


    的一部分而己。如果 你準備好做這樣的嘗試，你就有機會每天用上你的自我行銷說詞。不管 你是在一場晚宴聚會中，或是孩子的足球比賽場上，或是和老同事聚會，你都可以與人
    建立 關係，他們可能正好可以幫上你的忙。另外，你也可以讓自己省下閒聊天的功夫，直接 談 些實質的話題。你甚至可能 會種下一些種子。'
