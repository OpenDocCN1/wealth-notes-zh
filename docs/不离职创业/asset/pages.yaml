- pgno: 220
  md: '# 利用網路建立信用


    問我，他能為我做什麼以做為回報。他似乎很自然就理解到，和我或和我人脈圈中的人合作，是是一種互利互惠關係，不管是天使投資人、顧問或只是志同道合的團體中的某個人，所以以我很快就會推薦他。我在這樣做的時候，不只是幫助了一個有才能的工程師，也是為我投資組合中的公司增加價值，並強化了我與夥伴和公司團隊的關係。


    你不會只穿著內衣就跑去參加社交活動，所以你也必須確認關於線上的社交活動，也要有適當的裝備。藉由加強你的線上信用，更可能提升有意義的連結。至少至少，這表示你在領英的個人檔案要包含所所有的證照。你的領英檔案要以你過去完成的工作做為基礎，以形成你自傳，內容要協調一致，並提供個人經驗與志向的脈絡說明。讓過去的成就就說明一切，是非常明智的事。基於某些理由，人們似乎樂於沉浸在網路上大量的誇張資訊中。但如果你是比爾．蓋茲（Bill
    Gates）或歐普拉（Oprah），說自己是「有遠見的企業家」（這是大 家最喜歡的說法）並無不妥，但對其他九九．九九％的人來說，這種說法就太誇張了。因此最好'
  merge: -1
  img_proc: true
- pgno: 221
  md: '讓你的經驗與自傳說明事實就好。如果寫得正確，別人會更認真地對待你，而你想傳遞的訊息也會順利送出去。

    如果ต์計畫推出一個強勢品牌，做為你的兼差事業，就可以更進一步，在網路中切出一

    個屬於你的角落。一般人通常會對網路上看到的訊息信以為真，所以如果你在某個特定領域

    能加強信用，會更有效果。目標很簡單：任何人只要Google一下你的名字，你就會出現，

    並且是在某個領域的權威。這就是所謂的谷歌檢驗。不管你是從部落格開始、為專業刊物

    寫文章、發特短信、在研討會上演講，甚至在電視上出現，所有的活動都會建立信用，強

    化你的個人品牌，也能說服其他人，和你見面是值得花時間。

    我在實際嘗試之前，一直很懷疑這個做法。我以前三不五時Google自己的名字時

    （承認吧，你也會這樣做），我會找到有關雀巢普瑞納（Nestlé Purina）前執行長派翠克·麥金尼斯（Patrick McGinnis）各式各樣的資料，卻很少有我個人的資料。我決定讓自己的名字成為名片中最重要的品牌之後，我也決定要更新我在網路上出現的形象。我的第一步就是寫個人部落格。我開始寫我有強項的主題，然後寄出幾篇文章給赫芬頓郵報（Huffington
    Post）。這算是 zin次陌生活銷的行為了，對方後來也邀我為他們寫稿。我也用免費的線上工具，用自傳設立了一個網站，並開始為其他線上刊物寫和我興趣相關的文章。從那之後，只要我'
