    創業大致力上就像是一種耐心運動。當你成立一家新公司、募集資金，並試著找到第一批顧客，你會越來越習慣聽到這個字：「不」。你也會很習慣面對你視而不見、不記得你或很難搞定的人。大家都很忙，如果你在別人的優先順位中，別人當然會不見人影。如果你是天使投資人，你的角色會坐在桌子的另一邊。你會看到很多公司，其中有些公司只有半生不熟的想法、構想拙劣的商業計畫，或平庸的經營團隊。在這個每個人都會做
    Powerpoint 簡報的時代，你會很驚訝地發現，進入你收件匣的投資機會中，只有很少百分比的數量，確


    需要做些犧牲。不管你多麼熱愛工作中的每一分鐘，你的另一半或孩子可能無法像你一樣。你的生活<|message|>中要處理更多事，也會花更多時間與精神在你的公司。如果你能找到方法，讓你所愛的人加入你的兼差事業，那麽工作時間就會有更多的價值。亞歷山大與譚妮雅合夥成立
    Bunny，如果他們在不同的新創事業工作，相處的時間就會更少。另外，買許·紐頓和他的妻子麗莎，決定成立一家數位經紀公司，一起快樂工作之餘，還能打造一家真正
    的公司。'
