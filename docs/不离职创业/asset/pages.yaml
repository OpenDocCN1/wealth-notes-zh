  md: 兼職創業家永遠不會非常確定，要在每一個機會投入多少。我喜歡把每個投資案想成是一顆種子。有些種子不會發芽，有些種子會活下來，並且長得很旺盛，有些種子還會產生新的種子，並隨風吹散，落到你沒有預期的地方，然後生根。一段時間之後，你就可以跟著這些種子，和一群從先前的嘗試中認識與信任的夥伴，參與一個又一個新事業。你也可能會發現新的自己，並在這一路上建立財務與專業的自主性。有一天早上醒來，你可能會發現，歷經這些新事業的歷練之後，你已經完全脫胎換骨，變成不一樣的人了。
