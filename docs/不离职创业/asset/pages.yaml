  md: '你感嘆「為什麼全世界的人都在休假，只有我要上班」的人？其實他們可能不是在休假，他們是新時代的移動工作者。不論是坐在倫敦、首爾或開普敦的任何一家咖啡館裡，只要一連上網路，就可以開工。只要你真的開始營運，由於分享經濟，你可以控制成本，並能保持敏捷。如
    果你決定設一個辦公室，可以找像 WeWork③這樣的公司，他們可以在全球各地為你提供你需要的辦公空間。人力方面也同樣越來越有彈性，可以因應需求隨時提供。由於有像
    Bunny 的亞歷山大和譚妮亞這樣的 人，以及像 Upwork 這樣的線上工作平臺²，你可以和全球各地的自由工作者合作，架設網站、設計企業識別、擬訂藍圖或者錄製廣播廣告。這些流行趨勢都是你的好朋友，為你創造了一個環境，讓兼職創業變得更為可行，讓你得以打造更適合自己生活的創業模式。在下一章你將會讀到，就像創業不是只有一種固定的模式，兼職創業家也不會只有一種固定的模式。根據自己的背景和興趣，你可以貢獻不同的資源，可能是在時間，也可能是金錢，以這些資源換取機會，以得到這一章裡所提到的部分或全部的利益。這些就是你要成為兼職創業家的原
    因。為了實現不同的目標，你也可以不只選擇一條路。


