  md: '# 針對明確的問題，找到明確的答案


    人脈的力量，不會在招募一群團隊成員之後就停止發揮作用。人脈的力量還會延伸到盡...職調查，也會讓你的事業更成功。對於你已經知道的事，你要有信心；對於不知道的事，則要謹慎。不要害怕問題，因為沒問出口的問題，通常就是造成良好決策與錯誤決策的關鍵。所有的事實都是好的，數據也會勝過自我，所以你要找的不是別人的肯定，你的目標是評估值得你投入時間與資源的各種機會，然後你要決定如何把這些機會整合成到你的生活與職業生涯中。遇到還沒有解答的問題時，你就要運用和找專業人士建立團隊一樣的策略。在這個階段，你要為明確的問題找到明確的答案。你必須找到在某個領域比你有更多專


    的活動更了解之後，也可以增加明確的細節。這些資訊可以包括專業領域、活動地點或產業重點。如果你在生活中的其他場合遇到新的人，或是為了兼差事業透過陌生接觸連絡到某個人，也把他們加進你的資料庫，並寫一下你可能會有合作的方式，並標記任何要後續追蹤的事項。'
  merge: -1
  img_proc: true
- pgno: 218
  md: '業知識的人，並要能夠用到他們的智慧資本。你要運用自己的商業判斷來蒐集資訊，並評估你的研究發現，但你還需要比你有更好立場做決定的人的意見。例如：如果你想了解曼哈頓的海鮮市場，就應該去找路克·霍爾談談；如果你想知道投資客怎麼看房地產業，那就應該找像法拉·罕這樣背景的人。這些主題都是無法得知的資訊，但在你進行盡職調查時，你需要找到能提供你資訊、建議與觀點的人。

    在盡職調查時，你可以運用人脈圈中所有人 的智慧資本與知識。現在你已經組建了自己的團隊，你就要運用所 有專家的集體智慧，因為他們擁有你所沒有的洞見與技能。和專家進行一次良好的電話或咖啡會談，就能幫你省下時間、指引正確的方向，或讓你遠  掉麻煩。你學到的每一件事，都能幫助你問正確的問題，徹底思考某個機會的商業原理，在這個過程中，也能讓你擁有需要的工具，對市場、產品與成功的前景，有更好的理解。當然你是要謹慎發展出自己的意見，維持健康的懷
    疑態度，避免成為盲從的羊羔。總之，在這些對談下來，你一定會變得更聰明。

    既然你已經正式參與一家公司，不管是當顧問、天使投資人或創辦人，你都需要找到未 來可以幫助你、擁有特殊才 能的人。現在你已經成為一家新公司的夥伴，真正的 工作才正要開始，當你在找某些特定的知識或技能時，知道要打電話給誰，真的非常重要。甚至你在建'
  merge: -1
  img_proc: true
- pgno: 219
  md: 立一個蒐集案例源和盡職調查的團隊時，也可以從相同的團隊中找到有相關才能的人，他也許可以以全職、兼差或彈性的參與方式，加入你的事業團隊。經營事業需要各式各樣的協助，在特定時間內，知道要去哪裡找對的人，就是一項很Invaluable的資源。這可能包括知道特約工
    作 者、退休或半退休人士、在家 的爸爸或媽媽、學生，或正在換工作或找工作的人。這些人 可能就是實際捲起袖子做事、讓你的投資更成功的人。對於想要控制成本的新公司，這些人
    也是非常有價值的人力資源。如果 你手上有一群身懷特殊技術的特種部隊，你一定會成為各 界爭取的熱門對象。 幾年前，我在一個社交場合認識湯瑪斯·卡雷（Thomas
    Quarre），他是手機介面與產業品 程師。他在自 我介紹時我才發現，我以前從來沒有認識過任何設計手機關用程式的人，我們當天的對話也一直留在我的腦海中。他後來和我持續保持連繫，每幾個
    月就會連絡一下，而 且 總是會問我是 否有他可以協助的地方。後來有個朋友問我，是否認識專精於介面設計的人，我就知道要打電話給誰了。當時我甚至無法評論湯瑪斯的工作，所以我建議他們兩人直接碰面，以評估他的工作履歷，並看
    看 雙方是否投緣。雙 方談得很愉快，於是就合作了。幾個月後，又有人問我類似的問題，我又推薦了湯瑪斯一次，但這一次是基於他對我朋友公司的貢獻。從那之後，湯瑪斯已經和我人脈圈中的幾個朋友合作。我很感謝他從沒忘記
