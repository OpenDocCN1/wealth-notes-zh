    然單單依賴谷歌一定不夠，但值得一試。 找對的夥伴需要耐心，但結果絕對截然不同。路克·霍爾登知道，他在維持日常工作時，需要別人協助才能開店與經營店面。就像任何網路世代的人，他去
    Craigslist 找人，也貼了 一張廣告。然後他仔細看過一疊約六百個人的履歷表，並認真考慮了十個應徵者，直到他見 到班·康尼夫。班本身有待在食品業的背景，而且從第一天就對路克龍蝦很有熱情。他們兩
    人都很信心，但即使在他們最狂野的夢想裡，也料想不到他們一起工作竟然會如此成功。 不管你是多麼聰明或才華洋溢的天使投資人或創辦人，你永遠不會有達成目標需要的所
    有資源。你必須找到方法，解決知識與技能的落差。你的夥伴代表對未來的投資，經過一段 時間之後，當你建立了風評以及一連串的人際關係，公司中有關鍵人的部分，就會變得更容易
    了。一旦你有一群可信任的夥伴，他們就會成為新點子與新機會的消失來源。他們會成為你 的機器的一部分，也會協助你讓每一件事都運作得更順暢。每當我想到我自己的兼差事業，
