  md: '人之一。他dfrac《巧克力雨》（Chocolate Rain）影片，瀏覽人次超過一億，其中至少有二十次可以追蹤到我的電腦IP位址。

    我是因為前同事馬瑟羅·坎伯羅斯（Marcelo Camberos）的邀請，才飛去奧蘭多一趟。他剛成立了一家叫做Real Influence的公司，和Youtube名人一起和消費品牌合夥。那時是二〇一一年，還是Youtube明星的黑暗時代。這個點子還在萌芽期，馬瑟羅算是先驅者。他需要有業務開發經驗的人手，所以他提供給我顧問的角色，
    exchanged條件是會給我某些股權，以及由我開發的銷售佣金。因為我從來沒有從創業一開始就參與的經驗，所以我知道，除了有點樂趣，而且可以和老朋友再續前緣之外，至少還可以學點新東西。

    馬瑟羅提供的第一個兼差事務，讓我正式成為兼職創業家，也讓我盡情發揮了自己的才能。馬瑟羅曾經在線上娛樂先驅「不搞笑，毋寧死」（Funny or Die）網站工作過，和影片有關的事，他就是專家。另外，他也教我如何向潛在客戶推銷這個新的行銷管道。我之前從沒賣過東西，但忽然之間，我就面對面和帝亞吉歐（Diageo）與雅詩蘭黛（Estée
    Lauder）等嚴肅的大公司坐在一起。我們會因為被拒絕而沮喪，也會因為被忽視而生氣，但我們努力完成了一些案子。但這個點子還是太超前了，馬瑟羅後來決定，把精力轉到他和一個Youtube新明星一起成立的事業。我把因擔任顧問而擁有的股票賣回給公司，相對於我的投資'
