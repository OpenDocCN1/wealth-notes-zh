  md: "一個人的事業成敗與否，取決於他是否能在公司裡一路晉升；如今能否升遷，已不再是個人成就的指標，那已經是過去式了。當全球經濟在一個又一個的金融危機裡震盪起伏，變化如此惱人卻又如此頻繁，很少人會期盼自己能在一家公司裡待得夠久，久到能領退休時公司送的金錶。除了景氣循環，還有公司合併、境外外包（Offshoring）②、業務外包、公司裁員瘦身等種種變化，都持續地重塑現今職場的面貌，因此要為未來計畫也變得越來越不可能，因為計畫總是趕不上變化。根據美國勞工局的統計報告顯示，戰後嬰兒潮的這一代，在年齡介於二十二至四十四歲之間的時候，平均每人每三·五年就會換一份工作1。這個趨勢看來還在加速發展。九一％的千禧世代（millennials）③對自己的期許，是在同一份工作上，最多不\
