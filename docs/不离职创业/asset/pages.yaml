- pgno: 59
  md: '# 打造更穩固、更有創業精神的職業生涯


    表面上，投入現職以外的事業，是以自身利益為依據。你是在運用自己的技能、人脈和知識，其中有 一部分還是來自你的全職工作，目的是為自己創造更多的機會。同時藉由接受


    隨便問任何一個家長，他們都會告訴你，他們希望自己的小孩多才多藝，具備多方面的才能。但為何自身作為成人的我們，為何卻自己放棄了這個原則？你很喜歡自己動手做家具嗎？或者你總是利日週末到處攝影拍照？還是你很熱衷於室內設計？如果不必考慮金錢，你可能會以興趣做為工作的原則，但你一定也意識到了，如果在財務上無法獨立，就必須面對沉重的取捨問題。兩相權衡之下，通常安全感會戰勝熱情，這是人類的天性使然，因為很少人會願意犧牲財務和個人生活品質，只為了追求自己熱愛的興趣。但這並不代表你得完全放棄。與其蜻蜓點水式地東做一點，西學一下，或是把興趣完全擱置一邊，直到退休，你還有另一個選擇，那就是走兼職創業這條路，既可以結合個人興趣，還可以讓你以有意義、專業、能賺到錢的方式完成這件事。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '這個挑戰，聚焦在自己身上，你也因此可以培養、深化相關的技能和人脈，並鍛鍊出一身武藝，讓你在辦公室的表現更有能。

    幾乎所有的公司都在想方法推動內部創業。在這個變動快速的年代，企業界求才若渴，期待以創新的思考和領導，引領公司進入下一階段的成長。不論你是密西根一家小型工廠的廠長，還是高盛集團（Goldman
    Sachs）合夥人，這些能力都極為重要。大部分的公司只在企業內部，試圖教導員工這些能力。但事實上，不管你在公司內部上了多少課程，受了多少訓練，唯一能讓你像個創業家一樣思考的方法，就是自己去創業。

    如果不想停留在紙上談兵的階段，企業就必須找到更好的方法。在公司內部培養一種鼓勵創業的文化。有些企業，而且不乏看起來保守而傳統的公司，就以積極的方式激勵員工思考，不要受限於本身執行agrams以持續追求創新。就某種程度來說，這也是以兼職創業家的方式，激發員工創意思考，發現新的好點子。我們現在常用的便利貼，就是
    3M 公司聞名的「非正規生產」（bootleging）政策所產生的成果。所謂「非正規生產」政策，就是鼓勵員工運用最高可達一五％的上班時間，研發自己的構想。更近期一點的例子，是谷歌率先推出聞名的「七〇一二〇一〇」模式，要求員工分配一定比例的工作時間，參與自己核心業務之外的計畫。這兩家企業只是個例子，還有其他許多企業持續激勵旗下員工，釋放內'
