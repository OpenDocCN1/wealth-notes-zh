  md: '# 5

    文件化


    沒有必要把橋燒掉，對吧。不管你是否成為合夥人，你都希望讓每一個潛在的夥伴，對你的智慧與操守留下良好的印象。你可以很快地做決定，然後和他們保持連繫。千萬不要欺騙別人


    人，讓別人空等，他們很努力在成立公司，你必須尊重他們的時間。另外，及時行動，也能把你的產能與資源空下來，進行下一個機會的評估。


    聰明的商務人士一向會把事情文件化，白紙黑字寫清楚，只要你決定要進行下去，就進入文件化的階段。根據你的角色會有特定的文件需求：


    +   1. 如果你是天使投資人，你要簽的是買公司股票的合約。

    2. 如果你是顧問，你要與對方協商並簽一份顧問協議，協議中會有基本的投入要求，以交換公司的股票。

    3. 如果你是創辦人，你要把你和投資人與合夥人的協議全部形成文字紀錄。

    4. 如果你是業餘創業家或雙重創業家，就要根據你的參與程度，遵循天使投資人、顧'
