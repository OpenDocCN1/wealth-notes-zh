  md: '仍然要花點時間。探索新事業最難的部分，在於當你與來自非常知名的機構代表見面時，很容易覺得自己完全無法招架。你當然已經有自己的經驗與人脈，但當你置身於未知領域，而
    不是秀出一張印著大公司品牌的名字片時，很容易會覺得很恐怖。身為兼職創業家，你要不斷對別人自我行銷，告訴他們你能提出什麼貢獻，根據你過去的經驗、人際關係以及你的願景，試著建立信任。對很多人來說，花了好幾年銷售某一家公司品牌的產品，並運用公司投資出來的統一形象工作，尤其是大公司之後，要行銷自己實在很不協調。你的語言也會開始不一樣。你不再用「我們公司」或「我們」來當開頭，你現在說的句子開頭都要改成「我」。

    當你習慣於公司的信譽、舒適的辦公室、長久又有歷史的品牌時，沒有這一切的時候，可能會讓你覺得沒有安全感。事實上，當你第一次開始這樣做，覺得自己像個冒牌貨，完全是很自然的感覺。我就是這樣走過來的。要對剛擁有的自主性覺得自在，需要一些準備工作。當你開始在白天的工作之外進行兼差事業，有更大的不確定性，但你要展開行動，見招拆招，該做什麼就做什麼。你可能會與不受你掌控的外?a元素與事件搏鬥，但不管發生什麼事，最後的責任都會直接落在你的肩頭上。

    除非你已非常強大的自信，否則懷疑坐在桌子對面的人是否會拿你當一回事，完全是自然的心理反應。畢竟你才剛開始起步，你是在推銷一個點子。不管你是天使投資人、顧'
