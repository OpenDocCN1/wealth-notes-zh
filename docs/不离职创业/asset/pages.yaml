  md: '在我的職業生涯中，我已經投資超過二十家公司，也分析過數百家企業。這些企業包括在矽谷的新創公司，以及在美國、拉丁美洲與亞洲營運，規模較大、較有成就的公司。只要說說我這些年自己做的盡職調查就夠了。盡職調查會因為公司類型差異很大，是個很合理的做法，
    但我根據經驗已經知道，其中的標準程序足以令人感到意外。這是個好消息，因為這表示你只要學一次，接下來就能不斷改善。不管一家公司位在哪裡、做什麼業務，或在什麼生
    命週期，盡職調查可以歸結到幾個普遍的問題：


