  md: '金融危機造成的經濟衰退而已。在過去五十年內，華爾街各金融機構的前廳辦公人員、投資銀行家和證券交易員這類專業人才人數，在全球下降了二十％。同時薪資結構的改變，以及金融業的相關監理法規明顯增加，又大大地影響了從業人員的薪資福利。法律及醫藥相關行業的情況，也好不到哪去。二〇一〇年的法學院畢業生，只有四成投入了律師事務所等與法律相關的工作，大約有二成選擇從事無需法律相關學歷的職業。或許這就是為什麼近來有一份調查發現，將近六〇％的現職法律從業人員，都不鼓勵年輕一代進入這個行業。同樣地，只有五四％的現任醫生表示，如果重新來過，仍會選擇從事醫療工作。如果連那些理所當然應該荷包滿滿的產業，都今非昔比了，那麼其他領域的職場情況，又是如何呢？事實上，連下一波的新興行業也一樣，不會再有所謂的鐵飯碗了。既然如此，又何必為此投入好幾年的時間去上學，然後背負鉅額的助學貸款？最優秀和最聰明的人才都步一步往上爬的辦公室工作，他們要的更多。對他們來說，答案只有一個，那就是自己創業。知道，這樣實在太不划算了。他們要的不只是這種坐在小隔間裡，然後埋頭苦幹二十年，一


