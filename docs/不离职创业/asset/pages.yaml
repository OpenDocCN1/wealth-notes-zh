- pgno: 100
  md: '# 不同類型的兼職創業，有不同的資源組合


    顧問而不是天使投資人，可以讓你不必掏錢出來承擔風險，也能參與公司的決策。即使你在某個階段決定要成為天使投資人，還是可以考慮擔任顧問，以增加你在這項投資的利益。這樣做，會讓你的錢更有價值。


    讀到這裡，你可能會以為自己沒有什麼資源，或覺得自己太忙，根本分身乏術，或者沒有可以投資的財務資本。但別因此而氣餒。你可以在接下來的幾章，好好想想你的資源，並讓你的每一項資產發揮出最大的效果。你可以針對自己的特殊條件，為自己量身打造並研擬實務的策略。不過在埋頭研究細節時，也值得用較寬廣的角度好好思考一下，你所擁有的資源會如何影響你的選擇。接下來，你將看到每一種不同型態的兼職創業家，就代表不同的時間、財務與智慧資本的組合。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 如果你想成為天使投資人……


    如果你擔心的是時間問題，因為你平常就很忙，或沒有固定的工作作息，那麼成為天使投資人是一種非常高度彈性的參與形式，也能發揮很大的功效。創業家在理想上會找「聰明的錢」，也就是不只投入現金的投資人，但你實際上的投入程度完全由自己決定。根據你對這個案子的興趣，你可以培養自己和這家公司、這家公司的經營團隊，以及其他投資人的關係。這樣一來，你會有更深入的了解，也會建立更深的人脈關係，這對你的未來很有好處。你也可以藉此創造機會，承擔較正式的角色，或成為顧問，以增加你的有利情勢。不過你寄出支票後所做的每一件事，都是可以選擇的，如果你沒有很多時間可以投入，就不需要這麼做。


    如果你想成為天使投資人，但不確定從何著手，別擔心，你可以和别人一樣，提供自己 的智慧資本。不管你是住在美國的邁阿密、羅馬尼亞的布加勒斯特或中國的北京，你稍後也可以看到，你可以找到其他想要投資與合作的人。在你投資新事業時，加入一個天使投資團體，可以提供你必要的資源與人脈。這會讓你遇到一群志同道合的人，這些人也會提供你一些訣竅。根據天使投資協會（Angel
    Capital Association）的資料顯示，光在美國地區就有超'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 如果你想成為顧問......


    過三百個這樣的團體。歐洲、亞洲與拉丁美洲各地，也有類似的團體。可以找到創業家的地 Wal , 就能找到天使投資人。事實上，距離一般創投公司營運的地方越遠，你的資金與專業就會顯得越重要。


    如果你沒有那麼多資金，但有更多的智慧資本與時間，則可以考慮成為顧問。你投資的是智慧資本，而不是財務資本，你貢獻的是雙方都同意的一定時間，然後這家公司則以股權的方式付給你報酬。在實務上，預期顧問投入的時間，不同公司的差異非常大。有些公司希望顧問能穩定提供建議，一個月出席一個小時或兩個小時。他們會打電話給你，請教你策
    略 略 意見或提 供 人脈，或只是單純的腦力激盪。這就是我和 Bunny 公司的合作方式，我每個 月會花兩個小時和公司的執行長與財務副董見面，並一起決定這個月剩下來的時間，我可以
    用什麼方式協助公司的成長。我花的時間就差不多這樣，但每一次談話結束後，我都會留下 一份應辦事項清單，在下一次見面前，就用電子郵件保持連繫。在這樣的時間投資下，像貝絲·費雷拉這樣經驗豐富的顧問，在同一時間擔任很多家公司的顧問，也是很鬆平常的事，'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 如果你想成為創辦人：...


    如果你想當一家公司的創辦人，你就要有心理準備，你必須投入自己全部的資源。當你成立一家公司，你必須撥出時間研究市場、培養關鍵的人際關係、開發產品，然後推展公司的業務。所有的這一，將會運用到你的人生經驗中得到的所有智慧資本。雖然很多現代公司的基本營運工具並不昂貴，但還會有一些持續的成本，特別是你持續在運作的時候，所以你最後可能還是要投
    資一些財務資本，以支付基本的開銷。


    也因此她可以在這段期間內同時得到很多公司的股權。很多顧問是在公司還在點子的發展階段就投入了。他們在公司的創立初期就投入，是為了提供信用與支持，讓公司在外面籌措資金時，讓別人知道公司內部有很多重量級的專業人士。在這種情況下，當公司募到資金時，你可以考慮要求投資的權利。如此一來，顧問這個身分，也就自然而然成為天使投資人的跳板了。另外，由於你自己已經參與其中，你有得知該公司是否做得成功的有利位置，因此根據你所掌握的內部消息，就可為自己創造更多的報酬。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# 如果你想當業餘創業家或雙重創業家……


    做為公司的創辦人，在公司成立初期，你可能會決定自己負責營運。這種做法也可以做得很好，尤其 Experiment 投入時間應付得來、資金需求也很小的時候。不過到了某個時間點之後，需
    要投入的時間與金錢都會增加。根據你的業務形態，可能需要做出產品原型、準備庫存、簽訂租約，還要僱用員工。你可以決定，如何以最有效的方法配置未來需要的更多資源，以繼續執行你的商業計畫。


    遇到資源有限時，踏克．霍爾登的方法是找一位有智慧資本，也有時間投入公司日常營運的合夥人。他也找到了自己的父親，一起投資了踏克龍蝦快餐連鎖店的初期成本。另外，希利爾．詹寧斯從投資人募集到一筆資金後，仍然繼續在兄弟的協助下，自己經營
    Wrist Tunes。他自己投入了智慧資本，並把設計與製造外包給在中國的夥伴公司。


    做為業餘創業家或雙重創業家，你可以依適 合程度決定自己投入的架構，然後再選擇天使投資人、顧問或創業家的角色。你也可以根據自己投入的資源，結合多重的角色。舉例來說，迪亞哥．塞斯—吉爾（Diego
    Saez-Gil）在 Bluesmart 的角色，就同時是顧問與創辦人；使投資人、顧問或創業家的角色。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 兼差計畫還需兩大要素：投資程序與人脈


    而丹·戈特薩科夫在自己的餐廳裡，就同時擔任天使投資人與顧問。每一個人選擇的策略，都反映出各自的整體目標與資源。


    幾年前的 一個冬天，我在吉爾吉斯參加一個遠征隊，爬上天山山脈一個非常偏遠的山區。如果你計畫在寒冷的冬天到高海拔的山區健行，你會有心裡準備，那麼一定會很冷，但在天山的溫度，實在讓人覺得好像到了另一個世界。在那個地方，打開手上的氣象應用程式就會發現，外面的溫度是負攝氏四十度。這是對生命會有危險性的寒冷程度，所以當你走在山路上時，唯一的選擇就是繼續走，不能停下來。一步接著一步，腳步踏進沒人走過的積雪裡，直到攻頂。你很會發現，每走一步，身子就越暖。之後，你會覺得很熱，就脫了幾層衣服，塞到背包裡。當你的血液在流時，保持溫度的唯一方法就是繼續前進。只要停下腳步，馬上就開始覺得冷，馬上就會暴露在冷冽的空氣中。只要在山上待一段時間，就表示你已經走過幾個山脊，也看不到任何文明的足跡，你接'
  merge: -1
