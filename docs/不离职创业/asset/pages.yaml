  md: 堆的問題要問：該如何開始？要做這些什麼？我有足夠的時間和金錢來實現這個計畫嗎？會有多大的風險？我有足夠的判斷力和經驗，做出正確的決定嗎？五年後的現在，我已經為以上的問題找到了答案。我深深相信，兼職創業家並不是天生的，而是後天養成的。你可以透過學習而成為兼職創業家，就像我一樣，就像你將在這本書裡看到的這群人一樣。我們都是根據自己的專業技術、興趣以及人脈，建立各種專業活動的投資組合。我總共已經投資了十二個新創事業，有一些是投入金錢，有些則是投入時間，有些則是二者皆有。其中有七家公司中，我所擁有的股權，有部分或完全是因為我投入了時間，而不是投入金錢，也就是所謂的血汗股權。在選擇投資標的的，建立投資組合時，我總是遵循一套明確的方法，因為在為未來貯備機會的同時，我也賺到錢。到目前為止，我的投資已經為我賺回將近二倍的金錢。我持有的股權市值，也比我最初投資時翻了十倍以上。我參與了三項土地開發案，不但可以預期有長期的發展機會，還會有現金分紅增加收入。除了有利可圖之外，投資的過程也充滿趣味，我也因此得以和一群很有魅力的人一起合作，有些人你稍後也會在書中看到。這些難得的經驗，徹底改變了我對職業生涯的看法。現在我只有一個遺憾，為什麼我沒有早一點開始這應該做？如果我在AIG風暴爆發的
