  md: '為了讓你的立足點更容易成功，你可以根據以下的問題，評估一下你在每個事業中的潛在角色：


    盡職調查問題清單：你的角色


    • 你的資源如何連結到公司目前與未來的需求？

    • 你是否有相關的智慧資本與人脈，讓你可以對這家公司的成功做出有意義的貢獻？

    • 經營團隊是否重視你的投入與想法？他們是否想要讓你參與，並尋求你的建議？

    • 你和團隊的互動感受到自在嗎？你能不能根據事實與數據，而不是情緒，進行坦率的談話？

    • 公司是否回應你的要求？他們是否能及時提供資訊、回答問題？

    • 你在這個公司可以學到什麼，讓你成為更好的兼職創業家？

    • 你有沒有辦法建立有助於發展兼差事業的人際關係？

    • 如果你是顧問，公司是否針對你的角色設定明確的目標與期望？

    • 如果你是創辦人，你的合夥人是否已經準備投入？各方是否已經針對每一個人明確的投入程度與財務風險，準備簽訂協議？'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 4 最後決定


    完成盡職調查之後，你就能決定是否進一步投入，這就是做出最後決定的階段。創投公司在做投資決策時，投資委員會會一起具體討論這筆交易的優點與風險，之後再根據討論進行投票。所以如果你不是非常肯定，或你想聽聽別人的意見，找朋友或家人談一下你揮之不去的疑慮，也很幫助。這就像你專門擁有的投資委員會。如果已經做了決定，就可以繼續進行下一步。如果對盡職調查的結果很滿意，也認為這個機會符合你的策略，就可以答應。如果這個案子並不符合你的期待，你就可以禮貌地跳過。有時候，你做的最好投資是決策，就算是你沒投資的案子。執行最後決定，並進一步投入，總是讓人有點心驚膽顫。如果你是天使投資人，更是如此，因為你投進去的是你辛苦賺來的錢。我在投資
    risky 的時候，我做了盡職調查，也小心思考了公司的團隊，以及我投入的程度。一步一步跟著投資程序做，我就有充分的資訊做出最後的決定。當然我還是很緊張。最後我了解到了，我既然沒有水晶球，就必須信任自己做出的盡職調查。如果我不能投資這麽有吸引力的公司，和我已經非常熟悉的人合夥，那我可能永遠無法投資新事業。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 最後決定清單


    如果你正在做最後決定，你可以再看一下整個盡職調查程序的問題：


    +   - 公司的定位是否成功？

    - 你的投資是否可以得到豐厚的報酬？

    - 合夥人是否具備應有的能力與操守？

    - 各方的誘因是否一致？

    - 你是否能對公司產生有意義的貢獻？

    - 你是否能為未來的機會建立人脈、培養智慧資本？


    永遠要謹記在心，這是一個過程，你會從中學習與改善，甚至也會犯一點錯。只要你有經驗，就會看到更多的機會，見到更多的人。即使你決定跳過，你也永遠不會知道未來會發生什麼事。創業家也會有所學習，某個人的點子現在也許不太對，但下一回也許就是熱門的生意。所以如果你決定跳過某個案子，你還是可以把這次互動，看成一個跟上未來的機會。'
  merge: -1
  img_proc: true
