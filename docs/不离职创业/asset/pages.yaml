    麥克為了追求自己所熱衷的目標，做了必要的犧牲，尤是在事業發展初期，連生活費都差點付不出來。成功了之後，他發現自己可以過很不錯的生活，這是他十多年前想像不到的。照這樣繼續下去，說不定哪一天，他還能變得很有。

