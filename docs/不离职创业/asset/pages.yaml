  md: '# 你還在等什麼？


    不論你是否已經事業有成，或是才剛剛踏進職場，都應該給自己一個機會，思考一下，在未來的數十年內，你的職業生涯將要如何發展？當然我們不可能知道勞動市場以及你在其中的角色將產生什麼樣的變化，你能做的就是維持身在其中的狀態，不斷地尋求新的機會，學習新的技能，並且建立人脈關係。如果要確保自己不會到了最後只能追尋昨日的夢想，這就是最有效的方式，同時這也代表你是真的有心建立一份充滿活力、富於彈性，能帶給你利益的職業生涯。


    雖然已經有很像你這樣的人成為兼職創業家，你心中可能還是會有疑問，以兼差的方式創業，到底要怎麼做？畢竟你之前從來沒有這樣做過。這種感覺大概就像一場派對進行得正熱鬧，而你卻站在外面吹冷風，心中納悶怎麼沒有收到邀請函一樣。更何況你之前從來沒有想過，甚至不曾有過自己創業的意願。或許你向來是個乖乖牌，一切按照規矩來，才能取得今日的名聲、成就和滿足感。你投入了數不清的時間，遵循遊戲手冊上的標準規則，卻沒有意識到遊戲已然改變，或是你你的不僅僅只是如此。職業生涯就像我們的人生一樣，會有弧線，會有起起落落。有時候，你會忙得不可開交，'
