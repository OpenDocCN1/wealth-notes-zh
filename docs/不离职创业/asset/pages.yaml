  md: '① 本書以 1 2 3 4 標示者為參考文獻，統一放置書末。


    司和以前不一樣了，我的未來也不明朗，但是天並沒有塌下來，我也還活得好好的。事實上，我竟然有種異常解放的感覺，而且這種感覺如此強烈，以至於我開始懷疑，我所知道的關於建立職業生涯的一切都是錯的。接下來幾個月，我嘗試為一切做出合理解釋，卻不斷卡在一個問題上：我到底是哪裡做錯了？隨著時間流逝，我逐漸發現，其實答案一直就在眼前：過去我是如此天真，竟然期待只靠著一家公司的安全與穩定，就能提供我的一切所需。不幸地，那所謂的安全與穩定，只是幻影與假象。其實我覺得自己算滿幸運的。如果我沒有經歷過這一場金融危機，我可能到現在還是一樣，在工作中埋頭苦幹，心無旁騖，眼前只有唯一的一條路。我以為自己既然頂著哈佛大學商學碩士的頭銜，做什麼都按照教科書上教的，我的職業生涯一定萬無一失，穩穩當當。但我是錯了，我以為建立職業生涯就是盡量避免失敗。事實上，我錯得相當離譜，而AIG的股價大地震，就像字面上所描述的那樣，把我從安於現狀的夢中震醒了。但還有一大問題。我完全不知道接下來該做什麼。在我進入職場後的前十年，一直都'
