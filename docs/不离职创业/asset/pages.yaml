  md: '這家公司！

    身為公司創辦人，你必須在正職與其他職務之間找到最佳的平衡點。在你為自己的公司四處奔波之際，要如何確保你為別人的工作不會有所衝突，甚至受到損害？在數位時代，要守住祕密並不容易。對路克來說，根本連想都不用想，就知道必須向公司主管坦承他正在從事的龍蝦事業。首先，開在第七街的店面掛的招牌上就有他的名字；再者，根據規定，公司裡的合規部門（compliance
    group）⑦也會要求他，要向公司報告任何以私人名義持有的事業股權。 不管你的名字有沒有出現在招牌上，最好還是尊重公司的規定。這麼做是正確的，對你的公司也有好處。不信的話，你可以問路克。他銀行裡的同事都很支持他的雄心壯志，也成了他最早期、最好的客戶。


