  md: '# 選擇對的機會：兼差事業的投資程序


    現在你知道如何運用智慧資本，來判斷哪些類型orer案子能讓你發揮強項，就可開始尋找投資機會了。這時候，你可以問一下自己：我要如何找到與我相關的案子？你甚至可能有幾個想法，但懷疑自己要如何知道，這些想法是否都是好點子？這就是投資程序能派上場的地方了。這個程序會幫你思考清楚，避免一窩蜂的誘惑，或做出不符合最佳利益的決定。


    家都知道了。接下來的三年，這家公司從一開始只投資了幾百萬美元，成長了將近三十倍，會員人數超過一百万人，每年銷售額超過一億五千萬美元。基于這樣的成長軌跡，這家公司從矽谷投資人又另外募到了一億美元。這是我做的投資案中最令人興奮的一個，而且和我喜歡與敬重的人一起投資一家這麼創新的公司，也是件很有趣的事。這也讓我在
    Real Influence 的時間，收穫大到遠超過我所能想像的程度。由於這家公司的成長驚人，我的股票價值也大幅上漲。所以我在 Playlist Live  期待的那個週末，花的時間實在太值得了。'
