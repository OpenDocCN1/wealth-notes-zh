  md: '界的管道時，也同時採取對公司整體財務表現有幫助的策略與目標。當然你還是可以從事不用完全發揮你的強項的事業機會。你可能有一個非常有前途的點子，但落在你的智慧資本與興趣的交集以外。畢竟兼差計畫就表示，你可以承擔某些已經估算過的風險，因為你是在一個具有穩定性的位置從事這些事。藉由計畫，你可以從小做起，因此可以做中學。只要你在某個特定領域建立了信心與智慧資本，就可擴大規模。在兼差計畫的實踐階段時，有幾個方法可以避免，你在核心專長領域之外做事時，經常會犯的錯誤。最簡單的方法，是找一個在這個領域已經有智慧資本的人一起合夥。你們可以互相教導與學習，同時也會提升成功的機會。另外，等下一個機會出現時，你也會準備好承擔更獨立的角色。

    如果於善於做財務預測，並且想和餐廳合作，你就可以找在財務與料理交集區域的案子，例如：協助一位廚師準備開新餐廳的商業計畫。如果你準備好這樣做了，你可以打電話給像
    La Xarcuteria 的戈特薩科夫這樣的人，問問他是否需要協助。另外，如果你已經有社群媒體行銷的經驗，而且你想了解旅遊業的新創公司，那麼你就可以追蹤像塞斯·吉爾與湯米·布如吉（Tomi
    Pierucci）這樣的，他們正在努力執行他們對 Bluesmart 的想像，也在找尋可以加入這個理想的人才。'
