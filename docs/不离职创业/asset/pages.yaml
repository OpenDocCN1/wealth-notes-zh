  md: '進荒野。很多人就是這樣做的，幾乎是臨時起意就從事某件新鮮事，當然也要冒一點風險。但我並不建議這種方式，因為你並沒有誠實看待你手中的資源，去看你適應合哪一種投資，所以你冒著根據情勢或機會做決定的風險。更重要的，你就失去機會去擬訂一個可以持續發展然後執行的計畫。計畫做得越好，投資就會越精明、越能獲利。一旦順利，你就會有更多的選擇，因為當你從投資中得到獲利，並把獲利重新投資，就能增加你的資源基礎，並打造一個能給自己足夠的嘗試。兼差計畫就像所有行動的藍圖，除了資源以外，還要應用你的兩大要素。首先，你會遵循一個定義明確的投資程序，幫助你集中注意力，並以高標準做決策。遵循一個標準程序做事，讓你可以看到配置資源，並在一路上邊學習改善。第二，你可以動員你的人脈，讓每一件事故到位。把所有認識的人的資源整合起來，並加以利


