  md: '把這些連絡人的資料匯入或輸入資料庫或試算表。把資料庫中的人做優先順位的排列，連繫可能對你的事業有幫助的人。設下目標，每星期至少要和幾個人講話，不管是面對面談，或透過電話談。每一次的討論和互動都要做筆記，如果適當的話，要標記後續追蹤的連絡人。為了讓人脈隨時更新、條理分明，你要持續使用這個資料庫。如果你對連絡人以及他們目前


