  md: '現在你已經評估過自己的資源，要開始進行下一個步驟了。當你在確認、評估即將成為你的兼職事業的一部分時，投資程序可以引導你走過每一個步驟。當你有問題、面臨困惑，或需要確認一下羅盤，看看自己是否還在軌道上，這個投資程序會協助你問對的問題、找到答案，然後根據事實與數據做決策。一旦掌握其中的竅門，這個程序可以重複應用，也會省下你很多精神。


    遵循相同的步驟，以後就能信賴自己的判斷，學著更有效率地工作，並投入最能發揮你的資源的案子。在這個過程中，你會花很多時間在現實世界裡，要親力親為，像個創投家一樣思考。這是這件事情很有趣的一部分，而且通常也最無法預測。你永遠不會知道，你的兼職事業會變成怎樣，你可能也ეხ了解自己正處在無法預期的狀況。


    這就是我在Playlist Live遇到的狀況，這是網路巨人Youtube在佛羅里達奧蘭多舉行的一年一度網路名人盛會。如果從沒去過，我來告訴你錯過了什麼。當你在活動現場走動時，你會覺得自己好像在網路上衝浪，只是這次是在真實的世界。Youtube上的名人會在場親筆簽名、賣T恤和粉絲互動。粉絲們大部分是青少年與科技人，他們現在狂喜不已，因為可以一睹偶像風采，不是可以按「讚」表示自己的崇拜。我很難不被這種氣氛感染，所以當我遇到泰·桑迪（Tay
    Zonday）時，我也成了追星族。他是第一批Youtube網路爆紅的名人。'
