  md: '人，擁有選擇也真的很棒，但這也是一份責任。當你有能力做出選擇，你就必須確實做出選擇。你做出糟糕的判斷或不太知道該怎麼做時，也不能躲在別人的後面。自由帶來的精神價值，也可能令人惶恐。靠個人的努力與效益能得到報酬，很合理也很吸引人，但同時也失去了安全感。因為你不能再跟著別人做，然後在某一乖天，就得到與你的貢獻無關的報酬。


    如果你有一套明確的方法，也就是投資程序，就能讓你一步一步跟著步驟做，這也是會精挑細選、經驗豐富的創投資本家，在做投資案時所遵循的程序。像創投資本家一樣思考，會幫你省下時間，幫你嚴謹地思考，也會教你怎麼看出模式。一路下來，你會學到很多。這也會讓你更有信心，你的決策是基於事實與你自己的智慧資本，而不是情勢或情緒。當你做完你的功課之後，才決定投入。以下呈現的五個步驟程序，非常非常重


    # 投資程序


    ![](img/7f1fa7eacaa6faa3435104a4b91097c5_168_0.png)'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 1

    蒐集案源


    要，也不能假手他人。第一個步驟是蒐集案源，你可以建立一個得到案源的管道，這些都是你兼職事業的候選名單。接著你用篩選程序，去除不符合你的兼職計畫參數的事業。接下來，你要執行盡職調查，以評估每個機會的整體吸引力。根據你的發現，你可以做出最後決定，決定要進一步投入，還<|message|>
    跳過這個機會。最後，你要藉由適當的法律文件，讓一切成為正式的投資案。


    根據你到目前為止的工作經驗，當你成為兼職創業家的第一天，你就很知道自己有什麼資源可以拿來發揮。至少在開始，你也會感覺到，自己要爭取哪些類型的兼差事業。接下來你會怎麼做？一開始手忙腳亂的階段已經過去了，現<|message|>
    你必須思考實際上要如何開始。你會想做第一筆投資案，見見你的第一位合夥人，或想出一個絕妙的點子，讓你很確定，它是你投入時間最好的案子。這此都是很好的衝動。你必須同時很忙碌，但也很專注，所以一點急迫感對你有好處。另外，也必須在熱情中帶點耐心來平衡一下。你並不是要盡快種下一顆種子，然後就希望長出什麼東西。你是要打造一座花園，讓你一年到頭都有花可賞。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '說到找到第一個投資案，洛杉磯的雙重創業家麥克·梅爾（Michael Mayes）從不動產借用了一個字眼，可以掌握如何開始的絕竅：你需要一個指標性租戶（anchor
    tenant）。想像一下，你正在開發一個不動產案子，也許是辦公大樓或商場。你在這棟大樓的第一個承租人，也就是所謂的指標性租戶，就可讓你進入這個行業，而且也能讓你減輕壓力。你不必失眠了，因為你已經有一個已經簽約、會付錢給你的承租商了。你的這個指標性租戶也會對這個世界透露訊息，並且為未來的一切設定基準。這會造成月量效果，告訴別人你正在從事這門生意，同時也會吸引新的承租商。如果你選對了指標性租戶，其他的一些切就會跟著發生。


    指標性租戶就是讓你啟動的人或機會。對我來說，和馬瑟羅在Real Influence的聯手行動，就是我的指標性租戶。我之前就在工作機構識他了，當我在找新的機會或新鮮事時，也會打電話問他的意見。我也信任他，並把那次機會看成是一次探險以及學習的方式。風險很少（只有我的驕傲），但我真的很想做好，也很想做出具體的貢獻，因為我敬重他，也想助他一臂之力。在為Real
    Influence建立生意管道而到處連絡人、找潛在客戶，並在我的人脈圈中找對這項服務有興趣的人時，我也學到如何成為兼職創業家。更重要的，擁有真實的顧問身分，幾乎就像在脖子上，以及在我領英個人檔案上，掛著一個「開始營業」的牌子。'
  merge: -1
