  md: 著就會理解，想要平安返家，你只能仰賴三個基本要素。第一，就是你的計畫。你已經有了基本裝備，也擬了一個能讓你順利攻頂，然後在太陽下山前回來的計畫。第二，你靠的是意志力。光是裝備，無法帶你攻頂後再帶你回家。在承受這一切的過程中，你必須看見一個目的。如果沒有，那種冷冽刺骨、那個高度還有漫漫旅程，可能會讓你質疑自己一開始為什麼要加入這場瘋狂的行動。最後，你靠的是其他和你一起登山的人，你希望這些人和你一樣有決心。知道你們所有人都要一起走這一段路，會讓你不會慢下來或停下來。這也能燃起你的競爭精神，讓你的行動可以稍微快一點。除了競爭，你也會和團隊走在一起，最後抵達同一個地方。好不容易爬到山頂時，你也會想要有人和你分享，這一路下來的經驗。身為兼職創業家，你的創業旅程就像在爬山。當你正在做新的嘗試，並轉向一個不熟悉的方向，一日起步，你其實並不知道實際上會遇到什麼狀況。也許你不是遇到真的爬山的那些狀況，但你將會逼自己走出舒適圈，有時候還必須把自己放在讓你覺得不安或不確定的環境。在這些時候，心裡有一個計畫，就是不可或缺的要素。就像努力在對抗寒冷與疲倦的登山客，你要研究周遭的環境，並堅守在你的計畫上。計畫就像你的羅盤，為你指出下一步的路。當然你也可以選擇沒做多少準備就上路。你可以把地圖丟在家、套上一雙登山靴，就走路。
