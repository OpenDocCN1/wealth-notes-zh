  md: '# 讓名字成為名片中最重要的品牌


    在召集團隊、打造機制之前，你自己要很係理。你即將要和很多 人談話，所以為了讓每一個人的時間都用得很有效率，你必須要能清楚說明你是誰，你的目標是什麼。回想一下第六章，你寫了一份專業自傳。你當時可能不了解，其實你是在對自己做盡職調查。你是在用一種一致而可以理解的方式，把你職業生涯的一切寫出來。現在這個練習可以進入下一個階段，請思考一下，這對你的品牌與你對別人的建議，有什麼意義。


    你應該還記得，我提到我一開始在做兼差事業時，我的自我介紹做得很差勁。在我把我的故事搞清楚之前，我傾向仰賴隨機的活動與靈感當話題，結果所有人都感到困惑，包括我自己。我從經驗中學到，你投射到世界的形式，就大致上是別人看你的方式。因此你需要一個強有力的行銷說詞。如果你在幾個句子內，就清楚說明你的專長以及你想做的事情，你就能掃除大家的困惑，並投射出自信、有信
    用與使命感給你周圍的人。再回頭看看在中國創業的美國年輕人蓋文，很顯然他的自我行銷說詞很成功。他為每一位潛在的投資人裁切客製化的訊息，這一個行動突顯了，他已經知道某個人將會如何影響他的公司。這是一連串研究、反省與很多練習的結果。'
  merge: -1
  img_proc: true
- pgno: 206
  md: 準備自己行銷說詞，需要很多事前的工作。想像一下，你在某個社交場合，有人問你你的工作是什麼。這就是你告訴他們你是兼職創業家的機會，所以千萬不要錯過這個機會。好消息是；由於你在第六章做的練習，你已經有了所有需要的基本元素。重點是要讓人有可以記住的東西，也許是你的日常工作，或你的公司，然後把這個記憶點和你未來想達到的目標連結起來。只要做點準備，這可以很簡單。例如：派翠克的自我行銷說詞，就可以用濃縮在幾個句子：我派翠克。我一開始是醫生，但很快就決定想進入商業界。在從事企業顧問期間，我運用我的醫療經驗在法醫訓練，尤其是在戰爭衝突地區。之後，我開始對衝突地區的安全感興趣，於是我決定把一切整合成在一起，成立了一家安全與法醫公司。我現在想到新的地區發展，歡迎介紹任何在這領域有專精的人。當然他也可以只是說：「我的名字是龐德，詹姆士·龐德。」但你就永遠不會知道，他曾經是企業顧問。
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 兼差計畫：練習 5


    # 擬訂自我行銷說詞


    回到你在第六章擬好的較短版本的自傳。把這個版本的自傳當基礎，做成一份自我行銷說詞。注意，只需要幾句話，但這些句子中要包含以下的信息：


    +   - 你的姓名

    - 你在「做」什麼

    - 為什麼你在這領域很有信用（例如：現在或過去的經驗）

    - 你想達到的目標


    重點是說明你白天的工作、讓你的兼差計畫看起來有些可行性，然後提到幾個你需要幫助的領域。記住，你是在給一個概述，以引出未來的對話。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '在研擬自我行銷的說詞時，你可以實驗一下，如何把履歷表上的所有品牌整合起來。這可能包括你的大學、過去與現在的雇主，以及你兼差事業的公司名稱。對於 Wrist
    Tunes 的希利爾．詹寧斯來說，他的兼差事業與母校，是他行銷說詞中的關鍵，但對其他人來說，可能就會沒有那麼重要。你可以根據對象、情況，以及有用的資訊，調整說詞中的內容。這樣做的時候，你會發現，用一個強有力的說詞介紹自己的好處，是大家通常會想知道更多。當你


    一旦有了自我行銷的說詞，再思考一下，如何針對不同觀眾量身修訂，例如：潛在的事業界夥伴、朋友、某個可能會介紹你投資機會的人，或是一家你想參與成為顧問的公司。針對性說詞的訣竅在於為每個聽眾想出有關的「請求」，例如：如果你是天使投資人，你要說：「我正在尋找機會，想以天使投資人的身分投資有潛力的公司。」如果你想成為顧問，你就要說：「我想當顧問，以運用我的知識與人際關係。」如果你在找事業夥伴，你也可以修改你的「需求」。放手去做，盡量直接。只要有個好的自我行銷說詞，就有足夠的動能讓你採取直接的表達方式。'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# 為你的團隊招兵買馬


    很多 人都認為，人脈是事業成功的第一個驅動力，但經營人脈要花的时间，也會讓人震驚。從連結人脈成癮症中復原的我，很辛苦地學到這一課。我花了數不清的時間在喝咖啡、喝酒、用餐，全都是為了建立關係。這也是我自己的錯，因為我真的喜歡認識新朋友，而且我認為每次的互動都能學到東西。但是在我的職業生涯中，雖然我有很驚人的連絡人數量，但我在這過程中，浪費了很多時間與精神。沒有人教我們如何建立人脈。我們也隨著時間過去而慢慢學習，一開始是在遊樂場，接


    對「你 在做什麼？」的答案超過一、兩個字時，人們通常會開始感到好奇。只要你說得清楚 而自信，你會發現，你很快就會被問到更多細節了。這就是在你開始要連結人、要找志同
    道的 人時，要做的第一個步驟。 一旦你擬妥了自我行銷說詞，請不斷練習，直到你能表現得非常自信與明確的時候。另 外，也可以在朋友或老師面前練習，他們都可以給你建議。'
  merge: -1
  img_proc: true
