  md: '難清楚說明我的意圖與技能，讓我的朋友、家人，以及最重要的，能在事業上助我一臂之力的人士了解。我搞得一團糟，一點也沒有條理，也沒有花時間設定目標，雖然我知道某些專業領域吸引我，但我並未真正思考所有的可能性。好消息是，如果你已經做了本書前半部的練習，你就已經解決這些問題了，所以你比當時我還領先了好幾步。

    因為我沒有做過準備，所以在告訴別人我的專業強項時，不知道要如何把我在工作上所做的事，把整個來龍去脈說明清楚。我可能會談到某些工作成就，但我提供的 一大堆學歷與證照，不是無法被人理解，就是一點關係也沒有。另外，我很容易只記得過去幾年的工作經驗，卻沒有想到更久遠的事，以形成特定的角色或人際關係，並了解這一切的前因後果。

    我缺乏聚焦，是個嚴重的问题。當我請教本 身擔任招募主管的朋友肯娜（Kenna）時，缺乏焦點更成為明顯的問題。見面時，她要我簡單扼要描述我的背景與強項，結果我一開口就滔滔不絕講了五分鐘。我列出一大堆似乎毫無相關的興趣、詳細說明之前幾個工作，然
    後又隨機講到一、兩個我之前在巴基斯坦、土耳其與哥倫比亞工作的案子。等我終於閉嘴後，肯娜揚起眉毛，眨了幾次眼，給了我一些建議：「派翠克，要抵抗想告訴我你做過的每一件事的誘惑。那些雖然很有趣，但實在讓人招架不住。你要做的，是認識你談話的對象，以及對他重要的事，然後把你要傳遞的訊息，稍微剪裁一下。如果未來有一天，你所做過的事剛'
