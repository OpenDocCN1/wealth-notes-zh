  md: 逐漸走入歷史遺蹟。這兩條路，你只能選一條走，沒有折衷的方案。不管你決定走哪一條路，都必須接受事實，這條路肯定有它的缺點。還好，傳統智慧已經過時了，你也不只能一選一。只要你放下舊觀念，不再希望一份工作就能為你帶來所有想要的東西，你就能看見，傳統的工作和自行創業，不是非得勢不兩立。事實上，二者甚至可以做為互補。與其在一份穩定的工作和自行創業之間選擇，為何不讓你的現職提供你穩定的生活以及財務來源，並做為你的平臺，整合現職的資源，為兼職創業做準備？與其垂直地改變工作，不如平地拓展你的職業生涯。你可以分配相當比例的時間和精力，投注在更廣泛的事物上。如此一來，創業不但可以提升你的職業發展，還可以在時局起起伏伏時，做為增加機會或者提供保護的一個方法，而旦你也不需要像全力投入創業的人，去考慮那些可能面臨的風險。藉由兼職創業，不但能達成財務上和專業上的多元性，你也將從此展開一連串的探險，使生命更加充實有趣。此後，不管是參加酒會，或者是在街上巧遇老友，你會發現談話的題材變豐富了。你可能會聊到新設立的公司，或者正在研究的房地產，不像從前總是在抱怨辦公室裡的辛酸。
