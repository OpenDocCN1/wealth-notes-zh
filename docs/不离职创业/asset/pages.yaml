- pgno: 97
  md: '# 你的資源：時間、金錢、智慧


    資訊，也無法預測未來，你現在就可以採取步驟，做些準備。評估一下你可以發揮的資源，

    然後做出一個行動計畫，你就能面對未來的每次交叉路口了。


    就像任何創業家一樣，要根據你的條件，決定有關的兼差資源。你要把稀缺的資源延伸利用、平衡取捨，然後隨時因應調整。


    第一，你要考慮，對於你的營試，你能投入多少時間。


    第二，你要決定，你可以投資多少財務資本或金錢。你的目標是拿出一○％的資源放在


    這些地方。另外，你也知道，投資幅度會隨著時間自然演變。


    第三，考慮你的智慧資本，也就是你的知識與技能符合的程度。說到智慧資本，目標是

    結合你做得很好與很享受的事。智慧資本是讓你能把時間與金錢投資，經營得更有生產力的要素。運用知識與判斷，你將會做出明智的決定，也將會提升成功的機會。


    雖然手上的資源可能彼此沒有關連，但把這些資源放在一起，就可以把它們想像成一種'
  merge: -1
  img_proc: true
- pgno: 98
  md: '投資組合。每一個成分都是動態的，所以你的投資組合也會隨著你的生活階段、財務資源、經驗水平而改變。就像所有的投資組合一樣，為了增加每一個資產的價值，同時把組合起來的價值極大化，你也需要計算賭注。隨著投資組合變大，你的選擇會變多；根據資源配置的方式，不管是各自開或整體應用，你也會有更大的彈性。如果你的投資夠明智，投資報酬率就會呈現複合式的成長，產生比各自加總起來更大的報酬。沒有人有用的不完的時間、燒不完的資金，或深不見底的專業知識，但只要有所欠缺，你隨時可以另一種資源來彌補。把資源想像成投資組合時，你可以把有所欠缺的地方（也许是資金），和你有強項或非常充分的地...
    方（例如：時間與知識）加以調和。牡蠣灣釀酒公司的創辦人決定要維持白天的工作，並投入資金，以促使公司成長時，這些決定的意義非常清楚，他們必須以最


