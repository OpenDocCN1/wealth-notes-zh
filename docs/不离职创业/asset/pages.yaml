  md: '現在你已經有了兼差計畫，也盤點了你所有的資源與團隊，你已經準備好迎接挑戰，成為兼職創業家。最後一章將聚焦在價值觀，這將成為你未來做各種嘗試的路標。在這本書中，不管是在談時間、金錢，或是你打造與經營兼差事業的方式、你已經聽過心態的問題。我一直非常注意心態的問題，因為從根本上來講，心態是創業的限制。短短十年以前，想創立新事業，你必須擔心各種阻礙。你必須先支付各種天價的技術與基礎建設費用。同時也會受到居住地點的限制，因為在很多地方，人才與資金的選擇都很少。但過去存在的障礙，現在已經經不見了。今天的挑戰是在你的職業生涯期間，打造可以持續經營，並能為你創造財務與個

    人價值的事業。

    奧馬．夏塔（Omar Chatah）在黎巴嫩與美國成長，他知道在生活無法預測的地方，創業家最多。這就是黎巴嫩成為創業活動最吸引人的市場的原困。為了應付日常生活中的一般事務，就必須發揮無限的創意與耐心時，成立新事業要面對的挑戰，聽起來就沒有什麼大不了了。當奧馬想自己做點什麼事業時，他的父親給他的忠告，是如果想長期經營，最好存到足夠的錢，靠自己資助公司。雖然這番話不是奧馬想聽的，但他選擇耐心等待，沒有被熱情沖昏頭，他埋頭工作，繼續在舊金山一家軟體公司上班。直
    到二〇一三年十二月，一切都變了。因為他的父親是政治'
