  md: '所當然的。身為創業家，如果連你都相信自己炒作出來的神話，投資人就應該趕緊把你趕出門外，免得你把他們的錢都輸光。不把注意力放在目前進行的工作上，而浪費寶貴的時間和精力去展現個人魅力，是非常危險的事。你看起來可能條件俱足，說的話也似乎頭頭是道，但是當該說的都說了，該做的也做了，最後還是得看成熟果來決定一家公司的價值。條件俱足，但沒有實際去執行，最終肯定只能做個第一流的「空想創業家」（wantrepreneur）。

    很遺憾地，這就是美麗的創業神話被打破後的真相。粉飾本質，只把焦點放在表象，刻意不去談一件很重要的事：全職創業家不是每個人都做得來的。如果你決定今天，或者永遠都不想成為創業家，實在不必感到羞恥。事實上，選擇一條比較循序漸進的道路，可能會是你所做過的選擇中，最好也是最重要的一定。絕對不要貿然放棄一份穩定的工作，投入一個風險很高，連你也不確定自己做做不到的事情上。如果決定要創業，你得全神貫注，繃緊神經，看清方向。'
