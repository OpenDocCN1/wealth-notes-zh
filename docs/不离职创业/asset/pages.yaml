  md: '因此非 常搶手。許多企業邀請她擔任顧問，其中包括了Birchbox③和Pixable④，還有南韓的Coupang⑤電子商務網站，這家網站公司募集了超過十億美元的資金。這些公司之所以以來找貝絲，不是為了錢，而是為了尋求支援。正如貝絲所言：「那些負責開支票的人，不太可能在倉庫裡待上二年去了解事情到底怎麼運作。」


    那麼到底這一切是如何進行的？身為顧問，你每個月有義務撥出一定時數給公司，而公司則以股票的形式付給你做為酬勞。至於你所提供的顧問內容則相當廣泛，取決於你的專長所在，包括引見重要人物、製作財務預測、評估租賃方案、設計商標，或者準備行銷及資金募集的相關材料。雖然各家公司的付酬方式各有不同，但通常顧問會收大約○·二％到二％的股權，同時每個月保留幾個小時給這家公司，為期一年或者更久。另外，對於某些一次性


    的專案，也可以採取短期工作的方式合作。


    不是只有駭客或行銷達人才有機會贏取顧問的權益。崔大衛（David Choe）就是很好的例子。他是個塗鴉藝術家，幫臉書在公司總部畫了幾幅壁畫，酬勞就是股票。等到臉書上市之後，他那大概連○·二五％都不到的股份已價值數百萬美元。³
