  md: '# 兼差計畫：練習4


    # 撰寫專業自傳：你的智慧資本


    把履歷表當成參考（最近如果沒有更新履歷表，請先更新），做出像下列這樣的清單：


    +   - 學歷

    - 雇主與角色

    - 核心技能

    - 成就與獎項

    - 關鍵的客戶與人脈

    - 領導與管理經驗

    - 課程、訓練與證照

    - 社群活動'
