  md: '事業成功的可能性與你的整體樂趣，和你如何謹慎挑選夥伴直接相關，所以你會想要和你有相同目標與價值觀的人一起工作。這是不可能妥協的。因為你還有一份日常的工作要做，而這些人是要實際投入新創事業，讓一切成功的人。你要很有信心，他會保護你與他們的利益，尊重你在公司的角色，而且行事作風正直誠實，能為你赚钱，也和你一起赚钱。對公司有熱情是必要的，對夥伴有熱情也是一樣。創業的一大獎勵是和能啟發你的人一起工作。但公司有你喜歡的夥伴還不夠。評估夥伴，不只是決定你喜歡這個人。大部份的公司會失敗，都是因為人的失敗，而且很多非常善良的人也會失敗。如果公司的經營團隊不強，或僱用了不對的人，公司就會錯失機會，也會做出錯誤的判斷。

    我在投資這一行的老師史考特·弗希（Scott Foushee）總是告訴我，不好的合夥人是一給再給的禮物」。如果чики錯了，選了不對的合夥人，你可能會發現，自己處在一直接收不想<|message|>的禮物的處境。一斥不幸的選擇，不只會毀了你的投資，還會讓你的名譽受損。記住，你的名字會出現在股票或顧問名單上，而且你也可能會因為夥伴的行為而身陷泥濘。如果出問題，尤其是有關道德的問題，你有一天可能會在報紙財經新聞頭版上發現，你的名字就列在他們的名字旁邊。我的母親經常告訴我：「如果和狗躺在一塊，身上就會有跳蚤。」這個道理反過來想也一樣。如果你周圍的人都是像馬瑟羅、蜜雪兒、尼爾這樣的人，這些人都讓'
