  md: 注意，開車時不要傳簡訊！我並不支持多工哲學，我必須專心把事做對，並喜歡這種做事的方式。但我也認為同一段時間可以達成多重的目標。 其中的訣竅就在於把需要深度思考的活動，結合被動性質的活動，例如：摺衣服或在健身器材上運動。如果你有工作要專心處理，打電話連繫的事就可以在通勤或午餐，或下午喝咖啡時再做。在你可以為自己做點什麼事的時候，為什麼要把寶貴的時間浪費在聽廣播、玩手機遊戲，或聊辦公室政治等老話題？你也可以在晨跑或淋浴時，好好組織你的想法，或是在孩子的學校遊樂場中，為了新的機會，和其他家長連絡感情。這一切的活動都對你的兼差計畫有幫助，還能無縫接軌到你的生活中心。我認識一個傢伙，會一邊遛狗一邊聽有關石油與天然氣的播客。當他帶著狗在街上到處晃的時候，還很努力跟上能源產業的趨勢。
