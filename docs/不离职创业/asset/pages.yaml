  md: 我會進入商業不動產業，是因為我朋友傑森（Jason）是邁阿密的不動產投資人。幾年前，我得知以前我工作過的一家公司，正為他們位於邁阿密的倉庫找投資人。我對這家公司與這個建築物非常了解，因此雖然我不太了解不動產業，但我知道我可以打電話給誰。傑森住在距離這棟建築物不到二十英里的地方，而且他是個經驗豐富的投資人，我也像家rapper一樣信賴他。在這個例子中，我和他的智慧資本完全互補。我可以為這家公司與所有人做保證，而傑森可以處理這個交易。我們兩人聯手合作，這個案例最後也成為非常棒的投資案。現在我已經學到一點不動產業的知識，所以我又投資了兩件傑森的案子。藉由智慧資本與你互補的人合作或合夥，就可依靠他們拓展自己的知識範圍。你也可以回報別人一些好處，利用你的特殊技能，幫助他人拓展活動，以進入新的領域。這就是團隊的價值。不管你的工作做得多好，或你的經驗有多深厚，對的合夥人會讓一切不同。接下來你會看到，沒有人可以知道所有的事，所以你要利用你的智慧資本，以及你人脈圈中所有人的人脈才智，做好自己的功課，並找到解答。但是在動員你的人脈之前，你需要一個找到、分析，接著投入事業機會的投資程序。在下一章，從找到你的第一個事業計畫，評估這個事業的優劣，到在每一個事業中架構你的投入程度，你將會學到如何做好一個兼職創業者。
