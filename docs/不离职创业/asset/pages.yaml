  md: '兼差計畫的主要目標是創造有利情勢。如果以天使投資人的身分投資，就是用現金投資在有前途的公司上，這些公司的未來預期會有利。那麽在投資報酬率上，可以期待什麽？考夫曼基金會根據一項長達十五年、大約一千二百件投資項目的天使投資人報酬率研究中發現，以投資組合來看，在三年半的時間內，投資人可以賺到投資金額二．五倍的報酬。這表示每一年的報酬率約三〇％。另外，創投資本家大衛·泰登（David
    Teten）彙整了十二個研究則顯示，天使投資人可以預期每年有八％到五四％的投資報酬率。8 如果你考慮到股票的長期報酬率一年大約一〇％，或者抱著現金一年的報酬率大約三·五％，這様的投資報酬率已經非常吸引人。9
    即使對這些研究結果再打個折扣，報酬率也依 然很高。另外，經過十年之後，報酬率的差距還會繼續拉大，天使投資人多元化投資組合的投資報酬率，會比持有現金超過十倍；比持有股票超過五倍。當然這些研究紀錄的報酬率都是投資組合的報酬率，也就是說，投資組合中的某些投資案，會比平均表現更佳，或者也可
