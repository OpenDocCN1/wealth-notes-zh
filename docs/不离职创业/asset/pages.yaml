  md: '# 4 業餘創業家 — 讓自己的技藝充份發揮


    身為業餘創業家，你會分配相當比例的時間和精力，以天使投資人或顧問的身分，甚至以創辦人的身分，投注在你熱愛的事物上。即使你只是以兼職的方式參與，你對這件事的熱愛，實際上已經遠遠超過業餘興趣，你已經不甘心只是當個業餘愛好者。舉例來說，你不想只是獨自一人在自己的車庫中吹喇叭；不滿足你用心烹調的精緻晚餐，只能讓親朋友享用。雖然你不打算把打發時間的嗜好當作工作，卻還是熱切希望能有機會，讓自己的技藝得到充分的發揮，同時還能照常工作。雖然只是一份副業，但你所需具備的專業程度已經相當於任何一位天使投資人、顧問或創辦人。不同的<|message|>是驅使你的動機是熱情，而不是單純的利益。你仍然必須具備創業家的心態，辛勞付出，才能成為一個可以自給自足的事業機會。我的文學經紀人蜜爾卓瑞德·袁（Mildred
    Yuan）第一次讀到我這本書的提案時，很快就抓住了這個概念，讓我非常驚訝。她告訴我，她在成為經紀人之前，是個職業舞者。她從小就開始跳舞，甚至曾經想以舞踏做為事業。根據她的說法，她是個「傳統亞洲家庭的小孩」，父母並不鼓勵她選擇以藝術維生，於是她選擇攻讀財務學。既然當職業芭蕾舞者已經變成遙不可及的夢想，她便把注意力轉移到國標舞上，這樣舞蹈壽命也會比留在芭蕾舞界長'
  merge: -1
  img_proc: true
- pgno: 83
  md: 一點。幾年後，她搬到芭蕾舞的發源地倫敦，加入了一家策略顧問公司，並在那裡遇到了新同事蓋瑞·克羅塔茲（Gary Crotaz）。蓋瑞也是一名舞者。於是他們先是在舞蹈上成為夥伴，後來更是在婚姻上成為伴侶。兩人結合利用工作之餘的時間，在倫敦推廣國際標準舞。蜜爾卓瑞德和蓋瑞設定了很清楚的優先順序。以他們之間的關係為優先，然後是他們的工作，再來是舞蹈，任何其它的事，像是渡假、看電視、睡眠等，都是其次。這對夫妻花了好多個假期，再加上每個月至少一個週末，到義大利接受舞蹈訓練。如果遇到一些專業技術上的問題，他們會想辦法再擠出一些時間來排練。當蜜爾卓瑞德因顧問公司的業務需出差到阿布達比，蓋瑞也想辦法把工作安排到同一個地點。兩人在凌晨五點排練，一直練到日出之iento，氣溫變得太熱之前才停止。雖然兩人為此都做了一
    些犧牲，但是這二年來的努力、奔波，以及付出都是值得的。他們七度代表英國參加世界及歐洲錦標賽，並且在世界賽中名列前八強。此外，他們也在倫敦開辦了一間舞蹈學院，訓練下一代的舞蹈菁英。探索你的另一種天賦，有時候能讓你對未來的事業方向更加清楚肯定。你可以廣結人脈，學習新的技能或新的見解，這些都可能讓你以完全不同以往的視角，看待周遭的事物。擔任顧問工作所養成的策略性思考，使蜜爾卓瑞德在身邊的舞蹈同好中備受歡迎，於是她決定善用自己個性中的二種特質：生意的理性以及藝術家的感性，成為一名經紀人。除了作
