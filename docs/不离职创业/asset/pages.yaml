  md: '不同的盤算。彼得。巴洛從沒打算為了 Silvercar 辭掉律師工作，Monday Night Brewing 釀酒公司的三個創辦人，也只有兩人選擇全職投入公司。這此問題雖然很容易解決，但在你為公司成長做計畫時，不能不加以考慮。1
    了解一下經營團隊，並討論一下你要如何為公司增加價值，讓一切變得更有意義。當顧問的時候，我喜歡定期和執行長開會，並列出一張對雙方的期待。這樣的對談可以確保我花時間真的能幫助到團隊，同時也確保執行長與其他重要經理人能聰明地占用我的時間。不管你是天使投資人或顧問，你越有影響力越好。這不會提升你的投資價值，也會強化你和這些人的關係。這可以讓會議桌上的其他人清楚看到你的價值。在理想上，他們在未來的很多事業，都會成為你的夥伴，所以你的影響力越大，其他人就會越希望和你共事。

    我是迪亞哥。塞斯一吉爾第一家公司 WeHostels 的顧問。當他把公司賣給一個策略投資者時，經常打電話給我請教建言。我們會一起坐下來研究試算表，分析交易條件，以及這筆交易對投資人與經營團隊的意義。這是他第一次賣公司，所以我很高興我可以運用自己處理解類似情況的經驗。在賣公司的過程中，在牽涉到高風險的商務談判中，我們開始了解彼此，並在這些對談中建立了深厚的信任感。他賣掉公司之後，沒有忘記我們一起共事的經驗。當他加入
    Bluesmart 擔任雙重創業家時，他從一開始就提供我擔任天使投資人與顧問的角色。'
