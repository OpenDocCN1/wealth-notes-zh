  md: '人物，在貝魯特的一次汽車爆炸中被暗殺身亡。在這次事件之後，奧馬開始懷疑自己的人生方向。一種焦躁困擾著他。他還年輕，有什麼理由讓他不敢冒險？既然永遠不知道什麼時候會發生慘劇，那還在等什麼？

