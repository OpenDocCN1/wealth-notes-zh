  md: '問或創辦人的步驟。

    根據你的專業背景，你可能已經非常熟悉這類討論、談判過程與法律文件，這些都是投資過程的不同階段。如果不是，也不必擔心。創業時期的法律程序，比你想像的，甚至很多

    人恐懼的，更不複雜。如果

