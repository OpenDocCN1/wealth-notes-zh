  md: '問題。為了評估需求與檢驗市場，牡蠣灣釀酒公司的蓋伯．海姆經常在週末開車走遍長島，以研究市場的競爭狀況，而馬薩拉寶貝的狄帕莉．帕特瓦則去參加童裝貿易展。在本書中的每一個人，從
