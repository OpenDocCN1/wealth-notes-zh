- pgno: 228
  md: '身為兼職創業家，白天的工 作就是你固定的備胎計畫，但你仍是一個名副其實的創業家。你確實投入、承擔風險，並一腳踏進未知的領域。這件事故聽起來很令人振奮，但從不是一件容易的事，尤其事情發展不如預計畫，或遇到阻礙的時候。這也就是為什麼每一個兼職創業家或投入更多的創業家，都認為對一個長期願景能夠不屈不撓、堅定投入，是這件事最重要
    的態度。


    凱蒂·唐瑟（Katy Tuncer）對不屈不撓的意義最有體會。當她所有的朋友都把空檔年（gap years）花在當背包客時，凱蒂擦亮靴子、急忙下床，趕著去做清晨的操練。凱蒂不是花一年去「尋找自己」，反而是到桑赫斯特皇家軍事學院（Royal
    Military Academy Sandhurst）參加一年的訓練計畫，並成為一 大亮點。威廉與哈利王子、邱吉爾（Winston Churchill），甚至約旦國王侯賽因（Hussein），都是從這所軍事學校開啟職業生涯的第一步。


    年紀輕輕才十八歲，凱蒂就要指揮一隊士兵，有此一人的年紀還是她的兩倍。十年後，凱蒂再一次渴望在公眾利益領域貢獻所長，所以她在倫敦首都警政總部（Metropolitan
    Police）擔任管理職，這個單位被普遍稱為「蘇格蘭場」（Scotland Yard）。她也開始養育小孩，本身同時也是運動員，她現在發現，新手媽媽除了照顧孩子之外，很難注意到自己的健康。她很想找到一種方法，可以讓忙碌的媽媽也能找到時間健身，於是她寫'
  merge: -1
  img_proc: true
- pgno: 229
  md: 了一份 Ready Steady Mums 的商業計畫書，這是一個線上與實體結合的健身計畫。為了在日常工作與照顧孩子的需求中找到平衡，凱蒂了解到，如果她想要成立自己的公司，就不能自己一個人做。於是她招募了技術人才，成立了顧問委員會，並募集到數千名和她有一樣想法的媽咪。有了團隊以及支持她的媽咪社群，凱蒂推出了群眾募資計畫，從超過一百名投資人手中，募集到將近十萬美元。這次行動的成功吸引了
    BBC 的注意，並在二十四 年把凱蒂列為百大女性之一。雖然一開始進行得很順利，但 Ready Steady Mums 從未達到可以獲利的規模，所以凱蒂決定快速關閉公司。雖然她很失望，但她決定要負起責任，所以她親自連絡每一book
    金額較大的投資人，清楚說明這種情況。她對大家的大力支持很感欣慰，有一個投資人甚至告訴她，下次需要資金的時候，務必需要打電話給他。藉由一個非營利組織的主持之下，這個計畫重新出發，凱蒂也因此能持續履行她的使命。這個非營利組織的工作，就是監測全英國家庭的健康體適能狀況。雖然
    Ready Steady Mums 無法以營利事業來運作，還是對全英國的新手媽咪很有意義。和全職創業家一樣，兼職創業家也會失敗。不同之處在於兼職創業家的損失會少很多。當你使出全力，把資源投入一個全新的事業，卻在路上遇到障礙，你要面對的決定是你<|message|>
    要如
  merge: -1
  img_proc: true
- pgno: 230
  md: 何回應？當凱蒂明白，Ready Steady Mums 無法成為一家可以支撐下去的公司，她選擇直接面對問題，和投資人談話，並為了忠誠的社群與她的願景，找到一個讓這個使命可以持續下去的方法。身為公僕，她想達到目標，所以她持續專注大局，並讓這件事能成功。這就是不屈不撓。因為兼職事業只是你專業生涯的一部分，當事情未能如你所願，你可以減少損失，並繼續走你的路。但即使你不是完全投入時間與財務資本，卻做了很大的感情投資。這個部分的事業是和你的興趣最有關係的部分，這些人也對你很重要，所以從這個角度來看，你也算把自己的大部分都投資進去了。在談到工作心理層面時，兼職創業家的一〇％並不重要，因為你做的每件事，都有比一〇％更大的價值。但說到底，你還是一個創業家，你的心理素質必須很堅強，對於你的願景還要繼續投入，同時要記住，不管好壞，每一天都會讓你更進一步邁向你的整體目標。事情難免會起起落落，這是很自然的事，回想一下你一開始為什麼要做這件事，永遠要心無旁騖住目標。克服困難，不屈不撓，會是你策略的重要環節，和擬訂你的兼職計畫、進行盡職調查、增加人脈一樣重要。當然這是這項練習中充滿情感的部分，但也是最會影響到你的部分。光是這個理由，你就必須在心理上做好準備，要知道如何克服冒牌貨症候群（impostor
    syndrome）
  merge: -1
  img_proc: true
