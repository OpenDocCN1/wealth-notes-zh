  md: '問或創辦人，你都是新人。即使你的能力對現 在設定的目標，完全游刃有餘，你也可能擔心，你不是「真的」有足夠的能力。覺得自己必須「假裝，直到你真的做到」，讓人感覺壓力很大。

    只要你持續檢驗自己的困惑，覺得自己是個冒牌貨，事實上是一種健康的事情。這一點顯示了你的謙虛，也幫助你腳踏實地，還能激勵你持續前進，這樣你才能變得更堅強，更有自信。但這也不是必要的條件。身為兼職創業家，你知道你要達成什麼目標，也知道該怎麼做。把你的經驗拿出來，大部分的人都會相信你的說法。如果他們是從你白天的工作，或生活中的其他活動認識你，他們已經對你的能力知之甚詳，也會很有幫助。即使是第一次見面，如果你有膽量親自現身，還把話說得條理分明，別人也會因此而尊重你。既然一開始已經同意和你談談，他們很顯然已經抱著開放的態度，願意投資時間找到雙方的共同利益。在這時候，你的自信和有力的自我行銷說詞最有影響力，表現得好，就不會浪費這次機會。就像我之前說的，你投射給世界的形象大
    Daher 是別人看你的樣子。當你第一次坐在桌子對面時，根據別人問你的問題，你就能很快察覺到別人對你的態度。把這些問題記下來，並調整你的做法，在未來的會議中，事先回答這些問題。消除對方的疑惑，就能增強你的簡報與自我行銷說詞的效果。'
