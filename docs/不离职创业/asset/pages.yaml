  md: '天空巴士推出這個方案的時機簡直糟透了，推出之後，立刻就遇上雙重挑戰。一是二○○八年的金融危機，另一個是油價暴漲。短短數個月，公司就撐不下去了，彼得和經營階層一起執行殘酷的任務，一個下午裁了超過六百名雇員。之後，他再次重返律師事務所，從此不再離開。他已經夠了創業失敗的滋味，今後如果還想創業，他只會以副業的方式進行。

    一年之後，彼得又得到一個機會。在一次搭飛機的旅程中，他注意到坐在鄰座的男士——直埋頭做一份簡報。這名男士叫陶德．貝爾維爾（Todd Belveal），過去二年裡，他花了大半的時間，為一家追求創新的租車公司研究一個新方案。

    飛機快要抵達終點時，彼得被陶德的構想深深吸引，他相信自己能幫得上忙，畢竟他的職業就是運輸法律師，他也熱愛汽車和飛機；此外，他還曾創辦過兩個相關領域的事業。彼得和陶德互相交換資料，很快地更頻繁互動，一起討論如何改善提案內容以及商業模式。之後，彼得邀請比爾．迪范德弗（Bill
    Diffenderffer）加入，他是天空巴士的前任執行長，本人也創辦了許多事業。這三個人花了一個週末，在白板前敲定商業模式，決定共同合作，成為事業合夥人。彼得加入的條件是，他必須保有一在律師事務所的工作。從此，他成了兼職創業家。

