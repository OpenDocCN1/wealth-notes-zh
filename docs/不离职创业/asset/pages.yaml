  md: '# 明確、聚焦又專業的自傳範例


    派翠克·麥金尼斯是 Dirigo Advisors 的經營夥伴，這家公司在拉丁美洲與其他新興市場，為投資人與企業營運提供策略建言。他已經為世界銀行（World
    Bank）與國際財務公司（International Finance Corporation）針對有關股權私募與創投提供建議。二〇一三年，派翠克與人合寫了一份世界銀行政策工作報告，標題為〈開發中國家中小企業的私募股權與創投資金：技術援助的角色〉他同時也是資源集團與社會創投（the
    Resource Group and Socialatom Ventures）的董事會成員，這是一家在哥倫比亞麥德林的種子投資基金公司。

    另外，派翠克也是兼職創業家，在美國與拉丁美洲做了很多公司的天使投資人。這 些公司包括 ipsy、Bluesmart、SATMAP、NXTP Labs、WeHostels、Everbright
    Media、the Fan Machine、Preference Labs 及 Morton & Bedford。同時，他也在 Bunny、Bluesmart、
    Posto、Preference Labs 與 Everbright Media 公司擔任顧問。

    在成立 Dirigo Advisors 公司之前，他是 PineBridge Investments 公司（前身是 AIG 資本夥伴公司）的副總裁，這是一家全球新興市場的投資公司。在
    PineBridge 期間，派翠克蒞集、架構、執行與監督在拉丁美洲、中歐、中東與亞洲的成長股權投資'
  merge: -1
  img_proc: true
- pgno: 276
  md: '（growth equity investments）①。派翠克也針對投資組合中的公司，提出包括策略與財務規劃、資本結構、購併、事業發展與退場機會等事項的建議。

    在加入 PineBridge 之前，派翠克是 JPMorgan Partners 公司的投資專家，在紐約與聖保羅兩地的拉丁美洲團隊工作。派翠克曾擔任墨西哥外包連線中心
    Hispanic Teleservices Corporation 的董事會成員，並在阿根廷的手工冰淇淋零售商 Freddo S.A. 擔任代理董事。派翠克是在大通曼哈頓銀行（Chase
    Manhattan）的拉丁美洲團隊，開始投資銀行的生涯。

    派翠克是個活力十足的旅人、作家與演說家，已經造訪超過七十個國家。他為富比士網站（Forbes.com）、《赫芬頓郵報》、《波士頓》雜誌、《商業內幕》（Business
    Insider）等單位，撰寫有關旅遊、與拉丁美洲創投協會（Latin America Venture Capital Association）等單位，撰寫有關旅遊、科技與商業文章。他經常出現在美國、墨西哥、哥倫比亞、阿根廷與莫三比克，演講有關創業、私募股權與新興市場投資的主題。

    派翠克還身兼紐約青年管弦樂團（New York Youth Symphony）董事會成員。他也是 NESsT 的商業諮詢網（Business Advisory
    Network）成員，這是一家非營利組織，宗旨是發展永續的社會企業，以解決新興市場財務的重The 會問題。他也是阿特拉斯公司（Atlas Corps）的受託人，美國青年專業人士協會（Young
    Professionals of the Americas）指導委員。'
