    作時間，但是他心中還有一 個好點子等著他去實現：他想打造全世界第一個智慧型行李箱。那將是一個可以與網路連線的行李箱，旅人們只要藉著智慧型手機，就可 以操作行李箱追蹤定位、加鎖以及稱重的工作。於是他和同樣來自阿根廷的創業家托米·皮魯奇（Tomi
    Pierucci）討論了這個構想。托米·皮魯奇在向中國採購商品方 面具有相當深厚的經驗。他很喜歡迪亞哥的構想，希望能將構想實現，於是雙方達成協議，由托米帶頭進行。這一次，迪亞哥將扮演兼職創業家的角色，在維持正職的情況下，以顧問的身分，協助托米經營Bluesmart公司。

