  md: '滿足於只是當個觀察家，不如去買股票。在成為一家公司的天使投資人或顧問之前，你得花點時間了解了一下，經營團隊為什麼要你加入他們的公司。如果你決定和他們一起做事，你將會建立一段理想上可以延伸到好幾年的夥伴關係，所以你應該了解他們認為你可以提供的貢獻。他們需要你提供的是財務、人脈、建議，或者是各式各樣的協助？你應該投入多少時間協助他們？創辦人與合夥人的原則也是一樣。如果你是和新的合夥人成立公司，你應該花時間和團隊的每一個人相處，確認你們對每個人的角色與貢獻都有共識。我看過好幾個創業家，給沒做什麼事的合夥人一大堆公司的股票。其中有一個合夥人把股票賣掉後，賺到超過一百萬美元，但他根本沒做什麼值得領到這麽多錢的事。


    盡早處理這些問題是很必要的，這樣才能設定預期，並釐清每一個人在公司往後發展中的角色。當你排除產品、數字與合約的事之後，每一件事情都和人有關，而且在本質上，人的問題也非常的敏感。你可能要談一些讓你感到不自在，或很尷尬的ожили話題，例如：金錢問題。尷尬實際上是好事。現在一點點的緊張關係，會避免未來長期的誤解。而且一開始就知道你們有嚴重的分歧，也比你坐下來簽約時才知道更好。另外，你也會想了解一下，你的合夥人在處理嚴肅議題時的行事風格。就像你已經看過的，創辦人可能會有不同的利益，心裡也有'
  merge: -1
  img_proc: true
