- pgno: 223
  md: '# 信譽是你最重要的資產


    即使你做了很棒的名片，也有很漂亮的商標，但你的口碑比這一切更重要。別人會根據你的工作記錄以及推薦人的素質，而選擇是否和你合作。在建立團隊並培養長期的夥伴關係時，這些考量至關重要。如果沒有人想和你合作，你的誠信也會受到懷疑，那麽你的選擇就會很有<|message|>
    限了。記憶就像職業生涯一樣長久，人的互動越來 越頻繁，世界只會變得越來越小，所 以你今天做 的決定，會直接影響到你招募優質人才到你的團隊的能力。 莱斯麗·皮爾森（Leslie
    Pierson）為了MEMI到群眾募資平台Kickstarter宣傳時，有小孩子的女性，回應非常踊躍。MEMI是一家想生產接到電會震動的智能手錶公司。 莱斯麗是這家公司
    的最佳代言人與創辦人。她自己就身為人母，之前也當過經營顧問，同 時也當過4moms的天使投資人與董事會成員。4moms是一家生產下一代嬰兒產品的科技公司。雖然她相信自己的點子，但仍必須做選擇。萊斯麗的三個小孩都不到五歲，她想把大部份的時間用來照顧家人，所以她找到一個全職的合夥人瑪格烏克斯·古拉德（Margaux
    Guerard）。瑪格烏克斯之前在Diane von Furstenberg與Bobbi Brown擔任多個資深的行銷職務。有了瑪格烏克斯這樣的合夥人，萊斯麗就能把MEMI納入兼差事業中，並把她大部'
  merge: -1
  img_proc: true
- pgno: 224
  md: '分的精力投入家庭的職責。

    在 Kickstarter 平臺上預售超過十萬美元價值的手錶之後，《紐約時報》（New York Times）報導了他們的公司，科技新聞網站 TechCrunch
    隨後也很快跟進報導。雖然在市場上已經有點風聲，但把概念化成現實卻很困難。在她們與組裝電腦硬體的複雜度棘門期間，競爭出現了，像 Apple Watch 這樣的產品吃掉了
    一個原來沒有競爭者的市場。最後萊斯麗和瑪格烏克斯做出了艱難的決定——停業，並安排退款給所有訂購產品的人。她們其實沒有必要這樣做，但是她們很珍惜自己的信譽，也想要合理公平對待顧客。

    萊斯麗承認 MEMI 是一次學習經驗，一場冒險，而且最後也失敗了，但這肯定不會是她的最後一個事業。雖然她有很高的期望，一開始的市場歡迎度也越來越高，但她並沒有被初期的成功沖昏頭。她以非常精簡的方式經營公司，募資的金額也盡可能不要太大，還特別保留一筆現金，做為公司運作不順的準備金。因此她最後能盡到對顧客的道德責任；因此她的信譽並未受損。實際上她證明了，在做生意時，她絕對會支持夥伴並負起責任。

    每次投入一 家新公司時，就必須帶著信念，這並不是一次探索考察行動，也不是嚐好消遣而已，這是你的 人生中值得投入適當時間與注意力的事，因為這也會成為你個人記錄的一
    部分。事實上，你的投入程度具有不可或缺的重要 性，因為兼差事業一成功，就會為你'
  merge: -1
  img_proc: true
- pgno: 225
  md: 的人生打開新的機會。就像其他創業家一樣，你很自然也會遇到挫敗，所以你必須屢敗屢戰，不屈不撓。遇到挑戰與阻礙時，你的態度會讓你克服一切，讓你繼續勇往直前。下一章你將會讀到，如果你要設計出一個長期的兼差事業，你必須確定自己隨時要保持專注。
