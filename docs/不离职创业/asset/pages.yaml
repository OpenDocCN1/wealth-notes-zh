  md: 實有點意思。這就是你應該花點時間篩選的理由。如果 你不主動篩選，你可能會花很多時間在看投資機會，但很少能達到你的條件。拒絕是個很有啟發性的經驗。我在大公司工作期間，當我對別人說不的時候，心裡總是不太好受，但我真的不知道，某個人對我的點子說不的時候，我會有什麼感覺。當我坐在桌子的另一邊，在
    Real Influence 試著銷售 Youtube 的合夥關係時，我終於嚐到我過去錯誤的滋味。這實在很有教育意義。拒絕沒有什麼錯，但不應該粗魯、無禮或不回應。你要有長遠的眼光。你正在灑下種子，也許幾年後才會開花結果。今天帶著構想拋劣的商業計畫書來見你的人，有一天可能是
    一家非常有吸引力的公司 的執行長。你的考量，或前面提到的行為，都會被記得。如果 你想要繼續受到邀請，就得注意自己的行為。遵守黃金法則可以延伸到謹守承諾。光說不做，沒什麼價值。如果
    你答應要為人引見、電匯資金，或每個月保留幾個小時的顧問時間，你就必須做到。如果 你都不能出現，也 不參 與，為什麼要做兼差事業呢？這是 你職業生涯的一部分，在兼差事業中，你可以根據興趣選擇、做決定，並為自己打造一點什麼事業。如果你的兼差事業感覺像義務，而不是一種特權，就
    是該重新思考策略的時候了。
