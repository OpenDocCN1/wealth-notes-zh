  md: '# 前言

    不辭職創業、低風險，賺錢也賺經驗


    你準備好做兼職創業家（10% Entrepreneur）了嗎？

    如果你一直持續關注目前快速變遷的科技、機會以及思維模式，是如何正在改變全球的經濟，那麽你可能已經注意到有一股新的風潮正在形成。

    現在到處都可以看見開心創業、享受前所未有的工作彈性和自主性的人，而且他們都還各自擁有一份正職工作：

    • 一個剛從大學畢業的社會新鮮人，開創了屬於他的龍蝦<|message|> 事業王國；

    • 一名設計師經營了一家童裝公司，業務蒸蒸日上；

    • 一群聖經團契的朋友，共同成立了一家精釀啤酒公司，他們全是以兼職的方式創業。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '對他們來說，創業不是全部，而是工作之外的附加選擇；而且在情勢有利時，創業可以為他們增加機會，有下跌風險時，也能提供保護，同時還能讓他們的生活更豐富、更有趣。

    同樣的做 法，為什麼不能應用在你身上呢？

    兼職創業家是什麼意 思呢？意思是說，你至少撥出一〇％的時間，如果可能，也可以撥出全部財產的一〇％，投入新的投資或機會上。藉由經驗與人脈，你可以選擇各種機會，不只能發揮你的強項，還能和你的職業與興趣相輔相成。最重要的，你付出心力所創造的一切都會屬於你的。在你的一生中，你可以在很多個時間點改變職業、轉換部門、改變角色，甚至換公司，但你永遠都在為最重要
    的雇主創造價值，那就是你自己。

    我想在一開始就先說清楚，本書的主旨並不是反對公司或反對工作，事實上正好相反。

    讀完本書總共十章的內容，你將會學到如何一邊全心全意投入工作，一邊還能培養新的技能，能，讓你在工作上的表現更有效能。畢竟，目 前從事的工作，對我們來說都很重要，它提供了一個場所，讓我們學習專業、建立人脈、挑戰風險、學習如何為團隊奉獻。另外，還能享受晉級升遷的機會、教育訓練的機會和社交互動的機會，對我們來說，這些經驗非常寶貴，值得我們衷心感恩，更何況還有一個不容忽視的因素，它付給你一份穩定的薪水，外加各種福利的確，以上提到的種種，都不應
    視為理所當然。但在吃了不少苦頭之後，我才了解'
  merge: -1
  img_proc: true
