  md: '# 運用你的強項


    在這一章，你已經完成兩個練習。第一個練習是零機會成本，是為了擴展你的視野。第二個練習是撰寫你的專業自傳，就是要把你能端上檯面的所有經驗與技巧加上來龍去脈說清楚。在這兩個練習之後，你就能回答下列兩個問題：


    +   1. 你想做什麼？

    2. 你最擅長什麼？


    這兩個答案的交集之處，就是你的甜蜜點。一般說來，這就是你為了讓智慧資本發揮最大成果時，既是你 的強項，也是你的興趣所在。當你在考慮智慧資本將如何幫助你過濾潛在的機會時，這也是你可以運用的過濾


