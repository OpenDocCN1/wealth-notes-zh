  md: 能回應你的人。透過當面的會談、電話，甚至在生日聚會或烤肉聚會上的互動，就能活化你的人脈圈並創造機會。越能把這些和事業有關的討論，整合到你的其他生活層面中，產生的衝突也會越少。在每一次這樣的對談中，你可以請教別人的意見，或請求別人的引見。如此一來，你新增的連絡人也會與你認識和信任的人有關。你可以對這些對話，做些記錄或筆記重點，你就
    會知道這些點子與建議從何而來，之後也有可以繼續的話題。另外別忘記，這件事不能做得太自私。問一下你可為對方做什麼以做為回報，然後就可以開始建立你的人脈機制。
