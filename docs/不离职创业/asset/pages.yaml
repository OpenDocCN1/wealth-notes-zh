  md: 為一個有經驗而精明的投資人，最明顯的方法就是做中學。如果 nhảy過投資程序中的「實做」部分，只是根據別人的行動決策，你一定會犯錯，而且這些錯會一再發生。每次我遇到跟風的投資策略時，我總是會問：「如果（知名創投公司）要跳河，你也要跟著跳嗎？」
    這也引出一個問題：没有很多創投資本家被認為是牛羚嗎？當然有。很多投資人或投資機構只是追逐趨勢，隨著其他公司做，但這些人和你有一個很大的差異，他們用的是別人的錢，你用的是自己的錢。不管是以時間或財務資本的形式，或者兩種都有，你投入的是自己
    的資源。這表示如果 你走捷徑或只會跟風，你就會變成那個跳河的人。就我上次看到的經驗，牛羚可不會飛。 只要你待在生意場上，你就可以評估很多出現在你眼前的機會。把創業活動整合到你的職業生涯，差不了多少就是在處理平衡風險與報酬的事，也是選擇一個和「員工」很截然不同的積極心態。一夕之間，你要完全掌控你要爭取哪些機會，放棄哪些機會。現在你的努力與潛
    在報酬有直接的關係，不必再擔心公司政策，或在公司環境中會稀釋報酬的無數因素。你也永遠不會知道，每一個案子最後會為你帶來什麼。因為今天做倒的 Real Influence，可能就
    是明天大賺的 ipsy。 但在同時，光是想到要開始，就讓人怯恐。我當時真的無所適從。自主性聽起來很吸引
