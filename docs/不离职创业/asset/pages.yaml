  md: 無法讓事業成功。 不管喜不喜歡，就是會失敗。 雖然失敗經驗真的「爛透了」，但因為這只是你的兼差事業，對你整體的職業生涯影響有限。 不過還是要好好善後，以降低附帶損害，你要和每個合夥人一起解決所有尚未解決的問題。
    就像 Ready Steady Mums 的凱蒂．唐瑟以及 MEMI 的萊斯麗．皮爾森，你在公司經營失敗時作為，將對你的信譽有很大的影響。 公正合理地對待合夥人和公司其他股東，充分說明了你身為專業人士的特質。
    你也要試著了解是哪 些 環節出錯，就能在其他兼差事業中避免類似的錯誤。 最後如果你的合夥人都 是很好的對象，未來也可以保留和他們繼續合作的可能性。 你們的共同經驗會讓你們一起變得更聰明，因此下一次也能提升成功的機會。
    就像我在這本書一開頭就寫的，我真的相信，兼職創業家不是天生的，而是後天養成的。 養成過程的一部分就是體驗失敗，然後再從頭開始。 即使遇到問題，如果繼續堅持你的計畫與願景，也會有穩定的進展。
    一段時間下來，你的資源會增加，投資程序也會更有效率，人脈也會變得更大。 你將培養出不屈不撓的精神，從挫敗中振作起來，並帶著信心處理這一切。 當所有因素整合成來，你打造的機器就會運作得更快、更順暢，你也會看到你的投資將會以你無法想像的方式回報你。
    在那時候，你就成功了。 那麼下一步呢？你要如何維持動能？ 在最後一章，我們要把注意力轉到能長期引導你的核心原則。
