  md: 兼差計畫將會是一份讓你定期回頭檢視的活文件。當你經歷每一個規劃的階段，要做重點筆記，不管是電子或書面的筆記都可以。這些重點筆記將會成為引導你持續前進的資源，就像你在規劃能夠獲利的路線時，必須依賴的羅盤與地圖。別擔心你的個人條件將會發生變化，兼差計畫的目的是長期的，所以完全可以依據你的條件而加以調整。如果你得到一筆不小的獎金、搬到另一座城市、培養了新的興趣，或時間上可以更有彈性，你就可以回頭看看這個計畫，並跟著做些調整。
