  md: '捨，我通常會撥出時間見見他們。不管你是採取陌<|start|>生推銷方式，或重新連絡上老朋友或同事，有幾個基本的禮節與常識要注意。很多人一天會收到數十封或上百封電子郵件，他們絕對不會想讀一封沒有重點、沒有價值的信，我喜歡把這些郵件稱為「沒營養」的郵件。當你準備要寫任何電子郵件、陌生推銷，或其他接觸對方的方法時，請遵守以下的要求點：


    +   - 用自己的個人郵件信箱

    - 熱情，但要簡潔

    - 把文字寫得個人化一點

    - 絕對不要寄制式信函

    - 強調共同的利益或認識的人

    - 提出明確的請求｜沒有人想要寫一大堆來回回的郵件，才能得知你的「請求」

    - 提供任何對方許需要的協助做為回報。

    - 永久要說：「請」和「謝謝」

    - 後續追蹤尚未解決的事項'
  merge: -1
