  md: '是進度超前， 平步青雲，根本就沒去想過要有什麼 B 計畫。幸好，現在的我終於有空去探索不同的路，尋找更有趣的方向。我唯一可以確定的，我不會再把我的整個職業生涯，都賭在一家公司的命運上。除此之外，未來可以說是天空海闊，沒有什麼好怕的。過去的我總是小心翼翼，安穩至上，現在或許該是冒點風險，甚至考慮自己創業的時候了。


    經過一段時日沉澱，歷經幾番心靈探索之後，我得到一個結論，至少在我可預見的未來，我並不認為自己會成為一個成熟的創業家。我並沒有任何絕妙的商業點子，更不想放棄一份正職工作所能提供的安定。我真的不覺得自己像個創業家。


    在我進入職場的前十年，我一直把創業看成是別人家的事，並不適合我。我是那種專走前人走過、不會出錯的路，所以我工作就要找大公司，我也自以為我是最符合公司要求的「職員」。我認為這樣就夠了。我已經花了太多精神為一家公司工作，沒必要再自找麻煩，增加工作負荷。我在和朋友閒聊時，得知他們在工作之餘，還投入了新事業，我會面帶微笑，但心裡卻想著：「你怎麼會想把空閒時間拿來工作呢？」


    另外還有什麼風險的問題。對某些人來說，創業是個可行的選項，但對從小在美國小鎮長大的我來說，失敗實在太恐怖了。如果我在華爾街混不下去未了，可沒有什麼祖產等著我回家繼承，等著我的只有住在父母家地下室那樣的生活。萬一真的淪落到那種地步，住在只有半套'
