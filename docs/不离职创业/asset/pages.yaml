  md: '要成為天使投資人，需要一定的財力。那麼到底需要投入多少錢？這個問題就像生命中的許多問題一樣，沒有一定的答案。沒有書面或任何硬性規定，要求你必須投入多少資金，完全看你和尋求資金的企業主之間怎麼決定。天使投資人加入的時間，通常同時還有其他前期投資人一起加入，所以通常只需要分攤所需募集資金總數的一部份。換句話說，如果該家公司打算募集一百万美元，你的五千美元對他們來說，可能不具什麼吸引力，除非你還能提供其他非財務類型的資產。但是如果另一家公司要募集的資金數目不大，那麼你的五千美元可能就很大量了。此外，你還可以和其他小額投資人結合起來，或者加入天使投資團體，讓你投入的錢更具價值。相對地，有些投資標的需要你投入比較大的數目，像是二萬五千美元或以上。這樣的投資金額，或許你還可以應付，但如果你繼續往下讀就會知道，在你決定自己的投資額度之前，必須先決定要分配多少錢在你的副業投資上面。

