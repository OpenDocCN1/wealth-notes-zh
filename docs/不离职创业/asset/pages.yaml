  md: '# 推薦序

    你不適合創業，但可以選擇：不離職創業去！


    兼職創業，有可能嗎？為什麼現在這麼人要創業？我很重要原因，現在沒有一樣工作是一〇〇％穩定的！你若把職涯的全部，投資在一家公司的命運上，風險不僅非常高。而且你若認為還有鐵飯碗的工作，事實是早就不在了！這本書並非鼓勵你離職創業去，畢竟創業失敗的風險更高。反而是刺激你，在快速變遷時代下，你可以選擇：不離職創業去！不過，如何不離職創業去呢？我看了這本書，有以下三點深刻體悟：


    # 1. 別貿然行動，但可採取漸進而務實的方式創業


    > — SmartM 世紀智庫創辦人

    許景泰'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 2. 我真的相信，不是每一個人都適合全職創業


    除了你平常認真工作之外，你應該思考 B 計畫的可能。我認識太多年輕創業者，想pane 個點子，跟家人借了錢，就衝去創業開公司了。第一年，看似風光，因為名片上印著響亮的創辦人或
    CEO 頭銜，令周圍人被工作時間綑綁的人，羨慕不已。但不到二年，因為無法找到穩定賺錢的模式，十間有九間都關門了。事實上，你大可不必貿然地先創業，可以先有一份好工作，再來計畫兼職型的創業，不僅可二者兼具，也相對務實。


    更何況，我認識的創業者，生活與工作幾乎是全面失衡的狀態。也許，你不想擁有沒有生活品質的人生，但你又想因著創業，體驗建立新事業的模式。你可以像本書所提倡的，試著成為投資者，做為新創公司的股東，一樣可以開啟你的新視角。例如：二年前，我開了一間美式餐廳
    Dreamer38，當時我已經有四家公司，其實早已沒有足夠時間和精力，可以投入在這間餐廳上。我決定，找一群願意投資的朋友一起合夥，當兼職創業者。餐廳就找專業經理人經營，既可擁有自己的餐廳，又可因著餐廳的經營，創造出更多附加價值與機會。當然，餐廳也可能會有倒閉的風險，但每位投資者分攤，無須花一大筆錢即可成為餐廳'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 3. 多數想創業又怕失敗沒退路者，都是因為認識自己沒失敗的本錢


    老闆，只要每個人評估風險是接受的範圍內。在這個歷程中，不僅可拓展自己人脈，也可增

    加專業知識和生活更豐富，其實是很棒的投資！

    之所以會有兼職創業，還有一個根本的原因，就是多數人沒有失敗的本錢。換言之，創業失敗所帶來巨大的財物損失，可能會拖垮自己，甚至連累家人，產生極大的負面連鎖效應。我就有一位很好的朋友，因為創業跟銀行借貸，與妻子娘家借錢，二年後創業就宣告失敗。積蓄不僅全賠光，銀行錢也還不出來。創業失敗，帶給他後續巨大影響，讓他日後在找工作和家境負擔上都變得非常艱困。即使，你真的還是想創業，也許打造一個合適自己的兼職創業模式，從中因著投資，學習創業的歷程，若還能創造一門賺錢的生意，這肯定是非常棒的投資。最後，我還是要再三提醒，兼職創業跟全職投入創業，都會有風險。畢竟，創業交給自己不見得是最好的選擇，但交給有能力、你也信任的人，無論你是做天使投資人、顧問、創'
  merge: -1
  img_proc: true
