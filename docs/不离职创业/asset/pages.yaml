  md: 因為這樣的答案，讓鎮上每一個人都認為他不是怪人，就是瘋子。我第一次聽到我父親提到這個鄉下的傳奇人物時，忍不住笑了出來，並搖了搖頭。在新英格蘭的小鎮成長，讓我習慣於各式各樣的奇怪人物。這是難免的事。但是我越是思考傑勒森的事，我越是好奇，他是否正在從事什麼別人不知道的大事業。當你是創業家時，你必須決定你的目標，並規劃達成目標的方法。你不會會採取和別人一樣的途徑。你不會走傳統的路，別人可能也不了解你在做什麼，但你會繼續在自己的路上，勇往直前，馬力全開。如果你有急事，也許走路正好能符合你的需求。當你在從事一些新或打破傳統的事，就會忽然冒出很多批評意見。他們可能想不通，為什麼你還要在休息時間工作。如果你在工作，而他們沒有在工作，他們會怎麼說？你也可能否發現，你的朋友與同事對你的新事業有很奇怪的反應。每一個人都有意見，而且他們也很樂於告訴你，為什麼你的點子永遠不會成功，或你的新產品有什麼缺點。我真的很震驚，當Bluesmart第一次在做群眾募資宣傳時，有多少朋友打電話告訴我，Bluesmart的行為李箱有什麼問題。太大了、太小了、太重了、太輕了、太複雜了，或太簡單了。在募資平臺Indiegogo籌到超過二百萬美元的預購金額時，同樣的一批人之中，有些人竟然抱怨我，從來沒邀請他們參與投資！
