  md: '夥人全職投入，並聘請了一位第一流的釀酒專家。他們的計畫成功了，上市才短短三年，Monday Night Brewing 釀酒公司創造了數百萬美元的年營收，僱用的員工超過六十人。

    但牡蠣灣釀酒公司的蓋伯和萊恩，還維持在兼職創業家的身分。他們很喜歡白天在一家成功的汽車經銷商工作，也很滿意公司給的薪資報酬。為了專注在白天的工作，又想打造自己的釀酒事業，於是他們僱了一個團隊負責牡蠣灣的日常營運工作。這個投入很少資金的公司，想成長還是得靠汗水與智慧。蓋伯與萊恩把工作餘暇用來改造一家位於商業地帶、已經停業的墨西哥餐廳，想改造成為他們的第一家釀酒俱樂部。由於社群媒體行銷與策略夥伴的有利結合，他們做出了—個很強勢的品牌，並迅速在紐約長島的北岸展店。他們的勇氣與創意在一段時間後也得到回報。牡蠣灣釀酒公司的啤酒很快在紐約島人（New
    York Islanders）與紐約大都會（New York Mets）的體育館銷售，這是東岸最重要的兩個運動經營權。所謂的創業精神就是要做出計畫，接著為了達到計畫的下一歩，而做出大大小小的決策。當你的想法從有興趣的副業開始，成長到「如果……的話」，你就會面臨和
    Monday Night Brewing 釀酒公司與牡蠣灣釀酒公司的團隊一樣的問題。你想做成怎樣？怎樣才能做到？你可以投入多少時間與金錢？一旦你對這些問題有了清楚而誠實的答案，你就可以準備踏上兼職創業家的旅程，並做出你的兼差計畫了。就象你即將在這一章看到的，即使你沒有完整的'
