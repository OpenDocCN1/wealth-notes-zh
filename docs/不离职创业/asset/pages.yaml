    多樣化除了具有財務發展的潛力之外，還有另一個附加價值｜讓你的生活更加多采多姿。4. 在一連串創業的過程中，你將會學到一身技藝，這會讓你的專業能力更加完備。只要把你在兼職創業過程中學到的技能運用出來，就可以對你的正職工作產生很大的影響。'
