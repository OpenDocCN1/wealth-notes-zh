    盡職調查令人愉快的部分，是有機會見見新的人，到外面見見世面。你可以把每次的盡職調查會議，看成是和桌子面對的人建立關係的機會，從對方的公司學點東西，並建立基本的信息任基礎，這可能會成為一段很有意義的人際關係。你也可以把盡職調查當成擺脫辦公隔板，觀察真實世界商業運作的方式。如果你在考慮投資一家餐廳或一家店，不妨花幾個小時觀察一下來來去去的人潮，並和顧客聊聊天。自己嘗試一下公司的產品，或體驗一下公司提供ned服務。除非你已經開過
