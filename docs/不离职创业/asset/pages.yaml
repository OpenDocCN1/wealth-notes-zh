  md: '# 全職創業家不是每個人都做得來


    遺憾地，所謂「像創業家那樣思考」，其實和好萊塢電影帶給人們的想像，很不一樣。


    走進今天的校園，你會發現，儘管過去人們總是稱銀行家為「宇宙之主」（Masters of Universe），但比起立志成為投資銀行家的人，立志成為下一個馬克·祖克柏（Mark
    Zuckerbergs）的人，實在多太多 Whilst 不只是因為祖克柏可以穿牛仔褲和連帽衫去上班，或是因為他遠比銀行家更有富，雖然這樣也不錯。更重要的原因是，創業公司提供了一種環境，讓離開學校只有短短幾年的社會新鮮人，能在這種迎合他們價值觀的公司文化裡，建立一份能結合自主性與增加財富機會的事業。在這裡，他們可以奠定基礎，獲得工具，如果有心，有朝一日就可以發展出自己的新創事業。誰能負責備他們受到這種新成功的典範所吸引？在科技發展如此日新月異的環境下，即使今天最具規模、最熱門的行業，都可能在一夜之間變得過時落伍，像創業家那樣思考，才是現在最不可或缺的能力。'
