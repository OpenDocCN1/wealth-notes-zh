  md: '時了。如今這個時代，有誰會想等到退休之後，才去追尋自己的夢想？誰說實現自己的想法，非得要排在工作之後？為什麼不能同時並行，並且在退休後持續享有自己的興趣？


    丹·戈特薩科夫（Dan Gertsacov）才不想等到退休之後，才去做他想做的事。他出生於美國羅德島州，目前定居在哥倫比亞的波哥大，在阿克多納多斯公司（Arcos
    Dorados，麥當勞在拉丁美洲的特許營運商），擔任數位長一職。丹熱愛生活，並且有為谷歌（Google）在哥倫比亞設立分公司的經驗，所以如果我告訴你，他也是個兼職創業家，你應該不會感到意外。他在拉丁美洲投資了數家科技、出版以及電子商務領域的公司，或是擔任這些企業的顧問。因為我們兩個都是Bummy的顧問，所以我有幸親眼看到他運籌帷幄時的英姿。


    雖然丹在麥當勞的工作量已經滿載了（這不是雙關語喔），再加上副業與家庭生活，他仍然有辦法抽出時間，學習廚師的烹飪手藝，度假時也經常在行程中規劃數日參加烹飪學校的課程。在不同的烹飪學校上過不同的烹飪課程之後，丹很確定自己並不想以廚師為業。在空閒或旅行時上課、煮煮東西，是很棒的消遣，但他可不想把每天的時間都花在這件事上。面。因此他找出另一個將興趣與生活結合起來的方法，他決定投資一家叫La
    Xarcuteria的餐廳，這家餐廳是由一位很被看好的主廚所經營。結果這筆投資不但為他帶來額外的財務利益，也讓他的生活更多采多姿。'
