  md: 安於現狀並不是一夜之間養成的<|message|> 心態。沒有人會早上起床後，看著鏡中的自己，然後心裡想著：「我想我很安於現狀。」然後聳聳肩，回到床上，倒頭繼續睡大覺。通
    常這種心態 是在不知不覺中慢慢養成的的。我剛進職場時，曾經接受過二份工作，我當時心裡已經清楚知道，這份工作並不適合我。在聘僱合約上簽下名字的時候，我的胃裡彷彿打了個結，由此更證實了我的疑慮。但由於我
    當時沒有其他 的選擇，而且還得償還一筆鉅額的助學貸款，所以即使心 中不踏實，我還是接 受了這份工作。上班後第三個月的某一天，我一如往常地，在午休時間 躺在桌子底下，打算
    小睡四十五分鐘。就在那時，我突然意識到了，自己逐漸陷入「安於現狀」的陷阱了。隔 天，我就開始找工作，並且很快地做了 宿命的決定｜投入 A I G 的陣營。之後受到全球性金融危機的影響，我發現想換工作並不容易。在如此低迷的後未日
    經濟氛圍下，我算是被困在 A I G 了。 然而這一次，我既沒有做什麼建設性的動作 ，也不打算繼續享受我的午休時光。這一次，我選擇做一個焦躁的人。我動手移走辦公室任何人
    生活跡象的東西，把桌上的書籍、筆記本，甚至照片，都收進櫃子或抽屜裡，直到從大廳看去，四周都是玻璃的辦公室，變得空蕩蕩，什麼都沒有。我這麼做，其實是一種象徵動作，意思
    是把自己從這個職場完全屏去，然後我以「放空」的說法，來反諷這個動作。
