  md: 在彼得·巴洛（Peter Barlow）的成長過程中，從來不曾動過創業的念頭。對一個成長於德州中產階級家庭的孩子來說，唯有學醫和法律才能提供他車票，直達有趣、尊崇而且舒適的生活方式，這就是他想要的。他如願取得法律學位，在一家法律事務所工作多年之後，卻跳入一個快速成長的軟體事業，尋求新的挑戰。之後，他發現公司高層的不當行為，從此萌生退意。在歷經煎熬之後，他對之前任職的法律事務所有了重新的認識和評價，於是他決定重新加入事務所，專門負責航空法規。這份工作對他再適合也不過，讓他勝任愉快。因為從他祖父以來，他的家族成員對飛機都深深著迷。回到事務所之後，彼得仍然時時注意副業的機會。很快地，之前那家軟體公司的一個老同事，邀他一起做豪華房車仲介業務。彼得愛車就像他愛飛機一樣，於是他答應利用空閒時間幫忙，以換取公司股份。公司的業務穩定成長，從此彼得一邊維持正職工作，還能一邊為自己和事務所同事情介好車。就在此時，彼得又跳進另一個宿命的創業活動。他的顧客之一─天空巴士航空公司（Skybus
    Airlines），在美國境內率先推出超廉價航空方案。彼得以為一切都已經就緒，於是接受了天空巴士航空公司的邀請，擔任總顧問一職。這家公司擁有 mines Star
    管理團隊，也募集了超過一·五億美元，怎麼看都不會出問題。可惜，問題就在時間點上。
