  md: 用陌生成銷售的方式接觸到某個人，我就可以選擇附上一篇相關部落格貼文的網址，或是我的自傳網址。我也發現，回應我的郵件請求的比率也因此大幅提高。如果你現在
    Google 我，你會找到各式各樣來源的連結，這些資料全部加起來，就 يمكنك知道我很多事。來自普瑞納的派翠克·麥金尼斯，似乎不再是鎮上唯一的派翠克·麥金尼斯了。你有很多想在某個特定領域公開宣稱你的興趣，要看你對宣傳兼差事業的自在度而定。你可能
    會選擇把線上形象和兼差事業獨立開來，也可能基本上想維持線上的低知名度。無論如何，當你在對別人介紹自己時，還是有幾個基本步驟可以加強你的信用。只要在時間與金錢上小小的投資，就可以買到網域名稱、設定「公司」郵件、訂購名片，甚至把商標設計交給群眾外包。這些資源大部分都免費或很便宜，但會讓一切看起來有如天壤之別。由於這些做法都非常容易，所以我每次收到的名片上印的電子郵件是
    hotmail 信箱、看起來也没什麼價値時，我都會有點意外。當改善這一切是這麼便宜而且容易時，為什麼要讓自己看起來像個業餘的角色？
