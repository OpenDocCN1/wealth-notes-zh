  md: '只要你主動連繫對方，如果一個星期都沒有得到回覆，再試一次，或是打個電話給對方。

    很多忙碌的人不會在第一封請求協助的郵件就回覆對方。他們對鍥而不捨的人會回覆，但對禮貌的人則未必。當然尋求協助與惹人厭煩之間界線，在你處於非經常緊急的情況之下，可能會有点模糊。如果
    你試了幾次，對方還是沒有回覆，那就試試下一個人選吧。他們不 是太忙，

    就是對你不感興趣。不管是哪一種原因，他們並不想成為你的團隊。另外，未來有一天，如 果你考慮用一樣的方式打發某個人，不妨回頭想想自己被這樣對待的那一刻。

    這類嘗試會成功的原 因，通常是你 在請求協助時，對方願意對你表示善意。如果 你需要對方的幫忙，盡量把你的請求說得讓對方覺得自己有點責任。你讓對方越容易幫助你，對方就越可能即使提供協助。例如：你希望對方幫你介紹給某個他認識的人，你的郵件要寫得很簡潔，但要說明這個請求的來龍去脈，還要包含相關的資料。要運用你的自我行銷說詞，讓對方很清楚，你的態度是很認真的。一旦對方願意協助，針對每一個你想見的人，都要寄一封獨立、明確的訊息給對方。盡量讓別人要轉寄你的信，並附上自己的評語時，做起來非常'
  merge: -1
  img_proc: true
