  md: '用，就可以看到你投入的资源效益极大化。如果觉得整合出一个兼差计画，似乎有点不知如何下手，不妨这样想：你现在已经初步检视会影响你的计画的时间、财务资本与智慧资本，因此已经开始了第一步。透过本书记醒，你可以仔细检视每一个资源、规划你的投入程序，并开始动员你的人脉圈。藉由协助你解决以下的问题，我将会陪伴你走过整合出兼差计画的每一个程序：

    你现在可以或未来可以，投入多少时间与财务资本，到你的兼差计画？你要怎么做，才能让这些时间与金钱发挥出最大的效益？

    你要如何找到能让你发挥智慧资本，并把事情做到最好的机会？你要如何利用智慧资本，以充分发挥你的强项？

    你如何蒐集相关的机会，并做出明智的决定？你要如何应用投资程序，去发掘、分析与投入各式各样的案子？

    你要如何动员人脉，让你的兼差计画的每一个环节都进行得更顺利？你如何运用人脉，组建你的团队？'
