    的機會。他做過寶拉·阿芭杜（Paula Abdul）①等名人的電視購物廣告，也參與過豪哥終極烤盤（Hulk Hogan’s Ultimate Grill）的行銷（喬爾，美國感謝你！），所以他知道如何推出新產品。那為何不把這些技能，拿來用在和他自身利益有關的嘗試上？在地下室搞出一個釀酒廠是有點大膽的點子，但經過兩年的實驗後，喬爾和夥伴決定，終究是要面對一直思考的問題的時候了：這個事業會做到怎樣？於是他們做出了一個三年計畫，並嚴格檢視自己的條件。雖然他們已經精通釀造少量啤酒的技術，但沒有經營商業化釀酒廠的經驗。另外，如果不投入更多的時間與金錢，也不能達到他們的成長目標。現在有了清楚的挑戰，他們有很多事要做。首先，他們和每一個可能對事業有幫助的人建立交情，包括釀酒師與經銷商。接下來，他們籌到了一筆資金，以外包給其他人生產的方式，推出了第一批啤酒。市場對他們產品的需求成長很快，於是他們又另外籌到了一筆錢，蓋了自己的釀酒廠。最後，喬爾和另一個合


    ① 美國創作歌手、編舞、舞者、演員和電視通告藝人。'
