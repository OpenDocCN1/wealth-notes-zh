    現在彼得·巴洛已經是律師事務所紐約分所的經營合夥人，他已經完全沒有額外空檔能為silvercar處理任何業務，但他仍然保有公司的所有權，並且在每次公司增資時，都會投入資金。


    在這一章裡你會發現，兼職創業不是只有一種方法。當你具備了一套完整的創業技能，你就可以根據自己的目標和手上可以運用的資源，量身打造適合自己的投資活動。即使彼得選擇放棄全職創業的雲霄飛車體驗，他還是選擇成為兼職創業家。他可以憑藉慧眼，找出能發揮自身優勢的機會，然後投入自己的專業和人脈，最後使點子成真。他是天使投資人（Angel
