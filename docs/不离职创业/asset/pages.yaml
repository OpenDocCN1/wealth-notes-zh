  md: '八〇年代是金融界的黃金時代，於是我們有了電影《華爾街》（Wall Street）和葛登·蓋柯（Gordon Gecko）④，以及主角的經典臺詞「貪婪是件好事」（Greed
    is good）；現在我們則有電影《社群網戰》（The Social Network），以及 HBO 出品的影集《矽谷》（Silicon Valley）。就像雅痞、時尚人士一樣，創業家也成了一種類型的人。隨著時間一年一年過去，創業家依然是吸引眾人眼球的焦點，也總有辦法一再翻新炒作的話題。隨便拿一本以創業為主題的雜誌，或是瀏覽一些有關新創公司的部落格，你就會發現，文章中描述的創業家幾乎都具有類似的特質：行事獨立、才華洋溢、焦躁不安、極具創新力，彷彿沒有任何缺點。這個別訊息非
    常明確，創業家是一群新的先驅者，是一群預見未來的戰士，他們組成一支無所畏懼的大軍，將賺進數量難以估計的財富，也將主宰未來。

    你所見證的這種現象，我把它稱為「創業有限公司」（Entrepreneurship, Inc.）。憑著創意和膽識，這些「創業有限公司」的負責人，把一件更接近努力打拚，而不只是光鮮亮麗的人類行為，在產品化和品牌化方面，做  非常了不起的貢獻。社會大眾也因此對白手起家這件事，抱著一種扭曲而浪漫的概念。創業園區心知肚明，把創辦公司的真實過程展現在大眾


    ④ 電影《華爾街》中一位有錢且不擇手段的投資大亨，最後因內線交易而入獄。'
