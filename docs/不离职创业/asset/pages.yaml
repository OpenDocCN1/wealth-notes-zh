  md: 機制。下一步則是針對每一次的行動或嘗試，你可以透過聚焦的透鏡自問：這件,count has 運用到我的強項嗎？拿羅伯托·里特斯（Roberto Rittes）的例子來說吧。羅伯托並不會迴避問題的人，即使他花了很長的時間才想出方法要如何把創業活動整合到職業生涯中。他曾經去過一百多個國家，也曾經是巴西聖保羅州的翾板冠軍。雖然他喜歡尋求刺激，但他從來不想成為全職的創業家。他偏好比較穏定、可以預期的生涯，因此選擇的企業工作是財務與行銷，直到的在巴西與南美洲最大的電信公司O2找到工作。這家公司內部育成了一家行動支持公司O2。Paggo，身為這個公司的總經理，他有機會在既有的產業龍頭辦公室內營運一家新創公司。這個工作經驗非常有變化，因此讓他培養出全新的智慧資本。雖然花了一些時間才讓他找到立足點，但他自然而然變成一個兼職創業家，現在他的眼界也因為創業的刺激而打開了。他以創辦人的身分探索了幾個點子，但沒有找到一個讓他真正感受到興趣的點子。他也發現，如果你正經營一家剛剛成立的新公司，就很難有時間到世界各地去尋找事業機會。於是羅伯托選擇以天使投資人的身分分散賭注，投資在能發揮他的強項與熱情的公司。他本身是個熱愛設計師的粉絲，所以他資助一家零售商把負擔得起的設計師家具引進巴西，並與當地的製造商成為夥伴關係。身為天使投資人，他運用自己在財務
