  md: '忙，沒有收費。一定有什麼方法，可以把我擁有的人脈轉化成錢脈吧。


    「我對現在的工作已經沒有熱情，但又需要這份薪水，不能離開。我實在不想在日後心生後悔，但也不知道有什麼方法，可以擺脫現在這種一成不變的困境？」


    以上的訊息，都有一個共同的主題：我們想要的更多。我們想要結交新朋友、嘗試新點子、把我們的人際關係和專業知識轉化成金錢、和別人一起協力解決問題、成為某個事業或計畫的一分子。最重要
    的，不論是在專業上，還是在個人成長上，我們都希望能持續學習與成長。我的副業中的每一筆投資，帶給我的回報，早已超過金錢本身的價值。因為在這過程中，我遇到了一些很棒的人、學到了一
    些很有用的技能，並且盡我所能地做出貢獻，幫助那些勇敢實現夢想的創業家，將事業做得比我還沒有參與時更成功。財務規劃公司喜歡在廣告時，一再宣揚事先做好完善退休計畫的諸多好處。如果仔細看就不難發現，在這一類的廣告裡，總是會出現一些面帶微笑的退休人士，他們一輩子汲汲營營，至此總算功成名就，也累積了豐富的人生經驗和智慧，終於可以開始真正享受生活，做自己想做的事。但每次我看到這樣的廣告，總是很不以為然，因為這樣的觀念早就已經過…'
