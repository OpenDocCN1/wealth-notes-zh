  md: '# 擁有自己的事業，創造有利益的機會


    創業的核心價值就是擁有屬於自己的事業。你可以幫別人打工，一年又一年領了一筆又一筆的薪水，但是如果你手上沒有公司的股份，光靠薪水累積的財富是很有限的。我剛進投資公司的时候，一個同事要我坐下來，他向我解釋，身為公司的職員，公司的每一筆投資，我都能分到一小杯羹。他很認真地對我說：「派翠克，這就是所謂的」一給再給的禮物」。

    我當時不太能理解他的意思。除了堆衣物和一些小玩意之外，我似乎不曾真正擁有過什麼，更別說擁有一家公司的一部分了。這樣到底有什麼好處呢？「這麼說吧！」我的同事繼續說：「即使將來你離職了，五年或甚至十年之內，還是可以收到公司寄給你的紅利支票。」這就是擁有一家公司股權的價值。只要你擁有它，它就永遠都是你的，說不定什麼時候，就會帶給你意外的好處。

    當一個兼職創業家，你可以規劃出一個包含各種經濟活動的投資組合，這就是所謂的「二給再給的禮物」。如此一來，你就可以藉由其中有潛力的事業或計畫，累積經濟利益，經過一段時日之後，你的投資就能產生可觀的回報。但切記，這是一個長期性策略，不要期望能因此在短期內暴發致富。雖然有時候的確會有二、一、二筆投資項目，在短期內就產生'
  merge: -1
  img_proc: true
- pgno: 55
  md: 了可觀的利潤，但那並非常態。你的目標是一邊做你喜歡的事，並在長時間後能產生真正的價值。不管是投入時間或精力以創造有利益的機會，這些都能讓你得到真正的財務回報。再拿
    Bunny 的例子來看。幾年前，我遇見亞歷山大的時候，他邀我加入他的公司擔任顧問。在下一章你會讀到，顧問的工作是以投入的時間或勞力，換取公司的股權做為酬勞。交易的內容很簡單，在二年內，我每個月份花一個小時和該公司的高層主管共事，公司就給我
    ○·五％的股權。我和 Bunny 的關係，建立在公司的執行長對我的信任，他們相信我能夠持續對公司提供經營策略、管理建議和人脈方面的協助。根據協議，我需要投入的時間，符合我設定的一○％的範圍內；對該公司來說，他們可以從我在其他九○％的專業生涯裡所累積到的知識、人脈與獨特觀點中獲益。這樣的共生關係，不管是對我的個人成長或財務上，都很有大的收穫。不論你投資的是時間還是金錢，持有某家公司的股權，就是讓你取得創造有利益機會的門票。如果你不曾採取任何行動，就永遠不可能有這樣的機會。以金錢來衡量，會是個怎麼樣的概念？如果你相信《經濟學人》（Economist）的估值，那麼我所擁有的公司股份，今時今日已經有將近二十五萬元美市值，而且還有很大的增值空間。以我所投入的時間和精力神來說，這樣的回報實在是相當美好，特別是以每小時為單位來計算時，更是如此。
