  md: '因此，本書的主要內容就是描述這些成長長方式的成功機率、持續時間、投資重點、關鍵細節等。此外，我們還有搭配一系列的財報選股工具，協助你找到具有成長契機的股票。


    本書雖然表面上在講成長股，但實際上就是一本講「產業分析」的書。市面上講財報分析的書非常多，講產業分析的書卻是鳳毛麟角，若你也認為產業分析是投資中重要的一環，相信本書不會讓你失望。


    最後，再次謝謝大家長久以來的支持。


