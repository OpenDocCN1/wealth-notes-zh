    # 「黑奧」隱原材料走強，出貨巴西的廠商受衝擊


    原材料走勢在 2011 年出現高點後，隨即快速滑落，對台灣這種不靠原物料出口的國家影響不大，但對靠原物料出口吃飯的國家來說就刮大風了，像是金磚四國中的巴西、俄羅斯等。以巴西為例，咖啡、可可、甘蔗、玉米、大豆等產量都是世界之冠，畜牧牛隻數量、鐵礦砂出口、鋁出口量也是排名全球第


