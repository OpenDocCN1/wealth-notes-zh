  md: '歐買拉在營收高達的 2011 年，每股稅後盈餘（EPS）超過 10 元，股價也飆升至接近 300 元，但隨後由於營收衰退，獲利與股價也跟着坐溜滑梯，2014
    年甚至出現超過 10 元的虧損！


    為何歐買拉在 2011 年時可以營收飆升、EPS 超過 10 元呢？原來 2011 年同時有多款大作推出，包括《聖魔之血》、《伊達傳說》、《新功夫世界》等，再加上又有晉中海洋南航空建置雲端娛樂平台的營收認列，導致當年度營收調高。


    但由於線上遊戲的生命週期一直在縮短，一般來說，推出 3 個月後，營收貢獻就會快速下滑，再加上遊戲平台建置收入又屬一次性認列，這樣的成長性能否帶到 2012
    年，在當時應不難判斷。


    # 季營收》較前一季、去年同季大幅成長


    如果只用年的角度來看，可能會錯過一些靚股，因為若營收在第 1 季就大幅成長，等到年報公布再來篩選就遲了些。所以我們可用季的角度，來找出季營收大幅成長的公司！


