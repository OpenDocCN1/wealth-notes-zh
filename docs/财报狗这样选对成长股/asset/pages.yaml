    # ◎低成本推升毛利，車用連接器廠吃香——以胡連為例


    胡連（6279）是生產車用連接器的廠商，產品包括端子、塑膠套件等，主力市場鎖定在中國，占總營收已超過 50%。胡連鎖定的客戶多半是中國自主品牌車廠，像是長安汽車、長城汽車、上汽通用五菱、比亞迪、北汽銀翔、東南汽車等，由於中國自主品牌近
    year 年成長性不錯，胡連自然也跟着受惠，並在 2009～2014 年創下營收複合成長率 14.6% 的佳績。


    至於毛利率部分，由於原料成本占胡連總成本超過一半，而原料中又以銅占比最大，約占原料成本的一半，因此銅價走勢對胡連毛利率有關鍵影響。由於銅價在 2011 年起走跌，胡連的原料成本開始下滑，毛利率在
    2012 年起開始上升，2014 年已創下近三年毛利率新高（詳見圖 10A），2015 年上半年繼續攀上高峰。由於毛利率往上走，費用率又控制得宜，胡連 2009～2014
    年稅後淨利複合成長率達 20.4%，優於營收成長率（詳見圖 10B）。


