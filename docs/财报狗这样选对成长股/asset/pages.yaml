    市場減少為 3 大集團之後，競爭狀況明顯減緩，廠商也不再大舉投資新技術與新設備。由於投資情況改善，2012 ～ 2013 年時 DRAM 售價甚至還上升，也讓大部分廠商家
    2013 年時開始轉虧為盈。


