  md: '做自動化設備的廠商有一個共通特性，就是客戶集中度相當高。根據 2012 年的年報顯示，6 家公司的最大客戶占公司總營收的比重，平均竟高達 41.9%！其中最高的是東捷的
    78.4%（客戶為群創），陽程也是高達 62.9%（客戶為鴻海）！


    除了客戶集中度高外，這些大客戶的下單量也相當不穩定，此為資本支出產業的特性。從整體產業來看，2009 年受金融海嘯影響暨利全數資退（金融海嘯在 2008 年就發生，但設備股的營收會落後景氣
    1 年左右），而 2012 年除了陽程外的 5 家公司也是出現同步衰退走勢（受 2011 年歐債危機影響），可見景氣對此行業影響之深（詳見圖 8）。


    # 陽程、盟立成功轉型，未轉型者徘徊損平邊緣


    看到這裡讀者可能會很納悶，為什麼前面提到的自動化關鍵零組件、工業控制器的公司獲利都不錯，而這些工業自動化設備公司卻時常虧損呢？這是有其歷史因素的。


    原來 2007 年時陽程、盟立、東捷、均豪等 4 家公司的營收當中，有超過 50% 都來自於面板自動化產品；廣運、高橋的面板相關自動化產品也是超過 30%。2008
    年前是台灣面板產業的快速擴廠期，加上面板生產需高度自動化，所以 6 家公司先吃台灣面板廠的訂單就飽了。2006 年是這些廠商最燦爛的一年，6 家公司沒有一家賠錢，且平均
    EPS 竟高達 5.9 元。但 2008 年金融海嘯後，台灣面板產業受到中國競爭而出現嚴重衰退，6 家公司的面板訂單也大幅萎縮。


    在這樣的大環境下，考驗的就是廠商能否轉型成功，生產其他自動化設備。'
