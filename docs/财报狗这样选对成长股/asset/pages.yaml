  md: '最常被拿來當大數據正面教材的，就是網路影音串流平台「Netflix」。Netflix 平常會蒐集大量的用戶資料，包括用戶地理位置、社群分享狀況、收視喜好與習慣等，計算出相當多的關聯資料，進而推測用戶的喜好，並推薦影片給用戶，以提升訂閱率、續約率等，甚至可以預測某部影片是否會受歡迎。例如
    Netflix 透過大數據分析，發現英國改編自同名小說的影集《紙牌屋》（House of Cards）劇情 + 導演大衛芬奇（David Fincher）+
    知名演員凱文史貝西（Ke vin Spacey）的組合，可能會受到用戶的歡迎，進而推出美版自製影集《紙牌屋》，果然一炮而紅；2013 年 2 月上映之後，訂戶與營收獲利都因此大幅成長。總之，大數據就是經由大量的資料分析找出關聯性，進而挖掘出潛在商機。


