- pgno: 13
  md: '政策 的影響。


    本篇第 1 章講的是國內法規對公司的影響，相對單純；第 2 章講的則是反傾銷、反補貼、反壟斷等法規對公司的影響，比較偏貿易戰；第 3 章講政策的扶植與打壓，是人治國家（如中國、俄羅斯）較常出現的狀況。如果公司能跟對法規趨勢，符合政府的發展方向，短期成長性無虞；但若違反法規，或是跟政府對著幹，那麽業績衰退也是遲早的事了。


    # 第4篇 從客戶經營績效找成長股


    前面 3 篇講的都算是整體產業趨勢，可能是由供需產生，也可能是法規產 生。其實公司要成為成長股，不一定要搭上產業趨勢，只要客戶狀況不錯，一樣可跟著吃香喝辣。此類成長股可分成幾種形式，第
    1 種是客戶本身大幅成 長，第 2 種是客戶提高下單比重，也就是客戶滲透率提高；第 3 種是公司打 入新客戶；第 4 種則是公司客戶所處國家的景氣好轉。只要以上情況出現，
    公司就有成為成長股的潛力。


    # 第5篇 從獲利關鍵因子找成長股


    當前面 4 篇講的趨勢發生時，公司的營收就有向上成長的潛力，但其實公 司要成為成長股不一定得靠營收成長，只要獲利率能夠改善，同樣能脫穎而出。 獲利率要改善有幾種方法，第
    1 種是人工成本下降，第 2 種是原物料成本下 降，第 3 種是製程的良率與效率改善，第 4 種則是靠匯率的幫忙。只要以上 4 種情況出現時，就算營收沒有顯著成長，公司還是有機會成為成長股。


    # 第6篇 從投資成果找成長股


    要成為成長股，投資也是一種方式。投資方式可分好幾種，最簡單的就是債'
