  md: '股，產能增加後，營收就有增加的機會；第2種則是靠發展新事業，若事業發展成功，就可以為公司帶進營收與獲利；第3種則是靠投資小金融，只要子公司發展不錯，同樣可挹注母公司獲利；此外，若公司轉投資事業營運不順，獲利就會受其拖累，若公司能壯士斷腕地處分該虧損事業，短期獲利將出現成長契機。


    # 第7篇〉從財報挑成長股


    要找出成長股，除了像前6篇以產業的角度切入外，也可使用財報獨的選股工具。我們可以營收、毛利率、費用率3個角度切入，篩選找出具長期成長爆發力的公司，也找出具長期成長動能的公司。此外，我們也篩選出顯露衰退的公司，若衰退是受到短期事件影響，股價也跌破應有的價值，可能就是難得的投資機會了。


    # 實際投資時，仍應全面評估公司狀況


    最後提醒大家，「成長力」只是投資的一個面向（也可說是很重要的一個面向），並非看到公司出現強勁成長力就大舉買進。實際投資時，還是建議大家以《財報狗教你挖好股穩賺20%》所介紹的SOP——獲利性分析、安全性分析、企業價值評估、成長性分析等4步驟來評估公司的投資價值與買賣時機。如果公司的獲利不穩、安全性又差、股價又高，就算公司擁有絕佳的成長力，投資人賺錢的機率還是相當高的。


    簡單講，本書主要是補足了《財報狗教你挖好股穩賺20%》的不足之處，讓我們的分析SOP更為完整。'
