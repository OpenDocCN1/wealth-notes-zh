    70%。主要客戶就是歐美的零售商。


    從月營收來看，飛捷在 2011 年 12 月 ~ 2012 年 1 月時，營收出現短暫回落，不過在 2 月後營收就出現顯著回升，往後期間飛捷的營收就開始穩定成長了（詳見圖
    8A）。原來，飛捷的五股舊廠早已面臨產能不足的問題，故於 2010 年購入林口土地，2011 年開始建設新廠並於年底完工，並於 2011 年 12 月 ~
    2012 年 1 月進行遷廠事宜，導致這段期間出貨受到影響，營收也跟著衰退，所幸工業電腦的硬體製程不算複雜，2 個月完成搬遷動作後，營收即回復正常水準。'
