    的角色。常用的被動元件有電阻（可用來限制電流）、電容（可儲存或釋放電能）、電感（以磁場方式儲存或釋放能量）等。


    奇力新（2456）是台灣最大電感製造商，但全球市占率只有 5%，仍遠落


    後於日本大廠。從奇力新近 8 年的獲利走勢，可發現有 2 波高峯（詳見圖 4），


    第 1 波是 2009 ~ 2010 年，當時從金融海嘯復甦後，不少小廠到關閘或關廠，


    電感產業供不應求，導致產品價格上升，此時奇力新獲利提升與 2G 轉 3G


    關聯性不大，因此時奇力新才剛切入手機電感。'
