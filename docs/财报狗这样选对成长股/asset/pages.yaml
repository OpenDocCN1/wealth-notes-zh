  md: '不過有趣的是，電子書組裝廠振曜除了 2011 年獲利短暂下滑後，2012 ～ 2014 年都處於高獲利的狀態，這是為何呢？原來振曜後來看到了平板興起的趨勢，所以沒有死守電子紙技術的電子書，而是做了多款結合平板功能與電子紙的利基型產品，獲利反而再創新高。


