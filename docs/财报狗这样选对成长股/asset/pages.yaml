    # 線上遊戲與社群市場，行動市場分食


    # ◎崛起：手機遊戲與社群（Rovio、line）


    智慧型平板最吸引人的地方，就是有各式各樣好玩或實用的 App（行動應用程式），而且多半是免費的，使用者只要動手一指就可下載最新流行的 App，無論是遊戲、社群，或是商業、工具、教材、新聞、美食、運動、醫療、音樂……等，只要廠商能開發出一款暢銷
    App，就能因此一炮而紅；賺進大把鈔票。


    像是創史上最暢銷遊戲 App「憤怒鳥」的芬蘭遊戲開發公司 Rovio，還有亞洲最多使用的即時通訊社群軟體「line」（為日本公司，母公司位於南韓）。其中，line
    因為有龐大的即時通訊使用者為後盾，事業版圖也跨入遊戲、電商市場，並持續大張旗鼓地擴編。至於以遊戲開發為主的 Rovio 公司，則因為憤怒鳥潮褪去，且無法創造下一款爆紅遊戲的情況下，近年不斷傳出裁員消息。


    # ◎衰落：桌機遊戲與社群（網龍、宇峻、尚凡）


    既然手機 App 大受歡迎，就代表有公司倒楣了，那就是開發傳統桌機程式的開發商或營運商。在智慧型手機與平板流行前，使用者玩的遊戲多半是大型遊戲開發商如網龍（3083）、宇峻（3546）等台灣老牌遊戲公司所開發的
    MMORPG（大型多人連線角色扮演遊戲），這兩家公司的 EPS 都曾衝上 10 元，股價也都站上 400 元過。


    不過自從智慧型手機與平板興起，遊戲使用者花愈來愈多時間在 App 遊戲上，減少了桌機遊戲的使用時間跟消費，網龍與宇峻的獲利與股價在 2011'
