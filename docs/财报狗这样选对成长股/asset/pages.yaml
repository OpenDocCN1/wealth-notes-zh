    # 轉換期帶來的高成長，通常只維持1～2年


    從以上5個產業的歷史獲利走勢可發現，在每次規格轉換時，只要公司能打入新規格供應鏈，公司獲利就可出現顯著成長，但也有例外，像是電信產業從2G到3G時獲利提升，但3G到4G時就沒有。此外我們還可發現，在每個轉換期時發生的高成長性，通常只是1～2年的短暫現象，等到轉換期過後，成長性即消失，甚至會出現衰退走勢，若是把轉換期的高成長率當作長期成長率，而給予公司過高的本益比評價，投資人可是會吃大虧的。切记。'
