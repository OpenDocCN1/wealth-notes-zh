  md: '# 【圖解查詢】近一年營收成長大於20%標的


    點選財報狗網站 (statementdog.com ) 頁面上方的「選股」，再點選左欄中「財務數據」頁下的「成長力條件」，接著，再選擇其中的「營收成長率」，將「每股營收年成長」設定為「近一年數據大於20%」，將此條件加入右方的選股條件後，按下「開始選股」，即可完成篩選。


    ![](img/4bf7511fb1c30a95adda06bdc082e628_313_0.png)


    資料來源、整理：財報狗


    能否具有持續性、能持續多久等。我們來看正面與負面的例子：


    # ◎正面案例】F譜瑞：2010年營收高成長，且能持續驅動能


