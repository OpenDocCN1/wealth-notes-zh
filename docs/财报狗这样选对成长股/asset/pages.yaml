  md: '# 營業費用率降低

    順勢提升獲利


    本業獲利要改善，除了前面介紹的營收成長、毛利率改善外，還有一種方法，就是靠營業費用率（以下簡稱費用率）的改善！只要費用率能夠出現持續下降趨勢，獲利也能夠長期改善。接下來，我們要協助大家學習找出費用率出現改善契機的公司，並從中找出投資機會。


    最常見的費用率選股法，就是選出費用率大幅下降的公司，其中又可分成「單期費用率顯著下降」、「多期費用率連續下降」兩種。另外，則是找出費用率顯著上升的公司（詳見
    7-7），這些方法都有投資機會可尋。


    當公司的單期費用率出現顯著下降時，就代表公司可能出現獲利改善的機會，可分成「年」、「季」等兩種觀察情境：


    # 年費用率當年度的費用率較前一年下降


    當公司的年費用率較去年下降了超過 3 個百分點時，就代表公司當年度的費用率出現了顯著的改善，可使用選股工具將其篩選出來（篩選方法詳見圖 1，同樣地，費用率下降的差值，不一定要設
    3 個百分點，可視個人喜好與需'
  merge: -1
  img_proc: true
- pgno: 349
  md: '求調整）。接著要進一步確認公司當年度的費用率改善原因為何？並判斷是否具持續性、能持續多久等。


    # ◎案例】臺晶：研發有成，研發費用縮減導致費用率降低


    臺晶（3057）是生產各式儲存設備的製造商，產品組合以多媒體儲存設備佔營收近50%最高，主要客戶是蘋果公司；再來則是雲端儲存設備的40%左右，主要客戶則是需要雲端架構的各大公司，像電信公司、政府機關等；另外監控設備也佔10%左右，算是近期新發展的產品。至於出貨地區，以美洲約50%最高，另外歐洲與亞洲都約各佔20%左右。


    # 图解查询》年度营业费用率较前一年减少3个百分点


    在“财报狗/P”中，选择“营业费用改善筛选”，设定“年度营业费用率”为“较前一年减少3%”，然后将此条件加选右方的避险条件。


    ![](img/4bf7511fb1c30a95adda06bdc082e628_349_0.png)


    资料来源、整理：财报狗'
