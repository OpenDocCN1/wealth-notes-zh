  md: '# 3)結論暨建議


    當公司發展新事業，尤其是風險較高的全新領域時，虧損的機率自然較高，且要是投入太多資源的話，甚至可能拖垮公司。所以當公司發現此事業虧損持續超出預期，且已經嚴重影響到公司的財務體質時，就應該開沉沒成本，做出對公司永續經營最正確的決定---結束虧損事業。


    +   - **◎榮化：回冲超額認列的虧損，股價還沒滿**


    榮化 (1704)是台灣的石化大廠，產品線相當廣泛，包括熱可塑橡膠、溶劑、甲醇、聚丙烯 (PP)、銅箔等。榮化的石化本業獲利算是相當穩定，因此觀察重點是在榮化轉投資的福聚太陽能。


    榮化在 2007 年時與億光合資成立福聚太陽能，是台灣第 1 座太陽能多晶矽廠 (多晶矽為太陽能上游主要原料)，榮化持股約 64%。福聚在 2010 年之前的虧損還在可控制範圍，每年約
    1 億元上下；但 2011 年後太陽能產業急轉直下，太陽能多晶矽價格跟著暴跌，福聚太陽能就 2011 年虧損達 11 億元，2012~2013 年虧損都在
    27 億元上下，2014 年虧損暴衝至 88 億元！


    由於福聚太陽能 2011 年後虧損持續擴大，拖累到榮化的獲利，榮化在 2007~2011 年 EPS 還可維持在 2.5 元以上，2013 年已轉為虧損，2014
    年虧損已接近 10 元；導致榮化的股價從 2010 年最高點 80 元以上，跌至 2014 年最低點不到 13 元 (詳見圖 5)。


    福聚太陽能由於狀況極差，曾向法院申請破產重整，不過沒有通過，榮化也只有繼續提列虧損。而福聚太陽能在榮化資產負債表上的帳面金額不但早已歸'
