    # 狀況3》客戶分散供應商


    如果公司所有的產品都交給某個供應商生產，不但價格不好談，且當供應商生產出狀況時，恐怕也只能乾着急了。有鑒於此，當公司的銷售量成長到一定程度時，就會開始培養第
    2、甚至第 3 供應商來解決上述問題，即所謂「分散供應商策略」，最有名的例子就是蘋果公司，執行長庫克（Tim Cook）上台後就開始力行分散供應商策略。


    # ◎和碩：遠違蘋果分散供應商，獲 iPhone 訂單獲利增


    和碩（4938）在 2010 年之前還是華碩旗下的子公司，負責製造業務，應華碩客戶要求而與華碩分家，獨立成 3C 產品代工廠，2010 年 6 月正式掛牌上市。由於獨立後不能太依賴華碩的訂單，必須找其他大品牌來彌補產能，此時蘋果正欲實施分散供應商策略，與和碩可以說是一拍即合，於是和碩就開始代工蘋果
    iPhone 產品。


    2011 年時和碩小量生產 iPhone 4，由於初期良率不佳，2011 年時和碩獲利大幅衰退至掛平邊緣；不過 2012 年生產小量 iPhone 5 時已較上手，獲利已回到之前水準，2013
    年的 iPhone 5C 則讓和碩的 EPS 超過 4 元創下歷史新高，而 2014 年時已拿下 iPhone 6 約 40% 的比重，獲利更上一層樓，EPS
    超過 6 元！2015 年前 3 季獲利也維持年成長。


    這樣的獲利表現，讓 2013 年底僅有 38 元左右的股價，從 2014 年起一路上漲（詳見圖 4），2015 年 7 月最高漲至 98.4 元。'
