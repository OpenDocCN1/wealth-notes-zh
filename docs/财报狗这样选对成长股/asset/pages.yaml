    60%。由於 KTV 在台灣已是成熟產業，較劣性競爭狀況，好樂迪與錢櫃原本計畫合併，錢櫃先透過投資公司買入好樂迪超過 32% 的股分並計畫收購，但被公平會擋了下來，於是好樂迪於
