  md: '# 踩「雙反」、「反托拉斯」地雷


    若法規,描述得得很清楚，廠商們都很容易遵行，那就沒什麼問題；但若法規描述得含模糊地帶，或是有公司便是要違反法規，那就會產生官司問題了。跨國官司當中，最讓企業與投資人聞之色變的有2種……「雙反法」與「反托拉斯法」。


    我們在3-1-提到的法規，多是由各國政府為自己國家制定的，較不具爭議性；而另一種型態的法規則是跨國的，政府為了保護自己國家產業的利益，就會訂立一些嚴苛法規，並接受國內廠商的檢舉來調查這些國外大廠（當然也可能是國內，但較少）是否有違規的情形，其中最著名的就是雙反法與反托拉斯法。


    由於這些所謂的「法規」，都是各國維護自身利益的展現，也就是誰的國力強，誰就最能貫徹這些法規。所以，目前雙反與反托拉斯的執行最強勁的，自然就是美國了。


    # 雙反法》台灣輪胎與太陽能產業雙雙受創


    雙反法即為「反傾銷」與「反補貼」。「反傾銷」是指，A國大量出口某商品到B國，而此商品在B國的進口價格低於「正常價格」時，就會被認定為'
  merge: -1
  img_proc: true
- pgno: 140
  md: '傾銷，正常價格一般是指 A 國國內此商品的銷售價格。由於這樣的行為會影響到 B 國的相關產業，B 國就可針對此商品的進口價與正常價的差額，課徵所謂的「反傾銷稅」。


    「反補貼」則是指 A 國出口某商品到 B 國，若 A 國政府對此商品以直接或間接方式補助，導致 A 國的商品相對於 B 國有不公平的優勢，B 國就可對 A
    國的此商品課徵「反補貼稅」。


    雖然反傾銷與反補貼都是 WTO（世界貿易組織）允許的貿易壁壘方式（國家對外國商品進口的貿易限制），但看以上定義就知道，這當中存在了很大的模糊空間，也因此演變成貿易戰爭的一種形式。此外，從法院接受到傾銷、


