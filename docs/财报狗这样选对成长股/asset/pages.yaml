  md: '# 降空汙》淘汰落后產能，鉛酸電池受規範


    ○受影響台股：鉛酸電池（廣隆）


    中國於西元 1990 年起改革開放，工業快速發展，但環保意識與法規卻相對薄弱，導致空汙嚴重，毒害已成了多數中國人的夢靨。要如何才能降低空汙呢？降低汽車的排放量是一種方式（詳見
    3-1），此外，由於中國各省各自主導政，導致各大重工業如鋼鐵、煤炭、水泥、造紙業等均有產能過剩的現象，這些過剩的產能不但造成資源浪費、供需失衡、企業債負高築，也成了空氣汙染的幫兇。


    因此，淘汰落後產能已成為中國勢在必行的政策了。近年來，中國政府陸續對電力、煤炭、鋼鐵、水泥、有色金屬等產業做調控，淘汰落後產能，鉛酸電池是一個例子。


    廣隆（1537）是鉛酸電池製造商，主力產品 UPS（不斷電系統電池）占營收近 80%；其他產品還有機車、汽車用電池。廣隆的 UPS 行銷全球，擁有全球 5%
    左右的市占率。


    有別於一般鉛酸電池生產商都在中國，廣隆則早在 1996 年就前往越南發展，這使得相對於中國競爭對手而言，廣隆擁有較低的人工成本優勢。


    觀察廣隆的營收走勢，可看見處處有中國政策影子在。廣隆在 2006 年開始大幅成長，主因當時中國鉛酸電池設備競爭激烈，並造成不小汙染，因此中國政府取消了鉛酸電池
    13% 的出口退稅，中國廠商競爭力下滑，工廠在越南的廣隆就順勢擴大市占率。'
