  md: '為了解讀成長股的祕密，時報狗投入巨大心力在分析國際金融變動、產業競爭與法規更迭對公司的影響。過去成功的企業，不代表未來會繼續成功；但成功的邏輯，卻經常一再重複。讀者看完本書，你可以忘掉所有公司的名字，因為他們是過去的贏家或輸家；但你一定要記住他們成功或失敗的原因是什麼，因為金融市場的歷史總會一再重演，只是角色換上新名字而已。


    雖然投資一定要自己做功課，但一本好書在手，可以大大縮短投資人做功課的時間，葉蒂時銀袍上碧碧落下的寬簾，台灣的成長產業，其祕密不敢說畫納本書，但也稱得上是十中八九。對基本面選股者，本書絕對值得列入案頭必備參考書，大家別錯過了啊！


