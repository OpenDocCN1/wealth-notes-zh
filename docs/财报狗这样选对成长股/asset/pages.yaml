    如果公司所處的產業持續升級，而公司的技術又持續領先同業，那麼公司滲透率即可持續提高，像是鏡頭產業就是一例，由於手機鏡頭持續升級，大立光(3008) 的技術領先（詳見
    1-2），所以在蘋果智慧型手機 iPhone 的滲透率就不斷增加。


