  md: '# 狀況3客戶發表新產品


    有些產業的消费需求，會與某些品牌大廠發表新產品的節奏有很大的相關性，這種情況最常發生在電子產業，像是著名的蘋果智慧型手機 iPhone 供應鍵。我們這邊舉另一個例子——伺服器供應鍵。


    # ©川湖：營收隨英特爾伺服器CPU上市而呈現週期性


    川湖（2059）原是生產辦公室設備零組件的廠商，2001年時以相關技術與專利切入伺服器導動，客戶包含各大伺服器品牌廠，像是IBM、惠普（HP）、戴爾（Dell）等，伺服器導動占總營收約
    70%。值得一提的則是，這些伺服器導動的毛利率竟超過 50% !


    一般人可能會認為，不就是導動嗎？有何難度在？其實，伺服器導動相當於數據中心的骨架，上百台機器堆疊在機架上，必須能被輕鬆地抽出，如果導動沒有做好，可能會在移動時造成伺服器摔毀，那就得不償失了！所以廠商寧願花多一點錢，購買品質好、精確性高、耐用性佳，且經過長時間測試與認證的產品，毛利率自然就低不了。除了伺服器導動外，川湖也在
    2008年時切入了廚具導動市場，已占營收比重 25%，成長相當迅速。


    川湖在 2007～2014年間營收穩定成長（詳見圖 6），7年營收複合成長率達 11.5%，而稅後淨利複合成長率也高達 16.2%，高於營收成長率，主因川湖的毛利率從
    2007年的 48.2%上升至 2014年的 54.9%，是川湖產品逐漸往高端發展的證明。


    川湖的營收可以維持高成長，主因 2 大產線伺服器導動、廚具導動的市场'
