    自動化設備組織腦就是最後的組裝廠，把前述的各種自動化設備關鍵零組件、工業控制器、機牀設備等元件組裝起來，並安裝軟體，使自動化設備可開始運作，台灣的自動化設備廠主要有
    6 家：陽程（3498）、盟立（2464）、廣運（6125）、高橋（6234）、東捷（8064）、均豪（5443）。


    **大客戶占營收比重高為各家共通特性**


    自動化設備聽起來是個很新的產業，但台灣自動化設備公司都已營運運數十了。雖然都是做自動化設備，但設備類型都不太一樣。盟立主要做的是資訊系統設備與機器人，廣運、高橋主要做物流自動化系統，而東捷、均豪則是做面板相關的自動化設備為主，而陽程的產品線較廣，包含了
    PCB（印刷電路板）、面板、環境、註類、3C 產品等自動化設備。'
