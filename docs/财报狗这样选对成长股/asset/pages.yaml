    若我們在2010年篩選出了這家公司，那有辦法判斷它的持續性嗎？有的，因為F.譜瑞的eDP是用來取代IVDS（低電壓差動訊號傳輸）架構的；與傳統的IVDS相比，eDP架構不但可以讓NB與行動裝置做到較省电，也可以做到更輕薄，不過在2010年前，只有蘋果的部分NB使用eDP架構。


