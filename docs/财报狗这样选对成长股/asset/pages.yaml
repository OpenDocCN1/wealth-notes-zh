  md: '爛到不行的產業，大伽競爭者不堪長期虧損只好選擇退出。


    # ◎華亞科：DRAM產業洗牌，擺脫股價競爭轉虧為盈


    在 2007 年之後的幾年，若提到「爛到不行的產業」，很多人都會直接聯想到 DRAM（動態隨機存取記憶體）產業。以 DRAM 廠華亞科（3474）為例，2008
    ～ 2012 年每年虧損，這 5 年間就賠了超過新台幣 800 億元！2012 年 11 月股價最低跌到只剩 1.97 元。


    就當大家都覺得撐不下去的時候，擁有全球 15% 市占率的日本第 1 大廠爾必達（Elpida）率先倒下，在 2012 年 2 月申請破產保護，同年 5 月時被美國大廠美光收購，全球的
    DRAM 產業也由原本的 4 大集團降為 3 大集團：


    +   1. 三星（Samsung）集團：市占率約 35% ～ 40%。

    2. 海力士（SK Hynix）集團：市占率約 25% ～ 30%。

