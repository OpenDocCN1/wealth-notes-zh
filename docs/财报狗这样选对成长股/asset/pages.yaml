  md: '你不用直接購買，也可以享有使用的權利。業者可以把設計好的平台放在互聯網上，使用者也可以使用智慧型手機隨時隨地掌握最新資訊。我們就舉兩個大家較熟悉的產業為例，來說明共享經濟的發展。


    # ◯【範例】：共享乘車服務，Uber為代表


    可能影響台股：傳統計程車產業，如大車隊


    傳統計程車是屬於政府管制行業，有創新不足、服務較差等問題，「Uber」看準了這個商機，創造了搭車媒合平台，讓有車的人可輕鬆成為司機賺外快，乘客則可以透過手機快速掌握附近
    Uber 司機的位置、到達時間，也可決定是否找較高價格搭乘校高級車款等。由於使用者可以透過手機輕鬆對司機評分，司機為了留在 Uber 體系，自然會對顧客服務周到，逐漸形成了一個良幣逐劣幣的正向循環。


    Uber 於 2010 年在美國舊金山推出服務後廣受好評，吸引了相當多的大咖投資，並迅速將版圖擴展至全球各地，台灣則是在 2013 年 7 月底開始營運。Uber
    的服務雖然不錯，但由於 Uber 沒有計程車執照，卻從事實等同於計程車的服務（Uber 企圖使用租賃模式迴避），引起了一系列的法律問題，像是如何繳稅？保險怎麼保？安全問題如何管理？出事誰負責等。Uber
    在全球不少國家面臨了官司問題，在法國甚至發生了兩名負責人被抓的狀況。


    其實除了 Uber 外，全球也有不少類似服務推出，但要能走向完全合法化，還有一段路要走。


    儘管 Uber 尚未完全合法，但这套共享乘車服務的盛行，不免影響到計程車業的業績。從投資的角度來看，可能受影響的就是上櫃公司——台灣大車隊'
