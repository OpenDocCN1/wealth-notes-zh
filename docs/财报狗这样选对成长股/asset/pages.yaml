  md: '# ◎強制安裝法規：以中國政豐汽車污染物排放為例


    受惠企業：共軛噴油嘴


    相關合僱：宇隆


    我們在 2-2 所介紹的車用電子安全設備產業，其中提到的胎壓偵測、倒車雷達、安全氣囊等，都屬於強制安裝法規的一種，各國政府都訂立相關法規來強化汽車的安全性。這邊再舉另一個產業為例——汽車噴油嘴，來說明這類法規對產業的影響。


    中國近年空污問題嚴重，經研究發現，汽機車造成的汙染占總汙染比重竟超過 20%，比燃煤廠還高，於是決定出手整頓汽車產業，訂立了「國家第四階段機動車污染物排放標準（簡稱「國四條」）」，針對使用柴油的商用車（客车＋貨車）訂立了比「國三條」更嚴格的排放標準。為了達到「國四條」的排放標準，除了柴油本身品質要提升外，商用車的引擎系統、排氣處理系統等都要改善。


    因為「國四條」而受惠的合僱以宇隆 (2233) 為代表，主力產品是汽車精密零組件，佔總營收超過 70%，像是噴油嘴、正時鏈條、傳動零件等。汽車零件供應商又分為一階、二階，一階供應商為交貨給車廠的零件供應商，一階供應商的上游廠商稱為二階供應商。宇隆算是二階零組件供應商；主力客戶則是世界第
    2 大的一階零組件供應商博世 (Bosch)。


    Bosch 由於使用共軛噴射引擎技術，比起傳統柴油引擎更能降低污染，是少數能符合國四條標準的廠商。隨著國四條的實施，Bosch 的市占率可望愈來愈高，而宇隆是
    Bosch 共軛噴射引擎關鍵零組件——共軛噴油嘴的供應商，當然也跟著受惠。'
