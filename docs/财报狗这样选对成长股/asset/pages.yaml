  md: '可持續時間、投資重點、關鍵細節等。


    本書架構相當單純，前 6 篇分別描述成長股的 6 大成長方式，第 7 篇則是介紹如何使用財報狗的選股工具把成長股給篩選出來：


    # 第 1 篇》從科技發展趨勢找成長股


    科技發展日新月異，每過幾年就會有新的科技趨勢出現，若是公司跟上了這種科技趨勢，獲利就可能出現顯著有成長，投資人也跟着賺大錢；但若公司沒跟上這種趨勢，甚至逆向走，那就有獲利衰退的風險，嚴重的話甚至可能破產下市。由此可知，了解科技趨勢是多麼的重要。第
    1 篇的第 1 章到第 4 章，介紹了 4 股正在發生的重大科技趨勢，第 5 章則是介紹科技產業規格演進會如何影響相關供應鏈發展，最後一章則是介紹正在醞釀中的未來科技趨勢。


    # 第 2 篇》從生活產業變革找成長股


    除了科技產業常常會有重大趨勢出現外，食衣住行育樂相關的「生活產業」也是每隔一段時間就會出現一些變革；若公司能夠抓住這段變革趨勢，同樣可以出現驚人的成長，抓住機能服飾趨勢而股價大漲數十倍的儒鴻（1476）就是鮮明的例子。本篇介紹了
    3 個重要的生活產業變革，包括服飾產業、汽車產業、食品產業等，這些變革在過去幾年已打造出相當多的成長股，未來也將持續製造投資機會，大家一定要掌握住。


    # 第 3 篇》從法規與政策找成長股


    前面兩篇講的產業趨勢，多半是由產業的供需自然產生，可能是科技發展剛好到位，也可能是需求面出現變化。但現實上，很多的趨勢產生是由政府或國際組織所掌控的，所以我們也要時常關心公司所處的產業，是否有受到法規'
