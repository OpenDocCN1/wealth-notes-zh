  md: '觀察宏正的费用率，可發現宏正在 2012 年第 3 季费用率從前 一季的 44.8% 大幅提升至 57%（詳見圖 4）！若觀察細項，可發現是推銷費用大幅上升造成，從前
    一季約 2 億 4,400 萬元大幅提升至約 3 億 8,500 萬元。由於费用率大幅上升，導致宏正在這 一季EPS 與股價都出現大幅下滑（詳見圖 5）。


    原來宏正碰到了與萬潤相同的問題，KVM 第一大廠 Avocent 於 2007 年時在法國法院控告宏正的產品侵權，經過多年訴訟後，雙方於 2012 年 9
    月和 解，此和解金就是提列在推銷費用中，成為了宏正費用率飆高的主因。由於和解金提列屬一次性，再加上官司和解後宏正也不用再提列訴訟費用（放在管理费用中），使宏正的费用率得以持續下滑，獲利與股價也跟着回升。


