    # ◎受益者：巴西市場占比高的公司


    F、龍燈（4141）是生產植物保護劑（農藥）的公司，工廠位於中國，銷售市場則是遍布全球，包括拉丁美洲、中國、歐洲、北美、中東、非洲等，其中以拉丁美洲占超過
    40% 為最大宗，而拉丁美洲又以巴西為主。由於巴西是龍燈主要出貨國，龍燈帳上有不少的黑奧現金與應收帳款，當黑奧出現大幅波動時，龍燈的匯兌收益也會跟著波動。


    由於龍燈在全球布局有成，2010～2014 年營收表現相當亮眼，4 年營收複合成長率高達 21.5%，營業利益複合成長率也有 15%，表現不錯，但龍燈的 2014
    年稅後淨利竟然是較 2010 年衰退（詳見圖 11）！原因就是因為黑奧在 2011 年起大幅走貶，龍燈在 2011～2014 年連 4 年的匯兌損失都超過
    1 億元，2014 年更是高達 3 億 8,500 萬元！在如此高額的匯兌損失下，龍燈的獲利自然就相當難看了。


    由於黑奧的避險成本較高，推測未來龍燈就算要避險也不會全避；因此，未來龍燈若要重回獲利成長軌道，還是得看黑奧的臉色。


    最後提醒大家，匯率與原物料一樣，都是走循環路線，美元不會無止境地上漲，日圓與歐元也不會一直下跌，投資人除了要從總經面判斷各國匯率未來可'
