    智慧型手機的雛型約在 西元 2000 年左右誕生，當時的霸主是 Ri/M (Research in Motion，已更名 為 BlackBerry Limited)
    的黑莓機，由於價格昂貴，使用者都是高階商務人士。隨著智慧型手機漸漸走入消費市場，宏達電 (2498) 順勢崛起，由於獲利豐鉅，股價在 2005 年和 2010
    年都曾經漲破千元。不過 2012 年起，三星（Samsung）按零組件自製的優勢，尤其是領先推出大螢幕智慧型手機後，迅速掠奪了宏達電的市占率。然而進入 2014


