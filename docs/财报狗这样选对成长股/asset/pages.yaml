    大幅下滑，台橡的稅後淨利更出現了 $83 \%$ 的跌幅。台橡在 2011 年時股價最高點曾到 88 元，2015 年 12 月已跌破 20 元，可見原料的價格波動對上游產業會有多大的影響。


    # ◎成本降低使毛利率升高——以鑫永錠、輪胎雙雄為例


    因為橡膠價格下跌而受惠的，就是產品以橡膠為主要原料的公司。例如鑫永錠 (2114) 是生產各類輸送帶的公司，輸送帶的用途非常廣，像是礦業、建築業、航運業、農業、工業……等都會用到輸送帶。以市占率來看，鑫永錠已是台灣第
    1 大、世界第 7 大的橡膠輸送帶生產商；銷售地區則是以歐美為主，合計鑫永錠總營收近 7 成。


    鑫永錠的成本結構中，原物料就占近 $80 \%$ ，而其中又以天然膠、合成膠的比重最大。在這樣的成本結構下，可想見鑫永錠的毛利率一定會受到橡膠價格走勢影響。由於橡膠價格在
    2011 年起走弱，鑫永錠的毛利率也在 2011 年越開始轉強，2010 年時只有 $23.5 \%$ ，2014 年時已上升至 $33.8 \%$ (詳見圖
    6A) 。


    長線來看，鑫永錠營收表現相當不錯，除了 2013 年策略性放棄中國低毛利訂單外，其他年度都呈現上升趨勢。近幾年不僅受惠於全球景氣復甦，鑫永錠在各區域的市占率也都有所上升。2009~2014
    年，鑫永錠的營收複合成長率達 $10.1 \%$ ，再受惠於橡膠跌價推升的毛利率，使得稅後淨利複合成長率高達 $26.8 \%$ ，表現相當突出 (詳見圖
    6B) 。


