  md: '愈發被重視的是「輕薄」。簡單地說，不管是Fil-m-Type或是GlassType，都是先做成一組觸控模組，再把觸控模組貼合到液晶面板上（簡稱為掛式觸控模組），如此將增加手機的重量。於是，業界發展出新一代的觸控技術「Touch
    in cell」（詳見註2）—直接把觸控模組做在液晶面板裡（簡稱內嵌式觸控模組），如此即可省下額外的觸控模組，不但可使手機薄度減少10%以上，也讓重量減輕不少。


    蘋果從2012年9月發表的iPhone 5，開始採取了Touch in cell技術，由於此技術掌握在高階面板廠，像是韓國的樂金（LG）、日本顯利器（Jpans
    Display）、夏普（Sharp）等，這使得觸控面板廠宏璽F-TPK、勝華的業績一落千丈。其中，F-TPK在2015年陷入虧損，股價也從之前的「三千金」之一


