  md: '了解電子商務的成長趨勢後，再來了解電子商務的類型，主要區分成B2C、C2C、B2B2C共3種模式：


    模式 1：B2C (Business to Customer) 是較傳統的電商模式，業者進貨後直接賣給消費者，像是Yahoo!奇摩購物中心、PChome 線上購物、Momo購物網等。


    模式 2：C2C (Customer to Customer) 是業者提供一個平台和買賣家雙方直接交易，像是露天拍賣、Yahoo!奇摩拍賣，近年中國大陸淘溝的淘寶網也是。


    模式 3：B2B2C (Business to Business to Consumer) 則是介於兩者之間，業者提供平台給賣家開店，賣家把商品陳列在商城給消費者選購，像是PChome
    商店街、Yahoo!奇摩超級商城、樂天市場等。


    台灣在電商領域的上市櫃公司，主要有B2C的網友（8044）、富邦媒（8454），還有B2B2C的商店街（4965）等，以下為我們的觀察：


