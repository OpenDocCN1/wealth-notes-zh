    # 政策扶植與打压相關產業


    法律是死的，人是活的。在某些發展中國家，法規、政策訂一堆，但是怎麼執行才是關鍵。在一般時候，其實對法務可能開一隻眼、閉一隻眼，但苦其「古老題」強力要求，官員也只能乖乖執行了。由於人治色彩強烈，且風向說變就變，在這類國家擴展領導人時，就要多研究，本文說明以中國為例。


    中國 GDP（國內生產總值）在 2010 年超越日本，成為世界第 2 大經濟體，影響力已毋庸置疑，不過中國的經濟發展方式與其他世界強國有個很大的差異，就是中國仍奉行計畫經濟。最有名的就是每
    5 年會公布一次的 5 年計畫，2011 年至 2015 年實行的是第 12 個 5 年計畫，簡稱「十二五」。


    每個領導人上台時，都會對國家各方面的發展訂定一個方向，這個方向可能是領導人的喜好，但更可能是當時國家發展最需要的面向，我們就舉 4 個例子，來說明中國領導人訂定的政策走向。


    +   ◎影響醫藥：餐飲（新天地）、精品裝潢（F-紅木）

