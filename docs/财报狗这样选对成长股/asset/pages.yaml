    # 掌握股價上漲關鍵

    投資報酬率再升級


    時隔近 3 年，又和大家見面了。我們在前作《財報狗教你挖好股穩賺 20%》中，已把我們分析個股的架構完整地介紹給大家，也就是把基本面分析拆成「獲利性分析」、「安全性分析」、「企業價值評估」、「成長性分析」等
    4 個步驟，只要按此 SOP 執行，就可找出具有長期投資價值的股票。相信大家若有按照此步驟執行，近 3 年來的年化報酬率要達到目標 20% 的水準，不至於太困難。


    那麼要如何讓報酬率再向上提升呢？基本面分析 4 步驟中的「成長性分析」是關鍵！在《財報狗教你挖好股穩賺 20%》中，只簡要以新產品、新市場、新客戶來分析公司的成長動能，但我們發現這樣的架構遠遠不夠用，且成長動能是影響公司中短期股價走勢最重要的關鍵，有必要再更深入研究。


    於是，我們又花了近 3 年的時間，找出近 5～10 年來台股中獲利與股價頗繁成長的公司，並研究其成長動能來自何處，最後我們發現成長方式不外乎「搭上科技發展趨勢」、「跟上生活產業變革」、「符合法規與政策方向」、「客戶績效顯著提升」、「獲利關鍵因子改善」、「投資開花結果」等
    6 大方向，並可再細分成 24 個項目，公司只要符合一項，就可創造一些成長動能，符合愈多項，成長動能就會強勁了！'
