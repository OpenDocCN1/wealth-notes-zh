    | ⑥ ⑦ ⑧ ⑨ ⑩ ⑪ ⑫ ⑬ ⑭ ⑮ ⑯ ⑰ | 年度營業費用率 <br> 近一季營業費用率 <br> 近一季營業費用率改變 <br> 近一季營業費用率增加
    <br> 近一季營業費用率減緩 |

