  md: '鑽全為何毛利率可以微幅上升呢？除了鑽全生產的釘槍具競爭力，價格維持穩定外，人工成本穩定也幫了大忙。鑽全的工廠多數位於台中工業區，並未在中國設廠，雖然早期人力成本較高，但公司靠不斷提升的製造技術與自動化能力的提升，仍舊取得全球釘槍最大市占率。


    鑽全 2009 ～ 2014 年，人工成本從 2 億 3,000 萬元上升至 3 億元，雖上升不少，但此時期營收成長更快，所以人工成本占營收比重反而從 2009
    年的 11%下降至 2014 年的 9.5%（詳見圖 2B），這也是鑽全這時期毛利率可以上升的原因之一。此外，鑽全人工成本占總成本比重，也從 2009 年的
    15.1% 降至 2014 年的 13.3%，除了代表人工效率提升外，也代表未來人工成本變動對公司的影響力將下降。


