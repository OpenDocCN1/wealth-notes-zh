    美國 1999 年時曾發生一起保險理賠爭議，就是美國最大汽車保險公司 State Farm 為車禍客戶更換了 AM 件（售後服務市場的副廠零件）而不是 OES
    件（正廠零件），最後竟被判 10 億美元的賠償金與罰款。隨後，法規就明令保險公司在為客戶投保時需註明是用 OES 件或 AM 件，並使用差別費率，且每個 AM
    件都要通過 CAPA (Certified Automotive Parts Association) 認證（詳見註 1）。由於有認證加上廠商製造技術不斷進步，AM
