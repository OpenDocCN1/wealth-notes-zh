  md: '測器會將蒐集到的資料透過互聯網傳輸到同伺服器端，為使用者做健康分析；此外，智慧自行車還可結合定位導航、社群網路等功能，提高使用者的安全性與趣味性等。物聯網諸如此類的應用多不勝數，其他還可應用在家電、汽車、醫藥……等各個領域。若將物聯網與大數據結合，效用更大，比如说服装店在顧客試衣時，安裝
    RFID（無線射頻辨識系統）感應器，即可由感應的試衣、購買狀況計算出顧客的喜好，透過網路或 App 推薦給客戶。此外，服裝業者還可根據大量顧客試穿資料，找出經常被試穿卻沒有被購買的衣服，進行產品優化處理。


    另外要提醒讀者，物聯網未來有成長性毋庸置疑，但它的應用極為分散，各個產品都要經過長時間開發，故相關的 IC 設計、工業電腦供應鏈才會以穩健成長為主，不太可能像早期智慧型手機、平板等每年以倍數成長。2014
