  md: '# 智慧手機與平板崛起

    5大電子產業逢巨震


    台灣是電子王國，當量大趨勢形成，即可能讓整體產業重新洗牌。面對趨勢的可能性與趨勢，很難讓獲利消退，重則大幅虧損甚至破產重整。


    近年來電子產業最重要的趨勢有二：一是智慧型手機與平板崛起，本文主要內容；二是NB（筆記型電腦）與行動裝置的歸一化，將於 1-2 詳細說明。


    台灣在民國 90 年代起（西元 2000 年起）逐漸成為電子產業王國，當時主要是搭上了 PC（個人電腦）產業標準化的趨勢，讓台灣的眾多 PC 品牌廠代工廠跟著老大哥微軟（Microsoft）與英特爾（Intel）的業績一路沖天。


    不過，從 2005 年起，情況出現了改變，智慧型手機開始崛起，剛開始幾年銷售數量皆以倍數成長，而根據研究機構 C Insights 的調查，2010～2014
    年智慧型手機出貨量年年成長（詳見圖 1），年複合成長率超過了 40%。


    除了智慧型手機外，介於 NB 與智慧型手機間的產品——平板電腦（以下簡稱平板），也在 2010 年起隨著蘋果公司（Apple）的 iPad 問世而火紅了起來，一直到
    2013 年，平板出貨量的年成長率都在 60% 以上。


    智慧型手機與平板的崛起，對全球的電子產業造成了極大的影響，據我們的研究，主要是對電子品牌產業、觸控面板產業、鏡頭產業、遊戲與社群產業、'
