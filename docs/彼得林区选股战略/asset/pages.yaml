  md: '「啊，今天是星期二，應該買進通用汽車的股票！」唉，這些可憐的上市公司到時候要把年報寄給誰呢？最近有一本書叫《華爾街是怎麼了？》（What''s Wrong
    with Wall Street），書裡頭提到，我們為了維持各種交易所的營運，以及買賣股票、期貨和選擇權所支付的佣金和手續費，大概一年要花上250億美元到300億美元左右，可可是每年新發行的股票金額大概也就是這個數目而已，換句話說，我們花了數目相同的資金買賣那些過去發行的股票。但是別忘了，發行新股籌措資金，才是股市存在的首要目的。而且在每年12月股市封關時，五萬個專業選股者所管理的大型投資組合，看起來幾乎就和1月時差不多嘛。


    如果大型投資人染上這種交易頻繁的惡習，馬上就會成為附近營業員最愛的一隻肥羊，有些人說他們是「在市場上租一支股票」。現在反倒是散戶們小心翼翼，專業投資人卻毛毛躁躁，因此廣大的投資大眾才是市場的定心丸。


    毛躁的金融業信託部門、華爾街的投資機構，以及波士頓的金融區，都可能是各位的好機會。你可以耐心等待那些不受青睞的股票跌到異常的低價，然後再去大撿便宜貨。


    我也曾經聽說，1987年10月19日大崩盤發生在星期一，這是歷史上幾次星期一的大跌市之一，因此有些研究者便窮其一生之力，研究所謂的「星期一效應」（Monday
    effect）。事實上，我還在華頓商學院讀書的時候，早 Myself就聽說過「星期一效應」了。


    說到這裡，我似乎也瞧出了點端倪：從1953年到1984年，股市總共上漲了919.6點，但所有星期一的跌幅總計是1,565點。在1973年，'
