    很多證券商都緊盯著生物反應公司，而且添惠（Dean Witter）、萬金來證券（Montgomery Securities）、福曼賽茲（Furman Selz）以及布萊弗（J.C.
    Bradford）等幾家公司，都推薦這支股票。我在1983年2月第二次釋股時，以每股9.25美元的價格買進，後來曾經漲到16美元，不過現在這家公司已經沒救囉，幸好我賣掉時只賠了一點錢。


    口耳相傳的股票都有一種催眠效果，其消息經常也帶有某種情緒性的訴求。就像是耳中聽到鐵板烤得滋滋作響，就讓人滿口生津，哪想到上頭根本沒有牛排！如果我們老是投資這類股票，大概還得去找個家庭副業，才能彌補投資失敗的虧損。這種股票在下跌之前可能會先上漲，不過從長期的角度來看，我曾經買過的這類股票，每一支都讓我虧了錢。以下是我的慘痛教訓：


    奇妙世界（Worlds of Wonder）、披薩時間戲院（Pizza Time'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'Theater，恰克起士〔Chuck E. Cheese〕買下它的農場）、一二馬鈴薯（One Potato, Two，股票代碼：SPUD，正是馬鈴薯的俗稱）、全國保健（National
    Health Care，從14美元跌到50美分）、太陽世界航空（Sun World Airways，從8美元跌到50美分）、阿漢布拉礦場（Alhambra
    Mines，真是悲慘，它們從來沒挖到好礦）、MGF石油公司（MGF Oil，如今只剩幾美分）、美國外科中心（American Surgery Centers，真的很缺病人）、阿斯貝特工業公司（Asbetec
    Industries，現在只剩0.125美元）、美國太陽王（American Solar King，請到專門刊登全額交割股的行情表上尋找）、電傳視訊（Televideo，中箭落馬）、普力安公司（Priam，我旱該和磁碟機業者保持距離的）、維克多微電腦繪圖（Vector
    Graphics Microcomputers，我也應該和微電腦業保持距離的）、GD麗茲（GD Ritzys，速食業者，可惜不是麥當勞）、積體電路（Integrated
    Circuits）、康代爾公司（Comdial Corp），以及鮑瑪公司（Bowmar）。


    這些說得天花亂墜的股票除了會讓你賠錢外，還有一個共通點，就是根本沒有實質內容，這正是口耳相傳股票的本質。


    如果你買進這種股票，就不必做功課、檢視盈餘，因為這類公司通常是沒有盈餘。你也不必管什麼本益比，因為光有「成本」，卻沒有「盈餘」，不過這類公司倒是不缺各式的顯微鏡、各種類博士、還有賣股票換來的鈔票。


    我常常提醒自己（不過顯然往往並不成功），如果這類公司的「錢」途真的如此遠大，那麼一、兩年後它還會是一支好的投資標'
  merge: -1
  img_proc: true
- pgno: 209
  md: '的。既然如此，為什麼不等到這些公司已經展現出績效，再進場投資呢？先等公司的盈餘出來再說吧！如果公司證明它真的會賺錢，此時你還是可以打出一支十疊安打；如果獲利還在虛無縹緲中，那麼就暫緩為宜。


    這些說得比唱得還好聽的股票，通常會讓人有一種急迫感，好像你不在首次公開發行的第一時間即時搶進就太遲了，不過實情並非都是如此，雖然有幾支股票是在上市掛牌的第一天就因為強大的買盤而帶來豐厚的投資報酬，但這只是少數的例子。基因科技公司（Genentech）在1980年10月4日，以35美元上市掛牌交易，當日下午最高飆到89美元，後來跌回到71.25美元；當時麥哲倫基金也從承銷商那兒分到了一小部分的股票（通常你很難買到熱門的新上市股股票）。我在蘋果電腦上的成績就比較好，我在蘋果電腦上市前盡可能買到我想買進的數量，並且在上市當天賣出賺了20%，這是因為在蘋果電腦公開承銷的前一天，麻州政府認為這家公司對一般投資大眾而言太過投機了，因此裁定只有專業的法人機構才能買進這支股票。而後來我一直沒再碰蘋果電腦，直到它崩盤、變成轉機股之後，我才再度進場投資。


    全新公司的首次公開發行股票風險很大，這是因為後續的漲幅空間極為有限所致。雖然我也曾經買過後來表現不錯的首次公開發行股票（聯邦快遞〔Federal Express〕就是我第一次投資的首次公開發行股票，後來漲了25倍），不過長期而言，四分之三的首次公開發行股票表現都會讓人失望。


    至於從其他公司分拆出來的新公司的首次公開發行股票，或是情況'
