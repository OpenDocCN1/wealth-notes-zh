  md: '或者安豪塞一布什公司可以想出新的點子，就像麥當勞一樣。十年前，投資人開始擔心麥當勞不可思議的快速成長即將成為過去式，放眼望去，似乎到處都是麥當勞的分店，這足以讓麥當勞的本益比從快速成長股的30倍，被壓縮到穩定成長股的12倍水準。儘管投資人對麥當勞的股票投了不信任票（麥當勞的股價從1972年到1982年都維持橫向盤整），但其盈餘還是不斷增加，麥當勞正是以充滿想像力的方式來維持其成長。


    首先，它們加設了汽車外帶窗口「得來速」，如今這個櫃台的營業額已經高達整體營收的三分之一。再來是開發早餐，這又是個全新的領域，並且把原本生意清淡的時段炒熱起來。新增早餐時段所需的成本很低，可是卻讓營業額提升了20%。之後又開發了沙拉和炸雞等新產品，這兩樣新產品不但增加了麥當勞的盈餘，而且讓公司不再全面依賴牛肉產品。大家都以為牛肉價格如果上漲，麥當勞就糟糕了，不過這是以前的麥當勞，現在可不一樣了。


    雖然麥當勞開設分店的速度開始減緩，但是它也證明了它可以依靠原來的店面來提高盈餘。另外，它也正在國外市場進行快速擴張，而要讓德國或英國的大街小巷開遍麥當勞，大概也要數十年吧。雖然麥當勞的本益比已經降低了，但這家公司可還沒玩完呢！


    如果你投資有線電視產業中的公司，想必也看到了一連串的快速成長吧：首先，是鄉村地區的裝設率提升；其次，是付費觀賞HBO、Cinemax和迪士尼等頻道的服務收入增加；第三，是城市裝設率的上升；第四，是來自類似家庭購物網等購物頻道的權利金（賣出的每件商品有線電視業者都可以抽成），最近則是引進付費廣告，這'
