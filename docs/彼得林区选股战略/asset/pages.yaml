  md: '那些盈餘數字表現平平的公司，偶爾也會是很棒的投資對象，關鍵就在於它的自由現金流量。通常這類公司的老舊機器資產的備抵折舊已經很高，但短期內又還不急著更新設備；而且公司會盡量撙節支出進行設備更新，再加上它們會照常提列折舊費用，所以照樣能享受抵稅優惠。


    自由現金流量有何妙處，讓我們看看海岸公司（Coastal Corporation）就知道了。根據一般的標準，海岸公司的股價20美元相當合理，它的每股盈餘為2.5美元，本益比為八倍，這是當時生產瓦斯和轉投資瓦斯管路業者的正常水準。這家看似平淡無奇的公司，後來出現一項大利多：海岸公司貸款24億5,000萬美元收購一家大型管路公司——美國天然資源公司（American
    Natural Resources）。管路的好處是不必花太多錢進行維修，畢竟它就一直在那兒，也不必太過注意，只需偶爾挖一下、補幾個漏洞，此外，管路就一直在地底下，而且還可以提列折舊。


    儘管瓦斯業的景氣很差，但海岸公司每股現金流量仍高達10美元到11美元，而扣除資本支出之後還有7美元，這即是海岸公司的每股自由現金流量。或許這家公司未來十年在帳面上都不會賺錢，但股東還是能從每年每股7美元的現金挹注中得到好處，等於20美元的投資可以得到70美元的報酬。因此光是現金流量本身，就讓這支股票有極大的上漲潛力。


    潛心研究資產股的投資人，想要找尋的是如下的機會：一家平平凡凡的公司，看起來沒什麼發展，不過卻擁有許多自由現金流量，而且老闆也不想再投資新事業。這或許是一家租賃公司，擁有
    tuition 一大堆十二年的老舊火車貨櫃，這家公司想的只是如何利用這些老舊貨'
