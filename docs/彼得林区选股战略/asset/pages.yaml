  md: '標的。


    哈利想，那麽這就不只是巧合囉！很快地，他認為用3,000美元的辛苦血汗錢來投資溫徹斯特公司，肯定是個聰明的好點子。畢竟，他是真的做過研究啦！


    他的太太韓莉平常對於理財這類的嚴肅事情向來不太懂（雖然偶有靈光一現，但畢竟這種時候並不多），有一天，她在購物中心發現一家新的女裝店叫有限服飾（The Limited），店裡熱鬧滾滾，大家忙著搶購。回家之後她就迫不及待地告訴哈利，店裡的售貨員服務相當親切，而且衣服很便宜。「我幫珍妮佛買了今年的秋裝，全部才花掉275美元！」她說。


    「275美元？」哈利抱怨著：「妳出去忙著揮霍，我卻在家拚命想著怎麼賺錢呢！現在，溫徹斯特磁碟機公司就是答案。十拿九穩，咱們投資3,000美元。」


    「我希望你知道自己在做什麼。」那位不懂投資的太太說：「還記得那家生產光生電壓式電池的哈瓦光公司（Havalight Photo Cell）嗎？那支十拿九穩的股票從7美元跌到3.5美元，害我們賠了1,500美元！」


