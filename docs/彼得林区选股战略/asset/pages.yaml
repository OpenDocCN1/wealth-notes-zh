  md: '大約過了六個月之後，華納的股價從26美元漲到32美元。這時候我開始緊張了：「如果華納的股價在26美元時就已經超漲了，現在32美元不就是極度超漲了嗎？」我又檢視了基本面，並沒有找到任何不利因素足以動搖我的信心。後來股價又漲到38美元，我開始莫名其妙地大量出脫。我當時大概是這麼想的，既然26美元、32美元都已經太高了，那麼38美元就更不用說了吧！


    可是等我賣出之後，這支股票還是繼續上漲，50美元、60美元、70美元，最後 thậm超過180美元。而即使是在1983年到1984年間，因為亞達利公司（Atari）所引發的電玩市場崩潰，導致華納股價下挫了60%，但這個價位還是我當年用38美元賣出時的兩倍，我真希望我從這個事件學到了教訓。


    另一個太早離場的教訓，則是玩具反斗城的股票，我在先前說過，這是一家快速成長型的公司。1978年，州際百貨公司聲請破產，因此讓玩具反斗城這家子公司獨立出來，並以它的股票償付給債權人。當時玩具反斗城已經證實它有極高的獲利能力，而且正在各家購物中心進行擴張，它已經在某個地區通過考驗，然後開始在其他地區複製其成功經驗。我已經對這支股票做好功課，並且走訪其分店，最後以每股1美元的價格大量買進。到了1985年，玩具反斗城創下每股25美元的高價，這是一支超級的二十五疊安打！但不幸的是，我並沒有這個福氣，因為我太早離場了。我之所以太早退出，主要是因為看了報上的一則報導，指出零售業大亨派特利（Milton
    Petrie）也看好玩具反斗城，因此大舉買進20%的股權，因而刺激股價上揚。於是我私下推論，如果派特利不再繼續買進，股價就會下跌，而他後來是在5美元的價位就停止繼續買進。'
