  md: '雖然投資自己一無所知的股票來賭運氣，有時候也能獲得極大的報酬，但就我看來，這卻好像是故意自廢武功一樣，明明是馬拉松選手，卻故意與人在雪橇快速道上一決雌雄。


    # 雙重優勢


    剛剛我們談到石油公司經理和他的專業知識，更早之前也提到活力男孩連鎖修車廠等候結帳的客戶，他們也會對這家公司有所了解。當然，專家和客戶在某些方面並非對等，一位是對某個行業瞭若指掌的專家；另一位則是從客戶的角度出發，去認識某種他喜愛的產品。這兩種方式雖然不同，卻都是有助於選股的好方法。


    專業優勢特別有助於判斷在何時該買或不該買特定產業及上市公司的股票，這種優勢在所謂的「景氣循環」產業中尤其明顯，比方說，你在化學產業工作，你就會比別人更早知道聚氯乙烯（polyvinyl
    chloride）的價格正在上漲，而且同業的存貨正在減少；而再基於工作之便，你也知道這種原材料的生產廠商並沒有新加入的競爭者，同時也沒有新廠即將完工量產，而且蓋一間新廠也需要花兩、三年的時間。所有的這些情報都指向一個事實，現存的原料廠商將會有更高的獲利。


    或者，你是經營一家固特異輪胎的專賣店，經過三年的景氣低迷後，最近你發現生意大有起色，經常供不應求。這就是你接收到的強烈訊息，表示固特異公司可能會觸底回升。此時你應該主動打電話給你的營業員，要他提供固特異的財務資料，而不是坐著優等，等他打電話來告訴你王安電腦（Wang
    Laboratories）是明牌。'
