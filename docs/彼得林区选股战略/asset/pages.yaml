  md: '討論來看，這是必然的情況。公用事業股的本益比（目前為7倍到9倍）會比穩定成長股來得低（目前為10倍到14倍）；而穩定成長股又比快速成長股低（目前為14倍到20倍）。有些廉價股的投資人專挑低本益比的股票下手，不過我認為這種操作策略實在沒什麼道理。就像我們不應該拿蘋果來跟橘子相比一樣，對道氏化學公司來說是較低的本益比水準，對沃爾瑪百貨來說卻未必是如此。


    # 再論本益比


    如果要完整討論各種產業和不同類型公司的本益比，恐怕得用一整本書的篇幅來處理，只是這麼一來大概沒有人有耐性讀得下去。如果只拘泥在本益比固然是很優，但也不應該就此忽略掉本益比。你可以尋求證券商的協助，了解本身持股的本益比相對產業標準來說是高是低。有時候你會聽到「這支股票的價格相對整個產業明顯偏低」的說法，這表示這支股票的本益比處於廉價的水準。


    你可以要求證券商提供特定公司的歷史本益比資料，證券商訂閱的標準普爾報告中也會提供這些資訊。在你買進股票之前，或許可以先查看這支股票過去數年的本益比水準，藉以了解這支股票的常態本益比水準大致為何（當然，新公司的歷史較短，就沒有這類紀錄）。


    比方說，如果你要買進可口可樂公司的股票，那麼了解你為可口可樂的盈餘所支付的價格，是否和其他人在先前所支付的價格一致，這點對你將會有所幫助，而這正是本益比所能提供給你的訊息。


    （幾乎各家大型圖書館和證券商都會訂閱《價值線投資調查》，從'
  merge: -1
  img_proc: true
- pgno: 224
  md: '中可以查到個別股票的本益比資料。事實上，業餘投資人必須知道的任何股票資料，都可以在《價值線投資調查》中找到，這本刊物的功用僅次於擁有的證券分析師。）


    如果你還是不懂本益比，那麼只要記住，不要買進本益比高得離譜的股票，只要記住這一點，就可以避開許多災難和大幅虧損。除了極少數的例外情況，一般而言，高本益對股票來說是不利的，就如同在賽馬的身上放了過重的馬鞍一樣不利。


    高本益比的公司必須有極高的盈餘成長，才能維持其高股價。在1972年時，麥當勞的營運狀況還是跟過去一樣優秀，但是當時的股價已經高達75美元，本益比達到50倍，即使像麥當勞這樣的公司，也承受不起這麼高的本益比，因此股價很快就跌到25美元，本益比也滑落到更符合實際狀況的13倍。當時麥當勞公司出了什麼問題嗎？沒有，只是1972年的75美元股價實在太高了。


    如果麥當勞當時的股價算是太高了，那我們再來看看1960年代末期的熱門股——羅斯．培洛的電子資料系統公司（EDS）的情況。當年我看到券商報告時幾乎不敢置信，EDS公司的本益比竟然是500倍！即使這家公司能維持穩定的獲利，但是你投入的投資金額也要五個世紀才能賺回來。可是當時的分析師還在報告中建議，500倍的本益比仍算是保守，因為EDS公司的本益比應該可以達到1,000倍！


    如果你在亞瑟王（King Arthur）仍在英格蘭漫遊時，投資一家本益比高達1,000倍的公司，而且這家公司的盈餘維持不變，那麼你現在才開始回本而已。'
