- pgno: 219
  md: '再看看雅芳公司（見圖10-2），股價從1958年的每股3美元漲到1972年的140美元，這段期間公司盈餘一路竄高。但由於市場太過樂觀，股價脫離盈餘一飛沖天，到了1973年幻想終歸破滅。由於盈餘崩落，股價也跟著大跌，這個結果其實是可以預期的，早在股價重挫之前十個月，《富比世》雜誌的封面報導就再三提出警告了。


    至於馬斯可公司（Masco Corporation）則是因為發明球型單柄水龍頭，而享受了三十年的榮景，不管是戰爭或和平、通貨膨脹或不景氣，都無礙於馬斯可連續三十年的成長。從1958年到1987年，盈餘成長了800倍，股價上揚了1,300倍，這大概是資本主義史上最偉大的一支股票吧！當年這家擁有一個完美愚蠢名字的馬斯可螺旋產品（Masco
    Screw Products）小公司，能讓你對它有什麼特殊期待嗎？可是等到它的盈餘持續成長時，那可就所向無敵囉！


    再看看松尼連鎖餐飲，營業額連續116季（二十九年）出現成長，這種紀錄幾乎沒有任何一家公司能夠匹敵，當然，松尼的股價也跟著穩定上揚。有時股價會偏離基本面，飆得太高，但很快就會再回到基本面（見圖10-3）。


    另一支傑出的成長股萬豪集團的股價走勢圖，也呈現同樣的情況。再看看有限服飾公司，其盈餘在1970年代末期停滯不前，股價也是不進反退，等到盈餘再次飆升，股價也跟著直衝而上。但如果股價衝得太高，偏離了盈餘水準，例如1983年以及1987年的情況，股價馬上會出現短暫的崩跌。而在1987年10月的股市崩盤中，無數的股票都出現類似的情形。


