  md: '櫃，盡可能賺取最大的利潤。未來十年內，管理階層將會逐步縮減廠房、淘汰老舊貨櫃，只管把現金堆得高高的，只要以1,000萬美元作為本錢，或許就可以擠出4,000萬美元來（至於電腦業可就不能這麼做，因為電腦產品的價格波動太快，也許你還來不及從裡面榨出最後一分錢，倉庫裡的存貨就跌得一文不值了）。


    # 存貨


    公司年報中有一個部分叫「管理階層對盈餘的討論」（management''s discussion of earnings），裡頭會詳細談到存貨的狀況。我一定會檢視存貨總額是否增加，不管是製造商或零售商，存貨增加通常都是一項利空消息，如果存貨增加的速度比銷售還快，那就危險了。


    有兩種基本會計方法可計算存貨價值：LIFO和FIFO。如何？看起來像兩隻獅子狗吧！LIFO是指「後進先出」（last in, first out），而FIFO是指「先進先出」（first
    in, first out）。如果韓地哈曼公司在三十年前買進黃金，每盎司進價為40美元，昨天它們又買進黃金，進價為400美元；假設它們在今天賣出黃金，售價為450美元，試問利潤為何？根據後進先出法，利潤為50美元（450美元減去400美元），如果是根據先進先出法，利潤則是410美元（450美元減去40美元）。


    關於這兩種會計方法，我還可以做更深入的解釋，不過我想在此還是直接跳到報酬遞減這項重點吧。另外提一下還有兩種其他常見的會計方法：GIGO指「垃圾進、垃圾出」（garbage
    in, garbage out），以及FISH指「先進不出」（first in, still here），這是許多存'
  merge: -1
  img_proc: true
- pgno: 290
  md: '貨經常會發生的情況。


    不管是先進先出法還是後進先出法，各位就是要拿今年的數字和去年的數字相比，看看存貨是減少或是增加。


    我曾拜訪過一家煉鋁廠，它們的鋁料多到堆滿整間倉庫，從地板一直到天花板，塞得滿滿的，甚至連員工停車場也占去一大半。如果存貨多到連員工都得把車子停到別的地方去，這肯定是存貨太多的一項警訊。


    一家公司也許誇口銷售額成長了10%，但如果存貨同步增加了30%，你就要有所警覺：「等一下！它們不是應該先把存貨解決掉嗎？不然明年就會成為大問題，等到後年問題就更嚴重了。它們生產的新商品或許就會跟舊存貨相互競爭，等到存貨多到可能必須削價求售時，獲利就會開始減少。」


    汽車公司的存貨增加問題就不會那麼大，因為一輛新車總會有一定的價值。一輛3萬5,000美元的積架跑車，不可能以3,500美元賤價出售。但是一件300美元的紫色迷你裙，如果款式已經退流行，可能連3美元都賣不掉。


    從好的一面來看，如果公司因為景氣低迷而導致存貨開始減少，這可能是即將復甦的徵兆。


    業餘投資人和菜鳥比較難以體會計存貨的真正意義，不過那些對特定產業具備優勢的投資人，或許就會知道某個特定產業存貨的意義。在五年前，法令規定上市公司必須在季報上公布資產負債表，因此'
