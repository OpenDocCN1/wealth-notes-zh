  md: '# 18 十二則關於股價的 最愚蠢（和最危險）說法


    關於股價為什麼會波動，市場上有許多流行的解釋，有些是出自於專業投資人之口，有些則是在散戶投資人之間流傳，我對這些流行的說法總是感到驚訝不已。如今我們已經大量破除了醫學和天氣預報方面的無知和迷信，我們嘲笑老祖宗們在收成欠佳時竟然會歸咎於穀神，也懷疑「像畢達哥拉斯（Pythagoras）這麼聰明的人，怎麼會認為在零亂的床單裡藏有魔鬼呢？」但是，我們現在卻依然相信，哪支球隊在美式足球超級盃中獲勝會跟股價表現有關。


    我在念研究所時前往富達打工，當時我首度了解到，即使是最聰明的教授，他們談到股票時的謬誤，就和畢達哥拉斯如何看待床單差不多。此後我還不斷聽到各式各樣的說法，每一則都足以讓人誤入歧途，可是卻又廣為流傳。這些迷思和錯誤觀念多到不勝枚舉，以下謹記錄十二則最愚蠢的說法，希望大家能徹底破除這些迷思，有些說法看起來還真熟悉呢。


    # 如果股價已經跌深，再下跌的空間也imbangkan有限了


    這是一個好例子。我敢打賭，當拍立得的股價從143.5美元一路往下挫，在跌幅達到三分之一時，肯定有很多投資人會這麼說。拍立'
  merge: -1
  img_proc: true
- pgno: 347
  md: '得是一家不錯的公司，向來被認為是一支績優股，所以當它的銷售成績重挫、盈餘大幅滑落時，許多人還是沒有注意到它的股價已經過度膨脹的事實。大家還在相互安慰，如果「股價已經跌深，再下跌的空間也就有限了」，或許還會說：「好公司一定會再回來」、「投資股票一定要有耐心」，以及「不能因此就被嚇得賣掉一支好股票」等等。


    當拍立得的股價跌破100美元，然後是90美元、80美元時，這些話想必都曾經在投資人和銀行投資部門間一再出現。等到股價繼續往下跌破75美元時，這群主張「下跌空間有限」的人就會越來越少，而等到股價跌到了50美元，你大概只會聽到部分繼續堅持的股東還在說這樣的話吧。


    後來才買進拍立得的投資人，就是受到「下跌空間有限」說法的迷惑，結果他們大概都後悔了吧，因為後來股價又跌得更慘。這支偉大的股票在不到一年的時間內，從143.5美元一路暴跌到14.125美元，此時才真正是「下跌空間有限」囉。有關「下跌空間有限」的說法，真是讓人受夠了。


    沒有任何一個法則可以告訴你股票將會下跌多少，我自己就是在1971年學到這個教訓，當時我在富達公司擔任股票分析師，熱誠有餘但經驗不足。那時凱撒工業公司（Kaiser
    Industries）的股價已經從25美元跌到13美元，在我的推薦下，富達公司於是在股價繼續跌到11美元時買進了500萬股，這在當時的美國證券交易所（American
    Stock Exchange）可說是前所未有的大手筆，而我則信心滿滿地認為，股價不可能跌破10美元。'
  merge: -1
  img_proc: true
- pgno: 348
  md: '等到股價跌到8美元時，我趕緊打電話給我媽，叫她趕快買進！凱撒工業不可能跌破7.5美元嘛！幸虧我媽沒有聽我胡扯，因為它後來一路跌破了7美元、6美元，最後在1973年跌到了4美元，並證實它不會再下跌，可是這段行情已經把我給嚇壞了。


    富達的投資組合經理人總共持有500萬股的凱撒股票，如果這支股票在11美元是值得買進的標的，那麼4美元豈不是更棒了。由於我是推薦這支股票的分析師，所以我一再向他們保證，凱撒的資產負債表非常穩健。事實上，當我們發現這家公司的股本只有二千五萬股時，我們都非常高興，以每股4美元來計算，其市值是1億美元，當時1億美元可以買四架波音747客機，如果是現在的話，大概只能買一架，而且引擎還要另外付費。


    股票市場竟然把凱撒這等有實力的企業打壓到如此地步，這家公司擁有土地資產，從事鋁、鋼鐵、水泥、造船、玻璃纖維、營造工程和廣播等多種事業，而且還賣吉普車，可是這樣的公司只等於四架飛機的價錢。而且該公司的負債也很少，我們估計，清算公司的全部資產後，每股還價值40美元呢。如果是在今天的話，企業狙擊手早就收購這家公司了。


    後來凱撒的股價很快就回升到30美元，可是在它跌到4美元以前，我卻一直信誓旦旦地嚷著：「下跌空間有限了！」


    # 股價觸底時，你一定會知道


    想要搶進最低價，就像在河底釣魚，這是投資人最流行的娛樂，但結果上鉤的卻往往是釣魚人本身。在股價下跌時想要抓住最低價，'
  merge: -1
  img_proc: true
- pgno: 349
  md: '就如同想要抓住墜落的刀子一樣，如果等到刀子掉落地面，完全靜止後再去撿，這樣總是比較好吧。在股價急速下挫時伸手去搶，總會讓人悔不當初，因為你往往會在錯誤的位置出手。


    如果你想要買進轉機股，賭它會起死回生，應該要有個好理由支持，不能只是看它股價跌得有夠慘，就認定它會反彈。或許你知道它的業務已經好轉，然後再查看它的資產負債表，發現這支股票的每股現金淨值是11美元，而股價才14美元，這樣可能才是值得買進的理由。


    即使你已經研究清楚，可能還是無法抓到最低價。股票觸底後通常還得先震盪築底，然後才會回升，通常築底的時間會長達兩、三年，有時候甚至會更久。


    # 股價已經漲到這麼高了，怎麼可能再上漲呢？


    這樣說並沒有錯，但除非你是碰上了菲利浦．摩里斯或速霸陸公司。各位從圖18-1就可以看到，菲利浦．摩里斯的確是有史以來最勇猛的股票之一。先前我也說過，如果我們把買車的錢拿去買股票的話，速霸陸的股票將會讓我們變成百萬富翁。


    如果你是在1950年代以每股大約75美分的價格買進菲利浦．摩里斯的股票，等到1961年漲到每股2.5美元時，或許就會基於「怎麼可能再上漲呢」的理由，而想要把它給賣了。但過了十一年，這支股票又漲了七倍，相對於1950年代的價位等於是漲了23倍呢，此時你大概又會認為：「怎麼可能再上漲呢？」如果你在這個時候把它賣掉，這已經是一支23疊安打，可是你也錯過了後來再繼續上漲七倍'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# 圖18-1 菲利浦·摩里斯公司（MO）


    ![](img/5356ce2207e28b24f0354d7fd774355d_350_0.png)


    1. 不會再漲了啦！真的嗎？

    2. 不可能再漲了啦！誰說的？

    3. 如果前景依然看好，盈餘持續成長，股價當然也會繼續漲。

    註：1954/11/1收購Benson & Hedges；1957/8/19收購Milprint, Inc.；1970/7/31收購Miller Brewing；1972/9/29收購Mission
    Viejo；1977/12/24收購Wisconsin Tissue Mills；1978/6/19併購七喜；1985/11/1併購通用食品。'
  merge: -1
  img_proc: true
- pgno: 351
  md: '的大行情。


    只有緊抱持股的投資人，才會看到菲利浦．摩里斯的股價從每股75美分，一路漲到124.5美元。如果你 dark 當年投資了1,000美元，最後將會獲得16萬6,000美元，而且這還不包括幾十年下來你所收到的2萬3,000美元股利呢。


    如果我一直拿「這支股票怎麼可能再上漲呢」的問題來困擾自己，那我就不會在速霸陸的股價已經上漲了20倍之後，還要買進它的股票。但是在我檢視它的基本面之後，發現這個價位還是偏低，因此我便大膽買進，之後它又上漲了七倍。


    重點在於，股票能漲到多高並沒有一定的標準，如果這支股票的題材仍然很好、盈餘持續成長，而且基本面也沒改變，只是因為「怎麼可能再上漲呢」就放棄一支好股票，那實在是太糟糕了。那些建議客戶賺了一倍就賣出的投資顧問根本是在胡搞，因為這麼一來你就沒有機會可以打出十疊安打了。


    像菲利浦．摩里斯、松尼連鎖餐飲、馬斯可、麥當勞以及停車採購超市等股票，年復一年都在打破「怎麼可能再上漲」的迷思。


    坦白說，我並不曉得哪些股票可以漲10倍，或是哪些股票可以漲五倍，但只要一支股票的前景題材仍然可行，我就會繼續持有，並且期待能夠獲致令人愉快的意外驚喜。這些意外驚喜並不在於公司本身的成功，而是在於股價的表現。當年我買進停車採購超市時，只把它當成是配發股利的保守型股票，沒想到這家公司的基本面持續改善，我才了解我手中持有的股票原來是一支快速成長股。'
  merge: -1
  img_proc: true
- pgno: 352
  md: '# 每股才3美元而已，我還能賠多少？


    你一定多次聽過有人這麼說吧？或許你自己也曾經這麼說過。當你看到每股3美元的股票時，心裡就已經想著：「這總比買每股50美元的股票更安全吧！」


    我在這一行待了二十年，總算明白一件事情：不管股價是50美元或只有1美元，只要它往下跌到零，你照樣都會賠得精光。如果股價是跌到50美分，雖然結果略有不同，但是買進50美元的股票賠了99%，買進3美元的股票賠了83%，這又有甚麼值得安慰的呢？


    重點在於，只要是一支爛股票，不管價格高低，在股價下跌時都同樣危險。你投入1,000美元買進每股43美元的股票，或是買進每股3美元的股票，只要價格跌到零，同樣都是賠了1,000美元。不管你在什麼價位進場，挑錯股票的下檔風險永遠是損失百分之百的本金。


    但是我非常肯定，很多/mo還是難以抗拒每股才3美元的誘惑，他們會告訴自己：「我還能賠多少啊？」


    各位都知道那些專門放空股票的空頭作手吧！這些人就是靠股價下跌來獲利，而他們建立放空部位的價格水準，通常比較接近底部，而不是頭部的價位。空頭作手會等到公司明顯陷入困境、確定會破產時才下手，而且他們也不在乎他們進場放空的價位是8美元或6美元，而不是60美元的高價，因為只要股價跌到零，他們都會賺到相同金額的利潤。'
  merge: -1
  img_proc: true
- pgno: 353
  md: '那麼空頭作手在6美元或8美元放空賣出時，到底都是哪些人承接買進呢？就是那些告訴自己「我還能賠多少啊？」的倒楣買家。


    # 股價最後總是會漲回來


    既然如此，西哥德人（Visigoth）、皮克特人（Pict）和成吉思汗，大概都會再回來吧！大家都說RCA的股價會漲回來，結果六十五年過去了，還是沒有漲回來，而這可是一家世界聞名的成功企業。瓊斯－曼維爾公司也是一家股價從來沒有再回復到過去水準的知名企業，由於石棉會對身體健康造成危害，導致曼維爾公司訴訟纏身，東山再起之日遙遙無期；而且它和奈維斯達公司一樣，也都資增了幾億股，使得每股盈餘被大幅稀釋。


    如果我還記得那些公司的名字的話，我將可以提供一長串的名單，告訴各位有許多較小型、較不知名的上市公司，如今已經永遠從市場中除名。各位或許也曾經投資過這些公司吧，我可不希望我是唯一的傻瓜。只要想到有幾千家的破產公司，還有即使還清負債也無法重新恢復往日榮光的公司，以及用遠低於歷史天價的價格被收購的公司，你就會知道「總是會漲回來」這句話有多麼靠不住。


    而且，健診機構類股、磁碟機、電子錶以及活動房屋類股，至今都還沒有漲回來呢。


    # 黎明前總是最黑暗的


    人性總是會傾向於認為，已經變糟的事情將不會再變得更糟糕。1981年，全美國營運中的鑽油平台總共有4,520座，到了1984年，'
  merge: -1
  img_proc: true
- pgno: 354
  md: '銳減為2,200座，當時很多人都搶進石油類股，認為最糟糕的時刻已經過去了。証料經過兩年，陸續又有許多鑽油平台結束營運，最後只剩下686座還在幹活。即使到了今天，全美國繼續營運的鑽油平台還是不超過1,000座。


    投資以卡車為主的貨物運輸業的人可能會大為吃驚，在1979年時全美有95,650輛貨車，到了1981年時竟然減少將近一半，只剩下44,800輛。這已經是十七年來的最低水準，大概沒有人認為情況會更糟糕吧？結果到了1982年竟然再縮減至17,582輛，1983年更只剩下5,700輛。這個曾經生氣勃勃的產業，結果竟然衰退了90%。


    有時在黎明前總是最黑暗的，但是在最黑暗的時刻來臨前，肯定還是一片漆黑。


    # 等股價反彈到10美元，我就賣掉


    就我的經驗來說，好像沒有哪一支套牢的股票，會漲回到你決定賣出的價位水準。事實上，只要你開口說：「等股價反彈到10美元，我就賣掉。」可能之後好幾年，它的股價都在9.75美元逡巡不前，然後往下跌到4美元，最後再跌到1美元。這段痛苦的過程可能要耗上十年，結果在這段漫長的時間裡，你都在忍受一個你不喜歡的投資標的，只是為了心裡有個聲音告訴你「等到10美元才賣掉」。


    每當我自己也這麼想時，我總會提醒自己，除非我對這家公司有信心，並且願意再加碼，不然就該馬上賣掉。'
  merge: -1
  img_proc: true
- pgno: 355
  md: '# 我有什麼好擔心的？


    # 保守型的股票不會有太大的波動


    足足有兩個世代的保守型投資人都認為，投資公用事業股絕對不會出錯。這種股票你完全不必擔心，買進來之後就鎖在保險箱裡，按時領股利就對了。結果，突然間卻碰上了核能災變和費率問題，像愛迪生電力公司的股價就跌了80%。然後，又是突然間，愛迪生的股價又反彈回升，甚至超過了原先的水準。


    成本高昂的核能電廠碰上經濟景氣和法規問題，使得大家認為「安穩、妥當」的公用事業股，變成跟儲貸機構和電腦類股一樣起伏不定、變化莫測。如今電力公司的股票可能是個十疊安打，也可能跌到只剩十分之一。你可能大贏，也可能大輸，全看你挑到怎樣的公用事業股。


    無法趕上這種新變化的投資人，不但會蒙受財務上的損失，而且也要承擔心理上的折磨。他們認為妥當的投資標的印地安納公用服務公司（Public Service of
    Indiana）、灣區公用事業公司（Gulf States Utilities），或新罕布夏公用服務公司（Public Service of New Hampshire），結果卻莫名其妙的與新創生物科技公司同樣危險，或者是更危險，因為他們根本對公用事業股的危險毫無警覺。


    公司是動態的，因此其前景也持續變化，世界上沒有哪支股票是你可以在買進之後就放著不管。'
  merge: -1
  img_proc: true
- pgno: 356
  md: '# 再等下去，也等不出什麼結果！


    這也是必然會發生的事情：如果妳熬不住而放棄某支股票，結果就在你賣出那天，奇蹟馬上出現了，我稱此為遲來的榮景。


    默克藥廠就是這樣考驗投資人的耐心（見圖18-2）。儘管每年的盈餘成長率平均高達14%，但是股價卻從1972年一直盤整到1981年。後來呢？五年內上漲了四倍！不知道有多少投資人因為失去耐心，或渴望有所「行動」，因而把它給賣了，結果只能眼睜睜地看著股價上揚。如果他們能密切注意默克藥廠的基本面題材，大概就不會如此輕舉妄動了。


    生產工作服飾的安潔莉卡公司（Angelica Corporation）從1974年到1979年間也是動也不動；美國賀卡公司（American Greetings）也有八年的時間就像死了一般；還有GAF公司（GAF
    Corporation）沉寂了十一年；布倫斯威克公司（Brunswick）整個1970年代都不動如山；史克製藥（在推出泰胃美藥品以前）從1960年代後半一直休息到1970年代前半時期。哈寇布萊斯公司（Harcourt
    Brace）歷經尼克森、卡特及雷根總統的第一屆任期，都一直處在冬眠狀態，而魯肯斯公司也曾靜臥長達十四年之久。


    對於這種死都不動的股票，我可是習以為常，所以我緊抱默克藥廠的股票。我買的股票大都是在第三年或第四年就開始賺錢，不過默克藥廠讓我等得更久。如果這家公司的所有狀況都沒有問題，而且當年吸引我買進的條件也沒有改變，我相信耐心等候一定會有好報酬。'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 圖18-2 默克藥廠（MRK）


    ![](img/5356ce2207e28b24f0354d7fd774355d_357_0.png)


    從1972年到1981年盈餘穩定成長，但股價死氣沈沈，這是個好兆頭，一定要緊緊抱著。我就是這樣，果然很值得！


    註：1972/11/30收購Kelco Co.；1974/7收購Hubbard Farms。'
  merge: -1
  img_proc: true
- pgno: 358
  md: '這種連續幾年股價沒什麼波動的股票，我稱之為「石頭的心電圖」，這其實是個好兆頭。如果我喜歡的股票其走勢圖上出現「石頭的心電圖」，我知道接下來就可能會大幅上漲了。


    緊抱自己看上眼、但所有人都忽視的股票，的確需要無比的耐心。有時候你會覺得別人才是對的，而自己是錯的。但只要公司的基本面仍然看好，耐心通常會有好報酬。魯肯斯的股價後來在第十五年上漲了6倍，美國賀卡公司也在六年內漲了6倍，安潔莉卡公司則在四年內成了七疊安打，布倫斯威克五年內漲了6倍，史克製藥也在兩年內變成三疊安打。


    # 看看我損失了多少錢：我竟然沒有買它！


    如果我們在瓶蓋、瓶塞與封口公司的股價還在50美分時（經過分割調整），就把所有錢都拿去買它的股票，那我們現在就會更富有 了。不過請你掏出錢包、再看看銀行寄來的對帳單，你的錢都還在吧。事實上，雖然你沒投資瓶蓋、瓶塞與封口公司的股票，可是你也沒因此虧到一毛錢。


    我知道這聽起來很好笑，不過有些人就是會虐待自己，緊盯著「紐約證交所十大贏家股票」，天天計算自己因為沒買進這些股票，結果「損失」了多少錢。那些蒐集棒球卡、買珠寶、家具或房子的人，有時候也會這麼想不開。


    就股票投資來說，把別人的收穫看成是自己的損失，這種心態只會讓你發瘋而已，並不會帶來任何正面的效果。你知道越多的股票，就越了解自己錯過的贏家股越來越多，沒多久你就會開始怨恨自己'
  merge: -1
  img_proc: true
- pgno: 359
  md: '損失了成億上兆的美元。要是你完全空手，一覺醒來發現股市一天上漲了100點，豈不是要叨念著：「我剛剛損失了1,100億美元！」


    這種想法最糟糕的部分就是會讓人盲目蠢動，追逐自己不該買進的股票。你害怕它會上漲，造成自己的「損失」，最後反而是幫自己招徠了損失。


    # 錯過了這家公司，

    我就اير遠住「下一家」公司！


    問題是，「下一家」往往不太行。我們先前曾經說過，如果你因為錯過了持續成長的玩具反斗城，而盲目地抓住業績平平的格林曼兄弟公司（Greenman Brothers），結果它的股價卻一路下滑，那就是犯下了雙重錯誤。第一個錯誤是，雖然你錯過了玩具反斗城，但是它並沒有因此帶給你任何損失（請記住，沒買到玩具反斗城，你並沒有任何損失），但是第二個錯誤就會讓你付出一大筆代價。


    如果你沒在低價時買進Home Depot的股票，因而匆忙地抓住「下一家的家庭補給」史考特公司（Scotty''s），那可能就會犯下另一個錯誤。家庭補給的股價在上市後上漲了25倍，而史考特公司卻只有上揚25%到30%，並且遠遠落後同期間大盤的表現。


    同樣的，如果你因為錯過山麓航空而買進人民快遞；或者因為錯過廉價俱樂部而買進貨棧俱樂部，都是犯下了雙重錯誤。就大部分的情況來說，寧可用高價追買第一家公司的股票，也不要用便宜的價格去買進「下一家的某某公司」。'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# 這支股票上漲了，所以我一定是對的，或者……這支股票下跌了，我一定是搞錯了！


    如果要我挑選一則有關投資的最大謬誤，我肯定會選這個：只要股價上漲，你就做對了投資。當你最近投資的股票從5美元漲到6美元，大家都會覺得很舒服，這似乎也呼應了前述的買進智慧。但光是這樣其實無法證明些什麼，當然，如果你馬上賣掉的話，的確可以小賺一筆；可是在志得意滿之際，誰也不會想要賣出股票。他們會想，既然股價上漲了，那就證明是做對了投資，於是一路死抱不放，等到股價反轉下跌，他們又認為這支股票真是做錯了。有些投資人就是這麼胡搞，股價從10美元漲到12美元時緊抱不放，結果又撐到它跌回8美元時賣出，而他們還說這是「緊抱贏家，賣掉輸家」。


    1981年時的情況正是如此。當時能源產業景氣正處於高峰，而持有石油公司薩巴達（Zapata）的股票，似乎會比持有乙基公司（Ethyl Corp.）的股票好多了。乙基公司因為環保署（EPA）禁止它銷售含鉛汽油產品，因此市場說它是「被車子輾過的狗」。但是那支「好多了」的薩巴達，股價卻從35美元跌到2美元，而乙基公司特殊化工製品部門的表現卻大放異彩，海外銷售狀況好轉，保險事業的盈餘也持續快速成長，股價於是從2美元漲到32美元。


    因此當投資人說：「你看，兩個月內股價漲了20%，我一定選對了股票。」或者「糟糕，兩個月內股價跌了20%，我一定挑錯了股票。」他們顯然就是把股價和公司的前景混為一談。除非他們是追逐20%獲利的短線交易者，否則短期間的上漲根本沒啥好驕傲的。'
  merge: -1
  img_proc: true
- pgno: 361
  md: 在你買進股票後的股價上漲或下跌，只是代表有人願意用更高或更低的價格，來買進同一項商品而已。
  merge: -1
