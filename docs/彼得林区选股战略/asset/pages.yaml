  md: '太多，而這正是安全克林如此可愛的地方！如同自動資料處理公司一樣，安全克林的盈餘上升趨勢從未中斷過，每季獲利都在增加，因此股價也節節升高。


    至於環戴恩（Envirodyne）公司呢？這是幾年前富達公司的森林製品分析師史威尼（Thomas Sweeney）所推薦的股票，如今史威尼是富達資本增值基金（Fidelity
    Capital Appreciation Fund）的操盤人。光看環戴恩這個名字，就可以通過第一關古怪名稱的測驗：它聽起來像是什麽和臭氧層有關的東西，其實只和午餐有關而已。環戴恩有家子公司叫清潔蓋（Clear
    Shield），專門做塑膠叉子和吸管，這正是任何白痴都能經營的完美生意。實際上，公司的管理階層非常優秀，而且持有不少自家公司的股票。


    環戴恩公司在塑膠餐具業界排名第二，在吸管市場則排名第三，它是同行中生產成本最低的廠商，因此頗具優勢。


    1985年，環戴恩準備收購威斯卡斯（Viskase）公司，因此和威斯卡斯的母公司聯合碳化物公司進行洽商，最後以非常划算的價格買下來。威斯卡斯主要經營動物腸類製品的生意，尤其是熱狗和香腸的腸衣。1986年環戴恩又買下膠膜客（Filmco），這是一家專門生產保鮮膜的公司。塑膠餐具、熱狗腸衣、保鮮膜，一般家庭野餐所需的產品，不久後他們就能全部包辦了。


    主要是因為這些收購行動的結果，環戴恩公司的每股盈餘由1985年的34美分，激增為1987年的2美元，1988年再創下2.5美元的最高水準。公司則用這一大筆現金盈餘，償還歷次併購的借款。我在1985年9月以每股3美元的價格買進它的股票，1988年以36.875美元賣'
