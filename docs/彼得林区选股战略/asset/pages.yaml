- pgno: 210
  md: '類似、有實際歷史表現紀錄可查的新事業股票，我的操作績效就好多了。玩具反斗城就是一個例子，還有機構租車公司、安全克林公司等等，這些公司的生意已經存續一段期間，因此你可以像研究可口可樂或福特汽車一樣地來研究它們。


    # 小心中間供應商


    有些公司把它25%到50%的產品或服務都賣給同一客戶，這種狀況要特別留意。SCI系統公司（SCI Systems，不是開葬儀社的國際服務公司〔SCI〕，別搞錯了）經營得不錯，而且它是IBM公司的主要零件供應商，但是天曉得IBM公司什麼時候會改變策略，決定自己生產零件？或者IBM公司不再需要那些零件，因此會取消SCI系統公司的訂單。如果供應商的存亡完全繫於一家客戶的身上，想投資這家供應商就得三思而行。生產磁碟機的公司，如坦頓公司（Tandon）等，總是在災難邊緣打轉，正是因為它們只依靠幾個大客戶存活。


    就算未曾出現取消訂單的情況，但由於大客戶擁有極大的能力，可以要求供應商降價，進而壓縮供應商的獲利水準。因此，這種仰人鼻息的供應商很少會是一個好的投資標的。


    # 小心名稱花俏的公司


    如果全錄公司改名成「大衛乾式影印」（David''s Dry Copies）公司，那就太妙了！因為大家可能會狐疑再三，裹足不前。一家好公司卻有個無聊的名字，在上市初期都會讓投資人敬而遠之；反觀一'
  merge: -1
  img_proc: true
- pgno: 211
  md: '家普普通通的公司，只要安上個花俏的名稱，投資人便會趨之若鶩，而且誤以為這家公司很安全。只要在公司名字冠上「先進」（advanced）、「領先」（leading）、「微」（micro）、或是帶有「x」的字母*，或是神秘兮兮的字母縮寫，大家一看到就會很喜歡。聯美航空（UAL）改名為阿爾吉斯（Allegis），無非是要耍花槍，想要吸引想法比較時髦的投資人；幸虧瓶蓋、瓶塞與封口公司一直保留原名，如果它們也聽信企業形象顧問公司的鬼話，將名稱改為原文縮寫的克洛克西（CroCorSea），保證一開始就會吸引大型法人機構的注意。


    *編按：例如全錄的「Xerox」。'
