- pgno: 328
  md: '# 17 買進和賣出的最佳時機


    前面說了這麼多，不是要讓各位認為我是一位市場時機選擇者，並且告訴各位何時是買進股票的最佳時機；事實上，只要你能說服自己，你已經找到了一項不錯的商品、而且價格相當好，這絕對就是最佳的買進時機，就像你在百貨公司買東西時的情況一樣。不過，的確有兩個特定的期間，各位很容易就可以找到廉價的好股票。


    第一個期間是年底的節稅賣壓，這可說是一年一度的慶典，也難怪股市的大跌行情多半都會出現在10月到12月之間。由於這段期間的假日特別多，股票營業員就像我們一樣，也會需要許多錢來滿足開銷所需，因此他們都會打電話問你你要不要賣股票，故意造成虧損來抵稅。不知道為了什麼，投資人似乎都喜歡利用投資虧損來節稅，好像這是一個大好機會或是美好的禮物一樣，可是我實在無法理解，為什麼投資失敗還可以讓人這麼高興。


    法人投資機構也喜歡在年底出清賠錢的股票，藉以清理投資組合，讓未來評價時帳面上比較好看。包括散戶和法人機構的同步賣壓，自然會驅使股價下跌，而且價格偏低的股票會跌得更慘，因為股價一旦跌破每股6美元的門檻，這支股票就不能作為融資戶的融資擔保品，因此融資戶會先賣出低價股，法人機構也是如此，因為它們'
  merge: -1
  img_proc: true
- pgno: 329
  md: '持有低價股經常會招致客戶的批評。於是乎，賣壓引發更大的賣壓，有些好股票就這麼慘遭重創，價格往往跌到令人抓狂的地步。如果有些股票是你等著要低價搶進的話，那麼年底的節稅賣壓就會是個好時機。


    第二個買進的時機，則是股市每隔幾年就會出現的劇烈震盪、大跌，甚至崩盤的時刻。如果你 fright in this whole nervous system
    warns you "sell" The terrifying period, still be able to muster courage, concentrate
    spirit to buy in large quantities, you will find opportunities that you would
    never imagine even in dreams. Professional people often...等。專業人士在股市重挫時通常會因為太忙，或限制太多，因而無法迅速做出反應；而你不妨看看，在最近的幾次股市重挫中，有哪些盈餘成長極佳的不錯股票，是你可以搶進的好標的（見表17-1）。


    # 1987年的股市重挫


    在1987年10月大崩盤時，你有機會低價買進我在這本書中提過的許多好股票。在當年夏秋之際的千點重挫行情中，所有股票都被拖下水，但事實上表17-2中所列的股票，其實都是體質強健、獲利極佳的好公司，根本沒有犯下任何差錯。這些股票在重挫後，大都很快就回升了，所以一旦碰上逢低承接的好機會，我自然是當仁不讓。我曾經錯過了德萊弗斯公司，但這次我馬上就抓住這個好機會（如果被騙一次，是對方可惡；如果被騙兩次，那就是自己太笨了）。當時德萊弗斯的股價跌到每股16美元，而該公司扣除負債後的每股現金淨值卻是15美元，所以這有什麼風險可言？除了現金之外，在這次市場危機中德萊弗斯也賺了一票，因為有許多投資人慌忙逃出股票市場，並轉進德萊弗斯公司所管理的貨幣市場基金避險。'
