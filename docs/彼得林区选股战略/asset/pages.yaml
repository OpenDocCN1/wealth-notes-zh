- pgno: 362
  md: "# 19 選擇權、期貨和放空\n\n各種投資招數現在越來越流行，因此許多傳統名言如今也需要改變，以前我們說「買一股來投資美國」，現在應該改成「買一個選擇權來投資美國」，「投資美國的未來」則是意味著「到紐約期貨交易所割一筆」。\
    \ \n\n在我的投資生涯中，從來沒有買過期貨或選擇權，現在也不想破例。但是想在正規的股票上賺錢，而不受到這些「旁務」所干擾，可不是件容易的事。常常有人跟我提起期貨和選擇權，不過我認為，除非你是個專業的交易員，否則不太可能靠這些賺到錢。\n\
    \n這並不是說期貨對於商品交易毫無貢獻，農民可以在收成時鎖定小麥或玉米的價格，確保交割數量，這就是一個優點；而小麥或玉米的買家也可以靠期貨來確保其買進的價格和數量。但股票並不是大宗商品，而且股票市場的運作也不像期貨市場，有生產者和消費者必須確認價格的關係存在。\n\
    \n根據美國兩大期貨和選擇權中心——紐約和芝加哥交易所的報告顯示，有80%到95%的業餘投資人都賠錢。這樣的機率簡直比上賭場或賭馬還要糟糕，但是大家還是堅稱，這是「合理的投資選項」，"
  merge: -1
  img_proc: true
- pgno: 363
  md: '要是這也算「合理」，那麼鐵達尼號還真是不沈的巨輪呢！


    在此我就不多贅述期貨和選擇權是怎麼運作的，因為：①這需要冗長且無聊的解釋，可是等到各位聽完後，大概還是一頭霧水；②如果多知道一點，或許會引起你購買一點的興趣；③我自己其實也不了解選擇權和期貨。


    不過我對選擇權倒是略知一二，我曉得選擇權的鉅額潛在獲利，對那些急於致富的小額投資人來說的確是深具誘惑力。不過他們求富心切，結果反倒是賠得更快。這是因為選擇權都是在一、兩個月內到期的合約，而且選擇權不像股票，到期後就會一文不值，此時投資人就必須再買進另一口選擇權，然後再次把所有的本金給賠光。這樣連續幾次下來，你就會有大麻煩囉。


    現在讓我們假設一個狀況：你看上了A公司，並且確定這家公司馬上就有一項大利多來刺激股價上揚。或許你是發現了泰胃美、某個癌症秘方、公司的盈餘激增，或是其他你知道應該要尋找的基本面利多訊號，換句話說，你已經找到了一家完美的公司，好比你手上抓了一把同花大順！


    於是你查看自己的財產，發現銀行裡只有3,000美元，其他的錢都拿去投資共同基金了，可是家裡那位懂得投資的大總管絕對不會讓你動用那筆錢。因此你翻箱倒櫃，看看家裡有沒有什麼家傳寶貝可以變賣，可惜的是，貂皮大衣已經被蛀蝕；家裡的銀餐具或許能賣點錢，不過週末要辦晚宴，萬一賣掉了，另一半肯定會發現；或者把家裡養的貓給賣了，不過牠沒有血統證明書；至於那艘單桅帆船'
  merge: -1
  img_proc: true
- pgno: 364
  md: '則會漏水；此外，恐怕也沒有人會買握把已經壞掉的生鏽高爾夫球桿吧！


    所以，你就只有3,000美元可以投資A公司，而目前的價格是每股20美元，因此你可以買進150股。死心了吧，就買150股囉！此時你突然想起選擇權具有財務槓桿的非凡妙用，所以你打電話給營業員，而他告訴你，A公司履約價格20美元的四月份買權（call
    option）價格才1美元，如果到時候股價上漲到35美元，這個選擇權就會漲到15美元。你算了算，要是投資3,000美元，結果就會變成4萬5,000美元。


    於是你就買進了選擇權，然後天天看報紙找消息，焦急地等待股票價格上揚。可是直到三月中旬，股價還是沒動靜，此時你手中價值3,000美元的選擇權已經貶值了一半。你一度想要趕快賣掉，好拿點本錢回來，不過你隨後又想，距離選擇權變得毫無價值前，還有一個月，那
    区再等等吧，結果一個月後，你果真變得血本無歸了。


    後來發生的事情簡直是在傷口上撒鹽，等到你的選擇權失效、賠得一乾二淨後的幾個星期，A公司的股價果然開始動了。雖然你看對了股票，可是仍然賠了一屁股，這真是悲劇中的悲劇啊！你老老實實地做了功課，孜孜矻矻地研究，結果不但毫無報酬，而且還慘遭三振出局，讓你投入的金錢、時間和聰明才智完全被浪費了。


    選擇權的另一個缺點就是非常昂貴。雖然選擇權表面上看起來並不貴，但是當你了解你必須買進四口到五口選擇權，才能涵蓋持有整年股票的時間時，就曉得它們有多貴了。買選擇權就等於是在買'
  merge: -1
  img_proc: true
- pgno: 365
  md: '時間，你買的時間越長，所付出的權利金（premium）就越高。而且選擇權是營業員的搖錢樹，每一筆交易他都能抽到佣金，只要營業員的手上有幾位活躍的選擇權客戶，他就可以過著極好的生活。


    最糟糕的是，買股票選擇權和投資股票根本是兩回事，二者毫無關係。如果上市公司成長繁榮，股東會同蒙其利；而選擇權則是「零和」遊戲，市場上要是有恆人賺到一塊錢，就代表有人賠了一塊錢，可是能賺到錢的人卻是少數。


    當你買進一股股票，即使是風險非常高的股票，都會對國家的經濟成長有所貢獻，這就是股市的功能之一。幾十年前，買進小型公司的股票被視為是危險的投機活動，但這些「投機」活動至少壯大了IBM、麥當勞和沃爾瑪百貨，讓它們有資金能夠往前邁開腳步。但是聚集數十億、數百億美元資金的期貨和選擇權市場，裡面的錢卻毫無建設性，這些錢不曾資助過哪家企業開拓版圖，只是讓營業員和少數贏家錦衣玉食、香車豪宅地揮霍而已。我們在期貨和選擇權市場所見識到的，不過就是錢從粗心大意者的口袋裡，轉到處心積慮者的口袋裡罷了。


    最近還有很多談到，如何運用選擇權和期貨當成投資組合的保險，藉以保護投資股票的風險。如同往常一樣，我的許多專業同僚正在帶領大家走上這條更危險的道路。法人機構為了在股市崩盤時保障他們手中的部位，因此花幾十億美元買進投資組合保險，但是在上一次崩盤時，他們自以為已經充分地保障了手中的部位，結果投資組合保險反倒是帶來更多危險。部分的投資組合保險方案要求法人機構自動賣出持股，同時買進更多的期貨，而大量自動賣出的'
  merge: -1
  img_proc: true
- pgno: 366
  md: '股票卻導致市場繼續往下走跌，於是又引發法人機構買進更多的期貨、賣出更多的股票。在1987年10月的大崩盤中，這種投資組合保險正是元凶首惡之一。然而一直到現在，還是有些法人機構買進投資組合保險。


    許多散戶投資人也跟著採用這種餵主意（跟著「專家」的屁股後頭走，會有好處嗎？），這些散戶會買進賣權（put option，當市場下跌時，賣權的價值就會上揚），藉以保護股價下跌可能蒙受的損失。但是賣權在到期時也是一文不值，如果你想要一直受到保護，那麼就得一直買進賣權。結果，你每年花費投資金額的5%到10%，來保護每年5%到10%的下跌風險，根本是白忙一場嘍。


    而且，就像醉鬼原本只想喝啤酒解饞，最後還是會墜入烈酒 maintien一樣，股票投資人買選擇權原來只是為了幫股票避險，結果卻往往會無法自拔，隨後就一個勁地買賣選擇權，成天淨要些對沖、跨期交易等花招，壓根兒忘了股票這回事，所有的時間不是用來研究上市公司，而是用來閱讀技術分析報告，擔心頭肩底、頭肩頂、楔形反轉等等。更糟的是，到最後就把錢賠光光。


    巴菲特認為股票期貨和選擇權應該列入非法交易，這點我完全贊成！


    # 放空股票


    想必你也聽過這種古老而奇特的操作方式，亦即在股價下跌時獲利（有些投資人對這種操作方法十分感興趣，八成是看到自己幾年來'
  merge: -1
  img_proc: true
- pgno: 367
  md: '的操作績效發現，當初如果是放空而非做多，現在早就削減翻了）。


    放空股票就像各位跟鄰居借了某樣東西（在放空股票的例子中，你並不知道你是向哪個鄰居借的），先賣掉換成現金放進自己的口袋裡，未來再買一個同樣的東西還給他，但是這樣做並不表示你就比你的鄰居高明。當然這不算是一種「偷竊」的行為，可是這也並非睦鄰之道，反而比較像圖謀不軌的借貸。


    空頭希望做到的事情，就是在高價時把借來的東西賣掉，然後在低價時回補，其間的差價就是他的利潤。我想這種方式也可以用來買賣除草機或澆花水管，不過最適合的還是用來買賣股票，尤其是價格偏高的股票。比方說，你認為拍立得的股價在140美元算是偏高，於是你融券放空1,000股，立刻進帳14萬美元，等到股價跌到14美元時，你再花1萬4,000美元買進1,000股償還融券，並且淨賺12萬6,000美元。


    至於那位借股票給你賣出的投資人，則永遠不會知道你賺到的差價，因為所有的交易都是在帳面上完成，並且是由營業員經手處理。事實上，放空和做多一樣容易，也一樣方便。


    不過各位先別太興奮，放空還是有一些缺點。首先，在你借入股票的期間，股票的合法持有人還是會收到股利和其他相關的好處，因此你在這部分就會損失一些錢；其次，在回補股票結束這筆交易以前，你實際上並不能動用放空賣出股票的所得。比方說，你不能在放空1,000股拍立得股票後，馬上帶著14萬美元到法國逍遙，而且你也要根據特定的融券比率，在券商的融券帳戶裡保留一定額數的'
  merge: -1
  img_proc: true
- pgno: 368
  md: '保證金，如果這支股票真的下跌了，你才可以提領部分的保證金；但萬一它不跌反漲呢？這時證券商就會向你追繳保證金了。


    放空股票的可怕之處在於，即使你知道這是一家爛公司的爛股票，但是其他投資人或許還被蒙在鼓裡，說不定仍繼續搶進、推高股價呢。雖然拍立得的股價來到140美元已經是荒謬的高檔，但萬一它再往上飆升一倍，來到300美元呢？此時你就得花30萬美元來回補14萬美元的放空部位，想不擔心都很難。這時候如果你再不補繳數十萬美元的保證金，大概就會被強制「斷頭」，並且蒙受鉅額虧損。


    當股價下跌時，我們每個人都會害怕，但是這種恐懼還有個限度，因為股價總不會跌到負數，最多就是跌到零而已。但如果放空到上漲的股票，你將會了解到，根本沒有什麼東西可以阻擋股價的漲勢，因為上檔無限嘛。而永無止境似的上漲，正是放空股票最常碰上的結局。


    市場上流傳著許多放空賺大錢的故事，但是最恐怖的故事則是，放空者無助地看著他們發掘的爛股票一路上涨、越漲越高，完全違背所有的理性和邏輯，最後讓他們變得一貧如洗。例如大約在十年前，有一位聰明的投資人威爾森（Robert
    Wilson）放空了國際度假村（Resorts International）的股票，最後證明威爾森對國際度假村的看法並沒有錯，事實上，多數的空頭都是正確的，但是得等到最終才能見分曉。凱因斯（John
    Maynard Keynes）不是有句名言嗎？長期而言，「我們都死了。」但當年國際度假村的股票從每股70美分暴漲到70美元，足足漲了100倍，並讓威爾森先生賠掉二、三千'
  merge: -1
