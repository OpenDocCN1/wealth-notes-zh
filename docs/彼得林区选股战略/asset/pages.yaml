- pgno: 285
  md: '業，或許就碰過出人意表的好運氣。一般而言，歐洲的企業都沒有被深入研究過，有些企業甚至沒有人追蹤。我去了一趟瑞典後發現，當地像富豪汽車之類的大公司，居然只有一位股票分析師在追蹤，而且這位老兄甚至連電腦都沒有。


    當年艾索特商業系統公司（Esselite Business Systems）在美國掛牌上市時，我便買了它的股票，也一直追蹤它的基本面，覺得它的狀況非常好。後來富達海外基金（Overseas
    Fund）的經理人諾伯（George Noble）建議我去拜訪艾索特在瑞典的母公司，結果我發現，如果你在當地買艾索特母公司的股票，不但比它在美國的子公司便宜，並且還能獲得母公司旗下的其他事業，更別提那些房地產了；而且這兩年來，美國子公司股票只上漲了一點點，可是母公司的股票卻上漲了兩倍。


    如果你研究過食獅超市公司（Food Lion Supermarkets），可能就會發現比利時的戴爾漢茲公司（Del Haize）握有25%的食獅股權，而且這筆食獅股票資產的平均每股價值，甚至還遠遠超過戴爾漢茲的股價呢。所以，你要是買了戴爾漢茲的股票，等於是免費取得這家歐洲公司。麥哲倫基金就買了戴爾漢茲的股票，而當食獅超市的股價只是不痛不癢地漲了50%時，戴爾漢茲的股價卻從30美元飆上120美元。


    再回來談談美國市場。現在有許多電話公司可以投資，目標主要是針對行動電話業務。在每個區域市場中，都允許有兩家公司經營行動電話業務。你或許聽說某家公司很幸運地取得了行動電話的經營權，不過這其實是要花錢買的，但是第二個經營權則是免費送給現存的電話業者，對於用心的投資人來說，這就是一項隱藏資產。以'
