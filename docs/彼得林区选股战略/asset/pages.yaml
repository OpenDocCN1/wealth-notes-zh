  md: '漢斯公司是紐約證交所的上市公司。


    卡洛琳提醒我注意漢斯這家公司後，我依照慣例做了研究調查，發現它比我原先想像的要更好，因此，如同剛剛那位消防隊員對Tambrands信心滿滿一樣，我也把漢斯股票推薦給富達的投資組合經理。後來漢斯在被聯合食品（Consolidated
    Foods）收購前就上漲了6倍，之後又轉賣給莎莉蛋糕公司（Sara Lee）。蕾格絲一樣讓莎莉蛋糕賺了不少錢，而且在過去十年持續成長。如果當年漢斯公司不被收購的話，我相信它可以上漲50倍。


    蕾格絲的美妙之處在於你一開始不曉得也沒有關係，你可以在蕾格絲上市後一年買進，或者第二年、甚至第三年再買進，都還可以賺上三倍。但事實上很多人卻毫無感覺，特別是那些當先生的，在家庭中承擔投資重任的先生們，也許正忙著買進太陽能股票或是衛星小耳朵公司的股票，結果反倒是賠個精光！


    來說個我朋友哈利的故事吧，為了保護倒楣的當事人，我把名字改了，不過我覺得我們每個人身上其實都有點哈利的影子。某一天，理財大掌櫃哈利（每個家庭都會有一位專門負責理財的人）才剛看完《華爾街日報》，以及每年用250美元訂閱的投資刊物。他正在尋找振奮人心的投資目標，上檔無限而風險有限者，結果兩份刊物都提到，溫徹斯特磁碟機公司（Winchester
    Disk Drives）的「錢」景頗為看好。


    對於電腦磁碟機，哈利根本一竅不通。不過他打電話問了證券商，才知道美林證券（Merrill Lynch）把這支股票列為「積極買進」的'
