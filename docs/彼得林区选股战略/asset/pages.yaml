  md: '到了隔年4月，這支股票的股價還在44.5美元盤桓，我開始擔心自己的分析是否犯了錯。我身邊也有許多投資組合經理人和我抱持同樣的憂慮，當然，這是比較委婉的說法。最後，股市終於發現真實情況，因此股價在1971年跌到每股25美元，1978年又跌到14美元，接著再繼續下滑到1982年的8美元。十七年前的年輕股票分析師建議賣出英可公司股票，十七年後又是同一個人，如今是年紀較大的富達麥哲倫基金經理人，現在卻買進英可公司的股票，這一次則是當轉機股來操作。


    # 區分迪吉多電腦和沃爾瑪百貨的差異


    如果你不知道你的股票屬於哪一種類型，不妨去請教你你的營業員。假如這些股票原本就是營業員向你推薦的，那麼就更應該去問他，不然你怎麼會曉得應該要期待些什麼呢？你要找的是緩慢成長股、快速成長股、衰退防護股，或是轉機股、景氣循環復甦股，抑或是資產股？


    根據流行的投資箴言所建立的策略，例如「賺一倍後賣掉」、「兩年後賣掉」，或者「股價下跌一成就賣掉，避免虧損擴大」，絕對是愚蠢的做法。世界上不可能有一種普遍性的法則，可適用於各種不同類型的股票上。


    你必須清楚區分寶鹼公司跟伯利恆鋼鐵公司的類型，迪吉多電腦和阿利可公司也是完全不同的類型。而除非公用事業股已經變成了轉機股，否則你又怎能期待它們的表現會像菲利浦．摩里斯（Philip
    Morris）公司一樣呢？像沃爾瑪百貨這種快速成長股，怎麼可以當'
  merge: -1
  img_proc: true
- pgno: 167
  md: '作穩定成長股來操作呢？你看到它漲了50%就賣出，說不定它往後還會再漲10倍呢！話說回來，如果保力來公司突然大展神威漲了一倍，可是基本面看起來卻很不妙，而你還期望它能與沃爾瑪百貨有同樣的表現，並且緊抱不放，那你肯定是瘋了。


    如果你挑個好價位買進必治妥，然後把它擺個二十年，這樣的操作很合理，但是德州航空（Texas Air）可不能這麼操作。當財務結構不佳的景氣循環股面臨景氣衰退時，你最好不要太大意。


    在研究上市公司的題材時，第一步就是要確定這家公司所屬的股票類型，這樣你至少會知道未來的股價波動大概會是哪種型態；接下來則是再加入各種相關的細節，藉以幫助你推測這支股票的未來可能變化。'
