- pgno: 390
  md: '# 謝詞


    本書的修訂版承蒙許多人和團體給予慷慨而專業的協助，包括：在一般事務方面——出版代理商Doe Coover、富達資本公司行銷經理Paula Caputo，以及丹芳夏出版公司的Ellen
    Hoffman；在資料蒐集與核對方面——奈德·戴維斯研究公司、FactSet、道瓊公司、富達市場研究公司的Scott Machovina，以及富達技術集團，尤其是Patricia
    Mulderry、Denise Russell、Shawn Bastian和Krista Wilshusen；在編務協助方面——賽門舒斯特出版公司的Airie
    Dekidjiev、Doris Cooper。


    我有幸能在1960年代即成為富達公司的一員，我們都暱稱它為「Fido」。富達是個有點保守且老式的地方，恰如其分地安座在波士頓一幢古老的九層樓建築物裡。每位員工儘管有所差異，但是相處融洽，對於股票雖常有爭論，但不至於傷了和氣，我們甚至還保留著慶生會和吃蛋糕的習慣呢。


    我受到許多人的鼓勵和啟發，如果要全部列出的話，一定可以寫滿一整章。以下我只提到其中幾位，對於沒有特別提及的諸位，本人謹此致歉。'
  merge: -1
  img_proc: true
- pgno: 391
  md: '在過去十五年到二十年間，以及偶爾回顧到1966年，我要感謝：Mike Allara（已故）、Sam Bodman、Donald Burton、Bill
    Byrnes、Warren Casey（已故）、Sandy Cushman、Leo Dworsky、Dorsey Gardner、Joe Grause、Allan
    Gray、Barry Greenfield、Dick Haberman、Bill Hayes、Bob Hill、奈德·詹森先生（已故）、Bruce Johnstone、Caleb
    Loring、Malcolm MacNaught、Jack O''Brien、Patsy Ostrander、Frank Parrish（已故）、Bill
    Pike、Dick Reilly、Dick Smith、Cathy Stephenson、D. George Sullivan（已故）、John Thies以及George
    Vanderheiden諸位女士先生。


    還有幾位熱心的富達公司基金經理人也給了我無數的協助，包括：Jeff Barmeyer（已故）、Gary Burkhead、William Danoff、George
    Domolky、Bettina Doulton、Bill Ebsworth、Rich Fentin、Karie Firestone、Bob Haber、Steve
    Kaye、Alan Leifer、Brad Lewis、Steve Peterson、Ken Richardson、Bob Stansky、Beth Terrana以及Ernest
    Wiggins（已故）。


    在麥哲倫基金買賣股票的運作上，我也受到幾位優秀證券交易員的幫助，他們讓麥哲倫基金從有限的規模，一直發展到擁有數百億美元資金時，還能在買賣運作時保持順暢，他們是：Robert
    Burns、Carlene De Luca O''Brien以及Barry Lyden。


    儘管我一再提到許多華爾街專業投資人的小毛病，但在富達公司以外還是有許多朋友和同業讓我受益匪淺，這些人包括證券商的產業分析師和其他的基金經理人。以下我只列出一部分，其他我稍後才想起來的諸位，請接受我誠摯的歉意。'
