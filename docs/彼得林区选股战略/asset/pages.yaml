  md: '從投資人的角度來看，「多慫化」經營只有兩個好處：①你持有被收購企業的股票；②「多慫化」經營的企業決定瘦身重整時，或許你可以從中找到轉機題材。


    這種「多慫化」經營的實例，多到讓我不知該從何說起。美孚石油（Mobil Oil）就曾經收購馬蔻爾公司（Marcor Inc.），開始步上「多慫化」之路。馬蔻爾的生意之一是美孚石油根本不了解的零售業，結果讓美孚石油焦頭爛額好幾年，後來美孚石油又以極低的價格，出售馬蔻爾旗下的另一個主要事業單位——容器公司（Container
    Corporation）。此外，美孚石油為了收購卓越石油公司（Superior Oil），又多付了好幾百萬美元的過高價格。


    自1980年的油價高點迄今，美孚石油的股價只上漲了10%，然而同一期間，埃克森石油的股價卻上漲了一倍。雖然埃克森石油也曾遭遇一些不幸，並且進行過小規模的收購行動，例如收購雷萊斯電子公司（Reliance
    Electric），和一次失敗的創業投資，但埃克森石油並沒有往「多慫化」經營的方向走太遠，而是堅守本業，並且把盈餘拿來回購自家公司股票，因此埃克森股東的績效就比美孚的股東好多了。現在，美孚石油也開始調整經營策略，在1988年賣掉了蒙哥馬利華德百貨公司（Montgomery
    Ward）。


    吉列公司的蠢事我已經提過。吉列不只買過製藥廠，而且還「多慫化」經營，朝電子錶市場進軍，最後是以全額提列虧損，結束這場全面失敗的慘劇。在我的記憶中這是唯一一次，當大家都還不知道某家大公司已經介入某個事業前，它就告訴我們，它如何逃離這個虧損連連的行業。不過，吉列公司如今也重整旗鼓，做了重大的改革。'
