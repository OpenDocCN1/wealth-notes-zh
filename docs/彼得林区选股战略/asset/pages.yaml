  md: '目前的情況來說，你或許可以投資每股29美元的加州太平洋電話公司（Pacific Telesis of California），其中已經包含9美元的行動電話業務價值，或者投資每股35美元的康特爾公司（Contel），其行動電話業務的價值則是15美元。


