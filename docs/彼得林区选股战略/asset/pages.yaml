  md: '# 11 兩分鐘的推敲


    現在你已經知道你面對的股票是哪一種類型，是緩慢成長股、穩定成長股、快速成長股、轉機股、資產股，或是景氣循環股；而本益比則讓你有了粗略的概念，可以稍微判斷這家公司當前的股價相對其當前的展望是高估或低估。再接下來則是要盡量調查、打聽，了解這家公司計畫如何提升業績、刺激成長，或是有任何其他的利多消息，這就是我所謂的做功課研究上市公司的題材。


    除了資產股之外（這類股票你必須耐心地等待企業持有的不動產、石油蘊藏或電視台的價值獲得其他人的認同），一家公司的盈餘如果要保持成長，就必須具備某些驅動力才行。如果你越能確定這些驅動力為何，那麼你就越能根據自己的判斷去操作。


    從證券商取得分析師針對一家公司所做的研究報告，或閱讀《價值線》中的短篇分析報導，將提供你專業觀點；但如果你在某家公司或某個產業擁有特定的優勢，那你也可以發展出自己的方法來研究、調查上市公司。


    在買進股票前，我通常會花兩分鐘時間自問自答：為什麼我對這支股票感興趣？這家公司必須怎麼做才會成功？它將面對哪些阻礙等'
  merge: -1
  img_proc: true
- pgno: 231
  md: '等。這兩分鐘的自問自答可以是喃喃自語，也可以 Jetzt用同事們聽得見的音量大聲說出來。如果你把這些問題和答案說給家人、朋友，或是你的小狗聽（當然這個理由不能是：「我今天在公車上聽到有人要收購凱薩世界公司〔Caesars
    World〕！」），而且連小孩子也聽得懂的話，那表示你確實已經掌握住狀況了。


    以下是你在自問自答時應該包含的主題：


    如果你考慮的股票是一支緩慢成長股，那麼你在意的就應該是公司配發的股利。（不然買這種股票幹嘛？）因此你的重點應該是：「這家公司過去十年來的每年盈餘持續成長，並且提供誘人的殖利率水準，這家公司從來不曾調降或停止發放股利。事實上，不管景氣好壞，這家公司都在提高股利，甚至連最近三次的景氣衰退期間也不例外。這是一家電話公用事業公司，而新的大哥大業務會讓它的成長率大幅提升。」


    如果是景氣循環股，重點則包括業務狀況、存貨和售價。「汽車業已經衰退三年，今年應該會反彈回升。我之所以這麼說，是因為我記得最近才看到全國的汽車銷售量首度回升。我注意到通用汽車最近推出的新車款銷售不錯，而且過去十八個月以來，該公司關閉了五個效率不佳的裝配廠，削減20%的勞工成本，盈餘即將要大幅提升了。」


    如果是資產股，那麼重點就在於「資產」在哪裡？價值多少錢？「股價才8美元，但是光錄影帶部門就值4美元，不動產也值7美元。這根本就是一支廉價股，而且公司內部人士正在買進股票，企'
  merge: -1
  img_proc: true
- pgno: 232
  md: '業盈餘很穩定，同時負債很少。」


    如果是轉機股，重點在於公司是否努力改善當前的情況？計畫執行的成效如何？「通用食品在改善『多慘化』經營方面頗有進展，從原先分散經營的十一項業務縮減為只剩兩項，而且在出售部分事業單位和子公司時也賺了一些錢。通用食品現在又回到它最拿手的餐飲業和食品包裝業務，公司最近也回購了幾百萬股股票。子公司海鮮食品的市場占有率最近從原先的7%成長為25%，另外又將推出低熱量優酪乳、低膽固醇烤餅食材和微波布朗尼糕餅，盈餘將會大幅提升。」


    如果是穩定成長股，那麼本益比就是主要關鍵。該公司的股價是否在最近幾個月間飆漲？如果是，那是什麼原因所造成的？你可能會這麼告訴自己：「可口可樂的本益比目前正處於低檔區，這支股票的股價近兩年來幾乎沒什麼波動，但是這家公司在許多方面已經有改進方案。它在市場上賣掉哥倫比亞影業公司（Columbia
    Pictures）的一半持股，健怡可樂的銷售量巨幅增長，去年日本的可口可樂消費量比前年增加了36%，西班牙市場也成長了26%，這些都是驚人的進步。普遍來說，國外銷售狀況都相當好。另外，子公司可口可樂企業（Coca-Cola
    Enterprises）透過股權交換，收購了許多地區性的獨立經銷商，如今可口可樂在行銷通路及國內銷售方面也有更大的掌控權。基於上述理由，可口可樂的表現將會比大家預期的更好！」


    如果是快速成長股，那麼你必須知道它要如何維持其快速成長，以及其往何處發展？「拉昆特是在德州發跡的連鎖汽車旅館業者，它在'
  merge: -1
  img_proc: true
- pgno: 233
  md: '德州當地的獲利率非常高。這家公司將同樣的經營模式複製到阿肯色州和路易斯安那州，結果也非常成功。去年的旅館家數比前一年增加了20%，每一季的盈餘都維持成長，公司計畫在未來維持快速的擴張，且負債規模不算太大。汽車旅館業屬於低成長產業，而且競爭相當激烈，但拉昆特公司已經找到自己的利基。在這個市場飽和之前，拉昆特還很大的發展空間。」


    以上這些就是研究上市公司題材的部分基本要點，當然你可以根據你的需要，問更多的細節問題，如果你了解得越清楚、越詳細，對你的投資就會越有幫助。我常常花幾個小時來問自己一些問題，然後再尋找答案，不過當然也不一定都得花那麼多時間。下面我提供兩個例子，有一家我調查得一清二楚，另一家則忘了問一些關鍵問題，第一家就是拉昆特公司，這是一支十五疊安打；第二家是比德諾公司，也是一支十五疊安打，可惜是反方向的十五疊！


    # 調查拉昆特公司


    有一天我判斷汽車旅館業的景氣應該是要復甦了。當時我已經投資了聯合旅館（United Inns），它是假日大飯店最大的加盟店，同時我還豎起耳朵四處打聽其他的好機會。在一次電話訪談中，我問聯合旅館的副總裁，哪家公司是假日大飯店最大的競爭對手？


    打探市場的競爭狀況，是我最喜歡用來尋找潛力股的一種技巧。運用這種技巧會聽到95%的廢話，大家都在拚命抹黑競爭對手，不過當你聽到某家公司的經理人承認競爭對手令他印象深刻的話，那麼你就可以斷定那家競爭公司必定有可觀之處。能夠從競爭對手那兒'
  merge: -1
  img_proc: true
- pgno: 234
  md: '得到罕見的讚美，這可是最大的利多消息。


    「拉昆特汽車旅館！」聯合旅館副總裁激動地說：「它們做得非常好喔！在休士頓和達拉斯把我們整得慘兮兮的。」這聽起來真的令他印象深刻，對我來說也是如此。


    雖然這是我第一次聽到拉昆特公司的名字，不過當我掛上電話後，馬上就打電話給位在聖安東尼歐的拉昆特總公司裡的比格勒（Walter Biegler），請教他有關拉昆特的故事。比格勒說他過兩天會到波士頓地區，參加哈佛大學的一個商業會議，屆時他會很樂意親自向我介紹拉昆特公司。


    就在聯合旅館那邊的人透露這項消息的幾分鐘後，拉昆特這邊的人就剛好說要前來波士頓，這件事巧合得好像雙方套了招，準備要坑我買進幾百萬股似的。不過在我聽完比格勒的簡報後，我知道這絕對不是套招誆我。如果真要騙我的話，反倒應該讓我不想買進這支精彩的股票才對！


    拉昆特的經營概念非常簡單：住房品質跟假日大飯店一樣，但是價格比假日大飯店低，就是如此而已。拉昆特的房間大小跟假日飯店一樣、床鋪同樣堅固安穩（有專門的床鋪顧問會幫汽車旅館業打理這種事情）、衛浴設備一樣好、游泳池一樣棒，但是價格卻便宜三成！這怎麼可能呢？針對我的疑問，比格勒做了進一步的說明。


    拉昆特不在旅館中設置結婚禮堂、會議室、廚房和餐廳，而且會客大廳的空間也比較小。這些地方都無法產生利潤，可是卻要花費不'
  merge: -1
  img_proc: true
- pgno: 235
  md: '少錢來維修保養。拉昆特認為，要解決住房客人的餐飲問題，只需要在每家族館旁邊附設一家類似丹尼（Denny''s）餐廳的二十四小時餐飲業者即可，而且這些餐廳甚至不必由拉昆特負責經營，餐飲的問題就讓別人煩惱，讓他們去賺錢。假日大飯店顯然不是因為它們提供的餐點而聞名，因此拉昆特即使不提供餐飲，也不會失去賣點。拉昆特的這個決定不僅節省了大筆的資金投入，而且避開了許多大麻煩。事實上我們也發現，大部分旅館和汽車旅館的餐廳部都賠錢，而且95%的客戶投訴都是對餐飲部提出抱怨。


    在每一次的投資訪談中，我都想學到一些新的東西。從比格勒那兒我就學到，住房費率的訂價大概是住房建造成本的千分之一，比方說，紐約的廣場大飯店一個房間價值40萬美元，因此你住一晚就得付400美元；如果一般的旅館或汽車旅館的房間建造成本是2萬美元，那麼你住一晚只要20美元就夠了。如此我便能了解，由於拉昆特的建造成本大概比假日大飯店低三成，因此即使拉昆特的住房費率便宜三成，獲利還是和假日大飯店一樣高。


    我進一步還想了解，既然每條公路的交叉路口附近都已經有幾百家汽車旅館，那麼拉昆特的利基何在？比格勒說他們的做法是鎖定特定的對象：小生意人。小生意人一般來說不會太在意眾多的平價旅館，只要價格便宜，哪家都一樣。但如果他們能有所選擇，在同樣平價的基礎上，他們就會挑選一家和假日大飯店同樣豪華等級的旅館。拉昆特就提供了和假日大飯店同等級的豪華舒適，而且在地點上對商旅人士更為方便。


    假日大飯店為了吸引所有的旅客，因此把飯店全都設在交流道的出'
  merge: -1
  img_proc: true
- pgno: 236
  md: '口附近。拉昆特則是深入商業區，或是設在政府機關、醫院及工商綜合區附近，幾乎都是其客戶群出差旅行所到之處。而且拉昆特是以商旅人士、並非觀光客為主要客群，因此大部分客人都會預先訂房，讓拉昆特更能掌握客人和住房的穩定。


    除了拉昆特之外，目前還沒有人搶占高檔的希爾頓大飯店和低檔的平價旅館之間的中價位市場，而且就算是新的競爭對手加入，也不可能偷偷摸摸地切進來，卻不引起華爾街的注意，這正是我認為旅館和餐飲業比科技股更安全的原因之一。每當你投資一家新興科技股，就會發現另一種更新的技術正從另一個實驗室裡冒出頭。但是想要切進旅館、餐飲業的競爭對手，就一定得在某個地方現身，它們不可能在一夜之間就形成一家連鎖店來和你競爭，當然，你的競爭對手可能在別的地方開店，但也不會威脅到你的市場。


    至於成本方面的情況如何？如果是一家新成立的小公司，光是建造旅館的成本就會讓它負債多年，幾乎喘不過氣來。關於這一點，比格勒的說明同樣讓我感到放心，他說，拉昆特選擇建造成本較低的120間住房的旅館，而不是成本較高的250間住房大旅館；監造事宜由公司內部的營建部門負責，而且設計藍圖一體適用。此外，只有120間住房的旅館可以委由一對退休的夫婦代管，公司則提供他們住宿，這樣可以省下許多經常性費用。更棒的是，拉昆特和大型保險公司達成協議，由它們提供一小部分的利潤分紅，來換取保險公司的優惠貸款。


    既然保險公司成為拉昆特的合夥人，要分攤其成功或失敗，那麼一旦出現財務吃緊的狀況時，這些債權人就不太可能會落井下石，大'
  merge: -1
  img_proc: true
- pgno: 237
  md: '搞雨天收傘的把戲。事實上，保險業者提供的資金正是讓拉昆特在資金密集的行業裡快速擴張，而且不至於積欠過多銀行債務的主要原因（詳見第13章）。


    我很快便對比格勒與其員工面面俱到的想法，感到十分滿意。拉昆特正是一家精彩的投資題材，絕非「即將」、「可能」、「大概」或是「很快就會怎樣」的公司能夠相比擬。對於那些口說無憑、尚無實績可資驗證的公司，就別急著投資了！


    比格勒前來拜訪的時候，拉昆特公司已經經營了四、五年，而且拉昆特在好幾個不同的地方持續複製其成功經驗。當時拉昆特達到驚人的50%年成長率，而本益比大約只有10倍，這實在太便宜了。而且我也知道拉昆特還要開設多少家汽車旅館，因此我可以繼續追蹤其後續發展。


    除此之外，我還很高興地發現，在1978年時只有三家證券商正在追蹤拉昆特，而且大型法人機構的持股還不到總發行股數的20%。唯一可以挑剔的地方，就只有拉昆特公司的名稱還不夠無聊。


    這次會談之後，我趁著拜訪其他公司之便，到拉昆特汽車旅館住了三個晚上。我在床上跳一跳，到游泳池泡泡腳（我可不會游泳），拉扯一下窗簾，並且用力扭扭毛巾，覺得挺滿意的，拉昆特果然和假日大飯店一樣好。


    拉昆特公司的細節我可是調查清楚了，不過即使如此，我還是差點就放棄了這支股票。前一年這支股票才剛漲了一倍，不過這並不是'
  merge: -1
  img_proc: true
- pgno: 238
  md: '問題所在，因為以其本益比相對其成長率來看，拉昆特的股價還是相當便宜。真正困擾我的因素是，該公司有位重要的內部人士以我在報上看到的股價的一半價格賣出持股（後來我才知道，這位拉昆特公司創辦家族的成員之一只是為了分散投資組合才賣出持股）。


    幸虧我一直提醒自己，如果只因為某個大股東賣掉持股就否定這支股票，未免太不智了。因此，我盡可能幫麥哲倫基金買進最多的拉昆特股票，並且在十年內賺了11倍。後來因為產油各州面臨不景氣的衝擊，使得拉昆特也呈現衰退。而在最近，這支股票則成了資產股兼轉機股的精彩組合。


    # 嗆呀！比德諾公司


    我在拉昆特沒有犯下的錯誤，卻出現在比德諾公司上。我投資比德諾公司可說是一個絕佳的案例，足以說明如果你對某家公司過度狂熱，即使幾乎所有的問題都問了，卻獨獨漏掉最重要的一點，這一點就可能是致命的錯誤所在！


    比德諾是家專業餐飲店，在我波士頓戴勞郡的辦公室對面就有一家。我住的鎮上原本也有一家比德諾餐飲店，不過現在已經結束營業。它賣的三明治非常好吃，而且還提供其他的調理熱食，整家店的經營型態大概介於便利商店和三星級餐廳之間。對於比德諾的三明治我可是太清楚了，因為幾年來我的午餐就常常吃它的三明治，這可算是我對比德諾所擁有的一項優勢：我的第一手資訊告訴我，比德諾擁有全波士頓地區最好吃的麵包和三明治。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '故事是這樣的：比德諾公司準備到其他城市擴展業務，因此打算透過公開發行來籌措資金，這對我來說是個很不錯的消息。這家公司已經找到一個完美的利基：有數百萬白領階級無法忍受包裝在塑膠袋裡的微波三明治，又懶得自己下廚，那麼他們就可以前往比德諾購買。


    比德諾的外帶餐飲早已是上班族夫妻的一項福音，夫妻倆下班後都累得不想下廚，可是又想吃類似廚房裡剛端出來的熱騰騰晚餐，那該怎麼辨呢？在他們回到郊區的住家以前，可以先到比德諾餐廳買些店裡設計好的餐點，包括加了菜豆的料理、調味醬或杏仁果之類的，也就是他們如果想親自下廚的話，大概會做的那類料理。


    我親自到辦公室對街的比德諾餐廳做了充分的調查，這是最早開設的幾家店面之一，店裡清潔、乾淨而且有效率，客人也都相當滿意，像是帶有雅痞味道的7-Eleven超商，而且也是絕佳的賺錢機器！當我聽到比德諾公司準備發行股票籌資、開設更多分店時，我當然覺得非常興奮。


    我從股票上市的公開說明書中得知，這家公司不會向銀行大筆舉債，這是項利多；未來新開設的分店也是以租屋為主，而不是購置房地產，這又是項利多。到此為止，我沒有再做進一步的調查和研究，就於1986年9月，以每股13美元的承銷價格買進比德諾的股票。


    股票發行後不久，比德諾在波士頓的兩家百貨公司內開設了分店，結果生意都不好；後來又在曼哈頓市區開設幾家分店，卻讓鄰近的'
  merge: -1
  img_proc: true
- pgno: 240
  md: '熟食店給痛宰一番；緊接著比德諾又繼續擴張到更遠的城市，包括亞特蘭大。由於開設新店的速度過於急躁，很快就把公開發行所籌集的資金耗光。並且導致財務異常吃緊。如果每次只是犯下一、兩個錯誤，或許為害不會太大，但是比德諾並未因此更加謹慎，結果就同時遭受多重失敗的打擊。毫無疑問的，比德諾公司的確從這些失敗中學到了教訓，而公司老闆比德諾（Jim
    Bildner）也是個聰明、勤勞且認真的人，可是一旦耗盡手上的資金，他就沒有第二次機會了。這真是太悲慘了，原本我以為這會是塔可貝爾第二呢！（什麼？我說了「塔可貝爾第二」嗎？難怪會出師不利！）


    最後比德諾的股價只剩0.125美元，業務範圍縮回到原先的那幾家店面，其中包括我辦公室對面的那家店。而老闆比德諾最樂觀的期望也只是免於破產而已，不過就最近的情況來看，恐怕他還是很難避免這項厄運。後來我分批認賠出場，虧損幅度在50%到95%之間。


    之後我還是持續去買比德諾的三明治，但是每咬下一口，總會提醒自己所犯下的錯誤，當時我就是沒有先看它們在其他地區的擴張計畫是否會成功。能夠成功複製的經營模式，才可以把一家小地方的墨西哥餅店，轉變成全國性的塔可貝爾公司；也才能把地方性的小服飾店，轉變成有限服飾公司。因此，在一家企業還未證明它能夠在其他地方成功複製其經營模式以前，就急著買進其股票，實在是沒道理呀！


    如果一家公司最初是從南部的德州發跡，那麼你應該聰明地等到它在北部的伊利諾州和緬因州也能夠成功賺錢時，才進場買股票。這'
  merge: -1
  img_proc: true
- pgno: 241
  md: '正是 我忘記問的重要問題：這個經營模式在其他地方是否行得通？我應該先關心它的店長人才是否不足、財務資源是否有限，以及遭遇失敗後是否還能夠站起來才對。


    不要投資一家未經市場檢驗的公司，這點永遠不會嫌太遲。如果當時我再等一段時間，或許我就不會買進比德諾的股票，而且，我也應該早一點把持股賣掉！在百貨公司的那兩家新店失敗、進軍紐約又失敗時，比德諾就出現問題了。如果在那時候棄牌認輸，就不至於輸得那麼慘，我想我那時候一定是在牌桌上睡著了！


    不過呢，他們的三明治的確好吃。'
