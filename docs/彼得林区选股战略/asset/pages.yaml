  md: '幾年前，波士頓的五號頻道電視台以4億5,000萬美元的價格出售，這個價格算是合理，也不特別高。但是當年它取得執照時才付了2萬5,000美元的證照費，發射塔台或許要花100萬美元、攝影棚100萬至200萬美元，整家公司剛開始時的帳面價值才250萬美元，而且這250萬美元早已被折舊提列完了。結果它賣出的價格，大概是帳面價值的300倍以上！


    現在電視台換老闆了，新的帳面價值就是以4億5,000萬美元的買進價格為基準來計算，所以先前那種隱藏資產的特殊狀況已經不存在了。如果是以4億5,000萬美元買進帳面價值250萬美元的電視台，會計部門會稱4億4,750萬美元的溢價為「商譽」，並列在資產項目下，不過這個項目也會慢慢攤提，最後又創造出另一個潛在的資產股。


    1960年代以後，「商譽」的會計處理方式已經有所修改，先前許多公司都透過這個科目大幅高估其資產，現在則剛好相反。例如可口可樂公司新成立的可口可樂企業，專門負責可口可樂的裝瓶業務，它帳面上的商譽價值是27億美元。這27億美元就是裝瓶業務特許權的權利金，而且不包括廠房、存貨和設備的成本，這種業務權利金就是一種無形的價值。


    根據現行的會計原則，可口可樂企業公司必須在未來四十年內，逐年攤提這筆商譽價值直到零為止，但實際上這項業務的權利金卻是年年上漲。由於要攤提這筆商譽價值，導致可口可樂企業在帳面上的盈餘數字大為縮水。1987年公司公布的盈餘是每股63美分，事實上這是攤提了50美分商譽價值之後的結果。實際的情況是，可口可'
