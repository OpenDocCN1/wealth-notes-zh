- pgno: 112
  md: '存者記取教訓，於是搬遷到森林裡的高地，修築堤壩和擋水牆，並且把房子蓋在樹上，不過第二次卻是發生大火災。


    火災之後，僥倖逃過一劫的人離開原先的樹屋，盡可能遠離森林，跑到怪石嶙峋之地，沿著山崖石壁搭建石屋，結果卻碰上大地震！再來還碰上什麼樣的倒楣事，我已經忘了，也許是碰上經濟衰退，哈哈。但不管是碰上什麼，馬雅人一定還是沒搞對，因為他們忙著為下一次的地震做準備呢。


    兩千年後的我們仍然只會回頭張望，希望從過去找出跡象，發現下一個災難是什麼，當然這是辦不到的事。不久之前，大家才在擔心石油會跌到每桶5美元，我們的經濟可能會出現大蕭條；而在更早的兩年前，同一批人則是在擔心油價可能會飆升到每桶100美元，經濟也會出現大蕭條。過去是擔心貨幣供給量成長太快，現在又害怕成長太慢，上一次我們為了通貨膨脹預做準備，結果碰上了經濟衰退；等到衰退結束，我們改弦更張為衰退做準備，結果卻又碰上了通貨膨脹。


    未來總是會出現另一次經濟衰退，這對股票市場當然很不好，就跟通貨膨脹對股市不好一樣。也許，在我撰寫這本書到出版上市的這段期間，經濟就已經衰退了；又或者，經濟要等到1990年或是1994年才會衰退，你問我，我問誰？


    # 雞尾酒會理論


    如果連專業的經濟學家都無法預測經濟走勢，專業的預測人士也無法預測市場行情，那麼業餘散戶會表現得比較好嗎？各位其實已經'
  merge: -1
  img_proc: true
- pgno: 113
  md: '知道答案了。幾年下來，我站在宴會大廳、靠近裝滿雞尾酒的大碗旁邊，傾聽附近的十位來賓談論股票的情況，因此得出了一套「雞尾酒會」理論。


    市場剛開始上揚的第一個階段，通常是在已經下跌了一段時間、沒有人預期將會再次回升的情況下發生，此時大家都不太談論股票。事實上，如果他們慢慢地走過來，問我是做什麼的，而我回答：「我在管理股票共同基金。」他們大概都是點個頭，然後就走開了。如果沒有走開，也會很快地改變話題，談談球賽啦、大選啦、天氣啦，然後馬上轉移陣地，跟旁邊的牙醫聊起牙垢、牙斑等等。


    當我身旁的這十位客人寧可跟牙醫聊牙斑問題，也不願意跟我這位股票基金經理人談論股票時，股市大概就快要反轉了。


    在第二個階段時，通常是我表明身分後，對方還會稍微停留一會，也許時間剛好足夠讓對方告訴我，股票市場有多麼危險，然後才轉身去跟牙醫哈啦。雞尾酒會中的話題還是牙斑、牙垢，而不是股票。此時股市大概已經從第一階段上漲了15%，但還是沒什麼人注意到。


    在第三個階段，股市漲幅已經達到30%，對股票有興趣的人會整晚圍在我身邊，根本不理會牙醫。而且一直都會有一些狂熱的人士把我拉到旁邊，問我應該買哪些股票，連那位牙醫也會跑來問我可以買什麼股票。酒會中的來賓多少都買了一、兩支股票，大家也熱烈討論股市的狀況。


    在第四個階段，大家還是圍著我，但現在換成他們告訴我，我「應'
  merge: -1
  img_proc: true
- pgno: 114
  md: '該」買哪些股票，連那位牙醫都告訴我三、四支明牌。酒會過後幾天，我看報紙上的股票行情表，他們報給我的股票果然都漲了。如果連我的鄰居都告訴我應該買哪些股票，而且我還很後悔當初竟然沒有接受他們的建議，此時股市行情大概已經快到頂峰，馬上要開始下跌了。


    這就是我的雞尾酒會理論，各位可以自行運用，但可別期望我會據此來做投資。我自己可不吃這一套，我從不相信預測大盤，我只相信要買好公司的股票，尤其是那些價格被低估、或者還沒有反映真正價值的好股票。不管道瓊指數是1,000點、2,000點，或是現在的3,000點，如果你手上持有萬豪飯店（Marriott）、默克製藥或麥當勞的股票，肯定會比在過去十年持有雅芳企業、伯利恆鋼鐵或全錄公司的股票強得多，而且也比你把錢放在債券或貨幣市場基金要好很多。


    如果你在1925年買進好公司的股票，而且歷經股市大崩盤及其後的大蕭條都沒有認賠出場（這可真是不容易啊），到了1936年，你將會很高興看到最後的結果。


    # 什麼股票市場？


    股票市場應該是一點關係也沒有。如果我能說服各位這一點，我想這本書的任務就算達成了。各位要是不相信我，總可以相信巴菲特吧！巴菲特就寫過：「就我而言，股票市場並不存在。股市只是提供一個參考，讓我看看是誰在那兒做哪些傻事罷了。」


    巴菲特創辦的波克夏。哈薩威（Berkshire Hathaway），如今已經'
  merge: -1
  img_proc: true
- pgno: 115
  md: '是一家超級賺錢的公司。1960年代初期波克夏每股才7美元，如今已漲到4,900美元。如果當年投資2,000美元，將膨脹為700倍，變成140萬美元，這讓巴菲特成了超凡卓絕的投資人。他之所以偉大，是因為當他研判某支股票的股價已經相對基本面超漲太多時，他就會全部賣掉，然後把錢全數歸還給股東，讓他們賺得大筆利潤。別人樂於持續把錢交給你管理，而你卻能主動把錢歸還，在我的經驗裡，這在金融史上恐怕是獨一無二的。


    能夠預測市場、預知經濟何時會衰退，我當然會很高興。不過既然到目前為止還辦不到，我也能夠滿足於像巴菲特一樣，努力去尋找獲利豐厚的公司。我在市場很糟的時候照樣能夠賺錢，當然，也曾經在市場氣勢如虹的時候賠錢。有一些我最喜歡的十疊安打，就是在市場走勢很差的時候展現出最強勁的漲勢。在前兩次經濟衰退期間，塔可貝爾的股票都曾經大幅飆漲。在整個1980年代，只有1981年大盤呈現下跌，不過那時正是買進德萊弗斯公司（Dreyfus）的最好機會，它正開始從每股2美元漲到40美元，結果我硬是錯過了這支二十疊安打！


    純粹就當作是抬樁吧，即使各位能夠百分之百準確地預測景氣變化，而你也打算運用你的先見之明挑幾支大飆股來獲利，那麼也要挑對股票才行！這跟你無法預知景氣時的情況還不是一樣。


    如果你明知佛羅里達會出現房地產飆漲行情，結果卻選了雷岱斯公司（Radice）的股票，你將會賠掉投資的95%。如果你可以預知電腦業的大榮景即將來臨，可是卻不做功課，隨便就挑了財富系統公司（Fortune
    Systems），那麼你將會親眼目睹它從1983年的每股22美元，狠狠跌到1984年的每股1.875美元。如果你事先曉得1980年'
  merge: -1
  img_proc: true
- pgno: 116
  md: '代初期，航空業即將要起飛，可惜你卻投資了人民快遞公司（它們剛好去買了農莊）或泛美航空公司（Pan Am，拜愚蠢的管理所賜，股價從1983年的每股9美元，跌到1984年的4美元），那你還想得到什麼好處呢？


    又或者，你早就知道鋼鐵業即將要絕地大反攻，所以你把鋼鐵股的名單貼在飛鏢靶上，結果射中了LTV公司，然後看著它從1981年的每股26.5美元，跌到1986年的1.125美元。而幾乎是在同一時間，也是鋼鐵股的紐可公司（Nucor）卻是從每股10美元漲到50美元。（這兩支股票我原先也都買了，但後來怎麼會把紐可賣掉，保留LTV公司的股票呢？我大概也是擲飛鏢的！）


    這樣的例子不勝枚舉，儘管你看對了大趨勢，可是卻挑錯了股票，結果還是可以讓你虧掉半生積蓄。假如你亂挑股票，想靠大盤來帶它，那還不如搭車去大西洋城直接押注是紅、是黑。如果你一早醒來，心中突然動念：「我想今年股市會大漲，我要去買股票！」我奉勸你，趕快把電話線拔掉，而且離你的證券商遠一點。你想要靠大盤幫你賺錢嗎？甭做夢了。


    如果你真的想要擔心某些事情的話，倒不如去關心西點一佩珀雷爾公司（West Point-Pepperell）的床單生意好不好、塔可貝爾的超大墨西哥捲餅賣得如何。你的重點是要選對股票，至於市場，它會自己照顧自己。


    這倒不是說市場就不會超漲，而是各位實在沒理由去擔心這一點。你要知道市場是否超漲，只要看看是否找不到任何一家價位合理的公司，或是沒有任何一支股票符合你的投資標準，果真如此，那市'
