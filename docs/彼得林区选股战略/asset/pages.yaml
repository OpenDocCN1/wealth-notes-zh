  md: '就再三見識到了。


    # 美妙的「十疊安打」股票


    在華爾街術語中，「十疊安打」表示可以讓你的投資增值10倍的股票。我想這個十分技術性的名詞應該是從棒球借來的，打棒球頂多只有「四疊安打」，也就是全疊打。不過在我這一行裡，四疊安打只能算還好，十疊安打等於是兩支全疊打再加一支二疊安打，那就妙透啦。如果你曾經買過十疊安打的股票，就會曉得這有多麼迷人。


    打從我進入投資界開始，就十分熱中於讓我的錢增值10倍。我購買的第一支股票是飛虎航空（Flying Tiger Airlines），它就是漲了好幾倍的股票，而且供我念完研究所。過去十年來，我手上控管的股票多達1,400支，但我就是靠這些五疊、十疊，以及較少見的二十疊安打股票，讓我的基金表現足以超越競爭對手。在規模較小的投資組合中，如果擁有一支能夠上漲幾倍的股票，便能扭轉大局，讓整個投資組合轉虧為盈，效果多麼驚人！


    如果是在股市低迷的時候，那效果就更明顯了。是的，沒錯，就算市場一片低迷，還會有一些十疊安打的股票。把時間拉回1980年，就在大 höher行情開跑的前兩年，假設你在1980年12月22日投資表II-1所列的10支股票共1萬美元，並抱牢持股直到1983年10月4日，這是策略A。然後策略B是多買進第11支股票：停車採購超市（Stop
    & Shop），這支股票後來證實是一支十疊安打。


    採取策略A的話，大約三年後你原始投資的1萬美元將增值為1萬'
