- pgno: 4
  md: '# 千禧年新版序言


    寫這本書，原本是為了鼓勵散戶投資人，並提供基本訊息給他們。誰知道後來竟然增刷了三十版，銷售破百萬本！雖然初版至今已十一年，不過我還是相信，當年讓我在富達麥哲倫基金（Fidelity
    Magellan Fund）表現優異的基本原則，現在用來投資股市還是一樣有效。


    從1989年本書出版上市之後，我的生活有了很大的變化。1990年5月，我離開了麥哲倫基金，專家都說這是明智之舉；他們恭喜我在正確的時機急流勇退，剛好就在大多頭行情崩盤之前。在那個時候，看空後市是比較聰明的，美國多數的大銀行財務都陷入困境，有幾家甚至破產倒閉。到了那年初秋，伊拉克戰火突起，股市嚴重下挫；不過後來戰爭打贏了，銀行體系也撐過去了，股票隨之反彈。


    好個反彈回升！道瓊指數從1990年10月的2,400點上漲超過四倍，漲到11,000點以上，對股票市場來說真是20世紀最美妙的十年。將近有50%的美國家庭持有股票或投資共同基金，比1989年的32%還要高。整個股票市場總共創造了25兆美元的新財富，雨露均霑地分配到每一個城市及鄉鎮。如果股票可以繼續這麼漲下去，大概有人會來寫一本《下一個億萬富翁就是你》（The
    Billionaire Next Door）的書吧！'
  merge: -1
  img_proc: true
- pgno: 5
  md: '在這一大筆新財富中，投資在共同基金的金額高達4兆美元，遠遠超過1989年時的2,750億美元。對於這種基金熱我當然可以接受，因為我以前就是管理基金的人，但這同時也表示，有很多業餘投資人在選股上一定表現得很糟。如果投資人在大多頭行情中可以成功地自行選股，那他們就不必這麼依賴共同基金，也許本書所提供的資訊，可以幫助這些步上歧途的投資人，回到更能獲利的正確道路上。


    自從卸下管理麥哲倫基金的職務後，我自己也成了散戶投資人。在慈善事業方面，我提供了獎學金，讓城內貧民區裡信仰虔誠的小孩可以到波士頓天主教學校接受教育。另外，我也還在富達兼職，擔任基金管理人及新進研究分析師的顧問及培訓人員。最近，我的空閒時間大概增加了30倍，所以我也花更多時間跟家人歡聚，以及出國旅遊。


    關於我自己的事情也說夠了，我們還是回來談談我最喜歡的主題：股票。這次大多頭行情從1982年8月開始，讓我們見識到美國股票史上的超級大躍進，道瓊指數總共上漲了15倍之多。某些成功的公司股價上漲15倍，這我可是司空見慣的；但是大盤整個上漲15倍，那可就令人目瞪口呆了。各位想一想：從1929年的指數高點248點，一直到1982年的1,046點，道瓊指數花了半個世紀才上漲了四倍而已！最近隨著股價越漲越高，上漲的速度也加快了，從2,500點漲一倍到5,000點，花了八又三分之一年的時間；但是從5,000點漲一倍到10,000點，卻只用了三年半的時間。從1995年到1999年，連續五年的股票投資報酬率都超過20%，這是前所未見的景象，過去從來沒有超過兩年連續上漲20%以上的紀錄。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '華爾街最大的多頭市場行情，讓相信它的人獲利豐厚，並讓先前抱持疑慮的人不知身在何處。經歷過1970年代初期行情停滯時期的投資人，不管是多頭還是空頭，都很難想像股票會漲到這種程度。那時我才剛接掌麥哲倫基金，股價正處於低檔，軍心潰散的投資人必須提醒自己，空頭市場不會永遠持續下去；而耐心持有股票或投資共同基金的多頭投資人，更得要苦撐一段時間，因為道瓊及其他股價指數總共花了十五年，才回到1960年代中期高點水準。今天，我們則應該提醒自己，並沒有永遠的多頭行情，而且不管做多或放空，都要有耐心才可以。


    在本書第20章，我提到美國電話電報公司（AT&T）1984年的分裂，這是當時股票市場最重大的發展；如今回的重大發展則是網際網路（Internet），但到目前為止我可是完全錯過了。我一直帶有科技恐懼症，不過我的經驗也可以告訴各位，要成為成功的投資人不見得就要跟著潮流走。事實上，我所知道的最偉大的投資人（從巴菲特〔Warren
    Buffett〕一路數下來），全都具有科技恐懼症，他們不會去投資那些自己不懂的東西，我也是如此。我了解唐金甜甜圈連鎖店（Dunkin'' Donuts）、了解克萊斯勒（Chrysler），所以這兩家公司的股票都在我的投資組合中；我了解銀行、儲貸機構，以及跟這兩種行業關係密切的房利美（Fannie
    Mae，聯邦國家房屋貸款協會）。但我不上網、不會在網路上閒逛，也沒有在網路上跟誰對談過，假如沒有專家幫忙（例如我太太或小孩），我連網路到底在哪都不知道。


    1997年感恩節假期時，我跟一位網路派的朋友邊喝著蛋酒，邊談起我太太卡洛琳（Carolyn）最喜歡的懸疑小說家多洛絲．賽爾斯'
