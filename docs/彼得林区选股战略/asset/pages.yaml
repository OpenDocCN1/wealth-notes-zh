- pgno: 394
  md: 'Cathy Davis和Jack Cahill、富達技術部的Robert Hill，以及富達證券研究部及多位基金經理人致上謝意，特別要感謝Bettina
    Doulton的協助。也謝謝我的四位秘書Paula Sullivan、Evelyn Flynn、Natalie Trakas以及Karen Cuneo的長期協助和加班工作。


    特別感謝賽門舒斯特出版公司的資深編輯Bob Bender以及Doe Coover代理公司的Doe Coover，他們從頭到尾協助推動這個寫作計畫。


    最後，我要對本書的共同作者約翰．羅斯查得致上最高敬意，沒有他就不會有這本書。他的工作態度、聰明才智、機巧權變以及非凡的努力認真，都是我非常重視的部分。'
