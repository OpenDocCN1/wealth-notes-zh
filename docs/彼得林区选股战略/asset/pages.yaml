- pgno: 71
  md: '麼多人畏畏縮縮地等著別人先出手，股票居然還有人買，這真是奇了！


    對這種我稱之為「華爾街慢半拍」的狀況，有限服飾公司正是最好的例子。有限服飾早在1969年就已經上市，但是大型法人機構和名重一時的分析師卻都沒有注意到它。輔導有限服飾上市的承銷商是位在俄亥俄州哥倫比亞市的一家小券商，叫維科公司（Vercoe
    & Co.），而有限服飾公司的企業總部也設在那裡。當時維科的承銷部經理是豪樂迪（Peter Halliday），他是有限服飾公司董事長威斯納（Leslie
    Wexner）的高中同學。對於華爾街的冷淡態度，豪樂迪認為這是因為俄亥俄州哥倫比亞市並非當時企業界的麥加聖地所致。


    當時只有白威德（White, Weld）公司的一位分析師荷姆斯（Susie Holmes）在追蹤這支股票，之後又過了好幾年，直到1974年，第一波士頓（First
    Boston）公司的吉莉恩（Maggie Gilliam）才注意到它。那一年要不是歐海爾（O''Hare）機場因大風雪關閉，吉莉恩剛好逛到芝加哥塢菲爾購物中心（Woodfield
    Mall）裡的有限服飾專賣店的話，恐怕也沒有這份機緣。她在不經意間所發揮的業餘投資人的優勢，值得在此記上一筆。


    最先買進有限服飾股票的法人機構，是普萊斯新地平線基金（T. Rowe Price New Horizons Fund），但那已經是1975年夏天的事了。在那個時候，有限服飾公司已經在全美擁有一百家專賣店，成千上萬個客人都.eye有機會挖到這塊寶，可是真正下手的並不多。結果到了1979年，還是只有兩家法人機構投資有限服飾的股票，持有股數只占該公司流通在外股數的0.6%，大部分股票都在公司員工和管理階'
