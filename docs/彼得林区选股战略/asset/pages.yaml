  md: '二十五年的長時間來考量，這個成績實在不能說好，只是跟投資債券或貨幣基金差不多。


    事實上，如果你聽到有人在吹噓，說他投資了穩定成長股，而且賺了一倍或兩倍，那你下一個問題應該是：「你持有多長的時間？」持有股票就得承擔風險。在不少例子中，有些投資人辛辛苦苦地緊


