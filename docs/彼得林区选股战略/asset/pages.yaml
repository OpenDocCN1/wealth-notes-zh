  md: '# 2 華爾街的矛盾修辭


    在英文中，舉凡military intelligence（軍事情報）、learned professor（博學多聞的專家）、deafening silence（靜默窮然）、jumbo
    shrimp（巨大的小蝦）等，都是「矛盾修辭」（oxymoron）的最佳例子，這裡我想再加一個：professional investing（專業投資）。其實，業餘散戶投資人大可抱持某種恰當的懷疑眼光來看待所謂的「專業」，這點非常重要，至少你也要了解你的對手。由於大公司的股票有70%是掌握在法人機構的手中，因此不管你是買進或賣出這些股票，都是在跟這些所謂的專業投資人交手，這對各位來說可真是個好機會。我們這些專業投資人往往會受到許多文化、法律和社會規範的約束（事實上其中有很多是我們把自己搞得綁手綁腳），儘管整體表現還算不錯，但這還是讓人驚訝！


    當然，並非所有的專家都是矛盾的綜合體，還是有一些偉大、有創意及特立獨行的基金經理人，懂得隨心所欲地進行投資。約翰．坦伯頓（John Templeton）就是其中一位佼佼者，他是進軍全球市場的開路先鋒，是最早在世界各地賺錢的專家之一。他讓他的投資人避開了1972年到1974年的美國空頭市場，因為他很聰明地把錢轉進加拿大和日本股市。而且，他也是第一批在日本股市獲利的美國投資人之一，從1966年到1988年，道瓊指數才上漲一倍，但日經指數'
  merge: -1
  img_proc: true
- pgno: 69
  md: '（Nikkei average）卻上漲了17倍。


    已經去世的麥克斯．海恩（Max Heine），過去執掌共同股份（Mutual Shares）基金，他同樣是足智多謀，善於自由思考。他的接棒人麥可．普萊斯（Michael
    Price）稟承傳統，專以資產豐厚的低價股為目標，用五毛錢買一美元，等到市場給予應有的價格後再脫手獲利，績效相當耀眼。約翰．奈夫（John Neff）是投資冷門股的高手，常常伸長脖子找對象。盧米－沙里斯（Loomis-Sayles）公司的肯．海伯納（Ken
    Heebner）也是伸長脖子找目標，成績同樣斐然。


    彼得．迪羅特（Peter deRoetth）是我的朋友，投資小型股很有一套。迪羅特畢業於哈佛大學法學院，可是對證券投資有著不可救藥的熱情，玩具反斗城就是他推薦給我的，他的成功秘訣就是沒有讀過商學院，不必等畢業後再費力氣拋棄那些課堂理論。


    喬治．索羅斯（George Soros）和吉米．羅傑斯（Jimmy Rogers）則是靠著連我也摸不透的高深門道，賺進數百萬美元，例如：放空黃金、買進選擇權以及澳洲債券避險操作等等。而最最偉大的投資人巴菲特，他尋找的機會跟我要找的差不多，只是他一旦發現了投資目標，就會整家公司買下來。


    這些享有大名的人只是少數的例外，其他的則是為數眾多、庸庸碌碌的基金經理人，愚蠢不堪者有之，操盤如夢遊者有之，阿諛奉承跟隨市場追漲殺跌者有之，膽小畏縮裹足不前者有之，再加上各式各樣的校園追隨者、冥頑不靈者，和自個兒綁手綁腳的模仿者！'
