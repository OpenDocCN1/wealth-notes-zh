  md: '# 9. 擁有利基優勢


    與其投資二十世紀福斯電影公司，我寧可買座砂石場。因為電影公司必須跟其他競爭對手拚個你死我活，但是砂石場卻擁有利基優勢。二十世紀福斯公司後來買下圓石灘及其擁有的砂石場時，想必也是有此體認。


    很顯然地，擁有一座砂石場要比經營珠寶生意穩當多了。如果是經營珠寶業的話，你必須和整個城市、國家，乃至全世界的珠寶商競爭，因為大家都可以到世界各地旅遊，順便買一些珠寶飾品帶回國。但如果你擁有布魯克林區唯一的一座砂石場，那可就是只此一家的獨門生意，而且保證沒人有興趣來分一杯羹。


    這種圈內人稱之為「拌料」（aggregate）的生意，說穿了不過就是把一堆不值錢的石頭、砂子、小石子攪拌在一起。但是這些不值錢的東西攪拌在一起後，一噸大概可以賣到3美元，一杯柳橙汁的錢可以買半噸，如果你開輛小卡車來，就可以買一整車回去，倒在自家的草坪上。


    砂石場的價值就在於沒有競爭對手，位於兩個城鎮之外的砂石場，根本沒辦法越界來搶你的生意，因為光是運費就會把他們的利潤給吃光。而且，不管芝加哥的砂石拌料品質有多麼好、多麼棒，那裡的業者也沒有辦法入侵你在布魯克林或底特律的地盤。而且由於砂石太重，拌料業又是獨占事業，因此你不必請十名律師來保護你的品牌。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '這種獨占事業對企業本身和股東有說不完的好處。英可公司目前是全世界最大的鎳金屬生產公司，未來五十年內也將是一枝獨秀。我曾經去過猶他州的賓漢礦場（Bingham
    Pit）銅礦坑，站在坑道口往下望，心裡充滿了悸動，我想不管是日本還是韓國，都不可能弄出像這樣的礦場。


    只要你做的是獨占事業，你就可以調高售價。以砂石場為例，你可以把售價調高到剛好不會引起鄰近砂石場想要越界來和你競爭的水準，事實上，鄰近的砂石場所採用的定價策略也是一樣。


    此外，你的挖土機、推土機、碎石機等設備，都可以提列折舊成本，作為盈餘減項，而達到節稅的目的。同時，砂石資源也可以提列備抵損耗（depletion allowance），埃克森石油及大西洋富藏公司（Atlantic
    Richfield）的石油或天然氣礦藏，就是採用這樣的會計處理方式。因此，我實在很難想像有人會因為經營砂石場而破產，所以你要是没有能力自己設立一家砂石場，那麼就去買拌料廠的股票，例如：渥肯石料（Vulcan
    Materials）、卡美特、波士頓砂石（Boston Sand & Gravel）、德拉佛（Dravo）及佛羅里達採石場（Florida Rock）等等。而當大公司如馬汀－馬里塔（Martin-Marietta）、通用動力（General
    Dynamics）或亞士蘭德（Ashland）等在出售旗下的事業單位時，還是都會將砂石場保留下來。


    我總是在尋找利基優勢，完美的企業必定都擁有某項利基。巴菲特一開始是買進麻州紐貝德福市（New Bedford）一家紡織廠，不過他很快就知道這門生意毫無利基。他的紡織廠經營得很糟，但後來他靠投資各式利基，幫股東賺進了幾十億美元。巴菲特很早就發'
