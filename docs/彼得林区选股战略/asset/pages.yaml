- pgno: 294
  md: '率之間的關係也很合理，那麼寧可挑選成長率較高的股票。例如一家公司的本益比是20倍、成長率為20%，另一家公司的本益比是10倍、成長率為10%，那麼成長率20%的股票會比較好。這樣的說法乍聽起來有點奇怪，但如果各位了解盈餘快速成長將會推動股價上揚，便會知道它的重要性了。各位看看表13-1，兩家公司都從每股盈餘1美元出發，十年後的差別有多大。


    在一開始，本益比20倍的A公司股價是20美元（每股盈餘1美元乘以20倍），十年後的股價是123.8美元（每股盈餘6.19美元乘以20倍）。B公司一開始的股價是10美元（每股盈餘1美元乘以10倍），十年後是26美元（每股盈餘2.6美元乘以10倍）。


    即使投資人不相信A公司可以維持20%的高成長率，使得本益比從原先的20倍降低為15倍，十年之後其股價還是高達92.85美元。不管怎麼比，持有A公司都會比持有B公司來得好。


    如果我們假設A公司的成長率是25%的話，十年後每股盈餘為9.31


