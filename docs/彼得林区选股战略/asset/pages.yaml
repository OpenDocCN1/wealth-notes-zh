- pgno: 106
  md: '# 《浩劫1990》一書廣受歡迎，不正代表著美國經濟正要走向空前的繁榮嗎？


    投資人情緒的快速反轉更是令人驚訝，儘管真實面可能並未有絲毫的改變。在1987年10月大崩盤的前一週或兩週，如果到亞特蘭大、奧蘭多或芝加哥出差，看到那些簇新的大樓，誰都忍不住要讚嘆：「喔，景氣真是欣欣向榮啊！」但是在崩盤後才幾天，我相信同樣的那批人在看到那些新建築時都要哀嘆：「完蛋了，這個地方有問題嘛！這些公寓能賣給誰？辦公大樓可以租給誰呢？」


    潛藏在人們內心深處的東西，會讓人們成為最糟糕的市場時機選擇者。粗心大意、輕舉妄動的投資人，大概就是根據三種情緒的變化來進出股市：憂慮、自滿和灰心沮喪。在股市下跌或經濟衰退時，他們憂慮不已，因此不敢進場逢低承接好公司的股票；等到價格上揚，大家都看好時，他們才敢跟著追逐高價，然後自得意滿的看著自己的股票持續上漲；但此時應該要回頭檢視基本面，可是他們卻都沒有這麼做。等到最後遇上艱困時期，股價下滑，跌到成本以下，他們才灰心沮喪地舉白旗投降，心焦氣餒地認賠出場。


    有些投資人自以為是「長線投資人」，可是一旦碰上股價大跌（或是小漲），這些長線投資人馬上就會變成短線投資人，不是賠掉一大筆錢，就是為了一點蠅頭小利而興奮不已。在波動無常的股市中，投資人很容易驚慌。自從我管理富達麥哲倫基金後，在過去的八次空頭行情中，基金跌幅大約在10%到35%之間。1987年那一年，我的基金在8月都還上漲了40%，結果到了12月反而下跌了11%，全年總結下來只有小漲1%，我那年年上漲的紀錄，差一點就被打破了！託福、託福。最近我看到一份研究指出，股價每年的'
