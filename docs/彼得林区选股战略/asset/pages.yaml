- pgno: 8
  md: '或家用品零售商Home Depot一樣，要求新設的網站公司先拿出業績實效再說。


    對今天的網際網路熱門股來說，「基本面」可說是老舊陳腐了。僅僅是一個「達」加個「康」，和一套激勵人心的概念，就能讓投資人拿錢出來買股票，而所支付的價格竟然是一般公司要付出十年的努力和成長，並且保證未來一片榮景才能得到。後續忙著抬轎的投資人也樂於奉上大把銀子，而所根據的是未來主義式的「基本面」，且隨著價格不斷上揚，「基本面」似乎也越來越好。


    如果從矽谷瑪莎拉蒂（Maserati）高級跑車的銷售量來判斷，讓達康公司股票公開上市的企業主的確賺了大錢，而那些先期買進、及時獲利了結的投資人也賺飽了。不過對那些隨後追高買進的投資人，我還是要提醒他們小心一點，投資一家股價已領先反映幾年盈餘飛速成長、且其業務榮景不曉得會不會達成的達康公司，這樣做合理嗎？我這樣問各位一定也都知道答案是「不」。這些剛上市的股票往往在第一個交易日就上漲為兩倍、三倍，甚至是四倍，但除非你的營業員可以幫你敲到上市價格，不然你大概也不會有什麽賺頭。不過要買到上市價格可是非常困難，因為網際網路股公開上市的搶購狀況，比搶購美式足球超級盃的門票還要嚇人。因此你或許根本賺不到半毛錢，因為有些達康股票的天價都是出現在上市的頭幾個交易日內，而且此後通常很難再回到那個水準。如果你覺得自己沒趕上達康類股的熱潮，那就該提醒自己，達康類股的投資人其實也很少能從裡面賺到錢。光從上市價格來衡量其漲幅，事實上是一種誤導，因為能夠買到那個價格的人微乎其微，只有那些中籤的投資人才能賺得比較多。'
