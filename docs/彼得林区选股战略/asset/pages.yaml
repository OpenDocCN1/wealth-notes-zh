- pgno: 77
  md: '和那些幫專業同儕挑選股票的基金經理人相比，我的情況會好一點，因為我服務的是一般大眾。富達麥哲倫基金的受益人大都是小散戶，雖然在任何時候都可以自由選擇投資或要求贖回，但他們不會一支股票、一支股票地檢討我的操作績效，或在事後批評我挑選的股票不當。可是底下我們要說的這位在「盲目信託」公司為「白麵包」公司操作退休金帳戶的笨蠢狗先生，可就沒這麼幸運囉。


    笨蠢狗先生其實很了解他所持有的股票，他在盲目信託公司擔任了七年的投資組合經理人工作，而且做過一些不錯的投資決策，他所需要的只是在不受干預的情況下進行選股。但是白麵包公司的副總裁弗尼特也自認很懂股票，因此每三個月就要嚴格檢視笨蠢狗的操作績效。除了每三個月一次的重刑侍候外，弗尼特每天還要打兩次電話給笨蠢狗，以得到最新消息。笨蠢狗對於弗尼特此舉十分不悅，他真的希望自己從未認識弗尼特這個傢伙，而且跟白麵包公司毫無關係。但他就是得浪費許多時間和弗尼特討論要挑選哪些好股票，反而沒時間做好自己的工作。


    基金經理人通常得花四分之一的工作時間向別人解釋，為什麼他要這麼做、為什麼不那麼做。首先是要向自己信託部門的直屬上司解釋，然後向其最後的老闆，即向白麵包公司的弗尼特之類的信託客戶解釋。有個不成文的規矩是：客戶越大牌，投資組合經理人就要花越多時間去報告、溝通，這樣才能討好大客戶。當然，少數的大客戶像福特汽車、伊士曼·柯達（Eastman
    Kodak）、伊頓（Eaton）等公司算是例外，但是一般而言，大客戶的確比較難侍候。


    現在再來說說難搞的弗尼特吧。在最近一次檢討會議中，弗尼特發'
