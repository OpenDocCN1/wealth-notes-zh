  md: '我親眼看到的證據顯示，這些公司當中有數百家已經降低成本，並且提升營運效率。這意味著其中許多公司的表現都比1960年代末期更好，但是當時的投資人反而比較樂觀。現在的企業執行長都更聰明，且更急於追求績效表現，甚至連經理人和勞工也知道要提升競爭力。


    我每天都聽說愛滋病會毀了美國，其他還有旱災、通貨膨脹、經濟衰退、預算赤字、貿易赤字、美元貶值等等，這些都會毀了美國。哎呀！真是可怕，以前也有人說美元匯率太強會害死美國呢。又有
    人說，房地產市場將要崩潰了，上個月大家開始擔心這一點，不過這個月又開始擔心臭氧層破洞的問題。市場有句老話說，股票市場就是在爬一座「疑懼之牆」，如今這座牆不但又高又大，而且還日益高大。


    針對貿易赤字會毀了美國的說法，我自然也有一套說詞來鼓勵大家。英國的貿易赤字也非常龐大，而且已經持續七十年了，可是英國還不是活得好好的。不過這些話就不勞贅述了，因為大家早就忘了貿易赤字，反而要開始擔心如果出現貿易順差該怎麼辦呢。


    為什麼華爾街的國王總是沒有穿衣服呢？每次他老兄風風光光地盛大遊行時，我們大家都緊張得要命，深怕看到國王原來是光溜溜的！


    我曾經聽到有人說，如果你投資的公司被企業狙擊手挑中、或是被公司管理階層收購，那麼你應該感到高興才對，因為股價可能在一夕之間漲一倍。'
