- pgno: 335
  md: '露潔的股票也會一起遭殃，即使它根本不是景氣循環股，而且和日本人也毫無關係。


    現在連占星術士也在談論股票，而且和美林公司的經濟分析師一樣，說得頭頭是道，可是得出的結論卻又南轅北轍，難怪我們會被搞混。


    最近我們都得應付這種敲邊鼓效應，某個不祥的訊息一再被重複傳播，直到大家都無法幸免。幾年前，大家都在談論貨幣供給額 M-1，當年我在當兵的時候，M-1不過是一種步槍！突然間，M-1變成一個頂重要的數字，華爾街的未來全都取決於這個數字，可是連我都搞不清楚這個數字是什麼。還記得One
    Hour Martinizing嗎？大概也沒有人知道這是什麼，或許數百萬家的乾洗店老闆也沒問過這是在幹嘛，也許，M-1其實就是Martinizing One，這是一小時交件的乾洗服務，也許美國經濟顧問委員會（Council
    of Economic Advisors）裡有人以前是開乾洗店的吧。總之，報紙上連續幾個月說M-1成長太快，人們擔心這會讓經濟趨緩，進而威脅到全世界。還有什麼比「M-1正在升高」更會讓你想要賣掉股票的呢？即使你根本不知道M-1到底是什麼。


    之後，突然間我們再也沒聽過M-1貨幣供給額的可怕上漲等等之類的說法，大家的注意力開始轉向聯準會（Fed）對會員銀行的貼現率。可是又有幾個人知道什麼是貼現率呢？你也可以把我算上一個。而又有幾個人知道聯準會是做什麼的呢？聯準會的前主席米勒（William
    Miller）曾說，有23%的美國人以為聯邦準備（Federal Reserve）是某個印地安人保留區（reservation），有26%的美國人以為是野生動物保護區（preserve），還有51%的美國人說是某個'
