- pgno: 7
  md: '（Dorothy Sayers）。我朋友就在身邊的電腦前坐下，敲了幾個鍵，就找出一份完整的賽爾斯出版書目，還包括讀者的評論，以及一顆星至五顆星的評等（在一些文學網站裡，作者也像基金經理人一樣被評等）。我買了四本賽爾斯的書送給卡洛琳、挑選了包裝紙、再鍵入我家的地址，這樣就解決一份聖誕禮物了，我就是這樣認識了亞馬遜網路書店（Amazon.com）。


    各位在本書稍後會看到我是如何在飲食、購物之間談笑用兵，發掘出最棒的股票，有時甚至是在專業選股高手都還沒有發覺之前。而由於亞馬遜網路書店只存在於網路空間，並非郊區的某家百貨商場裡，所以我就忽略了；不過亞馬遜網路書店並非在我的理解範圍之外，它的業務狀況跟乾洗店一樣清楚明白。在1997年時，它的股價相對於預期前景來說還算合理，而且當時它的財務狀況甚佳，但是我沒能看到這種全新包裝下的機會，要是我下點苦工做研究，也許就可以看出網路購物的廣大市場，以及亞馬遜發展此項業務的能力。不過，我就是沒有，光是在1998年裡，亞馬遜的股價就飆漲了10倍！


    至少有五百家「達康」公司（dot.com）的股票展現出驚人的飆漲行情，亞馬遜網路書店只是其中之一而已。在高科技及達康類股中，有很多才剛公開發行、上巿的股票，一下子就飆漲了10倍，所花的時間比史蒂芬．金（Stephen
    King）寫一部驚悚小說的時間還短。這類投資不需要太多耐心，以前沒有網際網路的時候，企業體要慢慢發展，才能擠進億萬身價的行列；但是現在可不同了，早在公司開始獲利之前，股價總值就可以達到數十億美元，而有些公司甚至連營收都還沒有呢！市場先生（Mr.
    Market，虛構的角色，一般用來作為股票的代稱）並不像過去要求沃爾瑪百貨（Wal-Mart）'
  merge: -1
