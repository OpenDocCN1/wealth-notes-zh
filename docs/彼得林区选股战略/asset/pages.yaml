  md: '除了廢棄物處理業之外，華爾街也忽略了葬儀業，而SCI正是做葬儀社的生意。


    多年來，這家位於休士頓的公司一直在收購全美各地的小葬儀社，這種做法跟甘乃特（Gannett）公司四處收購地方小報差不多。後來，SCI變成像麥當勞一樣的葬儀連鎖公司，它只挑那些每個星期要處理十幾個甚至更多喪家生意的積極地方葬儀業者進行合作，至於那些每禮拜只做一、兩件生意<|start|>就敬謝不敏。


    最後，這家公司擁有461家葬儀社、121座墓園、76家花店、21家葬儀用品產銷中心，以及3家棺木、骨灰罈銷售中心，可說是上下游完全垂直整合。後來他們幫大富翁霍華・休斯（Howard
    Hughes）舉辦葬禮，因而名揚全國。


    它們也首創分期預付葬儀費用的辦法，並且廣受各方歡迎。這個方法是讓大家先預付棺木、骨灰罈和葬儀費用，藉以減輕日後家人的負擔。即使舉辦葬禮時的費用已經調漲為原先的三倍，但公司還是以簽約時的價格收費，這對喪家而言實在是個好主意，對SCI來說也是。


    SCI可以從分期預付銷售中馬上收到錢，而且拿來複利生息。如果他們在預付銷售上做了5,000萬美元的生意，等到真正為喪家舉辦葬禮時，早 extraterrestrial
    成長為幾十億美元了。這種預付制度讓SCI忙得快喘不過氣來，因此最近開始把這項生意轉介給其他葬儀社承接。過去五年來，預約葬禮業務的成長率每年高達40%。


    偶爾，利多題材還能錦上添花，竟然翻出一張大王牌來。原先持有'
