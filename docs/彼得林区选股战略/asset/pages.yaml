  md: '標的，特別是在合併與收購大行其道的狂熱年代更是如此。被鎖定為惡意收購對象的公司，為了對抗收購者，通常會把一些事業單位賣掉或分拆出來，讓它成為公開上市公司。而當一家公司被收購後，旗下的事業單位也往往會被出售求現，成為可以投資的獨立事業單位。如果你聽到了某家剛分拆出來的公司，或者剛分到一家新創事業的股票，不妨馬上研究研究，看看是否值得再多買一些。等到分拆完成一、兩個月後，你也可以看看這家新公司的管理階層，包括經理人和董事會成員等，是否也正在買進自家公司的股票，如果有的話，表示他們也看好公司前景。


    有史以來最棒的分拆公司股票，當屬從美國電話電報公司（AT&T）分裂出來的「小貝爾」公司：美國科技（Ameritech）、大西洋貝爾（Bell Atlantic）、南方貝爾（Bell
    South）、奈涅克斯（Nyn ex）、太平洋電話（Pacific Telesis）、西南貝爾（Southwestern Bell）以及美國西部公司（US
    West）。雖然母公司AT&T的股價很難引起投資人的興趣，但是這七家新創公司的表現卻是可圈可點，從1983年11月到1988年10月，平均漲幅達114%，再加上股利，總報酬率可達170%以上。這個成績不但是大盤績效的兩倍，而且也打敗大部分知名共同基金的績效表現，包括在下的麥哲倫基金。


    這七家區域性的公司在獨立之後，即能致力於降低成本、提升盈餘，並且享受較高的獲利成長。它們取得區域性和地方性的市話業務、電話黃頁業務，加上透過AT&T的長途電話線路所產生的每1美元收益，它們還可以分得50美分，這種生意真是再好不過了！而且，它們已經經歷了大幅擴增投資、更新設備的初期階段，所以不必再增資發行更多股票，導致股東權益被稀釋。而且就像我們'
