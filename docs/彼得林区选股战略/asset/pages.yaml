- pgno: 41
  md: '各位也許會認為，證券專家守著股市即時資訊系統，因此能夠獲得那些複雜而高深的小道消息，所以能提供我們最佳的投資建議。但是我個人就像這位消防隊員一樣，靠著土法煉鋼照樣能獲得許多訊息。我每年要拜訪數百家上市公司和那些公司的執行長、財務分析師，以及我基金公司的同事，不斷舉行令人頭暈目眩的會議。除了這種正規的作業外，我還是隨時都能碰上一些大贏家，而這樣的方式各位也都可以做到。


    我到加州出差的途中，發現塔可貝爾（Taco Bell）的墨西哥肉捲好吃；拉昆特汽車旅館是它的競爭對手假日大飯店（Holiday Inn）裡頭的人告訴我的；富豪汽車（Volvo），我家人跟朋友都開這種車；蘋果電腦，我家小孩有一台，公司的系統經理也買過好幾台；殯葬服務公司SCI，是富達基金一位電子類股分析師在前往德州途中發現的（他跟殯儀館完全無關，這並不是他的研究領域）；唐金甜甜圈連鎖店，我喜歡那兒的咖啡；最近，重新改頭換面的家用零售業一號碼頭（Pier
    1 Imports），這是我太太推薦的。事實上，卡洛琳真是我的好幫手，蕾格絲（L''eggs）絲襪就是她發現的。


    蕾格絲可謂常識力量的完美範例，它是1970年代兩個最成功的消費產品之一。1970年代初期，我在接掌富達麥哲倫基金以前，仍是公司的證券分析師。我到全美各地拜訪紡織廠，計算它們的獲利率、本益比、布料上的經緯線，從而對紡織業有了些許了解。但是，這些都比不上卡洛琳提供的資訊，我研究了半天也沒有發現蕾格絲，而她上雜貨店就找到啦！


    就在雜貨店結帳櫃台旁新設的鐵架上，陳列著彩色塑膠蛋型盒裝的'
