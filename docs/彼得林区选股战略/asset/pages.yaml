- pgno: 137
  md: '對我來說，想要在股票上獲致成功，自己做研究功課就像先前你們已經發誓要忽視市場的短期波動一樣重要。或許有些人不曾做過我所說的研究功課，卻還是在股票上賺到錢，但我們為什麼要冒這種無謂的風險呢？不做研究的投資，就像是玩楓哈撲克牌卻不看牌一樣荒唐。


    不知道是什麼原因，股票分析這一行被搞得神秘兮兮、高深莫測，結果讓原本相當謹慎的投資人，也會一時興起就押下終生積蓄。有人花了一整個週末的時間做研究，比較各家航空公司從美國飛往倫敦的機票價格，可是卻花不到五分鐘的時間去了解荷蘭航空（KLM），就買進該公司500股。


    再來看看我們的朋友哈利一家人，他們自認為是最聰明的消費者，買枕頭套要詳讀標籤，買洗衣粉要比較盒子上標示的價格跟容量，買燈泡也要比較耗電瓦數，但是他們辛辛苦苦攢下來的錢，卻宛如兒戲般地在股票投資上虧損了一大半。


    哈利不是會窩在躺椅上閱讀《消費者報導》（Consumer Reports），比較五種衛生紙的厚度和吸水性嗎？他小心翼翼地評估是否該換成察明牌（Charmin）衛生紙。但是，他是否願意在投資5,000美元以前，用同樣多的時間來研究生產察明牌衛生紙的寶鹼（Procter
    & Gamble）呢？當然不會！他大概是先敲進股票，然後就把寶鹼的年報扔進垃圾筒裡。


    這種既不察又不明的毛病，可是太普遍了，不過也不難解決。你只要在投資股票前，像你買日用品一樣地盡心盡力，那就夠啦！而且在買了股票之後，你也不能放鬆追蹤研究的功課，因為個別股票的'
  merge: -1
  img_proc: true
- pgno: 138
  md: '表現或許會不符合你的預期，這是因為股票有許多種類，而即使是同一產業，個別公司的差異也很大，所以在追蹤調查上市公司的題材時，必須先做基本的區分。


    # 盈餘是多少？


    以下我要說的部分，可以拿寶鹼公司作為一個好例子。記得我先前提過，蕾格絲絲襪是1970年代最賺錢的兩種新產品之一嗎？另一個則是幫寶適（Pampers）紙尿布。只要家裡有小嬰兒，或親戚朋友有小嬰兒的人就會了解，當時幫寶適有多麼受歡迎，而包裝上就寫著生產廠商是寶鹼公司。


    不過光是幫寶適暢銷，你就應該趕快買進寶鹼公司的股票嗎？別忙！先研究研究再說。你大概只要花五分鐘時間，就會知道寶鹼是一家非常大的公司，而幫寶適的銷售額對寶鹼公司的盈餘貢獻只占很小的比重。幫寶適對寶鹼公司而言的確是有點幫助，但遠不及蕾格絲絲襪對漢斯這種小公司的挾注那麼大。


    如果你是因為個別產品而注意到公司的股票時，首先要弄清楚：這項商品的成功，對該公司的盈餘會有多大的影響？回到1988年2月，我記得當時投資人非常熱中蕾婷-A（Retin-A），這是嬌生公司製造的乳膏。1971年蕾婷-A乳膏剛推出時是消除粉刺的保養品，後來醫學研究顯示它可以對抗太陽曝曬後所產生的黑斑。媒體可是愛死這則報導囉！撰寫頭條新聞的記者宣稱：蕾婷-A是抗老乳膏，是「皺紋殺手」，活像嬌生公司在一夕間挖到了青春不老泉！


    在股市的一片搶進聲中，嬌生公司的股票在兩天內暴漲了8美元'
  merge: -1
  img_proc: true
- pgno: 139
  md: '（1988年1月21日、22日），總市值激增了14億美元。但是在這股狂熱氣氛中，投資人想必是忘了，前一年蕾婷-A的銷售量只讓嬌生公司的總營收增加3,000萬美元，而且這項新療效還得經過聯邦食品藥物管理局（FDA）的檢驗才行。


    當時還有另外一個例子，投資人顯然就有做功課了。有 consensus? 有一份新的醫學報告指出，每兩天服用一顆阿斯匹靈，可降低心臟病發作的機率，該項研究是以必治妥的百服寧（Bufferin）為樣本，但是報告公布後，必治妥的股價卻幾乎紋風不動，只小漲了50美分，到達42.875美元。這肯定是因為許多人知道，前一年百服寧在美國國內市場的銷售額只有7,500萬美元，在總營收高達53億美元的必治妥公司當中，所占比例還不到1.5%。


    相對的，史特林藥廠（Sterling Drug）的拜爾（Bayer）阿斯匹靈對股價就頗有助益。史特林的阿斯匹靈銷售額雖然只占總營收的6.5%，但所產生的盈餘卻占總盈餘的15%，可說是史特林藥廠最賺錢的商品。後來史特林藥廠被伊士曼．柯達公司收購。


    # 公司大，漲幅小


    公司的規模大小和你能否從該公司的股票賺到錢大有關係。你正在注意的這家公司規模有多大呢？撇開特定的產品不說，一般而言，大公司的股價很少會有巨幅的成長。雖然在某些行情中，大公司的股價表現會很穩定，但如果想看到巨幅的成長，那
    Ep? 那就只能冀望小型股了。如果是買進諸如可口可樂的大象股，就甭指望它會在兩年內漲四倍，要是你買進的價格很棒，也許六年內可能會漲為三倍，但是想要在兩年內賺大錢幾乎不太可能。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '寶鹼或可口可樂這類股票倒是沒什麼問題，最近的表現也還不錯。不過各位得了解，對於大公司或大型股，都不應該抱持不切實際的幻想。


    有時候大公司遭受到連番的重擊，也會倒地不起，而且要等到它復原時，股價才可能出現大成長。克萊斯勒、福特汽車以及伯利恆鋼鐵等，都曾經出現過這種狀況；鐵路運輸業者柏林頓北方公司（Burlington
    Northern）在營運走下坡時，股價從每股12美元跌到6美元，但後來卻攀升到70美元，不過，這類起死回生的股票都是特例。在一般的企業營運狀態下，諸如克萊斯勒、柏林頓北方、杜邦（DuPont）、道氏化學（Dow
    Chemical）、寶鹼或可口可樂等公司，都很難出現快速成長，變成一支十輩安打。


    像奇異這種大公司，想要在可預見的未來變成兩倍或三倍大，在理論上根本不可能。奇異的規模到底有多大呢？它的總產值大約是美國國民生產毛額的1%，美國人每花1美元，就有1美分流入奇異。偉大吧！美國人每年要花個幾兆美元，每一美元當中就有一美分是用來買奇異所提供的商品或勞務（例如電燈泡、電器產品、保險、NBC電視台等等）。


    奇異可說是事事穩當：合理的併購、降低成本、開發成功的新產品、關閉狀況百出的子公司、避免陷入電腦業的泥淖（它把錯誤的投資事業賣給了漢威聯合〔Honeywell〕），雖然如此，奇異的股價還是只能寸步前進。這可不是奇異的錯，原因只在於公司的規模實在太大了。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '奇異流通在外的股數高達9億股，總市值390億美元，每年盈餘超過30億美元，光是最後一項就足以讓奇異名列《財星》500大企業。現在奇異如果想要加速成長，恐怕就得征服全世界才行。由於企業的快速成長正是推升股價的原動力，難怪在拉昆特汽車旅館股價飆漲之際，奇異的股價卻只是緩慢推升。


    如果其他條件都一樣的話，操作小型股的績效會比較好。以過去十年來說，同樣是連鎖零售類股，投資棧省百貨就會比西爾斯賺錢。同樣以廢棄物處理業來說，資本額達數十億美元的廢棄物管理公司（Waste
    Management, Inc.），可能就比不上才剛加入競爭的新對手來得強勁。最近正在回升的鋼鐵業也是一樣，規模較小的紐可公司帶給股東的好處，會比美國鋼鐵公司（U.S.
    Steel，現稱「USX」）更大。在製藥業剛復甦時，小規模的史克製藥公司也比大規模的美國家庭用品公司表現更佳。


    # 六種類型


    我的做法是確定個別企業在其產業中的規模大小，再確認這家公司是屬於哪種類型的股票。六種一般的類型包括：緩慢成長股、穩健成長股、快速成長股、景氣循環股、資產股，以及轉機股。其實股票可以有各式各樣的分類方式，好比營業員也有許多種類型，不過我發現，只要掌握住這六種類型，就夠投資人做分類之用了。


    國家有國家的成長率（即國民生產毛額〔GNP〕），產業有產業的成長率，個別企業當然也有其成長率。不管是什麼樣的公司，所謂的「成長」就是指今年做的（例如製造汽車、擦皮鞋還是賣漢堡）比去年更多。艾森豪總統曾經說：「現在的東西看起來似乎比過去'
  merge: -1
  img_proc: true
- pgno: 142
  md: '更多了。」這就是經濟成長相當好的定義。


    追蹤產業成長率這件事，如今也成了一種行業，並且產生無數的圖表以及比較數值。光是一家個別公司的成長率，就隱藏了許多玄機，想要界定這家公司的成長狀況，也有許多不同的方式：營收成長、利潤成長、盈餘成長等等。不過當你聽到「成長公司」時，你可以假定這是指其正在擴張，連續幾年的營收、產出和利潤都在增加。


    個別企業的成長要搭配整體經濟的成長狀況來看，才會比較清楚。如同各位所猜想的，緩慢成長的公司就是成長非常慢，跟一個國家的GNP成長速度差不多，而目前美國GNP的年成長率大概是3%左右。快速成長的公司則是成長快速，一年也許成長20%到30%，甚至更高，這就是爆發力十足的股票。


    在我的六種分類中，有三種股票和成長速度有關：緩慢成長股、穩定成長股和快速成長股，而最後一種是最值得注意的超級股票。


    # 緩慢成長股


    這些大型、老化公司的成長率，通常還是會比國家的GNP快一點。緩慢成長股並不是原本就成長緩慢，它們一開始也是快速成長股，後來才慢慢失去活力；這或許是因為它們已經擴張到了能力的極限，也可能是因為它們無力再尋求新的機會。而當一個產業的成長幅度大幅減緩（它們通常會如此），產業中的個別企業也會跟著失去成長動力。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '以目前的緩慢成長股來看，電力事業是其中最受歡迎的類股。不過電力事業類股在1950年代及1960年代可都是快速成長股，擴張速度超過GNP的兩倍，這些電力公司在當年都是成功的企業，也是棒透了的股票。那時候大家競相裝設中央空調系統、換上大冰箱，毫不吝惜節節升高的電費支出，使得電力供應成為高成長產業。大型電力公司的成長率高達兩位數，尤其在美國南部陽光帶（Sunbelt）附近的電力公司更是如此。一直到1970年代，由於能源價格暴漲，消費者也學會了要節約用電，此時電力公司才慢慢喪失活力。


    任何受到市場歡迎的快速成長產業，遲早都會變成緩慢成長產業，不過許多分析師和預言家還是會受到愚弄。很多人常以為事情永遠不會改變，但顯然並非如此。美鋁公司（Alcoa）曾經也像蘋果電腦一樣意興風發，當時煉鋁業正是快速成長產業。1920年代正值鐵路業的擴張期，當時克萊斯勒（Walter
    Chrysler）離開鐵路業，跑去經營一家汽車廠，薪水大幅減少，有人告訴他：「克萊斯勒先生，這可不是鐵路業啊！」


    後來汽車業成了快速成長產業、再來是鋼鐵業、接著是化工業、電力事業，後來是電腦產業。現在連電腦產業的成長也趨緩了，至少大型電腦主機和迷你型電腦的部分是如此。像IBM和迪吉多電腦（Digital），總有一天會變成緩慢成長股。


    只要看看證券商所提供或是到圖書館借閱的股價走勢圖，很容易就可以辨識出緩慢成長股。屬於緩慢成長股的休士頓工業公司，其走勢圖看起來就像美國德拉瓦（Delaware）州的地形圖一樣，沒什麼起伏；和沃爾瑪百貨的股價走勢圖相比，後者就像是火箭升空，所以沃爾瑪百貨絕對不是緩慢成長股（見圖7-1及圖7-2）。'
  merge: -1
  img_proc: true
