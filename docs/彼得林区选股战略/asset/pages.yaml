- pgno: 344
  md: '亞歷山大－鮑德溫公司（Alexander and Baldwin）在夏威夷擁有九萬六千英畝的土地資產，再加上獨占的航運權及其他資產，很多人認為它的股價絕對不只5美元（經過分割調整）。他們苦等了好幾年，可是股價動也不動。後來有位溫伯格（Harry
    Weinberg）先生大力敲進5%的股權，接著又加碼到9%，最後達到15%，此時其他投資人才如夢初醒，紛紛搶進，結果股價一路攀升到32美元。在1987年10月大崩盤時，它的股價跌到16美元，幾個月之後又回升到30美元。


    史托勒通訊公司和迪士尼公司也是如此。迪士尼過去是一家令人昏昏欲睡的公司，它甚至不知道自己有多少身價，直到史坦伯格出現，要求管理階層「增進股東的價值」，此時公司才有所長進，從卡通片走向更為寬廣的成人市場，而且它經營的迪士尼頻道相當成功，在日本的迪士尼樂園生意興隆，未來的歐洲迪士尼樂園也充滿希望。迪士尼擁有不可取代的影片資產，還有加州和佛羅里達州的房地產，因此是一支集資產股、轉機股和成長股於一身的股票。


    如今，一家企業的隱藏資產不必等到你的兒子、甚至孫子那一代才會被發掘出來。投資人一輩子苦守著價值被低估的股票，結果價格卻有如死水，這種情況已經成了過去式，現在已大大不同了。目前要求「增進股東的價值」的事件，出現的速度可是比以前快了許多，這就得感謝那些上窮碧落下黃泉、搜遍各處挖掘資產股的有錢大亨（幾年前皮肯斯〔Boone
    Pickens〕曾到我辦公室，告訴我海灣石油公司〔Gulf Oil〕可能會被收購。雖然他說得頭頭是道，不過我很快就下結論認為不可能，因為這家公司的規模太大，不可能有人買得起。結果，海灣石油最後還是被雪芙龍公司〔Chevron〕買'
  merge: -1
