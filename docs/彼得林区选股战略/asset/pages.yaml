    # 當心「未來的什麼」


    另一種我想要避開的股票，就是那些被稱為「未來的IBM」、「未來的麥當勞」、「未來的英特爾」、「未來的迪士尼」等企業。經驗告訴我，那些被稱為「未來的什麼」（the
    next of something）的，幾乎都成不了大事，這點不論是在百老匯、暢銷排行榜、NBA職業籃球，還是華爾街都一樣。不是常常聽到有哪個球員是「未來的威力·梅斯」（Willie
    Mays）嗎？哪本小說又是「未來的《白鯨記》」嗎？結果，威力變沒力，白鯨變白象！股票也是這樣。


    事實上，當某家公司被視為未來的什麼時，不僅這個後起之秀就快玩完了，甚至連原先那個模範樣板也前途堪慮。當你聽到某家電腦公司被稱為「未來的IBM」時，大概就可以猜想IBM很快就要倒楣了，而且實情的確也是如此。如今，大部分的電腦公司都希望不會成為「未來的IBM」，這表示慘遭圍攻的龍頭老大現在可以稍微喘口氣。


    當電路城百貨（Circuit City Stores）在電器零售市場大放異彩後，後頭也跟著一堆「未來的電路城」搶食大餅，包括First Family、Good
    Guys、Highland Superstores、Crazy Eddie，以及Fretters。1984年電路城在紐約證券交易所掛牌上市，之後股價漲了四倍，並沒有像IBM那樣慘遭厄運，反而是把那些徒子徒孫修理得慘兮兮，它們的股價跌幅大約在59%到96%之間。


