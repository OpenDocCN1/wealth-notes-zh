- pgno: 280
  md: '# 再談隱藏資產


    帳面價值可能會高估，也可能會低估真正的價值，而後者就是各位要找的資產股類型。


    擁有天然資源的公司，例如土地、林木、石油或貴金屬等，其帳面價值通常只有真正價值的幾分之一而已。例如在1987年時，貴金屬生產商韓地哈曼公司（Handy and
    Harman）的庫房裡有一大筆黃金、白銀和白金庫存，其帳面價值是每股7.83美元，而且是以買進當初的價格來計算，但這已經是三十年前的事 情了！如果以今天的價格來計算（白銀每盎司6.4美元、黃金415美元），這批貴金屬資產每股的平均價值就高達19美元。


    當時韓地哈曼的股價是每股17美元，比它的貴金屬資產價值還要低，那麼這就是一支資產股了吧？我們的巴菲特認為這是一支資產股，於是連續數年緊抱大量韓地哈曼公司的股票，可是這支股票卻很少波動，而且公司盈餘起伏不定，多角化經營也不成功（諸位都已經知道多角化經營是在搞啥了吧）。


    最近有消息指出，巴菲特對這家公司已經不再感到興趣，而到目前為止來看，這筆投資算是他唯一一筆較差的投資，儘管這支股票的隱藏資產還是深具潛力。但如果黃金和白銀的價格大幅上揚的話，其股價也會跟著上漲。


    除了黃金和白銀之外，還有許多其他類型的隱藏資產，例如可口可樂或諾比舒咬的品牌就很有價值，但這些並不會出現在帳面上。另'
  merge: -1
  img_proc: true
- pgno: 281
  md: '外，專利藥品、有線電視頻道、電視台和廣播電台等，都會有一個原始價格，然後在資產負債表上慢慢提列折舊，直到這筆價值消失為止。


    我之前提過的圖石灘就是一支擁有房地產的偉大隱藏資產股，我錯過了這支股票，到現在還想去撞牆。不過這種擁有房地產的資產股到處都有，例如鐵路公司就是最好的例子。包括柏林頓北方鐵路公司、聯合太平洋和聖塔菲南太平洋鐵路公司等，都有大筆的房地產資產，而且帳面價值都非常低。


    聖塔菲南太平洋公司是加州最大的私人地主，在加州一億英畝的私人土地中，聖塔菲公司擁有130萬英畝。而且它在全美國十四個州當中擁有300萬英畝土地，大約是羅德島（Rhode
    Island）總面積的四倍。另一個例子是CSX公司，這是美國東南部的一家鐵路公司，在1988年賣出一條80哩長的鐵路路權給佛羅里達州政府，這筆土地的帳面價值幾乎等於零，鐵軌則價值1,100萬美元。在這筆交易中，CSX公司還保留了離峰時間的使用權，所以營收並未受到影響（在離峰時間進行貨運生意）。這筆交易稅後淨利是2億6,400萬美元，這真正是連吃帶拿！


    有時候你會找到那種在地底下擁有可供開採四十年石油蘊藏量的石油公司或煉油公司，而其帳面價值竟然還是在老羅斯福總統（Teddy Roosevelt）時代的原始取得價格，光是這個石油蘊藏的價值，就高過公司全部股票的價值了。它們就算是把煉油廠給拆了，並讓所有員工全部滾蛋，光是賣石油就能讓股東在四十五秒內致富。而且賣石油再容易不過了，它不像賣衣服，根本沒有人會嫌你的石油是今年的還是去年的，也沒有人嫌它的顏色如何。'
