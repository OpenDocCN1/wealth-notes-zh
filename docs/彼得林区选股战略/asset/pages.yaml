- pgno: 284
  md: '價值10億美元、赫茲租車公司（後來部分股權賣給福特汽車）價值13億美元、威斯汀飯店（Westin Hotel）價值14億美元，另外旅遊訂位系統又值10億美元以上，這些資產在扣除負債和稅金之後，平均每股淨值就超過UAL集團的股票價格，因此誰買了這支股票，等於是免費取得全世界最大的航空公司。富達便買了大批的UAL集團股票，並且賺了一倍。


    企業持有其他公司的股票，也可能是一項隱藏資產，例如雷蒙工業公司（Raymond Industries）持有特勒可油田服務公司（Teleco Oilfield
    Services）的股票。熟悉這兩家公司的投資人都知道，在雷蒙每股12美元的股票裡，還包含了市價18美元的特勒可股票。因此你買了雷蒙的股票，不僅得到了特勒可公司，還額外奉送6美元給你。所以囉，用心研究做了功課的投資人就會知道要買進雷蒙的股票，還可以得到特勒可公司以及額外的6美元；而不做功課的投資人則會花18美元去買特勒可的股票，而且，類似的奇妙現象還經常發生呢。


    如果你在過去幾年對杜邦公司感興趣，就去買價格較低的西格蘭公司（Seagram），它握有杜邦四分之一的股權，因此西格蘭這支資產股擁有的資產就是杜邦。同樣的，畢爾德石油公司（Beard
    Oil，現在名為畢爾德公司〔Beard Company〕）每股8美元，其中包含價值12美元的USPCI公司，因此如果你買進畢爾德石油的股票，畢爾德公司及其煉油設備不但免費奉送，還額外再加送4美元給你！


    有時候投資一家公司的最好方式，就是投資這家公司的海外事業主。我知道這是說得容易、做來難，但如果你曾經試著接觸歐洲企'
  merge: -1
