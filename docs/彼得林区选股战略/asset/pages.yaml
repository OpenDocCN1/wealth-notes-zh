  md: '# 7 我買到了！我買到了！買到了什麼？


    不管你是從哪個管道注意到某支股票，不論是在辦公室、購物中心，還是你吃的、用的、買的東西，或是營業員、丈母娘，甚至是波斯基（Ivan Boesky）的假釋官報給你的明牌也一樣，這些都還不能成為買進的訊號。當你看到唐金甜甜圈專賣店裡一直都客滿，或者雷諾金屬公司（Reynolds
    Metals）的鋁原料供不應求時，也不代表你應該馬上買進它們的股票。還早著呢！現在你所擁有的，只是未來發展題材的初期線索而已。


    事實上，對於這些引起你注意、想要買進某家公司股票的初步訊息，你都應該把它們當成匿名信件來處理，這樣你才不會只因為看到某些你喜歡的東西，就買了某支股票；或者更糟糕的是，你因為太相信報明牌的人就買了某支股票，就像是：「哈利叔叔也買了，他這麼有錢，總有他的道理吧！」或者「哈利叔叔買了，我當然要跟進。上次跟著他做，賺了一倍哩！」


    要追蹤、辨識這些情報並不難，只要花幾個小時就夠了。在接下來的幾章裡，我會告訴各位我的做法，以及你們可以從哪裡取得有用的資訊。'
  merge: -1
