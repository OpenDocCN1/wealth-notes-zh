  md: '我恐怕不能告訴你，當晚在杜爾餐廳我到底吃了哪些海鮮。當你的共同基金虧掉的錢，相當於一個海洋小國的全年國民生產毛額時，你根本搞不清楚鱈魚跟蝦子有什麼不同。


    由於上述種種原因，讓我急欲趕回辦公室，因此我們在20日返家。或許打從我們抵達愛爾蘭之後，我就一直想要趕回公司。老實說，這次大跌把我煩透了。


    # 10月的教訓


    我一直認為，投資人應該忽視股票市場的起起落落。很幸運地，多數投資人也不太注意上面所提到的困擾，這點從麥哲倫基金的贖回賣壓就可一窺究竟。在那個令人絕望的一週裡，麥哲倫基金100萬名投資人中，提出贖回要求，並且把資金轉到貨幣市場基金的比例還不到3%。如果你在絕望中殺出持股的話，一定會賣到低價。


    儘管10月19日的行情變化讓你感到緊張，但你也不必急著在當天、或是隔天就賣出股票。你不要跟別人一樣驚慌殺出，應該要採取逐步減少持股的方式，因為股市從12月就開始穩健回升了。到了1988年6月，市場已經反彈了大約400點，反彈幅度超過23%。


    我們應該從這次的10月暴跌中學到許多教訓，這裡我再提醒大家三個重點：①別讓一些無聊事擾亂了最佳的投資組合；②別為了一些無聊事，破壞你度假的興致；③現金不夠的話，千萬別出國旅行！


    其實就這次的暴跌行情，我還可以囉囉� pha 寫上幾個章節，不過我'
