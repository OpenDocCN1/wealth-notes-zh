  img_proc: true
- pgno: 58
  md: '對於一位已經發現高爾夫球樂趣的十一歲男童而言，桿弟是個理想工作。我可以在高爾夫球場到處迿，而且還有錢可拿，光是一個下午所賺的錢，就等於送報生苦幹實幹一個星期、在清晨六點把報紙送到訂戶草坪上的收入，還有什麼比這更好的呢？


    到了高中，我開始了解擔任桿弟所具有的微妙且重要的優勢，尤其是在一個像位於波士頓郊外的布雷伯恩（Brae Burn）之類的高級俱樂部。我的客戶都是大公司的總裁和執行長，例如吉列（Gillette）、拍立得（Polaroid），還有更重要的——富達基金公司。在幫喬治。蘇利文（D.
    George Sullivan）找球的時候，我也幫自己找到了事業。許多當桿弟的人都知道，通往權力中心的捷徑，就是在布雷伯恩之類的運動俱樂部更衣室裡。


    如果你想要學股票的話，高爾夫球場是僅次於交易所大廳的第二個最佳地點。尤其是那些大老闆在打個右曲球或左曲球之後，往往會開始七嘴八舌地大談最近的投資戰績，因此打了一趟球下來，我可能給了五個揮桿建議，卻也得到了五個股市情報。


    雖然我沒有資金可以運用那些股市情報，但是從球道上聽來的幸運故事，卻讓我重新思考家人們認為玩股票會賠錢的想法。我有很多客人真的是在股票市場上賺到錢，我也的確看到了一些實例。


    當桿弟的都很快便學會如何分辨客人，第一種人是近乎天神般偉大，球打得好、待人好、小費也好，不過這種人很少；第二種人是球技平平、待人平平、小費也平平；而最糟糕的是遇上第三種人，球打得爛、脾氣又壞、小費更摳，對這種客人所有桿弟都避之唯恐'
  merge: -1
  img_proc: true
- pgno: 59
  md: '不及。我碰上的大概都是一般的客人，球打得普普通通、小費也給得普普通通。不過如果是要在球打得糟、但小費給得大方，跟球打得好、但小費給得少這兩種人之間做選擇的話，我當然知道要挑選前者。桿弟的工作讓我更強化了「有錢好辦事」的想法。


    念高中時我一直在當桿弟，直到進入波士頓學院（Boston College）時，還是靠法蘭西斯・烏伊梅桿弟獎學金（Francis Ouimet Caddy Scholarship）來支付學費。在大學時期，除非是必修課，否則我都不選科學、數學以及會計學等課程，而這些剛好都是與商業有關的基礎學科。我喜歡的是藝術方面的課程，以及歷史、心理學及政治科學等，其他還修過形上學、知識論、邏輯學、宗教學以及古希臘哲學等課程。


    現在回過頭來看，學習歷史和哲學，會比統計學更適合作為投入股市的準備。投資股票是一門藝術，而不是科學，那些被訓練成嚴格量化思考的人，其實非常不利。如果選股作業可以量化，那你只要花時間坐在電腦前，就能賺大錢了！可惜情況並非如此，在股票市場中所需要的數學，各位早在小學四年級就學會了（例如，克萊斯勒汽車公司有10億美元現金，5億美元長期負債等等）。


    在選股上，邏輯學帶給我的幫助最大，它讓我了解到華爾街獨特的非邏輯觀點。事實上，華爾街的想法跟古希臘人差不多，古希臘人會坐上幾天辯論馬有幾顆牙齒，他們認為只要坐著想就能得到答案，並不需要實際找匹馬來仔細算算看；華爾街也差不多，很多投資人只是坐著討論哪支股票會不會上漲，好像財神爺會給他們答案似的，卻不願意實地去調查那家公司。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '好幾個世紀以前，人們聽到日出時的雞叫，誤以為是雞叫把太陽召喚出來，現在看來當然很傻。但是當今的華爾街專家在解釋股市上漲的理由時，同樣也把因果關係搞混了：什麼女人的裙子變短了、哪支球隊贏了超級盃、日本人不高興、趨勢線被突破了、共和黨會勝選、股票「超賣」了等等。當我聽到這些原因時，總會想起那隻公雞。


    我在1963年大二時買了第一支股票——飛虎航空，每股7美元。當時我靠著梭弟收入和獎學金繳學費，住在家裡以節省開銷，並且花了150美元把原先85美元的破車換掉。在錯失了那麼多股市情報後，我終於有錢可以開始投資。


    投資飛虎航空絕非突發奇想，雖然我是從一個錯誤的前提開始，但我可是堅持不懈地做了調查和研究，才挑選這支股票。我在某門課堂上讀到一篇文章，提及航空運輸業前景看好，而飛虎航空就是一家空運公司，這是我買飛虎航空的理由，但並非導致它上漲的原因。飛虎航空股價上漲是因為越戰爆發，飛虎航空載著軍隊和貨物進出太平洋地區，使得業務量大增所致。


    不到兩年，飛虎航空的股價就上漲到32.75美元，這是我打出的第一支五疊安打！後來我分批賣出，把錢拿來支付研究所的學費。我在念華頓（Wharton）商學院時，部分學費就是靠這支飛虎航空獎學金。


    如果第一支股票對你往後一生的投資生涯，就像初戀對一個人未來的感情生活一樣重要的話，我在飛虎航空的一戰成功可說是非常幸運。它讓我知道，會上漲好幾倍的股票的確存在，而且除了飛虎航'
  merge: -1
  img_proc: true
- pgno: 61
  md: '空之外還有許多呢。


    大四時，我接受了蘇利文先生的建議，在暑假申請到富達基金公司打工，蘇利文先生是富達的總裁，打起高爾夫球來運氣不太好，但是個好人，而且小費給得很慷慨。富達是投資界的佼佼者，在業界具有呼風喚雨的能力，那些有志於投資事業的年輕人，有誰會不想進富達公司？當年的暑期工讀只有三個機會，可是應徵者卻多達百人。


    那時富達在美國市場銷售共同基金的成績相當出色，連我媽每個

    月都投資100美元到富達資本（Fidelity Capital）基金，這支基金當時是由蔡至勇（Gerry Tsai）操盤。在那個追求快速獲利的時代（go-go
    era），富達資本是兩支最有名的速利基金（go-go fund）之一，另一支是富達趨勢（Fidelity Trend）基金，由愛德華．詹森三世（Edward
    C. Johnson III）管理，也就是一般暱稱的奈德．詹森（Ned Johnson），他是公司創辦人愛德華．詹森二世（Edward C. Johnson
    II）的兒子，一般習稱創辦人為詹森先生（Mister Johnson）。


    奈德的富達趨勢和蔡至勇的富達資本的投資績效，都遠遠超過競爭對手，並且在1958年到1965年成為業界一致歡羨的對象。由於有這些人的訓練和支持，我可以充分體會牛頓所說的：「我看得更遠，是因為站在巨人的肩膀上。」


    早在奈德大獲成功之前，他的父親詹森先生就已經改變了美國人對股票投資的觀念，詹森先生認為，投資股票並非為了保本，而是要賺錢。投資股票，賺錢，然後用獲利投資更多股票，再賺更多錢！'
  merge: -1
  img_proc: true
- pgno: 62
  md: '「你買的股票就是你的大小老婆！」詹森先生常常說這句話，我想，女權運動人士大概不會為他鼓掌吧。


    能在富達工讀，我簡直興奮極了！而且就在蔡至勇以前的辦公室裡，那時候他已經前往紐約主持曼哈頓基金（Manhattan Fund）。當然，1966年5月初我到富達工作時，道瓊指數還在925點，等到我9月回去研究所上課時，道瓊已經跌到800點以下。你看，林區定律嘛！


    # 隨機漫步理論與緬因糖業公司


    像我這種暑期工讀生，對公司財務或會計毫無經驗，通常都會被安排研究上市公司和撰寫報告的工作，就像正規的股票分析師一樣。這個令人豔之生畏的大門突然就這麼打開了，雖然是一位文科學生，照樣也能分析股票。我被分配到紙業及印刷產業，要前往全國各地拜訪諸如索吉紙業（Sorg
    Paper）、國際教科書公司（International Textbook）等上市公司。由於航空業當時正在罷工，於是我搭乘巴士四處跑，到了夏末，我搞得最熟的大概就是灰狗巴士公司（Greyhound）了。


    在富達工讀之後，我又回到華頓商學院繼續完成第二年的研究所課程，但是我越來越懷疑課堂上所教授的股市理論有什麼價值。在華頓學習的東西，應該是要幫助你成功吧，可是我覺得大部分投資課堂上所學的卻只會讓你失敗而已。我修讀統計學、高等微積分和計量分析，但是根據計量分析方法，有些不會真正發生的情況，我卻在富達基金公司親眼目睹過！'
  merge: -1
  img_proc: true
- pgno: 63
  md: '我也發現很難把「效率市場假說」（efficient-market hypothesis，亦即股市中所有事情都是「已知」，股價永遠是「合理」的）和「隨機漫步理論」（random-walk
    hypothesis，亦即市場的漲跌是非理的，完全不可預測）相互整合起來。我已經看到夠多的市場怪異波動，讓人質疑股價是合理的說法，而且富達那些偉大基金經理人的成功，也並非完全不可預測。


    並且很明顯的，華頓商學院那些相信計量分析和隨機漫步理論的教授們，實際的表現根本也比不上我在富達的那些新同事，因此在理論與實務之間，我選擇壓寶在實務派身上。當你看到某個人因為投資肯德基公司賺了20倍的利潤，而且他事先也說明了股價會上漲的理由，此後你便很難再相信那套風靡學術界的市場是不理性的理論。直到現在，我仍然不信任理論派和預言家。


    不過華頓的某些課程對我還是有所幫助，即使那些課程毫無價值，這段求學經歷依然相當值得，因為我就是在華頓認識了卡洛琳（我是在陸軍服役時和她結婚，1968年5月11日星期六，當天股市沒開盤。後來我們去度了一個星期的蜜月，其間道瓊指數總共下跌了13.93點。當時我可沒注意到這點，這是後來查出來的）。


    在華頓念完第二年後，我向陸軍報到，服了兩年預備軍官役，從1967年到1969年，擔任砲兵少尉，先是在德州，然後派遣到韓國，這跟在越南相比可說是太幸運了，砲兵少尉在越南傷亡慘重。駐防韓國唯一的缺點就是離證券交易所太遠，就我所知，漢城當時還沒有交易所，那個時候我也因為被迫遠離華爾街而深感痛苦。


    我利用少有的休假，彌補服役兩年所損失的時間。我匆匆趕回家，'
  merge: -1
  img_proc: true
- pgno: 64
  md: '買進朋友和同事們推薦的各種熱門股。他們買的股票都是正在上漲的熱門股，但他們建議我逢低承接走勢穩健的股票，其中，遊騎兵石油公司（Ranger Oil）的確讓我賺到錢，但是原本以為穩賺不賠的緬因糖業（Maine
    Sugar）公司卻讓我虧了錢。


    緬因糖業公司派人說服緬因州內的馬鈴薯農民，在休耕期間種植甜菜，這將帶給緬因糖業公司很高的利潤，而且農民也有好處。甜菜跟馬鈴薯是農田輪種的理想搭檔，農民不但能有額外的收入，也可以趁這個機會讓土壤活化。而且，緬因糖業公司還出錢讓農民種甜菜，只要求在收成時，農民把甜菜送到公司新建的大型糖廠裡即可。


    問題是緬因州的農民都const小心，第一年他們只種了耕地的四分之一，到情況還不錯時，他們擴充到耕地的一半，等到他們要大張旗鼓全面輪種時，緬因糖業公司卻因為沒有生意而把糖廠關了，最後甚至連公司都宣告倒閉！結果股價跌到每股只剩6美分，只夠買六顆口香糖！


    在緬因糖業慘遭失敗後，我發誓，絕對不再買進任何跟緬因州農民有關的股票。


    1969年我從韓國退伍，隨即加入富達公司成為正式員工，擔任證券研究分析師，此時股市馬上下跌（林區定律再記上一筆）。1974年6月，我從研究部副主任榮升主任，之後三個月道瓊指數應聲下跌250點。1977年5月，我接掌富達麥哲倫基金，道瓊指數從當時的899點連走了五個月的空頭，跌到801點。'
