  md: '尼克知識樂園（Nickelodeon）的兒童節目，大女兒瑪麗非常喜愛 MTV頻道，我太太常看貝蒂·戴維絲（Bette Davis）的老電影，而我則愛看CNN新聞台和運動台，我大概就會了解有線電視簡直像水、電一樣，可說是影音公用事業。在分析公司和市場趨勢時，個人經驗的好處可是說不盡的。


    發掘資產股的機會到處都有，當然，擁有資產的公司也要會運用才行，弄清楚這一點後，你所需要的就是耐心了。


    # 從高速飛行到低速爬行


    公司不會永遠停留在同一種類型中，根據我這些年的觀察，我已經看過數百家公司從某種類型變成另一種類型。快速成長股先是猛力衝刺，然後精力耗盡，就跟我們人類一樣，沒有辦法一直維持兩位數的成長，遲早都會耗盡力氣，退回較自在的個位數緩慢成長或穩定成長。我在地毯業和塑膠業看過這種情況，計算機和電腦磁碟機產業也是，醫療保健和電腦業統統都有。道氏化學和坦帕電力公司（Tampa
    Electric）都曾經高速飛行了十年，但接下來另一個十年卻變成了土撥鼠。停車採購超市則從原先的緩慢成長股變成快速成長股，但是這種情況並不常見。


    先進微波設備公司（Advanced Micro Devices）和德州儀器公司（Texas Instruments）都曾經是快速成長股的表率，現在已經變成了景氣循環股。景氣循環股如果碰上財務問題，很容易會出狀況，再來就看它能不能東山再起，變成轉機股。克萊斯勒公司就是從傳統的景氣循環股摔下去，變成轉機股再爬起來，現在又回到了景氣循環股。LTV鋼鐵公司過去是景氣循環股，現在則成了轉機股。'
  merge: -1
  img_proc: true
- pgno: 165
  md: '無法保持榮景的成長型公司如果還要愚蠢地進行「多慘化」經營，而且不再受到投資人的垂青，最後只能變成轉機股了。快速成長股例如假日大飯店，一旦成長趨緩，股價便會馬上遭到擠壓，直到有些聰明的投資人真正了解，假日大飯店所擁有的房地產正是`-`
    一大筆資產。聯盟百貨公司（Federated and Allied Stores）雖然是零售業，但因為它蓋的百貨公司都位於黃金地段，而且擁有自己的購物中心，才讓聯盟百貨公司被眼明手快的業者收購。麥當勞也是典型的快速成長股，但因為該公司擁有幾千家分店，再加上正在收購加盟店，未來也<|start|>會是一支超級資產股。


    像賓州中央鐵路這種企業，可能會同時被列入兩個類型中，而像迪士尼公司則一直在每個主要類型中遊走：多年前它是活力十足的快速成長股，後來變成規模龐大且財力雄厚的穩定成長股，接下來一段時間它又成為資產股，擁有龐大的資產，例如房地產、老電影和卡通影片等等。之後到1980年代中期，迪士尼開始走霉運，你則可以用轉機股的價格買到迪士尼的股票。


    國際鎳金屬公司（International Nickel，1976年更名為英可公司〔Inco〕）剛開始是成長型公司，然後成為景氣循環股，最後成為轉機股。這家老牌子的道瓊指數成分股，是我剛進入富達當分析師時的`第一筆功績之一。1970年12月，我寫了一份英可公司的賣出建議書，當時它的股價是47.875美元。我覺得這家公司的基本面不太妙，理由是鎳的消耗量降低，但是各家廠商的產能卻在提高，而且該公司的勞力成本太貴。我說服富達公司，賣掉手上持有的大量英可股票，由於持股部位相當大，因此我們還稍微壓低價格才找到買家。'
