  md: '# 這是上市公司嗎？


    要取笑哈利錯失了有限服飾的股票，我還真是上上之選！因為在它股價直線上漲時，我一股也沒買，我太太跟他太太一樣，也看到店裡生意興隆。我也是等到大夥都知道這家公司，而且基本面開始變糟時，才匆忙搶進，後來明明是虧本，我還緊抱不放。


    真的，像這種錯失了十疊安打的情況，我還可以繼續寫上好幾頁。各位在這本書裡，也會看到更多令人覺得扼腕的例子。說到忽略大鱷股，我跟大夥一樣，都堪稱專家級。我曾站在20世紀最偉大的資產股——圓石灘（Pebble
    Beach）高爾夫球場——卻從沒想過要問一聲它是不是上市公司，我八成是忙著注意發球點跟果嶺之間的距離吧！


    幸運的是，在我們身邊還是有夠多的「十疊安打」，就算錯失了絕大部分，還是能夠上疊得分。像我管理的這種大型投資組合，就需要多發掘幾支這種上漲10倍的股票，才能讓整體績效有所表現；但如果是非常散戶的小型投資組合，只要逮到一次機會，就能一次見效。


    而且，投資你熟悉的公司，諸如蕾格絲或唐金甜甜圈，最棒的事情是當你穿絲襪或啜飲咖啡時，也等於是在做基本分析，人家花錢請華爾街股票分析師做的事情，也不過就是如此。拜訪營業處所和測試產品品質，正是證券分析的重要工作內容。


    你一輩子都在買車或照相機，因此你一定也會培養出某些能力，能'
