    # 愛爾蘭隨筆


    最近談起股票市場，就不能不稍微分析1987年10月16日到20日之間的狀況，那是我經歷過最不尋常的一週。如今事過境遷已一年多，我客觀而冷靜地回顧，才能從情緒性的紛亂中，分辨出哪些是持續性的重大影響。以下，是當時值得記述的一些事情：


    +   - 10月16日，星期五，我太太卡洛琳跟我愉快地在愛爾蘭科克郡（County Cork）開車兜風，我很少度假，所以光是我在度假這件事，就非常特別。\n-
    我連一家上市公司總部都沒去拜訪，通常我是寧可繞道一哩，也想要調查出最新的銷售額、存貨以及盈餘數字。不過就在現在，周圍方圓250哩內，大概找不到任何一份標準普爾通訊報告，或某家公司的資產負債表。\n-
    我們前往布拉尼城堡（Blarney Castle），著名的布拉尼神石很不方便地嵌在古堡頂端的矮牆上，距離地面好幾層樓高，你必須先彎下腰，再鑽過預防你摔落的鐵圍欄，抓緊一根欄杆穩定自己的情緒，然後才能親吻神石。親吻布拉尼神石果然像大家所說的那般令人興奮，尤其是能全身而退、安然無恙。\n-
    整個週末我們都悠閒地打高爾夫球，平息布拉尼神石所帶'
