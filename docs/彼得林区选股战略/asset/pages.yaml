  md: '他最近的明牌的確很準。


    +   - 某些股票明牌可能會相當有價值，特別是某個產業的專家所提供的明牌。然而，實際的情況卻是，紙業專家經常推薦製藥股，健康醫療產業的專家又成天嚷叨著某家造紙公司即將被收購的小道消息。\n-
    投資那些看起來乏味、平凡、不受喜愛，而且還未吸引華爾街注意的簡單公司。\n- 非成長型產業中的中度快速成長公司（20%到25%），將是最理想的投資目標。\n-
    尋找具備某項利基的公司。\n- 如果要買進艱困公司的股票，必須尋找財務狀況較佳的公司，並且避開擁有大量銀行負債的公司。\n- 沒有負債的公司不會破產。\n-
    管理能力可能很重要，但是很難評估。所以各位要把重點放在公司的未來前景，而不是放在總裁的資歷或他的花言巧語。\n- 艱困公司開始復甦時，可以讓你大賺一票。\n-
    小心考慮本益比，如果股價大約上已經被過度高估了，不管其他條件有多麼好，你還是無法賺到錢。\n- 在追蹤公司的題材時必須找出 общим 主要脈絡，並據此監視公司的實際進展。\n-
    尋找持續回購自家公司股票的公司。\n- 研究公司歷年來的股利紀錄，以及過去幾次景氣衰退期間的盈餘表現。\n- 尋找只有少數幾家法人機構或是沒有法人投資機構持有的公司股票。\n-
    如果其他條件都相同，管理階層本身也大量投資自己公司的股票，會比管理階層只靠領薪水得利的股票更佳。'
