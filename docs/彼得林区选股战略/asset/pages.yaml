- pgno: 117
  md: '場就是超漲了。巴菲特之所以把錢退還給投資人，就是因為他找不到值得投資的股票，他仔細調查過數百家公司，結果卻沒有發現任何一家公司的基本面值得投資。


    我唯一的買進訊號，就是找到一家我喜歡的公司。只要出現這種情況，買股票永遠不會嫌太早或太晚。


    第一篇的重點如下，希望各位能牢記在心：


    +   - 不必過分高估投資專家的技巧與智慧。

    - 善用你個人已經知道的事物。

    - 發掘那些華爾街還未發現和證實的機會，那些在華爾街「雷達網」之外的公司。

    - 在投資股票之前，先買房子吧。

    - 你要投資的是上市公司，而不是整個股票市場。

    - 不要理會短期波動。

    - 普通股可以讓你賺大錢。

    - 普通股可以讓你賠大錢。

    - 預測經濟景氣毫無用處。

    - 預測股票市場的短期方向毫無用處。

    - 相對於債券的長期報酬率，股票的長期報酬率不僅更能夠預測，而且表現更好。

    - 持續追蹤你持有股票的公司，就像玩一場永遠不會結束的挨哈賭局。

    - 普通股投資不見得適合每個人，甚至也不見得適合一生中的所有階段。

    - 一般人會比專家早好幾年就接觸到地方性的優秀公司和商'
