  md: '我談到微軟和思科的例子，正好點出本書的一個重要主題。業餘的散戶投資人只要留心辦公場所、購物中心、汽車展售場、餐館或其他任何地方，都可能會發現有些新公司正在大展身手，從而發掘出明天的股市大贏家。


    籃球選手巴克利（Charles Barkley）以口無遮攔著稱，有一次他說，他的話在自傳裡被誤引了。我當然不會說這本書誤引了我自己所說的話，不過有某個基本重點倒是被人誤解了，在此我要特別聲明：


    我，彼得．林區，並非建議你，因為你喜歡在哪家店消費，就去買那家公司的股票；也不是說，因為你喜歡哪家公司的產品或喜歡上哪家餐廳吃飯，就應該去買那家公司的股票。我的本意是，因為你喜歡哪家店、哪種產品或哪家餐廳，這是一個對它產生興趣，並進而去做調查研究的好理由，但這還沒有好到應該要馬上買進它的股票！在你對某家公司的獲利前景、財務狀況、市場競爭力及擴張計畫等還沒調查清楚、研究明白前，千萬不要貿然買進股票。


    如果你持有 一家零售業者的股票，另一個分析的重點是，試著去確認那家公司的擴張階段是否已經快結束了？比賽是否已經到了最後幾局？以消費類電子產品零售商無線小屋（Radio
    Shack）或玩具反斗城（Toys "R" Us）為例，其經銷店只出現在全美10%的城市，和已經進駐全美90%的城市相比，獲利前景自然大不相同。你必須追蹤其未來的成長將來自何處，同時預測成長擴張可能會在何時趨緩。'
  merge: -1
