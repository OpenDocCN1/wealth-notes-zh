  md: '# 5 現在是多頭市場嗎？拜託，別問啦！


    每次演講後的提問時間裡，總會有人問我，現在是多頭市場還是空頭市場？提出這種籠統問題的比例，大約是有一個人問到上市公司的基本面問題，例如固特異輪胎（Goodyear
    Tire）是否穩健、目前價位是否合理，就會有其他四個人想知道現在行情如何？多頭還活蹦亂跳嗎？空頭是不是已經探頭探腦、蠢蠢欲動了？有關預測大盤的趨勢，我只能就我所知的來回答，也就是每當我升職時，大盤就會下跌。而只要我這麼一回答，也總會有人站起來追問，我什麼時候會再升官？


    很明顯地，各位不必具備預測股市行情的能力，也可以在股票上賺到錢；否則我根本也不應該賺到錢啊！我曾經有好幾次是坐在股市報價系統前面，眼睜睜看著股市慘跌，如果我是靠預測股市來過活的話，顯然我也沒有辦法料「空」機先。在1987年夏季時，我自己完全不曉得股市即將下跌1,000點，也沒有向任何人提出警告。


    我並不是唯一一位無法在事先提出警告的人。事實上，如果無知者喜愛呼朋引伴，那麼當時我也被一大群毫無警覺的觀察家、預言者，以及其其他的股市專家給團團包圍。有位睿智的預測者曾經說：「如果你一定得預測的話，那就多預測幾次吧。」'
