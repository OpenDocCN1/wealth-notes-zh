  md: '第二篇：挑選贏家（第6章至第15章），討論如何尋找最具潛力的投資機會；在觀察一家公司時，要注意哪些事情、避開哪些事情；要如何利用營業員、年度財務報告及其他資源，藉以獲致最佳的成果；以及在做股票的技術性評估時，必要的各項數值該如何計算（例如本益比、帳面價值及現金流量等）。


    第三篇：長期觀點（第16章至第20章），討論如何規畫投資組合；如何密切監看標的公司；何時應該買進、何時應該賣出；有關股票選擇權和期貨的陷阱；以及有關華爾街、美國企業界和股票市場是否健全的整體觀察，這些都是我在過去二十餘年的投資生涯中持續關注的事情。'
