  img_proc: true
- pgno: 48
  md: '分辨出產品的好壞，知道哪些產品能賣、哪些不能賣。如果你不懂車子，也一定懂某些其他東西吧，而且最重要的是，你一定會比華爾街更早知道，這才是重點。所以，當你看到鄰近區域陸續開了八家連鎖店之後，何必等到美林證券的餐飲業專家來肯定和推薦唐金甜甜圈呢？在唐金股價從每股2美元上漲五倍到10美元之前，美林證券根本不會注意到它（理由容後詳述），而你可以在每股2美元時就注意到這家公司。


    # 獵殺超高速微處理器


    不知道是基於什麼原因，很多業餘散戶就是無法把嚴肅的股票研究活動，跟開車在城裡四處吃甜甜圈畫上等號。大家似乎都得投資一些自己毫不知道的東西，如此才會感到安心。華爾街好像有個不成的文的法則：如果有樣東西你不了解，那就把一生的積蓄全部押進去！刻意避開你可以親眼看到的鄰近公司，反而跑去投資那些根本不曉得是在搞什麼把戲的工廠，這是什麼道理呢？


    我前幾天才剛剛碰到一個這樣的投資機會。不曉得誰在我桌上留下一份報告，說現在正是投資某家公司的絕佳時機，它生產的是「百萬位元靜態隨機存取記憶體（one megabit
    S-Ram）、互補金屬氧化半導體（complementary metal oxide semiconductor, C-mos）；雙極精簡指令集電腦（bipolar
    reduced instructive set computer, bipolar risc）、浮點（floating point）、資料輸出入陣列處理器（data
    I/O array processor）、最佳化編譯器（optimizing compiler）、十六位元雙埠記憶體（16-bytes dual port
    memory）、Unix作業系統、百萬浮點運算複晶矽射極（whetstone megaflop polysilicon emitter）'
  merge: -1
  img_proc: true
- pgno: 49
  md: '高頻寬（high band width）、六十億赫茲（six gigahertz）、雙重金屬化通訊協定（double metalization communication
    protocol）、非同步反向相容（asynchronous backward compatibility）、周邊匯流排架構（peripheral bus
    architecture）、四向交錯記憶體（four-way interleaved memory），以及十五毫微秒運算能力（15 nanoseconds
    capability）」等產品。


    十億赫茲！百萬浮點運算！如果你連這些記憶體專有名詞都搞不清楚，還以為是哪匹賽馬的名字，那還是省省吧，別碰這種股票。就算你的證券商營業員對你疲勞轟炸，說這是十年難得一見的機會，也別理他！


    # 花椰菜小可憐


    那麼，這是否表示每一家新的速食連鎖店、生產暢銷商品的公司，或者在鄰近購物中心開店的公司，我都會叫各位去買它的股票嗎？股票如果這麼好做，我就不會因為比德諾（Bildner''s）的股票而賠錢了，這是一家專做雅痞人士生意的連鎖超商，我的辦公室對面就有一家。早知道就只去買三明治，而不去買它的股票，現在可好囉，50股比德諾的股票，還抵不上一


    還有，寇勒可（Coleco）公司呢？儘管它生產的椰菜娃娃是二十世紀最暢銷的玩具，但還是難以挽救這家資產負債表一塌糊塗的公司。寇勒可公司的股價在一年左右的時間裡也是高潮迭起，先是家用電視遊樂器攻城略地，接著是椰菜娃娃睌腕群雄，1983年股價一'
  merge: -1
