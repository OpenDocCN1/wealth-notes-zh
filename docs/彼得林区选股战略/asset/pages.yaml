  md: "來的興奮感。週六在瓦特村（Waterville）打球、週日在杜克斯（Dooks），而且開車沿著漂亮的科麗環海岸（Ring of Kerry）遊覽。\n\
    \n+   - 10月19日，星期一，我面對了終極的挑戰，竭盡我所有的智慧與耐心，才能克服全世界最難打的高爾夫球場之一——基勒尼郡（Killarney）基尼（Killeen）球場上的十八洞。\
    \  \n- 收拾好球桿，我開車載著卡洛琳離開幽谷（Dingle）半島，前往海濱度假區，住進歇麗格旅館（Sceilig Hotel）。我一定是累了，所以整個下午都沒有離開旅館。\
    \  \n- 當晚，我們跟朋友伊麗莎白及彼德·科納利夫婦（Elizabeth and Peter Callery），在一家叫杜爾（Doyle's）的著名海鮮餐廳吃飯。隔天，20日，我們飛回美國。\n\
    \n# 小小的煩意亂\n\n當然，有些小小的KE不快，我並沒有提到。如今回想起來，這些事情幾乎不足掛齒。經過一年後，你應該只記得西斯汀大教堂（Sistine\
    \ Chapel），而不是走遍梵蒂岡後腳上起的水泡吧。不過基於徹底揭露訊息的精神，我還是告訴各位，到底是什麼在困擾我：\n\n+   - 週四下班後，我們飛往愛爾蘭，當天道瓊指數收盤下跌48點；週五我們抵達愛爾蘭，當天道瓊指數重挫108.36點，我開始懷疑該不該度假。\
