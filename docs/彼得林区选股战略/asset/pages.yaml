  md: '股比例不會超過該公司發行股數的10%。如此一來，很多機會就被擋掉了，例如一些成長快速的小型公司，這種股票常常出現十疊安打。但是在前述的限制下，你根本不可能去買唐金甜甜圈或七橡國際的股票。


    有些基金會針對上市公司的市值做更多的限制，例如不准投資市值1億美元以下的上市場公司（市值就是流通在外股數乘以每股市價）。如果某家公司的流通在外股數是兩千萬股，市價為每股1.75美元，則市值為3,500萬美元，那麼這支股票就不在上述基金的投資範圍。而如果該公司的股價漲三倍，每股為5.25美元，市值增加為1億500萬美元，此時這支股票才會進入選股範圍。於是這形成了一個奇怪的現象：大型基金只有在小型公司的股價漲到高檔時，才能買進它們的股票。


    所以，很明顯的，退休基金幾乎都只能跟成長率只有10%的大象股打交道，然而，這些《財星》500大公司又能帶給我們多少驚喜呢？他們幾乎只能買像IBM、全錄或克萊斯勒的股票，但就算是克萊斯勒，也要等到它渡過難關，股價從谷底翻升上來後，才會進入他們的選股範圍。極受業界稱譽且績效甚佳的SSC資產管理公司（Scudder,
    Stevens, and Clark），在克萊斯勒股價跌到谷底（每股3.5美元）之前，就停止追蹤這支股票，直到股價翻回30美元後，才又重新注意這家公司。


    這就難怪許多退休基金的操作績效會比不上大盤指數了，如果是委託銀行代為操作，大都也只能得到普通的成果而已。


    至於像我掌管的這類股票共同基金，限制則比較少。我不必從固定'
