  md: '總算在證券公司推薦名單上看到了有限服飾公司的名字，而且，另外還有三種知名投資刊物提到這支股票。此時，有限服飾已經成為大型法人機構的最愛，總共有三十名分析師在追蹤這支股票。哈利想，這次應該很穩了吧！


    於是有一天他跟太太說：「真有趣！還記得你喜歡的那家服飾店嗎，叫做有限服飾的那家？結果它是家上市公司呢。所以我們可以買進這支股票，很棒，有賺頭！我在公共電視網（PBS）看到特別報導，《富比世》（Forbes）也做了封面報導。專家（聰明錢）正在搶進呢！我們的退休基金也應該拿出幾千美元來投資。」


