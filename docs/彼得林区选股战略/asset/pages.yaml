  md: '盈餘趨勢線。那些大家耳熟能詳的成長股，例如松尼連鎖餐飲、有限服飾或萬豪集團，如果你是在股價遠低於盈餘趨勢線時買進，然後等到它強勁上揚，遠遠超過盈餘趨勢線時賣出，應該就能大賺一筆，雅芳就是一個好例子。雖然我不特別鼓勵這種做法，不過市場上反正還有很多更糟的操作策略。）


    # 著名的本益比


    如果要認真討論盈餘，必定會提及本益比（price/earnings ratio, p/e ratio），即俗稱的股價盈餘倍數（price-earnings
    multiple），或簡稱為倍數（multiple）。本益比是以簡單的數量化方式，來表現公司股價和盈餘之間的關係。幾乎所有的報紙財經版或投資版上，每天都會刊登各類股票的本益比資訊（見表10-1）。


    就像盈餘趨勢線一樣，本益比通常也是用來判斷股價相對企業的獲利能力是過高、合理還是偏低的一項好工具。


    （有時候報上所刊登的本益比數字會高得離譜，這種情況通常是企業在短期盈餘中提列了某些長期損失，因而導致盈餘數字被「扭曲」。如果發現本益比數字有點奇怪，可以要求你的營業員加以說明。）


