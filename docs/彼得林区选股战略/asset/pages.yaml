- pgno: 151
  md: '三十年來從來沒有任何一季業績下滑。家樂氏可以渡過景氣衰退的難關，大家不必太過驚訝，不管狀況再怎麼糟，早餐的玉米脆片還是要吃。各位也許會減少旅行次數、延後購買新車、少買衣服和昂貴的飾品、少去餐廳吃龍蝦大餐，但是早上吃的玉米脆片還是一樣多啊。或許還因為少吃龍蝦，所以玉米脆片反而吃得更多呢！


    在經濟衰退的時候，人們也不會少買一點狗食，所以保力來也算是相當安全的企業。事實上，在我寫這本書的時候，我的同事正熱中於家樂氏食品和保力來的股票，因為他們害怕衰退或許又要來臨。


    # 快速成長股


    這種類型的上市公司是我的最愛：小型、積極的新企業，每年成長20%到25%。只要你精挑細選，這裡面正是10疊安打到40疊安打的密集區，甚至還有200疊安打呢！如果是規模不大的投資組合，只要納入一、兩支這種類型的股票，績效就會相當可觀。


    快速成長的公司不必然就屬於快速成長的產業，事實上，我倒寧願如此，理由會在第8章說明。在緩慢成長的產業中，只要找到擴張空間，有辦法的業者照樣能夠快速成長。例如啤酒屬於緩慢成長產業，但是生產百威啤酒的安豪塞—布什公司（Anheuser-Busch）還是一支快速成長股，從競爭品牌吸引酒客轉向它們的產品，大幅擴張市占率。旅館業的年成長率大約只有2%，不過在過去十年中，萬豪飯店攻城略地搶占了大片市場，每年成長20%。


    速食業的塔可貝爾公司、百貨零售業的沃爾瑪百貨，以及零售服飾業的Gap服飾，都是緩慢成長產業中的快速成長股。這些新的企業'
  merge: -1
  img_proc: true
- pgno: 152
  md: '贏家先在一個地方取得成功，然後不斷複製這個成功經驗，從一家購物中心到另一家購物中心，再從一個城市轉戰到另一個城市。隨著不斷搶進新市場，使得企業盈餘暴增，進而刺激股價大幅上揚。


    快速成長股也會有極大的風險，特別是這些較年輕的公司往往是野心太大，而資金又太少。一旦這些資金短缺的新公司碰上了麻煩，通常是以申請破產重整告終。此外，華爾街對那些喪失活力、成長銳減的快速成長股更是不留情面，一旦出現這種情況，股價馬上會被無情地擠壓。


    我在前面曾經提過，電力事業公司就是從快速成長股變成緩慢成長股的例子，尤其 是那些位於美國南部陽光帶的電力公司。在1960年代，塑膠業也是快速成長產業，當年達斯汀．霍夫曼（Dustin
    Hoffman）在電影《畢業生》（The Graduate）中，說出「塑膠」（plastics）這個字之後，就在許多人心 中留下深刻的印象。道氏化學公司加緊投入塑料生產，創造出驚人的成長，也成為那幾年備受青睞的快速成長股。但是在成長趨緩之後，道氏又變回平凡的化工公司，腳步沉重地跟著景氣循環上下浮沉。


    煉鋁業直到1960年代還是快速成長產業，當時的地毯工業表現亦佳，但等到這些產業都趨於成熟後，這些公司的成長速度也都退回到跟GNP差不多，當時的股票市場看了直想叫人打瞌睡。


    因此，規模較小的快速成長股其風險是破產倒閉，而規模較大的快速成長股其風險則是成長一旦趨緩，股價便會馬上大跌。一旦快速成長股的規模擴張得太大，最後就會面臨小人國遊記裡格列佛的困境，找不到伸展空間了。'
  merge: -1
