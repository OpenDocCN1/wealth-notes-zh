  md: '（General Electric），這兩家公司都提供了很有用的經驗和教訓。我在書裡提到，老牌績優藍籌股伯利恆鋼鐵的股票從1960年就節節敗退，一家聲譽卓著的老牌公司，似乎也可能跟搖搖欲墜的菜鳥公司一樣，會讓投資人血本無歸。即使是美國全球影響力表徵之一的伯利恆鋼鐵公司，仍然讓許多投資人大失所望，其股價從1958年的每股60美元，一路盤跌至1989年的17美元，讓忠心耿耿的股東們飽受折磨，也讓那些想要搶反彈的投機客深受教訓。而自1989年起，伯利恆鋼鐵的股價又展開了另一波跌勢，摔到個位數！這證明了低價股隨時可能出現更低價。總有一天，伯利恆鋼鐵的股價將會回升，不過這個假設只是希望，並不能靠此來投資賺錢。


    我曾在全美聯播的某個電視節目中，推薦過奇異的股票（之後它漲了10倍），但是我在本書中提到，以奇異目前的規模條件（總市值390億美元，每年獲利30億美元），將很難維持獲利的快速成長。但事實上，這家讓生活更美好的公司，帶給股東的成長比我先前的預期更大。雖然面對許多問題，但是在傑克．威爾許（Jack
    Welch）的精明領導下，這頭大象股也能用小跑步來賺錢。最近宣布即將退休的威爾許讓奇異的許多部門都邁向獲利的頂峰，並且利用剩餘資金買進新的事業單位和回購股票。奇異在1990年代的成功，顯示持續追蹤公司現況是非常重要的。


    ____________________ $ ____________________


    談到公司回購自家股票的話題，就得提及整體股市的一項重大改變：配發股利已快成為瀕臨絕種的動物了。我在第十三章談到配發股利的重要性，現在這種獎勵股東的情況卻像黑腳貂一樣，快絕種了。公司不配發股利有兩個缺點：一是股東無法定期收到錢，並且'
  merge: -1
  img_proc: true
- pgno: 18
  md: '在股價下跌時，也更加沒有理由繼續抱著貶值的股票。以標準普爾五百家大型公司而言，1999年的平均股利殖利率（dividend yield）已降到二次大戰以來的歷史新低：接近1%。


    如今，利率又比1989年時來得低，因此可以預期債券殖利率及股票的股利殖利率也會更低。當股價上漲時，股利殖利率自然會下降（同樣以5美元股利來說，當股價為50美元時，殖利率為10%；當股價為100美元時，殖利率則只剩5%）；同時，企業界也不再像過去那般，會想辦法來提升股利水準。


    《紐約時報》（The New York Times，1999年10月7日）也注意到這個現象：「目前經濟狀況甚佳，企業界更見成長，但它們卻不願意配發股利，這是很不尋常的。」不久之前，發展成熟且體質強健的公司都會定期配發股利，這代表公司生意興隆；而股利縮水、甚至發不出來，那就代表公司有麻煩了。可是在最近，體質強健的公司卻吝於配發股利，並且將那些資金用於回購自家股票，奇異就是這樣。減少股票的供給可以增加每股盈餘，此舉最終還是對股東有利，但這得等到他們賣了股票之後才能實現。


    公司之所以不配發股利，如果不是因為任何人的決定所致，那麼便可說是因為美國政府的做法所導致的結果。政府先對公司的獲利課稅，又對其股利課稅，即對所謂的未實現利益課稅。為了協助股東避免被雙重課稅，公司才會採取回購股票、拉升股價的方式，來取代過去的股利配發。雖然股東在賣出股票時還是要繳交資本利得稅（capital
    gains taxes），但是長期資本利得稅的稅率畢竟只有一般所得稅的一半。'
