  md: '萬美元，可以賺到13萬7,000美元。


    時間再拉回到1982年，當你第一次花2,000美元，幫剛上大學的孩子買一台蘋果電腦時，如果也同時花2,000美元買下蘋果電腦的股票，1987年時就會增值為1萬1,950美元，足夠小孩念一整年大學的花費了。


    # 常識的力量


    要獲取這些驚人報酬，進出時點當然要抓得很準。不過，儘管你可能錯失最高價和最低價，但還是可以靠投資這些知名公司來獲取相當不錯的利潤，而且比投資那些連我們也搞不清楚的怪異公司的股票要好。


    新英格蘭地區有個消防隊員的故事流傳甚廣。1950年代時，某個消防隊員注意到生產婦女衛生用品的Tambrands工廠（生產Tampax衛生棉條），正以驚人的速度擴張。他想，一定是這家公司的生意很好，否則不會發展得這麼快速，於是他和他的家族投資了2,000美元買進這家公司的股票，而且連續五年，每年再投資2,000美元。到了1972年，這位消防隊員成了百萬富翁，而且他甚至不必買迷霸陸汽車。


    該名幸運的投資人當時是否曾向證券商或某些專家討教，這我就不曉得了。不過如果有的話，專家們大概會說他的理念偏差，如果想要買好股票，就應該投資法人機構正在買進的績優股，或是當時大受歡迎的電子類股。幸好！這位消防隊員當時能夠堅守己見。'
