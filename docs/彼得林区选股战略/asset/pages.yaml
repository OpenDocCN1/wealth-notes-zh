- pgno: 104
  md: '萬一在股市裡踩到香蕉皮狠狠摔了一大跤，你兒子只好去念夜校囉！


    或許你是靠固定收入過活的老人家，或者是不能忍受工作之苦、只想靠遺產的固定孳息來生活的年輕人，若是這些情況，最好都遠離股票市場。有許多複雜的公式可以用來計算個人可以投資股市的資產比重，不過我只有一個簡單的法則，而且不管是華爾街或賭馬都適用：只投資你輸得起的金額，而且這筆損失的金額，在可預見的未來並不會影響到你的日常生活。


    # 我的個性是否能讓我在股票投資上獲致成功？


    這是最重要的問題。我認為能夠在股市獲致成功的特質包括：耐心、自信、豐富的常識、能夠忍受痛苦、心胸開闊能接納新事物、能超然判斷不受一時好惡所影響、堅持、謙虛、靈活且富彈性、樂於獨力研究調查、同樣樂於承認錯誤，以及在一片騷亂之中平靜以對的能力。如果是智力測驗的話，能夠在股市獲致成功的人大概是落在智商最低的10％之上、最高的3％之下的區間內吧。對我來說，那些真正的天才通常會過度陶醉於理論的思考，結果永遠會被股市的實際行為引入歧途，其實股票的漲跌比他們所設想的要簡單許多。


    能夠在資訊不完整的時候做決定，也是一項重要的能力。華爾街的狀態常常是混沌不明，一旦態勢明朗，通常就來不及進場爭取好價位了。科學心智過強的人通常會要求事事清晰無誤，在此必然會遭受挫折。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '最後，懂得抗拒你的本性和直覺也相當重要。幾乎所有投資人都自以為對股價、金價或利率擁有某種不可言喻的直覺，儘管事實證明，這些直覺常常是一錯再錯，但我們還是一直這麼相信。大夥經常認為股票就要上漲，或經濟正要加速擴張，而事實發展卻正好相反，這種情況的確不可思議，但實情就是如此。只要看看那些銷路很好的投資通訊刊物就一清二楚了，它們總是在錯誤的時機看多或看空。


    投資人情報機構（Investor''s Intelligence）藉由追蹤市場上的投資通訊刊物，來掌握投資人的情緒變化，根據其刊登的資訊，在1972年底、股市大跌前夕，市場樂觀情緒達到頂峰，只有15%的投資顧問看空後市。等到1974年初、股市快要觸底反彈時，投資人情緒卻跌到空前的低點，而且還有65%的投資顧問認為股市仍會繼續下跌。1977年股市即將轉为空頭之際，情況也是一樣，那些投資通訊刊物又一致看好，只有10%看空。等到1982年觸底回升，即將走向大多頭市場之際，也仍有55%的投資顧問不看好。而在1987年10月19日即將發生大崩盤前夕，看好前景的投資顧問更高達80%呢！


    問題不在於投資人或他們的投資顧問一直很笨，或是對行情毫無知覺，而是在投資人接收到某些訊號之前，這些訊息早已改變了。儘管經過層層的篩選，仍有足量的金融面好消息透露出來，讓投資人依然對短期經濟前景抱持信心，殊不知此時已是山雨欲來。


    還有什麼原因可以解釋投資大眾為何經常看錯行情嗎？包括那些企業執行長和精明的生意人在內，常常會在股市明顯表現良好時看空後市（例如1930年代中期到1960年代末期），並且在股市表現最糟時反倒過分樂觀（例如1970年代初期以及1987年秋季）。巴托拉的'
