  img_proc: true
- pgno: 176
  md: '人類一樣，這七家小貝爾公司形成一種良性的競爭關係，其與母公司之間的關係也是如此。反觀其母公司AT&T則是流年不利，不但失去獲利極佳的設備租賃業務，同時還要面臨新對手史普林特（Sprint）及MCI公司的挑戰，同時在電腦業務上也持續出現鉅額損失。


    持有AT&T公司舊股票的投資人有十八個月可以考慮他們要怎麼處理這些舊股票，他們可以把AT&T賣掉，就此一了百了；也可以保留AT&T的股票，再加上按比例分配的小貝爾股票；或是賣掉AT&T的股票，只保留小貝爾的股票。假如投資人做了功課，他們應該會賣掉AT&T，並且留下小貝爾的股票，而且還要盡可能再加碼買進才是。


    AT&T原來的296萬名股東，都會收到一份又厚又重的資料，說明這項小貝爾公司的計畫，而各家新公司也會提出各自的發展規畫。當年有上百萬名AT&T的員工及無數的供應商，都親眼目睹這一切的發展，有這麼多可供業餘投資人發揮其優勢的地方，但卻只有少數的一部分人真正掌握到這項優勢。光就分拆這件事來說，只要是家裡裝了電話的人，應該都知道即將會發生大改變，我當然也應該知道，可是我並沒有特別熱中。我實在是想像不到，像AT&T這種相當保守的公司，居然能在這麼短的時間內改革得如此成功！


    # 5. 法人機構未持股，分析師沒追蹤


    如果你發現有某支股票很少或根本沒有法人機構投資，或許你就找到了一支潛在的贏家；或是發現一家根本沒有股票分析師去拜訪過，或他們根本不曉得的公司，那更是天大的好消息！如果我拜訪'
  merge: -1
  img_proc: true
- pgno: 177
  md: '某家公司，他們告訴我上一次有分析師來訪是在三年前，那我真是樂翻了。這種情況通常會發生在銀行、儲貸機構以及保險業，這類公司在美國有數以千計，但華爾街只能追蹤其中的50家到100家左右。


    對那些一度屬於熱門股，如今專家們卻棄之不顧的股票，我也相當熱中。有些專家就是在克萊斯勒及埃克森石油的股價即將觸底反彈時，因為熬不住而棄守。


    關於法人機構買進賣出的資訊，可以在《維克法人機構持股指南》（Vicker''s Institutional Holdings Guide）、《尼爾森投資研究手冊》（Nelson''s
    Directory of Investment Research）及《光譜調查》（Spectrum Surveys，由CDA投資科技公司發行）等刊物上找到，然而這些刊物並不是那麼容易取得，因此你可以從《價值線投資調查》或標準普爾股票報告上取得相關訊息，這些都可以向證券商索取。


    # 6. 謠言紛起的股票：

    涉及有毒廢棄物和（或）黑手黨


    很難想像有哪種產業會比廢棄物處理業更為完美。如果還有什麼比動物腸衣、油脂和油污更令人討厭的話，大概就是污水穢物和有毒廢棄物吧。這正是為什麼有一天幾位固態廢棄物處理業的經理人出現在我辦公室裡時，令我大感興奮的原因了。他們是來這裡參加固態廢棄物的研討會，會場中設有說明攤位和幻燈片，想像一下，很有趣吧！而且這些經理人不是穿藍棉布襯衫，而是運動休閒服，上頭印著「固態廢棄物」，誰會穿這種衣服呀？除非是固態廢棄物保'
