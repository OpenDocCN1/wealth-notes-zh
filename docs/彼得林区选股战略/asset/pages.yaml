  md: '# 16 設計一份投資組合


    我曾經聽人們說，如果投資股票每年有25%到30%的報酬率，他們就很滿意了！這樣只是很滿意嗎？如果報酬率真的這麼高，他們很快就可以和日本人以及德州投資大亨貝斯兄弟（Bass
    brothers）一起割據半個美國了。就是1920年代那些操縱華爾街的大戶，也不

    敢保證能永遠得到30%的報酬率呢！


    在某些時候你一年可以賺30%，而在其他年度或許你只能賺2%，甚至是虧損20%。實際的情況就是如此，你只得接受現實。


    期望過高會有什麼問題嗎？如果你認為每年應該有30%的報酬率，或許你會因為失望而感到挫敗，於是失去耐心，並因此在錯誤的時機放棄繼續堅持下去；或者更糟的是，你會因此承擔不必要的風險，追求不切實際的報酬假象。只有不管市況是好是壞，都能堅守一套投資策略，才能讓長期的投資報酬極大化。


    如果說每年25%到30%的報酬率不切實際的話，那麼應該多少才合理呢？當然，你投資股票的報酬率理當要比投資債券好，但如果長期下來你每年只能賺個4%、5%或6%的話，那就太糟糕了。如果你檢視自己的長期績效，並且發現你投資股票的報酬率和銀行存款利'
  merge: -1
  img_proc: true
- pgno: 317
  md: '息差不多的話，就表示你的操作技巧有問題了。


    附帶一提，當各位在計算自己投資股票的績效時，可別忘了你還花了錢訂閱投資通訊、財經雜誌，還有交易手續費、參加投資講座的費用，和打給營業員的電話費。


    一般而言，投資股票的長期報酬率大約在9%到10%之間，這是整體市場的歷史平均值。假如你是投資買進標準普爾500指數中500種成分股的無佣金共同基金（no-load
    mutual fund），這種基金會自動複製標準普爾指數的績效，那麼長期下來你會有10%的報酬率。這種自己完全不必做功課、也不必花額外的費用所產生的報酬率，可以當作一個基準指標，用來衡量你的投資績效，同時也可以用來衡量麥哲倫等股票基金的操作績效。


    如果我們這些受雇挑選股票的專業人士，績效表現無法超越根據指數照單全收的指數型基金的話，那我們就該回家吃自己了。不過，請給我們一個機會。首先，你要考慮你投資的是哪種類型的基金，如果你是投資金礦股基金，一旦黃金價格下跌，即使是全世界最棒的基金經理人負責操盤，照樣也是坐困愁城；此外，只以單一年度的績效來判定生死也不公平。不過，如果你已經投資了三、五年，結果發現其報酬率只是和投資標準普爾500指數一樣，那不如直接投資標準普爾500指數；或是另找高明，挑一支過去操作紀錄比較好的管理型股票基金，畢竟它花了那麼多時間挑股票，報酬率應該會比較高才是。


    既然有這麼多方便的選擇，而你還是認為值得付出心力自行挑選股票，那麼長期來說你應該得到12%至15%的複合報酬率才是。而且'
  merge: -1
  img_proc: true
- pgno: 318
  md: '這必須是扣除所有的成本和手續費，並且加上所有的股利和其他紅利所得出的數字。


    這也是為什麼長期持有股票會比短線進出更划算的一個理由。對小額投資人來說，頻繁進出的交易成本相當高。現在買賣股票的交易費用的確是比以前便宜，這一方面是因為折扣券商的出現；另一方面則是由於「零股」買賣費用的修正——即不到100股的買賣交易費用修正（如果你在開盤前先把要賣的零股交給證券商交易櫃台，就可以和別人的零股彙總在一起，而不必支付額外的零股交易費用）。儘管如此，業餘投資人每次買進或賣出股票，大概就要付出1%至2%的手續費。


    因此，如果散戶投資人每年調整一次投資組合，股票一進一出就要損失4%的手續費。換句話說，投資人一開始就有4%的缺口要彌補，因此，如果投資人希望每年的投資報酬率在扣掉成本後還能達到12%至15%的話，那麼他挑的股票就必須要有16%到19%的報酬率才行。而如果進出的情況越頻繁，要超越指數型基金或其他共同基金的績效就越困難（現在有一種新的「基金家族」投資方式，你剛開始參加時必須支付3%到8.5%的手續費，之後就可以根據你的需要，在股票、債券或貨幣市場基金間進行轉換，而且無須再支付手續費）。


    儘管有這麼多的陷阱，但如果散戶投資人可以打敗大盤平均10%的報酬率，譬如每年可以達到15%的話，那麼十年下來就會是一筆不錯的報酬。如果一開始是投資1萬美元，每年15%的報酬率在十年後將會變成4萬455美元，而每年10%的報酬率則只會有2萬5,937美元。'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# 持有多少支股票才算太多？


    如何設計一個可以創造12%到15%報酬率的投資組合呢？你應該持有幾支股票呢？現在我可以告訴各位：如果可能的話，千萬別一次買1400支股票！不過這是我的問題，不是你的問題。此外，你也不必煩惱什麼5%、10%的規定，也不必管理90億美元的龐大基金。


    長久以來，投資顧問界就分成兩個陣營，一直爭執不休。洛伯（Gerald Loeb）的陣營宣稱：「把所有的雞蛋都放進同一個籃子裡。」而托拜斯（Andrew Tobias）的陣營則反駁說：「不要把所有的雞蛋都放在同一個籃子裡，搞不好籃子裡破了一個洞呢。」


    如果我手中有一個籃子是沃爾瑪百貨的話，我會很樂意把我所有的雞蛋都放在這個籃子裡。相對的，如果要我把所有家當都放在伊利諾大陸銀行（Continental Illinois
    Bank）的這個籃子裡冒險的話，那我就敬謝不敏了。如果我手中有五個不同的籃子，分別是松尼連鎖餐廳、有限服飾、活力男孩、塔可貝爾，以及SCI的話，我保證把我所有的雞蛋分別放在這些籃子裡肯定會是一個好想法。可是在這種分散投資的做法中，包括雅芳公司或瓊斯—曼維爾公司的話，那我寧可只挑一個堅固的籃子來放雞蛋，例如唐金甜甜圈這種股票。其實重點不在於「幾支」股票，而是要仔細研究每一支股票，看看它們到底夠不夠好。


    就我來看，如果是①你具備優勢的股票；以及②你發現極富潛力，而且研究後證實的確大有「錢」途的股票，那最好是能夠全部持有。或許這只是一支股票，也許是一打股票，那都沒關係。或許你'
  merge: -1
  img_proc: true
- pgno: 320
  md: '打定主意要專注在轉機股或資產股，因此你買了幾支這類的股票；又或者你剛好只是對特定的某支轉機股或資產股比較了解，那就挑這支股票也行。如果只是為了分散風險，而去投資自己不了解的股票，這樣根本毫無用處。愚蠢的分散投資做法，根本就是專吃小散戶的妖魔鬼怪。


    不過有人說，只投資一支股票並不安全，明明你非常努力地做了研究，但是你挑選的股票還是可能會因為未知的環境變化而遭遇不測。我個人認為，對一個小規模的投資組合來說，持有三支到十支股票是最合適的。這樣做有幾ibol點：


    第一，如果你要尋找十疊安打的話，你持有的股票越多，碰上十疊安打的可能性就越高。在幾支同樣具有潛力的快速成長股中，到底哪支股票會勝出、漲得最多，結果通常會出人意料之外。


    停車採購超市就是我始料未及的大贏家，我原先還以為最多只能賺個30%或40%而已。它是一家不起眼的公司，當時股價還正在下跌，於是我在1979年開始買進它的股票，其中部分原因是i我喜歡它的股利殖利率不錯。後來它的情況越來越好，旗下的超級市場和折扣商店的生意都十分興隆。當時我是以每股4美元買進，等到它在1988年被收購時，股價已經漲到44美元了。萬豪集團這支股票也是出乎我意料之外的大贏家，我知道萬豪的經營很不錯，因為我在它的飯店住過許多次，但是我壓根兒想像不到它的股價表現會這麼強勁，早知道我就不該買其他股票，應該把錢全部押在萬豪才對。


    附帶一提的是，最近報上充斥各種企業收購的傳聞，但是在我因為預期被收購而買進的股票中，根本沒有哪支股票最後真的被收購'
  merge: -1
  img_proc: true
- pgno: 321
  md: '了。實際的情況通常是，我因為基本面強勁而持有的股票，結果反而被收購了，這當然是意料之外的狀況。


    既然我們無法預測各種不同的意外驚喜會從何而來，因此多持有幾支股票，你從中受惠的機率就會提高。


    第二，你持有的股票越多，運用資金的彈性就越高。對我的投資策略而言，這是非常重要的一點。


    有些人把我的成功歸因於專注在成長股所賜，可是這只說對了一部分，因為我絕對不會把基金資產超過30%至40%的比重放在成長股上面，其餘部分我會用來押注本書所說的其他類型股。通常我會持有10%到20%的穩定成長股、10%到20%左右的景氣循環股，剩下的部分則押在轉機股上面。雖然我總共投資了1400支股票，但是有一半的基金資產是押在100支股票上面，大約三分之二是投資在200支股票上面。另外有1%的資金分散在500支次級的投資機會上，這些股票我會定期追蹤，很可能隨後會進場加碼。我一直在各個領域尋找有價值的投資機會，如果我發現在轉機題材有某些投資機會比快速成長型公司更好，那麼我就會持有較高比重的轉機股。如果那些列入追蹤名單的次級投資機會中，某一支個股出現利多，並且讓我有信心，我也會把它納入主要持股當中。


    # 分散持股類型


    將資金分散投資在數種不同類型的股票上，也是另一種降低損失風險的方法，這點我們在第3章已經有所討論。如果你做了適當的研究，並以合理的價格買進股票，便已經相當程度地降低了風險。除'
  merge: -1
  img_proc: true
- pgno: 322
  md: '此之外，下面還有幾點值得你考慮：


    緩慢成長股的風險低、報酬也低，因為大家不會預期這類股票有太多表現，因此股價當然也不會太好。穩定成長股也是低風險，報酬中等者，如果你持有可口可樂，而且到明年為止情況一切順利的話，你或許可以賺個50％；但如果諸事不順，或許你就會賠20％。至於資產股則是低風險、高報酬的股票，但是你要能確定其資產的真正價值。萬一你看錯資產股的話，可能不會賠太多；要是看對的話，大概就能賺個二、三倍，或是五倍。


    景氣循環股可能是低風險、高報酬，也可能是高風險、低報酬的股票，全看你是否善於預測景氣循環的變化。如果你預測正確，就可能打出一支十疊安打；不過要是你看錯了，也可能賠掉80％到90％。


    此外，十疊安打也可能來自於快速成長股或是轉機股，這些都是高風險、高報酬的股票。上漲的潛力越高，下跌的機會也同樣越大；而如果快速成長股開始衰退，或是曾經陷入困境的轉機股再次出現困難，股價下跌的趨勢足以讓你的資金全數賠光。當我投資克萊斯勒時，我想如果一切順利的話，我就可以賺到400％，可是萬一每件事都出錯的話，那我就會賠掉100％。這就是你在投資轉機股前心中必須要有的體認，而真正的結果則讓我驚喜不已，我竟然賺了15倍！


    但是並沒有確切的方法可以確定風險、報酬有多少，不過你在規畫投資組合時可以納入一些穩定成長股，藉以平衡同時持有四支快速成長股和四支轉機股所帶來的威脅。同樣的，主要關鍵還是在於你'
  merge: -1
  img_proc: true
- pgno: 323
  md: '買進時必須有清楚的研究了解。如果你買進的穩定成長股股價已經太高了，那麼風險不但沒有被抵銷，反而是火上加油。回顧1970年代的幾個年頭，甚至連表現完美的必治妥都成了高風險股票。當時投資人把必治妥的本益比炒到30倍的高水準，可是盈餘成長率卻只有15%，股價已經沒有再上漲的空間。後來，必治妥足足花了十年的時間持續成長，才趕上被高估的股價水準。如果你是在本益比等於成長率兩倍的價位時買進必治妥，那就是冒了不必要的風險。


    如果你買進價格被高估的股票，即使這家公司的經營非常成功，你還是無法賺到錢，這可真是太悲慘了。電子資料系統公司的情況就是如此，1969年這支股票的本益比是500倍，但是在接下來的十五年裡，公司的盈餘雖然大幅成長，增加了20倍，股價卻在1974年一路從40美元跌到3美元（經過分割調整），然後才開始反彈回升。到了1984年通用汽車以每股44美元的價格收購這家公司，股價才又回到大約十年前的價位。


    最後，你的投資組合也應該隨著年齡調整。比較年輕的投資人未來還有工作收入，因此可以冒比較高的風險來尋找十疊安打；但是老年人必須仰賴投資收益來過日子，經不起這樣的風險。而且，比較年輕的投資人有較長的時間可以嘗試和犯錯，直到找到偉大的股票，建立起自己的投資生涯為止。事實上，每個人的條件和狀況都有很大的差異，如果要進一步分析，就得靠各位自己進行了。


    # 幫雜草澆水


    下一章我會解釋我認為何時應該賣出股票，此處我要討論的股票賣出問題，則是針對投資組合的管理方面而言。我會持續檢視手中的'
  merge: -1
  img_proc: true
- pgno: 324
  md: '持股，觀察個股和上市公司的題材，然後根據情勢的變化來增加或減少持股部位。除了因應投資人的贖回要求之外，我不會把持股轉換成現金。賣掉股票變現就表示退出市場，但我的想法則是要永遠留在市場裡，並根據基本面情況的改變，適時地換股操作。我認為，如果各位決定一個固定金額的資金就是要投資在股票市場，那麼你就可以避免錯誤時機的進出操作，以及因此而產生的無謂煩惱。


    有些人總是不自覺地賣掉贏家（上漲的股票），並且緊抱輸家（下跌的股票），我說這不就是把花園裡的花拔掉，成天忙著為雜草澆水嗎？有些人則是賣掉輸家、緊抱著贏家，但是這麼做也高明不了多少。這兩種做法都會出錯，主要是因為投資人把股價的當前波動，當成是公司基本面價值的指標（1972年塔可貝爾的股價大幅下滑時，並非公司的表現不好，而是股市出問題，公司的營運狀況仍然很好）。如同我們所看到的，當前的股價漲跌，根本無法提供公司未來前景的訊息，而且，股價有時還會和公司的基本面背道而馳。


    在我看來，比較好的投資策略是根據和公司題材有關的股價變化，適時地調節換股。例如，我原先設定某支穩定成長股大約會上漲40%，等到它達到這個漲幅，而且再也沒有更大的利多出現時，即代表其未來不會有新的驚喜，這時我就
    ],



    如果能在幾支穩定成長股間成功地輪流操作，所獲得的報酬率可能會等於投資一支大贏家的報酬率：六支漲幅30%的股票用複利來計'
  merge: -1
  img_proc: true
- pgno: 325
  md: '算，就會超過一支單獨的四疊安打；而六支漲幅25%的股票用複利來計算，也約略等同於一支四疊安打。


    如果是快速成長股，只要盈餘持續成長、公司營運持續擴張，而且預期未來也沒有任何阻礙的話，我就會一直持有。每隔幾個月我會重新檢視這支股票的題材，就像第一次聽到這支股票時一樣。如果有兩支快速成長股，我發現其中之一的股價已經上漲了50%，而且它的題材開始令人產生疑慮時，我就會賣出這支股票，轉進另一支股價已經下跌或尚未波動，而且題材看起來比較好的股票。


    景氣循環股和轉機股也是一樣，在基本面轉壞、股價上漲時就該賣出，並轉進基本面較好且股價下跌者。


    一支好股票的股價下跌並不算什麼，只有當你是在股價下跌時賣出、而且絕對不再加碼買進時，這才算是一種悲劇。對我來說，股價下跌正是逢低承接體質強健、但還未發揮潛力、或股價表現落後之股票的大好機會。


    如果你無法說服自己「股價下跌25%，我就要買進」，以及放棄「股價下跌25%，我就要賣出」的錯誤想法的話，那麼你就絕對無法在股票上獲得不錯的利潤。


    我一向討厭「停損單」的做法，理由現在各位應該都很清楚了。所謂的「停損單」就是預先設定一個價位，等市價碰到這個價位時就自動賣出，這個預先設定的價位通常是在買進價格下跌10%的位
    置。當然，如果你設定10%的停損單，一旦自動執行了，你的虧損將會限制在10%的水準，但是就目前市場波動的狀況來看，每支股'
  merge: -1
  img_proc: true
- pgno: 326
  md: '票幾乎都可能會先下跌10%，然後再繼續上漲。至於股價為什麼總是會先下跌10%，讓那些停損單執行賣出呢？這的確是很詭異。可

    是這麼一來，投資人並非受到避免損失的保護，反而是讓損失變成事實。而如果你設定停損單的話，你將永遠打不出塔可貝爾這支十疊安打！


    如果你打算持有一個設定10%停損的投資組合的話，那我倒是可以告訴你一個注定會賠10%的投資組合。一旦設定停損，等於你認為你將在比今天更低的價格下賣出股票。


    而且股價經常在碰到停損後就一路直飆而上，這種情況的確是很奇怪，並且會讓那些過分小心的投資人就此被三振出局。光靠停損單是無法保護投資組合的跌價風險，同樣地，預先設定漲幅目標區也不是一個好方法。如果我相信「股價漲兩倍就獲利了結」這種投資策略，那我肯定無法從任何一檔大贏家股中獲利，現在我也不會在這裡寫這本書了。只要你原先設想的個股題材仍然合理，或越來越好，那就
    Wild 抱持股，留意情勢的變化，數年後，你會對你所獲得的報酬感到驚訝不已。'
  merge: -1
