- pgno: 19
  md: '說到長期資本利得，在過去十一年來的午餐或晚餐演講會中，我都會詢問與會來賓一個問題：「自認是股市長期投資人的請舉手？」一直到現在，都是全體一致舉手，每位來賓都是長期投資人，包括幾位翹班幾小時來參加演講會的當日沖銷交易員。由於長期投資的概念如此風靡，因此要承認自己搞短線，還不如承認自己吸食古柯鹼更容易。


    股票市場的新聞從很早以前的難以獲得（1970年代及1980年代初期），到後來很容易取得（1980年代末期），演變到現在則是很難避開。如今，金融新聞搞得跟氣象報告差不多，成天報導高價、低價、波峰、谷底，還有無休無止地預測未來的行情走勢、投資人該如何因應等等。專家都建議投資人應該從長線觀點來思考，但是隨著每次行情變化而來的，則是接連不斷的市場評論分析，使得大家產生危機感，並且只看到短線因素。而一旦看到這些消息卻不採取行動，實在是很困難！如果可以避開每日漲跌的蟲惑，每六個月才看一次股價，就像檢查汽車機油一般，那麼投資人將會輕鬆許多。


    不會有人比我更熱中於長期投資了，不過說比做來得容易。然而，這一代的投資人在上述所提及的回檔行情中，都相當有信心地抱持有長線的做法。從我的老東家富達麥哲倫基金的贖回要求來看，投資人顯然都非常滿意。1990年海珊（Saddam
    Hussein）所引發的空頭市場，也只有一小部分投資人要求贖回基金變現。


    感謝當日沖銷交易員及部分避險基金的專業經理人，如今股票的換手速度才會這麼迅速。1989年時，紐約證券交易所的成交量如果達到三億股，就已經算是行情火熱了，而如今三億股卻只是讓人昏昏欲睡的插曲，甚至成交八億股也不過是平均水準而已。這是因為當'
  merge: -1
  img_proc: true
- pgno: 20
  md: '沖交易員震撼了市場先生所致？或是因為熱絡的指數交易所致呢？不管是什麼原因（我個人認為當沖交易員是主因），頻繁的交易市況，造成股市更加震盪。十年前，股市單一交易日上漲或下跌超過1%的情況可說是微乎其微，如今，一個月裡總有好幾次當日的漲跌幅超過1%。


    附帶一提的是，靠當日沖銷跑短線來過活，就跟賭馬、玩二十一點或電玩賭博差不多。事實上，我看當日沖銷就好比是家庭式的賭場，唯一的缺點是還得做些書面作業紀錄。如果一天做上二十筆交易，一年可以做五千筆，這些交易進出都要做好紀錄，製成表格，好向國稅局報稅，因此，當日沖銷也是養活許多會計師的賭場。


    大家想知道股市表現如何時都會問：道瓊指數收盤點數多少？不過我比較想知道的是有多少支股票上漲、多少支下跌，亦即是所謂的漲跌家數（advance/decline
    number），這比較能反映出股市狀況，尤其更適合最近這種少數幾支股票上漲，大多數股票低迷不前的特殊行情。那些步步為營的投資人，以「超跌」的小型股或中型股為目標，反而會嘗盡苦頭。大家都深感困惑：怎麼標準普爾500指數已經上漲20%了，而我的股票卻反而下跌呢？答案是，由於有某些大型股的支撐，標準普爾500指數才得以上升。


    例如，1998年標準普爾500指數總共上漲了28%，如果仔細深入觀察將會發現，前50大公司的漲幅高達40%，而其他450支股票卻幾乎沒動。以網際網路及其相關產業為主的那斯達克（NASDAQ）市場，也只有十多家上市公司是大贏家，其他股票根本不太動，全都是輸家。相同的情況在1999年又再度重演，少數幾支股票的亮麗表現，掩蓋了大多數股票行情不佳的事實。在紐約證交所中，1999'
