  md: '代，很多人真正去淘金的人都賠了錢，但是那些賣十字鎬、圓鍬、帳篷和牛仔褲（例如李維．史特勞斯〔Levi Strauss〕）的，則是賺了大錢。現在你也可以找尋那些不是網路業者，但是間接靠網路而受益的公司（例如包裝運送業就是個明顯的例子），或者也可以投資那些促進網路活動的附加裝置設備的製造商。


    第二種方法叫「免費的網際網路」。有些公司不屬於網路產業，但也經營網路業務，而且這種公司既有盈餘，股價也合理。在這裡我並不特別指明是哪些公司，不過我的確注意到幾個標的，各位可以自己試著尋找看看。這種公司的典型狀況是整體市值不低，以目前的市場行情而言，大約是8億美元左右，但是它所持有、才剛起步的網際網路業務，預估價值則為10億美元（當然還沒真正接受檢驗）。如果未來網路業務真的衝上來，那
    systemctl 大有賺頭了，但這部分的業務對整家公司而言，還只是個「附屬」部分，因此其股價主要仍是反映公司的本業。萬一網路業務表現不佳，還有本業作為支撐，可防止股價下跌，這對投資人較有保障。


    第三種方式則是附帶的利益。傳統產業（實體產業）運用網際網路也可降低成本，讓作業模式更為流暢、更有效率，因此獲利能力也更好。例如，三十年前超級市場開始裝設掃描器，不但降低了失竊的損失，也能更有效地管理存貨，對超市連鎖業的幫助很大。


    未來，網際網路及其從業人員一定會創造出偉大的成功故事，但是在目前，我們所掌握的只是一個遠大的期望，以及不合理的股價。一家總市值5億美元的公司，在今天來看應該算是成功了，但一家總市值100億美元的公司卻很可能反倒一文不值。如果那些遠大的期望都能成真，那麼這些大贏家會比今天所看到的更為明顯，那些'
