- pgno: 56
  md: '# 1 一個選股者的養成


    選股可沒有什麼家傳秘訣，很多人經常把虧損歸咎於先天不足，並認為有些人就是天生的投資專家，不過我個人的經驗剛好是個反證。我可不像球王比利一樣，他從小就跟著足球一起長大，而我小時候的嬰兒床上並沒有裝設股價跑馬燈，童年時也不曾著迷於股票版。就我所知，在我出生時，我爸爸並沒有在焦急等待時偷空跑出去看通用汽車的股價，我媽媽在陣痛期間也沒問過AT&T公司的股利水準。


    後來我才知道，在我出生的那天，1944年1月19日，道瓊指數是下跌的，而當我住在醫院育嬰室裡的那一週，道瓊指數仍繼續下跌。雖然當時我不疑有他，不過這大概是「林區定律」（Lynch
    Law）發揮效力的最早例證吧。與「彼得法則」（Peter Principle）密切相關的林區定律是：不管什麼時候，林區向前進，股市就下跌（最近一個證據是，1987年夏天我才跟出版商簽約要寫這本書，正當我邁向人生的高峰時，股市就在兩個月裡狂瀉了1,000點。所以，如果以後要賣出電影版權，我一定會三思而後行）。


    我大部分的親戚都不相信股票市場，這可說是其來有自。我媽媽是七位兄弟姊妹中的老么，也就是說我的舅舅、阿姨們都是在經濟大蕭條期間長大的，曾經親身體坐過1929年的股市大崩盤，因此我們'
  merge: -1
  img_proc: true
- pgno: 57
  md: '家族中根本不會有人推薦去買股票。


    唯一聽過的一次，是我外公吉尼．葛里芬（Gene Griffin）曾經買過城市服務（Cities Service）公司的股票。他是非常保守的投資人，之所以挑中城市服務公司，是因為他以為那是一支自來水公用事業股。後來他去了趟紐約，發現原來那是一家石油公司便趕忙賣掉，之後，城市服務公司的股價漲了50倍。


    整個1950年代到1960年代，美國各地瀰漫著一股對股票的不信任感，儘管當時股市先上漲了三倍，後來又漲了兩倍。事實上，美國史上最大的多頭市場就出現在我的童年時期，而非最近的1980年代。可是如果按照我舅舅們的說法，這種大多頭行情也不過就像是在彈子房後面賭骰子一樣，大家也警告說：「千萬別碰股票市場，風險太高了，會把錢賠光光。」


    如今回想起來我才了解，在1950年代投資股票把錢賠光的風險，絕對比其他時期來得低。這個經驗不但告訴我股市行情難以預測，而且，散戶投資人明顯都是在錯誤的時機過度悲觀或過度樂觀，因此想要在熱門之際買進、在低迷之時賣出，結果總是弄巧成拙。


    我爸爸是個勤奮的數學教授，後來離開了學術圈，成為約翰．韓考克（John Hancock）公司最年輕的資深審計員，在我七歲時他生病了，三年後因腦癌去世。由於這個變故，我媽媽只好外出工作（在露德羅製造廠〔Ludlow
    Manufacturing〕工作，後來露德羅被泰科實驗公司〔Tyco Labs〕收購）。為了貼補家用，我在十一歲時就到高爾夫球場當桿弟，那天是1955年7月7日，道瓊指數從467點跌到460點。'
