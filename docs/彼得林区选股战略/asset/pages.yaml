  md: '專注於此的投資人到時候再投入也不遲。


    再回來說說微軟。成長100倍，但是我卻錯過了。微軟、思科〔Cisco〕以及英特爾，這三家高科技超級公司幾乎是從一開始就創造了驚人的利潤。微軟在1986年上市，上市價格每股15美分，上市之後三年內，你都可以用低於1美元的價格買到這支股票，之後它飆漲了80倍（不過這支股票曾經多次進行分割，所以上市價格可不只是15美分。關於這點，在導言裡會再進一步解釋）。如果你採用「密蘇里顯示法」（Missouri
    "show me"），等到微軟推出「視窗95」獲得成功再進場買進，你仍然可以賺到七倍。你不必是個程式設計師，也能注意到微軟的經營狀況。除了蘋果電腦之外，所有新出廠的電腦都配備有微軟的作業系統和視窗，蘋果電腦則節節敗退。使用視窗的電腦越多，為視窗而寫的程式就越多，蘋果電腦就越被擠到角落，最後只搶到7%至10%的市場而已。


    在此同時，電腦硬體廠商也展開激烈的價格競爭，以求擴大市場占有率，它們都使用微軟程式（例如戴爾〔Dell〕、惠普〔Hewlett-Packard〕、康柏〔Compaq〕，以及IBM等公司），相互競爭雖然削減了盈餘，但是並不會影響到對微軟程式的需求。比爾·蓋茲的公司不做電腦，他賣的是讓電腦盒子動起來的「汽油」。


    思科是一支超級成長股，1990年上市後，股價上漲了480倍。基於同樣的原因，我也忽略了這支股票，但一定有很多人注意到這支超級大贏家。許多公司聘請思科規畫電腦網路，學校請思科承辦學生宿舍的電腦化，學生、老師及來探望學生的家長們，都可能發現到這個變化。也許其中有人回家就做了調查研究，然後買了它的股票。'
