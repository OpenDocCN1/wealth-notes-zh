- pgno: 110
  md: '果真如此，他們早該退休，住到加勒比海，成天喝喝小酒、釣釣魚。但是就我所知，大多數的經濟學家現在還在受雇領薪水呢！這總告訴我們一些真實的情況了吧。有某位聰明人曾說，如果讓全世界的經濟學家排成一排，這也不是件壞事。*


    唔，好吧，也許不是「全部」的經濟學家啦。當然不是那些正在閱讀本書的經濟學家，更不是勞倫斯公司（C. J. Lawrence）的希曼（Ed Hyman）那種經濟學家，他可是緊盯著殘餘價值、存貨、鐵路貨運量等等，完全不理會什麼拉弗曲線（Laffer
    curve）或月相盈虧，像這種務實派才能深得我心。


    還有一種理論說，每五年就會出現一次經濟衰退，不過到目前為止，衰退也不是每五年就出現一次。而且我查過憲法，裡頭並沒規定每五年就一定要出現一次衰退。當然，如果衰退即將來臨，而且有人事先提出警告，好讓我調整投資組合，這的確很好；但問題是，我根本不曉得經濟在什麼時候會衰退。有些人總是在等待經濟衰退結束的訊號，或是令人興奮的新多頭行情起跑的槍響，但問題是，從來也沒聽到過起跑的訊號。各位要記住，一旦狀況明朗，就已經太遲了。


    從1981年7月到1982年11月的十六個月衰退期間，是我記憶中最慘痛的一段時期。當時敏感的專家們都不禁懷疑，我們是否會回到過去的漁獵生活，住在森林裡過著原始的生活。那時候美國的失業率高達14%，通貨膨脹率15%，銀行基本放款利率20%，情況真的很


    > *編按：語出蕭伯納，原本的說法是：「如果讓所有經濟學家排成一排，他們也不會有一致的結論。」'
