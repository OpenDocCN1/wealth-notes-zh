  md: '的名單中挑選股票，也沒有像弗尼特那種人老是在我身後唸唸叨叨。這並不是說富達的老闆和監督者不會監視我的進度、提出挑釁的問題，或者定期檢討我的操作績效，只是沒有人會叫我一定得買進全錄股票，或者不准買七橡國際。


    富達麥哲倫基金最不利的地方，就在於規模太過龐大，股票基金的規模越大，想要超越同業的績效就越難。要讓一支擁有90億美元資產的基金，表現比只有8億美元的基金更好，就像是要籃球明星大鳥柏德（Larry
    Bird）在腰上繫五磅重的鉛塊，跟對手打籃球一樣。大型基金就像所有的龐然大物，有先天上的不利條件：體積越龐大，行動時所需的能量就越多。


    儘管規模已經高達90億美元，但富達麥哲倫基金還是比同儕成功，每年都有人說它快完蛋了，不過它每年的績效還是很好。到了1985年6月，富達麥哲倫基金已經成為全美最大的共同基金，操作績效也比其他98%的股票共同基金更好。


    能有如此的好表現，我必須感謝七橡國際、克萊斯勒、塔可貝爾、活力男孩修車廠，以及其他我所找到的快速成長股、轉機股，和冷門黑馬股的幫忙。我買進的這些股票，正是傳統基金經理人刻意忽略的部分。換句話說，我是盡可能以業餘散戶的方式來思考。


    # 股市我獨行


    你不必像法人機構那樣進行投資，如果你採用那種方法，績效也會跟法人機構差不多，換句話說，就不是很好。如果你本來就是一個業餘散戶，更不必強迫自己要以散戶的方式來思考。不管你是衝浪'
  merge: -1
  img_proc: true
- pgno: 84
  md: '選手、卡車司機、高校中輟生，或是脾氣古怪的退休老頭，你都已經具備了某種優勢。在華爾街仔細思考的範圍之外，才是會打出十疊安打的地方。


    你在做投資的時候，不會有弗尼特來批評你的每季或半年績效；也不會有人盤問你，為什麼要買進機構租車公司，而不買IBM？也許你還是要面對你的先生或太太，或者也要面對證券商的營業員，但是對你所挑選的奇怪股票，營業員只會投以同情的眼光，絕不會因為你要買進七橡國際的股票，就把你開除，反正你還是得付手續費。至於你的配偶（不知道投資為何物的那位），不是不斷接納你的錯誤，來證明對你的信任嗎？


    （萬一很不幸地，你的配偶難以認同你所選的股票，至少你還可以把券商每個月的對帳單、報告書藏起來吧！我當然不是叫你這麼做，只是要說明業餘散戶比股票基金經理人更有轉圜餘地和選擇空間。）


    你也不必浪費四分之一醒著的時間，拚命向同事解釋為什麼你要買進那些股票。也沒有規定不准你買進名字以「r」字母開頭、股價在6美元以下，或者是有工會的公司的股票。沒有人會在你旁邊嘲叭：「我從來也沒聽過沃爾瑪百貨。」或「唐金甜甜圈？聽起來有夠蠢的，洛克菲勒不可能會投資唐金甜甜圈這種公司。」萬一你在11美元賣出、19美元又追回（有時這麼做也有其道理），也不會有人責怪你。而如果基金經理人這麼做的話，早就會丟飯碗了。


    你不必被迫持有1,400支不同的股票，也沒有人會叫你把錢分散在100支持股上面。你想單買一支股票就單買一支，也可以買4支或10'
  merge: -1
  img_proc: true
- pgno: 85
  md: '支，一切都隨你高興。萬一找不到基本面良好的股票，你還可以高掛免戰牌，等待更好的機會。至於股票基金經理人可就沒有這種奢侈的選擇，我們不可能把持股賣光，而且如果出現這種情況，一定是在瞬間發生，這時根本不會有人用還算合理的價格來買你的股票。


    最重要的是，你可以在你的上班地點或住家附近，領先華爾街分析師和基金經理人好幾個月甚至好幾年，發掘出一些絕佳的投資機會。


    最後，我還要再說一次，也許你根本不應該進入股票市場。這個話題值得更深入的討論，因為投入股市需要堅定的意志，股市總是把意志不堅定的人拿來當墊背。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 3 這是賭博嗎？


    > 「紳士們偏好債券。」

    ——安德魯．梅倫（Andrew Mellon）


    經過1987年10月的行情重挫後，有些投資人又躲到債券避難了。有關股票和債券孰優孰劣的問題，值得提出來冷靜且嚴肅地討論一下，否則每次股市一出現恐慌行情，大夥兒就忙不迭地衝向銀行把錢放到定存裡，最近就發生過這種事情。


    投資債券、貨幣市場或定存單，只是投資債權的不同形式，基本上都是收取利息。其實收利息並沒有什麼不好，尤其是以複利計算的話。各位可以仔細思考一下，1626年印地安人以價值24美元的飾品和珠子，就把曼哈頓島賣給新來的移民。三百六十二年來，此事一直傳為笑柄，但是仔細一算，和買到土地的新移民相比，或許印地安人還真的是賺到了。


    我們假設那些飾品和珠子換成了24美元的現金，以8%的複利來計算，經過這麼多年之後，這些印地安人已經累積了將近30兆美元的財富。而根據最近的地價稅紀錄來看，整個曼哈頓島的不動產總值不過281億美元。當然，這個價格只是申報價格，但就算是市價還'
  merge: -1
  img_proc: true
- pgno: 87
  md: '得加倍，也不過只有562億美元，印地安人在這筆交易上還是多賺了29兆美元！


    當然，就算1626年有8%的高利率水準，印地安人也不太可能取得這麼高的利息。事實上，今天要拿到8%的高利率也不是那麼容易，而當年的移民先驅也付不起那麼高的利息。那麼假設他們拿到6%的利率水準，到現在也會累積成347億美元，而且不必維修房屋，或是到中央公園割草皮。不過各位也可以看到，雖然只差幾個百分點，但是三百年下來會導致多麼大的差異。


    不管怎麼看，要說這筆交易就是詐欺，的確頗有疑慮。不過，投資債權果然是不錯的。


    過去二十年來，債券特別受歡迎，雖然在更早的五十年前並非如此，但最近二十年卻明顯極受歡迎。從歷史資料來看，利率很少脫離4%太遠，但晚近十年來，長期利率曾經暴漲至16%，後來又跌到8%，創造了非常好的機會。如果各位在1980年買進二十年期的美國國庫券，其面值幾乎漲為兩倍，而且可以坐收16%的高額利息。要是你在當時夠機靈，買進二十年期國庫券，即使是最近的股票多頭走勢，也都遠遜於你的投資報酬率。而且，你還不必忙著研究股票，也不必付半毛手續費給你的證券商。


    （要靠利率來投資，長期國庫券是最好的標的，因為國庫券不能提前贖回，或至少要在距到期日五年內才可以贖回。許多不高興的債券投資人發現，很多公司債和市政債券都在很短的時間內就提前贖回，所以正當利率水準對投資人有利時，債券發行單位就忙不迭地要求提前贖回。這時候投資人的心情大概就像財產被沒收了一樣'
  merge: -1
  img_proc: true
- pgno: 88
  md: '吧。只要利率開始走跌，投資人就會知道他們碰上了老狐狸，債券被贖回，對方把錢寄回來；另一方面，如果市場利率走揚，債務人樂得只支付債券上的固定利率，這時投資人等於是被套牢了。由於極少有公司債是不能提前贖回的，因此，如果各位要在利率走跌時掌握機會獲利，建議你最好是買國庫券。）


    # 解放存款簿


    傳統上，債券的面額都相當大，並不適合小額投資人投資，因此他們只好把錢放在銀行裡賺利息，或者購買非常無聊的美國儲蓄公債。後來出現了債券基金，一般投資人才能透過集資的方式，像大戶一樣投資債券。自此之後，貨幣市場基金把銀行囚禁的數百萬個存款人永遠解放出來。班特（Bruce
    Bent）和布朗（Harry Browne）首創貨幣市場基金，帶領一大批投資人逃離一毛不拔的儲蓄機構，真值得為他們立碑紀念。這兩位開創者在1971年成立了儲備基金（Reserve
    Fund）。


    我的老闆奈德，把他們的點子再向前推進一步，附加上下發支票的功能。在此之前，貨幣市場基金只是中小企業暫時存放週薪的地方，如今又可以開立支票，貨幣市場基金於是兼具儲蓄帳戶和支票存款帳戶的功能，因而廣受歡迎。


    寧可買股票，也不願意把錢放在儲蓄帳戶中，收取永遠不變的5%利率，這是一回事；而把錢投入提供最佳短期利率的貨幣市場，且一旦市場利率上揚，債券殖利率也跟著上揚，這又是另一回事。


    如果你從1978年開始，就把錢擱在貨幣市場基金裡，這自然沒什麼'
  merge: -1
  img_proc: true
- pgno: 89
  md: '好尴尬的，因為你躲過了好幾次的股市大跌。至少你還是領6%的利率，而且本金一毛不少。在短期利率暴升到17%的那一年（1981年），股市應聲下跌了5%，這麼一來一回，你等於賺了22%。


    1986年9月29日道瓊指數從1,775點開始出現驚人的漲勢，一路漲到1987年8月25日的2,722點，在這段期間你或許連一張股票也沒買，眼看著指數節節上揚，或許你覺得自己越來越優，竟然錯過了這輩子唯一一次的大好機會。經過一段時間之後，你甚至不敢告訴朋友，你的錢都擺在貨幣市場基金裡，這簡直比承認自己在商店裡順手牽羊還要糗。


    到了道瓊指數又跌回1,738點的隔天早上，你才大大鬆了一口氣，你總算躲過了10月19日的大崩盤。由於股價巨幅滑落，貨幣市場基金的全年表現的確比股市來得強，當年貨幣市場基金的殖利率是6.12%，標準普爾500指數卻只上揚了5.25%。


    # 股市大反攻


    不過兩個月之後，股市開始反彈回升，而且表現再度勝過貨幣市場基金和長期債券，就長期而言，股市的表現一直是比較好。從歷史資料來看，投資股市的確比投資債券更有利，事實上，遠溯自1927年開始，普通股平均每年漲幅為9.8%，而公司債的殖利率只有5%，政府公債4.4%，國庫券更只有3.4%。


    如果再扣除通貨膨脹率，以每年3%的消費者物價指數（Consumer Price Index, CPI）來計算，普通股的實質報酬率還有6.8%，而公認最穩當、最明智的國庫券殖利率卻幾乎完全被通膨吃光了，什麼也'
  merge: -1
  img_proc: true
- pgno: 90
  md: '沒有——零！


    我們說投資股票的報酬率9.8%勝過債券的5%，有些人可能會認為這根本相差無幾。不過讓我們把「李伯大夢」（Rip Van Winkle）的故事加上點金融色彩，各位就能看出其間的差異到底有多大。假設現代的李伯在1927年買了2萬美元的公司債後開始沈睡六十年，公司債的年息5%以複利計算，等到李伯醒來時，這筆投資已經累積成為37萬3,584美元，足夠買一間公寓、一部富豪汽車，然後再剪剪六十年來沒理過的頭髮了；但如果李伯在當年是投資2萬美元股票，以每年9.8%的報酬率計算，他一覺醒來時總共會有545萬9,720美元（由於李伯睡著了，所以1929年和1987年的大崩盤都不會把他嚇出場）。


    如果各位在1927年分別投資1,000美元在以下四種項目，以複利計算，而且不加計稅金的的話，六十年後將會變成：


    |  |  |

    |---|---|---|

    | 國庫券 | 7,400美元 |

    | 政府公債 | 13,200美元 |

    | 公司債 | 17,600美元 |

    | 普通股 | 272,000美元 |


    儘管在六十年間會碰上許多次的股市崩盤、經濟蕭條、戰爭、經濟衰退、十次政權輪替，甚至連女孩子的裙子長度都改變了無數次，但是投資股票的總報酬仍是公司債的15倍，更超過國庫券30倍以上！


    為什麼會有這麼大的差異呢？我們可以提出一個合乎邏輯的解釋。'
  merge: -1
  img_proc: true
- pgno: 91
  md: '投資股票時，公司的成長就是你的成長，你等於是跟公司共同分享繁榮與擴張。而投資債券，不過就是運用閒置資金的最簡便方式，你借錢給某人，最大的期待只是拿回本金，再加上一點利息而已。


    各位想想看，持有麥當勞債券多年的債權人，從一開始到結束，雙方的關係僅限於清償債務而已，這部分絕非麥當勞最令人興奮之處。當然，債權人是可以把錢拿回來，而且跟購買銀行定存單一樣妥當。但是，麥當勞最原始的股東如今都變富有了，他們擁有的是這家公司。況且，除非你是垃圾債券的投資高手，否則在債券市場裡根本不可能打出十疊安打。


    # 風險有多高呢？


    「是喔？」你嘟嚷著，尤其是剛剛才看到股價走軟：「但是風險呢？股票不是比債券危險嗎？」股票當然有風險，根本沒有明文保證股票會積欠我們什麼，而且在很多悲慘的時刻裡，我已經看過數百次這種情況。


    即使是長期持有績優股這樣穩當的投資方式，還是會有風險。RCA公司的股票是出了名的穩當投資，最適合孤兒寡母保本圖利。然而在1986年，奇異電器以每股66.5美元收購RCA公司，這個價格與1967年的市價相同，和1929年的最高價38.25美元（經過分割調整）相比，也只上漲了74%而已。緊抱一家經營成功的世界級企業股票五十七年，但是每年漲不到1%，真是情何以堪。伯利恆鋼鐵的股價則在1958年創下每股60美元的高價後，到現在還翻不回去！


    我們來看看1896年道瓊工業股價指數的第一代成分股，如今還有'
  merge: -1
  img_proc: true
- pgno: 92
  md: '誰聽過美國棉花油公司（American Cotton Oil）、DC牛隻畜養公司（Distilling and Cattle Feeding）、拉克列德瓦斯公司（Laclede
    Gas）和美國LP皮革公司（U.S. Leather Preferred）呢？這些曾經很出名的公司，早已灰飛煙滅了。


    在1916年的指數成分股名單中，我們看到了鮑德溫火車公司（Baldwin Locomotive），它在1924年下台一鞠躬；1925年的成分股中包括了家喻戶曉的派拉蒙影業（Paramount
    Famous Lasky）和雷蒙頓打字機公司（Remington Typewriter）；1927年，雷蒙頓打字機公司不見啦，由聯合製藥公司（United
    Drug）頂替。1928年，道瓊工業股價指數成分股從原來的二十家擴增為三十家，新加入者包括納許汽車公司（Nash Motors）、波斯敦公司（Postum）、萊特航空公司（Wright
    Aeronautical）和勝利牌留聲機公司（Victor Talking Machine）等等，最後兩家公司在1929年被除名，其中勝利牌留聲機公司被RCA公司併購（而你也看到緊抱RCA股票的下場如何了）。1950年，成分股名單上出現了玉米提煉公司（Corn
    Products Refining），不過1959年又被史威夫特公司（Swift and Co.）所取代。


    重點在於財富是會改變的，誰也不能保證大公司不會變成小公司，天下沒有萬無一失的績優股。


    即使挑對股票，但是買進時機錯誤、買進價位不好的話，照樣也會虧大錢。看看1972年到1974年的股市回檔，必治妥（Bristol-Myers）公司的股價從9美元跌到4美元，提勒坦科技公司（Teledyne）的股價從11美元跌到3美元，而麥當勞也從15美元跌到4美元，這些公司都不是不可信任的阿貓阿狗呀！至於在股市行'
  merge: -1
  img_proc: true
- pgno: 93
  md: '情正好的時候買錯股票，當然更甭想討到便宜。雖說股市的平均漲幅有9.8%，不過碰上特定時期也不管用，道瓊指數在1966年創下當時最高的995.15點後隨即走軟，一直到1972年才又見到前一波的高點。而1972年到1973年間創下的高點，也要熬到1982年才重回高峰。


    但是，除了非常短期的債券和債券基金之外，投資債券同樣也會有風險。例如在利率升高時，你就得面對兩難的選擇：是要忍受較低的票面利率，一直撐到期日；或是以低於面額的價格認賠出場。如果你真的很害怕投資風險，也許只適合把錢擺在貨幣市場基金或銀行裡，否則，不管什麼投資標的都會有風險。


    一般認為購買市政債券等於是把錢鎖進保險箱，安全得很。但是，市政債券積欠不還的現象雖然極為罕見，畢竟還是發生過，對那些倒楣碰上這種事的債權人來說，債券可是一點也不安全（最知名的積欠事件，就是華盛頓公營電力公司〔Washington
    Public Power Supply System〕和它那個惡名昭彰的「媽呀！」〔Whoops〕債券）。是的，我也知道99.9%的債券不會發生這種問題，但就算沒有積欠不還的狀況，投資債券還是可能會虧錢。如果是在通貨膨脹狂飆的時期，持有票面利率6%的三十年公債，看看到最後還值多少錢！


    很多人投資過專門買政府房屋貸款協會（Ginnie Mae）所發行的債券的基金，然而卻完全不了解債券市場的行情波動到底有多大。廣告上說「百分之百政府擔保」，他們就相信了，沒錯，政府擔保你一定收得到利息，但是當利率上揚，債券市場崩盤時，政府並不保證基金價格不會下跌。你只要在利率上揚半個百分點的隔天，翻開'
  merge: -1
  img_proc: true
- pgno: 94
  md: '報紙財經投資版，看看上頭報導基金出了什麼事，就會知道我的意思了。在最近這段時間，債券基金的行情變化跟股票基金一樣激烈，而利率水準的劇烈波動，也讓機靈的投資人在債券上賺到大錢，此時持有債券更像是在賭博了。


    # 股票和橡哈撲克牌


    坦白說，再穩當的投資都含有賭博的成分，存放金錢的地方也沒有絕對安全和危險的分野。一直到1920年代末期，股票才被認為是「審慎的投資」，在此之前則一直被視為是酒吧裡的賭博，其實當時的股價已經太高了，買股票較其他投資更像是在下賭注。


    1929年股市大崩盤後約二十年間，多數人都認為投資股票就是在賭博。一直到1960年代末期，這種印象才逐漸被沖淡，股票又被認可是一種投資標的，但此時股市又已經超漲過了頭，多數股票的風險都相當高。從歷史經驗來看，股票或被視為投資、或被斥為賭博，這兩種看法一直是交替循環出現，而且總是在時機不對的時候出現。股票往往都是在風險正高的時候，才被視為是審慎的投資標的。


    多年來，大公司的股票總是被視為「投資標的」，而小公司的股票則被視為是「投機標的」。但最近這種看法又改變了，即使是小公司的股票也算是投資標的，而期貨與選擇權交易才算是投機標的，這種評量標準其實一直在改變。


    當聽到有人說他的投資是「保守的投機」或「審慎的投機」時，我總會覺得好笑。這通常代表這位老兄希望自己是在投資，卻又擔心'
  merge: -1
  img_proc: true
- pgno: 95
  md: '他其實是在賭博。這種情況好比還沒有下定決心的情侶說「我們常見面」是一樣的。


    只有承認金錢都會包含風險的惱人事實，我們才能開始區別何謂投資、何謂賭博。要區分這兩者並不是看你從事何種活動（例如買債券、買股票或賭馬），而是要以進行這項活動所牽涉的技巧、投入程度和參與的企圖心來做區別。賭馬老手堅持自己的一套下注法則，靠賭馬取得一份相當穩定的長期報酬，對他來說這就像投資共同基金或奇異公司的股票一樣可靠。至於魯莽衝動的投資人成天追逐熱門股，搶進殺出，這種「投資」方式跟在跑馬場上隨便挑隻鬃毛最漂亮、或因為騎師穿著紫色騎士服就胡亂下注，其實並沒有兩樣。


    （事實上，對那些魯莽而衝動的股票投資人我倒是有個建議：忘了華爾街股市，拿著錢到賭城去玩吧！至少那兒環境怡人，就算輸錢你也可以說你玩得很愉快。如果是在股票上賠了錢，看著你的營業員在辦公室裡走來走去，可沒啥意思。


    而且，賭馬賭輸了，只要把彩票一扔便可了事，但股票或選擇權虧了錢，報稅時還得要向會計師重提慘事，光是處理這些事又要花上好幾天的時間。）


    對我來說，投資就是賭博，是一種能增加自己勝算的賭博。至於是在大西洋城賭，或者是在標準普爾500指數或債券上面賭，這倒不重要。事實上，股票市場最常讓我聯想起棧哈撲克牌（stud
    poker）遊戲。'
  merge: -1
  img_proc: true
- pgno: 96
  md: '對於那些知道該怎麼經營手中牌型的老手來說，光靠賭七張牌梭哈，也能獲得非常穩定的長期報酬。七張牌梭哈的規則是四張明牌、三張暗牌，你不但知道自己手上的七張牌，也能知道其他對手一半以上的牌。在發出第三或第四張牌時，輸贏大致已一目瞭然，股市也是如此，如果你知道到哪兒去找，許多資訊也都是公開的。針對企業提出某些基本問題，你就可以判斷哪家公司可能會成長繁殖、哪家不會，或是哪些公司還在未定之天。你當然沒辦法確定會發生什麼事情，但是一有新狀況出現，例如盈餘大幅跳升、賣掉不賺錢的事業單位，或者擴張進入新市場等等，就像是翻出一張新牌一樣。只要情況顯示你有勝算，那麼儘管握住手中的牌不放。


    只要你每個 月定期玩梭哈，很快就會知道在這場牌戲中有人的是常勝軍。這些人會仔細算計再算計，想辦法將自己的投資報酬提升到最大，他們會在情勢對自己有利時加碼下注，萬一運氣不佳、時不我予，則會馬上棄牌離場。而常常賭輸的人正好相反，緊抓著爛牌不放，一味寄望奇蹟出現，最後只能獨自舔舐挫敗的滋味。不管是賭梭哈或做股票，出現奇蹟的次數通常剛好是讓失敗者不會死心，然後一次又一次地輸下去。


    常勝軍有時也會面臨失敗，也許手上明明拿著三張A，卻偏偏碰上同花大順。這時他們會接受命運的安排，把希望放在下一局，並且相信自己的基本方法長期下來一定會有報酬。善於做股票的人偶爾也會碰上虧損、挫敗和意外事故，但是他們面對股市崩盤面不改色，不會就這樣被嚇出場。假如他們在仔細研究後，買進提供稅務諮詢、個人投資規畫與財務管理服務的HR布洛克公司（H
    & R Block）的股票，隨後政府意外地宣布了簡化稅則的方案（安啦！幾乎不可能），導致HR布洛克公司的業務大幅萎縮，這些認真的'
  merge: -1
  img_proc: true
- pgno: 97
  md: '投資人會接受事實，然後再努力尋找下一個目標。他們會知道，股票市場並不是完全依照純科學的路在走，也不像西洋棋，處於有利位置就一定會贏。如果我挑的十支股票中有七支是按照我的預期發展，我就很高興囉！而如果有六支正如我所料，那也要謝天謝地了！事實上，只要有十分之六的勝算，就能在華爾街創造傲人的佳績。


    如果能夠採用正確的玩法，長期下來，股市的風險就會降低，這就如同正確的玩槌哈風險會降低一樣。如果隨便亂買（例如隨意去搶高價），就算是買進必治妥或亨氏的股票，也可能造成重大的虧損，同時還會失去許多其他的好機會。有些投資人認為，只要投資績優股就可以不必做功課，不必去注意這些績優上市公司的狀況，結果卻一下子就賠掉一半的資金，而且可能套牢八年，還回不到原來的買進價位呢！1970年代初期，許多無知的熱錢追逐高價股票，結果很快就賠光了。這是因為必治妥和麥當勞股票的風險太高了嗎？不，是投資人的操作方式有問題。


    另一方面來說，如果你做了功課，就算是投資三哩島核電廠的母公司大眾公用事業公司（General Public Utilities），也還是比在錯誤時機買進老牌績優股家樂氏食品要來得「保守、穩當」。


    為了不讓我岳母的資金太過「冒險」，我曾經建議她買進休士頓工業公司（Houston Industries）的股票，這是一家非常「安全」的公司。不過它也太安全了，十幾年來都沒有太大的波動，因此我想拿她的錢來「賭」一下，所以買了「比較危險」的愛迪生電力公司'
  merge: -1
  img_proc: true
- pgno: 98
  md: '（Consolidated Edison），後來漲了6倍。對於那些能夠時時追蹤基本面的投資人來說，愛迪生電力的風險並不算太高。而且大贏家往往是來自這些所謂的高風險股票，不過風險主要是取決於投資人的類型，而不只是股票的類型。


    對於能夠接受不確定性的人來說，投資股票的最大好處在於，一旦判斷正確，就CV可以獲取非常巨大的報酬。紐約州水牛城（Buffalo）的強森圖表服務公司（Johnson
    Chart Service）針對共同基金的報酬率進行統計後指出，「風險越高」的基金，報酬也越大。如果在1963年投資1萬美元在一般的債券基金上，十五年後只會增值為3萬1,338美元；如果投資1萬美元在同時買股票及債券的平衡型基金上，則會增值為4萬4,343美元；如果是投資同時買成長型股票和收益型股票的股票基金，則會增值為5萬3,157美元；而如果是投資完全買股票的積極成長型基金，就VM可以增值為7萬6,556美元。


    非常明顯，股市的確值得放手一搏，只是你一定要知道該怎麼去「賭」。就像你現在手中已經握有股票，而未來還有一張又一張的新牌將在你面前攤開。不過，我現在又覺得，做股票不太像是玩七張牌的撲哈，而是七十張牌的撲哈。如果你一次擁有十支股票，那就是一次玩十局七十張牌的撲哈囉！'
