- pgno: 372
  md: '22日的財長會議來得重要，當時在所謂的七大工業國會議中，決定協調各國的財經政策，聯手讓美元匯價貶值。消息公布後，股市在六個月內上揚了38%，而且這個決定對個別公司更產生了巨大的影響，特別是那些因為美元貶值而得到好處的公司，股價在其後兩年內更上揚為兩倍或三倍。1987年10月19日當天我人在歐洲，贖罪日戰爭和七國財長會議時我也在歐洲，不過後面兩次是去拜訪上市公司，而不是在高爾夫球場上遭人痛宰。


    我比較關心整體趨勢和一些漸進的改變。在1960年代中期到末期的「集團化」時代，許多大型公司進行「多慘化」經營，然後分裂崩解，之後十五年內都無法恢復原貌。其中有許多公司就此一蹶不振，有些則成了轉機股，例如海灣與西方公司（Gulf
    and Western）、ITT和奧格登公司（Ogden）等。


    1970年代是藍籌績優股的美好時代，這些績優股被稱為「亮麗50」個股，或是「一次決定」（the one decision）的股票，意思是說你可以在買進之後，就這麼抱一輩子。但是在經歷了短暫的甜蜜期，股票享受了超漲之後，隨之而來的則是1973年到1974年的重挫（道瓊工業股價指數在1973年創下1,050點的高點後，一路下跌到1974年12月的578點），那些績優股的跌幅則約在50%到90%間。


    1982年年中到1983年年中的小型科技股熱潮，結果也帶來另一波跌勢（跌幅60%到98%）。當年這些小型科技股也被當成十拿九穩的好投資，雖然小可能就是美，但卻不見得能夠賺錢。


    從1966年到1988年間，日本股市一路攀升，日經道瓊指數（Nikkei Dow Jones）上漲17倍，同期間道瓊指數才上漲兩倍。到了1987年4'
  merge: -1
  img_proc: true
- pgno: 373
  md: '月，日本股市的總市值已經超越美國，而且之後的差距更形擴大。日本人對股票的理解大概有其特殊的一套，不過我卻一直搞不懂，每次我研究日本股市，都覺得它已經過度超漲，可是它就這麼一直漲上去。


    現在股市的交易時間延長，讓你更難有時間來研究基本面，幾乎成天都要盯著盤面看。在1952年以前、大約八十年的時間裡，股市都是在早上十點開盤，下午三點收盤，等到晚報出刊後，投資人就可以在回家的路上閱讀股市報導；1952年起週六不開市，但是每天的收盤時間延後半個小時，到三點半收盤；1985年起開盤時間提前到早上九點半；現在的收盤時間則在下午四點。就我個人來說，其實交易時間短一點比較好，這樣我們才有更多的時間來研究上市公司，或是去逛逛博物館也行，這總比緊盯著股價漲跌來得有意義。


    法人機構則是從1960年代開始冒出頭，到了1980年代已經成為主導股市的大戶了。


    大型證券商的組織型態，則從過去投入個人財富的合夥型態，轉變成個人債務責任有限的公司型態。理論上來說，這樣的轉變應該可以強化證券商的體質，因為它們可以透過公開發行股票來籌集資金，不過我個人倒是覺得這樣的轉變是弊多於利。


    至於店頭市場交易的興起，則把數千種的次級股票納入更可信賴、更有效率的電腦化市場交易中，這些股票過去是用不夠透明的全額交割方式進行買賣，你永遠也搞不清楚你的交易價格是否合理。


    現在，全美國的電視成天都是即時金融新聞，二十年前可不是這'
  merge: -1
  img_proc: true
- pgno: 374
  md: '樣。1970年11月20日開播的《華爾街一週》（Wall Street Week）節目，由魯基瑟（Louis Rukeyser）主持，證實了金融新聞也頗受觀眾歡迎。這個節目的成功，刺激了其他電視台擴大報導金融新聞，進而催生了專門播報財經新聞的「金融新聞電視網」（Financial
    News Network），並且把電視螢光幕上的股價跑馬燈，直接送到數以百萬計的美國家庭中。散戶投資人現在可以每天看到自己持有股票的表現，而且取得資訊的速度大概只比專業投資人慢上十五分鐘吧。


    許多享有租稅優惠的產業起起落落，包括：農莊土地、油井、鑽油機具、航海船隻、低租金的住房機構、墓地墳場、電影製片、購物中心、運動隊伍、電腦出租業，以及其他幾乎任何可以販售、融資或出租的東西。


    專門進行併購和其他從事收購的集團興起後，開始能夠從事高達200億美元的收購案。包括美國本土的收購集團（KKR公司〔Kohlberg, Kravis, and
    Roberts〕、凱爾索公司〔Kelso〕、康尼斯頓合夥〔Coniston Partners〕、奧迪賽合夥〔Odyssey Partners〕，以及威斯雷公司〔Wesray〕），歐洲的企業和併購集團（韓森信託〔Hanson
    Trust〕、皇家化學工業〔Imperial Chemical〕、伊萊克斯集團〔Electrolux〕、聯合利華、雀巢公司等），以及一些資金雄厚的個別企業狙擊手（莫達克〔David
    Murdock〕、川普、海曼〔Sam Hyman〕、比爾基利安〔Paul Bilzerian〕、貝斯兄弟、萊希曼家族、哈夫特家族、梅鐸〔Rupert Murdoch〕、皮肯斯、埃肯、愛德曼〔Asher
    Edelman〕等），他們無不睜大眼睛守候獵物，不管是大公司或小企業，只要時機成熟，他們就會一把抓住。'
  merge: -1
  img_proc: true
- pgno: 375
  md: '隨著融資收購（leveraged buyout, LBO）大行其道，整家公司或某個事業部門都可能被私人收購。收購者可能是公司外面的人，也可能是公司現有的管理階層，他們透過銀行借貸或垃圾債券集資來進行收購。


    垃圾債券是由德布蘭公司（Drexel Burnham Lambert）所發明，結果大受市場歡迎，現在到處都看得到垃圾債券。


    期貨和選擇權交易的出現，特別是股價指數的交易，讓所謂的「程式交易員」（program trader）可以在正常的股票市場中大量買進或賣出多種股票，然後在所謂的期貨市場中建立相反的部位套利，他們丟進數十億美元，只為了賺取少許的差價利潤。


    在這個喧囂吵嚷的時代裡，有一家瀕臨破產、專門銷售廉價商品的克雷斯格公司（SS Kresge），發展出凱瑪百貨的經營模式，結果股價在十年內上漲了40倍。馬斯可公司發明了單把手水龍頭，股價成長了1,000倍，成為四十年來最偉大的一支股票，但是有誰想得到這是一家生產水龍頭的公司呢？經營成功的快速成長股成了十疊安打，但是口耳相傳的熱門股卻倒閉了，至於那些投資美國電話電報公司，因而收到分拆後的「小貝爾」公司股票的投資人，在四年內都賺了一倍。


    如果你問我，股票市場中最重要的發展事件是哪一樁，我想美國電話電報公司的分裂事件應該排名第一（總共影響了296萬名股東的權益），而1987年10月的大崩盤還排不上前三名呢。


    最近我又聽說了一些事情：'
  merge: -1
  img_proc: true
- pgno: 376
  md: '我一直聽到有人說，在目前充滿危險的環境下，小額投資人毫無機會可言，應該退出市場自保。「你會在發生地震時蓋房子嗎？」一位謹慎的投資顧問這麼問道。但是地震並沒有在你的房子底下發生，而是發生在房地產業的辦公室下面。


    然而，小額投資人的確有能力可以掌握各種市場，只要他們能夠找到好的商品就可以了。真正需要擔心的，反倒是那些專業投資人。畢竟在上次10月大崩盤時，真正虧損的人就只有那些認賠出場者，至於長期投資人反而沒有受到影響。那些認賠出場者包括保證金交易者、風險套利者、選擇權玩家，以及投資組合經理人，當他們的電腦顯現「賣出」的訊號時，他們就馬上認賠出場。這就像是貓看到鏡子裡的自己被嚇了一跳一樣，那些賣出者也是自己嚇自己。


    我也聽到有些人說，這個專業投資管理的時代已經在股票市場裡引進更先進、更審慎，而且更明智的做法。市場上有五萬個專業的選股者在賣力演出，如同五萬個法國人一樣，他們不可能會出錯。


    從我的角度來看，我則會說，這五萬個專業選股者通常是正確的，但這只限於股票常態上漲過程中的最後20%。華爾街只注意到這最後的20%，努力研究、大肆喧騰、瘋狂搶進，而且一邊還緊盯著緊急逃生出口。他們所有的想法就是，趕快撈一票，然後奪門而出。


    小額投資人大可不必蹚這個渾水，當大家擠在出口附近你爭我奪時，各位就可以在入口處好整以暇地挑選股票，等到大家湧向入口處時，你們就從出口大大方方地走出去。以下是一份在1987年年中，大型法人機構最愛的股票名單，但在十個月後，這些股票卻全'
  merge: -1
  img_proc: true
- pgno: 377
  md: '部被賤價拋售，根本不管它們的盈餘成長、令人興奮的前景展望，和大筆的現金流量。其實這些公司的情況一點也沒有改變，但大型法人機構卻已經失去興趣，這些公司包括：自動資料處理公司、可口可樂、唐金甜甜圈、奇異、真紐因零件公司、菲利浦．摩里斯、普萊美利加公司（Primerica）、連鎖藥局瑞德公司（Rite
    Aid）、施貴寶藥廠（Squibb）及廢棄物管理公司等等。


    我還聽到有人說，每天成交兩億股比起成交一億股是一項重大的進步，因為市場流動性較高會有很多好處。


    這的確是有好處，不過你可千萬不要淹沒在成交量裡，但事實上我們卻都是如此。在去年一年裡，紐約證券交易所的上市股票中有87%至少換手一次。在1960年代初期，每天的常態成交量大約是600萬股到700萬股，股票的週轉率則是一年12%；在1970年代，每天的常態成交量是4,000萬股到6,000萬股，到了1980年代，則變成1億股到1.2億股。而現在如果股市的當日成交量低於1.5億股，就會有人開始擔心是不是哪裡出了問題。我得承認，在這些成交量當中我也有所貢獻，因為每天我都在買進賣出股票，但是真正讓我賺到最多錢的股票，卻通常是那些我持有三年甚至四年的股票。


    指數型基金大受歡迎，更進一步加速推升週轉率和成交量，這種類型的基金根本不管個別公司的情況如何，只是幾十億美元地買進、賣出許多股票。另外還有「轉換型基金」（switch
    fund），投資人可以隨時轉進股票帳戶或現金帳戶，不會有時間延遲，也無需額外支付費用。


