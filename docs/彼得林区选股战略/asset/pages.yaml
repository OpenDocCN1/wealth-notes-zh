- pgno: 161
  md: '要高！當時買進股票的投資人，等於是完全免費就取得2,700英畝的岱蒙特森林和蒙特瑞半島，還有三百年樹齡的參天古木，以及兩座高爾夫球場。


    圓石灘是一支店頭交易股票，而紐霍土地農場公司（Newhall Land and Farming）則是不折不扣的紐約證交所上市公司，大家可是眼睜睜看著它上漲了二十幾倍呢。紐霍公司有兩項最大的資產：一是舊金山灣區的科維爾農場（Cowell
    Ranch）；第二項是更大、更值錢的紐霍農場（Newhall Ranch），距離洛杉磯市區約三十哩。紐霍農場有一個已經完成規畫的社區，包括了一個遊樂園、一幢工業辦公大樓，而且正在興建購物中心。


    成千上萬的加州人每天開車上班，都會經過紐霍農場。還有保險業者、不動產抵押貸款業者以及房地產業者，只要和紐霍公司有過各種業務往來，都會知道紐霍公司擁有什麼樣的資產，而且也不會不知道加州的房地產價格正節節上揚。此外，在紐霍農場附近擁有房子的無數住戶，他們更是比華爾街的股票分析師早好幾年就親身感受到房地產價格大漲。在這段期間，有多少人想過要研究這支在1970年代漲為20倍、1980年以來又再漲了四倍的股票呢？要是我住在加州，一定不會錯過這支股票！希望，希望不會錯過。


    我曾經拜訪過佛羅里達州一家叫阿利可（Alico）的畜牧公司，位在沼澤地（Everglades）旁一個叫拉貝爾（La Belle）的小鎮上，舉目所見盡是松樹叢和棕櫚樹，有幾隻牛在那兒吃草，大約二十名員工四處假裝忙著，不過不太成功。聽起來不太刺激吧！當時阿利可的股價是每股20美元，不過要是你曉得在十年後，光是阿利可的土地資產每股就值超過200美元，你大概就不會覺得這家公司沒啥意'
