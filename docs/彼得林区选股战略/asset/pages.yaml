  md: '把史克製藥的股票列入買進名單中，因為這支股票是在一年之後才開始上漲。在泰胃美剛研發完成的測試階段，1974年到1976年間，史克製藥的股價就從每股4美元漲到7美元；到了1977年政府核准泰胃美上市時，股價是每股11美元，之後即一路平步青雲漲到72美元（見圖6-1）。*


    萬一你錯過了泰胃美，還是有第二次機會：葛蘭素（Glaxo）藥廠的潰瘍新藥善胃得（Zantac）。善胃得在1980年代初期進行測試，1983年核准上市，跟泰胃美一樣，善胃得也廣受各方好評，所以讓葛蘭素藥廠荷包賺得飽飽。1983年中，葛蘭素的股價是每股7.5美元，到1987年漲到30美元。


    那麼，那些開出泰胃美或善胃得處方的醫生們，是否買了史克製藥或葛蘭素藥廠的股票呢？我猜大概不多吧，那些醫生可能正熱中於石油類股呢！也許他們聽到傳言說，加州聯合石油（Union
    Oil of California）可能會被收購；在此同時，加州聯合石油的經理們卻搶著買進製藥業的熱門股票，例如ASC公司（American Surgery
    Centers）。1982年時，ASC公司的股價是每股18.5美元，後來跌到只剩5美分。


    總之，如果你針對醫師們做個調查，就會發現，只有極少數的醫生會去投資醫藥類股，卻有相當多的人執迷於石油類股。如果去調查


