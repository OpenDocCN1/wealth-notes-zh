    我要特別感謝一位傑出的人士，他是我們家四十年的朋友：波士頓學院的約翰·科林斯神父（Father John J. Collins, S.J.）。我就讀波士頓學院時，他是金融系的系主任，教導我許多有用的知識，後來我三個小孩的受洗儀式都由他主持。我非常慶幸我能夠和數百位波士頓學院的學生，從他那儿持續得到鼓勵和支持。


    如果沒有Malaspina Communications公司的瑪拉絲賓娜（Peggy Malaspina）的熱心幫忙，這本書絕對無法完成。同時我也要謝謝Jane
    Lajoie和作家Derrick Niederman，他們兩人耗費幾個月的心力，查核本書所提到的種種數據和例證。還要向富達研究圖書館的'
