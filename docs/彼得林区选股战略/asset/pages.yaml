  md: '接下來會發生什麼事情就不難想像了。溫徹斯特磁碟機公司上一季的業績特別糟，再加上磁碟機市場出乎意料之外的競爭激烈，於是溫徹斯特的股價從每股10美元跌到5美元。對此，我們的哈利搞不清楚是怎麼回事，只好決定先殺出再說，他還很慶幸只賠了1,500美元，只此珍妮佛五季的秋裝多一點！


    在此同時，哈利卻不知道那家讓太太韓莉印象深刻的有限服飾公司的股價正在穩步上揚，從1979年12月每股低於50美分（經過分割調整），到1983年已經上漲到9美元，此時已經是支二十疊安打了，但即便哈利是在9美元時才進場（不過隨後碰上一次回檔，股價跌到5美元），但最後飆升到52.875美元時，他的投資還是增值了超過五倍。如果從一開始就投資，這個可是一支超過100疊安打的超級強棒啊！要是哈利早點投資1萬美元，光靠這支股票就可以成為百萬富翁囉。


    更實際點來說，如果韓莉在買了275美元的秋裝時，同時也買進275美元的有限服飾公司股票，這個不起眼的投資所賺得的錢，也夠付她女兒一學期的學費。


    我們這位理財大摃櫃在殺出溫徹斯特的股票後，原本還​​有足夠的時間搶進有限服飾的股票，可惜他一直沒有把太太的話聽進去。在那個時候，全美總共有四百家有限服飾連鎖店，大部分都生意興隆，但是哈利太忙了，根本沒注意到，他正忙著跟隨阿里不達的分析師，搶進莫名其妙的股票。


