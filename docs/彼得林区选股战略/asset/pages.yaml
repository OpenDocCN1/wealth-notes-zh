  md: '倫基金經理人職務那年，還是出現了空頭市場。1987年的大跌嚇壞了許多人（也難怪，兩天跌幅達35%），不過對我而言，反倒是1990年的下跌比較恐怖。為什麼呢？因為在1987年時，美國經濟還是活力十足、銀行沒有呆帳問題，基本面因素都相當好；但是在1990年時，美國經濟已陷入衰退，主要銀行瀕臨險境，而且當時還準備對伊拉克開戰。幸好戰爭很快就打贏了、經濟也逐漸復甦，銀行的問題解決，股價立即展開現代史上最大的多頭行情。後來我們又看到1996年春季、1997年和1998年夏季，以及1999年秋季，都出現下跌10%的回檔行情。1998年8月，標準普爾500指數還曾經下跌14.5%，是二次世界大戰結束以來第二大單月跌幅。九個月後，跌勢停止、反彈回升，標準普爾500指數又上揚超過50%。


    我說這些往事要幹什麼呢？如果我們可以在股價回檔前就空手離場，那一定很棒，可惜誰也不知道該如何抓準時機。況且，就算你能夠即時離場，躲過一場大跌，又該如何確保你能夠即時搶進，抓住下一波的漲勢呢？舉個例子來說明，各位就會懂了：如果你在1994年7月1日投資10萬美元買進股票，然後擺個五年，就會增值為34萬1,722美元。但是在這五年中，就算你只缺席了一個月的話，即股價漲幅最大的那三十天，那麼你的投資只會增值為15萬3,792美元。因此，緊抱持股，報酬就加倍了。


    有一位非常成功的投資人曾經說：「空頭言論聽起來總是比較聰明。」你的確可以從每份早報或每晚的夜間新聞中，找到賣出股票的理由。當年我這本書登上銷售排行榜時，巴托拉（Ravi
    Batra）的《浩劫1990》（The Great Depression of 1990）也正大受歡迎。遠從1982年開始，就不斷有人宣稱這個多頭行情快要完蛋了，理由如下：日本經濟景氣低迷、美國對中國及全世界的貿易赤字、1994'
