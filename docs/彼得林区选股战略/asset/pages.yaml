- pgno: 50
  md: '度飆升到每股65美元，後來卻跌到只剩1.75美元！最後公司則是在1988年宣告破產。


    找到有潛力的目標只是第一步，接下來就要做調查、研究。下工夫做研究，你才能分辨出玩具反斗城是好股票、寇勒可公司是爛股票；蘋果電腦是好股票、泰萊威迪科技（Televideo）是爛股票；山麓航空（Piedmont
    Airlines）是好股票、人民快遞（People Express）是爛股票！現在回想起人民快遞公司，要是我當年再加把勁做研究，也許就不會買那支股票了吧。


    儘管出了這麼多狀況，在我管理富達麥哲倫基金的十二年間，每單位淨值還是增加超過20倍，其中一部分得要感謝我找到的那些不為人知、或是交投並不熱絡的冷門股票，而那些都是我親自認真做過調查研究的。我相信，任何投資人也都可以靠這套方法來獲利，要勝過那些專家（聰明錢）一點都不難，而且我剛剛也說了，聰明錢並非總是聰明的。


    本書共分成三篇。


    第一篇：準備投資（第1章至第5章），討論投資人該如何評估自己身為選股者的角色；如何評估競爭對手（投資組合經理人、法人投資機構，以及其他華爾街股市專家）；如何判斷股票的風險是否比債券高；如何檢視個人的財務需求；以及如何培養出一套成功的選股模式。'
