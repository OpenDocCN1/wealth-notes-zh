  md: '# 小心口耳相傳的股票


    我常常會接到電話，向我推薦麥哲倫基金應該買進某些穩健公司的股票，這些打電話的人通常會壓低聲音，好像在透露某個機密：「我告訴你，這股票很棒！雖然它股本太小，不適合你的基金，不過你可以自己買呀！真的很棒，一定可以賺很多錢！」


    這些口耳相傳的明牌股都會有個偉大的遠景，而且偉大到足以令人目瞪口呆。這些消息通常傳到你耳中時，也傳到我耳中了，比方說：一家公司賣的某種木瓜萃取物可以治療骨刺疼痛（史密斯研究室〔Smith
    Labs〕）；神通廣大的叢林療法；高科技產品；從牛身上萃取下來的單細胞繁殖抗體（生物反應公司〔Bioresponse〕）；各種神奇的食品添加物；根本違反物理原則的能源突破等等。這些大家口耳相傳的公司，大概都是即將能解決近期全國最關注的問題，例如能源短缺、毒品氾濫、愛滋病等等，但是其解決辦法不是匪夷所思、充滿幻想，就是複雜得讓人摸不著頭緒。


