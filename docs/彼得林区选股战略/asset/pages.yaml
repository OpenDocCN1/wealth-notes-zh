  md: '價格買進福特汽車的股票，事實上只花了21.7美元（38減16.3），分析師預估福特的汽車業務平均每股可以賺進7美元，以38美元的股價來計算，本益比是5.4倍，而如果用21.7美元來計算，就只剩下3.1倍。


    不管是不是景氣循環股，3.1倍的本益比都是一個迷人的數字。如果福特汽車根本是一家爛公司，或者消費者不喜歡它的新車款，或許我就不會對這個數字感到印象深刻。但是福特汽車是一家很棒的公司，而且大家也喜歡它們新近推出的汽車和卡車車款。


    再加上現金項目的支持，因此讓我有信心緊抱持股不放，後來福特汽車果然又繼續上漲超過40%。


    同時我也知道，福特汽車旗下的金融服務集團（福特信貸〔Ford Credit〕、全美第一〔First Nationwide〕，以及美國租賃〔U. S. Leasing〕等等）在1987年每股就可以賺到1.66美元（你可以從年報的第五頁，大家都看得懂的那個部分找到），其中光是福特信貸就為每股盈餘貢獻了1.33美元，而且還是「連續第十三個年度的盈餘成長」呢！


    金融業的本益比一般來說大概是10倍左右，因此可以假設福特汽車金融事業部門的本益比也是10倍，據此就可以估計這些金融事業子公司的價值是每股盈餘1.66美元乘以10倍，或是每股16.6美元。


    所以在福特汽車38美元的股價中，就包括了16.3美元的現金淨值，以及16.6美元的金融子公司價值，如果扣除這兩項，那麼你只要花5.1美元就買到福特規模龐大的汽車事業，而且這個部分預期明年'
  merge: -1
  img_proc: true
- pgno: 268
  md: '每股還可以賺到7美元，這樣的股票怎麼會有風險呢？雖然股價自1982年以來已經上漲了將近10倍，但是每股5.1美元的價格簡直就像是偷來的一樣。


    波音公司（Boeing）也是擁有很多現金的公司。在1987年初，波音的股價才40美元出頭，但是平均每股現金淨值就高達27美元，等於是用15美元就能買到這家公司。1988年初，我先小量買進波音的股票，後來又陸續敲進，並成為主要持股之一，部分是因為它手上的現金，部分則是因為波音還有很多商用客機的訂單正等著交機呢。


    當然，現金資產不是萬靈丹，也不是所有公司都擁有大筆現金，事實上，擔心現金不足的情況反而比較常見。舒倫柏格擁有不少現金，不過每股平均分配的部分就沒啥看頭了；必治妥擁有16億美元現金，長期負債只有2億美元，這個比例相當好，但是該公司流通在外股數有2.8億股，14億美元現金淨值（扣除長期負債後）平均分配，每股只能分到5美元。由於必治妥的股價超過40美元，每股5美元的現金淨值效果就不大，不過，如果股價跌到15美元，情況就不一樣了。


    不論如何，我還是建議各位，研究股票時務必要檢視現金部位（以及相關事業的價值），說不定你就會碰上像福特汽車這類的好股票。


    說到這裡，我們不妨再問問，福特汽車將會如何運用這些現金？公司裡累積了那麼多現金，外界對其運用方式的猜測，可能就會壓抑股價的上漲空間。福特已經提高股利，並且積極地回購自家公司股票，不過現金部位還是繼續大幅攀升。有些投資人擔心福特汽車會'
  merge: -1
  img_proc: true
- pgno: 269
  md: '把這些錢拿來隨便投資，不過到目前為止，福特汽車在收購方面還是相當謹慎。


    福特汽車已經投資一家信貸公司和一家儲貸機構，同時也透過合夥方式，控制赫茲租車公司。在此之前，福特曾經低價競標休斯航空（Hughes Aerospace）的股權，不過並未成功。如果福特想收購TRW公司的話，這倒是相當好的選擇，藉此可以產生不錯的綜效。TRW公司是世界級的汽車零件大廠，在電子產品市場也占有一席之地，而且TRW公司有可能成為汽車安全氣囊的主要供應商。不過市場上也有傳言指出，福特想要收購美林證券或洛克希德公司，如果這是真的，那福特只怕也會被納入「多慘化」經營的公司名單中。


    # 負債項目


    公司欠了多少錢？擁有多少價值？這就是負債相對於股東權益。正如同銀行授信人員想要知道你的資產和負債狀況，好藉此判定你的信用風險是否良好。


    一般企業的資產負債表都分成左右兩邊，左邊是資產（存貨、應收帳款、廠房和機器設備等等），右邊則代表取得資產的資金來源。要判定企業財務狀況的好壞，最簡單的辦法就是針對資產負債表右邊的股東權益和負債進行比較。


    要計算負債對股東權益比（debt-to-equity ratio）很容易。以1987年福特汽車年報中的資產負債表為例，你可以看到股東權益總額是184億9,200萬美元，而在上面幾行，你可以找到長期負債是17億美'
  merge: -1
  img_proc: true
- pgno: 270
  md: '元（當然還有短期負債，不過短期負債數目不大，我在前面曾經說過這個部分可以忽略；如果現金——請看第二行——比短期負債高的話，就不必擔心這個問題）。


    在一般公司的資產負債表中，股東權益大概占75%，負債占25%。福特汽車的負債對股東權益比更是驚人，高達180億美元對17億美元，換句話說，股東權益占91%，負債還不到10%，顯示福特汽車的資產負債表非常穩健。如果股東權益占99%，負債只有1%，那可就更棒了；相反的，如果負債高達80%，股東權益只有20%，這種公司就很糟糕。


    對於轉機股和正面臨困境的公司，我會特別注意負債項目。相對其他項目而言，負債是決定公司能否度過危機或是就此關門倒閉的關鍵因素，那些擁有高額負債的新創公司，處境通常十分危險。


    我曾經留意過兩家出問題的科技股：GCA公司和應用材料公司（Applied Materials），這兩家公司都是生產電子業所需要的資本設備，亦即製造電腦晶片的機器。這種產業也是屬於最好能避開的高科技領域，果然這兩家公司後來全都中箭落馬。1985年底，GCA的股價從每股20美元跌到12美元；應用材料更慘，從16美元跌到8美元。


    但之間的差異在於，當GCA公司出現問題時，其負債規模高達1億1,400萬美元，而且幾乎全部都是銀行貸款，針對這點我稍後會再做說明；而其現金只有300萬美元，主要資產則是7,300萬美元的存貨。但是對電子業來說，市場變化速度非常快，今年價值7,300萬美元的存貨，明年或許只剩下2,000萬美元，誰知這些存貨在跳樓'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# 大拍賣後能夠換得多少錢？


    相反的，應用材料只有1,700萬美元的負債，並有3,600萬美元的現金。


    當電子設備市場的景氣開始回升後，應用材料的股價也馬上跟著翻身，從每股8美元漲為36美元，但是GCA公司的狀況可就沒有這麼好了。結果是一家公司翻身漲為四倍，另一家則宣告破產，並以每股大約10美分的價格被收購，其關鍵就在於負債規模的大小。


    企業面臨危機時，決定生死的關鍵因素就在於負債的類型，以及負債規模的大小。有關負債的類型則包括銀行債務和資金債務（funded debt）兩種。


    銀行債務（這是最糟糕的一種類型，GCA公司欠的債務正是這種）到期必須馬上償還。這種債務未必都來自銀行，也可能是以商業本票的形式，向其他公司調借的短期資金。最重要的是，這種債務很快就會到期，有時還會被要求提前償還，換句話說，一旦債權人發現情況不對，可能會馬上逼你還錢，而如果沒錢償還，那smith好宣告破產，此時債權人會把公司的資產剝光，而股東則是一無所有。


    至於資金債務（從股東的角度來看，這是最好的一種類型）則是不論情況如何艱困，只要公司還能正常付息，就不會有人要求你提前償還本金，而且本金可能要十五年、二十年，甚至三十年才會到期。資金債務的形式通常是以公司債為主，到期年限很長。信用評等機構則會根據公司財務狀況的良窳，來評定公司債的信用等級，'
  merge: -1
  img_proc: true
- pgno: 272
  md: '但是不管評定出來的等級有多爛，債券持有人也不能像銀行一樣硬逼你馬上還錢，有時公司債甚至還會出現延期支付利息的情況。不過資金債務會讓公司有充裕的時間，可以用來解決財務上的問題（在一般的公司年報中，會有一項附註說明長期負債的細目、已付利息，和債務到期日等資料）。


    當我評估類似克萊斯勒這類的轉機股時，都會特別注意它的負債結構和負債金額。大家都知道克萊斯勒的債務有問題，在那個著名的紓困專案中，政府提供14億美元的貸款給克萊斯勒，並且換得一批股票選擇權，後來政府從這筆交易中賺了不少錢。但是在克萊斯勒情況正當危急的時刻，誰也不曉得會有這麼一天，但如果你曾經研究過它的負債結構，就會發現克萊斯勒其實還有轉圜餘地，不會一下子就被逼入絕境。


    同時，我也看到克萊斯勒有10億美元現金，而且最近它以3億3,600萬美元的代價，把坦克車部門賣給通用動力公司。當然，在情況危急時脫售求現的確是賠了一些錢，可是有了這些現金，再加上政府的紓困貸款，你就可以知道克萊斯勒不會在一、兩年內被銀行逼入絕境。


    因此，如果你和我一樣，相信汽車工業總有一天會復甦，而且看到克萊斯勒的確已經大幅改善，同時成為汽車業界低成本的製造業者，那麼你就會對克萊斯勒未來的生存機會抱持一點信心。事實上，它的情况並不像報上所說的那麼危險。


    美光科技（Micron Technology）是另一家依靠債務結構才撐過難關的公司，而富達公司正是主要的救援者。這家好公司來自於愛達荷'
  merge: -1
  img_proc: true
- pgno: 273
  md: '州，不過當它找上富達時，卻已經奄奄一息了。由於電腦晶片市場出現衰退，加上日本業者在美國「傾銷」DRAM，使得美光陷入困境。面對日本的傾銷，美光宣稱日本業者生產晶片的成本不可能比它低，因此指控日本業者必定是流血傾銷，主要目的是為了擊垮所有競爭對手。後來，美光打贏了這場官司。


    當時除了德州工業公司（Texas Industries）和美光之外，美國其他的重要晶片業者都已經退出市場。而美光先前陸續向銀行借來的負債，則幾乎成了致命傷，並讓股價從40美元跌到4美元。它的最後希望就是出售大量的可轉換公司債（這種債券可以依照債權人的意願，轉換成公司股票），由於可轉換公司債的本金要在數年後才到期，如此一來，美光就可以籌措到足夠的現金，用來償還銀行的債務，渡過短期的難關。


    富達公司就在當時買進許多美光的可轉換公司債，等到晶片產業景氣回升，美光又開始賺錢，股價也從4美元漲到24美元，著實讓富達公司大賺了一筆。


    # 股利


    > 「你知道唯一能讓我高興的事情是什麼嗎？就是看到我的股利入帳！」


    ——洛克菲勒，1901年


    如果投資人希望平常有一筆額外的收入，當然會比較喜歡能夠配發股利的股票。這點並沒有什麼不對，如果有人寄張支票給你，你當然會很高興，甚至連大富翁洛克菲勒也是如此。不過我真正在意的'
  merge: -1
  img_proc: true
- pgno: 274
  md: '問題，則是發不發放股利對公司的價值和股價在長期間會有何影響。


    公司負責人和股東在股利上的基本矛盾，就像父母和子女針對信託基金的衝突一樣，子女總是希望早點分財產，而父母則是希望盡量控制那筆錢，好幫子女謀求最大利益。


    支持公司發放股利的一個強而有力的理由是，不發放股利的公司往往會亂花錢，進行一連串愚蠢的「多慘化」經營。這種例子我看得太多了，多到足以讓我相信潘佐公司（Pennzoil）的李特克（Hugh
    Liedtke）對公司財務所持的「膀胱」理論：「金庫裡累積的現金越多，一瀉如注的壓力就越大。」李特克在業界因兩件事而聞名，一是成立潘佐這家小型石油公司，並且發展為強而有力的競爭者；二是潘佐公司在法院對上德士古（Texaco）這家大公司，就像大衛對抗巨人歌利亞（Goliath）一樣，大家都認為潘佐輸定了，結果潘佐卻成功地索賠了30億美元。


    （前面談到1960年代末期的收購風潮，可以稱為是「膀胱年代」。雖然現在還有一些公司經理人亂撒現金、收購只會帶來厄運的企業，不過已經比二十年前少很多了。）


    另一個支持公司發放股利的理由，則是發放股利會比不發放股利對股價更具支撐。在1987年的大跌行情中，高股利的股票的確比不發放股利的股票更具抗跌性，而且整體跌幅也比大盤少一半，所以我會在投資組合中納入幾支穩定成長股，甚至是緩慢成長股，就是基於這個原因。如果股價是20美元，並且發放2美元的股利，那麼殖利率就是10%，要是股價跌了一半變成10美元，殖利率更高達'
  merge: -1
  img_proc: true
- pgno: 275
  md: '20%。如果投資人認為高殖利率具有支撐效果，他們就會買進高殖利率的股票，並且真的對股價產生支撐。這就是為什麼投資人在面對危機時，總會湧向長期發放股利或提高股利的績優股。


    此外，較小型的公司卻因為不發放股利，所以成長才較為快速，它們就是把全部的盈餘投入用來追求業務的擴張。公司發行股票的首要目的，就是為了籌集資金進行擴張，以避免增加銀行貸款所帶來的負擔。如果要我選擇，在積極進取的成長股和腳步蹣跚、只知道發放股利的老公司間，我當然是選擇前者。


    電力 Damien 電話公用事業是發放股利的兩類主要公司。這類公司在低度成長時期不必興建新的廠房或是擴充新的設備，因此可以累積許多現金；一旦步入快速成長階段，其發放的股利則能吸引大量的資本，藉以滿足擴充新廠所需。


    愛迪生電力公司發現它可以向加拿大購買多餘的電力，因此就不必浪費錢來購買昂貴的發電機組，並且耗費許多成本爭取政府的核准和興建新的電廠。由於近幾年來愛迪生電力在這方面並沒有大筆的成本支出，所以累積了幾十億美元的現金，並且用來回購自家公司的股票，同時還持續提高股利。


    大眾公用事業公司已經從三哩島核能災難中恢復過來，並且處於與愛迪生電力公司十年前相同的發展階段（見圖13-1），同樣也是一面回購自家公司的股票，一面提高股利。'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# 發不發放股利有所謂


    如果你買股票是為了獲取股利，那就要注意公司在不景氣或狀況欠佳時，是否也能夠照樣發放股利；是否能找到類似北星艦隊公司（Fleet-Norstar，以前稱為國民工業銀行〔Industrial
    National Bank〕）一樣，自1791年以來即不曾停止發放股利的公司。


    # 圖13-1 愛迪生電力公司（ED）


    ![](img/5356ce2207e28b24f0354d7fd774355d_276_0.png)


    +   1. 因現代會計的神奇手段，愛迪生電力公司即使在狀況欠佳時，盈餘看起來還是很好，但是其中很多並不是現金。


    +   2. 愛迪生電力公司從破產邊緣恢復過來之後，累積了幾十億美元現金，而且持續配發股利。'
  merge: -1
  img_proc: true
- pgno: 277
  md: '如果你碰上的是不發放股利的緩慢成長股，那就麻煩了，這種乏善可陳的企業最好不要冒險嘗試。


    二、三十年來持續提高股利的公司，應該是你的最佳投資選擇。像家樂氏和保力來公司的股利就不曾縮水，而且更不曾停止發放。這種經歷過三次戰爭、八次經濟衰退，還能始終如一的公司，正是你以獲取股利為目的進行投資時的首選。至於像南馬克（Southmark）這種負債累累的公司，在股利發放方面就不可能像債務很少的必治妥公司這麼堅定（事實上，南馬克公司近期就因為房地產方面的損失，導致股價從11美元跌到3美元，公司也馬上宣布停止發放股利）。景氣循環股在發放股利方面也不見得就值得信賴，福特汽車在1982年曾經停止發放股利，股價也跌到4美元以下（經過分割調整），創下二十五年來的最低紀錄。但現在只要福特汽車不把手上的現金虧光，就不必擔心它會停止發放股利了。


    # 帳面價值


    最近大家都很注意帳面價值（book value），這或許是因為該項數字相當常見吧，只要翻開報章雜誌，幾乎到處都看得到。而備受投資人歡迎的電腦程式，更可以馬上告訴你目前有多少支股票的價格是低於帳面價值。投資理論認為，如果帳面價值是20美元，而股價只有10美元，則投資這類股票等於是以一半的價格買進。


    問題是，財務報表上所列的帳面價值和企業的真正價值其實關係不大，而且常常大幅高估或低估。在賓州中央鐵路公司破產時，其每股帳面價值還高達60美元呢！'
  merge: -1
  img_proc: true
- pgno: 278
  md: '1976年底，亞倫伍德鋼鐵公司（Alan Wood Steel）公告的帳面價值總共為3,200萬美元，每股帳面價值40美元，儘管如此，它在六個月後還是宣告破產。問題在於其新煉鋼設備的帳面價值就高達3,000萬美元，但因為設計不良，根本無法使用。公司為了償付部分貸款，以大約500萬美元的價格把鋼板廠賣給魯肯斯公司（Lukens
    Corp.），至於其他部分，大概只能當廢鐵賣了。


    紡織公司可能有一整個倉庫沒人要的紡織品，帳面上每一碼還是價值4美元，事實上這些東西可能連10美分都沒人要。因此，這兒還有一個不成文的法則：越是接近完成品的產品，轉售出去的價值就越難以估算。你會知道棉花值多少錢，但有誰曉得一件橘色棉布襯衫值多少錢？你可以知道一根金屬條塊的價值，但做成直立燈架後又該值多少錢呢？


    幾年前，最靈光的投資人巴菲特決定賣掉紐貝德福紡織公司，這家公司是他最早期收購的企業之一。當時一些主管認為公司的織布機應該可以賣個好價錢，因為帳面價值還高達86萬6,000美元，但是在公開競標的過程中，數年前每台以5,000美元買進來的織布機，結果竟然是以每台26美元的賤價賣出，甚至連運費都不止這個價錢。最後，86萬6,000美元的帳面價值，實際上只賣得16萬3,000美元而已。


    如果巴菲特的波克夏公司旗下全部是紡織公司，那一定會吸引一大堆迷信帳面價值的投資人。「你看看這個資產負債表！光是織布機每股就值5美元，而股價才2美元，我們怎能錯過這家公司呢？」好吧，那他們也不會錯過這家公司的織布機被送到垃圾場時，股價跌'
  merge: -1
  img_proc: true
- pgno: 279
  md: '落到20美分的厄運。


    如果資產負債表左邊的資產數字被高估，而右邊的負債又很大的話，那就不 非常危險了。比方說某家公司的資產是4億美元，負債為3 億美元，因此其帳面價值為1億美元。然而你知道，這筆負債可是
    貨真價實的數字，但萬一那筆4億美元的資產，在破產大拍賣時只 能拿到2億美元，那麼這家公司實際的帳面價值就是負1億美元，這 比一文不值還要糟糕！


    投資雷岱斯公司的投資人就面臨了這種窘境。雷岱斯是佛羅里達州 的房地產開發業者，在紐約證券交易所掛牌上市，其每股帳面資產 是50美元，但股價只有10美元，很迷人吧！可是這筆高額的帳面價
    值大部分都是假象，全都是用奇怪的房地產會計原則搞出來的。在 房地產會計原則中，建商負債的利息居然被視為是資產，要等到整 個房地產開發案結束或賣掉時才沖銷。


    如果開發案成功，那當然沒有問題。可是雷岱斯公司有一些大型開 發案卻連半個客戶都沒有，只有債權人（銀行）急著要把錢收回 去。由於公司欠了很多錢，如果銀行要把貸款統統追回，即使公司
    資產負債表左邊的資產全部一掃而空，右邊也還留有許多負債，後 來該公司的股價跌到75美分。等到很多人發現雷岱斯真正的帳面價 值是負7美元時，已經為時晚矣。痛哉！我早該發現這一點，因為
    麥哲倫也是大股東之一。


    如果你是根據帳面價值投資股票的話，一定要仔細研究這些價值到 底是些什麼東西。以賓州中央鐵路公司來說，它們甚至連山洞隧道 和報廢車廂都當成資產來計算。'
