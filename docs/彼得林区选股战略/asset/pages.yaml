  md: '女用絲襪。製造商漢斯公司（Hanes）在全美幾個地點，包括波士頓近郊，測試蕾格絲的市場反應。漢斯公司針對選定的超市，訪問數百位女性消費者剛剛是否在超市裡購買了絲襪，回答「是」的比例很高，但是大多數女性消費者卻記不得到底是買了哪種品牌的絲襪。對於這樣的結果，漢斯公司大感驚喜，如果有某種商品連可辨識的品牌都沒有，就能成為暢銷品，要是建立一個眾所周知的品牌，又會是何種景況呢！


    儘管不是紡織品分析師，卡洛琳也知道蕾格絲絲襪的品質比較好，她只要買一雙來穿穿看就一清二楚。這種絲襪的「織數」（denier，即「丹尼」數）較高，所以比其他品牌更耐穿。當然它也很合身，但是它的最大優勢在於便利，你可以在販售口香糖和刮鬍刀旁的貨架上買到蕾格絲絲襪，不必特意跑到百貨公司去購買。


    漢斯公司當時也有其他品牌的絲襪在百貨公司及專賣店販售，但該公司認為，女性消費者平均大約六星期才會到這些地方一次，而到雜貨店的頻率卻是每週兩次，等於購買蕾格絲絲襪的機會是一般品牌的12倍。在雜貨店賣絲襪的確是個好主意，你只要看看排隊結帳的女性顧客，她們的購物推車裡有多少顆蕾格絲彩蛋就一清二楚囉。這時你可以想想，全美各地正賣出多少蕾格絲絲襪呀！


    有多少買絲襪的女性顧客、看到絲襪熱賣的商店店員，以及看到太太買絲襪回家的先生們，注意到蕾格絲的成功呢？數百萬人！在這項商品上市兩、三年後，你可能隨便走進一家超市，就知道這是個暢銷商品。你很容易就可以知道蕾格絲是漢斯公司生產製造的，而'
