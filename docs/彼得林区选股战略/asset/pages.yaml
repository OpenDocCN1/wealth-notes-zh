- pgno: 9
  md: '儘管有那麼多能迅速飆漲的股票，我還是繼續用老方法來投資做股票。我所持有的股票，仍然固守著過去的基本面法則：跨進新市場的成功公司，隨著其盈餘增加，股價才會跟著上揚；要不然就是艱困公司正逐漸好轉。在我的投資組合中，表現最佳的股票通常要花三年到十年，甚至更久的時間，才能把潛力發揮出來（當然，我挑中的股票裡照樣也會有輸家）。


    由於達康公司通常沒有盈餘，所以大部分達康公司不能用本益比（p/e ratio）來檢驗。換句話說，在最重要的本益比裡頭，只有「本」沒有「益」。缺乏本益比作為依循，投資人只能把焦點放在一個地方：股票價格！對我個人來說，股價是最沒用的指標，然而這卻是最多人使用的指標。在我這本書剛完成的1989年，當時電視上的股市報價只有金融新聞網（Financial
    News Network）頻道上一行孤零零的跑馬燈，如今很多電視頻道都有股市報價跑馬燈，有些則是在螢幕邊設個小欄位，裡面有道瓊指數、標準普爾500指數等等，瀏覽電視頻道不可能不知道市場的收盤狀況。而在熱門的入口網站上，你也可以預先設定個人的投資組合，這樣便能很快得知每一種持股的表現。或者，還有免費查詢電話、股市傳呼機、語音郵件報價等等方式，都可以輕易得知股票的價格。


    我認為，像這種排山倒海而來的股票報價，根本是提供錯誤的訊息。如果我特別喜歡的網路公司股價是30美元，而你喜歡的只有10美元，那些只看股價的人會以為我投資的那家網路公司比較好，這其實是一種危險的錯覺。市場先生願意以什麼價格在今天或下星期買下那支股票，並不代表在未來兩、三年內，那家公司在資訊高速'
  merge: -1
  img_proc: true
- pgno: 10
  md: '公路上就會成功。如果各位只能緊抓部分的資訊，那麼就跟著盈餘數字走，當然這是假設這家公司有盈餘。各位將會在本書看到，我會以盈餘作為決定投資或放棄某支股票的依據；至於那支股票在今天、明天或下星期的表現如何，通常只會讓人分散注意力。


    網際網路還談不上是第一個改變全世界的創新發明，舉凡鐵路、電話、汽車、飛機以及電視，都可說對日常生活帶來了革命性的改變，或者至少對全球生活最富裕頂層的四分之一人口來說是如此。這些新產業產生了許多新公司，但最後只有少數幾家得以存活，主宰其所屬的產業領域。網際網路的情況應該也是一樣，將會由一、兩家大公司獨霸市場，好比麥當勞在漢堡速食業，或者舒倫柏格（Schlumberger）在石油服務業一樣。投資這些贏家公司的股東，就會賺到錢，而那些表現不佳的同業、過去式的競爭對手，以及原本應該一箭定江山卻墜地落馬公司的股東們，則肯定會虧錢。我想各位都夠聰明，會選擇那些一年賺10億美元的獨門大贏家才是。


    雖然典型的達康公司至今都還沒有盈餘，但你也可以做個小小的分析研究，看看這些公司到底未來要賺多少錢，才撐得起現在的股價。我們假設有一家叫達康的公司，首先，以每股價格（假設為100美元）乘以公開發行股數（比方說一億股），計算出它的「市值」（market
    capitalization），100美元乘以一億股，等於100億美元，這就是達康這家公司的總市值。


    不管你投資什麼股票，無非是希望其市值增加；而市值要增加，除非投資人願意付出更高的價格來買它的股票，否則便無法達成；而一旦市值增加，就代表你的投資更有價值。然而達康這家公司卻在成長10倍以前，市值就先增加為10倍，也就是從100億美元增加為'
  merge: -1
  img_proc: true
- pgno: 11
  md: '1,000億美元，一旦設定了這個總市值目標，你就要問自己：達康這家公司必須賺多少錢，才能支撐得起千億美元的總市值呢？要得到一個粗略的答案，你可以利用平常判斷快速成長產業的本益比來進行計算，以目前行情變化迅速的情況來說，我們假設本益比為40倍。


    在此允許我離題一下。在第10章中，我提到如果投資人付出太高的成本，原本美妙的公司也會變成危險的投資，我舉了麥當勞的股價為例子。1972年，麥當勞的本益比一度高達50倍的危險水準，果然後來股價就從每股75美元跌到25美元，這時候倒是個搶進的好機會，因為本益比已經回到「比較實際」的13倍。


    同時我又提到培洛（Ross Perot）的電子資料系統公司（Electronic Data Systems, EDS），投資人曾一度付出本益比500倍的價格。對於本益比500倍，我說：「如果EDS公司獲利維持穩定的話，要五個世紀才能讓你的投資回本！」不過如今拜網際網路之賜，本益比500倍也不算太驚人了，更別提是50倍，或是我們剛剛幫達康這家公司設定的40倍本益比。


    不管如何，成為市值千億美元的公司，我想最後每年要賺個25億美元才行。以1999年來說，全美只有33家公司的盈餘超過25億美元，如果達康這家公司也能達到這個水準，顯示它也應該是獨霸一方的大贏家，就像微軟一樣。然而，這可是非常、非常罕見的情況。


    在此我提出一些正面建議，來結束這段網際網路的簡短討論。有三種方法可以投資這個網路熱潮，但不必花冤枉錢痴人說夢：第一種是從以前的「十字鎬與圓鋸」策略延伸出來的。在以前的淘金熱時'
