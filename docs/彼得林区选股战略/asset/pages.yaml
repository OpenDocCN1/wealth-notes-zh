  md: '走了。現在我開始相信，真的是什麼東西都可能被收購）。


    在這麼多企業狙擊手環伺下，業餘投資人想要找到一個好的資產股，可就沒那麼容易了；不過，這卻是一個知道何時應該賣出股票的肯定線索。你可以一直抱著資產股，等到貝斯兄弟來炒高行情為止，如果不是貝斯兄弟，那大概就是史坦伯格、埃肯（Icahn）、貝爾茲伯格（the
    Belzberg）、普力茲克（the Pritzker）、約伯斯（Irwin Jacobs）、哥德斯密（Sir James Goldsmith）、川普（Donald
    Trump）、皮肯斯或格里芬（Merv Griffin）等人吧。在這些企業狙擊手都現身之後，就會展開一場收購競價大戰，或者槓桿收購也會讓股價三級跳，屆時股價上漲個兩倍、三倍或四倍都有可能。


    其他的賣出訊號包括：


    +   - 雖然股票的價格還低於實際的市場價值，但是公司的管理階層已經宣布要發行10%額外的股票，以協助多角化經營計畫籌資。\n- 預期可以用2,000萬美元價格出售的事業單位，實際的出售金額只有1,200萬美元。\n-
    公司雖然有虧損抵稅額度，但由於政府調降營利事業所得稅稅率，使其效用大為減少。\n- 法人機構的持股從五年前的25%激增為現在的60%，其中波士頓的幾家共同基金集團是主要的持股者。'
