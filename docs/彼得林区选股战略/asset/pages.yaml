  md: '富達麥哲倫基金有2,000萬美元資產，整個投資組合只有40支股票，富達的頭頭奈德建議我再縮小戰線，減少為25支股票。我客氣地聽了聽，但是一走出他的辦公室，我馬上把股票提高為60支，六個月後再增為100支，後來又增加到150支。我可不是故意唱反調，而是因為看到許多黑馬股，心癢難耐，在那個時候，好股票簡直遍地都是。


    而心胸開闊的奈德只是遠遠地觀察，並給我鼓勵。我跟他的做法或許不同，但是這並不妨礙他接納我的做法，只要我有好成績就可以了。


    我的投資組合持續增加，有一陣子光是儲貸機構（savings-and-loans）類股就高達150支。我不是單選幾家公司來買，而是把盤面上某類產業的所有上市公司幾乎全包了（當然，這也要判斷它們是值得投資才行）。同樣地，光投資一家便利超商哪夠，除了7-Eleven的母公司南方公司（Southland）外，我還買了OK便利商店（Circle
    K）、全國便利超商（National Convenience）、Shop and Go超商、躍進食品（Hop-In Foods）、菲蒙特食品（Fairmont
    Foods），以及陽照小樓（Sunshine Junior）等超商連鎖店的股票，而且這還只是其中一部分而已。一炊持有數百支股票，顯然跟奈德的操作方式大不相同，不過我還是好好地活到現在。


    很快地，大家便說我是股票界的威爾·羅傑斯（Will Rogers），他曾經說：「我從未碰過哪個我不喜歡的人。」於是大家也說，不會有哪支股票是我不喜歡的。大家常常在《巴隆周刊》上開我的玩笑：你可以指出哪支股票是彼得·林區沒買過的嗎？光是現在，我持有的股票就高達1,400支，我想他們也不是無的放矢。不過我可'
  merge: -1
