  md: '# 導言


    # 散戶的優勢


    身為專業投資人，作者要在此提出保證，在以下的三、四百頁文章中，作者將與各位讀者分享成功的秘密。但是在我這本書中，我要提出的第一條準則是：不要聽信專家！基於二十年的業界經驗，我相信一般大眾只要運用慣用腦力的3%，在選股上的表現即使不能比華爾街的一般專家好，但也不會比較差。


    我知道你不會期望整形醫生告訴你該怎麼拉皮、水電師傅指導你如何自行安裝熱水槽、美髮師告訴你該如何修剪自己的劉海，但是，這裡我們要談的不是整形拉皮、安裝熱水槽，也不是剪劉海，而是投資。在投資中，所謂的專家（smart
    money，聰明錢）不見得就那麼聰明，而散戶（dumb money，愚笨錢）也不見得就像一般人認為的那麼一無是處；事實上，散戶往往是因為跟在專家屁股後頭，才會變得如此一無是處。


    基本上，業餘投資人本身具備了許多優勢，如果好好利用，就可以贏過那些市場專家，投資績效也會比大盤好。況且，自己選股操作，本來就應該比專家更有效率，否則幹嘛自找麻煩？


    當然，我也不會太過激動，建議你把共同基金都賣了。如果大家都'
  merge: -1
  img_proc: true
- pgno: 35
  md: '把共同基金賣了，我也沒工作囉。此外，投資共同基金也沒什麼不好，尤其是那些讓投資人賺錢的共同基金。老實且不誇張地說，已經有數百萬名投資人因為投資富達麥哲倫基金而獲利，這也是有人邀請我寫這本書的首要理由。對於那些既沒時間，也不想在股票市場耗費心神的人來說，共同基金真是個美妙的發明；而對於那些資金不多，又希望分散投資的人來說，也很適合投資共同基金。


    如果你決定要自行投資，那麼就應該單獨行動。你不要去聽誰報的明牌、券商推薦的股票，以及你喜愛的投資刊物中、最新的「不可錯過」的名單，而是要自己去調查、研究。換言之，你別聽信彼得．林區，還是哪位權威人士告訴你該買哪些股票。


    你大可不必管彼得．林區在買什麼股票，理由至少有三個：①他也許買錯了！（在我自己的投資組合中也有一堆失敗者，不斷提醒我所謂的專家〔聰明錢〕大概有40%的時間表現得特別笨）；②就算他買對了，你也不曉得他何時會改變心意，突然把股票賣掉；③你有更好的情報來源，而且這些情報來源就在你身邊。我所說的「更好」，是因為你隨時可以記錄、注意到那些消息，正如同我自己也有一些很棒的消息來源一樣。


    各位只要保持半警覺狀態，就能遠遠搶先在華爾街發現之前，從自己所從事的產業、或是家裡附近的購物中心，挑選到表現優異的公司股票。作為隨身攜帶信用卡的消費者，你一定對幾十家公司做過許多基本分析的功課，而如果你挑選的股票跟你所從事的工作相關，那就更棒了。從這些近在咫尺的地方，你就可以找到「十疊安打」（tenbagger）的股票，這種美妙的事情，我在富達基金工作時'
