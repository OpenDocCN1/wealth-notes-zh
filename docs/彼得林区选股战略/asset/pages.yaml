  md: '年中下跌的股票超過1,500支，這種漲跌分歧的狀況，可說是史無前例。再者，我們通常都認為標準普爾500指數是以大型股為主，那斯達克指數則是由許多小型股組成，然而在1990年代末期，那斯達克指數被少數幾家大公司（如英特爾、思科等等）所主導的情況，要比標準普爾500指數嚴重多了。


    生化科技類股也是包含很多小型股的產業。源於對高科技的恐懼，我笑稱典型的生化科技類股是：賣股票籌資1億美元、一位博士、九十九架顯微鏡，可是公司的營收為零。但最近生化科技類股的表現，使我不能不幫它們說些好話，業餘散戶不應該再忽視這類股票，因為生化科技類股在21世紀所扮演的角色，說不定跟電子類股在20世紀所扮演的角色一樣重要。如今，有多家生化科技公司已經開始有營收，有三十幾家甚至已有了盈餘，另外還有五十家即將轉虧為盈。安進（Amgen）如今已是真正的生化科技績優股，每年盈餘都在10億美元以上。現在有許多生化科技共同基金，也許都可以考慮作為長期投資標的。


    市場分析師經常拿目前的行情跟過去相比，例如：「目前行情看來很像1962年」或者「這讓我想起1981年」等等，有時他們覺得很悲觀：「我們又碰上了1929年的大崩盤」。最近這種對比似乎比較偏愛1970年代初期，當時小型股下跌，而大型股則一直上漲（尤其是最熱門的「亮麗50」〔Nifty
    Fifty〕個股）。但是在1973年到1974年的空頭市場中，「亮麗50」的股價跌幅卻高達50%到80%！大家都說大型股抗跌，這可是最佳反證。


