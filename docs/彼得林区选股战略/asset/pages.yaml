- pgno: 186
  md: '# 11. 科技的使用者


    與其投資時時刻刻都要在價格戰中掙扎求生的電腦公司，為什麼不投資因為電腦成本降價而得利的公司，例如自動資料處理公司呢？電腦價格降低之後，自動資料處理公司的營運成本也跟著降低，獲利也因而提升。或者，不要去投資生產掃描器的公司，而去投資使用掃描器的超級市場，不是更好嗎？即使掃描器只能讓超級市場的成本降低3%，但是這就可能讓公司的盈餘加倍。


    # 12. 內部人士買進自家公司股票


    再也沒有什麼比公司內部人士買進自家公司的股票，更能保障公司的未來成功。一般來說，公司內部人士都是賣的多、買的少，買賣比率大概是買進一股的同時，就有2.3股賣出。不過在1987年8月到10月的千點重挫行情中，比較值得安慰的是，公司內部人士的買賣比率轉為買進四股、賣出一股，顯示大家並未喪失信心。


    當公司內部人士瘋狂地買進自家公司股票時，你至少可以確定，這家公司絕對不會在六個月內破產。我敢打賭，如果連內部人士都在買進自家公司股票，而公司卻在短期內關門倒閉，這種情況在歷史上絕對不會超過三家。


    長期而言，內部人士持有自家股票還有一個重要好處。如果管理階層持有股票，那麼股東報酬就會成為優先的考量因素；而如果管理階層只是領薪水，那麼他們就只會關心調薪的問題。較大的公司通常會支付經理人較高的薪水，因此領薪水的員工自然會有一種傾向，不計任何代價要擴大公司的事業規模，而這通常會傷害到股東'
  merge: -1
  img_proc: true
- pgno: 187
  md: '權益。但如果管理階層也持有大量公司的股票，則比較不會出現這種情況。


    當然，擁有數百萬年薪的公司執行長或總裁買進幾千股公司股票可說是一件好事，但若是連低階員工也跟著進場投資，那可就更妙了。如果連年薪才45,000美元的員工也肯拿1萬美元來買公司的股票，這就代表意義非凡的信心投票。這正是我認為七位副總裁分別買進一千股，要比一位總裁獨力買進五千股更重要的原因了。


    如果在內部人士買進股票後，股價卻隨即下滑，此時你就有機會用比他們更低的價格買進，這對你當然更好。


    要追蹤內部人士買進的資訊很簡單，不論是主管或董事要買賣自家公司股票，都要填單申報，送交證管會備查。包括《維克週刊內線報導》（Vicker''s Weekly
    Insider Report）、《內線消息》（The Insiders）等市場刊物，都會公布這類資訊；《巴隆週刊》、《華爾街日報》以及《投資人日誌》（Investor''s
    Daily）也有這類報導。很多地方性報紙也會報導當地企業的內部人士進出消息，就我所知，《波士頓商報》（Boston Business Journal）就有這樣的專欄。你的證券商或許也會提供這類資訊，要不你也可以到圖書館查詢上述刊物。另外，《價值線》也製表揭露內部人士進出股票的數量。


    （內部人士賣出自家公司股票的資訊通常不太有意義，如果跟著他們賣出就太傻了。如果是某支股票從3美元漲到12美元，然後有九位主管申報賣出，此時我便會提高警覺，而如果他們不只是賣出，還是大量拋售的話，那(NO)就更要留意了。但在正常的狀況下，內部人'
