  md: '# 15 最後的檢查表


    我前面提到的所有調查研究，每支股票最多只要花幾個小時即可完成。當然你研究得越多越好，可是這並不是說你就得打電話給上市公司，或是像研究死海古卷（Dead Sea
    scroll）的學者一樣，拚命鑽研公司的年報。而且，某些「著名的數字」（詳見第13章）只適用於特定產業，在其他產業則無須理會。


    以下針對六種類型的股票，分別總結各位應該注意的相關事項：


    # 所有股票都適用


    +   • 本益比。要注意特定公司的本益比是高是低，並且和相同產業的類似公司進行比較。


    +   • 法人機構的持股比例越低越好。


    +   • 公司內部人士是否買進自家公司的股票？企業是否回購自家公司的股票呢？如果是，這兩項都是正面訊息。


    +   • 到目前為止的盈餘紀錄是否穩定，或者起落甚大？（只有在資產股這類股票類型中，盈餘才相對較不重要。）


    +   • 公司的資產負債表是健全還是疲弱（負債對股東權益比），並以此來評價其財務實力。'
  merge: -1
  img_proc: true
- pgno: 305
  md: '+   • 現金部位。由於福特汽車擁有每股16美元的現金淨值，因此我知道福特汽車的股價不可能跌到16美元以下，這就是這支股票的下檔底限。


    # 緩慢成長股


    +   • 你買進這種類型股票的目的就是為了取得股利（不然你幹嘛買它），因此你要注意過去是否持續發放股利，並且持續調高股利。• 如果可能的話，試著找出股利占盈餘的比例。要是比例偏低，代表公司在面對艱困時期，還會有轉圜空間，此時儘管盈餘下降，但公司還是可以維持股利發放；如果比例較高的話，也許會有發不出股利的風險。


    # 穩定成長股


    +   • 這類股票是不太可能被三振出局的大型公司。因此其關鍵就在於股價，而本益比可以告訴你目前的股價是否偏高。• 檢視公司可能進行的「多慾化」經營，看看是否會拖累未來的盈餘。•
    檢視公司的長期成長率，看看最近幾年是否維持相同的成長動能。• 如果你準備長期持股，要注意該公司在過去幾次景氣衰退和股市大跌時的表現（麥當勞在1977年股市大跌時表現甚佳，在1984年的空頭走勢中也能維持橫向整理，不過到了1987年的股市大崩盤時，它就跟著其他股票一起大跌；但是整體來看，麥當勞還是相當優秀的防禦型股票。反觀必治妥的股票，在1973'
  merge: -1
  img_proc: true
- pgno: 306
  md: '年至1974年的空頭市場中就慘遭痛苦，主要是因為當時的股價太高了；不過到了1982年、1984年及1987年時，其表現又相當好。家樂氏除了沒躲過1973年至1974年的空頭行情外，在最近的幾次大跌中，其表現都很好）。


    # 景氣循環股


    +   - 密切注意存貨的狀況，以及市場上的供需關係。留意新加入市場的競爭對手，這通常是一個警訊。\n- 在景氣復甦時，本益比通常會降低；而一旦盈餘創新高，投資人就要小心景氣擴張或許即將結束。\n-
    如果你對自己所投資的景氣循環股相當了解的話，便擁有研判景氣循環變化的優勢。


    例如，大家都知道汽車產業存在景氣循環的波動，大抵上是三、四年的好光景，之後便緊接著三、四年的不景氣，這種循環變化向來如此。雖然人們可能會延遲一、兩年汰換汽車，但遲早還是要汰換。


    如果汽車產業在景氣衰退期間跌得越深，那麼在復甦時就會表現得越好。有時我反而會樂於見到額外一年的銷售疲弱，因為我知道這將會帶來更長且更穩定的景氣回升。


    最近汽車業已經持續五年業績表現優異，因此我曉得我們正處於景氣擴張的中期，或者即將接近尾聲。不過，預測景氣循環股何時會回升，可是比預測它何時會走下坡要簡單多了。


    # 快速成長股


    +   - 仔細調查讓特定公司賺錢的特定商品，是否占該公司業務的主'
  merge: -1
  img_proc: true
- pgno: 307
  md: '要部分。例如蕭格絲便是，而雷克森塑料則不是。


    +   - 檢視最近幾年的盈餘成長率（我最喜歡的盈餘成長率是在20%到25%之間。如果超過25%，我就會有點擔心成長率是否難以持續。至於熱門產業中常見的50%高成長率公司，你也知道它們的下場都是如何）。

    - 這家公司是否已經在一個以上的城鎮，成功地複製其經營模式，並證明未來的擴張將會成功。

    - 這家公司是否還有成長空間。我第一次拜訪揪省百貨時，它們才剛搶下南加州的市場，並且準備進攻北加州，而未來還有四十九個州可供其發展；西爾斯百貨則正好相反，它們已經到處都有分店了。

    - 本益比是否和其成長率相當？

    - 擴張的速度是否正在加快（去年新開三家汽車旅館，今年新開五家），或是在減慢（去年五家，今年三家）？又如自動感應公司的生意，主要是「一次式」的交易，不像刮鬍刀，消費者會重複購買，因此如果成長趨緩，可能就會演變成一場大災難。1970年代末期到1980年代初期，自動感應公司的成長非常耀眼，但如果要維持盈餘成長，它們出售的商品防竊系統就要逐年增加。可是光靠已經購入系統的商家添購商品防竊標籤所帶來的收入，又比不上出售整套系統給新店家的收入，因此到1983年市場飽和後，該公司的成長率立即趨緩，盈餘成長也減緩，甚至出現縮水，所以股價也在十二個月內從42美元跌到6美元。

    - 很少有法人機構持有這家公司的股票，甚至只有少數分析師聽過這家公司，對一家正在崛起的快速成長公司而言，這更是一項利多。'
