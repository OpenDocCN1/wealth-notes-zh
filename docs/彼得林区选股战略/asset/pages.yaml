- pgno: 15
  md: '不論如何，我還是相信業餘的散戶投資人比專業的經理人擁有更多優勢。在1989年時，專業經理人在取得資訊方面的確比較快速也比較確實，但是這種取得資訊的差距如今已經不存在了。十年前，業餘的散戶投資人只有三個管道可以取得公司訊息：公司本身、《價值線投資調查》（Value
    Line Investment Survey）、標準普爾的研究報告，或者投資人開戶的證券商分析人員所寫的報告。這些報告以前通常採郵寄方式，由研究機構的總部寄出，要花上好幾天才會到投資人手上。


    今天，網路上就有一大堆分析報告，只要透過電腦瀏覽器，隨時都可以取得。有關你感興趣的股票的新聞警示，也會自動寄到你的電子郵件信箱，你可以很快就知道內線人士正在敲進或賣出哪一支股票，或者哪家券商調高或調降哪支股票的投資評等。你可以在某些入口網站依據自己的需求，設定監看個人投資標的的網頁；同時也可以追蹤許多種類的共同基金，比較它們的操作績效，抓出它們持股最多的前十支股票。你可以在《華爾街日報》（The
    Wall Street Journal）或《巴隆週刊》（Barron''s）的網站上，點選股市行情簡報，立即獲知幾乎所有上市公司的狀況；或者你可以點選「蔡克」（Zack''s）網頁專區，看看它們彙整的所有分析師對特定股票的評等及看法。


    同樣也是拜網際網路所賜，小散戶買賣股票的成本也大幅降低了，而法人投資機構早在1975年就享有這項優勢。線上交易已經迫使傳統券商降低手續費及其他交易費用，這與二十年前出現的折扣券商，屬於同一波趨勢的延續。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '對於我離開麥哲倫基金後的投資習慣是否有所改變，各位或許會有點好奇。過去得追蹤幾千家上市公司，現在我只要注意大約五十家就夠了（我仍然擔任某些基金會或慈善團體的投資顧問，不過選股工作則交由該機構聘用的投資組合經理人負責）。喜歡追求時髦的投資人也許把我看成老古董，而我現在持有的股票中，也還包括幾支儲貸機構的股票，這是在過去大家都非常不看好儲貸業時以低價買進的，後來它們的表現也很不錯，所以我還繼續抱著（賣掉長期表現優秀的股票，等於是先跟國稅局自首，繳交20%的證券交易所得稅）。我也持有一些成長類股，有幾支股票是在1980年代買進的，有些甚至在1970年代就已經買進。這幾家公司都在持續成長，所以股價也做了合理的反映。此外，我還持有一些已經被套牢的股票，其市價都在我當初的買進價格之下，但是我之所以繼續持有這些股票，並不是因為我頑固或念舊，而是因為這些公司的財務狀況都還很好，也有明天會更好的證據。


    這些套牢的股票提醒了我一點：不要以為你挑選的每一支股票都會賺錢。以我的經驗來說，如果在投資組合中有十支股票，其中有六支成功，就很讓人滿意了。為什麼呢？因為股票賠錢總是有個限度（總不會跌到零以下吧），但上檔的空間無限。投資1,000美元買到一支爛股票，頂多就是虧掉那1,000美元；但是如果買到一支好股票，你就可以賺到1萬、1萬5,000，甚至2萬美元，而且可以持有很多年。一輩子的成功投資，其實只要靠幾支大贏家就夠了，從這些長期持有的股票，就足以彌補那些錯判行情的失誤。


    現在，我要提供兩家公司的更新訊息，這兩支股票我沒買，但在這本書裡提到過：伯利恆鋼鐵公司（Bethlehem Steel）以及奇異'
