- pgno: 333
  md: '我是在1美元時買進、5美元時賣出，算是一支五疊安打，這還有什麽好抱怨的？我們不是都被教導說：「要盡可能獲利了結」，以及「確定的獲利總是好過可能的損失」。可是當你好不容易找到且買下了一支好股票，而且所有證據都告訴你，這支股票還會繼續上漲，且所有的發展情況也都如你所料，結果你卻把它賣掉了，這的確是太丟臉了！1萬美元的五倍是5萬美元，可是再成長五倍就會變成25萬美元呢！能逮到一支漲上漲25倍的股票可不是件常有的事，即使對成天在股市裡打滾的基金經理人來說也是如此；至於散戶投資人，一輩子或許只能碰上一、兩次吧。而迪羅特的客戶正是修了莫大的福氣，因為這支股票就是他向我推薦的，而且他也真的把持得住，足足賺了25倍才出場。


    後來我在蔻蘿斯糕餅公司也犯下相同錯誤，在蘭斯（Lance）餅乾公司也一樣。因為我聽說這兩家公司都會被收購，因此我就一直等、一直等，直到最後失去耐性，便把股票給賣掉，等我賣光股票之後，你大概也猜得到發生了什麽事。這一次的教訓是，我根本不必在意它們會不會被收購，只要它們很會賺錢就夠了；事實上，如果它們能維持獨立經營，我才應該更高興呢。


    我在前面說過，我曾經因為拉昆特汽車旅館的一位重要內部人士賣出持股，差點就不想買進這家公司的股票。如果是因為內部人士賣出，而不買進這家公司的股票，就像是看到公司外部的人（派特利）停止買進，自己就賣出一樣的大錯特錯。幸好我在拉昆特這支股票上，並沒有受到那些無謂消息的影響。


    我確信我還有許多這種被騙出場的經驗，只是我剛好忘了。事實上，緊抱上漲的股票而不會被嚇到，的確要比死守著下跌的股票困'
