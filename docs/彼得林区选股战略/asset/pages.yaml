- pgno: 30
  md: '些股票可以撿便宜。


    +   • 週一，我在基勒尼郡的基尼球場打球，道瓊指數狂瀉508點！


    感謝時差之賜，我打完球後幾個小時華爾街股市才開盤，不然我一定打得更糟。情況是，從週五開始就籠罩著一股愁雲慘霧，或許這也可以解釋：①我平常球技就糟透了，而這次是比糟透了還要糟糕；②我忘了到底打幾桿。那天稍晚我最在意的數字是，光在星期一這一天，麥哲倫基金100萬名投資人的資產總共縮水了18%，大約是20億美元。


    這場股票大災難讓我在前往幽谷半島的路上，對沿途美景視而不見，看起來似乎就跟曼哈頓四十二街和百老匯大道差不多。


    剛才說我整個下午都待在歇麗格旅館，不過並不是在睡覺休息，而是打電話回辦公室，從我基金中的1,500支股票裡，挑出該賣出的個股，藉以準備好資金因應不尋常的贖回要求。如果是平常時候，資金肯定足夠，但是像10月19日星期一那種情況可就對付不了。在那個時刻，我不曉得是不是世界末日到了；或者是我們碰上了大蕭條；還是情況並沒有那麼糟，只是華爾街完蛋了而已。


    我的同事跟我把該賣的股票先出清。首先，我們在倫敦股市賣掉一些英國股票，星期一早上倫敦股市的股票價格通常會比紐約高一點，並且感謝一場罕見的暴風雨，迫使上個星期五倫敦股市休市，避免了當天的大跌。然後，我們又在紐約股市賣股票，大部分都是在早盤賣出，當時道瓊指數才下跌150點，但正無情地邁向狂跌508點的深淵。'
