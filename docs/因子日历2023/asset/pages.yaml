    # 供应链地位因子


    另类因子


    客户集中度 = 前五大客户年度销售额 / 公司年度销售总


    供应商集中度 = 前五大供应商年度采购额 / 公司年度采购总额


    占资水平 = 应付账款 + 预收账款 - 应收账款 - 预付账款 - 存货 / 营业收入


    客户集中度 = 经营活动中产生的现金净流量 / 净利润 + 折旧摊销 + 财务费用


    构建上述 4 个细分因子，然后将这 4 个细分因子等权合成供应链地位因子。


    # 说明


    测试结果表明：客户集中度因子与供应商集中度因子均为反向因子，表明市场相对较为认可上下游分散度较高公司；占资水平和获现率为正向因子；合成的供应链地位因子有较强的选股能力。


    [参考文献]

    曹春晓, 2019, 上市公司供应链地位因子研究, 申万宏源.


