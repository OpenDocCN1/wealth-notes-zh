- pgno: 174
  md: '# 价差偏离度


    每月月底在全市场搜索与股票 i 距离最近（相似度最高）的 N=10 只股票等权构建该股票的特征组合，特征组合的净值价格我们称之为参考价格：PriceSpead_i,t，其中，股票间的距离=1-两股票过去250个交易日涨跌幅的pearson相关系数；


    计算股票 i 的价格和参考价格的对数价差：


    PriceSpead_{i,t} = ln(StockPrice_{i,t}) - ln(ReferencePrice_{i,t})


    利用高频分钟K线，每日的K线最短路径非流动性因子：


    SpreadBias_{i,t} = \frac{PriceSpead_{i,t} - mean(PriceSpead_{i,t})}{std(PriceSpead_{i,t})}


    # 说明


    价差偏离度衡量了个股相对其特征组合（相似的股票集）价格的偏离程度。在基本面没有发生重大变化的前提下，价差偏离度低，股票近期跑输其特征组合，股票相对估值偏低，有向上回复的动力，有正的预期超额收益，价差偏离度越高，股票处于相对高估状态，后期有回调的压力。


    [参考文献]


    > 朱剑涛, 2016, 投机、交易行为与股票收益（下）, 东方证券.'
  merge: -1
  img_proc: true
