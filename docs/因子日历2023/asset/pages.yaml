  md: '# 资产增长率-单季度


    投资因子


    最近报告期总资产 - 上一报告期总资产

    上一报告期总资产


    # 说明


    即总资产环比增速，用于衡量总资产的季度增长情况；作者发现，总资产增长越多的公司获得的后续回报就越低；A股中测试发现，增长率统计区间长达5年时，因子与未来收益存在负相关关系；统计区间为年度或季度时，存在正相关关系。


    # 〔参考文献〕


    Cooper, Michael J., Huseyin Gulen, and Michael J. Schill, 2008, Asset growth and
