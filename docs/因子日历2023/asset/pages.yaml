  md: '# 27 7月 Jul. 星期四 六月初十 宣 高频


    # 开盘后买入意愿占比


    ```

    \frac{1}{T} \sum_{n=t}^{t-T+1} \frac{\sum_{j=1}^{N} (买入意愿_{i,j,n})}{\sum_{j=1}^{N}
    成交额_{i,j,n}}

    ```


    买入意愿_{i,j,n} = 净主买成交额_{i,j,n} - 净委买增额_{i,j,n}


    净主买成交额_{i,j,n} = 主动买入成交额_{i,j,n} - 主动卖出成交额_{i,j,n}


    净委买增额_{i,j,n} = 委托买单增加量_{i,j,n} - 委托卖单增加量_{i,j,n}


    # 其中


    +   ① 净主买成交额由逐笔成交数据计算得到，具体可参考开盘后净主买占比/强度等因子；

    ② 净委买增额由盘口委托快照数据计算得到，具体可参考开盘后净委买增额占比因子；

    ③ i、j、n 分别表示第 i 只股票在第 n 个交易日内的第 j 分钟的数据；

    ④ 开盘后的买入意愿占比用的是 9:30~10:00 范围内的数据；

    ⑤ 月度选股下，T=20 个交易日；周度选股下，T=5 个交易日。


    # 说明


    净委买变化额刻画了投资者还未释放的买入意愿，而净主买成交额则体现刻画了投资者已经释放的买入意愿，两者结合则得到广义的投资者主动买入意愿；开盘后30分钟内买入意愿占比越高，投资者的买入意愿越强。


    > 〔参考文献〕

    冯佳蒂, 麦林蔚, 2020, 基于非线性随机过程学习的高频数据低频化应用, 海通证券.'
