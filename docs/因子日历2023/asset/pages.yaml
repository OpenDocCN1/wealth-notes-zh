  md: '# 21

    2 月 Feb.

    星期二

    二月初二

    宣 高频


    # 一致卖出交易


    高频因子


    通过定义实体K线，将交易日中的每根5分钟K线划分为集体一致交易与非集体一致交易：


    |close − open| <= α|high − low|


    利用下跌的实体 K线构造一致卖出交易因子：


    NCV_t = 1/d Σ_{i=1}^d ( ConsistentVolume_{fall} / Volume )_{t−i}


    # 其中


    +   ① α为一致参数，α 越大，K线一致性越强（上下引线越短，K线越实体）；

    ② Consistent Volume_{fall}为下跌的5分钟实体K线的总成交量；

    ③ Volume为当日总成交量；

    ④ d 表示移动平均的周期参数。


    # 说明


    集体一致交易行为预示交易机会，如果一支股票在一段时间内大部分的交易属于集体一致交易行为，趋势性显著，则很可能这支股票在这段时间内有新信息进入，正在经历市场消化过程（price-in），未来股价很可能产生大幅变化，为交易者创造交易机会。


    【参考文献】

    刘均伟, 2018, 一致交易因子:挖掘集体行为背后的收益, 光大证券.'
