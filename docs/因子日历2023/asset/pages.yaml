  md: '# 存货周转率


    财务质量因子-营运能力


    最近12个月的营业成本(TTM)

    平均存货


    # 其中


    平均存货 = (期初存货 + 期末存货) / 2


    # 说明


    用于衡量产品从库存转移到销售的速度。较高的存货周转率通常说明公司产品销售较为迅速，存货占用水平低，存货转换为现金或应收账款的速度较快，存货流动性较强，进而增加企业流动性或短期偿债能力和获利能力。


    【参考文献】

    Ludwig B. Chincarini, Daehwan Kim, 2006, Quantitative Equity Portfolio Management:
    An Active Approach to Portfolio Construction and Management (1st edition), McGraw-Hill
    Library of Investment and Finance.'
