- pgno: 157
  md: '# 科技动量


    基于各公司的专利分布向量计算各公司之间的科技关联度：


    TECH_{ijt} = \frac{T_{it} T''_{jt}}{(T_{it} T''_{it})^{1/2} (T_{jt} T''_{jt})^{1/2}}


    以科技关联度 TECH_{ijt} 为权重，将与自身存在科技关联的公司的收益率进行加权，得到科技动量因子：


    TECHRET_{it} = \frac{\sum_{j \neq i} TECH_{ijt} \times RET_{jt}}{\sum_{j \neq
    i} TECH_{ijt}}


    # 其中


    +   ① TECH_{ijt} 为公司 i 和公司 j 在第 t 期的科技关联度，该公式中的 T_{it} 和 T_{jt} 为 N 维的专利分布向量，N
    为专利商标局科技大类的数目，专利分布向量中的元素为公司 i 在过去五年获取的各类科技专利在这 N 类中的比例；


    ② RET_{jt} 为公司 j 在 t 期的收益率。


    # 说明


    作者实证发现：目标公司的股票收益率和与其科技关联度相近的公司前期的收益率之间有一种滞后-领先关系，以科技关联度为权重构建的科技动量因子对目标公司未来收益有预测性；一家公司科技的进步具有溢出效应，会影响到有科技关联度的其他公司，改变这些关联公司的基本面，并最终反应回公司的股价中。


    > [参考文献]

    Lee, C. M. C., S. T. Sun, R. Wang, and R. Zhang, 2019, Technological Links and
    Return Predictability, Journal of Financial Economics 132(3), 76-96.'
  merge: -1
