  md: '# 08 10 月 Oct.


    星期日

    八月廿四

    宣 波动率


    # 尾部风险


    波动率因子


    先计算每个月整个市场的尾部风险 λ：


    ```

    λ_t = 1/K_t Σ_{k=1}^{K_t} r_{kt}/μ_t

    ```


    再通过时序回归计算个股在 λ 上的暴露 β_i 即为个股的尾部风险因子：


    ```

    r_{i,t} = α + β_i λ_t + ε_i

    ```


    # 其中


    +   ① μ_t 为第 t 月所有股票日收益率放在一起计算得到的 25% 分位数；

    ② r_{kt} 为第 t 月所有股票日收益率中第 k 个小于 μ_t 的日度收益率；

    ③ K_t 为第 t 月所有股票日收益率小于 μ_t 的个数；

    ④ 时序回归的时间窗口可以为 120 个月，μ_t 比 r_{i,t} 滞后一个月。


    # 说明


    尾部风险通常指的是发生负面罕见事件的风险，尾部风险对总市场回报具有很强的预测能力，而且尾部风险负载高的股票比尾部风险负载低的股票能获得更高的未来收益。


    [参考文献]

    Kelly, B. T., & Jiang, H., 2014, Tail Risk and Asset Prices, Review of Financial
    Studies 27(10), 2841-2871.


    ![](img/531c78792aa86ad32b19683feba079a5_292_0.png)'
