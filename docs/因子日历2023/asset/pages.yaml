    # 成交量比率指标


    技术因子-成交量型


    ```

    A = IF(CLOSE>CLOSE[1],VOL,0)

    B = IF(CLOSE<CLOSE[1],VOL,0)

    VR = SUM(A,N)/SUM(B,N)*100

    默认：N = 20

    ```


    # 说明


    VR指标通过分析股价上升日成交额（或成交量，下同）与股价下降日成交额比值，从而掌握市场买卖气势的中期技术指标。主要用于个股分析，其理论基础是“量价同步”及“量须先于价”，以成交量的变化确认低价和高价，从而确定买卖时法。


    [参考文献]

