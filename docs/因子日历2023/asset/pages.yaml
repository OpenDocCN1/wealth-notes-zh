    # 其中


    i ∈ {0,1,2,...,N−1}，默认 N = 8。


    # 说明


    通过营业收入与营业成本线性关系的变化来反映公司营业能力的改变，回归的当季残差项的正负方向代表营业能力的变好与变差，绝对值代表变化幅度有多大。


