  md: '# 基金关联网络牵引因子


    $$Exp_{ave}^{A}=\frac{1}{N_{A}}\sum_{i=1}^{N_{A}}K_{i}^{A}*(chg_{i}-med)$$


    涉及的股票关联网络的计算如下：


    +   ① 选取的是有权益持仓的公募基金，基金持仓数据为基金季报披露的前十大持仓数据；

    ② 取A基金最新季报中共同持有的股票a与股票b持仓市值，记作H_a、H_b，这些股票过去20个交易日的成交额均值，记作AMT_a、AMT_b；

    ③ 计算 H_a/AMT_a，作为股票a的机构拥挤度I_a，股票b同理得I_b；

    ④ 定义A基金共同持仓股票a与股票b的关联度指标为：J_ab=min(I_a, I_b)；

    ⑤ 将所有共同持仓股票a与股票b的基金得到的关联度指标求和，得到股票a与股票b的关联度指标K_ab。


    # 其中


    +   ① $N_A$ 与股票A一起被基金共同持仓的关联股票数；

    ② $K_i^A$ 为股票A与关联股票 i 的基金共同持仓关联度；

    ③ $chg_i$ 为股票A的关联股票 i 过去20日涨跌幅；

    ④ $med$ 为所有基金持仓股票过去20日涨跌幅横截面中位数；

    ⑤ $chg_i - med$ 即为股票A的关联股票 i 的Alpha收益；

    ⑥ $K_i^A * (chg_i - med)$ 为股票A的关联股票 i 的Alpha锚定值；

    ⑦ 对所有股票的 $Exp_{ave}^A$ 做横截面回归，剔除自身alpha和行业因素，得到最终的因子。


    # 说明


    基金共同持仓行为是股票关联关系的重要来源，由此构建股票关联网络来进一步刻画股票涨跌之间的牵引关系。股票 a 的关联股票的涨跌幅有锚定效应，若当月其关联股票普遍上涨，会提高市场对于股票
    a 的涨幅预期；若本月其自身涨幅不高，则预期在次月出现补涨行情。


    【参考文献】


    魏建国, 王志呜, 2021, 从基金持仓行为到股票关联网络, 开源证券.'
  merge: -1
  img_proc: true
