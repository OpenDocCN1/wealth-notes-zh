  md: '# 公司治理因子


    参考南开指数的构造及2002年1月7日证监会颁布的《上市公司治理准则》中的相规定，从公司内部治理出发选取公司治理细分因子，并将其加权汇总成公司治理综合因子。因子共涉及股权结构与股东权利、董事会构成、管理层激励、信息披露与合规、激励约束机制5个方面：


    公司治理因子 = α₁第一大股东持股比例 + α₂第二至十大股东持股比例 + α₃流通股比例 + α₄上市公司股东数量 + α₅独立董事占比 + α₆董事会委员数量
    + α₇管理层薪酬 + α₈管理层持股数 + α₉受证监会、交易所等处罚情况 + α₁₀是否实施股权激励量


    # 说明


    良好的公司治理能使公司在未来具有较高财务安全性，有利于提高公司的盈利能力，是公司产生潜在价值的源泉。


    【参考文献】

    刘均伟, 2017, 别开生面:公司治理因子详解, 光大证券.'
