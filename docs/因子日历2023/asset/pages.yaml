  md: '# 主动买卖因子


    逐日计算大单和中单总的的主动买卖因子 ACT正向,t ，以及小单的主动买卖因子 ACT负向,t ：


    ACT正向,t = 主动买入金额(大单+中单) - 主动卖出金额(大单+中单) / 主动买入金额(大单 + 中单) + 主动卖出金额(大单+中单)


    ACT负向,t = 主动买入金额(小单) - 主动卖出金额(小单) / 主动买入金额(小单) + 主动卖出金额(小单)


    回溯过去20个交易日，取收益率最高 λ 比例的交易日，称为高收益日；取收益率最低 λ 例的交易日，称为低收益日；


    对高收益日的 ACT正向,t 因子取平均，记为 ACT正向 ；


    对低收益日的 ACT负向,t 因子取平均，记为 ACT负向 。


    # 说明


    切割后的主动买卖因子，细致的刻画了在市场上涨和下跌的不同情景下，不同交易者主动买卖意愿的差异；测试发现以大户和中户投资者为主的主动买卖因子，在高收益端呈现正向选股效应；而以小户为代表的主动买卖因子，在低收益端呈现负向选股效应。


    > 【参考文献】

    骆建铢, 2020, 主动买卖因子的正确用法, 开源证券.'
