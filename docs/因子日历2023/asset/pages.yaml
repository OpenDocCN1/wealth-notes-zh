  md: '# 客户动量因子-基于单层客户关系


    利用供应链的相关数据，结合图网络有关特征，计算如下客户动量因子：


    ```

    cmom_i^{1M} = sum_{j=1}^{N_i} w_{ij}^{centrality} mom_j^{1M}, i = 1, 2, ..., N

    ```


    # 其中


    +   ① mom_j^{1M} 为公司 i 的客户 j 过去一个月收益率；

    ② 权重 w_{ij}^{centrality} 为： w_{ij}^{centrality} = c_{ij} / sum_{j=1}^{N_i} c_{ij},
    i = 1, 2, ..., N

    ③ 权重公式中的 c_{ij} 为图网络中 ij 边的中介中心度（即网络中经过某条边的最短路径的数量）。


    # 说明


    常规的客户动量因子是以销售占比为权重，而该因子采用供应链图网络的边中介中心度Edge Betweenness Centrality作为权重，有效的避免了销售占比数据缺失问题，研究结果也表明Edge
    Betweenness Centrality与销售占比呈明显的正相关关系。


    【参考文献】

    Hamuro, Y., and K. Okada, 2018, Predicting Stock Returns Based on the Time Lag
    in Information Diffusion through Supply Chain Networks, Special Interest Group
    on Financial Informatics Technical Reports 40-45, Japanese Society for Artificial
    Intelligence.'
