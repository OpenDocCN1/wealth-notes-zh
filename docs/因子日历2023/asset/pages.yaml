    # 加权预期收益率


    分析师因子


    ```

    WTR = Σ P_i^e / P_i^0 = Σ P_i^e × P / P_i^0 / P = Σ P_i^e / P ω_i = TR × W

    ```


    # 其中


    +   ① P_i^e 为第 i 家机构发布的股票目标价格；

    ② P_i^0 表示在第 i 家机构发布价格预测前一个交易日的收盘价；

    ③ P 为月末计算因子时的股票收盘价；

    ④ N 为发布分析师预期目标价格的机构数量。


    # 说明


    加权后的目标收益率，加入了利用后续行情验证目标价格的权重 ω_i，如果股票价格走势能够验证分析师的目标收益率（ω_i > 1），则应给予目标价格更大的权重；反之，给予更小的权重。


    > 【参考文献】

    骆建根, 2021, 分析师目标价的 Alpha 信息, 开源证券.'
