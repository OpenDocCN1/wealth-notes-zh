  md: '# 线性纯化净利润


    NetProfit_i = a_i + β_{1,i} NonOperatingIncome_i + β_{2,i} CashPaidEmployees +
    ε_i


    以当天最近N个季度的净利润作为Y、以对应季度的营业外收入和支付给职工以及为职工支付的现金数据作为X，进行OLS线性回归，回归前需对X和Y进行Z-Score标准化处理；回归得到的最近一个季度上的残差
    ε0 即为LPNP在当天的因子值。


    # 其中


    i ∈ {0,1,2,...,N-1}，默认 N = 8。


    # 说明


    财务数据中的信息可以分为对未来股价有预测能力的信息（信号）与对未来股价没有预测能力的信息（噪声）。数据的信噪比越大，其作为因子的预测能力就越强。净利润数据中有不少其它财务数据决定的部分就属于噪音项，找出它们对于净利润数据的贡献后，将其剔除，可以提升纯化后净利润数据的预测能力。


    【参考文献】

    刘均伟, 2018, 创新基本面因子:提纯净利数据中的选股信息, 光大证券.'
  merge: -1
