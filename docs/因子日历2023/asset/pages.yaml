    ```

    F-link_{ijt} = \frac{\sum_{i=1}^{10} C_{itk} \cdot C_{jtk}}{\sqrt{\sum_{i=1}^{10}
    C_{itk}^2} \cdot \sqrt{\sum_{i=1}^{10} C_{jtk}^2}}

    ```


    # 其中


    +   ① F-link_{ijt} 为公司 i 和 j 在 t 时刻的财务关联度（余弦相似度）；

