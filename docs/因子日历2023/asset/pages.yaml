  md: '# 客户动量因子-基于多层客户关系


    利用供应链的相关数据，结合图网络有关特征，计算如下客户动量因子：


    ```

    cmom_i^{TM} = Σ_{l=1}^{L} Σ_{(m,n)∈G_u} w_{mn}^{centrality} mom_n^{TM}, i = 1,2,...,N

    ```


    ```

    w_{mn}^{centrality} = c_{mn} / Σ_{l=1}^{L} Σ_{(m,n)∈G_1} c_{πn}

    ```


    # 其中


    +   ① mom_j^{1M} 为 i 的客户 j 过去一个月收益率；

    ② 权重 w_{mn}^{centrality} 为考虑了多层（L层）客户关系的边中介中心度权重。


    # 说明


    该因子同样采用了供应链图网络的边中介中心度Edge Betweenness Centrality作为权重，而且考虑了多层关系客户（客户的客户）；作者发现对比于只考虑直接的客户，客户的客户能带来更多的增量信息。


    # [参考文献]


    > ① Yoshino, T., M. Morita, H. Tsuda, and T. Ohria, 2020, Customer Momentum Strategy:
    Empirical Study of the Japanese Stock Market, Securities Analysts Journal 58(5),
    63-75.

    ② Rei Yamamoto, Naoya Kawadai, and Hiroki Miyahara, 2021, Momentum Information
    Propagation through Global Supply Chain Networks, The Journal of Portfolio Management
    47(8), 197-211.'
