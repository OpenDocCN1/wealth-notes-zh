  md: '# 20 8月 Aug.


    星期日

    七月初五

    宣 高频


    # 价格冲击偏差


    高频因子


    利用股票每日的5分钟线，以成交额作为权重进行如下加权最小二乘回归，再计算价格冲击偏差：


    ```

    return_i = gamma^{up} · I_i · MF_i + gamma^{down} · (1 − I_i) · MF_i

    ```


    ```

    MF_i = MoneyFlow_i / Amount_i

    ```


    ```

    gammabias = (gamma_{up} − gamma_{down}) / (gamma_{up} − gamma_{down})的估计标准差

    ```


    # 其中


    +   ① return_i 分别为第 i 个5分钟线的收益率；

    ② MoneyFlow_i、Amount_i 分别为第 i 个5分钟内的主动净流入金额和成交额；

    ③ MF_i 为主动净买入占比；

    ④ I_i 为示性函数，当大于0时取1，否则取0。


    # 说明


    价格冲击偏差主要表征了股票在某一时间区间上漲或者下跌的难易程度，价格冲击偏差较大（正值）的股票，相同比例的主动订单对其股价向下的冲击小于向上的冲击，股票容易上涨，反之，股票容易下跌。


    > 【参考文献】

