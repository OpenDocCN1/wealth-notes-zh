  md: '# Frazzini-Pedersen贝塔


    波动率因子


    ```

    betaFP = \hat{\rho} \frac{\widehat{\sigma_i}}{\widehat{\sigma_m}}

    ```


    # 其中


    +   ① \widehat{\sigma_i}和\widehat{\sigma_m}分别为过去K个月股票和市场的对数收益标准差；


    +   ② \hat{\rho} 为过去Y年的股票和市场日度收益的相关系数，其中日度收益率为重叠了3天的对数收益率 $r_{i,t}^{3d}=\sum_{k=0}^{2}\log(1+R_{t+k}^{i})$，一般Y=5年，至少包含750个日度收益率；


    +   ③ 一般K=12个月，至少包含120个日度收益率。


    # 说明


    对传统CAPM模型下的Beta做了改进，考虑了波动率估计误差的影响。


    > [参考文献]

    Frazzini, Andrea, and Lasse Heje Pedersen, 2014, Betting against beta, Journal
    of Financial Economics 111, 1-25.'
