    六月初八

    宣 波动率


    # 极端下行风险


    波动率因子


    利用个股过去两年Fama-French三因子回归的残差收益率月极小值数据，通过极值分布和极大似然估计得到刻画分布尾部厚度的参数，极值分布函数可表示为


    ```

    H(x) = 1 - exp[ - (1 - γ * (x - μ)/σ) ^(-1/γ) ]


    1 - γ * (x - μ)/σ > 0,  γ ≠ 0

    ```


    # 其中


    +   ① γ 度量尾部厚度；

    ② μ 为均值；

    ③ σ 为标准差。


    # 说明


    极端下行风险度量了股票收益率分布尾部厚度，作者在美股市场验证极端下行风险与期望收益率有着显著的正相关关系，但在A股市场表现并不理想。


    【参考文献】

    ① Huang, W., Liu, Q., Rhee, S. G., & Wu, F., 2012, Extreme downside risk and expected
    stock returns. Journal of Banking & Finance 36(5), 1492-1502.

    ② 宋鹂浩, 2017, 技术类另 Alpha 因子的批驳测试, 东方证券.'
