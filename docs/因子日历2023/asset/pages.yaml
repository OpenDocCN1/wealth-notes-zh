  md: '# 04 6 月 Jun.


    星期日

    四月十七

    宣 财务


    # 业绩趋势


    财务质量因子-进攻


    +   ① 计算业绩增速：归母净利润TTM环比增速；


    +   ② 计算业绩增长加速度：利用连续N个季度的单季度归母净利润，对期数 t 的二次方程进行回归，取二次项系数 α 作为业绩增长加速度的代理变量：


    ```

    NetProfit_t = α * t² + β * t + c

    ```


    +   ③ 先依据业绩增速指标将全市场股票均分成三组，给每组股票打分，增速最高一组得分为3，增速最低一组得分为1，中间一组得分为2；


    +   ④ 其次，每一组内依据业绩增长加速度指标进行标准分法打分，加速度越高得分也越高；


    +   ⑤ 最后，将两步骤的得分相加得到的综合得分即为每只股票的业绩趋势因子；


    +   ⑥ 在使用业绩数据时，除了定期报告外，可以利用业绩预告和业绩快报提高业绩数据的及时性，这也有利于提高业绩趋势因子的选股能力。


    # 说明


    业绩高速增长的公司往往能带来较高的超额收益。


    > 【参考文献】

    刘均伟, 龚霁涵, 2019, 业绩趋势因子:捕捉业绩加速增长的超额收益, 光大证券.'
