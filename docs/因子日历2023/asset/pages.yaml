    +   ① V_t 为股票在第 t 周的换手率、P_t 为第 t 周末的股价；

    ② T=260，为过去5年的周数；

    ③ k 为价格前面权重进行归一化的系数；

    ④ RP_t 为第 t 周的参考价格 Reference Price。


    # 说明


    参考价格代表了当前的平均成交价格（价格前基于换手率的权重衡量了股票持有至今仍未被交易的概率），CGO衡量了当前时点投资者的平均盈亏情况；CGO与股票未来收益正相关，CGO越大，表示投资者平均盈利越高，卖出股票的倾向越强烈，股票更有可能被低估。


