  md: '# 特异度


    在每月月底基于上月的日交易数据进行FF3-factor model回归，得到：


    ```

    特异度 = 1 - 上述回归模型的拟合优度 R²

    ```


    # 其中


    FF3-factor model 回归：


    ```

    r_{i,t} = α_i + β_{1,i} MKT_t + β_{2,i} SMB_t + β_{3,i} HML_t + ε_{i,t}

    ```


    # 说明


    特异度反应了股票收益中不能被市场、规模、估值三种常见的风格因子解释的成分占比，特异度越高说明个股涨跌与市场风格的相关性越小，交易中市场层面的信息占比越低，过去一段时间内被过度投机的可能性和程度越大。


    【参考文献】


    > 朱剑涛, 2015, 投机、交易行为与股票收益（上）, 东方证券.'
