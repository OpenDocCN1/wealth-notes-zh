  md: '# 价格时滞


    在每月月底利用本月交易数据回归如下方程：


    r_{i,t} = α_i + β_i MKT_t + Σ_{k=1}^{n} δ_i^{(k)} MKT_{t-k} + ε_{i,t}


    PriceDelay = 1 - R²_{δ_i^{(k)}=0} / R²


    # 其中


    +   ① MKT_t 为 t 期的市场收益率；

    ② MKT_{t-k} 为滞后 k 期的市场收益率；

    ③ n 表示滞后的期数，通常 n = 3、5；

    ④ R²_{δ_i^{(k)}=0} 表示令 δ_i^{(k)}=0 时回归方程的拟合度；

    ⑤ R² 表示上述回归方程的拟合度。


    # 说明


    价格时滞衡量了个股是否及时反应了市场公共信息，如果价格时滞较大，表明投资者对市场公共信息反应不足（相对滞后），过度关注个股层面的信息，刺激过度投机，从而导致股价被高估。


    【参考文献】

    ① Kewei Hou, Tobias J. Moskowitz. 2005. Market frictions, price delay, and the
    cross-section of expected returns. Review of Financial Studies 18, 981-1020.

    ② 宋剑浩, 2015, 投机、交易行为与股票收益（上）, 东方证券.'
  merge: -1
