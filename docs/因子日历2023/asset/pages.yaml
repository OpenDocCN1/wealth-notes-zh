  md: '# 平均单笔流出金 额占比


    1/T ∑_{n=t-T+1}^{n=t} [ ∑_{j=1}^{N} Amt_{i,j,n} · I_{r_{i,j,n}<0} / ∑_{j=1}^{N}
    TrdNum_{i,j,n} · I_{r_{i,j,n}<0} ] / [ ∑_{j=1}^{N} Amt_{i,j,n} / ∑_{j=1}^{N} TrdNum_{i,j,n}
    ]


    # 其中


    +   ① Amt_{i,j,n} 为股票 i 在第 n 个交易日内第 j 分钟的成交额序列；

    ② r_{i,j,n} 为股票 i 在第 n 个交易日内第 j 分钟的收益率序列；

    ③ TrdNum_{i,j,n} 为股票 i 在第 n 个交易日内第 j 分钟的成交笔数序列；

    ④ 月度选股下，T=20个交易日；周度选股下，T=5个交易日；

    ⑤ 还可计算平均单笔流入金额占比，只需将 I_{ {r_{i,j,n}<0} } 改为 I_{ {r_{i,j,n}>0} } 即可。


    # 说明


    平均单笔成交金额占比类因子可以捕捉日内大单的交易行为，大单交易会使得股票在当日的平均单笔成交金额占比在全市场中处于相对较高水平。平均单笔流出金 额占比因子具有较强的选股能力，与股票未来收益正相关；在股票下跌时，如果单笔成交金额大，说明委买有大单，是一种抄底行为。


    [参考文献]

    海佳纾, 姚石, 2019, 日内分钟成交中的玄机, 海通证券.'
