- pgno: 271
  md: "# 尾部Beta\n\n波动率因子\n\n尾部Beta为市场超额收益超出其VaR时CAPM模型中的 $\\beta_j^T$：\n\n```\n$R_j^e\
    \ = \\beta_j^T R_m^e + \\varepsilon_j,\\; R_m^e < -VaR_m(\\bar{p})$\n```\n\n基于极值理论的估计方法得到\
    \ $\\beta_j^T$：\n\n```\n$\\widehat{\\beta_j^T} = \\widehat{\\tau_j(k/n)}^{1/\\\
    widehat{\\alpha_m}} \\frac{\\widehat{VaR_j(k/n)}}{\\widehat{VaR_m(k/n)}}$  \n\
    $\\frac{1}{\\widehat{\\alpha_m}} = \\frac{1}{k}\\sum_{i=1}^k \\log X_{n,n-i+1}^{(m)}\
    \ - \\log X_{n,n-k}^{(m)}$  \n$\\widehat{\\tau_j(k/n)} = \\frac{1}{k}\\sum_{t=1}^n\
    \ 1\\{X_t^{(j)}>X_{n,n-k}^{(j)} \\text{ and } X_t^{(m)}>X_{n,n-k}^{(m)}\\}$\n\
    ```\n\n# 其中\n\n+   ① $\\bar{p}$ 为显著性水平，常取取值为5%，即有 $P(R_m^e < -VaR_m(\\bar{p}))\
    \ = \\bar{p}$；\n\n+   ② $\\widehat{VaR_j(k/n)}$、$\\widehat{VaR_m(k/n)}$ 分别为股票\
    \ j 和市场的第 k+1 大损失；\n\n+   ③ k 为 n 个交易日中股票或市场收益损失超出其VaR值的天数，所以 k≈0.05n；\n\n+  \
    \ ④ 令 $X_t^{(m)} = -R_{m,t}^e$，其中 $t=1,2...,n$，n 为计算期间内的交易日天数；将市场超额收益的相反数 $X_t^{(m)}$\
    \ 从小到大排序，得到 $X_{n,1}^{(m)} \\le X_{n,2}^{(m)} \\le \\cdots \\le X_{n,n}^{(m)}$；\
    \ $X_t^{(j)}$、$X_{n,i}^{(j)}$ 的定义方式同上。\n\n# 说明\n\n尾部Beta表示当市场出现极端下跌行情时，个股收益对市场收益的敏感性。若尾部Beta越大，表示个股收益对市场的极端负收益越敏感，使得收益率低于尾部Beta偏小的股票。\n\
    \n# [参考文献]\n\n+   ① 朱剑涛, 2021, 收益率的非对称分布与尾部蕴含的 Alpha, 东方证券.\n\n+   ② Oordt, M.\
    \ V., & Zhou, C., 2016, Systematic tail risk. Ssrn Electronic Journal, 51."
