  md: '# 高频上行波动占比


    ```

    高频上行波动占比 = \frac{\sum_t (r_i^t I_{\{r_i^t>0\}})^2}{\sum_t (r_i^t)^2}

    ```


    # 其中


    +   ① $r_i^t$ 为分钟频率下的股票收益序列，如1分钟、5分钟、10分钟等；

    ② 在任意选股时刻，因子值为前N日指标的均值，如月度选股，计算因子值时使用的是股票过去20个交易日的均值；

    ③ 还可计算高频下行波动占比，只需将 $I_{\{r_i^t>0\}}$ 改为 $I_{\{r_i^t<0\}}$ 即可。


    # 说明


    股票高频收益的上行波动衡量了股票价格拉升的特征。假设有两只股票在过去一段时间内有着相同的涨幅，其中一只股票的涨幅由持续稳定d的小幅上涨累计带来，而另一只股票的上涨源自于股票短期的大幅拉升，那么后者更有可能在收益上出现反转，而后者在因子值上也会体现出较高的上行波动率。


    > 【参考文献】

    冯佳蓉, 姜林菡, 2017, 谈谈因子之已实现波动分解, 海通证券.'
  merge: -1
  img_proc: true
