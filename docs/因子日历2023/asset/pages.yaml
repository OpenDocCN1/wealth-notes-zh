    流动性经营负债 = 流动负债中剔除金融负债相关科目后剩余的部分

    ≈ 流动负债 - (短期借款 + 交易性金融负债 + 应付票据 + 一年内到期的非流动负债)


    平均总资产 = (期初总资产 + 期末总资产) / 2


    # 说明


    流动性经营负债主要指流动性负债中的各类应付款项，对应的是企业的财务义务，可靠性高，盈余操作空间小，与股票未来收益正相关。


    # 【参考文献】


    > Richardson, Scott A., Richard G. Sloan, Mark T. Soliman, and Irem Tuna, 2005,
    Accrual reliability, earnings persistence and stock prices, Journal of Accounting
    and Economics 39, 437-485.'
