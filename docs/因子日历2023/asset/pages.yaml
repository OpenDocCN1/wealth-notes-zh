  md: '# 基本面隐含收益


    在第 t 月末，对入选的基本面因子计算时间尺度为 L 个季度的移动平均线：


    $MA_{i,t,L}^{k} = \frac{F_{i,t} + F_{i,t-1} + \cdots + F_{i,t-L+1}}{L}$


    每月末，使用这些基本面因子移动均值与下一期的收益率做截面回归：


    $R_{i,t} = \alpha_t + \sum_{k=1}^{K} \sum_{L=1,2,4,8} \beta_{L,t}^{k} MA_{i,t-1,L}^{k}
    + \varepsilon_{i,t}$


    每月末，使用这些基本面因子移动均值与下一期的收益率做截面回归：


    $FIR_{i,t} = \sum_{k=1}^{K} \sum_{L=1,2,4,8} E_t[\beta_{L,t+1}^{k}] MA_{i,t,L}^{k}$


    # 其中


    +   ① $F_{i,t-j}$ 为 t 月股票 i 的第 k 个基本面因子在滞后 j 个季度后的取值；


    +   ② $R_{i,t}$ 为股票 i 在 t 月的收益率；


    +   ③ K 为选取的基本面因子个数，作者共选取了 7 个基本面因子：ROE 净资产收益率、ROA 总资产收益率、Earnings per share 每股盈利、APE
    基于应计项目的经营性利润比净资产、CPA 基于现金流的经营性利润比总资产、GPA 毛利润比总资产、Net payout ratio 净派息率。


    # 说明


    FIR 既综合了多方面基本面信息，又考虑基本面数据的变化趋势。


    【参考文献】


    Huang Dashan, Zhang Huacheng, Zhou Guofu, 2019, Twin Momentum: Fundamental Trends
    Matter, Available at SSRN: https://ssrn.com/abstract=2894068.'
