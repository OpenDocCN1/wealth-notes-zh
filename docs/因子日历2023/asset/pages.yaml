  md: '# 收益季节性


    ① t 月的月末，计算去年同月（t-12月）的月超额收益率，即得到 1年期的收益季节性。


    ② 在 t 月的月末，计算滞后 2-5 年的相同日历月超额收益率的均值，即得到 2-5 年期的收益季节性。


    # 其中


    滞后的月份数需满足12的倍数。


    # 说明


    作者发现股票收益存在季节性，未来收益可以用过去同期的收益来预测；某只股票在过去某个月份的表现优（差）于其他股票，在下一个相同日历月的表现通常是继续优（差）于其他股票。


    > [参考文献]

    Heston, S. L. and R. Sadka, 2008, Seasonality in the cross-section of stock returns.
    Journal of Financial Economics 87(2), 418-445.'
