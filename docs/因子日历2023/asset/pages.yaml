    - min(最近K个月日度收益率序列)


    # 说明


    作者用最小收益率来检查极端回报和波动率之间关系，如果异常收益是由波动率推动的，MIN应该存在与MAX相反的效果，比如，如果投资者有偏斜偏好，那么回报为负偏的股票应该要求更高的回报。


    【参考文献】


    Bali, Turan G., Nusret Cakici, and Robert F. Whitelaw, 2011, Maxing out: Stocks
    as lotteries and the cross-section of expected returns, Journal of Financial Economics
    99, 427-446.'
