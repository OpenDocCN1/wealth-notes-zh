  md: '# 02 10 月 Oct.


    星期一 八月十八 宣 分析师


    # 异常分析师覆盖


    分析师因子


    每月底对全市场（中证全指成分股）以分析师覆盖的对数为Y，同期 的市值对数、换手的对数、动量因子为X，进行横截面回归，回归残 差即为异常分析师覆盖：


    ```

    ln(1 + COV_{i,m}) = β₀ + β₁ SIZE_{i,m} + β₂ LNTO_{i,m} + β₁ MOM_{i,m} + ε_{i,m}

    ```


    # 其中


    +   ① COV_{i,m} 为第 i 值股票第 m 个月底的简单分析师覆盖或分析师总覆盖；

    ② SIZE_{i,m} 为第 m 个月底的总市值对数；

    ③ LNTO_{i,m} 为截止 m 月底时过去3个月日均换手率对数；

    ④ MOM_{i,m} 为截止 m 月底时过去3个月收益率。


    # 说明


    作者将分析师覆盖分解为2部分：①能够被市值、换手和动量解释的预期内的分析师固有覆盖；②对应残差部分的异常覆盖；异常覆盖更能够反映分析师的选择性偏差等行为，股票的超额收益主要和异常覆盖有关。


    [参考文献]

