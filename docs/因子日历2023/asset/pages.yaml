  md: '# 消费指数变动


    将每个公司一个月的销售额汇总得到每月的消费指数：


    ```

    SALESINDEX(i,t) = (∑_{θ_t} DailyTotalSales(i,θ_t)) / (∑_{θ_t} DailyAdjustmentIndex(i,θ_t))

    ```


    计算月度消费指数的年度同比变动：


    ```

    ΔSALES(i,t) = [SALSEINDEX(i,t) − SALSEINDEX(i,t−12)] / SALSEINDEX(i,t−12)

    ```


    # 其中


    +   ① DailyTotalSales(i,θ_t) 为消费板块上市公司 i 的每日销售额；


    +   ② DailyAdjustmentIndex(i,θ_t) 为消费板块上市公司 i 的消费者数量调整指数。


    # 说明


    消费数据与公司未来三个季度的盈收正相关，在非必需消费品板块中，这种关系不仅在大盘股中表现明显，在小盘股中表现的更加明显；与股票未来收益正相关。


    # 【参考文献】


    > Gupta Tarun, Leung Edward, Roscovan Viorel, 2022, Consumer Spending and The
    Cross-Section of Stock Returns, Journal of Portfolio Management 48 (7), 117-137.'
