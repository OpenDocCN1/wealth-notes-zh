  md: '# 产能利用率提升


    财务质量因子-改进


    以当天最近N个季度的营业总成本作为Y、以对应季度的固定资产作为X，进行OLS线性回归，回归前需对营业总成本和固定资产进行Z-Score标准化处理；回归得到的最近一个季度上的残差
    ε₀ 即为 OCFA在当天的因子值：


    ```

    TotalOperationCost_i = a_i + β_i FixedAssets_i + ε_i

    ```


    # 其中


    i ∈ {0,1,2,...,N−1}，默认 N = 8。


    # 说明


    产能利用率反映企业营运效率，刻画了公司将生产设备用于生产工作的利用程度。生产设备作为一种固定成本，不会像原材料等变动成本那样会随着产量而改变，所以对于设备等固定设施的利用率的高低一定程度上决定了最终实际平均成本的高低，利用率越高，摊销到单位产品上的平均实际成本就越低，企业的营运效率就越高。


