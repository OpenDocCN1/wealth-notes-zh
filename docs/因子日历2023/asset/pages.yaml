  md: '# 累计振动升降指标


    技术因子-趋势型


    ```

    A = ABS(HIGH-CLOSE[1])

    B = ABS(LOW-CLOSE[1])

    C = ABS(HIGH-LOW[1])

    D = ABS(CLOSE[1]-OPEN[1])

    E = CLOSE-CLOSE[1]

    F = CLOSE-OPEN

    G = CLOSE[1]-OPEN[1]

    X = E+0.5F+G

    K = MAX(A,B)

    R = IF(A>B AND A>C, A+0.5B+0.25D, IF(B>A AND B>C, B+0.5A+0.25D, C+0.25D))

    SI = 16*X/R*K

