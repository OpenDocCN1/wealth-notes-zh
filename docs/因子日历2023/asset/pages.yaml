  md: '# 净经营资产收益率


    财务质疑因子-盈利能力


    最近12个月的经营利润(TTM)

    平均净经营资产


    其中


    平均存货 = (期初净经营资产 + 期末净经营资产) / 2


    经营利润 = 净利润(含少数股东损益) - 非经常性损益 + (财务费用 - 利息净收入) * (1-25%)


    净经营资产 = 股东权益合计(含少数股东权益) + 金融负债 - 金融资产 = 经营性资产 - 经营性负债


    # 说明


    将计算传统ROE时的净利润和净资产拆分成经营活动部分和金融活动部分，只使用纯经营性业务对应的净利润和净资产来计算RNOA，剔除了金融活动的影响，更客观反映了企业的真实的盈利能力。


