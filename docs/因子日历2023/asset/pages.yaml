    取当天最近N个季度的营业收入（revenue）和营业成本（cost）数据，并进行Z-Score标准化处理；


    将标准化后的营业收入对营业成本进行OLS线性回归，回归得到的最近一个季度上的残差 ε₀ 即为RROC在当天的因子值：


    ```

    Revenue_i = a_i + β_i Cost_i + ε_i

