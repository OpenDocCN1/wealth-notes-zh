  md: '# 残差动量-基于FF3


    使用过去36个月（即：T-36至T-1）的收益率数据，构Fama-French三因子模型，得到残差序列，利用T-12到T-2这11个月的残差计算残差动量：


    ```

    r_{i,t} = α_i + β_{1,i} RMRF_i + β_{2,i} SMB_t + β_{3,i} HML_t + ε_{i,t}

    ```


    ```

    residualmom_{i,t} = \frac{\sum_{T-12}^{T-2} ε_{i,t}}{\sqrt{\sum_{T-12}^{T-2} (ε_{i,t}
    - \bar{ε}_i)^2}}

    ```


    # 说明


    基于渐进的信息扩散假说（gradual-information-diffusion），信息在投资者之间的扩散是缓慢的，而且相比于影响所有公司的公共事件，投资者对于那些针对公司的特定事件的反应则更加迟缓，这就形成了残差动量。


    # [参考文献]


    ① Blitz, David, Joop, Huij, and Martin Martens, 2011, Residual Momentum, Journal
    of Empirical Finance 18(3), 506-521.


    ② Blitz, D., M. X. Hanauer, and M. Vidojevic, 2020, The idiosyncratic momentum
    anomaly, International Review of Economics & Finance 69, 932-957.'
