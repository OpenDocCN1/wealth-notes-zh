    +   ① β₁ 为卖出非流动性系数；

    ② β₂ 为买入非流动性系数；

    ③ S_{i,t} 为股票 i 在 t 时间区间内的主动卖出金 额；

    ④ B_{i,t} 为股票 i 在 t 时间区间内的主动买入金 额。


    # 说明


    卖单非流动性衡量了高频数据下主动卖出的交易金额对于股票价格变动的影响；卖单非流动性在控制风险后的Fama-MacBeth截面回归对收益率显著，且预测效果要好于买单非流动性，主要是由于投资者存在亏损厌恶的心理。


