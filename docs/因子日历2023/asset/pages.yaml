- pgno: 171
  md: '# 特质偏度


    最近K个月CAPM/FF3-factor model回归的残差的偏度：


    ```

    IdoSkew_i = (1/T Σ_{t=1}^T ε_{it}^3) / (1/T Σ_{t=1}^T ε_{it}^2)^{3/2}

    ```


    # 其中


    +   ① CAPM 回归：


    r_{i,t} - r_{f,t} = α_i + β_i (r_{m,t} - r_{f,t}) + ε_{i,t}


    +   ② FF3-factor model 回归：


    r_{i,t} = α_i + β_{1,i} MKT_t + β_{2,i} SMB_t + β_{3,i} HML_t + ε_{i,t}


    +   ③ 偏度计算公式为：


    IdoSkew_i = (1/T Σ_{t=1}^T ε_{it}^3) / (1/T Σ_{t=1}^T ε_{it}^2)^{3/2}


    # 说明


    特质偏度为特质收益的偏度，其与股票收益负相关，属于低风险异象。


    > [参考文献]

    Boyer, Brian, Todd Mitton, and Keith Vorkink, 2009, Expected idiosyncratic skewness,
    Review of Financial Studies 23, 169-202.'
