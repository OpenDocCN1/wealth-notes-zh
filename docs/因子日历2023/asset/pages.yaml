  md: '# 条件风险价值


    波动率因子


    ```

    CVaR_α = - (∫₀^α VaR_r(X) dr) / α


    CVaR_α = E[X | X < VaR_α]

    ```


    # 其中


    +   ① α 为置信水平，通常取95%。


    # 说明


    CVaR指的是在一定的置信水平 α 下，某一金融资产或证券组合价值在未来特定时期内超出VaR的那部分损失的条件期望；CVaR不仅考虑了不利情况（损失超过VaR）发生的概率，而且考虑了不利情况发生时的损失程度（超过VaR的那部分损失的条件期望值），有效的改善了VaR在处理损失分布的后尾现象时存在的问题。


    > 【参考文献】

    R. T. Rockafellar, S. Uryasev, 2000, Optimization of conditional value-at-risk,
    Journal of Risk 2(3), 21-41.'
