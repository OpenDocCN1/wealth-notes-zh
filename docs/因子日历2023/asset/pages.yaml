  md: "# 10 4月 Apr.\n\n星期一\n闰二月二十\n宣 高频\n\n# 价格自相关性合成因子（双序列差分）\n\n高频因子\n\n```\nCDPDP\
    \ = (dP+ dP+ Corr - mean(dP+ dP+ Corr)) / std(dP+ dP+ Corr) + (dP- dP- Corr -\
    \ mean(dP- dP- Corr)) / std(dP- dP- Corr)\n```\n\n+   ① 每月月底，回溯每只股票过去20个交易日，每日先将该股票的分钟盘价序列做一阶差分，整理得到两个序列，ΔPₜ与ΔPₜ₊₁序列，其中，ΔPₜ\
    \ = Pₜ - Pₜ₋₁；\n\n+   ② 分别取两个序列中，ΔPₜ > 0 且ΔPₜ₊₁ > 0 的部分，计算相关系数同时取20日的平均值，得到子因子\
    \ dP+ dP+ Corr；取 ΔPₜ > 0 且 dP- dP- Corr 的部分，按相同逻辑计算得到子因子；\n\n+   ③ 将两个子因子各自横截面标准化，再等权线性组合得到价格自相关合成因子（双序列差分）CDPDP。\n\
    \n# 说明\n\n价格自相关性合成因子(双序列差分)与价格自相关性因子(单序列差分)的逻辑相通，即：不希望股价连续出现大幅上涨或大幅下跌的变动，因子取值越低的股票，未来收益表现越好。\n\
    \n> [参考文献]\n sark子剑, 2021, CPV因子移位版,价格自相关性中隐藏的选股信息, 东吴证券."
