  md: '# 30


    12 月 Dec.


    星期六

    十一月十八

    宣 技术


    # 随机指标


    技术因子-超买超卖型


    ```

    RSV = 100*(CLOSE-MIN(LOW,N))/(MAX(HIGH,N)-MIN(LOW,N))

    ```


    ```

    K = SMA(RSV,M1,1)

    ```


    ```

    D = SMA(K,M2,1)

    ```


    ```

    J = 3*K-2*D

    ```


    SMA(X,N,M)为加权移动平均: Y = (X*M+Y''*(N-M))/N


    默认: N = 9、M1 = 3、M2 = 3


    # 说明


    KDJ主要是研究最高价、最低价和收盘价之间的关系，同时综合了动量观念、强弱指标及移动平均线的优点，所以能够比较直观地研判行情，被广泛用于股市的中短期趋势分析中；K与D值永远介于0到100之间，D大于70时，行情呈现超买现象，D小于30时，行情呈现超卖现象。


    [参考文献]


    常规通用技术指标.'
