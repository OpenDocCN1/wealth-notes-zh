- pgno: 188
  md: '# APM因子


    对选定股票，回溯取其过去20日数据，记逐日上午的股票收益率为 $r_t^{am}$，指数收益率为 $R_t^{am}$；逐日下午的股票收益率为 $r_t^{pm}$，指数收益率为
    $R_t^{pm}$；


    将得到的40组上午与下午（$r,R$）的收益率数据进行回归：$r_i = \alpha + \beta R_i + \varepsilon_i$，得到残差项
    $\varepsilon_i$；


    以上得到的40个残差 $\varepsilon_i$ 中，上午残差记为 $\varepsilon_i^{am}$，下午残差记为 $\varepsilon_i^{pm}$，进一步计算每日上午与下午残差的差
    $\delta_t = \varepsilon_t^{am} - \varepsilon_t^{pm}$；


    构造统计量 stat 来衡量上午与下午残差的差异程度，计算公式如下（$\mu$ 为均值，$\sigma$ 为标准差）：$\text{stat} = \frac{\mu(\delta_t)}{\sigma(\delta_t)/\sqrt{N}}$


    为了消除动量因子影响，将统计量 stat 对动量因子进行横截面回归：$\text{stat}_j = b \text{Ret}20_j + \varepsilon_j$，其中
    Ret 20 为股票过去20日的收益率，代表动量因子；回归得到的残差值 $\varepsilon$ 即为 APM 因子。


    # 说明


    基于 “知情交易者更加倾向于在每日上午进行交易，上午的价格行为蕴藏了更多可用于选股的信息量” 的想法，构建了刻画了股票上午与下午的价格行为差异程度的 APM
    因子；改进的 APM 因子是将个股和指数的上午收益 $r_t^{am}$ 替换成了隔夜收益 $r_t^{overnight}$。


    【参考文献】

    魏建榕, 2020, APM因子模型的进阶版, 开源证券.'
