  md: '# 货币流量指标


    技术因子-超买超卖型


    ```

    TP = (HIGH+LOW+CLOSE)/3

    MF = TP*VOL

    PF(N) = SUM(IF(TP>TP[1],MF,0),N)

    NF(N) = SUM(IF(TP<=TP[1],MF,0),N)

    MR(N) = PF(N)/NF(N)

    MFI = 100-(100/(1+MR))

    默认: N = 20

    ```


    # 说明


    MFI指标是RSI扩展指标，MFI指标用成交金额代替的指数，是某一时间周期内上涨的成交量之和与下跌的成交量之和的比率。MFI>80为超买，当其回头向下跌破80时，为短线卖出时机。MFI<20为超卖，当其回头向上突破20时，为短线买进时机。


    【参考文献】

