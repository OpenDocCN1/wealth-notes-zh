    # 说明


    BR指标是反映当前情况下多空双方力量争斗的结果。它以前一日的收盘价为基础，与当日的最高价、最低价相比较，通过昨日收盘价在股价中的地位反应市场买卖的人气。BR最好与AR结合使用，BR、AR均急跌，表明股价已到顶，反跌在即，投资者应尽快出货；BR比AR低，且AR<50，表明股价已经到底，投资者可吸纳低股；BR急速高升，而AR处在盘整或小跌时，表明股价正在上升；BR>AR，又转为BR<AR时，也可买进；BR攀至高峰，又以50的跌幅出现时，投资者也可低价进货，待股价升高再卖出。


