  md: '# 成交量占比


    开盘集合竞价成交量占比因子 OCVP：


    OCVP_t = 1/d ∑_{i=1}^{d} w_{t-i} ( 每日开盘前集合竞价阶段成交量 VOL_{call} / 日内个股总成交量 VOL_{total}
    )_{t-i}


    收盘集合竞价成交量占比因子 BCVP：


    BCVP_t = 1/d ∑_{i=1}^{d} ( 收盘前5分钟内个股成交量 VOL_{call} / 日内个股总成交量 VOL_{total} )_{t-i}


    成交量占比复合因子：


    OBCVP_t = α OCVP_t + (1 − α) BCVP_t


    # 其中


    w_i 为开盘集合竞价期间不同时间点上的成交量加权权重，可以是等权，也可以是时间衰减权重；α 是2大成交量占比因子的复合权重。


    # 说明


    集合竞价阶段是反映投资者行为信息的重要时点，集合竞价成交量因子能反映多空双方之间的博弈，集合竞价成交量占比越低，股票次月的收益率越高。


    【参考文献】


    邓均伟, 2017, 见微知著:成交量占比高频因子解析, 光大证券.'
  merge: -1
  img_proc: true
