  md: '# 操纵性总应计盈余


    分行业分年度进行如下截面回归：


    TA_{i,t} / A_{i,t-1} = α_{i,1} 1/A_{i,t-1} + α_{i,2} ΔREV_{i,t} / A_{i,t-1} +
    α_{i,3} PPE_{i,t} / A_{i,t-1} + ε_{i,t}


    将上述回归得到的回归系数代入下面的方程，即得到非操纵性总应计盈余：


    NDTAC_{i,t} = α_{i,1} 1/A_{i,t-1} + α_{i,2} (ΔREV_{i,t} - ΔREC_{i,t}) / A_{i,t-1}
    + α_{i,3} PPE_{i,t} / A_{i,t-1}


    将非操纵性总应计盈余从总应计盈余中扣除：


    DTAC_{i,t} = TA_{i,t} / A_{i,t-1} - NDTAC_{i,t}


    # 其中


    +   ① TA_{i,t} 为股票 i 在 t 期的总应计盈余，计算细节见相关页；

    ② A_{i,t-1} 股票 i 在 t-1 期的总资产，用于标准化各财务指标；

    ③ ΔREV_{i,t} 为股票 i 在 t 期相对 t-1 期的营业收入增加额；

    ④ ΔREC_{i,t} 为股票 i 在 t 期相对 t-1 期的应收账款增加额；

    ⑤ PPE_{i,t} 为股票 i 在 t 期的期末固定资产总额。


    # 说明


    上述计算方法对应的是修正后Jones模型，只需去掉应收账款项就能得到原始的Jones模型；总应计盈余可以分为非操纵性总应计盈余和操纵性总应计盈余2部分，其中的操纵性应计盈余对应的就是企业出于某种动机而进行的盈余管理，其与股票未来收益负相关。


    【参考文献】


    ① Dechow P., Sloan R., Sweeney A, 1995, Detecting Earnings Management, The Accounting
    Review 70(2), 193-225.


    ② Jones J., 1991, Earnings Management During Import Relief Investigations. Journal
    of Accounting Research 29(2), 193-228.'
