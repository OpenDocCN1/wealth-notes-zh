  md: '# 北上交易行为因子


    北上交易行为因子为如下MHold、DV2DV_STD、DV2Hold_MAXCP和DV2ABSDV_MAXVOL的等权合成：


    MHold = mean(过去20交易日的曰度持仓市值)


    DV2DV_STD = = mean(过去20个交易日的曰度净流入量) / std(过去20个交易的曰度流入量)


    DV2Hold_MAXCP = mean(股价最高3个交易日的曰度净流入量) / mean(过去20交易日曰度持仓量)


    DV2ABSDV_MAXVOL = mean(交易量最高3个交易日的曰度净流入量) / mean(过去20交易日的曰度净流入量绝对值)


    # 说明


    北上交易行为主要是指北上资金的流入流出情况。如果股票的北上资金持续流入较多，且流入量较为稳定，说明该股票受到了理性的北上资金的持续追捧，未来收益可期（DV2DV_STD）；如果在过去股价最高的几天还有北上资金加速流入，说明当前股价处于一个较有吸引力的位置，未来收益可期（DV2Hold_MAXCP）；如果北上资金在股票放量时仍加速进入，说明北上资金看好该股票（DV2ABSDV_MAXVOL）。


    【参考文献】


    朱剑洋, 张惠源, 2020, 从北上资金中提炼的系列 alpha 因子, 东方证券.'
