    它入侵到一种叫“海猴子”的虾体内，让虾颜色变红，并让他们有一种喜欢聚在一起的偏好。火烈鸟以这种虾为主食，当这些虾变红又聚集在一起，在水面上就非常显眼，很容易被火烈鸟发现并吃掉。


    这种寄生虫因此就顺利进入到火烈鸟的肚子里，并开始繁殖，随后通过火烈鸟的粪便排泄出来，它们又回到水里生活，生长一段时间以后，它们又重演一遍刚才我们讲的那个游戏。


