    # 现代商业大家不愿意说破的一个秘密


    现代商业大家不愿意说破…


    ## —— 知识笔记 ——


    ## 病毒的生存策略


    病毒是一种核酸分子，就是我们经常说的DNA和RNA，它与蛋白质构成的一种又像是生命，又不是生命的东西。它没有细胞结构，它是那种借壳上市、借尸还魂的那样一种生存方式。


    病毒其实也可以理解成为一种“魔”，它进到细胞里以后它自身不能够复制，它就给细胞发送指令，让细胞本身在复制的时候也同时也在复制这种病毒。


    ## 那些像“病毒”的公司


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_13_0.png)


    某一类的跨国公司的成长方式很像病毒，比如雀巢，他们到一个相对比较落后的地区和国家，他会迅速地发展，迅速地繁殖。


    把那些看得见摸得着的，原本根本不属于他的那些资源做为他公司的一部分，实际上他就是一个品牌和一套管理技术而已。


    还有一种很典型的就是酒店，其实那些酒店并不是万豪盖的，也不是香格里拉盖的，但你一进到酒店，你就觉得那就是“某某”酒店了，这也是一种病毒式的成长策略。


    ## 病毒式营销


    过去一说到病毒式营销，常常只是指它这种传染性，一传十，十传百这样一种特性。


    其实病毒真正的特性，就在于它本身是类似于一种源代码的东西，一种核心的指令，它一旦侵入到一个有形的生物体或者一个组织，一个区域、一个组织里头，它就借尸还魂，不断地复制、不断地成长。


    他营销的过程就是成长的过程，甚至你都不觉得那是营销。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_13_1.png)


    ## 观念病毒


    《人类简史》里提到的一个概念——“观念病毒”，其实就是他所讲的那个“故事”。


    作者尤瓦尔·赫拉利是犹太人，犹太人的民族最后穷到连国家都没有，完全不拥有土地，任何看得见摸得着的东西都没有。所有的人都流浪在世界各地，而且经常受到别人的追逼，甚至屠杀。但是他们有一个东西别人是摧毁不了的，就是他们头脑当中的“故事”。也就是那个《旧约圣经》所记载的那一整套的观念和历史。


    没有观念、没有“故事”、没有传承，有土地也会失去。


    有了观念、有“故事”、有了历史，没有土地最后还是有土地、还是有国家。


    所谓《人类简史》，作者认为就是一部人类的故事，人类讲故事的历史，就是 history，his story，就是讲故事的历史。


    我们现代社会的生产是由需求所驱动的。一种需求导致一种供给，但供给到一定程度就会饱和，饱和以后这个经济就没办法发展，只能再制造需求，在他看来需求就是“故事”，就是观念病毒。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_13_2.png)


    ## 例子1：毒瘾的需求


    这个状态有一点像吸毒，毒品并不是一种刚需品，但你一旦接触之后，你就得到了一种强烈的不可遏制的、不可压缩的需求就是极度的刚需。


    当毒瘾发作的时候，你会不惜一切代价去换毒品。但这不是你的需求，那是毒品贩子的需求，是毒品贩子将这个需求，悄悄地植入到你的大脑当中。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_13_3.png)


    ## 例子2：跑马拉松


    这个状态有一点像吸毒，毒品并不是一种刚需品。但你一旦接触之后，你就得到了一种强烈的不可遏制的、不可压缩的需求就是极度的刚需。


    当毒瘾发作的时候，你会不惜一切代价去换毒品。但是这不是你的需求，那是毒品贩子的需求，是毒品贩子将这个需求，悄悄地植入到你的大脑当中。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_14_0.png)


    马拉松本来是只跟最职业的运动员有关的运动，职业运动员你也必须要在比赛之前有两个半月持续的训练，要不然是很危险的。马拉松对人膝盖的伤害也非常大，它本质上是一种竞技运动，不是一种健身运动。


    但是这个东西从国外传过来，在中国流行，它给你制造了一种观念，跑马拉松就意味着时尚、炫酷、中产，当一群人坐在饭桌上在谈马拉松没“全马”，也跑个“半马”，也跑个“四分之一马”的时候，你一马都不马，你就会觉得自己很边缘、很low。


    病毒的特点就是让你不由分说，让你身不由己，让你苦中作乐，让你就是咬着牙也要去消费。普通的消费是满足普通的需求、普通的欲望，这种消费是满足于你变得不普通的那样一种欲望。


    ## —— 延伸思考 ——


    - 1. 你中过哪些“观念病毒”？

    - 2. 我们可以怎样抵抗“观念病毒”？


