    ## 11.2 | 为什么说狗驯化了人类？


    ### —— 知识笔记 ——


    ## 人口与狗口


    城市化带来人口的减少。


    发达城市的出生率通常偏低，最典型的是新加坡。它的出生率是持续的下降，甚至降到了种族灭绝的节奏，出生率低于1。


    保持人口稳定的生育率是2.1，在法国，政府花了很大的代价，各种鼓励措施，让大家多生孩子，它的出生率还只有1.98。其中外来的阿拉伯人，黑人，贡献了主要的生育率，所以有人说城市化是特效的避孕药。


    城市的出生率在下降，但狗的出生率却在增加。


    狗是一个非常成功的物种，它对人类形成了一种叫做逆向驯化的功能。就是本来是人在驯化狗。但是狗在不知不觉，好像是驯化人，人越来越离不开狗，而且把大量的资源都耗费在它身上，导致整个地球的狗口爆炸。


    跟它可以相比的一个物种，是小麦，本来只是两河流域的一种野草，经过人类的驯化，它能够稳定地给人类提供粮食，所以人类就不停地种，这个物种就满世界传播，现在地球面积的有很大一部分都被小麦占据了。《人类简史》的作者赫拉利说，表面上它是在服务人类，实际上它是让人类在服务它。


    ## 狗是怎么与人合作的


    狗的祖先是狼，狼只吃肉，处在食物链的高端。


    到了冬天，食物供给严重不足的情况下，狼还不冬眠。


    人也不冬眠，所以人和狼一直是对立状态，他们要在冬天争夺食物。


    - 1. 不抢夺食物


    吃骨头：


    一些处于弱势地位的狼，比如说怀孕的狼，它们发现如果一头鹿被狼打了，它们是吃不着的。如果被人大了，它们可以吃人不吃的骨头。狼牙非常尖利，它能把骨头咬穿，吃骨头里的骨髓。


    这些弱狼们会追踪人的足迹，悄悄地趴在他们的宿营地外面，等着人类吃完肉以后把骨头扔出来。


    这些离开狼群的弱狼，与人的洞穴保持一定的距离，在狼和人之间找到一片生存地盘。


    长年啃骨头，使得这些离群索居的狼已经对骨头形成了一种基因层面的迷恋。这也是为什么狗爱啃骨头。


    吃人的排泄物：


    这些狼为了不跟人形成竞争，避免生态位重叠。它们就要吃那些人不要的东西。


    用管理学的话说，那就是要找一个“蓝海”。这些狼学会了吃人屎。


    一方面满足了狼的食物需求，没有与人形成竞争；另一方面还替人打扫了卫生。


    利基市场：


    大家都不碰这个地方，大家都不感兴趣，而你找到这个地方以后，用不着去竞争，你就能够活得不错。


    - 2. 与人合作


    跟人主动合作，对人有贡献，于是人与狼形成某种利益交换。


    ## 利基市场：


    大家都不碰这个地方，大家都不感兴趣，而你找到这个地方以后，用不着去竞争，你就能够活得不错。


    ## 2.与人合作


    跟人主动合作，对人有贡献，于是人与狼形成某种利益交换。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_25_0.png)


    ## 贡献安全：


    它游荡在人的住所周围，当出现对人有威胁性的动物，有什么异常的情形出现的时候，它们会报警，提醒人类有危险。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_25_1.png)


    ## 辅助性服务：


    当人跟狼去争夺猎物的时候，作为人的狩猎的一个辅助性的角色，利用嗅觉追踪动物。兔子几个小时之前从这儿经过，它一闻它就能闻到，它能把人带到那个兔子窝去。


    由于长期在黑暗当中做一个守望者，它的视觉就发生了变化。晚上，看不见颜色，它需要捕捉的信息是关于形状和动态的这种信息，所以狗在进化过程中逐渐变得只能看见黑白两种颜色，狗的世界是一个黑白世界。


    ## 狗为什么那么“好”


    狗在被人类驯化过程中经历了人为选择，那些又像狼又像狗的动物，生下了一窝小动物之后，人类会把那些性情比较猛烈的摔死，把那些对人非常温顺，非常忠诚，又对猎物非常凶猛的小动物留下来。经过三十代，它的性状就会固化。


    因此，现在的狗才具备了忠诚、敏捷等很多很好的品质。


    ## 狼与狗数量对比


    狼非常凶悍，经常抱团作战，但随着人的地盘越来越大，现在已经是一种濒危动物。电影《狼图腾》找不到足够多的狼，总共就七匹狼，所以画面不好看。


    狗的数量一直都在增长，有数字统计美国人每年的狗粮消耗量可以养活所有非洲饥饿的难民。


    狗是一种非常成功的物种，原因就在于它选择了一个独特的生态位，找到了蓝海市场，而且能够跟强势的物种形成战略联盟。这种蓝海加上战略联盟，使得这个物种到了无往不胜的地步。人类的人口在大城市已经出现下降的趋势，且人口增长的速度远比不上狗口膨胀的速度。这样看来，狗的生存策略是不是非常的成功？


