    ## 发刊词 | 吴伯凡：提高你的知识账户的“净资产”


    开设《伯凡日知录》的想法，始于我在自己的私塾上一次互动。


    一天，我问道：“有一种动物堪称中国的国宝，虽然我们从没这样称呼过它，却是什么？”大家知趣地没有提到熊猫，但全都是一脸茫然。


    “它可以说是一种改变了世界历史的动物。正是因為有了它，我们的祖先才创造出一种让整个世界惊叹、珍视的产品。这种产品奠定了西方世界对于中国最初的想象和向往，也开创了东方与西方文明互联互通的历史。”


    我说完这些的时候，好几个学生异口同声地说出了答案——蚕。


    看上去如此弱小的蚕，竟然“吐”出了一条穿越荒漠与高山，把汉帝国与罗马帝国连接起来，并深刻影响了人类文明进程的路。


    在罗马帝国，丝绸的价值比等重的黄金还高，正是有了这种超高的价值，才有了这条“不可能的路”。这是贸易史上的一个规律：一种商品只有在价值上具备“高电压”，才可能克服巨大的“贸易电阻”，在“不良导体”上形成一条“电路”。


    现代商业史上类似的例子是“瑞士模式”——欧洲内陆山国瑞士以诸如手表、医药、金融服务等高值、低重（甚至无重）的产品，化解了这个国家明显的交通劣势。


    我接着问：“在汉语里，‘蚕’与‘禅’发音相近，二者之间有没有什么隐秘的关系？”


    一个学生略带犹豫地说：“佛教东传和玄奘取经之路，有很大一部分是与丝路重合的……”


    他说得对，佛教东传之路的“主干线”是丝路，换言之，没有蚕，也许就没有作为中国本土化佛教的禅。


    丝路首先是“无中生有”的贸易之路，随后是传教之路。德国哲学家卡西尔说：“风平浪静时人是想不起上帝的，只有在充满风险和不确定的地方，信仰和祈祷才会盛行。”当商人们踏上这条希望和风险同样巨大的道路时，包含许愿、还愿的信仰已经是一种“刚需”，所以不难理解丝路上的重镇敦煌同时也是佛教圣地。


    这次互动让我有了冲动，要在网上开设一个与私塾很不一样、面向很多人的“知识账本”。


    账本的作用，是管理你的净资产。知识账本的作用，是帮你建立每天可以获取红利的知识资产银行。


    它能一点点激活你的知识存量，在知识中寻找见识。它从一个你自以为熟悉的小故事讲起，但小故事里有容易被忽略的历史细节，有不说不知道一说吓一跳的商业和文化逻辑。小逻辑反过来或许让你对熟悉的小故事刮目相看，或许让你对略有所说的原理和学说有了真切的感悟。你的信息和知识存量似乎又有明显的增量。


    它能日复一日地帮你打理知识资产，把无序变有序。让听者把相对碎片化的知识连接起来，完成一个个知识上的“拼图游戏”。日积月累，这些拼出来的图又有可能作为一个个“碎片”，拼成更新、更大的图像。


    乔布斯说，创新就是“连点”（Connecting dots）。“点”是存量，是本来就在那儿但是只是散散拉拉在那儿，让我们不以为意、视而不见的资源存量，而创新就是发现一条看不见的线，用这条线将散乱的点连接起来，呈现出一个令人耳目一新的图像。散乱、零碎的点在我们的头脑中不仅毫不匮乏而且高度过剩。真正匮乏的是“连点”的意识和能力。


    有了开设“知识账本”的设想后，我就开始想这个专栏的名称。最终取用“日知录”一名，出于两个机缘。


    一个机缘是有一次我感受到了一种前所未有的恐慌。


    我一直有记“知识日记”的习惯。阅读时遇到有意思的新知识、新感悟，就用简短的话记下来，一是为备忘，二是为消化。


    一年多前，我在翻看自己的知识日记时，发现自己记的内容越来越少。我知道并非自己的阅读时间少了。习惯于在手机和平板电脑上阅读后，每天阅读的总时间反而多了，但为什么日记越记越少了呢？


    首先是因为电子阅读“做笔记”更方便了。看到有意思的内容，可以随手拷贝粘贴到备忘录里，可以收藏起来，留待日后再看。两年的时间里，我粘贴在“备忘录”、“印象笔记”里的文档竟然有2800多个，收藏的内容有900多条。


    我尴尬地发现，收藏即封藏，粘贴即冷冻，如此多的内容，我当时认真读过的不多，回头细读的更少。每天的随手收藏和粘贴，让自己产生了一种自欺的获得感，“多鸟在林”让自己觉得“一鸟在手”不再需要似乎亦不再重要。


    对错过新知识、新信息的恐慌，让我孜孜不倦地粘贴、收藏，结果收获的是一堆与自己无关、完全经不起审计的知识和信息，而自己的知识账本上真正靠谱的“净资产”越来越少。于是，我体会到了一种从未有过的恐慌。


    恐慌之中我意识到，智能手机如同一个“高压水龙头”，随手打开就有应接不暇的信息和知识喷涌而出，自己每天都面临着不断被大量信息碎片充斥、知识日见混沌和无序的危险。


    这混沌和无序，就是自己知识和信息的“熵”。在信息技术日益发达的今天，“熵增”更是一种宿命。要想让自己的头脑避免持续增加的混沌，不断增加头脑中的“点”，不仅无益，而且会让无序更加无序。


    从那一天起，我决定重新认真地写知识笔记。这其实是在给自己做“知识审计”——今天我到底有没有、有多少知识增量？为了给自己有一种仪式感，我给自己的知识日记命名为“日知录”，这显然是从明末清初大学者顾炎武那里借来的。


    每天作“日知录”，迫使自己不再去关注大量“或许将来有用”、“捡到篮子里就是菜”的信息和知识，迫使自己尽可能减少闲逛式的浏览和搜索，带着认真思考过的问题去搜寻、识别信息和知识。


    写日知录的过程，是持续清除自己知识上的盲点和隐性盲点过程，也是持续发现（虽然同样也是永无尽头）自己的思维漏洞和隐性漏洞的过程。


    一段时间过后，发现这个方法不仅管用，而且有趣。我似乎找到了“连点”后的乐趣，而且这种乐趣绵绵不断。一位朋友交流日知录里的一些想法，他听完说，你应该把你的日知录做成专栏。


    再后来就是振宇兄突然邀我在得到上开设专栏。


    “但是，专栏叫什么名称呢？”我刚一答应，他就这样发问。他好像不是在问我，更像是在问他自己。


    眉头紧锁几分钟后，胖子既像在征询意见又像做决定地说：“我想到一个名称。不知道你怎么看？我看就叫‘伯凡日知录’吧。”


    我有点无奈又有点得意地对他点点头，说：“算你狠。就这样吧。”


