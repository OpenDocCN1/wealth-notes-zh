    # —— 知识笔记 ——


    # 寄生性成长


    寄生虫为完成生长和繁衍，像有一套精确又严格的流程化管理。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_11_0.png)


    例子1：寄生植物绞杀榕


    在热带雨林里，阳光渗透率不到2%，底下基本没有阳光，土地基本已经植物占领了，把种子全撒在地面上也没有生长的机会。


    绞杀榕的种子，鸟很爱吃。种子随着鸟粪排出，拉到树权上，它的种子就把鸟粪当作土壤开始发芽，发芽以后先长根，直到根碰到地，根已经扎得足够深的时候，获得了足够的养料的时候，才开始长叶、长藤。


    这时候它就缠在那棵树上开始疯长，最后会这棵树缠死。


    绞杀榕的中间是空的，那个空的就是那棵树，已经朽掉了。


    很多的公司在他们成立之初，选择了寄生性成长。


    他们让自己依附于已经成熟的公司上，一旦是各方面的资源、条件具备以后，他开始疯长，从而危及他原来的，他的宿主的利益。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_11_1.png)


    例子2：微软的寄生性成长


    比尔盖茨知道IBM在开发一种操作系统，同时他听说有一个叫基尔达尔的人在做一个操作系统叫DOS。


    他用5万美元买了DOS操作系统，修改了一下，在前面还加了一个名字叫MS-DOS（Microsoft DOS），然后把这个操作系统卖给了IBM。


    这个系统搭载着IBM的PC，卖遍了全世界。由于它的兼容性好，包括那些不是IBM生产的PC，它就成了计算机行业通行的一个操作系统。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_11_2.png)


    例子3：Google的崛起


    在20年前雅虎是最知名的互联网门户网站，雅虎做的是目录搜索，他引进了Google作为他的关键词搜索的其中的一个小环节，你上了雅虎以后，你可以直接用他的搜索引擎来搜索各种资料。差不多有两三年的时间吧，很多使用雅虎的人就不再使用其他的功能，只用那个Google的搜索的功能了，后来Google就顺理成章地独立出来，今天Google蒸蒸日上，雅虎可以说已经寿终正寝，被收购了。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_11_3.png)


    例子4：高太尉的成功


    有人采取寄生性成长的方式经营自己的人生，比如说高太尉，他其实刚开始只是一个踢球的，球踢得好，就是一帮闲，慢慢他坐到太尉的那个位置了，这也算是一种成功的，虽然是很卑鄙的成功的方式。


