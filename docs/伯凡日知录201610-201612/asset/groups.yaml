    ## 吴伯凡


    关于熊猫的问题，说白了就是关于福音和诅咒的问题，任何福音都可能是诅咒，英国商业哲学家查尔斯汉谟说过，我们越来越处于一个悖论的时代，就是说我们将面临着越来越多的事情越来越多的逻辑，都是充满了悖论，什么叫悖论呢？就是一种显性的逻辑里都包含着一种隐形的逻辑，任何一种逻辑一种套路里面，都隐藏着一种自我毁灭自我破坏自我颠覆的逻辑，一条路是怎么把你带向成功的，他也一定能把你带向失败。当我们在利用某种资源利用某路径在为自己谋利益的时候，你一定要想明白，此地不可久留，你走晚了，你一直逗留在这个地方甚至你只是走晚一点，你就可能被里头隐含的颠覆性的破坏性的逻辑给套住，最后不是死无葬身之地，而是死在你所谓的福地上。记得好像是洛克菲勒说过：如果你的眼前的盛况给你天堂般的感觉，那么接下来等待你的也许就是地狱。我们可以想像熊猫当年做为熊的一种，迁徙到秦岭这一带的时候，那它一定是有一种天堂般的感觉，四季都有植物，漫山遍野的竹子，但是它不知道竹子里头包含着诅咒，它不懂竹子有毒，这个毒是慢慢显现的。当你以它为主食，甚至以它为唯一的时候，那你就把自己推向了一个完全意识不到的大陷阱里头。

    那徐晔同学提到了塔勒布关于如何建立冗余的概念，我觉得非常好，这个问题一两个星期以后我会专门讲。这里只是简单的说一下，什么叫冗余。冗余有点接近于经济学里讲的那个外部性，就是跟当前的眼下的功能是不匹配的，但是它在另外的场景里头，跟另外的需求有一种潜在的匹配。如果
    你太关注内部性而忽略外部性的 话，你的生存路径你的生存策略就完全丧失弹性。一旦环境发生变化的时候，这种现在很有用但是完全丧失弹性的路径和策略将会把我们逼到死角。如果大家读一点佛教的著作的话，你会发现里面有大量的关于人不能把眼下的境况记得太真，一切都是姻缘和合，你眼前的这个路径这个环境不管看上去有多么的可靠多么的真实，但是说到底它是靠不住的。

    所以佛经里面讲：因无所住而生其心。还有心无挂碍，无挂碍故，无有恐怖。套用现在特流行的那句话说：你千万别当真，你当真你就输了。大家有兴趣的话，可以读读阿兰德（音）的书。阿兰德对于自由的定义是：无所求，无所待，无所靠，to
    expect nothing ，depend on nothing。他认为这样才算是自由，不管是个人还是企业，都面对一个极度不确定性的未来。如果 你把路径和策略已经固化到完全没有任何弹性的时候，或者说得风光处占尽风光，你的行为里头不再有冗余，你对于资源对于环境的态度是一种榨取的态度，exploitation，是一种榨取的，掠夺性利用的态度，而不是exploration，摸索、探索的态度的时候，那其实是在给自己下套。而且是一个最后没有解的套。无论是对企业还是对个人来说，应该有一种拥抱无用，拥抱冗余的心态，就像网友们说的，学会去交一个无用的朋友，找一个无用的爱好，找一个永远成不了景点的地方去旅游，收藏一个永远不能保值的旧东西，没有好处地去帮助人，像陪孩子一样的陪父母去看电视，和即将分手的人好好去看一场电影，研究一个无用的课题，收藏一种已经失传的传统工艺等等，这都是在培养自己有一种拥抱无用的那样一种心态。在很多时候，尤其是在一个不确定性的时代，做无用的事情，也许是最有用的，千万不要跟熊猫学，一旦得手，就全然不顾其他。


    高成玲：伯凡老师，我想请教个问题，一个人如果处事有弹性别人会说是圆滑事故，而无弹性又是死板 那我们要怎样去拿捏这个度。这是和我们的思维方式有关系。我最厌恶别人将政策拿捏在自己手里松紧看心情看人来弹跳，我也会不自觉的给这些人贴上恶人的标签。


    ## 吴伯凡


    这里头可能有一个误解，我们说做事情要有弹性，不是看人下菜碟，不是否跟人谈判的时候，别人一旦答应，自己就赶紧急加码，这是一种小商人心态，千万别染上这种习惯。

    我们说处事要有弹性，这种变通是相对对于不变来说的。如果一个人翻手为云，覆手为雨，他的行为就无所谓弹性了。

    说到弹性，它包括两方面，一方面是可变性，别一方面是不可变性，就像一根弹簧，如果没有不可变的东西，它就无所谓弹性。这种弹性呢有一个专门的说法，叫实践智慧，有本书是专门讨论这个问题的，这本书叫《被遗忘的智慧》。智慧不是拿着一个硬梆梆的标准去衡量去规范眼前的人和事，而智慧恰恰表现在它的变通性上。这种态度呢，还有一个专门的说法叫道德爵士乐。了解爵士乐的朋友都知道，一首爵士乐里头，都包含着不少的即兴成分。去年我在丹麦，听过一场爵士音乐会，如果我们只是用音响听爵士乐的话，我们看不出它里头的即兴成分。如果你在现场的话，无论是贝斯手还是鼓手还是钢琴手，他们都会非常默契地给对方留出可以即兴表演的时间和空间。但是最有意思的是，当一个鼓手即兴表演到最后那一拍的时候，其他人都心领神会地就在那一刻进入到固定的，非即兴的那个演奏当中去。所以这个爵士乐的妙处就在于即兴的演奏永远不偏离非即兴的规定那个演奏。古希腊的哲学家亚里士多德把这种时间智慧称为曲尺。刚开始尺子都是硬的一个直尺，但是石匠们在工作中发现，如果一个直的，硬邦邦的尺，根本没办法工作，所以他们后来就发明了曲尺。这个曲尺很有意思，第一，它能够弯曲，第二，它还是尺子，它的刻度是不变的。所以智慧，就是在变的时候，始终用不变来约束，同时，在坚守不变的情况下，去大胆地变通。


    如果大家真地想了解如何把握这样一个度，我推荐大家看一本小说，以前我讲到过这本小说，就是王跃文的《大清相国》。王跃文是这么来评价它的。说，清官多酷。就是清官一般来说，都是对自己严格，对别人也非常地苛刻。所以，清官多酷。陈廷敬是一个清官，但是他能够做到宅心仁厚。能官多专，能干的官员一般都很专断。陈廷敬是一个能官，但是他能做到从善如流。德官多庸，就是道德品质比较好的官，一般都比较平庸。陈廷敬是一个德官，但是他在处理具体事情的时候，不乏铁腕。还有我们在历史上常常看到的，忠臣往往都短命，陈廷敬是一个忠臣，他绝不是一个奸臣，但是他活的很长。他一生当中，虽然小有波折，但是总体上他是相当地平稳的。21岁入朝为官，72岁老死相位，位相国的的位子上寿终正寝，许多跟他同朝为官的人，索额图，明珠，最终的结局都不太好，而他最终能做到老死相位。他怎么能够做到这一点呢，一个简单的答案就是，他会使用曲尺，他会演奏道德爵士乐。


    所以这里我就想到，亚马逊的创始人贝索斯的那句话，善良比聪明更重要。如果你仅仅是凭聪明，你根本拿捏不住分寸。聪明有时候能够让你在某个瞬间活的很精彩，但是有很多最重大的决策，聪明是不能告诉你答案的，善良才能告诉你答案。所以，如何把握分寸，如何在坚持原则的时候要有变通，如何在坚守底线的时候能够做到有弹性。善良能告诉你答案，聪明不能告诉你答案。


