    # 放弃“黑帮效应”的小米


    雷军其实有意无意地用到了这一点这种营销当中的黑帮逻辑，有意地制造障碍，让产品的不易得、不好用（或者说有学习成本）本身成为一种魅力。


    预售的时候要抢购


    你交了钱还不一定能得到这个手机


    你拿到手机以后，你要不停地刷机


    刷机这事不是随意一个人能干的事情，正因为不是随意有人能干，那么能干的人他就会产生一种优越感，不能干的人就产生一种自卑感。


    不管是优越感还是自卑感，最终都会导致品牌的某种魅力。会刷的人会觉得自己是被甄选的，有一种优越感，而且要维护保持这种优越感，这就是产品的忠诚度。那些不会刷机的人，作为一个吃瓜群众，他看见这些被甄选的精英们在那玩的时候，他有一种冲动。


    小米营销里是有这种逻辑的，但是对于规模、对于增长速度的渴求导致小米不知不觉地放弃了这个逻辑，不断地稀释它的品牌内涵，不断地增加产品品类。最后小米的那种禁果效应、黑帮效应就不存在了。小米虽然不是一个高端品牌，但是它在这个中低端人群制造了某种高端，制造了某种精英感和选民感，这是它品牌资产里头很重要的一块，但是很可惜的，小米把它放弃了。


    # 奢侈品里的黑帮逻辑


    很多奢侈品做得比较低级，它唯一pped的障碍是价格，


    比较高级的奢侈品它的障碍不仅仅是价格，也还要制造其它的障碍，比如说限量、比如说会员。


    用这样一种方式，通过这种障碍来制造选民意识，从而形成某种类宗教的东西。这种黑帮逻辑也可以说是禁果效应。


    其实这个道理一说穿了谁都懂，不是有那句话吗，妻不如妾，妾不如偷，偷不如偷不着，这里头其实也包含着某种禁果逻辑和黑帮逻辑。


