    当对手的拳头打过来的时候，我们会眨眼，甚至闭上眼睛。


    - 1. 本能反应，保护我们的眼睛。

    - 2. 驼鸟政策，当这个东西太可怕的时候，我们干脆就选择不去看它。


    此时，如果不能克服这种本能反应，本能就成为你的“负资产”。


