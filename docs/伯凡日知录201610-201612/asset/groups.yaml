    例子1：刚出生的小孩喜欢在夜里哭闹


    哈佛大学的一个教授的研究表明，小孩夜里哭闹的原因其实是本能在作祟。


    经常爱闹的小孩，他就能让母亲筋疲力竭，让母亲白天劳作一天，晚上还要受折腾，母亲的性欲就大大下降，这样就大大地减缓他的弟弟妹妹出生时间，不会有人跟他抢奶喝，他生存的机率才大。


    本能像是自然规律，你顺应它就得到好处，不顺应它，就得到惩罚。


