    曹操在整个的三国相争的格局当中扮演一个非常重要的角色，一旦没有他，这一个脆弱的平衡就会被完全打破，还处于刚刚起步、稍有起色的刘备，就会受到孙权的重创，最后完全丧失生存空间。所以在华容道上，表面上是刘备的势力
    buffer 和曹操的势力之间的相争，实际上还有一个未出场的势力一定要意识到。


    所以诸葛亮他不能派象张飞这样的莽夫，去守华容道。那派谁去呢？他想到的就是关羽。关羽是既有执行力，同时还特别讲义气情谊，在面对曹操的时候，他一定会下不了手。


    意识到未出场的孙权存在，这只是看到了暗局的一面，暗局的另一面就是关羽跟诸葛亮之间的对峙。


    因为诸葛亮年纪轻轻，深得刘备的青睐，关羽自然会感到心理不平衡。所以他对诸葛亮是非常排斥的。诸葛亮这时候安排他去，让他立下军令状，如果曹操抓不到，他就要提人头回来见；这个时候，诸葛亮意识到他跟关羽之间的这样一个暗局，他让关羽立下军令状，让关羽在不知不觉当中欠他一条命，就达到了制伏关羽，同时也能够制伏所有对诸葛亮本人有排斥情绪的人，所以他派关羽去了。这就是华容道上的暗局。


    在《第五项修炼》里头，讲到了一个作者亲眼见过的小悲剧事件，也很能说明问题，我在这里简单地给大家复述一下这个故事。


    有一次，作者彼得·圣吉出去旅游，去看一个大瀑布，那是在冬天，但是那个瀑布还在流，但这个水是冰凉冰凉的。有 一个游客，不小心就掉到了瀑布下面的深潭里头，这个人他会游泳，他有一种本能的反应，就是尽可能地游到岸边。他拼命地游，在冰冷的水里游了半个小时；但是他游不到岸边，原因是，由于瀑布的冲击，瀑布下的深潭的水里头，实际上是有
    一个巨大的漩涡。


    这个人没有意识到他是在一个漩涡里头游泳，所以他怎么都游不出去，最后筋疲力尽，体力耗尽，一下子就死了。 旁边没有会游泳的人，只能在那儿扒腕叹息。但是这个人沉到水里不到一分钟，他的尸体就漂到了岸边，原因很简单，他的尸体沉下去的时候，这个潭水的底部的
    水，它是向外扩张的，所以他的尸体，借助于深潭的下面的水向外扩张的力量，他的沉到水底的尸体，就被冲到了岸边。


    彼得·圣吉说，他在生命的最后半个小时，尽力要做到、但没有做到的事情，在他死后不到一分钟就做到了，原因是，他不知道他自己是处在一个漩涡当中。


    我们很多人，做事情很努力，但最后徒劳无功，甚至遭遇毁灭性的悲剧，原因就在于，我们对我们所处的那个局，缺乏深切的认识，贸然地采取行动，只知明局，不知暗局，所以最后莫名其妙地成了牺牲品。


    那么如何提升对暗局的敏感力呢？首先要对暗局有意识。其次，可以认真读一读《第五项修炼》。如果大家有勇气，有时间，可以现在开始读读《易经》。在我看来，《易经》的结论不重要，我们甚至会觉得有些说法、结论荒唐可笑，但它提供了一种世界观，更提供了一种方法论。简单粗暴地说吧，《易经》首先说的是人生和世界的六十四种场景和格局，以及每种场景和格局中都包含的六个阶段。当然世界和人生远不是这么简单，而是错综复杂的。
    “错综复杂”这个成语（可能我们都不以为是成语，因为平时说得太多了）我们能脱口而出，意识不到这个成语是来自于《易经》的（错卦、综卦、复卦、杂卦，合起来就是错综复杂）。比如说，把原卦中的阴阳爻变阴阳爻得到的新卦，就叫“错卦”，即相互交错的卦。把原卦倒置过来得到的卦象，就是综卦。错卦和综卦就是原卦暗中隐藏着的卦，或者说暗藏其中的卦，我们不妨把它们叫做“暗卦”。当然这个说法是我杜撰的，是为了便于大家理解。《易经》能够告诉我们，你看到的这个格局，你看到的这个场景，不是唯一的，你要反着来看，倒着来看；而且，一个格局既是一个空间结构，也是一个时间结构，随着时间的变化，格局也在悄悄地发生变化，基本上是，顺着六个阶段在发生变化。


    所以古代那些高人，不管是文臣还是武将，他们都爱读、常读《易经》，常读《易经》，我们就能逐渐意识到、觉察到世界和人生的错、综、复、杂，也就是各种明局外的暗局。'
