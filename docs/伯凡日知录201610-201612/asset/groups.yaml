    当人人都相信本能时，反本能才能在竞争中胜出。


    例子1：《师父》中师徒的对话


    当对手一拳朝你的脸打过来的时候，你不要本能地马上把头一偏，想躲过去。因为你的头躲拳头的速度很慢，幅度也很低。


    这个時候，你需要一种反本能的决策，当对手的拳打过来的时候，你的头不要躲，马上就把你的手伸出来去抓对方的手，手的速度和手的灵活性要远远高于头的速度和灵活性。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_6_0.png)


