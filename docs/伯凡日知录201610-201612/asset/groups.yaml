    # 它们用小力量控制了大家伙


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_10_0.png)


    它们用小力量控制了大家伙


    人体体内有大量的菌群，数量跟地球的总人口数量差不多，有70亿。


    有很多生命寄生在我们的体内影响我们、控制我们。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_10_1.png)


    # 例子1：火烈鸟肚子里的寄生虫


    非洲有一种鸟叫火烈鸟，有种寄生虫只能在火烈鸟的肚子里才能繁殖。这种寄生虫在非洲的某些水域里头比较常见。但它无法直接到达火烈鸟的肚子，为了实现繁殖，它有一套流程。


    它入侵到一种叫“海猴子”的虾体内，让虾颜色变红，并让他们有一种喜欢聚在一起的偏好。火烈鸟以这种虾为主食，当这些虾变红又聚集在一起，在水面上就非常显眼，很容易被火烈鸟发现并吃掉。


    这种寄生虫因此就顺利进入到火烈鸟的肚子里，并开始繁殖，随后通过火烈鸟的粪便排泄出来，它们又回到水里生活，生长一段时间以后，它们又重演一遍刚才我们讲的那个游戏。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_10_2.png)


    # 例子2：蝗虫和线形虫（毛线虫）


    线形虫和蝗虫都是在有水的地方发迹的。


    线形虫的宿主是蝗虫，当它还比较小，肉眼都不容易看到的时候，它们就入侵到蝗虫的体内了，从吃蝗虫的非关键部位开始，一直到把蝗虫吃空。


    这时候线形虫已经长大，到需要生殖繁殖的时候了，它必须回到水里，它就向蝗虫的神经系统注入一种生物化学元素，让蝗虫对水产生一种强烈的渴望。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_10_3.png)


    # 例子3：猫尿中的寄生虫


    猫尿里有一种寄生虫，老鼠要是不小心接触到了那种猫尿，它们就会对猫的气味产生一种强烈的渴望，猫的气味越浓，它们就越兴奋，猫窝的气味最浓，老鼠为了寻求刺激就会送货上门，让猫吃掉。这种寄生虫就是在猫的肚子里繁殖的，老鼠以生命为代价当了一回快递员。


    这些低等生物，它们肯定不会有战略、战术、商业模式，但是它们整个的流程设计得是如此之精巧。


