    # 例子：碗和房子


    做一个碗，做碗的人做的是碗的壁；我们盖房子，其实也是垒那个砖墙；但我们要用得不是看得见的容器壁，也不是房子的那个砖墙，而是容器里的那个空间，那个看不见的、无形的东西。房子也是这样，我们垒砖墙，最终要用的，是砖墙之间的那个空间。


