    ## 11.22 | 人人人都该有两张地图


    11.22 | 人人人都该有两张地图


    ## —— 知识笔记 ——


    我们每一个人的城市，我们所在的生活世界，都是一个自定义的世界，一个自定义的城市。


    例子1： “上海幸福地图”


    我觉得它应该起名叫“上海小资地图”。上面有小资们找到的各种有小资情调的商店、咖啡馆、酒吧。一般的非小资人群可能觉得这不是我们生活的这个城市，因为很多东西他们看不见。那个地图都是变形的，在一个很豪华的街区里，如果它没有那样的咖啡馆、茶室，那个地方就是空白，或者说整个这一大段路都没有的话，这些地方就会被画得很小。在小资的眼里，这就是一个实实在在的上海；跟小资无关的东西，对他来说相当于不存在。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_52_0.png)


    例子2： 海盗地图


    我们通常的地图，英文叫map，海盗用的地图叫chart，它的世界就是海洋。我们正常世界的地图，比如说地中海，旁边的陆地都是密麻麻的地点，中间的海洋就是一个空白。但海盗地图是反过来的，海洋上各种密密麻麻，哪儿有礁石、哪儿鲨鱼出没最多等等，都标识得清清楚楚。可是岸边的世界就是空的，对海盗来说是不存在的，他也从来不去。


    有种说法是，人与人之间的交流，就是两点之间最长的那条线。原因是，每个人在交谈的时候，好像拿的是同一张地图，其实你拿的是陆地的地图，他拿的是海盗的地图，他跟你看到的是完全不一样的。


    当我们的世界观，或者说当我们的心灵地图不能够达成一个融合，或部分重叠的时候，争论往往是完全没有意义的。这有点像我们在各种谍战片里看到的，有不同任务使命的夫妻两人，同睡一张床，但是他们生活在不同的世界。


    ## 组织中的地图


    在一些正式的组织内部，往往存在着非正式的组织，尤其是建立的年头长了以后，那种看不见的世界，就在你的公司里头潜滋暗长，除非你拿到类似海盗地图的那样一张图，否则你就不能够解释公司里头出现的那些莫名其妙的现象。我觉得我很了解这个组织，其实他们有一套运行的轨迹，你看不见。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_52_1.png)


    就像蝙蝠一样，天一黑，蝙蝠就开始出来。它用超声波精确地定位，精确到0.02毫米，一下子就能够冲过去把蚊子吃掉。它在它的生态里使用一套流行的工具、方法和路径。就像在暗网的世界里流行的比特币。比特币你拿到这边是不能当钱的，反过来你这边的钱拿到那边可能也是不管用的。


    隐性的权力网


    微软的正常权力结构之外，有另外一个权力结构。叫FOB，其实就是在另外一种权力结构里头通行的类似于比特币的东西。FOB叫Friend of Bill（比尔盖茨的朋友），得罪谁都可以，但是你不能得罪FOB。那个比尔的朋友可能是在一个很低的位置上，但是你得罪不起；或者你在做决策做运营的时候，你一定要考虑有有一两个FOB在你的部门。就像如果你不是海盗，你要去航海的时候没有海盗地图的话，你可能走三海里就触礁了。当你船上没有水的时候，那个海盗地图能告诉你到哪里荒岛上取水，而你没有这个地图的话，你只能渴死。


    所以作为一个公司的领导者，也要建立一个世界观：那个既是你的地盘，也不是你的地盘。恺撒的归恺撒，上帝的归上帝。该你管的你能够管得到，还有你要意识到，公司里头有一个隐形空间，不仅仅是你管不到，而且你根本就不知道它存在的那样一个地方。那个地方，当然，就跟暗网一样，它不会因为我们不知道而不存在，有时候你不小心进到那个地盘的时候，有可能进入鬼打墙的状态。


    鬼打墙


    其实就是一种迷路的方式，这是过去农村的一种说法，就是在黑夜或者大雾天，你在赶路，突然走着走着，发现你又回到原来的地方了。这时候定定神，念念阿弥陀佛，然后继续走，走走走又走到这个地方来了，说得装一点，那叫隐形陷阱。掉进这种隐形陷阱，比阴沟里翻船还冤，你在阴沟里翻船，你还知道翻到阴沟里了；那个隐形陷阱，你都不知道你翻了船。其实所有的人都明白，就你不明白。


    例子1： 被蒙在鼓里的人


    有一个军长的儿子，他隐瞒身份到一个连队里锻炼，领导大家，他觉得身先士卒，也不摆架子，而且时不时地还为了隐藏自己的身份，经常会攻击一下那种拼爹的人，以表明自己既不是拼脸，也不是拼爹，而是凭实力在那儿混，结果有一天，突然发现，这个连的人，只有他不知道，他已经完全被别人知道了。


    在魔鬼词典里，对CEO有个定义，“公司里最后知道企业快完蛋的那个个人”。作为一个领导者，你应该有两张地图，一张是光天化日之下，人人都能看懂的地图，还有一张是反转片的地图，一张海盗的地图。


    同时有了这两张地图，英汉对照，你触礁，你陷入鬼打墙那种厮局里的可能性会小得多。


    ## —— 延伸思考 ——


    如何拿到那张“海盗地图”？


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_52_2.png)

    '
  mdcn: '

    曹操在整个的三国相争的格局当中扮演一个非常重要的角色，一旦没有他，这一个脆弱的平衡就会被完全打破，还处于刚刚起步、稍有起色的刘备，就会受到孙权的重创，最后完全丧失生存空间。所以在华容道上，表面上是刘备的势力
    buffer 和曹操的势力之间的相争，实际上还有一个未出场的势力一定要意识到。


    所以诸葛亮他不能派象张飞这样的莽夫，去守华容道。那派谁去呢？他想到的就是关羽。关羽是既有执行力，同时还特别讲义气情谊，在面对曹操的时候，他一定会下不了手。


    意识到未出场的孙权存在，这只是看到了暗局的一面，暗局的另一面就是关羽跟诸葛亮之间的对峙。


    因为诸葛亮年纪轻轻，深得刘备的青睐，关羽自然会感到心理不平衡。所以他对诸葛亮是非常排斥的。诸葛亮这时候安排他去，让他立下军令状，如果曹操抓不到，他就要提人头回来见；这个时候，诸葛亮意识到他跟关羽之间的这样一个暗局，他让关羽立下军令状，让关羽在不知不觉当中欠他一条命，就达到了制伏关羽，同时也能够制伏所有对诸葛亮本人有排斥情绪的人，所以他派关羽去了。这就是华容道上的暗局。


    在《第五项修炼》里头，讲到了一个作者亲眼见过的小悲剧事件，也很能说明问题，我在这里简单地给大家复述一下这个故事。


    有一次，作者彼得·圣吉出去旅游，去看一个大瀑布，那是在冬天，但是那个瀑布还在流，但这个水是冰凉冰凉的。有 一个游客，不小心就掉到了瀑布下面的深潭里头，这个人他会游泳，他有一种本能的反应，就是尽可能地游到岸边。他拼命地游，在冰冷的水里游了半个小时；但是他游不到岸边，原因是，由于瀑布的冲击，瀑布下的深潭的水里头，实际上是有
    一个巨大的漩涡。


    这个人没有意识到他是在一个漩涡里头游泳，所以他怎么都游不出去，最后筋疲力尽，体力耗尽，一下子就死了。 旁边没有会游泳的人，只能在那儿扒腕叹息。但是这个人沉到水里不到一分钟，他的尸体就漂到了岸边，原因很简单，他的尸体沉下去的时候，这个潭水的底部的
    水，它是向外扩张的，所以他的尸体，借助于深潭的下面的水向外扩张的力量，他的沉到水底的尸体，就被冲到了岸边。


    彼得·圣吉说，他在生命的最后半个小时，尽力要做到、但没有做到的事情，在他死后不到一分钟就做到了，原因是，他不知道他自己是处在一个漩涡当中。


    我们很多人，做事情很努力，但最后徒劳无功，甚至遭遇毁灭性的悲剧，原因就在于，我们对我们所处的那个局，缺乏深切的认识，贸然地采取行动，只知明局，不知暗局，所以最后莫名其妙地成了牺牲品。


    那么如何提升对暗局的敏感力呢？首先要对暗局有意识。其次，可以认真读一读《第五项修炼》。如果大家有勇气，有时间，可以现在开始读读《易经》。在我看来，《易经》的结论不重要，我们甚至会觉得有些说法、结论荒唐可笑，但它提供了一种世界观，更提供了一种方法论。简单粗暴地说吧，《易经》首先说的是人生和世界的六十四种场景和格局，以及每种场景和格局中都包含的六个阶段。当然世界和人生远不是这么简单，而是错综复杂的。
    “错综复杂”这个成语（可能我们都不以为是成语，因为平时说得太多了）我们能脱口而出，意识不到这个成语是来自于《易经》的（错卦、综卦、复卦、杂卦，合起来就是错综复杂）。比如说，把原卦中的阴阳爻变阴阳爻得到的新卦，就叫“错卦”，即相互交错的卦。把原卦倒置过来得到的卦象，就是综卦。错卦和综卦就是原卦暗中隐藏着的卦，或者说暗藏其中的卦，我们不妨把它们叫做“暗卦”。当然这个说法是我杜撰的，是为了便于大家理解。《易经》能够告诉我们，你看到的这个格局，你看到的这个场景，不是唯一的，你要反着来看，倒着来看；而且，一个格局既是一个空间结构，也是一个时间结构，随着时间的变化，格局也在悄悄地发生变化，基本上是，顺着六个阶段在发生变化。


    所以古代那些高人，不管是文臣还是武将，他们都爱读、常读《易经》，常读《易经》，我们就能逐渐意识到、觉察到世界和人生的错、综、复、杂，也就是各种明局外的暗局。


    Rock：吴老师，“潜规则”算暗局吗？


    ## 吴伯凡


    “潜规则”不能算暗局。很多所谓的“潜规则”，其实是不便明说的“明规则”。只要你稍微地接触一下，你就会知道，在某个场合，某个机构，某个团体里头，在一些显性规则之下，还有一些隐性的规则。发现、利用或者制定这样的规则，无需智慧，只需要一点投机取巧的小聪明和一颗不知廉耻的心。潜规则不过是某种强盗逻辑，和一般的强盗逻辑唯一的不同，它不是明抢，而是暗夺。在潜规则里活动久了，既会让人无法获得智慧，也会让人丧失良知。我们不能说“珍爱生命，远离潜规则”，因为有些潜规则你想远离也远离不了，但是我们不要把自己的智力、把自己的视野，都过多地集中到这样一些跟小聪明相关的这样一些规则上面，久而久之，我们就只剩下小聪明，就没有大智慧了。


    丁晟：吴老师您刚才提到了贾跃亭贾总，您怎么看乐视目前遇到的困难，格局和资源如何匹配？


    ## 吴伯凡


    因为时间很短，我不可能和大家详细地解读乐视，分析乐视现在的情况。


    录完这周的节目后，我的研究助理问我，如何向讲英语的人解释“有格局”，我们讨论很久，后来我们觉得Think Big与“有格局”的意思相对接近。比如说，有这样一句话：You
    have to think anyway, so why not think big?（既然要思考，为什么不放大格局？）还有，Think big and win
    big success（有大志才会有大成就）。Think big通常指“大处着想”、“有抱负”、“有大格局地思考”，偶尔也指“幻想”、“好大喜功”。


    Trump在年轻时写过一本书，叫《The Art of The Deal》，也叫《交易的艺术》，我把它译成《搞定的艺术》。在这本书里头，他说我就是一个Think
    big的人。


    贾跃亭显然是Think big的人。国外媒体在报道他的时候也经常用这个词。在管理学上有一个说法，叫“胆大包天的计划”（Big Hairy Audacious
    Goal，BHAG）。《基业长青》、《从优秀到卓越》的作者吉姆·柯林斯的研究表明，卓越企业都有一种BHAG的基因，很多同时起步或者起步更早的企业之所以最终陷入“小老树”（年头很长但规模、业绩日趋平庸）的状态，往往是因为它们过于务实。令人瞩目的商业成就背后，都有一个“胆大包天的计划”。


    贾跃亭的乐视显然有BHAG。中国不缺想赚大钱也赚到了大钱的企业，但太缺少具有胆大包天的计划的企业。在中国的互联网企业中，京东和乐视是有BHAG的企业。对这样的企业，很多人习惯于以质疑、嘲讽甚至幸灾乐祸的眼光去看待，而对那些赚到大钱但胸无大志的企业往往习惯于以迎合、诋媚的口吻去赞美。前些年京东陷入资金危机的时候，许多人一遍又一遍地说“京东必死”，然而京东奇迹般地成长起来了。罗振宇的一句话我很有感触：“自从自己创业以后，我越来越少地去轻率地判断对错和好坏。”只有负责任做事的人，才会对其人和他的事有一种包容和理解。轻率地评断别人，往往是自己处于那种浮皮潦草的一种表征，一种征候。


    这样说不是为贾跃亭辩护和唱赞歌。乐视的快速扩张的确带来了很多问题，这一点贾跃亭比我们这些旁观者清楚得多，所以乐视才会有刹车检修的动作。中国不缺能赚钱的企业，但太缺Think
    big，有BHAG的企业。有胆大包天的计划显然只是成为卓越企业的必要条件，而非充分条件。不少Think big的企业会突然死去，乐视也许会是其中的一个。这一点贾跃亭早就明白，他说，“乐视也许会失败，但乐视所代表的商业新物种一定会成功”。听到他说这句话，我对他心生敬意，哪怕他最终失败了。


