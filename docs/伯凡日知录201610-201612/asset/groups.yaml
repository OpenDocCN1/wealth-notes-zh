    ## 小心，本能是大自然的阴谋


    小心，本能是大自然的阴谋


    —— 知识笔记 ——


    ### 本能的作用


    本能让生物能面对场景能快速做出反应，这是他们生存下来一个关键因素。


    - 1. 人类生存，依赖于感官这种简单的报警系统


    - 嗅觉: 觉得难闻，不用懂得化学，也不会继续闻


    - 视觉：看到某些动物感到害怕，不用探明究竟，也会远离它


    - 味觉：觉得难吃，不用懂得成分，也不会继续吃


    - 2. 动植物生长，遵循经济和简单原则


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_4_0.png)


    植物：


    大的花，通常不怎么香。它在视觉的吸引上有优势的时候，就不用嗅觉来吸引昆虫。


    小的花，颜色暗淡的话，它一定会很香，它要用这种嗅觉上的优势来吸引昆虫给它授粉。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_4_1.png)


    动物：


    长角的动物，它不是食肉动物。


    因为如果牙齿足够锋利的话，你就不需要角，就能捕杀猎物。


    ### 本能和大自然的设计


    康德：美的定义——无目的的合目的性


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_4_2.png)


    例子1：为什么大部分民族觉得女性美的特点就是“丰乳肥臀”


    人类的最大的使命就是让维系种族的繁衍，女性作为一个母体，必须保证小孩的地方是宽敞的，他能够顺利地出生。小孩出生以后要有东西吃。


    但我们人在看到一个丰乳肥臀的女性时，不会想这些。


    例子2：为什么女性漂亮的时间段要比男性的要短？


    跟男性和女性适合生殖的时间有关，女性60岁生孩子的机率几乎是0，但男性不是。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_4_3.png)


    例子3：花为什么漂亮，闻起来香？


    为了吸引昆虫过来授粉。一旦授粉以后，花的颜色和花的香味就是多余的了，花就会迅速的枯萎、凋谢了。


    尼采说，大自然其实是充满着各种的阴谋诡计。


    它让我们去为它干事，设立各种机制，让我们觉得我们是在为我们自己干事。


    本能是大自然在操纵个体的一个手段


    比如：食欲和性欲，不过是大自然为了让个体，首先完成自身生命的一个延续。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_4_4.png)


    例子1：刚出生的小孩喜欢在夜里哭闹


    哈佛大学的一个教授的研究表明，小孩夜里哭闹的原因其实是本能在作祟。


    本能是大自然在操纵个体的 一种手段。


    比如：食欲和性欲，不过是大自然为了让个体，首先完成自身生命的一个延续。


    ![](img/bc3c2bdeca06cc5ba1cdbd464e67d8e2_5_0.png)


    例子1：刚出生的小孩喜欢在夜里哭闹


    哈佛大学的一个教授的研究表明，小孩夜里哭闹的原因其实是本能在作祟。


    经常爱闹的小孩，他就能让母亲筋疲力竭，让母亲白天劳作一天，晚上还要受折腾，母亲的性欲就大大下降，这样就大大地减缓他的弟弟妹妹出生时间，不会有人跟他抢奶喝，他生存的机率才大。


    本能像是自然规律，你顺应它就得到好处，不顺应它，就得到惩罚。


    但本能一旦固化，就很难去除，有时甚至会带来灾难性的伤害。


