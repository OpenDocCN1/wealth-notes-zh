    Rock：吴老师，“潜规则”算暗局吗？


    # 吴伯凡


    “潜规则”不能算暗局。很多所谓的“潜规则”，其实是不便明说的“明规则”。只要你稍微地接触一下，你就会知道，在某个场合，某个机构，某个团体里头，在一些显性规则之下，还有一些隐性的规则。发现、利用或者制定这样的规则，无需智慧，只需要一点投机取巧的小聪明和一颗不知廉耻的心。潜规则不过是某种强盗逻辑，和一般的强盗逻辑唯一的不同，它不是明抢，而是暗夺。在潜规则里活动久了，既会让人无法获得智慧，也会让人丧失良知。我们不能说“珍爱生命，远离潜规则”，因为有些潜规则你想远离也远离不了，但是我们不要把自己的智力、把自己的视野，都过多地集中到这样一些跟小聪明相关的这样一些规则上面，久而久之，我们就只剩下小聪明，就没有大智慧了。


    丁晟：吴老师您刚才提到了贾跃亭贾总，您怎么看乐视目前遇到的困难，格局和资源如何匹配？


    # 吴伯凡


    因为时间很短，我不可能和大家详细地解读乐视，分析乐视现在的情况。


    录完这周的节目后，我的研究助理问我，如何向讲英语的人解释“有格局”，我们讨论很久，后来我们觉得Think Big与“有格局”的意思相对接近。比如说，有这样一句话：You
    have to think anyway, so why not think big?（既然要思考，为什么不放大格局？）还有，Think big and win
    big success（有大志才会有大成就）。Think big通常指“大处着想”、“有抱负”、“有大格局地思考”，偶尔也指“幻想”、“好大喜功”。


    Trump在年轻时写过一本书，叫《The Art of The Deal》，也叫《交易的艺术》，我把它译成《搞定的艺术》。在这本书里头，他说我就是一个Think
    big的人。


    贾跃亭显然是Think big的人。国外媒体在报道他的时候也经常用这个词。在管理学上有一个说法，叫“胆大包天的计划”（Big Hairy Audacious
    Goal，BHAG）。《基业长青》、《从优秀到卓越》的作者吉姆·柯林斯的研究表明，卓越企业都有一种BHAG的基因，很多同时起步或者起步更早的企业之所以最终陷入“小老树”（年头很长但规模、业绩日趋平庸）的状态，往往是因为它们过于务实。令人瞩目的商业成就背后，都有一个“胆大包天的计划”。


    贾跃亭的乐视显然有BHAG。中国不缺想赚大钱也赚到了大钱的企业，但太缺少具有胆大包天的计划的企业。在中国的互联网企业中，京东和乐视是有BHAG的企业。对这样的企业，很多人习惯于以质疑、嘲讽甚至幸灾乐祸的眼光去看待，而对那些赚到大钱但胸无大志的企业往往习惯于以迎合、诋媚的口吻去赞美。前些年京东陷入资金危机的时候，许多人一遍又一遍地说“京东必死”，然而京东奇迹般地成长起来了。罗振宇的一句话我很有感触：“自从自己创业以后，我越来越少地去轻率地判断对错和好坏。”只有负责任做事的人，才会对其人和他的事有一种包容和理解。轻率地评断别人，往往是自己处于那种浮皮潦草的一种表征，一种征候。


    这样说不是为贾跃亭辩护和唱赞歌。乐视的快速扩张的确带来了很多问题，这一点贾跃亭比我们这些旁观者清楚得多，所以乐视才会有刹车检修的动作。中国不缺能赚钱的企业，但太缺Think
    big，有BHAG的企业。有胆大包天的计划显然只是成为卓越企业的必要条件，而非充分条件。不少Think big的企业会突然死去，乐视也许会是其中的一个。这一点贾跃亭早就明白，他说，“乐视也许会失败，但乐视所代表的商业新物种一定会成功”。听到他说这句话，我对他心生敬意，哪怕他最终失败了。


