    ## 本周问答 | 善良比聪明更重要


    郭铁伦：凯文·凯利将科技称是为第七生物，而人就是组成它的细胞。我们通常认为我们在用自己创造的科学技术，帮助人类更好的生活。但事实却并非如此。例如人类发明了汽车，本来是可以帮助我们节约时间，使得我们能够抵达更远的区域。可是现在我们在通勤路上都要花费巨大的时间成本，而且每年的交通事故也是居高不下；我们发明了电子邮件，可以令我们的消息传递速度大幅度提升，可是邮件量却从以前的一个月1封变成了一天几十封，同样让我们付出了更多的时间和注意力。在万维钢老师解读《未来简史》的文章中，就说到了未来会有三种人：无用的人、没有自由的人和神人。神人即是掌握了大数据和算法，而数据和算法无法理解他们少部分人。而其他的大部分人都不只是无用之人，这难道真的是我们科学研究的初衷吗？我们目前引以为豪的大数据和科技创新，到底是我们创造了它们，还是反而在被它们驯化呢？


    吴伯凡


    这是一个很有新意的问题，其实呢，也应该说是一个老问题。这个，人类在工业革命之初就已经发现了这个问题。在两百多年前，英国就出现了一种叫做卢德主义的思潮，我把它译成叫做鲁德主义，鲁莽的德性。鲁德主义者认为，机器出来以后，就导致人类失去工作，所以他们就
    有计划有预谋有步骤的去砸毁机器。他们以这种鲁莽的行为去对抗新的技术新的产业，当然这是无用的啦，但是他们这种行为里头所包含的情绪，那种主张一直延续到今天。这种情绪的核心就是对新的技术非常的抵触，担心技术有一天将人置于死地。甚至一些大科学家，比如像霍金这样的大家学家也对人工智能表示了极大的担心。


    就我所见，最早对技术与人之间的关系做出了很精辟的论断的是麦克卢汉。麦克卢汉认为人的头脑不过是技术的生殖器官，只是一个出口。它一旦借助于人脑出生以后，就会自由的生长，是根本由不得人的。麦克卢汉的观点让我想起了黎巴嫩诗人纪伯伦的著名的谈孩子里的话，技术就像是人类的孩子，正如纪伯伦说的，你的孩子并非你的孩子，是生命因为他的渴望借助你来到这个世界，你可以变得像他们一样，但不能让他们变得像你一样，因为他们属于明天，属于你做梦也到达不了的明天。纪伯伦这是在说孩子，其实对待技术，我们也可以作如是观。


    其实，再往前追溯，德国哲学家黑格尔早在十九世纪的早期就提出过一种异化理论，黑格尔把人跟物主体和客体之间的关系称为主仆关系，人是主人，物是仆人。但是在二者相处的过程当中会发生主仆关系的逆转，刚开始是仆人依附于主人，但是，当主人把许许多多的事情都交给仆人去做的时候，主人的能力就逐渐被让渡给仆人了，他逐渐被掏空，最后的结果不是仆人离不开主人，而是主人离不开仆人。我们跟机器的关系，也是这样一种关系。机器本来是为我们服务的，但是在人和机器长期的相处当中，我们把太多的事情外包给机器的时候，机器在逐渐的、悄悄地控制我们，在驯化我们，使得我们最终发现，一旦我们离开它，我们什么都不是。就好像今天我们有手机的时候，你好像能办好多事情，一旦手机丢了，你就丢了魂似的。


    我相信随着人工智能随着技术的进展，尤其是当机器不再仅仅是外包人的体力，过去的起重机、飞机、火车都是在外包人的体力。而今天呢，机器在逐渐外包人的脑力，尤其是人工智能。可以说人工智能技术能将逐渐成为我们智力脑力的代理人，最后就很可能出现黑格尔说的主仆关系的逆转，这样说起来真的是有点悲哀啊，有点无可奈何。但这也许就是一个宿命。


    威红：伯凡老师好！看过今天的文章后，找到《熊猫咪咪》这首歌听了听，想象着因竹子集体死亡而饿死的百多只熊猫的画面，感觉到一种莫大的悲哀。熊猫怎样一步步变成囚室？“温柔刁，刀刀要人命”，这是给大家的警示呢，我们应该居安思危。怎样才能不被颠覆呢？罗胖老师说过，我们应该拒绝被存量绊架，寻找增量。可是要怎么样才能做得到呢？


    徐烨：套用下《反脆弱》里面的概念。熊猫是脆弱的，经不起外界变化的冲击，所以才快灭绝。老虎狮子是坚固的，我很强，不怕外界的变化，虽然有时候饿肚子，但是还是饿不死。熊是反脆弱的，外界变化来了，我就秉承着：吃饱饭，不挑食的基本选择，有什么吃什么。塔勒布强调要建立冗余，个人很好理解，就是掌握多的生存技能，掌握多余的概念，以应付未来的不确定性。那企业该如何应对呢？建立多的业务线，投资研发，增加现金流？我щиком请教下吴老师。


    吴伯凡


