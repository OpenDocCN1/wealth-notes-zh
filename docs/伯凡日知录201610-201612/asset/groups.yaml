    ## 穷人思维：


    > “如果你不按你想的去生活，那么终有一天，你就只能按你生活的方式去想。”


    当你在跟别人打交道的时候，总是选择成本最小化、收益最大化，你就会让自己的心态变得非常的一把据，你的思维逐渐地就变成一种存量思维，而不是一种增量思维，有大量的机会，你在根本没有看到它的时候你已经失去了。


    穷人思维有几个特点：


    +   1. 希望付出马上回报，不能马上回回报的事情绝不干；

    2. 当一个机会出现的时候，首先考虑的是它的风险，而不是收益；


    一旦你选择了这样一种思维方式，大量的机会和财富都跟你已经绝缘了。这是一个我们自己没有意识到的隐性成本。


