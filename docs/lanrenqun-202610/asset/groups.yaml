    > 小懒判断 | 适合想做 AI 产品但被"不会代码"吓住的新手——蓝子鱼用 6 个小程序证明打字加截图就能开发，第一个三个月变现 10 万。不适合想靠流量主躺赚的人，他走的是会员费模式，一天一个会员顶几万流量主收益。最值得关注的是变现公式：需求
    60%+运营 30%+开发 10%，开发只占一成。坑是找需求环节，假需求嘴上想要不付钱，真需求是考试和赚钱这种不得不解决的事。


    大家好，我是7年的圈友蓝子鱼，自从跟着生财第一次小红书航海以后，就一直在做小红书这个平台，也写过小红书和抖音教育资料精华帖，每次生财里面出现新的风向标，都会思考自己能不能做，今年看到了大量用
    ai 做产品的帖子，所以我也试着用 ai 开发小程序，然后在小红书变现，目前已经开发了 6 个小程序，第一个小程序，三个月在小红书变现超过 10 万，其他几个陆续开始变现中。


    到现在做了 6 个小程序，我还是一行代码都看不懂，也不懂数据库，云函数这些具体是什么，我觉得好像也不一定要懂才能开发小程序，因为现在有 Claude code,
    codex, workbuddy, 你只要能够打字，会截图就能开发小程序。


    现在这个时间点，阻止一个人用 ai 的其实是勇气，当你把软件装好，你就已经会用 ai 了，你只要会打字，会说话就会开发小程序，包子老师说，GPT 比一个清北毕业的博士生还厉害，你有什么事情安排它去完成就可以了。


    我就是这样开启我的小程序开发之路，也要感谢航海家线下大课，让我 2 天专心的在那边用 AI，回来才真正爱上 AI。


    ## 一、我为什么要做自己的小程序


    我从去年开始在小红书和抖音做教育资料，之前也有写过两篇项目的复盘笔记，虽然教育资料到现在为止，我觉得它依然是新手赚钱最好的项目之一，但是小程序的出现，我开始觉得小程序对一部分需要反馈的资料，简直是降维打击，用户的体验感提升了一大截，这样在小红书上售卖的时候，也能更好的突出自己的卖点。


    比如一份面试题库，传统的资料就是一份文档，然后客户拿回去自己看，看了也不一定会，所以这种资料很难卖高价，但是如果做成小程序能够在他选错答案，或者不知道解题思路的时候，小程序能够一步一步引导他，做错了还能整理到错题集里面，告诉他这题的考点是什么。


    比如教育资料最容易出现的就是盗版问题，发一份文档，转手就被其他店铺倒卖，你卖 50 元，闲鱼只要 1 元，维权起来也非常的麻烦，但是做成小程序至少盗版的门槛提高了，你也能够随时进行更新。


    ## 二、如何做才更大概率赚到钱


    我自己做小程序，也跟很多做小程序的圈友交流过，我发现想要通过小程序赚钱这件事情，最难的不是开发小程序，而是找到用户愿意付费或者持续使用的点，我做的小程序都是收会员费，不是靠流量主变现的，一天哪怕一个会员费，顶一个几万用户的小程序流量主收益。


