    但这些制作和修改，几乎用完了我订阅套餐里 20 倍的额度。接触下来，我也感觉这类商家的需求量不大，很容易饱和。\n\n当时的感受就是：质量确实做上去了，但投入和回报之间，始终有很大的落差。\n\
