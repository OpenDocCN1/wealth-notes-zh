    # 南明内斗的深层逻辑


    261010 猫哥星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/d342baadc0ba38735b64336f869d2a2e_0_0.png)


    ![](img/d342baadc0ba38735b64336f869d2a2e_0_1.png)


    微信：lazyhelper1


    小懒判断 | 适合被"南明要是团结何至于此"气到过的人看——猫哥用囚徒困境把内斗讲成了制度问题，不是道德问题。最值得关注的一个点：满清给降将的是"旗籍+世职+实权"这套可预期的政治股份，南明给的是名分大义加随时清算。坑在于别把"内斗是理性选择"读成"内斗有理"，作者讲的是系统，不是替谁洗白。


    南明历史可能是现代国人最不愿意阅读的一段历史，很多人都感叹，读这段历史高血压都要整出来了！原因无他，就是明明外敌虎视眈眈，但是南明内耗之烈却达到史无前例的地步。


    弘光朝立国未稳，史可法与马士英已势同水火，左良玉以“清君侧”之名顺江东下，恰逢清军渡淮，南明两大主力在内战中同归于尽。本来应该是抵御清军的四镇军队，却因为内耗土崩瓦解纷纷投敌，永历、绍武二帝竟为争正统而兵戎相见，两败俱伤。后人读史至此，往往痛心疾首，若彼时能团结一心，何至于此！


    然而这种如果团结的假设，本身便忽略了南明政权面临的深层结构性困境。南明各方势力的内斗，并非简单的道德败坏或目'
  - '[PAGE 1]


    光短浅，而是一套失效的政治系统在资源分配预期崩塌后的必然结果。


    所以，南明历史一个残酷的真相就是，相对于团结一心抵御外敌，内耗才是当时各方势力的最优解。为什么？三个原因。


    首先，是朱家王朝政治信誉的崩塌。南明各方势力团结一心最好的结果是什么？无非就是驱逐（干掉了）满清，为朱明朝廷再次续命而已。


    但是朱明王朝续命的结果是什么呢？再出一个朱元璋 2.0 的皇帝？朱元璋驱逐鞑虏后面是怎么做的？将共同打天下的老兄弟，也就是缔造大明拥有政治股份的勋贵杀得干干净净！


    翻脸不认人这就是老朱家的传统。明末最后一个皇帝崇祯号称勤政，但同样却是一个不愿承担责任并且凉薄之主，明明是崇祯安排兵部尚书陈新甲与清议和，但是消息泄露之后面对汹汹舆论，崇祯竟然以私自议和的罪名将陈新甲下狱处死。


    卢象升忠心耿耿并且品德俱佳，但同样被崇祯猜忌，军队被分化，粮饷不给供应，遥着卢象升领着一群饥肠辘辘的军队在巨鹿战死，死后居然不给抚恤——令天下震动！


    这样的忠臣竟然落得这样的下场，未来谁再为朱明朝廷卖命，谁就是傻子！简单地说，就是，崇祯死后，南明政权接盘的老朱家的政治信誉已经基本崩塌，其政治系统无法为各方势力提供稳定的利益分配预期。'
  - '[PAGE 2]


    一个健康的政治体系，应当能够通过制度化的方式，让参与者相信只要我遵守规则、做出贡献，就能获得相应的回报，且这种回报是可持续、可预期的。


    但是陈新甲、卢象升偏偏给所有人树立的是一个反面典型。如果系统分配机制失灵，那么参与系统的政治势力如何让自己利益最大化呢？


    那就只能靠自己去争！南明各派系并非不知道内斗会削弱抗清力量。但问题在于，他们面对的是一个典型的囚徒困境，合作收益虽大，但背叛收益更大，且先背叛者具有先手优势。


    这一困境的根源在于南明政权权力来源的高度模糊性。与朱元璋我打下来的江山不同，南明诸政权多由军阀拥立或文官推举而生。弘光帝由马士英等四镇军阀拥立，其合法性建立在武力支持之上。


    隆武帝依赖郑芝龙，永历帝挟转于孙可望、李定国之间。当最高权力的来源是谁拳头大谁说了算时，各方的最优策略便不是精诚合作，而是扩充自身实力、压制潜在对手。


    史可法并非不知团结之重要，但他身为督师，却调不动四镇兵马。马士英并非天生奸佞，但他明白若不与军阀结盟，自己与东林文官集团皆无立锥之地。


    左良玉东下清君侧，表面是政治表态，实则是预判，若马士英一派坐大，自己必遭清算，与其坐以待毙，不如先发制人。'
  - '[PAGE 3]


    这种不争即死的逻辑，使得任何试图调和矛盾的第三方都难以成功。因为调和意味着妥协，妥协意味着让步，而让步在当时语境下等同于示弱，示弱即可能招致对手的进一步蚕食。


    那么这种极度内耗一定会消耗南明抵御满清的力量，如果内部之争，仅仅是让某一方势力做大，未来在满清军事打击下同样会灰飞烟灭，也许内耗还有顾忌，但是南明面对的满清偏偏是历史上少有颇有格局的政权。


    当南明内部无法提供稳定预期时，一个能够提供这种预期的对手便展现出致命的吸引力。满清在入关初期的政治操作，恰恰击中了南明的这一软肋。


    满清给出的条件，本质上是一种政治股份制度。只要你带兵来投、立下军功，便给予旗籍（相当于入党）、世职（封爵相当于给予政治股份）、实权（就是给实际的利益），且这种回报具有相当的可预期性和传承性。


    洪承畴降清后得以入旗、参与机密，吴三桂、耿仲明、尚可喜等降将，不仅获封王爵，更得以世袭其位，保留私兵、拥有地盘。在明朝体系内，这些人可能终其一生只是边将，而在清廷体系中，他们获得了此前难以想象的政治地位和物质回报。


    更关键的是，满清在入关初期表现出了罕见的务实与灵活。它暂时搁置了满汉之分的意识形态包袱，采取以汉制汉策略，让降将感到自己不是被收编，而是入股分红。'
  - '[PAGE 4]


    这种先上车后补票的灵活性，与南明内部名分大义但随时可能被清算的玩法形成了鲜明对比。对于当时的军头而言，选择变得异常清晰。


    留在南明，面临的是内斗消耗、朝不保夕、未来不可预期。投向满清，获得的是明确的分赃承诺、世袭保障、以及相对清晰的晋升通道。


    这不是简单的气节问题，而是一个理性人在两套制度之间的成本收益计算。


    最后总结一下：


    南明之亡，常被归咎于内斗误国。但内斗本身只是症状，病根在于其政治系统丧失了提供稳定利益分配预期的能力。当一个系统无法让参与者相信按规则出牌有利可图时，参与者便会转向其他系统，或者通过破坏规则来攫取利益。人才和资源的外流，不是道德滑坡的结果，而是制度失效的必然。


    这一逻辑不仅适用于南明，任何组织或系统，若内部无法建立公平、透明、可持续的利益分配机制，便会陷入内耗，因为每个人都知道，与其等待系统分配，不如自己动手争夺。


    而当外部存在一个分配机制更优的竞争者时，系统的崩溃便只是时间问题。南明诸人并非不知团结之利，但他们所处的制度环境，使得团结成为不可能。


    这或许才是这段历史最令人叹息之处，不是他们不想做好，而是他们所处的系统，'
  - '[PAGE 5]


    不允许他们做好。


    最后的彩蛋，对比南明，现在那个国家与南明最类似，其系统已经丧失了提供稳定利益分配预期的能力，导致人才严重外流，未来这样情况演变下去会出现怎样的状况呢？未来我会在撰文解读。


