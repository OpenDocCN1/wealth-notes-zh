  - '[PAGE 0]


    # 国务院 AI+就业文件的解读


    261025 猫哥星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/3026ea9fa3c64835dcbbb8c97083228f_0_0.png)


    ![](img/3026ea9fa3c64835dcbbb8c97083228f_0_1.png)


    小懒判断 | 适合每天担心被 AI 抢饭碗的上班族和小老板，不适合想听文件原文逐条解读的体制内研究者。最值得看的是"就业友好型"这个新评价标准——以后政府项目只省人力不保就业的
    AI 可能不给过；坑在于国家只给缓冲期不兜底，底层岗位被替代没有退路。


    10 月 23 日，国务院发布了《关于适应人工智能技术发展助力构建就业友好型发展方式的意见》，这个文件谈的是 AI 时代就业问题的顶层设计，这里给大家解读一下高层的思路。


    大家最担心的就是 AI 普及之后，会不会导致上班族大规模失业的问题，对此，高层的思路是这样：一个是 AI 要不断创造新的岗位。一个是要给上班族缓冲时间，让上班族学习使用
    AI 的新技能。


    简单的说这个文件就是谈了三句话：


    +   1、别光想着用 AI 就裁人。

    +   2、被 AI 顶替的人，得有缓冲、有培训、有转岗。

    +   3、企业要用 AI 多创造新岗位。'
  - '[PAGE 1]


    下面讲一下文件中的几个关键要点：


    +   1、就业友好型发展方式。意思就是以后评价一个 AI 项目牛不牛，不光看省了多少人力成本，还要看这个项目搞完之后，人是更稳了，还是全失业了？能带人一起升级的，优先支持，纯用
    AI 把人踢走的要谨慎（至少不是政府鼓励与支持的方向）。


    +   2、稳慎把握应用范围、力度、节奏。这主要针对劳动密集型产业（也就是容纳大量就业的产业），对于这类产业的 AI 应用不是不能上，而是要把控范围与节奏。比如，先让
    AI 干夜班、高危、缺人工的活，不能一刀切把员工全部都裁掉。


    +   3、失业缓冲期。以后大企业要大规模上 AI，应该提前告诉员工哪块要变，而不是当天通知员工你被裁了，要给员工缓冲期。


    +   4、就业风险评估。对于政府与国企项目可能就是强制性要求。


    +   5、AI 训练师、数字人训练师、人机协作协调师。就是要引导 AI 创造新的岗位，包括教 AI 懂业务的（AI 训练师）、管 AI 和真人怎么配合的（人机协作）、做数据标注、智能体搭建、提示词工程师、给小公司做怎么用
    AI 省事不裁人的顾问，当 AI 替代一批初级劳动力之后，AI 同时创造大量关联岗位让劳动力可以通过技能培训再就业。


    那么这份关于 AI 时代的就业友好型设计对于普通人意味着什么呢？'
  - '[PAGE 2]


    # 1、上班族（包括白领、文职、客服、基础设计、初级代码）：要有危机感，同时也有机遇。


    ——基础重复活（写周报、做表、审合同初稿、简单排版）会被 AI 替代，这是大趋势不是任何人与组织能阻挡的。


    ——所以上班族的学习方向是学会让 AI 给你打工，这样才不会被淘汰。


    ——未来在熟练指导 AI 工作的时候，普通上班族拼的是：判断、沟通、行业经验、对 AI 结果进行审核。国家会推免费或者低价 AI 培训、微专业、转岗课，帮助上班族渡过这个过渡期。


    # 2、底层劳动者，包括工人、服务员、司机、店员：短期不用怕被一夜替代。文件意思很明确，劳动密集型行业慢一点上 AI。高危、重体力、招不到人的岗位（矿上、巡检、仓储）先让
    AI 顶。但中长期要学习设备操作、简单维护、系统录入、人机配合流程。以后不是被 AI 取代，是会和 AI 一起协同工作的人才能留下。


    # 3、小老板、个体户、小工厂：文件说要给中小微企业提供小快轻准的 AI 工具：便宜、不复杂，能管库存、写文案、做客服、搞直播话术。你不用养大团队，也能用
    AI 扛一半杂活。国家还会给贷款、创业支持、数字化服务。


    # 4、学生、应届生：别只学会被 AI 秒做的事情。多碰 AI 工具实操、行业知识（医疗、法律、制造、农业、电商）、沟通销售、'
