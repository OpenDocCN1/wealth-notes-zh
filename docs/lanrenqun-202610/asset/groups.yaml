    # 用波段分析展望四季度乃至其后的 A 股走势


    261013 石建军

    整理： 公众号懒人搜索，懒人专属群精选

    懒人微信： lazyhelper1


    ![](img/aa1107bd06b6b4cd3fea85a8417de029_0_0.png)


    ![](img/aa1107bd06b6b4cd3fea85a8417de029_0_1.png)


    微信： lazyhelper1


    小懒判断 | 适合被套想找减亏节奏、或等着低吸的波段交易者；不适合指望"拿了不动等回本"的人。最值得关注的是他给出的具体路径：

    3741/3754 只是暂时支撑、必破，真正的低吸机会在反弹受阻后的再度下调，B 波反弹大概率要等 11-12 月启动。定投标的也给了具体名字：科创 50ETF+通信
    ETF。坑在于他说 A 股调整"不少于两年"，别把 B 波反弹当牛市。


    石建军，笔名石天方。中国资本市场第一代证券投资分析家。九三学社上海金融委专家委员会成员。华东师大国际商务硕士学位专业兼职硕士生导师。1990 年进入证券市场，1994
    年即为上海证券报专栏作者。作为全国最早的中央台财经评论嘉宾，曾在中央台、中央电视台、上海第一财经、湖北卫视等财经媒体长期担任嘉宾。是香港文汇报财经版特约采访嘉宾。水晶球财经网
    2018、2019 名博评选第一名。在全国投资者中有着广泛的声誉和影响力。


    擅长用经济周期理论结合波浪理论预判大势。擅长结合国家产业政策导向和行业发展前景捕捉投资方向。创立和实践投资操作三格言：1、明大势者赚大钱；2、主流'
  - '[PAGE 1]


    品种决定投资收益；3、价值投资选股、趋势操作选时。


    具有极为丰富的证券投资管理经验。对国际主要股市和国际商品市场的运行规律有着深刻的研究。极为准确地预测了中国股市多个历史性的重要顶部和底部。


    本周上证指数是一根带下影线的类十字阴线。创业板和科创50指数基本属于带下影线的锤头阴线。颇为遗憾的是，上证的5周与10周均线已经连续两周呈空头排列态势，创业板已经连续13周空头排列，科创50也已经连续10周呈空头排列现象。


    昨天长假后第一天的盘面令人失望。有投资者感到非常困惑：这大盘究竟怎么了？尤其是昨天和今天上午，个股的下跌势头似乎完全没有能力阻挡。但我很清楚，上证前低3741点，多方主力无论如何都要进行一下防守的。因为，破位3741点，意味着上证将进一步向下拉稀。市场心态也会面临崩溃。


    果然，多方主力今天下午动手护盘了。收盘完全收复了当天上午的失地。就日线结构看，今天的3754点，短期应该能够维持支撑。理想一些的话，其后反弹继续向上挑战3850点，甚至继续试探3870-3900点的可能性也不能完全排除。


    但是，我更关心的，并不是短期反弹，而是市场的波段趋势。


    实际上，大盘目前的这种态势，早就在我的意料之中。我在之前的专栏文章中，早'
  - '[PAGE 2]


    就明确指出：4258 点很可能已经是今年上证乃至明年的最高点。并且，我还暗示，甚至 4000 点都已经成为四季度上证大盘难以攻克的重要阻力。这些预判意味着什么？意味着我对四季度乃至明年的大盘是不乐观的。


    既然我四季度连 4000 点都不乐观，那大盘运行的方向将指向何方？当然也就不用言喻的了。


    今天大盘下探到了 3754 点这个位置，一定有不少投资者会有这样的念想。那就是：期盼大盘能够在 3800-4000 点的箱体里进行横盘震荡。


    这个愿望当然是好的。但既然我判断 4000 点大概率已经成为四季度的强大阻力位，你难道会认为大盘就会一直横盘震荡下去？


    既然不可能一直横盘下去，那最后的取向会指向哪里？可见，只要认真想一想，就不会对大盘的走势感到困惑了。非常明显：3741 与 3754 点的两个支撑只是暂时的。大盘最终跌破这两个位置只是时间问题。一个显而易见的佐证是：反映整个市场面貌的国证
    A 指和期货股指的重要代表沪深 300 指数，早就向下破位了。上证指数只是一个掩人耳目的表象而已！至于大盘最终会在哪个位置真正止跌，现在时机不合适，我们还是以后再谈。


    我们再来谈一谈我上面提到的创业板和科创 50 指数。


    先看创业板指。'
  - '[PAGE 3]


    我们可以看到，无论是周线图，还是月线图，创业板指由 4380 点开始的调整，几乎已经将由 2892 点开始上涨的第五浪的升浪完全抹去。即便如此，这还仅仅是一个三段式的下跌
    A 浪，并且 Ac 浪是否接近完成还有待观察。理论上，一旦 A 浪调整全部完成，其后应能出现一个 B 浪反弹。如果这个 A 浪调整能够在 2892 点附近完成，那么，预期中的
    B 浪反弹，是有望指向 3750 点附近的。但从目前的 Ac 浪的结构看，似乎还没有完全到位。


    再来看科创 50 指数。


    科创 50 指数目前同样正处在 Ac 浪的调整过程中。从形态上看，科创 50 目前的位置距离其五浪的起点 1249 点还有些空间。目前情况看，科创 50 的调整似乎还未真正到位。如果科创
    50 在节奏上与创业板指同步，那么，本次反弹完成后，仍要提防双创指数还有一小跌这样的可能性。


    当然，同样道理，科创 50 的 Ac 浪调整完成后，理论上也应该有一个 B 浪反弹。而 B 浪反弹的目标位，应该在 1800 点附近。


    从时间上看，无论是创业板还是科创 50 指数，真正能产生有 20-30% 空间的像样 B 浪波段反弹，恐怕要到 11 或 12 月才有可能见底启动。换言之，双创指数在四季度可以找到一个相对波段低点，也就是
    A 浪底，然后才能展开像样的 B 浪波段反弹。再结合年底和年初这个特定时间段，也许，我所预判或期待的 B 浪波段反弹，就很可能是从属于春季行情的这个波段性质了。'
  - '[PAGE 4]


    所以，从不好的角度看，目前大盘的调整在反弹受阻后还会继续进行。但从好的角度看，反弹后的再度下调，将有可能成为下一个波段行情启动前不错的低吸机会。上面的分析，我是以创业板和科创
    50 作为分析案例的。虽然六月底和七月初以来，这两个指数的下跌很令人难受。但深度下跌后的反弹空间，也只能指望这两个指数。上证指数受主力资金的勉力维护，虽然下跌的幅度小很多，但未来的反弹空间也就小很多。这也就是为什么，我建议投资者定投科创
    50ETF 和通信 ETF 的原因。前一个，直接对标科创 50。后一个，是因为虽然创业板第一权重是宁德时代，但通信 ETF 中的两个老大中际旭创和新易盛，两个合起来的权重在创业板中比宁德时代的权重还要大。定投了这两个
    ETF，就相当于定投了科创 50 和创业板这两个指数！


    当然，在定投低吸这两个 ETF 品种的同时，投资者还可以适当关注指数调整中市场主力用来维护大盘的几个业绩红利股。例如电力板块中的权重老大和船舶制造中的权重老大。既可以对冲持仓市值的下降，又可以享受相对可靠的股息率。


    至于上证指数，我总的看法，最终 3741 点是很难撑得住的。大盘已经再度进入了空头市场是毫无疑问的。根据库存定律和周期规律，A 股上涨了两年多，其后的调整恐怕不会少于两年。所以，投资者今明两年的减亏扭亏机会，恐怕就只有预期中的
    B 浪波段反弹这唯一的机会了。


