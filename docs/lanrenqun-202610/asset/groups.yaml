  - '[PAGE 11]


    离底部已经很近了。只要周线进入超卖范围即可止跌调整到位。短线低吸高抛吧。中长线则耐心等一下大的试错机会的到来。


    # 第十四，大型指数分析：


    *①：科创 50：日线下行趋势。老铁们，科创 50 连续跌了两天之后，下方的缺口终于回补了，终于见到了日线底背离，日线也是超卖，理论上是符合试错的条件。但是，从科创
    50 的周线走势来看仍然有问题，说明科创 50 的中长线还有下探空间。创业板都出现了周线底背离信号，那么科创 50 看看是否也要等待他出现周线级别底背离信号再重仓呢。


    所以仍然需要保持耐心。至于短线上，下周他可以反弹反抽，但是仍然不看反转，因为周线毛病太多了，反弹逢高记得做个减法。等合适的低点低吸回去。


    *②：北证 50：日线下行趋势。老铁们，北证 50 的洗盘也是够缺德的，毫无底线。这不北证 50 再次出现周线底背离信号，那么大概率还会打压盘面。继续保持耐心等待调整完毕。短线上有反弹也暂时不看反转。


    *③：沪深 300：日线下行趋势。老铁们，沪深 300 继续做周线级别底背离，周线双死叉月线双死叉，中长线仍然是继续看调整为主吧。还有下探空间，但是不会大跌很多了，因为马上就会遇到支撑了。


    *④：中证 500，日线下行趋势。老铁们，中证 500 终于出现周线级别底背离信号，'
