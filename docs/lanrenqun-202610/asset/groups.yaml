    在使用 AI 创作短篇小说的过程中，很多朋友可能都遇到过这样的情况：


    明明大纲看起来没什么问题，可一旦开始生成细纲，剧情就变得越来越平淡。故事线始终围绕着同一种矛盾展开，前后情节高度相似，反派的行为经不起推敲，涉及权谋和博弈的部分更是漏洞百出。


    于是，我们开始不断要求 AI：“剧情再精彩一点”“反派聪明一点”“增加一些反转”。


    但修改了好几轮，效果依然不理想。


    其实，很多时候问题出在我们没有准确地告诉 AI，究竟哪里写得不好，以及应该朝'
