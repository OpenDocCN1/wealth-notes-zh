    小懒判断 | 适合满仓或深套、纠结明天该不该割的 A 股短线玩家；不适合长线定投不看盘的人。最值得关注的是他给出的量化信号：上证日线序列最迟明天九转，今年前三次一级超跌当天全是实体阴线，所以最理想的走势是明天收阴包阳、收在
    3764 点之下，筹码才算洗干净。坑在于当下位置量化反复做 T，你不做量化一定做，盘中弹性 ETF 出现 5-6 个点空间必须积极做题自救，光扛着不动最吃亏。


    今天去一家大型的资管选资机构去路演，最近市场都在传选资机构是砸盘的主力，人家这个也很冤枉。而且我可以确定一点，就今天聊了很长时间，无论是这个国资的选择机构还是非国资的，这几天砸的这个量都是非常有限的，所以大家不要听信外面这些说法，这都是不实的。


    市场走到今天很有意思，今天上午的时候有不少的机构的人跟我说陪同我想割了。就是在上午跌的最惨的那个时候，我都跟他们讲要不再坚持一下。因为那时候我在高铁上，我说你们要割也不是现在，对吧？结果下午一个又喜笑颜开了。


    但实际上我是很不开心的，为什么？因为'
  - '[PAGE 1]


    大家注意看，这个位置从上个礼拜五被神奇的救起来以后，其实上个礼拜五的盘中已经出现了一级超跌了，是今年第三次一级超跌。但是就有一群大聪明，收盘给他拉回去了。好，一级超跌没了。


    昨天砸了一天，大家注意，尤其是昨天双创好不容易又砸了 2%以后，今天接着盘中又砸的时候，其实今天如果收盘就这个样子的话，又出现一级超跌了。结果又有大聪明进来了，又把他拉上去，好，一级超跌又没了。


    所以这个地方怎么说呢？就是从现在目前这个情况来看，我们从日线的结果来看，咱们以上证指数为例，上证指数这个结构大的序列的久转最迟是在明天，明天就序列会出现九转了。那么问题是如果明天还不能够收一根阴线，收在
    3764 点，也就是 7 月 17 号的那个收盘价之下的话，那反而就坏了。


    明天最优化的这个走法是什么呢？明天收益更阴线，大家不要不高兴，明天收阴线，你应该很高兴。我现在最希望就明天收阴线，而且最好收在 3760 点下，是 3300-3600
    以下。那么现在今天又给你收回了 3800 点，就还差三十多个点。


    如果明天能够收在 3764 以下，大家注意看，今年以来前三次的一级超跌和二级超跌，当天都是实体的阴线，无论是 7 月 17 号还是 6 月 5 号，6 月
    5 号虽然是个假阳线，但它那天也跌的这个上证指数跌了 1.7%，这是最小的跌幅了。那么还是再往前看，3'
  - '[PAGE 2]


    月 23 号那一天是跌了 3.63%， 跌幅最大。

    那么这意味着什么？意味着在真正见阶段底的那一天，都应该是一根实体的阴线，而不是像今天这样直接见一根阳线就起来的。


    所以大家注意看，如果明天收一根阴包阳是最好的走势。所以你们心里面要清楚，明天不要怕。因为这个位置你创业板离下轨，然后这个科创 50 离下轨都很近了。这个地方跌的越深，它反而弹的动力才越大。


    最讨厌的就是现在这个走势对量化很有好处，但对在座的各位没有好处。大家注意看，从上个礼拜五到昨天，盘中的话像什么科创半导体、这个通信、这个 ETF，是可以先提出五个点出来的。结果今天早晨又能提出五个点出来，他们是一定会去做这个题的。


    所以你们现在记住，凡是盘中，如果像这种两个比较弹性很大的这种 ETF 盘中能给你做 5 到 6 个点的题，一定要做。所以大家还记得昨天和前天那个时候，上个礼拜五的时候，当时有人问我，包括昨天上午，当时这个通信翻红包括这个科创半导体翻红的时候要不要做
    T，我当时讲的是能做就做到。今天一看回来有接近八个点的这个空间，这种空间不做就是白瞎。


    就在现在这个已经是空间非常有限的情况之下，要积极的做题自救，没有办法了，因为量化你不做，量化一定会做。所以我讲这个位置大家要谨慎的乐观，但是盘中一定要积极的，尤其是
    有四五个点甚至五'
  - '[PAGE 3]


    六个点这种情况下，无论是个股还是这个 ETF 都要积极的做题，然后滚动去做这个仓位。


    我们现在最关键的就是看明天看他能不能够顺我们的意，能够砸一个大阴线阴包阳下去。因为只有这种情况下，筹码才能洗干净。所以我们明天看期待收盘能够收一根大阴线，这听的不像人话，但是实际情况就是如此。


    **Bingo**：如果明天阴包阳，早上如果有冲高是不是应该兑现？之前套了太深，就没动，现在想想还是做 T，降低预期吧。


    **冷局（星主）**：就怕主力不做人明天给你直接高走，明天想低于 3764 收盘挺难的。当然积极做 T，没有问题。个人观点仅供参考。


