  md: '

    查询验证能力更不行，只有这种人才容易骗到。毕竟绝大部分骗局你只要上网一搜就能看出来。诈骗组织就是看准了这些人绝对不会去搜索，才会对他们下手。


    我经常在想，到底啥原因导致人和人差距这么大？后来反应过来，本质就是“创作能力”。一个搜索高手，其实就是创作高手，他在开始搜的时候，就已经心里大概有个蓝图和构思，知道自己到底在干啥，然后通过搜索结果迭代创作过程，最后得到自己想要的结果。搜索水平低的人，100%不是创作高手。


    这个意义上讲，真正的力应该是：

    - 输出能力

    - 搜索能力

    输出在前，搜索在后。只有知道自己要输出啥，才知道自己该搜啥。也就是一个人看到什么东西，有自己初步的想法，然后通过 AI 迅速搜索对自己有用的信息，最后编辑输出，形成一个结果。大家可以看看那些高手，都是这么运转的。


    可以说，在 AI 时代，真正的核心竞争力 = 清晰的问题意识 + 高效的信息整合力 + 有价值的输出能力。比较可惜的是，这三个能力，绝大部分人，一个都没。


    而且现在还给这种输出能力增加了一个新的红利，那就是自媒体。一个如果有极强的“问题思维”，又知道怎么去查证，输出来的东西别人还能看懂，只要他坚持时间足够长在社交媒体上输出，迟早会有自己的读者群。


    可以说，同样的知识，谁讲得清楚，谁就拥有话语权。所以说写作这事严重被低估了，尤其现在理工科被抬到了很高的地位、文科被使劲踩的时代。其实如果你是问题导向的写作，写作这事纯粹就是个理工科的能力，你得跟解数学题一样，先定位问题，然后拆解，然后把每一块去找
    AI 验证，最后输出结论。


    事实上我这些年有个观察，那些面临 35 岁问题的人，抛开大环境问题，一部分当然是水平确实不行，更多的，就是输出能力太差了。有些连自己干了些啥都说不明白，你能指望他啥？尤其同一个公司的人都差不多，你的短板太短了，很容易被淘汰了。要知道，在技术岗位中，写文档、写
    PRD、写技术方案、写周报、写晋升材料……无一不需要清晰、结构化、有说服力的表达。


    还有很多人深恶痛绝的 PPT，高手写出来的就是清晰明了，水平不行的看一眼都是自我伤害，他俩其他水平差不多，如果必须优化一个，你选哪个？


    我说一个事大家就理解了。十几年前我刚进公司，我们有个项目交付，当时本来是我们的技术骨干做汇报，他的水平是极高的，但在汇报过程中，说的那些话，真是一言难尽，丝毫没考虑客户能不能听懂。客户问了几个问题，他的回答在我们听来是很清楚的，但客户明显完全没弄明白。后来我们领导注意到了客户开始不耐烦，赶紧把另一个水平一般，但口才很好的换了上去。


    接下来就顺利多了，客户那边终于能听明白了，并且指定让这个口才好的作为后续项目接口人，这货出力少但明显占了大便宜，后续很多汇报都是他去，甚至包揽了所有对外接口业务，一跃成了最不可或缺的角色。没多久领导高升，他成功上位。


    后来我们领导还跟我说，最稀缺的能力，叫“认知翻译”。不同的组织互相是有知识壁垒的，你们这边的常识，另一边完全听不明白。这就需要有个中间人同时能理解两个组织，把信息在两边传递，这比单纯的技术骨干要稀缺的多，这是一种知识层面的“共情能力”。毕竟绝大部分人知道“自己知道啥”，不知道“别人不知道啥”，缺乏同理心，自然没法沟通。


    很多时候别人并不知道你啥水平，只能是通过你对外展示的那部分来做判断，这种情况下，能说会道，输出能力惊人的，就特别占便宜。很多名校高材生在职业生涯后期路越走越窄，其实就栽在了这上边。


    这也就解释了一个问题，我之前看华尔街相关书籍的时候，发现一个问题，那边的很多顶级私募公司下边干活的人都是一群数学物理高材生，但是他们的头目很多是销售出身。因为这些公司很重要的两部分业务，去拉钱，还要给别人展示自己成果，都需要吹牛逼和答疑相关技能。


    此外写作这玩意有两个特点：它属于一个手艺而不是天赋，绝大部分人是可以通过后天大量的阅读，大量的写作，然后获得这方面的能力。


    更重要的是：每一次写作都在固化你的思维掌握。


    在 AI 之前的时代，搜索是个技术活，很多人这方面太差了，没法弄。现在好了，搜索门槛明显下降，跟写作能力配合起来，就是王炸，不仅对思想有巨大影响，还对事业有巨大影响。


    可以说：输出能力 = 将模糊的直觉、碎片的知识、混沌的经验，转化为可被他人理解、可被系统验证、可被时间沉淀的结构化表达。


    大家可能纳闷，该怎么开始呢？完全可以从读后感开始，看到了什么视频，或者文章，有启发，哪怕二三十个字，赶紧输出一下，每一次的输出，就是对大脑的一次训练。最好发社交媒体上，慢慢积累，说不定能做起来。其实长期输出有价值内容，100%能做起来。然后逐步加长，毕竟越长越难控制，但本质都是短文堆砌成长文。


    这种训练放在短期不明显，长期复利效果极度惊人，如果家里有孩子，可以让他从小练起来，哪怕每次只输出 20 个字，也会在长期产生巨大的效果。


    到此，咱们的结论也很清晰了，AI 时代不是说不用思考了，恰好相反，需要更高级的思考，思考那些无法被自动化，但是可以被 AI 增强的问题：提出原创问题，等 AI
    输出后，做出评价和修正，让他输出更高级的结论，最后输出为自己的东西，彻底内化为自己的思想，最好能变成品牌。那个“用杠杆创作财富”的纳瓦尔，其实也是这个逻辑。


    而创作和输出到社交媒体，可能就是将 AI 革命和个体结合起来最好的办法。


    文章到这里差不多了，倒也不一定看完我的文章立刻就做起来，可以把这篇当成种子，种下去。过些年突然发现有了写作的冲动，然后行动起来。真正属于你的东西，大概率会自己走到你面前，我这样的作者本质就是推动这一过程。


    ——————分割线——————


    在这个 AI 能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的护城河，只剩下“信息过滤”的效率与“认知系统”的维度。


