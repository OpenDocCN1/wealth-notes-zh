    # 中国不接受广场协议


    261011 猫哥星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/c8e30f2b5bad067e021b526a563278c5_0_0.png)


    小懒判断 | 适合被"广场协议 2.0"叙事带着焦虑、想看懂 10 月 8 日央行汇率声明真实分量的人。不适合想从里面抄汇率点位做交易的人。最值得关注的是两条再平衡路径的对比：西方方案要中国用升值交税，中国方案是十五五扩大内需、成本共担。坑在于央行明说不预设点位不干预长期趋势，企业别赌"政策底"。


    2026 年 10 月 8 日，中国人民银行发布《关于人民币汇率的政策立场》。这份文件不长，但信号极其明确——中国不接受 21 世纪的广场协议。


    先简单普及一下广场协议是什么。1985 年 9 月，美国、日本、西德、法国、英国在纽约广场饭店签了一份协议，核心就是一句话，让美元对日元、马克等主要货币有序贬值。结果日元兑美元汇率在三年内从
    240 飙到 120，日本出口被打残，国内资产泡沫破裂，最终走入失去的三十年。这个剧本，今天西方想重演。


    最近一段时间，人民币汇率压力空前巨大，这个压力就来自整个西方。


    德国总理默茨公开提广场协议式谈判，要求人民币升值，欧洲央行行长拉加德援引'
  - '[PAGE 1]


    IMF 模型，称人民币汇率低估 15%—16%，法国战略与规划署甚至算出人民币汇率低估 20%—25%，美国延续贸易战叙事，把汇率操纵、非市场补贴和中国顺差打包成同一套施压话术。


    2026 年 10 月 8—9 日中欧贸易与投资磋商在北京举行，10 月 12 日 IMF 年会紧随其后。时间线摆在这里，西方想在谈判桌上通过施压让中方接受人民币必须大幅升值的目标。


    央行 10 月 8 日这份声明，就是在与西方谈判前抢先定调——我们不接受广场协议。


    那么这份声明说了哪些内容呢？


    首先是央行阐述了人民币汇率变化的核心逻辑，不是不能升值，但是绝不能由你们定价！具体而言，央行在文件中阐述了三层意思：


    第一层：升不升、升多少，由市场决定，不由华盛顿和布鲁塞尔决定。"坚持让市场在汇率形成中发挥决定性作用。不预设汇率目标水平，不干预汇率长期趋势。"这句话翻译过来就是：人民币可以升，但升是因为中国经济基本面、贸易顺差、资本流入、美元走弱。不是因为西方开了个会、签了个协议、逼我重估。


    第二层：中国出口强，不是因为人民币汇率低估。"中国贸易发展根源于产业国际竞争力的提升，中国没有必要、也无意通过汇率贬值获取贸易竞争优势，从不搞竞争性货币贬值。"这是直接打脸人民币低估论。'
  - '[PAGE 2]


    央行给的数据很硬，2005—2008、2010—2014、2020—2021 人民币升值期，中国出口全球份额反而上升。说明什么？说明中国出口靠的是产业链综合竞争力、不是靠汇率打折。


    反过来，如果人民币被逼急升 20%，会发生什么？中国出口企业大规模倒闭，全球有效供给不足，最终会加剧西方的通胀，也就是西方买单。这不是威胁，是全球经济联动的常识。


    第三层：全球失衡的锅，不该只让顺差国背。"全球经济失衡与全球分工格局演进、国际货币体系固有矛盾、部分国家长期高财政赤字高消费等密切相关……将本国产业竞争力下降简单归因他国汇率，是对自身调整责任的推诿和回避。"这段是整份文件最狠的部分。它说的不仅是汇率，而是美国常年巨额逆差、军费扩张、财政赤字、消费大于产出，这是美元本位制的固有矛盾。


    欧洲制造业压力来自能源结构、监管成本、数字化慢、投资不足，不是中国币值问题。简单的说就是这个意思，西方你们经济搞不好就扩张债务印钞，自身生产能力不足，自然要加大进口产品需要，你不能进口产品买多了就怪我汇率低估。


    另外 IMF 的均衡汇率模型本身不成熟，算出来可正可负，拿个别数字当人民币必须升值的判决书我们不认。


    简而言之一句话：你们自己要吃药，别逼中国也要感冒。'
  - '[PAGE 3]


    <!-- no content -->'
  - '[PAGE 4]


    利润一夜蒸发。


    二是央行偷偷保某个点位，企业不做套保，突然破位亏死（但是中小企业做套保成本比较高）。


    声明的回答是：


    央行不预设人民币汇率点位，企业别赌汇率有政策底。


    央行不干预人民币汇率长期趋势。


    当人民币汇率出现短期极端波动时候，央行会出手干预。


    用大白话解释就是：人民币汇率波动会是常态，企业该搞技术、搞成本、搞市场，不要去炒汇率。


    回到文章的主题，中国之所以在与美欧谈判前抛出一个措辞强硬的声明，还是有深刻原因的。


    1985 年的日本，没有独立主权，并且出口主要集中在部分高端产品（汽车家电），对美国与欧洲市场严重依赖，所以西方抛出广场协议日本含泪也只能妥协。


    现在全球是啥情况？


    ——美欧关系是历史上最差的时期，双方各怀鬼胎很难在对华立场上协调一致。


    ——中方有独立的外交与金融体系，不需要看任何国家脸色行事，并且在过去 8 年表现出硬怼美国贸易战的勇气与决心。


    美欧是中国非常重要的出口市场，但是中'
  - '[PAGE 5]


    国并不如同当年日本一样严重依赖美欧市场，中国商品品类繁多，横扫全世界。


    ——最为关键的是，现在国内内需偏弱，经济正处于转型阶段，如果这个时间点推动人民币大幅度升值，必然导致大批外贸出口企业破产（这真不是开玩笑），失业率剧增，代价太大了。


    广场协议的本质不是汇率协调，而是中心国家用金融手段重新分配外国国家的发展成果。所以央行发布这份文件的立场并不是拒绝与西方谈判，而是换规则谈；


    你可以谈全球再平衡，你可以谈贸易公平，你甚至可以谈产业补贴的问题，但别谈人民币必须升值多少。


    这不是汇率问题，是发展权问题。中国不接受广场协议，就是不接受全球贸易不平衡的代价由中方单独承担。


    ![](img/c8e30f2b5bad067e021b526a563278c5_5_0.png)


    在这个 AI 能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的护城河，只剩下“信息过滤”的效率与“认知系统”的维度。


    圈子已稳定运行 7 年。我们每天利用 Python 爬虫与大模型算力，过滤全网最顶级的政经内参和搞钱风向标，做你最冷酷'
