    ![](img/b93ef4158f740aa1cbd0070108e76123_0_0.png)


    小懒判断 | 适合每年诺奖揭晓都“看不懂”但想知道这个奖到底在奖什么的人。最值得关注的一个类比：米其林评星不看菜好不好吃，看有没有推动烹饪边界——诺奖也一样，它不是为普通读者的阅读体验设计的。坑在于：把诺奖当“必读书单”会失望，它是在文化丛林里竖坐标，告诉你有个方向存在，不是让你非走过去。


    上周，2026年诺贝尔文学奖揭晓，获奖者是加拿大诗人安妮·卡森。


    跟很多年份一样，很多人的第一反应估计都是，“这是谁？”在网上搜一下，你会发现给她的颁奖词是这么写的：“表彰她大胆创新的作品，在与古典传统的趣味对话中，为当代文学创造了新的形式。”大概很多人读完之后会更蒙。好像每个词都在文学评论里见过，但它到底是什么意思？什么叫“与古典传统的趣味对话”？这个新形式指的又是什么？


    说到这，我想说，我真的太懂你这种感觉了。几乎每一年诺贝尔文学奖揭晓的时候，很多人都会有类似的反应。不知道这个作家厉害在哪，不知道作品好在哪，甚至说不上来自己是“说不出好在哪”还是“压根就感觉不到好”。


    首先，我不是文学方面的专家。其次，我个人认为文学本身很难有标准答案。因此今天，我们不谈这位获奖者的作品，而是借着这个消息，回答另外一个问题。我们为什么需要一个很多人“看不懂”的诺贝尔文学奖？尤其是在AI写作泛滥的今天。


    接下来，我就用最直白、最实在、最不绕弯子的话，跟你说说这个问题。


    我们先从今年的获奖者说起。安妮·卡森，76岁，加拿大人，是多伦多大学的古典学博士。在文学领域，卡森的身份很多，包括诗人、散文家、翻译家、古典学者。但是，你又很难用一个单一身份去描述她。因为她写的诗，有时读起来像论文。她的很多学术作品，又带有很强的个人艺术主张。据说卡森本人也很反感别人定义自己，她曾经要求出版方，在所有书的作者简介里只写一句话：“安妮·卡森，出生于加拿大，以古希腊语为生。”


    很多人认为卡森的作品很特别，特别之处在于，她经常把“古典”的故事重新拆解，用来描述现代人的“情感生活”。这么说可能有点抽象。举个例子，卡森最有名的作品之一叫《红的自传》。古希腊神话里有一个怪物叫革律翁，浑身赤红色，最后被大英雄赫拉克勒斯杀死了。这是一个标准的英雄打怪的故事。


    但卡森把这个故事重写加工。怎么加工呢？这里我稍微偷个懒，把网上对这个故事的


    ## 那么，诺贝尔文学奖为什么要选一个“难读”的作者？它选人的标准到底是什么？


    注意，诺贝尔文学奖从来没有公布过任何官方的“打分标准”。我们接下来谈的，只是读者们基于诺奖的获奖脉络，得出的观察。


    简单说，在很多人看来，诺贝尔文学奖，最在意的不只是通常意义上的“好看”，更是这个作者“对文学本身作了什么贡献”。打个比方。你去一家餐厅吃饭，觉得特别好吃，这是“审美经验”。但米其林评星的时候，它不只看好不好吃，还要看厨师有没有创造新的技法，有没有用前人没用过的食材组合，有没有对“烹饪技艺”本身产生影响。你在家做的红烧肉可能比某些米其林三星好吃，但它不会得星，因为它没有“推动烹饪的边界”。


    所以当你“看不懂”的时候，不是你的问题。这个奖本来在某种程度上，就不是为普通读者的阅读体验设计的。


    而且既然不是为普通读者设计，评选方式自然就不依托于普通读者。诺贝尔文学奖的评委，来自瑞典学院的文学和语言领域的学者。这批人加在一起，一共只有18个人，而且理论上是终身任职的。这18个人之下，设有一个5人的文学奖委员会，负责具体的筛选工作。


    筛选流程是这样的，每年11月，委员会开始发提名邀请信，寄往全世界的大学教授、文学机构、往届得主。次年1月截止。春天时，要筛出20到25人的长名单，5月缩减到大约5个人。夏天，院士们会读书、讨论、准备评估报告。9月开三次会，10月投票。票高者获奖，且得票数必须超过半数。


    注意，虽然评选流程是公开的，但是，具体的内容全部保密。谁被提名了、院士们怎么讨论的、每个人获得多少票，这些档案全都锁在瑞典学院的保险柜里。按照学院的规定，要50年后才解密公开。比如，今年的评选细节，要等到2076年才会公开。而目前，这个信息还只是公开到了1975年。没错，我们现在能看到的最新解密名单，还是1975年的。那一年进入长名单的有纳博科夫、格雷厄姆·格林、加西亚·马尔克斯，这些后来都成了文学史上的大人物。有些后来获了奖，有些到死都没获。


    ### 那么，基于这套机制，“可能的”标准是什么呢？我们可以看看这几年的颁奖词。


