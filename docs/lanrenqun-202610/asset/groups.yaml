  - '[PAGE 0]


    # 踩爆利车重创科技股信心


    261011 瑞宏斌

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/7af2362739b4d758989465d7bff10d79_0_0.png)


    **小懒判断｜**适合手里有 A 股科技仓位、想知道国家队这轮到底救什么的人；不适合想抄底 AI 概念的短线客。最值得关注的是大跌当天股票 ETF 净流入超
    179 亿——国家队只救流动性不救估值，给你时间补保证金，但不会改变趋势。坑在于炒概念和炒利润混为一谈：大股东在回购的是后者，在卖公司给散户的是前者。


    本周只有 8 日、9 日两个交易日，科技股 8 日大跌，9 日继续大跌，不过在周五下午有神秘资金入场救市，外界普遍认为这是国家队来托市了。1-2 月国家队大笔卖出，现在买回来的力度远小于当初，不过好歹也算是买入。


    周五下午最关键的证据不是指数，而是 ETF 交易数据。其中科创 50ETF、创业板 ETF、中证 1000ETF、科创半导体 ETF、沪深 300ETF 获得了大额申购。大跌的
    10 月 8 日，股票 ETF 净流入竟然超过 179 亿元。


    现在的策略是救流动性，而不是救估值，也就是说，担心跌得太快了你们又有不少人要爆仓，所以打算反弹一下，让跌势缓一缓，给你一点时间去补保证金。国家队'
  - "[PAGE 1]\n\n可以减缓跌势，但不会改变趋势。\n\nA 股的科技股，最大的问题还是估值太贵，跟老美的科技股没法比，人家什么盈利规模，我们什么盈利规模，而且洋人的科技股还在大手笔回购，咱们则是大股东卖公司给散户，差太多了。\n\
    \n此前我们反复强调，炒概念要让位于炒利润了。炒概念的公司，大股东当然知道这辈子不可能赚到这么多钱了，所以一定是卖公司给散户；炒利润的公司，大股东还会继续增持或回购，这就是最大的区别。\n\
    \n由于我们主要仓位还是 AI 铲子股，所以我们最需要知道的是三件事：一，AI 基建的巨额投资，能否转化成公司的利润；二，PCB、CCL、存储芯片等基建设施，是否仍然供需紧张；三，在能源价格大涨和加息利空下，这些股能否承受得起。\n\
    \n# 一、本周重要财经主线\n\n+   1、AI 融资规模越来越夸张，发债已发癫。\n+   \n+   本周的消息，SpaceX 正考虑筹集约 400\
    \ 亿美元购买英伟达芯片，其中包括约 300 亿美元债券和 100 亿美元银行贷款。一方面 AI 投资扩大，数据中心建设和采购继续增加，利好所有 AI 铲子链；但另一方面，融资成本上升，客户收入兑现慢，可能迫使企业延迟后续资本开支。对建滔和巨石这样的上游供应商来说，客户仍然能借到钱继续投入，当然是好消息；哪天客户借不到钱了，那就麻烦了。\n\
    \n+   2、跌的是中国 AI 铲子股，美国 AI 铲子还"
  - '[PAGE 2]


    # 在涨。


    这是本周最令人扎心的事实。纳斯达克又创新高，英伟达市值接近 6 万亿，与此同时美国 10 年期国债收益率升至约 5.31%，科技股根本不怕，照样涨上去。另一方面呢，中国的科技股继续大跌，沪深
    300 指数已连续九周下跌。这说明全球市场并不是统一看空 AI，而是看空中国忽悠人的 AI。特别是十一长假结束后的第一天，懂车帝就曝光百万豪车某界 v800，竟然连刹车都能踩断，遥遥领先竟然是这么个结局。这件事非常重大，直接动摇了大家对中国科技的信心，让大家意识到，那些嘴上吹得厉害的东西，是不是最终都是这么个破烂。这件事的发酵还远远没有结束，可以继续等着看后续。国产科技其实还有一个利空，就是担心外国的
    AI 基建投资可能无法利好国内的公司，因为人家主动从供应链里排除你——他不买你的东西可不可以？就像你也可以不买他的东西一样。


    # 3、存储产业还在涨。


    越来越多的 大型云服务商都在和存储厂商签订长期协议，推动 AI 服务器出货预测上修。预计第四季度一般型 DRAM 合约价环比上涨 10%-15%，NAND
    Flash 上涨 15%-20%。


    # 4、国庆期间消费还是不行。


    国庆期间到处人挤人，这确实是事实，但是人均消费比去年还要低，大家都在穷游。这与我们此前讨论的碳基消费、硅基资本开支分化有一定联系。AI 投资可以带动部分制造业，但不能完全替代居民消费对经济的支撑。喊了那么久的拉动内需，但不提高老百姓的工资收入，拿什么去拉动？要提高百姓'
  - '[PAGE 3]


    收入，必须要动某些人的蛋糕了，对于这块，我还是继续悲观。碳基生物的消费，已经退化到只有医药还行了。


    # 二、重点股复盘


    建滔系。只要 A 股不开盘，建滔系就涨得很好，一旦 A 股开盘，就像见到了丧神一样，一泄如注。好消息是建滔系下半年业绩必定能达成张国荣在半年报上的预测，就是双
    100 亿，现在只能像守寡一样守股了。


    中国巨石。巨石的调整已经到尾声，因为电子布的基本面仍然很强势，而股价已经跌回当初建议的买入位（40 元以下），行业渠道显示 9 月报价维持高位。这家公司主要问题还是二股东跑路，导致信心动摇。


    富祥。富祥近期出现了资金回流，这只股也已经调整结束了，接下来只需要耐心等三季报（10-24），你可以在三季报附近卖出。


    大金重工。这只股本来涨得挺好，周五下午小道消息传闻欧洲又要对中国的风电设备加反倾销税了，所以暴跌。但周末传出来的信息表明，中欧主要的战场是新能源车出口，似乎都没提到风电设备的事情。外媒报道说，中方终于让步了，同意削减对欧洲的汽车出口，所以我判断下周该股即将反弹。


    在这个 AI 能替你写代码、写文章的时代，'
  - '[PAGE 4]


    基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的护城河，只剩下“信息过滤”的效率与“认知系统”的维度。


    圈子已稳定运行7年。我们每天利用Python 爬虫与大模型算力，过滤全网最顶级的政经内参和搞钱风向标，做你最冷酷的“外部大脑”。


    如果你认同这种“重塑认知防线”的极客主义，欢迎围观我的个人情报智库：【懒人专属群】。


