    “应急钱”的第一次身体记忆。


    大一读完《小狗钱钱》和《富爸爸穷爸爸》，我只抽出一条对后来真正有用的判断：


    **房子和车子不一定是资产，可能是负债；钱是工具，不是消费品。** 靠着这套很朴素的逻辑，我大学四年兼职攒下了 10 万块。


    **有这笔托底，我才敢辞职。** 这是所有自由职业的地基——不是“我想自由”，而是“我有资格不接那单烂活”。


    **如果你现在还在上班，想辞职又不敢，先看一件事：你手里有没有一笔能覆盖 6 个月以上开销的钱？没有，就先攒。有了这笔钱，你才有底气谈自由。**


    # ## 02 要有「算清账」的能力


    很多人做自由职业，赚得不少，年底一算却没剩下多少。**问题不在赚，在于你从来没算清钱去哪了。** 以前我不记账，只看月底总账单，生活费和工作成本混在一起，完全看不清钱漏在哪。看似月月赚钱，月底一算剩不下钱。


    做滑雪教练，看着是“上一天课赚一天钱”，其实每一单背后都有成本：雪票、路费、住宿、装备损耗。**如果不把这些扣掉，你赚的只是流水，不是利润。** 现在每一笔成交前，我先扣掉硬成本算纯利润。做小红书高客单引流时，我没有买公域流量——我投入的“成本”是我的雪票、路费、住宿，这些是打造高客单必需的**生产资料**，和个人生活开销完全是两回事。'
  - '[PAGE 3]


    分账之后我才第一次看清：钱到底花在哪、哪部分能回本、哪部分是纯浪费。


    我用一张最简单的 Excel 就够：**记录每单的硬成本和纯利润**。它不是记流水账的工具，是我的**现金流仪表盘**——看清漏洞，才能堵住漏洞。


    | 序号 | 客户名 | 地点 | 天数 | 日期起-结束 | VIP | 收入 | 成本 | 净利润 | 每天收费 | 备注 |

    | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |

    | 1 | 河北 | 北京 | 10.0 | 2025.11.17-2025.12.3-6 | 1V51 | 750.0 | 22750 | 2372 |
    每秒150/8/28 | ... |

    | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... | ... |


    **如果你也算不清自己这个月到底"净赚"多少，先别急着拓展业务，先把这张表建起来，将工作和生活的钱分割出来。**


    # 我的核算单元：把"一个月"当成"一单"来算


    我用的是一个更原始的口径——**我的核算单元，就是每个月的每一单**。一单一行，记清楚：这单收了多少、雪票花了多少、路费住宿花了多少，最后落到这单的净利润。这样月底一拉，我这个月有几单、总收入多少、总成本多少、净利润多少，一目了然。


    **为什么要细到"一单"这一层？**因为只有细到这一层，你才知道哪一单在赚钱、哪一单在赔时间。汇总数字是结果，单笔才是原因。


    # 定金：一笔钱同时解决两个问题'
  - '[PAGE 4]


    我一般是**先收定金**，作用有两个：


    **第一，定金就是我这单的启动资金。** 雪票、路费、住宿这些成本是要提前垫的，定金一到，我这单的生产资料就有了着落，不用拿自己的钱去垫。


    **第二，定金是客户的取消成本。** 客户付了钱，再想临时取消就会有顾虑。这不是我心眼多，是自由职业者必须给自己加的一层风险对冲——你的时间一旦被预约走，就等于卖出去了，卖错了就收不回来。


    **尾款我放在课程开始前一天结清。** 这样既不会出现尾款收不回来的情况，客户临到跟前也已经付款，双方的预期都是稳的。


    **如果你也在做“上一天课赚一天钱”的活，试试把定金这件事明确成规则。** 它解决的不只是现金流，还有你被随意取消的风险。


    # ### 就算记账，我也踩过一个坑：把精力花错了地方


    记账之后我确实看清了钱去哪，但有段时间我走向了另一个极端——**为了省成本，我在比价上花了太多力气。** 找便宜的房子、对比机票、连一个小东西都要反复挑选比对。结果呢？省下来的可能是几十块、一两百块，但我整个人被耗得很累，**精力全都花在了这些不重要的事情上。**
    真正的代价是：等到需要认真做决定的大机会出现时——比如要不要接一个大客户、要不要投一笔钱学新东西——我反而精力不足，判断力下降。


    **后来我才明白这个坑的本质：省钱这件事，**'
