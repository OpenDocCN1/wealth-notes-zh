    # 经过几年失速带来的阵痛，改革转型取得了第一份阶段性成果


    261020 大树乡谈

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/064d01b0cf1ab8661c9910da6832e1d5_0_0.png)


    小懒判断 | 适合被 G2 论调刷屏又看不懂高层话术变化的宏观观察者；不适合想找具体投资建议的人。最值得关注的是广交会演讲的三连致厉——从 3 月泛泛表态到
    10 月直接挑破贸易保护主义荒谬，半年内对外叙事由守转攻的信号很清晰；坑在于文中判断"暂不推出新增量政策"，别把它当成一定不出刺激的依据。


    过去我们常说"改革开放"，似乎改革对内、开放对外，但未来的改革绝不止步于此，改革也可以对外，开放同样可以对内。以中国目前毫无争议的 TOP2 级别的国力和影响力，我们需要适应中国与世界的新关系。


    当然，我们要坚决反对美国所谓"G2"叙事，这本质是希望拉着中国当小弟继续鱼肉全球，这种剥削模式有利于美国、有利于资本，但根本违背了中国和中国人民的利益。中国要想让十几亿国民过上发达国家的美好生活，必须盘活全球生产力和消费力，必须打破西方式的剥削体系，这是中美发展道路的根本矛盾。


    但客观上，我们要敢于承认我们就是有'
  - '[PAGE 1]


    "G2"级别的国力与影响力，一个典型证明是近年来 G20 峰会出现的新变化。


    G20 有一个"19+1"的特定名词，指 19 国支持某一立场，而 1 国单独支持另一立场，于是无法达成一致，需要分开进行表述或者争议部分干脆不写入联合宣言。


    此前这个特殊的"1"是美国的特权，比如在贸易保护主义和应对气候变化上，美国长期唱反调；而在今年 G20 峰会上，中国变成了新的"1"，公开反对"非市场经济体来源不断输出廉价出口是不可持续的"这一表述，反对美国发起的关于中国导致全球贸易失衡的指责。


    中国的反对不是全盘否定，也不是主张永远低价出口，而是反对把廉价和非市场经济体绑定、反对被外人单方面定义，中国要靠自身发展解决问题，不接受外部压力的倒逼。中国的强硬，也导致美欧对华态度发生了很有意思的转变，曾经怀柔的欧洲变硬了，强硬的美国变软了，出现了利益的缝隙，这一转变，也给中国调整对美欧政策带来了新机遇。


    在这一国际背景下，上周出现了几大具有标志性的政策方向性转变，以至于小镇觉得可以视为中国发展范式转型的第一份阶段性成果。


    第一件事：国家最高层对外表态从防御转向进攻，更凸显中国与美国的不同，带来了新叙事和新政策方向。


    第二件事：伴随新政策方向，中国提高对'
  - '[PAGE 2]


    前沿技术的系统性保护，意味着中国在国际竞争和技术保护领域进入新阶段，也有利于提高对等威慑力，推动美欧对华高端技术产品出口放松管制。


    第三件事：国家最高层对中国未来信心变得更足，这也体现在消费和 GDP 数据的超预期回升。


    其他还有一些信号，比如最被关注的金融领域，政策方向争论告一段落，货币政策利率锚点更换即将到来，当然这一变化早已被市场预期，近期也已经开始筹备锚点的更换。


    10 月 19 日潘行长在金融街论坛年会上发表主题演讲，公布了多项后续政策安排，核心有三：一是择机把央行公开市场主要操作品种的期限切换为隔夜，二是退出存贷款基准利率，推动贷款利率定价基准改革，三是设立应对非银机构大额赎回的流动性支持工具。


    这三大政策合在一起，本质就是要缓解货币政策的不可能三角，寻求政策利率稳定、加大货币流动性投放、维持向上收益率曲线的最大平衡。


    不仅货币政策利率出现新动向，面对当前资本市场状况，新一轮国家队入场也大概率即将开始，这也符合小镇之前总结的国家队作为战略储备力量的新打法，也符合小镇之前判断的，3800
    点到 4000 点应该是国家能够认可的波动范围，长期低于 3800 点，就是国家队下场的重要参考点之一。'
  - '[PAGE 3]


    <!-- no content -->'
  - '[PAGE 4]


    而回顾此前类似表述，李总确实在不同场合多次公开表示"有信心有能力"，但通常跟着的不是全年经济社会发展目标任务，这就太具体、太明确了。一般来说多是表态性质的，比如"保持经济持续健康发展""保持中国经济较快增长""保持经济持续向好""把良好开局之势保持好、发展好"等比较含糊的表述。


    因此更能体会到微妙表述背后，决策层对当前经济和未来的态度，这对于我们研判未来增量政策很有帮助，道理很简单，对当下满意，当然没必要过度消耗宝贵政策弹药。


    二是对外观点表达更具进攻性，更以我为主，对比此前类似阐述，能体会到微妙的心境变化。


    注意开头说的今年 G20 峰会，中国在涉及中国出口、贸易不平衡问题上成了持独特立场的"1"，于是广交会就成了中国进一步阐述观点的主场外交。


    在广交会主旨演讲上，李总针对国际贸易和美国对中国的指责，从三个方向一一驳斥。


    强调市场联通不是国与国博弈工具，而是创造增量的有效举措；强调国际贸易不是账面数字，而是增进福祉的自主选择，不能认为顺差是占便宜、逆差就是吃亏，特别点到"顺差在中国，利益在各方"，这可以说是在敲打在华外资；强调互利共赢不是单向妥协，而是相互赋能的彼此成就，这一点需要跟中国加强前沿技术管控、催'
  - '[PAGE 5]


    促美欧放松技术产品出口管控关联起来，当然更根本的还是我们自己的突破，比如以高端科研仪器研制为代表的关键核心技术攻关。


    在此基础上，李总谈了中国对国际社会的三方面未来贡献，包括分享更多市场机遇、拓展更多互利合作、坚定维护国际经贸秩序。


    高层讲话，特别需要关注细节，这就有点像每年事关"三农"的一号文件，乍一看似乎没啥变化，怀疑每年新出一份的必要性，但拉长到 5 年，就能看到非常明显的质变。而在变动加速的当下，决策层对外态度的转变就更快了，已经缩短到几个月。


    我们可以对比下上半年两次公开表态，也就是 3 月中国发展高层论坛和 6 月夏季达沃斯的主旨演讲，这是每年研究高层观点的重要场合。在关于中国与世界经贸关系，解释中国越来越高的出口和顺差，也就是贸易失衡问题上，中国过去更多是防御，尽可能辩解，态度也更加温和。


    比如 3 月针对市场和贸易问题，也说了三点，但更加简单含蓄甚至是温和。强调市场虽然稀缺但可以不断创造，强调发展伴随竞争但良性竞合可以带来红利共赢，强调前方道路充满挑战但美好未来更加可期。这次表态只是态度性的，缺乏足够多的具体的驳斥。


    到了 6 月，应对美西方不断炒作贸易失衡，李总的驳斥变得更加具体，不再是 3 月的泛泛而谈，而是强调创新对中国经济和贸'
  - '[PAGE 6]


    易出口带来的贡献，提出创新驱动和创新合作两大主张，认为创新不仅是中国经济长期向好、行稳致远的关键密码，更强调创新合作才能摆脱全球增长困境。


    从三月到六月，变化已经很明显了，但十月广交会的表态彻底换了叙事格局，把一些大家早就清楚的客观事实直接摆在桌面上。


    比如挑破了美国贸易保护主义的荒谬，直接说保护主义最终会导致"（一国）在新的全球市场网络中失去位置，最终是得不偿失"，这就是明确敲打美欧了。


    还直接点破中国的顺差很大一部分是在华外资企业拿走的，强调中国进出口包括所谓廉价工业产品对全世界的贡献。


    这两句话很重要："无数勤劳的中国劳动者用汗水智慧铸就的高性价比商品，大幅提升了全球消费者的实际购买力，提高了各国民众生活质量，增强了相关国家的产业发展能力""很多国家的农产品、工业品、消费品源源不断销往中国，转化为当地企业利润、居民工资和政府税收。"这些话但凡有基本理性的人都应该清楚，但清楚和公开表达是不一样的，有些话不直接摆在台面上，很多人就是会装糊涂。虽然中国目前国内、国际传播做的很不好，但作为全球最被关注的国家之一，中国决策层的公开表达，一定会被全世界关注，这就确保能够持续发出中国的声音。


    # 二、从解释到塑造规则'
  - '[PAGE 7]


    基于上述两点的变化，就观察到了新的政策动向，也就是基于市场联通、互利共赢、相互赋能的表态，中国从解释自己为什么这么强，转变为要主动为全世界提供确定性，意味着中国从防守转向主动塑造规则、提供全球公共产品的进取型布局。


    说得更直白点，经过上半年的反复回应和解释，中国发现有些国家是真听不懂人话，至少是装听不懂，那就没必要白费口舌了，改为推动建立更符合中国利益的国际贸易框架，要从全球市场的参与者转变为架构者。


    在产业角度，就是支持外贸企业从过去拿订单、卖产品，向建立体系、优化服务转型。这也是本届广交会的一大特点，越来越多的企业通过"制造+服务"链式出海，通过技术、绿色、数字等综合能力参与国际竞争，而非单纯依靠价格内卷。


    而之所以提出如此强烈的转型信号，也因为客观经济数据改善带来的支持。刚刚公布的三季度 GDP 数据，三季度同比增长 4.5%，比二季度回升 0.2 个百分点，前三季度累计同比增长
    4.6%，已经实现了止跌。


    而从社零数据上看，9 月社零同比增长 1.1%，超市场机构普遍预期的 0.6%，如果把正在进行激烈竞争的汽车销售剔除，那么社零同比增速扩大到 1.4 个百分点；而餐饮某种程度上可以作为中国服务消费和民生消费的窗口，在
    9 月也出现了比较显著的修复，同比增速达 2.1%，比八月扩大 1 个百分点。'
  - '[PAGE 8]


    上述两个数据意味着经济总体增长向好，居民手里头的钱也更多了，内需在得到改善。虽然目前的数据修复还不能完全得出经济正在复苏的结论，但终究是向好的变化，而且是在国家并没有加大刺激的情况下的自然修复，这意味着底层正在得到改善，这可能跟此前强化债、消化欠债问题有关。


    这也是国家考虑暂不推出新增量政策的原因之一。而另一个有利因素是美欧对华封锁圈已经出现巨大的利益裂痕，这也是中国有底气的重要外部条件。


    表象就是前面提到的美欧对华态度的转变。


    现在欧洲反而强硬了，前不久欧洲代表访华，提出的条件苛刻到就像战败条款，而10月7日欧洲议会也高票通过强硬报告，把中国重新定义为“制度性对手”，甚至鼓动欧盟在台海保持海军存在，声称中国“只听得懂实力的语言”；在产业上，要求中国自愿把混动汽车在欧洲市场份额限制在
    15% 左右，而目前占比是三分之一；当前欧盟还在试图推进紧急切断机制，也就是必要时刻，一键切断中国进入欧盟市场的资格。


    不过也不必太在意欧洲议会。目前欧盟实际权力向欧盟委员会集中，主要体现在贸易和外交决策机制的改革以及行政职能的整合上。


    欧盟态度强硬也可以理解，毕竟欧盟是目前罕见的同时承受中美俄三国联合压力的经济体。'
  - '[PAGE 9]


    <!-- no content -->'
  - '[PAGE 10]


    对华怀柔。


    美欧对华态度转变，让我们更好的看透了美欧的底牌和分歧，认清了无论美欧态度再怎么变，只要中国的产业链具备显著优势，美欧最终都得回到谈判桌上，务实的解决问题。


    这就是底气，而且当今世界真正的贸易失衡问题，是美欧占比太高了，我们也需要提前应对发达经济体衰退的风险，把更多期待寄托在全球"南方国家"身上。


    于是就有了开头提到的加强前沿科技管控、推动美欧放松科技产品出口管控。


    原因在于，中国贸易模式必须从货物出海转向链式出海与体系构建，从传统欧美转向全球南方与新兴市场，从规模扩张转向新质生产力赋能，从商品要素流动转向规则标准对接的制度型开放，这是中长期的结构性改革和战略布局。


    在这种情况下，我们必须警惕技术主权安全，不能让中国辛辛苦苦研究出来的前沿技术，极为低廉的被外国拿走，尤其要警惕在激烈竞争中，那些落败的企业会出售关键技术，换取西方资本和市场的扶持。


    所以，这次商务科技两部门拟修订《禁止出口限制出口技术目录》，较此前修订出现了颠覆性变化，从传统物项控制，升级为物项、技术、数据、主体的全链条管制，政策重心正式延伸到供应链安全和科技安全。


    技术主权，也是未来新叙事之一。'
  - '[PAGE 11]


    <!-- no content -->'
  - '[PAGE 12]


    地缘博弈上，已经很明确的由防转攻，比如通过技术出口管制的系统化，建立对等威慑，现在列入了人工智能、生物制药、光伏三个领域，但这只是开始，未来一定会扩大。


    总之，新的范式，是以我为主、底线思维、主动塑局，以确定性对冲外部动荡，以技术管制对冲欧美制裁和封锁，以链式出海对冲必然到来的发达经济体市场萎缩。


    小镇说上述标志中国发展范式转变的第一份阶段性成果，就在于高层表态，向内外传递了很清晰的信号，那就是中国经济的运行逻辑、外贸增长路径博弈攻防姿态等等都已经发生了变革，而且已经度过了最艰难的磨合期。


    这也意味着，中国经济和对外战略首次完整走完了从阵痛到换挡再到验证的闭环周期。目前很多问题当然没有解决，但已经证明了新范式能够走通，是经历几年旧动能失速阵痛后，把局部胜利逐步拓展到各个领域，最终形成的一套新的宏观管理系统。


    这就像中国实现了新能源汽车产业的突破，那么把这一成功经验复刻到其他产业，也是很自然的事情。


