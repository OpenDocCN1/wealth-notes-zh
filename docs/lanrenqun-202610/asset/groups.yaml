  - '[PAGE 12]


    标签，平台也知道把内容推荐给什么用户，后面流量慢慢就上来了。


    # TG 社群，我觉得做 X 最后好同步把 TG 群一并做好


    目前「东逆海外基建交流群」有 3,900 多人，另一个拉新的□毛群有 1,200 多人。两个群可能有重合成员。


    ![](img/ba3fedc17e08378b605776cdb48ef9fb_12_0.png)


    这也是我愿意继续在 TG 里花时间指导的原因。X 上把人吸引过来以后，后面的操作还有很多问题要解决。


    粉丝可能看懂了，但不知道自己缺的那份材料该怎么准备；也可能已经注册，却漏了一步任务；还有人看到奖励迟迟没出现，不知道是时间没到，还是哪一步没满足条件。


    这些事情，会直接影响他能不能把邀请任务做完，也影响推荐奖励能不能发放。


    要把群里的指导做得有效，我觉得最值得抓的是这几个地方：


    先把参与条件放在前面。地区、身份、所需账户、资金占用和活动期限，先让大家对照。条件不合适，越早知道越省时间。


    按操作进度答疑。还没注册、正在审核、已经完成任务、正在等结算，是不同的问'
  - '[PAGE 13]


    题。问清楚卡在哪一步，再对应教程补充，比每次从头讲一遍有效。


    # 把反复出现的问题补回教程。


    同一个问题解释一次是答疑，整理好之后，后面的人可以直接看。群里不可能永远靠我一个人一对一重复讲。


    这些做法不用等几千人的群才开始。第一个跟着做的人在哪里卡住了，就已经是在告诉你，教程哪里还缺一块。


    我想通过 TG 放大的，正是这部分指导：让后面来的人，可以用上前面已经讲清楚的东西。


    有了实际奖励之后，下一步就是把已经讲清楚的内容整理好，让后面来的人更容易独立完成。否则每来一个人都从头教，自己很快就忙不过来了。


    粉丝数当然会影响有多少人看到你，但从“看到”到“完成”，还有很长一段可以做。


    # 8 月半个月近 1.5 万，9 月又做了 3 万多


    拉新的奖励也不全是直接给现金。有的会给股票，后面还有卖出、提现这些环节。


