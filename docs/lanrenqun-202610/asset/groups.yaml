    ![](img/99fc997c705869be0f6bd9e9965c8d04_20_1.png)


    [插图：Kimi 接管后实际维护案件的界面]


    我后来把这套做法整理成了一个“复杂事件接管 Prompt”，完整版本放在文末。


    资料重新管住以后，后面越来越多的人开始进入这件事：律师、物业、保险、不同层级的工作人员和投诉渠道。


    我开始把前面整理好的时间线、金额、证据和争议点真正拿去和这些人打交道。


    最先遇到的一个现实问题，是律师这条路并没有我原来想得那么容易走。


    ## 五、律师嫌六七万元的案子太小，我开始自己准备大量案件工作


    实际上，当时哪怕是有 KIMI K3 的辅助下，其实我已经对我这个案件抱着必须走诉讼走法院流程，而不是走提前和解，因为：


