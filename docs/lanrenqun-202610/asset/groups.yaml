    \n### 一、先算清：对方 17846 元的报价是怎么来的\n\n你的 68555 元是按《民法典》填平原则计算的全部修复+损失成本，对方的 17846\
    \ 元是按保险内部理赔规则计算的主材折旧残值，两者从计算体系上就完全不是一回事。对方的报价逻辑拆解下来刚好对应不到 3 成的比例：\n\n- 1. **只算主材，删除所有施工与配套成本**\n\
