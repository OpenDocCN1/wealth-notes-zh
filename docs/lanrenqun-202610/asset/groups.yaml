    也可以沿着店铺继续补充对标。关键词越接近你要的具体任务，后面留下来的商品越容易比较。商品进入库以后，我会把商品名称、价格、规格、店铺、采到的手机端标签和销量记录放在一起看。这样，再看到一个数字时，可以回到对应的商品和交付内容，而不必凭一张截图猜它卖的是什么。


    这一步还有个很实际的工作：核对商品形态。电子课件、纸质练习册可能都叫“学习资料”，采集时所在的分类也可能相同。先把实物、电子资料和软件权益分清，才能拿相近的东西作比较。


    # 二、我为什么会把“24小时加购”单独留下来


    累计销量大，说明商品曾经积累过销售；手机端的“24小时内 100+人加购”这类标签，提供的是采集当时较短时间内的购买意向线索。


    对选品来说，它的价值在于：一批商品里，可以先把出现过这种信号的对象挑出来细看，少做一轮毫无方向的翻找。


    但我不会看到加购就立刻决定做。加购还没有走到成交，标签也会变化。库里保留的是采到过的标签，需要和采集时间、后续销量一起读。


    有个反例很能说明问题：一条三年级语文开学第一课 PPT，历史上采到过“24小时内 100+人加购”，这次观察周的展示销量增量却是0。开学时被需要的东西，过了节点'
  - '[PAGE 4]


    还要重新判断。


    我会先把有这类标签的商品收进观察名单，再看后续销量有没有变化。一周后回头看，就能决定哪些值得继续拆，哪些可以先放一放。


    # 判断图 / 02


    # 一个加购标签，要接着看什么


    把历史信号，接到后续观察上。


    # 01 先看标签时间


    “24 小时内加购” 是采集当时的快照。它提供购买意向线索，不能当作订单。


    # 02 再看连续销量


    保存每天展示销量，检查持续增长、前后周变化，以及缺失和异常。


    # 03 回到实际需求


    季节是否过去？交付是否可靠？自己能在哪个细节上做得更好？


    反例：三年级语文开学第一课 PPT

    曾采到 “24 小时内 100+ 人加购”

    近 7 天展示销量观察增量： 0


    旧标签仍有研究价值，但需要看时效。

    这个反例提示继续检查季节与使用场景。


    历史加购信号需要与后续销量一起判断


    # 三、42 条是怎样筛出来的


    先看一个具体例子。考研英语大小作文模板，前一个七天展示销量增加 643，接下来七天增加 1,870，而且这七个日间隔都有增加。它值得进一步拆解：需求对应什'
