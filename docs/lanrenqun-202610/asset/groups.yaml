    # 朋友义利


    261010 第三只眼观

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/e83916661627bb1f0c5a6e536f5106f6_0_0.png)


    小懒判断｜喜欢拆解底层逻辑、做组织管理的人会看得很爽，作者用篆文讲"朋友义利"四字背后的势力模型，视角很野。不适合想找实用社交技巧的——这篇纯理论，零操作建议。最值得记的一个点：能力不是技术最棒，而是在势力变化中找到最优生态位，第一步是"找个人带"。坑在于：通篇是作者自建的五行八识体系，不是学术共识，当启发看可以，当真理抄就危险了。


    这回只讲中文的模型原理，自己联系实际吧。


    # 其一、什么是五行八识图？


    这是把道家和佛家融合在了一起，道家看物理，佛家看心理，合一起看就叫心物一元。


    ![](img/e83916661627bb1f0c5a6e536f5106f6_0_1.png)


    火——五行——物理


    心物一元之力


    八识——精神'
  - '[PAGE 1]


    一元就是合在一起看，物理侧一动心理侧就跟着动，反之也一样，如影随形、步调一致，鬼谷子叫“比目鱼”啰，两个“轨道”互相印证和判断。


    例如：一个人说话时候的眼神、手势、肢体等横向摆动，那心里肯定撒谎呢。因为他物理运动不正，与天地的上下交互力（「字）不相符，所以心理肯定是歪的。


    这就是一元观察，物理姿势上的发力方向，反映了心理发力方向，而人体物理又和天地物理有关，所以叫天人合一啰。同理：本篇要讲的朋友义利四个字也如此，一个人处于什么社交关系的物理位置，就会有着对应的心理特点。


    反过来什么样的心理诉求，也推动他走向什么社交关系位置。外部社交关系分：朋、党、友，剩下都当成 NPC 即可，道家主打一个简化。


    # 其二、中文是由《五行八识图》演化而来


    右边就是田字格了呀，左边的五行八识运力一动，就产生了各种运动形态，然后放到右边的格子里画出来。这就叫做——画象！


    ![](img/e83916661627bb1f0c5a6e536f5106f6_1_0.png)


    象，就是把万事万物的普遍运动规律给“抽'
  - '[PAGE 2]


    <!-- no content -->'
  - '[PAGE 3]


    ![](img/e83916661627bb1f0c5a6e536f5106f6_3_0.png)


    看到这根红线了吧？这就叫做——第一运力！大白话来说，只有红线运动了，其它的线条才能运动起来，红线如果不运动，那么所有线条集体趴窝。为啥？


    因为这是天地交力！上面是天力，比如阳光辐射呀、大气流行呀、宇宙引力呀啥的。下面是地力，比如地球吸收辐射呀，土壤吸收大气呀，地心吸收引力呀。咱就笨寻思呀，如果天地二力不交互，那会有地球的万物生态呀？也没有咱人类了。


    然后造字还有说法呢...


    ![](img/e83916661627bb1f0c5a6e536f5106f6_3_1.png)


    这俩龙卷风有啥不一样？弓力是螺旋的呀，可以翻看之前《天之道》“那篇，这里不再赘述了。看上图：龙卷风的一个小尾巴向'
  - '[PAGE 4]


    左下，一个小尾巴向右下。


    左下一一升（生）力。右下——死力。生好理解，死是没了的意思嘛？当然不是..因为“力”是不死的，不会变没有的，它只会转换形式！


    生力画作一笔——/。死力画作一笔——。中文每一笔都是力哟..放在我们生命上，生命死了就是“业力“转换成其它形式了。


    所以，你的意识和肉体会死，但你的业力不会！万般带不走，唯有业随身嘛。


    这些东西回头慢慢聊，打开新世界的大门了。


    那么好了，这股弓行的龙卷风呼啸呼啸旋转，会咋样呢？这股大势力，就会把周围小势力都给卷进来！


    其实这么说不严谨——应该说是因為大势力的裹挟，周围才产生了小势力。这时候就叫做——朋！


    所以朋友都是“被动”交往的。


    那么好了，大势力把周围小势力卷动出啥形态了？当然就是——乡！上文讲过中文原理了，每一笔/都是个生力。


    这些升力按照乡运行叫啥态？就叫做——并行态！为啥是三笔呢？因为单数为阴呀，阴就是趋于成形了的意思。


    这个“乡“卷入”弓“里的过程，就成形出社会、组织、企业等等啦呀。重点：不要一听见“并行”就以为关系很好.例如：竞就是'
  - '[PAGE 5]


    并行看谁跑得快，争就是大家伙如何分蛋糕，合起来叫竞争，谁和谁关系好呀？


    朋之间既亲密（被迫卷在一起）又各怀鬼胎（并行竞争）..把这个场景用一个词描述叫啥呀？就叫——同局！


    所以同局为朋，或者古人说的同门为朋.咋个各怀鬼胎呢？乡里面还有很多小箭头，箭头画两个就是阳，阳就是不断运动呢。


    ![](img/e83916661627bb1f0c5a6e536f5106f6_5_0.png)


    这些小箭头代表啥呀？当然是———利！利是单向的，义是双向的，这个后面再说。然后这些小箭头就被弓给吸进去了，这叫啥？利——益！


    啥叫益？就是多出来的，大势力单靠自己不行，必须要裹挟很多小势力进来。也就是说：先要聚拢——力。然后产生——利。


    所以叫”人力资源“嘛.啥叫能力？可不是技术活最棒，干活最能吃苦，那都属于牛马工具人..能力就是如何在势力变化中，找到最优的生态位！


    所以能力的第一步，就是能在势力变化中“找个人带”才行，或者叫会审时度势进入那股势力。图形中就好比啥呢？你还在小箭头混呢，有的人直接跟乡混了，势力肯定比你大呀！'
  - '[PAGE 6]


    这玩意跟你技术与吃苦可没啥必然关系..当然，可不是反对技术和吃苦耐劳呀，而是说仅凭这些不够，要想发展就要有综合能力。


    # 2、再看看“友”的模型呀！


    篆文如下：


    ![](img/e83916661627bb1f0c5a6e536f5106f6_6_0.png)


    有人就疑问了：这俩“又”字不也是“并行态”吗？这不和朋一样吗？错——这俩又属于——自力玄行！大白话就是自己在那转，不是被动裹挟而运动的。什么是又呢？这之前都讲过，这次再深入一些。看图：


    ![](img/e83916661627bb1f0c5a6e536f5106f6_6_1.png)


    这个“又”是从“十”演化来的。十是啥意思来着？就是——灌满！当然，还有的别的表达，但灌满是最贴切的，也是最方便理解的。


    所以十的最初写法：'
  - '[PAGE 7]


    ![](img/e83916661627bb1f0c5a6e536f5106f6_7_0.png)


    那个小黑点就表示灌满了，啥玩意灌满了？中文都是力，当然是玄力灌满了呀。然后呢？当灌足了力量，十就要运动了，就要开始旋转了。或者换个象形，水满就要溢出来流动了。这个运动就是——又！往哪运动呀？当然是下一个十呀！十进位就这么来的呀，10、20、30啥的。


    数学是啥？就是把物理之力给逻辑化了，属于形式逻辑范畴。回头应该敲一篇《一到十》的中文模型原理，这都是后话了。


    两个“又”一起自转，就是频率一样的重复着。这就是——夂！有的人疑问了，为啥能自转呢？而朋里面的“乡”和“小箭头”咋不自转呢？其实：在朋和友之间，还需要一个过程形式。就叫做——兑！这个模型很复杂，以后再解构它。


    所以组词朋党或党友，不能组词党朋或友党，那就不符合逻辑了，因为朋党是有个发展线路的！


    那么好了，中间环节起到啥作用呢？当然是——灌满意识形态啦！用大白话来说，就是弄一个“道“出来，然后把朋们都给引上道，然后人们就自发的向前走了，就表现出了自力自转。


    反之呢？如果没有中间环节的道路引领，'
