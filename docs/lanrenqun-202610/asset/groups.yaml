    > 小懒判断 | 适合想看懂缅北电诈背后权力逻辑、对地缘政治和家族政治感兴趣的人；不适合指望"缅北黑幕大揭秘"猎奇爽文的人——这篇文章讲的是佤邦权斗。最值得关注的一点：鲍军峰不是在佤邦被抓的，是在昆明高铁站被抓的，鲍有祥一颗子弹没费就除掉了儿子最大的对手。坑在于别把佤邦当成被打击对象——它是借中国反诈的刀，替太子鲍艾康扫清接班障碍。


    最近，央视播放了一部纪录片《缅北电诈覆灭纪实》，算是第一次全景式展现了中国打击电诈的巨大成就。


    在片中，很多人都注意到了这样一句话：


    佤邦，就是电诈主要策源地。


    要知道，以前中国媒体报道电诈，多集中在果敢和妙瓦底，对佤邦基本是不怎么提的。


    而这次，是中国官方第一次以"策源地"的定义，来定性佤邦。


    这背后的深意，就非常微妙了。


    那么，佤邦到底是个啥地方？它在电诈产业链中又扮演了什么角色？为什么佤邦没有像四大家族那样走向覆灭呢？


    这就是今天这篇文章要告诉大家的。


    ## 1


    在之前的会员文章《缅北尘烟》中，我们介绍过佤邦的前世，今天我们来说说佤邦的今生。


    佤邦前身是缅共中部军区，六七十年代背靠云南，长期与缅甸军政府做武装斗争。


    但在1989年，东北军区副司令鲍有祥联合北佤县长赵尼来发动4·17兵变，脱离缅共，组建佤邦联合党、佤邦联合军，自立为王。


    随后，佤邦与缅甸政府和谈，承认缅甸中央政府领导，换取了掸邦第二特区的编制，享受高度自治。


    随后缅共其他几个军区也有样学样，果敢成了一特区，小勐拉成了四特区、101军区成了克钦邦三特区。


    自治有自治的好处，可以当土皇帝，但也有坏处，要自己养活自己。


    缅甸军政府只给了佤邦1500人的边防警察编制，但佤邦为了避免被缅甸军政府吞并（事实上，一特区和三特区后来的确被吞并了），维持了庞大的佤联军编制。


    佤联军有3.5万人，再加上武装民兵，武装力量高达10万人，是缅甸最强大的民地武力量。


    可是佤邦控制区总人口，也才60万人，5个人养一个兵，这不就是穷兵黩武么？


    建邦之初，鲍有祥为了养兵，做出了一个决定：种罂粟。


    90年代初，佤邦首府邦康的大街上，到处是骑着摩托车、后座上捆着几大包鸦片的押运员，出货量占到了东南亚地区的三分之一以上。


    靠着源源不断的贩毒资金，佤邦招兵买马，从一穷二白硬生生建起了一个军阀政权。


    最辉煌的时候，鲍有祥照片登上了美国《时代周刊》封面，美国人称他为"毒品王国的君主"，佤邦联合军是"全世界最大最危险的贩毒武装"。


    可能是因为同行是冤家，鲍有祥很快和另一个贩毒军阀坤沙产生了矛盾。


    坤沙有两万多名装备精良的"掸邦蒙泰军"，牢牢霸占着金三角最肥沃的土地，但鲍有祥种毒品之后，抢走了不少原本属于坤沙的生意。


    1989年，坤沙部队突袭佤邦4045部队，抢走了大量毒品，鲍有祥大怒，马上联系正愁拿坤沙没办法的缅甸军政府：


    只要把坤沙的地盘给我们，我们出兵帮你打坤沙！


    1990年，佤邦启动"901飞行计划"，跨越数百公里，长途奔袭坤沙在泰缅边境的大本营。


    此后，就是长达6年的血腥丛林战争，最终在1996年，终于把坤沙打得缴械投降，佤联军顺势接收坤沙在泰缅边境的地盘，成立"南佤"和"171军区"。


    至此，佤邦地盘翻番，一跃为缅甸最大、最强的民地武。


    为了稳固自己在南佤的统治，鲍有祥下达了命令，把北部山区的10万佤族平民，强行迁移到南佤。


    虽然路上死了很多人，但的的确确改变了南佤地区的人口结构，佤邦在南佤的统治总算是稳固了。


    外部稳定了，就轮到内部了。


    佤邦最开始的时候，是"赵鲍共治"。


    赵尼来是佤邦联合党总书记，主持党务和政工。


    鲍有祥是政府主席兼佤联军总司令，负责管政务和军队。


    两人之间还夹着另一股力量：以李自如、肖明亮为代表的汉族知青群体。


    李自如在缅共时期是中部军区参谋长，建邦后出任佤邦副主席兼财政部长，肖明亮主抓意识形态和行政管理。


    这帮知青是佤邦运行的关键因素，然而1995年，赵尼来突发脑溢血中风，失去了行动和言语能力，只能常年卧床休养（2009年去世）。


    赵尼来一倒，赵家在佤邦的影响力急速萎缩，儿子赵岩道等人虽然挂着政协主席等头衔，但已经没什么实权了。


    紧接着，2005年，能够平衡各方利益的副主席李自如因病在邦康去世。


    趁此机会，鲍有祥迅速扶持自己的三位兄弟上位构建起了坚不可摧的"鲍家王朝"。


    老大鲍有华，中央警卫团团长，后任司法部长。


    老三鲍有良，佤邦副主席、财政部长。


    老四鲍有宇，171军区（南佤）政委兼副书记，相当于鲍家派到南佤的总督。


    鲍有祥自己则稳坐联合党总书记、政府主席、总司令的宝座，成了无可争议的"佤邦王"。


    在老一代将领中，除了副总司令赵忠丹、对外关系部部长赵国安等少数老臣保留了部分权力外，全邦最有油水的部门，清一色换上了鲍姓人马。


    佤邦能保持30多年的稳定，既没有分崩离析，也没有被缅甸政府占领，这在混乱的缅北，已经是个异数了。


    一方面是鲍家本来就是土司正统，佤族又是主体民族，没什么民族矛盾，佤邦联合党这个代表佤族精英的党派又团结住了社会大部分人。


    另一方面是佤族民风强悍，佤邦军力强横，不仅拥有不知道从哪弄来的重炮和装甲车，甚至连防空导弹和飞机都有，缅军也不敢贸然进犯佤邦。


    后来鲍家一度被迫放弃鸦片，为了填补财政亏空，搞境外赌场、橡胶产业、特色旅游，都杯水车薪，当时邦康机关里甚至连电费都快交不起了，部队连津贴发不出，队伍眼看就要散架。


    但老天很关照鲍有祥，给他送来了两个新财源。


    第一个来自魏学刚。


    魏学刚祖籍云南，是国民党残军后裔，他原本是坤沙手下的财务总管，精通走私、洗钱和企业管理。


    坤沙走下坡路的时候，魏学刚没有跟他一起向政府军投降，而是带着自己的人马投奔了鲍有祥。他成立了一个名叫"宏邦集团"的公司，表面上修路、建桥、搞珠宝生意，暗地里，却是在生产毒品。


    怪了，鲍有祥不是禁毒了吗？魏学刚怎么还在生产毒品？


    鲍有祥禁毒不假，但他禁的是种罂粟和鸦片。


    而魏学刚，他搞的是化学合成毒品——麻古。


    他从泰国走私化学品，然后在南佤完成合成，压成药片，然后再通过泰缅边境的小道走私到曼谷，乃至运往欧美。


    于是，源源不断的金钱滚滚而来，其中30%的钱都上缴了佤邦中央，解了佤邦燃眉之急。


    第二个来自曼相锡矿。


    就在北佤快要揭不开锅的时候，一个深山小村子突然发现了一座聚宝盆——曼相锡矿。


    曼相的锡矿品位非常高，几乎不用复杂的选矿设备，挖出来就能直接卖。


    更巧的是，那几年正是全球智能手机和平板大爆发的时代，锡作为焊锡材料的核心原料，价格暴涨。


    有了曼相锡矿，佤邦再也不愁财源了。


    如此重要的矿产，当然要交给自家人。


    于是，鲍有祥安排弟弟鲍有良成立了"佤邦财政部矿业管理局"，把整个曼相矿区牢牢控制在鲍家手里。


    鲍有良定下规矩：不管你是哪路矿老板，想进曼相开矿，必须先交纳"入场费"，开采出来的锡精矿，佤邦财政部直接按比例抽成，最高时抽成高达30%。


    那几年，来自中国各地的矿老板带着现金直奔邦康，为了抢到一个好矿洞，在鲍有良的办公室门口排队送礼。


    鲍有良不仅控制了矿山，还把持着矿石运输出境的关卡。


    所有的锡矿石必须经过指定公司运输，每吨还要交高昂的资源税、出境税。


    短短几年时间，鲍有良手里的财富膨胀到了令人瞠目结舌的地步，自己女儿出嫁，光陪嫁就陪了3000万，还不算缅甸航空的股权。


    在矿山暴利的滋养下，曼相变成了一个畸形的暴富之城。


    山头上是成千上万穷苦劳工挥舞锤头，而山脚下的平房里夜夜笙歌，矿老板和当地军官纸醉金迷，一晚上就能消费几十万。


    但2010年代后期，佤邦情况又变得岌岌可危了起来。


    一方面是魏学刚被美国缉毒局盯上，列为世界十二大毒枭之一，悬赏200万美元通缉，泰国特种部队还曾偷偷越境企图抓捕魏学刚。


    虽然没抓到，但像之前那样明目张胆地制毒贩毒已经不行了，毒品收入锐减。


    剩下这点钱，维持南佤的军力（南佤和泰国有领土纠纷，所以佤联军在南佤有重兵）已经很勉强了，哪还有钱上交佤邦中央？


    另一方面是由于常年野蛮开采，曼相浅层的富矿几乎被掏空，矿难频发，采掘成本直线上升。


    再加上后来疫情爆发，交通受阻，矿石运不出去，设备运不进来，锡矿收入也大幅降低。


    更严重的是，鲍有祥因佤族生吃猪肉的饮食习惯，感染猪囊尾蚴，囊虫侵入大脑，虽然在云南做了手术保住了命，但时而清醒时而糊涂，近些年已经深居简出，不太过问政事了。


    老王病危，钱袋子干瘪，各大主力旅的少壮派军官嗷嗷待哺。


    这时候，就轮到佤邦第二代登场了。


    ## 2


    发展到现在，整个佤邦已经形成了几大独立的山头。


    ### 第一个山头：太子党


    鲍有祥的前妻给鲍有祥一口气生了8个女儿，可在鲍有祥看来，女儿怎么继承家业？非要儿子不可！


    所以鲍有祥只能再娶，最后喜迎两个儿子，鲍艾康（也叫鲍岩康）和鲍尼搞。


    毫无疑问，鲍艾康作为嫡长子，肯定要继承大位的。


    在佤邦最新的人事任命中，鲍艾康被火箭提拔为佤邦联合党中央政治局常委、政府副主席兼军委副总司令。


    这一连串的头衔，意味着他在党、政、军三条线上全拿到了接班的合法性。


    鲍有祥甚至让鲍艾康直接掌管了中央警卫部队和邦康的城防重炮营，相当于把禁军都交给他了。


    但问题在于，鲍艾康是1991年生，现在才30多岁，履历太单薄了。


    他没参加过缅共斗争，也没跟坤沙血拼过，大部分时间都生活在稳定的中国，虽然受到了良好的教育，行事风格相对沉稳克制，但总是缺少一种能镇得住人的霸气。


    对了，鲍艾康有个抖音号"艾弗森"，大家有兴趣可以去看看。


    为了给儿子保驾护航，鲍有祥又把自己另一个儿子鲍尼搞放到了318旅当营长，还派出新晋的中央候补委员鲍岩尚当旅政委来辅佐他，替鲍艾康盯紧枪杆子。


    兄弟俩互为犄角，确保鲍氏直系血脉不被外围势力架空。但，实际的情况却不像他们想的那么简单。


    ### 第二个山头：王爷党


    在邦康，除了鲍有祥，唯一能让各路旅长不敢造次的人，只有他的弟弟——鲍有良。


    鲍有良担任佤邦副主席兼财政部部长几十年，全邦的财税体系几乎全是他一手造就的。


    当然，他自己也捞了不少，名下的"宝良公司"垄断了佤邦所有的汽油、柴油批发、烟酒专卖，以及边境各大口岸的关税征收。


    更重要的是，整个曼相锡矿的矿业管理大权，长年直接向他一个人汇报。


    过去几十年，各个主力旅每个月能领到多少钱，全要靠鲍有良批条子。


    所以鲍有良虽然不掌握军队，但在军队中的威望一点也不低。


    很多基层军官私下直言："鲍总定方向，良总给饭吃。"面对鲍有祥扶持鲍艾康上位的举动，鲍有良的态度非常微妙。


    按辈分，鲍有良是鲍艾康的亲二叔，但按利益，鲍有良背后，也有一整套盘根错节的利益关系网。


    王爷党心里很清楚，鲍艾康一旦全面接权，第一件事必然是查账，把家族旁支垄断的特权收归中央。


    这就导致太子党与王爷党之间，表面上叔侄情深，背地里却一直在明争暗斗。


    可能是因为野心，也可能是为了自保，鲍有良开始大力扶持自己的儿子——鲍军峰，参与夺嫡斗争。


    鲍军峰大学毕业后进入佤邦主力318旅服役，并在短短几年内当上了318旅的旅长。


    说起来，318旅可比鲍艾康的468旅厉害多了，拥有佤邦最完整的炮兵和装甲兵，兵力达到万人，而且扼守战略咽喉勐冒县，居高临下，距离首府邦康只有几十公里，急行军几小时就能兵临城下。


    后来，他和鲍艾康一起进入了佤邦联合党政治局，兼佤联军副总司令和财政部常务副部长。


    此外，在鲍军峰身后，还站着一批像原副总司令赵忠丹这样的军队元老。


    赵忠丹是跟着老哥几个从枪林弹雨里杀出来的，德高望重，手里门生故吏遍布全邦各个部队。


    这帮老头子既不想看到鲍家一家独大，也瞧不上温室里长大的二代少爷，他们更希望维持一种由老将们共同辅政、利益均沾的集体政治格局。


    按理说，顶着这么硬的背景，鲍军峰只需要坐等鲍有祥去世，然后振臂一呼就行了。但他偏偏没能抗拒金钱的诱惑。


    2019年8月18日，柬埔寨首相洪森宣布全面禁止网络赌博，不再续期或发放新牌照。


    这样一来，盘踞在西哈努克港（西港）的博彩相关生意彻底做不下去了，30万人逃离柬埔寨。


    这些人，大部分都去了缅北，一拨在果敢，一拨在木姐，一拨在小勐拉，一拨在佤邦。


    有人说，鲍有祥一开始是反对搞电诈的，但不反对搞网赌。


    这里就要说到关于电诈的定性问题了。


    在缅北很多地方（包括金三角），电诈是诈骗，是非法的，但网赌只是赌博，只要有博彩牌照就是合法的。


    鲍有祥虽然反对搞电诈，但对搞网络赌博是允许的，鲍军峰开了一家所谓的"荷官公司"，挂着网络赌博的招牌，实际干的是武装护诈。


    在佤邦，盘总和金主最怕两件事：一是怕同行黑吃黑，二是怕园区里的"狗推"暴动逃跑。


    鲍军峰看准了这个痛点，直接把手下的部队租给各个特大电诈园区站岗、押运资金，甚至直接动用军用车辆为涉诈团伙运送设备和人员。


    在勐波和邦康周边，只要你按月给鲍军峰交保护费，你的园区就等于挂了一面免死金牌，里面打死了人，连警察都不敢查。


    就这样，靠着电诈集团源源不断的资金，鲍军峰不仅在昆明购置了豪宅，还在昆明娶了老婆，在昆明过上了美滋滋的生活。但他没想到的是，昆明，成了他最终落网的地方。


    ### 第三个山头：外姓党


    也就是这次被中国通缉的鲍岩板和何春田。


    鲍岩板，佤名岩板，中国户籍名陈岩板。


    鲍岩板11岁就在缅共警卫排里放马，17岁就给鲍有祥当贴身警卫和专职司机，深得鲍氏家族的溺爱，也因此被鲍家四兄弟共同收为义子。


    他在南迁战役中给171军区运过炮弹，在地方上当过勐冒县龙潭区区长，后来直接升任佤联军2518独立团团长。


    2005年，大毒枭韩永万（电影中毒枭"八面佛"的原型之一）在缅甸大其力走私海洛因，就是找鲍岩板动用佤联军的军车押运。


    结果消息被中国警方得知，联系缅甸警方联合行动，当场查获运毒军车，缴了380多公斤海洛因和整车的武器弹药。


    鲍岩板被抓进缅甸景栋监狱，最后还是鲍有祥亲自出面，花了大价钱把他赎了回来。


    但奇怪的是，事后鲍岩板不但没失势，反而一路飙升，先当上468旅旅长（鲍艾康前任），驻防勐波县，创立了垄断勐平、勐波等地的"金华公司"，然后又涉足房产、矿山、橡胶，最后直接杀进佤邦联合党中央政治局，当上了佤邦建设部部长。


    而他最大的同盟，就是何春田。


    何春田，中国户籍名肖岩块，是鲍有祥的大女婿。


    何春田早年在佤邦警察和司法系统根深蒂固，后来外放到勐能县担任县长。


    勐能本来是佤邦北部最闭塞的山区，穷得叮当响，何春田到了勐能之后，琢磨了半天生财之道，最后决定和鲍岩板一起搞电诈。


    由鲍岩板在建设部大笔一挥，批准土地开发规划，何春田在勐能县城圈出大片荒地，由鲍岩板的"金华公司"垫资盖楼，大楼建好后，拉上高压电网和光纤，租给中国诈骗团伙。


    为了让诈骗老板安心，何春田还用勐能县政府的名义给园区发放"特许营业执照"。


    高峰时期，光是在鲍岩板管辖的勐波县，就有涉诈窝点265个，里面关了将近6万人，何春田的勐能县更是漫山遍野都是铁皮园区。


    由此，鲍岩板和何春田积累了大量财富，钱多到了什么程度？这么说吧，鲍岩板何春田资产，一度比鲍有良还要多了，于是也就有了央视纪录片中"屋顶晒钱"的荒唐事。


    对这两个外姓人来说，他们知道自己接班是没戏的，但他们也不愿意让鲍艾康接班，相比之下，"电诈同行"鲍军峰更值得支持。


    ### 第四个山头：南佤派


    说个冷知识，虽然南佤是佤邦的一部分，但是并不接壤，从北佤到南佤，要经过缅甸政府军控制区，这里面藏着缅甸政府分而治之的小心思。


    虽然佤邦近些年一直想南下打通南北佤通道，但因为种种原因，始终没有下定决心。


    这也就导致了南佤的地位非常超然。论面积，南佤有1.3万平方公里，人口30万，几乎占到了北佤一半。


    论军事，南佤171军区下辖五个主力旅，总兵力超过万人。这些士兵常年在泰缅热带边境丛林里摸爬滚打，装备精良，要论战斗力是强于北佤部队的。


    在经济上，南佤用的是泰铢，说的是泰语，吃用的全从泰国清莱运过来，他们对几百公里外的邦康没有太多认同感。


    所以，南佤其实处于一种半独立状态。


    在这里掌大权的，是魏学刚、魏学云、魏学龙、魏学贤兄弟，他们挂着佤联军的番号，重大节日给邦康发贺电，但邦康绝不能往南佤派任何一个高级军官，除了每年向北佤交一部分钱之外，北佤不许查南佤的账。


    如果军饷发不出来，枪口就会调转。所以，鲍有祥明知后果很严重，还是默许搞电诈。


    他更大的心病，还是儿子的接班问题。


    亲儿子鲍艾康是嫡长子没错，但他在军方没有基础。


    可论兵权、背景、军队威望，鲍军峰在二代里几乎一骑绝尘。只要鲍有祥一咽气，鲍军峰振臂一呼，318旅的装甲车开进邦康，鲍艾康根本招架不住。


    鲍艾康的结局，要么被堂兄弟和姐夫当成傀儡摆在台面上，要么在某次突发的"兵变"中人间蒸发。


    可问题在于，鲍有祥能动鲍军峰吗？


    动鲍军峰，鲍有良手里的财政部立马会造反，鲍岩板和何春田的民兵武装也可能会当场兵变，而南佤的魏家，恐怕就会趁乱脱离佤邦的掌控。


    鲍有祥身体已经垮了，他已经经不起一场同室操戈了。


    老头子非常清楚，这帮年轻人越是狂妄，捞得越狠，案卷上堆积的罪证就越扎实，所以他故意采取了放任和纵容态度。然后，鲍军峰就被抓了。


    注意，鲍军峰不是在佤邦被抓的，而是回自己在昆明家的时候，在高铁站被抓的。


    鲍军峰被抓的消息传回邦康，鲍有良的派系全被打懵了。


    鲍有祥连一颗子弹都没费，儿子最大的对手就被干掉了。


    昆明抓人仅仅十几天后，中国公安部正式对鲍岩板、何春田发布通缉令。


    佤邦这次的动作很快，一点也不拖拉，通缉令刚公布不到三天，佤邦就连夜发了一份红头公文，连最基本的调查程序都省了，直接宣布：


    鲍岩板撤销建设部部长职务，开除党籍、军籍；何春田撤销勐能县县长职务，开除出党，剥夺一切公职。


    ### 通报


    全邦各部门、部队、县、特区：


    近期中国公安对我邦建设部部长鲍岩板、勐能县县长何春田下发了通缉令，两人身为佤邦高级干部触犯中国相关法律法规，此事件给我邦在国际和周边地区造成了巨大的负面影响，也间接影响了佤邦与邻国的政治互信及友好往来。


    为维护邻邦政府声誉，维护与邻国的友好关系，经佤邦联合党中央政治局常务委员会研究决定：


    - 一、给予鲍岩板，撤销佤邦联合党政治局委员职务，开除党籍、军籍，撤销佤邦建设部部长职务的处分。

    - 二、给予何春田，撤销勐能县县长职务的处分。


    看起来雷厉风行，但问题在于，这俩人移交给中国了么？并没有，他俩"畏罪潜逃"了。


    这就形成了一个很微妙的反差。


    鲍军峰，被中方抓了，但佤邦并没有开除其党籍和军籍。


    而鲍岩板和何春田，开除党籍和公职，但就是不交人，一直处于"在逃状态"。


    仅此一事，就能看出鲍有祥的老谋深算。


    如果开除鲍军峰，那就相当于承认佤联军副总司令涉及跨国犯罪，那佤联军自然就成了"武装涉黑团伙"，合法性就没了。


    而且，开除了鲍军峰，正在焦急万分的鲍有良怎么安抚？打狗还要看主人呢！


    所以，佤邦迟迟不宣布处理鲍军峰，很可能是对内说会请求放人，保住鲍有良的面子，但所有人都知道，鲍军峰回不来了。


    至于鲍岩板和何春田，他俩毕竟是外姓人，关键时候出来背锅，也没什么可惜的。


    只要把他们定性为"个别地方官员和部门头目的个人腐败与违规行为"，就可以演一出"大义灭亲"的戏码。


    更有意思的是，你猜佤邦对鲍岩板、何春田的逮捕令是谁签的？


    鲍艾康。


    在鲍军峰被捕之后，佤邦联合党迅速召开了一次扩大会议，鲍艾康被正式推举为佤邦联合党中央政治局常委、政府副主席兼军委副总司令。


    而鲍艾康分管的部门里面，就有李岩星的司法委，而李岩星的爸爸，就是前文提到的佤邦元老、佤联军副总司令李自如。

