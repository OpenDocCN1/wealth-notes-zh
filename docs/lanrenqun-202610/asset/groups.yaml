  - '[PAGE 3]


    的 X skill，但流量一直不怎么样。


    那时也不知自己适合什么，看到方向就学、就试。发出去没人看，也不知道问题究竟出在哪里。


    6 月的时候，我加入了生财圈友 B 哥的 X 答疑小群，在里面学到了不少 X 运营经验。前面主要靠自己摸索，答疑群里 B 哥给了我很多参考。说到自己后来做
    X 的经历，这里也得感谢一下 B 哥。


    后来好不容易有一个号做起来了，又被封了。


    前面没流量时，至少还有个目标；有起色之后被封，差点就放弃。


    经过一段时间调整后，又转去做过日区，把国内的视频搬过去。做了一段时间，还是没起色，最后又回到了中文区。


    现在回头看，前面一直在换地区、换内容。每换一次，就要重新摸索什么东西有人看。而回到中文区做海外 App 拉新之后，我终于有了可以持续写下去的东西。


    到了 8 月下半月，我开始做海外 App 拉新。那半个月收入接近 1.5 万，让我更愿意把精力放在这件事上。9 月接着做，一个月又有了 3 万多收入。


    所以标题里的一个半月，说的是这段做拉新的时间。前面从 3 月尝试、6 月进小群学习，到换方向、重新做账号，花的时间也都在这里面。只是到了 8 月下半月，前面学的运营经验，才开始和自己正在做的'
