    AI 博主赚钱，我感觉有点像以前的新能源汽车，那些博主接单都接到手软、接不过来。也有点像以前的软装硬件，那时候好像是去年还是前年，小红书大推软装，家居博主赛道还有好物分享赛道都是那个时候起来的。因为那时候想要拉动内需也好，促进消费也好，还是说想要在家里焕然一新也好，都是那一波新鲜的市场。


