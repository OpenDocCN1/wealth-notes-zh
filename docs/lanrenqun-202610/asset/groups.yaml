    余温 @gkxspace · 2026/9/17


    去年的今天，我懵逼的发了第一条推文


    今天，粉丝近 50k，直接、间接在推特赚了 50w+


    从大三到大四，下个月也要 21 岁了


    提前一年实现了自己大学定下的目标：毕业前年入百万


    这个过程，经历了很多个第一次：


    第一次一天赚 1000，第一次一天赚 1万，第一次一周赚 10 万，第一次单月赚 10 万，单月赚到 20 万......


    推特带给我的收益非常大！！！！！


    金钱上包括：老马的收益、商单、返佣、社群和咨询、以及推特给我带来的客户.....


    非金钱收益：好用的社交名片、结实很多一起做事的朋友、认识了很多遥不可及的大佬，全方面拉高了我的认知和圈子。


    毫不夸张地说：给我带来的价值，超过一个亿。


    我这一年最大的感受：很多结果，真的做出来的。


    +   1、如果你想靠自媒体赚钱，就要把它当成一件业务，去研究发什么、谁会看、别人为什么信后愿意为什么付钱。


    # 然后是养号


    新号不要一上来就狂发。你先像个正常人一样用几天。


    +   • 前两天：刷内容、点赞、回复、关注一批跟你同方向的人。让平台看到你是个活的、有交流的账号。'
  - '[PAGE 12]


    +   - 第三、四天：开始发第一条。不用长，一两句你的真实想法就行。

    +   - 一周之后：进入正常节奏。


    > > 记住一句话：推特是社交平台，不是公告栏。

    > > 你把它当公告栏，它就当你是个广告机器人。


    # 四、第三步：前期怎么运营


    前期就干三件事，都是"往外走"的动作。


    # a. 多互动


    去你关注的那些大 V 底下认真回复。


    注意，是 **认真回复**，不是"好文"、"学习了"、"感谢分享"。这种回复没人会点开看，平台也不会给你任何权重。


    什么叫认真回复？你看了他那条推，有你自己的补充、你自己的经验、你自己的反对意见，你写出来。'
  - '[PAGE 13]


    ![](img/2e4ea7ed22920b998d85449edcd3298b_13_0.png)


    我涨粉最快的一段时间，靠的就是这个动作。大 V 的一条推下面有几千人看，你一条有观点的回复，就等于在几千人面前露了一次脸。


    # b. 跟大 V 交流


    不只是点赞和回复，要有真正的交流。'
  - '[PAGE 14]


    看到对方发了有价值的东西，你私信或者评论里跟他聊两句，说清楚你是谁、你在做什么、他的哪句话对你有用。


    不要一上来就推销自己的东西。第一次交流，目标是让他记住有你这么个人。


    # c. 多转发


    看到好内容，转，而且转发的时候加上一句你自己的判断。'
