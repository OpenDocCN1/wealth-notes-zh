    另外记得定期复盘：当笔记发出去了以后，还要关注它有没有完成自己的任务。


    ## 总结下来


    总结下来，笔记部分我的工作流是：


    - 1. 明确笔记任务：商品成交 / 需求测试 / 搜索积累 / 涨粉信任

    - 2. 获取选题对标爆款句式 + 用户调研报告 + 长期需求

    - 3. 准备写作素材标题/母题 + 营销母文档 + 笔记结构

    - 4. AI 辅助批量创作生成子选题、初稿 → 人工检查修改 → 定稿

    - 5. 发布与搜索承接持续更新 + 围绕用户问题持续发布 + 场景与商品匹配

    - 6. 数据反馈与复用阅读/搜索 → 商品点击 → 成交 → 复用有效母题


    ## AI


    我从六月份开始就“折腾”codex，也用它搭建过一个工作台，具体可以参考 <u>半个月时间，0 技术背景的我，把变现 5 位数的虚拟电商流程用 codex+Obsidian
    做成了 AI 工作台</u>。


    折腾了一圈下来，我发现 AI 给我的帮助可以分成两类：一类是开发工具，把重复工作变成固定流程；另一类是直接参与日常经营，帮我完成资料制作、笔记写作和数据分析。相比之下，后者目前对我的业务帮助更加直接。


    结合 Skill，可以把已经跑通的资料制作流程沉淀成 Skill，后续迁移到其他专业和赛道。


    这是我现在的工作流，有的还是比较原始的，有的则是利用 AI 可以实现提效。


    | 流程 | 如何结合 AI | AI 化程度（个人估计和感受） | 人工判断点 |

    | --- | --- | --- | --- |

    | 选品 | 1、分析产品的可复刻性 | 30%，更多需要自己长期跑项目的手感，AI 筛选出来的数据也要经过判断 | AI 降低了我测试一个产品的成本，但它不能代替市场反馈，决定这个产品值不值得继续做。
    |

    | 制作商品 | 1、使用 AI 快速搭建框架，并且补齐资料 | 90%，少部分还需要人工审核，如果是强专业性质的内容，需要有专业人士审核为佳。 | 文本校对、给出的内容是否是实际想要交付的东西
    |

    | 笔记 | 1、调研近期用户关注场景和问题 | 90%，后面我放弃了自动化，回到手搓，也是为了规避过于 AI 化的表达，避免不经审核即被上传 | 文案的人味
    |

    | 数据分析 | 1、结合数据分析给到优化方案 | 80%，一些需求需要自己手动提出，在这里，数据复盘分析，更像是一个和 AI 小助理交流的过程，不是单纯产出一个报告
    | 明确自己核心目标，再去审核 AI 给到的结论 |


    ## 几点 AI 相关的感悟


    - 1. **尽量找现成的、合适的工具：** 我在这几个月过程中也做过一些尝试，虽然这些对我的 AI 能力和认知有帮助和启发，但是从项目结果上来说是“多余的”（比如我曾经尝试想要去做一些自动化抓取笔记的工具，结果折腾半天就放弃了），不如去使用现有工具，花点小钱，拿大结果。

    - 2. **写作部分尽量使用 ChatGPT 网页版 Chat 部分：** 不用 work 和应用，写出来的东西人机感很重。我个人感觉：自动化批量写作消耗的时间和精力＞
    网页版写作自己复制，所以至少在我的写作场景里，网页版 Chat 对话反复修改，比整套自动化写作更容易控制表达风格，也更省去后期返工。

    - 3. **先有成熟流程，再考虑自动化：** 自动化很牛，但是为了使用 AI，token 有消耗就去自动化，等跑通了，再确定应该把哪些步骤交给 AI；如果只需要做一次，或者用现成工具
    10 分钟就能解决，其实没必要专门开发。


    ## 数据复盘


    对我来说，数据复盘不局限于复盘的形式和结论，而是看是否可以变成可落地的行动，知道下一周应该做什么、调整什么。


    我一般每周复盘 1 次，如果赛道正处于一个流量、转化高峰期，可以每 4 天就复盘一次，快速调整。


    数据直接从千帆后台下载下来，最好是这个周期内所有相关数据都要下载一遍。


    **AI 分析：** 把数据交给 AI，重点看这三个方面：


    > AI 分析之前，要先检查数据口径是否一致，尤其是 GMV、商品访客和支付转化率，避免 AI 因为理解错数据而得出错误结论。


    - 上一轮周期的目标是否达成

    - 整条数据链条中，哪个转化率最需要提升，如何提升

    - 笔记整体的转化效率如何

    - 商品整体营收占比


    AI 这时会分析，最核心的提升点是什么？我们只需要结合当下的经营目标，选择 1—2 个优先动作，放到下一周执行。不内耗、不焦虑，有提升方向就去执行。


