  - '[PAGE 8]


    消耗，选择在反弹中退出的资金也越来越多，这里想要直接V型反转，就需要GJD与外围资金形成高度配合，因此笔者认为可能性不大。相对理想的路径，是先通过反弹稳住市场，再进入区间震荡，以时间换空间，通过反复换手逐步消化上方套牢筹码，最终为下一轮上涨创造条件。


    可以看到，今天与大盘形成共振的，主要是物理AI等筹码结构相对较好的方向。但这些方向短期更多交易的是情绪与筹码，而非基本面兑现。因此，笔者的策略依然是要信早信，哪个涨得好就信哪个，然后卖给后信的人。这本质上就是纯粹的博弈逻辑，前面讲过在行情的早期和晚期都是一样的意义。


    而对于前期具备明确产业逻辑的大光、半导体设备等方向，由于套牢盘较多，仍然需要时间通过反复换手完成筹码出清与成本重新统一。因此，短期不排除再次下探或横盘，通过放量进一步清理筹码的可能。但也正是这个过程，提供了更充分的布局时间与空间。如果实在不知道看什么，或者说心有余悸，笔者会参与创业板这些更确定的。


    逻辑与技术，我们依然在路上！


    本文仅为个人阶段性思考，不构成任何推荐，亦不作其它任何用途。


