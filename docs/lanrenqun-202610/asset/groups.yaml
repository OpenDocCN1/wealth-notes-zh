    中国本土的机器人装机量增速，高于世界水平。总结起这轮工业机器人的周期，首先是2020年从2019年的负增长谷底中复苏；2021至2022年进入由新能源汽车、锂电、光伏驱动的景气爆发与高峰期；2023年起进入周期性调整与主动去库存的下行阶段；2024年处于筑底与分化期；2025年起进入由通用制造业回暖与国产替代结构性升级共同驱动的新一轮温和上行周期。


    专精工业机器人的埃斯顿，肯定是完整地经历了这一轮行业的低迷周期。由于公司的工业机器人产销量没有具体公布，所以我们直接把埃斯顿的工业机器人业务营收和全球、全国工业机器人装机量，合并起来比对（单位：台、万元）：


