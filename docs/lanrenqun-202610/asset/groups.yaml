    买！买！》的报告的翌日起的 40 个交易日内，指数反弹了+47%，显然是因为政策转向发出的明确信号而致。而 2022 年 9 月 30 日和今天这类”磨底型”下跌，如果缺乏明确的政策信号，RSI
