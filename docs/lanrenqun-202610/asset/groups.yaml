  - '[PAGE 19]


    <!-- no content -->'
  - '[PAGE 20]


    会上，王大珩院士提出了一个惊天设想：复产运十！并充分运用麦道飞机的技术，来发展中国军用特种飞机！运十改预警机方案，连风洞都吹了这个想法，得到了高层的重视。


    两个月后，科技部分管高技术、863计划的副部长带队赴上飞所、上飞厂调研，看到原708工程研发人员待遇微薄、无稳定科研项目、大批资深设计师离散，当场表达明确关怀。


    这位副部长提出，由上海市政府牵头起草专项经费申请报告，上报科技部，科技部可依托863民机高技术专项渠道，配套一笔专项资金。


    当然，因为运十主管部门是航空工业部门，所以科技部这笔钱，只能用于留住原运十核心设计人员，维持基础设计能力、整理运十全套试验资料、避免团队完全解体而已，对复产运十起不到作用。


    不过科技部此行，引出了一个意外的人，延续了运十的生命。他就是上海市政府副秘书长——江上舟。看过《中国芯片往事》的都知道，江上舟是中国芯片产业传奇人物，就是他帮助张汝京创立了中芯国际，为中国芯片产业打下了最坚实的基础，也是他在张汝京被赶出中芯国际后，临危受命，出任中芯国际总裁，与台积电的掐肘作斗争。


    可是很多人都不知道的是，江上舟这位战略级的产业布局专家，当年是一手抓芯片，一手抓大飞机。江上舟和大飞机的缘分，'
  - '[PAGE 21]


    起源于张家顺。


    张家顺是马凤山的徒弟，马凤山去世后，

    心灰意冷的张家顺辞职，进入了一家民企

    工作。2001 年，张家顺参加上海工业博览

    会，在博览会上，张家顺向江上舟汇报工作，

    顺带提及了他参与的运十项目，江上舟听

    了大为震撼，马上提出，想去看一看运十。


    在一个阴郁的黄昏，江上舟终于在齐膝深

    的杂草中，见到了那架被遗弃了十几年的

    运十。


    那是一幅极具视觉冲击力的画面。黄浦江

    对岸的浦东新区正在拔地而起，玻璃幕墙

    在夕阳下闪烁着中国经济腾飞的光芒。而

    在大场机场的荒地里，代表着中国工业最

    高水准的钢铁巨鸟，铆钉却长满了暗红色

    的铁锈，轮胎早已干瘪皲裂，涂装也早已

    模糊褪色。


    江上舟走近这架庞然大物，伸出手，抚摸

    着机身上已经斑驳的漆皮，仿佛看到了十

    几年前，马凤山站在这里泣血的模样。“这

    就是我们中国人自己造的大飞机啊……”江

    上舟站在巨大的起落架下，仰着头，眼眶

    湿润了。


    那一刻，一种强烈的历史宿命感击中了他。

    马凤山未竟的遗愿，仿佛化作了一副无形

    的重担，死死地扣在了他的肩上。


    “运十不能就这么死了。只要它的魂还在，

    中国的大飞机就必须复活！”


    从那天起，江上舟开启了一场飞蛾扑火般

    的远征。科技部调研后，江上舟敏锐地发'
  - '[PAGE 22]


    现了重启大飞机项目的机会，很快就拿出了一盘活运十项目的方案：


    按照上海 75%，科技部 25%的出资比例，联合收购上飞集团，保住原运十完整研发队伍，补齐运十疲劳、高原等剩余试飞科目，计划 2005 年造出 3-5 架运十特种军用平台。


    这个方案的微妙之处在于，它不改变国家决定不上民用干线飞机，而上支线飞机的决定，也不涉及军方以俄罗斯伊尔-76 改装军用平台的决策，现有的利益格局不变，更不涉及上飞历史上的是是非非，最大限度地减少了阻力。


    但因为种种原因，这个方案还是无疾而终。


    不过这件事也让科技部发现了江上舟这个产业规划天才，所以在 2003 年开始编制《国家中长期科学和技术发展规划》时，直接把江上舟调入设在科技部的规划领导小组办公室，专门负责国家高新项目遴选、评估和论证工作。


    就这样，江上舟从上海来到北京，坐进了一栋上世纪 70 年代老楼的办公室。没有电梯，他扛着 20 斤资料每天爬 6 层，没有食堂，大家啃面包、泡方便面，120
    天，他从 600 份申报书里筛出 16 个重大专项：芯片产业、探月工程、3G/4G、北斗、高超声速飞行器、核聚变……这些战略级的项目，都是江上舟在这里精心选定的。


    后来，这 16 项被外媒称为“中国科技 16 条龙”。当然，江上舟把大飞机项目，也放在'
  - '[PAGE 23]


    了里面。到了这个阶段，江上舟考虑的其实已经不仅仅是运十复产的问题了，而是用大飞机来带动产业发展的问题了。


    他的原话是：


    “你有 100 个技术不一定能造出一个大飞机，相反，如果造了大飞机可以带动 100 个技术的开发。”“将大飞机纳入国家重大战略发展规划，就是为中国的机械、电子、材料、冶金等所有相关产业安了龙头。”为了减小阻力，江上舟也向有关部门耐心解释：我们今天提议复产运十，并不是说一定要原封不动地去生产一架
    70 年代技术水平的老飞机。


    运十真正宝贵的，不是那个生锈的躯壳，而是它背后那一整套自主研发的大型客机平台体系。只要我们以运十为基础，换上最新的发动机，升级航电系统，采用新材料，我们就能以极低的成本、极快的速度，重新拉起一支中国大飞机的设计制造国家队！


    可是，当科技部按照江上舟的提议，组织了 22 人的“大飞机项目论证组”之后，这个项目马上就成了阻力最大、反对声音最大、得罪人最多的项目。


    最后，论证组足足论证了 10 个月，结果论证了个一地鸡毛。过往教训、历史恩怨、部门利益、地方政绩……论证小组成了扯皮小组，每天在各个部门之间疲于奔命。


    江上舟就像一个孤独的堂吉诃德，举着长矛，一次次向着巨大的风车发起冲锋。他'
  - '[PAGE 24]


    在上海市市委和中央部委之间来回奔走，苦口婆心地劝说各个部门的领导。


    他甚至自掏腰包，请那些老一代的航空专家吃饭，鼓励他们不要放弃希望，把当年的图纸和经验重新整理出来。


    那段时间，江上舟的办公室经常亮灯到凌晨。他的办公桌上，左边堆着晶圆厂的建设图纸，右边堆着大飞机产业的厚厚报告。


    这是两座压得人喘不过气来的大山，而他，试图用自己瘦弱的肩膀，将它们同时扛起。


    然而，想说服各个部门还是很艰难。没办法，触动利益，比触动灵魂还难。江上舟事后恨铁不成钢地说：“我深切地感到，有的政府部门，并不能很好地站在国家民族的长远和根本利益上，在大飞机产业的决策过程中采取积极主动的态度。


    而是囿于部门利益、历史问题包袱和传统观念，长期以来采取不研究、不调查、不学习，甚至抵触的态度，客观上延误和干扰中央领导的决心......”


    就连当年提议召开香山会议的顾诵芬也都无奈了：“马凤山同志离开我们已经15年了！”


    可是中国的大型飞机到底怎么搞，已论证了3年还没有个结果。唯一希望英明的领导人在集思广益、科学论证的条件下尽快决策，真正开展我国大飞机产业，这样也可告慰马凤山同志的在天之灵。”


    怎么办？'
  - '[PAGE 25]


    怎么破除部门利益，真真正正站在国家的角度，去思考一下大飞机应该怎么搞的问题？2006年7月，在江上舟的建议下，大飞机专项启动了二次论证。


    这一次，江上舟请来了尚方宝剑，立了三个规矩：


    +   第一，以科技部牵头挑选专家人选，并且将来自三个不同机构的顾诵芬、李未和张彦仲确定为不分排名的并列主任，各个部门派来的专家不允许代表任何部门说话，只能根据个人专业判断发表看法。


    +   第二，论证期间实行封闭管理，专家与各自所属的机构之间不能通气，所有人的发言受到隐私保护，坚决不能透露任何消息给外界，确保所有人实事求是，客观讲话。


    +   第三，每个人的言论全部记录在案，对自己负责、对国家负责、对历史负责，纸质言论和讲话录音必须完全一致。涉及重要抉择则采用无记名投票形式，最大程度排除各种部门、地方本位的影响，使专家能够真正秉持公心、畅所欲言。有了这三条规矩，论证工作顺利多了。


    江上舟是这样回忆这次论证的：


    > “我个人还没碰到过比大飞机项目论证更难的事情。如果谁都不敢得罪，那就不好办了，碰都不敢碰。”


    从中可以印证一条经验：科学决策或者说科学论证是完全可行的，关键就看有没有'
  - '[PAGE 26]


    决心，再难的课题，只要认真做，总归能找到好的解决方案。”


    亲眼看到中国大飞机论证走上正轨后，江上舟才终于放心离职，接着又马不停蹄地开启了下一个任务：挽救正处于至暗时刻的中芯国际。


    2006 年 12 月，顾诵芬院士代替江上舟，向中央进行了论证方案汇报。2 个月后，国常会批准大型飞机研制重大科技专项正式立项。


    2008 年 5 月，中国商用飞机有限责任公司在上海挂牌成立。看起来，江上舟终于能告慰马凤山的在天之灵了。


    但是，命运似乎对那些逆天改命的人，格外残忍。此时，江上舟已经肝癌晚期了。


    拿到诊断书的那一刻，江上舟没有告诉任何人。


    他只是静静地在办公室里坐了半个小时，然后把诊断书锁进了抽屉的最深处。他太忙了，中芯国际刚刚败诉，张汝京被逼走，他要以一己之力把中芯国际扛起来，他连死的时间都没有。


    如果说当年的马凤山是被绝望逼死的，那么江上舟就是用自己的生命，为中国的高端工业燃烧最后一點灯油。江上舟的病情迅速恶化，癌细胞开始在他的体内肆虐，剧烈的疼痛常常让他整夜整夜地无法入睡，他大把大把地吞着止痛药，第二天清晨照旧穿上西装，强打精神去开会、谈判。'
