    用“实用”解释的原因：集卡真的有点像集邮票，上瘾。


    我自己就有这种感觉。已经有能用的卡了，看到另一张卡面好看、设计特别，还是会想了解一下。钱包里一排排不同的卡，翻着看也挺有意思，所以 x 上我也给自己起了一个外号“集卡狂魔”。


