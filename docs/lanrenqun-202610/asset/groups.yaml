  - '[PAGE 27]


    # 每次业务仍然从头开始。


    这就是我说的重构流程：不再让 AI 单独完成一篇稿，而是让一个真实问题贯穿资料、表达、审核和反馈；每走完一次，下一次都有依据。【实操提示词｜诊断并重构一段真实工作流程】


    你是我的业务流程诊断助手。请帮我从一项真实发生的工作中，找出第一版 AI 工作台值得重构的流程。先还原事实，再提出改动；不要把原有步骤逐一加上 AI，就称为“流程重构”。请先让我提供最近一次完成这项任务的实例，包括：什么事件触发了任务、收到哪些真实材料、实际经过哪些步骤和交接、哪里等待或返工、最终结果交给谁使用、对方是否真的使用。耗时如果只是估计，请标明“估计”。可以使用脱敏材料。信息不足时一次只问我一个关键问题。若我无法提供一件实际发生的任务，就先给我材料准备清单，不要画出假定的业务流程。获得实例后，请完成：1.
    还原现行流程：从触发到结果被使用，逐步写明谁处理、输入什么、产出什么、交给谁。把已核实的信息与待核实的信息分开。2. 找出真正的损耗：重复劳动、资料缺失、错误分流、等待、返工或无人负责的交接。指出哪一处损耗会影响后续业务。3.
    只选择一个最值得先试的流程改动。说明哪些步骤应保留、取消、合并、提前或分流；哪些由固定规则处理，哪些由 AI 整理信息或提出候选，哪些必须由人决定。不要直接设计一套完整系统。4.
    画出这一小段的试跑流程，写明开始条件、所需材'
  - '[PAGE 28]


    料、每一步负责人、产出结果、停止或转交人工的条件，以及完成标准。5. 设计一次真实试跑：使用哪份材料、由谁实际使用和验收；记录旧流程与新流程的总耗时、返工次数、结果是否可用，以及后续动作是否有人接住。最后输出“现行流程—损耗证据—建议改动—试跑方法”对照表。尚未试跑的效果一律标为“待验证”，不要宣称已经提效、增长或成交。


    # 4、从一项任务开始，搭建自己的 AI 工作台


    前面我们已经确定了场景、交付结果和流程边界，到了动手搭建这一步，没必要想着一次性先把内容、咨询、成交和复盘全部接起来。


    先选一项反复发生的工作，也就是在你看来，你整个业务路径当中最耗你时间的一个环节，让它从输入到反馈完整跑一轮。跑通后，再接入下一项任务。


    ![](img/4d29d59907f569dfdb6f8f1700c0501f_28_0.png)


    如果不想自己去操作，可以直接跳到第四步最后的提示词环节，把提示词发给你的 AI 工具，他就会帮你完成。


    # 第一步，写一张任务卡，确定工作台要完成什么。


    从最近一周的工作中，找一项重复出现、耗时且结果容易检查的任务。例如：收到用户提问后，依据现有资料形成一份回复候选。任务卡只写四件事：


    +   - 什么时候启动：收到一条具体的用户提'
  - '[PAGE 29]


    问。


    +   - 需要什么输入：提问原话、已有的产品或服务资料、不能越过的服务边界。

    +   - 应该产出什么：一份回复候选，以及需要继续向用户确认的问题。

    +   - 怎样算合格：回答了原问题，关键说法有资料依据，没有替负责人作出未经确认的承诺。


    这张卡的作用，是把“让 AI 帮我做业务”缩小成一件可以开始、可以结束、可以验收的工作。


    # 第二步，先写判断规则，决定任务往哪里走。


    工作台接到输入后，不是让他立刻调用写作能力。先判断当前资料是否足够、问题属于哪一类、谁有权决定下一步。第一版可以用一张简单的分流表：


    [内嵌电子表格 - 无法获取表格信息]


    刚开始这一步完全可以由人对照表格判断。等处理过一批任务，发现分类足够稳定，再让 AI 先做分类，人检查分类是否正确。


    注意，分流规则写不清楚时，增加 Agent 只会让更多任务更快地走错路。第三步，给每条路接上对应的处理能力。一条最小流程可以这样连接：


    收到原始任务 → 判断类别和资料是否齐全 → 调用对应能力生成候选 → 检查结果 → 人工确认。


    这里的“调用能力”不一定是复杂的智能体。'
  - '[PAGE 30]


    它可以是一段固定提示词、一个 Skill，或一次针对资料的检索。


    关键是不同任务调用不同的处理方式：资料不全时先追问，资料齐全时才生成；涉及承诺时，AI 只准备判断材料，最终决定留给负责人。


    第一次搭建时，用一张表记录任务、手动调用 AI、手动审核结果，就已经能跑通这条流程。等你知道哪些环节稳定、哪些环节总出错，再考虑自动触发和工具连接。


    # 第四步，保存人工修改和真实反馈，让下一轮有依据。


    每完成一轮，至少留下五项记录：原始问题、分流结果、使用了哪些资料、AI 的候选结果、负责人改了什么。真正使用之后，再补一项：对方接着问了什么，或在哪一步没有继续。


    回收这些记录，不是为了让 AI 自动“学习一切”，而是为了知道下一轮该改哪里：事实不全，就补资料；任务分错，就改分流规则；候选经常说过头，就改边界和审核标准；用户始终看不懂，就重新检查交付物是否回答了他的问题。


    这样，一项任务才完成了从真实输入、规则判断、分流调用、人工审核到反馈回收的闭环。跑通第一项任务后，再用同样的方法接入内容创作、用户咨询或数据复盘。


