    # # 1–2 个人、1–2 个蓝 V 账号，如何做到单月 50–100 万营收？我们的小红书付费流获客实战复盘


    261008 副业 SC 精华

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_0_0.png)


    > **小懒判断**｜想从小红书免费流转付费投放的老板细读：考研自习室 4 个月 260 万、情感咨询留资 308 元压到 150 元，聚光测试-放量-复盘全流程都在。最值得抄的是三层成本算法——150
    元客资 20% 成交率比 100 元 10% 划算，别只盯留资单价。坑在口径：260 万是免费付费一起做的，除以广告费当 ROI 必错。没销售承接先别碰。


    做小红书获客这几年，我听过很多人说同一句话：“我知道可以投广告，但我不敢投。先拿一万块钱出来，到底能换回什么？”


    这个顾虑很真实。免费流至少看起来不用先掏钱，而付费流一开始就要面对预算、成本和未知的结果。我自己也是从免费流做起的，直到客户的生意需要稳定获客，我们才真正开始学聚光、做测试，一点点把付费流跑通。


    现在再看，我觉得付费流最有价值的地方，是让获客这件事更容易测量和调节。你能逐渐知道，一个客户大概要花多少钱，一天能接住多少咨询，以及多投入一笔预算，后端有没有能力把它变成收入。'
  - '[PAGE 1]


    但这有前提。产品要有人买，销售要接得住，交付和利润也要算得过来。付费流可以帮助你验证生意、放大生意，也会把原来藏在业务里的问题更快暴露出来。这篇文章，我想把我们的转型经历、几个项目里的得失，以及一套实际使用的投放方法讲清楚。这里的“客资”，指潜在客户线索；“销转”，指销售转化。案例中的数字对应各自的项目和统计阶段，不能直接当成另一个行业的收益预期。


    # 一、我们为什么从免费流转向付费流


    # 从第一篇 80 元的笔记开始


    我和我的老公 Jasper 原来都在互联网行业工作，后来成了同事，也一起经历过业务从高速增长到快速下滑的过程。到了 2024 年，我们开始认真想：如果离开公司，能靠什么能力做一门的自己的生意？


    那段时间我很焦虑，就去生财有术刷精华帖，把近一年的内容集中看了一遍。我本来就是做内容和运营出身的，日常也一直使用小红书，于是选了自己更熟悉的平台。


    先跟着谢无敌学习小红书获客的基础知识，开始实操后，又加入珍妮的社群，把她的帖子一篇篇看完。对我们来说，前一阶段补的是入门基础，后一阶段补的是具体怎么做内容、怎么拆解有效的笔记。后来很多方法，都是在这个基础上，通过真实项目慢慢长出来的。


    2024 年 3 月，我接到了第一个代运营客户，是一个想吸引 HR 人群的灵活用工平台。'
  - '[PAGE 2]


    那时我的报价是 80 元一篇笔记，一个月写 12 篇，月收入也就九百多元。


    账号两周涨粉过千，后来给客户导入了大约 900 个微信好友。但项目没有一直做下去，因为后端产品和转化还没有准备好。这是我们很早就碰到的一课：前端拿到流量，和后端做成生意，中间还有很长一段路。


    # 2024 年 3 月，第一个代运营客户


    纯免费流


    来源 运营群里的兼职信息

    产品 用友软件旗下灵活用工平台

    目标 将精准 HR 粉引流至微信私域

    报价 80 元 / 篇笔记


    两周涨粉过千

    3 篇互动数 3000+ 爆款笔记

    小红书群 1700 人，微信 900 人


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_2_0.png)


    24 年 8 月，我们正式离职创业，又接到了第一位陪跑客户。一位心理咨询老师看了我的公众号文章，先付了 199 元做一对一分析。我给他的行业做了调研，聊完后，她直接问我陪跑多少钱。那时我们连定价都没完全想好，最后从两个月
    3000 元开始做。


    # 2024 年 8 月，第一个陪跑客户


    第一个陪跑客户，疗愈赛道


    公众号文章

    + 一次打法分析的 1v1 咨询

    促成成交


    3000 元

    2 个月陪跑


    我不仅能自己做（代运营）

    还能教别人做（陪跑）


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_2_1.png)


    我们的业务就是这样一点点形成的。先自己做内容，再做代运营，后来逐渐增加培'
  - '[PAGE 3]


    训和企业陪跑。


    # 真正推动转型的是客户的经营压力


    最开始免费流很好做，我们也做出过不错的结果。但到了 2024 年下半年，账号出现引流违规、流量波动的情况，让我们越来越不踏实。


    如果只是自己做一个副业账号，今天没流量，可能还能等明天。可客户已经租了场地、招了销售，每个月都有固定支出，获客突然停下来，影响的就是整门生意。


    2024 年 12 月前后，我们接了一个长沙考研自习室项目。客户有两百多个床位，提供学习空间和住宿。销售要有人咨询，床位要有人入住，不能把所有希望都压在免费账号上。


    所以我们给他的方案是两个免费流账号，加一个企业号做付费投放。客户信任我们，愿意拿出预算测试。我们也就在这个项目里，一边学聚光，一边上素材、看数据，完成了从免费流到付费流的过渡。


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_3_0.png)


    转型最直接的原因，是我们开始承担一门真实生意对获客稳定性的要求。'
  - '[PAGE 4]


    # 二、四个项目让我们重新理解获客


    考研自习室让我们看到免费和付费可以一起做


    考研自习室这个项目，大约一个星期就测到了比较合适的素材和获客成本。之后持续投放，四个月左右，床位基本招满。


    当时汇总的项目结果是 3000 多条精准线索、1600 多人加微信、200 多人成交，四个月总营收超过 260 万元。


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_4_0.png)


    这里有个口径必须讲清楚：这组数字是整个项目的结果。免费流和付费流在当时都贡献了相当一部分业绩，不能把全部营收除以广告费，就说成付费广告单独创造的回报。


    这个案例对我们最大的影响，是看到了经营上的主动性。有效素材测出来以后，可以继续投入预算获取客户，销售和场地安排也就有了更明确的依据。


    从 2025 年开始，我们做新项目时，会更认真地评估企业号投放。免费流有机会就用，但涉及持续获客的业务，我们希望至少有一条能够测试、能够调节的付费路径。


    # 情感咨询让我们学会同时看成本和成交率'
  - '[PAGE 5]


    情感咨询这个项目并没有一开始就成功。第一个月，我们参考了同行常见的内容方向去做，结果很差：广告消耗约 1.3 万元，留资 43 人，只成交了 4 人。单条留资成本约
    308 元，成交率约 9.3%，单个成交客户的广告成本到了三千多元。


    | 月份 | 总消耗 | 进线数 | 进线成本 | 开口数 | 开口成本 | 进线-开口转化率 | 留资数 | 留资成本 | 开口-留资转化率 | 成交数
    | 成交成本 | 留资-成交转化率 |

    |---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|

    | 第一个月 | 13285.54 | 92 | 144.41 | 73 | 181.99 | 79.35% | 43 | 308.05 | 58.90%
    | 4 | 3321.37 | 9.30% |

    | 第二个月 | 13285.54 | — | — | — | — | — | 53 | 250.00 | — | 5 | 2653.?? | 9.30%
    |

    | 第三个月 | 13285.54 | — | — | — | — | — | 66 | 200.00 | — | 6 | 2214.?? | 9.30%
    |

    | 第四个月 | 13285.54 | — | — | — | — | — | 88 | 150.00 | — | 8 | 1660.?? | 9.30%
    |

    | 汇总转化率 | — | — | — | — | — | 82% | — | — | 68.80% | — | — | — |


    如果只看“来了几个咨询”，好像也不能说完全没效果。但把钱和成交放到一起，就知道这个模型还没有跑通。


    续费前，我和客户重新算了一次账。以当时的销售转化能力，留资成本需要先朝 200 至 250 元的目标压，才可能改善经营结果。这是当时根据项目数据算出的测试目标，并不是情感咨询行业的统一标准。


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_5_0.png)


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_5_1.png)'
  - '[PAGE 6]


    随后，我们把账号的人设、内容方向和模板一起调整，重新理解到底在吸引什么人，以及这批人为什愿意付费。到 6 月，项目开始跑正；7 月继续加大了投放。


    7 月后台广告消耗约 10.1 万元，私信留资 671 人，单条留资成本约 150 元。按当时项目的销售反馈，成交率接近 20%。


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_6_0.png)


    这个项目让我更确定：便宜的客资和有价值的客资，要放到成交环节一起判断。后来效果改善，既有留资成本下降，也有客资更匹配、后端成交率提高的贡献。


    # 个人 IP 加付费流让我看到分工的价值


    2026 年，我们接触到一个做 AI 知识付费'
  - '[PAGE 7]


    的个人 IP。他擅长表达，有自己的视频内容和影响力，但还需要更稳定地销售产品。


    我们团队擅长图文获客，于是形成了一个很清晰的分工：他出视频、表达观点、建立信任，我们用图文把产品、服务和购买理由讲清楚，再结合投放去测试。


    这个项目后来做到单月约 10 万元广告消耗，对应约 50 万元成交额。前端小红书运营的配置很轻，我负责整体策划和投放，带一位兼职做内容，一个月更新约 25
    篇笔记。


    但这不代表“一个人就能完成一门月入 50 万元的生意”。客户本人还要录视频、做直播、做交付，后端也有销售人员持续跟进。我们说的人效高，指的是前端获客这部分的人效。


    它也有自己的产品条件：低价体验产品负责让用户迈出第一次付费的动作，后面还有系统课程和咨询服务。真人 IP、销售跟进、产品梯度，和付费流一起发挥作用。


    我们还在这个项目中测试过两种入口：直接获取咨询线索，以及投放一个 9.9 元的体验产品。当时后者带来的用户付费意愿更明确，综合成本也有所改善。


    这个经验可以借鉴，但不能推导成所有知识付费都应该用同一种投法。你要继续看购买后有多少人加微、多少人到课、多少人购买后续产品，以及交付和退款的实际情况。


    # 减脂陪跑让我们看到投放之外的上限'
  - '[PAGE 8]


    还有一个项目，卖的是每月 299 元的减脂陪跑。投放能带来客户，当时反馈的销售收入与广告投入比例大约为 3：1，但项目后来没有继续做下去。


    问题在后端。陪伴服务需要人，一个人能照顾的客户有限，规模一大就得继续招人、管理人。产品又只有这一个价位，没有足够的后续产品承接，业务越扩，利润空间越容易被人力成本吃掉。'
  - '[PAGE 9]


    <!-- no content -->'
  - '[PAGE 10]


    # 公司礼品定制


    100+

    至 1000+

    3 个月，月客资变化


    74w

    2 月份营收


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_10_0.png)


    这两个项目放在一起看，道理很具体：前端投放跑通以后，下一个问题往往是销售和交付能承接多少。流量不是唯一的瓶颈。


    # 三、小红书 5 种获客方式各自解决什么问题


    很多人会问，到底该做免费流，还是直接投广告？我的习惯是先把几种方式拆开，再放回业务里判断。


    # 5 种获客方式，用同一套维度比较


    | 获客方式 | 流量类型 | 效果-流量稳定性 | 效果-对销转的帮助（爆款依赖/信任前置） | 投入-人力成本 | 投入-金钱成本 | 业务阶段-适用阶段
    |

    |---|---|---|---|---|---|---|

    | 素人种草<br>A 种 B 收 | 免费/付费 | 低 | 高 | 中 | 高 | 0-1，10-100（卷王赛道） |

    | 截流打粉 | 免费流 | 中 | 低 | 低 | 低 | 全阶段（泛粉） |

    | 短视频 IP | 免费流 | 低 | 高 | 高 | 低 | 全阶段 |

    | 蓝 V 自然流 | 免费流 | 中 | 高 | 中 | 中 | 0-1 |

    | 聚光/千帆投放 | 付费流 | 高 | 高 | 低 | 高 | 全阶段 |


    # 素人种草


    消费者在决定买什么之前，会去看其他人的体验。真实的使用场景、反馈和对比，能帮助他理解一个产品，也会影响最后选哪家。


    这类内容可以依靠自然传播，也可以结合平台支持的合作推广。单纯靠自然传播时，效果比较依赖内容表现；如果要长期、大'
  - '[PAGE 11]


    范围铺设内容，选题、素材、账号合作和沟通都会带来成本。


    在我们接触的部分竞争激烈的行业里，商家只靠自己的企业号介绍产品还不够。用户搜索时看到的体验内容，也会参与决策。因此，种草可以和直接获客一起做。对外沟通时，应当把真实体验和商业合作讲清楚，避免把虚构体验当成消费者证言。


    # 截流打粉


    所谓截流，是在相关内容和需求场景中寻找潜在客户，再尝试建立联系。它看起来离需求很近，但用户对原内容或原商家的信任，不会自动转移到新出现的商家身上。


    所以即使拿到了接触机会，销售仍然要重新解释自己是谁、能提供什么。对需要较强信任的服务，这个成本尤其明显。未经邀请的反复私信也容易造成反感，不能把它当成持续获客的基础。


    # 短视频 IP


    IP 内容的优势很直接：用户持续看你，了解你的判断、表达和做事方式，最后可能就是因为信任你而付费。


    代价是它需要持续投入。本人要出镜，内容要有观点，脚本、拍摄和剪辑也要跟上。即使积累了信任，自然流量的规模仍会波动。


    我们接触到越来越多已经有个人影响力的客户，开始考虑付费投放。他们有内容和信任基础，还希望获客数量能更贴近公司'
  - '[PAGE 12]


    的经营安排。前面的 AI 项目，就是这种组合的一个例子。


    # 蓝 V 自然流


    企业认证账号也会有自然流量。我们也陪跑过一家本地财税公司，用多个企业号持续覆盖本地需求和搜索内容，同时配置少量账号做付费投放。


    它能做起来，与本地化业务、已有服务基础和长期内容投入有关。不能只看到别人铺了很多账号，就认为多注册几个号一定有效。账号、人员和更新量都需要算成本。


    如果你还在验证小红书这个渠道，自然流可以作为一种起步方式。但要给自己设置验证目标，别把“每天都在发”当成项目在前进。


    # 聚光和千帆投放


    在我们这些项目里，聚光主要用来测试咨询、线索获取，千帆则出现在商品成交入口的测试里。具体选择，要看业务能使用的产品能力、推广目标和账户条件。


    付费的优势，是当内容和转化逐渐稳定后，可以围绕预算、成本和获客量做调节。销售接不住时少投一些，有余力时再扩大测试。


    我在现场把它比喻成“水龙头”。这个比喻说的是可调节性，不是说扩大预算，客户就一定等比例增加。竞争、人群、素材衰减和销售承接，都会影响放量后的实际结果。'
  - '[PAGE 13]


    <!-- no content -->'
  - '[PAGE 14]


    我会用行业关键词、客户需求和购买时会问的问题去搜，观察有没有持续投放的内容，评论里有没有问价格、问地点、问服务的真实需求，以及这些账号如何介绍产品。


    这些信息能帮助我们形成测试假设，但外部页面看不到同行完整的广告成本、成交和利润。持续投放是一个值得研究的信号，并不能单独证明对方一定赚钱。


    还有一个经常被误判的地方：广告笔记的点赞收藏少，不等于没效果。有明确需求的人，可能看到服务介绍就直接点咨询，根本不会先点赞、再收藏、再留言。


    所以研究付费账号时，不要只用做内容号的标准去判断它。前端互动能看到一部分情况，真正的获客和经营效果还得回到后台与销售记录。


    # 团队与预算要支持你完成测试


    起步不一定需要很大的团队。一个账号，也可以开始验证。更重要的是，谁负责持续产出内容，谁看投放数据，谁及时接咨询，出了问题谁来调整。


    预算则要结合预计成本和需要的样本量。假设预计一条客资成本在 50 至 150 元，300 元一天可能拿到几个样本；如果预计成本已经到 200 至 500 元，同样的预算可能一天只能拿到一两个，判断速度就很慢。


    这只是说明预算和样本的关系，不是统一的起投标准。你还要考虑成交周期，以及自己能承受多长时间的测试。开始前就明'
  - '[PAGE 15]


    确可承受的测试投入和复盘节点，比投出去以后每天焦虑更有用。


    # 五、开始投放前把生意的账算清楚


    # 把平台数据和销售数据接起来


    一旦开始持续付费，我就会要求团队每天更新数据。除了广告消耗和点击表现，还要记录进线、开口、留资、实际加微，以及后面的成交。


    在我们这些项目的常用统计口径里，进线是用户进入咨询页面，开口是产生进一步互动，留资是完成相应的联系方式动作。具体指标定义要以账户后台为准；平台留资之后，是否实际加上微信、是否有真实需求，还要通过私域记录核对。


    如果业务需要到店、预约或试听，就把这些环节也加进去。这样你才能知道，用户到底在哪一步流失了。


    流量端和销售端还要对“有效客资”有同一套定义。例如，需求是否属于服务范围，地域是否能承接，联系方式是否有效。否则前端说来了很多客户，销售说一个都不好，最后只能互相讲感觉。


    # 至少算清楚三层成本


    平台留资成本，等于广告消耗除以平台留资数。它能帮助判断投放表现，但只是链路中的一个位置。


    有效客资成本，等于广告消耗除以确认有效的客资数。它更接近销售真正能够跟进的人群。'
  - '[PAGE 16]


    成交获客成本，等于对应广告消耗除以对应批次的新成交客户数。这一步要把成交周期算进去，不能拿本月广告费，随意对应所有老客户和新客户的回款。


    # 成交率也要看同一批次。


    这一批客资后来成交多少人，才能说明这批流量和销售跟进的实际效果。如果产品需要较长决策时间，刚进来的客户尚未成交，不等于他们最终不会购买。


    # 留资成本下降不一定意味着生意变好


    举一个纯计算示例：一种投法拿到 100 条有效客资，每条 100 元，成交率 10%，广告消耗 1 万元，成交 10 人，单个成交客户的广告成本是 1000
    元。


    另一种投法的有效客资单价是 150 元，但成交率达到 20%。同样 100 条有效客资，广告消耗 1.5 万元，成交 20 人，单个成交客户的广告成本反而降到
    750 元。


    ![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_16_0.png)


    所以我更关心的是，一条客资进入销售环节以后发生了什么，而不是单独追求后台某个数字最低。


    情感咨询项目的变化也说明了这一点。调整内容方向后，我们同时看到了留资成本'
  - '[PAGE 17]


    和成交率的改善，才有继续放量的依据。


    # 营收和投产之外还要看利润


    在交流中，大家经常说“投产 1：3”或“ROI 1：3”，但这类说法可能只是指广告投入与销售收入的比例。拿到这样的数字，先问清楚统计口径。


    实际算账时，还要扣退款、产品或服务的交付成本、销售提成、运营人力、外包服务费，以及需要分摊的固定支出。低价陪跑项目即使前端投产看起来不错，也可能被后端的人力消耗拖住。


    如果已有稳定数据，可以从目标反推预算：希望增加多少成交，需要多少有效客资，按目前的客资成本要投入多少，再核对销售和交付是否接得住。


    这个测算是帮助你做决定的假设，不是未来收入的承诺。产品、人群或渠道变了，原来的成交率也需要重新验证。


    # 六、一个蓝 V 项目如何开始测试


    # 先完成准入和承接准备


    正式投入前，先确认业务是否符合平台当前的推广要求，营业执照、类目、资质和实际服务是否匹配，是否涉及保证金，以及账户开通、广告充值等要求。


    这些条件会变化，应该按具体行业和账户向官方确认。不要把别人的历史开户经验直接套在自己的业务上，也不要把保证金、待消耗广告余额和已经发生的费用混在一起算。'
  md: "\n## 1–2 个人、1–2 个蓝 V 账号，如何做到单月 50–100 万营收？我们的小红书付费流获客实战复盘\n\n261008 副业 SC 精华\
    \  \n整理：公众号“懒人搜索”，懒人专属群精选  \n懒人微信：lazyhelper1\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_0_0.png)\n\
    \n> **小懒判断**｜想从小红书免费流转付费投放的老板细读：考研自习室 4 个月 260 万、情感咨询留资 308 元压到 150 元，聚光测试—放量—复盘全流程都在。最值得抄的是三层成本算法——150\
    \ 元客资 20% 成交率比 100 元 10% 划算，别只盯留资单价。坑在口径：260 万是免费付费一起做的，除以广告费当 ROI 必错。没销售承接先别碰。\n\
    \n做小红书获客这几年，我听过很多人说同一句话：“我知道可以投广告，但我不敢投。先拿一万块钱出来，到底能换回什么？”\n\n这个顾虑很真实。免费流至少看起来不用先掏钱，而付费流一开始就要面对预算、成本和未知的结果。我自己也是从免费流做起的，直到客户的生意需要稳定获客，我们才真正开始学聚光、做测试，一点点把付费流跑通。\n\
    \n现在再看，我觉得付费流最有价值的地方，是让获客这件事更容易测量和调节。你能逐渐知道，一个客户大概要花多少钱，一天能接住多少咨询，以及多投入一笔预算，后端有没有能力把它变成收入。\n\
    \n但这有前提。产品要有人买，销售要接得住，交付和利润也要算得过来。付费流可以帮助你验证生意、放大生意，也会把原来藏在业务里的问题更快暴露出来。这篇文章，我想把我们的转型经历、几个项目里的得失，以及一套实际使用的投放方法讲清楚。这里的“客资”，指潜在客户线索；“销转”，指销售转化。案例中的数字对应各自的项目和统计阶段，不能直接当成另一个行业的收益预期。\n\
    \n## 一、我们为什么从免费流转向付费流\n\n### 从第一篇 80 元的笔记开始\n\n我和我的老公 Jasper 原来都在互联网行业工作，后来成了同事，也一起经历过业务从高速增长到快速下滑的过程。到了\
    \ 2024 年，我们开始认真想：如果离开公司，能靠什么能力做一门自己的生意？\n\n那段时间我很焦虑，就去生财有术刷精华帖，把近一年的内容集中看了一遍。我本来就是做内容和运营出身的，日常也一直使用小红书，于是选了自己更熟悉的平台。\n\
    \n先跟着谢无敌学习小红书获客的基础知识，开始实操后，又加入珍妮的社群，把她的帖子一篇篇看完。对我们来说，前一阶段补的是入门基础，后一阶段补的是具体怎么做内容、怎么拆解有效的笔记。后来很多方法，都是在这个基础上，通过真实项目慢慢长出来的。\n\
    \n2024 年 3 月，我接到了第一个代运营客户，是一个想吸引 HR 人群的灵活用工平台。\n\n那时我的报价是 80 元一篇笔记，一个月写 12 篇，月收入也就九百多元。\n\
    \n账号两周涨粉过千，后来给客户导入了大约 900 个微信好友。但项目没有一直做下去，因为后端产品和转化还没有准备好。这是我们很早就碰到的一课：前端拿到流量，和后端做成生意，中间还有很长一段路。\n\
    \n### 2024 年 3 月，第一个代运营客户\n\n- 纯免费流\n- 来源：运营群里的兼职信息\n- 产品：用友软件旗下灵活用工平台\n- 目标：将精准\
    \ HR 粉引流至微信私域\n- 报价：80 元/篇笔记\n- 两周涨粉过千\n- 3 篇互动数 3000+ 爆款笔记\n- 小红书群 1700 人，微信\
    \ 900 人\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_2_0.png)\n\n24 年 8 月，我们正式离职创业，又接到了第一位陪跑客户。一位心理咨询老师看了我的公众号文章，先付了\
    \ 199 元做一对一分析。我给她的行业做了调研，聊完后，她直接问我陪跑多少钱。那时我们连定价都没完全想好，最后从两个月 3000 元开始做。\n\n###\
    \ 2024 年 8 月，第一个陪跑客户\n\n- 第一个陪跑客户，疗愈赛道\n- 公众号文章 + 一次打法分析的 1v1 咨询促成成交\n- 3000 元，2\
    \ 个月陪跑\n- 我不仅能自己做（代运营），还能教别人做（陪跑）\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_2_1.png)\n\
    \n我们的业务就是这样一点点形成的。先自己做内容，再做代运营，后来逐渐增加培训和企业陪跑。\n\n### 真正推动转型的是客户的经营压力\n\n最开始免费流很好做，我们也做出过不错的结果。但到了\
    \ 2024 年下半年，账号出现引流违规、流量波动的情况，让我们越来越不踏实。\n\n如果只是自己做一个副业账号，今天没流量，可能还能等明天。可客户已经租了场地、招了销售，每个月都有固定支出，获客突然停下来，影响的就是整门生意。\n\
    \n2024 年 12 月前后，我们接了一个长沙考研自习室项目。客户有两百多个床位，提供学习空间和住宿。销售要有人咨询，床位要有人入住，不能把所有希望都压在免费账号上。\n\
    \n所以我们给他的方案是两个免费流账号，加一个企业号做付费投放。客户信任我们，愿意拿出预算测试。我们也就在这个项目里，一边学聚光，一边上素材、看数据，完成了从免费流到付费流的过渡。\n\
    \n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_3_0.png)\n\n转型最直接的原因，是我们开始承担一门真实生意对获客稳定性的要求。\n\
    \n## 二、四个项目让我们重新理解获客\n\n### 考研自习室让我们看到免费和付费可以一起做\n\n考研自习室这个项目，大约一个星期就测到了比较合适的素材和获客成本。之后持续投放，四个月左右，床位基本招满。\n\
    \n当时汇总的项目结果是 3000 多条精准线索、1600 多人加微信、200 多人成交，四个月总营收超过 260 万元。\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_4_0.png)\n\
    \n这里有个口径必须讲清楚：这组数字是整个项目的结果。免费流和付费流在当时都贡献了相当一部分业绩，不能把全部营收除以广告费，就说成付费广告单独创造的回报。\n\
    \n这个案例对我们最大的影响，是看到了经营上的主动性。有效素材测出来以后，可以继续投入预算获取客户，销售和场地安排也就有了更明确的依据。\n\n从 2025\
    \ 年开始，我们做新项目时，会更认真地评估企业号投放。免费流有机会就用，但涉及持续获客的业务，我们希望至少有一条能够测试、能够调节的付费路径。\n\n###\
    \ 情感咨询让我们学会同时看成本和成交率\n\n情感咨询这个项目并没有一开始就成功。第一个月，我们参考了同行常见的内容方向去做，结果很差：广告消耗约 1.3\
    \ 万元，留资 43 人，只成交了 4 人。单条留资成本约 308 元，成交率约 9.3%，单个成交客户的广告成本到了三千多元。\n\n| 月份 | 总消耗\
    \ | 进线数 | 进线成本 | 开口数 | 开口成本 | 进线-开口转化率 | 留资数 | 留资成本 | 开口-留资转化率 | 成交数 | 成交成本 |\
    \ 留资-成交转化率 |\n|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|\n\
    | 第一个月 | 13285.54 | 92 | 144.41 | 73 | 181.99 | 79.35% | 43 | 308.05 | 58.90%\
    \ | 4 | 3321.37 | 9.30% |\n| 第二个月 | 13285.54 | — | — | — | — | — | 53 | 250.00\
    \ | — | 5 | 2657.11 | 9.30% |\n| 第三个月 | 13285.54 | — | — | — | — | — | 66 | 200.00\
    \ | — | 6 | 2214.26 | 9.30% |\n| 第四个月 | 13285.54 | — | — | — | — | — | 88 | 150.00\
    \ | — | 8 | 1660.69 | 9.30% |\n| 汇总转化率 | — | — | — | — | — | 82% | — | — | 68.80%\
    \ | — | — | — |\n\n如果只看“来了几个咨询”，好像也不能说完全没效果。但把钱和成交放到一起，就知道这个模型还没有跑通。\n\n续费前，我和客户重新算了一次账。以当时的销售转化能力，留资成本需要先朝\
    \ 200 至 250 元的目标压，才可能改善经营结果。这是当时根据项目数据算出的测试目标，并不是情感咨询行业的统一标准。\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_5_0.png)\n\
    \n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_5_1.png)\n\n随后，我们把账号的人设、内容方向和模板一起调整，重新理解到底在吸引什么人，以及这批人为什么愿意付费。到\
    \ 6 月，项目开始跑正；7 月继续加大了投放。\n\n7 月后台广告消耗约 10.1 万元，私信留资 671 人，单条留资成本约 150 元。按当时项目的销售反馈，成交率接近\
    \ 20%。\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_6_0.png)\n\n这个项目让我更确定：便宜的客资和有价值的客资，要放到成交环节一起判断。后来效果改善，既有留资成本下降，也有客资更匹配、后端成交率提高的贡献。\n\
    \n### 个人 IP 加付费流让我看到分工的价值\n\n2026 年，我们接触到一个做 AI 知识付费的个人 IP。他擅长表达，有自己的视频内容和影响力，但还需要更稳定地销售产品。\n\
    \n我们团队擅长图文获客，于是形成了一个很清晰的分工：他出视频、表达观点、建立信任，我们用图文把产品、服务和购买理由讲清楚，再结合投放去测试。\n\n这个项目后来做到单月约\
    \ 10 万元广告消耗，对应约 50 万元成交额。前端小红书运营的配置很轻，我负责整体策划和投放，带一位兼职做内容，一个月更新约 25 篇笔记。\n\n但这不代表“一个人就能完成一门月入\
    \ 50 万元的生意”。客户本人还要录视频、做直播、做交付，后端也有销售人员持续跟进。我们说的人效高，指的是前端获客这部分的人效。\n\n它也有自己的产品条件：低价体验产品负责让用户迈出第一次付费的动作，后面还有系统课程和咨询服务。真人\
    \ IP、销售跟进、产品梯度，和付费流一起发挥作用。\n\n我们还在这个项目中测试过两种入口：直接获取咨询线索，以及投放一个 9.9 元的体验产品。当时后者带来的用户付费意愿更明确，综合成本也有所改善。\n\
    \n这个经验可以借鉴，但不能推导成所有知识付费都应该用同一种投法。你要继续看购买后有多少人加微、多少人到课、多少人购买后续产品，以及交付和退款的实际情况。\n\
    \n### 减脂陪跑让我们看到投放之外的上限\n\n还有一个项目，卖的是每月 299 元的减脂陪跑。投放能带来客户，当时反馈的销售收入与广告投入比例大约为\
    \ 3：1，但项目后来没有继续做下去。\n\n问题在后端。陪伴服务需要人，一个人能照顾的客户有限，规模一大就得继续招人、管理人。产品又只有这一个价位，没有足够的后续产品承接，业务越扩，利润空间越容易被人力成本吃掉。\n\
    \n### 公司礼品定制\n\n- 100+ 至 1000+，3 个月，月客资变化\n- 74w，2 月份营收\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_10_0.png)\n\
    \n这两个项目放在一起看，道理很具体：前端投放跑通以后，下一个问题往往是销售和交付能承接多少。流量不是唯一的瓶颈。\n\n## 三、小红书 5 种获客方式各自解决什么问题\n\
    \n很多人会问，到底该做免费流，还是直接投广告？我的习惯是先把几种方式拆开，再放回业务里判断。\n\n### 5 种获客方式，用同一套维度比较\n\n| 获客方式\
    \ | 流量类型 | 效果-流量稳定性 | 效果-对销转的帮助（爆款依赖/信任前置） | 投入-人力成本 | 投入-金钱成本 | 业务阶段-适用阶段 |\n\
    |---|---|---|---|---|---|---|\n| 素人种草<br>A 种 B 收 | 免费/付费 | 低 | 高 | 中 | 高 | 0-1，10-100（卷王赛道）\
    \ |\n| 截流打粉 | 免费流 | 中 | 低 | 低 | 低 | 全阶段（泛粉） |\n| 短视频 IP | 免费流 | 低 | 高 | 高 | 低\
    \ | 全阶段 |\n| 蓝 V 自然流 | 免费流 | 中 | 高 | 中 | 中 | 0-1 |\n| 聚光/千帆投放 | 付费流 | 高 | 高 |\
    \ 低 | 高 | 全阶段 |\n\n### 素人种草\n\n消费者在决定买什么之前，会去看其他人的体验。真实的使用场景、反馈和对比，能帮助他理解一个产品，也会影响最后选哪家。\n\
    \n这类内容可以依靠自然传播，也可以结合平台支持的合作推广。单纯靠自然传播时，效果比较依赖内容表现；如果要长期、大范围铺设内容，选题、素材、账号合作和沟通都会带来成本。\n\
    \n在我们接触的部分竞争激烈的行业里，商家只靠自己的企业号介绍产品还不够。用户搜索时看到的体验内容，也会参与决策。因此，种草可以和直接获客一起做。对外沟通时，应当把真实体验和商业合作讲清楚，避免把虚构体验当成消费者证言。\n\
    \n### 截流打粉\n\n所谓截流，是在相关内容和需求场景中寻找潜在客户，再尝试建立联系。它看起来离需求很近，但用户对原内容或原商家的信任，不会自动转移到新出现的商家身上。\n\
    \n所以即使拿到了接触机会，销售仍然要重新解释自己是谁、能提供什么。对需要较强信任的服务，这个成本尤其明显。未经邀请的反复私信也容易造成反感，不能把它当成持续获客的基础。\n\
    \n### 短视频 IP\n\nIP 内容的优势很直接：用户持续看你，了解你的判断、表达和做事方式，最后可能就是因为信任你而付费。\n\n代价是它需要持续投入。本人要出镜，内容要有观点，脚本、拍摄和剪辑也要跟上。即使积累了信任，自然流量的规模仍会波动。\n\
    \n我们接触到越来越多已经有个人影响力的客户，开始考虑付费投放。他们有内容和信任基础，还希望获客数量能更贴近公司的经营安排。前面的 AI 项目，就是这种组合的一个例子。\n\
    \n### 蓝 V 自然流\n\n企业认证账号也会有自然流量。我们也陪跑过一家本地财税公司，用多个企业号持续覆盖本地需求和搜索内容，同时配置少量账号做付费投放。\n\
    \n它能做起来，与本地化业务、已有服务基础和长期内容投入有关。不能只看到别人铺了很多账号，就认为多注册几个号一定有效。账号、人员和更新量都需要算成本。\n\n\
    如果你还在验证小红书这个渠道，自然流可以作为一种起步方式。但要给自己设置验证目标，别把“每天都在发”当成项目在前进。\n\n### 聚光和千帆投放\n\n\
    在我们这些项目里，聚光主要用来测试咨询、线索获取，千帆则出现在商品成交入口的测试里。具体选择，要看业务能使用的产品能力、推广目标和账户条件。\n\n付费的优势，是当内容和转化逐渐稳定后，可以围绕预算、成本和获客量做调节。销售接不住时少投一些，有余力时再扩大测试。\n\
    \n我在现场把它比喻成“水龙头”。这个比喻说的是可调节性，不是说扩大预算，客户就一定等比例增加。竞争、人群、素材衰减和销售承接，都会影响放量后的实际结果。\n\
    \n我会用行业关键词、客户需求和购买时会问的问题去搜，观察有没有持续投放的内容，评论里有没有问价格、问地点、问服务的真实需求，以及这些账号如何介绍产品。\n\
    \n这些信息能帮助我们形成测试假设，但外部页面看不到同行完整的广告成本、成交和利润。持续投放是一个值得研究的信号，并不能单独证明对方一定赚钱。\n\n还有一个经常被误判的地方：广告笔记的点赞收藏少，不等于没效果。有明确需求的人，可能看到服务介绍就直接点咨询，根本不会先点赞、再收藏、再留言。\n\
    \n所以研究付费账号时，不要只用做内容号的标准去判断它。前端互动能看到一部分情况，真正的获客和经营效果还得回到后台与销售记录。\n\n### 团队与预算要支持你完成测试\n\
    \n起步不一定需要很大的团队。一个账号，也可以开始验证。更重要的是，谁负责持续产出内容，谁看投放数据，谁及时接咨询，出了问题谁来调整。\n\n预算则要结合预计成本和需要的样本量。假设预计一条客资成本在\
    \ 50 至 150 元，300 元一天可能拿到几个样本；如果预计成本已经到 200 至 500 元，同样的预算可能一天只能拿到一两个，判断速度就很慢。\n\
    \n这只是说明预算和样本的关系，不是统一的起投标准。你还要考虑成交周期，以及自己能承受多长时间的测试。开始前就明确可承受的测试投入和复盘节点，比投出去以后每天焦虑更有用。\n\
    \n## 五、开始投放前把生意的账算清楚\n\n### 把平台数据和销售数据接起来\n\n一旦开始持续付费，我就会要求团队每天更新数据。除了广告消耗和点击表现，还要记录进线、开口、留资、实际加微，以及后面的成交。\n\
    \n在我们这些项目的常用统计口径里，进线是用户进入咨询页面，开口是产生进一步互动，留资是完成相应的联系方式动作。具体指标定义要以账户后台为准；平台留资之后，是否实际加上微信、是否有真实需求，还要通过私域记录核对。\n\
    \n如果业务需要到店、预约或试听，就把这些环节也加进去。这样你才能知道，用户到底在哪一步流失了。\n\n流量端和销售端还要对“有效客资”有同一套定义。例如，需求是否属于服务范围，地域是否能承接，联系方式是否有效。否则前端说来了很多客户，销售说一个都不好，最后只能互相讲感觉。\n\
    \n### 至少算清楚三层成本\n\n平台留资成本，等于广告消耗除以平台留资数。它能帮助判断投放表现，但只是链路中的一个位置。\n\n有效客资成本，等于广告消耗除以确认有效的客资数。它更接近销售真正能够跟进的人群。\n\
    \n成交获客成本，等于对应广告消耗除以对应批次的新成交客户数。这一步要把成交周期算进去，不能拿本月广告费，随意对应所有老客户和新客户的回款。\n\n成交率也要看同一批次。\n\
    \n这一批客资后来成交多少人，才能说明这批流量和销售跟进的实际效果。如果产品需要较长决策时间，刚进来的客户尚未成交，不等于他们最终不会购买。\n\n###\
    \ 留资成本下降不一定意味着生意变好\n\n举一个纯计算示例：一种投法拿到 100 条有效客资，每条 100 元，成交率 10%，广告消耗 1 万元，成交\
    \ 10 人，单个成交客户的广告成本是 1000 元。\n\n另一种投法的有效客资单价是 150 元，但成交率达到 20%。同样 100 条有效客资，广告消耗\
    \ 1.5 万元，成交 20 人，单个成交客户的广告成本反而降到 750 元。\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_16_0.png)\n\
    \n所以我更关心的是，一条客资进入销售环节以后发生了什么，而不是单独追求后台某个数字最低。\n\n情感咨询项目的变化也说明了这一点。调整内容方向后，我们同时看到了留资成本和成交率的改善，才有继续放量的依据。\n\
    \n### 营收和投产之外还要看利润\n\n在交流中，大家经常说“投产 1：3”或“ROI 1：3”，但这类说法可能只是指广告投入与销售收入的比例。拿到这样的数字，先问清楚统计口径。\n\
    \n实际算账时，还要扣退款、产品或服务的交付成本、销售提成、运营人力、外包服务费，以及需要分摊的固定支出。低价陪跑项目即使前端投产看起来不错，也可能被后端的人力消耗拖住。\n\
    \n如果已有稳定数据，可以从目标反推预算：希望增加多少成交，需要多少有效客资，按目前的客资成本要投入多少，再核对销售和交付是否接得住。\n\n这个测算是帮助你做决定的假设，不是未来收入的承诺。产品、人群或渠道变了，原来的成交率也需要重新验证。\n\
    \n## 六、一个蓝 V 项目如何开始测试\n\n### 先完成准入和承接准备\n\n正式投入前，先确认业务是否符合平台当前的推广要求，营业执照、类目、资质和实际服务是否匹配，是否涉及保证金，以及账户开通、广告充值等要求。\n\
    \n这些条件会变化，应该按具体行业和账户向官方确认。不要把别人的历史开户经验直接套在自己的业务上，也不要把保证金、待消耗广告余额和已经发生的费用混在一起算。\n"
  mdcn: "\n## 1–2 个人、1–2 个蓝 V 账号，如何做到单月 50–100 万营收？我们的小红书付费流获客实战复盘\n\n261008 副业 SC\
    \ 精华  \n整理：公众号“懒人搜索”，懒人专属群精选  \n懒人微信：lazyhelper1\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_0_0.png)\n\
    \n> **小懒判断**｜想从小红书免费流转付费投放的老板细读：考研自习室 4 个月 260 万、情感咨询留资 308 元压到 150 元，聚光测试—放量—复盘全流程都在。最值得抄的是三层成本算法——150\
    \ 元客资 20% 成交率比 100 元 10% 划算，别只盯留资单价。坑在口径：260 万是免费付费一起做的，除以广告费当 ROI 必错。没销售承接先别碰。\n\
    \n做小红书获客这几年，我听过很多人说同一句话：“我知道可以投广告，但我不敢投。先拿一万块钱出来，到底能换回什么？”\n\n这个顾虑很真实。免费流至少看起来不用先掏钱，而付费流一开始就要面对预算、成本和未知的结果。我自己也是从免费流做起的，直到客户的生意需要稳定获客，我们才真正开始学聚光、做测试，一点点把付费流跑通。\n\
    \n现在再看，我觉得付费流最有价值的地方，是让获客这件事更容易测量和调节。你能逐渐知道，一个客户大概要花多少钱，一天能接住多少咨询，以及多投入一笔预算，后端有没有能力把它变成收入。\n\
    \n但这有前提。产品要有人买，销售要接得住，交付和利润也要算得过来。付费流可以帮助你验证生意、放大生意，也会把原来藏在业务里的问题更快暴露出来。这篇文章，我想把我们的转型经历、几个项目里的得失，以及一套实际使用的投放方法讲清楚。这里的“客资”，指潜在客户线索；“销转”，指销售转化。案例中的数字对应各自的项目和统计阶段，不能直接当成另一个行业的收益预期。\n\
    \n## 一、我们为什么从免费流转向付费流\n\n### 从第一篇 80 元的笔记开始\n\n我和我的老公 Jasper 原来都在互联网行业工作，后来成了同事，也一起经历过业务从高速增长到快速下滑的过程。到了\
    \ 2024 年，我们开始认真想：如果离开公司，能靠什么能力做一门自己的生意？\n\n那段时间我很焦虑，就去生财有术刷精华帖，把近一年的内容集中看了一遍。我本来就是做内容和运营出身的，日常也一直使用小红书，于是选了自己更熟悉的平台。\n\
    \n先跟着谢无敌学习小红书获客的基础知识，开始实操后，又加入珍妮的社群，把她的帖子一篇篇看完。对我们来说，前一阶段补的是入门基础，后一阶段补的是具体怎么做内容、怎么拆解有效的笔记。后来很多方法，都是在这个基础上，通过真实项目慢慢长出来的。\n\
    \n2024 年 3 月，我接到了第一个代运营客户，是一个想吸引 HR 人群的灵活用工平台。\n\n那时我的报价是 80 元一篇笔记，一个月写 12 篇，月收入也就九百多元。\n\
    \n账号两周涨粉过千，后来给客户导入了大约 900 个微信好友。但项目没有一直做下去，因为后端产品和转化还没有准备好。这是我们很早就碰到的一课：前端拿到流量，和后端做成生意，中间还有很长一段路。\n\
    \n### 2024 年 3 月，第一个代运营客户\n\n- 纯免费流\n- 来源：运营群里的兼职信息\n- 产品：用友软件旗下灵活用工平台\n- 目标：将精准\
    \ HR 粉引流至微信私域\n- 报价：80 元/篇笔记\n- 两周涨粉过千\n- 3 篇互动数 3000+ 爆款笔记\n- 小红书群 1700 人，微信\
    \ 900 人\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_2_0.png)\n\n24 年 8 月，我们正式离职创业，又接到了第一位陪跑客户。一位心理咨询老师看了我的公众号文章，先付了\
    \ 199 元做一对一分析。我给她的行业做了调研，聊完后，她直接问我陪跑多少钱。那时我们连定价都没完全想好，最后从两个月 3000 元开始做。\n\n###\
    \ 2024 年 8 月，第一个陪跑客户\n\n- 第一个陪跑客户，疗愈赛道\n- 公众号文章 + 一次打法分析的 1v1 咨询促成成交\n- 3000 元，2\
    \ 个月陪跑\n- 我不仅能自己做（代运营），还能教别人做（陪跑）\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_2_1.png)\n\
    \n我们的业务就是这样一点点形成的。先自己做内容，再做代运营，后来逐渐增加培训和企业陪跑。\n\n### 真正推动转型的是客户的经营压力\n\n最开始免费流很好做，我们也做出过不错的结果。但到了\
    \ 2024 年下半年，账号出现引流违规、流量波动的情况，让我们越来越不踏实。\n\n如果只是自己做一个副业账号，今天没流量，可能还能等明天。可客户已经租了场地、招了销售，每个月都有固定支出，获客突然停下来，影响的就是整门生意。\n\
    \n2024 年 12 月前后，我们接了一个长沙考研自习室项目。客户有两百多个床位，提供学习空间和住宿。销售要有人咨询，床位要有人入住，不能把所有希望都压在免费账号上。\n\
    \n所以我们给他的方案是两个免费流账号，加一个企业号做付费投放。客户信任我们，愿意拿出预算测试。我们也就在这个项目里，一边学聚光，一边上素材、看数据，完成了从免费流到付费流的过渡。\n\
    \n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_3_0.png)\n\n转型最直接的原因，是我们开始承担一门真实生意对获客稳定性的要求。\n\
    \n## 二、四个项目让我们重新理解获客\n\n### 考研自习室让我们看到免费和付费可以一起做\n\n考研自习室这个项目，大约一个星期就测到了比较合适的素材和获客成本。之后持续投放，四个月左右，床位基本招满。\n\
    \n当时汇总的项目结果是 3000 多条精准线索、1600 多人加微信、200 多人成交，四个月总营收超过 260 万元。\n\n![](img/34a459f0fa7d7b5d1f7c5ba5fd2b450f_4_0.png)\n\
    \n这里有个口径必须讲清楚：这组数字是整个项目的结果。免费流和付费流在当时都贡献了相当一部分业绩，不能把全部营收除以广告费，就说成付费广告单独创造的回报。\n\
    \n这个案例对我们最大的影响，是看到了经营上的主动性。有效素材测出来以后，可以继续投入预算获取客户，销售和场地安排也就有了更明确的依据。\n\n从 2025\
    \ 年开始，我们做新项目时，会更认真地评估企业号投放。免费流有机会就用，但涉及持续获客的业务，我们希望至少有一条能够测试、能够调节的付费路径。\n\n###\
    \ 情感咨询让我们学会同时看成本和成交率\n\n情感咨询这个项目并没有一开始就成功。第一个月，我们参考了同行常见的内容方向去做，结果很差：广告消耗约 1.3\
    \ 万元，留资 43 人，只成交了 4 人。单条留资成本约 308 元，成交率约 9.3%，单个成交客户的广告成本到了三千多元。\n\n| 月份 | 总消耗\
