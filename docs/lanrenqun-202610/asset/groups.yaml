    # # 香港餐饮业怎么了？


    261026 猫哥星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/c6d2dbc4f2d0618123aef4a745ae201a_0_0.png)


    > > 小懒判断 | 适合关心香港经济、餐饮零售生意逻辑的读者；不适合只想看“港餐崩了”情绪爽文的人。最值得关注的是那笔账——租金占营收 25%-35%、业主宁可空置不降租，服务差不是态度问题是成本结构问题；坑在于把两餸饭疯涨当机会，2025
    下半年已在洗牌。


    最近，社交平台充斥着一种香港餐饮一夜之间垮了的氛围。很多传统老牌店或者收缩或者闭店，视频发出来，互联网上就哀嚎一片。


    什么没落了、被深圳抢了生意、香港人自己都不在香港吃饭了等等，甚至有人冷笑，说当初骂我们蝗虫，现在求我们来消费。


    我是从小看 TVB 剧长大的，也因此对港餐还是比较有情怀。前几次去香港体验确实一次不如一次，但我认为核心原因是我们自己城市商业配套不断快速发展，差距缩小甚至反超了导致。


    要说香港餐饮出现倒闭潮，全面凉凉，我觉得还是言过其实。


    2025 年全港食肆总收益还有 1096 亿港元，按金额算，比 2024 年微升了 0.2%。就全'
