  - '[PAGE 9]


    然不好敲字，但是把中文模型串起来自会浮现。比如友跟D连着，D跟道连着，道跟义连着，义跟信连着，信跟啥连着？


    这么一路串下来，就能显露出是啥回事了。只要抓住了底层原理，很多东西自己就能推导出来了。


    回到《五行八识图》呀，回到田字格。


    ![](img/e83916661627bb1f0c5a6e536f5106f6_9_0.png)


    横竖线叫做——四方。属于静态的定位，就是还没运动呢。红线是啥来着？是第一运动，也就是起到带动作用的那个力。


    黑线是啥？是红线带动出来的呀！道家换佛家语境：红线——性（隐藏维度）。黑线——相（显现维度）。至于为啥是红线带动黑线，天地二力交互生万物对吧？那么好了，运动起来啥样？


    ![](img/e83916661627bb1f0c5a6e536f5106f6_9_1.png)


    这么一旋转，要右旋呀，因为这属于地道。'
  - '[PAGE 10]


    <!-- no content -->'
  - '[PAGE 11]


    子良心那就是真的了..又好比啥呢？人在社交当中，只有“会舍”才能“有得”呀，这就是二阶人性。


    而一阶人性趋近于动物性，只顾眼前利益，貌似对个体有好处，但是从更大范畴来看就没好处了。


    那么好了：义和友有啥关系？重点来了呀.


    ![](img/e83916661627bb1f0c5a6e536f5106f6_11_0.png)


    红色黑色一对应，这不就明显了吗？红色自转，带动出黑色自转，然后黑色再带动红色，就这么一直旋转。


    区别：义——双向的、循环的利——单向的、线性的。为啥老子在《道德经》”中讲“义“呀？因为这就是在反人性呢，人性都是线性单核思维，导致人类社会乱糟糟一团。例如：儒家的内核就是仁义嘛，行的是地道。


    比如君王对我啥样，我就要对君王啥样，这都是双向对等的。只不过后来搞成了儒教，变成了君王虐我千百遍，我待君王如初恋。其它例子自行推导..大白话说呢？就是人在社交关系处理中，要学会“有来有回”才行。这就发展出了——礼！


    但是呢，这玩意不明白二阶人性的原理也白扯，就会变成老子说的流于表面虚伪了..比如民间随礼，最后变成吃拿卡要了，拼'
  - '[PAGE 12]


    <!-- no content -->'
  - '[PAGE 13]


    例如：锋利一词，锋是因为金属之间有一个传导作用，把利益都集中于一点了。为啥朋对应利？因为小势力传导进大势力呀. 例如：法家就是重利的，法家人物就是那个刀锋了呀，非常锋利好用，但也最容易折损。


    什么叫义利之辩？先秦老鸡啄一顿琐磨，咕呀呀..要与少数人达成“义和”才行，这才能持久发展，慢慢就发展出了礼、信等行为。而和多数人达成利和”才行，因为你也义和不了，讲理是没用的，讲礼更没用，只能裹挟进来作为基本盘。道家呢？老子：有之以为利，无之以为用。


    道家贵无，无就是能穿透这一切，不会幻以为真。义和利都属于有，都是提供结构便利的，道家不喜欢被绑架，所以道家出谋士嘛。


    总之：五行八识表达的都是运力，道家看气力流转，佛家看心力流转，在最底层都是一模一样的。然后再把各类形态画成中文运力，所以看中文就是看万物。不仅会自动形成一套系统思维，而且看事物就简化直接了！


