    # 你适不适合干“大事”？


    261010 圆方你怎么看啊


    整理：公众号懒人搜索，懒人专属群精选


    懒人微信：lazyhelper1


    ![](img/61ff313e0ffc17b56b1dd912484e058e_0_0.png)


    > 小懒判断 | 适合做管理、谈合作、处理纠纷的人；不适合只想听"谁对谁错"的。最值得关注：判断是否适合干大事的一个具体测试——遇到争议先问参与方有哪九方、各自要什么，而不是先站队。坑在于文章以华为尊界之争为例，付费墙后第
    03 节才有正题。


    # 01


    这两天圆方写了两篇儿有点儿争议的文章


    一篇是写华为的尊界“断了”，华为怎么办？


    一篇是写中美的中国 GDP 超美国？


    文章内容吧，反正还是圆方的一些思考和观察，但是留言区还是蛮有意思的，大家站在各自的立场有了许多的争论。


    而这些争论呢又激发了圆方不小的思考。


    所以今天呢，圆方计划写一篇有点儿深度的剖析，来帮助大家研判一个可能和你命运有关的问题。


    大家好，我是圆方，今天我们一起聊聊你适不适合干“大事”？


    # 02'
  - '[PAGE 1]


    # 一个人适不适合干大事


    # 其实观察的维度很多


    整体来讲，至少有四个维度的角度需要去审视。


    # 首先，他想不想要去干大事：


    如果一个人本身就不想做大事儿，或者说没有这样的自驱力和愿望，那么即便很好的资源其实也不会怎么成大事。


    > （不过从圆方的观察而言，真正要做大事的人，命运会主动或被动地让他走上这条道路）


    # 其次，他有没有机会干大事


    不是所有人都能赶上做大事的机会的，基本上每一波大的机遇周期大概是 30 年，而往往只有前十年有机会干大事。


    在这个时候出生的年代往往就已经决定了很多问题，太早或者太晚都不行。


    # 然后，他有没有资源干大事


    做大事也需要大的资源，这种资源不一定是祖辈的阴德，也可以是同学师长的扶持，又或者很早到了关键的位置，而这些都是获得资源的必要条件。


    而最后也是我们今天要论证的关键你还他有没有“能力”干大事 03 那怎么判断一个人有没有“能力”干大事呢？这个维度有非常多，今天就说其中的一点。


    因为下面的内容比较敏感，又涉及到我前'
  - '[PAGE 2]


    天聊的这个敏感的话题，所以象征性地收6 个豆隔离一下（毕竟大多数后台开骂的，不会花钱来追着骂..）


    有兴趣的小伙伴可以选择阅读。


    还没有看前天的这篇“尊界”文章的可以先回去复习一下，之后再进行讨论。


    # 复习完之后


    大家可以思考三个问题：


    +   1. 在跟懂车帝的博弈中，你觉得谁是正义的一方？

    +   2. 你如何看待尊界之后全面删除清理全网的负面舆情？

    +   3. 你认为尊界的产品和服务在未来会更好还是会更差？


    大家思考一下自己的答案，然后来做一个选择题。


    # 博弈谁正义多选


    懂车帝


    尊界


    # 控评对不对？单选


    对


    不对


    # 会不会更好？单选


    会好'
  - '[PAGE 3]


    # 会不好


    # 投票


    如果大家所有的问题都能够直接得出来答案都有一个明确的是非对错那么圆方很遗憾地告诉你现阶段的你可能并不适合于“大事”


    # 04


    我们先来一起预习一下教员最出名的文章《中国社会各阶层分析》这篇文章1925年12月1日发表，收录于《毛泽东选集》第一卷，是毛选第一篇文章。


    开篇原文如下


    > > 谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。


    > > 中国过去一切革命斗争成效甚少，其基本原因就是因为不能团结真正的朋友，以攻击真正的敌人。革命党是群众的向导，在革命中未有革命党领错了路而革命不失败的。


    > > 我们的革命要有不领错路和一定成功的把握，不可不注意团结我们的真正的朋友，以攻击我们的真正的敌人。


    > > 我们要分辨真正的敌友，不可不将中国社会各阶级的经济地位及其对于革命的态度，作一个大概的分析。


    > > 所以在华为和懂车帝的这次博弈当中，到底谁是我们的朋友，谁是我们的敌人呢？


    # 05'
  - '[PAGE 4]


    想要弄清楚这个问题，至少要想清楚三层的逻辑。


    在这次博弈当中，到底有多少个参与方。

    而每一个参与方，又能够分成多少派别。

    你的利益在哪里，你又应该要去支持谁？


    我们一层一层来分析


    先说在这次博弈当中，到底有多少个参与方？


    很多人会觉得，在这次博弈中，不就是懂车帝跟尊界在那里撕吗？


    其实不是，即便不考虑消费者，参与博弈走向的至少有九方。


    第一类，华为鸿蒙智行体系，它最在乎的，是别让这次争议把尊界的高端定位和鸿蒙智行整套技术口碑一起拖下水。华为要保住的，是品牌溢价、技术信任和高端形象。


    第二类，江淮汽车及尊界项目，它要的是别让这次风波影响订单、交付和后续销量。尊界项目刚往上走，最怕的就是把整个项目节奏打乱。


    第三类，安徽政府及相关地方产业部门，它是这个项目能不能继续在本地做大，带动就业、税收和产业链。尊界如果受挫，影响的不只是一个车型，还有地方产业布局的预期。


    第四类，国家监管及行业主管部门，它要的是把事情查清楚、标准说清楚、责任分清楚。既不能让消费者觉得没人管，也不'
  - '[PAGE 5]


    能让整个智能汽车行业因为一场争议变得更乱。


    第五类，其他汽车厂，外资汽车厂、合资体系、自主品牌和新势力都在里面，表面上是在看热闹，实际上都在盯着这次事件会怎么定性。因为这不只是尊界一家车的事，还关系到以后行业怎么测、怎么评、怎么处理类似争议。


    第六类，懂车帝与字节跳动平台体系，它要保住的是测评公信力、平台流量和商业价值。既想让内容有影响力，又不想因为这次刹车事件，把自己卷进太大的舆论和监管风险里。


    第七类，车评人、自媒体与舆论渠道，它们最在意的是流量、立场和饭碗。有人想蹭到热度，有人想维持专业形象，也有人要顾及商业合作，所以每个人说话的角度都不太一样。


    第八类，资本市场与投资人，它们没那么关心谁吵赢了，更关心这次风波会不会影响尊界后续销量、品牌溢价和市场预期。一旦影响扩散，最后先反映出来的，往往就是估值和情绪。


    第九类，供应链企业、经销商与售后服务网络，它们最关心的是订单会不会掉、车还卖不卖得动、售后压力会不会变大。因为对它们来说，这件事不是网上吵架，而是真金白银的生意会不会受影响。


    当你带入这样一个视角的时候，你就会发现这个世界不是非黑即白的了。'
  - '[PAGE 6]


    ![](img/61ff313e0ffc17b56b1dd912484e058e_6_0.png)


    06


    # 我们再向下拆一层


    而每一个参与方，又能够分成多少派别。


    派系太多哈，我们就拆开华为、字节跟苹果。


    华为内部对造车一直有不同意见。


    支持造车的一派看重终端业务增量，希望把智能座舱、智驾和渠道能力直接变成整车销量，掌握用户关系与品牌溢价。


    反对造车的一派担心与车企客户争利，影响通信、计算和零部件合作，也担心重资产投入拉低财务安全。


    支持余承东路线的人愿意用高调发布、强渠道和强营销快速打开高端市场，能接受舆论争议，认为声量本身就是竞争力。


    反对余承东路线的人更重视组织边界、合作方感受和合规风险，倾向把华为放在技术供应商位置，减少直接面向消费者。'
  - '[PAGE 7]


    尊界舆情出来后，前一派希望借关注度巩固高端认知，后一派担心争议波及整个鸿蒙智行。


    两派都想要华为赢，赢的方式和代价不同。


    （而且考虑到最近长公主刚刚上位，其内部的博弈可能也非常复杂。）


    # 07


    字节内部其实对懂车帝也有分歧。


    支持懂车帝的一派看重用户规模、行业话语权和广告收入，认为测评业务能补足汽车内容生态。


    反对懂车帝的一派担心测评争议带来监管压力，破坏与车企关系，甚至牵连其他内容业务。


    支持懂车帝的人里面，主张公允立场的一派要求测试标准透明、数据可追溯、结论可复核，用长期可信度换取商业空间。


    倾向立场的一派更在意平台议价权和流量收益，在选题、排序、标题和发布节奏上会照顾合作方或竞争格局。


    尊界事件中，公允派担心公信力受损，倾向派关心商业谈判是否占优。


    两派都谈客观，客观的定义和用途不同。


    # 08


    江淮汽车相关方同样有各自打算。


    省里主要领导关注项目对本地产业、税收、就业和区域位次的带动，希望尊界尽快形'
  - '[PAGE 8]


    成规模，维护安徽汽车产业形象。


    国资委关注国有资本回报、投资风险、合规程序和资产保值，对持续亏损和过度依赖合作方保持警惕。


    江淮集团关注自身在合作中的话语权、产能利用率、财报表现和品牌提升，既想借华为提升产品力，又担心核心能力外移。


    尊界项目部关注交付节点、成本控制、质量口碑和团队稳定，项目成败直接关系部门资源和人员前途。


    舆情处理上，省里希望快速平息，国资委要求程序稳妥，江淮担心影响销量与股价，项目部希望清理负面后稳住订单。


    各方都希望项目成，承担风险的位置不同，能接受的让步也不同。


    09


    不知道你发现没有，有些派系看起来利益是冲突的，但是不同派系中间不同群体利益可能反而是相同的。


    这也就是教员在开篇所说的


    谁是我们的敌人？谁是我们的朋友？


    这个问题是革命的首要问题。


    所以，如果我们看待一个问题或者在做任何判断的时候。


    如果只是出于一种朴素的道德观点，和直观感觉来下决策或者站边，那么注定是很难以成就一番大事业的。'
  - '[PAGE 9]


    因为任何一件大事，决策环境往往信息都

    是不全的，而且时间跨度长，参与方多。


    如果你就是凭直觉给出一个判断，虽然这

    种方式很省力也很舒服。


    但是很多问题其实是想不清楚的，比如事

    业推进需要衡量资源从哪里来？


    代价由谁承担？


    收益如何分配？


    风险怎么兜住？


    退路留在哪里？


    只凭一腔义愤，容易把复杂利益压缩成善

    恶两分。


    善恶两分之后，人就不愿意再听对方诉求，

    也不愿意承认自己一方的问题。


    结果往往把可以争取的人推远，把可以交

    易的事堵死。


    与此同时，干大事往往要处理长周期。


    # 要懂得留余


    今天正确的话，明天可能变成负担。


    今天讨厌的人，后天可能成为盟友。


    今天让出去的利益，未来可能换回更大空

    间。


    道德可以定出底线，不能代替策略。直觉

    可以提醒风险，不能代替分析。'
  - '[PAGE 10]


    一个人如果每件事都先问谁对谁错，再决定站哪边，他会得到道德满足，失去操作空间。


    他会不断寻找干净立场，现实里干净立场很少。


    他会在意一时评价，忽略最终结果。


    （比如过去五年俄乌战争，如果我们没有战略定力的话…）


    所以成大事的人要能忍受模糊，要能跟不同的人打交道，要能在不完美中选择可行路径，要能把朋友搞的多多的，把敌人搞的少少的..


    11


    当然，我们还是要看到，利益分析不等于放弃原则。


    原则是边界，利益是路径。边界守住，路径可以弯曲。


    很多人把边界当路径，每一步都要笔直，结果走不到终点。


    大事需要团结，团结需要妥协，妥协需要让对方看到好处。


    只谈对错，对方没有空间，自己也没有条件。


    舆论场可以站队，组织场要处理人员、资源、时序、后手。认可来得快，去得也快。资源一旦耗光，正确也难持续。


    能够干大事的人，心里有是非，手上算利'
  - '[PAGE 11]


    弊，知道什么能让，什么不能让；知道跟谁在什么条件下合作，知道什么时候该沉默，什么时候该出手。


    这样的人看似不够“清楚”，却更可能把事做坏竟只有小孩子才论对错成年人只看利弊能把边界守住，又能把路走通，或许才是真正“干大事”的能力。


    希望小伙伴们帮忙点个赞、转发一下，也让更多朋友一起想想：


    当一个问题没有标准答案的时候，你到底是在寻找正确，还是在寻找把事情做成的方法？


    祝好


    来自尝试 AI 重构组织的圆方


    在这个 AI 能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的护城河，只剩下“信息过滤”的效率与“认知系统”的维度。


    圈子已稳定运行 7 年。我们每天利用 Python 爬虫与大模型算力，过滤全网最顶级的政经内参和搞钱风向标，做你最冷酷的“外部大脑”。


    如果你认同这种“重塑认知防线”的极客主'
