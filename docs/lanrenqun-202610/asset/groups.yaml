    *⑤：中证1000，日线下行趋势。老铁们，中证1000虽然还没有做周线底背离，但是因为他的周线仍然是双死叉结构，所以中长线还有下探空间，继续看调整为主吧。保持一点耐心吧。


    *⑥：上证50；日线下行趋势。老铁们，上证50终于出现周线级别底背离信号，周线双死叉，不会这么快反转的。即使日线上面出现反弹反抽，也是不看反转，刚开始出现周线底背离则还会打压盘面，月线转为下行趋势，大家继续保持耐心定力。等待调整完毕。上证50的下跌空间应该不多，但是会被捆着洗盘。


    总结：打一颗星的日线底背离，打二颗星的是周线底背离。


    老铁们，经过这几个宽基指数的分析，我们发现沪深300，中证500，上证50，北证50是在做周线底背离，因为是刚开始做周线底背离，那么还会继续打压盘面，中长线没有调整完毕。同样的科创50，中证1000因为周线双死叉大概率也会继续打压洗盘出现周线底背离的可能。那么10月份会进入无比煎熬吐血的阶段。所以大概率调整没有结束，中间可以出现反弹反抽，但是一时半会儿很难出现反转。保持耐心。


    至于短线上，下周他们可能都会迎来一个小反弹，因为他们的60分钟走势是出现了'
