    少，无非就是两个原因，一是员工总数下降，二是人均薪酬下降。


    我们一项一项看。公司在 2025 年，员工人数从 3572 人下降到 3267 人，减少了 305 人。人均薪酬方面，我们计算出 2024 年员工平均年薪
    34 万元，按同样方法计算，2025 年员工平均年薪 34.69 万元。


    也就是说，公司对管理费用中职工薪酬的控制，主要依靠裁员，人均薪酬反而是略有增长。办公费降低了近一千万，其背后是公司提管理、降费用计划的推进，根据公开资料，公司通过全面预算管理和动态预算授权，持续推进降本增效、强化执行与考核机制，提高人效。


    所以这是公司练内功的一年，开始收缰了，规范内部行为，什么手松一点啊，睁只眼闭只眼啊，都在被限制。


    不过也要看到，管理费用的控制主力仍是缩减冗员，而裁员是有限度的。


    下面是公司 2026 上半年的情况（单位：万元）：


