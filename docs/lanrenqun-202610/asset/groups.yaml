  - '[PAGE 7]


    请以短篇小说的篇幅和节奏为约束，优化以下权谋情节。


    不要无限扩张势力和支线。优先围绕现有主要人物与利益相关方，形成一段完整的博弈链。


    先列出各方：真实目标、表面立场、掌握筹码、已知信息、底线和限制。

    再设计：


    +   1. 第一方为何出招、能动用什么资源；

    +   2. 对手根据当时掌握的信息会如何判断和应对；

    +   3. 主角如何利用已有证据、规则、利益关系或信息差调整局势；

    +   4. 关键计谋的代价与失败风险；

    +   5. 最终谁得到什么、失去什么，以及结局为何成立。


    硬性约束：


    +   - 不允许主角无来源地预知全部计划。

    +   - 不允许反派主动泄露核心秘密只为方便主角取胜。

    +   - 不允许临时出现关键证据或从未铺垫的救场人物。

    +   - 至少为关键翻转安排可在前文看见、事后回想合理的线索。

    +   - 权谋服务于短篇主线与情绪高潮，不能因复杂而牺牲可读性。


    输出格式：各方利益表 → 博弈步骤表 → 需要补写的铺垫 → 调整后的分场景细纲。


    题材与目标字数：【填写】

    小说大纲：【粘贴】

    原细纲：【粘贴】

    人物和势力设定：【粘贴】


    # ## 六、对标优秀短篇：学习方法，不照搬情节


    截图中的创作经验有一条很实用：作者会研究近期优秀稿件，分析题材、导语、情绪和故事结构，再把发现补充进自己的创作规则。放到短篇细纲上，可以拆解同题材作品的开篇钩子、冲突升级、反转位置、信息释放和结局回收。'
  - '[PAGE 8]


    建议选题材相近、篇幅相当、面向类似读者的作品或摘要。观察它们怎么实现某种效果，而不是照抄其人物与桥段；市场热点可参考，但不能用“追热点”替代逻辑。


    # 提示词 6：短篇对标拆解


    请拆解以下优秀短篇小说或章节摘要的结构性写法，重点分析：


    +   1. 开篇如何快速建立人物处境、矛盾和阅读期待？

    +   2. 核心冲突如何升级，哪些场景真正改变了局势？

    +   3. 情绪节奏如何安排，哪里压抑、哪里释放、哪里反转？

    +   4. 反派或对手的行为为什么成立？

    +   5. 重要信息与伏笔在何处释放、何处回收？

    +   6. 结局如何回应开篇的核心问题？


    请输出可迁移的“创作规则”，而不是复述剧情。


    然后对照我的细纲，指出最值得改进的三个位置，为每个位置提出原创修改方案。


    不得直接复制对标作品中的人物、标志性桥段、独特表达或情节组合。


    对标材料：【粘贴】

    我的小说大纲：【粘贴】

    我的细纲：【粘贴】


    # 七、把修改经验沉淀成自己的细纲规则


    不要每篇稿子都从头摸索。可以建一个简单的“细纲问题记录表”，记下：原问题—具体场景—修改规则—修改后效果。如果某种调整反复有效，就把它加入常用提示词；如果某条规则让剧情变僵硬，就删掉或改写。


    尤其注意区分：有些问题是提示词不够明确，有些是大纲结构薄弱，有些则是正文执行没达到细纲预期。不能把所有问题都归结为“AI 没调教好”。'
