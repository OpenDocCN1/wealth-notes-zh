    再往后，还会开始留意卡号。比如我这张尾号四个 9 的卡，单独拿出来就很有收藏的感觉。'
  - '[PAGE 9]


    ![](img/ba3fedc17e08378b605776cdb48ef9fb_9_0.png)


    这也是开卡内容有意思的地方。有人为了解决支付问题，有人喜欢卡面，也有人对靓号感兴趣。看到别人晒出来，自己也会想去了解怎么申请。


    对我的账号来说，这就有了很自然的内容：晒一张自己喜欢的卡，讲讲实际用途，再把申请过程写清楚。感兴趣的人可以接着看教程，需要帮助的再到群里交流。碰到有推荐活动的卡，符合条件的人完成开卡和使用，也就能带来拉新收入。


    当然，能订阅 AI 并不意味着需要开一大堆卡。实用是一部分，收藏的乐趣是另一部分。我自己两种都有，所以这个方向才一直有东西愿意研究、愿意写。


    开卡做下去，手机号、地址、税号也绕不'
  - '[PAGE 10]


    # 开


    做着做着，内容就不只是奖励了。


    想开一张卡、办一个海外账户，常常又要先准备手机号、地址或者其他材料。前面的基础没做好，后面看到喜欢的卡，或者有适合自己的活动，也不一定能马上参与。


    我自己做海外地址和信用卡那段时间，筛过300多个地址，跑过视频公证，也经历过预审批失败、补材料，最后才获批。


    这些东西写在一份教程里，可能就是几步，真做的时候每一步都得处理。把它们记下来，就能写成比一张奖励截图更完整的内容。


    后来我有一篇海外银行实操长文，浏览已经到了26万多。它带来的反馈，让我更愿意继续写这类东西。


