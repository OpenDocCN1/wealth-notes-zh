  - "[PAGE 0]\n\n# # 卢拉翻盘的根源\n\n261028 猫哥的世界  \n整理：公众号懒人搜索，懒人专属群精选  \n懒人微信：lazyhelper1\n\
    \n![](img/e31958a7cd9d209c094f8dbfec41b652_0_0.png)\n\n> > **小懒判断 |** 想搞懂选举逻辑和中国外贸大势的人适合看，想看巴西时政八卦的不适合。最值得关注的是卢拉第二轮“几乎只谈钱”的策略转向，以及弃权率降\
    \ 2%就多出 400 万张票这个动员杠杆。坑在于卢拉赢了总统输了国会，左翼联盟众议院才 100 多席，承诺的福利大概率落不了地，别对中巴合作有突破性期待。\n\
    \n# ## 卢拉翻盘的根源\n\n10 月 25 日，巴西举行了大选第二轮投票，卢拉在第一轮落后的情况下，在几乎所有人都不看好的情况下，上演了绝地大翻盘。\n\
    \n1985 年巴西恢复选举以来，从来没有一位候选人能在第一轮落后的情况下，第二轮实现翻盘。\n\n卢拉是第一个做到的。虽然媒体、自媒体们都强调卢拉是落后的一方，但要注意，卢拉的民调并非一直落后，最后来个突然翻盘。\n\
    \n巴西所有主流民调都显示，卢拉和极右翼对手小博索纳罗的支持率很胶着，卢拉长期保持小幅领先，大多数时候是两三个点的优势。"
  - '[PAGE 1]


    民调里有个规律：5个点以内属于误差范围，就是你领先5%都不保险，真到投票时，对手可能一波超过你。卢拉才领先两三个点，第一轮被超过很正常。


    小博索纳罗被卢拉反超也是正常的，他第一轮只领先卢拉两个百分点，也在误差范围内。卢拉最终以51.74%对48.26%获胜，同样赢得很少。


    小博索纳罗第一轮能够获胜，原因之一是民调低估了右翼的“隐形票”。小博索纳罗的支持者以极右翼为主，很多人内心支持小博索纳罗，但明面上怕惹麻烦，所以民调抽查时，他们的回答往往口是心非。


    等真到投票那一天，他们投给了小博索纳罗。这种现象卢拉阵营在大选前笃定，卢拉第一轮投票就会领先，第一轮过半都有可能。


    既然赢定了，不少卢拉支持者干脆懒得去投票，弃权的人多达3340万，以东北部地区、贫困社区、老人为主，大部分是卢拉支持者或者潜在支持者。所以，卢拉第一轮最大的敌人不是小博索纳罗，而是他自己人没去投票。


    等第一轮结果出炉，卢拉发现形势不妙后，只能认认真真做工作，尤其是巴西东北部、贫民社区这些基本盘，劳工党（卢拉所在的政党）工作人员挨家挨户上门动员。


    经过艰难的动员，弃权率在第二轮下降了2%，别看下降得不多，其实按巴西的选民规模计算，有超过400万人前往投票站。'
  - '[PAGE 2]


    为了动员大家投票，卢拉改变了策略。第一轮的时候，他讲了太多意识形态的东西，重点抓小博索纳罗的父亲，就是老博索纳罗 2023 年发动过政变，如果让他儿子回来，保不齐也会政变。


    卢拉的逻辑没错，但没有说到选民的心坎上，选民最关心的肯定是口袋里的钱。


    经过复盘后，到了第二轮，卢拉几乎只谈钱。


    每周工时要 从 44 个小时减少到 40 个小时，承诺公交车周末免费，还要发放燃气补贴、高中生补贴、大学生补贴等一系列福利，并且要压低通胀。


    小博索纳罗非常尴尬，因为他的主张是缩减开支，他没法承诺发各种福利，不削减就不错了，换了你是普通选民，你会选谁？


    卢拉还成功团结了中间选民。


    不少中间选民、温和派对老博索纳罗很忌惮，老博索纳罗因为 2023 年政变被定罪，中间选民很害怕巴西回到军政府的老路（巴西经历过军政府）。


    如果小博索纳罗上台，没人知道会不会走父亲的老路。中间派未必多喜欢卢拉，但更怕军政府。


    最后，卢拉还有点个人老本。卢拉第一次当总统是 2003 年到 2010 年，那是巴西经济的黄金年代，超过 3000 万人脱贫。脱贫、中产规模扩张、经济往上走，那段好日子很多人还记得。卢拉打出了情怀牌，许多'
  - '[PAGE 3]


    <!-- no content -->'
  - '[PAGE 4]


    他们合作。


    到了 2026 年，局面更糟，自由党和盟友在众议院拿了 203 个席位，中右翼也有 204 个，左翼联盟才 100 个出头，差距非常大。


    可想而知，卢拉施政的难度比前面四年只高不低，卢拉承诺的一大堆福利能不能落地？我看比较困难，比如，卢拉承诺的大学生补贴，准备用“议员专项预算”的银子去落实。巴西法律规定，每个议员都有一笔专项预算。


    用途一般是给家乡修路、架桥等等，你让他们把这个钱拿去给大学生，能有多少人愿意？如果卢拉不给足好处，大学生补贴就很难落实。卢拉承诺的其他福利承诺，也面临同样的麻烦。


    说完了相同之处，再说说两次大选的不同，最大的不同是过程不同。


    卢拉在 2022 年赢得相对轻松，虽然第二轮赢的票数没有想象中那么多，但卢拉从大选开始就保持领先，第一轮结束时更是领先了五个点。


    当时巴西刚遭遇疫情，经济被重创，老博索纳罗身为总统肯定要负责责任，很多选民认为，都怪他政策不当，让巴西经济陷入了困境。


    而卢拉呢？由于黄金八年带来的声望，不少选民都相信他能处理好经济，赢得大选几乎没有悬念，无非是赢多少。


    但 2026 年不同，卢拉自己是总统了，巴西'
  - '[PAGE 5]


    社会的任何问题他都要背锅，获胜不再是必然。


    所以，卢拉第一轮落后了。


    其实，巴西大选的模型和美国非常像，左右两边各有 45%左右的铁盘，对方根本挖不走。如果铁盘对你失望，他们就不投票，你要做的，就是通过一系列手段让铁盘投票，这叫保下限。


    上限取决于中间派，虽然中间派的数量不多，但他们属于关键少数，两次大选，卢拉都艰难保住了下限，都争取到了中间派。


    而极右翼候选人太极端，只能动员基本盘保住下限，无法突破上限。


    卢拉连任，意味着中巴关系不会出幺蛾子，巴西不会退出金砖机制，中巴经贸合作也不会中断。


    但也不用期待突破性合作，巴西国会右翼掌控，决定了卢拉难以推行重大改革。同时，巴西右翼也不太敢破坏中巴已经开展的经贸合作。


    这一点，博索纳罗任内已经被证明过。除了中国，没有第二个大市场可以消化巴西的巨量农产品和矿产品。


    未来四年，中巴关系可能维持当前的基调，有矛盾，但合作大于矛盾。


