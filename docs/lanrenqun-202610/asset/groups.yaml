  - '[PAGE 0]


    # 想赚 1000 万的钱就不要去做赚 100 万的活


    261008 副业 SC 精华


    整理：公众号懒人搜索，懒人专属群精选


    懒人微信： lazyhelper1


    ![](img/690f146199a71f753dfc3d7ced33371f_0_0.png)


    小懒判断 | 适合在无货源、店群这类"赚 100 万的活"里打转、想往上走一个量级的老卖家；不适合刚入行连第一桶金都没赚到的新手。最扎心的是天猫店群 100
    家店亏 100 万那一段；入驻放水→软件禁用→罚款清退，平台规则说变就变。坑在于作者复盘出的出路是做影响力卖铲子（apimart 月访问 36 万），不是继续卷执行。


    ![](img/690f146199a71f753dfc3d7ced33371f_0_1.png)


    如果当初我把大量时间腾出来做影响力，而不是消耗在想把员工培养成各个月销 10 万的“高级运营”上，也许目前会有战斗力不一般的团队和年利润千万量级的项目吧。


    10 年做了网页游戏推荐网站， seo 起盘，靠着 cpa 和 cps，每月入账 3 万左右，成本就是一个域名+一个服务器。18 年靠直通车打爆一款增高鞋垫日消耗广告费
    2 万，投产 4 点几，毛利率 75%。19 年末做的化妆品单品一个月毛利润做了 80 多万。20 年末，一个员工单品单天成交 15 万，毛利率'
  - '[PAGE 1]


    70%。其实还有很多比上面夸张的数据，在无货源赛道应该是比较亮眼的数据。但现在回想起来，大都是借势起飞，能力不外乎：执行力好，踏实肯干，逻辑清晰。


    如果没有势，很难拿到好的结果，或者没有势想要拿到一样的结果，需要付出更大的代价，也可能一地鸡毛。回到主题，想赚 1000 万的钱就不要去做赚 100 万的活。不同体量的收入对应着不同的思维框架和行为模式。如果一个小地摊菜农，想要通过卖菜赚到
    10 万，每天按时出摊，每天稳定赚 30 元，一月赚 1000 元。可能需要日复一日，年复一年，重复同样的动作 10 年甚至更久，还是在不吃不喝不生病不旷工排除各种对存钱不利因素的情况下。


    如果想赚更多的钱，那就要完全脱离上面被固定框死的行为和思维模式。


    最简单的改变在收入达到某个值后，购买提升生产效率的工具，加一些轻量级的杠杆，比如买个人力三轮车，不固定摆摊，而是游走售卖，收集成密集区域和市场需求高利润大的菜品。然后到一定资本后又开始切换生产工具，如电动车三轮，提升更快效率。有这种思维模式后就一直迭代，面包车，小货车，大卡车反正是一旦到了有能力提效加杠杆的时候，要有魄力的执行下去，最关键点是一定要跟好趋势，赚到
    10 万可能 2、3 年甚至更快。开头我说到要做影响力，其实拿菜农和菜贩子举例，两者接触到的人群和机会有非常大的差异，这里都埋藏着金子。'
  - '[PAGE 2]


    当你从一个小堆贩通过自己积累的资本购置提效工具改变你的收入模型和速度后，会逐渐影响你周围的一些人脉和资源，从而可能给你带来更大的潜在可用资金和资源，后期的小面包，大货车可能都不一定需要自己出资，更大的杠杆会随着你接触的圈层和你的影响力蝴蝶自来。回到我自己的案例来讲，真的还有很大提升空间。


    # 业务一页游分佣：


    页游网站当年只赚了 30 多万，用现在的视角看其实还有更大上升空间。当时就是一个简单的单页游戏推荐网站，纯靠搜索排名拿流量，当时接的 4399、51wan
    还有一些小的游戏 cpa 广告。


    每天精准流量 3000UV，刚开始都是自己做外链，写内容。后面犯懒了，就想搞自动化，采集了大量资讯，简单伪原创就铺上去，后续导致降权翻车。


    当时应该花钱提升有效生产力，招专职编辑配合专职外链专员来继续稳固提升网站流量，招前端设计美化 UI，同时扩大网站内容覆盖面，主动扩展商务外联进行资源置换，联系更多游戏推广发行方增加收入渠道。


    当时国内唯一一款 3d 页游，投放的 cps，有些人民币玩家每月开服直接充 2 万，推广商给 50%分成，持续了小半年。


    当然，无论当时采用多么有效的生产力提升效率都离不开趋势，下面是豆包搜索到的页游生命周期。'
  - '[PAGE 3]


    # 国内商业网页游戏（页游，传奇/神仙道这类大型 MMO/SLG 页游）


    # 爆发起点：2007-2008年


    2007《部落战争》国服进入国内；2008《热血三国》爆火，联运模式跑通，正式开启页游大时代；同年开心网《开心农场》社交页游全民出圈。


    # 巅峰期：2010～2015年


    +   - 2011《神仙道》，2015《传奇霸业》（林子聪广告，“是兄弟就来砍我”），**2015年市场收入达到历史峰值219亿**。


    # 开始下滑：2016年起


    手游全面崛起，玩家大量转移；Flash技术隐患、买量成本飙升、传奇IP版权纠纷，收入逐年萎缩。**2018年后，页游不再是主流大盘，市场规模大幅缩水。**


    > > 页游并没有彻底“死掉”，少量传奇类页游至今还在运营，但已经不是大众主流产品。


    # 一句话时间线


    +   - 🔥 **火爆周期：2008—2015，红火约8年；2016之后持续衰退**


    我是恰巧在09年即将毕业的窗口期开始研究 SEO，然后恰巧又选到了页游这个赛道，然后在10年开始起飞，当时同届毕业的同学，月薪1200-1500左右。


    **风口上赚钱需要的能力不多：好的执行力，能沉住气踏实干，清晰的逻辑。**


    **业务二淘宝爆款：**从北京回来后，想先从二类电商切入，之前听说这块很赚钱，而且赚钱速度也挺快，就开始做各种调研，调研了一周左右，就决定放弃，对我来说门槛太高，手里至少要启动资金100w才能有机会做起来。


    随后把朋友之前发的方博士的淘宝无货源课程拿起来，这个入场门槛低适合当时的'
  - '[PAGE 4]


    境遇。同时自己也找了一些拼多多课程，大概看了 3-4 天就开始做。当时给每个项目测试周期都定在 2 周左右，如果操作的过程中完全看不懂业务逻辑，也没有任何实质性的进展就快速切下个项目。铺货和
    pdd 测试了接近一个月，虽然本金投入少，但是没有实质性数据反馈，决定放弃。


    然后之前做二类电商调研时候联系的销售，推荐了一个当时投放很猛的清洁产品，我想着二类电商是做不了，挂淘宝上看看情况吧。谁曾想就是这个品，坚定了我淘宝业务的基础框架。


    随后按照每天赚 700，一个月的负债才能平掉的目标，逐步开始拉升，只用了半个月时间跑出来的数据就能平掉负债还有盈余。随后就在这个方向上开始扎根，研究底层逻辑，核心就是：别人推广爆款，我在后方捡漏。这个业务本质还是跟着趋势起飞，起初是今日头条等平台的二类电商，然后抖音从一个开始的帅哥美女高质量的
    KOL 做 UGC 内容，切换到全民拍摄美好生活的阶段，然后把流量商业化一波切入视频带货，当时二类电商这一群体快速转战到抖音带货又来一波新红利，我也是恰巧这个时间段进场迎来爆款截流的爆发式增长。下面是豆包给的抖音时间线：'
  - '[PAGE 5]


    # 抖音时间线（对比刚才页游的逻辑）


    +   - 上线：2016年9月，一开始是小众音乐短视频，只有年轻人玩，没出圈

    +   - 小范围起量：2017年，尬舞机、几首BGM爆火，App Store登顶，但还没全民普及，属于圈内火

    +   - 真正起飞 (破圈)：2018年春节 (关键节点) 砸春晚广告、明星红包、挑战赛，春节短短十几天，日活直接翻倍，从三四千万冲到近7000万；2018年6月日活破1.5亿，正式全民化，完成逆袭，从年轻人APP变成国民应用
    人民网


    # 火爆阶段划分


    +   1. 爆发期：2018～2020年（黄金红利期） 流量红利最大，普通人随便拍视频都容易起号；直播、电商开始进场，商家、达人涌入，是抖音最赚钱的流量时代。

    +   2. 成熟期：2021～至今 流量不再是无脑推荐，算法变严、竞争白热化，买量成本上涨；但抖音没有“结束”，依然是国民级平台，只是草根自然流量红利消失。


    > > 一句话总结：

    > > 2018春节正式起飞， 自然流量红利大概持续2年 (2018 2020) 2021...


    淘宝爆款截流业务在20-21年期间达到高峰，但是由于当时的业务逻辑和框架问题，导致自己培养了很多优秀竞对。当时几乎是把从供应链、选品、运营、客服等全链路的技能全部输出给每个运营成员，这就导致原本能做的4-5年的项目，做了3年不到就被自己一手带出来的兵卷死了。好不容易半年带个熟手出来，结果一年一流失，反复更新迭代玩法，来回拉扯团队，来回好几次，心累了，22年就结束整个业务和团队。


    现在看即使当时那种很被动的情况也有机'
  - '[PAGE 6]


    会起盘新业务，而且比当时的截流业务做出更大的体量。


    复盘后，个人能想到的正确的策略大致有两种：


    **策略一**、**核心选品策略**，只有核心人员掌握，并且大量的时候花在选品上，人也不累。测品出现的异常值，强付费投放也是核心人员直接操盘。其他打螺丝等替代性强的作业，就给流水的基础运营岗位分配，人才要经过长期选拔和观察才能逐步进入核心业务。


    这样就不会眼睁睁的看着 10 多个百万利润的单品，从我们这里开花，到别人那里结果。


    这种策略有概率沉淀出能打的核心成员，去走开品路线，既能建立有门槛而非信息差的项目，又能建立稳定的团队。


    认识的西安的一个年营收过亿的天猫无货源团队，运营副总负责选趋势大方向，给出基础词根，运营总监拿到词根后挖掘趋势关键词列表，然后分发给运营主管，主管再分批给到各个小组，组长分配给专员，负责把拿到的每个词选
    5-10 个品上架。就这样只要最上层的方向不跑偏，最基础的岗位做流水化重复的动作，团队规模稳稳的增长到上百人。


    **策略二**、当时技术外流已经失控的情况下，**明知道不可逆，那就应该放手大力搞培训**，把花在注定要成为竞对的员工身上的时间和精力投入到结交广大创业人群的培训业'
  - '[PAGE 7]


    务上，**快速赚钱的同时，快速扩大影响力**。

    直到现在，4年前因为培训认识的朋友，

    还保持着长期的联系，时不时互通有无，

    交流经验，但培养出来的竞对前同事几乎

    没有任何联系。


    但我当时只是浅尝辄止的试了一下培训业

    务，但总觉得自己有能力把团队拉起来，

    搞了小范围的人数不多的培训就草草收工，

    花大量时间搞管理。


    反观同期的生财圈友盗坤，以淘宝蓝海

    业务起步，大量输出扩大影响力，搞培训

    赋能，结交了大量创业人群，同时也赚到

    了可能比自己拉扯团队更轻松的收益。深

    入交流过且有价值往来的创业人群越多，

    积累的人群资产就越多，后续可以切入更

    多通过信息差赚快钱的业务，也筛选了一

    些信任度高又很能打的战友。**再后面能做

    的就不仅仅是信息差才能赚钱的业务，而

    是合力抱团闯更大的赛道**。


    # 业务三天猫/抖店店群：


    这个业务是目前创业过程中经济损失最大

    的一个，**整体亏损100w左右**，可能对一

    些创业老板来说这个损失不算多，但是对

    我来说这个损失已经超出我创业方法论的

    亏损极限。


    我的方法论大致是这个框架：选好一个赛

    道，评估好最大投入时间和投入资金，全

    力投入，过程中遇到关键问题都一一解决

    掉还不能产生有效结果，**时间达到6个月

    或亏损达到某个临界值，一定果断放弃**。'
  - '[PAGE 8]


    # 天猫店群当时一共开了有接近 100 个店，期间有几个关键性节点。


    节点 1：单店铺入场成本在 8-10 万左右，成本高意味着门槛高，进场的竞对少，这个时候产出可以肉眼看到逐步拉高，从单月利润 5k，逐步增长到 1w，再到
    2w。这个节点感觉整体不出问题只要扩大店铺数量就可以平稳赚钱。对比之前做的爆款截流真是轻松太多了，不用每天盯选品，分析同行，调整直通车，只要无脑上货无脑运营，业务规模也能稳步增长。这个节点其实整个项目都是
    OK 的，符合我的方法论。


    节点 2：天猫入驻大放水，大概是 23 年 12 月中旬吧。天猫开启了履约险时代，1500 元就可以抵扣 5w 元的保证金。卖店的成本打到地板价，自己入驻就
    3000 元以内，单店铺成本直接降到 5k 以内。当时我就感觉不妙，门槛没了不只是针对我，是对所有人都没了，狼多肉少的时代要来了。当时想观望一下再决定是否要继续加店，但是一旦拿了投资就身不由己，周围大多数同行都在疯狂加店，只能被裹挟着跟风。


    节点 3：24 年加店到接近 100 个的时候，突然全市场的上货软件都不能正常使用，等了 2 周，直觉告诉我这件事已经到头了。逻辑上的判断是，大批量低成本的店铺入场，大家都是
    3 万 5 万的批量铺货，整个天猫用户池才有多少，天猫总商品库的增长速度可比用户增长快了不是一个量级的，怎么可能允许保障度低的店群影响到真实用户的购物体验。这个时候我先叫停了在'
  - '[PAGE 9]


    朋友那边代运营的 50 个店，同步逐步停掉自己团队运营的近 50 个店铺。


    节点4：天猫店“很多肉少”的情况发生后，我就转变思路，只保留了 1-2 个店在做精细化运营，稍微用一些之前爆款的运营手法就在 7 天内把销售额从单天 300-400，拉升到单天
    2000。但是天猫又出新政策，就是为了清洗大批量铺货的店铺，净化天猫生态。先是来个第三方诱导违规首次罚 5000 再次罚 2w、紧接着又来无货源直接 2w
    罚款。这两个政策叠加，让我对天猫业务彻底死心，全部店铺下架关停。准备以创业失败结束，这时亏损大概是 40w，想退出但又身不由己。


    节点5：抖音店群，早期入场的店铺收益可以，然后又跟天猫店走的同样的套路，先是入驻大放水，商品信息足够丰富后，再次很多肉少，然后上各种政策罚款，最后店铺清退。后面同样的事情还在
    TK 发生过。平台都是一波一波，铺货的群体也是一波一波。现在看来平台方才是最大的无货源玩家，大喇叭一喊，大家拿着钱抢着入驻，入驻后然后开始赛马机制，让商家相互竞争相互卷，再通过各种商家和买家投喂的数据来筛选优质商家改进流量分配策略，同时用罚款的方式赚点外快，优化留存商家筛选出优质马匹，给用户提供更好的商品和服务。如此往复，逐渐形成用户享受福利，倒逼商家上进，平台躺赚的好生意。


    原本我的打算是从轻资产的淘宝爆款截流跳到高门槛的天猫店群，结果平台政策各'
  - '[PAGE 10]


    种调整导致这个业务从好业务变成烂业务。

    还有一点是之前做爆款对运营能力要求很高，需要全方位的理论知识和实操经验才能培养出来一个合格的运营，铺货多简单无脑，只要电脑采集上货就能躺赚，不用费心思培养任何人。


    # 业务四 AI工具出海：


    这个业务做的很不成功，原因一是受淘宝爆款截流模式（天天找新品新机会，天天忙天天累，只要停下来业绩就下滑）影响太多，就一直想做长期且有沉淀的事情，导致没拿到什么像样的结果。这次从深圳回来彻底顿悟了，只是顿悟太晚错过好几波风口，但是多晚都比不顿悟要好。


    入局出海业务大概是在24年的10月份，加入了哥飞的社群，看了一些公众号和社群内部知识后开始实操。但是一入局就比较排斥新词新站，因为太像之前的淘宝截流业务了，内心有一万个不要，行动上也在践行这种发自内心的排斥，基本不做新词，错过好几个月入万刀十万刀的机会点。


