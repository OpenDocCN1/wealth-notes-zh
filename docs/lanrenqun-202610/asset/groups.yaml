  - "[PAGE 0]\n\n# 光刻机巨头阿斯麦，被中国反向卡脖子？\n\n261020 文/卢克文工作室 风雨如歌  \n整理：公众号懒人搜索，懒人专属群精选\
    \  \n懒人微信：lazyhelper1\n\n![](img/fbda60883ca99d176db565f3031314b3_0_0.png)\n\n\
    > > 小懒判断 | 适合想搞懂稀土反制到底怎么精准打疼对方的读者——50人德国小厂辛德豪瑟断供，直接威胁阿斯麦 EUV 整条链。不适合把这篇当芯片产业全景读的人，它只讲供应链这一个切口。最值得关注的是打法升级：不用大范围断贸，盯住卡在关键节点、没有替代产能的小众配套厂商收紧高纯稀土就行。坑是以为欧洲扩产就能解套——新产线照样要中国稀土，客户认证周期也等不起。\n\
    \n路透社最近爆料称，欧盟提出和中国做一笔对等交易：中方解除对辛德豪瑟公司的出口管制，欧盟同步解除对一家中国企业的限制。\n\n欧盟之所以专门点名这家叫辛德豪瑟的公司，是因为辛德豪瑟在欧洲光刻机供应链中的作用相当关键。\n\
    \n辛德豪瑟位于德国，员工总数只有50人，其中核心员工12个。别看公司规模非常小，但它是阿斯麦供应链的重要成员之一。\n\n对，就是那个造光刻机的阿斯麦。没有辛德豪瑟，阿斯麦的光刻机供货都可能受到影响。"
  - '[PAGE 1]


    辛德豪瑟的产品主要有两个，一个是溅射靶材，另一个是六硼化镧陶瓷阴极，其中溅射靶材是看家本领，是蔡司的供应商，而蔡司是阿斯麦光刻机的供应商。


    光刻机最难的环节是镜组，镜组负责引导极紫外光，让极紫外光一路“拐弯”拐到晶圆上，这种超短波长的光，透镜根本兜不住，只能靠镜子上镀的一层又一层纳米级薄膜。


    这层膜，是用溅射工艺一层层“打”上去的，溅射靶材就是被打的原料。如果缺少辛德豪瑟的靶材，蔡司的镜组就无法供应，阿斯麦光刻机也跟着受连带影响。


    再说第二个产品，六硼化镧陶瓷阴极。你可以理解成蔡司镀膜机器里的“电子点火器”。EUV 光刻机的反光镜需要镀纳米薄膜，需要用到专门的镀膜机，镀膜机得打出稳定的电子束，用电子束激发等离子体，才能把靶材的原子一点点打到镜片表面。


    这个阴极，就是专门负责释放电子的重要零件。没有它，镀膜设备就出不来合格的电子束。就算手里还有溅射靶材，镜子上那层关键薄膜也镀不上去。


    靶材是被轰击的原料，阴极是发起轰击的电子发射件，两个配件要搭配使用，蔡司的镀膜产线才能正常运转。


    做阴极的原料镧，是轻稀土的一种，但镧并不单独使用，而是与硼形成六硼化镧晶体。


    这种硼化物整体熔点超过 2000℃，容易释'
  - '[PAGE 2]


    放电子，电子不需要费很大力气，就能从材料表面跑出来，是热发射阴极的优质材料。


    无论溅射靶材还是六硼化镧陶瓷阴极，都需要用到稀土，中国在稀土领域很强势，从开采、冶炼到提纯，全球大半个稀土产业链集中在中国。


    辛德豪瑟这种几十人的小厂，既没议价能力，也没有绕道的本事。


    今年7月23日，欧盟在推出新一轮对俄制裁方案时，把14家中国企业纳入限制清单。中方立刻对等反制，将14家欧洲实体列入两用物项出口管制名单，限制向它们出口稀土这类两用物项，辛德豪瑟就在名单内。


    彭博社报道，拿不到稀土的辛德豪瑟，业务已经陷入困境，向蔡司供货困难，有破产的风险。


    欧洲很难找到辛德豪瑟的替代企业。虽然欧洲还有一些企业能生产溅射靶材，比如，比利时的优美科、奥地利的普兰西，但他们产能太小，填不了辛德豪瑟的窟窿。


    优美科的看家本事是催化、回收、电池材料，普兰西的老本是钨和钼相关产品，真正能对标辛德豪瑟那种超高纯稀土基靶材、镧系陶瓷阴极的产线，他们目前还没有多少产量。


    如果等他们成功扩产，真不知猴年马月，蔡司和阿斯麦的产线却等不及了。或者扩到一半，发现生产过程还是需要稀土，稀土还是得找中国买。'
  - '[PAGE 3]


    除了原料问题，半导体行业通常需要漫长的客户认证周期。就算材料做出，蔡司、阿斯麦也要长时间测试验证，不是造出来就能直接替换辛德豪瑟。


    毕竟新供应商的产品到底靠谱不靠谱，谁也不知道，随随便便采购你的产品，万一出了问题，损失动辄亿计。短时间内，欧洲解决不了辛德豪瑟的卡脖子难题。


    估计欧洲当初也没想到，一个辛德豪瑟，就能威胁整条阿斯麦光刻机产业链，阿斯麦当下还没有停产，手里还有蔡司提前备好的镜组库存存在维持生产。


    但未来的风险无法回避，一旦辛德豪瑟耗尽原料，蔡司镀膜的供应就会中断，阿斯麦 EUV 光刻机的生产交付也会受冲击，这也是欧盟着急谈判的原因。


    一直以来，部分人对稀土是不是真的能卡高端制造产业的脖子，卡到什么程度，体感并不强，包括欧洲制定政策的政客，可能也不是那么清晰，或多或少存在侥幸心态，觉得不会那么严重。


    但事实是，欧洲就算能找到稀土原矿，也很难搭建起完整的产线，超高纯稀土原料大多数只能依靠中国供应链。


    这次辛德豪瑟被卡脖子，直接冲击阿斯麦供应链，让所有人都清醒了：


    中国可能只需要卡住一家关键小厂商的原料供给，就可以牵动整条光刻机产业链。


    而且在欧洲，像辛德豪瑟这样体量不大、'
  - '[PAGE 4]


    却卡在供应链关键节点的小厂商还有不少，比如意大利嘉耐特。


    嘉耐特的规模同样不大，专精特种陶瓷与真空镀膜靶材，很多欧洲精密光学、真空设备厂商都采购它的产品。


    它生产的特种靶材，需要用到钇、铽这类中重稀土，非常依赖从中国采购。


    又比如德国马特克，它的核心产品钇粉、铜系合金粉末，产品供给欧洲多家半导体研发机构与精密光学工厂，对原料纯度的要求达到 99.95%以上，普通稀土粗料达不到生产标准。


    欧洲本土只能产出少量稀土粗矿，暂时没办法把粗料提纯到满足马特克需求的等级，马特克只能依赖中国货源。一旦国内高纯稀土原料出口收紧，马特克的订单交付就会遇到麻烦。


    再举一个真实案例，德国的安特拉科化工，同样在 14 家出口管制实体名单内。安特拉科化工专精特种化工原料贸易，很多欧洲真空镀膜、特种陶瓷厂商都从它手里采购高纯稀土原材料。


    它不自己开采或者冶炼稀土，只是原料中间商，上游高纯稀土货源很大一部分来自中国。一旦货源收紧，它没法向下游供货，欧洲不少企业的生产都会跟着受影响。


    这些企业都有一个共同特点：规模小、技术专、客户固定，长期深耕细分赛道，没有多余资金去搭建一整套稀土冶炼提纯产线。它们只能把原料加工成零部件，原材'
  - '[PAGE 5]


    料环节完全外包。


    除了这些企业，欧洲还有许多依赖中国稀土的企业，因为稀土的应用范围实在太广了。


    芯片制造领域，镧、钇用来制作高介电常数绝缘薄膜，解决先进制程芯片漏电问题；钕、镨用来制造EUV光刻机内部精密运动平台的永磁体，保障纳米级定位精度。


    新能源产业，添加镝、钕到永磁体内部，可以让新能源车电机、风电发电机在高温环境下依旧保持磁力，避免电机出现性能衰减；镧用于动力电池储氢合金，提升电池循环寿命。


    通过这次“试验”，我们进一步验证了如何精准用好稀土产业链这张牌。


    我们不需要大范围切断贸易，那样做影响太大，只需要盯住卡在高端制造链条关键环节的小众配套厂商，对其收紧高纯稀土原料出口，就能够精准击中对方的软肋。


    用西方人自己话说，这就叫“不对称博弈”。


    过去，我们面对欧洲出台的不友好政策，通常做法是通过释放善意，争取欧盟在大国博弈中保持相对冷静和中立。


    2021年谈妥的《中欧投资协定》，就是这种思路的体现。当时我们主动放宽国内制造业与服务业的投资门槛，方便欧洲企业开拓中国市场；相比之下，欧盟向中方开放的投资空间比较有限。'
  - '[PAGE 6]


