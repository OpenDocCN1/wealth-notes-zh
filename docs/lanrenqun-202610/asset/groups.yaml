    - 第五类，其他汽车厂，外资汽车厂、合资体系、自主品牌和新势力都在里面，表面上是在看热闹，实际上都在盯着这次事件会怎么定性。因为这不只是尊界一家车的事，还关系到以后行业怎么测、怎么评、怎么处理类似争议。

    - 第六类，懂车帝与字节跳动平台体系，它要保住的是测评公信力、平台流量和商业价值。既想让内容有影响力，又不想因为这次刹车事件，把自己卷进太大的舆论和监管风险里。

    - 第七类，车评人、自媒体与舆论渠道，它们最在意的是流量、立场和饭碗。有人想蹭到热度，有人想维持专业形象，也有人要顾及商业合作，所以每个人说话的角度都不太一样。

    - 第八类，资本市场与投资人，它们没那么关心谁吵赢了，更关心这次风波会不会影响尊界后续销量、品牌溢价和市场预期。一旦影响扩散，最后先反映出来的，往往就是估值和情绪。

    - 第九类，供应链企业、经销商与售后服务网络，它们最关心的是订单会不会掉、车还卖不卖得动、售后压力会不会变大。因为对它们来说，这件事不是网上吵架，而是真金白银的生意会不会受影响。


    当你带入这样一个视角的时候，你就会发现这个世界不是非黑即白的了。


    ![](img/61ff313e0ffc17b56b1dd912484e058e_6_0.png)


    ### 06


    ### 我们再向下拆一层


    而每一个参与方，又能够分成多少派别。


    派系太多哈，我们就拆开华为、字节跟江淮。


    华为内部对造车一直有不同意见。


    - 支持造车的一派看重终端业务增量，希望把智能座舱、智驾和渠道能力直接变成整车销量，掌握用户关系与品牌溢价。

    - 反对造车的一派担心与车企客户争利，影响通信、计算和零部件合作，也担心重资产投入拉低财务安全。

    - 支持余承东路线的人愿意用高调发布、强渠道和强营销快速打开高端市场，能接受舆论争议，认为声量本身就是竞争力。

    - 反对余承东路线的人更重视组织边界、合作方感受和合规风险，倾向把华为放在技术供应商位置，减少直接面向消费者。


    尊界舆情出来后，前一派希望借关注度巩固高端认知，后一派担心争议波及整个鸿蒙智行。


    两派都想要华为赢，赢的方式和代价不同。


    （而且考虑到最近长公主刚刚上位，其内部的博弈可能也非常复杂。）


    ### 07


    字节内部其实对懂车帝也有分歧。


    - 支持懂车帝的一派看重用户规模、行业话语权和广告收入，认为测评业务能补足汽车内容生态。

    - 反对懂车帝的一派担心测评争议带来监管压力，破坏与车企关系，甚至牵连其他内容业务。

    - 支持懂车帝的人里面，主张公允立场的一派要求测试标准透明、数据可追溯、结论可复核，用长期可信度换取商业空间。

    - 倾向立场的一派更在意平台议价权和流量收益，在选题、排序、标题和发布节奏上会照顾合作方或竞争格局。


    尊界事件中，公允派担心公信力受损，倾向派关心商业谈判是否占优。


    两派都谈客观，客观的定义和用途不同。


    ### 08


    江淮汽车相关方同样有各自打算。


    - 省里主要领导关注项目对本地产业、税收、就业和区域位次的带动，希望尊界尽快形成规模，维护安徽汽车产业形象。

    - 国资委关注国有资本回报、投资风险、合规程序和资产保值，对持续亏损和过度依赖合作方保持警惕。

    - 江淮集团关注自身在合作中的话语权、产能利用率、财报表现和品牌提升，既想借华为提升产品力，又担心核心能力外移。

    - 尊界项目部关注交付节点、成本控制、质量口碑和团队稳定，项目成败直接关系部门资源和人员前途。


    舆情处理上，省里希望快速平息，国资委要求程序稳妥，江淮担心影响销量与股价，项目部希望清理负面后稳住订单。


    各方都希望项目成，承担风险的位置不同，能接受的让步也不同。


    ### 09


    不知道你发现没有，有些派系看起来利益是冲突的，但是不同派系中间，不同群体利益可能反而是相同的。


    这也就是教员在开篇所说的：


    > 谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。


    所以，如果我们看待一个问题或者在做任何判断的时候。


    如果只是出于一种朴素的道德观点，和直观感觉来下决策或者站边，那么注定是很难以成就一番大事业的。


    因为任何一件大事，决策环境往往信息都是不全的，而且时间跨度长，参与方多。如果你就是凭直觉给出一个判断，虽然这种方式很省力也很舒服，但是很多问题其实是想不清楚的。比如，事业推进需要衡量资源从哪里来？代价由谁承担？收益如何分配？风险怎么兜住？退路留在哪里？只凭一腔义愤，容易把复杂利益压缩成善恶两分。善恶两分之后，人就不愿意再听对方诉求，也不愿意承认自己一方的问题。结果往往把可以争取的人推远，把可以交易的事堵死。与此同时，干大事往往要处理长周期。


    ### 要懂得留余


    今天正确的话，明天可能变成负担。今天讨厌的人，后天可能成为盟友。今天让出去的利益，未来可能换回更大空间。道德可以定出底线，不能代替策略。直觉可以提醒风险，不能代替分析。


    一个人如果每件事都先问谁对谁错，再决定站哪边，他会得到道德满足，失去操作空间。


    他会不断寻找干净立场，现实里干净立场很少。


    他会在意一时评价，忽略最终结果。


    （比如过去五年俄乌战争，如果我们没有战略定力的话……）


    所以成大事的人要能忍受模糊，要能跟不同的人打交道，要能在不完美中选择可行路径，要能把朋友搞得多多的，把敌人搞得少少的……


    ### 11


    当然，我们还是要看到，利益分析不等于放弃原则。


    原则是边界，利益是路径。边界守住，路径可以弯曲。


    很多人把边界当路径，每一步都要笔直，结果走不到终点。


    大事需要团结，团结需要妥协，妥协需要让对方看到好处。


    只谈对错，对方没有空间，自己也没有条件。


    舆论场可以站队，组织场要处理人员、资源、时序、后手。认可来得快，去得也快。资源一旦耗光，正确也难持续。


    能够干大事的人，心里有是非，手上算利弊，知道什么能让，什么不能让；知道跟谁在什么条件下合作，知道什么时候该沉默，什么时候该出手。


    这样的人看似不够“清楚”，却更可能把事做成。毕竟只有小孩子才论对错，成年人只看利弊。能把边界守住，又能把路走通，或许才是真正“干大事”的能力。


    希望小伙伴们帮忙点个赞、转发一下，也让更多朋友一起想想：


    > 当一个问题没有标准答案的时候，你到底是在寻找正确，还是在寻找把事情做成的方法？


