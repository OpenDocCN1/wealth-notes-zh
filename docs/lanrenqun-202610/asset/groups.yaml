    # x 自媒体：半年 5 万粉，变现 6 位数的经验分享


    261012 副业 SC 精华

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_0_0.png)


    小懒判断 | 适合已有主业技能、想在 X 累积出海人脉的职场人；不适合想快速涨粉变现的纯小白，作者半年 51k 粉靠的是大 V 转发和付费社群信息差。最值得关注：2000
    粉就能接国外商单 500-800 美金且不用返点，回报比小红书高。坑在千万粉后继续堆量 ROI 递减，作者自己都说要转多平台一鱼多吃。


    首先要感谢生财，去年底组织的 12 月 x 航海让我接触到了 x 自媒体这个项目，种下了一颗种子。


    我 4.2 号发表来时路开始起号，到今天 10.2 号，刚好半年，目前粉丝 51k，通过 x 直接间接盈利几十万，这篇长文无保留分享我的起号与变现经验。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_0_1.png)'
  - '[PAGE 1]


    # 以下是我的半年复盘，相信可以给圈友提供一些帮助：


    # 冷启动到万粉：


    我正式开始做号是 3 月底，当时在纠结做产品还是做流量，自己想不出答案，所以就知付费，我报了小胖老师的深海圈，也在 x 上加了一些付费社群。


    我通过付费和多个拿到结果的人链接后，有了自己的判断，saas 产品这条路周期很长，我的性格熬不住几个月没正反馈，所以我果断选择了做流量。


    起号贴我研究的是圈友志辉的起号贴，我自己也有足够多的标签：大厂 T11，年薪百万，35 离职，又找了足够多的大 v 帮我转发，所以爆是必然的，这个帖子帮我涨粉
    2000+，完成冷启动。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_1_0.png)


    当时我也在生财发帖了，具体的冷启动经验可以看这个帖子：


    [https://scys.com/articleDetail/xq_topic/82255514245521112](https://scys.com/articleDetail/xq_topic/82255514245521112)


    冷启动完成后平台会有一波持续的推流，我冷启动完成后到万粉大概花了 20 多天，其中助力最大的是我录了个视频讲怎么用 skill 来给 x 进行运营涨粉，这在半年前是纯纯的信息差，这个视频给我涨了差不多
    5000 粉，然后我坚持输出利他内容大概 20'
  - '[PAGE 2]


    # 多天到了万粉。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_2_0.png)


    圈友还可以对标启航，他在小红书虚拟资料拿到了结果，然后持续输出，也很快就到了万粉，生财也有他的复盘贴：


    [https://scys.com/articleDetail/xq_topic/55521155118255114](https://scys.com/articleDetail/xq_topic/55521155118255114)


    还可以去看圈友良竹的这篇冷启动帖子，写的非常优质，基本上记录了冷启动的玩法：


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_2_1.png)


    # 圈友可借鉴的：


    这一阶段圈友们可借鉴的是先找对标，学习怎么写冷启动贴，每个人的经历不一样，'
  - '[PAGE 3]


    写足够吸引人眼球的点，写完以后尽可能的找到大 v 帮你转发，这一块生财圈友是有优势的，这个圈子已经跑出多位大 v 了。


    为了帮新人冷启动，我们在 9 月初也发起了 firstcheck，我也在生财发帖通知过；


    https://scys.com/articleDetail/xq_topic/22258848124425841，已经持续一个月了，目的是帮新人被看见，广告善缘；


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_3_0.png)


    我也帮很多圈友完成了冷启动，比如：启航、琳小航、冬青良竹天蓝阿乐等等，圈友只需要认真写来时路然后私信我讲一下你是圈友，我会拉你一把。


    根据我和多位大 v 交流的经验，做到万粉，在 x 平台够了，继续往上 roi 递减，而做到万粉，你只需吃透我 5 月份写的一个帖子就可以了


    x 到万粉一句话攻略：坚持发，发点有用的。


    # 1万-3万粉：


    我当时的玩法是：叠罗汉＋开火车＋蹭热点 叠罗汉：就是不停的晒涨粉经验，这个方法已经被大量的人验证了有效；'
  - '[PAGE 4]


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_4_0.png)


    开火车：X 上最有效的涨粉玩法之一，这个大家应该见到很多了，比如：


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_4_1.png)


    # 蹭热点：


    什么有流量就干什么，这个需要一定的网感，比如孙哥开中转站我就写中转站，黄'
  - '[PAGE 5]


    推泛滥时我就写黄推拆解，这些东西相当于 saas 里面的抢新词，必然有流量。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_5_0.png)


    这个阶段我把这套组合拳玩的飞起，基本上每天都是百万流量，涨粉 1000+，从 1 万到 3 万我只花了 1 个月，我当时过快的增速也吸引了不少人对我进行攻击，这个就是大流量带来的反噬，所以流量太大并不是好事。


    # 圈友可借鉴的：


    上面我写的一条龙玩法当下依然可以玩，但注意控制节奏，我看到很多人涨 100 粉都会叠一次，其实就大可不必了。


    我更推荐的是 @AdrianPunk115 的玩法，开源+社交，一直开源自己的作图提示词，然后坚持长文输出，punkskill 在 github 上攒了 1000
    多个 □，然后在各个 x 群高频互动，最近她的社群建立 3 天就涌进来 300 人，可见这套玩法是行之有效的。


    # 3万 - 5万粉：


    这个阶段我改了玩法，不再玩组合拳了，回归了我的老本行，我在职场的主要工作之一就是需求沟通，所以我很擅长和不懂技术的人讲技术。


    我就做自己擅长的事写 ai 小白教程，每天都有新模型和 agent 发布，所以我素材源源'
  - '[PAGE 6]


    不断，然后在稍微蹭一下热点，比如孙哥景甜事件我就从技术的角度写怎么用 comfyui 做孙哥视频，这篇跑了快 200 万。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_6_0.png)


    多篇百万爆款后，我就五万了。


    # 圈友可借鉴的：


    到这个阶段你得混圈子，光靠你自己很难到 5 万，得有一堆人持续跟你互动。


    可参考的账号是 @isnail，他经历了多次封禁，停留意，关小黑屋，坚持开源他的公众号玩法和社交，把自己公众号拿到的结果毫无保留的分享，同时在多个博主微信群高频社交刷脸，那涨粉是必然的，他的近期复盘贴。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_6_1.png)'
  - '[PAGE 7]


    # 5 万以后：


    再往上都是各路神仙了，中推的顶流宝玉也就 20 多万，所以天花板并不高，到这个阶段我的建议是转多平台发展，一鱼多吃，我自己也在这么做了。


    # 赚钱方面：


    # 流量收益：


    我做到了每个周期都是千美金收益，我从起号开始到现在半年时间坚持每天输出，从未间断，玩 x 到现在见到了太多朋友中途放弃了，但这是你来 x 应该最先拿到的收益之一。


    九月份 x 进行了创作者收益改版，我自己的数据以及我问了几个朋友，变化不大，主要是打击了纯泛流量的搬运号。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_7_0.png)'
  - '[PAGE 8]


