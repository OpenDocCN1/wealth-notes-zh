    # 世界银行为什么发布明显不靠谱的物价指数？


    261014 猫哥星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/bb453a948bac4154f895e6353fb54f37_0_0.png)


    > 小懒判断｜适合看到大陆物价是香港 80%这种数据就想吵起来的人，也适合需要跟人解释 PPP 指数的写作者。最值得记的是关键一句：购买力平价指数测的是全国大篮子综合价格，人工便宜拉低均价，跟你感知的一碗面理发价完全是两个概念。坑在于拿它对比具体商品物价，进而上升成阴谋论，知乎大
    V 全栽在这。


    # 猫哥原创


    今天给大家讲一个知识点，这个知识点叫做购买力平价指数，这个购买力平价指数一般是世界银行在做，因为翻译原因有时又被称为全球各国物价水平指数。


    这个知识点看起来很简单，但是绝大多数人经常是搞不清楚的，甚至以讹传讹。举个例子，2021 年世界银行就发布了全球各国物价水平指数，其中中国大陆物价指数大致是香港的
    80%，是台湾的 1.2 倍。


    很多人看到这个数据第一时间就跳起来，怎么可能？香港的物价明明是大陆的 4-5 倍好不好？台湾的物价明明比大陆高得多好不好？怎么可能大陆物价指数是香港 80%，是台湾的
    1.2 倍？'
  - '[PAGE 1]


    然后就是世界银行对中国有偏见，数据造假，甚至各种阴谋论都搞出来了。今天我就把这个购买力平价指数给大家讲清楚，以免未来大家也犯这种低级错误。首先，我们看真实物价，香港确实比大陆贵得多。


    我们以一碗面为例，在大陆一碗面大致价格是 15-25 元，香港 60-80 港币，香港确实要贵 4 倍，其他包括理发、出租车、快递、保姆等等价格都比大陆贵得多，远远超过
    80% 的范畴。


    但是以上都是日常人工服务——大陆便宜的核心原因就一个字：人便宜。大陆劳动力充裕，基层服务从业者工资低，所以一切靠人干活的服务都便宜。


    香港劳动力稀缺，最低工资高，加上商铺租金天价，所以一切人工服务都贵得离谱。除了人工服务为主的其余商品，香港其实并不比大陆贵，包括汽油、进口车、进口奶粉、化妆品、数码产品、芯片设备等等甚至比大陆还便宜。


    最为关键的是，我们普通人看到的物价是直接的商品价格，而世界银行搞的购买力平价指数是以国家为单位算出来的综合价格指数，两者完全不是一个概念。


    简单地说，购买力评价指数测算的是整个国家（或者社会）一年花了多少钱买了多少东西和服务，最后用商品与服务总量除以消费的金钱算出来的物价水平。


    所以，世界银行不是看特定的商品价格是多少，而是把全国人一年所有的花费（修'
  - '[PAGE 2]


    路建厂吃饭发工资）打包成大篮子，大陆人工便宜可以拉低篮子的均价，但是基建与政府服务权重高又会拉高篮子均价，最后才会得出大陆价格指数是香港80%，是台湾1.2倍的结论。


    作为普通人我们对具体普通商品价格更敏感，世界银行看重的是一篮子的综合价格水平。第二个问题，世界银行搞出来这个购买力评价指数究竟有什么用？


    这个指数当然不是指导我们普通人生活的，世界银行搞出来这个指数目的只有一个，就是全球治理的参考。全球目前有很多多边组织，包括联合国、世界银行、国际货币基金组织等等。现在问题来了，联合国会费如何摊销？


    世界银行与国际货币基金组织出资比例以及投票权应该怎么分配？


    还有遇到自然灾害以及人道主义灾难需要各国共同出钱出力援助的时候如何分配责任？甚至贫困需要救助的国家怎么量化？全球扶贫资金怎么分配统统都是现实的问题。


    理论上是不是应该按照各国实力来分配？实力越大责任越大嘛。收入越低越需要救助嘛。


    那么各国实力怎么计算？如果简单按照美元计价的GDP计算各国实力，那么就有一大堆问题，首先就是各国货币汇率经常波动，比如人民币短期升值15%，那么是否就能认为中国综合经济实力增长了15%呢？'
  - '[PAGE 3]


    中国肯定不干啊。于是，世界银行就搞出来这个购买力平价指数，目的就是剔除货币汇率的影响，测算出一个相对靠谱的各国真实经济实力。所以，这个购买力平价指数其实就是一个全球治理的参考指标。


    为什么说是参考指标呢？因为中国官方把这个指数定义为只是参考指标。中国对这个指数的官方态度是，要参与，要积极提供相关数据，但是不把 PPP 当做官方结论，尤其不认可世界银行认为按照购买力平价指数，2021
    年中国实际 GDP 已经超过了美国的结论。


    官方反复强调，我们还是全球最大的发展中国家，我们人均 GDP 只有美国的六分之一。


    最后看看知乎上这个问题的回答，一众大 V 的回答惨不忍睹，全部都是常识性的错误。


