    什么方向修改。


    **如果连我们自己都无法明确指出剧情存在的问题，自然也很难让 AI 给出真正有效的修改方案。** 这也是为什么我一直认为，使用 AI 写小说，作者自身的阅读积累、剧情判断能力和提示词调整能力都非常重要。


    这份教程主要围绕短篇小说细纲创作中比较常见的几个问题展开，包括故事线单一、情节重复、反派降智以及权谋逻辑薄弱等。


    我会尽可能把这些问题拆解成具体、可执行的修改要求，并提供可以直接复制使用的提示词。


    当然，教程中的提示词只是一套参考方法，大家需要根据自己的题材、故事大纲和实际问题进行调整。


    **希望大家学会的，是发现问题、分析问题，再通过调整提示词解决问题的方法。** 毕竟，AI 能够帮助我们提高创作效率，但一篇小说最终能够写成什么样子，仍然取决于我们对故事本身的理解和判断。


    注：


    本文适用场景：AI 辅助创作短篇小说时，故事线单一、情节重复、反派降智、权谋缺乏逻辑、反转生硬等。本文重点解决**大纲已经有了，但细纲不够好，应该怎样调整提示词的问题**。


