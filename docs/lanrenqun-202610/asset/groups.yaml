    <!-- no content -->'
  - '[PAGE 3]


    宝子们，虽然本周五大盘探到 3754 之后，迅速走了一个探底回升站上了 3800 点，但是我认为这依然是不健康的，因为周五这根探底回升的下引线是有毛病和瑕疵的。从他们的
    60 分钟走势来看，下周是有反弹信号出现的，但是下周的反弹上涨我们依然是看诱多。请耐心等待大盘做结实日线底背离则进行大试错。


    # 第三，做减法


    老铁们，因为大盘的周线和月线都是走的不太好，所以中长线大盘依然处于偏弱势的环境。另外大盘的日线底背离都做的结结巴巴，即使有反弹上涨都会有二次回踩。所以，有反弹上涨我建议逢高冲高分批次做减法。


    # 第四，还要再考一遍 3766


    朋友们，大盘理论上还要再考一次 3766 考点，才会确认一次真正的底部。当大盘再次探到 3766 之下的时候，大家可以多少低吸试错一下吧。


    # 第五，出现一个重要信号


    老铁们，目前整体出现一个重要信号，不是很号的信号。好多指数都是出现了周线级别底背离信号。包括创业板，沪深 300，中证 500，上证 50，北证 50 都不同程度的进入了周线级别底部结构洗盘。那么想要盘面反转暂时比较困难。大家依然要保持足够的耐心。


    # 第六，政策底'
  - '[PAGE 4]


    宝子们，不用怀疑，政策底就是在 3731~3741 范围。大家不要去怀疑，这一范围是主力和官里层都默认的洗盘底部范围。主力敢再次洗盘进入 3750 范围，说明这是被默认允许的。到
    底敢不敢跌破 3741 点？要不要跌破 3741 点，都已经不重要，重要的是我们要敢于试错。


    # 第七，耐心


    朋友们，现在这个局面，大家最主要的就是保持耐心和心态了，底部越来越近了。很多指数和板块都已经开始做周线底背离了，非常煎熬但是黎明也会越来越近了。


    # 第八，考点整理：


    我们依然要照例分析一下考点：考点是本篇文章的精髓，大家不要大意了。


    考点只会迟到，但不易缺席！上升趋势主要记住上方考点，下行趋势的时候主要记住下方考点。经过我严格的高级别计算得出以下考点：


    记住，考点才是整篇文章的最“核心”。


    上方考点：3822，3835，3849 下方考点：3766，3792


    # 第九，下周大盘会怎么走呢？


    朋友们，本周虽然只有两个交易日，但是这两天大盘打的大家满地找牙，把最恶心最难啃的 3766 考点，也是一个强力支撑位给考完了。这其实对大盘来说并不是好事。


    那么下周大盘会怎么走呢？


    目前的情况是这样的：'
  - '[PAGE 5]


    第①，大盘日线底背离依然不够明显。那么周五的探底回升则看是诱多，急急忙忙的拉升，后期还会倒车回来继续做日线底背离。


    第②，大盘的周线仍然是双死叉结构。甚至主力仍然留好了做周线底背离的空间。目前太多指数都在做周线底背离。大盘会幸免吗？


    第③，大盘的月线仍然是双死叉结构。月线不可能做底背离，但是月线会马上进入超卖范围，这是唯一的好消息，就是可以有继续下跌的空间，但是想要跌倒 3500 点几乎不可能。


    通过以上三点的分析，我们认为大盘依然没有调整完毕，反弹之后，大概率后面还有继续跌破 3800 点，重新再考一遍 3766 点。


    至于下周的走势我们整体看：冲高回落，诱多！


    高点我们给在两个考点 3835~3849 范围。


    低点我们是给在 3766 范围附近。


    所以，下周的运行范围我们给在 (3766~3849)


