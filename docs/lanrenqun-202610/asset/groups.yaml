    或亏损达到某个临界值，一定果断放弃**。\n\n## 天猫店群当时一共开了有接近 100 个店，期间有几个关键性节点。\n\n节点 1：单店铺入场成本在 8-10\
    \ 万左右，成本高意味着门槛高，进场的竞对少，这个时候产出可以肉眼看到逐步拉高，从单月利润 5k，逐步增长到 1w，再到 2w。这个节点感觉整体不出问题只要扩大店铺数量就可以平稳赚钱。对比之前做的爆款截流真是轻松太多了，不用每天盯选品，分析同行，调整直通车，只要无脑上货无脑运营，业务规模也能稳步增长。这个节点其实整个项目都是\
    \ OK 的，符合我的方法论。\n\n节点 2：天猫入驻大放水，大概是 23 年 12 月中旬吧。天猫开启了履约险时代，1500 元就可以抵扣 5w 元的保证金。卖店的成本打到地板价，自己入驻就\
    \ 3000 元以内，单店铺成本直接降到 5k 以内。当时我就感觉不妙，门槛没了不只是针对我，是对所有人都没了，狼多肉少的时代要来了。当时想观望一下再决定是否要继续加店，但是一旦拿了投资就身不由己，周围大多数同行都在疯狂加店，只能被裹挟着跟风。\n\
    \n节点 3：24 年加店到接近 100 个的时候，突然全市场的上货软件都不能正常使用，等了 2 周，直觉告诉我这件事已经到头了。逻辑上的判断是，大批量低成本的店铺入场，大家都是\
    \ 3 万 5 万的批量铺货，整个天猫用户池才有多少，天猫总商品库的增长速度可比用户增长快了不是一个量级的，怎么可能允许保障度低的店群影响到真实用户的购物体验。这个时候我先叫停了在朋友那边代运营的\
    \ 50 个店，同步逐步停掉自己团队运营的近 50 个店铺。\n\n节点4：天猫店“很多肉少”的情况发生后，我就转变思路，只保留了 1-2 个店在做精细化运营，稍微用一些之前爆款的运营手法就在\
    \ 7 天内把销售额从单天 300-400，拉升到单天 2000。但是天猫又出新政策，就是为了清洗大批量铺货的店铺，净化天猫生态。先是来个第三方诱导违规首次罚\
    \ 5000 再次罚 2w、紧接着又来无货源直接 2w 罚款。这两个政策叠加，让我对天猫业务彻底死心，全部店铺下架关停。准备以创业失败结束，这时亏损大概是\
    \ 40w，想退出但又身不由己。\n\n节点5：抖音店群，早期入场的店铺收益可以，然后又跟天猫店走的同样的套路，先是入驻大放水，商品信息足够丰富后，再次很多肉少，然后上各种政策罚款，最后店铺清退。后面同样的事情还在\
