    # “工作抢人，就业率 98%”，但日本的情况 “未必值得羡慕”


    261027

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/3df80e87865a5768c80d1121bba42dbb_0_0.png)


    小懒判断 | 适合看到"日本就业率 98%岗位抢人"这类说法的人，这篇把数字水分和背后机制讲透了。不适合想看日本游记的。最值得关注的是单人家庭占 34%这个转折点：人口少了但家庭数变多，按户计算的服务需求翻倍，缺人的真相在这里。坑是"岗位抢人"分两种，一种是扩张，一种是照护地基出缺口，意义完全不同。


    最近，网络上关于“日本就业率”的讨论很多，你可能已经在各种地方看到过。比如，有人说日本毕业生就业率超过 98%，岗位抢人，企业涨工资，甚至有传言说求职现场
    HR 下跪求应届生入职，还有企业开出“永不加班”的承诺。


    事实上，这并不是什么新闻，类似的信息这几年时不时就会冒出来一轮。讨论的方向也大致相似，因为人口减少，日本的年轻人供不应求，过去是人找工作，现在是工作找人。不少人由此推出一个结论：少子化虽然有种种问题，但至少在就业这件事上，对普通人来说可能是个好消息。


    那么，事情到底是不是这样呢？你看，关于少子化的影响，人们一直有很多推演。'
  - '[PAGE 1]


    **但是，日本社会提供了一个难得的真实样本。** 而且仔细观察你会发现，其中的很多逻辑，跟我们想象中不太一样。


    我们先从 98%这个数字说起。这个数是怎么来的呢？它出自之前日本的一项官方机构调查。但调查对象仅限于，日本一部分大学的日本籍本科生，不包括留学生。假如把范围放宽，根据经合组织的统计，日本的适龄工作人口里，就业比例大概是
    80%左右。但是注意，这个“适龄工作人口”划定的范围是 15 到 64 岁。事实上，超过 65 岁还在工作的，在日本大有人在。


    **因此综合计算，日本的就业率也许没有 98%那么高，但也应该不低。经合组织国家的平均就业率大概是 72%，日本大概率高于这个数。** 但是，我想请你关注的重点，不是日本就业好不好的问题，而是这背后的几个，跟我们想象中不太一样的地方。


    我们先从一个有点反常的现象讲起。日本的人口总数在减少，这大家都知道。但你可能不知道的是，日本的就业人数其实在增加。


    根据日本总务省统计局的数据，2025 年，日本平均就业人数达到 6828 万，比上一年增加了 47 万，已经连续五年增加。其中，女性就业人数增长最多，也是增长的主要来源。而
    65 岁以上的就业者也已经达到 943 万，连续 22 年增加，全部就业者中大约每 7 个人就有一个超过 65 岁。外国劳动者截至 2025 年 10 月底约为
    257 万人，也创下历史新高。'
  - '[PAGE 2]


    人口在减少，但劳动者在增加。为什么？因为越来越多过去不工作的人，比如老年人，也正在被吸纳进劳动市场。 可问题恰恰出在这里。劳动力明明在增加，整个社会为什么依然觉得缺人？而且是严重地缺人？


    这就要说到一个非常微妙的机制。


    你看，日本人口为什么减少？一个关键原因是少子化，结婚的人变少了。而结婚的人变少，就带来另一个后果：日本出现了越来越多的“一 人家庭”。根据日本2023年的国民生活基础调查，单人家庭已经占到全部家庭的34%，超过了三分之一。


    这意味着什么？人口少了，但家庭的总数反而变多了。打个比方。假设一个社区有500对年轻夫妻，就是500个家庭。但假如这些人都没有结婚呢？家庭数立马变成1000个。人口一个没多，家庭数翻了一倍。


    这个变化直接改写了劳动力市场的供需关系。原因在于，很多服务需求不是以“人”为单位产生的，而是以“家庭”为单位产生的。保姆、老人照护、家政保洁、上门维修、定期送餐，大量需要人“到场”的服务类工作，都是按户来计算的。一对夫妻请一个保姆，可以同时照顾两位老人。但两个独居的老人分属两户，那就需要两个保姆。一个三口之家只叫一次上门维修就够了，三个独居的人可能要叫三次。


    换句话说，在某种程度上，日本社会缺人的感觉越来越强，不全是因为年轻人变少了，也是因为需要服务的“单位”变多了。'
  - '[PAGE 3]


    2016 年，有位政治学家，叫南希·弗雷泽，曾经写过一篇论文，当时影响很大。她说，现代经济体系里有一个结构性的矛盾，叫做，我们的整个经济，长期以来默认了“家庭会免费承担大量照护劳动”。这笔劳动不进入
    GDP，不计入任何人的工资，但它实实在在地支撑着整个劳动力市场。


    你看，一个人能去上班，前提是家里有人管老人、有人管孩子。这些照护劳动一直在发生，只是从来没有被计过价。


    当家庭结构消失，这笔“隐形补贴”就被抽走了。但需求不会消失，老人还是需要有人照顾，孩子还是需要有人看管。只不过这些事情不再由家人免费承担了，必须从一个免费的系统转移到一个收费的系统里去。


    **借用弗雷泽的话说，照护不是经济的边缘，是经济的地基。只不过这块地基长期以来是免费的，所以我们从来没注意到它，直到它开始松动。** 所以日本就业市场的“过热”，本质上不能简单地理解成，“工作来找人的美好时代”到来了。它的背后也是“一笔隐形账单”正在到期。


    事实上，早在几十年前，很多国家就已经预见到了这个趋势。他们也想过各式各样的应对办法。具体来说，有这么几个路径。


    **第一条路，税收兜底。** 这是北欧的典型做法。比如，瑞典的个人所得税边际税率超过 50%，这部分税收撑起了整个国家的高福利，能够负担相当一部分的居民养老照护成本。但这个措施非常依赖于一个国家'
  - '[PAGE 4]


    过去的制度和经济基础。比如瑞典，多年来都是典型的高税收、高福利国家。


    **第二条路，社会保险。** 日本、德国、韩国都采用了类似的做法，设立专门的护理保险，强制缴费，而且保费一直在涨。德国的护理保险费率从最初的 1%涨到了如今的
    2.6%到 4.2%。日本 65 岁以上老人的月均保费，从制度启动时的 2911 日元涨到了现在的 6225 日元，翻了一倍多。


    但是，这个涨幅依然追不上需求的增长，就在今年，日本提前调整了原定 2027 年才会落地的护理支付标准，这也许说明财政承压正在加速。同时，保费涨了，企业的用人成本也会跟着涨，最终劳动者到手的收入，并不一定会比以前更多。


    **第三条路，让市场来定价。** 也就是，谁需要服务，谁来付钱。但这条路有一个制约，也就是经济学上著名的“鲍莫尔成本病”。说的是，制造业可以通过技术升级提高效率，一个工人从一天造
    10 件变成造 20 件，工资涨了，但单件产品的成本不一定涨。可照护做不到这一点，很多人工环节很难用同样的方式提效。


    结果就导致，护理员依然短缺，而且价格越来越高。今年 4 月到 9 月，日本有 200 多家护理相关的企业破产。关键原因就包括招不到人，或者支付不起薪酬。


    **第四条路，技术替代。** 这也是日本正在重点探索的方向。2025 年，《劳动经济学》上发表了一项调研，跟踪了日本养老机构采用护理机器人的情况，发现使用机器人'
  - '[PAGE 5]


    之后，员工留任率和部分护理质量指标都有所改善。因为机器承担了更多搬运、移位这类重体力任务，工作人员可以把精力集中在需要直接接触和沟通的照护上。


    # 第五条路，引入外来劳动力。


    这个尝试我们前段时间也讲过，日本近年来引进的国外劳动者越来越多。其中有相当一部分，流入了护理行业。但是，这类岗位对人有一定的要求，不是简单的清洁工或者护理员，它的职能更接近于“养老服务师”，你需要懂得沟通，掌握健康知识，并且会针对个人设计具体的照护方案。而且，当全球多个国家同时步入老龄化，护理人才的国际竞争也在加剧。日本在抢人，德国在抢人，韩国也在抢人。


    以上五个路径，很多国家都在同时尝试，只是不同国家的组合配比不同。而日本的尝试相对全面，几乎把能试的方案都试过一遍。


    当然，日本就业市场的实际情况要复杂得多，我们今天只是选取了一个观察角度。


    讲了这么多，回到我们自己。对我们来说，今天这个话题到底意味着什么？


    我觉得有三件事也许值得留意。


    第一，是一个看问题的视角。以后再看到任何一个地方说“就业过热”“岗位抢人”，你可以多问一句：它是真的需求旺盛、经济在扩张，还是原本的某些分工出现了缺口？有的缺人，是企业蒸蒸日上、业务扩张，需要更多人手来创造新的价值。这是'
  - '[PAGE 6]


    好事。另一种“缺人”，是社会的基础照护网络出了缺口，大量过去由家庭免费承担的劳动现在必须有人去做。这两种“缺人”，对身处其中的每一个人来说，意义完全不同。


    第二，假如你是一位从业者，那么“养老照护”也许是一个值得关注的市场，它的需求量、天花板，以及对技能的要求，都在提高。比如，在今年的第48届世界技能大赛上，有个项目就叫“健康和社会照护”。要知道，世赛一直是行业趋势的重要风向标，它的比赛题目往往反映了一个行业的真实需求。而在今年的赛制里，选手要在医院、日间照护中心、长期照护中心、家庭，这四个场景下，完成12个案例的照护任务。任务复杂度是历届最高的。


    第三，回到我们自己，没别的，很朴素，有个好身体比什么都重要。“保重身体”在今天可不是一句寒暄，它可能是你能给未来的自己准备的，最实在的一份保障。


    ——— 分割线 ———


    在这个AI能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的护城河，只剩下“信息过滤”的效率与“认知系统”的维度。


    圈子已稳定运行7年。我们每天利用'
  - '[PAGE 7]


    Python 爬虫与大模型算力，过滤全网最顶级的政经内参和搞钱风向标，做你最冷酷的“外部大脑”。


