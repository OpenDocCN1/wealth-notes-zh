    ## 四、推广小程序


    如果是做流量主的小程序，可以发到朋友圈，让别人帮你点击进去，或者发到航海群里，超过 500 个用户就可以开通流量主，但是我做的是付费用户，一般不会让非目标客户知道，做的是什么小程序。


    我目前自己开发一个针对职场人群的产品，解决他们在工作中的问题，产品的定价是一年 29，39，49，功能不一样，价格不一样。


    ### 1、公众号贴图


    贴图是目前微信比较支持的，小程序后台页能够跟贴图很好的联动起来，也不怕推广自己的小程序被判站外引流。


