  - '[PAGE 1]


    日中名列倒数第五。据公开新闻报道，电商平台被召集并要求加强产品质量标准，因此大型互联网平台公司首当其冲。


    于此同时，全球半导体与 AI 相关股票继续出现获利了结的行情，把昨晚科技七雄之一的公司的 AI 资本开支指引上调、以及一家最大的 AI 芯片公司的供应商远超预期的业绩对于市场疑虑的安抚一冲而散，美股科技财报后的表现在盘前也回吐了。


    沪深 300 已从六月高点回落约 20%，逼近了所谓的技术性熊市的门槛。而近日经济数据超预期尤其是增长和出口，这些超预期的数据令市场对于政策刺激的预期进一步降温。


    当然，我们在上周的电视采访和播客中就表示，在市场下行的最后阶段，下行的压力往往会加速，这也是投资者最容易感情用事、最无法抵抗压力而“割肉”的阶段。


    同时，我们在采访中还表示，市场对于政策刺激的预期不宜过分，而如果市场下行压力过大的话，那么对于市场更直接的政策出现的概率反而会更大。这些观点，我们在行星上与读者反复强调。


    这几天，在岸市场的下午盘宽基指数 ETF 的大额申购，“有形之手”的踪影若隐若现。


    放在更长的时间框架里看.


    这次港股的下跌属于“显著但非极端”的类尾部事件。过去三年恒生科技有 18 个交易日的方差是低于-2，约占全部交易日的 2%，频率略高于正态分布的预期，说明了这轮'
