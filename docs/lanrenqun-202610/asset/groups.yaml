    # # 律师嫌 6 万多的案子太小不接，我用 AI 为自己维权了 8 个月，最后拿到 67,555 元赔付


    > > 261005 副业 SC 精华

    > > 整理：公众号懒人搜索，懒人专属群精选

    > > 懒人微信：lazyhelper1


    ![](img/99fc997c705869be0f6bd9e9965c8d04_0_0.png)


    > > 小懒判断 | 适合正被物业/保险理赔压价、律师又不接小案子的人；不适合指望 AI 替你打官司的甩手掌柜——全程是作者自己留证、录音、投诉、寄 EMS。最值得关注：报价拆成
    17 项逐项对账，把“赔太少”变成一串对方答不上的具体问题。坑在于 AI 会把推测当事实说满，作者中途才转向 Kimi 并坚持原始材料与 AI 分析分开。


    **今年 1 月 27 日，我家发生了一次全屋粪水倒灌。**


    粪水从厕所往外反涌，里面混着粪便、垃圾，还有很重的味道，一直蔓延到屋外公共区域。我这个房子是 2000 年以前装修的，有大量柚木地板和木质装修，因为全屋泡过粪水，陆续出现发霉、胀裂、开裂、腐烂，最后电路也出了问题，房子已经没法正常居住。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_0_1.png)


    [插图：1 月 27 日粪水倒灌现场]，实际现场过于精彩，就不放大图了最开始找人粗'
  - '[PAGE 1]


    估，修复大概要五六万元。后来我把损失拆成 17 项，正式报了 68,555.20 元。几个月后，物业保险回复的定损价格，合计只有 17,846.20 元。从
    68,555.20 元，到 17,846.20 元，中间直接少了 50,709 元，只剩大约 26%。


    这件事前后经历 8 个多月的博弈。最后，我实际拿到了 67,555 元赔付，也是一个超过市场预期的赔付金额。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_1_0.png)


    [插图：9 月 23 日 67,555 元最终到账] 期间我也找过律师。一位专业比较匹配的律师了解情况以后，认为如果事实和材料比较充分，这个案子本身不算特别复杂，我可以考虑自己起诉。如果由他们完整代理，一审最低大概
    25,000 元，二审还要 12,500 元起，找他代理的话，不划算。


    我后来甚至去百度地图找很小的律所，有些门面看起来真的跟“小卖部”一样，本来想着这种一万多能不能做，结果问下来，没想到 6～7w 元的案子人家根本不接，嫌浪费时间。


    此时的我感叹普通人维权之难，时间、法律知识、金钱、胆量、心智、谈判都要一起叠 Buff！ 所以后面大量事情，都是我自己结合 AI 一步一步做的：从现场留证、整理损失，到准备沟通、投诉、起诉材料、检查协议，再一直跟到钱实际到账。


    下面我按真实过程把这 8 个月重新拆解一'
  - '[PAGE 2]


    遍。


    # 一、在 AI 的配合下，执行现场留证及责任厘清


    1 月 27 日下午，物业通知我们家里“爆屎渠”了。我回到房子以后，看到的已经不是普通漏水。粪水从屋内厕所往外反涌，里面混着粪便、垃圾和污物，一直蔓延到屋外公共区域。


    当天家人先开始清理，我也把室内受损、屋外公共区域、物业处理过程这些东西拍下来。第二天，也就是 1 月 28 日，厕所又翻涌了一次。除了屋里的情况，我后面还继续拍了楼下化粪池、检查井、开挖和处理过程，把当时能看到的设施状态尽量留住。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_2_0.png)


    [插图：屋内污染 / 木地板损坏]：实际现场过于精彩，就不放大图了'
  - '[PAGE 3]


    ![](img/99fc997c705869be0f6bd9e9965c8d04_3_0.png)


    [插图：化粪池、检查井或施工现场]：实际现场过于精彩，就不放大图了事故一发上，我已经开始在豆包里问这个事情（为什么不用其他 ai，不用 gpt？因为我认为豆包在处理国内常规事件会有更接地气的数据资料，而不是国外的模型。


    我最开始问得非常直接：


    > > 我家里爆屎渠了，我家里全是柚木地板，现在应该地板全部都废了。我现在可以怎么争取我的合法权益，争取最大赔偿？'
  - "[PAGE 4]\n\n![](img/99fc997c705869be0f6bd9e9965c8d04_4_0.png)\n\n我家里爆尿了，我家里全是柚木地板，现在这块地板全部都废了。我现在可以怎么争取我的合法权益，争取最大赔偿\n\
    \n已完成思考，参考 27 篇资料\n\n# 爆尿柚木地板全损维权指南：争取最大赔偿\n\n# 核心要点速览：\n\n+   - 立即止损 + 固定证据（现场视频/照片\
    \ + 排泄物样本 + 物业记录）\n+   - 快速锁定责任方（物业/楼上业主/开发商），责任不清时并追责\n+   - 全面主张直接损失 + 间接损失，柚木地板按重置成本索赔\n\
    +   - 协商→投诉→诉讼三步走，诉讼时申请司法鉴定，费用由败诉方承担\n\n# ⚠️第一步：紧急处理与证据保全（黄金 48 小时）\n\n| 时间 |\
    \ 关键行动 | 操作要点 |\n|---|---|---|\n| 立即 | 止损 | 1. 关闭家中水电，防止损失扩大\n2. 联系物业紧急处理，保留沟通记录\n\
    3. 转移贵重物品，避免二次污染 |\n| 0-2 小时 | 固定证据 | 1. 视频+照片：拍摄污水来源、水位高度、污染范围、柚木地板损坏状况（特写+全景）\n\
    2. 记录日期时间、天... \n3. 保留排泄物样本，用密封袋保存好，标注日期 |\n| 2-24 小时 | 书面通知 | 1. 向物业提交书面告知，说明情况、损失初步清单\n\
    2. 要求物业出具事故原因鉴定和处理记录\n3. 同时通知楼上业主，保留通知凭证 |\n| 24-48 小时 | 专业评估 | 1. 联系装修公司/地板商出具损坏评估\n\
    2. 保留柚木地板购买合同、发票、安装记录 |\n\n证据保全禁基：不要在责任未明确前自行清理现场，不要丢弃排泄物，不要签署免责文件。\n\n# ✓ 第二步：责任认定（核心关键）\n\
    \n# 1. 常见责任方与判定标准\n\n| 责任方 | 承担责任情形 | 法律依据 |\n|---|---|---|\n| 物业 | • 未按合同的定期疏通管道\n\
    • 发现堵塞未及时处理\n• 管道维护不当导致破裂 | 《民法典》第 942 条：物业服务人应维护物业服务区域内的基本秩序，采取合理措施保护业主的人身、财产安全\
    \ |\n| 楼上业主 | • 不当使用管道（丢弃纸巾、抹布、猫砂）\n• 私改管道导致排水不畅\n• 无法确定具体侵权人时，已入住业主共担责任 | 《民法典》第\
    \ 1165 条：行为人因过错侵害他人民事权益...应承担侵权责任 |\n| 开发商 | • 房屋在保修期内（通常 5 年）\n• 管道设计/施工缺陷导致破裂\
    \ | 《建筑工程质量管理条例》第四十条：给排水管道保修期为 2 年 |\n\n[插图：第一次向豆包提问的截图]然后现场每多出现一个问题，我就继续往下问：哪些地方一定要拍，物业人员来了以后要留什么，化粪池、检查井和公共排污设施之间是什么关系；柚木地板泡过粪水以后损失怎么记录，清理、消毒、防水、电路这些后面要不要算进损失。AI\
    \ 前期给我的作用，主要就是不停提醒我还缺什么。现场照片、视频、物业沟通、受损区域以及后续清理和施工过程，只要当时没留下，现场一清掉，后面就很难再补回来。\n\
    \n通过一轮取证和豆包给出的分析结论，可以确定我是 100% 无责任，而物业必须承认 100% 的事故责任！"
  - '[PAGE 5]


    具有有以下几点原因（篇幅太长，下面只作关键概述）：


    +   1、公共化粪池/管网属于物业的法定维护范围，这是法律强制规定。


    物业服务人应当按照约定和物业的使用性质，妥善维修、养护、清洁、绿化和经营管理物业服务区域内的业主共有部分，维护物业服务区域内的基本秩序，采取合理措施保护业主的人身、财产安全。


    本次事故的源头是**公共化粪池堵塞导致粪水倒灌**，故障点完全发生在业主共有设施范围内，天然属于物业的法定维护责任范畴，这是责任认定的基础。


    +   2、物业存在明确、可举证的管理失职，过错是完全的。


    **核心物证：化粪池主清掏口被违规封闭** 清掏口是化粪池日常维护、疏通时的必备设施，被封闭后客观上无法开展正常的清掏作业。这直接证明物业长期无法履行维护义务，管理失职是既成事实，不是“没做好”，是“根本没法做”。


    +   3、**你方无任何致害行为**：你没有私自改造公共排污管道、没有向管道排放建筑垃圾/异物等可能导致管网堵塞的行为；对方也没有任何证据能证明你存在过错。


    +   4、**不存在不可抗力**：本次事故是长期维护缺失逐步导致的，不是地震、特大暴雨等不能预见、不能避免的自然灾害。


    现场处理完以后，下一步，就是把这些损'
  - '[PAGE 6]


    失真正算成钱。


    # 二、把五六万元粗报价拆成 17 项正式索赔清单


    现场处理以后，接下来要解决的就是修复问题。当时找熟人装修队粗略看过+打过价，房子要恢复下来，大概需要五六万元。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_6_0.png)


    粗略报价截图


    根据我做过的超过 400 场的宴会项目的经验告诉我，不能真拿这张草稿纸去跟物业和保险谈，肯定不能只说一句：“修房子大概要 6 万。”对方只要问一句“这 6
    万是怎么算出来的”，后面就很难继续。


    如果一场宴会最后总价就算 是 5 万元，肯定不会只写：“宴会：50,000 元。”正常都会继续往下拆分为多个小项：


    +   菜品多少钱，

    +   桌椅多少钱，

    +   灯光多少钱，

    +   布置多少钱，

    +   人工多少钱。


    最后这些项目加起来，才是总价。'
  - '[PAGE 7]


    表格内容因图像模糊/分辨率过低无法完整识别，显示为工程损失清单表格，包含序号、项目、面积/数量及计算说明等列。


    这是用 codex 打开的表格，有些乱，请不要介意所以这次我也按同样的方式处理。我把前面已经留下来的房屋损失、现场照片和需要恢复的区域交给 AI，先把地板、木作、墙面、清理消毒、防水、电路等拆成可以逐项核对的损失项目，再根据房屋实际情况去核哪些确实存在、哪些应该合并，以及对应的修复价格。'
  - "[PAGE 8]\n\n![](img/99fc997c705869be0f6bd9e9965c8d04_8_0.png)\n\n你能识别图中黑体中文？\n\
    \n这张纸是印在人民币（纪念钞 / 纸币）上的，背景的黑体 / 印刷体中文字（水印 / 票面文字）识别如下：\n\n完整可识别的印刷文字（从右到左 / 正序）：\n\
    \n1. 年份与生肖：2026 乙巳年\n2. 地域与内容：香港宋韶光彩色通勝日（“通勝”即通书 / 黄历，“勝”是“胜”的繁体）\n3. 月份：1月大（“大”指大月，31\
    \ 天）\n4. 金融机构：中国人民银行（票面核心黑体字，人民币标准水印 / 票面文字）\n5. 数字：10（对应 10 元面额的特征）\n6. 拼音：LAN（“人民银行”拼音的末尾部分）\n\
    \n补充说明：\n\n- 手写部分是用户填写的维修 / 损失报价单，背景的印刷字是人民币（10 元贺岁钞 / 流通钞）的票面水印 + 日历通胜的印刷内容，其中核心黑体中文为：\n\
    \  - 中国人民银行（最核心的黑体字）\n  - 2026 乙巳年、香港宋韶光彩色通勝日、1月大 等辅助印刷字\n\n需要我帮你把这份手写的损失报价单，整理成一份可直接发给物业的结构化索赔清单（含金额汇总、法律依据提示）吗？\n\
    \n房间衣柜 这几个字 能识别出来？\n\n能，“房间衣柜” 这四个字清晰可辨，我给你逐字确认：\n\n- 第 1 个字：房（左右结构，“户 + 方”，手写笔顺清晰）\n\
    - 第 2 个字：间（“门 + 日”，字形标准）\n- 第 3 个字：衣（独体字，笔画明确）\n- 第 4 个字：柜（“木 + 巨”，手写体辨识度高）\n\n\
    这四个字是这份浸水损失清单的二级大标题，下面列的就是衣柜相关的拆除、制作、安装等维修项目。\n\n补充：这一行完整原文\n\n*：房间衣柜 （前面的星号是手写的序号标记，不影响识别）\n\
    \n需要我把这份手写清单里所有衣柜相关的项目、单价、金额，整理成一份干净的表格吗？\n\n实际上这个表格也不是我做的，我只是把我的疑问、需求告诉豆包，然后由豆包直接给出方案、报价，然后我复制粘贴到\
