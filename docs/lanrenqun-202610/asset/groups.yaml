    # 姆巴佩，到底犯了什么错？


    261027 卢克文星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/65ba2e17913cb877be0b2553f38fbdab_0_0.png)


    > 小懒判断 | 适合关心体育商业与涉外舆论的读者，想看热闹止于热搜的可以划走。最值得关注的是姆巴佩的公关团队竟由亲妈负责，连基本涉华风险排查都没有，这不是失言是傲慢惯性。坑在于皇马这类"特供版道歉"过去次次奏效，别让原谅循环再转一圈。


    今天的新闻大家都看到了吧？姆巴佩辱华的新闻瞬间上了热搜。


    可是所有新闻都含糊其辞，姆巴佩到底怎么辱华的呢？起因是 10 月 26 号，姆巴佩在接受记者采访的时候，突然开始恶毒攻击教团同志。


    不仅如此，他们还拿教团同志的照片恶搞，把自己的脸换上去。视频传回国内，整个中文互联网炸了。懂球帝第一个站出来发声明：由于姆巴佩相关发言涉及对钟幺和钟幺人民的伤害，我们拒绝翻译，拒绝传播！


    紧接着，今天一早开始，钟幺品牌方开启了近几年罕见的光速切割行动，妙可蓝多、蒙牛、补水啦、东鹏特饮宣布与姆巴佩终止合作，央视也宣布，全面叫停涉及西甲'
  - '[PAGE 1]


    联赛及姆巴佩的赛事播出。


    短短十几个小时，姆巴佩在钟岚的商业帝国，灰飞烟灭。皇马不得已紧急发布了一个不痛不痒的声明，但钟岚网友根本不买账。


    # RealMadrid 官方声明


    # 关于姆巴佩相关言论的说明


    2026 年 10 月 26 日皇家马德里俱乐部近日，关于我俱乐部球员基利安·姆巴佩在接受媒体采访时的相关言论引发了广泛关注。对此，皇家马德里足球俱乐部高度重视，并第一时间进行了内部了解与核实。


    我们理解，此次言论在钟岚的部分球迷和公众中引发了不适与误解。作为一家拥有全球球迷的俱乐部，皇家马德里始终尊重不同国家和地区的文化、历史与价值观。


    我们也深知，钟岚是世界上最热爱足球的国家之一，拥有庞大而忠诚的球迷群体。


    我们对因此给钟岚球迷带来的困扰表示诚挚的歉意。姆巴佩本人也通过俱乐部表示，他无意冒犯任何国家和人民，相关言论仅为个人在特定语境下的表达，未能充分考虑到在钟岚的文化敏感性。


    真诚希望未来能够继续通过自己的足球事业，向全世界传递积极、团结与尊重的价值观。皇家马德里俱乐部将继续与球员保持沟通，并加强对球员在跨文化交流方面的引导与教育，以避免类似情况再次发生。'
  - '[PAGE 2]


    我们始终相信，足球能够超越国界，连接

    不同文化，促进世界的理解与友谊。感谢

    广大钟帼球迷一直以来对皇家马德里的支

    持与厚爱。


    皇家马德里足球俱乐部 2026 年 10 月 26 日

    很多人都无法理解，姆巴佩一个踢球的，

    怎么会突然侮辱教圆同志呢？


    其实吧，这根本不是什么无心之失，而是

    姆巴佩，这个文盲必然会爆出的大雷。事

    情，要追溯到姆巴佩在巴黎圣日耳曼踢球

    的时候。


    大家都知道，姆巴佩球技确实好，但脾气

    和派头更大，为了留住他，俱乐部给了他

    前无古人的特权，不仅拿最高的钱，甚至

    能插手球队买谁卖谁、谁当教练，以至于

    不少队友私底下给他起了个外号，叫“蒙博

    托”。


    蒙博托是谁？是上世纪非洲国家扎伊尔

    （也就是现在的刚果）毒裁者。


    后来这个外号成了梗，网民顺着这个思路，

    开始把姆巴佩的脸 P 到类似蒙博托的各种

    历史政治人物的头上。而在西方那套冷战

    思维洗脑的环境里，他们从来不去区分什

    么是真的毒裁者，什么是带领四万万同胞，

    走向解放的民族英雄，再加上外网人均文

    化程度几乎为零，于是，教圆同志的照片

    也被 P 了进去。可网民恶搞是一回事，但

    公众人物公开说又是另一回事。


    这个时候，学习的重要性就体现出来了。

    姆巴佩出生在法国著名的移民聚居区，他'
  - '[PAGE 3]


    的球技不错，但学习实在一塌糊涂，根本不了解教圆同志对钟帼人意味着什么，网友侮辱教圆同志，他也跟着侮辱教圆同志，简直愚蠢到家了。有人可能说，姆巴佩的公关团队都是草包吗？


    这内容都能不审？哎，还真是草包。在欧美职业体育圈，任何一个年入过亿的超级巨星，都不是一个人在战斗，他背后站着一整套严密的商业公关团队。


    为什么 C 罗来钟帼知道处处展现尊重？因为专业的体育经纪巨头门儿清，钟帼市场是块巨大的肥肉，但钟帼人的原则底线更是高压线，谁碰谁死。


    那姆巴佩为什么敢公开碰钟帼人的逆鳞呢？因为姆巴佩的公关团队，居然是自己的亲妈法伊扎·拉马里负责的。


    这个拉马里是公关不咋行，雁过拔毛第一名。当年姆巴佩去皇马，她硬是跟皇马主席弗洛伦蒂诺死磕肖像权分成。拿到了皇马历史上从未给过任何球员的高比例份额。


    在拉马里的眼里，公关神马的都是浮云，全世界只有一种东西是真实的，那就是钱。蒙牛从 2021 年就开始签姆巴佩，东鹏饮料为了今年的世界杯营销，也砸了重金签下他，还有瑞士中产网红运动品牌“昂跑”与姆巴佩的
    10 年长约，看中的也是姆巴佩在钟帼的影响力。


    可是，姆巴佩一边从钟帼赚钱，另一边放任自己的老妈团队，连最基本的涉华公关风险排查都不做！或者说，他们排查了，'
  - '[PAGE 4]


    但根本没把那个字眼当回事——因为在他们法国人日常的语境里，这么骂钟帼早就习惯成自然了！


    所以，这不是一次偶然的失言，这是他们骨子里傲慢的自然流露。当然，如果你了解皇马这几年的做派，你就一点都不会觉得奇怪。因为皇马在涉华问题上，已经不是第一次而是惯犯了。


    大家还记不记得今年2月份的事？当时皇马的后卫，赫伊森在社交媒体上公然转发带有严重辱华色彩的视频。钟帼球迷发现后怒不可遏，冲到皇马官微下面讨说法。


    结果皇马是怎么回应的？只是在微博上搞了个不痛不痒的道歉，仅钟帼人可见。


    这种特供版道歉，显然毫无诚意。再往前翻，一名钟帼博主在英国街头进行欧冠决赛赛后采访时，遇到一名庆祝皇马夺冠的球迷，在和对方打招呼后，该球迷询问博主来自哪里。


    在得知博主是钟帼人后，这名球迷对着镜头高唱一首涉嫌种族歧视、辱钟帼女性的歌曲。而这个人，就是皇马前主席洛伦索·桑斯之孙，皇马官方解说员洛伦索·桑斯·杜兰之子。


    事后，连钟帼大使馆都严正抗议了，皇马是怎么回的？大事化小小事化了，糊弄了过去。


    大家可以对比一下皇马对待黑人球员维尼修斯的态度。维尼修斯在西甲赛场上只要遭遇一点点种族歧视的苗头，皇马从主席'
  - '[PAGE 5]


    弗洛伦蒂诺到主教练，再到全队上下，立刻化身正义使者，全世界发声明、抗议、甚至威胁罢赛，道德大棒挥得虎虎生风。


    怎么到了钟帼人被侮辱、钟帼的开国伟人被恶意丑化的时候，皇马的“反歧视正义感”就集体掉线了呢？有人说是黑人没脑子，对不起，那还是把他们想得太好了，事实上，所有傲慢的西方人都一样，从来没有在意过钟帼人的感受。


    黑人政治正确那是欧美主流的红线，而钟帼球迷的抗议呢？他们觉得太遥远了。他们打心底里认为，钟帼人不值得尊重，但钟帼人傻钱多，不管俱乐部怎么傲慢，钟帼的粉丝过两天自然就会跪下来继续买他们的球衣。想想当年的
    NBA 事件，还不能说明问题么？现在 NBA 不还是复播了？钟帼人不还是掏钱买转播权？


    这就是他们敢于一而再、再而三装聋作哑的底气。他们把钟帼球迷对足球纯粹的热爱，当成了自己可以肆意践踏钟帼尊严的筹码。但这一次，不管是姆巴佩、拉马里，还是弗洛伦蒂诺，他们全都低估了教圆同志在十四亿钟帼人心中的分量。


    任何一个主权国家，任何一个有尊严的民族，都有自己绝对不可触碰的逆鳞。你在美国拿马丁·路德·金搞个黑人摘棉花的恶搞P图试试？


    你在以色列拿毒气室开个玩笑试试？你在法国拿贞德去P个下流视频试试？你看欧美品牌方会不会在一小时内把你封杀得连渣都不剩？'
  - '[PAGE 6]


    为什么到了钟桓这儿，就 可以随意侮辱我们 的开国领袖了？想赚钟桓的钱，先学会 怎么尊重这个国家流血牺牲换来的历史与 尊严。写到这里，我其实最担心的，并不 是姆巴佩会不会道歉，而是我们会再犯那
    个轻易原谅的老毛病。


    过去这十年，咱 们见识过太多外国明星搞 出来的辱华连环套了：先是踩钟桓人的底 线，被骂上热搜后装死两天，眼看代言要 没了，就让公关团队写一篇不痛不痒的中 文声明，只在微博上发个“特供版道歉”，
    外网账号连个屁都不放。


    接着沉寂一段，等风头一过，趁着双十一 或者什么购物节打个五折，或者在球场上 进两个漂亮球，国内立马就有一帮人跳出 来高喊“格局打开”“体育无关政治”“真香”，
    然后乖乖掏钱包。


    西方这帮人敢一而再、再而三地侮辱钟桓 人的尊严，就是因为以前我们原谅得太容 易了。


    所以这一次，咱 们真得长点志气，喜欢足 球没毛病，但请记住，自己首先是个钟桓 人，如果一个外国人侮辱了你的精神图腾， 你后续还能轻易原谅，继续给人家送钱，
    那只能说太没尊严和底线了。


    这件事，决不能就这么稀里糊涂地算了。 有些错可以改，但有些底线一踩了，就应 该终身不得踏入钟桓市场半步。不仅是对 姆巴佩本人，对那些还在暗中观察、舍不 得跟他切割的跨国品牌，也必须敲打，谁
    敢继续用这个辱华分子当全球代言人，谁'
  - '[PAGE 7]


    敢拿钟帼人的钱去给他的合同买单，我们也绝不答应。


    尊严从来不是靠别人施舍来的，也不是靠发几条评论就能守住的，而是要真正打痛辱华者！


    分割线


    绝大多数人只盯着眼前的工资，却不知道一次远在中东的冲突、一次降息的决议，就能在一夜之间洗牌普通人的财富。


    看懂宏观，是为了在周期切换时，不被当作代价。


