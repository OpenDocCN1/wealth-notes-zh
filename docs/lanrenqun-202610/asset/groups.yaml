    政府方面也要上强度，上海、新加坡、韩国有老字号认证+升级资助的路子，香港可以学。不是白养情怀、硬撑该淘汰的店，而是让真正有味道的老店用新方式活下去。有些老店本身就有文化价值，值得当城市资产来保护。


    最后做个小结。其实消费者从来都是这样，你把他当客人，他反复来，你把他当提款机，他吃完就走，头都不回。这是最朴素的道理，花钱买的是尊重，不是买气受。


    香港餐饮现在还不是完全衰落，但它已经出现了明确的征兆，当香港人用脚投票去了深圳，当本地人自己都不愿意进老牌馆子，这个趋势只会加速，不会回头。港剧的黄金年代回不去了，港餐如果还活在过去快速周转、压缩体验、爱来不来的模式里，那真的回不去了。


    能把顾客拽回来的，不能仅靠怀旧，该改还要改，该学习就要学习。


