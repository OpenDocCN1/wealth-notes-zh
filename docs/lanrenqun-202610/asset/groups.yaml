  - '[PAGE 0]


    # 中国大飞机往事（运十篇）


    261023 青云读书会

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/a134b72693634c301b2b41ead3f1fbe1_0_0.png)


    小懒判断 | 适合对中国航空工业史和大国博弈感兴趣的读者，想搞明白 C919 为什么来得这么晚的人更该看。不适合想看技术参数拆解的航空迷，这篇讲的是人和命运。最值得关注的是运十下马的真相：不是技术不行，是
    1979 年后"军队要忍耐"、民航要创汇的大环境把它活活饿死了。坑在于别把运十神化，它离成熟的干线客机还差着几轮迭代，失败不等于路线错误。


    1971 年，中华人民共和国重返联合国，全世界的聚光灯，打在了乔冠华那张仰天大笑的脸上。


    但在那个举国欢腾的时刻，有一个很尴尬的细节。中国代表团去纽约参加联合国大会，竟然没有一架能飞越太平洋的飞机。


    最后协调了一圈，代表团不得不先乘坐苏制的伊尔-62飞机，起起落落，辗转数千公里到巴黎，然后全体人员下机，踱珊地拿着行李，换乘法航波音707，才能飞越大西洋抵达纽约。


    这不只是麻烦不麻烦的问题，因为是否拥有自己的大飞机，是一个国家综合国力的象征。1955 年 7 月，艾森豪威尔向赫鲁晓夫展示了自己最新的洛克希德 VC-121E
    专'
  - '[PAGE 1]


    机，这架飞机巨大且优雅，就连一向高傲的赫鲁晓夫看完也沮丧不已，事后悄悄吐槽：“我的专机跟人家的比起来，就像一只虫子。”


    受了刺激的赫鲁晓夫回了国，转头就把航空工业部部长捷明杰夫叫了过来，下达了一个死命令：


    不管你用什么办法，马上给我搞一架大飞机出来！


    赫鲁晓夫一发言，苏联整个航空工业体系马上爆发出了惊人的效率，只用了一年时间，从图16轰炸机基础上发展而来的图-104喷气式客机，就飞上了蓝天。


    这架巨大的喷气式客机一经问世，马上成了世界的焦点，每飞一地都会引起轰动。也正因为如此，图-104成了赫鲁晓夫心爱的玩具，到哪儿都要带着。1958年，这架飞机载着赫鲁晓夫来到了中国。


    那时候中苏关系还没有破裂，苏联人慷慨地答应了中方关于参观飞机的请求，有关部门赶紧抓住机会，组织航空设计人员前来学习取经。然后，所有人被震撼了。


    后来的运十副总师、C919专家组组长程不时至今难忘那一天：“从来没见过这么大的飞机，像恐龙般庞大，像燕子般轻盈。”


    当时参观的队伍里，还有一个来自哈尔滨飞机制造厂的年轻技术骨干，他叫马凤山。


    他没想到，就是这次参观，会让他和大飞机产生如此惨烈的命运纠缠，直至流干最'
  - '[PAGE 2]


    后一滴眼泪。


    马凤山和运十的故事，就此开始。1970年7月，毛泽东视察上海期间说了一句话：“上海工业基础这么好，可以造飞机嘛。”7月28日，空军航空工业领导小组召开紧急会议，向三机部(主管航空工业的第三机械工业部)传达指示：上海要搞飞机，具体搞什么，请三机部及时与上海联系。


    按照三机部一开始的计划，是把320厂研制的歼-12飞机交上海生产，也算落实指示了。但上海革委会则提出，要搞就搞“旅客机”(大飞机)，作为国家领导人的专机使用。


    一个月后，国家计委、军委国防工业领导小组正式下达任务：研制中国自己的大型喷气式客机！任务下达的时间是1970年8月，所以这个项目被命名为708工程，也就是后来的“运十”。


    当时，负责统筹此事的上海革委会定下了一个基调：


    这架飞机，不仅要能装下100名以上的乘客，还要能跨越大洋，不仅要能飞到欧洲，还要能不加油或一次加油飞到美洲，保障国家领导人参加国际会议。于是，一群被历史选中的人，踏上了征途。


    这群人的领头羊，就是马凤山。如果要在中國航空史上选出一个如同“芯片史上张汝京”一样兼具悲情与理想主义色彩的人物，那一定就是马凤山。


    马凤山出生于无锡，和所有经历过战火的初代工程师一样，他的骨子里刻着对“落后'
  - '[PAGE 3]


    就要挨打”的深切恐惧。在接手运十之前，他刚刚在西飞圆满完成了图-16 轰炸机的仿制工程，也就是轰-6。


    也就是说，我们如今唯一的战略轰炸机轰-6T，其实也算是马凤山的遗泽。


    为什么选马凤山呢？运十筹备组想得很简单，苏联人可以从图-16 基础上发展出图-104，中国也可以在轰-6 基础上发展出自己的运十嘛！


    放眼全国，还有谁比马凤山更熟悉轰-6？就这样，马凤山莫名其妙地被调到了 708 项目组。


    可是马凤山一报到，就被筹备组的脑洞惊呆了：啥？


    你们要把轰炸机改成国家领导人专机？开什么玩笑？说个冷知识，军标和民标完全是两个标准，你拿按军标生产出来的轰炸机去搞客机，那安全怎么保证？


    别看苏联拿图-16 搞出了图-104，可你要不要看看图-104 的事故率呢？图-104 服役期间，一共摔了 16 架，摔死了 1140 人！这么高的事故率，能拿来当领导人专机吗？


    所以，马凤山坚决反对轰-6 改的方案，而是主张参考波音 707 的吊挂式四发下单翼布局，走美式大飞机路线。


    不过问题又来了，当时中美还处于敌对状态，关于波音 707 啥资料都没有，总不能再从 0 开始摸索吧？巧了，1971 年，一架巴基斯坦的波音 707 客机在新疆降落时冲出'
  - '[PAGE 4]


    跑道，严重受损，没法再飞了，巴方将这架残骸留在了中国。


    这架残骸，成了马凤山团队眼里的无价之宝。


    整整一个月时间，在新疆的寒风中，马凤山带着人，几乎是拿着放大镜趴在那架残骸上，一点点摸索现代大飞机的结构布局。


    后来有人拿这个事污蔑运十是山寨波音707，这完全是无稽之谈。大飞机的结构布局都是公开的，航空工业不存在“尺子量一量就能造”的逆向工程，因为就算给你一架完好的飞机，你也量不出材料的内部应力，量不出气动参数，更量不出飞控系统。


    就连波音公司的副总裁斯坦纳都承认，“运十不是波音707的翻版，更确切地说，它是中国发展其设计制造运输机能力十年之久的锻炼成果。”当然，这都是后话了。


    解决了布局总体方向的问题后，剩下的问 题，就是怎么把飞机造出来。为了这架飞机，上海全市甚至全国的研发力量和工业体系都被动员了起来，21个省市、262个单位、数万名科研人员，像支援前线一样，把最好的材料、最好的人才送到了上海。


    在上海龙华机场那个破旧的机库里，3000多个全国抽调来的优秀年轻人，用计算尺来手算数据，用圆规和尺子画飞机图纸。


    夏天的上海闷热潮湿，蚊虫肆虐，为了防止汗水滴在图纸上，他们就在脖子上缠上毛巾，闷着画图。'
  - '[PAGE 5]


    配套厂家更是拼命。上海汽车附件厂，原本是做汽车配件的，在没有任何航空工业基础的情况下，居然开始研发中国第一台大推力涡扇发动机——涡扇-8，而且最后居然还造出来了！


    1972 年开始试制涡扇 8，由于配装的运 10 飞机停研，于 1986 年停产。上海无线电二厂，原本是做收音机的，负责做机载气象雷达，探测距离 250 公里。


    上海液压件一厂，原本是做减震器的，负责做飞机主液压泵、操纵系统助力器和起落架液压系统。上海鼓风机厂，负责做客舱空调、热交换器。


    上海仪表厂，负责做高度表、空速表、地平仪、自动驾驶仪、全机传感变送器。


    还有重庆的冶金部 112 厂，没日没夜地研制出了中国第一块超大规格的航空铝合金预拉伸厚板。


    西安 172 厂，硬生生用落后的机床，铣出了长达十几米的机翼大梁。


    那是一个真正意义上的举国体制，没有人在乎奖金，没有人在乎加班，所有人眼中只有那一架银白色的钢铁巨鸟。


    不过，相比技术困难和条件困难，来自革委会的瞎指挥，才是运十真正的拦路虎。根据 1973 年运十的正式立项文件，运十项目由上海市统一领导，所需技术业务、建设投资和物资保障由三机部负责组织协调。


    这就有点麻烦了，因为当时主政上海的是'
  - '[PAGE 6]


    <!-- no content -->'
  - '[PAGE 7]


    <!-- no content -->'
  - '[PAGE 8]


    道上加速，速度越来越快，机头昂起，主起落架猛地脱离地面。飞起来了！


    这只重达 110 吨的钢铁巨鸟，在没有任何外国专家指导、没有任何图纸参考的情况下，凭借着中国人的智慧和血汗，稳稳地飞向了长空。


    机场上爆发出海啸般的欢呼声，无数工程师抱头痛哭。马凤山在塔台里转过身，泪水顺着他纵横交错的皱纹流下，十年的心血，十年的磨难，终于成功了！然而，马凤山没想到的是，首飞成功，仅仅是运十磨难的开始。


    其实，运十的命运，在首飞的当天，就已经决定了。国产大飞机首飞典礼这么重要的事情，按理来说应该邀请高层领导参加吧？但当时，高层领导、三机部，以及民航部门的要员们，竟然无一到场。


    从全国大报到地方小报，都对运十的首飞保持了一致沉默。


    为什么会如此？运十首飞时，王洪文已经倒台四年了，但运十毕竟是他当年推动搞起来的，那个时刻谁支持运十，有可能被扣上“立场有问题”的帽子。


    还有一个更深层次的机制问题。按说，大飞机工程，应该由三机部主抓。但现实呢？因为种种原因，却是上海在主抓。


    这里面的利益纠葛，可就太复杂了，一句两句根本说不清楚。仅仅从主管航空工业的三机部领导缺席运十首飞，就能看得出来这里面的门道了。'
  - '[PAGE 9]


    <!-- no content -->'
  - '[PAGE 10]


    从技术角度看，是有道理的。一是运十立项于 1970 年，对标的是当时世界的主流——波音 707 这种采用“窄体、单通道、四台发动机”布局的大型客机。


    可是，等运十造出来，已经是 80 年代了，西方已经开始进入了“宽体、双发、大涵道比”的时代，无论是空客 A300 还是波音 767 都是如此。


    双发意味着更低的维护成本和油耗，宽体（双通道）意味着舒适的乘坐体验。运十在设计理念上，已经落后了整整一代。二是运十始终没有完全搞定发动机。


    上海的确搞出了国产涡扇-8 发动机，这在当时的中国绝对是一个奇迹。但由于当时中国在耐高温合金材料、精密铸造工艺上的落后，涡扇-8 的推重比、燃油效率和使用寿命，根本无法和西方同期产品相提并论。


    所以为了保证试飞，运十最终挂载上天的，其实是波音 707 原装的 TT3D 涡扇发动机。


    也就是说，即便运十能够量产，它的核心动力依然受制于人。


    三是运十和西方客机比相对笨重。


    飞机本身的重量越轻，能装载的乘客和货物就越多，航程就越远，航空公司就越赚钱。但 70 年代，中国还没有航空级铝合金，更缺少大型水压机来锻造大尺寸的整体机身部件。


    马凤山为了飞机安全，在材料强度不够的'
  - '[PAGE 11]


    情况下，只能用最笨的办法解决——加厚、加粗，这就导致运十的机体结构重量严重超标。同样大小的飞机，运十空机重量比波音 707 重 3 吨，但商业载荷却差太远了。


    波音 707，22.7 吨满商载可飞 6800km 以上，15 吨商载航程超 10000km，运十 15 吨商载可飞 6400km，满 25 吨商载航程仅
    3150km。在巨大的生产力差距下，我们对自身工业能力产生了怀疑和自卑。


    那时中国的大门打开，外面的世界像潮水一样涌了进来。中国人第一次看到了彩电、冰箱，第一次看到了波音 747 和麦道客机。


    那种巨大的落差感，让很多人产生了深度的技术自卑，一种“造不如买，买不如租”的思潮，开始像瘟疫一样在决策层和航空界蔓延。


    在“造不如买”派的人看来，运十虽然飞上天了，但它太费钱了，而且看起来不如波音、麦道那么“洋气”。同样是花钱，如果引进一架美国的波音客机，意味着巨大的政绩（引进了世界先进水平），意味着领导满意，更意味着“和国际接轨”。


    既然如此，干嘛要自己辛辛苦苦、费时费力地去造飞机呢？运十身上，的的确确有各种无法回避的缺陷，但如果只算经济账就推动运十下马，毫无疑问也是不合理的。


    用最高标准的西方商业规则，去苛求一个在特殊时期艰难活下来的项目，这公平吗？


    这就好比让一个刚生下来的孩子立马去参加奥运会，能赢么？难道只是因为赢不了，'
  - '[PAGE 12]


    就要把孩子掐死吗？任何一个大国的航空业，都不是一出生就完美无缺的。


    伟大的工业产品，不是在图纸上画出来的，而是在无数次的商业使用中，一点点迭代出来的。


    只有让它飞起来，让航空公司去用，设计团队才能发现问题，才能继续改进。但是，你从一开始就不给钱，不让它飞，它怎么可能迭代呢？这不是个死循环么？


    第一代运十确实费油、落后，但只要运十这个平台还在，我们可以先去跑货运嘛；等中国冶金工业突破了，我们就把运十的结构变轻；中国发动机突破了，我们就给它换上更省油的心脏；最后，我们完全可以基于运十的气动数据，研发出中国人自己的双发宽体客机！


    以上只是运十下马明面上的原因，更隐秘的原因是麦道的搅局。麦道派来的人叫Thomas C. Chang，中文名张镇中，是个美籍华人。


    相比那些外国人，张镇中显然更了解中国传统文化和人情世故。他西装革履，风度翩翩，举手投足间带着美国跨国巨头的高级精英光环，骨子里却把当时部分领导急功近利、好大喜功的心理，摸得透透的。


    于是，一个叫“合资经营”的大饼画好了。


    张镇中是这么说的：“现代航空工业讲究的是国际分工，你们为什么非要闭门造车呢？来看看我们麦道吧！'
  - '[PAGE 13]


    我们不仅可以把最先进的麦道-82 客机卖给你们，我们还可以合作生产。


    我们在上海建立一条总装线，麦道出图纸、出零件、出技术指导，你们负责组装。


    这不仅能解决你们缺飞机的问题，还能让你们直接学到美国最先进的航空制造管理体系，搞好了，这个项目就是航空业的桑塔纳！”


    市场换技术、国际先进水平、航空业的桑塔纳......这些诱惑，在那个年代，哪个领导能抵抗？


    可是，天下哪里有免费的午餐？张镇中虽然谈笑风生，但提了个条件，麦道要在中國建立组装线，运十必须下马。他的理由是，上海飞机制造厂的组装车间太小了，根本放不下两条大飞机的生产线。


    如果要迎接麦道-82 组装线，就必须把运十生产线拆了，腾出厂房。张镇中知道虽然运十很困难，但整条生产线还在，几万件工装设备还在，800 人的核心设计团队还在。


    只要这些底子在，中国大飞机的火种就随时可能重燃，麦道就没法在中国市场一家独大。


    所以对麦道来说，运十必须死！更何况，对国内个别领导来说，下马运十，上马麦道，还有额外的好处。


    比如，出国。80 年代，出国可是一件极其让人羡慕的事情，只要买了国外飞机，意'
  - '[PAGE 14]


    味着大量的人员培训、考察、接机，这是一条令人垂涎的利益链。


    当时民航部门某领导曾对运十团队很直白地说：买一架美国飞机，有 200 个去美国考察的名额，你们搞运十，能给我什么？虽然这话是私下说的，但很微妙地反映了当时民航部门对运十的态度。是啊，一穷二白的运十团队，什么也给不了。


    所以在中央征求意见时，他们给运十挑了一堆毛病，结论是：民航不可能要运十。既然最终客户都说肯定不会买了，那研制运十还有必要吗？


    肯定没有了嘛！


    但上海市不愿意就这么放弃，请来三机部的航空专家召开运十飞机论证会。会议结论是：运十飞机经过研制单位和协作单位的共同努力，做了大量工作，培养了一支设计、工艺、研究、管理队伍，现在运十飞机已经有了很好的起点，有了这个基础，将来就可以发展各种类型的民航飞机。


    这个队伍和基础建立起来不容易，停下来损失太大。就算是民航部门不要，也可以改成货运飞机嘛！如果军队有需要，那就作为军用运输机嘛！专家们给出的建议是，运十飞机的研制工作不要停，队伍不要散，成果不要丢。


    会议结束后，上海市向国务院上报了论证会的情况，报告建议运十应走完研制全过程，取得完整的技术成果，并提出把第三'
  - '[PAGE 15]


    架已订货零部件组装成机的建议。


    但这份报告上报后，还是石沉大海了。 1982 年初，上海市计划委员会和市国防工办又向国家计委做了报告，请求立即回复和继续完成第三架飞机的研制工作，并表示上海可承担一半研制经费（约
    1100 万元），但仍未获批复。


    1983 年 10 月，上海再次申请运十 03 架飞机散件总装所需的 3000 多万元经费，国家计委召开专题会议研究，会上财政主管部门提出了一个扎心的意见：运十要变成商品，不是花
    3000 万元的问题，还要较大的投入，而且没有用户买，现在再投钱，无法产生效益。


    这次会议没有形成会议纪要，会后，国家对运十研制再未投入资金。尽管从未形成正式的下马运十的文件，但从张镇中踏入中国的那一刻起，运十的结局可能就已经注定。


    这期间，上飞还在想尽各种办法为运十项目输血，保证试飞，包括联系港澳地区的贸易公司，通过帮他们运输衣服来挣试飞的油钱，甚至还在 1984 年西藏地震后，运十还作为全国唯一大运力运输机承担了抗震救灾物资运输任务，借此来证明运十的性能绝无问题。


    截至 1984 年 10 月，运十先后多次转场 7 个城市，共飞行 107 架次/155 小时，最远航程 3600 千米。马凤山带着团队，拿着详尽的试飞数据和后续发展报告，一次次地跑北京，一次次地敲开各个部门的门，苦'
  - '[PAGE 16]


    口婆心地请求恢复拨款。


    可是，迎接他们的，是不解的冷眼，还有永远的“再研究研究”。


    1985 年 2 月，运十因为资金耗尽，正式停飞。


    2 个月后，那位力推运十下马的某领导，因涉嫌腐败问题正式落马。运十距离命运的转机，可能只有 2 个月时间，如果运十能再坚持 2 个月，也许一切结果都会不同。但是，命运没有如果。


    这架曾经在蓝天上翱翔、寄托了无数人梦想的银色巨鸟，被拖到了厂房外的一片荒地上，任由风吹日晒。运十被拖走的那一天，马凤山仿佛瞬间苍老了十岁。


    每天傍晚，人们都能看到一个佝偻的身影，独自一人走到那片荒草地里，静静地站在运十的起落架旁。他不说话，只是用长满老茧的手，一遍又一遍地抚摸着冰冷的金属蒙皮，就像一个无能为力的父亲，抚摸着自己即将被送上断头台的孩子。


    他知道，这不是停飞一架飞机，这是在掐断一个国家向高端制造业攀登的机会。


    而这个机会，未来将要用几代人的血泪、数以亿计的真金白银，才能艰难地弥补回来。


    但他无力回天。他在荒地里守着被遗弃的孩子，一直守到拆毁运十生产线的日子到来。'
  - '[PAGE 17]


    那些耗费巨资采购的工装设备、那些用汗水画出的设计图纸、那些凝结了中国最高端制造智慧的模具，被当成废铁和废纸，毫不留情地被拆除。现场甚至还开展了劳动竞赛，好像生怕耽误美国飞机进来的时间。


    那一天，天空的雨异常冰冷。老一辈的航空工人站在雨里，看着电焊枪切割掉运十03机的大梁，看着自己辛辛苦苦调试出来的设备被一一拆除，很多人哭出了声。


    几个老钳工一边怒骂着“败家子！”一边死死抱住被拆下来的机器，死活不肯松手，直到被人强行拉开。而这一幕，马凤山都不敢去现场看。


    连串的打击、巨大的悲愤、抑郁和长期积劳成疾，彻底击垮了这位硬汉，他的肝病迅速恶化。


    到了80年代末，马凤山已经瘦成了一把骨头。


    医院的窗外，时不时传来外国客机的轰鸣声，每一次轰鸣，都像是用生锈的钝刀子在割他的肉。到了弥留之际，马凤山已经神志不清了。


    他死死地抓着医院发黄的床单，手指在空中虚弱地比划着，他的嘴唇微微颤动，家属凑近了，才听清他最后的呢喃：“运十，还能飞……”1990年4月24日，一代航空巨匠马凤山，带着无尽的遗憾和不甘，永远地闭上了眼睛，享年61岁。


    西安是他的躬耕地，大场是他的五丈原。'
  - '[PAGE 18]


    因为运十没有最终定型，为国家航空事业熬干最后一滴血、流干最后一滴泪的马凤山，没评上院士，也没拿到任何国家级奖项。


    最终，只能躺在龙华公墓里，和那架倾注了他一辈子心血的运十飞机，相距 15 公里遥遥相望。没有盛大悼念，没有铺天盖地的报道，只有他曾经带领的那批老工人和工程师们，在灵堂里哭得撕心裂肺。


    运十飞机设计师、后来的 ART21 飞机副总设计师周济生写了一篇祭文，写给马凤山，也写给了运十：


    稚嫩的运十，也许您飞得太高了！您那羽毛未干的翅膀哪能经得起高处的严寒！天真的运十，也许您飞得太快了！您那涉世未深、略显肥胖的身躯怎能躲过明枪暗箭！


    孤独的运十，您没有兄弟姐妹，您天马行空，独往独来！高傲的运十，您难道不知道“树大招风”和“满招损，谦受益”的道理吗，您为什么要锋芒毕露、咄咄逼人？


    可怜的运十，您身陷绝境，任凭风刀霜箭之摧残，却连半点儿反抗也没有。可悲的运十，您沉冤未昭雪，可您却痴心不改，仍然执着地想着报效祖国。


    运十停飞了，但运十的故事，并没有结束。


    因为历史的车轮，在最泥泞的绝境里，悄悄转动了一下。


    2000 年 7 月 12 日，在以色列国防部办公室里，以色列向中方代表宣布了一个消息：'
