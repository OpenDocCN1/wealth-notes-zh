    > > 小懒判断 | 适合已在做虚拟资料、正处在"能出单但做不大"阶段的人；想抄爆品的新手先别看，这篇讲的是二年级复盘。最值得关注的是三个"本可以"的遗憾，尤其盲目涨价那段——GMV=访客×转化率×客单价，缺流量时涨价只会更糟。坑在于：作者的选品优势来自她多年用户运营手感，照搬她的赛道没有她的调研习惯，很难复现。


    兄弟姐妹们 大家早上中午晚上好~我是千酱🙋‍♀️ 今年是我的虚拟资料二年级，第一年做出了月入5位数的成绩 正好在爆发期之前入局，让我在第一年没有看到一些问题，后面进入平峰期，问题就暴露出来了，热度褪去，我才有机会从经营的角度真正的看清这门生意，今年9月又一个保研季的结束，我带着今年的总结和复盘来了。


