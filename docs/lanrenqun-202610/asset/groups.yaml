    这个背后的含义，是公司的议价权较好。所谓的自动化核心部件及运动控制系统业务，是埃斯顿为各类自动化与智能装备提供底层驱动与控制能力。


    工厂所需的流水线、机床、工业机器人，想要有配合地运作，就需要有运动控制系统、伺服系统、数控系统以及其他相关配套。


    这些软硬件就是智能制造装备的大脑、神经和肌肉。公司的主要业务及产品包括金属成形机床自动化完整解决方案、运动控制系统、机器人专用控制器、机器人专用伺服系统、机器视觉和运动控制一体的智能控制单元解决方案。


