    还在继续的事升。一般来说，价格的上涨显示需求依然大于供给，而最大的 AI 芯片公司未来 18 个月的产能已经被订购一空。


    由此，我们很难得出确切的结论，称 AI 半导体的需求强势不可持续（图二）。尽管如此，我们追踪的半导体周期继续从高位下行。


    这个现象我们在六月中旬发下半年展望报告的时候，已经为读者预警过了，也是我们预测半导体泡沫在下半年破灭的重要论据之一。如今，半导体泡沫如期崩裂，我们试图在这次下行的轨迹中继续能够在更短的时间窗口里寻找交易性机会。


    在如此动荡的市场里，我们在试图成就这种看似几乎不可能的功业。


    我们的职业素养呼唤着我们的努力，毕竞，还是有很多散户投资者套在了六月中的半导体泡沫高位之上。


