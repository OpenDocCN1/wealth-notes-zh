    这个见仁见智可以讨论。


    毕竟华尔街的叙事控制下，韩国几个存储公司明年都是 3 倍的 PE 了。这个世界很魔幻，这就是金融炼金术吧。


    回到核心问题，对中国有没有信心，对中国摆脱国外叙事控制影响，对金融掌控也好，定价权也好有没有信心。


