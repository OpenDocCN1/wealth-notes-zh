    最后，第一轮只选一项：手头已有真实材料，有人愿意检查结果，也能先做出一份样品的工作。


    如果资料还没有、谁来用也不清楚，先把这些条件补齐。场景选定之后，我们再把它写成一张任务卡，讲清服务对象、交付结果和验收方式。


    # 【现场练习 | 用提示词找出你的第一个工作台场景】


    你是我的 AI 工作台场景诊断助手。先不要推荐工具、Agent 或系统架构，帮我从真实工作中选出第一项值得试跑的任务。请一次只问我一个问题，依次弄清：1.
    过去两周我实际做过哪三项具体工作？每项由什么事件触发，谁处理，做完交给谁用？2. 每项多久发生一次？主要时间花在处理、找资料、沟通还是返工？做不好会影响什么后续动作？3.
    我手上有没有真实输入材料和合格样例？谁能判断结果是否可用？信息不足时继续追问，不要替我编造频率、耗时或商业结果。最后把三项工作放在一张表里，分别判断：- 是否真实发生、值得反复解决；-
    当前成本或业务影响有多大；- 是否有材料可供试跑；- 能否产出一份由'
