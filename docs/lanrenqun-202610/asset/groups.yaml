  - '[PAGE 3]


    再比如，2023 年，《英国临床心理学杂志》上发表了一项分析，专门研究表达性写作的长期效果。研究者发现，表达性写作的效果，是“延迟但持久”的。写完当天，你可能感觉更差，因为你刚刚直面了自己最不愿面对的东西。一周之内，可能也没什么变化。但一个月之后，效果开始显现。6个月，甚至更久之后，抑郁、焦虑、压力的改善仍然持续存在。


    研究人员认为，也许是因为这个方法的效果是“延迟”显现的，但人们期待的是“写完当天就舒服了”，因此它很难大范围流行。


    彭尼贝克说，表达性写作的作用方式，更像是一场悄悄发生的内部重建，而不是一剂立即见效的镇痛药。它在你感觉不到的时候，正在改变你大脑里某些事情被存储和加工的方式。听到这，有人可能会说，假如说“自我表达”有用，那么我直接说出来不就好了，为什么一定要用“写”的方式呢？


    关于这个问题，彭尼贝克有三个解释。


    第一，写作，是大脑在“换挡”。我们的大脑其实非常怕“混乱”。那些没说出口的委屈、压抑的愤怒、说不清的焦虑，就像一团乱麻堵在你脑子里。你觉得自己没有想它们，但你的大脑其实一直在为此悄悄消耗能量，去压抑它、回避它、防止这些焦虑冒出来。这就导致你虽然什么都没干，但你的大脑依然会觉得很累。


    而书写这个动作，是在帮你把那些模糊的、纠缠不清的情绪，转化为清晰的、外显的、'
  - '[PAGE 4]


    有顺序的文字。你写字的时候，大脑会从“杏仁核主导的情绪反应模式”，慢慢切换到“前额叶主导的理性加工模式”。简单说，就是从“被情绪控制”切换到“我控制情绪”。


    **第二，写作的倾诉程度，比口头表达更彻底。** 因为你说话的时候，对面大概率有个“听众”。你要顾及对方的反应，你要组织叙事让别人听得懂。这些看似微不足道的顾虑，其实一直在影响你的表达。这就导致你说出口的，未必百分百是你的真实想法。


    但你写的时候，你只面对自己一个人。可以完全诚实，可以毫无遮拦，写完你甚至可以撕掉、删掉、扔掉，不给任何人看。这种“完全无顾虑”的表达，是口头倾诉几乎做不到的。


    **第三，写作不是“宣泄”，是“整合”。** 很多人以为，情绪不好就应该“发泄”出来，比如痛哭一场，跟朋友抱怨。但心理学研究发现，仅仅是宣泄，用处其实很有限。反复跟朋友抱怨同一件事，甚至会强化痛苦，这个现象叫“共同反刍”。


    而表达性写作的核心是整合。按照彭尼贝克的观点，写作是在给你的情绪一个“地址”。你之前的痛苦没地方安放，所以它到处乱窜，凌晨三点冒出来搞你。写下来之后，它有了一个可供安置的地方，白纸黑字，放在那里，大脑就不用再时时刻刻监视它了。


    情绪之所以反复折磨我们，未必是因为它强大，可能是因为它“无家可归”。'
  - '[PAGE 5]


    大脑对未完成的事情有一种天然的执念，心理学上叫“蔡格尼克效应”，就是未完成的任务会一直占据你的工作记忆，直到它被处理掉。写下来这个动作，本质上是在告诉大脑：这件事已经被处理了，可以从待机状态退出了。


    好，讲了这么多原理。那么，具体可以怎么做呢？


    彭尼贝克曾经提出过一套便于执行的基础版方案，在这里念给你听听。


    首先，每天固定一个时间，写20分钟。主题是，你一生中最令你痛苦或最让你困扰的经历。重点写你当时的和现在的，最深层的想法和感受。


    规则有几条，第一，不管拼写、不管语法、不管逻辑。假如写不下去，就重复写上一句话，直到20分钟到。哪怕整整20分钟你都在翻来覆去写同样几句话，也算完成。


    第二，不要给任何人看。这是写给自己的。写完你可以撕掉、删掉、扔掉。第一读者也是最后一位读者，都只有你自己。


    第三，写完当天可能会难受。这是正常的。彭尼贝克反复强调，如果你写完当天心情低落，说明你真的写到自己心坎里了。坚持写下去，效果会在晚些时候显现。


    具体坚持写几天呢？彭尼贝克的建议是，4天，4天之后就停。表达性写作不是每天都要做的日记。彭尼贝克建议的是“周期性介入”，遇到一个新的痛苦，就写一个周期，也就是4天，然后写完就停。关于“写什'
  - '[PAGE 6]


    么”，彭尼贝克还有一个建议。他发现，光是写“我很难过”“我很愤怒”这种情绪标签，效果其实很有限。真正有效的写作，需要同时包含两个维度：一是你的感受，二是你对这件事的思考和理解。换句话说，不只是“我当时有多痛”，还要写“这件事为什么让我这么痛苦”“它对我来说意味着什么”“现在回头看，我又是怎么样理解这件事的”。感受加上意义，才构成完整的整合。


    彭尼贝克建议，假如你有一些日常的小烦恼，可以试试表达性写作。借用他的原话，“那些令你辗转反侧的情感波澜，也许是最好的写作起点。”


    假如你对彭尼贝克的方法感兴趣，可以看看他的代表作《写出来感觉好多了：改善身心健康的表达性书写》。这本书的中文版今年刚刚出版，得到就有电子书。


    在这里也要强调一句，表达性写作是一个心理自助方法，不等同于心理治疗。如果有严重的抑郁症、创伤后应激障碍，写作可以是辅助手段，不能替代专业治疗。另外，如果一个人写完之后，痛苦持续超过一周还在加深，请暂停，寻求专业帮助。


