    \n### 先说之前做教辅的经历\n\n一开始，我想做质量更好的教辅资料。配图不是装饰，而是用来帮助孩子理解知识点的，所以准确性是底线，一点都不能出错。\n\
    \n这也是制作过程中最费力的地方。\n\n这是我们之前的成品，在小红书陆续有人下单。\n\n![](img/29459bbf58f17207ed8e84307d362f75_1_0.png)\n\
    \nAI 生成的图解，经常整体看起来不错，仔细检查却发现某个细节画错了。但放在教辅里，错误的图可能直接影响孩子对知识点的理解。\n\n所以只能继续改、重新生成、再检查。\n\
    \n我一直力求精益求精，希望做出比同类资料更好的质量。但同行的价格低、资料量大，我做得慢，数量也不占优势。\n\n三个月下来，教辅资料的销售额大约 1000\
