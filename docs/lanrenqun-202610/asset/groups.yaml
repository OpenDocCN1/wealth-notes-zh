    些大数字，抵达每一个正在做决定的普通人。


    理解这个机制，我们以后再去看每天的经济新闻，也许会多一层不同的感受。当你看到“美联储宣布维持利率不变”这样的消息，可以多想一步，这句话说出口之后，有多少人会因此觉得经济会更平稳，于是放心消费、继续投资？而这些人的反应，又会不会反过来让经济真的更加平稳？


    那些大数字，从来都不是从天上掉下来的。它是你和我的决定，加在一起的结果。


