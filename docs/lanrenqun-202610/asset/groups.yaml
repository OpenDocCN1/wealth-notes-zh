    - 3、后来我一方面放 KIMI 给推荐了，具体找什么律师比较好，另一方面我就直接打开百度地图搜索“律师”。当然我也是清楚，我们的案件金额不高，然后我非常明确我100%对事件没有责任，所以可能找一些最普通的律师就可以了。


    但是万万没想到，直接就会碰壁！ 因为律师所一般会在全广州最高级的写字楼办公（这些律师我们肯定请不起，所以直接忽略），也会在一些老旧大厦里面。同时我


    想起来，平时在街边路过会看到一些所谓的很简陋的“律师事务所”，所以我就让 KIMI 直接推荐一些。


