  md: "\n## 03 年女生写老年赛道，单账号纯赞赏 2 万 +：我如何从煽情文走向长期内容\n\n261010 副业 SC 精华  \n整理：公众号懒人搜索，懒人专属群精选\
    \  \n懒人微信：lazyhelper1\n\n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_0_0.png)\n\n\
    小懒判断 | 适合在写情感号/老年号但赞赏上不去的人，不写老年赛道的也能借她那套选题 5 问打分法（人群/问题/验证/人设/素材，低于 6 分不写）。最值得关注：她给\
    \ Codex 的完整提示词原文贴出——素材不够就停、判断必须人来做。坑在于：煽情模板和“未接来电”假通知短期有数据，但换不来重复赞赏，2 万+靠的是“说的就是我”。\n\
    \n大家好，我是一妮，03 年出生，今年刚毕业。\n\n很多人第一次知道我在写老年赛道，都会问同一个问题：你一个二十出头的年轻人，连退休是什么感觉都不知道，凭什么写五十多岁、六十多岁的人？这个问题，我没法用“共情”两个字糊弄过去。因为我确实没退过休，也没有亲历过退休金到账后怎么分、身体一天天变化、子女离开家以后屋子突然安静下来，这些都不是我的亲身经历。\n\
    \n但就是这样一个年轻人，在老年赛道做出了一个纯赞赏超过 2 万元的账号，过去 4 年累计写了上百万字，测过历史、军事、情感、剧评、养老金、房地产等多个方向，也写出过几十篇\
    \ 10 万+及以上的文章。\n\n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_1_0.png)\n\n（老年赛道账号的阶段性赞赏截图，累计金额已超过2万元）\n\
    \n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_1_1.png)\n\n（部分文章的赞赏和重复支持记录）\n\n可我想先说一句不那么好听的：这个结果并不是因为我一开始就懂中老年人，更不是因为用了\
    \ AI，突然就掌握了他们的情绪。我也写过很虚的感悟，盯过看起来很热闹的流量套路，甚至一度以为，只要把文章写得够煽情，用户就会买单。\n\n真正的转折，是我不再问“怎么把老人写哭”，而是反过来问：屏幕另一边到底坐着一个什么样的人？他今天正在烦什么？他有哪些话想了很久，却没有人替他说出来？\n\
    \n这篇文章想要带给大家的，不是“AI 怎么写青年文”，也不只是“老年赛道还能不能做”。我更想讲清楚：一个 03 年的年轻创作者，怎么从模仿、煽情和试错里，一点点学会理解一群比自己大三四十岁的读者，再把验证过的经验交给\
    \ Codex 稳定执行。\n\n回头看，我的成长路线其实很清楚：先模仿有流量的形式 → 开始看评论、看用户和生活场景 → 从煽情内容转向具体问题 → 用阅读、留言和赞赏验证判断\
    \ → 最后才把这套经验放进 Codex，做成可以反复执行的内容流程。\n\n### 一、我没有退休经历，怎么开始理解五六十岁的人\n\n### 第一段成长：先承认自己其实不懂\n\
    \n我从 2022 年开始做公众号。一开始我什么都写，爆过一些文章，也做过一堆写着写着就停掉的方向。做久了才会承认：偶尔爆一篇，和真正跑通一个赛道，完全是两件事。\n\
    \n前者可能是蹭到了热点，标题刚好戳中人，甚至就是运气好。后者则需要你对同一类人的问题有足够长时间的观察，知道什么能写、什么不能碰，还得让内容持续产生阅读、互动或收入。\n\
    \n我最早认真注意到老年赛道，是看到辰风老师在生财分享的相关内容，加上一来老师在群里提供的信息。那个时候我才发现，中老年人一直都有内容需求。真正的问题是，大部分年轻创作者习惯用自己的想象，去代替他们的真实生活。\n\
    \n这恰恰是我当时最大的问题。\n\n年轻人说孤独，容易想到没人聊天；五六十岁的人面对的孤独，可能是老伴在旁边，两个人却不知道还能说什么；也可能是孩子打来电话，他明明有很多话，开口还是只问“吃了吗”，因为怕自己说多了成为负担。\n\
    \n年轻人说“要爱自己”，往往会想到旅行、悦己和情绪价值。但对很多准退休和已退休的人来说，爱自己也许先是一件很实际的事：子女再一次开口要一笔大钱时，自己敢不敢先留下看病的备用金；膝盖已经不舒服了，还要不要帮着长期带孙辈；口袋里有存款，为什么每花一笔钱还是会心虚。\n\
    \n### 第二段成长：不再想象用户，开始收集真实样本\n\n之前一直不知道怎么才叫真正理解用户的心理，闭上眼睛想象自己变老了。其实是一种很虚的表象，真正看起来有用的恰恰是数据。我去收集他们反复经历的处境，一点点搞清他们做选择时受什么约束。就这样，我做了这三件事。\n\
    \n- 第一，收集 30—50 篇同赛道高阅读文章，不只抄标题。我会记录它写的是哪一类人，他正在经历什么，标题把哪个冲突放大了，评论区的读者反复提到什么。有时候正文写得一般，评论区的一句“我不是舍不得花钱，是怕以后管孩子要”，反而更接近真实需求。\n\
    \n- 第二，把父母、亲戚和后台读者当作样本，不把他们当作一个抽象人群。我会看他们反复聊的是钱、身体、子女，还是夫妻关系；他们真正难受的地方，是问题本身，还是那种“我不知道该怎么开口”的别扭。只有这些细小的差别，才能看出文章是像一个人在说话，还是像年轻人站在外面教老人过日子。切记不要写成说教的语气。\n\
    \n### 第三段成长：一轮轮测试，用数据结果来下定论\n\n- 第三，小批量测试，不靠一篇爆文给自己下结论。我先测夫妻陪伴、晚年生活、人生感悟几个方向。同一个需求会换标题、换场景再试，至少连续测三次，再和账号近期文章的中位数比。这样才能分清，到底是需求不成立，还是标题和表达没有写对。\n\
    \n我还有一个很实用的检查：把文章里“退休、养老、晚年”这些词全删掉，剩下的人物、顾虑和动作，还像不像一个五六十岁的人？如果删完只剩“珍惜当下、活出自己、善待自己”，那这篇文章看似温柔，其实根本没有写到他们的生活里。\n\
    \n### 二、我走过的弯路：从煽情，到愿意长期做的内容\n\n### 第一个阶段：我先学会了怎么拿到点击\n\n刚进入这个赛道时，我也会被一些数据很猛的形式吸引。比如“未接来电”“你收到了一条消息”，或者一开口就是“亲爱的”“老伴”“往后余生”。\n\
    \n它们不是完全没有用。在某个阶段，它们确实可以让用户快速点进来，也容易制造情绪。可越写我越不踏实：如果一篇文章必须让读者误以为自己真的收到了通知，才能换来一次点击，这个点击很难变成长久的信任。\n\
    \n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_5_0.png)\n\n过去常见的“未接来电”式内容案例，情话模板也一样。刚看时会觉得很感人，但当几百个账号都在写“这辈子最幸运的事就是遇见你”，内容就会越来越像一封找不到收件人的情书。读者当下可能被触动，过一会儿却记不住是谁写的，更不知道为什么下次还要回来看看。\n\
    \n### 老年情感类内容的典型呈现\n\n| 日期 | 标题 | 阅读 | 赞 | 备注 |\n|---|---|---|---|---|\n| 星期五\
    \ | 亲爱的，心里就踏实 | 2523 | 34 |  |\n| 星期四 | 亲爱的，好想陪着你 | 2.0万 | 219 | 3个朋友读过 |\n| 12月24日\
    \ | 亲爱的，不见面都惦记你 | 1.7万 | 346 | 3个朋友读过 |\n\n### 第二个阶段：数据有了，我却越写越不踏实\n\n那段时间，我终于开始区分两件事：让一个人难受，和真的理解一个人，完全不是一回事。制造情绪不难。把衰老、疾病、子女不回家、老伴离开这些词堆在一起，文章很容易显得“有感情”。难的是往前再走一步：他看完以后，是不是更明白自己的处境？有没有一个可以拿走的判断？明天能不能真的做点什么？\n\
    \n所以我后来从偏情绪表达的“老年情感”，慢慢转向更有具体问题、个人判断和生活办法的“老年感悟”。情绪还在，但文章不能只剩情绪。\n\n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_7_0.png)\n\
    \n### 我后来转向的老年感悟类内容示例\n\n### 第三个阶段：从写一封情书，变成解决一个具体问题\n\n以前我可能会写“老伴，谢谢你陪了我这么多年”。现在我会再问一层：“老两口退休后天天待在一起，为什么反而更容易吵架？”前一句是对的，但它可以放在任何账号。后一个问题里面，有具体的生活阶段，有相处方式突然变化以后的冲突，也有机会。\n\
    \n“晚年要学会爱自己”也是一样。这句话没有错，可它对一个正在被子女借钱、又担心自己生病的人来说，太轻了。如果把它改成：子女提出大额用钱需求时，先把自己的医疗备用金和至少一年的生活费单独留下，再讨论能帮多少。这时候，“爱自己”才从口号变成一个真正能执行的选择。\n\
    \n我现在主要围绕几条线来写：退休金、存款、医保和旅行预算这类“退休账本”；慢旅行、兴趣、学习和日常秩序这类“退休生活”；睡眠、劳损、体检和就医准备；夫妻、子女、父母照护和隔代育儿的边界。\n\
    \n这些东西没有哪一个是仅靠一句煽情的话就能写透的。但也正因为难，它才有可能从一次性的热闹，变成一个读者愿意反复回来的账号。\n\n### 三、赞赏超过2万以后，我才真正理解读者为什么愿意付钱\n\
    \n### 第四个阶段：我开始用赞赏，区分“感动”和“信任”\n\n刚开始做时，我以为文章只要足够感人，用户就会赞赏。后来数据看多了，我才发现不是这样。\n\
    \n有些文章阅读量不错，留言也很热闹，赞赏却不高。它把人的情绪调动起来了，但没有建立更深的关系。也有些文章阅读没有那么夸张，赞赏却更集中。这往往意味着，它不一定打中了最大范围的人，但打中了一群处境非常具体的人。\n\
    \n我后来把这种差别想明白了：感动只是触发情绪，赞赏更常发生在读者确认“你真的理解了我，还替我说出了一直不知道怎么说的话”以后。\n\n### 读者愿意赞赏，往往经过了三层感受\n\
    \n第一步是看见他。不要只写“老年人很孤独”，要让读者看到一个人傍晚自己吃饭，看到孩子打电话总说忙，看到老伴不在以后，屋里连一点声音都显得太大。我写完开头会回头看一遍：前\
    \ 300 字里，到底有没有一个能被看见的人？如果只有道理，那么文章还没有真正开始。\n\n第二步是替他表达。不只说“要珍惜老伴”，而是把那种年轻时总觉得日子还长、到两个人头发都白了才发现最该认真道谢的人一直坐在身边的心情，真正写出来。然后把全文最重要的那句话单独拎出来看：它是不是只是一句谁都会同意的正确道理？如果是，我还要继续改。\n\
    \n第三步是给情绪一个出口。我不想让读者看完只剩下对衰老、失去和孤独的害怕。所以文章到最后，我会尽量给一个今天就能做的小动作，跟老伴认真说声谢谢，把体检报告、药物清单和过往不适放到同一个文件袋，单独留好一笔应急金，或者问问他们对于这篇主题的看法。\n\
    \n这也是我现在对“流量”更踏实的理解。流量不只是大词、情绪和冲突。对老年内容来说，它往往来自一种非常强的“这说的就是我”。标题把人带进来，第一屏让他确认没有被骗，正文再把他自己模糊的感受说清楚。阅读、转发、留言和赞赏，也就不再是四个完全无关的数字。\n\
    \n### 四、一个老年选题值不值得写，我现在会怎么判断\n\n### 选题不靠“有感觉”，先看有没有可写的人和事\n\n过去我也会凭感觉选题，看到一句话觉得“好像很感人”，就开始往下写。这种做法最容易出现的问题，就是写到一半才发现，自己根本不知道这篇文章在帮谁解决什么。\n\
    \n现在我会先用 5 个问题把它拦一遍，每题 2 分，总分 10 分。这张表不追求看起来专业，它只负责逼我不要用情绪代替判断。\n\n| 检查项 | 我会先问清楚的问题\
    \ |\n|---|---|\n| 人群 | 到底写给刚退休、独居、夫妻同住，还是有一定积蓄的准退休人群？ |\n| 问题 | 他此刻卡在钱、身体、子女边界、夫妻相处，还是无效社交？\
    \ |\n| 验证 | 同类需求或标题过去是否出现过稳定的高阅读、转发、留言或赞赏？ |\n| 人设 | 当前账号的讲述者有没有对应的经历、观察和表达边界？\
    \ |\n| 素材 | 有没有人物、生活场景、冲突、数字、评论或可以核实的信息？ |\n\n8—10 分，我会进入写作；6—7 分，先补素材或调整角度；低于\
    \ 6 分，就先不写。这个分数不代表它发出去一定会爆，它只是帮我提前发现“根本没有东西可写”的选题。\n\n真正能带来流量的题，一般还要同时做到几件事：读者一眼能判断和自己有关；具体到他能在脑子里想象出一个画面；事情不解决会有什么现实代价，解决后又能多得到什么。还有一点很重要：这件事最好是他熟悉的，却从来没有人替他说透。\n\
    \n比如“晚年学会爱自己”，范围太大，读者不知道和自己当下有什么关系。“60 岁后，子女再开口要一笔大钱，这三笔钱别急着拿出去”，人群、冲突和利益就都出来了。\n\
    \n又比如“珍惜老伴”，不如“为什么退休后两个人天天待在一起，反而更容易吵架”来得具体。\n\n### 标题拉人进来，前 150 字必须把人接住\n\n标题出来后，我会看正文前\
    \ 150 字能不能立即接住。标题说的是子女借钱，开头却先讲一大段“人生苦短”，就算文字再顺，读者也会觉得被晃了一下。我有时会把标题和前 150 字单独给一个不了解全文的人看，只要对方的第一反应是“点进来好像不是这么回事”，我就会回去改。\n\
    \n发布以后也不靠一篇定生死。同一个核心需求，我会换三个标题、三个场景测三次。推荐正常、阅读偏低，先查标题有没有点击理由；阅读高、互动低，看正文有没有接住；阅读不高、赞赏却集中，说明人群窄但信任强，我会先换一个更大众的标题再测，而不是把整个方向丢掉。\n\
    \n### 五、Codex 真正参与的地方：不是代替理解，而是把理解固定下来\n\n写到这里，再说 Codex 才比较准确。很多人容易把因果关系说反：好像装好一个工具，AI\
    \ 就能猜中老年人在想什么，然后自动写出 10 万+。可如果我自己都说不清目标读者是谁、他卡在哪里、文章要给什么判断，工具只会帮我更快地生产空话。\n\n\
    我对 Codex 的定位很明确：它是资料整理员、内容策划、初稿执行者、质检编辑和数据复盘助手。但选哪群人、解决什么问题、采用什么判断、最后发不发，决定权一直在我手里。\n\
    \n### 第五个阶段：从“每篇重新想”，到把经验固定成流程\n\n以前这些标准都散在我的脑子里。状态好时，我记得先找场景，也记得删掉套话；赶稿或同时处理很多事时，就可能一上来先写正文，写了几百字才发现方向根本没想清楚。\n\
    \n我用 Codex 解决的第一个问题，就是不让内容质量跟着我当天的状态一起波动。现在的顺序是：先定人，再补素材；先把文章想清楚，再出初稿；最后由我修改、核实并决定是否发布。\n\
    \n### 在五个 AI 角色之前，先把账号里那个“说话的人”固定下来\n\n我在 Obsidian 里单独建了一份老年赛道人设文件。核心是一位 70 后准退休生活观察者：他从物流、工厂、供应链、基层管理或实体行业走来，父母正在变老，孩子逐渐独立，夫妻共同生活多年。他正在处理身体劳损、退休金安排、父母养老、子女成家和退休生活规划。\n\
    \n我会把年龄阶段、工作经历、家庭状态、经济状态、身体感受、核心需求、说话方式和内容底线这 8 项写清楚。比如他有退休金、存款或房产，但不是富豪；他会算账，却不会只谈省钱；他关心身体，但不用疾病恐吓读者；他说话慢、实在、克制，喜欢用具体账本和生活选择说明问题。\n\
    \n这份人设不是让 AI 装成一个老人，更不是鼓励我编造亲历。它是一条表达边界：这个人担心什么，哪些经历能支撑他的判断，什么话说出来会像年轻人硬模仿老人。只有这层约束在，后面的提示词才不会频繁更换。\n\
    \n### Codex 的第一个角色：资料整理员，把一堆对标变成可用素材\n\n我不会把一篇对标文章丢给 Codex，然后说“帮我模仿一篇”。这样最容易得到一篇结构很像、但没有自己判断的文章。\n\
    \n我会给它的原料包括：对标标题与正文、评论区真实表达、文章大概数据、我看完后的判断，以及能够支撑这篇内容的生活场景。然后让它分开整理：这篇写给谁，读者为什么点击，核心冲突是什么，什么只能参考、不能照搬，还缺哪些信息。\n\
    \n比如我想写“60 岁后子女再来借钱”，我会先放进 3—5 篇相关内容和一批评论。此时 Codex 不负责写正文，它先帮我把评论里反复出现的顾虑分出来：有人怕拒绝后伤亲情，有人怕自己将来看病缺钱，还有人根本不知道应该留多少。问题分开后，文章才知道应该详细写哪一个。\n\
    \n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_13_0.png)\n\n给 Codex 使用的样本库不是只存原文，还要标注分类、核心情绪、可借鉴点和风险点\n\
    \n### Codex 的第二个角色：内容策划，先把文章想清楚\n\n整理完素材后，我还是不让它立刻写全文。第二轮只做一份写作说明：目标读者是谁，这一篇只解决什么问题，文章最想说清哪一个判断，开头用哪个场景，中间靠什么素材支撑，结尾让读者做什么。\n\
    \n比如只知道“子女借钱要慎重”，却没有人物、借钱用途、家庭关系和可核实的资金安排办法，它就只能提醒我缺什么，不能自己补一个“真实案例”出来。\n\n###\
    \ Codex 的第三个角色：初稿执行者，但要先把上下文给齐\n\n到这一步，我才让 Codex 写正文。它拿到的不会只有一个题目，而是五样东西：固定人设、本次素材、已经确定的选题角度、我自己的判断，以及篇幅、语气和事实边界。\n\
    \n这里最容易被忽略的，是“我自己的判断”。如果这一项是空的，AI 会很自然地填入那些最安全、最常见的正确话，文章就又回到“要爱自己、要重视亲情、要留好退路”。我会先把自己的态度写成一句直白的话，再让它帮我展开。\n\
    \n### 我会保留的核心 AI 提示词\n\n请读取“高知退休生活赛道”的固定人设，再读取本次素材。不要直接写正文，先按以下顺序执行：\n\n- 1. 提炼对标文章的目标读者、点击理由、核心冲突、结构骨架和评论区重复出现的顾虑。\n\
    - 2. 检查素材里有没有一个具体人物、一个生活场景、一个冲突、一个转折和一个明确判断。缺少任何一项，只列出需要补充的内容，不要编造。\n- 3. 输出写作说明：目标读者、正在解决的问题、核心判断、开头场景、人物冲突、内容结构、可执行建议、待核实信息。\n\
    - 4. 提供 3—5 个标题，分别说明它们吸引的是哪类读者，不使用虚假通知或正文无法兑现的承诺。\n- 5. 我确认写作说明和标题后，再生成正文。\n\n\
    正文要求：\n\n- 开头 150 字内出现人物、处境或直接利益。\n- 全文只解决一个核心问题。\n- 每个重要判断后面，至少有一个动作、数字、账单、身体感受、评论或生活场景支撑。\n\
    - 删除过度整齐的排比、对仗和空泛总结。\n- 结尾给一个读者今天就能执行的动作。\n- 养老金、医保、医疗、法律和金融信息不得编造，不确定的内容标记为“待核实”。\n\
    \n本次素材：对标标题与链接：目标读者：读者卡点：评论区素材：可用场景：我的核心判断：需要核实的信息：\n\n这条提示词最重要的地方不是长，而是它把几个关键关口固定了：素材不够就停；文章没想清楚就先不写；人没有做选择，AI\
    \ 不擅自帮人做选择。\n\n### Codex 的第四个角色：质检编辑，专门找初稿里的漏洞\n\n初稿出来后，我不会只问“这篇文章写得好不好”。因为你问得越笼统，得到的答案也就越模糊，回答就像是客气的鼓励，用过\
    \ AI 的，懂的都懂。所以我会让它分开检查：标题的承诺有没有在前 150 字出现；文章是不是像年轻人在教老人生活，哪个观点后面没有素材；哪几句话过分整齐、像结论先行；哪些数字和政策需要核实。\n\
    \n最后还要我自己过一遍。AI 说某句有问题，不代表我一定要照改；它没检查出来，也不代表就能直接发。尤其涉及养老金、医保、医疗、法律和金融的内容，找不到可靠来源，就标出待核实或删掉。\n\
    \n### Codex 的第五个角色：复盘助手，把发布数据变成下一轮动作\n\n我会在文章发布 24 小时和 7 天后，记录推荐、阅读、点赞、在看、转发、留言、赞赏人数和金额，再把同类文章放在一起比。我不会直接问\
    \ Codex“这篇为什么没爆”，而是让它先把问题分层：推荐正常但阅读低，先查标题；阅读高但互动低，先查正文承接；阅读不高但赞赏集中，可能是人群偏窄但信任强，不要急着删掉整个方向。\n\
    \n复盘的结果必须变成下一次的一个小实验。例如保留正文换标题，保留选题换开头场景，或者继续写同一类用户，但把文章里的可执行办法写得更具体。一次只改一两个变量，下一篇的数据才能告诉我到底改对了没有。\n\
    \n### 用一个选题走完整流程：“60 岁后，子女再来借钱”\n\n这里用一个选题来给大家做演示操作。\n\n- 1. 先搜集 3—5 篇同类文章，把标题、正文、评论和可见数据放进素材库。\n"
  mdcn: "\n## 03 年女生写老年赛道，单账号纯赞赏 2 万 +：我如何从煽情文走向长期内容\n\n261010 副业 SC 精华  \n整理：公众号懒人搜索，懒人专属群精选\
    \  \n懒人微信：lazyhelper1\n\n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_0_0.png)\n\n\
    小懒判断 | 适合在写情感号/老年号但赞赏上不去的人，不写老年赛道的也能借她那套选题 5 问打分法（人群/问题/验证/人设/素材，低于 6 分不写）。最值得关注：她给\
    \ Codex 的完整提示词原文贴出——素材不够就停、判断必须人来做。坑在于：煽情模板和“未接来电”假通知短期有数据，但换不来重复赞赏，2 万+靠的是“说的就是我”。\n\
    \n大家好，我是一妮，03 年出生，今年刚毕业。\n\n很多人第一次知道我在写老年赛道，都会问同一个问题：你一个二十出头的年轻人，连退休是什么感觉都不知道，凭什么写五十多岁、六十多岁的人？这个问题，我没法用“共情”两个字糊弄过去。因为我确实没退过休，也没有亲历过退休金到账后怎么分、身体一天天变化、子女离开家以后屋子突然安静下来，这些都不是我的亲身经历。\n\
    \n但就是这样一个年轻人，在老年赛道做出了一个纯赞赏超过 2 万元的账号，过去 4 年累计写了上百万字，测过历史、军事、情感、剧评、养老金、房地产等多个方向，也写出过几十篇\
    \ 10 万+及以上的文章。\n\n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_1_0.png)\n\n（老年赛道账号的阶段性赞赏截图，累计金额已超过2万元）\n\
    \n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_1_1.png)\n\n（部分文章的赞赏和重复支持记录）\n\n可我想先说一句不那么好听的：这个结果并不是因为我一开始就懂中老年人，更不是因为用了\
    \ AI，突然就掌握了他们的情绪。我也写过很虚的感悟，盯过看起来很热闹的流量套路，甚至一度以为，只要把文章写得够煽情，用户就会买单。\n\n真正的转折，是我不再问“怎么把老人写哭”，而是反过来问：屏幕另一边到底坐着一个什么样的人？他今天正在烦什么？他有哪些话想了很久，却没有人替他说出来？\n\
    \n这篇文章想要带给大家的，不是“AI 怎么写青年文”，也不只是“老年赛道还能不能做”。我更想讲清楚：一个 03 年的年轻创作者，怎么从模仿、煽情和试错里，一点点学会理解一群比自己大三四十岁的读者，再把验证过的经验交给\
    \ Codex 稳定执行。\n\n回头看，我的成长路线其实很清楚：先模仿有流量的形式 → 开始看评论、看用户和生活场景 → 从煽情内容转向具体问题 → 用阅读、留言和赞赏验证判断\
    \ → 最后才把这套经验放进 Codex，做成可以反复执行的内容流程。\n\n### 一、我没有退休经历，怎么开始理解五六十岁的人\n\n### 第一段成长：先承认自己其实不懂\n\
    \n我从 2022 年开始做公众号。一开始我什么都写，爆过一些文章，也做过一堆写着写着就停掉的方向。做久了才会承认：偶尔爆一篇，和真正跑通一个赛道，完全是两件事。\n\
    \n前者可能是蹭到了热点，标题刚好戳中人，甚至就是运气好。后者则需要你对同一类人的问题有足够长时间的观察，知道什么能写、什么不能碰，还得让内容持续产生阅读、互动或收入。\n\
    \n我最早认真注意到老年赛道，是看到辰风老师在生财分享的相关内容，加上一来老师在群里提供的信息。那个时候我才发现，中老年人一直都有内容需求。真正的问题是，大部分年轻创作者习惯用自己的想象，去代替他们的真实生活。\n\
    \n这恰恰是我当时最大的问题。\n\n年轻人说孤独，容易想到没人聊天；五六十岁的人面对的孤独，可能是老伴在旁边，两个人却不知道还能说什么；也可能是孩子打来电话，他明明有很多话，开口还是只问“吃了吗”，因为怕自己说多了成为负担。\n\
    \n年轻人说“要爱自己”，往往会想到旅行、悦己和情绪价值。但对很多准退休和已退休的人来说，爱自己也许先是一件很实际的事：子女再一次开口要一笔大钱时，自己敢不敢先留下看病的备用金；膝盖已经不舒服了，还要不要帮着长期带孙辈；口袋里有存款，为什么每花一笔钱还是会心虚。\n\
    \n### 第二段成长：不再想象用户，开始收集真实样本\n\n之前一直不知道怎么才叫真正理解用户的心理，闭上眼睛想象自己变老了。其实是一种很虚的表象，真正看起来有用的恰恰是数据。我去收集他们反复经历的处境，一点点搞清他们做选择时受什么约束。就这样，我做了这三件事。\n\
    \n- 第一，收集 30—50 篇同赛道高阅读文章，不只抄标题。我会记录它写的是哪一类人，他正在经历什么，标题把哪个冲突放大了，评论区的读者反复提到什么。有时候正文写得一般，评论区的一句“我不是舍不得花钱，是怕以后管孩子要”，反而更接近真实需求。\n\
    \n- 第二，把父母、亲戚和后台读者当作样本，不把他们当作一个抽象人群。我会看他们反复聊的是钱、身体、子女，还是夫妻关系；他们真正难受的地方，是问题本身，还是那种“我不知道该怎么开口”的别扭。只有这些细小的差别，才能看出文章是像一个人在说话，还是像年轻人站在外面教老人过日子。切记不要写成说教的语气。\n\
    \n### 第三段成长：一轮轮测试，用数据结果来下定论\n\n- 第三，小批量测试，不靠一篇爆文给自己下结论。我先测夫妻陪伴、晚年生活、人生感悟几个方向。同一个需求会换标题、换场景再试，至少连续测三次，再和账号近期文章的中位数比。这样才能分清，到底是需求不成立，还是标题和表达没有写对。\n\
    \n我还有一个很实用的检查：把文章里“退休、养老、晚年”这些词全删掉，剩下的人物、顾虑和动作，还像不像一个五六十岁的人？如果删完只剩“珍惜当下、活出自己、善待自己”，那这篇文章看似温柔，其实根本没有写到他们的生活里。\n\
    \n### 二、我走过的弯路：从煽情，到愿意长期做的内容\n\n### 第一个阶段：我先学会了怎么拿到点击\n\n刚进入这个赛道时，我也会被一些数据很猛的形式吸引。比如“未接来电”“你收到了一条消息”，或者一开口就是“亲爱的”“老伴”“往后余生”。\n\
    \n它们不是完全没有用。在某个阶段，它们确实可以让用户快速点进来，也容易制造情绪。可越写我越不踏实：如果一篇文章必须让读者误以为自己真的收到了通知，才能换来一次点击，这个点击很难变成长久的信任。\n\
    \n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_5_0.png)\n\n过去常见的“未接来电”式内容案例，情话模板也一样。刚看时会觉得很感人，但当几百个账号都在写“这辈子最幸运的事就是遇见你”，内容就会越来越像一封找不到收件人的情书。读者当下可能被触动，过一会儿却记不住是谁写的，更不知道为什么下次还要回来看看。\n\
    \n### 老年情感类内容的典型呈现\n\n| 日期 | 标题 | 阅读 | 赞 | 备注 |\n|---|---|---|---|---|\n| 星期五\
    \ | 亲爱的，心里就踏实 | 2523 | 34 |  |\n| 星期四 | 亲爱的，好想陪着你 | 2.0万 | 219 | 3个朋友读过 |\n| 12月24日\
    \ | 亲爱的，不见面都惦记你 | 1.7万 | 346 | 3个朋友读过 |\n\n### 第二个阶段：数据有了，我却越写越不踏实\n\n那段时间，我终于开始区分两件事：让一个人难受，和真的理解一个人，完全不是一回事。制造情绪不难。把衰老、疾病、子女不回家、老伴离开这些词堆在一起，文章很容易显得“有感情”。难的是往前再走一步：他看完以后，是不是更明白自己的处境？有没有一个可以拿走的判断？明天能不能真的做点什么？\n\
    \n所以我后来从偏情绪表达的“老年情感”，慢慢转向更有具体问题、个人判断和生活办法的“老年感悟”。情绪还在，但文章不能只剩情绪。\n\n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_7_0.png)\n\
    \n### 我后来转向的老年感悟类内容示例\n\n### 第三个阶段：从写一封情书，变成解决一个具体问题\n\n以前我可能会写“老伴，谢谢你陪了我这么多年”。现在我会再问一层：“老两口退休后天天待在一起，为什么反而更容易吵架？”前一句是对的，但它可以放在任何账号。后一个问题里面，有具体的生活阶段，有相处方式突然变化以后的冲突，也有机会。\n\
    \n“晚年要学会爱自己”也是一样。这句话没有错，可它对一个正在被子女借钱、又担心自己生病的人来说，太轻了。如果把它改成：子女提出大额用钱需求时，先把自己的医疗备用金和至少一年的生活费单独留下，再讨论能帮多少。这时候，“爱自己”才从口号变成一个真正能执行的选择。\n\
    \n我现在主要围绕几条线来写：退休金、存款、医保和旅行预算这类“退休账本”；慢旅行、兴趣、学习和日常秩序这类“退休生活”；睡眠、劳损、体检和就医准备；夫妻、子女、父母照护和隔代育儿的边界。\n\
    \n这些东西没有哪一个是仅靠一句煽情的话就能写透的。但也正因为难，它才有可能从一次性的热闹，变成一个读者愿意反复回来的账号。\n\n### 三、赞赏超过2万以后，我才真正理解读者为什么愿意付钱\n\
    \n### 第四个阶段：我开始用赞赏，区分“感动”和“信任”\n\n刚开始做时，我以为文章只要足够感人，用户就会赞赏。后来数据看多了，我才发现不是这样。\n\
    \n有些文章阅读量不错，留言也很热闹，赞赏却不高。它把人的情绪调动起来了，但没有建立更深的关系。也有些文章阅读没有那么夸张，赞赏却更集中。这往往意味着，它不一定打中了最大范围的人，但打中了一群处境非常具体的人。\n\
    \n我后来把这种差别想明白了：感动只是触发情绪，赞赏更常发生在读者确认“你真的理解了我，还替我说出了一直不知道怎么说的话”以后。\n\n### 读者愿意赞赏，往往经过了三层感受\n\
    \n第一步是看见他。不要只写“老年人很孤独”，要让读者看到一个人傍晚自己吃饭，看到孩子打电话总说忙，看到老伴不在以后，屋里连一点声音都显得太大。我写完开头会回头看一遍：前\
    \ 300 字里，到底有没有一个能被看见的人？如果只有道理，那么文章还没有真正开始。\n\n第二步是替他表达。不只说“要珍惜老伴”，而是把那种年轻时总觉得日子还长、到两个人头发都白了才发现最该认真道谢的人一直坐在身边的心情，真正写出来。然后把全文最重要的那句话单独拎出来看：它是不是只是一句谁都会同意的正确道理？如果是，我还要继续改。\n\
    \n第三步是给情绪一个出口。我不想让读者看完只剩下对衰老、失去和孤独的害怕。所以文章到最后，我会尽量给一个今天就能做的小动作，跟老伴认真说声谢谢，把体检报告、药物清单和过往不适放到同一个文件袋，单独留好一笔应急金，或者问问他们对于这篇主题的看法。\n\
    \n这也是我现在对“流量”更踏实的理解。流量不只是大词、情绪和冲突。对老年内容来说，它往往来自一种非常强的“这说的就是我”。标题把人带进来，第一屏让他确认没有被骗，正文再把他自己模糊的感受说清楚。阅读、转发、留言和赞赏，也就不再是四个完全无关的数字。\n\
    \n### 四、一个老年选题值不值得写，我现在会怎么判断\n\n### 选题不靠“有感觉”，先看有没有可写的人和事\n\n过去我也会凭感觉选题，看到一句话觉得“好像很感人”，就开始往下写。这种做法最容易出现的问题，就是写到一半才发现，自己根本不知道这篇文章在帮谁解决什么。\n\
    \n现在我会先用 5 个问题把它拦一遍，每题 2 分，总分 10 分。这张表不追求看起来专业，它只负责逼我不要用情绪代替判断。\n\n| 检查项 | 我会先问清楚的问题\
    \ |\n|---|---|\n| 人群 | 到底写给刚退休、独居、夫妻同住，还是有一定积蓄的准退休人群？ |\n| 问题 | 他此刻卡在钱、身体、子女边界、夫妻相处，还是无效社交？\
    \ |\n| 验证 | 同类需求或标题过去是否出现过稳定的高阅读、转发、留言或赞赏？ |\n| 人设 | 当前账号的讲述者有没有对应的经历、观察和表达边界？\
    \ |\n| 素材 | 有没有人物、生活场景、冲突、数字、评论或可以核实的信息？ |\n\n8—10 分，我会进入写作；6—7 分，先补素材或调整角度；低于\
    \ 6 分，就先不写。这个分数不代表它发出去一定会爆，它只是帮我提前发现“根本没有东西可写”的选题。\n\n真正能带来流量的题，一般还要同时做到几件事：读者一眼能判断和自己有关；具体到他能在脑子里想象出一个画面；事情不解决会有什么现实代价，解决后又能多得到什么。还有一点很重要：这件事最好是他熟悉的，却从来没有人替他说透。\n\
    \n比如“晚年学会爱自己”，范围太大，读者不知道和自己当下有什么关系。“60 岁后，子女再开口要一笔大钱，这三笔钱别急着拿出去”，人群、冲突和利益就都出来了。\n\
    \n又比如“珍惜老伴”，不如“为什么退休后两个人天天待在一起，反而更容易吵架”来得具体。\n\n### 标题拉人进来，前 150 字必须把人接住\n\n标题出来后，我会看正文前\
    \ 150 字能不能立即接住。标题说的是子女借钱，开头却先讲一大段“人生苦短”，就算文字再顺，读者也会觉得被晃了一下。我有时会把标题和前 150 字单独给一个不了解全文的人看，只要对方的第一反应是“点进来好像不是这么回事”，我就会回去改。\n\
    \n发布以后也不靠一篇定生死。同一个核心需求，我会换三个标题、三个场景测三次。推荐正常、阅读偏低，先查标题有没有点击理由；阅读高、互动低，看正文有没有接住；阅读不高、赞赏却集中，说明人群窄但信任强，我会先换一个更大众的标题再测，而不是把整个方向丢掉。\n\
    \n### 五、Codex 真正参与的地方：不是代替理解，而是把理解固定下来\n\n写到这里，再说 Codex 才比较准确。很多人容易把因果关系说反：好像装好一个工具，AI\
    \ 就能猜中老年人在想什么，然后自动写出 10 万+。可如果我自己都说不清目标读者是谁、他卡在哪里、文章要给什么判断，工具只会帮我更快地生产空话。\n\n\
    我对 Codex 的定位很明确：它是资料整理员、内容策划、初稿执行者、质检编辑和数据复盘助手。但选哪群人、解决什么问题、采用什么判断、最后发不发，决定权一直在我手里。\n\
    \n### 第五个阶段：从“每篇重新想”，到把经验固定成流程\n\n以前这些标准都散在我的脑子里。状态好时，我记得先找场景，也记得删掉套话；赶稿或同时处理很多事时，就可能一上来先写正文，写了几百字才发现方向根本没想清楚。\n\
    \n我用 Codex 解决的第一个问题，就是不让内容质量跟着我当天的状态一起波动。现在的顺序是：先定人，再补素材；先把文章想清楚，再出初稿；最后由我修改、核实并决定是否发布。\n\
    \n### 在五个 AI 角色之前，先把账号里那个“说话的人”固定下来\n\n我在 Obsidian 里单独建了一份老年赛道人设文件。核心是一位 70 后准退休生活观察者：他从物流、工厂、供应链、基层管理或实体行业走来，父母正在变老，孩子逐渐独立，夫妻共同生活多年。他正在处理身体劳损、退休金安排、父母养老、子女成家和退休生活规划。\n\
    \n我会把年龄阶段、工作经历、家庭状态、经济状态、身体感受、核心需求、说话方式和内容底线这 8 项写清楚。比如他有退休金、存款或房产，但不是富豪；他会算账，却不会只谈省钱；他关心身体，但不用疾病恐吓读者；他说话慢、实在、克制，喜欢用具体账本和生活选择说明问题。\n\
    \n这份人设不是让 AI 装成一个老人，更不是鼓励我编造亲历。它是一条表达边界：这个人担心什么，哪些经历能支撑他的判断，什么话说出来会像年轻人硬模仿老人。只有这层约束在，后面的提示词才不会频繁更换。\n\
    \n### Codex 的第一个角色：资料整理员，把一堆对标变成可用素材\n\n我不会把一篇对标文章丢给 Codex，然后说“帮我模仿一篇”。这样最容易得到一篇结构很像、但没有自己判断的文章。\n\
    \n我会给它的原料包括：对标标题与正文、评论区真实表达、文章大概数据、我看完后的判断，以及能够支撑这篇内容的生活场景。然后让它分开整理：这篇写给谁，读者为什么点击，核心冲突是什么，什么只能参考、不能照搬，还缺哪些信息。\n\
    \n比如我想写“60 岁后子女再来借钱”，我会先放进 3—5 篇相关内容和一批评论。此时 Codex 不负责写正文，它先帮我把评论里反复出现的顾虑分出来：有人怕拒绝后伤亲情，有人怕自己将来看病缺钱，还有人根本不知道应该留多少。问题分开后，文章才知道应该详细写哪一个。\n\
    \n![](img/3bb0db35bad03539ac0f7f6b0eb7e8e0_13_0.png)\n\n给 Codex 使用的样本库不是只存原文，还要标注分类、核心情绪、可借鉴点和风险点\n\
    \n### Codex 的第二个角色：内容策划，先把文章想清楚\n\n整理完素材后，我还是不让它立刻写全文。第二轮只做一份写作说明：目标读者是谁，这一篇只解决什么问题，文章最想说清哪一个判断，开头用哪个场景，中间靠什么素材支撑，结尾让读者做什么。\n\
    \n比如只知道“子女借钱要慎重”，却没有人物、借钱用途、家庭关系和可核实的资金安排办法，它就只能提醒我缺什么，不能自己补一个“真实案例”出来。\n\n###\
    \ Codex 的第三个角色：初稿执行者，但要先把上下文给齐\n\n到这一步，我才让 Codex 写正文。它拿到的不会只有一个题目，而是五样东西：固定人设、本次素材、已经确定的选题角度、我自己的判断，以及篇幅、语气和事实边界。\n\
    \n这里最容易被忽略的，是“我自己的判断”。如果这一项是空的，AI 会很自然地填入那些最安全、最常见的正确话，文章就又回到“要爱自己、要重视亲情、要留好退路”。我会先把自己的态度写成一句直白的话，再让它帮我展开。\n\
    \n### 我会保留的核心 AI 提示词\n\n请读取“高知退休生活赛道”的固定人设，再读取本次素材。不要直接写正文，先按以下顺序执行：\n\n- 1. 提炼对标文章的目标读者、点击理由、核心冲突、结构骨架和评论区重复出现的顾虑。\n\
    - 2. 检查素材里有没有一个具体人物、一个生活场景、一个冲突、一个转折和一个明确判断。缺少任何一项，只列出需要补充的内容，不要编造。\n- 3. 输出写作说明：目标读者、正在解决的问题、核心判断、开头场景、人物冲突、内容结构、可执行建议、待核实信息。\n\
    - 4. 提供 3—5 个标题，分别说明它们吸引的是哪类读者，不使用虚假通知或正文无法兑现的承诺。\n- 5. 我确认写作说明和标题后，再生成正文。\n\n\
    正文要求：\n\n- 开头 150 字内出现人物、处境或直接利益。\n- 全文只解决一个核心问题。\n- 每个重要判断后面，至少有一个动作、数字、账单、身体感受、评论或生活场景支撑。\n\
    - 删除过度整齐的排比、对仗和空泛总结。\n- 结尾给一个读者今天就能执行的动作。\n- 养老金、医保、医疗、法律和金融信息不得编造，不确定的内容标记为“待核实”。\n\
    \n本次素材：对标标题与链接：目标读者：读者卡点：评论区素材：可用场景：我的核心判断：需要核实的信息：\n\n这条提示词最重要的地方不是长，而是它把几个关键关口固定了：素材不够就停；文章没想清楚就先不写；人没有做选择，AI\
    \ 不擅自帮人做选择。\n\n### Codex 的第四个角色：质检编辑，专门找初稿里的漏洞\n\n初稿出来后，我不会只问“这篇文章写得好不好”。因为你问得越笼统，得到的答案也就越模糊，回答就像是客气的鼓励，用过\
    \ AI 的，懂的都懂。所以我会让它分开检查：标题的承诺有没有在前 150 字出现；文章是不是像年轻人在教老人生活，哪个观点后面没有素材；哪几句话过分整齐、像结论先行；哪些数字和政策需要核实。\n\
    \n最后还要我自己过一遍。AI 说某句有问题，不代表我一定要照改；它没检查出来，也不代表就能直接发。尤其涉及养老金、医保、医疗、法律和金融的内容，找不到可靠来源，就标出待核实或删掉。\n\
    \n### Codex 的第五个角色：复盘助手，把发布数据变成下一轮动作\n\n我会在文章发布 24 小时和 7 天后，记录推荐、阅读、点赞、在看、转发、留言、赞赏人数和金额，再把同类文章放在一起比。我不会直接问\
    \ Codex“这篇为什么没爆”，而是让它先把问题分层：推荐正常但阅读低，先查标题；阅读高但互动低，先查正文承接；阅读不高但赞赏集中，可能是人群偏窄但信任强，不要急着删掉整个方向。\n\
    \n复盘的结果必须变成下一次的一个小实验。例如保留正文换标题，保留选题换开头场景，或者继续写同一类用户，但把文章里的可执行办法写得更具体。一次只改一两个变量，下一篇的数据才能告诉我到底改对了没有。\n\
    \n### 用一个选题走完整流程：“60 岁后，子女再来借钱”\n\n这里用一个选题来给大家做演示操作。\n\n- 1. 先搜集 3—5 篇同类文章，把标题、正文、评论和可见数据放进素材库。\n"
