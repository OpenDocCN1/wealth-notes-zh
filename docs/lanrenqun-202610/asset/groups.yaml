    # 个人感想


    与其说 AI 能提高效率，我说 AI 更厉害的是是将不可能变成可能，让普通人也能通过 AI 协助下将本来注定只能受屈辱地拿下低赔付的结果，转化成一个合法合规合理的成功维权！


    过去大家讲 AI 的价值，通常集中在写作、PPT、coding、自动化和提高工作效率，这些当然都有价值。但这次长达 8 个月的维权让我实际验证了另一种用法：**AI
    在处理人与人、人与机构之间这些复杂、漫长、充满信息差和现实利益冲突的社会事务里能获得更大的杠杆！** 当一个人连续几个月面对物业、保险、律师、投诉渠道和公司不同层级的人，真正困难的往往不是写一份材料，而是记住前面发生过什么，分清谁说了什么、谁有权限，发现前后口径的变化，准备下一次沟通，补上遗漏的问题，并且在事情不断变化的情况下持续跟进下去。AI
    在这里提供的，不只是一次任务的效率，而是信息处理、准备、复盘和长期跟进的能力。


