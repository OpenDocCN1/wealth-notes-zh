  - '[PAGE 0]


    # 教辅做了三个月卖了 1000 元，给自己做的拼豆图纸，半个月卖了 6000 多


    261003 副业 SC 精华

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信： lazyhelper1


    ![](img/29459bbf58f17207ed8e84307d362f75_0_0.png)


    > 小懒判断 | 适合做 AI 数字产品却总在"打磨质量"里打转的人看——作者教辅死磕三个月才卖 1000 元，拼豆图纸半个月 6000 多，差的不是认真是赛道。最值得关注的一个点：9
    月 15 日单日 1273.91 元，且限流后靠存量图纸每天仍有 100 多元被动收入。坑在于他 9 月 16 日因"不当操作"被限流禁言一个月，平台规则红线不摸清，爆了也白爆。


    最近做拼豆图纸有了一些正反馈，想在生财分享一下这几个月的经历。


    从花大量精力做教辅，到一次出于兴趣的拼豆尝试，再到开始有人付费，这中间让我重新思考了两件事：用户为什么买单，以及自己的投入能不能得到回报。


    # 先说之前做教辅的经历


    一开始，我想做质量更好的教辅资料。配图不是装饰，而是用来帮助孩子理解知识点的，所以准确性是底线，一点都不能出错。


    这也是制作过程中最费力的地方。


    □□这是我们之前在成品，在小红书陆续'
  - '[PAGE 1]


    # 续有人下单


    ![](img/29459bbf58f17207ed8e84307d362f75_1_0.png)


    AI 生成的图解，经常整体看起来不错，仔细检查却发现某个细节画错了。但放在教辅里，错误的图可能直接影响孩子对知识点的理解。


    所以只能继续改、重新生成、再检查。


    我一直力求精益求精，希望做出比同类资料更好的质量。但同行的价格低、资料量大，我做得慢，数量也不占优势。


    三个月下来，教辅资料的销售额大约 1000 元，还没有扣除 AI 订阅费。


    质量上的投入也带来了一些机会，后来有需要定制图解的商家找到我，前前后后又转化了大约 3000 元的定制收入。


    但这些制作和修改，几乎用完了我订阅套餐里 20 倍的额度。接触下来，我也感觉这类商家的需求量不大，很容易饱和。


    当时的感受就是：质量确实做上去了，但投入和回报之间，始终有很大的落差。


    # **转折发生在 9 月的一次拼豆体验。**


    我去拼豆的时候，突然想：能不能自己做一张拼豆图纸？'
  - '[PAGE 2]


    最初只是想给自己拼，并没有一开始就把它当成新项目。


    做出来以后，我决定发到小红书试试。9月12日下午，发布图纸分享帖时，我就挂上了个人售卖链接。当天发了八张超大图和八张52格的小图。


    没想到帖子直接爆了。


    两天涨粉1000，点赞通知一打开就是99+。更让我意外的是，除了点赞和关注，当天也开始有人买图纸。


    接下来几天，每天的收入都比前一天高。到了9月15日，当天卖了1273.91元。


    对刚经历过“三个月教辅销售额1000元”的我来说，这个反馈很强烈。


    但上涨没有一直持续。


    9月16日，因为我的不当操作，账号被小红书限制流量，同时禁止发帖和私信，处罚期是一个月。后面的收入也随之下降。


    不过，从受限后到9月底，即便流量下降，每天仍然有收入，最低的一天也有100多元。


    从9月12日下午到月底，卖图纸累计带来了6000多元收入。


    这让我看到了两个事实：平台流量确实会明显影响收入；而前面发布的图纸，在流量下降后仍然能带来购买。


    这是一段让我愿意继续投入的正反馈，但'
  - '[PAGE 3]


    还不能说明长期收入已经稳定。处罚期结束后的表现、后续能不能持续卖，都需要继续观察。


    这次尝试让我更清楚地看到了购买动机的差异。


    ![](img/29459bbf58f17207ed8e84307d362f75_3_0.png)


    教辅面对的用户，大多是精打细算的家长。他们会比较价格、资料数量和实用性。


    我花很多时间保证准确、打磨细节，是产品本身必须承担的责任，但这些投入不一定能直接换来更高的购买意愿。


    用户可能认可质量，最后还是选择更便宜、内容更多的那份。


    拼豆图纸的购买理由，则更多来自情绪和喜欢。


    看到一个好看的图案，想把它亲手拼出来，愿意为这份喜欢付费。当然，只有好看还不够，图纸也必须真的能照着拼。


    在我目前接触到的用户里，这种兴趣带来的黏性也更强。完成一张以后，还会想找下一张喜欢的图案。'
  - '[PAGE 4]


    对我来说，同样是认真打磨视觉内容，换了一种使用场景，得到了更直接的市场反馈。


    # 开始卖图纸后，我也逐步搭建了自己的工作流。


    这部分可以分享一些组织思路。


    我先梳理一张图纸从制作到交付会遇到哪些问题，再决定哪些环节适合交给 AI、哪些必须保留人工判断。目前主要围绕几件事：


    +   - 制作前明确目标，减少反复试错。

    +   - 留出样稿检查和修改阶段，确认后再继续做成品。

    +   - 分别检查画面效果和实际可拼性。

    +   - 整理版本、交付文件和归档，方便后续修改。


    具体制作方法、参数和实现细节，这篇先不展开。


    对我来说，搭建工作流的价值，是把容易出错和反复消耗精力的地方逐步理顺，让质量和交付更稳定。


    前面做教辅的经历，也让我养成了检查细节的习惯。这些积累后来用到了拼豆图纸上，只是面对的用户和购买理由发生了变化。


    现在我还在继续探索。一方面看后续的持续购买情况，另一方面也要把平台操作和经营环节做好，避免再次因为操作问题影响收入。'
  - '[PAGE 5]


    这次最大的收获，是开始把“我能做出什么”和“用户愿意为什么付费”放在一起考虑。


    如果你也在做 AI 数字产品，或者对拼豆图纸的项目探索、质量检查和工作流组织感兴趣，欢迎来找我交流。我可以分享这几个月踩过的坑，以及哪些投入在我这里得到了实际反馈。


    ![](img/29459bbf58f17207ed8e84307d362f75_5_0.png)


    看完这篇 SOP，你觉得你懂了。但 90% 的人一到实操就会卡在第一步。


    工具和教程只是最低级的壁垒，真正的壁垒是“立刻动手”和“圈层信息差”。


    如果你想看全网最新的变现玩法，并且和一群执行力极强的极客一起下场拿结果，欢迎围观我的核心私域：【懒人专属群】。


    我们不聊虚的，只做商业闭环的拆解与 AI 效率的压榨。系统内已沉淀 1000+ 跑通的套利实战局。


    +   - 查阅圈子完整数字资产与上车门槛：


    [https://lazyso.com/insider/](https://lazyso.com/insider/)


    认同价值、准备好下场干活的，扫码加我微信（lazyhelper1）


    备注：【实操上车】，不闲聊'
