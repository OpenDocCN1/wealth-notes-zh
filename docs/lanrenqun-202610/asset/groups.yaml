    还有社媒方式和投流方式起量，社媒可以加很大的杠杆，投流要算好长期回报率跟电商逻辑差异挺大。这两个方式还没太多的尝试，观察到的情况看到社媒的杠杆真的是爆发性的，可以四两拨千斤，目前国内科普社媒起量还没怎么看到。


    写着写着感觉有点跑偏了，变成业务复盘了，我们再回到主题，想赚1000万的钱就不要去做赚100万的活。


    对于出海 AI 工具站这个业务，大部分人的目标是月入千刀，然后万刀，然后继续换刀前面的单位，但是月入百万刀可能是大部分人望尘莫及的目标了。


    千万万刀之前拼的是执行力，新词是成本最低的实现方式。十万刀靠的不仅仅是执行力（小概率的超级大词除外），拼的更多的是生产效率、生产工具以及人脉资源的叠加，深圳以及周边的独立开发者圈子高质量的信息大概率要比内地的密度要大的多，多出去交流可能别人一个提点要比埋头干少走很多弯路。持续稳定的月入十万刀到百万刀，这个量级可能继续用之前的单点方式很难达到（如买买外链、做做新词），不是说不可能，而是难度大很多，不再是简单的复制10个万刀的站或者做'
