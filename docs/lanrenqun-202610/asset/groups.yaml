    # 样本口径 / 07


    # 42 条记录，要怎样理解


    同店不同规格会分别保留，先看具体交付。


    # 同店：小学全科电子资料


    近 7 天展示销量观察增量


    四年级全册  +1,809


    1—6 年级全部  +1,793


    # 同店：考研刷题小程序


    近 7 天展示销量观察增量


    政治大会员  +851


    全场大会员  +846


    先研究一个需求，再比较不同交付。

