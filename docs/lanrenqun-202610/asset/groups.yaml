  - '[PAGE 5]


    制信息的传播。


    10月19日，前总理、总统候选人阿塔尔（Gabriel Attal）说，社交平台已经成为打砸者的集合点，在骚乱期间“nous devons pouvoir
    bloquer temporairement et de manière ciblée l''accès à certaines plateformes”（我们必须能够临时、定向地屏蔽部分平台）。前国家警察总长
    Frédéric Péchenard 则要求在监控摄像头上使用 AI，并获得访问加密通讯软件的权限。


    阿塔尔这么说是有先例的。2024年5月新喀里多尼亚（法国海外领地）骚乱期间，时任总理的他下令屏蔽了当地的 TikTok。法国最高行政法院事后裁定那次屏蔽违法，构成对言论自由“不成比例的侵害”，并划出了条件：只有在“特殊情况”下，屏蔽是必要的、临时的、且没有其他更温和的手段时，才可以中断对社交平台的访问。科技网站
    Presse-citron 还指出，在法国本土这样做，还可能与欧盟《数字服务法》（DSA）冲突。


    平台上的确有很多虚假信息在传播。10月7日，法国外交部召见伊朗大使，抗议伊朗官方账号就高中生抗议散布“误导性内容”。虚假信息监测机构 NewsGuard 则发现，不少旧视频被重新包装：2023年养老金抗议中的画面被说成“消防员和警察倒戈”；一段2017年声援一名在警方羁押中死亡的塞内加尔男子的示威视频，被反移民账号拿来证明“非洲男子”参与了这次抗议。


    还有一则插曲。这次运动里流传最广的口号是“Bismillah, c''est les ténèbres”（以真主'
  - '[PAGE 6]


    之名，这是黑暗）。据欧洲新闻台（Euronews）梳理，它来自一张 Snapchat 截图：一个叫“Mamadou”、头像旁挂着阿尔及利亚国旗表情的账号，用阿拉伯语、街头俚语夹杂的口吻申请加入封锁学校的群聊。学生们认定，这是警察假扮青少年混进来的卧底，于是拿这句话来嘲讽，口号随后传到布鲁塞尔、博洛尼亚和米兰。卧底的说法至今没有被证实，截图也可能是恶搞，警方和内政部没有回应。


    不管真假，学生们嘲笑的是一种想象：在某些人眼里，抗议的法国年轻人，就该是一个说着阿拉伯语、挂着阿尔及利亚国旗的“Mamadou”。


    # ## 早已选定的幕后黑手


    那么，中文互联网上对法国骚乱的呈现和想象呢？


    先看体制内媒体。《环球时报》10 月 19 日的报道把骚乱归因为生活成本上涨、教育资源匮乏、财政紧张和民众对政治精英的“信任危机”，副标题是“骚乱凸显法国治理深层困境”；暴力则归于混入人群的极左翼、无政府主义“黑块”和趁乱抢劫者。次日的“环球圆桌对话”请三位国内学者讨论，标题是《法国暴力事件给欧洲敲响警钟》，关键词是“结构性矛盾”“理想价值与社会现实之间存在巨大鸿沟”。


    有意思的是，《环球时报》也引用了川普的说法。川普 10 月 6 日在 Truth Social 上写道，“This isn''t about schools,
    this is about Islam wanting to take over a once great'
  - '[PAGE 7]


    Country!”（这跟学校无关，这是伊斯兰想要接管一个曾经伟大的国家！）《环球时报》援引法新社等的分析说，这番话更多服务于美方自己的政治议程。官方媒体的叙事可以预料：这是西方治理失灵的又一个例子，但不是移民问题。


    再看流量平台，画风就不一样了。


    最流行的词是“零元购”。一篇署名为游戏领域创作者的文章，标题是《法国暴动！黑哥们零元购 PS5：像是下楼领鸡蛋》，正文没有任何视频来源，只说“据网友分享”；一名数码博主在微博发视频配文“法国骚乱
    这次 iPhone 真的零元购了[笑 cry]”。头条号“无界议事厅”的一篇文章则断言，“这场骚乱最戏剧性的转折，就是大量非法移民参与打砸抢的画面被拍了个正着”，并把账算在马克龙的“宽松移民政策”头上，同样没有给出画面来源。


    对照 NewsGuard 的发现，这类“画面”有多可靠，要打一个大大的问号。到目前为止，没有可靠报道显示这次骚乱的参与者以移民为主。Newsweek 报道，抗议开始以来被捕的
    6000 多人中，多数是未成年人。


    而右翼媒体则给出了第三种归因：骚乱背后是一个“由共产主义组织、革命左翼团体以及全球激进分子网络推波助澜的政治生态圈”。


    治理失灵、非法移民、共产主义幕后黑手——三种说法各有各的主角，但它们有一个相同点，那就是：这些归因，早在骚乱之前就已经选好了，法国只是又一次提供'
