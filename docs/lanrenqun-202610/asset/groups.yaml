    ### 2. 礼貌地请大 V 帮你转一次


    这是破圈最直接的一步，也是最多人不敢做的一步。


    ![](img/2e4ea7ed22920b998d85449edcd3298b_19_0.png)


    我先把这里的道理讲清楚：一条推发出去，前两个小时是黄金窗口。这两个小时里互动够猛，平台就给你加推，推给更多不认识你的人；这两个小时凉了，后面基本就沉了，再补也补不回来。


    而 X 的推荐算法代码是开源的，里面的权重写得很清楚。我翻译成人话给你：


    | 动作 | 权重 |

    | --- | --- |

    | 转发 | 20 倍 |

    | 引用转发 | 15 倍 |

    | 回复 | 13.5 倍 |


    ### 3. 找熟人站台


