    ## 二、第一步：账号从哪来


    讲完为什么，下面全是操作。从最前面的账号开始。


    一共两条路，你自己挑。


    ### a. 自己注册（推荐新手走这条）


    用谷歌浏览器注册，是当前最稳的。


    原因是谷歌浏览器的环境最干净，不容易被平台当成批量注册的号。


    具体几步：


    - 1. 准备一个干净的邮箱，Gmail 最好，跟你的推特绑一起。

    - 2. 用谷歌浏览器打开推特注册页，直接选“用 Google 账号登录”，比填手机号顺，也少掉一层验证。

    - 3. 节点要固定。今天是美国，明天是日本，后天又换回来，平台会直接把你标成可疑账号。挑一个就一直用。

    - 4. 注册完当场把资料填完，不要空着放几天。


    这条路的好处是干净、安全、以后不容易出事。坏处是慢，新号有养号期，急不来。


    ### b. 买成品号（想省时间的人走这条）


    什么时候适合买？


    - 你等不了养号那几天，想注册完当天就开始发；

    - 你要做矩阵，一个号不够用。


    ### 买号之前你先想清楚三件事：


    - 1. **有被找回、被封的风险。** 这是最大的坑，别贪便宜。

    - 2. **粉丝不精准。** 成品号上那点粉，大概率是死的、或者跟你完全不搭。别指望它给你带流量，你要的是“号本身不是白板”。

    - 3. **买回来第一件事是改密码、换绑邮箱。** 做完这步，先当正常号用一周，再开始发内容。


    渠道和价格我就不在这里展开了，圈里问一句就有。但我的建议是：第一个号，自己注册。你自己的号，你才心疼。


    ## 三、第二步：设置与养号


    账号到手，先别急着发内容。


    ### 先把门面收拾干净


    **头像。** 真人照片。别用 logo，别用网图。推特是认人的地方，一张真人脸就是最基础的信任。


    **昵称。** 用你真名或者平时被叫的名字。我用的就是“阿乐”。


    **ID（@后面那串）。** 能改，但只建议改一次，想清楚再定。最好是名字的拼音或者英文名，好记、好念、好被人 @。


    **简介（Bio）。** 一句话说清楚：你是谁、帮谁解决什么问题。


