    有一个具体人物、一个生活场景、一个冲突、一个转折和一个明确判断。缺少任何一项，只列出需要补充的内容，不要编造。3. 输出写作说明：目标读者、正在解决的问题、核心判断、开头场景、人物冲突、内容结构、可执行建议、待核实信息。4.
    提供3—5个标题，分别说明它们吸引的是哪类读者，不使用虚假通知或正文无法兑现的承诺。5. 我确认写作说明和标题后，再生成正文。正文要求：- 开头150字内出现人物、处境或直接利益。-
    全文只解决一个核心问题。- 每个重要判断后面，至少有一个动作、数字、账单、身体感受、评论或生活场景支撑。- 删除过度整齐的排比、对仗和空泛总结。- 结尾给一个读者今天就能执行的动作。-
    养老金、医保、医疗、法律和金融信息不得编造，不确定的内容标记为“待核实”。本次素材：对标标题与链接：目标读者：读者卡点：评论区素材：可用场景：我的核心判断：需要核实的信息：


    这条提示词最重要的地方不是长，而是它把几个关键关口固定了：素材不够就停；文章没想清楚就先不写；人没有做选择，AI 不擅自帮人做选择。


    # Codex 的第四个角色：质检编辑，专门找初稿里的漏洞


    初稿出来后，我不会只问“这篇文章写得好 不好”。因为你问的越笼统，得到的答案也 就越模糊，回答就像是客气的鼓励，用过 AI 的，懂的都懂。所以我会让它分开检查：标题的承诺有没有在前
