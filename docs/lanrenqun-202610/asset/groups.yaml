    小懒判断 | 关注中美走向、做产业外贸和投资决策的值得细读，逻辑推演比结论值钱；想听具体买卖点位、求安抚的不必点开。最值得关注的是两个硬指标：中国产能全球占比已过
    30%、每年抬 1 个点冲 40%，叠加电力终端消费占比破 40% 的原生电力文明，未来 5 到 10 年见分晓。坑在于文末的分级合作清单还停留在建言层面，别当成已经在推进的既定政策。


    # 大树乡谈


    第1370篇

    2026年10月2日


    中美之间的结构性矛盾，必须促使美国让步来化解


    —新技术，新经济，新文化，新治理—


    ![](img/cc497802dabefd9358546797bfe6ae3f_0_2.png)


    # 1 -


    2023 年起，每年四季度，小镇都会对中美未来关系下一个整体判断，截至目前都验证了。


    2023 年旧金山会晤后，一度出现对中美关系改善不切实际的幻想，小镇就判断说不要幻想中美能回到过去，中美之间的摩擦只会加剧不会弱化，会晤带来的短暂蜜月，更多是为了避免冲突失控，应该视为对冲未来危机加深而不是反过来。'
  - '[PAGE 1]


    2024 年美国大选前后，小镇论断无论谁上台，美国对中国的战略警惕都是一致的，不过是具体操作方法的差异，而如果特朗普上台，要做好上台半年内冲突骤然激化的准备，不会有所谓的缓冲期，但这一轮贸易战，结束的会非常快，而且会以毫无疑问的美国让步告一段落。


    2025 年 10 月，小镇判断中美之间旧的相处模式已经作废了，需要在摩擦碰撞中建立新的相处模式，这一次中国将占据更大的主动权。


    有读者提议不要在文章中过多列举旧文，但毕竟有很多新读者，而老读者也未必记得小镇过往的判断，这些判断对推导未来也是有帮助的，所以还是要简单提一下，也是对小镇接下来判断的背书。


    在中美新一轮会晤后，又出现了过于乐观的想法，但在小镇看来：中美之间的矛盾并没有出现实质性缓和，甚至可以说中美之间的结构性矛盾在持续加剧，这才是未来几年中美关系的核心。


    未来几年中国还将出现颠覆性的巨大突破，这个突破还要大于实现半导体全自主产业链。


    在这一背景下，战略上要清醒认识到中美结构性矛盾的短期不可调和，战术上却要最大限度弱化给我们带来的冲击，更要借此完成以中国利益为核心的全球新秩序的重塑，核心是前天探讨的：在中国不能完全信任其他国家的基础上，如何超越传统经贸关系，与包括美国在内更多国家建立'
  - '[PAGE 2]


    更深层次的协作。


    由此就有了本文。本文大概分两部分，第一部分阐述为什么小镇说中美结构性矛盾在未来短期内不可调和；第二部分阐述中国在这一阶段的对外策略转变。而通过这两部分，也可以对投资产业和个人发展提供一些有益参考。


    # 2 -


    为什么说中美之间是结构性矛盾，这一矛盾是短期内难以调和的？


    有几个层次，逐步深入。


    首先从最直接的美国国内政治层面看。


    9 月 30 日小镇谈一个国家或者组织，有人能对未来负责的重要性，尤其在关键的模糊地带，能有人推动建立统一共识。


    美国目前最大的政治性问题，就是没有共识。由于对权力的不信任和资本谋求自身利益的需要，权力制衡过于精细，叠床架屋，这有利有弊，弊端在于在利益分化、社会极化、选票政治、互联网实现对亿万个体的直接传播等背景下，必然导致利益诉求出现严重分歧，成事难，坏事太容易了。


    而美国不是美国人的美国，而是全球资本的美国。由于缺乏国族建设，美国的国家凝聚高度依赖全球最强的实力基础，顺风顺水也就罢了，当增量蛋糕放缓，存量蛋糕越来越集中于少数人，矛盾会从底层向上延伸，最终在统治集团内部出现严重对'
  - '[PAGE 3]


    立。


    表现为当前美国白宫、议会、联邦、州、华尔街、硅谷、农业、能源、军工、盟友、行会等等力量之间的诉求差异不断拉大；而伴随 AI 科技革命，这一矛盾加剧，比如美国目前通胀高企，美债利率已经突破
    5%，一个很关键的因素，就来自 AI 资本炒作对金融资本的鲸吞，本已严重过剩的美元也出现了短缺。


    美国国家利益和华尔街硅谷利益，如何调和呢？过去大资本、大官僚、大家族、大平台可以联手压榨美国民众乃至全球，可胃口越来越大，已经吃不饱了，谁愿意让呢？


    这就是美国内部政治的结构性矛盾，这就决定了，我们不要幻想美国能够拿出统一且稳定的对华战略框架，要尽力而为，但也要清醒，能拖一天就是一天，时间站在我们这边。


    第二个层次，需要上升到全球视野。


    《国家为什么会失败》这本书小镇批判过，但这本书也有可取之处，只是作者的局限性限制了这一框架的有效性。这本书作者、2024 年诺贝尔经济学奖获得者将国家制度分为包容型和掠取型，以此解释制度如何形成并影响经济繁荣。


    但由于美国方长期高度警惕阶级视角，导致西方经济学和社会学研究刻意忽略了阶级这个房间里的大象，更谨慎从底层论证美国制度的根本性问题，就导致忽略了'
  - '[PAGE 4]


    一个最基本的背景：当今世界，已经全球化了，研究一个国家不能静态的只研究这个国家，必须建立全球视角。


    把全球化这一基本要素纳入，那么包容型制度和攫取型制度的划分就要出现颠覆了。


    以美国为代表的西方发达国家，是典型的全球时代的攫取型制度，而中国则是目前罕见的全球时代的包容型制度。具体到 AI 领域，最直观的对立就是闭源垄断和开源共进之间的结构性矛盾。


    美国作为全球资本的美国，以资本为中心建立了全球层面的攫取型制度，包括美国在内西方国家的繁荣，在很大程度上建立在殖民掠夺和对“全球南方”国家不对称交换之上，如果仅仅把包容和攫取限定在一国内部，那就严重忽略了全球体系中的攫取关系。


    这一点非常重要，比如衡量贫富差距的基尼系数，从一国内部和全球视角看，结果截然不同。最近十几年，中国内部基尼系数基本稳定，全球很多发展中国家还出现了上升，但伴随中国为首的全球南方崛起，全球范围内基尼系数显著降低。


    这是因为财富分配最大的不公平是发达阵营与发展中阵营、是先富与后富之间的矛盾，发展中国家崛起，带动全球财富从发达国家更多流向发展中国家，调节了全球分配，这也导致美西方内部矛盾加深，竞争资本被限制向外攫取，自然会加大对内压榨。'
  - '[PAGE 5]


    上述问题在科技领域表现的更为直观。小镇之前谈中美未来产业竞争，高度肯定了美国商业模式对科技突破的作用，这是我们需要学习的，但不能照搬，因为美国这套模式核心是服务资本增殖，而非社会财富、全民福祉的提升。


    美国围绕科技突破最通常的商业模式是，一看到科技突破，立刻投入海量资本，几年内就推出几个科技巨头，之后科技巨头通过扼杀式并购，显著降低了新锐公司诞生的可能，系统性消除竞争威胁，从而获得高额垄断利益，甚至已经形成了一个针对创新的杀伤区。


    这一剖析，是牛津大学基于 Crunchbase 数据库，针对 742 个产品市场从 2003 年到 2021 年的计量分析得出的，这种对创新和初创企业的系统性杀伤有点类似美国社会的“斩杀线”，无形但事实存在，效果极强。


    互联网科技是典型，短短几年就出现了几个科技巨头，之后美国在互联网领域的创新并没有停滞，但新锐公司刚冒头就被互联网巨头收购了，没能像中国一样，产生如拼多多、字节跳动这样的新巨头，也缺乏百花齐放。甚至后来还出现了挖走团队核心成员，无需正式并购就瓦解潜在竞争对手的新模式。


    在没有出现超越传统互联网的新科技突破之前，这种垄断很难打破。


    幸运的是，在 AI 时代，美国科技巨头通过并购实现垄断的模式暂时失效了。从 2016 年开始的本轮 AI 科技进步，已经 10 年了，'
  - '[PAGE 6]


    美国始终没能在本国内部实现 AI 垄断，互联网巨头扶持了新 AI 巨头，但并没能阻止新 AI 创业公司的涌现。


    除了全球资本疯狂涌入 AI 领域，关键在于中国提供了第二条路，系统性降低了全球 AI 的进入门槛，还在打破算力垄断的叙事，更实现了 AI 领域对更多语言和治理模式的包容性，打破了西方价值观、英语对
    AI 的垄断，让一些边缘语言也可以进入 AI 时代。


    比如乌干达、马来西亚的本土模型，都是通过利用开放的中国基础模型，构建了体现自身价值的本土模型，这已经形成了新的主权 AI 模式。


    这就同美式 AI 形成了鲜明对比。


    而中国的开放与包容，是对美西方垄断与攫取的根本冲击，又如何能够调和呢？


    # 3-


    第三个层次，根本还是在中国。


    开头小镇说了，未来几年中国会出现一系列颠覆性突破，半导体全自主产业链是这些突破的代表之一，但不是全部，上升格局。小镇认为有两大标志性突破：一是中国本土产能的全球占比突破
    40%，二是中国成为人类首个原生电力文明，标志是电力在终端消费的比重突破 40%。


    这两个指标都是革命性的，而且都可能在未来 5 到 10 年成真，就算从个体角度，突破也太快了，何况是国家和文明的尺度，也意味着中美之间结构性矛盾的加剧。'
  - '[PAGE 7]


    原生电力文明此前在《面对千载难逢的历史性新机遇，中国要做些什么呢？（上）》谈到过，国庆期间也有一篇文章进一步展开。这一冲击更具颠覆性，甚至可以对美国形成文明代差，但毕竟还要更晚一点。未来对中美关系、世界格局而言，更先发生的冲击是前者，也就是中国产能占比突破
    40%，目前已突破 30%，相当于美国和欧盟之和，并以每年 1 个百分点左右的速度上升。


    之前也有国家实现过，那就是二战后的美国。但要明白，二战后全球产能占比突破 40%，含金量要远低于中国未来突破，美国决策智囊精英对此很清楚，所以这几年，中国产能过剩和全球贸易失衡被迅速炒热。


    二战后美国产能占比高，是因为当时工业以钢铁、汽车、化工、机械为主，产业链相对简单，技术迭代慢，更是在战争摧毁了其他工业国的基础上形成的短暂性垄断，美国很快就无法维持这一占比。


    但中国实现突破，是建立在产业链完备、技术密度极高、规模效应、供应链响应速度、工程师红利基础之上的，更关键的是，不同于二战后各国之间工业相对独立，今天的人类世界高度全球化，中国产业已经深度嵌入全球供应链，已经不存在所谓的替代，没有任何人、任何国家能够替代中国。


    还要注意到，中国工业产品溢价远低于美西方，这就导致如果从实物角度衡量，中国产能占比还要更高，再把围绕工业生产'
  - '[PAGE 8]


    的生产性服务业算上，这是要撼了美西方发达国家的根基。


    对此，美西方其实没什么办法。正如开头说的内部政治的结构性矛盾，以资本为中心建立的国家，在没有遭受灭国之危的情况下，很难形成合力。


    缺乏真正的国家、民族认同，也导致民众很难愿意承担巨大的生活水平下降，来抵制中国产品。就算出现一些波折，中国产能、出口的优势只会越来越大，2026年前八个月，中国外贸增长同比高达17.6%，较前7个月加快0.3个百分点，这是不可抵挡的。


    通过梳理上述三个层次，就可以得出：未来几年内，中美之间的结构性矛盾只会加深不会削弱，必须有一方退让，我们当然希望是美国退让，然而美国不愿意轻易放弃，这就要求我们必须做好矛盾激化的准备，并尽可能削弱、拖延。


    我们也面临巨大挑战，比如前天说的，中国需要在不能完全信任其他国家、不搞盟友体系的基础上，与更多国家建立深层合作关系，让其他国家能够信任中国。


    这一挑战的难度，就类似于中国在维持产能上升、出口大增的基础上，构建更有利于我们的新体系，降低包括美国在内全球国家对中国产能快速崛起的对抗性。


    核心是避免最恶劣的情况出现，尽可能争取次优解，拖以待变，以时间换空间。这是更务实的。'
  - '[PAGE 9]


    <!-- no content -->'
  - '[PAGE 10]


    每日至少摄入 44.1 克优质蛋白，这就要求必须优化膳食结构，增加奶类、肉类、水产、大豆消费，优化比简单总量提升更难。


    这也涉及从营养和食材角度，如何看待中国饮食和所谓“白人饭”，中国餐饮当然非常发达，但这种发达也意味着长期存在食材供应不足，不得不物尽其用。具体先不展开了。


    而从贝森特的表述来看，美国其实并不相信 AI 能够给美国带来足够的真实经济增长，至少不认为短期内在美国能够实现，更倾向于认为，AI 带动的真实增长会首先在中国出现，这就进一步放大了美国精英层的焦虑。


    在这一背景下，中国实际已经在没有参与战争的情况下，打赢了一场世界大战，并收获了巨大的胜利果实。这是人类历史上从未出现的以非战争手段、极低损失取胜的案例。


    一年上万亿美元的顺差，这是什么概念？已经超过了一战、二战战败国的战败赔偿，而且这是每年都有、越来越高的。


    一战二战之所以爆发，根本在于全球利益已经被先发国家占据，后崛起国家想要重新分配，于是在新列强和旧列强之间就爆发了惨烈战争，以战争完成全球利益的再分配，这种利益很大程度上体现在产能和市场，但凡能通过市场竞争获得巨大利益，没几个国家会采取战争这种极不可控的手段。'
  - '[PAGE 11]


    现在如果按照西方观点，全球产能过剩还要超过一战二战，毕竟产能过剩都到了未来中国十几亿人都可以达到接近发达国家生活水平的地步了，还在外溢。


    而且中国优势还越来越大，还建立了全球时代的包容型制度，中国的产业崛起并没有排斥外国资本和企业，于是就出现了“去中国化”的新解，不是美国宣扬的在中国之外另建一套供应链体系，而是到中国实现工业化，典型如“德国工业4.0在中国”。


    避免战争尤其中美之间的战争，也符合中美利益。


    对中国而言，除了上述巨大利益，还因为我们未来重心在内部，要解决内部出现的、挤压的一系列深层问题，核心是经济增长动力更换、发展模式转型以及最关键的分配改革。


    对美国而言，则是很难打。美国军工高度依赖中国供应，总不能爆发战争，还要求中国不能断供吧，现在的美国军事力量，相对中国，核心装备已经接近成为存量存在，一旦损失很难补充。


    而且中国有次优解，美国也有。


    对美国而言，至少可以维持一个新平衡；那就是在美洲和欧洲占据绝对掌控，而在全球其他地区，通过与中国的协作继续维持深度影响力，这个结局并不差。更何况，美国的核心是资本，资本利益未必建立在美国基础之上。


    但我们也需要警惕一个危险的未来，那就'
  - '[PAGE 12]


    是随着科技进步，中国产业产能的继续爆发，很可能出现像中国这样的科技工业强国，基本垄断全球生产，届时其他国家怎么办？


    资源国日子也不会好过，因为绿色能源革命、循环经济、技术进步会从根本上创了资源国的根基，就算资源国可以继续出口资源获得不菲的利益，可这些通过出口资源获益的利益集团，会把收益回馈给整个国家和民众吗？


    显然不可能，这种局面对美西方资本利益集团而言，不是什么大问题，可对中国而言就不一样了。


    # 5-


    综上，小镇认为：中国要抓住未来颠覆性突破提供的宝贵契机，提前构建更符合中国利益的全球秩序体系。


    核心是基于非战争对抗长期化的基本判断，中国对外战略要从危机应对转向持久经营，不是打赢某一场决战，而是要在长期竞争中让自己不可被替代、不可被围堵、不可被孤立。


    核心是把传统国家深度合作，比如盟友化，进行拆解，更侧重具体议题的协作，这就回避了无法达成完全信任、中国也不愿意卷入他国因果导致提前陷入战争的问题。


    当前中国与世界各国打交道，一个很深的问题在于，全球各国普遍希望中国能够给以合作保障，比如驻军，对中小国家来说，大国驻军不是什么屈辱，而是互信的基础。'
