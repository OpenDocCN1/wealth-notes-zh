    # GEO 主要分为五部分


    下面简单介绍 GEO 的五个部分，但是你也可以完全不用知道，让 AI 来做，在这一部分的末尾，我会介绍下，怎么让做 GEO，让 AI 把你的 Saas 推荐给用户


    +   - 第一部分、AI 爬虫访问、


    这一部分主要检测 5 个点，AI 训练爬虫能'
  - '[PAGE 10]


    否访问、AI 搜索爬虫能否访问、ChatGPT-User 等用户触发的抓取能否读取真实内容、页面有没有 noindex，以及 nosnippet 等设置是否限制
    AI 引用网页内容。


    可以检查网站的 robots.txt、页面 robots meta 和响应头，确认需要的 AI 爬虫可以正常访问，同时页面没有误加 noindex 或 nosnippet，避免网页可以访问，却不能进入搜索或被引用。


    ```

    openai 文档地址

    https://developers.openai.com/api/docs/bots

    ```


    +   - 第二部分：机器可读性、


    检查主要内容是否直接存在于 HTML 中，title、H1、description 是否完整，以及网站有没有 sitemap、canonical，URL 是否清晰稳定。这些原本就是
    SEO 的基础，在 GEO 里同样重要。


    > > 有点像给 AI 准备的网站说明书，用 Markdown 告诉 AI 网站是谁、有哪些重要内容，以及对应页面的地址。


    +   - 第三部分：结构化数据、


    结构化数据可以帮助机器更明确地识别网站、作者、发布时间和内容类型。大家可以根据页面类型添加 FAQPage、HowTo、BreadcrumbList 等内容结构，再用
    Organization、Person 或 WebSite 说明网站和作者是谁。


    ```

    ogle 文档地址：

    https://developers.google.com/search/docs/appearance/structured-data/intro-structured-data?hl=zh-cn

    ```'
