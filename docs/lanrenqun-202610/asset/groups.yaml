    # 周评，底在哪？重要信号已出现！


    261011 阿牛午评


    整理：公众号懒人搜索，懒人专属群精选


    懒人微信：lazyhelper1


    ![](img/ee72063bee3473d856f6c0e08126d953_0_0.png)


    > 小懒判断｜适合满仓被套想等明确抄底信号、看得懂底背离和考点的人；不适合想找个股推荐的——作者反复强调从不荐股。最值得关注：创业板等五大指数出现周线级别底背离，下方考点3766大概率还要再考一遍，低吸区间3756-3766。坑在于底背离刚开始做，反弹全部看诱多，冲高3822-3849要先做减法，别把“快到底”当“已经到底”。


    朋友们，大家周末好！


    自从大家爱上股市之后，最怕的就是放长假了。一放假感觉就很失落。恨不得天天开盘。


    同样的，大家也害怕开盘，因为一旦开盘，每天就是雷打不动的自动扣款。


    自从十一长假回来之后，虽然只有两个交易日，但是这两个交易日简直让大家里外受困，梦魇又苦恼。连续祭出两根不讲理的阴线调整。


    更搞笑的是，每次放大长假，外围都是利好，纳指蹭蹭蹭的上涨，美股都创历史新高。


    而等到我们假日结束开盘之后，各种利空'
  - '[PAGE 1]


    满天飞，美股也开始低开低走。喷喷喷......其实在本周四，大盘冲高到3858~3868范围的时候，我提醒过大家做减法。


    我提醒过你们3868考点没有利好的话是很难被突破的。大盘会被挟在3868之下活动。


    但是当大盘一把击穿3800点，揽完3766这个该死的考点的时候，我相信大部分人都是无语的。


    3800点肯定是很难守住，但是大盘提前击穿3800点，在时间上，超过我的预期。


    我说过，只要大盘跌破3800，往下走就是大阴线。大盘在周五选择考完3766之后，差点就收成了大绿K。


    可惜在周五下午，冰雪聪明的主力选择了探底回升！走了一个红色金针探底。


    那么大盘真的要反转了吗？


    创业板是否真的到达底部了？


    经过我的分析，发现了一个重要的信号...朋友们，以下讲的内容纯属个人观点，纯属娱乐，不做任何投资建议，谨记遵守平台原则，更不负责大家发家致富，想要靠看文章发家致富的朋友请绕道哈。由于种种原因，周评并未公开，大家自己自由、自愿选择观看与否哈。


    大家一定要记住，我打死都不会推荐个股，也没有群聊，更不会私下收取任何人费用，切记喔！不要上当受骗。'
