    ## 五、律师嫌六七万元的案子太小，我开始自己准备大量案件工作


    实际上，当时哪怕是有 KIMI K3 的辅助下，其实我已经对我这个案件抱着必须走诉讼走法院流程，而不是走提前和解，因为：


    - 1、对方实际上已经拖了很长时间，超过7个月。

    - 2、我除了有咨询 KIMI 之外，我还打电话给法律援助，也找了公益律师给意见，但是那个公益律师感觉他不咋地，态度也不好，只是说了一句，如果上法院没有律师的话，可能会吃亏。

    - 3、后来我一方面放 KIMI 给推荐了，具体找什么律师比较好，另一方面我就直接打开百度地图搜索“律师”。当然我也是清楚，我们的案件金额不高，然后我非常明确我100%对事件没有责任，所以可能找一些最普通的律师就可以了。


    但是万万没想到，直接就会碰壁！ 因为律师所一般会在全广州最高级的写字楼办公（这些律师我们肯定请不起，所以直接忽略），也会在一些老旧大厦里面。同时我


    想起来，平时在街边路过会看到一些所谓的很简陋的“律师事务所”，所以我就让 KIMI 直接推荐一些。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_22_0.png)


    这是 KIMI 推荐的第一个律师，是一位房地产纠纷的律师，我想着我这个案子 6~7w 的金额，大概如果一定能赢的话，1w 元的律师费我是愿意出的，我没多想，直接给打电话过去了。这位律师态度很好、感觉很专业很有耐心，听我讲完我的案件，然后他给的意见是，你这个案件责权比较清晰，同时涉及金额不大，你直接自己来就行，然后表示让他们完整代理，一审最低大概
    25,000 元，如果后面进入二审，还要另外收费，大概 12,500 元起，让我们代理的话，性价比很低。后面就是我在百度地图找的，“街道小卖部律师”，我当时想得很简单：这种总该便宜一点吧？还是一样，我预估
    1w 的预算，没想到的是，还是没人接我的案件！


    ![](img/99fc997c705869be0f6bd9e9965c8d04_22_1.png)


    ![](img/99fc997c705869be0f6bd9e9965c8d04_22_2.png)


    ![](img/99fc997c705869be0f6bd9e9965c8d04_22_3.png)


    - 1、打电话没有接，所以所有律师的微信我都加了。其中一位律师的微信，我把由 kimi 编辑的案件信息资料，直接发过去，没想到对方直接说，案件金额太小，他接不了。

    - 2、另一位律师，看完我的案件信息之后问了我两个问题，a 你真的确定物业是 100%的责任吗？ b 你可以拿到之前的旧的理赔记录吗？


    **寻找律师无果，但实际上对我没有多大影响，**


    一方面是，我本来就有打算自诉，如果真的上法院了，我直接让 codex+kimi 给我先做出来模拟法庭，对我各种模拟攻击，让我下不来台，让我好准备各种意料之外的情况。其实实际上我更加想挑战这个用
    AI 上法院看看会如何。


    另一方面，我心里是打算一定要把这个“维权”搞成功，只要不赔钱，多长时间或者流程多负责我都可以接受。


    **从此也可以得出，为什么普通人“维权”极难！**


    - 1、没有相应的“法律”意识和知识。

    - 2、怕事，像我妈一样的情况应该是普遍情况。

    - 3、可能一般案子不到 10w 的金额还不一定有律师愿意协助，除非是刚毕业的没啥经验的执业律师。

    - 4、普通人也不一定想出来，原来可以用 AI 协助办案。

    - 5、害怕与物业、保险“博弈”“怕事”！

    - 6、办这件事需要有一定的逻辑思维能力。


    ## 六、重要电话前先和 AI 预演，电话后再把录音重新拆一遍


    后面开始同时面对物业、保险、投诉渠道，以及公司不同层级的人。同样一句话，不同身份的人说出来，分量完全不同：有人只是传话，有人可以往上申请，有人有处理权限，也有人根本做不了主。


    所以只要是比较重要的电话，我会先把这个人的身份、以前说过什么、目前已知权限，以及这次电话最想拿到什么结果，交给 Kimi。最后我给一通电话设的目标通常很直接：谁负责、具体做什么、什么时候完成、什么时候给我回复。


    有些比较长的电话，我甚至会把 AI 开在电脑旁边。对方突然讲出一个新的说法，我会趁他说话或者停顿的时候快速输入：“他现在这个说法有什么问题？”“下一句优先追哪个信息？”我后来还真的做过一个
    macOS 实时录音 + AI 分析判断程序。原本想做成：电话实时转文字；AI 同时分析人物、承诺和风险；再直接提示下一句应该追什么。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_25_0.png)


    这个程序确实做了，但没有完全做好，最后也没有真正进入我稳定使用的主流程。真正一直留下来的，反而是最朴素的一套：录音 → 飞书妙记转写 → 人工校正 → Kimi
    复盘。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_25_1.png)


    [插图： macOS 实时录音 + AI 分析程序，如有截图] 重要电话我都会保留录音，然后先用飞书妙记转成文字。转完以后，我自己还要再校一次。


    因为人名、金额、公司、部门和专业词经常会识别错。原始文字一旦错了，后面 AI 的分析也会跟着错。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_26_0.png)


    [插图：飞书妙记真实转录]


    校正以后，我再把整通电话交给 Kimi。我不会只问：“总结一下这通电话。”我真正需要从里面重新拿出来的是：


    这次新确认了什么；谁真正有权限；哪些话属于明确承诺；哪些只是“会反馈”“会处理”；还有什么问题根本没有回答；下一步应该继续找谁。


    ## 录音分析拆解和事后分析


    这个 Kimi K3 协助的录音分析其实非常重要：


    - 1. 可以协助你复盘是否有说错话，有什么内容没有提及。

    - 2. 可以推敲对方的漏洞、画外音。

    - 3. 与不同对象的通话录音后，可以协助分析你的对手的“博弈”能力。

    - 4. 多次录音分析后，可以让你对整件事的脉络、利益点、对方的错误了如指掌，那么后面的直面对话也不会怯懦，同样可以作为万一上法院前的练习。

    - 5. 另外，用 AI 协助案件维权，最大好处就是可以让你始终保持理性，不易犯错，并方便从中捕捉对方或者整件事的纰漏。


    ## 下面是部分 Kimi K3 的录音分析，这里就不一一列举。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_27_0.png)


    ![](img/99fc997c705869be0f6bd9e9965c8d04_27_1.png)


    ![](img/99fc997c705869be0f6bd9e9965c8d04_27_2.png)


    【插图：Kimi 对电话的真实分析】电话前预演和电话后复盘的两个完整 Prompt，我放在文末。这套电话流程后面很快就被我真正用进了物业、保险和投诉推进里。


    ## 七、电话一直谈不下来以后，我开始把事情往投诉、书面催告和总部推进


    到了8月，继续靠物业、保险之间反复打电话、发微信，已经很难再往前走（因单靠业主的投诉是无法形成有效施压，也没有任何法律上的强制性）。前面几个月积累下来的时间线、报价、Excel、照片和争议点已经整理出来，我开始把这些材料直接送进投诉和书面催告渠道。


    8月1日，我第一次拨打12378，电话被转到了人保内部投诉通道，这一次没有形成监管工单。8月7日，我再次拨打12378，正式登记了针对人保财险广东省分公司的投诉。当天，保险理赔人员开始直接跟我通电话，重新谈折旧、赔偿范围这些问题。


    就在当天的后续电话里，保险员来电回复“原来报损清单只有17,000多元的金额，开始出现了“3万多、约五折”这一档新的口头金额。”尽管已经有不少进展我还是没有接受。多个月来的持久战有了第一个松口，让我更加坚定这次维权的胜利一定会属于我！


    8月13日，我又通过广州12345投诉物业。到了8月28日，我收到洛浦街的书面回复。里面有一句：


    > “经我办初步核实，基本属实。”


    ![](img/99fc997c705869be0f6bd9e9965c8d04_29_0.png)


    [插图：8月28日街道书面回复]回复同时提到，物业公司承担小区公共排水设施的维护管理责任；物业管理层已经和保险公司开过专项会议，保险正在研究新的赔偿方案，不再仅以原来的定损结果作为赔付依据。这不是法院判决，也不是“政府认定物业全责”，但这是几个月以来，我第一次拿到来自外部行政渠道的正式书面回复。


    ## 8月29日书面催告


    到了8月底，我开始正式给期限。8月29日13:05，我在群里发出书面催告，要求在9月5日前确定公估机构并启动评估。如果到期仍然没有推进，我准备自行继续处理后续评估并进入起诉程序。


    当天我还专门打电话到对方物业总部，核实正式函件应该寄到哪里。8月31日，我把催告函做成纸质材料，分别寄了两份EMS：一份寄到物业相关地址，另一份寄到粤海物业相关办公地址。寄件时，我把装封过程和EMS底单都留了下来，随后两封快递都显示妥投。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_30_0.png)


    [插图：EMS 底单 / 妥投记录] 然后联系人真的变了。9 月 3 日上午，粤海物业公司运营部刘经理主动给我打电话，不是之前一直在现场对接的管理处人员。这通电话大约
    31 分钟，我全程录了音。


    ## 八、总部运营经理介入后，第二天出现了 67,555 元书面方案


    9 月 3 日上午，物业公司运营部刘经理主动给我打电话，不是此前一直对接的现场管理处人员。这通电话大约 31 分钟，我全程录了音。


    电话一开始，他先说明了自己的身份和来意：自己是物业公司运营部经理，总部收到我的催告函以后，安排他来跟我沟通。他还说了一句：


    > “因为我们要回复流程嘛，所以尽快要跟您沟通一下。”


    ![](img/99fc997c705869be0f6bd9e9965c8d04_31_0.png)


    [插图：9月3日31分钟通话关键转录]这通电话里，当时正在讨论的金额已经到了29,000多元，而我正式提交的报损还是68,555.20元。我继续追前面几个月一直没有弄清楚的问题：这个金额到底根据什么做出来？保险到底有没有真正到现场看过？


    按照这通电话里的说法，前面的金额主要是根据物业人员后期拍摄的照片等材料形成的。我问到保险人员有没有在事故以后到现场实际查勘，对方在这通电话里的回答显示：此前并没有安排保险人员到现场进行实地查勘。而负责拍照的物业人员，也是现场清理以后再去的，当时最原始的污染状态已经不存在了。这是到9月3日这通电话里拿到的信息。


    接下来，电话里第一次出现了一个接近我原始报损金额的数字。刘经理主动问我：如果保险愿意按照接近全额的方向处理，我能不能接受？他谈到的数字大致就是：


    68,555.20元，减去1,000元免赔额，也就是大约67,500元。


    67,500元。


    这时候还不是正式方案，只是电话里的询问和金额空间。


    接下来又谈到了公估。对方问我，如果最后公估出来的金额低于我的 68,555.20 元，我是不是也接受；还讨论过双方共同认可公估机构和最后的公估结果。后面甚至谈到，如果继续推进公估，希望我预先承诺接受结果，并且不再继续走其他维权路径。


    这个我没有同意。电话结束以后，我还是按照前面已经固定下来的流程处理：录音→ 飞书妙记转写 → 人工校正 → Kimi 复盘。复盘以后，我把总部介入、29,000
    元当前口径、现场查勘说法、67,500 元讨论空间和公估附带条件分别记录下来。


    第二天，正式方案来了。9 月 4 日 16:36，保险方在微信群里给出书面方案：


    按照我提交的报价 68,555 元处理；不再扣除折旧；扣除 1,000 元免赔额；最终书面方案：67,555 元。


    ## 排污管堵塞导致业主家受损 RZAB202 (7)


    张先生，您好


    经过内部审核和申请，现在向您同步案件我司的处理意见：本次事故责任按照正常理赔以及第三方公估的行业经验，您家装修已经使用多年，损失是需要结合使用情况做折旧扣减的。我们前期也咨询过第三方公估机构，公估初步也没办法按全新报价全额核定。


    但考虑到目前事情各方都耗费了大量时间精力，也希望尽量妥善化解矛盾，我司专门向上申请做特殊通融处理：愿意按照您提供的报价 RMB68,555元赔付（扣除免赔后赔付67555），不再扣除折旧。这个是超出保险常规标准的一次性特殊方案，只为促成本次事件和解了结。


    如果您能够接受以上方案，我们会第一时间处理好后续的理赔文件和材料，尽快推进赔款支付，把这件事落定，各方均不再就理赔事项进行追究。


    另：这份全额不计折旧的特殊方案，只针对私下和解的情形；如果协商无法达成一致，该特殊方案就不再生效，案件会回归保险合同以及相关法律规定来处理。


    [插图：9月4日微信群67,555元书面方案]


    但这时候，67,555元仍然只是书面方案，我还没有真正收到钱。


    ## 九、67,555元已经写进方案，但钱没到账之前，我没有把事情当成结束


