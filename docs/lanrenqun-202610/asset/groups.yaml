    # 兰德：中国这次不一样


    261021 江宁知府

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/aa24f3d3bac112a3d6afab99883a1037_0_0.png)


    ![](img/aa24f3d3bac112a3d6afab99883a1037_0_1.png)


    小懒判断 | 适合关心中美走向但没耐心啃英文报告的人，兰德这份半官方报告的四点判断给你翻译到位。最值得看的是第 3 点：兰德承认中国核心优势是"工业与技术生态系统"，西方最怕的不是军力而是产业再陷电动车、电池、光伏式覆盖。不适合想看中美开战推演的人，全文明确说竞争是长期非军事为主。坑在于：报告带半官方色彩，观点本身就是美国战略界的自我审视，别当客观中立结论读。


    美国的政治决策系统跟中国存在很大不同，它需要先达成“内部共识”才能够全力投身一场外部对抗或大国博弈，缺乏共识会极大影响总统持续调动资源的能力。


    以伊朗为例，特朗普因未提前取得“内部共识”就悍然发动空袭，使得战争进程断断续续、一波三折。历史上，每当天下大势有变，华盛顿战略界都会进行一番深入分析与辩论，并把最终结果用通俗易懂的方式灌输给广大民众。


    1950 年，美国发布《国家安全目标与计划（NSC-68）》报告，完整表述了对苏联和冷战的战略认知——此时距离罗斯福去世已五年，距离丘吉尔“铁幕演说”四年，距'
  - '[PAGE 1]


    离柏林危机爆发刚刚一年。


    报告对苏联及美苏竞争做了以下几点判断：


    +   1）美国在两次世界大战、两场重大革命（俄国与中国）、五个帝国瓦解（奥斯曼、奥匈、德意志、意大利及日本）以及两大帝国体系急剧衰落（英国与法国）的历史背景下与苏联展开这场终极博弈。

    +   2）苏联是一个被狂热信念所驱动的政权，奉行军事修正主义，无法放松对内动员状态，美国必须实现对其制度的根本性变革（即推翻苏联），并辅以大规模军事部署来应对其征服企图。

    +   3）与以往谋求霸权的国家不同，苏联力图对世界其他地区施加绝对权威，用一套听命于克里姆林宫的体制取而代之，“没有任何其他价值体系能与美国的价值体系如此水火不容”。

    +   4）因核武器的出现使战争成本不可接受，美苏竞争归根结底是社会经济与政治制度的较量，旨在比拼哪种制度能够带来更好的生活与更具活力的社会，在此过程中会对其他国家产生一种引力效应。

    +   5）苏联体制显然不具备西方那样的活力，美国应对“制度比拼”充满信心；1950年美国的整体经济实力约为苏联四倍，若形势不得不演变为工业实力的较量，美国终将压倒苏联。'
  - '[PAGE 2]


    ![](img/aa24f3d3bac112a3d6afab99883a1037_2_0.png)


    如果把美国的全球霸权想象成古代中原王朝，那么现在其实已经到了“边疆烽火四起”的时刻，只不过美国霸权的边疆不在美加或美墨边境，而是在中东、东欧，以及“第一岛链”。


    一般认为，本轮全球变局的转折点始于2018年，参考冷战进程已大致相当于1955年前后。


    然而与彼时不同的是，2026年的美国仍缺乏战略构想和长期规划，对于中美竞争的若干关键问题——对手的本质、竞争核心要素、胜利的具体形态、实现胜利的路径等——迟迟拿不出一版答案。


    2026年9月，知名智库兰德公司发布了一份重要报告，题为《The Scope and Nature of the U.S.-China Competition(中美竞争的范围与性质)》，试图回答上面提到的几个关键问题。


    该研究由美国战争部战略情报与分析办公室资助，具有半官方色彩，其中某些观点能够佐证当下特朗普政府的一些对华行为。兰德认为，作为当前美国唯一的竞争对手，中国有这样几个根本性特征：'
  - '[PAGE 3]


    # 1.


    中国的影响力并非源于意识形态扩张，而是经济发展、在国际机构中日益增长的参与度，以及在科技领域日益强大的地位。中国没有试图重建当今国际体系，其目标是改变国际体系中对自身利益构成制约的要素，包括西方主导的制度架构、同盟关系、技术标准、经济规范以及部分底层价值观。


    1950年，苏联从陆上入侵欧洲的前景十分现实，而如今的中国未对美国及其条约盟友构成全面军事征服的威胁，对建立庞大的全球军事存在、对其他国家施加“帝国式控制”几乎不感兴趣。


    中国给美国施加的地缘政治压力主要是“限制海外行动的自由”，尤其是在中国周边地区，以前美海军可以在东海、南海，甚至台湾海峡和北部湾“自由自在地行动”，现在不可以了。


    另外，还有一股更深层次的压力，那就是威胁到美国的“国家神话”。美国的对内凝聚力与对外霸权信仰始终建立在“世界第一”的概念之上，而中国崛起威胁到了整套神话的根基。


    ![](img/aa24f3d3bac112a3d6afab99883a1037_3_0.png)'
  - '[PAGE 4]


    ![](img/aa24f3d3bac112a3d6afab99883a1037_4_0.png)


    肯尼迪主持国家安全委员会执行委员会会议


    2.


    中国国力相对于美国正在上升，但并不是直线上升，除非美国自身发生重大变故，否则中美竞争很难达到历史上那种“大国权力交接”的模式。


    所谓“权力转移”，通常是指一个崛起大国绕过既有的主导强国，通过新建体系取得主导地位，比如成功的权力转移（1945年的美国）和失败的权力转移（冷战期间的苏联）。


    从直观的 GDP 指标看，美国比中国高出 10 万亿美元；如果按购买力平价的 PPP 计算，则中国比美国高 10 万亿美元。综合国力层面，中国尚未取得对美国的优势。


    事实上，中国能够调动的资源高度集中于本国境内，而美国的综合国力有相当一部分是全球范围内调动资源的能力。即使面临产业空心化、巨额贸易赤字等一系列困难，美国政府也要力保美元的全球货币地位，就是为了方便用美元强大的购买力调动全球物资。


    发展前景方面，当前中国面临的问题跟美'
  - '[PAGE 5]


    国同样严峻。兰德在报告中认为，中国经济增长放缓的原因并非基于易纠正的政策失误，而是源于不可逆转的结构性因素。


    历史上，发展中国家的高增长态势往往会逐渐放缓——这既源于住房与基础设施支出所承载的增长潜力已趋饱和，又与人口城市化以及人口结构萎缩密切相关。


    因此当前国际格局比较像中国逐步与美国一同跻身国际权力格局的顶端，或者说世界政治格局中出现了一个新的引力中心（中国），这种架构将会维持很长一段时间。


    中美身后的两个次级选手分别是欧盟（前提是欧盟能找到更具凝聚力的行动路径）和印度（前提是印度能够保持目前的增长轨迹）。


    # 3.


    在中美竞争的核心议题中，国内经济、科学技术和工业产能是最关键的三大要素，构成了战略力量的基石。与以往主要通过领土扩张来扩大影响力的大国不同，中国将经济战略视为主要手段，希望通过主导先进产业、制定国际标准，在全球生产体系中构建结构性优势来实现崛起，对自身制度优势高度自信。'
  - '[PAGE 6]


    <!-- no content -->'
  - '[PAGE 7]


    影响力。


    因此，应对中国的产业主导地位是美国及其盟友的当务之急，紧迫感超过了地缘政治竞争，西方无法容忍一个又一个产业重蹈电动汽车、电池、光伏的覆辙。


    军事实力当然重要，不过在绝大多数情况下，中美官方声明都将当前竞争界定为一场长期、以非军事为主的较量——尽管战争有可能发生，但亦可避免，核心在于对台海问题的处理方式。该问题上，中国对美国的意图怀有深切忧虑。


    ![](img/aa24f3d3bac112a3d6afab99883a1037_7_0.png)


    # 4.


    中美都力图证明，在剧烈动荡与不稳定的时期，各自的制度最能保障本国人民的福祉，双方试图将下个时代世界政治的基本格局导向有利于己方的方向。


    国内的社会、经济及政治稳定，既可在和平时期转化为竞争优势，亦可在战争时期产生决定性作战效果。中美关系并非完全由零和博弈所定义，它包含了许多协调要素，在理想状态下也包含合作要素，以推动双方共同利益。


    与 1950 年面对苏联时相比，这一次美国对'
