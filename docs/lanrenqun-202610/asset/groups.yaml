    ## 二：实操 sop（手段）


    因为你完全可以从个人消费上选水域，挖需求，拥有属于你自己的专属的赛道。只要你付费了，会"自带基础的审美和评判标准"，这本身就是一种能力，"应该被发现，被挖掘，被重视，被重复利用"，让自己马上就有挂鱼饵的能力。


    人不可能不花钱，但仔细想想，花每一笔钱的背后，都是一门生意，一个已经跑通的商业闭环。


    见效或许会慢一些，但这是成长的碎片，有些路必须自己走，不会挂鱼饵的，成不了钓鱼高手。


    ### C：收集对标账号，搭建素材库。


    ![](img/fb91fc29030ca69ded4cee8ea9c5d414_6_0.png)


    很多人会把注意力主要放在对标账号上，


    个人认为关键词的重要性丝毫不亚于对标账号，它是自然流量的搜索入口，垂类赛道守株待兔，一劳永逸，总有一天等到你。


    内容仓库“渔”部分的衍生思考：


    任何事，都一定会经历一段“无反馈期”，这是铁律。


    吃饭，得一口一口吃，前面那几口吃是吃了，还没饱，是无反馈期；健身，会经历无反馈期；钓鱼高手也不能保证每一次扔鱼饵下去，就能马上得到即时反馈。


    “内容仓库”约等于钓鱼时的躺椅，墨镜，遮阳伞，以比较舒适的状态，度过必须经历的“无反馈期”。


    有内容仓库之后，不存在为每天不懂写什么，发什么的焦虑和烦恼；有数十个对标账号佐证，不会再被阶段性的审美疲劳和自我怀疑困扰。


    ### D：内容制作


