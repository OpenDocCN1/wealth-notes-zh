    # 第十五，板块分析：


    导读：宝子们，因为板块比较多，这个判断会“比较粗糙”，所以大家谨慎参考，后果自负。


    没有任何板块推荐的意思，纯属举例教学哦，不做任何买卖建议，纯板块走势分析而已。


    板块分析包括三个技术指标分别是：日线超买超卖+超买。日线顶背离+底背离。日线上行趋势+下行趋势。


    这3种技术指标，是我自己写程序量化出来的标准，和你们自己平时看到的教学讲解不一样哦。恕我无法教程。


    ①，日线超卖区：这个技术指标表示盘面进入了超卖区域，不宜割肉和投降，易迎来反弹反抽，但不能定性为完全反转！适合胆大喜欢博短线反弹的人，快进快出。日线超买区：表示盘面进入回调的风险，不宜追高追涨。注意不是100%准确。


    ②，日线核心底背离：这个技术指标表示盘面真正进入了一个大的底部区间，属于跌无可跌状态，属于大级别底部。易反弹为一个大波段。适合拿中长线的人。有反转的概率。较为保险。底背离初期，容易继续大跌。底背离中期，分批次进入试错。底背离后期，等待波段拉升即可。而日线顶背离：则易发展并反转为下跌行情，适'
