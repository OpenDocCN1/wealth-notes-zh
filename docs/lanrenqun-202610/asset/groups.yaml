    # 法国千所学校发生暴力骚乱的背后


    261008 猫哥星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/e3732290eb91e12143d5177e8fc6a09d_0_0.png)


    > 小懒判断｜法国千所高中烧校封门：24所被纵火、5000人被捕 85%是未成年人，导火索是10%课时没老师+540亿欧元预算砍教育。先注意全球债务的研究者值得细读——117%债务率下没投票权的学生成最先被牺牲的软柿子，“谁闹得凶谁不被砍”的制度激励分析很透。不适合当法国旅游参考。坑在于作者由教育事件推到全球债务清算，跳跃偏大，结论自辨。


    # 嘉宾供稿


    当我们还在欢度国庆长假时，法国那边又烧起来了。


    只不过这次上街闹事的，不是工人，不是农民，更不是黄马甲，而是一群十五六岁的高中生。他们干的事简直颠覆三观，把自己的学校给封了，有的还点了。


    看到新闻我第一反应是这帮学生不想上学，找个借口闹事。但深入了解才晓得，其实还真不是。


    事情从9月中旬开始，起先是巴黎郊区一所高中，开学一段时间了，数学老师没来，法语老师没来，校医岗位空着，厕所没纸，天花板滴水。为啥？'
  - '[PAGE 1]


    核心就是学校条件太差，冬天冷得发抖，夏天热得中暑，于是老师罢工了，接着学生封门抗议。刚开始谁都没当回事，法国罢工太常见了，就跟下雨一样。


    可两周之后，这把火从巴黎郊区烧到了全法国。1000多所学校卷入，占全法中学四分之一以上。24所被纵火或洗劫，400多所完全或部分停课，近5000人被捕，其中85%是未成年人。


    问题来了，法国高中生到底为什么要搞暴力骚乱？


    除了教育硬件破得离谱、烂得心酸，教育软件也彻底崩了，直接把学生未来断了。这次抗议最大的导火索是老师严重不够。法国公立中学2024到2025学年，约10%的课时因为找不到代课老师直接落空。有的班一个学期换四五个临时工，学生连老师名字都记不全。


    高二高三的学生眼看要参加法国高考，主科老师空缺好几个月，教学进度落下一大截。而且刚好，10月1日政府又抛出2027年预算草案，要搞540亿欧元的节支，涉及大学招生和奖学金收紧。虽然后来教育部长连夜撤回了部分条款，但火已经被点着了。


    说实话，这种教育环境，这书怎么念，换谁都要闹。


    但闹归闹，怎么就升级成席卷全国的暴力骚乱了？我认为，这里头至少有三股力量叠在一起，少一股都烧不到这个程度。'
  - '[PAGE 2]


    <!-- no content -->'
  - '[PAGE 3]


    个国家的问题，而是整个全球经济，包括所有发达国家，过去几十年靠债务驱动增长的老路已经走到头了。


    因为当债务驱动不可持续的时候，就得看预算怎么切蛋糕。怎么切？


    2026年法国公共债务占GDP约117%，财政赤字5.5%，远超欧盟3%红线。10年期国债收益率冲到5%附近，是2002年以来最高。


    每年光还债利息就要吞掉预算越来越大的一块。国防和偿债是硬支出，砍不动，福利更不敢动，马克龙延退到64岁那事儿，全国罢工几个月，差点把政治资本全赔进去了。


    有选票的群体，它也不敢动。所以，最弱势的、没投票权的学生群体，就成了被牺牲的那个。教育经费是软柿子，教师岗位、缩预算，因为学生没法用选票报复你。


    可学生不干了，直接把火点了，也将整个社会的脆弱性暴露无遗。


    说白了，这就是民主选举制下最讽刺的死局，动福利，选民闹，政府倒台。不动福利继续借，债务膨胀，利息吃掉所有预算，加税，中产和资本跑路，税基萎缩。三条路没有一条能体面解决。


    于是，制度里出现了一个荒唐激励，谁闹得凶，谁就不被砍。


    退休群体有票有工会，退休改革推不动。'
  - '[PAGE 4]


    铁路工人有罢工传统，补贴还在。


    只有学生没投票权没工会，所以先砍教育。


    学生又不傻，面对年久失修的教学楼，到处可见的老鼠和蟑螂，没暖气也没空调，现在连老师都没得了，不闹才怪。你安分守己没人理，一闹政府就怕，那谁还愿意乖乖坐着，这就是制度教出来的理性选择。


    把镜头拉远，你会发现法国不是个例。意大利债务占 GDP 超 135%，希腊还在 150% 以上，西班牙、葡萄牙、比利时都在 100% 以上。整个南欧就是一台借新还旧的永动机。


    欧盟不敢严格执行 3%赤字红线，因为一执行等于让南欧集体紧缩，紧缩等于社会爆炸，所以只能假装红线还在，实际上睁一只眼闭一只眼，这不是政策，这是麻醉剂。


    美国国债突破 40 万亿美元，日本国债占 GDP260%，英国养老金危机、意大利银行坏账，全是一个病根，全球经济债务驱动模式走到尽头，各国都在同一条不归路上，区别只在于谁先爆、以什么形式爆。


    回头看 1968 年，法国学生喊禁止禁止，要自由要思想解放，那时候经济还在涨，大家闹着要未来、要理想。2026 年这帮学生不一样，他们喊的是先给我个老师，先修好厕所。同样是烧街、同样是警察催泪弹、同样是政客抢话筒，但底子完全不是一码事。


    当年是增长年代闹未来，现在是债务年代保基本。前者还能谈理想，后者连代课老'
  - '[PAGE 5]


    # 师都谈不拢。


    最后做个总结，法国这场高中生的怒火，表面看是教育事件、治安事件，往深了看是财政事件，但再往根上刨，它暴露的是全球经济，包括很多发达国家去几十年靠债务驱动增长的老路已经走不通了。当债务不能无限膨胀，预算表上的每一刀都会切到活肉，而活肉是会痛、会反抗的。


    法国高中生烧校门，只是这场全球大清算的一个早期信号，连最没反抗能力的群体都受不了了，整个社会的承压能力还剩多少？这条路上，没有遮羞布可扯，只剩越来越大的火。法国学生不是第一个走到这步的，也绝对不会是最后一个。


    ![](img/e3732290eb91e12143d5177e8fc6a09d_5_0.png)


    在这个 AI 能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的护城河，只剩下“信息过滤”的效率与“认知系统”的维度。


