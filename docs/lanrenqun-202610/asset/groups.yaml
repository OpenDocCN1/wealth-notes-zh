    微信：lazyhelper1


    > 小懒判断 | 适合对权力交接逻辑感兴趣、想看懂组织交接班底层套路的人；不适合想看"影射现实"解读者——作者什么都说了又什么都没说。最值得关注的是三种交接的分类框架：非成熟交接靠顾命大臣，成熟交接看"延续治理"还是"布局变革"选人。坑在于文中现代部分全是各国通例，点到即止，别过度联想。


    电视剧《雍正皇帝》是 1999 年 1 月 3 日在央视一套黄金时间首播的，因"九子夺嫡"的故事情节扣人心弦，一下子就创了收视率纪录，成为家喻户晓的名剧。


    节目播出后，作家二月河在接受采访时有过这样一段意味深长的话："康雍乾盛世是两千年封建社会最为辉煌的时期之一，但雍正却为康熙、乾隆的光芒所掩盖。雍正其实是一位非常有作为的皇帝，如果没有他十三年的励精图治，就没有乾隆时代的辉煌。"与大多数影视剧不同，《雍正皇帝》的精华是在前半段，即四爷在一众皇子中脱颖而出，雪夜继位。'
  - '[PAGE 1]


    ![](img/638ba521beff065dd87d485f01880980_1_0.png)


    为了探究里面权力继承的奥秘，我们首先从一段对话开始。


    ![](img/638ba521beff065dd87d485f01880980_1_1.png)


    先宗所琐非玉，难成大器


    出于提前帮四爷扫清继位障碍的考虑，康熙安排了一场跟佟国维的饭局。佟国维是康熙帝舅父兼岳父，其姐为康熙生母孝康章皇后，女儿是康熙的第三任皇后，本人则担任领侍卫内大臣兼议政大臣，位列宰辅。


    同为当朝重臣，佟国维与张廷玉的情况存在很大不同，前者是一个大家族，需要考虑影响力传承问题，无法像张廷玉那样安心做个技术官僚。'
  - '[PAGE 2]


    佟、张二人中，张更贴近皇帝，佟在热河狩猎期间负责留守北京，这意味着佟国维得到的一手信息比张廷玉要少。


    尽管如此，佟国维很早就做出了判断：太子被废是大概率事件，新君大概率出自四爷或八爷。


    佟国维的难题在于自身分量实在太重，普通官员可以等结果，重量级政治家族却必须参与制造结果，而一旦参与进来，就意味着要承担判断错误的代价。


    作为一名老练的政治家，佟国维选择了成本最小的"顺水推舟"（八爷），而不是"逆流而上"（四爷）。


    在这样的背景下，康熙开始了跟自己岳父的较量——康熙："不讲那么多规矩了，端把椅子来让佟大人坐着吃吧。"佟国维："老奴岂敢与皇上对坐？"（根据鲁迅的考究，在清朝旗人自称奴才，是一种拉近跟皇家关系的表述，汉人只能称臣。）


    康熙："咱们今天不讲君臣之礼，只叙亲戚之谊。"接下来康熙就扯了一堆身体如何之类的话，暗示佟国维应告老还乡。


    佟国维："皇上龙筋虎骨圣体旺强，怎么说一个老字？奴才想沾沾皇上的余福，伺候皇上一万年啊！"这里摆明的意思是不想走，还要继续干，康熙："人哪有活一万年的，真活那么长，挡住了后人的上进之路，人家也不答应。俗话说得好，该撒手时就撒手，得饶人处且饶人，咱们都得为后人多想想啊。"接下来便进入讨价还价阶段，康'
  - '[PAGE 3]


    熙先是提出"佟家后生里面有谁可以出来当差"，佟国维一番表演又迫使康熙把价码抬高至"后辈当中有谁可堪大用"。


    听到"大用"这俩字，佟国维不再装糊涂，果断推出了隆科多（剧中是叔侄关系，历史上是父子）。


    中国古代的官员实际上分为两类：一类是科举考上来的技术官僚，比如张廷玉就是进士出身；另一类是世袭望族，像佟国维、隆科多等人根本不需要考科举，他们的政治资本来自旗籍、家族关系以及与皇室的姻亲。


    技术官僚好比一个个"原子"，关键时刻力量有限，对皇权限制不大；世袭望族则是皇帝必须拉拢的对象，带有"共治"意味。


    饭局最后，康熙以提拔隆科多担任九门提督为条件换取佟国维退休，而佟是何等精明之人，立刻领会到皇帝要自己退休就是倾向于四爷而非八爷——否则没必要做这笔交易。此后佟国维对隆科多的历次指点，都是基于这一判断。


    剧中叔侄二人还有过一段"烧热灶"与"烧冷灶"的讨论，分工是老练的佟国维去烧八爷"热灶"，道行甚浅的隆科多去烧四爷的"冷灶"。


    这其中大有学问，因为"烧热灶"需要地位履历，操作起来有门槛，一旦烧不好还得及时抽身撤退，必须让政治经验丰富的老手去做。


    "烧冷灶"则简单一些，风险更小，毕竟人'
  - '[PAGE 4]


    在低谷时只要有力量投靠就会很开心。


    接下来切入正题。


    权力交接与继承人挑选分为三种情况，操作思路截然不同：第一种是非成熟交接。


    所谓"非成熟交接"，即目标对象尚不具备掌控局面的能力，如幼年皇子或没有足够政治基础、突然被拔擢到权力中心的官员。


    政治是极度依赖经验的，一般来说，政治家提升决策质量有两种方式：一种是自身在因缘际会下拥有了丰富历练，另一种是反复研究"他人的错误"。


    无论哪种方式，都需要时间、天赋和高人指点。


    幼年皇子因缺乏政治经验，继承时会面临如何顺利实现权力交接并稳固局面的难题，此时顾命大臣的角色就会非常关键。


    皇权交接跟普通职位任命的底层逻辑大不一样。


    一位县长理论上可以直接去干市长，副市长即便心里不服也无可奈何，这是因为有上级部门给新市长撑腰背书。


    可倘若康熙让一位幼子接班，四爷、八爷这些人不可能没有动作，所以古代才有"立长不立幼"的说法。


    第二种是以"延续现有治理"为基础的成熟交接，第三种是以"布局未来变革"为基础的成熟交接。'
  - '[PAGE 5]


    ![](img/638ba521beff065dd87d485f01880980_5_0.png)


    后两种情况下，目标对象本身已有相当强的实力，缺的只是皇权名分或职权加成。以剧中的四爷、八爷为例，因康熙高寿，他的儿子们都早已成年，且经过颇多历练，雍正继位时
    45 岁，八爷胤禩只比四爷胤禛小两岁。


    此时顾命大臣的重要性并不高，因为顾命大臣的核心作用是替新君维持住原有权力结构，等待新君慢慢具备独立执政能力，无论对四爷还是八爷来说，他们都不需要佟国维或张廷玉来替自己做主。


    雍正接替康熙，类似于老局长走后调来了一位新局长，副局长张廷玉的角色没有任何变化，还是干以前那些活，只不过换了个领导汇报，期间不需要他"代理主持工作"。'
  - '[PAGE 6]


    ![](img/638ba521beff065dd87d485f01880980_6_0.png)


    ![](img/638ba521beff065dd87d485f01880980_6_1.png)


    ![](img/638ba521beff065dd87d485f01880980_6_2.png)


    原作者所有，仅阅读，不作商业用途。进群学习加微2252


    ![](img/638ba521beff065dd87d485f01880980_6_3.png)


    第二种情况与第三种情况的区别主要在于"未来治理路线"。


    站在康熙角度，他最关心的是"后康熙时代"治理问题，而不是新君继位后的稳定问题。'
  - '[PAGE 7]


    假如康熙对当前大清的形势非常满意，那目标很可能是找个延续现有治理理念的人，以传承既有政治经济资产为主，比如太子和八爷。


    可如果康熙对现状不满意，但限于自己年迈、已无心力推动大规模变革，那就更有可能挑选一个跟当前利益群体产生纠葛不多，方便推动变革的皇子，比如四爷。


    在《雍正王朝》中，编剧暗示四爷和八爷分别代表"改革派"和"保守派"。


    八爷最大的优势是人缘和组织能力，得到大量王公、官僚甚至朝廷重臣的支持，善于经营政治联盟，跟既有秩序深度绑定；四爷则表现出"解决问题的能力"，尤其是面对一些积弊沉疴时的魄力与决心。


    至于为什么不早点立四爷为太子，原因比较复杂，既有避免过早形成新权力中心的目的，也有防止八爷党撬桌子的考量。


    历史上清朝皇帝多采用"秘密立储+遗诏指定"的方式，康熙本人也是由顺治帝遗诏指定继位的。


    佛教中有"三世佛"的说法，即过去佛、现在佛和未来佛，三者很容易产生彼此独立的权力中心。'
  - '[PAGE 8]


    ![](img/638ba521beff065dd87d485f01880980_8_0.png)


    ![](img/638ba521beff065dd87d485f01880980_8_1.png)


    古代皇权地位是极高的，一旦坐上宝座，从身份到职权都会发生巨大跨越。


    到了明清两朝，围绕皇权的机制性保护愈发完善，总共只发生过三次军事政变，分别是朱棣的靖难之役，明英宗朱祁镇的夺门之变，以及1861年慈禧和恭亲王奕訢联合发动的辛酉政变。


    本身实力以及机制性保护意味着“结党”的意义降低，新君只需要最硬的权力——军权——辅助继位即可，目的是避免极端场景出现。


    因此，历史关口九门提督隆科多的重要性要超过军机大臣佟国维，而八爷费尽心机拉拢的文官班底、铺垫的朝堂声势，实际上并没有起到加分作用。


    从这个意义上讲，太子和八爷从一开始就“分了心”，与全神贯注瞄准大位的四爷不同，'
  - '[PAGE 9]


    太子和八爷党均被牵扯进户部欠款等经济问题，完全没有分清轻重缓急。


    对于政治人物来说，权力是根，其他一切都是枝叶。


    值得注意的是，剧中"王牌军师"邱思道为四爷谋划了一条颇为腹黑的夺嫡之路，即充分利用八爷的野心扳倒太子，自己坐收渔利。


    太子华竟树大根深，八爷因在两次废储过程中用力过猛，得罪了不少人，而这些太子旧部中有许多被四爷悄悄收编，最典型的便是太子老师王掞。


    官场之上，对那些存在争议的事情要尽量远离，尽管有些事情在当下看属于临门一脚，但它未来很可能会被“重新解释”，产生意想不到的漩涡，成熟政治人物通常不会让自己处于争议事件的漩涡中心。


    ![](img/638ba521beff065dd87d485f01880980_9_0.png)


    简单概括一下。


    《雍正王朝》里康熙在挑选继任者时没有一定要找"像自己的人"，也没有非要找单'
  - '[PAGE 10]


    纯意义上优秀的人，而是针对下阶段中心任务做人事配置。


    国家治理本身存在周期性，前任留下的问题不同，下个时期的大环境不同，对继任者的素质要求便不同。


    倘若在特殊情况下不得不采用“非成熟交接”来处理重大改革、应变等问题，则可谓之曰“临危受命”。


    ![](img/638ba521beff065dd87d485f01880980_10_0.png)


    > 你皇爷爷弥天的时候

    > 曾经对你阿玛说过

    > 他毕生的遗憾就是

    > 明明知道该整顿吏治、推行新政

    > 却没有这么做

    > 把这个担子交给了你阿玛

    > 阿玛不能再带着这个遗憾

    > 把祖宗的江山社稷留给后人

    > 要得罪人，要留下骂名

    > 你阿玛一个人担下来


    与古代不同，现代国家高层权力配置涉及多个系统，交接起来更为复杂，粗略梳理下来大概有这样几种模式。


    # 1、预留过渡期


    通过一段时间的锻炼和交接，让继任者充分熟悉组织、军事、外交和人员培训等事务，并逐渐拥有自己的班底。'
  - '[PAGE 11]


    被培养的人通常会有多个省份、多个系统的历练，其中一个重要目的就是让新领导"有人可用"。


    至于风格倾向，更多取决于对未来的判断——优先解决发展速度还是发展质量，优先考虑融入全球化还是应对大国竞争。


    当一个人晋升为领导时，他所经历的不仅仅是职位、职责和权力的变化，还有深刻的心理转变，包括个人身份与领导身份的融合，以及逐步与同事、亲人等划定权威界限，这个过程本身也需要时间。


    ![](img/638ba521beff065dd87d485f01880980_11_0.png)


    # 2、建立"影子内阁"与精英协商体制


    在以英国为代表的部分议会制国家里，在野党为准备上台执政会设立一套预备内阁，提前把各个关键岗位的大臣配好，被称为"影子大臣"或"影子部长"。'
  - '[PAGE 12]


    <!-- no content -->'
  - '[PAGE 13]


    属同一党，那么属于成熟交接；一旦涉及两党更替，或者新总统是政治素人，则带有“非成熟交接”的意味。


    后一种情况下，美国政治制度的解决办法有两条：其一是通过强大的文官制度为政权增添稳定性；其二是通过选战（至少半年）和交接（约三个月）实现过渡。


    选战本身就是一个组建班底的过程，在总统候选人的选举团队里，外交、国防、财政、经济、能源、贸易等领域都有专门团队及负责人，并不是等到赢得大选以后才考虑“谁来当部长”。


    从投票前六个月成立白宫过渡协调委员会开始，到新总统上任后重要岗位取得国会任命为止，整个交接过程差不多接近一年。


    ![](img/638ba521beff065dd87d485f01880980_13_0.png)


    《道德经》里有一句流传甚广的名言，被许多政治家和商界大佬所喜爱——“夫唯不争，故天下莫能与之争。”其字面意思是说：正因为他不与别人争夺，所以天下没有人能争得过他。


    延伸解释为不要把自己置于事事争锋的位置，因为争本身就是一种成本，要在看似'
  - '[PAGE 14]


    退让中保存实力、积累优势，以超脱姿态达到"天下莫能与之争"的效果。


    这句话非常符合顶级政治较量的逻辑，即真正的赢家往往是在最后关头才崭露头角。


