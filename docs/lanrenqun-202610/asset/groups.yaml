    # 03 要有「对抗旺季幻觉」的清醒


    自由职业最大的坑，我和大多数季节性从业者一样踩过——旺季幻觉。


    雪季旺季，连轴上课，收入天天到账。人会有一中轻飘飘的错觉：我现在赚钱太容易了，多花一点无所谓。'
  - '[PAGE 7]


    打工时期那种"今天太累了，买点好的犒劳自己"的心理，到这里并没有消失，只是换了件衣服：


    +   - 看到新款雪服好看，明知道旧的没坏，还是下单了；

    +   - 为了颜值换了双新雪鞋，结果新鞋磨脚，忍痛穿不了，还得再花钱换回去，一笔支出变成了两笔；

    +   - 每天一杯 20 块的奶茶，加上频繁的社交吃饭，"几百块钱算什么"。


    当时我总能给自己找到理由：雪季这么累，对自己好一点很正常。


    真正的暴击永远发生在淡季。雪季结束，订单清零，连着几个月没有进项。看着卡里的钱一点点变少，我甚至看不上"一天三五百一天不差"的小单了——胃口被旺季养大了，面对淡季那些小业务时反而提不起劲、动作变形。


    那个雪季算总账，我赫然发现：我明明赚了比以前多得多的钱，但留下来的结余，远低于预期。也是在一次次这样的淡季里，我彻底钉死了一个判断：


    "对自己好一点"这句话没错，但要能分清是真的帮自己成长，还是满足消费欲望的陷阱。旺季那笔钱，不是全给你花在当下的，其中一大部份，是你借给淡季那个零收入的自己的。


    那"分不清"的时候怎么办？我用 AI 帮自己做判断'
  - "[PAGE 8]\n\n说实话，光靠自己想，人是很难判断一件事到底是\"成长投资\"还是\"欲望陷阱\"的。尤其当你想买一样东西的时候，你总能给自己找到理由。所以我后来做了一件事：把我真实的资产情况交给AI，让它用一套外部的框架来给我挑毛病。我的做法是这样的：先把我的现状说清楚——存款比例多少、投资比例多少、收入多少、支出多少、每个月最低生活成本是多少。然后切换到几个不同的视角，请他们分别给我分析、给建议。\n\
    \n# 我常用的几种视角：\n\n+   - 《花钱的艺术》—— 主要用来校正我的消费观。\n+   - 巴菲特、查理·芒格的框架—— 用来判断一笔钱该不该花、该往哪儿放。\n\
    +   - 经济周期—— 用来决定我定投的比例。\n\n> 你是一个逃不开的周期这本书的作者，也是一个专业的经济学家和金融分析师。我现在要定投标普500和全球ETF，你来分析现在处于什么位置，两个的投资比例。全球经济处于什么周期，美国经济又是什么周期。\n\
    > \n> 工作了 52s >\n> \n> 作为《逃不开的周期》的作者视角，我用欧美周期框架（康波长波 + 朱格拉中周期 + 基钦库存周期 + 库存温差房房地产周期）来定位当前位置，并结合最新宏观与估值数据给出定投建议。\n\
    > \n> 当前时间是2026年4月下旬。结论先说清楚：\n> \n> 全球与美国都处于“扩张后期/过速期”，不是衰退，但也不是低位便宜阶段。标普500估值极高，全球ETF相对有吸引力。定投比例建议以60-65%标普500\
    \ + 35-40%全球ETF为主。\n> \n> 1. 美国经济周期位置\n> \n> 美国目前处于扩张后期 (late expansion)，韧性强但约束增多。\n\
    > \n> - 增长：2026年实际GDP预计2.0-2.4% (Q1约2.1%，Q2约1.5%，全年中枢约2.2-2.3%)。AI相关资本开支是主要支撑，对增长贡献显著。\n\
    > - 就业：失业率稳定在4.1-4.3%，岗位增长超过意义平衡水平，劳动力市场偏紧但不过热。\n> - 通胀与政策：核心PCE约3.2-3.4%，总PCE约3.6-3.7%。美联储2026年9月加息25bp至3.75-4.00%\
    \ (三年以来首次加息)，并暗示可能继续，目标是把通胀更快拉回2%。政策已从“宽松溢菜”转向“偏紧”。\n> - 风险：中东地缘维持高能源价格、关税残余影响、AI数据中心带来的局部通胀压力，衰退概率仍低（约25%左右），但增长上限被利率和通胀约束。\n\
    \n# 一个真的帮我改了决定的例子\n\n我特别爱买鞋。运动鞋、相似的款式，家里一堆。每次看到都觉得\"这双不一样\"，然后买回来，穿几次就搁着了。"
  - '[PAGE 9]


    这就是典型的**重复性消费**——不是没有鞋穿，是买的那个动作本身让我爽。


    后来我拿《花钱的艺术》去对照自己的这个习惯，才发现问题不在“该不该买鞋”，在于我把消费当成了即时奖励。


    于是我改了规则：**鞋子不再是“想买就买”，而是变成目标奖励——达到什么目标之后，才奖励给自己。**这个改动不大，但它是真的落地的：那部分重复性支出，实实在在在降下来了。而且因为变成了奖励，买的时候反而更开心——**它不再是被冲动支配的一笔消费，而是我自己兑现给自己的一个承诺。**


    # ## 投资上也一样


    我不是拿钱去赌。**我的配置以偏低风险的基金理财为主，比如标普 500 这一类，做定投。**


    而且定投的比例不是定死的——**我会根据经济周期来决定这个阶段投多少。**有些阶段多投一点，有些阶段少投一点。


    **这套东西的意义，不是让我赚到更多的钱，是让我在花钱和投钱这两件事上，都不再靠一时的情绪。**回到旺季幻觉那件事上：我现在能在旺季克制住冲动，不是因为我意志力比别人强，是因为我手里有一套判断工具。**意志力会用完，工具不会。**


    # ## 04 要有「穿越淡季」的结构和内核心力


    **先说不确定性的那一面。**'
  - "[PAGE 10]\n\n自由职业最磨人的，不是累，是什么都说不准。\n\n原本预约好的客户，可能突然延后。有客户跟我定了元旦三天的课，还付了小额定金，我也就为此推掉了另一个客户的课。结果他临时有事,把时间往后挪了——我的档期空在那里,另一个客户也接不上了。两边都没了。\n\
    \n甚至原本说好连续上七天的课，中途也会因为各种原因拆成两次、三次，时间变得零碎、流动、不可控。\n\n还有更根本的：寒假、节假日课多得排不开，学生上学期间却几乎没有课。这种起伏，我控制不了。它还特别耗心力——没课时你会怀疑自己，有课时你会怕错过后面的。只能不断的调整自己，想办法用别的模式赚钱。所以自由职业的第一课，是接受它本来就不确定，然后用结构去兜住它。\n\
    \n# 我用三个动作把结构搭起来\n\n+   ① **写死一条铁律：旺季赚钱，按淡季的标准生活。** 即使在月入数万的旺季，我的个人日常生活，也一律严格按照淡季的最低标准来规划。雪季收入暴涨时，坚决克制冲动消费：不盲目换新装备、不跟风攀比，砍掉烟酒、奶茶和无效应酬。把雪服、装备全部定义为事业生产资料，非破损、非刚需绝不更换。\n\
    +   \n+   ② **每一笔进账，先切四块。** 这套比例是在《小狗钱钱》的基础上，结合淡旺季实际"
  - '[PAGE 11]


    情况一点点调出来的。任何一笔进账，绝不直接进个人账户，先强制切分：


    +   - **30% 绝对不动（救济金/安全垫）**：直接冻结，保障未来 6 到 12 个月哪怕零收入也能从容活下去。这笔钱让我不用为了生存接低价烂单，不用淡季借贷度日。\n-
    **20% 未来固定开销预留**：锁定接下来的房租、基础吃住这些硬性成本。\n- **25% 事业再投资与装备成本**：未来的雪票、路费、住宿、装备更新，以及买课程、提升认知的费用，全部从这里出。\n-
    **25% 稳健投资理财**：进入低风险账户，让钱去产生复利。


    这四块切完，我立刻就知道这个月我"能用多少钱"。剩下的才是生活费，我不会去动那 70%。


    记账这件事，一定要跟分配配套做。我会把生活开支单独记一本——不是为了自我批判，是为了看清钱到底流向了哪里。不记账的后果我太清楚了：总感觉"没花多少钱，都是小钱"，结果一积累，数目并不少。有了这本账，下个月和后续的消费才有调整的依据，而不是凭感觉。


    # ③ 把固定成本变动化。


    不管自己做项目还是组微型团队，我不在起步期背固定成本——不租昂贵的固定场地、不开固定的高额底薪。尽量采取"按场次/按项目结算"的合作模式：有需求才付费，没业务时零成本潜伏。打工是公司帮'
  - '[PAGE 12]


    你兜底固定成本，自由职业是自己承担所有盈亏。所以我一直坚持不签长期固定合约、不背固定人力成本、不承担闲置损耗。让成本跟着需求流动，绝不被固定负债锁住现金流。


    # 别忘了一件最容易忽视的成本：五险一金


    自由职业有个特别容易踩的坑——五险一金被默认放弃了。刚辞职那阵我完全没感觉，反正年轻、身体好、也不买房。可后来一想到自己的医疗、还有房贷，心里就开始发虚了。自由职业看起来自由，其实是把公司原本替你承担的那部分风险，全部转移到了你自己身上。所以我开始一个个补：


    +   - 医保：先交上了，这是最基础的兜底。

    +   - 百万医疗险：作为医保之外的补充，防止一场病把几年积蓄清零。

    +   - 公积金：这是我最意外的一块——我原以为自由职业者没戏，后来去查，发现灵活就业人员也可以自己交公积金，并且还能用它申请公积金贷款。我最后真的办下来了。


    各地政策不一样，大家务必去查一下自己当地的具体规定，有的城市支持灵活就业缴存，有的还有缴存比例和贷款的细则要求。这件事值得花半天去搞清楚，因为它是几十年的复利问题。


    自由职业不是"不要保障"，是"自己给自己发保障"。没人替你交，你就得自己惦记着这件事。'
  - '[PAGE 13]


