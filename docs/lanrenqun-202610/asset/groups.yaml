  - "[PAGE 4]\n\n学习中，今天主要分享我自己做的 2 个动作\n\n# ## 2.1 做内页 | 首页\n\n做内页，就是做 TDH\n\n+  \
    \ • T，就是标题\n\n> 网页标题。就是谷歌搜索结果里那个蓝色大字，也是浏览器标签页上显示的文字。这是谷歌判断你的页面讲什么的最重要依据——写好了，排名才能上去。\n\
    > \n> 10~30 字符，核心词放最前面，别啰嗦。\n\n```\n✔Free QR Code Generator - Create & Download\n\
    Instantly | ToolHub\n✔Best Image Compressor - Reduce Size by 80%\nWithout Quality\
    \ Loss\n✘Welcome to my website\n✘QR code generator online free tool (堆砌，没\n卖点)\n\
    ```\n\n+   • D，就是描述\n\n> 页面描述。搜索结果里标题下面那两行灰色小字。谷歌不一定照搬你写的，但写好了能提高用户点击的概率。\n> \n\
    > 150~160 字符，说清「你能解决什么 + 为什么选你 + 行动号召」，用户看了想点。\n\n```\n✔Generate QR codes instantly\
    \ for free.\nSupport URL, text, WiFi, and vCard.\n    Download in PNG or SVG.\
    \ No sign-up\nrequired. Try now!\n✘This is a QR code generator website.\n```\n\
    \n+   • H：可以理解成 markdown 的层级\n\n> 各级标题（H1 到 H6）。H1 是一个页面的大标题——通常跟 Title 保持一致或密切相关。H2、H3...是下面的小标题，就像文章的章节骨架，"
  - '[PAGE 5]


    谷歌靠它们理解你的内容结构。


    H1（主标题，一页只准有一个） = 主关键词

    ├ H2（3~5 个） = 相关关键词

    │ ├ H3 = 长尾关键词


    # 一句话总结


    +   - **T（标题）** —— 告诉谷歌和用户"这页讲什么";

    +   - **D（描述）** —— 吸引用户点进来;

    +   - **H（标题层级）** —— 把页面内容搭成清晰骨架，让谷歌读懂。


    另外需要注意的点：一个页面只能有一个 H1。


    这是硬规矩。谷歌用 H1 来判断"这一页到底讲什么"，你写两个 H1，谷歌就不知道哪个是大主题了。


    H2~H6：没有固定数量，但要有"骨架感"

    H2 到 H6 是小标题层级，用来搭页面内容的骨架。没有"一个页面必须有 3 个 H2、5 个 H3"这种硬性规定。


    关键看内容：你的内容分了几个大块，就写几个 H2；每个大块下面需要再细分的，就用 H3；再往下就是 H4。


    写页面之前，先想清楚内容大纲！


    上面是一般的写法，也是业内标准写法.但是你如果想要出单，还要更近一步


