- raw:
  - '[PAGE 18]


    要有【守钱的底座】让自己有资格说"不"；要有【算清账的能力】让流水变成真正的利润；要有【对抗旺季幻觉的清醒】让今天的花费不偷走明天的底气；要有【穿越淡季的结构】让波动不再击穿你的心力；要有【立即落地的执行力】让想法变成现实、让行动生出结果；要有【内化的认知】让你相信自己本来就配得上掌控金钱。


    到这里你会发现，这几条其实都在回答同一件事——怎么让你和钱的关系，从"被它牵着走"变成"由你说了算"。《花钱的艺术》里有句话：幸福≈你拥有的−你渴望的。降低不必要的欲望，往往比多赚一点钱更能提升幸福感；知足本身，就是一种心理财富。


    所以真正的分水岭从来不是存款数字：


    +   - 有钱（Rich）——是银行里有钱，能买各种看得见的东西。\n- 富有（Wealthy）——是能控制金钱，而不是被金钱控制；是拥有时间和人生的主导权。


    也许此刻的你，还没有完全准备好。也没关系，继续攒钱，继续尝试，继续探索。


    你不需要一开始就拥有一整套完美的现金流结构，你只需要先做对这个月那一笔钱。开源决定了你今天能跑多快，但现金流结构，决定了淡季来临、风雪交加的时候，你还能不能安稳地睡个好觉。希望你终将可以和我一样，自由的赚钱，自由的旅行，自由的享受生活。'
