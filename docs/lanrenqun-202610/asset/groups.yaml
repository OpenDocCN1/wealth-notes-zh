    因为前面的 AI 分析本身就有错误，有时会把推测写成事实，责任和赔偿判断也出现过说得太满、后来证明不可靠的情况。如果直接搬总结，这些错误也会一起被带到新的聊天里。


    所以我迁移的不是一份“豆包总结”。


    我尽量把原始材料一起带过去：自己的陈述、对方原话、聊天记录、报价表、Excel、照片、录音转写，以及以前 AI 做过的分析。


    这些东西不能混成一类。


    原始事实是原始事实，对方说法是对方说法，表格、照片、录音是材料，AI 以前做过的分析只能继续作为分析。日期、金额、人物身份如果互相冲突，也先把冲突留下来，不让新的
    AI 自动挑一个看起来最合理的版本补上。


    然后我把这些整理好的资料交给 Kimi。


    后面 Kimi 持续帮我维护的东西，主要就是：时间线、人物和权限、金额变化、证据状态，以及仍然没有确认的问题。每次出现新的电话、人物、金额或者文件，就把新材料放回去，更新当前案件状态，再继续往下处理。


