    # 美债收益率飙升冲高，全球市场承压


    261007 洪灏

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/e9ace85d5e705eb8383442918055deba_0_0.png)


    ![](img/e9ace85d5e705eb8383442918055deba_0_1.png)


    微信：lazyhelper1


    小懒判断 | 适合每天盯盘、想理解"美债利率→成长股杀估值"传导链的投资者；不适合只想看个股代码的散户，全文是宏观复盘没有推荐。最值得关注的是文末观察清单：美债10年、30年期是否续创新高，叠加成长股与权重股跌幅是否收窄，用来判定这波是短期冲击还是趋势转折。坑在于数据口径停在9月24日收盘，节后开盘需重新验证，文中也明言不构成投资建议。


    美债收益率飙升冲高，全球市场承压作者：洪灏本文约1400字。美债10年期单日跳升17bp至5.05%创2007年来新高，30年破5.44%创2004年来新高，10月加息概率升至64%；WTI原油站上93.3；A股创业板跌2.68%、深成指跌2.34%、上证跌1.22%、恒指仅跌0.29%；成交1.65万亿缩量；央行515亿逆回购加8000亿MLF净投放2000亿；涨停52只跌停13只炸板30家。


    主线：美债收益率创数十年新高，10月加息定价骤升，压制全球风险资产美债10年期收益率隔夜单日跳升17个基点，创17个月来最大单日升幅，升至2007年7月以来新高；30年期升破5.44%，创2004年6月以来新高，10月加息预期骤然升温，直'
  - '[PAGE 1]


    接推高油价、压低美股期货，成长/久期资产首当其冲。


    A 股顺着这条链条走弱：创业板跌 2.68%、深成指跌 2.34%，跌幅明显重于权重股集中的上证（跌 1.22%）和港股恒指（仅跌 0.29%），两市 1098
    家上涨、4047 家下跌，普跌面很宽但成交较前一交易日回落，不是恐慌式出逃。


    本日报要今天全球市场的主角是美债。10 年期美债收益率周三单日跳升 17 个基点，是 17 个月来最大的单日升幅，一度触及 5.05%、创 2007 年 7
    月以来新高，较 3 月低点已累计上行 113 个基点；这个势头延续到周四，30 年期收益率升破 5.44%，创 2004 年 6 月以来新高，距 2020
    年低点已回升近 500 个基点。


    市场把这次上冲解读为通胀而非增长驱动——WTI 原油重新站上 90 美元上方，10 月加息（而非降息）的定价概率被推到 64%。A 股：上证指数收 3888
    点跌 1.22%，深证成指收 13317 点跌 2.34%，创业板指收 3289 点跌 2.68%，科创 50 收 1622 点跌 2.35%；沪深两市合计成交约
    1.65 万亿元，较前一交易日成交量回落（沪市降约 6%、深市降约 10%、创业板降约 11%）。


    两市涨跌家数 1098：4047，涨停 52 只、跌停 13 只，盘中炸板 30 家。港股：恒生指数收 24761 点跌 0.29%，国企指数收 8266
    点跌 0.09%，恒生科技收 4361 点跌 0.41%，三个指数当日跌幅都在 1%以内，明显抗跌于 A 股成长板块。'
  - '[PAGE 2]


    货币与汇率：央行9月24日以固定利率、数量招标开展515亿元7天期逆回购，中标利率1.40%；当日到期1620亿元，7天逆回购口径净回笼1105亿元。


    同日另开展8000亿元1年期MLF操作，本月到期6000亿元，净投放2000亿元，是连续第3个月净投放。人民币中间价报6.7489；在岸即期约6.7021、离岸约6.7151；美元指数约101.25。


    互联互通：北向资金9月24日成交约2325.1亿元；南向资金当日成交约630.0亿元，净买入约29.0亿元。


    # 1. A股


    ![](img/e9ace85d5e705eb8383442918055deba_2_0.png)


    上证今天低开在3925，盘中最高只到3931，全天单边下行收在当日最低点3888，跌破50日均线（约3900）12个点，也跌破20日布林中轨（约3927），收在20日布林下轨（约3860）上方约28点的位置——处于布林带下半区但尚未触及下轨。


    上方100/200日均线分别约3989、4010，都在收盘价上方超过100点。创业板指、科创50全天同样收在当日最低点，跌幅比上证更深，弱势比价格本身更明显。


    不是权重股普涨；跌停13家、盘中炸板30家，炸板数已经逼近涨停数的六成，说'
  - '[PAGE 3]


    # 明打板资金的追高意愿在明显下降。


    # 2. 港股


    ![](img/e9ace85d5e705eb8383442918055deba_3_0.png)


    港股明显抗跌于 A 股，是同一条美债利率冲击链条下的另一端。恒指只跌 0.29%，国企指数几乎打平（跌 0.09%）、恒生科技跌 0.41%，三个指数的跌幅都不到
    A 股创业板、深成指的五分之一。


    小米集团涨 1.5%、网易涨 1.2%，快手跌 0.9%、中国人寿跌 0.9%、美团跌 0.8%，波动幅度普遍在 1% 以内——没有看到成长股被明显、集中地抛售的迹象。


    # 3. 街谈与热议


    出版（新华文轩、内蒙新华、新华传媒）：盘面上打板资金对出版股的追捧仍在继续，但公司自己已经连续发布交易异常波动公告。地产：近日公开重申 AI 泡沫风险，同时把地产的机会从十年一遇上调为二十年一遇。洛阳钼业：厦门钨业就豫鹭矿业钨生产事宜提起仲裁。


    # 4. 宏观、美股盘前、商品与国债


    美债抛售隔夜加速。10 年期美债收益率周三大涨 17 个基点，创 17 个月来最大单日涨幅，触及 5.05%，为 2007 年 7 月以来最高。'
  - '[PAGE 4]


    直接推手是油价：WTI与布伦特双双重回每桶 90 美元上方，在投资者原本已押注降息之际重新点燃通胀担忧。市场隐含的美联储 10 月加息概率周三盘中升至 64%。


    商品：WTI 原油 93.3 美元（+1.3%），布伦特 104.8 美元（+1.7%），COMEX 黄金 4297 美元（-0.5%），白银 64.0 美元（-0.5%），铜
    6.79 美元（+1.7%）。


    美债 2 年 4.87%（-3bp）、10 年 5.12%(+1bp),30 年 5.43%(+4bp);中国 10 年 1.68%（持平），美中 10 年利差约
    345 个基点。


    5. 下一交易日观察清单 9 月 25 日中秋节，沪深休市、港股照常交易，下一次更新为 9 月 28 日（周一）。明天如果美债 10 年、30 年期收益率明显回落、不再刷新高，10
    月加息定价的概率也跟着回落，且 A 股成长股跌幅缩小到与权重股相近的水平，说明今天这次是短期冲击而非趋势转折；反之如果收益率继续创新高、加息定价继续走高、成长股跌幅继续走阔，说明这条主线仍在压制全球风险资产，主线就得到强化。


    沪深与港股交易所公开行情，中国人民银行与中国外汇交易中心公告，彭博，TradingView，Yahoo Finance。不构成投资建议。


