    底背离信号，这决定着主力是否猛烈介入的底线。也是核心。


    甚至要关注大盘周线底背离的情况。


    第十一，明天大盘会怎么走？


    那么明天大盘会怎么走呢？


    朋友们，由于大盘的周线和月线依然是双死叉结构，那么意味着中长线依然是洗盘打压为主。大家暂时可以放弃回3900点的看法。


    由于大盘日线底背离没有做结实，而周五大盘急急忙忙的拉升，还是有诱多嫌疑。


    加上周五那根探底回升的k线的下引线有毛病有瑕疵。


    所以，明天也是给两种方案大家做个心理预防。


    +   ①；若是明天大盘开盘直接再度向下回踩确认3766点，不管是走大阴线还是走金针探底，那么大家都可以按照策略逢低在3756~3766区间试错。


    +   ②；若是明天大盘直接继续冲高上涨走小阳，那么我们看诱多。大家逢高做减法。


    明天的低点，大家特别要注意3792考点，别跌破3792点，否则还是会再次往下捅出阴线。


    明天的高点，大家要注意一下3822考点，这里容易第一次挂了。所以我们的高点范围是给在3822~3835范围，若是能增到这'
