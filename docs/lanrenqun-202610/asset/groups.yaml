  - '[PAGE 14]


    > > 以阿米巴经营的角度分析，以书里的计算公式计算我个人的时间收入，人工成本，总劳动时间


    工作了 1m 24s >


    # 以阿米巴经营角度分析个人时间收入、人工成本与总劳动时间


    阿米巴经营（稻盛和夫）的核心是把组织拆成最小经营单元，让每个单元像独立小公司一样核算。最关键的指标是单位时间附加值（也叫“单位时间核算”或“每小时附加价值”）。


    # **书中核心计算公式**


    单位时间附加值 = （销售额 - 除劳务费外的所有经费） ÷ 总劳动时间


    对应到个人层面（把“你自己”当成一个最小阿米巴）：


    | 概念 | 阿米巴原意 | 个人对应计算 |

    | --- | --- | --- |

    | 销售额 / 收入 | 阿米巴对外销售 + 内部交易收入 | 你实际创造的收入（工资、提成、项目收益、副业收入等） |

    | 经费（费用） | 材料费、设备折旧、水电、外包等（不含人工成本） | 你为创造收入产生的可控费用（交通、工具、培训、材料等，不含自己的工资） |

    | 附加价值 | 销售额 - 经费 | 收入 - 可控费用 |

    | 总劳动时间 | 正常工作时间 + 加班 + 转移时间 + 公共时间 | 你投入的总工时（正常上班 + 加班 + 学习/准备相关时间等） |

    | 单位时间附加值（时 | 附加价值 ÷ 总劳动时间 | 每小时创造的净价值 |


    # 把每一小时劳动创造的价值算出来，把时间直接当成成本去衡量。公式就一行：


    单位时间附加值 = （销售额 - 各项经费） ÷ 总劳动时间

    翻译成大白话：我每干一小时，到底赚了多少钱？为什么这套东西对我这么重要？因为自由职业的收入是按单、按天算的，你很容易只看"这单多少钱"，却忽略了"这单我花了多少小时"。同样是赚2000块，花4小时和花40小时，是两门完全不同的生意。


    现在我会把我的时间成本专门算进去，看自己的时薪。它帮我做了三个判断：


    第一，这个活值不值得接。时薪明显低于我阈值的活，即使总价看着还行，我也会慎重。


    第二，钱该花在哪。这也是我上一节说的"比价陷阱"的解药——我花钱去买别人的时间（比如请人帮忙做重复性的事），本质是在提高我自己的单位时间附加值。


    第三，我该往哪走。如果一件事短期内时薪低，但它能显著抬高我未来的时薪（比'
  - '[PAGE 15]


    如学一项新技能、做内容积累），那它是值得投的。时间账的算法，看的不是当下这一小时，是这一小时的复利。阿米巴里还有一句话我一直记着：不懂会计，就无法成为真正的经营者。以及配套的那句：经营就像驾驶飞机，会计数字就是仪表盘；不看仪表盘，根本不知道飞向何方。这两句话，说的是同一件事——你不需要成为会计，但你必须看得懂自己的数字。看懂数字，你才知道自己真实的经营状况，才能做出正确的经营判断。


    哪怕你只是一个人、一个很小的单元，也要知道：消耗这一小时工时，到底创造了多少价值。


    # ## 05 要有「立即落地」的执行力


    纸上谈兵终觉浅，唯有下场亲自干。


    道理你都懂，但真正拉开差距的，是有没有把"想过"变成"做过"。


    我见过太多教练、太多想转自由职业的人，卡在同一个地方：想接客户，但不敢开口报价；想做账号，但一直没发第一条;想找项目，但总说"再准备准备"。一准备就是一年。我也一样。刚做自由职业时，我总担心报价高了没人接，担心发内容没人看，还没开始做，自己吓退自己，结果就是——没有客户的旺季，是我自己等出来的。后来我逼自己做了两件事：


    第一件，把"想"拆成一个能立刻做的动作。想接客户，就先联系一个；想涨价，就先把新价格报出去一次；想发内容，就先写'
  - '[PAGE 16]


    完第一段。不用想完整条路，先走出第一步。第二件，把探索变成日常。我现在会去看 AI 怎么用，看别人为什么这么做生意，会顺着自己的痛点去找有没有类似的需求、别人是怎么赚钱的。不是等灵感来找我，是我主动去问、去看、去试。淡季没什么课的时候，我反而拿它来充电——学新东西、打磨技能。旺季就抓紧节奏，多接单、多赚钱。


    日积月累的坚持，终将胜过三分热度的假装努力。


    # ## 06 要有「内化」的潜意识：把自己当成有钱人的脑袋


    前面五条都是方法和结构。但我想说一句可能更重要的话：再好的方法，如果你内心不相信它，它也不会真的落地。真正的改变，第一步是内化的思考——改变你的认知，相信自己能够掌控金钱和欲望。我以前对钱的态度是焦虑的、被动的。现在我给自己换了一个默认设置：我有一颗有钱人的脑袋。具体到动作上，就是把自己潜意识自动化：


    +   - 拿到钱，习惯性先算账。不算清楚，不花。

    +   - 算好了，给自己一个小奖励。这是正反馈，要告诉大脑：“这样做有好处。” 保留一定的顺人性，别把自己逼得太苦，不然系统会崩。


    为什么这套东西有效？因为它改变的不是你的意志力，是你和钱的关系。我存下来'
  - '[PAGE 17]


    的这些安全垫，给我的不是数字上的安心，是**底气**；


    +   - 我能在不愿意的时候，选择不做；

    +   - 我看到好机会、并且我能承担的时候，有能力抓住那张入场券；

    +   - 我能更有安全感地去体验我的事业、工作，去打破常规的“稳定”；

    +   - 面对淡季时，我有足够的余地——可以在那段时间学自己真正感兴趣的东西，而不是慌着找钱。


    **说到这里，我必须老实讲一件事：如果没有存款，我根本不会有今天的认知。**生财的会费是 3000 元左右。这笔钱，是我用自己的存款交的——**正是因为有存款，我才能加入生财，才能一下子看到“原来有这么多方式可以赚钱”，才能那么早就接触到
    AI。**换一个版本想想：如果我当时月薪 2800、手里一分钱没有，那张 3000 块的门票，要么加入不了，要么得刷花呗借出来。那我今天大概率还在那个循环里——**用未来的钱，买今天的机会，然后被利息拖住。所以存钱这件事，存的从来不只是钱，是你选择的权利。**它决定了你是“被生活推着走”，还是有资格主动去挑一个方向。


    # ### 写在最后


    经过前面的梳理，不管你现在是在上班想转自由职业，还是已经在自由职业里被现金流困住，你需要的底层支撑，其实就这六条：'
