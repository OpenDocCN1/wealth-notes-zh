    # # 我是怎么采集到 500+带 24 小时加购标签的虚拟商品，挖出 42 个销量持续增长的潜力品，并做成自动化选品工具的【附完整方案】


    > > 261015 副业 SC 精华

    > > 整理：公众号懒人搜索，懒人专属群精选

    > > 懒人微信：lazyhelper1


    ![](img/c104a48b083a26f170dc818988e2f161_0_0.png)


    > > 小懒判断｜适合在小红书做虚拟资料、总纠结“需求还在不在”的人。不适合想直接搬运现成商品转卖的——作者反复强调加购不等于订单、展示销量不是真实成交。最值得关注的是筛选口径：连续八天销量快照、七个相邻日间隔都为正才算持续增长，缺数据不补零。坑是
    42 条里同店不同规格分开记录，不能相加当市场规模，开学节点类商品过了节点增量直接归零。


    ![](img/c104a48b083a26f170dc818988e2f161_0_1.png)


    【接口暂时免费提供给大家使用，但是资源有限，每日有调用限制，敬请谅解】


    大家好，我是阿旺。


    找可做的小红书虚拟产品时，一个容易让人犹豫的场景是：商品已经卖了几千份，看着需求很大，可等自己做完资料、发完'
