    ## 五、总结


    现在很多人都在学习 AI，但是又不知道如何落地的，我觉得 AI+小程序还是非常值得做的，也很适合新手练手，通过做这个项目能够把流量，产品，运营跑通。


    以前开发一个小程序几万块钱，现在有了 AI 快的一天就能把产品做出来，成本就是 token 的费用还有认证 30 元，现在只要找到一些需求，正反馈会来的很快，包括身边的一些朋友，把小程序架好了，小程序名字正好是搜索热词，才
    3 天就有人付费。


