    # ### 三、如何开始做自己的小程序


    # #### 1、准备工作


    这部分其实在小程序航海手册里面有完整的内容，我结合自己的实际情况，给大家列了一些出来。


    +   1. 一个可以收验证码的邮箱，用来注册开发小程序的appid

    +   2. 一张身份证设置小程序管理员（一个身份证最多绑定5个小程序管理员）

    +   3. 一个营业执照，如果需要接入ai功能，需要个体或者公司

    +   4. 一个能开发程序的工具，我自己用codex，国内可以用workbuddy

    +   5. 下载电脑版微信开发者工具


    # #### 2、codex开发小程序：


    我自己是用Codex开发软件，当你找好需求以后，可以直接把你想要开发的产品是什么，面对什么人群，解决什么问题，希望实现什么功能，告诉codex，让它帮你进行规划，规划完如果觉得不满意，再进行重新调整。


    有时候觉得难是因为还没开始，之前带一个朋友做，他还没开始做就问各种问题，然后说没有得到我的回复，不敢开始。其实勇气比什么都重要，下面是我开发的过程，一部分截图。'
