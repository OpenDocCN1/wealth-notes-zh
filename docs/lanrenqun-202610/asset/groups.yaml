  - '[PAGE 7]


    面。


    像法国、德国以及英国、日本这一类的“两头在外”经济体，在竞争愈演愈烈的现代，是必然要遭遇失败的。而中国、美国、俄罗斯这种拥有广阔经济纵深和资源禀赋的国家，必然会在竞争中相对保持优势，拖垮这些国家。


    这个跟意识形态、跟政府政策并没有太大的关系，只要不犯下致命错误，这种趋势都必将继续下去。


    大经济纵深必然带来竞争优势，当前的工业化早已走向了高度集成的时代，谁的集成优势大，谁的产品就必然更多、更便宜，抗风险能力也就越强。


    以中国为例，依托长江航道、珠江航道构建的产业链必然更加完整也更加方便，可以在一个经济区域内部整合出完整的工业体系，对于外部风险的抵抗能力也会更强。


    但在欧洲不是这么一回事，水运业成本本身就远低于陆运，而缺乏内河航道导致欧洲内部集成化整合本身成本就要高出去一大截。


    大资源禀赋则必然带来社会治理优势，在统一政体之下可以更更容易的解决社会矛盾，让经济活动更少受到社会动荡的干扰。


    还是以中国为例，依托大资源禀赋，西部地区的人力资源、矿产资源可以自由流动到东部地区，而财政转移支付则从根本上解决了社会矛盾，避免了干扰。'
  - '[PAGE 8]


    在统一政体内部这是个自然而然的事情，而欧盟这种松散的国家联盟是没办法解决扯皮问题的，欧盟内部的财政转移必然带来重重矛盾干扰。


    从这个角度去看，法国内部爆发的骚乱就一目了然了：


    +   1. 难民问题、分配问题、LGBT 问题根源都是可分配资源减少；

    +   2. 可分配资源减少的根源是竞争优势消失；

    +   3. 大国竞争加剧了“两头在外”国家危机。


    “上三常”之所以可以成为上三常，是有底层原因的，中美俄这种大纵深、大禀赋国家只要实现了工业化就一定会造成巨大的竞争优势，对“两头在外”经济体造成巨大冲击，导致他们可供分配的利润减少。


    而大国之间的竞争则一定会造成原材料和能源市场波动，让缺乏抗风险能力的“两头在外”经济体雪上加霜。法国、德国这种大陆国家，日本、英国这种岛屿国家，概莫能外。


    这些国家近几年爆发的社会危机，归根结底都来自于这两个方面，而这种趋势短期内是不可能有改变的。


    以日本面临的危机为例，资本的逐利本能必然会抛弃一个不可靠的土壤，不会以国籍、不会以民族感情而改变。日本国内国民收入减少、物价飞涨都只是表面现象，本质是资本和产业发生了转移，有价值资产全部跑去更有盈利可能性的地方，留给日本国内的自然就是一地鸡毛。'
  - '[PAGE 9]


    法国的情况是一样的，有价值的资本、有前途的产业会自动去寻找更容易生存的土壤，留给法国国内的同样是一地鸡毛。德国、英国无不如此，稍微还有一点活力和创新能力的资本、产业都会自谋出路，不可能吊死在你一棵树上；留下来的当然就只有趴在国民身上吸血的垄断产业、民生产业。


    大国竞争，中美矛盾、美俄矛盾只会让这些情况愈演愈烈，俄乌战争、中东乱局是大国矛盾的体现，这种矛盾会以各种各样的方式进一步加剧产业资本转移。


    “两头在外”经济体的末日就来了。


    在接下来的历史里面我们会亲眼目睹殖民体系建立之后崛起的“两头在外”经济体的彻底没落。在殖民时代，这种经济模式运行得相当顺畅，是谁都要抢的香饽饽，乃至于日本、德国这种后发工业国赌上国运都要去分一杯羹，抢殖民地成了这个时代大国竞争的主战场。


    这是因为这个时代的工业品集成度很低，都是些简单工业品，不大需要大规模集成，内河航道反而是方便产品倾销的渠道；在凡尔赛体系建立之后到冷战结束，这种经济模式还有很大的生存空间，在传统白家电、传统燃油汽车时代，集成度相对较低，“两头在外”经济体还具有竞争优势，还能在细分市场里面获得足够的市场份额维持生计；到了高度集成的个人电子产品、电动汽车为代表的电气化时代，竞争优势就荡然无存了。'
