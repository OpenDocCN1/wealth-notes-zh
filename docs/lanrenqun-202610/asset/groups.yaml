    # 商单：


    这个玩 x 的都懂，根据你的粉丝数和影响力从几百到上万不等，我现在基本上 500 美金～800 美金左右浮动，比不上 一些大佬，但作为一个自媒体新人也知足了。


    X 友们从 2000 粉左右就可以接到商单了，而且这个平台很多甲方都是国外的，所以不像小红书那样要返点，所以说做一个万粉 x 账号是回报很高的事情。'
  - '[PAGE 9]


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_9_0.png)


    # 社群：


    比如我的我在 flowus 写过一个付费的 x 增长文档(其实就是我生财 5 月份发的帖子的后续更新版本)，199 送个答疑群，卖了上百份。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_9_1.png)


    又比如 afternoise 社群，是我和 x 友一起办的 aigc 内容群，3 天就进来 300 人。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_9_2.png)


    圈友可借鉴的是你影响力不够的时候，你也可以帮别人卖社群，一样能挣钱，比如 xbangdan 作者，圈友琳小航


    # 咨询：


    我在 x 拿到了结果，那找我的人是很多的，大家根据自己的时间标个价即可，我给自己标的是 1000/h。


    # 产品与 aff:


    这个玩 x 的都懂，太多案例了，build in public，一鱼多吃，你有产品就推广自己的产品，你没产品就把自己当成产品，用流量变现。'
  - '[PAGE 10]


    推荐几个人可以去对标的：哥飞 yihui 卫斯理其中我对标的是卫斯理，把自己当成产品卖，做了个网站挂在 bio 上面：


    https://imhxm.com


    # ## 讲几个 x 才能玩的流量案例：


    比如我在 x 给朋友做 workbuddy 代理的公司拉人，丢几个二维码一天能进 1000 个人（我一个人的效率比他们一个公司的人的发朋友圈都多），我甚至帮圈友在
    x 卖茶叶，几千的客单价一条推文都能出几单。


    相信每个人都玩过或者看过朋友圈营销，不妨试试 x，这里就是个超级大号朋友圈。


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_10_0.png)


    # ## 资源链接：


    这个就是 x 最有价值的地方了，在上面你可以链接到质量非常高的人，我说 2 个例子：


    我在 x 认识了潮汕商会大佬，他给我链接了商会资源，我自己又有 fde 技能，所以我毫不费力能触达到优质的 b 端客户，同时 x 账号又能给我背书，所以互信环节也能很快建立，大佬们给钱都是很爽快的，一个小交付□□。'
  - '[PAGE 11]


    ![](img/fdd0d820af9492464f0b84f1e3dc984f_11_0.png)


    我认识了币圈以前玩矿场的大佬，他在捣腾 b300，告诉我本地算力必然会涨价，所以我在 8 月份 dgx spark 暴涨之前入手了多台设备，当时价格才 30
    出头，现在 50k 了。


