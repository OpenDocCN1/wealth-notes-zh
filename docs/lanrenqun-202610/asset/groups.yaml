    # 727 位诺奖得主，696 人能联系到同一张 “家谱”


    261010

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/c7b6ea1ac35ec74feec84466835a2bf7_0_0.png)


    小懒判断 | 适合纠结孩子教育或自己想变强的人看——重点不是诺奖八卦，是居里家的“合作班”和玻尔研究所的聊天文化演示了怎么面对未知；想找“天才基因”玄学的会失望。最值得关注的一句：玻尔说“我说的每句话你都要理解成一个问题”。坑在于别倒果为因，拜诺奖得主当老师不等于能拿诺奖。


    本周是一年一度的“诺贝尔奖时间”。到今天，三个科学类奖项，也就是物理学、化学、生理学或医学，已经全部揭晓。


    我们先快速看一遍获奖情况。接下来会涉及几个专业名词，你大概听听就好，不用仔细记，因为这并不是我们今天要说的重点。


    今年的物理学奖只有一位得主，叫弗朗西斯·哈尔岑。他获奖，是因为推动建成了冰立方中微子天文台，并利用它发现了来自遥远宇宙的高能中微子。


    而今年的化学奖有两位得主，一位是法国化学家亨利·B.卡甘，另一位是日本化学家碓合完三。他们研究的课题，类似于怎么控制分子的“左手”和“右手”。今年的生理'
  - '[PAGE 1]


    学或医学奖有三位得主，卡尔·戴塞罗思、彼得·黑格曼和格奥尔格·内格尔。他们获奖，是因为在光门控离子通道和光遗传学方面的发现。


    假如你对这些专业领域感兴趣，可以关注卓克老师的《科技参考5》（懒人专属群内连载更新中），这两天卓克老师正在做专业的解读。而我们今天要关注的，是诺奖的另外一个，让人意外的侧面，这就是，诺奖得主背后的那个“天才网络”。你看，按照通常的想象，这种世界级的奖项，一所高校或者一个实验室，能出一个获奖者就已经是小概率事件。但是，你要是把100年的诺奖历史拉通看，会发现很多获奖者，都来自同一套“师承网络”，甚至是“家族谱系”。比如，今年的生理学或医学奖，获奖者之一，卡尔·戴塞罗思，做博士研究的时候，他曾经在钱永佑的实验室工作。另一位在光遗传学早期作出关键贡献的科学家，爱德华·博伊登，读博士时的导师之一也是钱永佑。


    钱永佑是谁？他的弟弟，是2008年诺贝尔化学奖得主钱永健。他们的父亲叫钱学榘，也就是钱学森的堂弟。再往上追溯，这一支钱氏家族可以把家谱追溯到一千多年前的吴越王钱镠。


    再比如，著名的布拉格父子。1915年，英国物理学家威廉·亨利·布拉格和儿子劳伦斯·布拉格，共同获得诺贝尔物理学奖，因为他们用X射线研究晶体结构。儿子获奖的时候只有25岁。直到今天，他仍然是诺贝尔物理学奖历史上最年轻的得主。'
  - '[PAGE 2]


    再比如，汤姆森父子。1906年，父亲 J.J. 汤姆森获得诺贝尔物理学奖。他最著名的工作之一，是发现电子，让人类第一次真正意识到，原子里面还有一种带负电的粒子。30多年后，1937年，他的儿子乔治·汤姆森也拿了物理学奖。而儿子获奖的重要原因，是发现电子能够发生衍射，也就是说，电子不光能表现得像粒子，还能表现得像波。这对父子的发现，正好站在“波粒二象性”的两端。


    还有赫胥黎家族。祖父托马斯·赫胥黎，是19世纪最著名的生物学家之一。他的三个孙辈，朱利安·赫胥黎成了进化生物学家，后来还担任联合国教科文组织第一任总干事。奥尔德斯·赫胥黎没有当科学家，却写出了后来影响巨大的小说《美丽新世界》。还有安德鲁·赫胥黎，研究神经细胞怎样产生和传递电信号，1963年获得诺贝尔生理学或医学奖。


    那么，这到底是为什么呢？难道这就是传说中的“龙生龙，凤生凤”？


    **首先，我们很难找到确切的证据，否定基因的力量。**比如，1982年诺贝尔生理学或医学奖得主苏珊·贝里斯特伦，有一个儿子叫斯万特·佩博。40年以后，也就是2022年，佩博因为古人类基因组研究，也获得了诺贝尔生理学或医学奖。但问题是，严格来说，后者是前者在婚外所生的孩子，他主要是被母亲抚养长大，待在父亲身边的时间并没有那么多。你要说这里面完全没有基因的因素，恐怕也很难让人彻底信服。'
  - '[PAGE 3]


    但是，你要说这全是基因的功劳，也不对。

    比如，著名的“钱氏家族”，被称为“科技三钱”的钱学森、钱三强、钱伟长，都能把自己的家族谱系追溯到吴越钱氏。这个家族在文史领域，又有钱穆、钱钟书、钱玄同等一大批人物。


    可这能全归功于“钱家基因特别好”吗？就连钱永健本人，都不太认可这个解释。他在诺贝尔奖官方自传里专门写过，自己是钱镠的第34代后裔。但是，一个人往上追34代，理论上会出现2的34次方个祖先位置，大约170亿个，远超全世界的人口。按照钱永健的观点，隔了一千多年以后，大家拥有某个共同祖先，并没有想象中那么神秘。


    从这个角度看，与其盯着家谱上那个遥远的名字，我们不如看看，在这些天才扎堆的师承网络，或者学术家族里，上一代对下一代，到底具体在做什么。当然，我们不能说，是这些做法导致了他们后来的成功。但考虑到这些人的罕见成就，这些做法绝对值得你了解。


    我们先从诺奖得主“密度”最高的“居里家族”说起。按个人获奖次数算，玛丽·居里两次，丈夫皮埃尔一次，女儿伊雷娜一次，女婿弗雷德里克·约里奥-居里一次。一家四个人，合计五次获得诺贝尔奖荣誉。


    那么，这个家族是怎么教孩子的呢？当年，皮埃尔·居里去世以后，玛丽独自抚养两个女儿。1907年和1908年，她和身边一批科学家朋友办了一个很特别的“合作班”，专'
  - '[PAGE 4]


    门教自己的孩子。学生不多，就十来个人，学生的家长轮流当老师，教自己最擅长的科目。


    比如，玛丽·居里教物理，让·佩兰教化学，保罗·朗之万教数学。论师资阵容的豪华程度，这所“学校”完全没法复制。但是，他们的教学方式也许可以参考。


    比如，玛丽的物理课，不是一上来就告诉孩子知识点。孩子要自己做实验、摆装置、观察现象，然后想办法解释。


    这个区别特别重要。因为我们平时在课本里看到的科学，都是已经完成的科学。牛顿定律已经写好了，元素周期表已经排好了。一个孩子看久了，很容易产生一个错觉：科学，就是有一个聪明人知道答案，然后把答案告诉我。


    但真正的科学工作也许恰恰相反，科学家绝大多数时间面对的，都是没有答案的东西。结论会算错，实验会失败。而伊雷娜·居里就是在这样的环境里长大的。她后来和丈夫一起发现人工放射性，1935
    年获得诺贝尔化学奖。


    当然，我们不能说，因为她小时候跟妈妈做过实验，所以后来才拿了诺奖。值得注意的是另外一件事，你看，对于很多孩子来说，“不知道”意味着什么？意味着考试要扣分，意味着“我不会”。


    但伊雷娜从小看到的，却是另一套逻辑：

    不知道，不是一件丢脸的事。不知道，是工作开始的地方。这两种经验，会塑造完'
  - '[PAGE 5]


    全不同的人。再比如，著名的玻尔家族。


    1922年，丹麦物理学家尼尔斯·玻尔获得诺贝尔物理学奖。53年以后，1975年，他的儿子奥格·玻尔，再次获得诺贝尔物理学奖。


    但是，玻尔家族的成就，不只是这两座诺奖，还有著名的理论物理研究所。1921年，尼尔斯·玻尔在哥本哈根创建了理论物理研究所。后来，海森堡、泡利、狄拉克、朗道等一大批二十世纪最重要的物理学家，都与这里有交集。


    而玻尔研究所一个特别鲜明的特点，特别鼓励“聊天”。


    玻尔本人就喜欢一边说、一边想。在办公室聊，在走廊聊，在餐桌上聊，散步的时候也聊。到了1929年，这种讨论甚至被固定成一年一度的哥本哈根会议。会议没有严格议程，大家讨论的，可能就是最近刚刚遇到的新问题。


    玻尔曾经说过一句话，被认为是能代表研究所的风格，叫，“我说的每一句话，你都应该把它理解成一个问题，而不是一个断言。”一个观点说出来，不是为了结束讨论，而是为了让别人攻击它、检验它、找它的漏洞。


    他的儿子奥格·玻尔就在这种环境里长大。你想，一个孩子天天在这样的环境里，会学到什么？量子力学肯定未必听得懂。但他会慢慢明白一件事：世界上最厉害的一群物理学家，也会遇到困难，也会争论，也会说“我不知道”。而且在这里，即使成'
  - "[PAGE 6]\n\n# 就最高的人说的话，也不代表最终结论。  \n恰恰相反，真正的讨论可能才刚开始。\n\n2024 年，有研究者做过一项研究，标题就叫《诺贝尔家族》。他们整理了物理学、化学、生理学或医学，以及经济学四个领域\
    \ 727 位诺奖得主的学术师承关系。然后发现，727 个人里，有 696 个人，可以通过导师、导师的导师、学生、学生的学生，最终联系到同一张巨大的学术家谱。其中还有\
    \ 360 对教授和学生，两个人后来都拿到了诺贝尔奖。\n\n注意，这不能理解成，只要拜一个诺奖得主当老师，你就能拿诺奖。但它或许可以说明，某些真正重要的东西，是可以在人和人之间传递的。比如，一个人怎么面对未知，怎么面对不同的意见。\n\
    \n今天流传的《钱氏家训》，是近代钱氏后人钱文选根据历代训诫和宗谱材料整理而成的，里面有一句话特别有名：“利在一身勿谋也，利在天下者必谋之；利在一时固谋也，利在万世者更谋之。”意思是，**如果一件事只是自己眼前得利，不值得费太多心思；但如果关系到更大范围、更长时间，就应该认真去做。**过去我们读这句话时，关注的是其中对“家国天下”的理解。但是，今后再读到这句话，也许可以再多一层感受。它讲的也是一个人面对未知、面对选择的方式。毕竟，**公式会被遗忘，知识会被迭代更新，但一个人怎么面对未知，面对选择，这个习惯也许会伴随他很久很久。**\n\
    \n---"
