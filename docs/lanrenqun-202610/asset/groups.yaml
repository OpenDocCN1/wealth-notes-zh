    # 设计素材：让用户一眼看见做出来是什么效果


    素材类的研究重点可以放在风格、使用场景和兼容性。仅列笔刷数量，很难让人判断能否用于自己的作品；一张清楚的效果示范与准确的使用说明，往往更值得优先打磨。


