  - '[PAGE 14]


    # 2.后提问


    拿到几个问题后，另开一个窗口，去一个一个问 AI 这些问题，每一个问题，你看看他是如何思考的，如何拆解问题的，如何拆分搜索关键词的，抓取了哪些网页，这些网页的标题是什么。


    # 3.再总结


    第二步得到的结果，再拿去给 AI 分析，让 AI 告诉你，如何写文章，发到哪些地方去。


    # 有流量的后续


    当你的站 UV 达到 3000 以上，PV 达到 300 以上，你此时应该考虑的事，就不是一直发外链了，而是要回到站内，看下为啥不出单，这比发外链重要一千倍，一万倍!!!
    关于为啥不出单，这个问题比发外链还重要，在这分享一个比较实用的方法，就是做埋点，分析埋点！


    如果你是产品经理，程序员，或者做过研发相关工作，一般都会知道埋点，用大白话说，埋点就是，记录用户的行为，看下用户点击了什么按钮，在哪个页面停留了多久，从哪个页面离开了，这个听起来和
    clarity 功能很像，但是你可以通过记录用户行为到数据库，能更好的分析用户行为'
