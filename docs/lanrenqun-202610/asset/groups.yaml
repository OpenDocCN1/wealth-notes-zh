    # 3天600人加我微信，变现1万：为什么这个时代一定要玩推特（附从0起号全流程）


    260930 副业 SC 精华

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/2e4ea7ed22920b998d85449edcd3298b_0_0.png)


    > **小懒判断**｜适合手上已有能变现的手艺，正在私域缺流量入口的人，国内平台还没玩明白的小白先别急着翻墙。最值得关注的是 X 开源算法的权重表：一个转发顶
    20 个赞，破圈就看发出后两小时有没有人帮你转。坑在于成品号有被找回封禁的风险，第一个号宁可自己注册慢慢养。


    各位圈友大家好，我是阿乐，02年，在杭州做 AI 获客。


    先说一件刚发生的事。


    前天我在推特上发了一条视频，内容是我自己做的一个采集插件小产品的 demo。就一条视频，没投流、没买粉、没群


    > 三天时间，加到我微信的有 600 人。三天，变现 1 万。


    ![](img/2e4ea7ed22920b998d85449edcd3298b_0_1.png)'
  - '[PAGE 1]


    这个数字放到生财，说实话不算什么，比我猛的人一大把。但它验证了一件事：同样的内容，发在推特上，跑出来的结果跟我预期完全不一样。


    所以这篇文章，我想认认真真跟你聊聊"玩推特"这件事。


    前半段讲清楚为什么值得玩，后半段把从0起号到破圈的全流程，一步一步拆给你。都是我这两个月真金白银试出来的，不掺水。


    > > 先给你一张地图，这篇我要带你走这几站：

    > >

    > > 一、为什么我说这个时代一定要玩推特

    > >

    > > 二、第一步：账号从哪来

    > >

    > > 三、第二步：设置与养号

    > >

    > > 四、第三步：前期怎么运营

    > >

    > > 五、第四步：怎么破圈

    > >

    > > 六、起号成功之后，靠什么稳住

    > >

    > > 写在最后


    Hello 各位圈友，大家好啊，我是阿乐。


    前天我在生财发了一条帖子，讲我中秋那几天怎么从 Twitter 上把流量导到微信、成交 100 个、3 天变现 1 万。那条帖子被亦仁老大点赞支持了，说实话挺受鼓舞的。


    那会儿我就特别想说一件事：这个时代，真的建议你去玩 Twitter。


    不只是我。我身边好几个做私域的朋友，聊起来都是同一个判断——现在还在找流'
  - '[PAGE 2]


    量入口的人，Twitter 是不要放过的一个渠道。


    为什么？两条，都是我自己吃到的。


    第一，人不一样。


    会去注册 Twitter、会在上面花时间的人，本身已经被筛过一遍了。里面有老板、有创业者、有做独立开发的、有海外华人，还有一批跟你一样闷头做项目的人。


    这批人的共同点是：他们看得懂你在说什么，而且他们有钱。


    我早些年做 AI 出图，在 Twitter 上发了一条介绍，引来 100 多个人听我讲，最后成交了 10 个代理。同一篇东西我发到别的平台，来的人更多，但问完价就没影了。


    第二，它松。


    这一条更直接。


    在国内平台，你稍微留个联系方式，轻则限流、重则封号，辛辛苦苦做起来的号，可能就因为一张二维码没了。


    Twitter 不一样。你可以直接把微信二维码发出来，可以放你的群二维码，可以放你自己的主页链接，平台不会因为你想把人导到微信里，就给你穿小鞋。


    我那三天加到微信的 600 个人，全部是从 Twitter 直接导过来的。这要在国内，根本不可能。


    至于具体怎么玩——从 0 开始要什么账号、'
  - '[PAGE 3]


    怎么设置、怎么养号、前期做什么、怎么破圈，我把整个流程都写下来了，做成了飞书文档，读起来舒服一点：


    里面就四步：账号从哪来（自己注册/买成品号）→设置和养号→前期怎么运营（多互动、跟大V交流、多转发）→怎么破圈（写来时路、请大V帮你转发、找熟人站台）。


    最后说句掏心窝的：这篇文章写出来，我也是在给自己起号。这篇要是爆了，我这个号基本上就算起起来了。所以哪一句对你有用，帮我转发一下，或者评论区留个言，我都看。


    有在玩 Twitter 的圈友，评论区留个号，我去关注你。


    https://fcn0gp5yt13z.feishu.cn/docx/BQthdexmioQIBV...


    # 一、为什么我说这个时代一定要玩推特


    我给两个理由，都是我自己踩出来的。


    # 理由一：推特的人群质量，是我见过最高的


    你在国内平台发内容，评论区最多的是两种人：来看热闹的，和来找茬的。


    推特不一样。


    会去注册推特、会在这里花时间的人，本身已经被筛过一遍了。这里面有老板、有创业者、有做独立开发的、有海外华人、有投资人，还有一批跟你一样闲头做项目'
  - '[PAGE 4]


    的人。


    这批人有个共同点： 他们看得懂你在说什么，而且他们有钱。举个我自己的例子。


    我早些年做 AI 出图，在推特上发了一条介绍。就一条内容，引来 100 多个人听我讲，最后成交了 10 个代理。


    ![](img/2e4ea7ed22920b998d85449edcd3298b_4_0.png)


    同一篇文章，我发到别的平台，来的人可能更多，但问完价就没影了。推特上来的'
  - '[PAGE 5]


    人，是带着一个具体问题来的。他要么现在就要解决这个事，要么现在就在花钱解决这个事。


    > 你在推特上遇到的不是流量，是能付钱的人。


    # 理由二：推特的变现路径，比你想的多


    我数一下我自己或者圈友跑通过的路子：


    +   a. **卖服务、卖产品、卖代理。** 这是来钱最快的一条。你在生财学到的任何一门手艺，搬到推特上都有人买单——这里的人本来就习惯花钱解决问题，你不用花大半篇内容去教育他"为什么要付费"。

    +   b. **做付费社群。** 这条的价值在复利。推特适合立人设，能让一批人长期看着你。看三个月、看半年，你再开个社群，进来的人都是被你的内容养熟的，比冷流量好谈太多。

    +   c. **接海外客户、做出海。** 这条是国内平台给不了你的。推特是英文世界和华人世界的交叉口，想接海外单、想知道外面在流行什么、想做出海生意，这里最顺。信息差本身就是钱。

    +   d. **平台自己的分成。** 这条属于顺带，不用为它单独设计内容，做了就有，相当于平台给你发的那份底薪。'
  - '[PAGE 6]


    ![](img/2e4ea7ed22920b998d85449edcd3298b_6_0.png)


    # 具体能挣多少？我给你两个数：


    +   - 招生时已经有的案例，**万粉的博主，一个月变现三五万是比较轻松的。**

    +   - 我自己，**运营两个月，涨了三四千粉，变现几万块。**


    我这个号还小，所以我想说的是：这不是"大V才能赚钱"的地方。三四千粉就够开始收钱了。


    而且我相信在座的各位，如果在生财已经跑出了自己的东西，把它搬到推特上，起量只会比我快。因为推特现在最缺的，就是**真正有实战结果的人**。


    # 理由三：推特上引流的管控，没那么严


    这一条是我认为推特最值钱的地方，也是我自己吃到最大甜头的地方。


    在国内平台做内容，你稍微留个联系方式，轻则限流，重则直接封号。辛辛苦苦做起来的号，可能就因为一张二维码没了。


    推特不一样。


    你可以把微信二维码直接发出来，可以放你的群二维码，可以放你自己的主页链接，'
  - '[PAGE 7]


    可以在内容里留你的联系方式。平台不会因为你想把人导到微信里去，就给你穿小鞋。


    这就意味着：你在推特上发的每一条内容，都可以直接变成一个加到微信里的人。不用绕，不用让人去评论区扣个 1，不用在简介里放一串谜语。


    ![](img/2e4ea7ed22920b998d85449edcd3298b_7_0.png)


    > > 我那三天加到的 600 个人，全部是直接从推特导到微信的。这要是在国内，根本不可能。


    所以如果你正在做私域，或者正在找一个能持续来人的流量入口——推特是你不要放过的一个渠道。你在别的地方辛辛苦苦往微信里加人，一次几十个就不少了；推特给你的，是一个你可以反复用、而且不拦你的入口。对做私域的人来说，这一条的价值，比前面那几条加起来都大。


    ![](img/2e4ea7ed22920b998d85449edcd3298b_7_1.png)


    # 二、第一步：账号从哪来'
  - '[PAGE 8]


    讲完为什么，下面全是操作。从最前面的账号开始。


    一共两条路，你自己挑。


    # a. 自己注册（推荐新手走这条）


    用谷歌浏览器注册，是当前最稳的。


    原因是谷歌浏览器的环境最干净，不容易被平台当成批量注册的号。


    具体几步：


    +   1. 准备一个干净的邮箱，Gmail 最好，跟你的推特绑一起。

    +   2. 用谷歌浏览器打开推特注册页，直接选"用 Google 账号登录"，比填手机号顺，也少掉一层验证。

    +   3. 节点要固定。今天是美国，明天是日本，后天又换回来，平台会直接把你标成可疑账号。挑一个就一直用。

    +   4. 注册完当场把资料填完，不要空着放几天。


    这条路的好处是干净、安全、以后不容易出事。坏处是慢，新号有养号期，急不来。


    # b. 买成品号（想省时间的人走这条）


    什么时候适合买？


    +   - 你等不了养号那几天，想注册完当天就开始发；

    +   - 你要做矩阵，一个号不够用。'
  - '[PAGE 9]


    # # 买号之前你先想清楚三件事：


    +   1. **有被找回、被封的风险。** 这是最大的坑，别贪便宜。


    +   2. **粉丝不精准。** 成品号上那点粉，大概率是死的、或者跟你完全不搭。别指望它给你带流量，你要的是“号本身不是白板”。


    +   3. **买回来第一件事是改密码、换绑邮箱。** 做完这步，先当正常号用一周，再开始发内容。


    渠道和价格我就不在这里展开了，圈里问一句就有。但我的建议是：第一个号，自己注册。你自己的号，你才心疼。


    # ## 三、第二步：设置与养号


    账号到手，先别急着发内容。


    # ### 先把门面收拾干净


    **头像。** 真人照片。别用 logo，别用网图。推特是认人的地方，一张真人脸就是最基础的信任。


    **昵称。** 用你真名或者平时被叫的名字。我用的就是“阿乐”。


    **ID（@后面那串）。** 能改，但只建议改一次，想清楚再定。最好是名字的拼音或者英文名，好记、好念、好被人 @。


    **简介（Bio）。** 一句话说清楚：你是谁、帮谁解决什么问题。'
