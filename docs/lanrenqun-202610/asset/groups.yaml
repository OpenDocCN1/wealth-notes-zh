    \n对刚经历过“三个月教辅销售额1000元”的我来说，这个反馈很强烈。\n\n但上涨没有一直持续。\n\n9月16日，因为我的不当操作，账号被小红书限制流量，同时禁止发帖和私信，处罚期是一个月。后面的收入也随之下降。\n\
    \n不过，从受限后到9月底，即便流量下降，每天仍然有收入，最低的一天也有100多元。\n\n从9月12日下午到月底，卖图纸累计带来了6000多元收入。\n\n\
    这让我看到了两个事实：平台流量确实会明显影响收入；而前面发布的图纸，在流量下降后仍然能带来购买。\n\n这是一段让我愿意继续投入的正反馈，但还不能说明长期收入已经稳定。处罚期结束后的表现、后续能不能持续卖，都需要继续观察。\n\
    \n这次尝试让我更清楚地看到了购买动机的差异。\n\n![](img/29459bbf58f17207ed8e84307d362f75_3_0.png)\n\
    \n教辅面对的用户，大多是精打细算的家长。他们会比较价格、资料数量和实用性。\n\n我花很多时间保证准确、打磨细节，是产品本身必须承担的责任，但这些投入不一定能直接换来更高的购买意愿。\n\
    \n用户可能认可质量，最后还是选择更便宜、内容更多的那份。\n\n拼豆图纸的购买理由，则更多来自情绪和喜欢。\n\n看到一个好看的图案，想把它亲手拼出来，愿意为这份喜欢付费。当然，只有好看还不够，图纸也必须真的能照着拼。\n\
    \n在我目前接触到的用户里，这种兴趣带来的黏性也更强。完成一张以后，还会想找下一张喜欢的图案。\n\n对我来说，同样是认真打磨视觉内容，换了一种使用场景，得到了更直接的市场反馈。\n\
    \n### 开始卖图纸后，我也逐步搭建了自己的工作流\n\n这部分可以分享一些组织思路。\n\n我先梳理一张图纸从制作到交付会遇到哪些问题，再决定哪些环节适合交给\
    \ AI、哪些必须保留人工判断。目前主要围绕几件事：\n\n- 制作前明确目标，减少反复试错。\n- 留出样稿检查和修改阶段，确认后再继续做成品。\n- 分别检查画面效果和实际可拼性。\n\
    - 整理版本、交付文件和归档，方便后续修改。\n\n具体制作方法、参数和实现细节，这篇先不展开。\n\n对我来说，搭建工作流的价值，是把容易出错和反复消耗精力的地方逐步理顺，让质量和交付更稳定。\n\
    \n前面做教辅的经历，也让我养成了检查细节的习惯。这些积累后来用到了拼豆图纸上，只是面对的用户和购买理由发生了变化。\n\n现在我还在继续探索。一方面看后续的持续购买情况，另一方面也要把平台操作和经营环节做好，避免再次因为操作问题影响收入。\n\
    \n这次最大的收获，是开始把“我能做出什么”和“用户愿意为什么付费”放在一起考虑。\n\n如果你也在做 AI 数字产品，或者对拼豆图纸的项目探索、质量检查和工作流组织感兴趣，欢迎来找我交流。我可以分享这几个月踩过的坑，以及哪些投入在我这里得到了实际反馈。\n\
    \n![](img/29459bbf58f17207ed8e84307d362f75_5_0.png)\n\n看完这篇 SOP，你觉得你懂了。但 90% 的人一到实操就会卡在第一步。\n\
