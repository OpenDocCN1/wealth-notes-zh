    \ Store登顶，但还没全民普及，属于圈内火\n- 真正起飞 (破圈)：2018年春节 (关键节点) 砸春晚广告、明星红包、挑战赛，春节短短十几天，日活直接翻倍，从三四千万冲到近7000万；2018年6月日活破1.5亿，正式全民化，完成逆袭，从年轻人APP变成国民应用\
    \ 人民网\n\n### 火爆阶段划分\n\n- 1. 爆发期：2018～2020年（黄金红利期） 流量红利最大，普通人随便拍视频都容易起号；直播、电商开始进场，商家、达人涌入，是抖音最赚钱的流量时代。\n\
    - 2. 成熟期：2021～至今 流量不再是无脑推荐，算法变严、竞争白热化，买量成本上涨；但抖音没有“结束”，依然是国民级平台，只是草根自然流量红利消失。\n\
    \n> > 一句话总结：\n> > 2018春节正式起飞， 自然流量红利大概持续2年 (2018 2020) 2021...\n\n淘宝爆款截流业务在20-21年期间达到高峰，但是由于当时的业务逻辑和框架问题，导致自己培养了很多优秀竞对。当时几乎是把从供应链、选品、运营、客服等全链路的技能全部输出给每个运营成员，这就导致原本能做的4-5年的项目，做了3年不到就被自己一手带出来的兵卷死了。好不容易半年带个熟手出来，结果一年一流失，反复更新迭代玩法，来回拉扯团队，来回好几次，心累了，22年就结束整个业务和团队。\n\
    \n现在看即使当时那种很被动的情况也有机会起盘新业务，而且比当时的截流业务做出更大的体量。\n\n复盘后，个人能想到的正确的策略大致有两种：\n\n**策略一**、**核心选品策略**，只有核心人员掌握，并且大量的时候花在选品上，人也不累。测品出现的异常值，强付费投放也是核心人员直接操盘。其他打螺丝等替代性强的作业，就给流水的基础运营岗位分配，人才要经过长期选拔和观察才能逐步进入核心业务。\n\
    \n这样就不会眼睁睁的看着 10 多个百万利润的单品，从我们这里开花，到别人那里结果。\n\n这种策略有概率沉淀出能打的核心成员，去走开品路线，既能建立有门槛而非信息差的项目，又能建立稳定的团队。\n\
    \n认识的西安的一个年营收过亿的天猫无货源团队，运营副总负责选趋势大方向，给出基础词根，运营总监拿到词根后挖掘趋势关键词列表，然后分发给运营主管，主管再分批给到各个小组，组长分配给专员，负责把拿到的每个词选\
    \ 5-10 个品上架。就这样只要最上层的方向不跑偏，最基础的岗位做流水化重复的动作，团队规模稳稳的增长到上百人。\n\n**策略二**、当时技术外流已经失控的情况下，**明知道不可逆，那就应该放手大力搞培训**，把花在注定要成为竞对的员工身上的时间和精力投入到结交广大创业人群的培训业务上，**快速赚钱的同时，快速扩大影响力**。\n\
    直到现在，4年前因为培训认识的朋友，\n还保持着长期的联系，时不时互通有无，\n交流经验，但培养出来的竞对前同事几乎\n没有任何联系。\n\n但我当时只是浅尝辄止的试了一下培训业务，但总觉得自己有能力把团队拉起来，\n\
    搞了小范围的人数不多的培训就草草收工，\n花大量时间搞管理。\n\n反观同期的生财圈友盗坤，以淘宝蓝海\n业务起步，大量输出扩大影响力，搞培训\n赋能，结交了大量创业人群，同时也赚到\n\
    了可能比自己拉扯团队更轻松的收益。深\n入交流过且有价值往来的创业人群越多，\n积累的人群资产就越多，后续可以切入更\n多通过信息差赚快钱的业务，也筛选了一\n\
    些信任度高又很能打的战友。**再后面能做\n的就不仅仅是信息差才能赚钱的业务，而\n是合力抱团闯更大的赛道**。\n\n## 业务三天猫/抖店店群：\n\n\
    这个业务是目前创业过程中经济损失最大\n的一个，**整体亏损100w左右**，可能对一\n些创业老板来说这个损失不算多，但是对\n我来说这个损失已经超出我创业方法论的\n\
    亏损极限。\n\n我的方法论大致是这个框架：选好一个赛\n道，评估好最大投入时间和投入资金，全\n力投入，过程中遇到关键问题都一一解决\n掉还不能产生有效结果，**时间达到6个月\n\
    或亏损达到某个临界值，一定果断放弃**。\n\n## 天猫店群当时一共开了有接近 100 个店，期间有几个关键性节点。\n\n节点 1：单店铺入场成本在 8-10\
    \ 万左右，成本高意味着门槛高，进场的竞对少，这个时候产出可以肉眼看到逐步拉高，从单月利润 5k，逐步增长到 1w，再到 2w。这个节点感觉整体不出问题只要扩大店铺数量就可以平稳赚钱。对比之前做的爆款截流真是轻松太多了，不用每天盯选品，分析同行，调整直通车，只要无脑上货无脑运营，业务规模也能稳步增长。这个节点其实整个项目都是\
    \ OK 的，符合我的方法论。\n\n节点 2：天猫入驻大放水，大概是 23 年 12 月中旬吧。天猫开启了履约险时代，1500 元就可以抵扣 5w 元的保证金。卖店的成本打到地板价，自己入驻就\
    \ 3000 元以内，单店铺成本直接降到 5k 以内。当时我就感觉不妙，门槛没了不只是针对我，是对所有人都没了，狼多肉少的时代要来了。当时想观望一下再决定是否要继续加店，但是一旦拿了投资就身不由己，周围大多数同行都在疯狂加店，只能被裹挟着跟风。\n\
    \n节点 3：24 年加店到接近 100 个的时候，突然全市场的上货软件都不能正常使用，等了 2 周，直觉告诉我这件事已经到头了。逻辑上的判断是，大批量低成本的店铺入场，大家都是\
    \ 3 万 5 万的批量铺货，整个天猫用户池才有多少，天猫总商品库的增长速度可比用户增长快了不是一个量级的，怎么可能允许保障度低的店群影响到真实用户的购物体验。这个时候我先叫停了在朋友那边代运营的\
    \ 50 个店，同步逐步停掉自己团队运营的近 50 个店铺。\n\n节点4：天猫店“很多肉少”的情况发生后，我就转变思路，只保留了 1-2 个店在做精细化运营，稍微用一些之前爆款的运营手法就在\
    \ 7 天内把销售额从单天 300-400，拉升到单天 2000。但是天猫又出新政策，就是为了清洗大批量铺货的店铺，净化天猫生态。先是来个第三方诱导违规首次罚\
    \ 5000 再次罚 2w、紧接着又来无货源直接 2w 罚款。这两个政策叠加，让我对天猫业务彻底死心，全部店铺下架关停。准备以创业失败结束，这时亏损大概是\
    \ 40w，想退出但又身不由己。\n\n节点5：抖音店群，早期入场的店铺收益可以，然后又跟天猫店走的同样的套路，先是入驻大放水，商品信息足够丰富后，再次很多肉少，然后上各种政策罚款，最后店铺清退。后面同样的事情还在\
    \ TK 发生过。平台都是一波一波，铺货的群体也是一波一波。现在看来平台方才是最大的无货源玩家，大喇叭一喊，大家拿着钱抢着入驻，入驻后然后开始赛马机制，让商家相互竞争相互卷，再通过各种商家和买家投喂的数据来筛选优质商家改进流量分配策略，同时用罚款的方式赚点外快，优化留存商家筛选出优质马匹，给用户提供更好的商品和服务。如此往复，逐渐形成用户享受福利，倒逼商家上进，平台躺赚的好生意。\n\
    \n原本我的打算是从轻资产的淘宝爆款截流跳到高门槛的天猫店群，结果平台政策各种调整导致这个业务从好业务变成烂业务。\n还有一点是之前做爆款对运营能力要求很高，需要全方位的理论知识和实操经验才能培养出来一个合格的运营，铺货多简单无脑，只要电脑采集上货就能躺赚，不用费心思培养任何人。\n\
    \n## 业务四 AI工具出海：\n\n这个业务做的很不成功，原因一是受淘宝爆款截流模式（天天找新品新机会，天天忙天天累，只要停下来业绩就下滑）影响太多，就一直想做长期且有沉淀的事情，导致没拿到什么像样的结果。这次从深圳回来彻底顿悟了，只是顿悟太晚错过好几波风口，但是多晚都比不顿悟要好。\n\
    \n入局出海业务大概是在24年的10月份，加入了哥飞的社群，看了一些公众号和社群内部知识后开始实操。但是一入局就比较排斥新词新站，因为太像之前的淘宝截流业务了，内心有一万个不要，行动上也在践行这种发自内心的排斥，基本不做新词，错过好几个月入万刀十万刀的机会点。\n\
    \n第二个原因导致业务拉胯的原因：迷恋批量化海量页面建站。有了 AI 后各种开发难度降低，想怎么采集重组数据都分分钟完成。做了几个小游戏和工具网站，上线直接铺了几万个游戏页面，4-5\
    \ 天收录破万，流量暴涨，但是实际测试下来就发现这个方式有大问题，点击量到了某个临界值一定会暴跌，降权清零。\n\n![](img/690f146199a71f753dfc3d7ced33371f_11_0.png)\n\
    \n还有一个导致业务没起来的原因：**AI带来的自嗨创造力**。没有 vibe coding 之前，想要做一个工具需要大量的编程经验，现在分分钟开发一些之前短期不能完成的工具。\n\
    \n### 关键词趋势监控工具；\n\n![](img/690f146199a71f753dfc3d7ced33371f_11_1.png)\n\n![](img/690f146199a71f753dfc3d7ced33371f_11_2.png)\n\
    \n### 5分钟自动内链且相关性超强的快速上站工具：\n\n### 从零开始创建一个新站点\n\n```bash\n# Step 1: 准备产品知识库（新功能！）\n\
    # 在 config/knowledge.yml 中添加产品相关的 URL\n# 只需粘贴 URL，系统会自动识别类型和优先级\n\n# Step 2: 生成知识库\n\
    # 从 URL 抓取内容，LLM 提取结构化产品知识\npython main.py gen-knowledge --force\n\n# Step 3:\
    \ 规划主题\n# 输入“产品名 + 产品类型”，LLM 会生成完整的主题聚类\n# 例如：FLUX.2 (AI Image Generation) ->\
    \ 使用 \"FLUX.2 AI Image Generator\"\npython main.py plan-topics \"FLUX.2 AI Image\
    \ Generator\"\n\n# Step 4: 生成页面种子\n# 将主题聚类转换为页面种子配置\npython main.py gen-seeds\n\
    \n# Step 5: 生成页面内容\n# LLM 为每个种子生成完整的页面 JSON（自动注入知识库）\npython main.py gen-content\n\
    \n# Step 6: 生成图片\n# 为所有页面自动生成并填充图片\npython main.py fill-images\n\n# Step 7: 生成所有配置\n\
    # 一键生成站点配置、首页配置、内链配置\npython main.py gen-all --domain \"yourdomain.com\" --force\n\
    \n# Step 8: 构建网站\npython main.py build\n```\n\n- .git\n- .wrangler\n- config\n\
    - data\n- docs\n- out\n- sitekit\n- templates\n- .env\n- .env.example\n- .gitattributes\n\
    - .gitignore\n- analyze_topics.py\n- list_keywords.py\n- main.py\n- requirements.txt\n\
