    # 蔡康永事件分析


    261008 文/卢克文

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/fc34f1162284a4f09f91fa6515df4ced_0_0.png)


    ![](img/fc34f1162284a4f09f91fa6515df4ced_0_1.png)


    微信：lazyhelper1


    小懒判断 | 关心两岸局势和舆论博弈的人值得读，想看娱乐八卦站队骂战的可以划走。最值得关注的是台湾艺人微博发国庆祝福的从 2021 年的 30 多人降到今年只剩
    19 人，赖清德当局用两岸人民关系条例逐个施压，艺人集体沉默是趋势不是个案。坑在于把蔡康永简单定性成台独或洗白都不对，他是利益计算大于立场表达，台湾艺人多数是既要又要的反复横跳心态。


    先简单过一下事件背景。


    2024 年 10 月，国台办将长期向台湾岛内民众与青少年宣扬“台独”的沈伯洋，列入台独顽固分子清单，对其实施制裁，禁止本人及家属进入大陆、港澳地区，限制其关联机构与大陆合作。


    一年后，2025 年 10 月，重庆警方发布通报，以涉嫌分裂国家罪对沈伯洋立案侦查，公开征集相关犯罪线索。国台办评价沈伯洋为谋“独”引战的分裂分子。


    又是一年后，2026 年 10 月 4 日，沈伯洋在台北举办竞选总部成立大会，属于民进党公开政治造势活动。现场媒体拍到 64 岁的蔡康永戴着帽子和黑色口罩，穿浅桔色上衣，坐在会场前排贵宾区，手里拿着印有'
  - '[PAGE 1]


    竞选标语的绿色加油棒，跟着现场氛围挥动加油棒，为沈伯洋造势。


    ![](img/fc34f1162284a4f09f91fa6515df4ced_1_0.png)


    画面传到中文网络，舆论炸了，大家纷纷指责蔡康永站队台独分子，各品牌立马和其切割。


    蔡康永事后只做了一些不痛不痒的回复，说是台北市长蒋万安叫他去参加派对，自己没有政治倾向，当然网友们并不买账，事情还在持续发酵中。'
  - '[PAGE 2]


    承蒙蔣萬安市長百忙之中，對在下發出搖滾區的邀請 🎶


    等收到具體邀約時，康永將欣然前往觀摩學習，並且會儘可能遵循該場主人希望的服裝方向去打扮，共塑派對氣氛 🎉


    也非常謝謝市長的關心 😊

    預祝活動成功，期待大家平安愉快 😊


    ![](img/fc34f1162284a4f09f91fa6515df4ced_2_0.png)


    Instagram

    蔣萬安想接受蔡康永專訪

    並誠邀...


    好了，重点来了，下面开始进入分析环节。


    这么些年以来，台湾省艺人极度依赖大陆市场，大陆是他们最重要的收入来源，2000 多万台湾省人消费不了这么多艺人，14 亿人的大陆超级市场，轻易就可以让一个台湾省艺人赚到半夜笑醒。


    他们收入高到什么地步呢？我当面问过一位前几年超级当红的台湾省明星的经纪人，他说这位明星收入最高时，在大陆一年有 5 亿的广告收入，现在没那么红了，一年也有
    2 亿的广告收入，为了证明他说的是真的，他还信口念出了部分广告大单的名字。


    如果这位台湾省明星不在大陆赚钱的话，他在台湾省一年大概只能挣几百万元人民币。


    大陆市场对台湾省艺人如此重要，所以一'
  - '[PAGE 3]


    一般情况下，台湾省艺人不敢轻易触碰国家给他们划下的红线，他们内心怎么想的咱们就不猜了，反正他们也知道最好的办法就是不说话不表态，无论发生啥都不说话不表态，不在公众场合说跟政治有关的任何话题。


    蔡康永在大陆赚钱的巅峰时期，是 2014-2019 年《奇葩说》黄金期，导师费加代言加广告加出版书籍，一年总收入大概能有几千万（不精准），2019 年后其代言减少，加上娱乐圈限薪令，估计其一年总收入大概在
    500-1000 万人民币之间（同样不精准）。


    没有谁会跟钱过不去，所以台湾娱乐圈的人通常非常谨慎发表政治观点，如果发表了，就要付出极大的经济代价。


    2022 年 SHE 组合里的田馥甄，在佩洛西窜访台湾时，在境外社交网站发了一张吃意大利面的照片，配文“不用打肿脸，午睡醒来就是肿脸，意大利面好吃状，扳回一城”，暗讽意大利裔的佩洛西来台，中国大陆拿她没办法。


    事后田馥甄在大陆的商业合作全部终止，品牌解约、音乐节与演唱会取消、网络平台下架，只有她的歌曲因为版权在华研国际手里，为了不伤及无辜，歌曲还是能在网络平台播放。在这件事发生前，她在大陆一年大概能赚到税前
    3000 多万人民币（不精准），事后她在大陆收入归零，靠台湾省和其他华语地区赚钱，每年总收入锐减到税前 200-300 万人民币。'
  - '[PAGE 4]


    <!-- no content -->'
  - '[PAGE 5]


    267项产品降税，ECFA执行期间，大陆累计减免台湾省商品关税560.6亿元人民币，台湾省仅对大陆减免关税64亿元人民币。


    另外还有台资企业的特殊优惠，很多外企不能拿的项目，台企可以拿，台企一直可以参与中国制造2025、5G、基建、政府采购、重大工程等，台企被认定为高新技术企业，企业所得税可为15%（普通企业25%），研发费用加计扣除、研发中心采购设备退税。台企还可以在大陆上市、发债，拿工业用地和大陆企业同标准，部分地区还会给台企产业园租金补贴。


    对台胞也有重大让利，持台胞证可以在北上广深任意买房，北京广州深圳买房手续都很简单，只有上海要求连续工作满一年后才可以买。我作为一个湖南人，以前限购时，我2022年想在长沙买套房都办不到，因为那时买房条件十分苛刻，但台湾人就可以随时买。


    台湾人还可以正常缴纳大陆社保医保，台湾学生可以参加大陆高校港澳台联考，可以低分录取大陆本科、研究生，奖学金与助学金同等待遇。台湾学生考清华北大也必须是尖子生，但总体难度比大陆学生要低不少。


    总之，大陆对台湾任何个人都是敞开怀抱，欢迎他们来大陆赚钱、买房、读书，只要不搞台独，一切欢迎。


    台湾各方人群也都默认这个规则，在大陆默默捞金，很多艺人在大陆每年几千万几千万的赚钱，比他们在台湾省赚得太多太'
  - '[PAGE 6]


    多了。


    但是今年，情况明显有些不同了。


    随着中国日益强大，祖国统一已经越来越近，赖清德当局近年持续对台湾公众人物，比如艺人、网红、文化名人施加压力，这两年不断对台湾公众人物威慑、核查，利用台湾地区的所谓《两岸人民关系条例》，恐吓公众人物不要在大
    陆平台发表承认“一个中国”、参与大陆官方庆典。


    2025 年 5 月，台陆委会主委邱垂正公开表态，锁定 20 多位台湾艺人列为重点核查对象，包括欧阳娜娜、陈妍希、侯佩岑、赵又廷、张韶涵等，只要艺人在大陆社交平台转发“一个中国”相关内容、参加大陆国庆晚会这类官方活动，就启动行政调查，涉嫌违规就罚款。


    2026 年国庆期间，多名台湾艺人微博发国庆祝福，台陆委会副主委梁文杰公开点名警告这批艺人，声称要依法查处，要求台湾公众人物必须和大陆保持距离。


    赖清德当局的《两岸人民关系条例》，第 33 条有好些内容，规定台湾地区人民、法人、团体，未经主管机关许可，不得与大陆党务、军事、行政或政治性机关或团体，进行任何形式的政治性合作行为。2025
    年民进党提出的新增修法草案，条文规定台湾民众赴大陆，不得配合大陆党政军机构发表被认定为“变更所谓宪政秩序、损害台区存在”的言论。


    根据新规，台湾艺人会在三件事上受到限'
  - '[PAGE 7]


    制：参加大陆官方举办的晚会与庆典、在重大敏感时间转发大陆官方账号的主权类内容、受聘担任大陆党政背景机构的职务、顾问。


    2021 与 2022 年， 中国国庆节时微博上发庆祝国庆的台湾艺人有 30 多人，台陆委会施加压力后，2025 年下降到 20 多人，今年就只剩 19 人了。侯佩岑、赵又廷、张韶涵、杨丞琳、王大陆今年都保持沉默。


    2026 年，赖清德当局对台湾公众人物步步施压，最有代表性的是黄智贤，以前一直主张“反独促统”，2026 年 9 月开始不再以统派旗手自居，价值取向发生明显变化。


    这背后发生了什么，很是耐人寻味啊。


    那依此推论，再看看蔡康永在沈伯洋活动现场，以及事后的反应，可以大致推论出蔡康永这次到底发生了什么。


    首先，蔡康永肯定是舍不得大陆市场的，毕竟每年这么多收入等着他，这些年在大陆赚到的钱，估算应该到一亿多近两亿人民币，从利益角度分析，他肯定是倾向于不在公共场合有所表态。但是台湾当局有他不能拒绝的人，让他必须去活动现场，于是蔡康永就按要求去了，但又遮遮掩掩地戴了口罩和帽子，希望侥幸蒙混过去，不要被媒体发现。


    为什么我认为他是“被不能拒绝的人叫去的”呢，因为他在现场的视频和照片，看起来都有些鬼鬼祟祟的，帽子和口罩把脸尽量遮住，好些照片都是低着头，很怕被人认'
  - '[PAGE 8]


    出的样子。


    事后他发的内容也是蒋万安叫他去参加派对，“希望共塑派对氛围”，明显就是在和稀泥，和稀泥就表示他舍不得大陆市场啊。如果他真的有非常强烈的民进党政治倾向，这种倾向压过了一切，他在沈伯洋活动现场直接上台就是，或者不戴帽子口罩就是，事后也直接说支持沈伯洋就行了，不用这么含糊其词。


    蔡康永事中与事后的表现，都是个人经济利益大于个人政治观点。


    他既不希望得罪台湾当局，也不希望得罪大陆市场，能混一天是一天的样子。


    好的，写到这里，一定会有人跳出来说：老卢你这是在妄图给蔡康永洗白啊。


    我就知道这世上不缺这种看不懂复杂事物的人，总以为这世上不是抹黑就是洗白，不懂得最基本的就事论事。


    我上面的分析，只是就蔡康永这一件事情的来龙去脉做解剖，我并没有说蔡康永是个怎样的人。


    很多人根本没有跟台湾省人打过交道，不知道他们内心深处的真实想法。


    不少台湾省人就两个想法：如果可以独，他想独，因为独能捞着不少好处。如果不能独，台湾人平时日子过得太好，为了独要让他送命或者损失重大经济利益，那他又肯定不愿意。'
  - '[PAGE 9]


    不少台湾省人就是这种反复横跳的心态。


    而且不少台湾人对大陆人一直是一种居高临下的心态。


    我从1999年11月末，就在东莞塘厦上泰高尔夫球头厂上班，那家公司就是一家台资厂，台湾人怎么看大陆人，我可太熟悉了。在他们眼里，大陆人不咋算人，顶多是一种生产工具，最差的台湾人也比最好的大陆人强，而且大陆人的工作和经济发展，都是他们施舍的，如果不是因为台湾人来大陆建厂，大陆人就穷得要饭吃。


    郭台铭就当众说过：大陆离不开我，我给大陆赏饭吃。


    这种居高临下的心态真的很恶心，因为今天我们去越南和泰国建厂，从来不会有“我给越南人、泰国人赏饭吃”这种思维，我们都知道这叫互利互惠、各取所需，但部分台湾人就觉得这一切都是他们赏我们的，我们要感激他。


    以前韩寒写过一篇文章，叫《台湾最美的风景是人》，这是一篇严重粉饰台湾人的文章，因为我常年跟台湾人打交道，知道他们在想什么。2015年去台湾旅游时，好些台湾小摊小贩一听我大陆口音，那种蔑视和厌恶之情都直接写在脸上，台湾人跟许多地区的人一样，一样有小市民心态、一样贪财好色、一样嫌贫爱富，从来就不比其他人高贵。


    台湾省因为工业发展得早，很快就能搞第三产业，所以音乐、电影、电视这种文娱'
  - '[PAGE 10]


    行业发展在我们前面，由此诞生了一大批艺人。虽然这些人很多只是把日本的音乐改一改再重新填词做二手买卖，但也不耽误他们红遍大陆。


    但他们对大陆还是极度依赖的，因为只有大陆才有这么多人看他们的影视听他们的歌，他们的作品才能变现，这时候一个大一统国家的优势就出现了，他们既想沾大一统的好处，又想躲在台湾岛享受没人管的快乐。


    部分台湾艺人就是这种思想，既要市场，又要台独，两边都想要。


    我不是说蔡康永就是这样，我是说不少台湾艺人是这样。


    我非常怀疑某个超级顶流台湾男星就是这样的人。


    但现实是随着中国日益强大，统一近在眼前，台湾当局比谁都焦虑，便要逼着台湾艺人亮明观点，给他们施加压力。


    台湾艺人里也有不少是真的支持统一的，比如黄安、欧阳娜娜等，也有部分艺人是既要又要的，我就不点名了，不点名不是畏惧他们，而是我们这边一贯的路线，是能救一个是一个，能帮一个是一个，这个国家能和平统一就尽量和平统一，尽量不要让两岸产生裂痕，这才是顾全大局的最好方法。


    本着“治病救人、和平统一”的原则，蔡康永这件事大概会这样处理：'
  - '[PAGE 11]


    首先处罚是难以避免的，因为你毕竟穿着应援服、拿着应援棒去给台独代表沈伯洋站台了，那你在大陆的商业事项肯定是要停一停的。其次应该会跟蔡康永有一次接触，问问他到底怎么想？如果真心支持一个中国，麻烦在公共场合正式表个态，毕竟我们也不能冤枉好人，但如果你一心倒向台湾当局，那就跟大陆市场说再见吧。


    记得我小时候六七岁时，台湾省每过来一个人回乡探亲，大陆这边小学都要列队欢迎，鼓励台湾人过来投资或者捐助，当年他们的社会地位被抬得好高。1994 年时，台湾省
    GDP 能达到大陆的 45%，而现在只有 4%左右了，很多台湾人受不了这种心理落差，受不了穷亲戚突然富裕，那种既要又要的心态，在他们的日常行为里时时会流露出来。


    尽管大陆强大了，但我们这边，还是要保持“能救一个是一个”的心态，展现出对台湾省全体人民的包容，台湾艺人过来赚钱，我们是欢迎的---与之相反的是，台湾省有《大陆专业人士来台许可办法》，里面明确规定，大陆演艺人员严禁在台从事任何营利行为，不准商演、不准接广告、不准拍戏挣钱---我们不仅欢迎艺人赚钱，做生意旅游买房定居都欢迎，只要你不政治上踩红线，啥都欢迎。


    而台湾省那边却反而难以接受大陆的强大，从 2025 年开始，他们逼着每一个艺人必须亮明政治态度，给每一个公众人物施压，蔡康永事件，不过是一个“想在大陆赚钱，但在政治上想模糊自己真实观点的台湾艺'
  - '[PAGE 12]


    人”，碰到了台湾当局“你别光顾着去大陆赚钱，你必须亮出政治观点”的政策施压。


    在祖国完全统一之前，这种事情还会发生在其他台湾省艺人身上，直到祖国完全统一为止。


    ---


    绝大多数人只盯着眼前的工资，却不知道一次远在中东的冲突、一次降息的决议，就能在一夜之间洗牌普通人的财富。


    看懂宏观，是为了在周期切换时，不被当作代价。


    如果你认同这种“抬头看路”的长期主义，欢迎围观我的个人情报智库：【懒人专属群】。


