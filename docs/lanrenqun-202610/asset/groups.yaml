    ![](img/4d476e502d0c6d139e1247d32e850580_0_0.png)


    小懒判断 | 康奈尔案最好的切入点不是案情，是一家学生报社花 23 个月把校方捂住的案子挖出来——检察官决定不起诉只依据 6 页摘要，从没读过 120 页完整笔录，这是全案最大反转。适合做内容和媒体的人；想看猎奇细节的会失望。坑在于原文有
    3 处外链是占位符已失效，且这篇重点是媒体叙事与舆论边界，不是司法进展追踪。


    一家学生媒体在挖掘该案的过程中扮演了重要角色。


    ![](img/4d476e502d0c6d139e1247d32e850580_0_1.png)


    今天的新闻实验室会员通讯，我们来了解近日在美国引发巨大关注和讨论的一起校园性侵案。


    一位前康奈尔大学学生（按照美国司法惯例化名 Jane Doe），起诉七名兄弟会成员在 2024 年 10 月的一个夜晚给她下药并轮'
  - '[PAGE 1]


    好了她。她同时起诉的还有康奈尔大学、兄弟会、她自己所在的姐妹会，以及一家向未满 21 岁人士卖酒的酒吧。随后，地区检察官重启刑事调查，纽约州州长下令第三方审查，州总检察长被任命为特别检察官。


    这起案子有许多可以讨论的面向——校园防性侵的制度性失灵、纽约州刑法里的“自愿醉酒漏洞”、兄弟会文化、精英大学的声誉管理……而本期通讯想要着重关注的是：这件事是如何被讲出来的？谁在讲？依据的是什么材料？尤为值得一提的是，一家学生媒体在挖掘该案的过程中扮演了重要角色。


    # 23 个月前的那个夜晚


    我们先来了解这个案子的基本事实。


    根据康奈尔大学的学生独立媒体《康奈尔太阳日报》（The Cornell Daily Sun）9 月 18 日发表的报道和路透社的梳理，2024 年 10 月
    19 日深夜，当时 20 岁的大二学生 Jane Doe 到校内的 Chi Phi 兄弟会宿舍去找一位朋友。按照她的说法，兄弟会成员给她提供了酒精、大麻和
    K 粉（氯胺酮，ketamine，一种可以导致幻觉和失去意识的麻醉剂），在她丧失行为能力之后，七人对她实施了性侵。诉状中附有一张兄弟会群聊的截图：凌晨 1
    点 42 分，一名成员在群里发消息，用极其粗鄙的语言（“free pussy”）招呼其他人上楼。'
  - '[PAGE 2]


    ![](img/4d476e502d0c6d139e1247d32e850580_2_0.png)


    大约三周后，她向校警报案。校方发出了“犯罪警报：性侵”的全校邮件；愤怒的学生朝该兄弟会宿舍扔鸡蛋；学校成立了一个性侵问题工作组，整理了一系列关于向学生讲解同意原则及性侵举报流程的建议。然后，正如《纽约时报》所写的，随着时间的推移，“校园的注意力大多转向了别处”。


    此后发生的事情，是在23个月之后才被公众知晓的：汤普金斯县（Tompkins County）地区检察官范霍滕（Matthew Van Houten）审阅了她的报案材料，决定不起诉刑事指控。校方反性侵的
    Title IX 程序进行了至少'
  - '[PAGE 3]


    十几场听证，最终有两人被开除，其他人受到停学等处分——原告律师称，有些人还被给予了通过写文章来减轻处分的机会（校方否认写文章是任何人的“唯一后果”）。Jane
    Doe 则退了学。


    直到今年 9 月 14 日，她提起民事诉讼，这一切才浮出水面。


    接下来的两周，事情快速发展：9 月 28 日，范霍滕宣布重启刑事调查，并将把证据提交大陪审团；9 月 30 日，州长霍楚尔（Kathy Hochul）宣布康奈尔同意聘请外部律所进行独立调查；10
    月 1 日，霍楚尔任命州总检察长詹乐霞（Letitia James）为本案特别检察官，理由是新披露的信息“对康奈尔校警的调查和地区检察官不予起诉的决定提出了严重的疑问”。伊萨卡市长则宣布暂停全市所有学生活动和特殊活动的许可，矛头直指校方“从未联系或协调伊萨卡警方”。


    # “康奈尔不做，我们做”


    最早追踪和曝光这件事的是一份学生报纸。


    《康奈尔太阳日报》成立于 1880 年，是美国历史最悠久的、持续保持独立的大学学生日报。它在财务上和编辑上都不受校方控制，办公室特意设在校园之外的伊萨卡市中心。


    今年 22 岁的大四学生 Cereese Qusba 是持续关注和挖掘此案的关键人物。2024 年 11 月那封全校邮件发出之后，大多数人很快忘了这件事，但
    Cereese Qusba 没有。她'
  - '[PAGE 4]


    在当时就联系上了 Jane Doe 和她的律师，花了很长时间建立信任，并采访校方管理者关于处分性侵者的流程。


    2026 年初，20 岁的 Sophia Dasser 刚刚接任主编，就接到了远在悉尼交换的 Qusba 打来的电话：“Sophia，我在做这个报道——我希望它成为《康奈尔太阳日报》的重点。”


    Sophia Dasser 后来对《纽约时报》说：“《康奈尔太阳日报》从来没有真正放手。”


    9 月 14 日诉讼提起，9 月 18 日，Cereese Qusba 这篇酝酿了 23 个月的报道发表。


    但他们没有止步于此。


    9 月 19 日是周六，编辑们在办公室庆祝报纸的 146 岁生日。主编 Sophia Dasser 一边切着蛋糕，一边转头问同事们：“我们能不能就把那些名字放到报纸头版上？”


    她指的，当然就是那 7 名被指控的兄弟会成员的名字。


    他们给律师打电话，律师的回答是：“I mean, it''s kind of a risk”（我是说，这有点冒险）。Sophia Dasser 回忆说：“然后我们就想，好吧，那我们的社论就从这句话开始写。”


    于是就有了 9 月 21 日的那篇社论。它的开头没有任何铺垫，直接是七个名字：Matthew Ingalls. Jonathan Newell. Winston
    Lee. Gillio Lopes. Diego Sarabia. Scott Norris. Scott Kretzschmar. 印刷版报纸的头版上，'
  - '[PAGE 5]


    <!-- no content -->'
  - '[PAGE 6]


    许多人为这样的做法击节叫好，但也有人提出疑问：这七个人只是民事诉讼的被告，没有被刑事起诉，更没有被告定罪。一份报纸把他们的名字如此显眼地印在头版上，合适吗？


    实际上，这七个人的名字本来就写在公开的法庭文件里。在美国，民事诉讼状是公共记录，媒体引用其中的被告姓名并不违法，《纽约时报》等主流媒体后来也在报道中点出了部分被告的名字。《康奈尔太阳日报》的做法在法律上有依据，在新闻惯例上也并非孤例。主编强调，校方的处理过程完全不透明，学生们感到被蒙在鼓里，而报纸要用透明来回应这种不透明。


    在美国的大型高校中，至少 <u>56.1%</u>的校园报纸接受校方资助。在这样的生态里，一份财务独立、办公室设在校外、能在 23 个月里持续追踪校方避之不及的案子的学生报纸，实属稀缺。


    # ## 寻找原始材料


    9 月 28 日，检察官范霍滕在宣布重启调查的同时，发布了一份很长的<u>声明</u>，为自己两年前不起诉的决定辩护。他说，Jane Doe 当年的宣誓陈述“将她参与吸毒和性行为描述为自愿的、清醒的、合意的”，“并未声称她被违背意愿地下药或遭到轮奸”；诉状“提供了与她的宣誓陈述不同的叙事和事实”。他在接受
    <u>ABC 采访</u>时还说：“她从来没有说她是在不知情的情况下被下药的。她承认是在知情的情况下自愿服用药物和饮酒。”'
  - '[PAGE 7]


    《纽约客》对这份声明的措辞做了很尖刻的托解。作者指出，范霍滕说他不能公开完整的宣誓陈述，因为需要大量涂黑以保护隐私，公开出来会“没有上下文、不清晰”，但他自己放出来的那个节选版，是“一团支离破碎、布满方括号的引文”。作者还注意到，范霍滕在声明里特意强调“每次
    Jane Doe 要求停止性行为，性行为都停止了”，作者对此讽刺道：“No means no, but you have to keep saying it,
    you see. It wears off.”（“不”就是“不”，但你得一直说下去，你瞧，它是会失效的。）


    然后，CBS 纽约台的调查记者 Mahsa Saeidi 拿到了一份关键文件：Jane Doe 在 2024 年 11 月 14 日接受校警和 Title
    IX 调查员询问的完整笔录。


    《纽约时报》随后获得了康奈尔内部 Title IX 调查的一千多页材料，把这份笔录放进了更完整的脉络里。原来，那次询问持续了数小时，笔录长达约 120 页；校警调查员把它压缩成一份六页纸的正式陈述，由
    Jane Doe 签字。而检察官说，这六页纸就是他决定不起诉时考虑的主要证据。


    对比 120 页的笔录，六页纸版本不包括的内容有哪些？比如这一句：“I can say with 100 percent confidence I was
    raped.”（我可以百分之百确定地说，我被强奸了。）比如她说自己到最后“完全、彻底地丧失了行为能力”。


    当 CBS 把笔录内容拿给范霍滕看时，他承认自己从未见过这份笔录：“那不是我当时掌握的信息。”他还说：“如果她说了那些'
  - '[PAGE 8]


    话，我们当然会想要进一步探究。”


    也就是说，一位检察官决定一起七名被告的轮奸指控是否值得起诉，依据的是一份由校警从 120 页压缩成 6 页的摘要，而他本人从没看过那 120 页，也从没和当事人谈过话。


    当然，这一千多页材料也不是单向度地有利于原告。《纽约时报》的另一篇报道非常细致地还原了事发后的三周：Jane Doe 最初和两名后来被她指控的男生互发了友好的短信：“At
    the end of the day non of the sexual stuff was illegal（说到底，性方面的那些事没有什么是不违法的）”，对姐妹会的“大姐”笑着说关于自己的传言“不幸是真的”，告诉室友“如果有人问起，就说没发生过”。直到大约一周后，她在一个关于兄弟会生活的论坛上看到有人写“他们吸毒并轮奸了一个大二学生”，才“第一次听到叙事发生了变化——我不是一个荡妇，我是被侵犯了”。她对自己最初那段性行为是否出于自愿的描述，在
    2024 年的笔录和 2026 年的诉状之间也确实存在差异。


    这些细节已经被一些保守派媒体拿来质疑她的可信度。但《纽约客》的那篇文章提醒读者：性侵受害者在事后淡化、合理化所发生的事，尤其是当施害者是朋友或熟人时，是极为常见的反应。


    《时代》周刊指出，纽约州刑法对强奸的认定非常严苛：只有在被强迫、拒绝、失去意识或“非自愿醉酒”的情况下，才被视为丧失同意能力——自愿饮酒或吸毒的受'
  - '[PAGE 9]


    害者，不能主张自己无法同意。一项堵上这个漏洞的法案今年 6 月在州参议院全票通过，却卡在了州众议院，而它的前身在 2020、2021、2023 和 2024
    年都曾失败。一位代理性侵受害者的律师说：“要么你滴酒未沾，要么你彻底昏迷。生活不是这样的。”


    # 线上与线下正义的边界


    《康奈尔太阳日报》把那七个名字名印上头版之后，社交媒体很快补上了报纸没有登的东西：照片、就读院系、家乡、实习单位。一位曾在 2001 到 2003 年间为《南方公园》写剧本的编剧
    Toby Morton **建立了一个专门网站**，记录和公开相关信息。他还把矛头指向“康奈尔那些给了你们一条生路的人”，并强调“我没有限度，没有边界。”


    这股网民自发寻找正义的浪潮已经越过了太平洋。


    韩国 SBS 电视台**报道**，由于七名被告中一位李姓韩国留学生的公开信息相对较少，有美国网民直接在网上“喊话”韩国网民帮忙：“韩国人，希望你们现在去找出你们自己人中的这一个”，“我把这事交给韩国网民了”。而韩国网民们的确行动起来，开始搜寻和分享此人的教育背景、过往经历，甚至他的韩文名字。


    韩国网络社区**流传**一则帖子，转述 X 账号的说法，称这名被告是“前韩国总理的孙子”，父亲是某企业的亚洲总管，母亲是香港韩人女性协会会长，“是韩国最有特权的'
  - '[PAGE 10]


    精英阶层”。但是，这些信息并未得到验证。


    不过网民们已经开始猜测：“难道那个家族的背景很强大”？是哪个政党在“拼命掩盖”？甚至有人认为，最近韩国媒体对一部电影的历史争议的集中关注，是为了转移对康奈尔案的注意力。


    一起发生在纽约州一个小镇的校园性侵案，就这样在几天之内变成了首尔的党争素材。而这一切的基础，是一个未经核实的匿名帖子。


    当网民上场，自然会出现充满问题的私刑（vigilantism）。但正如《纽约客》的文章所说，如果执法部门和检察官当初认真对待了 Jane Doe 的报案，后来的私刑可能就并不存在了。而当校方不公开处分结果、检察官不起诉、受害者的完整陈述躺在没人看的卷宗里时，人们会被驱使去寻找自己的正义——哪怕是粗糙的、越界的正义。


    比起群情激愤的网络，康奈尔大学校园里依然算得上安静。《纽约客》的文章解释了安静的原因：康奈尔在 2023 到 2024 年的亲巴勒斯坦抗议之后，对校园“表达活动”施加了严格限制，包括“扩音或其他大声的声音”“起哄”“张贴海报、标语和粉笔涂写”。亲巴勒斯坦抗议导致了多名学生被逮捕、刑事移送、停学，有四名学生被处以三年的“不受欢迎人物”身份。相比之下，兄弟会性侵案的七个人里只有两人被开除。这就更凸显出校方政策的虚伪。


    不过，最近这个周末，校园人行道上已经出现了粉笔字：“CORNELL PROTECTS'
  - '[PAGE 11]


    # RAPISTS”（康奈尔保护强奸犯）、“PROTESTERS SUSPENDED RAPISTS GO FREE”（抗议者被停学，强奸犯逍遥法外），还有一条是：“CHALKING
    BECAUSE PROTESTS ARE BANNED”（用粉笔写，因为抗议被禁止了）。


    女权主义作家 Jessica Valenti 在她的 newsletter 里写道，康奈尔案让她想起 12 年前哥伦比亚大学那位背着床垫上课的学生 Emma
    Sulkowicz——因为施害者未受惩罚，她把自己被侵犯时躺的那张床垫背了一整年，直到毕业典礼上背着它走过舞台。


    而 Jane Doe 对《康奈尔太阳日报》说，事发将近两年之后，“我仍然日日夜夜背负着它的重量”。


    ![](img/4d476e502d0c6d139e1247d32e850580_11_0.png)


    在这个 AI 能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的护城河，只剩下“信息过滤”的效率与“认知系统”的维度。


