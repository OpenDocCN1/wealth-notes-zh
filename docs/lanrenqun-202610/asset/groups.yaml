    # 什么是 GEO


    GEO 的全称是 Generative Engine Optimization，就是 生成式引擎优化，做 GEO 的目的就是 让你的网站内容被大模型、AI
    搜索（Google SGE、Perplexity 等）引用、摘录进 AI 回答里，不一定带来点击，重点是在 AI 答案中获得曝光。


