    更加严重；但如果为了压低通胀而大幅收紧政策，又可能加重经济衰退。经济学家发现，原来一些看起来相对稳定的经济规律，突然变得不那么可靠了。


    那么，问题到底出在哪呢？


    1976 年，经济学家罗伯特·卢卡斯提出了一个非常重要的批评，后来被称为“卢卡斯批判”。卢卡斯指出，当时的一些宏观经济模型，是根据历史数据建立的。但问题是，这些统计关系是在过去的政策环境下形成的。一旦政策发生重大变化，人们的行为也可能随之改变。


    比如，过去的数据显示，每当居民收入增加 1000 元，消费就会增加 100 元。但问题是，这 1000 元可能有两种情况。首先，它可能只是一次性奖金。其次，它也可能是以后每个月都增加的固定工资上涨。这两种情况下，收入增加的数字相同，结果却不一样。因为面对一次性奖金，和面对长期的工资上涨，人的反应可能完全不同。


    换句话说，人们不只是被动地接受收入变化，还会根据对未来的判断，主动调整自己的行为。这就出现了一个难题。我们本来希望通过政策改变经济，但政策一旦改变，经济中的人也会改变自己的行为。过去总结出来的统计规律，就不一定还能直接使用。


    那么，新的经济模型应该怎么建立？卢卡斯提出的一个重要方向是，不能只看宏观指标怎样变化，还要研究这些指标背后的家庭和企业，究竟是怎样作出决定的。这'
  - '[PAGE 3]


    就是今年诺奖获奖理由里的关键词，叫“微观经济学基础”。


    接下来，就要说到今年的两位获奖者的研究了。


    我们先从霍尔说起。1978 年，霍尔发表了一篇论文，讨论了一个看似简单的问题：人是怎么决定花多少钱的？


    直觉上，我们觉得答案很简单，这个月发多了就多花，发少了就少花。经济学里管这叫“凯恩斯消费函数”，它假设人的消费主要跟当期收入挂钩。


    但霍尔说，不对。他把消费者看作一个有理性、有预期的决策者，而不是一个只看眼前的人。一个普通家庭在花钱的时候，脑子里会自动算一笔大账：我现在有多少钱，未来大概还能挣多少，合在一起能花多少年？然后把花钱的节奏分摊开来。


    这就是经济学里说的“永久收入假说”。霍尔把它和“理性预期”结合在一起，得出了一个在当时看来非常反常的结论：消费的变化是不可预测的。


    什么意思？如果一个家庭已经把对未来的预期全都算进了当前的消费安排，那么只有真正意想不到的新信息，才能改变他们的消费行为。所有能被提前预料到的事，比如下个月有一笔年终奖、后年孩子要上学，都已经被“消化”在当前的消费计划里了。


    这就好比买房。开发商可能告诉你，这个地方三年后要开通地铁，到时房价一定会'
