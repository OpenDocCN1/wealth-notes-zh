    # 那么，诺贝尔文学奖为什么要选一个“难读”的作者？它选人的标准到底是什么？


    注意，诺贝尔文学奖从来没有公布过任何官方的“打分标准”。我们接下来谈的，只是读者们基于诺奖的获奖脉络，得出的观察。


    简单说，在很多人看来，诺贝尔文学奖，最在意的不只是通常意义上的“好看”，更是这个作者“对文学本身作了什么贡献”。打个比方。你去一家餐厅吃饭，觉得特别好吃，这是“审美经验”。但米其林评星的时候，它不只看好不好吃，还要看厨师有没有创造新的技法，有没有用前人没用过的食材组合，有没有对“烹饪技艺”本身产生影响。你在家做的红烧肉可能比某些米其林三星好吃，但它不会得星，因为它没有“推动烹饪的边界”。


    所以当你“看不懂”的时候，不是你的问题。这个奖本来在某种程度上，就不是为普通读者的阅读体验设计的。


    而且既然不是为普通读者设计，评选方式自然就不依托于普通读者。诺贝尔文学奖的评委，来自瑞典学院的文学和语言领域的学者。这批人加在一起，一共只有18个人，而且理论上是终身任职的。这18个人之下，设有一个5人的文学奖委员会，负责具体的筛选工作。


    筛选流程是这样的，每年11月，委员会开始发提名邀请信，寄往全世界的大学教授、文学机构、往届得主。次年1月截止。春天时，要筛出20到25人的长名单，5月缩减到大约5个人。夏天，院士们会读书、'
  - '[PAGE 4]


    讨论、准备评估报告。9月开三次会，10月投票。票高者获奖，且得票数必须超过半数。


    注意，虽然评选流程是公开的，但是，具体的内容全部保密。谁被提名了、院士们怎么讨论的、每个人获得多少票，这些档案全都锁在瑞典学院的保险柜里。按照学院的规定，要50年后才解密公开。比如，今年的评选细节，要等到2076年才会公开。而目前，这个信息还只是公开到了1975年。


    没错，我们现在能看到的最新解密名单，还是1975年的。那一年进入长名单的有纳博科夫、格雷厄姆·格林、加西亚·马尔克斯，这些后来都成了文学史上的大人物。有些后来获了奖，有些到死都没获。


    **那么，基于这套机制，“可能的”标准是什么呢？我们可以看看这几年的颁奖词。**


    2021年，坦桑尼亚的古尔纳获奖，颁奖词说他写出了“殖民主义的影响和难民的命运”。2022年，法国的安妮·埃尔诺获奖，颁奖词表彰她“从个人记忆中挖掘出集体约束”。2023年，挪威的约恩·福瑟获奖，因为他的作品“为难以言喻之事发声”。2024年，韩国的韩江获奖，颁奖词说她“直面历史创伤，揭示人类生命的脆弱”。2025年，匈牙利的拉斯洛获奖，表彰他“在末日般的恐惧中重新肯定艺术的力量”。


    你看，地理上，从欧美扩展到非洲、东亚、东欧。性别上，近年来男女作家几乎交替获奖。年龄上，新老交替，比如韩江获奖时53岁，是近四十年来最年轻的获奖者。'
  - '[PAGE 5]


    简单说，这个名单足够“丰富”。而且颁奖词里的关键词也在发生变化，近年来出现的关键词包括，“创伤”“脆弱”“恐惧”“新形式”。


    因此，在文学评论领域有一个说法，认为诺奖越来越看重的，是一个作家能不能回应这个时代的核心处境，比如人类的脆弱、历史的裂痕、身份的漂浮。这不只是在奖励一个人，也是在用这个奖来表态：什么样的文学，对这个时代是重要的。


    这种价值不是告诉你谁写得最好，而是像在一片巨大的、混沌的文化丛林里，每年竖起一根杆子。这根杆子不是路标，也不是终点。它只是告诉你：在你可能永远不会走到的某个方向上，有一棵值得注意的树。


    你可能一辈子都不会走过去。但你因为这根杆子，知道了那个方向的存在。它进入你的视野里，在你的认知地图上留下一个坐标。你未必会真的读那本书，但我们起码知道，在自己看不懂的地方，也有值得被看见的东西。尤其是在
    AI 写作泛滥的今天，我们也许更需要这样的见识。


    当然，诺贝尔文学奖有一定的主观成分，因此，关于它的争议，时不时就会出现。比如，托尔斯泰没有得过诺贝尔文学奖，博尔赫斯没有，还有卡夫卡、普鲁斯特、弗吉尼亚·伍尔夫，这些人在文学史上的地位几乎没有争议，但他们都没有得过诺贝尔文学奖。


    再比如，2016 年，美国摇滚歌手鲍勃·迪伦'
  - '[PAGE 6]


    获得诺贝尔文学奖。但问题是，歌词能够算得上“文学”吗？这个争议到今天都没有定论。


    但就像很多读者说的，诺贝尔文学奖的意义，也许不在于它给出了一个答案，而在于它不断提醒我们：答案之外，还有很多问题。熟悉之外，还有很多世界。看不懂之外，也可能藏着值得被看见的东西。文化的意义，也许不是要求每个人走进所有地方。而是在漫长的人类旅途中，为我们留下足够多的入口，入口之后，也许有一片你从没想过的特别的世界。


    ![](img/b93ef4158f740aa1cbd0070108e76123_6_0.png)


    在这个 AI 能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的护城河，只剩下“信息过滤”的效率与“认知系统”的维度。


    圈子已稳定运行 7 年。我们每天利用 Python 爬虫与大模型算力，过滤全网最顶级的政经内参和搞钱风向标，做你最冷酷的“外部大脑”。


    如果你认同这种“重塑认知防线”的极客主义，欢迎围观我的个人情报智库：【懒人专属群】。


    [https://lazyso.com/insider/](https://lazyso.com/insider/)'
