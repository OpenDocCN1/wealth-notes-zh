    # 第十二，创业板


    老铁们，创业板要重点讲一下。你们自己抒一下。


    创业板终于出现了周线级别底背离信号。我们终于等到了创业板做周线底背离。等的太辛苦了。这是交待过很多次，也提醒过大家很多次，要防止创业板做周线底背离。创业板在连续调整了
    16 周之后才出现周线底背离。从斐波那契数列来看，理论上应该要在第 21 周时间出现变盘或者反转信号。


    当然了，见到周线底背离是好事也是坏事。好事证明差不多到底部来了，下跌空间有限。坏事是因为是刚开始做底背离，那么还会继续打压盘面，继续洗盘，反弹反抽也是看诱多。


    创业板在跌破 3070 支撑，和跌破 3013 支撑的时候，基本上就是要跌破 3000 点，最后捅到了 2932 之后才出现了周线底背离。


