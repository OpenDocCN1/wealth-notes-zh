    少，无非就是两个原因，一是员工总数下降，二是人均薪酬下降。


    我们一项一项看。公司在 2025 年，员工人数从 3572 人下降到 3267 人，减少了 305 人。人均薪酬方面，我们计算出 2024 年员工平均年薪
    34 万元，按同样方法计算，2025 年员工平均年薪 34.69 万元。


    也就是说，公司对管理费用中职工薪酬的控制，主要依靠裁员，人均薪酬反而是略有增长。办公费降低了近一千万，其背后是公司提管理、降费用计划的推进，根据公开资料，公司通过全面预算管理和动态预算授权，持续推进降本增效、强化执行与考核机制，提高人效。


    所以这是公司练内功的一年，开始收缰了，规范内部行为，什么手松一点啊，睁只眼闭只眼啊，都在被限制。


    不过也要看到，管理费用的控制主力仍是缩减冗员，而裁员是有限度的。


    下面是公司 2026 上半年的情况（单位：万元）：


    |  | 2025 上半年 | 2026 上半年 | 增量 | 影响 |

    |---|---|---|---|---|

    | 税金及附加 | 996.89 | 1382.24 | 385.35 | -385.35 |

    | 销售费用 | 21390.41 | 20007.36 | -1383.05 | 1383.05 |

    | 管理费用 | 20546.10 | 20624.17 | 78.08 | -78.08 |

    | 研发费用 | 21371.30 | 21936.53 | 565.23 | -565.23 |

    | 财务费用 | 8382.99 | 7550.56 | -832.43 | 832.43 |

    | 合计 |  |  |  | 1186.83 |


    2026 上半年，费用环节一共增加营业利润 1186.83 万元。经过这 5 个环节，公司 2026 上半年的营业利润同比增加 12739.57 万元。'
  - '[PAGE 10]


    其中影响较大的是销售费用和财务费用。销售费用降低 1383 万元，财务费用降低了 832 万元。


    我们先看，在 2025 年减费贡献突出的管理费用，在 2026 上半年同比增长了 78.08 万元，已经很难进一步下降了，可见管理费用的控制总有边际。


    但是公司对于费用的控制显然是长期、广泛执行，已经从管理费用横跨到其他费用。2026 上半年销售费用下降的主要动因是广告展览费，下降了九百多万元，另外还有员工薪酬下降，降低了七百多万元。


    财务费用降低主要是因为利息费用降低，形成了 1778 万元的正面影响。


