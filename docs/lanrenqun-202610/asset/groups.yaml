  - '[PAGE 6]


    在 117 条已确认虚拟形态的记录中，有 42 条满足这个条件。其中有 32 条七天增量达到 100，这 32 条里又有 15 条达到 500、8 条达到
    1,000。可以按自己熟悉的方向和能投入的精力，继续缩小研究范围。


    这些数字都是商品页面展示销量的观察增量，不能据此算出实际订单、退款后的成交或利润。“持续增长”在这里指每天都有增加；要判断增长是否加快，还要比较前后两周。


    这批商品是一次回看筛选，部分加购标签是在观察周内才采到的。因此我不会把这次结果讲成提前预测。它能帮我缩小下一步研究范围。


    # 样本图 / 04


    # 42 条候选，怎样再缩小范围


    近 7 天展示销量观察增量。


    42 条 连续 7 个日间隔为正

    来自 117 条已人工确认的虚拟商品记录


    增量 ≥ 100 32 条


    增量 ≥ 500 15 条


    增量 ≥ 1,000 8 条


    三个范围互相包含，不能相加。


    门槛用于安排研究优先级。


    销量增量尚不能回答利润、授权和交付问题。


    42 条增长候选中，不同增量范围的记录数'
