    今天，期权市场上指数大型成分股的看跌期权成交量达到 20 日均值的 2 至 3 倍，说明对冲需求集中释放，也说明市场的情绪逐步运行到了冰点。


    那么，市场何时才可以真正的见底，并展开一波反弹。我们检验了几个指标。


    首先，我们看到恒科经历了最近的一轮抛压之后，已经运行到了下行趋势的底部区域（图一）。同时，从价格结构来看，抛售的波浪已经开始进入了尾声阶段（wave count），而恒科今天的蜡烛也跌穿了布林线的下轨。


    由此可见，我们把今天的盘面称之为过去三年最严重的抛压之一毫不为过，并与开篇的统计数据相呼应。


    ![](img/15bf6e93caf66623bfb03dbc8ec2c973_3_0.png)


    我们还可以看到，韩国半导体的出口价格'
