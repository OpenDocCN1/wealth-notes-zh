    # 孙宇晨成功学


    261016

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/544d83d52aa7ce42c529c894071a05cc_0_0.png)


    小懒判断 | 适合好奇"为什么年轻人开始半认真研究孙宇晨"的人——重点不是孙宇晨说什么，是蔡钰拆的这层社会情绪变化。不适合想抄作业赚钱的人，Token 中转
    API 差价这种听着就行不通。最值得看的是十年旧书突然冲上飙升榜、书评"骂他的人还在加班"这个信号：好好做题的故事真在失效。坑在于：黄毛、薄肌这些梗是营销产物，别当人生哲学。


    本文选自《蔡钰·商业参考5》第35期，完整的课程在专属群内连载中。


    10月份，网红博主邵艾伦发布了一场他与波场创始人孙宇晨的视频访谈，长度有4个多小时。


    这么长，我还是忍不住刷了一遍，因为孙宇晨这个人，实在是太有节目了。提到这个名字，你很容易想起各种争议：发币割韭菜移民，热捧特朗普家族的加密项目，拍下巴菲特午餐却又放鸽子；花600多万美元买下一件香蕉艺术品，当场把香蕉给吃了。他身价超过100亿美元，却还是会像荔汉村如一样写小作文公开感情纠葛。


    在这次这个访谈里，邵艾伦问孙宇晨：如果今天回到20岁，没有人脉没有资源，'
  - '[PAGE 1]


    # # 你会怎么重新开始？（今年是 2026 年，孙宇晨 36 岁）


    孙宇晨还真给了一套答案，值得你稍微了解一下。


    你可能会说，为什么要去关注这个？他不就是个会造噱头的流量高手吗？


    我的理由也很简单：


    为了感知年轻人的心态和观念的演化。


    在今天的社会里，随着好好做题的叙事逐渐失效，孙宇晨这个名字引发的社会情绪，也在发生某种微妙的变化：


    有不少年轻人，一边嘲讽地喊他“孙割”，一边认真研究他的成功之道。


    2026 年初，孙宇晨有本 10 年前的旧书，突然冲到了微信读书的飙升榜第二名。书名《这世界既残酷也温柔》，讲孙宇晨自己的经历和成功学主张的，在读人数高达
    10.3 万人，书评超过了 2400 条。


    再结合孙宇晨在早年的其它输出，不少年轻读者惊讶地发现，他 10 年前就反对买房，同时大笔投资比特币、苹果、特斯拉等资产。而 10 年后的 2026 年回头看，一线城市房价跌回十年前，苹果成了全球市值最高的公司之一，特斯拉涨了近二十倍，比特币单价也从几百美元涨到了数万美元。


    这就让读者们有点坐不住了。点赞最多的书评说：“骂他的人还在加班，他却把世界踩在脚下。”'
  - '[PAGE 2]


    在这类“认知冲突”下，不少年轻人，把“孙学”从玩梗，反转成了半认真的机会主义成功学。


    随着这本书和“孙学”越来越热闹，孙宇晨亲自下场，推波助澜地说：“孙学的本质就是赢。”


    这话放在赢学流行的 2026 年，太会蹭流量、也太有效果了。


    等到了 10 月这次他跟邵艾伦的访谈，已经是在被 20 多岁的采访者言辞恭敬地取经。而这跟十多年前，孙宇晨跟搜狗创始人王小川的一次视频交锋，形成了鲜明对比。在当时，王小川在节目中是直呼“骗子”，认为跟对方同台录制节目是“耻辱”的。


    这次这个访谈发布后，抖音、小红书、公众号上都有大量博主争相解读，这就不用说了，就连专业投资社区雪球，都出现了不少对新“孙学”的详细学习笔记。


    你看，十年轮回下来，新一代人对孙宇晨的关注重心和贴的标签，已经不同了。


    前面提到的邵艾伦那个提问，孙宇晨给了四个建议，关键词分别是孙学、薄肌、黄毛、AI。


    我们来看一下这都怎么说。


    # “孙学”


    先说所谓的“孙学”，


    它到底是什么呢？'
  - '[PAGE 3]


    我看不少“孙学”研究者们，从十年前那本旧书里总结出来的是这么 3 条原则：


    第一条，30 岁前不买房、不买车、不结婚。这也是当年争议最大的一条。


    孙宇晨的逻辑是，这三样东西，会锁死人的流动性。十年后的这次访谈，他又举了一个例子：明天早上 OpenAI 说录取你去旧金山工作，但你要是在北京有房有生活，大概率会失去这个机会。


    所以，这条主张换句话说，就是在资源没积累到拐点之前，人应该保持自己的高流动性。


    第二，做未来正确的事。也就是终局视角，站在终局去看今天做什么是对的，这也是他那本书的方法论总纲。


    第三，


    注意力即货币。在十年前，他就把自媒体账号看作可无限加杠杆的股权，说粉丝就是未来现金流。2016 年广州市番禺区请他当政协委员，他当时就建议地方大力支持网红经济了。


    这是十年前那套“孙学”的基本主张。到了 2026 年，孙宇晨本人想往“孙学”里面添加的东西，是“薄肌理论”和“黄毛理论”。当然，“理论”这个词，是孙宇晨自己说的，你理解成观念或者原则就行了。


    # 薄肌


    先来看所谓的“薄肌理论”。'
  - '[PAGE 4]


    <!-- no content -->'
  - '[PAGE 5]


    在 AI 时代是无价的，AI 时代商机无限，但身体不健康是一票否决。不绡薄肌，肥胖会导致很多问题，严重拖慢人财富自由的进度，还会给生活带来很多麻烦。所以，孙宇晨又“借花献佛”，把“薄肌理论”献给了邵艾伦所代表的、求问人生建议的年轻人。


    # 黄毛


    好，孙宇晨继“孙学”、薄肌之后的第三个建议是，保持“黄毛心态”。


    这个词，也不是孙宇晨的原创。它是怎么个意思呢？黄毛，在中国社会本来指代的是年轻浪子，他们没有正经工作，但举止张扬，喜欢染头发来标新立异，爱骑鬼火摩托炸街，甚至到处惹是生非。


    黄毛这种人设，本来在主流价值观里是不被认可的。但这两年，有些男性开始把黄毛当作了高配得感、不委曲求全的代名词，来跟所谓的女权叙事里的大女主、主体性打对垒。


    那“孙学”吸纳的“黄毛理论”怎么用呢？


    孙宇晨的逻辑是，“孙学”和薄肌一旦在今天的中国或者华人社会开始实施，会遭到很多打压和嘲笑；而即便因为练了“孙学”和薄肌，变得又帅又有肌肉还有钱，在社会中也会遭到嫉妒。这种情况下，就需要用“黄毛理论”来肯定一下自己，相信别人说什么不重要，自己认定对的就充分执行。


    你看，黄毛理论，在“孙学”里承担的是心态护甲的作用。'
  - '[PAGE 6]


    孙宇晨本人在这么多年的流量争议里，肯定也是感触良多的。


    这也是为什么，孙宇晨能神色自若地主动跳进一个又一个争议漩涡，来为自己引流；还能在情感纠纷的网暴里，淡定地把别人对他长相和身材的辱骂，给转化成了薄肌这种自我提升目标。


    # ### AI：先把人生地图打开


    好，有了这三个关键词，“孙学”、薄肌、黄毛，孙宇晨说，今天的年轻人就可以零成本往个人成功的方向开工了。不过在当下这个时代，还要加上一个核心工具，AI。孙宇晨说，自己现在对
    AI 是百分百信任。


    我从访谈里看到了他的两种用法。


    第一种是，他把自己的生活流彻底接入了AI。


    他现在吃饭，饭前先拍一张餐桌照片，发给 Claude，让 Claude 告诉他怎么吃、按什么顺序吃；饭后再拍一张餐桌照片，让 Claude 根据剩菜估算他摄入的卡路里。


    日常的肌肉训练，练硬拉和深蹲，也让教练帮他拍视频，再发给 Claude，让 Claude 记录他的运动量、负重，指导他怎么做渐进超负荷，估算消耗了多少卡路里。


    睡觉呢，也戴了一个 OuraRing 指环来记录睡眠指标，也把数据丢给 ClaudeCode。


    ClaudeCode 每天整理一份日报，来记录孙宇晨的完成情况，根据热量缺口不停给新'
  - '[PAGE 7]


    的行动建议。


    另一种操作呢，他在用 AI 扩大自己的机会地图。这个建议，他也推给邵艾伦代表的年轻人了。


    聊到这个话题的时候，孙宇晨讲了个金句。他说，商机是全球性的，千万不要局限于我在家门口开个小卖部，挣楼底下老奶奶的钱，而是要把尼日利亚人、土耳其人、阿根廷人都看成潜在客户，去往全球赚钱，反正今天有
    AI 嘛，视野和语言都不成问题。


    他举了个例子，叫 Token 中转。现在全世界最顶级的那几个 AI 大模型，比如 OpenAI，在不同国家的 API 订阅费用有高有低。阿根廷、土耳其、尼日利亚的包月价格就远远低于美国。那在低价地区买
    API 资源，供应给高价地区的用户，差价就稳定赚到了。


    你看，跟十年前那个 30 岁前不买房不买车不结婚、保持个人流动性的逻辑，又连上了，要到处去，往有钱、有机会的地方去。


    但这说得容易，普通年轻人，哪能拥有这种现成的世界级信息差和视野呢？


    孙宇晨又举例子了：虽然他不推荐年轻人买，但实在要买房的话，在买之前先看 100 套房，一手房、二手房、各种地段都看，听不同的人介绍、开价，就能基本形成对房地产的认知框架。类似的，年轻人择业，也可以让
    AI 帮忙，推演 100 个专业未来 10 年的就业前景。


    总之，就是借助 AI 先把人生地图尽量撑大，'
  - '[PAGE 8]


    获取足够信息，再去做选择。


    # 总结


    好，这是站在 2026 年，我想请你稍微留意的，年轻人正在半戏谑半认真研究的孙宇晨，给出的四个关键词：“孙学”、薄肌、黄毛、AI。


    它们放在一起，就是在说：以机会为目标，不断更新认知，管理好身体，放下对被认可的执念，再借 AI 把人生地图撑开。


    今天我们不是要对孙宇晨这个人和他的观点表态，而是把他作为观察窗口，来观察年轻人。


    我觉得，很难说，究竟是这些观念说服了新一代年轻人，还是新一代年轻人已经转向了这些观念。


    你怎么看？听听你的看法。


    再见。


    +   1. 不少年轻人一边嘲讽地喊孙宇晨“孙割”，一边认真研究他的成功之道。

    +   2. 孙宇晨的建议可以提炼为四个关键词：“孙学”、薄肌、黄毛、AI。

    +   3. 很难说究竟是这些观念说服了年轻人，还是年轻人已经转向了这些观念。


    在这个 AI 能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被'
