    ## 四、几百轮聊天已经管不住，我用 Codex 搬出全部历史，再让 Kimi 接管案件


    ![](img/99fc997c705869be0f6bd9e9965c8d04_16_0.png)


    偶尔刷抖音发现一个律师博主视频里提到（这律师是做了一套自己的利用 AI 处理案件的工作台+Skill 的，也算是属律师+AI 的本地先驱）。


    “全球最大的法律 AI 公司 OpenAI 的亲儿子 Harvey 刚刚宣布呢，自家的法律大模型不再用 ChatGPT 改用 Kimi 了。那就在 8 月


    继续要处理的协议和文书。我需要的已经不再是再问 AI 一个问题，而是让一个模型能够把整个案件长期接住。


    - 2. Kimi 的产品和工作台已经接入 华宇元典等专业法律数据源，也在做法律研究、合同审查和文档处理这类工作。更让我注意的是，Harvey 原本也会使用
    OpenAI 等模型，但在开发自己的第一款 post-trained 法律模型 Tenet 时，选择了 Kimi K3 作为 base model，再继续做法律领域的
    post-training、长周期法律任务和专业工作流。


    但前面大量内容都在豆包里，靠我自己一条一条复制肯定不现实。


    所以我开始用 Codex 去提取豆包的历史对话。


    第一次抽出来以后，我不太相信已经完整了。


    因为我自己记得前面明明聊过一些东西，抽出来的文件里却找不到。


    那就重新检查。


    检查以后发现确实还有遗漏，就继续抽，抽完再对。后面我又让 sub-agent 和其他检查流程继续查，看有没有漏掉整段对话、消息顺序有没有问题。


    这个过程不是一次“导出成功”就结束了，而是反复抽取、检查、补漏。


    最后整理出来的豆包记录大约有 655 个消息块，整个导出文件约 1.48MB。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_19_0.png)


    [插图：Codex 抽取豆包历史对话的文件 / 约 655 个消息块、1.48MB] 但我没有直接让豆包做一个总结，再把总结复制给 Kimi。


    因为前面的 AI 分析本身就有错误，有时会把推测写成事实，责任和赔偿判断也出现过说得太满、后来证明不可靠的情况。如果直接搬总结，这些错误也会一起被带到新的聊天里。


    所以我迁移的不是一份“豆包总结”。


    我尽量把原始材料一起带过去：自己的陈述、对方原话、聊天记录、报价表、Excel、照片、录音转写，以及以前 AI 做过的分析。


    这些东西不能混成一类。


    原始事实是原始事实，对方说法是对方说法，表格、照片、录音是材料，AI 以前做过的分析只能继续作为分析。日期、金额、人物身份如果互相冲突，也先把冲突留下来，不让新的
    AI 自动挑一个看起来最合理的版本补上。


    然后我把这些整理好的资料交给 Kimi。


    后面 Kimi 持续帮我维护的东西，主要就是：时间线、人物和权限、金额变化、证据状态，以及仍然没有确认的问题。每次出现新的电话、人物、金额或者文件，就把新材料放回去，更新当前案件状态，再继续往下处理。


    ![](img/99fc997c705869be0f6bd9e9965c8d04_20_0.png)


