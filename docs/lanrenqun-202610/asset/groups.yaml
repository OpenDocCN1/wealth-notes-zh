  - '[PAGE 16]


    把 9 月收入按参考汇率汇总，约为 32000 元人民币。这是奖励、返现等收入的合计。


    再加上 8 月下半月接近 1.7 万元的收入，这一个半月合计大约 4.9 万元，也就是标题里说的 5 万。对一个还只有 3～4 千粉、没开通 X 创作收益的账号来说，这个结果让我觉得，低粉拉新这条路值得继续做。


    # ## X 创作收益还没开，后面还有一份收入可以争取


    从 8 月下半月到 9 月底，这一个半月的收入，都是在我尚未开通 X 创作收益的情况下做出来的。


    这也是我觉得这条路值得继续做的原因。现阶段先通过内容找到有需求的人，把 App 拉新和社群指导做好；后面满足条件，开通 X 创作收益并获得分成，就能在现有收入之外，多一份平台创作收入。


    同一篇实操内容，可以继续带来有效推荐，也有机会贡献创作收益。对我来说，后面的收入还有往上走的空间。具体能多多少，要等开通之后看实际数据，现在先不预设数字。


    所以我会继续写长文，也继续做账号。只是现阶段，没开创作收益这件事，没有挡住我先拿到结果。


    # ## 最后


    回头看我这一年，3 月加入生财、尝试航海，6 月进 B 哥的小群学习，8 月下半月开始做 App 拉新，中间还换过方向、被封过'
