    或者要等到大盘底背离做结实一点，这句话非常重要，这决定主力是否愿意大幅抄底的态度。


    那么下周操作策略是什么呢？


    因为下周的走势我们整体看：冲高回落，诱多！


    那么大家要做的依然是冲高逢高做减法为主。然后逢低再低吸回去。


    下周两种走势预判：


    第①种走法，直接继续跌破 3800 点，在 3700~3800 范围震荡活动，这是最完美的走势，继续向下打压盘面，因为这样最容易走出底背离信号，大家离抄底的时间则非常接近。节奏最好。


    第②种走法，走冲高诱多！继续向上小反弹，然后再砸回 3800 之下。这种走法应该是最无语的，出现顶背离的信号被拉长。套人不说，还浪费时间。


    我认为可能走第②种的概率大一点。


    所以，下周的操作策略如下：


    +   ①：逢高高抛做减法，第一次减法是在3822~3835 范围。第二次减法是在3849~3859 范围。


    +   ②：逢低再低吸回去，目前能给到的低吸试错范围是 3756~3766 区间。假如破了 3741 则另起方案。


    当然了，最关心的依然是大盘日线何时做'
