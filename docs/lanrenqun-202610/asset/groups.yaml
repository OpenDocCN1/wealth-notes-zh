    # 看完超级标 19，补一个我 X 3000 多粉、没开通创作收益，一个半月如何做到收入 5 万案例


    261006 副业 SC 精华

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/ba3fedc17e08378b605776cdb48ef9fb_0_0.png)


    小懒判断 | 适合手上没流量粉丝、做 X 号憋不出爆款的人；不适合冲创作收益分成和商单路线的——作者单月 3.2 万全靠 App 开卡拉新，X 只是引流入口。最值得关注：X
    发实操内容拉人+TG 群按进度答疑提高有效转化，这套组合 3 千粉就能跑通。坑在于奖励不全是现金，有股票还有卖出提现环节，且前期换方向、被封号都白耗了几个月。


    大家好，我是东逸，在 X 上主要分享海外基建：海外银行卡、U 卡、esim 等开通实操。


    这两天看了【超级标 19 X 中文 AI 自媒体】，以及小木那篇《X 自媒体：半年 5 万粉，变现 6 位数的经验分享》，很有感触。小木、鱼总，已经把内容、粉丝和平台收益做出了成绩。我最近这一个半月的收入，则是在
    X 上做海外 App 拉新、开卡实操和 TG 社群指导这条路上做出 5 万的成绩。


    我是 8 月下半月正式开始做海外 App 拉新，这个半个月收入接近 1.7 万元；9 月又做了'
