    小懒判断｜适合想看清东南亚电诈产业链底层逻辑的人——这篇借半岛台卧底采访拆了柬埔寨新电诈王邓丕兵的全链条：不碰诈骗端，垄断网络专线和人口输送两大生产要素当「包租公」，再靠
    50 万美元买勋爵头衔完成身份洗白。最值得警惕的是他的生意模式：法律上把自己搞得干干净净，出事双手一推说管不着租客。坑是以 为打掉大佬就完了，产业链高度模块化，今天打掉一个明天
    起来另一个。


    # 中东土豪赞助的半岛电视台又出爆款了！


    继上次到泰国监狱采访了 KK 园区幕后主脑余智江后，半岛电视台又采访了另一位电诈大佬——柬埔寨正恒集团的董事长邓丕兵。


    2026 年 10 月 10 日，半岛电视台专攻“东南亚跨境犯罪”赛道的《101 East》栏目，播出了一部 24 分钟的卧底调查纪录片。


    电视台记者伪装成菲律宾的电诈高层，拜访了邓丕兵。


    在记者秘密拍下的视频里，表面文质彬彬的邓丕兵语出惊人：“对面的警察局是我建的，警察的工资都是我发的……每次扫荡，'
  - '[PAGE 1]


    我都能提前收到消息，所以一直都没事……”


    他还热情分享了自己的生存法则：“我舍得给，别人赚10块钱8块进自己口袋，最后反而一块钱都捞不到，而我赚10块只拿2块，剩下8块都拿去打点关系……”


    说罢，为了向记者证明自己没有吹牛逼，他还当场叫来了一辆印有柬埔寨警方标志的车辆，并亲自驾驶着这辆“警车”，载着记者在园区里大模大样地兜起了风。


    晚上，还请记者到每小时 1380 美元起步的“嗨房”里 HAPPY，一边 K 歌一边肆无忌惮地吸 D......更多细节我就不多说了，反正我看完是一阵心惊肉跳，不寒而栗。


    那么，这个邓丕兵究竟是何方神圣，为何如此胆大包天？


    # 1


    原籍中国湖南常德的邓丕兵，和佘智江、陈志那些没文化的江湖草莽不同，是一名正儿八经的大学生。


    2003年左右，邓丕兵毕业于湖南科技大学物理与电子科学学院。


    大学毕业后没多久，邓丕兵就去了柬埔寨，据他的原话：“我是来找工作的。”


    他说的可能是真的，那时候的柬埔寨，刚刚结束了长达 30 年的严重动乱与内战。


    在讲邓丕兵的故事之前，我们有必要回顾一下当时的历史背景。'
  - '[PAGE 2]


    上世纪70年代中后期，柬埔寨的话事人是波尔布特，也就是恶名昭彰的“红色高棉政权”。


    在波尔布特统治期间，柬埔寨推行了堪称现代版“焚书坑儒”的极端政策，废除货币、消灭私有制，把城里人全赶去农村种地。


    这顿操作，直接把柬埔寨的经济和基础设施干回了石器时代。


    紧接着，1978年底，野心勃勃的越南在苏联的怂恿下大举入侵柬埔寨，试图建立“印度支那联邦”。


    一时间，各方势力集结东南亚，柬埔寨爆发了长达20年的战乱。


    直到1998年，波尔布特暴毙，人民党的洪森掌权，柬埔寨才恢复了和平。


    大乱之后，必有大治，但也往往伴随着野蛮生长的怪胎。


    2000年初，百废待兴的柬埔寨在洪森政府的领导下，开始疯狂招商引资，进行战后重建。


    为了吸引外资，柬埔寨推行了一项极为特殊的货币政策——允许本国法定货币“瑞尔”与美元并行流通。


    啥意思？


    在柬埔寨境内，可以直接用美元买东西，不用换成瑞尔！


    就是这个看似为了方便外商的政策，成了'
  - '[PAGE 3]


    日后东南亚黑灰产的“万恶之源”。


    在柬埔寨，所谓的外汇管制手段，统统不存在。


    这里不限制额度、不审查用途、更不追查来源。你今天提着几千万美元的现金进来，明天想转去开曼群岛的离岸账户，大门完全敞开。


    这种极度自由的货币政策，吸引了大量外资，外商们不用担心汇率暴跌贬值，赚了美金随时能安全撤回国内。


    但同时也为灰色产业（如电诈和地下洗钱）提供了生长的土壤。


    对电诈团伙和黑产们来说，这里简直就是“洗钱乐园”。


    他们把在全世界骗到的赃款（通常是加密货币或美元），直接注入柬埔寨，肆无忌惮地买地皮、盖大楼、买劳斯莱斯、去赌场一掷千金。


    钱在柬埔寨转这么一圈，就变成了合法的“房地产收益”或“赌场盈利”，然后再通过毫无管制的银行系统汇往全球。


    一个完美的黑灰产洗钱闭环，就这样形成了。


    而邓丞兵，正是踩着这个时代的节拍，来到了柬埔寨。


    刚到柬埔寨时，邓丞兵可能确实干的是正经事。他凭借着大学里的专业知识，在当地科技公司当 IT 经理。当然，这段经历有'
  - '[PAGE 4]


    没有美化，我们还不知道。


    很快，这个聪明的湖南人就敏锐地嗅到了“商机”。


    当时，柬埔寨的网络基础设施极度落后，而网赌和电诈偏偏是对网络要求极高的行业——他们需要高速、加密、稳定且能绕过国际网警监管的跨国数据专线。


    于是，邓丞兵利用自己的 IT 背景，成立了 Cambo Technology（柬埔寨科技）、Net1 等网络服务公司，通过提供跨境专线网络、服务器托管和网络防护，直接为各路电诈和网赌盘口搭建通信底层，从中收取高昂的专线租金与技术服务费。


    邓丞兵还看到了另一个“商机”——电诈园区不仅缺网，更缺人。


    特别是那些在前端负责“引流”（骗人）的底层业务员（行业黑话叫“狗推”）。


    这些人从哪来？


    这就涉及到了邓丞兵要做的第二个生意——跨国劳务招聘。


    他搞了一个叫 CamHR 的求职招聘平台。表面上，这是一家正规的招聘网站，打着“东南亚高薪诚聘客服、月薪上万、包机票签证”的幌子，专门收割那些急需用钱、想赚快钱的底层穷人。


    只要你投了简历，邓丞兵名下的中介公司就会提供“一条龙”服务：买机票、办签证。


    邓丞兵早就用钱买通了柬埔寨的机场和海'
  - '[PAGE 5]


    关，哪怕求职者拿的是假护照，一样能丝滑入境。


    因为一切看起来都很合法，所以求职者刚落地时，完全感觉不到任何异常，甚至会觉得这家公司真气派，一出机场大门，还有专人专车在出口接应。


    然而，一旦上了车，护照和身份证就会被以“办入职”为由没收。车门直接焊死，迅速拉到几百公里外高墙铁丝网环绕的电诈园区，按人头卖给各个诈骗盘口。


    等求职者们反应过来，面对的已经是端着 AK47 的武装保安。


    通过垄断电诈的“网络基建”和“人口贩卖”这两大核心生产要素，邓丞兵完成了资本的原始积累。


    但他并不满足。他深深知道，在这个弱肉强食的丛林里，没有政治保护伞，再多的钱也只是别人砧板上的肉。


    2016 年，邓丞兵正式加入了柬埔寨国籍。


    这是为下一步大棋扫清障碍——他想获得柬埔寨的“勋爵”头衔，打入顶层的政商圈子。


    按照柬埔寨的法律，申请人不能是外国人。


    取得国籍后，下一步就简单了，直接给钱就行。


    在柬埔寨，本国公民只要一次性向政府捐赠 50 万美元，就能获封“勋爵”头衔，这对邓丞兵来说，就是按根毛的事儿。'
  - '[PAGE 6]


    买下“勋爵”头衔后，邓丕兵彻底完成了身份洗白。他不再是一个搞灰产的 IT 男，而是可以堂而皇之拜会柬埔寨高层（包括前首相洪森）的“爱国华商”。


    有了这些特权，邓丕兵开始接手真正的“大项目”。


    2017 年，他成立正恒集团，拿下了国公省七星海特区一块 200 公顷（含 1.9 公里海岸线）的黄金地皮。


    这个七星海特区大有来头，一级开发商是中国的天津优联集团（UDG），这里本是“一带一路”的重点工程，承载着建设国际机场、深水港口的大项目。


    邓丕兵极其鸡贼地借用了“一带一路”的国家级光环，将自己的“七星海·长湾”项目包装成集五星级酒店、免税店、游艇码头于一体的“世界级滨海文旅度假区”。


    为了装得更像，他甚至雇佣了中国中铁等大型国企来承建部分工程。


    但房子盖好后，他根本没打算搞旅游业。


    赚惯了快钱的邓丕兵哪受得了这种回报率又低、投资周期又长的项目。


    他把这些写字楼和宿舍，以全柬埔寨最贵的价格，统统租给了电诈和网赌团伙，并为他们提供专业的加密专线网络和武装安保（园区外围部署约 300 名武装保安和高墙铁丝网，严禁底层员工出入），并打通当地警方关系提供防扫荡庇护（邓丕兵在视频里声称自己在警局和网监里都有眼'
  - '[PAGE 7]


    <!-- no content -->'
  - '[PAGE 8]


    然而，这只是在自欺欺人。


    第一个跳出来戳穿他真面目的，是英国人。


    很多人有种错觉，以为东南亚电诈只骗中国人。其实，这帮法外狂徒早就实现了“全球化”。


    2023 年底，英国外交部费了九牛二虎之力，从东南亚（包括长湾园区）解救了多名被绑架虐待的英国公民。从这些受害者口中，英国政府得知了正恒集团的黑幕。


    随后，英国政府毫不手软，依据《全球人权制裁条例》，直接将正恒集团列入了制裁清单，对其实施了资产冻结，并禁止任何英国公民或企业与其发生资金往来。


    制裁发生后，正恒集团公开发表声明予以了否认，辩称自己“仅负责地产开发与景观维护，无法控制租客的行为”。


    虽然英国的制裁未能立刻阻断园区的运转，但从后来的发展来看，它成为了加速邓丞兵“黑产帝国”崩塌的第一张牌。


    在英国的施压下，园区的内部开始动摇，原本在长湾经营赌场 VIP 厅的港股上市公司“世纪娱乐国际控股”于 2025 年 4 月底宣布撤离。


    这些都是前菜。


    真正的风暴，发生在 2025 年底至 2026 年初。


    2025 年 11 月 12 日，邓丞兵结识了十几年的老乡、妙瓦底 KK 园区的主脑余智江被'
  - '[PAGE 9]


    正式从泰国引渡回中国受审；紧接着，2026年1月6日，柬埔寨另一电诈巨头，太子集团的创始人陈志被捕，同样被押解回国；与此同时，柬官方也对电诈展开了全国大清剿。


    2026年2月，执法部门突击搜查了长湾园区，查封了多栋涉诈建筑并抓获部分嫌犯。


    2026年9月，首相洪玛奈亲赴国公省视察长湾现场并指示彻底深入调查。


    随着缅北四大家族的覆灭，中国政府对电诈的态度已经很明朗，就是要重拳出击。


    柬埔寨现在才开始彻查，也是迫于压力。


    这些年，东南亚电诈早已不再仅仅针对中文群体，开始大规模向欧美国家延伸。


    据统计，东南亚电诈仅在2024年就给美国造成了超100亿美元的巨额损失，多国公民（包括美国）沦为电诈受害者。


    在英美看来，连吊撒人都敢动，这不倒反天罡了么？


    所以美国开始对“电诈重灾区”柬埔寨启动制裁，这种国际制裁是致命的，将直接威胁到柬埔寨的离岸金融体系、外币结算通道及国际投资环境。


    隔壁泰国在2025年底的柬泰边境冲突中，对柬埔寨发动了跨境军事打击，顺道炸了奥多棉吉省奥斯玛奇度假村等6处赌场。


    这让柬埔寨政府意识到，电诈已经不再仅仅是灰黑产，而是成了损害国家形象、威'
  - '[PAGE 10]


    胁国家安全的政治隐患。


    不过，就在大清算到来的前夕，邓丕兵早已凭借着多年经营的顶层情报网络，提前跑路了。


    据邓丕兵的得力助手洪雷透露，早在 2026 年 1 月，太子集团陈志被捕前数日，就有人建议邓丕兵离开柬埔寨避避风头。


    出入境记录显示，2026 年 5 月底，邓丕兵仓皇逃离了柬埔寨，至今下落不明。


    但逃亡，并不意味着胜利。


    今天的电诈，已从早期的单一诈骗手段，演变为集人口贩运、强迫劳动、公权力腐败和跨境洗钱于一体的综合性跨国犯罪体系。


    诈骗团伙利用虚假投资、假冒公检法、“杀猪盘”等手段，每年在全球掠夺数百亿美元资金，导致无数受害者多年积蓄瞬间清零。


    在园区内部，未完成业绩 KPI 或试图逃跑者遭受到极其残忍的虐待，甚至人体器官贩卖，这些都是严重侵犯人权的滔天罪恶。


    随着中、柬、泰及英美联合打诈机制的常态化，邓丕兵的结局基本已经注定。


    但是，电诈从来就不是一伙人从头骗到尾，它的产业链早已高度模块化，每个环节都靠无数独立外包，犯罪窝点遍布全球各地，极易转移，今天打掉一个大佬，明天就崛起另一个大佬。


    打击电诈之路，仍然漫长。'
  - '[PAGE 11]


    绝大多数人只盯着眼前的工资，却不知道一次远在中东的冲突、一次降息的决议，就能在 一夜之间洗牌普通人的财富。


    看懂宏观，是为了在周期切换时，不被当作代价。


    如果你认同这种“抬头看路”的长期主义，欢迎围观我的个人情报智库：【懒人专属群】。


    圈子已稳定运行7年。我们每天利用 Python 爬虫与大模型算力，过滤全网最顶级的政经内参和搞钱风向标，做你最冷酷的“外部大脑”。


