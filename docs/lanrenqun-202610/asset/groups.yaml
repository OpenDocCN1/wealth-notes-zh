  - '[PAGE 1]


    楚了，不管是中秋还是其他时候，只要是对节日送去问候祝福有不太清楚的各位朋友，都可以依葫芦画瓢，所以本文长期有效，绝对的全网独家干货。


    一顿套餐的钱换一篇和大佬结交关系深度链接的指南，这个投资绝对划算。


    先开门见山的说下本文主要内容：


    # ## 一、中秋节到了，抓紧行动起来


    为什么中秋节需要送去心意祝福？对不同职场群体分别有什么好处？


    在职场上，许多决策是通过非正式渠道传递的


    # ## 二、送心意送祝福前一定要明白的道理


    # ## 三、送心意送祝福要送什么人？


    # ## 四、中秋送心意和祝福实操


    # ## 五、其他重要注意事项。


    # ## 一、中秋节到了，抓紧行动起来


    为什么中秋节需要送心意祝福？对你自己有什么好处？


    在职场上，许多决策是通过非正式渠道传递的，大家都懂一个道理，职场上，人越多的会议越不重要，这虽然是个段子，但是说明的道理是深刻的，真正有价值的事情一开始都是极少数人参与。


    具体到我们工作中，就是一些关键性的事情，都是少数领导参与，一些大佬可能会提前向关系较好的下属透露一些重要信息，'
  - '[PAGE 2]


    或者在你遇到困难时，给予你特别的帮助。


    平时里领导们大佬们对你有帮助的，这个时候就应该有所表示了。哪怕没有帮助，能够不卡你让你不舒服，都算好人了，我们要反过来想想是不是这个道理。


    所以，中秋节送问候和祝福不仅是为了表达感激，也是为了在未来的工作中获得更多的信息和资源支持。


    这种无形的资本能够在你遇到工作难题或职场瓶颈时，为你提供及时的援助。甚至消极一点想，如果真遇到小人了，舍财免灾那也是不得不做的事情了。


    所以，在此我非常真诚的建议大家，不管是上进的还是躺平的，不管是遴选调动的还是本地发育的，你都需要适当向大佬表达自己的心意，因为这是人性，学会在实践中理解人性利用人性，才能实现想上进的进的更快，想躺平的躺的更爽，想跑路的跑的更顺。


    只有不断提高自己的段位、丰富自己的人生，你才会对官场、对人性、对人生，拥有不同寻常的体验和超乎凡人的理解，也才能真正提升自己的能力，不断应对未来人生可能出现的各种复杂局面。


    学会送礼，学会和上位者进行工作之外的沟通交流，这是我们成长成熟的重要一步，否则工作这么多年，要是连人情往来的门槛都没摸到，岂不是太可惜了？


    有些朋友说，我不想当官不想进步，我年轻我躺平，我不求上进，所以我不想送礼。'
  - '[PAGE 3]


    这个思路对不对呢？想想这个思路是不对的，你一个小年轻，在一个公家单位，公然表现出想躺平的思想，这是犯了大忌。


    大家注意，只要我们身在组织，除非你是一把手拥有绝对权力，否则都是人在屋檐下不得不低头的状态。送礼表面上看是你掏钱给了别人，但实质是你向大佬示好，你向他表示服从，他会用他的权力来回馈你的服从，其实你会收获更多。


    第一，提拔提前一步。职场，工作关系往往不是单纯的绩效考核和能力竞争所能决定的。


    更重要的是，你能否在职场中树立良好的人际网络，是否能得到上级的青睐，是否能通过与大佬、同事间的互动获得更多的信息和资源。


    而中秋节作为一种带有浓厚情感色彩的节日，恰好是与大佬进行人际沟通的最佳时机。你和大佬搞好关系，不用说，提拔的时候必然提前一步，至少能够提前给你消息给你时间活动。


    有句话叫平时不烧香、临时抱佛脚就是这个道理，你平时要和领导搞好关系，平时在他心目中有地位有分量有好处能想到你，关键时刻你才不至于慌神。


    而平时关系的维系，主要就是靠这些逢年过节的关键性契机去维系了。


    第二，躺平有人默许。躺平这件事情，你拿到台面上说人人都不允许的。'
  - '[PAGE 4]


    但实际工作当中，对于大佬来讲，他手下只要有那么两三个人的话，具体的分工一定会是有所侧重的。对于那些不懂事的牛马来讲，一定会分配更多的工作，对于那些懂事的，知道如何进行人情往来的人，他一定会安排的工作就相对偏少一些，这是必然的。


    所以，你要想躺平，你必须跟大佬搞好关系。你不跟他搞好关系，想一上来就硬躺，这是躺不了的。


    这种送礼并不是为了提按要求，而是通过这样的方式，明确表达自己对大佬的尊重与感谢。大佬自然会根据你的态度和行为来判断是否给你更多的关照。


    比如送送礼，聊聊家常，通过简短的嘘寒问暖，领导了解到你家里有老人在吃药，家里有小孩需要照顾，你也不需要过多讲你要组织通融，只把情况讲到位了，领导听懂了，你心意表达到了，人心都是肉长的。


    通过送礼，建立起情感共鸣，增强大佬对你的同情理解，知道你的实际困难，从而在日常工作中减少不必要的压力和麻烦。中国人很多事情是讲默契的，心照不宣的，你表示到位你的心意，领导自然懂得。


    # 第三，犯错有人包容。


    我们在职场工作，任何人都会犯错，尤其年轻人，成长都需要过程。我想一想当年刚工作的时候，确实捅过很多篓子，弄过很多错的事情。'
  - '[PAGE 5]


    <!-- no content -->'
  - '[PAGE 6]


    但是人都是有多面性的，再厉害的大佬也是人，也是正常人，也有放松的平和的一面，也有自己的软肋。


    千万别把领导看的太过于威严了，自己要放松点，自信点，我们能够和大佬建立起正常的私人关系。


    二是前期铺垫要到位，大佬喜欢主动和他沟通的下属。


    工作要做在节日之前，至少你和大佬要有一定程度的思想和生活交流，节前一段时间，一定要找一次机会给大佬汇报一次工作，汇报完了工作对大佬的关怀表示感激，对大佬帮助自己成长表示感谢，让大佬觉得你是发自内心的感谢他，凡是都有个过渡期，这样再进行送礼就不会显得突兀。


    三是细水长流看长线，看清谁适合长期主义交往。给大佬送礼要善始善终，不要半途而废，更不能打肿脸充胖子，送礼一定要估摸一下几点：一是这个人值不值得交往？


    二是这个人 right here? 因为中秋送过，过年还要接着送，只要他人还在位，还能够给你帮忙，你就要一直送到底，给足对对方的尊重，所以一定要根据自己的荷包情况来计算，好在如果只是正常维护关系，倒不需要太多钱，等到遇到关键时刻的时候，我们再进行额外补充。


    # 三、送心意送祝福要送什么人？


    送哪几个人？'
  - '[PAGE 7]


    <!-- no content -->'
  - '[PAGE 8]


    为中间人后来又和主要领导拉近了距离。


    所以在后期遴选报名的时候，由于提前沟通顺畅，非常容易就得到了盖章签字，并且由于领导提前知道他的想法，并且沟通得当，所以给他安排的工作也相对轻松，方便他遴选复习。


    三是单位的主要领导。上面一段也说了，如果你是办公室工作，那么经常接触一把手就好说，如果不经常接触一把手，那就先和分管领导搞好关系，都是一步一步来，分管领导搞好关系了，愿意给你带路或者给你说好话、愿意进一步引荐你和一把手一起吃饭了，大家在私下场合有接触了，工作上也有交流了，后续才好有由头更进一步。四是送曾经帮助过自己的人。


    我们记住一点：曾经帮助过我们的人，一定是一个热心肠的人，只要我们有感恩之心回馈他，他大概率还会继续帮助我们，想继续把他的资源给我们使用。


    所以对于这样的人，带点过节的礼品去他家里简单坐坐，汇报一下最近工作情况，回忆一下过去的经历，再感谢他吹捧他一下，情绪价值也会拉满。


    基本上来说，送礼最多四到五个人就差不多了，如果交际面窄需要维护的人也少，基本上部门大佬分管大佬也够用。如果交际面广喜欢布局谋划长远利益关系，那么最多加上点其他关系不错有一定能量前途的同届兄弟同事啊，校友师兄师姐老乡啊就差不多了，这样的人最多也就是一两个。'
  - '[PAGE 9]


    <!-- no content -->'
  - '[PAGE 10]


    这种情况下，高档烟酒铺路就是必须了，比如茅台五粮液沪州老窖、中华黄鹤楼和天下等等，再加上其他一些要表达的心意了。


    接下来说怎么送的问题。对于自己准备好的礼品，一是要包装好放好，千万不能有包装袋破损、东西掉出来等低级问题，会显得比较神经大条办事不太靠谱。


    然后记得买点很大很厚的黑色袋子，外面包一层结实的袋子，要不透明的，可以自行网购黑色加大加厚塑料袋，把礼物完全挡住根本不知道是啥。


    只要你想送，网上可以装整箱茅台的大号购物袋都有，大家自己多找找，多提高提高专业姿势水平。把东西准备好之后，就要尽快找机会送出去，最好是节前一个月开始准备酝酿，节前半个月到一周前的时间送出去（所以我们今天的发文非常及时，让大家有充分时间去准备，今天阅读这篇文章的朋友们，你们都是有心人，你们未来一定能成功），成功把东西送出去。各位给大佬第一次送礼，肯定是最难送的。


    第一是你心理上很难过这一关，非常不好意思，而且大佬肯定也是推辞最厉害的，通常第一次特别难送，不过万事开头难，第一次成功了，以后会越来越习惯。


    所以该给大佬打电话要打电话，多多沟通，搞清楚大佬家庭地址，一定要厚着脸皮多和大佬软磨硬泡几次，你放心，他肯定会拒绝你至少三次以上。'
  - '[PAGE 11]


    <!-- no content -->'
  - '[PAGE 12]


    就不需要点破了，慢慢领导和你熟悉了就好办了。


    二是注意保密，不要留痕。一切行为可以现场沟通可以电话沟通，但是千万不要微信上留下任何痕迹，也尽量不要选择快递邮寄。直接打电话联系，直接到家里拜访或者送到大佬车上，不在网上留下任何痕迹，否则大佬大概率不会收的。


    万一非要邮寄，直接邮寄到大佬家附近的菜鸟驿站即可，给大佬打个电话让大佬知道有这回事，千万不要去催大佬签收，或者问大佬具体收到没有这样的话，这些事情同样是心照不宣即可。


