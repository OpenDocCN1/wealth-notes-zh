    # 国产榴莲，为什么不太可能“把价格打下来”？


    261028

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/133e4bbe6c8e4e68a6a23e42870e312e_0_0.png)


    ![](img/133e4bbe6c8e4e68a6a23e42870e312e_0_1.png)


    > 小懒判断 | 适合环磨农产品生意、区域产业和差异化定位的人；不适合想听"榴莲自由"利好消息的——结论恰恰相反，国产占比天花板只有15%。最值得看的是榴莲的"双可以贵"前提：自然界无平替+用户价格非敏感，于是国产不拼价格拼树上熟、错峰上市、文旅体验三条路。坑在于拿"国产化=降价"的阳光玫瑰剧本套榴莲——土地禀赋决定拼不过规模时，硬打价格战是自杀。


    今天我们要说的是，最近在网上热度很高的国产榴莲。最近两个月，你可能在网上刷到过这么一个消息，说“国产榴莲大规模上市，马上就要实现榴莲自由”。


    其实，类似的消息前两年就已经出现，国产榴莲的产量也确实在提高。但是，它好像没有出现预期中的大降价。即使降价，幅度也有限。而且降价的主要原因是东南亚的供应量增加，跟国产榴莲关系不大。而且假如你深入观察国内的榴莲产业，也许会发现，那种“十元三斤”的情况不太可能会发生。


    提起进口水果国产化，我们最常听到的结果之一就是，“把某某水果的价格打下来”。最典型的是阳光玫瑰，短短两三年的时'
  - '[PAGE 1]


    间，价格几乎是抹掉一个零。尽管国产和进口的品种，在口感上可能有一些差异，但在这么大的价格差距面前，国产水果的优势几乎是碾压级的。


    但是，榴莲的情况不太一样。而且透过国产榴莲产业，我们也许能发现一些有点特别的商业逻辑。前段时间，零售咨询专家黄碧云老师，专门去调研了海南和云南两地的榴莲种植基地，带回了很多一线的观察。接下来，我们就展开说说。


    首先，**为什么说国产榴莲不太可能把榴莲整体的价格“打下来”？最重要的原因是，产量制约。**榴莲这个东西对环境很挑剔。它需要温暖湿润的气候，对海拔、温度、水分等条件都有要求。中国适合规模化尝试种植榴莲的区域并不多，最主要的区域集中在海南南部，以及云南省内气温相对高的地方。


    ![](img/133e4bbe6c8e4e68a6a23e42870e312e_1_0.png)'
  - '[PAGE 2]


    图片注释：云南省红河州金水河镇榴莲种植基地根据一些机构的测算，2025年，国产榴莲在所有榴莲销售里的占比，还不到1%，还有机构说只有0.2%。当然，这里有种植技术不够成熟的因素。但即使把国内所有种植区的产量跑满，根据一些从业者的估算，国内能产出的榴莲，也只能占到国内市场销售总量的15%。国产榴莲很难单纯依靠扩大种植面积，就达到东南亚主产区那样的供应规模。更何况，东南亚那边也在扩大榴莲产能，以后他们的榴莲也许会一年比一年多。


    你看，说道这，就引出一个问题。既然这个账本提前就能算清楚，国产榴莲在价格和产能上不占优势，那么，我们又为什么要努力种植呢？它的独特优势到底是什么呢？


    这就要说到，榴莲这种水果所独有的一个逻辑了。这就是，它几乎没有任何的“平替”，导致它成了水果里面，价格敏感度相对低的那一类。首先，市面上的多数水果，都有一个大致的“平替”。你看，多数水果的味型，都是“酸甜口”。这种水果贵了，我可以买另一种。唯独榴莲，你在自然界几乎找不到第二种味道相近，口感相仿的东西。确实，橙子跟柑橘有区别，苹果和鸭梨也有区别，但是，任何两种水果之间的差异，都大概率不会有这种水果和榴莲之间的差异大。


    而缺少平替，就让这个东西有了第一个“可以贵”的前提。其次，因为榴莲本来就贵，即使相对便宜的品种，比如泰国金枕、越'
  - '[PAGE 3]


    南金枕、越南干尧，买一个也得 100 元出头。对一些买榴莲的人来说，这么多钱都花了，也不在乎再多花一点。因此，在这些品种之上，还有更贵的猫山王、马来西亚黑刺，一个大概能卖到两三百元。


    换句话说，榴莲这个水果，拥有很多“价格非敏感”受众。这就让它有了第二个“可以贵”的前提。这两个前提叠加在一起，就意味着， 国产榴莲有机会走跟其他水果不同路线。它也许可以不用比拼价格，有机会走“精品化”路线。注意，只是机会，毕竟，“可以贵”只是前提，关键是你得想办法让这个东西“值得贵”。


    那么， 国产榴莲怎么让自己“值得卖个好价钱”呢？根据黄碧云老师的观察， 国产榴莲正在做三方面的改进。


    # 第一，做“树上熟”，把新鲜度变成产品优势。


    ![](img/133e4bbe6c8e4e68a6a23e42870e312e_3_0.png)'
  - '[PAGE 4]


    图片注释：云南“树上熟”榴莲


    什么叫树上熟？简单说，就是让榴莲尽可能在树上自然成熟。而这类榴莲，甜度会更高，榴莲的那种“异味”会更少。注意，**进口榴莲也可以实现树上熟，但同等品质的成本会更高，毕竟后续需要长途运输，采摘越晚，对后续运输效率的要求越高。**而国产榴莲距离我们更近，因此，就有条件用更低的成本，把树上熟的程度做得更充分。


    过去，我们习惯用产地和品种给水果定价。国产榴莲如果能够在成熟度、风味和新鲜度上形成稳定的优势，就有机会让消费者为更好的体验付费。注意，这不是说所有的国产榴莲都一定是“树上熟”，只是一部分。


    **第二，做错峰上市，避开最拥挤的竞争时段。**进口榴莲的旺季，主要集中在5月到10月。假如国产榴莲也在这个时间上市，就可能会和进口榴莲发生正面竞争。而现在，一些国内产地正在尝试错峰产出。比如，云南，种植者和研究人员正在尝试筛选、培育更耐寒的品种，希望未来能把部分上市时间延长到11—12月。很明显，假如你能在淡季供应品质稳定的榴莲，自然能卖出更高的价钱。


    **第三，做文旅，把卖一颗榴莲变成提供“一整套体验”。**一直以来，都有不少榴莲爱好者，每年到了榴莲季，会专门飞到马来西亚，体验新鲜的树上熟榴莲。你想想，这些人花钱买的是什么？当然有榴莲本身，'
  - '[PAGE 5]


    但他们还愿意为产地、旅行，以及新鲜现吃体验付费。对他们来说，吃榴莲甚至可以成为一趟旅行的主要目的。这个模式在国内的榴莲产地，也有机...也有机会实现。


    比如，消费者来到云南，不只是去超市买一颗榴莲，而是走进果园，看看榴莲怎么种、怎么成熟，再现场采摘、打开品尝。原本一次水果消费，就有机会变成一趟包含美食、观光和知识体验的旅行。况且，国内的榴莲产地，比如云南和海南，本来就有丰富的文旅资源，它们或许可以嫁接...到这个“榴莲之旅”里。一旦消费者愿意为了体验来到产地，消费就不再局限于一颗榴莲。住宿、餐饮、交通和当地其他旅游项目，都可能从中受益。


    ![](img/133e4bbe6c8e4e68a6a23e42870e312e_5_0.png)


    图片注释：云南红河州金水镇的榴莲苗木换句话说，国产榴莲要做的，不是简单地把进口榴莲换成国产榴莲，而是通过新鲜度、上市时间和产地体验，找到更多创造价值的空间。前面说的是方向，那么，国产榴莲现在做到哪一步了呢？我们可以看看两个主产地的情况。'
  - '[PAGE 6]


    首先，海南正在从种植探索走向批量供应。目前，海南的榴莲种植面积，大概有5万亩，其中约1万亩进入挂果量产阶段。之后，海南榴莲将逐步进入批量上市。但海南面临的主要挑战之一，是台风风险。榴莲树需要多年生长才能挂果，如果遇到强台风，前期投入就可能受到影响。根据黄碧云老师在当地的调研，一次台风大概会影响海南10%左右的榴莲产量。因此，当地一直在通过品种筛选、果树矮化和栽培技术，尽量降低这种风险。其次，另一个主要产地，云南，也正在寻找更适合当地的品种。


    云南的情况与海南不同。当地有适合榴莲生长的热区，但冬季可能出现低温，部分区域还面临干燥等问题。因此，当地研究机构正在通过分散试种、集中试验和嫁接育种，逐步寻找更适合云南气候的品种。这些探索尤其关系到云南榴莲能否实现错峰上市。只有品种能够经受低温等环境考验，后续的规模化种植才能有更可靠的基础。


    根据黄碧云老师的调研，云南部分苗木企业已经有二三十万株尚未下地的苗木存量，从小苗到不同树龄的结果苗，都有相应的培育和供应。与此同时，西双版纳和红河谷的一些地方本来就是橡胶种植区。当地正在探索在橡胶林里套种榴莲，通过调整橡胶树间距，为榴莲留出生长空间。榴莲幼树生长期期间，农户还可以套种凤梨、木瓜等作物，争取在榴莲尚未结果时获得一些收入。这也能缓解榴莲生长周期太长而'
  - '[PAGE 7]


