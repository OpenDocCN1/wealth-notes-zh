    这些历史类比的案例发生后市场运行的路径也形态各异，恒科八次 RSI 相对强弱指数跌至 26 或以下的先例中，2024 年 1 月 17 日那次（-2.86，监管与增长担忧驱动）在幅度和驱动因子上与今天的盘面最为接近，那时，恒科在随后约
    10 个交易日继续走弱，之后才展开持续反弹，到了第 37 个交易日反弹的幅度达到了+15.3%，到了第 60 个交易日反弹则回落至 6%左右，但依然为正收益。


    当然，历史并不简单重复，但是市场价格过度反映情绪而非基本面事实往往给交易员创造交易性机会。至于 2025 年 4 月特朗普解放日之后的 V 型反弹，那时 5
    个交易日即反弹了+14%，因为特朗普 TACO；2022 年 10 月底的反弹，也就是我们发表的那篇著名的《洪：买！买！买！》的报告的翌日起的 40 个交易日内，指数反弹了+47%，显然是因为政策转向发出的明确信号而致。而
    2022 年 9 月 30 日和今天这类“磨底型”下跌，如果缺乏明确的政策信号，RSI 在低位徘徊却缺乏催化剂，那么反弹的力度显然将不及上述的这两次。


    今天，期权市场上指数大型成分股的看跌期权成交量达到 20 日均值的 2 至 3 倍，说明对冲需求集中释放，也说明市场的情绪逐步运行到了冰点。


    那么，市场何时才可以真正见底，并展开一波反弹。我们检验了几个指标。


    首先，我们看到恒科经历了最近的一轮抛压之后，已经运行到了下行趋势的底部区域（图一）。同时，从价格结构来看，抛售的波浪已经开始进入了尾声阶段（wave count），而恒科今天的蜡烛也跌穿了布林线的下轨。


    由此可见，我们把今天的盘面称之为过去三年最严重的抛压之一毫不为过，并与开篇的统计数据相呼应。


    ![](img/15bf6e93caf66623bfb03dbc8ec2c973_3_0.png)


    我们还可以看到，韩国半导体的出口价格还在继续上升。一般来说，价格的上涨显示需求依然大于供给，而最大的 AI 芯片公司未来 18 个月的产能已经被订购一空。


    由此，我们很难得出确切的结论，称 AI 半导体的需求强势不可持续（图二）。尽管如此，我们追踪的半导体周期继续从高位下行。


    这个现象我们在六月中旬发下半年展望报告的时候，已经为读者预警过了，也是我们预测半导体泡沫在下半年破灭的重要论据之一。如今，半导体泡沫如期崩裂，我们试图在这次下行的轨迹中继续能够在更短的时间窗口里寻找交易性机会。


    在如此动荡的市场里，我们在试图成就这种看似几乎不可能的功业。


    我们的职业素养呼唤着我们的努力，毕竟，还是有很多散户投资者套在了六月中的半导体泡沫高位之上。


    ![](img/15bf6e93caf66623bfb03dbc8ec2c973_4_0.png)


    最后，我们的港股领先指标显示筑底的时间窗口理论上将出现在 11 月中前、12 月中和明年的一月中（图三）。当然，这种统计数据模型并非万无一失的。


    但是参考当下的市况和市场叙事，这些模型预测的时间节点将成为交易员重要的观察窗口。


    ### 图三：港股的领先指标。


    ![](img/15bf6e93caf66623bfb03dbc8ec2c973_5_0.png)


    总结一下：港股，尤其是恒科最近的抛售潮是统计意义上非常显著的小概率尾部事件，其发生的概率大约在 1% 左右。


    也就是说，一年里大约只能看到一两个这样的盘面。尾部极端事件的概率小预示着市场情绪的宣泄通过抛售潮反映。


    这个时候资金的夺路出逃与基本面无关，与情绪和资金面的变化密切相关。


    恒科的技术面已经严重超卖，任何一个小的正面的消息，甚至是任何消息，都可以成为短期反弹的借口。


    随着 11 月的临近，技术筑底反弹的时间窗口将逐步打开。当然，如我们在上一篇报告《洪题：可以抄底了吗？》里指出的，现在依然是左侧交易。


    而左侧的波动尤其大。而我们描绘的是价格运行的路径和趋势，至于如何把握，那么则是每个交易员见仁见智的问题。


    祝交易有所斩获。


