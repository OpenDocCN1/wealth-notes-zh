    你看到的法国骚乱、德国右倾、日本军国主义化、英国沉沦，都是这种经济体没落死亡的表象。


    他们各自有各自应对危机的手段，但大趋势是注定的。英国不愧是老牌搅屎棍，手段的确要高超很多，暂时看不到表面的混乱，但这不改变其根本。


    下一步你将会看到全球类似经济体的整体崩塌。包括以前吹得神乎其神的“小而精”经济体，北欧、荷兰、韩国、台湾地区即将迎来的都是一个前景：竞争力消失，然后在大国风云之中一个浪头拍过来就淹死在海里。


