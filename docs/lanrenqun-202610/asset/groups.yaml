    \ 26 年的 3 月份按了暂停键。\n\n按现在理解，这个新词业务还可以做，就是比之前难度大了，成本也高了，现在大家都会玩趋势新词，还有更给力的 AI 编程工具提效，各种监控工具也满天飞，新词新站只会越来越卷，因为这个跟当时的淘宝业务如出一辙，新词业务反馈快门槛低回报高，拼的是谁更愿意花时间执行。没有谁比谁聪明，只要付出的时间足够多，把散落在各处的趋势挖到，做足够多的新站也可以赚到可观的收入。再一个方向就是老词大词赛道，上面说了只要持续买外链，其实就跟玩游戏一样，氪金玩家基本上一直会站在排行榜的顶端，如果氪金玩家再勤奋一些，免费氪肝玩家连车尾都看不到。\n\
    \n还有社媒方式和投流方式起量，社媒可以加很大的杠杆，投流要算好长期回报率跟电商逻辑差异挺大。这两个方式还没太多的尝试，观察到的情况看到社媒的杠杆真的是爆发性的，可以四两拨千斤，目前国内科普社媒起量还没怎么看到。\n\
    \n写着写着感觉有点跑偏了，变成业务复盘了，我们再回到主题，想赚 1000 万的钱就不要去做赚 100 万的活。\n\n对于出海 AI 工具站这个业务，大部分人的目标是月入千刀，然后万刀，然后继续换刀前面的单位，但是月入百万刀可能是大部分人望尘莫及的目标了。\n\
    \n千万刀之前拼的是执行力，新词是成本最低的实现方式。十万刀靠的不仅仅是执行力（小概率的超级大词除外），拼的更多的是生产效率、生产工具以及人脉资源的叠加，深圳以及周边的独立开发者圈子高质量的信息大概率要比内地的密度要大的多，多出去交流可能别人一个提点要比埋头干少走很多弯路。持续稳定的月入十万刀到百万刀，这个量级可能继续用之前的单点方式很难达到（如买买外链、做做新词），不是说不可能，而是难度大很多，不再是简单的复制\
    \ 10 个万刀的站或者做 100 个甚至 1000 个站。\n\n选对入场时机和生态位可能比复制 100 个万刀站要轻松，而且有复利，我大概印象是我 25\
    \ 年 5 月从生财 AI 实验室撤回西安后，apimart 好像才开始进入萌芽状态，不确定时间是否准确。大概是 8、9 月份，apimart 也离开实验室出去租了独立办公室，然后一飞冲天，现在我看到很多和\
