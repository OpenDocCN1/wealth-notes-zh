  - '[PAGE 2]


    ![](img/6c55f3991909b3d2e76b6747c5b208b5_2_0.png)


    # Le Journal du Dimanche


    # LA FRANCE S’EMBRASE


    # Le chaos


    > ÉMEUTES, INSURRECTIONS

    L’ultragauche à la manœuvre


    > 150 POLICIERS BLESSÉS, PILLAGES

    Le bilan d’une journée apocalyptique


    这些版面和表述夺人眼球，但并不一定是对事件的全面反映。


    法国记者工会 SNJ-CGT 10 月 19 日发表声明指出，80 万人的游行以和平为主，口号里有政治分析也有幽默，诉求是社会公正；动手打砸的只是其中的“quelques
    milliers de personnes”（几千人）。但新闻网站和 24 小时新闻台循环播放的，大部分都是抢劫、利摩日市政厅起火和波尔多省长官邸被砸的画面。同时，警察对和平示威者使用催泪弹和警棍的做法则“被略过”。


    文化周刊《Télérama》对国家电视台 France 2 周日晚间新闻的批评也类似： France 2 和新闻频道播出了“暴力的画面”，却没有去解释这一天为什么会失控。'
