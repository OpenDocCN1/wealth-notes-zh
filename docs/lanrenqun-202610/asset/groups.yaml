    # 科技股与铜的逻辑


    261027 丁辰灵星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/145860dd0e33eec97e7c98f097261489_0_0.png)


    > 小懒判断 | 适合手里拿着科技股或铜、正在纠结要不要割肉补仓的股民；不适合想抄底暴富的短线客。最值得关注的是洛阳钼业那笔账：7元涨到28元再跌回14元，利润预期却是2024年的145%增长，估值贵不贵一目了然。坑在于灵哥也没给买入信号，只教你看PE和赔率，别把分析当成抄底指令。


    2026/10/27 17:00 TIM提问：灵哥，上周金融论坛开会就说了，防范输入型风险。


    所以现在就是保沪指，沪指的下跌就有限。科技股会不会因为之前一年涨20倍，现在为了释放风险也正常。国产链，之前一百倍PE，现在大多跌到了50多倍，再跌跌后算上27、28年增长，这估值就下来了，所以短时间科技股只会反抽一下，不会再有大的反弹，甚至都不能回到9月那个位置去？


    你分析的很好，不愧是多年的老会员。你自己其实是有答案的，即当今天有业绩的科技股跌回到一年前价格的时候，PE是下来的。给大家一个例子吧，比如紫光，相当于过去六七年都在当前这个价格附近，但当年这个价格的PE是多少，现在的PE'
  - '[PAGE 1]


    是多少？


    大家可以自己去查一下。是跌下来的赔率高，还是上涨在高位的时候的赔率高，大家都是受过教育的，都是看过巴菲特的，很容易算得出。


    但现在下跌速度那么猛，情绪上肯定是受干扰的。科技股当前的问题，和海外对中国科技做空，和机构情绪等也有关系，具体昨天也写了帖子。


    现在大家需要的是心定和做好仓位控制，然后看何时能放量到右侧，这是做交易的原则。做投资角度来讲，最终企业的市值还是匹配其成长，和其创造出来的价值，就像村龙这样的公司，究竟有没有足够的信仰能拿住做长期投资？


    风险提示：市场有风险，投资需谨慎

    2026/10/27 17:10 徐颖提问：灵哥，铜的逻辑还在吗？铜期货基本上没怎么跌还在 11 万的水平。27 年的铜会还像 26 年上半年的白银的机会吗？


    12 月还有一次加息，当大家很简化的问问题，即什么什么逻辑还在不在时，不如自己看看自己手中标的的逻辑，和自己本身投资和交易的逻辑。


    我来举个例子，洛阳钼业 2024 年底 2025 年初价格是 7 元，现在从今年初大涨到 28 元后跌了一半，现在是 14 元。从利润来看，今年的利润预期是
    2024 利润增长 145%。


    但现在股价只是比 2 年前高 100%，是当初的价格高估了，还是现在的价格低估了，'
