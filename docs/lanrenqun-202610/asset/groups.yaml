    # 同店不同规格分开记录，选方向时一起研究


    # 考研备考：把一大堆资料，变成眼前能用的一小步


    这一组最值得拆的是任务颗粒度。同样是考研英语，可以围绕真题词汇、阅读逐词、作文落笔分别交付。选方向时，先确定自己能帮考生完成哪一步，再决定资料做多大。


    01 | 考研英二真题单词汇总 历史采到「24 小时内 100+人加购」 | 7 天展示销量净增 1,985。'
