    # 沙特为什么打仗总是这么菜


    261001 猫哥星球

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/f8324f01be1510e791b12ae5bc4ebc5e_0_0.png)


    > 小懒判断 | 手里有中东资产、做油气贸易或者跟沙特做生意的老板值得细读，它把"沙特军费全球前列却打不过拖鞋军"讲成了一套制度设计而非笑话。不适合想看战况快讯或找投资建议的人。最值得记的数字：让月薪
    40 美元的雇佣兵替月薪 4 万美元的少爷兵挡子弹，这种结构下买再多美械也是摆设；它跟宋朝守内虚外一个模子，防的是军队政变不是外敌。坑在于：文中"保护伞正在被拆"的判断偏长期叙事，别据此做空或抄底任何资产。


    这次沙特又被胡塞武装打的丢盔弃甲，抱头鼠窜，作为吃瓜群众简直看不下去了。


    那么，沙特一天到晚都在买买买，为啥战斗力如此拉跨？沙特不仅至少坐拥 25 万以上的正规军，手头装备还包括 M1A2 坦克、阿帕奇、黑鹰、F-15、台风 72
    架、狂风约 90 架，预警机、加油机、运输机，护卫舰等，甚至军费还长期霸榜中东。


    说实话，如果按军费、采购规模、空军飞机总数、海军护卫舰数量来对比，沙特 100%能进中东前三。但怎么说呢？从沙特 1932 建国以来，打仗的总结就是气势上从来没输过，战场上基本没赢过。'
  - '[PAGE 1]


    1948 年，第一次中东战争。沙特派了 3000 名正规军和一堆志愿兵去巴勒斯坦。结果大败。


    以色列建国，阿拉伯联军被赶出巴勒斯坦大部分地区。1967 年，沙特宣布派飞机、装甲车和伞兵支援约旦。结果，以色列把埃及、约旦、叙利亚挨个揍了一遍，沙特支援还没怎么展开，6
    天战争就结束了。


    到了 1973 年，沙特派了 1000-2000 人去戈兰高地跟叙利亚并肩作战。初期有进展，但最终被反推。


    这次让人记忆深刻的不是战场哪些事，而是沙特带头搞石油禁运，把油价抬了四倍。然后是 1991 年海湾战争。


    这次赢倒是赢了，但明眼人都知道，赢的是美国。沙特只是学聪明了，把地盘借给美军，跟着打辅助而已。2009-2010 年也门边境冲突，胡塞武装杀了沙特边防兵，沙特越境打了三个月。


    结果最后还是签了停火协议，自己承认死了 109 人，是海湾战争以来最大伤亡。


    最后是 2015 年，开启持续多年的也门战争，沙特组建 15 国联军，号称两周解决战斗。结果打到现在，联军已经没影了，胡塞反倒兵强马壮起来。


    前面几次就不提了，最近十来年被拖鞋军按地上摩擦，才是很多人百思不得其解的。当下，生命线曼德海峡被胡塞锁死，9 天被胡塞推进 5400 平方公里，差点打到自己家门口。'
  - '[PAGE 2]


    搞得骆驼急忙给川普打电话要求支援。结果川普说我和胡塞谈好了，不插手，最多给你排指挥团来。骆驼听了估计一口老血吐出来，心想都这时候，派指挥团来，还有锤子用。


    那么，沙特为啥有钱有装备，但战斗力却差到让人怀疑人生呢？从战术层面来说，胡塞拖鞋军能打是一个方面，就有视频画面现实现人家胡塞扛起 AK 翻越陡峭山壁作战。


    说实话，这种作战能力和意志，在中东是极少数。但你看沙特是怎么打的？地面部队，通常情况下打仗的姿势是，机械化装备在前面，雇佣军在中间，本土少爷兵断后。


    只要一遇危险，少爷兵先撤，雇佣军一看后军跑了，跟着跑，然后带动全军跑路。然后是空军。沙特飞行员开着 F-15 执行任务，心态是飞到高空，扔完炸弹，赶紧回家。


    因为胡塞有便携式防空导弹，一旦被击落飞行员被俘，丢不起这个人。所以空袭主打一个安全第一，炸不炸得中随缘。


    而且，空军和各军之间也没得啥多少联系，经常是空袭归空袭，前线地面进攻归前线，大家各管各。


    还有沙特的军队组织，就像一锅东北乱炖。包括哪些？我给大家梳理。其一是国防部正规军，含陆海空、防空、战略导弹。


    这个队伍的主体是沙特人，但关键技术岗'
  - '[PAGE 3]


    大量靠外援。最典型是空军，长期有巴基斯坦飞行员、教官。陆军训练、维护、防空操作也会有巴基斯坦、苏丹、约旦等外籍人员当顾问。其二是国民卫队。


    这支队伍很特殊，基本没得雇佣，根子是伊本·沙特早年的部落武装白军，属于卫戍部队了，政治很严，但定位不是对外的。其三，就是也门战场的外援代理人。


    实际上从7、8年前年，沙特正规军就不干地面的活了。在也门，当打手的包括苏丹正规军、雇佣合同兵，也门本地反胡塞武装、部落武装、前政府军残部，以及巴基斯坦军官顾问部分指挥协助。


    其四，就是技术服务承包商。欧美在沙特有很多搞雷达、防空、直升机维修，F-15维护、爱国者、萨德操作培训等。


    说实话，中东骆驼的组织能力，能把这些人资源聚拢，已经是能力天花板了，要统筹协调，真的难为他了。这中间，还包括雇佣军代理人的钱被层层盘剥，拖欠。


    所以，真要打硬仗，靠这些部队根本不行，大家都是来混口饭的，让月薪40美元的人替月薪4万美元的少爷挡子弹，人家跑得肯定比兔子还快。


    当然，战术和组织问题，其实只是表面现象。沙特军队战斗力拉垮最核心的，是出在沙特王室本身。有观点认为是因为沙特福利太好了，本国人没几个愿意当兵的。观点我只能说正确一部分。


    说实话，要想拉支有战斗力的部队出来，'
  - '[PAGE 4]


    以沙特的钱和装备还有外部资源，只要沙特王室下决心，有个3-5年，什么征兵，训练、激励也不难，至少不会像现在这么烂。


    但真相是，沙特王室就不愿意。为啥？因为中东多国军队曾推翻君主制，而沙特是唯一一个王室没有被军队推翻的地方，沙特王室对此极度警惕。


    沙特王室对一支强到能自己说了算的陆军天然警惕，所以它的办法不是不建军队，而是把军队拆开。正规军管对外作战、国民卫队管王宫油田圣城、王室卫队更内层、内政和边防管国内安全。


    各系统人事、通信、后勤不完全打通，好处是任何一支都难单独调头搞政变，坏处是打也门这种要跨军种、跨派系、长占领的仗时，协同成本极高。


    国民卫队很能打也忠诚，但定位不是去攻阵地，正规军被允许有火力，但不被鼓励形成完全独立、长期、主动的地面征服能力。


    因此，在操作层面，实力被刻意弱化，目的就是未来防止军队做大，从而影响皇室安全。在沙特王室设计下，沙特是石油食利型国家，政府靠油钱发福利，不怎么向老百姓收税，作为交换民众在政治上服从、别闹事，国家用钱买稳定。


    军事上，打造的是一支无法造反的军队，用钱买安全，自然也就是一路甘当菜鸟。


    所以，沙特打仗之所以总是这么菜，背后'
  - '[PAGE 5]


    的根源在沙特王室。沙特不是不会打仗，是目的有区别，它要的是军队对外有吓阻、对内绝不失控的模式。


    只不过因为这套设计，沙特打仗的逻辑就具象成了用最贵的武器，打最怂的仗，靠最不靠谱的盟友，对付最打不死的对手。


    其实中国历史上有一個王朝跟沙特简直是一个模子刻出来的，那就是宋朝。宋朝的套路叫守内虚外。赵匡胤自己靠兵变黄袍加身，所以对武将天然不信任，搞杯酒释兵权、重文轻武、兵将分离、互相制衡。


    目的很明确，防止内部造反是第一位的，对外战争拉垮就拉垮，反正只要内部不乱，皇权就稳。结果呢？辽、金、西夏、蒙古轮番揍，最后直接灭国。


    沙特和宋朝的本质一模一样都是把防备自己人放在第一位。军队设计的核心不是打赢外敌，而是打不赢也不能让将军坐大。分权、制衡、弱化实战能力，逻辑完全一致。


    你看沙特把军队拆成正规军、国民卫队、王室卫队、内政边防，各系统不通气，跟宋朝的枢密院、三衙、将帅分离，简直异曲同工。唯一的区别在哪？


    宋朝没有保护伞。被外敌揍了只能自己扛。沙特运气好，找到了美国这个超级保护伞。有老大罩着，外部安全有兜底，王室就更放心地把军队搞成对内工具，反正打不赢有美国擦屁股，自己人不动摇就行。


    但现在问题来了，老美自己在战略收缩，'
  - '[PAGE 6]


    从中东抽身，连胡塞都懒得管了，保护伞正在被拆。沙特建国快一百年，我们目前为止看不到它有任何改变的意愿。


    可一旦保护伞真没了，沙特这套对内稳、对外菜的模式还能不能活？到时候，内部是稳住了，外部谁来挡？这才是沙特未来最大的悬念。最后，祝各位星友国庆快乐，身体健康！


