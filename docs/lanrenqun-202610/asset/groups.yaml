    # ## 一、先找到问题，再修改提示词


    写短篇时，常见的无效指令是：“剧情丰富一点”“反派聪明一点”“权谋高级一点”“减少重复”。这些词太笼统，AI 很难判断应该改动哪些情节。


    更有效的做法是把感受转化为可执行的检查项：


    | 表现 | 需要检查什么 | 优先调整什么 |

    |---|---|---|

    | 故事线单一 | 全篇是否只靠同一种冲突推动 | 大纲的核心矛盾、阶段目标与情节功能 |

    | 情节重复 | 多个场景是否换了人物却重复同一套打脸、误会或争吵 | 场景的冲突起因、解决方式和后果 |

    | 反派降智 | 对手是否无视已知信息，反复给主角送机会 | 人物目标、情报、筹码、风险与备选方案 |

    | 权谋不在线 | 是否靠主角全知、反派泄密、巧合取胜 | 利益关系、信息差、策略与代价 |

    | 反转生硬 | 关键线索是否临时出现，结局是否强行翻盘 | 伏笔铺设、误导与回收 |


    **先问一句：问题究竟出在大纲、细纲，还是正文？** 如果大纲本身缺少有效矛盾和人物动机，仅修改细纲提示词无法彻底解决。


    # ## 提示词 1：细纲问题诊断


    > > 你是一名擅长短篇网文的剧情策划编辑。请诊断下面这份短篇小说大纲和细纲，暂时不要直接重写。

    > >

    > > 请依次检查：'
  - '[PAGE 3]


    +   1. 核心矛盾是否清晰，主角目标是否足以支撑这篇短篇。

    +   2. 不同情节是否反复使用相同的冲突起因、对抗过程和解决方式。

    +   3. 每个关键情节是否推动目标、改变人物关系、增加信息或造成后果。

    +   4. 对手的行动是否符合其已知情报、利益与能力。

    +   5. 关键反转是否有足够铺垫，伏笔能否在篇幅内回收。

    +   6. 是否存在与核心矛盾无关、拖慢节奏的支线。


    请输出一张表：问题位置 | 具体表现 | 形成原因 | 建议改动 | 改动可能影响的后续情节。

    按照“严重影响逻辑-影响阅读体验-可选优化”的优先级排列。

    不要用“加强张力”“丰富剧情”之类空泛建议，必须指出可修改的具体情节。


    题材与目标字数：【填写】

    小说大纲：【粘贴】

    当前细纲：【粘贴】

    特别不满意的地方：【填写】


    # 二、解决故事线单一：让短篇的每个阶段都有不同任务


    短篇的篇幅有限，不适合为了“丰富”而无节制增加人物和支线。更稳妥的方法，是围绕一个核心矛盾设计数次性质不同的推进：让主角对局势的认识、可采取的行动和必须付出的代价不断改变。


    例如同样是复仇题材，不能从头到尾只是“发现仇人—打脸仇人—寻找下一个仇人”。可以依次安排：发现疑点、调查取证、利益交换、错误判断、立场反转、最终选择。这些环节必须相互推动，不能机械凑齐。


    # 提示词2：短篇剧情层次调整


    请在不改变小说核心卖点、主要人物和最终结局方向的前提下，优化这篇短篇小说的细纲。'
  - '[PAGE 4]


    +   要求：

    +   1. 全篇围绕一个核心矛盾展开，避免无关支线抢占篇幅。

    +   2. 将剧情划分为适合当前篇幅的若干阶段，明确每个阶段主角想得到什么、遭遇什么障碍、获得或失去什么。

    +   3. 相邻重要情节不能连续采用同一种冲突和解决方式。

    +   4. 每个重要情节至少承担一项功能：推进目标、揭示信息、改变关系、抬高代价、制造合理反转或回收伏笔。

    +   5. 情节之间必须有因果联系；上一场事件应改变下一场事件发生的条件。

    +   6. 对无法推动核心矛盾的支线，优先删除或合并，不要盲目增加新人物。

    +   7. 保留题材应有的情绪体验和阅读爽点，但避免重复打脸和无意义拖延。


    先输出“原细纲问题-修改思路”的简表，再输出调整后的分场景细纲。

    每个场景写明：场景目标、冲突、关键行动、结果、对下一场的影响。


    题材与目标字数：【填写】

    小说大纲：【粘贴】

    原细纲：【粘贴】

    必须保留的剧情节点：【填写】


    # 三、解决重复：比较“场景功能”，而不只是比较字面情节


    短篇重复通常体现为：连续几场争吵、几次相似的误会、反复出现“反派挑衅——主角打脸——旁人震惊”。场景地点不同，不代表剧情有变化。


    但也不能机械禁止重复。有意重复可以用于形成对照、递进或最后的反转，只要每次重复都带来新的信息、关系或结果。


    # 提示词 3：短篇细纲去重


    请作为短篇小说审稿编辑，对以下细纲做“场景功能去重”。'
  - '[PAGE 5]


    检查每个场景的：


    +   - 冲突起因

    +   - 人物诉求

    +   - 对抗方式

    +   - 新增信息

    +   - 情绪作用

    +   - 最终结果


    请找出表面不同、实际作用相同的场景，区分：


    +   A．应删除的无效重复；

    +   B．可合并的同类场景；

    +   C．为对照、升级或反转而有意保留的重复。


    对 A、B 提出具体修改，优先通过改变信息、人物选择、冲突性质或结果来提升差异，而不是简单更换地点和台词。


    修改后保证情节之间的因果关系顺畅，不能为了去重破坏主角动机与大纲逻辑。


    请输出：重复位置 | 重复原因 | 处理方法 | 修改后场景 | 对后续情节的影响。


    小说大纲：【粘贴】


    细纲：【粘贴】


    # 四、解决反派降智：让对手拥有独立的目标和判断


    短篇中，反派不需要拥有几十章的成长线，但必须在有限篇幅内体现自己的目的、筹码和判断力。他可以犯错，但错误必须有原因，例如情报不足、性格弱点、资源限制或利益诱导。


    **尤其要避免：反派明知主角有某种能力，仍无理由地重复上一次失败策略。提示词4：反派行动逻辑调整**


    请只针对这篇短篇小说中的主要对手，检查并修订其行动逻辑。'
