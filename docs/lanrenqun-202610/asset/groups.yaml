    NewsGuard 拆穿过的旧视频当新画面转，转前先问一句画面来源在哪。


    # ## 这些归因，早在骚乱之前就已经选好了。


    ![](img/6c55f3991909b3d2e76b6747c5b208b5_0_1.png)


    最近，法国爆发了规模庞大的抗议和骚乱。本期新闻实验室会员通讯，我们来看看这场骚乱是怎样被讲述的：在法国的报纸和电视上，在社交媒体平台上，也在中文互联网上。'
