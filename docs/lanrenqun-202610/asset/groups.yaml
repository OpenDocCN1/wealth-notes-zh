    \n现在主要围绕一个主站在做 SEO，做推广，出了一批单，今天写这篇帖子，做一次分享，也是给自己最近 3 个月做的事，做一个复盘，希望对一些还没出单的圈友有所帮助！\n\
    \n今天主要分享的是，我自己针对 SEO，GEO 学习和实操，以及怎么做推广，因为还在学习中，所以欢迎探讨，如果不对的，欢迎指正！\n\n## 现状\n\n\
    > 下面几张截图是我当前 SaaS 站一些数据，证明一件事：\n> \n> 做了一些动作，真的会看到流量变化\n\n![](img/2f83509442ad105ae08a02b5eda1d737_2_0.png)\n\
    \n## 什么是 SEO\n\nSEO 的全称是「Search Engine Optimization」，就是搜索引擎优化。\n\n## 怎么做 SEO\n\
    \n学习中，今天主要分享我自己做的 2 个动作\n\n### 2.1 做内页 | 首页\n\n做内页，就是做 TDH\n\n- **T，就是标题**\n\n\
    > 网页标题。就是谷歌搜索结果里那个蓝色大字，也是浏览器标签页上显示的文字。这是谷歌判断你的页面讲什么的最重要依据——写好了，排名才能上去。\n> \n>\
    \ 10~30 字符，核心词放最前面，别啰嗦。\n\n```\n✔Free QR Code Generator - Create & Download\n\
    Instantly | ToolHub\n✔Best Image Compressor - Reduce Size by 80%\nWithout Quality\
    \ Loss\n✘Welcome to my website\n✘QR code generator online free tool (堆砌，没\n卖点)\n\
    ```\n\n- **D，就是描述**\n\n> 页面描述。搜索结果里标题下面那两行灰色小字。谷歌不一定照搬你写的，但写好了能提高用户点击的概率。\n> \n\
    > 150~160 字符，说清「你能解决什么 + 为什么选你 + 行动号召」，用户看了想点。\n\n```\n✔Generate QR codes instantly\
    \ for free.\nSupport URL, text, WiFi, and vCard.\n    Download in PNG or SVG.\
    \ No sign-up\nrequired. Try now!\n✘This is a QR code generator website.\n```\n\
    \n- **H：可以理解成 markdown 的层级**\n\n> 各级标题（H1 到 H6）。H1 是一个页面的大标题——通常跟 Title 保持一致或密切相关。H2、H3...是下面的小标题，就像文章的章节骨架，谷歌靠它们理解你的内容结构。\n\
    \n```\nH1（主标题，一页只准有一个） = 主关键词\n├ H2（3~5 个） = 相关关键词\n│ ├ H3 = 长尾关键词\n```\n\n###\
    \ 一句话总结\n\n- **T（标题）** —— 告诉谷歌和用户“这页讲什么”；\n- **D（描述）** —— 吸引用户点进来；\n- **H（标题层级）**\
    \ —— 把页面内容搭成清晰骨架，让谷歌读懂。\n\n另外需要注意的点：一个页面只能有一个 H1。\n\n这是硬规矩。谷歌用 H1 来判断“这一页到底讲什么”，你写两个\
    \ H1，谷歌就不知道哪个是大主题了。\n\n**H2~H6：没有固定数量，但要有“骨架感”**\n\nH2 到 H6 是小标题层级，用来搭页面内容的骨架。没有“一个页面必须有\
    \ 3 个 H2、5 个 H3”这种硬性规定。\n\n关键看内容：你的内容分了几个大块，就写几个 H2；每个大块下面需要再细分的，就用 H3；再往下就是 H4。\n\
    \n写页面之前，先想清楚内容大纲！\n\n上面是一般的写法，也是业内标准写法。但是你如果想要出单，还要更进一步。\n\n如何让用户看了你的 SaaS 就想点进去，继续看？\n\
    \n答案就是：\n\n```\nblogger.com\ng2.com\ncrunchbase.com\ntopai.tools\n```\n\n更多内容在这个\
    \ CSV 文档里面，有需要可以看下。\n\nCSV：submify.csv 表格·点击下载如果你要自己从竞品那里找外链，可以使用 https://www.similarweb.com/\
    \ 和 Ahrefs.com\n\n![](img/2f83509442ad105ae08a02b5eda1d737_8_0.png)\n\n总结一句：外链就是流量，药不能停！\n\
    \n## 什么是 GEO\n\nGEO 的全称是 Generative Engine Optimization，就是生成式引擎优化，做 GEO 的目的就是让你的网站内容被大模型、AI\
    \ 搜索（Google SGE、Perplexity 等）引用、摘录进 AI 回答里，不一定带来点击，重点是在 AI 答案中获得曝光。\n\n## 怎么做\
    \ GEO\n\n先看下 GEO 效果\n\n因为我的 SaaS 我留了微信和邮件，这个用户我并不认识，但是因为产品不能满足用户需求，所以加微信找到我，然后我就问他怎么找到我的\
    \ SaaS 的，答案就是做了 GEO\n\n![](img/2f83509442ad105ae08a02b5eda1d737_9_0.png)\n\n###\
    \ GEO 主要分为五部分\n\n下面简单介绍 GEO 的五个部分，但是你也可以完全不用知道，让 AI 来做，在这一部分的末尾，我会介绍下，怎么让 AI 做\
    \ GEO，把你的 SaaS 推荐给用户\n\n- **第一部分：AI 爬虫访问**\n\n这一部分主要检测 5 个点，AI 训练爬虫能否访问、AI 搜索爬虫能否访问、ChatGPT-User\
    \ 等用户触发的抓取能否读取真实内容、页面有没有 noindex，以及 nosnippet 等设置是否限制 AI 引用网页内容。\n\n可以检查网站的 robots.txt、页面\
    \ robots meta 和响应头，确认需要的 AI 爬虫可以正常访问，同时页面没有误加 noindex 或 nosnippet，避免网页可以访问，却不能进入搜索或被引用。\n\
    \n```\nOpenAI 文档地址\nhttps://developers.openai.com/api/docs/bots\n```\n\n- **第二部分：机器可读性**\n\
    \n检查主要内容是否直接存在于 HTML 中，title、H1、description 是否完整，以及网站有没有 sitemap、canonical，URL\
    \ 是否清晰稳定。这些原本就是 SEO 的基础，在 GEO 里同样重要。\n\n> 有点像给 AI 准备的网站说明书，用 Markdown 告诉 AI 网站是谁、有哪些重要内容，以及对应页面的地址。\n\
    \n- **第三部分：结构化数据**\n\n结构化数据可以帮助机器更明确地识别网站、作者、发布时间和内容类型。大家可以根据页面类型添加 FAQPage、HowTo、BreadcrumbList\
    \ 等内容结构，再用 Organization、Person 或 WebSite 说明网站和作者是谁。\n\n```\nGoogle 文档地址：\nhttps://developers.google.com/search/docs/appearance/structured-data/intro-structured-data?hl=zh-cn\n\
    ```\n\n写文章最好也关注下结构化数据，下面举个例子\n\n![](img/2f83509442ad105ae08a02b5eda1d737_11_0.png)\n\
    \n> [https://www.gatsbyjs.com/docs/glossary/headless-wordpress/](https://www.gatsbyjs.com/docs/glossary/headless-wordpress/)\n\
    > \n> 跟着谷歌 AI Overview 学习谷歌是怎么满足用户需求的。\n> \n> 谷歌有最多的数据，知道用户搜索这个词想要什么，于是就在 AI Overview\
    \ 里尽量的去满足用户。\n> \n> 所以分析 AI Overview 的行文结构，可以一窥谷歌是如何理解用户需求，如何满足用户需求的。\n> \n> 我们梳理一下大概的结构：\n\
    > \n> 术语解释：Headless WordPress is xxx；\n> \n> 架构原理：How the Architecture Works；\n\
    > \n> 列出优点：Why Go Headless? (The Pros)；\n> \n> 列出缺点：The Big Trade-Offs (The Cons)；\n\
