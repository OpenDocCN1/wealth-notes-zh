- pgno: 4
  md: '不到钱的学员、打工仔、农民们放贷，美其名曰“宜学贷”“宜农贷”……但是，这些无抵押贷款的利息极高，算上各种服务费、管理费，综合年化利率往往达到 20%~30%，甚至更高。


    而且这里面存在一个法律风险：在中国，没有金融牌照的机构，是不允许直接放贷的。


    在海内外金融界打滚了多年的唐宁，从法律框架里找到一个BUG。


    他自创了一种叫“超级放款人”的模式。


    唐宁先用自己的个人账户，掏 100 万借给张三，期限 3 年。


    这属于民间个人借贷，合法。


    紧接着，唐宁把这笔 3 年期的 100 万债权，在金额上切成 100 份（每份 1 万），在期限上拆成半年或 1 年期，包装成“理财产品”，卖给 100 个投资者。


    几天之内，投资者买理财的 100 万，就打回了唐宁的个人账户，唐宁的本金瞬间回笼！


    他又可以拿着这 100 万，再去借给李四，然后再拆分、再打包、再卖给投资者……在这个过程中，借款人付着 20% 以上的高息，而唐宁给理财投资人的收益率只有
    7%~12%，这中间巨大的息差，全进了他的口袋。


    只要资金周转得足够快，唐宁就可以用极'
