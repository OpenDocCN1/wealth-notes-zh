- pgno: 2
  md: '想结合这次 AI 赛道合作，聊聊**项目怎么来的、我们怎么合作，以及为什么看到客户赚钱，我也没有马上决定自己做产品**。大家好，我是 Soda，和合伙人一起做小红书获客。


    每帮客户做起一个项目，我都会觉得：这个赛道好赚钱啊，为什么我还在苦苦帮别人做流量？一度心态扭曲，羡慕嫉妒，连自己的产品线都开始怀疑。


    今天正好刷到亦仁这篇超级标，我狠狠共鸣了。


    今天结合这次 AI 赛道合作，以及过去跨赛道、吃过亏的经历，聊聊擅长流量和销售的人，怎么参与 AI 机会。


    [https://awipdqiy88i.feishu.cn/wiki/PN6ZwJDCQimcBYk...](https://awipdqiy88i.feishu.cn/wiki/PN6ZwJDCQimcBYk...)


    # ## 一、这个合作，来自我们持续做线下分享


    这个客户，是我们在线下一个圈子里认识的。


    我们经常在这个圈子里做分享。只要自己打流量的能力有提升，有了新的实操经验，就会发起分享，把最近做出来的东西讲给大家听。


    这也是我们**持续曝光自己**的方式。


    你有能力，别人不一定知道；别人以前知道你会什么，也不代表他知道你现在已经能做到什么。


    所以，**能力提升以后，我们会主动把变化**'
  merge: -1
  img_proc: true
- pgno: 3
  md: '**展示出来。**


    后来，这位客户需要做小红书获客，就找到了我们。但认识只是开始，他当时同时找了两家团队测试，我们也是其中一家。


    前面的分享，让我们有机会参与；后面的实际结果，才让合作继续下去。


    这也是我的一点感触：**如果你已经有流量、IP 或销售方面的积累，除了继续提升能力，也要让可能需要你的人知道，你现在能解决什么问题。** 我们的合作机会，就是这样来的。


    # ## 二、为什么接这个项目？因为客户缺的，恰好是我们能补上的部分


    我们并不是因为这个项目带着 AI，就决定投入。


    客户之前就在做知识付费，已经有销售和交付经验。现在切入 AI 赛道，专业内容和产品由他负责，后端也有团队承接。


    他自己的冷启动，靠的是过去积累的私域。


    老用户认识他、信任他，可以支持第一轮销售。但同一批私域用户，**不能无限重复转化。想继续增长，就需要从公域持续获得新客户。** 这就是他当时非常明确的需求。


    我们要解决的问题也很清楚：怎么在小红书找到合适的人，以能承受的获客成本不断获取公域流量，让他已有的销售和交付能力继续发挥作用。


    为什么我看重这个条件？'
  merge: -1
  img_proc: true
- pgno: 4
  md: '因为我们早期做过一个面向 HR 人群的代运营项目。账号两周涨粉过千，后来给客户导入了大约 900 个微信好友。


    但项目没有一直做下去，因为后端产品和转化还没有准备好。


    那次经历让我看到，流量来了，生意也未必接得住。


    所以，这次 AI 合作里，我们看重的是客户已有的销售和交付能力。他需要补一条公域获客渠道，而我们恰好擅长这一块。同样是新项目，有人缺流量，有人连产品有没有人买都还没验证。接项目之前，要分清自己面对的是哪一种。


    # 三、我们的合作模式：基础服务费加营收分成


    这一点很重要，也是我后来不再那么纠结“为什么一直帮别人做流量”的原因之一。


    这个项目，我们采用的是基础服务费＋营收分成的联营模式。


    双方的分工很明确：


    我们收取基础服务费，同时按照双方约定的口径参与营收分成。


    客户的生意增长，我们的收入也能随之增加。我们继续做擅长的获客，也能参与项目增长带来的收益。


    但联营不能只靠一句“大家一起赚钱”。


    双方要了解彼此的能力，也需要经营数据'
  merge: -1
  img_proc: true
- pgno: 5
  md: '透明。前端带来多少人，后端成交多少、产生多少营收，要能一起查看、核对和复盘。


    相关的数据查看约定，我们会写进合同。


    否则，前端把人交过去，后面发生了什么完全不知道，就很难判断自己的工作效果，也很难把分成合作长期做下去。


    我们参与这门生意的方式，是承担明确的工作，通过实际结果获得收入。


    # ## 四、第一周解决流量，第二周开始解决流量质量


    项目启动以后，我们第一周就打出了流量，也拿到了很好的获客成本。靠的是过去积累的两种能力：理解项目，以及理解流量。


    先弄清楚客户卖什么、谁会买、为什么买，再把这些理解放进具体的内容和投放里。


    客户本身擅长视频表达，我们擅长图文获客，所以双方是配合着做。


    视频能让用户认识老师，了解他的表达和专业能力；图文则可以更直接地介绍产品，把适合谁、能学到什么、为什么值得进一步了解讲清楚。


    到了第二周，我们开始优化流量质量。因为获客成本低，并不意味着生意就一定更好。如果大量进来的人只是想白嫖和观望，没有购买意愿，销售就需要花时间筛选和沟通。前端数据可能很好看，后端却未必轻松。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '我们开始根据后端反馈，减少这类白嫖党用户，帮助客户提升销售转化率。我们的工 作也有一个推进过程；


    先证明能拿到客户，再判断拿到的不是合适的客户，然后结合销售反馈继续调整。这也是我理解的流量能力。除了能把人带来，还要知道这些人为什么来，以及他们后面有没有购买。


    # 五、少量前端人力做出结果，背后还有客户自己的能力


    这个项目第一个月，我们就做出了 50 万营 收。第二个目标是 100 万。


    当时前端的配置，是我负责策划和投放，带一位兼职制作内容，一个月更新约 25 篇 笔记。


    为什么不需要很多人？


    因为有效素材测试出来以后，可以持续投 放。我们保留持续带来客户的内容，替换 效果下降的部分，再补充新的测试。


    兼职熟悉产品、用户和内容要求以后，也 不需要每次从零理解项目。AI 可以辅助制 作，但最终稿子和封面能不能用，仍然要 达到我们的要求。


    这些积累，让前端的人力投入可以保持精 简。不过，还有一个不能忽略的条件：客 户本人很强。我会形容他是“IP 圣体”。


    他的表达、感染力、专业积累，以及和用 户建立关系的能力，都在影响最后的成交。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '同一个产品，换一个人卖，都不一定能做到他这么好的转化率。


    所以，我不会因为我们帮他拿到了流量，就觉得：那我也做一个IP，卖他的课，不就行了吗？我很清楚，哪些工作是我们做好的，哪些结果依赖他本人。


    我们说前端人力少，指的是小红书获客这一部分。客户的视频、直播、销售和交付，都是项目能够做起来的条件。


    知道自己的能力在哪里，也知道合作方的能力在哪里，才能正确理解这个结果。


    # 六、我们也想过自己干，但会获客不等于会做整门生意


    看到客户赚钱，我们当然心动过。


    之前合作过一个宠物行业的客户，一个00后的小伙子卖猫，25年的营收过亿。


    了解到对方的生意规模以后，我们也想：自己会流量，客户又愿意带，为什么不能试试？


    于是，我们认真调研了三个月。


    开始了解渠道、供给和启动资金以后，才发现，做好前端获客，距离自己经营这门生意，还有很多不熟悉的工作。


    哪怕有人愿意教，按我们当时考虑的方案，原本准备的二三十万元，也不够启动。


    最后没有做。


    后来，我们还测试过情感咨询产品。'
  merge: -1
  img_proc: true
- pgno: 8
  md: '前端投了一点预算，获客有了反馈，接下来却卡在另一个问题上：靠谱、能持续交付的人，去哪里找？


    后来我自己复盘，我们这个情感咨询的客户，做流量，做销售，做交付，他什么也不会。但是他会组织，会管理，会帮手下的人解决问题。他不会做流量，就找到了我们。


    不会做销售，就让他的销售去竞品的公司上班。


    不会做交付，就找能做交付的人。


    这些经历让我慢慢意识到，以前看客户的生意，很容易只看见：我帮他拿到了客户，他收到了钱。


    但产品、供给、销售、交付，还有他过去积累的资源，都在这笔收入后面。我能帮助客户做好一个环节，并不代表把整门生意接过来，也能拿到同样的结果。


    所以，现在看到一个赚钱的赛道，我会继续往下问：


    这个结果有多少依赖合作方？如果换成我来做，还需要补哪些能力？这些工作，我有没有兴趣长期承担？


    问完以后，再决定参与到什么程度。


    # 七、“给你股份，你们 All in 吧”——这个邀请，我们收到过很多次


    做流量服务，经常会遇到一种邀请：'
  merge: -1
  img_proc: true
- pgno: 9
  md: '你们干脆 All in 我们这个项目吧，给你们股份。


    很多老板都和我们说过。


    这句话很容易让人心动。尤其当你刚好觉得，自己在苦苦帮别人做流量，客户却赚到了更多的钱。


    股份好像意味着，自己终于也能成为这门生意的主人。


    但现在，我对这种邀请非常警惕。


    因为我以前吃过这个亏。好巧不巧的是，后来我和一个刚出来创业的大学同学聊天，她也同样有过这种经历。这大概是所有刚升为创业公司管理层或者刚出来创业的人都会遇到的吧。


    前车之鉴，大家一定要警惕□


    经历过以后，我不再把“给你股份”当成已经拿到的收入。


    它可能让你少收眼前的服务费，投入更多时间，甚至放弃自己原来的业务。你付出的东西已经发生，对方承诺的未来却还没有发生。所以，现在再有人用一句“给你股份”让我
    All in，我会先按画饼来处理。


    我只认钱，只认落袋为安。别整那些虚的。这和我们现在做的联营，对我的意义很不一样。


    当前负责什么、按什么获得收入，都有约定，也有实际回款可以验证。要不要更深地参与，可以在合作过程中继续判断。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '未来也许真有一个项目，让我愿意 All in。


    但至少要先实打实赚到钱，跑通 0—1，让我看到这门生意如何运转、双方如何配合，再考虑加大投入。我庆幸自己后来没有再被别人的饼砸晕。


    这些判断，是经历不同赛道、不同合作，吃过亏以后，一点点形成的。


    # 八、关于追风口。现在不做 AI 产品，但我要保持和 AI 的链接


    我以前经历过 P2P，也经历过元宇宙，我和 Jasper 作为运营负责人和商务负责人，参与项目的 0-100，跑出了一年 13 亿 GMV 的成绩。


    这些经历让我知道，风口会带来真实机会，也会产生大量泡沫。一些产品在热度过去以后，未必能留下长期的实用价值。


    我对现在 AI 热潮的一个观察是，用户购买的原因，有为实用价值买单，也有为情绪价值买单。


    很多人不想被 AI 甩在后面。买一个工具、学一门课程，除了想解决问题，也是在缓解“别人已经往前走了，我还没跟上”的焦虑。


    而风口上的钱，确实往往更好赚。风口上为情绪价值买单的钱，也更好赚。


    在一个很大的新增需求下面，切中一个很小的具体问题，也可能做出不错的生意。


    但经历过几个周期以后，我不会因为一个'
  merge: -1
  img_proc: true
- pgno: 11
  md: '方向现在赚钱，就认定自己应该把全部资源投进去。


    我现在不会，也不想自己研发 AI 工具或者 AI 课程。


    这不代表以后不会。


    最起码现在，我要保持和 AI 的链接。合作项目，是一个很适合现阶段的参与方式。


    我可以用已经具备的能力获得收入，同时接触真正做 AI 产品的人，看到用户为什么付费，也看到项目在销售、交付中遇到什么问题。


    这些实际接触，会帮助我形成自己的判断：什么需求能持续，什么结果依赖具体的人，哪些事情以后也许值得自己做。


    我不需要现在就决定，未来一定做产品，或者永远做服务。


    先参与进去，做事、赚钱、观察，再决定下一步。


    # 九、可以先带着已有的能力，去服务一批新的客户


    原帖里那位朋友问，做 IP 打造、私域发售还有没有机会，是不是需要切进 AI 项目。


    我们的经历，或许可以提供一种参考。


    你可以先去找：哪些 AI 团队已经有产品、销售和交付，正好缺你擅长的能力？


    我们这次的合作，就是这样发生的。'
  merge: -1
  img_proc: true
