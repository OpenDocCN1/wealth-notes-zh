    # 前言：


    大家好，我是锦城


    好久没有写文章了，目前自己在做的项目主要做虚拟赛道主要做的是小红书虚拟店铺,顺带做一下闲鱼虚拟电商别的平台 暂时没有接触，未来估计也多拓展一下平台比如淘宝，私域这些，一个人暂时忙不过来。


    今天主要讲的是我自己的一套小红书选品逻辑这套方法我之前已经实际跑过。做过一批职场类商品，也是先从监控里发现方向，再去做商品、做笔记、慢慢优化，相关项目累计收益已经到了
