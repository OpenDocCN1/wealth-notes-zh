  md: '# 2 天谈了 3 个累计 GMV 近 20 亿 的客户，分享我们是怎么拿下第一单的实战经验


    261010 副业 SC 精华

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/d58980d33aa2215641c7ed4eb1eaee07_0_0.png)


    > 小懒判断 | 适合会用 AI 但没做过客户交付、想接 B 端单的 FDE 新人，不适合想看完整成交复盘的人——三个客户只有一个收了 3 千定金。最值得看的是飞鱼哥那句销售十几种模式
    99%的人只会两种：跨境客户没被打中就现场花两小时补 POD 工作台演示，顾问式销售落地示范。坑在于功能做完了才发现客户不急着用，推广海报白开发一轮。


    大家好，我是小满，一个会用一些 AI、自己折腾过 AI 产品，但还没给客户做过项目交付的 FDE 小白。最近，我和飞鱼哥、焦波哥、Link 教练一起接触了三个不同体量的客户：一家近
    20 亿 GMV 的跨境公司，一家想拓展线上业务的百万营收私域护肤品牌，还有一位 OPC 疗愈师。


    公司体量不同，要谈的事情也很不一样。跨境老板听完平台方案，最想先解决眼前的 POD 业务；护肤客户从招一个懂 AI 的人，聊到了工作台和线上代运营；疗愈客户付了定金，我们开始开发，又遇到了需求没问细、功能做得太散的问题。


    目前，疗愈项目已经收了定金，工作台还'
