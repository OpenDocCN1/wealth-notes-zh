  md: "# # 洪灏：应该抄底了吗？\n\n261013 洪灏  \n整理：公众号懒人搜索，懒人专属群精选  \n懒人微信：lazyhelper1\n\n![](img/cc12a937f0eaa49ecf2c24d141cb0666_0_0.png)\n\
    \n> > 小懒判断 | 适合被这两天科创创业板暴跌吓到、纠结要不要抄底的人；不适合想做半导体右侧追高的——洪灏明说半导体周期6月见顶后势必将回落到底。最值得关注的是他拆解美债收益率飙升的口径：通胀预期其实稳定，真凶是AI资本开支推强的实际利率+财政担忧的期限利差，且美元和美债买盘都还旺。坑在于左侧抄底“必须要有一颗强大的心脏和一副好的肠胃”，周期模型与技术形态目前是打架的。\n\
    \n# ## 前言\n\n这是一个重要的问题。\n\n进入十月，中东局势前景继续不明而导致油价居高不下，引领全球长端收益率上行，全球市场大幅波动。与此同时，美国进入了中期选举最后的关键窗口。民意调查显示，特朗普领导下的共和党很可能将失去众议院，甚至连参议院这样的共和党的属地，似乎也开始显得岌岌可危了。\n\
    \n即便如此，虽然两院的分裂将削弱特朗普作为总统的权力，让他变成为一位“跛脚鸭”总统，但是历史上市场遇到这种两院分歧的时候反而表现不错——与我们直觉相悖。其实，在这种两党在议会中分权鼎立的情"
