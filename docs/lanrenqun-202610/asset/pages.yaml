    小懒判断 | 休学做 MATLAB、复学做产品、毕业测 Codex 教学，02 年大学生三年累计 40 万，这篇是复盘不是教程，找现成 SOP 的人不用看。最值得抄的是三业务框架——核心业务养现金流、新兴业务试水、未来种子小实验，刚起步摇摆的人最该读。坑在于
    40 万是三年合计、Codex 教学才初步跑通，别当成功学。


    大家好，我是都督，02 年大学生，生财一年级学生，来给自己做个复盘。


