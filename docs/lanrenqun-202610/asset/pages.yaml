- pgno: 2
  md: '足够多动手，即扛得住，仓位也可以上得大。


    具体执行上，如果完全没有多单仓位，可以8个甚至6个红线的时候就动手，至少买个底仓；如果有多单仓位了，可以多等一下，等红线触发的足够多，比如10个再动手。具体可以根据自己的风控、性格、策略、资金情况做微调修正。


    但是原则上肯定是至少6~8条红线才动手。我自己这次的情况，会到9根红线的时候动手。如果没有红线触发，那就是机会还没到，还没到底部，必须要保持耐心！！！


