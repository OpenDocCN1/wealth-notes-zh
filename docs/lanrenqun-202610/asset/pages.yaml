  md: '有排版，然后就加了配图、排版和飞书文档自动同步的功能备注写在正文里容易看漏，交互体验也很差，就改成了侧边的批注，加了“按批注修改”，更符合我习惯的改稿逻辑以前改
    AI 写的稿子总是有大量重复修改的地方，改了这一次下次还得改，就让它记下我是怎么改稿的多设备协作不方便，就改成独立服务部署，邮箱验证码登录接公众号和 x，直接让
    Claude computeruse 自己接入，我只负责扫码想同步到星球和小红书，就加上了星球草稿箱和小红书版


    永远相信 AI 比你聪明，但需求只有你自己清楚 说清楚你的需求，AI 一定能提供你想要的东西


    # 九、开源仓库


    核心代码已经放到了 GitHub 上，地址： https://github.com/garycaogan/content-workbench


    # 内容工作台（content-workbench）


    把你每天说过的话、开过的会、写过的文档，变成能发的稿子：AI 只摘你自己的原话提炼选题，照你的写法起底稿，你在一个页面里看图、批注、改完，一键推公众号草稿箱、X
    长文草稿、知识星球草稿箱，再一键做成小红书图文。每篇稿子在飞书里对应一个文档，原地更新留档。它还会记录下你每次怎么改 AI 的底稿，总结成你的改稿习惯，下次起稿就照着来。


    所有东西都跑在你自己的电脑上，数据只存在本地的私密目录里。它只把稿子放进各平台的草稿箱，最后点发表的永远是你自己。


    作者：Gary（曹淼）。这是我自己每天在用的工具，前因后果写在这篇文章里。


    ![](img/d4ad0d0698187569ac2c5e765f34c340_10_0.png)


    怎么装？把这个链接丢给你的 Claude Code 或者 Codex，让它照着说明帮你装、'
