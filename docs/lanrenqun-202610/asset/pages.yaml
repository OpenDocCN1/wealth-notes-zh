    # 3. 跨赛道降维对标法；做图文不要只抄图文，去高爆短视频里截黄金关键帧


    在图文赛道里，如果大家都在图文库里互相对标、互相改写，不出半个月就会陷入严重的同质化内卷。


    我的独门心法是：**另辟蹊径，去跨赛道找高爆短视频做对标！**


    +   - 短视频在抖音、小红书上已经受过百万读者的完播率考验，画面的**冲突感、抓眼球能力和市井生活张力**远超普通静态图片；


