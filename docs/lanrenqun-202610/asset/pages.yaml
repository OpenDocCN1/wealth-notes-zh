  img_proc: true
- pgno: 1
  md: '毫无保留地全部推在你面前。我会教你，如果机会出现在面前，你怎么怎么认出它，怎么接住它。


    很多人觉得，自己这一辈子都没什么机会，不是没有，是没认出来。


    看完这篇文章之后，你看待自己人生的角度，一定会和之前不一样。


    ·如果你今年二十多岁，这篇文章可能帮你少走十年弯路。·如果你三十多岁，这篇文章能帮你认出当下正在发生的机会。


    ·如果你今年四十多岁，这篇文章可以让你重新理解过去的路，也让你知道，接下来的牌，怎么打才能受益最大。好，下面我们正式开始。


    # 重新定义机会


    展开之前，我想先和你一起，把“机会”这个词，重新定义一下。大多数人对机会的理解是有偏差的。很多人认为，机会就是“一件好事发生了”。比如升职了、加薪了、被领导看中了，谈成了一个大单子。


    这些当然是好事，但严格意义上，它们并不是改变命运的机会，它们只是在原有轨道上的奖励。奖励可以让你跑得更稳，但不会换轨道。


    那什么才叫改变命运的机会？我自己摸索出了一个判断标准，分享给你：如果五年之后回头看，当时如果换一个选择，或者抓住这个机会，今天的我会是一个完全不同的人。'
  merge: -1
  img_proc: true
- pgno: 2
  md: '按这个标准过滤一遍，你会发现，人这一生中真正能称得上可以改变命运的机会，其实少得惊人。


    它们会有这么几个共同特点：


    +   - 它不是你能主动创造的，而是某一个时刻被递到你面前；

    +   - 你做和不做，都是一种选择，拒绝也是选择，沉默也是选择；

    +   - 一旦选了，就回不去了。


    它会像一把刀一样，把你人生切成之前和之后；我开头说，很多人觉得自己这一辈子都没什么机会，不是没有，是没认出来。心理学上有一个经典实验。


    1990年代，英国心理学家 Richard Wiseman 做过一个长达十年的实验。他追踪了上千个自认为幸运和不幸的人，想弄清楚，这两类人，到底有什么区别。他发现了一件很让人意外的事，那些自认为幸运的人，不是真的运气更好，而是他们更善于识别身边出现的机会，并且愿意去做出反应。


    而那些自认为不幸的人，机会其实同样从他们身边经过，他们要么没看见，要么看见了，但选择不动。


    所以，机会的真相就是：它不是从天而降的礼物，而是一个伪装成日常的考题。答得对，命运就翻一页，答错了或者不答，它就静静走了，再也不会回来。


    我们大脑天生就更倾向于维持现状。面对'
