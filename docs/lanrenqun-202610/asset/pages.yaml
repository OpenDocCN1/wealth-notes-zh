    必须确立一条铁律：**信息先到真人，再喂给 AI。**


    +   1. **微信三人群轻量收集法（零代码，直接用）**


    对于没有技术背景的圈友，完全不需要写爬虫脚本。最接地气且极其高效的做法是：


    +   - 自己用大号拉两个自己的小号，建一个仅有 3 个人的私密微信群，命名为“贴图素材库”；'
