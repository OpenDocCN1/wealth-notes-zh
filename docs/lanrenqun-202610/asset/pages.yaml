- pgno: 2
  md: '解决的问题上，才有用，比如美国柴油价格，只有在建立油价与通胀乃至美国大选之间的内在联系，这个信息才有了更大的价值，由此可以展开更进一步的信息搜集和思考，但源头就是意识到问题的存在。


    小镇写这篇文章时，思考了这几个问题。


    第一问：泽连斯基公开抨击特朗普，挑明了说油价上涨是美国没能搞定伊朗，这是一个非常奇怪的抨击，从常理上，泽连斯基不能这样说，何况几个月前他还各种忍让、恭维特朗普，为什么突然变了，这就是一个需要意识到的问题。


    第二问：为什么是柴油？通过泽连斯基的公开抨击，我们可以观察到焦点是柴油，只需要简单搜索，就会查到美国和俄罗斯计划签订柴油供给协议，这在美国开展对俄制裁的大背景下，是很奇怪的。


    从这两个问题出发，就可以进行初步的信息搜集，无非就是柴油供需、美国柴油进出口、国内柴油价格等等，信息搜集过程中一定会看到几篇整体报道，可以是官方媒体的报道和评论，也可以是信得过的自媒体的总结。不管结论性部分，只注意搜集事实性的信息。


    经过这番搜集，就会意识到第三个奇怪的问题：美国一方面缺柴油，可为什么美国还在大规模出口柴油，到底是为什么？


    这个问题就不再是简单的... 需要思考了，但好在现在有 AI 了，只需要向 AI 提问，就可以得出相关结论，当然提'
  merge: -1
  img_proc: true
- pgno: 3
  md: '问的时候，提问者掌握的信息和维度多少，必然影响到 AI 的输出。


    经过这几步，一篇比较有价值的文章就出来了。类似美国相当比重家庭拿不出 400 美元应急、600 升容量的碳纤维高压气瓶等，这都是公开报道可以简单搜集到的。


    从上面看，其实问题关键不是搜集什么信息，而是要有问题意识，然后抓住问题不断深入，把问题做深做实。这其实就是毛主席等领导人强调的调查研究。


    问题意识也是可以培养、训练的，不同人、不同事差别很大，一开始可以先比较教条的进行思考触发，有这几个类型可供参考：


    一是关注反直觉的异常。看到的某个数字和常识、历史区间、类似指标之间是否矛盾，比如美国四成家庭拿不出 400 美元应急，如果这个数字是真的，那么跟美国的消费数据能否互相解释呢？美国这么富，又为什么会焦虑柴油翻倍涨价呢？


    二是注意相关数据是谁统计、发布的。任何数据的搜集、发布也是需要关注的，很多争论往往不是观点之争，而是口径之争，先统一口径，比如确定时间和范围，然后再去讨论。这在涉及中美关系以及美国问题时特别重要，国内很多人对中美的认知是陈旧的。


    三是注意利益结构。还是要关注看到的数据、观点，到底是谁说的，谁会受益于这个叙事。比如特斯拉的飞车，为什么要搞，为什么是这个节点，不一定会得到一个符'
  merge: -1
  img_proc: true
- pgno: 4
  md: '合所有事实的结论，但思考本身就是有益的。


    先练习以上三点，也就够了，剩下的就是积累之上的慢慢生长。


    而在锻炼的时候，没必要范围特别广，先关注自己熟悉的或者感兴趣的少数几个领域，把这个领域的问题搞清楚。日常阅读的时候，不是去判断看到的某个信息是否有用，而是要思考这个信息可以落在那条问题主线上，能够有利于思考什么问题。


    积累的多了，就得开始锻炼跨域打通，但注意不是强行打通信息点，而是抓住不同信息之间的结构是否相似，比如把能源系统看到的信息，能否跟半导体供应、劳动力市场等等领域联系起来，找到其中结构相似之处，而不是强行进行表层类比，这就成了用中国古代历史硬套国外了，必然牵强。


    要做到上述这些，其实很难的。难就难在刚开始的时候问题很多，但基本看不到回馈。而从理论上讲，当一个人努力到 58% 的时候，仍然看不到质变，坚持不下去才是正常现象。


    好在现在有了 AI，在 AI 的支持下，信息检索和求证已经基本解决了，关键是如何提出一个问题，然后通过与 AI 的交流不断拓展这个问题，这仍然高度依赖于人对异常、矛盾和长期主线的敏锐感知。


    而且古有"房谋杜断"，现在 AI 一定程度上扮演了"房谋"的角色，可以提供非常丰富'
