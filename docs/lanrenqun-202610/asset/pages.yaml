  md: '# 漫画：


    ![](img/5fe507ad62cdefd7719595e6e0b1f5c1_1_0.png)


    话说一群原始人站在一起，准备拍毕业照，身后的横幅写着："钻木取火一班毕业留念。"就在他们完成训练，准备凭这门手艺走向社会的时候，一只手伸进画面，啪的一声，点燃了打火机。所有人目瞪口呆。打火机的出现，意味着这些人学的内容算是白学了，你钻木取火的本事再强，你能强得过打火机吗？不久前，清华大学数学教授薛金鑫写了一篇数学方面的文章，没想到成了爆款，数学文章也会有人看吗？是的，因为他讨论的是数学的整个评价体系已经被
    AI 给颠覆了。当用 AI 越来越容易生产论文的时候，目前的整套游戏规则已经不存在了，你完全可以用 AI 写一篇质量相当高的论文去投稿，别人都不知道这文章是不是人类写的，如果是这样的话，"发论文"这件事本身就会变得没有价值。


    假设你是一个数学系的博士生，你为了一道难题已经花费了 4 年时间研究，再差最后几个月你就可以完成论文并拿到博士学位了，就在这个时候，AI 出现了，他仅仅用了几个小时的计算量，就帮你把这个问题给解决了，而且他生成的论文质量并不比你差，此时，你的整个人生观和价值观都出现了坍塌，你会开始怀疑自己这么多'
