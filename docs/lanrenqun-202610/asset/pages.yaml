  md: '因为处理坏账处理到最后，会发现另外一个问题：地方金融机构自己也需要重组。2004年，渝富开始参与重庆银行重组。按照后来公开的评级材料，当时渝富代表重庆市政府向重庆银行注入4亿元，又出资7.38亿元从重庆城投、重庆水务等机构手中收购重庆银行股份。


    之后重庆银行又引入香港大新银行等战略投资者。2013年，重庆银行在香港上市。


    后来又回到A股。一家地方城市商业银行，就这样被重新做了起来。


    紧接着是西南证券。今天很多人知道西南证券是重庆唯一的法人上市券商，却很少有人记得，它在二十年前差一点没有今天。西南证券的前身，1999年由重庆国际信托证券部、重庆市证券公司、重庆有价证券公司和重庆证券登记公司等地方机构合并而来。


    赶上2000年前后券商行业最混乱的几年，它也踩中了不少雷。2005年，西南证券亏损4.85亿元。资本金不够。不良资产要处理。


    历史债务要剥离。一些老股东自身也出了问题。重庆最后还是把渝富推了出来。


    后来披露的重组文件里，有几个数字很有意思。渝富拿出约2.87亿元处理西南证券不良资产。又拿3亿元直接参加增资。为了弥补渝富处理不良资产形成的成本，除少数股东外，西南证券原有股东还把部分股权对应的表决权、董事监事提名权和建'
