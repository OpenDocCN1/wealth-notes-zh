    > 小懒判断 | 适合想搞懂 P2P 怎么坑人的普通人——"超级放款人"模式一段就讲透了：个人放贷合法→债权切块包装理财→回笼本金再放，期限错配注定靠借新还旧续命。不适合想抄底宜信烂账的人，300-500
    亿缺口已转刑事追赃。最值得关注的是唐宁两轮套路的连续剧：P2P 清零后转"类固收"割高净值，金交所盖章变合法，直到监管取消全国金交所资质才断根。坑在于记住那句铁律：承诺保本高收益的全是陷阱，5%以上利率别碰。


    朝阳分局又立功了！


    不过这次侦破的不是黄赌毒，而是互联网金融大案。


    2026 年 10 月 12 日，北京市公安局朝阳分局发布通报：


    依法对宜信相关公司涉嫌违法犯罪立案侦查，实际控制人唐某、赵某等多名犯罪嫌疑人已被采取刑事强制措施。


    这个唐某是谁？


    他就是人称“中国 P2P 教父”的唐宁，赵某就是他的妻子。


    唐宁身上的标签，随便拎出一个都足以让'
