- pgno: 1
  md: '况下，在朝党的权力受到限制，出台极端政策而导致政策失误的概率反而减少。比如，克林顿时期和奥巴马时期都曾经出现过"跛脚鸭"总统的局面，但是当时的美国政府赤字却是相对来说比较可控的。因此，共和党失去众议院对于市场来说，不一定是一个坏消息。而特朗普也可以继续使用行政命令来推行其想要执行的政策。


    如是，美国的中期选举鹿死谁手而带来的不确定性并非是此轮全球抛售潮的根本原因。反之，中期选举带来的不确定性最终也将在11月初尘埃落定。如是，从逆向投资思维的角度看，当下的市场抛售潮反而应该带来机会。


    # ## 这几天的动荡，统计上并非崩盘


    上周五10月10日，科创50日内振幅5.33%，约2个标准差，但盘中V型反转；本周一10月12日，科创振幅再次达到了3.33%，约1.25个标准差，而收盘接近低点，卖压贯穿全日同时方向偏空。从10月9日至13日上午的五日高点至低点窗口，科创50从1,473.4跌至1375.3，跌幅为12.90%，位于过去两年滚动5日窗口第91百分位，高于均值1.59个标准差；创业板从3,049.3跌至2,860.8，跌9.85%，同为第91百分位，高于均值1.50个标准差。481个连续五日的滚动窗口中，仅43个窗口的波幅更大，且两大指数同时越过各自p90。


    分布上，科创50滚动5日均值6.98%，p95为14.86%，两年最大19.52%；创业板均值5.89%，p95为10.51%，两年最大'
