  md: '的价值。借用巴里什的话说，这是双向的滋养。


    而我们今天只是借用巴里什的研究，在呈现一个长期被低估的事实：在那些祖辈选择陪伴孙辈的时刻，也许只是每周一次的视频电话，也许是寒暑假里的几天相处，他们给出的东西，比所有人以为的都要珍贵得多。那不是在“帮忙”，那是在为一个孩子的内心世界建造一座避风港。


