    # 恒指领先指标开始寻底


    与此同时，经历了最近几个交易日的猛烈抛售之后，恒指已经下行到了我们之前预测的 23,xxx 的位置。而我们独有的恒指领先指标开始寻底了。这个指标现在的位置，相当于
    2022 年 10 月底疫情最后一跌和 2018 年的第一次贸易战，并且远超了 2008 年全球金融危机的低点以及 2024 年增长恐慌时期砸出来的低点。当然，一些人会说还是不够低。但在这个时间节点上，更重要的问题是，许多悲观的情绪和负面的消息，其实已经反映在了价格里。


    ![](img/cc12a937f0eaa49ecf2c24d141cb0666_6_1.png)


    总结一下：近期美债收益率的大幅上升并非油价飙升而导致通胀预期上升所致。实际上，美国的通胀预期大致稳定，因此美债收益率的大幅飙升更可能来自于经济基本面的强势而导致实际利率的上升，以及市场对于美国政府财政状况的担忧而导致'
  merge: -1
  img_proc: true
- pgno: 7
  md: '期限利差的扩大。但是，在美债上升的同时我们也看到了美元汇率的走强和国际资本持续流入美国市场。因此，对于美国政府财政状况的担忧可能已经开始过度反应了。如果在通胀预期稳定，美国经济增长强劲的背景之下美联储加息，那么这种加息反映的是美国基本面的强势，而不是通胀的失控，更不是美国财政马上崩溃的情况。


    如是，美债收益率飙升的势头应该开始收敛，对于增长型资产的压抑应该开始边际减轻。美债收益率的技术图形依然牛气冲天，但是我们的周期模型开始显示短期见顶的迹象。全球半导体周期继续从我们之前预测的六月中的高点开始回落，盈利增长的速度很可能将开始放缓，虽然盈利的绝对值体量将继续扩张。因此，如果美债收益率真的如期升势放缓的话，那么对于风险资产的反映很可能更多地体现在软件业等成长型
    HyperScaler 以及类似的相关行业，比如恒科，而暂时非半导体。


    我们的恒指领先指标已经回落到 2018 年贸易战、2022 年 10 月底疫情重启时候相当的位置，并且应该开始寻底了。毕竟，低于 2008 年全球金融危机的底部显示了其实很多坏的消息已经反映在价格里了。上周五的
    V 型反弹和今天的买盘，都显示了现在这个区间很可能是相对的低位。市场的政策预期浓厚，但是如果预期不能落实，同时短期增长如推绳子一般难寻着力之点，那么现在这个点位附近反而是一个可以量化的、因此也可以具象化守住的指标。'
