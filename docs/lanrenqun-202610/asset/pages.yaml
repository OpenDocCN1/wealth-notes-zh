  md: '# 女性被 AI 落下了吗？


    261021 新闻实验室

    整理： 公众号懒人搜索，懒人专属群精选

    懒人微信： lazyhelper1


    ![](img/186a4c29e85a50c37b46b26981bb031a_0_0.png)


    ![](img/186a4c29e85a50c37b46b26981bb031a_0_1.png)


    微信： lazyhelper1


    小懒判断 | 适合关心 AI 红利分配和教育方向的人

    ——这份哈佛报告最有价值的是拆穿了「知识差距」假象：男女答错题数差不多，差的是男性敢选、女性爱选「不确定」，还有编造人名测试里男性连假名字都声称认识。最值得关注的是媒体数据：AI
    报道中被当专家引用的信源不到一成是女性，记者找谁解读是可以自己决定的。坑是把「用没用过」当差距——用过没差距了，差的是使用深度和职场支持。


    所谓的性别“知识差距”，有一部分可能反映的是男性更高的自信，甚至过度自信。


    ![](img/186a4c29e85a50c37b46b26981bb031a_0_2.png)


    今天的新闻实验室会员通讯，我们来读一份前两天刚刚发布的研究报告：哈佛大学肯尼迪学院 Shorenstein 媒体、政治与公共政策研究中心的《女性正在被 AI
    落下吗？》'
  merge: -1
  img_proc: true
- pgno: 1
  md: '（Are Women Being Left Out of AI？）。报告由 Shorenstein 中心主任、《时代》周刊前主编 Nancy Gibbs
    和哈佛肯尼迪学院教授 Matthew Baum 主持，资助方是梅琳达·盖茨（Melinda French Gates）创办的 Pivotal——她在 2024
    年曾宣布拿出 1.5 亿美元，用于提升女性在 AI 等领域的处境。


    报告的数据来自三个来源：2026 年 7 月对 5403 名美国成年人的问卷调查；一个名为“国家互联网观测站”（National Internet Observatory）的研究项目收集的桌面端浏览器数据，参与者是知情同意安装了浏览器插件的美国成年人；以及
    2025 年 7 月到 2026 年 6 月美国媒体发表的 78542 篇关于 AI 的新闻报道。


    报告发现，女性更少使用 AI，对 AI 的信任更低，在职场得到的 AI 支持更少。在关于 AI 的公共讨论中，女性的声音几乎听不见。


    # 使用：用得少，还是用得浅？


    在问卷调查中，29%的女性说自己从未用过 AI 工具，而男性的数字是 22%；说自己“经常使用”的女性只有 16%，男性则有 25%；会自己搭建 AI 工作流或自动化流程的，女性
    3%，男性 5%。各项差异都有统计显著性。


    不过，通过浏览器插件收集的数据显示，从 2024 年 7 月到 2025 年 12 月，“至少用过一次 AI 工具”的女性和男性比例几乎同步上升，到 2025
    年底都在六成左右，两者之间没有统计上的显著差异。但是，在用'
  merge: -1
  img_proc: true
- pgno: 2
  md: 'AI 的人当中，男性花在 AI 工具上的时间占其浏览时间的 4.6%，女性则只有 2.9%。


    ![](img/186a4c29e85a50c37b46b26981bb031a_2_0.png)


    这与皮尤研究中心今年 6 月的调查数据是一致的。皮尤发现，美国成年人中用过 AI 聊天机器人的比例从 2024 年的 33% 升到了 2026 年的 49%，男女之间的差距已经消失。但每天都用
    AI 的男性有 27%，女性则只有 20%。ChatGPT 的使用率男女相同（都是 44%），而 Gemini、Copilot、Grok、Claude 这些工具，男性的使用率都明显高于女性。


    也就是说，“有没有用过”的差距正在消失，“用得多不多、用得深不深”的差距还在。


    那么，美国之外的情况呢？哈佛商学院教授 Rembrand Koning 等人今年 5 月修订的一项研究汇总了 100 多个国家的 76 个数据源，涵盖约 31.9
    万名受访者。他们发现，全球来看，男性使用生成式 AI 的比例是 47.8%，女性是 39.3%。这个差距一开始逐渐缩小，但从 2025 年初开始就停在 16%
    左右不动了。


    Koning 此前接受采访时提到肯尼亚的一项实验：约 1.7 万名创业者得到同样的'
  merge: -1
  img_proc: true
- pgno: 3
  md: 'ChatGPT 使用机会和同样的指导，女性尝试的可能性仍然低 13%。他的解释是，女性更担心用 AI 被视为作弊，也更担心被人认为自己缺乏专业能力——女性如果被认为缺乏专业知识，会受到更大的惩罚。


    不过，Shorenstein 中心报告的问卷并不支持这个解释。在不常用 AI 的人中，被问到原因时，“担心别人因为我用 AI 而评判我”排在倒数，只有 5%
    的女性和 6% 的男性选了它。排在最前面的是隐私（女性 40%，男性 34%）和不信任 AI 给出的信息（34% 对 30%）。


    # 知识：自信的男性


    在问卷中，研究者问了 12 道关于 AI 的事实题。女性平均答对 6.3 题，男性 7.1 题。看起来男性懂得更多，但答错的题数两者相差不大（女性 1.6，男性
    2.0），真正拉开差距的是选“不确定”的题数：女性平均 4.0 题，男性 2.9 题。


    研究者又设计了一个小测试：列出 12 位 AI 领域的知名人物，再混进两个编造的、听起来很普通的名字（Susan Millner 和 Craig Dalton），问受访者认识哪些人。结果，男性更可能声称认识名单上的每一个人，包括那两个根本不存在的人。


    报告的结论是，所谓的性别“知识差距”，有一部分可能反映的是男性更高的自信，甚至过度自信，而不是更多的知识。


    这项测试还附带揭示了另一件事：在 AI 领域真实存在的人物里，最具知名度的女性'
  merge: -1
  img_proc: true
- pgno: 4
  md: 'Daniela Amodei（Anthropic 总裁）也仅被49%的受访者认出，比名单上最不被认出的男性（黄仁勋和 Dario Amodei，各 50%）还要低一点。李飞飞和
    Mira Murati 的辨识度各为 46%——和那两个编造的名字一模一样。


    谁能提供关于 AI 的准确信息？不存在普遍被人相信的人或机构。信任度最高的是技术专家（女性 32%信任，男性 40%），记者和新闻机构只有 9%和 11%。23%的女性说名单上的谁都不信，男性的数字则是15%。


    那么，职场能不能改变这些？报告发现，无论男女，所在的公司鼓励用 AI、提供 AI 培训、有人带着用，都与更高的使用率、更强的信心和更高的感知价值相关。问题是，在职的女性比男性更不容易遇到这样的工作环境。


    # 报道：男性占 93.6%


    接下来是媒体报道部分。研究者通过 Media Cloud 抓取了一年里美国在线媒体的 78542 篇 AI 相关报道，从两个层面做了分析：标题里提到了谁，正文引用了谁。


    标题层面，他们从标题里抽出人名，保留出现在至少 5 条标题中的名字，再逐一人 工标注性别。结果是 253 个人，其中 219 名男性，34 名女性。按提及次数算，男性占全部标题提及的
    93.6%，女性仅占 6.4%——男性被点名的次数是女性的 14.6 倍。被提到最多的，当然是那些领导 AI 公司的男人。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '正文层面，研究者用大语言模型（报告注明是 Claude Sonnet 5）按照人工设定的编码表，给每篇报道引用或转述的每一个信源做了标注，一共 252233
    个信源。其中 49.2%是“专家”，也就是因其权威、职位或专业知识而被引用的具名个人。在这 124004 名专家当中，70.1%是男性，16.2%是女性，13.6%性别不明。也就是说，男性被当作专家引用的次数是女性的
    4.3 倍。


    如果把被引用的机构也算进来，所有“权威信源”中，机构占 50.1%，男性个人占 40.5%，女性个人只占 9.4%。也就是说，在 AI 新闻里，每十个被当作权威引用的信源中，不到一个是女性。


    说到这里，你可能会问：AI 公司的老板们几乎清一色是男性，媒体报道他们，数据当然就是这样，这能怪媒体吗？


    研究者想到了这一点。他们把所有因“职位”而被引用的人——高管、创始人、官员、投资人——全部剔除，只留下纯粹因为专业知识被引用的 16355 人。在这个群体中，女性的比例上升到了
    24.8%。差距缩小了，但仍然低于女性在 AI 人才中约 29.4%的比例（这个数字来自世界经济论坛 2025 年的数据）。


    这种优先选男性专家的做法，读者是能感觉到的：49%的女性和 44%的男性认为 AI 新闻和网络内容中男性的存在感更强。被问到多久会在 AI 新闻里注意到女性专家时，47%的女性和
    33%的男性回答“很少”或“从不”。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '关于记者为什么更容易找到男性专家，澳大利亚研究者 Kathryn Shine 等人去年发表在《Journalism Practice》上的一项研究提供了另一个视角。他们调查了
    220 名专家和发言人，发现男女接受采访的意愿都很高，但对男性来说，信心不足、担心被错误引用，并不会降低他们接受采访的可能性；对女性来说，这些因素会。女性也更多地担心骚扰、外貌，以及自己“不够有经验”。


    # 还有许多能做的


    报告的作者们在开头就说明：数据显示的这些差距并不意味着更多用 AI、更信任 AI 本身应该成为目标。问题在于，女性是否有平等的机会去理解和使用这些技术，是否对技术的开发和部署有平等的影响力，以及在围绕
    AI 的公共讨论中，是否有平等的可见度和权威。


    如何为女性提供更多的理解和使用的机会？已经有人在做了。


    规模最大的一类是科技公司主导的免费在线课程。微软和西班牙在线教育机构 Founderz 在 2025 年三八妇女节推出的 AI Skills 4 Women
    是一门约三小时的入门课，内容包括 AI 基础、提示词写作、伦理和数据分析，完成後可以获得微软的证书。第一期的目标是四个月内招到 1 万名女性，最终有超过 5.7
    万名来自 30 多个国家的女性完成了课程，2026 年推出了第二期，增加了医疗、教育、金融、人力资源等行业的具体用例。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '另一类是面向特定人群的深度项目。例如，Break Through Tech AI 就是本期这份报告的资助方 Pivotal 在 2022 年牵头投入
    2600 万美元创办的，由康奈尔科技学院、MIT 和 UCLA 承办，但招收对象主要是在纽约市立大学、加州州立大学等公立学校和少数族裔院校读计算机的女生，尤其是拉丁裔和黑人女性。项目为期
    18 个月，免费，包括一个暑期机器学习课程、一学年的企业真实项目、职业导师和 2000 美元的津贴。《纽约时报》2024 年的报道说，头两年完成项目的近 150
    名学生中，82%拿到了带薪实习，而全美应届毕业生的这个比例仅为 36%；2024 年 4 月有近 400 人毕业，下一年录取了约 1000 人。


    另一个例子是，联合国妇女署亚太办公室 2024 年 5 月开办了一所 AI 学校，面向女性政策制定者、公民社会组织、青年领袖和记者，其中“Access”轨道是三个月的每周课程，内容从提示词、自定义
    GPT 到低网络条件下的小模型，到目前为止已有 2000 多人参加。


    而在中国，也有不少针对女性的 AI 项目，例如“织码女巫 CodingWitch”就是其中的一个代表。


    对新闻业来说，可以改变的东西更具体。AI 公司的高管是谁，记者决定不了，但在报道里找谁来解读技术、评估风险、预测影响，记者是可以决定的。目前每十个被当作权威引用的信源，不到一个是女性，因此哪怕是多找一两个女性受访专家，都会很明显地改变现状。'
