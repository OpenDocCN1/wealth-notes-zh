  md: '安心。


    但是真正经历过一些事之后，我慢慢相信另一件事：决定一个人一生的，不是他用了多大的力气，而是他在那几个关键的瞬间，做了什么样的选择。


    努力依然重要。但请在你低头努力的同时，记得抬头看一看。看看身边的人、看看脚下的地，看看你正在错过的，看看正在到来的。因为那些真正能改变你命运的机会，一辈子也就那么几次。


    它们不会等你，但它们一定会来。你要做的，就是在它们到来的时候，认得出，也接得住。


