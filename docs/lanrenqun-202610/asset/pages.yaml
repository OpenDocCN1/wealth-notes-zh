  md: '我们为什么活得那么累？我想，很大一部分原因是，我们一边在跟世界的规则对抗，一边又责怪自己为什么对抗不过。


    我们以为人生的答案，是努力一点，更努力一点。但真正的答案，也许是先看清楚规则，再努力。


    这二十条规则，不会帮你跳过任何一段必须走的路。但只要理解它们，会让你的每一分力气，都用在对的方向上。特别是能让你不再被虚假的捷径所诱惑，也不再为那些无法改变的事情而内耗。这是一种清醒。


