- pgno: 5
  md: '而异。


    不管你选哪一种，这都不是一个可以“再说”的决定。它有生理上的窗口期，有心理上的窗口期，有关系上的窗口期。错过了，就没有了。


    很多人面对结婚生子这种事的时候，态度是非常奇怪的。他们会花一个月时间研究新手机怎么选，但在选伴侣这件事上，他们的判断常常是，差不多行了，年纪到了，父母催。


    这其实是一种巨大的失衡。我想提醒你的是，别小看这一次机会，这是大多数普通人一生当中，第一次完全由自己做出的命运选择。它考验的，是你够不够清醒。


    # 第二次机会：一次彻底的失败


    第二次机会，听起来不像机会。它叫失败。但这恰恰是我想专门拿出来说的原因。一个一生中，如果只经历过小挫折、小波折，从来没有遭遇过一次真正意义上的“彻底失败”，那他其实是危险的。


    因为他对自己的认知，是建立在沙子上的。他以为自己很厉害，很顺当，但他不知道这种厉害，有多少是靠运气、多少是靠平台、多少是靠自己。


    直到有一天，命运给了他一个耳光，可能是创业失败，可能是投资一夜归零，可能是被公司毫无预兆地裁掉，可能是被最亲近的人背叛。那一刻，他才会第一次清楚地看到自己。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '为什么我会说这是一次机会？因为人不是从成功里，而是从失败里长出骨头的。成功会让你以为自己什么都对。失败会逼你重新审视，哪些是我真正的能 力，哪些只是平台借给我的。


    哪些朋友是真的，哪些只是利益相关者。哪些方法是真的有效，哪些只是运气好恰好赶上了。


    这种审视，你一帆风顺的时候是做不出来的。因为人在顺境里，没有动力反思自己。心理学上有一个概念，叫创伤后成长。就是说，在经历重大挫折之后，相当比例的人不仅没有被打垮，反而会在五个维度上发生明显的成长：


    +   - 对生命的欣赏感增强；

    +   - 人际关系变得更深；

    +   - 发现了自己未曾意识到的内在力量；

    +   - 开拓了新的 人生可能性；

    +   - 形成了更深的精神或哲学认知。


    简单说，一场彻底的失败，常常是一个人真正成熟的开始。我把一次彻底的失败分成两种。


    第一种是事业上的彻底失败。创业失败、投资失败、被裁员、被否定。


    这种失败的好处，是它给你一次清零的机会。你被迫从头审视自己，重新理解什么叫做风险，什么叫做运气，什么叫做边界。我见过的所有真正厉害的人，几乎都有过一次甚至几次这样的失败。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '他们不是因为避开了失败才厉害的，而是因为经历过失败之后，还站起来了才厉害的。


    第二种是关系或健康上的重大打击。一次大病，一次大祸，一次至亲离世。这种打击，和事业失败不一样，它没有重新努力一次的余地。


    但是它会逼你回答一个你平时不愿意回答的问题：你到底想用剩下的日子，做什么？我认识的人当中，相当一部分是从一场大病或者一次至亲离世之后，整个人变了。


    不是变得消沉，是变得清醒。他们会不再纠结那些过去拼命纠结的小事，开始把时间花在真正在乎的人和事上。很多人是从这里开始真正长大的。


    这事我在这里和你说，你未必有体会。但经历过的人，一定会感受到这种转变。


    所以，如果你正在经历一场失败，我想跟你说一句，不要急着从这件事里走出来。慢一点。让它在你的身上多待一会儿。因为只有在它还痛着的时候，你才有机会看清楚一些平时被你忽略的东西。


    # ### 第三次机会：第一次离开舒适区的迁徙


    这是五次机会里，最被低估、又最容易被自己主动错过的机会。我说的迁徙，不是旅游，也不是出差，而是长期地，甚至可以说是连根拔起地，把自己从一个环境换到另一个环境。


    它可能是：'
  merge: -1
