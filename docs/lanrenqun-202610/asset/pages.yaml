- pgno: 4
  md: '因为数学是最脱离现实的东西，AI擅长的就是不需要和现实有联系的纯粹的形式逻辑。至于文科那些东西就不用提了，AI生成文科方面的论文速度更快。接下来，最可能发生的事情，就是"论文的恶性通胀"。


    在以前，一篇高质量论文通常同时传递两种信息：我们获得了一项新知识；署名者具备完成这项研究的能力。AI普及之后，你如何让别人相信，你的这篇论文不是AI写的呢？论文写得好，并不证明你的水平高，也可能是AI水平高。


    你发论文再多，其实也不能证明什么。对于审稿的期刊来说，涌进来那么多论文，根本看不完，那怎么办呢？必然是让AI来审阅。


    此时就出现了非常讽刺的一幕，研究者用AI生产论文，期刊用AI来审阅论文，从头到底就是AI和AI互相玩。


    AI的发展这么快，我觉得大家与其焦虑不如躺平，未来是一个物质极大丰富的世界（现在就已经产能过剩了），继续内卷的性价比会越来越低，但是一个人想要维持基本生存，其实花不了什么钱，比如现在的年轻人说什么：喝大水、睡大觉、炼薄肌。本质是年轻人不再执着于改变阶层，而是把有限的精力收回来，先管理好自己的身体和生活，这样才能不焦虑，不内耗。你想想，那些搞数学的学霸一样挡不住AI的进攻，你又急什么？


    未来最重要的技能是什么呢？我认为不是会做题，而是会出题。因为比会做题，你'
