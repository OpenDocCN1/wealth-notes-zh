    > 小懒判断 | 适合想看清全球 AI 竞争格局、判断中美路线差异的人；不适合找炒股标的或幻想 AI 马上改变生活的人。最值得关注的是三层竞争框架：美国巨头内战（Anthropic
    估值冲万亿美元）、中美体系对抗（美国拼奇点突破、中国拼规模渗透）、欧洲抢主权 AI——每层抢法完全不同。坑在于：伦敦办公室人均 230 万英镑年薪里 65%是股权，现金只有
    80 万英镑；且 AI 这波大概率有 2000 年互联网式泡沫，先破后立。


    # 全球 AI 竞争进入白热化（嘉宾供稿）


    前两天刷到一条消息，国内媒体转英国《卫报》的报道，Open AI 伦敦办公室，拢共 110 号人，人均年薪 230 万英镑，折合人民币两千多万，英国普通人千一年平均挣
    4 万镑出头，人家一个人顶 58 个，搞得我羡慕嫉妒恨。


    不过转头一想，法国还在搞街头暴动，心头又稍微好受点了。


    而且，这还是办公室的平均数，如果扣除行政、市场等那些陪衬岗位，真正拿超级高薪的那批做前沿模型的研究员，收入水平可能达到人民币亿级单位。'
