- pgno: 2
  md: '反正就是按过去几十年 a 股的历史，这个 C 点至少要到平均股价 17 附近才考虑是否止跌。


    这些分析都是基于熊市的走势，除非出现强势的熊转牛逆转走势，才能破局，这些我们只需要跟踪走势就可以了，心里做好计划预期，一步步跟踪市场走就行了


    ![](img/ca73ec470e62c59cca9c2bcd15ff3f13_2_0.png)


    熊市的特点其实很简单，那就是先砸坑-再反弹。再砸坑-再反弹，这样不断的重复，直到某一次的反弹强势突破压力位。


    所以我们去分析他就很简单了，每一次我们都按熊市去分析，等哪次分析不准了，反弹超过了预期，那就说明要熊转牛了，这样就能第一时间发现了。


    另外说下美股，美股现在的位置，熊市的趋势虽然还不明显，但是有一点，美股这个位置的性价比很低，也就是现在的位置买入美股，在未来亏钱的概率比赚钱的概率大。


    所以总体来说，a 股目前在走熊市，楼市也不行，俩大支柱集体萎靡，也就是大家手里的资产在不断的缩水，这种情况下，就属于经济通缩，这种情况一定要保证手上有现金流，减少不必要的开支，不要啃折'
