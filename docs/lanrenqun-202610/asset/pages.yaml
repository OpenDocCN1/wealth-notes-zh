- pgno: 6
  md: '等职。到这个阶段，他已经从一个地方证监局处长，变成重庆本地资本市场最有分量的金融干部之一。


    2024 年 8 月 31 日，60 岁的吴坚到龄退休。公告写得很正常。退休以后，不再担任西南证券任何职务。


    接替他担任西南证券董事长的不 是渝富老人，而是姜栋林。姜栋林此前长期在农业银行重庆系统工作，后来做到农行重庆分行副行长，又去农银金融租赁担任总裁。


    2024 年 11 月 15 日，他正式成为西南证券董事长。但西南证券的总经理，还是一位熟悉的重庆地方国资干部。杨雨松。杨雨松早年也干证券。


    华夏证券重庆分公司投行部。后来去了重庆港九。2006 年前后进入渝富以后，他在那里一干就是十几年。投资部经理助理、副经理、经理。


    投资管理部部长。产业事业部部长。金融事业部部长。党委委员、副总经理。还做过渝富资本董事长。期间兼任过重庆银行董事、安诚财险董事、重庆商社董事长。


    2023 年 10 月，杨雨松离开渝富，进入西南证券。当时吴坚还在。杨雨松接过总经理。吴坚继续担任董事长。一年后吴坚退休，杨雨松又一度代行董事长相关职责。


    然后到了 2026 年 5 月，杨雨松又被调回渝富，担任党委副书记、总经理、董事；6 月正式辞去西南证券总经理。渝富。西南证券。再回渝富。'
