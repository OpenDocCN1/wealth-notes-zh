- pgno: 10
  md: '这一招，直接打断了宜信的脊梁骨，“类固收”产品的发行通道被彻底封死，没地方盖章了，新产品发不出去，新钱进不来了。


    紧接着，2026年3月13日，国家金融监督管理总局约谈了宜信旗下的核心助贷平台“宜享花”，并列出了如下罪状：


    息费不透明、年化利率踩红线、虚假宣传、强制放贷、过度催收爆通讯录……这招敲山震虎，直接把跟宜信合作的商业银行和信托机构吓坏了，连夜提桶跑路。


    “宜享花”放款规模暴跌，母公司单季巨亏近9亿。


    至此，宜信的资金链彻底断裂，维持了15年的“零违约”神话，终于破灭。


    2026年5月22日，宜信突然宣布“类固收产品”启动“良性清退”，并全面停止兑付，波及近10万名投资者，资金缺口高达300亿至500亿元。


    拖了5个月后，10月11日，宜信发了一封致歉信，彻底摊牌：“资不抵债、底层资产质量极差且处置无果”。


    钱没了，账烂了，我还不上。


    第二天，唐宁和他老婆就被朝阳分局带走了。


    目前，这笔百亿债务已全面转入刑事追赃阶段。


    很多人唏嘘：像唐宁这么聪明的人，一个曾经担任过北京市互联网金融行业协会会'
