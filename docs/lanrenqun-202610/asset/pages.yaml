    > > 小懒判断 | 适合手里有仓位但总忍不住想“现在能不能抄”的人，这篇给了 12 条可跟踪的硬指标和阈值。不适合没做过 ETF/股指的纯小白——VIX、IM
    贴水、PCR 这些词不解释。最值得记的是执行纪律：没仓位 6~8 条红线触发才买底仓，有仓位等 10 条，作者自己 9 条动手。坑在于：指标是动态的（比如加息概率可能回落要摘掉红线），抄清单不跟踪等于没抄。


    这篇内容是公众号的付费内容。


    我们直接进入重点，这次的 12 个数据指标是什么以及对应的红线阈值是什么——全部都是我 20 多个小时分析后的结果答案。


    +   1. **中证 1000 VIX**：根据这次行情的区间范围，变动的红线阈值是 35

    +   2. **融资余额**：2.45 万亿杀到这里，就没有下杀的潜在利润，没有下杀利润，所以阈值是 2.45；如果完全没仓位、不想错过，这个数据可以修正到
    2.48

    +   3. **IM 贴水**：IC/IM 贴水瞬间扩大到 160，是恐慌盘出现的标志

    +   4. **大阴线 3 根**：这个是硬性指标，可以是 4 根 5 根，但必须要有 3 根；可以第二根'
