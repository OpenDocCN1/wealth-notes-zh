    # 2.小红书商品链接/店铺链接 监控系统


    ![](img/c3c9c159d06d09d1ee26d225987a38e8_4_1.png)


    之前除了会一点影刀，让我从零写一个完整程序，我基本不会。


    系统1的第一版大概两天做出来，系统2前后折腾了一个星期左右。都是我把需求讲给 Codex，一边跑一边改。


