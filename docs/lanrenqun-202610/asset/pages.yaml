  md: '子的自控力会高于平均值。但如果只有一方觉得好、另一方觉得不好呢？孩子的自控力反而会低于平均值。为什么？因为父母之间对祖辈态度不一致，本身就会成为日常冲突源，比如，“你妈老是插手”“你爸那套方法会把孩子惯坏”，而这些争吵消耗的，恰恰是孩子的情绪能量。


    咱们有句老话叫“家和万事兴”。这些研究相当于用数据证明，家庭关系是一个整体的生态系统，其中任何一段关系的质量，都会波及其他所有关系。第三，祖辈可以成为孩子情绪健康的“第二道防线”。巴里什认为，所谓的“情绪免疫系统”，也就是孩子面对负面情绪时的免疫力，这个免疫系统最依赖的不是“强度”，而是“冗余”。就像身体的免疫系统，不会只靠一道防线，它有先天免疫、有适应性免疫、有记忆细胞，层层叠叠。孩子的情绪健康也一样，他不能只依赖父母这个唯一出口。毕竟，父母总难免有失去耐心的时候，难免有“统一战线”批评孩子的时候。


    这时，祖辈就可以成为孩子的“第二道防线”。注意，这可不是说祖辈要“溺爱”孩子。巴里什想说的重点是，一个孩子，尤其是10岁以前的孩子，他的精神世界是非常狭小的，里面的角色很少，亲人占据着绝大多数。这时，只要一个“支柱”崩塌，孩子就会感觉到巨大的失落。但假如他的精神世界多几个支柱，情况就会好很多。


    借用巴里什的话说，“孩子需要生活中多一个个人愿意倾听他，让他感到不孤单，让他知道问题可以解决，关系可以修复，坏情'
