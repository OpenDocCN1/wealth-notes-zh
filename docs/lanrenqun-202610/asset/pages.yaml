  md: '而是一场关于谁定义下一个十年文明操作系统的战争。就像足球明星决定一场比赛输赢，顶级 AI 研究员决定一个国家十年后的生产力、军工、科研和产业形态，所以
    Open AI 肯发英超级工资，说到底就一句 20 多年前我们就家喻户晓的话。


    21 世纪什么最贵？人才！


    ——————分割线——————


