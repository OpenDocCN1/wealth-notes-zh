- pgno: 2
  md: '历放在一起回看，我对第一桶金有了更清楚的认识。


    第一桶金给我的第一个提醒，是要分清自己的能力和行业给的机会。那一阶段，我赶上了知识付费的行业机会，又有上一份工作积累的课程经验和合作资源。这些条件加在一起，让第一次创业比较顺。


    赚到钱以后，尤其需要把这笔账拆开：哪些工作是自己做得好，哪些条件来自平台和行业，哪些机会来自身边的人。如果环境变化，原来的结果还能不能出现？


    承认红利的作用，并不影响我知道自己擅长什么：课程策划、产品打磨、商务合作。但当时我对组织管理、销售团队和交付体系都还不熟悉，到了下一个阶段，仍然得从头学。


    第二个提醒，是趁机会还在，想清楚怎样让这门生意留下积累。做了一年多，我看到了撮合模式的限制：用户主要留在平台，老师和平平台一旦认识，下一门课就可能直接合作。自己要持续签新的老师、上新的课程，才能继续做下去。


    这门生意让我赚到了第一桶金，也让我看清了自己的位置。我在这次交易里有价值，但如果这种价值不能持续积累，下一次依然要重新找机会。


    窗口期里赚到了钱，能不能趁这个阶段，继续积累对用户的理解、产品能力和共同做事的人？


    所以我从合作过的老师中，选择了心理方'
  merge: -1
  img_proc: true
- pgno: 3
  md: '向，开始深入做一个 IP，逐步承担流量、私域、产品和交付。这个选择让业务变重了，也逼着我去学之前不会的东西。


    **第三个提醒，是赚到钱之后，仍然要愿意亲自做业务。** 这是我后来谈二次创业时反复提醒自己的一点：有了钱、经验和老板的身份，容易觉得某些具体工作不该再由自己做了，想靠投入资金、找人来解决所有问题。


    但一个新业务刚开始，用户需要什么、产品哪里有问题、模型为什么跑不通，经营者仍然要深入理解。人才和资源可以提供帮助，前提是自己知道要解决什么。


    所以今天再回看第一桶金，我更在意的是：看清这一次靠什么做成了，识别下一阶段还缺什么，然后继续下场补能力。这才接得上后面的千万级业务。


    # 二、千万阶段：从做一门课，到对一整条业务负责


    2020—2023 年，我做简曼 IP 项目。我的角色是一号位，负责整体经营，直接搭建和管理约 30 人的团队。


    这一次，我跟老师一起成立公司、做品牌和业务，开始深入做流量、账号、私域、产品与交付。


    这里还有一个重要选择：我没有选择收一笔服务费，替老师完成某项工作，而是作为共同经营项目的一方参与。我的回报跟项目联系更深，要承担的事情也随之增加。这种选择未必适合所有人，但它决定了我后面必须补哪些能力。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '以前，一门课程策划好、推给渠道，自己的核心工作就完成了很大一部分。现在，流量来了之后怎么承接、销售怎么做、客户买完之后怎么交付，都得有人负责。任何一段没接好，都会影响整个项目。


    这里面有不少东西，我原来不会。我后来在视频里讲过，第一次面试别人时，我比对方还紧张；第一次要处理裁员，也迟迟开不了口。


    账上有过经营成绩，面对这些事时，我依然是个新手。从百万到千万，需要重新学习的，包含这些过去根本没碰过的管理问题。


    我开始组私域销售团队，找销售主管、销售经理，学习销售机制，也从零学习教育业务的交付方式。当时在北京，我会找教育公司的同行交流，分别去了解投流、销售和交付。


    但学习同行时，我发现一个需要分清的差异：K12 教育常常是家长买单、孩子学习；我们做的成人和家庭教育，是家长买单、家长自己学习。看上去都是卖课，学习者、需求和交付内容却不同，做法需要重新适配。


    这段经历让我补上的，是对整条业务的理解。你可以熟悉某个环节，但作为一号位，必须知道各个环节怎么接起来，也必须把自己不擅长的部分补上。


    我现在理解的项目经营能力，包含找到合适的人、学习自己不懂的业务，以及让这'
