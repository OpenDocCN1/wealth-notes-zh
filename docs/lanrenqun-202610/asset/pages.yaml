  md: '# 搭了个 AI 内容工作台，把会议、录音、文档变成文案，一键推到公众号和 X（已开源）


    261016 副业 SC 精华

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/d4ad0d0698187569ac2c5e765f34c340_0_0.png)


    小懒判断 | 适合开会多、分享多但懒得整理记录、想做自媒体的人——三天零代码让 Claude 搭出内容工作台，从素材到公众号/X 草稿箱一条龙，已开源。最值得关注的是「学习我的写作习惯」那节：记录每次改稿反向完善规则，AI
    越用越像你。坑在于别直接抄仓库就想要同款文风，他的文风资料不在仓库里，得喂自己的旧文章。


    大家好，我是 Gary 曹滟，生财 AI 视频深海圈总教练，也是探索 AI 视频和内容出海两年的自媒体新人。


    本文主要分享我用 AI 搭的一个内容工作台：

    从收素材、找选题、起底稿、改稿排版，

    到推进公众号、X、知识星球的草稿箱，

    再到飞书留档，都在一个页面里做完。已开源， 开源地址：

    https://github.com/garycaogan/content-workbench


    我每天说的比写的多了，开会、直播、跟教练对齐、给圈友答疑，飞书妙记一天能录好几个小时，很多判断在会上讲得挺透，但真要写成公众号，就得自己回去翻妙记、翻文档，一篇文章光找素材就要半'
