  md: '# 换手机，换电脑：三个问题帮你少花冤枉钱


    261006

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/df16cbace5d13ae2d17bcb8a5b1c384f_0_0.png)


    小懒判断 | 正在犹豫国庆促销要不要换手机电脑的人最该看，给出的是决策框架不是购物清单。不适合刚买完设备或纯参数党。最值得记的判断：AI服务器抢HBM产能挤压普通DRAM内存，Mac
    mini起售价从4499涨到5999，"等等党"逻辑这两年失效了。坑在于"护眼"卖点：眼干眼酸多是眨眼变少的数字视觉疲劳，换屏救不了，蓝光伤视网膜临床也不支持。


    国庆期间，除了出去玩，估计很多人还在琢磨另外一件事，要不要趁着假期促销，给自己或者家人换个手机或者电脑。


    国庆原本就是数码产品的消费旺季。根据国家税务总局统计，去年国庆中秋假期，手机等通信器材销售收入同比增长了18.8%。而且每年的9月到10月，本来就是消费电子集中换代的时间。很多芯片厂商和手机品牌的秋季发布会，都集中在9月底，一批新品会在这个阶段陆续上市。


    那么，旧设备已经用了几年，新产品又刚刚出来，这一轮到底要不要换呢？关于这个问题，卓克老师主理的《科技参考5》里有不少内容，也许能帮我们做判断。'
  merge: -1
  img_proc: true
- pgno: 1
  md: '第一个问题是，时间，现在到底该不该买？


    消费电子行业长期以来有一个很明显的趋势，技术不断成熟，同样的性能会越来越便宜。所以，过去很多时候，“等等”大概率上是划算的。


    但卓克老师认为，这个经验现在未必管用。因为就在这两年，手机、电脑的部分关键零部件，它的价格逻辑变了。原因不难理解，出现了一个重要的新变量，AI。其中最典型的，就是内存。我们平时用的手机和电脑里都有内存，也就是
    DRAM。而 AI 服务器同样需要内存，而且需要大量使用一种性能更高的内存，叫 HBM，也就是高带宽内存。它的特点是可以在很短时间内传输大量数据，以此来支持
    AI 芯片的计算速度。


    但问题就在于，生产 HBM 和生产普通 DRAM，用的是高度重叠的厂房和设备。工厂短期内只有这么多产能，AI 服务器的需求越来越旺，厂商就会把更多资源投向
    HBM，普通的消费级内存，自然也会受到挤压。说白了，AI 会争夺很多相同的上游产能。


    就在今年 7 月，半导体市场研究机构集邦科技判断，受 AI 服务器需求持续增长等因素的影响，普通内存市场在 2027 年可能继续处于供应偏紧的状态。


    你看，苹果 M4 版 Mac mini 刚发布的时候，中国大陆起售价是 4499 元，现在起售价已经到了 5999 元。苹果调整 Mac、iPad 等产品价格，内存和存储成本上升就是其中一'
  merge: -1
  img_proc: true
- pgno: 2
  md: '个重要因素。


    **因此，卓克老师的建议是，如果设备确实已经到了必须升级的时候，就不要为了等一两个月的低价一直观望；而如果现在这台设备还能凑合用，也没必要因为听说以后还要涨，就恐慌性换机，可以把升级周期拉长一点。**好，到这一步，假设你已经想清楚了：确实该换，那么接下来第二个问题就来了，既然决定买了，哪些技术和指标值得多花钱呢？


    比如，屏幕。现在买高端显示器和电视，经常会遇到两种屏幕技术：OLED和MiniLED。那么，到底应该买哪个？这就要看两类屏幕大的特点。


    OLED，它最大的特点，是每一个像素自己发光。该黑的地方，像素可以直接关掉，所以黑色和明暗对比会非常漂亮。同时，OLED的像素响应也更快，高速运动的画面更容易保持清晰。


    而 MiniLED，本质上仍然使用液晶面板，但把屏幕后面的背光，分成了大量可以单独控制的小区域。它做不到 OLED 那样每个像素单独开关，但整体亮度可以做得非常高。


    所以，如果你的屏幕主要拿来打游戏、看电影，而且特别在乎黑色表现和高速运动画面的清晰度，那么 OLED 的优势就很明显。可如果屏幕放在光线很亮的环境，比如白天的客厅，需要很高的整体亮度，那么
    MiniLED 的优势就会变得重要。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '另外，还有一种很常见的场景，长时间办公。这时，Excel 表格、软件菜单栏、任务栏可能一天几个小时固定在同一个位置，这时候 OLED 还需要考虑长期显示固定内容带来的烧屏风险，MiniLED
    就没有这样的问题。


    再比如，AI 功能。最近一年，很多手机都把“AI功能”作为卖点。很多发布会都会重点强调“端侧 AI”“本地大模型”，暗示这是这一代手机最值得关注的升级。


    但卓克老师提醒，如果你换手机主要就是冲着本地大模型去的，现在还用太着急。所谓本地大模型，就是把一部分 AI 计算直接放在手机上完成，而不是每次都把数据传到云端再处理。这个方向当然有价值，但至少在现阶段，它还不是决定一台手机好不好用的核心因素。对大多数人来说，每天真正反复感受到的，还是手机快不快、拍照好不好、电池耐不耐用、屏幕舒不舒服，以及常用的软件和系统顺不顺手。相比这些基础体验，本地大模型真正能发挥明显优势的场景，目前还没有那么多。


    所以，不是 AI 功能不重要，而是“新”不等于“现在就值得为它换机”。好，这是第二个问题，关于参数。


    第三个问题，是很多人都在关注的，“护眼”功能，在电子产品里，这个功能到底值得你多花多少钱？


    首先，护眼这个需求是真的，但问题在于“护眼”这两个字。这两个字其实把好几件完全不同的事情装到了一起。有人说屏幕'
  merge: -1
  img_proc: true
- pgno: 4
  md: '伤眼，有人担心蓝光会损伤视网膜，有人用了某些屏幕会觉得头疼、不舒服、担心频闪，还有人看到一个护眼认证，就默认这块屏幕用了以后眼睛会更健康。


    但这些其实并不是同一个问题。卓克老师提醒，面对“护眼”卖点，先搞清楚它到底在解决什么问题。要知道，很多人长时间看屏幕后出现的眼干、眼酸、视物模糊，其实首先是用眼过度带来的“数字视觉疲劳”。常见表现包括眼干、眼酸、视物模糊等。目前的研究结论是，长时间盯着数字屏幕时，眨眼次数会减少，眼表会更容易干燥。


    换句话说，如果你的主要问题是每天盯屏幕八九个小时，那么换一块名字里带“护眼”的屏幕，并不能替你解决眼睛的问题。再比如，蓝光。现在很多产品会暗示，屏幕蓝光会慢慢损伤视网膜，所以最好买低蓝光产品。卓克老师说，对普通人来说，这个担心没有必要被放得这么大。目前，多项眼科科学研究都指出，正常屏幕使用时，人眼接收到的光照远低于实验中造成视网膜光化学损伤的水平。现在的临床证据也不支持把蓝光过滤产品，当成普通人预防屏幕眼部伤害的常规手段。


    当然，蓝光并不是完全没有影响。夜晚的光照确实可能干扰昼夜节律，影响褪黑激素分泌。所以临睡前少看屏幕、降低亮度、打开偏暖的夜间模式，这些建议都值得参考。但注意，这跟蓝光是否损伤视网膜，是两回事。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '还有一类问题，有些人觉得用某款屏幕会头疼，眼睛不舒服。卓克老师说，这种情况可能和频闪有关。频闪是指屏幕的亮度在极短时间内快速明暗变化，很多人察觉不到，但对于比较敏感的人来说，某些频闪方式确实可能带来不适。


    但是，感到不舒服，不等于屏幕正在对你造成什么结构性损伤。如果你发现某款屏幕用了以后就容易头疼，而换一块之后消失了，这时候可以考虑频闪控制更好的产品，或者采用直流调光的产品。但这也取决于个体差异，并不适用于所有人。


    总之，面对各种护眼认证，没必要走极端。一块屏幕通过了一些技术指标测试，不等于证明你盯着它看八个小时，眼睛就不会累。所以对普通人来说，解决了某个技术指标，不等于解决了你的眼部健康问题。


    最后，我们简单总结一下，挑选数码产品的注意事项。第一，看真实需求；第二，看使用场景；第三，看技术卖点到底解决了什么。挑选科技消费产品，重要的不是把所有参数都研究明白，而是每个功能到底在解决什么问题，以及这个解决方案是否匹配自己的需求。


    ![](img/df16cbace5d13ae2d17bcb8a5b1c384f_5_0.png)


    在这个 AI 能替你写代码、写文章的时代，基础技能正在迅速贬值。绝大多数人正被淹没在海量的免费垃圾信息里，陷入低效的体力内卷。


    当“努力”不再是壁垒，人与人之间唯一的'
