- pgno: 15
  md: '领导都是人情通透、心思敏锐的人，不用刻意直白讨要提拔，你的态度、心思、上进心，对方都能精准捕捉，只要你所作所为比较上道得体，领导自然会把你纳入后备考察名单。


    # 三是主动刷足公开存在感，打造积极上进人设。


    不少干部工作勤恳、默默付出，却常年低调隐身，干的都是领导看不见、群众不知道的幕后杂活，从不参与单位公开活动，久而久之在领导心中变成了透明人。真正聪明的做法是，在所有能公开冒头的场合，主动站出来、刷足存在感。各种文体活动、征文比赛、信息报送、学习培训，尽量主动参与，这些事情确实没有比较直接的好处，但是在领导眼里都是你积极向组织靠拢、心态阳光、上进靠谱、融入集体的体现，领导组织号召的事情你不去捧场，这不明摆着和组织不对付吗？


    # 四是保持长期稳定续航，经得起组织长线考察。


    单位职场考察干部，从来不是看一时一事的出彩，而是看两到三年甚至更长期的稳定表现。职场晋升是长线赛道，拼的不是一时爆发力，而是长久续航力。


    有人一时表现亮眼，却耐不住性子、沉不下心态，一次得不到提拔就心生抱怨、躺平摆烂；有人急于求成，为了岗位调整大动干戈、上蹿下跳，反而让领导觉得心性不稳、不堪重用。


    就像高育良说的，看，你又急！太着急了沉不住气，领导是很害怕这种情绪不够稳定的人的。和领导参加一些私人饭局的时'
  merge: -1
  img_proc: true
- pgno: 16
  md: '候，领导们对这种人往往都会非常不舒服，这种人很容易成为酒桌上领导口诛笔伐的共同对象。


    **五是打破固化思维，持续复盘反思，不断提高进步。**想要走上升迁快车道，最核心的是打破两种致命思维，就是学生思维和唯关系厚黑思维。很多普通人深陷学生思维，认为职场和校园一样，只要付出努力、做好本职、拿到好分数，就理所应当被认可、被提拔，把职场想得太过简单理想化，忽略人情、格局、规则、平衡等核心因素，最后只会满心委屈、原地内耗。


    还有一部分人陷入极端厚黑思维，一味迷信关系至上、人脉万能，认为只要送礼钻营、攀附领导，就能一路绿灯，完全忽视自身能力、工作实绩、个人口碑，最终要么踩纪律红线翻车，要么只能依附他人、走不长远。


    真正成熟的职场思维，是理性客观、内外兼修，既踏实做好手头工作，提高工作能力；也懂得看懂规则、维系人脉、提升情商；既不盲目苦干，也不过度投机。


    所以平时一定要坚持常态化复盘，客观审视自己的业务短板、性格缺陷、人际弱项、领导认可度，和同龄人横向对比，看清自己的位置和差距；不断跳出基层科员的视角，站在领导视角、全局视角看问题，提升格局、放大眼界，一点点补齐短板、优化处事方式，这些事情一点点改进进步以后，你的综合实力就不断提高了，职务提拔的事情自然就水到渠成了。'
