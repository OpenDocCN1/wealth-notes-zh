    > 小懒判断 | 适合正为''要不要让老人帮忙带娃''纠结、或把老人带娃只当免费劳动力的年轻父母；不适合想用这篇文章去说服老人带娃的人——通篇前提是祖辈''选择参与''。最值得关注的是那个细节：偶尔带孙和频繁带孙的认知益处相似，有参与就有益，双向滋养。坑在于只看到老人能带娃，看不到''情绪健康的分子''靠的是日常细小时间的积累，不是偶尔的惊喜。


    这周日是重阳节。这一天的含义原本有很多，古人也把它叫做“登高节”。为什么登高？因为重阳节是农历九月初九，而在古人看来，九是最大的数，而任何事物在到达巅峰之后，似乎就应该下降。于是，为了对冲这个盛极而衰的转折点，古人就会选择去“登个高”，比如爬个山之类的。


    去年的重阳节，我们专门讲过古人的视角。而今年，我们回到重阳节的现代视角。今天的人们普遍把这天当成“敬老节”。因此，我们今天的内容也围绕这个理解展开。我们要说的是，关于“长者”的一个关键的科学发现。确切说，是一项针对“祖辈参与家庭育儿”的研究。


    2026年6月，康奈尔医学院临床心理学教'
  merge: -1
  img_proc: true
- pgno: 1
  md: '授，肯尼斯·巴里什出了一本新书，叫《育儿与祖父母的艺术与科学》。主要说的是，祖辈在家庭育儿中的作用。


    注意，这并不是说，家里的长者就应该带孩子，祖辈当然有自己的人生主线，有自己的追求和节奏。我们今天不是在讨论“老人应不应该帮忙带孩子”，而是要呈现一个已经被科学证实，但很少被谈论的事实。这就是，祖辈对孩子成长的价值，被严重低估了。巴里什观察了过去
    30 年，大量美国的临床数据。他研究的是“实然”，而不是“应然”。有一个核心判断，很多美国青少年的心理问题，包括，焦虑、抑郁、药物滥用，这些问题之所以会出现，原因之一是，“大家庭参与的衰退”。他认为，“在人类进化的历史中，从来没有像今天的父母这样，在如此缺乏大家庭和社区支持的情况下独自养育孩子。”这句话听起来好像在说西方社会。但你仔细想想，一些中国一线城市的年轻父母，是不是也越来越接近这种状态？夫妻俩独自带娃，老人
    在老家，又或者因为别的原因，导致他们接触孩子的时间并不多。


    而巴里什的研究，大概包括这么三层意思。


    首先，祖辈在育儿上确实有局限。他们的育儿观念未必先进，可能会有各式各样的“老思想”或者“小毛病”。这放在全世界很多国家都一样。他们眼里的“梦中情孙”，在你眼里可能只是让人头疼的“BMI
    超标”。


    其次，祖辈在育儿上也确实有优势。比如，他们更有耐心，或者厨艺更好。'
