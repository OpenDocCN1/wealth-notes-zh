  md: '# 我是一个不折不扣的新人。


    我这人平时有个毛病：喜欢折腾各种开源

    AI 工具、提示词框架和小自动化脚本。看

    到生财很多圈友都在聊微信公众号改版后

    公域推荐量极大，贴图号门槛低、正反馈

    极快，我纯粹是带着一种“自媒体小白想试

    试看”的空杯心态报的名。


    当时我想验证的问题特别朴素；


    像我这样一个毫无自媒体图文经验的新人，

    如果把平时学的 AI 工具组合起来打辅助，

    到底能不能在微信生态里跑通一个最小的

    副业闭环？吸引我下场动手尝试的，主要

    有三个现实原因；


    +   1. 链路极短，专门治“想太多不敢发”的内耗


    做长视频或长图文，写脚本、找素材、

    剪辑、调色，往往一折腾就是好几天。很

    多人还没发出去，就在自我怀疑中放弃了。

    而贴图号极度简单：一张图配几十个字，

    当天发完当天就能看数据。发出去，让客

    观数据说话，没有任何内耗的借口。


    +   2. 极轻的生产要素，适合用来检验 AI 与人协作的成色


    它不考验复杂的剪辑或长文笔力，考验

    的是选图的直觉、对受众心理的揣摩，以

    及文字能否起到画龙点睛的作用。这种短

    小精悍的体裁，是检验 AI 提示词和工作流

    调校水平的最佳试金石。


