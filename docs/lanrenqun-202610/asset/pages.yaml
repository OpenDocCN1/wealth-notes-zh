- pgno: 5
  md: "Link 教练有 6-7 年的游戏开发经验，更偏向具体的技术落地。他和焦波哥一起提供技术支持，协助处理技术问题，把方案里的功能做出来。\n\n> 【昵称】Link\n\
    > 【自我介绍】\n> 计算机技术出身，前大厂游戏开发，生财有术传术师、航海家线下大课助教、AI 私教。\n> \n> 目前主要围绕三条线持续实践：\n>\
    \ - AI 产品：独立开发小程序、App、Web 产品及 AI 游戏互动项目，探索国内及海外市场\n> - AI 自媒体：持续输出 AI 编程、AI 产品、独立开发和一人公司相关内容，目前全平台真实粉丝约\
    \ 8000+\n> - AI 私教 / 企业服务：为创业者、电商老板等提供 AI 私教和落地陪跑，帮助把 AI 真正接入业务流程\n> \n> 【我能提供的资源】\n\
    > - Claude Code / Codex 等 AI 编程工具的深度使用与工作流\n> - 小程序、iOS / Android、Web 产品开发及出海经验\n\
    > - AI + 游戏、AI 互动产品、游戏研发相关技术与项目经验\n> - AI 自媒体从内容生产到账号冷启动的实践经验\n> - AI 私教、企业 AI\
    \ 落地和一人公司工作流经验\n> \n> 【我需要的资源】\n> - AI 出海产品的获客、增长和商业化渠道\n> - 海外内容、自媒体矩阵和流量增长经验\n\
    > - AI 产品、游戏、内容方向的合作机会\n> - 独立开发者、AI 创业者之间的同频交流和互相\n\n我主要负责项目成交后的需求沟通与具体落地，以及后续产品的市场化推广。我需要了解客户各个岗位上的人实际怎么工作、具体需要什么，以及他们对交付有什么要求。不能只听老板说想做一个什么系统，还要跟实际使用的人把事情问清楚。\n\
    \n# 销售：针对 3 个不同客户，截然不同的 3 种卖入过程\n\n后来复盘时，飞鱼哥说：“销售有 10 多种模式，但 99% 的人只会两种。”\n\n\
    一种是产品型销售，介绍产品的功能、特征和优势；另一种是菜单式销售，把自己有的东西列出来，供客户选择。"
