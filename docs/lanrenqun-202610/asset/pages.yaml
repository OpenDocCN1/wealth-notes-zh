    5 日区间可 能就要继续扩大。


    尽管如此，从过去两年的数据来看，这几 天的波动属于一次级别不小的市场震荡。 然而，从这两个指数的波动历史规律来看， 这几天的盘面震荡并非有显著的统计意义，
    因此也和这两天在各大微信群里观察到的、 交易员纷纷喊"崩盘"的体感不尽相符。如 果要考虑到 2015 年泡沫破灭后的盘面、 2020 年疫情时期的盘面，那么这几天的动
    荡真的是小巫见大巫了。同时，盘面越动 荡，市场出清的速度也将越快。这时，那 些没有持仓能力的交易员开始斩仓抛售， 悲观的情绪得到充分的宣泄。换言之，恐 慌情绪在这样的时间段里并不能帮助到任
    何人——除了那些跃跃欲试的想抄底的交 易员。


    # 美债收益率飙升的真凶：不是通胀


    当然，如果现在要抄底，那么必须要对于 美债收益率的走势有所判断。从最近的盘 面观察来看，只要中东局势紧张，就会出现油价突然在盘内飙升，而导致美债收益 率大幅上行的局面。这种情况出现的一种
    解释，是油价的飙升导致了通胀预期的上 升，从而引领美债收益率的飙升。这种看 法，我们不能苟同。


    如果看看美国的通胀预期，其实是相对稳 定，并没有出现太大的变化。也就是说，'
