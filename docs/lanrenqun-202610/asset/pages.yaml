  md: '# | OPC 工作台 六大类业务与功能需求


    | 大类 | 细分类别 | 具体职业/经营者 | 工作台核心功能需求 |

    |---|---|---|---|

    | 01 个人咨询与陪伴 | 疗愈与身心体验 | 领航疗愈师、冥想引导者、身心灵课程导师 | 客户档案 集中记录客户背景、环境和服务历史。 |

    | 01 个人咨询与陪伴 | 心理咨询 | 独立心理咨询师 | 预约排期 安排服务时间，管理流程并提醒双方。 |

    | 01 个人咨询与陪伴 | 人生与职业发展 | 人生教练、职业规划顾问、个人优势解读顾问 | 服务记录 整理每次服务内容、服务过程和后续事项。 |

    | 01 个人咨询与陪伴 | 情感与婚姻服务 | 情感陪伴顾问、脱单顾问、婚恋服务经营者 | 计划与跟进 制定服务计划，记录执行反馈，提醒回访。 |

    | 01 个人咨询与陪伴 | 管养与体型管理 | 私人营养师、减脂教练、健身私教 | 管理与续费 管理服务周期、剩余次数、收费和续费。 |

    | 01 个人咨询与陪伴 | 家教教育 | 家教教育顾问、亲子关系指导者、学习规划师 | 隐私与权限 控制敏感资料的查看、分享和删除。 |

    | 02 教育培训与知识服务 | 求职与升学 | 简历顾问、求职陪跑教练、高考志愿填报顾问 | 学员档案 记录背景信息、学习目标和已办服务。 |

    | 02 教育培训与知识服务 | 求职与升学 | 简历顾问、求职陪跑教练、高考志愿填报顾问 | 课程与资料库 统一管理教材、课件、案例和指导模板。 |

    | 02 教育培训与知识服务 | 技能教学 | 外语老师、语音陪练、书法国画老师、考试辅导导师 | 排课时间 安排课程，记录出勤和剩余课时。 |

    | 02 教育培训与知识服务 | 技能教学 | 外语老师、语音陪练、书法国画老师、考试辅导导师 | 作业与反馈 收集作业成绩，提供改进和调整信息。 |

    | 02 教育培训与知识服务 | 知识付费与会员业务 | 专业课程讲师、培训营主理人、付费社群主理人、知识星球主理人 | 学习进度 追踪学员任务与完成情况，生成学习回顾。
    |

    | 02 教育培训与知识服务 | 知识付费与会员业务 | 专业课程讲师、培训营主理人、付费社群主理人、知识星球主理人 | 权益与续费 管理权益权限、会员期限和续费提醒。
    |

    | 03 生活与线下体验服务 | 宠物与生活指导 | 宠物活动服务者、遛狗指导师、整理收纳师 | 客户与需求 记录服务对象、地址、偏好和特殊要求。 |

    | 03 生活与线下体验服务 | 上门生活服务 | 上门搬家服务者、美甲师、家庭整理服务者 | 预约与报名 管理服务类别、活动名称和报名名单。 |

    | 03 生活与线下体验服务 | 上门生活服务 | 上门搬家服务者、美甲师、家庭整理服务者 | 拍摄与资源 安排时间、场地、工具和合作人员。 |

    | 03 生活与线下体验服务 | 摄影与影像服务 | 婚拍摄影师、景点拍摄摄影师、宝宝摄影师 | 服务与支付 用清单追踪进度、核对和完成确认。 |

    | 03 生活与线下体验服务 | 旅行与活动服务 | 旅行线路定制师、旅游小团组织者、亲子游组织者、同城活动主理人 | 收支与结算 记录定金、尾款和成本，核算单笔收支。
    |

