  md: '如果9月10日才开始慢慢研究、做产品、做封面、做十几篇库存内容，很可能还没全部发出去，最大的需求窗口就过去了。


    另外，数据好不代表这个商品就能直接做。尤其虚拟资料，版权、授权、平台类目、交易规则都需要自己确认。


