  md: '图，去走真实的路。你以为努力就该被看见，你以为对别人好别人就该回报你，你以为道理讲清楚了对方就会被说服。


    可现实并不照着你的地图运行。真正成熟的标志，不是捍卫自己的地图，而是愿意在现实打脸时，老老实实地更新它。地图错了就改，这比死守一张漂亮但失真的地图，重要得多。


    16.结果不等于决策质量：好决策可能撞上坏运气，坏决策也可能撞上好运气。一个酒后开车的人平安到家，不代表酒驾是对的。一个深思熟虑的投资亏了钱，也不代表当初的决定就错了。


    结果里，永远混着决策和运气这两样东西。可我们偏偏习惯了用单次结果，去反推对错。赢了就觉得自己英明，输了就全盘否定。


    这会让你从“侥幸的成功”里学到错误的经验，也会因为“倒霉的失败”而放弃正确的方法。评价一个决定，要看它在长期、在大量重复下的期望值，而不是这一次的输赢。


    把过程和结果分开看，是理性的起点。


    17.偏差源于省力：我们的种种认知偏差，本质上是大脑在节省能量。大脑最爱的是省电模式。


    它讨厌费力思考，于是发明了大量捷径：只看符合自己想法的证据（确认偏误）、对损失的痛苦远大于同等收益的快乐（损失厌恶）、宁愿要眼前的小甜头也不要将'
