  md: '实际参与之后，我看见了需求沟通后面连着程序员的时间，也连着客户最后拿到的东西。我不能只把客户的话转发给 Link 教练，然后等他做完。前面没问清楚的事情，到了开发时还是会找回来。


    亲和力能帮助我和客户聊起来，但要把事情问清楚，还需要业务理解、逻辑和提问能力。这些是我接下来要认真练的。技术有伙伴一起做，我也需要把自己负责的需求沟通、落地和后续推广承担起来。


    # **这次实战，让我知道下一步该练什么**


    回头看这三个项目，我们调整过方案，也放弃过一种合作方式；收到定金后，做早了一些功能，又重新收敛了开发重点。第一单还没交付完，但这些已经是我们一起做过、需要认真复盘的事情。


    对我来说，这次少了一些“等准备好再开始”的纠结，也开始知道自己具体缺什么。跨境项目让我看到怎么站在顾问的位置理解业务，护肤项目让我学着算双方的投入和收获，疗愈项目让我亲自面对需求沟通，也开始考虑一次交付能留下什么产品。


    如果你也会用一些 AI，却不知道能拿它做什么生意，可以先找一个你接触得到的人，问问他每天在忙什么、哪件事最费劲。能帮他把其中一件事做好，就是一个值得认真做下去的开始。


    也分享飞鱼哥的精华帖《因热爱而工作，因投入而擅长，因专业而盈利》，这篇帖子打开了我的新视野，觉得好的话可以帮'
