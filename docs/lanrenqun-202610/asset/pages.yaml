  md: '# 如何看待 AI 让数学家集体破防？


    261025 端宏斌

    整理：公众号懒人搜索，懒人专属群精选

    懒人微信：lazyhelper1


    ![](img/5fe507ad62cdefd7719595e6e0b1f5c1_0_0.png)


    小懒判断｜适合关心 AI 对高智力岗位冲击、担心孩子苦读书还值不值的人；不适合找具体投资标的人——这篇是认知文不是荐股文。最值得关注：AI 最容易攻破数学的原因——纯形式逻辑、脱离现实，这正是
    AI 的强项。坑在于：以为"会做题"还有安全感，未来值钱的是会出题、让 AI 做题收益归你。


    老端注：本文内容纯手搓，不过图片是 AI 生成的。文/端宏斌


    马上最近学术圈出了一件非常搞笑的事情。


    在某一场数学研讨会上，著名数学家陶哲轩说："我正处于战时状态。"而进攻方就是 AI 了。他说，AI 正杀死数学百年开放传统，现在已经不存在规则了。有意思的是，陶哲轩是最早一批使用
    AI 进行数学研究的学者，大约从 2023 年开始，他就高强度使用 AI 做研究，OpenAI 公司也开放了最先进的模型给他使用。对于现在自己会"跳反"，他解释说，因为自己被利用了。他还说，OpenAI
    急于发布新成果的行为，暴露了其真实意图。他认为双方已经没有进行建设性合作的可能。我们该如何理解陶哲轩对 AI 的反叛呢？先来看一幅'
