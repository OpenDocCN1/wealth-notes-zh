  md: '长，多次随团出席 APEC 会议，被媒体誉为“金融科技”的领军人物，一个曾经写过深刻的风控文章，提出“欺诈风险、道德风险、操作风险大于信用风险”精辟论断的人，为什么会在这
    20 年的职业生涯里，一直干这种“借新还旧”的蠢事？


    因为潘多拉的魔盒，一旦打开，就关不上了。


    人心不足，蛇吞象。


    P2P 行业的野蛮发展与随后的崩盘，写满了整整一代人的血泪，很多家庭就此垮掉，引发了高管跑路或入狱、暴力催收等大量恶性事件，极端案例中，甚至有受害出借人因无法承受数十万的损失与维权压力而自杀。


    而在人类历史上，高利贷从来就不是互联网时代才诞生的新事物。


    早年是民间私贷、钱庄放款，后来披上集资、民间借贷的外衣，再后来是 P2P、助贷。看似是互联网金融创新，本质只是把古老的高利贷模式搬到线上。


    那么，普通人要如何避免掉入这样的金融陷阱呢？


    很简单，记住一句话：凡是承诺保本高收益的理财，全是陷阱；凡是 5%以上利率的金融产品，不要碰！


    分割线


    绝大多数人只盯着眼前的工资，却不知道'
