- pgno: 3
  md: '把美债收益率的上升归因于通胀压力，其实数据上是无法自圆其说的（图一）。如果美债收益率的上升并非通胀预期飙升而导致，那么其它的两个因子，也就是美国的实际利率和期限利差的变化，就值得研究一下了。


    图一：美国通胀预期稳定；美债收益率飙升主要是实际利率和期限利差导致


    ![](img/cc12a937f0eaa49ecf2c24d141cb0666_3_0.png)


    今年年初以来，美债实际收益率上升了大约100个点，这主要是因为美国的经济增长在巨额的 AI 资本支出的推动下非常强劲。按照美国财长贝森特的说法，美国经济很可能增长在3%以上。因此，现在美债的实际利率飙升到3%左右，其实是美国经济增长强势的一个反映。也正是由于经济的强势，包括就业情况良好和制造业持续超预期等情况，市场计入美联储快速加息的预期。其实我早已在之前的专属报告里和我的星球上，就讨论过美联储在强劲的增长背景下加息，对于市场其实是一个好的消息。一般来说，这种增长背景下，美联储必须要加五六次息之后，市场才会开始有负面的反映。


    至于期限利差的扩张，反映的是市场对于美国财政困境的担忧。因此市场参与者需要更高的期限利差来弥补持有美国长债可能遇到的偿付风险。然而，从近期美债收益率的飙升而美元也同时走强，以及美债'
  merge: -1
  img_proc: true
- pgno: 4
  md: '长债拍卖的情况来看，外国投资者的买盘其实是非常旺盛的。而美债 ETF 在最近几周则出现了破纪录的散户资金流入。也就是说，国际投资者对于美债和美元资产的信心并未崩塌，反而开始逢低加持美国国债。如是，期限利差的扩大短期很可能已经充分计入了美债的信用问题。从信用利差来看，美债的信用利差和公司债还是非常单薄，并没有体现投资者对于
    HyperScalers 债务的担忧。其实，如果美债不能持有，那么这个市场里其实也没有什么其它的资产可以持有的了。


    如果期限利差的叙事有问题，而实际利率的飙升是因美国经济的强势所引致，那么这轮美债收益率的上攻，很可能也很快将进入强弩之末。如是，美债收益率飙升对于风险资产的压抑，也将很可能很快开始边际消退。话虽如此，我们也不得不承认美债收益率的技术形态非常地牛气冲天，大有鱼跃龙门之势。但我们的另一些周期模型则显示美债收益率短期应该开始进入了顶部区域。这两种截然对立的分析结论，降低了交易赢面——虽然我们认为美债收益率已经运行到了短期的顶部。因此，虽然美债相对于美股的投资吸引力在增加，交易员如果要做左侧的话，就必须要有颗粒强大的心脏和一副好的肠胃。


    # 半导体周期继续回落，恒科有望修复


    与此同时，我们独有的半导体周期指标从我们预测的六月中旬见顶之后，继续从高位回落。这种周期见顶而产生的趋势逆转，根据历史经验，势必将进行到底。值得注'
  merge: -1
  img_proc: true
- pgno: 5
  md: '意的是，在周期下行放缓的时候，半导体公司的盈利将继续增长，但是这些公司的盈利增长势头和速度将边际放缓，甚至显著放缓。这时，这些公司的体量和盈利的绝对量将继续增长，而在未来两三年存储需求看似仍将持续强劲的情况之下，这种绝对值的增长大概率将持续，但是他们的速度将放缓，尤其在一个高基数的基础上。如是，这些股票很难像今年上半年那样走出如此亮眼的行情，虽然局部间歇性的交易行情肯定还是有的。


    ![](img/cc12a937f0eaa49ecf2c24d141cb0666_5_0.png)


    如果美长端收益率运行到了一个短期的顶部或者上行阻力位，那么根据历史相关性来看，恒科的压力将有所放缓。历史上，恒科由于其平台的属性，一直与美国的软件板块关联密切，一直到今年七月之后。那时，美债收益率上行、价格下跌继续压抑恒科；而由于增长前景确定同时市场对于HyperScaler的资本支出的担忧暂时有所缓解，美国软件板块和恒科的走势开始分道扬镳。我们认为，这种相关性的背离应该是特例而不是普遍的现象，如果美债收益率上行势头得到缓和，那么美国的软件业将继续有所表现，而恒科也将有所修复。'
