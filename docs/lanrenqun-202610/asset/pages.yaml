- pgno: 16
  md: '一门业务属于哪个阶段，得看它现在的实际情况。MATLAB 曾经是我经过验证的收入来源；产品包含不少探索；Codex 教学经过初步测试，正在继续验证。具体哪一项以后成为主要收入，还要由持续的结果来说明。


    至于未来种子，也不是一个已经想好名字的新项目。有时候，只是一个值得弄清楚的需求，或者一种可以小范围试验的交付方式。


    我现在理解的并行，是在经营眼前业务的时候，给下一步留出适当的时间。已有的收入来源要照顾好，新尝试需要明确投入的范围。最早期的想法，先做足以回答一个问题的小实验。


    几种事情的分量可以不同，也应该不同。


    对刚起步的人来说，最紧要的可能就是先建立一份可靠的收入。对上班的人来说，当前工作和专业能力同样值得认真经营。未来的准备可以从学习和小规模实践开始，没必要一口气把自己变成三个项目的负责人。


    我从这个框架里得到的提醒很实际。今天有钱赚，要珍惜；至于以后靠什么，也要趁自己还有余地的时候想一想。


    # 三、如果今天重新开始，我会怎么选项目


    写到这里，也想聊聊给刚开始做事的朋友的一点建议。


    我能讲的，主要来自自己走过的路。休学、'
  merge: -1
  img_proc: true
- pgno: 17
  md: '做 MATLAB，再回学校，这些选择跟我当时的条件有关。你有自己的生活安排，没必要为了证明自己敢干，把别人的经历重新演一遍。


    如果让我今天重新开始，我会先把注意力放回自己身上，看看自己现在有什么条件，又能做好什么。


    # 一）认识自己，选准起点


    选项目的时候，很容易先看别人。看到一个人做得不错，就去研究他的产品和报价，顺便算一算，自己照着做能挣多少。


    这很自然，谁看到机会都会想试试。


    可是，对方现在展示出来的东西，未必包含他此前积累的经验。你看到他把事情做得很轻松，可能是因为其中最难的部分，他早就花过时间啦。


    我做 MATLAB，也跟自己的专业背景有关。我对编程有接触，愿意研究 AI，后面又花时间做需求、交付和教学。这些条件放到一起，才有了后来的结果。


    别人如果没有这些积累，直接照着一个项目名称开始，遇到的困难就可能不同。适合我的起点，放到另一个人身上，也许还需要先补一些东西。


    所以，我会先列一下自己实际做过的事情。哪些任务，别人已经愿意来找我帮忙？什么问题，我能够独立解决到最后？还有一些东西，虽然暂时谈不上擅长，但我确实愿意持续研究，也可以拿出来考虑。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '这里要诚实。看过教程，和自己做过一次，差别很大。跟着示范做出来，离换个条件还能完成，也有距离。


    同时，也看看自己的生活条件。每天实际能拿出多少时间，眼前有没有必须承担的开销，都会影响项目的选择。暂时需要稳定收入，就优先考虑自己能够接得住的工作。需要长期学习的方向，可以另外安排时间。


    ![](img/0c8ca19dd7a332f6d7013b698eb00a7d_18_0.png)


    有时候，计划做不完，是因为安排的事情太多。每天只有两小时，却给自己排了一整天的活，当然很难坚持。


    # 二）接触用户，确认需求


    有了大致方向，我会去了解别人正在怎么做事。


    可以问对方，你现在怎么解决这个问题？哪里最麻烦？这样比问“我做这个，你会不会用”，更容易了解他的实际需求。


    因为听起来不错是一种态度，愿意把真实任务交给你，是更具体的行动。后面愿不愿意付费，还要单独验证。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/0c8ca19dd7a332f6d7013b698eb00a7d_19_0.png)


    这也是我做 MATLAB 时学到的。客户有一个明确任务，交流就能围绕这个任务展开。要求问清楚以后，才好判断工作量、自己的能力，以及能不能接下来。


    有些事情，自己在脑子里想的时候很简单。一旦要向别人说明做什么、怎么做、最后能得到什么，原来没想清楚的地方就会出现。


    所以，做新项目可以先走到这一步。找到一个自己理解的人群，跟他们聊正在发生的事情，看看自己能不能帮上忙。


    产品也可以这样开始。先弄清楚一个问题是否值得解决，再决定做哪些功能。如果连最初这批可能使用的人在哪里，都没有想清楚，继续完善功能未必是当前最值得做的工作。


    我对产品的兴趣仍然在，但以后会更在意这个顺序。先接触需求，再决定要做多大的东西，能少一些自己跟自己聊得很兴奋的时刻。


    # 三）小步尝试，算清投入


    从零开始，先完成一件范围清楚的事情就够了。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '可以只服务一类人，先处理一种问题。开始前，把包含什么、最后交付什么说清楚，避免一边做一边发现，双方想的根本不是同一件事。


    完成以后，再去看看实际使用情况。对方拿到了成果，是否真的能用？有没有哪一步仍然需要反复找你？这些反馈，会影响下一次怎么报价、怎么安排交付。


    我说的从零到一，也包括这些具体环节。有人愿意付费，自己能够完成，对方拿到以后用得上，这个过程需要实际走一遍。


    做了一段时间，还要停下来检查一下。


    如果始终联系不到合适的人，就先解决接触用户的问题。有人愿意聊却没人愿意付费，就重新看看需求是否足够重要，以及自己提供的方案是否合适。


    还有一种情况，钱能收到，但每次交付都超出预期，占用时间越来越多。这时就要检查服务范围和做法。哪些事情承诺太多，哪些步骤可以提前准备，都值得重新整理。


    钱和时间，得放在一起算。


    我以前学剪辑，花了七千块买课程，后来靠剪视频赚了三千多。赚到钱了，但当时连课程钱都没收回来。'
