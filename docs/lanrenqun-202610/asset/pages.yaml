  md: '不去维持它，它就一定会衰退。


    不是因为你不够好，这是规则。


    # 2.复利：微小但能持续的优势，会在时间里指数放大。


    我反复讲过复利这个概念，我想关注缸中之脑的大多数读者已经耳濡目染。


    但它的反方面同样成立，而且更可怕：一个微小的坏习惯，也会经过复利，变成一场灾难。每天进步 1%，一年后是原来的 37 倍；每天退步 1%，一年后只剩下 0.03。


    差距就藏在这两个看起来差不多的小数里。真正决定结果的，往往不是强度，而是方向×时间。方向错了，越使劲亏得越多。方向对了，哪怕慢，时间也会替你把它撑大。


    # 3.临界点：世界不是匀速前进的，质变往往发生在最后一刻。


    水加热到 99 度，看上去和凉水是没什么两样的，因为它就是不沸腾。直到 100 度，才会一下子轰然汽化。


    人生里大部分有价值的事，回报曲线也都长这样：先平后陡。前面很长一段时间，你付出了，几乎看不到任何动静。于是，绝大多数人，恰恰是在那个即将到来的临界点之前，因为看不到什么希望，就放弃了。


    他们不是输给了困难，而是输给了那段必须熬过去的、毫无反馈的平台期。


    # 4.反馈延迟：因和果之间，常常隔着很长的时间。


    你今天的身材，是过去几年饮食'
  merge: -1
  img_proc: true
- pgno: 5
  md: '和生活习惯的果；你今天的能力，是过去几年持续积累的果；你今天踩的坑，可能是几年前某个不起眼的选择埋下的因。


    因果成熟，会自然脱落。但正因为因果之间隔得太远，我们才会一次次上当。


    那些即时很爽、长期有害的事，比如说熬夜、刷手机、借钱消费，总是会伪装成好事，因为伤害要很久以后才会发生。及时的快乐里，往往藏着延迟的代价。


    学会把眼光放到几年以后，是对抗这条规则唯一的办法。


    # ### 5.均值回归：极端的状态，终会向平均靠拢。


    一支球队连胜很久，迟早会迎来一场败仗。


    不一定是他变弱了，而是超常发挥里，本就含有运气的成分，而运气，总会回归均值。反过来也一样，谷底之后，往往会反弹。


    所以这条规则给我们两个提醒：别在巅峰时把运气当成能力，也别在谷底时把低谷当成终点。


    那些大起大落就慌神的人，多半是不懂这一条。


    # ### 6.幂律：少数的因，贡献了多数的果。


    我们往往会觉得，付出和收获是平均的，付出多少，就收获多少。但真实世界，本质上是“幂律”的：20%的客户带来80%的利润，20%的努力决定80%的成果，少数几个关键决定，几乎塑造了你的一生。'
