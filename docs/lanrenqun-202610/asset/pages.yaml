    # 二、素材采集自动化


    我自己的飞书妙记每两个小时自动拉一次，录音在本机转文字，音频不出这台电脑。我还让它把我这两年在飞书里建过的 866 篇文档过了一遍，挑出 62 篇我自己写的、还没发过的，一起导入来当素材，到现在攒了
    89 条。


    每条素材进来，AI 会提炼出几个能写成公众号或者 X 的选题，每个选题下面都挂着我在素材里的原话，会议里分不清是谁说的话，只当背景，不当成我的观点，别人的话没有我点头，进不了稿子。现在攒了
    399 个选题等我挑，挑中一个，点“写成公众号”或者“写成 X”就行。


    ![](img/d4ad0d0698187569ac2c5e765f34c340_2_0.png)


    # 三、AI native 的编辑体验


    编辑器是所见即所得的，配图直接显示在正文里，我一眼就能看出图和字接不接得上，截图直接粘贴进来就是一张配图。顶上一排按钮，三级标题、加粗、高亮、引用、列表，AI
    起稿的时候会先排好一版，我觉得不对再自己调。'
