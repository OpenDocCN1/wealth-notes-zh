- pgno: 5
  md: '的信息和观点，但是这些信息和观点有赖于人的判断，这也是人类的领域。


    # 那么如何借助 AI 锻炼呢？


    小镇觉得可以通过每天与 AI 针对一个问题进行多轮对话，起码要经过五轮，但实际上可以进一步拓展，持续 20 轮以上就更好了。如果经过多轮对话，指出 AI 逻辑或事实错误，提供更多跨域关联信息，让
    AI 最终推翻自己一开始的结论，那就是非常好的问题思考了。


    但注意 AI 会倾向于顺着提问人，所以要尽可能找那种情绪价值给的不足的 AI 大模型，豆包肯定是不行的。


    # 多轮对话至少要包括五点：


    +   - 一是确定口径。让 AI 列出问题的关键概念、数据口径、样本、时间地域范围，把分歧定义出来。\n- 二是提供证据。要求 AI 给出原始信源，区分一手发布、二手转述、主观评论推测等等，要在这一轮抓出来事实错误。\n-
    三是抓反例。要求 AI 提供反方论证，比如假设如果结论为真，还应该关注什么。\n- 四是换一个维度。可以自己提出，也可以要求 AI 从之前没有讨论过的维度再次验证这个问题，看看结论是否松动。\n-
    五是进行压力测试。要求 AI 列出上述分析可能错在哪里，什么证据会让结论反转。


    如此玩上一个月，问题意识就会大为增强。'
