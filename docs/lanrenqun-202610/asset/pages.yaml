    小懒判断｜适合天天收藏干货却总觉得信息不够用的人；不适合指望拿到一份"信息渠道清单"的人——小镇开篇就明说缺的不是信息源而是问题意识。最值得关注的是与 AI
    多轮对话五步法：定口径、要证据、抓反例、换维度、压力测试，练一个月问题意识就能长出来；坑在于要挑不顺着你说话的模型，豆包这类给情绪价值的练不出判断力。


    读者提问：小镇你好，最近拜读了你的几篇文章后，一方面对你知识面的宽广惊叹不已，另一方面也对你日常的数据信息来源渠道产生浓厚兴趣，比如你近两天文章中提到了美国柴油价格、美国四成家庭拿不出
    400 美元现金、特斯拉飞车采用的是航天冷气喷气技术、使用的是 600 升容量的碳纤维高压气瓶等。这些数据信息除非专门去搜，一般的报道很少会提到，如果事无巨细漫无目的的去看，那普通人的记忆力和信息检索能力估计是不够用的。


    所以我想了解下小镇你平时都通过哪些渠道了解信息，重点关注哪些东西，谢谢！另：建议小镇可以在知识星球分享一些读书随笔、好书分享、时事分析以及一些比较好的信息获取渠道，我认为一个人获取'
