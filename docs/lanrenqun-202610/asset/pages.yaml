  md: "![](bbox=[0.011, 0.041, 0.989, 0.119])\n\n+   - 平时刷微信看一看、小红书、抖音时，只要看到有张力的图片、引发强烈情绪的爆款文案，随手转发或截图甩进群里；\n\
