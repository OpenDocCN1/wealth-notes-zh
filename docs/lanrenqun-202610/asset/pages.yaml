- pgno: 13
  md: '# 迅速进入提拔快车道？


    看懂了领导用人思路、摸清了领导心理、研判清了自身形势，最后就要落地实操，遵循单位职场晋升规律，调整自身做事方式、思维模式、处世格局，稳步获得领导赏识，跨身晋升快车道，不用再熬资历、耗青春。结合多年职场实操经验，总结出五条普通人可直接落地执行的核心方法。


    # 一是业务能力守住 70-80 分即可，不必追求极致完美。


    很多年轻人陷入一种思维误区，就是以为想要晋升，就必须把业务做到极致，争当系统内标杆、行业内专家，花费大量时间深耕专业、钻研业务，天天加班啃硬骨头，把所有精力都耗在业务长板上。


    其实这是最大的职场误区。单位职场晋升，业务能力只是基础门槛，不是核心竞争力。对于普通人来说，业务能力做到本单位中上游、70 到 80 分就完全足够，能够胜任本职工作、独当一面、不出差错、能扛任务，在本单位同龄人中处于靠前水平，就已经满足晋升的业务要求。


    完全没必要耗费巨大精力追求全市、全省顶尖级别，把自己练成纯业务型干部。人的时间和精力是有限的，你把全部心思都用来打磨业务长板，就没有多余时间去修炼情商、学习沟通、维系人脉之类更重要的事情了。


    纵观单位职场所有走上领导岗位的干部，几乎没有一个是只会埋头干活的纯技术型、业务型干部。太过专注业务的人，往往不'
  merge: -1
  img_proc: true
- pgno: 14
  md: '懂人情世故、不懂领导心思、不懂全局布局，容易陷入刻板固执的思维，反而很难进入领导的提拔视野。守住业务基础门槛，把多余精力用来补情商、补格局、补人情短板，才是最聪明的选择。


    # 二是主动加强常态化沟通汇报，走进领导视野。


    很多老实干部性格内敛、不善言辞，信奉干好自己的活就行，不用刻意讨好领导，平时只埋头做事，其实这样做是非常吃亏的。这样做领导完全看不到你的付出、看不到你的上进心。打个比方，就像谈恋爱，你只顾着和对方买东西、做事情、当舔狗，但是不和对方聊天，不和对方进行更进一步接触，对方免费接受这种"爱的供养"心安理得，只会把你当工具人，不会把你当对象。


    所以想要被赏识、被提拔，主动汇报、常态化沟通是必经之路。觉得口才不好的话，可以从基础工作汇报做起：单位有部门周例会，就认真准备发言，条理清晰汇报上周工作、现存困难、下一步思路；没有例会，就每周主动梳理工作台账，找领导简短汇报，条理分明、简洁务实就行了。


    然后日常借着找领导签字、送文件、请示工作的契机，适当多交流几句，聊聊工作思路、谈谈岗位感悟，慢慢加深领导对你的印象。工作接触多了之后，再适度拉近私人距离，逢年过节、岗位调整、取得成绩等关键节点，主动向领导表达问候、感谢培养、表态工作决心，传递自己积极上进、愿意服从安排、想追求进步的信号。这一块内容，后续我们进一步跟进。'
  merge: -1
