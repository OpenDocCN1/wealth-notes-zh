  md: '13 点销量：70414 点销量：717 最近 1 小时新增：13 单如果这个增量超过我设置的阈值，系统就自动提醒我。


    这个阈值可以自己设置。


    我现在设置的普通规则是：


    近 1 小时新增 ≥5 单，触发提醒。 另外我还单独做了一条高客单价商品的规则：


    商品价格 ≥29 元，并且最近 1 小时新增 > 1 单，也触发提醒。 为什么要单独加这一条？


    因为不同价格的商品，我关注的标准肯定不一样。


    一个 2.9 元、5.9 元的资料，一小时出 2 单，我可能不会特别关注。


    但是一个 59 元、98 元甚至更高价格的虚拟商品，如果一个小时连续出了 2 单，我就会想进去看看了。


    所以这里的规则完全可以根据自己的选品习惯修改。


    ![](img/c3c9c159d06d09d1ee26d225987a38e8_10_0.png)


    触发以后，系统会把达到条件的商品自动汇总出来。


