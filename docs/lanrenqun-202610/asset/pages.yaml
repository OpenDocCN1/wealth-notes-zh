    \n> 飞鱼\n> 如果确定做，直接个定金给@Link\n> \n> 下一步，我们约个时间线下再交流一次，如果今明天可以碰面，把需求进一步聊清楚\n> 基本上国庆回来产品就可以交付先测试了，使用过程中有什么想法，这个月可以慢慢调整优化\n\
    \n客户觉得没有问题，茶馆聊完的第三天就交了 3 千元定金，总价值是五位数的订单，我们当时都很兴奋，一切都快得像一场梦一样。\n\n![](img/d58980d33aa2215641c7ed4eb1eaee07_8_0.png)\n\
    \n这个过程中，定金之前主要由飞鱼哥统筹跟进，我和 Link 教练先协调分工和报价；"
