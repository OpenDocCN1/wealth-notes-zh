  img_proc: true
- pgno: 3
  md: '议权托管给渝富。


    这已经远远不是普通的财务投资。渝富实际上开始进入西南证券治理结构。2006 年那轮重组之后，建银投资和渝富成为西南证券最重要的两股力量。


    再往后，就是上市。西南证券找到了当时已经陷入困境的 ST 长运。2009 年 2 月，ST 长运向西南证券原股东发行约 16.59 亿股，吸收合并西南证券，随后公司直接更名为“西南证券”，证券代码还是
    600369。


    这就是今天西南证券上市公司的来源。当时给*ST 长运流通股股东提供现金选择权的，还是重庆渝富。从 157 亿元工行坏账，到重庆银行，再到西南证券，渝富最初十年的基本轮廓也就出来了它不是靠在二级市场上买股票慢慢做大的。


    它最早的资本，是重庆国企改革和地方金融风险处置过程中留下来的。哪里有债，去哪里。哪里需要重组，去哪里。哪家地方金融机构需要补资本、清资产、找股东，它也去哪里。久而久之，手里留下来的就不只是资产。


    还有股权。到了后来，重庆银行、重庆农商行、西南证券、担保、租赁等一系列金融资产，都逐渐出现在渝富版图里。截至 2025 年 3 月末，渝富体系合计持有西南证券
    31.28% 的股份；2024 年末，渝富资本直接持有重庆农商行 8.70% 的股份；到 2025 年 9 月，渝富资本及其一致行动人合计持有重庆银行约 21.95%
    的股份。人也开始沿着这些资产流动。'
