- pgno: 12
  md: '# 总经理杨雨松


    一个刚从重庆农商行过来。一个刚从西南证券回来。两个人正好站到了渝富这座资本平台的最高管理层。三个月以后，8月，谢文辉被免去党委书记、董事长。


    9月12日，被查。9月30日。吴坚被查。一个细节很有意思。吴坚退休的时间是2024年8月31日。谢文辉到渝富的时间是2024年9月。


    前后几乎只差几天。两个人甚至没有形成长期的“渝富董事长—西南证券董事长”搭班关系。吴坚刚从西南证券离开，谢文辉才走进渝富。


    但在他们之前、之间和之后，那些机构始终在那里。渝富。重庆银行。西南证券。人员不断换。资本关系却很稳定。早年的廖庆轩，从重庆银行走到国资委、渝富，再到西南证券。


    吴坚，从重庆证监局走进渝富，再走到西南证券。杨雨松，从证券行业进入渝富，又到西南证券，最后再回渝富。谢文辉，从重庆农商行进入渝富。


    冉海陵，在西南证券短暂停留之后，去了重庆银行，一做就是二十年。隋军，从农商行去汽车金融，再去重庆银行，最后又回到农商行。


    高嵩，又从农商行去了重庆银行。如果只看每一次任命，它们都是独立的人事变动。如果把二十年放在一起，它更像一张不断循环的人事网络。'
  merge: -1
  img_proc: false
- pgno: 13
  md: '这张网络并不能自动等同于腐败。地方金融本来就需要懂银行的人去银行、懂资本市场的人去券商、懂国资的人去资本运营平台。


    真正的问题一直是另外一个：


    当一个地方的金融资源、国有资本和干部人事长期集中在少数几个平台之间流动时，制度能不能始终把权力关在业务规则里。重庆过去的巡视材料，其实很早就碰过这个问题。


    五届市委巡视反馈中，渝富被指出土地整治等重点领域存在廉洁风险；重庆农商行被指出物资和服务集中采购等关键环节存在廉洁风险；西南证券则被指出绩效管理、后勤服务等方面存在廉洁风险。


    2023年，市委又对西南证券和重庆农商行开展巡视。西南证券后来在整改通报中专门提出加强集中采购、重大投资、项目建设等重点领域廉洁风险防控。


    重庆农商行则提出联合信贷、合规部门开展核查，严肃查处信贷领域违规违纪问题。


    这些文字单独看都很普通。放到几年后的今天，却有了另一种重量。金融系统的权力和一般行政权力不太一样。


    有些权力批的是一个证。有些权力盖的是一个章。金融权力背后直接对应的是钱。一笔贷款可能十亿元。一个债券项目可能几十亿元。一家企业完成 IPO，股权价值可能完全改变。'
  merge: -1
  img_proc: false
- pgno: 14
  md: '一次地方国资重组，能够改变一家上市公司的控制权。一个基金投不投，一家企业可能就是生和死。


    所以金融领域这些年反腐通报里，总会出现一句高度相似的话：靠金融吃金融。舒静的问题落在贷款审批。王万洪的问题里有干部任用和工程承揽。现在的谢文辉、吴坚、冉海陵、彭世斌，具体问题还没有公布。


    现在能看到的，是另一套更不会骗人的东西：


    工商登记。上市公司公告。年报。股权关系。干部履历。二十多年前的重组文件。


    这些材料拼在一起，至少能够还原重庆金融体系这些年是怎样长出来的。2004 年，渝富成立时，重庆要处理的是 157 亿元工行坏账。


    2006 年，它在帮西南证券填窟窿。2009 年，它帮助西南证券完成借壳上市。后来又先后深度参与重庆银行、重庆农商行等金融机构资本运作。


    它一步一步从“坏账处置公司”，长成今天几千亿元资产规模的地方国有资本平台。二十二年过去，很多当年的合同早已结束。当年借的钱早已还了。


    企业改了名字。银行上市了。券商也换了几任董事长。可金融行业有一个特点。账总在那里。


    谁贷过款。'
