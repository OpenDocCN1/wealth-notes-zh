  md: '大，也可以第三根大，但不能是第一根最大


    +   5. **成交量缩+放**：成交量经历了缩量的过程，然后伴随着一天大跌+放量，完成缩放的过程，代表筹码充分交换，完成弱手到强手的交换

    +   6. **大盘小盘比 MAX**：这个前几天已经触发了，默认红线。这个数据不用跟踪观察，触发即始终有效

    +   7. **加息概率提升**：今晚 CPI 公布，自动触发了，默认红线。这个要跟踪观察，因为也可能回落，要把红线去掉

    +   8. **IM 6600**：这个测的方法有 5 个，测算的结果是 6400-6700，取 6600

    +   9. **科创 50 1250**：测算方法有 3 个，基本都是 1200-1300，取 1250

    +   10. **情绪指数**：这个指数没有以前有效了，所以必须要极值，小于 3 才行。如果达到 3 但是不超过 10，依旧默认是触发状态

    +   11. **PCR**：主要观察 300、500、1000、科创的 PCR，3 个到达低估之下默认触发，具体数据可以去投资观察网查看

    +   12. **大科技点位**：这个没办法给数据，太分散，我确实没办法用文字描述，只能说，重点看 CPO 和半导体


    即播即用：12 个指标红线越多动手，胜率越高。太早动手，会在底部扛不住；红线'
