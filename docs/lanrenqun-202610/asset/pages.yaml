- pgno: 2
  md: '哈也不干，只要不站到对面去，也值。


    所以，Open AI英国子公司一年营收2.93亿英镑，光人工成本烧掉就敢烧2.55亿，背后其实就一个字，抢！


    现在全球AI竞赛实际上已经分三层。第一层，也是最热闹的就是美国那几家巨头在内战。OpenAI,An thropic,Google,Meta, xAI,这几家把薪酬天花板顶穿了不说，估值也疯了一样涨。An
    thropic估值冲到快万亿美元，Open AI传要奔着1.4万亿去。


    资本和人才在互相放大，人越贵，说明资本越看好。资本越砸，工资越能发得高。这已经不是正常公司竞争了，更像军备竞赛，谁都不敢慢一步，慢一步人才就跑对手那边去了。


    除了美国内部的盘子，第二层是中美在掰手腕。当然，我们这边路线和美国还有区别，并不是不靠给研究员发几千万甚至上亿年薪，而是总方针就是把大模型价格打下来换生态，先用低价把开发者圈进来，然后工程化、应用层全面铺开。


    说穿了，美国拼的是前沿突破的奇点，我比你先搞出来。我们目前拼的是规模渗透，我比你先用进去，往产业链衍生。


    当然，最近网上很多人吐槽中国算力都用在C端什么视频等那点热闹，吐槽挖苦不少，阴阳怪气也大有人在。其实并不全面，也不客观，因为B端的应用，刷手机根本刷不到，而且可以坚定的说，B端跑的速度比大家想的猛得多。'
