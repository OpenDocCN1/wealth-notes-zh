  md: '@Link。谢谢你们带着我一起做项目，让我有机会在实战里学习，也慢慢找到自己能承担的事情。


    感谢生财，感谢亦仁、涛哥、许老师、SKY 哥、@七天、@小武……还有很多给过我帮助、一直支持我的人。大家给过我的机会、建议和鼓励，小满都会记在心中。


    希望自己把这些经历分享出来，能帮助到更多和我一样正在摸索的人。


    # **团队：原来不用自己什么都会，也能把事情做起来**


    # **从亦仁开放日相识，到广州一起聊项目**


    9 月 20 号，我以组局官的身份受邀参加杭州的亦仁开放日和饭局。当天我还报名做了摄影志愿者，在路演现场比较活跃。后来七天老师邀请我上台发言，飞鱼哥因此就留意到了我。


    ![](img/d58980d33aa2215641c7ed4eb1eaee07_2_0.png)


    当天晚上的饭局上，他说觉得我这个姑娘挺不错，我还挺受宠若惊的。在饭桌上，他说我只做 AI 自媒体还不够，需要结合具体业务，由于时间仓促，我们约定回广州'
