- pgno: 9
  md: '名副行长去了重庆银行当行长。


    两家资产规模合计超过2万亿元的地方银行，几个月之内完成了一次高级管理人员的“双向流动”。


    而冉海陵，也不是一个与西南证券毫无关系的人。他在重庆银行工作了二十年。2013年至2023年，做了整整十年行长。


    可在进入重庆银行之前，2002年12月至2003年3月，冉海陵曾短暂担任过西南证券总裁助理。在那之前，他还长期任职四川省信托投资公司涪陵办事处和证券营业部。证券。银行。


    信托。又连上了。2026年6月10日，退休将近三年的冉海陵被查。一个多月后，7月24日，彭世斌被查。彭世斌这个名字更有戏剧性。


    他以前不是业务干部。他干纪检。做过重庆市委巡视组组长，后来进入西南证券，担任重庆市纪委监委驻西南证券纪检监察组组长。2021年，《中国纪检监察报》讨论如何加强金融企业监督时，彭世斌就是受访嘉宾。


    当时讨论的一个核心问题，是金融机构资源和权力高度集中，腐败手段又具有专业性和隐蔽性，因此要盯紧关键少数、重点岗位，做“嵌入式监督”。


    西南证券自己的纪检工作当时也很具体。2021年，驻西南证券纪检监察组查办多起分支机构案件，处置问题线索11件，立案2件，还针对绩效分配、人员管理等环节'
