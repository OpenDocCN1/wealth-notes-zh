- pgno: 2
  md: '年都在搞什么。这种感觉，就类似于学了4年钻木取火，最后看到别人发明了打火机。


    引发数学界信仰崩塌的直接导火索，就是10月6日 OpenAI公布了722篇手稿、372个结果族、约400个猜想的证明。一旦 AI能够把数学家的工作多快好省的完成，那么数学家这一群体是否还有必要存在呢？当然，完全不需要数学家是不可能的，但需要的人数大幅减少是一定的。因为当政府意识到
    AI也能做这些事的时候，他就必定会减少针对数学的拨款，到那时候数学家都要失业转业了。


    为什么 AI最容易攻破的领域是数学呢？我认为这和数学的研究模式有关，因为数学完全基于形式逻辑的推理，一个数学家可以只靠纸和笔就开始工作，它不需要什么实验数据，而这一点恰恰是
    AI 的强项，AI最擅长的事情，就是在给定的规则里寻找规律。对于这个社会来说，如果用 AI就能解决这些问题，那就不需要人类数学家进行"古法研究"了。


    另外还有一点，数学这个学科已经越来越脱离现实。曾经数学是用来解决现实问题的，比如牛顿搞出微积分，是为了计算天体的运行轨迹；惠更斯搞出概率论，是为了计算赌博的赔率问题；高斯搞出微分几何，是为了给自己的金主丈量土地面积。而现在的所谓数学，已经退化成了小圈子里的自嗨工具，他们非常热衷于去证明某个大佬的猜想，而这种证明事实上并没有什么实际的意义，也不能指导现实的工作。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '他们会说，现在没用，可能将来某一天就会有用。而这一点恰恰被 AI 钻了空子，因为 AI 最擅长的就是形式逻辑的证明，而不需要联系现实。如果这些数学必须和实践操作结合起来，那
    AI 反而就没有优势了。


    最要命的问题是，虽然数学家做的很多工作其实没有意义，但他们的大学职位、研究经费和社会荣誉，全靠这些无意义的工作来兑现。社会对这个群体的态度是，虽然搞不懂他们做的事情有什么用，但总之很厉害的样子，反正也花不了多少钱，就养着吧。当
    AI 出现，使这个内循环突然暴露在强烈的外部冲击之下，负责财政拨款的人就会问，如果 AI 几个小时就能完成，那你这十几年在做什么？


    我记得在短短半年前，全社会对 AI 的判断是，能够取代大量初级智力岗位，比如普通办公文员、简单的数据分析，以及所有可以流程化的工作，所以大学毕业生日子难过了，因为没有那么多初级智力岗位给你了。结果才过去半年，连数学家都要失业了吗？这
    AI 的进步速度也太快了吧。这下学渣开心了，因为连学霸也一样被 AI 轻松击倒，那学霸和学渣之间还有差别吗？


    打个比方，一个是拿着钉耙的农民，另一个是全身重甲的骑士，农民面对骑士当然是毫无胜算的。但现在来了重机枪，在机关枪面前，不管是农民还是骑士，都是一梭子弹的事情，是没有差别的，此时农民和骑士地位平等了。


    我觉得 AI 对数学的冲击仅仅只是第一步，'
