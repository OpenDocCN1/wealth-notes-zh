  md: '![](img/d4ad0d0698187569ac2c5e765f34c340_6_0.png)


    上一篇文章就是这么发的，在工作台里改完，公众号草稿箱、X 长文草稿、星球的文章草稿箱，三个地方都推进去了，每一次推送都留了记录。


    ![](img/d4ad0d0698187569ac2c5e765f34c340_6_1.png)


    知识星球没有开放接口，用的是星球网页自己调的接口，在设置里用微信扫一次码就连上了，再推一次是更新同一篇草稿，不会多出一篇。


    小红书个人号没有发布接口，我就让它把能做的都做了：一键把长文改成小红书版，20 字以内的标题、1000 字以内的正文、话题标签，再自动画一张封面卡和几张要点卡，长文里的截图也可以挑几张配进去。手机上点“分享到小红书”，图片按顺序带进小红书
    App，文案已经复制好，粘贴进去，存草稿还是发布在小红书里点。'
