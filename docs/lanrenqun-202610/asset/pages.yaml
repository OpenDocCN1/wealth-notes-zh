    小懒判断｜适合总在拼命努力却原地打转的人，以及刚进职场 1-5 年还在靠蛮力堆时间的人；不适合已经形成自己方法论、想找新认知增量的人——20 条规则都是经典概念，没有新东西。最值得关注的是第
    13 条"眼镜蛇效应"：悬赏收鼠尾结果有人养鼠领赏，做管理、做产品、带娃的都该把这页折起来。坑在于：看完不等于做到，文章自己也承认这是第 20 条，别把收藏当掌握，至少挑一条落地用起来。


    如果要我选出一种最被低估，但又最能拉开人与人差距的能力，我想，那一定不是聪明、不是努力，而是：理解世界运行的基本规则。


    为什么这么说？因为我见过太多这样的人了。他们足够勤奋，每天睁开眼就开始忙碌，朋友圈里永远在打卡、在学习、在自我提升。他们也足够聪明，反应快、学东西快，一点就透。


    但奇怪的是，几年过去，换了几份工作，年龄增加了几岁，但好像总有一道坎挡住他们，让他们依然在原地打转。相比之下，有一些人，看起来并没有那么拼命，甚至'
  merge: -1
  img_proc: true
- pgno: 1
  md: '# 有点懒。


    但他们做的每一个选择，似乎都恰好踩在了点上。他们不慌不忙，但是路越走越宽。


    我们常常把这种差距归因于运气，或者归因于“人家有资源”。但真的是这样吗？


    其实，在运气和资源的背后，藏着一个更隐蔽、也更根本的东西，那就是有些人懂得世界是按什么规则运行的，但是有些人不懂。懂的人，是在顺着规则发力。做事首先抓住第一性，认清规则、理解规则、顺应规则。不用蛮力，而是借力打力。


    所以往往一通百通，一顺百顺。不懂规则的人，一辈子都在跟规则死磕。


    这篇文章，我想认真聊聊这件事。文章会涉及到 20 条我提炼的世界运行的基本规则，以及我对这些规则的拆解说明。文章 8000 多字，更像是一份规则手册，适合在迷茫时或者想成事时，翻翻看，常读常新，必有收获。


    我们现在开始吧。


    # 一个人失败的根本原因，是在跟规则较劲


    我们先来看一个很常见的场景。一个人想要变得更好，所以他就给自己定了一堆目标：每天背 50 个单词，跑五公里，读 30 页书，早睡早起。


    他靠着一股蛮劲儿，咬牙坚持了两个星期。然后，在某个加班到深夜的晚上，计划中断了，他好像也泄气了，再也没继续下去。'
  merge: -1
  img_proc: true
- pgno: 2
  md: '他陷入到一种深深的自责之中：我怎么这么没有毅力？几年前的我，也有类似的经历。计划列了一大堆，但总是失败，失败后就会自责，也就没什么然后了。


    过一段时间，又列一大堆计划，然后又失败，又自责，就像不断推石头上山的西西弗斯，陷入到无尽的失败循环里。一个很现实的问题是，我们太容易把失败，归咎于自己不行了。不够自律、不够坚持、没有天赋。


    所以我们不断地跟自己较劲，逼自己再努力一点，再咬牙挺一下。但问题是，这真的是毅力的问题吗？我这几年发现的一个真相是，很多时候，我们的痛苦和失败，根本不是因为做得不够，而是因为我们根本不知道自己到底在跟什么东西对抗。


    这就很像一个人逆着河流的方向游泳。他拼命地划啊划，耗尽了所有的力气，结果还是被冲回到原点。他责怪自己手臂不够有力量。但问题在手臂吗？


    显然不是。根本原因在于他根本就没意识到基本规则是什么，所以选错了方向。水往低处流，这是规则。逆着规则走，就很容易失败。


    这个世界上也有很多规则，比如风险与收益相伴，天下没有免费的午餐。


    这些规则不以人的意志为转移。它们不在乎你是否努力，不在乎你是否善良。它们只是冷静地，不动声色地，藏在每一件事背后，支撑着这个世界的运转。'
