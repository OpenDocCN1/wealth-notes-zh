    功没有把握，有怕考不上的焦虑；另一方面，现实压力太大——而解脱这一切的，唯有想象自己可以考上。所以，在心理上，他要做的，就是强迫自己把持住，投入到这种想象里，只有在这种自我强迫所维持的想象里，他才能获得安全感。


