    # 8. 当我们觉得一个人有点“怪”的时候，接着要想的是：如果我是他，我会怎样？


    听不懂别人的内心语言，我们有时候就无法对别人的期待、暗示做出正确、有效的回应。而如果向我们发出的，是求助信息呢？


    有一个记者曾经问过我这样一个问题：为什么有的男人在外装得很严肃，回到家里却喜欢向母亲或老婆撒娇？


    好像可以有这样的解释：这个男人从小撒娇时没有一次撒个够，因此长大后要寻找补偿；或者，他可能有某种特殊癖好，想要扮演一个小女孩的角色。


    我要说，不是这样子的。


