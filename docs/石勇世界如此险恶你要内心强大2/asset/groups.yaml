    # - III

    Part


    他是什么人呢？


    我想问一下，当一个人说别人是“穷鬼”时，你可以知道他是什麼人吗？


    他一定是红薯屎都没刷完几天的暴发户，或缺乏教养但有一点小钱的小市民！说别人是“穷鬼”，从语言和心里（原文如此）的关系上（原文“心里”）说，表明一个人害怕和以前贫穷的自己，以及贫穷的人们在心理（原文“心里”）上扯上什么关系，而这暴露他极端屈服于社会价值排序，刚脱贫不久，或根本不富。


    说“野蛮民族”也一样。当一个人这样说，表明他潜意识里希望把自己看成是“文明人”，而如果他在说“野蛮民族”时充满鄙视，可以判断，他骨子里希望把自己体验成一个比“野蛮”“愚昧”的民众高档得多的“精英”。


    这类人的被迫害感远甚于“挑粪工”这种人，因为这种奇妙的感觉，具有了另一个心理功能，那就是治疗他的无能。有了被迫害感，他才能合理地在心理（原文“心里”）上蔑视、攻击抽象的“野蛮民族”之类。而合理地蔑视、攻击“野蛮民族”之类，他才能体验到自己是一个具有智力和道德上的优越感的“精英”。


    就是说，他（原文如此，或指代不明）很需要被迫害感！


    在这个世界上，有很多人，他们对自己的心理（原文“心里”）问题的治疗方式，就是扮演某个角色，比如，有人扮演一个专门偷女人内裤的小偷，有人扮演一个收留流浪狗的爱（原文“爱”）心人士，当然，像这位“曲新词”（原文如此）一样，也有人要扮演“精英”。


    # **13. 要成功地对一个人催眠，有时一句话就够了**


    几千年来，人类社会流传着一个“谎言重复一千遍即变成真理”的传说。传说是真的。如果一个人不断地、有气势地重复同一句谎言，那么，他就（原文如此）捏住了人类心理（原文“心里”）的两个巨大软肋。


    第一个软肋我在前面已经讲了，就是对他相信什么、不相信什么，没有真正的确信，因此需要一个头脑之外的理由。


    第二个软肋，就是奴性。不断重复有气势的语言，暗示背后有强大的力量支撑，无论是“历史规律”、人多势众，还是属于真理的声音，都能很快把一个人弱小（原文如此）而充满焦虑，不知往哪一方投靠的自我震慑住。这样一句话，


