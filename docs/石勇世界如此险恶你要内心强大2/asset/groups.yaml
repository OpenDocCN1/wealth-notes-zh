  - '[PAGE 155]


    革命导师卡尔·马克思教导我们：“理论一经人民群众掌握，也会变成物质力量。”


    我们要确立这一崇高信念：用理论武装起来的人民，是战无不胜的！


    对这段话，伟大领袖毛主席补充：“枪杆子里面出政权！”


    而作为革命群众甲，我也补充：“很多理论都可以提炼为方法来运用，而且，不同的理论，可以融合、提炼为一种厉害的方法！”


    我想请大家记住：如果一个人不能把理论提炼为方法，或学不会别人根据理论提炼出来的方法，他其实并没有掌握理论，只是“知道”理论是什么而已！


    能够用方法来把理论用上，转化为“物质力量”，那才是理论的最高境界。当然，这个“物质力量”，你怎么用，就可以怎么理解，正如你了解了一个朋友的心理，是用来帮他；但商家了解你朋友的心理，目的是操纵他，赚他的钱！


    任何一个领域的牛人，都需要一套观察和分析世界的方法来武装自己，因为只有这样，他的头脑和心理才能和世界的秘密建立联系，从而识破世界，抵挡世界，把握世界。如果有人说，他什么理论方法都没有，那一定是装，装天才。


    励志大师荀子就揭穿过这种装。他苦口婆心地对 我们说：


    > “登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。”


    看到没有？荀老师说，一个人牛，主要是“善假于物也”。


    对于我们来说，所谓的“一眼就看穿你什么”，正确的解释是：在此之前，已经用理论、方法有了N次实践，才形成了敏锐的直觉！


    这个道理，连欧阳修笔下那位长期摆摊卖油、幸运地没有遇到城管的小贩都懂：“无他，唯手熟尔。”


    我们已经知道：一个人之所以成为一只心理动物，之所以在生活中、工作上、头脑中和心理上都出现问题，恰恰是因为世界和自我的门没有向他打开，'
  - '[PAGE 156]


    或打开得太小了。


    现在，我们要用力打开这扇门。


    关于方法的讲解，我遵循的是由浅入深的原则，尽最大限度可以操作。


    但如果谁要求我弄出一套可以傻瓜式操作的东西，让懒人也可以学会，我只能遗憾地告诉他，犀利的心理分析是一门技术，也是一门艺术，不是计算1+1=2，它是做不到这一点的————它讲究摘懂原理基础上的灵活性、情境性，要求头脑和心理都很敏锐，实在无法还原、简单化成头脑的傻瓜式反应！


    这一点，我相信你懂的。'
