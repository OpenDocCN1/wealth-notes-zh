    为一种耻辱。他会埋怨为什么他爸不是李刚而是你？


    # 9. 90后最害怕的，就是“现实”对他反戈一击


    理性，是我们在心理成长时，真正可以让我们心理健全的药方，也是心 理强大的武器。


    它也可以帮父母界定好和孩子的关系。


    让我们先看一下子这个现象：为什么现在的90后，比之80后（更不用说 是70后）更早熟、更精明、更现实，但也更脆弱？


    答案在一个人的头脑、心理与世界的关系中。


    90后成长的年代，社会变化非常快，他的“自我”在成长时，头脑快速 地接受了社会上玩的那些东西，进入心理结构，变成他的“自我”的一部分， 他的心理结构，和现实结合得很紧密，因此很现实、很世故。


