    # 第三章 内心深处


    ## 1. 我们的存在，就是和自己、他人、世界的对话


    我们扛着一个心理结构，事实上就是扛着性格、心理倾向、情结、情感、情绪等一大堆东西在生活，在和世界打交道。


    那么，心理保护这个暴君，在我们的内心里，到底是怎么启动一系列心理规律，让我们说了某种话，做了某种事，有了某种情感、情绪，或变成了某种人的呢？


    我想，已经到了把“心理结构”和“人”之间的秘密揭开的时候了。让我们走进内心的深处。


    在表达的时候，我取用了一种古老的方式，那就是对话，它是哲学的最初传统。


    我们的存在，其实也是和自己、他人、世界的对话。


    ## 2. 了解了一个人是什么样的人，就可以知道他会说什么、做什么，反过来也一样


    有一个职场白领，某一天对我来了一个困惑的表情，这是有话要说的另类开场白。


    果然，她问了我一个问题：“怎么会从一个人所说的话、他的行为，就可以看到他的内心呢？心理分析是不是很神秘，有点难学？”


    我很严肃：“你想学吗？”


    她说：“想啊！我希望让自己内心变得很强大，我要武装自己！”


