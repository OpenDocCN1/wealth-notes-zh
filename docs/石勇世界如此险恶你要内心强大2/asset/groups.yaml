    # 30. 经验在很多时候其实就是一种运气


    问：常听人说“我的直觉告诉我……”他的直觉能告诉他什么？


    答：这个问题挺有意思。我认为心理分析的一个崇高境界就是形成直觉能力，一眼就看穿，马上就直觉到。干了蠢事才后悔，有时候已经来不及了。


    有四种常见的直觉。


    第一种是具有逻辑必然性的。


    非常之准，至少可以达到99.99%。这是长期的分析训练的结果。原理很简单，比如要得出结论P，我们首先经过了一系列的推理：因为A，推出B，推出C……推出P。但如果经常这样做，只要出现A，所有的推论过程都省略了，我们直接一眼就可以看到或判断出P！


    放在对人心的破译上也是一样，我们之所以一眼就可以看到一个人语言、行为背后的心理秘密，正是用多了心理分析方法，具有了洞察能力的结果！


    第二种，是经验上的。


    经验上的直觉是很多人经常有的，比如以前我们经历过A事情，它具有特征a，经历过B事情，也具有特征a，经历过C事情，也具有特征a……然后，某一天，当我们经历P事情时，我们马上就直觉到会有a！


    就是说，我们的经验多了，当只要再出现某件事，和过去的经验有点相似，我们的经验就可以用上，马上就形成直觉。


    这种直觉有时候是准的，但有时候却不一定，它只属于“碰运气”，不具有逻辑必然性。原因就很简单了，因为A事情、B事情……直到P事情，只是有点相似，但并不是同一件事情，也就是说，在逻辑上只是相似，不是等同，所以，虽然A事情、B事情都有特征a，但P事情真不一定有特征a。我们因为经验，以为现在出现的一件事情，也像过去一样，那就有可能犯错误。这就是经验虽然有些可靠，但并不保险的地方。


    一个聪明人，依靠的并不仅仅是经验。毕竟，就算你碰得头破血流，总结出了什么经验，你的人生也可能付出了惨重代价，甚至无法东山再起。而即使如此，你的经验可能也是靠不住的，一个靠不住的经验，有时候会让我'
  - '[PAGE 248]


    们吃大亏。


    所以，我们需要这种直觉，但不能主要依赖于它；因为有些亏我们吃不起，也没那么长的时间去耗。我强烈推荐第一种直觉，虽然要达到它并不是那么容易。


    我们常用的直觉，其实就是第一种和第二种。


    第三种，就是生命的自我保存本能的直觉。


    在电影、电视、书以及现实生活中，我们经常看到有这样的情境：当一个人在月黑风高之夜，走在 一个黑暗的地方时，他会感觉到有危险正向他逼近，似乎四周埋伏无数准备对他下手的人，于是马上做出防御性的反应；或者，当一个人和朋友坐在酒馆里喝酒时，外面突然进来了几个大汉，他“下意识”地感觉到了危险。像这些情况的直觉，就是生命保存本能的直觉。


    有什么神秘吗？没有。它或者仍然来自于经验，类似的危险情境重新出现了，激活了他心理上的防御；或者，他从情境、人的表情等读到了危险。


    第四种直觉，属于“心灵感应”。


    说得好像和“第六感”有点类似，但又不全是一回事。所谓“第六感”，指的是在听觉、视觉、嗅觉、触觉、味觉之外还有一个所谓具有超强能力的“心觉”。而无论是我们所说的“心灵感应”还是“第六感”，都确实神秘。据说日本忍者喜欢练“第六感”，具体效果如何，能否预知未来我没有考证过，不得而知。


    对“心灵感应”的经典描述是这样：某一天，A 在北京正上班时，突然之间什么都做不下，心里面非常烦闷、担心，预感到在家乡的亲人出事了，比如母亲死了。没过多久，他兄弟电话打过来，说母亲死了，你赶快请假回家吧。


    有这样的事情发生吗？我不知道，反正江湖上流传着这种“心灵感应”的传说。


    确实挺神秘的：两个相隔遥远的亲人，没有任何信息联系，其中一个出事了，另一个却能在同一段时间“感应”到。难道是因为两个亲人之间，由于存在情感上的强烈联系，于是，当其中一个出事先，冥冥之中便发出了一个信息，隐于黑暗之中，迅速传递到另一个亲人那儿，而他并没有意识到，'
  - '[PAGE 249]


    引起了心理反应？或者，由于在此之前，A一直担心母亲，心里面害怕，但也知道可能会出事，在他这种担心加重，预感到母亲去世时，母亲真的去世了，出现了巧合？


    解释这一点，超出了我的能力。也许情况是，我们愿意把一些原本就属于巧合的事情弄得神秘兮兮，也许确实有很多东西我们现在还不知道。


    假如存在这个“心灵感应”的话，我想，搞清它、解释它，应该是心理学、生理学、物理学的共同任务。当然，它也可以是“灵修大师”们的任务。专家们有的忙了。


    拜托了！


