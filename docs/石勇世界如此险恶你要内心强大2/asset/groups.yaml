    # 10. 当我们被心理保护撑住时，第一反应是盲目求生，哪怕饮鸩止渴


    奥地利作家、现代文学最杰出的天才之一弗兰兹·卡夫卡说过一句话：


    > “真正的道路其实就是一根绳索，它不是紧绷在高处，而是贴近地面的，与其说它供人行走，毋宁说是用来绊人的。”


    卡昆是很深刻的，虽然在今天，已经没有多少文艺青年拿他来装，言必称“卡夫卡”了。一个深刻的人，好像不太适合出现在一个浅薄的时代。我们的岳飞岳元帅就曾经大发感慨：知音少，弦断有谁听？


    我听。


    我想说，心理保护，正如生存本能一样，是我们无法缺少的，比如我们维护自尊总没错。但是，在很多时候，它其实也是一根绳索，与其说是用来保护我们在心理上不被伤害，不如说是在心理上给我们下绊，反过来伤害我们的心理结构的。


    因为，第一，保护我们的心理结构，这更多应该是智力结构的责仼，是靠它建立一个防御阵地。


    第二，对心理结构的保护，应该是靠它处于一种内心强大的状态，而不是靠那些我们无法意识到或控制的心理策略、心理规律来玩，或在心理上把我们变成某种样子，比如，变成一个偏执狂。


    如果不是这样，那么心理保护就像前面那位 17 岁的女生产样，只是我们以杀伤自己的方式，来在心理上给自己疗伤而已。


    把话说狠一点就是：当心理保护撑住我们的时候，意味着我们盲目地要在心理上求生，就像喝一杯毒酒来解渴一样！


    # 11. 用智力结构去应对，那才真正可以保护我们，无论是在利益上还是在心理上


    心理问题很难理解吗？我的回答是：不！


    我要揭开这个真相：我们之所以有心理问题，正是在受到刺激、打击时，智力结构不起作用，无法防御，内心也不强大，导致了心理保护盲目运作，


