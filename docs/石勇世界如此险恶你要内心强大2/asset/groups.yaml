    # Part I


    ## 世界如此险恶，你要内心强大


    我们的人生出了问题，至少有一半是心理出了问题造成的，而我们的心理问题，又至少有一半来自头脑的肤浅和紊乱！


    还是先从 20 世纪最重要的思想家之一、精神分析的先知埃里希·弗洛姆一件亲身经历的事情开始。


    一天，有一位同事来拜访弗洛姆。他知道这位同事并不喜欢自己。事实上，弗洛姆说，他对于同事要来拜访自己感到惊讶。


    同事按了门铃，弗洛姆把门打开，准备请他进去。但没想到，同事伸出手，对弗洛姆愉快地说了一声：“再见！”


    别人刚刚打开门欢迎你进入，你就做出了一个一点也不艰难的决定：“再见！”


    直觉上，这很不正常。在这种情况下我们必须追问：什么意思？为什么这样的话可以说出口？


    按照精神分析老祖宗弗洛伊德老师的理论，我们日常生活中的笔误、口误、突然记不起一个熟人的名字等，表面看起来是鸡毛蒜皮的小事，但其实大有深意，乃是一个心理秘密的外露，表明他正处于某种心理和生存状态。


    有时候，一个眼神、一个举动、一句话，就是一个人的死穴，尽管他没有意识到，但对方早就盯住了这一点。


    两个人在打交道时，其中一个出现还没进门就说“再见”这样简直不可饶恕的低级错误，那几乎就是对自己内心想法的主动招供。


    弗洛姆告诉我们，在这种情境中，同事说“再见”，表明他无意识地希望自己赶快离去。就是说，他内心里根本就不想来拜访！


    如果你看完这本书，具有心理分析的洞察力，你马上就能把这位纠结的拜访者的内心语言翻译出来：“我根本不想见到你——你看，我 TMD 控制不住地说出来了！”


    对于大部分人来说，发生这类让彼此都尴尬的情况，一个反应就是把对方假设成一个弱智，急于解释或掩饰一下，避免把已经露馅的戏彻底搞砸。但对于两个对人心洞若观火的精神分析学家来说，还能再说什么呢？


    弗洛姆提醒：啥都别说了，说“这不是我想要说的话”，那将会是十分幼稚的。一个精神分析家对于说漏了嘴的反应，看的是它的真正意思是什么，而不是事后设法去补救什么。


    关于这个亲身经历，弗洛姆点到为止，没有再往下追究。他假设：“你懂的。”


    我们当然懂。但从这里出发后，必须说得更多一些。


    在我还是一个“哲学青年”的时候，就被德国哲学家叔本华的一句话，以迅雷不及掩耳之势击中。


    在 19 世纪中期的欧洲，冷峻地扫视着大街上行色匆匆的人群，叔本华像古希腊的先知们一样侃侃而谈，说人生就是“从未实现的理想，被命运毫不客气地践踏了的希望，虚掷了的挣扎，整个一辈子那些倒霉的错误”。


    如果说在哲学家中，像太阳一样光芒万丈的康德属于普通哲学家，阿多尔诺（就是说“奥斯威辛之后，写诗是野蛮的”那位）属于文艺哲学家，那么，叔本华，以及他的粉丝尼采，基本上是
    2B（网络用语，神经、傻冒之意）哲学家。英国哲学家罗素在《西方哲学史》里为他们树碑立传时，就指控他们虚伪和歧视妇女。


    罗老师说的是事实。在这方面，他是有道德上的优越感的，因为他不仅不歧视妇女，而且还是“妇女之友”——比如，有人爆料，说罗老师“不顾高龄地追逐每一个穿裙子的”人”。


    歧视妇女也要，“妇女之友”也要，在这里我只想说一下，从小就树立“用智慧生活”的远大理想，为人类的哲学事业而奋斗终生的人，总是值得我们尊敬的。本华同志虽然不是一个高尚的人，不是一个纯粹的人，不是一个有道德的人，不是一个脱离了低级趣味的人，仍然是一个对人民有益的人。


    澄清一下，本华老师所说的那种人生并不是指自己。哲学家的痛苦，和我们普通大众的痛苦并不是一个概念，他们是“感受到了人类的痛苦”，我们普通人的痛苦，不过是个人的痛苦罢了。而且他是富二代，无论从生活的安逸，还是哲学上的成就看，他的人生都没什么失败。


    然而，恐怕，这是很多人的人生——至少，我们或者在迷茫中虚掷了太多的挣扎；或者，在重要的事情上，会犯下一些愚蠢的错误；或者，在逃避自我的迷梦中永远不敢醒来！


    还有太多的“或者”。


    所有这些，其实更多的都是心理问题。


    请相信我，我们的人生出了问题，至少有一半是心理出了问题造成的；而我们的心理问题，又至少有一半来自头脑的肤浅和紊乱！


    # 第一章 沦为心理动物


    从前，古希腊有一座山，叫奥林匹克山，山上有座庙，叫德尔斐神庙，在这座庙上刻着一句永恒的箴言：认识你自己！


    哲学是让我们“用智慧来生活”。它要干的一件大事，就是让人认识自己。所以苏格拉底甚至放过一句狠话：“未经反思的生活是不值得过的。”


    苏老师的这句话穿越古今，发音振聩。


    确实，成为自己的陌生人，或以为认识了自己，但只是把一个假的“自我”当成自己，收获无穷的烦恼和痛苦，过一种错误的生活，拥有一个荒谬的人生，有什么意思呢？


    但我也要放出一句狠话：问题并不在于一个人在头脑上不想去认识自己，而是在心理上要阻止自己这么做——在心理上，很多时候你要一个人去认识他自己，等于要他的命！


    在认识自我、认识他人的道路上，哲学，是需要和心理分析一起并肩行走的。


    ## 2. 一个人恐惧的时候，那种孤弱无助，在心理上多么像一个孩子


    一个人恐惧的时候，那种孤弱无助，在心理上多么像一个孩子。


    而当我们嫉妒的时候，自恋的时候，自卑的时候，怨恨的时候，发泄的时候，莫名其妙地干出一些蠢事的时候……在心理上，又像什么呢？


    来看一个 17 岁女生的真实故事吧。


    这位女生家里有点钱，但她很喜欢当“小三”，而且当得比较另类：主动去勾引有点钱的中老年男人，周旋于几个男人之间。对于没有结婚的男人，无论穷富她都没有兴趣。


    故事还没有听完，我就脱口而出：“她一定恨她父亲！”


    知情人突然想起：“她父亲在外面有女人，有不止一个‘二奶’。”


    我沉默了。突然之间，我像中华老师一样，触摸到了人生的悲剧。


    她恨她父亲，但无力反抗父亲所做的一切。于是，模仿父亲包“二奶”的玩法，把自己变成一个“小三”，来在心理上报复、惩罚她的父亲。内心里隐隐有一种声音告诉她：自己越是这样，父亲就越会有双重罪恶感——因为女儿搞成这样，都是他干的好事；而包“二奶”，在心理上就像包自己的女儿一样！


    这多么像是以“自杀”的方式来报复父亲。


    我真想说：姑娘，不能采用这种疗伤方式啊！


    ## 3. 当我们成为心理动物的时候，自我、命运的控制权，已经不在我们手里


    还记得我在《世界如此险恶，你要内心强大》里对“心理结构淹没智力结构”的描述吗？


    内心强大的一条法则是：不能让你的心理，代替你的存在去和世界打交道！


    我们其实可以走得更远。


    在听完 17 岁女生的故事后，我沉浸在对她内心挣扎的想象中。心理分析的直觉告诉我，她内心里极不当“小三”，但是，这种声音，已经非常微弱，她就算听到，也无法听它的话了。


    为了保护自己弱小的内心，她已经被某种神秘的心理规律所控制——就像我们在嫉妒的时候，自恋的时候，自卑的时候，怨恨的时候，发泄的时候，莫名其妙地干出一些蠢事的时候，也受到了某种心理规律的控制一样。


    如果可以形象一点的话，那么，我希望把处于这种状态的人称为“心理动物”。


    一个人为什么容易沦为“心理动物”呢？在第二章直捣心理问题的一个核心后，我再来描述它。现在我想说的是：当我们变成心理动物的时候，叔本华所说的那种人生，也许已经开始，因为自我、命运的控制权，已经不在我们的手里。


    ## 4. 人们一旦从别人身上获取了心理优势，往往不会收手


    尽管情况并不一样，但这个 17 岁的女生，让我想起了一位青年在一档相亲节目上的失败表演。


    人与人之间有区别，但心理规律是不认人的。


    在 VCR（摄影机）和舞台上，这位青年使劲耍时尚小青年派头，并陶醉在自己的各种姿势中，以为表演得这么有个性，定会博得女嘉宾的青睐，却没想到一通卖力表演之后，面前灭灯一片。


    在退场时，他不玩时尚造型了，眼里露出失落、惶恐，一再辩解“其实大家不了解我”“真实的我不是那样的”。


    很无辜吗？非常遗憾，在那一时刻，我看到的只是一个心理动物。


    这位青年独特的内心语言是这样的：“我觉得玩时尚小青年很有特点、很有个性啊，所以一定会得到女嘉宾的欣赏。”


    于是，他这样玩了，却没想到，自己面对的不是无知少女，而是一帮阅男人无数的女嘉宾，自己这样装只会显得幼稚可笑！


    灯全灭后，他知道自已玩砸了（除非突然精神失常，他才能否认这一点），但把自己装失败偷换为：在 VCR 和舞台上耍时尚小青年派头的那个人不是真正的他。动机是企图挽回面子。


    但这一招几乎是自杀式的，整个把自己搭了进去。他相当于主动招供：“其实我很愚蠢，你看，我居然去扮演一个时尚小青年，以为会被欣赏。而被灭了之后，我为了面子又说真实的我不是那样子的，可见我多么虚弱！”


    招供完后，他无异于对广大观众深情呼唤：“既然我这个人如此的虚弱和愚蠢，那么，你还等什么？请放心地鄙视我吧！”


    他为什么玩砸了？


    很简单，他想的是“我这么玩别人一定会喜欢”，而没有“我这样玩会显得很幼稚吗”的意识。他看见的只是自己在心理上想象的别人的反应，本质上，看见的其实只是自己。因此，在场上，他有一半是表演给自己看的！


    本来，玩砸也就玩砸了，像这种“一次性博弈”的情况，他正确的做法就是退场时继续装下去，这样虽然玩砸了，但还能保持一种“自我”的同一性。


    请注意，下面我要讲一个心理常识：存在心理博弈的场合中，千万不要小看这种“自我”同一性。一个“始终如一”的姿态是具有心理威慑力的。为什么？因为它象征了一种坚定，背后有强大的心理力量支撑。如果这位青年真的这么玩了，对掌握他生死大权的那些女嘉宾们，以及观众们，即使觉得他幼稚可笑，但由于信息有限，是否真的可以鄙视他，他们在心里面并不能真正确信。


    悲剧是，他居然否定了自己的表演，以为效果只是：别人也会按他的辩解，认为这的确不是真实的他。他没想到，别人一旦认为他幼稚可笑，获取了心理优势，就不会收手，在心里面倾向于希望他表现得更幼稚一些。而他还挺配合，把自己一直以来的虚弱和突然发生的愚蠢全盘暴露！


    是的，人们一定会热烈地回应他的深情呼唤——放心地鄙视他！


    你也许会说，可能有些人会受他的暗示，觉得真实的他可能也不是那么幼稚。


    我想说，当然会有这种人，但很可惜，他们不仅缺乏洞察力，而且不知道在自己心里面发生了什么。


    发生的是这件事情：青年显示的“无辜”造成了一种道德压力，让这些人阻止自己继续去痛打落水狗表现心理优势。他们涌现出“好像真实的他也不是那样哦”的念头，其本质，只是为了解除道德压力给自己造成的心理负担！


    这是在和这位青年一样陷入“心理动物”的状态，但如果是在大脑管用的情况下——尤其是在和这位青年存在利益博弈的时候呢？


    想一下后果吧！


    ## 5. 骗子和忽悠大师们最高的境界，根本不是去说服你，而是让你自我说服


    在这里，我要揭示一个人类心理的巨大软肋：实际上没有多少人，真的确信他相信什么或不相信什么，要他选择相信或不相信，他一定需要一个头脑之外的理由。


    注意，是头脑之外的理由。


    阿道夫·希特勒阁下最大的魅力，就是他的偏执和狂热，绝对相信自己真理在握，有如上帝在尘世间出现。无数掌握着通往“天国”、通往“人间极乐世界”的钥匙的“宗教领袖”和“政治领袖”，对他们的教义同样会信誓旦旦。


    这种“肯定是”“绝对有”的神圣姿态，其心理力量太强大了，本来就对“有没有”无法确信的大众，几乎无法抗拒。


    同样，曾经的行骗表演艺术家张悟本同志能够忽悠很多人，最重要的一个原因，就是人们在心里面，无法在一开始就确信他的那种“养生食疗法”一定是骗人的或一定不是骗人的。而如果相信是骗人的，他们得不到什么好处；相信不是骗人的，则可能有奇迹发生。所以，他们在心里愿意去相信。喜欢装神弄鬼的大师们最高的境界，根本不是去说服你，而是让你自我说服！


    ## 6. 当一个人出现在你面前时，请仔细分辨，他是带着一个头脑，还是一个心理


    当一个人出现在你面前时，并不仅仅是带着一个头脑，或并不是带着一个头脑。你要说服他，得看他是在用头脑听，还是用心理听。


    如果他是准备用头脑听，这个时候你必须诉诸说理，用强大的逻辑让他接受。


    如果他是准备用心理听，你和他讲道理等于对牛弹琴，你要做的只能是用“这样做对你没什么好处”“你这么干还是人吗”等来诱导他、暗示他，让他在心理上产生希望、产生恐惧、感到压力——他的心理只吃这一套！


    说到这里，我要岔开一下，教大家一个厉害的方法。当一个人和你谈到了某件事，这件事和某个人或某群人有关，比如告诉你，有人打算背后搞你一把时，请注意他的眼睛和表情！


    如果他眼睛直视你，同时有着坚毅，表情也较为凝重，那大抵是真的，因为这表明，他是在头脑上做出一个判断；注意力是在头脑对信息的整理和传递上。如果他眼睛游离不定，表情有些不自然，请相信我，他的重点不是在头脑上做判断，而是在心理上怀着某种目的，想对你说什么！


    请想象一下那些长舌妇、喜欢背后说别人坏话的人的眼睛和表情！


    ## 7. “我觉得……”句式会让很多机会从你身边溜走


    继续说刚才那个青年。在电视节目结束后，这位兄弟的光辉形象仍然停留在我脑海中。


    他犯下这种愚蠢的错误，可以说是自己心理的一个必然结果，而往往又会成为以后错误的原因。我们从来没有想到的是，当错误发生时，种子其实在他以前的人生中已经种下了，而这个错误，往往又是以后我们干一些蠢事的源头。


    我特别注意到了这位兄弟的经典台词：“我觉得……”


    在这里，我要向余秋雨老师学习，含泪劝告大家：在说话时，除非是为了敷衍、博弈、自我保护，否则要对自己狠一点，对那些对你充满期待的人干脆一点，千万不要用“我觉得……”的句式！


    这个青年成为一个心理动物，“我觉得……”正是症状之一。


    玩“我觉得……”句式后果很严重吗？


    是的，先生！


    一方面，你不是在描述一件事情本身，而只是描述你对一件事情的看法，“我觉得……”句式在心理上带有一种自我保护性质，害怕说错。在别人期待的是你准确地描述一件事情并进行判断，而不是你对它“如何感觉”的情况下，你这样干会隐隐地让人失望，他一定会认为你心里面根本就没有想清楚，没有把握，不具备控制某些东西的能力——或者，他都已经充分信任你了，你还对他藏着掖着！


    请高度重视这个硬道理：“我觉得……”句式会让很多机会从你身边溜走！


    另一方面同样致命，它是一个很坏的心理习惯，长期运用会杀伤自己。


    从语言和心理的关系上看，当一个人说出“我觉得……”时，实际上的内心深处，就是给自己一个理由，阻止自己把问题搞清楚，阻止自己在心理上对某些事情进行控制。长此以往，你的洞察力、分析能力必然越来越迟钝，而心理也越来越失去抵御打击的能力。


    ## 8. 一个人在头脑和心理上是什么档次，往往对应他在社会上是什么层次


    几千年来，哲学家和心理学家们一直在从不同的角度探讨本华老师所描述的那种阴暗晦暗的人生为什么会发生，以及如何避免。


    苏格拉底谆谆教导我们，在头脑上我们要走出“洞穴”，不要把影像当真实，做一个理性的人，而不是一个靠自我欺骗而活的人。


    康德仰望星空，沉思良久，在书里写上一段话，请我们记住“头上的星空和心中的道德律”，因为一个人要想不疯狂和心理畸形，必须有所敬畏。


    海德格尔在“存在主义之河”中跋涉时，突然看到了人类“存在”的真相。他说，语言就是“存在”的家，而“存在”则是我们的家，千万不要遗忘我们的“存在”。


    弗洛姆接过海德格尔的话，说，爱和创造性的工作是我们克服与世界分裂的两条道路。如果我们把自己给卖了，将成为一种“存在的败笔”，而我们来到这个世界上，本来不应该是这样子的。


    在奥地利首都维也纳，弗洛伊德突然充满了悲悯，他说，“压抑”是我们痛苦的源头，而人在心理上，总需要一个“父亲”的保护。如果我们真想告别心理上未成年的阶段，那么，请学会在心理上独自生活。


    ……


    如果说头脑和心理，是人的“内存在”的话，那么，他的处境、他的命运，总会同时受“内存在”和“外存在”（外部世界）的影响。在某种意义上，他的头脑和心理是一种什么样的状况，影响到了他的处境和命运。


    也就是说，一个人在头脑和心理上是什么档次，往往对应他的处境和命运，对应他在社会上是什么层次！


    而行为的背后，则隐藏着头脑和心理的秘密。


    很幸运，我们已经可以看到这样的秘密。


    从这里开始，我将站在哲学和精神分析先辈们的肩膀上，在他们看到和没有看到的地方，把这个秘密说出来。

