    不能这样做”。。


    同时，看到了这一点；他也知道自己想吃零食的欲望应该得到理性的控制，在这个世界上，不是他想干什么就可以干什么，不能放纵自己——在以后的类似事情上，他采用的，是理性地约束自己，而不是压抑自己的策略。


    还记得我原来说过什么吗？ “理性对人构成了一种真正的说服！”


    再强调一下：你要在头脑上说服一个人，最好的办法就是让理性来说服他，而你要在心理上说服一个人，最好就是让他自我说服！


