    你享有安宁和财产，而他在遭扼杀、在流血、在痛苦地挣扎，内心还要忍受着像卡塔琳娜·克雷默尔那样的厄运。你睡的床，你穿的衣，是我们用我们的金钱这种专制统治的鞭子强迫那些饥饿的人为我们制造的。而你并不知道，有多少妇女在制造你那燕尾服的料子时倒在了机器旁，有多少人被害的煤气薰死，这样你父亲才能赚到钱，付你疗养费。而你却为不能读两页以上的陀斯妥耶夫斯基的著作而车骚满腹。我们是群怪物，我们吃的苦太少了。一个屠夫在屠宰场会为自己的白围裙沾上了血迹而感到心烦，这实在太可笑了。""


    是的。在这个世界上，利益之上还有正义，社会价值排序之上，还有良知。


    这封信，是法兰克福学派成立的最初源头。而克雷默尔这位可怜女工的遭遇，构成了霍克海默一生的心理背景。他和他的同事们选择批判，而不是选择一个无良的富二代的心理动机，是因为作为富二代，他们面对克雷默尔们，有负罪感、道德感、正义感！


    为穷人说话，成为他们的自我认同。


    # 4. 好哪一口，也许就是驱动我们行为的神秘符码


    在这方面，我还没有讲完。有更复杂的情况，比如我们看见一个人干了一件坏事、蠢事，但不知道他为什么那样做。


    这个时候，我们的原则是：综合梳理和他有关的信息，看哪些能够和他的行为联系起来。就是说，看哪些心理背景最容易激活、驱动他的行为。如果这些心理背景可以在心理上合理地解释他的行为，那么，这便是他的心理动机。


    比利时有一个叫阿妈拉尼的电焊工，有一天跑到一个城市广场里，突然对人群大开杀戒。他先是用手榴弹炸，然后用步枪、手枪向人群开火，制造了5人死亡的重大人身安全事件。


    这位阿妈拉尼先生也自杀了——当然，肯定是“畏罪自杀”。


    而在前往广场杀人以前，他把自己的现金全部汇入老婆的账户，还留言说“我爱你”。于是，血案发生后，有媒体说，他这是在表示，他恨其他人，'
  - '[PAGE 164]


    # Part III


    但爱老婆。


    由于阿梅拉尼已经死了，他的杀人动机成了一个谜，警察表示不知道。但我们能破译他的心理动机吗？当然能！


    注意一下这些细节：这位仁兄平时喜欢玩枪。他曾因私种大麻和收藏武器而被捕入狱。当时警方在其家中查抄出一支冲锋枪、一支带瞄准器的狙击步枪、一具火箭发射器、数百发枪弹和一些消音器。


    再记住这个细节：他杀人前是先用手榴弹炸，然后才开枪。


    想一想，枪的功能是什么？射击、杀人对不对？


    再想一下，一个人整天拿一杆枪瞄来瞄去，拆来拆去的，却又杀不了人，是不是非常地郁闷、压抑？


    所以，用我们的“身份、地位……——情境”公式套上去，就可以看到，在这样的情境里，他的爱好被刺激起来了，构成了杀人隐秘的心理动机，内心里，始终有一股强大的欲念，推动他去向人群开火！为此，他甚至可以用死来做到这一点。


    我想说，爱好、价值观、自我认同……所有这些东西，无不是驱动我们行为的神秘代码。一个人好哪一口，如果是好事情，就会成功在哪一口上；如果是坏事情，也许就栽在了哪一口上。


    当然，像阿梅拉尼这种人，被爱好驱动要去玩真的，要大开杀戒时，内心里当然也会有犹豫和恐惧，人毕竟都不想死。正因为如此，他为了让自己完全放开，就选择了用手榴弹爆炸，来营造氛围，让自己进入角色。当爆炸声响起，就像演出的音乐响起，他登台演出，从一个只是把枪拆来拆去过瘾的人，成了一个真正的枪手。


    # 破译心理动机的第二条路径：看到一个人在玩心理保护


    # 5. 一个人装的时候，他一定是想要去掩饰、包装什么


    到这里，我们要问一下：这么一个凶残的、已经没有人性的人，真像媒'
  - '[PAGE 165]


    体所说的那样很爱老婆吗？


    这就涉及了我们破译心理动机的第二个杀着：看到一个人在玩心理保护。


    在本书的第一部分，我已经爆料，在很多时候，当一个人说什么、做什么（不管是“正常”的、怪异的），其意义可能只有一个：对自己进行心理保护。


    如果一个人的语言、行为很怪异、很夸张，你要高度注意了。因为，他等于把自己高调地暴露了。他的语言、行为和事实或情境不协调，因此显然是要去掩饰、逃避什么；或者，他有点不自然和夸张，肯定是要掩饰、包装什么东西！


    掏出小本本把这一点记下来没有？有些话，虽然是我说的，但还是具有“一句顶一万句”的威力了。


    来看电焊工是否爱他老婆。回答当然是：不。


    他根本就没有爱任何人，包括他自己。他之所以对他老婆说爱，完全是说给自己听的，向自己证明，自己还是有爱心和人性的。


    也就是说，在心理上，他要保护自己，要体验到行为的意义，不想承认自己就是为了去杀人。他要表明他的动机很单纯，只是想实施成为一个真正的枪手的伟大抱负而已！


    很多人干坏事时，往往会这样辩解：“我只是想 ××× 而已。”


    # 6. 有时候，所谓的“个性”，不过是我们想掩盖自己的虚弱而已


    强调一下，我们用“看到一个人在玩心理保护”这个杀着来破译心理动机时，可以适用于很多情况。但是，如果你发现，某人说话、做事好像比较怪异、反常，或搞得很夸张，那就坚决用这个方法！


    在生活中，我们可能会碰到一个脾气暴躁、动不动就发火的人。区区一件小屁事就让一个人这样，很夸张对不对？


    那他想干什么？觉得自己很牛吗？


    如果你碰到这种人，马上可以判断，他是在对自己进行心理保护。他玩出这种火气大的 Pose，其实是透过愤怒，来掩饰内心的无力和失败。由于玩'
  - '[PAGE 166]


    成习惯，玩成“个性”，已经成为一种他意识不到的自动反应机制了。


    如果你保持淡定，注意他的眼睛，看他那张扭曲的脸，一定会发现这一点。


    再来看另一种情况。


    有一个女生在网上问过我一个这样的问题：“当一个人把世界看得那么透彻的时候，活着是不是很累？有时候会觉得，看得越透彻，生命越没有意义，或者越不是我们原来认为的意义，这样想是不是太危险？”


    你知道她这句话到底是想说什么吗？


    她不敢面对自己，想阻止自己去知道更多的真相！


    我是如何知道这一点的呢？很简单，一个人累不累，和他是否看到了世界的真相在逻辑上没有关系，只是在心理上有关系。而她这句话，表现出了 一种对“真相”的害怕。


    那情况就清楚了：她被人伤害过，但伤害不深，知道这个世界有时候比较残酷。但因为缺乏防御能力，所以不想知道世界的“真相”，因为世界在自己的心里面越模糊、越简单、越美好，自己似乎就越不会受到伤害，不会很“累”。为此，她甚至宁愿活在虚假和幻觉之中，不想从曾经给了她安全
    感的地方走出来。


    # 7. 一个敏感的人，是一个害怕被人伤害的人


    我归纳出了一些从心理保护入手去破译心理动机的简单公式。就此来结束这一章的讲述。


    这些公式，在你学会了运用破译心理动机的方法时，其实也可以自己归纳的。


    +   a. 当一个人对别人的话非常敏感，总是在怀疑别人说自己的坏话时，请相信，他害怕被别人打击。要阻止自己遭受打击，他必须“先发制人”，在心理上认定别人对自己搞鬼。


    +   b. 当一个人看起来在语言上攻击性很强，那只能证明一件事：他觉得自 己很失败，但不敢面对。因为，一个人对外的攻击，正是他的内心被破坏的结果。'
  - '[PAGE 167]


    +   c.  当一个人对谁都不信任，他的心理动机就非常清楚：被“熟人”伤害过，没有安全感。


    +   d.  当一个人喜欢出风头，越是热闹的地方他越玩得起劲，而只要单独让他一个人静下来就受不了，答案是唯一的：他非常空虚、焦虑。'
  - '[PAGE 168]


    # Methodos


    # 10


    # 第十章


    # 澄清'
  - '[PAGE 169]


    # 1. 澄清是心理上的一剂解毒药


    经过前面的铺垫，我想预告一下：从这一章开始，心理分析是一门可以让你和别人区别开来的技术活了。


    我想请你先想象一下这样的场景——注意，是想象，让一幅图景出现在你头脑中，无论你有没有经历过。


    赶场天，在一条通往县城的乡村公路上，你坐在一辆小轿车上，呼啸而过，卷起漫天灰尘，在你的背后，是你认识或不认识的乡亲，正在被灰尘笼罩。你回头望去，看着乡亲们，心里——


    我问的是，你有没有一种阴暗的快感？！


    ......


    你绝对有！


    我不是要你忏悔。但如果你看了《世界如此险恶，你要内心强大》，你一定知道，你之所以会有快感，是因为你显得高档，乡亲们显得低档，在社会价值排序上，你的位置比他们高，对他们有心理优势。而且，如果你还能听到内心的声音，你甚至还会有一种阴暗的负罪感，这种负罪感一方面让你爽，另一方面，又让你有道德压力。


    看到没有？以上一番话，就是对你阴暗的快感在心理上进行澄清。


    澄清的结果是什么呢？在这个场景中，你看到了这种快感的无聊之处，把它给驱散了，从屈服于社会价值排序的档次中解放出来。这是对自我的一种提升，也是心理上的一剂解毒药。


    # 2. 头脑的混乱会让我们变得愚蠢，而心理的混乱，则会杀伤我们


    什么是澄清呢？在这里，它指的是一种心理分析的态度、方法，让处于混乱中的头脑和心理恢复正常，让我们保持对自我和他人的洞察。


    很清楚，头脑的混乱会让我们变得愚蠢；而心理的混乱，则会杀伤我们。我们需要澄清这个方法帮那一把。


    你看到一个人发狂的时候吧？那是他头脑和心理的混乱，盲目地拽住他、'
  - '[PAGE 170]


    折磨他，使他达到了崩溃的临界点。


    老实交代一下，澄清这个态度、方法，我是从哲学中得到启示的。


    20 世纪初，西方哲学有过一个“分析哲学运动”。之所以有这个运动呢，是因为哲学几千年来，吃过太多“假命题”的苦头。这些“假命题”看起来高深莫测，让人难以回答，不好想象，甚至不可思议。而真实的情况是，它们不过是用错了语言的结果——就是说，问题本不该这样提问的！


    我们来举一个非常简单也非常荒唐的例子，它出自于亚里士多德之手。


    > 亚老师是这样说的：“一座未来雕像的形式，必定在那块木头被雕刻前就形成在它里面了，否则，后来就不会有这个形式。”


    这句话让人云山雾罩的。但亚老师不管，经过“一切变化都包含在内容取得形式的过程中”的过渡，马上推出了一个普遍性命题——“形式必定是一种物质”。


    看到这里，我已经晕了。


    亚老师这种古代牛人，怎么会犯如此低级的错误？仔细一看，原来就是 对语言的滥用和误用！


    “形式” 仅仅是一个描述性的概念，它对应着某个实体的存在形态，而 不是实体本身，或实体的构成材料！你怎么可能当成一个实体的概念来用呢？说它存在于一块被雕刻木头的里面，就是把它当成了一个实体概念。


    正是这种对语言的滥用、误用，让大家都知道，可能就亚老师不知道：一座未来雕像的形式，不过是先存在于“设计师”的头脑中而已，而不是存在于木头里面。


    “澄清”在哲学上几乎是必然的。如果你发现你对某一件事情说不清楚， 是否应该反思你所用的语言出了问题？


    “分析哲学运动”是干什么吃的呢？回答是：它让一个哲学家在提出 一个什么问题时，用语言—逻辑来澄清一下自己所说过的话是什么意思，而不要 装神弄鬼。


    值得一提的是，在“分析哲学运动”里，旗手既有我们前面所说的妇 女之友罗素同志，也有“高帅气”维特根斯坦同学。为了避免对语言的滥用'
  - '[PAGE 171]


    和误用，维同学就恶狠狠地说：“有些时候，必须把某个词语从语言中取出来，把它送去清洗——然后才能把它送回交流之中。”


    我们可以不去管这些哲学问题，但心理问题呢？


    我先说一下，如果我们是 对自己的心理进行澄清，那么，结果将会是：我们把心理问题消除了，不再受它的折磨，至少不会恶化它。


    如果我们是澄清别人的心理呢？结果是：我们知道了他想做什么，他是什么人。


    # 澄清的第一种运用：分析情感、情绪、态度等的本质


    # 3. 重 复 一 次 你 对 别 人 的 态 度 、 情 感 ， 你 就 固 化 成 某 种 人 一 次


    我们会骄傲、谦虚、狂妄，会爱上一个人，也会讨厌上一个人。


    那么，它们的本质是什么？


    我不入地狱，谁入地狱，说到澄清的第一条路径，我要老老实实地承认一下，我曾经讨厌过一个人，那就是香港明星周润发，一见到他就会本能地不爽。


    回忆一下，发哥是这样开始被我讨厌的。那个时候，他在电影上扮演的多是英雄的角色，非常厉害，双手拿枪，走在明处，可以轻而易举地打死很多拿AK47待在暗处的歹徒，而他自己却不会被打死，嚼着口香糖得意扬场，搞得非常地酷、非常地伟大。


    那一时刻，我心中涌现的想法，就是希望他被打死。但导演当然不会满足我的心愿。于是，我一见到他就讨厌，持续了相当长的岁月。


    我不讨厌英雄，但确实讨厌这类似乎想干死谁就可以干死谁，同时又得意扬扬的英雄。这种心理是怎么回事？又能说明我是个什么样的人？让我们来澄清。


    +   A. 第一个教程：寻找反差。


    润发兄弟演得太假了，和现实、和“艺术的真实”都有反差对不对？又'
  - '[PAGE 172]


    不是科幻电影或动画片，有那么厉害的英雄吗？


    这就暴露了我和别人的一个区别: 只要能够爽, 他们在内心里可以容忍,忘记虚假, 而我不能。我无法接受一个虚假的光辉形象。


    再进一步, 我对这种夸张的英雄的反感, 只是不能容忍现实中的虚假、虚伪的一种投射, 尤其是, 这种虚假、虚伪还和扮酷、装联系起来。


    那么, 你可以看到: 我是一个骨子里时装有厌恶感的人。


    同时, 你还可以看到, 我绝不是一个拿无聊、肉麻当有趣的人。比如,小时候, 看香港的那些装作很搞笑的电影 ( 不是周星星同学的, 星星同学还是很幽默、很经典的
    ), 在别人傻笑, 觉得好玩的时候, 我一定会有这样的反感心理: 很搞笑、很好玩吗?


    如果你看这类电影、电视, 和我的感觉一样, 那么, 你绝对也讨厌装,你是一个认真的人!


    以上是对我讨厌发哥的第一步澄清, 也是对我是什么人的第一步解密。


    B、第二个教程: 分析情感本质。


    我们接着走第二步。


    当我讨厌周英雄的时候, 由于他扮演的是正面的英雄角色, 那我是不是在情感上站在了坏人一边?


    回答是: 这是一个错觉。


    想一想, 当一个英雄想干死谁就干死谁, 并且还得意扬扬时, 他和一个坏人想干死谁就干死谁, 并且还得意扬扬, 在Pose上有多大区别? 如果把“正义” “邪恶”这些词语拿掉,
    他们都是强者, 要踩死弱者, 不过像踩死一只蚂蚁。


    于是, 当我看周英雄的壮举时, 看到的, 并不是电影上一个英雄在消灭一群歹徒, 而是像在现实中, 看到了一个强者在欺负一群弱者一样。


    这暴露出了什么? 我同情弱者, 厌恶强者!


    我同样也可以下一个判断: 一个崇拜这种 “英雄”的人, 其实也是一个强力崇拜者, 尤其是那些喜欢拿无聊、肉麻当有趣的人!


    到这里, 我讨厌周润发先生的心理得到澄清了: 那是我讨厌虚伪, 同情弱者, 反感强者的 一种投射。'
  - '[PAGE 173]


    但我不应该讨厌他们本人。而且，我这种心理，一旦澄清，其实也是对我自己的一种警示：做人，不能这样死板，也不能根据“强者—弱者”的标签来思考问题。


    但还有一个问题我们没有澄清：为什么在我希望导演安排周英雄们死，导演不干，我就讨厌了周英雄们呢？


    我不知道你看到没有，我玩了一招心理保护。既然导演不能满足我的愿望，让我心理受挫；我奈何不了发哥，那为了心理生存，就必须对他进行攻击。讨厌，就是一种攻击性的情绪。


    我其实是利用讨厌来治疗自己的心理挫折！同时，我重复一次对他的讨厌，对我讨厌装、反感强者的“自我”，也会固化一次，即越来越成为某种人。


    所以，澄清了自己的这些心理问题以后，我们就必须决定，到底该在多大程度上，继续成为某种人，或必须改变自己！


    # □ 澄清的第二种运用：分析言行的心理含义


    # 4. 在一个激烈或极端的行为出现前，在心理上它往往经过了漫长的压抑


