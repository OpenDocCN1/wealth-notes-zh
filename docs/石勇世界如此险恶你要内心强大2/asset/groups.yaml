    13． 对自己说 “我一定会成功”， 绝不是自我暗示， 而是自我强迫！


    有一件事让我很感动。


    在清华大学给学生讲心理分析的时候，曾经有一个外校的女生，大老远跑来听并问我一个问题。她已经快毕业，面临一个“毕业后工作还是考研”的选择。她说，她很想工作，但又感觉，也许读研后竞争力更大一些，尤其是她父母非常想要她考研。在这样的压力下她很矛盾，问我怎么办。


    我直接给出建议吗？不能。我首先要给她澄清，她的想法在心理上是什么意思。


    是什么意思呢？正如我一语道破的：她想工作，其实是对父母养自己那么多年感到愧疚，想早点报答父母——或者准确地说，她是对那么多年在父母的期待下读书，感觉有压力，想解脱出来。


    也就是说，无论是想工作还是继续读书，都不是基于她真正的兴趣。她的矛盾在于：一方面因为想摆脱父母的压力，想通过工作来解脱，但在竞争很大的情况下，对未来又没底，存在继续读研以摆脱这种焦虑的幻想；另一方面，读研又意味着要承受父母的压力，所以又想工作。这是一个正反馈式的循环链条，陷入到这里面，痛苦可想而知。


    这就是对她的想法在心理上是什么意思的澄清。看到了这一点，就可以砸烂这个循环的心理链条走出来了。该怎么做非常清楚：读研，选择自己感兴趣的专业读！


    现场还有一个同学问了一个同样是和考研有关的问题。他说据说自我暗示是一种很好的方法，可以让自己坚定目标，所以他一直在自我暗示“一定要考研，一定会考上”。


    这是在自我暗示吗？正如一个人在干一件事时对自己说的“我一定会成功”，然后好像就能更成功而不是搞砸？不，所有这些情况都不是自我暗示，而是自我强迫！


    在心理上，对自己说“我一定要考研，一定会考上”是什么意思？这绝不是通过暗示，给自己信心、力量、“正能量”之类，而是一方面对考研成'
