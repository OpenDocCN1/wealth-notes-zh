    务不让父母担心。因为你还小，欠缺一定的识别能力，所以呢，父母就不能放手让你吃零食，因为要对你负责。"


    看到没有？如果你对小孩采用命令的方式，无论他如何反应，在心理上都会遭到抵触，因为这阻遏了他成长中自我的独立倾向，把他变成了你控制下的附庸，这时他在心理上一定要反抗的。要成功地消除他的反抗，你只有把自己变成一个暴君，一个施虐狂，让他一听到你的声音，一见到你就害怕。后果是什么，不用我再说了吧？


