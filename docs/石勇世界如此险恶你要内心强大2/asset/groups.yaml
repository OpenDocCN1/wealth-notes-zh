    ## 8. 如果你带着一双恐惧的眼睛看待这个世界，那么，一个微不足道的东西，都可能打败你


    一个人越是处在恐惧、焦虑、紧张、怀着巨大希望等心理背景中，心理抗打击能力越弱，越容易产生心理问题。那么，一种心理问题的症状，是如何产生的，如何消除它？


    我想说，在自我分析上、在自我认识上，对我们的心理逻辑进行梳理，是一种很高的境界。


    我们梳理心理逻辑的第四个运用是：看清一种心理症状，比如强迫症，到底是怎么来的。


    来看一个对噪声非常敏感的女生，她被一种强迫症——“噪声敏感症”，折磨得痛苦不堪。


    这种症状还在生理上体现出来，就是头痛。


    因为这种症状，她错过了心仪的大学，工作也大受影响。


    这个女生在小的时候父母感情不和，给她带来一些伤害，很自闭，很少和父母交流。在高中时，她甚至想离开家。也因此，她好胜心强，不服输，从小就是“三好学生”。在中学的时候为了超过其他同学，经常熬夜学习。善良，不习惯麻烦别人。


    在高三的时候，问题来了。


    有一天，她正在教室里紧张备考。听到有人咳嗽，一开始她的注意力稍微被分散。但仍有咳嗽声，她心烦、焦躁，大受影响。再后来，这个过几分钟就出现一次的声音，成了干扰她自习和听课的最大障碍。


    那时候，她每天很早起床，比其他人都早。但坐到教室后，学习没有效率。


    还远远不如那些懒散一点的同学。


    记得有一次班会，班主任说到这个问题，说有其他同学反映有人咳嗽影响自己学习，她知道原来存在这种困扰的不只是她自己。这让她更认同，是咳嗽声影响了自己学习。最后，情况变得更严重，她听到这个声音就开始头痛。


    到了大学，开始有所缓和，但“噪声敏感症”仍然或轻或重挥之不去。每当她需要集中精力做事情时，比如看书、学习，症状就会比较明显。


    大二的时候，她交的男朋友有清嗓子的习惯，这对她的影响非常大，也加重了她的症状。她一方面深受其苦，比如每当听到男友清嗓子或咳嗽的声音，甚至是哪怕他不在身边，她想到这件事，或者想到他，都开始头痛。她本能地想分手，解脱；但另一方面，她跟男友的感情还不错，她觉得因为自己的这种原因跟男友分手，对他不公平。


    工作之后，“噪声敏感症”依然存在，并且开始扩大化：不仅仅是听到别人的咳嗽声，或清嗓子的声音，还有关门的声音、办公室电话的声音，等等，在那种环境中很容易被忽略的，只要被她注意到了，都成为影响她的因素。她意识到这个影响到她了，就条件反射地开始头痛。越想排除，越加重。严重的时候，一天都没有状态，工作毫无效率。


    ### 心理背景 1

    由于父母感情不和，她有某种自卑，也知道不能依靠父母，以后的人生必须靠自己，必须逃离那个没有温暖的家庭，逃离那个不如人意的自己，所以从小努力学习，好胜心强。她努力学习；看成是自我拯救的方式。显而易见，她会自我加压，强迫自己这样做，而且，也始终处于紧张的状态中。


    ### 心理背景 2

    一个强迫自己努力，保持紧张状态的人；也是最敏感的。他害怕任何意外因素的干扰，因为这些他不能控制并且又影响到了他的因素，在心理上，会破坏他的努力，而破坏他的努力，必然会影响到底努力成果。这个女生正是这样。


    ### 刺激

    她带着这样的心理背景，在教室里紧张备考。这个时候，有人咳嗽，刺激到了她，注意力被分散。注意力分散产生了这样的心理后果：她害怕被干扰，而学习不下去。然而，咳嗽声仍然继续，几分钟一次。这刺激到了她的心理结构，激起了她不能学习下去的恐惧。于是，她心烦，焦虑，情绪大受影响。


    ### 强化

    咳嗽声并没能在那一次后就这样停止。于是，越紧张、敏感，越容易被咳嗽声影响，而越被咳嗽声影响，就越紧张、敏感，就有学不下去的恐惧。而她每天很早去学校，学习却没有懒散的同学那样有效率，更是一个很大的打击，让她没有自信，而没有自信，心理更加弱小，更害怕受到干扰。于是，咳嗽声成为她学习的杀手。她还把这一点客观化了，因为从班主任那儿，她证实了这一点。


    ### 症状形成

    她想学习好，想成功，以及害怕努力失败，这样的恐惧，由此和咳嗽声联系在一起了，因为对咳嗽声的恐惧，就是对失败的恐惧，面对失败的恐惧，也是对咳嗽声的恐惧。在心理上，咳嗽声既然和对失败的恐惧有关，那么，只要是集中精力想做好的事情，她就会有对咳嗽声的恐惧。“噪音恐惧症”由此形成，虽然一开始只是“咳嗽噪音恐惧”。同时，“噪音恐惧症”也有生理上的症状表现，就是头疼。


    ### 症状加剧

    一个人一旦形成某种心理症状，他心理更加弱小，心理背景更加有恐惧，更害怕，也更受不打扰。由于她进大学，相对不需要那么紧张，所以她的“噪音恐惧症”有所缓解。然而，在大二的时候，男朋友清嗓子习惯，因为总咳嗽，又刺激到了她的心理结构，加重了症状。在道德压力下，她既害怕咳嗽，又不分手，出现心理冲突，而这反过来加剧了她的症状。


    ### 恶化

    工作之后，压力变大，也更紧张。症状继续加剧、恶化。由于其他声音和咳嗽声、清嗓子等具有相同的干扰功能；而这些，都会给她带来恐惧，因此她不仅是对咳嗽声、清嗓子的声音敏感，对任何可能听到的声音，比如车门的声、办公室电话的声音等，都变得非常敏感。这些声音，都成为影响她的因素。在心理上，它们已经和她的恐惧对应起来了，而且也对应于症状的生理效应——头疼。


    她说，这是“积重难返”了，“透不过气来”。她坦白自己曾几次因此觉得活着没有意思。


    好，描述到这儿，我们来回答问题：她的“噪声敏感症”是如何发生、恶化的，心理逻辑是什么？


    在这里我们看到了：一种症状一旦形成，就会自我恶化。


    原因在于，我们“治疗”症状背后的恐惧的办法，或者就是强迫自己“不要这样想”“不要这样做”，这样就会和恐惧的那种心理力量产生心理冲突，更加紧张、焦虑、恐惧；或者，我们直接把症状表现出来，通过钻进强迫性症状的那个仪式来获得安全感，就是说，用恐惧的产物——强迫症——来治疗恐惧。


    这种饮鸩止渴的办法，只有一个下场，那就是失败。


    你可能要问，为什么一个人，会被这样一个微不足道的干扰困扰了那么长时间，被它给打败了呢？


    我的回答是：因为她是带着一双恐惧的眼睛，去看这个微不足道的干扰的。而现在，她要做的事情，就是通过自我心理分析，逃出症状，逃出那个心理背景！


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_224_0.png)


    # 答读者问


    ## 1. 拍吧，到你了


    问：小女刚毕业，在一机关办公室上班。办公室一大妈整天炫耀，贬低、鄙视别人，摆出一副自己无所不知的样子。本人内心不强大，经常遭她鄙视，不知道该如何对付此类人？


    答：她骨子里在你面前很自卑，但有经历可以压你。所以，她是在向你发出一个信号：“拍我马屁，给我面子，然后我会回报你！”拍吧，到你了！


    ## 2. 厌食其实是害怕和别人接触


    问：厌食症、肥胖症有什么心理上的原因吗？


    答：当然是啊。想一想，厌食的人不想吃饭，好像也不饿，同时，心情抑郁，似乎饭是不洁净的、有危险的对不对？饭，就代表了他的“自我”之外的世界，不想吃饭就是不想和外界发生联系，因为发生联系，对于他来说就是危险的。


    所以具有厌食症的人，大多数是没有热情去和别人打交道的人。


    再来看肥胖症。一个人搞得那么肥胖，肯定是吃多了，但吃多了不仅仅是生理需要，也是心理需要。他心理上需要什么呢？需要占有世界，要把世界纳入他的胃中！


    肥胖症，是他吃了两片用来治疗焦虑的药片的结果。一片是用来消除不安，他吃的不是饭，而是药物；一片是把“世界”纳入胃中来变相满足自己的占有欲，吃的同样不是饭，而是金钱、物品和别人的关系！


    ## 3. 反抗，有时候只是你在向自己证明：你没有把自己给卖了


    问：我发现我有一种挺可笑的倾向，就是遇到自己不愿意或者与我价值观不一致的事，但又不得不做时，就会试图消极地反抗，比如做事打个折扣、离岗等，似乎这么挣扎过了，才能安于心处境。这是什么心理？我应该是自卑
    + 表演型性格的人吧？


    答：你这是在心理上保护自己，不至于让那些你不愿意但又不得不做的事情伤害到你的心理结构，你反抗了，就是在心理上向自己证明：你没有因为利益别的原因而把自己给卖了。


    这是正确的，不要觉得自已怪。它的负面效应是你这样一直玩下去，会有心理冲突，它会放大、折磨你。


    所以，最好的办法，不是这样，而是：澄清你要做这件事情的意义，因为如何，所以你必须做，这样，你就不是被迫带着心理保护去做。


    ## 4. 在别人没有看见你的时候，训练能力！当别人看见你的时候，表演能力


    问：请问老师，在乎别人对自己的评价，听到自己的不足就会暗暗努力修正的属于哪种心理？


    答：你在心理上真是狡猾的，而且，只要努力，注定不是平庸之辈。相信我，没错的。


    我教你一招来了解自己。


    你在乎别人的评价，表明你追求优秀一些，但对自己没有足够的自信。


    但听到不足时，你没有郁闷、沮丧、生气，表明你是一个敢于面对自我的人，而且，你也清楚，自己有很多不足。


    如果是一个不敢面对自我的人，在这个时候就沦为心理动物了；如果别人夸他，他就会很爽；如果贬他，他就会恼怒。总之，别人的话，引发的只是他的情绪，而不是引发他对自我的审视。他要靠情绪来避免别人和他自己接触到他的内心！你看，他的心理保护，是不是玩得太夸张了点？


    一个人有没有出息，最关键的一点，就看在心理上，是不是要阻止自己


    去面对自我。


    而你为什么听到自己的不足，就会暗暗努力去修正？事实上这是在告诉你，你其实在内心里也知道自己的不足，并愿意去修正，只不过，平时你有惰性，没有给自己压力，把它给忽略了。但当它暴露在别人面前时，你知道不修正不行了，因为你的这些不足，暴露在了别人面前，你在心理上、价值上都处于劣势。


    为什么是暗暗地修正呢？这涉及你的一个秘密：在和别人打交道时，内心里有着防御，害怕成为透明人。你追求一种你在干什么别人不知道，但当出现在别人面前时，让别人大吃一惊的那种快感。


    一句话，当你不足以在心理上、价值上占优时，你不愿意让别人看见你，而当你在心理上、价值上占优时，你会把自己亮出来。


    所以，在别人没有看见你的时候，训练能力！当别人看见你的时候，表演能力！


    ## 5. 无知有救，愚蠢没救


    问：无知和愚蠢有什么区别？


    答：无知是用来描述智力结构的词语，就是在头脑上你不知道而已，没什么丢人的，只有不敢承认自己无知才丢人，但“不敢”，已经是一个心理问题了。


    和无知不同，愚蠢同时是智力结构、心理结构的概念。它说的不仅仅是一个人不知道，而且也在心理上也预设了自己知道，并且阻止自己去知道！


    所以自作聪明、自我感觉良好、自负的人，其实都是愚蠢之徒。


    ## 6. 敏感，就是你害怕被伤害，所以先要认为别人是在伤害你


    问：我很敏感，我不知道我怎么了？


    答：我也不知道你怎么了。但我知道，你的敏感不是你头脑敏锐，而是你心里有焦虑，甚至有恐惧，你害怕某些事情的发生打击到你，所以你要主动进行心理防御，避免到时猝不及防，受到伤害，所以，有什么苗头，你马上就认为是这些事情发生的征兆。


    我不知道你意识到没有，你在敏感的时候，是一只心理动物。


    ## 7. 当我们很迟钝，我们就是在装看不见世界的危险


    问：老师，我一直觉得我是一个迟钝的人，别人讲什么，我半天都反应不过来，我改变自己啊？


    答：看来你知道自己迟钝可能不是头脑的问题，而是心理的问题。申明一下，头脑的问题我是没办法的。


    迟钝在心理上是什么意思呢？就是你封闭自己，害怕和世界关系介入太深，宁愿活在自己心理的一亩三分地。你之所以对别人讲的半天反应不过来，其实是你害怕反应过来会有什么后果。你的迟钝是在对世界的危险闭上眼睛。我不知道你在以前发生过什么，但可以肯定：你对和别人打交道不适应。


    如果你还有一个朋友，多和他交流吧，尤其是争论一些问题。


    ## 8. 一个人只会抓住他在心理上能抓住的东西


    问：为什么很多 90 后那么短视，只想享受现在不去想将来啊？


    答：很简单。他们成长在一个变化非常快的时代。变得太快意味着什么？意味着很多东西，尤其是“未来”的不确定性增大多了，人在心理上无法抓住他。但“现在”是确定的，因此在心理上也是可以抓住的。


    那么，从心理保护而言，为什么要去想根本不确定的“未来”，而不是享受“现在”？


    如果还不明白，那你想想，当一个社会不变时，未来是不是可以确定的？就是说，日子只是周而复始，明天是什么样，未来是什么样，你可以看得清清楚。


    但如果社会变得太快，明天是什么样你就不知道了。


    ## 9. 出轨不一定是婚姻不如意，而是不去占有偷情的经历，他们感觉人生会有遗憾


    问：我是男的，在一家公司当中层管理人员。为什么我有一种白活了那么多年的感觉？


    答：一个人的人生是由经历构成的。那些影响过我们，让我们成为某种样子的经历，一定是“心理上的经历”，它冲击、改变过我们的心理结构。


    有的经历对我们的心理结构没多少影响，比如我们每天上下班，看见那么多的人、碰到那么多事，它们只会在我们的智力结构和心理结构表层停留一下，然后像烟一样散去。


    正因为经历对于人生来说是如此重要，而你特别看重某些还没有的经历，所以感觉白活了。


    另外我想说一下，很多男人女人蠢蠢欲动想出轨一次，并不一定和婚姻不如意有关，而是想着去占有“偷情”的经历，这样人生似乎才不留下遗憾。


    ## 10. 喜欢围观的人，内心里有破坏性，不敢去围观的人，骨子里害怕暴力


    问：出了什么事，很多人喜欢去围观，但我每每看到这种场面，都想走开。这是什么心理？


    答：表明你内心懦弱，骨子里害怕暴力啊！


    鲁迅老前辈曾说围观者就像一群被人提着脖子的鸭，这是文学描述。从心理分析上，其实我想说，围观者是一群心理阴暗、内心深处有挫败感、一直想发泄、想破坏的人。而无论别人出了什么事，他凑上去看热闹，就变相地满足了这种阴暗的心理，因为发生这类事正是他内心所希望看到的，他可以从围观中得到发泄，而且没有任何风险。


    那些不想围观的人呢，比如你？


    你会害怕暴力。原因是，你害怕一种不可控制的、可能会伤害到自己的庞大力量。而围观的人组成了一个这样的群体。围观时，可能人群沸腾，可能不可控制地出现乱成一团的局面。所有这些，都对你构成了一种威胁。


    那么，出于心理保护，你会主动躲开这种威胁，就是不去围观。


    ## 11. 当你觉得别人有哪儿不对劲时，请抓住你的感觉


    问：我一个同学，平时彬彬有礼，温和谦逊，待人非常客气。但是在散打考试中，打人打得非常凶狠，令周围的人都很吃惊。他是什么心理？


    答：这个人提醒我们，要注意的是一个人真正是什么样子，而不是他看上去是什么样子。要不然，我们哪一天在他手上吃亏都不知道。


    就是说，我们看一个人，不要以为看他表现出的是什么样子就完了，那可能只是一种伪装。我们可以从他的表情、语言、动作等捕捉到他的内心，以及他是一个什么样的人。


    这里有一个简单的方法：当一个人在你面前出现时，无论扮演的是什么角色，只要在表情、语言、动作上玩得稍微夸张一些，以致你内心感觉到有点不真实，或有点别扭，那你一定要注意了，要抓住你这种感觉，因为它告诉你，这个人表现出来的，不是他真实的样子。


    接着，你可以用心理分析，来破译他到底是什么样的人，想干吗？


    说一说你这个同学。他彬彬有礼，温和谦逊，待人非常客气，嗯，看上去简直是君子的典范对不对？人们很吃这一套。但是，有点不对劲啊。


    因为，我们和一个人交往，要么就是人格的交往（比如朋友之间），要么只是角色的交往（比如和客户）。虽然交往要借助于表情、语言、动作上的礼貌和客气来作为润滑剂，但两个人的交往毕竟要么就冲着关系来，要么就冲着利益来，而不是冲着这一套礼貌、客气来。


    所以，如果是人格的交往，在表情、语言、动作上玩得这么夸张，就喧宾夺主，把关系拉远了。角色的交往呢？这恰恰是对背后心理动机的一种包装、掩饰。比如，你有求于某个人，当然就使劲地讨好他。


    你这位同学当然不是在和客户进行交往，而是和同学、老师、朋友交往。这样玩说明什么？


    说明他一直没有学会让真实的自己去和别人打交道！他或者害怕得罪人，

