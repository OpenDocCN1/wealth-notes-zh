    合我的期望，当然啦，我也会以赞扬、信任，甚至帮助回报你的”这一权利义务关系在心理上固定下来，变成合同条款，一旦 B 违反了，A 就有理由豁免自己的责任（本来就是他想要别人怎么样的），而是
    B 的错。他在进行心理保护时，无论是对 B 埋怨、攻击，还是疏远，都占据了道德优势、心理优势。


    你的那个所谓朋友，其实就和你单方面签订了一个心理契约，希望你的表现符合她的期待。但你显然不符合，于是，她表示失望了。


    心理契约是 A 在心理上单方面地希望、期待、要求 B 如何，在有些情况下，这是无可厚非的，因为 B 确实应该做到 A 所希望、期待、要求的。比如，父母虽然没有给我们说，但确实希望我们抽空回去看他们，如果我们不回去，他们会很失落。这种心理契约并没有什么错，因为履行契约是我们的道德义务。


    但是，像你这类情况，你对那个所谓的朋友没有什么道德义务要符合她的期待。


    我们为什么要去迎合别人？除非他对我们在心理上和经济上都很重要。


    我建议你这根本无须再理她。因为，她并不尊重你，她在心理上预设了，你只是满足她的价值观、利益立场、趣味、心理需求等的工具。在她的心里，只有你是否让她“失望”的概念，没有你的位置。


    我想说，如果一个人真正尊重你，拿你当朋友看，关心你或可以帮助你，那么，即使你让他失望，他也不会马上就直接对你说！


    我们要做的，只是在这类人开始失望的时候，马上就意识到这一点，并进行补救，避免他对我们绝望。


    # 27. 即使是一个真实的演员所说的话，也是当不得真的


    问：我是女的，20 岁。我发现很多人说的话都是不算数的，即使是在他好像很真诚的时候也一样！


    答：嗯。但可能有几种情况，一种是随便说说，应付应付，一种是故意欺骗。这两种情况，一个人都明白他在做什么。但还有另一种情况，他不一定明白。'
