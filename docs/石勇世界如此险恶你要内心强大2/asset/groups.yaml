    ## 5. 有些人的努力，是为了告诉世界：贬低他、无视他的存在将是一个错误


    就是说，打假，在方舟子那儿是对自己存在的一种价值论证方式。他怎么可能收得了手？


    而在打假时，想象着自己站在了科学、真理的一边，如有神助，他怎么可能不心理强大？


    不仅仅如此。我们再来看一下他的智力结构和心理结构。


    方舟子最为人所熟知，也是心理强大的一个特征，就是把外界的信息，拦截在智力结构里进行解读，不让它们刺激到心理结构，引发出情绪，因此也几乎没有暴露出内心的信息。就是说，你很难让他沦为一个心理动物。


    他之所以能够做到这一点，是因为用逻辑能力对自己的头脑进行了武装。


    我想遗憾地说出这一点：一个人如果习惯于运用文青的语言和思维方式，那么，碰到方舟子这种人，他会极不适应，因为“文青”式语言和思维，最大的特点就是不讲究逻辑推理，语言中携带着太多的情绪、情感、价值偏好、道德指责等，它们在逻辑面前，因为有很强的心理能量和进攻性，看起来很有优势，但其实是纸老虎，根本就伤不了对方的智力结构和心理结构。


    因为非常简单，你这是在用心理结构陪别人的智力结构玩，如果对方心理强大，你就等着被屠杀吧。


    “文青”式语言和思维，在本质上是對自己内心焦虑、动机、欲望等的一种暴露，而且在进攻时，只是以气势压人，完全不知道如何防御，自己把漏洞露出来了还不知道。对方只要用智力结构冷静地抓住你的漏洞，一招就可击溃你，甚至，如果他很邪恶，还可以操纵你的心理，把你逼疯。


    所以，一个“文青”如果不幸地碰到了—个难缠的“理工男”，该怎么办？两个办法：用逻辑陪他玩或者不和他玩。一颗逻辑的头脑最害怕的是什么？是他的推理，没有得到信息的反馈、验证，而这样，这种推理也就是一个假设！


    一个叫蒋方舟的女作家，不知道是自己聪明，还是背后有高人指点，看来是懂得这一点的。


    我想说，因为方舟子属于自卑型性格中的理想者、理念者，所以，你攻击他本人完全没有什么用，在心理上他已不再是他本人，而是科学、真理的一部分，因此他根本不可能沦为心理动物，任由心理保护发作。


    但是，他也不是没有软肋，他的软肋就是老婆和女儿。她们构成了他的自我，而这个自我则是属于他本人的，和科学、真理没有任何关系，因此也是弱小的。所以，当别人攻击到他的老婆和女儿时，他的智力结构相对之下就沦陷了。


    这么干该在道德上进行怎样的评价？我相信每个人都会有自己的判断。


    我已经多次说过，自卑型性格的人，不等于心理倾向，以及情感、情绪上自卑的那些人。后者容易沦为心理动物，只要有人鄙视他，马上就会启动心理保护，但前者则不一定。


    方舟子也许只能说明他自己。但有一个人会证明，自卑型性格的人，可能也是非常牛的，而且可以从一个“屌丝”成长为高帅富。他就是“苹果教父”、著名的国际资产阶级战士乔布斯。


    - 人物：史蒂夫·乔布斯

    - 职业：发明家、企业家

    - 事迹：发明 iPad、iPhone

    - 心理动物指数：★★

    - 心理保护指数：★★

    - 心理强大指数：★★★★

    - 特征：把性格的心理保护把持住，变成一种改变自己和世界的强大驱动力


    我真想说，乔老板是自卑型性格的人学习的好榜样。


    如果一个人的自卑被刺激出来，他要改变自己，克服自卑，那么，他对世界会有以下三种反应模式。


    - a. 一个“屌丝”被女神鄙视；然后，他拼命赚钱，最后，开着一辆豪车，准备到女神面前炫耀一下。


    不用说，这种对世界反应的模式最低档。他改变的只是自己的某一方面，只是想要在社会价值排序上往上攀爬，而且，含有报复心态。


    - b. 一个人从小被人鄙视，于是，发奋苦读，或拼命赚钱，多年后，终于成为成功人士。


    这种对世界反应的模式为大多数人所采用。他改变自己，并不仅仅是做给某一个或一群人看，同时也是在做给自己看。但是，这种模式只意味着一个人是要修改自己和“社会”的关系，没有涉及他的存在和世界的关系。


    - c. 一个人从小因各种原因对世界有自卑感、无力感，于是，追求对世界的改变。


    这就是有大出息的自卑型性格的人的玩法。他对自卑感、无力感的克服，用经典精神分析的话说，已经进行“升华”了，不再纠缠于当初那些刺激过他、伤害过他的情境。他把自己放到了存在的高度，追求对自我的超越、对世界的改变。只要他做到了这一点，那么，在这个世界面前，他的存在及其价值、力量就得到凸显，因为他不再是一个在世界面前无力的人，而是可以引领世界、把控世界的人。


    乔布斯就是这样。


    看一下他的经历：


    - a. 出生即被母亲抛弃；

    - b. 性格孤僻，没有朋友，常被别人看作是“怪物”；

    - c. 同学聚会的时候，他也总是一个人坐在角落里沉默不语；

    - d. 他不仅头发和两肩齐平，而且经常赤脚，穿邋遢、破旧的衣服，借以从外表来显示自己与其他所有人的不同；

    - e. 打地铺住在其他同学的宿舍，靠捡5美分的可乐瓶维持生活；

    - f. 每周日步行穿过整个城市到寺庙吃施舍的食物，这时他才能饱餐一顿。


    看到没有？从童年开始，布斯兄就是一个被这个世界抛弃、贬低的角色。这种存在不被关注、重视的感受，让一个人体验到深深的自卑和无力感，他的自卑型性格从被抛弃的那一天就形成了。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_72_0.png)


    基于心理保护，他玩了很多恶作剧，以及破罐子破摔，凸显个性。那个阶段，他性格所产生的心理保护，随时都在发作，根本就抱持不住，更谈不上升华，几乎就是一种心理动物。


    但后来，他大彻大悟，把持住了心理保护在心理结构中的发作，把它变成了一种改变自己、改变世界的最强大的驱动力。


    乔布斯为什么一直那么牛、站在世界潮流的前方呢？秘密在这里：


    过去那个让他自卑、无力 的情境，已经深入心理结构，跟着他进入了 “现在”。所以，如果他不用 “认命” 来保护自己，他就必须改变自己，改变 “现在”，从而在这个世界中凸显出来，感觉能够把控这个世界。哪怕他取得了一点成功，也不能停下来，因为他一停，“现在”
    又让他自卑、无力了。所以，一个自卑型 的成功者，从来就是一个和 “现在” 过不去的人。


    乔帮主曾经说过一句话，泄露了天机。他说：“我的一切努力都只为让母亲明白将我抛弃是个错误。”


    我想说，这句话不全对。母亲只是 “世界” 的一个代表。在心理上，他所做的一切，还为了告诉这个世界：贬低他、无视他的存在将是一个错误！


    ## 6. 真正有智慧的人拥有无知者缺乏的镇定


    一个人的存在如果达到了哲学的高度，那么，他就很难沦为一个心理动物，其心理的强大，足以让人震撼。在这方面，苏格拉底代表了最高的境界。


    - 人物：苏格拉底

    - 职业：哲学家

    - 事迹：和人探讨 “正义”，遇到挑衅，最后成功地让别人承认无知

    - 心理动物指数：★

    - 心理保护指数：★

    - 心理强大指数：★★★★

    - 特征：用理性武装了自己的存在


    我在《世界如此险恶，你要内心强大》中已经提示：在这个世界上，理性之所以具有不可战胜的力量，是因为它对人构成了一种真正的说服。


    苏格拉底的心理强大正是由此而来。


    在这里我想继续揭示，当一个人的理性能力很牛的时候，你要想让他变成一个心理动物，刺激出他的心理保护，几乎是妄想。


    苏老师的一生，是在大街上与人辩论的一生，是把哲学拉到人间的一生，也是教会人们如何辨析什么是幸福、什么是美德的一生。


    在这个过程中，当然得罪到了一些人，也有一些人不爽他。我印象最深的一个场景，是他和一个叫色拉叙马霍斯的人的辩论。


    我们情境再现一下。


    苏老师正和别人讨论“什么是正义”，别人说了几次正义是什么，都被苏老师一一揭穿这不是正义。色拉叙马霍斯站在一边，早就对苏老师不满，而且似乎也发现了苏老师的命门，几次三番地想插嘴，狠狠地教育一下我们的苏老师，但都被旁边的人给拦下了。直到苏格拉底稍一停顿，他便再也忍不住了，一个箭步冲上来大声吼道：


    > 苏格拉底，如果你真是想晓得什么是正义，就不该光是提问题，再以驳倒人家的回答来逞能。你才精哩！你知道提问题总比回答容易。你应该自己来回答，你认为什么是正义。别胡扯什么正义是一种责任、一种权宜之计，或者利益好、报酬利润之类的话。你得直截了当地说，你到底指的是什么。那些啰嗦废话我一概不想听！


    色拉叙马霍斯这个人比较有意思，实际上也不是一个容易对付的人，如果生在现在，他一定是著名公知，微博上的大V。在这里，我要先对他进行一点简单的语言—心理分析（具体的语言—心理分析在本书第三部分）。从他的语言特征上看，他是一个急性子（想知道急性子是什么心理的，可以先跳到后面第八章去看）；而从性格上看，属于占有型+攻击型的人。这样的人，有点聪明，有点自我中心主义，而且是一个现实主义者。


    他是什么人，想干什么，苏格拉底当然一眼就可以看出。但是，苏老师要装作被他吓住了，以便诱敌深入。果然，这位色兄狼狠地出招了。下面，我摘取性地抄录一下苏老师的弟子柏拉图的《理想国》，把他们的争论展示一下。


    色：要是关于正义，我给你来一个与众不同而又更加高明的答复，你说你该怎么受罚吧！


    苏：除了接受无知之罚外还能有什么别的吗？而受无知之罚显然就是我向有智慧的人学习。


    色：你这个人很天真，你是该学习学习。不过钱还是得照罚。


    苏：如果有钱的话当然照罚。


    色：那么，听着！我说正义不是别的，就是强者的利益。——你干吗不拍手叫好？当然你是不愿意的！


    苏：我先得明白你的意思，才能表态。可这会儿我还闹不明白。你说对强者有利就是正义。色拉叙马霍斯啊！你这到底说的是什么意思？总不是这个意思吧：因为潘吕达马斯是运动员，比我们大伙儿都强，顿顿吃牛肉对他的身体有好处，所以正义；而我们这些身体弱的人吃牛肉虽然也有好处，但是就不正义？


    色：你真坏！苏格拉底，你成心把水搅浑，使这个辩论受到最大的损害。


    苏：绝没有这意思。我的先生，我不过请你把你的意思交代清楚些罢了。


    好，由于他们的争论太长了，我无法一一抄录，而且，也没有必要再抄了，因为两人在博弈时，各自的智力结构、心理结构的状态已经一清二楚，输赢也已经确定。一个高手在走一步时，就已经预见到了后面对手的几步，甚至十几步，而对手则一无所知，直到被击败时，才看到这一点，但已经晚了。


    苏格拉底所用的，其实就是两招。


    一招是装傻、装无知，用哲学的术语讲就是比较谦虚的“反讽”。这一招是专门用来对付自我感觉良好的人的。当对方似乎真理在握，一心想证明他是白痴时，他承认自己不懂，然后，请对方再说明得明白一些，这样，对方的攻击就落空，并且被他拖着去回答一个个问题，主动权由此转到他手里。这就像一个好勇斗狠的混混儿，在一个太极拳手面前进攻一样，后者可以轻松接过前者的攻击，顺势一推，就可把对方摔倒。


    注意，当苏老师玩反讽的时候，是假定除了和他争论的人，还有旁边的听众的，事实上，他装无知，是诱导对手暴露，但旁边的听众，都知道他是装的，而且那个对手暴露了。


    还有一招，就是澄清。在后面讲心理分析的方法时我会讲到。在这里提示一下就是：因为对手虽然提出了某个观点，但这个观点是什么意思，以及是否有理由支持都不清楚，很可能就是“我认为如何如何”而已。这个方法一用上，争论的过程就变成了澄清观点是否成立的过程，而结果当然是，对手发现，其实自己对自己的观点，只是想当然地认为，根本就没有搞懂。


    其实，苏格拉底所用的这两招，因为经常使用，色拉叙马霍斯肯定是太熟悉了，而且，在苏老师和别人讨论时，他已经在边观摩了一段时间，应该懂得如何对付苏格拉底。然而，他太急躁、狂妄了，被教育苏格拉底这么一个可恶的人的渴望所控制，因此变成了一个心理动物。


    到最后，色拉叙马霍斯是输得没有一点脾气。他的狂妄、牛气，在澄清的过程中，已经消失了。


    这场争论，在哲学史上非常有名。苏格拉底的表现堪称完美。美国的一个哲学大牛沃尔夫曾经对此评论：“苏格拉底的沉着与色拉叙马霍斯的急躁形成对比，这正是柏拉图要告诉后人的教训，因为他和苏格拉底都相信：真正有智慧的人拥有无知者缺乏的镇定。”


    用我们的话说，你是很难让一个真正有智慧的人沦为心理动物的，而无知者则必定经常这样。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_76_0.png)


    # Part II

    Principles

    世界如此险恶，你要内心强大


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_78_0.png)


    - 浅层：情绪，情感，语言，其他

    - 中层：心理特质，情感，其他

    - 深层：性格，运作元意识，其他


    我曾经看到有心灵上受过伤的女生这样问：为什么男人看起来比女人要坚强一些呢？


    这个问题，让我产生了揭一揭男人老底的冲动。


    男人可不是什么特殊材料造成的。他看起来要坚强一些，那是因为他和女人有一个区别：他不是用内心去和世界接触，而是用头脑，用价值观念之类的东西去和世界接触的。就是说，他内心里有一层“保护皮”。如果受到打击，首先被打击到的就不是内心，而是这张“皮”。


    就是说，男人看起来坚强一些，不是因为他 是男人，而是因为他在头脑上、心理上和世界的联系，使他有更强的心理防御！


    如果不信，你打击的并不仅仅是他那张“皮”，而是直接击中到他的内心，看他还坚强不？想一想那些失恋的男人是什么样子！


    和男人相比，女人在很多时候以内心去感触世界。她一旦“投入”某种关系和情境中，往往是整个“身一心”的投入，一旦被打击，心理后果较为严重。因此，她比男人更追求一种“安全感”，抓住某种可以让自己获得心理保护的东西，哪怕它只是一种感觉。


    不幸的是，很多泡妞老手或高手，恰恰可以利用这一点！


    他们太清楚了：只要在女人面前营造出一种“安全感”（无非金钱、权力、负责、有力量之类），她们马上变成心理动物，给自己找到了一个“投入”进去的理由。因为，一旦有了“安全感”，不需要这帮臭男人动嘴，女人都会自我说服！


    柏拉图同学借苏格拉底老师的嘴，喊出了一句“世人都在梦中生活，唯有哲人挣扎着要觉醒过来”。我们也在心理动物的状态中生活，不同的是，如果我们看到了“我们为什么会成为这种样子”的原理，我们也可以醒过来。


    模仿一下海德格尔老师的经典句式：心理是我们的家，而世界，是心理的家。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_80_0.png)


    # 第五章

    我们栽在了哪些心理规律上


    陷入“心理动物”的状态，被心理保护像幽灵一样攥住，虽然对于某些人来说是一件挺伟大的事情（比如宗教极端分子、政治狂热分子，以及“脑残粉”），但残酷的后果是：我们失去了一系列本来就有的能力；或者，它让我不具备某些可以用来安身立命、追求幸福和成功的能力。


    关于这些能力可以列出一个很长的清单。在下面，我只列举出了其中五种常见，又对我们来说非常重要的能力，更确切地说，是失去这五种能力的表现。


    很多人平时就栽在失去了这些能力，或不具备这些能力上。


    我们失去或不具备的其他一些能力，当然也很重要。但我在本章就无法一一讲了，只是在后面会有所提及和剖析。


    ## 表现一：无法洞察自己正在犯下愚蠢的错误


    ### 1. 看到了恐惧，我们就应该跳出来，而不是任由它驱使


    一个人干了一件蠢事，并没有什么奥秘，其中的一个原因无非是：他当时根本不知道自己所说的话、所做的事情，在心理上真正是什么意思，也看不见它的后果。


    有一个做外贸生意的老板曾经给我打了一个电话，他和我有一面之交，请教我：该如何说服一个“自我中心主义”的人？


    他说，手下一个部门经理在报关时让他损失了十几万元，但一直把责任推到别人身上，推到客观原因上，表现得很自我。


    老板强调，这点损失倒没什么，但他很担心，部门经理的态度，以后会不会让他继续犯错？


    我马上明白了这个老板的意思：想让部门经理走人，但还需要一个理由来说服自己的心理（不是头脑），以便做出艰难的决定。而我，似乎可以给他一个理由。


    我拒绝就此发表评论，这也不是我关心的问题。我问老板，这个部门经理当初是怎么进公司的，他是不是有什么背景？老板回答我说，当初是一朋友推荐过来的，也挺有才能的，平时自我感觉挺良好，没听说有什么背景，女朋友也不是什么官二代、富二代，也是在职场上做一个办公室白领，而且，他们好像还没有买房。


    我全明白了：这位兄弟，真是犯傻了！


    既然把事情搞砸了，无论是不是他干的，作为负责人，起码要承担责任，向老板表达一下歉意、检讨。作为朋友推荐过来的人，并且还有点才能，老板当然会原谅他。


    但自我感觉良好和恐惧把他害了。


    他把“我有能力”太当一回事了，搞成一种很夸张的“自我”，似乎能力被怀疑、被否定，在心理上就要了他的命。因此，损失十几万元，他心里面似乎想象着别人一定在取笑自己，而老板找他说话，似乎也是对他的价值的致命一击。他忘记该做的是什么了，而只是盲目地在心理上保护自己，把责任推出去，自己的能力，在心理上似乎就没什么可怀疑的了。


    他根本就没有洞察到，当他推责任的时候，是为了安慰、保护那个靠“我有能力”填充起来的自我，看不到自己这样做，会传递给别人什么样的信息。


    真相还不止这一点。


    要看到，他玩“跟我没半毛钱关系”的Pose，并不是为了激怒老板，从而离开公司。事实上，他对于离开公司还有恐惧。但具有讽刺性的是，他用来治疗离开公司的恐惧的药方，恰恰让别人产生了把他扫地出门的想法！


    可以想象一下：损失十几万元，他立刻在心理上进行这样的推理：“啊？那么多？这个错误够大的，老板肯定很不爽，肯定要叫我走人，怎么办？我不能说是我的问题，不能！要不然老板就叫我走了。嗯，都是别人的问题，是客观原因！就这么说！”


    他看到了自己的恐惧，但陷进去了，也只看到自己的恐惧，因此没有看到，这样的言行对于别人来说意味着什么！


    我不由得想说一下。其实，在我们说什么、做什么时，同时就洞察到它是什么意思，应该是一种基本的洞察力。毕竟，它们不是无缘无故的。你都不明白自己在做什么，岂不很盲目？


    只是，心理保护管不了那么多，就像弗洛伊德老师所说的“本我”一样，它只追求自己的满足。在它启动的时候，我们的头脑和心理的功能，基本上已经报废了一部分，因此失去了对行为的观察和控制。


    ## 表现二：即使知道自己正在犯错也不阻止，或干脆一错再错


    ### 2. 一错再错，是为了做给别人看的


    部门经理在推卸责任的时候，并不明白自己是在做什么。但有的人，明明知道自己正在做什么，但并不阻止自己去干蠢事，甚至一错再错。这又如何解释？


    我的回答是：第一，他在内心深处，压根就想犯错，以便惩罚自己！


    请想象一下：假如有一个男人 A，深深地爱上了一个女人 B，但由于家庭的激烈反对，终于失恋了。那么，他有没有可能就此“堕落”，指天骂地，胡吃海喝，把工作以及人际关系都搞得一团糟？


    为什么？因为他痛恨自己的懦弱！让自己混得非常烂，就是在惩罚自己。


    这么玩，一个人还会在哪一天醒来，根本不用太担心，因为他只是在心理上保护自己一下，让自己好受一些。情绪冷却了，也就意识到荒谬了。


    但有的人，在心理保护的控制下，一玩就很难收手了，宁愿一错再错。这是为什么呢？


    其实也不复杂。这样的人在干了一件愚蠢的错事时，突然天才地想象、感觉到有无数目光在盯着他，嘲笑他。他一错再错就是为了回击这种目光！因为当他有意识地再犯一次错，在心理上，此前的错误就合理化了，而这次也已经不是犯错，而是为面子和尊严而战！


    如果你还不理解，让我们想象一下：为什么有的小孩不幸沾上一点坏习气时，家长管得越粗暴，他越叛逆，反而使劲去学坏？


    正确的解释是：这是一种有意识或无意识地败坏自己的方式对家长的

