    \n从中可以看出他是什么人呢？很清楚：一个比较自我的人，只要看上去有什么支持他的看法，他就会迫不及待地认为自己是对的。\n\n我想提请注意这一点：当我们认真地说想一件东西的时候，是有这样一个抱负的，即想把它说清楚、说深刻，因为这样才能在心理上把握它。\n\
    \n如果在我们用语言表达时，无法说清楚、说深刻这个东西，以至于它在我们眼中是混沌的、模糊的，那结果一定是：我们有焦虑，因为我们面对的，是一个陌生和不确定的东西！\n\
    \n为什么当一个人表达不清楚某件事情，他会很着急呢？合理的解释是：他被焦虑攥住了。\n\n好，我们可以做出以下的一系列判断了。\n\n2\n\n方法\n\n\
    | 如果一个人说话很幼稚、浅薄 | 请相信，他骨子里期待有人能够帮自己搞定很多事情，如果是女的，那就要明显 |\n| :--- | :--- |\n| 如果一个人说话含混不清\
    \ | 下这个结论吧！——他在心理上并不自信 |\n| 如果一个人说话没有逻辑，但言之凿凿 | 不要妄想去说服他了，因为这是一个对自己装已经非常成功的人 |\n\
    | 如果一个人说话非常有条理 | 不用犹豫，这是一个具有某种控制欲的人 |\n\n### 7. 当一个人对你说话时，要么有利益上的期待，要么有评价上的期待，要么有态度上的期待\n\
    \n你可能要问：一个人和对话者互动的方式到底能说明什么问题？\n\n我们先记住这一点：当 A 对 B 说话时，要么有利益上的期待，要么有评价上的期待，要么有态度上的期待。\n\
    \n另外，从情境的要求上看，A 和 B 不能是自言自语。\n\n也就是说，A、B 两位所说的每一句话，应该和别人的话具有逻辑关系，应该是别人的话逻辑地引发的，或和别人的话有某种交集。\n\
    \n如果不符合这两点呢？那就非常抱歉，它把一个人给暴露了。\n\n因为那些话不可能是从天上掉下来的，而只能是从一个人的心理结构里蹦出来，那么，它就说明了：一个人对别人在心理上是什么态度，他的心理背景如何。\n\
    \n想一想，如果你在晚饭散步，看到一个熟人，你问他“吃饭了吗”，他的回答是“散步啊”，你心里面一定有不被尊重的感觉。\n\n如果他不是一个神经病或智障，那一定说明，他在心理上根本不拿你当回事。因为他在心理上，根本不屑于“听”到你在对他说什么，自然谈不上和你的话有逻辑关系。\n\
    \n一个人和别人说话的方式，完全可以透露出这些信息：他对别人是应付、不屑于理睬、装作重视，还是真的重视？一个对语言敏感的人，马上可以判断出这一点。\n\n\
    还可以看出更多东西。\n\n比如，一个人如果在和别人说话时，无论是讨论某个问题，还是闲聊，只是一个劲地在那儿说，滔滔不绝，不理会别人所提出的问题，也不考虑别人的感受，那就很遗憾，他等于告诉别人：“我是一个被不如意甚至失败感折磨的人。你看，你的出现，让我终于找到了一个补偿自己、证明我懂得很多东西的机会，所以，我怎么可能错过呢？你就成全我吧！”\n\
    \n### 8. 一个人说话时的姿势很夸张，说明他非常在意别人的反应\n\n最后一个问题：一个人说话时，借助辅助表达手段达到什么程度也有心理上的玄机吗？\n\
    \n表面看起来是一个伪问题。因为，其一，我们人类，几乎没有说话时不玩一下表情、手势的；其二，西方人说话时，玩表情和手势都很夸张，但这好像更多的是与文化传统、社会习惯有关，而非与一个人的性格、人格、心理背景有关。\n\
    \n但假如我们仅仅在一个文化—社会共同体里来说事，就是只考察中国人，那么，还是有用的。\n\n一个人说话时，使劲地挥舞手势、表情夸张，意味着他不仅以语言、而且以全部身心投入，即自己暴露在了他人和世界面前。最典型的就是一个演讲者。\n\
    \n那么，如果真是这样，至少可以说明两个意思：一、城府不那麼深，在心理上，不会刻意阻止自己暴露在这个世界面前，因此比较投入；与之相反，城府较深的人，说话时只是用语言去和别人交流，不会慷慨激昂，不会玩弄过多夸张的手势、表情，在和他人、世界打交道时，基于心理保护，他不会让自己暴露，而是要隐藏自己，以在心理上随时控制局势。\n\
    \n第二个意思，是否借助夸张的手势、表情来表达，还反映出一个人是否具有这种焦虑：“我能够把一件事情说得准确、形象生动，让别人同意、佩服我吗？”如果玩得夸张，说明他在说话时，非常在意别人的反应。而之所以如此，是因为他在和别人说话时，没有利益上的期待，但有一个评价上的期待。与之相反，那些不这样玩的人，和你说话如果不是基于人际关系上的应付，往往有利益上的盘算!\n\
    \n### 9. 在这个世界上，有人总是想朝别人吐口水，但情况往往是，他吐出去的口水，弹回了自己的嘴巴上\n\n对语言和心理的关系有一些理论上的了解后，我们来考察一些现象。\n\
    \n我曾经在微博上看到一位知名人士这样评价微博:\n\n“有一位‘脖友’说过，微博140字很难说清楚事儿。微博是一个适合发布谣言，不适合辟谣的地方；是一个适合插科打浑，不适合理性分析的地方；是一个适合发表结论，不适合展示论证的地方；是一个适合发表感悟，不适合展示思辨的地方；是一个适合冲动骂战，不适合深入探讨的地方。现在这种感觉很越发强烈。”\n\
    \n这段微博发表之后，下面立马有一位网民提出“建议”：\n\n“那您可以撤退了。”\n\n啧啧，多么有礼貌的义正词严啊，这是在捍卫微博的伟大意义有没有？但实在不好意思，这样的人，在现实生活中不过是一块被人忽悠的材料。\n\
    \n搞清楚了吧，当那位知名人士说微博有这样那样的缺陷时，并不是说他就不想玩了。因为，逻辑上有几条道路可以选择，比如发发牢骚但忍受它、尽力改善它、离开它。怎么就只从别人的牢骚中，咬住“离开它”的可能性，叫别人撤退呢?\n\
    \n如果这位网民可以这样玩，那么，他根本就不能对和自己有关的东西有任何批评——比如，他绝对不能说这个社会一句坏话，如果说了，那就滚吧，滚得越远越好。\n\n\
    在这个世界上，有人总是想朝别人吐口水，但情况往往是，他吐出去的口水，弹回了自己的嘴巴上。\n\n事实是，“那您可以撤退了”这句话看起来是要打击别人的话，只不过是这位网民对自己是个什么样的人，具有什么心理的一种主动招供。我把他的供词照录如下：\n\
    \n“我是一个自以为有正义感、自我感觉良好的人。我和很多人一样，在这个社会中有被迫害感。然而我实际上是一个心理动物，缺乏理解他人的意愿和能力。骨子里，我有攻击别人的欲望。”\n\
    \n“所以真相是，我的所谓正义感，只是在攻击别人时能占据道德制高点的一个借口；我的自我感觉良好，也只是为了在攻击别人时预先在心理上保护自己，确认自己站在真理一边。”\n\
    \n“我这种人实际上一直在找机会攻击别人。很多不正义事情的出现，比如哪儿的城管又打人了，对于我来说，其意义只是为了满足我的攻击欲望，能让我有机会骂一下。摊贩也只是我能够骂人的道具，从骨子里，我才不管他们到底是什么命运呢。你信不信我如果是城管，下手会更狠？”\n\
    \n“因为我只是想发泄，以心理欲望来回应这个世界，所以我才不管一个人说的话是什么意思，只要这个话看上去有把柄就可以。那么，你说，当大家玩微博玩得很兴奋，而那位名人偏要说微博的坏话，我还等什么呢？当然啦，我不会让自己体验到自己就是一个骂人的网络混混，对自己装了一下，包装了一下语言，而不是直接问候他的家人。”\n\
    \n### 10. 我们无法想象的一件事情是，一个人会违反他不能违反的心理规律\n\n下面，进入实际的技术分析了。\n\n来看一个真实的故事。\n\n事件的第一个过程是这样的：在一个社区的便民服务大厅里，发生了一个爆炸案。这个爆炸事件的结果是死了几个人，伤了十几个。然后，官方就说，其中已经死了的一个人Z是嫌疑人，他性情孤僻，言行极端，悲观厌世——就是说，他在便民服务大厅里玩“自杀性袭击”，其心理动机是为了“报复社会”。\n\
    \n当时我就笑了。\n\n我用心理分析、性格分析证明，或者这个爆炸案不是Z干的，或者是他干的，但他的动机绝对不是“报复社会”，因为实在无法想象一个人会违反他的心理规律。\n\
    \n“报复社会”的人，性格基本上属于我在《世界如此险恶，你要内心强大》里所说的“自卑型性格”，自卑、自尊心强、猥琐、心理阴暗、屈服于社会价值排序、懦弱。郑民生、艾绪强就是这类人。\n\
    \n但杨佳同学、马加爵同学就不是，他们报复的，是特定的抽象人群或和自己有某种心理关系的人，这个不叫报复社会。\n\n郑民生类的失败者遭受过N多人的鄙视、打击，只要境况没有改变，在心理上会仇视整个社会，一旦有某一件事情刺激，就会化为行动。而无论他们“报复”到了谁，哪怕是三岁小孩，在心理上，都是报复到了“社会”，因为在他们心理上，三岁小孩也是鄙视、欺侮他们的“社会”的一部分。\n\
    \n一个恐怖分子在玩自杀性袭击时，他想象着有真主在看他。同样，一个报复社会的人，也想象自己和他人眼看他。但是，不同的是，他报复社会时，追求的是发泄耻辱感和报复的快感，对于这个社会，他获得了巨大的心理优势，因为他不再是被人鄙视、欺侮的失败者，而是一个可以伤害社会，并且在心理上相对于社会获得了心理优势的人。他在报复时，心理上实际上希望有无数目光看他，并蔑视这无数目光。\n\
    \n所以，我们有第一个判断：当一个人要“报复社会”时，他选择的行凶地点，一般是在室外；所选择的对象，也是容易下手的。\n\n如果选择的是室内，就构成了一种在封闭空间里作案的情境，他看上去就不是在报复社会而是在作案了。但他心理上不可能让自己体验到是在作案，而是在报复社会。同时，这样做，他也体验不到力量感，无法获得蔑视想象中无数看他的目光的心理效果。\n\
    \n而如果选择的对象不是容易下手的，他将无法克服自己的懦弱，也无法获取心理优势。\n\n第二个判断：一个想要报复社会的失败者，无论他一开始想不想死，在心理上，是不可能选择和他报复的对象在某一瞬间同归于尽的。\n\
    \n原因就在于：报复社会是他发泄耻辱感的手段，并且是他获取可以蔑视……\n\n### 11. 很多狠话，它的功能，可能只是一个人的“语言疗法”\n\n事情还没有完，很快有了第二个过程，为回应人民群众的质疑，官方公布了\
    \ Z “报复社会”的证据：QQ 聊天记录，以及日记等有关证据和材料等。\n\n这个，终于可以让我们的语言心理分析派上用场了。当时我一看，就绝对肯定，这些证据根本就不成立！\n\
    \n抄一下这些证据。\n\n- 证据 1: QQ 聊天记录\n  - a. “社会之残酷越来越让我要暴乱了。我不知道在我实在混不开的时候会有多少人死于我的手下。”\n\
    \  - b. “我啊，本来是好心人，可是，社会教我不要做好心人，如果有一天我觉得什么都没意义时，那些人又会好过吗？”\n- 证据 2: QQ 空间\n \
    \ - a. “从九岁到现在，老子和那些杂种打了几百次架……老子现在什么都没有了。只有健康的体魄，难道这些杂种只知道社会有钱什么都能办，难道你不知道我不好过，你的后果会怎样吗？”\n\
    \  - b. “我坚信，要在沉默中爆发，这世界缺少某些人照样要转……难道只有自己有难题，别人都是一帆风顺吗？社会啊社会，为什么安排那么多天才啊。”\n\n\
    这些话都很暴力是不是？我不纠缠于其他细节，而且，只挑 Z 所说的话中最狠的，即最能证明官方所说的 Z 是“报复社会”的那些话，看是不是真的如此。\n\nQQ\
    \ 聊天记录里最狠的话是：\n\n“社会之残酷越来越让我要暴乱了。我不知道在我实在混不开的时候会有多少人死于我的手下。”\n\n看到没有？确实看上去对社会充满杀气。\n\
    \n但它是聊天记录里的，这意味着，Z是在和他人QQ对话时说这句话的。那么，既是对话，显然除了这句话，Z还有其他的话。从语言分析上来说，这句话是嵌在他和另一个人对话的语言链里的，其含义受制于具体的语境，不能把它从语境中抽象出来单独理解。\n\
    \n好，我们也可以不管这一点，就只看这句话。\n\n从对话的角度上说，当Z在QQ里对另一个人这样是说时，显然预设了这个人值得信赖。从这句话本身的表达、含义来说，可以排除他是一个陌生人所说。因为对一个陌生人说，两人没有心理上的联系，在心理上毫无意义，无法获得这种心理效果，那就是表明自己有种，或想得到倾听、安慰。\n\
    \n而从语言和心理的关系来说，我想请大家注意，当一个人说要“报复社会”，放出狠话要干一件惊天大案，要让多少人死于他的手下时，他的“倾听对象”，绝对不是他的亲人、朋友等值得信赖的人，而是他骨子里认为平时就打击过他，或想嘲笑、鄙视他的人。无论他最终是否“报复社会”，这句话本身，就具有了报复的心理效果，因为它让一个人在心理上瞬间对社会处于进攻姿态和威胁的角色，具有了心理优势，发泄了耻辱。\n\
    \n而如果他是亲对亲人、朋友说的，我们可以绝对断定，他虽然有报复社会的冲动，但骨子里，其实是想找一个理由，阻止自己去这样干。\n\n真相是：他所说的这句话的心理意义，并非是向别人表明自己具有报复社会的想法和决心（因为他在亲人、朋友面前说这些话，如果是要玩真的，他在心理上就会体验到自己不是一个好人，不负责任，会有道德压力），而是把以往所遭受的耻辱、挫败，尽情发泄，向别人倾诉，以得到别人的安慰和劝解。这样一来，他可以说出任何狠话，因为他体验到自己并不真的去做，所以说出来不会有道德压力。\n\
    \n在这类情境中，任何一个在生活中受到鸟气、遭到挫败的人都可能说出狠话，而且越狠越爽，但他并不会去干。这就是很多人在生活中都说过很多狠话，但也没见他变成一个暴徒的原因。\n\
    \n也就是说，Z 所说的这句狠话，其实只是一种对自己的挫败的“语言疗法”！\n\n我们接着看 QQ 空间里的日志，我同样也是挑 Z 说得最狠的。\n\n>\
    \ “从九岁到现在，老子和那些杂种打了几百次架……老子现在什么都没有了。只有健康的体魄，难道这些杂种只知道社会有钱什么都能办，难道你不知道我不好过，你的后果会怎样吗？”\n\
    \n这段话看起来，同样杀气腾腾。\n\n但很遗憾，这段话同样是从一个语境里抽出来的，并不完整。\n\n完整的段落是：\n\n> “大家看日记别说我无礼，我所骂的都是那些流氓。我操他妈，老子也走过二十几年，不是老子没有奋斗。回忆起来，老子一直被那些流氓欺负，从九岁到现在，老子和那些杂种打了几百次架，老子韧性很强，可是这些流氓为了不让我超过他，竟然用这卑鄙的手段来欺负我、打我，老子现在什么都没有了，只有健康的体魄。难道这些杂种只知道社会有钱什么都能办，难道你不知道我不好过，你的后果会怎样吗？我告诉流氓们，不要嫉妒别人，人急是不顾后果的。”\n\
    \n看到没有？Z 在一开始，就说请大家看日记别说他无礼，这是什么意思？\n\n从语言和心理的关系来说，他来这一句开场白，暴露的就是：在以前，他一直把自己体验为是一个好人，而且在说这段话时，仍然把自己体验为一个善良、老实、有素质的人，害怕别人认为他是一个素质低下、充满暴力思想的人。他在骨子里就瞧不起这种人，在心理上，也要阻止自己这么做。\n\
    \n他说那些欺负他的人是“流氓”，从语言上也反面印证了这种心理。\n\n这意味着，在心理上，虽然存在着会让“流氓”死于他手下的可能，但已经绝对排除了他会让无辜者也“死于手下”的可能。\n\
    \n同样，从语言和心理上，这些话也只是具有“疗伤”的功能，他并不是在表明自己要让多少人“死于手下”的决心！\n\n事后证明，Z根本就不是什么玩“自杀性袭击”，要“报复社会”的嫌疑人，他不过是在不知情中，一个被人利用的“肉弹”而已。\n\
    \n我想说，很多事情的真相，并不一定要事后我们才能知道，语言—心理分析等技术分析，从一开始就可以帮助我们准确地做出判断。\n\n### 12. 有很多人，他们对自己心理问题的治疗方式，就是扮演某个角色\n\
    \n在语言—心理分析上，我们继续往前走。\n\n我们需要训练的一种能力是：在某个具体的情境中，从一个人的几句话，就可以判断出他大致是什么人。\n\n下面这个故事，我们的语言—心理分析可能很琐碎，但我想说：牛的洞察，是用琐碎炼成的！\n\
    \n某日，北京交响乐团俄罗斯籍前大提琴首席奥列格·维捷尔尼科夫坐在沈阳开往北京的动车上。似乎他觉得没有教养是一件非常有性格的事情，将双脚跪在了前排一位中国女人的后座背上。\n\
    \n他很快被抗议。中国女乘客让其将双脚放下，不料这位维捷尔尼科夫好像认为欺负一个女人也挺光荣，一种施虐的快感油然而生，口中念念有词：“真爽，真舒服。”\n\n\
    中国女人被激怒了，她拿起座位上的杂志向维捷尔尼科夫双脚抽过去。维捷尔尼科夫一边躲，一边用标准的普通话爆粗口，并大笑：“她非常有毛病。”\n\n后来，一男乘客赶来询问。维捷尔尼科夫才将双脚从座椅顶端移开，表情无辜地称不知道发生了什么。乘客问其是否骂人，他表示听不懂，语言沟通有障碍。乘客劝女乘客克制情绪，并称“人家是艺术家，搞艺术的”。\n\
    \n很不幸，事件的整个过程被人拍了视频，并放到网上。结果是，维捷尔尼科夫先是通过视频道歉，但说的是俄语，被指无诚意，后被北京交响乐团开除。\n\n而在维捷尔尼科夫道歉但还没有被开除的那段时间里，他道歉的文字，\n"
  mdcn: "\n## 世界如此险恶，你要内心强大 2\n\n慢慢说话，乃是在心理上，对世界的一种从容应对！\n\n如果你还不明白，那么，请想一下：为什么我们的一些领导同志说话都很慢，而且是官越大，越是这样！\n\
    \n我当然不是暗示，你以后和人说话要向官员同志们学习，要说得很慢。你得衡量自己的身份，在什么样的场合，别人对你有无期待，再来决定选择何种话语方式。就是说，我虽然不提倡，但也不鄙视你把用什么方式说话理解成一种装事业。\n\
    \n领导说话慢，可以形成控制局势的气场。因为在慢慢表达时，由于他是那场戏的主角，看他表演的观众，无论是官场中的演员，还是群众演员，那一时间注意力都会集中到他身上——然而，他又不痛快地一句话说完，这就导致观众有一种头脑上的悬空感和希望他赶快说完的焦灼感。\n\
    \n这样一来，那就非常方便领导在说话的同时，把注意力也集中到观众身上，在心理上监视、威慑、控制他们了。这就是领导说话的艺术！\n\n但我们要搞清楚，领导说话慢之所以能够达到这个效果，是因为在权力的压力和利害关系下，演员们在心理上已经预设了对他说话要有期待，不能不耐烦。\n\
    \n但如果你在求职、面试、和领导说话等场合也这样玩，那结果只有一个，就是找死。因为除非一个人是受虐狂，否则没人会说服自己，要有让你折磨的耐性，要让你占心理优势！\n\
    \n### 6. 一个比较自我的人，总会迫不及待地认为自己是对的\n\n我们继续看一个人对一件事情进行描述、分析、洞察的程度，是如何和他的心理、他是什么人扯上关系的。\n\
    \n有人这样问我：\n\n“为什么生活在同样的环境，受同样的教育，有同样的父母，教出来的两兄弟性格不一样？性格是不是跟天生有关系？”\n\n这段话有问题吗？我估计你会回答：没有。这个人的困惑，应该也是很多人的困惑。\n\
    \n然而真有问题，而且问题很大：这个问题是不成立的！\n\n为什么？因为它出现了一个逻辑的断裂。\n\n看到没有？从“为什么生活在同样的环境，受同样的教育，有同样的父母，教出来的两兄弟性格不一样？”到“性格是不是跟天生有关系？”还有很长的路要走，但他非常快就得出结论了。就相当于，他要从这里到那里，中间有一座逻辑断裂的峡谷，并没有吊桥什么的，但他违反人类的生理规律，搞得自己像是神仙一样，一步跨过。\n\
    \n他的推理是这样的：如果说性格是后天的，那么，生活在同样的环境，受同样的教育，有同样父母的两兄弟，性格应该是一样的，但事实是，他们不一样。所以，性格应该有先天因素。\n\
    \n这个推理是不成立的，因为，两兄弟生活在同样的环境，受同样的教育，有同样的父母，这些“同样”，从概念上说，最多只能说是“大致相同”，而不是在逻辑上等值的“同样”，比如，在他们所生活的那个环境里，两兄弟不可能一天24小时接触到的都是同样的人，说同样的话，做同样的事，对某件事做出同样的反应，而只要差异有和不同，就可能会影响到他们形成不同的性格。\n\
    \n从中可以看出他是什么人呢？很清楚：一个比较自我的人，只要看上去有什么支持他的看法，他就会迫不及待地认为自己是对的。\n\n我想提请注意这一点：当我们认真地说想一件东西的时候，是有这样一个抱负的，即想把它说清楚、说深刻，因为这样才能在心理上把握它。\n\
    \n如果在我们用语言表达时，无法说清楚、说深刻这个东西，以至于它在我们眼中是混沌的、模糊的，那结果一定是：我们有焦虑，因为我们面对的，是一个陌生和不确定的东西！\n\
    \n为什么当一个人表达不清楚某件事情，他会很着急呢？合理的解释是：他被焦虑攥住了。\n\n好，我们可以做出以下的一系列判断了。\n\n2\n\n方法\n\n\
    | 如果一个人说话很幼稚、浅薄 | 请相信，他骨子里期待有人能够帮自己搞定很多事情，如果是女的，那就要明显 |\n| :--- | :--- |\n| 如果一个人说话含混不清\
    \ | 下这个结论吧！——他在心理上并不自信 |\n| 如果一个人说话没有逻辑，但言之凿凿 | 不要妄想去说服他了，因为这是一个对自己装已经非常成功的人 |\n\
    | 如果一个人说话非常有条理 | 不用犹豫，这是一个具有某种控制欲的人 |\n\n### 7. 当一个人对你说话时，要么有利益上的期待，要么有评价上的期待，要么有态度上的期待\n\
    \n你可能要问：一个人和对话者互动的方式到底能说明什么问题？\n\n我们先记住这一点：当 A 对 B 说话时，要么有利益上的期待，要么有评价上的期待，要么有态度上的期待。\n\
    \n另外，从情境的要求上看，A 和 B 不能是自言自语。\n\n也就是说，A、B 两位所说的每一句话，应该和别人的话具有逻辑关系，应该是别人的话逻辑地引发的，或和别人的话有某种交集。\n\
    \n如果不符合这两点呢？那就非常抱歉，它把一个人给暴露了。\n\n因为那些话不可能是从天上掉下来的，而只能是从一个人的心理结构里蹦出来，那么，它就说明了：一个人对别人在心理上是什么态度，他的心理背景如何。\n\
    \n想一想，如果你在晚饭散步，看到一个熟人，你问他“吃饭了吗”，他的回答是“散步啊”，你心里面一定有不被尊重的感觉。\n\n如果他不是一个神经病或智障，那一定说明，他在心理上根本不拿你当回事。因为他在心理上，根本不屑于“听”到你在对他说什么，自然谈不上和你的话有逻辑关系。\n\
    \n一个人和别人说话的方式，完全可以透露出这些信息：他对别人是应付、不屑于理睬、装作重视，还是真的重视？一个对语言敏感的人，马上可以判断出这一点。\n\n\
    还可以看出更多东西。\n\n比如，一个人如果在和别人说话时，无论是讨论某个问题，还是闲聊，只是一个劲地在那儿说，滔滔不绝，不理会别人所提出的问题，也不考虑别人的感受，那就很遗憾，他等于告诉别人：“我是一个被不如意甚至失败感折磨的人。你看，你的出现，让我终于找到了一个补偿自己、证明我懂得很多东西的机会，所以，我怎么可能错过呢？你就成全我吧！”\n\
    \n### 8. 一个人说话时的姿势很夸张，说明他非常在意别人的反应\n\n最后一个问题：一个人说话时，借助辅助表达手段达到什么程度也有心理上的玄机吗？\n\
    \n表面看起来是一个伪问题。因为，其一，我们人类，几乎没有说话时不玩一下表情、手势的；其二，西方人说话时，玩表情和手势都很夸张，但这好像更多的是与文化传统、社会习惯有关，而非与一个人的性格、人格、心理背景有关。\n\
    \n但假如我们仅仅在一个文化—社会共同体里来说事，就是只考察中国人，那么，还是有用的。\n\n一个人说话时，使劲地挥舞手势、表情夸张，意味着他不仅以语言、而且以全部身心投入，即自己暴露在了他人和世界面前。最典型的就是一个演讲者。\n\
    \n那么，如果真是这样，至少可以说明两个意思：一、城府不那麼深，在心理上，不会刻意阻止自己暴露在这个世界面前，因此比较投入；与之相反，城府较深的人，说话时只是用语言去和别人交流，不会慷慨激昂，不会玩弄过多夸张的手势、表情，在和他人、世界打交道时，基于心理保护，他不会让自己暴露，而是要隐藏自己，以在心理上随时控制局势。\n\
    \n第二个意思，是否借助夸张的手势、表情来表达，还反映出一个人是否具有这种焦虑：“我能够把一件事情说得准确、形象生动，让别人同意、佩服我吗？”如果玩得夸张，说明他在说话时，非常在意别人的反应。而之所以如此，是因为他在和别人说话时，没有利益上的期待，但有一个评价上的期待。与之相反，那些不这样玩的人，和你说话如果不是基于人际关系上的应付，往往有利益上的盘算!\n\
    \n### 9. 在这个世界上，有人总是想朝别人吐口水，但情况往往是，他吐出去的口水，弹回了自己的嘴巴上\n\n对语言和心理的关系有一些理论上的了解后，我们来考察一些现象。\n\
    \n我曾经在微博上看到一位知名人士这样评价微博:\n\n“有一位‘脖友’说过，微博140字很难说清楚事儿。微博是一个适合发布谣言，不适合辟谣的地方；是一个适合插科打浑，不适合理性分析的地方；是一个适合发表结论，不适合展示论证的地方；是一个适合发表感悟，不适合展示思辨的地方；是一个适合冲动骂战，不适合深入探讨的地方。现在这种感觉很越发强烈。”\n\
    \n这段微博发表之后，下面立马有一位网民提出“建议”：\n\n“那您可以撤退了。”\n\n啧啧，多么有礼貌的义正词严啊，这是在捍卫微博的伟大意义有没有？但实在不好意思，这样的人，在现实生活中不过是一块被人忽悠的材料。\n\
    \n搞清楚了吧，当那位知名人士说微博有这样那样的缺陷时，并不是说他就不想玩了。因为，逻辑上有几条道路可以选择，比如发发牢骚但忍受它、尽力改善它、离开它。怎么就只从别人的牢骚中，咬住“离开它”的可能性，叫别人撤退呢?\n\
    \n如果这位网民可以这样玩，那么，他根本就不能对和自己有关的东西有任何批评——比如，他绝对不能说这个社会一句坏话，如果说了，那就滚吧，滚得越远越好。\n\n\
    在这个世界上，有人总是想朝别人吐口水，但情况往往是，他吐出去的口水，弹回了自己的嘴巴上。\n\n事实是，“那您可以撤退了”这句话看起来是要打击别人的话，只不过是这位网民对自己是个什么样的人，具有什么心理的一种主动招供。我把他的供词照录如下：\n\
    \n“我是一个自以为有正义感、自我感觉良好的人。我和很多人一样，在这个社会中有被迫害感。然而我实际上是一个心理动物，缺乏理解他人的意愿和能力。骨子里，我有攻击别人的欲望。”\n\
    \n“所以真相是，我的所谓正义感，只是在攻击别人时能占据道德制高点的一个借口；我的自我感觉良好，也只是为了在攻击别人时预先在心理上保护自己，确认自己站在真理一边。”\n\
    \n“我这种人实际上一直在找机会攻击别人。很多不正义事情的出现，比如哪儿的城管又打人了，对于我来说，其意义只是为了满足我的攻击欲望，能让我有机会骂一下。摊贩也只是我能够骂人的道具，从骨子里，我才不管他们到底是什么命运呢。你信不信我如果是城管，下手会更狠？”\n\
    \n“因为我只是想发泄，以心理欲望来回应这个世界，所以我才不管一个人说的话是什么意思，只要这个话看上去有把柄就可以。那么，你说，当大家玩微博玩得很兴奋，而那位名人偏要说微博的坏话，我还等什么呢？当然啦，我不会让自己体验到自己就是一个骂人的网络混混，对自己装了一下，包装了一下语言，而不是直接问候他的家人。”\n\
    \n### 10. 我们无法想象的一件事情是，一个人会违反他不能违反的心理规律\n\n下面，进入实际的技术分析了。\n\n来看一个真实的故事。\n\n事件的第一个过程是这样的：在一个社区的便民服务大厅里，发生了一个爆炸案。这个爆炸事件的结果是死了几个人，伤了十几个。然后，官方就说，其中已经死了的一个人Z是嫌疑人，他性情孤僻，言行极端，悲观厌世——就是说，他在便民服务大厅里玩“自杀性袭击”，其心理动机是为了“报复社会”。\n\
    \n当时我就笑了。\n\n我用心理分析、性格分析证明，或者这个爆炸案不是Z干的，或者是他干的，但他的动机绝对不是“报复社会”，因为实在无法想象一个人会违反他的心理规律。\n\
    \n“报复社会”的人，性格基本上属于我在《世界如此险恶，你要内心强大》里所说的“自卑型性格”，自卑、自尊心强、猥琐、心理阴暗、屈服于社会价值排序、懦弱。郑民生、艾绪强就是这类人。\n\
    \n但杨佳同学、马加爵同学就不是，他们报复的，是特定的抽象人群或和自己有某种心理关系的人，这个不叫报复社会。\n\n郑民生类的失败者遭受过N多人的鄙视、打击，只要境况没有改变，在心理上会仇视整个社会，一旦有某一件事情刺激，就会化为行动。而无论他们“报复”到了谁，哪怕是三岁小孩，在心理上，都是报复到了“社会”，因为在他们心理上，三岁小孩也是鄙视、欺侮他们的“社会”的一部分。\n\
    \n一个恐怖分子在玩自杀性袭击时，他想象着有真主在看他。同样，一个报复社会的人，也想象自己和他人眼看他。但是，不同的是，他报复社会时，追求的是发泄耻辱感和报复的快感，对于这个社会，他获得了巨大的心理优势，因为他不再是被人鄙视、欺侮的失败者，而是一个可以伤害社会，并且在心理上相对于社会获得了心理优势的人。他在报复时，心理上实际上希望有无数目光看他，并蔑视这无数目光。\n\
    \n所以，我们有第一个判断：当一个人要“报复社会”时，他选择的行凶地点，一般是在室外；所选择的对象，也是容易下手的。\n\n如果选择的是室内，就构成了一种在封闭空间里作案的情境，他看上去就不是在报复社会而是在作案了。但他心理上不可能让自己体验到是在作案，而是在报复社会。同时，这样做，他也体验不到力量感，无法获得蔑视想象中无数看他的目光的心理效果。\n\
    \n而如果选择的对象不是容易下手的，他将无法克服自己的懦弱，也无法获取心理优势。\n\n第二个判断：一个想要报复社会的失败者，无论他一开始想不想死，在心理上，是不可能选择和他报复的对象在某一瞬间同归于尽的。\n\
    \n原因就在于：报复社会是他发泄耻辱感的手段，并且是他获取可以蔑视……\n\n### 11. 很多狠话，它的功能，可能只是一个人的“语言疗法”\n\n事情还没有完，很快有了第二个过程，为回应人民群众的质疑，官方公布了\
    \ Z “报复社会”的证据：QQ 聊天记录，以及日记等有关证据和材料等。\n\n这个，终于可以让我们的语言心理分析派上用场了。当时我一看，就绝对肯定，这些证据根本就不成立！\n\
    \n抄一下这些证据。\n\n- 证据 1: QQ 聊天记录\n  - a. “社会之残酷越来越让我要暴乱了。我不知道在我实在混不开的时候会有多少人死于我的手下。”\n\
    \  - b. “我啊，本来是好心人，可是，社会教我不要做好心人，如果有一天我觉得什么都没意义时，那些人又会好过吗？”\n- 证据 2: QQ 空间\n \
    \ - a. “从九岁到现在，老子和那些杂种打了几百次架……老子现在什么都没有了。只有健康的体魄，难道这些杂种只知道社会有钱什么都能办，难道你不知道我不好过，你的后果会怎样吗？”\n\
    \  - b. “我坚信，要在沉默中爆发，这世界缺少某些人照样要转……难道只有自己有难题，别人都是一帆风顺吗？社会啊社会，为什么安排那么多天才啊。”\n\n\
    这些话都很暴力是不是？我不纠缠于其他细节，而且，只挑 Z 所说的话中最狠的，即最能证明官方所说的 Z 是“报复社会”的那些话，看是不是真的如此。\n\nQQ\
    \ 聊天记录里最狠的话是：\n\n“社会之残酷越来越让我要暴乱了。我不知道在我实在混不开的时候会有多少人死于我的手下。”\n\n看到没有？确实看上去对社会充满杀气。\n\
    \n但它是聊天记录里的，这意味着，Z是在和他人QQ对话时说这句话的。那么，既是对话，显然除了这句话，Z还有其他的话。从语言分析上来说，这句话是嵌在他和另一个人对话的语言链里的，其含义受制于具体的语境，不能把它从语境中抽象出来单独理解。\n\
    \n好，我们也可以不管这一点，就只看这句话。\n\n从对话的角度上说，当Z在QQ里对另一个人这样是说时，显然预设了这个人值得信赖。从这句话本身的表达、含义来说，可以排除他是一个陌生人所说。因为对一个陌生人说，两人没有心理上的联系，在心理上毫无意义，无法获得这种心理效果，那就是表明自己有种，或想得到倾听、安慰。\n\
    \n而从语言和心理的关系来说，我想请大家注意，当一个人说要“报复社会”，放出狠话要干一件惊天大案，要让多少人死于他的手下时，他的“倾听对象”，绝对不是他的亲人、朋友等值得信赖的人，而是他骨子里认为平时就打击过他，或想嘲笑、鄙视他的人。无论他最终是否“报复社会”，这句话本身，就具有了报复的心理效果，因为它让一个人在心理上瞬间对社会处于进攻姿态和威胁的角色，具有了心理优势，发泄了耻辱。\n\
    \n而如果他是亲对亲人、朋友说的，我们可以绝对断定，他虽然有报复社会的冲动，但骨子里，其实是想找一个理由，阻止自己去这样干。\n\n真相是：他所说的这句话的心理意义，并非是向别人表明自己具有报复社会的想法和决心（因为他在亲人、朋友面前说这些话，如果是要玩真的，他在心理上就会体验到自己不是一个好人，不负责任，会有道德压力），而是把以往所遭受的耻辱、挫败，尽情发泄，向别人倾诉，以得到别人的安慰和劝解。这样一来，他可以说出任何狠话，因为他体验到自己并不真的去做，所以说出来不会有道德压力。\n\
    \n在这类情境中，任何一个在生活中受到鸟气、遭到挫败的人都可能说出狠话，而且越狠越爽，但他并不会去干。这就是很多人在生活中都说过很多狠话，但也没见他变成一个暴徒的原因。\n\
