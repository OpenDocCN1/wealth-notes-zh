    终是钱，不是你，你不值得高傲。如果一个人因为钱或地位而看你低，他看

    低的是钱和地位，也不是你，你也不值得自卑。


    这段话，我们平时都知道，或别人一说我们就觉得自己也知道，有没有？

    还可以说出一长串经典名言，比如，某女士就有这样的“经典妙语”风行一时：


    人绝不能看轻自己，但也别太看重自己。面子是别人给的，脸是自己丢

    的。不会尊重别人起码也要学会自尊。一个从没有嫉妒过别人的人，是缺乏

    上进之心的平庸之徒；一个从来没有被别人嫉妒过的人，是庸庸碌碌的无能

    之辈。人应痛苦地清醒着，而不应麻木地快乐着。倘若无奈，你可以“厚颜”

    但不能“无耻”！


    这段话录够“哲理”够煽情吧？在微博上，我看到无数人奔走相告。问

    题是，尽管以为自己懂得这些道理，但在别人巴结我们的时候，我们仍然高

    傲；他们看低我们的时候，我们仍然自卑。我们不断地用某女士的语录来提

    醒自己，但仍然看轻自己，仍然嫉妒，仍然麻木地快乐着……


    这些道理好像全派不上用场，一般情况下只能用来装，表演给自己和别

