    真的如此。


    QQ 聊天记录里最狠的话是：


    “社会之残酷越来越让我要暴乱了。我不知道在我实在混不开的时候会有多少人死于我的手下。”


    看到没有？确实看上去对社会充满杀气。


    但它是聊天记录里的，这意味着，Z是在和他人QQ对话时说这句话的。那么，既是对话，显然除了这句话，Z还有其他的话。从语言分析上来说，这句话是嵌在他和另一个人对话的语言链里的，其含义受制于具体的语境，不能把它从语境中抽象出来单独理解。


    好，我们也可以不管这一点，就只看这句话。


    从对话的角度上说，当Z在QQ里对另一个人这样是说时，显然预设了这个人值得信赖。从这句话本身的表达、含义来说，可以排除他是一个陌生人所说。因为对一个陌生人说，两人没有心理上的联系，在心理上毫无意义，无法获得这种心理效果，那就是表明自己有种，或想得到倾听、安慰。


    而从语言和心理的关系来说，我想请大家注意，当一个人说要“报复社会”，放出狠话要干一件惊天大案，要让多少人死于他的手下时，他的“倾听对象”，绝对不是他的亲人、朋友等值得信赖的人，而是他骨子里认为平时就打击过他，或想嘲笑、鄙视他的人。无论他最终是否“报复社会”，这句话本身，就具有了报复的心理效果，因为它让一个人在心理上瞬间对社会处于进攻姿态和威胁的角色，具有了心理优势，发泄了耻辱。


    而如果他是亲对亲人、朋友说的，我们可以绝对断定，他虽然有报复社会的冲动，但骨子里，其实是想找一个理由，阻止自己去这样干。


    真相是：他所说的这句话的心理意义，并非是向别人表明自己具有报复社会的想法和决心（因为他在亲人、朋友面前说这些话，如果是要玩真的，他在心理上就会体验到自己不是一个好人，不负责任，会有道德压力），而是把以往所遭受的耻辱、挫败，尽情发泄，向别人倾诉，以得到别人的安慰和劝解。这样一来，他可以说出任何狠话，因为他体验到自己并不真的去做，所以说出来不会有道德压力。'
