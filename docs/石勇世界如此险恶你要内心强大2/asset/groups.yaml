    # 3. 在这个世界里，没有一个人 在心理上不想活


    虽然这已经不是一个多用几个“子曰”就可以忽悠人的时代了，但我们还是听中国古代哲学家老子曰一下：


    > “一生二，二生三，三生万物。”


    中国人曰完，让老外接着曰。


    我安排曰的人叫牛顿。他曰：在茫茫的宇宙，万物不停地运动，而上帝，就是运动的“第一推动力”。


    “一”是指什么，“第一推动力”是不是上帝，对于我们普通人来说并不重要，重要的是思维—在这个世界上，很多东西都可以找到一个“终极动力”或“逻辑原点”，一个“事物最初出发的地方”。


    人的心理  行为的终极动力、逻辑原点是什么？很简单：求生——在生理上和心理上求生。


    我说过，在心理上求生，是心理的第一定律，它类似于数学上的“公理”。


    如果你说，在这个世界上，有人就是不想在心理上活，而是要在心理上玩完，那么不好意思，我无法想象有这种人—无论他是所谓正常人还是精神病！


    在生理上不想活下去，也即想死的人不少，但这么做，恰恰也是为了在心理上谋生。一个感觉可以在心理上活下去的人，是不会自杀的！


    # 4. 知识是用来让人牛的，而不是用来装的


    多年来，有一个哲学的思维方式一直让我受益匪浅，在这里分享一下：


    对一个看上去有点道理的观点，不仅要知其然，也要知其所以然。


    如果没有“给个理由先”“请描述一下为什么会这样”的追问，哲学能'
  - '[PAGE 32]


    # Part I


    不能成为人类自我认识的最高智慧，毫无疑问。


    我来解释一下为什么我们要学会这样干。


    知其然，你只能在头脑上简单地记住观点的表述，相当于背诵一下而已，很快就会淡出智力结构的表层，在很多时候根本没没用；知所以然，它就成了你智力结构的一个内容，当时机出现，你就能够运用它。


    培根说，知识就是力量。但如果你不会运用，知识什么都不是，最多可以用来装，显示自己“有才”。其实，真正应该用来装的，是弹钢琴、拎一个LV、开一辆宝马、去星巴克喝一杯这类玩意儿，而不是知识——知识是用来让人牛的！


    # 5. 本能不会提醒你说“注意了，我来保护你啦”


    按照这个思维，我们要问一句：人为什么要心理上求生呢？


    先简单地看我们的存在：我们是带着一坨肉来到这个世界上的，我们的存在，首先就是一坨肉，一堆复杂的生理结构，对不对？


    好，这一坨肉，这一堆复杂的生理结构要能够生存，就先天地配备有一系列自动保护装置，那就是本能。当你饥渴时，意味着这坨肉的生存受到了威胁，本能就发作了。当一个人在背后猛拍一下你的肩膀时，你会迅迭地转头看他是谁，并同时做好进攻准备，这就是本能控制你来保护自己的结果。


    本能是无意识的，不会提醒你说“注意了，我来保护你啦”，当本能发作时，没必要装什么高档，痛快地承认，我们就是动物，和猪、牛、狗子没啥区别。


    当然，我们是人类，不仅仅是动物。在带着一坨肉来到这个世界上时，在它提供的“物质基础”上，我们也发育、形成了两样东西——两种功能：智力结构和心理结构。


    智力结构是用来干什么的，无须废话，因为它就是“你有一个大脑，用来干什么”。对于像帕斯卡之类的思想家来说，就是：人有一个智力结构，那真的是太伟大了，因为它可以用来让人思想，使人比宇宙中那些要毁灭他的东西“高贵”得多，直接就可以鄙视猪、牛、狗等动物了。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_32_0.png)'
