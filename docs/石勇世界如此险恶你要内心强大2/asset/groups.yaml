    # 1. 混乱的语言是心理秘密的外露


    我们的心理分析有这样一两手准备。


    如果一个人说话滴水不漏——就是说，不含混，很有逻辑，没有破绽，那么，他的话，就没有携带心理的内容。从他的话中，无法直接破译他的内心，而需要运用到我们前面所讲的“心理背景—情境”这样的公式。


    但如果一个人说的话很混乱，前后矛盾，有逻辑错误呢？


    我想说，那我们心理分析的一个杀着，即语言—心理分析就派上用场了。因为，语言的混乱就是思维的混乱，而思维的混乱就是心理的紊乱，其语言乃是心理秘密的外露。


    小平同志说，两手抓，两手都要硬。


    # 2. 理解一个人所说的话，不仅仅包括话的意思，也包括他心里面的意思


    语言—心理分析是很厉害的，但一个人得培养对语言的敏感，不要太迟钝了，半天都没反应过来。


    我想请问一下：如果我慷慨激昂地（其实也挺装的）对你说“真理往往站在少数人一边”，你会不会觉得我说得有道理？


    注意，我是在对你玩一个语言敏感度的测试。我最想看到的结果是：你马上宣布我这句话是屁话，因为它没有任何信息！


    真理往往站在少数人一边吗？杀人放火的人渣们是不是少数，真理会眷顾他们？


    为什么说这是一句屁话呢？因为它抽离了语境。


    就是说，单独地说这句话一点意义都没有，它背后，必须有一个事件，而这句话，正是从这个事件逻辑地引发出来的。


    这个事件可能是：我坚持认为 1+1=2，但有几个人坚持认为 1+1=3。按游戏规则，必须大家投票决定对错。于是，投票的结果说我是错误的；再于是，我对你慷慨激昂地发表“真理往往站在少数人一边”的一句话演讲。


    如果没有这个事件作为背景呢？那么，我这句话，在语义上是没有信息'
  - '[PAGE 188]


    的屁话，但它具有了心理上的意义，那就是代表我的感慨。


    大家记住，当你听到一些莫名其妙或无法理解的话时，往往说话人是在自言自语，但是，他或者要靠说给你听来装，或者，是靠说给你听来发泄一下。他的注意力放在自己的心理背景上，不是在话上，更不在你身上。


    理解一个人所说的话，不仅仅包括话的意思，也包括他心里面的意思。有时候，甚至仅仅是心里面的意思。


    # 3. 当一个人说出某种话时，既是他的心理在说，也是他本人在说


    在很多年前，我就对语言和心里的关系产生了极大兴趣。


    那个时候，根据和别人打交道的经验，我发现，一个人说话的词语和方式，往往暴露出他的文化水平、价值观、素养。但是，那只是经验归纳，我不知道这奥妙何在。


    在后来漫长的日子里，这一粗陋的发现凤凰涅磐了。根据语言哲学和精神分析的原理，我创造出了一套独特的语言心理分析方法，既可以分析心理，也可以在信息不多的时候，大致判断一个人是什么人。


    因为，当一个人说出某种话时，既是他的心理在说，也是他本人在说！


    好东西值得分享。下面，我就把它分享一下。


    我分别从一个人说话时的以下几个方面来进行考察。


