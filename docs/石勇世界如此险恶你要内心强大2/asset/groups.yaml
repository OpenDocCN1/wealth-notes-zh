    方法 methods


    革命导师卡尔·马克思教导我们：“理论一经人民群众掌握，也会变成物质力量。”


    我们要确立这一崇高信念：用理论武装起来的人民，是战无不胜的！


    对这段话，伟大领袖毛主席补充：“枪杆子里面出政权！”


    而作为革命群众甲，我也补充：“很多理论都可以提炼为方法来运用，而且，不同的理论，可以融合、提炼为一种厉害的方法！”


    我想请大家记住：如果一个人不能把理论提炼为方法，或学不会别人根据理论提炼出来的方法，他其实并没有掌握理论，只是“知道”理论是什么而已！


    能够用方法来把理论用上，转化为“物质力量”，那才是理论的最高境界。当然，这个“物质力量”，你怎么用，就可以怎么理解，正如你了解了一个朋友的心理，是用来帮他；但商家了解你朋友的心理，目的是操纵他，赚他的钱！


    任何一个领域的牛人，都需要一套观察和分析世界的方法来武装自己，因为只有这样，他的头脑和心理才能和世界的秘密建立联系，从而识破世界，抵挡世界，把握世界。如果有人说，他什么理论方法都没有，那一定是装，装天才。


    励志大师荀子就揭穿过这种装。他苦口婆心地对我们说：


    > “登高而招，臂非加长也，而见者远；顺风而呼，声非加疾也，而闻者彰。假舆马者，非利足也，而致千里；假舟楫者，非能水也，而绝江河。君子生非异也，善假于物也。”


    看到没有？荀老师说，一个人牛，主要是“善假于物也”。


    对于我们来说，所谓的“一眼就看穿你什么”，正确的解释是：在此之前，已经用理论、方法有了N次实践，才形成了敏锐的直觉！


    这个道理，连欧阳修笔下那位长期摆摊卖油、幸运地没有遇到城管的小贩都懂：“无他，唯手熟尔。”


    我们已经知道：一个人之所以成为一只心理动物，之所以在生活中、工作上、头脑中和心理上都出现问题，恰恰是因为世界和自我的门没有向他打开，或打开得太小了。


    现在，我们要用力打开这扇门。


    关于方法的讲解，我遵循的是由浅入深的原则，尽最大限度可以操作。


    但如果谁要求我弄出一套可以傻瓜式操作的东西，让懒人也可以学会，我只能遗憾地告诉他，犀利的心理分析是一门技术，也是一门艺术，不是计算1+1=2，它是做不到这一点的————它讲究摘懂原理基础上的灵活性、情境性，要求头脑和心理都很敏锐，实在无法还原、简单化成头脑的傻瓜式反应！


    这一点，我相信你懂的。


    # 09


    第九章


    # 心理动机


    ## 1. 我们就是要“诛心”


    心理分析在方法论上属于直捣黄龙，直击要害，绝不在事物的表象上兜圈子。


    常有人说不要玩 “诛心之论” 。那是用在辩论上，说一个人不能违反辩论的游戏规则，无视别人说什么，却去猜测别人的心理动机，并扣上一个帽子。这在逻辑上是犯了 “人身攻击谬误”
    ，比较低级。犯这种逻辑错误的人，或者比较阴险，或者比较弱智。


    但是，在非辩论的很多场合，因为我们面对的不是人的智力结构，而是人的心理结构，我们就是要 “诛心”！


    “诛心” 的意思，是破译他的心理动机，即他行为的意图。最高境界，就是一眼看穿，然后瞬间有应对之策。


    ## □破译心理动机的第一条路径：用 “身份、地位……—情境” 的公式去套


    ## 2. 只要你不认为一个人是傻子，那就千万不要认为，他所说的每句话、所玩的每个动作，背后都没有心理动机


    很久以前，在一所中学里，一位老师正在给一群学生讲一篇叫《孔乙己》的课文。


    我当时是这些学生中的一员。


    课堂上有两分钟左右的时间，用来分析课文里 “站着喝酒而穿长衫的唯一的人” 这句话。当然，谁都知道，答案一定很教科书。


    不过，在完成了洗脑的常规程序后，老师发表了他的独家意见。他请我们去想象： “同学们，孔乙己是出现在一个有长衫主顾光临，但更多的却是短衣主顾吃喝找乐趣的地方啊！”


    我的初中语文老师估计没有想到，很多年以后，他有一个学生从乙己这儿找到了一条破译一个人心理动机最简单的办法：把他的身份、地位……放到某个和别人打交道的情境中。


    原理很清楚：当 A 和 B 在打交道时，他们的头脑和心理都不是空的，而是携带着身份、地位、利益诉求、爱好、价值观、认知、欲望等诸多背景。用我的话说，这些东西，构成了他的心理背景。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_160_0.png)


    这些心理背景，会驱动一个人在某个情境中进行自我认同，或者和别人进行利益竞争、心理竞争。所以，当我们和一个人接触时，实际上是和他的整个存在，他看上去是什么样子以及他的心理背景接触！


    这就意味着，A 和 B 所说的话，所玩的 Pose，表达的，如果不是他的自我认同，就是利益诉求，或者心理诉求——总之一定会受到他的心理背景的影响！


    相信我，只要你不认为一个人是傻子，那就千万不要认为，他所说的每句话、所玩的每个动作，本身都无意义，背后都没有心理动机！


    我想说，“身份、地位……—情境”，即“心理背景—情境”是一个破译心理动机的简易公式，在一些情况下，把它一套，我们甚至可以预测到一个人会说什么话、会做什么事。而如果他己经说了、做了，往前一推，就可以知道他的心理动机何在。


    最熟悉和简单的例子，莫过于一个销售员向客户推销产品了，他所说的话、所玩的花样——无论是什么话、无论是什么花样，心理动机一目了然：搞定客户。他的身份就是销售员，所处的情境就是销售时和客户的互动，就是为了利益而推销的。


    再来看另一个同样很简单的例子。


    有一个在体制内的人，和上司平时关系不错，私下里走得很近，称兄道弟的。但是，在公开场合，上司对他的态度就完全变了，官架子十足，让他非常郁闷。


    这句话不用我说了吧？——他的上司其实只是在向观众表演时，委屈他配合一下而已！


    把上司的 Pose 翻译成内心的语言，就相当于对他说：“兄弟啊，在别人面前，我要装啊，显得自己大小也是个领导啊，知道不。你呢，应该配合我表演，在我命令你干什么时，要赶快服从，给老大我面子，明白不？”


    在这类情况下，无论是基于人道主义精神，还是利益的考虑，我想很多人不会拒绝配合一下的：在语言、动作上传递出（不是直接说出）这种信息——“嗯，你是老大，你有权力，这一点我从来不打算否认，尤其是在别人面前！”


    可以 不配合一个人 装吗？可以， 在一个人对你没有利害关系， 同时礼貌也没有要求你应该这样做的时候。


    ## 3. 有的事情会作为心理背景，陪伴我们一生


    有的情况稍微复杂些。但仍然请记住“身份、地位……——情境”，即“心理背景——情境”这个公式。


    我们要做的是：抓住到底是什么构成了一个人的自我认同，身份、地位、价值观、爱好、利益诉求、欲望、认知……还是别的什么？


    一个富人，按照他的身份和利益，应该是为他的阶层说话，鄙视穷人的，对不对？但是，有的富人，所做的恰恰相反，他“背叛”了本阶层。这如何解释？


