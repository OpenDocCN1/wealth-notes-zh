    而80后以上的人，其“自我”在成长时，社会相对来说发展得没那么快，也没那么现实，他头脑上受到社会上玩的那一套的影响，在进入心理结构，变成他的“自我”一部分时，还给一个稍微独立的“自我”成长留有一定的空间。所以，他不像90后那样现实，因为他那个稍微独立的“自我”并不现实。他也没那么脆弱，因为他那个稍微独立的“自我”本身就不是“现实”驻扎在内心里的代理人，而是有一点力量的。


