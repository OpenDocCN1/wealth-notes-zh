    # 7. 当一个人对你说话时，要么有利益上的期待，要么有评价上的期待，要么有态度上的期待


    你可能要问：一个人和对话者互动的方式到底能说明什么问题？


    我们先记住这一点：当 A 对 B 说话时，要么有利益上的期待，要么有评价上的期待，要么有态度上的期待。


    另外，从情境的要求上看，A 和 B 不能是自言自语。


    也就是说，A、B 两位所说的每一句话，应该和别人的话具有逻辑关系，应该是别人的话逻辑地引发的，或和别人的话有某种交集。


    如果不符合这两点呢？那就非常抱歉，它把一个人给暴露了。


    因为那些话不可能是从天上掉下来的，而只能是从一个人的心理结构里蹦出来，那么，它就说明了：一个人对别人在心理上是什么态度，他的心理背景如何。


    想一想，如果你在晚饭散步，看到一个熟人，你问他“吃饭了吗”，他的回答是“散步啊”，你心里面一定有不被尊重的感觉。


    如果他不是一个神经病或智障，那一定说明，他在心理上根本不拿你当回事。因为他在心理上，根本不屑于“听”到你在对他说什么，自然谈不上和你的话有逻辑关系。


    一个人和别人说话的方式，完全可以透露出这些信息：他对别人是应付、不屑于理睬、装作重视，还是真的重视？一个对语言敏感的人，马上可以判断出这一点。'
