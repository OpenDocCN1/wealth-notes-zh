    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_200_0.png)


    在这类情境中，任何一个在生活中受到鸟气、遭到挫败的人都可能说出狠话，而且越狠越爽，但他并不会去干。这就是很多人在生活中都说过很多狠话，但也没见他变成一个暴徒的原因。


    也就是说，Z 所说的这句狠话，其实只是一种对自己的挫败的“语言疗法”！


    我们接着看 QQ 空间里的日志，我同样也是挑 Z 说得最狠的。


    > “从九岁到现在，老子和那些杂种打了几百次架……老子现在什么都没有了。只有健康的体魄，难道这些杂种只知道社会有钱什么都能办，难道你不知道我不好过，你的后果会怎样吗？”


    这段话看起来，同样杀气腾腾。


    但很遗憾，这段话同样是从一个语境里抽出来的，并不完整。


    完整的段落是：


    > “大家看日记别说我无礼，我所骂的都是那些流氓。我操他妈，老子也走过二十几年，不是老子没有奋斗。回忆起来，老子一直被那些流氓欺负，从九岁到现在，老子和那些杂种打了几百次架，老子韧性很强，可是这些流氓为了不让我超过他，竟然用这卑鄙的手段来欺负我、打我，老子现在什么都没有了，只有健康的体魄。难道这些杂种只知道社会有钱什么都能办，难道你不知道我不好过，你的后果会怎样吗？我告诉流氓们，不要嫉妒别人，人急是不顾后果的。”


    看到没有？Z 在一开始，就说请大家看日记别说他无礼，这是什么意思？


    从语言和心理的关系来说，他来这一句开场白，暴露的就是：在以前，他一直把自己体验为是一个好人，而且在说这段话时，仍然把自己体验为一个善良、老实、有素质的人，害怕别人认为他是一个素质低下、充满暴力思想的人。他在骨子里就瞧不起这种人，在心理上，也要阻止自己这么做。


    他说那些欺负他的人是“流氓”，从语言上也反面印证了这种心理。


    这意味着，在心理上，虽然存在着会让“流氓”死于他手下的可能，但已经绝对排除了他会让无辜者也“死于手下”的可能。


    同样，从语言和心理上，这些话也只是具有“疗伤”的功能，他并不是在表明自己要让多少人“死于手下”的决心！'
