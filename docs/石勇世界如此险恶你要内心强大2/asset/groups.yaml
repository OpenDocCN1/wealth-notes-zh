    \n“原来是这样！”\n\n## 7. 当你对某人不耐烦的时候，其实不是对他本人不耐烦，而是他让你焦虑不安\n\n“还有哦，要高度注意。”我提醒她注意，“说情感、情绪、语言在心理结构的表层，什么意思啊？就是说，它离现实最近，当你发火的时候，刺激你的是具体的某一个人、具体的某一件事情，你是在对他、对它做出反应。”\n\
    \n“您会继续提醒我，说心理倾向位于心理结构的中层，又是什么意思？”\n\n“不错。它是什么意思？假设你是一个急性子，那么，激起了你的不耐烦的，虽然是现实中的某一个人、某一件事情，但你针对的，可不只是这个人、这件事情本身，你是以‘自我'去对外部世界做出反应，因为那个人、那件事情，只是和你构成了紧张关系的世界的一部分。你玩一次急性子，就是在重演、固化一次‘自我’和世界的关系。就是说，当你使劲催逼别人的时候，你本质上并不是对别人不耐烦，而是对他营造出来的、让你感觉不能把控的情境极度焦虑不安！”\n\
    \n“我就是这样啊！”\n\n## 8. 性格干的，应该是大事，而不是小打小闹\n\n“该讲到性格了。”她说。\n\n“性格我在以前讲过了，不过可以再补充一下，”我说，“它睡在我们内心的最深处，离现实最远，但它设定了我和世界到底是什么关系，因此最终影响我们的是它。就是说，它干的是大事，是一个人对整个世界说话，而不只是对具体的某个人、某件事说！只有我们把持不住它的时候，它才跳出来小打小闹。一个聪明人，既能在现实中把持住自己的性格，同时又能在内心里利用自己性格提供的强大心理动力。”\n\
    \n![](img/f533d0e211a5a2e3b4bb03c08b93c292_56_0.png)\n\n## 9. 当我们愤怒的时候，它的心理能量，就把恐惧的心理能量夺过来，恐惧也就消失了\n\
    \n讲了很多了，但这位白领小妹妹执意要我继续讲。\n\n“我一个个地给你讲情感、情绪、性格、心理倾向，到底是怎么玩心理保护的吧！”我提议。\n\n“好啊！”\n\
    \n“假如有人骂了一句 ‘玛勒隔壁’，从内容而言，他在骂人，但从心理的功能而言，他是在发泄，通过攻击给自己找心理优势，是不是？”\n\n“是。”\n\n“很好。我们就先从情感、情绪，当然，还有语言讲起。想一下，当你有了情感、情绪，说出些不过大脑的话，比如骂一句脏话时，是不是有什么刺激到了你？”\n\
    \n“是啊！”\n\n“你生过别人的气吧？”\n\n“生过。”\n\n“那情感、情绪、语言，在进行心理保护时，它的运作也就太简单了。”\n\n我继续说：“好，有人惹你，你生气了，那么，心理保护，就是这样玩的——我画一张它的流程图给你看看。\"\
    \n\n![](img/f533d0e211a5a2e3b4bb03c08b93c292_57_0.png)\n\n“看懂了没？”\n\n“有一点不懂。愤怒让我体验到有力量，它的心理能量，把我被侮辱的那种心理能量夺过来了？”\n\
    \n“当然啦！只要学过初中物理，谁都知道能量守恒定律，在心理结构中活跃的心理能量，也遵守这个定律哦。”\n\n“于是，心理保护，就通过这种能量的转换，让我从被侮辱、被伤害，变成了有力量，可以进攻？”\n\
    \n“非常聪明！这个秘密你已经知道了：情感、情绪的心理保护，其实就是通过心理能量的转换！”\n\n## 10. 当你感受到侮辱的时候，意味着，别人可以继续侮辱你\n\
    \n真是一点就通。\n\n我变得很高兴：“别人惹了你，你有被侮辱的感觉对不对？侮辱在心理上，方向是别人指向你，意味着你是被动挨打，体验它，你只能感受到伤害。所以，为了在心理上保护自己，你要把它转化为愤怒。恐惧也是如此。当你恐惧的时候，方向也是别人指向你，你不仅被动挨打，而且软弱无力，内心风雨飘摇，根本就活不下去。所以，它也要转化为愤怒。”\n\
    \n“就是说，一个人通过愤怒等情绪得到的那种力量，其实只是像气球充气了一样，但他内心是虚弱的，因为引发它的恐惧？”\n\n“回答正确！加10分！现在，我们要给情感、情绪的心是怎么玩的搞一张逻辑图式，以便一眼就看懂。”\n\
    \n“嗯，是什么？”\n\n![](img/f533d0e211a5a2e3b4bb03c08b93c292_58_0.png)\n\n“懂了。”\n\n\
    ## 11. 一个人的性格越容易被激活，他越焦虑不安\n\n“接下来，我们看一下心理倾向。至于性格，我在《世界如此险恶，你要内心强大》里已经讲了。我给你描述一下它的逻辑图式，剩下的事情，翻书吧！”\n\
    \n我描述了一下：\n\n一个人在他的过去，由于和外部世界在心理上的关系，形成了某种性格，比如自卑型性格、占有型性格→或者推动他去满足自己的欲望，改变现实，改变自己，使心理生存得到满足；或者，性格被现实情境激活，表现出来。\n\
    \n![](img/f533d0e211a5a2e3b4bb03c08b93c292_58_1.png)\n\n“但是注意了，一个人的性格如果容易被别人，或者一件事情激活，那就表明他内心很焦虑、很不安——因为只有在这种情况下，他才那么容易出动性格，来在心理上保护自己。”我提醒她。\n\
    \n## 12. 玩一次固执，就是在心理上重演一次你对世界的防御\n\n“好，你看到了情感、情绪、语言，以及性格的心理保护是怎么玩的，那么，心理倾向的变化，你可以想象吗？”我力图让自己变成一个循循善诱的人。\n\
    \n她说：“嗯，要不，您提示一下？”\n\n“当一个人被刺激时，情感、情绪、语言，是当场发作，过后就消失的，对不对？但是，一个人的心理倾向，他是自恋的、固执的还是任性的，在他发作之前已经形成了。是吧？”\n\
    \n“是啊。”\n\n“那它的心理保护，和情感、情绪、语言，一定有些不同。”\n\n“我也是这样想的。”\n\n“那，是不是可以这样描述：他过去形成了某种心理倾向，它是心理保护的固定模式，然后，遇到某件事、某个人，就被刺激出来了？比如说，一个人固执，有人想说服他，但是，他害怕被说服，于是，就表现出固执来？”\n\
    \n“大致如此。但还是先让我们来看一下，一个人为什么固执呢？我们先走进他的内心世界。”\n\n“好，我也想看看。”\n\n## 13. 说服一个固执的人的最好办法就是让他自我说服\n\
    \n“记住，‘固执’这个词，不是描述智力的词，而是描述心理的词，即它描述的不是智力结构的状态，而是心理结构的状态。所以，当你准备说服一个人的时候，要知道，说服的是他的心理，说服头脑是没用的。”我提醒她。\n\
    \n“嗯，那固执的人到底是怎么回事？”\n\n“固执的人，不是他头脑在坚持什么，而是在心理上，一定要坚持和他‘自我’ 能够联系不起来或等同的东西，无论是观点、风格、做事的方法，还是别的什么，否则，他就感觉到他的‘自我’被他交了出去，将遭受没有价值和被人控制的危险，这样，他在心理上将感受不到安全感。”\n\
    \n![](img/f533d0e211a5a2e3b4bb03c08b93c292_60_0.png)\n\n“于是，他不会听别人的话？”\n\n“不错。但他不是听不进去一个道理，而是希望这个道理是‘他自己’知道的，而不是‘别人的’。”\n\
    \n“那有什么办法可以说服一个固执的人？”\n\n“很简单。知道了一个人固执在心理上是怎么回事，你就可以对症下药。最有效的有两招。”我侃侃而谈，“第一招，让他最亲的人、信任的人对他说话。因为面对这个人，他无须过多地玩固执来在心理上保护自己，而且，他玩固执，会有道德压力。第二招，设法让他自我说服，这就需要你的引导。”\n\
    \n“嗯，我以后试试。”\n\n“你一定要问：那么，心理倾向的心理保护逻辑图式又是什么呢？”\n\n“对啊！”\n\n“是这样：由于过去的经历，一个人在心理结构上，形成了和世界打交道，用来保护自己心理生存的固定心理倾向，比如是急性子，比如很固执→在某个情境里，他的某个固定心理倾向被刺激→心理倾向等表现出来，对自己进行了心理保护。很简单吧？”\n\
    \n![](img/f533d0e211a5a2e3b4bb03c08b93c292_60_1.png)\n\n“我看明白了。”\n\n![](img/f533d0e211a5a2e3b4bb03c08b93c292_62_0.png)\n\
    \n# 04\n\n## 第四章\n\n## 心理指数\n\n### 1. 内心强大指数、心理保护指数、心理动物指数的高低，综合来看，大致可以衡量一个人的层次，揭示他的人生命运\n\
    \n如果把话说得糙一些有利于我们看到真相，那么，我并不拒绝这样做。\n\n经过《世界如此险恶，你要内心强大2》，以及前面的讲述，有一个问题出现了：说一个人内心强大，说他是一个心理动物，说他在玩心理保护，这三者之间有联系吗？\n\
    \n回答是：有。我想说，它们之间的联系，和牛×、傻×、装×之间的关系有点像。\n\n一般的情况是：\n\n- a. 一个人越内心强大，就越不需要靠玩心理保护的游戏来生活，他的心理动物指数就较低——正如他越牛×，就越不需要装×，离傻×的档次也远一些那样。\n\
    - b. 一个人如果是一只心理动物，那么，他就太喜欢玩心理保护了，内心强大的指数也就较低——正如他如果是个傻×，那么，一定喜欢装×，也很难牛×一样。\n-\
    \ c. 一个人如果被自己的心理保护控制，那么，他的心理动物指数就较高，而内心强大指数则较低——正如如果他喜欢装×，也很容易变成傻×一样。\n\n一个内心强大的人\
    \ $→$ 不爱耍玩心理保护游戏 $→$ 心理动物指征低\n\n一只心理动物 $→$ 太喜欢玩心理保护了 $→$ 内心强大指征低\n\n一个被心理保护控制的人\
    \ $→$ 心理动物指征高 $→$ 内心强大指征低\n\n还有特殊的情况，请注意了：\n\n- d. 如果在心理保护的强大动力涌上来的时候，一个人能够把持住它，不让它在心理结构里发作，即把持住自己的性格、情绪，把它转化为实现自己目标的最深远的驱动力，那么，他就内心强大，心理动物指数、心理保护指数也较低——正如他的装，不是为了在心理上获得牛×的感觉，而是博弈、礼貌等需要，他也可能通过装\
    \ × 变得牛 × 一样。\n\n![](img/f533d0e211a5a2e3b4bb03c08b93c292_64_0.png)\n\n内心强大指数、心理保护指数、心理动物指数的高低，综合来看，可以衡量一个人的精神档次，揭示他是个什么样的人。\n\
    \n### 2. 一个人在心理上如果进入妄想状态，那么，他是无敌的\n\n为了考察一下内心强大、心理保护、心理动物之间的联系，以及它们各自指数的高低，我邀请了五位中国人民熟悉的朋友来和我合作。下面，我们先请著名的“精神胜利大法”创始人阿\
    \ Q 先生出场。\n\n- 人物：阿 Q\n- 职业：流氓无产者，革命“返”士\n- 事迹：一系列的“精神胜利”\n- 心理动物指数：★★★★★\n- 心理保护指数：★★★★★\n\
    - 心理强大指数：★\n- 特征：心理保护随时变成语言、动作发作出来\n\n我们都知道，经济学把人假设一种“理性的经济人”。那么，阿 Q 大哥究竟是什么人呢？\n\
    \n很清楚，无论是从文学，还是心理学的角度看，他是典型的“心理人”：被一系列心理规律操纵。当然，Q 兄也是一种精神，一个符号，一堆心理结构。\n\n我们来唤起中学的记忆，考察一下\
    \ Q 兄的“精神胜利大法”是怎么玩的。我想说，“精神胜利大法”其实就是心理保护，而且是心理保护中最低档、最垃圾的一种玩法。\n\n还原一段阿 Q 和别人约架的情境。\n\
    \n某月某日, 有闲人在微博上取笑阿 Q 头上的癞疮疤, 假装惊讶地说: “哇, 头上亮起来咯了哦。哈哈。”\n\n阿 Q 大哥的心理保护被启动, 生气了。一个人生气了,\
    \ 对他人在心理上就具有进攻性、防御性。但闲人显然有备而来, 没有被吓住, 继续攻击他。\n\n愤怒看来还不足以获取心理优势, 那么, 就用蔑视吧, 一个体验到蔑视\
    \ 的人, 会体验到他在精神上、价值上对另一个人的居高临下, 而这种精神上、 价值上的优势, 当然会转化为心理优势。于是, Q 兄迅速在内心里说出 “你 TM\
    \ 也配”这句经典名言。\n\n但闲人还在挑衅, 于是双方在公园约架。\n\n事后, 据闲人在微博上公布战果: “揪住黄辫子一根, 在壁上碰了四五 个响头。”闲人并且表示:\
    \ “我全身而退, 毫发无损, 没给未庄老少爷们儿 丢脸。”\n\n在心理上我们的 QQ 是不是被击溃了? NO。\n\n作为革命 “逗” 士, 他还有一招最厉害的心理保护,\
    \ 即让自己快速进入 妄想状态, 在心理上任意设定自己和别人的关系, 并让自己活在这样一个自 我世界里: “哈, 我总算是被儿子打了……这个世界, 真是道德沦丧……”于是,\
    \ 在微博上, 他也心满意足地宣告胜利。\n\n我曾经看过一个在美国的华人学者, 名叫林毓生, 说 QQ 大哥是 “几乎 全靠本能生活和行为的动物”。我会心一笑,\
    \ 但要纠正一下, 准确的说法是 “全 靠心理保护生活和行为心理动物”。\n\n### 3. 我们对一种东西欲壑难填, 是因为我们从未走出某个过去\n\n\
    阿 Q 是一个心理保护几乎随时都会变成语言、动作发作出来的人。\n\n但有的人不会, 他们的心理保护变成了不能满足的欲望, 而且非常强烈, 人生的成就感就系于此。比如著名的表演艺术家阿希同志,\
    \ 至于阿希的真实性, 套用 TVB 的一句话: 本人物纯属虚构, 如有雷同, 纯属巧合。\n\n- 人物：阿希\n- 职业：演员\n- 事迹：参与了多起流出艳照事件\n\
    - 心理动物指数：★★★\n- 心理保护指数：★★★\n- 心理强大指数：★★\n- 特征：被性格、欲望控制\n\n假设阿希是一个参与了多起流出艳照事件的公众人物。那么他到底是个什么人呢，有什么强大的心理动力让他那么好这一口？\n\
    \n我的回答是：按照弗洛伊德老师的理论，他是一个“肛门人”，即是我在《世界如此险恶，你要内心强大》中所讲的性格理论中的“占有型性格”。\n\n让我来抄录一下弗斯的理论，看什么是“肛门人”。先说一下，“肛门人”不是骂人的话，这是严肃的精神分析术语。\n\
    \n弗老师把人的性心理发展划分为5个阶段：口唇期、肛门期、性蕾欲期、潜伏期、生殖期。其他我就不抄了，只看一下“肛门期”。\n\n肛门期在 1.5 ~ 3 岁间，里比多（弗老师的专门术语，意指性能量，好像有点神秘主义，不过这里不用管它）在这一时期里与肛门联系起来。小孩子通过体验粪便的保持和排泄而很爽。\n\
    \n但是，大便是脏的啊，父母要叫他赶紧排泄啊，也就是要让他不爽啊。于是，小孩就有一种对抗，你要叫我屙的时候我偏不屙出来，而你不叫我屙时，我偏要屙出来，哼！\n\
    \n这意味着什么？弗老师说，如果一个小孩特喜欢这样干，很可能他的性心理发展，就固定在了这一阶段。也就是说，虽然他长大成人了，但在心理上并没有长大，还是一个处于“肛门期”的小屁孩，即一个“肛门人”。\n\
    \n好，我们不去纠缠“肛门期”的理论，而是可以借用“肛门人”这个概念来描述占有型性格的特征了，因为性格正是在小时候发展而成的。\n\n![](img/f533d0e211a5a2e3b4bb03c08b93c292_66_0.png)\n\
    \n“肛门人”的特征是：他喜欢控制，喜欢占有，不断地想要占有，而且欲壑难填——占有各种在社会价值排序上高档的东西，比如金钱、美女、权力，就是他解决自己的心理需求、人生问题的方式。\n\
    \n“肛门人”是这种样子。那么，阿希是如何炼成一个“肛门人”的？他可能具有如下人生经历，并因此产生了相应的心理后果。\n\n- a. 幼年时，全家不停地搬家，甚至十年搬了十多次家。\n\
    \n  心理后果是：没有确定性。\n\n- b. 少年时，知道了家庭的真相：父母早已离异，他一直被善意地蒙在鼓里。\n\n  心理后果：有被欺骗、耍弄的感觉。萌生对父母的报复心，并投射到别的男人、女人身上。\n\
    \n- c. 青春期，爱上了一个女孩，遭到背叛。\n\n  心理后果：不再对这个世界，尤其是女人投入真感情。他要报复，而报复的方式是不停地占有、攻击（包括占有后的抛弃等）。\n\
    \n嗯，到走进阿希的内心世界的时候了。\n\n我们来问第一个问题：阿希为什么那么热衷于猎艳，而且确实也艳福不浅？\n\n回答是：作为“肛门人”，他没有控制住自己的性格、欲望，让自己心理保护的动力用在别的方面，比如学习后面我们要讲的乔布斯同志。当心理保护控制他的时候，如果不占一个个个年轻漂亮的女人，他的心理问题、人生意义就得不到解决。\n\
