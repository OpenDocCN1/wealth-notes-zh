    ## 保护我们在心理上不被伤害！


    对于我们自己，同样适用。而如果我们已经感受到了心理问题的折磨，那就更需要澄清了。


    有一个受过感情创伤的大龄剩女 A，爱上了一个比她小八岁的“屌丝” B。这位 B 兄弟还是不错的，虽然混得并不怎么样，但在 A 心中很优秀，处理事情比较理性、成熟，会安慰人，有些事情几乎无须
    A 操心。A 因此很爱他，认为这是她今生唯一爱过的人。


    但你可能想到这一点了：他们可能吗？事实正是如此：不知什么原因，他们分开了，而且，不会再有机会。


    但是，事情并没有完。A 很迷茫，无法放下，在心理上过不了这道关，因此很难开心、快乐。她坚持认为，自己这辈子不可能爱上别人了，她因此一直活在对 B 的固态性想象中，没有迈出去。


    为了让她能够澄清一下自己的这种心理问题，早日走出来，我扮演了一个残忍的真相揭露者的角色，直接告诉她：她对 B 恋恋不舍，只是对类似于初恋的那种美好感情，以及
    B 能够给她安全感的眷恋而已。而这并不意味着，她不可能再爱上别人了。也许再过一段时间，当她走出来时，就不再是这种感觉到了。


    像弗洛伊德老师在分析时遭遇到了患者的“阻抗”一样，当我这样说时，她的心理保护也启动了，说不赞成我的这个判断。


    我说：你当然是不赞成的。因为，另一个真相是：以自己的条件，她心里隐隐有一种感觉，就是找不到比 B 更好的了。她事实上恨自己的条件为什么是这样，当然，这个现实太让人痛苦、沮丧了，她不敢让自己体验到。


    我不知你看没看到？她其实是渴望有一个让她满意的男人和她过的，但是害怕找不到！由于她不敢面对这一点，于是，便拿 B 来说事，想象成是找不到比 B 更好的了。为了保护自己，她在心理上这样做：固守于认为
    B 最好，认为自己不会再爱上别人。她不过是通过躲在过去，以怀旧、感伤的方式来逃避现实和未来！


    而在心理上仍深陷在过去，她就会越来越把自己变成一个感伤的人，一个不敢面对现实的人，一个无法快乐的人。但如果自己澄清了这一切后，该怎么样，已经非常清楚。


    ![img/f533d0e211a5a2e3b4bb03c08b93c292_176_0.png](img/f533d0e211a5a2e3b4bb03c08b93c292_176_0.png)


    ## 第十一章 破译内心语言


    ### 1. 说话的，并不仅仅是嘴巴


    说话的，并不仅仅是嘴巴。一个人的眼睛、动作、姿态、表情、心理，也在说话。


    而嘴巴里说的话，可能是真的，也可能不是真的。它也许是十足的谎言，也许是对内心的真话、真正想说的话的一种包装、暗示。关键是，我们能否听懂？


    似乎什么都可能骗人，但唯一不能骗人的，是一个人的内心语言。


    所以，我们的心理分析，必须掌握这个技术活：通过一个人所说的话，他在具体情境里的眼睛、表情、姿态、动作等，把他的内心语言给翻译出来！


    强调一下，这个“人”，也包括我们自己，即自我分析，我们不应拒绝倾听自己内心的声音。


    ### 2. 有很多话，是不能直接说出口的，需要我们去听懂


    先来看一下最简单的情况。


    假设你向一个所谓的朋友借钱，他面露难色，说：“我手上没多少钱，家里还急需用点。你看？”你应该知道他的内心语言吧？


    我代劳翻译一下。他的内心语言是：“不好意思，我不想把钱借给你，为了不得罪你，也让大家表面上都有点面子，我扯了一个谎。你应该知道我的意思，不必再说了。”


    有很多话，是不能直接说出口的，需要我们去听懂。但我们更要听懂的，不止这类弦外之音。


    在这里我要先强调一下，破译内心的语言，准确地说不是一个和破译心理动机，以及澄清并列的心理分析路径，而是一种技术要求。


    就是说，从内容而言，我们要翻译的“内心语言”，既可以是一个人的心理动机，也可以是他所说的话、所玩动作的心理含义；可以是他的心理倾向，可以是他的性格表现，也可以是他的情绪、情感，等等。我们只是代替一个人把他内心里真正说的，以及想说的话，给形象地表达出来，以便可以听懂他。


    ### 3. 当我们失去了一个人的爱后，往往想从其他人那儿得到补偿


    破译内心语言，我们可以根据不同的情况，采取以下几个思路。


    下面这个故事，适用于情况 B。


    有一个正在上大二的女孩，以前很听话，但是，自从她爸爸出了意外不在了以后，遭受了很大打击，整个人全变了。她的表现是：觉得整个世界上的人都欠了她一样，好吃懒做。没钱了，就向她妈妈要，还和她妈妈打架，用非常难听的话骂她妈妈。


    她妈妈非常苦恼，觉得这孩子有心理疾病，想和她交流，但这个女孩并不给她妈妈机会，不讲道理，一见到她妈妈就骂。而且，一见到亲戚朋友就要钱。


    正好，她妈妈认识我的一个读者，这位读者就问我，这女孩是不是变成了攻击型的性格，该怎么办？我告诉她，这不是攻击型性格的表现，而是遭受巨大打击后的心理后果。如果有人说她有了精神病，那么我会说，他才是精神病！


    如果我们澄清一下她的语言、行为的心理含义，真相就出来了。


    - 第一，她是以自暴自弃、向世界撒泼等发泄的形式，来减轻自己的痛苦。这是在自我疗伤——如果你还不明白，那么请问，你有没有看见过，当一个人受到巨大的刺激或打击时，会发狂地叫喊奔跑？

    - 第二，她从亲人那儿要钱，和妈妈吵架，是以疯狂的形式来从其他亲人那儿索取因为永远失去了父亲而已经失去了的爱，她需要从其他亲人那儿得到补偿。


    当我们失去了一个人的爱后，往往想从其他人那儿得到补偿！


    好，现在把她的内心语言翻译一下就是：“我太痛苦了，我快疯了，快来爱我！”


    听懂了她的这个内心语言就好办了。我出的主意是：亲人不要骂她，不要责难她，也不要乱给她钱。最好的办法，是妈妈待在一边，看着她发泄，等她发泄完了以后，抱着她好好哭一下，让她哭出来，大哭。


    很清楚，她知道自己在做什么，但心理上控制不了自己。而一场大哭，通过情绪的释放，说不定会改变她。


    ### 4. 一个人没人性，首先是一个家庭教育问题，父母和子女的关系问题，然后是一个心理问题，最后才可能是一个道德问题


    如果我们和一个人打交道，同时要快速地破译他的内心语言的话，那么，一个技术性的要求是：我们必须冷静。如果不冷静，我们就听不到他说什么了。


    有一个新闻故事给我留下了深刻的印象。从这个新闻故事里，我提炼出了一个原则：无论我们想对一个人干什么，必须先搞懂他！


    故事是这样的：一位在广州的外来民工子弟，有十五六岁，平时喜欢去网吧打游戏，学习也不认真，经常逃学。他妈一直对他很好，溺爱。后来，他妈得了肝癌，躺在医院。他并不去看望，就像没事一样。他父亲和记者费尽周折，最后在一间网吧里找到了他，并把他带回了出租屋。


    记者问他：“你妈妈现在病得那么厉害，你怎么不去医院看呢？”他说：“不想去。”记者又问：“你妈妈如果这样死了，你不伤心吗？”回答：“不伤心，总会有这么一天的嘛。”说的时候，他阴笑了一下。


    看到这里，我相信已经有很多人在谴责这个男孩简直没有人性了。是的，从道德上说，我们可以这样干。但是，还是先来做这件事情更好些：尝试去理解他为什么会这样没有人性，他的内心哩，到底在说什么？


    我们可以听到，当父母溺爱他时，他内心哩会有这种声音：“你们拿钱给我去网吧玩游戏，这是应该的，因为你们欠我的。”溺爱，培育了他的自私。他在心理上预设，父母应该对他好，如果做不到，就是对不起他，他有理由恨父母。


    所以，母亲得肝癌，在他眼中本身就是一个过错。对这一“过错”，他会有这样的两种心理反应：


    - 恨母亲得肝癌，心理上要报复母亲；

    - 母亲得肝癌会让自己难受，为了进行心理保护，不让自己体验到难受，就要让自己显得狠一些、没有人性一些。


    所以，当他说出“不想去”“不伤心，总会有这么一天的嘛”这些话的时候，已经快接近于内心语言的表白了。如果我们再帮他把它们表达得更清楚一点，那就是“你为什么要得肝癌？故意得肝癌让我没有钱去玩是吗，让我看着你肝癌难受是吗，所以我为什么要去看你，为什么要伤心？我恨你，你去死啊！”


    看到了吗？有时候，一个人没人性，首先是一个家庭教育问题，父母和子女的关系问题，然后是一个心理问题，最后才可能是一个道德问题！


    ### 5. 当过去成为一个人的噩梦时，要紧的是给他一个新的生活方式，和过去隔离开


    我们所说的话，既可能是说给别人听的，也可能是说给自己听的。所以，破译内心语言，也包括从一个人的言行中，看他对自已说了些什么。


    而如果我们知道，在一个人身上曾经发生过什么，大概也能知道，他会 对别人和自己说些什么。


    有一个女士联系到了我。她有一个闺蜜，和父亲相处得非常糟糕，希望我能出主意。情况是这样的。


    她朋友的父亲 A，原来是某县城建局的局长，为人比较正直，退休以后，被无辜地卷入政治斗争，成为牺牲品入狱。家人四处奔走，费了很大的劲，也花了不少钱，才把他救出来。


    而自从出了这件事以后，A 心态大变，总觉得全世界都亏欠他一个清白，对家人漠不关心，态度粗暴，一心想着平反（但现实是几乎不可能）。由于家人从救他这件事情中，也受过很大伤害，因此，在苦不堪言之际，也怪他自私，不懂得体谅家人，儿女甚至建议母亲和他离婚。


    我请这位女士再补充一下 A 的个人爱好，现在做什么。由此，继续有了这样的信息。


    A 平时的表现就是：不停地说话史，不停地看各种关于解放战争、抗战的电视电影，尤其是《亮剑》，对李云龙非常欣赏。他也不停地抨击腐败。另外，A 书法写得好，当一门艺术来做，他也能作词、写诗。


    好，我们可以知道 A 内心，对自己和别人说的是什么了。


    **第一个问题：A 很自私，不懂得体谅家人的痛苦吗？**


    回答是：没有。出狱后，他完全陷在了“正直的人被迫害”的心理情境里走不出来，眼中没有家人，只有自己和迫害他的那些人。当他发狂时，内心语言是：“我太痛苦了，我这是在反击他们，是在自我治疗！作为我的家人，你们应该体谅我，不要来惹我！”


    家人听不懂他的内心语言是可以理解的，毕竟，他们也受过伤害，也没好心情。他们的内心语言是这样的：“我们都为救你出来付出那么多了，你还这样对我们，为什么不不想想我们也很痛苦？”


    然而，在这类事情中，注定是家人要多付出一些，这是没有办法的事情。如果家人被自己的心理背景所影响，去埋怨他、干涉他，后果只能是进一步刺激他。这个时候，他的内心语言是“连你们都要来惹我”，于是，把情绪转移到了家人身上，发泄出来。


    女士问我：那就任由他发泄吗？我说，不错。而且，可以在一边默默地看着他，比如给他倒一杯水等，构成对他骂那些迫害他的人的情感支持，把他当成一个受了冤屈的丈夫、父亲来对待。


    **第二个问题：一段时间后，他停止发泄了，每天就是看电视，对家人不发一言。这意味着什么？女士问我，这是对家人的一种失望？**


    我的回答是：没有。看电视，有三方面的原因：


    - 通过发泄的自我治疗，他已经累了；

    - 企图逃避现实，和现实隔绝，以免再受那些他被迫害的情境的刺激，在心理上保护自己；

    - 通过看电视，幻想自己是一个被小人迫害的人，有英雄受难的感觉，同时电视里坏人最后被惩罚的情境，又给他莫大的快感，他这是把现实投射到了电视上，通过电视来进行自我治疗。


    他的内心语言是：“我已经快平复下来了，你看，我都不发泄了，躲进电视这个情境来疗伤了。”


    家人该做什么呢？让他静静地看，偶尔可以坐在一边陪着，不说话。


    **第三个问题：又一段时间后，他已经出去走走了，早晚都锻炼。这说明了什么？**


    他的内心语言是：“我的疗伤已经有一定效果，快走出心理阴影了，你看，我已经走出去锻炼了不是？”


    **第四个问题：让 A 真正走出心理阴影，过上正常生活，家人该怎么办？**


    我们来倾听 A 在内心里对自己和家人说了什么：“是的，我慢慢可以忘记那件事情对我的伤害，但是，鉴于过去我当过局长，我总要寻找到能够证明我过得很有价值的生活方式啊，只是出去走走，会让我感觉我没用。就是说，要有什么东西，能够替代我过去的觉得有价值的生活，让我能够忘记过去。而我爱好书法，喜欢作词写诗是不是？这也能够证明我生活的价值。”


    家人要做的，就是让他从一个曾经的城建局局长、一个被人无辜陷害的人，变成一个陶醉在书法和诗词中的老人。


    当过去成为一个人的噩梦时，要紧的是给他一个新的生活方式，和过去隔离开。


    我分析和出完主意后，女士打电话告诉了她的闺蜜，并反馈给我，A 的女儿非常后悔，以前总觉得父亲心理畸形；同时，她回忆起了那一幕，当自己写毛笔字时，父亲坐在旁边默默地看着，看得入迷。


    那一刻，我的冷静瞬间崩溃，也差点流泪。


