    ## 17. 人类的一个荒谬之处在于，当A伤害了B的心理结构时，为之埋单的，却是C


    我们可以确定：有“被迫害妄想”的人，以前肯定被人害过，尚未走出那种心理创伤。就是说，恐惧仍然在他的心理结构弥漫。


    在这里，他有了第一重心理保护，把自己留在当下，而不要被扔回当初被人害时的那种情境。那是一个绝不能回首、重温的噩梦。因此恐惧不能指向过去，不能表现为对以往某事、某物、某人的恐惧。


    然而，在这种情况下，恐惧就有向焦虑转化的危险，因为没有对象、情境让它指向，这是最让人难以忍受的，因为它意味着不能捕捉、确认，恐惧从四面八方袭来，会让一个人在心理上彻底窒息、瘫痪。


    怎么办？第二重心理保护启动：把焦虑转化为具体的、指向现实某人或某物的恐惧。就是说，他无意识地强迫自己想象、确认，是有具体的人要害他。


    于是，过去有人伤害了某一个人，把恐惧植入到了后者的心理结构，而为这个心理结构买单的，却是现在的无辜者！


    这就是“被迫害妄想”的真相。一个多么让人无奈、备觉荒谬的真相！


    我对一些人说得最多的有两个建议。第一个建议是，不要在公交车上司机吵，即使他脾气不太好，也要让他一点。毕竟，司机开车，要承受很大的心理压力，你们在心理上并不对等。出于尊重，你可以让一个年纪比你大很多的老年人，那么，出于安全和尊重，为什么你不可以让一个心理压力比你大得多的司机？


    第二个建议是，不要去惹这个社会上的弱势群体，或一个明显看上去受过一些打击的人，在他们面前趾高气扬，说话蛮横。他们已经受了很多人的气，愤怒潜藏在心理结构里没有爆发，你最好不要去成为这个炸药的引信。


    ## 18. 如果一个人走不出过去，就一定会和现在过不去


    我们还没有说完。


    你一定会觉得奇怪，为什么一个患有“被迫害妄想”的人，会觉得别人原本正常的眼神、语言、动作，好像就是有什么卑鄙罪恶的图谋呢？在恐惧尤其强烈的时候，他还会认为，要“害”他的人，是不是和原来曾经害过他的人是一伙的，他不想忘掉那些应该也不是什么好东西的人吗？


    第一个问题，如果用“敏感”来解释，就不是解释，而是没有解释的能力或偷懒。它无法告诉我们：如果不幸地碰到一个具有“被迫害妄想”的人，我们在他面前该如何说话？


    对于这个问题，正确而有效的回答是：因为，当他的心理结构里弥漫着恐惧的时候，他对和他接触的人有两种矛盾心理：既希望认为对方要害他，从而找到一个外在对象把里面的恐惧投射出去，又害怕体验到对方要害他时的那种来自外部的恐惧。这个时候，他会不会认为对方要害他，判断标准是对方的眼神、语言、姿态、动作等是否在心理上让他感到安全，感到可以控制彼此的关系。


    如果你不能让他在心理上感到安全，他会以“被迫害妄想”来在心理上保护自己。这个，有点类似于桂杨大侠的经典名言：“你不给我一个说法，我就给你一个说法。”


    所以，在和一个具有轻度或重度“被迫害妄想”的人说话时，千万小心。你如果眼神游移不定，玩诡异，玩神秘，玩不屑，表情冷漠，或和他说话有应付嫌疑，你就等着被怀疑有卑鄙的图谋吧。但同时，也绝不可以表现得和他突然之间好像很亲密，反差太大了。


    这个原则，同样适用于你和一个比较敏感、比较自卑的人打交道时——这两种人，同样有心理创伤。


    第二个问题，在恐惧比较强烈的时候，一个有“被迫害妄想”的人为什么会认为要“害”他和以前曾经害过他的人是一伙的？有两种心理保护：一是只有这样认为，他怀疑别人要害他才显得合理，否则，无端地怀疑别人，会有道德压力；另外一种，他强烈的恐惧把他似乎带回到了他最害怕返回的过去的情境，而把怀疑要害他的人看成是以前害他的人的同伙，可以预先来进行心理防御。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_43_0.png)


    我不知道你看到了没有，一个人走不出他的心理创伤，被恐惧攫住，其实也是一个可怜人啊！


    一个人的“被迫害妄想”，既是一种“症状”，同时也是对自己的一种“治疗”。他启动诸多心理保护，变成一个心理动物，是为了让自己好受一些。然而，这些心理保护，或者让他的智力结构不管用，或者只是在重复他产生恐惧的心理逻辑，无一例外地以杀伤他的智力结构、心理结构，恶化他和这个世界的关系为代价。


    我们的一个弱点，就是不敢直面过去的心理创伤，因为我们害怕再体验到恐惧、耻辱。而且，过去已经是过去，无法再防御，也无法进攻了。于是，在心理创伤的背景下，我们不敢直面过去，而是对现在产生过敏反应。


    而我们如果走不出过去，就一定会和现在过不去！


    ## 19. 有些人疏远我们，原因可能仅仅是，我们的存在会贬低他存在的价值


    我感觉我在分析时，已经有点抒情的意思了。赶快打住。


    现在，让我们先停顿 10 秒钟。我想请大家想一个问题：我们为什么会去嫉妒别人？


    ……


    好了，如果还没想清楚，请先看一下我的一个亲身经历。


    多年前，我有一次在老家的街上碰到了一位中学同学。那些年，不是什么人都一起追过女孩的；我和别人没有，和他也没有，关系很一般。中学毕业后，大家分道扬镳，据说他四处漂泊，还进过血汗工厂，混得并不怎么样。


    所以在分别多年后，当我和他重逢时，在我面前出现的，已经是一个脸上有着“屌丝”夸张表情的男人。


    我见到他很高兴，准备和他一起回忆当年旧事，展望美好人生。然而，他的反应非常冷淡，语言攻击性十足：“你们混得不错吧？但我呢？那么惨！”


    他用的词是“你们”，暗示两个人已经处于不同的世界。


    赫拉克利特说，人不能两次踏进同一条河流。看来，两个已经不同的人，也不能再踏进同一条河流。


    一不小心就中枪了，他的意思我懂：羡慕嫉妒恨。尽管我真的是完全无辜的，但只要他认为我混得比他好，我的存在本身对于他来说，就已经是一种刺激，一种心理上的威胁，他必须用攻击性的语言在心理上保护自己。


    我一时语塞。但还是知道，最正确的反应方式，就是赶快猛贬自己，把自己描述得失败无比，非常凄惨，同时，给他一个真诚的、无辜的笑容。


    在这个世界上，有些人会莫名其妙地疏远我们，原因仅仅是，我们的存在，在对比中会贬低他存在的价值，让他看到他现在不能接受的自己，或者我们的存在，他已经不想去担忧、关注。


    前一种人，是曾经和我们属于同一个群体（同学、战友等），但没有多少友情可言的人；后一种人，则是那些对我们寄予过希望，但和我们并不是一条道的人。


    有一点他们是共同的：疏远我们都不是“无缘无故”，都是要对自己进行心理保护——避免受到刺激，或涌上失望的情绪，因为我们不是按照他们的意思来存在的。我们对此感到“莫名其妙”，唯一的解释是对他们为什么会这样并不了解，而且在心理上阻止自己去了解。


    ## 20. 别随便用“有病”这类词评价让你不解的人


    伟大领袖毛主席教导我们：世上没有无缘无故的爱，也没有无缘无故的恨。事实上，就一个人的心理来说，从来就没有“无缘无故”这个概念，一个人看起来不能理解的语言、行为，在心理上是完全可以理解的。


    所以，在人际关系中，当你觉得一个人“莫名其妙”地对你做出什么时，请先阻止自己说出“有病”这类词语！就算你阻止不了自己，接下来也应该冷静地分析、洞察他——“为什么这样”。


    换言之，你要做的，不是用一句话把他的行为描述成一种道德现象、神经病现象，而是破解他行为的心理动机，因为在你面前出现的，并不是一个道德家，不是一个神经病，而是一个人，一个心理结构！


    ## 21. 对表象的描述无法替代对真相的洞察


    有一个在事业单位工作的女生不堪女同事的骚扰，向我求助。这个同事当面一套，背后一套，在她面前扮演好人，而在背后却使劲说她的坏话。


    女生告诉我，她几次想发火，当面教训这位“无耻的小人”，但面对凑上来的一张“笑脸”下不了手。她因此非常郁闷，感觉自己被人欺侮而如此懦弱，总是担心这个女同事说自己的坏话，会让自己在单位被孤立。


    我问她：“她工作能力没有你强，没靠山，和你也没个人恩怨吧？”


    女生惊讶了一下：“啊？我没想到啊。我只感觉她心理有病！”


    她心理当然有病！然而，这不是问题的全部真相。其余的，也是最重要的真相是：这个女生被人家嫉恨了。


    我很遗憾，女生的反应，表明她只具有用语言来描述别人的行为表象的能力。


    我们的所谓感觉、所谓认为，更多时候其实只是一种描述，不是一种洞察！但我们往往以为这就是我们对一个人的洞察，说他是一个什么什么样的人。


    这里的思维定势是：从一个人的语言、行为表现，我们往往就会说他是一个什么样的人，以为这就是我们对此个人的了解或判断。


    是吧？


    然而，我们完全忘记了，当我们这样做时，其实只是对他的语言和行为进行了外在的描述，并不是对内在真相的描述。因为我们并没有对他表现出这些言行的心理结构进行洞察，从中找出真相！


    ## 22. 在博弈时，如果你用心理，而对方用大脑，那你就等着被屠杀吧


    所以，如果是在博弈中，请把“感觉”“认为”之类会阻止你变得敏锐的词语扔掉！


    在博弈中，假定博弈方是 A 和 B。那么，有几种博弈格局：


    当 A 投入的是头脑，而 B 只是心理时，B 不失败的可能性非常微弱；当 A、B 投入的同时是头脑，或者心理时，结果如何取决于谁先发明人，谁在头脑上、心理上更强大，以及背后的实力；而当
    A 投入的是心理，B 投入的是头脑时，那么，除非有奇迹发生，要不然，A 就等着被人在心理上、利益上屠杀吧。


    如果是你的亲人或朋友“莫名其妙”地要求你什么，或对你做出了什么呢？


    假如你的反应只是“莫名其妙”“很怪”“没病吧”之类，那么，我替你的亲人和朋友感到遗憾。


    因为你的反应，事实上已经向你和他表明：你骨子里缺乏理解、关心他的意愿和能力，即爱的能力。你和他的关系，从你这一方来说，更多的只是一种生物学和社会学的关系，你只是以头脑、心理、行为去回应他，而非进入他的内心。


    更遗憾的是，你不知道这一点，虽然，很幸运，他在失望的情绪反应中，也不知道或不愿去知道这一点。


    但幸运是不能长期维持一种关系的！


    ## 23. 很多人的潜能，都以一种杀伤自己心理结构的方式浪费掉了


    绕了一下，可以解密嫉妒在心理上是什么意思了。


    在很多情境里，嫉妒就是我们在心里面看不起自己，不满意的现状，但是，绝不允许自己意识到——因此，要把心理的能量，投射到一个出现在我们面前、刺激到了我们、让我们看不起自己的人身上！


    简单地说，嫉妒就是我们一种隐秘的心理保护。它的普通表现，是不爽、诋毁、攻击他人，借此获得心理平衡；极端表现，则是把自己的失败算到别人头上，通过毁灭别人这个“刺激源”，来在心理上求生。


    为什么说一个人嫉妒别人没有出息？因为在心理保护的驱动下，他应该用来改变自己、提高自己的心理能量，以一种杀伤自己心理结构的方式浪费掉了。


    我们中的大部分人，把很多时间和精力浪费在应付盲目而神秘的心理上，陷在它的牢笼中，无力挣脱，或不想挣脱，甚至干一些无聊的、痛苦的事情，就是为了能够在心理上求生。如果把自己“释放”出来，会让一个人做出多大的成就，会让一个人获得多大的幸福？


    ## 24. 心理保护像幽灵一样无时不在，盲目、强大而无边无际


    我想说，无论是当“小三”报复父亲，装失败后使劲辩解，玩孤僻，用“洗手癖”摆脱恐惧，还是嫉妒、自恋、攻击别人，否认某件事情，逃避，别人骂了我们的偶像就不爽，等等，都是在进行心理保护。心理保护像幽灵一样无时不在，盲目、强大而无边无际。


    但在这里要强调一下：不是所有的心理活动，都是在玩心理保护。我不喜欢玩夸张这一文学修辞手法。


    心理保护是在你的心理生存受到威胁的时候才启动，其他情况就不是了。比如，你爱一个人，当然不是心理保护啦！


    # 第三章 内心深处


    ## 1. 我们的存在，就是和自己、他人、世界的对话


    我们扛着一个心理结构，事实上就是扛着性格、心理倾向、情结、情感、情绪等一大堆东西在生活，在和世界打交道。


    那么，心理保护这个暴君，在我们的内心里，到底是怎么启动一系列心理规律，让我们说了某种话，做了某种事，有了某种情感、情绪，或变成了某种人的呢？


    我想，已经到了把“心理结构”和“人”之间的秘密揭开的时候了。让我们走进内心的深处。


    在表达的时候，我取用了一种古老的方式，那就是对话，它是哲学的最初传统。


    我们的存在，其实也是和自己、他人、世界的对话。


    ## 2. 了解了一个人是什么样的人，就可以知道他会说什么、做什么，反过来也一样


    有一个职场白领，某一天对我来了一个困惑的表情，这是有话要说的另类开场白。


    果然，她问了我一个问题：“怎么会从一个人所说的话、他的行为，就可以看到他的内心呢？心理分析是不是很神秘，有点难学？”


    我很严肃：“你想学吗？”


    她说：“想啊！我希望让自己内心变得很强大，我要武装自己！”


    我微微一笑：“那就不神秘，也很简单。你做过小学数学应用题，或解过初中几问题吧？也学过初中物理？那，是否还记得‘公理’‘定理’之类的？对一个题给了你什么已知条件，然后叫你计算什么或求解什么，可还有印象？”


    她说：“记得啊！”


    我说：“道理一样嘛。比如，一个人要在心理上求生，要对自己进行心理保护，就是心理问题的‘公理’；很多心理规律，就是‘定理’；一个人说了什么话、玩了什么动作，就是‘已知条件’；看到他的心理动机，他是


    什么样的人，就是 ‘求解’。"


    “反过来也一样。”我继续说，“如果你了解了一个人是什么样子的人，即他的性格，他的心理倾向，还有他的心理动机，那么，你基本可以知道他 会说什么、会做什么。”


    她急了，脱口而出：‘可是我觉得一团乱麻啊，好像没有一个完整、清 晰的概念，理不清头绪！''"


    ## 3. 当我们生气的时候，意思就是‘生气是用来帮你干什么的？''


    “别急，”我知道她困惑何在，“给自己一点耐心。"


    我问她：‘我们是带着一个心理结构出现在这个世界上的，要在心理上 生活，对吧？''


    “是的。"


    ‘那么，我们在心理上，是不是和别人有联系啊？比如，你业绩做得好， 上司表扬你，你就高兴。但别人嫉妒你，你就不舒服。对吧？''


    “对啊！"


    ‘那么，你是什么性格，知道吧？''


    “按照您的性格分析理论，我应该是自卑型＋占有型吧。"


    ‘好。请回答我：知道一个人的性格，是不是完全了解了他？''


    ‘没有。除了性格，还有情绪呢，还有他怎么想的呢。''


    ‘对了！性格是我们在心理结构上和世界最深层的联系。就是说，它位 于我们心理结构最深的地方，在这个地方，除了性格，还有其他各种遗传的 东西，像心理分析大师荣格所讲的
    ‘集体无意识’ 都是在这里面。''


    我继续说：‘但是记住，性格指的是心理保护的一种功能，一种让 你做这样、做那样的最强大的动力。情绪之类也是指功能，比如当你生气 的时候，意思就是 ‘生气是用来帮你干什么的’。正因为性格位于我们心
    理结构最深的地方，最难改变，力量也最强大，所以就有了 ‘性格决定命 运 ’ 的说法。''


    ## 4. 当我们的典型性格让自己吃亏时，请发展出另一种性格来弱化它


    “有人说‘性格结构’，有人说‘心理结构’，您也在说。它们到底是什么关系？”


    “不要把‘性格结构’理解成和‘心理结构’并列的东西。‘性格结构’是位于‘心理结构’里面的。之所以说‘性格结构’，是因为一个人不止一种单纯的性格类型，比如你，就是自卑型＋占有型，它们糅在一起，就有了‘结构’。”


    “我懂了。”她若有所思的样子，“那心理结构除了性格、遗传的东西，还有什么呢？”


