    比如，某个人经过人生的重大挫折，在一个阴雨绵绵的下午，走在大街上，看着街上行色匆匆的人群，突然领悟出“别人关心的，只是你的成功，而不是你，因为你的成功对他们在心理上很重要，而你是谁对他们来说毫无意义”之类的道理。这个时候，他内心的激动难以形容，甚至会有脱胎换骨的喜悦。


    同样，一个高僧在“开悟”的时候，也伴随着心里的狂喜体验。


    如果一个人心里非常淡然、平静，也就是说，他的心理结构根本就没有动作，就想把头脑里关于一个道理的认知，转变成他存在的一部分，让他得到改变，就做梦吧！'
