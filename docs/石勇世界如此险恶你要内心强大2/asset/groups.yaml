    1. 被训练用语言文字装，一个人只会人格分裂


    1968 年 5 月，法国大学生在巴黎街头举起了造反的义旗。他们嘴巴里念着一个人的名字。


    这个人就是美国哲学家马尔库塞同志。当时，他和另外两位 M 同志——马克思同志和毛泽东同志——一起被称为 “3M”（每个人名字的第二个英文字母都是 M），是革命群众心中的精神偶像。


    他最著名的理论，就是揭示社会有一套对人进行洗脑的机制，一个人一不小心，就会被洗成 “单向度的人”。所谓 “单向度的人”，通俗地讲，就是 “脑残粉” “一根筋”。


    法国大学生们对老马的理论进行了总结，喊出了这样的口号： “托老师和考试的福，六岁就开始与人竞争” “社会是一株食人花”。


    看到法国大学生这样，我不禁唏嘘慨叹。社会是一株食人花，这不是很夸张，但六岁就开始与人竞争算什么？在今天的中国，竞争已经从精子开始了。


    但是，还是要佩服一下法国大学生，他们确实厉害，能够把哲学家的思想变得如此浅显易懂，而且以人民群众也喜闻乐见的口号喊出来。


    这不奇怪。法国学生在高中毕业会考时就考哲学了，一直到现在都是一个传统，出的往往是 “人们是否可以摆脱偏见” “语言是否会背离思维” “文化是否让人扭曲” 等问题。


    很有意思的是，法国 2012 年高考哲学题目在微博上引起了热议。像 “所有的信仰都是与理性相悖的吗” “我们是否有追求真理的义务” “没有国家我们是否会更自由”，仅仅从问题上看，中国人的思维，就比人家差了一大截。


    出这些问题，你回答 “YES” 或者 “NO” 都不重要，重要的是，你是否理解了你正在思考的是什么问题，用我们的话来说就是你要 “澄清” 它，而且为你的判断给出理由。这是在检测一个人的分析能力、思辨能力，让他在理性上得到成长。与之相比，我们总摆脱不了抒情和空发议论的高考作文实在太小儿科了——这只是训练一个人如何用文字来装而已！


    我想说，越是在成长过程中被训练用语言文字来装，缺乏分析能力、思'
