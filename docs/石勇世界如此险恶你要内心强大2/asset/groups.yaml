    # **7. 心理保护是打开我们心理秘密的钥匙**


    前面我说到了一点理论。理论总是让人觉得枯燥的，并不好玩。我深深

    地知道，在这个每个人都感觉很累的时代，不能用理论让人更累，正如叶挺

    将军深深地知道，人的身躯不能从狗洞里爬出！'
  - '[PAGE 34]


    但为什么还是要说？因为没有理论的支撑，我们对很多东西自以为清楚，但其实并不清楚，它们缺乏广度和深度。在很多时候，我们还是需要深刻一些的，不要那么浅薄。


    而理论绝不是要让我们脱离生活，恰恰相反，它是让我们在地面上看不清楚时，先用它飞上天空，看清楚下面的一切后，再回到地面上，那感觉就完全不一样了。


    正是如此，我就算讲到了理论，也会尽力让它通俗易懂。理论是用来让读者取得一个制高点，看清这个世界真相的，不是作者用来玩深沉的！


    心理结构里面，有哪些东西来保护我们，让我们在心里上求生呢？有性格，有人类祖先遗传下来的各种无意识的心理内容，有心理倾向，有情结，有情感、情绪，等等。它们驱动了一系列的心理规律，让我们玩出各种花样，在心理上保护自己。我把它们干的这件革命工作，称为“心理保护”。


    注意了，“心理保护”这个概念太重要了，它是打开我们心理秘密的钥匙。在后面你就会看到，你用这把钥匙一扭，一个人心理的密室就开了。


    如果说在《世界如此险恶，你要内心强大》里，我认为最重要的一把钥匙是“社会价值排序”，用它 可以译释我们自卑、弱小的秘密的话。那么，在本书，最重要的一把钥匙，就是“心理保护”了。


    前面那位和我碰撞的仁兄，当他发怒的时候，其实就是对自己进行心理保护。


    “激将法”就是利用心理保护的原理玩的。故意激怒一个人，就是激起他的心理保护，让他陷入心理动物状态，从而方便打击他、利用他、控制他。


