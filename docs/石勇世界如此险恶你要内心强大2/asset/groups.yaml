    # Part III


    经过翻译被人转贴到了一个网络论坛。


    各色人等登场表演了，在主帖之后，出现了下面的跟帖。


    由于太多了，我只举出三个来进行分析。


    - ID chuanhong：真看不出诚意。

    - ID 挑粪工：时间，1910 年；地点，奉天开往京城的蒸汽火车上；人物，俄国洋大人，我大清子民；事件，俄国洋大人用脚掌调戏我大清妇女。

    - ID “曲新词”：这个愚昧野蛮的民族，就是喜欢窝里斗，境外人士稍微招惹他们，就群起而攻之，只是维护他们那点可怜的民族自尊心。


    先来看一下，“chuanhong”这句话暴露出了什么没有？


    什么也没有暴露，那只是他对维捷尔尼科夫道歉是否真诚的一个判断——它仅仅代表了某个人对某件事情的一个判断，这个判断没有携带人格、心理的内容。如同他说“这个道歉太有诚意了”也一样。


    “挑粪工”呢？那就不是这样了。人格、心理的内容被他的话携带着展示了出来。


    他把这个事件，类比于清末时中国人被欺负时的情境对不对？他似乎觉得，自己很会玩幽默，且还讽刺了当今中国政府和中国人一把。我们甚至能够想象，当他在电脑上敲出这一排字时，一定陶醉在自己天才的讥诮之中。


    然而看上去很不对劲！按理，当一个中国女人在中国的土地上，被一个粗野无礼的外国男人欺侮时，他应该谴责和愤怒才对啊。但他毫无痛感，缺乏正常的反应。


    这说明了什么？说明：在心理上和意识上，他并不关心一个弱者的痛苦，也不关心一个强者的嚣张，对“中国女人在中国土地上被欺负”更没有耻辱感。这个事情，仅仅是他可以用来表现自己的幽默，用来讽刺政府和中国人一个道具。


    是什么可以让一个人这样呢？


    被迫害感！


    这位“挑粪工”，显然因为他的利益、他的价值观、他的人格，在他所处的环境，以及大环境“中国社会”，受到了一定压抑，其精神结构被破坏。


    因此心生怨恨，心理上的报复对象，指向了抽象的体制、权力、国家、社会。这是当今中国非常普遍的一种社会病理现象，也是公知们的群众基础。


    说这位“挑粪工”有被迫害感，并不是说他受到了多大的“迫害”，而是因为他的利益诉求，他的自我感觉良好，在怨恨中变成了一个心理问题，必须通过在心理上嘲讽、攻击抽象的体制、权力、国家之类，才能得到治疗。


    这种人是底层的穷人吗？绝对不是。穷人当然也会有被迫害感，但他们会直接开骂，而不会玩什么幽默、讽刺，因为他们本身就不是自我感觉良好。在维捷尔尼科夫欺侮中国女人这件事上，他们还不会失去正常的人性反应。


    那么，是官员富人之类的人吗？更不可能！这些人可能有恐惧感，但不会有怨恨，并通过幽默的讽刺表现出来。


    很清楚，“挑粪工”只可能是比较关心政治的中产、小资、生意人、大学生这类人。


    但“挑粪工”还不仅仅有这些特征。玩讥诮、讽刺、自我感觉良好，所有这些，都在说明他是一个自私的市侩。这种人一方面对社会价值排序比他高，可以压抑或剥夺他的一切充满怨恨，但另一方面，则又对底层民众充满傲慢和鄙夷。


    请相信我，如果你在现实生活中碰到这种人，第一时间可以判断出：他骨子里不信任何人，没有什么底线，在利益面前，他会比谁都要下作。


    那个挂着一件“曲新词”马甲的人呢？从他的语言上看，和那位“挑粪工”算是一类人，但走得更远，他把对抽象的体制、权力、国家、民族、社会的怨恨，以及对底层民众的市侩式蔑视推向极端。


    我不知道你看到他的语言有何感想，但我希望，你能够感觉到那是一种神经病的语言。


    这种语言唯一的功能，就是告诉大家他是什么人。


    我们注意到，“挑粪工”只是为找到了一个可以发泄怨恨和体验到自己聪明的事件而沾沾自喜，但并没有否认、颠倒事实，但这位“曲新词”这样干了。


    那么这句话告诉了我们什么？它首先告诉我们：披着一件马甲躲在电脑后面的那个实体，没有起码的道德判断能力和是非观念。他怨恨、鄙视这个“野蛮民族”，觉得自己在这个“野蛮民族”面前有智力和道德上的优越感。


    他是什么人呢？


    我想问一下，当一个人说别人是“穷鬼”时，你可以知道他是什麼人吗？


    他一定是红薯屎都没刷完几天的暴发户，或缺乏教养但有一点小钱的小市民！说别人是“穷鬼”，从语言和心里的关系上说，表明一个人害怕和以前贫穷的自己，以及贫穷的人们在心理上扯上什么关系，而这暴露他极端屈服于社会价值排序，刚脱贫不久，或根本不富。


    说“野蛮民族”也一样。当一个人这样说，表明他潜意识里希望把自己看成是“文明人”，而如果他在说“野蛮民族”时充满鄙视，可以判断，他骨子里希望把自己体验成一个比“野蛮”“愚昧”的民众高档得多的“精英”。


    这类人的被迫害感远甚于“挑粪工”这种人，因为这种奇妙的感觉，具有了另一个心理功能，那就是治疗他的无能。有了被迫害感，他才能合理地在心理上蔑视、攻击抽象的“野蛮民族”之类。而合理地蔑视、攻击“野蛮民族”之类，他才能体验到自己是一个具有智力和道德上的优越感的“精英”。


    就是说，他很需要被迫害感！


    在这个世界上，有很多人，他们对自己的心理问题的治疗方式，就是扮演某个角色，比如，有人扮演一个专门偷女人内裤的小偷，有人扮演一个收留流浪狗的爱（原文“爱”）心人士，当然，像这位“曲新词”（原文如此）一样，也有人要扮演“精英”。


    ## 13. 要成功地对一个人催眠，有时一句话就够了


    几千年来，人类社会流传着一个“谎言重复一千遍即变成真理”的传说。传说是真的。如果一个人不断地、有气势地重复同一句谎言，那么，他就捏住了人类心理的两个巨大软肋。


    第一个软肋我在前面已经讲了，就是对他相信什么、不相信什么，没有真正的确信，因此需要一个头脑之外的理由。


    第二个软肋，就是奴性。不断重复有气势的语言，暗示背后有强大的力量支撑，无论是“历史规律”、人多势众，还是属于真理的声音，都能很快把一个人弱小（原文如此）而充满焦虑，不知往哪一方投靠的自我震慑住。这样一句话，成为他在心理上治疗自己弱小的药方。


    但是，谎言都要重复一千遍才能对人催眠，技术难度也太高了点。事实上，在很多时候，要成功地对一个人催眠，一句话就够了。我们很多人，平时并不栽在别人不断重复的谎言上，而恰恰是栽在被别人一句话催眠上！


    我说的并不夸张。


    让我们想象这样的一个情境：假如你有一个关系一般的同事A，某一天，对你说另一个关系同样也一般的同事B的坏话，说B“一肚子坏水，防着他点”，接下来会发生什么？


    你感受到这句话的杀伤力了吗？


    不用怀疑，A已经成功地对你进行了催眠。无论此前你对B是什么印象、看法；此时，A的话已经强势地进入了你的智力结构，“B一肚子坏水”作为一个“事实”，你已经记住了！它马上成为你和B打交道的认知和心理背景，就是说，B在你面前，因A的一句话，已变成了另一个人。


    这简直太可怕了。那么，A是如何能够对你做到这一点的？


    答案在这里：这句话非常简短，没有解释，没有论证。恰恰就是这样，它给了你一个意识不到的错觉，即它是A深思熟虑或经验观察的结果！这句话，只是A对B所思考的、所经验的，进行了简单精炼的总结而已！


    而之所以能够这样，是就语言的表达而已，在逻辑上预设了有些话，要让我们信服，是可以不说出个所以然的，因为它正是“所以然”推论的结果，而不是先有它这样一个观点，才用“所以然”来论证其成立。


    我们在心理上完全接受了这个逻辑预设，即心理也预设是可以这样干的。所以，当这句话进入你的头脑时，你在心理上也把它合理化了。就是说，你被催眠了。


    一个玩语言催眠的高手，通常的做法是只说一句，即使你没有完全被催眠，他的话也显得高深莫测，吊起你半信半疑的胃口。最愚蠢的做法，是滔滔不绝地说半天某个人坏，但就是无法说出别人到底坏在哪儿。如果是这样，他只会让人怀疑是不是要搬弄是非。


    我们如何避免被人催眠呢？我提出的建议是，当有人在你面前说另一个人的坏话，而且像 A 那样只玩一句时，你不动声色，只是微笑地看着他“嗯”一下，看他接下来的反应。


    “嗯”一下意味着什么？意味着你给了他一个“你应该说下去，要不然我怎么相信你”的压力！


    这样，主动权就完全抓在了我们手里，我们可以判断，到底是别人坏，还是说别人坏话的人不怀好意，或者别人真是好心提醒我们。


    还是以 A 对你说 B 的坏话为例，有几种情况。


    一种是 A 本来就是一个心理阴暗的人，就想诋毁 B，让 B 不好过，煽动你对 B 产生恶感或排斥。当你“嗯”一下时，在压力之下，他不得不绘声绘色地补充说 B
    如何如何坏。这样的活，他就上你的套了，你引蛇出洞成功。你基本上可以通过他说 B 如何如何，来判断他为什么要在你面前说 B 的坏话，想达成什么目的。


    第二种情况，A 是一个喜欢关心别人，讨厌小人、恶人的人，怕 B 伤害你，先提醒你一下。


    这个时候他会有何表现呢？


    基本会这样：他严肃而真诚地看着你，举一个 B 坏的例子。


    还有一种情况，A 没有再说下去，而是难堪地诡异一笑，挺不好意思的。这种情况，你也应该诡异地看着他哈哈一笑，彼此心照不宣。


    他难堪而诡异的一笑是忽悠不了你，被你看穿心思后的反应，而你的诡异一笑，则传递给了他一个信息：“我知道你想干什么，但在我面前最好别这样玩。”


    # 第十三章

    心理逻辑


    ## 1. 懂一种东西和会一种东西，其实是两个概念


    当讲到心理逻辑的时候，我要温馨提示一下：请给自己一点耐心。


    因为我讲到了我的独家心理分析最核心、技术性最强的东西。不夸张地说，如果学会梳理心理逻辑，那是一个绝杀技。


    我们都知道，练一门武功，和会玩几招花拳绣腿有本质区别。这种区别，恐怕和蚯蚓与黄鳝、黄鳝与蛇、蛇与龙的区别差不多。


    很简单，真正的功夫是用来防身和攻击的，技术性相当强。你不要看玩功夫的人手一舞一舞，脚也一踢一踢的，这么做并不是为了好看（当然它也可以玩得看上去很美），而是知道自己和别人有哪些漏洞必须防守，可以进攻。他不去玩那些华而不实的招式。


    李小龙玩的“截拳道”就非常讲究这一点。在《精武英雄》这部电影里，陈真陈英雄也说“搏击之道就在于击倒对方”。


    对于花拳绣腿来说，那就不懂这些东东了，它就是用来表演和娱乐的，因此追求的就是好看。


    所以，有时候，懂一种东西和会一种东西，其实是两个概念。《天龙八部》里的王语嫣同学就是一个懂一种东西，但并不会这种东西的人。她看过很多武功典籍，别人要玩什么武功招式，她都知道，但是她不会武功！


    ## 2. 用逻辑无法解释清楚的事情，总可以在心理上说清楚


    我们碰到的第一个问题是：什么是心理逻辑？


    先想一下，在这个世界上，有很多人的言行，其反常、奇异、疯狂，是“不可理喻”“无法想象”的对不对？也就是说，它们用理性的逻辑和常理，根本就解释不清楚。


    比如，一个人喜欢去偷女人的内裤，一个疯子突然跳起来拿刀在大街上砍人，一个人看到另一个人就会本能地厌恶，用逻辑都无法理解。


    那什么可以理解？回答是：心理逻辑。我想说，在这个世界上，用逻辑无法解释清楚的事情，总可以在心理上说清楚。


    因为，这些言行，是受心理驱动的，它们自有一套逻辑。


    对“心理逻辑”名词解释一下就是：一种心理行为，或一种心理症状，从在内心里的发生，到表现出来的整个有规律的过程。梳理心理逻辑，就是看透这个过程。


    当我们做到这一点时，就相当于看到了：


    - a. 一个人在内心里到底是怎么想的；

    - b. 他的那些行为，在内心里经过了什么样的程序，又是怎么表现出来的；

    - c. 他的心理问题，到底是怎么来的，经过了怎样的演变。


    ## 3. 心理分析讲究的，主要就是心理逻辑


    和我们人类有关的世界，大致有三个大领域：自然、社会和心灵。


    对于自然、社会现象来说，我们是用一系列自然科学和社会科学（还有哲学）来对付的，比如物理学、化学、哲学、社会学、经济学，等等。它们有一个共同的特征，那就是必须讲究逻辑。因为，不讲逻辑，你都思维混乱了，还想干什么，又能干什么？还想探知自然、社会现象的规律？


    值得一说的是，甚至本属心灵领域的宗教，为了增强吸引力，也用逻辑来武装自己，比如，在西方的中世纪，很多教士就做起了宗教哲学家，不再说“上帝就是存在的”，而是论证上帝的存在，虽然论证是否成功是另一回事。


    但是，碰到人类的心灵领域，逻辑就玩不下去了。有效的是心理逻辑。我们的心理分析讲究的主要就是心理逻辑。


    ## 4. 一个人的心理背景越活跃，他越不理性


    心理逻辑是怎么运作的呢？


    有两种情况，我分别把它们的运作过程，画成一个逻辑图示。


    在一个人的心理生存没有受到威胁，保持着理性的情况下：


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_211_0.png)


    解释一下就是：在我们带着一个心理背景和别人打交道时，别人如果对我们说了什么、做了什么，或者，我们的内心欲望被激发了，那么，我们的心理结构就被刺激，导致了某种心理反应，由于我们的智力结构可以控制它，于是，最后出现的，便是某些理性的言行，它们回应了别人对我们的刺激，以及我们内心被激发的欲望。


    比如，你在大街上看到了一个美女，有占有的冲动，但你知道你想占有她是不可能的，于是，在心里阴笑一下，开始装，走开。这就是你的内心欲望被她激起，冲击到了你的心理结构后，在智力结构控制下心理逻辑的运作过程。


    当一个人保持理性时，他的心理逻辑的运作有一个特点：受到智力结构的影响或支配，而不是盲目地被外界和内心欲望所操纵。


    由于在理性的情况下，心理逻辑的运作较为简单，你只要像前面我们所讲的一样学会看穿一个人的心理动机，学会澄清他的言行，就已经够用了，在这里我就不分析了。


    在一个人的心理生存受到威胁，使他沦为心理动物的情况下：


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_211_1.png)


    解释一下就是：当我们带着一个心理背景，出现在任何一个情境中时，或者别人所说的话、所玩的动作，或者我们的内心欲望被激起，冲击到了我们的心理结构，使我们的心理生存受到威胁。这个时候，我们的智力结构已经不管用，心理保护启动，并以外在的言行表现出来。


    它的特点是：我们盲目地受心理规律的支配，心理保护主宰了我们对外在刺激和内心欲望的反应。


    比如，一个人在单位无端地被上司批评，心里面正不爽时，下班回来在街上，恰好又有一个人踩了他脚后跟，而且还不道歉，态度恶劣，他就有可能发火。被上司骂已经够让他郁闷了，居然还有人再惹他，他会有一种“我TM怎么那么倒霉，那么好欺负”的内心语言。这个时候，他的心理逻辑运作，但智力结构不起作用。


    当我们带着一个心理背景和别人打交道时，这个心理背景越活跃，我们越不理性。


    ## 5. 我们不仅仅应该看到一个人的行为在心理上是什么意思，也应该看到，在此之前，他在心理上发生了什么


    下面，开始进行技术分析了，还是从最简单的开始吧。


    我们梳理心理逻辑的第一个运用：破译一个人的心理演变过程，看到他的行为，是怎么被召唤出来的。


    我想说，我们不仅仅应该看到一个人的行为在心理上是什么意思，也应该看到，在此之前，他在心理上发生了什么。


    来看这样一个故事。


    某年某月某日，男A在地铁偶遇女B，搭讪成功。继而，在网上开始猛烈的攻势，装，女的也装。摊牌要追，男A搞不定女B，便恶语相向。


    但女B也不是省油的灯，一怒之下，把他们的聊天内容和手机短信公布到了微博上，供网络哄客和骂客参观、起哄、谩骂。男A大惧，赶快道歉……女B不留情。于是，男A刀捅女B，所幸只是划了一下，无大碍。


    显然，即使是不懂心理分析的人，要搞懂男A为何要刀捅女B，也是一件很容易的事情。


    但我们还是来梳理一下他的心理逻辑。注意了，下面我用箭头，把心理逻辑的运作过程完整地勾勒出来。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_213_0.png)


    ## 6. 如果我们知道某种希望的结果就是失望，那么，我们就会说服自己不要抱希望


    我们梳理心理逻辑的第二个运用，相对要复杂一些。因为我们要破译的是：一个人成了某种人，在心理上究竟是如何发生的呢？


    这个运用太重要了。因为从小开始，我们就不断地被某些事情所改变，我们必须知道自己为什么变成了某种人，以及如何阻止自己。


    下面是一个官二代女公务员的故事。


    她表面上是个单纯孩子气有点内向的乖乖女，但事实上极善于伪装。


    在小的时候，父母经常吵架，而她在冷眼旁观，暗带嘲讽。


    她母亲是个游戏人生的人，但父亲很好面子，且道德感强，做事有条理、有分寸。由于和母亲关系不和睦，她父亲便把精力都转到了工作和对她的期待上。


    于是，她出现了这样的情况：


    - a. 在小的时候，有一次，她和朋友说话，朋友没有理她，她没有继续说，而是趁朋友不注意，把朋友的钥匙拿走了，以作为对他的惩罚。还有一次，和舅舅一起走在回家的路上时，她说的话没有得到舅舅的回应，于是气愤地回家把门反锁，不管舅舅怎么敲门都不开，还挑衅地隔着窗户看着他。

    - b. 在父亲的耳提面命下，她从小努力要做一个优等生，但在面临高考时，因压力过大，她发现在心理上无法坚持下去，于是，开始自暴自弃，情绪崩溃。这个挫折对她的影响很大，以至于在心态上、穿着打扮上、交友上都失去了改变自己的勇气。

    - c. 在一所并不好的大学毕业后，她进入体制内，虽然是官二代，但心理上还是小绵羊。有一个很会玩人际关系的同事，当面嘲讽过因她的“身份”所给他带来的不平等待遇。她忍不住想接近他，暗中观察他的做事方法。而他也乐于交她这样一个官二代朋友。于是，在和同事表面上和谐相处了一段时间后，她非常想找一个机会狠狠地攻击他一次。


    好，看完故事后，我们来梳理心理逻辑。


    第一种表现：父母吵架时，她在一旁冷眼旁观，暗带嘲讽。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_215_0.png)


    第二种表现：谁得罪了她，她就会想着去攻击谁、惩罚谁。


    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_215_1.png)


    第三种表现：面临高考时在心理上无法坚持下去，这个挫折，使她后来在心态度上、衣着打扮上、交友上都失去了改变自己的勇气，成了一个没有自信心的人。


    由于不能从母亲那儿得到爱，她怕从父亲那里也得不到爱，这是她的心理背景 1


    父亲期待她成为一个和母亲不一样的有出息的人。她知道父亲对自己这样期待。她的心理背景 2


    她强迫自己符合父亲的期待，因此扮演了一个“很乖但值得按主流价值观去奋斗的人”的角色。主要观众，是父亲，也包括她自己


    在高考前，她的演出一直很成功。但由于是害怕得不到爱，而非兴起来扮演这个角色，她活在一种心理不平常的状态中，靠加油打气来支撑，因此，在巨大的压力下，高考前，她崩溃了


    她在心里知道：自己只是在强迫自己扮演一个角色，内心实际上缺乏力量，并不自信。她无法再骗过自己。而意识到这点，她失去了继续扮演这个角色的力量


    这件事产生这样的心理后果：她意识到自己的弱小，知道强迫自己来显得自信不过是一种自我欺骗，因此在心态上，衣着打扮和交友上，都失去了勇气


    我不知道你看到没有，这位官二代同学，实际是一个善良的、有基本是非观的人。这一点，到现在都没有沦陷，否则她的心理会扭曲得很难看。


    她在网上找到了我，我的分析，她回答说非常精准，希望我能出出主意帮她改变。


    我的主意是：她缺乏一个目标，一个把自己的善良升华的目标，比如，大可以在和人民群众打交道时，尊重他们、为他们奔走呐喊。这样，她在心理上就慢慢改变了和别人、世界的关系，也会改变自己。


    ## 7. 一个所谓的“正常人”看起来不正常的行为，是大有深意的


    以上对心理逻辑的梳理，针对的情境，都不是短时间内在一个空间里发生的，更适用于我们的自我分析，以及对一个人的心理演变、他是什么人的破译。

