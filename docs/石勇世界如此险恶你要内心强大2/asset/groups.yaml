    # 如果我们要站稳的话，

    请从理性开始


    多年来，我目睹过太多人的心理痛苦，接触过很多心理上已经扭曲、变态的人。我还知道有很多人发疯、自杀。


    唏嘘感慨之余，我曾经问过自己一个奇怪的问题：为什么我还挺正常的？我何德何能？


    答案是：我懂心理分析。


    情况是这样：当各种打击、伤害来的时候，心理分析就像头脑和心理上的一把防身利器，可以保护我；但我并不是在喜玛拉雅山修行，当然不可能百毒不侵，多少还是会有一些心理问题，这个时候，我就可以用心理分析来澄清它、让它消散，而不是恶化成折磨我、让我心理扭曲或痛不欲生的症状。


    但心理分析可以干的事情，当然不只是保护自己，而是可以改变自己。


    我们有时会犯下愚蠢的错误，有的人事后能够意识到，但早已付出了很大代价；有的人对此始终全然不觉；有的人不断在心理上给自己挖坑，最终把自己弄成了悲剧人物。一个人本来可以取得成功，过得幸福，就因为被自己的心理套牢，他失败了。所有的这些人中，有的终其一生都无法或不敢醒来。


    这是我们既不认识自己，也不认识他人的后果。我们成了心理的盲人。


    在这个意义上，心理分析还可以是一种强大的方法，对我们的人生、处\环境

    境和命运进行破解。借助它，我们可以看到他人的内心，看到这个世界的真相。


    总之，心理分析可以让我们在头脑和心理上真正得到武装。


    在《世界如此险恶，你要内心强大》这本书里，从“我们为什么内心弱小”和“如何变得内心强大”这两个核心出发，我剖析了诸多控制我们的心理法则，'
  - '[PAGE 3]


    教徒者把自我的控制权掌握在自己手里，成为一个内心强大的人。


    这是第一步。


    现在，本书要做的事情，是在内心强大的原理和方法的基础上，系统地破译我们的存在，以及心理问题的真相，并从问题、原理开始，把心理分析方法全面地亮出来，以便继续内心强大的修炼，并解决我们碰到的问题。


    阿基米德说，"给我一个支点，我可以撬动地球"。我说，给你一个心理分析方法；你可以存活下来，并且过上幸福生活。当然，我指的是心理上的。


    这个心理分析方法，是我站在哲学和精神分析先辈们的肩膀上，从哲学、心理学等理论中提炼、创造出来的。我做的是在大师们没有看到的地方，把真相和有用的东西说出来，尤其重要的是，让每一个普通人都可以用得上。


    基于此，我保持低调，没有像别人那样对自己提炼、创造出来的心理分析方法进行命名。有用即是王道。当然，我们也可以把它叫作"理性主义心理分析"，或者"勇氏心理分析"。


    我遵循的是哲学的理性主义传统，不玩神秘主义，不鼓吹出世那一套，不空喊励志口号，不主张人要把自我卖了去适应社会，不让人自我暗示或强迫自己要干什么，不煮心灵鸡汤给别人喝。我想说，如果我们要站稳的话，请从理性开始。一切都有方法可循，从理性、方法中得到的改变，才是扎实的自我提升。


    感谢那些跟着我学习心理分析的网友，他们中有白领、研究生、本科生、中学生，也有公务员、教师，等等。感谢那些看过《世界如此险恶，你要内心强大》的读者。


    和《世界如此险恶，你要内心强大》一样，在本书中，我的表达有时仍然比较好玩，有时则比较狠——我解释过了，这是出于方便理解，以及"恶狠狠地把真相说出来"的考虑。


    石勇


    2012年10月8日'
