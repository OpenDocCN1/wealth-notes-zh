    在心理上，如何理解一个疯子、神经症患者、心理变态者呢？


    先说疯子。让一个人痛苦的，是他有一个意识到的“自我”，并且和“世界”对峙。疯子就是在“自我”极为弱小，而“世界”极为强大的情况下，在精神撕裂中釜底抽薪，在意识里抹去“世界”，只活在“自我”的世界中。（提示一下，“自我”，什么是真的自我，什么是假的“自我”，它是干什么的，我在《世界如此险恶，你要内心强大》中已经重点剖析过，所以在这里就不抄袭自己了，我假定你已经明白了它是什么意思。）


    一个人成为疯子，就是在外界的压力和打击中，承受不了，不和这个世界玩了，彻底退回到自我的世界。


    同样，我们理解一个神经症患者，仍要从“自我—世界”的对峙入手。


    神经症患者就是在“自我”和“世界”有冲突时，由于有道德感，不是用“自我”去仇恨、攻击“世界”，而是用道德感（所谓的“超我”）来责怪自己、攻击自己。为什么一个人容易有心理问题，容易得神经症？因为他总是找自己的原因，总是害怕得罪人、对不起人什么的，把什么账都算到自己头上！


    一个有心理问题、容易得神经症的人，在背后一定有恐惧，一定有很强的道德感！他的内心，无时无刻体现出冲突：恐惧和道德感让他把责任揽在自己身上，但是，对自己的压抑、牺牲又让他心有不甘。


    而恰恰相反，一个心理变态者就是在“自我”和“世界”有冲突时，遗忘对“自我”的任何坚守或道德审视，本能地仇恨、攻击“世界”，借此来获取心理上的生存。如果你叫这类人审视他的自我，等于要他的命，因为一旦如此，他就會听到内心早被扼杀的人性的声音。


    他们的内心一样有冲突，但是，化解这种冲突，他们的方法不是攻击自己，而是马上去仇恨、攻击他人，从而快速地遗忘“自我”。


