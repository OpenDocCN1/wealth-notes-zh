    ## 8. 如果你带着一双恐惧的眼睛看待这个世界，那么，一个微不足道的东西，都可能打败你


    一个人越是处在恐惧、焦虑、紧张、怀着巨大希望等心理背景中，心理抗打击能力越弱，越容易产生心理问题。那么，一种心理问题的症状，是如何产生的，如何消除它？


    我想说，在自我分析上、在自我认识上，对我们的心理逻辑进行梳理，是一种很高的境界。


    我们梳理心理逻辑的第四个运用是：看清一种心理症状，比如强迫症，到底是怎么来的。


    来看一个对噪声非常敏感的女生，她被一种强迫症——“噪声敏感症”，折磨得痛苦不堪。


    这种症状还在生理上体现出来，就是头痛。


    因为这种症状，她错过了心仪的大学，工作也大受影响。


    这个女生在小的时候父母感情不和，给她带来一些伤害，很自闭，很少和父母交流。在高中时，她甚至想离开家。也因此，她好胜心强，不服输，从小就是“三好学生”。在中学的时候为了超过其他同学，经常熬夜学习。善良，不习惯麻烦别人。


    在高三的时候，问题来了。


    有一天，她正在教室里紧张备考。听到有人咳嗽，一开始她的注意力稍微被分散。但仍有咳嗽声，她心烦、焦躁，大受影响。再后来，这个过几分钟就出现一次的声音，成了干扰她自习和听课的最大障碍。


    那时候，她每天很早起床，比其他人都早。但坐到教室后，学习没有效率。


    还远远不如那些懒散一点的同学。


    记得有一次班会，班主任说到这个问题，说有其他同学反映有人咳嗽影响自己学习，她知道原来存在这种困扰的不只是她自己。这让她更认同，是咳嗽声影响了自己学习。最后，情况变得更严重，她听到这个声音就开始头痛。


    到了大学，开始有所缓和，但“噪声敏感症”仍然或轻或重挥之不去。每当她需要集中精力做事情时，比如看书、学习，症状就会比较明显。


    大二的时候，她交的男朋友有清嗓子的习惯，这对她的影响非常大，也加重了她的症状。她一方面深受其苦，比如每当听到男友清嗓子或咳嗽的声音，甚至是哪怕他不在身边，她想到这件事，或者想到他，都开始头痛。她本能地想分手，解脱；但另一方面，她跟男友的感情还不错，她觉得因为自己的这种原因跟男友分手，对他不公平。


    工作之后，“噪声敏感症”依然存在，并且开始扩大化：不仅仅是听到别人的咳嗽声，或清嗓子的声音，还有关门的声音、办公室电话的声音，等等，在那种环境中很容易被忽略的，只要被她注意到了，都成为影响她的因素。她意识到这个影响到她了，就条件反射地开始头痛。越想排除，越加重。严重的时候，一天都没有状态，工作毫无效率。


    ### 心理背景 1

    由于父母感情不和，她有某种自卑，也知道不能依靠父母，以后的人生必须靠自己，必须逃离那个没有温暖的家庭，逃离那个不如人意的自己，所以从小努力学习，好胜心强。她努力学习；看成是自我拯救的方式。显而易见，她会自我加压，强迫自己这样做，而且，也始终处于紧张的状态中。


    ### 心理背景 2

    一个强迫自己努力，保持紧张状态的人；也是最敏感的。他害怕任何意外因素的干扰，因为这些他不能控制并且又影响到了他的因素，在心理上，会破坏他的努力，而破坏他的努力，必然会影响到底努力成果。这个女生正是这样。


    ### 刺激

    她带着这样的心理背景，在教室里紧张备考。这个时候，有人咳嗽，刺激到了她，注意力被分散。注意力分散产生了这样的心理后果：她害怕被干扰，而学习不下去。然而，咳嗽声仍然继续，几分钟一次。这刺激到了她的心理结构，激起了她不能学习下去的恐惧。于是，她心烦，焦虑，情绪大受影响。


    ### 强化

    咳嗽声并没能在那一次后就这样停止。于是，越紧张、敏感，越容易被咳嗽声影响，而越被咳嗽声影响，就越紧张、敏感，就有学不下去的恐惧。而她每天很早去学校，学习却没有懒散的同学那样有效率，更是一个很大的打击，让她没有自信，而没有自信，心理更加弱小，更害怕受到干扰。于是，咳嗽声成为她学习的杀手。她还把这一点客观化了，因为从班主任那儿，她证实了这一点。


    ### 症状形成

    她想学习好，想成功，以及害怕努力失败，这样的恐惧，由此和咳嗽声联系在一起了，因为对咳嗽声的恐惧，就是对失败的恐惧，面对失败的恐惧，也是对咳嗽声的恐惧。在心理上，咳嗽声既然和对失败的恐惧有关，那么，只要是集中精力想做好的事情，她就会有对咳嗽声的恐惧。“噪音恐惧症”由此形成，虽然一开始只是“咳嗽噪音恐惧”。同时，“噪音恐惧症”也有生理上的症状表现，就是头疼。


    ### 症状加剧

    一个人一旦形成某种心理症状，他心理更加弱小，心理背景更加有恐惧，更害怕，也更受不打扰。由于她进大学，相对不需要那么紧张，所以她的“噪音恐惧症”有所缓解。然而，在大二的时候，男朋友清嗓子习惯，因为总咳嗽，又刺激到了她的心理结构，加重了症状。在道德压力下，她既害怕咳嗽，又不分手，出现心理冲突，而这反过来加剧了她的症状。


    ### 恶化

    工作之后，压力变大，也更紧张。症状继续加剧、恶化。由于其他声音和咳嗽声、清嗓子等具有相同的干扰功能；而这些，都会给她带来恐惧，因此她不仅是对咳嗽声、清嗓子的声音敏感，对任何可能听到的声音，比如车门的声、办公室电话的声音等，都变得非常敏感。这些声音，都成为影响她的因素。在心理上，它们已经和她的恐惧对应起来了，而且也对应于症状的生理效应——头疼。


    她说，这是“积重难返”了，“透不过气来”。她坦白自己曾几次因此觉得活着没有意思。


    好，描述到这儿，我们来回答问题：她的“噪声敏感症”是如何发生、恶化的，心理逻辑是什么？


    在这里我们看到了：一种症状一旦形成，就会自我恶化。


    原因在于，我们“治疗”症状背后的恐惧的办法，或者就是强迫自己“不要这样想”“不要这样做”，这样就会和恐惧的那种心理力量产生心理冲突，更加紧张、焦虑、恐惧；或者，我们直接把症状表现出来，通过钻进强迫性症状的那个仪式来获得安全感，就是说，用恐惧的产物——强迫症——来治疗恐惧。


    这种饮鸩止渴的办法，只有一个下场，那就是失败。


    你可能要问，为什么一个人，会被这样一个微不足道的干扰困扰了那么长时间，被它给打败了呢？


    我的回答是：因为她是带着一双恐惧的眼睛，去看这个微不足道的干扰的。而现在，她要做的事情，就是通过自我心理分析，逃出症状，逃出那个心理背景！


