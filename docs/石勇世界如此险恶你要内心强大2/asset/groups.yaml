    ## Part - II


    如果一个人因为你的钱或转化为钱的能力而尊重你、巴结你，他爱的最终是钱，不是你，你不值得高傲。如果一个人因为钱或地位而看你低，他看低的是钱和地位，也不是你，你也不值得自卑。


    这段话，我们平时都知道，或别人一说我们就觉得自己也知道，有没有？还可以说出一长串经典名言，比如，某女士就有这样的“经典妙语”风行一时：


    人绝不能看轻自己，但也别太看重自己。面子是别人给的，脸是自己丢的。不会尊重别人起码也要学会自尊。一个从没有嫉妒过别人的人，是缺乏上进之心的平庸之徒；一个从来没有被别人嫉妒过的人，是庸庸碌碌的无能之辈。人应痛苦地清醒着，而不应麻木地快乐着。倘若无奈，你可以“厚颜”但不能“无耻”！


    这段话录够“哲理”够煽情吧？在微博上，我看到无数人奔走相告。问题是，尽管以为自己懂得这些道理，但在别人巴结我们的时候，我们仍然高傲；他们看低我们的时候，我们仍然自卑。我们不断地用某女士的语录来提醒自己，但仍然看轻自己，仍然嫉妒，仍然麻木地快乐着……


    这些道理好像全派不上用场，一般情况下只能用来装，表演给自己和别人看。


    这些道理是不是中听不中用？


    我想请问：当我们说出或欣赏这些“哲理名言”，一般是在什么时候？肯定是在我们把一些事情搞砸，碰到人生中的麻烦，或想用来安慰他人时。我们用优美而智慧的语句，告诉自己或别人应该这样不应该那样，感觉好像挺爽。但除此之外，什么都没有发生。


    为什么？我们如果澄清一下它在心理上的意思，就是当我们念出这些“哲理名言”时，我们其实只是在“审美”。就是说，这些话只具有临时性地安慰我们和他人那颗受伤的心
    的功能，它们只是作为外在的供我们欣赏的东西出现，并没有进入我们的智力结构和心理结构！


    ### 13. 对自己说 “我一定会成功”， 绝不是自我暗示， 而是自我强迫！


    有一件事让我很感动。


    在清华大学给学生讲心理分析的时候，曾经有一个外校的女生，大老远跑来听并问我一个问题。她已经快毕业，面临一个“毕业后工作还是考研”的选择。她说，她很想工作，但又感觉，也许读研后竞争力更大一些，尤其是她父母非常想要她考研。在这样的压力下她很矛盾，问我怎么办。


    我直接给出建议吗？不能。我首先要给她澄清，她的想法在心理上是什么意思。


    是什么意思呢？正如我一语道破的：她想工作，其实是对父母养自己那么多年感到愧疚，想早点报答父母——或者准确地说，她是对那么多年在父母的期待下读书，感觉有压力，想解脱出来。


    也就是说，无论是想工作还是继续读书，都不是基于她真正的兴趣。她的矛盾在于：一方面因为想摆脱父母的压力，想通过工作来解脱，但在竞争很大的情况下，对未来又没底，存在继续读研以摆脱这种焦虑的幻想；另一方面，读研又意味着要承受父母的压力，所以又想工作。这是一个正反馈式的循环链条，陷入到这里面，痛苦可想而知。


    这就是对她的想法在心理上是什么意思的澄清。看到了这一点，就可以砸烂这个循环的心理链条走出来了。该怎么做非常清楚：读研，选择自己感兴趣的专业读！


    现场还有一个同学问了一个同样是和考研有关的问题。他说据说自我暗示是一种很好的方法，可以让自己坚定目标，所以他一直在自我暗示“一定要考研，一定会考上”。


    这是在自我暗示吗？正如一个人在干一件事时对自己说的“我一定会成功”，然后好像就能更成功而不是搞砸？不，所有这些情况都不是自我暗示，而是自我强迫！


    在心理上，对自己说“我一定要考研，一定会考上”是什么意思？这绝不是通过暗示，给自己信心、力量、“正能量”之类，而是一方面对考研成功没有把握，有怕考不上的焦虑；另一方面，现实压力太大——而解脱这一切的，唯有想象自己可以考上。所以，在心理上，他要做的，就是强迫自己把持住，投入到这种想象里，只有在这种自我强迫所维持的想象里，他才能获得安全感。


    在这里我想告诉大家，适度的自我强迫，即偶尔玩一下是可以的，因为它对于目标的不坚定、懒惰、懈怠等是一种提醒。但是，如果一直这样自我强迫，一个人就会逃避现实压力、对未来有恐惧，而不是正视它们，在它们面前强大起来。甚至，它会让一个人陷入精神上的紧张状态，搞不好会有心理问题。


    ### 14. 当一个人不甘心的时候，他想到的，可能就是对自我的补偿


    前面讲的是想法和语言在心理上的真正意思是什么。行为上的呢？


    社会上“兽父”、老师“性侵”幼女的事似乎越来越多了。对此该怎么解释？无数浅薄的评论家扔几句“道德沦丧”以为就搞定了。但这等于什么都没说，因为“道德沦丧”谁都知道，只是一个外在于人的心理的、对社会现象的表层描述。


    我来残忍地捅出真相吧！


    原因非常简单，这些人在一切向钱看、心理竞争恶化的今天，感觉活得很失败、很不值，而幼（处）女，作为一种稀缺资源，被纳入了社会价值排序里面，“性侵”，也就是占有、掠夺幼（处）女，成为他们人生的最后补偿和对这个社会的报复！


    在这里，我要继续残忍下去，再想多说一句，友情提示那些因为老公出轨、嫖娼而痛苦不已的女士，他这么干，不一定是因为花心，而可能对的一种报复，对自己的一种弥补，而且不是一次就可以补的。


    原因很简单，无论他是否爱你（与爱无关），对和你过一辈子可能都感到有些遗憾和失落，随着时间流逝，在心理上他感觉越来越老，补偿自己，并进行报复的心就越加强烈。由于出轨或嫖娼只是在心理上让他爽一下，他的弥补和报复根本就得不到真正的满足，内心里停不下来，理论上永无歇止。


    所以，该怎么做，你懂的——不是和他吵，因为他内心认为你欠他的，那就以弱者、以爱的姿态出现，让他有道德压力，感觉到他欠你的！


    反过来，如果是一个女人出轨，也不一定是她不爱老公，而可能是对就这样和老公过一辈子有些许失落和遗憾。出轨，即是对自己的一种弥补。


    # 第六章 用理性来武装


    ### 1. 被训练用语言文字装，一个人只会人格分裂


    1968 年 5 月，法国大学生在巴黎街头举起了造反的义旗。他们嘴巴里念着一个人的名字。


    这个人就是美国哲学家马尔库塞同志。当时，他和另外两位 M 同志——马克思同志和毛泽东同志——一起被称为 “3M”（每个人名字的第二个英文字母都是 M），是革命群众心中的精神偶像。


    他最著名的理论，就是揭示社会有一套对人进行洗脑的机制，一个人一不小心，就会被洗成 “单向度的人”。所谓 “单向度的人”，通俗地讲，就是 “脑残粉” “一根筋”。


    法国大学生们对老马的理论进行了总结，喊出了这样的口号： “托老师和考试的福，六岁就开始与人竞争” “社会是一株食人花”。


    看到法国大学生这样，我不禁唏嘘慨叹。社会是一株食人花，这不是很夸张，但六岁就开始与人竞争算什么？在今天的中国，竞争已经从精子开始了。


    但是，还是要佩服一下法国大学生，他们确实厉害，能够把哲学家的思想变得如此浅显易懂，而且以人民群众也喜闻乐见的口号喊出来。


    这不奇怪。法国学生在高中毕业会考时就考哲学了，一直到现在都是一个传统，出的往往是 “人们是否可以摆脱偏见” “语言是否会背离思维” “文化是否让人扭曲” 等问题。


    很有意思的是，法国 2012 年高考哲学题目在微博上引起了热议。像 “所有的信仰都是与理性相悖的吗” “我们是否有追求真理的义务” “没有国家我们是否会更自由”，仅仅从问题上看，中国人的思维，就比人家差了一大截。


    出这些问题，你回答 “YES” 或者 “NO” 都不重要，重要的是，你是否理解了你正在思考的是什么问题，用我们的话来说就是你要 “澄清” 它，而且为你的判断给出理由。这是在检测一个人的分析能力、思辨能力，让他在理性上得到成长。与之相比，我们总摆脱不了抒情和空发议论的高考作文实在太小儿科了——这只是训练一个人如何用文字来装而已！


    我想说，越是在成长过程中被训练用语言文字来装，缺乏分析能力、思辨能力，但擅长抒情和空发议论的人，更容易被洗脑，更虚伪，更容易人格分裂。


    ### 2. 没有理性的人，一但有利益诱惑，他的人格结构就会散架


    你也许会问：为什么一个被训练用语言文字来装的人会有这样的后果？


    我恭恭敬敬地回答：他缺乏一个由理性组成的、独立而强大的自我来支撑他的人格结构。一旦有利益诱惑，他脆弱的人格结构就会散架，轻易就把自己卖出去。


    还有很多虽然也被洗脑，但并不虚伪或人格分裂的人，他们由于有道德感，不会轻易卖掉自我，但后果一定是心理弱小，正如今天很多人一样。


    与此相反，如果他具备强大的分析能力和思辨能力，那么，他就有一个强大的自我来支撑人格结构，谁也别想将他的自我夺走，或者在心理上击倒他！


    ### 3. 如果我们习惯了命令小孩，我们将不得不让自己变成一个暴君


    所以，这里不得不又扯到了教育问题。而一个非常重要的原因是，我们长大后有心理问题，都拜小时候的心理创伤所赐，尤其是家庭教育。


    让我们走回去看一下小时候自己。也让我们——无论是否已为人父母——看一下，如何不让一个孩子 在心理上受伤？


    如果你有了孩子，那么，我真的有一个建议：让你的孩子多看看哲学的启蒙书吧，无论他是否看得懂，都没关系，长大以后，那些书，书里面的理性精神，就成了他参与这个世界的知识背景、人格背景了！


    而如果你能够和他讨论，让他学会用理性思考的方法澄清某些问题，那就太好了。


    比如说，你希望他不要随便去买零食，要听父母的话，你采用的不是命令、规劝、恐吓的方式，如“你去买零食我就打你”“小孩子吃零食不好哦，不要去买哦”“零食可能有毒，吃了要生病”等，而是用“澄清”的方式，“不是父母不让你吃零食哦，而是街边卖的那些零食，很多都不卫生，吃了会生病，而一个小孩子，当然要在自己的身体健康负责；同时呢，作为孩子，也有义务不让父母担心。因为你还小，欠缺一定的识别能力，所以呢，父母就不能放手让你吃零食，因为要对你负责。”


    看到没有？如果你对小孩采用命令的方式，无论他如何反应，在心理上都会遭到抵触，因为这阻遏了他成长中自我的独立倾向，把他变成了你控制下的附庸，这时他在心理上一定要反抗的。要成功地消除他的反抗，你只有把自己变成一个暴君，一个施虐狂，让他一听到你的声音，一见到你就害怕。后果是什么，不用我再说了吧？


    ### 4. 你的话不能让孩子明白，那就相当于你没说过这句话


    如果你采用规劝的方式，基本上不会有什么效果，因为你没有给出任何理由，他对为什么不能去吃零食还是搞不清楚，自然，他在心理上相当于你从未说过这句话！


    ### 5. 我们是让自己的孩子有所敬畏，或者有所防御，而不是让他从小就害怕


    恐吓呢？这是最坏的一种教育方法，因为这是在把恐惧残忍地植入小孩子的内心世界，培养他对世界上很多东西的恐惧感，让他以后胆怯、懦弱，不敢闯、不敢拼，在心理上任人宰割。


    不知流传了多少年，毒害了多少小孩子的“狼外婆”故事必须得到清算，而恐吓比这样的故事还要坏。切记：我们是让自己的孩子有所敬畏，或者有所防御，而不是让他从小就害怕！


    ### 6. 当我们能理性地约束自己的时候，就无须玩压抑了


    和这些教育的烂招数相反，以权威的身份，和孩子理性地讨论，不仅可以让孩子心理健康，而且让他在头脑上、心理上，具有把握这个世界的自信。


    因为，你如果澄清了“不能吃零食”的问题，那么，他就会明白，他确实没有理由随便去街边买零食吃——这是“本来就不能这样做”，而不是听你的话的结果。


    同时，看到了这一点；他也知道自己想吃零食的欲望应该得到理性的控制，在这个世界上，不是他想干什么就可以干什么，不能放纵自己——在以后的类似事情上，他采用的，是理性地约束自己，而不是压抑自己的策略。


    还记得我原来说过什么吗？ “理性对人构成了一种真正的说服！”


    再强调一下：你要在头脑上说服一个人，最好的办法就是让理性来说服他，而你要在心理上说服一个人，最好就是让他自我说服！


    还有，当你向孩子澄清“为什么不能吃零食”的问题时，你就把理性思维引入了他的头脑，作为一种心理力量，理性又进入了他的心理世界——而孩子的自我正处于成长过程中，在他的自我和陌生、复杂、似乎有着诸多奥秘的世界打交道时，恰恰需要理性来给这个自我增加力量！


    ### 7. 让一个人自己问自己：我还是不是个人？


    类似的教育方法，还可以用在孩子的道德教育中，比如孝顺、尊重父母之类。


    我们都知道，孝顺往往是通过情感和道德教导来搞定的。它们的原理并不复杂：情感是唤起孩子的内疚心，使它以感恩的方式表现出来，否则就感觉自己在道德上不是人。


    > “学术超男”易中天先生就说过这样一句激情澎湃的话——“骂茅于轼的都不是人！”


    对超男先生这句话澄清一下就是：我在观点上干不过你是吧？行，我用道德大棒打你！


    我们不会用道德大棒打自己，但如果我们在情感上，体验到父母对我们好，而我们居然不孝顺，在心理上就会活不下去，会有“我还有没有良心”的焦虑。


    而道德教导则是从小就把“要孝顺父母”这样的道德命令植入孩子的内心世界，他要听这个道德权威的话，不听就会有道德压力，好像自己的内心和别人都在审视自己：你是人还是个畜生，嗯？


    情感和道德命令有效吗？当然！


    但它们的有效性，依赖于孩子和父母的正确关系，依赖于孩子是否能体验到父母的苦和对自己的好。它的一个先决条件就是：父母不能无原则地溺爱！


    ### 8. 溺爱孩子，小心他将来会埋怨为什么他爸不是李刚而是你


    在广州曾经经过一个母亲失手误杀“恶女”的悲剧，让人唏嘘慨叹。祸根就在于父母对女儿的溺爱。


    从小，女儿要什么父母都满足，“关怀周到，无微不至”。上初中时，母亲就为女儿办了银行卡。到案发前，年仅16岁的女儿便拥有了四张银行卡。发展到后来，女儿在家谁都不怕，蛮不讲理，如果不给钱，她就对父母大打出手，狠扇耳光。


    悲剧发生后，女儿的父亲说：“我们夫妻俩采取温和、讲理的方式教育和引导女儿，想了许多办法，可是并不奏效。复杂的社会环境和学校环境，我们无从掌控。”


    我能够理解处于痛苦之中的这位父亲为什么这样说。要一个人从某种心理情境当中醒来是很难的，尤其是他正在承受有自己一份责任的悲剧后果的时候——想一想，就算可以进行自我反思，那还有什么用，还能挽回这一切吗？所以，不如把责任全推出去，减少心理的折磨。


    但其他人，却应该吸取教训。


    即使你对孩子非常好，什么苦都可以为他吃，而且还教育他要孝顺，但如果你溺爱他，在他心理上会发生什么呢？——“你们对我好是理所当然的，而如果不能满足我的要求，你们就对不起我，我会恨你们，我要报复！”


    就是说，溺爱会挫败所有的孝顺教育和对父母的尊重，因为这个人心深处的道德原则被驱逐了！不再有一种从内心深处传来的声音告诉孩子“父母对你好，养了你，你也应该孝顺他们，尊重他们，养他们老”，而是他在父母的溺爱行为中告诉自己“父母对我好，本来就是他们应该的，欠我的”。


    这样，无论他有没有看见和体验到父母的苦，他都会培养出对父母的恨，让他变得冷酷无情，很难排除。有时候孩子看到父母的操劳，会有内疚感，伸手要钱和不孝顺时会有道德压力，但他的恨的力量，马上就会压倒道德的力量！


    溺爱一个孩子，居然会让他恨父母，有点不可理解是吧？


    其实非常好懂！它是“你们对我好是理所当然的，是应该的，是欠我的”这种想法的一个逻辑结果，就是说，按照这种想法，一往前走，就走到了恨。


    因为，只要父母对孩子的溺爱被认为是义务，也就意味着孩子不认为自己 对父母有什么孝顺、尊重的义务——而在心理上，他必须把这种想法、把“父 母欠我的”、把索取更多合理化，以更理理直气壮地说服自己，而办法，就是给他们增加恨的力量。


    其实溺爱不仅仅导致恨。如果你混得不是太好的话，在恨之外，你还要 遭到孩子的鄙视，因为，在和别人的心理竞争中，你在社会价值排序上如果 不高，在他那儿根本拿不出手，只能让他丢面子，你的存在，让他的存在成
    为一种耻辱。他会埋怨为什么他爸不是李刚而是你？


    ### 9. 90后最害怕的，就是“现实”对他反戈一击


    理性，是我们在心理成长时，真正可以让我们心理健全的药方，也是心 理强大的武器。


    它也可以帮父母界定好和孩子的关系。


    让我们先看一下子这个现象：为什么现在的90后，比之80后（更不用说 是70后）更早熟、更精明、更现实，但也更脆弱？


    答案在一个人的头脑、心理与世界的关系中。


    90后成长的年代，社会变化非常快，他的“自我”在成长时，头脑快速 地接受了社会上玩的那些东西，进入心理结构，变成他的“自我”的一部分， 他的心理结构，和现实结合得很紧密，因此很现实、很世故。


    但是，他心理结构上的东西，更多的是头脑上的东西，里面没有一个稍 微独立点的、坚固的自我在支撑。所以，只要一受到什么打击，即“现实”不再支持他而是构成了对他的威胁，他弱小的“自我”就受不了了。


    90后把自己完全投入到了“现实”之中。他最害怕的，就是“现实”对他反戈一击！


    而80后以上的人，其“自我”在成长时，社会相对来说发展得没那么快，也没那么现实，他头脑上受到社会上玩的那一套的影响，在进入心理结构，变成他的“自我”一部分时，还给一个稍微独立的“自我”成长留有一定的空间。所以，他不像90后那样现实，因为他那个稍微独立的“自我”并不现实。他也没那么脆弱，因为他那个稍微独立的“自我”本身就不是“现实”驻扎在内心里的代理人，而是有一点力量的。


    当然，80后也可以变得比90后更“现实”，原理你应该已经清楚了：把他那个稍微独立的“自我”卖掉或扼杀掉，豁出去了，投入“现实”里！


    好，我们来看如何通过理性的澄清，帮孩子界定好和父母的关系。


    我们可以在孩子伸手要钱时，抛出这样一个问题：“你觉得父母养你，拿钱买衣服给你穿，拿钱让你读书是不是应该的啊？”


    无论孩子如何回答（如果你的孩子第一反应是诧异，你太有必要这样教育了！），我们可以继续：“其实呢，不存在应该不应该的问题，在你成长，能够独立生活之前，父母要给你提供生活条件、学习条件，目的是让你能够得到很好的成长。但不是你想要什么都要满足你，因为有些是你自己的事情，是你长大后自己去创造的。而相应呢，父母给你的这些东西，表现出了父母对你的爱，你就不要认为是父母欠你的。你长大了，父母老了，就轮到你照顾父母了。”


    # 第七章 心理的家


    ### 1. 我们用大脑和心理如何和世界打交道，我们就是什么人


    回到马尔库塞那儿：为什么一个人容易被人洗成“单向度的人”——容易变成一个心理动物呢？


    在前面，我已经说到了一个人的大脑、心理和世界的关系。


    让我们继续揭开这个秘密。


    还记得我在《世界如此险恶，你要内心强大》里所描述的“存在主义之河”吗？


    无论你有没有下河都清楚：我们要用大脑、心理和外部世界打交道——无论这个“外部世界”是一个入、一件事情，还是整个社会。


    如果一个人的大脑、心理和外部世界无法打交道了，你能想象到他是什 么人吗？


    你肯定会脱口而出：“植物人！”就是说，虽然人还活着，但大脑和心理的功能已经报废了。


    我不得不佩服造出“植物人”这个词的科学工作者，确实形象。


    但我还想接着问：


    - a. 如果一个人的大脑和心理，与外部世界发生的只是微弱的联系，就是说，大脑和心理功能还在，但已快报废了，他是什么人？

    - b. 而如果一个人的大脑和心理，在与外部世界发生联系时，同时也处于这种状态，就是说，大脑和心理也相互影响，很多时候，他“看”到和“理解”的只是他心里面愿意相信的，心里面体验到的也只是他的大脑里想象出来的东西呢？他是什么人？

    - c. 还有，如果一个人能够“看”和“直觉”到这个世界上真相呢？他又是什么人？


    太深奥、太抽象了对吧？别紧张，下面我会一一剖析。


    ### 2. 一个人疯了，那是因为他在捍卫自我时失败了


    现在，我来回答问题 a。

    '
  mdcn: '

    ## Part - II


    如果一个人因为你的钱或转化为钱的能力而尊重你、巴结你，他爱的最终是钱，不是你，你不值得高傲。如果一个人因为钱或地位而看你低，他看低的是钱和地位，也不是你，你也不值得自卑。


    这段话，我们平时都知道，或别人一说我们就觉得自己也知道，有没有？还可以说出一长串经典名言，比如，某女士就有这样的“经典妙语”风行一时：


    人绝不能看轻自己，但也别太看重自己。面子是别人给的，脸是自己丢的。不会尊重别人起码也要学会自尊。一个从没有嫉妒过别人的人，是缺乏上进之心的平庸之徒；一个从来没有被别人嫉妒过的人，是庸庸碌碌的无能之辈。人应痛苦地清醒着，而不应麻木地快乐着。倘若无奈，你可以“厚颜”但不能“无耻”！


    这段话录够“哲理”够煽情吧？在微博上，我看到无数人奔走相告。问题是，尽管以为自己懂得这些道理，但在别人巴结我们的时候，我们仍然高傲；他们看低我们的时候，我们仍然自卑。我们不断地用某女士的语录来提醒自己，但仍然看轻自己，仍然嫉妒，仍然麻木地快乐着……


    这些道理好像全派不上用场，一般情况下只能用来装，表演给自己和别人看。


    这些道理是不是中听不中用？


    我想请问：当我们说出或欣赏这些“哲理名言”，一般是在什么时候？肯定是在我们把一些事情搞砸，碰到人生中的麻烦，或想用来安慰他人时。我们用优美而智慧的语句，告诉自己或别人应该这样不应该那样，感觉好像挺爽。但除此之外，什么都没有发生。


    为什么？我们如果澄清一下它在心理上的意思，就是当我们念出这些“哲理名言”时，我们其实只是在“审美”。就是说，这些话只具有临时性地安慰我们和他人那颗受伤的心
    的功能，它们只是作为外在的供我们欣赏的东西出现，并没有进入我们的智力结构和心理结构！


    ### 13. 对自己说 “我一定会成功”， 绝不是自我暗示， 而是自我强迫！


    有一件事让我很感动。


    在清华大学给学生讲心理分析的时候，曾经有一个外校的女生，大老远跑来听并问我一个问题。她已经快毕业，面临一个“毕业后工作还是考研”的选择。她说，她很想工作，但又感觉，也许读研后竞争力更大一些，尤其是她父母非常想要她考研。在这样的压力下她很矛盾，问我怎么办。


    我直接给出建议吗？不能。我首先要给她澄清，她的想法在心理上是什么意思。


    是什么意思呢？正如我一语道破的：她想工作，其实是对父母养自己那么多年感到愧疚，想早点报答父母——或者准确地说，她是对那么多年在父母的期待下读书，感觉有压力，想解脱出来。


    也就是说，无论是想工作还是继续读书，都不是基于她真正的兴趣。她的矛盾在于：一方面因为想摆脱父母的压力，想通过工作来解脱，但在竞争很大的情况下，对未来又没底，存在继续读研以摆脱这种焦虑的幻想；另一方面，读研又意味着要承受父母的压力，所以又想工作。这是一个正反馈式的循环链条，陷入到这里面，痛苦可想而知。


    这就是对她的想法在心理上是什么意思的澄清。看到了这一点，就可以砸烂这个循环的心理链条走出来了。该怎么做非常清楚：读研，选择自己感兴趣的专业读！


    现场还有一个同学问了一个同样是和考研有关的问题。他说据说自我暗示是一种很好的方法，可以让自己坚定目标，所以他一直在自我暗示“一定要考研，一定会考上”。


    这是在自我暗示吗？正如一个人在干一件事时对自己说的“我一定会成功”，然后好像就能更成功而不是搞砸？不，所有这些情况都不是自我暗示，而是自我强迫！


    在心理上，对自己说“我一定要考研，一定会考上”是什么意思？这绝不是通过暗示，给自己信心、力量、“正能量”之类，而是一方面对考研成功没有把握，有怕考不上的焦虑；另一方面，现实压力太大——而解脱这一切的，唯有想象自己可以考上。所以，在心理上，他要做的，就是强迫自己把持住，投入到这种想象里，只有在这种自我强迫所维持的想象里，他才能获得安全感。


    在这里我想告诉大家，适度的自我强迫，即偶尔玩一下是可以的，因为它对于目标的不坚定、懒惰、懈怠等是一种提醒。但是，如果一直这样自我强迫，一个人就会逃避现实压力、对未来有恐惧，而不是正视它们，在它们面前强大起来。甚至，它会让一个人陷入精神上的紧张状态，搞不好会有心理问题。


    ### 14. 当一个人不甘心的时候，他想到的，可能就是对自我的补偿


    前面讲的是想法和语言在心理上的真正意思是什么。行为上的呢？


    社会上“兽父”、老师“性侵”幼女的事似乎越来越多了。对此该怎么解释？无数浅薄的评论家扔几句“道德沦丧”以为就搞定了。但这等于什么都没说，因为“道德沦丧”谁都知道，只是一个外在于人的心理的、对社会现象的表层描述。


    我来残忍地捅出真相吧！


    原因非常简单，这些人在一切向钱看、心理竞争恶化的今天，感觉活得很失败、很不值，而幼（处）女，作为一种稀缺资源，被纳入了社会价值排序里面，“性侵”，也就是占有、掠夺幼（处）女，成为他们人生的最后补偿和对这个社会的报复！


    在这里，我要继续残忍下去，再想多说一句，友情提示那些因为老公出轨、嫖娼而痛苦不已的女士，他这么干，不一定是因为花心，而可能对的一种报复，对自己的一种弥补，而且不是一次就可以补的。


    原因很简单，无论他是否爱你（与爱无关），对和你过一辈子可能都感到有些遗憾和失落，随着时间流逝，在心理上他感觉越来越老，补偿自己，并进行报复的心就越加强烈。由于出轨或嫖娼只是在心理上让他爽一下，他的弥补和报复根本就得不到真正的满足，内心里停不下来，理论上永无歇止。


    所以，该怎么做，你懂的——不是和他吵，因为他内心认为你欠他的，那就以弱者、以爱的姿态出现，让他有道德压力，感觉到他欠你的！


    反过来，如果是一个女人出轨，也不一定是她不爱老公，而可能是对就这样和老公过一辈子有些许失落和遗憾。出轨，即是对自己的一种弥补。


    # 第六章 用理性来武装


    ### 1. 被训练用语言文字装，一个人只会人格分裂


    1968 年 5 月，法国大学生在巴黎街头举起了造反的义旗。他们嘴巴里念着一个人的名字。


    这个人就是美国哲学家马尔库塞同志。当时，他和另外两位 M 同志——马克思同志和毛泽东同志——一起被称为 “3M”（每个人名字的第二个英文字母都是 M），是革命群众心中的精神偶像。


    他最著名的理论，就是揭示社会有一套对人进行洗脑的机制，一个人一不小心，就会被洗成 “单向度的人”。所谓 “单向度的人”，通俗地讲，就是 “脑残粉” “一根筋”。


    法国大学生们对老马的理论进行了总结，喊出了这样的口号： “托老师和考试的福，六岁就开始与人竞争” “社会是一株食人花”。


    看到法国大学生这样，我不禁唏嘘慨叹。社会是一株食人花，这不是很夸张，但六岁就开始与人竞争算什么？在今天的中国，竞争已经从精子开始了。


    但是，还是要佩服一下法国大学生，他们确实厉害，能够把哲学家的思想变得如此浅显易懂，而且以人民群众也喜闻乐见的口号喊出来。


    这不奇怪。法国学生在高中毕业会考时就考哲学了，一直到现在都是一个传统，出的往往是 “人们是否可以摆脱偏见” “语言是否会背离思维” “文化是否让人扭曲” 等问题。


    很有意思的是，法国 2012 年高考哲学题目在微博上引起了热议。像 “所有的信仰都是与理性相悖的吗” “我们是否有追求真理的义务” “没有国家我们是否会更自由”，仅仅从问题上看，中国人的思维，就比人家差了一大截。


    出这些问题，你回答 “YES” 或者 “NO” 都不重要，重要的是，你是否理解了你正在思考的是什么问题，用我们的话来说就是你要 “澄清” 它，而且为你的判断给出理由。这是在检测一个人的分析能力、思辨能力，让他在理性上得到成长。与之相比，我们总摆脱不了抒情和空发议论的高考作文实在太小儿科了——这只是训练一个人如何用文字来装而已！


    我想说，越是在成长过程中被训练用语言文字来装，缺乏分析能力、思辨能力，但擅长抒情和空发议论的人，更容易被洗脑，更虚伪，更容易人格分裂。


    ### 2. 没有理性的人，一但有利益诱惑，他的人格结构就会散架


    你也许会问：为什么一个被训练用语言文字来装的人会有这样的后果？


    我恭恭敬敬地回答：他缺乏一个由理性组成的、独立而强大的自我来支撑他的人格结构。一旦有利益诱惑，他脆弱的人格结构就会散架，轻易就把自己卖出去。


    还有很多虽然也被洗脑，但并不虚伪或人格分裂的人，他们由于有道德感，不会轻易卖掉自我，但后果一定是心理弱小，正如今天很多人一样。


    与此相反，如果他具备强大的分析能力和思辨能力，那么，他就有一个强大的自我来支撑人格结构，谁也别想将他的自我夺走，或者在心理上击倒他！


    ### 3. 如果我们习惯了命令小孩，我们将不得不让自己变成一个暴君


    所以，这里不得不又扯到了教育问题。而一个非常重要的原因是，我们长大后有心理问题，都拜小时候的心理创伤所赐，尤其是家庭教育。


    让我们走回去看一下小时候自己。也让我们——无论是否已为人父母——看一下，如何不让一个孩子 在心理上受伤？


    如果你有了孩子，那么，我真的有一个建议：让你的孩子多看看哲学的启蒙书吧，无论他是否看得懂，都没关系，长大以后，那些书，书里面的理性精神，就成了他参与这个世界的知识背景、人格背景了！


    而如果你能够和他讨论，让他学会用理性思考的方法澄清某些问题，那就太好了。


    比如说，你希望他不要随便去买零食，要听父母的话，你采用的不是命令、规劝、恐吓的方式，如“你去买零食我就打你”“小孩子吃零食不好哦，不要去买哦”“零食可能有毒，吃了要生病”等，而是用“澄清”的方式，“不是父母不让你吃零食哦，而是街边卖的那些零食，很多都不卫生，吃了会生病，而一个小孩子，当然要在自己的身体健康负责；同时呢，作为孩子，也有义务不让父母担心。因为你还小，欠缺一定的识别能力，所以呢，父母就不能放手让你吃零食，因为要对你负责。”


    看到没有？如果你对小孩采用命令的方式，无论他如何反应，在心理上都会遭到抵触，因为这阻遏了他成长中自我的独立倾向，把他变成了你控制下的附庸，这时他在心理上一定要反抗的。要成功地消除他的反抗，你只有把自己变成一个暴君，一个施虐狂，让他一听到你的声音，一见到你就害怕。后果是什么，不用我再说了吧？


    ### 4. 你的话不能让孩子明白，那就相当于你没说过这句话


    如果你采用规劝的方式，基本上不会有什么效果，因为你没有给出任何理由，他对为什么不能去吃零食还是搞不清楚，自然，他在心理上相当于你从未说过这句话！


    ### 5. 我们是让自己的孩子有所敬畏，或者有所防御，而不是让他从小就害怕


    恐吓呢？这是最坏的一种教育方法，因为这是在把恐惧残忍地植入小孩子的内心世界，培养他对世界上很多东西的恐惧感，让他以后胆怯、懦弱，不敢闯、不敢拼，在心理上任人宰割。


    不知流传了多少年，毒害了多少小孩子的“狼外婆”故事必须得到清算，而恐吓比这样的故事还要坏。切记：我们是让自己的孩子有所敬畏，或者有所防御，而不是让他从小就害怕！


    ### 6. 当我们能理性地约束自己的时候，就无须玩压抑了


    和这些教育的烂招数相反，以权威的身份，和孩子理性地讨论，不仅可以让孩子心理健康，而且让他在头脑上、心理上，具有把握这个世界的自信。


    因为，你如果澄清了“不能吃零食”的问题，那么，他就会明白，他确实没有理由随便去街边买零食吃——这是“本来就不能这样做”，而不是听你的话的结果。


    同时，看到了这一点；他也知道自己想吃零食的欲望应该得到理性的控制，在这个世界上，不是他想干什么就可以干什么，不能放纵自己——在以后的类似事情上，他采用的，是理性地约束自己，而不是压抑自己的策略。


    还记得我原来说过什么吗？ “理性对人构成了一种真正的说服！”


    再强调一下：你要在头脑上说服一个人，最好的办法就是让理性来说服他，而你要在心理上说服一个人，最好就是让他自我说服！


    还有，当你向孩子澄清“为什么不能吃零食”的问题时，你就把理性思维引入了他的头脑，作为一种心理力量，理性又进入了他的心理世界——而孩子的自我正处于成长过程中，在他的自我和陌生、复杂、似乎有着诸多奥秘的世界打交道时，恰恰需要理性来给这个自我增加力量！


    ### 7. 让一个人自己问自己：我还是不是个人？


    类似的教育方法，还可以用在孩子的道德教育中，比如孝顺、尊重父母之类。


    我们都知道，孝顺往往是通过情感和道德教导来搞定的。它们的原理并不复杂：情感是唤起孩子的内疚心，使它以感恩的方式表现出来，否则就感觉自己在道德上不是人。


    > “学术超男”易中天先生就说过这样一句激情澎湃的话——“骂茅于轼的都不是人！”


    对超男先生这句话澄清一下就是：我在观点上干不过你是吧？行，我用道德大棒打你！


    我们不会用道德大棒打自己，但如果我们在情感上，体验到父母对我们好，而我们居然不孝顺，在心理上就会活不下去，会有“我还有没有良心”的焦虑。


    而道德教导则是从小就把“要孝顺父母”这样的道德命令植入孩子的内心世界，他要听这个道德权威的话，不听就会有道德压力，好像自己的内心和别人都在审视自己：你是人还是个畜生，嗯？


    情感和道德命令有效吗？当然！


    但它们的有效性，依赖于孩子和父母的正确关系，依赖于孩子是否能体验到父母的苦和对自己的好。它的一个先决条件就是：父母不能无原则地溺爱！


    ### 8. 溺爱孩子，小心他将来会埋怨为什么他爸不是李刚而是你


    在广州曾经经过一个母亲失手误杀“恶女”的悲剧，让人唏嘘慨叹。祸根就在于父母对女儿的溺爱。


    从小，女儿要什么父母都满足，“关怀周到，无微不至”。上初中时，母亲就为女儿办了银行卡。到案发前，年仅16岁的女儿便拥有了四张银行卡。发展到后来，女儿在家谁都不怕，蛮不讲理，如果不给钱，她就对父母大打出手，狠扇耳光。


    悲剧发生后，女儿的父亲说：“我们夫妻俩采取温和、讲理的方式教育和引导女儿，想了许多办法，可是并不奏效。复杂的社会环境和学校环境，我们无从掌控。”


    我能够理解处于痛苦之中的这位父亲为什么这样说。要一个人从某种心理情境当中醒来是很难的，尤其是他正在承受有自己一份责任的悲剧后果的时候——想一想，就算可以进行自我反思，那还有什么用，还能挽回这一切吗？所以，不如把责任全推出去，减少心理的折磨。


    但其他人，却应该吸取教训。


    即使你对孩子非常好，什么苦都可以为他吃，而且还教育他要孝顺，但如果你溺爱他，在他心理上会发生什么呢？——“你们对我好是理所当然的，而如果不能满足我的要求，你们就对不起我，我会恨你们，我要报复！”


    就是说，溺爱会挫败所有的孝顺教育和对父母的尊重，因为这个人心深处的道德原则被驱逐了！不再有一种从内心深处传来的声音告诉孩子“父母对你好，养了你，你也应该孝顺他们，尊重他们，养他们老”，而是他在父母的溺爱行为中告诉自己“父母对我好，本来就是他们应该的，欠我的”。


    这样，无论他有没有看见和体验到父母的苦，他都会培养出对父母的恨，让他变得冷酷无情，很难排除。有时候孩子看到父母的操劳，会有内疚感，伸手要钱和不孝顺时会有道德压力，但他的恨的力量，马上就会压倒道德的力量！


    溺爱一个孩子，居然会让他恨父母，有点不可理解是吧？


    其实非常好懂！它是“你们对我好是理所当然的，是应该的，是欠我的”这种想法的一个逻辑结果，就是说，按照这种想法，一往前走，就走到了恨。


    因为，只要父母对孩子的溺爱被认为是义务，也就意味着孩子不认为自己 对父母有什么孝顺、尊重的义务——而在心理上，他必须把这种想法、把“父 母欠我的”、把索取更多合理化，以更理理直气壮地说服自己，而办法，就是给他们增加恨的力量。


    其实溺爱不仅仅导致恨。如果你混得不是太好的话，在恨之外，你还要 遭到孩子的鄙视，因为，在和别人的心理竞争中，你在社会价值排序上如果 不高，在他那儿根本拿不出手，只能让他丢面子，你的存在，让他的存在成
    为一种耻辱。他会埋怨为什么他爸不是李刚而是你？


    ### 9. 90后最害怕的，就是“现实”对他反戈一击


    理性，是我们在心理成长时，真正可以让我们心理健全的药方，也是心 理强大的武器。


    它也可以帮父母界定好和孩子的关系。


    让我们先看一下子这个现象：为什么现在的90后，比之80后（更不用说 是70后）更早熟、更精明、更现实，但也更脆弱？


    答案在一个人的头脑、心理与世界的关系中。


    90后成长的年代，社会变化非常快，他的“自我”在成长时，头脑快速 地接受了社会上玩的那些东西，进入心理结构，变成他的“自我”的一部分， 他的心理结构，和现实结合得很紧密，因此很现实、很世故。


    但是，他心理结构上的东西，更多的是头脑上的东西，里面没有一个稍 微独立点的、坚固的自我在支撑。所以，只要一受到什么打击，即“现实”不再支持他而是构成了对他的威胁，他弱小的“自我”就受不了了。


    90后把自己完全投入到了“现实”之中。他最害怕的，就是“现实”对他反戈一击！


    而80后以上的人，其“自我”在成长时，社会相对来说发展得没那么快，也没那么现实，他头脑上受到社会上玩的那一套的影响，在进入心理结构，变成他的“自我”一部分时，还给一个稍微独立的“自我”成长留有一定的空间。所以，他不像90后那样现实，因为他那个稍微独立的“自我”并不现实。他也没那么脆弱，因为他那个稍微独立的“自我”本身就不是“现实”驻扎在内心里的代理人，而是有一点力量的。


    当然，80后也可以变得比90后更“现实”，原理你应该已经清楚了：把他那个稍微独立的“自我”卖掉或扼杀掉，豁出去了，投入“现实”里！


    好，我们来看如何通过理性的澄清，帮孩子界定好和父母的关系。


    我们可以在孩子伸手要钱时，抛出这样一个问题：“你觉得父母养你，拿钱买衣服给你穿，拿钱让你读书是不是应该的啊？”


    无论孩子如何回答（如果你的孩子第一反应是诧异，你太有必要这样教育了！），我们可以继续：“其实呢，不存在应该不应该的问题，在你成长，能够独立生活之前，父母要给你提供生活条件、学习条件，目的是让你能够得到很好的成长。但不是你想要什么都要满足你，因为有些是你自己的事情，是你长大后自己去创造的。而相应呢，父母给你的这些东西，表现出了父母对你的爱，你就不要认为是父母欠你的。你长大了，父母老了，就轮到你照顾父母了。”


    # 第七章 心理的家


    ### 1. 我们用大脑和心理如何和世界打交道，我们就是什么人


    回到马尔库塞那儿：为什么一个人容易被人洗成“单向度的人”——容易变成一个心理动物呢？


    在前面，我已经说到了一个人的大脑、心理和世界的关系。


    让我们继续揭开这个秘密。


    还记得我在《世界如此险恶，你要内心强大》里所描述的“存在主义之河”吗？


    无论你有没有下河都清楚：我们要用大脑、心理和外部世界打交道——无论这个“外部世界”是一个入、一件事情，还是整个社会。


    如果一个人的大脑、心理和外部世界无法打交道了，你能想象到他是什 么人吗？


    你肯定会脱口而出：“植物人！”就是说，虽然人还活着，但大脑和心理的功能已经报废了。


    我不得不佩服造出“植物人”这个词的科学工作者，确实形象。


    但我还想接着问：


    - a. 如果一个人的大脑和心理，与外部世界发生的只是微弱的联系，就是说，大脑和心理功能还在，但已快报废了，他是什么人？

    - b. 而如果一个人的大脑和心理，在与外部世界发生联系时，同时也处于这种状态，就是说，大脑和心理也相互影响，很多时候，他“看”到和“理解”的只是他心里面愿意相信的，心里面体验到的也只是他的大脑里想象出来的东西呢？他是什么人？

    - c. 还有，如果一个人能够“看”和“直觉”到这个世界上真相呢？他又是什么人？


    太深奥、太抽象了对吧？别紧张，下面我会一一剖析。


