    ![](img/f533d0e211a5a2e3b4bb03c08b93c292_224_0.png)


    # 答读者问


    # 1. 拍吧，到你了


    问：小女刚毕业，在一机关办公室上班。办公室一大妈整天炫耀，贬低、鄙视别人，摆出一副自己无所不知的样子。本人内心不强大，经常遭她鄙视，不知道该如何对付此类人？


    答：她骨子里在你面前很自卑，但有经历可以压你。所以，她是在向你发出一个信号：“拍我马屁，给我面子，然后我会回报你！”拍吧，到你了！


    # 2. 厌食其实是害怕和别人接触


    问：厌食症、肥胖症有什么心理上的原因吗？


    答：当然是啊。想一想，厌食的人不想吃饭，好像也不饿，同时，心情抑郁，似乎饭是不洁净的、有危险的对不对？饭，就代表了他的“自我”之外的世界，不想吃饭就是不想和外界发生联系，因为发生联系，对于他来说就是危险的。


    所以具有厌食症的人，大多数是没有热情去和别人打交道的人。


    再来看肥胖症。一个人搞得那么肥胖，肯定是吃多了，但吃多了不仅仅是生理需要，也是心理需要。他心理上需要什么呢？需要占有世界，要把世界纳入他的胃中！


