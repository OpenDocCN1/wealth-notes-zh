    # 8. 溺爱孩子，小心他将来会埋怨为什么他爸不是李刚而是你


    在广州曾经经过一个母亲失手误杀“恶女”的悲剧，让人唏嘘慨叹。祸根就在于父母对女儿的溺爱。


    从小，女儿要什么父母都满足，“关怀周到，无微不至”。上初中时，母亲就为女儿办了银行卡。到案发前，年仅16岁的女儿便拥有了四张银行卡。发展到后来，女儿在家谁都不怕，蛮不讲理，如果不给钱，她就对父母大打出手，狠扇耳光。


    悲剧发生后，女儿的父亲说：“我们夫妻俩采取温和、讲理的方式教育和引导女儿，想了许多办法，可是并不奏效。复杂的社会环境和学校环境，我们无从掌控。”


    我能够理解处于痛苦之中的这位父亲为什么这样说。要一个人从某种心理情境当中醒来是很难的，尤其是他正在承受有自己一份责任的悲剧后果的时候——想一想，就算可以进行自我反思，那还有什么用，还能挽回这一切吗？所以，不如把责任全推出去，减少心理的折磨。


    但其他人，却应该吸取教训。


    即使你对孩子非常好，什么苦都可以为他吃，而且还教育他要孝顺，但如果你溺爱他，在他心理上会发生什么呢？——“你们对我好是理所当然的，而如果不能满足我的要求，你们就对不起我，我会恨你们，我要报复！”


    就是说，溺爱会挫败所有的孝顺教育和对父母的尊重，因为这个人心深处的道德原则被驱逐了！不再有一种从内心深处传来的声音告诉孩子“父母对你好，养了你，你也应该孝顺他们，尊重他们，养他们老”，而是他在父母的溺爱行为中告诉自己“父母对我好，本来就是他们应该的，欠我的”。


    这样，无论他有没有看见和体验到父母的苦，他都会培养出对父母的恨，'
