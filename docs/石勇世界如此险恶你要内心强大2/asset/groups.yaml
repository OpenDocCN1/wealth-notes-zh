    # 20. 心理的秘密，就在人的存在中


    被夹在动物和神之间，在这个险恶的世界，人的心理结构经常遭受打击。这是一个大问题。


    于是，在这个大问题下，一系列的心理问题产生了。心理的秘密，就在人的存在中。'
