    辨能力，但擅长抒情和空发议论的人，更容易被洗脑，更虚伪，更容易人格分裂。


    # 2. 没有理性的人，一但有利益诱惑，他的人格结构就会散架


    你也许会问：为什么一个被训练用语言文字来装的人会有这样的后果？


    我恭恭敬敬地回答：他缺乏一个由理性组成的、独立而强大的自我来支撑他的人格结构。一旦有利益诱惑，他脆弱的人格结构就会散架，轻易就把\[‍\]自己卖出去。


    还有很多虽然也被洗脑，但并不虚伪或人格分裂的人，他们由于有道德感，不会轻易卖掉自我，但后果一定是心理弱小，正如今天很多人一样。


    与此相反，如果他具备强大的分析能力和思辨能力，那么，他就有一个强大的自我来支撑人格结构，谁也别想将他的自我夺走，或者在心理上击倒他！


    # 3. 如果我们习惯了命令小孩，我们将不得不让自己变成一个暴君


    所以，这里不得不又扯到了教育问题。而一个非常重要的原因是，我们长大后有心理问题，都拜小时候的心理创伤所赐，尤其是家庭教育。


    让我们走回去看一下小时候自己。也让我们——无论是否已为人父母——看一下，如何不让一个孩子 在心理上受伤？


    如果你有了孩子，那么，我真的有一个建议：让你的孩子多看看哲学的启蒙书吧，无论他是否看得懂，都没关系，长大以后，那些书，书里面的理性精神，就成了他参与这个世界的知识背景、人格背景了！


    而如果你能够和他讨论，让他学会用理性思考的方法澄清某些问题，那就太好了。


    比如说，你希望他不要随便去买零食，要听父母的话，你采用的不是命令、规劝、恐吓的方式，如“你去买零食我就打你”“小孩子吃零食不好哦，不要去买哦”“零食可能有毒，吃了要生病”等，而是用“澄清”的方式，“不是父母不让你吃零食哦，而是街边卖的那些零食，很多都不卫生，吃了会生病，而一个小孩子，当然要在自己的身体健康负责；同时呢，作为孩子，也有义'
