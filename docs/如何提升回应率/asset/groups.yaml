    **盖瑞：** 半年前，我病重住院，病房里还有一位海地的女人。要知道，我们来自不同的地方，不过是萍水相逢，但她却帮了我很多。有天她说，因为知道我正在接受治疗，所以想要和我谈一谈。我想，谈几分钟话又有什么要紧，就跟着她一起出去了。而出去之后她对我说，“我想给你一些东西。”


    她给我的东西是五颗药丸，并告诉我，“我向你保证，它们绝对是安全的，对你有益无害。这些药丸出自于我们国家的一位降魔圣人之手。”这位海地的女人说得没错，他们那里确实有这号人物，名字是“拜伦·西米恩”。海地女人跟我说，“我知道，你可能会觉得我说的东西都是迷信，但是，只要你能在接下来的五天中，每天服用这一颗药丸，我保证，你一定会感觉非常好的。”


    听了这位海地女人的话，我想，管它呢！反正这个女人又没有毒害我的理由，所以我在接下来的五天中，每天都服用一颗她给我的药丸。接下来，我想谈谈健身房中的那些器械，其中有一个可以折叠三次的设备，上面有很多盘子，还有一个可以上升的滑轮，通过一个金属产生作用。你知道它叫什么名字吗？'
