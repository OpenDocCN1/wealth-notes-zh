    排座位上有一个来自阿拉斯加州的85岁的老教师。我本来以为她听到我讲这个故事应该会觉得很尴尬，然而，她却笑得非常厉害，以致于我都开始担心她可能会在研讨会上突发心脏病。


    现在我也要把这个故事讲给你们听，但讲之前我想告诉大家，这件事情也有可能会发生在你们的身上。在我20岁那年，这是一件真实发生在我身上的事情。


    那时我正在德国服兵役，与另一位宪兵一起进行巡逻任务。我现在还记得，他叫德瑞，是一个身材很魁梧的家伙。有一天，我们被召集到驻地上，脱下制服，站成一排。当时有一位德国市民，想要从我们这组人中挑出一个人来。当集训结束后，教官让所有人都解散回去了，只让我一个人留下来。原来，那位德国市民从我们这组人中挑选的正是我。


    可能大家听到这里会觉得稀里糊涂的，那么，接下来我就要告诉你们，在那之前都发生了什么事情。我是一个非常爱开玩笑的人，所以大家都对我很熟悉。在我们执行巡逻任务之前，大家都是有集合签到到的，就像你们大家在军演中看到的那样。在集合签到的时候，教官会告诉我们，应该提防哪些罪犯，哪个家伙犯了强奸罪，哪个人抢劫了便利店，又有哪个人袭击了农场、谷仓，等等。


    一位农民的谷仓。有位罪犯正在强奸农民的奶牛的时候，正好被农民出来逮到，于是他便将这位农民击倒在地，在两个人搏斗的时候，撞翻了水桶，撞翻了蜡烛，于是引发了一场火灾，然后这位罪犯便逃之夭夭了。


    我们知道，军队里人们穿的所有衣服都是要进行编号的。我有一个船形帽，但是我戴着它太小了，所以我就把这个帽子随手给扔掉了。而恰好那个罪犯当时就戴着我丢弃的这个帽子，他当时在与农民搏斗的时候，帽子掉在地上，他人逃走了，那个帽子却留在了他的作案现场。所以，市民报案后，警察们通过帽子上的编号，便猜测那个强奸奶牛又纵火的罪犯就是我。


    于是，才一眨眼的功夫，我的角色便由一位出色的宪兵转变成强奸农民奶牛的嫌疑犯。接下来，我要告诉大家，这对我的生活带来了什么样的影响。


    在事情调查清楚之前，教官们只允许我做两件事情。一件事就是每天的例行集合签到，还有一件事就是去食堂里面吃饭。然而，每当我去签到的时候，都会发生这样的情况：教官们一点名，“史密斯”，“到，教官”，“唐士”，“到，教官”；“贝克”，“到，教官”。而当教官点到我的名字“亥尔波特”的时候，其余600位宪兵便会异口同声地发出“哞哞”这样类似牛叫的声音。


    你们能明白我当时的心情吗？我从来都没有想过，自己竟然会落到这样的一个处境里。当时我已经与一个德国的女孩订婚了，而之后我也和她结了婚。但当时发生了这样的事情之后，她的父母非常讨厌我。你们能想象当时的情况吗？由于“我与一位耕畜发生性关系而被捕”，所以我不得不坐在那里，向警官们解释，为什么他们会来宪兵所找人，并向他们说明，那位罪犯在作案的那天晚上，我人在哪里。


    这件事情虽然荒唐，但确确实实发生在了我的身上。因此，我不得不通过谎言检测器进行测试。如果没有发生这件怪事，我一辈子可能都没有机会用这么先进的仪器，但是我想，你们也得承认，这是一件多么稀奇的事情。后来他们抓到了真正的罪犯，他是波多黎各人，就是他偷了我的帽子。没让我抓到他是他的幸运，否则我一定会杀了他的！通过这件事情，我就是想说，人的命运，真的在一瞬间就可能发生天翻地覆的变化。而我在20岁的时候，便深刻地认识到了这件事情！


    并且我还学到了，在将来的日子里，一定不要把计划说出来。如果你想要让上帝嘲笑你的话，那么就把你的计划告诉他吧。我想说的是，如果你想要成为一名杰出的撰稿人，或者一位优秀的市场营销人员，或者想要实现所有那些事情，那么，你一定要立即开始行动。因为，没有人知道，明天将会发生什么事情。如果你们所有人都很喜欢我这两个小时的演讲和回答，并且想要再听一遍，那么我可以再讲一遍。


