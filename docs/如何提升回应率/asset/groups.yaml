    **盖瑞**：标题本身就是文章中最重要的一部分之一。顺便说一下，我这里有一个特别好的标题，想要集思广益一下，请大家思考一下它后面所接的内容应该是什么。这则标题是：在迈阿密岸边洗衣服的无精打采的古巴人，心中却藏着能够让大部分美国人民收入翻倍的奇特秘密。


    **米歇尔**：哦，太棒了！


    **盖瑞**：你们知道我曾经写过的最受欢迎的标题是什么吗？


    **米歇尔**：这也正是我想问你的一个问题呢，请继续说。


    **盖瑞**：多巴·伯格宁发誓，她的新香水绝不含有非法性刺激物，然而洛杉矶整个城市都认为含有……性刺激物是合法的？我们请到7000个人来参加她的香水发布会，而那是有史以来最大的香水发布会了。我们无法再邀请更多的人来参加，因为消防局长不允许更多的人进入新都酒店，以免发生安全问题。


    **米歇尔**：哇！


    **盖瑞**：其中一个副标题是，“为了证明在公共场合使用香水的安全性，著名影星的妻子愿意贡献出1000种她自己的新香水的样品”。这便是种小“招数”。


    **米歇尔**：好，实际上根据您说的这些，我还有一个问题。这个问题是盖瑞·赫尔伯提出的，“您认为，在如今这样顾客极其挑剔的时代，您所使用的传统的多巴·伯格宁促销方式依旧有效吗？”


    **盖瑞**：你这个问题根本就无需回答，因为答案太显而易见了。当人类开始用凿子将他们要表达的信息雕刻在石头上开始时，我采用的方式就是有效的，而在2000年之后的今天……嗯……当每个人都使用手机将短消息发送给你的时候，它依旧会有效。


    销售就是销售，千百年也不会发生什么变化。即使互联网时代的到来，也不会改变有关销售的任何东西。让我来告诉你们什么是销售吧。关于销售，其实它只与三件事情相关：拥有潜在顾客，好的商品以及将商品递送给顾客的渠道。


    而整个互联网，实际上就是将商品递送给潜在顾客的一种渠道。你需要记住，人们所谓的“互联网写作”（我知道你会这样做），实际上与报纸写作、直接邮件写作、电视写作都没有什么不同。


    而商品的好坏才是关键问题。我想告诉你们，你们目前正在做的事情是错误的。在所有的网络社区中，你们在向读者递送独一无二的价值之前，却试图想要先从读者那里获取一些东西，这样的做法是错误的。


    我敢说，我有一个在互联网上最赚钱的网站。而坦白地讲，我之所以能建成这个网站，是因为我之前收到了许许多多读者们的来信，他们告诉我，我所提供的信息是怎样改变了他们的生活。


    大部分的来信都与金钱有关，但有时也会有人感激我提供的信息使他们免于犯罪，鼓舞他们努力前进，以及挽救他们的婚姻等等。而我想，既然我的东西对人们的作用如此之大，那么，我想让更多的人受益，于是便将它们都放到了网络上。


    接下来，我便陆续将自己的文章放到网站上。大概过了两三个月之后，便有人写信问我，是否有出售的书籍，他们想要购买。事实上，我放到网上的每篇文章，它们的点击率都会根据我是否在文章标题旁边附加一些内容而起伏不定。但上一次，我将一篇写得很好的时事通讯放到网上之后，它的点击率是1630，并且是在我根本就不知道如何将自己的网站与他人的进行友情链接的情况下！


    事实上，我根本就不知道如何利用谷歌广告词，对其了解甚微。我也不知道如何……嗯……如何将一个网站效果最大化。我对这些东西都一无所知。然而，你们知道为何我的时事通讯还会如此受欢迎吗？因为它里面有吸引人的内容。而你们之中有很多笨蛋，根本不会先想一想如何为人们服务，便想要赚取到大量金钱。


    **米歇尔**：说得好。


    **盖瑞**：我越说就越生气。我……我……嗯……你知道的，在谈论性和政治问题的时候我也会这样。实际上，我并没有真的生气。


    **米歇尔**：嗯，明白。盖瑞，你在这一共要回答大概50个精选出来的问题，而还有……还有一个精选出的问题是……是关于标题的……你知道吗，很多人都说，他们已经看到了太多非常长的标题。首先，你觉得长标题有效吗？还有，当你撰写标题时，你通常都使用哪种形式呢？


    **盖瑞**：好的……嗯……好，我要站在问出这样一个问题的人的角度上，来认真考虑一下。嗯……我可以站在任何人的角度上去思考问题，而这个问题对我来说太简单了，简直就是侮辱我的智商嘛。当然，长标题是有效的。接下来我要向大家提出几点关于标题的建议。


    嗯……如果你在撰写标题的时候不知该怎么往下写了，那么便可以写“如何什么什么事情”来接下去。嗯……如何……还有，顺便说一句，如果有人想要学习写标题的话，那么手中就应该有一本叫做《第一个亿》的书，它的作者我总是记不清楚，不知道是朱莉亚·海德曼还是海德曼·朱利叶斯……


    **米歇尔**：是的。


    **盖瑞**：在美国，这本书是所有好的标题写作的启蒙书。阅读了这本《第一个亿》之后，在你接下来的一生中，无论你要撰写什么样的标题，想必都可以运用自如了。是的，长标题的确是有效的。短标题也是。比如说……嗯……你们会注意到只提“玉米”两个字的小广告吗？


    ![](img/9903961414ae6bbf81370829297a11f0_43_0.png)


    实际上，每个人都不会注意到那种小广告的，除非他们碰巧有鸡眼，那么……那么对这样的人来说，广告中有“鸡眼”这两个字就够了。而如果你是与一位有毒瘾者做生意，那么，你就要说，想要吸食一些海洛因吗？对于有毒瘾者而言，这个标题长度就足够了。但是，对于大部分广告而言，它的受众并不是恰恰拥有“鸡眼”或者“有毒瘾”的人……


    **米歇尔**：我认为……我认为约翰·卡尔顿曾经说过一个词语非常好，叫做“简洁有力”。它并非只是简短和精炼，也不是尽量将标题缩短，导致词不达意，而是尽你所能，用最少数量的词语将信息传达给合适的受众……很多人有时都会撰写那种非常长的标题，导致人们在阅读的时候都会睡着……而我撰写过很多标题，我明白，之所以会出现读者睡着的现象，就是因为作者写的东西不好，或者不适合其阅读……


    **盖瑞**：稍等，我插一句。在这里我想要告诉大家，在写作上真正取得成功与不成功的人之间最大的区别是什么。那就是，成功的作家会将每一位其他好作家撰写的作品买来阅读的。因此，我建议你们，也应该去购买和阅读约翰·卡尔顿撰写的每一部作品。


    **米歇尔**：哦，你说的对……的确应该如此。


    **盖瑞**：其实，我还对他进行过培训呢，当然在培训之前他已经是 很好的作家了。


    **米歇尔**：盖瑞，这是一个很重要的问题，其实，我们和其他那些 好的作家一样，各有千秋，他们可能有各种写作宝典， 而我们也有各种写作秘笈——


    **盖瑞**：哦，天啊，别说了。我要打断你一下。我给你讲个故事。


    **米歇尔**：请讲。


    **盖瑞**：我可以向天发誓，我所说的话都是真的，而且是“新鲜出炉”的。我不知道，你们是否听说过艾瑞克温斯顿这个人，他也从事营销行业，以前在洛杉矶的时候就一直是我的经纪人，如今在佛罗里达也当了一阵子我的经纪人了。


    前几天他给我打了一个电话，说，“盖瑞，我刚从瑞士回来。你知道，我已经不再从事经纪人业务了，但我这里有很多广告文案，以及整理好的销售信，都放在文件夹里。你想要它们吗？如果不多的话，那我就准备把它们扔掉了。”
    挂了电话之后，我问自己，“我想要那些广告文案 和销售信吗？”


    后来我请别人帮我取回了那些广告文案和销售信，共有 200 个文件夹，里面都是成功的、经过验证的广告。200 个文件夹啊！而它们目前就放在我的另外一个房间里。这件事也就才发生三天，我想问的是——我真的需要它们吗？哦，我想，我是不需要的。你觉得呢？


    **米歇尔**：但是，盖瑞，你不也会出售这种类似于写作宝典的东西吗？


    **盖瑞**：对，我确实会出售这种东西。但你知道吗，我并不想把这些东西作为一种商品出售。但我还是要告诉你，我已经举办了多场研讨会，而我曾经讲得最好的一场——迄今为此我也不知道为什么那场讲得最好——我们都知道，在研讨会上进行演讲时，是没有人能把他所知道的一切都清楚地讲出来的——但在迈阿密海滩的那场研讨会上，我却非常放松自然地将自己想要表达的东西都说出来了。


    我的演讲主题是——如何撰写能够使们发财的销售信——这是有史以来最好的文案。你知道吗，那是我第一次讲出自己的两篇销售信代表作。


    并且我还要告诉你一些事情。当我发表那些销售信的时候，我真的很害怕——之所以这样说，是因为那时我觉得，人们听到我的发言，将会向我扔石头。但是我在心里告诉自己，“盖瑞，你要知道，你无非就是一个爬满皱纹的老娘妇，一味地吃屎等死罢了。”但是，有了这样的心里暗示之后，我就不再害怕了，反而让自己的观点得到了在场观众们的理解。而对于“使人理解”这件事，我想说明一下自己的看法。


    如果你是一位自持呼吸器的潜水员，你不需要学习太多东西，但有几件事情是你需要学的————你最好学会它们。因为如果你不学的话，你就有可能在潜水的时候丧命。有件事你要记住：在水下的时候，你千万不要屏住呼吸。接下来，我就告诉你们到底是为了什么。


    我们假设一下，嗯，比如你——你从一个小悬崖上跳进了一个非常深的海洋中，并且屏住了呼吸。你并没有穿戴任何的潜水装置。你深深地吸了一口气，将肺部填满。也就是说，你吸气使肺部达到最大状态。在那种情况下，我们每个人都会倾向于那么做。


    现在，随着你往水深处潜去，水的压力会推挤你的肺部，使得你肺部的空间会变得越来越小。这很正常，不会有什么问题。因为当你慢慢往水面游的时候，压力会越来越小，而你的肺部也会变得越来越大。当你返回到水面时，你的肺部大小就会与你在刚潜入海中的大小一样了。一切都会安然无恙。


    但我们现在做个假设，比如你已经潜到60尺水深处了，而你想要非常快速地返回水面，因此，你拼命吸了一口气，将肺部填满。之后，由于水的压力，你的肺部不断缩小，此时你吸入的气体含量能够达到你在海面时吸入的五倍。


    你不能正常地呼吸，而只能一直屏住呼吸，当你往上游的时候，水的压力会逐渐变小，而你的肺部会不断地扩张再扩张，吸入的气体也会不断地增加，直到肺部无法继续扩大为止。而那时，气体便会从你的肺部跑到你的血液中、大脑中，以及其它身体部位中，最终的结果，你即使不死亡也会残废了。


    因此，你们大家能明白，我通过这个潜水的例子想说明的问题吗？那就是：我在那场最成功的研讨会中，真的一点都不胆怯害羞。我努力表现得像在家里一样放松和自然。但关键在于，我将“教授人们写作”这件事情看作是“挽救他们的财务问题”。因为，如果你们不好好学习写作的话，知道等待你们的将会是什么吗？你们就会不得不为生计奔波。而如果一个人的工作仅仅只为了维持生计的话，那无异于慢性自杀。


    其实这与自持呼吸器进行潜水的道理是一样的。因此，如果是我教人们潜水的话，我敢保证，我绝对不会只是轻描淡写地跟大家说，“顺便说一句，请大家在水下的时候不要屏住呼吸。记住了吗？记住了，好的。”然后就此打住，接着去说下一件事情了。我绝对，绝对，绝对不会这么做！我一定会保证人们真正理解了我说的话，重视和牢记这种安全隐患。因为在营销这个领域，真正要掌握和做好的事情不是很多，但是，就那么几件事情，你真的一定，一定得做好、做对。因为，你不可能随便那么扑腾几下，就能穿过西西西比河，到达俄亥俄州的玛丽埃塔。成功没有捷径和侥幸，一定要脚踏实地，先掌握好基本功。


    **米歇尔**：这是非常重要的一点，因为这个观点，是由这次访谈的主办方——彼得·史东先生总结出来的。


    **盖瑞**：对，是他。


    **米歇尔**：彼得·史东有一些很著名的言论，很多人之前都听到过。你们很可能听到过这句话：好的作品源于产生怀疑之后的片刻停顿。是的，彼得·史东说，好的作品，源于产生批评意见之后的片刻停顿和思考。他之所以这么说，是因为很多人都在他担任调解员的董事会上提出问题。


    彼得·史东就是我的调解人之一，而人们常问我的问题是：你为什么要在一件事情上详细地解释那么多？当我试图回答大家这个问题的时候，我觉得最好的方法就是使用彼得的这句名言，但同时我还会说，如果你从事写作，却省略很多东西，以致于读者不得不自己去思考的话，那么，他们会很自然地倾向于考虑到消极的内容，而那些你真正想要表达给他们的事情，他们很容易会产生疑惑和误解。


    **盖瑞**：对，是这样——你说得没错。但那只是其中一方面。你刚刚只说对了一部分。关键问题是，被文章弄糊涂的潜在顾客们是绝对不会购买的。


    **米歇尔**：正是！


    **盖瑞**：但是你必须要说服大家。接下来我们来谈论一下可信度的问题。这也是其中一个——


    **米歇尔**：对。


    **盖瑞**：可信度，这也是现场提出的问题之一。如果你拥有一个零售点，那么，你就要告诉潜在顾客们，你们坐落在缅因街123号，与邮局正对面，旁边有一个公共图书馆。你还要告诉他们，你们的电话号码以及区域邮编号是什么，比如“216-834-9067”。还要告诉人们，你们的营业时间为：西海岸时间，周一至周五上午9:00到下午5:30，周六日不营业。


    这些事情你都要告诉潜在顾客们。因为你必须要理解，细节可以建立可信度。


    我了解大量关于营销的知识，如果不运用他们，我几乎就无法进行正常的活动。而你们要知道，上天给我们每一个人分配了各种各样的技巧，而有的人会获得大量合理消费的技巧，有的人会获得大量洗衣服的技巧，有的人会获得大量……的技巧，等等，而上天分配给我的技巧99%都是关于营销方面的。但是在生活中，我一路跌跌撞撞，与地球上所有人都一样，都会偶尔出现功能失调的情况。但杰·亚伯拉罕跟我们不一样，他是彻底永远的功能失调，对吗？（开玩笑）


    但你们知道吗，我从电器零售店中购买过一个非常特别的商品，它就像一片口香糖那么大。我买的是——是一台磁带录音机，而在我打开使用说明书的瞬间，我就愤怒了。你们知道那本说明书上写的是什么吗？“怎样设定时钟和日历”。我想要的磁带录音机可不是这样！我想看到的说明书至少应该有一个目录，其中的标题都应该是“什么部件对应何种功能”，因为只有那样我才能知道怎么去操作！


    我也不会使用我的录像机。我购买了一种72型号直接视图形，它并不是投影仪，上面有一个录像机和一个光盘播放器，但是我根本不知道该怎样使用它们。你们知道我是之后是怎么做的吗？知道我的解决办法是什么吗？我又出去买了另一台，好像叫做19型号直接视图形，上面有两个小插槽，一个用来接光盘播放器，另一个用来接录像设备。


    现在和我共事的人有一位是火箭科学家，已经在拿索（巴哈马群岛首府）工作20年了。当我跟他讲述自己买录音机的这个故事之后，他不由得嘲笑了我，并教我怎么使用

    '
