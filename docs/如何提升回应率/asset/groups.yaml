    **盖瑞：**如果人想要致谢，想对我说“我真的非常喜欢你的读谈”这种话，那么，可以给我发邮件，我的地址为：nosegary@aol.com 但是，如果你有任何负面的评论，请不要给我写信，因为我不想听，我只想听正面的评论。我并不需要知道事情的真相，哪怕你们给我写邮件时，对我撒谎都可以。


