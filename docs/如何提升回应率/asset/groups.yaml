    # 盖瑞和米歇尔电话访谈录音：如何提升回应率


    ![](img/9903961414ae6bbf81370829297a11f0_0_0.png)


    ## 盖瑞 · 哈尔波特访谈


    盖瑞 · 哈尔波特 Gary C. Halbert 是美国直复式营销的奠基人，文案撰稿大师。盖瑞 · 哈尔波特的邮件式销售，同时也开创了中小企业和个人创业的营销之路。从此以后，中小企业即使没有品牌，没有资金，没有雄厚的运营实力，也依然可以凭借着自己撰写的销售信，成功完成产品销售。盖瑞
    · 哈尔波特生于1938年6月12日。逝世2007年4月8日，享年69岁。


    **米歇尔·福汀**：盖瑞，你准备好了吗？


    **盖瑞**：我们开始吧。


    **米歇尔**：嘿，盖瑞，欢迎你。朋友们，我们今晚上要进行一次极其重要的通话。这将是我以后要打的几通电话中的一通。如果我也是一位具备独断能力的撰稿专家，也许会主讲其中一通电话。因为我们今天晚上这通电话要谈论的是如何提升回应率，通过撰写有效文案要用到的一些最有效的策略，以及其中需要考虑的紧迫问题。


    我想把盖瑞介绍给大家，但是在介绍盖瑞前，先简单介绍下我自己。我的名字叫米歇尔·福汀，你们中有些人认识我，并知道我是 一名成功的医生。你们可能也知道我曾为如今互联网上那些著名人物撰写过稿子。比方说，我曾为约翰·里斯、亚尼克斯·斯尔娃、迈克尔·金布尔、柯克·克里斯坦森、斯蒂芬·皮尔斯、肖恩·凯西，等很多名人撰过稿。


    之所以会选择做文案撰稿人，因为我当初已别无选择。在我事业初期，我做了一名推销员。以一种极其传统的敲门推销的方法推销产品，当时我的业绩没什么起色。所以，有一天，我决定撰写我的第一封销售信。之后通过撰写文案，我发现身价开始飙升，因为这样可以吸引人们来我这里，听我描述怎样轻松地把产品销售给购买人群。


    后来，我接触到了直邮，就开始写直邮广告，销售信和广告文案。我当时也撰写电视广告，为整形医生和头发移植医生撰写电视商业广告。从此之后，我就决定把所有精力都投入到文案撰稿中。现在，我仅为互联网撰稿。


    在我做文案撰稿工作这个过程中，我相信我的其中一位导师，可以被称为“撰写之王”或是“文案王子”。盖瑞撰写了当今世界，乃至整个互联网中最优秀的文稿，他写的销售信通过网址
    thegaryhalbertletter.com 可以找到（唯一中文版《盖瑞艾尔波特时事通讯》见“秘密行销网” http://xxdd.cc/mimi/detial.php?id=VfdwU1BRPTO=
    ）。他的信可能是网上赚钱最重要的资源。如果学习盖瑞的销售信，你所学到的不仅仅只是最具利益回报的技能，而且，通过学习他撰写的销售信，还会比 99.99% 的人都具有优势。我的意思是不仅仅去读这些信。


    我是说，你至少要做到把其中大部分内容，逐字逐句写下来。从中看一下盖瑞是如何抓住营销的节奏，如何运用心理学，怎样着重处理一些细节的；其中，他又如何讲故事，如何运用情感来笼络人心，如何利用情感因素完成这一系列事情。这些都极其重要。他又是如何提出令人无法抗拒的提议，并且让顾客立刻掏腰包购物的。


    我想告诉你，不久之后当你去撰稿时，就会发现自己撰写的销售信就能抓住消费者心理，让他们购买你的产品和服务。


    所以要做好一切准备，因为我敢说，这次通话可能是你一生中最具价值、最重要的一次通话。好了，在此不再做过多评论，现在让我荣幸地邀请，有史以来最伟大的文案撰稿人，我的导师，盖瑞·哈尔波特先生。


    欢迎盖瑞！


    **盖瑞**：谢谢，非常感谢。


    在真正进入主题之前，我想先说点别的。因为我想激励你，希望你能够真正从这次通话中学到东西。我住在迈阿密，南佛罗里达州的东海岸，这里每天都有从其他国家冲上岸的人，他们中大部分来自海地和古巴。你想象一下，两个古巴人在同一天被冲上岸，他俩大约相隔十英里。他们奄奄一息，不过最后还是都恢复了健康。


    其中一个古巴人以前是一个洗碗工，他从自己工作的酒店里的一位顾客身上偷了 50 万美金，并用一个防水袋绑在了自己身上。也就是说，上岸的时候他身上有 50 万美金。


    另一个人上岸时，除了身上穿的破烂不堪的湿裤之外，其他一无所有。除了他是一位脑外科医生，什么也没有。他原来在古巴是一位脑外科医生。


    现在让我们快进到大约三年后，看一下这两个人的状况会怎样。我猜想，刚开始带着偷来的 50 万美金的第一个人，现在已经不会再有那么多钱，他拿那些钱用来尽情享受，已经把钱都花光了。如今他正在想尽办法来赚钱。


    他可能已经死了，或者在做一些非法勾当，或者在吸毒，也有可能在坐牢或者干其他的行当，不过，他不会有很好的发展。


    那个上岸时一无所有的人，现在居住在迈阿密最繁华的地带，也许他会住在珊瑚海滩。现在拥有一辆奔驰（梅赛德斯），或许还有一位贤惠的妻子，正在组建自己新的家庭，并且在医院拥有一个薪酬颇高的工作，等等。


    这两个人之间的差别就在于，第二个人被冲过来的时候，是带着真正的财富过来的，这才是真正的财富，一个能够创造财富的头脑。人们可以把你的钱拿走，但如果你拥有一个能够创造财富的头脑，就永远不会贫穷。


    你可能当时一文不值，但是这也只是暂时的。我认为，在这个世界上，没有哪项技能比撰写销售信息更有价值。销售信息是电视广告、收音机、报纸广告、因特网中每一条产品信息的信息传播基础。


    我曾经举办过一次我认为是最棒的研讨会，是关于如何撰写能让人富有的销售信，也是如何让文字转变成信息的信件。不过如果你具备撰写销售信的能力，我现在已经具备了，那么日常开支可以减少为一美元十九美分，购买几只圆珠笔和标准白纸薄的花费了。


    你在任何地方都可以写作，可以在热带雨林等很多地方。很多人问我，如果成了一名撰稿人，怎样才能获得客户呢？以此表明，他还没真正掌握这一技术。


    因为一名优秀的撰稿人，从来不用担心寻找顾客这个问题。如果你想获得客户，我的意思是，如果我想工作，我可以保证，一天24小时，一年365天中，永远都不愁没有客户。


    大约三个星期前，我想赚点外快。我花了11分钟写了一封电子邮件，到目前为止，我已经通过这封邮件赚了95000美金。当时只是在无聊中撰写那封邮件。你同样可以做到这个程度。


    现在我可以告诉你我曾经取得的所有成就。很多人也都知道，曾经最为流传的邮件总共寄出了6亿封和相关的内容。并且我可以告诉你，你可以在巴西的丛林中做这项工作，在监狱里也可以撰写。如果你学会了这项技能，那么它就会是你所学到的最具价值，而且是你随时可携带的技能。我可以给你保证，你可以得到任何你想得到的东西。


    你可以利用这一技能获得你想赚到的所有钱，你可以以此技能找到你想要的最满意的伴侣，你也可以利用这一技能进行总统选举。我请求不为两党工作，因为如果我为他们其中一方工作，保证都不会让他们错失选举。所以，学习如何使用好这项技能确实很有价值。


    我想告诉你一些我努力尝试去做的事情，我试着去以一种能对人们产生影响的方式写些东西。因此，我想给大家读两封信。我做过很多类似的事情，以这种形式作为研讨会的开始。不管你的母亲是否健在，都要把这两封信写给她。就假设是她健在的情况下，给你母亲写这两封信，这没关系的。


    我要告诉你，我让他们做的是，我给每人每人两张一类邮票，两个 10 号的信封，让他们在这两个信封的左上角都写上地址，对于信封地址的书写，很多人可能还会感觉比较陌生，就是在信封的左上角上。


    另外我让他们都写上了日期,因为我想让他们永远记得这一天，然后把这封信写给他们的母亲，写上各自的地址。先给你们读这第一封信：


    > 亲爱的妈妈，我最近很忙，没有时间给你打电话，所以就给你写了这封信。你要知道，妈妈，你不仅给与了我生命，而且培养我，令我茁壮成长。

    >

    > 我现在面临着许多压力，由于某些原因，我开始想你了。我突然感觉到，我还没有向您表达我深深的感激和对您深深的爱。

    >

    > 我尤其喜欢回想以前一些特别的事情，记得我18岁生日的时候，您送给了一只金劳力士手表，或者是其他一件礼物。不管怎么样，我会尽快抽时间去看看，能再次亲切地叫您一声妈妈，能够再次感受您的爱。


    我让他们把那封信折起来放到信封里，贴上邮票然后各自把它寄了出去。


    然后，我们以完全相同的方式，让他们写了第二封信，在信封左上角卡片大小的地区，写上他们的名字，名字下面写上他们写信的日期,这个日期和写第一封信之间只相隔几分钟。给自己的母亲写了第二封信，并且在信封上署上自己家的地址，以及他母亲的地址。这一封信是这样写的：


    > 亲爱的妈妈，如果我离家没有这么远的话，我也许不敢给你说下面这些话，这些是从我刚出生起就想对你说的。你把我的生活变成了地狱。

    >

    > 我认识的所有人的母亲都比你优秀。我感觉你是一个老妓子，是上帝创造出的一个垃圾。

    >

    > 说到上帝，他也知道，你的头脑绝对没有这么好使。所以，以免以你的低智商理解不了我所要表达的意思，那就让我再解释得清楚一点。

    >

    > 去死吧，去吃屎！

    >

    > 请不要给我打电话，也不要给我写信，我永远都不想再和你说话。之后不情愿地署上，你的儿子或是女儿，然后签上名字。最后附言：我爸爸也非常差劲。


    我希望能听到你们的反应。不过这是通过电话在讲，而且你们那边被静音了，无法及时听到你们的反应，我就假装听到了你们的反应。下面提问一个在一次研讨会上我问过的问题。


    我不知道这个电话是否能够先解除一下你们那边的静音，以便我能听到你们的回应。我想知道你们当中有多少人认为，你们的母亲因收到这两封完全不同的信，会做出天壤之别的反应。你们认为这种情况会有可能发生吗？


    你能解除一下静音，让他们给我一个回应吗？


    **米歇尔**：可以的，请等一下。好了。


    **盖瑞**：好的。


    **米歇尔**：我，我感觉应该没法解除静音，因为听电话的人太多了，电话线路太拥挤。


    **盖瑞**：好吧。我就假设你们中大多数人都认为，在母亲收到这两封不同的信之后，会有天壤之别的反应。


    那么，我来问你们一个问题，邮寄这两封信在花费上有什么不同吗？显然，花费完全相同。


    邮寄这两封信花费的精力有什么不同呢？完全相同。


    邮寄这两封信所花费的邮资有什么不同吗？完全相同。


    写这两封信所购买的信纸的花费有什么不同吗？完全相同。


    写这两封信在所花费的时间和精力方面有什么不同吗？没有任何不同。好了，其中的一封信会令人产生一种温暖的亲情感，另一封读后则会让人感觉绝望，而且悲痛万分。


    这两封信的不同之处在哪里呢？他们之中只有一项不同，那就是里面的文字，写在纸上的文字。世界上没有什么比纸上的文字更具有力量，不管是人们演讲用的演讲稿，还是电视剧本，还是其他的一些文字资料。总之，文字是世界上的一种最强大的力量。


    现在，在我们深入主题之前，我先告诉你一些别的事情。事实上，写作不取决于你的写作水平有多高，而是你是一个很好的真正的知晓者，你要知道别人不知道的事情，只有这样，人们对你写的内容才会做出不同的回应。


    下面我给你举一个特别的例子。


    让我们假设你正在参加一个纽约的鸡尾酒会，在酒会上有一位光彩照人，非常漂亮的女士，每个人都试图接近这位美女。有的人走过去对她说，可以带她进演艺圈，有些人告诉她自己是百万富翁，有些年轻男士则给她展示自己强健的腹肌，有些人给她谈论自己的名车，还有些人跟她谈论自己的模特公司，等等。但是你知道一个特殊的秘密，而且想博得她芳心的人中没有一个人知道这个秘密。


    你知道她是一个吸食海洛因的“瘾君子”，现在极其想吸食海洛因，来解除毒瘾。每一个人都在盘算如何接近她，然而你可以拿着一小袋白粉走过去，给她瞄一眼，然后对她说“我刚得到了些上好的海洛因，你愿意和我一块儿出去品尝一下吗？”


    那位美女会立马跟你离开，因为你那里有她真正想要的东西。这是一个有点夸张的例子，不过相比于不能让你们明白我的观点，我更愿意举一个夸张化的例子让你们理解清楚。


    所以你所要做的第一件事就是，了解信息。你需要了解相关的人，了解相关的策略，你需要了解很多你不知道的事情。


    我会告诉你们一些类似的事，作为你们了解信息的一个开始。


    假设你的一位很有钱的叔叔去世了，在美国给你留下了一千套房子。由于某些原因，这些房子要在 90 天内卖掉，这些房子都需要粉刷，而且只能粉刷成一个颜色。


    你知道要把这些房子刷成什么颜色吗？我知道，必须把它们刷成黄色。为什么要刷成黄色呢？因为那里大部分房子的颜色都是黄色。如果你住在美国，你可能会把它们刷成银色，因为美国人最喜欢的汽车颜色，是银色。


    这是需要了解信息而举的一个例子。你需要了解这些信息，需要调查相关人的信息。下面我要告诉你一些你不知道，但对于你来说很重要的信息。


    几十年前，克劳德·霍普金斯在纽约市发行量上万的报纸上进行了一个试验，他要把一项产品推向市场。人们可以免费得到这个产品样品，因为他知道，一旦你试用了这个产品样品，就会成为这一产品的终身用户。


    因此，他把这次行动呼呼分成三种方式来叙述。

    - 第一种是，得到这个免费样品的方法很简单，你需要做的只是在一张纸上写下你的名字和地址，然后寄给我们就可以。一旦我们收到你的信件，我们会立刻给你寄出免费样品。

    - 方式二，得到这个免费样品的方法很简单。你需要做的是打某某电话，把你的名字和地址告诉接听电话的客服，我们会立刻给您寄出免费样品。

    - 方式三，得到这个免费样品的方法很简单。如果你愿意的话，可以在一张纸上写下你的名字和地址，然后寄给我们。或者给我们打电话，告诉接电话的客服你的名字和地址。不管使用哪种方法，只要我们知道了你的名字和地址，我们会马上给您寄出免费样品。


    现在我听不到你们说话，我们没法进行沟通交流，但是我假设你们仍在听我讲。在我做电话培训的时候，总有种对着空气讲话的感觉。不过我假设你们在那里听，我相信你肯定想知道这三种方式产生的效果如何。结果是只有打电话的那一方式，获得了三倍的回应率。


    下面是产生这种结果其中的一个原因。


    其他两种方式允许人们延迟做决定，拖延时间是销售的致命杀手。不过请等一下，这个测试是50或者60年之前做的。如果我在 17 个不同的时间段里对这些方式进行测试，结果会怎样呢？每一次让顾客直接打电话的方式都会得到三倍的回复率。我敢打赌，你们有些人不知道这个结果。我还会告诉你们另外一些东西，你们有些人不知道的东西，如果你想成为世界级一流的营销大师，那么你就需要行动起来，多了解类似的信息。


    你知道吗，很多人更倾向于拨打一个 POTS 号码，而不拨打一个免费电话。POTS 的意思是普通电话服务的意识。你知道吗，如果你住在电话区号为 702 的地区，并且让人们拨打带有这个区号的电话号码，会比让人们拨打区号为
    888 或 800 的号码接到更多的免费电话。你自己猜测一下是什么原因，我知道这是事实，阿果拉出版社（Agora Publishing）也知道这是事实，我们已经对此反复测试过了。


    我猜想，人们在拨打免费电话时，担心会遇上个高压推销员，或者打过去之后就直接转到语音信箱了。不过，这都没关系，我不在乎这些结果如何，我只在乎自己知道如何去做，这就可以了。


    你们中的很多一部分人都在网上工作，我要告诉你们一个内部秘密。有一次艾德·戴尔从澳大利亚追踪找到我说，他每去一个地方都会告诉当地人，说自己要成为世界上最棒的撰稿人。并且他也提到，我们今天在这个大厅里面所讲到的每一条规则，对你成为优秀撰稿人都会有所帮助。


    我们谈论着，我说那是一种恭维的话，就这样聊了一会儿。然后我说，嘿，艾德，你做好相关的网站了吗，他说是的，他已经做了五个网站。我说我敢打赌，我跟你交谈三分钟，不管你网站上销售什么产品，都能让你的每个网站的回应率都得到提高。


    他有五个网站，我说如果我赢了，你就得请我吃一顿饭，好吗？他说好的。然后，我说这样做，不要在订购那个页面上写“点击这里订购”。


    顺便说一句，如果你的网站其中有一页上写着“点击这里订购”，那就是在浪费钱。你把这句话改了，跟你说应该怎么去做，你就写上：订购很容易，只需拿起电话拨打某某号码，告诉接电话的客服你的订单信息就可以。


    他做了改变，发现效果不错。之后换了一种方式做改变，因为他不想让其他网络同行知道自己是如何进行改变的。我们在电话交谈时我对他说，嘿，艾德，你是不是欠我一顿饭呢？他说‘我认为自己应该欠你一辈子的饭’，因为他此时获得的回应率最少提升的是原来的两倍，最高的竟然提升为原来的
    10 倍。


    现在，对于你们那些在网上工作的人，有一些网上秘密我不打算告诉你们。我的意思是，你们还未具备接受这一秘密的心理准备，不过我会告诉你另一个更有效的秘诀。


    我会告诉你们几个非常强大的秘密，其中一个是有能力让更多人访问你的网页。米歇尔我当时告诉了你在 AskGary.com 网站上存在的致命缺陷，对吧？


    **米歇尔**：是这样。


    **盖瑞**：你当时说让浏览者留下他们的名字和邮箱地址，这种做法严重阻碍了他们进一步的行动。我在 Classmates.com 上注册了自己的信息，令我很烦，因为他们不停地发信息过来。人们也担心类似的现象发生。


    如果你注意到我的网站就会发现，点击这里可以观看我们相关的时事通讯档案，另外，如果想收到我们网站活动信息的相关通知，也可以点击这里。现在已经有成千上万人愿意接受我们网站的活动信息的通知，因为他们对我们已经比较信任。不过你也不必非得接受我们网站的相关通知，可以直接进入我们网页阅读相关信息。


    你可以直接进入我的网站，阅读网站里的所有内容，我不需要知道你的 web 地址，这一方式真是一个必杀技。要知道，这样你就不止有 500 个问题，可能会有 3000
    个问题要挂在网站上。


    **米歇尔**：是的。


    **盖瑞**：下面存在另一个易犯的严重错误，我感觉你们每个人都开始有这样的疑虑了，你们在想这个人根本不知道他自己在说什么，等等。我接下来要讲关于效率和效益的问题。


    但是，首先我要告诉你，如果你的网站中写有点击这里订购的条目，就是在大把大把地浪费钱，因为我要告诉你写上点击这里订购时，在访问你网页的人当中会有多少人订购。我告诉你平均状况，20
    个访问的人中会有一个人订购。


    你会想为什么会出现这种情况呢？难道这些人只是在随便浏览网页吗？不是这样的，完全不是这种现象。之所以会出现这种现象是因为，打电话订购他们需要的产品比在网上填写订单表格要简单的多。那么你就只提供打电话订购这一选择。然而有些人就会说，我想得到他们的邮件地址。我讲一下这类销售。


    你让顾客打电话订购商品，随之而来的另外一件令人头痛的事就是要在电脑上填写订购单，然而，电脑是造成这一结果的罪魁祸首。顾客打电话来订购，你向他们索要姓名、邮寄地址、信用卡卡号等一系列信息。如果你把其中一个号码填颠倒了，电脑就会发出信息填写错误这一报告。我认识一位叫斯科特·凯恩斯的，他是位优秀撰稿人，也是我的一位好朋友。在第
    17 次对一款软件订购信息填写错误之后，他最终放弃了在网上的订购。


    你要知道，订单表格的填写是影响销售顺利进行的一个致命障碍。每一个想下订单的顾客都会因此无法购到物品，以致到手的钱白白地溜走了。


    不过，我告诉你们的这些事情是相当有效的。下面我给你们讲一些效率和效益之间的不同。


    我出生在西弗吉尼亚州的帕克斯堡市。那个地方在西弗吉尼亚俄亥俄河旁边。如果你沿着这条河往北走30英里，到达河的对岸，那就到了俄亥俄州的玛丽埃塔市。那么，密西西比河大约在俄亥俄河西面一千英里远的地方。


    那么，你想象一下，两个人乘坐一个独木舟在密西西比河上划行。我不管他们是往哪个方向划行，往北也好，往南也好。不过他们都熟练掌握了独木舟划行技巧，他们娴熟地向前划行者，几乎很少使水面泛起波纹。你可以设想一下他们奋力向前划行的那种场景。


    就像在网上购物的那些人一样，他们俩奋力向前划行，不过你猜测果会怎样，他们永远不会到达俄亥俄州的玛丽埃塔市。因为玛丽埃塔市不在密西西比河。


    现在假设把某人放在俄亥俄河上，而且没有独木舟，只给他一根木头并且只能用手划行，这是他可以采取的最有效的方法了。不过只要他是往北划行的，他最终会到达俄亥

    '
