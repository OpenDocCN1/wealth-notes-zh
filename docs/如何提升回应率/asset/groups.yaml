  md: '

    第一台录音机。但我就是这样低能的人，什么都不会用，而他们却想让我在没有说明书的情况下，自己去鼓捣明白，我不得不承认，对我来说，真的是一种挑战。


    如果世界上有任何人，或者在这场讨论会上有任何人想要让我喜欢他的话，那么，我希望他们也可以对我多进行一些了解。我其实是这样一个人：我从来都不会回答别人给我的电话留言；我根本就不知道该如何回答那些电话上的留言；我不想回到家之后，知道有人给我留言了；我甚至不想知道有人给我打过电话。我想要一部根本没有任何特殊功能的手机，不要拍照功能，不要来电显示，不要储存号码，不要让我用手机建立“待做事项”清单，不要功能齐全得像一位个人数字助理，不要让我用手机建立日历。任何功能都不要！


    如果你给我打电话的时候，我正好在电话旁，接听了它，那么我们就开始谈话。而如果没有接到它的话，那么我永远也不想知道，有人给我打过电话。你们能理解我的想法吗？我只需要能够给别人打电话，也能接听别人给我打来的电话就行了。除此之外，再无其它。我想要的，就是一部没有任何特点和额外功能的手机！


    在一趟飞往洛杉矶的航班上，由于我的孩子们从迈阿密出发，所以为了打发 5 个小时的孤独时光，我决定阅读手机的使用说明书，来了解它都有哪些功能——所述这件事可能与我们今天的主题没有什么关系。但当时我决定阅读一下使用说明书。我要阅读它。


    而阅读之后我发现，在解释说明电子产品的功能时，是要遵循一些特定的规章制度的。首先，电子产品说明书要翻译成 17 种不同的语言；其次，所有文字都要在半角模式下输入。还有，在说明手机的主要功能之前，必须要先将那些晦涩难懂的政府条例解释一番。


    而我的手机就具备所有下列令人惊讶的功能：你可以用手机查询巴黎的湿度；可以了解你潜水时的具体深度；在爬山的时候，你还可以通过手机定位知道自己爬了多高，等等，等等。还有，你们有些人已经知道，我的这款手机中还包含三款视频游戏，其中一个游戏叫做“贪吃蛇”，它的玩法就是：随着你不断地喂那些爬动着的蛇吃东西，它的尾巴会变得越来越长，而游戏的难度就越来越大。


    第二天，我顺利抵达洛杉矶。当我在一家咖啡厅里正对此事发牢骚的时候，旁边一个可爱的年轻女孩对我说，“哦，你的手机里也有贪吃蛇？我和我所有朋友的手机里也有！”因为我的手机里有一款“贪吃蛇”游戏，我便成为了“时尚俱乐部”中的一员。


    而这并不是我想要看到的世界的样子。我想要看到的世界，应该是简单和直接的。比如说，一个打火机，那么它就应该只用来点火，而不是除了点火之外，还可以用作指南针，还可以接收邮件等。我真的已经受够所有这些附带着一堆额外功能的东西了。哎，我跑题了，当我没说好了。


    **米歇尔：** 但是，盖瑞，你已经把问题讲得非常清楚了，因为我认为，你通过手机的这个例子，实际想要表达的想法是：在进行写作的时候，总有人倾向于努力将所有的细节都写进去。然而，问题的关键在于，你不仅仅要尽可能表达得具体，还要能够做到，吸引人们将整篇文章都读完。实际上，其中一个问题就出现了，“你是怎样做到一段接一段地、顺利地下下去的呢？”比如说，如果你遇到了写作障碍，会怎么样呢？


    **盖瑞：** 我从来都不会出现写作障碍，并且我可以教给你们每一个人，如何才能做到这一点。永远零障碍写作。只要 30 秒钟的时间，我就可以想到接下来该要怎么写。你相信吗？我知道，通常情况下你们都是这样的。你们会先写下一些自己知道的东西。比如说，“我想要向大家介绍一款新的搅拌机”……而写完这句话，你就卡住了，不知道该继续写什么了。


    我告诉你们，在这个时候，你要开始写一些“废话”。“什么，什么，什么的”。就这样不停地写这种废话，直到你想起来自己应该怎么写——“我向大家介绍一款新的搅拌机，嗯，它不仅不可以搅拌蔬菜和水果，还可以搅拌胡桃和砂锅菜。”什么，什么的……然后你接着往下写。要知道，防止一位作家产生写作阻碍的办法就是笔头不断地动起来。只要没有灵感，你就可以不停地写，“废话，废话，废话，废话，废话，废话”，只要每次你都这样做，写作的障碍一定会消失不见。无论有无灵感，你的手指都要在纸张或者键盘上不停地运动，哪怕只有“什么，什么，什么的”这种废话。


    **米歇尔：** 真有意思！我觉得这点说得非常好，因为很多人都很容易将撰稿人与编辑人混淆使用。你知道吗，他们会比较重视“编辑”的工作，而不是“写作”的工作。


    **盖瑞：** 是的，他们投入到“编辑”的工作太快了。的确，写作和编辑二者缺一不可，但是，在你进行写作的时候，你无需考虑“编辑”的工作。我想要告诉大家，你们每一个人都有，而约翰·卡尔顿和我却没有的东西是什么。我觉得本文文加也没有。那就是：我们几个人的脑海里，以及我们的手中都没有任何障碍！无论怎样，写作过程中不要有疑虑，不要考虑是否属实，是否冒犯了管理机构，等等这样的问题你都不要想，你只需要尽己所能，将第一稿非常快速地写出来就可以了。


    这第一稿，一定是写得越快越好。你就当作是天赋权利，随便你写什么都可以。


    当然，在写完之后，你们每一个人都要牢牢记住这一点：你已经写出了一些东西，但是，这并不意味着你就可以将其邮寄出，或者将其出版了。因为你所写的，只是一个草稿而已。但是对于这份草稿，千万不能失去热情。不要将未出生的婴儿杀死腹中。此时，你要开始发挥你的创造力。而对于创造力，我还想向大家推荐另外一条准则。


    当你最初开始谈论一个想法的时候，如果有个人对你说，“我完全不认同你的想法”，那么，你要尽你所能，狠狠地打掉他的牙齿。就是这样，使劲打掉他的牙齿，将他踢出你的房间，因为他不配与一个真正充满创造性的人共处一室。我们可以允许别人提出异议，但是绝不能容忍，自己的想法还没有说出来就被人全盘否认。毕竟，我们也很难产生灵感，提出一些新的想法的。


    **米歇尔：** 说得好！非常精彩的回答，盖瑞，非常感谢你与我们分享这些。我这里还有另外一个问题，也是刚才你说的一部分：人们应该经常做什么样的练习，才能像优秀的、一流的撰稿人那样下笔有神呢？


    **盖瑞：** 我认为，大家都应该用手写的方式撰写销售信。实际上每个人每天都应该手写一封信。对了，我突然想起一件事，为了避免过会儿忘记，我就先说出来好了。在这次访谈中，我想免费为在场的每个人做一件事。我可以那么做吗？


    **米歇尔：** 哦，当然。盖瑞，请继续说。


    **盖瑞：** 我可以教会你们每一个人如何做到——如何将你的网络利润提高至少三倍，你可以通过一个金属物体做到这点。我不能通过网络将这个金属物体递送给你，只能通过邮寄的方式送到你的手里。所以你要做的事情就是，请给
    the garyhalbertletter.com 的洛葛仙妮写一封信。重复一遍，是 “the garyhalbertletter.com 的洛葛仙妮 ”。在信中注明你的常用邮寄地址，然后我就会将那个金属物体邮寄给你——并会向你说明应该如何使用它，我保证，一定可以将你的利润提高三倍。


    现在，如果大家信任我的话，我还希望你们能够在信中注明自己的联系电话号码以及传真号码。当然，这不是必需的。但我保证，绝对不会滥用每一个人的信息。你们应该了解我，我不是一个会
    “滥用 ”任何东西的人。我平时是不会每天都发邮件，或者给人寄东西的，但为了保证您能收到我们的包裹或者传真，我们一定会查看邮件的。因此，您只要将常用的邮寄地址发给我，我就会立刻给您邮寄这种金属物，并教您如何使用它，保证您可以将自己的网站利润提高三倍。大家说，我这种保证如何呀？


    **米歇尔：** 这一——这真是太棒了！事实上，这也正引出了我的下一个问题——盖瑞，我知道你过去也谈论过这个问题，只是谈得不太深入罢了。这个问题就是：如何构建一个真正可信的保证呢？我记得，不久之前你谈到过，保证人们赚取双倍利润是要有方法的。但是我记不清是在哪一场研讨会上你说过这个问题了。


    **盖瑞：** 确实，我经常向人们提出“赚取双倍利润”的保证。


    **米歇尔：** 那么，请说一说，“撰写一个好的保证”有什么技巧呢？


    **盖瑞：** 嗯，我想想……


    **米歇尔：** 你写过的最好的保证是什么呢？


    **盖瑞：** 我第一次撰写这种保证文案，是为《企业家杂志》担任外聘顾问的时候，当时我负责撰写“深度分析”栏目的文章。《企业家杂志》将我写的这些报告出版销售，大概售价为
    60 到 70 美元，报告内容就是关于花店如何赚钱，或者如何开始一项卖气球的生意等等。报告的第一部分就是笼统地讲一下，要先将你的名片印好，取得营业执照等；接着第二部分就是告诉大家，在某个特别的生意中，具体应该做什么事情、怎样做，以及当生意由于退货频率太高而受到重创之后，该怎么办，等等。


    当人们不断要求老板退货，而老板一筹莫展的时候，我会对他说，“别担心，我可以为你解决这个问题。”而老板们会问，“你打算怎么做呢？”而我会回答，“我可以使你赚到的钱是人们要求退款的两倍。但做到这一点是有条件的。”条件就是：


    - 向顾客寄一本书——并且附上这封销售信——告诉顾客 “只要你们严格按照我们所说的去做，我们保证你们可以在生意中获利。”把书籍寄出之后，如果反响还不错的话，那么，你首先必须要做的，就是获取营业执照。


    而你必须做的第二件事，就是向顾客索要他们的印章、信封和名片等等。你要对顾客们说，“如果您试用 60 天之后，并没有赚到钱，那么，只要是严格按照我们所说的去做的，您便可以将反馈信息寄回给我们，但要盖上您公司的印章，附上您营业执照的照片和您的名片。”这么做之后，就可以防止人们随便要求退款了。


    销售额因此提高了 50%，并且几乎没有人要求退款了。你知道人们在什么时候想要退款吗？他们——我告诉大家，人们会在何时会决定退款，那就是：在他们订购的时候。当然，有些时候确实是因为你的东西太烂，所以人们想要退款。但是大部分时候，人们在最开始下单订购时，就已经想要退款了。


    接下来我想谈谈在减肥产品上的做法。我说过很多次，我们不能过分推崇某种减肥产品，因为实际上根本没有药监局检查过它。所有宣传的信息都是源于名人轶事。但是我们相信,
    这次的产品效果会非常好, 所以想要将这种 “减肥丸” 寄给您试用一下。


    您可以按照说明书上的简单指示, 一天服用两次。在您服用 60 天之后, 如果您的体重较之前一点都没有减轻, 那么, 请您将之前装减肥丸的空瓶子寄回给我们,
    并附上反馈信息。请您在之前与减肥丸一起寄给您的卡片上注明, 您的确是按照要求, “每天服用两次, 步行半天” 这样去做的。还有, 您的医生的名字和地址, 以及您去找他体检,
    他同意您开始这项减肥疗程的具体日期, 请将以上这些信息都写在反馈卡片上。


    这么做看起来或许有些狡猾, 但是, 您这样做之后, 即使是药监局, 又能有什么非议呢？你要在顾客开始减肥疗程之前, 请她先去看医生, 确认她的体格与体质是否适合,
    如果你不这样做的话, 实际上是对顾客不负责任的, 对吗？遗憾的, 根本就没有人这样做。


    关于退款, 我还想告诉大家另外一件事。退款周期越长, 退款频率就会越低。你们知道最糟糕的事情是什么吗？就是在广告中宣传 “保证 10 天退款”。因为这样的保证会使顾客脑海中一直记得这件事,
    “再过四天, 我就可以把这东西退掉了。”


    记住, 要把退款保证日期尽量延长, 可以是半年或者一年。你觉得, 会有人在购买某件“半年退款保证”的产品后,一直细数着日历上的日期变化,就等着在最后一个月的最后一天将这件小产品退回吗?
    他们会记得要找我歇尔·福丁进行退款吗? 不, 一定没有人会这样做。因此, 保证时期越长, 退款频率越低。“双倍退款保证”一定是要在某种特定条件下的, 但是我发现,
    有人在效仿我现在教给你们的这种方法时, 使用不当, 会向顾客提出的荒唐的、无理的要求。


