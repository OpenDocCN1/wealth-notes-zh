    恩，这款软件叫做 Intellimime，它获得了专利技术的商务执照。任何人都可以通过此软件，用 61 种语言进行全球范围的网络搜索，来寻找他们感兴趣的任何话题、产品或者服务。而这项技术是与联邦政府签订合约之后进行发明的，目的是为了查找网络上与恐怖分子相关的聊天内容。


    已经有好多个美国政府机构运用了此项技术，成功地帮助了很多商务企业，使得他们能够获得新的潜在客户，以及在几乎零预付费的条件下展开很多新的生意。


    这项 Intellimime 资料挖掘技术，可以用来帮助几乎各行各业的人来达到市场支配地位。我们通过测试，便可以与世界各地成千上万的顾客取得联系，给他们每个人发送邮件，向其销售适合他们的产品，并且不需要花费一分钱。


    还有，这款软件非常的智能。当搜索主题的范围变小时，软件会继续对搜索内容进行提炼，并且不断地增加邮件地址。我们认为，这项技术改良一下，便可以替代传统的网络搜索引擎了。


    如今，人们会使用谷歌，雅虎或者是 Ask Jeeves 来查找需要的信息。在传统的搜索引擎下输入一个关键词，可能就会出现成千上万的相关信息，然后人们再从中去查找自己需要的信息。


    而另一方面，而戴夫他们发明的这种搜索软件的知识平台中，所有的资源都是很有条理，根本就不需要按照如今传统搜索引擎的方法去查找东西，并且对广大用户非常负责任，会向人们提供他们拥有所有权或者一部分股权的产品和服务。换句话说，这项技术可以保证免费向我们源源不断地提供新的潜在客户的信息。当然，它还有一些其它功能，但基本上，恩，这款软件的过人之处，戴夫今天才告诉我。


    通过这个软件，可以对网络上的信息进行内部筛选，而最终呈现给人们的，只有对其产品或服务真正感兴趣的潜在客户名单，恩，并且速度非常快。这个软件，正体现出最大、最强的专业技术。


    他们的战略的一个重要方面是，尽可能对所有地方的产品和服务建立最全面的知识入口。而从本质上说，知识入口包含了任何人所需要的关于任何主题的全部信息/知识和资源。


    比如说，他们将会提供聊天室、论坛、图书馆、可下载视频产品、相关旅行的折扣信息、近期活动的日程表、与某一特别产品或者服务相关的独一无二的、具体的资源，等等。


    而每条资源，都是经过强大的知识入口提炼过的，将会为每一位客户和潜在客户们提供独一无二的信息，这样一来，不仅你公司中的产品，还有世界各地你所在行业中的商品，都会慢慢受到顾客们的信任。


    与当前的搜索引擎不一样，戴夫他们的技术能够将所有的重要信息都整理到一个体系中，而当人们在网络上搜索对某一话题特别感兴趣的人群时，便会自动生成对此话题有着共同兴趣的名单，并可以邀请他们加入到专门的组织中。


    这个知识平台中的资源，都是很有条理 的，所以人们不再需要以如今的方法去搜索。戴夫他们认为，通过向大家提供丰富的内容信息，他们将会创建强大的用户粘性，并向用户提供他们拥有专利权以及拥有一部分专利权的产品和服务。他们发明的这项数据挖掘技术，在处理垃圾邮件问题上，据说要比类似的技术至少强十倍以上，并且比类似的技术更加定向得多。


    这项技术的发明者还认为，虽然已经做得很好了，但他们依旧还有很大的提升空间。因此，我们只需期待着他们更大的突破和进步就好了，反正又不需要我们投资一分钱。


    戴夫他们得到许可，将来若需要对这项技术进行任何改进和提高，他们还有 4 千万美元的经费可以使用。也就是说，他们可以通过与美国政府机关目前的合约，利用这 4
    千万美元，不断地更新和提炼这项技术了。


    现在，我不知道你们是否都听明白了，但就我个人理解，他们已经发明出这项技术，已经将其通过电子邮件推荐给一些生产商，并且迄今为止没有一个人不支持。因为，通过这项技术可以找出对你所销售的东西感兴趣的人。但是，如果你想要给他们打电话，请记住：我并没有参与其中。


    这并不是我的一个合资企业或者其它任何东西，只是我经历过的一些事、认识的一些人罢了，我将这件事情讲给你们听，就是希望你们不要把我当做石器时代的人而已。


    跟戴夫合作的那个人叫做大卫·埃·凯克奇，他的电话号码是：310-265-8644。你们这些怪才，做事情总是大大咧咧的，根本就不会先跟人家去礼貌地握手或者沟通，所以我要把人家
    的信息交待清楚，以免到时候出现麻烦。记住，是凯克奇，K-E-K-I-C-H，他的邮箱是 transvio.com，网站是 www.transvio.com，重复一遍，T-R-A-S-V-I-O。


    告诉戴夫和凯克奇，是盖瑞·海尔波特将你推荐给他们的。其实你无需提我的名字，只是我觉得，他们会很好奇你怎么找到他们的，想要知道是怎么回事。


    希望大家明白，我的手机除了打电话和接电话之外，不用于做其它任何事情。所以，如果你们有人想要将个人网站的利润立刻提高三倍的话，请将你们的常用邮寄地址发送给我。好了，目前我想到的就只有这些。


    米歇尔：谢谢你，盖瑞。你，你说得太好了。但是我必须就此打住了，因为我们已经超过规定的两个小时时间了。在此感谢今晚参加这场访谈的每一个人，恩，盖瑞，非常感谢你与我们分享这些精彩的内容。


    盖瑞：如果有任何人想说，“哦，天啊，盖瑞，你昨晚那场访谈实在太精彩了”，或者类似的话，请给我写信，邮寄到nosexgary@aol.com这个地址。你们什么都可以跟我说，但是不要卑躬屈膝的话，也不要已经过期的信息。


    米歇尔：好的。我还要提醒大家一句，千万不要写邮件问我，“为什么盖瑞的邮箱是nosexgary@aol呢？”因为我知道其中原因，但是不想讲出来。


    盖瑞：是吗？那我是不是应该现在讲一下？还是……


    米歇尔：不不不，还是不要了。如果有很多人感兴趣的话，盖瑞，我们或许可以在下一场研讨会中给出答案。


    盖瑞：好的。


    米歇尔：再次感谢你的到来。


    盖瑞：客气。


    米歇尔：晚安了，各位现场的朋友。


    盖瑞：再会。


    米歇尔：再会。


