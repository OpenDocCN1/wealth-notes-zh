    位德国市民，想要从我们这组人中挑出一个人来。当集训结 束后，教官让所有人都解散回去了，只让我一个人留下来。 原来，那位德国市民从我们这组人中挑选的正是我。


    可能大家听到这里会觉得稀里糊涂的，那么，接下来我就 要告诉你们，在那之前都发生了什么事情。我是一个非常 爱开玩笑的人，所以大家都对我很熟悉。在我们执行巡逻
