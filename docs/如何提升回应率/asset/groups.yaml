    销售就是销售，千百年也不会发生什么变化。即使互联网时代的到来，也不会改变有关销售的任何东西。让我来告诉你们什么是销售吧。关于销售，其实它只与三件事情相关：拥有潜在顾客，好的商品以及将商品递送给顾客的渠道。


