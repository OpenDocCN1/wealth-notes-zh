    米歇尔：是彼得将我们聚到一起的，而他也 是一个非常杰出的撰稿人。彼得是我的编辑，为我分担一部分工作。并且当我有时过于集中于某件事情，导致“当局者迷”的时候，彼得会头脑清楚地帮助我分析一下情况。因为有的时候我会在一个月的时间里，撰写5篇，10篇，甚至是15篇文章，工作量太大，难免会力不从心。


