    ## 对话：关于故事、挖掘与写作


    **盖瑞**：我去了健身房。我把指针拨到最后一级重量那里，也就是其最高重量了。而就是在这样的最高重量下，我将其推下，又将其拉起，反复做了30次！


    **米歇尔**：哇哦！


    **米歇尔**：哎，医生们都……问题是，那些药丸到底是什么呢？事实上，我也可以做到在最高重量下重复30次，并且我也有这种药丸，只是不是从海地女人那里得到的罢了。而我只是想通过这件事情来阐明，人们已经失去这种讲故事的本领了。


    **盖瑞**：每当你跟我说这件事的时候，都会让我把全部的注意力都集中起来。约翰·卡尔顿好像也是你那样说的。当你准备销售一些东西的时候，千万不要指望在一间商店或者类似的地方便能将它们销售出去。而是应该考虑一下，将你的朋友约到某个酒吧中见面，两个人只是闲聊，然后，你可以故作漫不经心地，将你想销售的产品以第三人称的口吻介绍给你的朋友，并表现出作为一个消费者非常喜欢这个产品的样子。或者，你还可以亲自编一个故事，讲给你的朋友听？


    嘿，你们知道吗，我突然想起来一件事，几天前恰好发生在我身上的。你们大伙不妨先猜测一下？好了，我不卖关子了。我觉得，很多人的文章中都缺少这种东西，而且也是提问清单中很多人都提到的一个问题——人们经常会说，“我没有故事可讲啊。我要怎样为产品编出一个故事来呢？”


    事实上，你一定是有故事可讲的，只是没有进行足够的调查研究罢了。世间万物，都是有故事性的。约翰撰写的一则“独腿打高尔夫球”广告，背后便隐藏着这样一个故事。约翰曾经用了三天的时间，与那些打高尔夫球的人进行交谈。直到其中一个人向约翰透露，有个打高尔夫球的人只有一条腿。而约翰惊呼，“什么？那个人只需一杆，便能在球道上打出
    350 码远，并且他只有一条腿，而你们此前竟然没有人觉得这是一个重要信息，竟然没有人告诉我？”之后的事情大家便知道了，约翰撰写了一则广告，题为“独腿打高尔夫球”。


    **米歇尔**：这，这正是吸引人的故事啊！


    **盖瑞**：所以，如果有人说自己没有故事可讲的话，那就只能说明其挖掘不够深。请你们记住下面这个故事：当克劳德·霍普金斯接受任务，为一种啤酒撰写广告的时候，就讲故事而言，他根本就找不到任何事情，可以使这种啤酒与其它啤酒区别开来，但是他注意到，这种啤酒的制造商采取了严密的预防措施，才使他们酿出的啤酒干净无菌。于是他就在广告中写出了这个故事。


    事实上，所有其它的啤酒公司也都是那么做的，但是只有克劳德·霍普金斯讲出了这个故事，从而使其宣传的啤酒出了名。所以说，世间万物都是有故事可讲的，只看你是否愿意往深处去挖掘了。你们知道大部分广告文案撰稿人们都做错了的一件事情是什么吗？他们不肯付出努力，不去挖掘深处的故事。


    米歇尔：对，就是这样。


    盖瑞：他们不努力挖掘深处的故事，却一味地寻求简单的方法，一颗灵丹妙药，一顿免费的午餐等等。事实上，作为撰稿人，一定要潜心创作，笔杆子要勤，要全情投入。只有努力付出，才能有所回报。


    米歇尔：那么还有一个问题，你怎么了解潜在顾客们的想法呢？


    盖瑞：哦，这个问题我记得之前读到过。事实上这个问题潜在的……


    米歇尔：是的，你说的没错。


    盖瑞：其实我觉得，这个问题太愚蠢了，如果可以的话，我一定会痛扁提这个问题的人一顿。人们总说，如果你不知道问题的答案，你就没有资格怪问题愚蠢。我不同意这种说法。我认为这就是一个愚蠢的问题，但在这里我还是简单地回答一下吧！


    如果你想要了解你的潜在顾客们的想法的话，那么，你可以和他们一起闲逛，可以采访他们，可以阅读和了解他们的相关资料，可以向他们提出各种各样的问题，等等。关键在于：你一定要通过实践去了解他们的想法，而不能凭空猜测。人们常犯的一个错误就是，他们会想当然地以为，别人都是跟着自己相同的思维和角度去看待问题的。而事实却并非如此。其他人跟你想的不一样。你知道吗？实际上，每个人看待事情和问题的角度都是非常非常不一样的。


    昨天我经历了一件算是比较严重的事情。嗯，先说明一下，我女朋友在哥斯达黎加，由于服务信号不太好，所以我们两人相互打电话都很不方便。因此，在我们用电话联系不到对方的时候，便使用语音邮件，我留言给她，她听到之后再通过语音邮件回复我。


    而我却做错了一件事！上帝，耶稣！我竟然忘记了周日是她的生日！呃，她之前还告诉过我！上帝啊，请原谅我这个愚蠢之人吧！我也不是第一次干这种蠢事了，好在我觉得，我女朋友这个人应该不太会把过生日当回事。


    在周日那天，她给我打电话。她在语音邮件中说，“你知道吗，今天是我生日。我的所有家人，我的所有朋友都给我打电话送祝福了，然而我最想听到的，就是你对我说一声‘生日快乐’，我兴冲冲地给你打电话，却发现你根本没有给我任何留言。”因为那时我已经将语音自动回复设置为，“您好，我是盖瑞，我现在忙，请您留下名字和电话号码，我会尽快给您回电话。”我女朋友听了，告诉我，她给我打过电话了，并留言说，“我是希瑞恩·派卓，联系电话
    833-0754，方便时请回电。”瞧，在她生日这天，我让她失望了。


    我知道自己似乎把事情给搞砸了，所以赶快出去为她买了精美的生日礼物，但却没有重新设置自动回复的语音信息。我认为，我女朋友是能体谅我的，因为使用这样的自动回复，在处理别人给我打的电话的时候还是有效率的。除了电子邮件，再没有别的途径可以联系到我，除非你给我打电话的时候，我正好在家。但由于我一周之内平均会收到
    600 个来电，所以也不可能每个都接到。


    所以我觉得，在处理日常事务时，如果对方需要我的联系电话，那么我就将号码留给他，这样一来他便可以给我留言，那么我们之间的沟通就会很有效率。


    事实上，通过语音留言的确有效率。但你知道吗，只需要每个月付 7 美元，我就可以再开通另外一个语音服务，而我却没有那么做。而我的女朋友给我留言之后，我却没有及时回复她，还让她听到我所设置的“官方自动回复”。那是她给我的留言！她的留言不应该受到与别人一样的待遇！尤其是在她生日的那天！即使我送了她好几千美元的礼物，即使在她抱怨之后，我和朋友汉克一起为她唱了生日快乐歌，但她还是不开心！因为在她看来，我要是重视她，就应该及时回复她，或者专门为她开通一项语音服务！大伙能明白吗？她需要专属留言！


    米歇尔：嗯。


    盖瑞：而我却完全没有意识到她真正的想法，还将语音服务作为与他人沟通联系的一种便捷方式呢。所以说，智慧不一定随着年龄的增加而增长的，我就是如此，根本没有考虑到我女朋友的心情！


    米歇尔：太棒了，盖瑞，谢谢你，你举出的这个例子非常恰当，引人深思。我觉得，嗯，很多人经常还会忘记一件事，尤其是在他们写文章的时候。嗯，你知道是什么吗？人们总会忘记，总有些地方，是存在撒谎的理由的。而约翰·卡尔顿就非常赞成人们去找出那些理由……


    盖瑞：是的，任何存在撒谎理由的地方他都非常善于找到。


    米歇尔：还有，我还经常做的事情是，不仅大量地去采访客户或者潜在客户，同时也尽可能多地亲自使用所销售的产品。而很多人却自己都没使用过，便自以为是地说，“我认为，我的客户不会这样做，或者我的客户不会那样做。”


    肯尼迪有句话说得很好，“人们总是自以为是地认为，他们能够完全代表自己客户的想法。事实上并非如此，每个人永远都不可能知道他的客户到底在想什么。”


    **盖瑞**：首先，嗯，我只会用一半的时间去做人们交代我做的事情。而剩下的一半时间我会用去做人们没有交代我，但是他们需要的事情。因为有时候，人们是不知道自己需要别人帮忙做什么事情的。而这也是我不愿意回答太多问题的原因，因为大部分听我访谈的人，根本就不知道应该问哪些合适的问题。我这么说，并没有冒犯大家之意。实际上，每个人在最开始做一件事情的时候，都不知道自己需要什么或者该问什么。


    **米歇尔**：哦，盖瑞，你提出的这点非常好，不过很抱歉，我想打断你一下，因为在大家提到的问题中，有一个我也困惑不解，嗯，嗯，那就是“我有一件产品。我应该怎样将它销售出去呢？”还有，我现在想要把你那篇关于“饥饿人群”的时事通讯文章发给大家。


    **盖瑞**：好啊，没问题，你当然可以把那篇文章免费发给大家。但是，嗯，你知道吗，对于你提到的这个问题，嗯，我的答案是：人们总是认为，如果你是一位足够优秀的广告文案撰稿人，那么，你便可以将任何东西销售给任何人。但是就我自身而言，我真的没有办法将冰箱销售给爱斯基摩人。我可以在文章中欺骗他们，谎称那是真空加热器，但市场才是最重要的。如果市场对这种商品没有需求，那么我在文章里说得再天花乱坠也是无益的。嗯，我还想给大家提另外一个建议，在这场访谈结束之前，我会向大家推荐几本非常重要的书，而其中应该人手一本的就是邮件列表手册，作为标准参考数据系统来使用。


    米歇尔：嗯，好的。


    盖瑞：大家可以在网上购买，也可以去图书馆。而这本手册数量有限，希望大家抓紧时间购买。该手册列出了全美国所有可用的邮件列表，从中可以看到，某个列表的范围有多广，是何时建立的，以及销售单位是什么，等等。


    还有，这本手册上的列表与谷歌上的广告词或者类似的东西有很大的不同，因为这些列表上并不是记录人们喜欢什么，或者对什么感兴趣，而是列出了人们平时都会购买什么。这些列表会告诉你们，人们会购买什么。即使是网络购物，这个信息也要比其它任何资源都有价值的多。事实上，你可以在网上买到这本手册，它的价值是其它东西无法比拟的。


    还有，我可以告诉你们每一个人，你们是否担得起“撰稿人”这个头衔。你们任何一个人，如果无法做到下面这个事情的话，那么你就永远不应当通过写作赚取一分钱。


    你们应该浏览一下我推荐的这本邮件列表手册，选出你认为最受欢迎的列表，然后通过这个列表，总结出一个具体的信息产品。最后你要给那份列表上的所有人发送邮件，向他们销售这个信息产品。


    接下来，我要告诉大家一个获取信息产品的一种非常便宜的方法。当然，我这也是从杰·亚伯拉罕那里学到的。他是这个世界上最适合进行头脑风暴的人，并教给我该怎样跟他合作。我与杰只在一起头脑风暴了
    30 分钟，他使我产生了很多灵感，然后我通过这些灵感赚到了 75 万美元。我和约翰·卡尔顿合作了一封销售信，我将它邮寄给 800 个人，然后就赚到了那 75
    万美元。


    米歇尔：哇，哇！


    盖瑞：是啊，那个家伙非常聪明！但是，但是之前艾瑞克也提醒过我，应该怎样与杰相处和合作。那就是，如果你有次机会与杰合作的话，一定要邀请他到一个安静的宾馆房间中，并让参与头脑风暴的每一个人都将手机关掉。顺便说一下，我记得罗恩·罗格朗说过一句话，“在你与一个人进行交谈的时候，你可以通过在整个过程中他将手机来电挂断多少次来猜测，他的银行账户里有多少钱。”但在与杰进行头脑风暴的时候，永远都不需要挂断来电手机，而是在最开始的时候就关机。否则的话，就是对杰的不尊重了。


    言归正传，刚才说到将杰邀请到安静的宾馆中。你要派两位威猛硬汉开豪华轿车去接他，然后将他带到安静的宾馆房间，锁上门，拔掉房间中的电话线，防止一切来电打扰，然后开始对他进行访问，同时还要使用录音机进行录音。当杰第一次说到，“哦，是啊，那是一个好想法。我之前写过一封销售信，就是解释说明这个想法的，但是这封信在办公室里面，要等我回去之后再邮寄给你。”


    当你听到杰说这种话的时候，你一定要打断他，并且不能相信他的话。因为杰就是这样一个人，他现在承诺的东西，离开这个房间之后就都不作数了。所以一定要让他在这个房间中吐出有价值的东西来。唉，我也不知道这与我正在谈论的东西有什么关系，就当胡言乱语吧。


    **米歇尔**：不不不，没有，你说的这些都与头脑风暴有关，很好。


    **盖瑞**：哦，那就好。


    **米歇尔**：让我们回到作家们会产生的“写作障碍”这个问题上。当人们绞尽脑汁，却也想不出该在文章的哪里“勾人眼球”，或者该怎样讲述一个好故事的时候，他们通常会说，“算了，我根本就没有任何独特的销售卖点”，或者“我根本就想象不出吸引人的文字，”或者“阅读我的文章的人形形色色，我怎么知道能够吸引到他们每一个人的事情是什么呢？”而我认为，这时利用头脑风暴，大家集思广益，就不失为一个好办法。


    **盖瑞**：看吧，你们在场的很多人都会不停地审视和怀疑自己，认为客户不会喜欢你的东西，他的妻子不会喜欢你的东西，管理机构也不会喜欢你的东西。


    实际上，每个人的身体里都装着一个内置审查员。而你们要做的，就是要扼杀这个身体里的审查员。不要一味地自我审视和怀疑，而应该从头开始，将整篇文章洋洋洒洒地写出来。如果你不知道该这么宣传一个人，那么你可以先去了解他的产品，了解他获得的那些荣誉证书，了解他在之前投放的广告以及他之前所有的管理方法，你要对他进行采访，并且还要采访他的员工，他的顾客，等等，等等。你们要明白，最后呈现给读者们的作品只是冰山一角罢了，之前作家们都是要进行大量的准备工作的。我曾经为多娜•米尔斯写过一篇文章，她是诺茨兰町公司的风云人物。


    **米歇尔**：嗯。


    **盖瑞**：多娜•米尔斯那时正在销售，嗯，哦，美瞳产品。我飞到加利福尼亚州的圣塔莫尼卡采访了她，不得不说，她真的非常平易近人。在我的采访文章出炉之后，有人说，“天啊，你写得真好！”也有人说，“你写东西的速度好快啊！”还有人问我，“撰写这篇宣传文章花费了你多少时间呢？”


    而我回答说，“33 年的长期积累，再加上 45 分钟的厚积薄发。”


    ### 米歇尔：真棒！你回答得真好！


    盖瑞：多娜·米尔斯的例子就算讲完了。接下来，我要跟大家分享另外一件事。约翰·卡尔顿拥有一个特异功能，他知道世界上的每一首歌，并且能够使吉他说话。我也希望自己弹吉他的水平能够像约翰那样出神入化。


    当我告诉约翰自己的这个心愿，并向他请教其中的秘诀是什么的时候，他对我说，“当一位新手告诉一位老手他要弹吉他，并拿起吉他时，老手会问他两个问题。第一个问题是：你一周上多少节吉他课？而这个问题根本无关紧要，无论新手给出什么样的答案都无所谓。”


    而第二个问题是，“你平均一天会练习多少个小时呢？”这个问题的答案才是关键。并且约翰还说，实际上，这也是很多事情的答案。听完他的话，我坐下来认真思考了一番。在我成为盖瑞·亥尔波特，名扬四海之前，我也总是将其他成功者作为榜样。我从
    1968 年开始就进行写作了，但直到 1975 年左右，才发表第一篇文章。你们知道吗？这期间大概是 1 万个小时！而你想要成功的话，也要付出这么多的时间，其中没有任何捷径！


    如果你想要自己的文章达到本·富兰克林、艾尔波特、卡尔顿、斯考特·汉斯这些人一样的水平，那么，从现在起，你也要投入大概 1 万个小时，然后你也能做到。你需要从明天起就开始行动。


    你需要从我的销售信或者他人的销售信开始，在接下来的每个工作日中（至少是接下来的 1 万个小时中）亲手抄写它们。你们看到了吗？现在我已经不再需要参照任何的模板了，因为它们已经全部深深地印在我的脑海中了。但是你们大部分人都还没有到达我的这种程度。所以，你们必须也要通过亲手抄写，努力将各种文章范本记在脑子里。


    米歇尔：我认为还有一个关键点是：你必须要立刻开始行动。我曾经学到过一件事情……好吧，如果不是曾经遭受过打击，我也得不到这个教训……那时我正在为约翰·里斯撰写文章，他教会我一件事，实际上，是在他的一个研讨会上听他讲的。这件事是：如果你想要写作，如果你想要学习如何撰写文章，或者撰写任何东西，并将它们放到网络上，那么，你一定要做好最坏的心理准备，就当作你的文章是史上最差的文章。而接下来你的工作，就只是将糟糕的文章不断地进行改善。


    盖瑞：约翰真是个天才，他……


    米歇尔：绝对是！


    **盖瑞**：他说的完全没错。约翰是个天才，他的做法完全是正确的。


    **米歇尔**：所有人都这样问我，“米歇尔，你是怎样成为这样一位伟大的撰稿人的呢？”而在回答的时候，盖瑞，我并不会像你那样，而是说，“我并不是一个好的撰稿人，而是一个狂热的测试员，我的文章，都是经过不断测试和修改的。”我可以撰写文章，并且我的文章又都很成功，所以我觉得自己真的很幸运。


    但是，当我测试文章的时候，我知道，什么有用，什么没有用，并且会不断地进行改善。而约翰·里斯的话真的令我醍醐灌顶，因为在很多时候，作家进行写作时，总会来来回回思考自己之前所写的内容。


    有时我在撰写销售信的时候，会时不时地回过头来思考一下，经常头发都被自己挠掉了，因为我在努力地去想，还有没有更好的方式来表达呢？其实，管它呢！写出来就是！就当做是我写得最差的一篇文章好了，以后我可以再慢慢地进行改善！


    **盖瑞**：好的，米歇尔，我要告诉你，你可能已经表达出最重要的观点了。而我的朋友杰奎因·德珀萨德是用另外一种非常简洁的方式进行表达的。他说，“任何有意义的事情也都是从头做起的。”你们知道吗，从前的我，绝不会去做任何自己不擅长的事情。但是，你们也知道，在我们刚出生的时候，我们是不擅长做任何事情的。


    米歇尔：对。


    盖瑞：你们知道吗，在一场专业对业余选手射击锦标赛上，一位业余选手对一位专业选手说，“跟你同台竞技我觉得很尴尬”。专业选手问，“为什么呢？”业余选手说，“因为这是在你的职业主场上，你穿着非常专业的射击服，你的射击方法也非常厉害，绿茵场上，你简直就是主宰嘛。”而这位专业选手说，“好，那么，在经过
    20 年的苦练之后，如果我不能达到如今的这种水平，你难道不会觉得有一点奇怪吗？”这位业余的射击选手，就是在将自己与一位已经练习了 1 万个小时的人进行比较。


    米歇尔：是的。


    盖瑞：我想说的是一个非常重要的观点，那就是：要将加速度进行加速，那就要不停地进行加速。我这句话的意思其实就是说，世间万物都是在不断变化着的。其实，每个人都不可能肯定地知道自己在未来的
    24 小时之中要做什么，也不知道未来的 5 年、5 个月或者 5 个小时之中会做什么。很可能在某一时刻，你就会像演员克里斯多夫·李维一样，由于某种疾病而早逝。因此，我奉劝大家，如果你想要做什么事情的话，最好立刻就着手去做。


    事实上，我和蒙文（蒙文的斯考特·汉斯）两人都非常坚定地认为，如果练习或者撰写文章是你第一优先要做的事情，那么，你知道应该什么时候做吗？你应该每天在睡醒之后，在你的双脚碰到地板的时候，甚至是在整理床铺之前，就开始做这件事情。因为，生活中总会有各种各样的事情会牵扯着你的精力，占用着你的时间，如果你不在跳下床之后立刻就开始行动的话，那么，你就很有可能再也不会去做这件要紧的事了。


    你可能会说，“我吃过午饭就开始练习”，也可能会说，“我要在晚饭之后又开始练习”。等等，等等。所以说，只有你每天一起床便立即就做的事情，才能保证肯定做成。嗯，还有，我还要告诉大家另一件事情，我认为，也该将其总结一下了。


    米歇尔：是的。


    盖瑞：接下来我要与大家分享一个真实的故事。人生在世，你不仅不知道自己下一刻将会在哪里，并且也不知道在下一秒会有什么样的怪事发生在你的身上。而我现在就是要告诉大家一件曾经发生在我身上的奇怪的事情，而那件事使我在非常小的年龄，就拥有了超越旁人的一个很大的优势。


    那件事情发生在我只有20岁的时候。我在多场研讨会上都讲过这个故事，而有一次，我在讲述这个故事时，在前

    '
