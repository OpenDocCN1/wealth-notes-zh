    **米歇尔：** 哦，盖瑞，你当然是啦。


    **盖瑞：** 或许将来我有可能忘了你说过的这些话，但它们真得很受用。米歇尔，你说的很对。


    **米歇尔：** 好，盖瑞，与之相关的还有另一个问题。之前有人提出过这样一个问题，“最近有很多人都说，他们看到了好多大肆宣传的文章，尤其是在网上看到的特别多，那么，怎样才能写出更真实、不那么大肆宣传的文章呢？因此，你能说出大肆宣传的文章与诚恳真实的文章之间的区别吗？你知道怎样写出宣传色彩不那么浓的文章吗？你要怎样确保自己文章的客观性，不撒谎呢？”


