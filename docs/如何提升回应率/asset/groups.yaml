    60 到 70 美元，报告内容就是关于花店如何赚钱，或者如何开始一项卖气球的生意等等。报告的第一部分就是笼统地讲一下，要先将你的名片印好，取得营业执照等；接着第二部分就是告诉大家，在某个特别的生意中，具体应该做什么事情、怎样做，以及当生意由于退货频率太高而受到重创之后，该怎么办，等等。


    当人们不断要求老板退货，而老板一筹莫展的时候，我会对他说，“别担心，我可以为你解决这个问题。”而老板们会问，“你打算怎么做呢？”而我会回答，“我可以使你赚到的钱是人们要求退款的两倍。但做到这一点是有条件的。”条件就是：


    - 向顾客寄一本书——并且附上这封销售信——告诉顾客 “只要你们严格按照我们所说的去做，我们保证你们可以在生意中获利。”把书籍寄出之后，如果反响还不错的话，那么，你首先必须要做的，就是获取营业执照。


    而你必须做的第二件事，就是向顾客索要他们的印章、信封和名片等等。你要对顾客们说，“如果您试用 60 天之后，并没有赚到钱，那么，只要是严格按照我们所说的去做的，您便可以将反馈信息寄回给我们，但要盖上您公司的印章，附上您营业执照的照片和您的名片。”这么做之后，就可以防止人们随便要求退款了。


    销售额因此提高了 50%，并且几乎没有人要求退款了。你知道人们在什么时候想要退款吗？他们——我告诉大家，人们会在何时会决定退款，那就是：在他们订购的时候。当然，有些时候确实是因为你的东西太烂，所以人们想要退款。但是大部分时候，人们在最开始下单订购时，就已经想要退款了。


