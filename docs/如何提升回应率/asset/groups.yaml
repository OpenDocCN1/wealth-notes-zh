    所谓“招数”，可以是在信件的顶部粘上一张美元钞票，这样人们便能够快速地注意到它。你理解我的意思吗？这种做法就叫“招数”。招数，可以是在信件顶部粘上一张真人照，也可以是一张钞票，或者类似的东西。


