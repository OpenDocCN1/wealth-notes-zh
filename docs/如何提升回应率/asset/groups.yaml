    一位农民的谷仓。有位罪犯正在强奸农民的奶牛的时候，正好被农民出来逮到，于是他便将这位农民击倒在地，在两个人搏斗的时候，撞翻了水桶，撞翻了蜡烛，于是引发了一场火灾，然后这位罪犯便逃之夭夭了。


    我们知道，军队里人们穿的所有衣服都是要进行编号的。我有一个船形帽，但是我戴着它太小了，所以我就把这个帽子随手给扔掉了。而恰好那个罪犯当时就戴着我丢弃的这个帽子，他当时在与农民搏斗的时候，帽子掉在地上，他人逃走了，那个帽子却留在了他的作案现场。所以，市民报案后，警察们通过帽子上的编号，便猜测那个强奸奶牛又纵火的罪犯就是我。


    于是，才一眨眼的功夫，我的角色便由一位出色的宪兵转变成强奸农民奶牛的嫌疑犯。接下来，我要告诉大家，这对我的生活带来了什么样的影响。


    在事情调查清楚之前，教官们只允许我做两件事情。一件事就是每天的例行集合签到，还有一件事就是去食堂里面吃饭。然而，每当我去签到的时候，都会发生这样的情况：教官们一点名，“史密斯”，“到，教官”，“唐士”，“到，教官”；“贝克”，“到，教官”。而当教官点到我的名字“亥尔波特”的时候，其余600位宪兵便会异口同声地发出“哞哞”这样类似牛叫的声音。'
