  md: '什么叫势呢？就是趋势。比如说未来十年，甚至三十年，只要不发生极端的战争，整个世界的数字化就是不可抗拒的浪潮、势能。所以，你要给市场更乐观的预期，你就必须显示出你的技能是未来所需要的，而不是在未来可以被取代的。


    一旦这种预期被市场认可，你就会发现，自己作为一个资产的价格会“嗖嗖嗖”地往上涨。


    一个非常典型的例子，就是传统媒体行业已经夕阳西下，无可挽回了，对不对？但是你去看一看，现在市面上绝大部分自媒体大咖，其实都是从传统媒体跳槽出来的。


    我认识好多这样的人，他们有个共同的特点，就是对过去毫不留恋，对于那些并不清晰的将来具有强大的好奇心和去改变的意志力。其实，这就是我认为的预期思维。你只有具有这种预期思维，才能够顺利地转型。


    其实，在今天这种技术迭代、社会飞速转型的当下，我觉得预期思维真的不是一种奢侈品，而是一个标配。


    不管是国家、企业还是个人，预期会内生于自己的决策，然后塑造我们当下的状态。


    # 划重点


    +   1. 一个国家、企业，或者个人的资金实力不再受限于原始的积累，而更取决于你给市场的预期。这个预期越乐观、长期、稳定，你能获得的资金也就越多，期限越长，而且成本会更低。


    2. 预期思维是一种关于未来的前瞻性的思维方式，借用未来为现在提供动力。换句话说，关于未来的想象、判断和信念会塑造今天我们自己的状态。


