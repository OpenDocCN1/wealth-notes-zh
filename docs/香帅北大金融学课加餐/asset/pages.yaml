    # 今日概要：


    划重点


    +   1.经济周期就是经济发展中的波动， 它和信贷金融周期之前有极强的内生 关系。经济预期的好坏调节着信贷规 模的大小，而信贷规模决定着社会 生产规模，最终影响到经济周期。

