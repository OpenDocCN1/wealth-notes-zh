    # 划重点


    +   1. 在金融学的维度上，不同的贴现率会将同样长度的时间加工成完全不同的价值。


    2. 贴现思维是一个长远和未来思维，短视的思维会埋下高损耗、高折旧的根子，提高折旧率，也就是提高实际贴现率，然后导致市场价格降低。


