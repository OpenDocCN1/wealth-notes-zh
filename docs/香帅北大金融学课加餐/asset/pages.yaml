  md: '调整中国经济增长的 模式吗？要把经济增长 速降低下来，转向追求质量，不追求数量 的经济增长。


    从长远来讲，这句话非常正确。但是， 从2019年的情况来看，中国面临着经济的 数量增长上的一个“硬约束”，那就是党在 十八大文件中明确强调过的“到2020年年
    底，中国经济要翻番”的目标。


    这样严肃的大目标，对于党和 governments 来讲是 “硬约束”。在这么个 “硬约束” 下，我们对政府的调控就可以作一些 判断了。


    根据前些年中国经济增长的情况，如果我 们要完成2020年经济翻番的目标的话， 2019年和2020年大约要维持6.2%到 6.3%的GDP增速，稍微增加一点点安全边
    际，那应该这两年 的增速维持在6.4%、 6.5%左右。


