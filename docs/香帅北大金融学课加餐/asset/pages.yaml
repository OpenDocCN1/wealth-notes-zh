  md: '# # 春节加餐！这么操作让父母的储蓄稳定升值


    你好，欢迎来到香帅的北大金融课。


    春节又快到了，我即将返乡给爸爸妈妈爷爷奶奶亲戚们，准备回答结婚、生子、工资这几个经典问题。


    但是说真心话，这几个七大姑八大姨的问题，只不过把父母真正让我们很多人抓狂的真相：父母的钱需要过，更宽裕的晚年，这也应该是今天更有尊师的话题，希望你可以跟你的父母一块儿来听。


    我知道，有的父母觉得丢人碍都懂，在今天课堂的里面，仿佛准备做一做“五”小类的测试题。可不妨请你们做，如果他们的错了的话，你就可以理直气壮地邀请他们一块儿来听题，


    我收集的这七个问题，其实是稍微有点长中国人的大，尤其是二线城市以下区域的年轻人中国人所具有的典型金融思维。


    比如说，国有大银行就等同于金融，国字头单位，比如央企就等同于信用，是国有机构的红包，他们就会看着能用。还有房地产投资的股，个人贷款是背债，得抓紧还。


    这些逻辑的出现，并不奇怪，一方面目前老龄化和老龄化的50后和60后是中国高龄富，是，这俩代表着改革开放以来的受益者，同时二代是革命老地方的传统民族。所以，至今咱们中国几千万亿的居民存款，50后、60后占据着重要的份。


    但另外一方面，咱们中国从上个世纪的九十年代开始，才开始接触资本市场的这个概念，50、60后，甚至是部分的70和80的金融知识其实都是非常薄弱的。金融知识基本上就是微博。用不用银行和信用卡和信用卡的区别都不能搞。更不要说市场形态形形色色的金融创新产品了。那自然，这样一个高净值、又知识储备的老龄化人群会怎么样？会是所有合法的非法金融产品的梦想目标群体。尤其是那些非法的金融产品，大量地制造骗局，单体会将很多人一生的积蓄化为泡沫。


    我这里说一个冷酷的，但是真实的话，在我们这样一个社会福利体系相对不发达的国家，积蓄着是晚年生命尊严的一个重要保障。所以，保护好父母的积蓄是至关重要的。


    说句不算题外话的题外话，我和我的团队曾经稍微研究过一下中老年人的生活质量，包括身体健康情况，我们发现，影响生活质量最核心的是养老储蓄，即使在有高端国家政策也一样。换句话说，储蓄的老龄人口和无储蓄的老龄人口是具有完全不同的同义的。


    这个逻辑很有争议，但是实际上咱们这些当道都很难让出钱。


    好了，那么接下来的问题就是，怎么保护父母的储蓄呢？这是同样的道理，每家每户的情况大不相同。所以，我们不如可着就具体的资产配置建议，比如说买股票房子和股票要各投资多少钱，海外资产要不要？


    但是，对于老年人口，我们有一些最基本的资源原则，这些原则在课程其他章节曾经讲述过，今天我把它再梳理开来总结一下。


    # ## 第一个原则：生命周期原则


    这个原则强调的就是，一个人的资产配置必须和你一生的现金流流在时态上是相应的，否则一旦发生错配，就会影响效率，甚至引发危机了。


    可能你还会记得，在课程的开头，我跟你强调过，咱们人在年轻的时候，要尽量配置一些长期的大资产物资产，用贷款加点杠杆，用时间换空间。


    在中平，现金流充裕的情况下，首先要为上到下配置养老、医疗和教育的保险。然后，在这个基础上，加高风险点的投资，比如股票、股权投资等等，去追求高收益。


    好了，那下面是今天的重点，退休之后，或者说现金流减少之后，我们父母这一辈要干什么呢？一定要及时地杠杠，尽量减少配置风险资产，例如说，到了一定的年纪，比如说60+，一定要避免把现金往高风险的资产上投，小盘股、概念股，还有形态多变的股玩投资，大体上都可以认为在高风险的。一定要避免高杠杆的资产上放。


    另外，因为年龄大了，渐渐会有一些医疗、这个时候要为自己年轻时好好保障的人，这个时候也要相对宽松一点，如果配有保险，也不要紧张，保持自己的流动性。比如说如果你50多岁手里是流动性很高的资产，可以把它转换为债券、银行理财，这种流动性更高、安全性比较好的产品。


    所以，低杠杆，低风险，高流动性是父母资产配置的第一原则。这种生命周期原则其实说的是在什么山上唱什么歌。


    # ## 第二个原则：风险匹配原则


    很多同学，什么是高风险？学过我们课程的同学应该还有点印象，风险可以简单理解为波动，比如说一个资产的风格过山车一样忽高忽低，这就叫做高风险。


    但我觉得，更准确的答案是，如果对一个资产，比如说一个公司的股票不清楚，甚至连公司干的都不是不清楚，说不清楚，那不管别人说得多天花乱坠，对你而言，这就是高风险资产。


    衍生一下，比如说2017年开始流行的炒币，区块链这些概念，即使专家家算，或者说者告诉你，这是百倍、千倍收益，对你而言，它也是高风险。


    巴菲特有句说，我看不懂的东西不要。股神如是说，你说得我们普通人，尤其是已经步入老年的父母，真有哪种末卜先知的智慧吗？


    除了看不懂的高风险以外，还有的是号称高收益的各种金融骗局。这是近几十年中国土地上新近改头换面，但是核心不变的庞氏骗局。


    比如说，前面用几个月的高收益钓鱼，然后诱多你的资金入场，前面的忽悠，吸引更多的人进来。然后拆东墙，西他他他带资进跑路。这种例子举不胜举，而且，在不同的地区，还会有不同的变种。


    所以，这里给出的第二条简单粗暴版。根据经济周期的冷热，则是单年化利率超过15%-20%的投资，你都很需要警惕。


    你想一想，如果这样的金融产品还有人继续来问吧，你问父母，基本上就可以宣判了。拜你所赐，这种高回报的投资项目，在市面上早被坑了，那么还会来推？所以，这种情下的谨慎问，直接用一句总结：无事献殷勤，非奸即盗。


    所以，这里也总结一下第二点，你可以告诉父母，不懂、不熟，就是我们的第二原则。其中，尤其要强调的是收益，低风险产品，因为天下没有白吃的午餐，即使下可能得到此利，你，要考虑到被坑中的概率如此小，低，还是省省吧。


    所以，这两条原则一定要讲给父母听，避免他们一辈子的积蓄，在子女成家奋斗的日子里被人惦记。


    # ### 财富怎么保值？


    如果他们问你，我这储蓄保值怎么做呢？你可以跟他们一块儿去具体的管理数据，然后根据你的具体情况进行具体分析。


    从2007年到现在，通发膨胀率平均是2.5%，也就是说如果你的积蓄，每年的收益率在2.5以下是，你是没有。


    然后我稍微总结一下了过去去年的情况，还有未来的趋势。过去十年银行定期类资产，属于中长期的存款利率比通胀率要差，至少要60%。另外A股的大盘也是赔钱的，过去十年，大盘的收益率是1.5%，也比通胀率要高一点。但是如果买个股，就比较少赚了，而且，个别的大盘，但是亏了几幅，而更多的是一亏为大了。所以，个股的风险比大盘更大。


    那么去年真正帮你赚钱的是什么呢？一线城市核心三线城市的地市，平均年化收益...'
