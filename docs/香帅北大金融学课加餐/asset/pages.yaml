  md: '板上市的概率最低。


    为什么？我给你打个比喻——一个巨轮是可以深水上航行的，因为海洋有足够的水深承载轮船。但是巨轮在水滩里只能下浅淤泥，被搁浅，因为承载不起。


    阿里这样的企业，几万亿的市值——是典型的巨型轮船，你想需要多大的水深才能承载起这样的轮船？以科创板现在的体量，和这样的巨型企业是完全不匹配的。


    此外，阿里当时没有在香港上市，就是因为阿里的合伙人制度和阿里不保留不符合“商业价值观”的核心，双方谈不拢。


    实际上，很多创业企业都会有些对自己“创新力”“价值观”进行保护的制度设计，这要求交易所同时有创新风格，能在制度设计上具有弹性——纳斯达克是这方面的表率。科创板在交易制度设计上的路径很长，不是一蹴而就的。优秀的具有创新力的企业对于回来会非常谨慎——即使要回，港交所从目前而言也是一个更有吸引力的选择。


    总之，伟大是熬出来的——交易所也不例外。


    # 3.关于科创板的实操问题


    **绿色咖啡**


    老师能告诉我们，科创板股票如何交易吗？


    **香帅**


    个人投资者入市有门槛：


    +   第一，申请权限开通前20个交易日证券账户及资金账户内的资产日均不低于人民币50万元


    第二，参与证券交易满24个月。


    满足这两个条件的投资者可以申请开通科创板账户，直接交易科创板股票。如果不具备开通科创板条件的，还可以通过购买公募基金发行的产品，或其他金融机构发行的理财产品的方式，来间接投资科创板。


    **玮我有禅**


    创业板打新收益效果怎么样？


    **香帅**


    主板打新收益的重要来源之一是23倍市盈率限制发行定价，并且在上位资源紧张的环境下，壳具有价值。这两点基本逻辑在科创板不适用。


    但是，短期情绪溢价如此之高，短期收益会很好，时间稍长，会出现分化，有的公司会破发（开盘价低于发行价），到时候一定是有人哭有人笑。


    **185***3818**


    对于散户，怎么样才能更多地参与到科创板，比如有一万元能钱想全部投在科创板，直接买股票门槛不够，已经发行的科创公慕基金，申购一万元才几百。那还有没有其它渠道把剩余的钱全投在科创板？期待老师回答，在线等！


    **香帅**


    从我的角度看，小散要参与，就短期里参与一下打新。或者试试科创板公募基金，其他配置一些打科创板股票的公募基金——投资风险大，入市需谨慎。


    **carman lueng**


    香帅老师，科创板对中国的一级市场的股权投资提供了一个退出场址。请问早期的股权投资人在科创板上市后多久能从二级市场退出？


    **香帅**


    《上海证券交易所科创板股票上市规则》第四节“股份维持”中规定：“上市公司控股股东、实际控制人自公司股票上市之日起36个月内，不得转让或者委托他人管理其直接和间接持有的首发前股份；上市公司核心技术人员自公司股票上市之日起12个月内和离职后6个月内不得转让本公司首发前股份。”具体细节见《上市规则》。


    **令狐不冲**


    香帅老师好！一如之前听课的感觉：酣畅淋漓、切中要害、引人遐想、于无声处，非常棒，超过值的讲座。有两处困惑，请高老师指点：一是假设科创板运作，对创业板、中小板乃至主板的退市机制能否产生革命性的影响？二是以最具估值估计，科创板市值化机制的形成大概需要多长时间？2年，还是遥遥无期？盼复，谢谢！


    **香帅**


    目前A股退市比例就3%多，科创板一定会比这个数高——对其他的影响，我觉得暂时不要作过于乐观的估计。改动从来比建设新城难度要大，何况是资本市场这样的“城”。


