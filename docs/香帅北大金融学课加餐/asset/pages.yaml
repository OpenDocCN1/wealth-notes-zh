  md: '香帅好，我有两个疑问：1.定向增发，既 然挺复杂，上市公司为什么不选择公开 发行募资？而要限制在10人以内，还有1 年的锁定期？2.公司股票回购，回购之
    后可用于重新分配（股权激励），还可 以注销（总股本数量减少），从公司利 益等考量，是否很少有回购直接注销的 做法？


    这是一个实践性很强的问题。这个问题听上 去很复杂，但实际上很简单。所以，我也简 单回答一下。


    为什么我们中国的A股市场经常是做定向增 发，而不是直接公开发行呢？这是因为咱们 公开发行的审核非常严格，流程很长，公募 本来就是这样，所以，整个过程的成本也会
    比较高。定向增发其实就是私募。所以，涉 及的交易方，包括金钱，信息，都要低很 多。而定向的流程就没有那么复杂，在金融 行业里属于比较简单，的业务。


    那为什么要锁定呢？就是为了避免短期的投 机炒作。定增是这样的，因为它是私募，而 私募有点像大规模批发，都有10%的折扣。 所以，如果没有锁定期话，今天增发，你
    卖给我以后，我明天就卖掉，那就会变成赤 裸裸的利益输送。所以，一定要有锁定期， 如果没有，就从一个投资行为变成一个纯粹 的投机炒作行为了。


    股票回购以后，基本上就是两种处理，一是 重新分配，一种是销毁（让总股本变少）。


    其实，销毁这种方法见是不常见，它在香 港市场上就特别常见。为什么呢？因为把总 股本变少以后，每股的净资产就提升了，就 可以提升股价。股票回购以后销毁，对股东、
    投资者都是利好。


    但是，你会发现，在中国A股市场上，这种 回购以后销毁的情形比较少，为什么呢？主 要是跟法律相关。因为这对于公司来说相当 于缩股，会引起一系列法律的流程。本来
    是一个很简单的形式，但是，因为法律的规定， 它又变得很复杂，在操作中就显得没有 那么简单。所以，很少会有人用。


    这就是关于公司经营的几个特别实践性的 问题，一个是并购，一个是反向收购，也 就是借壳上市，还有一个就是定向增发。希 望你通过这几个例子，对于金融市场上常见
    的这些名词和现象有了更深的理解。


    香帅


    因为今天的课程内容实践性比较强，所 以，我也给你留两个实践性比较强的思 考题：


    +   1. 假如你是一个要投资的小股东，你更 愿意投那些管理层就是大股东的企业， 还是股权分散，管理层没有很多股份但 实际控制企业经营的公司呢？你觉得这
    两个选择各有什么好处利弊？


    +   2. （这是Bingo同学的问题，放出来做 思考题，帮助大家复习一下公司财务报 表这部分的内容）自己刚开了家公 司，还没开始赚钱，因为自己有点钱但
    不够，又找朋友借了点，在银行贷了 点，用这些钱暂时养着公司。这个钱是 算作筹资还是现金流量？


    欢迎你把你深度思考放在留言区，跟我们 所学同学一块儿分享。


    也再次提醒你，下个月问答的关键词 是“制度”。同学们可以提前复习和提 问。


