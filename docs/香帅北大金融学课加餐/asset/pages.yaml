    这告诉我们什么呢？这意味着我们的政策 从2017年斩钉截铁的宏观调控，已经转为 更温和、积极的财政政策和货币政策。


    但是，这一次的转向是以润物细无声的方 式进行的。所以，证明政府的宏观调控水 平在提高。他们是希望不要进行大水漫灌 式的手段，让经济一下子从旱灾转向涝 灾，而希望是渗透式的。


    但是，这个宽松的基调是非常清晰的， 2019年大概率会呈现一个宏观上比较宽松 的局面。


    好，我们现在再套用前面经济周期决定因 素的逻辑，作一点点推演，在这么一个宏 观政策转向的点上，也就是说信贷周期已 经出现了拐点，水量逐渐从干涸转为充 沛。那么，按照周期运行的原则，接下来
    的经济周期也会出现拐点。


    对于2019年的整个形势，我可以套用一句 你已经很熟了的诗歌，那就是：


