    你肯定能理解，吃药都有个反应时间，那 同样地，宏观政策也有反应期和效果强 弱问题的。所以，面对现在非常冷的这么 一个经济周期，还有保增长的目标压力， 政府的逆周期就应该要启动了。


    那还是有同学会疑虑丛生：老师，政府会 不会没有意识到这个冷，目前不进行调控 呢？


