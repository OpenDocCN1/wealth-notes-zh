- pgno: 13
  md: '线和核心二线城市的房产，平均年化利率都在10%左右，还有三线城市的房产和银行的理财产品，过去十年中也跑赢了通胀。


    你想问的应该是未来会怎么样？这里有几个趋势。


    第一，利率下行是基本的趋势，所以，银行的存款利率只会下，不会上，存银行仍然是赔钱货。


    第二，股和债都是周期性波动非常厉害的资产，在可见的未来，A股市场有机会，可是波动性还是会很大。


    所以，如果你的家庭资产非常丰厚，可以进行部分的股票配置，如果不是，老龄化人口不建议多配置股票。


    第三，城市房价的分化还会继续进行下去，在我们国家经济维持中到中高增速增长的情况下，一线和核心二线城市的房产就像是增长的蓝筹股，安全系数高，收益也会不错。


    当然了，同时也要考虑房产流动性差，政策风险大的这么一个特性，不要过度配置。


    但是，如果是生活在三线城市以下，建议你父母在房产配置上就要保守、保守、再保守了，尤其要降低杠杆，避免房产价格波动对自己老年稳定生活的影响。


    第四条就是要考虑配置一些保险，降低未来生活的不确定性。


    而如果家里资产非常多的，则要考虑信托，避免意外事件的冲击，也保证财富的平稳过渡。


    信托和保险这两个模块的内容，我会在后面开设专题专门替替你讲，你也可以将这些事情放在自己的财富篮子里开始考虑了。


    好，那最后，如果你的父母比较年轻的话，我建议您多转移和讲解我们的课程，通过这种输出，我相信你也会比课程有不一样的体感。


    当然了，你也可以让他们来学习我们这门课程，在替他们加强金融知识的同时，也创造了一种和父母沟通话题的好方式。


