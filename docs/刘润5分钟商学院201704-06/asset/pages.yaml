    本周的周末小结，咱们稍微轻松一些，我来分享一个我读大学时的故事。


    大一的时候，我听一位关系很好的同学说，他们那里流行用某种方法与神鬼接触。当时没有互联网，好奇心极度旺盛的我就求着他无论如何要给我看。横不过我，终于半年后的一个晚上，他告诉我“东西都准备好了。你准备好了吗？”。


    我们要请的，叫做“碟仙”。


    那个碟子，以某种方式动了。我拿了一副扑克牌倒扣在桌上，用我的逻辑，问了碟仙三个问题。


    我抽了一张牌，自己小心的看了一眼，然后把牌倒扣在桌上，问：“碟仙，请你告诉我，刚才我抽出来的那张牌是什么？”


    我又抽了一张，这次我看都没看，直接倒扣在桌面上。就问：“碟仙，请你告诉我，我这次抽出来的牌是什么？”


    第三次，我直接问：“碟仙，我马上会再抽一张牌，在我抽之前，请先告诉我这张牌将会是什么？”


    第一个问题是想了解，“碟仙”知不知道已经发生，而且我知道的事情。第二个问题是想了解，“碟仙”知不知道已经发'
