    # 运用：运用“定位调整偏见”的三个原则


    # 第一，争取先开价。


    很多人加在谈判时喜欢问：你觉得多少钱合适？你的底线20万，你希望对方出个30万，然后自己窃喜着答应了。


    这种情况，在真正的谈判中几乎不会发生。你让对方先开价，就是给对方使用“定位调整偏见”的机会。他可能会报5万，把谈判战场定位到你的底线以下。


