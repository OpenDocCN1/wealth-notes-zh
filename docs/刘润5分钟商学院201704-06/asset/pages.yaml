    演讲是一种跨层级的、大功率的、穿透人心的“广播式沟通”工具。每个CEO，都应该学习演讲。


    怎么练习呢？找20个朋友，成立一个“演讲俱乐部”吧，每周聚1次，每次4人讲，每人1分钟，彼此点评，共同进步。


    你可以在演讲俱乐部，反复练习这四个困难的技巧：克服紧张，情绪互动，提问回答，讲好故事。


