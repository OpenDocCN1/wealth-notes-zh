  md: '我是一名创业期CEO，每天脑海里总是 一步步设计公司未来如何发展，包括从 创业期到成熟期如何管理。目前公司人 数不多，采取扁平化管理方式，未来也 不希望是层级太多的金字塔式。初创
    期，我最喜欢要求少、能力强、具有很 性精神的员工。开疆拓土，没有一股拚 劲不能实现。一个公司发展是“高层看 战略，中层看稳定”，稳定中层员工内 心是我目前投入比较多的工作。


    一个单位想要留住人才，三个条件必须 有一个，或经济收益高，或成长空间 大，或职业荣誉感强，如果都具备，此 单位前途不可限量，如果都不具备，人 才会设法离开，最后留下的都是庸才。


    三种共同体的形式，很好解释了在企业 发展过程中，为何总是出现高管抱怨员 工不努力，员工抱怨高管不分钱的现 象，根本原因就在于出现了期望的错 位。


    企业对不同的人群，应该运用不同的共 同体概念凝聚人才。对最普通的员工 来讲，就是来企业上班拿工资养家糊口 的，就要利用利益共同体来激励，多干活 就多得钱。对于骨干精英或是中层来
    说，期待的已经不仅仅只是温饱，这时就 要运用事业共同体的概念来笼络他们， 让他们把工作当成自己的事业。对于高 层或是核心来讲，自身的追求更多的是 自我实现了，钱或是地位似乎是不能满
    足需求，就是需要用命运共同体的概念 来激励，共同去改变世界。


    当然，对一个具体的个人来讲，我觉得 除了在企业的所处的位置要考虑，他自 身的需求也不可忽视。例如，蚂蚁金融 的彭蕾，当年跟马云刚开始做阿里巴巴 时，就是一个再普通不过的前台，马云
    也没有钱开工资，就分了0.02%的股 份，还描绘未来蓝图，如果阿里上市 后，市值过千亿，你就是亿万富翁。结 果，一个前台竟然成了阿里的命运共同 体，帮助了阿里发展，阿里也成就了她
    的人生。所以，我认为，做老板的人， 如果能切实了解或激发出一个个体内心 的期望，就能横跨三个共同体，成就一 个伟大的企业。


    我负责过一个事业部门的筹建与运营， 在运营初期，最关键的不是定制度流程 考核办法，而是要快速的去开拓市场寻 找客户，在与客户的互动中不断将产品 做成熟，摸索出高效率的工作配合方法
    （流程的锥形）。


    当积累了一定的客户，产品也趋近稳定 的时候，要考虑的就是精益管理了，让 系统形成自我运转的能力，需要定制 度，流程，考核方法，这些保证即使你 不在也可以有序运行。降成本提效率是
    进一步发展的方向。


    我十分赞同刘老师所说的，在企业不同 的生命时期，工作重点不同，管理手段 也不 间。创业期靠理想，靠对未来的憧 憬，进入稳定期后靠制度。


    今天的课程，让我想起裂变式创业。其 实，海尔做的就是这样的转型。裂变式 创业的核心是：一旦发现有的孩子自己 做的很不错，就要给他注入资源，放大 他的成功。如果养儿防老时，当爹的已
    经老到没资源了，那优秀的儿子就没有 办法获得爸爸的资源注入，这会影响基 因的延续。


