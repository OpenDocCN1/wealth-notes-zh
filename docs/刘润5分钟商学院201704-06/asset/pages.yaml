  md: '憋个大招，不断重复，等待时间的回报才是最好的策略。


    你做创意公司的时候，选择客户有什么标准吗？遇到和自己价值观不同的客户，怎么处理？如何提高和客户沟通的效率？


    我目前其实也算是个创意公司，或者叫做营销顾问公司，但实际上主要是卖我个人的时间。


    因为我还算有点小名气，所以找上门来的客户有不少，我也就有机会挑选客户，遇到与自己的价值观不同的客户，我就不会接。这对大部分营销公司来说，其实是不太可能的，因为他们还需要为如何找到客户发愁。


    我挑选客户的标准有几个，


    # 1、产品是业内顶尖的。


    比如罗辑思维和得到就是我的客户。因为营销的基础是产品，如果产品不好，完全靠忽悠客户来做营销，那是骗子，不符合我的价值观。我也是小米生态链几家企业的顾问，深圳有家榴莲披萨叫乐咖也是我的客户，他们在榴莲披萨这个行业里不仅是创始人也是领导者，在上海广州和深圳三地已经接近100家店，我自己是先吃了他们的披萨才同意做顾问的。


    最近我新接的一个客户，叫古茗奶茶，不声不响已经做了1000家加盟店，算是业内第一，而他们其实从来没有做过任何宣传，这是我喜欢的企业，靠着好产品就能做起来。


    # 2、要与CEO或者能拍板的人对话。


    我是做企业顾问，不想浪费时间从市场经理到总监再到老板这样层层去沟通，我要直接跟老板对话，提建议和交流，才能做到效果最佳、效率最高。


    # 3、客户那里要有我能够学习的东西。


    如果只是做企业顾问，但是这个企业没有我能学习的东西，我就是在单方向输出，对我来说是没有意义的。我希望能跟客户一起进步，比如我从罗辑思维这家公司就学到特别多的东西。


    # 4、不符合我们价值观的客户不接。


    比如喜欢攻击对手，却不想着怎么做好自己的产品，只想着怎么融资扩大规模，却不想着怎么服务好顾客的，这都是在我的拒绝名单里的，更不要说像一些靠骗人起家的公司了。


    至于如何提高沟通效率，我通常会注意这几个方面：


    # 1、我们要相互信任，让客户知道你是真的为他着想，而不是为了多赚点咨询费，这点非常重要。大部分咨询公司其实就是从自身角度考虑问题，然后自然很难获得客户认可。


    # 2、要直接了当，客户不同意没关系，但要表达你的看法和理由。我提的方案，也经常被罗振宇和脱不花驳掉，但我不会因为他们不采用就不提。比如去年8月份，我就直接跟脱不花说，是不是要考虑把电商砍掉（只留下图书），专心做得到，当时电商还是罗辑思维的主要收入来源。这可能是大部分乙方不会说的话题，但我说之后，脱不花跟我说，其实公司已经在做了。现在负责每天听本书的阿狮，就是当时负责电商非图书品类的负责人，后来就大批电商的人调过来做得到了。


    3、直接跟老板或者能拍板的人对话，效率就高很多。现在的广告公司老加班，其实不是做的事情多，而是沟通效率差，市场专员要你改一版，市场经理改一版，总监改一版，VP改一版，到了老板又要改一版。所以广告公司一年到头做不出几个东西来，却都累死累活的。你要有能力有自信告诉客户，这个为什么是好的，是对的。而不是去猜测客户喜欢什么。


    刘润


    这周我在讲系统性创新，所以特别邀请了营销高手小马宋老师来担任我们本周的客座教授。他和我分享了广告行业的一句说法，“旧元素，新组合”，全新的创意是不存在的，都是旧元素的新组合，和咱们本周的课程有点异曲同工之妙。


    小马宋老师还给我举了一个例子：当时在聚风貌镜的时候，HR要招产品经理，找了很久也还没搞定，就要他帮忙做个广告。于是有了一个创意，他们联合西少爷肉夹馍做了一个活动，凡是去西少爷吃饭的产品经理，只要拿自己的名片就可以用1元获得一份产品经理套餐，三天活动结束的时候，一共收到了近1000个北京互联网创业公司的产品经理名片，然后HR就去电话挖人。而代价也只是1000个套餐（20元一个套餐）而已。


    其实，这个活动的基本框架就是“你做一个事情，然后获得一个回报，实现一个目标”的老套路，但被他这么一弄，就产生了新的价值，很有意思。


