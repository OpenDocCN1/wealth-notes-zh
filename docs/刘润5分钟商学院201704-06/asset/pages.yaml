  md: '# 153 | 为什么人类不擅长谈恋爱？


    153 | 为什么人类不擅长...


    有一次，我在一所大学演讲。演讲结束后，一位同学站起来问了一个问题：“老师我想问，大学学的知识，对你现在的工作有多大的帮助？”


    这真是一个好问题。《刘润·5分钟商学院》的学员们，大学学的知识，对“你”现在的工作有多大的帮助？100%？50%？完全没帮助？或者是“看情况”？


    # 概念：知识技能态度


    我相信，当时台下的老师心一定提到了嗓子眼。我稍微犹豫了一下，说：10%。为什么这么说？我开始解释……


    我这一生只能学会三件事：知识（Knowledge）、技能（Skill）和态度（Attitude）。


    # 知识（Knowledge）：


    什么是知识？知识就是已经被发现和证明的规律，它是确定的，不需要你通过自身成功、挫败去验证，然后恍然大悟的那些规律。


    比如，1+1=2，那就绝不会等于3，也不可能等于0.5。别和我抬杠啊，这不是脑筋急转弯。再比如，供给大于需求，价格就会下降；把商品放到了心理账户，会增加消费者购买意愿。学习知识的方法简单直接：通过“记忆”，把知识分门别类地存放到你的“存储脑”的某个抽屉里。


    # 技能（Skill）：


    什么是技能？技能就是那些你以为你知道，但如果你没做过，就永远不会真正知道的事情。


    # 态度（Attitude）：


    什么是态度？态度就是你选择，用来看待这个世界的那副有色眼镜。


    # 运用：关于知识、技能、态度的几个建议


    第一，不要把知识当技能学。有一些“实战主义者”，只相信自己感悟的东西，说“听了那么多道理，还是过不好这一生”，所以拒绝学习，忽视前人的思考、客观的规律，把知识当技能学，通过四处砥壁，总结出一些似是而非的经验。这就是“重新发明轮子”。你的顿悟，可能只是别人的基本功。只有站在前人的肩膀上，人类才能不断进步。


    第二，不要把技能当知识学。有一些“理论主义者”，喜欢通过买书来学习。怎么演讲？买本书来看看。怎么谈判？买本书来看看。怎么看书？买本书来看看。你买到的书，都是如何练习技能的步骤，而不是技能本身。这就是为什么我们说：纸上得来终觉浅，绝知此事要躬行。


    # 小结：认识知识技能态度


    学习只有三件事：用脑学习知识，用手学习技能，用心学习态度。把知识学以致用，把技能练成艺术，那么你用心相信的东西就一定会实现。


    ![](img/dfd14813ba3c000b3835771d7641e57c_68_0.png)


    知识是已经被发现和证明的规律，记住了就能用，要学会站在前人的肩膀上更快进步。技能则必须反复练习才能变成你的。'
