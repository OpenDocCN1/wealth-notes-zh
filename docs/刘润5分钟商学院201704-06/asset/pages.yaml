    再举个例子。在撒哈拉沙漠以南的非洲大陆地区，为了获得干净的饮用水，当地的人们把“从地下抽水”的任务，分配给了一个水利系统的外部元素：玩耍的孩子。聪明的当地人，发明了一种“游戏抽水泵”，利用孩子们转动旋转木马时产生的力量来从井中抽水。孩子们玩得不亦乐乎，还有成就感，抽水的任务也完成了。


