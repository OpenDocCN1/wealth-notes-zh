    # 概念：三段论


    什么是三段论？简单来说，这是一种，“大前提，小前提，结论”式的推理，其基本逻辑是：如果一类对象的全部都是什么，那么，它的部分也必然是什么；如果一类对象的全部都不是什么，那么，它的部分也必然不是什么。


    比如著名的“苏格拉底三段论”：


    大前提：所有的人都是要死的；小前提：苏格拉底是人；结论：所以苏格拉底是要死的。


    # 运用：三段论的五项基本原则


    # 第一，四项错误。


    一个三段论中，只能有三个不同的概念。有四个，就一定错了。


    # 第二、中项两不周延。


    # 第三、大项扩大，小项扩大。


    # 第四，前提都为否，结论不必然。


    # 第五，前提有一否，结论必为否。'
