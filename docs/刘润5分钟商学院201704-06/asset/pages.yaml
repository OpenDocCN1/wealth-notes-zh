  md: '# 客座教授 | 企业家之间

    高价值的社交圈是怎么形成的？


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了著名管理学者、中国最具影响力的私人董事会组织领教工坊的联合创始人肖知兴老师，他先后任教于中欧国际工商学院、乔治·华盛顿大学和北大汇丰商学院，对中国企业的组织、战略、企业文化和领导力等方面问题有深入研究和独到见解，曾为包括中国电信、中国移动、阿里巴巴、万科集团、上海市国资委、中国国电集团、国资委和证监会等公司和机构提供过咨询和研究等服务。


    很多人都特别好奇，领教工坊私董会，是如何让企业的老板们放下架子、敞开心扉，有效学习的。这一周，我们请肖知兴老师来分享一下其中的门道。


    ![](img/dfd14813ba3c000b3835771d7641e57c_101_0.png)


    私董会的成员都是各个企业的老大，如何让他们放下顾虑，将自己的问题抛出来？


    中国向来习惯的是纵向的学习，如何让老板们习惯“横向学习”、同学之间通过互相启发、互相挑战来学习；习惯“内向的学习”，自己通过反思、自省、反求诸己来学习，是一个很大的挑战。


    有效的私人董事会的 premise 是努力在成员之间建立一种基于“坦诚、关怀、挑战”良好关系，在小组内形成心理学上所说的抱持性环境（holding environment）。建立这种关系的难度很大，因为1）中国人的信任一般局限在一个非常小的圈子内；2）中年以上人很少再撇开心扉交朋友；3）企业家一般属于“高边界层”类型，有很厚的“壳”，更不容易打开。


    所以，私人董事会组织最重要还是组织的使命、愿景、核心价值观，商业性不能太强，不能有太强的利益导向。基于这个价值观，选择小组成员，主持人在场内不动声色营造气氛，真心注入，形成一套长期陪伴的学习模式，对一个成功的私人董事会的运作，非常重要。以相似价值观维系、在同一组织中形成的“君子之交淡如水”的“联结”关系，其实更适合企业家之间的交往，更有益于坦诚、舒适的交流。


    私董会培育的组员企业家之间的关系就是如此——平常大家可以很长一段时间不怎麽联系，一旦谁提出话题、谁的企业出现问题，大家一定毫不试言地表达、倾尽全力地出谋划策。这种“完全打开”的交流状况，才是未来企业家与企业家之间的“最佳亲密关系”。


    事实上，它提供了私密小团体内部的深度交流和共鸣，是一种网状的“互动-反馈”模式。它的确是企业家的社交圈，但价值又远高于一般的社交圈。它的核心价值在于“它能解决什麽问题”。而这一问题的答案略含机锋，它解决的其实就是“提问的问题”。


    刚开始参与私董会的企业家，有时候很难理解，甚至有人质疑：私董会上大家在不停地提出问题，它到底解决了哪些问题？但实际上，私董会最有价值的环节是提问而不是建议。为什么？因为提问的作用比建议更大，提问的本质是界定真实问题，让人对问题有更加清晰的思考。一个好的提问应该像一柄利斧，它能劈开脑海中冰封已久的成见，让我们看到其他的可能性。


    在私董会里，每一个参与者提供一种视角，看问题就有了十几种视角，也就有了十几种可能性，这对人的启发是非常大的。


    专业人士容易陷入方法论的迷途，其实比方法更重要的是背后的本质是什么，是否还有别的可能。私董会的社交圈子，最终提供的就是发生这些可能的场景，和产生价值的交流方案。


    刘润老师本周分享了私董会的沟通步骤，非常受教。特别想请教肖老师，在您看来，私董会还有哪些行之有效的沟通方式？


    私人董事会是三个圈的交集：教练、咨询和行动学习。


    教练，很多人说是一项技术，其实它是手艺。就是明茨伯格讲的：“管理是科学，是艺术，但是更是手艺”，管理是手艺，教练更是一门手艺。合格的教练要有清空、悬挂、延迟判断的能力。教练的核心，是尊重对象的<|message|>
    主体性。作为教练，你不能代替企业家做事，也不能代替企业家决策。你唯一能做的，是通过影响企业家的方式，来影响企业，帮助他反求诸己。


    所以，他表面上好像是提问，背后其实是对被教练的当事人的一种发自内心f 的尊重、关怀和认可。他要懂得非常有技巧地去提问再提问，促进对方打开再打开。好的教练，会让当事人觉得“如沐春风”，愿意敞开心扉，愿意在你的引导下去进行思考，进行探寻，去找到这个问题的解决方案。


    而且，好的教练还必须要懂企业家，懂企业，懂经营和管理，尤其是懂转型期、过渡期的“中国特色”的经营和管理，挑战很大，好的私人董事会教练也特别难找。


    第二个咨询，领教工坊的东道主私董会，采用的整个流程其实就是典型的咨询公司的流程，先访谈，然后会诊，然后开私人董事会，所以其实是结合了咨询的流程在里面，只有这样，当事人才会真正认可你的价值。


    至于行动学习这个维度，它既不是激发自己的思考，也不是塑造高大上的形象，它'
