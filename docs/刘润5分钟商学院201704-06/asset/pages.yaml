  md: "# 154 | 作为自己的 CEO，你有 “私人董事会” 吗？\n\n154 | 作为自己的CEO, 你...\n\n问你一个问题：《刘润 · 5分钟商学院》对你的学习成长，有多大贡献度？10%？20%？70%？\n\
    \n你也许会觉得，我会希望《刘润 · 5分钟商学院》对你学习成长的贡献度超过70%。那你就错了。我确实希望《刘润 · 5分钟商学院》对你非常有价值，也为此在每一天死磕自己。但我希望，非常有价值的它，对你学习成长的贡献，不超过10%。\n\
    \n металлических？为什么啊？\n\n# 概念：私人董事会\n\n还记得第90课学习的“贝尼斯定理”吗？我们70%的成长，来自“工作中学习”，20%来自“向他人学习”，10%来自“正式的培训”。如果《刘润\
    \ · 5分钟商学院》是你学习成长的全部，首先我非常感谢，但同时，我也要挑战你：你在工作中学习远远不够，你向他人学习的实在太少。\n\n如何在工作中学习？走出舒适区，主动承担更有挑战性的工作，把从《刘润\
    \ · 5分钟商学院》学到的知识用在其中；那如何向他人学习呢？今天，我要给你介绍一种非常受企业家、CEO们欢迎的方法：私人董事会。\n\n什么是私人董事会？一个标准的私人董事会（Peer\
    \ Advisory Board），一般由16~18名“董事”组成。第一，为了能放心学习，他们必须来自非竞争性的行业，并签署保密协议；第二，为了能互相学习，他们的经营规模和发展阶段，必须比较接近；第三，为了能学以致用，他们必须是一把手，比如董事长，或CEO。\n\
    \n你从这“三大规则”就能看出来，“私人董事会”专为彼此“向他人学习”，做了设定。那然后呢？然后怎么学习呢？\n\n亲身感受：\n\n从2016年3月份开始，我在中国最著名的私人董事会机构之一，“领教工坊”担任领教，带领，或者说陪伴，一个企业家私董会小组。这一年我深深感受到，私董会最大的魅力，来自它的“八大步骤”。在这八大步骤之下，有人面红耳赤，有人眼睛发红，有人不开不倚，有人恍然大悟。\n\
    \n就算你不是董事长，或者CEO，你都有必要了解这“八大步骤”，“学习”如何有效地向他人“学习”。\n\n# 运用：如何有效地向他人“学习”？\n\n第一，提案。\n\
    \n每个企业家提交一个“议题”。这个议题，不能是“如何应对互联网时代”这样空泛的课题，而必须是“我的销售团队能力差，三个季度未完成指标，怎么办？”这样的真实问题。\n\
    \n只有讨论真实问题，才能做出真实改变。\n\n第二，表决。\n\n然后，全体董事投票表决。我们今天到底是作为谁的私董会，帮谁解决问题。\n\n大家投出来的问题，一定是都觉得最有价值，也能让自己获益的问题。\n\
    \n第三，阐述。\n\n被选中的“问题拥有者”，向董事们详细阐述自己的问题。为了有效表达，建议格式可以是：\n\n“我有____的问题。这个问题是重要的，因为_____。到目前为止，为了解决这个问题，我已经做了_____。我希望小组能帮到我的是_____。”\n\
    \n第四，提问。\n\n这时，董事们可以向“问题拥有者”提问了。\n\n你会发现，企业家、CEO们不喜欢提问，他们上来就喜欢给建议：你这个问题，我遇到过，应该这么做，这么做。\n\
    \n还记得第137课讲的“知彼解己”吗？遏住自己，不要着急给建议。先从问出直达本质的好问题，理解对方开始。\n\n比如“你的潜在销售机会，是实际销售额的几倍？”，“能成功卖出你的产品的三个关键点，是什么？”\n\
    \n你会发现，问对了问题，答案基本就找到了。\n\n第五，澄清。\n\n一轮提问下来，问题拥有者可能会发现，他对问题关注的焦点是不对的。他可以澄清自己的问题。比如表述为：\n\
    \n“如何把成功销售经验变成关键步骤，减小业绩对人的依赖。”\n\n第六，分享和建议。\n\n董事们终于可以分享经验、提建议了。\n\n严格控制发言时间。不然“我今天就说两点”，但这两点，能从下午两点，说到半夜两点。\n\
    \n每人只有3分钟。练习精确的表达。\n\n第七，总结。\n\n问题所有者，这时可能已经后背发凉，或者大汗淋漓了，甚至曾有人痛哭流涕。在有效流程中，直指本质的对话，最能触动人心。\n\
    \n最后，请他总结改进问题的步骤和时间。然后所有董事，分享今天内容对自己的连接和启发。\n\n第八，反馈。\n\n还没结束。问题所有者还有一项工作，就是在下次私董会时，向所有董事汇报他的实施进展，并征求下一步的建议。\n\
    \n必须变成行动，才不辜负时间。\n\n# 小结：认识私人董事会"
