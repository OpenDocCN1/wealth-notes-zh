  md: '# 144｜人生的不同，是由第三个8小时创造的


    提问！你知道，为什么一个人一天工作8小时，而不是10小时，不是6小时吗？


    整整200年前，也就是1817年，大家的工作时间是14～16个小时，高强度的体力劳动，导致18岁的小伙子，22岁可能就会白头。这一年，社会主义者罗伯特·欧文提出了著名的“8小时工作，8小时自己支配，8小时休息”的口号，但是资本家都不接受。直到69年后，也就是1886年，美国35万工人忍无可忍举行大罢工，才终于换来了8小时工作制。


    那么，前人用生命抗争才好不容易帮你争取到的这“8小时自由支配时间”，你是怎么支配的呢？


    啊，这8小时，我用其中的18小时来打游戏了。啊，这8小时，我不辞劳苦，看完大概1200集的欧巴了。啊，这8小时，我还没意识到我用来干了什么，就过去了。


    你说你，你说你对得起美国那35万浴血罢工的无产阶级吗？他们知道了，估计不是浴血，而是吐血吧！


    重新想一想，这8小时，你到底应该怎么支配？


    # 概念：三八理论


    上帝给了每个人每天公平的三个8小时。第一个8小时大家都在工作，第二个8小时大家都在睡觉，第三个8小时，你会干什么？人与人的区别，其实主要是第三个8小时创造出来的。这就是著名的“三八理论”。


    我第一次听说“三八理论”的时候，浑身一震。如果你每天花2个小时上下班，2个小时吃早中晚饭，2个小时休息、娱乐、购物、看电视、一个人发呆、陪女朋友发呆、刷微博、刷微信、再刷微博、再刷微信，那你真正自由支配的时间就只剩2个小时了。一身冷汗。算完这笔账之后，我从此开始把“善用第三个8小时”，作为我时间管理最重要的手段之一。


    善用第三个8小时，创造不一样的人生。


    # 运用：如何善用第三个8小时


    我分享几个自己的感悟给你。


    +   第一、找到“不被打扰的时间”。


    三八理论的最核心，是要从万千琐事、突发状况中，争取出一段每天不少于2～4个小时“不被打扰的时间”。很多事情，比如学习、写作、思考，只能在“不被打扰的时间”里完成。一段不被打扰的连续的2小时，价值远远超过8个15分钟。


    到哪里去找这2～4小时？


    假如你每天6点钟下班，回到家吃饭，或者吃完饭回家，最早8点，最晚8:30，就可以开始自己的“不被打扰的时间”了，一直晚上11点。这2～3小时非常宝贵。


    但可惜的是，这2～3小时，也是你的朋友们最充裕的时间，他们会竭尽全力用电话、短信、微信打扰你。你要有充分的定力。


    你还可以试试下班后，6点～8点的这2个小时。这段时间，整个世界都堵在回家路上，或者在餐厅门口排队。你可以在办公室给自己不被打扰的2小时，然后错峰吃饭、回家。


    你还可以试试，每天提前1～2小时到办公室。我每天早上8点到办公室，整个办公室只有我一个人。这非常清醒的1小时，甚至可以当2小时用。


    +   第二，分清“交易、消费和投资”。


    时间有三重特性：交易、消费和投资。


    你支付给你的老板每天8小时、每月172小时，他回报给你每月1万元钱，这是交易；你拿你好不容易找到的2～3小时“不被打扰的时间”追韩剧、追日剧、追美剧、追抗日剧，这是消费；你拿这段时间来学习《刘润·5分钟商学院》，这就是投资。


    那我就不能看电视了吗？当然不是。但是，请用别的时间。别的时间在哪里？我不管。你可以用等电梯的时间？出租车上的时间？什么时间都行，但是要保证，这“不被打扰的时间”，只能用于投资。


    如果时间不够怎么办？


    如果有可能，搬到公司楼下住。我的办公室离我家只有200米。我觉得自己比别人每天多活了2小时。


    如果有可能，别买车。坐地铁，或者打车，这样你每天又能节省出一些把双手放在方向盘上的时间。


    +   第三、持之以恒，日拱一卒。


    突然某一天，你心血来潮，慨疾式地学习了2小时，甚至5小时，都是没用的。要持之以恒，日拱一卒。


    我从2003年，一直坚持写博客，写了3年后，到2006年，才不知道哪根筋搭错了，碰巧写出了著名的《出租司机给我上的MBA课》；然后又坚持写了10年的专栏，到2016年，才写出你们今天看到的专栏《刘润·5分钟商学院》。


    # 小结：认识三八理论


    三八理论，就是上帝给了每个人每天公平的三个8小时，第一个8小时大家都在工作，第二个8小时大家都在睡觉，人与人的区别，其实主要是第三个8小时创造出来的。


    怎么善用这第三个8小时，创造不一样的人生？第一、找到“不被打扰的时间”；第二，分清“交易、消费和投资”；第三、持之以恒，日拱一卒。


