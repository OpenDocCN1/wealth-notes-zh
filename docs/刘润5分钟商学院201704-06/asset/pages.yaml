    苏东坡到杭州做刺史，一天在审一案件时，原告状告被告欠债不还。原告诉称：我帮工打浆积下十两银子，早两个月借给被告本钱。我和他原是要好的邻居，讲明不收利息，但我什么时候要，他就什么时候还我。如今，我相中了一房媳妇，急等银子娶亲，他不但不还找银子，还打我呸！被告在庭上辩称：借他那十两银子，早在立夏前就赊成扇子了。没想今年过了端午节天气还很凉，人家身上都穿夹袄，谁来买我的扇子呀！这几天又接连阴雨，扇子放在箱子里都霉烂呙。我实在没有银子还债，他就骂我，揪我，我一时火头上打了他！苏东坡在堂上皱皱眉头，命被告回家去拿来二十把白折扇。苏东坡将折扇一把一把打开，摊在案桌上，蘸浓墨，蘸笔，篦笔，将那些扇子画成松竹梅，或山石盆景，工夫不大，折扇全画好了。他对被告说：“你把它们拿到门口喊‘苏轼画的画，一两银子买一把’，马上就能卖完。”'
