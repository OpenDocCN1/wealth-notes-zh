  md: '# 周末小结｜如果你觉得公司的管理方式有问题


    《5分钟商学院》的同学们，


    大家周末好！


    今天，《刘润·5分钟商学院》管理篇的线下大课在深圳举办。昨晚大雨，500位同学从全国各地辗转飞到深圳，大家辛苦了。我们相互陪伴学习了两个季度，这次面对面一整天的深度交流，让我更加真切地感受到了你们的努力和上进，能和你们一起成长进步，我感觉特别幸福。


    在这次线下大课上，我还特意准备了一块“12米 x 5米”的超宽幅高清LED屏幕，邀请了“涛说PPT”创始人亲自操刀，为这块屏优化PPT，给大家呈现大片级的效
    果，带给大家更多干货的同时，争取也能让你们有不一样的惊喜。


