    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了独立营销顾问小马宋。他曾就职于经济观察报、奥美、蓝标等公司，2007年获得戛纳广告节铜狮子奖杯，创办了在线培训网站第九课堂，曾是暴风魔镜创意合伙人。目前是小米生态链、罗辑思维等公司创意顾问。


    很多人都特别好奇，作为一个资深创意人，他是如何保持源源不断的创新能力？好点子出来之后，怎么能最大化它的营销效果？这一周，我们请他来分享一下其中的门道。


    ![](img/dfd14813ba3c000b3835771d7641e57c_199_0.png)


    现在做营销的朋友，越来越被一对矛盾问题困扰：一方面需要高效率、高频率的创新与突破；一方面必须顾及试错成本与营销效果。请问，小马宋老师，您如何平衡这两个问题？如何保证创新的高频度与成功率？


    我早期是做创意的，特别推崇新奇的点子和有趣的想法，这种想法和能力或许没错，比如你在广告公司，一年可以做很多客户，你想了是个好点子，给每个客户一个点子是没错的。


    但是这种点子特别多的人，到了甲方做营销就很可能出问题，因为营销并不是靠点子多和高频率的创新取胜的。营销最重要的是找到一个核心创意点，然后反复把它打透。'
