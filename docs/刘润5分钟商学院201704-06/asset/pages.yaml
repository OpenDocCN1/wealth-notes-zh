    # 第一，金额的限制。


    最开始的买车案例，就是典型“金额的限制”：我家领导觉得太贵了。这也是最常用的“权力有限策略”。他给谈判设了一个最低目标，比如“成交价格最多不能超过每件100元”，并用“对不起，我要和领导商量一下”作为盾牌，保护这个目标。


    那如果，对方说“你能做主吗？”不能做主，不要和我谈，怎么办呢？


    很多人喜欢在名片上印“董事长 & CEO”，这虽然看起来很牛，但也会让你在谈判的时候，失去退路。你可以试着在名片上印“创始人合伙人”，它同样可以让你有谈判的资格，但遇到艰难的问题时，你可以有余地和对方说：“对不起啊，这个问题很重大，我必须尊重我的几个合伙人的意见，请稍等，我去打个电话”。


    # 第二，条件的限制。


    条件的限制，更容易使用“权力有限策略”，你可以大方地说：金额可以谈，但“服务费用占开发费用的15%”的这个条件不能谈，谁来都不能谈，这是我们一贯的原则，因为它有关系项目最终质量。如果要打破这个原则，我们只能回去开会讨论了。


    相对于金额，条件的限制，更容易被对方理解和接受。


    # 第三，程序的限制。


    “我可以原则上答应你，但所有新产品上线，都要运营部门签字同意。我把我们刚刚谈完的参数指标整理一下，请运营部门今晚加班看一下，明天给你最终答复。”


    这就是用程序的限制，获得回转余地。


    # 第四，法律的限制。


    “我们必须要在中国合法经营。刚才的条款，我全部同意，但还有一些合规性的担心。合规部门那些同事，整天给我们找麻烦，很难搞，你懂的。我请他们在不改变条件的前提下，再看一遍条款。”


    合规、财务、法务等部门，常常为公司背黑锅。但是，却可以成为“权力有限策略”中非常重要的“不露面的人”。好好感谢他们吧。


    # 小结：认识权力有限策略


    权力有限策略，就是通过设定一个真实，甚至虚构的“不露面的人”，限制自己谈判的权力，从而给予自己在关键问题上，外表柔软，内心坚定地说“不”的能力，让对方大伤脑筋，做出最大可能的让步。


    运用“权力有限策略”有四种方法：第一，金额的限制；第二，条件的限制；第三，程序的限制；第四，法律的限制。


    ![](img/dfd14813ba3c000b3835771d7641e57c_124_0.png)


    通过设定一个“不露面的人”，限制自己谈判的权力，给予自己在关键问题上说“不”的能力，让对方做出最大可能的让步。


