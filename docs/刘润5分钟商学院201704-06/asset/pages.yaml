  md: '私董会的方式完全符合成人学习的五大公理:自我导向、关联学习者经验、强调实践、聚焦于解决实际问题、内在动力。把高大上的学习方式擀给我们看，大有启发。作为HR，我首先想到的是可以用在新员工的融入上，可以在入职一个月后召集这些新员工一起，用这样的方式帮助他们呈现问题、梳理思路、整合资源、迅速行动。这要比单纯的导师制更能带来共鸣与启示。


    先选择一个你想理解的概念，找一张白纸、写下标题假装觉得自己要讲课了。再假想一个新学生，他的年龄、身份、场景，然后就真的给他上课。当你一次次去解释的时候，你会对自己理解了什么、误解了什么、还差什么，有所体悟。如果遇到问题，停下来翻书。当你讲不下去的时候，跳回到学习资料上，重新学一遍。一直到自己能讲顺为止。最后不要用术语，使用自己的语言。


    假如你还在用生僻词汇，或者讲不清楚概念，其实就是你没有真正理解——试着简化语言，或者打个比方，让自己真的明白。


