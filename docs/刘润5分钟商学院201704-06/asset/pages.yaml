    前两天，我收到了订阅专栏《关系攻略》主理人熊太行老师的邀约，他说他的“关系户”里，有个同学的提问和咱们专栏有关，想转给我回答。这个问题估计很多同学都会遇到，所以本周的周末小结，我特意换了一种方式，把我对这个问题的答案，和熊太行老师的回复一并贴出来，给大家参考。


    熊老师，我订了刘润老师的专栏《5分钟商学院》。我发现《5分钟商学院》里讲了企业生命周期和经营管理的方法，与我目前所在的企业实际情况有些差异。我们公司是地方国企，刚成立一年多，现在使用绩效考核管理办法来管理，并且对员工进行等级管理。


    部门领导昨天问我对员工等级管理的试行办法有没有什么意见，我没敢说。现在脑袋发热，很想就企业所处的生命周期和管理方法向领导请教。但又怕像小米的雷军说的，基层员工进企业不到5年就跟他谈战略的问题，这员工不是有精神病就是能力有问题。你说我该不该跟领导去探讨这个问题呀？请赐教！


    刘润


    这个同学的问题，我在做商业咨询的时候也会经常遇到。很多企业，都在拿成熟期的方法，管理创业期的公司。还有些大公司的管理者去了初创公司，会很自然地把原来那套成熟的管理方法：管理层级、薪酬架构、绩效管理，直接用在创业公司。打个比方，这就好比把一套成人盔甲穿到孩子身上，根本无法施展。


    其实，企业的发展通常会分为三个阶段：1）创业期，2）成熟期，3）转型期。在“企业生命周期”的不同阶段，需要不同的战略思考和管理手段，这个非常重要。


    回到这个同学的问题，我们首先要判断：如果他所在的这个地方国企，是一家成熟机构的子公司／销售分公司，使用KPI这些绩效管理的方法，没问题。但如果是一家单纯的创业公司，设置很多考核就会有问题。


