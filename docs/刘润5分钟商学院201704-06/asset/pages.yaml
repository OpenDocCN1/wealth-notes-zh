    除了“你少拿一元，我多拿一元”的谈判外，你还可以通过做大增量或者互补存量，让双方的整体福利最大化，达到双赢效果。


    # 得到专栏·5分钟商学院


    主讲人：刘润


    ![](img/dfd14813ba3c000b3835771d7641e57c_132_1.png)


    你相信这个世界上onus有“双赢谈判”吗？还是你认为，定位调整偏见，权力有限策略，谈判期限策略，和出其不意策略所代表的“零和谈判”才是这个世界的主旋律呢？来和我一起过招吧。


    6月3日，《刘润·5分钟商学院》“管理篇”的第二场线下大课，将在北京举办。上一次商业篇课程的北京场，我们准备了200个位置，结果几天时间票就被抢光了，很多同学托关系找到我希望能够多加一些位置。这次的北京场，我特别请得到同学找了一个更大的场地，目前已经售出400张票，还有最后一百张票，想要参加这次面对面线下大课的同学们，要抓紧了。


    如果说“商业”是讲如何对外，“管理”就是讲如何持家，两者缺一不可。在这次管理篇的大课中，我会和大家分享四个方面的逻辑：


    第一，企业生命周期。这个世界上有所放之四海而皆准的管理方法论吗？这个世界上能帮助企业基业长青的战略和组织吗？为什么管仲，陶朱公的企业，没有活到今天？企业的发展有三个阶段：创业期，成熟期，转型期。我将在这个部分，帮助大家定位自己的阶段，并寻找合适的管理方法。


    第二，创业期管理。为什么小米说没有KPI，罗辑思维说没有组织架构，很多创业者甚至说他们痛恨管理？创业期的企业真的不需要管理吗？那他们需要什么？创业者成功，到底是靠努力，还是靠运气？我会在这一部分与大家分享，创业期企业的成功特征。


    第三，成熟期管理。企业越来越大，这到底是好事还是坏事？哪些创业期要的聪敏、抖的机灵，必须被抛弃？游击队如何变成正规军，猎狗如何变成农耕？战略必须流程化吗，流程必须工具化吗？我会在这一部分与大家分享，参天大树，和破土幼苗，到底不同在哪里。


    第四，转型期管理。没有成功的企业，只有时代的企业。这就像人一样，死因各不相同，但死是必然的。健康长寿，不代表永生；医疗先进，不代表免死。那应该怎么办？我会在这一部分与大家分享，真正的转型，重获新生，到底怎么做。


