  md: '# 客座教授 | 先颠覆自己，再颠覆行业


    ![](img/dfd14813ba3c000b3835771d7641e57c_183_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了e袋洗创始人、董事长张荣耀。他创立了荣昌洗衣，在2008年带领荣昌洗衣成为北京奥运会指定洗衣服务商。2013年，他以全新的互联网产品“e袋洗”，从传统服务业杀入互联网，目前已经达到千万级的用户规模，位居行业第一。这几年，他率e袋洗先后获得腾讯、经纬、SIG、百度、立白投资，并成功入选哈佛大学商学院案例。


    很多人都特别好奇，从传统的荣昌洗衣到互联时代的“e袋洗”，张总是如何带领团队完成这个改变的。这一周，我们请他来分享一下其中的门道。


    ![](img/dfd14813ba3c000b3835771d7641e57c_183_1.png)


    从传统的荣昌洗衣到互联时代的“e袋洗”，这个改变的过程你认为哪些是最不容易的？


    2013年底决定做e袋洗时，我们已经做了20多年传统洗衣，拥有1000多家洗衣品牌连锁店，但当时还是决定归零，上线e袋洗，希望借助移动互联网对传统的洗衣行业改造升级。当时面临的最大挑战是：原有利益的取舍平衡、未来利益的重新分配以及创新人才的搭建与原有团队快速融合。


    但这还不是最难的，最难的是把我自己和所有员工的价值观调整为“用户至上”这个新标准。这说起来容易，做起来非常有挑战。用户体验好，成本就高，但用户还同时需要性价比好。


    举个例子，大家都知道在线下洗衣店，每件衣服的洗涤价格是不一样的，但你如果按照这个逻辑上门服务，用户和我们的服务人员都会陷入分拣、装包的复杂中。所以e袋洗把原本论“件”洗的衣物，用“袋”为单位重新衡量、单一定价。这样就极大简化用户体验，将下单过程大幅度简化，这让“don’t
    make me think”（别让我思考）的互联网时代用户非常受用。


    再比如为了节约用户时间，我们取消了当面检查衣物，但这就需要投入大量的高清摄像设备进行清点记录；比如我们要确保取送过程中用户衣物安全无损，就需要投入研发团队持续的完善系统流程与物料进行配合；比如加工伙伴原有洗衣流程不完善，我们就需要投入培训队伍帮助伙伴成'
