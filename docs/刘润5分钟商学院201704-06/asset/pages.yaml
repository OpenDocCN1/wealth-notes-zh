  md: '# 周末小结｜如何营造高质量的人脉圈？


    《5分钟商学院》的同学们，


    大家周末好！


    前一段时间，我担任了订阅专栏《超级个体》的成长导师，分享了一些我自己的人脉经营之道。本周的周末小结，我把这些方法同步分享给咱俩的同学们。


    # 1、我是如何搞定那些大咖客座教授的？


    我经常讲一句话：那些能帮到你的人，不是你的人脉，只有那些你能帮到的人，才是你的人脉。这句话不是说说就算的，而是一直贯彻在行动中的一句箴言。


    我们找到这些牛人时，并不是请他们来帮忙，或者说，“这件事情对我有价值，对用户也有价值，所以请你给个面子”之类的。以这样的心态请牛人，是请不来的。除非人家曾经欠你很大的人情，今天想把这个人情兑现了，其实就算真的请来了，这也是一种消耗。


    我们能请到牛人担任《5分钟商学院》的客座教授最主要的原因有三点：


    +   1、首先，我们做的事对牛人是有价值的，甚至是心存感激的。


    比如我们邀请到的企业家，他们能够借助这个机会把他的思想、感知以及个人品牌传递给更多的人。


    +   2、其次，每一个企业家都代表了他背后的企业。


    他们作为企业的代表发表自己的看法，不仅会得到成就感和荣誉感，从商业价值上来说，也能让更多的人了解企业的经营理念和价值观。


    +   3、这件事不仅要对嘉宾有价值，对我和同学们也都要有价值。


    当一件事情对其isering一方的说是没有价值的，那么这件事儿就不能做。另外，对待这些嘉宾时，我们也做到了充分地尊重和体贴。比如，我们会尊重这些嘉宾的时间和安排，不做人情绑架。同时我们的团队会在前期为教授筛选出十个问题，由对方选出两三个，这样既能给嘉宾选择的空间，又尽可能地减少了对方的工作量。


    # 2、经营人脉是需要花时间的。我是怎么管理人脉和分配精力的？


    坦白地说，我自己几乎是不花时间来经营人脉的。我个人认为，君子之交淡如水，好的人际关系，没有必要天天一起吃饭，或者逢年过节送个礼。很多人想设法去讨好别人或者努力经营人脉，就为了有一天对方能帮到你，这个状态是不对的。


    我自己保持与别人联结的方法很简单，比如，我在听到某个观点，或者看到某个资料时，突然联想到，这个观点或资料说不定能帮到我那个创业的朋友，我就会随手就把这个东西转给他。我其实并没有任何目的，只是觉得这东西对别人有价值，就转给他了。这是你始终要保持的一个基本心态——毫无保留地把你的价值付诸到别人身上，这是我经营人脉的最基本的方法和逻辑。


    如果你不断发挥，不断不断的发光发热，发现都够不到一些人，那只能说明你暂时对他们是没有价值的，他暂时不是你的人脉。慢慢等到有一天，你有这个能力帮到他的时候，他会感觉到你对他的帮助。想尽一切办法，毫无目的地尽量帮别人，这是特别特别重要的一件事情。所以，我会坚持把我的新想法分享在朋友圈里。甚至有很多朋友，养成了每天翻我朋友圈的习惯，因为他们觉得我的分享是有价值的。


    但也有一些做投资、培训的创业者或者商学院的教授，他们很少发表自己的观点，甚至刻意保留，因为他们觉得自己的观点是有价值的，他们只愿意在课程中去谈。他们觉得随意地分享出去，是在掏空自己。但如果你觉得你讲几句话，就可能被掏空，那你的价值也太脆弱了。


    你看我们请到那么多业内牛人担任客座教授，他们几乎都是拿出了自己压箱底的东西。他们讲完一期内容就会被掏空吗？当然不会。你要相信自己永远都在进步，把你今天所知道的一切东西无私地交给别人，你就会积累你的人脉。


    # 3、对于普通人来说，怎么才能认识牛人？


    这个逻辑是这样的。不同的人生阶段会认识不同的人，或者说，当你具备不同的价值时，你也会认识不同级别的人。


    以我自己为例，二十年之前，我可能不会认识那么多牛人。因为二十年前我能认识谁，决定于我当时对周边人的价值有多大。十年之前，我也不会认识现在我才认识的一些牛人。因为十年前，我的能力还无法帮到那些人。


    所以对于普通人来说，这个方法是有参考意义的。如果想要积累人脉，你能做的，就是不断积累自己的价值，并不断输出自己的价值，当你能够帮到越来越多的厉害的人，你的人脉就会越来越广，质量也会越来越高。


    祝福所有同学都能帮到越来越多的人，获得更多的人脉，成为自己的CEO。


    # | 本周留言精选


    上大学时听易中天讲戏曲的讲座，一个看起来冷门的题目座无虚席。他说中国戏曲是欺人但不自欺，说到念白“月朗星稀”，表演者是推门而出的感受，必须先低头看到月光，才能念出“月朗”，再抬头一望，呤出“星稀”，所见所感，每个动作都省略不得。哪怕都是假装没有场景，也必须做足，一下子就把看起来拖沓刻板的戏曲讲出了令人好奇的意味来。


    好的演说就像好的编剧，知道制造戏剧冲突，听过戏剧编剧说坏人一般会从舞台右边出场，因为人习惯性是往左看，一般的角色都是左边出场，符合观看习惯，突然有个从右边出场的，一下子就能抓住观众的好奇心，推道冲突的发展。举对好例子，营造冲突感，能够有效地抓住观众听众的好奇心，打开他们接收你的观点的大门。


    之前听故事学院创始人威泽明分享过关于演讲的一些内容：'
