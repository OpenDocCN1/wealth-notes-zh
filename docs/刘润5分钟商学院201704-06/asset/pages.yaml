  md: '每本书，都是一套“思维模式”。读的书越多，就 timing会理解越多不同的思维模式，越有助于打开“思维转换”的开关。建议每年至少读20本书，并做笔记；有志气的人，可以考虑读50本以上。


    每个人，也是一套“思维模式”。认识的人越多，你会越理解自己“思维模式”的局限性。建议：不要独自吃午饭。只要名单上还有人，一个人吃午饭就是可耻的，你丧失了理解别人思维模式的机会。


    旅行，也能给你巨大的帮助。


    有一次我在美国商场买了样东西，标价83美元。我拿了张100美元，和3张1美元，一共103元，递给了售货员。那个售货员，一脸茫然。她把3美元还给我，说不需要。然后把商品递给我，说：83；接着一张张钞票数给我，说：93，98，99，100。


    我立刻理解了她的思维模式：你给我100元，我连商品带找钱，加在一起还你100元。我的思维模式是：我给你103元，商品83元，减下来你找我20元。她居然不理解我的思维模式，我也没用过她的思维模式，但我们各自幸福生活了几十年。


    第二，把自己放进别人的鞋子里。


    每次争论，都是特别好的练习“思维转换”的机会。试着用对方的观点，说服自己。也routes就是：把自己放进别人的鞋子里。


