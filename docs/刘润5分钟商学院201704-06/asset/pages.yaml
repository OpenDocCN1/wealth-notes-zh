  md: '# 小结：认识私人董事会


    私人董事会，是一套建立学习小组，向他人学习的方法。


    具体怎么做？三大规则：不竞争、同规模、和一把手；八大步骤：提案、表决、阐述、提问、澄清、分享和建议、总结、和反馈。


    看似简单的规则，却可以帮助问题拥有者解决实际问题，对其他董事产生关联启发，帮助所有人进入深度思考，训练直指本质的提问能力，精准简练的表达能力，向他人学习，最后，还能收获深厚的友谊。


