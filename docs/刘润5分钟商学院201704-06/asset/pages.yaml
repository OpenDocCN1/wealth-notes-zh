    138 | 天啊，太棒了，居然...


    # 概念：综合综效


    我们在与别人合作时，常常遇到这样头疼的选择。“好吧好吧，我们各让一步”是通常最终的解决方案。好吧好吧，我再便宜2块，你也加1块，成交；好吧好吧，这批硬件系统我不还价了，但你再送我两套软件。


    但是，除了“好吧好吧”，这样的妥协方案，有没有“天啊，太棒了，居然还可以这样”的创造性合作呢？


    每年秋天，大雁都要往南飞，一会儿排成“一”字形，一会儿排成“人”字形。为什么呢？你想过没有，为什么他们不排出更酷拉风的“马”字形，或者“云”字形呢？


    这是因为，一字形，或者人字形编队飞行，更省力。大雁扇动翅膀，会在后方带起一股上升气流，因此紧跟的后雁，就可以飞得更快、更省力。带队的头雁飞累了，后雁还会接替他的位置，轮流休息。据科学家分析，以人字形，或者一字形编队飞行的雁群，比单只大雁能飞的距离要长73%。


    这就是从“好吧好吧，我们各让一步”，到“天啊，太棒了，居然还可以这样！”的创造性的合作，实现1+1>3的效果！


    这就是“综合综效”：通过创造性合作，实现整体大于部分之和。综合综效，就是相信除了“非此即彼，你多我就少”之外，可以通过“创造性的合作”，找到“1+1>3”的“第三方方案”。


    # 运用：如何实现1+1>3？


    应该如何寻找这种基于“创造性合作”的“第三方方案”呢？


    # 第一、尊重差异，感激多样性


    首先你要理解，你看到并不是真实的世界，而只是真实的世界在你心中那面镜子上的投影。镜子不同，世界的投影也不同。所以，不要追求投影，也就是观点、价值观的一致。相反，你应该尊重观点的差异，感激团队的多样性。从价值的角度来看，如果两个人观点完全相同，那么其中一人必属多余。


    很多美国公司都有鼓励多样性的文化，这是创造力的源泉之一。有些公司甚至不是鼓励多样性，而是 dự không允许不多样。比如，上下三级，不允许是同一个大学毕业的，以免观点、价值观过于相似。不同性别、不同种族、不同信仰、不同专业，都有助于让整个团队充满差异性，然后用差异性，激发奇思妙想。


    # 第二、从报仇、到妥协、到合作


    最差的“合作”是“报仇”。我宁愿重伤，也要让你死；或者我宁愿死，也要让你重伤。报仇，是1+1=0.5。


    妥协，就是“好吧好吧，我们各让一步”，总比没有好。妥协，是1+1=1.5。


    合作，就是我帮你，你也帮我。我是做冰箱的，你是卖冰箱的，我们一起赚钱吧。合作，是1+1=2。


    # 第三，共享目标，创造性合作


    从合作，到创造性合作的秘诀是：找到共享的目标。


    瞎子看不见路，瘸子走不了路，两人都寸步难行。大家的目标不是彼此嘲笑，而是走路。以走路为共享的目标，瞎子把瘸子背起来，用瘸子的眼睛，指挥瞎子的腿，就可以走路，甚至走到很多地方了。


    线上和线下，一定要你死我活吗？他们共享的目标是“更多流量”，于是，线上最成功的淘品牌之一蘑菇，开始在線下开展千城万店计划了。


    互联网和传统，一定要你死我活吗？他们共享的目标是“更高效率”，于是，最传统的烤红薯，开始可以卷动互联网支付了。


    你和你太太（或者你老公），一定要你对就是我错吗？你们共享的目标是“什么什么什么什么”，于是，你们1+1等于3，甚至在2016年之后，1+1可以等于4了。


    # 小结：认识综合综效


    综合综效，就是通过创造性合作，实现整体大于部分之和。秉持双赢思维，运用知彼解己的习惯，才能产生综合综效的成果。


    怎么训练综合综效的习惯呢？首先，尊重差异，感激多样性；然后，培养自己，从报仇，到妥协，到合作；最后，找到共享的目标，通过创造性的合作，发现“天啊，太棒了，居然还可以这样”的第三方方案。


    回到最初的养狗的问题。你觉得，除了他的方案，你的方案，有没有基于创造性合作的第三方方案，能让你们俩都觉得“天啊，太棒了，居然还可以这样”呢？


    天啊，太棒了，居然还可以这样

