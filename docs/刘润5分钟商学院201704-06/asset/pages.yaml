  md: '# 客座教授 | 用钱投票 选出好人才


    ![](img/dfd14813ba3c000b3835771d7641e57c_16_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了芬尼克兹创始人兼总裁宗毅。他独创了“裂变创业”模式，通过独特的、用人民币选创业公司总经理的方式选出创业带头人，成立新的创业公司，先后裂变12家公司；他独自开通了中国第一条穿越南北的电动汽车充电之路；独创用众筹的方式修建电动汽车充电之路作为公益，改变中国电动汽车充电模式发展的格局。


    很多人都很好奇，这种用人民币评选带头人的新型模式究竟是怎么运作的，对什么样的组织适用。这一周，我们请他来分享一下其中的秘诀。


    ![](img/dfd14813ba3c000b3835771d7641e57c_16_1.png)


    有时候公司会把晋升当作激励手段，把一些技术大牛或者业务骨干提升到管理层，结果带来负面反应。请问宗总，芬尼是怎样避免出现这种人力资源错配的情况？


    就我个人而言，我会觉得如果只是纯粹的技术大牛，其实不太合适当一把手。


    在我们公司内部，不存在你去提拔谁，不是说老板认为谁行，谁就有机会上位。我们是竞选的，谁都可以上，如果技术大牛真的有全局观念、有营销思路、口才很好、业绩很好等等，素质很全面，那他自然会被大家投票选出来。但如果他只是个技术大牛，是不会被选上的。


    这样的话，我根本就不用担心错配，它就是一个竞选机制，候选人直接上去讲他的项目、他的投融资计划，如果他能把事情讲清楚，代表他的思路是清楚的。而员工呢，每个员工要在选票上填写两个内容：第一，你支持谁；第二，你愿意在他们身上投资多少钱。而且，这个钱你还必须得兑现，得投进去，要是你写在选票上的金额不兑现，就罚你上一一年年收入的20%。


    这样直接让钱去做决定，如果大家都愿意把钱投给他，说明大家首先相信他的人品OK，比如一个员工在工作中有过污点，这事儿老板不一定知道，但一定有员工知道。要是该员工参与竞选，知情的员工不但不会选他，还会把他的劣迹告知其他员工。因为大家的利益是一致的，所以就不会有腐败，公司就会变得廉洁。其次，用钱选出来的人，他的经营能力一定很强。因为投下去的是真金白银，每个投资人都会很谨慎，提前做很多调查。而每个员工的调查结果汇总在一起，肯定能找到最有能力的获选者。最后选出的人德才兼备，自然就是最好的人才了。


    这就像真正的投资人投项目，他不会乱投，会反复评估创业者是否能把这件事情做好，才会选择投钱。一旦跟个人利益深度绑定，迫使投票人更加谨慎地对待自己的选票，选出来的就是真正的人才。


    您以什么标准判断骨干员工能担当裂变公司的负责人？这种方式适合于所有行业吗？


    就像我刚刚讲的，这是大家用真金白银选出来的，不是我指定的。不过如果真的说到标准，有几个共性的地方：


    +   1、首先，要找和公司使命、愿景、价值观差不多的 人。


    +   2、这些候选人都是自己跳出来的，不 apenas要愿意干，还要拿真金白银、全副身家投入，不但要想干，还要敢干。要这就和你真正去创业没太大差别，你要有承受失败的心理素质，很可能你去做了这事，但是没成功，原来的位子也没了，所以必须是真正有创业胆量的人。


    裂变式创业最初只是芬尼为了留下高管想出 的一个方法，没想到后续不断迭代，变成了一个特色的企业标签。这个制度总结起来，就是从人性的角度考虑问题，把大家变为利益相关方，项目带头人成为最大受益者，股东用人民币投票，选出德才兼备的人。


    它本质上应该是每个行业都适用，但具体执行时，还是要注意几个条件：


    +   1、初创企业最好不要用裂变这种方式。我特别同意刘润老师说的，实现企业永续经营的方法是“养儿防老”，要在最好的年华生下孩子，让企业的基因能够在孵化的企业中传递下去。想要孵化裂变，首先妈妈的身体要好，你要在原来的行业里有一定的地位和资源，方便延伸到新的行业。


    +   2、你的公司本身要特别公开透明，因为你会面对大量的股东，如果有见不得人的账务，很容易出事。


