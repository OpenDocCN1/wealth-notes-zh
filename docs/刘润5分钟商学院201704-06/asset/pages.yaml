  md: '行配；比如加工伙伴原有洗衣流程不完善，我们就需要投入培训队伍帮助伙伴成长起来，以保证洗衣服务品质的用户体验；还有很多很多类似的情况，你要时刻把用户体验放在心上，不断提高自身的运营效率，才能为用户创造有价值的服务。


    在竞争激烈的o2o市场，e袋洗产品的竞争力主要是什么？如何构建独特优势？


    如果一个洗衣店只是自己做了一个微信服务号或者APP，告诉用户可以用手机下单了，那就是+互联网，因为它本质上还是一个洗衣店。但e袋洗自己已经完成了从一个传统企业往移动互联网企业的转型。


    我们不是一个洗衣店或者洗衣工厂，而是通过软件、算法、网络，把用户与优质的洗衣服务商连接起来，并且在洗衣这个行业形成了品牌，能够为全国性的企业提供服装洗护的售后服务、为各个开通城市的企业员工提供到家的福利服务。这个区别也是e袋洗能够成为中欧商学院、哈佛商学院案例的重要原因。


    e袋洗今天成为行业的绝对领先者，依赖不断积累的三大基础：


    +   1、最好的洗衣服务品质。中国历史最悠久的洗衣服务品牌、中国最大的智能洗衣工厂、中国最好的洗衣连锁店、中国最好的奢侈品养护工厂，都是我们的战略合作伙伴；


    +   2、通过投资在洗衣行业上下游建立生态。去年我们入股了台湾智能洗衣工厂品牌衣贝洁，合作推出“城市合伙人”模式，地方城市的合伙人成为股东，自己出钱建立团队，e袋洗输出自己的品牌、系统、运营管理经验给更多的城市合伙人，充分挖掘大家拥有的所在城市资源，把服务尽量属地化就地解决，加工厂尽量规模化，在各地建立洗衣的品质护城河。


    +   3、e袋洗的品牌影响。传统洗衣店由于都是区域性服务很难谈有品牌，e袋洗作为行业的领先品牌，和很多不同领域的企业都有跨界合作，正在融合的平台比如58到家、招商银行，房地产各大物业公司等各类互联网以及线下拥有用户资源的企业，很多企业把员工的福利关怀交给e袋洗。我们目前是UGG品牌中国唯一的售后服务商，相信未来还有更多的服装服饰品牌会选择我们做售后服务支撑。我们也是目前中国最大的奢侈品清洗商。


    未来，我们希望借助移动互联网，以洗衣为入口打造生活服务的，全面改造用户服务体验。


    刘润老师的书《趋势红利》的签名版


