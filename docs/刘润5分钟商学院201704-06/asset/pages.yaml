    # | 本周留言精选


    分享一个从成甲老师那听来的技巧：我们无论在买任何东西的时候，可以根据该产品的利润空间来跟店主谈判。比如买衣服，一般都是对半砍，直接把价格拉到最低。买衣服时最好带着闺蜜，然后唱红白脸，再接着模拟把老婆（老公）当做虚拟决策人，假装让他作为真正决策人。最后再补一刀，在其他店里这个价格还送某某小配件。（虚拟竞争者）。最终的结果就大差不差了。你不会吃亏，店家也稍微赚点。当然这种套路还得刻意练习。成甲老师和润总都是老司机。


    孩子去商场时，很容易被各种商品吸引，我妻子就很善用权力有限策略。例如，当孩子说我要买这个那个的时候，我妻子就会说：1、到商场买东西，不是必须生活品，不能超过50元（金额限制）；2、每周只能买一次（条件的限制）；3、要买东西，提前要在家里预约好，养成准备习惯（程序限制）；、4、要征求爸妈同意（权力限制）。这样基本上养不成会乱买东西的习惯，更重要的是，得到后会比以前珍惜。


    女生:亲爱的，我可以嫁给你，但我年龄不小了，必须是今年！（最后期限策略）男生:可我还没准备好，要不过2年吧……（战略延迟）女生:如果不是今年，你就是不爱我，那我们还是分手吧。（最后期限策略2）男生:别别别，那好吧，就今年，不过你家要少收点彩礼，我家也不富裕（战略延迟2）。女生:我可以，但我做不了决定，得回去跟我妈商量（权力有限策略）。


    这几天和几个同事去看健身房。销售方案如下：一年期会员卡999元，一带三送499，一带四送999元。我们正好5人需要办理年卡，和销售人员谈判了好半天，他一直坚持说“这已经是市场上最优惠的价格”，双方僵持不下。最后他拿出“权力有限策略”，“我请示一下销售经理”，回来后依然不松口。


    我拿出“程序限制”的策略，“要是这样的话，那我们商量一下再说吧”，就准备起身离开。这时销售经理走了过来，他的套路就更深了，说了好久我只好回答，“还是你厉害，我都被你说服了，开单吧”。


    开完销售单，他问我“现金还是微信”，我说微信，扫完二维码输到还差1位密码时，我将手机付款页面给他经理看，告诉他“我忘记最后一位了，你要是能送点礼品，我一高兴说不定就想起来了”。


    经理非常吃惊，“好吧好吧，我送你们每人一个旅行包”。我回应，“手套、保温杯、瑜伽垫这些也没有吗”，销售经理看着，就差1位密码就可以结束了，无奈地回答，“好吧好吧，再送你们2套瑜伽垫”。


    苏东坡到杭州做刺史，一天在审一案件时，原告状告被告欠债不还。


    原告诉称：我早两个月借给被告十两银子，讲明不收利息，但我什么时候要，他就什么时候还我。如今，我急等银子娶亲，他非但不还我银子，还打我。


    被告辩称：借他那十两银子，早在立夏前就贩成扇子了。没想今年过了端午节天气还很凉，这几天又接连阴雨，没人买不说，扇子放在箱子里都霉坏了。我实在没有银子还债，他就骂我、揪我，我一时火头上打了他。


    苏东坡命被告回家拿来20把折扇，将那些扇子画成松竹梅，或山石盆景，对被告说：“你把它拿到门口喊‘苏轼画的画，一两银子买一把’，马上就能卖掉。你十两拿来还债，另外十两拿去另作其他生意吧！”没一会，20把折扇就一抢而空，两人欢天喜地地各自回家去了。


    苏东坡的智慧在于他没有陷入案子里，而是尽力找到一个双赢或者多赢的方法解决问題。真正的高手思维与常人不同，他们能够跳出一己私利的小圈子，通过成就他人，帮助别人摆渡，最终惠及所有人。


