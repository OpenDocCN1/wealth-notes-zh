    # 陪你成长的第171天


    ![](img/dfd14813ba3c000b3835771d7641e57c_139_0.png)


    智商×情绪训练＝情商，情商可以后天训练。试着练习给别人指路、玩杀人游戏，能有效锻炼自己站在别人角度思考的同理心。


