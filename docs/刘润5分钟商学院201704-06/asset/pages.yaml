  md: '刘墉因为直言进谏，触怒龙颜。乾隆皇帝当堂做了两个“纸阏”，名曰“生死阏”，一个上面写着“生”，一个写着“死”。其实刘墉知道，乾隆在这两张上，写的都是“死”字。刘墉不管抽到哪一张，都会被处死。怎么办？怎么办？


    刘墉突然想起来，《刘润·5分钟商学院》第163课“排中律”里面讲过“反证法”，只要证明自己没有抽到的那张是“死”，就等于证明了自己抽到的这张是“生”啊！于是他灵机一动，上前抽出一张“纸阏”，然后一口吞下去。现场所有人都傻眼了，大家只能通过刘墉没有抽到的那张，来反证刘墉抽到的这张是什么。那张打开果然是“死”，基于“排中律”，乾隆皇帝只好赦免了刘墉。


    哇，原来反证法还能救命？那我应该怎样学好、用好反证法呢？


    # 运用：反证法三个必不可少的步骤


    一个缜密严谨的反证法，有三个必不可少的步骤：反设，归谬，存真。


    比如我常说“成功企业转型，获得二次成功，是小概率事件”。这个观点，很难用三五句话证明，那我们来试试反证法。


    # 第一、反设。我们反过来假设这个观点不成立，也就是“成功企业转型，获得二次成功，是大概率事件”。


    # 第二、归谬。那么，管仲、商鞅、陶朱公，这些曾经成功的企业，就会大概率基业长青活到今天，商业世界中，应该 是“管仲控股”，“商鞅集团”，“陶朱公科技”的天下，哪还有你们什么事。


    # 第三，存真。所以“成功企业转型，获得二次成功，是小概率事件”。


    # 小结：认识反证法


    排中律，说得学术一点，就是指在同一个思维过程中，两个自相矛盾的思想不能都假，必有一真。翻译成普通话，就是：生存，还是毁灭，这是一个没有中间状态的问题。


    排中律，可以用于识别，和揭穿那些“模棱两可”的骑墙者，提高思辨的能力，沟通的效率。但更有名的用法，是它的儿子：反证法。用“反设、归谬、存真”的方法，在两个自相矛盾的观点中，通过证明一个观点错的，来证明另一个观点对。


    我们讲完了逻辑的三大基本定律：同一律，矛盾律，和排中律，你有什么感觉吗？有的同学可能会感觉：啊，要想做到逻辑缜密，看来真的好难啊！是的。没有经过训练的人，是很难做到逻辑严谨的。但这恰恰显示出，逻辑严谨的难能可贵之处。


