    半夜12点，产品上线的时候，罗振宇老师、脱不花老师、曾捷老师、我的产品经理李双宏老师，还有产品团队，都在一起守夜。当第一句“前人的思考，我们的阶梯”从手机里传出来的时候，我们发现，在苹果手机上很好听的音频，在几台安卓手机上听，有些差强人意。正在外地出差的我，毫不反抗，凌晨1点在酒店架起录音环境，重新制作，直到2、3点时，再次上线。大家都觉得没问题后，才各自去休息。


    就这样不断变态地挑战自己，我发现我开始越来越爱上了死磕自己的产品。在“商业、管理、个人、工具”这四大逻辑下，我的课表还在不断更新，现在已经到了第19版，就连我麻烦某企业家专门帮我定制的隔音板，都在不断升级，换了3块。最不可救药的是，我喜欢上了和你在专栏文章下面、留言区互动。我喜欢回答你的问题，看到你的成长，更重要的是，我喜欢上了从你的实践中虚心学习，获得能量。


    有同学问，为什么《刘润·5分钟商学院》一定是5分钟呢？我每天跑步20分钟，你讲20分钟好不好？也许你不知道，写5分钟的内容，其实比写20分钟要难得多。马克·吐温说：“抱歉我没有时间给您写一封简短的信，所以我写了一封长信。”我的工作方式是：先整理出2万字的素材，然后花2小时写出长文，再花3小时，把它缩短到1800字，每篇文章的字数浮动尽量在正负20个字。我每天花5小时，就是为了让你只需要花5分钟。


    而且，你知道吗？为了帮助你更容易读懂整个商业世界，在这每个5分钟里，我都按照你的思维习惯，起承转合5次，来讲述一个商业概念：第一，用一个身边场景导入，让你觉得这事和你有关系；第二，打破你的错误认知，激发好奇；第三，用一个极具说服力的案例，带出核心逻辑；第四，这还不够，还要举一反三，告诉你最有用的HOW怎么做，这时候你已经能感受到巨大的价值感了；第五，最后把所有关键点，用一两句话说清楚，重新强化概念，提炼金句，帮你把概念存在大脑中最合适的地方。


    用5分钟的时间，把挂钟的结构塞进怀表里，是我们对你宝贵的时间最大的尊重。


    今天，《刘润·5分钟商学院》有10万学员了。假如因为我个人变态的努力，能帮每位学员每天节省了1小时的学习时间，你每小时的时间成本是100元，那么一年260期，10万学员，我就帮助中国节省了价值26亿的“国民总时间”！


    在这个时代，已经不存在什么稳当的饭碗和可靠的组织，我们每个人都必须像经营公司一样经营自己。每个人，都是自己的CEO。我期待通过这一年的陪伴，你能用在课程中学到的系统的商业知识，和节省下来的大量时间，为自己，和为社会，创造巨大的商业价值。


    这，就是激励我每天工作十几个小时的动力。


    感谢你，感谢所有把这一年时间交付给我的10万学员。请相信，我身负重托，自感如履薄冰，必将用最优秀的内容，继续为大家服务。


    最后，欢迎你查看第19版的课程表，看看我为你准备的这260期商学知识。我也非常希望，你能把《刘润·5分钟商学院》的课程，分享给你的朋友，家人，合作伙伴，同事，员工，甚至老板，分享你的成长，分享你的收获。


    让我们共同期待，你的进步。


