    我在平静下来，反复想，我在童年时，也很喜欢看动画片，如果被突然关闭什么感觉？我回忆起我的感受也比较委屈。想到这里我也理解我女儿感受。

    冷静后，我去女儿身边。说，宝贝你是是不是很生气？是不是想看完这一集？女儿看都不看我一眼。我接着说，爸爸小时候也很喜欢看动画片，如果被关闭也会很难过。刚刚爸爸直接关掉动画片，有些粗暴。觉得不够尊重你，你可以原谅我吗？这时，女儿才点点头。我接着说，爸爸关闭原因是你看了很久，担心你的眼睛会受伤害。但是，我应该跟你沟通一下，等你看完这一集最后两分钟，再关闭。这样你觉得可以吗？女儿感受被同理心理解，冲过来抱住了我！


    同理心不仅是为了理解别人，也是让别人理解自己。同理心并不是迎合别人的感情，而是希望能够理解和尊重别人的感情，在处理问题或做出决定时，充分考虑到别人的感情以及这种感情可能引起的后果。

