  md: '# 137 | 先理解别人，再被别人理解


    你有没有遇到过这样的情况？你对老板说：老板，我想找你聊一聊。他问：什么事？你说，关于这个项目，我觉得…… 他放下手机对你说：别你觉得了，这个项目我知道，你的想法我也知道，你好好跟紧客户的负责人，满足他一切需求，我让其他部门全力支持你。我们这个季度非常需要这个单子，其他项目也不能放松。别担心，你一定能行……
    你觉得，你老板根本不理解你，甚至都没打算理解你。


    “双赢思维”的前提，是理解别人；而理解别人的前提，是倾听。但很多人并不真懂得倾听。为什么？因为我们太喜欢给建议了。


    # 概念：知彼解己


    假如你的眼睛不太舒服，于是去看医生。可是你刚说几句话，医生就说“我知道了”，然后把自己的眼镜摘下来给你，说：戴上吧。


    你一定心存疑虑：医生，你还没给我检查视力呢。医生说：不用检查了。这副眼镜我戴了十几年了，被证明很有用，你试试。


    # 运用：如何养成知彼解己的习惯呢？


    # 第一，戒掉“自传式回应”。


    什么是自传式回应？就是随便一个话头接过来，都能谈自己半小时，或者用自己的价值观、对事情的有限认知，轻易地给出建议。


    # 第二，用耳朵听，用眼睛看，用心理解。


    据专家估计，人际沟通仅有 7%通过语言来进行，38%取决于语调与声音，其余 55%则靠肢体语言。所以，有时基于微信的文字沟通是不够的，还要语音；语音沟通也是不够的，还要视频；视频沟通也是不够的，还要见面。


    # 第三，移情聆听。


    移情聆听，英文叫Empathic Listening，意思是，把心放到对方身上，先感受到他的快乐、愤怒、痛苦、激动，然后聆听。这是一种技能，更是一种态度，是“知彼解己”的关键。


    # 小结：认识知彼解己


    知彼解己，就是先去理解别人，然后再寻求被理解。'
