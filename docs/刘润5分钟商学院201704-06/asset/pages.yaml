  md: '# 客座教授 | 战略是决定对的事，管理是把这个事情做对


    ![](img/dfd14813ba3c000b3835771d7641e57c_58_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了及优教育科技创始人、领教工坊领教暨董事孙振耀，他曾任惠普全球副总裁、中国区总裁，扬智科技董事长，海辉软件(国际)集团董事长等。


    他将西方优秀的管理理念和先进管理系统引入中国并实现了本土化，取得非凡成就。他担任领教工坊领教及企业顾问，将其三十多年的管理经验和智慧分享给中国民企，持续推动民营企业管理能力提升和组织优化。


    很多人都很好奇，作为一个管理实战派的杰出代表，他有什么独特的管理经验，外企和民企的管理模式上究竟有何区别。这 Zhou，我们换了一种特别的方式，邀请“得到知识新闻工作室”专访了这位大牛，干货满满，分享给同学们。


    ![](img/dfd14813ba3c000b3835771d7641e57c_58_1.png)


    # 1、知识新闻工作室：您在惠普工作了很多年，也在民企工作过，您觉得它们最大的差别在哪里？


    孙振耀：我在惠普25年，在民企10年。在我看来，外企是组织文化，它的决策模式更多是按分工来的、分层授权。它是典型的网状模式，有一套固定的流程、制度和企业文化，规则摆第一。员工之间各自专注自己的工作，该我担责的就我担责。


    民企则是老板文化，决策模式是老板拍板，更多的是伞状的指挥模式，老板是原点，其他人都是点对点、对老板负责。决策很快，行动很快，但员工的主动性较弱，担责性也比较弱，要靠老板去推他。


    外企到民企，是两个完全不同的土壤。如果说对民营企业的老板们有一些建议，第一个，管理不能落后，但是也不能过度。什么叫过度？你的商业模式还不清晰，你整个团队加一起就几十个人，要上制度、要流程，就很没必要。


    创业有三个阶段：创业刚开始，强调的是执行力和团队的奋斗精神，要不断试错、不怕失败。慢慢地做到一定阶段，就要开始总结经验、规范流程、讲究战略，就不能说再无知无畏地试错了。再继续做，你就要开始搭建体系了，要有职能分工了，要开始引入流程。企业的发展是有阶段性的，不同发展阶段要解决的问题会很不一柱
    不要讨厌管理 也不要复制 要去蜂'
