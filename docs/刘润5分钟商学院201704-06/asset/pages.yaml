    \ \n06-29 22:20:01\n\n青岛罗刚 13\n罗胖对大学生说：如果我有些观点和你们的不一样，那一定是我错了。\n时代就是这样，既不尊老爱幼，也不怜香惜玉。作为一个70后，我知道我对市场的理解有很多偏差，因为现在消费市场的主力不是我们，而是80、90后，甚至马上00后也要参加工作赚钱了。\n\
