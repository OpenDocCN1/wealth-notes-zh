    # 彤彤爸爸 63


    知彼解己，这一课突然让我想到，去年发生的一件“小事”。女儿下幼儿园，她告诉我今天老师教了她们，要分享。我在聆听时，正好碰到邻居洗了几个干净苹果，送给了她一个。


