    本周的拓展学习能力，是个人成长的一个重要能力。


    +   1、学习什么，学习知识、技能、态度三项。知识记住就能用，技能要反复练习才是你的，态度是你打磨的价值观。用脑学习知识，用手学习技能，用心学习态度。不要把知识当技能学，去“重新发明轮子”；也不要把技能当知识学，当“理论主义者”不去练习。

