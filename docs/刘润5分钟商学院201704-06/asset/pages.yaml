    161 | 白马到底是不是马？


    今天，我终于可以开始讲一个，我憋了很久，一直想讲的话题了，那就是：逻辑。很多人 Nhou 沟通时，一件事怎么都讲不清楚，严重影响了商业效率。我常说，如果我们能从小学开始学逻辑，将会大大减少无效沟通，提高效率，GDP估计能上1个点都不止。


    《教父》这部电影里面有一句话：花半秒钟就看透事物本质的人，和花一辈子都看不清的人，注定是截然不同的命运。下面，我将用一周的时间来讲讲，帮你“看透事物本质”的“逻辑思维”能力（逻辑的逻啊，不是罗胖的罗）。


    首先我们从一个问题开始。你听听，下面这句话有没有问题：


    人已经存在几百万年了；而你没有存在几百万年；所以你不是人。


    啊？这句话显然有问题啊！我当然是人啊。


    # 概念：同一律


    那么，问题出在哪里呢？这……很多人就蒙掉了。这句话的结构，本身是一个逻辑严谨的三段论：大前提，小前提，结论。推理过程没问题，但结论显然不对。这个问题就出在，它偷换了“人”这个概念。


    “人已经存在几百万年了”，这里“人”，指的是作为物种整体存在的“人类”；而“所以你不是人”，这里“人”，指的是作为生命个体存在的“人体”。一句话里，两次用到“人”这个字，但指代的却不是同一个概念。说话的人，借助语言系统的缺陷，'
  merge: -1
  img_proc: true
- pgno: 106
  md: '到“人”这个字，但指代的却不是同一个概念。说话的人，借助语言系统的缺陷，偷换了概念。


    那么我们就要理解，什么叫“概念”。


    概念，有两个部分：内涵，和外延。比如，“产品”这个概念，它的“内涵”<|message|> 人们通过劳动创造出来的新物体。那“外延”呢？就是所有拥有这个内涵的物体：苹果做的手机，你太太做的饭等等。


    那“商品”呢？商品，它的内涵是“用于交换的产品”。这个内涵，比产品的内涵更丰富了，随之带来的，就是外延的减少：你太太做的饭，就被排除出去了。


    所以，从产品，到商品，到进口商品，到从美国进口的商品，内涵越来越多，外延越来越少。


    你发现了，内涵和外延稍微一变，就不是同一个概念了。这世界上的概念，几乎无穷多。但是，文字是有限的。人 마须用有限的文字，表述无穷的概念。于是，大量明显不同的概念，只能共用一个名字。人类语言系统的这个BUG，就给“偷换概念”者，留下了巨大的空间。


    # 运用：内涵和外延须保持同一


    那怎么办呢？逻辑学家提出，我们在沟通时，必须遵守一个基本原则：同一律。也就是前后提及一个概念时，内涵和外延必须保持同一。


    # 小结：认识同一律


    同一律是逻辑三大基本定律之一。它要求人们自觉地保持同一思维过程中概念、判断（论题）的确定性。或者说，它要求人们的思维具有确定性。


