  md: '# 客座教授｜人工智能+教师 = 未来教育生态系统


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了VIPKID的创始人兼CEO米雯娟。她是教育领域的成功连续创业者，拥有近20年少儿英语教育行业实战经验，曾作为联合创始人，带领ABC英语从零开始增长成为少儿英语行业领域排名前五的教育集团。2013年创办VIPKID，如今已发展为在线少儿英语行业第一品牌，拥有超过10万的付费用户和10000多名北美外教，并获得中美顶级投资机构的注资，成为教育行业成长最为迅速的独角兽企业。


    很多人都很好奇，为什么VIPKID能够在英语培训领域迅速崛起，它有什么独特的模式。这一周，我们邀请“得到知识新闻工作室”专访了这位大牛，干货满满，分享给同学们。


    ![](img/dfd14813ba3c000b3835771d7641e57c_75_0.png)


    1、得到知识新闻工作室：现在市场上有许多做英语培训，尤其是针对儿童的英语培训机构，你觉得VIPKID的核心竞争力是什么？为什么其他竞争对手不能模仿？'
  merge: -1
  img_proc: true
- pgno: 76
  md: '米雯娟：我们的“护城河”有四个方面。


    第一个就是商业模式，我们的模式更像是 Uber，是共享经济的一种升级，平台一方面整合全球最优秀的美国的小学教师资源，一方面整合了中国的儿童英语学习资源，让双方能够通过互联网在线上随时随地的连接沟通。


    第二个是VIPKID的拥有全球稀缺的英语教育资源，我们的师资全都是美国、加拿大的高学历老师，他们是经过严格筛选的，通常一个月有好几万个老师来应聘，但我们只选其中的两、三千个老师，录取率不到10%。这些老师不但口音纯正，且都有教授英语非母语国家孩子的丰富教学经验。这与普通一个外国人教英语，教学质量上有极大的差距。


    怎么找到这些符合条件的老师呢？就是让小朋友来当面试官。如果老师只会说，我有几年的教师经验，考下来过什么证书，这些在小朋友面前是行不通的。作为老师，他们需要要想办法让孩子的注意力集中在自己身上，小孩子的注意力特别容易分散，如何引导孩子能够集中注意力，对英语学习感兴趣，享受学习过程不是轻松就能做到的。举例来说，比如教Spider这个词，老师为了让小朋友感兴趣，就可能模仿蜘蛛侠，让小朋友记住Spider（蜘蛛）这个词。


    第三个是VIPKID自主研发的适合母语非英语线上的教材。我们的教材是对标CCSS（Common Core State Standards，美国共同核心州立教育标准）的标准，专门为了线上学习，为了教会老师如何很好和孩子互动。好教材就像很棒的基础设施，做得好，老师教学效率高，学生体验好，兴趣大。但做不好，可能老师教的难，孩子学起来也枯燥无味。


    第四个是VIPKID全端的移动化体验。VIPKID在整个基础设施上有很多的投入，比如说我们的音视频技术，能同时支持几万节课程，用户几乎没有异地交流的延时感觉。另外我们各个移动端上，孩子们现在都喜欢带着一个iPad自己上课，家长也可以在移动端观看孩子们上课的视频过程回放，直观地看到每堂课的老师评价。正因为体验好，我们现有用户成为我们忠实的用户，并成为我们产品的传播者，目前每个月一半左右的新用户，都是老用户推荐的。


    # 2、得到知识新闻工作室：现在很多行业都在谈大数据，作为线上的培训机构，VIPKID是怎么获得数据，又是怎么利用数据进行迭代的呢？


    米雯娟：VIPKID会把大数据平台、人工智能等等技术，当做教育的重要辅助工具，从两个方面让教育更加个性化。


    第一个，通过技术手段更好地了解孩子。现在的技术，能让教育过程变得可追溯。在孩子课前预习、课中学习、课后练习阶段进行全程记录，及时了解孩子学习状况，更方便地评估孩子的学习进展和效果。比如说，课前学生可以标出自己掌握不好的点，上课时，老师可以根据课前反馈加强重点讲解；课中，老师也可以实时标注学生每个知识点的学习和掌握情况；而课后作业的每道题，都可以关联到一个知识点，通过学生的答题，就可以很明确地知道学生对学习知识点的掌握情况。


    未来，我们可以通过监控孩子的语音，了解孩子的发音标不标准、句子完不完整、语法对不对；还可以通过监测视频，来了解学生互动和上课的状况，通过他的注意力、面部表情等来判断孩子是不是在开心地学习。这些信息综合起来，就可以帮助成为跟踪和评估孩子学习进展的手段。


    所有对孩子的个性化教育的设置，都是在了解孩子的基础上进行的，之后我们还会利用人工智能技术来给他们制定个性化的学习路线。比如说，如果人工智能发现孩子某个级别的课程学的特别好，知识点都掌握了，系统自动评估后就会建议学生跳级。再比如，系统还可以根据孩子对知识点的掌握情况，自动组合生成课程大纲，着重帮孩子学习掌握不好的课程点，避免不必要重复的学习，查漏补缺。


    # 3、得到知识新闻工作室：刚才你提到人工智能，那VIPKID未来会怎么发展？你觉得未来的教育会是什么样的？


    米雯娟：我们一直致力于通过技术的手段为孩子提供个性化的英语学习体验。


    现在VIPKID拥有的1万名外教完全能满足所有学员的学习需求，我们也开展了很多国际化的战略，比如我们在美国成立了分公司，加快了北美市场的教师招聘流程，还会定期和北美外教访谈和面对面沟通，让外教更好地了解中国孩子的需求。我们希望用互联网，连接美国400万的老师和中国1.5亿的小朋友，满足小朋友们学习英语的需求，这个在供给端和需求端都有非常大的市场需求。


    我觉得未来的教育，一定是人工智能和教师相互结合的。随着人工智能的发展，目前无论是线上教育，还是线下教育，遇到的一 些问题都会逐步得到解决。未来人们可以随时、随地接受教育。同时因为人工智能的发展，未来很多重复性、标准化的工作都会被人工智能所取代，针对重复性、标准化工作的教育，也将过渡到追求更加个性化的定制式教育，教师的作用就会凸显出来。人工智能和教师相结合，将会打造出一个全新的教育生态系统。


