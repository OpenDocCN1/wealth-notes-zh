    远见，是一种尽可能接近未来的推理能力，它的基础是：洞察力、判断力、学习力。


    # 运用：训练“远见”的三种基础能力


    我们不敢说拥有“远见”，但可以训练这三种能力。


    第一，洞察力。


    洞察力，是远见的基础。你之所以有勇气“预测未来”，是因为你相信，有些没变的底层逻辑，在推动着变化。对方法论之下的底层逻辑的理解，就是洞察力。


    举个例子，你开一家餐厅，10年、20年也没有太大的变化。这时候，你和同行切磋的不过就是一些方法论层面的东西，位置开在哪儿，菜单怎么设计之类的。但“饿了么”出现了，很快你就发现，原来餐厅是“前面桌子
    + 后面厨房”的组合，“饿了么”把你前面的桌子取代了。过段时间，“爱大厨”出现了，你会清楚地感受到，厨房这部分其实就是“厨师 + 设备”的组合，谁能抓住厨师这个核心要素，谁就有可能分到餐饮行业的一杯羹。


    这就是不断通过去除方法论中的假设，洞察底层逻辑。


    ![](img/dfd14813ba3c000b3835771d7641e57c_213_1.png)


    第二，判断力。


    洞察了底层逻辑之后，就要判断环境的变化，用“底层逻辑 + 新假设”，得到远见了。


    作为战略顾问，我每天和不少的企业家打交道。blendtext


    怎么训练判断力？一定要对新事物充满好奇，勇于尝试，让未来在你眼前扑面而来。具体来说，关注各种新科技，新行业，新需求。还记得第48课讲的“技术采用生命周期”吗？尽量做一个做“早期采用者”，至少做一个“早期大众”。


    第三，学习力。


    第151-155课，我们讲了一周的学习的方法。为了获得远见，我们应该用这些方法向谁学习呢？我们尤其应该向年轻人学习。


    那怎么办呢？玛格丽特·米德说：我们所有人，都要向年轻人学习。为什么？不是因为他们更理解未来，而是因为就是他们，构成了这个未来。老年人开始反过来，向年轻人学习，她把这种反向的学习文化，称之为：后喻文化。


    商业篇第48期｜技术采用生命周期：跨越死亡之谷 个人篇第152期｜库博学习圈：知识是经验的升华 个人篇第155期｜快速学习：如何用20小时快速学习


    # 小结：认识“领导力：远”


    我用一周的时间，与你分享了互联网时代领导力的五个要素：专、小、变、快、远。


    专和小，是空间维度的概念，因为专，所以小；变和快，是时间维度的概念，因为变，所以快。而远，也就是远见，也就是站在未来看今天，是在整个商业篇、管理篇、个人篇三个季度的修炼后，最终达成的结果。


    我们谁也不敢说自己能预测未来，但是我们至少可以训练预测未来的几项基础能力：洞察力，判断力，和学习力。


    远见，是尽可能接近未来的推理能力


