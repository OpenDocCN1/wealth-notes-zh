  md: '# 周末小结 | 第二场管理篇线下大课，来了！


    《5分钟商学院》的同学们，


    大家周末好！


    前人的思考，我们的阶梯，欢迎收听“刘润·5分钟商学院”周末特别版。


    听完一周的学习能力，你感觉怎么样？很多同学都在说，醍醐灌顶。是的，学习本身也需要学习，但是正如我们在课程中说到的，我们不仅要学习知识、也要学习技能、学习态度，我们不仅要自学、还要向他人学习、在实践中学习。现在，我们难得的、线下面对面的、也是向同学们彼此学习的机会，又终于来了。


    经过大家投票，《刘润·5分钟商学院》“管理篇”的第二场线下大课，决定于6月3日在北京举办。深圳大课，我特意准备了一块超宽幅的高清LED屏幕，反复多次优化PPT，给大家呈现大片级的学习效果，就是希望在带给你们更多干货的同时，也能让你们有不一样的惊喜。这次的北京场，我也会尽量做得更好。


    如果说“商业”是讲如何对外，“管理”就是讲如何持家，两者缺一不可。我相信，很多学员在这一季度的学习中，已经深刻感受到了“不当家不知柴米油盐贵”，原来CEO真不好做，举手投足皆学问。所以，我打算在管理篇的大课中，分享这四个方面的逻辑：


    第一，企业生命周期。这个世界上 бесс 放之四海而皆准的管理方法论吗？这世界上能帮助企业基业长青的战略和组织吗？为什么管仲，陶朱公的企业，没有活到今天？企业的发展有三个阶段：创业期，成熟期，转型期。我将在这个部分，帮助大家定位自己的阶段，并寻找合适的管理方法。


    第二，创业期管理。为什么小米说没有KPI，罗辑思维说没有组织架构，很多创业者甚至说他们痛恨管理？创业期的企业真的不需要管理吗？那他们需要什么？创业者成功，到底是靠努力，还是靠运气？我会在这一部分与大家分享，创业期企业的成功特征。


    第三，成熟期管理。企业越来越大，这到底是好事还是坏事？哪些创业期要的聪明、抖的机灵，必须被抛弃？游击队如何变成正规军，将猎如何变成农耕？战略必须流程化吗，流程必须工具化吗？我会在这一部分与大家分享，参天大树，和破土幼苗，到底不同在哪里。


    第四，转型期管理。没有成功的企业，只有时代的企业。这就像人一样，死因各不相同，但死是必然的。健康长寿，不代表永生；医疗先进，不代表免死。那应该怎么办？我会在这一部分与大家分享，真正的转型，重获新生，到底怎么做。


    这次的管理篇大课，内容会和深圳场一样的原汁原味。大课前6月2号的晚上，我还依然会和10名学员，有针对性地深入讨论你们自己企业的问题。这个名额非常少，每次都是一天之内售罄，想参加的学员，一定要手快。


    期待在北京看到大家。升级到最新版得到App，点击下图即可购买，订阅用户可享受八折优惠。


    ![](img/dfd14813ba3c000b3835771d7641e57c_80_0.png)


    这是“刘润·5分钟商学院”在线下陪你成长的第四课，管理篇的第二课，期待你的参与。


    # | 本周留言精选


    我们老大有几句经典语录：


    +   1、我们现在不能算作为成功，仅仅是失败了无数次还没死而已。


    +   2、不是我们多优秀，而是同行对手给了我们一些机会衬托的我们好一点而已。这样的老大，导致公司内部危机意识很强，大家比较谦虚低调、闷头做事、害怕是因为运气走到了今天，所以不停努力。而且公司内部试错文化也
    Verw强，我们胆子都很大，敢想敢干，因为只要初衷是好的，试错成本是公司出的，虽然这样一来可能浪费很大，但也一直保持了比竞争对手快一些的节奏。


    有点像项目管理上的PDCA循环，P（plan），D（do），C（check），A（act）。关键要check，但还是要落在do和act上，直到达成要的目标和水准。一个新的项目执行，就是学习的过程。计划开始就要行动，行动过程中就会产生初步结果，然后检查出偏差，通过反思和验证，找出偏差的原因和保证成功的规律，最后再用正确方法行动。


    第一季度的商业篇主要是讲知识，讲前人总结好的商业精典。比如流量成本是商业的基本逻辑之一，网络效应是互联网商业的基本定律，利用鸡蛋理论可以引导消费者，金融投资要防范庞氏骗局，最小可用品可以用最低成本displaystyle
    并快速迭代，产品不可替代时用饥饿营销手段提升品牌附加值等等。这些商业知识要多学习、多了解，不要自己去一一验证，是可以拿来就用的知识。


    第二季度的管理更偏重技能，是我们知道但若没有做过就掌握不好的。我们知道期望理论能激发员工善意，但在实际工作中如何运用，让员工达到“跳一跳够得着”的效果，还得多多练习。同样如何AIN现实中运用贝尼斯定理育人，如何用酒与污水定律识别、清除污水型员工，总监如何抓大放小管细，如何向上管理上级，企业如何永续经营。把这些理论运用到实战中，知道和做到还差着很多的练习的积累。


    第三季度的个人篇，虽只学了五周，但“高效习惯”、“时间管理”、“职业素养”和这周的“学习能力”都是用来改造自己对这个世界的态度。比如积极主动地看待事物，用GTD达成“要事第一”的办事态度，要有区分事实和观点世界观，要有厚博学习圈这样的学习、成长的方法论。'
