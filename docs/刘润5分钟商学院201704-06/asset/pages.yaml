  md: '# 客座教授｜始终要明白你想达到的目标是什么


    《5分钟商学院》的同学们，大家周末好！


    这一周，我们特别请到了《高效能人士的七个习惯》的作者Stephen R. Covey 的儿子，富兰克林·柯维（Franklin Covey）全球信任力解决方案执行总监，Stephen
    M.R. Covey。作为组织信任专家，他所著写的《信任的速度——一个可以改变一切的力量》曾荣登《纽约时报》、《华尔街日报》畅销书榜第一。他也凭借丰富的实践经验以及对组织实际问题的独到看法，获得了普遍认可。


    很多人都很好奇，他是如何看待高效能人士的七个习惯，在自己的日常中又是如何践行的。这―周，我们请他来分享一下其中的秘诀。


    我们都知道7个习惯很重要，但很难坚持，有没有<|message|>  可以让人一直保持这些优秀习惯？


    如果你只是想取得一些小进步，那就改变行为。如果你想取得较大的进步，那就必须要改变思维。


    当你觉得改变思维有困难，不妨从改变行为开始。你可以从任何一个习惯开始实践一周，虽然一个习惯的最终养成大概需要1个月，但一般一周就会看到是否有成效。在过程中，你可以想象自己在爬一个盘旋而上的楼梯，每一级楼梯就是一个习惯。


    比如你先从主动积极开始，然后是以终为始，要事第一，知彼解己……到达了第7个习惯后，你再一次实践主动积极开始，但此时你的理解已经完全提升到了另一个高度。越往上爬，你对自己将越有信心。有时候生活就是“走两步，退一步”。你可能感到自己已经做到主动积极了，那先鼓励自己一下，然后再回想一下过去为什么会消极。只要你始终保持积极心态，对未来抱有希望，你就能继续往上爬。每次前进一小步，然后自我鼓励一番，即使只是很小的进步。


    有一天，当你回望走过的楼梯，会惊奇地发现自己已经爬得很高。实践并掌握7个习惯的过程就像爬楼梯的过程，持之以恒，总有一天这些习惯对你来说会像呼吸一样自然流露，你也将最终通过改变行为来改变思维。


    If you want to make minor improvements, work on changing your behaviors (your
    Do). If you want to make major improvements, work on your paradigms (your See).
    If you struggle with working on your paradigms, start with the Dos. Try the habits
    for a week. Test any of the principles. Sometimes it takes a few months to form
    a habit, but you should start seeing results in about a week. Then keep going.
    Eventually, doing the Dos will start to change your Sees.


    In your journey to live the 7 habits, it also helps if you think of your life
    as an upward spiral, like a staircase going up and up. Imagine that each step
    is one of the 7 Habits—Habit 1: Be Proactive, Habit 2: Begin With the End in Mind,
    and so forth. After Habit 7, you would then run into Habit 1 again, but this time
    you would have progressed Habit 1 to a different level. As you move up the spiral
    staircase, be patient with yourself. Sometimes life really is “two steps forward,
    one step back.” You may be feeling proactive and patting yourself on the back
    one minute, then wondering why you were so reactive the next. If you persist and
    stay hopeful, you can keep going up the spiral staircase. Take Baby Steps and
    applaud your steps, even your Baby Steps. One day you will look down the steep
    spiral staircase and be amazed at how far you have come. Make mastering the 7
    Habits an ongoing upward spiral in your life. Continue & persevere. The day will
    come when the habits are just as natural to you as breathing.


    人的习惯是很难改变的，碰到拖延症晚期的，怎么克服习惯去完成“要事第一”？怎么把不重要的紧急的事情区分出来？


    你要先明白最终想要达到的目标究竟是什么，然后列出为了实现这些目标，每天必须完成的最重要的事情。想要克服习惯达到“要事第一”，就一定要弄清楚哪些是最重要的事情，然后付诸行动。为了能长久贯彻这些原则，你需要时刻跟进目标的完成进程，根据这个进程去行动，而不是某—时刻的一时冲动。


    哪些事情是“紧急”的呢？判断标准就是，你必须衡量和确定对某件事情是否需要立即做出回应。如果这件事情不能在接下来的几个小时内或当天完成，后果会很严重，比如，错过客户的截止日；错过出版发布的截止日等；或者是是否有其他人必须依赖这件事情的结果去完成他的目标。


    In Habit 2, you learned the importance of determining your values and understanding
    what it is you are setting out to achieve. Habit 3 is all about actually going
    after those goals, and executing on your daily priorities. Putting first things
    first means doing the most important things in your life.'
