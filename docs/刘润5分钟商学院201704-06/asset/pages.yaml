    探索者 29

    说到开会就会想起美国的制宪会议，会想起富兰克林，华盛顿等几个人不同角色的扮演。开会是个技术活，所以需要懂得一些技巧，正好前些天做了一个关于开会的清单笔记分享一下


    +   1. 所有的会议，都需要有一个明确的类型和目的；所有动作，务必都围绕这个目的展开。

    2. 充分的会前准备，令会议更加高效，比如会前最好有阅读材料。

    3. 时间是会议最大的限制条件，会前一定要对会议时长做出规划。

    4. 开会前一定要明确地设定好角色：主持人、动议者、参与者、决策者、旁观者、记录员，都要具体到每一个人身上。

    5. 主持人最好在开会前，花5分钟明确会议议程，这有助于组织者以“上帝视野”统筹全局。

    6. 主持人还有一个最重要的任务：严格按照议程的时间组织讨论，并在每个环节结出时间提示。

    7. 会议开始前，要先对此次会议的议题进行简单的陈述，建议不超过5分钟。

    8. 讨论环节，同时时间只能有一个对话，且一个时间只能一个人讲话。

    9. 决策者的任务，就是给出同意票或者反对票。

    10. 旁听席的设立，可以让相关团队成员熟悉决策流程，获取信息，但是旁听者只有听的权利，没有发出任何声响的权利。

    11. 会议必须有结论，必须有明确的下一步。

    12. 在会议的当天，向与会者发出会议记录。超过24:00未发，可以对会议记录员进行适度的“惩罚”，比如，向与会者发红包。

    13. 鼓励非正式的沟通。比如，洗手间的偶遇（证实罗辑思维经常这样），午餐间的对话……这样的会面，效率远高于正式的会议。


