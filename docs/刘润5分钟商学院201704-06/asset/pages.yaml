    手卡有很多形态。美国总统常用的“电子提词器”，就是一种特殊的وله卡。你听过马云的演讲吗？你有没有注意过，马云手上常常拿着一个酒店的信纸夹板？这也是一种特殊的ёх卡。


    ![](img/dfd14813ba3c000b3835771d7641e57c_162_0.png)


    # 第三，用脱稿，代替手卡。


    脱稿演讲，是不是就是“背诵”呢？


    背诵式演讲，是比朗诵式演讲更坏的习惯。朗诵式演讲，你至少不用担心说错，所以还心有余力关心自己的语调。而背诵式演讲，你几乎所有的心力，都在回忆。你把演讲变成了记忆比赛。它可以帮助你应付一两场演讲，但会阻止你成为真正优秀的演讲者。


    永远，永远不要背稿。当你需要背的时候，恰恰说明你准备的还不充分。脱稿演讲，是在充分练习基础上，把PPT，或者手卡上的核心逻辑，写在心里面。当你手卡越来越少的时候，你离脱稿就越来越近了。


    别用朗读和背诵掩盖“现场组织语言”能力的不足，不要怕出丑。所有前期的出丑，都是为了后期的优秀。慢慢练习吧，从读稿，到PPT；从PPT，到手卡；从手卡，到脱稿。


