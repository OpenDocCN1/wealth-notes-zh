    # 概念：人际关系处理


    什么是情感账户？情感账户，是人际关系的一种比喻，这个账户里存的是信任，价值，情感。情商中所谓的“人际关系处理”，本质上就是在情感账户里存款和取款的行为。


    2014年，著名财经作家吴晓波写了一篇文章：《只有廖厂长例外》。25年前，吴晓波还在复旦读书时，发起了到中国南部考察的计划。但作为穷学生，他能筹措到的盘缠捉襟见肘。这件事被素未平生的湖南的某企业家廖厂长知道了，廖厂长决定无偿资助吴晓波7000元。7000元在当时，不是一笔小钱。吴晓波前去感谢，发现他其实并不非常富有，就更感激了，问有什么可以回报的。廖厂长说：不需要什么回报。报告出来后，寄给我一份就好。


