  md: '# 客座教授｜如何做个理性明白人？


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了北京大学国家发展研究院教授薛兆丰。他是得到APP订阅专栏《薛兆丰的北大经济学课》主理人，对法律、管制与经济增长之间的关系具有独特见解。他长期关注信息技术创新与互联网商业在中国的发展，著有《经济学通识》、《商业无边界——反垄断法的经济学家革命》等畅销读物。


    很多人都好奇，经济学除了能让我们更好地认清世界，还有什么其他价值？这一周，我们请薛老师来分享一下他的看法。


    ![](img/dfd14813ba3c000b3835771d7641e57c_0_0.png)


    刘润


    有个说法叫“经济学帝国主义”，也就是说，经济学的原理可以用来解释很多事，它可以入侵到很多领域，比如心理学、社会治理、政治，请薛老师解释一下什么是“经济学帝国主义”？“经济学帝国主义”不能涉及的事情是什么？


    很荣幸应邀来到刘润老师的课堂，还被刘润老师亲自提问。我看了各位的问题，都很难啊！我挑了两个最容易的，也还是不好对付，让我试试看。


    经济学帝国主义，就是把经济学的gung基本原理和分析方法，运用到其他社会科学研究的领域中去的信念和做法。到目前为止，已经没有哪个社会科学是不被经济学入侵的了，尤其包括政治学、法学和社会学。


    传统上被认为不属于经济学研究的问题，如民主选举、官僚升迁、违法侵权、道德习俗、乃至结婚生育，都被经济学的光芒所照亮。由于揭示了事物内在的相关性和因果性，经济学对这些问题的分析，已经是那些领域的学者所无法绕过的了。


    经济学为什么能有这般能耐呢？因为经济学根本上是一门研究“存活的规律”的学科。它不管人是不是理性的，也不Ads人是不是自私的，它关注的是个人、组织、乃至社会制度的生存和发展的规律。


    只要有两个以上的人在，就必然有不同的需求，就必然产生交换，就必然有信息不对称，就必然产生冲突和协调，那经济学就必然能派上用场。正因为这样，经济学就成了社会科学里的帝国主义者。


    我自己就是一位经济学帝国主义者，在我的“北大经济学课”专栏里，有此起彼伏的实例来说明这一点。如果经济学只限于研究商品和货币现象，那它就太无趣、太无用、太无能了。


    但同时，我们也要认识到经济学帝国主义容易犯的两个毛病。


    一以为建立了数学模型，就解释了世界。当前主流经济学研究，存在这种不良倾向，以为一上来建立一个复杂的数学模型，然后代入一些数据，就能把问题研究透了。真正的经济学帝国主义者，是要深入问题的现实情境，充分掌握具体的约束条件，耐心把握可见的和不可见的因素，才能作出分析和推测的。


    二是以为经济学可以取代其他学科。一幢高楼拔地而起，就这个现象，可以通过哪些学科来解释呢？除了经济学，至少还包括物理学、化学、建筑学、材料学、城市规划学、美学、政治学、社会学和法学'
  merge: -1
  img_proc: true
- pgno: 1
  md: '括物理学、化学、建筑学、材料学、城市规划学、美学、政治学、社会学和法学吧。事实只有一个，但解释的维度是无限的，经济学永远只其中之一。所以，我对刘润老师的问题的回答是：凡是涉及人的事情，经济学都有发言权；但与此同时，经济学也不能替代别的学科，作别的学科所能专门作出的解释。


    +   1、 冒昧一下，想问一个有些刁钻的问题，怎样看待最富有的人都不是经济学家？像熊彼特这么伟大的经济学家最后也落得四处讲课还债的地步？

    2、 经济学除了能让我们更好地认清世界，还有什么作用？如何看待经济学对于每个人生活的价值？


    如何看待最富有的人都不是经济学家？我认为要把“找钱”和“找知识”分开来，它们是人生的两个目标。不能以为如果挣不够钱，就算不上富有知识；否则，我们直接把富豪称为经济学家、把每年的诺奖直接颁给当年的世界首富得了。


    同样也不能以为，只要跟有钱人在一起，观摩他们的言谈举止，就能够掌握挣钱的必杀技；否则，我们就不用学习了，直接应聘富豪身边的工作人员得了。其实，在富豪身边工作的人，大部分也没有因此变成富豪。


    把挣钱和求知分开来看，就不难理解经济学家财富状况的起伏了。他们可能是赚得少，也可能是花得多。我们不能说男高音歌唱家帕瓦罗蒂挣得少吧，但他由于买了个城堡，到晚年还坚决登台献艺还房贷。


    结合上面我对刘润老师的回答，我们就能明白，经济学不是一门关于个人如何挣钱的学问。所以，我们不以经济学家最后能挣多少钱，或剩下多少钱，来评判他的学问的价值。同样道理，我们不能根据医生是否生病，来判断医学知识是否有用。


    你的第二个问题是，如何看待经济学对于每个人生活的价值？我个人的体会是，我常常回看那些我今天不以为然的观点、想法、言论，感觉好愚蠢——我其实很容易就会变成那个我不以为然的人。


    学习了经济学，我不仅学会了一些实用的知识和概念，比如成本的概念、利息的概念、公司治理的原理等等，还让自己看待社会上种种现象的时候，变得理性了，悦纳了，乐观了。对于你的这个问题，我一般就这么回答的。但内心深处，其实还有一层从未说出来的答案，那就是学习了经济学，我产生了优越感、精英感和使命感。


    最近，我在看北大国发院同事马浚教授的新书《管理决策》（北京大学出版社2016年11月）。马老师的名言是“决策就是拍脑袋”，我读此书是想了解，脑袋如何才能拍得大致地对。


    刘润


