  md: '# 178 | 精彩绝伦的开场，和余音绕梁的结尾


    178 | 精彩绝伦的开场，...


    有位朋友问我：润总，我知道演讲需要长期训练。但演讲到底有没有“低垂的果实”可摘，先快速提升演讲效果，然后我再爬树，不断精进呢？


    我说，那你就先学学，如何开场和如何结尾吧。


    # 概念：开场结尾


    一个精彩绝伦的开场，可以帮你的演讲拿到预判分；一个余音绕梁的结尾，可以帮你的演讲拿到附加分。


    案例：


    有一次，我受泉州商会的邀请，在厦门给企业家们做一场关于“企业转型”的演讲。正好前一天，史上最强台风莫兰蒂重创了厦门。我上台后说：


    > “莫兰蒂台风肆虐厦门，35万株大树被吹倒。今天的经济环境，就像这场台风。我们为救灾感动，但我们最终要研究的是那些没倒下去的树。倒下去的企业，是迎不来春天的。”


    大家频频点头，开始放下手机，认真听我的演讲。


    这就是开场。


    # 运用：精彩开场法和金句结尾法


    一个精彩的开场，必须帮助演讲者聚焦注意力，激起好奇心。


    当然，如果你是王健林，自带注意力和好奇心，那我恭喜你，你说什么都是对的。但如果你不是，可以试一试下面几个方'
  merge: -1
  img_proc: true
