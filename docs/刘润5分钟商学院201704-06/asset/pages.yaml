  md: '# 158 | 冻死在那个不存在的冬天


    有人拜访子贡，问：一年有几季？子贡说，春夏秋冬，四季。那人说，错，只有春夏秋三季。两人争论不下，去问孔子。孔子观察来人后，说，是的，只有三季。来人满意离开。子贡不解。孔子说，来人一身绿衣，分明是田间蝼蛄。蝼蛄春生、秋亡，一生只有春、夏、秋三季，哪里见过冬天。在他的思维里，完全没有“冬天”这个概念，你和他争论三天三夜，都不会有结果的。


    这个孔子说的田间蝼蛄，后来被称为“三季人”，也就是没有全局之眼的人。今天，就我们来聊聊这个极其重要的思考能力：全局之眼。


    # 概念：全局之眼


    什么叫全局之眼？这世界上的所有东西，都是被规则作用着，以一种叫做“系统”的方式存在着。要素，是系统中你看得见的东西；关系，是系统中你看不见的、要素之间相互作用的规律。看到要素，还要看到要素之间的关系，更要看到这些关系背后的规律，就叫做“全局之眼”。


    不少企业家知道，旺铺很重要。可是旺铺为什么这么重要？是因为更好的地段带来了更多的人流。所以，人流，其实才是“旺”和“铺”这两个要素之间的关系，是这关系背后的规律。如果理解了这一点，就可以把这个规律推演到整个系统中，哪里人流多，哪里就会旺。

    于是，早期的PC电商，后来的移动电商/微商，后来的社群经济，现在的网红，未来的移动直播、虚拟现实（VR），就一下子都理解了。理解了关系，和关系背后的规律，你不但能在复杂的系统中理解现在，甚至可以一定程度上预测未来。所有的战略，都是站在未来看今天。


    # 运用：如何建立全局之眼


    如何才能拥有全局之眼呢？我的本科，读的是南京大学数学系。这四年近乎残酷的数学学习，对我此生影响最深的，是一门叫“系统论”的课程。这门课程让我受益终身。我建议如果可能的话，每一位企业家都可以去学习“系统论”，学习用关联的、整体的、动态的方法，全局性看问题能力。


    第一，关联之眼。


    事物之间，都不是孤立存在的，它们相互作用着，这种相互作用，叫做关联性。


    拥有全局之眼，首先要练习用关联之眼看清事物。比如，“旺”和“铺”之间是什么关系？平台和产品之间是什么关系？引爆点和网络效应之间是什么关系？企业文化和人性之间是什么关系？个体理性与群体感性之间是什么关系？等等。


    第二，整体之眼。


    要素，加上若干要素之间的关联，构成了系统，并形成“输入、黑盒、输出”三个物体。这个黑盒内部，用你理解、或者不理解的方式精密运作着。


    # 小结：认识全局之眼


    在商业环境巨变的今天，要懂得关联地、整体地、动态地看问题。当你拥有关联的（二维），整体的（三维），动态的（四维）看待事物的能力，你就拥有真正的全局之眼，可以站在未来看今天。


    ![](img/dfd14813ba3c000b3835771d7641e57c_88_0.png)


    世界上的所有东西，都被规则作用，以一种叫做“系统”的方式存在着。要培养用关联、整体、动态的方法，全局性看问题能力。'
