  md: '# 周末小结 | 用第一性原理 回到商业本质


    ![](img/dfd14813ba3c000b3835771d7641e57c_2_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这一周是管理篇课程的最后一周，我们用了几个月的时间，帮大家搭建了商业篇和管理篇这两块重要的知识体系。其中有两个核心点非常值得你多复习几遍：企业的能量模型和企业的生命周期。


    你会发现，我们讲的很多都是基本规律和底层逻辑，也就是所谓的第一性原理。在此基础上，我们反复提倡大家用关联、整体、动态的方法去训练自己、思考问题。问题来了，为什么底层逻辑这么重要呢？


    举个例子，你开一家餐厅，一直开10年、20年也没有太大的变化，这时候，你和同行切磋比拼的不 过就是一些方法论层面的东西，位置开在哪儿，菜价怎么定，菜单怎么设计之类的。但“饿了么”出现了，很快你就发现，原来餐厅是前面桌子+后面厨房的组合，“饿了么”直接把你前面的桌子取代了。过段时间，“爱大厨”出现了，你会清楚地感受到，后面厨房这部分其实就是厨师+设备的组合，谁能抓住厨师这个核心要素，谁就可以分到餐饮业的一大杯羹。而这些，你之前居然从来没有想到过。


    这就引出了方法论的局限，所有的 方法论都有环境。它是基于第一性原理，一些基本的商业逻辑加上时代特征和行业特性，加上组织的特殊性，而产生的运营方法。当外部环境变化不快的时候，方法论还比较有用，但一旦时代和环境变化，过去的方法论很多就派不上用场了，只有把方法论剥去环境，剪掉环境假设，还原到第一性原理和商业本质，得到的基本逻辑才是核心所在。有了这个核心，再去分析用户需求和商业实现的模式，就很容易产生商业洞见和新的方法论。


    我们一直说，《5分钟商学院》的课程不是入门，是回到商业本质的洞察和透彻。希望大家都能感受到这份洞察，抓住这个时代的趋势红利，成就自己的事业。


    从旧方法，直接摸索出新方法，是实践家；洞察从旧假设到新假设的变化，是观察家；从旧方法，去除旧假设，回归底层逻辑，再理解新假设，推导出新方法，是战略家。


    ![](img/dfd14813ba3c000b3835771d7641e57c_2_1.png)


