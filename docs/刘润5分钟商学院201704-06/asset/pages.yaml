  md: '# 193 | 透过时间轴、概率轴、和博弈轴看世界


    193 | 互联网领导力之三： ... ↓


    面对商业环境巨变，公司发展遇到瓶颈，高层决定，启动一个充满挑战的创新项目，并任命你来牵头。大家对你充满期待。你有巨大压力，但也充满动力。此时，公司的CFO来找你：恭喜啊，领导非常器重你！那么现在，请你尽快填报一下新项目明年的预算吧。


    你说：啊？明天怎么干我还不知道呢，明年怎么干，谁知道啊？你看这样，明年的钱，我花到哪里是哪一些，好不好？


    估计这位CFO一拍桌子就站起来了：开什么玩笑？我们所有分公司、子公司、事业部都要填报年度预算。你没预算，我怎么知道给你留多少钱？我怎么知道你花钱是不是合理合规？我现在必须知道，明年你的每一分钱打算怎么花。


    先在这里暂停一下。我想请问，你觉得是这位CFO错了，还是你自己错了？


    # 概念：领导力：变


    还记得第 126 课讲的 “企业生命周期” 吗？企业的发展分为三个阶段：创业期，成熟期，和转型期。CFO和你的对话，其实就是成熟期，和转型期的对话。


    你在 “创业期” 的时候，懂什么叫预算吗？估计不懂。你把自己那辆车卖了20万，一咬牙一踩脚就出来创业了。到年底时你发现，“哎，居然还有5万没花完”，你会把钱突击花完吗？当然不会。


    但在 “成熟期” 的时候，你多半会。很多大公司的业务部门，到年底时发现，“哎，居然还有50万元预算没花完”，就算没有必要，他们也会想办法设法把这笔钱花完。为什么？这不是浪费吗？因为在预算制度下，明年的预计花费，是在今年的实际花费的基础上，增减一个百分比算出来的。如果今年的钱没花完，明年的钱也会因此减少。那怎么行！于是，你就看到了全球的大公司在年底时突击花钱的盛况。


    为什么会这样？成熟期的大小公司，其董事会、股东大会，都希望看到安全、稳定、可预期的业绩。所以，管理层通常会用预算制，这种本质是获得 “确定性” 的制度，管理和预计花费，甚至管理和预计收入，以准确地规划自己全年的收入和利润。优秀的公司，甚至可以精确到季度，精确到月，精确到周。


    那 “转型期” 呢？转型期，和创业期一样，面对的是同样充满VUCA（易变性、不确定性、复杂性、模糊性）的商业世界。那为什么这位CFO会拿获得 “确定性” 预算制，来管理充满
    “不确定性” 的转型，让你规划你根本不知道怎么花的钱呢？这其实不怪那位CFO，因为人的天性追求确定性，习惯把经验当真理，把流程当圣经。


    “变革之心”，对大部分人来说不是天赋，而是一种后天修炼。


    管理篇126期 | 企业生命周期：向着悬崖狂奔


