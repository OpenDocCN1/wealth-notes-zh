    169 | 吃惊，撤退，和转身...


    你有没有看过一些警察审讯，或者法院庭审的小说，或者电影？如果没有看过，我强烈建议大家看王朔的小说《柱然不供》，和周星驰的电影《九品芝麻官》。审讯和庭审，是一种特殊形式的“谈判”，警察或者律师，和犯罪嫌疑人不断当众“谈判”的最终目的，是让他承认自己的罪行。


    # 概念：出其不意策略


    经过训练的警察或者律师，会循循善诱，让犯罪嫌疑人不断往自己编撰的故事上，添砖加瓦，描绘细节，构建摩天大厦。然后在关键时刻，抽掉这个大厦最底层的一块砖，令其轰然倒塌。


    这种“抽砖”的方式，可能是往桌上拍出一个无可辩驳的证据：


    哦，真的是这样吗？死者其实是个左撇子！扳机上也是他左手的指纹。你解释一下，他“自杀”时，是如何用左手扣动扳机，射中自己的右太阳穴的！


    这时候，犯罪嫌疑人虚构的摩天大厦会立刻崩塌，他的心里也会随之崩塌。这种特殊的谈判策略，就叫做“出其不意策略”。'
