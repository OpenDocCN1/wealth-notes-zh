    分享《细节》这本书中关于如何高效开会的提醒：


    +   1. 请参会人在会议前提交信息。这样做后，大家提交的看法和意见就不太可能受他人影响。 2. 组织会议的人最后一个发言。组织会议的人往往不知道自己的意见会影响大家。
    3. 做任务清单。组织者要考虑好，清单上有哪些必不可少的条目。 4. 会议座次安排做出微妙调整，就能影响人们的注意力重点。圆桌换气人的归属感，参与者会重视整体目标。带角的形状或方形，效果相反。


    对于一个好的销售来说，机会不是自己滔滔不绝说出来的，而是问出来的，通过问问题、让客户去说、你来判断，判断不清楚的时候再问，反复来回就形成了逻辑，才能真的判断案子的可行性及成功机率。


