  md: '# 客座教授 | 思维质量决定未来质量


    ![](img/dfd14813ba3c000b3835771d7641e57c_116_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了爱德华·德博诺博士，他被誉为20世纪改变人类思维方式的缔造者，是创新思维领域公认的权威，被尊为“创新思维之父”。他发明的“水平思考”一词被收入《牛津英语大辞典》。他已出版的著作有85本，其代表作《六顶思考帽》和《水平思考法》被译成40多种语言，行销50多个国家。他的学员既有4岁儿童，也有跨国公司总裁和诺贝尔奖获得者。


    很多人都特别好奇，到底如何训练自己才能获得不一样的创新思维。这一周，我们请来德博诺博士分享一下其中的门道。


    ![](img/dfd14813ba3c000b3835771d7641e57c_116_1.png)


    上周一的内容里，老师给我们留了道思考题：如果带领团队讨论“如何提高客户满意度”，你打算设计什么样的思考帽流程呢？很想听听爱德华博士的设计方案。


    帽子序列没有绝对正确与否。我的思考顺序会是：


    蓝帽(定义和重新定义问题)——白帽(已知信息,未知信息和渠道,O.P.V.)——绿帽(创新和突破)——黄帽(价值可行性)——黑帽(问题,潜在风险)——绿帽(完善黑帽不足)——红帽(选择可行的想法,如果是会议可以投票)——蓝帽(决定下一步行动)。


    特别提示，具体应用中，同一个帽子的作用可能会有不同，这里第一个蓝帽是定义和重新定义主题，把思考的焦点统一在如何提高客户满意度，或者找出阻碍客户满意的关键因素，然后思考如何去除/减少/降低该因素。最后一个蓝帽是思考行动计划。


    在您看来，制约大多数人创新思维的最大问题是什么?如果有意愿改变，您会建议他从什么地方入手改善？


    判断是创新的杀手。人们在思考时常遇到两大干扰：


    +   1、混乱。很多人同一时间很多思绪涌上心头，最后往往以判断的方式进行思考，以经验来证明自己。


    +   2、对抗。团队思考经常会存在“我对你错”的对抗，大家没有平行起来形成思考的合力，最后导致思考的动机和效率下降。


    训练第一步可以学习六顶思考帽和水平思考，《六顶思考帽》、《严肃的创造力》都是经典。你要给自己的思考设定思考框架和路径图，运用工具打破判断和惰性，从多个维度更丰富地看待问题，在决策、会议、沟通、创新中最大化地集结团队和个体的智慧。


    不要小看了六顶思考帽的作用，这套思维方法，在全球不同文化下都证明了其价值：


    IBM 推广六顶思考帽会议文化，让会议时间缩减到原先的四分之一；

    西门子公司使用六顶思考帽帮助他们节约了一半的产品开发时间；

    Statoil，挪威最大的石油公司，曾经遇到一个石油钻塔装配问题，每天都要耗费 10 万美元。在引进六顶思考帽的方法以后，这个问题在 12 分钟内就得到了解决，为该公司节省了
    1000 万美元；

    在中国的一个医学公司，一位市场部经理带领自己的团队运用六帽方法和跨部门团队沟通中，会议时间减少了 50%，而且迅速达成了共识。


    不过，六帽思维“肌肉”的练习，和你在健身房训练肌肉一样，需要循序渐进的训练和提升过程。你要经常练习拿起一个小问题就可以运用这套工具进行思考的习惯，比如，你可以用一顶黄帽思考，“和公婆一起住的
    25 条黄帽价值”，没准可以大大提升家庭幸福指数。


    这个过程需要经过长期的训练。六帽序列非常灵活，可以根据不同会议主题安排不同的帽子序列，个人思考序列也是根据不同的主题设定不同的序列。所以不要太过着急，要有意识地专门训练和反复练习。需要注意的是，最好个人练习熟练使用后，再应用于沟通和会议中，不能反过来。


    如果你你的团队之前没有经过六顶思考帽的训练，建议可以先请一个熟悉这方面流程的专业人士，在他的带领下集中引导训练你们一起解决几个问题，这样就可以形成一套快速决策的可行化流程，确保你们的后续效果大比例一致。


    当你越来越熟悉这套思维方式，你就能感受到，思维的质量决定了未来的质量。


    ![](img/dfd14813ba3c000b3835771d7641e57c_116_2.png)


