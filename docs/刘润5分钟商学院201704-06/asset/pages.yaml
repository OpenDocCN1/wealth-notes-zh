    数码相机使用前期，胶片摄影师一致鄙视，表面是不专业、缺乏质感，深层次是这些老人家多年的暗房、冲印、拼贴技术全部都%n用了。竞争力变成了审美、选景和修图，这个时候很多新人一下子就超越了。'
