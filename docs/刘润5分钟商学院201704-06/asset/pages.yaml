  md: '# 客座教授 | 未来的公司都是AI公司


    《5分钟商学院》的同学们


    大家周末好！


    这周，我们请到了易观创始人、董事长兼CEO于扬，作为“互联网+”的首创者、推动者和实践者，他为海内外多家知名企业进行互联网化战略指导，帮助他们找到属于自己的“互联网+”。目前，他创办的易观已经成长为中国互联网市场领先的大数据分析公司，帮助所有拥有互联网产品及服务的企业，洞察产品和用户，对标竞争和市场，实现企业的增收节支、提效避险。


    很多人都很好奇，“互联网+”的下一步是什么，大数据会在未来公司发展中占据怎样的位置。这一周，我们换了一种特别的方式，邀请“李翔知识内参”的同事专访了这位大牛，干货满满，分享给同学们。


    ![](img/dfd14813ba3c000b3835771d7641e57c_149_0.png)


    您最早提出了“互联网+”的概念，那么您理解的“互联网+”是什么样的？和您观察到的企业在做的“互联网+”，有什么不同吗？


    2012年，大概是和七八家上市公司的董事长聊的时候，他们说，于总你能不能给一个很形象的例子来讲互联网化，我们怎么成为互联网企业？当时我就讲了一个例子，互联网+农贸市场就是淘宝，互联网+旅行社就是携程，互联网+小广告就是百度，互联网+红娘就是世纪佳缘，大家一听就懂了。


    实际上互联网是一种强大的能力，是一种强大的基础设施。曾经有传统企业家跑到我这里说，于总我们没有互联网思维，是不是我就别玩了。其实，我一直都在说，不存在互联网思维，真正应该强调的是生产力思维和效率思维。互联网本质上是一种生产力，它和蒸汽机、电力一样，都是一种新的能源。


    过去两年，我去过美国几个地方，也见过美国当地的很多企业家。我遇到过一个在芝加哥的企业，它是给像麦当劳这类在全美有很多家连锁店提供一种服务，帮它在下雪的时候铲雪、草长起来去剪草、房屋屋顶坏了去修房子之类。它用的是一个我们所谓平台式的模式，把全美的这些独立工人和承包商汇集到这个平台上，然后它用大数据，甚至连通整个美国的气象局，预测这个地方要下雪，提前准备好，一下雪招讨多少毫米。它就讨夫。这个地方可'
