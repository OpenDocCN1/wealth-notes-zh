  md: '# 一个星期赚1000 美元，是什么感觉


    一个年轻人的故事

    他 4 年前，还拿着每周 25 美元的薪水

    现在，他一个星期赚 1000 美元


    一个星期赚 1000 美元，是什么感觉？4 年内赚 200000 美元，是什么感觉？彻底摆脱了金钱的烦恼，是什么感觉？想要什么就能得到什么，是什么感觉？为了我的读者，我会根据个人经验，一一回答所有这些问题。我将试着简单明了地说明，让我取得了朋友眼中所谓非凡的成功的秘密。


    让我们从 4 年前开始。当时我和我的妻子，还有 2 个孩子全靠我每周 25 美元的收入生活。我们住在一个狭小的房间里，穿着廉价的衣服，只能从事最便宜的娱乐活动——梦想着什么时候能一周赚
    50 美元。这是 我最大的志向。事实上，似乎我的能力也只能止于此。因为我是一个普通人，我没有有影响力的朋友，没有受过高等教育，没有领导的才能，没有钱。


    我白手起家，公司的所有人只有我自己，4 年来，我赚了 200000 美元，一周 1000 多美元。我不赌博。不炒股。我发的不是战争财——相反，我的一些同行，再战争开始的时候，就破产了。


    4 年来，我的生活发生了翻天覆地的变化。我们搬离了狭小的房子，建了一套耗资超过 60000 美元的豪宅。我们拥有了 3 辆汽车。我们的孩子去了私立学校。我们拥有了我们想要的所有东西，什么东西都买最好的。当初梦想着一周赚
    50 美元已经很了不起了——而现在，我赚的钱，已经远远超过了这个数。


    是什么给我带来了这么显著的变化？是什么几乎在一夜之间改变了我，让我从一个慢条斯理，容易满足的普通人，变成了积极、高效，意志坚定，所向披靡，克服所有困难，主宰了自己人生的人？这一切都始'
