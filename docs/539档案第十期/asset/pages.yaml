    that I obtained almost from the first day. Shortly after that, I took hold of
    a business that for twelve years had been losing money. I started with $300 of
    borrowed capital. During my first year I made $30,000. My second year paid me
    $80,000. My third year netted me $100,000. Last year, due to increased costs of
    materials, my profits were $100,000, though my volume of business increased 25%.
    And the year I am facing through will bring my profits for the present fiscal
    year up to $125,000.


    Earning a thousand dollars a week makes me feel secure against want. It gives
    me the money with which to buy anything I want. It will make my family happy.
    It has made me a co-operation of an investment that looks good, without worrying
    about losing the interest. It has given me mind of financial worries. It has made
    me healthier, more contented and keener minded. It is the grandest recipe I know
    for happiness.


