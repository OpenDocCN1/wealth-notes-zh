  md: '用手指将它和其他护肤霜一样，均匀地涂在脸上。 “危险区” …… 如鼻子、嘴唇、眼睛周围和脸颊部位多涂一点。


    前 3-4 分钟内，你会感到强烈的刺激。这是医药成分在发挥作用，就像按摩一样。你的脸会感到冷热交替。你会喜欢上这种感觉。你的皮肤会感觉神清气爽。就好像做了一次没有刺激的按摩，你的皮肤会感到十分清新。同时，它还净化了你的面部血液，带走了导致毛孔废物的东西。


