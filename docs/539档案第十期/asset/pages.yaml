  md: '# 13、一个星期赚1000 美元，是什么感觉


    ![](img/379b6eadcf3ac1551b6b0df56e5104fb_73_0.png)


    # How it Feels to Earn $1000 a Week


    By a Young Man Who Four Years Ago Drew a $25 a Week Salary. Tells How He Accomplished
    It.


    How does it feel to earn $1000 a week? How does it feel to have earned $300,000
    in four years? How does it feel to be free from money worries? How does it feel
    to have everything one can want? These are questions I shall answer for the benefit
    of my reader out of my own personal experience. And I shall try to explain, simply
    and clearly the secret of what my friends call my phenomenal success.


    Let me begin four years ago. At that time my wife and I and our two babies were
    living on my earnings of twenty-five dollars a week. We occupied a tiny flat,
    wore the plainest clothes, had the cheapest food and the cheapest entertainment—and
    dreamed of the day when I might be earning fifty dollars a week. That was the
    limit of my ambition. Indeed, it seemed to be the limit of my possibilities. For
    I was but an average man, without influential friends, without a liberal education,
    without a dominating personality, and without money.


    With nothing to begin with, I have become the sole owner of a business which has
    paid me over $300,000 in four years during the past four years and which now pays
    me more than a thousand dollars a week. I did not gamble. I did not make my money
    in Wall Street. My business is not a "get rich quick" scheme. On the contrary,
    many others in my line have failed since the war began.


    In four years the entire scheme of my life has changed. Instead of living in a
    two by four flat, we occupy our own home, built for it at a cost of over $30,000.
    We have three automobiles. Our children go to private schools. We have everything
    things we want, and we want the best of everything. I estimate that my income
    for the past year was $100,000, or in terms of a million dollars—with greater
    possibilities of my dream coming true than my former dream of earning fifty dollars
    a week.


    What brought about this remarkable change? What transformed me, almost overnight,
    from a slow-going, easily-sheepish, average man—into a positive, quick-acting,
    determined individual who attacks no defeat, who overcomes every obstacle, and
    who completely dominates every situation? It all began with a question my wife
    asked me one evening after reading an article in a magazine about a great engineer
    who was said to earn a $10,000 salary.


    "How do you suppose it feels to earn $1000 a week?" she asked. And without thinking,
    I replied "I haven''t the slightest idea, my dear, so the only way to find out
    is to earn it." We both laughed, and soon the question was apparently forgotten.


    But that night, and for weeks afterward, the same question and my wife''s keen
    rejoinder ate my brain. I commenced to examine the men of enterprise in our town.
    What is it that enables them to get everything they want? They are not better
    educated than I—at least, some are less intelligent. But the fact remains that
    they are men of success. I lacked the one thing that was their real asset. I perceived
    that they looked at things from an entirely different angle than I. Whatever it
    was, that "something" was the secret of their success. I was the only thing that
    prevented me from achieving success, a lack of money-making ability. In all other
    ways we were the same.


    Determined to find out what that vital spark of success was, I began to search
    every subject that pertained to the matter. I followed one idea after another.
    But I, I found nothing. I almost despaired. I came across a copy of "Power of
    Will." Like a bolt from a clear sky there flashed in my brain the secret I had
    been seeking. That was the fundamental principle of all success—Power of Will.
    There was the power for which I lacked, and which every successful man possesses.


    "Power of Will" was written by Prof. Frank Channing Haddock, a scientist, whose
    name ranks with such leaders of thought as James, Bergson and Kipling. After twenty
    years of research and study, he had completed the most thorough and systematic
    study of will-power ever made. I was astonished to read his statement that, "The
    will is just as amenable of development as the muscles of the body." And Dr. Haddock
    had actually set down the very rules, lessons and exercises by which anyone could
    develop the will, making it a bigger, stronger force each day, simply through
    an easy, progressive course of training.


    It is almost needless to say that I at once began to familiarize myself with the
