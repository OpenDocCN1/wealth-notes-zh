- pgno: 93
  md: '灰尘。它附着在皮肤的天然油脂中。


    你的毛孔就会被堵塞，无法呼吸。你的天然油脂无法分泌出来，于是硬化成了黑头或粉刺。这些黑头或粉刺试图挤出皮肤外，迫使你的毛孔越来越大。一旦这种情况开始发生（特别是在青少年时期，腺体分泌旺盛，皮肤油性大），随着你年龄的增长，会变得越来越糟。当这种情况发生时…很明显，除了立刻开始护理肌肤，否则永远无法改善，不是吗？


    # 更好地清洁肌肤


    如果你想摆脱脸上丑陋的黑头，粗大的毛孔，以及痘痘。那么，你必须做 3 件事。


    首先，你必须软化可能以及堆积在你面部毛孔里的顽固的污垢和油脂！其次，你必须去除污垢。（但不要用手挤，挤压只会让部分污垢陷得更深。）第三，你必须用紧肤霜以及杀菌药物，让皮肤变的紧致。这样做不仅是为了变得更美，而且还为了防止皮肤受感染！除非你做好这
    3 件事，否则，你很可能会一直浪费时间和金钱，寻找所谓的“神药”！


    # 当你使用医生的这 3 步配方时，会发生什么


    首先，做好治疗前皮肤的清洁工作。然后，我们会软化，并松动一直粘在你毛孔里的污垢。这种科学的毛孔隙清洁剂是这个著名的皮肤医生的发明之一，和你之前使用过的任何其他不论多少钱的清洁剂都不同。下面是使用方法。


    把这位医生科学的毛孔隙清洁剂均匀地涂在脸上。然后用面巾擦拭干净！现在看你手上的面巾纸！


    当你看到脸上脱落下来的污垢——即使你之前已经用其他面部清洁产品洗过脸时，你就会明白，为什么你需要在皮肤护理上作出重大改变了。


    （2）治疗的第二步是，将一种药用面膜敷在脸上。'
