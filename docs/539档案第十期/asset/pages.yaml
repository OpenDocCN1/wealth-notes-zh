  md: '# 前言


    《539档案》已申请了版权，恭喜你拥有了它！这是一部真正的宝典，汇集了有史以来最经典的539篇广告文案，它是你必须收藏进“点子文档库”里的重量级文案素材。


    这539篇经典文案，每篇在入选前，都必须满足五个条件：


    +   1. 它必须有强力的标题（大卫·奥格威曾说“标题可以让你广告效果提升500%！”。在这里，你将得到数百个强有力的广告标题，略加修改，就可以应用到自己的广告中。）

    2. 它必须引人注目，言简意赅，内容充实（因为为你销售产品的是文案，而不是愚蠢的照片，哗众取宠的口号，或华而不实的设计）。

    3. 它必须是社论式风格（根据盖瑞·亥尔波特所言，这种风格“有时可以使反应率增加2200%。”如何让反应迅速倍增？让我们看看撰稿专家们是怎么做的。）

    4. 它必须销售的是优质的产品，或者是曾经非常有名的产品，或者是直至今天仍久盛不衰的产品（无需多言……很可能你家现在就拥有其中一款产品）。

    5. 它必须是纸上的推销术（阿尔伯特·拉斯克尔，洛德-托马斯广告公司领导人，据说是广告界赚钱最多的人，就因为约翰·E·肯尼迪1904年曾经告诉他广告的实质是——纸上的推销术）。


    你可以看到，经过5层过滤，筛选出的文案，不仅能迅速抓住人们的注意力，可读性强，还能确保这些文案是通过市场验证的，而且还杜绝了强势广告的推销，但又能促使顾客行动。


    显而易见，这才是真正的经典。


    《539档案》有选自大品牌公司的经典文案，还有帮助中小企业持续卖货的攻心文案。这些文案一共创造了数万亿美元的销售额。'
