    # # 准备你的“施政演讲”


    刚才我分享了打造一个高效运转的团队的经验。很多管理者是空降到一家公司，或者一个新部门。面临的是“新人”带老团队，这种情况在一开始树立威信也会很重要。


    如果你是这种情况，我会建议你精心准备一场“施政演讲”。


    所谓“施政演讲”，就是你在这个新公司、新团队，首次比较正式的自我介绍和分享。


    这次演讲需要你花时间准备，不需要刚到新岗位就急着做，你可以先花 2 周甚至更长的时间，和每一个利益相关人，包括你的上级、重要下属、兄弟部门、关键客户，进行充分接触，摸清情况。然后有的放矢地准备内容。


    一般来说，这个演讲会包括三个部分的核心内容：


    第一部分，是关于你个人的职场经历和生活介绍。


    目的是通过了解建立信任，这个部分不需要太严肃，你可以分享自己职业生涯里有意思的故事，也可以多放一些生活中的照片，拉近你和下属的距离。


    第二部分，是你的管理风格。


    我建议你开诚布公地告诉下属们，你最希望的工作方式、最欣赏的下属品质，还有你绝对不能容忍的价值观底线，也就是规矩，相当于把丑话说在'
  - '[PAGE 33]


    前面。说这些，都是为了降低你和你下属的沟通成本，不要让他们去把时间、精力花在揣测你的心思上。


    第三部分，是你的工作方向。


    你准备怎么带领团队开展工作？尤其是告诉大家，你和前任有哪些相同和不同的做法。


    需要提醒你注意的是，定了规矩，就要执行。我们知道，每个团队也是有惯性的。如果你想想比你的前任做得更好，你肯定要对原有工作方式进行调整。当然，我不建议你一上来就“新官上任三把火”，这样容易引起下属的反弹。


    不过，我也特别提醒性格比较温和的管理者，如果有下属的行为，触犯了你的规矩，你就有必要“杀鸡给猴看”，批评教育，或者在你的职权范围里进行处罚，尤其是一开始的时候，需要让团队看到你的决心。


    # 本讲小结


    这一讲，我和你分享了管事和管人这两条管理线：


    “通过事去管人”，在团队建立起一种“结果导向”的绩效文化；


    “通过人来管事”，关注每个成员的成就感和归属感。


    最后，如果你空降到一个新团队，请精心准备你的施政演讲。'
  - '[PAGE 34]


    如果你有更多关于提升团队成员成就感和归属感的方法，也欢迎你在留言区分享出来。


    接下来，我们来聊聊上级的自我管理。'
  - '[PAGE 35]


    # 5.成为受人信赖的上司的自我修炼


    前面我们讲了培训下属，也讲了建设团队，这一讲我想来讲讲作为上级，你的自我管理。


    《礼记》里有这么一句话，特别生动地描述了居上位者的影响力。


    > “王言如丝，其出如纶”。


    意思是，对于位高权重的人，即使是一句在他看来无关紧要的话，哪怕就像蚕丝那么细小，说出去之后，都会对他人产生巨大的影响，变成像绸带那么宽大。


    这一讲，我们就来侧重讲讲你作为上级的情绪管理和言行管理。


    # 团队情绪由你影响


    作为一名管理者，你夹在公司和下属之间，一方面，你要给团队布置任务，另一方面，你又要接受你的上级的领导，同时去为团队争取资源，你得协调大大小小的事情，你每天面临的压力不会比你的下属小。


    但无论如何，不管你的情绪有多么糟糕，甚至已经超出了你的承受力，哪怕你和你的老板吐槽，也不要在下属面前抱怨。


    如果你跟下属抱怨说，“某个项目没那么重要，真是浪费时间，你其他事做完了再去处理吧”，下属可能就会完全不放在心上；如果你遇到事情惊慌失措，唉声叹气，下属很可能已经乱作一团了。'
  - '[PAGE 36]


    如果你不得不向团队传递不太好的消息，你需要确保自己控制好了情绪，然后陈述事实。当然让下属真实地感受到压力，有时反而能够激发团队的凝聚力。


    但是控制住你的负面情绪，还只是刚过及格线，你还需要知道怎么去管理团队的情绪。


    我自己在带团队的时候，会有意灌输给下属一个观念，那就是“麻烦没了，工作也没了”。工作中，遇到麻烦是常态，甚至可以说，公司就是请大家来解决麻烦的。这一招很有效，整个团队能够保持住积极的工作态度。


    我以前有个老板，和我开玩笑说，老板很好当的，会说两句话就好。下属取得了成绩，你鼓励他：“干得不错！”当下属遇到挫折了，你安慰他：“没事，这就是为什么公司付你钱，让你去搞定它嘛。”这当然是句玩笑话，不过却点出了职场情绪管理的精髓。


    一些开玩笑，也是团队情绪和气氛的调节器。


    我有一个老领导，在下班的时候很喜欢和大家说：“我赚到今天的工资了。”这当然是一句玩笑话，因为工资是按月发的嘛。不过他这么一说，就把原本辛苦干了一天的工作，反而让大家觉得，很有获得感。


    越是团队的工作遇到挫折的时候，我这个老领导越喜欢用玩笑来鼓舞大家。他会在下班时，走到一些愁眉苦脸的下属面前，问问他们为什么留下来加'
  - '[PAGE 37]


    班？他的问法也很有趣：“你怎么到这时候还没赚到今天的工资？”一般来说，这么幽默的开场，也会帮下属把他的苦恼说出来。


    可能的话，你也可以像我的这位老领导一样，设计一些“团队暗号”。它可以是一句简单的话，背后有特定的梗，只有你们的组员才听得懂。


    # 该说什么，不该说什么


    管好情绪，还只是上级的自我管理的一部分。我们说建立心理契约，信任感是基础。但信任感的建立也不是那么容易的。


    你可以想想，你在下属眼里是不是值得信赖的、言行一致的、处事公平的、敢于担当的？这些品质，不是你说自己有就有，有时候言行上稍不注意，就会破坏你在下属心目中的印象。


    首先，我建议你学会“坦诚”的对下沟通风格， 所谓无招胜有招。坦诚，意味着前后一致、可预见性。


    比如，为什么很多人发现，要开除一个表现差的员工很难开口。因为平时的沟通中，总是不敢当面指出下属存在的问题，回头到了年底，突然告诉下属表现没有达标，下属肯定会怨恨你；


    又或者，遇到一些不太好办的事情，你在你的上级面前，说的是一套，你当着下属的面，说的是另一套，这反而会让事情变得复杂。'
  - '[PAGE 38]


    当然，坦诚不代表什么信息都应该共享，事实上每个级别对应的“信息权力”是不同的，你不是什么都能跟下属说。处理这个问题也不复杂，你完全可以告诉直接下属，什么东西是你不方便说的。


    比如，假设一家创业公司，遇到特别多的挑战。我不提倡公司明明经营不好，但你却粉饰太平；但另一方面，你也没必要把下属这个级别，不应该了解的公司的核心经营数字，比如账上还剩多少钱，直接告诉下属，这也会引起不必要的恐慌。


    我自己有一条底线，就是问自己：如果一个信息，你不告诉下属，下属以后知道了，会不会怨恨你。如果是的话，那它可能就是不该隐瞒的。


    除此之外，如果你还不确定某些公司信息该不该跟下属分享，你就想想，分享出去是会方便他们做决策和采取行动，还是对他们产生困扰？也要避免释放过多的下属不理解的信息，把他们淹没。


    # 构建信任的三条“军规”


    除了坦诚沟通这个基本法则，我根据中层管理者容易犯的错误，总结了三条“军规”：


    第一条，在下属面前，和你上级保持一致。


    分歧，在工作中是非常常见的。理想状态，是你和你的上级，100%地达成一致，然后你100%地布置给下属。但更多的时候，是你可能走出你老板'
  - '[PAGE 39]


    的办公室，你仍然不认可他的要求。但不管怎样，你必须和你的上级保持一致，否则这个团队就会很快陷入混乱。


    就算最后证明你是对的，你上级是错的，这种不一致给团队造成的认知混乱也是难以挽回的；如果万一最后证明你是错的，那你就会更加颜面扫地。


    你也许会问，这不是让我带着下属违心地做事嘛，如果上级明明错了，难道也要让下属去执行？


    分享一种做法，那就是，如果你真的认为上级的方向有问题，你也依然要让下属去执行，但过程中，积极地和下属收集反馈，保持和你的上级的沟通。


    道理很简单，实践是检验真理的唯一标准，一旦执行起来，你和下属的一线经验，就非常有说服力了。这样做还有一个好处，那就是你给下属做了一个榜样：不同意见级的观点，可以持保留态度，但一定要先去执行，并且迅速反馈、调整。


    第二条军规是，千万不要把自己的决策错误归咎给下属。


    通俗地说，就是不要把锅甩给下属背。下属也许嘴上不说，但心里什么都明白。承认属于自己的错误，反而能够赢得尊重。


    第三条军规是，积极反馈务必及时。'
  - '[PAGE 40]


    下属做得不对，你当然可以批评；下属做得对了，就应该及时肯定。大到一份嘉奖邮件，小到口头的表扬，都可以。


    这样的反馈一定要及时，即时的一句积极反馈，比几天后的表扬，效果要好得多。这样下属才会觉得，你在真心为他的进步而高兴。


    前面所有讲到的，都是你作为上级，或者说公司的中层管理者，面对下属时，言行上尤其要注意的地方。但其实言行管理有一个难点，那就是很多时候，我们对自己的做法，已经习以为常了，你都不会意识到自己的某些习惯有问题。


    所以，我最后还有一个小建议，那就是主动让下属给你反馈，你得通过下属的眼睛，给自己“照照镜子”。


    具体的场合，可以是每次你和下属完成一对—谈话，你给完他反馈的时候；甚至是下属离职的时候，你都可以问问他们，真诚地邀请他们对你提出一些意见。这样的反馈，能有效帮助你提升自我觉察。


    当然，你没必要因为别人的一句话，彻底否定自己，但你的确可以做出言行上的调整。


    拿我自己举个例子，我曾经在接手一个后端支持部门的时候，就从我的下属那里得到过一条很重要的反馈：这个部门从业人员，普遍文化程度不高，而我恰恰就有喜欢“掉书袋子”这个毛病，爱讲太多理论、过于文绉绉，反而不受大家欢迎。'
  - '[PAGE 41]


    说实话，如果不是我找下属要这个反馈，我自己真的就意识不到这个问题。


    那么我调整一下自己，团队气氛就融洽了很多。


    # 本讲小结


    总结一下，要成为一个值得信赖的上级，你需要：


    +   1.  通过控制负面情绪、传播正面情绪，进行情绪管理;


    +   2.  要养成跟下属“坦诚沟通”的好习惯;


    +   3.  建立信任的三条军规，分别是“和你的上级保持一致”“不要把责任甩给下属”和“及时肯定下属”。


    +   4.  最后，你还可以主动找你的下属要反馈，给自己“照照镜子”。


    那么，接下来，我就来聊聊几个艰难的上下级谈话场景。'
  - '[PAGE 42]


    # # 6.艰难但必须学会的谈话


    在这一讲中，我会帮你分析，身为上级，三种你不可避免会遇到的艰难的谈话场景。


    这三种场景分别是：


    +   1. 下属提加薪或升职的时候；

    2. 重要下属提离职的时候；

    3. 下属表现不达标需要劝退的时候。


    我们一个一个来讲。


    # ## 下属提升职加薪如何应对


    很多上级，特别怕下属提升职加薪，主要有两种心态：


    +   - 第一，权限不够，自己做不了主，也需要向公司申请批准，所以没这个动力；

    - 第二，有的上级可能会掩耳盗铃，觉得只要不谈钱，下属自己就不会去想加薪的事。


    但如果你这么想，就是对人性太不了解的了。而且现在资讯这么发达，各公司的招聘信息网上都有，对于市场行情，一打听也就知道了。


    聪明的上级应该先建立正确的心态，不用害怕听到下属提升职加薪。为什么呢？


    你需要转换一个思路，升职加薪是不可躲避的事情，下属要想得到更多，你应该鼓励他；但是相应的，他也必须要付出更多，这才是解决矛盾的办法。'
  - '[PAGE 43]


    所以，正确应对方式应该是，首先你需要判断，下属的能力，可以胜任更高的挑战吗？一般来说，可能需要拉上你的上级和 HR 一起进行评估。


    +   如果你评估他还差一些火候，那也应该实话实说。坦诚地指出他目前能力和更高级别的要求之间的差距。


    +   如果你认为他有这样的潜力，而且在不久的未来，公司就有这样的升职加薪窗口，那么，你需要和下属提出更高的要求，让他能够在竞争中有拿得出手的业绩。


    说实话，能够被工资激励的下属，管理起来反而容易。至少他的需求点，你抓得住。相反，如果这个下属“油盐不进”，对薪资、前途没追求，这才是更麻烦的，你想激励他都不知道该怎样下手。


    # 如何挽留重要的下属


    下属如果只是谈升职加薪，处理起来是相对容易的。如果一个重要的下属向你提离职，应该怎么挽留？


    第一步，你得先穷尽他离职的原因。


    但同时，你也千万不要下属说一个理由，你就给出一个你的意见，因为下属说的理由都未必是他的真实理由。


    比如，下属说工资太低，你马上说好，我给你涨；下属说工作太累了，你说好，给你放个假；下属说要想去竞争对手那，你就说竞争对手如何不好，等等。这种对话方式，让你显得没有任何底牌可言，即便留住了人，也付出了很大代价。


    那怎么穷尽他的原因呢？'
  - '[PAGE 44]


    你可以追问，“除了这个原因，还有其他原因吗？”先让下属畅所欲言，把他所有遇到的烦心事都说出来。其实所有的问题最后都可以归结到三类：钱太少、没发展、感情受伤。


    第二步，你需要判断在这些原因中究竟哪一个是主要原因。


    一般来说，很少有人会等到钱、发展、感情这三个方面都出问题了才提离职。这一步的关键是你需要追问细节，因为这能够帮助你判断下属离职的真实原因。有一些追问的技巧：


    比如，和薪酬相关的部分，尤其得问清楚。别人给他涨薪的幅度是多少？是税前还是税后？这些信息，都是将来你与公司 HR 去争取时有力的条件。


    再比如，观察下属在说哪个原因时，情绪最激动、细节最丰富。这往往能够帮助你确定主要原因。


    还有，如果你们平时关系足够好，你甚至可以直接问：“最主要的原因是什么？”或者直接问：“是感觉公司前景不行吗？”“哪个领导让你不舒服啦？”等等。


    最后，你还需要一个确认的动作，反过来问他：“如果这个原因解决了，是不是就不打算离开了？”


    不要小看这个反问，因为根据我的经验，超过半数员工的离职，都是一时冲动或者没想清楚。每次谈离职，其实都是一个帮助员工梳理自己的人生和职业规划，并找到解决方案的过程。'
  - '[PAGE 45]


    当你已经清楚下属离职的真实理由了，那么第三步，就可以开始提出你的方案了。


    如果你真正清楚了下属的需求，这种说服就会变得很简单，无外乎三种结果：


    +   第一种，下属因为不清楚一些信息，做出了误判。经过你的梳理和解释，明白了，然后留下。比如，下属已经在晋升名单上了，但他不知道；又比如，下属想去的某家公司，你在里面有熟人，你非常清楚那家公司的情况其实很糟糕。


    +   第二种，目前公司能够给的极限，无论是钱、发展还是感情，都还和其他公司的 Offer 有差距。那么，你需要向上汇报，和公司 HR 去争取政策。


    +   第三种，你努力了，甚至公司大老板都出面了，也还是留不下。那也没办法，赶快做好交接，把损失降到最低，大家好聚好散。


    # 下属表现不好如何劝退


    说完了升职加薪谈判和离职挽留两种场景后，再来说第三种场景，当下属表现不好需要劝退。应该怎么办？我会从心态、行动和沟通上给出建议。


    首先是心态关，你需要明白，早点让不合适的员工离开，反而对双方都是好事。


    我亲身经历的一件事让我印象深刻。


    曾经我在的一家公司，有末位淘汰的规定。我的一个下属业绩始终排在末位，但我一直下不了决心让她离开，甚至在大老板面前保她，后来到了年底她自已主动离开了，离开后给我发了一条长长的短信，说她特别恨我，这一年过得非常痛苦。我这才意识到，早点让不合适的员工离开，对双方都好。'
  - '[PAGE 46]


    然后在行动上，“劝退”不应该只发生在最后一刻，而是每一次和下属在做业绩回顾的时候，就要谈。你需要非常具体地指出，下属在工作中无论是能力，还是态度上有哪些具体的不足。


    除非是一些态度恶劣，就想长期赖在公司的人，你需要寻求人力资源部，甚至法务部的支持。正常的下属，如果你发现你不断地、中肯地指出他的不足，一般就会主动离开。


    最后在沟通上，你需要通过建立共识，让对方认可你的决定。沟通的过程也要像谈离职挽留一样，搞清楚下属到底要的是什么，然后帮他找解决方案。


    我自己就经历过一次特别艰难的劝退谈话，但最终的结果我们双方都非常满意。


    曾经有一位下属做了10年的销售代表，有一段时间他明显心不在焉，工作屡屡出状况。但他还总拿自己是老员工说事，说自己跟销售总经理关系很好，表现出“我就不走，你们自己看着办”的态度。


    那么我是怎么做的呢？在正式谈话前我做了三件事：


    首先，我告诉他我希望他思考两个问题，在正式谈话时回答我——一个是，自己加入公司，是为了什么？第二个是，想要的东西，得到了吗？'
  - '[PAGE 47]


    其次，我直接找到了销售总经理，如实反映了这个情况。总经理非常职业，他告诉我，的确，这个销售代表是他十年前招聘的，但他尊重一线经理的所有决定，让我不要有心理压力；拿到了这个授权，我就可以放开手脚了。


    第三，我找到人力资源部，了解了相应的法律政策，这样，我在谈判时，也多了筹码。


    正式的谈话，一开始比我想像得还艰难，这位下属始终坚持自己是胜任工作的，我对他是不公平的。我也不直接否定他，而当我问到之前让他思考的那两个问题时，谈话就取得了突破。


    原来，他在销售代表的岗位上，一口气干了十年，成长有限，出现了职业倦怠；他当时加入这家公司，是看中了大企业完善的培训机制，但 由于是派遣员工编制，不可能晋升为销售经理。他一方面又不愿意放弃目前大企业优厚的福利，另一方面想当销售主管，甚至是经理，但不清楚自己的实力，不敢出去闯。


    在清楚了他的诉求之后，我帮他分析了目前他的状况，告诉他我认为他是具备销售主管，甚至经理的能力的。还给了他一个解决方案：


    让他近期出去面试，看一看外面的机会；但如果他决定留下来，就必须全力以赴，把业绩提升起来。而且我拿出具体证据，告诉他，他之前敷衍的工作态度，已经对公司造成不利影响，并且也影响到他在行业的口碑了。'
