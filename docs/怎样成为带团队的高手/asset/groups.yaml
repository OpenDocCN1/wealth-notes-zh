    \ 打造一支高效运转的团队\n    - “人”和“事”的两条线管理\n    - 准备你的“施政演讲”\n    - 本讲小结\n- 5. 成为受人信赖的上司的自我修炼\n\
    \    - 团队情绪由你影响\n    - 该说什么，不该说什么\n    - 构建信任的三条“军规”\n    - 本讲小结\n- 6. 艰难但必须学会的谈话\n\
