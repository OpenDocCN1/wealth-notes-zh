  - '[PAGE 14]


    “小李，你提醒下我们几个大客户，该付款了。”


    然后你就离开了。小李却没有办法执行你这个命令。他不清楚客户不按时付款，有什么后果？客户要是拒绝了，该怎么办？可是小李又担心问太多，你嫌他这么简单的事都搞不清楚。于是，他硬着头皮，犹豫再三，终于拨通了客户的电话。结果因为拿捏不好说话的分寸，最后把一个老客户给得罪了。


    如果用上面说的三个步骤，你可以这么说：“小李，我需要你今天帮我给你们的几个大客户去个电话，提醒一下他们该付款了。”


    这是“是什么”。把基本信息交代清楚。


    然后，你要告诉下属，为什么给他布置这个工作，引起他的重视。


    比如你可以说，“小李，向客户收款这事对公司的经营非常的重要，不然的话公司现金流都有可能会断。一个称职的销售人员，既要能卖得出去东西，也要能及时收回钱。你前期对外销售表现不错，回款这块，你也要学一学。”


    这是“为什么”，既点出了公司的利益点，也点出了下属的利益点。


    接下来，你还不能让小李直接拿起电话就打，你要把具体怎么做，和他再拆解一下。'
  - '[PAGE 15]


    比如，首先你需要先了解对方的过往付款记录，然后，你需要找对客户的付款决策人；最后，才是拿起电话去追款。


    至于电话里怎么跟客户沟通，你也应该把常见的注意事项告诉下属。


    只有这样，下属对该怎么办好这件事，才算是搞清楚了吧。


    完成了“我说你听”有时候是不够的，你需要再加上“你说我听”。


    +   - 一方面，很多你认为是常识的经验和技能，对于新人来说，不是马上就能搞清楚；

    - 另一方面，下属如果有不懂的地方，可能害怕你说他笨，不敢主动去问。


    当然，在这一步，你不需要那么生硬地说：“你给我重复一遍。”


    你可以把步骤和道理，切换到具体的场景里，让下属发表他的看法，提出自己的疑问。


    比如，刚才的例子里，你可以这么对小李说：“那么如果你要给 A 客户打电话，你会怎么做？”


    这时候小李开始分析对方的付款记录，关键决策人，并且假设了几个对方在电话里可能会出现的反对意见，这时候就可以给出你的建议了。


    不要嫌“我说你听，你说我听”这两步太麻烦。日本便利店 7-11 的创始人铃木敏文，甚至提出，他和下属布置工作，要说三遍。他说一遍，下属复述一遍，刚转身要走，他把人家又叫回来，再听下属说一遍。'
  - '[PAGE 16]


    有些管理者，爱摆出老大的架子，总喜欢说：“这种小事，不要让我说第二遍”。很不幸，大多数下属，和你我一样，都是普通人，不是会读心术的神仙。


    第三个动作，是“我做你看”。 也就是亲身示范，大部分稍微复杂一些的任务，在下属刚接触的时候，你需要给他亲身示范。


    需要注意的是，亲身示范不等于亲力亲为。示范的重点是保证下属看得清楚、学得到，所以你应该遵守严格的流程和步骤，让下属学到良好的工作习惯。这一步，追求的是可复制的工作方法，而不是你自己觉得怎么方便就怎么来。


    其实，亲身示范一方面是做给下属看，另一方面也能让你跟一线工作保持接触，很多时候只有你亲自去做，才会看到问题在哪，才知道怎么优化流程；也更容易在下属中建立信任。


    所以，再拿那个例子来说，你其实可以当着小李的面，亲自给客户打个电话，示范整个沟通的过程，这样对下属来说，他掌握起来会更快。


    那么上级做完了，下属看到了，是不是就结束了呢？当然不是，就像我们不下游泳池，永远学不会游泳一样，下属是很难“看会”一件事的。所以还有“你做我看”这一步。


    也就是跟着下属去工作，在他身边进行观察，过后进行反馈。


    这个过程中，你得提醒自己不要陷入两种状态：'
  - '[PAGE 17]


    一种是“控制欲”太强， 在观察下属做事的时候，总忍不住打断他们。你需要做的，是记录下问题，事后再反馈。有的时候，你得找机会，让下属狠狠地“失败”一次，摔个跟头才记得牢。


    另一种是“心太软”， 比如工作流程有五个步骤，下属跳过了 一步，结果好像也没出什么问题，所以就过去了。但正确的做法是你一定要指出来，让他重新按照五个步骤走一遍。


    在这里，我非常欣赏华为老总任正非的观点：先僵化、后优化、再固化。特别是新员工，先不要想如何创新，而是先把流程、操作步骤，老老实实地走一遍。


    观察了之后，你再开始针对他的完成情况，进行一次反馈。反馈主要围绕三个部分组成：表现好的地方、可以提升的地方和下一步的改变计划。


    反馈的时候，要记得让下属自己先说，你再点评。


    这样有两个好处:


    +   - 一个好处是，给自己留足思考和观察的时间，你不仅要看到下属怎么做，也得了解他们怎么想，不要以为你真的就那么懂他们的想法；


    +   - 另一个好处是，人对于别人的点评和建议，有一种本能的抵触情绪。你先说，下属很容易就开启了抵触情绪，很多话就未必听得进去了。


    # ### 找到制约表现的具体行为点


    最后你需要注意的是，有的时候，下属事情做不好，可能跟个人特质有关系，那么你培训下属的时候，一定要注意寻找制约下属表现的具体行为点。'
  - '[PAGE 18]


    举个例子，我曾经有一位下属，是销售经理，各方面表现得都很优异，但就是业绩上不来。客户经常向我投诉她，说她沟通有问题。但这个反馈还是太不具体了。到底是不会倾听，还是不会表达？是书面沟通？还是口头交流有问题？我平时和她开会，觉得挺正常的啊。


    我就和她一起去拜访客户，我马上发现，原来她在谈判桌上，非常容易情绪失控。


    谈判，大家知道，对方常常需要故意地给我们施加压力，有的时候会说 说风凉话，甚至有的时候，不专业的谈判对象，会进行人身攻击。


    我就发现，我这位下属，当她在谈判桌上被对方施压的时候，特别容易“入戏”，情绪一上来，就什么也不管不顾了。很显然，她是在沟通中的情绪控制上出了问题。


    找到问题之后，你首先需要让对方认识到这个问题，然后针对性地加强引导和培训，包括可以推荐外部的学习和培训资源给他。


    如果你发现下属身上有某些会影响到他职场发展的显著问题，不要觉得不好意思说，诚恳地指出来，会让他感激你。


    最后，你要意识到培训也是你和下属建立心理契约的一个场景。简单说，你要让下属明白：我培养你，你帮我做事，在你帮我把手办好的同时，你自己能力也提升了，受益的一定也包括你自己。'
  - '[PAGE 19]


    # 本讲小结


    我们来总结一下。培训下属，有四句口诀：


    "我说你听"，交代清楚是什么、为什么、怎么做；


    "你说我听"，让下属重复，确保他理解了要点；


    "我做你看"，亲身示范，不要嫌麻烦，不要跳步；


    "你做我看"，观察的时候不要打断，反馈的时候下属先说你再说。'
  - '[PAGE 20]


    # ## 3.提问：和下属谈心的技术


    很多时候，下属表现不好，不是因为能力不够，可能是情绪、心态出了问题，下属不在状态，能力再强也没用。有一个公式：下属的表现，等于能力，减去心理干扰。


    表现=能力-心理干扰


    作为上级，你不能只抓看得见的 KPI 数字，或者只会评价下属能力强不强，你同样也要学会去疏导下属的心理，也就是所谓的“谈心”了。


    当然，我这里说的谈心，不是指那些一年一度的、正式的工作回顾，也不需要当成“严肃的思想汇报”；也不是指下属跑来找你要个肩膀痛哭一顿，找个心理安慰。它是一种双向沟通，目的是帮下属解决“心理干扰”。


    # ### 好的反馈来自对的问题


    这种谈话也是有技巧的。在这一讲，我要和你分享的，就是一套通过提有效的问题，和下属谈心的技术。


    我们经常说要“学会倾听”，其实，“学会提问”更重要，因为你只有问对了问题，才能得到有效的反馈。


    我先来举个例子。'
  - '[PAGE 21]


    我刚升任经理的时候，有位下属，跑来找我和我的上级，也就是销售总监，说他要离职了。当时我没经验，小伙子一毕业就加入了我们公司，干了一年，表现也很好，我的反应就是：当然要挽回了。


    于是我马上进入了讲道理模式，和他说了 一堆咱们公司怎么怎么好，你表现也不错，晋升职加薪也不远了。可是他对我的话完全没感觉，我能看得出，他只是出于礼貌，听完而已。


    这时候，销售总监问：


    > “你为什么要离职？遇到了什么事了吗？”


    小伙子说： “我感觉目前的工作，都是在做执行，我们公司这么大，细节也多，我自己也算名校毕业，进入这家企业当然也算非常好的了。但我感觉自己的工作太琐碎了，这种工作只要认识字好像就能做。”


    接着他继续吐槽，销售总监认真地听，时不时地点点头。然后问了第二个问题：


    > “对于你的职业规划，你是怎么看的？”


    小伙子回答得很干脆： “我对于战略、宏观的大方向的把握感兴趣。我希望自己将来能够成为一家公司的 CEO，掌控全局，而不是处理琐碎的事情。” 然后他继续说自己对未来的规划，说了有十分钟。'
  - '[PAGE 22]


    我当时心想，小伙子心态还挺大的嘛，不过我看到销售总监始终认真地听，我也就忍住没有反驳。然后总监问：


    > “假设你现在就是 CEO，你觉得一个好的 CEO 需要哪些核心能力？”


    小伙子列举了好几个优秀的 CEO，这时候，他承认自己意识到了，他举出的这些优秀的榜样，要么本身就是对产品细节非常执著，要么就是在管理上，有非常强的执行力。


    最后，销售总监问：


    > “如果你也想成为这样的人，你觉得自己还可以从我们公司学到什么？”


    小伙子这一下就转过弯来，他回答：“我觉得，我们公司把战略从制定到落地，每个环节是怎么执行的，我还没有学到。”


    你看，这就是提问的力量。你提问，而不是提意见。让下属自己找到答案，比你告诉他怎么做，管用得多。


    # 五个问句


    那么，有没有一些提问的技巧呢？当然有，我总结出了五种提问句式，下次当你和下属谈心的时候，你只要抓住这五个疑问句，基本上就可以很轻松地驾驭谈话。这五个句式分别是：


    +   发生了什么事？

    你怎么看？

    你都试了哪些办法？'
  - '[PAGE 23]


    +   - 你需要哪些帮助？

    - 还有吗？


    当然，和下属谈心时，你不能机械地往外抛这些问题，你需要有的放矢地回应，甚至追问。我和你挨个解释一下每个问题背后的注意事项。


    第一个疑问句是，“发生了什么事？”


    很多时候，下属遇到事情的时候，会惊慌失措，汇报的时候也拎不清重点。作为上级，你的一句“发生了什么事？”首先，就让下属的心定下来。


    通过这个问题，你需要让下属把事情的起因经过结果，这些基本要素先讲清楚。这里你要特别注意，去确认信息的真实性和准确性。


    比如，下属会说，对某件事客户的观点是这样的。这时候，你就要让他转述客户的原话。再比如，当下属说了“很多”“很严重”这类词时，你也要让他给出具体的参照物或者是数量。总之，你要确保，你得到的信息，尽量是客观的。


    知道了发生什么事情这样的背景信息，你还不能马上给下属建议。这时候，你需要问，你怎么看？


    “你怎么看”这个问句，一是帮助你诊断下属的“心理干扰”，二是能引导你的下属去独立思考分析问题，同时，让他感到自己的意见也是会被重视的。


    也许你的下属，也提不出更好的想法，这时候，你需要问下一个问题：“你都试了哪些办法？”'
  - '[PAGE 24]


    人是有惰性的，往往习惯做伸手党，反正上级下命令，我执行，做错了，上级也要背锅。你问他：“你试过哪些办法了？”就是让你的下属意识到，他对这件事情是有责任的。当然，这个问题，也可以帮你搜集更多信息。


    现在你知道了发生了什么事，也听到了下属的想法，同时也了解了下属已经试过哪些办法了。这时候，你还可以问的就是：“你需要哪些帮助？”


    下属的惯性思维往往是“给失败找理由”；而你作为上级，你要教下属反过来想问题，让他为成功找资源，你可以这么问：“要达到你的目的，你需要哪些支持和资源？”


    还有一种情况，下属很容易掉到具体的细节里，你的作用，就是把他拉出来，看看全局。很可能在他看来天大的难题，在你看来，只是一个电话就可以帮助到他。


    最后一个问句，叫“还有吗？”


    这句话，应该是在下属每次说完之后，都需要问的。有的时候，一些重要的信息、想法，下属欲言又止的那一个瞬间，就差你的一句“还有吗？”他就说出来了。总之，等到他把想说的，都说了，你再进入一下问题。


    跟下属谈心，还有三个注意事项：


    首先，注意气氛，毕竟是在谈心，而不是审问。'
  - '[PAGE 25]


    你可以在对方回答完后，简单地重复，然后再提问。比如“你刚才提到了这些这些，我还想了解这些这些”。


    另外，你和下属，也不要面对面坐，而是可以呈 90 度，双方侧对着坐，甚至可以一起出去走走，边走边说，避免紧张感。


    第二点，保持好奇心，不要过早做评判。


    作为上级，很多时候，你是在帮助下属找答案，而不是把你的答案扔给他。


    第三点，注意，谈心的产出，是行动和结果。


    光感动，没行动，一点用都没有。所以，在和下属谈心的时候，你可以鼓励他畅所欲言，但是，谈完之后，必须要有下一步行动计划，并且督促他去做。


    这种提问的沟通方式，其实有个更专业的叫法，叫做“*教练技术*”，就是让你像球队教练一样，帮助下属成长。


    我们知道，教练是不能够下场去代替球员比赛的。教练技术，就是这样一种通过带着下属找答案，然后让下属自己解决问题的方法。


    如果你感兴趣，可以自己去进一步了解。一般来说，学会这 5 个问句，在日常工作中，就足够了。'
  - '[PAGE 26]


    # 本讲小结


    最后，总结一下，这一讲，我和你讲了跟下属谈心时的提问技巧。五个经典的问句，可以帮你和下属有效沟通。它们分别是：


    +   - 发生了什么事？

    - 你怎么看？

    - 你都试了哪些办法？

    - 你需要哪些帮助？

    - 还有吗？


    另外，三点注意，一要注意气氛，二要保持好奇心，三要落到行动上。


    说完了培训和沟通的技巧，接下来我们来聊聊如何打造一支高效运转的团队。'
  - '[PAGE 27]


    # ## 4.打造一支高效运转的团队


    我经常和朋友开玩笑说，做人力资源的工作久了，我已经练就了一个本领。那就是给职场人“算命”，看他未来五年能够升到哪一个层级。刚开始朋友们都不信，几年之后回过头来看，发现八九不离十。


    当然，我不是看八字、看面相，也不是看他单打独斗有多强，而是观察这个职场人，看他“带团队的能力”。


    这种能力强的人，他不但能把业务搞定，而且能带起来一片的下属；就算他不在业务一线，照样能玩得转业务；而且下属能不断成长起来，公司当然放心大胆地晋升他。


    但是我也观察到很多管理者，在带团队的时候容易陷入两种情况：


    +   - 一种是任务分配不下去，不知道怎么把人用起来，这种管理者的特点通常是对人很 nice，不喜欢得罪人，团队看起来一团和气，但业务发展不起来；

    - 另一种情况，管理者往往很强势，知道怎么给下属施压，但团队的离职率也很高。


    公司业务发展越快，对团队的管理能力就要求越高，有个比方叫团队发展就像“高速路上换轮胎”，是说团队自身的更新迭代，不能够影响业务的发展，因为没有太多的时间和空间留给你。


    # ### “人”和“事”的两条线管理


    想要团队高效运转，重点是要掌握“两条线”管理，一条线是“通过事管人”，一条线是“通过人管事”。'
  - '[PAGE 28]


    先说通过事去管人。作为团队领导，你首先要非常清楚整个团队的关键目标和关键任务。


    有句话说：“有目标的一群人才叫团队，没目标的一群人那叫团伙”。你要结合公司的战略和整体激励机制，给你的团队设定出一个个阶段性的总体目标。


    有了总体目标后，你就要把任务合理拆分到每个人身上。


    一个大原则是，你要派你的精兵强将，也就是能力强、态度积极的下属，去负责你的关键任务、关键区域、关键客户。好地种好粮，讲的就是这个道理。未来升职加薪的机会，也要相应地向他们倾斜。


    这里不需要所谓的一碗水端平，如果下属能力有差别，工作内容却差不多，这才是不公平。


    虽然作为团队领导，你对每个下属的工作能力，心里大概有数。但是我还是建议你分派任务之前做一个动作，就是和你的每一位下属进行谈话，谈话的内容：


    +   * 一是告诉他们，团队的阶段性目标是什么；

    * 二是询问他们：在这个大目标下，他希望承担哪一类的、多大的任务。


    得到反馈后，再给出你的建议。这样的谈话既能让对方感到自己被重视，也把指派工作变成了一起商量，帮助你的下属建立起全局意识和责任感。'
  - '[PAGE 29]


    拆分任务、责任到人后。作为上级，你要做的是绩效跟踪、业务辅导、必要的时候提供资源支持。在这个过程里，你一定要让下属明白，要你提供帮助，没问题，但他自己才是主要责任人。


    一家独角兽公司中国区负责人，曾经给我看过一张她的团队任务拆解表。她把经营目标转化成了50多个的过程指标：从APP获取新客，到唤醒老顾客的再次使用，每个数字背后都有指定的下属，或者是项目组，为这个目标的达成负责。整个团队目标清晰、分工明确。


    通过这么一张表，管理者可以非常清楚地看到，目标和现状之间的差距。在她的团队里想“打酱油”，基本是不可能的。


    通过事去管人，可以帮助你在团队建立起一种“结果导向”的绩效文化，但是如果只有任务没有人情味儿，这种团队也是走不远的。


    这就需要“通过人来管事”，因为具体的任务，都是由一个个的人去完成的。下属情绪、状态的好坏，会直接影响到工作结果。所以，“通过人来管事”更像是一种“以人为本”的管理思路。


    怎么个以人为本法呢？那就是从下属自身出发，抓两个主要问题：一是下属做的事情是不是让他有成就感，二是下属对这个组织有没有归属感。


    什么是成就感？成就感最核心的含义，是指个人优势的发挥，带来的价值实现。一个对职场长达25年的研究表明，每个人做自己优势所在的事情，'
  - '[PAGE 30]


    更容易获得成就感。所以作为上级，你要会发现下属的优势是什么，也要帮助下属找到能够发挥自己优势的空间。


    当然，职业优势定位是一个很大的话题，也不是这堂课的主题，但是你至少要知道，当你的下属工作状态出了问题，你需要往这方面去想：他目前的工作是不是让他感兴趣的、有成就感的工作？


    很多时候，不是说公司设计的岗位是什么，下属就只能做这个事；比如，财务部里，出纳只能管现金、费用会计只负责记账。


    其实，部门里会有很多公共事务，聪明的上级会把这些公共事务变成一个个小项目，让合适的员工承担起某个角色，比如对外协调人、审计项目对接人。这也能帮助下属更好地进行自我探索，发现适合他的任务和项目机会。


    说到归属感，“团队建设”必不可少，没错，也就是通常大家讲的团建，你不要觉得团队建设听起来老土，它绝对是必要的。


    团队建设这件事，你做得好是 90 分，做得不好是 60 分，但不做的话一定是零分。你不要指望你什么都不做，团队会自动形成有凝聚力的氛围。你可能会发现，同一个公司，不同部门员工的精气神会不一样，这体现的就是不同团队领导的团队建设能力。'
  - '[PAGE 31]


    不管你是什么领导风格，我建议你把“团队建设”放进你的必办事项里，比如，每周找一次机会当众赞美或者奖励某个下属；每个月创造一次让大家“玩在一起”的机会，每个季度，庆祝一次团队的里程碑。


    “玩在一起”很重要。我非常建议找一个大部分团队成员感兴趣的项目，每个月玩一次。我曾经带着我的创业团队踢足球，三年坚持下来，参加球队的员工的离职率，比起平均水平低了一半。


    你也可以考虑把你的团队打造成一个学习交流平台。你可以建立学习社群，分享学习资源；也可以固定一个学习时间，比如周会结束后的半小时，安排组员们轮流来做主题分享。


    根据这么多年我自己的经验，想让团队高效运转的同时，还有自我迭代的能力，一个非常好的办法，就是建立起一种“人人都是组织发展者”的文化，把组织发展的责任，分配到每一个人头上。


    例如：让下属参加公司招聘会、宣讲会，鼓励他们为公司内部推荐人选；让下属开发培训课程、去带新人。


    让下属参与这些事，能够提升他们的忠诚度。他们会觉得，有机会参加这类事情，是公司没有把自己当外人；而且，让一些相对资深的下属作为帮手，他们觉得自己被栽培，自然动力十足，你也不会孤掌难鸣。'
  md: '

    “小李，你提醒下我们几个大客户，该付款了。”


    然后你就离开了。小李却没有办法执行你这个命令。他不清楚客户不按时付款，有什么后果？客户要是拒绝了，该怎么办？可是小李又担心问太多，你嫌他这么简单的事都搞不清楚。于是，他硬着头皮，犹豫再三，终于拨通了客户的电话。结果因为拿捏不好说话的分寸，最后把一个老客户给得罪了。


    如果用上面说的三个步骤，你可以这么说：“小李，我需要你今天帮我给你们的几个大客户去个电话，提醒一下他们该付款了。”


    这是“是什么”。把基本信息交代清楚。


    然后，你要告诉下属，为什么给他布置这个工作，引起他的重视。


    比如你可以说，“小李，向客户收款这事对公司的经营非常的重要，不然的话公司现金流都有可能会断。一个称职的销售人员，既要能卖得出去东西，也要能及时收回钱。你前期对外销售表现不错，回款这块，你也要学一学。”


    这是“为什么”，既点出了公司的利益点，也点出了下属的利益点。


    接下来，你还不能让小李直接拿起电话就打，你要把具体怎么做，和他再拆解一下。


    比如，首先你需要先了解对方的过往付款记录，然后，你需要找对客户的付款决策人；最后，才是拿起电话去追款。


    至于电话里怎么跟客户沟通，你也应该把常见的注意事项告诉下属。


    只有这样，下属对该怎么办好这件事，才算是搞清楚了吧。


    完成了“我说你听”有时候是不够的，你需要再加上“你说我听”。


    - 一方面，很多你认为是常识的经验和技能，对于新人来说，不是马上就能搞清楚；

    - 另一方面，下属如果有不懂的地方，可能害怕你说他笨，不敢主动去问。


    当然，在这一步，你不需要那么生硬地说：“你给我重复一遍。”


    你可以把步骤和道理，切换到具体的场景里，让下属发表他的看法，提出自己的疑问。


    比如，刚才的例子里，你可以这么对小李说：“那么如果你要给 A 客户打电话，你会怎么做？”


    这时候小李开始分析对方的付款记录，关键决策人，并且假设了几个对方在电话里可能会出现的反对意见，这时候就可以给出你的建议了。


    不要嫌“我说你听，你说我听”这两步太麻烦。日本便利店 7-11 的创始人铃木敏文，甚至提出，他和下属布置工作，要说三遍。他说一遍，下属复述一遍，刚转身要走，他把人家又叫回来，再听下属说一遍。


    有些管理者，爱摆出老大的架子，总喜欢说：“这种小事，不要让我说第二遍”。很不幸，大多数下属，和你我一样，都是普通人，不是会读心术的神仙。


    第三个动作，是“我做你看”。 也就是亲身示范，大部分稍微复杂一些的任务，在下属刚接触的时候，你需要给他亲身示范。


    需要注意的是，亲身示范不等于亲力亲为。示范的重点是保证下属看得清楚、学得到，所以你应该遵守严格的流程和步骤，让下属学到良好的工作习惯。这一步，追求的是可复制的工作方法，而不是你自己觉得怎么方便就怎么来。


    其实，亲身示范一方面是做给下属看，另一方面也能让你跟一线工作保持接触，很多时候只有你亲自去做，才会看到问题在哪，才知道怎么优化流程；也更容易在下属中建立信任。


    所以，再拿那个例子来说，你其实可以当着小李的面，亲自给客户打个电话，示范整个沟通的过程，这样对下属来说，他掌握起来会更快。


    那么上级做完了，下属看到了，是不是就结束了呢？当然不是，就像我们不下游泳池，永远学不会游泳一样，下属是很难“看会”一件事的。所以还有“你做我看”这一步。


    也就是跟着下属去工作，在他身边进行观察，过后进行反馈。


    这个过程中，你得提醒自己不要陷入两种状态：


    一种是“控制欲”太强， 在观察下属做事的时候，总忍不住打断他们。你需要做的，是记录下问题，事后再反馈。有的时候，你得找机会，让下属狠狠地“失败”一次，摔个跟头才记得牢。


    另一种是“心太软”， 比如工作流程有五个步骤，下属跳过了 一步，结果好像也没出什么问题，所以就过去了。但正确的做法是你一定要指出来，让他重新按照五个步骤走一遍。


    在这里，我非常欣赏华为老总任正非的观点：先僵化、后优化、再固化。特别是新员工，先不要想如何创新，而是先把流程、操作步骤，老老实实地走一遍。


    观察了之后，你再开始针对他的完成情况，进行一次反馈。反馈主要围绕三个部分组成：表现好的地方、可以提升的地方和下一步的改变计划。


    反馈的时候，要记得让下属自己先说，你再点评。


    这样有两个好处:


    - 一个好处是，给自己留足思考和观察的时间，你不仅要看到下属怎么做，也得了解他们怎么想，不要以为你真的就那么懂他们的想法；

    - 另一个好处是，人对于别人的点评和建议，有一种本能的抵触情绪。你先说，下属很容易就开启了抵触情绪，很多话就未必听得进去了。


    ### 找到制约表现的具体行为点


    最后你需要注意的是，有的时候，下属事情做不好，可能跟个人特质有关系，那么你培训下属的时候，一定要注意寻找制约下属表现的具体行为点。


    举个例子，我曾经有一位下属，是销售经理，各方面表现得都很优异，但就是业绩上不来。客户经常向我投诉她，说她沟通有问题。但这个反馈还是太不具体了。到底是不会倾听，还是不会表达？是书面沟通？还是口头交流有问题？我平时和她开会，觉得挺正常的啊。


    我就和她一起去拜访客户，我马上发现，原来她在谈判桌上，非常容易情绪失控。


    谈判，大家知道，对方常常需要故意地给我们施加压力，有的时候会说 说风凉话，甚至有的时候，不专业的谈判对象，会进行人身攻击。


    我就发现，我这位下属，当她在谈判桌上被对方施压的时候，特别容易“入戏”，情绪一上来，就什么也不管不顾了。很显然，她是在沟通中的情绪控制上出了问题。


    找到问题之后，你首先需要让对方认识到这个问题，然后针对性地加强引导和培训，包括可以推荐外部的学习和培训资源给他。


    如果你发现下属身上有某些会影响到他职场发展的显著问题，不要觉得不好意思说，诚恳地指出来，会让他感激你。


    最后，你要意识到培训也是你和下属建立心理契约的一个场景。简单说，你要让下属明白：我培养你，你帮我做事，在你帮我把手办好的同时，你自己能力也提升了，受益的一定也包括你自己。


    ## 本讲小结


    我们来总结一下。培训下属，有四句口诀：


    "我说你听"，交代清楚是什么、为什么、怎么做；


    "你说我听"，让下属重复，确保他理解了要点；


    "我做你看"，亲身示范，不要嫌麻烦，不要跳步；


    "你做我看"，观察的时候不要打断，反馈的时候下属先说你再说。


    ## 3.提问：和下属谈心的技术


    很多时候，下属表现不好，不是因为能力不够，可能是情绪、心态出了问题，下属不在状态，能力再强也没用。有一个公式：下属的表现，等于能力，减去心理干扰。


    表现=能力-心理干扰


    作为上级，你不能只抓看得见的 KPI 数字，或者只会评价下属能力强不强，你同样也要学会去疏导下属的心理，也就是所谓的“谈心”了。


    当然，我这里说的谈心，不是指那些一年一度的、正式的工作回顾，也不需要当成“严肃的思想汇报”；也不是指下属跑来找你要个肩膀痛哭一顿，找个心理安慰。它是一种双向沟通，目的是帮下属解决“心理干扰”。


    ### 好的反馈来自对的问题


    这种谈话也是有技巧的。在这一讲，我要和你分享的，就是一套通过提有效的问题，和下属谈心的技术。


    我们经常说要“学会倾听”，其实，“学会提问”更重要，因为你只有问对了问题，才能得到有效的反馈。


    我先来举个例子。


    我刚升任经理的时候，有位下属，跑来找我和我的上级，也就是销售总监，说他要离职了。当时我没经验，小伙子一毕业就加入了我们公司，干了一年，表现也很好，我的反应就是：当然要挽回了。


    于是我马上进入了讲道理模式，和他说了 一堆咱们公司怎么怎么好，你表现也不错，晋升职加薪也不远了。可是他对我的话完全没感觉，我能看得出，他只是出于礼貌，听完而已。


    这时候，销售总监问：


    > “你为什么要离职？遇到了什么事了吗？”


    小伙子说： “我感觉目前的工作，都是在做执行，我们公司这么大，细节也多，我自己也算名校毕业，进入这家企业当然也算非常好的了。但我感觉自己的工作太琐碎了，这种工作只要认识字好像就能做。”


    接着他继续吐槽，销售总监认真地听，时不时地点点头。然后问了第二个问题：


    > “对于你的职业规划，你是怎么看的？”


    小伙子回答得很干脆： “我对于战略、宏观的大方向的把握感兴趣。我希望自己将来能够成为一家公司的 CEO，掌控全局，而不是处理琐碎的事情。” 然后他继续说自己对未来的规划，说了有十分钟。


    我当时心想，小伙子心态还挺大的嘛，不过我看到销售总监始终认真地听，我也就忍住没有反驳。然后总监问：


    > “假设你现在就是 CEO，你觉得一个好的 CEO 需要哪些核心能力？”


    小伙子列举了好几个优秀的 CEO，这时候，他承认自己意识到了，他举出的这些优秀的榜样，要么本身就是对产品细节非常执著，要么就是在管理上，有非常强的执行力。


    最后，销售总监问：


    > “如果你也想成为这样的人，你觉得自己还可以从我们公司学到什么？”


    小伙子这一下就转过弯来，他回答：“我觉得，我们公司把战略从制定到落地，每个环节是怎么执行的，我还没有学到。”


    你看，这就是提问的力量。你提问，而不是提意见。让下属自己找到答案，比你告诉他怎么做，管用得多。


    ### 五个问句


    那么，有没有一些提问的技巧呢？当然有，我总结出了五种提问句式，下次当你和下属谈心的时候，你只要抓住这五个疑问句，基本上就可以很轻松地驾驭谈话。这五个句式分别是：


    - 发生了什么事？

    - 你怎么看？

    - 你都试了哪些办法？

    - 你需要哪些帮助？

    - 还有吗？


    当然，和下属谈心时，你不能机械地往外抛这些问题，你需要有的放矢地回应，甚至追问。我和你挨个解释一下每个问题背后的注意事项。


    第一个疑问句是，“发生了什么事？”


    很多时候，下属遇到事情的时候，会惊慌失措，汇报的时候也拎不清重点。作为上级，你的一句“发生了什么事？”首先，就让下属的心定下来。


    通过这个问题，你需要让下属把事情的起因经过结果，这些基本要素先讲清楚。这里你要特别注意，去确认信息的真实性和准确性。


    比如，下属会说，对某件事客户的观点是这样的。这时候，你就要让他转述客户的原话。再比如，当下属说了“很多”“很严重”这类词时，你也要让他给出具体的参照物或者是数量。总之，你要确保，你得到的信息，尽量是客观的。


    知道了发生什么事情这样的背景信息，你还不能马上给下属建议。这时候，你需要问，你怎么看？


    “你怎么看”这个问句，一是帮助你诊断下属的“心理干扰”，二是能引导你的下属去独立思考分析问题，同时，让他感到自己的意见也是会被重视的。


    也许你的下属，也提不出更好的想法，这时候，你需要问下一个问题：“你都试了哪些办法？”


    人是有惰性的，往往习惯做伸手党，反正上级下命令，我执行，做错了，上级也要背锅。你问他：“你试过哪些办法了？”就是让你的下属意识到，他对这件事情是有责任的。当然，这个问题，也可以帮你搜集更多信息。


    现在你知道了发生了什么事，也听到了下属的想法，同时也了解了下属已经试过哪些办法了。这时候，你还可以问的就是：“你需要哪些帮助？”


    下属的惯性思维往往是“给失败找理由”；而你作为上级，你要教下属反过来想问题，让他为成功找资源，你可以这么问：“要达到你的目的，你需要哪些支持和资源？”


    还有一种情况，下属很容易掉到具体的细节里，你的作用，就是把他拉出来，看看全局。很可能在他看来天大的难题，在你看来，只是一个电话就可以帮助到他。


    最后一个问句，叫“还有吗？”


    这句话，应该是在下属每次说完之后，都需要问的。有的时候，一些重要的信息、想法，下属欲言又止的那一个瞬间，就差你的一句“还有吗？”他就说出来了。总之，等到他把想说的，都说了，你再进入下一问题。


    跟下属谈心，还有三个注意事项：


    首先，注意气氛，毕竟是在谈心，而不是审问。


    你可以在对方回答完后，简单地重复，然后再提问。比如“你刚才提到了这些这些，我还想了解这些这些”。


    另外，你和下属，也不要面对面坐，而是可以呈 90 度，双方侧对着坐，甚至可以一起出去走走，边走边说，避免紧张感。


    第二点，保持好奇心，不要过早做评判。


    作为上级，很多时候，你是在帮助下属找答案，而不是把你的答案扔给他。


    第三点，注意，谈心的产出，是行动和结果。


    光感动，没行动，一点用都没有。所以，在和下属谈心的时候，你可以鼓励他畅所欲言，但是，谈完之后，必须要有下一步行动计划，并且督促他去做。


    这种提问的沟通方式，其实有个更专业的叫法，叫做“*教练技术*”，就是让你像球队教练一样，帮助下属成长。


    我们知道，教练是不能够下场去代替球员比赛的。教练技术，就是这样一种通过带着下属找答案，然后让下属自己解决问题的方法。


    如果你感兴趣，可以自己去进一步了解。一般来说，学会这 5 个问句，在日常工作中，就足够了。


    ## 本讲小结


    最后，总结一下，这一讲，我和你讲了跟下属谈心时的提问技巧。五个经典的问句，可以帮你和下属有效沟通。它们分别是：


    - 发生了什么事？

    - 你怎么看？

    - 你都试了哪些办法？

    - 你需要哪些帮助？

    - 还有吗？


    另外，三点注意，一要注意气氛，二要保持好奇心，三要落到行动上。


    说完了培训和沟通的技巧，接下来我们来聊聊如何打造一支高效运转的团队。


    ## 4.打造一支高效运转的团队


    我经常和朋友开玩笑说，做人力资源的工作久了，我已经练就了一个本领。那就是给职场人“算命”，看他未来五年能够升到哪一个层级。刚开始朋友们都不信，几年之后回过头来看，发现八九不离十。


    当然，我不是看八字、看面相，也不是看他单打独斗有多强，而是观察这个职场人，看他“带团队的能力”。


    这种能力强的人，他不但能把业务搞定，而且能带起来一片的下属；就算他不在业务一线，照样能玩得转业务；而且下属能不断成长起来，公司当然放心大胆地晋升他。


    但是我也观察到很多管理者，在带团队的时候容易陷入两种情况：


    - 一种是任务分配不下去，不知道怎么把人用起来，这种管理者的特点通常是对人很 nice，不喜欢得罪人，团队看起来一团和气，但业务发展不起来；

    - 另一种情况，管理者往往很强势，知道怎么给下属施压，但团队的离职率也很高。


    公司业务发展越快，对团队的管理能力就要求越高，有个比方叫团队发展就像“高速路上换轮胎”，是说团队自身的更新迭代，不能够影响业务的发展，因为没有太多的时间和空间留给你。


    ### “人”和“事”的两条线管理


    想要团队高效运转，重点是要掌握“两条线”管理，一条线是“通过事管人”，一条线是“通过人管事”。


    先说通过事去管人。作为团队领导，你首先要非常清楚整个团队的关键目标和关键任务。


    有句话说：“有目标的一群人才叫团队，没目标的一群人那叫团伙”。你要结合公司的战略和整体激励机制，给你的团队设定出一个个阶段性的总体目标。


    有了总体目标后，你就要把任务合理拆分到每个人身上。


    一个大原则是，你要派你的精兵强将，也就是能力强、态度积极的下属，去负责你的关键任务、关键区域、关键客户。好地种好粮，讲的就是这个道理。未来升职加薪的机会，也要相应地向他们倾斜。


    这里不需要所谓的一碗水端平，如果下属能力有差别，工作内容却差不多，这才是不公平。


    虽然作为团队领导，你对每个下属的工作能力，心里大概有数。但是我还是建议你分派任务之前做一个动作，就是和你的每一位下属进行谈话，谈话的内容：


    - 一是告诉他们，团队的阶段性目标是什么；

    - 二是询问他们：在这个大目标下，他希望承担哪一类的、多大的任务。


    得到反馈后，再给出你的建议。这样的谈话既能让对方感到自己被重视，也把指派工作变成了一起商量，帮助你的下属建立起全局意识和责任感。


    拆分任务、责任到人后。作为上级，你要做的是绩效跟踪、业务辅导、必要的时候提供资源支持。在这个过程里，你一定要让下属明白，要你提供帮助，没问题，但他自己才是主要责任人。


    一家独角兽公司中国区负责人，曾经给我看过一张她的团队任务拆解表。她把经营目标转化成了50多个的过程指标：从APP获取新客，到唤醒老顾客的再次使用，每个数字背后都有指定的下属，或者是项目组，为这个目标的达成负责。整个团队目标清晰、分工明确。


    通过这么一张表，管理者可以非常清楚地看到，目标和现状之间的差距。在她的团队里想“打酱油”，基本是不可能的。


    通过事去管人，可以帮助你在团队建立起一种“结果导向”的绩效文化，但是如果只有任务没有人情味儿，这种团队也是走不远的。


    这就需要“通过人来管事”，因为具体的任务，都是由一个个的人去完成的。下属情绪、状态的好坏，会直接影响到工作结果。所以，“通过人来管事”更像是一种“以人为本”的管理思路。


    怎么个以人为本法呢？那就是从下属自身出发，抓两个主要问题：一是下属做的事情是不是让他有成就感，二是下属对这个组织有没有归属感。


    什么是成就感？成就感最核心的含义，是指个人优势的发挥，带来的价值实现。一个对职场长达25年的研究表明，每个人做自己优势所在的事情，


    更容易获得成就感。所以作为上级，你要会发现下属的优势是什么，也要帮助下属找到能够发挥自己优势的空间。


    当然，职业优势定位是一个很大的话题，也不是这堂课的主题，但是你至少要知道，当你的下属工作状态出了问题，你需要往这方面去想：他目前的工作是不是让他感兴趣的、有成就感的工作？


    很多时候，不是说公司设计的岗位是什么，下属就只能做这个事；比如，财务部里，出纳只能管现金、费用会计只负责记账。


    其实，部门里会有很多公共事务，聪明的上级会把这些公共事务变成一个个小项目，让合适的员工承担起某个角色，比如对外协调人、审计项目对接人。这也能帮助下属更好地进行自我探索，发现适合他的任务和项目机会。


    说到归属感，“团队建设”必不可少，没错，也就是通常大家讲的团建，你不要觉得团队建设听起来老土，它绝对是必要的。


    团队建设这件事，你做得好是 90 分，做得不好是 60 分，但不做的话一定是零分。你不要指望你什么都不做，团队会自动形成有凝聚力的氛围。你可能会发现，同一个公司，不同部门员工的精气神会不一样，这体现的就是不同团队领导的团队建设能力。


    不管你是什么领导风格，我建议你把“团队建设”放进你的必办事项里，比如，每周找一次机会当众赞美或者奖励某个下属；每个月创造一次让大家“玩在一起”的机会，每个季度，庆祝一次团队的里程碑。


    “玩在一起”很重要。我非常建议找一个大部分团队成员感兴趣的项目，每个月玩一次。我曾经带着我的创业团队踢足球，三年坚持下来，参加球队的员工的离职率，比起平均水平低了一半。


    你也可以考虑把你的团队打造成一个学习交流平台。你可以建立学习社群，分享学习资源；也可以固定一个学习时间，比如周会结束后的半小时，安排组员们轮流来做主题分享。


    根据这么多年我自己的经验，想让团队高效运转的同时，还有自我迭代的能力，一个非常好的办法，就是建立起一种“人人都是组织发展者”的文化，把组织发展的责任，分配到每一个人头上。


    例如：让下属参加公司招聘会、宣讲会，鼓励他们为公司内部推荐人选；让下属开发培训课程、去带新人。


    让下属参与这些事，能够提升他们的忠诚度。他们会觉得，有机会参加这类事情，是公司没有把自己当外人；而且，让一些相对资深的下属作为帮手，他们觉得自己被栽培，自然动力十足，你也不会孤掌难鸣。

