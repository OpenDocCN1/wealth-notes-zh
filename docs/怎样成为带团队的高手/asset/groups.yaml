  - '[PAGE 2]


    # 发刊词｜这堂课会给你带来什么


    你好，我是汤君健，欢迎来到我的课程，《怎样成为带团队的高手》。


    十几年前，我加入宝洁公司销售部，工作第一天，就被任命带领一支 11 人的销售代表团队。我一个给大家布置任务都会紧张的菜鸟，慢慢成长为渠道管理总监，带的团队也越来越大。后来我加入了一家大型平台电商，出任企业大学校长，其中一个重要工作，就是培训管理者如何带团队。


    目前，我自己作为创始合伙人，运营一支创业团队，同样面临着跟公司近百名 90 后、95 后的同学一起工作的新挑战。十二年的管理生涯，我带出了超过 200 个管理培训生；我也给不少高管做过辅导，指导他们如何带团队。


    你可能注意到了，我这堂课的题目，没有用“管理团队”，而是用“带团队”，这是因为，在我看来“管”和“带”是有差别的：“管”是管理事务和流程，而“带”，是人与人的交心，是带领、带头、传帮带。


    现在的职场，上级和下属的关系，已经不适合用“官大一级压死人”的传统关系来描述；它更像球队教练和球员的关系。


    作为教练，你需要调动球员们的场上、场下的积极性；需要训练他们的能力，还需要给球员们布置战术。就像是教练没有办法代替球员们下场去踢球，你也需要把你的下属给“带起来”，而不是你替他们去工作。


    这种新型的上下级关系的出现，来自于两个深刻的变化。'
  - '[PAGE 3]


    首先，生活水平提高了，简单的物质激励不那么有效了。


    也许你有听到身边的管理者抱怨，现在的年轻人不好管。有机构发布过一份《中国 90 后报告》，里面显示，在十几个选择工作的考虑因素里，“兴趣”排在了第一位；第二是“发展前景”，第三才是“薪酬待遇”。


    其次，工作机会正在从重复性的体力劳动，往创造性的脑力劳动方向转移。


    重复性的、可替代性的体力劳动已经大量地被人工智能、大规模流水线所替代，而分析、运营、设计、开发等极其依赖脑力劳动的工作岗位，正在成为职场的主流。但脑力劳动有两个特点：


    一方面它的过程是看不见的，和生产线上的工作相比，你无法确切地知道，这个对着电脑、手机聚精会神的员工，到底是在构思创意，还是在偷懒发呆，甚至有可能，是在忙自己的私活；


    另一方面，新技术新趋势不断出现，你需要不断带领下属们，去解决新问题，你需要跟你的团队一起共同进化，而不是你下命令，他们执行。


    +   - 也许你已经做了多年的管理者，仍然把握不了自己的管理风格，有的人过于强势，下属抱怨连天，甚至一走了之；有的人过于弱势，一味忍让，目标一减再减，团队倒是一团和气了，不过事情也推动不起来了。

    - 也许你自己是一名技术高手、业务骨干，刚刚被任命为别人的上级，你发现自己三分钟就可以搞定的事，要教会下属可能要两小时，而且效果还不如自己干了，那么教还是不教？怎么教？

    - 再比如，下属有自己的想法和需求，当他们跟你提升职加薪，甚至提离职的时候，你知不知道怎么应对？'
  - '[PAGE 4]


    如果你遇到过上面的这些困境，并且正在寻求解决方法，那么，我这门课一定可以帮助到你。


    你也许还会问，“带人”的能力，是不是天生的、是不是跟性格有关系，通过后天能学会吗？我性格好像过于内敛，是不是就“带不好人”？


    我的答案是，先天影响我们的，不是带人的能力，而是带人的风格，比如你是一个温和谦逊的领导者，或者一个雷厉风行的领导者；不管你是什么风格，你都需要一套管理方法作为基础。


    这也为什么，很多大型企业，甚至会让她普的管理者，全脱产一个星期，甚至更久的时间，专门去学习管理能力。企业要为此时付出资 10 万甚至几十万一天的花费。


    我这堂课交给你的，是一套拿来就能用的方法，这里面有我这么多年管理人才培养的教学经验，也有自己的亲身经历。就算你是刚刚晋升的新手，也能立刻上手；如果你已经有比较丰富的管理经验，你也可以比照一下，自己是不是这么做的，是不是还有可以调整的地方。


    我会分 7 个内容展开这堂课：


    第一讲，用“心理契约”管理你的下属。这一讲，我会给你一个处理上下级关系的新思路。


    第二讲，如何有效培训下属。帮助你快速地帮助下属成长。'
  - '[PAGE 5]


    第三讲，提问：和下属谈心的技术。我会给你分享怎么真正走进下属的内心，来帮助下属解决问题，对抗心理干扰。


    第四讲，打造一支高效运转的团队。我会给你介绍几个管理团队的制度工具，帮你把带单个下属的能力，拓展到带一支团队。


    第五讲，成为受人信赖的上级的自我修炼。我会和你分享作为上级该怎么自我管理。


    第六讲，艰难但必须学会的谈话。我会告诉你，下属要求升职加薪、离职谈判等场合，该怎么应对；


    第七讲，年度和季度回顾：让心理契约落地。我会告诉你如何跟下属进行年度、季度工作回顾，让它不再流于形式。


    好了，欢迎你跟我进入第一讲，用“心理契约”管理你的下属。'
  - '[PAGE 6]


    # 1.用“心理契约”管理你的下属


    在这一讲，我希望先帮你建立一种叫做“心理契约”的管理思路。


    心理契约这个概念最早是由一个叫丹尼斯·卢梭的管理教授，在20世纪90年代提出的，指的是雇主和雇员之间未成文的相互期待和预期。


    也就是说，当一个人加入到一个组织的时候，他对于组织能够给他什么，他需要付出什么，是有一个预期的。人们会基于预期进行盘算，这种盘算是在每个人心里进行的，虽然并不像劳动合同那样明确说出来。但这也是一种“交换协议”，这种交换协议，就叫心理契约。


    一个人工作是不是投入，是不是决定离职，主要是由“心理契约”决定的。


    你和下属之间，除了下级领导与被领导的关系，就存在着这样的一种默契，那就是，你代表公司，需要了解满足下属的需求，同时他努力工作作为回报。


    这种上下级关系，也叫“用交易代替管理”。如果员工能够看到，他其实是在为自己的需求工作，而不是被动地为公司的要求工作，也就不会有“当天和尚撞一天钟”的心态，你也不用每天盯着他是不是迟到、偷懒。你不用“管”他，他自己会主动工作。


    推动这种心理契约的建立，一定是每一个直接上级，也就是你。我的老家家宝洁公司流传着一句经典的话：“员工因为公司而加入，因为上级而离开。”说的就是在员工管理工作中，直接上级这个角色很关键。


    你就是公司和员工之间的那座桥梁。'
  - '[PAGE 7]


    要建立有效的“心理契约”，你需要让三类信息传导通畅：


    +   - 第一，了解下属想要什么；

    - 第二，让下属看见公司能给他带来什么；

    - 第三，让下属清楚你对他的期望是什么。


    # 了解下属想要什么


    我们先来说了解下属想要什么。


    你可以先问问自己：你真的知道你的下属，想要什么吗？


    最基本的，你对你的下属的基本情况了解有多少？他结婚了吗？有小孩吗？买房了吗？工作多久了？这一类的信息，你通过和他日常吃饭聊天，就可以获得。


    不要小看这些信息。不同的下属，在不同的阶段，看重的东西是不一样的，你要对症下药。


    比如，一个家境比较优越的员工，也许对个人成就会更在意；另一个拖家带口的下属，可能希望更多的现金收入。追求稳定的员工，他想要更多的假期时间陪家人，能不能升职加薪对他可能不那么重要。


    年轻的员工，尤其会重视个人成长和未来发展。千万不要以为，下属把工作完成好了，就万事大吉。聪明的员工会知道，自己不仅仅要胜任当前的工作，还要不断提升能力。希望快速晋升的员工，你不给他更多的机会和挑战，他就会觉得干的没意思。'
  - '[PAGE 8]


    更具体一点，你的下属对自己职业规划有哪些打算？目前的工作符不符合 他的职业发展目标？他是不是希望转行业，还是希望换岗位？你怎么帮他 把目标和现在的工作结合起来？


    除了收入和发展，员工还有情感上的需求。他们希望工作有成就感，发挥 自己的优势。他们需要归属感，需要自己的价值观在这个团队中得到肯定 和支持，等等。


    你的下属对现状满意吗？知道痛点，也能更好地帮你有的放矢。


    当然，下属的这些需求和目标，不会一开始就全部告诉你，甚至很多时候， 下属自己也没想清楚。作为上级，你需要利用好每次和下属沟通的机会去 了解，利用和他一起工作的机会去观察。


    聪明的上级，不会去评判哪种需求是对的，哪种需求就是错的；或者抱怨 下属怎么这么多需求。相反，你要利用好这些需求，驱动下属完成公司 的要求。


    除了了解下属需要什么，你也要让下属看到公司能给他什么。


    很多上级会认为，手上只有工资和晋升这两张牌。其实，上级能打的牌是 非常多的，比如，提供成长的机会，不管是培训、交流，还是更有吸引力 的项目，你比下属更清楚公司的资源，你需要让下属知道他有机会得到什
    么。'
  - '[PAGE 9]


    同时，你要学会去“营销”这些资源和机会，比如，往往其实只有最优秀的员工，才有资格参与公司的招聘。这对于锻炼下属识人看人的领导力，非常有帮助。如果你不去主动说明这件事的价值，下属甚至会认为这类工作，是种额外的负担。


    换句话说，你对下属好，你要让他知道。


    # 让下属知道你希望他做出什么


    除了了解下属想要什么，让下属看到，你能给什么，你还得让下属明白，你对他的期望是什么。


    每个员工入职的时候，通常就知道自己这个岗位的基本要求。但我要特别提醒你的的是，你要非常清楚地告诉下属，他的岗位责任和岗位意义，而不是只会给他“布置任务”。


    我以前在给一家公司做流程优化的时候，观察到一些部门经理，在交代工作的时候，是这样的：


    “小张，下个月你损耗要降 3 个点。”“小李，下个月你利润率要提升 1 个点。”


    这种沟通方式，给员工的感觉就像地主催长工交租，员工体会不到自己在团队中的重要性。这样也很容易让下属养成一种不好的心态：“老板怎么说，我就怎么做嘛。”而不会在岗位上发挥自己的主动性。


    你给下属安排岗位，你就要让他知道这个岗位的价值。'
  - '[PAGE 10]


    你给下属设置目标，你就要让他理解每个目标的意义。


    再拿刚才那个例子来说，同样是要求供应链环节要降3个点损耗，你可以这么说：


    “小张，目前整个公司的利润目标遇到了困难，我们一方面要开源，另一方面要通过降低损耗来节流。你是物流部的关键员工，我需要你给我拿出一个方案，降低3个点的损耗。”


    你看，这样的沟通方式，就是在帮助你的下属，建立他对这个岗位的责任感。这时候，下属就会自己去思考，怎么把工作做得更好。


    最后，补充一个非常重要的点，那就是当你的下属达到甚至超过你的预期，在工作上很好地帮助到你的时候，你一定要表现出来，让他知道。并且真诚地跟他说一句谢谢。


    不要小看这句简单的谢谢，你的下属听到会非常感动。


    刚才我们说了，想要建立有效的“心理契约”，你要让哪三类信息传导通畅，我再补充3点注意事项。


    首先，心理契约的形成，是一个循序渐进的过程。


    一方面，你和下属的信任感，是逐步建立起来的；另外一方面，公司和人都在发展，双方的需求不是一成不变的。所以，不要着急，要持续地去关注。


    第二，作为上级，你在心理契约的磨合过程中，要采取主动的姿态。'
  - '[PAGE 11]


    你要在每一次沟通机会中，主动地去了解和关心下属。让下属感觉到他是公司的资产。


    第三，要管理下属的预期。


    对于不切实际的心理预期，你要在第一时间，就明确地告诉他，不行。告诉得越早，越是负责任的表现。


    # 本讲小结


    总结一下，建立“心理契约”能让员工主动工作。如果你希望用建立“心理契约”的方法，去管理和激发你的下属，那么有三件事你需要做好：


    第一， 了解你的每一个下属，知道他们需要什么；


    第二， 让你的下属知道，你和公司能够给他什么；


    第三， 你还要让下属清楚地知道，你对他的期望是什么，他的工作做到什么程度才算好，让他们充分理解自己的岗位职责和岗位意义。


    最后，在下方，我分享一个盖洛普员工敬业度调查的十二个问题。这是著名的市场调研公司盖洛普，通过对 10 万名员工进行跟踪后，提炼出来的，最能反映员工工作状态的十二个问题。


    你可以让你的下属们匿名做一次，或者你自己以下属的身份代入做一次，评价一下你自己这个上级做得怎样。'
  - '[PAGE 12]


    如果十二个问题，有 **10** 个以上的答案是满意的、积极的，那么恭喜你，你看起来是个不错的上级；如果只有 **8** 个甚至更少的回答是满意的、积极的，那么，你要注意了，很可能你的团队正处于被动工作状态里，如果不赶快改进，很可能你的团队会出现大面积离职。


    接下来，我们来聊聊培训下属这件事。


    盖洛普员工敬业度调查的十二个问题：


    +   1. 我知道公司对我的工作要求吗？

    2. 我有做好我的工作所需要的材料和设备吗？

    3. 在工作中，我每天都有机会做我最擅长做的事吗？

    4. 在过去的七天里，我因工作出色而受到表扬吗？

    5. 我觉得我的主管或同事关心我的个人情况吗？

    6. 工作单位有人鼓励我的发展吗？

    7. 在工作中，我觉得我的意见受到重视吗？

    8. 公司的使命目标使我觉得我的工作重要吗？

    9. 我的同事们致力于高质量的工作吗？

    10. 我在工作单位有一个最要好的朋友吗？

    11. 在过去的六个月内，工作单位有人和我谈及我的进步吗？

    12. 过去一年里，我在工作中有机会学习和成长吗？'
  - '[PAGE 13]


    # 2.如何有效培训下属


    有句话叫，“教会员工，上级轻松”。你和下属，就像是师傅带徒弟，你比下属有经验，你要去指导他们。


    对新人，你一定希望他能尽快独当一面；对老员工，你可能也希望他更进一步，承担起更复杂的工作——你指导下属工作的过程，就是培训他们的过程，当上管理者之后，你有必要学习一点培训技巧。


    # 培训下属的四字口诀


    我会分享一套在培训界很经典的培训方法，把它放到你日常指导下属工作的场景里，这套方法概括起来就是四句“口诀”：


    > “我说你听”；“你说我听”；“我做你看”；“你做我看”。


    第一个动作，“我说你听”。也就是口头指导。这一步的关键是交代到位，你可以遵循三个步骤来把事情交代清楚：是什么、为什么、怎么做。


    +   “是什么”，是指我接下来要你做的是什么事；

    “为什么”，是指这件事对公司或对你个人的意义是什么，重要性有多高；

    “怎么做”，是指我建议你怎么做，一二三。最后这一步是帮助下属拆解任务、建立流程、强调重点。


    这个过程，可能你听起来觉得简单，但实际工作中，你未必每次都能把每一点交代清楚。


    举个例子。比如，你是大客户销售总监，要让新来的一个销售代表，给客户去个催款的电话。不就是个电话吗？可能你扔下一句：'
  md: "\n## 目录\n\n- 发刊词 | 这堂课会给你带来什么\n- 1. 用“心理契约”管理你的下属\n    - 了解下属想要什么\n    - 让下属知道你希望他做出什么\n\
    \    - 本讲小结\n- 2. 如何有效培训下属\n    - 培训下属的四字口诀\n    - 找到制约表现的具体行为点\n    - 本讲小结\n\
    - 3. 提问：和下属谈心的技术\n    - 好的反馈来自对的问题\n    - 五个问句\n    - 本讲小结\n- 4. 打造一支高效运转的团队\n\
