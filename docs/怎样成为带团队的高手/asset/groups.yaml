    \n## 谈话注意事项\n\n最后，我还是要强调一下个人发展计划沟通时的三个注意事项。\n\n第一，有时候期望管理也是很必要的。\n\n马云有段很经典的话，是他对新员工发表演讲时说的：“加入阿里巴巴，我们不承诺你会发财，不承诺你会成功，我们不承诺你会当官，但是我们承诺你会很倒霉、你会很受委屈。”\n\
