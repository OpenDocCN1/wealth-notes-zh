    \ 24.4）。對於向上突破與向下突破的兩份圖形，\n\n> \\* 譯按：請參考第 516 頁的註腳說明，不應該把發生機率為 50% 的任何事件一律視為隨機事件。譯者認為比較合理的處理方法應該如下。分別考慮一般交易日與內側日收盤價位在前一天價格區間上端\
