    | :--- | :--- |

    | 成交量型態呈現下降趨勢的排列數量 | 71/122 或 58% |

    | 三個峰值成交量持續下降的排列數量 | 30/122 或 25% |

    | 三個峰值成交量持續下降的排列平均跌幅 | 19% |

    | 第二峰值成交量低於第三峰值的排列平均跌幅 | 23% |

    | 第二峰值成交量高於第三峰值的排列平均跌幅 | 19% |

    | 相對於突破前一天，突破當天與隨後 5 天的成交量 | 188%，142%，113%，109%，104%，110% |


