    \ 19%），可以考慮在向下突破的過程賣出持股，然後在下檔目標價位附近再買回。請記住，衡量法則所提供的目標價位是最低水準，但達成率只有三分之二左右。換言之，如果你賣出持股而準備低價買回，實際的買回價格可能遠高於預期的目標價位。\n\
    \n## 交易範例\n\n小陳是一位初學的投資人。他擁有 MBA 學位，在某家保險公司上班，這使得他頗能接受風險。雖說如此，他還是儘可能避免放空股票。小陳對於圖\
    \ 39.7 的股票很感興趣。當時是 9 月中旬，就在排列向下突破的前幾天。排列內的成交量型態還算不錯，一直到最近 1、2 個星期才出現異樣，成交量逐漸放大。價格走勢數度穿破排列的上限與下限，轉折高點與低點相當明確。所以，這應該是一個標準的下降三角形排列。\n\
    \n小陳告訴我，他非常不習慣放空股票，因為股價在理論上可能無限上漲。我建議他把空頭部位的停損設定在下降三角形上限的外緣，如此就能夠侷限損失，防範價格向上發展。可是，他還是不願意，反而希望在低價買進股票，所以我建議他依據衡量法則的估計，嘗試在下檔目標價位附近買進。\n\
    \n計算三角形的高度，然後由排列下限向下衡量最低目標價位，結果大約在 $12\\frac{1}{2}$ 附近。不久，排列向下突破，而且繼續朝下發展。當價格觸及目標價位，而且隨後稍微反彈，他猜想這已經是低價了——至少他認為如此。\n\
    \n1992年10月19日，小陳按照收盤價 $12\\frac{1}{2}$ 買進 200 股，停損設定在 $11\\frac{1}{8}$，稍低於 12\
    \ 月份的低點支撐（$11\\frac{1}{4}$）。然後，他開始估計上檔的潛在獲利目標，相信股價應該能夠上漲到先前的高點 $17$ 附近。於是，小陳耐心等待。\n\
    \n不久之後，股價打底完成，開始向上攀升。11 月中旬，當股價出現 2 天的回檔走勢，小陳希望這代表三波段衡量漲勢的修正階段。由底部起漲點向上衡量到最近的轉折高點，漲勢幅度為\
    \ $2\\frac{3}{8}$ 點。由當時的收盤價向上衡量，三波段衡量漲勢第二隻腳的目標在 $17\\frac{1}{2}$，非常接近當初估計的目標價位\
    \ $17$。\n\n幾天之後，股價又開始上漲。12 月初，股價到達 $17\\frac{1}{2}$ 的目標價位，三波段衡量漲勢已經完成。小陳把停止點向上調整到最近的支撐\
    \ $16$。如果股票賣在 $16$，報酬率為 28%，相當不錯的績效。截至目前為止，發展非常順利，但他擔心整理走勢可能觸發位在 $16$ 的停止單。\n\n\
    邁入 1993 年之後，股價突然向上飆漲。隨著股價走高，小陳也把停止價位調高到 $23$。最後在 1993 年 2 月中旬的回檔走勢中，設定在 $23$ 的停止單被觸發。扣除所有的交易費用之後，這筆交易獲利將近\
    \ $2,000$，遠超過當初估計的水準。\n\n## Magne Tek, Inc.(墊子設備，NYSE，代碼 MAG)\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_324_0.png)\n\
