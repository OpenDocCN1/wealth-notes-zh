    # 失敗案例


    即使你確定某個排列是等腰三角形，但又如何判斷它是否會發生預期中的行為呢？完全無法判斷。請觀察圖 41.4，這是一個向下突破的等腰三角形，價格隨後回升到排列下限附近，接著又緩步下滑，然後突然折向三角形的頂點。在三角形頂點附近，價格經過一個月的橫向盤整，最後又恢復中期上升趨勢。


    圖 41.4 即是我所謂的 5% 失敗情況。換言之，價格朝某個方向突破，但還沒有出現 5% 或以上的跟進走勢之前，價格又朝相反方向發展。非常幸運地，等腰三角形排列很少發生
    5% 失敗的情況。可是，如同圖 41.4 顯示的，偶爾還是可能发生，所以你必須防範。


    觀察圖 41.4，我們發現等腰三角形排列發生之前的價格趨勢朝上，但三角形最初向下突破。由於半數以上的等腰三角形都屬於連續型態，這個例子的突破方向應該朝上，但實際不然。碰到這種情況的時候，應該考慮這是否是合理的發展。是'
