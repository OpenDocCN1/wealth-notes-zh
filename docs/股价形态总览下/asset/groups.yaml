    與 3），應該是頭線呈現水平狀的頭肩底型態，不是三角形排列。


    虛線右側的走勢圖也是如此。水平趨勢線左端沒有可供銜接的轉折高點。觀察這部分圖形，仍然像是上升三角形排列嗎？當然，我們可以 把排列上限往下平移，直到它觸及 12
    月初與中旬的兩個轉折高點爲止（圖形上方標示 1、2 與 3 之轉折低點所夾的兩個反彈高點）。可是，這部分排列仍然不是上升三角形，應該是頭肩底型態。左肩（標示爲
