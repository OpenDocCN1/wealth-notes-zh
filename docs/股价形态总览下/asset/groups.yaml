    把排列寬度定義為排列起點到楔形頂點之間的距離，我們希望知道提前突破落在排列寬度的哪個位置？平均而言，提前突破點落在排列寬度的 60% 位置，真正突破則落在
    61% 的位置。所以，我們不能就突破位置判別提前突破與真正突破。


