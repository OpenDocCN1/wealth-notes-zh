    ### 失敗案例


    週線的向下關鍵反轉，失敗率明顯偏高（37%）。這種排列的突破方向應該朝下；由於線形本身的收盤價已經低於前一周的低價，排列已經向下突破，所以沒有突破方向錯誤的問題。可是，價格向下突破之後，跟進的跌勢可能不足
    5%；所以，5% 失敗仍然構成問題。圖 46.3 顯示 5% 失敗的情況。1994 年 7 月底，價格向上突破一個相當大型的等腰三角形，然後出現向下的關鍵反轉。隔週的收盤價雖然小幅下跌，接下來又出現漲勢。一旦價格漲勢創該波段走勢的新高，向下關鍵反轉就視為失敗。


    **Advanced Micro Devices, Inc.（半導體，NYSE，代碼 AMD）**


    ![](img/157738047fa61d5e4bdbaf89f0241a36_464_0.png)


    看到週線的向下關鍵反轉，如果投資人決定賣出或放空，或許還是明智的決定。關鍵反轉發生之後的 5 個星期，價格由$31 大跌到$22。然後，股價在$22 形成雙重底。1995
    年 1 月份，價格穿越雙重底的確認水準$26⅓，展開另一波段的漲勢，6 月份創$39¼的峰值。由 1995 年 6 月份的峰值開始，價格出現暴跌走勢；截至
    1996 年的年中，價格在 $13 附近。


    如果投資人及早察覺等腰三角形向上突破的意義，或許就會懷疑向下關鍵反轉的有效性。關鍵反轉之後的小跌，似乎只代表等腰三角形向上突破之後的回挫走勢。在這種情況下，等腰三角形的上限能夠提供強烈支撐，回檔走勢應該在此反彈。


    至於向下關鍵反轉何以失敗，我們很難提出一般性的解釋。每個案例都需要個別評估，考慮的因素包括當時的技術面與基本面背景，例如：下檔支撐。如果關鍵反轉低點的下方缺乏強勁的支撐，該排列很可能就會發揮作用。


    如果下檔不遠處就存在鐵板支撐區或強勁的上升趨勢線，關鍵反轉很可能失敗。務必根據個別情況，擬定對應的交易策略。


    產業與整體市況也可能造成影響。如果當時處在大多頭行情中，向下關鍵反轉發生錯誤的可能性較大。同理，如果整個產業處於經濟榮景中，股價跌勢可能很短暫。


    由於週線關鍵反轉的線形經常很長，股價之所以突然大幅下滑，往往有基本面的理由。最好深入瞭解當時的經濟基本面背景，如此才能有充分的信心放空股票或脫離長期投資。


    ### 統計數據


    表 46.2 列示週線向下關鍵反轉的一般統計數據。由於這種排列的數量很多，我只由 500 支股票內挑選 200 支股票，做爲尋找樣本的對象。大部分案例都扮演短期趨勢的反轉型態，很多連續型態屬於
    5% 失敗案例。在我們觀察的案例當中，5% 失敗的情況大約佔 37%；換言之，向下關鍵反轉出現之後，價格沒有發生 5% 或以上的跟進跌勢，然後又顯著上漲。


