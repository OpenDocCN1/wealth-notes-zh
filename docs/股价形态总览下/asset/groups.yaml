    的次數分配，顯示大多數向上突破案例（52%）落在年度價格區間的上緣，大多數向下突破案例（49%）落在年度價格區間的下緣。


    對於向上突破，考慮年度價格區間三等份內的排列績效，其中以內側日收盤價落在下緣的排列平均漲幅最佳 27%，最差者為內側日收盤價落在中央的排列，平均漲幅只有 6%。向下突破的情況都不太理想，這三個區間位置的排列平均跌幅彼此相差不足
    3%。這些數據提供一些參考資訊，如果你打算操作內側日，應該考慮內側日收盤價落在年度價格區間的位置；


    對於向上突破，儘量挑選位在年度價格區間下緣的排列。


    排列的成交量型態也符合預期。內側日前一天的成交量很大（相當於 25 天移動平均成交量的 140%），這一天的價格區間相對較大，股票換手也比較積極，內側日的線形較短，交投相對冷清，成交量是
    25 天移動平均的 83%。


    我考慮內側日當天發生大成交量或小成交量，對於排列續效的影響。所謂「大成交量」與「小成交量」，分別定義為 25 天移動平均量的 1.5 倍以上與 0.5 倍以下。對於向上突破的內側日，當天發生小成交量的排列平均漲幅為
    22%，遠高於當天發生大成交量的續效（平均漲幅為 10%）。向下突破的情況剛好相反，內側日發生大成交量的排列平均跌幅較大（13%），發生小成交量的續效較差（平均跌幅為
    9%）。所以，如果你打算操作內側日排列，應該同時考慮突破方向與成交量。


    表 24.3 列示內側日的一些意外發現。第一個發現可以由失敗率解釋。按照技術分析的傳統觀點，內側日隔天應該發生重大價格走勢。可是，觀察實際的案例，超過半數的內側日排列，隔天沒有發生重大走勢*。


