    # 失敗案例


    老實說，圓形底排列之所以失敗，大部分都是因爲定義的問題。實務研究上，我發現大多數圓形底都屬於既有價格趨勢的連續排列。換言之，價格經過一段漲勢之後，出現開口向上的圓弧狀回檔走勢，然後又恢復先前的上升趨勢。凡是不符合前述格式的圓形底排列，一律歸納爲失敗案例。圖
    34.3 提供一個這類的失敗案例；此處的圓形底排列屬於既有價格趨勢的反轉型態。圓形底發生在價格下降趨勢的末端，排列完成之後，價格向上反轉而展開新的上升趨勢。'
