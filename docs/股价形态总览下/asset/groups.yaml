    93 個失敗案例並不包括 11 個 5% 失敗案例（所以才 93+11=104），但正文第 710 頁第二段提到「我把……視為失敗，其中當然包括 5% 失敗的情況在內」。因此，失敗率
    38% 與目標價位達成率 36% 之中必定有一項數據錯誤。


