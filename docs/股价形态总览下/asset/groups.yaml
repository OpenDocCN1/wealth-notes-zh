    ## 統計數據


    表 36.2 列示上升與下降扇貝形排列的統計數據。這類排列案例很多，大多數屬於既有趨勢的連續排列。如果排列發生之前的價格趨勢朝上（對於上升扇貝形排列而言），排列結束之後的價格繼續朝上發展。


    如果價格朝預期的相反方向顯著發展，排列歸類為失敗。對於上升排列，某個扇貝形結束之後，如果價格沒有上漲超過該扇貝形右端轉折高點的 5% 或以上，反而下跌而穿越排列低點，就視為失敗。下降排列的情況也相同，某個扇貝形結束後，價格向下穿越該扇貝形右端轉折高點而沒有發生
    5% 或以上跟進跌勢，結果又上漲而穿越該扇貝形右端轉折高點。失敗率——上升與下降排列分別為 25% 與 3%——是由扇貝形右端高點衡量到最終高點或低點。前文曾經解釋，如此衡量不利於上升排列，有利於下降排列。這種衡量方法造成上升與下降排列失敗率之間的差異，同時能夠說明上升排列的平均漲幅
    33% 可以低於正常水準（40%），下降排列的平均跌幅 24% 可以超過正常水準（20%）。除了造成績效上的差異之外，我認為這種衡量方法頗為合理，因為排列一旦完成之後，右端轉折高點很容易辨識，適合做為參考點。


    我利用排列漲幅或跌幅的次數分配圖，決定最經常發生漲幅或跌幅。圖 36.5 與 36.6 分別顯示上升排列漲幅與下降排列跌幅的次數分配圖。


