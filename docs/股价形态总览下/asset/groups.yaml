    \n此處只提供關係比較顯著的一份；換言之，向下突破的內側日。\n\n乍看之下，圖 24.4 似乎只是一些隨機散佈的黑點。可是，稍微仔細觀察，你就可以發現其中的關係：價格區間比率愈小，排列的績效愈好。換言之，圖形下半部向右延伸的黑點，數量超過圖形左半部向上延伸的黑點。向上突破的散佈圖也呈現相同的關係，只是效果比較不顯著罷了。\n\
