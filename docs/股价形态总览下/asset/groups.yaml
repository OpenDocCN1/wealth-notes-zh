    ## 辨識準則


    下降三角形具有一些特點，很容易辨識。請參考圖 39.2 的兩個例子。1993 年 3 月與 4 月之間出現一個下降三角形排列，使得 1992 年底以來的價格上升趨勢在此告一段落。3
    月初，價格夾著相對大量上漲，出現峰位而回檔，下跌走勢在 $29\frac{1}{2}$ 附近獲得支撐。價格向上反彈，這次漲勢的高點稍微下滑，隨後的跌勢又回到先前的支撐位置。4
    月上旬，價格做出最後一次反彈，該波段的轉折高點又下滑，然後夾著大量直接貫穿下檔支撐。


    如同一顆皮球由高處落到地板上，皮球由地板（支撐）向上彈升，每次的彈升高點都持續下降，使得排列上限朝右下方傾斜。這個例子的底部支撐在 $29\frac{1}{2}$，呈現水平狀。請注意，在排列之內，銜接波段走勢轉折高點的趨勢線向右下方傾斜，轉折低點銜接而成的排列下限則為水平狀：這是下降三角形的主要特質。另外，價格排列之內，成交量型態呈現下降趨勢。


    7 月份也出現一個下降三角形排列，雖然結構比較不完美。排列前半段的成交量趨於上升，後半段則呈現萎縮趨勢。8 月 3 日，價格向下突破，連續兩天的收盤價處在排列下限之下。然後價格開始回升，向上穿越三角形頂點，8
    月底創 $30\frac{1}{8}$ 的峰值。接下來，價格開始下跌，最初的跌勢相當緩和，隨後爆出天量向下崩跌。12 月 21 日，股價跌到 $23\frac{13}{16}$
    的低點，跌幅大約 15%。若把這個低點視為最終低點，第一個下降三角形由排列下限衡量的跌幅為 20%。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_307_0.png)


    圖 39.2 兩個下降三角形排列。3 月份的排列發生在 1992 年底以來的長期上升趨勢末端。價格排列的結構相當不錯，成交量也呈現下降趨勢，尤其是在排列的後半段。7
    月份的排列失敗，因為價格向上突破，大約有半數的下降三角形向上突破。


    如果你持有圖 39.2 的股票，在這兩個下降三角形排列過程中賣出持股，應該都會覺得很高興。雖然第二個三角形屬於失敗案例，價格向下突破之後沒有繼續下跌，反而向上發展，但不到一個月之內就出現崩跌走勢。某些情況下，失敗案例代表一個警訊，顯示趨勢即將發生變化的徵兆，就如同
    7 月份的例子一樣。


    表 39.1 列示下降三角形的辨識準則。三角形的結構，使得這個排列很容易辨識。價格沿著一條水平下限向上反彈，反彈走勢的轉折高點則愈來愈低，排列上限朝右下方傾斜。排列內的成交量型態也呈現下降，尤其是在突破之前，相對於前一天成交量而言，突破當天通常會發生大量。突破之後，價格通常會迅速遠離三角形排列，直接朝最終低點發展。由於下降三角形屬於短、中期的排列，對於價格走勢的衝擊很有限，股價跌勢很快就能回穩。


    排列的上限與下限分別代表股價的壓力與支撐。向上突破的回挫走勢經常止於排列上限（成功測試支撐），向下突破的回升走勢經常止於排列下限（成功測試壓力）。向下突破之後，隨後的價格走勢經常沿著原先三角形排列上限的延伸線繼續發展；反彈走勢則很難穿越原先三角形排列的水平下限，往往要經過數度嘗試才能克服此處的壓力。


    大體上來說，三角形排列很容易辨識。可是，某些情況下，還是可能辨識錯誤。圖 39.3 就是一個例子。這個排列看起來像是下降三角形，實際上不是。成交量型態也不符合下降三角形的常態：排列過程內持續收斂，直到突破為止。在圖
    39.3 的例子當中，最初的價格走勢夾著大量上漲，峰位與隨後跌勢都呈現成交量萎縮的趨勢。雖然排列末端的成交量小於初期，但趨勢不是持續減少，反而像是開口向上的弧形狀。


    對於大多數股價型態來說，成交量都不是必要條件，所以不應該過分重視。可是，話說回來，如果成交量型態非常古怪，至少代表一種警訊。配合其他徵兆與線索，你可能決定放棄某個交易對象，另外尋找其他更恰當的機會。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_310_0.png)


    圖 39.3 似是而非的下降三角形排列。此處只有一個轉折高點，排列中央留白太多。價格需要數度來回穿梭，至少各有兩個轉折高點與轉折低點。


    關於圖 39.3 的例子，除了成交量之外，價格結構更離譜。整個三角形排列只有一個轉折高點。有效的下降三角形，價格走勢應該數度來回穿梭，排列中央不允許留白太多。請對照圖
    39.3 與圖 39.1。


    ## 失敗案例


    下降三角形的失敗率高達 45% ，圖 39.4 就是一個失敗案例。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_311_0.png)


    圖 39.4 下降三角形失敗案例。下降三角形應該扮演價格下降趨勢的連續型態，但目前這個排列卻向上突破。


    這個排列的最顯著特徵就是價格向上突破；可是，為什麼呢？我只能揣測其中的答案，但圖 39.4 提供一些線索。首先，三角形排列發生在價格上升趨勢中。每三個下降三角形，就有兩個排列朝既有趨勢方向進行突破。目前這個例子，既有趨勢向上。


    > 譯按：就傳統技術分析的觀點，直角三角形雖然也可能是連續型態，但通常歸納為反轉型態，價格基本上是朝水平趨勢線方向突破。


    在這個突破過程買進股票，當然會擔心前述評論的正確性。向上突破之後的第 2 天，價格開始回挫，走勢没有在排列上限止跌，反而直接進入三角形排列，甚至差一點就觸及排列下限。


    雖然下降三角形通常都向下突破，但最好還是在收盤價實際穿越排列下限之後，才賣出或放空股票。就目前這個例子來說，如果你在排列過程中就賣出持股，結果將錯失一波 20%
    的漲勢。


    這個例子的成交量型態很難判讀；基本上是呈現「價漲量增／價跌量縮」的模式。如果你針對成交量時間序列計算迴歸直線，將發現該直線向下傾斜；換言之，成交量呈現下降趨勢，就如同典型的下降三角形排列一樣。


    ## 統計數據


    表 39.2 顯示下降三角形的一般統計數據。相對於上升三角形來說，資料庫內的下降三角形案例較少。這些案例當中，大約三分之二 (422/689) 屬於既有趨勢的連續型態。換言之，如果排列發生之前的價格趨勢朝下，排列完成之後，價格繼續朝下發展。


    就理論上來說，下降三角形有明確的突破方向：朝下。可是，實務上只有 55% 的下降三角形向下突破。前述數據只不過稍微勝過投擲銅板，顯然不足以做為交易的根據。然而，如果等待實際突破之後，排列成功的比率上升為
    96%。不幸的是，成功排列的平均跌幅只有 19%，大約反映一般空頭排列的平均績效（20%）。關於排列的最經常發生跌幅，我採用次數分配圖，把排列跌幅劃分為 10
    個區間，每單位刻度為 5%，請參考圖 39.5。我們發現最高欄位分別落在 10%、15%與 20%的位置，所以我把最經常跌幅設定為 10%~20%。


    下降三角形向上突破之後的表現很不錯，平均漲幅為 42%。這個數據顯示你應該順著突破方向進行交易——排列向上突破則做多，向下突破則做空。


