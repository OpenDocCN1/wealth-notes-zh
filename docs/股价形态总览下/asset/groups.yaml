    提前突破是否能夠提供任何線索，藉以判斷真正的突破方向？假定不考慮水平突破的情況，一旦發生向上提前突破，隨後有 40% 的案例出現向上真正突破，46% 的案例出現向下真正突破。如果發生向上提前突破，隨後發生真正向上或向下突破的比例各佔
    42%。


    前述這一切究竟有什麼意義呢？沒有太大的積極意義。表 38.3 告訴我們，一旦發生向上或向下提前突破，最後的突破可能朝任何方向發展。換言之，提前突破不能用來預測最後的突破方向或排列的成功與否。


    讓我們暫時把提前突破擺在一旁，接下來討論真正突破的相關統計數據，請參考表 38.4。向上或向下突破發生在排列寬度上的百分率位置——由排列起點往三角形頂點的方向衡量——分別為
    63% 與 68%。一旦向上突破之後，只有 13 個失敗案例（換言之，屬於 5% 的失敗；請參考表 38.2）。向下突破發生 5% 失敗情況的比率為 5%；換言之，價格向下突破之後，沒有出現
    5% 或以上的跟進跌勢，立即又向上折返而穿越排列上限。所以，一旦價格向下突破之後，通常都會繼續下跌。


    上升三角形排列向上突破的機率是 62%（大約是三分之二），向下突破的機率為 33%。這方面的統計數據不如其他某些排列，但能夠藉由某種方法改善操作勝算，細節請參考「交易戰術」一節。


