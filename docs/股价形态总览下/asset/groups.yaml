    不妨對照這兩個失敗案例與 8 月底的內側日。內側日隔天價格向上跳空（屬於突破缺口），當天的低價高於內側日前一天的高價。這個內側日導致重大價格走勢。


    8 月底的內側日隔天，顯然發生重大價格走勢；可是，對於比較不明顯的情況又如何呢？我需要設定一些判斷準則。成功的內側日排列必須滿足下列條件：內側日隔天的價格上漲（下跌）穿越內側日前一天的高價（低價），而且必須顯著穿越。換言之，內側日發生之後，必須出現價格趨勢。如果前述


    條件不符合，則內側日隔天必須出現很長的線形，長度為內側日的數倍，這也屬於成功的內側日排列。


    舉例來說，請參考圖 24.2 的 A 點，我認為這個內側日隔天發生重大價格走勢。內側日隔天的低價為 $14\frac{1}{2}$，等於內側日前一天的低價，當天高價等於內側日的高價。相對於內側日本身來說，隔天的價格區間看起來似乎代表重大走勢。


    或許我採用的準則太嚴格，所以失敗率特別高（請參考下一節「統計數據」的相關討論）。


    ### 統計數據


    圖 24.1 與 24.2 可以說明一項重要事實：內側日的案例很多。由於案例實在太多（很多股票在 5 年期間內出現 100 個以上的內側日），我必須透過某種方法侷限樣本。非常幸運地，這種排列很容易運用電腦辨識。


    我打算挑選 500 個左右的樣本，但 5 支股票就能提供足夠數量的案例。所以，我透過某種隨機的方法在 500 支股票中挑選大約 50 個對象；對於每個對象，每幾個內側日案例挑選
    1 個樣本，每支股票總共只挑選 10 個樣本。舉例來說，如果某支股票提供 20 個案例，那我就每 2 個案例挑選 1 個樣本；如果某支股票提供 100 個案例，那我就每
    10 個案例挑選 1 個樣本。透過這種方法，不只可以就整體 5 年的走勢挑選樣本，而且由 5 支股票增加為 52 支股票，使得樣本更具代表性。


    表 24.2 內側日排列的一般統計數據


    | 說明 | 向上突破 | 向下突破 |

    |---|---|---|

    | 排列數量： | 243 個 | 277 個 |

    | 1991 年~1996 年的 52 支股票，每支股票樣本數量不超過 10 個 | | |

    | 反轉或整理排列 | 151 個整理，92 個反轉 | 123 個整理，154 個反轉 |

    | 失敗率 | 137/243 或 56% | 141/277 或 51% |

    | 成功排列的平均漲幅 / 跌幅 | 13% | 10% |

    | 最經常發生漲幅 / 跌幅 | 0~5% | 0~5% |

    | 對於成功排列，到達最終高點 / 低點的天數 | 65 天 | 22 天 |

    | 排列起始於最近 12 個月價格區間的下緣、中央或上緣 | 下緣 24%，中央 24%，上緣 52% | 下緣 17%，中央 34%，上緣 49% |

    | 前述突破位置的平均漲幅 / 跌幅 | 下緣 27%，中央 6%，上緣 11% | 下緣 11%，中央 11%，上緣 8% |

    | 內側日前一天、當天與後一天成交量相對於 25 天移動平均的百分率 | 140%，83%，93% | 140%，83%，93% |

    | 內側日成交量為 25 天移動平均的 1.5 倍以上，排列的平均漲幅 / 跌幅 | 10% | 13% |

    | 內側日成交量為 25 天移動平均的 0.5 倍以內，排列的平均漲幅 / 跌幅 | -22% | 9% |


    我把排列分為兩個類別，一是內側日隔天價格上漲的向上突破，另一是內側日隔天價格下跌的向下突破。所謂向上突破，是指隔天的價格收高或出現更高的盤中高價；同理，向下突破是指隔天的價格收低或出現更低的盤中低價。如果收盤價、最高價或最低價都沒有變動，就繼續觀察，直到能夠決定突破方向為止。


    表 24.2 顯示內側日排列的績效統計數據。在 52 支股票的 5 年走勢中，我總共挑選 520 個樣本，包括 243 個向上突破與 277 個向下突破。在向上突破的案例中，內側日發生在短期上升趨勢中扮演連續型態的排列較多（151
    個），發生在短期下降趨勢中扮演反轉型態的排列較少（92 個）。對於向下突破的案例，扮演上升趨勢反轉型態的排列稍多（154 個），處在下降趨勢中扮演連續形的排列較少（123
    個）。


    衡量內側日隔天是否發生重大價格走勢的失敗率，向上與向下突破分別為 56% 與 51%。我認為可靠型態的失敗率應該低於 20%，所以內側日屬於非常不可靠的排列。由另一個角度說，半數以上的內側日，隔天都發生小走勢。


    對於向上與向下突破，排列的平均漲幅與跌幅分別為 13% 與 10%。相對於一般排列向上與向下突破之後的平均漲幅（40%）與跌幅（20%），內側日的績效顯然很差。績效不彰的最主要理由，可能是最終高點與最終低點的決定方法。就最終高點來說，這是挑選排列完成到趨勢發生反轉之間的最高價。另外，價格向上突破之後，如果又跌破排列最低價，則以


    這段期間內的最高價為最終高價。最終低點的定義也相同，除了必要的調整之外。


    由於內側日只由 2 支線形構成，甚至連正常的價格波動都很容易穿越排列最低價。其他大多數排列都需要經過一段時間的醞釀，股價型態才能夠完成，所以排列本身涵蓋的價格區間較大。內側日的情況不是如此，很容易因為價格穿越排列最低價或最高價而發生最終高價或最終低價，所以績效較差。


    不論向上或向下突破，排列的最經常發生漲幅或跌幅都不足 5%。請參考圖 24.3 的案例漲幅與跌幅次數分配（向上突破的漲幅柱狀圖標示為黑色，向下突破的跌幅柱狀圖留白）。兩者的最高欄位都落在
    0% 到 5% 區間，幾乎有一半（49%）的向下突破案例跌幅低於 5%。漲幅或跌幅低於 10% 的排列數量，大約佔所有案例的三分之二。由於績效表現實在太差，顯然不應該相信這種股價型態將出現持續性的漲勢或跌勢。


    非常古怪的，向上突破排列到達最終高點的平均時間（65 天），幾乎是向下突破排列到達最終低點（22 天）的三倍。觀察實際的案例，我發現向上突破有少數案例到達最終高點的時間特別長，使得平均數向上扭曲。如果剔除這些時間高達三位數字的多群案例（總共有
    13 個），則向上突破排列到達最終高點的平均時間只是 13 天。如果向下突破排列也做類似的調整，平均期間為 17 天。


    內側日經常發生在年度價格區間的上緣、下緣或中央附近？統計內側日收盤價落在最近 12 個月價格區間三等份位置


