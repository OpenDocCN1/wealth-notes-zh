    圖 42.5：三重底排列向上突破的漲幅次數分配 最經常發生漲幅為 20%，也是最高欄位代表的漲幅。可是，漲幅 10% 到 50% 的發生次數幾乎都完全相同，這意味著最經常發生漲幅應該高於
