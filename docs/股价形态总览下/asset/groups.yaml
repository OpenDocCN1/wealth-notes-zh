    ## Modine Manufacturing（汽車零件，NASDAQ，代碼 MODI）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_369_0.png)


    圖 41.8 等腰三角形頭部排列。緊跟著發生上升扇貝形排列，最後又出現頭肩頂排列。首先計算排列高點（A 點）與低點（B 點）之間的高度。對於向上突破，由排列高點（A
    點）向上衡量排列高度；對於向下突破，由排列低點（B 點）向下衡量排列高度。結果就是突破之後的最低目標價位。


    多頭部位的停損設定在排列最低價下方 1/8 點處，空頭部位的停損設定在排列最高價上方 1/8 點處。對於圖 41.8 來說，進場買進之後，停損設定在 $18\frac{3}{8}$（換言之，B
    點的下方 1/8 點處）。價格突破之後，回挫或回升走勢通常會停頓在排列近邊的趨勢線或三角形頂點的水平位置。換言之，如果走勢足夠強勁，價格通常不會重新折返進入排列之內。萬一價格穿越遠邊的趨勢線，甚至穿越排列最高價或最低價，就應該停損出場。


    如果三角形的高度夠大，可以考慮在排列之內來回操作。當價格觸及或接近排列下限，並且開始向上回升，考慮進場買進或回補；當價格觸及或接近排列上限，並且開始向下反轉，考慮賣出或放空。當排列朝某個方向進行突破的時候，如果你足夠幸運的話，可能剛好持有順勢部位。


    當價格朝有利方向發展，你應該調整停損或停止點，儘可能讓部位及早進入持平狀態或鎖定更多的獲利。按照這種方式處理，萬一排列失敗或進度不如預期，可以避免損失太大，甚至仍然可以賺取一些獲利。


    ## 交易範例


    周神父的教堂就在我家附近。他是典型的保守分子。從事股票交易，安全第一，決不貪心。


    1993 年 5 月中旬，他開始注意到圖 41.8 的等腰三角形排列，當時價格第三度觸及排列下限。他對照股價型態的辨識準則，相信這是一個有效的等腰三角形頭部排列。


    5 月底，當收盤價穿越排列上限的隔天，周神父進場買進，成交價格為 $21\frac{1}{4}$，大約在當天價格區間的中央。經紀人打電話回報之後，他匆忙地走進教堂，祈禱上帝讓這筆交易獲利。


    他的祈禱似乎產生一些效果，價格在隨後幾天內穩定上漲到 $22\frac{1}{4}$，然後麻煩來了。價格開始回檔，周神父有些不知所措。他打電話給經紀人，在三角形最低價（B
    點）下方的 1/8 點處設定停損 ($18\frac{3}{4}$)。


    隨著價格下跌，周神父留在教堂的時間愈來愈多，不斷祈禱，請求上帝原諒他的罪過，但對於股價走勢似乎幫助不大。回挫走勢首先在排列上限附近獲得支撐，但隨著時間經過，價格也沿著排列上限下滑，逐漸逼近三角形頂點，甚至稍微穿越。價格在三角形頂點附近盤旋幾天，然後快速反彈。


    發現回挫走勢完成之後，周神父利用衡量法則估計上檔的目標價位為 $28\frac{1}{8}$。他打電話給經紀人，取消當初的停損單，把限價停止賣單設定在目標價位。


    隨後 2 個星期左右，情況的發展相當不錯，股價向上測試先前的高點，但在 $22\frac{3}{4}$ 出現峰位而拉回。價格又逐漸下跌到 $20$ 附近，這也是三角形頂點的水準，在此橫向盤整幾個星期。然後，價格畫出圓弧狀的上升扇貝形排列。


    10 月中旬，股價由高檔 $26$ 下跌到 $22\frac{3}{4}$，周神父覺得很緊張，希望設定停損單，但經紀人不允許他同時在兩個價位設定停損買單與限價停止賣單。所以，他只有按耐焦急的情緒，默默等待。


    10 月底，價格恢復漲勢，他總算鬆了一口氣。11 月中旬，價格終於到達目標價位，引發他設定的停止賣單，於是在 $28\frac{1}{8}$ 賣出股票。幾天之後，股價暴跌到
    $24$。


    ## 三重底排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_373_0.png)


    ### 摘要資料


    - 外觀：三個顯著的轉折低點，發生在大約相同的價位。

    - 反轉或整理：短期（3個月以內）的多頭反轉走勢。

    - 失敗率：4%。

    - 平均漲幅：38%，最經常發生漲幅為 20%。

    - 成交量趨勢：下降。

    - 回挫：70%。

    - 目標價位：達成率 73%。

    - 意外發現：第三底部價位高於第二底部的排列，平均漲幅較高為 48%（第二底部價位高於第三底部的排列平均漲幅為 31%）。第三底部成交量大於第二底部，排列平均漲幅較高為
    40%（第二底部成交量大於第三底部的排列平均漲幅為 28%）。

    - 參照排列：(1) 擴張底排列，(3) 擴張排列下降直角三角形，(6) 下降擴張楔形排列，(18) 頭肩底排列，(19) 複雜頭肩底排列，(39) 下降三角形排列。


    三重底排列 (triple bottoms) 的意外結果之一，是失敗率偏低，只有 4%。基於某些理由，我原本預期失敗率更高一些。如果按規矩操作，等待實際的向上突破，很少三重底排列會發生失敗的情況。排列的平均漲幅為
    38%，最經常發生漲幅為 20%，類似於一般多頭排列的績效。


    在所有的三重底排列當中，大約有 70% 的案例發生回挫走勢。這可能會造成一些誤解，因為突破點距離最後一個谷底可能有段距離——平均幾乎相隔 30 天。可是，價格由第三個谷底攀升到突破點
    (或確認點)，這段時間還是花得很有價值。


    就第三個谷底與第二個谷底的相對價格來說，如果第三個谷底高於第二個谷底，排列的平均漲幅為 48%；反之，如果第二個谷底高於第三個谷底，排列的平均漲幅只有 31%。前述的差異具有統計上顯著的意義，但這兩個谷底的價格差值平均只有
    35 美分。


    成交量對於排列績效也有影響。如果第三個谷底的成交量大於第二個谷底，排列的平均漲幅為 40%；反之，如果第二個谷底的成交量大於第三個谷底，排列的平均漲幅只有
    28%。這方面的細節內容，請參考「統計數據」一節。


    ### 緣起


    圖 42.1 提供三重底排列的範例。價格三度下跌到 $37 而向上反彈，$37 顯然提供強勁的支撐。V 型谷底——尤其是第三個谷底——是三重底排列的特質之一。另外，夾在第一個谷底與第二個谷底之間的峰位呈現圓弧狀，這也是三重底排列的特色，但不是必要條件。


    ## Viacom Inc.（娛樂，ASE，代碼 VIA）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_375_0.png)


    圖 42.1 這是相當罕見的三重底排列，因為它發生在一段漲勢的中間。由確認水準 $46\frac{3}{4}$ 起算，排列向上突破之後，最後上漲到 $67\frac{3}{4}$。


    三個谷底的價位大約相同；就目前這個例子來說，三個價位的差距在 3/8 點之內。這是三重底排列的關鍵成分，請參考「辨識準則」一節的討論。


    每種股價型態都有獨特的性質，使其有別於其他排列。三重底排列的情況也是如此，請參考圖 42.1。1992 年 10 月中旬，股價經過 5 個月的下跌而到達低點。然後，股價回升創新高，接著出現回檔走勢，這個回檔低點就是三重底的第一個谷底。往回回溯，第一個谷底支撐價位剛好對應
    1992 年 5 月份的峰位。1992 年 1 月份到 5 月份之間，股價數度向上測試 $37，但不能克服此處的壓力。


    由於 $37 曾經構成強勁的壓力，現在轉換角色而變成強勁的支撐。每當價格下跌到 $37，願意出脫持股的人明顯減少。即使有人願意賣出，也立即有人願意接手，因為此處被視為價格特別便宜的水準。我們發現，價格停留在
    $37 的時間非常短暫。如果你仔細觀察圖 42.1，將發現每個谷底都是單日的向下突兀線形，雖然長度不特別凸顯，但仍然清晰可見。


    在排列的初期階段，由第一谷底到第二谷底之間，當時的發展看起來似乎是上升直角三角形的擴張排列，下側趨勢線為水平狀，上側趨勢線向上傾斜。可是，價格在排列上限與下限之間來回穿梭的次數不夠多，不足以視為有效的擴張排列。每當我看見某個排列留白太多
    (以圖 42.1 為例，第一谷底與第二谷底之間的情況)，就會讓我覺得緊張。第二谷底與第三谷底所夾的上漲走勢峰位，距離排列上限實在太遠，擴張排列的可能性已經不存在。


    當價格由第二谷底回升，在 $46 出現峰位而回檔，當時的結構看起來是雙重頂。可是，當價格回檔到 $37，又獲得支撐而反彈，所以雙重頂並沒有完成。


    三重底型態需要多次的價格來回，這種複雜結構可以說明該排列何以非常罕見，請參考「統計數據」一節的討論。接下來，讓我們說明如何辨識三重底排列。


    ### 辨識準則


    表 42.1 列示三重底排列的辨識準則。我想，大多數技術分析師都會告訴你，任何三個底部不一定就構成三重底排列。三個底部的規模通常很大，彼此相隔一段距離，兩個底部之間夾著圓弧狀拱出的價格走勢。三個底部的最低價應該大約落在相同價位。如果中間底部的價位較低，可能是頭肩底排列。如果三個底部的價格持續下滑，很可能是某種擴張排列（如果三個谷底所夾的兩個轉折高點持續墊高，可能是擴張底排列；如果兩個轉折高點落在相同價位，可能是下降直角三角形的擴張排列。如果三個谷底的價位相同，但三個谷底所夾的兩個轉折高點持續墊高，則是上升直角三角形的擴張排列。如果三個谷底的價位持續上升，而三個谷底所夾的兩個轉折高點也持續墊高，則屬於擴張楔形排列）。


    在排列的發展過程，成交量通常趨於下降。由於排列涵蓋的期間很長，成交量型態偶爾會呈現不規則的變化。三個底部的成交量通常都會顯著大於先前幾天的成交量；就三個底部本身而言，第一個底部的成交量通常最大。有關成交量的細節內容，請參考「統計數據」一節。


    現在，我們已經知道一些辨識準則，但三重底排列的形狀究竟如何呢？請參考圖 42.2 的例子。三個谷底的形狀非常凸顯，連續兩個谷底之間都夾著顯著的漲勢。三個谷底的價位大約在
    $35 附近，三個谷底所夾兩個峰位的最高價為 $40 出頭，後者是三重底排列的確認水準。當價格由第三個谷底回升，代表潛在的三重底已經出現，一旦價格上漲而超過確認水準，三重底正式完成；換言之，當價格穿越確認水準，三重底得到確認，價格應該繼續上漲。


    由圖 42.2 可以看出三個谷底大約落在相同價位，只有第三個谷底的價位稍高。按照「統計數據」一節的說明，這種現象意味著排列績效通常較佳。這個三重底排列是一波重大漲勢的起點，起漲價位在
    $34\frac{1}{2}$，16 個月之後的高價為 $73\frac{1}{2}$。


