    # 摘要資料


    外觀 在週線圖上，線形高價高於前一週高價，低價也低於前一週低價。收盤價低於前一週的低價。


    反轉或整理 短期（3個月以內）的空頭反轉走勢。


    失敗率 37%。


    平均跌幅 18%，最經常發生跌幅為 10%。


    目標價位達成率 73%。


    意外發現 發生位置與最近峰位的距離愈遠，關鍵反轉失敗的可能性愈大。關鍵反轉本身的線形愈長，續效表現通常愈理想。


    參照排列 （47）週線向上關鍵反轉。'
