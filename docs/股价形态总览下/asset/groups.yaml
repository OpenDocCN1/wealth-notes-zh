    \n## 交易戰術\n\n如果不準備涉及隨機漫步理論，或討論明天股價上漲的機率是否是 50%，恐怕就沒有什麼交易戰術可言，內容當然更難填滿一份表格。如果讀者還需要一些陳腔濫調的建議，那我只好勉強提出一點：如果你準備針對內側日進行操作，就順著趨勢方向交易。等待收盤價向上或向下突破內側日的頭部或底部。如果向上突破，就買進股票；如果向下突破，就放空股票。然後，找一間你認為最靈的廟，燒三柱清香，請佛祖或老天爺保佑！\n\
    \n我在「統計數據」一節中曾經簡單提到下列兩項建議。\n\n績效最佳的向上突破內側日排列，通常發生在年度價格區間三等份的下線（平均漲幅為 27%，遠高於不特別考慮排列發生位置的平均績效\
    \ 13%）。至於向下突破，不論內側日發生在年度價格區間的哪個位置，績效都沒有太大的差異。請留意內側日當天的成交量。小量的向上突破內側日與大量的向下突破內側日，排列績效通常比較理想。關於這兩項建議的詳細資料，請參考表\
    \ 24.2 與「統計數據」一節的討論。\n\n## 交易範例\n\n老郭在公家銀行有一份穩當的工作，但閒暇時間經常從事股票的紙上模擬操作，希望有一天能夠成為專業的部位交易者。當他看見圖\
    \ 24.5 的內側日，決定由空方進行紙上交易。由於內側日當天以最低價收盤，而且該收盤價又深入前一天線形下端的 25% 位置，這意味著股票隨後將發生重大跌勢——至少根據老郭的判斷是如此。內側日的隔天，他放空股票，假定成交價格是\
    \ $14\\frac{1}{2}$。\n\n正如同預期中的情況一樣，內側日隔天的價格以最低檔收盤，但隨後三天都呈現橫向盤旋的走勢，甚至稍微走高。就當老郭準備回補出場之前，股票向下反轉，出現重大的跌勢。三天之後，股價跌破\
    \ $13，1,000 股的空頭部位已經取得相當不錯的未實現獲利。\n\n然後，股票出現強勁的單日反彈（圖 24.5 標示 A 點的位置），但老郭白天上班，沒有時間查閱股價走勢，一直到收盤之後，他才曉得當天的盤勢。老郭沿著近來的下跌走勢上線，繪製一條下降趨勢線，發現\
    \ A 點的單日反彈只不過稍微穿越趨勢線，未必構成有效的突破，但還是可能意味著趨勢即將向上反轉。隔天，當老郭還在三心兩意不知道是否應該回補股票的時候，價格又開始下跌。\n\
    \n由於實在難以決定，老郭決定投擲銅板，結果他繼續持有空頭部位。當天交易結束的時候，股價確實收低，重新跌破下降趨勢線。可是，老郭認為當天的發展純屬運氣，決定股票收盤價如果再度向上穿越下降趨勢線，就回補空頭部位。\n\
    \n老郭每天都按時更新走勢圖，密切觀察股價發展。12 月中旬，在一支吊人線形之後*，收盤價向上買穿趨勢線，老郭認為這已經是出場的恰當時機。他回補股票，假定成交價格為\
    \ $12^{7/16}$，每股獲利大約是 $2。他非常不屑地想著：「股票交易實在很簡單。」\n\n> \\* 譯按：吊人線形發生在延伸性下降趨勢之後，K\
    \ 線稱為「錘子」（hammer），雖然線形結構完全相同，但線形名稱不同。\n\n## Airgas, Inc. (特殊化工，NYSE，代碼 ARG)\n\n\
    ![](img/157738047fa61d5e4bdbaf89f0241a36_40_0.png)\n\n圖 24.5 內側日與吊人線。針對這個內側日排列，老郭由紙上模擬交易獲利\
    \ $2,000。12 月中旬，價格走勢出現吊人線形。\n\n## 島狀反轉排列\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_42_0.png)\n\
    \n### 摘要資料\n\n- 頭部排列\n  - 外觀：價格向上跳空，經過幾天盤整，又在類似價位向下跳空，留下孤島狀的頭部。\n  - 反轉或整理：短期（少於\
    \ 3 個月）的空頭反轉排列。\n  - 失敗率：13%。\n  - 平均跌幅：21%，最經常發生漲幅低於 10%。\n  - 成交量趨勢：向下。\n  -\
    \ 回升：65%。\n  - 價格目標達成率：78%。\n\n### 底部排列\n\n- 外觀：價格向下跌空，經過幾天盤整，又在類似價位向上跳空，留下孤島狀的底部。\n\
    - 反轉或整理：短期（少於 3 個月）的多頭反轉排列。\n- 失敗率：17%。\n- 平均跌幅：34%，最經常發生跌幅低於 20%。\n- 成交量趨勢：向下。\n\
    - 回挫：70%。\n- 價格目標達成率：85%。\n\n島狀反轉排列（island reversals）的績效沒有預期理想，這點讓我覺得相當訝異。頭部與底部排列的失敗率都還算不錯，分別為\
    \ 13% 與 17%，低於我認爲可靠排列所允許發生的最高門檻 20%。\n\n頭部排列的平均跌幅爲 21%，稍優於一般空頭排列的平均水準（20%），但最經常發生跌幅不足\
    \ 10%。這或許意味著你不應該經常操作這個排列。底部排列的平均漲幅爲 34%，稍低於一般多頭排列的平均漲幅（40%）；最經常發生漲幅爲 20%，大約類似於一般多頭排列的水準。\n\
    \n回升（pullbacks）與回挫（throwbacks）走勢經常發生，意味著島狀發生之後的跳空缺口很快就被填補。投資人可以運用這項特性，在回升或回挫走勢完成之後，才順著突破方向建立部位。\n\
    \n## 緣起\n\n圖 25.1 顯示島狀反轉排列的形狀。最左側的島狀排列屬於單日反轉（one-day reversal）。在島狀排列的統計分析中，我沒有納入如此短暫的案例，但目前這個例子確實是一個有效的反轉型態，其中的島狀底部由單一線形構成。9\
    \ 月中旬，走勢向下跳空，10 月初創新低價，價格向上反轉之後，11 月初發生向上跳空缺口。請注意，9 月中旬與 11 月初的兩個缺口都發生在相同價位 $11\\\
    frac{1}{2}$。11 月初的跳空缺口發生之後，出現一波非常凌厲的漲勢，在 $21\\frac{1}{4}$ 創峰值，這個價位遠高於缺口前一天的收盤價\
    \ $11\\frac{1}{4}$。請注意，A 點的突破缺口爆出大量。2 月上旬到中旬之間，出現一個島狀頭部排列，價格由 $20 之上挫跌到 $8 以下。就傳統技術分析的觀點判斷，這是一個典型的島狀反轉排列，因為排列非常簡潔。可是，我沒有把這個例子納入統計分析中，因為右側的向下跳空缺口太小（不足\
    \ 1/4 點）。雖說如此，這個頭部反轉排列顯示的時效還是非常精確。請注意，圖形中有一個未經標示的超大型島狀頭部排列，起點的向上跳空缺口發生在 1991 年\
    \ 11 月初（標示為 A 點），排列完成的向下跳空缺口發生在 1992 年 6 月中旬（標示為 B 點），島狀部分幾乎涵蓋 8 個月的走勢。\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_44_0.png)\n\
    \n圖 25.1 單日反轉的島狀底部與頸部排列。排列完成之後，發生明顯的趨勢變動。\n\n## 辨識準則\n\n島狀反轉型態很容易辨識，表 25.1 列示相關的排列特質。不論頭部或底部排列，起點與終點都是價格跳空缺口。起點的缺口通常屬於竭盡缺口（如果走勢非常強勁的話，也可能是突破缺口；譯按：請參考圖\
    \ 25.2 的最後一個頭部排列），終點的缺口是突破缺口。兩個缺口所處的價位通常很接近，但缺口的大小經常不同。前一節討論的超大型島狀頭部就是典型的例子（參考圖\
    \ 25.1）。B 點的缺口將近 5 點，A 點的缺口只有 3/8 點。\n\n就型態辨識的角度而言，發生在 1991 年 12 份中旬的缺口（圖 25.1\
    \ 的 C 點）不應該與 10 月底的缺口（A 點）配對，因爲兩個缺口發生在全然不同的價位。即使價格排列看起來像是由缺口隔開的島狀，但不符合島狀反轉的傳統定義。兩個缺口必須相當接近，大致上彼此重疊。在目前這份統計研究報告中，隔開島狀部分的每個缺口寬度至少必須是\
    \ 1/4 點以上，兩個缺口的價格差異不得超過 1/8 點。另外，此處不納入單日反轉（島狀部分由單一線形構成），因爲很難針對這種排列擬定交易策略。\n\n\
    請參考圖 25.2 提供的一些島狀排列的例子。最初兩個案例屬於下降趨勢的頭部連續排列。島狀部分只涵蓋 1 個星期左右，整理結束之後，價格恢復下降趨勢。\n\n\
    ## Ann Taylor（特殊零售，NYSE，代码 ANN）\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_47_0.png)\n\
    \n圖 25.2 數個島狀排列的案例，排列期間有些很短，有些很長。排列完成之後，發生明顯的趨勢變動。請參考 1991 年 10 月底到 1992 年 2 月初的島狀底排列，島狀部分也是複雜頭肩底。\n\
    \n第三個例子屬於島狀底部反轉排列，型態發生在一段延伸性跌勢之後；不到 5 個月的期間內，價格由高點 $36\\frac{1}{2}$ 下跌到 $12。1991\
    \ 年 10 月底的竭盡缺口成交量很大，當天的線形很長，價格區間長達 3¼點\\*。1992 年 1 月底發生向上突破缺口之前，排列起點的竭盡缺口一直沒有被填補。請留意這個底部排列的島狀部分，形狀看起來是一個複雜頭肩底。請參考圖\
    \ 25.2 的標示，左肩與右肩各有兩個，「頭」也有兩個。整個成交量發展也符合複雜頭肩底的標準型態：左肩成交量最大，「頭」部稍微縮小，右肩成交量最小。一直到排列透過跳空缺口向上突破之後，成交量才連續放大\
    \ 2 天，然後又恢復下降趨勢。\n\n> \\* 譯按：這應該是指「真實價格區間」而言，目前這個線形是由當天的低價衡蓋到前一天線形的低價（換言之，包括跳空缺口在內）。\n\
    \n圖 25.2 最右側的島狀頭部排列有點難以辨識，因爲型態起點的跳空缺口很寬，但型態完成的跳空缺口很小。1992 年 2 月初發生向上跳空缺，複雜頭肩底排列完成之後，價格漲勢只維持幾天就到達峰位，然後開始向下滑動。當\
    \ 3 月底發生向下跳空缺口，成交量沒有顯著放大，這可能意味著盤勢轉弱，結果價格一年之內再也沒有創新高。\n\n## 失敗案例\n\n排列失敗可能發生在很多情況下。請參考圖\
    \ 25.3 的大型島狀頭部排列。這個案例相當不尋常，因爲島狀頭部型態發生之前，價格處在橫向盤整走勢中，不是應該發生的上升趨勢。島狀頭部起點的缺口，屬於突破缺口，價格由此脫離橫向整理走勢，當時出現顯著的成交量，價格迅速走高。島狀型態完成的缺口，屬於竭盡缺口，很快被填補。\n\
    \n圖 25.3 是一個 5% 失敗案例。當走勢向下跳空而完成島狀型態之後，價格確實下跌，但跌幅沒有超過 5%，接著又向上反轉。這個例子爲什麼會出現 5%\
    \ 失敗情況呢？股價走勢遵循一種共通法則——姑且稱之如此，因爲沒有更適當的名稱——反轉的幅度頂多是先前反向走勢的幅度。換言之，反轉需要可供反轉的走勢。請參考圖\
    \ 25.3，在島狀頭部排列發生之前，股價處在橫向盤整走勢中，完全缺乏可供反轉的條件。價格藉由向上跳空缺口脫離盤整區之後，由 12 月份到 2 月份之間，股價從\
    \ $55 上漲到 $65 左右。接著，由 2 月中旬到 4 月底之間，股價又逐漸下跌；當向下跳空缺口發生而島狀頭部完成之後，走勢已經不具備繼續下跌的條件，因爲當時已經處在先前起漲位置的橫向盤整底部。反轉必須存在可供反轉的走勢。建立股票部位之前，務必記住這個觀念，尤其是島狀排列這類績效不特別顯著的型態。\n\
    \n![](img/157738047fa61d5e4bdbaf89f0241a36_49_0.png)\n\n圖 25.3 失敗的島狀頭部排列。島狀排列完成之後，沒有出現\
    \ 5% 以上的跟進跌勢。反轉型態發生之前，必須存在可供反轉的走勢。\n\n## McDermott International（油田服務 / 設備，NYSE，代碼\
    \ MDR）\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_50_0.png)\n\n**圖 25.4 失敗的島狀底部排列。**\
    \ 價格向上跳空，島狀排列完成之後，沒有出現 5% 以上的跟漲漲勢。就目前這個案例來說，實際進場買進之前，應該等待價格穿越下降趨勢線。\n\n圖 25.4\
    \ 是另一個失敗案例。這個島狀底部排列在價格走勢圖上看起來很清楚。島狀部分的前、後被兩個跳空缺口隔離。整個排列的發展過程中，導致型態完成的向上跳空缺口在隨後\
    \ 的回挫走勢中被填補，但型態起點的向下跳空缺口在這個時候 還沒有被填補。價格填補向上跳空缺口之後，繼續朝下發展。\n\n這個島狀底部排列完成之後，怎麼知道價格在發生\
    \ 5% 漲勢之前就會反轉下跌？由於可能發生回挫走勢，這個問題顯然不太恰當。對於島狀底部排列來說，70% 的案例在型態完成之後出現回挫走勢。發生頻率很高，投資人往往可以等待回挫走勢；當價格下跌而填補向上跳空缺口之後，一旦開始恢復漲勢，立即買進股票（當然，這是假定回挫走勢沒有繼續下跌）。\n\
    \n在圖 25.4 的例子中，回挫走勢沒有恢復漲勢，反而繼續下跌；一旦價格跌破島狀排列的底部，型態即告失敗。如果投資人足夠謹慎的話，就不會陷入這個失敗走勢內。\n\
    \n為什麼？難道有什麼徵兆顯示這個島狀底部排列可能失敗嗎？沒錯。請考慮 8 月初峰位之後的下跌走勢，繪製一條直線銜接波段反彈高點，這條直線稱為下降趨勢線。只要下降趨勢沒有變化，價格就不能穿越這條下降趨勢線。由另一個角度說，如果島狀底部排列確實能夠造成趨勢向上反轉，那麼價格走勢就應該能夠克服下降趨勢線。\n\
    \n所以，投資人買進股票之前，應該等待收盤價穿越下降趨勢線。在圖 25.4 中，島狀底部排列完成之後，價格頂多上漲到 C 點，並沒有穿越下降趨勢線。繪製下降趨勢線的時候，即使錯誤地銜接\
    \ A 點與 B 點，C 點也只是盤中價格穿越下降趨勢線，收盤價並沒有穿越。\n\n## 統計數據\n\n表 25.2 顯示島狀反轉排列的一般統計數據。我由全部\
    \ 500 支股票的 5 年走勢中，找到 245 個頭部排列與 278 個底部排列。失敗率相當不錯，頭部與底部排列分別爲 13% 與 17%，都低於我認爲可靠排列的最高門檻水準\
    \ 20%。\n\n### 表 25.2 島狀反轉排列的一般統計數據\n\n| 說明 | 頭部 | 底部 |\n| :--- | :--- | :--- |\n\
    | 排列數量： | | |\n| 1991 年~1996 年的 52 支股票，每支股票樣本數量不超過 10 個 | 245 個 | 278 個 |\n| 失敗率\
    \ | 32/245 或 13% | 46/278 或 17% |\n| 成功排列的平均跌幅 / 漲幅 | 21% | 34% |\n| 最經常發生跌幅 /\
    \ 漲幅 | 10% 或以下 | 20% |\n| 成功排列的目標價位達成率 | 166/213 或 78% | 198/232 或 85% |\n| 完成排列的平均時間\
    \ | 40 天 | 31 天 |\n| 成交量呈現下降趨勢的成功排列 | 188/245 或 77% | 205/278 或 74% |\n\n平均跌幅（21%）與漲幅（34%）大體上類似於一般空頭與多頭排列的常態水準（分別為\
    \ 20% 與 40%）。雖然島狀底部排列的績效稍嫌不足，但真正令人擔憂的是排列的最經常發生跌幅與漲幅。頭部排列的最經常發生跌幅為 10% 或以下，底部排列的最經常發生漲幅為\
    \ 20% 或以下。請參考圖 25.5 與 25.6 的次數分配圖。次數分配提供的最經常發生跌幅或漲幅（圖 25.5 與 25.6 的最高欄位），可以避免平均跌幅或漲幅受到重大離群值的扭曲。\n\
    \n圖 25.5 顯示島狀頭部排列的最經常發生跌幅低於 10%。在所有的頭部案例中，跌幅低於 20% 的排列幾乎佔 60%。這些數據告訴我們：在多頭市場中，對於島狀頭部排列的預期不\n"
  mdcn: "\n接著，我考慮內側日收盤價落在前一天價格區間的位置，對於排列的突破方向是否具備預測意義？內側日收盤價位在前一天價格區間上端 25% 之內，這類排列有\
    \ 58% 向上突破，這與隨機事件（發生機率 50%）相差不多*。關於向下突破，情況要好得多。內側日收盤價位在前一天價格區間下端 25% 之內，其中有 70%\
    \ 的排列向下突破。所以，如果某個內側日收盤價落在前一天最低價附近，該排列很可能向下突破。\n\n內側日是否導致隔天的價格區間擴大？內側日前一天的價格區間平均為\
    \ $1.05，內側日當天的價格區間縮小為 $0.47，內側日隔天的平均價格區間又放大為 $0.64。根據次數分配的數據顯示，有 44% 的案例在內側日隔天出現相等或較小的價格區間。由另一個角度說，內側日隔天有\
    \ 56% 的機會發生較大的價格區間。\n\n表 24.3 的最後一項意外發現，乃處理兩支線形價格區間比率與排列績效之間的關係。對於每個內側日案例，我衡量內側日前一天的價格區間長度，把它除以内側日當天的價格區間長度，然後評估這項比率與最終漲幅（跌幅）之間的關係。按照相關散佈圖的資料顯示，價格區間比率愈小，排列績效愈理想（請參考圖\
    \ 24.4）。對於向上突破與向下突破的兩份圖形，\n\n> \\* 譯按：請參考第 516 頁的註腳說明，不應該把發生機率為 50% 的任何事件一律視為隨機事件。譯者認為比較合理的處理方法應該如下。分別考慮一般交易日與內側日收盤價位在前一天價格區間上端\
    \ 25% 之內，計算兩者向上突破的機率分配。然後透過統計方法檢定兩者的機率是否存在統計上的顯著差異。事實上，表 24.3 的問題都應該由這個角度處理：考慮內側日與一般交易日之間的差異。\n\
    \n![](img/157738047fa61d5e4bdbaf89f0241a36_37_0.png)\n\n圖 24.4 價格區間百分率與最終跌幅的散佈圖\
    \ 縱軸代表內側日前一天價格區間除以內側日當天價格區間的百分率讀數，橫軸代表內側日向下突破之後的跌幅。這份相關散佈圖顯示，價格比率愈小，排列的績效愈佳。\n\
    \n此處只提供關係比較顯著的一份；換言之，向下突破的內側日。\n\n乍看之下，圖 24.4 似乎只是一些隨機散佈的黑點。可是，稍微仔細觀察，你就可以發現其中的關係：價格區間比率愈小，排列的績效愈好。換言之，圖形下半部向右延伸的黑點，數量超過圖形左半部向上延伸的黑點。向上突破的散佈圖也呈現相同的關係，只是效果比較不顯著罷了。\n\
    \n為什麼會呈現這種關係呢？這類似於等腰三角形排列的情況。這些排列都類似於螺旋彈簧（coils），不斷壓縮之後突然放開，價格將向上或向下暴衝。內側日型態相當於\
    \ 2 支線形構成的三角形排列。\n\n這部分是考慮內側日與其前一天的價格區間比率。如果造成真正影響的是排列高度，那又怎麼呢？高度較小的排列，續效是否優於高度較大者？如果考慮排列高度，情況剛好相反：向下突破的散佈圖，基本上呈現隨機的關係；可是，向上突破的散佈圖則顯示，排列高度愈小，續效稍微優於排列較大者，雖然這種排列高度與續效之間的關係並不顯著。所謂「排列高度」，這是指內側日前一天線形的高度（由盤中高價衡量到盤中低價的長度）。如果考慮內側日當天——而不是前一天的線形，則排列高度與（向上或向下突破）續效之間基本上是呈現隨機關係。\n\
    \n## 交易戰術\n\n如果不準備涉及隨機漫步理論，或討論明天股價上漲的機率是否是 50%，恐怕就沒有什麼交易戰術可言，內容當然更難填滿一份表格。如果讀者還需要一些陳腔濫調的建議，那我只好勉強提出一點：如果你準備針對內側日進行操作，就順著趨勢方向交易。等待收盤價向上或向下突破內側日的頭部或底部。如果向上突破，就買進股票；如果向下突破，就放空股票。然後，找一間你認為最靈的廟，燒三柱清香，請佛祖或老天爺保佑！\n\
    \n我在「統計數據」一節中曾經簡單提到下列兩項建議。\n\n績效最佳的向上突破內側日排列，通常發生在年度價格區間三等份的下線（平均漲幅為 27%，遠高於不特別考慮排列發生位置的平均績效\
    \ 13%）。至於向下突破，不論內側日發生在年度價格區間的哪個位置，績效都沒有太大的差異。請留意內側日當天的成交量。小量的向上突破內側日與大量的向下突破內側日，排列績效通常比較理想。關於這兩項建議的詳細資料，請參考表\
    \ 24.2 與「統計數據」一節的討論。\n\n## 交易範例\n\n老郭在公家銀行有一份穩當的工作，但閒暇時間經常從事股票的紙上模擬操作，希望有一天能夠成為專業的部位交易者。當他看見圖\
    \ 24.5 的內側日，決定由空方進行紙上交易。由於內側日當天以最低價收盤，而且該收盤價又深入前一天線形下端的 25% 位置，這意味著股票隨後將發生重大跌勢——至少根據老郭的判斷是如此。內側日的隔天，他放空股票，假定成交價格是\
    \ $14\\frac{1}{2}$。\n\n正如同預期中的情況一樣，內側日隔天的價格以最低檔收盤，但隨後三天都呈現橫向盤旋的走勢，甚至稍微走高。就當老郭準備回補出場之前，股票向下反轉，出現重大的跌勢。三天之後，股價跌破\
    \ $13，1,000 股的空頭部位已經取得相當不錯的未實現獲利。\n\n然後，股票出現強勁的單日反彈（圖 24.5 標示 A 點的位置），但老郭白天上班，沒有時間查閱股價走勢，一直到收盤之後，他才曉得當天的盤勢。老郭沿著近來的下跌走勢上線，繪製一條下降趨勢線，發現\
    \ A 點的單日反彈只不過稍微穿越趨勢線，未必構成有效的突破，但還是可能意味著趨勢即將向上反轉。隔天，當老郭還在三心兩意不知道是否應該回補股票的時候，價格又開始下跌。\n\
    \n由於實在難以決定，老郭決定投擲銅板，結果他繼續持有空頭部位。當天交易結束的時候，股價確實收低，重新跌破下降趨勢線。可是，老郭認為當天的發展純屬運氣，決定股票收盤價如果再度向上穿越下降趨勢線，就回補空頭部位。\n\
    \n老郭每天都按時更新走勢圖，密切觀察股價發展。12 月中旬，在一支吊人線形之後*，收盤價向上買穿趨勢線，老郭認為這已經是出場的恰當時機。他回補股票，假定成交價格為\
    \ $12^{7/16}$，每股獲利大約是 $2。他非常不屑地想著：「股票交易實在很簡單。」\n\n> \\* 譯按：吊人線形發生在延伸性下降趨勢之後，K\
    \ 線稱為「錘子」（hammer），雖然線形結構完全相同，但線形名稱不同。\n\n## Airgas, Inc. (特殊化工，NYSE，代碼 ARG)\n\n\
    ![](img/157738047fa61d5e4bdbaf89f0241a36_40_0.png)\n\n圖 24.5 內側日與吊人線。針對這個內側日排列，老郭由紙上模擬交易獲利\
    \ $2,000。12 月中旬，價格走勢出現吊人線形。\n\n## 島狀反轉排列\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_42_0.png)\n\
    \n### 摘要資料\n\n- 頭部排列\n  - 外觀：價格向上跳空，經過幾天盤整，又在類似價位向下跳空，留下孤島狀的頭部。\n  - 反轉或整理：短期（少於\
    \ 3 個月）的空頭反轉排列。\n  - 失敗率：13%。\n  - 平均跌幅：21%，最經常發生漲幅低於 10%。\n  - 成交量趨勢：向下。\n  -\
    \ 回升：65%。\n  - 價格目標達成率：78%。\n\n### 底部排列\n\n- 外觀：價格向下跌空，經過幾天盤整，又在類似價位向上跳空，留下孤島狀的底部。\n\
    - 反轉或整理：短期（少於 3 個月）的多頭反轉排列。\n- 失敗率：17%。\n- 平均跌幅：34%，最經常發生跌幅低於 20%。\n- 成交量趨勢：向下。\n\
    - 回挫：70%。\n- 價格目標達成率：85%。\n\n島狀反轉排列（island reversals）的績效沒有預期理想，這點讓我覺得相當訝異。頭部與底部排列的失敗率都還算不錯，分別為\
    \ 13% 與 17%，低於我認爲可靠排列所允許發生的最高門檻 20%。\n\n頭部排列的平均跌幅爲 21%，稍優於一般空頭排列的平均水準（20%），但最經常發生跌幅不足\
    \ 10%。這或許意味著你不應該經常操作這個排列。底部排列的平均漲幅爲 34%，稍低於一般多頭排列的平均漲幅（40%）；最經常發生漲幅爲 20%，大約類似於一般多頭排列的水準。\n\
    \n回升（pullbacks）與回挫（throwbacks）走勢經常發生，意味著島狀發生之後的跳空缺口很快就被填補。投資人可以運用這項特性，在回升或回挫走勢完成之後，才順著突破方向建立部位。\n\
    \n## 緣起\n\n圖 25.1 顯示島狀反轉排列的形狀。最左側的島狀排列屬於單日反轉（one-day reversal）。在島狀排列的統計分析中，我沒有納入如此短暫的案例，但目前這個例子確實是一個有效的反轉型態，其中的島狀底部由單一線形構成。9\
    \ 月中旬，走勢向下跳空，10 月初創新低價，價格向上反轉之後，11 月初發生向上跳空缺口。請注意，9 月中旬與 11 月初的兩個缺口都發生在相同價位 $11\\\
    frac{1}{2}$。11 月初的跳空缺口發生之後，出現一波非常凌厲的漲勢，在 $21\\frac{1}{4}$ 創峰值，這個價位遠高於缺口前一天的收盤價\
    \ $11\\frac{1}{4}$。請注意，A 點的突破缺口爆出大量。2 月上旬到中旬之間，出現一個島狀頭部排列，價格由 $20 之上挫跌到 $8 以下。就傳統技術分析的觀點判斷，這是一個典型的島狀反轉排列，因為排列非常簡潔。可是，我沒有把這個例子納入統計分析中，因為右側的向下跳空缺口太小（不足\
    \ 1/4 點）。雖說如此，這個頭部反轉排列顯示的時效還是非常精確。請注意，圖形中有一個未經標示的超大型島狀頭部排列，起點的向上跳空缺口發生在 1991 年\
    \ 11 月初（標示為 A 點），排列完成的向下跳空缺口發生在 1992 年 6 月中旬（標示為 B 點），島狀部分幾乎涵蓋 8 個月的走勢。\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_44_0.png)\n\
    \n圖 25.1 單日反轉的島狀底部與頸部排列。排列完成之後，發生明顯的趨勢變動。\n\n## 辨識準則\n\n島狀反轉型態很容易辨識，表 25.1 列示相關的排列特質。不論頭部或底部排列，起點與終點都是價格跳空缺口。起點的缺口通常屬於竭盡缺口（如果走勢非常強勁的話，也可能是突破缺口；譯按：請參考圖\
    \ 25.2 的最後一個頭部排列），終點的缺口是突破缺口。兩個缺口所處的價位通常很接近，但缺口的大小經常不同。前一節討論的超大型島狀頭部就是典型的例子（參考圖\
    \ 25.1）。B 點的缺口將近 5 點，A 點的缺口只有 3/8 點。\n\n就型態辨識的角度而言，發生在 1991 年 12 份中旬的缺口（圖 25.1\
    \ 的 C 點）不應該與 10 月底的缺口（A 點）配對，因爲兩個缺口發生在全然不同的價位。即使價格排列看起來像是由缺口隔開的島狀，但不符合島狀反轉的傳統定義。兩個缺口必須相當接近，大致上彼此重疊。在目前這份統計研究報告中，隔開島狀部分的每個缺口寬度至少必須是\
    \ 1/4 點以上，兩個缺口的價格差異不得超過 1/8 點。另外，此處不納入單日反轉（島狀部分由單一線形構成），因爲很難針對這種排列擬定交易策略。\n\n\
    請參考圖 25.2 提供的一些島狀排列的例子。最初兩個案例屬於下降趨勢的頭部連續排列。島狀部分只涵蓋 1 個星期左右，整理結束之後，價格恢復下降趨勢。\n\n\
    ## Ann Taylor（特殊零售，NYSE，代码 ANN）\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_47_0.png)\n\
    \n圖 25.2 數個島狀排列的案例，排列期間有些很短，有些很長。排列完成之後，發生明顯的趨勢變動。請參考 1991 年 10 月底到 1992 年 2 月初的島狀底排列，島狀部分也是複雜頭肩底。\n\
    \n第三個例子屬於島狀底部反轉排列，型態發生在一段延伸性跌勢之後；不到 5 個月的期間內，價格由高點 $36\\frac{1}{2}$ 下跌到 $12。1991\
    \ 年 10 月底的竭盡缺口成交量很大，當天的線形很長，價格區間長達 3¼點\\*。1992 年 1 月底發生向上突破缺口之前，排列起點的竭盡缺口一直沒有被填補。請留意這個底部排列的島狀部分，形狀看起來是一個複雜頭肩底。請參考圖\
    \ 25.2 的標示，左肩與右肩各有兩個，「頭」也有兩個。整個成交量發展也符合複雜頭肩底的標準型態：左肩成交量最大，「頭」部稍微縮小，右肩成交量最小。一直到排列透過跳空缺口向上突破之後，成交量才連續放大\
    \ 2 天，然後又恢復下降趨勢。\n\n> \\* 譯按：這應該是指「真實價格區間」而言，目前這個線形是由當天的低價衡蓋到前一天線形的低價（換言之，包括跳空缺口在內）。\n\
    \n圖 25.2 最右側的島狀頭部排列有點難以辨識，因爲型態起點的跳空缺口很寬，但型態完成的跳空缺口很小。1992 年 2 月初發生向上跳空缺，複雜頭肩底排列完成之後，價格漲勢只維持幾天就到達峰位，然後開始向下滑動。當\
    \ 3 月底發生向下跳空缺口，成交量沒有顯著放大，這可能意味著盤勢轉弱，結果價格一年之內再也沒有創新高。\n\n## 失敗案例\n\n排列失敗可能發生在很多情況下。請參考圖\
    \ 25.3 的大型島狀頭部排列。這個案例相當不尋常，因爲島狀頭部型態發生之前，價格處在橫向盤整走勢中，不是應該發生的上升趨勢。島狀頭部起點的缺口，屬於突破缺口，價格由此脫離橫向整理走勢，當時出現顯著的成交量，價格迅速走高。島狀型態完成的缺口，屬於竭盡缺口，很快被填補。\n\
    \n圖 25.3 是一個 5% 失敗案例。當走勢向下跳空而完成島狀型態之後，價格確實下跌，但跌幅沒有超過 5%，接著又向上反轉。這個例子爲什麼會出現 5%\
    \ 失敗情況呢？股價走勢遵循一種共通法則——姑且稱之如此，因爲沒有更適當的名稱——反轉的幅度頂多是先前反向走勢的幅度。換言之，反轉需要可供反轉的走勢。請參考圖\
    \ 25.3，在島狀頭部排列發生之前，股價處在橫向盤整走勢中，完全缺乏可供反轉的條件。價格藉由向上跳空缺口脫離盤整區之後，由 12 月份到 2 月份之間，股價從\
    \ $55 上漲到 $65 左右。接著，由 2 月中旬到 4 月底之間，股價又逐漸下跌；當向下跳空缺口發生而島狀頭部完成之後，走勢已經不具備繼續下跌的條件，因爲當時已經處在先前起漲位置的橫向盤整底部。反轉必須存在可供反轉的走勢。建立股票部位之前，務必記住這個觀念，尤其是島狀排列這類績效不特別顯著的型態。\n\
    \n![](img/157738047fa61d5e4bdbaf89f0241a36_49_0.png)\n\n圖 25.3 失敗的島狀頭部排列。島狀排列完成之後，沒有出現\
    \ 5% 以上的跟進跌勢。反轉型態發生之前，必須存在可供反轉的走勢。\n\n## McDermott International（油田服務 / 設備，NYSE，代碼\
    \ MDR）\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_50_0.png)\n\n**圖 25.4 失敗的島狀底部排列。**\
    \ 價格向上跳空，島狀排列完成之後，沒有出現 5% 以上的跟漲漲勢。就目前這個案例來說，實際進場買進之前，應該等待價格穿越下降趨勢線。\n\n圖 25.4\
    \ 是另一個失敗案例。這個島狀底部排列在價格走勢圖上看起來很清楚。島狀部分的前、後被兩個跳空缺口隔離。整個排列的發展過程中，導致型態完成的向上跳空缺口在隨後\
    \ 的回挫走勢中被填補，但型態起點的向下跳空缺口在這個時候 還沒有被填補。價格填補向上跳空缺口之後，繼續朝下發展。\n\n這個島狀底部排列完成之後，怎麼知道價格在發生\
    \ 5% 漲勢之前就會反轉下跌？由於可能發生回挫走勢，這個問題顯然不太恰當。對於島狀底部排列來說，70% 的案例在型態完成之後出現回挫走勢。發生頻率很高，投資人往往可以等待回挫走勢；當價格下跌而填補向上跳空缺口之後，一旦開始恢復漲勢，立即買進股票（當然，這是假定回挫走勢沒有繼續下跌）。\n\
    \n在圖 25.4 的例子中，回挫走勢沒有恢復漲勢，反而繼續下跌；一旦價格跌破島狀排列的底部，型態即告失敗。如果投資人足夠謹慎的話，就不會陷入這個失敗走勢內。\n\
    \n為什麼？難道有什麼徵兆顯示這個島狀底部排列可能失敗嗎？沒錯。請考慮 8 月初峰位之後的下跌走勢，繪製一條直線銜接波段反彈高點，這條直線稱為下降趨勢線。只要下降趨勢沒有變化，價格就不能穿越這條下降趨勢線。由另一個角度說，如果島狀底部排列確實能夠造成趨勢向上反轉，那麼價格走勢就應該能夠克服下降趨勢線。\n\
    \n所以，投資人買進股票之前，應該等待收盤價穿越下降趨勢線。在圖 25.4 中，島狀底部排列完成之後，價格頂多上漲到 C 點，並沒有穿越下降趨勢線。繪製下降趨勢線的時候，即使錯誤地銜接\
    \ A 點與 B 點，C 點也只是盤中價格穿越下降趨勢線，收盤價並沒有穿越。\n\n## 統計數據\n\n表 25.2 顯示島狀反轉排列的一般統計數據。我由全部\
    \ 500 支股票的 5 年走勢中，找到 245 個頭部排列與 278 個底部排列。失敗率相當不錯，頭部與底部排列分別爲 13% 與 17%，都低於我認爲可靠排列的最高門檻水準\
    \ 20%。\n\n### 表 25.2 島狀反轉排列的一般統計數據\n\n| 說明 | 頭部 | 底部 |\n| :--- | :--- | :--- |\n\
    | 排列數量： | | |\n| 1991 年~1996 年的 52 支股票，每支股票樣本數量不超過 10 個 | 245 個 | 278 個 |\n| 失敗率\
    \ | 32/245 或 13% | 46/278 或 17% |\n| 成功排列的平均跌幅 / 漲幅 | 21% | 34% |\n| 最經常發生跌幅 /\
    \ 漲幅 | 10% 或以下 | 20% |\n| 成功排列的目標價位達成率 | 166/213 或 78% | 198/232 或 85% |\n| 完成排列的平均時間\
    \ | 40 天 | 31 天 |\n| 成交量呈現下降趨勢的成功排列 | 188/245 或 77% | 205/278 或 74% |\n\n平均跌幅（21%）與漲幅（34%）大體上類似於一般空頭與多頭排列的常態水準（分別為\
    \ 20% 與 40%）。雖然島狀底部排列的績效稍嫌不足，但真正令人擔憂的是排列的最經常發生跌幅與漲幅。頭部排列的最經常發生跌幅為 10% 或以下，底部排列的最經常發生漲幅為\
    \ 20% 或以下。請參考圖 25.5 與 25.6 的次數分配圖。次數分配提供的最經常發生跌幅或漲幅（圖 25.5 與 25.6 的最高欄位），可以避免平均跌幅或漲幅受到重大離群值的扭曲。\n\
