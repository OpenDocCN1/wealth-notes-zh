    在偏低的 **最經常發生跌幅 10%**。10% 跌幅代表的距離通常都小於排列高度。關於目標價位的衡量方法，細節部分請參考「交易戰術」一節。


    排列的 **平均長度** 大約是 110 天，足以顯示在週線上。評估股價走勢或擬定交易策略，最好同時參照不同時間架構的資料。


    如同三重底排列一樣，三重頂排列三個峰值彼此之間的時間距離大約相同，分別為 56 天與 55 天。可是，這是就全部案例的峰位平均距離而言，個別排列未必具有這種性質，圖
    43.4 就是典型的例子。


    當價格由第三個峰位下跌，即構成潛在三重頂排列，唯有當價格實際跌破確認水準（三個峰位所夾兩個谷底的最底价），潛在排列才演變為真正的三重頂排列。由第三個峰位起算，價格平均需要耗費
    40 天才能突破確認水準。價格向下突破之後（排列完成），經常發生回升走勢。平均來說，大約有 84% 的排列在突破之後會折返確認點，回升走勢平均只需要 8 天就能完成。當我整理這方面的資料時，發現某些案例的回挫走勢只需要
    1、2 天。由於偶爾會發生這類快速的折返，使得整體排列的平均期間大幅縮短（一般頭部排列的回挫走勢平均需要 11 天）。由確認點（突破點）起算，價格平均需要經過
    101 天才能到達最終低點。


    如果把向下突破當時的最近 12 個月價格區間劃分為三等份（上緣、中央與下緣），三重頂突破點通常落在哪個區域？大多數排列的突破點落在下緣（48%）或中央（42%），只有
    11% 排列落在上緣。為什麼呢？雖然三重頂屬於頭部排列，通常落在年度價格區間的上緣，但因爲突破點是三重頂排列的低點，其位置通常會向下延伸到年度價格區間的中央或下緣。對於前述三個位置的排列，平均績效如何呢？排列突破點落在年度價格區間下緣的績效最理想，平均跌幅為
    24%，其次是中央（22%）與上緣（18%）。


    表 43.3 列示三重頂排列的成交量統計數據。成交量型態呈現下降趨勢的案例只占 58%，較純粹運氣（50%）沒有多大的差別。關於三個峰值本身的成交量，某些分析家認為第一個峰值的成交量最大，第二個與第三個峰值的成交量都持續減少。我發現，這種成交量型態只發生在
    25%的案例中，它們的平均跌幅為 19%，低於一般的三重頂排列。比較第二個與第三個峰值的成交量，第二個峰值成交量較大的排列平均跌幅為 23%，第三個峰值成交量較大的排列平均跌幅為
    19%；可是，兩者之間的差異並不具備統計上的顯著意義。


    相對於突破前一天，突破當天的成交量放大為 188%，隨後 5 天的成交量仍然偏高，但有逐漸縮小的趨勢。按照這些數據推論，價格一旦向下突破，買壓轉強，造成價格進一步下跌。


    ## 交易戰術


    表 43.4 列示三重頂排列的交易戰術，首先討論衡量法則。我們可以運用衡量法則，協助估計價格向下突破之後的目標價位。排列高度是以排列最高價減去最低價，然後由突破點（確認點）向下衡量排列高度，結果就是最低目標價位。不幸地，在三重頂排列的全部案例當中，達成都市目標價位的比率只有
    47%；換言之，大部分排列向下突破之後，價格都不能到達目標價位。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_404_0.png)


