    ![](img/157738047fa61d5e4bdbaf89f0241a36_142_1.png)


    圖 30.3 長管底排列的失敗案例。兩個案例之所以失敗的徵兆，包括線形向下突兀的程度與成交量型態。績效最佳的長管底排列，通常發生在價格下降趨勢的末端。


    排列內兩支線形向下延伸的程度必須異常。兩支線形向下突兀的長度，必須遠超過最近 1 年內向下突兀長線形的平均長度。由股價走勢圖上看起來，排列線形向下凸出的程度必須非常明顯，不只是到處可見的兩支向下突兀線形。另外，排列兩支線形的價格重疊部分很多。請參考圖
    30.2 的例子，兩支線形的低價相同，右側線形的高價稍高。請注意，對於長管底排列，你絕對不希望看見左側線形較長，右側線形顯著較短。


    排列兩支線形的成交量都應該超過正常水準，但這並不屬於必要條件。關於這兩支線形的各種成交量型態，我發現左側線形發生大量、右側線形發生小量的排列續效最理想。可是，我不會只基於成交量的理由而懷疑某個排列的有效性。


    最後一項辨識準則，或許可以視為總結。在股價走勢圖上，排列必須足夠凸顯。一般來說，型態之所以凸顯，經常是因為排列發生在下降趨勢的末端，構成向上反轉的樞紐點，類似如圖
    30.1 與 30.2 的例子。少數情況下，長管底排列可能是價格上升趨勢的連續排列。換言之，在既有的上升趨勢發展中，出現兩支向下突兀長線形的修正，整理走勢結束後，繼續恢復先前的上升趨勢。


    如果仔細觀察圖 30.2，應該可以發現另一個長管底排列（圖形中標示為 A 點）。這個型態或許不夠凸顯，隨後的漲勢也不夠大。排列右側線形的低價為$15^{3}/_{8}$，排列完成之後的高價為$18^{1}/_{8}$。如果以排列隔週的線形高價與低價平均值做為基準，衡量到最終高價（目前這個例子剛好是排列隔週的最高價），漲幅為
    5.5%，剛好避開 5%失敗的情況。


    ### 失敗案例


    長管底排列沒有所謂的突破點，所以不會向上突破失敗*。長管底排列只有 5%失敗的問題。換言之，在價格上漲幅度滿足 5%之前，趨勢提前向下反轉。圖 30.3 顯示兩個這類的失敗例子，分別發生在
    1993 年 4 月份與 5 月份。這兩個排列看起來都像是典型的長管底排列，但行為並不像。長管底排列出現之後，價格應該向上發展，但實際的結果卻下跌。為什麼？請注意兩個排列左側線形的成交量都低於
    25 天移動平均量，但右側線形的成交量都超過 25 天移動平均量。雖然成交量型態不夠標準，但並不足以解釋排列為何失敗。請對照圖形最左端的長管底排列，兩支線形的成交量都超過正常水準。


    預示著排列可能失敗的最重要徵兆，可能是向下線形的長度。請注意兩個失敗案例的線形，它們是否屬於整年度內最顯著向下突兀的線形？回顧排列發生之前，我們可以看到不少向下突兀的單週線形，例如：1992
    年 12 月份與 1993 年 2 月份，這些線形的長度都不輸給長管底排列的線形。事實上，整份走勢圖到處都是不同長度的突兀線形。基於這個理由，我們或許應該放棄這兩個排列。


    結束圖 30.3 的討論之前，或許應該運用其中一個不錯的例子，說明長管底排列的一項特質。由於這種排列經常發生在下降趨勢的末端，型態完成而經過一段漲勢之後，價格往往會下滑而重新測試長管底的支撐。請參考圖
    30.3 最左端的例子（發生在 1991 年 12 月初）。在此之前的 1991 年 10 月底，股價於$124\frac{1}{4}$做頭（圖形中沒有顯示），然後展開重挫走勢，6
    個星期之後到達長管底的低點$99^{1}/_{8}$。長管底排列完成之後，價格向上反彈，不久又下跌，於 3 月底再創新低$98^{1}/_{8}$，成功測試底部的支撐。


    所以，長管底排列似乎可以提供底部支撐。一般來說，回檔走勢都會在長管底下方的 1/2 點以內止跌，然後正式展開上漲行情。當然，前述的 1/2 點只是概略的說法，實際金額取決於股價水準（對於$100
    以上的高價股，股價可能回檔到長管底下方 1 點左右）。


    因此，即使你高價買進股票，看著價格下滑，但在股價跌破長管底的低點之前，不要輕易認賠賣出。我們稍後會詳細討論交易戰術。


    對於圖 30.3，讀者可能會提出一項質疑：1992 年 3、4 月份之間的排列為何不是長管底？答案與前述失敗案例相同，線形向下延伸的程度不夠長。相對於週遭的線形，這兩支線形向下突兀的程度不足以稱為長管底排列（另外，線形的成交量太小）。


    * 譯按：這種說法似乎有些混淆。對於成功的長管底排列，價格隨後不可能下跌，所以不可能成功向下突破；換言之，排列出現之後，只要價格下跌，就是失敗。另外，「排列出現」與「排列完成」代表相同意義。


    ## 統計數據


    表 30.2 列示長管底排列的一般統計數據。這種排列的案例數量實在太多（442 個），所以我只考慮資料庫內的 200 支股票（不是全部 500 支股票）。半數以上的排列（60%）屬於反轉型態，其餘屬於連續型態。失敗率很低，只有
    12%，我認為失敗率低於 20%就屬於可靠排列。總共有 52 個案例出現 5% 失敗情況；換言之，排列完成之後，在趨勢向下發展之前，沒有發生 5%或以上的漲勢。


    平均漲幅爲 47%，水準非常高。爲了保守起見，我利用長管底隔過線形之最高價與最低價的平均數做爲基準，由此向上衡量最終高點的報酬百分率。換言之，假定投資人在長管底排列完成之後的隔週買進，成交價格是該週價格區間的中點。


    **表 30.2 長管底排列的一般統計數據**


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量： | 442 個 |

    | 1991 年 ~ 1996 年的 200 支股票 | |

    | 反轉或整理排列 | 179 個整理，263 個反轉 |

    | 失敗率 | 52/442 相當於 12% |

    | 成功排列的平均漲幅 | 47% |

    | 最經常發生漲幅 | 20% |

    | 左側線形成交量相對於 25 天移動平均的水準 | 130% |

    | 右側線形成交量相對於 25 天移動平均的水準 | 117% |

    | 對於成功排列，到達最終高點的天數 | 9.5 個月（296 天） |


    我們利用排列漲幅的次數分配圖（請參考圖 30.4），藉以估計長管底的最經常發生漲幅。暫時忽略最右側的欄位，圖形顯示最初四個欄位的高度大約相同，其中以 20%
    的欄位最高，接下來是 30%與 40%。所以，最經常發生漲幅應該是 20%。另外，最右側漲幅超過 90%的欄位很高，使得平均數向上扭曲。如果考慮漲幅超過 50%的案例數量，總共有
    39%的排列漲幅超過 50%。相當不錯。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_145_0.png)


    圖 30.4 長管底排列的漲幅次數分配 最經常發生漲幅為 20%，但實際水準可能會被最右側的超高欄位推升。


    長管底左側線形與右側線形的平均成交量，分別是 25 天移動平均量的 130% 與 117%。換言之，左側線形成交量稍大，右側線形成交量稍微萎縮，但還是大於正常水準。


    排列完成之後，價格到達最終高點的平均期間為 296 天；大約對應其他排列的發展速度。當然，漲幅很小，發展的時間就很短；對於 47% 的平均漲幅，難免需要花費一番功夫。


    表 30.3 顯示一些不尋常的結果。我希望強調一點，篩選長管底排列案例的過程中，完全沒有運用這份表格的內容。因為我不希望發生「倒果為因」的情況。所以，我按照表
    30.1 的準則篩選適當的案例，然後尋找排列績效最佳的參數組合（我利用一組樣本藉以設定最佳參數，然後利用另一組樣本測試參數）。


    **表 30.3 長管底排列的一些統計數據**


    | 說明 | 平均漲幅<br>(%) | 失敗率<br>(%) |

    | :--- | :--- | :--- |

    | 基準 | 47 | 12 |

    | 線形低點存在差異的排列漲幅 | 49 | |

    | 線形低點不存在差異的排列漲幅 | 43 | |

    | 排列左側/右側線形低點較低的績效 | 左 50，右 47 | |

    | 右側線形屬於內側線形的漲幅 | 50 | |

    | 排列左側/右側/兩側線形<br>發生大成交量的績效 | 左 51，右 47，<br>兩側 51 | |

    | 排列左側/右側/兩側線形<br>發生小成交量的績效 | 左 42，右 47，<br>兩側 44 | |

    | 左側線形大成交量，右側小成交量 | 53 | 28 |

    | 右側線形大成交量，左側小成交量 | 40 | |

    | 線性迴歸價格趨勢：<br>3 個月上升 | 41 | |

    | 線性迴歸價格趨勢：<br>3 個月下降 | 51 | |

    | 特長線形（平均長度的 5 倍） | 58，33 個樣本 | 12 |

    | 特長線形（平均長度的 4 倍） | 55，62 個樣本 | 11 |

    | 左側線形大成交量，右側小成交量，<br>3 個月價格趨勢向下傾斜 | 52，28 個樣本 | 25 |


    基準的平均漲幅是 47%，這是以長管底隔週線形之最高價與最低價的平均數做為起點，衡量到最終高點的報酬百分率。換言之，假定投資人在長管底排列完成之後的隔週買進，然後在主要趨勢向下反轉之前賣出。如果把平均漲幅的衡量起點更改為長管底右側線形的低價，平均績效顯著提高為
    60%，最經常發生漲幅則介於 20%與 50%之間。


    按照表 30.1 的辨識準則，透過樣本篩選程序，大多數長管底排列中，兩支線形的低價都沒有差別或價差甚小。我把所有的樣本劃分為兩類，兩支線形低價相同或不同。低價不同的排列平均漲幅為
    49%，低價相同的排列平均漲幅為 43%。


    我們知道，排列兩支線形的低價不同，績效比較理想；可是，哪支線形的低價較低，績效最理想呢？左側線形低價較低的排列平均漲幅為 50%，右側線形低價較低的排列平均漲幅為
    47%。左側線形的低價較低，績效相對理想，但線形的高價又如何呢？我沒以徹底分析所有的可能組合，但曾經觀察右側線形為內側線形的結果。所謂「內側線形」是指該線形被前一支線形完全吞噬；換言之，該線形的低價高於前一支線形，但高價低於前一支線形。如果長管底右側線形為內側線形，排列的平均漲幅為
    50%。


    成交量對於排列績效的影響又如何呢？關於長管底排列的兩支線形，我考慮三種情況：左側線形的成交量、右側線形的成交量，以及兩支線形的成交量。關於大成交量，左側線形或兩支線形發生大成交量的排列績效較理想，平均漲幅都是
    51%；關於小成交量，右側線形發生小成交量的排列績效較理想，平均漲幅為 47%。


    我們知道，排列左側線形發生大量或右側線形發生小量，這兩種情況的績效都很不錯，但如果這兩種情況同時發生，績效又如何呢？平均漲幅為 53%，遠超過基準讀數 47%。如果情況剛好相反——排列左側線形發生小量，而且右側線形發生大量——那又如何呢？平均漲幅只有
    40%。


    尋找適當案例的過程中，我發現這種排列經常發生在價格下降趨勢的末端，所以我希望檢驗情況是否真是如此。我針對長管底排列發生之前的 3 個月收盤價時間序列進行迴歸分析，對於價格上升趨勢（換言之，迴歸直線的斜率為正數），排列的平均漲幅只有
    41%；對於價格下降趨勢，排列的平均漲幅為 51%。這意味著長管底排列發生之前，如果已經發生一段下降趨勢，型態的績效通常比較理想。換言之，長管底排列代表價格趨勢即將向上反轉的訊號。


    最後，我發現排列線形向下延伸的程度愈大，績效愈理想。所以，我衡量最近 1 年內所有向下突兀線形的平均長度；換言之，對於任何一支向下突兀長線形（該線形低價顯著低於之前與之後線形的低價），計算該線形與兩邊鄰近較低線形的低價差值，將此設定為該突兀線形的長度，然後計算最近
    1 年內所有向下突兀線形的平均長度。接下來，我比較前述平均長度與長管底線形長度（後者也是按照相同的觀念衡量）。如果規定長管底線形長度至少是前述平均長度的 5
    倍，排列的平均漲幅為 58% ，但總共只有 33 個符合條件的案例。如果把 5 倍改爲 4 倍，則有 62 個案例符合條件，但平均漲幅稍微下降爲 55% 。


    請注意，如果透過某種方法調整排列的參數，或許有助於平均漲幅，但失敗率也可能因此提高。表 30.3 顯示一些失敗率數據（留白部分代表沒有衡量）。舉例來說，假定考慮成交量的最佳組合——左側線形呈現大量，右側線形呈現小量——而且排列發生之前的
    3 個月價格趨勢朝下發展，這些型態的平均漲幅爲 51% （符合條件的案例只有 28 個），但失敗率上升爲 25% ，超過可靠排列所允許的最高水準 20% 。


    ## 交易戰術


    表 30.4 列舉長管底排列的交易戰術。長管底型態操作上最重要的特徵，可能發生在第 3 個星期。我們可以很輕易找到連續兩支向下的突兀長線形，當排列完成之後，如果隔週線形的價格沒有走高，就應該放棄這個排列。換言之，目標排列出現之後，隔週的線形必須讓排列的兩支線形顯著向下凸出。如果發生在價格下降趨勢末端，排列前一週線形、排列本身兩支線形與排列後一週線形，這
    4 支線形構成顯著的 V 狀排列。


    如同表 30.4 所描逃的，長管底排列通常發生在延伸性價格下降趨勢的末端，至少績效較佳的對象大多如此。價格持續下跌，然後發生長管底排列，走勢止跌反彈，並且開始向上攀升。圖
    30.1 與 30.2 都是這類的典型例子。


    **表 30.4 長管底排列的交易戰略**


    | 交易戰略 | 解釋 |

    | :--- | :--- |

    | 價格下降趨勢 | 績效表現最佳的長管底排列，大多發生在價格下降趨勢末端，或是上升走勢的回檔整理。 |

    | 買進 | 運用表 30.1 的準則，一旦辨識長管底排列之後，買進股票。 |

    | 停損 | 長管底排列具備支撐功能，但價格可能跌到長管底低點下方 1/2 點處，停損可以設在這個位置。價格攀升之後，停損點應該向上調整。 |

    | 留意回挫走勢 | 雖然不是真正的回挫走勢（此處採用週線圖，回挫走勢必須發生在 1 個月或以內），但價格可能拉回重新測試長管底排列的支撐，然後才正式展開漲勢。
    |


    一旦在週線圖上辨識長管底排列之後，就進場買進股票。請注意，股票展開正式的上升趨勢之前，可能重新探底，測試長管底排列的支撐，必須有這方面的心理準備。買進股票之後，停損點應該設定在長管底排列最低點下側
    1/2 點處（預留一些空間，防範走勢重新測試底部）。萬一停損遭到觸發，股價很可能繼續下跌。萬一碰到這種情況，立即認賠出場。


    ## 交易範例


    讓我們看看彼得如何處理長管底排列，或許可以因此而學習一些操作技巧。彼得是我見過最聰明的電腦軟體工程師之一。他

    不只非常聰明而已，也非常容易相處，唯有當工作壓力很大的

    時候，他才會顯得煩躁。在這種情況下，他會想辦法休息。可

    是，彼得紓解工作壓力的辦法與一般人不同，他喜歡進入股票

    市場。透過辦公室提供的網際網路設備，他可以在幾秒中之內

    就上線。1994 年 4 月初，他發現圖 30.5 的走勢，覺得相當有

    趣。這支股票由 1992 年 4 月份以來就呈現橫向走勢，彼得希

    望經過如此長期的打底過程，可以發展成為一波重大的漲勢。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_151_0.png)


    由短期的角度觀察，目前處在 1994 年 1 月中旬以來的下降趨勢末端。1994 年 4 月 4 日，股票創新低，當週的成交量也顯著放大。如果只是這支向下的突兀長線形，可能意昧著單週反轉的型態。可是，緊接著又發生另一支向下的突兀長線形，這支線形的低價為$38^{3}/_{8}$，沒有向下穿越前一支線形的低價
    ($38^{3}/_{8}$)。這兩支線形的向下延伸程度已經足以讓它們凸顯在走勢圖中，顯然也超過 3 月中旬的單週向下「突兀線形」。隔週，線形向上翻揚，留下顯著的長管底排列。該週即將結束的時候，彼得進場買進，成交價格為$42，停損設定在整數價位$38
    的下方 1 格處(換言之，$37^{7}/_{8}$)。停損之所以設定在$38，因爲整數價位經常可以提供支撐。


    進場之後，彼得對於股票的表现相當滿意。他知道，這波走勢是否能夠發展為一段大行情，真正的關鍵在於股價是否能夠克服過去 2 年期間的橫向盤整頭部$55%$ (交易區間的底部在$40\%$)。如果剔除
    3 個月的離群走勢，交易區間的頭部位在$49 附近。所以，$49 與$55%$是整個盤勢的關鍵所在。如果股價能夠向上穿越這兩個水準，就很可能繼續上揚。


    1994 年 6 月份，股價創$50%$的高價之後，6 月底出現明顯的跌勢，彼得知道這不是預期中的大行情。隨後 3 個月之內，股價呈現橫向整理，10 月份到年度之間又出現明顯的跌勢。彼得只能禱告，希望這波跌勢只不過重新測試長管底的支撐，不至於跌破
    2 年多來在$40 附近的大底部。


    譯按：該週的收盤價太低，不應該視為單週反轉。


    11 月底，股價又創$38⁵/₈ 的低價，剛好是先前長管底排列第二支線形的低價。然後，股價稍微回升。由於底部測試成功，彼得決定加碼買進。1995 年 2 月初，股價脫離底部盤整區間，走勢轉強，而且從此一路走高。


    股價幾乎維持直線狀的走勢，一直持續到 1996 年 4 月份的峰位$80³/₈，然後回檔。由於股價漲幅已經很大，理應回檔整理，所以彼得沒有立即賣出持股。可是，當股價下跌到$72
    的時候，他決定賣出。結果，股價跌到$69³/₄，然後又開始上升，而且繼續走高，彼得顯然賣得太早。雖說如此，這筆投資還是每股賺進$30，大約在 2 年的期間內，取得
    71% 的報酬。


    # 長管頂排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_155_0.png)


    ## 摘要資料


    - **外觀**：週線圖上，兩支連續向上的突兀長線形。

    - **反轉或整理**：短期（3個月以內）的空頭整理排列。

    - **失敗率**：18%。

    - **平均跌幅**：21%，最經常發生跌幅為10%~20%。

    - **意外發現**：排列發生之前，出現（至少）3個月的價格下降趨勢，績效最理想，平均跌幅為24%，失敗率為11%。

    - **參閱排列**：（23）雙角頂排列。

    '
  mdcn: '

    ![](img/157738047fa61d5e4bdbaf89f0241a36_139_0.png)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_139_1.png)


    週線圖上的長管底排列。A 點代表另一個長管底案例，結果比較不凸顯。


    間的價格差異很小，絕大部分案例（414 個，佔總案例的 94%）的低點價差維持在$0.25 之內。就圖 30.2 的例子來說，兩支線形的低點完全相同。


    連續兩個星期的突兀狀線形都很长，排列之前與之後的線形低價都落在長管狀排列的高價附近。這使得整個排列向下凸出，非常容易辨識。請參考圖 30.2 的例子，排列最高價為$12$^{9/16}$，最低價為$10$^{5/16}$，排列前一支線形的最低價為$11$^{5/8}$，排列後一支線形的最低價為$12$^{1/4}$，這兩個低價比較接近排列最高價，距離排列最低價顯然較遠。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_142_0.png)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_142_1.png)


    圖 30.3 長管底排列的失敗案例。兩個案例之所以失敗的徵兆，包括線形向下突兀的程度與成交量型態。績效最佳的長管底排列，通常發生在價格下降趨勢的末端。


    排列內兩支線形向下延伸的程度必須異常。兩支線形向下突兀的長度，必須遠超過最近 1 年內向下突兀長線形的平均長度。由股價走勢圖上看起來，排列線形向下凸出的程度必須非常明顯，不只是到處可見的兩支向下突兀線形。另外，排列兩支線形的價格重疊部分很多。請參考圖
    30.2 的例子，兩支線形的低價相同，右側線形的高價稍高。請注意，對於長管底排列，你絕對不希望看見左側線形較長，右側線形顯著較短。


    排列兩支線形的成交量都應該超過正常水準，但這並不屬於必要條件。關於這兩支線形的各種成交量型態，我發現左側線形發生大量、右側線形發生小量的排列續效最理想。可是，我不會只基於成交量的理由而懷疑某個排列的有效性。


    最後一項辨識準則，或許可以視為總結。在股價走勢圖上，排列必須足夠凸顯。一般來說，型態之所以凸顯，經常是因為排列發生在下降趨勢的末端，構成向上反轉的樞紐點，類似如圖
    30.1 與 30.2 的例子。少數情況下，長管底排列可能是價格上升趨勢的連續排列。換言之，在既有的上升趨勢發展中，出現兩支向下突兀長線形的修正，整理走勢結束後，繼續恢復先前的上升趨勢。


    如果仔細觀察圖 30.2，應該可以發現另一個長管底排列（圖形中標示為 A 點）。這個型態或許不夠凸顯，隨後的漲勢也不夠大。排列右側線形的低價為$15^{3}/_{8}$，排列完成之後的高價為$18^{1}/_{8}$。如果以排列隔週的線形高價與低價平均值做為基準，衡量到最終高價（目前這個例子剛好是排列隔週的最高價），漲幅為
    5.5%，剛好避開 5%失敗的情況。


    ### 失敗案例


    長管底排列沒有所謂的突破點，所以不會向上突破失敗*。長管底排列只有 5%失敗的問題。換言之，在價格上漲幅度滿足 5%之前，趨勢提前向下反轉。圖 30.3 顯示兩個這類的失敗例子，分別發生在
    1993 年 4 月份與 5 月份。這兩個排列看起來都像是典型的長管底排列，但行為並不像。長管底排列出現之後，價格應該向上發展，但實際的結果卻下跌。為什麼？請注意兩個排列左側線形的成交量都低於
    25 天移動平均量，但右側線形的成交量都超過 25 天移動平均量。雖然成交量型態不夠標準，但並不足以解釋排列為何失敗。請對照圖形最左端的長管底排列，兩支線形的成交量都超過正常水準。


    預示著排列可能失敗的最重要徵兆，可能是向下線形的長度。請注意兩個失敗案例的線形，它們是否屬於整年度內最顯著向下突兀的線形？回顧排列發生之前，我們可以看到不少向下突兀的單週線形，例如：1992
    年 12 月份與 1993 年 2 月份，這些線形的長度都不輸給長管底排列的線形。事實上，整份走勢圖到處都是不同長度的突兀線形。基於這個理由，我們或許應該放棄這兩個排列。


    結束圖 30.3 的討論之前，或許應該運用其中一個不錯的例子，說明長管底排列的一項特質。由於這種排列經常發生在下降趨勢的末端，型態完成而經過一段漲勢之後，價格往往會下滑而重新測試長管底的支撐。請參考圖
    30.3 最左端的例子（發生在 1991 年 12 月初）。在此之前的 1991 年 10 月底，股價於$124\frac{1}{4}$做頭（圖形中沒有顯示），然後展開重挫走勢，6
    個星期之後到達長管底的低點$99^{1}/_{8}$。長管底排列完成之後，價格向上反彈，不久又下跌，於 3 月底再創新低$98^{1}/_{8}$，成功測試底部的支撐。


    所以，長管底排列似乎可以提供底部支撐。一般來說，回檔走勢都會在長管底下方的 1/2 點以內止跌，然後正式展開上漲行情。當然，前述的 1/2 點只是概略的說法，實際金額取決於股價水準（對於$100
    以上的高價股，股價可能回檔到長管底下方 1 點左右）。


    因此，即使你高價買進股票，看著價格下滑，但在股價跌破長管底的低點之前，不要輕易認賠賣出。我們稍後會詳細討論交易戰術。


    對於圖 30.3，讀者可能會提出一項質疑：1992 年 3、4 月份之間的排列為何不是長管底？答案與前述失敗案例相同，線形向下延伸的程度不夠長。相對於週遭的線形，這兩支線形向下突兀的程度不足以稱為長管底排列（另外，線形的成交量太小）。


    * 譯按：這種說法似乎有些混淆。對於成功的長管底排列，價格隨後不可能下跌，所以不可能成功向下突破；換言之，排列出現之後，只要價格下跌，就是失敗。另外，「排列出現」與「排列完成」代表相同意義。


    ## 統計數據


    表 30.2 列示長管底排列的一般統計數據。這種排列的案例數量實在太多（442 個），所以我只考慮資料庫內的 200 支股票（不是全部 500 支股票）。半數以上的排列（60%）屬於反轉型態，其餘屬於連續型態。失敗率很低，只有
    12%，我認為失敗率低於 20%就屬於可靠排列。總共有 52 個案例出現 5% 失敗情況；換言之，排列完成之後，在趨勢向下發展之前，沒有發生 5%或以上的漲勢。


    平均漲幅爲 47%，水準非常高。爲了保守起見，我利用長管底隔過線形之最高價與最低價的平均數做爲基準，由此向上衡量最終高點的報酬百分率。換言之，假定投資人在長管底排列完成之後的隔週買進，成交價格是該週價格區間的中點。


    **表 30.2 長管底排列的一般統計數據**


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量： | 442 個 |

    | 1991 年 ~ 1996 年的 200 支股票 | |

    | 反轉或整理排列 | 179 個整理，263 個反轉 |

    | 失敗率 | 52/442 相當於 12% |

    | 成功排列的平均漲幅 | 47% |

    | 最經常發生漲幅 | 20% |

    | 左側線形成交量相對於 25 天移動平均的水準 | 130% |

    | 右側線形成交量相對於 25 天移動平均的水準 | 117% |

    | 對於成功排列，到達最終高點的天數 | 9.5 個月（296 天） |


    我們利用排列漲幅的次數分配圖（請參考圖 30.4），藉以估計長管底的最經常發生漲幅。暫時忽略最右側的欄位，圖形顯示最初四個欄位的高度大約相同，其中以 20%
    的欄位最高，接下來是 30%與 40%。所以，最經常發生漲幅應該是 20%。另外，最右側漲幅超過 90%的欄位很高，使得平均數向上扭曲。如果考慮漲幅超過 50%的案例數量，總共有
    39%的排列漲幅超過 50%。相當不錯。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_145_0.png)


    圖 30.4 長管底排列的漲幅次數分配 最經常發生漲幅為 20%，但實際水準可能會被最右側的超高欄位推升。


    長管底左側線形與右側線形的平均成交量，分別是 25 天移動平均量的 130% 與 117%。換言之，左側線形成交量稍大，右側線形成交量稍微萎縮，但還是大於正常水準。


    排列完成之後，價格到達最終高點的平均期間為 296 天；大約對應其他排列的發展速度。當然，漲幅很小，發展的時間就很短；對於 47% 的平均漲幅，難免需要花費一番功夫。


    表 30.3 顯示一些不尋常的結果。我希望強調一點，篩選長管底排列案例的過程中，完全沒有運用這份表格的內容。因為我不希望發生「倒果為因」的情況。所以，我按照表
    30.1 的準則篩選適當的案例，然後尋找排列績效最佳的參數組合（我利用一組樣本藉以設定最佳參數，然後利用另一組樣本測試參數）。


    **表 30.3 長管底排列的一些統計數據**


    | 說明 | 平均漲幅<br>(%) | 失敗率<br>(%) |

    | :--- | :--- | :--- |

    | 基準 | 47 | 12 |

    | 線形低點存在差異的排列漲幅 | 49 | |

    | 線形低點不存在差異的排列漲幅 | 43 | |

    | 排列左側/右側線形低點較低的績效 | 左 50，右 47 | |

    | 右側線形屬於內側線形的漲幅 | 50 | |

    | 排列左側/右側/兩側線形<br>發生大成交量的績效 | 左 51，右 47，<br>兩側 51 | |

    | 排列左側/右側/兩側線形<br>發生小成交量的績效 | 左 42，右 47，<br>兩側 44 | |

    | 左側線形大成交量，右側小成交量 | 53 | 28 |

    | 右側線形大成交量，左側小成交量 | 40 | |

    | 線性迴歸價格趨勢：<br>3 個月上升 | 41 | |

    | 線性迴歸價格趨勢：<br>3 個月下降 | 51 | |

    | 特長線形（平均長度的 5 倍） | 58，33 個樣本 | 12 |

    | 特長線形（平均長度的 4 倍） | 55，62 個樣本 | 11 |

    | 左側線形大成交量，右側小成交量，<br>3 個月價格趨勢向下傾斜 | 52，28 個樣本 | 25 |


    基準的平均漲幅是 47%，這是以長管底隔週線形之最高價與最低價的平均數做為起點，衡量到最終高點的報酬百分率。換言之，假定投資人在長管底排列完成之後的隔週買進，然後在主要趨勢向下反轉之前賣出。如果把平均漲幅的衡量起點更改為長管底右側線形的低價，平均績效顯著提高為
    60%，最經常發生漲幅則介於 20%與 50%之間。


    按照表 30.1 的辨識準則，透過樣本篩選程序，大多數長管底排列中，兩支線形的低價都沒有差別或價差甚小。我把所有的樣本劃分為兩類，兩支線形低價相同或不同。低價不同的排列平均漲幅為
    49%，低價相同的排列平均漲幅為 43%。


    我們知道，排列兩支線形的低價不同，績效比較理想；可是，哪支線形的低價較低，績效最理想呢？左側線形低價較低的排列平均漲幅為 50%，右側線形低價較低的排列平均漲幅為
    47%。左側線形的低價較低，績效相對理想，但線形的高價又如何呢？我沒以徹底分析所有的可能組合，但曾經觀察右側線形為內側線形的結果。所謂「內側線形」是指該線形被前一支線形完全吞噬；換言之，該線形的低價高於前一支線形，但高價低於前一支線形。如果長管底右側線形為內側線形，排列的平均漲幅為
    50%。


    成交量對於排列績效的影響又如何呢？關於長管底排列的兩支線形，我考慮三種情況：左側線形的成交量、右側線形的成交量，以及兩支線形的成交量。關於大成交量，左側線形或兩支線形發生大成交量的排列績效較理想，平均漲幅都是
    51%；關於小成交量，右側線形發生小成交量的排列績效較理想，平均漲幅為 47%。


    我們知道，排列左側線形發生大量或右側線形發生小量，這兩種情況的績效都很不錯，但如果這兩種情況同時發生，績效又如何呢？平均漲幅為 53%，遠超過基準讀數 47%。如果情況剛好相反——排列左側線形發生小量，而且右側線形發生大量——那又如何呢？平均漲幅只有
    40%。


    尋找適當案例的過程中，我發現這種排列經常發生在價格下降趨勢的末端，所以我希望檢驗情況是否真是如此。我針對長管底排列發生之前的 3 個月收盤價時間序列進行迴歸分析，對於價格上升趨勢（換言之，迴歸直線的斜率為正數），排列的平均漲幅只有
    41%；對於價格下降趨勢，排列的平均漲幅為 51%。這意味著長管底排列發生之前，如果已經發生一段下降趨勢，型態的績效通常比較理想。換言之，長管底排列代表價格趨勢即將向上反轉的訊號。


    最後，我發現排列線形向下延伸的程度愈大，績效愈理想。所以，我衡量最近 1 年內所有向下突兀線形的平均長度；換言之，對於任何一支向下突兀長線形（該線形低價顯著低於之前與之後線形的低價），計算該線形與兩邊鄰近較低線形的低價差值，將此設定為該突兀線形的長度，然後計算最近
    1 年內所有向下突兀線形的平均長度。接下來，我比較前述平均長度與長管底線形長度（後者也是按照相同的觀念衡量）。如果規定長管底線形長度至少是前述平均長度的 5
    倍，排列的平均漲幅為 58% ，但總共只有 33 個符合條件的案例。如果把 5 倍改爲 4 倍，則有 62 個案例符合條件，但平均漲幅稍微下降爲 55% 。


    請注意，如果透過某種方法調整排列的參數，或許有助於平均漲幅，但失敗率也可能因此提高。表 30.3 顯示一些失敗率數據（留白部分代表沒有衡量）。舉例來說，假定考慮成交量的最佳組合——左側線形呈現大量，右側線形呈現小量——而且排列發生之前的
    3 個月價格趨勢朝下發展，這些型態的平均漲幅爲 51% （符合條件的案例只有 28 個），但失敗率上升爲 25% ，超過可靠排列所允許的最高水準 20% 。


    ## 交易戰術


    表 30.4 列舉長管底排列的交易戰術。長管底型態操作上最重要的特徵，可能發生在第 3 個星期。我們可以很輕易找到連續兩支向下的突兀長線形，當排列完成之後，如果隔週線形的價格沒有走高，就應該放棄這個排列。換言之，目標排列出現之後，隔週的線形必須讓排列的兩支線形顯著向下凸出。如果發生在價格下降趨勢末端，排列前一週線形、排列本身兩支線形與排列後一週線形，這
    4 支線形構成顯著的 V 狀排列。


    如同表 30.4 所描逃的，長管底排列通常發生在延伸性價格下降趨勢的末端，至少績效較佳的對象大多如此。價格持續下跌，然後發生長管底排列，走勢止跌反彈，並且開始向上攀升。圖
    30.1 與 30.2 都是這類的典型例子。


    **表 30.4 長管底排列的交易戰略**


    | 交易戰略 | 解釋 |

    | :--- | :--- |

    | 價格下降趨勢 | 績效表現最佳的長管底排列，大多發生在價格下降趨勢末端，或是上升走勢的回檔整理。 |

    | 買進 | 運用表 30.1 的準則，一旦辨識長管底排列之後，買進股票。 |

    | 停損 | 長管底排列具備支撐功能，但價格可能跌到長管底低點下方 1/2 點處，停損可以設在這個位置。價格攀升之後，停損點應該向上調整。 |

    | 留意回挫走勢 | 雖然不是真正的回挫走勢（此處採用週線圖，回挫走勢必須發生在 1 個月或以內），但價格可能拉回重新測試長管底排列的支撐，然後才正式展開漲勢。
    |


    一旦在週線圖上辨識長管底排列之後，就進場買進股票。請注意，股票展開正式的上升趨勢之前，可能重新探底，測試長管底排列的支撐，必須有這方面的心理準備。買進股票之後，停損點應該設定在長管底排列最低點下側
    1/2 點處（預留一些空間，防範走勢重新測試底部）。萬一停損遭到觸發，股價很可能繼續下跌。萬一碰到這種情況，立即認賠出場。


    ## 交易範例


    讓我們看看彼得如何處理長管底排列，或許可以因此而學習一些操作技巧。彼得是我見過最聰明的電腦軟體工程師之一。他

    不只非常聰明而已，也非常容易相處，唯有當工作壓力很大的

    時候，他才會顯得煩躁。在這種情況下，他會想辦法休息。可

    是，彼得紓解工作壓力的辦法與一般人不同，他喜歡進入股票

    市場。透過辦公室提供的網際網路設備，他可以在幾秒中之內

    就上線。1994 年 4 月初，他發現圖 30.5 的走勢，覺得相當有

    趣。這支股票由 1992 年 4 月份以來就呈現橫向走勢，彼得希

    望經過如此長期的打底過程，可以發展成為一波重大的漲勢。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_151_0.png)


    由短期的角度觀察，目前處在 1994 年 1 月中旬以來的下降趨勢末端。1994 年 4 月 4 日，股票創新低，當週的成交量也顯著放大。如果只是這支向下的突兀長線形，可能意昧著單週反轉的型態。可是，緊接著又發生另一支向下的突兀長線形，這支線形的低價為$38^{3}/_{8}$，沒有向下穿越前一支線形的低價
    ($38^{3}/_{8}$)。這兩支線形的向下延伸程度已經足以讓它們凸顯在走勢圖中，顯然也超過 3 月中旬的單週向下「突兀線形」。隔週，線形向上翻揚，留下顯著的長管底排列。該週即將結束的時候，彼得進場買進，成交價格為$42，停損設定在整數價位$38
    的下方 1 格處(換言之，$37^{7}/_{8}$)。停損之所以設定在$38，因爲整數價位經常可以提供支撐。


    進場之後，彼得對於股票的表现相當滿意。他知道，這波走勢是否能夠發展為一段大行情，真正的關鍵在於股價是否能夠克服過去 2 年期間的橫向盤整頭部$55%$ (交易區間的底部在$40\%$)。如果剔除
    3 個月的離群走勢，交易區間的頭部位在$49 附近。所以，$49 與$55%$是整個盤勢的關鍵所在。如果股價能夠向上穿越這兩個水準，就很可能繼續上揚。


    1994 年 6 月份，股價創$50%$的高價之後，6 月底出現明顯的跌勢，彼得知道這不是預期中的大行情。隨後 3 個月之內，股價呈現橫向整理，10 月份到年度之間又出現明顯的跌勢。彼得只能禱告，希望這波跌勢只不過重新測試長管底的支撐，不至於跌破
    2 年多來在$40 附近的大底部。


    譯按：該週的收盤價太低，不應該視為單週反轉。


    11 月底，股價又創$38⁵/₈ 的低價，剛好是先前長管底排列第二支線形的低價。然後，股價稍微回升。由於底部測試成功，彼得決定加碼買進。1995 年 2 月初，股價脫離底部盤整區間，走勢轉強，而且從此一路走高。


    股價幾乎維持直線狀的走勢，一直持續到 1996 年 4 月份的峰位$80³/₈，然後回檔。由於股價漲幅已經很大，理應回檔整理，所以彼得沒有立即賣出持股。可是，當股價下跌到$72
    的時候，他決定賣出。結果，股價跌到$69³/₄，然後又開始上升，而且繼續走高，彼得顯然賣得太早。雖說如此，這筆投資還是每股賺進$30，大約在 2 年的期間內，取得
    71% 的報酬。


