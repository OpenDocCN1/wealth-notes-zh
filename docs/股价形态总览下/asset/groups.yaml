    37.3 提供一些可能有用的建議。


    大體而言，燭鱭排列通常扮演既有趨勢的連續型態。在這種情況下，或許應該預期排列將順著短期趨勢方向進行突破。圖 37.4 提供一個典型的例子。這個燭鱭排列發生在下降趨勢中，型態完成而價格跌破排列第
    1 天的低價之後，繼續下跌。


    ## 表 37.3 燭鱭排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 基本原则 | 能省就省，儘可能不要操作這種型態。 |

    | 順勢操作 | 由於超過半數以上的燭鱭排列屬於連續型態，不預期價格將朝既有的趨勢方向突破。 |

    | 對稱程度 | 挑選幾近於完全對稱的排列。 |

    | 等待突破 | 由於不確定突破方向，最好等待收盤價實際穿越排列第 1 天的最高價或最低價，然後才順著突破方向進行交易。 |

    | 留意回挫或回升走勢 | 大約有一半以上的機會，向上突破之後會發生回挫走勢，向下突破之後會發生回升走勢。當這些折返走勢結束而價格又朝當初的突破方向發展，可以考慮進場建立部位或加碼。
    |

    | 飄揚在旗桿中央的排列 | 這種排列可能發生在快速走勢的中點。 |

    | 停損 | 多頭或空頭部位的停損可以分別設定在排列第 1 天最低價下方 1/8 點處或最高價上方 1/8 點處。 |


    以水平軸為中心，上下對稱或幾近於對稱的鯊鰭排列，績效最理想。你可以把對稱參數設定為 0.44，然後把排列內的相關盤中高價與低價代入「統計數據」一節討論的公式（第
    765 頁），檢驗第 1 天盤中高價/低價與三角形頂點之間的關係是否符合對稱條件。如果你懶得運算，不妨運用肉眼觀察排列第 1 天與第 3 天的中心價位；假定兩者的價位非常接近，就代表對稱的鯊鰭排列。


    雖然鯊鰭排列經常順著既有趨勢的方向進行突破，但這類突破的發生頻率還不足以讓交易者提前進場，所以最好還是等待實際的突破。當鯊鰭排列完成之後（第 3 支線形出現），隨後的收盤價一旦向上穿越排列第
    1 支線形的最高價，或向下穿越第 1 支線形的最低價，就視為突破。


    突破之後，大約有稍高於一半的機會發生回挫（向上突破）或回升（向下突破）走勢。價格折返到排列的中心點（三角形頂點）。一旦價格又朝當初的突破方向發展，這就是進場或加碼的時機。


    請觀察圖 37.4，有沒有注意到任何特殊之處？這個鯊鰭排列的頂點（$22^{7} / _{8}$）剛好落在轉折高點（A 點 $25^{7} / _{8}$）與轉折低點（B
    點 $19^{1} / _{4}$）的中點。換言之，這個鯊鰭排列是飄揚在旗桿中央的「鱗」形。這種現象有助於衡量目標價位。


    如果你走回電腦旁邊，發現你家小鬼趁你離開座位的時候，已經自做主張幫你針對某個鯊鰭排列下單，那也不需覺得恐慌。把停損設定在排列的另一端。以圖 37.4 為例，停損可以設定在
    $23 7/8$，相當於排列第 1 天最高價上方 1/8 點處。反之，如果鱗鱗排列發生在上升趨勢而向上突破，多頭部位的停損應該設定在排列第 1 天的最低價下方
    1/8 點處。在這種情況下，如果排列失敗——發生機率大約是 40%——虧損也不至於太嚴重。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_275_0.png)


    圖 37.4 鱗鱗排列往往會發生在一段快速走勢的中央；換言之，飄揚在旗桿的中央。目前這個例子中，鱗鱗排列發生在 A 點與 B 點的中央，屬於下降趨勢的連續型態。


    ## 上升三角形排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_277_0.png)


    ### 摘要資料


    | 項目 | 說明 |

    | :--- | :--- |

    | 外觀 | 三角形，上限爲水平狀，下限向上傾斜。 |

    | 反轉或整理 | 短期（3 個月以內）的多頭整理走勢。 |

    | 失敗率 | 32%。 |

    | 向上突破之後的失敗率 | 2%。 |

    | 平均漲幅 | 44%，最經常發生漲幅爲 20%。 |

    | 成交量趨勢 | 下降。 |

    | 提前突破 | 25%。 |

    | 突破發生在排列寬度的位置 | 63%。 |

    | 回挫 | 58%。 |

    | 目標價格達成率 | 89%。 |

    | 參照排列 | （20）頭肩頂排列，（43）三重頂排列。 |


    你有没有聽說過：「我只是剛好在正確的時間，處在正確的位置？」或許你自己也曾經這麼認爲。投資的情況經常如此——剛好持有正要發動的股票。這也是我特別偏愛上升三角形排列（ascending
    triangle）的理由之一。只要善加運用，就可以賺進不少錢。不過，討論交易戰術之前，還是讓我們先觀察上升三角形的排列結構。


    「摘要資料」顯示一些重要的發現。上升三角形的失敗率爲 32%，水準明顯偏高。可是，如果等待向上突破之後，排列的失敗率降低爲 2%。


    向上突破的排列平均漲幅爲 44%。觀察實際案例的漲幅次數分配，結果顯示最經常發生漲幅爲 20%。這方面的績效數據非常理想，也造成目標價位達成率高達 89%——讀數只要超過
    80%，就屬於可靠排列。


    ### 緣起


    圖 38.1 提供一個上升三角形排列的範例。沿著排列轉折高點繪製的趨勢線（上限）呈現水平狀，銜接排列轉折低點而成的趨勢線（下限）向上傾斜。當價格在上檔壓力與下檔支撐之間來回游走，成交量持續下降。提前突破預示著行情即將發動；不到
    2 個星期之後，價格再度向上突破，而且繼續走高。


    基於什麼理由而出現上升三角形排列呢？假定你是某大型股票基金的經理人。關於圖 38.1 的股票，過去幾年以來，


    CUC International（金融服務，NYSE，代碼 CU）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_279_0.png)


    **圖 38.1** **上升三角形排列範例。這個多頭排列的上限為水平狀，下限向上傾斜。提前突破經常夾著大量，很難判別它與真正突破之間的差異。提前突破之前，成交量趨於下降。**


    你陸續買進數十萬股。1993 年 6 月初，該股票的漲勢已經持續大約 1 年，價格顯然超過合理價值，你覺得不該繼續持有股票，而且你又發現另一家更不錯的公司。


    你通知交易部門，在不高於$18½的範圍內，拋售所有的持股。由 1993 年 6 月 4 日開始，交易部門連續大賣兩天。由於你準備脫售的股票數量非常可觀，股價根本沒有機會維持在$18½的水準之上。換言之，你在股票上檔設定難以克服的壓力。當你準備脫售股票的消息傳開之後，其他法人機構也跟進，大量賣出。積極的賣盤壓低股價，迫使價格節節下滑。6
    月 9 日，股價下跌到$16¼，終於止住跌勢。在這個低檔水準，許多長期投資人認為價格顯得偏低，大量買進。買進力道推升股價，使得走勢開始回升，最初的漲勢相當凌厲，然後上漲步調逐漸放緩，因為上檔賣壓轉強。6月16日，股價再度觸及$18½的價位，你的基金又開始拋售股票，有效止住漲勢。同樣地，賣盤又壓回股價；可是，經過消化之後，賣盤的力道已經大不如前，而且買方也提高進場價位，所以這波的股價回檔幅度縮小，使得逐漸成形的排列出現上升三角形的發展。價格再度反彈，又觸及上檔$18½的賣出區域，大約停留一星期左右，又遭到賣盤壓回。你接到交易部門的電話，得知所有的股票都已經處理完畢。


    由於上檔的供給籌碼已經完全被消化，股價出現向上跳空的走勢，直接上漲到$19¼。雖然你的基金已經出清持股，但供需之間的爭端顯然還沒有結束，賣壓仍然足以把股價重新壓回三角形排列之內。價格跌勢觸及三角形排列的下限，立即向上反彈，很快又回到排列上限。價格沿著排列上限盤旋1、2天，然後向上躍升。


    如果必須用幾句話描述上升三角形的價格行為，我會說：上檔某特定價位存在大量供給籌碼，但下檔買盤的接手意願愈來愈積極，使得三角形排列的上限呈現水平狀，而價格回檔低點愈墊愈高，呈現向上傾斜的排列下限。當上檔特定價位的供給籌碼被消化之後，三角形排列就向上突破；否則，股價就拉回，經過整理之後，重新嘗試。


    ### 辨識準則


    在日線圖中尋找上升三角形排列，程序很簡單，或許太過於簡單了。最近，我在一份銷路不錯的雜誌上看到一篇文章，其中列示的三角形排列有半數以上不正確。如果你懷疑某個股價型態的有效性，其他人可能也抱著同樣的懷疑態度。如果其他人看不見你所看到的型態，那麼這個型態很可能不會產生預期的效果。總之，如果你對於某個股價型態的辨識沒有把握，就不要勉強進行交易。不妨把交易資金挪到你確信有效的排列上。本節稍後會詳細討論辨識的相關問題。


    圖 38.1 提供一個幾乎可以稱爲標準的上升三角形排列。水平狀上限讓股價漲勢受阻，但回檔走勢的低點不斷墊高，排列下限朝右上方。向上傾斜的趨勢線，預示著價格將向上發展，所以稱爲上升三角形。


    表 38.1 列示上升三角形的特質。排列內的價格漲勢在水平上限附近至少被壓回兩次（換言之，至少有两个顯著的轉折高點）。同理，向上傾斜的排列下限，應該至少由兩個顯著的轉折低點銜接而成。排列上限與下限向右收斂爲三角形頂點（apex），但排列突破位置通常遠在頂點之前。


    三角形排列發展過程，初期的成交量較大，然後逐漸萎縮，直到突破發生爲止。在突破前幾天，成交量經常縮小到不正常的水準，似乎正在節省動能，準備做最後的突破衝刺。當價格向上突破的時候，通常會爆出大量，但這並不是突破的必要條件。


    ## 表 38.1 上升三角形排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 三角形結構 | 價格在排列內來回游走，轉折高點銜接而成的上限呈現水平狀，轉折低點銜接成為向上傾斜的排列下限；排列上限與下限向右收斂，呈現為三角形。 |

    | 水平狀上限 | 排列內的價格漲勢在某特定價位至少被壓回 2 次，2 個轉折高點銜接成為水平狀的排列上限。價格漲勢沒有必要剛好觸及上限，只要足夠接近就可以（例如：距離
    1/8 點以內）。排列上限不需要呈現絕對的水平狀，雖然通常都是如此。 |

    | 向上傾斜的下限 | 排列內價格走勢的回檔低點愈墊愈高，使得排列下限朝右上方傾斜。價格跌勢沒有必要剛好觸及下限，只要足夠接近就可以（例如：距離 1/8 點以內）。排列下限至少由
    2 個觸及點（轉折低點）銜接而成。 |

    | 來回穿梭 | 價格應該來回幾度穿梭於排列上限與下限之間；排列內不能留白太大。 |

    | 成交量 | 排列內的成交量型態應該趨於下降。突破前的成交量通常很小。 |

    | 提前突破 | 經常出現向上或向下的提前突破。假突破與真突破一樣，突破過程都會爆出大量。 |

    | 向上突破 | 成交量放大（但不是必要條件），而且會維持幾天的大量。 |

    | 突破後的價格行為 | 一旦向上貫穿水平壓力線之後，價格通常會繼續上漲，但也經常回挫到排列上限附近稍做整理。如果價格在突破之後快速走高，成交量可能保持大量。如果排列向下突破，最初的成交量通常很大，但很快就會萎縮，但如果價格跌勢很猛，成交量可能維持大量。
    |


    如何判斷某個突破不是提前突破？恐怕完全沒有辦法。所謂「提前突破」，是指收盤價穿越到排列上限或下限之外，但不久價格又折返到排列之內，最後突破排列上限。不論就突破量或突破點距離三角形頂點的位置而言，提前突破與真正突破都沒有差別。


    一旦排列正式向上突破，後續的價格行為如何？股價通常會快速上漲，但偶爾也會向下折返而重新測試排列上限的支撐。突破之後的上漲過程，通常都會維持大量，只要上漲動能沒有減退，成交量也不會縮小。當價格走緩之後，成交量才會恢復正常。如果價格連續上漲幾個星期，成交量應該保持偏高水準，型態顯得不規則（相對於過去的情況）。


    支撐與壓力的情況又如何呢？如果把三角形排列視為兩條趨勢線的暫時交錯，就很容易判斷支撐與壓力的結構。請參考圖 38.2，在週線圖上顯示一個上升三角形的範例。由排列起點到突破前一個星期，成交量型態大體呈現下降趨勢。突破過程爆出大量，然後隨著價格走緩，成交量也慢慢下降。邁入
    1994 年之後，價格又開始攀升，基本上是銜接上升三角形的排列下限。這波上漲趨勢維持數年之久。雖然突破之後的上漲趨勢線不完全銜接先前上升三角形的排列下限，但兩者之間的關係非常清楚。圖
    38.2 分別標示排列上限的兩個轉折高點，以及排列下限的三個轉折低點。趨勢線的觸及點與來回穿梭的價格行為，這都是篩選三角形排列的重要準則。


    現在，你或許覺得自己能夠正確辨識上升三角形。可是，


    Gillette Co.（化粧品，NYSE，代碼 G）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_284_0.png)


