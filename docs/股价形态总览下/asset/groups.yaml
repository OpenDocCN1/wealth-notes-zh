    5% 或以上的跟進跌勢。


    排列向下突破之後，發生回升走勢的案例佔 53%。如果準備把回升走勢預先納入交易戰術內，前述的發生頻率似乎稍嫌過低。可是，如果你已經錯失突破過程的進場時機，不妨把回升走勢視為第二次機會。一旦回升走勢完成而價格又開始下跌，就進場放空。回升走勢的期間很短，平均只有
    10 天左右。如果向上折返走勢超過 30 天，就視為正常價格波動，不屬於回升走勢。


    排列向下突破之後，價格到達最終低點的平均期間為 78 天。這段期間相當短暫，剛好對應偏低的平均跌幅 (19%)。一般來說，價格到達最終低點所耗費的時間愈長，排列的平均跌幅就愈大。


    如果把突破當時的最近 12 個月價格區間劃分為三等份（上線、中央與下線），突破點落在年度價格區間上線的排列數量最多，佔所有案例的 68%。就平均績效而言，突破點落在年度價格區間下線的排列平均跌幅最大
    (21%)，但其他兩個區間的排列績效也相差不大。相關的統計數據支持傳統的觀點：弱者恆弱。


    ## 交易戰術


    表 45.5 列示上升楔形排列的交易戰術。上升楔形排列的衡量法則剛好與下降楔形相反。一旦排列向下突破之後，價格至少應該下跌到排列最低價。雖然下檔目標價位代表的跌幅很有限，但目標價位達成率仍然只有
    63%。我認爲可靠排列的目標價位達成率至少應該超過 80%，所以上升楔形排列的這方面績效很差。


    圖 45.6 說明衡量法則的計算方法。目前這個上升楔形排列非常標準，符合表 45.1 的所有辨識準則。如果投資人針對排列向下突破建立空頭部位，可以透過衡量法則估計下檔目標價位。就目前的例子來說，目標價位是排列的最低價
    $29%。排列向下突破之後，一個星期內就完成目標價位。


    ### 表 45.5 上升楔形排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 價格向下突破之後，至少應該到達排列最低點。 |

    | 突破之後賣出 | 爲了提升獲利機會，最好等待價格實際向下突破（收盤價穿越到排列下限之外）。 |

    | 回升之後賣出 | 如果你錯失突破當時的賣出訊號，可以考慮在回升走勢完成而價格又開始下跌的時候放空。 |

    | 迅速獲利了結 | 由於跌幅有限，隨時準備獲利了結。 |


    ### Fruit of the Loom (成衣，NYSE，代碼 FTL)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_453_0.png)


    圖 45.6 等腰三角形排列跟著發生上升楔形排列。等腰三角形向下突破，顯示價格將繼續下跌。上升楔形的下檔目標價位就是排列最低價 $29%。


    爲了提升操作的成功機會，最好等待向下突破之後才進場放空。建立空頭部位之前，收盤價應該穿越到排列下限之外。按照這個準則操作，失敗率可以由 24% 降低爲 6%。可是，降低失敗率也需要付出對應的代價，你必須放棄向下突破之前價格下跌的獲利機會。雖說如此，穩當的獲利還是比較重要。


    萬一錯失突破過程的進場機會，或許可以在回升走勢進場。排列向下突破之後，大約有半數的案例（53%）會發生回升走勢，價格拉回到排列下限附近，讓你有第二次進場機會。如果你打算運用這個機會，應該等待回升走勢完成而價格又開始下跌才進場，如此可以避免回升走勢繼續上揚。


    表 45.5 的最後一項交易戰術建議空頭部位應該迅速獲利了結。由於排列的平均跌幅僅是 19% , 最經常發生跌幅為 15% , 所以價格走勢只要出現向上反轉的徵兆，最好立即獲利了結。


    如果你基於技術面原因而打算放空股票，最好查核基本面也存在放空的理由。單純期待股價走低，市場顯然沒有義務滿足這種期待。


    ## 交易範例


    老趙是某家大型公司的中級管理人員。耐心是他的最顯著特質之一。他可以輕鬆處理各種壓力，不受一些瑣碎的問題干擾。空閒的時間裡，他經常從事股票交易，對於放空股票具有敏銳的技巧。


    1993 年 11 月初，老趙剛由國外休假回來，發現圖 45.7 的情況。他錯失上升楔形排列向下突破的進場機會，但仍然打算放空股票。


    由較長期的角度觀察股價發展，老趙相信這個上升楔形排列代表的漲勢只是長期下降趨勢的向上修正。一旦向上修正結束之後，老趙相信股價起碼也要跌到這波上升走勢的起漲點
    $30。因此，他決定在 $30 附近才結束空頭部位，除非價格出現顯著的漲勢迫使他提早認賠。所以，他把停損設定在上升楔形排列最高價上方 1/8 點處，相當於
    $36%。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_455_0.png)


    圖 45.7 上升楔形排列的衡量法則。衡量法則估計這個上升楔形排列的目標價位為 $33\frac{3}{4}$。排列向下突破之後，2 天之內就完成目標價位。


    如果股價朝下發展，老趙希望預先估計下檔目標價位。按照三波段衡量跌勢估計，第二支腳可能向下延伸到 $28 或更低。


    11 月初，價格向下突破而回升測試排列下限的壓力，當價格又開始下跌的時候，老趙進場放空股票，成交價格為 $36。按照衡量法則估計，排列最低價爲目標價位 $33\frac{3}{4}$，跌幅相當於放空價位的
    6%。


    建立部位之後，老趙嚴密觀察股價發展，很高興價格立即下跌，迅速達成目標價位 $33\frac{3}{4}$。12 月初，股價向上反彈，老趙重新評估部位當時面臨的市況，他發現基本面與技術面都

    '
  mdcn: '

    標準的上升楔形排列，價格走勢應該多次觸及排列上限與下限。在圖 45.2 的例子中，排列上限與下限各有 3 個觸及點（包括提前向上突破與真正向下突破在內）。如果觸及點數量少於
    5 個（某條趨勢線有 3 個觸及點，另一條趨勢線有 2 個），很可能不會發生預期中的價格行為，甚至股價型態本身就屬於上升楔形排列。


    上升楔形排列是由一系列的價格波動構成，整段走勢至少需要 5 個轉折點，所以需要耗費一些時間才能完成。大體上來說，楔形排列的涵蓋期間至少是 3 個星期（20
    個交易日左右），否則就應該視為三角旗形排列。反之，楔形排列的涵蓋期間也不應該太長。如果把排列寬度定義為排列起點到楔形頂點（兩條趨勢線的交會點）之間的距離，則突破點大約落在排列寬度最初三分之二的位置內。上升楔形排列的涵蓋期間很少超過
    3 個月（在我們的案例當中，最長者為 145 個交易日，幾乎是 5 個月）。


    在排列之內，成交量通常呈現下降趨勢，這是辨識上升楔形排列的另一個重要依據。價格突破之前，成交量通常持續下降。這雖然不是排列成立的必要條件，但統計數據顯示成交量呈現下降趨勢的排列績效較理想。


    如果你發現某支股票的價格行為符合上升楔形排列，但成交量持續放大，不妨忽略成交量的趨勢。你必須根據先前討論的辨識準則（尤其是觸及點的數量），檢定股價型態是否確實是上升楔形排列。只要有任何疑惑，就不要在排列突破之前進行投資。事實上，等待價格實際突破之後才採取行動，通常都是明智之舉。


    上升楔形排列可能發生在任何場合。根據直覺判斷，這種排列似乎應該發生在延伸性漲勢的末端，確實是如此。可是，它也可能發生在下降趨勢的過程內。換言之，價格經過一段跌勢之後，向上修正而形成上升楔形排列；修正走勢完成，上升楔形排列向下突破，價格又繼續下跌。


    在上升楔形排列內，價格波動幅度持續收斂而成成交量萎縮，這都是弱勢的表現。價格創新高，但新高點只稍微穿越先前高點，然後就拉回。在轉折低點方面，疲弱的買盤在價格跌到先前低點之前就進場買進，又抬高價格。


    由於成交量持續下降，通常不能產生足夠的動力推升價格有效向上突破。偶爾確實可以看到提前向上突破（發生頻率是提前向下突破的兩倍），但價格很快又跌到排列之內。最後，股價還是向下突破。


    即使排列向下突破之後，買盤力道還是存在，因為大約有三分之一案例的價格不會跌到排列最低點。對於剩餘的排列，價格雖然跌破排列最低點，但實際的跌幅畢竟有限——上升楔形排列的平均跌幅為
    19%。


    ## 失敗案例


    由於目標價位的達成率偏低，再加上平均跌幅也偏低，所以上升楔形排列的失敗率偏高也就不足為奇了。圖 45.3 顯示上升楔形排列的 5% 失敗案例。排列突破之後，價格沒有朝突破方向出現
    5% 或以上的跟進跌勢，結果又顯著向上發展，這就稱為 5% 失敗。這種失敗型態相對罕見，在整體案例當中，只有 6% 的排列發生 5% 失敗。


    對於圖 45.3 的上升楔形排列，整個價格趨勢朝上發展，涵蓋期間大約 2 個月。這個楔形排列代表價格下降趨勢的向上折返整理，也是三波段衡量漲勢第二支腳的構成部分。第一支腳沒有顯示在圖形中，但兩支腳之間的修正跌勢起始於
    9 月底，走勢圖內顯示一部分修正階段。


    ### Georgia Pacific Corp.（紙類產品，NYSE，代碼 GP）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_442_0.png)


    圖 45.3 上升楔形排列的 5% 失敗案例。排列向下突破之後，價格沒有出現 5% 或以上的跟進跌勢，結果又向上大幅回升。


    因此，我們有理由相信這個排列可能不會出現預期的價格行爲。價格來回穿梭於排列上限與下限之間，形成一個逐漸縮小的通道。


    突破點落在排列寬度的 68% 位置，大約對應一般的情況。成交量型態有些異常，呈現上升趨勢，但在突破之前的一個星期左右，量能開始萎縮。就在向下突破的前幾天，成交量顯著偏低。


    收盤價格跌破排列下限之後，通常會產生一股賣壓，驅動價格進一步下跌。可是，目前這個例子的突破，成交量低於正常水準。請注意，對於向下突破來說，股價本身的重量就足以讓跌勢持續發展，通常不需要仰賴成交量推波助瀾。在我們觀察的所有案例當中，大約有三分之二的排列，突破過程只出現平均水準以下的小量。


    排列向下突破之後，如果你進場放空，結果恐怕不太愉快。收盤價突破下限之後，隔天價格繼續走低，接下來就開始回升。不到兩個星期的期間內，股價就向上穿越楔形排列的最高價。又經過
    3 個月，價格終於突破盤整區間的上檔壓力 $79，展開一波真正的漲勢。7 月底，股價已經超過 $95。


    圖 45.4 顯示另一種失敗類型。價格向上突破，而且繼續走高。相對於 5% 失敗來說，這種失敗類型較常見。圖 45.4 的例子呈現典型的上升楔形排列，兩條趨勢線各有多个交替觸及點。成交量呈現上升趨勢，點綴著突兀性大量，這或許可以解釋為排列可能失敗的警訊。這個楔形排列屬於上升趨勢的整理型態。


