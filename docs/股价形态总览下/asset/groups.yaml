    | 大量反轉與小量反轉（25 週移動平均量的 150%以上或 50%以下）的排列平均績效 | 44%與 38%，但成交量更大，績效反而下降 |


    排列平均漲幅為 44%，屬於績效偏高的多頭反轉型態。最經常發生漲幅為 20%。圖 47.4 是根據所有成功案例漲幅編製的次數分配圖，可以解釋前述兩項漲幅數據之間何以存在顯著的差距。圖形最高欄位落在
    10%~20%，代表發生頻率最高的漲幅。最右端欄位顯示 17%的案例漲幅超過 90%。由於離群漲幅的發生次數相當多，使得平均漲幅向上扭曲為 44%。漲幅不足
    20%的案例佔 37%（前兩個欄位的總和）。所以，這種排列的結果似乎不是「大好」，就是「大壞」。可是，由圖 47.4 觀察，較高欄位都集中在偏低漲幅的一端，意味著型態報酬不會太高。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_485_0.png)


    圖 47.4 週線向上關鍵反轉的漲幅次數分配 漲幅不超過 20%的排列大約佔三分之一。


    順便提及一點，表 47.2 的績效統計數據都是以關鍵反轉當週的收盤價做為衡量基準。舉例來說，排列漲幅是由關鍵反轉線形收盤價，衡量到上升趨勢顯著反轉之前最高價。


    我利用傳統的方法估計關鍵反轉的目標價位。換言之，我計算關鍵反轉當週的線形長度，然後由該週收盤價直接向上衡量線形長度，結果就是價格應該到達的最低目標價位。按照這種方法計算，成功排列的目標價位達成率為
    84%。由於某些關鍵反轉的線形長度很短，相當容易完成目標價位。


    週線向上關鍵反轉發生之後，價格平均需要 218 天才能達到最終高價。這段期間相當長，足以實現 44% 的平均漲幅。


    如果把週線向上關鍵反轉發生當時的最近 12 個月價格區間劃分為三等份（上緣、中央與下緣），關鍵反轉當週收盤價通常落在哪個位置呢？三個區間的分配相當平均，發生在中央位置的排列最多（佔
    38%）。雖然我是以收盤價做為衡量基準（收盤價發生在線形最高價附近），但排列落在年度價格區間三等份任何位置的可能性都大約相同。就這三個位置的排列而言，落在年度價格區間下緣的績效最理想，平均漲幅為
    48%；落在上緣與中央的排列，平均漲幅分別為 45% 與 40%。


    關鍵反轉當週的成交量，大於相鄰兩週的成交量。如果以關鍵反轉當週的成交量做為基準，前一週成交量為 59%，次一週成交量為 82%。


    我把「大成量」定義為成交量大於 25 週移動平均量的 150%，把「小成交量」定義為成交量小於 25 週移動平均量的 50%。對於成功的週線向上關鍵反轉，大成量排列的績效優於小成交量排列，平均漲幅分別為
    44%與 38%，兩者的差異具有統計上的顯著意義。可是，如果把成交量水準提高為移動平均量的 2 倍、3 倍與 4 倍，排列績效將隨著成交量提高而下降（2 倍的平均漲幅為
    44%，3 倍為 38%，4 倍為 29%）。


    某些分析家認為，成交量愈大，關鍵反轉線形愈長，排列的績效愈理想。表 47.3 顯示這方面的檢定結果。我把關鍵反轉線形的長度劃分為 5 個區間：收盤價的 0~5%、5~10%、10~15%、15~20%與
    20~25%；把關鍵反轉當週成交量劃分為 4 個區間：25 週移動平均量的 0~1 倍、1~2 倍、2~3 倍與 3~4 倍。表格內顯示符合線形長度與成交量水準的排列平均漲幅，漲幅讀數外面的括弧內數據，代表符合條件的案例樣本數量。請注意，凡是樣本數量小於
    30 個，漲幅讀數就值得懷疑。這份表格涵蓋所有的案例（前面兩段有關成交量的討論，只考慮成功的排列，但此處同時涵蓋成功或失敗的排列）與所有的成交量區間。


