    排列完成的平均期間很短，頭部排列為 40 天，底部排列為 31 天。實際觀察所有的案例，大約有半數——頭部為 43%，底部為 50%——排列完成於 14 天之內。


    排列發展過程中，大約有四分之三案例的成交量呈現下降趨勢。這項結論是來自於成交量時間序列的線性迴歸分析。實際觀察股價走勢圖，经常可以看見成交量顯著下降的情況。


    表 25.3 提供一些額外的統計數據。島狀頭部型態的案例中，發生回升走勢的排列佔 65%；底部型態發生下挫走勢的排列佔 70%。所以，不論頭部或底部排列，突破之後經常發生折返走勢，操作上可以運用這項特性（換言之，等待回升或回挫走勢完成之後才進場），細節請參考「交易戰術」一節。


    ## 表 25.3 島狀反轉排列的其他統計數據


    | 說明 | 頭部 | 底部 |

    | :--- | :--- | :--- |

    | 回升 / 回挫走勢 | 160/245 或 65% | 195/278 或 70% |

    | 完成回升 / 回挫走勢的平均時間 | 8 天 | 9 天 |

    | 成功排列價格到達最終低點 / 高點的時間 | 3.5 個月（72 天） | 6 個月（178 天） |

    | 排列起始於最近 12 個月價格區間的下緣、中央或上緣 | 下緣 19%，中央 37%，上緣 44% | 下緣 34%，中央 28%，上緣 38% |

    | 前提及突破位置的平均漲幅 / 跌幅 | 下緣 28%，中央 22%，上緣 19% | 下緣 31%，中央 33%，上緣 35% |

    | 相對於突破前一天，突破當天與隨後 5 天的成交量 | 306%，187%，141% <br> 120%，126%，113% | 201%，124%，88%
    <br> 84%，86%，86% |

    | 大量突破 / 小量突破的績效 | 22% / 16% | 33% / 39% |


    完成回升或回挫走勢的平均期間為 8 天或 9 天，較其他股價型態稍短。


    頭部或底部型態成功突破之後，股價到達最終低點或最高點的平均時間差異頗大，頭部為 72 天，底部為 178 天。如果考慮底部排列的績效遠超過頭部排列，這方面的時間差異也就不足爲奇了。


    我把每個案例完成當時的最近 12 個月價格區間劃分爲三等份，分別稱爲上線、中央與下線。然後，計算排列突破點發生在上線、中央與下線的案例百分率。結果，不論頭部或底部排列，突破點發生在年度價格區間上線的案例都最多。乍看之下，島狀底部排列似乎不應該發生這種現象，但稍微深入思考，就顯得理所當然。這是因爲我把島狀底部定義於下降趨勢末端，然後價格向上跳空*。同理，我把島狀頭部定義於上升趨勢末端，然後價格向下跳空。


    如果分別計算突破點發生在前述三個位置的排列績效，落在年度價格區間下線的頭部排列，績效最理想（平均跌幅爲 28%）。這代表什麼意思？弱者恆弱：發生在年度最低價附近的頭部排列，平均跌幅反而最深。至於底部排列，不論突破點的位置如何，排列平均漲幅大約相同，都介於
    31% 到 35% 之間。


    關於突破當時的成交量，表 25.3 顯示排列完成的跳空缺口都伴隨著大量。頭部排列完成之後，隨後 1 個星期內繼續保持大量，但底部排列突破之後，成交量很快就萎縮。


    我希望知道，大量突破與隨後績效之間，是否存在關係？對於島狀頭部排列，這個問題的答案是肯定的，如果突破當天的成交量是前一天的 125%以上，平均跌幅爲 22%；反之，如果突破當天的成交量是前一天的
    75%以下，平均跌幅爲 16%。


    對於底部排列，情況剛好相反。小量突破的案例，平均續效反而比較理想（平均漲幅爲 39%），大量突破的排列平均漲幅爲 33%。請注意，我把大成交量與小成交量分別定義爲前一天成交量的
    125%以上與 75%以下，這兩個讀數都是武斷設定的水準。


    > * 譯按：譯者看不出來這個理由由如何解釋底部突破點最經常發生在年度價格區間的上線。事實上，即使島狀排列屬於短期型態而可能發生在年度價格區間的任何位置；可是，正因爲作者所提及的理由，突破點應該傾向於發生在年度價格區間的上線或中央。


    ## 交易戰術


    表 25.4 簡要列示島狀反轉排列的交易戰術。第一項交易戰術實在談不上是什麼戰術，只是目標價位的衡量法則罷了。投資人透過衡量法則計算潛在報酬與風險之間的關係，藉以評估交易的可行性。請參考圖
    25.7 的島狀底部案例。排列最高價為$24\frac{5}{8}$，位在 2 月初排列完成（發生向上跳空缺口）之前，最低價為$17\frac{1}{2}$。所以排列高度是
    $7\frac{1}{8}$ 點。由突破點（排列最高價）向上衡量排列高度，目標價位為$31\frac{3}{4}$（=$24\frac{5}{8} + 7\frac{1}{8}$）。排列失敗之前，並沒有完成目標價位。


    ## 表 25.4 島狀反轉排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算排列最高價減去最低價的高度，由突破點向上或向下衡量排列高度，結果就是底部或頭部型態突破之後的最低目標價位。 |

    | 等待回升或回挫走勢 | 島狀反轉排列完成之後，價格通常都會折返而填補缺口，然後才展開正式的跌勢或漲勢。等待頭部（底部）排列的回升（回挫）走勢完成，當價格恢復跌勢（漲勢），才進場建立順勢部位。
    |

    | 留意趨勢線 | 價格貫穿趨勢線，通常意味著趨勢已經發生反轉。如果島狀反轉排列發生在趨勢線附近，等待收盤價穿越趨勢線之後才進行投資。 |


    由於大多數島狀排列都會發生回升或回挫走勢，雖然排列的失敗率不高，但績效不是很理想，所以在價格突破之後，最好等待折返走勢完成才進場。折返走勢通常發生在第二個缺口之後的
    1、2 個星期內。如果回升或回挫走勢沒有很快發生（30 天之內），應該另外尋找交易對象。


    當價格回升或回挫，不要立即採取行動。等待折返走勢完成，價格又朝突破方向發展，然後才進場。某些情況下，折返走勢可能繼續發展，使得先前的突破變成假突破。


    本章的「失敗案例」一節，曾經詳細討論趨勢線的運用，所以此處不準備重複說明。下降趨勢線代表有待克服的壓力，上升趨勢線代表下檔的支撐。如果股價型態的突破點位在趨勢線附近，最好等待收盤價正式穿越趨勢線，交易訊號經過多一層的確認，往往更為可靠。


    ## 交易範例


    林先生看著圖 25.7 的半導體股票出現一段暴跌走勢。11 月份與 12 月份期間，股價呈現島狀走勢，但顯然不是島狀反轉，因為最初與最後的兩個缺口都是向下跳空。稍後，在
    1996 年 1 月份到 2 月中旬之間，又出現另一個孤島狀的排列。


    1 月初發生的缺口向下跳空，2 月中旬的缺口向上跳空，後者造成島狀底部排列向上突破。一般來說，島狀底部排列的績效優於對應的頭部排列。林先生利用排列高度衡量突破之後的上檔目標價位，潛在報酬率約略是
    30%，足以彌補所承擔的風險。


    實際買進股票之前，林先生進一步查核其他技術條件。當時的價格趨勢朝下發展，股價由$61\frac{1}{8}$的高點下跌到島狀排列的低點$17\frac{1}{2}$。下降趨勢線剛好穿越島狀排列向上突破的缺口；換言之，島狀排列透過突破缺口直接克服下降趨勢線的壓力，而且收盤價正式站上趨勢線，意味著趨勢已經向上反轉。


    可是，似乎還是不太對勁。股價創新低，而且整個半導體類股的走勢非常疲軟。這個島狀底部究竟代表真正的趨勢反轉，或者價格還會折返，進一步測試底部的支撐？情況實在難以確定，於是林先生決定等待股價折返；如果回挫走勢能夠成功測試底部，就買進股票。向上突破的三天之後，股價拉回而封閉缺口。現在，如果先前的島狀底部確實有效，股價必須回升。可是，實際的發展並非如此。股價繼續走低，一個星期之後，又跌破下降趨勢線。林先生決定另外尋找交易對象。


    一年之後，林先生又叫出這支股票的走勢圖，發現股價創$8的低價，而且從來不曾再回到$27\frac{1}{4}$的高點（島狀底部完成之後的高價）。結論：某些情況下，不採取行動往往是最佳的行動。


