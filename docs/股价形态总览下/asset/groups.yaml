    ### 交易戰術


    表 33.5 列示矩形頭部排列的交易戰術。首先運用衡量法則預測排列突破之後的目標價位。這是計算矩形排列內最高價與最低價之間的差值，以此代表矩形高度，然後由突破點向上或向

    '
  mdcn: '

    價格由低點數度向上反彈，這些走勢最初顯得有氣無力。1998 年 10 月中旬，價格再度由底部向上反彈，這波走勢相當快就觸及 9 月份的高點 $12^{3}/_{8}$。接著，股價就上下來回游走，使得矩形排列的下限與上限非常清楚的界定在
    $11$ 與 $12^{3}/_{8}$。


    綜觀整個股價走勢，你或許認為這個矩形排列向下突破的可能性較高，因為發生在下降趨勢之後的矩形排列大多屬於連續型態。可是，我不確定這個排列究竟將向上或向下突破，所以決定等待實際突破。雖然這個排列繼續下跌的可能性頗高，但先前的下降趨勢由高點
    $20^{5}/_{8}$ 開始進行兩波段下跌，這讓我想起三波段衡量跌勢，其中的修正階段長達 8 個月。若是如此，目前這個矩形排列可能是底部反轉型態。如果我認為這個矩形的高度夠高，就可以在排列之內來回操作（在
    $11^{1}/_{8}$ 買進或回補，在 $12^{3}/_{8}$ 賣出或放空）。


    12 月初，收盤價向上穿越矩形排列的上限，這代表向上突破。我在突破的隔天進場，把進場成本設定為當天價格區間的中點 $13$。


    我估計下檔 $11^{3}/_{4}$ 有支撐，所以把停損點設定在 $11^{5}/_{8}$。我之所以挑選前述支撐，因為這是矩形排列發生之前的底部，也是
    12 月中旬向上突破之前的底部支撐。當然，矩形下限提供的支撐力道更強勁，但把停損設定在該處的潛在損失太大（超過 15%）。


    即便是紙上模擬交易也可能出差錯，目前的這個例子就是如此。進場買進股票的隔天，價格又跌回矩形排列之內，然後走勢緩步下滑，最後在 12 月底觸發停損。我認賠出場，帳面損失
    11%。


    由事後角度觀察，我的進場點代表提前突破。按照統計數據推論，如果發生提前向上突破，隨後的真正突破方向應該朝下。可是，這個例子似乎是統計上的例外；價格最後向上突破。當我撰寫本文的時候，股價游走於
    $13$ 附近，相當於先前紙上模擬交易的買進價位。我懷疑價格可能會再度跌回排列之內。若是如此，只要股價又開始上漲，我可能會實際進場買進。


    ## 矩形頭部排列


    ### 摘要資料


    #### 向上突破


    - **外觀**：價格趨勢朝上發展，進入排列之後，價格波動於兩條水平趨勢線之間，最後向上突破。

    - **反轉或整理**：長期（6 個月以上）的多頭整理型態。

    - **失敗率**：2%。

    - **平均漲幅**：52%，最經常發生漲幅介於 20%~30%。

    - **成交量趨勢**：下降。

    - **提前突破**：11%。

    - **回挫**：53%。

    - **目標價格達成率**：91%。

    - **意外發現**：提前突破與實際突破之間方向相反的案例佔 65%。

    - **參照排列**：（32）矩形底部排列。


    #### 向下突破


    - **外觀**：價格趨勢朝上發展，進入排列之後，價格波动於兩條水平趨勢線之間，最後向下突破。

    - **反轉或整理**：短期（3 個月以內）的空頭反轉型態。

    - **失敗率**：0%。

    - **平均跌幅**：20%，最經常發生跌幅大約是 20%。

    - **成交量趨勢**：下降。

    - **提前突破**：23%。

    - **回升**：55%。

    - **目標價格達成率**：77%。

    - **意外發現**：提前突破與實際突破之間方向相反的案例佔 65%。

    - **參照排列**：（32）矩形底部排列。


    矩形頭部排列（rectangle tops）向上突破的失敗率為 2%。排列的平均漲幅高達 52%，最經常發生漲幅為 20%~30%。這些績效數據很理想。由於漲幅很大，所以衡量法則目標價位的達成率也高達
    91%。


    向下突破的排列，績效稍差一些。排列失敗率為 0%。這當然不表示向下突破的矩形頭部排列絕對不會失敗，但我的資料庫內確實沒有任何失敗案例，至少代表這是相當可靠的排列。可是，我相信讀者遲早還是會碰到一些跟進跌勢不足
    5% 的向下突破失敗案例。排列的平均跌幅為 20%，最經常發生跌幅也是 20%。這兩個數據相同，屬於非常罕見的情況，意味著這種排列很少發生特別大的跌勢。實際觀察排列跌幅的次數分配圖（請參考圖
    33.5），就能驗證這項假設。向下突破矩形頭部排列的目標價位達成率為 77%，稍低於我認爲可靠型態所允許的最低水準 80%。


    唯一值得注意的意外發現是提前突破。當矩形頭部排列發生提前突破，其方向通常與真正突破方向相反。前述這種關係的顯著程度雖然不及矩形底部排列，但相差不大。


    ### 緣起


    圖 33.1 提供一個矩形頭部排列的例子。走勢起漲於 1992 年 6 月份的 $14$，持續到 1993 年 4 月底才發生橫向整理的矩形排列。在 5 月份到
    6 月中旬的盤整期間內，價格橫向走勢的上檔壓力在 $24^{5/8}$，下檔支撐在 $23^{3/8}$。分別沿著整理期間的轉折高點與轉折低點繪製趨勢線，結果是兩條水平狀的趨勢線。兩條趨勢線都有不少觸及點，顯示矩形排列的可靠性。最初，價格曾經向上與向下穿越兩條趨勢線，但這種情況發生在排列初期，不會造成實際的妨礙。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_193_0.png)


    圖 33.1 發生在價格上升趨勢的向上突破矩形頭部排列。


    排列內的成交量型態相當標準——持續下降。可是，這種現象只發生在排列最初三分之二的發展過程。排列最後三分之一期間內，似乎為了醞釀向上突破的動力，成交量開始放大。可是，非常奇怪地，瀕臨突破的前一個星期，價格沿著排列上限橫向發展，成交量也顯著萎縮。當價格穿越排列上限，成交量放大，但不特別明顯。


    向上突破之後，價格漲勢相當凌厲。6 月底曾經發生 3 天的小幅拉回，似乎要折返測試矩形排列上限。可是，買盤力道實在太強，回檔程度很有限，股價繼續走高。


    矩形排列發生的原因何在？這是反映買、賣雙方相互鬥爭的價格紀錄。賣方希望在某價位出脫股票。一旦股票到達該價位，他們就賣出，迫使股價下跌。價格下滑之後，他們就停止賣出。另一方面，買方希望在特定的合理價位承接股票。一旦價格到達目標價位，他們就進場買進。在需求力量推動下，股價上揚。如果買、賣雙方的鬥爭持續得夠久，價格在特定水準之間來回游走，逐漸構成矩形排列，兩個特定價格水準也成爲矩形排列的上限與下限。最後，買方或賣方會後繼無力。如果賣方先耗盡籌碼，需求力量超過供給，價格將突破矩形排列上限。反之，如果買方缺乏資金而縮手，價格將跌破矩形排列下限。不論哪一種情況，一旦價格突破矩形排列的上限或下限，在需求或供給的刺激下，走勢將持續上漲或下跌。


    ### 辨識準則


    表 33.1 列示矩形頭部排列的辨識準則。排列發生之前，短期或中期價格趨勢必須朝上，這是判別頭部與底部排列的準則。不可否認地，這個判別準則涉及主觀的看法，但我還是希望藉此觀察兩種排列之間的行為差異。


    矩形排列的發展過程中，價格上漲遭逢壓力而折返，價格下跌獲得支撐而反彈。如果這種行爲持續發展，上檔壓力區的轉折高點可以銜接成一條趨勢線；同理，下檔支撐區的轉折低點可以銜接成爲另一條趨勢線。兩條趨勢線應該呈現水平狀或近似於水平狀。如果趨勢線稍有傾斜，只要不會影響價格密集交易區的整體外觀，就不需在意。


    矩形排列是由上限與下限界定。排列上限或下限都至少必須由兩個觸及點銜接而成（兩點才能決定一直線）。觸及點不需要交替發生（兩個轉折高點不一定必須夾著一個觸及下限的轉折低點，兩個轉折低點也不一定必須夾著一個觸及上限的轉折高點；換言之，銜接排列上限的兩個轉折高點之間，價格回檔走勢不一定要觸及排列下限），但形狀必須非常凸顯而明確。舉例來說，銜接排列上限的兩個轉折高點，不應該發生在同一段橫向走勢內；換言之，前述兩個轉折高點之間，價格走勢應該顯著回檔，使得兩個轉折高點成爲顯著的峰位。


    **表 33.1 矩形頭部排列的辨識特質**


    | 特質 | 討論 |

    | :--- | :--- |

    | 價格上升趨勢 | 排列發生之前的短期或長期價格趨勢必須朝上。 |

    | 水平趨勢線 | 沿著價格走勢轉折高點與轉折低點繪製的趨勢線，應該呈現水平狀或近似水平狀。 |

    | 觸及點 | 每條趨勢線都至少有 2 個觸及點，總共至少有 4 個觸及點。 |

    | 成交量 | 突破之前，成交量通常趨於下降。 |


    每個案例的成交量結構都不盡相同，但通常呈現下降趨勢。本章提供的範例大多如此，例如圖 33.2。價格呈現一段漲勢，然後進入矩形排列。價格在排列內的下檔支撐 $54$
    與上檔壓力 $59½$ 之間來回游走。這是一個既寬又高的矩形，價格多次觸及排列上限與下限。如果你的手腳很快，短線交易態度積極，這個排列可以提供三、四次交易機會（參考圖形標示的數字）。每當價格穿梭於排列上限與下限之間，大約就有
    $5$ 的走勢幅度，足夠提供短線交易的獲利空間。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_196_0.png)


    圖 33.2 成交量趨於下降的矩形頭部排列。雖然大部分矩形排列的成交量都趨於下降，但不可以因爲成交量上升而懷疑某個矩形排列的有效性。在這個例子中，當價格由某一側發展到另一側，總共提供三個交易機會。


    圖 33.2 排列內的成交量趨勢向下。價格型態即將結束之前，成交量突然放大，推動股價向上突破，隨後的漲勢也夾著大量發展。本章稍後討論的統計數據顯示，絕大多數的矩形排列都呈現下降的成交量趨勢。雖說如此，股價走勢圖上未必能夠清楚看出來。我不會只因爲成交量趨勢沒有縮小，就排除某個價格型態為矩形排列的可能性。


    ### 失敗案例


    在我所觀察的近 300 個矩形排列案例當中，總共只有 5 個失敗情況。把矩形劃分爲頭部與底部兩種排列之後，其中的頭部排列只有 3 個失敗案例。圖 33.3
    提供一個頭部排列的失敗例子。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_197_0.png)


    圖 33.3 矩形頭部排列的 5% 失敗案例。排列順著既有的上升趨勢向上突破，跟進的漲勢不足 5%，接著折返矩形排列，並且向下突破。


    在 $35^{3}_{8}$ 的價位，走勢向上突破矩形排列，不久創新高價 $37$。可是，這波漲勢停頓於 4 月中旬，然後向下折返，重新進入矩形排列，而且持續下跌。先前的短暫漲勢突破幅度只有
    4%。如果突破之後的跟進走勢幅度不足 5%，我就視爲失敗情況。一旦收盤價向下穿越矩形排列的下限，前述的 5% 失敗就經過確認。這是我所謂的「5% 失敗」。


    > 譯按：請參考本書「譯按」部分的說明。按照股票型態分析的傳統看法，如果某個價格排列不預先存在明確的突破方向，則「5% 失敗」顯然不代表排列失敗（目前這個排列成功向下突破），只意味著排列曾經發生假突破。


    這種現象稱為「5% 失敗」，因為我希望透過某種名詞來歸納這類表現不佳的排列。換言之，向上突破的買進訊號發生時，如果你進場買進，一旦價格折返而重新進入矩形排列之內，並且繼續下跌，應該會讓你覺得先前的判斷錯誤。如果你的反應很快，甚至已經認賠出場。非常幸運地，矩形排列很少發生失敗的情況。在矩形頭部排列中，我沒有發現任何向下突破的失敗案例。當然，這並不表示這類排列絕對不會發生失敗的情況，只意味著我剛好沒有遇到而已。


    ### 統計數據


    表 33.2 列示矩形頭部排列的一般統計數據。在 500 支股票的 5 年價格走勢內，我大約發現 200 個矩形頭部排列，大部分（140 個）案例屬於既有上升趨勢的連續型態，向下突破的反轉型態只有
    62 個。


    向上突破的失敗率很低，只有 2%。向下突破的表現甚至更理想，完全沒有失敗的情況。我認為，沒有失敗的情況只是統計上的例外。我相信，只要統計樣本夠大，必定會出現失敗情況。不過，話說回來，我們可以確認一點，矩形頭部排列屬於失敗率極低的可靠股價型態。


    向上突破的排列平均漲幅為 52%，顯著高於一般多頭排列的平均水準。向下突破的平均跌幅為 20%。兩者的最經常發生報酬率都介於 20%~30%。這些數據都代表傑出的績效，尤其是向上突破。


