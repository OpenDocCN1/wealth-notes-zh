    個扇貝形構成，第一個扇貝形的規模往往最高、也最寬。我不確定這種關係是否存在下降扇貝形排列，因為樣本數量太少。


    ## 緣起與辨識準則


    表 36.1 顯示上升與下降扇貝形排列的辨識準則。兩種類型的差異之一，是排列發生之前的價格趨勢。顧名思義，上升扇貝形排列發生在中、長期價格上升趨勢；換言之，價格趨勢的涵蓋期間在
    3 個月或 6 個月以上。下降扇貝形排列通常發生在短期下降趨勢中。


    圖 36.1 與 36.2 分別提供上升與下降扇貝形排列的範例。圖 36.1 顯示三個扇貝形構成的上升排列，第一個扇貝形的規模特別大。每個扇貝形本身的形狀都類似於圓形底，唯一差別只在於轉折高點的位置。以第一個扇貝形為例，排列右端的轉折高點（發生在
    1993 年 4 月中旬）顯然高於排列左端的轉折高點（發生在 1992 年 12 月初）。這是上升扇貝形排列的典型現象——右端高於左端。可是，即使扇貝形左端與右端的價位很接近，仍然屬於有效的排列，但通常意味著一系列扇貝形發展即將告一段落，既有的價格上升趨勢可能發生反轉。


    圖 36.1 最右側的最小扇貝形，清楚呈現勾狀結構。尋找扇貝狀排列時，應該注意價格低點而不是高點。對於某個潛在的扇貝狀，利用一條曲線銜接轉折低點，通常會呈現開口朝上的圓弧狀。圖
    36.1 的前兩個扇貝形就是如此，但最右側的最小扇貝形就不具備這種性質，除非由轉折低點銜接到轉折高點。


    另外，圖 36.1 最右側的扇貝形也呈現最標準的成交量型態——U 型結構。這是上升扇貝形排列經常發生的現象，但不屬於必要條件。第一個扇貝形雖然沒有清楚可見的
    U 型成交量，但實際上是如此；排列兩端的成交量大於中間部分。


