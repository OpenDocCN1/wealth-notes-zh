    | 反轉或整理排列 | 151 個整理，261 個反轉 |

    | 失敗率 | 153/412 或 37% |

    | 成功排列的平均跌幅 | 18% |

    | 最經常發生跌幅 | 10% |

    | 成功排列的目標價位達成率 | 189/259 或 73% |

    | 成功排列到達最終低點的天數 | 3 個月（80 天） |

    | 突破位置在最近 12 個月價格區間的下緣、中央或上緣 | 下緣 15%，中央 18%，上緣 67% |

    | 前述突破位置的 Average 跌幅 | 下緣 21%，中央 16%，上緣 17% |

    | 相對於關鍵反轉當週，前一週與後一週的平均成交量 | 51%，80% |


    成功排列的平均跌幅爲 18%，最經常發生跌幅爲 10%。我利用排列跌幅的次數分配圖決定最經常發生跌幅，請參考圖 46.4。圖形中最高欄位對應的跌幅，就代表最經常發生跌幅，因為該跌幅的發生頻率最高。請注意，最前面兩個欄位加總的發生頻率就超過一半，意味著半數以上排列的跌幅不足
    15%。所以，週線關鍵反轉發生 5% 失敗的機率雖然不大，但出現重大跌幅的機率也不高。跌幅超過 25%的排列大約只佔五分之一（21%）。對於空頭反轉排列來說，週線關鍵反轉的績效相對不彰。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_467_0.png)


    我原本不打算估計週線關鍵反轉的目標價位，後來還是改變主意。我由該週收盤價向下衡量關鍵反轉線形的長度，以此做爲下檔目標價位。大約有四分之三（73%）的排列能夠完成目標價位，稍低於我認爲可靠排列至少應該有的
    80%。


    向下關鍵反轉到達最終低點所需要的時間平均為 80 天，這是由關鍵反轉線形收盤價做爲起點，衡量到趨勢明顯向上反轉之前的最低價。我假定投資者如果打算交易關鍵反轉，將根據該週收盤價建立部位。


    如果把週線向下關鍵反轉發生當時的最近 12 個月價格區間劃分爲三等份（上緣、中央與下緣），關鍵反轉當週收盤價通常落在哪個位置呢？大部分排列（67%）發生在年度價格區間的上緣。至於這三個區間的績效，我發現排列落在年度價格區間下線的表現最佳，平均跌幅爲
    21%，中央與上緣的跌幅分別爲 16% 與 17%。這些統計數據顯示，走勢愈疲弱的股票（愈接近年度價格低點的股票），一旦發生向下關鍵反轉，隨後的跌幅也愈大。


    相對於關鍵反轉當週，我觀察前一週與後一週的成交量情況。關鍵反轉當週的成交量，平均是前一週成交量的兩倍左右，但成交量很快就萎縮。關鍵反轉隔週的成交量，大約是關鍵反轉當週成交量的
    80%。如果把關鍵反轉當週的 25 週平均成交量做爲基準，大約有 52% 排列的成交量超過平均水準。


    很多技術分析專家非常強調成交量的重要性。根據他們的說法，大成交量對於價格的推動力量，必定超過小成交量。我發現某些股價型態適用這項陳述，但另一些股價型態則未必適用。對於週線向下關鍵反轉來說，如果當週的線形很長，再加上成交量很大，隨後的趨勢變動應該很劇烈。我針對這項結論進行研究，結果列示於表
    46.3。


