    ## 線形向下關鍵反轉


    ![](img/157738047fa61d5e4bdbaf89f0241a36_457_0.png)


    ### 摘要資料


    - 外觀：在週線圖上，線形高價高於前一週高價，低價也低於前一週低價。收盤價低於前一週的低價。

    - 反轉或整理：短期（3個月以內）的空頭反轉走勢。

    - 失敗率：37%。

    - 平均跌幅：18%，最經常發生跌幅為 10%。

    - 目標價位達成率：73%。

    - 意外發現：發生位置與最近峰位的距離愈遠，關鍵反轉失敗的可能性愈大。關鍵反轉本身的線形愈長，績效表現通常愈理想。

    - 參照排列：（47）週線向上關鍵反轉。


    週線的向下關鍵反轉排列*（downside weekly reversal formation）——如果可以稱之爲排列的話——的最大特色或許是偏高的失敗率
    37%。換言之，每三個週線向下關鍵反轉，就有一個失敗案例。我認爲股價型態的失敗率應該維持在 20%以下，才可以視爲可靠的排列。所以，就失敗率而言，你或許應該忽略這種排列。


    排列的平均跌幅爲 18%，最經常發生跌幅爲 10%。平均跌幅稍低於一般空頭排列的水準 20%。週線關鍵反轉的統計數據有些意外發現。週線的向下關鍵反轉通常發生在價格峰位附近，經常很接近主要峰位（代表主要趨勢即將反轉的訊號）。週線關鍵反轉距離價格峰位愈遠，失敗的可能性愈高。這顯然符合直覺的判斷，當關鍵反轉發生的時候，如果價格上升趨勢已經向下反轉一陣子，自然更接近最終低點。


    在我研究週線關鍵反轉的過程中，某位分析師告訴我，週線價格區間較寬而成交量較大的關鍵反轉，排列績效較理想。我嘗試檢定這項陳述，發現大型的週線價格區間確實有助於排列績效。可是，我找不到足夠的樣本來驗證較寬週線價格區間與較大成交量，是否有助於提升排列績效。這部分的細節討論，請參考「統計數據」一節。


    > * 譯注：此處的 reversal 又稱爲 key reversal，所以譯文稱爲「關鍵反轉」。請注意，此處的定義與一般文獻上的關鍵反轉並不完全相同。對於頭部的關鍵反轉，一般的定義如下：在上升趨勢中，價格繼續創新高，隨後向下反轉而收盤低於前一支線底的最低價（或收盤價）。就本章提供的走勢圖來說，除了圖
    46.3 與圖 46.2 的第一個例子勉強可以接受之外，其他都不符合關鍵反轉的傳統定義，因爲該週線形都沒有在既有的上升趨勢內繼續創新高。


    ### 緣起


    週線向下關鍵反轉的形狀如何？爲何產生？圖 46.1 提供兩個例子。左側排列發生在價格峰位的一週之後，它代表一段延伸性跌勢的起點，價格由$37^{3}/_{8}
    下跌到$10^{3}/_{8}，跌幅高達 72%。右側排列發生在 1992 年 12 月初，落在價格峰位的兩週之後。由於下降趨勢已經開始，這個關鍵反轉線形只是用來確認價格繼續下跌。關於前述這個結論，我自己也不太滿意，因爲我認為有效的關鍵反轉必須發生在上升趨勢的峰位或附近。


    舉例來說，圖 46.1 左側的關鍵反轉相當接近上升趨勢的


    ![](img/157738047fa61d5e4bdbaf89f0241a36_459_0.png)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_459_1.png)


    圖 46.1 週線圖上的兩個向下關鍵反轉。左側的關鍵反轉代表及時的賣出訊號。兩個關鍵反轉都發生在價格峰位附近。


    末端，可以視為峰位的一部分（假設關鍵反轉隔週的價格繼續上漲，我們根本不會留意收盤價一度下滑）。就右側的關鍵反轉來說，我們很難漠視收盤價已經下跌 3、4 週。由長期的角度觀察，跌勢已經長達一年以上。


    週線圖上為何會發生向下關鍵反轉呢？這種排列又如何產生作用？在價格上升趨勢中，早期的動能會加速發展，然後逐漸放慢，在價格向下反轉之前，動能會減退。如果動能的變化非常快速，在一個星期或一天之內完成，就會在週線圖或日線圖上顯示關鍵反轉的走勢。在該週的前幾天內（或當天的早盤），動能持續上揚，價格創新高。接著出現一些盈餘、相同店面銷售金額或其他基本與技術面的利空消息，使得買盤力道減弱，賣壓轉強。於是，該週最後幾天（或當天後半段）的價格走勢開始下滑，收盤價甚至低於前一週（或前一天）的低價。


    在動能帶領下，前半週的價格走勢繼續創新高，但後半週的情況逆轉，價格收低。精明資金察覺趨勢正在變化，大量拋售股票，這也造成動能的快速變動。隨著價格下跌，賣壓更加強化，股價又進一步下挫。


