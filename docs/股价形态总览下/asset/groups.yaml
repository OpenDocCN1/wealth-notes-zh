    | 反轉或整理排列 | 77 個整理，545 個反轉 |

    | 失敗率 | 134/622 相當於 22% |

    | 成功排列的平均跌幅 | 36% |

    | 最經常發生跌幅 | 25%~40% |

    | 排列平均長度 | 5 個月（153 天） |

    | 第一隻腳價格跌幅 | 25%，54 天 |

    | 修正階段價格漲幅 | 16%，39 天 |

    | 第二隻腳價格跌幅 | 27%，60 天 |

    | 修正階段價格折返幅度 | 40%~60% |

    | 排列起始於最近 12 個月價格區間的下緣、中央或上緣 | 下緣 0%<br>中央 6%<br>上緣 93% |

    | 衡量法則 | 第二隻腳長度超過第一隻腳的案例佔 43% |


    在我發現的案例中，絕大部分（88%）屬於上升趨勢末端的頭部反轉排列，其餘案例則屬於下降趨勢的整理排列。三波段衡量跌勢的整理排列，通常是延伸性跌勢的構成部分。某些情況下，相對於整個下降走勢，三波段衡量跌勢本身的規模很小；另一些情況下，整個下降趨勢是由一系列的三波段衡量跌勢構成。


    如同前文提到的，如果第二隻腳沒有貫穿第一隻腳的低點，排列視為失敗。我進行多次的檢定，儘可能尋找這類的失敗案例。結果，排列的失敗率為 22%，稍微超過我認為可靠排列的最高門檻
    20%。


    由第一隻腳的最高價，衡量到第二隻腳的最低價，排列的平均跌幅為 36%。一般來說，當投資人察覺三波段衡量跌勢的時候，可能已經處在第二隻腳的某個階段。所以，操作這個排列的實際績效應該遠低於
    36%（可能是 20% 左右，因為價格在修正階段還會出現某種程度的漲勢）。圖 26.6 顯示所有成功排列的跌幅次數分配圖，請注意中間四個欄位的高度大約相同，所以最經常發生跌幅介於
    25% 到 40% 之間；換言之，如果你發現某個三波段衡量跌勢，這個排列的跌幅很可能介於 25% 到 40% 之間。重複強調一次，此處的跌幅是由第一隻腳的最高價，衡量到第二隻腳的最低價；當你實際察覺某個三波段衡量跌勢的時候，整段跌勢很可能已經完成一大半了。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_74_0.png)


    圖 26.6 三波段衡量跌勢的跌幅次數分配 忽略最右側一個欄位，最經常發生跌幅為 25%~40%。


    完成這個排列的平均時間為 153 天（5 個月）。第一隻腳的平均價格跌幅為 25%，涵蓋時間平均為 54 天；修正階段的平均漲幅為 16%，涵蓋時間平均為
    39 天；第二隻腳的平均價格跌幅為 27%，涵蓋時間平均為 60 天。由表 26.2 的數據可以發現，就價格跌幅百分率與時間長度來說，第一隻腳與第二隻腳非常接近。


    修正階段的價格折返幅度有多大？平均來說，大約是第一隻腳長度的 40% 到 60% 之間。請參考圖 26.7，橫軸的折返百分率，是指價格向上修正距離相對於第一隻腳長度的百分率。最右側欄位代表折返百分率超過
    65% 的排列數量佔總案例的 15%。撇開最右側欄位不談，最高五個欄位代表的折返百分率介於 40%~60%。所以，我認爲修正階段最可能發生的價格折返幅度為
    40% 到 60%。


    由於三波段衡量跌勢的性質，這種股價型態通常發生在年度高價附近。以第一隻腳的最高點為準，考慮每個三波段衡量跌勢發生在最近 12 個月的價格區間位置，大約有 93%
    的案例落在年度價格區間三等份的上緣。發生在其他位置的案例，大多是一連串三波段衡量跌勢的後續構成型態。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_76_0.png)


    關於目標價位的達成率，我總共發現 43%的案例，這些排列的第二隻腳長度等於或超過第一隻腳。我認爲目標價位達成率超過 80%才可靠，這意味著三波段衡量跌勢第一隻腳所衡量的目標價位並不可靠。如果以第一隻腳的三分之二長度來衡量第二隻腳的目標價位，結果就符合可靠排列的
    80%門檻。


    ## 交易戰術


    表 26.3 列示三波段衡量跌勢的交易戰術與衡量法則。衡量法則用來估計排列的下檔目標價位。請參考圖 26.8 的例子，其中利用 A、B、C 與 D 標示三波段衡量跌勢的重要轉折點。首先計算第一隻腳的高度，利用波段最高價
    $52 \frac{7}{8}$ （A 點）減去波段最低價 $42$ （B 點），結果是 $10 \frac{7}{8}$ 。由修正階段最高價 $47 \frac{3}{4}$
    （C 點），向下衡量第一隻腳的高度 $10 \frac{7}{8}$，即是目標價位 $36 \frac{7}{8}$ 。這個目標價位完成於 12 月 7 日。


    ### 表 26.3 三波段衡量跌勢的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 第二隻腳的長度較第一隻腳短 10% 左右。第一隻腳的長度是由最高價衡量到最低價（修正階段的起點），由修正階段的最高價向下衡量第一隻腳的長度，結果就是第二隻腳的目標價位（達成率爲
    43%）。另外也可以利用第一隻腳的三分之二長度來衡量目標價位，達成率提高爲 80%。 |

    | 第二隻腳的放空與停損 | 一旦確定三波段衡量跌勢正在進行中，儘快進場放空。萬一價格反彈穿越修正走勢的高點，立即認賠出場。價格偶爾會第二次向上測試修正高點，然後才正式展開跌勢，所以停損設在修正高點的稍上方。
    |

    | 結束部位 | 價格下跌到重要支撐區或目標價位附近，回補空頭部位。 |

    | 支撐/壓力 | 修正階段經常提供後續走勢的重要支撐與壓力。 |


    一旦判斷三波段衡量跌勢正在形成當中——通常是在修正走勢結束而價格開始下跌的時候——進場建立空頭部位。利用衡量法則估計下檔目標價位，但必須瞭解目標價位經常不能完成。建立空頭部位之後，把停損設在修正階段高點的上方
    1/8 點處（修正階段經常提供後續走勢的重要支撐與壓力）。另外也可以由比較保守的角度衡量目標價位。在前述的衡量法則中，把第一隻腳的完整長度取代為三分之二長度。在所有的案例中，有
    80% 的排列完成保守目標價位。請參考圖 26.8 的例子，第一隻腳的三分之二長度為 $7 \frac{1}{4}$ 點。由修正階段的高點 $47 \frac{3}{4}$，向下衡量
    $7 \frac{1}{4}$ 點，目標價位為 $40 \frac{1}{2}$。一旦價格由支撐區反彈或接近目標價位，就可以考慮回補空頭部位。


    ## 3 Com Corp.（電腦與周邊設備，NASDAQ，代碼 COMS）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_78_0.png)


    圖 26.8 進場操作這個三波段衡量跌勢（A 點到 D 點），艾迪的每股獲利大約是 $5。


    三波段衡量跌勢完成之後，修正階段經常成為後續走勢的上檔壓力區。價格回升走勢往往在修正階段的低點或高點位置被壓回。圖 26.8 標示這兩個位置提供的壓力與支撐。如果你的手腳很俐落，可以嘗試在三波段衡量跌勢結束之後由多方進行操作。當走勢反彈到修正階段的壓力區，一旦價格開始被壓回，就賣掉股票。在多頭行情中，股價最終還是會向上突破修正階段的壓力區。


    ## 交易範例


    在社會上討生活真的很不簡單，不信的話，你可以問艾迪。他是一家航空公司的訂位代理商，經常需要應付電話另一端的抱怨與吼叫。關於機械與天氣的問題，他一點辦法也沒有，但客戶似乎完全不理會，總是把他當做出氣的對象。


    他真正想做的事情，是在股票市場進行投資。目前，他就經常進出市場；但規模相當有限，因爲可供投資的現金不多。非常幸運地，現在只需要在滑鼠上按幾個鍵，就可以上網查詢某支股票最近的走勢。


    就是在這種情況下，他發現圖 26.8 的交易機會。這支股票由 1994 年 6 月份的低點$10 附近，持續攀升到 1995 年 10 月份的峰值$53$。每隔一陣子，他就沿著漲勢的轉折低點繪製上升趨勢線，最近的走勢似乎有加速發展的傾向（上升趨勢線的斜率愈來愈陡峭）。


    他知道這種陡峭的漲勢不可能持續發展，準備針對頭部反轉排列進行操作。正如同預期的情況一樣，價格於 11 月 14 日跌破上升趨勢線。艾迪沒有立刻進場放空，他打算在稍後的回升走勢中才進場。價格貫穿趨勢線的一個星期之後，價格觸及$42
    的支撐而向上反彈。隨後一個多星期內，價格持續走高，然後突然在單日之內暴跌 3 點，這段回升走勢距離原先的上升趨勢線還有一段很長的差距。


    當價格下跌而貫穿 B 點與 C 點之間的短期上升趨勢線，艾迪察覺這是三波段衡量跌勢，於是進場放空股票，成交價格爲$42。


    他利用衡量法則估計下檔的目標價位為$36^{7}_{8}，並且預先在此設定買進停止單。3 天之後，經紀人就通知他，空頭部位已經回補，每股獲利大約$5，相當於
    12%的報酬。


    當三波段衡量跌勢完成(D 點)，隨後的反彈走勢在修正階段低點(B 點)遭逢壓力而折返。1996 年 1 月初，另一波上升走勢又在修正階段高點(C 點)遭到壓回。所以，修正階段往往代表隨後走勢的支撐與壓力。


    # 三波段衡量漲勢


    ![](img/157738047fa61d5e4bdbaf89f0241a36_81_0.png)


    ## 摘要資料


    - **外觀**：價格上漲，然後向下修正，接著又繼續上漲。向上的兩隻腳，價格距離與涵蓋時間都大約相同。

    - **反轉或整理**：長期（6個月以上）的多頭反轉型態。

    - **失敗率**：23%。

    - **平均漲幅**：68%，最經常發生漲幅介於30%與60%之間。

    - **第一隻腳漲幅**：43%，87天。

    - **修正階段跌幅**：14%，45天。

    - **第二隻腳漲幅**：37%，65天。

    - **衡量法則**：57%。

    - **參閱排列**：（14）旗型與三角旗形排列。


    三波段衡量漲勢（measured move up formation）是三波段衡量跌勢的顛倒型態。排列的失敗率為 23%，稍高於我認為可靠排列所允許發生的最高失敗率
    20%。請注意，排列的平均漲幅高達 68%，但這項數據很容易造成誤導。排列漲幅是由第一隻腳的最低價，衡量到第二隻腳的最高價。顯然地，實際操作頂多可以取得前述漲幅的一半稍多。為什麼？因為排列必須發展一段期間之後，你才有足夠的資料辨識股價型態。一般而言，投資人唯有在向下修正階段的末期才會察覺排列的可能性，實際進場的時間通常在第二隻腳的初期。


    按照「摘要資料」的數據顯示，第二隻腳的平均漲幅為 37%。由於投資人通常在第二隻腳的發展過程才進場，實際的報酬率頂多是 30%左右。


    ## 緣起


    圖 27.1 的例子標示三波段衡量漲勢的構成部分。第一隻腳代表一段漲勢，價格通常沿著明確的上升趨勢線發展，甚至可以銜接走勢的轉折高點繪製另一條平行的直線，兩條直線構成所謂的價格通道（channel）。


    第一隻腳的漲勢告一段落之後，價格開始向下修正，修正幅度往往是第一隻腳長度的 35%到 65%之間。就圖 27.1 的例子來說，修正階段由 1 月底發展到 2
    月下旬。價格向下修正的幅度為第一隻腳長度的 55%。修正完成之後，價格恢復漲勢，進入排列的第二隻腳。第二隻腳的走勢向上弓，直到 6 月中旬做頭下跌之前，始終沒有觸及圖形上標示的上升趨勢線。


    ## Ann Tylor (特殊零售,NYSE,代碼 ANN)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_83_0.png)


    排列完成之後，價格經常跌到修正階段的上緣或下緣附近。就目前這個例子來說，7 月中旬的底部大約落在修正階段頭部的稍下方。當然，如果上升趨勢已經向下反轉，價格可能暴跌到排列的底部，甚至繼續下滑。


    ## 辨識準則


    表 27.1 列示三波段衡量漲勢的辨識準則。這種排列通常發生在下降趨勢開始向上反轉的底部，但也不必然如此。所謂的下


    578 / 股價型態總覽（下冊）


    ### 表 27.1 三波段衡量漲勢的辨識特質


    | 特質 | 討論 |

    | :----- | :----- |

    | 下降趨勢 | 排列發生之前，經常出現幾個星期或長達一年以上的價格下降趨勢。在這種情況下，三波段衡量漲勢代表趨勢開始向上反轉的排列，通常發生在年度低價附近。
    |

    | 第一隻腳 | 進入修正階段之前，價格通常沿著上升趨勢通道發展。 |

    | 修正階段 | 價格下跌，幅度通常是第一隻腳長度的 35%到 65%之間。修正階段的價格折返程度，通常與第一隻腳長度之間保持正向比例關係：第一隻腳的漲幅愈大，向下修正的幅度也愈大。某些情況下，修正階段可能出現鋸齒狀的排列（換言之，一系列的急漲急跌走勢），持續一段期間才向上突破。如果排列發生之前曾經出現延伸性的漲勢，修正階段比較可能發生鋸齒狀型態。
    |

    | 第二隻腳 | 第二隻腳的傾斜角度通常類似第一隻腳（換言之，兩隻腳的趨勢線斜率大約相同）。兩隻腳走勢通常都落在明確的趨勢通道內，但這並不是必要條件。 |

    | 避免情況 | 如果價格在修正階段向下折返太深，超過第一隻腳長度的 80%，最好避免介入。 |


    降趨勢包括任何規模的跌勢而言。以稍早的圖 27.1 為例，先前的多頭走勢起源於 1991 年 12 月，但只持續 2 個月，隨後幾個月的期間內，基本上維持橫向而稍微下滑的走勢，價格由$18¼的高價逐漸下跌到
    1992 年 11 月份的低價$14¾。


    繼續參考圖 27.2 的例子，三波段衡量漲勢發生之前的價格下降走勢很短，大約只有 1 個月。如果由長期的角度觀察（圖形沒有顯示），價格始終處於漲勢，起點是
    1993 年 11 月的 $14\frac{1}{2}$，截至 1995 年 5 月份的 $27，漲幅已經將近 100%。目前這個排列的第一隻腳稍微向上弓，但還是沿著上升趨勢線發展，如果由漲勢的轉折高點繪製一條平行直線，這波段走勢顯然落在上升通道內。第
    2 隻腳更清楚落在上升通道內，上升趨勢線曾經觸及多個轉折低點，上側的平行直線也觸及多個轉折高點（為了避免混淆，圖形沒有顯示）。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_85_0.png)


    圖 27.2 三波段衡量漲勢。修正階段呈現下降楔形排列，此處的成交量向下萎縮。


    這個例子的修正階段出現下降楔形排列（falling wedge）。這個楔形排列使得衡量走勢的操作更簡單，因為這個整理排列預示著價格稍後將向上發展（譯按：下降楔形屬於上升趨勢的連續排列）。只要價格向上突破楔形排列，立即買進股票。如果你按照這個程序進場，獲利大約介於
    15%到 20%之間——取決於實際的進場點與出場點。對於短短 6 個星期的投資，這已經算是不錯的績效。另外，請注意楔形排列內的成交量型態顯著萎縮。


    兩隻腳畫出的上升趨勢線斜率幾乎完全相同，大多數三波段衡量漲勢都具備這種特質。可是，關於趨勢線的傾斜角度，每個案例則各自不同。


    圖 27.2 的例子，修正階段的價格折返幅度大約是第一隻腳長度的 40%，介於 35%~65%的正常區間內。當第一隻腳出現延伸性的漲勢，修正階段也經常會出現較長期的整理，甚至發生鋸齒狀的劇烈起伏走勢。在這種情況下，為了謹慎起見，最好等待價格向上穿越第一隻腳的高點，然後才考慮進場買進。


    ## 失敗案例


    究竟在什麼情況下，三波段衡量漲勢才算失敗呢？如果第二隻腳沒有向上穿越第一隻腳的高點，我就把排列定義為失敗。當然，這是作者個人的主觀認定。如果價格在修正階段大幅回檔，第二隻腳未必很容易到達第一隻腳的高點。雖說如此，我個人對於這個定義相當滿意，統計數據也顯示如此。

