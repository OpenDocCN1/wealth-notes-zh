    以每個成功排列的起點爲基準，把最近 12 個月的價格區間劃分爲三等份（上緣、中央與下緣），並且觀察該排列起點落在這三等份區間的位置。統計所有的成功案例，我們發現大部分排列（79%）的起點都落在年度價格區間的下緣，剩餘
    21% 排列的起點落在年度價格區間的中央。這些結論的重要性很明顯：三波段衡量漲勢很少發生在年度高價區；如果排列不是發生在年度低點附近，就避免介入。


    達成目標價位的排列比率稍微超過一半（57%），關於目標價位的衡量方法，請參考下一節「交易戰術」的討論。


    ## 交易戰術


    表 27.3 摘要說明三波段衡量漲勢的交易戰術。衡量法則用來估計第二隻腳的目標價位。讓我利用圖 27.5 來說明目標價位的計算方法。首先，計算第一隻腳的長度；換言之，由第一隻腳的最高價減去最低價。第一隻腳的最高價，通常位在修正階段起點附近；在圖
    27.5 的例子中，A 點標示第一隻腳的最高價 $21^{1}/_{8}$，B 點標示最低價 $14^{1}/_{8}$，所以第一隻腳的長度為 7 點（=$21^{1}/_{8}$−$14^{1}/_{8}$）。由修正階段的最低點（C
    點的 $18^{3}/_{8}$）向上衡量第一隻腳的長度，目標價位是 $25^{3}/_{8}$（=$18^{3}/_{8}$+7）。在目前這個例子中，目標價位完成於修正階段結束之後的第
    10 個交易日。


    ### 表 27.3 三波段衡量漲勢的交易戰術


    | 交易戰術 | 解釋 |

    |---|---|

    | 衡量法則 | 第一隻腳的长度是由最高價衡量到最低價，由修正階段的最低價向上衡量第一隻腳的长度，結果就是第二隻腳的目標價位。藉由目標價位計算交易的潛在報酬，比較報酬與風險之間的關係，評估交易的可行性。
    |

    | 年度低價 | 挑選排列起點（第一隻腳的最低價）位在年度價格區間三等份下線的交易對象。避免介入年度高價附近的排列。 |

    | 買進 | 修正階段結束之後，在第二隻腳漲勢初期，進場買進。 |

    | 支撐／壓力 | 修正階段經常提供後續走勢的重要支撐與壓力。 |


    爲 37%，但第二隻腳的絕對金額長度反而較第一隻腳長約 10%。爲什麼？一般來說，第二隻腳的起漲價位高於第一隻腳的起漲價位，即使第二隻腳的長度較長，但因爲起漲的基準較高，所以漲幅反而較小。在所有的案例中，第二隻腳長度等於或大於第一隻腳的排列佔
    57%。換言之，大約有半數案例能夠達成目標價位。我個人認爲，目標價位達成率超過 80% 才屬於可靠型態；所以，三波段衡量漲勢在這方面有所不足。


    按照衡量法則估計目標價位之後，不妨自行琢磨一個問題：爲了取得這項報酬潛能（目標價位減去預定進場價位），是否願意承擔對應的潛在風險（預定進場價位減去下檔支撐）？如果答案是肯定的，就進一步研究股價走勢圖。價格到達目標價位之前，是否存在其他壓力區？若是如此，或許需要調降目標價位。反之，如果衡量法則估計的目標價位之內不存在顯著的壓力，也可以視情況而調高目標價位。


    如何挑選適當的三波段衡量漲勢做為交易對象呢？最好選擇第一隻腳起點位在年度價格低點附近的排列。在我分析的全部成功案例當中，只有兩個排列發生在年度價格區間三等份的上緣。絕大部分案例（79%）都發生在年度低價附近。修正階段結束，就可以考慮進場買進股票。讀者或許會提出一個問題：如何判斷修正階段已經結束呢？原則上是採用趨勢線；換言之，沿著修正階段的走勢轉折高點，繪製一條下降趨勢線，一旦收盤價格向上穿越趨勢線，就進場買進股票。當股價接近目標價位的時候，不必急著出場。如果價格漲勢相當凌厲，應該繼續持有部位，等待走勢開始下跌之後才賣出。反之，如果股票在目標價位附近或之前就呈現弱勢表現，提早賣出或許是明智之舉。


    一旦排列完成之後，價格可能一路下跌到先前的修正階段才能獲得支撐。修正階段的上緣與下緣都代表顯著的支撐，但跌勢也可能直接買穿修正階段。總之，如果你沒有及時獲利了結而繼續持有股票，部位很可能轉盈爲虧。


    ## 交易範例


    楊小姐是一位工程師。自從大學時代以來，她在這個男性爲主的領域內，已經培養一股勇於競爭的習慣。踏進社會之後，環境還是沒有多大的改變，迫使她繼續維持這種競爭精神。請不要誤會我的意思：楊小姐非常漂亮，不乏追求者。我可以親自證明這點。有一天，我到她的辦公室，楊小姐不在位子上，但桌上的記事本寫著一些約會或其他愛慕的詞句。當然，我也留下一段，但我並不是追求者之一。


    如果楊小姐拿到一個魔術方塊，她未必會忙著解開答案。首先，她很可能會把魔術方塊拆開，研究內部的結構。這種直指問題核心的精神，配合專業的能力，使她能夠順利解決各種疑難雜症，這種特質即使在工程師裡面也相當罕見。另外，她也透過相同的方式處理股票投資。


    楊小姐採用一種非常特別的方法來處理圖 27.5 的情況。她已經擁有這支股票，但相信該股票的漲勢後繼無力。在 1994 年 11 月份到 1995 年 2 月份之間（圖形沒有顯示），走勢呈現雙重頂排列。價格由高點
    $24^{1}/_{8}$，跌到三波段衡量漲勢的起點 $14^{1}/_{8}$（B 點）。


    不幸地，由於缺乏投資經驗，楊小姐沒有掌握雙重頂排列的賣出機會，眼睜睜看著股價一路走低，41% 的帳面獲利也消失無蹤。當股價又開始上漲的時候，她才覺得稍微舒緩一些。可是，她發誓，只要還有另一次機會，一定不會輕易放棄。她發現成交量隨著股價上漲而放大，這意味著行情應該不小，因爲所顯示的動能足以繼續推升股價走高。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_97_0.png)


    圖 27.5 三波段衡量漲勢，第二隻腳中點出現等腰三角形排列。楊小姐持有這支股票，最後在突破缺口被封閉的時候賣出股票。等腰三角形排列過程中，呈現標準的成交量型態。


    任何漲勢都必須停頓休息，目前的情況也不例外。7 月份，漲勢受阻（A 點），並且回檔整理大約一個月。她觀察整個股價走勢，發現過去的峰位在上檔構成數個壓力區，最近的一個壓力就在
    $21。當整理走勢結束，股價又開始翻升的時候（C 點），成交量也顯著放大，楊小姐立即察覺這是三波段衡量漲勢。她有沒有賣出持股？沒有，她決定掌握這段漲勢。按照傳統的衡量法則，楊小姐估計上檔的目標價位在
    $25½，如果股價真的能夠達成目標價位，將創年度新高價。由於上檔 $24 附近是過去峰位的壓力區，她認為股票應該會在這個壓力區逢達阻力，事實上也是如此。走勢出現等腰三角形的排列；這個排列的結構相當標準，轉折高點不斷下滑，轉折低點不斷墊高，成交量明顯趨於萎縮。楊小姐相信自己對於這個型態的辨識沒錯。


    由於等腰三角形可能是反轉排列，也可能是連續排列，所以沒有辦法預先判斷比較可能的突破方向，楊小姐只能緊張地等待。最後，價格透過跳空缺口向上突破。這個缺口屬於突破缺口或竭盡缺口？由於缺口發生在整理走勢的末端，顯然應該是突破缺口，這意味著股價將繼續上漲，但漲幅有多大呢？她希望這個等腰三角形位在第二雙腳漲勢的中點。等腰三角形往往是「飄揚在旗桿中央」；若是如此，上檔目標價位在
    $28（關於等腰三角形排列的衡量法則，請參考第 40 章或 41 章）。對於楊小姐來說，這是一個比較不切實際的目標，但還是值得期待。另外，她就三波段衡量漲勢所估計的目標價位
    $25³/₈，在等腰三角形向上突破的過程中就達成了。


    等腰三角形突破之後的一個星期左右，股價創新高，但立即向下反轉。9 月上旬，當股價封閉等腰三角形的向上跳空缺口，楊小姐決定賣出持股。非常幸運地，隔天價格開高，楊小姐在
    $24½ 賣出股票，相當接近當天的高價 $25¹/₈。隨後幾個星期，股價繼續下跌，不久就跌到修正階段支撐區的中心。股價由這個支撐區開始展開絕地大反攻，一個月之後再創新高。楊小姐懷疑自己可能賣得太早了。6
    個月之後，當她重新拿叫出這份股價走勢圖，發現當時的價位落在 $15 附近。


    # 單日反轉排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_99_0.png)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_99_1.png)


    ## 摘要資料


    ### 頭部排列


    - **外觀**：單日的向上突兀長線形，在盤中低價附近收盤。

    - **反轉或整理**：短期（少於 3 個月）的空頭反轉排列。

    - **失敗率**：24%。

    - **平均跌幅**：19%，最經常發生報酬率 10%。

    - **成交量趨勢**：當天成交量很大，但迅速萎縮。

    - **回升**：71%。

    - **其他名稱**：高潮日，賣壓高潮。


    ### 底部排列


    - **外觀**：單日的向下突兀長線形，在盤中高價附近收盤。

    - **反轉或整理**：短期（少於 3 個月）的多頭反轉排列。

    - **失敗率**：17%。

    - **平均漲幅**：26%，最經常發生報酬率 10%~15%。

    - **成交量趨勢**：當天成交量很大，但迅速萎縮。

    - **回挫**：61%。

    - **其他名稱**：高潮日，賣壓高潮。


    「摘要資料」給我們的唯一大驚奇是：單日反轉排列（one-day reversals）的績效理想程度遠超過預期。沒錯，頭部排列失敗率 24% 高於我認為可靠排列所允許發生的最高失敗率
    20%，但已經較預期情況好多了。頭部排列的平均跌幅為 19%，非常接近整體空頭排列的平均水準 20%。可是，底部反轉排列的平均漲幅只有 26%，遠低於整體多頭排列的平均水準
    40%。不論頭部或底部排列，最經常發生漲幅或跌幅都在 10% 到 15% 之間，大體上符合預期。可是，請注意，單日反轉——顧名思義——的關鍵走勢發生在一天之內，等到你察覺盤勢的變化，恐怕已經太遲了；換言之，你通常不可能實際掌握統計數據所顯示的績效。


    頭部排列經常發生回升走勢（發生頻率大約有 71%），這意味著賣出持股或放空股票的動作可以稍微延遲。底部排列發生回挫走勢的頻率稍低，這方面的操作不可期待過高。


    ## 緣起


    圖 28.1 顯示一個不太對稱的頭肩頂排列，「頭」部本身是單日反轉排列。整個頭肩頂型態發生在一段延伸性漲勢末端，整段走勢起漲於 1995 年 1 月份。單日反轉排列的收盤價幾乎就是盤中最低價，線形向上突兀的程度遠超過最近一年內的大多數突兀線形。


    圖 28.2 提供一個單日反轉底部排列的例子。這個底部型態發生在短期下降趨勢末端。單日反轉發生之前，股票大約維持兩個月的跌勢。單日反轉線形的收盤價位在盤中高價附近，


