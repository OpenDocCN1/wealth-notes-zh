    ## 交易範例


    黛妮兒負責管理家裡的財務。爲了提升儲蓄的報酬，她也從事股票短線操作。最初幾筆交易還算順利，所以她有勇氣從事圖 43.6 的交易。


    黛妮兒非常聰明，反應敏銳，精力旺盛，能夠接受一般人所不能承擔的壓力。由於這些心理特質，所以她敢在 1 月初進場放空股票。爲了提高獲利潛能，她不願意等待價格跌破確認水準，決定在三重頂排列正式完成之前進場。結果，空頭部位的成交價格爲
    $21 \frac{1}{2}$ 。


    進場的隔天，價格向上反彈，幾天之後形成第四個峰位，黛妮兒決定繼續持有部位。這項決策顯然很明智，價格完成第四個峰位之後，出現一段暴跌走勢。價格雖然跌破三重頂的確認水準
    $17 \frac{3}{4}$，但沒有進一步下跌。


    根據黛妮兒的觀察，三重頂似乎已經成爲多重頂，而且最後兩個谷底很可能演變爲雙重底排列。現在，價格每向上跳動一檔，雙重底排列就愈可能完成，空頭部位的既有獲利也就減少一檔。所以，她雖然繼續持有部位，但心情非常緊張。


    最後，她實在無法繼續承擔壓力與煎熬，終於決定在 $22 \frac{1}{4}$

    認賠回補空頭部位。出場的一個星期之後，股價開始下跌，而且跌勢愈來愈猛烈。


    股價在支撐區 $16 附近盤整一個多月，最後還是順利貫穿。價格繼續下跌，直到 $9^{3}/_{8}$ 才見底，遠低於三重頂排列的預估目標價位 $12^{1}/_{8}$，也遠低於黛妮兒最初的進場點
    $21^{1}/_{2}$。


    在這筆交易中，黛妮兒發生兩項錯誤。第一，進場點沒有等待價格向下突破三重頂的確認水準，出場點也沒有等待價格向上穿越雙重底的確認點。如果等待確認，她就不會因為雙重底排列而被迫出場，因為這個潛雙重底根本沒有演變爲真正的雙重底。


    第二，耐心不足，沒有讓這筆交易獲得應有的時間。大多數情況下，如果行情發展不利於部位，最好及早認賠出場，尤其是空頭部位，因為放空股票可能發生無限的損失。可是，某些情況下還是一點耐心，這筆交易就是例子。只要設定適當的停損，就應該忍受正常的價格波動。由於三重頂排列的三個峰位代表後續走勢的壓力，空頭部位的停損可以設定在三


