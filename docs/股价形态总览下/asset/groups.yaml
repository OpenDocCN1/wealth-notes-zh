    圖 41.5 是等腰三角形頭部排列向下突破的跌幅次數分配，顯示這種排列最可能發生的跌幅。我們發現，跌幅介於 10% 到 15%之間的案例最多，佔 25%；所以最經常發生跌幅為
    15%。另外，大約有半數案例（46%）的跌幅小於 15%，77%的案例跌幅小於 25%。如果你打算針對等腰三角形頭部排列向下突破進行放空，績效恐怕沒有預期的高。


    圖 41.6 顯示排列向上突破的漲幅分配情況，20%的欄位最高，最經常發生漲幅爲 20%。請注意，大約只有三分之一排列的漲幅低於 20%。所以，由比較樂觀的角度說，漲幅超過
    20%的案例佔 65%。既然漲幅如此偏高，衡量法則的運作續效應該很不錯。確實如此，大約有 81%的排列完成目標價位。我認爲，這個比率只要超過 80%，就屬於可靠排列。向下突破的情況較差，目標價位達成率只有
    62%。關於衡量法則的計算細節，請參考「交易戰術」一節。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_362_0.png)


    大部分突破點發生在排列時間寬度的 80%到 85%位置。


    所謂排列時間寬度是指排列起點到三角形頂點的距離，我計算排列起點到突破點的距離，然後把後者表示為前者的百分率。關於所有案例的突破位置分配狀況，請參考圖 41.7。我們發現，許多排列的突破位置都落在排列時間寬度的
    80%到 85%之間。最初，我認爲等腰三角形應該與上升或下降三角形一樣，突破發生在排列時間寬度的三分之二位置。可是，實際的資料顯示，等腰三角形的突破時間較遲。這讓態度積極的交易者，更有機會運用排列內的上下擺動來回操作：在排列下限買進或回補，在排列上限賣出或放空。


    ## 表 41.3 等腰三角形頭部排列的提前突破統計數據


    | 說明 | 向上突破 | 向下突破 |

    | :--- | :--- | :--- |

    | 發生提前突破的排列數量 | 23/162 或 14% | 18/93 或 19% |

    | 向上提前突破的排列數量 | 5/162 或 3% | 15/93 或 16% |

    | 向上提前突破的成交量 | 25 天移動平均的 88% | 25 天移動平均的 116% |

    | 向下提前突破的排列數量 | 20/162 或 12% | 9/93 或 10% |

    | 向下提前突破的成交量 | 25 天移動平均的 229% | 25 天移動平均的 66% |

    | 同時發生向上與向下提前突破的排列數量 | 2/23 或 9% | 6/18 或 33% |

    | 向上提前突破發生在排列時間寬度上的位置 | 76% | 74% |

    | 向下提前突破發生在排列時間寬度上的位置 | 72% | 71% |


    *附註：相對於真正突破，提前突破的發生時間稍早，成交量也較小。*


    表 41.3 列示提前突破的相關統計數據。所謂「提前突破」，是指收盤價穿越到排列之外，但很快——通常是一天之內——又折返到排列之內。提前突破的情況不經常發生，不論向上或向下突破，發生的頻率都不超過
    20%。


    提前向上突破比較經常發生在真正的向下突破排列內。向下突破排列發生提前向上突破的頻率為 16%，向上突破排列發生提前向上突破的頻率只有 3%。提前向上突破發生在真正向上突破排列中，成交量低於平均水準；提前向上突破發生在真正向下突破排列中，成交量高於平均水準。對於向上突破排列，提前向上突破的成交量是
    25 天移動平均量的 88%；對於向下突破排列，提前向上突破的成交量是 25 天移動平均量的 116%。向下突破排列發生提前向下突破的頻率只有 10%，向上突破排列發生提前向下突破的頻率則有
    12%。關於提前向下突破成交量，情況與提前向上突破剛好相反，發生在真正向上突破的排列內，成交量大於平均水準（25 天移動平均量的 229%），發生在真正向下突破的排列內，成交量小於平均水準（25
    天移動平均量的 66%）。如果真正突破方向朝下，大約有三分之一的案例同時發生向上與向下的提前突破。


    相對於真正突破來說，提前突破發生的時間較早（提前突破位在排列時間寬度的 71%到 76%之間，向上與向下真正突破則分別位在 78%與 79%）。如果你發現某個突破的發生時間較正常狀況提早，而且成交量又偏低，最好放棄這個機會。


    表 41.4 列示等腰三角形頭部排列的突破統計數據。排列突破之後，發生回挫與回升走勢的可能性大約為 58%與 59%。這方面的數據還沒有高到足以把回挫與回升走勢納入交易計畫中，但它們確實代表加碼的機會。回挫與回升走勢平均需要
    13 天與 10 天才能回到排列邊緣或三角形頂點。


    *> 譯按：不論真正突破方向如何，發生反向提前突破的可能性較高（這類的突破通常稱為「假突破」），發生相同方向提前突破的可能性較低；另外，反向提前突破的成交量較大，相同方向提前突破的成交量較小。事實上，前述現象似乎普遍存在於所有的排列內，不僅侷限於等腰三角形頭部排列。*


    | 表 41.4 | 等腰三角形頭部排列的突破統計數據 | | |

    | :--- | :--- | :--- | :--- |

    | **說明** | | **向上突破** | **向下突破** |

    | 發生回挫/回升走勢的排列 | | 94/162 或 58% | 55/93 或 59% |

    | 完成回挫/回升走勢的平均時間 | | 13 天 | 11 天 |

    | 到達最終高點/低點的天數 | | 6.5 個月（192 天） | 2 月（70 天） |

    | 突破位置在最近 12 個月價格區間的下緣、中央或上緣 | | 下緣 7%，中央 22%，上緣 71% | 下緣 10%，中央 30%，上緣 61% |

    | 前述突破位置的平均漲幅/跌幅 | | 下緣 29%，中央 35%，上緣 40% | 下緣 23%，中央 20%，上緣 20% |


    突破位置通常落在年度價格區間的哪裡呢？不論向上或向下突破，半數以上的排列突破點發生在年度價格區間三等份的上緣。這個結果或許不令人覺得意外，因為—根據定義—頭部排列是發生在一段價格漲勢之後，所以排列的發生位置偏高。突破點發生在年度價格區間三等份上緣、中央與下緣的排列，它們的績效各自如何呢？對於向上突破，突破點發生在上緣的排列績效最理想（平均漲幅為
    40%），突破點發生在下緣的排列績效最差（平均漲幅 29%）。至於向下突破，三個區間的平均跌幅都在 20%左右，其中以突破點發生在下緣的排列績效最理想（平均跌幅為
    23%）。這些統計數據顯示一個現象：強者恆強，弱者恆弱。如果你打算放空，最好挑選那些股價創新低者。如果股價創新高，走勢可能繼續上揚。


    ### 表 41.5 等腰三角形頭部排列的成交量統計數據


    | 說明 | 向上突破 | 向下突破 |

    | :--- | :--- | :--- |

    | 成交量型態呈現下降趨勢的排列數量 | 131/162 或 81% | 79/93 或 85% |

    | 相對於突破前一天，突破當天與隨後 5 天的成交量 | 167%，170%，161%，137%，124%，136% | 153%，173%，154%，132%，117%，132%
    |

    | 小量突破是否比較容易發生回挫或回升走勢？ | 否 | 是 |

    | 大量/小量突破的平均績效 | 38%/35% | 21%/20% |


    表 41.5 列示等腰三角形頭部排列的成交量相關統計數據。如果衡量排列內成交量時間序列的迴歸直線斜率，絕大部分排列（80%以上）的成交量都呈現下降趨勢。我們發現，排列發生突破之後的隨後一個星期內，成交量通常都高於正常水準。這意味著交易者在晚上得知排列發生突破，隨後幾天陸續進場操作。


    小量突破是否比較容易發生回挫或回升走勢？這個問題需要分兩部分回答。首先，讓我界定小量與大量的意義：小量突破是指突破當天的成交量為 25 天移動平均量的 50%或以下，大量突破是指突破當天的成交量為
    25 天移動平均量的 150%或以上。小量向上突破發生回挫走勢的比率只有 6%，大量向上突破發生回挫走勢的比率為 56%。另一方面，小量向下突破發生回升走勢的比率有
    24%，大量向下突破發生回升走勢的比率為 20%。請注意，兩種情況的樣本都很小，這或許可以解釋它們的結論何以相互衝突。


    大量突破是否能夠驅動較大的價格走勢？對於向上突破，大量突破的平均漲幅為 38%，小量突破為 35%。至於向下突破，大量與小量突破的績效很接近，平均跌幅分別為
    21% 與 20%。唯有小量突破的結論具有統計上的顯著意義，大量突破的結論可能純屬巧合。


    ### 交易戰術


    表 41.6 列示等腰三角形頭部排列的交易戰術。第一個戰術是估計價格走勢的程度。圖 41.8 說明如何運用衡量法則來估計等腰三角形頭部排列的目標價位。


    整個三角形的最低價，是排列起點的 $18^{7}/8$（B 點），最高價是 $23^{1}/2$（A 點），所以三角形高度是 $4^{5}/8$ （$=23^{1}/2-18^{7}/8$）。對於向上突破，由最高價向上衡量排列高度，結果是
    $28^{1}/2$ （$=23^{1}/2+4^{5}/8$）。對於向下突破，由最低價向下衡量排列高度，結果是 $14^{1}/4$ （$=18^{7}/8-4^{5}/8$）。這些價位屬於最低目標價位，通常都能夠完成，尤其是向上突破。


    我們知道，等腰三角形通常都扮演既有中期趨勢的連續型態，反轉型態的發生頻率較低。所以，在操作上，通常應該預期排列將朝既有的中期趨勢方向突破。如果排列發生之前的中期價格趨勢朝上，通常都會向上突破，而且繼續上漲。


    ### 表 41.6 等腰三角形頭部排列的交易策略


    | 交易策略 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算排列最高點與最低點之間的高度，由最高點向上衡量或由最低點向下衡量排列高度，結果就是向上突破或向下突破的最低目標價位。另外，等腰三角形也可能發生在一段走勢的中點，依此衡量目標價位。
    |

    | 順勢交易 | 等腰三角形屬於連續排列的可能性稍高，所以價格可能朝排列發生之前的中期趨勢方向進行突破。 |

    | 等待突破 | 爲了防範等腰三角形反轉型態，務必等待實際的突破。 |

    | 停損 | 向下突破的空頭部位，可以把停損設定在最高價上方 1/8 點處；向上突破的多頭部位，可以把停損設定在排列最低價下方 1/8 點處*。如此設定的停損如果太寬，可以考慮其他的支撐或壓力水準；一旦價格朝有利方向發展，應該調整停損點。
    |

    | 排列內交易 | 如果三角形的排列規模很大，可以考慮在排列下限買進或回補，在排列上限賣出或放空。可是，當排列發展而逐漸接近三角形頂點，就停止排列內的交易。
    |


    可是，等腰三角形頭部排列大約有三分之一的機會出現反轉型態，操作上或許還是應該等待實際突破。一旦收盤價突破到排列之外，順著突破方向建立部位（換言之，向上突破則買進，向下突破則放空）。


    *> 譯按：如何設定停損，當然是見仁見智的問題。但是，對於等腰三角形，停損位置通常是以遠逃的趨勢線爲基準（換言之，向上突破的停損設定在排列下限的下方，向下突破的停損設定在排列上限的上方）。這通常已經是最寬鬆的停損（除非突破位置太接近三角形頂點，或三角形的高度太小）。*

    '
