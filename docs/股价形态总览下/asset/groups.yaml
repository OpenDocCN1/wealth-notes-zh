    表 44.3 顯示提前突破的統計數據。在所有 125 個案例當中，其中有 34 個排列曾經發生向上或向下提前突破\*，大部分提前突破的方向朝下（25 個），剩餘的提前突破朝上（15
    個）。某些排列同時發生向上與向下的提前突破（參考圖 44.6）。


    提前突破的方向朝上，但真正的突破方向朝下，發生這種情況的機會有多高呢？在所有 125 個案例當中，總共只發生 3 次（相當於 2%）。


    是否有任何徵兆，可供判別提前突破與真正突破？沒有。就突破發生在排列寬度的平均位置而言（換言之，分別衡量排列起點到突破點的距離，以及排列起點到楔形頂點之間的距離，然後把前者表示爲後者的百分率），提前突破爲
    61%，真正突破爲 65%。


    成交量也不能提供任何線索。如果以突破當時的 25 天期移動平均量爲基準，提前突破當天的成交量是基準量的 153%，類似於真正突破的情況。換言之，提前突破看起來就像真正的突破。


    表 44.4 顯示真正突破的成交量相關統計數據。平均來說，突破點位在排列寬度的 65%處。如果分析排列漲幅與突破點位置的相關散佈圖（correlation
    scatter chart），我們發現最強勁的突破點落在排列寬度的 50% 到 80% 之間。這個區間的中心點 65% 剛好是突破點落在排列寬度的平均位置。


    在全部 125 個案例當中，向上突破的排列有 115 個（佔 92%），其他爲向下突破（佔 8%）。5% 失敗的案例只有 2 個；換言之，價格向上突破之後，沒有出現
    5% 或以上的跟進漲勢。


    向上突破之後，只有 47% 的排列發生回挫走勢。發生頻率太低而不能預先納入操作考量（例如：把回挫走勢設定為進場點）。完成回挫走勢的平均期間為 12 天。


    對於成功向上突破的排列，由突破點衡量到最終高點的平均期間為 206 天。所謂「最終高點」，是指既有上升趨勢向下反轉為下降趨勢的轉折高點，由此轉折高點向下衡量的價格跌幅至少為
    20%。


    下降楔形排列通常發生在年度價格區間的哪個位置呢？如果把排列突破當時的最近 12 個月價格區間劃分為三等份（上線、中央與下線），大部分排列（44%）的突破點落在年度價格區間下線；另外，突破點落在这个位置的排列績效最理想，平均漲幅為
    47%。突破點發生在年度價格區間上線的排列，平均漲幅只有 36%，績效顯然較差。


    前述現象似乎不同於其他多頭排列。一般來說，績效表現最佳的多頭排列，突破點都落在年度高價附近。由於強者恆強，動能玩家通常偏愛介入強勢股。可是，對於下降楔形排列，情況卻非如此。為什麼？或許是因為樣本太小的緣故。


    表 44.5 列出下降楔形排列的成交量相關統計數據。大部分案例（72%）的成交量呈現下降趨勢。我是藉由成交量時間序列的迴歸直線斜率歸納出成交量趨勢的結論。另外，透過本章提供的一些走勢圖，我們也可以看見成交量趨於下降的現象。


    表 44.5 也顯示突破當天與隨後 5 天的成交量數據。突破當天的成交量最大，隨後幾天雖然繼續維持大量，但呈現下降趨勢。這意味著投資人一旦察覺排列向上突破，買盤力道立即轉強。


    小量突破是否比較容易發生回挫走勢？不，剛好相反，大量突破比較容易發生回挫走勢；事實上，這種現象普遍存在於其他股價型態。對於下降楔形排列來說，小量突破與大量突破發生回挫走勢的比率差異並不大，前者為
    40%，後者為 42%。補充說明一點，所謂「大量」或「小量」是指當天成交量為 25 天移動平均量的 150%以上或 50%以下。


    \* 譯按：同時出現向上與向下提前突破的案例總共有 6 個，不包含在這 34 個排列內。換言之，34+6=25+15。


