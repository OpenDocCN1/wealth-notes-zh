    # 緣起


    週線向下關鍵反轉的形狀如何？爲何產生？圖 46.1 提供兩個例子。左側排列發生在價格峰位的一週之後，它代表一段延伸性跌勢的起點，價格由$37^{3}/_{8}
    下跌到$10^{3}/_{8}，跌幅高達 72%。右側排列發生在 1992 年 12 月初，落在價格峰位的兩週之後。由於下降趨勢已經開始，這個關鍵反轉線形只是用來確認價格繼續下跌。關於前述這個結論，我自己也不太滿意，因爲我認為有效的關鍵反轉必須發生在上升趨勢的峰位或附近。


    舉例來說，圖 46.1 左側的關鍵反轉相當接近上升趨勢的


