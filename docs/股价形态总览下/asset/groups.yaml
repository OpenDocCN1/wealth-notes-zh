    \n## Kulicke and Soffa（半導體資本設備，NASDAQ，代碼 KLIC）\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_322_0.png)\n\
    \n圖 39.6 下降三角形的衡量法則。我們可以透過兩種方法衡量排列向下突破之後的最低目標價位。在三角形的起點，計算兩條趨勢線之間的差值（圖形標示兩個黑點之間的距離），由排列下限向下衡量前述三角形高度。或者，在排列下限左端的起點，繪製一條與排列上限相互平行的直線；排列向下突破的時候，該平行線的對應價格就是目標價位。兩種方法顯示的目標價位都是\
    \ $5。\n\n向下突破的時候，該平行線的對應價格就是目標價位。\n\n由於排列的失敗率頗高，最好等待收盤價實際穿越排列上限或下限，然後才採取行動。如果你預計下降三角形將向下突破，並且在排列發展過程內放空股票，結果可能經常碰到向上突破的情況。請注意，即使等待收盤價實際突破排列下限，放空股票的風險也很高，未必適合一般投資人。如果你基於某些緣故而錯失向下突破的放空機會，可以把回升走勢視為第二次進場機會。回升走勢也代表空頭部位的加碼良機。當下跌走勢接近目標價位，或者股票的基本面或技術面發生根本變動，考慮回補空頭部位。\n\
    \n由於向下突破的價格變動速度通常很快，所以在回升走勢進場，放空價位經常可以更高。如果你打算等待回升走勢，結果回升走勢並沒有發生，大可另外尋找交易對象，千萬不要追價。\n\
