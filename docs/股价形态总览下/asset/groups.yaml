    ### 失敗案例


    圖 38.5 顯示第一種失敗情況：5%失敗。嚴格來說，這並不是一個 5%失敗案例（因為向上突破的漲幅為 6%），但形狀看起來非常典型。所謂的 5%失敗，是指價格向上突破之後，沒有出現
    5%或以上的跟進漲勢，立即又折返而跌破排列的低點。目前這個例子，向上突破的位置是$6^{1/8}$，突破之後的高價是 $6^{1/2}$，漲幅為 6%，足以歸納為成功的排列。上升三角形很少
    發生 5%失敗的情況，只有 2%左右。


    圖 38.6 顯示另一種比較常見的失敗情況，價格向下突破， 而且繼續走低。為了協助辨識這個例子的排列，我把轉折高點 與轉折低點標示為 1、2……6。排列上限為水平狀，排列下限
    朝右上方傾斜。如果你對照表 38.1 的辨識準則，將發現這個 例子的唯一「古怪」之處是成交量型態：趨勢朝上。辨識股價 型態的過程中，我通常不考慮成交量型態，因為我經常碰到一
    些股價排列非常典型的走勢，但成交量型態不符合。目前這個 例子就是如此。所以，我不會因為成交量的緣故而否決這個排


