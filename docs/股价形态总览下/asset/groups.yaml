    黛妮兒負責管理家裡的財務。爲了提升儲蓄的報酬，她也從事股票短線操作。最初幾筆交易還算順利，所以她有勇氣從事圖 43.6 的交易。


    黛妮兒非常聰明，反應敏銳，精力旺盛，能夠接受一般人所不能承擔的壓力。由於這些心理特質，所以她敢在 1 月初進場放空股票。爲了提高獲利潛能，她不願意等待價格跌破確認水準，決定在三重頂排列正式完成之前進場。結果，空頭部位的成交價格爲
    $21 \frac{1}{2}$ 。


    進場的隔天，價格向上反彈，幾天之後形成第四個峰位，黛妮兒決定繼續持有部位。這項決策顯然很明智，價格完成第四個峰位之後，出現一段暴跌走勢。價格雖然跌破三重頂的確認水準
    $17 \frac{3}{4}$，但沒有進一步下跌。


    根據黛妮兒的觀察，三重頂似乎已經成爲多重頂，而且最後兩個谷底很可能演變爲雙重底排列。現在，價格每向上跳動一檔，雙重底排列就愈可能完成，空頭部位的既有獲利也就減少一檔。所以，她雖然繼續持有部位，但心情非常緊張。


