    根據我的統計數據顯示，突破點落在排列寬度的 50%到 80%之間（這個區間的中心點大約是排列寬度的三分之二），漲勢最爲強勁。所謂「強勁」，是指突破點落在前述區間內的排列平均漲幅最大。


    # # 緣起


    圖 44.1 提供一個下降楔形排列的例子。價格跌勢起始於 1992 年 1 月份，由當時的峰位$75¼開始下跌，持續發展到楔形排列的起點$52¼。價格稍微反彈——下降趨勢的向上修正——形成轉折高點而繼續下跌。7
    月底，價格創新低，然後再度反彈。向上動能顯然不足以讓反彈走勢穿越先前的高點。8 月份期間，價格繼續上下擺動。


    對於 7 月初到 8 月底之間的價格來回穿梭走勢，如果分別沿著轉折高點與轉折低點繪製趨勢線，結果是兩條向下傾斜而向右收斂的趨勢線，它們界定一個下降楔形排列，請參考圖
    44.1 的結構。這種排列屬於相當罕見的股票型態。'
