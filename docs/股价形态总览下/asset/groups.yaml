    25% 與排列隨後向上突破，這兩個事件是否存在關聯？同樣地，我也考慮收盤價落在下端 25% 與排列向下突破，兩者之間是否存在統計上的相關性？結果，沒有證據顯示內側日前一天收盤價位置與排列突破方向之間存在關聯。


