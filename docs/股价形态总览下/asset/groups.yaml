    # 辨識準則


    下降三角形具有一些特點，很容易辨識。請參考圖 39.2 的兩個例子。1993 年 3 月與 4 月之間出現一個下降三角形排列，使得 1992 年底以來的價格上升趨勢在此告一段落。3
    月初，價格夾著相對大量上漲，出現峰位而回檔，下跌走勢在 $29 \frac{1}{2}$ 附近獲得支撐。價格向上反彈，這次漲勢的高點稍微下滑，隨後的跌勢又回到先前的支撐位置。4
    月上旬，價格做出最後一次反彈，該波段的轉折高點又下滑，然後夾著大量直接貫穿下檔支撐。


    如同一顆皮球由高處落到地板上，皮球由地板（支撐）向上彈升，每次的彈升高點都持續下降，使得排列上限朝右下方傾斜。這個例子的底部支撐在 $29 \frac{1}{2}$，呈現水平狀。請注意，在排列之內，銜接波段走勢轉折高點的趨勢線向右下方傾斜，轉折低點銜接而成的排列下限則為水平狀：這是下降三角形的主要特質。另外，價格排列之內，成交量型態呈現下降趨勢。


