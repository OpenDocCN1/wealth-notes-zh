    向上提前突破很罕見，在我們的案例當中只有 6%，突破過程的成交量高於平均水準。表 39.3 倒數第 3 列到第 6 列的數據，嘗試說明提前突破與真正突破的方向關聯。對於提前向下突破的案例，其中有
    53%最後向上突破。其他的方向關聯，百分率讀數都很低。此處沒有考慮少數水平突破的案例。


    表 39.3 最後兩列的數據，嘗試藉由提前突破的發生位置，判別提前與真正突破。由排列起點開始衡量，提前突破的發生位置落在排列整體寬度（由起點到三角形頂點）的
    64%處，這與真正突破位置 68%之間沒有顯著的差異，所以不能藉由突破位置而判別提前或真正突破。另外，提前突破與真正突破的成交量型態也沒有差異，所以也不能藉成交量而判別提前或真正突破。


    最強勁的突破，發生在哪些位置？我繪製突破位置（突破點落在排列寬度的百分率位置）與排列漲幅之間的相關散佈圖（correlation scatter diagram），結果顯示兩者之間沒有顯著的關聯。雖說如此，某些分析師認為最強勁的突破發生在排列寬度的三分之二位置*。


    表 39.4 顯示有效突破的統計數據。向上與向下突破的發生位置幾乎完全相同：分別為排列寬度的 70%與 69%。排列向下突破之後，只有 4%案例不能夠繼續下跌；同樣地，排列向上突破之後，只有
    3%案例發生 5%失敗的情況。由另一個角度說，排列真正突破之後，通常都會繼續朝突破方向發展。舉例來說，如果排列向下突破，價格應該繼續下跌。


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 向上突破發生在排列寬度的位置 | 70% |

    | 向下突破發生在排列寬度的位置 | 69% |

    | 向下突破而失敗的案例 | 27/689 或 4% |

    | 向上突破而成功的案例 | 19/689 或 3% |

    | 向上突破案例 | 283/689 或 41% |

    | 向下突破案例 | 370/689 或 54% |

    | 水平突破案例 | 36/689 或 5% |

    | 發生回挫走勢案例 | 109/283 或 39% |

    | 發生回升走勢案例 | 236/370 或 64% |

    | 完成回挫走勢的平均期間 | 12 天 |

    | 完成回升走勢的平均期間 | 12 天 |

    | 成功排列到達最終低點的天數 | 2 個月 (66 天) |

    | 突破點落在最近 12 個月價格區間的下線、中央或上線 | 下線 33%, 中央 32%, 上線 35% |

    | 突破點落在前述位置的平均跌幅 | 下線 21%, 中央 17%, 上線 17% |


    附註：價格通常會朝突破方向繼續發展，但操作上不要事先預期突破方向。


    在所有的案例當中，向上突破的發生機會為 41%，向下突破為 54%，其餘為水平突破——價格橫向發展，穿越三角形頂點而不了了之。由於傳統技術分析認為下降三角形應該向下突破，表
    39.4 的數據難免令人擔心，向下突破的機會為 54%，只不過稍高於隨意猜測。


    排列向上突破之後，發生回挫走勢的案例佔 39%。向下突破之後，發生回升走勢的機會較高 (64%)。可是，如果準備針對回升走勢擬定操作策略，64%的讀數又太低；換言之，如果你打算放空某個下降三角形，不要期待排列向下突破之後還會發生回升走勢。


    排列突破之後，完成回挫或回升走勢的平均期間都是 12 天。請注意，如果前述折返走勢的完成期間超過 30 天，則視為正常的價格波動，不再屬於回挫或回升走勢。


    排列向下突破之後，到達最終低點的平均期間為 66 天。觀察前述期間的次數分配顯示，絕大部分案例 (72%) 到達最終低點的期間都不超過 90 天，所以我把下降三角形歸納為短期排列。


    突破點通常落在年度價格區間的哪個位置呢？如果把突破當時的最近 12 個月價格區間劃分為三等份（上緣、中央與下緣），向下突破位置大多發生在年度高價附近，但中央與下緣的比率也差不多。至於前述三個突破位置的績效，則以年度低價附近的下降三角形最理想，平均跌幅為
    21%。其他兩個區間的平均跌幅都是 17%。所以，處於弱勢狀態的股票（股價在年度低價附近），表現仍然最弱。換言之，如果你打算放空股票，應該尋找股價創新低——不是創新高——的對象。


    表 39.5 提供成交量的相關統計數據。針對排列起點到突破之前的成交量時間序列計算迴歸直線，我們發現大多數下降三角形（72%）的成交量型態呈現下降趨勢。我觀察突破成交量與
    25 天移動平均量的關係，表 39.5 顯示比較的結果。最大成交量發生在突破的隔天，顯示投資人察覺突破之後，於隔天進場。隨後幾天內，仍然保持相當大的成交量。


    小量突破之後，是否比較經常發生回升走勢？沒有證據顯示如此。我把大量與小量分別定義為當時 25 天移動平均量的 150%以上與 50%以下，然後統計兩種突破量的回升走勢發生頻率。大量突破發生回升走勢的頻率為
    56%，超過小量突破的 44%。


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 成交量呈現下降趨勢的案例數量 | 494 或 72% |

    | 相對於 25 天移動平均量，突破當天與隨後 5 天的成交量 | 158%，168%，136%，136%，135%，123% |

    | 大量突破與小量突破發生回升走勢的頻率 | 56%／44% |

    | 大量突破與小量突破的排列平均跌幅 | 18%／17% |


    附註：突破當天爆出大量之前，排列內的成交量型態呈現下降趨勢。


    最後，我認為向下突破成交量與隨後跌幅之間不存在顯著的關聯。為了檢定這項假設，我按照前一段方式把向下突破的成交量劃分為大量與小量。結果，大量突破的排列平均跌幅為
    18%，小量突破為 17%，兩者之間沒有顯著的差異。換言之，對於所持有的空頭部位，如果下降三角形發生大量向下突破，不要期待過高；大量突破的績效未必超過小量突破。


    ## 交易戰術


    表 39.6 列示下降三角形的交易戰術，首先討論衡量法則。衡量法則用來估計排列向下突破之後的目標價位。在排列起點計算三角形的高度（換言之，在三角形的起點，把排列上限左端的高價，減去排列下限左端的低價），由排列下限向下衡量三角形高度，結果就是向下突破之後的最低目標價位。


    讓我們利用圖 39.6 說明如何計算三角形的高度。考慮排列上限與下限位在三角形起點的價格（圖形標示的兩個黑點），計算這兩個價位的差值，結果是 $1\frac{17}{8}$（=$9\frac{1}{4}$-$7\frac{3}{8}$）。由排列下限（$7\frac{3}{8}$）向下衡量三角形高度，如此預測的目標價位為
    $5\frac{1}{2}$（=$7\frac{3}{8}$-$1\frac{7}{8}$）。排列向下突破之後，2 天內就滿足目標價位，相當於 25% 的跌幅。由於衡量法則所計算的是最低目標價位，實際的價位可能更低。就目前這個例子來說，1994
    年 4 月中旬的最低價為 $4.69，整個跌幅為 36%。


    另一種衡量方法，可以避免繁瑣的數學運算。在排列下限左端的起點，繪製一條與排列上限相互平行的直線；當排列

