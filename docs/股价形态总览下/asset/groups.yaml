    ### Varco International（油田服務／設備，NYSE，代碼 VRC）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_345_0.png)


    圖 40.8 等腰三角形底部排列的目標價位衡量法則。排列高度等於最高價（B 點）減去最低價（A 點）。由最高點（B 點）向上衡量排列高度。實際交易在 1 個月內獲利
    27%。


    由於不能有效判斷突破的方向，最好等待突破實際發生。某些情況下，價格可能漫無目的的通過三角形頂點，沒有發生所謂的突破。這類情況相當罕見，但畢竟還是會發生。一旦價格突破之後，順著趨勢方向進行交易：價格向上突破則買進，向下突破則放空。


    我發現，即使價格朝既有趨勢的反方向進行突破，經常也會很快反轉方向，仍然朝既有趨勢方向發展。舉例來說，在價格上升趨勢中，三角形向下突破，下跌 10% 或 15%
    之後，價格又開始朝上發展。請留意這類反轉行爲，尤其是發生在大多頭市場內的三角形排列向下突破。


    三角形的另一種操作方法，是在排列下限附近買進，然後在排列上限附近反轉為空頭部位。某些等腰三角形既寬又長，允許你在排列之內進行前述的操作，但手腳必須非常俐落。如果經驗不足，最好先在紙上模擬交易。


    ## 交易範例

    你是否能夠在等腰三角形排列賺錢？可以的，不妨考慮我如何針對圖 40.8 進行交易。促使我介入這支股票的理由很多，包括：鑽油設備數量增加、油價上漲、氣候嚴寒，以及其他相關政治事件
    (石油輸出國家組織可能對奈及利亞實施石油禁運)。所有這些發展都意味著冬季的油價將繼續上漲，油田服務產業的需求持續旺盛。


    驅使我進行交易的另一個因素，是當時的股票價格正沿著趨勢通道的下線發展。關於趨勢通道的繪製方法，程序有些複雜。我針對收盤價繪製迴歸直線，然後利用這條迴歸直線做為中心，分別加上與減去收盤價的兩個標準差
    (standard deviations)，在迴歸直線之上與之下分別繪製一條平行線，這兩條平行線所界定的區域即是趨勢通道。圖 40.8 顯示趨勢通道的上限，沒有顯示下限，但下限穿越
    A 點而與上限平行。如果這條趨勢通道繼續有效，隨後的價格走勢將朝上限發展。


    由於價格夾著小量突破三角形排列，我決定暫時不採取行動，等待價格回挫。當然，這種方法涉及一些風險，因為價格可能一路走高而不回頭。可是，這個例子確實發生回挫走勢。12
    月 1 日，我進場買進股票，成交價格為 $9^{1}/8$。


    三角形頂點經常成為後續價格走勢的支撐或壓力。回挫走勢停頓於三角形頂點，並且在該處盤旋 3 天，然後向上彈升，正式展開漲勢。雖然價格走勢很快滿足排列高度預測的目標價位，但我懷疑股價可能繼續上漲而穿越通道上限。股價完成目標價位之後，就在迴歸直線附近形成峰位而拉回整理（圖形內沒有顯示收盤價的迴歸直線，但它大約落在通道上限與
    A 點的中間）。這是相當正常的發展，我早就有心理準備。


    經過一個星期左右的整理，價格又開始走高，很快創新高價。當價格觸及趨勢通道上限的時候，我曾經考慮獲利了結，但基於節稅的緣故而没有賣出。我決定繼續持有股票到隔年——只差
    2 個交易日而已。1 月 2 日，我賣出股票，成交價格為 $11^{5}/8$。由於延遲兩天賣出，使得報酬率由原來的 40% 降低為 27%。雖說如此，對於
    1 個月的投資期間來說，這仍然是不錯的績效。


    ## 等腰三角形頭部排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_348_0.png)


    ### 摘要資料


    **向下突破**

    - 外觀：排列之前的價格趨勢朝上，排列內轉折高點不斷下滑，轉折低點不斷墊高；排列上限向下傾斜，排列下限向上傾斜，兩條趨勢線向右收斂。向下突破。短期（3 個月以內）的空頭反轉走勢。

    - 反轉或整理失敗率：6%。

    - 平均跌幅：20%，最經常發生跌幅為 15%。

    - 成交量趨勢：下降。

    - 提前突破：19%。

    - 回升：59%。

    - 目標價位：達成功率 62%。

    - 意外發現：提前突破的發生時間稍早於真正突破，成交量也經常較小。

    - 其他名稱：螺旋。

    - 參照排列：(20) 頭肩頂排列，(37) 鯊鰭排列，(38) 上升三角形排列，(39) 下降三角形排列，(40) 等腰三角形底部排列。


    **向上突破**

    - 外觀：排列之前的價格趨勢朝上，排列內轉折高點不斷下滑，轉折低點不斷墊高；排列上限向下傾斜，排列下限向上傾斜，兩條趨勢線向右收斂。向上突破。

    - 反轉或整理：短期（3 個月以內）的多頭整理走勢。

    - 失敗率：5%。

    - 平均漲幅：37%，最經常發生漲幅為 20%。

    - 成交量趨勢：下降。

    - 提前突破：14%。

    - 回升：58%。

    - 目標價位達成率：81%。

    - 其他名稱：螺旋。

    - 參照排列：(20) 頭肩頂排列，(37) 鯊鰭排列，(38) 上升三角形排列，(39) 下降三角形排列，(40) 等腰三角形底部排列。


    如果讀者熟悉等腰三角形排列的話，可能想知道我如何劃分頭部與底部排列。我以排列發生之前的價格趨勢做為基準，如果排列發生之前的價格處於上升趨勢，等腰三角形屬於頭部排列；如果排列發生之前的價格處於下降趨勢，等腰三角形屬於底部排列。我按照價格趨勢劃分排列，原本希望藉此判斷突破方向，結果顯然沒有幫助。本章準備討論等腰三角形頭部排列。


    等腰三角形頭部排列的失敗率偏低，向下突破為 6%，向上突破為 5%。我認為失敗率不超過 20%，就屬於可靠的排列。


    向下突破的平均跌幅為 20%，大約對等於一般的空頭排列。向上突破的平均漲幅為 37%，稍差於一般多頭排列的續效（40%）。可是，就目標價位達成率來說，向上突破為
    81%。我認爲目標價位達成率超過 80%，就屬於可靠排列。向下突破的目標價位達成率較差，只有 62%。


    我發現一個有趣的現象，提前突破發生在排列時間寬度的位置大約介於 71% 到 76%（真正突破則位在 78% 到 79% 之間），而且突破量往往很小。


    ## 緣起

    圖 41.1 顯示等腰三角形頭部排列的例子。價格處於上升趨勢，5 月中旬創新高，並且開始形成等腰三角形排列，波段高點持續下滑，低點不斷墊高。經過兩個月的整理之後，價格型態已經非常明顯，銜接轉折高點的排列上限向下傾斜，銜接轉折低點的排列下限向上傾斜。


    在排列之內，成交量大體上呈現下降趨勢，雖然偶爾發生突氳大量。6 月底，價格一度嘗試向上突破，但立即被壓回排列內。不久，再度夾著大量向上突破，但很快就發生回挫走勢，價格反而朝下發展。


    等腰三角形基於什麼緣故而形成？頭部排列通常發生在年度高價附近。當時，價格處於上升趨勢，持續創新高價。最後，由於買壓持續累積，上升趨勢終於停頓。動態玩家發現趨勢已經發生變化，開始賣出持股，進一步造成股價壓力。當價格下跌到前一波峰位的支撐，種種理由驅使投資人進場買進。


    ### Kaufman and Broad（建材，NYSE，代碼 KBH）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_351_0.png)


    圖 41.1 等腰三角形頭部排列。排列發生之前，價格處於漲勢。


    於是，價格又開始回升，許多交易者也樂得順勢參與，尤其是在偏低的價位上。


    這種心理造成需求增加，推升股價走高，但前一次沒有及時出場的動能玩家又開始賣出。另外，某些人認為市場動能已經不足以把股價推升到先前的高點，他們也決定提早賣出。這些賣壓使得股價漲勢在較低水準向下反轉。


    價值型投資人看見股價下跌，而且判定經濟基本面沒有發生變化，於是進場買進。某些人低價加碼，另一些人則受到低價引誘而進場買進。這些買盤力道驅使價格跌勢走緩，然後出現橫向整理，最後迫使股價在較高水準向上反彈——因為賣盤沒有理由追殺，買盤心存急迫感。


    隨著股價走勢上下游走，決定賣出或買進的人都已經出場或進場，所以成交量逐漸萎縮，股價的波動幅度也愈來愈小。這相當於暴風雨發生之前的寧靜，買方終於按耐不住，大買單進場，價格向上突破。價格一旦向上突破，可能引發設定在排列上限稍上方的停止買單，造成價格更進一步上漲。


    如果買盤力道足夠強勁，價格將繼續走高。可是，大約有半數的情況，突破之後不久，價格就會反轉而重新進入三角形排列之內。回撤走勢通常會在排列上限或三角形頂點附近獲得支撐。在支撐區域稍做整理之後，價格通常會朝原先的突破方向發展。可是，就圖
    41.1 的例子來說，價格在支撐區稍做停頓之後，接著就繼續下跌，意味著排列發生之前的上升趨勢已經結束。


    ## 辨識準則

