    5%，否則就視爲 5%失敗。另外，當價格由第三個谷底翻身之後，隨後也可能跌破三個谷底的最低點而導致潛在三重底排列失敗。由於這種失敗情況需要相當嚴重的跌勢，所以失敗率偏低。


