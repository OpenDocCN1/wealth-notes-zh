    ## 統計數據


    表 44.2 列示下降楔形排列的一般統計數據。爲了尋找足夠數量的下降楔形，我另外採用 1996 年到 1998 年的資料庫。在兩個資料庫內，總共只找到 125
    個案例，所以下降楔形屬於罕見的型態。大多數排列（62%）屬於既有趨勢的連續型態；換言之，排列完成之後，將繼續朝先前的趨勢方向繼續發展。


    排列失敗率相當低，只有 10%；等待向上突破之後，失敗率可以進一步下降爲 2%。在 125 個案例當中，只有 2 個排列出現 5%失敗情況，剩餘 10 個失敗排列則向下突破。下降楔形排列雖然很少失敗，但辨識上並不容易，而且型態本身也很罕見，這些問題必須事先納入交易計畫之內。就我個人的看法，最好等待價格實際向上突破之後，才進場買進。


    排列的平均漲幅高達 43%，但最終常發生漲幅介於 20% 與 30%之間，請參考圖 44.5。我根據成功下降楔形排列的漲幅，編製這份次數分配圖。如果不考慮最右端漲幅超過
    90%的欄位，兩個最高欄位代表的漲幅分別爲 20%與 30%。所以，

