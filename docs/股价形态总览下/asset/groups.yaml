    ## 內側日排列


    ![img/157738047fa61d5e4bdbaf89f0241a36_21_0.png](img/157738047fa61d5e4bdbaf89f0241a36_21_0.png)


    ### 摘要資料


    #### 向上突破

    - 外觀：某支線形完全被前一支線形吞噬。

    - 反轉或整理：短期（3個月以內）的多頭整理型態。

    - 失敗率：56%。

    - 平均漲幅：13%，最經常發生漲幅介於 0% 與 5% 之間。

    - 意外發現：很多，參考表 24.3。


    #### 向下突破

    - 外觀：某支線形完全被前一支線形吞噬。

    - 反轉或整理：短期（3個月以內）的多頭反轉型態。

    - 失敗率：51%。

    - 平均跌幅：10%，最經常發生跌幅介於 0% 與 5% 之間。

    - 意外發現：很多，參考表 24.3。


    內側日排列（inside days）曾經對我造成嚴重的困擾。對於這個由 2 支線形構成的型態，究竟如何判斷排列成功或失敗呢？關於這個問題的答案，現在看起來很明顯，但當時確實讓我覺得非常困惑。


    根據傳統的看法，內側日發生之後的隔天，應該出現重大的價格走勢；我最後就是按照這個觀點來判定排列成功或失敗。請參考「摘要資料」的失敗率數據，讀數接近 50%——排列成功或失敗，基本上屬於隨機事件*。換言之，內側日發生之後的隔天，半數案例出現重大走勢，另外半數則否。


    某些分析師認為，不能要求內側日隔天就發生重大走勢。操作股票需要有耐心，重大走勢遲早會發生。可是，「遲早」是多久呢？究竟應該等待 2 天？1 個星期？或 1
    個月？換言之，在多久之內發生的重大走勢，才能視為與內側日之間存在重要關聯？


    沒錯，如果把等待時間延長為 2 天或以上，確實有更多的案例在內側日之後發生重大走勢。因此，如果把內側日之後 2 天內發生重大走勢的排列視為成功，結果又如何呢？向上突破的失敗率由
    56% 降低為 46%，向下突破的失敗率則由 51%


    > * 譯按：大部分讀者恐怕不能接受這個結論。某個事件發生與否的機率各佔一半，並不代表該事件屬於隨機事件。所謂重大價格走勢——根據定義——應該屬於不經常發生的罕見事件。舉例來說，假定任何一天發生重大價格走勢的機率為
    10%。如果在內側日隔天發生重大價格走勢的機率為 50%，內側日顯然具有預測意義。換言之，「內側日隔天發生重大走勢」的事件不應該輕易歸類為隨機事件。


    降低為 43%。雖然有所改善，但距離可以接受的高低門檻 20% 還有一段差距。


    如果接受內側日之後 1 星期內發生的重大走勢，失敗率應該更低。如果等待 1 年，失敗率顯然會更低。所以，我必須處理一個問題：等待多久？我決定保守一點，唯有在內側日隔天發生重大走勢，才視為成功的排列。當然，讀者可以做必要的時間調整，進行自己的分析。


    我把內側日劃分為兩種類型：內側日之後發生上升趨勢（向上突破），內側日之後發生下降趨勢（向下突破）。判斷內側日究竟屬於連續型態或反轉型態，這取決於排列發生之前與之後的價格趨勢。處在上升趨勢中的內側日，如果向上突破，就屬於連續排列，短期趨勢繼續向上；如果向下突破，就屬於反轉排列，短期趨勢反轉向下。


    排列完成之後*，平均漲幅與跌幅分別為 13% 與 10%，最終常發生漲幅與跌幅都不足 5%。對於其他排列而言，如果價格變動幅度不滿 5%，就歸類為失敗（所謂的
    5% 失敗）。可是，此處不採用 5% 失敗的定義，因為內側日的價格影響很小，期間很短（在內側日隔天，價格經常創新低之後就向上反轉，或創新高之後就向下反轉）。


    > * 譯按：「排列完成」是指內側日隔天發生重大價格走勢，否則歸類為失敗的排列。換言之，在內側日的隔天，我們就知道內側日成功（排列完成）或失敗。何謂「重大價格走勢」？請參考第
    520 頁「緣起與辨識準則」的最後一段說明。


    ### 緣起與辨識準則


    表 24.1 列出內側日的辨識準則，圖 24.1 提供很多內側日的範例。顯而易見，所謂「內側日」是指當天線形完全處在前一天線形的內側（當天線形完全被前一天線形吞噬）。某些分析師允許內側日的盤中高價等於前一天的高價，或盤中低價等於前一天的低價；我個人不允許這些情況發生。除此之外，我還規定內側日當天不允許只發生單一價位；換言之，盤中高價與盤中低價不得相等。除非是交投非常冷清的股票，否則這個條件不會構成真正的影響。可是，即使採用表
    24.1 的相對嚴格定義，資料庫內的許多個股還是有 100 個以上的案例。所以，在「統計數據」一節中，我說明如何把樣本數量減少到方便處理的程度。


    圖 24.1 利用黑點標示許多內側日排列。雖然黑點標示在內側日當天的線形之上，但這個排列實際上是由 2 支線形構成。讓我們採用圖 24.1 標示為「內側日」的排列（發生在
    10 月底）做為說明範例。


    內側日前一天的盤中高價為 $50\frac{1}{2}$，盤中低價為 $48\frac{1}{2}$；內側日當天的價格區間為 $50 \sim 48\frac{5}{8}$。所以，內側日當天的線形完全處在前一天線形的內側，而且當天的交易價格不止一個。


    按照技術分析的傳統說法，內側日隔天經常發生重大的走勢。請參考圖 24.1，這個內側日隔天確實出現大漲走勢。所以，這個內側日屬於底部反轉型態（3 天前發生的內側日，則屬於下降趨勢的連續型態）。內側日當天的收盤價為
    $49\frac{1}{4}$，隔天的收盤價為 $54\frac{1}{8}$；隨後經過一個多星期的回撤整理，股


