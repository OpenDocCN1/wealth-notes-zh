    成功向下突破的下降三角形，目標價位達成率為 67%。我認為目標價位達成率超過 80%才屬於可靠排列，所以下降三角形有所不足。


    平均來說，由排列起點開始衡量，價格突破發生在第 61 天。整個三角形排列——由起點到三角形頂點（排列上限與下限相互收斂的位置）——的平均寬度為 87 天。


    表 39.3 列示提前突破的相關統計數據。在我們的案例當中，下降三角形只有 22%的機率發生提前突破——不論向上或向下。所謂「提前突破」，是指收盤價穿越排列上限或下限，但在幾天之後（價格走勢也不可過大）又回到排列之內。真正突破則在突破之後繼續朝突破方向發展。對於提前突破，價格穿越到排列之外只維持幾天，隨後的回挫或回升走勢又把價格帶回排列之內。


