    右側案例是導致價格加速下跌的峰值，代表持股者最後的逃命高點，也是放空者最後的進場絕妙位置。這個排列的高點是 $39\frac{1}{4}$，然後價格一路下跌到這份走勢圖終止的
    $13 附近，相當於 67% 的跌幅。


