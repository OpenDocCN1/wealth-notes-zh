    ## 統計數據


    統計數據可以協助界定股價的標準型態與預期行爲。表 45.2 列示上升楔形排列的一般統計數據。相較於下降楔形排列，上升楔形的案例較多；在 500 支股票的 5
    年走勢中，總共有 179 個案例，其中以既有趨勢的連續型態佔一半稍多（54%）。


    排列失敗率為 24%，超過我認為可靠排列所允許發生的最高失敗率 20%。如果等待排列向下突破之後，失敗率下降為 6%。排列平均跌幅為 19%，大約對應於一般空頭排列的平均水準
    20%。最經常發生跌幅為 15%，請參考圖 45.5 的排列跌幅次數分配狀況，其中最高欄位落在 15% 的位置，代表最經常發生跌幅。考慮最前面的兩個欄位，我們發現跌幅不超過
    15% 的排列佔所有案例的 47%。既然上升楔形排列的績效如此不彰，為何還要浪費時間試圖操作這個排列呢？


    如果按照成交量趨勢而把排列分為兩大類，並且評估它們的績效，將得到一些有趣的結果。相對於成交量呈現向上趨勢的排列（成交量趨勢藉由線性迴歸直線的斜率界定），成交量呈現下降趨勢的排列績效較理想，平均漲幅分別為
    15% 與 21%，而且兩者之間的差異具有統計上的顯著意義（換言之，兩者的差異不太可能來自於純粹巧合）。


