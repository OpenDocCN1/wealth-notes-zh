    # 緣起


    圖 35.1 顯示日線圖上的圓形頂排列，一些突兀狀線形使得圓弧狀軌跡顯得不太平滑。1995 年 2 月份開始一波漲勢，5 月中旬創峰位，漲幅大約是 22%。隨後，股價分成幾個階段下降，9
    月份創最低價位，然後開始回升，並且迅速穿越原來的高點，目前的價位大約在$71 附近。


    我們不難解釋圓形頂的發生原因。最初，在多頭氣氛下，股價夾著成交量上揚。由於股價漲勢穩定，賣方沒有出脫持股的急迫性，使得需求沒有受到供給的壓抑。可是，隨著股價走高，需求逐漸減少，最後終於與供給達成平衡狀態。價格由漲轉跌，畫出圓頂狀的軌跡。由於股價已經超過股票的內含價值，'
