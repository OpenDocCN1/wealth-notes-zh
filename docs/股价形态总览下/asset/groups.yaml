    ![](img/157738047fa61d5e4bdbaf89f0241a36_288_1.png)


    圖 38.6 上升三角形排列：向下突破的失敗案例。


    列爲上升三角形，但這類走勢需要經過更進一步的確認：等待實際的突破。如果等待實際突破，就可以避開目前這類的失敗情況。請參考「統計數據」一節的說明，上升三角形大約有三分之一的機會向下突破。


    ### 統計數據


    表 38.2 列示上升三角形的一般統計數據。在 500 支股票的資料庫內，上升三角形排列的發生數量少於我預期的水準，只有 725 個；換言之，每支股票在 5
    年期間的走勢內，發生上升三角形排列的平均次數尚不及 2 次。某些股票出現 3 到 6 個案例，另一些股票則完全沒有發生這種排列。雖說如此，樣本數量已經足以提供清楚的統計數據。在所有的案例當中，絕大部分是既有價格趨勢的連續型態（529
    個），其餘 196 個屬於反轉型態。


