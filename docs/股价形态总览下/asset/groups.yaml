    為了估計實際的操作績效，最好分別考慮整個排列的構成部分。第一隻腳的平均漲幅爲 43%，涵蓋期間平均爲 87 天；修正階段的的平均跌幅爲 14%，涵蓋期間平均爲
    45 天；第二隻腳的平均漲幅爲 37%，涵蓋期間平均爲 65 天。一般來說，實際操作績效比較適合由第二隻腳的報酬衡量，這當然要取決於個別情況的進場與出場位置。


    對於成功的排列，我就修正階段回檔程度佔第一隻腳長度的百分率，做次數分配的分析。次數分配圖的橫軸刻度由 20% 到 80%，單位為 1%，我希望觀察回檔的百分率是否屬於費伯納西比率
    (Fibonacci ratios)。費伯納西數列的最初兩個數據是 0 與 1，隨後的每個數據都是前兩個數據的加總和 (0, 1, 2, 3, 5, 8,
