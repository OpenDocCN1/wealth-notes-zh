    如何判斷某個突破不是提前突破？恐怕完全沒有辦法。所謂「提前突破」，是指收盤價穿越到排列上限或下限之外，但不久價格又折返到排列之內，最後突破排列上限。不論就突破量或突破點距離三角形頂點的位置而言，提前突破與真正突破都沒有差別。


    一旦排列正式向上突破，後續的價格行為如何？股價通常會快速上漲，但偶爾也會向下折返而重新測試排列上限的支撐。突破之後的上漲過程，通常都會維持大量，只要上漲動能沒有減退，成交量也不會縮小。當價格走緩之後，成交量才會恢復正常。如果價格連續上漲幾個星期，成交量應該保持偏高水準，型態顯得不規則（相對於過去的情況）。


    支撐與壓力的情況又如何呢？如果把三角形排列視為兩條趨勢線的暫時交錯，就很容易判斷支撐與壓力的結構。請參考圖 38.2，在週線圖上顯示一個上升三角形的範例。由排列起點到突破前一個星期，成交量型態大體呈現下降趨勢。突破過程爆出大量，然後隨著價格走緩，成交量也慢慢下降。邁入
    1994 年之後，價格又開始攀升，基本上是銜接上升三角形的排列下限。這波上漲趨勢維持數年之久。雖然突破之後的上漲趨勢線不完全銜接先前上升三角形的排列下限，但兩者之間的關係非常清楚。圖
    38.2 分別標示排列上限的兩個轉折高點，以及排列下限的三個轉折低點。趨勢線的觸及點與來回穿梭的價格行為，這都是篩選三角形排列的重要準則。


    現在，你或許覺得自己能夠正確辨識上升三角形。可是，'
