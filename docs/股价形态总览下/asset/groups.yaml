    25.2 的最後一個頭部排列），終點的缺⼝是突破缺⼝。兩個缺⼝所處的價位通常很接近，但缺⼝的大小經常不同。前一節討論的超大型島狀頭部就是典型的例子（參考圖
    25.1）。B 點的缺⼝將近 5 點，A 點的缺⼝只有 3/8 點。


