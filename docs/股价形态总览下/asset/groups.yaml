    52% 顯然受到最右側「90% 以上」欄位的向上扭曲。雖說如此，如果把全部欄位都考慮在內，讀者或許認為最經常發生漲幅應該超過 30%。漲幅不超過 30% 的案例畢竟只佔全部排列的三分之一（38%），其餘
    62% 的案例漲幅都超過 30%，報酬潛能實在令人垂涎。


