    把突破之前的年度價格區間劃分為三等份（上緣、中央與下緣），向上突破大多發生在中央位置。我原本預期大多數的向上突破發生在上緣位置，因爲頭部排列原本應該發生在價格區間的上端，而向上突破又應該發生在頭部排列的上端。如果考慮年度區間三個位置的排列績效，向上突破落在中央位置的平均漲幅最大（49%）。非常奇怪地，向上突破落在上緣位置的績效竟然相對最差，只有
    36%。一般來說，在年度高價附近，動能玩家應該會繼續推動股價走高。


    向下突破落在年度價格區間下緣位置的績效最佳，平均跌幅爲 21%。這意味著「弱者恆弱」；換言之，如果你打算放空股票，應該挑選那些創新低價的對象，不是創新高 的股票。


    ## 交易戰術


    表 32.5 列示矩形底部排列的相關交易戰術。首先運用衡量法則預測排列突破之後的目標價位。這是計算矩形排列內最高價與最低價之間的差值，以此代表矩形高度，然後由突破點向上或向下衡量矩形高度，結果就是向上突破或向下突破之後的最低目標價位。讓我們利用圖
    32.6 做為說明範例。矩形排列的上限為 $12^{7/16}$，下限為 $11$，矩形高度為 $17/16$ 點（= $12^{7/16} - 11$）。


    ### 表 32.5 矩形底部排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算矩形排列上限與下限之間的高度，由突破點向上或向下衡量矩形高度，結果就是向上突破或向下突破的最低目標價位。 |

    | 等待突破 | 由於矩形底部排列沒有預期突破方向，所以應該等待收盤價實際突破矩形排列的上限或下限，然後才按照突破方向順勢操作。 |

    | 來回操作 | 如果矩形的高度夠高，可以考慮在排列下限買進或回補，在排列上限賣出或放空，如此來回操作。 |

    | 回挫與回升走勢 | 對於向下突破，等待回升走勢結束而價格重新下跌，放空股票或加碼空頭部位。同理，對於向上突破，等待回挫走勢結束而價格重新上漲，買進股票或加碼多頭部位。
    |

