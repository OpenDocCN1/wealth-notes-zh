  mdcn: "\n## 表 39.6 下降三角形排列的交易戰術\n\n| 交易戰術 | 解釋 |\n| :--- | :--- |\n| 衡量法則 | 在三角形排列的起點，計算型態的高度。由水平下限向下衡量型態高度，結果就是最低目標價位。另一種衡量方法，在排列下限的起點位置，向右下方繪製一條直線與排列上限平行，當價格向下突破，取當時對應的平行線價位為下檔目標價位。\
