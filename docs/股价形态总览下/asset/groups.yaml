    ### Varco International（油田服務／設備，NYSE，代碼 VRC）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_345_0.png)


    圖 40.8 等腰三角形底部排列的目標價位衡量法則。排列高度等於最高價（B 點）減去最低價（A 點）。由最高點（B 點）向上衡量排列高度。實際交易在 1 個月內獲利
    27%。


    由於不能有效判斷突破的方向，最好等待突破實際發生。某些情況下，價格可能漫無目的的通過三角形頂點，沒有發生所謂的突破。這類情況相當罕見，但畢竟還是會發生。一旦價格突破之後，順著趨勢方向進行交易：價格向上突破則買進，向下突破則放空。


    我發現，即使價格朝既有趨勢的反方向進行突破，經常也會很快反轉方向，仍然朝既有趨勢方向發展。舉例來說，在價格上升趨勢中，三角形向下突破，下跌 10% 或 15%
    之後，價格又開始朝上發展。請留意這類反轉行爲，尤其是發生在大多頭市場內的三角形排列向下突破。


    三角形的另一種操作方法，是在排列下限附近買進，然後在排列上限附近反轉為空頭部位。某些等腰三角形既寬又長，允許你在排列之內進行前述的操作，但手腳必須非常俐落。如果經驗不足，最好先在紙上模擬交易。


    ## 交易範例

    你是否能夠在等腰三角形排列賺錢？可以的，不妨考慮我如何針對圖 40.8 進行交易。促使我介入這支股票的理由很多，包括：鑽油設備數量增加、油價上漲、氣候嚴寒，以及其他相關政治事件
    (石油輸出國家組織可能對奈及利亞實施石油禁運)。所有這些發展都意味著冬季的油價將繼續上漲，油田服務產業的需求持續旺盛。


    驅使我進行交易的另一個因素，是當時的股票價格正沿著趨勢通道的下線發展。關於趨勢通道的繪製方法，程序有些複雜。我針對收盤價繪製迴歸直線，然後利用這條迴歸直線做為中心，分別加上與減去收盤價的兩個標準差
    (standard deviations)，在迴歸直線之上與之下分別繪製一條平行線，這兩條平行線所界定的區域即是趨勢通道。圖 40.8 顯示趨勢通道的上限，沒有顯示下限，但下限穿越
    A 點而與上限平行。如果這條趨勢通道繼續有效，隨後的價格走勢將朝上限發展。


    由於價格夾著小量突破三角形排列，我決定暫時不採取行動，等待價格回挫。當然，這種方法涉及一些風險，因為價格可能一路走高而不回頭。可是，這個例子確實發生回挫走勢。12
    月 1 日，我進場買進股票，成交價格為 $9^{1}/8$。


    三角形頂點經常成為後續價格走勢的支撐或壓力。回挫走勢停頓於三角形頂點，並且在該處盤旋 3 天，然後向上彈升，正式展開漲勢。雖然價格走勢很快滿足排列高度預測的目標價位，但我懷疑股價可能繼續上漲而穿越通道上限。股價完成目標價位之後，就在迴歸直線附近形成峰位而拉回整理（圖形內沒有顯示收盤價的迴歸直線，但它大約落在通道上限與
    A 點的中間）。這是相當正常的發展，我早就有心理準備。


    經過一個星期左右的整理，價格又開始走高，很快創新高價。當價格觸及趨勢通道上限的時候，我曾經考慮獲利了結，但基於節稅的緣故而没有賣出。我決定繼續持有股票到隔年——只差
    2 個交易日而已。1 月 2 日，我賣出股票，成交價格為 $11^{5}/8$。由於延遲兩天賣出，使得報酬率由原來的 40% 降低為 27%。雖說如此，對於
    1 個月的投資期間來說，這仍然是不錯的績效。


    ## 等腰三角形頭部排列


