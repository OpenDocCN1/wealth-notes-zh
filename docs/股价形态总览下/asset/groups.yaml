    圖 46.5 週線圖上的擴張頂排列與關鍵反轉。擴張頂排列內的部分漲勢，意味著價格可能向下突破，再配合當時的下降擴張楔形排列，顯示這是非常值得考慮的放空對象。


    ## 週線上關鍵反轉


    ![](img/157738047fa61d5e4bdbaf89f0241a36_475_0.png)


    ### 摘要資料


    **外觀**

    在週線圈上，線形高價高於前一週高價，低價也低於前一週低價。收盤價高於前一週的高價。


    **反轉或整理**

    短期（3 個月以內）的多頭反轉走勢。


    **失敗率**

    23%。


    **平均漲幅**

    44%，最經常發生漲幅為 20%。


    **目標價位 達成率**

    84%。


    **意外發現**

    配合中等程度的大量（移動平均量的 150%），關鍵反轉的績效最理想，但隨著成交量繼續擴大，績效就會下降。關鍵反轉本身的線形愈長，績效表現通常愈理想。


    **参照排列**

    （46）週線向下關鍵反轉。


    「摘要資料」提供週線向上關鍵反轉(upside weekly reversals)的一些基本統計數據。目前這個排列的績效遠優於對應的向下關鍵反轉。排列的失敗率為
    23%, 仍然超過可靠排列所允許發生的最高水準 20%。平均漲幅為 44%, 最經常發生漲幅為 20%。這兩個數據的差異頗大，意味著為數不少的案例漲幅頗高，使得平均漲幅向上推升。根據案例漲幅的次數分配圖顯示，單筆交易的常態報酬率并不高。


    如何能夠在 3 個月內達成 44%的報酬率呢？正常情況下，很難達到這類的績效水準。觀察排列由突破到最終高點之間的天數次數分 配圖，我們發現大部分排列(47%)到達最終高點的天數落在
    3 個月或以內的區間。發生頻率次高的區間是 6 個月的長期投資期間，這類排列佔 38%。許多案例很快就到達最終高點，漲幅相對有限，這也是為什麼最經常發生漲幅偏低的原因。前述結論並不矛盾，只不過意味著向上關鍵反轉屬於「大好或大壞」的排列——展現「中庸」績效的案例很少。


    向上關鍵反轉達成目標價位的比率高達 84%，超過可靠排列的門檻水準 80%。這方面的讀數偏高，讀者顯然不應該覺得意外，因為多頭排列的績效原本就比較理想。當然，我們的研究期間剛好處在股票大多頭行情中，這對於多頭排列的績效自然也有所幫助。


    我根據下列條件把關鍵反轉當週的成交量定義為「小量」或「大量」：該週成交量是 25 週移動平均量的 50%以下或 150% 以上。小量向上關鍵反轉的平均漲幅為
    38%，大量向上關鍵反轉的平均漲幅為 44%*。兩者之間的差異具有統計上的顯著意義。可是，如果把成交量基準設定為移動平均量的 2 倍、3 倍或 4 倍，則排列續效反而逐漸下降。另外，就全部案例——不論成功或失敗——所做的研究顯示，排列續效隨著成交量增加而減少。


    向上關鍵反轉的線形長度也是影響續效的因素之一；線形愈長，平均漲幅愈大。這方面的續效差異頗大，線形長度較短者，平均漲幅可能只有 15%；線形長度較寬者，平均漲幅可能高達
    57%。


    ### 緣起


    圖 47.1 顯示週線圖上兩個向上關鍵反轉的例子。相形之下，左側排列的訊號精確程度不如右側排列。雖然左側排列也發生在下降趨勢中，正確顯示趨勢變動的訊號，但價格向上反轉的走勢持續不久；價格小幅向上跳動，然後出現將近
    2 個月的橫向盤整，最後又下跌。第二個例子的表現比較理想。關鍵反轉當週創波段新低價，而且價格收高。隨後出現 4 支持續上升的週線，接著向下修正，然後再繼續上漲，整體結構呈現階梯狀漲勢。最後，價格由低點
    $12 7 / 8$ 上漲到高點 $37$，漲幅將近 200%。第一個例子由波段低點衡量到高點的漲幅為 31%。如果由關鍵反轉當週收盤價起算，兩個例子的漲幅分別為
    160% 與 13%。關於績效衡量，我一律採用關鍵反轉當週收盤價做為起點，因為這比較切合實際狀況。


    > * 譯按：依此推論，中等成交量——介於移動平均量的 50% 到 150% 之間——的關鍵反轉平均漲幅應該大於 44%，因為整體排列的平均漲幅為 44%。若是如此，本段稍後的結論也就不足為奇了。


    Adobe Systems（電腦軟體與服務，NASDAQ，代碼 ADBE）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_478_0.png)


    圖 47.1 週線圖上的兩個向上關鍵反轉。雖然左側案例也顯示趨勢變動的訊號，但右側這個關鍵反轉的訊號顯然更精準。


    某些情況下，向上關鍵反轉的訊號發生得太早，例如圖 47.1 的左側案例；另一些情況下，關鍵反轉訊號非常及時，例如圖 47.1 的右側案例。如果訊號發生得太早，領先的程度通常是
    2、3 個星期或 1 個月，很少發生類似圖 47.1 案例的情況，距離底部長達 5 個月。


    線形長度與收盤價位置，兩者顯示趨勢即將發生變化。


    關鍵反轉當週的線形完全吞噬前一週線形，而且收盤價位在最高價附近，這意味著價格將走高。一般來說，情況確實如此，而且價格上漲的程度往往很可觀。


    圖 47.1 的兩個關鍵反轉都沒有出現顯著的大量或小量；成交股數大約是中等水準。這不屬於異常現象，因為大多數績效理想的向上關鍵反轉，成交量都保持平均或偏低的水準。


    ### 辨識準則


    表 47.1 列示週線向上關鍵反轉的辨識準則。首先，在週線圖的價格下降趨勢內尋找向上關鍵反轉。關鍵反轉當週的高價必須高於前一週高價，低價必須低於前一週低價，收盤價必須高於前一周高價。總之，尋找「吃掉」前一支線形的線形，而且該週收盤價高於前一周高價（不是收盤價）。只要符合這些條件，就是向上關鍵反轉。


    表 47.1 週線向上關鍵反轉的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 週線圖 | 採用週線圖觀察單週的關鍵反轉。 |

    | 價格下降趨勢 | 價格必須處在下降趨勢過程或末端。如果當時的價格趨勢明顯向上，不必考慮向上的關鍵反轉，除非是發生在上升趨勢的向下修正過程。 |

    | 較高的高價與較低的低價 | 相對於前一支線形，高價必須較高，低價也必須較低。不允許兩支線形具有相同的高價或低價。 |

    | 較高的收盤價 | 關鍵反轉的收盤價必須高於前一支線形高價。 |


    圖 47.2 顯示向上關鍵反轉的一些例子。左側案例並不是發生在下降趨勢的最低點，而是在橫向而稍微上升的盤整走勢中，落後底部低點大約 2 個月時間，但價格差異不大。雖說如此，我們可以清楚看見這個訊號的有效性。由關鍵反轉收盤價
    $9½$ 起算，衡量到最終高點 $32⁷⁄₈$，股價幾乎上漲 2.5 倍。嚴格來說，這個關鍵反轉確實發生在上升趨勢起點的 2 個月之後；可是，當時的價位距離底部低點並不遠，所以仍然視為有效的買進訊號。


    Advanced Micro Devices, Inc.（半導體，NYSE，代碼 AMD）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_480_0.png)


    圖 47.2 成功的週線向上關鍵反轉。A 點與 B 點標示的關鍵反轉並不成功，因為隨後的趨勢沒有發生反轉。向上關鍵反轉應該發生在下降趨勢內。1992 年 8
    月份的關鍵反轉發生在長期下降趨勢之後的橫向盤整走勢，但當時的價格仍然接近低點。


    反之，圖 47.2 的 A 點與 B 點所標示的都是關鍵反轉線形，但價格趨勢並沒有反轉——事實上，繼續上漲。在價格上升趨勢內，按照道理不可能發生有效的向上關鍵反轉，因為：如果隨後的價格上漲，則屬於連續型態而不能稱為關鍵反轉；如果隨後的價格下跌，則向上關鍵反轉失敗。就目前這兩個例子來說，它們代表上升趨勢的連續型態。可是，這兩個訊號並沒有顯示上升趨勢將持續多久，如果你打算建立多頭部位，務必謹慎。某些情況下，這類訊號可能意味著上升趨勢不久將結束。


    某些向上關鍵反轉發生在上升趨勢的向下修正走勢過程（請參考圖 47.5 的例子）。這類反轉訊號代表向下修正結束，價格即將恢復漲勢。


    圖 47.2 的右側案例剛好發生在價格走勢的谷底。這支關鍵反轉線形完全吞噬前一周的線形，而且收盤價幾乎就是最高價。這個反轉訊號發生之後，價格高點上漲到 $32$，漲幅為
    73% ，然後回檔，在 $23$ 獲得支撐。直到 1995 年 1 月為止，股價都沒有再創新高。


    ### 失敗案例


    某些向上關鍵反轉並沒有發揮預期效果。排列失敗率為 23% ，超過可靠排列允許發生的最高水準 20%。請參考圖 47.3 的例子。


    Allen Telecom Inc. (通信設備，NYSE，代碼 ALN)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_482_0.png)


    圖 47.3 週線向上關鍵反轉的 5%失敗案例。向上關鍵反轉構成菱形底排列的谷底，菱形底排列則是下降趨勢的連續型態。向上關鍵反轉發生之後，價格沒有出現 5%以上的跟進漲勢，所以屬於
    5%失敗案例。這個菱形排列實際上是三階段衡量跌勢的修正階段。


    很多情況下，價格急漲之後，跟著又發生急跌走勢。經過劇烈的起伏波動，一切似乎又回到原點。投資人觀察圖 47.3的發展，可能也會產生類似的感想。1995 年 6
    月，價格終於脫離長達 7 個月的橫向盤整區間（介於 $22$ 到 $26$ 之間，圖形只顯示一部分），幾個月之後，價格上漲到 $39 3/8$ 的高點。這是相當傑出的一段漲勢。隨後如果發生回檔整理，跌幅可能是前一段漲幅的
    40%到 60%。可是，如果趨勢向下反轉，價格可能重新回到 $22~$26$ 的橫向整理區間，實際上也是發生這種結果。由事後的角度的觀察，週線關鍵反轉剛好發生在回檔走勢的中點。當時，就我個人的判斷，這個關鍵反轉似乎意味著回檔走勢結束，價格將重新上漲，甚至回到原先的高點附近形成雙重頂排列。這顯然是很棒的進場機會——不幸地，這個向上關鍵反轉失敗了。


    向上關鍵反轉的隔週，價格雖然一度創新高，但收盤價走低。涵蓋 7 個星期的盤整走勢，看起來像是菱形底，但這個排列沒有向上突破，結果演變為下降趨勢的連續型態。價格跌破菱形下限，顯示下降趨勢將繼續發展。這段下降趨勢由高點
    $40$ 附近開始下跌，在 $26$ 附近停頓 7 個星期，然後進一步下跌到 $16$，整個結構勾劃出另一種排列——三波段衡量跌勢。菱形底排列只不過代表三波段衡量跌勢的修正階段。


    目前這個向上關鍵反轉屬於 5%失敗情況，因為價格跟進漲勢沒有超過 5%，隨後就出現暴跌走勢。在我們所觀察的近 500 個案例當中，大約有 112 個 5%失敗排列，比率高達
    23%。


    關於某特定股價型態之所以失敗的原因，我們通常沒有辦法提出一般性的解釋。就向上關鍵反轉來說，我觀察統計數據發現，大多數失敗案例的成交量都有平均或以上的水準。關鍵反轉當週成交量不足移動平均值
    50%的案例當中，只有 13%的排列失敗。所以，如果你打算把大成產量關鍵反轉視為有效的買進訊號，最好還是配合觀察其他技術面與基本面因素。


    ### 統計數據


    表 47.2 列示週線向上關鍵反轉的統計數據。在 200 支股票的 5 年期間內，我總共找到 484 個案例。由於這種排列到處可見，數量非常多，所以我覺得沒有必要繼續觀察另外
    300 支股票。


    所有案例當中，137 個屬於既有趨勢的連續型態，剩餘為反轉型態。很多連續型態屬於 5%失敗。整體排列發生 5%失敗的比率為 23%。


    表 47.2 週線向上關鍵反轉的一般統計數據


    | 說明 | 統計數據 |

    | --- | --- |

    | 排列數量：1991 年~1996 年的 200 支股票 | 484 個 |

    | 反轉或整理排列 | 137 個整理，347 個反轉 |

    | 失敗率 | 112/484 或 23% |

    | 成功排列的平均漲幅 | 44% |

    | 最經常發生漲幅 | 20% |

    | 成功排列的目標價位達成率 | 314/372 或 84% |

    | 成功排列到達最高點的夭數 | 7 個月（218 天） |

    | 突破位置在最近 12 個月價格區間的下緣、中央或上緣 | 下緣 30%，中央 38%，上緣 32% |

    | 前述突破位置的平均跌幅 | 下緣 48%，中央 40%，上緣 45% |

    | 相對於關鍵反轉當週，前一週與後一週的平均成交量 | 59%，82% |

    | 大量反轉與小量反轉（25 週移動平均量的 150%以上或 50%以下）的排列平均績效 | 44%與 38%，但成交量更大，績效反而下降 |


    排列平均漲幅為 44%，屬於績效偏高的多頭反轉型態。最經常發生漲幅為 20%。圖 47.4 是根據所有成功案例漲幅編製的次數分配圖，可以解釋前述兩項漲幅數據之間何以存在顯著的差距。圖形最高欄位落在
    10%~20%，代表發生頻率最高的漲幅。最右端欄位顯示 17%的案例漲幅超過 90%。由於離群漲幅的發生次數相當多，使得平均漲幅向上扭曲為 44%。漲幅不足
    20%的案例佔 37%（前兩個欄位的總和）。所以，這種排列的結果似乎不是「大好」，就是「大壞」。可是，由圖 47.4 觀察，較高欄位都集中在偏低漲幅的一端，意味著型態報酬不會太高。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_485_0.png)


    圖 47.4 週線向上關鍵反轉的漲幅次數分配 漲幅不超過 20%的排列大約佔三分之一。


    順便提及一點，表 47.2 的績效統計數據都是以關鍵反轉當週的收盤價做為衡量基準。舉例來說，排列漲幅是由關鍵反轉線形收盤價，衡量到上升趨勢顯著反轉之前最高價。


    我利用傳統的方法估計關鍵反轉的目標價位。換言之，我計算關鍵反轉當週的線形長度，然後由該週收盤價直接向上衡量線形長度，結果就是價格應該到達的最低目標價位。按照這種方法計算，成功排列的目標價位達成率為
    84%。由於某些關鍵反轉的線形長度很短，相當容易完成目標價位。


    週線向上關鍵反轉發生之後，價格平均需要 218 天才能達到最終高價。這段期間相當長，足以實現 44% 的平均漲幅。


    如果把週線向上關鍵反轉發生當時的最近 12 個月價格區間劃分為三等份（上緣、中央與下緣），關鍵反轉當週收盤價通常落在哪個位置呢？三個區間的分配相當平均，發生在中央位置的排列最多（佔
    38%）。雖然我是以收盤價做為衡量基準（收盤價發生在線形最高價附近），但排列落在年度價格區間三等份任何位置的可能性都大約相同。就這三個位置的排列而言，落在年度價格區間下緣的績效最理想，平均漲幅為
    48%；落在上緣與中央的排列，平均漲幅分別為 45% 與 40%。


    關鍵反轉當週的成交量，大於相鄰兩週的成交量。如果以關鍵反轉當週的成交量做為基準，前一週成交量為 59%，次一週成交量為 82%。


    我把「大成量」定義為成交量大於 25 週移動平均量的 150%，把「小成交量」定義為成交量小於 25 週移動平均量的 50%。對於成功的週線向上關鍵反轉，大成量排列的績效優於小成交量排列，平均漲幅分別為
    44%與 38%，兩者的差異具有統計上的顯著意義。可是，如果把成交量水準提高為移動平均量的 2 倍、3 倍與 4 倍，排列績效將隨著成交量提高而下降（2 倍的平均漲幅為
    44%，3 倍為 38%，4 倍為 29%）。


    某些分析家認為，成交量愈大，關鍵反轉線形愈長，排列的績效愈理想。表 47.3 顯示這方面的檢定結果。我把關鍵反轉線形的長度劃分為 5 個區間：收盤價的 0~5%、5~10%、10~15%、15~20%與
    20~25%；把關鍵反轉當週成交量劃分為 4 個區間：25 週移動平均量的 0~1 倍、1~2 倍、2~3 倍與 3~4 倍。表格內顯示符合線形長度與成交量水準的排列平均漲幅，漲幅讀數外面的括弧內數據，代表符合條件的案例樣本數量。請注意，凡是樣本數量小於
    30 個，漲幅讀數就值得懷疑。這份表格涵蓋所有的案例（前面兩段有關成交量的討論，只考慮成功的排列，但此處同時涵蓋成功或失敗的排列）與所有的成交量區間。


    表 47.3 符合成交量與線形長度條件的排列平均漲幅


    | 線形長度(%) | 基準(%) | 成交量 0~1 倍(%) | 成交量 1~2 倍(%) | 成交量 2~3 倍(%) | 成交量 3~4 倍(%)
