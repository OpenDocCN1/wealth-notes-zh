    # 三重底排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_373_0.png)


    # 摘要資料


    +   - 外觀


    三個顯著的轉折低點，發生在大約相同的價位。


    +   - 反轉或整理


    短期（3個月以內）的多頭反轉走勢。


