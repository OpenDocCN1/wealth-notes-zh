    frac{1}{4}$）。報酬／風險比率將近是 $3:1$。\n\n進場當天的價格收高，她覺得很滿意，因爲這意味著隔天的價格應該會繼續走高。隔天，她發現盤中價格雖然一度竄高，但收盤價走低。隨後一、兩個星期內，價格持續下跌，雖然讓柯小姐有些擔心，但還不至於覺得緊張，因爲她認爲這是另一個向上扇貝形的發展過程，而且部位停損點的位置始終很安全。\n\
    \n柯小姐繼續持有部位，每天密切留意行情的發展。2 月中旬，她對於第三個扇貝形（最右側一個）的結構非常不滿意。價格的弧形軌跡太過不規則，成交量型態也不具說服力。當排列右端的峰位發生之後，她發現當時的高價不能穿越左端高點，就知道價格上升趨勢已經告一段落了。她立即賣出持股，成交價格爲\
