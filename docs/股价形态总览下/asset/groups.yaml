    邁入 1993 年之後，股價突然向上飆漲。隨著股價走高，小陳也把停止價位調高到 $23$。最後在 1993 年 2 月中旬的回檔走勢中，設定在 $23$ 的停止單被觸發。扣除所有的交易費用之後，這筆交易獲利將近\
    \ $2,000$，遠超過當初估計的水準。\n\n## Magne Tek, Inc.(墊子設備，NYSE，代碼 MAG)\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_324_0.png)\n\
