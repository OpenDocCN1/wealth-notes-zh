    且繼續下跌。如果你能夠調整走勢圖的時間刻度，呈現更長期的日線圖，就可以發現一個大型的頭肩頂排列，兩肩與頭都各自涵蓋 3、4 個月的期間。目前這份圖形顯示的是圓弧狀的右肩，其中一部分由下降楔形排列構成。


