    ## 交易範例


    如何利用前述的交易戰術來提昇操作績效呢？讓我們觀察葛先生如何處理圖 34.6 的情況。葛先生希望成為一位專業的當日沖銷者，但他目前還沒有足夠的交易資本，也不具備專業的操作技巧。所以，他打算慢慢來。


    1992 年 12 月份，隨意翻閱股價走勢圖的時候，葛先生看見圖 34.6 的雙重底排列。在日線圖上，發生在 8 月份與 11 月份的兩個底部很難察覺。這是否是一個有效的雙重底排列？是否代表適當的買進機會？葛先生認為兩個谷底所夾的向上折返走勢不夠高，而且兩個谷底的形狀也不夠顯著。他認為，既然他不能清楚判斷這個排列，那麼其他人也會有類似的困擾。若是如此，進場買進的人就不多，所以股價也不會上漲。


    當他翻開週線圖，卻發現截然不同的結果。他清楚看見圓形底排列，甚至連成交量也呈現對應的圓弧狀。所以，他決定等待價格上漲到先前的杯口左緣價位 $21\frac{3}{8}$。1993
    年 2 月份，當價格連續 2 週盤旋在杯口左緣價位附近，他知道這已經逼近關鍵時刻。問題是：盤勢接下來將如何發展？


    隔週，價格下跌，形成杯口右緣。葛先生決定繼續等待，他必須等到收盤價向上穿越杯口右緣。他知道過早進場的風險，股價可能一路走低；如果股價真的能夠向上穿越杯口右緣，那麼繼續走高的成分就很大。


    當價格觸及 $22$，葛先生進場買進。他回顧整個股價走勢，決定把停損點設定在杯口右緣支撐的下側 1/8 點處。他相信，如果走勢引發他所設定的停損，就代表價格將進一步走低。他自認為整個交易計畫相當完善，考慮非常周詳，距離專業當日沖銷只有一步之遙。隨著股價逐步走高，他更加信心滿滿，甚至開始索取一些當日沖銷課程的簡介。可是，6
    月底的時候，走勢跌破上升趨勢線，這是任何人都不會忽略的警訊。當然，葛先生也瞭解情況已經發生根本變化。


    Alco Standard Corp.（辦公設備與用品，NYSE，代碼 ASN）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_223_0.png)


    圖 34.6 在這份週線圖中，圓形底排列隱約可以見到雙重底型態。


    隔週，他接到經紀人的電話，得知停損單已經成交。雖然他早有心理準備，但還是很難接受每股大約 $1$ 的損失。當他實際查閱報價，更覺得懊惱，因為他的賣單幾乎成交在當週的最低價。


    三年之後，葛先生已經不再嘗試成爲專業的當日沖銷者。可是，他還是決定叫出這支股票的走勢圖看看。結果，交易價位爲 $66$，剛好是他當初買價的三倍。


    ## 圓形頂排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_225_0.png)


    ### 摘要資料


    | 項目 | 內容 |

    | :--- | :--- |

    | 外觀 | 大規模的圓弧狀價格走勢，圓弧缺口（杯口）朝下。 |

    | 反轉或整理 | 長期（6 個月以上）的多頭整理型態。 |

    | 失敗率 | 19%。 |

    | 向上突破之後的失敗率 | 6%。 |

    | 平均漲幅 | 41%，最經常發生漲幅為 20%~40%。 |

    | 目標價格達成率 | 69%。 |

    | 意外發現 | 圓形頂完成之後，價格大多上漲。 |

    | 其他名稱 | 圓蓋頂，圓形反轉。 |

    | 參照排列 | （8）蹦跳-奔馳頭部反轉排列，（19）複雜頭肩頂排列。 |


    什麼情況下，頭部不代表頭部？當圓形頂（rounding top）或圓蓋頂（dome）排列完成而價格向上突破的時候。這實在是一個非常意外的發現，因為大部分的圓形頂排列都向上突破。失敗率為
    19%，稍低於我認爲可靠排列所允許發生的最高失敗率 20%。如果等待向上突破之後，排列的失敗率下降爲 6%。最初，我把突破點設定爲排列高度的三分之一；換言之，一旦圓形頂排列向上折返的幅度超過排列高度的三分之一，就視爲向上突破。前述上漲走勢經常穿越下降趨勢線，讓其他投資人得以察覺趨勢變化（協助推高股價）。可是，結果實在不太實際（失敗率爲
    0%，平均漲幅爲 58%）。前述考量忽略其他先漲後跌的走勢。所以，我重新把突破點設定爲圓形頂的峰位。結果比較合理：平均漲幅爲 41%，最經常發生漲幅介於 20%~40%。


    ### 緣起


    圖 35.1 顯示日線圖上的圓形頂排列，一些突兀狀線形使得圓弧狀軌跡顯得不太平滑。1995 年 2 月份開始一波漲勢，5 月中旬創峰位，漲幅大約是 22%。隨後，股價分成幾個階段下降，9
    月份創最低價位，然後開始回升，並且迅速穿越原來的高點，目前的價位大約在 $71$ 附近。


    我們不難解釋圓形頂的發生原因。最初，在多頭氣氛下，股價夾著成交量上揚。由於股價漲勢穩定，賣方沒有出脫持股的急迫性，使得需求沒有受到供給的壓抑。可是，隨著股價走高，需求逐漸減少，最後終於與供給達成平衡狀態。價格由漲轉跌，畫出圓頂狀的軌跡。由於股價已經超過股票的內含價值，賣方的態度轉爲積極。精明資金也開始抽離市場，股價下跌。


    一旦投資人察覺價格向上動能已經反轉，賣壓轉強，迫使價格下滑。成交量可能放大，因爲更多的交易者受到股價下跌刺激而希望拋售持股。最後，當沒有經驗的投資人覺得恐慌而離場，股價跌勢就告一段落了。只要所有希望賣出股票的人都賣出之後，精明資金就進場撿便宜貨。


    ### 辨識準則


    表 35.1 列示圓形頂的辨識準則。不論採用日線圖或週線圖，價格排列都呈現圓頂狀，最初的漲勢較快，然後速度轉緩，最後由漲轉跌，甚至下跌速度加快，畫出開口朝下的圓弧狀軌跡。


    **表 35.1 圓形頂排列的辨識特質**


    | 特質 | 討論 |

    | :--- | :--- |

    | 日線圖或週線圖 | 排列的期間很長，所以週線圖上也會呈現。 |

    | 圓頂狀半月形結構 | 價格呈現開口朝下的圓頂狀走勢，最初呈現漲勢，到達峰位之後，反轉為跌勢。排列末端的底部位置，可能高於型態起點的價位。 |

    | 成交量呈現圓弧狀趨勢 | 成交量型態大体上也呈現對應的圓弧狀，但開口朝上。 |


    如同圓形底一樣，圓形頂的成交量型態也呈現圓弧狀，但圓弧的開口朝上，不同於價格的圓頂狀開口朝下。換言之，在圓形頂排列的最初與末端，成交量相對較大，排列中央部分的成交量最小。請注意，這只是一個參考準則，不是價格型態成立的必要條件。許多情況下，我們發現圓形頂排列的成交量呈現不規則型態，這並不妨礙價格排列的有效性。重要的是價格本身具備圓頂狀的走勢，成交量只是補充證據而已。


    圖 35.2 提供兩個週線圖上的圓形頂例子。第一個排列起始於 1991 年 12 月底的低價 $12\frac{1}{16}$。價格由此緩慢上升，越過峰位之後，又緩慢下跌，最後在
    $14$ 附近回升，並且展開一段長期的漲勢，然後演變為第二個圓形頂排列。


    Sears Roebuck（零售百貨，NYSE，代碼 S）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_229_0.png)


    圖 35.2 迴線圖上的兩個圓形頂排列。圓頂狀的價格走勢最後都會跌破上升趨勢線。請注意第二個排列呈現的成交量型態。


    第二個案例的價格結構比較不平滑，但成交量呈現標準型態。排列兩端的成交量較大，中間部分較小。整體而言，成交量型態看起來像是開口朝上的碗。


