    89%，而不是更高。


    另一個意外發現是提前突破的發生次數偏高，請參考表 38.3。大約每四個案例之中，就有一個案例出現提前向上或向下突破，或陸續發生兩個方向的提前突破。向上提前突破（22%）的次數稍多於向下提前突破（12%）。相對於當時的
    25 天移動平均量，向上與向下提前突破的成交量分別為 175%與 106%。由於突破過程夾著大量，所以無法辨別提前突破與真正突破之間的差異。向上與向下提前突破在排列寬度上的位置分別為
    60%與 63%，類似於真正突破，所以也不能由突破位置辨別提前突破與真正突破。如果某個排列發生兩次或以上的提前突破，我發現突破方向經常不同。大約只有 36%
    的案例，同時發生向上與向下提前突破。


    ## 表 38.3 上升三角形排列的提前突破統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 發生提前突破（向上或向下）的排列數量 | 184/725 或 25% |

    | 向上提前突破的排列數量 | 163/725 或 22% |

    | 向下提前突破的排列數量 | 88/725 或 12% |

    | 向上提前突破成交量爲當時 25 天移動平均量的百分率 | 175% |

    | 向下提前突破成交量爲當時 25 天移動平均量的百分率 | 106% |

    | 向上提前突破發生在排列寬度的位置 | 60% |

    | 向下提前突破發生在排列寬度的位置 | 63% |

    | 同時發生向上與向下提前突破的案例數量 | 67/184 或 36% |

    | 提前突破向上/真正突破向上的案例數量 | 65/163 或 40% |

    | 提前突破向上/真正突破向下的案例數量 | 75/163 或 46% |

    | 提前突破向下/真正突破向上的案例數量 | 37/88 或 42% |

    | 提前突破向下/真正突破向下的案例數量 | 37/88 或 42% |


    附註：提前突破發生當時，無法判斷它不是真正的突破，也沒有任何徵兆足以判斷真正突破的方向。


    提前突破是否能夠提供任何線索，藉以判斷真正的突破方向？假定不考慮水平突破的情況，一旦發生向上提前突破，隨後有 40% 的案例出現向上真正突破，46% 的案例出現向下真正突破。如果發生向上提前突破，隨後發生真正向上或向下突破的比例各佔
    42%。


    前述這一切究竟有什麼意義呢？沒有太大的積極意義。表 38.3 告訴我們，一旦發生向上或向下提前突破，最後的突破可能朝任何方向發展。換言之，提前突破不能用來預測最後的突破方向或排列的成功與否。


    讓我們暫時把提前突破擺在一旁，接下來討論真正突破的相關統計數據，請參考表 38.4。向上或向下突破發生在排列寬度上的百分率位置——由排列起點往三角形頂點的方向衡量——分別為
    63% 與 68%。一旦向上突破之後，只有 13 個失敗案例（換言之，屬於 5% 的失敗；請參考表 38.2）。向下突破發生 5% 失敗情況的比率為 5%；換言之，價格向下突破之後，沒有出現
    5% 或以上的跟進跌勢，立即又向上折返而穿越排列上限。所以，一旦價格向下突破之後，通常都會繼續下跌。


    上升三角形排列向上突破的機率是 62%（大約是三分之二），向下突破的機率為 33%。這方面的統計數據不如其他某些排列，但能夠藉由某種方法改善操作勝算，細節請參考「交易戰術」一節。


    ## 表 38.4 上升三角形排列的突破統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 向上突破發生在排列寬度的位置 | 63% |

    | 向下突破發生在排列寬度的位置 | 68% |

    | 向下突破而成功的案例 | 33/725 或 5% |

    | 向上突破案例 | 450/725 或 62% |

    | 向下突破案例 | 238/725 或 33% |

    | 水平突破案例 | 37/725 或 5% |

    | 發生回挫走勢案例 | 262/450 或 58% |

    | 發生回升走勢案例 | 117/238 或 49% |

    | 完成回挫走勢的平均期間 | 15 天 |

    | 完成回升走勢的平均期間 | 13 天 |

    | 成功排列到達最終高點的天數 | 6 個月（186 天） |


    附註：如果排列向上突破，通常都會繼續上漲。


    所謂「回挫走勢」（throwback），是指價格向上突破之後，不久就折返到排列上限或三角形頂點附近重新測試支撐。同理，回升走勢（pullback）是指價格向下突破之後，不久就折返到排列下限或三角形頂點附近重新測試壓力。向上突破案例發生回挫走勢的比率為
    58%，向下突破案例發生回升走勢的比率為 49%；所以，向上突破發生折返走勢的頻率較高。


    完成回挫與回升走勢的平均期間分別為 15 天與 13 天。由於這是平均數據，走勢通常在此之前折返三角形排列內。對於成功的排列，價格到達最終高點的平均天數為
    186 天。觀察價格由突破點到達最終高點的天數次數分配，結果有些令人迷惑。絕大多數案例都在 3 個月內到達最終高點（224 個或佔 45%），屬於中期走勢的案例佔
    19%（96 個），超過 6 個月以上的長期走勢佔 35%（175 個）。我通常雖然是由短期投資角度處理上升三角形，但股價走勢的實際涵蓋期間可能超過 3 個月。


    表 38.5 列示上升三角形形成交易量的相關統計數據。針對排列內成交量時間序列進行線性迴歸分析，我發現 68% 案例的成交量型態呈現下降趨勢。取某一條直線，使得成交量時間序列每點與該直線的距離總和為最小，這條直線稱為迴歸直線。我利用迴歸直線的斜率來代表成交量趨勢。


    ## 表 38.5 上升三角形排列的成交量統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 成交量呈現下降趨勢的案例數量 | 495 或 68% |

    | 相對於 25 天移動平均量，突破當天與隨後 5 天的成交量 | 130%，176%，151%，144%，128%，121% |

    | 大量突破與小量突破發生回挫走勢的頻率 | 54%／46% |

    | 大量突破與小量突破的排列平均漲幅 | 42%／43% |


    附註：突破當天爆出大量之前，排列內的成交量型態呈現下降趨勢。


    我們比較突破成交量與當時的 25 天移動平均量（後者截至突破前一天爲止，因爲我不希望移動平均值受到突破行爲的影響）。請注意，向上突破隔天的成交量最大（相當於移動平均的
    176%）。這意味著，投資人發現排列向上突破之後，大量買進，驅動突破隔天的成交量大幅增加。由這點開始，成交量開始萎縮，但絕對數量仍然偏高。


    某些技術分析家認爲，小量突破之後，比較容易發生回挫走勢。我檢定這項假設，但找不到證據支持這種說法。就我的資料進行分析，回挫走勢發生在大量突破之後的案例佔 54%，發生在小量突破之後的案例佔
    46%。所以，大量突破反而比較容易出現回挫走勢。


    大量突破之後的價格漲幅是否較大？沒有證據顯示如此。如果突破量超過正常水準的 50%，價格漲幅平均爲 42%。反之，如果突破量少於 25 天移動平均量的 50%，價格漲幅爲
    43%。


    ### 交易戰術


    現在，你已經知道如何辨識上升三角形排列，也瞭解它們的價格行爲，但實務上如何操作呢？首先，我準備討論交易戰術與衡量法則（參考表 38.6），然後舉例說明。


    上升三角形通常向上突破，但如何評估上檔目標價位呢？首先計算排列高度，這是測量排列起點位置的三角形高度；然後由排列上限向上衡量排列高度，結果就是最低目標價位。這


    ## 表 38.6 上升三角形排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 在三角形排列的起點，計算型態的高度。由水平上限向上衡量型態高度，結果就是最低目標價位。 |

    | 等待確認 | 向上突破之後（收盤價超越排列上限至少 1/8 點），隔天買進股票。如果錯失突破買進訊號，等待價格回挫到排列上限附近，一旦價格重新朝上發展，立即進場買進。
    |

    | 按照目標價位賣出 | 對於短線交易者，當價格接近上檔目標價位（參閱衡量準則）或向下貫穿支撐，賣出股票。對於中、長期的投資人，繼續持有股票，直到基本面或市況發生變化為止。
    |

    | 向下突破的賣出訊號 | 如果你持有股票，一旦價格超越排列下限，立即賣出。對於空手者，可以把向下突破視為放空訊號。回升走勢代表加碼或進場放空的第二次機會。
    |

    | 放空 | 如果你所放空的股票出現上升三角形排列，價格向下突破的機會大約只有三分之一。如果價格向上突破，立即回補空頭部位。 |


    附註：收盤價實際超越排列上限，代表買進訊號。價格到達目標區域，考慮賣出。


    稱爲衡量法則。


    讓我們舉例說明計算程序。請參考圖 38.9，首先計算排列起點位置的三角形高度，結果是 $3 \frac{5}{8}$ 點（$=17 \frac{5}{8}
    - 14$）。由排列上限 $17 \frac{5}{8}$ 向上衡量三角形高度，目標價位為 $21 \frac{1}{4}$。1992 年 7 月 16 日完成目標價位，當天的高價為
    $21 \frac{5}{8}$，大約是向上突破之後的 6 個星期。


    另一種比較依賴視覺的保守衡量方法，是由排列起點的最高價位置，繪製一條與排列下限平行的直線，當價格突破排列上限時，突破點所對應的該平行線價位即是目標價位。不論採用哪一種方法衡量目標價位，關於排列起點的設定，務必謹慎小心；以圖
    38.9 爲例，如果把排列起點設定在 1 月中旬，顯然會高估目標價位。


    由於向下突破的排列數量高達三分之一，所以最好等到收盤價實際向上突破，然後才進場買進。雖然進場價位可能較高，但可以顯著降低失敗率（實際突破之前與之後的失敗率分別為
    32%與 2%）。


    一旦排列向上突破之後，運用衡量法則估計上檔目標價位。由於衡量法則不全然可靠，所以準備在目標價位附近出場。關於目標價位的設定，也應該參考過去的支撐／壓力水準。


    如果價格向下突破，立即出脫手中持股。這也代表放空的訊號；預期價格可能出現 20%的跌幅。如果發生回升走勢，一旦價格重新開始下跌，可以考慮加碼空頭部位。當股票的基本面改善或價格跌到重要支撐區，考慮結束空頭部位。


    ### 交易範例


    唐先生有幾年的投資經驗，但最近才開始接觸技術分析。在一次偶然的機會裡，他發現上升三角形排列。經過一些研究之後，稍微瞭解這種股價型態的性質；他發現，如果等到收盤股價實際向上突破才買進，可以大幅提高勝算。當然，任何決策都有利有弊，延後進場雖然可以提高勝算，但買進成本也隨之提高。


    唐先生對於圖 38.10 的上升三角形排列很感興趣。8 月 19 日，當成交量突然萎縮為 23,400 股，他相信排列即將突破。兩天之後，股價夾著大量穿越排列上限，但收盤價又拉回到排列之內。隨後幾天，價格遊走於排列上限附近。直到
    8 月 26 日，走勢才正式向上突破，但成交量沒有顯著放大。唐先生希望估計突破點落在排列寬度的百分率位置；經過一些運算之後，他發現突破點大約在 70%的位置——按照統計資料判斷，這個突破位置的漲勢達成很強勁。


    成交量的情況似乎不太明朗。在排列的發展過程內，成交量確實呈現下降趨勢，但向上突破並沒有夾著顯著的大量。由於沒有大量配合，唐先生決定不急著進場，暫時保持觀望。


    進場訊號隨時可能出現，他希望計算上檔目標價位。在排列的起點位置，衡量三角形的高度大約是 3 點（≈19¹/₄-16³/₈）。由排列上限$19¹/₄向上衡量的預估漲幅大約是
    15%，雖然不特別具有吸引力，但至少勝過銀行的存款利息。


    向上突破之後的第 3 天，股價開始拉回，折返到排列上限附近。在回挫走勢中，唐先生於 9 月 2 日進場買進 500 股，價格為$19½，並且立即在三角形排列最低價格下側設定停損。三角形排列的最低價$16³/₄發生在
    7 月 25 日，所以停損設定在$16³/₈（換言之，最低價$16³/₄的下方 1/8 點處）。唐先生準備接受的最大虧損是 15%。根據他的盤算，即使股價跌破排列上限，只要繼續維持上漲潛能，就不應該跌破排列最低點，否則整個技術面已經逆轉而應該認賠賣出。


    然後，唐先生開始等待。9 月 26 日出現$21¼的價格峰位，但因為還沒有到達目標價位$22½，所以他決定繼續持有股票。接下來幾天，股價發生相當嚴重的跌勢，直到
    10 月 5 日才在三角形排列上限附近獲得支撐，一度出現$19 的低價。然後，股價開始上漲；萬聖節的時候，股價到達目標價位，當天的盤中高價為$23。隔天，他決定賣出股票，成交價格剛好是$22½。


    唐先生評估交易的結果。淨利為$1,450，每股獲利將近$3。兩個月的報酬率為 15%，相當於定期存款整年獲利的兩倍。他認為自己相當幸運，因為股票幾乎賣在最高點。10
    月初，股價回補測試排列上限的支撐，當時也可能跌破支撐。他認為，如果獲利 10%之後就把停損點提高到損益兩平點，那麼這筆交易可能白忙一場。


    ## 下降三角形排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_303_0.png)


    ### 摘要資料


    - 外觀 三角形，下限期為水平狀，上限向下傾斜。

    - 反轉或整理 短期（3個月以內）的空頭整理走勢。

    - 失敗率 45%。

    - 向下突破之後的失敗率 4%。

    - 平均跌幅 19%，最經常發生跌幅為10%~20%。

    - 成交量趨勢 下降。

    - 提前突破 22%。

    - 突破發生在排列寬度的位置 69%。

    - 回升 64%。

    - 目標價格達成率 67%。

    - 參照排列 （20）頭肩頂排列。


    「摘要資料」顯示下降三角形 (descending triangles) 的續效數據。失敗率爲 45%，遠高於可靠排列的門檻水準 20%。可是，如果等到向下突破之後，失敗率下降成為
    4%。排列的平均跌幅爲 19%，大約等於一般空頭排列的平均水準。最經常發生跌幅介於 10%到 20%之間，這個區間內的分配非常均勻。將近有四分之一的案例發生提前突破
    (22%)，這也是應該留意的現象。


    ### 緣起


    由很多方面來說，圖 39.1 的下降三角形都很標準。價格上漲而觸及向下傾斜的排列上限，然後回檔跌勢觸及水平下限而向上反彈。這個排列的成交量型態有些異常。正常情況下，下降三角形排列的成交量應該持續下降，一直到排列突破為止。可是，目前的成交量呈現
    V 型——兩端較大，中間較小。突破方向朝下，成交量不大。一般來說，向下突破比較不需要大量配合，但通常還是會發生大量。突破之後，價格拉升到三角形頂點附近，然後又繼續下跌。


    下降三角形基於什麼理由而形成？圖 39.1 的下降三角形起始於 1994 年 10 月初，它屬於下降趨勢的整理型態。當時，股票由高檔往下跌，市場上特定一群投資人認為這支股票的合理價值為$7\frac{3}{8}$，準備在該價位承接。10
    月 6 日，價格跌破$7\frac{3}{8}$，前述特定買盤進場，推升股價走高。10 月 11 日，價格創$8\frac{3}{8}$的轉折高點，然後出現幾天的跌勢。10
    月 13 日，價格跌到$7\frac{3}{8}$的水準，受到特定買盤支撐，股價沒有繼續下跌。

