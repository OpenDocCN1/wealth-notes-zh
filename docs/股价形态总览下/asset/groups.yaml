    如果你希望預先評估股價走勢達成目標價位的可能性，最好把相關的衡量轉化為百分率。以突破點$17¼（三個峰位所夾兩個谷底最低價）為基準，$5⁵⁄₈的跌幅相當於
    32%。根據圖 43.5 的資料顯示，只有 21%的三重頂案例跌幅超過 30%。這意味

    著前述 32% 的目標跌幅只有五分之一的發生機率。


    對於目前這個例子或其他大多數情況，也可以把下檔支撐視為可能的目標價位。以圖 43.6 為例， 1991 年 7 月份與 8 月份，股價跌勢曾經在$16 附近獲得支撐。所以，當股價在
    1992 年 3 月份向下突破三重頂排列的確認水準（$17¾），可以把$16 視為第一道目標價位。隨後，股價跌勢確實在$16 獲得支撐，經過將近兩個月的整理，最後才貫穿這道支撐。


    如果整體股票市場處於大多頭行情之下，三重頂排列經常不能完成。潛在三重頂排列出現之後，價格經常不能跌破確認點；換言之，在三重頂排列完成之前，價格又向上回升。所以，如果準備操作三重頂排列，最好等待價格實際跌破確認水準。讓我重複強調一次：你必須等待價格跌破確認水準！如果你決定在排列完成之前進場放空，幸運的話或許能夠成功，但其中的運氣成分實在太高。大多數情況下，如此操作都是以虧損收場。


    三重頂排列向下突破之後，有 84% 的案例發生回升走勢，這代表第二次機會。請參考圖 43.6，價格向下突破的兩天之後（我把「突破」定義爲收盤價跌破確認水準），曾經出現單日的回升走勢。大約在一個半月之後（
    5 月上旬），價格又回升到突破點，然後才展開正式的下跌。


    建立空頭部位之後，可以把停損設定在排列最高價的上方 1/8 點處。由於三重頂的三個峰位代表後續走勢的上檔壓力，所以只要三重頂排列有效，價格通常不能向上穿越三個峰

    位的水準，否則就應該認賠出場。某些情況下，價格展開正式跌勢之前，可能出現第四個峰位。


    ## 交易範例


    黛妮兒負責管理家裡的財務。爲了提升儲蓄的報酬，她也從事股票短線操作。最初幾筆交易還算順利，所以她有勇氣從事圖 43.6 的交易。


    黛妮兒非常聰明，反應敏銳，精力旺盛，能夠接受一般人所不能承擔的壓力。由於這些心理特質，所以她敢在 1 月初進場放空股票。爲了提高獲利潛能，她不願意等待價格跌破確認水準，決定在三重頂排列正式完成之前進場。結果，空頭部位的成交價格爲
    $21 \frac{1}{2}$ 。


    進場的隔天，價格向上反彈，幾天之後形成第四個峰位，黛妮兒決定繼續持有部位。這項決策顯然很明智，價格完成第四個峰位之後，出現一段暴跌走勢。價格雖然跌破三重頂的確認水準
    $17 \frac{3}{4}$，但沒有進一步下跌。


    根據黛妮兒的觀察，三重頂似乎已經成爲多重頂，而且最後兩個谷底很可能演變爲雙重底排列。現在，價格每向上跳動一檔，雙重底排列就愈可能完成，空頭部位的既有獲利也就減少一檔。所以，她雖然繼續持有部位，但心情非常緊張。


    最後，她實在無法繼續承擔壓力與煎熬，終於決定在 $22 \frac{1}{4}$

    認賠回補空頭部位。出場的一個星期之後，股價開始下跌，而且跌勢愈來愈猛烈。


    股價在支撐區 $16 附近盤整一個多月，最後還是順利貫穿。價格繼續下跌，直到 $9^{3}/_{8}$ 才見底，遠低於三重頂排列的預估目標價位 $12^{1}/_{8}$，也遠低於黛妮兒最初的進場點
    $21^{1}/_{2}$。


    在這筆交易中，黛妮兒發生兩項錯誤。第一，進場點沒有等待價格向下突破三重頂的確認水準，出場點也沒有等待價格向上穿越雙重底的確認點。如果等待確認，她就不會因為雙重底排列而被迫出場，因為這個潛雙重底根本沒有演變爲真正的雙重底。


    第二，耐心不足，沒有讓這筆交易獲得應有的時間。大多數情況下，如果行情發展不利於部位，最好及早認賠出場，尤其是空頭部位，因為放空股票可能發生無限的損失。可是，某些情況下還是一點耐心，這筆交易就是例子。只要設定適當的停損，就應該忍受正常的價格波動。由於三重頂排列的三個峰位代表後續走勢的壓力，空頭部位的停損可以設定在三


    ## 下降楔形排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_413_0.png)


    ## 摘要資料


    - **外觀** 由兩條向右收斂之下降趨勢線所界定的股價跌勢。

    - **反轉或整理** 短期（3 個月以內）的多頭整理走勢。

    - **失敗率** 10%。

    - **等待突破之後的失敗率** 2%。

    - **平均漲幅** 43%，最經常發生漲幅介於 20%~30%。

    - **成交量趨勢** 下降。

    - **提前突破** 27%。

    - **回挫** 47%。

    - **目標價位** 達成率 88%。

    - **意外發現** 最強勁的突破發生在排列寬度的 50%到 80%之間(中心點在 65%)。

    - **參照排列** （14）三角旗形排列。


    「摘要資料」提供的數據沒有特別令人「驚喜」之處。下降楔形排列（falling wedges）的失敗率很低，只有 10%，而且平均漲幅高達 43%，最經常發生漲幅介於
    20%與 30%之間。這些數據意味著下降楔形屬於獲利潛能很高的排列，但這種排列也很罕見。


    目標價位達成率高達 88%，因爲價格只需要上漲到排列最高價，就視爲達成目標價位。


    根據我的統計數據顯示，突破點落在排列寬度的 50%到 80%之間（這個區間的中心點大約是排列寬度的三分之二），漲勢最爲強勁。所謂「強勁」，是指突破點落在前述區間內的排列平均漲幅最大。


    ### 緣起


    圖 44.1 提供一個下降楔形排列的例子。價格跌勢起始於 1992 年 1 月份，由當時的峰位$75¼開始下跌，持續發展到楔形排列的起點$52¼。價格稍微反彈——下降趨勢的向上修正——形成轉折高點而繼續下跌。7
    月底，價格創新低，然後再度反彈。向上動能顯然不足以讓反彈走勢穿越先前的高點。8 月份期間，價格繼續上下擺動。


    對於 7 月初到 8 月底之間的價格來回穿梭走勢，如果分別沿著轉折高點與轉折低點繪製趨勢線，結果是兩條向下傾斜而向右收斂的趨勢線，它們界定一個下降楔形排列，請參考圖
    44.1 的結構。這種排列屬於相當罕見的股票型態。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_415_0.png)


    Delta Air Lines Inc.（航空，NYSE，代碼 DAL）


    圖 44.1 由兩條向下傾斜趨勢線界定的下降楔形排列。


    一旦價格向上突破之後，價格迅速上漲，攀升到排列最高點之上。某些下降楔形排列向上突破之後，漲勢十分驚人。


    ## 辨識準則


    表 44.1 列示下降楔形排列的辨識準則。如同前文提到的，價格行爲受到兩條趨勢線界定。兩條趨勢線都向下傾斜，上側趨勢線的傾斜角度大於下側趨勢線，所以兩條趨勢線向右收斂爲楔形頂點。圖
    44.2 的例子顯示這些性質。目前這個排列屬於上升趨勢的連續型態。在排列之內，價格來回穿梭於兩條趨勢線之間，攪動幅度愈來愈小，於 6 月中旬向上突破。


    ### 表 44.1 下降楔形排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 兩條向下傾斜的趨勢線 | 分別沿著價格走勢的轉折高點與轉折低點繪製趨勢線，兩條趨勢線都向下傾斜，而且向右收斂。 |

    | 多個觸及點 | 大多數排列都至少有 5 個觸及點，某條趨勢線有 3 個觸及點，另一條趨勢線有 2 個觸及點。如果觸及點不足 5 個，排列可能有問題。 |

    | 至少 3 星期 | 下降楔形排列的涵蓋期間至少 3 個星期；如果期間少於 3 個星期，應該屬於三角旗形排列。排列期間也很少超過 4 個月*。 |

    | 成交量趨勢 | 突破之前的成交量通常呈現下降趨勢。 |


    我認爲，可靠的下降楔形排列，趨勢線至少需要 5 個觸及點。爲什麼？下降楔形排列的價格型態是由數個轉折高點與轉折低點構成，轉折高點與轉折低點都持續下滑，而且轉折高點的下降速度快於轉折低點。至少
    5 個觸及點，可以避免把某些來回擺動的價格走勢歸納爲下降楔形排列。型態的發展過程中，需要數個交替觸及點。舉例來說，圖 44.2 的趨勢線有 6 個觸及點，但只有
    5 個交替觸及點（第 3 個觸及點不屬於交替觸及點，因爲它與第 2 點一樣觸及下側趨勢線）。


    分別銜接轉折高點與轉折低點的趨勢線，是辨識下降楔形排列的另一個關鍵。兩條趨勢線都必須向下傾斜，而且向右收斂（換言之，上側趨勢線的傾斜角度必須大於下側趨勢線）。


    * 譯按：3 星期應該是 21 個交易日，4 個月應該是 120 個交易日。按照第 916 頁的說明，涵蓋期間應該介於 20 天到 125 天之間。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_417_0.png)


    Boatmens Baneshares（銀行，NASDAQ，代碼 BOAT）


    圖 44.2 下降楔形排列。趨勢線總共有 6 個觸及點。可靠的下降楔形排列，趨勢線需要有數個交替觸及點。


    如果排列的下側趨勢線呈現水平狀或接近水平狀，應該是下降三角形排列，不屬於下降楔形。


    楔形排列的涵蓋期間至少是 3 個星期，很少超過 4、5 個月。就我們資料庫的例子而言，排列的涵蓋期間介於 3 個星期（21 個交易日）到 4 個月（120
    個交易日）之間。期間少於 3 個星期，就應該視爲三角旗形（pennants）。


    排列內的成交量通常呈現下降趨勢。可是，請注意，這只是一種經常發生的現象，不是有效型態的必要條件。就我們的

    研究案例來說，成交量呈現下降趨勢的排列大約佔 70%。


    一旦價格穿越上側趨勢線（排列上限），通常會繼續走高。圖 44.2 的例子在 6 月中旬展開向上突破，並且在 10 月初到達最終高點。由突破點向上衡量的漲幅爲
    17%，遠低於下降楔形排列的平均水準 43%。


    基於什麼理由，價格走勢會發展爲下降楔形排列呢？下降楔形排列大約有三分之二屬於既有趨勢的連續排列。以圖 44.2 的楔形排列爲例，買進力道轉弱，價格漲勢遭遇壓力而向下修正。在整理走勢的過程中，價格上下遊走，擺動的幅度愈來愈小，直到買進力道克服賣壓爲止。成交量也反映出買進力道轉弱的現象。一旦買進力道恢復之後，就會出現「價漲量增」的走勢。


    下降楔形不是弱勢的表現，它代表強勢。這種排列發展，就像不斷壓縮的彈簧。經過壓縮之後，彈簧變得很扁，下降楔形排列的成交量與價格也是如此。一旦彈簧迸開，不斷被壓縮的能量完全釋放，價格伴隨着大量穿越排列上限，並且繼續上漲。


