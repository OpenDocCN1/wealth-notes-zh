    ## Integrated Devices Technology（半導體，NASDAQ，代碼 IDTI）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_69_0.png)


    圖 26.3 由頭肩頂排列開始的三波段衡量跌勢。相對於第一支腳的長度，價格向上修正的幅度太小。按照衡量法則估計的目標價位為負數，可能嗎？


    如果這段走勢代表三波段衡量跌勢的第一隻腳，那麼第二隻腳將發展到哪個價位？這取決於價格向上修正的高點——目前的例子是$15¼。根據目標價位的傳統衡量方法（細節請參考「交易戰術」一節），第二隻腳的長度約略等於第一隻腳。由於第一隻腳的長度為
    24¾ 點，由$15¼ 向下衡量該距離，目標價位為-$9⅛。可是，即使該公司宣佈破產，股價也不可能出現負值，所以前述方法衡量的目標價位絕對不可能達成。


    排列失敗的另一種可能徵兆是修正走勢的規模。正常情況下，價格向上修正的幅度，應該是第一隻腳長度的 40%到 60% 之間。如果第一隻腳很長，按比例估計的修正幅度勢必太大——圖
    26.3 並沒有發生這種情況，因為這個例子向上修正的幅度大約只有 25%。


    圖 26.4 顯示另一種情況：底部太過平坦的問題。由 1995 年 2 月份以來，價格基本上處在水平狀走勢中；換言之，轉折低點大約都落在相同價位 $40。8
    月份，價格向上發展，並且在 9 月創峰值，這顯然沒有什麼不尋常之處。雖然當時的峰值高於先前 6 月底的轉折高點，但也沒有理由判斷隨後將發生三波段衡量跌勢。


    ## Anadarko Petroleum Corp.（石油生產，NYSE，代碼 APC）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_70_0.png)


    圖 26.4 發生在橫向盤整走勢之後的三波段衡量跌勢。這類排列不太可能成功。


    當價格回挫到底部$40 而向上反彈，沒有經驗的投資人或許認為這是三波段衡量跌勢的向上修正。由 10 月底發展到 11 月初的漲勢，幅度大約是第一隻腳長度的
    45%。如果投資人在這波漲勢結束的時候進場放空，恐怕要付出嚴重的代價。由第二隻腳的低點$44⁷/₈ 開始，價格展開一段飆漲走勢，5 月份創高價$60。這個排列為何失敗？先前的橫向走勢意味著底部$40
    存在強烈支撐；換言之，根本不存在可供反轉的下檔空間。


    圖 26.5 顯示另一個辨識錯誤的失敗案例。經過一段長期的漲勢之後，隨時可能出現向下修正，甚至趨勢發生變動而大跌。1 月初，當價格反轉下跌的時候，似乎頗有「早該如此」的味道。如果銜接先前漲勢的轉折低點，繪製一條上升趨勢線，我們發現價格在
    12 月中旬已經跌破趨勢線。這意味著趨勢已經向下反轉，或許還不能視為明確的結論，但徵兆很明顯。在整個 12 月份內，價格基本上是呈現橫向走勢，然後向上攀升而創新高，但立即出現重挫走勢。橫向盤整之後，價格漲勢沒有辦法繼續走高，這是趨勢反轉的另一個徵兆。這波跌勢貫穿先前
    10 月底的高點，這又是趨勢向下反轉的一項證據；事實上，價格甚至一度跌破 $ 12^{5/8} $ 的支撐。


    第一波跌勢結束之後，價格向上修正的幅度頗大，大約是第一隻腳長度的 85%。向上折返的幅度超過正常水準，多少已經透露排列可能失敗的危機。反彈幅度过大，意味著隨後跌勢或許只能到達第一波跌勢的低點，因為第二隻腳的長度通常稍短於第一隻腳。事實上，第二波跌勢的低點甚至沒有靠近先前的低點。價格只下跌到
    $ 13^{1/2} $ 的先前轉折高點，稍作停頓，又繼續走高。


    這個排列為什麼失敗？向上修正走勢的幅度太大，應該是造成這個排列失敗的主要原因。如果由更寬廣的角度觀察，向下的第一隻腳，實際上是三波段衡量漲勢的向下修正。


    ## 統計數據


    表 26.2 列示三波段衡量跌勢的統計數據。在 500 支股票的 5 年走勢中，我找到 622 個案例。樣本數量很多，意味著三波段衡量跌勢屬於常見的股價型態，也代表你經常遇到的投資機會。


    ### 表 26.2 三波段衡量跌勢的一般統計數據


