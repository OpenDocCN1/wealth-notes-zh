    按照技術分析的傳統說法，內側日隔天經常發生重大的走勢。請參考圖 24.1，這個內側日隔天確實出現大漲走勢。所以，這個內側日屬於底部反轉型態（3 天前發生的內側日，則屬於下降趨勢的連續型態）。內側日當天的收盤價為
    $49\frac{1}{4}$，隔天的收盤價為 $54\frac{1}{8}$；隨後經過一個多星期的回撤整理，股


