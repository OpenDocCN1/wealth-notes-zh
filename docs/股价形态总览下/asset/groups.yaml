    如同「摘要資料」所強調的，在矩形底部向下突破的所有案例當中，只有 2 個失敗情況，失敗率為 4%，相當於整體矩形底部排列的失敗率為 2%。請注意，只因爲我沒有發現矩形底部向上突破的任何失敗案例，並不表示該排列不會失敗。這只意味著我所觀察的股票在某特定期間內沒有發生這類的事實。可是，雖然矩形底部排列的失敗率很小，但確實存在提前突破的情況，仍然需要小心。


    向上突破的平均漲幅爲 46%，優於一般多頭排列的平均績效 40%；向下突破的平均跌幅爲 19%，稍遜於一般空頭排列的平均績效 20%。


    我利用排列漲幅與跌幅的次數分配圖，計算最經常發生漲幅與跌幅。圖 32.4 顯示矩形底部排列向上突破的最經常發生漲幅，次數分配的情況似乎不太規則，落在 60%的欄位雖然最高，但不能有效代表最經常發生漲幅（漲幅
    60%的水準實在太高了，遠超過平均數 46%）。我認爲次高欄位（漲幅爲 20%）比較具有代表性，更能反映投資人操作這個排列的正常預期。次數分配圖之所以如此不規則，主要理由在於樣本太小，只有
    41 個，而且又把這些樣本分配在 10 個欄位。非常奇怪地，在 41 個樣本當中，竟然有 10 個樣本的排列漲幅落在 50%~60% 之間，8 個樣本的漲幅落在
    10%~20% 之間，其他漲幅欄位的樣本數量都不超過 4 個。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_179_0.png)


    圖 32.4 矩形底部排列向上突破的漲幅次數分配。由於樣本太小，我認爲投資人預期的最經常發生漲幅應該是 20%。


    圖 32.5 顯示矩形底部排列向下突破跌幅的次數分配。最高兩個欄位 10% 與 15% 代表最經常發生跌幅。在全部 52 個樣本當中，5%~10% 與 10%~15%
    跌幅欄位的樣本數量分別為 12 個與 13 個，其他跌幅欄位的樣本數量都不超過 6 個。請注意，由於樣本太小，圖 32.4 與 32.5 顯示的圖形可能精確或不精確，但結果大體上對應一般的多頭與空頭排列。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_180_0.png)


    關於目標價位的衡量法則，詳細討論請參考「交易戰術」一節，但運算方法很簡單：計算矩形排列的高度，由突破點向上或向下衡量矩形高度，分別代表向上突破與向下突破的最低目標價位。向上突破的目標價位達成率為
    93% ，向下突破的達成率只有 65% 。我認為可靠型態的目標價位達成率至少應該超過 80% ，所以向下突破的矩形底部排列稍嫌不足。


    不論向上或向下突破，排列完成的平均期間都是 85 天左右。關於排列內的成交量型態，向上突破案例有 46% 呈現下降趨勢，向下突破案例有 54% 呈現下降趨勢。


    如果把成交量型態劃分為上升趨勢與下降趨勢，我們發現成交量呈現上升趨勢的向上突破案例平均漲幅較高 (49%) ，成交量呈現下降趨勢的向上突破案例平均漲幅較低
    (43%) 。向下突破的情況也是如此，成交量呈現上升趨勢的案例平均跌幅為 22% ，成交量呈現下降趨勢的案例平均跌幅為 17% 。所以，如果某個矩形底部排列的成交量呈現上升趨勢，所預期的排列續效可以稍微調高。


    表 32.2 也顯示矩形底部排列突破當天與隨後 5 天的成交量狀況。對於向上突破，最初幾天出現大量，但很快就能恢复正常。反之，向下突破在一個星期左右都出現異常大量。這似乎與預期相反，但我重複檢驗統計數據，沒有發現任何錯誤。我想，這大概與樣本太小有關。當然，讀者實際遇到的情況可能不同。


