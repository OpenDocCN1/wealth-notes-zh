    # 三波段衡量跌勢


    ![](img/157738047fa61d5e4bdbaf89f0241a36_61_0.png)


    # 摘要資料


    - **外觀**：價格下跌，然後向上修正，接著又繼續下跌。向下的兩隻腳，價格距離與涵蓋時間都大約相同。

    - **反轉或整理**：中期（6個月以內）的空頭反轉型態。

    - **失敗率**：22%。

    - **平均跌幅**：36%，最經常發生跌幅介於 25%與 40%之間。

    - **第一隻腳跌幅**：25%，54 天。

    - **修正階段漲幅**：16%，39 天（向上修正幅度是前一波跌幅的 40%到 60%）。

    - **第二隻腳跌幅**：27%，60 天。

    - **衡量法則**：第二隻腳長度超過第一隻腳長度的案例佔 43%。

    - **意外發現**：修正階段漲幅與第一隻腳跌幅之間維持比例關係。

    - **其他名稱**：擺動衡量走勢。

    - **參閱排列**：（14）旗型與三角旗形排列。


    三波段衡量跌勢（measured move down，或所謂的「擺動衡量走勢」〔swing measurement〕）屬於兼具操作價值的排列，因爲這種型態大方透露下檔的可能目標價位。不幸地，排列失敗率高達
    22%，操作風險頗高。根據我個人的看法，可靠排列的失敗率不應該超過 20%。這並不是說三波段衡量跌勢不可靠，尤其是排列的平均跌幅高達 36%，遠超過一般空頭排列的平均水準
    20%。即使是最經常發生跌幅也高達 25%~40%，雖然區間稍寬。


    觀察這種排列的兩隻腳，發現它們的價格長度與時間寬度都很類似，價格跌幅分別爲 25%與 27%，涵蓋時間分別爲 60 天與 54 天。就價格百分率衡量，第二隻腳似乎稍長，但由絕對價格金額衡量，第二隻腳似乎短
    8%。請記住，處在下降趨勢中，如果每波段跌勢的百分率都相同，後來發生的波段下跌金額較小。就三波段衡量跌勢來說，如果第一隻腳與第二隻腳的跌幅百分率相同，意味著第二隻腳的價格下跌金額較小。所以，在所有的排列當中，只有
    43%案例的第二隻腳長度超過第一隻腳。


    關於修正走勢的規模，這份研究有一項意外發現，可以協助判斷排列的有效性與績效。第一隻腳的價格跌勢愈重，向上修正的程度也愈大。在修正階段中，如果價格向上折返的程度低於正常水準（換言之，不足第一隻腳長度的
    40%到 60%之間），就必須小心了：這個排列很可能不能完成目標價位。


    ## 緣起


    圖 26.1 提供三波段衡量跌勢的範例。由 3 月中旬的峰位（A 點）到向上折返走勢的起點（C 點），這段走勢稱爲第一隻腳（first leg）。向上折返走勢又稱爲修正階段（corrective
    phase）。修正走勢完成之後，隨後發生的跌勢稱爲第二隻腳（second leg）。第一隻腳與第二隻腳的價格長度與時間寬度大約相同，但行爲還是存在差異，細節請參考「統計數據」一節。


    在下降趨勢的修正階段中，價格向上折返，代表股價走勢進行整理或喘息的階段，沒有經驗的投資人經常把修正走勢誤以爲趨勢向上反轉。由於買盤介入，價格走高；表面上看起來，跌勢似乎已經結束。不要被表面的現象矇騙；跌勢只不過完成一半。事實上，修正階段正是目前這種型態的美妙之處。在一段延伸性價格跌勢之後，進場買進之前，應該考慮三波段衡量跌勢的可能性。周詳的考慮，往往可以幫你節省可觀的成本。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_63_0.png)


    圖 26.1 三波段衡量跌勢。兩支腳的趨勢線斜率大約相同。A-B-C 標示另一個小型的三波段衡量跌勢。


    回頭觀察圖 26.1，兩隻腳的下降走勢，大體上沿著相同的趨勢線斜率向下發展。雖然不是所有的三波段衡量跌勢都是如此，但這種情況經常發生。另外，某個趨勢通道 (channel)
    —— 對於下跌走勢，沿著走勢上線的轉折高點繪製一條下降趨勢線，然後沿著走勢下線的轉折低點繪製另一條平行的直線，這兩條直線所夾的範圍形成一個價格通道——可以涵蓋兩隻腳的走勢。在圖
    26.1 的例子中，第一隻腳的下降趨勢相對不明確；可是，如果繪製一條直線銜接 D 點與 E 點，並且向下延伸，第二隻腳確實沿著這條下降趨勢線發展。


    最後，請注意圖 26.1 的第一隻腳本身也是三波段衡量跌勢：由 A 點到 B 點，代表第一波跌勢與向上修正；由 B 點到 C 點，代表第二波跌勢。某個三波段衡量走勢的構成分，經常是由另外的三波段衡量走勢構成。某些情況下，股價走勢可能由幾個三波段衡量走勢銜接而成。


    ## 辨識準則


    表 26.1 摘要列示三波段衡量跌勢的辨識特質。第一隻腳起始於趨勢向下反轉的價格峰位。這波段跌勢經常呈現筆直的走勢；沿著走勢的轉折高點與轉折低點，可以繪製兩條向下傾斜的直線而構成通道。第一段跌勢結束之後，展開修正走勢。在修正階段中，價格可能進行橫向盤整，但通常會向上折返，折返的幅度可能是第一隻腳長度的
    40%到 60%之間。


    ## 表 26.1 三波段衡重跌勢的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 第一隻腳 | 通常起始於價格新高點。價格趨勢由此向下反轉，經常呈現快速而筆直的跌勢。如果這波段跌勢呈現由線狀（圓形、弧狀或碟形），儘量避免介入。 |

    | 修正階段 | 價格可能進行橫向盤整，但通常會向上折返，折返的幅度可能是第一隻腳長度的 40%到 60%之間。修正結束後，將恢復下降趨勢。如果向上修正走勢攀升到第一隻腳的高點附近，儘量避免介入。
    |

    | 第二隻腳 | 第二隻腳的傾斜角度通常類似第一隻腳（換言之，兩隻腳的趨勢線斜率大約相同）。兩隻腳走勢通常都落在明確的趨勢通道內。 |

    | 避免情況 | 對於一系列三波段跌勢構成的下降趨勢，設法操作第一段走勢，避免介入隨後發生的三波段跌勢，因為下降趨勢終有結束的一天。如果三波段走勢發生在橫向盤整行情中，呈現水平的鋸齒狀排列，避免介入這類的案例。如果衡量法則預測的目標價格為零或負數，應該另外尋找操作對象。
    |


    修正走勢結束而價格恢復下降趨勢，即是第二隻腳的起點。第二隻腳的趨勢傾斜角度，通常類似於第一隻腳，但每個案例都有各自不同的情況。兩隻腳中間夾著修正走勢，所以不會共用相同的下降趨勢線。雖說如此，第二隻腳的跌勢經常也很筆直，可以由本身的價格通道明確涵蓋。第二隻腳的長度（價格）與寬度（時間）大約與第一隻腳對等。


    尋找三波段衡量跌勢的操作對象，應該留意一些辨識準則。如果第一隻腳的形狀不夠筆直，整體走勢雖然朝下，但呈現開口朝上的圓弧狀型態，儘量避開這類的排列。


    修正階段中，價格不應該反彈到第一隻腳的高點附近，否則避免介入。


    如果整個下降趨勢是由幾個三波段衡量跌勢構成，設法在第一個或第二個衡量走勢中介入，儘量不要操作隨後的衡量走勢，因爲任何下降趨勢終有結束的一天。


    如果既有的趨勢朝橫向發展，價格上漲到高點而反轉下跌，形成向下的第一隻腳。價格回到底部，隨後向上反彈。這個反彈走勢被誤以爲三波段衡量跌勢的向上修正，實際上卻是橫向盤整的轉折高點。在行情出現明確的趨勢方向之前，價格可能數度由底部向上反彈，整體形狀看起來像是水平狀鋸齒排列。不要操作這類橫向的波段走勢。


    最後一個準則是關於目標價位的衡量。有關衡量法則的細節，我準備在「交易戰術」一節內討論，但基本原理很簡單：第二隻腳的長度類似第一隻腳。可是，如果第一隻腳的跌勢很重，所預測的第二隻腳目標價位可能接近零，甚至是負數。顯然地，股票價格不可能跌爲負數，正常情況下也不應該出現零的價位。所以，如果遇到前述情況，最好另外尋找交易對象。這方面的範例請參考「失敗案例」。


    圖 26.2 提供兩個三波段衡量跌勢的例子。第一個例子標示為 A-B-C-D，整個排列發生在一段延伸性漲勢之後。股價起漲於 1994 年 11 月份的$43\frac{1}{8}$，於
    1995 年 7 月初創$59\frac{5}{8}$ 的峰位，然後趨勢開始向下反轉，展開第一隻腳的跌勢。第一隻腳落在下降趨勢通道內，跌勢持續到 8 月中旬，當時的低價為$51\frac{1}{2}$。修正走勢起始於這個低點，最初的成交量放大，但不特別大。價格向上修正的幅度，大約是前一波跌勢的
    68%。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_67_0.png)


    圖 26.2 兩個三波段衡量跌勢。價格走勢精確落在趨勢通道之內。第一支腳（A 點到 B 點）與第二支腳（C 點到 D 點）的長度幾乎相同。


    修正走勢完成之後，展開第二波跌勢，價格向下穿越先前的低點（B 點），繼續下跌到 D 點。然後，整段跌勢告一段落。


    第二隻腳的向下傾斜角度超過第一隻腳，涵蓋的時間為 19 天，大約是第一隻腳（36 天）的一半。另外，第二隻腳的長度也較短，只有 $7\frac{1}{4}$
    點，第一隻腳的長度為 $8\frac{1}{8}$ 點。


    另一個三波段衡量跌勢發生在 1995 年 11 月中旬，結束於 1996 年 1 月底（標示為 E-F-G-H），當時的價位約略等於第一個案例結束的價位。如果仔細觀察，可以發現這個例子的第一隻腳也是由三波段衡量跌勢構成（標示為
    E-E1-E2-F）。


    ## 失敗案例


    什麼情況才會造成失敗的三波段衡量跌勢呢？當我剛開始進行這個價格型態的研究，就認定第二隻腳必須跌破第一隻腳的低點，否則排列就算失敗。不可否認地，這是相當主觀的認定，而且也取決於價格向上修正的程度，但確實可以剔除一些不明确的案例。


    我希望指出一些錯誤的辨識準則。請參考圖 26.3，這支股票隨著其他半導體類股在 1995 年夏天與秋天創高價，並且在 8 月份與 9 月份之間形成頭肩頂排列。頭部排列完成之後，幾乎出現一波筆直的跌勢，由
    $33\frac{1}{2}$ 跌到 $9\frac{1}{8}$（跌幅為 $24\frac{3}{8}$ 點）。

