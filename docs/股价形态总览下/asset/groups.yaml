    圖 33.4 矩形頭部排列向上突破的漲幅次數分配。最經常發生漲幅介於 20%與 30%之間，但漲幅超過 90%的案例比率很高。


    圖 33.4 是矩形排列向上突破的漲幅次數分配圖。我剔除「90%以上」所有剩餘漲幅的欄位，把 20%與 30%的最高欄位視為最經常發生漲幅。我們知道，平均漲幅
    52% 顯然受到最右側「90% 以上」欄位的向上扭曲。雖說如此，如果把全部欄位都考慮在內，讀者或許認為最經常發生漲幅應該超過 30%。漲幅不超過 30% 的案例畢竟只佔全部排列的三分之一（38%），其餘
    62% 的案例漲幅都超過 30%，報酬潛能實在令人垂涎。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_201_0.png)


    圖 33.5 顯示矩形向下突破的跌幅次數分配圖。我們發現，排列跌幅不超過 20% 的案例總共佔 66%，這意昧著矩形向下突破的報酬潛能不太高。另外，圖形顯示的最經常發生跌幅與平均跌幅相同，最右端的欄位不特別高。


    關於目標價位的衡量方法，細節內容請參考「交易戰術」一節，但原則上是計算排列的高度，然後由突破點向上或向下衡量矩形高度，結果就是最低目標價位。對於向上突破，大約有
    91% 的矩形頭部排列達成目標價位；向下突破的達成為 65%。我我認為可靠型態的目標價位達成率至少應該是 80%。


    不論向上或向下突破，排列的平均發展期間大約為 90 天。在 90 天的排列發展期間內，成交量型態呈現下降趨勢的向上突破案例佔 64%，向下突破案例佔 71%。某些分析師認為，成交量呈現下降趨勢，是標準矩形排列的必要條件。我檢驗這項假設，結果發現成交量呈現下降趨勢的向上突破案例平均漲幅為
    55%；反之，成交量呈現上升趨勢的向上突破案例平均漲幅為 48%。對於向下突破，成交量呈現上升或下降趨勢的排列績效差異不大，前者的平均跌幅為 19%，後者為
    20%。


    相對於突破前一天的成交量，表 33.2 顯示突破當天與隨後 5 天的成交量情況。由於成交量呈現下降趨勢，所以比較基準設定為突破前一天，不是取當時的 25 天移動平均量。突破前一天可能是整個排列內成交量最低的一天，設定
    25 天移動平均量為比較基準，可能会有基準太高的問題。即使是如此，不論向上或向下突破，突破當天與隨後 5 天的成交量都很大。


    表 33.3 顯示提前突破的相關統計數據。我把提前突破定義為收盤價穿越矩形排列的上限或下限，隨後又折返矩形排列之內。對於向上突破，總共有 15 個排列發生提前突破。向下突破則有
    14 個提前突破案例。


    提前突破發生當時，成交量大於 25 天移動平均量，這符合正常的預期。這也意味著，不太可能透過成交量判別提前突破。


