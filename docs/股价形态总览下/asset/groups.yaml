    64%處，這與真正突破位置 68%之間沒有顯著的差異，所以不能藉由突破位置而判別提前或真正突破。另外，提前突破與真正突破的成交量型態也沒有差異，所以也不能藉成交量而判別提前或真正突破。


    最強勁的突破，發生在哪些位置？我繪製突破位置（突破點落在排列寬度的百分率位置）與排列漲幅之間的相關散佈圖（correlation scatter diagram），結果顯示兩者之間沒有顯著的關聯。雖說如此，某些分析師認為最強勁的突破發生在排列寬度的三分之二位置*。


