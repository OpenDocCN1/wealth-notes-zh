    圖 38.5 顯示第一種失敗情況：5%失敗。嚴格來說，這並不是一個 5%失敗案例（因為向上突破的漲幅為 6%），但形狀看起來非常典型。所謂的 5%失敗，是指價格向上突破之後，沒有出現
    5%或以上的跟進漲勢，立即又折返而跌破排列的低點。目前這個例子，向上突破的位置是$6^{1/8}$，突破之後的高價是 $6^{1/2}$，漲幅為 6%，足以歸納為成功的排列。上升三角形很少
    發生 5%失敗的情況，只有 2%左右。


