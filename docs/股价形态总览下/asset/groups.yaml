    # 交易戰術


    表 25.4 簡要列示島狀反轉排列的交易戰術。第一項交易戰術實在談不上是什麼戰術，只是目標價位的衡量法則罷了。投資


    # 表 25.4 島狀反轉排列的交易戰術


    交易戰術 解釋

    衡量法則 計算排列最高價減去最低價的高度，由突破點向上或向下衡量排列高度，結果就是底部或頭部型態突破之後的最低目標價位。

    等待回升或 島狀反轉排列完成之後，價格通常都會折返而填補

    回挫走勢 缺口，然後才展開正式的跌勢或漲勢。等待頭部（底部）排列的回升（回挫）走勢完成，當價格恢復跌

    勢（漲勢），才進場建立順勢部位。

    留意趨勢線 價格貫穿趨勢線，通常意味著趨勢已經發生反轉。如果島狀反轉排列發生在趨勢線附近，等待收盤價

    穿越趨勢線之後才進行投資。'
