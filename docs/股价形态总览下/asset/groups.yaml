    ## 辨識準則


    表 32.1 列示矩形底部排列的辨識準則。關於這些辨識準則的說明，請對照圖 32.2。


    進入矩形底部排列之前的價格趨勢朝下，這也是矩形底部與頭部排列之所以有差異的地方。關於排列發生之前的價格趨勢，我通常採用中期趨勢為準。當然，這涉及主觀的判斷，而且每個案例的情況都不太一樣。舉例來說，在圖
    32.1 中，我忽略排列發生前幾天的短期跌勢，把中期下降趨勢視為當時的價格趨勢。在矩形排列內，價格走勢來回游走於兩個水準之間，在下檔獲得支撐，在上檔遭逢壓力，分別利用一條直線銜接下檔的轉折低點與上檔的轉折高點，這就是界定矩形排列的下限與上限，通常呈現水平狀。某些情況下，矩形排列的上限或下限未必呈現絕對的水平，但只要傾斜的角度不太大，就不至於影響型態的效力。


    矩形排列的上限或下限都至少必須觸及兩個轉折點。在圖 32.2 的例子中，排列上限與下限都各有 3 個交替觸及點。銜接趨勢線的觸及點不一定必須交替出現，但至少必須有兩個顯著的轉折高點與轉折低點觸及或接近排列上限與下限。繼續觀察圖
    32.2 的例子，價格始終都在排列上限與下限之間游走，除了 12 月初曾經短暫穿越排列上限之外；這種情況一直維持到 1 月中旬為止，價格才夾著小量向下突破。


    排列內的成交量沒有固定型態，但似乎與突破方向之間存在關聯。圖 32.1 的例子，成交量呈現上升趨勢，結果排列向上突破。反之，圖 32.2 的排列初期發生大量，向下突破之前的成交量很小。雖然成交量型態與突破方向之間似乎存在關聯，但恐怕不能夠利用成交量趨勢來判斷隨後的突破方向，因為所謂「似乎存在關聯」的發生機率太接近
    50%。


    ### 表 32.1 矩形底部排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 價格下降趨勢 | 排列發生之前，短期或中期價格趨勢朝下。 |

    | 水平狀趨勢線 | 排列本身由兩條相互平行的水平狀趨勢線界定，分別代表排列的上限與下限。 |

    | 觸及點 | 排列的上限與下限都至少各有 2 個觸及點（總共至少有 4 個觸及點）。 |

    | 成交量 | 成交量型態視突破方向而定：向上突破，成交量趨於放大；向下突破，成交量趨於縮小。 |


    ![](img/157738047fa61d5e4bdbaf89f0241a36_175_0.png)


    圖 32.2 發生在下降趨勢末端的矩形底部排列。價格向下突破，然後向上折返而穿越矩形排列上限，最後又下跌。


    ## 失敗案例


    圖 32.3 顯示一個發生在價格下降趨勢中的矩形底部排列。由於大部分矩形底部排列屬於既有趨勢的連續型態，所以這個例子按照道理應該向下突破。3 月底，收盤價跌破矩形排列下限
    $54$；向下突破的第 3 天，展開回升走勢；4 月中旬，收盤價向上突破矩形排列的上限。


    > **譯按**：這種說法有些誇張，請參考表 32.2，矩形底部排列的案例總共有 95 個，其中有 54 個連續型態，只不過佔 57% 。


    請注意，價格在 3 月底向下突破之後，只發生 3% 的跌勢，由於跟進跌勢還沒有滿足 5% 之前，走勢就反轉而向上突破，所以先前的向下突破屬於 5% 失敗案例。雖然價格走勢最後還是走低，但在此之前曾經向上突破
    (收盤價穿越矩形排列上限)。當價格向下突破的時候，如果放空這支股票，最寬鬆的停損點應該設定在矩形排列上限；當收盤價向上突破矩形排列，空頭部位被迫回補，所以沒有辦法由最後的價格跌勢中獲利。


    如同圖 32.3 顯示的，矩形底部排列確實有失敗的情況，但非常罕見。在所有 95 個案例當中，只有 2 個失敗的排列。


