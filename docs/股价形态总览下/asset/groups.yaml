    ## 辨識準則


    表 31.1 列示長管頂排列的辨識準則。首先，在過濾圖上尋找兩支連續的向上突兀長線形。這兩支線形必須明顯向上凸出，高度遠超過最近 1 年內的大部分向上突兀線形。另外，兩支線形的價格區間應該大部分相互重疊；某支線形不能明顯短於另一支線形。


    排列兩支線形的高價應該大致相等，差價通常不超過 3/8 點。在所有的案例中，只有很少數排列的線形高價差異接近 $1。絕大部分的案例（88%），差價都不超過
    3/8 點。


    ## 表 31.1 長管頂排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 週線圖的向上突兀長線形 | 在週線圖上，尋找兩支連續的向上突兀長線形。兩支向上突兀線形的長度，必須顯著超過最近一年內的其他向上突兀線形，而且整個排列明顯向上凸出。
    |

    | 價格重疊部分很多 | 長管狀排列的兩支線形必須大部分重疊。兩支線形的長度必須大致相同。 |

    | 兩支線形的高價相差不大 | 兩支線形的高價相差不大，通常在 3/8 點之內，但高價股可能出現 $1 的價差。 |

    | 下降趨勢的向上折返 | 績效表現最佳的排列，經常發生在延伸性下降趨勢的向上折返末端。 |


    深入觀察之後，你將發現大部分的長管頂排列都發生在下降趨勢的向上折返走勢末端，類似圖 31.2 的情況。股價走勢在 3 月中旬創 $39^{7/8}$ 的峰位，經過大約
    1 個月的回檔，價格又開始回升，但沒有多久就在 6 月份出現第二個峰位。股價在一天之內由 $35^{1/2}$ 下跌到 $29$，然後又繼續下跌 4 天才反彈。這波向上折返走勢由低點
    $26^{1/4}$ 反彈到高點 $30^{7/8}$，也是長管頂排列發生的位置。


    排列兩支線形的高點只有 .1/8 點的差異，較週遭其他線形顯著凸出。相對於最近 1 年內的其他向上突兀線形，這兩支線形的長度非常凸顯（除了 3 月中旬的峰位為例外）。由於兩支線形的低價相同，所以價格區間幾乎完全重疊。


    ## Airborne Freight（空運，NYSE，代碼 ABF）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_159_0.png)


    圖 31.2 這個長管頂排列發生在長期下降趨勢的向上折返走勢末端，這種情況的績效經常最佳。


    這個長管頂排列代表價格將恢復下降趨勢。在不足 2 個月的期間內，股價下跌到低點 $18$，然後才稍微反彈。


    ## 失敗案例


    絕大部分的失敗案例，都是因為沒有出現 5% 以上的跌勢，結果價格就恢復漲勢。5% 失敗的情況並不常見，長管頂排列的失敗率只有 18%，但發生的頻率已經高到足以讓我們警惕的程度。


    很多失敗案例都發生在價格上升趨勢。上升趨勢的期間可能長達幾個月，也可能長達一年以上，這些長管頂排列代表趨勢將持續發展。某些情況下，排列出現之後，價格確實下跌，但幅度不足
    5%。另一些情況，價格跌勢相當嚴重，但發生的時間可能在長管頂排列的 2 個月到 5 個月之後。換言之，在長管頂排列與真正的跌勢之間，股價曾經走高。


    夾在上升趨勢的失敗案例中，偶爾也會出現下降趨勢的失敗案例。這些長管頂排列通常發生在延伸性下降趨勢末端，或是下降趨勢向上反轉的漲勢起點。它們不代表下降趨勢的向上折返，而是扮演價格走高的轉折點。


    請參考圖 31.3，當長管頂排列發生的時候，股票已經出現長達一年的橫向盤整走勢。在這類長期的水平狀整理之後，一旦價格向上突破，通常都代表一段顯著漲勢的起點，就如同目前這個例子一樣。我們知道，許多股價型態能夠透過某種衡量方法估計目標價位，但這些衡量方法都受制於一項定律：反轉型態必須存在某種趨勢供其反轉。


    隨著時間經過，圖 31.3 的長期橫向走勢波動幅度愈來愈小，類似於一個很長的等腰三角形。甚至排列內的成交量型態也趨於萎縮，符合等腰三角形的特質。由於等腰三角形的兩腰代表支撐與壓力，由長管頂排列下緣到三角形邊界的價格跌幅大約只有
    5%，顯然不是一項深具潛力的投資機會。原則上，整個股價走勢並沒有足夠的漲幅可供長管頂向下反轉。


    可是，如果長管頂排列正確預示等腰三角形將向下突破，


    ## Conseco Inc. (人壽保險，NYSE，代碼 CNC)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_161_0.png)


    圖 31.3 這個長管頂排列發生在很寬的等腰三角形尾端。實際採取放鬆行動之前，應該等待收盤價向下突破。


    整個故事的結局就不同了。由於我們無法預先判斷等腰三角形的突破方向，所以最好等待實際突破。長管頂排列發生之後，如果投資人等待價格突破等腰三角形的下側邊界，就可以避免發生損失。如同圖
    31.3 顯示的，這個長管頂排列是一個失敗案例，價格並沒有下跌。1995 年 9 月份，價格攀升到 $60\frac{1}{4}$ 的高點，超過長管頂價位的
    100% 以上。


    長管頂排列經常扮演既有價格趨勢的連續型態，所以不要認定它一定是頭部反轉排列。反轉型態的發生頻率為 46%，原則上應該假設價格將朝既有趨勢方向發展。如果趨勢朝上，價格將繼續走高。期待發生最好的情況，準備應付最糟的情況。


    ## 統計數據


    表 31.2 列示長管頂排列的一般統計數據。雖然資料庫涵蓋 500 支股票，但 150 支股票已經提供 443 個案例，我認為這已經達到試算表處理能力的極限。在這些案例中，54%
    為連續型態，46% 為反轉型態。失敗率為 18%，剛好低於我認為可靠排列所允許發生的最高失敗率 20%。大部分失敗案例都屬於 5% 失敗的情況；換言之，長管頂排列出現之後，價格朝下發展（跌幅不足
    5%），但很快又大幅向上翻升。排列平均跌幅為 21%，大約是一般空頭排列的正常水準。


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：<br>1991 年~1996 年的 150 支股票 | 443 個 |

    | 反轉或整理排列 | 238 個整理，205 個反轉 |

    | 失敗率 | 80/443 相當於 18% |

    | 成功排列的平均跌幅 | 21% |

    | 最經常發生跌幅 | 10%~20% |

    | 左側線形成量相對於<br>25 天移動平均的水準 | 123% |

    | 右側線形成量相對於<br>25 天移動平均的水準 | 123% |

    | 對於成功排列，<br>到達最終低點的天數 | 4 個月（123 天） |


    ![](img/157738047fa61d5e4bdbaf89f0241a36_163_0.png)


    圖 31.4 顯示排列跌幅的次數分配，最經常發生跌幅介於 10% 到 20% 的區間。我們可以看見，最初三個欄位——跌幅分別為 10%、15% 與 20%——的高度大約相同，三者合計的排列數量佔總案例的
    55%。所以，超過半數以上的案例，排列跌幅不超過 20%。


    非常巧合地，長管頂兩支線形的平均成交量都是 25 天移動平均量的 123%。我們稍後會深入討論成交量的問題，排列的成交量大小與績效之間，通常沒有顯著的關聯。對於成功排列（跌幅超過
    5% 者），價格到達最終低點的平均期間為 123 天。


    表 31.3 顯示長管頂排列的一些意外發現。基準數據代表所有排列的平均行為，平均跌幅為 21%，失敗率為 18%。我按照長管頂排列兩支線形的高價，把型態劃分為兩種：兩支線形高價相同，兩支線形高價不同，前者的平均跌幅為
    23%，後者的平均跌幅為 21%。


    如同前述提到的，長管頂排列的成交量與績效之間，似乎不存在顯著的關聯。


    ## 表 31.3 長管頂排列的一些統計數據


    | 說明 | 平均漲幅(%) | 失敗率(%) |

    | :--- | :--- | :--- |

    | 基準 | 21 | 18 |

    | 線形高點存在差異的排列漲幅 | 21 | |

    | 線形高點不存在差異的排列漲幅 | 23 | 18 |

    | 排列左側 / 右側 / 兩側線形發生大成交量的績效 | 左 19，右 22，兩側 21 | |

    | 排列左側 / 右側 / 兩側線形發生小成交量的績效 | 左 23，右 21，兩側 23 | |

    | 左側線形大成交量，右側小成交量 | 18 | 16 |

    | 右側線形大成交量，左側小成交量 | 24 | 22 |

    | 線性迴歸價格趨勢：3 個月上升 | 19 | |

    | 線性迴歸價格趨勢：3 個月下降 | 24 | 11 |

    | 特長線形（平均長度的 4 倍） | 22 | |


    排列左側線形發生大量、右側線形發生大量或兩支線形都發生大量，隨後的平均跌幅分別為 19%、22% 與 21%；發生小量的情況也類似，隨後的平均跌幅分別為 23%、21%
    與 23%。可是，對於大量與小量的不同組合，結果就會構成影響。左側線形發生大量，右側線形發生小量，排列平均跌幅為 18%，失敗率稍微降低為 16%。反之，左側線形發生小量，右側線形發生大量，排列平均跌幅為
    24%，但失敗率也提高為 22%。


    我針對長管頂排列發生之前的 3 個月收盤價時間序列進行迴歸分析，對於價格上升趨勢（換言之，迴歸直線的斜率為正數），排列的平均跌幅為 19%；對於價格下降趨勢，排列的平均跌幅為
    24%，而且失敗率只有 11%。如果你打算放空長管頂排列，最好在價格下降趨勢中尋找對象。


    我也衡量排列的高度：取排列兩支突兀線形的較高低價為基準，另外取排列之前線形與之後線形高價的較高者，計算此兩者的差價。


    我也衡量向上突兀線形的高度。對於每支向上突兀線形，取其最高價為基準，另外取之前線形與之後線形高價的較高者，計算此兩者的差價，以此作為向上突兀線形的高度。長管頂排列的高度也採用類似方法衡量高度：取排列兩支突兀線形的較高低價為基準，另外取排列之前線形與之後線形高價的較高者，計算此兩者的差價。如果排列高度設定為最近
    1 年內向上突兀線形高度的 4 倍；平均跌幅為 22%。這個績效與基準數據 21% 比較起來，實在不怎麼特別了不起。


    ## 交易戰術


    表 31.4 列舉長管頂排列的交易戰術。排列的續效取決於既有的趨勢。如果你希望尋找跌幅較大的長管頂排列，就應該鎖定下降趨勢。在長期下降趨勢中，長管頂排列經常顯現為向上折返的整理走勢（換言之，這類長管頂排列是長期下降趨勢的連續型態）。對於這類操作對象，你應該尋找剛開始的下降趨勢。由另一個角度說，你應該避開下降趨勢末端的長管頂排列。至於如何判斷某個趨勢是否即將結束，其中的藝術成份當然很大。可是，如果股價跌勢已經延續幾個月或一年以上，或許就不應該接受長管頂的放空機會。


    ## 表 31.4 長管頂排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 下降趨勢 | 續效表現最佳的長管頂排列，大多發生在價格下降趨勢末端；價格向上反彈，形成長管頂排列，然後繼續下跌。 |

    | 小心趨勢結束 | 如果長管頂排列發生在長期下降趨勢中，不宜視為空頭訊號，該排列可能預示下降趨勢的結束。 |

    | 長期上升趨勢 | 留意長期上升趨勢的狀況。如果長管頂排列發生在長達 1 年或以上的上升趨勢中，可能代表趨勢向下反轉的訊號。然而，這可能是領先訊號，領先期間可能長達
    2~5 個月。 |

    | 上升趨勢的折返走勢 | 長管頂排列發生在上升趨勢中，可能代表短期回檔整理的訊號。這類空頭訊號只適合短期操作。 |


    發生在長期上升趨勢中，長管頂可能代表趨勢結束的訊號。某些情況下，反轉訊號可能領先一段期間，實際反轉發生在幾個月之後，所以不要急著進場放空。一般來說，操作上也應該綜觀整個股價走勢圖，以及相同產業或整體股票市場的情況，然後才決定因應決策。舉例來說，如果長管頂是構成雙重頂或三重頂的最後一個頭部，代表標準反轉訊號的可能性就很高。


    在上升趨勢中，長管頂排列也可能代表短期回檔整理，價格下跌 1、2 個月稍作整理之後，然後又恢復原先的漲勢。回檔的幅度通常介於 10% 到 20% 之間，很少出現更嚴重的回檔。雖說如此，但只要手腳夠俐落，這還是短線放空的機會。


    ## 交易範例


    約翰是一位公務員，服務於州政府，負責處理一些公司登記的申請案件。大多數的獨資事業都在一年內結束營業，但也有少數例外情況。他嘗試利用目前工作的資訊管道，提升投資判斷能力。透過經辦業務的機會，約翰經常與客戶閒聊或溝通觀念，這有助於他判斷投資機會，避免觸犯嚴重的錯誤。


    最近，他把注意力擺在鋼鐵業，因為他得知聯邦政府考慮對海外鋼鐵業者的傾銷行為，採取懲罰性的報復措施。由一些研究報告或媒體評論中，他知道鋼鐵產品價格一路下跌。鋼鐵消費廠商當然歡迎價格下跌，但鋼鐵生產者顯然不同意。所以，鋼鐵業者經由各種管道遊說國會議員，希望保護美國境內的鋼業。


    ## BankAmerica Corp.（銀行，NYSE，代碼 BAC）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_168_0.png)


    圖 31.5 在上升-回檔的模式中，這個長管頂排列發生上升階段與回檔階段的銜接點。先前上升階段的漲幅為 35%，回檔階段的跌幅為 15%。


    1993 年 6 月份，約翰看見圖 31.5 的長管頂排列，於是擬定一份特別的操作計畫。首先，他衡量去年 11 月（A 點）到今年 1 月（B 點）之間的第一隻腳漲幅為
    34%（=[19¼ - 14¾]÷14¾）。其次，計算 B 點到 C 點之間的回檔幅度為 15%。


    由 C 點到長管頂排列之間的第二隻腳漲幅為 36%，非常接近第一隻腳的漲幅 34%。他判斷（或希望）長管頂完成之後，價格的回檔程度會接近 B 點到 C 點之間的回檔程度
    15%。所以，他進場放空股票，成交價格為 $22½$，並且按照前述預估的回檔水準把回補買單設定在 $19$。另一方面，心理停損設定在 $23\frac{3}{4}$，稍高於長管頂右側線形的高點
    $23\frac{3}{16}$。


    經過幾個星期的橫向盤整之後，股價開始暴跌，引發他設定在 $19$ 的回補買單。這筆交易完成於 5 個星期之內，每股獲利大約是 $3$。至於股票的後續走勢，股價在
    $18\frac{1}{4}$ 觸底反彈，由長管頂回檔整理的幅度稍微超過 15%，大體上對應先前 B 點到 C 點的回檔程度。


    為了避免你對於這種上升趨勢回檔整理的操作模式寄望過深，讓我提出一些警告。雖然我經常運用這種方法，但情況未必都很順利。小心謹慎，務必採用停損單，尤其是放空股票的話。利用下檔支撐判斷跌勢可能的最終目標。


