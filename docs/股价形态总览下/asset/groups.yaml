    週線向上關鍵反轉的相關交易戰術不多，所以我不準備編製表格討論。首先，根據衡量法則估計上檔的目標價位。計算程序很簡單，關鍵反轉線形的高價減去低價，此項差值代表排列長度；關鍵反轉當週收盤價加上排列長度，結果就是上檔的最低目標價位。在我們考慮的所有案例當中，完成此項目標價位的排列佔
    84%。


    請參考圖 47.5 的例子，關鍵反轉線形的高價為 $21^{1/8}$，低價為 $17^{3/8}$，收盤價為 $21$。排列長度為 $3^{3/4}$（即
    $21^{1/8} - 17^{3/8}$）。


    **Amgen Inc.（藥品，NASDAQ，代碼 AMGN）**


    ![](img/157738047fa61d5e4bdbaf89f0241a36_489_0.png)


    圖 47.5 週線向上關鍵反轉的交易範例。老周在向上關鍵反轉的隔週買進股票，但過早在 C 點結束部位。


    由收盤價向上衡量排列高度，目標價位為 $24\frac{3}{4}$（$21 + 3\frac{3}{4}$）。向上關鍵反轉排列出現之後，價格於 3 個月內完成目標價位。


    除了目標價位之外，另一項必須特別留意的问题是：向上關鍵反轉必須發生在價格下降趨勢內——或非常接近下降趨勢的谷底。圖 47.5 的關鍵反轉是發生在上升趨勢的向下修正末端。該波段走勢起漲於
    1993 年 8 月，轉折高點 $26$ 出現在 1994 年 1 月，然後回檔整理，谷底為 $17\frac{3}{8}$。


    1994 年 7 月中旬，另外發生一個向上關鍵反轉，圖 47.5 沒有特別標示。這個排列也是發生在回檔整理走勢的末端，意味著價格將恢復既有的漲勢。1993
    年夏天的兩個向上關鍵反轉都屬於失敗案例（圖形內分別標示為 A 與 B）。這兩個排列位在同一段橫向盤整走勢內，A 點之後，價格沒有出現明確的趨勢，繼續橫向發展；B
    點之後，價格不漲反跌，一旦跌破關鍵反轉的低價，排列就確定失敗。雖然價格最後還是上漲，漲勢在 1994 年 1 月份出現高點，但 A 與 B 的向上關鍵反轉發生之後，價格曾出現明顯的短暫跌勢。


    前述這兩個失敗案例凸显一個重要問題：向上關鍵反轉是否真的值得操作？排列失敗率為 23%，風險明顯偏高。另外，排列平均漲幅雖然高達 44%，但最經常發生漲幅大約只有
    20%。我們還有一些其他的股價型態可以考慮，它們的風險更低而績效表現更好。或者，我們可以把關鍵反轉視為一種確認指標，配合其他交易工具共同擬定交易策略。


    ## 交易範例


    老周的脾氣非常暴躁。任何人只要招惹他，就沒有好日子過，甚至會牽連週遭的人。辦公室裡的同事都不願與他打交道，但管理階層對他頗有好感，因爲他擁有工程碩士學位，在專業領域內似乎頗有見地。


    非常不幸地，我所設計的一套印刷指令軟體發生問題，必須與老周協調。稍微觀察一下資料，進行幾項測試之後，發現問題不是出在我的軟體之上。於是，那一年的國慶日提早放煙火。我真的被老周整慘了，只有默默走開。


    三十年風水輪流轉，當老周需要我幫忙的時候，態度顯得非常謙虛。他剛開始從事交易，對於週線向上關鍵反轉似乎頗有興趣。他投資圖 47.5 的股票。這個關鍵反轉完全符合他對於該型態設定的條件，於是進場買進股票，成交價格爲
    $20\frac{1}{2}$。進場之後，股價立即上漲，一切看起來都很順利。隨著時間經過，股價呈現階梯狀的走勢，上漲兩週，然後下跌一週。


    沿著成交量柱狀圖上緣繪製一條直線，結果顯示上升趨勢。成交量呈現「價漲量增，價跌量縮」的現象，老周不知道這種型態是否具有重要意義。對於他來說，這似乎意味著動能增加，協助推升股價走高。


    1995 年 2 月初，他發現一支非常突兀的長線形，當週的成交量也很大（圖形上標示 C 的位置）。這支線形讓他有些擔心。在日線圖上，線形的突兀程度更嚴重：價格快速上漲而創峰位，然後暴跌，同時爆出大量。


    這支線形的成交量與價格型態，看起來像是單日關鍵反轉。老周覺得這是趨勢即將向下反轉的徵兆，應該代表出場訊號；於是，他決定賣出股票，成交價格爲 $34\frac{1}{2}$。


    這筆交易讓老周獲利 67%，足以讓他炫耀幾個星期。一年之後，當他重新叫出股價週線圖，發現股價已經漲到 $66\frac{1}{2}$。這筆交易原本可以賺取
    200%以上的報酬。


    老天，他實在嘔死了。


    ## 摘要統計數據


    ### 定義與說明


    在這份摘要總結內，首先就本書討論的股價型態，按照英文名稱的字母順序排列整理一份績效統計數據。其次依據各種衡量基準，提供績效最佳的前 10 種股價型態。


    表格內某些簡寫或符號的意義：

    - 不重要 = 太少而可以忽略

    - 不適用 = 未經考慮或不適用於本排列

    - ( ) = 括弧內的數據代表下跌

    - * = 因為樣本太小而出現的不尋常讀數


    欄位標題解釋：


    | 欄位 | 解釋 |

    | :--- | :--- |

    | 失敗率 | 沒有出現預期行為的排列百分率，包括 5%失敗情況在內。這些數據適用於排列完成突破（經過確認）之後。 |

    | 反轉或整理 | 標示爲「反轉」，代表該排列大部分都扮演既有趨勢的反轉型態；標示爲「整理」，代表該排列大部分都扮演既有趨勢的整理或連續型態。如果同時標示「反轉」與「整理」，意味著該股價型態沒有明顯的反轉或整理傾向。
    |


    **回挫／回升**


    回挫是股價型態向上突破之後折返排列上限的價格走勢，回升是股價型態向下突破之後折返排列下限的價格走勢。不論回挫或回升，都必須完成在突破之後的 30 個交易日內。回挫百分率只適用於向上突破；回升百分率只適用於向下突破。


    **平均漲幅或跌幅**


    原則上，平均漲幅或跌幅的衡量起點是突破當天最靠近排列的價格（採用盤中高價或低價），衡量到趨勢發生明顯變動之前的最高點或最低點（所謂「明顯變動」是指轉折高點到轉折低點之間的價格變動幅度為
    20%或以上的價格變動幅度為 20%或以上的價格變動幅度為 20%或以上）。


    **最經常發生漲幅或跌幅**


    針對特定股價型態，計算每個案例的實際漲幅或跌幅，然後編製一份實際漲幅或跌幅的次數分配圖。最經常發生漲幅或跌幅，是指次數分配圖內發生頻率最高的漲幅或跌幅，通常剔除最右側的離群欄位。


    **積分評等**


    所謂「積分」是指排列平均漲幅或跌幅，乘以最經常發生漲幅或跌幅，再除以失敗率。然後按照積分高低，分別標示多頭或空頭排列的「評等」。最佳評等為 1，多頭排列的評等由
    1 到 35，空頭排列的評等由 1 到 32。


