    # 交易戰術


    週線向上關鍵反轉的相關交易戰術不多，所以我不準備編製表格討論。首先，根據衡量法則估計上檔的目標價位。計算程序很簡單，關鍵反轉線形的高價減去低價，此項差值代表排列長度；關鍵反轉當週收盤價加上排列長度，結果就是上檔的最低目標價位。在我們考慮的所有案例當中，完成此項目標價位的排列佔
    84%。


    請參考圖 47.5 的例子，關鍵反轉線形的高價為$21^{1/8}$，低價為$17^{3/8}$，收盤價為$21。排列長度為$3^{3/4}$（=$21^{1/8}-17^{3/8}$）。


    Amgen Inc.（藥品，NASDAQ，代碼 AMGN）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_489_0.png)


    圖 47.5 週線向上關鍵反轉的交易範例。老周在向上關鍵反轉的隔週買進股票，但過早在 C 點結束部位。'
  - '[PAGE 490]


    由收盤價向上衡量排列高度，目標價位為 $24 \frac { 3 } { 4 }$ （ $21 + 3 \frac { 3 } { 4 }$ ）。向上關鍵反轉排列出現之後，價格於
    3 個月內完成目標價位。


    除了目標價位之外，另一項必須特別留意的问题是：向上關鍵反轉必須發生在價格下降趨勢內——或非常接近下降趨勢的谷底。圖 47.5 的關鍵反轉是發生在上升趨勢的向下修正末端。該波段走勢起漲於
    1993 年 8 月，轉折高點 $26 出現在 1994 年 1 月，然後回檔整理，谷底為 $17 \frac { 3 } { 8 }$ 。


    1994 年 7 月中旬，另外發生一個向上關鍵反轉，圖 47.5 沒有特別標示。這個排列也是發生在回檔整理走勢的末端，意味著價格將恢復既有的漲勢。1993
    年夏天的兩個向上關鍵反轉都屬於失敗案例（圖形內分別標示為 A 與 B）。這兩個排列位在同一段橫向盤整走勢內，A 點之後，價格沒有出現明確的趨勢，繼續橫向發展；B
    點之後，價格不漲反跌，一旦跌破關鍵反轉的低價，排列就確定失敗。雖然價格最後還是上漲，漲勢在 1994 年 1 月份出現高點，但 A 與 B 的向上關鍵反轉發生之後，價格曾出現明顯的短暫跌勢。


    前述這兩個失敗案例凸显一個重要問題：向上關鍵反轉是否真的值得操作？排列失敗率為 23%，風險明顯偏高。另外，排列平均漲幅雖然高達 44%，但最經常發生漲幅大約只有
    20%。我們還有一些其他的股價型態可以考慮，它們的風險更低而績效表現更好。或者，我們可以把關鍵反轉視為一種確認指標，配合其他交易工具共同擬定交易策略。'
