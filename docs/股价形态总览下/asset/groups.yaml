    # 失敗案例


    當我在股價走勢圖中尋找圓形頂案例的過程中，很快就發現它們大多扮演既有趨勢的連續排列。相關的統計數據也支持我的感覺。所以，我認為任何圓形頂排列只要不是既有趨勢的連續排列，就歸類爲失敗案例。我之所以如此處理，原因與圓形底相同。假定你認爲圓形頂排列完成之後，價格將朝排列發生之前的趨勢方向繼續發展，並且建立對應的部位。在這種情況下，如果價格趨勢發生反轉，部位通常都會陷入虧損。圓形頂反轉型態非常罕見；在我的資料庫內，這類案例不超過
    20%，但畢竟還是會發生。


    圖 35.3 提供一個圓形頂失敗案例。排列發生之前，價格曾經出現 5 個月的上升趨勢。可是，就在圓形頂排列開始的前幾個星期，價格跌破上升趨勢線。針對這個圓形頂排列，投資人可能預期排列完成之後，價格將繼續先前的上漲走勢，但實際的發展顯然不是如此。由圓形頂的高點往下衡量和
    3 個月之後的低點，跌幅爲 60%。


    我可以找到一些技術上的理由，解釋這個排列爲何沒有發生預期中的行爲。圓形頂開始的前兩個星期，價格走勢跌破重要的中期上升趨勢線（圖形只顯示一部分）。10 月中旬到
    11 月初之間，價格回升，重新站上中期趨勢線，然後展開一段相當凌厲的漲勢，一直到隔年 1 月中旬才明顯下跌。價格在 1992 年 9 月份第一次跌破上升趨勢線，這代表一項警訊，意味著上漲趨勢即將告一段落。持有股票的投資人開始覺得緊張。最後，這些緊張的壓力終於轉化為龐大的成交量，驅動股價崩跌。'
