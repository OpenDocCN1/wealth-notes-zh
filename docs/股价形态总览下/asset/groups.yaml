    的迴光返照走勢（dead-cat bounce，死貓反彈），4 個月之後的收盤價甚至更低於 8 月初暴跌的低價。


    在 8 月初股價暴跌之前的圓弧狀走勢中，總共出現 5 個外側日，其中 3 個向下突破，最後一個發生在暴跌之前的第 6 個交易日。


    我們稍後會詳細討論統計數據，但此處先說明失敗率的情況。對於向上突破，外側日的失敗率為 25%，高於可靠排列所允許發生的最高水準 20%。外側日向下突破的失敗率更高達
    42%。所以，向上突破的可靠性高於向下突破，但失敗率還是偏高。


    最初，我認為外側日代表短期趨勢的轉折點，但當我實際觀察某些股票的所有案例（不是每支股票只挑選 10 個排列樣本），發現情況並非如此。外側日可能發生在任何場合。我愈來愈相信這種排列只是隨機事件，沒有操作上的真正價值。在這種心理背景下，讓我們看看統計數據。


    ## 統計數據


    表 29.2 列示外側日的一般統計數據。最初，我要求電腦辨識每個外側日，但很快就發現樣本實在太多而難以處理。這些排列不只讓電腦螢幕上顯示的股價走勢圖雜亂無章，也讓試算表不堪負擔，所以——就如同內側日一樣——我必須限制樣本數量。


    ### 表 29.2 外側日排列的一般統計數據


    | 說明 | 向上突破 | 向下突破 |

    |---|---|---|

    | 排列數量： |  |  |

    | 1991年~1996年的51支股票，每支股票樣本數量不超過10個 | 268個 | 242個 |

    | 反轉或整理排列 | 148個整理，120個反轉 | 133個整理，109個反轉 |

    | 失敗率 | 67/268 或 25% | 101/242 或 42% |

    | 成功排列的平均漲幅/跌幅 | 32% | 17% |

    | 最經常發生漲幅/跌幅 | 10% | 10% |

    | 對於成功排列，到達最終高點/低點的天數 | 4個月（120天） | 1.5個月（49天） |

    | 排列起始於最近12個月價格區間的下緣、中央或上緣 | 下緣21%，中央25%，上緣54% | 下緣33%，中央29%，上緣38% |

    | 前述突破位置的平均漲幅/跌幅 | 下緣49%，中央32%，上緣32% | 下緣14%，中央20%，上緣17% |

    | 外側日前一天、當天與後一天成交量相對於25天移動平均的百分率 | 86%，112%，115% | 86%，112%，115% |

    | 外側日成交量為25天移動平均的1.5倍以上，排列的平均漲幅/跌幅 | 37% | 18% |

    | 外側日成交量為25天移動平均的0.5倍以內，排列的平均漲幅/跌幅 | 29% | 20% |


    對於每支股票，為了取得 10 個間隔適當的外側日案例，我採用某種方法剔除其他的案例。舉例來說，如果某支股票在 5 年的走勢內，總共發生 150 個外側日（請注意，這是非常典型的情況），電腦在每
    15 個案例中挑選 1 個排列，最後只挑選 10 個樣本。另外，每 10 支股票只挑選 1 支，其中考慮產業分配的性質；在全部 500 支股票中，總共只挑選
    51 支。所以，經過如此的篩選之後，我相信 510 個案例能夠充分反映各種產業與整個股票市場的結構與性質，應該是非常具有代表性的樣本。


    由於向上突破的外側日股價型態可能不同於向下突破，所以我把兩者視為不同的分析對象。樣本的分配相當平均，向上突破有 268 個，向下突破有 242 個。不論是反轉或連續排列，外側日基本上都屬於短期型態。


    向上突破的失敗率為 25%，向下突破為 42%，兩者都高於可靠排列所允許發生的最高水準 20%。如何認定某個排列失敗呢？首先決定排列的突破方向；外側日發生之後，如果隨後的收盤價穿越外側日的最高價（最低價），排列視為向上突破（向下突破）。一旦價格向上（向下）突破之後，如果還沒有發生
    5%以上跟進漲勢（跌勢）之前，價格又反轉而穿越外側日的最低價（最高價），就屬於 5%失敗的情況。


    排列向上突破的平均漲幅為 32%，向下突破的平均跌幅為 17%。兩者的績效都低於平均水準：一般多頭排列的平均漲幅為 40%，一般空頭排列的平均跌幅為 20%。所以，外側日不只失敗率偏高，績效也相對不理想。


    觀察排列漲幅或跌幅的次數分配，或許更能夠合理評估外側日操作上的預期績效。在我篩選的案例當中，大部分排列的報酬都介於 5%到 10%左右。少數案例的報酬偏高，使得整體案例的平均績效向上扭曲。


    圖 29.3 同時顯示向上與向下突破的績效分配狀況。最高欄位對應的漲幅或跌幅就代表最經常發生的績效。結果，不論向上或向下突破，最高欄位都發生在橫軸讀數 10%的位置。對於向下突破，跌幅低於
    15% 的案例佔所有排列的 56%。同樣地，對於向上突破，漲幅低於 20% 的案例佔 52%。所以，對於任何外側日排列，進行單筆交易的績效可能不會太理想。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_124_0.png)


    圖 29.3 外側日漲幅與跌幅的次數分配 不論向上突破的最經常發生漲幅或向下突破的最經常發生跌幅，水準都是 10%。


    對於成功的排列，向上突破平均需要 120 天才能到達最終高點，向下突破到達最終低點的平均時間為 49 天。這兩個數據的關係，大約符合正常的預期，因為向上突破的平均漲幅大約是向下突破平均跌幅的兩倍，而且走勢的下跌速度原本就快於向上攀升。


    外側日最經常發生在年度價格區間的哪個位置呢？如果把排列發生當時的最近 12 個月價格區間劃分為三等份（上緣、中央與下緣），大多數（54%）向上突破案例發生在上緣。向下突破的案例也是如此，但三等份區間的案例發生百分率相差并不大。如果考慮前述年度價格區間的三個位置，我們發現向上突破發生在年度低價附近的外側日排列績效最佳，平均漲幅為
    49%。至於向下突破，三個位置的績效都差不多，但還是以中央區間的排列績效最理想，平均跌幅為 20%。


    外側日排列的成交量型態相當正常。以 25 天移動平均值為基準，外側日前一天的成交量為基準量的 86%，外側日當天成交量稍微放大（平均為 112%），外側日隔天繼續保持大量（平均為
    115%）。關於成交量的分析，我沒有把向上與向下突破分為兩種情況考慮。


    排列的成交量放大，是否意味著績效比較理想？沒錯。對於向上突破來說，如果外側日成交量是 25 天移動平均量的 1.5 倍以上（換言之，較正常量高出 50% 或以上），排列的平均漲幅為
    37% ，高於整體向上突破的績效 32% 。向下突破的情況也很類似，大量外側日平均跌幅為 18% ，超過整體向下突破的績效 17% 。


    外側日發生小成交量，結果就不相同了。向上突破的小量外側日，績效相對不理想，平均漲幅只有 29% ，但向下突破的小量外側日，績效比較理想，平均漲幅為 20%
    。所謂的「小量」，是指外側日當天的成交量少於正常成交量的 50% 。


    表 29.3 顯示有關外側日的一些意外結果。外側日前一天的收盤價位置，是否能夠預測隨後的突破方向？這個問題沒有明確的結論。我把整天的價格區間劃分為三個單位，上側與下側各佔
    25% ，中間部分佔 50% 。然後，我統計外側日前一天收盤價落的上側 25% （下側 25% ）的向上突破（向下突破）發生百分率。


    ### 表 29.3 外側日排列的意外發現


    | 說明 | 結果 |

    | :--- | :--- |

    | 外側日前一天收盤價，是否預示排列突破方向？ | 可能 |

    | 外側日當天收盤價，是否預示排列突破方向？ | 是 |

    | 外側日收盤價落在前一天價格區間的位置，是否預示排列突破方向？ | 是 |

    | 外側日是否導致隔天的價格區間擴大？ | 17%的案例是如此 |

    | 內側日前一天與當天之間的價格區間比率愈小，排列的漲幅或跌幅是否愈大？ | 沒有明確結果 |

    | 外側日線形長度愈短，排列績效愈理想？ |  upward突破是如此 |


    結果，外側日前一天收盤價落在價格區間上側 25% 內，隨後向上突破的比率為 46%。——甚至低於投擲鋼板出現正面的機率。反之，外側日前一天收盤價落在價格區間下側
    25% 內，隨後向下突破的比率為 61%。我必須承認，這個結果有些奇怪，但統計數據顯示的情況就是如此。請注意，此處的計算涵蓋所有的排列在內，除了成功的案例之外，還包括
    5% 失敗案例。


    外側日當天的收盤價位置，是否能夠預測隨後的突破方向？運用相同的方法，外側日當天收盤價落在價格區間上側 25% 內，隨後向上突破的比率為 66%。另一方面，外側日當天收盤價落在價格區間下側
    25% 內，隨後向下突破的比率為 62%。


    外側日當天收盤價落在前一天價格區間的位置，是否能夠預測隨後的突破方向？這個問題似乎有些混淆，讓我解釋一下。如同前兩段所描述的，我把外側日前一天的價格區間劃分為三個單位（上側
    25% - 中間 50% - 下側 25%）。接著，針對外側日當天收盤價落在前一天價格區間上側 25% 以上的案例，考慮它們隨後向上突破的比率，結果是 65%。同樣地，針對外側日當天收盤價落在前一天價格區間下側
    25% 以下的案例，考慮它們隨後向下突破的比率，結果是 62%。我不希望過分強調這方面的結果，因為外側日線形長度原本就遠超過前一天線形，所以外側日收盤價落在前一天價格區間上側
    25% 以上（下側 25% 以下）的可能性當然很高。


    關於前述三個發現，我特別強調外側日當天收盤價位置與隨後突破方向的關係。外側日當天收盤價落在當天高價（低價）的 25%之內，隨後比較可能向上突破（向下突破）。


    外側日是否造成隔天的價格區間擴大？不會，對於外側日隔天的線形，大約只有 17%的案例顯示價格區間擴大。這是相當正常的現象，因為外側日當天的價格區間原本就很大，隔天通常不會出現更大的價格區間。


    第 24 章（第 530 頁）曾經提到，內側日前一天與當天的線形長度比率，與排列績效之間似乎存在關係。前述的線形長度比率愈小，排列的績效愈理想。對於外側日來說，似乎不存在類似的關係。關係散佈圖顯示兩者之間似乎只存在隨機關係。


    最後一項令人覺得奇怪的發現是：外側日線形長度愈短，排列績效愈理想。請參考圖 29.4，這是外側日線形長度（盤中高價與盤中低價之間的差值）與排列漲幅（只考慮向上突破的情況）之間的關係散佈圖。圖形中顯示的關係很清楚，外側日線形長度愈短，排列漲幅愈大。舉例來說，對於線形長度超過
    2 點的外側日，漲幅都低於 75%，但線形長度不足 2 點的外側日，最大漲幅為 350%。很多線形較短的案例，漲幅都超過 100%。


    請觀察圖 29.4，漲幅超過 100%的黑點總共有 20 個，線形長度不足 2 點的向上突破案例總共有 185 個，所以小線形出現大獲利的機率很小，大約只有
    11%（換言之，20/185）。如果考慮長度 0.5 點以下的外側日，它們出現 50%漲幅的可能性大約是三分之一（33%）。相當不錯，但不要屏息以待。關於向下突破，線形長度與排列跌幅之間似乎維持隨機關係。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_129_0.png)


    這份相關散佈圖顯示，外側日線形長度愈短，排列漲幅愈大。這種關係只適用於向上突破。


    ## 交易戰術


    外側日的相关交易戰術不多，所以我不打算編製表格說明。首先需要考慮的問題是：究竟是否要操作這種排列？向下突破的外側日，失敗率幾乎高達一半（42%）。向上突破的情況稍好（失敗率為
    25%），但仍然稱不上是可靠的排列（失敗率不得超過 20%）。所以，你真的想要操作這種排列嗎？


    如果答案是肯定的，最好只挑選向上突破的排列。請記住，如果外側日當天收盤價落在最高價的 25%以內，隨後大約有三分之二的機會向上突破（此處沒有顯示失敗率的資料，所以務必謹慎）。如果外側日本身的線形長度很短（例如：小於
    0.5 點），向上突破的漲幅也比較理想。除此之外，請參考「交易範例」。


    ## 交易範例


    許博士是一位成功的醫生。當他沒有看診的時候，很喜歡嘗試一些投資技巧。關於外側日排列，他設定五項必要條件，唯有股價型態完全滿足這五個條件，許博士才會進場操作。


    - 1. 排列必須向上突破。主要是因為向上突破的平均績效優於向下突破（分別為 32%與 17%）。

    - 2. 排列必須發生在年度低價附近。如果把最近 12 個月的價格區間劃分為上緣、中央與下緣三等份，突破點發生在下緣的排列平均績效優於其他兩個等份（下緣為
    49%，上緣與中央分別為 32%）。

    - 3. 外側日當天的成交量必須是平均量的 150%。外側日出現大量的平均漲幅為 37%，小量外側日的平均漲幅為 29%。

    - 4. 外側日當天收盤價必須落在價格區間最上端 25% 以內。這意味著隨後向上突破的可能性較高，股價將攀升。

    - 5. 外側日當天的線形長度必須等於或小於 0.5 點。外側日當天的價格區間愈小，排列績效通常愈理想。


    除了前述五項條件之外，許博士只希望操作他所熟悉的股票。在這些限制之下，理想的操作對象或許較少，但遲早還是會發生。1992 年 11 月初，他見到一個合適的對象（請參考圖
    29.5）。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_131_0.png)


    圖 29.5 向上突破的外側日。許博士在外側日向上突破之後買進，進場當天是內側日。獲利大約是130%。


    逐一檢驗前述五個條件。外側日前一天的價格區間為$16.94~$17，外側日當天為$16.81~$17.13，後者完全吞噬前者，而且外側日的線形長度為$0.32，符合第
    5 個條件的規定。外側日當天以最高價收盤，所以符合第 4 個條件。外側日當天的成交量為 273,600 股，當時的 25 天移動平均量（不含外側日在內的先前
    25 天平均成交量）為 95,400 股。換言之，外側日當天成交量遠超過正常水準的 150%，符合第 3 個條件。按照第 2 個條件的規定，外側日收盤價必須落在年度低價附近。外側日發生當時的年度價格區間為$15.125~$21.31，外側日當天收盤價為$17.13，剛好落在年度價格區間三等份的下緣$15.125~$17.19
    內。第 1 個條件規定排列必須向上突破。


    現在，許博士只能等待。兩天之後，又出現另外一個外側日，他發現這個排列與先前的分析之間並沒有衝突，所以繼續等待突破訊號。隨後的第 4 天，收盤價向上穿越外側日的高價，這代表進場買進的訊號。隔天，許博士進場，股票成交價位於$17½（請參考圖形標示處）。當天收盤後，他發現線形為內側日排列，只能期待這意味著股價將繼續走高。實際上的發展也正是如此。


    許博士是一位長期投資人，相信股價表現主要取決於公司的基本面，所以他並不打算立即獲利了結。隨著時間經過，股價漲漲跌跌，但他仍然抱著長期投資的宗旨，繼續持有股票。在週線圖上，他繪製一條上升趨勢線，在
    1995 年漲勢加速之後，甚至重新繪製上升趨勢線。1996 年 1 月底，股價走勢跌破長期上升趨勢線。這代表技術面轉弱的明確訊號，再加上公司方面發生一些負面的發展，許博士決定賣出股票。結果，股票的成交價格為$41。在
    3 年多的投資期間內，獲利大約是130%。


    許博士的賣出時機稍微早了一些。如果繼續持有 4 個月，股票可以賣在$66 附近。可是，又經過 1 個月左右，股價跌到$45。


    ## 長管底排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_135_0.png)


    ### 摘要資料


    - 外觀：週線圖上，兩支連續向下的突兀長線形。

    - 反轉或整理：長期（超過6個月）的多頭反轉排列。

    - 失敗率：12%。

    - 平均漲幅：47%，最經常發生漲幅為 20%。

    - 意外發現：參照表 30.3。

    - 參閱排列：(22):雙角底排列。


    研究雙角頂與雙角底排列的過程中，我很自然地希望剔除雙角所夾的中間線形，檢驗相關的股價型態。這就是長管排列（pipe formation）的由來。長管底型態（pipe
    bottoms）的失敗率很低（12%），平均漲幅偏高（47%）。


    我另外在日線圖上研究長管底排列，結果不太理想：失敗率為 18%，平均漲幅為 33%。事實上，這些數據還可以接受，真正造成困擾的是最經常發生漲幅只有 10%，而且將近半數案例（45%）的漲幅少於
    20%。由另一個角度說，呈現偏高漲幅的案例也很多，大約有四分之一案例（23%）的漲幅超過 50%。


    我個人認為，在日線圖上操作長管排列，很可能不是碰到失敗的案例，就是漲幅過小而不敷成本。所以，我還是把研究重心擺在週線圖上。如同「摘要資料」顯示的，排列的績效相當傑出。甚至最經常發生漲幅也不錯，讀數為
    20%（事實上，由 10%到 40%欄位的發生次數都差不多，請參考後文的圖 30.4）。漲幅超過 50%的案例大約佔 40%。總之，這個股價型態不只值得深入研究，而且也應該實際納入技術分析的百寶箱內。


    ### 緣起


    圖 30.1 提供一個長管底排列的範例。由這份週線圖可以看見，股價從 1993 年 10 月份的$29 開始下跌，一直跌到左側長管的低點$20⅜。左側長管突兀線形的成交量顯著放大，隔週的成交量更大。兩支向下的突兀線形長度約略相同，價格重疊的部分分很多,
    代表趨勢向上反轉的訊號。


    Ann Taylor (特殊零售, NYSE, 代碼 ANN)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_137_0.png)


    價格由這個低點開始向上翻揚, 漲勢非常凌厲, 1994 年 11 月初創新高價$44⁷⁄₈, 9 個月期間內的股價上漲將近 120%。對於長管底排列而言,
    如此巨幅的漲勢並不罕見。大約有 20% 以上的長管底案例, 漲幅超過 90%。


