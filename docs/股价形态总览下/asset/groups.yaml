    ## 統計數據


    表 28.2 列示單日反轉頭部與底部排列的一般統計數據。這種排列的案例並沒有預期中多，但也稱不上罕見。我總共發現 235 個頭部排列與 331 個底部排列。


    頭部排列的失敗率為 24%，底部排列為 17%。何謂失敗？排列完成之後，價格反轉的幅度不超過 5%，然後又朝排列發生之前的方向發展。對於成功的排列，頭部型態的平均跌幅為
    19%，底部型態的平均漲幅為 26%。


