    7^{1}/_{8} 點。由突破點（排列最高價）向上衡量排列高度，目標價位為$31^{3}/_{4}（=24^{5}/_{8}+7^{1}/_{8}）。排列失敗之前，並沒有完成目標價位。


    由於大多數島狀排列都會發生回升或回挫走勢，雖然排列的失敗率不高，但績效不是很理想，所以在價格突破之後，最好等待折返走勢完成才進場。折返走勢通常發生在第二個缺口之後的
