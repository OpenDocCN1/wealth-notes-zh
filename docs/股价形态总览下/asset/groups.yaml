    ## 交易戰術


    表 42.4 摘要列示三重底排列的相關交易戰術，首先討論衡量法則。衡量法則預測排列完成之後的上檔最低目標價位，計算排列最高價與最低價之間的排列高度，三重底向上突破之後，至少應該會出現相當於排列高度的漲勢。讓我們利用圖
    42.6 來說明計算程序。排列最低價發生在第一谷底的 $21\frac{1}{4}$，排列最高價為第一谷底與第二谷底所夾峰位的 $25\frac{1}{4}$，排列高度為
    $4\frac{1}{2}$。請注意，這個排列的確認水準也是 $25\frac{1}{4}$；換言之，確認水準也就是排列最高價。由排列最高價向上衡量排列高度，目標價位為
    $30\frac{1}{4}$（$25\frac{1}{4} + 4\frac{1}{2}$）。這個目標價位完成於 7 月初。


    ### 表 42.4 三重底排列的交易戰術


    - **衡量法則**：計算排列最高點與最低點之間的高度，由最高點向上衡量排列高度，結果就是向上突破的最低目標價位。

    - **等待確認**：大多數潛在三重底排列都不能演變爲有效的三重底，所以必須等待價格向上穿越三個谷底所夾兩個峰位的最高價（確認水準）。

    - **等待回挫**：有效三重底排列發生回挫走勢的頻率高達 70%，可以在回挫走勢完成之後才進場投資或加碼。

    - **停損**：停損可以設定在排列最低點下方 1/8 點處。當價格朝有利方向發展，順勢調整停損點。


    在什麼情況下，我們可以判定潛在三重底並不是有效的三重底？價格由第三個谷底向上反彈，如果沒有穿越確認點，三重底排列就沒有完成。務必等待確認。由第三谷底起算，三重底排列平均需要
    42 天才能向上突破確認點，期間相當長，但值得等待。在我所觀察的案例當中，這段期間最長者爲 134 天。這個排列是否出現對應的績效？沒錯，價格漲幅爲 82%。順便提及一點，在全部
    122 個案例當中，總共有 13 個排列在 10 天之內到達確認點。


    如果在排列確認之前進場投資，價格通常都會恢復排列發生之前的趨勢。如果既有趨勢朝下發展，潛在三重底排列經常不能完成，價格會貫穿三個谷底提供的支撐而繼續下跌。即使價格沒有跌破支撐，也可能出現長期（超過一年）的橫向走勢。話說回來，如果價格向上穿越確認點，是否就應該立即投資？不一定。價格向上突破之後，經常發生回挫走勢，但不必然發生。價格折返的速度通常很快，或許不完全吻合緩慢下跌的傳統回挫走勢；價格停頓於突破點，盤整一陣子，蓄積動能，然後繼續走高。換言之，我們經常看見單日的向下突尖條形，最低價觸及確認水準，然後向上反彈。


    另一些情況下，價格折返確認水準的速度稍微緩慢一些，但通常不超過 2 個星期（當然不可能超過 30 天）。這才是你進場投資或加碼的時機，但不要在價格還持續下跌之際進場。你應該等待回挫走勢已經完成而價格開始回升的時候進場。為什麼？因為確認水準或許不能提供有效的支撐，回挫走勢可能繼續下跌而貫穿排列的最低價。可是，你也不需要過度反應，這種發展的可能性很低，失敗率只有
    4%。


    進場之後，務必要設定停損，因為你畢竟可能誤判三重底排列，或遇到失敗案例（雖然發生機率只有 4%）。停損可以設定在排列最低價下方 1/8 點處。三重底排列的三個谷底提供強勁的支撐，價格一旦跌破這個支撐，就應該認賠出場。


    如果排列最低點的停損顯得太寬鬆，可以另外挑選距離進場價位較近的支撐做為停損。如果價格朝有利方向發展，儘快把停損點調高到損益兩平點。


    ## 交易範例


    羅素是一位通訊工程師。他曾經告訴我，工程知識的半衰期是 10 年。「20 年之後，所有的專業知識都過時了。這個時候就必須躲到管理階層的盾牌之後。」被時間淘汰之前，羅素希望透過股票投資累積一些安度晚年的資金。


    他對於通訊產業的瞭解相當透彻，能夠藉由這方面的知識進行投資。他有時候從事短線交易，持有股票的時間可能只有 1、2 個星期。另一些時候，他也嘗試長期投資，部位的持有期間可能長達數年；這類投資的獲利往往非常可觀。


    ### Allen Telecom Inc.（電話設備，NYSE，代碼 ALN）


    ![圖 42.6](img/157738047fa61d5e4bdbaf89f0241a36_390_0.png)


    **圖 42.6** 屬於上升趨勢連續型態的三重底排列。羅素做多這個排列，但出場時間太早。賣出股票的 2 個月之後，股價一度上漲到 $40 附近；可是，又經過
    4 個月之後，股價暴跌到 $16 。


    他持有圖 42.6 的股票，進場時間大約在三重底排列發生的一年之前，價格為 $14。他認為這個三重底排列是上升趨勢的連續型態，價格將繼續上漲。他的看法沒錯。當股票向上穿越確認水準的隔天，羅素又加碼買進，成交價格為
    $27。按照衡量法則估計，最低獲利目標應該在 $30\frac{1}{4}$，但他希望實際的獲利水準能夠更高一些。


    隨著股價上漲，羅素每天更新股價走勢圖，並且沿著線形低點繪製上升趨勢線（請參考圖 42.6）。


    另外，他由第三個谷底繪製另外一條上升趨勢線。兩條趨勢線交會於 7 月 20 日；當天，收盤價向下貫穿兩條趨勢線，這代表應該獲利了結的時機。


    當天晚上，羅素打電話給經紀人，請他隔天按照開盤價格賣出持股。隔天，經紀人回報股票成交於 $30\frac{1}{4}$。非常奇怪地，價格剛好等於衡量法則預測的價位。


    羅素知道自己絕對應該賣出，因為股價買穿趨勢線屬於不可輕忽的訊號。不幸地，就目前這個例子來說，賣出決策顯然錯誤。賣出股票的第二天，股票重新恢復漲勢，不久，該公司宣佈盈餘較前一年成長
    40%。這項利多消息使得股價跳空上漲（出現突破缺口），最後到達 $39\frac{3}{4}$ 的高價。可是，創高價的 4 個月之後，股價暴跌到 $16\frac{1}{4}$。


    在 $30$ 賣出股票，雖然沒有掌握最後一大段的漲勢，但獲利了結總勝過不採取行動而看著股價下跌到 $16$。


    # 三重頂排列


    ![圖 43.1 摘要資料示意](img/157738047fa61d5e4bdbaf89f0241a36_393_0.png)


    ## 摘要資料


    - **外觀**：三個顯著的轉折高點，發生在大約相同的價位。

    - **反轉或整理**：短期（3 個月以內）的空頭反轉走勢。

    - **失敗率**：15%。

    - **平均跌幅**：21%，最經常發生跌幅為 10%。

    - **成交量趨勢**：下降。

    - **回升**：84%。

    - **目標價位**：達成為 47%。

    - **意外發現**：第三頭部位高於第二頭部，排列績效較理想，平均跌幅為 22%；反之，第三頭部位低於第二頭部，排列的平均跌幅為 17%。

    - **參照排列**：（3）擴張排列下降直角三角形，（4）擴張頂排列，（6）下降擴張楔形排列，（20）頭肩頂排列，（21）複雜頭肩頂排列，（38）上升三角形排列。


    三重頂排列（triple tops）的失敗率爲 15%，已經相當接近可靠排列所允許出現的最高水準 20%。可是，還有一些排列的表現甚至更差，所以不需太在意這方面的問題。由比較樂觀的角度思考，三重頂排列有
    85% 的機會出現 5% 以上的跟進跌勢。排列的平均跌幅爲 21%，最經常發生跌幅只有 10%。所以，如果你希望藉由三重頂排列掌握重大的放空機會，成功的可能性應該不高。


    排列向下突破之後，有 84% 的機會發生回升走勢，這是我見過的最高水準之一。換言之，當排列完成之後，價格展開正式的下跌之前，通常有第二次進場或加碼的放空機會。


    針對三重頂排列放空之前，必須考慮一個問題，價格完成目標價位的達成率很低，只有 47% 的案例能夠到達最低目標價位。對於可靠的价格型態來說，目標價位達成率應該超過
    80%。所以，三重頂向下突破之後，跌勢超過排列高度的可能性不大。


    關於三重頂排列，我發現一個相當奇怪的現象。如果第三個頭部的最高價超過第二個頭部，排列的平均績效爲 22%；反之，如果第三個頭部的最高價低於第二個頭部，排列的平均跌幅爲
    17%。兩者之間的績效差異具有統計上的顯著意義；換言之，兩者之間的差異非常不可能源自於巧合。


    ## 緣起


    圖 43.1 顯示日線圖上的三重頂排列範例。這份走勢圖讓我想


    ![圖 43.1](img/157738047fa61d5e4bdbaf89f0241a36_395_0.png)


    **圖 43.1** 日線圖上的三重頂排列。請注意三個顯著的峰位：排列完成之後，通常會發生回升走勢。在確認水準附近形成頭肩頂排列，更進一步凸顯弱勢。


    起雲霄飛車，價格創第一個峰位，然後下滑。接著又創高點，但很快又下跌。由最後峰位下滑之後，價格呈現中期跌勢，跌破確認點之後，稍做停頓。


    隨後出現的頭肩頂排列，顯示股價可能進一步下跌的警訊。價格回升到三重頂的確認水準，形成左肩，然後做頭，接著又上漲到右肩。價格跌破頸線之後，終於決定頭部排列的命運。價格出現直線狀的走勢，一路下滑到低點
    $37$，由三重頂的高點 $50$ 起算，跌幅爲 $13$ 或 26%。


    三重頂排列在 $50$ 附近出現三個峰位與兩個谷底。最低谷底代表三重頂的確認水準；唯有當價格跌破確認水準，三重頂排列才正式完成。排列完成之後，價格經常回升到確認水準附近，然後才展開真正的跌勢。


    ## 辨識準則


    表 43.1 列示三重頂排列的辨識準則。當你尋找三重頂排列，或評估某三個峰位是否屬於三重頂排列，首先留意三個峰位的最高價。這些最高價的位置必須大約相同。如果中間峰位顯著高於兩側峰位，價格形態可能是頭肩頂排列。如果三個峰位的價格持續墊高，可能是擴張頂排列。另外，三個峰位所夾的兩個谷底價位也很重要。如果谷底價位持續下滑，可能是下降直角三角形擴張排列；如果三個峰位價格也持續下滑，甚至可能是下降擴張楔形排列。


    如果三重頂排列屬於下降直角三角形擴張排列的一部分，當你根據三重頂排列進場放空的時候，擴張排列應該還沒有向下突破。這個空頭部位甚至可以根據擴張排列來決定獲利了結的位置（當價格下跌到擴張排列下限附近的時候）。


    三重頂排列的三個峰位，形狀經常很尖銳，所夾的兩個谷底形狀則相對平滑。請注意，這種排列的形狀千變萬化，所以不要太固執或吹毛求疵。務必確定三個峰位必須各自獨立，不屬於相同的密集盤整走勢。每個峰位都必須是特定漲勢的轉折高點，形狀必須非常凸顯，遠高於週遭的價位。


    ### 表 43.1 三重頂排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 三個顯著而大規模的頭部 | 尋找三個轉折高點，彼此間隔一段距離，形狀非常明顯。頭部經常呈現 Λ 形的尖銳峰位，三個峰位所夾的兩個谷底，形狀則相對圓滑。
    |

    | 相同價位 | 三個峰位的價位差異應該很小。中間峰位不得顯著較高，否則就是頭肩頂排列。小型的三重頂排列經常呈現擴張型態，尤其是直角三角形的擴張頂，所以也應該留意谷底的價位水準。
    |

    | 成交量下降趨勢 | 排列內的整體成交量應該呈現下降趨勢，但肉眼恐怕很難察覺。表面上看起來，成交量呈現水準狀，只有三個峰位附近的水準特別高。第一個峰位的成交量通常特別大。
    |

    | 確認點 | 當價格由第三個峰位下跌，只代表潛在的三重頂排列。唯有當價格下跌而穿越排列的最低價（確認點），三重頂才算完成。 |

    | 迴線圖 | 由於三重頂通常屬於大規模的排列，不妨參考迴線圖，或許有助於辨識較長期的型態。 |


    排列內的成交量大體呈現下降趨勢，交投相對冷清；當然，每個案例的情況都各自不同。三個峰位的成交量較大，尤其是第一個峰位。


    圖 43.2 顯示三重頂排列的標準結構。三個峰位非常凸顯，彼此隔離，形狀明確。排列結構愈標準，所蘊含的勁道愈強。如果一般投資人不能察覺某個股價型態，就不能運用。如果他们不能按照排列的意涵買進或賣出，該型態就會失敗。換言之，股價型態屬於自我實現的預言，唯有許多市場參與者都採取相同的行動，股價型態才能發揮作用。


