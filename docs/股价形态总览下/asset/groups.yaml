    這份表格需要稍微解釋一下。我們打算評估符合某特定成交量與線形長度條件的關鍵反轉排列績效。垂直欄的「0~1 倍」……「3~4 倍」，是指成交量為 25 週移動平均量的倍數。水平列的「0~5」……「20~25」，是指關鍵反轉線形的長度，表示為當週收盤價的百分率。表示在括弧內的數據，是指符合特定條件的排列數量（樣本大小）；凡是樣本數量小於
    30，相關的結論就值得懷疑。


    舉例來說，第二列（5~10）與第三欄（0~1 倍）對應的讀數為 11%；凡是符合下列兩個條件的週線向下關鍵反轉（總共有 92 個），它們的平均跌幅為 11%：成交量介於
    25 週移動平均量的 0%到 100%之間；關鍵反轉線形長度爲當週收盤價的 0%到 5%之間。讓我們再舉一個例子，第 15~20 列與 2~3 倍欄，對應的讀數爲
    24%。在我們考慮的 367 個關鍵反轉案例當中，凡是當週成交量為 25 週移動平均量的 2 倍到 3 倍之間，線形長度為該週收盤價的 15%到 20%之間，這些排列共有
    9 個，平均跌幅爲 24%。請注意，這個結論的參考價值不大，因爲樣本只有 9 個，實在太小。


    我利用基準欄來評估其右側各欄位的讀數。基準欄原則上就是只考慮線形長度（不考慮成交量）而評估排列的平均跌幅。關於表 46.3 的分析，我剔除一些案例，有些是因爲線形長度實在太長，有些排列的發生時間太接近這份研究的起始日期（資料不足以計算當時的
    25 週移動平均量）。沒有任何案例重複登錄。


    週線向下關鍵反轉的成交量愈大、線形愈長，績效表現是否愈理想？答案大體上是肯定的。由上往下觀察每一欄，我們發現愈下側的讀數通常愈大。可是，由左往右觀察每一列，沒有明顯的證據顯示讀數愈來愈大；所以，我們不確定大成交量是否有助於排列績效。由左上角往右下角觀察（換言之，線形長度與成交量同時增加），績效大體上也有提升的趨勢，但某些樣本實在太小，很難歸納明確的結論。


    表 46.2 與 46.3 都沒有考慮一個問題：排列發生位置與最近峰位的距離愈長，對於排列失敗的可能性有何影響？我考慮所有的失敗案例，分別計算它們與前一個價格峰位的距離（如果關鍵反轉剛好發生在價格峰位，距離設定為零）。我編製一份相關的次數分配圖⁷。就發生百分率而言，我發現整個趨勢向右上方傾斜⁸。對於橫軸考慮的
    5 週刻度，最後 3 週刻度的樣本數量小於可接受的最低水準，所以我不願意提出任何正式的結論。可是，如果前述的趨勢確實存在，這意味著你應該避免接受下降趨勢內——距離前一個峰位超過
    3 到 5 週——的週線向下關鍵反轉。


    ### 交易戰術


    對於週線向下關鍵反轉，我不準備提供特定的交易戰術。如果你打算衡量下檔目標價位，就以關鍵反轉當週的收盤價直接減去線形長度。根據表 46.2 顯示，價格得以完成目標價位的排列佔總案例的
    73%，低於可靠排列的最低水準 80%。


    失敗率高達 37%，如果你打算針對向下關鍵反轉進行放空，風險恐怕太高，應該不值得嘗試。我通常只把這種排列視為趨勢變動的輔助參考資料。舉例來說，假設價格跌破重要移動平均、RSI
    在超買區向下反轉或其他技術指標發出賣出訊號，當時的向下關鍵反轉就能夠做為趨勢變動的確認訊號。


