    沒有變化，所以決定繼續持有部位。


    即使股價數度攀升到$35，老趙仍然認爲自己的看法沒錯。這種韌性顯然有助於目前這筆交易；不久之後，股價又下跌。5月份，股價達成目標價位$30，老趙原本考慮獲利了結，但最後還是決定繼續持有部位。


    股票大約經過 4 個月的橫向走勢，然後又下跌。12月中旬，股價創$25.43 的低點，接著向上反彈。老趙在$27 回補空頭部位，大約是在股價創新低的一個星期之後。這筆交易進行一年左右，1,000
    股的空頭部位幾乎獲利$9,000，相當於 25% 的報酬率。


    ## 線形向下關鍵反轉


    ![](img/157738047fa61d5e4bdbaf89f0241a36_457_0.png)


    ### 摘要資料


    - 外觀：在週線圖上，線形高價高於前一週高價，低價也低於前一週低價。收盤價低於前一週的低價。

    - 反轉或整理：短期（3個月以內）的空頭反轉走勢。

    - 失敗率：37%。

    - 平均跌幅：18%，最經常發生跌幅為 10%。

    - 目標價位達成率：73%。

    - 意外發現：發生位置與最近峰位的距離愈遠，關鍵反轉失敗的可能性愈大。關鍵反轉本身的線形愈長，績效表現通常愈理想。

    - 參照排列：（47）週線向上關鍵反轉。


    週線的向下關鍵反轉排列*（downside weekly reversal formation）——如果可以稱之爲排列的話——的最大特色或許是偏高的失敗率
    37%。換言之，每三個週線向下關鍵反轉，就有一個失敗案例。我認爲股價型態的失敗率應該維持在 20%以下，才可以視爲可靠的排列。所以，就失敗率而言，你或許應該忽略這種排列。


    排列的平均跌幅爲 18%，最經常發生跌幅爲 10%。平均跌幅稍低於一般空頭排列的水準 20%。週線關鍵反轉的統計數據有些意外發現。週線的向下關鍵反轉通常發生在價格峰位附近，經常很接近主要峰位（代表主要趨勢即將反轉的訊號）。週線關鍵反轉距離價格峰位愈遠，失敗的可能性愈高。這顯然符合直覺的判斷，當關鍵反轉發生的時候，如果價格上升趨勢已經向下反轉一陣子，自然更接近最終低點。


    在我研究週線關鍵反轉的過程中，某位分析師告訴我，週線價格區間較寬而成交量較大的關鍵反轉，排列績效較理想。我嘗試檢定這項陳述，發現大型的週線價格區間確實有助於排列績效。可是，我找不到足夠的樣本來驗證較寬週線價格區間與較大成交量，是否有助於提升排列績效。這部分的細節討論，請參考「統計數據」一節。


    > * 譯注：此處的 reversal 又稱爲 key reversal，所以譯文稱爲「關鍵反轉」。請注意，此處的定義與一般文獻上的關鍵反轉並不完全相同。對於頭部的關鍵反轉，一般的定義如下：在上升趨勢中，價格繼續創新高，隨後向下反轉而收盤低於前一支線底的最低價（或收盤價）。就本章提供的走勢圖來說，除了圖
    46.3 與圖 46.2 的第一個例子勉強可以接受之外，其他都不符合關鍵反轉的傳統定義，因爲該週線形都沒有在既有的上升趨勢內繼續創新高。


    ### 緣起


    週線向下關鍵反轉的形狀如何？爲何產生？圖 46.1 提供兩個例子。左側排列發生在價格峰位的一週之後，它代表一段延伸性跌勢的起點，價格由$37^{3}/_{8}
    下跌到$10^{3}/_{8}，跌幅高達 72%。右側排列發生在 1992 年 12 月初，落在價格峰位的兩週之後。由於下降趨勢已經開始，這個關鍵反轉線形只是用來確認價格繼續下跌。關於前述這個結論，我自己也不太滿意，因爲我認為有效的關鍵反轉必須發生在上升趨勢的峰位或附近。


    舉例來說，圖 46.1 左側的關鍵反轉相當接近上升趨勢的


    ![](img/157738047fa61d5e4bdbaf89f0241a36_459_0.png)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_459_1.png)


    圖 46.1 週線圖上的兩個向下關鍵反轉。左側的關鍵反轉代表及時的賣出訊號。兩個關鍵反轉都發生在價格峰位附近。


    末端，可以視為峰位的一部分（假設關鍵反轉隔週的價格繼續上漲，我們根本不會留意收盤價一度下滑）。就右側的關鍵反轉來說，我們很難漠視收盤價已經下跌 3、4 週。由長期的角度觀察，跌勢已經長達一年以上。


    週線圖上為何會發生向下關鍵反轉呢？這種排列又如何產生作用？在價格上升趨勢中，早期的動能會加速發展，然後逐漸放慢，在價格向下反轉之前，動能會減退。如果動能的變化非常快速，在一個星期或一天之內完成，就會在週線圖或日線圖上顯示關鍵反轉的走勢。在該週的前幾天內（或當天的早盤），動能持續上揚，價格創新高。接著出現一些盈餘、相同店面銷售金額或其他基本與技術面的利空消息，使得買盤力道減弱，賣壓轉強。於是，該週最後幾天（或當天後半段）的價格走勢開始下滑，收盤價甚至低於前一週（或前一天）的低價。


    在動能帶領下，前半週的價格走勢繼續創新高，但後半週的情況逆轉，價格收低。精明資金察覺趨勢正在變化，大量拋售股票，這也造成動能的快速變動。隨著價格下跌，賣壓更加強化，股價又進一步下挫。


    ### 辨識準則


    表 46.1 列示週線向下關鍵反轉的辨識準則。在週線圖上，比較容易觀察關鍵反轉。對於價格上升趨勢，只考慮向下的關鍵反轉；這種線形代表上升趨勢即將反轉的警訊。週線的關鍵反轉，大約有一半的機會剛好落在峰位：上升趨勢持續發展，當


    #### 表 46.1 週線向下關鍵反轉的辨識特質


    | 特徵 | 討論 |

    | :--- | :--- |

    | 週線圖 | 採用週線圖觀察單週的關鍵反轉。 |

    | 價格上升趨勢 | 價格必須處在上升趨勢中。如果當時的價格趨勢明顯向下，不必考慮向下的關鍵反轉。在上升趨勢之後的向下或橫向修正走勢中，只要關鍵反轉發生的位置接近峰位（距離
    5 週之內，而且價格差異不大），就視為有效的關鍵反轉。 |

    | 較高的高價與較低的低價 | 相對於前一支線形，高價必須較高，低價也必須較低。不允許兩支線形具有相同的高價或低價。 |

    | 較低的收盤價 | 關鍵反轉的收盤價必須低於前一支線形低價。 |


    週稍早的價格繼續創新高，當週隨後出現急跌的走勢※。在這種情況下，排列很容易辨識，也具有說服力。可是，關鍵反轉另外還有一半的機會落在峰位之後。


    如果向下關鍵反轉發生在明確的價格下降趨勢中，完全不值得考慮。當時的下降趨勢可能繼續發展，也可能即將見底，但向下關鍵反轉不應該做為判斷的依據或訊號。如果向下關鍵


    > ※ 譯按：「關鍵反轉落在峰位」與「關鍵反轉當週價格繼續創新高」，這兩個陳述在邏輯上並不對等。「關鍵反轉當週價格繼續創新高」是「關鍵反轉落在峰位」的必要條件，但不是充分條件。正文強調半數的關鍵反轉剛好落在峰位，其餘半數的關鍵反轉落在峰位之後，這項陳述在邏輯上顯然站不住腳，因為關鍵反轉不必然有效——關鍵反轉的次一支線形可能繼續上漲（這種可能性顯然沒有考慮在前述陳述「半數⋯⋯，其餘半數⋯⋯」之內）。


    反轉發生在價格上升趨勢的末端，我們就必須判斷這代表上升趨勢的反轉，或下降趨勢的整理。


    是否覺得有些混淆？讓我們再回頭觀察圖 46.1。左側的關鍵反轉發生在下降趨勢中，但距離上升趨勢結束只有 2 週之遙，所以我認為這個訊號很重要。反之，右側的關鍵反轉發生在長期下降趨勢（主要下降趨勢）的向上折返（次級趨勢），距離下降趨勢重新開始的起點已經
    3、4 週，所以這個反轉訊號不重要，不需理會。


    為了協助辨識週線的向下關鍵反轉，我計算每個反轉點最近 40 個交易日最高價的線性迴歸直線，利用這條直線的斜率決定趨勢方向。如此可以正確挑選上升趨勢內的向下關鍵反轉。


    除了線性迴歸直線之外，表 46.1 還強調另一項重要準則。就關鍵反轉當週的線形來說，高價必須高於前一支線形的高價，低價必須低於前一支線形的低價，而且收盤價也必須低於前一支線形的低價。換言之，關鍵反轉線形必須完全「吃掉」前一支線形，收盤價顯示未來的價格變動方向。


    圖 46.2 顯示三個向下關鍵反轉，其中兩個具有重要意義。第一個關鍵反轉發生在上升趨勢的峰位。該線形的最高價創最近 3 個月的新高，該線形低價與收盤價都低於前一支線形的最低價。所以，這是一個有效的向下關鍵反轉，代表價格趨勢可能朝下發展的警訊。第二個關鍵反轉發生在價格下降趨勢中，所以不值得理會。最後一個關鍵反轉發生在價格峰位的
    5 週之後，但當時的價位距離峰位不遠，所以我認為這仍然是具有參考價值的關鍵反轉；事實上，由圖 46.2 可以發現，隨後 6 個月內都出現盤跌的走勢。


    **Airborne Freight (空運，NYSE，代碼 ABF)**


    ![](img/157738047fa61d5e4bdbaf89f0241a36_463_0.png)


    圖 46.2 週線圖上的三個向下關鍵反轉。就關鍵反轉當週的線形來說，高價必須高於前一支線形的高價，低價必須低於前一支線形的低價，而且收盤價也必須低於前一支線形的低價。向下關鍵反轉應該發生在上升趨勢末端或附近。


    ### 失敗案例


    週線的向下關鍵反轉，失敗率明顯偏高（37%）。這種排列的突破方向應該朝下；由於線形本身的收盤價已經低於前一周的低價，排列已經向下突破，所以沒有突破方向錯誤的問題。可是，價格向下突破之後，跟進的跌勢可能不足
    5%；所以，5% 失敗仍然構成問題。圖 46.3 顯示 5% 失敗的情況。1994 年 7 月底，價格向上突破一個相當大型的等腰三角形，然後出現向下的關鍵反轉。隔週的收盤價雖然小幅下跌，接下來又出現漲勢。一旦價格漲勢創該波段走勢的新高，向下關鍵反轉就視為失敗。


    **Advanced Micro Devices, Inc.（半導體，NYSE，代碼 AMD）**


    ![](img/157738047fa61d5e4bdbaf89f0241a36_464_0.png)


    看到週線的向下關鍵反轉，如果投資人決定賣出或放空，或許還是明智的決定。關鍵反轉發生之後的 5 個星期，價格由$31 大跌到$22。然後，股價在$22 形成雙重底。1995
    年 1 月份，價格穿越雙重底的確認水準$26⅓，展開另一波段的漲勢，6 月份創$39¼的峰值。由 1995 年 6 月份的峰值開始，價格出現暴跌走勢；截至
    1996 年的年中，價格在 $13 附近。


    如果投資人及早察覺等腰三角形向上突破的意義，或許就會懷疑向下關鍵反轉的有效性。關鍵反轉之後的小跌，似乎只代表等腰三角形向上突破之後的回挫走勢。在這種情況下，等腰三角形的上限能夠提供強烈支撐，回檔走勢應該在此反彈。


    至於向下關鍵反轉何以失敗，我們很難提出一般性的解釋。每個案例都需要個別評估，考慮的因素包括當時的技術面與基本面背景，例如：下檔支撐。如果關鍵反轉低點的下方缺乏強勁的支撐，該排列很可能就會發揮作用。


    如果下檔不遠處就存在鐵板支撐區或強勁的上升趨勢線，關鍵反轉很可能失敗。務必根據個別情況，擬定對應的交易策略。


    產業與整體市況也可能造成影響。如果當時處在大多頭行情中，向下關鍵反轉發生錯誤的可能性較大。同理，如果整個產業處於經濟榮景中，股價跌勢可能很短暫。


    由於週線關鍵反轉的線形經常很長，股價之所以突然大幅下滑，往往有基本面的理由。最好深入瞭解當時的經濟基本面背景，如此才能有充分的信心放空股票或脫離長期投資。


    ### 統計數據


    表 46.2 列示週線向下關鍵反轉的一般統計數據。由於這種排列的數量很多，我只由 500 支股票內挑選 200 支股票，做爲尋找樣本的對象。大部分案例都扮演短期趨勢的反轉型態，很多連續型態屬於
    5% 失敗案例。在我們觀察的案例當中，5% 失敗的情況大約佔 37%；換言之，向下關鍵反轉出現之後，價格沒有發生 5% 或以上的跟進跌勢，然後又顯著上漲。


    #### 表 46.2 連續向下關鍵反轉的一般統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：1991 年~1996 年的 200 支股票 | 412 個 |

    | 反轉或整理排列 | 151 個整理，261 個反轉 |

    | 失敗率 | 153/412 或 37% |

    | 成功排列的平均跌幅 | 18% |

    | 最經常發生跌幅 | 10% |

    | 成功排列的目標價位達成率 | 189/259 或 73% |

    | 成功排列到達最終低點的天數 | 3 個月（80 天） |

    | 突破位置在最近 12 個月價格區間的下緣、中央或上緣 | 下緣 15%，中央 18%，上緣 67% |

    | 前述突破位置的 Average 跌幅 | 下緣 21%，中央 16%，上緣 17% |

    | 相對於關鍵反轉當週，前一週與後一週的平均成交量 | 51%，80% |


    成功排列的平均跌幅爲 18%，最經常發生跌幅爲 10%。我利用排列跌幅的次數分配圖決定最經常發生跌幅，請參考圖 46.4。圖形中最高欄位對應的跌幅，就代表最經常發生跌幅，因為該跌幅的發生頻率最高。請注意，最前面兩個欄位加總的發生頻率就超過一半，意味著半數以上排列的跌幅不足
    15%。所以，週線關鍵反轉發生 5% 失敗的機率雖然不大，但出現重大跌幅的機率也不高。跌幅超過 25%的排列大約只佔五分之一（21%）。對於空頭反轉排列來說，週線關鍵反轉的績效相對不彰。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_467_0.png)


    我原本不打算估計週線關鍵反轉的目標價位，後來還是改變主意。我由該週收盤價向下衡量關鍵反轉線形的長度，以此做爲下檔目標價位。大約有四分之三（73%）的排列能夠完成目標價位，稍低於我認爲可靠排列至少應該有的
    80%。


    向下關鍵反轉到達最終低點所需要的時間平均為 80 天，這是由關鍵反轉線形收盤價做爲起點，衡量到趨勢明顯向上反轉之前的最低價。我假定投資者如果打算交易關鍵反轉，將根據該週收盤價建立部位。


    如果把週線向下關鍵反轉發生當時的最近 12 個月價格區間劃分爲三等份（上緣、中央與下緣），關鍵反轉當週收盤價通常落在哪個位置呢？大部分排列（67%）發生在年度價格區間的上緣。至於這三個區間的績效，我發現排列落在年度價格區間下線的表現最佳，平均跌幅爲
    21%，中央與上緣的跌幅分別爲 16% 與 17%。這些統計數據顯示，走勢愈疲弱的股票（愈接近年度價格低點的股票），一旦發生向下關鍵反轉，隨後的跌幅也愈大。


    相對於關鍵反轉當週，我觀察前一週與後一週的成交量情況。關鍵反轉當週的成交量，平均是前一週成交量的兩倍左右，但成交量很快就萎縮。關鍵反轉隔週的成交量，大約是關鍵反轉當週成交量的
    80%。如果把關鍵反轉當週的 25 週平均成交量做爲基準，大約有 52% 排列的成交量超過平均水準。


    很多技術分析專家非常強調成交量的重要性。根據他們的說法，大成交量對於價格的推動力量，必定超過小成交量。我發現某些股價型態適用這項陳述，但另一些股價型態則未必適用。對於週線向下關鍵反轉來說，如果當週的線形很長，再加上成交量很大，隨後的趨勢變動應該很劇烈。我針對這項結論進行研究，結果列示於表
    46.3。


    #### 表 46.3 符合成交量與線形長度條件的排列平均跌幅


    | 線形長度 (%) | 基準 (%) | 成交量 |  |  |  |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    |  |  | 0~1 倍 (%) | 1~2 倍 (%) | 2~3 倍 (%) | 3~4 倍 (%) |

    | 0~5 | 6 (58) | 5 (36) | 8 (20) | 11 (2) | 0 (0) |

    | 5~10 | 10 (183) | 11 (92) | 10 (75) | 6 (8) | 3 (2) |

    | 10~15 | 16 (73) | 12 (35) | 19 (28) | 19 (5) | 15 (4) |

    | 15~20 | 20 (40) | 22 (14) | 15 (13) | 24 (9) | 4 (1) |

    | 20~25 | 24 (13) | 31 (4) | 21 (4) | 17 (2) | 19 (1) |


    *附註：所顯示的百分率，是符合某特定成交量與線形長度條件的排列平均跌幅。所謂成交量條件，是指 25 週移動平均量的倍數（欄）；所謂線形長度條件，則是關鍵反轉線形長度表示為當週收盤價的百分率（列）。線形長度愈長，確實有助於排列績效，但成交量所造成的影響則不明確。括弧內的數據，是指符合特定條件的排列數量（樣本大小）。*


    這份表格需要稍微解釋一下。我們打算評估符合某特定成交量與線形長度條件的關鍵反轉排列績效。垂直欄的「0~1 倍」……「3~4 倍」，是指成交量為 25 週移動平均量的倍數。水平列的「0~5」……「20~25」，是指關鍵反轉線形的長度，表示為當週收盤價的百分率。表示在括弧內的數據，是指符合特定條件的排列數量（樣本大小）；凡是樣本數量小於
    30，相關的結論就值得懷疑。


    舉例來說，第二列（5~10）與第三欄（0~1 倍）對應的讀數為 11%；凡是符合下列兩個條件的週線向下關鍵反轉（總共有 92 個），它們的平均跌幅為 11%：成交量介於
    25 週移動平均量的 0%到 100%之間；關鍵反轉線形長度爲當週收盤價的 0%到 5%之間。讓我們再舉一個例子，第 15~20 列與 2~3 倍欄，對應的讀數爲
    24%。在我們考慮的 367 個關鍵反轉案例當中，凡是當週成交量為 25 週移動平均量的 2 倍到 3 倍之間，線形長度為該週收盤價的 15%到 20%之間，這些排列共有
    9 個，平均跌幅爲 24%。請注意，這個結論的參考價值不大，因爲樣本只有 9 個，實在太小。


    我利用基準欄來評估其右側各欄位的讀數。基準欄原則上就是只考慮線形長度（不考慮成交量）而評估排列的平均跌幅。關於表 46.3 的分析，我剔除一些案例，有些是因爲線形長度實在太長，有些排列的發生時間太接近這份研究的起始日期（資料不足以計算當時的
    25 週移動平均量）。沒有任何案例重複登錄。


    週線向下關鍵反轉的成交量愈大、線形愈長，績效表現是否愈理想？答案大體上是肯定的。由上往下觀察每一欄，我們發現愈下側的讀數通常愈大。可是，由左往右觀察每一列，沒有明顯的證據顯示讀數愈來愈大；所以，我們不確定大成交量是否有助於排列績效。由左上角往右下角觀察（換言之，線形長度與成交量同時增加），績效大體上也有提升的趨勢，但某些樣本實在太小，很難歸納明確的結論。


    表 46.2 與 46.3 都沒有考慮一個問題：排列發生位置與最近峰位的距離愈長，對於排列失敗的可能性有何影響？我考慮所有的失敗案例，分別計算它們與前一個價格峰位的距離（如果關鍵反轉剛好發生在價格峰位，距離設定為零）。我編製一份相關的次數分配圖⁷。就發生百分率而言，我發現整個趨勢向右上方傾斜⁸。對於橫軸考慮的
    5 週刻度，最後 3 週刻度的樣本數量小於可接受的最低水準，所以我不願意提出任何正式的結論。可是，如果前述的趨勢確實存在，這意味著你應該避免接受下降趨勢內——距離前一個峰位超過
    3 到 5 週——的週線向下關鍵反轉。


    ### 交易戰術


    對於週線向下關鍵反轉，我不準備提供特定的交易戰術。如果你打算衡量下檔目標價位，就以關鍵反轉當週的收盤價直接減去線形長度。根據表 46.2 顯示，價格得以完成目標價位的排列佔總案例的
    73%，低於可靠排列的最低水準 80%。


    失敗率高達 37%，如果你打算針對向下關鍵反轉進行放空，風險恐怕太高，應該不值得嘗試。我通常只把這種排列視為趨勢變動的輔助參考資料。舉例來說，假設價格跌破重要移動平均、RSI
    在超買區向下反轉或其他技術指標發出賣出訊號，當時的向下關鍵反轉就能夠做為趨勢變動的確認訊號。


    > ⁷ 譯按：根據譯者推斷，次數分配圖的橫軸刻度應該取排列發生位置與前一個峰位的週數距離，縱軸則取失敗案例佔總案例的百分率（請注意，所謂的失敗案例與總案例都限定為橫軸標示位置內的排列）。

    > ⁸ 譯按：換言之，關鍵反轉與前一個峰位的距離愈遠，排列失敗的可能性愈大。

    '
