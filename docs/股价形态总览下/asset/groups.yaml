    點的下方 1/8 點處）。價格突破之後，回挫或回升走勢通常會停頓在排列近邊的趋势線或三角形頂點的水平位置。換言之，如果走勢足夠強勁，價格通常不會重新折返進入排列之內。萬一價格穿越遠邊的趋势線，甚至穿越排列最高價或最低價，就應該停損出場。


