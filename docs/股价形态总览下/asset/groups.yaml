    點。上檔目標價位是由右端高點向上衡量排列高度，結果是 $19\frac{1}{2}$（=16+3$\frac{1}{2}$）。這個目標價位完成於隔年 4 月底（圖形沒有顯示）。如果前述扇貝形發生在下降趨勢中，下檔目標價位是由該扇貝形最低點向下衡量排列高度，結果是
