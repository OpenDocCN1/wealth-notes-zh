    \n## 摘要資料\n\n### 向下突破\n\n- **外觀**：排列之前的價格趨勢朝下，排列內轉折高點不斷下滑，轉折低點不斷墊高；排列上限向下傾斜，排列下限向上傾斜，兩條趨勢線向右收斂。向下突破。\n\
    - **反轉或整理失敗率**：短期（3 個月以內）的空頭整理走勢。2%。\n- **平均跌幅**：19%，最經常發生跌幅為 10%。\n- **成交量趨勢**：下降。\n\
    - **提前突破回升**：16%。57%。\n- **目標價位達成功率**：57%。\n- **意外發現**：大量突破的跌幅較大。大量突破比較可能出現回升走勢。\n\
    - **其他名稱**：螺旋。\n- **參照排列**：\n  - （11）菱形排列，（18）頭肩底排列，\n  - （37）鱘鱺排列，（38）上升三角形排列，\n\
    \  - （39）下降三角形排列，（41）等腰三角形頭部排列。\n\n### 向上突破\n\n- **外觀**：排列之前的價格趨勢朝下，排列內轉折高點不斷下滑，轉折低點不斷墊高；排列上限向下傾斜，排列下限向上傾斜，兩條趨勢線向右收斂。向上突破。\n\
    - **反轉或整理失敗率**：短期（3 個月以內）的多頭反轉走勢。3%。\n- **平均漲幅**：41%，最經常發生漲幅為 20%。\n- **成交量趨勢**：下降。\n\
    - **提前突破回升**：16%。43%。\n- **目標價位達成率**：79%。\n- **意外發現**：大量突破的漲幅較大。大量突破比較可能出現回挫走勢。\n\
    - **其他名稱**：螺旋。\n- **參照排列**：\n  - （11）菱形排列，（18）頭肩底排列，\n  - （37）鰭背排列，（38）上升三角形排列，\n\
    \  - （39）下降三角形排列，（41）等腰三角形頭部排列。\n\n我把等腰三角形（symmetrical triangles）劃分為兩大類：排列發生之前，價格呈現下降或上升趨勢。兩種類別的操作方式不盡相同，所以我分別整理最有用的統計數據供讀者參考。本章準備處理等腰三角形底部排列，它們發生在價格下降趨勢之後。\n\
    \n向下與向上突破的失敗率分別為 2% 與 3%。一旦突破發生之後，價格通常都繼續朝突破方向發展，很少發生 5% 失敗的情況（換言之，突破之後的跟進走勢不足），突破之後的平均績效大約類似於一般空頭與多頭排列。向下突破的平均跌幅為\
    \ 19%，向上突破的平均漲幅為 41%。\n\n關於目標價位達成率，一般來說，多頭型態的表現優於空頭型態，等腰三角形底部排列的情況也是如此。向上突破的目標價位達成率為\
    \ 79%，顯著優於向下突破的 57%。向上突破的讀數約略等於可靠排列所允許發生的最低達成率 80%，向下突破則差距很大。\n\n有一個意外發現——或許一點也不意外——大量突破的績效優於小量突破。可是，兩者之間的差異並不具備統計上的顯著意義；換言之，這個結論可能純屬巧合。\n\
    \n相對於小量突破而言，大量突破比較可能發生回挫或回升走勢。可是，相關的樣本太小，這方面的結論未必具有意義。\n\n## 緣起\n\n圖 40.1 提供一個等腰三角形的典型例子。這個案例發生在\
    \ 1995 年秋天，當時許多半導體與半導體資本財公司的股票都處於崩跌走勢。美光股價由先前的峰位 $94\\frac{1}{4}$ 下跌，1995 年底出現等腰三角形排列，型態向下突破之後，價格繼續下跌，1996\
    \ 年夏天的股價低點為 $24\\frac{1}{4}$。\n\n三角形排列內的價格走勢受到上限與下限的界定，來回穿梭於兩條趨勢線之間，轉折高點持續下滑，轉折低點則不斷墊高，使得排列上限向下傾斜，排列下限則向上傾斜，兩條趨勢線相互收斂而構成三角形。排列內的成交量型態呈現向下趨勢，直到突破才爆出大量。\n\
    \n### Micron Technology（半導體，NYSE，代碼 MU）\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_329_0.png)\n\
    \n圖 40.1 下降趨勢的等腰三角形排列。排列發生之前，價格處於跌勢；排列完成之後，價格仍然處於跌勢。\n\n## 辨識準則\n\n等腰三角形屬於辨識上比較困難的一種股價型態，讀者對於這一點或許覺得有些意外，但實際上就是如此。表\
    \ 40.1 列示排列辨識準則。等腰三角形底部排列發生之前，價格呈現下降趨勢，頭部排列則發生在上升趨勢之後。雖然底部排列也可能發生在年度高價附近，但只要排列發生之前的價格處於下降趨勢，我就把型態歸類為底部排列。圖\
    \ 40.2 提供另一個等腰三角形底部排列的例子。\n\n圖 40.2 顯示一個大型的等腰三角形，價格向下突破，隨後的回升走勢折返到排列下限，接著展開正式的跌勢。價格走勢受到兩條趨勢線的界定；排列上限向下傾斜，排列下限向上傾斜。沒有任何一條趨勢線呈現或接近水平狀，兩者都具有某種程度的斜率。這是很重要的特質，因為排列上限或下限如果呈現水平狀，就屬於上升或下降三角形。另外，排列上限與下限朝向右側收斂，不同於各種擴張排列（broadening\
    \ formations）。\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_331_0.png)\n\n圖 40.2\
    \ 大型的等腰三角形排列。價格向下突破，隨後出現回升走勢。\n\n所謂「等腰」是指排列的形狀而言。排列兩條趨勢線分別與三角形底部之間的夾角，度數通常約略相同（譯按：請參考圖\
    \ 40.3，假定這是一個有效的三角形排列，AC 線段與 AB 線段的夾角，度數約略等於 AB 線段與 BC 線段的夾角）。可是，前述現象並不是排列的必要條件；事實上，只要排列上限與下限朝向右側收斂，而且兩者都具有明顯的傾斜角度，就稱為「等腰」三角形。\n\
    \n圖 40.2 的排列各有三個轉折高點與三個轉折低點，分別標示為阿拉伯數字。所謂轉折高點或轉折低點，它們是顯著有別於周遭價格行爲的峰值或谷底（請注意，它們只是局部峰位或局部谷底，不是整個股價走勢圖的最高峰位或最低谷底)。舉例來說，轉折高點發生之前與之後的價位都較低。\n\
    \n我希望特別強調，排列上限至少需要兩個轉折高點，排列下限至少需要兩個轉折低點。圓形底經常被誤以為等腰三角形；價格劃出圓弧狀的走勢，逐漸向上攀升（下限向上傾斜），但上限只有一個轉折高點。請參考圖\
    \ 40.3。這個型態看起來很像三角形，排列起始於轉折高點 A，價格快速下跌到轉折低點 B。然後，價格沿著上升趨勢線攀升，向上發展到轉折高點 C。我們發現，這個型態的留白太多。雖然排列上限與下限都\n\
    \n### Tesoro Petroleum. (綜合石油, NYSE, 代碼 TSO)\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_332_0.png)\n\
    \n圖 40.3 無效的等腰三角形底部排列。價格來回穿梭的頻率不夠，排列中央留白太多。\n\n至少有兩個觸及點，但排列中央留白太多。圖 40.3 與 40.2\
    \ 之間的差異應該很明顯。\n\n成交量看起來雖然不太規則，但基本上還是呈現下降趨勢。我不會只因爲成交量趨勢的緣故而認定某個排列不是等腰三角形。很多情況下，標準的等腰三角形股價型態，卻具有非常古怪的成交量。\n\
    \n如果你自認爲已經看到等腰三角形，最好再詳細確認一次。排列的左側是否還存在另一個轉折低點？這個轉折低點或許是頭肩底排列的「左肩」。另外，某個等腰三角形實際上可能是菱形排列的右半側。由於等腰三角形經常是其他股價型態的一部分，所以務必由更寬的角度觀察。如果你發現等腰三角形只是頭肩底、菱形或其他排列的構成部分，就不應該只考慮等腰三角形，最好由整體股價型態的角度評估行情、判斷排列突破方向與目標價位。\n\
    \n## 失敗案例\n\n圖 40.4 的左側排列是一個失敗的等腰三角形。我稱這種失敗類型爲「5%失敗」，因爲價格沒有朝突破方向出現 5% 或以上的跟進走勢，結果又朝相反方向進行突破。在\
    \ 2、3 月之間，股價發展出一個相當明確的等腰三角形，整個走勢有 2 個轉折高點與 3 個轉折低點，它們都觸及或很接近趨勢線。排列上限與下限相互收斂；可是，這個型態難道不是其他排列的構成部分嗎？三角形排列的第一個轉折高點，配合\
    \ 1 月份的峰位，結果是雙重頂排列；如果把三角形排列向上突破的峰位考慮在內，整個結構是三重頂排列。請注意，在三角形排列之內，價格回檔並沒有跌破前述雙重頂所夾谷底的低點，所以前述雙重頂並沒有被確認或完成。\n\
    \n當價格向上突破第一個三角形而出現 5% 失敗之後，回檔走勢跌破三重頂排列最低谷底，三重頂排列於是完成。整個價格走勢雖然兩度回升到三重頂低點附近，但最後還是繼續下跌。前述的回升走勢構成圖\
    \ 40.4 的第二個等腰三角形排列。\n\n由整體結構觀察，就夠能夠解釋第一個三角形何以失敗。\n\n### Zurn Industries（建材，NYSE，代碼\
    \ ZRN）\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_334_0.png)\n\n圖 40.4 兩個等腰三角形排列。左側的案例向上突破，但沒有出現\
    \ 5% 或以上的跟進漲勢（所謂的 5% 失敗）。這個三角形是三重頂排列的一部分。\n\n不论是雙重頂、三重頂或多重頂，重點是「頂部」排列，因為頂部排列的突破方向自然是朝下。第一個三角形排列向上突破的時候，如果你認定當時已經處於雙重頂排列下，就應該懷疑向上突破的有效性。總之，實際採取行動之前，應該由更宏觀的角度評估；除了日線圖之外，也應該留意週線圖。\n\
    \n## 統計數據\n\n等腰三角形排列有多組不同的統計數據，表 40.2 顯示第一組數據。如同前文提到的，我把三角形排列劃分爲兩大類：排列發生之前，價格走勢呈現下降與上升趨勢者。本章只討論等腰三角形底部排列；換言之，排列發生之前，價格呈現下降趨勢。\n\
    \n### 表 40.2 等腰三角形底部排列的一般統計數據\n\n| 說明 | 向上突破 | 向下突破 |\n| :--- | :--- | :--- |\n\
    | 排列數量：1991 年~1996 年的 500 支股票 | 63 個 | 83 個 |\n| 反轉或整理排列 | 63 個反轉 | 83 個整理 |\n\
    | 失敗率 | 2/63 或 3% | 2/83 或 2% |\n| 成功排列的平均漲幅 / 跌幅 | 41% | 19% |\n| 最經常發生漲幅 / 跌幅\
    \ | 20% | 10% |\n| 達成目標價位的成功排列 | 48/63 或 79% | 46/83 或 57% |\n| 排列平均長度 | 2 個月（55\
    \ 天） | 2 個月（53 天） |\n| 突破發生在排列寬度的位置 | 79% | 74% |\n\n底部排列可能向上或向下突破，表 40.2 的兩個欄位分別列示相關的統計數據。向下突破的案例數量稍多於向上突破，分別為\
    \ 83 個與 63 個。由於排列發生之前的價格處於下降趨勢，向上突破的三角形排列屬於反轉型態，向下突破的排列則屬於連續型態。兩種型態的失敗率都很低，分別為\
    \ 3% 與 2%，我認為失敗率只要不超過 20% 就屬於可靠的排列。\n\n對於成功的排列，續效大約符合平均水準：向上突破的平均漲幅為 41%，向下突破的平均跌幅為\
