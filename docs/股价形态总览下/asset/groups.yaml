    \ 1/8 點處。隨著價格上漲，如果前述停損顯得寬鬆，可以考慮把停止點調整到左端高價的下方。如同圖 36.9 顯示的，左端高價也具有支撐功能；當然，每個案例的情況都不盡相同。\n\
    \n對於下降扇貝形，空頭部位的停損設定在右端高價上側 1/8 點處。請回頭參考圖 36.2 的例子（第 738 頁），左側扇貝形的停損設定在 $19\\frac{1}{2}$。\n\
    \n## 交易範例\n\n柯小姐對於圖 36.9 左側的扇貝形排列很有興趣。圓弧狀走勢不太平滑，成交量型態也不太規則，這都有些令人擔心。可是，她很喜歡這家餐廳的發展潛力，而且基本分析顯示的結論也很不錯。\n\
