    ## 失敗案例


    扇貝形排列也會發生我所謂的「5% 失敗」。當價格朝預期的方向突破，但沒有發生 5% 或以上的跟進走勢，這稱為 5% 失敗。排列突破之後，又回頭朝相反方向發展，使得投資人根據先前突破訊號建立的部位發生虧損。圖
    36.3 與 36.4 顯示兩個失敗案例。首先考慮圖 36.3 的上昇扇貝形排列，4 月份與 5 月份的走勢沒有任何問題，價格呈現平滑的勾狀漲勢，繼續向上挺進，如果不考慮
    5 月份的兩支大量，成交量也呈現標準的 U 型。可是，6 月底的排列創股價頭部。同樣地，這個扇貝形價格型態很標準，勾狀結構很完美。雖然成交量型態有些不規則，但兩端成交量基本上還是超過中間部分。目前這個扇貝形的時間寬度很窄，這是失敗的徵兆之一。這個排列的寬度大約是
    2 個星期，上升排列的每個扇貝形平均寬度為 2 個月（57 天）。由 $19 的峰位開始，股價持續走低，截至 1996 年 7 月中旬為止（這份研究報告的結束日期），價格為
    $13\frac{1}{2}$。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_245_0.png)


    圖 36.3 上升扇貝形排列失敗於 6 月底。大部分的扇貝形都扮演既有趨勢的連續排列，但 6 月底的窄小扇貝形創股價頭部。


    圖 36.4 提供一個下降扇貝形排列的失敗案例。這種排列偶爾會扮演既有下降趨勢的反轉型態；排列完成之後，價格顯著上漲。圖 36.4 的下降扇貝形排列發生之前，價格趨勢朝下。這一點在圖形中沒有清楚顯示，但該股票在
    1993 年 9 月底創高價 $36\frac{5}{8}$，然後開始下跌，一直到 7 月中旬創 $25\frac{3}{4}$ 的低價。由這個低價開始，股價向上攀升，1996
    年 4 月初創高價 $50\frac{5}{8}$。


