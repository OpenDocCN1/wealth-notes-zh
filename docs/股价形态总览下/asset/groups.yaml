    53%（底部），意味著單日反轉通常都夾著大量——至少大於排列發生前一天的成交量。


    ## 交易戰術


    我不鼓勵投資人針對單日反轉排列進行交易。雖然這些排列的平均績效不錯，但最經常發生漲幅或跌幅低於 15%。我認為單日反轉排列的風險太高，不值得積極進行操作。另外，排列的失敗率很高（至少頭部排列是如此），所以最好尋找其他更適當的股價型態。雖然如此，這並不是說單日反轉排列全然沒有參考的價值。如果你考慮買進股票，但發現一支向上突兀的長線形，而且配合著大成交量，那就應該小心了，價格很可能會朝下發展。向下突兀長線形也是如此，代表多頭反轉的訊號。舉例來說，如果你持有的股票發生向下突兀長線形，這或許會讓你很緊張，但該線形實際上蘊含著多頭的徵兆。股價走勢隨後通常會上揚，尤其是突兀線形的價格收在最高價附近。


    ## 交易範例


    吉姆很喜歡滑雪。2 月中旬，當他外出渡假的時候，手中持股剛好創新高（請參考圖 28.6）。由於完全沉迷在滑雪的樂趣中，他忘記向經紀人查詢最近的股價走勢，不知道價格已經下跌
    22%（由 $25 下跌到 $19\frac{5}{8}$）。當他渡假回來之後，才察覺災情慘重。


    ### Kaufman and Broad（住宅營建，NYSE，代碼 KBH）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_112_0.png)


    在週線圖上，這支股票形成長管頂排列（pipe top），意味著股價將下跌，實際上也是如此。當吉姆重新開始追蹤每天的行情發展之後，發現股票正在形成某種擴張排列。根據經驗判斷，他認為擴張底的突破方向可能朝上或朝下（這個排列為什麼是擴張底而不是擴張頂呢？因爲排列發生在價格下降趨勢中，所以屬於底部排列），這意味著他必須隨時保持警戒。3月底，當頭部出現單日反轉排列，他知道這已經是最理想的賣點了。週線圖上出現長管頂型態，加上最近的擴張排列，然後又是目前的單日反轉，所有的徵兆都顯示相同的結論：股價將下跌。所以，他在隔天開盤就賣出股票，成交價格為
    $22\frac{3}{8}$，遠高於買進價位 $10\frac{5}{8}$。


    在這個例子中，吉姆並沒有直接操作單日反轉，而是把該排列做為一種輔助參考資料。1992 年 8 月份，這支股票創低價 $11\frac{3}{8}$，幾乎是當初買價的一半。


    ## 29 外側日排列


    ### 摘要資料


    **向上突破**

    - 外觀：某支線形完全吞噬前一支線形；向上突破。

    - 反轉或整理：短期（3個月以內）的多頭整理型態。

    - 失敗率：25%。

    - 平均漲幅：32%，最經常發生漲幅少於10%。

    - 意外發現：很多，參考表29.3。


    **向下突破**

    - 外觀：某支線形完全吞噬前一支線形；向下突破。

    - 反轉或整理：短期（3個月以內）的空頭整理型態。

    - 失敗率：42%。

    - 平均跌幅：17%，最經常發生跌幅少於10%。

    - 意外發現：很多，參考表29.3。


    外側日（outside days）是內側日（inside days）的對應型態。外側日特徵是：當天線形完全吞噬前一天的線形；換言之，相對於前一天來說，當天的盤中高價較高，盤中低價也較低。外側日發生之後，有兩種可能發展：向上突破或向下突破。


    如同「摘要資料」顯示的，向上突破的失敗率為 25%，稍高於我認爲可以接受的最高水準 20%。平均漲幅為 32%，稍低於一般多頭排列的平均水準 40%，最經常發生漲幅低於
    10%。向下突破的續效在某些方面顯得更差。失敗率高達 42%，平均跌幅為 17%。就平均跌幅來說，這種空頭排列的表現還算不差，但最經常發生跌幅低於 10%。由於最可能發生的漲幅或跌幅都不足
    10%，讀者必須自行判斷這種排列是否值得操作。報酬有限，再加上失敗率偏高，或許意味著最好避開這種型態。


    ### 緣起與辨識準則


    表 29.1 列示外側日的辨識準則。這種線形很普遍，也很容易辨識。請參考圖 29.1 標示黑點的線形，在短短不足一年的走勢內，就出現 15 個外側日。顧名思義，外側日價格區間的兩端都超越前一天的價格區間（換言之，外側日線形完全「吃掉」前一天的線形）。由另一個角度說，相對於前一天，外側日的盤中高價較高，盤中低價較低。在某種意義層面上，外側日排列是由
    2 支線形構成的擴張型態；價格型態向外擴張。


    ### 表 29.1 外側日排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 較高的盤中高價 | 外側日當天的盤中高價高於前一天高價。不允許兩者相等的情況。 |

    | 較低的盤中低價 | 外側日當天的盤中低價低於前一天低價。不允許兩者相等的情況。 |

    | 價格區間 | 外側日前一天的線形必須存在價格區間。換言之，外側日前一天的盤中高價與盤中低價不得相等。（譯按：外側日前一天的線形不得為「十字線」。） |


    ![](img/157738047fa61d5e4bdbaf89f0241a36_117_0.png)


    圖 29.1 許多外側日的例子，標示為黑點。A 點意味著賣價將走高，實際上也是如此，但幅度不大。B 點代表精準的買點。


    當一支相對小線形被隨後的相對長線形「吃掉」，意味著價格走勢即將發動。一旦察覺外側日排列，交易者應該等待後續價格突破外側日高價或低價，然後順著突破方向進行操作。以圖
    29.1 第一個外側日為例，外側日前一天的價格區間介於 $46 ~ $46\frac{3}{4}$ 之間，外側日當天的價格區間擴大爲 $45\frac{7}{8}$
    ~ $46\frac{7}{8}$。接下來，外側日的隔天，價格創新高，但收盤價維持不變。實際的操作或許應該等待更明確的突破——收盤價向上穿越外側日高價或向下穿越外側日低價。


    外側日之後的第三天，走勢向下突破，收盤價爲 $45\frac{1}{2}$，遠低於外側日當天的最低價。由於向下突破，意味著走勢將繼續下跌。實際上的發展也是如此，股價在
    10 月底創 $41\frac{1}{8}$ 的低價。


    雖然前述案例的表現很好，但也不要對這個股價型態抱著不切實際的期待，請觀察圖 29.1 的 A 點，當天也是外側日。隔天，收盤價向上穿越外側日的高價，意味著股價將繼續走高。這個向上突破的訊號沒錯，次一天的收盤價又走高。可是，整個漲勢也僅止於此，價格由此一路下滑。


    假定你在突破之後買進（外側日之後的第 2 天，因為外側日之後第 1 天的收盤價走高，意味著向上突破，你最早能夠在隔天進場），成交價格爲 $46$。9 月份期間內，只有少數幾天能夠讓你勉強獲利了結或持平出場，真正的獲利是由
    11 月底開始。5 月 1 日，股價攀升到 $60$。按照買進成本 $46$ 計算，獲利已經相當可觀，可是其間必須忍受股價下跌到 $41$ 的煎熬（大約 $10\%$
    的帳面損失）。


    現在，你可能想知道，這個排列真的有效嗎？以圖 29.1的 B 點來說，這個外側日準確地預測向上轉折。假定你能夠在最低點$41\frac{1}{8}$進場，然後繼續持有股票一直到價格為$60$，獲利幅度為
    50%。當然，這需要精準地拿捏進、出場時機，一般凡人恐怕辦不到。


    不妨瀏覽本章提供的其他案例，自行評估這種排列是否可靠。觀察一些失敗的例子，或者可以得到某些啓示。


    ### 失敗案例


    外側日出現之後，隔天的價格可能向上或向下突破：換言之，這種排列沒有預定的突破方向，所以不能由這個角度定義排列失敗。可是，此處仍然適用 5%失敗的情況。舉例來說，假定排列向上突破，但出現
    5%以上跟進漲勢之前，價格又下挫（譯按：某天的收盤價跌破外側日的低點），這稱爲 5%失敗。這種情況也同樣適用於向下突破。如果股價向下突破，但出現 5%跟進跌勢之前，價格有顯著向上反轉。


    圖 29.2 提供一個 5%失敗的例子。4 月底，股價展開一波快速的漲勢，5 月中旬則出現一個星期左右的橫向整理，然後才繼續上漲。就在這段橫向走勢之間，出現幾個外側日的例子，請考慮第一個排列（圖形上標示「外側日失敗」）。外側日前一天的線形很短，價格區間介於$26~26\frac{1}{8}$，外側日當天的線形加長，價格區間介於$25\frac{7}{8}$~$26\frac{3}{8}$，顯然完全「吃掉」前一天的線形。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_120_0.png)


    圖 29.2  5%失敗案例。向下突破的外側日，跟進跌勢不足 5%，隨後價格又走高。稍後發生迴光返照的走勢，價格先是暴跌，然後反彈。


    外側日隔天，股價收低，跌破外側日的低價。向下突破意味著價格將繼續走低。可是，又隔一天，股價在盤中雖然繼續走低，但最後的收盤價上揚。如果投資人根據前述的向下突破賣出持股，短期內恐怕會後悔。在連續出現三個外側日的走勢下，股價持續走高，6
    月初甚至創$29\frac{3}{8}$ 的峰位。前述的外側日屬於 5%失敗，因為股價向下突破之後，大約只下跌 3/8 點，然後就恢復漲勢。


    請觀察 3 個月之後的情況。股價出現自由落體的跌勢，單日之內暴跌$9$，相當於 38%的跌幅。當時，股價呈現典型

    '
  mdcn: '

    一旦所有不穩的持股者都賣出之後，股票上檔一段距離內幾乎是海闊天空，完全沒有賣壓。股價先前一路殺低，最後收盤很輕鬆就能夠拉到最高價附近，留下長達數點的下影線。由於上檔一段距離內已經沒有賣壓，股價很容易上漲。


    單日反轉頭部排列也可以運用相同的情節。價格迅速拉高，吸引追價買盤，一路引發上檔設定的停止買單，最後的價格幾乎以最低價收盤。由於附近的買單都已經進場，當時的盤勢將由賣方主導，股價持續走低。


    ## 辨識準則


    如何辨識單日反轉頭部或底部排列呢？表 28.1 列示一些重要的辨識準則。首先討論當時的價格趨勢。一般來說，單日反轉排列都發生在價格趨勢的末端，這些價格趨勢可能長達幾個月，也可能只有幾個星期，個別案例的情況各自不同。


    關於單日反轉，在上升趨勢中尋找頭部排列，在下降趨勢中尋找底部排列。不要挑選下降趨勢內的向上突耳線形或上升趨勢內的向下突耳線形，雖然這些突耳線形可能扮演連續排列，但——顧名思義——單日反轉應該發生在可供趨勢反轉的環境。


    圖 28.1 顯示一個單日反轉頭部排列的例子。這個頭部型態發生在延伸性漲勢末端，該上升趨勢大約起漲於一年之前的 $5.70。圖 28.2 的底部排列則發生在短期下降趨勢的末端。如果回顧稍早的走勢，可以發現
    1992 年 11 月起源的上升趨勢在 1993 年 8 月份做頭。經過一段橫向整理之後，出現為期兩週的跌勢，然後發生單日反轉。


    前述兩個例子中，單日反轉都呈現非常突兀的線形。當天的線形長度遠超過稍早的線形。如果由左往右觀察股價的發展，單日反轉線形似乎突然由走勢中躍出，顯得非常突兀。


    另一個型態辨識重點，是當天的收盤價位置。對於頭部排列，當天收盤價應該落在盤中低價附近。底部排列的情況剛好相反，當天收盤價應該落在盤中高價附近。收盤方向已經顯示稍後的股價發展方向：頭部排列之後，股價將向下發展；底部排列之後，股價將向上發展。隔天的線形雖然可能與單日反轉線形部分重疊，但整個線形與收盤價都應該朝預期方向發展。


    成交量透露最後一項型態特質。一般來說，不論頭部或底部的單日反轉排列，當天的成交量都會放大，顯然超過前一天的水準。這種情況在圖 28.2 中非常明顯，成交量隨著價格走高而持續放大，但圖
    28.1 的例子比較不明顯。相對於頭部排列而言，成交量放大的情況在底部排列比較明顯，這可以驗證一項傳統的的看法：股價上漲需要成交量推動，但可以因為價格本身的重量而下跌。


    ### 表 28.1 單日反轉排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 價格趨勢 | 頭部排列通常發生在幾個星期或幾個月的價格上升趨勢末端；底部排列通常發生在幾個星期或幾個月的價格下降趨勢末端。 |

    | 突兀長線形 | 不論頭部或底部排列，當天應該出現突兀長線形。單日反轉突兀線形的長度至少應該是最近一年內突兀線形平均長度兩倍。 |

    | 極端價位收盤 | 頭部排列在盤中低價附近收盤，底部排列在盤中高價附近收盤。所謂「附近」是指當天價格區間三等份的上線或下線。 |

    | 成交量 | 單日反轉當天通常會爆出大量。 |


    ## 失敗案例


    不幸地，單日反轉排列的失敗比率太高。圖 28.3 與 28.4 都是典型的失敗狀況。圖 28.3 顯示一個失敗的頭部排列案例。4 月上旬，一支向上的突兀線形發生在價格上升趨勢中，當天的價格收在盤中低價附近，成交量很大——完全符合頭部單日反轉的條件。這個頭部排列發生之後，價格確實下跌；單日反轉當天的高價為
    $39，隨後第二天的低價為 $35\frac{1}{2}。


    如果投資人打算運用這個機會，最快的進場時機應該是單日反轉的隔天。所以，為了評估這個排列的績效，我利用單日反轉低價到最終低價之間的距離計算股價跌幅。單日反轉低價為
    $37\frac{1}{8}$，最終低價為 $35\frac{1}{8}$，價格跌幅為 4.4%，屬於 5% 失敗的案例（換言之，排列完成之後，預期方向的走勢幅度不足
    5%）。


    圖 28.4 顯示一個類似的底部排列失敗案例。10 月下旬，在價格下降趨勢中，出現一支向下的突兀長線形。當天的成交量很大，價格收在盤中高價附近。這個單日反轉排列預示價格將走高；事實上，隨後兩個月的趨勢也確實向上發展。由單日反轉當天高價，衡量到波段漲勢最高點（A
    點），漲幅不足 4%，所以也屬於 5% 失敗的案例。


