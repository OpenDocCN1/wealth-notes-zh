  - '[PAGE 22]


    內側日排列（inside days）曾經對我造成嚴重的困擾。對於這個由 2 支線形構成的型態，究竟如何判斷排列成功或失敗呢？關於這個問題的答案，現在看起來很明顯，但當時確實讓我覺得非常困惑。


    根據傳統的看法，內側日發生之後的隔天，應該出現重大的價格走勢；我最後就是按照這個觀點來判定排列成功或失敗。請參考「摘要資料」的失敗率數據，讀數接近 50%——排列成功或失敗，基本上屬於隨機事件*。換言之，內側日發生之後的隔天，半數案例出現重大走勢，另外半數則否。


    某些分析師認爲，不能要求內側日隔天就發生重大走勢。操作股票需要有耐心，重大走勢遲早會發生。可是，「遲早」是多久呢？究竟應該等待 2 天？1 個星期？或 1
    個月？換言之，在多久之內發生的重大走勢，才能視爲與內側日之間存在重要關聯？


    沒錯，如果把等待時間延長爲 2 天或以上，確實有更多的案例在內側日之後發生重大走勢。因此，如果把內側日之後 2 天內發生重大走勢的排列視爲成功，結果又如何呢？向上突破的失敗率由
    56% 降低爲 46%，向下突破的失敗率則由 51%


    > * 譯按：大部分讀者恐怕不能接受這個結論。某個事件發生與否的機率各佔一半，並不代表該事件屬於隨機事件。所謂重大價格走勢——根據定義——應該屬於不經常發生的罕見事件。舉例來說，假定任何一天發生重大價格走勢的機率爲
    10%。如果在內側日隔天發生重大價格走勢的機率爲 50%，內側日顯然具有預測意義。換言之，「內側日隔天發生重大走勢」的事件不應該輕易歸類為隨機事件。'
