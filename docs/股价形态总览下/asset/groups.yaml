    如果股價朝下發展，老趙希望預先估計下檔目標價位。按照三波段衡量跌勢估計，第二支腳可能向下延伸到$28 或更低。


    11 月初，價格向下突破而回升測試排列下限的壓力，當價格又開始下跌的時候，老趙進場放空股票，成交價格為$36。按照衡量法則估計，排列最低價爲目標價位$33\frac{3}{4}，跌幅相當於放空價位的
