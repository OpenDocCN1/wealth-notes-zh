    ## 圖 40.5 與 40.6 分析

    我利用案例實際發生的漲幅或跌幅編製次數分配圖，藉以決定最經常發生漲幅與跌幅，請參考圖 40.5 與 40.6。


    圖 40.5 的最高欄位落在 10%，這代表最經常發生跌幅。跌幅低於 15% 的案例幾乎佔一半（42%），所以對於向下突破的等腰三角形，操作上必須非常謹慎。至於實際績效如何，還必須取決於股票、產業與整個股票市場的情況。


    圖 40.6 的最高欄位發生在 20%，次高欄位發生在 40%。整個次數分配的輪廓顯得非常不平滑，主要是因爲樣本太小的緣故，但分配的結構大體上還是對應其他的股價型態。請注意，在所有向上突破的案例當中，漲幅超過
    20% 的排列佔四分之三。這可以解釋排列平均漲幅 41% 何以遠超過最經常發生漲幅 20%。我懷疑最經常發生漲幅的實際數據可能不止 20%，實際交易的績效應該更好。


    衡量法則可以預測三角形排列突破之後的目標價位。衡量方法有兩種，但對於表 40.2 的統計數據，我是由突破點向上或向下衡量三角形的高度，以此估計排列突破之後的最低目標價位。關於衡量方法的細節討論，請參考「交易戰術」一節。成功向上突破的等腰三角形，其中有
    79% 達成目標價位；向下突破的排列，則有 57% 達成目標價位。根據我個人的看法，排列的目標價位達成率至少應該是 80%，才可以視為可靠的型態；所以，等腰三角形底部排列在這方面還有不足之處。


    不論向上或向下突破，等腰三角形完成排列的平均期間長度大約是 54 天左右。


    我觀察股票市場的等腰三角形排列已經有數年的歷史，這些型態的突破行爲類似於上升與下降三角形。大體上來說，等腰三角形突破的發生時間較我預期的遲。關於突破發生在排列時間寬度上的位置，圖
    40.7 顯示向上與向下突破的次數分配圖。


    我們把排列時間寬度定義爲排列起點到三角形頂點之間的距離，然後把排列起點到突破點之間的距離，表示爲排列時間寬度的百分率。大體上來說，兩個方向的突破點位置分配很類似，大部分突破點都發生在排列時間寬度的四分之三位置。可是，有一點非常奇怪，突破很少發生在排列時間寬度的最初三分之二範圍內：這類向下突破的案例只佔
    15%，向上突破的案例更少，只有 5%。大部分排列的突破點都位在排列時間寬度的 75% 到 80% 之間。所以，你有更多的機會可以進行排列之內的交易：排列發展到三角形頂點還有一段距離之前，每當價格接近排列下限時買進或回補，接近排列上限時賣出或放空。


