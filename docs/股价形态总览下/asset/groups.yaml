    # Zilog Inc. (半導體，NYSE，代碼 ZLG)


    ![](img/157738047fa61d5e4bdbaf89f0241a36_206_0.png)


    我曾經見過最大目標價位的衡量方法，這是衡量矩形排列的橫向寬度（時間距離），然後分別由排列上限或下限，向上或向下衡量矩形寬度，結果就是向上或向下突破之後的最大目標價位。把這種方法套用到目前的案例，目標價位確實相當接近最終高價。我沒有實際測試這種方法，所以很難對於預測的精確性表示任何意見。由於排列的橫向距離代表時間長度，我們不知道時間距離如何能夠衡量價格目標，但或許真的有效或有所幫助也說不定，誰知道呢？


    讓我們回頭探討表 33.5，排列通常順著既有的趨勢方向進行突破。就圖 33.6 的例子來說，既有的趨勢方向朝上，排列最後的突破方向也是朝上。一旦收盤價格穿越排列上限或下限，突破（或提前突破）就算發生。如果突破方向朝上，就進場買進或回補空頭部位；如果突破方向朝下，就進場放空或賣出持股。如果矩形排列的高度夠高，而且你很快就發現這點，那就能夠在排列之內來回操作；換言之，在排列上限附近賣出或放空，在排列下限附近買進或回補。可是，進行這種來回操作的過程中，必須特別留意排列可能朝先前的趨勢方向進行突破。一旦收盤價突破排列上限或下限，你就必須認賠結束來回操作的部位，重新順著突破方向進行操作。


    前進的突破可能是提前突破；一旦價格重新折返矩形排列之內，不要恐慌。雖然最後的突破方向可能與提前突破相同，不過這種可能性低於一半。萬一前述的折返走勢繼續發展而朝相反方向突破，最好立即認賠結束部位。如果你沒有立即結束部位，或許還有機會在回挫或回升走勢中認賠出場。排列突破之後，價格經常會折返排列的外緣，稍後再回頭朝突破方向發展。務必掌握市場提供的第二次機會，不要期待回挫或回升走勢會持續發展，尤其是先前已經發生一次提前突破，因為特定矩形排列同時發生兩個方向提前突破的可能性很渺茫。


    針對某個矩形排列進行操作之前，必須觀察該排列是否是某個更大型態的構成部分。某些情況下，矩形排列可能代表三波段衡量走勢的修正階段。若是如此，由三波段衡量走勢的角度評估矩形排列，判斷或許更精確。矩形頭部排列也可能代表既有價格趨勢的盤頭階段。如果矩形排列發生之前的價格上升趨勢非常陡峭，該矩形排列很可能是頭部反轉型態。


    ## 交易範例


    戴夫是一位藝術家。由於傳統藝術的出路不太理想，戴夫準備進入電腦領域，讓自己成為一位圖形設計師。他嘗試各種硬體與軟體設備，希望透過最新科技來模擬創作的感覺。


    關於如何辨識股價型態，這點對於戴夫來說一點也不困難，因為他的眼力非常敏銳。事實上，這也是戴夫介入圖 33.6 的理由；可是，他沒有及早察覺這個排列，一直等到向上突破之後的回挫過程中，他才發現這個交易機會。


    戴夫計算矩形排列的高度，由排列上限衡量矩形高度，估計上檔的最低目標價位。他決定買進這支股票，但並沒有在回挫走勢中買進。一直等到價格向上跳空（突破缺口），他才實際進場，買進成本為
    $40$。價格連續上漲三天之後，走勢完成目標價位 $43\frac{1}{2}$。隔天，價格再度向上跳空（竭盡缺口），意味著漲勢即將結束*。隔天，收盤價稍微下跌，戴夫也在這一天結束部位，賣出價格為
    $47\frac{1}{2}$。不到一個星期之內，戴夫賺取每股 7 點的獲利，相當於 18% 的報酬率。


    他提領半數的獲利，利用這筆資金更新電腦設備。其餘的獲利仍然留在市場，準備尋找其他的交易機會。


    > *譯按：唯有從事後的角度才能判斷這個缺口是「竭盡缺口」而不是「逃逸缺口」。換言之，譯者認為，絕對不應只因爲價格向上跳空而結束部位。


    # 圓形底排列


    ![](img/157738047fa61d5e4bdbaf89f0241a36_209_0.png)


    ## 摘要資料


    - 外觀：大規模的圓弧狀價格走勢，圓弧缺口（杯口）朝上。

    - 反轉或整理：長期（6 個月以上）的整理走勢。

    - 失敗率：38%。

    - 向上突破之後的失敗率：5%。

    - 平均漲幅：54%，最經常發生漲幅為 20%。

    - 目標價格達成率：36%。

    - 其他名稱：圓形反轉，碟形排列。

    - 參照排列：（7）蹦跳-奔馳底部反轉排列，（9）帶柄杯狀排列，（19）複雜頭肩底排列，（36）上升與下降扇貝形排列。


    圓形底排列（rounding bottom）、圓形反轉（rounding turns）與碟形排列（saucers）都是指相同股價型態而言。這個排列非常類似帶柄杯狀排列（cup
    with handle）與扇貝形排列（scallop formation），讀者不妨參照比對這三種排列的外觀結構與辨識準則。


    如果把這個排列視為既有趨勢的整理（連續）型態，而且把任何其他行為都視為失敗，那麼排列的失敗率高達 38%*。可是，如果只考慮向上突破的案例（價格向上穿越杯口左緣），失敗率下降到
    5% 的偏低水準。我認識任何型態的失敗率超過 20%，就需要特別謹慎。圓形底排列的平均漲幅為 54%，最經常發生漲幅為 20%。請注意，在我考慮的全部案例當中，幾乎有四分之一的排列漲幅超過
    90%，使得平均漲幅向上拉高。偏高的離群漲幅使得排列績效受到扭曲。圓形底排列通常涵蓋數個月的期間，由杯口到杯底的深度往往很可觀，傳統衡量方法經常會高估目標價位。所以，對於成功向上突破的排列，目標價位達成率只有
    36%。


    ## 緣起


    圖 34.1 顯示日線圖上的圓形底排列例子。我不認為這是一個標準範例，因為底部崎嶇不平，型態不夠平滑。5 月中旬，走勢曾經向下頓挫，使得圓形底的完整結構受到破壞，但價格很快就反彈。同樣地，價格在
    6 月底突然向上升動，但隨後立即拉回。6 月底之類的漲勢沒有什麼不尋常，如果發生在你所持有的股票上，大可不必覺得興奮。不論向上或向下的突兀狀價格走勢，都應該回歸到圓形底的弧狀平滑軌跡上。在這個例子中，如果忽略四支突兀狀大量，整個成交量型態也呈現杯口朝上的圓弧狀。


    圓形底排列代表買賣雙方之間的供需競爭過程。最初，賣方居於優勢，使得價格走低。可是，情況逐漸發生變化，雙方的力量趨於平衡，價格走勢也呈現橫向發展。慢慢地，買方取得優勢，緩步推升價格走高。請注意，前述的股價發展軌跡未必非常平滑，買盤或賣盤力道有時候突然轉強，驅動價格出現突兀狀跳動，但最後還是會回歸圓弧狀型態。當價格上漲到先前杯口左線的位置，通常會引發解套賣壓，迫使價格稍微下跌，形成「柄狀」走勢。當這股賣壓被消化之後，價格逐漸回升，終於克服先前杯口左線的高價，順利向上突破。


    ## 辨識準則


    隨著價格發展，圓形底排列很容易辨識，表 34.1 列示相關的型態辨識準則。由於圓形底涵蓋的期間往往很長（在我們的案例當中，最長者為 $2\frac{1}{2}$
    年），所以我通常採用週線圖。首先尋找開口朝上的碗狀或碟形走勢。找到這類的價格結構之後，觀察先前是否發生一段價格漲勢。圓形底排列通常代表先前漲勢的溫和回檔走勢。


    請參考圖 34.2。最近一波漲勢起始於 1991 年底到 1992 年初之間，價格夾著顯著大量由 $4$ 附近上漲到 $9\frac{5}{16}$ 的高點，3
    個月期間的漲幅為 235%。然後，價格走勢趨緩下滑，甚至一度逼近當初的起漲點。整個回檔過程相當平滑，逐漸下跌到低點 $4\frac{3}{4}$，然後又慢慢回升。


    當價格下跌到低點 $4\frac{3}{4}$，最初呈現橫向打底的走勢，幾個星期之後才開始加速上揚。價格上漲到杯口左緣，只是稍作停頓，但沒有顯著受阻於先前峰位的賣壓。向上突破之後，分兩波段挺進到
    $13$ 與 $16$，然後才回檔到 $11$ 附近，重新測試圓形底杯口的支撐。


    圓形底排列通常附帶「柄部」（柄部是直接銜接杯口右緣的價格整理走勢），但不屬於型態的必要條件。當價格沿著圓形底部發展，逐漸上漲到杯口左緣的先前高點附近，在此遭受壓力之後，通常會回檔整理，然後再嘗試向上突破。這類回檔整理的走勢，就是所謂的「柄部」。在柄部走勢中，價格可能必須經過數度嘗試，才能克服上檔杯口左緣與右線的壓力，甚至因為不能消化賣壓而跌破先前的圓形底。


    排列內的成交量型態通常對應價格型態，也是呈現開口向上的圓弧狀結構。請參考圖 34.2，雖然這個例子並不特別明顯。


    ## 失敗案例


    老實說，圓形底排列之所以失敗，大部分都是因為定義的問題。實務研究上，我發現大多數圓形底都屬於既有價格趨勢的連續排列。換言之，價格經過一段漲勢之後，出現開口向上的圓弧狀回檔走勢，然後又恢復先前的上升趨勢。凡是不符合前述格式的圓形底排列，一律歸納為失敗案例。圖
    34.3 提供一個這類的失敗案例；此處的圓形底排列屬於既有價格趨勢的反轉型態。圓形底發生在價格下降趨勢的末端，排列完成之後，價格向上反轉而展開新的上升趨勢。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_215_0.png)


    圖 34.3 反轉型態的圓形底部排列。


    這是一個圓形底排列，但沒有扮演連續型態的角色。如果你預期價格在排列完成之後將繼續下跌，最後可能認賠收場。所以，我把這個排列或其他類似案例視為失敗。


    另一種失敗類型稱為「5%失敗」，價格朝預期方向突破，但沒有發生 5% 或以上的跟進走勢，結果又朝相反方向出現重大走勢*。在我所考慮的全部 243 個案例當中，只有
    11 個排列發生 5% 失敗的情況。這意味著，一旦型態向上突破之後，價格通常都會繼續上漲。


    > *譯按：必須跌破圓形底的最低價，型態才算失敗。


    ## 統計數據


    表 34.2 顯示圓形底的一般統計數據。在 2,500 年的日線圖價格資料中，我總共發現 243 個圓形底排列案例，其中大約有 67% 屬於既有趨勢的連續型態，剩餘的
    33% 則屬於反轉型態。


    排列失敗率高達 38%。如同「失敗案例」一節解釋的，我把所有「非」連續型態的圓形底排列都視為失敗，其中當然包括 5% 失敗的情況在內。如果我們把失敗率只定義在向上突破的圓形底排列上，那麼失敗率就降低為
    5%，屬於非常不錯的水準。這方面的統計數據顯然建議一種交易戰術：等待價格向上穿越杯口右緣，然後才進場買進（也應該留意「杯柄」；等待杯柄走勢結束而價格開始上漲，然後才買進）。


    排列的平均漲幅為 54%，顯著優於一般多頭排列的平均漲幅。可是，最經常發生漲幅為 20%。圖 34.4 顯示成功圓形底排列的漲幅次數分配圖。如果忽略最右側的欄位，最高欄位落在橫軸的
    20% 位置，我認為這代表最經常發生漲幅，也代表圓形底排列單一投資最可能發生的績效。這屬於保守的衡量，因為最右側欄位（漲幅超過 90% 的排列）的發生次數很高，顯然會拉高平均數的水準。


    圓形底排列不適用傳統的目標價位衡量方法。可是，我還是準備採用相同方法來評估其表現。我把型態最低價到杯口右緣之間的價差視為排列高度，然後由杯口右緣向上衡量排列高度，將此價位視為向上突破之後的最低目標價位。大約只有三分之一的排列（36%）達到目標價位。就如同大多數技術分析專家的看法一樣，我認為目標價位達成率至少應該有
    80%，才屬於可靠的型態。


    排列的平均長度為 259 天（8.5 個月）。如果你是短期交易者，或許應該另外尋找其他對象。圓形底排列的醞釀期間很長，對於交易者的耐心是一大考驗。可是，如果你所持有的股票發生圓形底排列，或發現某支股票的圓形底排列已經接近杯口右緣的向上突破階段，本章「交易戰術」一節提供操作上的一些因應方法。


    表 34.3 提供一些突破相關的統計數據。大部分排列向上突破（209 個），向下突破的情況相對罕見。向上突破之後，由排列杯口右緣發展到最終高點之間的平均距離為
    334 天。這是一段很長的期間，但這段期間內的平均漲幅為 54%。


    我把排列完成當時的最近 12 個月價格區間劃分為三等份（上緣、中央與下緣），計算排列向上突破位置落在這三個區間的百分率。結果，大部分排列（98%）的杯口右緣（突破點）落在年度價格區間的上緣，只有
    3 個案例（2%）的突破點落在年度價格區間的中央。就圓形底排列的性質來說，前述結果應該不奇怪。由於杯口右緣是整個排列的最高價，而且排列的涵蓋期間很長（平均
    259 天，已經超過 1 年），所以杯口右緣通常也是最近 1 年內的最高價。表 34.3 沒有提供這三個價格區間的績效數據，因為所有的排列幾乎都落在年度價格區間上緣，實在沒有必要多此一舉。如果讀者堅持需要這方面的資料：年度價格區間上緣的平均漲幅為
    56%（非常接近整體案例的平均漲幅 54%），中央區間的平均漲幅為 45%。


    ## 交易戰術


    我原本不打算討論這個排列的交易戰術，後來改變主意。雖然我不建議讀者經常操作圓形底排列（因為排列的發展期間太長），但有一個訣竅可以提昇操作績效：等待收盤價向上穿越杯口右緣，然後進場買進。進一步討論相關的
    transaction 戰術之前，請注意表 34.4 列示的衡量法則。目標價位可以用來估計排列的獲利潛能。讓我們利用圖 34.5 做爲例子，說明衡量法則的運用。首先計算排列高度，把杯口右緣價位減去排列最低價。對於圖
    34.5 的例子，杯口右緣為 $31\frac{7}{16}$（這個價位頗有爭議），排列最低價為 $25$，排列高度為 $6\frac{7}{16}$ 點。由杯口右緣向上衡量排列高度，目標價位為
    $37\frac{1}{8}$，於 11 月底達成。


    關於衡量法則，我希望提出一項警告：這個方法基本上不適用，因為只有三分之一的圓形底排列能夠達成目標價位。所以，如果你希望評估某個圓形底交易對象的風險／報酬關係，或許應該藉由支撐與壓力來界定報酬潛能。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_221_0.png)


    圖 34.5 沒有杯口左緣的圓形底排列範例。該公司由於盈餘水準不如市場預期，造成迴光返照的暴跌走勢，然後呈現圓形底排列。


    我認為圓形底屬於比較棘手的股價型態之一。正常的情況下，我們把突破點設定為收盤價向上穿越排列杯口左緣的位置。可是，請觀察圖 34.5，目前這個排列沒有杯口左緣；因此，如何界定向上突破呢？在這種情況下，我利用柄部高點（也就是杯口右緣）來取代杯口左緣，藉以設定突破點。在目前這個例子中，柄部高點是
    A 點（至少我認為如此），我進行紙上模擬交易，進場買進股票，價位大約在 B 點。結果，買進價位剛好是轉折高點。隔天，價格下跌，又形成另一個柄部。12 月中旬，在價格跌破上升趨勢線的位置，這是很理想的放空價位。


    ### 表 34.1 圓形底排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 週線圖 | 對於這種長期排列，我偏愛採用週線圖，雖然也可以採用日線圖。 |

    | 圓形碗狀結構 | 價格呈現開口朝上的圓弧狀走勢，通常涵蓋幾個月的期間，往往發生在價格上升趨勢之後。沿著底部期間的線形低價，可以繪製（或想像）一條大體上呈現圓弧狀的曲線。
    |

    | 成交量呈現圓弧狀趨勢 | 成交量型態大體上對應價格型態，呈現開口朝上的圓弧狀。 |


    ### 表 34.2 圓形底排列的一般統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：<br>1991 年~1996 年的 500 支股票 | 243 個 |

    | 反轉或整理排列 | 163 個整理，80 個反轉 |

    | 失敗率 | 93/243 或 38% |

    | 向上突破之後的失敗率 | 11/209 或 5% |

