    | --- | --- | --- | --- | --- | --- |

    | 0~5 | 6 (58) | 5 (36) | 8 (20) | 11 (2) | 0 (0) |

    | 5~10 | 10 (183) | 11 (92) | 10 (75) | 6 (8) | 3 (2) |

