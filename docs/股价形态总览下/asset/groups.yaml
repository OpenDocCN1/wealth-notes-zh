    38% 或 62%，就會獲得強勁的支撐。


    如果回檔幅度與前述兩個比率有關，那麼次數分配圖就應該清楚顯示其中的關係。此处不打算列示這份圖形，因為欄位太多，不適合肉眼觀察，但相關的結果很容易描述。整個次數分配圖呈現鐘鈴狀，存在幾個凸顯的峰位。第一個峰位在
