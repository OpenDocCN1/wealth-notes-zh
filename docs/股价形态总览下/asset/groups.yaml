    請注意，衡量排列高度，一律都採用扇貝形右端高點而不是左端高點。對於上升扇貝形排列，前述衡量方法計算的排列高度較大，因為左側高點比較接近扇貝形最低點，所以型態也比較難以達成目標價位。對於下降扇貝形排列，前述方法衡量的目標價位比較容易達成，因為右側高點比較接近——相對於左側高點而言——扇貝形最低點。雖說如此，上升扇貝形排列的目標價位達成率還是高於下降扇貝形排列，兩者的達成率分別為
