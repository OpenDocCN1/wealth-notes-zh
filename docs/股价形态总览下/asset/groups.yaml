    本章的「交易戰術」一節將詳細討論目標價位（衡量法則)的計算方法，但其原則很簡單：排列向下突破之後，最低目標價位就是排列的最低價格。對於成功向下突破的案例，只有
    63% 的排列能夠達成目標價位，我認為可靠排列的目標價位達成率至少應該是 80%。


    上升楔形排列的平均涵蓋期間為 44 天，個別排列的長度通常介於 3 個星期到 4 個月之間 (大約是 20~120 個交易日)，最適合在日線圖上觀察。


    在所有案例當中，成交量呈現下降趨勢的排列佔 74%。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_447_0.png)


    圖 45.5 上升楔形排列的跌幅次數分配 最經常發生跌幅為 15%，跌幅不超過 15% 的排列幾乎佔一半。


    我計算排列內成交量時間序列的線性迴歸直線，然後利用該直線的斜率來衡量成交量趨勢。請注意，成交量趨勢與排列績效之間存在密切的關聯。


    表 45.2 顯示突破當時的平均成交量。成交量以突破當天為最大，相當於突破前一天的 131%，隨後 5 天仍然保持大量，但有逐漸減少的趨勢。如同下降楔形排列一樣，這幾天的成交量型態大體上趨於下降，但不太規則。


    由於平均數很容易受到離群值的影響，所以我計算每個案例截至突破前一天為止的 25 天期移動平均量。然後比較突破當天成交量與 25 天移動平均量。結果，在所有案例當中，突破當天成交量大於
    25 天移動平均量的排列只佔 38%。這足以驗證一項傳統觀點：價格可以因為本身的重量而下跌；換言之，排列向下突破並不需要大量的配合。


    表 45.3 顯示提前突破的統計數據。提前突破是指收盤價穿越到排列上限或下限之外，隨後又折返排列之內。圖 45.2 提供一個提前向上突破的例子。曾經發生提前向上或向下突破的排列*，佔所有案例的
    22%。排列內曾經發生提前向下突破的案例佔 9%，曾經發生提前向上突破的案例佔 16%。某些排列曾經同時發生向上與向下提前突破。


    *註：在表 45.3 中，第一列數據 40 不包括 5 個同時發生向上與向下提前突破的案例，第二列數據 16 與第三列數據 29 都分別包括同時發生向上與向下提前突破的案例。所以，40+5=16+29。


