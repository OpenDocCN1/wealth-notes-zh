    # 緣起


    由很多方面來說，圖 39.1 的下降三角形都很標準。價格上漲而觸及向下傾斜的排列上限，然後回檔跌勢觸及水平下限而向上反彈。這個排列的成交量型態有些異常。正常情況下，下降三角形排列的成交量應該持續下降，一直到排列突破為止。可是，目前的成交量呈現
    V 型——兩端較大，中間較小。突破方向朝下，成交量不大。一般來說，向下突破比較不需要大量配合，但通常還是會發生大量。突破之後，價格拉升到三角形頂點附近，然後又繼續下跌。


    下降三角形基於什麼理由而形成？圖 39.1 的下降三角形起始於 1994 年 10 月初，它屬於下降趨勢的整理型態。當時，股票由高檔往下跌，市場上特定一群投資人認為這支股票的合理價值為$7\frac{3}{8}$，準備在該價位承接。10
    月 6 日，價格跌破$7\frac{3}{8}$，前述特定買盤進場，推升股價走高。10 月 11 日，價格創$8\frac{3}{8}$的轉折高點，然後出現幾天的跌勢。10
    月 13 日，價格跌到$7\frac{3}{8}$的水準，受到特定買盤支撐，股價沒有繼續下跌。'
