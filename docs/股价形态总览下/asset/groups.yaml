    我把 20% 與 30% 視爲最可能發生的漲幅。另外，透過這份圖形，我們發現 90% 以上的離群漲幅發生頻率頗高，使得平均漲幅向上推升爲 43%。


    關於目標價位的衡量法則，細節內容請參考稍後的「交易戰術」一節。可是，此處準備討論目標價位的達成率。由於衡量法則估計的目標價位距離排列突破點並不遠，所以很容易達成。只要成功向上突破，大部分排列（88%）都能夠完成目標價位（換言之，向上觸及或穿越排列的最高價）。


    完成下降楔形排列的平均期間爲 44 天；實際天數介於 20 天到 125 天之間（3 星期到 4 個月之間）。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_423_0.png)


    圖 44.5 下降楔形排列的漲幅次數分配 最經常發生漲幅介於 20%與30%之間；漲幅超過 90%的案例頗多，使得平均漲幅高達 43%。


    何謂提前突破呢？請參考圖 44.6，這個排列同時發生向上與向下的提前突破。所謂「提前突破」，是指收盤價穿越到排列上限或下限之外，但稍後又折返到排列之內。舉例來說，價格在
    10 月底向上突破，並且停留在排列上限之上幾個星期。然後，價格又下跌，不只回到排列之內，並且貫穿排列下限。可是，只有一天 的收盤價跌破排列下限，隔天收盤價又拉高到排列內。接著，在
    12 月份期間，排列又發生提前向上與向下突破。12 月底到 1 月中旬之間，價格盤整於下降楔形的頂點水準附近，最後才呈現明顯的漲勢。截至今個時候爲止，先前脫離排列的走勢都屬於向上或向下的提前突破。


