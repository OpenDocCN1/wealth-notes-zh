    # Fleet Financial Group Inc.（銀行，NYSE，代碼 FLT）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_87_0.png)


    圖 27.3 演變為雙重頂排列的三波段衡量漲勢失敗案例。


    請參考圖 27.3，其中顯示三波段衡量漲勢最典型的失敗案例。第二隻腳形成雙重頂，使得整個排列提早壽終正寀。失敗的情況非常明顯，因為第二隻腳上漲到 $37\frac{3}{8}$，距離第一隻腳高點還有
    1/8 點。如同大多數標準的三波段衡量漲勢一樣，第二隻腳的長度不如第一隻腳。可是，目前這個排列究竟為什麼失敗呢？請注意，第一隻腳發生之前，股價呈現起伏洶湧的橫向鋸齒狀走勢。第一隻腳非常明確的向上穿越鋸齒狀走勢高點，然後向下翻轉，開始回檔整理。當時的情況讓我想起小型的蹦跳-奔馳反轉排列（bump-and-run
    reversal）。可是，蹦跳階段的高度不足前奏階段的兩倍（譯按：第一隻腳的長度不超過鋸齒狀走勢高度的兩倍）。所以，這多少會影響進場投資意願。


    成交量在第二隻腳的起漲點並沒有明顯放大，這是一項警訊。股票市場有一種說法：「價格漲勢需要大量推動，跌勢可以因為本身的重量而下跌。」在目前這個例子中，由於漲勢沒有大成交量的配合，顯然缺乏動力，不足以克服先前走勢的高點。隨後的跌勢更向下貫穿第一隻腳的起漲點。


    討論排列的統計數據之前，我希望就型態辨識問題提出一些警告。如果修正階段的價格拉回程度太接近第一隻腳的起點，最好避免介入。何謂「太接近第一隻腳的起點」？我不打算提出明確的數據，但修正幅度最好不要超過第一隻腳長度的
    80%。


    除此之外，如果第一隻腳的漲勢不夠筆直，或沒有落在明確的上升通道內（例如圖 27.3 的情況），最好另外尋找交易對象。請注意，股價型態具有明顯的主觀判斷成分，某個排列只要看起來不對勁或感覺不對盤，就不要勉強介入。三波段衡量漲勢屬於常見的股價型態，不要有「不可錯失機會」的心理。


    假定三波段衡量漲勢是發生在長期（例如一年以上）而穩定的價格漲勢之後，修正階段的價格波動程度可能很嚴重。關於這點，我曾經在「辨識準則」一節內提到（請參考表 27.1），但還是值得在此重複強調。


    另外，不要迫不及待的進場。請記住，修正階段的價格回檔程度與第一隻腳的長度之間，應該保持某種比例關係。換言之，價格向下修正的幅度應該是第一隻腳長度的 35%
    到 65% 之間；如果價格回檔 15% 就向上翻轉，很可能是假突破。


    類似如先前價格峰位提供的下檔支撐，往往也會影響修正階段的價格回檔程度。當價格下跌到支撐區，通常會稍作停頓或橫向整理，然後才繼續下跌或向上反彈。支撐區過去發生的成交量大小，經常可以反映支撐力道的強勁程度。如果先前的價格峰位曾經爆出大量，目前所提供的支撐力道就應該相對強勁；當然，強勁的支撐還是可能被貫穿，但至少比較困難一些。


    ## 統計數據


    表 27.2 列示三波段衡量漲勢的統計數據。我總共找到 501 個案例，其中 69% 屬於下降趨勢的底部反轉型態（換言之，第一隻腳發生在價格下降趨勢的末端），剩下的
    156 個案例則屬於上升趨勢的連續型態。


    排列的失敗率為 23%，稍高於我願意接受的最高門檻 20%。這意味著每四個案例當中，平均就有一個排列的第二隻腳不能向上穿越第一隻腳的高點。本章「失敗案例」一節中曾經提到，很多失敗情況都是因為第二隻腳的漲勢停頓於第一隻腳的高點附近，構成雙重頂的頭部排列。


    對於成功的排列來說，平均漲幅為 68%。前文已經提到，如此偏高的漲幅似乎另有玄機，確實如此。由於進場點通常不會發生在修正階段結束之前，所以第二隻腳的平均漲幅（37%）或許更能反映這個排列的實際操作績效。


    圖 27.4 顯示全部成功案例的漲幅次數分配。我把最經常發生漲幅定義爲幾個最高欄位對應的漲幅。由於最右側欄位沒有對應固定的漲幅區間，而是代表「漲幅超過 100%
    的剩餘部分」，所以不列入考慮。按照圖 27.4 顯示的，排列的最經常發生漲幅介於 30% 到 60% 之間，尤其是 50% 到 60% 之間。請注意，最右側欄位（漲幅超過
    100% 的排列）佔所有案例的比率高達四分之一以上，所以最經常發生漲幅可能遠高於前述討論的水準。請記住，此處的漲幅是由第一隻腳的最低點，衡量到第二隻腳的最高點。由於實際進場點通常在第二隻腳的起點，所以操作績效不能直接參考平均漲幅或最經常發生漲幅。


    ### 表 27.2 三波段衡量漲勢的一般統計數據


    | 說明 | 統計數據 |

    |---|---|

    | 排列數量：<br>1991 年 ~ 1996 年的 500 支股票 | 501 個 |

