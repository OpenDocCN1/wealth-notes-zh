    向上提前突破很罕見，在我們的案例當中只有 6%，突破過程的成交量高於平均水準。表 39.3 倒數第 3 列到第 6 列的數據，嘗試說明提前突破與真正突破的方向關聯。對於提前向下突破的案例，其中有
