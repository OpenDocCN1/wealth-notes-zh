    ### 圖 36.5 上升扇貝形排列的漲幅次數分配


    圖 36.5 的兩個最高欄位代表最經常發生漲幅，因為如果你隨機挑選某一個上升扇貝形排列，其漲幅最可能發生在 20% 到 30% 之間。雖然所有成功排列的平均漲幅為
    33%，但最可能發生的漲幅介於 20% 到 30% 之間。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_250_0.png)


    ### 圖 36.6 下降扇貝形排列的跌幅次數分配


    圖 36.6 顯示下降排列的跌幅分配。最高欄位落在橫軸的 20%，這代表最經常發生跌幅。請注意，跌幅 15% 與 25% 的欄位也很高（發生百分率很大）。所以，如果你隨機衡量一個下降扇貝形排列，最可能發生的跌幅為
    20%，但 15% 與 25% 的發生機率也很高。


    關於衡量法則的細節，請參考「交易戰術」一節的說明，但此處準備簡單介紹計算方法。首先衡量排列的高度，然後由排列右端高點向上衡量排列高度，或由型態最低點向下衡量排列高度。上升扇貝形排列的目標價位達成率為
    71%，下降排列的達成率只有 52%。我認為可靠排列的目標價位達成率應該超過 80%，所以兩種扇貝形排列在這方面都有所不足。這有什麼涵意？如果扇貝形排列發生在價格趨勢的初期，達成目標價位的可能性很高；反之，如果價格趨勢已經存在很久（舉例來說，超過
    4 個月），扇貝形排列很可能無法達成目標價位。當然，這也取決於整體股票市場的情況。在股票大多頭行情中，股價跌勢通常很短暫，所以評估目標價位也需要考慮當時的大盤環境。


    不論上升或下降扇貝形排列，涵蓋期間平均大約是 50 多天。某些排列的期間稍長（例如圖 36.1 的例子），有些稍短，但平均大約是 50 天左右。


    相對於下降排列到達最終低點的期間，上升扇貝形排列到達最終高點需要耗費兩倍的時間。配合平均漲幅與跌幅的數據考慮，下跌走勢比較快速而猛烈，上漲走勢持續較久，行情也比較平穩。這也意味著投資人必須具備耐心，至少對於上升扇貝形排列而言是如此，務必讓股價型態有充分的時間發展。


    扇貝形排列通常落在年度價格區間的哪個位置呢？以型態右端高價做為基準，上升排列大多數落在年度價格區間的上緣（84%）。下降排列大多發生在年度價格區間下緣（51%），其次發生在年度價格區間中央（34%）。就前述三個位置而言，排列的平均績效如何呢？對於上升型態，發生在年度價格區間下緣的平均績效最理想（56%），但這個區間的案例總共只有
    8 個，遠少於擬定明確結論所需要的最小樣本數量 30 個。可是，另外兩個區間（中央與下緣）的樣本數量顯然足夠，顯示排列愈接近年度低價，績效愈理想。另一方面，下降扇貝形排列不論發生在年度價格區間的哪個位置，平均績效都約略相同，介於
    23% 到 27% 之間。


    表 36.2 也顯示排列連續出現的扇貝形數量。我希望知道第一個扇貝形發生之後，同一個趨勢內隨後出現第二個、第三個、……扇貝形的發生機率。結果顯示單一上升趨勢或單一下降趨勢出現兩個或以上扇貝形排列的情況相當常見。換言之，發生第一個扇貝形之後，大約有三分之二的機會——在相同趨勢內——發生第二個扇貝形。第三個扇貝形發生的機會大約是三分之一。其他相關數據，請參考表
    36.2。⁺


    這有什麼重要性呢？假定某支股票出現三個扇貝形的下降排列，如果你打算放空這支股票，很可能是錯誤的決策。連續發生 4 個扇貝形的機率只有 9%，這意味著下降趨勢即將結束。❷
    扇貝形數量愈多，趨勢即將結束的可能性愈高。


    上升排列的扇貝形，是否會隨著漲勢發展而變更形狀？對於相同趨勢內的連續一系列扇貝形，我分別衡量它們的時間寬度。圖 36.7 顯示衡量的結果。圖形內只顯示 4
    點，因為連續發生 5 個或以上扇貝形的樣本數量太少。第一個扇貝形的時間寬度平均為 62 天，但第四個扇貝形的平均寬度只有 47 天。所以，在上升趨勢中，如果你發現扇貝形的寬度很小，或許應該避免買進，因為這代表頭部可能已經不遠。


    > * 譯按：由於作者重複強調「相同趨勢內」或「單一趨勢內」，譯者不太確定兩個以上的扇貝形是否必須「一個緊跟著一個」發生？或者只要發生在相同趨勢之內（中間可以涵蓋其他連續型態）？請注意，表
    36.2 的數據顯然是累積數據；換言之，「3=38%」是指：在所有的案例當中，發生 3 個或以上扇貝形的排列佔 38%。


    > ❷ 譯按：譯者不同意這種觀點。沒錯，根據過去的經驗顯示，下降趨勢連續發生 4 個或以上扇貝形的機率只有 9%。可是，目前所處理的並不是這類問題。實際上遇到的問題是：如果已經存在
    3 個扇貝形，再發生第 4 個扇貝形的機率是多少？顯然不是 9%。（投擲一個鋼板，連續出現 4 次「正面」的機率只有 6.25%。可是，如果已經出現 3 次「正面」，第
    4 次出現「正面」的機率為多少？顯然是 50%。）


    ![](img/157738047fa61d5e4bdbaf89f0241a36_253_0.png)


    ### 圖 36.7 隨著漲勢發展，後來發生的上升扇貝形時間寬度愈來愈小


    上升趨勢內連續發生的扇貝形數量愈多，隨後發生的扇貝形時間寬度愈來愈小。如果你發現某支股票在延伸性上升趨勢內發生寬度很小的扇貝形，或許不應該考慮買進。


    ![](img/157738047fa61d5e4bdbaf89f0241a36_254_0.png)


    另一個問題：上升排列的扇貝形，價格高度是否會隨著漲勢發展而縮小？圖 36.8 顯示相關的結果。第一個扇貝形的平均高度（由最高價衡量到最低價）大約是 18%，第四個扇貝形的高度下降為
    14%。同樣地，圖形內只顯示 4 點，因為連續發生 5 個或以上扇貝形的排列樣本數量太少。我嘗試把前述分析運用在下降扇貝形排列，結果不成功。由於樣本規模的問題，相關分析只能考慮
    3 點，而且缺乏明確的結論。


    ## 交易戰術


    表 36.3 列示上升與下降扇貝形排列的交易戰術。所謂的「衡量法則」是計算排列高度，由突破點向上或向下衡量排列高度，估計排列完成之後的可能目標價位。


    不論上升或下降排列，排列高度都是扇貝形右端高點與該扇貝形最低點之間的距離。關於排列完成之後的最低目標價位，上升扇貝形是由右端高點向上衡量排列高度，下降扇貝形是由最低點向下衡量排列高度。讓我們利用圖
    36.9 說明上升扇貝形排列的目標價位計算程序。首先，請留意 9 月份開始而


    ### 表 36.3 上升與下降扇貝形排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算扇貝形右端高點到最低點之間的距離，此為排列高度。對於上升扇貝形，由右端高點向上衡量排列高度；對於下降扇貝形，由排列最低點向下衡量排列高度。結果就是最低目標價位。
    |

    | 折返扇貝形右端高點 | 對於上升扇貝形排列，一旦扇貝形的右端高點出現之後，如果價格回檔過程中跌破扇貝形底部，趨勢已經向下跌轉，排列宣告失敗，你應該避免買進或結束多頭部位。同理，對於下降扇貝形排列，一旦扇貝形的右端高點出現之後，當價格回檔結束而重新向上穿越扇貝形右端高點，則趨勢已經向下跌轉（如果前述價格回檔幅度不足
    5%，視為 5% 失敗）。 |

    | 買點 | 扇貝形右端高點一旦出現，進場建立部位。對於上升扇貝形排列，等待回檔走勢結束而價格重新向上發展。對於下降扇貝形排列，只要價格開始下跌，就進場放空。
    |

    | 停損 | 上升扇貝形：最低價下方 1/8 點處。下降扇貝形：右端高點上方 1/8 點處。 |

    | 避開 | 如果價格下降趨勢已經存在幾個月，針對下降扇貝形排列放空，務必謹慎，因為跌勢可能即將結束。 |


