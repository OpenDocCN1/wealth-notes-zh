    217%，提前向下突破的成交量是正常水準的 121%。總共只有兩個排列曾經同時發生向上與向下的提前突破，兩者的真正突破方向都是朝下。


    表 32.3 的最後一組統計數據顯示，提前突破與真正突破的方向通常相反。對於向下突破的矩形底部排列，只有 36%的提前突破方向朝下（換言之，提前突破與真正突破方向相同），其他
    64%的提前突破朝上。綜合考慮兩個突破方向的矩形底部排列，提前突破與真正突破方向相反的案例總共佔 75%（即 $12/16 = [5+7]/[5+7+4]$）。


    > **譯按**：換言之，矩形底部排列的大部分提前突破都屬於「假突破」。另外，表 32.3 的數據似乎兜不攏，或至少非常混亂。關於向下突破的排列，第一列顯示的提前突破案例總共有
    9 個，但最後三列顯示的案例分別為 2 個、4 個與 7 個，總共為 13 個。即使扣掉同時發生向上與向下提前突破的 2 個案例，仍然還有 11 個。表格
    32.3 的數據 18%、36%與 64%，都把向下突破排列的提前突破案例視為 11 個，不是第一列的 9 個；換言之，$18\% = 2/11$，$36\%
    = 4/11$，$64\% = 7/11$。根據譯者推想，唯一合理的解釋是：第四列所顯示的 4 個案例，是提前突破與真正突破方向相同的案例，其中包括同時發生向上與向下提前突破的
    2 個案例；換言之，第四列的數據包含第三列的數據。可是，第一列的數據不包括第三列的 2 個案例。所以，11 個案例減去 2 個案例，結果就是第一列的 9 個案例。


    表 32.4 顯示突破相關的統計數據。矩形底部排列向下突破之後，發生回升走勢的頻率很高（佔所有案例的 70%）。向上突破之後，發生下挫走勢的頻率為 61%。兩個突破方向發生折返走勢的頻率都很高。完成下挫走勢的平均時間為
    11 天，完成回升走勢的平均時間為 9 天，大約類似於其他排列的情況。矩形底部排列向上突破之後，到達最終高點的平均時間為 275 天，向下突破到達最終低點的平均時間為
    78 天。這是合理的現象，一方面因為向上突破的平均漲幅 46%遠超過向下突破的 19%，走勢幅度愈大，所需要的時間愈多；另一方面因為價格下跌的速度原本就快於上漲。


