    宜過高，跌幅通常不會太大。


    圖 25.6 顯示島狀底部排列的漲幅次數分配情況。最高欄位為 20%，但 10%的欄位也差不多高。所以，就底部排列而言，漲幅低於 20%的排列大約佔 42%（幾乎是一半的案例）。


    關於排列完成之後的目標價位，我採用傳統的預估方法，由型態突破點往上或往下衡量排列高度。結果，頭部與底部排列到達目標價位的達成率都很高，分別為 78%與 85%。我個人認為這項比率超過
    80%，就屬於可靠的型態。當然，如果排列的高度很有限，就很容易完成目標價位。舉例來說，如果島狀部分是由 2 支線形構成，排列的高度通常不會太大。


