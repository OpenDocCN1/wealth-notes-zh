    # 失敗案例


    當我們考慮內側日之類的排列，顯然不能採用一般的失敗衡量準則。內側日只涵蓋 2 天的線形，而且隔天發生的新高（新低）可能就代表排列的最終高點（低點），所以「5%
    失敗」——排列完成之後，沒有出現 5% 或以上的跟進走勢——的觀念並無意義。


    反之，我決定由內側日隔天的走勢重大程度，來判斷排列究竟成功或失敗。為什麼要對時間設定限制呢？理由有兩點。第一，股票最終都會出現重大走勢，如果不設定時間限制，顯然毫無意義。第二，股票交易的目的在於賺錢。我們希望在最短的期間內，賺取最多的利潤，所以需要針對股價型態設定時間限制。


    內側日發生之後，究竟在什麼情況下，排列才算失敗？換言之，何謂價格「重大」走勢呢？請參考第 520 頁的最後一段說明。圖 24.2 提供兩個失敗案例。第一個失敗案例發生在
    1 月底。內側日當天的價格區間為$15¼~$14¾。隔天的價格區間完全相同。顯然地，內側日隔天並沒有發生重大價格走勢。第二個失敗排列也是如此，內側日與隔天的價格區間沒有顯著的差異，隔天沒有出現重大價格走勢。沒錯，隔天低價向下穿越內側日低價，但程度不足
    3/16 點——顯然不足以構成所謂的「重大走勢」。


