    - **參照排列**\n  - （40）等腰三角形底部排列。\n  - （41）等腰三角形頭部排列。\n\n## 向下突破\n\n- **外觀**\n  -\
    \ 連續三支線形構成的等腰三角形排列，盤中高價持續下滑，盤中低價持續墊高。向下突破。\n- **反轉或整理**\n  - 短期（3 個月以內）的空頭反轉或整理走勢，反轉型態的發生頻率為\
    \ 55%。\n- **失敗率**\n  - 44%。\n- **平均跌幅**\n  - 21%，最經常發生跌幅為 10%或以下。\n- **成交量趨勢**\n\
    \  - 下降。\n- **回升**\n  - 58%。\n- **意外發現**\n  - 排列結構上下對稱，績效比較理想。\n- **參照排列**\n \
    \ - （40）等腰三角形底部排列。\n  - （41）等腰三角形頭部排列。\n\n鯊鱗排列（shark-32）雖然只由三支線形構成，但我還是決定採用 5%\
    \ 失敗的定義。排列突破之後，價格沒有出現 5% 或以上的跟進漲勢，結果又朝相反方向發生重大走勢，這稱為「5% 失敗」。對於向上突破的案例，失敗率偏高為 41%；向下突破的情況更糟，失敗率高達\
    \ 44%。我認為可靠排列的失敗率不應該超過 20%。排列失敗率之所以偏高，一方面是因為型態的涵蓋期間太短（只由 3 支線形構成），規模太小。價格朝某個方向突破，又反轉回到排列之內，很容易再朝另一個方向突破，於是造成排列失敗。對於較大規模的排列，價格一旦跌回排列之內，迴旋的空間比較大，朝原先方向再突破的可能性較高（換言之，比較不容易朝相反方向突破）。\n\
    \n向上突破的平均漲幅爲 32%，遠低於一般多頭排列的平均水準 40%。向下突破的平均跌幅爲 21%，類似於一般空頭排列的平均績效。\n\n我利用排列的漲幅或跌幅編製次數分配圖。結果，兩種排列的最可能發生績效都是\
    \ 10% 左右。很多類型的排列都呈現這種情況，意味著你如果希望保有獲利的話，那就應該隨時準備見好就收。\n\n不論向上或向下突破，3 支線形期間內的成交量型態大致趨於下降（就如同任何等腰三角形一樣，鯊鱸排列屬於短期的等腰三角形）。\n\
    \n某些分析家認爲，如果鯊鱸排列在水平軸上下兩側呈現對稱結構，績效比較理想。我的研究支持這種論點，不論向上或向下突破都是如此，細節內容請參考「統計數據」一節。\n\
    \n# 緣起與辨識準則\n\n鯊鱸排列發展過程中，盤中高價持續下滑，盤中低價持續上揚，使我想起不斷扭緊的彈簧。最後，當彈簧迸開，價格將大幅彈跳。可是，這只是理論上的說法，實務上的發展往往不是如此，走勢經常立刻折返而造成失敗。關於失敗案例的細節，我們稍後會討論。\n\
    \n就排列而言，鯊鱸型態很容易辨識，也很常見。由於結構實在太過於單純，我沒有按照慣例一樣編製辨識表格。只要找到 3 支線形構成的中等腰三角形；換言之，在 3\
    \ 支線形的排列之內，每支線形的盤中高價持續下滑，盤中低價持續墊高。請注意，根據我的定義，任何兩支線形彼此之間的盤中高價（或盤中低價）都不得相同，而且最後一支線形必須存在價格區間（換言之，當天的盤中高價與盤中低價不得相等）。\n\
    \n請參考圖 37.1 的範例。請留意每個例子的結構，盤中高價的發展趨勢向下傾斜，盤中低價向上傾斜，構成 3 天期的等腰三角形。在排列之內，每天盤中高價都較前一天低，每天盤中低價都較前一天盤高。這種\
    \ 3 天期排列的形狀，類似鯊魚的背鰭，所以稱為「鯊鱗」排列。\n\n![](img/157738047fa61d5e4bdbaf89f0241a36_263_0.png)\n\
    \n![](img/157738047fa61d5e4bdbaf89f0241a36_263_1.png)\n\n圖 37.1 鯊鱗排列的 3 個範例。在每個\
    \ 3 天期的排列內，盤中高價持續下跌，盤中低價持續墊高。\n\n鯊鱗排列的成交量幾乎都呈現下降趨勢。實際觀察走勢圖，有時候或許看不清楚成交量趨勢，但我針對這個\
    \ 3 天期排列的成交量時間序列進行線性迴歸分析，發現迴歸直線的斜率確實為負數。舉例來說，在圖 37.1 的全部三個例子當中，成交量趨勢都朝下發展。\n\n\
    關於圖 37.1 最右側的例子，讀者或許不認爲這個排列的成交量趨勢朝下發展。關於成交量的記錄方法，如果在適當的座標位置標示「黑點」，藉以取代成交量「柱狀圖」，然後繪製一條直線通過三個成交量「黑點」，使得三個黑點距離該直線的距離總和最小，那麼這條直線的斜率為負數（換言之，這條直線向右下方傾斜）。原則上，這條直線就代表成交量時間序列的迴歸直線，直線的傾斜方向也就代表成交量的趨勢。\n\
    \n# 失敗案例\n\n鯊鱗排列的失敗率很高，所以很容易找到說明範例，請參考圖 37.2。不論你認爲這個排列屬於既有趨勢的反轉型態或連續型態，對於一個成功的排列，價格突破之後，在出現顯著的反向走勢之前，應該繼續朝突破方向發展。\n\
    \n![](img/157738047fa61d5e4bdbaf89f0241a36_265_0.png)\n\n圖 37.2 鯊鱗排列的失敗案例。價格向下突破，然後展開回升走勢而重新進入排列之內，並且向上突破。最初的向下突破，價格跌幅不超過\
    \ 1%，所以稱為 5% 失敗。\n\n首先，讓我們說明排列「突破」的定義：排列出現之後，只要收盤價穿越到排列的外側，就稱為突破。對於鯊鱗排列而言，因為第\
    \ 1 天的線形涵蓋隨後兩天的線形，所以排列是否突破，完全是以第 1 天的線形為準。鯊鱗排列出現之後，只要收盤價穿越到排列第 1 天最高價之上或最低價之下，就算有效的突破，預期價格將朝突破方向繼續發展。\n\
    \n排列完成而收盤價朝某個方向突破，隨後仍然允許價格回挫（throwback）或回升（pullback）到三角形的頂點附近。在我們的研究案例中，大約有半數以上的鯊鱗排列發生回挫或回升走勢。某些情況下，折返走勢可能繼續發展；如果回挫走勢收盤價跌破排列第\
    \ 1 天的低價，或回升走勢收盤價穿越排列第 1 天的高價，則排列視爲失敗（譯按：這是指最初的突破沒有出現 5% 以上的跟進走勢）。\n\n圖 37.2 的鯊鱸排列發生在價格上升趨勢內。由於大多數鯊鱸排列屬於連續型態，所以排列完成之後，價格繼續上漲的可能性較高。可是，實際的情況並非如此：價格向下反轉。\n\
    \n鯊鱸排列第 1 天的低價爲 $31\\frac{3}{4}$，三角形的頂點——兩腰的交會點——爲 $32\\frac{1}{8}$。排列出現之後的第 2\
    \ 天，行情下跌而以最低價 $30\\frac{5}{8}$ 收盤，排列有效向下突破（因爲當天收盤價 $30\\frac{5}{8}$ 低於排列第 1 天的低價\
    \ $31\\frac{3}{4}$）。我們預期價格將進一步走低。隔天，盤中價格確實又繼續下探 $30\\frac{7}{16}$ 的低點，但收盤價拉高。接下來，價格回升到三角形頂點附近。關於向下突破的走勢，如果由突破當天最低價（$30\\\
    frac{5}{8}$）衡量到最終低點（$30\\frac{7}{16}$），幅度只有 0.6%。\n\n由於鯊鱸排列沒有特定的突破方向，投資人必須等到收盤價實際突破之後，才能夠進場建立部位。所以，我利用突破當天的最低價或最高價來衡量排列跌幅或漲幅，因爲這是投資人能夠進場建立部位的第\
    \ 1 天。\n\n對於圖 37.2 的例子，如果投資人在突破當天進場放空，結果應該不太愉快。隔天，收盤價走高；不久之後，價格回升而穿越排列第 1 天的高價，造成排列失敗。接下來，價格繼續走高；隔年\
    \ 1 月中旬，高價曾經穿越 $55$。\n\n大型排列的勁道勝過小型排列，這種說法確實適用於鯊鱗排列，甚至可以用來解釋失敗率。大型等腰三角形排列的失敗率大約只有鯊鱗型態的十分之一。\n\
    \n# 統計數據\n\n表 37.1 列示鯊鱗排列的一般統計數據。由於排列績效將因爲突破方向不同而產生差異，所以此處分爲兩部分討論：向上突破與向下突破。這種排列相當普遍，在\
    \ 100 支股票的 5 年期間內，我總共找到 300 多個案例。按照表 37.1 的數據顯示，鯊鱗排列大多扮演短期價格趨勢的連續型態；在反轉型態中，向下突破的情況稍多。\n\
    \n| 說明 | 向上突破 | 向下突破 |\n| :--- | :--- | :--- |\n| 排列數量： | 160 個 | 139 個 |\n| 1991\
    \ 年~1996 年的 100 支股票 | | |\n| 反轉或整理排列 | 111 個整理，49 個反轉 | 63 個整理，76 個反轉 |\n| 失敗率\
    \ | 66/160 或 41% | 61/139 或 44% |\n| 成功排列的平均漲幅 / 跌幅 | 32% | 21% |\n| 最經常發生漲幅 /\
    \ 跌幅 | 10%~15% | 0%~10% |\n| 成交量型態呈現下降趨勢 | 146/160 或 91% | 119/139 或 86% |\n\n\
    兩個突破方向的排列失敗率都超過 40%，這是我認爲可靠排列所允許發生最低失敗率 20% 的兩倍，也意味著操作這類排列必須特別謹慎。向上突破的平均漲幅為 32%，向下突破的平均跌幅為\
    \ 21%，前者不如一般多頭排列的平均績效（40%），後者大約等於一般空頭排列的績效水準（20%）。圖 37.3 顯示鯊鱗排列的最經常發生漲幅與跌幅。最高欄位即是發生次數最多的績效，也是我認爲最可能發生的漲幅或跌幅。向上突破的最經常發生漲幅大約在\
    \ 10% 到 15% 左右，漲幅超過 50% 的案例大約佔四分之一。50% 顯然是非常可觀的漲幅，能夠大幅拉高平均漲幅到 32% 的水準。雖然最右側欄位最高，但我不認爲它具有代表性，所以不納入最經常發生漲幅的考量中。\n\
    \n![](img/157738047fa61d5e4bdbaf89f0241a36_268_0.png)\n\n向下突破排列的最經常發生跌幅為 10%，這是圖\
    \ 37.3 的最高欄位。大約三分之一案例的跌幅不足 10%；所以，對於向下突破的鯊鱗排列，如果你打算放空的話，最好三思而後行。\n\n如同前文提到的，我針對鯊鱗排列\
    \ 3 支線形的成交量時間序列進行迴歸分析，發現迴歸直線向右下方傾斜。\n\n# 表 37.2 鯊鱗排列的突破統計數據\n\n| 說明 | 向上突破 | 向下突破\
    \ |\n| :--- | :--- | :--- |\n| 排列出現到突破發生之間的天數 | 8 天 | 8 天 |\n| 回挫／回升走勢 | 102/160\
    \ 或 64% | 80/139 或 58% |\n| 完成回升／回挫走勢的平均時間 | 8 天 | 8 天 |\n| 對於成功排列，到達最終低點／高點天數\
    \ | 6.5 個月 (192 天) | 2 個月 (66 天) |\n| 排列突破點位於最近 12 個月價格區間的下線、中央或上線 | 下線 9%，中央\
    \ 27%，上線 64% | 下線 29%，中央 35%，上線 35% |\n| 前述排列位置的平均漲幅／跌幅 | 下線 32%，中央 41%，上線 31%\
    \ | 下線 18%，中央 21%，上線 23% |\n\n鯊鱗排列由 3 支線形構成；唯有當這 3 支線形出現而排列完成之後，才能考慮突破的問題。等腰三角形的情况不同，有效的突破通常發生在排列發展過程的最初三分之一時間寬度內（換言之，價格突破之後，排列才視爲完成）。當鯊鱗排列完成之後，收盤價通常需要經過\
    \ 8 天才能向上或向下突破（換言之，向上或向下穿越排列第 1 天的最高價或最低價）。\n\n鯊鱗排列向上突破之後，價格重新折返到三角形頂點附近，這種走勢稱爲回挫\
    \ (throwback)。在我們的研究案例中，回挫走勢的發生頻率為 64%，讀數太低而不足以預先納入交易計畫，但仍然代表第二次進場或加碼的買進機會。不幸地，不是所有的回挫走勢都能夠及時止住跌勢而恢復上漲。向下突破之後的回升走勢\
    \ (pullback) 也是如此，價格可能繼續走高。圖 37.2 就是一個典型的例子，排列向下突破之後，回升走勢持續走高而導致排列失敗。在我們的案例當中，回升走勢的發生頻率為\
    \ 58%。\n\n回挫或回升走勢折返到三角形頂點（排列第 3 天線形的中點價格水準）的平均期間是 8 天，較其他排列短 1、2 天。如果你錯失機會而不能在突破過程進場，或許能夠在\
    \ 8 個交易日之後找到第二次機會。\n\n所謂最終高點或低點，我定義爲價格趨勢發生重大變動的轉折點，通常是 20% 或以上的變動，但如果發生假突破的情況而朝排列的另一邊突破（換言之，發生\
    \ 5% 失敗的情況），最終高點或低點所需要的價格變動幅度當然就不足 20%。\n\n向上突破之後，價格到達最終高點的平均期間爲 192 天。反之，向下突破之後，價格到達最終低點的平均期間爲\
    \ 66 天。請注意，兩者都是由突破當天起算。\n\n如果把年度價格區間劃分爲三等份（上緣、中央與下緣），排列突破點通常都落在哪個位置？大多數向上突破都落在年度高價附近（64%）。向下突破在這三個位置的分配比較平均，上緣與中央各有\
    \ 35%。至於這些突破位置的排列績效又各自如何呢？落在年度價格區間中央的向上突破，績效最理想，平均漲幅爲 41%。至於向下突破，績效最理想的排列落在年度高價附近，平均跌幅爲\
    \ 23%。\n\n最後一項統計數據是關於對稱性的問題。沿著水平軸而上下對稱的鯊鱗排列，它們的績效比較理想。我們藉由下列公式衡量對稱性：\n\n- 對稱參數\
    \ = 0.10~0.50 這是決定排列所需要對稱程度的變數。\n- 頂點價位 = $(H_3+L_3)/2$。$H_3$ 與 $L_3$ 是分別代表排列第\
    \ 3 天的高價與低價。\n- 底部高度 = $H_1-L_1$。$H_1$ 與 $L_1$ 是分別代表排列第 1 天的高價與低價。\n\n對於指定對稱程度的鯊鱗排列，必須滿足下列方程式：\n\
    \n```\n頂點價位 ≤ H₁ - (底部高度 × 對稱參數)\n頂點價位 ≥ L₁ + (底部高度 × 對稱參數)\n```\n\n原則上，我們要求第\
    \ 3 天價格區間中心點落在第 1 天價格區間中心點的某個距離內，所謂「某個距離」是由對稱參數決定，參數值愈大，距離寬度愈小，對稱性愈高。關於對稱參數，我把單位刻度設定爲\
    \ 0.02，藉以劃分 0.10 到 0.50 之間的所有讀數。如果對稱參數爲 0.50，代表 50% 的價格位在中心點之上，50% 的價格位在中心點之下——完美的對稱。我分別統計各種對稱程度的向上與向下突破排列績効，結果發現對稱參數介於\
    \ 0.40 到 0.50 之間，對稱排列與非對稱排列的績効差異最大。對於向上突破案例，把對稱參數設定在 0.40 到 0.50 之間，排列績効最理想，這些對稱程度的排列漲幅介於\
    \ 31% 到 34% 之間，非對稱排列的漲幅則介於 30% 到 32% 之間。關於向下突破，需要把對稱參數設定在 0.44 到 0.50 之間，才足以突顯對稱性的績効影響力。在前述對稱程度的設定下，排列跌幅介於\
    \ 21% 到 25% 之間，非對稱排列的跌幅則是 20%。\n\n我發現對稱程度對於排列績効的提升效果很有限，除非是近乎完全的對稱，對於績効提升才有顯著的意義。雖說如此，這還是相當有趣的發現。\n\
    \n如果讀者想知道非對稱鯊鱗排列的形狀，不妨回頭參考圖 37.1。如果把對稱參數設定爲 0.44，只有中間排列屬於對稱排列。另外兩個排列的第 1 天盤中低價太低。\n\
    \n## 交易戰術\n\n如果某個人告訴你，鯊鱗排列是最值得操作的股價型態，千萬\n"
  mdcn: "\n一旦某個扇貝形的右端高價出現而價格下跌，該扇貝形就算完成。對於上升扇貝形，價格可能做部分或全部的回檔（換言之，由右端高價往扇貝形低點發展），然後向上回升而繼續走高；對於下降扇貝形，價格跌勢可能繼續發展。請觀察圖\
    \ 36.9 的第一個上升扇貝形，價格回檔到左端高價 $14\\frac{1}{4}$ 附近。中間扇貝形的價格幾乎回檔到排列低點。\n\n對於上升扇貝形，一旦右端高價出現，等待價格跌勢停頓而開始向上回升，然後才進場。某些情況下，隨後可能發生另一個上升扇貝形；若是如此，在開口向上的圓弧狀走勢中買進相對容易。對於下降扇貝形，一旦能夠判斷右端高價已經出現，儘早在價格下跌過程放空。\n\
