    \ 500 万，倒赔你 3-300 万！\n\n想要实操，请马上联系一诺老师官方助理老师微信！\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？跟一诺老师学习《融资的最高境界》！\n\
    \n所谓出口押汇，是指卖方银行提交信用证项下的单据议付后，银行根据你的申请，依据你提交的全套单证相符的单据做质押，审核无误后按票面金额将款项预垫付给你，然后向开证银行寄单索汇。在这个过程中，银行当然是要向你收取押汇利息和费用的，并且会向你保留追索权。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_70_0.png)\n\n容易看出，简单地说，出口押汇就是卖方把货物装运出口后，用提货单据做抵押，签发买方或买方委托承兑的银行作为付款人的汇票，以此从银行先拿到钱，用于生产经营周转。\n\
    \n## 押汇融资应具备的条件(实用)\n\n一诺老师的经验告诉我们，在该银行要有人民币和外币往来账户，并且在该押汇融资业务下办理一切核算；信用证条款清晰、完整，符合国际惯例，经银行确认没有潜在风险。\n\
    \n你在向银行提出出口押汇申请书时，需要提供以下材料：企业法人营业执照复印件、企业授权书及签字样本、近期财务报表等。然后，填写出口押汇申请书和出口押汇质押书各一式两份，连同出口单据和正本信用证一起交给银行审核。最后，经银行审核无误后，即可办理出口押汇。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_71_0.png)\n\n如果出现以下情形之一，你的出口押汇申请将会遭到银行拒绝：\n\
    \n- 来证限制其他银行议付；\n- 远期信用证超过 180 天；\n- 运输单据是非物权凭证；\n- 未能提交全套物权凭证；\n- 带有软条款的信用证；\n\
    - 转让银行不承担独立付款责任的转让信用证；\n- 单证或单单之间具有实质性的不符；\n- 索汇路线迂回曲折，影响顺利收汇；\n- 开证银行或付款银行所在国或所在地区局势动荡；\n\
    - 收汇地区外汇短缺、管制较严，或者正在发生金融危机，收汇没把握。\n\n在选择结算货币币种上，出口押汇币种就是单据上标明的原币种。押汇利率可以根据市场行情来确定。押汇金额比例会由银行核定，最高可以拿到单据金额的\
    \ 100%。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_72_0.png)\n\n一诺老师说，银行在扣除押汇利息和相关费用后，会把剩余的金额全部划入你的账户内。如果将来实际收汇时间超过押汇期限，银行是要向你补收逾期利息的。\n\
    \n在这里，押汇期限怎么算呢？一诺老师说，即期出口押汇的期限是根据出口收汇地区和路线确定的；远期信用证押汇期限，从收到信用证开证银行承兑汇票日起至付款到期日后的第三个工作日为止。如果超出押汇期限，并且经银行向开证银行催收交涉后仍然没有收到议付款项，那么，银行就要向你行使追索权，追索的项目包括押汇金额、利息和银行费用等。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_73_0.png)\n\n一诺老师发现，使用议付信用证的情形比较多。所谓议付信用证，是指在这种信用证上规定它是由某一银行议付或任何银行都可以议付的。在这样的条件下，信用证出口结汇有三种办法，分别是收妥结汇（先收后结）、定期结汇和买单结汇。\n\
    \n# 出口押汇融资前提条件(干货)\n\n一诺老师认为的顾问经验摘告告诉我们：\n\n一是预期在发货后、收到货款前资金周转会发生困难，需要短期融资；\n\n\
    二是在发货后、收到货款前虽然资金周转正常，甚至很充裕，但这时候遇到了新的投资机会，并且这种投资机会的预期收益率肯定会高于押汇利率，这时候通过出口押汇融资就是有利可图的；\n\
    \n三是预期汇率升值，并且你可以从这种汇率升值中获得比出口押汇融资成本更高的收益率。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_74_0.png)\n\
    \n# 本节课程干货提炼\n\n(1) 出口押汇的最大好处是，在你出口交单后就能申请到短期融资，大大加速了资金周转，有助于缓解资金紧张的燃眉之急。这种短期融资的期限，通常是押汇期限不能超过\
    \ 180 天，300 元融资 500 万,签订《零风险+对赌》协议，实操请联系一诺老师助理贴现期限不能超过 360 天。\n\n(2) 你在中诗出口押汇成功后，无论什么原因导致的银行无法从国外顺利收汇，银行都会行使追索权。也就是说，是需要你归还银行垫款的。\n\
    \n(3) 与出口押汇相反的概念是进口押汇。所谓进口押汇是指信用证项下单到并经银行审核无误后，这时作为买方的你资金周转困难，于是用这些单据作为质押，连同其他必要的抵押、质押或担保，由银行为你先付款。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_75_0.png)\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\
    \n# 第 44 课：打包融资法\n\n## 把风险抵押给银行的实操方案(牛 X)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？跟一诺老师学习《融资的最高境界》!\n\
    \n所谓打包放款，也叫打包贷款、信用证抵押贷款。\n\n一诺老师研究发现，卖方在收到境外开来的信用证后，因为在本国采购与此相关的出口商品和生产出口商品时资金出现短缺，所以就用这笔信用证作为抵押，向银行申请本外币流动资金贷款，用于出口这批货物加工出现的资金缺口。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_76_0.png)\n\n如果你采用信用证结算方式，在出口商品时收到信用证正本后，可以以此为还款依据和抵押，向银行申请装船前的融资。主要是理解两点：一是打包放款主要是用于解决货运装船前的资金需求，二是打包放款一般需要用信用证正本做抵押。打包放款因为有信用证正本做抵押，所以比较容易取得银行的短期融资，使得你有钱用于出口备货、备料、加工等，促使出口贸易顺利进行。这样也就很好地解决了出口企业因为生产和收购商品以及支付其他费用所造成的资金不足问题。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_77_0.png)\n\n# 打包融资的操作方案(实操)\n\n具备独立的法人资格，具有进出口经营权，在银行开设有人民币账户和外汇账户；是信用受益人，并且已经取得信用证项下货物出口必需的全部批准文件；信用证应当是不可撤销的跟单信用证，而不是可撤销信用证、可转让信用证、备用信用证、付款信用证等，并且其结算方式不是电汇或托收；开证银行是具有实力的大银行，并且最好能找到其他企业提供担保或提供抵押物；信用证开出的国家政局稳定；如果信用证指定了议付行，应该放在议付行办理；远期信用证期限不能超过90天。\n\
    \n在办理打包放款业务时，具体需要提供以下文件：法人代表证明书；信用证正本；流动资金借款申请书；外销合同；境内采购合同；营业执照副本；贷款证；最近三年的财务报告；最近一个月的财务报告等。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_78_0.png)\n\n# 打包融资的七大法门(干货)\n\n- (1)\
    \ 单前融资，即发放贷款的时间是在收到信用证之后、向卖方银行递交信用证规定的单据之前。\n- (2) 专款专用，一般只能用于与这项出口商品生产和加工有关的支出，不能用于固定资产投资，也不能用于归还贷款等其他资本项目支出。\n\
    - (3) 贷款额度高，贷款最高金额为信用证金额的90%。\n- (4) 贷款期限较短，不超过信用证有效期后15天，一般不超过3个月，最长不超过6个月，特殊的不超过1年。\n\
    - (5) 展期，如果信用证出现修改有效期、最后装船期的情形，卖方可以在贷款到期前10个工作日向银行申请展期。\n- (6) 具有追索权。\n- (7) 银行办理打包放款时一般不收手续费，只收利息，利率标准参考同期贷款利率。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_79_0.png)\n\n# 针织厂融资实操案例(落地)\n\n陈水妹白手起家，先后创办了福州鼓山针织厂和福马企业集团。有一年该公司与西班牙某企业签订了\
    \ 42.87 万美元的童装出口合同，约定采用信用证结算方式，开证银行为中国农业银行的代理合作行西班牙合作银行，信用证金额42.87万美元，约定货物分批装运、分批收汇。\n\
    \n收到信用证后，该企业向中国农业银行福建鼓山支行申请打包放款。银行在经过审核后，提出要求福马公司在提供信用证质押的同时，增加两家担保单位。在福马公司配合后，银行很快就批复授予该公司信用证打包放款额度为\
    \ 250 万元人民币。\n\n顺便一提的是，打包放款对出口企业来说没什么风险，可是对于放款银行来说风险是很大的。因为归根到底，银行打包放款的依据（信用证）是一个独立文件，并不依附于贸易合同；并且，信用证业务只看单据不看货物，这种与具体进出口业务脱节的信用证是否可靠，谁也不敢保证。因为信用证对买卖双方的融资目的非常明确，所以经常有不具备贸易背景的融资信用证混杂其间。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_80_0.png)\n\n# 本节课干货提炼\n\n- (1) 出口押汇和打包放款都是用信用证做抵押的，但在风险上有一定区别。出口押汇是根据开证银行开出的信用证条款发货的，将全套单据交给银行做抵押，所以风险较低；而打包放款如果遇到卖方不能履约，银行的风险就出现了。\n\
    - (2) 出口押汇和打包放款在银行贷款条件方面基本相同，并且贷款额度一般都是百分之七八十；所不同的是，出口押汇是在交单后发生的，打包放款是在交单前发生的，并且打包放款的贷款时间要长一些。\n\
    - (3) 根据现行《境内外资银行外债管理办法》规定，出口押汇是可以结汇的，打包放款是不能结汇的。也就是说，采用出口押汇所得到的融资，你可以卖给指定银行，换取人民币在国内流通；而打包放款获得的资金，就只能以外币方式来使用\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_81_0.png)\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\
    \n# 第45课：专用融资法\n\n## 申请国际最低利率贷款的方案(实操)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？跟一诺老师学习《融资的最高境界》！\n\
    \n一诺老师说，出口信贷就是这种贷款的用途是指定的，只能用来购买贷款国出口的资本货物和技术以及相关劳务，属于一种“专款专用”。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_82_0.png)\n\
    \n一诺老师研究发现，出口信贷具有以下特点：利率低，一般低于国际金融市场上的平均贷款利率；贷款期长，一般为 1\"5 年，也有的会长达 10 年（但通常都是每半年还本付息一次）；贷款金额起点高，我国规定的起点是\
    \ 5 万美元，国外的贷款金额起点有的甚至高达数百万美元。\n\n# 卖方融资实操方案(落地)\n\n卖方信贷是指卖方从银行取得出口信贷，然后再向买方提供延期付款信贷。作为出口企业的你，为什么要自己办理贷款，然后同意买方用延期付款方式来达成交易，即期付款不是更好吗？不用说，能够即期付款当然是最好的；可是在买方资金困难的情况下，你作为卖方为对方创造了一种便利条件，更能促使交易的达成。也就是说，更有助于推动出口。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_83_0.png)\n\n必须指出的是，这种通过卖方信贷给买方提供延缓付款的条件，体现的是一种银行信用，与卖方直接答应买方可以延缓付款的商业信用是完全不同的，否则这种出口信贷也就没有存在的价值了。\n\
    \n那么，这两者之间究竟有什么不同呢？这主要从两方面看：\n\n- (1) 从卖方来说，本来由于买方资金缺乏，可能无法达成交易的，而现在你想方设法从银行取得贷款，帮助对方解决了后顾之忧，这样对方就敢答应分期付款条件了。在这个过程中，出口信贷当然是需要支付利息、保险费用的，并且还有汇率风险，所以卖方必定会把这些通通都加到产品价格中去（一般会高出\
    \ 3%~10%）。而如果是卖方自行答应买方延期付款的商业信用，一般就不会加价。但这样做也有缺点，那就是风险比较大。因为这笔贷款并没有买方所在国银行担保，所以一旦对方无法履行合约，或者破产倒闭了，这损失就可能全部要由你卖方来承担了。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_84_0.png)\n\n- (2) 从买方来说，卖方办理出口信贷的银行信用和自行答应申请延期付款的商业信用相比，没有多少实质性区别，主要的问题在于前者的价格较高；并且，卖方究竟为此加价了多少自己无从得知。但既然现在有关银行货款、资金筹措等方面的事一概不用自己过问，也就管不了那么多了。\n\
    \n从具体操作过程看，卖方信贷的具体步骤是：\n\n- (1) 由卖方向所在地银行申请出口信贷，签订借款合同。\n- (2) 买卖双方签订进出口合同，同意采用延期付款方式达成交易。\n\
    - (3) 买方向卖方分期支付货款后，卖方再向借款银行逐期归还所借款项和应付利息。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_85_0.png)\n\
    \n# 买方融资实操方案(实用)\n\n一诺老师说，买方信贷与卖方信贷的区别是，买方信贷提供的贷款是直接给买方或所在地银行的。由于卖方银行对买方不可能很了解，所以买方信贷的贷款手续比较复杂，需要签订两个合同，一是买卖双方签订的进出口贸易合同，二是卖方银行与买方或买方银行签订的贷款合同。不用说，这两者之间是有联系的，那就是贷款合同必须以贸易合同为基础，否则“皮之不存，毛将焉附”？\
    \ 在这个过程中，卖方银行会要求卖方按质按量提供出口产品，而对买方信贷方面的财务安排，也必定会掌握在自己（卖方银行）手里。\n\n一诺老师说，卖方银行是不会把贷款直接付给买方的，而是会在买方收到货后，根据单据，代表卖方付给卖方；但贷款的归还，是需要买方按期偿还的。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_86_0.png)\n\n# 买方融资的量大实操方案(落地)\n\n\
    - (1) 卖方银行直接向买方所在地银行提供贷款。具体步骤是：\n    - 双方签订进出口贸易合同后，买方预付 15%-20%的预付现汇定金。\n   \
    \ - 双方银行以进出口贸易合同为依据签订贷款合同，卖方银行提供贷款。\n    - 卖方发货。\n    - 买方银行把借到的贷款贷给买方。\n    -\
    \ 买方以现汇条件向卖方支付货款。\n    - 买方银行根据贷款协议向卖方银行偿还贷款本息。\n    - 买方向卖方银行偿还本息。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_87_0.png)\n\
    \n- (2) 卖方银行直接向买方提供贷款。具体步骤是：\n    - 双方签订进出口贸易合同后，买方预付 15%-20%的预付现汇定金。\n    - 买方以进出口贸易合同为依据与卖方银行签订贷款合同，卖方银行会要求买方银行为买方提供担保。\n\
    \    - 卖方发货。\n    - 卖方银行根据签订的贷款合同，凭卖方提供的发货单，代买方支付货款。\n    - 买方向卖方银行偿还贷款本息。\n\n\
    一诺老师说，小企业向中国进出口银行申请办理出口信贷，需要同时具备以下条件：出口合同金额在 30 万美元以上；出口商品在我国制造的部分，符合我国出口原产地规则等规定；买方以现汇支付定金的比率，在船舶贸易合同中原则上不低于合同总价的\
    \ 20%，在成套设备贸易合同中不低于合同总价的 15%；出口项目经济效益好，换汇成本合理，各项配套措施落实；等等。\n\n出口信贷的具体品种包括：项目贷款、中短期额度贷款、对外承包工程贷款、境外加工贸易贷款、境外投资项目贷款等。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_88_0.png)\n\n# 本节课程干货提炼\n\n(1) 出口信贷一般适用于大型机器设备或成套设备的进出口贸易。因为这类设备的资金需求量大，使用寿命长，使用出口信贷融资会有助于推动贸易的成功合作，甚至可以说这项融资就是为此量身定做的。\n\
    \n(2) 对于买方来说，在采用卖方信贷的条件下，买方对设备的实际价格是不太清楚的，也不便于问；而在采用买方信贷的条件下，能够清晰地了解货物的价格及其构成，有助于货比三家。并且在买方信贷下，有关出口信贷事宜都是由双方银行在谈，便于买方集中精力进行贸易谈判。\n\
    \n(3) 无论对卖方还是卖方银行来说，采用买方信贷的风险都是很小的，所以建议优先考虑这种信贷方式。买方信贷既有助于卖方扩大产品出口，又有助于提高卖方银行知名度，还能保证卖方和卖方银行都能获得更高的收益，何乐而不为呢？\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_89_0.png)\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n"
