    # **本节课程干货提炼**


    (1)随着资本市场不断深化，基金作为一种融资渠道正在企业融资中发挥着越来越重要的作用。


    所以，小企业千万不要小看这一点。从欧美国家的企业融资现状看，银行贷款部分一般只占 20%，其余 80%都是通过其他融资方式获得的资金，其中就包括各种基金融资。


    (2)为了促进企业创新，各级政府不断加大对科技型中小企业创新基金的支持力度，并且有专人负责接受申报。由于这项申报条件要求较高，所以要特别重视申报材料的书写，并非只要有好
    的产品和技术就行了。项目评审过程中是不许企业补充'
