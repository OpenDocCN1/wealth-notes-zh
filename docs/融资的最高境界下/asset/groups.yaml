    # 小企业从事增资扩股融资模版(实战)


    一诺老师上面已经提到，上市公司和非上市公司的融资区别，这里也应当分这两种类型来讨论：


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_150_0.png)


    (1)如果是上市公司，根据《公司法》、《证券法》和《上市公司新股发行管理办法》规定，上市公司发行新股的基本条件是：前一次发行的新股已经募足，并且时间间隔在一年以上；最近三年内连续赢利，并且向股东支付股利；最近三年内财务会计文件无虚假记载；公司预期利润率可以达到同期银行存款利率；募集资金用途必须按招股说明书使用，不得投资于商业银行、证券公司等金融机构（金融类上市公司除外）；发行新股应当以现金认购方式进行，同股同价；由具有主承销商资格的300元融资500万,签订《零风险+对赌》协议，实操请联系一诺老师助理'
  - '[PAGE 151]


    证券公司担任发行推荐人和主承销商；不存在资金、资产被具有实际控制权的个人、法人或其组织及其关联人占有的情形，或其他损害公司利益的重大关联交易；等等。


    上市公司申请配股，除了上面所述的基本条件外，还必须：


    +   经注册会计师核验，最近三个会计年度加权平均净资产收益率不低于 $6 \%$；扣除非常规性损益后的净利润与扣除前的净利润相比，以较低者作为加权平均净资产收益率计算依据


    （如果公司成立不到三个会计年度，按实际会计年度计算）；


    +   一次性配股发行总数，原则上不超过前次发行并募足股份后股本总额的 $30 \%$（公司具有实际控股权的股东全额认购所配售股份不受此限）；本次配股与前一次发行的股票时间间隔不少于一个会计年度。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_151_0.png)


    上市公司增发股份，除了上面所说的基本条件外，还必须：


    +   最近三个会计年度加权平均净资产收益率不低于 $10 \%$，并且 $300$ 元融资 $500$ 万，签订《零风险+对赌》协议，实操请联系一诺老师助理'
  - '[PAGE 152]


    且最近一个会计年度加权平均净资产收益率不低于 10%(扣除非经常性损益后的净利润与扣除前的净利润相比，以较低者作为加权平均净资产收益率的计算依据)；增发新股募集的资金，不超过公司上年度未经审计的净资产值；发行前最近一年的资产负债率不高于同行业上市公司平均水平；前次募集资金投资项目的完工进度不低于
    70%;增发新股数量如果超过公司股份总数 20%，增发提案需要获得出席股东大会的流通股股东所持的表决权半数以上通过；上市公司及其附属公司最近 12 个月内，不存在资金、资产被具有实际控制权的上市公司的个人、法人或其他组织及关联人占用的情况；等等。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_152_0.png)


    (2)如果是非上市公司，进行增资扩股融资的主要条件是：


    企业无论何种所有制，都应当是非股份制企业（股份制企业只能通过发行股票来取得自有资金）；如果取得的是非现金资产，必须经过公正合理的估价；如果取得的是实物资产和无形'
