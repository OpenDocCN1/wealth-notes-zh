    的（按照国际惯例，只有融资银行在法院判决不能偿还到期款项的情况下，才有追索权）。


    一般的票据贴现不需要银行做担保，手续比较简单，费用一般按照当时的市场利率收取；而包买票据必须由银行做担保，手续相对繁琐，费用负担比较高（金额越小，融资成本越高）。一般的票据贴现几乎适用于所有国内贸易和国际贸易中的票据；而包买票据业务针对的主要是与出口设备有关的业务票据，并且可以包括多张等值汇票，每张票据间隔时间一般为
    6 个月。


