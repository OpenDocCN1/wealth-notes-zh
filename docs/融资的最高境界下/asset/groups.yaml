    # 坦白是诚信与勇敢的产物！


    一诺老师


    有些小企业尤其是个体工商户，原本就没有多少资产，所以也就谈不上资产重组。但这时候如果能模拟资产重组方式来获取银行融资，也无不可；并且事实证明，这种相对变通的办法是行之有效的。


    宋老板是大连荣盛市场上的一位海鲜批发户。荣盛市场位于大连市闹市区，是一家水产品大型批发、零售市场，年交易额超过13亿元，占全市销售量的一半。


    当时正是海鲜批发户开始囤货的时节，宋老板没日没夜地在全国各地海产养殖区联系货源，只恨自己的资金太少。


    这个信息被民生银行客户经理小王知道了，他便通过该市场管理处了解了整个市场的经营情况，然后针对有融资需求以及对民生银行感兴趣的商户召开了一次座谈会，全面深入地了解每家每户的融资需求。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_334_0.png)


    > 没有一处遗产像诚信那样丰富的了！

    > ——一诺老师


    小王经理针对宋老板经营年限长、信誉度好，就是房产面积小、评估价格低、多年来根本无法从银行得到贷款的特点，建议他们参照资产重组模式，采用“联保体贷款”。


    一诺老师认为，把这些有贷款需求的商户联合起来组成“联保体”向银行申请贷款。虽然每家商户的资产不多，但几百家“联保体”商户联合起来的资产也不容小看。这时候虽然依然没有抵押物，但通过管理部门和银行的双重审核，同样可以把贷款风险降到最低。与此同时，这些海鲜批发户也不用再四处寻找抵押物了，更不用说有的商户根本就没有抵押物。


    就这样，宋老板通过“联保体”轻松地就向民生银行贷到300万元贷款，同时又通过抵押第三方房产贷到100万元。有了这400万元贷款支持，宋老板欣喜不已，一下子就把业务拓展到了外省。


    一诺老师说，根据国家税务总局规定，从2011年10月1日起，小企业在资产重组过程中通过合并、分立、出售、置换等方式，将全部或部分实物资产以及与其相关联的债权、债务和劳动力，一并转让给其他单位和个人的行为，不再属于营业税征税范围；其中涉及的不动产、土地使用权转让，也不需要征收营业税了。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_335_0.png)


    ## 本节能课程干货提炼


    (1) 政府对资产重组的企业有一系列税收优惠政策，一诺老师认为，如果小企业无法真正参与资产重组，同样也可以采用模拟资产重组的“联保体”方式从银行获取融资，这能大大减轻单家独户无法享受银行贷款的苦恼。


    (2) 小企业资产重组可以免征营业税，这会大大降低并购成本，加快推进企业通过合并和股权、资产收购等方式进行兼并重组的步伐。一诺老师认为，这个过程一定会有助于淘汰落后产能，增强融资效果。


    (3) 资产重组概念本身，就包括变卖资产、债权转移、联合经营等内涵在内。


    一诺老师认为，所有这些行为都会涉及现金流的流入，从根本上改善企业资金状况，起到实实在在的融资效果。


