    # 第 80 课：风投的诡计


    ## 风险投资运作内幕(知己知彼百战不殆)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_202_0.png)


    ## 搞定风险投资的六大步骤(实操)


    看了一诺老师上面的介绍，或许还有许多中小企业对如何吸引风险投资不得要领，所以在这里系统介绍一下风险投资是如何运作的就变得有必要。


    从国外的成熟经验看，风险投资的运作过程可以概括为“三个主体、三大过程、四个阶段”。“三个主体”，是指风险投资的市场主体主要是“投资者、风险投资公司、风险企业”；“三大过程”，是指风险投资的运行过程主要是“进入、经营、退出”；“四个阶段”，是指风险投资的发展阶段主要分为“种子期、创建期、扩展期、成熟期”。


    了解了这个简单过程后，小企业在引进风险投资时，可以以以下几个步骤来展开：


    ### (1) 了解风险投资融资的过程


    在这其中，重点要注意以下两个方面，一是这些风险投资家特别喜欢投资哪些行业，与你所在的行业是否相符。如果相符，你获取风险投资的机会就比较大。二是他们是如何确定投资过程的，也就是说，他们怎样对投资项目进行详细的评审。


    不用说，因为风险投资追求的是高回报率，所以特别看重技术、市场、管理团队等资源配置的赢利模式，而不是其中的某一个单项。把上述两个方面搞清楚了，你就算是基本掌握了。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_203_0.png)


    成伯一诺老师自身也，领悟商业真谛！


    > 养心莫善于诚！

    > 一诺老师


    ### (2) 发现你的优势所在


    小企业要想赢得风险投资，毫无疑问应当具有某种优势。


    所以你必须充分挖掘并寻找你的优势在什么地方，以此来打动风险投资公司。


    一诺老师认为，要做到这一点，不妨从产品到市场、从人员到管理、从有形资产到无形资产、从现金流到财务状况等做一个系统梳理，扬长避短，把企业最有优势的一面呈现给投资公司，以便最终能获取更多的股权比重。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_204_0.png)


    ### (3) 写好商业计划书


    一诺老师说，一份好的商业计划书是获取风险投资的敲门砖，所以，无论怎样提高商业计划书的分量都是不过分的。因为对于你的企业来说，风险投资可能完全不了解，所以必须借助于商业计划书来考察是否值得投资。


    一诺老师说，一份好的商业计划书，应该分别从市场、股东、风险投资者的角度来考虑问题。而风险投资者最感兴趣的内容，包括详细的市场规模和市场份额分析、清晰明了的商业模式介绍、管理团队构建、财务状况预测等。


    ### (4) 推销你的企业


    一诺老师认为，吸引风险投资的过程，实际上就是推销你的企业的过程，所以要使出浑身解数投入其中。其形式可以包括专家引荐、参加会议、网络联系、直接上门等方式，与风险投资公司取得联系，让它们了解你的企业。最有效的办法是专家引荐，这会迅速拉近距离、消除顾忌。这有点像找对象，找到一个合适的媒人，这恋爱也就成功了一大半。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_205_0.png)


    ### (5) 接受价值评估和尽职调查


    一诺老师认为，风险投资公司一旦对你的企业感兴趣了，接下来会与你签订一份投资意向书，开始对你的企业进行价值评估和尽职调查。


    不用说，这时候你应该配合对方进行这项考察，努力克服信息不对称，消除对方的顾虑。只有当它能确保收益弥补风险时，才会舍得对你投资。


    ### (6) 实施谈判、签订协议


    一诺老师认为，谈判的主要内容包括投资金额、投资方式、投资回报的实现、投资后的经营管理和权益保证、股权结构和管理结构等问题。谈判的过程注定是漫长而辛苦的，所以不要企图一蹴而就。谈判最终达成一致意见后，就是具体落实协议的起草和签订了，这也是水到渠成的事。


    一诺老师要提醒大家，前面提到风险投资运作的三个市场主体中，并没有包括政府在内。其实，政府也是可以作为风险投资主体的，并且在我国目前的国情下，这一比重还相对较高，所以值得小企业重视。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_206_0.png)


    > 真诚才是人生最高的美德！

    > 一诺老师


    ### 大学生在校创业轻松拿到风险投资(案例)


    例如在江苏省无锡市，在校大学生不出校门就可以获得全面的就业创业指导。


    2011 年无锡市公共实训基地在全市高校中一共接受了 7355 名大学生的免费创业培训，组建了 1200 多个模拟公司参与企业经营实训，项目实施覆盖面达 80%，项目培训合格率为
    99%，就业创业指导站覆盖了各大高校。


    换句话说就是，这些大学生如果有好的创业项目，不出校门，在本校就业创业指导站就可以申请到 10 万" 100 万元的政府风险投资。培训基地一共设有 3000
    万元创业基金，用于支持这些有潜力的小企业项目，形式可以是股权投资，也可以是债权投资。也就是说，只要你的项目有发展前景，这些风险投资既可以和你入股，也可以借给你，方式十分灵活。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_207_0.png)


    从财政角度看，各级政府要大力扶持小企业的发展，都必然会注重培育和发展小企业市场主体，建立专业化运作机构，如小额贷款公司等，让它们和政府形成风险共担机制。


    一诺老师发现，各级政府在支持小企业融资方面，不会百分百地承担贷款损失，而是会通过政策性融资机构、商业性融资机构来共同承担贷款责任。应该说，目前这样的风险投资举措还是比较多的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_208_0.png)


    ## 本节课程干货提炼


    - 了解风险投资是怎样运作的、怎样考察企业的，对你成功引进风险投资会有极大帮助，至少也会少走许多弯路。


    在这个过程中，很重要的一点是将心比心，要让对方能够从中得到“好处”，并且在以后的具体实施中加以保证，这样才能让对方放心地对你投资。


    风险投资公司对你进行的考察和尽职调查，着眼点当然是从它自身角度出发的。一诺老师认为，你对此不该有什么想法，并且要配合对方进行深入细致的考察。


    这种考察和调查越实在，双方合作的成功率就越高。要知道，如果一开始你就对对方藏一手露一手，这种合作很难进行下去。


    - 政府也是风险投资主体之一，这不能不引起小企业的高度关注。它的运作方式主要是通过政府财政开支或发行政府债券，形成高科技产业基金（风险投资基金），来组建风险投资公司，直接参与企业的风险投资。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_209_0.png)


