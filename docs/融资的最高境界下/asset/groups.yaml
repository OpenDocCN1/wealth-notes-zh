    # ## 本节课程干货提炼


    (1)企业控制权是指对企业的主要影响力，具体体现在进入董事会或监事会、参与重大决策、维护自身利益的权利。你吸收风险投资进入企业，必然会稀释股权，这时候仅仅考虑融资成本是不够的。许多老板当初创办企业的目的，是想有一份“自己的”事业和实业。如果到头来为人做嫁衣裳，这种融资行为就可能会违背初衷。


    (2)风险投资看中的是你的企业，而不是你个人拥有什么专利技术。风险投资界流行的一句名言是：“宁投二流技术、一流团队的企业，不投一流技术、二，无团队的企业。”所以，不要'
