    \ 100 万元，个别重大项目不超过 200 万元；企业拥有申请项目的知识产权。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_244_0.png)\n\
    \n### (2) 贷款贴息\n\n一诺老师说，中小企业技术创新基金贷款贴息项目主要用途是：银行已经给予贷款或者有意向给予贷款的项目；项目新增投资额在 3000\
    \ 万元以下，资金来源基本确定，投资结构合理，项目执行期在 1 年以上 3 年以内；贷款贴息比例为 50%-100%，一般不超过 100 万元，个别重大项目不超过\
    \ 200 万元。\n\n### (3) 资本金投入\n\n中小企业技术创新基金资本金投入项目的主要用途是：支持用于较广创新内涵、较高创新水平、技术起点高并且有后续创新潜力，以及预计投产后具有较大市场需求、有望形成新兴产业的项目；投入目的主要是引导其他资本的投入；一般要求至少有\
    \ 1 家以上投资合作伙伴一起投资；投入数额一般不超过企业注册资本的 20%；企业资金来源基本确定，投资结构合理；投入的资本金原则上要在一定期限内能依法收回。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_245_0.png)\n\n## 中小企业创新基金的申请步骤(实操)\n\
    \n- 一是到科技局了解相关要求，按要求准备项目申报材料，重点是可行性研究报告和 3 名以上专家的论证意见；\n- 二是将申请材料送到推荐单位，接受推荐单位的审核并签发推荐意见；\n\
    - 三是将申请材料寄到（不接受来人送达）科技型中小企业技术创新基金管理中心接受评审，如果审查未通过，会在 2 个月内收到“不受理通知书”。\n\n赵老板在河北衡水市创办了一家光电科技有限公司，启动资金不到\
    \ 100 万元，大多被用在了研发投入上，年利润不到 50 万元。但这小企业也有自己的看家宝贝，这就是拥有发明专利的主导产品智能双亮度 LED 楼道灯。这种楼道灯不仅使用方便，能耗更是只有其他普通同类产品的三分之一。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_246_0.png)\n\n赵老板为了研发这种新型灯具，掏光了所有家底，两年内在研发过程中已经投入\
    \ 160 多万元。\n\n因为缺钱，对产品外观设计等后续研发已经无法继续下去；但曙光就在前面，用不了多久就能看到这项产品的产业化。\n\n2011 年 8\
    \ 月，赵老板在该市科技局的帮助下，获得了 50 万元技术创新基金的支持。\n\n这 50 万元对于其他企业来说可能不算什么，可是对这家新创业的科技公司来说，已经足可以支撑迈出产业化的最后一道门槛，并且确保\
    \ 2011 年投产当年就赢利。\n\n中小企业技术创新基金的功能之一，就是重点支持初创期小企业的创新项目。\n\n具体要求是，这些小企业的创新项目还处于创业初期，具有较高的创新程度和技术水准，市场发展前景好，但企业资金比较缺乏；企业注册资金不超过\
    \ 300 万元，注册成立时间不超过 18 个月，原则上应该是在初创期小企业创新项目服务机构内注册经营的，并且没有承担过创新基金项目的企业。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_247_0.png)\n\
    \n如果符合上述条件，你可以通过具备专业孵化功能的国家级科技企业孵化器（高新技术创业服务中心）、国家留学人员创业园、国家大学科技园、国家火炬特色产业基地（含软件产业基地）等具有科技型中小企业专业扶育能力的机构，代你向初创期小企业创新项目服务机构推荐。\n\
    \n上述推荐如果能获得通过，中小企业技术创新基金将会以无偿资助方式支持你的立项项目，资助额度为每个项目 40 万元；并且，初创期小企业创新项目服务机构也会以等额资金（西部地区可以减半）予以支持。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_248_0.png)\n\n## 本节课程干货提炼\n\n- (1)\
    \ 随着资本市场不断深化，基金作为一种融资渠道正在企业融资中发挥着越来越重要的作用。所以，小企业千万不要小看这一点。从欧美国家的企业融资现状看，银行贷款部分一般只占\
    \ 20%，其余 80% 都是通过其他融资方式获得的资金，其中就包括各种基金融资。\n- (2) 为了促进企业创新，各级政府不断加大对科技型中小企业创新基金的支持力度，并且有专人负责接受申报。由于这项申报条件要求较高，所以要特别重视申报材料的书写，并非只要有好的产品和技术就行了。项目评审过程中是不许企业补充材料的，所以如果有材料漏报将会被当做无法提供来对待。并且一个企业的一个项目，一年内只能享受一次申请机会。\n\
    - (3) 中小企业创新基金能够助小企业“撑竿跳”，但这项创新基金也不是轻易就能拿到的。当你提出申请后，会有财务专家对你的项目进行评分，85 分以上列入 A\
    \ 档，85 分以下 75 分以上列入 B 档，75 分以下 65 分以上列入 C 档。\n\n不同的档次与所支持的资金额度相适应，分别为 55 万元以上、45\
    \ 万元以上、35 万元以上（西部地区支持力度减半）。评分较高的项目可以降低一档支持，但原则上只降低一档。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_249_0.png)\n\
    \n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\n# 第 66 课：安神融资法\n\n## 利用中介搞定银行的实操方案(落地)\n\
    \n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\n跟一诺老师学习《融资的最高境界》！\n\n一诺老师说，担保贷款也叫担保融资，是一种特殊的金融中介。它的最大特点是介于企业和商业银行之间，把信用证明和资产责任保证紧密联系在一起，通过担保人提供担保，来提高被担保人的资信等级。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_250_0.png)\n\n正因如此，担保人对被担保人的生产经营活动往往需要进行监督，甚至会直接参与到生产经营活动过程中去。\n\
    \n具体到中小企业担保贷款来说，由于小企业一般生产规模较小、生产经营过程不够规范、经济效益不太稳定、法制观念比较淡薄，所以通过担保人进行担保，会有助于更好地融得资金。在这种背景下，从\
    \ 20 世纪 90 年代以来，出现了一大批中小企业信用担保机构，力图为中小企业的快速融资助一臂之力。\n\n然而也应当承认，与欧美、日本等成熟经济发展模式相比，我国中小企业信用担保体系的规模还太小，资金来源单一（主要是政府财政资金），再加上这些机构多是在各级政府支持建立起来的，政府不适当的干预比较普遍，政策上又缺乏连贯性，从而导致对小企业的支持力度并不理想。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_251_0.png)\n\n但即使如此，中小企业担保贷款对小企业的融资影响还是不容忽视的。无论你的企业是什么所有制，也不论你的资产组合结构如何，只要你在工商行政管理部门注册登记，具有法人资格，连续经营一年以上，没有不良信用记录和重大民事经济纠纷，并且资产负债率在中小企业平均水平以下，拥有规定比例的实收资本，就可以申请这项贷款。\n\
    \n一诺老师说，如果你的经营项目按国家产业政策规定是需要特别支持的，还可以在同条件下优先获得担保贷款资格。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_252_0.png)\n\
    \n## 中小企业担保贷款的申请程序(实操)\n\n- (1) 选择合适的贷款银行，向对方提出担保申请。\n- (2) 配合担保机构开展审核，提高贷款资金使用率。\n\
    - (3) 到期还本付息。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_252_1.png)\n\n## 本节课程干货提炼\n\
    \n- (1) 小企业常常要为资金问题伤透脑筋，即使看到银行“有的是钱”，也会因为找不到担保而无法从银行贷到款。而现在好了，随着国家政策和有关部门的鼎力扶持，以及担保贷款的迅速增加，中小企业担保贷款正在成为小企业的一条有效融资之路，起到了“安神补脑”的作用。\n\
    - (2) 有了中小企业担保机构的担保，这些担保机构就成了实质意义上的债权人，而银行则成了名义上的债权人。小企业只要交付了正常的委托贷款利息和少量的借款手续费，就可以省去担保费用，降低融资成本。\n\
    - (3) 中小企业担保公司大多实行会员制管理形式，具有公共服务性、行业自律性、自身非营利性特点。一诺老师认为，即使你暂时不用贷款，也可以首先申请成为其会员。将来如果通过担保公司获取担保贷款，并且又能在规定时间内归还贷款，就有可能享受到政府给予的担保费补贴。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_253_0.png)\n\n> “真者，精诚之至也。不精不诚，不能动人！”\
    \ —— 一诺老师\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\n# 第 67 课：国拓融资法\n\n##\
    \ 搞定中央财政资金的全攻略(跪在地上唱征服)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\n跟一诺老师学习《融资的最高境界》!\n\
    \n一诺老师说，小企业要想把产品和服务推广到全球，就必须注重国际市场的开拓。而在这方面，政府有一项专门用于帮助拓展国际市场的专项资金，助你实现这种心愿。这就是中小企业国际市场开拓资金，由各级经贸部门（商务部门）负责。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_254_0.png)\n\n国际市场开拓资金，是中央财政专门用来支持中小企业开拓国际市场业务和活动，由政府预算基金和地方财政安排的专项资金，分为中央使用和地方使用两部分，中央直接使用的资金占全年计划的\
    \ 30%，地方占 70%；同样实行中央和地方两级管理。具体到地方使用部分，又包括中央财政预算拨付的专项资金和地方财政自行安排的专项资金两部分。每年，各地商务局（外经贸易局）都会确定本地市场开拓资金的支持方向和使用范围，提出项目资金计划，审核、论证资金使用项目。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_255_0.png)\n\n## 国拓融资的必备条件(干货)\n\n\
    申请国际市场开拓资金的企业必须具备什么样的条件呢？\n\n一诺老师研究发现这方面主要有：\n\n- 1. 一是在我国国内注册，依法取得进出口经营资格或办理对外贸易经营者备案登记的企业法人，上年度海关统计进出口额在\
    \ 4500 万美元以下；\n- 2. 二是近 3 年在外经贸易业务、财务、税收、外汇、海关管理等方面没有违法违规行为；\n- 3. 三是拥有从事国际市场开拓的专业人员，对开拓国际市场有明确的工作安排和开拓计划；\n\
    - 四是没有拖欠应交财政性资金。\n\n国际市场开拓资金的主要支持内容是：\n\n- 境外展览会，包括展位费、公共布展费、大型展品回运费；\n- 企业管理体系、环境管理体系、软件出口企业和各类产品的认证；境外专利申请；国际市场宣传推介；电子商务；境外广告和商标注册；国际市场考察；境外投（议）标；组织培训与研讨会；境外收购技术和品牌等。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_256_0.png)\n\n> “如果要别人诚信，首先要自己要诚信！”\
    \ —— 一诺老师\n\n## 国拓资金优先支持的项目(实用)\n\n- 一是企业主要面向拉美、非洲、中东、东欧、东南亚等新兴国际市场开展业务。\n- 二是高新技术和机电产品出口企业拓展国际市场。\n\
    - 三是小企业取得质量管理体系认证、环境管理体系认证、产品认证等国际认证。\n- 四是用于名优产品、本国原产成分高于 70% 或拥有自主知识产权的产品出口。\n\
    - 五是已经获得质量管理体系认证、环境管理体系认证、产品认证的国际市场拓展活动。\n- 六是上年度海关统计进出口额在 4500 万美元以下；并且近 3 年来在外经贸业务、财务、税收、外汇、海关管理方面无违法违规行为；公司具有从事国际市场开拓的专业人员，对开拓国际市场有明确的工作安排和计划；没有拖欠应交财政性资金。\n\
    - 七是企业举办和参加境外展览会、贸易洽谈会；质量管理体系、环境管理体系、软件出口企业和各类产品认证；国际市场宣传推介；开拓新兴出口市场；组织培训与研讨会；境外投标（议标）等。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_257_0.png)\n\n## 如何跟国拓资金主管部门打交道(实用)\n\
    \n一诺老师发现，在各级地方政府，同样也由商务局和财政局委托当地中小企业办公室，负责受理项目资金计划申请、项目实施申请、项目资金拨付申请，并且进行初审；根据项目资金计划申请情况，拟订年度项目资金计划安排；协助商务部门和财政部门对资金使用情况、效果进行跟踪和检查。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_258_0.png)\n\n从资助金额看，原则上不能超过所需项目金额的\
    \ 50%，如果是中西部和老工业基地的小企业，比例可以提高到 70%。从资助方式看，有无偿支持和风险支持两种。\n\n无偿支持容易理解，是指无论你是否取得成效，拨给你就是你的了；\n\
    \n一诺老师认为，风险支持则是指承担你开拓国际市场的部分风险，也就是说，如果你的开拓市场没有取得预期成效，就可以享受这种风险支持，如果取得了成效，就不能再享受国际市场开拓资金的资助了。\n\
    \n由于国际市场开拓所需费用支出都是以外币计算的，所以在折合人民币时，要（*原文为“衙”，推测为“要”*）根据费用支出凭证发生当天的外汇牌价折算成人民币。\n\
    \n如果你要申报国际市场开拓资金，一般要先向当地商务局提出申请，然后由商务局汇总后会商财政局同意，上报省中小企业办公室，然后再会商省商务厅，核准后报省财政厅。\n\
    \n申报时如果各项资料齐全，20 个工作日内就能办理完毕；拨付资金时，材料齐全者 5 个工作日内钱就能到你账上。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_259_0.png)\n\
    \n## 本节课程干货提炼\n\n- (1) 小企业想开拓国际市场，但是，它们不能与大企业尤其是中央直属企业相提并论。所以，如果能得到一部分财政支持，这方面就会减轻不少困难。\n\
    - (2) 小企业如果能抓住机会赴国际市场亮相，对树立企业形象、扩大产品影响有很大帮助。所以，可以积极争取国际市场开拓资金去境外参加或举办展览会，参加各种质量体系认证，进行国际市场推介，开拓新兴市场。有了这部分资金的资助，成本费用会降低一大半，何乐而不为呢？\n\
    - (3) 每年允许申报的项目可以多达 10 个，而不仅仅是 1 个，累计最高支持资金可达 50 万元。但每个支持项目的实际支出全额都要超过 1 万元。根据这样的条件，你可以通盘考虑国际市场开拓行为，尽量争取财政支持。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_260_0.png)\n\n> “轻诺必寡信，多易必多难！” —— 一诺老师\n\
    \n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\n# 一诺老师 20 年呕心沥血之作《融资的最高境界》融到永远也花不完的钱！\n\
    \n用 300 元最低融资 500 万，签订《零风险+对赌》协议！\n\n零风险：没有融到约定金额，你 1 分钱损失没有！\n\n对赌：在约定的期限内没融资\
    \ 500 万，倒赔你 3-300 万！\n\n更多商业经典请加微信：631088107\n\n# 第 68 课：专项融资法\n\n## 搞定中小企业成长专项发展资金(落地)\n\
    \n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\n跟一诺老师学习《融资的最高境界》！\n\n一诺老师发现，小企业在发展过程中，还有一项政策性融资可供选择，那就是中小企业发展专项资金。\n\
    \n一诺老师说，这是一项专门用于扶助小企业发展的中央财政预算资金，目的是为了促进小企业的结构调整、产业升级、综合利用和专业化发展，促进小企业与大企业的协作配套、技术进取和品牌建设，促进建设信用担保体系和市场开拓，但它又不属于科技型中小企业技术创新基金。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_262_0.png)\n\n中小企业发展专项资金是从 2004 年开始设立的，规模逐年扩大，支持的业务范围也逐步放宽，尤其是在\
    \ 2009 年国务院出台《关于进一步促进中小企业发展的若干意见》后，更是把它作为中央财政积极运用财税政策、大力支持中小企业尤其是小企业发展的重要举措。2011\
    \ 年，中央财政安排的这项资金规模高达 128.7 亿元，比上年增加 8.6%。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_263_0.png)\n\
    \n## 中小企业专项资金的申请方式(实操)\n\n一诺老师说，无偿资助、贷款贴息和资本金注入，申请时只能从中选择一种，不能兼而有之。\n\n无偿资助方式主要用于小企业以自有资金为主投资的固定资产建设、市场开拓、信用担保体系建设等项目，每个项目的资助额度一般不超过\
    \ 300 万元。\n\n贷款贴息方式主要用于小企业以银行贷款为主投资的固定资产建设，额度根据项目贷款数额和银行同期贷款利率来确定，每个项目贴息期限一般不超过\
    \ 2 年，额度不超过 300 万元。\n\n资本金注入方式主要用于小企业在信用担保体系建设方面，在无偿资助不太适合的背景下使用。\n\n那么，什么样的小企业能够申请到中小企业发展专项资金呢？一诺老师研究发现，需要符合以下条件：\n\
    \n具有独立的法人资格；财务管理制度健全；经济效益良好；会计信用、纳税信用和银行信用良好；申报项目符合专项资金的年度支持方向和重点。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_264_0.png)\n\
    \n## 固定资产建设项目专项资金申请方案（落地）\n\n- (1) 企业技术改造类项目：\n    - 产业结构调整项目，重点瞄准轻工、纺织、电子信息行业，支持新产品、新技术、新工艺，促进产业升级、产业转移的技术改造项目。\n"
  mdcn: "\n## 中小企业科技局融资方案(落地)\n\n- 具有独立企业法人资格。\n- 主要从事高新技术产品研究、开发、生产、服务。\n- 具有较强的市场开拓能力、较高的经营管理水平。\n\
    - 员工人数在 500 人以下，大专以上学历占员工总数比例在 30% 以上，直接从事研究开发的科技人员占员工总数比例在 10% 以上。\n- 经营业绩良好，资产负债率不超过\
    \ 70%，用于高新技术产品研究开发经费不低于销售额的 5%（新办企业不受此限）。\n- 具有健全的财务机构和合格的财务人员。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_243_0.png)\n\
    \n## 中小企业容易申请的三种补贴(实用)\n\n### (1) 无偿拨款\n\n一诺老师研究发现，中小企业技术创新基金无偿拨款项目的主要用途是：技术创新在研究、开发、中试阶段；企业注册资本不低于\
    \ 30 万元；资助项目尚未销售或只有少量销售；资助期限为 2 年，项目完成时要形成一定的生产能力和合理的销售收入；项目新增投资不超过 1000 万元，资金来源确定，投资结构合理；资助额一般不超过\
    \ 100 万元，个别重大项目不超过 200 万元；企业拥有申请项目的知识产权。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_244_0.png)\n\
    \n### (2) 贷款贴息\n\n一诺老师说，中小企业技术创新基金贷款贴息项目主要用途是：银行已经给予贷款或者有意向给予贷款的项目；项目新增投资额在 3000\
    \ 万元以下，资金来源基本确定，投资结构合理，项目执行期在 1 年以上 3 年以内；贷款贴息比例为 50%-100%，一般不超过 100 万元，个别重大项目不超过\
    \ 200 万元。\n\n### (3) 资本金投入\n\n中小企业技术创新基金资本金投入项目的主要用途是：支持用于较广创新内涵、较高创新水平、技术起点高并且有后续创新潜力，以及预计投产后具有较大市场需求、有望形成新兴产业的项目；投入目的主要是引导其他资本的投入；一般要求至少有\
    \ 1 家以上投资合作伙伴一起投资；投入数额一般不超过企业注册资本的 20%；企业资金来源基本确定，投资结构合理；投入的资本金原则上要在一定期限内能依法收回。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_245_0.png)\n\n## 中小企业创新基金的申请步骤(实操)\n\
    \n- 一是到科技局了解相关要求，按要求准备项目申报材料，重点是可行性研究报告和 3 名以上专家的论证意见；\n- 二是将申请材料送到推荐单位，接受推荐单位的审核并签发推荐意见；\n\
    - 三是将申请材料寄到（不接受来人送达）科技型中小企业技术创新基金管理中心接受评审，如果审查未通过，会在 2 个月内收到“不受理通知书”。\n\n赵老板在河北衡水市创办了一家光电科技有限公司，启动资金不到\
    \ 100 万元，大多被用在了研发投入上，年利润不到 50 万元。但这小企业也有自己的看家宝贝，这就是拥有发明专利的主导产品智能双亮度 LED 楼道灯。这种楼道灯不仅使用方便，能耗更是只有其他普通同类产品的三分之一。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_246_0.png)\n\n赵老板为了研发这种新型灯具，掏光了所有家底，两年内在研发过程中已经投入\
    \ 160 多万元。\n\n因为缺钱，对产品外观设计等后续研发已经无法继续下去；但曙光就在前面，用不了多久就能看到这项产品的产业化。\n\n2011 年 8\
    \ 月，赵老板在该市科技局的帮助下，获得了 50 万元技术创新基金的支持。\n\n这 50 万元对于其他企业来说可能不算什么，可是对这家新创业的科技公司来说，已经足可以支撑迈出产业化的最后一道门槛，并且确保\
    \ 2011 年投产当年就赢利。\n\n中小企业技术创新基金的功能之一，就是重点支持初创期小企业的创新项目。\n\n具体要求是，这些小企业的创新项目还处于创业初期，具有较高的创新程度和技术水准，市场发展前景好，但企业资金比较缺乏；企业注册资金不超过\
    \ 300 万元，注册成立时间不超过 18 个月，原则上应该是在初创期小企业创新项目服务机构内注册经营的，并且没有承担过创新基金项目的企业。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_247_0.png)\n\
    \n如果符合上述条件，你可以通过具备专业孵化功能的国家级科技企业孵化器（高新技术创业服务中心）、国家留学人员创业园、国家大学科技园、国家火炬特色产业基地（含软件产业基地）等具有科技型中小企业专业扶育能力的机构，代你向初创期小企业创新项目服务机构推荐。\n\
    \n上述推荐如果能获得通过，中小企业技术创新基金将会以无偿资助方式支持你的立项项目，资助额度为每个项目 40 万元；并且，初创期小企业创新项目服务机构也会以等额资金（西部地区可以减半）予以支持。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_248_0.png)\n\n## 本节课程干货提炼\n\n- (1)\
    \ 随着资本市场不断深化，基金作为一种融资渠道正在企业融资中发挥着越来越重要的作用。所以，小企业千万不要小看这一点。从欧美国家的企业融资现状看，银行贷款部分一般只占\
    \ 20%，其余 80% 都是通过其他融资方式获得的资金，其中就包括各种基金融资。\n- (2) 为了促进企业创新，各级政府不断加大对科技型中小企业创新基金的支持力度，并且有专人负责接受申报。由于这项申报条件要求较高，所以要特别重视申报材料的书写，并非只要有好的产品和技术就行了。项目评审过程中是不许企业补充材料的，所以如果有材料漏报将会被当做无法提供来对待。并且一个企业的一个项目，一年内只能享受一次申请机会。\n\
    - (3) 中小企业创新基金能够助小企业“撑竿跳”，但这项创新基金也不是轻易就能拿到的。当你提出申请后，会有财务专家对你的项目进行评分，85 分以上列入 A\
    \ 档，85 分以下 75 分以上列入 B 档，75 分以下 65 分以上列入 C 档。\n\n不同的档次与所支持的资金额度相适应，分别为 55 万元以上、45\
    \ 万元以上、35 万元以上（西部地区支持力度减半）。评分较高的项目可以降低一档支持，但原则上只降低一档。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_249_0.png)\n\
    \n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\n# 第 66 课：安神融资法\n\n## 利用中介搞定银行的实操方案(落地)\n\
    \n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\n跟一诺老师学习《融资的最高境界》！\n\n一诺老师说，担保贷款也叫担保融资，是一种特殊的金融中介。它的最大特点是介于企业和商业银行之间，把信用证明和资产责任保证紧密联系在一起，通过担保人提供担保，来提高被担保人的资信等级。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_250_0.png)\n\n正因如此，担保人对被担保人的生产经营活动往往需要进行监督，甚至会直接参与到生产经营活动过程中去。\n\
    \n具体到中小企业担保贷款来说，由于小企业一般生产规模较小、生产经营过程不够规范、经济效益不太稳定、法制观念比较淡薄，所以通过担保人进行担保，会有助于更好地融得资金。在这种背景下，从\
    \ 20 世纪 90 年代以来，出现了一大批中小企业信用担保机构，力图为中小企业的快速融资助一臂之力。\n\n然而也应当承认，与欧美、日本等成熟经济发展模式相比，我国中小企业信用担保体系的规模还太小，资金来源单一（主要是政府财政资金），再加上这些机构多是在各级政府支持建立起来的，政府不适当的干预比较普遍，政策上又缺乏连贯性，从而导致对小企业的支持力度并不理想。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_251_0.png)\n\n但即使如此，中小企业担保贷款对小企业的融资影响还是不容忽视的。无论你的企业是什么所有制，也不论你的资产组合结构如何，只要你在工商行政管理部门注册登记，具有法人资格，连续经营一年以上，没有不良信用记录和重大民事经济纠纷，并且资产负债率在中小企业平均水平以下，拥有规定比例的实收资本，就可以申请这项贷款。\n\
    \n一诺老师说，如果你的经营项目按国家产业政策规定是需要特别支持的，还可以在同条件下优先获得担保贷款资格。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_252_0.png)\n\
    \n## 中小企业担保贷款的申请程序(实操)\n\n- (1) 选择合适的贷款银行，向对方提出担保申请。\n- (2) 配合担保机构开展审核，提高贷款资金使用率。\n\
    - (3) 到期还本付息。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_252_1.png)\n\n## 本节课程干货提炼\n\
    \n- (1) 小企业常常要为资金问题伤透脑筋，即使看到银行“有的是钱”，也会因为找不到担保而无法从银行贷到款。而现在好了，随着国家政策和有关部门的鼎力扶持，以及担保贷款的迅速增加，中小企业担保贷款正在成为小企业的一条有效融资之路，起到了“安神补脑”的作用。\n\
    - (2) 有了中小企业担保机构的担保，这些担保机构就成了实质意义上的债权人，而银行则成了名义上的债权人。小企业只要交付了正常的委托贷款利息和少量的借款手续费，就可以省去担保费用，降低融资成本。\n\
    - (3) 中小企业担保公司大多实行会员制管理形式，具有公共服务性、行业自律性、自身非营利性特点。一诺老师认为，即使你暂时不用贷款，也可以首先申请成为其会员。将来如果通过担保公司获取担保贷款，并且又能在规定时间内归还贷款，就有可能享受到政府给予的担保费补贴。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_253_0.png)\n\n> “真者，精诚之至也。不精不诚，不能动人！”\
    \ —— 一诺老师\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\n# 第 67 课：国拓融资法\n\n##\
    \ 搞定中央财政资金的全攻略(跪在地上唱征服)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\n跟一诺老师学习《融资的最高境界》!\n\
    \n一诺老师说，小企业要想把产品和服务推广到全球，就必须注重国际市场的开拓。而在这方面，政府有一项专门用于帮助拓展国际市场的专项资金，助你实现这种心愿。这就是中小企业国际市场开拓资金，由各级经贸部门（商务部门）负责。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_254_0.png)\n\n国际市场开拓资金，是中央财政专门用来支持中小企业开拓国际市场业务和活动，由政府预算基金和地方财政安排的专项资金，分为中央使用和地方使用两部分，中央直接使用的资金占全年计划的\
    \ 30%，地方占 70%；同样实行中央和地方两级管理。具体到地方使用部分，又包括中央财政预算拨付的专项资金和地方财政自行安排的专项资金两部分。每年，各地商务局（外经贸易局）都会确定本地市场开拓资金的支持方向和使用范围，提出项目资金计划，审核、论证资金使用项目。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_255_0.png)\n\n## 国拓融资的必备条件(干货)\n\n\
    申请国际市场开拓资金的企业必须具备什么样的条件呢？\n\n一诺老师研究发现这方面主要有：\n\n- 1. 一是在我国国内注册，依法取得进出口经营资格或办理对外贸易经营者备案登记的企业法人，上年度海关统计进出口额在\
    \ 4500 万美元以下；\n- 2. 二是近 3 年在外经贸易业务、财务、税收、外汇、海关管理等方面没有违法违规行为；\n- 3. 三是拥有从事国际市场开拓的专业人员，对开拓国际市场有明确的工作安排和开拓计划；\n\
    - 四是没有拖欠应交财政性资金。\n\n国际市场开拓资金的主要支持内容是：\n\n- 境外展览会，包括展位费、公共布展费、大型展品回运费；\n- 企业管理体系、环境管理体系、软件出口企业和各类产品的认证；境外专利申请；国际市场宣传推介；电子商务；境外广告和商标注册；国际市场考察；境外投（议）标；组织培训与研讨会；境外收购技术和品牌等。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_256_0.png)\n\n> “如果要别人诚信，首先要自己要诚信！”\
    \ —— 一诺老师\n\n## 国拓资金优先支持的项目(实用)\n\n- 一是企业主要面向拉美、非洲、中东、东欧、东南亚等新兴国际市场开展业务。\n- 二是高新技术和机电产品出口企业拓展国际市场。\n\
    - 三是小企业取得质量管理体系认证、环境管理体系认证、产品认证等国际认证。\n- 四是用于名优产品、本国原产成分高于 70% 或拥有自主知识产权的产品出口。\n\
    - 五是已经获得质量管理体系认证、环境管理体系认证、产品认证的国际市场拓展活动。\n- 六是上年度海关统计进出口额在 4500 万美元以下；并且近 3 年来在外经贸业务、财务、税收、外汇、海关管理方面无违法违规行为；公司具有从事国际市场开拓的专业人员，对开拓国际市场有明确的工作安排和计划；没有拖欠应交财政性资金。\n\
    - 七是企业举办和参加境外展览会、贸易洽谈会；质量管理体系、环境管理体系、软件出口企业和各类产品认证；国际市场宣传推介；开拓新兴出口市场；组织培训与研讨会；境外投标（议标）等。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_257_0.png)\n\n## 如何跟国拓资金主管部门打交道(实用)\n\
    \n一诺老师发现，在各级地方政府，同样也由商务局和财政局委托当地中小企业办公室，负责受理项目资金计划申请、项目实施申请、项目资金拨付申请，并且进行初审；根据项目资金计划申请情况，拟订年度项目资金计划安排；协助商务部门和财政部门对资金使用情况、效果进行跟踪和检查。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_258_0.png)\n\n从资助金额看，原则上不能超过所需项目金额的\
    \ 50%，如果是中西部和老工业基地的小企业，比例可以提高到 70%。从资助方式看，有无偿支持和风险支持两种。\n\n无偿支持容易理解，是指无论你是否取得成效，拨给你就是你的了；\n\
    \n一诺老师认为，风险支持则是指承担你开拓国际市场的部分风险，也就是说，如果你的开拓市场没有取得预期成效，就可以享受这种风险支持，如果取得了成效，就不能再享受国际市场开拓资金的资助了。\n\
    \n由于国际市场开拓所需费用支出都是以外币计算的，所以在折合人民币时，要（*原文为“衙”，推测为“要”*）根据费用支出凭证发生当天的外汇牌价折算成人民币。\n\
    \n如果你要申报国际市场开拓资金，一般要先向当地商务局提出申请，然后由商务局汇总后会商财政局同意，上报省中小企业办公室，然后再会商省商务厅，核准后报省财政厅。\n\
    \n申报时如果各项资料齐全，20 个工作日内就能办理完毕；拨付资金时，材料齐全者 5 个工作日内钱就能到你账上。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_259_0.png)\n\
    \n## 本节课程干货提炼\n\n- (1) 小企业想开拓国际市场，但是，它们不能与大企业尤其是中央直属企业相提并论。所以，如果能得到一部分财政支持，这方面就会减轻不少困难。\n\
    - (2) 小企业如果能抓住机会赴国际市场亮相，对树立企业形象、扩大产品影响有很大帮助。所以，可以积极争取国际市场开拓资金去境外参加或举办展览会，参加各种质量体系认证，进行国际市场推介，开拓新兴市场。有了这部分资金的资助，成本费用会降低一大半，何乐而不为呢？\n\
    - (3) 每年允许申报的项目可以多达 10 个，而不仅仅是 1 个，累计最高支持资金可达 50 万元。但每个支持项目的实际支出全额都要超过 1 万元。根据这样的条件，你可以通盘考虑国际市场开拓行为，尽量争取财政支持。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_260_0.png)\n\n> “轻诺必寡信，多易必多难！” —— 一诺老师\n\
