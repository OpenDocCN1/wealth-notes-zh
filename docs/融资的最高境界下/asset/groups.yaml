    ## 第 34 课: 债券融资法


    ### 空手道大师无中生有的造钱术(落地)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    与老板私人借款不同的是，小企业的债券发行一定是企业行为，不可能是老板的个人行为。


    一诺老师说，这在缓解资金紧张方面的作用是一致的，尤其适合企业急需大批资金时的“救命”之用。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_2_0.png)


    企业发行的债券称为企业债券（上市公司则叫公司债券），是指按照法定程序发行，承诺按照约定条件偿还本金，并且按照既定利率支付利息的债务凭证。我国的企业债券是 20
    世纪 80 年代末出现的，2008 年时首次超过股票融资规模，并且在二级市场上的交易也非常活跃。然而遗憾的是，企业发行债券的行为只限于大中型企业。虽然发行企业债券并不看企业规模大小，没有谁规定小企业就不能发行，但企业发行债券中有一条“股份有限公司净资产不低于
    3000 万元，有限责任公司和其他类型企业净资产不低于 6000 万元”的硬杠杠，几乎就排除了所有小企业。所以从这个角度看，我国发行企业债券的法律法规和政策导向，对小企业非常不利，直到
    2012 年中小企业私募债政策的出台，形势才有了根本好转。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_3_0.png)


    一诺老师说，债券融资最常见的方式就是企业债券和可转换债券。其中，从广义上看企业债券就是公司债券，从狭义来看，这两者也是不同的——企业债券的发行主体范围较广，发债要求相对较低；而公司债券的发行要求则相对严格，只有国有独资公司、上市公司、两个国有投资主体设立的有限责任公司才能发行，并且对资产负债率及资本金等都有严格限制。


    小企业发行企业债券主要有以下两条渠道：


    ### 公司集合债券融资方案(实战)


    一诺老师认为，这与通常的企业债券（公司债券）概念不同，本书在这里所说的小企业也能发行企业债券，主要是指“集合债”，俗称“捆绑发债”，而不是单个企业的债券发行，因为小企业不可能达到发行企业债券的条件。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_4_0.png)


    一诺老师说，既然某个单独的小企业不符合发行债券的要求，由其中的一家牵头，几家或几十家企业联合起来一起申请发行债券，这种变通办法也是可以的，并且是政府认可的。


    一方面，单个小企业的规模小、资信评级低，达不到政府规定的企业债券发行条件；另一方面，小企业又最需要对外融资。那么，这时候多家小企业联合起来发行“集合债”，就不但符合债券发行条件，提高了发行成功率，而且还能提高资信评级，摊低发行成本。


    这种“集合债”最早出现在2003年。当时我国有12家地处不同高新技术开发区的小企业，联合起来采用“统一冠名、分别负债、分别担保、捆绑发行”的办法来发行企业债。


    目前这一做法已相对成熟，各地都有比较好的成功经验，如果你需要参与其中，可以向当地相关部门申请。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_5_0.png)


    一诺老师要说的是，这并不是说参与发行“集合债”就没有门槛，只是说这样的门槛对小企业来说并非高不可攀，跳一跳是可以够到的，否则也就失去了发行这种债券的实际意义。


    总体来看，债券融资的最大好处是，能够有效拓宽直接融资渠道，较好地解决融资风险和收益不对称问题；债券利息可以计入成本，起到节税作用；债券期限可长可短，一年以内的称为短期债券，一到五年的称为中期债券，五年以上的叫长期债券；债券可以记名也可以不记名；除了发行担保债券外，还可以发行信用债券。


    一般来说，小企业如果规模小、知名度低、信用记录无从查询，为了提高债券发行对投资者的吸引力，可以附加一些其他条件，如担保、可兑换、认名等，增强投资者信心，使得债券更容易发出去。因为只有债券发得出去，你才能最终拿到钱。


    这里重点提一提信用债券。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_6_0.png)


    小企业到了要发行债券融资的地步，一般说明已经出现了资金困难，这时候如果用不动产抵押、存货或无形资产质押、第三人担保来发行债券，当然也是可以的，但比较费时费力。


    更何况，并不是所有企业都具有这样的资源。相反，这时候如果能凭借债券发行人（企业及老板）的良好信用来发行债券，就显得非常简单直接。当然，其前提是你要有信誉，要使人相信你发行的债券能按时偿还，不至于成为一张废纸。


    并且，这种良好信用不是临时抱佛脚就行，必须建立在过去别人对你这个企业和老板的良好评价基础之上。从这个角度看，你平时的诚实经营有多么重要。


    ### 发行“集合债”的具体步骤(干货)


    一是要有一个牵头机构（人）下发通知，要求几个企业一起申请上报发行“集合债”。当然，你也可以作为这样的牵头机构，组织、发动别人一起申请上报。


    二是如果你想参与发行“集合债”，那么就要对照自身条件，看是否符合各项要求，这主要包括：净资产要达到一定规模，发行债券后的累计债券余额不能超过企业净资产的40%；生产经营范围符合法律法规和国家产业政策；最近三年的可分配利润足以支付一年的债券利息，等等。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_7_0.png)


    三是接受牵头机构聘请的财务顾问或主承销商对你的企业进行初步评估，如果能通过，就要落实统一担保人和反担保人。


    四是要确定参与发行“集合债”的企业名单，相互签署协议或意向书，接受中介机构的尽职调查。


    五是制定债券发行章程，向相关部门（一般是当地发展和改革委员会）提交申请发行“集合债”的文件，提供发行债券的可行性分析报告，选择合适的发行方式、种类、时间，确定发行总额、面额、利率、期限，公告债券募集办法，与承销机构签订承销合同，协商担保事宜，等待“集合债”的最佳发行时机。


    最后，当然也就是发行出售债券，进行债券融资了。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_8_0.png)


    为了鼓励这种“集合债”的发行，国家发展和改革委员会把过去发行企业债券的程序进行了“合二为一”的简化，即从原来的“先核定规模、后核准发行”两个环节，一步到位简化为“直接核准发行”一个环节，并且对发债企业的净资产、债券规模占项目总投资比例等方面也进行了适当调整，实际上就是要降低门槛，让更多的小企业能够进行直接融资。


    如果企业规模实在太小、资信评级较低，还可以通过第三方担保的方式来发行债券，可谓想得十分周到。


    还有一条非常重要的是，国家发展和改革委员会对“集合债”的发行审核，从过去的“审核制”改成了“条件核准制”。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_9_0.png)


    一诺老师说，这些发行条件是透明的，只要你们这几个想联合发行“集合债”的企业符合以下七个要求，就会得到批准。


    ### 发行集合债的七大要素(实用)


    - 这些发债企业的成立时间必须在 4 年以上，净资产规模在 6000 万元以上；

    - 具有独立知识产权，具有明确的筹资建设项目和资金使用计划；

    - 具有较强的成长性，现金流良好，近三年连续销售增长 20%以上，连续净利润增长 10%以上；

    - 申请发债额度不低于 5000 万元；

    - 近三年没有违法和重大违规行为；

    - 必须有两家有实力的担保公司进行担保，并由全国资本金最大的政策性担保公司再担保；

    - 不得由地方财政安排专项资金为担保公司提供风险补偿。


    一诺老师总结的以上条件，看起来非常严格，但经过这样的筛选，还是有许多小企业是能够达到上述所有条件的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_10_0.png)


    ### 中小企业私募融资方案(落地)


    一诺老师发现，中小企业可以发行私募债券的政策，是从 2012 年 5 月开始启动、6 月正式推出的。


    这项措施的出台，其实质就是为了降低中小企业尤其是其中的微型企业发行债券的门槛，为企业融资创造便利条件。


    根据深圳证券交易所《中小企业私募债券业务试点办法》规定，中小企业私募债券是指未公开上市的中小微型企业，用非公开方式发行公司债券。凡是符合规模的未上市非房地产、金融类有限责任公司或股份有限公司，只要发行利率不超过同期银行贷款基准利率的
    3 倍（年利率约为 20%），并且发行期限在 1 年以上，都可以发行中小企业私募债券。


    中小企业私募债券的发行采用备案制。从 2012 年 5 月 23 日起，深圳证券交易所开始接受小企业发行债券的备案申请，然后在 10 个工作日内完成备案。


    债券转让通过深圳证券交易所的综合协议交易平台，以全价方式进行，单笔现货交易不得低于 5000 张（交易金额不低于人民币 50 万元），成交价格由买卖双方在
    前一个收盘价上下 30% 范围内自行协商确定。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_11_0.png)


    赢利能力方面的门槛要求，就是说，这是一种完全市场化的“信用债券”品种。正因如此会带来两个结果：


    - 大大方便了小企业的债券融资；

    - 大大增加了债券投资者的投资风险和小企业的经营风险。因为毕竟不是所有资金紧缺的小企业，都能承担得起这样高的财务成本的。


    为了解决这个问题，中小企业私募债券的发行，会要求合格投资者签署风险认知书，并且要求发债企业设立偿债保障金专户，确保债券兑换。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_12_0.png)


    ### 小企业的债券融资的基本要素(干货)


    - 经有关金融监管部门批准设立的金融机构，包括商业银行、证券公司、基金管理公司、信托公司、保险公司等；

    - 上述金融机构面向投资者个人发行的理财产品，包括信托产品、投连险（投资连结保险）产品、基金产品、证券公司资产管理产品等；

    - 注册资本不低于 1000 万元人民币的企业法人；

    - 合伙人认缴出资额总额不低于人民币 5000 万元、实际出资总额不低于人民币 1000 万元的合伙企业；等等。


    而上海证券交易所颁布的试点办法则规定，除此以外，下列个人投资者也居于合格投资者范围：


    - 个人名下各类证券账户、资金账户、资产管理账户的资产总额不低于 500 万元，具有两年以上证券投资经验，理解并接受私募债券风险；

    - 发行人的董事、监事、高级管理人员及持股比例超过 5% 的股东。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_13_0.png)


    ### 本节课程干货提炼


    1. 企业发行债券是一种风险较高的行为。因为债券利率通常要高于银行利率，而这就对企业构成了较高的成本压力。如果企业发行债券后赢利状况不良，不但会造成亏损，而且债券持有人也会面临经济损失的风险。

    2. 与银行贷款相比，发行“集合债”的优点是：融资期限较长，可达三至五年，而银行贷款一般只能在一年以内；流动性强，可以在银行间债券市场和交易所债券市场上市交易，而银行贷款没有流动性。

    3. 债券发行规模、期限、品种，应该根据企业的资金需要量来确定。过多会增加财务负担，过少则无法满足融资需求。并且，发行债券后企业总的资产负债率不能超过 50%，这是国际上公认的负债水平是否会导致企业发生财务危机的警戒线。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_14_0.png)


