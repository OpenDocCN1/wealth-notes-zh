    # 第 37 课：供应链融资法


    用一堆“皮包公司”轻松融到 N 多亿(落地)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    一诺老师说，信用值千金。这表明，商业信用是值钱的，当然，它又何止 “值千金”！正因如此，在商业供应链中好好利用商业信用本身，就是可以用来融资的，并且大有可为。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_28_0.png)


    这里的供应链，是指把产品送到消费者手里需要经过的供应商、制造商、分销商、零售商和最终用户连成一体的功能性网络结构。简单地说，就是你的业务合作单位。


    在商业贸易中，利用你的商业信用向业务合作单位融通资金，是一种普遍而必需的做法，最常见的是建立在交易基础上'
  - '[PAGE 29]


    的代销、除销、铺销等方式。传统商业贸易中对新商户进货时实行的“一批压一批”政策（第一次进货可以不付款或者只付一部分款，第二次进货时结清上一批货款，以此类推），实际上就是供应链融资的最基本形式。


    一诺老师教导我们，这里的供应链融资是指以商品形式提供的借贷活动。供应链融资之所以在企业间普遍存在，是因为有些商品的生产周期长、库存积压多、价格起伏大、周转缓慢、资金占用量大，需要供货方允许除销一部分，或者需要购买方预付一部分货款，才能降低交易风险。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_29_0.png)


    而实际上，这种做法对于自己来说，就是一种融资行为。无论是供货方除销给自己一部分，还是购买方预付一部分货款，实际上都会大大减轻你的资金压力，降低销售风险。尤其是一些商品的专用性强，或者是新产品，市场还不够了解，这时候这种作用尤其突出。


    300 元融资 500 万，签订《零风险+对赌》协议，实操请联系一诺老师助理'
  - '[PAGE 30]


    例如，在深圳发展银行推出的 CPS（短期融资票据化解决方案）业务中，就有一项叫“供应链金融”。它通过把供应链上的相关企业作为一个整体对待，根据交易中构成的链条关系和行业特点，具体设计融资方案，最终把资金注入到相对弱势的小企业中去，从而很好地解决了小企业的融资难问题。不仅如此，从社会效益角度看，还能解决整个供应链中的资金分配不平衡，提升整个供应链的企业群体竞争力。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_30_0.png)


    目前，深圳发展银行的这项业务已经渗透到各行各业，如全国钢材、汽车市场，南方的能源市场，北方的粮食市场等，并且引起了国外银行的高度关注。有关小企业不妨也关注一下这等好事，为解决融资难服务。


    # 循环抵押融资法实操案例(实战)


    香港船王包玉刚，创业时也是从向朋友借钱开始的。他先'
  - '[PAGE 31]


    借钱买了一条破船，然后用这条破船向银行抵押贷款，购买了第二条船。就是按照这种“循环抵押贷款”的办法，他的船队生意越做越大。


    然而，包玉刚生意的真正做大，是从供应链融资开始的。


    有一次，他在日本订购了一艘轮船，价格要 100 万元，可是他并没有这么多钱。怎么办？包玉刚在得到对方确认后，马上与日本的一家货运公司取得联系，并且签订了一份租船协议。


    一诺老师说，如果这项买船协议最终能变成现实，包玉刚就可以把这艘轮船顺利地租给日本这家公司，每年的租金收入是 75 万元。众所周知，一条新船的寿命是不止一年的，所以他每年都可以从中收到
    75 万元租金，一年半就能收回成本。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_31_0.png)


    可接下来的问题是，包玉刚手上并没有这么多钱。至少在这艘轮船租给日本货运公司之前，如果供货方不同意欠款，这 100 万元还是需要他自己垫支的。'
  - '[PAGE 32]


    于是，包玉刚又找到香港汇丰银行，详细说明了事情的来龙去脉，要求贷款100万元。不用说，银行虽然对他的业务有些了解，也对这个项目的赢利前景感到可行，但依然会从风险可控角度出发，提出需要包玉刚用什么来担保。


    包玉刚当然早就想到了这一点，于是拿出日本那家货运公司从银行开出的信用证明。银行了解到，这家公司信用很不错，于是同意了包玉刚的要求，满足了包玉刚的货款愿望。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_32_0.png)


    # 应付账款融资实操方案(干货)


    一诺老师认为，你作为购货方应该付给对方的货款，经对方同意可以延迟多长时间付款。实际上，这就是你对供货方的欠款，而这种欠款会节省你的资金占用，起到融资效果。


    当然，这时候从供货方角度看，则有部分资金被你占用了。所以在规范的商业交易中，供货方为了压缩应收账款，通常会'
  - '[PAGE 33]


    向你提出“2/10，n/30”这样的政策。“2/10”的意思是说，如果你（购货商）在10天以内结清货款，可以享受到2%的价格折扣；当然，如果超过10天付款就不能享受这个价格折扣了。同样的道理，“n/30”表示30天内结清货款可以享受n%的折扣。这样做的目的就是为了加快资金回笼，为此宁可在价格上做些让步。


    一诺老师发现，应付账款的信用期限，分为免费信用期、有代价的信用期、展期信用期三种。这也意味着你的应付账款融资最多可以达到多少天。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_33_0.png)


    以上面的“2/10”为例，这“10天”就是免费信用期，你在这个期限内付款能够享受到价格折扣；有代价的信用期，是指你可以和对方商量在10天之后付款（当然这时候你不能享受到价格折扣了），但最长不能超过多少天，例如30天，逾期就要支付罚息了。在这里，这“30天”就是有代价的信用期，“30天”之后就是展期信用期。容易看出，展期信用期实际上就是逾期'
  - '[PAGE 34]


    了，不但要支付罚息，还会破坏你的信用形象。


    # 商业票据融资实操方案(落地)


    一诺老师前面已经介绍过票据贴现融资，但商业票据融资与票据贴现完全是两码事。追根溯源，用于票据贴现的票据，就来自商业交易行为中企业签发出去的、到了付款时间必须无条件付款的一种有价证券。其实，与票据贴现相比，票据的背书转让更为普遍和简单易行。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_34_0.png)


    一诺老师发现，商业票据的特点是，无条件具有付款请求权和追索权，其权利和义务不存在任何原因。也就是说，谁持有这张票据，谁就拥有取得这张票据赋予的全部权利，不需要解释票据是怎么来的。也正因如此，才可以通过票据的背书转让来融资；同时，这也对商业票据融资提出了非常严格的规定，以防止某些信用不良企业滥用这种权利。'
  - '[PAGE 35]


    总体来看，允许发行商业票据融资的企业需要具备以下资格：信责良好，财力雄厚，拥有支付票据金额的可靠资金来源，并且保证届时能够无条件支付；不是新设立公司（新设立企业没有信用记录可查）；至少在某一各大银行能享受到最优惠利率的贷款(表明你的信誉可靠)；在银行有一定的信用额度可供使用；短期资金需求量大（所以才需要采用这种融资方式）。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_35_0.png)


    # 实夹一言语人，千金不易！


    —诺老师


    # 预收贷款融资实操方案(实用)


    一诺老师认为，预收货款实际上就是通常所说的定金或订金，说穿了就是向购货方预收部分或全部货款。从融资角度看，这实际上就是向购货方的借款，只不过到时候用来进行抵偿的是货物。并且，这种预收货款融资方式非常简单，只要你情我愿，收到对方的预付款后直接开个证明就行了。


    一诺老师说，当许多小企业每天愁着产品销不出去时，如'
  - '[PAGE 36]


    果有这等排队抢购的好事可能做梦也要笑醒了。


    且慢，要做到这一点其实很不容易。一般来说，能够顺利通过预收货款融资的条件只有两样：


    一是你的产品非常紧俏，以至於购货方乐意先付款；


    二是这种产品的生产周期长、专用性强、资金占用量大，所以需要向对方预收一部分货款作为定金，确保届时的购销合同能够顺利实现，同时也能为供货方解决一部分资金困难。


    一诺老师认为，如果你的资金占用量特别大，还需要向购货方分期预收货款，缓解资金矛盾。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_36_0.png)


    当然，这里还有一个前提，那就是供货方的信用良好，经济效益不错，生产计划和产品质量有保证。否则，对方又怎么敢随随便便就把货款先付给你呢？另外在实施预收货款融资时，应当及时与购货方签订业务合同，并且把预收货款的数量、利息、产品交货日期、违约责任等详细条款纳入其中，以法律形'
  - '[PAGE 37]


    式保证双方的权利和义务。


    # 分期付款融资实操方案(干货)


    分期付款融资和预收货款融资正好相反，对购销双方来说都能起到融资效果。由于买方征得卖方同意，把本来应该钱货两清的交易改成了分期付款，延后了付款时间，实际上就是把这部分延期付出的资金留在了自己手里，起到了融资效果。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_37_0.png)


    # 本节课程干货提炼


    (1)应付账款融资的最大好处是可以自己决定，既不要办什么手续，也不需要支付什么费用，并且一般情况下不需要承担资金成本。例如在上面的"2/10"中，究竟要不要这样的价格折扣完全可以自己做主。但缺点是仅仅相差几天时间就要失去这2%的现金折扣，这短期融资的代价也太高了。如果不是资金十分紧张，很多人是不肯放弃这种现金折扣的。'
  - '[PAGE 38]


    (2)从商业票据融资的资格要求可以看出，这种耻资方式的主要依据是企业信誉和实力，不需要担保，也没有最高限额限制；利率低于银行贷款而高于银行存款；票据到期必须按条件支付；期限较短，最短的只有几天，最长也不允许超过
    9 个月。说究了，这种票据很有点像 “欠条”，可以背书转让，但不能向银行贴现；最终能不能兑现，全凭发行人的信誉。


    (3)供应链融资是商品交易和商业信用同时进行的，所以居于一种自然性融资，不需要进行正规安排，也不需要办理正式融资手续，基本上没有什么限制条件。不但如此，融贷资本还非常低，有时候甚至完全可以白白占用对方的资金。像预收货款釉资这样，有时候能
    “得了便宜还卖”。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_38_0.png)


