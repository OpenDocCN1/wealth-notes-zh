    ## 第 35 课：旋转融资法


    ### 融资大师分分钟不用还钱(神套路)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    企业发行的债券，按转换方式不同，可以分为可转换企业债券、不可转换企业债券两大类。所谓可转换企业债券，是指在特定条件下将来可以转为普通股股权的债券；如果对方不想转换成股权也可以，这时候债券到期时你就必须要偿还本金。


    一诺老师说，这种债券既有债券性质，又有股票性质。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_16_0.png)


    一诺老师认为，并不是所有企业都可以发行可转换债券的。


    因为可转换债券具有股票性质，所以发行可转换债券的企业，除了必须具备发行债券的条件外，还必须具备可以发行股票的条件，具体要求如下：


    ### 可转换债券融资的基本条件(实用)


    1. 企业最近三年内的加权平均净资产利润率要达到 10%；能源、原材料、基础设施类企业可以略低，但也不能低于 7%。

    2. 在发行可转换债券后，企业的资产负债率不能超过 70%。

    3. 如果你是上市公司，发行可转换债券前的累计债券余额不能超过公司净资产 40%；本次可转换债券发行后，累计债券余额不能超过公司净资产的 80%。

    4. 可转换债券利率不能超过银行同期存款利率水平，发行额不低于 1 亿元人民币，债券期限为 3 年以上、5 年以内，债券发行 6 个月后才能转为公司股权。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_17_0.png)


    上面是从可转换债券的一般特性而言的。具体到我国，可转换债券更多侧重于融资，尤其是把它作为上市公司的再融资渠道来对待。这是因为我国的上市公司多是国有企业，在财政收支捉襟见肘、银行还贷压力日趋突出的情况下，上市公司对没有还本付息压力的股权融资特别喜好，也就在所难免了。


    这从一个侧面容易看出，可转换债券融资的一大好处是融资成本低。不但债券发行后持续期间的利息要低于银行同期存款利率，并且这种债券发行基本上是无本买卖；而当进入转股期后，如果能顺利转成股票，这时候的债权又变成了股权，实际上就出现了通常所说的变相“圈钱”。退一步说，即使不能顺利转股，至少也可以享受几年的超低息贷款啊。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_18_0.png)


    一诺老师说，也并非可转换债券融资就没有坏处。最大的问题是，这些债券发行后的融资如果全部投入生产，一旦在此期间股票价格达到转债提前回售条件，将会面临挤兑风险；除此以外就是，债券转换成股票后，公司的股权结构会发生变化，会稀释主要股东的持股比例，这也是企业老板不得不考虑的事。


    不过需要指出的是，与配股、增发新股价格只能低于股价相比，可转换债券的发行价格却是明显高于股价的（按国际惯例，一般要高出5%~20%），这表明这种溢价发行能够筹集到更多的资金，并且能相对缓解对原有股权的稀释。一诺老师说，如果小企业允许发行可转换债券，还是利大于弊的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_19_0.png)


    ### 本节课程干货提炼


    1. 可转换债券一般设有赎回和回售条款。当股票在一段时间里连续高于转股价格，并且达到一定幅度，发行人就必须要按照事先约定的价格，买下尚未转成公司股权的债券。相反，当股票在一段时间里连续低于转股价格，并达到一定幅度，可转换债券持有人便可以按照事先约定的价格，把债券卖给发行人。

    2. 由于发行可转换债券可能导致公司总股本迅速增加，所以有可能大大稀释原股东的权益和控制权。一般来说，股市低迷时发行可转换债券，这时候的转股价格也低，对原股东是不利的。这时候购买可转换债券尤其是未上市公司的可转换债券，看起来是有利的，其实风险也很大。


    这种风险表现为两点：


    - 可转换债券的利率比普通债券利率低。

    - 如果未来股票价格低于转股价格，也就无法实现转股目的了。

    3. 可转换债券的“可转换”，实际上表明你可以掌握调节公司股权比重和债务比重的主动权——如果你的股权比重过高，可以通过发行可转换债券来募集资金，回购股权，提高每股收益；


    一诺老师说，如果公司债务比重过大、短期债务过多，可以通过发行可转换债券来替换短期债务，推迟偿债期限的到来。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_20_0.png)


