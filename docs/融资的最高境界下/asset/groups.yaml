    # ## 本节课程干货提炼


    (1)商业承兑汇票在融资方面的作用，主要表现为：可以快速变现；与银行承兑汇票比，手续更方便；融资成本低，手续费支出少；有助于企业培养自身的良好商业信用。银行对此也比较欢迎，银行既能增加利息收入，还能在资金紧张时进行再贴现融资。'
  - '[PAGE 43]


    (2)商业承兑汇票可以背书转让，汇票债务人可以以保证人承担保证责任。


    商业承兑汇票如果遭到拒绝付款，持票人可以背书人、出票人以及汇票其他债务人行使追索权。


    (3)商业承兑汇票的贴现利率，通常是在银行再贴现利率基础上加几个百分点，具体加点幅度由中国人民银行确定。这样总体来看，商业承兑汇票的贴现率会高于银行承兑汇票，但不会超过同期银行贷款利率。


