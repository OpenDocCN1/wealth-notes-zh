    广义上的票据概念，是指经济往来中使用的单据和凭证，如证券、股票、汇票、支票、本票、运单、存款等各种有价证券和商业凭证。


    一诺老师发现，在我国，票据主要是指汇票、本票和支票，它们都反映了一定的债权债务关系，并且持票人或收款人可以在规定期限内，向出票人或指定付款人无条件支取确定的金额。


    票据具有流通性，并且它的主要功能就是通过票据流通呈现出来的。而票据流通，又主要体现为票据的转让。所以，小企业好好利用这一特性，可以方便地用这些票据进行融资。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_23_0.png)


    ## 有价融资的具体操作办法(实操)


    首先看自己是否拥有这样的票据，这些票据是否符合票据贴现的申办条件，其中主要是票据的来源要合法，并且具有真实合法的交易关系和债务关系；企业经营状况良好，具有到期还款能力；单张票据金额最多不超过
    1000 万元（一般这足够用了）。其次进入以下步骤：填写银行承兑汇票贴现申请书或商业承兑汇票贴现申请书；递交融资申请和票据，接受银行审查；审批通过后，办理融资手续；贷款到期时，要先把票款存入开户银行，由开户银行把款项从付款人账户划入融资银行账户。


    在我国，可以用来贴现的票据主要是汇票、本票和支票。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_24_0.png)


    汇票又可以分为银行汇票和商业汇票，两者的区别是：前者是银行签发的，后者是收款人或付款人签发的，有效期为出票之日起一个月。


    本票也叫期票，同样可以分为银行本票和商业本票，承诺见票时无条件支付确定金额。


    支票是收款人或付款人签发，委托银行办理转收转付确定金额的票据。支票又可以分为现金支票、转账支票和普通支票三种，现金支票只能提取现金，转账支票不能提取现金，而普通支票则既可以提取现金也可以转账。


    ## 服装厂融资实操案例(实战)


    一诺老师弟子黄老板，开了服装厂，妻子开了一家服装店，两家企业都是独立核算的，夫妻俩赚的钱各归各。服装厂因为要急于采购一批原材料，所以资金发生困难，需要融资
    300 万元。这时候黄老板就想到，赶快把服装店要的货提前发过去。


    就这样，服装店收到了服装厂的这 300 万元货物后，补签了一份购销合同，同时向银行申请开具承兑汇票。银行考察了服装店具体业务的合法性和真实性，在收取了服装店的汇票保证金和手续费后，给服装店开出了一张
    300 万元的承兑汇票。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_25_0.png)


    顺便说一句，银行收取汇票保证金的金额，通常是根据企业信誉确定的。如果你的企业信誉较好，保证金金额不会超过汇票金额的 30%;如果信誉较差，这个比例可能会达到
    60%。


    300 元融资 500 万,签订《零风险+对赌》协议，实操请联系一诺老师助理


    黄老板的服装厂在收到这张承兑汇票后，既可以到银行去进行票据贴现（这时候当然需要支付一定数额的贴现利息）获得资金，也可以通过票据背书转让给上游原材料供应商直接支付进货款。一般情况下，会采取后面这种做法，这样既直截了当，也能减少贴息支出，一举解决了原来的资金困难。


    一诺老师发现，票据贴现实际上就是向银行出售票据；从银行来说，则相当于向企业收购还没有到期的票据。企业能向银行办理贴现的票据，仅限于已经承兑、并且尚未到期的商业汇票，贴现期限不超过
    6 个月。在此基础上，贴现银行也可以持尚未到期的商业汇票向其他银行转贴现，或者向中国人民银行申请再贴现，称之为票据再贴现。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_26_0.png)


    ## 本节课程干货提炼


    - 与银行贷款相比，票据贴现的最大好处是简单直接。银行贷款往往要经过多道复杂审批程序，最终能不能贷到还知道。而票据贴现则可以做到立等可取。道理很简单，因为这些票据本来就是你的，换钱时当然就方便多了，只不过是把“明天”的钱放在“今天”用罢了。


    - 小企业融资时最头疼的是资本金不够，或者找不到合适的担保人，而票据贴现恰好能弥补这一缺陷，它不需担保，也和资本金大小无关。并且，票据期限融资的利率也低，只有
    3%左右，只有普通商业贷款的一半，所以可以作为首选考虑。


    - 银行之所以愿意办理票据贴现，最主要的因素是它利润丰厚，并且基本上没什么风险；可是对于小企业来说，由于企业经营风险较大，甚至许多企业根本没有信用记录，所以也不要以为票据贴现就一定是好办的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_27_0.png)


