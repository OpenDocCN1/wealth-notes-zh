    贷款额度一般为每人 2 万元左右，总额一般不超过 6 万元（女性创业或规模较大的小企业，贷款规模可扩大到 8 万元）；已经通过小额担保贷款扶持，并且已经全部归还贷款，创业比较成功，规模需要进一步扩大，并且能继续带动就业人数在
    5 人以上的，申请第二次贷款时，额度可以放宽到 30 万元。'
  - '[PAGE 274]


    贷款期限一般不超过 2 年；到期需要延长的，可以申请展期一次（展期一般不超过 1 年）。


    贷款利息按中国人民银行公布的贷款利率确定，但如果本身属于利润不高的微利项目，其利息可以由中央财政全额贴息（展期贷款不贴息），不用小企业自己负担。


    这样，对于小企业来说，实际上享受到的是免息贷款。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_274_0.png)


    那么，什么样的项目才算是微利项目呢？


    一诺老师发现，许多地方是这样规定的：除建筑业、娱乐 业以及销售不动产、转让土地使用权、广告业、房屋中介、 桑拿、按摩、网吧、氧吧等以外的项目，都属于微利项目，即
    这时候的再就业小额担保贷款利息可以由政府承担。


    具体是指：在社区、街道、工矿区等从事商业、餐馆、修 理等的个体经营项目，包括从事手工业、修理修配、图书借阅、 旅店、餐馆、洗染缝纫、复印打字、理发、小饭桌、小卖部、'
  - '[PAGE 275]


    搬家、家庭清洁卫生服务、初级卫生保健服务、婴幼儿看护和教育服务、残疾儿童教育训练和寄托服务、养老服务、病人看护、幼儿和学生接送服务、各种各样的钟点工。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_275_0.png)


    # 再就业融资的准备资料(实用)


    有营业执照，固定经营场所，30%以上的自有资金；从事的经营项目符合政府相关政策；具有还贷能力；


    有银行认可的资产做抵押，或者有单位和个人做担保；


    属于所在社区居委会常住户口。


    如果你是属于非正规就业劳动组织和再就业基地，需要申请这项贷款的，必须具有独立法人资格；


    有固定的生产经营场所，一定数额的固定资产和自有流动资金；安置的下岗失业人员要占职工总数的 50%以上；


    经营项目市场前景看好，具有较好的收益和还贷能力。'
  - '[PAGE 276]


    # **再就业融资的申请程序(实操)**


    一是持上述相关材料，到户口所在地社区人力资源和社会保障所提出申请；


    二是社区（街道）人力资源和社会保障所、区（市）人力资源和社会保障部门对你提交的材料进行审核，签署意见；


    三是人力资源和社会保障部门如果确认你的贷款担保额度、期限、风险防范措施、财政贴息符合规定，则向你和银行经办机构出具担保承诺书；四是银行向你发放贷款。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_276_0.png)


    人员担保，一般要求由党政机关、事业单位、国有垄断企业、金融企业等在编在职人员以工资收入做担保；财产担保主要是用房屋、店面做抵押，或用定期储蓄存单等做质押担保。


    通过反担保方式获取再就业小额担保贷款的，只要在规定的贷款额度和期限内，同样可以享受财政贴息。


    根据国家工业和信息化部的安排，2012年我国将进一步促'
  - '[PAGE 277]


    进担保机构对小企业的融资服务，力争2012年新增担保业务额1.5万亿元人民币，新增服务企业25万户。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_277_0.png)


    # ## 本节课程干货提炼


    (1)办理再就业小额贷款时，社会保障、财政、科技、工商、房产、公安交管等部门，免收一切行政事业性、服务性收费。


    (2)在法定年龄（男性16-60周岁，女性16-50周岁）内，自主创业或重新就业的人员。包括自谋职业的退伍军人，进行过就业失业登记的大专院校毕业生、农民、返乡创业农民工。


    (3)办理再就业小额担保贷款的机构，除了四大国有商业银行外，还包括各类城市商业银行、农村信用合作社、邮政储蓄银行、村镇银行等。


    了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。'
  - '[PAGE 278]


    # 第 70 课：学生融资法


    # 申请大学生创业资金实操步骤(干货)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》!


    一诺老师说，大学生创业小额贷款，是针对在校大学生或已经毕业、尚未就业的大学生自主创业的资金扶持政策之一。


    大学生创业小额贷款与再就业小额担保贷款，在性质和办理方式方面极其相似，都是需要参加人力资源和社会保障局组织的就业再就业政策培训（免费）的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_278_0.png)


    一诺老师说，这种培训无论对提高创业小额贷款的使用效益还是对大学生从事自主创业行为本身，都会有极大帮助。


