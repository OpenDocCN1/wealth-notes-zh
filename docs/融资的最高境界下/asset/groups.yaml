    由于 BOT 项目一般都是政府部门的，所以看起来这是为政府部门改善城市基础设施建设解决项目资金问题；甚至这种融资方式还常用在国与国之间，至少也是大中型企业之间，但具体到小企业来说，同样可以借鉴这种方式来解决资金融通问题。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_113_0.png)


    ## 契约融资实操案例(实战)


    如果你在乡下拥有一片山地，或一井厂房，荒废在那里，就可以通过这种方式来吸引资金。城里拥有几十万元自主创业资金的人很多，只要你的地方交通便利，无论创办茶园、电器加工厂还是农家乐休闲中心，都是很受这些城里创业者欢迎的。


    双方可以在合同中规定，项目创办成功后多少年内双方合作经营，对方所付出的投资，在合作经营期内，可以通过固定资产折旧和利润分配方式全部收回；


    合作经营期满，该项目的所有财产将无条件归你所有。这样，本来是一片荒废的土地或厂房，通过这种方式就搞活了。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_114_0.png)


    一诺老师发现，由政府主导的 BOT 项目融资，政府会像自主投资那样投入精力，并掌握自主权。


    只是因为运作这个项目的投资巨大，又不方便用财政预算或举债投资，才会选择这种融资方式。在大多数情况下，股本投资只占总投资金额的 1/4 至 1/3，其余的都要靠项目融资来解决。


    有鉴于此，小企业在借鉴这种项目融资方式时也要注意这一点，在要不要选择采用、如何具体实施 BOT 项目融资方面，要面面俱到，千万不要做随手掌柜。


    ## 本节课程干货提炼


    (1) BOT 项目融资采用的是风险共担方法，所以必须保证这个项目具有明确而稳定的收入来源。否则，到时候如果建设单位迟迟无法收回投资，就同样会把项目推迟移交给你，这样就变成“为人做嫁衣裳”了。当然，BOT
    项目融资风险不仅仅表现在经济方面，同样也表现在政治、法律、技术、融资以及其他不可抗拒的外力风险上。总体来看，这种做法风险较大。


    (2) BOT 项目的特许期限结束后，必须及时移交给主办方，并且这种移交是无条件的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_115_0.png)


    (3) BOT 项目融资的关键是特许经营权的获得。如果你是业主，要寻找合适的项目建设单位，那么这时候你把特许经营权授予谁，就显得非常重要。这不但关系到项目的回报率，甚至关系到整个项目的成功与否。


    ## 第 50 课：公私融资法


    ### 让政府为你担保的融资实操方案(神操作)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    PPP 项目融资通常被称为“公共私营合作制”，英文是 Public Private Partnership。具体地说是，政府与私人组织之间为了合作建设城市基础设施项目，或者为了提供某种公共物品和服务，以特许权协议为基础，彼此形成一种伙伴式合作关系；并且，通过签署合同来明确双方的权利和义务，以确保合作的顺利完成，最终使合作各方取得多赢效果。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_116_0.png)


    容易看出，PPP 项目融资主要出现在公共基础设施建设中，并且是为了弥补 BOT 项目融资模式不足产生的。它最典型的结构是政府部门通过政府采购形式，与中标单位组成特殊目的公司，然后签订特许合同，从而把这个项目交给特殊目的公司负责筹资、建设和经营。


    这个过程中，政府通常会与贷款银行达成协议，向银行承诺，政府将来会按照与特殊目的的公司签署的合同支付相关费用。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_117_0.png)


    一诺老师认为，有了这样的政府承诺后，特殊目的的公司将来在融资时会非常方便，甚至一路绿灯。那么，为什么政府在这里敢做出这样的承诺呢？原因就是它可以通过给予的特许合同，从将来的建成项目中获取长期收益。


    这里的所谓特殊目的的公司，一般是由中标的建筑单位、服务经营公司或对项目进行投资的第三方，共同组成的有限公司。


    PPP 项目融资模式最早是 1992 年在英国出现的，应该说发展历史并不是太长，但发展速度很快，发展到现在，全球各国几乎都在采用。并且从政府角度看，这种方式确实能节省资金（一般能节省
    17%-25%的经费），并且还能保质保量，加快进度，提高工作效率，帮助转变政府职能。


    一诺老师发现，具体到小企业来说，各种各样的民间资本在政府公共基础设施建设中发挥着越来越大的作用，业务触角已越来越广泛深入。


    一诺老师说，PPP 项目模式脱胎于 BOT 项目模式，但是又超越了 BOT 模式。究其原因在于，BOT 项目融资模式虽然应用最广泛也最成熟，但这种模式下的谈判过程太长，投标费用过高，这样就使得投资人没有了退路，并且给融资造成极大困难。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_118_0.png)


    而 PPP 项目融资模式，由于在融资方面由政府担保，而不是使用投资人的自有资金来安排项目，这样就使得在资金安排、调度方面要轻松得多了。


    一诺老师发现，PPP 项目融资能够把更多的民营资本吸引到政府项目中来，既提高了投资效率，又降低了投资风险，还能转变政府职能，减轻财政负担，这是政府求之不得的事。当然，在这个过程中，民营资本要能确保“有利可图”，尤其是在税收优惠、贷款担保、周边土地优先开发权的取得方面更为突出。所以，即使是小企业，参与积极性也很高。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_119_0.png)


    ## 公私融资成功的关键要素(干货)


    首先是政府部门的有力支持，其次是健全的法律法规制度，最后是专业化机构和人才的支撑，这几个方面可谓缺一不可。


    在这其中，小企业可以做的是，以某个项目的分支或组团形式参与特殊目的公司，从中分得一杯羹。这样做最简单快捷，也最适合自身规模，更容易取得成功。


    不用说，PPP 项目融资的风险也是显而易见的。


    所你必须充分了解整个项目的投资风险，并且知道哪些风险应该由自己来承担，哪些风险是应该并且可以转移给别人的。


    ## 商场保安创业公私融资案例(实战)


    一诺老师的弟子老许，在日本的一个远房外甥，给他介绍了一个项目，很适合他个人创业。说穿了就是来料加工，业务由那个外甥负责从日本提供过来，老许只要领个执照，招几个人，负责装配就行了。说起来这老许从单位内退已经五年了，一直在一家超市做保安。他过去一直想创业，自己当老板，“发大财”，苦于一直没有合适机会，也没有资金，所以只好憋在心里。但这个心思一直还在，可以说越来越强烈。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_120_0.png)


    机会来了，老许却一筹莫展。因为他根本无法筹集到初期投资所需的至少 30 万元启动资金。虽然家里也有 20 多万存款，但那是全家省吃俭用，一分分省下来给儿子娶媳妇用的，谁也不许动。为此，他已经几年没有在家喝小酒了。况且，这些钱一笔笔都存在老婆的借记卡上，都是一年期，轮流续存。


    不用说卡密码只有老婆知道，就是借他个胆，也不敢把这 300 元融资 500 万，签订《零风险+对赌》协议，实操请联系一诺老师助理


    笔“专款专用”给移作他用。都说这生意赚钱，但万一亏了呢？那岂不是害了儿子娶不上媳妇？这事可作大了！


    第二天上班时，实在憋不住的老许把这件事情告诉了同事老周。反正保安上班也没什么事，就是在电控值班室里坐着聊天、看报、喝茶，屁股坐累了，就出去转上一圈。


    老周对他说，你一生注定干不成大事：


    既然看准了这个项目“包赚不赔”那借钱是绝对划得来的。


    > ### 一诺老师

    >

    > **凡是可以破天下之伪，**

    >

    > **凡是可以破天下之虚！**


    可老许还是一口拒绝了。他说，他这辈子都没借过别人的钱，怎么的也不能“晚节不保”吧。不行，不行。两人无语。


    第三天上班时，老周兴冲冲地告诉老许说，办法有了，你就等着发财吧。于是，老周一五一十地告诉了老许具体办法。


    那天晚上老周回家后，吃晚饭时把老许的苦恼在饭桌上一说，儿子、儿媳妇马上就给他提了一大堆建议。说是现在专门有这样的机构，对这种个人创业可以实行“项目融资”。


    项目融资原来是一种国际性的中长期贷款，说穿了就是国内要上某个项目，可是缺乏资金，于是由某个国际机构给你融资，帮助你建成这个项目并正常运营起来。国外机构之所以愿意给你提供资金，关键不是看重主办单位的信誉和财力，而是这个项目本身是能确保赚钱的。只要这个项目“肯定能赚钱”，投资方现在对你进行投资，就不怕将来打水漂。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_122_0.png)


    而现在这一做法，已经引进国内。也就是说，老许可以找一找社会上的投融资机构或者效益好的企业，只要这个项目确实有利可图，就不愁找不到愿意提供这种项目融资的人。


    在这里，老许关键只要做一件事，就是找到一个担保方，担保这个代加工项目将来如果不能正常运营，收益不好，愿意承担风险。不用说，这里的这个角色，最理想的就是老许在日本的那个外甥，当然，其他人也是可以的。让外甥做担保的好处是，担保之外还可以给他增加点压力，让他多多支持老许的业务，这样就等于又增加了一道保险。


    项目融资主要有两种，一是无追索权，二是有追索权。


    无追索权的融资方式因为贷款风险大，现在已很少见；


    有追索权的融资，就是投资人除了依靠项目收益回收投资外，还可以在这个项目的资产上设定担保物权，并且要求与这个项目有关系的第三方提供各种担保。


    也就是说，这样一来贷款人的权益就有了可靠保障。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_123_0.png)


    不用说，这对双方都是有利的。对于对方来说，因为有了这种担保，能够更放心地和老许进行合作；而对于老许来说，因为提供了这种追索权，在寻找融资方面要容易得多。


    而实际上，老许的这种规模还太小。一些规模较大的小企业，如果符合以下条件，还可以争取到德国的 DEG 融资，这也 是一条很不错的融资渠道。


    DEG 是德国投资与开发有限公司的简称。


    该公司直属德国政府，主要任务就是为全球一些国家的私营企业提供帮助，我国也属于这个范围。但具体到融资企业来说，需要具备以下条件：符合环保要求；不属于政治敏感性行业；总资产大于
    1000 万马克（相当于 4250 万元人民币）；管理层拥有在这个行业中至少五年的经营经验；企业经营管理不受行政干预；企业在这两年中是连续赢利的，并且有留存利润，企业营业收入（净收入＋销售额）大于
    5%。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_124_0.png)


    如果同时符合以上条件，就有希望得到这项贷款了。


    容易看出，在这里，老许最终之所以能成功地运作这个项目，实际上正是借鉴了 PPP 项目融资的手法，虽然他自己并不一定清楚还有这个说法。


    在 PPP 项目融资中，有一条基本原则，那就是要求把投资风险转移给最有能力承担它的一方，也就是最有能力评估该风险的一方或最有能力控制该风险的一方。如果你自不量力，不但会力不从心，甚至会全盘皆输。


    不用说，政府部门之所以愿意选择 PPP 项目融资模式，实际上也有转移各种风险的用意在内。


    这些风险主要有政策风险、汇率风险、技术风险、财务风险、营运风险等；单单从政府部门转移给民营资本的风险看，还包括建设费用的增加风险、完工延迟风险、运营费用增加风险、维护及更新费用变动风险等。而所有这些，最终都是需要民营资本来承担的。


    一诺老师说弟子老许的远房外甥就充当了“政府”的角色，所以这时候的老许在创建小企业过程中，就没什么后顾之忧了。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_125_0.png)


    ## 本节课程干货提炼


    (1) PPP 项目融资模式的组织形式非常复杂，各方之间不可避免地会产生各种利益纠纷和责任分歧。所以在这个过程中，非常有必要有效化解这种分歧，要做到这一点，就要寻找一个好的合作伙伴。


    (2) PPP 项目融资的一大缺点是难以充分识别投资风险。因为你在这个过程中，很难得到第一手数据和资料，更不用说对这些资料进行系统分析和研究了。既然如此，再加上小企业的实力一般不强，单独采取
    PPP 项目融资就变得不切实际，必须要进行风险分担。


    (3) PPP 项目融资在我国还缺乏相应的法律法规，更没有标准的应用程序供参考，再加上一些腐败行为，小企业如果不能拙合在大企业下，要想接到大项目并从中获利，难度是相当大的，对此要有足够的思想准备。


