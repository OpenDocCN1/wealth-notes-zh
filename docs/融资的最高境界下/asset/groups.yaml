    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    一诺老师认为，资产重组的本意是对企业的资产分布状况进行重新组合、调整、配置，不用说，在这个过程中，必然会减少闲置资产、优化资产结构、提高资产利用率。这样，也就达到了用一部分资产变废为宝、融通资金的目的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_332_0.png)


    例如，对于大型企业来说，千方百计利用银行资产重组的形式，来控股、兼并、收购地方性商业银行，垃好是能控股银行，然后申请上市或在国内外开设分行，这在筹措巨额资金、促使企业发展方面的作用是巨大的。而这时候的控股银行，实

    '
  mdcn: '

    模效应，“一家有，大家有”。


    (4) 加盟商可以从特许商那里得到选址、培训、广告投入、技术转让、市场分析、资金融通等一系列支持，既节省了从头开始摸索的经历，又提高了成功率。


    总体看，特许经营融资可以收回的资金项目有：


    - 加盟费、特许权使用费、保证金、广告宣传和促销费用分摊、其他费用（如店铺设计施工费，培训费，设备租赁费，财务、业务培训费，意外保险费等）。正因如此，特许经营双方有必要一开始就交代清楚，避免以后发生不愉快。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_309_0.png)


    ## 本节课课程干货提炼


    - (1) 特许经营要求加盟商严格按“样板店”的规格办事，否则必定会因为各抒己见、自行一套而砸了牌子。一诺老师发现，麦当劳的特许经营就是因此造成严重危机的。如果真是这样，这种特许经营就会因小失大了。

    - (2) 特许经营的最大好处是可以大规模低成本扩张，这无论对特许商还是加盟商来说，都能达到相同的效果。一诺老师认为，特许经营融资对双方来说都是有好处的，可以从中互惠互利，节省开支。

    - (3) 从南京特许连锁加盟创业展览会上传出的信息表明，现阶段投资额在 5-10 万元，利润相对稳定的特许项目最受欢迎，单一品牌加盟费在 2 万元左右的也很受青睐，这正好暗合小企业的创业特点，可供参考。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_310_0.png)


