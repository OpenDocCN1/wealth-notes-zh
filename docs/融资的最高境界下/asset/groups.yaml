    ## 本节课程干货提炼


    - 企业控制权是指对企业的主要影响力，具体体现在进入董事会或监事会、参与重大决策、维护自身利益的权利。你吸收风险投资进入企业，必然会稀释股权，这时候仅仅考虑融资成本是不够的。许多老板当初创办企业的目的，是想有一份“自己的”事业和实业。如果到头来为人做嫁衣裳，这种融资行为就可能会违背初衷。


    - 风险投资看中的是你的企业，而不是你个人拥有什么专利技术。风险投资界流行的一句名言是：“宁投二流技术、一流团队的企业，不投一流技术、二流团队的企业。”所以，不要以为你拥有一项什么专业技术就能得到风险投资了，不是这样的。但显而易见，一个好的技术又是吸引风险投资的亮点。


    - 有经验的投资公司一开始也正是从技术角度来评估市场发展前景的，判断未来能否从中获取巨额利润回报，或投资风险大小。


    - 风险投资投资给你后，通常就会同时考虑什么时候、以什么方式来退出。尤其是在你这企业取得成功以后，千方百计会以公开上市、企业兼并等方式退出，通过产权流动变现。如果它们对自己的退出方式没有把握，是不会轻易给你投资的。


