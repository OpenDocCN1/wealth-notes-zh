    # 第78课：投基融资法


    # 投资基金融资的实操方案(有钱,更有前途)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》!


    投资基金是市场经济中一种重要的融资方式，是除银行贷款、股票债券发行外的又一条融资渠道。目前，全球基金市场总值与全球商品贸易总额相当，可见其受市场欢迎的程度。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_338_0.png)


    我国利用外资的一条重要渠道，就是来自境外投资基金。一诺老师认为，对于小企业来说，恰当利用各行各业的产业投资基金，是非常实用的融资渠道。


    产业投资基金是我国的特定称呼，具有很强的政府干预色彩，实际上就是国外的私募股权投资基金和风险投资基金。'
  - '[PAGE 339]


    一诺老师研究发现，今后的企业重组行为将会越来越普遍，其中最突出的问题是并购企业没钱，所以产业投资基金将会在这其中发挥越来越大的作用。


    # **投基融资的两种方式(实用)**


    一是基金本身随时可以赎回的封闭型基金。


    二是在二级市场上竞价转让的开放型基金。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_339_0.png)


    我国境内发行的第一只产业投资基金，是 2006 年 12 月 30 日发行的渤海产业投资基金。它采用私募发行方式，通过契约形式设立，总规模为 200 亿元人民币，存续期
    15 年。


    与国外的产业投资基金采用公司制形式相比，渤海产业投资基金采用的是契约形式，它的好处是更能满足当事人之间的灵活性需求。因为契约型产业投资基金不是法人，所以委托管理运作基金资产的管理公司能够拥有充分的管理运作权；并且'
  - '[PAGE 340]


    由于所有权和经营权彻底分离，对小企业、民营企业、高新技术企业的融资会更方便，并产生更大影响。


    会稽山是浙江绍兴的一个黄酒品牌，总经理傅祖康一直想把这家百年老店提升一个档次，改变过去不紧不慢的发展步伐。尤其是在 2008 年开始股份制改造后，这种心情更为迫切。


    引进一家战略投资者，既解决了融资问题，更增强了发展理念和推动力。就这样，他与中信产业投资基金一拍即合。


    第一件事就是把它原有的 800 多个黄酒品种压缩到 200 多个，主要是砍掉那些不怎么赚钱的品种，重新进行品牌定位，提升企业形象。一年间的主营业务利润就增长了一倍多。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_340_0.png)


    产业投资基金与银行贷款的区别在于，银行贷款投放偏爱那些成熟产业、成熟市场，有稳定的现金流，有充分的担保条件，而这恰恰是小企业缺少的。从这个角度看，也就能解释小企业为什么这么难于拿到银行贷款了。'
  - '[PAGE 341]


    一诺老师认为，而产业投资基金与银行贷款相反，它恰恰喜欢投资那些暂时遇到发展困难，但有着良好发展前景的企业，很好地迎合了小企业的特点。


    与此同时，产业投资基金进入小企业的方式也与银行贷款不同，它主要通过参股入股、参与管理等渠道进入企业。


    与银行贷款厌恶投资风险相比，产业投资基金没有那么严格，是允许自己“看花眼”的。


    产业投资基金与发行股票、债券的区别在于，吸引产业投资基金的手续简单、快捷，不需要向政府部门报送项目或企业材料，所以运作成本也低。


    一诺老师发现，许多小企业不要说不能发行股票了，就是连发行债券的条件都达不到；可是，这并不会妨碍它们吸引产业投资基金的进入，这样也就很好地解决了它们的融资需求。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_341_0.png)


