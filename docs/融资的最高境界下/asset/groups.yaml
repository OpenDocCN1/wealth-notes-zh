  - '[PAGE 16]


    # # 第 35 课：旋转融资法


    融资大师分分钟不用还钱(神套路)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    企业发行的债券，按转换方式不同，可以分为可转换企业债券、不可转换企业债券两大类。所谓可转换企业债券，是指在特定条件下将来可以转为普通股股权的债券；如果对方不想转换成股权也可以，这时候债券到期时你就必须要偿还本金。


    一诺老师说，这种债券既有债券性质，又有股票性质。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_16_0.png)


    一诺老师认为，并不是所有企业都可以发行可转换债券的。


    因为可转换债券具有股票性质，所以发行可转换债券的企业，除了必须具备发行债券的条件外，还必须具备可以发行股'
  - '[PAGE 17]


    票的条件，具体要求如下：


    # 可转换债券融资的基本条件(实用)


    +   (1)企业最近三年内的加权平均净资产利润率要达到 10%; 能源、原材料、基础设施类企业可以略低，但也不能低于 7%。


    +   (2)在发行可转换债券后，企业的资产负债率不能超过 70%。


    +   (3)如果你是上市公司，发行可转换债券前的累计债券余额不能超过公司净资产 40%;本次可转换债券发行后，累计债券余额不能超过公司净资产的 80%。


    +   (4)可转换债券利率不能超过银行同期存款利率水平，发行额不低于 1 亿元人民币，债券期限为 3 年以上、5 年以内，债券发行 6 个月后才能转为公司股权。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_17_0.png)


    上面是从可转换债券的一般特性而言的。具体到我国，可转换债券更多侧重于融资，尤其是把它作为上市公司的再融资'
  - '[PAGE 18]


    渠道来对待。这是因为我国的上市公司多是国有企业，在财政收支捉襟见肘、银行还贷压力日趋突出的情况下，上市公司对没有还本付息压力的股权融资特别喜好，也就在所难免了。


