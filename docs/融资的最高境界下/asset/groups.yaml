    ## 第 65 课：天使融资法


    ### 创业初期如何找到自动资金(落地)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    中小企业技术创新基金与本书前面风险投资中提到的“天使投资”概念有某些共通之处。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_240_0.png)


    一诺老师研究发现，所谓“天使投资”，是指一些自由投资者或非正式风险投资机构，对处于构思阶段的原创项目或初创企业进行的一次性前期投资。天使投资虽然也属于风险投资，可是它的资金主要来源于民间资本，投资门槛较低。他们只要觉得你这个项目有发展前途，就可能会愿意投入；可是这种状态下的企业对正规风险投资来说，可能就根本不感兴趣。


    一诺老师发现，天使投资人往往是你的朋友、亲戚或生意伙伴。因为他们对你的能力或过去的成功深信不疑，甚至崇拜你，所以在业务还没有开始之时，就愿意向你投入大笔的资金。在国外，一笔典型的天使投资往往只有几十万美元，是随后进入的风险投资的一个零头；但不用说，几十万美元的投资对我国小企业来说已是求之不得，甚至可以解决所有资金难题了。正因如此，天使投资也被称为小企业的“婴儿奶粉”。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_241_0.png)


    一诺老师认为，天使投资对还处于初创期的小企业来说风险很大；反过来也可以说，作为创业者的你，这时候如果能获得这种天使投资，则会大大规避投资失败的风险。确切地说不是规避风险，而是把投资失败的风险转移给了别人（天使投资人）。虽说没人愿意在创业之初就准备失败，但实际上这种失败的概率还是非常大的，所以你必须想到这一点。


    一诺老师要说的，这种天使投资不仅仅是个人或非正式风险投资机构，也包括政府在内。政府不是鼓励并倡导个人投资吗？那么，政府一定会有这样的专项资金来鼓励自主创业企业，其中当然又主要是小企业。其中之一就是中小企业技术创新基金。


    一诺老师说，这项基金的全称是科技型中小企业技术创新基金，顾名思义是经过国务院批准设立，专门用于支持科技型中小企业技术创新的政府专项基金。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_242_0.png)


    具体资助方式有：无偿拨款、贷款贴息、资本金投入等，无论哪种方式，对小企业的科技成果转化都会有巨大帮助。


    技术创新基金的运作完全按照市场运行规则来进行，主要资助对象是处于产业化初期（种子期和初创期）、技术含量高、市场前景广、投资风险较大、又不适合商业性资金进入的科技型中小企业项目，为促进企业产业化扩张、商业性资本介入起铺垫和引导作用。

