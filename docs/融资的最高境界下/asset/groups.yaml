    \n用 300 元最低融资 500 万，签订《零风险+对赌》协议！\n\n零风险：没有融到约定金额，你 1 分钱损失没有！\n\n对赌：在约定的期限内没融资\
    \ 500 万，倒赔你 3-300 万！\n\n更多商业经典请加微信：631088107\n\n# 第 68 课：专项融资法\n\n## 搞定中小企业成长专项发展资金(落地)\n\
    \n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\n跟一诺老师学习《融资的最高境界》！\n\n一诺老师发现，小企业在发展过程中，还有一项政策性融资可供选择，那就是中小企业发展专项资金。\n\
    \n一诺老师说，这是一项专门用于扶助小企业发展的中央财政预算资金，目的是为了促进小企业的结构调整、产业升级、综合利用和专业化发展，促进小企业与大企业的协作配套、技术进取和品牌建设，促进建设信用担保体系和市场开拓，但它又不属于科技型中小企业技术创新基金。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_262_0.png)\n\n中小企业发展专项资金是从 2004 年开始设立的，规模逐年扩大，支持的业务范围也逐步放宽，尤其是在\
    \ 2009 年国务院出台《关于进一步促进中小企业发展的若干意见》后，更是把它作为中央财政积极运用财税政策、大力支持中小企业尤其是小企业发展的重要举措。2011\
    \ 年，中央财政安排的这项资金规模高达 128.7 亿元，比上年增加 8.6%。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_263_0.png)\n\
    \n## 中小企业专项资金的申请方式(实操)\n\n一诺老师说，无偿资助、贷款贴息和资本金注入，申请时只能从中选择一种，不能兼而有之。\n\n无偿资助方式主要用于小企业以自有资金为主投资的固定资产建设、市场开拓、信用担保体系建设等项目，每个项目的资助额度一般不超过\
    \ 300 万元。\n\n贷款贴息方式主要用于小企业以银行贷款为主投资的固定资产建设，额度根据项目贷款数额和银行同期贷款利率来确定，每个项目贴息期限一般不超过\
    \ 2 年，额度不超过 300 万元。\n\n资本金注入方式主要用于小企业在信用担保体系建设方面，在无偿资助不太适合的背景下使用。\n\n那么，什么样的小企业能够申请到中小企业发展专项资金呢？一诺老师研究发现，需要符合以下条件：\n\
    \n具有独立的法人资格；财务管理制度健全；经济效益良好；会计信用、纳税信用和银行信用良好；申报项目符合专项资金的年度支持方向和重点。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_264_0.png)\n\
    \n## 固定资产建设项目专项资金申请方案（落地）\n\n- (1) 企业技术改造类项目：\n    - 产业结构调整项目，重点瞄准轻工、纺织、电子信息行业，支持新产品、新技术、新工艺，促进产业升级、产业转移的技术改造项目。\n"
