    顺便一提的是，打包放款对出口企业来说没什么风险，可是对于放款银行来说风险是很大的。因为归根到底，银行打包放款的依据（信用证）是一个独立文件，并不依附于贸易合同；并且，信用证业务只看单据不看货物，这种与具体进出口业务脱节的信用证是否可靠，谁也不敢保证。


    因为信用证对买卖双方的融资目的非常明确，所以经常有不具备贸易背景的融资信用证混杂其间。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_80_0.png)


    # 本节课干货提炼


    +   (1) 出口押汇和打包放款都是用信用证做抵押的，但在风险上有一定区别。


    出口押汇是根据开证银行开出的信用证条款发货的，将全300 元融资 500 万,签订《零风险+对赌》协议，实操请联系一诺老师助理'
  - '[PAGE 81]


    套单据交给银行做抵押，所以风险较低；而打包放款如果遇到卖方不能履约，银行的风险就出现了。


    (2)出口押汇和打包放款在银行贷款条件方面基本相同，并且贷款额度一般都是百分之七八十；所不同的是，出口押汇是在交单后发生的，打包放款是在交单前发生的，并且打包放款的贷款时间要长一些。


    (3)根据现行《境内外资银行外债管理办法》规定，出口押汇是可以结汇的，打包放款是不能结汇的。也就是说，采用出口押汇所得到的融资，你可以卖给指定银行，换取人民币在国内流通；而打包放款获得的资金，就只能以外币方式来使用


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_81_0.png)


    了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。'
  - '[PAGE 82]


