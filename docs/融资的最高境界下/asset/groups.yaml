    合伙经营的小企业，则由企业法人代表到户口所在地或经营场所所在的街道人力资源和社会保障所办理审核。


    +   (2)到区级人力资源和社会保障局办理审批手续。


    +   (3)到银行去办理相关贷款。若你是在校大学生，自主创业不但可以申请大学生创业小额贷款，还可以在 2 年内保留学籍。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_279_0.png)


    一诺老师说，申请大学生创业小额贷款时，按政策规定要有担保人，并且担保人还必须是政府机关、事业单位在编在职人员，月收入在 3500 元以上。每人的担保额度不能超过年收入的
    2 倍，最高不超过 20 万元。


    一诺老师认为，如果是大学生合伙创业的徽利项目，申请贷款时需要固定的经营场所和一定的自有资金，需要用本市 300 元融资 500 万,签订《零风险+对赌》协议，实操请联系一诺老师助理'
  - '[PAGE 280]


    常住户口的房产证、有价证券或动产不动产做抵押；如果是法人企业出面担保的，担保企业的年税后利润不低于5万元，并且拥有贷款申请额1.5倍以上的不动产。


    一诺老师说，如果你实在找不到担保人或资产抵押，只要 能通过评审组的认证，同样是可以获得这项贷款的；并且在获得创业贷款后，也是同样可以享受到税费减免、工商扶持政策等优惠措施的，如在办理工商执照时减免注册登记费等。


    大学生创业小额贷款可以享受政府贴息，并且许多地区实行的是全额贴息，也就是说不需要你个人承担任何贷款利息。


