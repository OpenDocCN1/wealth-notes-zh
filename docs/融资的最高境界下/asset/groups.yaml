    ## 第64课：借壳融资法


    ### 中小企业逆袭的快速通道(借尸还魂)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    一诺老师说，反向收购在我国俗称买壳上市。简单地说就是，小企业如果想通过正常渠道上市融资，可能比较困难，有时候根本不可能，因为上市公司的上市资格本身就是一种稀缺资源，不是谁都可以进去的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_230_0.png)


    而现在，由于部分上市公司业绩不良，在证券市场上缺乏进一步筹资的能力，所以你正可以借此机会收购该公司的股份，然后控制该公司，再由该公司反向收购你的资产和业务，从而成为该上市公司的子公司。这样，你原来公司的股东一般能获得该上市公司70%-90%的股权。


    一诺老师认为，买壳上市在全球属于正常并购形式，是上市融资的一条捷径。就目前而言，买壳上市与正常途径上市的公司数量相当，差不多一对一半。


    不用说，这种以融资为目的的反向收购，也称融资性反向收购，具体包括反向收购和私募融资两部分。这一模式从2003年创立以来，已经成为我国企业赴境外上市融资的优选渠道，也被美国华尔街普遍关注和认可。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_231_0.png)


    在过去，华尔街上的投资银行大亨是对它嗤之以鼻的，现在它们也在起劲地从事这项中介业务。为什么？


    因为它有一个最大好处：那就是操作时间短、上市成功有保障、费用还低（一般只要50万-70万美元）。


    如果进一步问，要是你想通过这种方式上市融资，具体怎么做呢？一诺老师认为，要分为两大步：


    (1) 买壳交易，一诺老师认为，就是要购买某上市公司（壳资源）的股份，达到相对或绝对控股地步。


    (2) 资产交易，就是在你控股该上市公司后，再由该上市公司出面收购你的这家公司，从而控制非上市公司的资产和运营。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_232_0.png)


    ## 海外融资的六大步骤(实操)


    ### 一是正确选择中介公司


    一诺老师认为，你不可能非常熟悉国外的资本市场，所以需要借助于对这方面熟悉并且具有广泛人脉关系的中介公司，来弥补这条短腿。


    一诺老师说，中介公司的主要作用，就是帮助你制订买壳上市策略，在国外市场寻找壳资源、证券经纪公司、会计师事务所、律师行等。从类型、实力、信誉上看，这些中介公司相差悬殊，所以一定要谨慎考察才能确定，并且在合同中要明确规定双方的权利和义务，避免受制于人。


    ### 二是科学选择壳公司


    这里的基本诀窍是，要选一个“干净”的壳资源，具体是指没有任何债务，没有任何法律纠纷，经营历史清楚，上市资格保持完整，也没有其他遗留问题。在此基础上，壳资源要有足够的“散户股份”。


    这样，以后壳资源到手后，交易才会活跃。


    虽然这样的壳资源价格可能会贵一些，但由于你买的是“净菜”所以总的来看还是划算的。


    反过来，如果那些壳资源太便宜，你倒要警惕了。


    俗话说“好货不便宜，便宜没好货”，用在这里也合适。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_233_0.png)


    如果这种壳资源的各项申报、审计工作都没能如期完成，你面对的就是一幢“烂尾楼”，即使买下来了，将来清理和善后也会非常头疼，甚至会变得不可能。


    一诺老师认为，如果这个壳资源以后要在股市上重新上市，需要花费太多的精力重新向当地证券交易管理部门登记、申报，这样，原来买壳上市的优势就可能会变得荡然无存。


    买壳上市时双方都还会委派律师和会计师事务所进行审慎性调查，一诺老师说，这时候你应该向对方索取法律证明书，证明这家壳公司是可以正常交易和增发股票的，以绝后患。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_234_0.png)


    ### 三是壳公司的价格要合理


    壳公司按价格从高到低可以分为以下四种类型：


    - (1) 定期向证监委提出申报，并且至少有一个做市商在买卖该股票。你在收购这种公司后，3个月左右就能顺利上市交易。

    - (2) 定期向证监委提出申报，但没有做市商买卖股票。你在收购这种公司后，一般4-6个月能顺利上市交易。

    - (3) 没有向证监会提出申报，可是有做市商在买卖股票。收购这种公司后，一般需要6个月才能顺利上市交易。

    - (4) 没有向证监委提出申报，也没有交易的股票。收购这种公司后，一般需要 9-12 个月才能上市交易。


    ### 四是看壳公司的经营性质


    壳公司仅仅“干净”、价格合理还不够，还要看经营性质，这又可以分为以下几类：


    - (1) 破产类。如果是被法院判决已经破产了的壳公司，根据破产法规定，这样的公司可以免除所有债务和诉讼，表明后面是很“干净”的。它吸引你的价值只是上市资格，其他什么都没有，所以很理想。

    - (2) 停业类。最典型的是一些资源类公司，资源开采完了就会处于暂时停业状态，但因为没有破产，所以债务和法律责任也都还在，既不是资不抵债，也没有丧失上市资格。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_235_0.png)


    - (3) “空白支票”类。当初这些公司上市时就向证券监管部门说明，自己不经营任何业务，而是专门等人来收购的。有点类似于我国国内的“代开发票”公司。例如在美国，这样的壳公司数量虽然没有以前多了，但依然是存在的。

    - (4) 分拆型。就是一家上市公司把自己的一部分业务分拆出来进行上市，这样，原来的这家上市公司就成了壳公司。由于这家壳公司仍然在运营，所以可能会存在遗留债务和诉讼。

    - (5) “504 壳”和“419 壳”。“504 壳”是指根据美国证券法规定，直接利用网络公开发行股票，资金规模一般在 500 万美元以下。“419 壳”有点类似于前面提到的“空白支票”类股票。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_236_0.png)


    ### 五是对你的公司进行重组改造


    一诺老师认为，不同类型的壳公司千差万别，既为你提供了多种选择，在公司重组和离岸公司建立方面也各不相同。当你敲定了壳公司以后，就要对你原来的小企业进行重组，明晰产权、减少关联、优化配置，以符合国外证券法规的要求。


    这时最常用的一种办法是，在英属维尔京群岛、开曼群岛、百慕大等地区设立离岸公司，一方面规避了我国相关法律的限制，另一方面为下一步进入国外资本市场创造了条件。但不要耍小聪明：不要转移资产，不要违反我国和目标国的政策法律，否则只会两头不讨巧，导致最终目的无法得逞。


    ### 六是牢记言多必失


    一诺老师说，反向收购有许多工作要做，你的一举一动都在众目睽睽之下，切记不要信口开河、朝令夕改，甚至也不能过于夸张。因为你面对的是国外投资者，所以一定要把握好分寸，尤其是一定要诚实。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_237_0.png)


    例如，中国概念股“斯凯网络”创业之初，连续好几个月发不出工资来，这曾经被该公司首席执行官当做励志故事来宣扬。可是在2011年全球做空中国行动中，做空机构“香橼研究”就是抓住这一点不放。因为其中抹去了时间背景，所以那些看不懂中文的国外投资者根本搞不清这是什么时候的事，结果纷纷以为这是发生在现在的事情，从而对该公司产生了莫大的怀疑，导致股价发生暴跌，你说冤不冤哪？


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_238_0.png)


    ## 本节课干货提炼


    - (1) 一诺老师说，不论借壳上市还是买壳上市，挑选理想的壳公司是最重要的。它通常具有这样一些特征：所处行业大多为夕阳行业；主营业务增长缓慢，赢利能力差，甚至亏损；股权结构比较单一（有助于对其进行收购控股）。

    - (2) 利用海外注册地设立离岸公司，是赴国外反向收购的重要一环，通常称之为造壳上市。例如，开曼群岛的金融业非常发达，可以为你提供各种便利服务，如完全保密、不记名、无须申报年报、免税、没有外汇管制，既可以到北美上市也可以到香港上市等。不过也正因如此，北美国家对在这些“避税天堂”注册，然后再去上市的公司有点不太信任。

    - (3) 买壳上市虽然靠的主要是钱，但也不是有钱就能使鬼推磨。要想反向收购成功，你的企业必须具有吸引力，具体地说就是要具备成长性，其衡量标准是：如果是传统产业，年增长率要达到
    20%以上，如果是非传统产业要达到 30%以上。同时，年税后利润要在 100 万美元以上，并且要有一个好的管理团队。

    - (4) 与买壳上市相近的一个概念叫借壳上市。它们的共同特点是，都是对上市公司的壳资源进行配置，实现间接上市的目的。而区别在于，借壳上市是已经拥有对这家上市公司的控制权，买壳上市是还没有拥有这种控制权（所以要“买”）。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_239_0.png)


