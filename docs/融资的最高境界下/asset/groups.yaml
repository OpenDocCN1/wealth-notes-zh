    # 第 71 课：皇粮融资法


    # 200 多种政策性融资的实操方案(落地)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    一诺老师说，在各种政策性融资渠道中，很重要的一个部分是各种各样的政府性基金。中央政府尤其是省级政府在促进小企业发展方面推出了许多具体政策，好好利用这些政策为企业争取资金，不失为一块块
    “从天上掉下来的馅饼”。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_286_0.png)


    一诺老师说，所谓政府性基金，是指各级人民政府及其所属部门向公民、法人和其他组织无偿征收的具有专项用途的财政资金。政府性基金属于非税收入，全额纳入财政预算，实行收支两条线管理。作为小企业来说，既可能是各项基金的征收'
  - '[PAGE 287]


    对象，但更可以成为各项基金的使用对象。


    政府性基金支持小企业的发展，可以说是全方位、立体化的，许多项目可能许多小企业连想都没想过。在这方面，多多学习相关政策、了解有关行情，会便于得到相关资助。就连正常的小企业上市、发行债券都是可以财政补助的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_287_0.png)


    # 皇粮融资案例(实战)


    一诺老师说，在北京市海淀区，凡是新设立或者新迁入海淀区，并且工商注册和税务登记都在海淀区的股权投资金业，在正式开展股权投资业务并完成第一笔投资业务后，就可以向海淀区政府申请一次性资金补助。


    一诺老师说在安徽，小企业改制成功、与保荐机构签订上市辅导协议、在安徽证监局办理上市辅导备案登记的小企业，都可以从省政府和同级财政分别得到 100 万元的补助；在中小'
  md: "\n## 再担保业务补助专项资金(落地)\n\n(1) 担保业务补助项目。主要是对符合条件的信用担保机构所开展的小企业融资担保业务给予补助。\n\n\
    (2) 再担保业务补助项目。主要是对符合条件的信用再担保机构所开展的、为担保机构提供再担保业务给予补助。\n\n(3) 保费补助项目。主要是在提高其他费用标准的背景下，对担保机构开展的低收费融资担保业务给予保费补助。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_266_0.png)\n\n## 提高素质活动的补助专项资金(实用)\n\
    \n(1) 提升企业管理水平的补助项目。重点支持小企业在办公、财务、库存、生产过程控制、销售等方面，采用信息管理系统、提高企业管理水平的项目。\n\n(2)\
    \ 提升企业研发能力的补助项目。重点支持小企业的技术研发部门开发和购置相关设备、仪器、软件，以及为适应技术研发所进行的场地、设施改造项目。\n\n(3) 企业专利申请补助项目。重点支持小企业开展专利开发而申请的项目补助。\n\
    \n## 开拓国际市场专项资金(落地)\n\n主要是为了提高小企业在国际市场的竞争力，促进外贸发展方式转变，以及用于补贴参加国际中小企业博览会的展位费。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_267_0.png)\n\n## 公共服务体系建设方面的专项资金(实用)\n\
    \n中小企业发展专项资金的申报和立项每年进行一次，申报时间为每年的上半年，申报的项目内容每年都会略有不同。\n\n小企业申请这项发展资金的一般程序是：\n\n\
    - (1) 向有关部门提出申请，通常是省级财政部门和省级中小企业管理部门，需要提供以下资料：公司营业执照副本及章程，生产经营情况或业务情况；上年度的会计报表和审计报告复印件。\n\
    - (2) 上述部门对申请企业的资格条件和相关资料进行审核，组织相关技术、财务、市场方面的专家进行评审，然后报送国家财政部、工业和信息化部。\n- (3)\
    \ 国家工业和信息化部会同财政部，对各地上报的申请书和项目进行审核，提出项目计划，确定项目资金支持方式，并且把预算指标下达到省级财政部门。\n- (4) 企业在收到专项资金后，进行相关的财务处理，同时接受省级中小企业管理部门的使用管理和监督。\n\
    - (5) 如果这项资金是用于固定资产投资项目的，需要在项目建成后一个月内，向省级财政部门和中小企业管理部门报送项目建设情况和专项资金使用情况。\n\n>\
    \ **信用难得易失，费十年功夫积累的信用往往会由于一时的言行而失掉！**  \n> —诺老师\n\n如果是用于信用担保体系建设和市场开拓等方面的，要求在年前向这两个部门上报资金使用情况。\n\
    \n一诺老师认为，如果是用于项目建设，可是项目又不能如期完成，需要提前向上述部门书面解释不能按时完成的理由以及预计完成的时间。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_269_0.png)\n\
    \n### 本节课程干货提炼\n\n(1) 国家工业和信息化部把 2012 年定为“中小企业服务年”，主题是“服务企业、助力成长”，重点支持创新型、创业型、劳动密集型中小企业尤其是小企业的发展。\n\
    \n(2) 中小企业发展专项资金堪称小企业“哺乳期”最缺的营养品。这项资金的推出，与政府转变认识误区有极大关系。\n\n过去不少地方政府认为大中型企业才能为当地经济发展锦上添花，所以对中小型企业一度不予扶持或扶持不足，任其自生自灭，这是小企业步履维艰的政策因素之一。\n\
    \n(3) 中小企业发展专项资金除了中央财政安排预算外，各省、市、县也都有相应的财政预算安排。这一块预算数额非常巨大。\n\n例如，福建省厦门市翔安区用于这方面的资金安排就高达每年\
    \ 2000 万元，通过现金奖励、资金扶持、费用补贴等方式，来全力支持小企业的经营发展。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_270_0.png)\n\
    \n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\n用 300 元最低融资 500 万，签订《零风险+对赌》协议！\n\
    \n零风险：没有融到约定金额，你 1 分钱损失没有！\n\n对赌：在约定的期限内没融资 500 万,倒赔你 3-300 万!\n\n想要实操，请马上联系一诺老师官方助理老师微信！\n\
    \n# 第69课：就业融资法\n\n## 再就业名义融资百万的操作流程(落地)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\
    \n跟一诺老师学习《融资的最高境界》！\n\n一诺老师说，再就业小额担保贷款，顾名思义是政府对失业人员再就业推出的一项鼓励政策。具体地说是，下岗失业人员自谋职业、自主创业、组织起来就业，由于难以获得银行贷款，所以可以通过政府设立的这项再就业担保基金的承诺担保，向银行申请专项再就业小额贷款。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_272_0.png)\n\n一诺老师说，再就业小额担保贷款是银行发给你的，再就业担保基金在这其中所起的只是担保作用。\n\
    \n根据 2002 年国务院颁发的《关于进一步做好下岗失业人员再就业工作的通知》(中发【2002】12 号)，对于下岗失业人员从事个体经营（国家限制的行业除外）的，3\
    \ 年以内免征营业税、城市维护建设税、教育费附加、所得税，并且免收属于管理类、登记类、证照类的所有各项行政事业性收费。\n\n与此同时，各省、地级以上城市都要建立下岗失业人员贷款担保基金，所需资金主要由政府财政筹集，具体担保机构由当地政府确定。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_273_0.png)\n\n一诺老师的意思是，如果是由下岗失业人员创办的小企业，就可以向当地下岗失业人员贷款担保基金申请小额贷款。\n\
    \n贷款额度一般为每人 2 万元左右，总额一般不超过 6 万元（女性创业或规模较大的小企业，贷款规模可扩大到 8 万元）；已经通过小额担保贷款扶持，并且已经全部归还贷款，创业比较成功，规模需要进一步扩大，并且能继续带动就业人数在\
    \ 5 人以上的，申请第二次贷款时，额度可以放宽到 30 万元。\n\n贷款期限一般不超过 2 年；到期需要延长的，可以申请展期一次（展期一般不超过 1 年）。\n\
    \n贷款利息按中国人民银行公布的贷款利率确定，但如果本身属于利润不高的微利项目，其利息可以由中央财政全额贴息（展期贷款不贴息），不用小企业自己负担。\n\n\
    这样，对于小企业来说，实际上享受到的是免息贷款。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_274_0.png)\n\
    \n那么，什么样的项目才算是微利项目呢？\n\n一诺老师发现，许多地方是这样规定的：除建筑业、娱乐业以及销售不动产、转让土地使用权、广告业、房屋中介、桑拿、按摩、网吧、氧吧等以外的项目，都属于微利项目，即这时候的再就业小额担保贷款利息可以由政府承担。\n\
    \n具体是指：在社区、街道、工矿区等从事商业、餐馆、修理等的个体经营项目，包括从事手工业、修理修配、图书借阅、旅店、餐馆、洗染缝纫、复印打字、理发、小饭桌、小卖部、搬家、家庭清洁卫生服务、初级卫生保健服务、婴幼儿看护和教育服务、残疾儿童教育训练和寄托服务、养老服务、病人看护、幼儿和学生接送服务、各种各样的钟点工。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_275_0.png)\n\n## 再就业融资的准备资料(实用)\n\n\
    有营业执照，固定经营场所，30%以上的自有资金；从事的经营项目符合政府相关政策；具有还贷能力；有银行认可的资产做抵押，或者有单位和个人做担保；属于所在社区居委会常住户口。\n\
    \n如果你是属于非正规就业劳动组织和再就业基地，需要申请这项贷款的，必须具有独立法人资格；有固定的生产经营场所，一定数额的固定资产和自有流动资金；安置的下岗失业人员要占职工总数的\
    \ 50%以上；经营项目市场前景看好，具有较好的收益和还贷能力。\n\n## 再就业融资的申请程序(实操)\n\n一是持上述相关材料，到户口所在地社区人力资源和社会保障所提出申请；\n\
    \n二是社区（街道）人力资源和社会保障所、区（市）人力资源和社会保障部门对你提交的材料进行审核，签署意见；\n\n三是人力资源和社会保障部门如果确认你的贷款担保额度、期限、风险防范措施、财政贴息符合规定，则向你和银行经办机构出具担保承诺书；\n\
    \n四是银行向你发放贷款。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_276_0.png)\n\n人员担保，一般要求由党政机关、事业单位、国有垄断企业、金融企业等在编在职人员以工资收入做担保；财产担保主要是用房屋、店面做抵押，或用定期储蓄存单等做质押担保。\n\
    \n通过反担保方式获取再就业小额担保贷款的，只要在规定的贷款额度和期限内，同样可以享受财政贴息。\n\n根据国家工业和信息化部的安排，2012年我国将进一步促进担保机构对小企业的融资服务，力争2012年新增担保业务额1.5万亿元人民币，新增服务企业25万户。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_277_0.png)\n\n### 本节课程干货提炼\n\n(1) 办理再就业小额贷款时，社会保障、财政、科技、工商、房产、公安交管等部门，免收一切行政事业性、服务性收费。\n\
    \n(2) 在法定年龄（男性16-60周岁，女性16-50周岁）内，自主创业或重新就业的人员。包括自谋职业的退伍军人，进行过就业失业登记的大专院校毕业生、农民、返乡创业农民工。\n\
    \n(3) 办理再就业小额担保贷款的机构，除了四大国有商业银行外，还包括各类城市商业银行、农村信用合作社、邮政储蓄银行、村镇银行等。\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\
    \n# 第 70 课：学生融资法\n\n## 申请大学生创业资金实操步骤(干货)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\
    \n跟一诺老师学习《融资的最高境界》!\n\n一诺老师说，大学生创业小额贷款，是针对在校大学生或已经毕业、尚未就业的大学生自主创业的资金扶持政策之一。\n\n\
    大学生创业小额贷款与再就业小额担保贷款，在性质和办理方式方面极其相似，都是需要参加人力资源和社会保障局组织的就业再就业政策培训（免费）的。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_278_0.png)\n\
    \n一诺老师说，这种培训无论对提高创业小额贷款的使用效益还是对大学生从事自主创业行为本身，都会有极大帮助。\n\n怎样办理大学生创业小额贷款呢？一诺老师总结了步骤：\n\
    \n## 大学生创业融资实操步骤(落地)\n\n- (1) 大学毕业证、失业证书、营业执照、税务登记证、房屋产权证或担保合同，到户籍地社会保障所办理申请。合伙经营的小企业，则由企业法人代表到户口所在地或经营场所所在的街道人力资源和社会保障所办理审核。\n\
    - (2) 到区级人力资源和社会保障局办理审批手续。\n- (3) 到银行去办理相关贷款。若你是在校大学生，自主创业不但可以申请大学生创业小额贷款，还可以在\
    \ 2 年内保留学籍。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_279_0.png)\n\n一诺老师说，申请大学生创业小额贷款时，按政策规定要有担保人，并且担保人还必须是政府机关、事业单位在编在职人员，月收入在\
    \ 3500 元以上。每人的担保额度不能超过年收入的 2 倍，最高不超过 20 万元。\n\n一诺老师认为，如果是大学生合伙创业的徽利项目，申请贷款时需要固定的经营场所和一定的自有资金，需要用本市常住户口的房产证、有价证券或动产不动产做抵押；如果是法人企业出面担保的，担保企业的年税后利润不低于5万元，并且拥有贷款申请额1.5倍以上的不动产。\n\
    \n一诺老师说，如果你实在找不到担保人或资产抵押，只要 能通过评审组的认证，同样是可以获得这项贷款的；并且在获得创业贷款后，也是同样可以享受到税费减免、工商扶持政策等优惠措施的，如在办理工商执照时减免注册登记费等。\n\
    \n大学生创业小额贷款可以享受政府贴息，并且许多地区实行的是全额贴息，也就是说不需要你个人承担任何贷款利息。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_280_0.png)\n\
    \n## 大学生创业融资案例(实战)\n\n在重庆，大学生创业小额贷款的最高额度是每人5万元，特别好的项目可以扩大到8万元；合伙经营、联合经营的贷款额度按人均5万元发放，但总额一般不超过100万元，特别好的项目可放宽到\
    \ 200 万元。\n\n一诺老师说，贷款额度在 5 万元以内、贷款期限不超过 1 年的，结清贷款本息后还可以申请续贷 1 年，第 2 年照样可以享受财政全额贴息。以贷款\
    \ 5 万元计算，一年可享受到的财政返回贴息大约为 4155 元。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_281_0.png)\n\
    \n出生在四川渠县的农家孩子蒋朋，2008 年考入重庆邮电大学移通学院。在中学时就有过创业经历的他，进入大学后依然坚持着梦想。上大学后的第一个月，他针对许多新生不懂电脑维护的背景，凭\"\
    免费维修\"的承诺，一个月内就销售了 200 台电脑，获得了创业的第一桶金。读大二时，有位朋友想创办一家广告公司，邀请蒋朋一起加入。蒋朋凭他过去的生意眼光，觉得这个主意好，正合他的创业之意，便一口答应了。\n\
    \n广告公司成立后，学校老师不但积极帮助他建立人脉关系，而且还把学校的部分广告业务交给他做。\n\n两年后的 2011 年，该公司就接到了校外 5 家房地产公司的广告业务，2012\
    \ 年营业额预计超过 100 万元。在读大学的四年中，蒋朋的所有学费和生活费都是他自己挣来的。\n\n由于公司承接的业务基本上属于广告制作，所以很快便遇到了发展瓶颈。这时候，他听从创业学院张衍学老师的建议，创办了另一家以创意设计为主的广告公司，由单纯从事广告制作向创意广告方向发展，顺利拿到了重庆市政府无偿资助的\
    \ 3 万元微型企业创业扶持资金。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_282_0.png)\n\n>\
    \ **惟诚可以破天下之伪，惟实可以破天下之虚！**\n> ——一诺老师\n\n现在，重庆邮电大学移通学院的大学生创业搞得如火如荼。\n\n1 万多平方米的钓鱼城创意产业基地、教育培训园、微型企业一条街，5\
    \ 千多平方米的多功能创业大厦，吸引了学生创业团队 36 个，涌现出一大批像蒋朋、辛叶雯、张琦、封云钊这样的大学生创业典型。\n\n一诺老师发现，该院创办的专门指导大学生创业的创业学院，共投入80万元创业专项扶持基金，有针对性地开设创业培训和实训课程，搭建了包括有创业意向学生、校内外创业导师、风险投资人等在内的“创业共同体”，培育了全校学生的创业意识，这在全国高校中堪称是一大创举。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_283_0.png)\n\n## 大学生创业融资的三大关键(干货)\n\
    \n- (1) 必须有固定住所或营业场所，否则就很难证明你在经营。\n- (2) 要有营业执照或经营许可证，并已启动。\n- (3) 一定要有一个品利前景行好的项目，所投项目具备一定的自有资金，具有还本付息能力（这是最重要的，因为归根到底所有贷款毅终都是衙要还本付息的，银行极看重这一点了）。\n\
    \n### 本节课程干货提炼\n\n(1) 大学生创业小额贷款的申请对象是大专以上学历的在校学生，或大学毕业后6个月以上尚未就业、并且在当地人力源和社会保障部门办理了失业登记。申请贷款项目的，必须是已经启动正在运行中的企业。也就是说，如果想用这笔贷款作为项目启动资金是不可以的。\n\
    \n(2) 大学生创业小额贷款的基本要求和办理程序，与再就业小额担保贷款相似。所以，如果你不知道当地有没有这样的贷款办理机构，可以到再就业小额担保贷款机构去咨询，许多地方这两项业务是一起受理的。\n\
    \n(3) 大学生创业小额贷款的申请项目，与再就业小额担保贷款一样，同样必须是微利项目；微利项目的具体标准一诺老师前面已经说过了。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_284_0.png)\n\
    \n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\n用 300 元最低融资 500 万，签订《零风险+对赌》协议！\n\
    \n**零风险**：没有融到约定金额，你 1 分钱损失没有！\n\n**对赌**：在约定的期限内没融资 500 万,倒赔你 3-300 万!\n\n想要实操，请马上联系一诺老师官方助理老师微信！\n\
    \n# 第 71 课：皇粮融资法\n\n## 200 多种政策性融资的实操方案(落地)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\
    \n跟一诺老师学习《融资的最高境界》！\n\n一诺老师说，在各种政策性融资渠道中，很重要的一个部分是各种各样的政府性基金。中央政府尤其是省级政府在促进小企业发展方面推出了许多具体政策，好好利用这些政策为企业争取资金，不失为一块块\
    \ “从天上掉下来的馅饼”。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_286_0.png)\n\n一诺老师说，所谓政府性基金，是指各级人民政府及其所属部门向公民、法人和其他组织无偿征收的具有专项用途的财政资金。政府性基金属于非税收入，全额纳入财政预算，实行收支两条线管理。作为小企业来说，既可能是各项基金的征收对象，但更可以成为各项基金的使用对象。\n\
    \n政府性基金支持小企业的发展，可以说是全方位、立体化的，许多项目可能许多小企业连想都没想过。在这方面，多多学习相关政策、了解有关行情，会便于得到相关资助。就连正常的小企业上市、发行债券都是可以财政补助的。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_287_0.png)\n\n## 皇粮融资案例(实战)\n\n一诺老师说，在北京市海淀区，凡是新设立或者新迁入海淀区，并且工商注册和税务登记都在海淀区的股权投资金业，在正式开展股权投资业务并完成第一笔投资业务后，就可以向海淀区政府申请一次性资金补助。\n\
    \n一诺老师说在安徽，小企业改制成功、与保荐机构签订上市辅导协议、在安徽证监局办理上市辅导备案登记的小企业，都可以从省政府和同级财政分别得到 100 万元的补助；在中小\n"
  mdcn: "\n## 再担保业务补助专项资金(落地)\n\n(1) 担保业务补助项目。主要是对符合条件的信用担保机构所开展的小企业融资担保业务给予补助。\n\n\
    (2) 再担保业务补助项目。主要是对符合条件的信用再担保机构所开展的、为担保机构提供再担保业务给予补助。\n\n(3) 保费补助项目。主要是在提高其他费用标准的背景下，对担保机构开展的低收费融资担保业务给予保费补助。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_266_0.png)\n\n## 提高素质活动的补助专项资金(实用)\n\
    \n(1) 提升企业管理水平的补助项目。重点支持小企业在办公、财务、库存、生产过程控制、销售等方面，采用信息管理系统、提高企业管理水平的项目。\n\n(2)\
    \ 提升企业研发能力的补助项目。重点支持小企业的技术研发部门开发和购置相关设备、仪器、软件，以及为适应技术研发所进行的场地、设施改造项目。\n\n(3) 企业专利申请补助项目。重点支持小企业开展专利开发而申请的项目补助。\n\
    \n## 开拓国际市场专项资金(落地)\n\n主要是为了提高小企业在国际市场的竞争力，促进外贸发展方式转变，以及用于补贴参加国际中小企业博览会的展位费。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_267_0.png)\n\n## 公共服务体系建设方面的专项资金(实用)\n\
    \n中小企业发展专项资金的申报和立项每年进行一次，申报时间为每年的上半年，申报的项目内容每年都会略有不同。\n\n小企业申请这项发展资金的一般程序是：\n\n\
    - (1) 向有关部门提出申请，通常是省级财政部门和省级中小企业管理部门，需要提供以下资料：公司营业执照副本及章程，生产经营情况或业务情况；上年度的会计报表和审计报告复印件。\n\
    - (2) 上述部门对申请企业的资格条件和相关资料进行审核，组织相关技术、财务、市场方面的专家进行评审，然后报送国家财政部、工业和信息化部。\n- (3)\
    \ 国家工业和信息化部会同财政部，对各地上报的申请书和项目进行审核，提出项目计划，确定项目资金支持方式，并且把预算指标下达到省级财政部门。\n- (4) 企业在收到专项资金后，进行相关的财务处理，同时接受省级中小企业管理部门的使用管理和监督。\n\
    - (5) 如果这项资金是用于固定资产投资项目的，需要在项目建成后一个月内，向省级财政部门和中小企业管理部门报送项目建设情况和专项资金使用情况。\n\n>\
    \ **信用难得易失，费十年功夫积累的信用往往会由于一时的言行而失掉！**  \n> —诺老师\n\n如果是用于信用担保体系建设和市场开拓等方面的，要求在年前向这两个部门上报资金使用情况。\n\
    \n一诺老师认为，如果是用于项目建设，可是项目又不能如期完成，需要提前向上述部门书面解释不能按时完成的理由以及预计完成的时间。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_269_0.png)\n\
    \n### 本节课程干货提炼\n\n(1) 国家工业和信息化部把 2012 年定为“中小企业服务年”，主题是“服务企业、助力成长”，重点支持创新型、创业型、劳动密集型中小企业尤其是小企业的发展。\n\
    \n(2) 中小企业发展专项资金堪称小企业“哺乳期”最缺的营养品。这项资金的推出，与政府转变认识误区有极大关系。\n\n过去不少地方政府认为大中型企业才能为当地经济发展锦上添花，所以对中小型企业一度不予扶持或扶持不足，任其自生自灭，这是小企业步履维艰的政策因素之一。\n\
    \n(3) 中小企业发展专项资金除了中央财政安排预算外，各省、市、县也都有相应的财政预算安排。这一块预算数额非常巨大。\n\n例如，福建省厦门市翔安区用于这方面的资金安排就高达每年\
    \ 2000 万元，通过现金奖励、资金扶持、费用补贴等方式，来全力支持小企业的经营发展。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_270_0.png)\n\
    \n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\n用 300 元最低融资 500 万，签订《零风险+对赌》协议！\n\
    \n零风险：没有融到约定金额，你 1 分钱损失没有！\n\n对赌：在约定的期限内没融资 500 万,倒赔你 3-300 万!\n\n想要实操，请马上联系一诺老师官方助理老师微信！\n\
    \n# 第69课：就业融资法\n\n## 再就业名义融资百万的操作流程(落地)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\
    \n跟一诺老师学习《融资的最高境界》！\n\n一诺老师说，再就业小额担保贷款，顾名思义是政府对失业人员再就业推出的一项鼓励政策。具体地说是，下岗失业人员自谋职业、自主创业、组织起来就业，由于难以获得银行贷款，所以可以通过政府设立的这项再就业担保基金的承诺担保，向银行申请专项再就业小额贷款。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_272_0.png)\n\n一诺老师说，再就业小额担保贷款是银行发给你的，再就业担保基金在这其中所起的只是担保作用。\n\
    \n根据 2002 年国务院颁发的《关于进一步做好下岗失业人员再就业工作的通知》(中发【2002】12 号)，对于下岗失业人员从事个体经营（国家限制的行业除外）的，3\
    \ 年以内免征营业税、城市维护建设税、教育费附加、所得税，并且免收属于管理类、登记类、证照类的所有各项行政事业性收费。\n\n与此同时，各省、地级以上城市都要建立下岗失业人员贷款担保基金，所需资金主要由政府财政筹集，具体担保机构由当地政府确定。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_273_0.png)\n\n一诺老师的意思是，如果是由下岗失业人员创办的小企业，就可以向当地下岗失业人员贷款担保基金申请小额贷款。\n\
    \n贷款额度一般为每人 2 万元左右，总额一般不超过 6 万元（女性创业或规模较大的小企业，贷款规模可扩大到 8 万元）；已经通过小额担保贷款扶持，并且已经全部归还贷款，创业比较成功，规模需要进一步扩大，并且能继续带动就业人数在\
    \ 5 人以上的，申请第二次贷款时，额度可以放宽到 30 万元。\n\n贷款期限一般不超过 2 年；到期需要延长的，可以申请展期一次（展期一般不超过 1 年）。\n\
    \n贷款利息按中国人民银行公布的贷款利率确定，但如果本身属于利润不高的微利项目，其利息可以由中央财政全额贴息（展期贷款不贴息），不用小企业自己负担。\n\n\
    这样，对于小企业来说，实际上享受到的是免息贷款。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_274_0.png)\n\
    \n那么，什么样的项目才算是微利项目呢？\n\n一诺老师发现，许多地方是这样规定的：除建筑业、娱乐业以及销售不动产、转让土地使用权、广告业、房屋中介、桑拿、按摩、网吧、氧吧等以外的项目，都属于微利项目，即这时候的再就业小额担保贷款利息可以由政府承担。\n\
    \n具体是指：在社区、街道、工矿区等从事商业、餐馆、修理等的个体经营项目，包括从事手工业、修理修配、图书借阅、旅店、餐馆、洗染缝纫、复印打字、理发、小饭桌、小卖部、搬家、家庭清洁卫生服务、初级卫生保健服务、婴幼儿看护和教育服务、残疾儿童教育训练和寄托服务、养老服务、病人看护、幼儿和学生接送服务、各种各样的钟点工。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_275_0.png)\n\n## 再就业融资的准备资料(实用)\n\n\
    有营业执照，固定经营场所，30%以上的自有资金；从事的经营项目符合政府相关政策；具有还贷能力；有银行认可的资产做抵押，或者有单位和个人做担保；属于所在社区居委会常住户口。\n\
    \n如果你是属于非正规就业劳动组织和再就业基地，需要申请这项贷款的，必须具有独立法人资格；有固定的生产经营场所，一定数额的固定资产和自有流动资金；安置的下岗失业人员要占职工总数的\
    \ 50%以上；经营项目市场前景看好，具有较好的收益和还贷能力。\n\n## 再就业融资的申请程序(实操)\n\n一是持上述相关材料，到户口所在地社区人力资源和社会保障所提出申请；\n\
    \n二是社区（街道）人力资源和社会保障所、区（市）人力资源和社会保障部门对你提交的材料进行审核，签署意见；\n\n三是人力资源和社会保障部门如果确认你的贷款担保额度、期限、风险防范措施、财政贴息符合规定，则向你和银行经办机构出具担保承诺书；\n\
    \n四是银行向你发放贷款。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_276_0.png)\n\n人员担保，一般要求由党政机关、事业单位、国有垄断企业、金融企业等在编在职人员以工资收入做担保；财产担保主要是用房屋、店面做抵押，或用定期储蓄存单等做质押担保。\n\
    \n通过反担保方式获取再就业小额担保贷款的，只要在规定的贷款额度和期限内，同样可以享受财政贴息。\n\n根据国家工业和信息化部的安排，2012年我国将进一步促进担保机构对小企业的融资服务，力争2012年新增担保业务额1.5万亿元人民币，新增服务企业25万户。\n\
    \n![](img/07ab4d5d19059316fdecec86fd7c3c51_277_0.png)\n\n### 本节课程干货提炼\n\n(1) 办理再就业小额贷款时，社会保障、财政、科技、工商、房产、公安交管等部门，免收一切行政事业性、服务性收费。\n\
    \n(2) 在法定年龄（男性16-60周岁，女性16-50周岁）内，自主创业或重新就业的人员。包括自谋职业的退伍军人，进行过就业失业登记的大专院校毕业生、农民、返乡创业农民工。\n\
    \n(3) 办理再就业小额担保贷款的机构，除了四大国有商业银行外，还包括各类城市商业银行、农村信用合作社、邮政储蓄银行、村镇银行等。\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【梦想教练】和【改变世界商学院】。\n\
    \n# 第 70 课：学生融资法\n\n## 申请大学生创业资金实操步骤(干货)\n\n兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？\n\
    \n跟一诺老师学习《融资的最高境界》!\n\n一诺老师说，大学生创业小额贷款，是针对在校大学生或已经毕业、尚未就业的大学生自主创业的资金扶持政策之一。\n\n\
    大学生创业小额贷款与再就业小额担保贷款，在性质和办理方式方面极其相似，都是需要参加人力资源和社会保障局组织的就业再就业政策培训（免费）的。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_278_0.png)\n\
    \n一诺老师说，这种培训无论对提高创业小额贷款的使用效益还是对大学生从事自主创业行为本身，都会有极大帮助。\n\n怎样办理大学生创业小额贷款呢？一诺老师总结了步骤：\n\
    \n## 大学生创业融资实操步骤(落地)\n\n- (1) 大学毕业证、失业证书、营业执照、税务登记证、房屋产权证或担保合同，到户籍地社会保障所办理申请。合伙经营的小企业，则由企业法人代表到户口所在地或经营场所所在的街道人力资源和社会保障所办理审核。\n\
    - (2) 到区级人力资源和社会保障局办理审批手续。\n- (3) 到银行去办理相关贷款。若你是在校大学生，自主创业不但可以申请大学生创业小额贷款，还可以在\
    \ 2 年内保留学籍。\n\n![](img/07ab4d5d19059316fdecec86fd7c3c51_279_0.png)\n\n一诺老师说，申请大学生创业小额贷款时，按政策规定要有担保人，并且担保人还必须是政府机关、事业单位在编在职人员，月收入在\
    \ 3500 元以上。每人的担保额度不能超过年收入的 2 倍，最高不超过 20 万元。\n\n一诺老师认为，如果是大学生合伙创业的徽利项目，申请贷款时需要固定的经营场所和一定的自有资金，需要用本市常住户口的房产证、有价证券或动产不动产做抵押；如果是法人企业出面担保的，担保企业的年税后利润不低于5万元，并且拥有贷款申请额1.5倍以上的不动产。\n\
