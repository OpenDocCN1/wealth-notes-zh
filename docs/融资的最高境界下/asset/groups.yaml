    # **第61课：跳板融资法**


    # 小企业合法合规的融资方案(鱼跃龙门)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》！


    创业板市场是小企业的一种新型融资渠道。创业板上市与主板市场上市是不同的，全球都称它为“二板市场”（第二股票交易市场），只有香港和我国内地把它称为“创业板”。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_210_0.png)


    一诺老师说，设立创业板市场的目的，主要是鼓励“创新者创业”（不是普通的创业者创业），门槛太高就失去了意义。所以你能看到，在创业板上市的企业一般都有成立时间短、规模小、业绩不突出、暂时无法上市的特点，所以，有人形容它是小企业融资渠道中“最短的跳板”，是对主板市场的补充。也'
  - '[PAGE 211]


    正因如此，进入创业板的门槛并不高，操作也比较简便。


    我国创业板市场从 1999 年就开始酝酿了，历经 10 年筹备创建，终于在 2009 年 10 月正式推出。在此期间，由于创业板迟迟没有推出，于 2004
    年 5 月先行创设了中小企业板作为过渡。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_211_0.png)


    # 打造跳板融资条件(干货)


    根据 2012 年修订的《深圳证券交易所创业板股市上市规则》规定，主要有：一是股票已经公开发行；二是公司股本总额不少于 3000 万元；三是公开发行的股份达到公司股份总数
    25% 以上，公司股份总额超过 4 亿元的公开发行股份比例在 10% 以上；四是公司股东人数不少于 200 人；五是公司最近 3 年没有重大违法行为，财务会计报告没有虚假记载。应该说，对许多小企业来说，上述要求是可以达到的。


    如果你想在创业板上市，需要提交以下材料：申请股票上'
  - '[PAGE 212]


    市的董事会和股东大会决议；公司营业执照复印件；公司章程；


    经过审计的最近 3 年的财务会计报告；保荐协议和保荐机构出具的上市保荐书；律师事务所出具的法律意见书；验资报告；董事、监事和高级管理人员持有本公司股份的情况报告以及登记证明文件；最近一次招股说明书；上市公告书；等等。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_212_0.png)


    从创业板上市募集到的资金，应当按照发行申请文件中承诺的资金投资计划来使用；每个会计年度结束后，要全面核查募集资金投资项目的进展情况；按会计年度算，实际募集资金与上次披露的募集资金投资计划金额差异超过
    30%时，应该做出说明，并调整计划；准备变更募集资金投向的，要在董事会审议后及时报告深圳证券交易所，并进行公告。


    一诺老师说，如果有超额募集到的资金，必须在资金到账后 6 个月内存放在募集资金专用账户中，可以用于公司主营业务，但不能用来开展证券投资、委托理财、金融衍生品投资、'
  - '[PAGE 213]


    创业投资等高风险投资，以及为他人提供财务资助等。


