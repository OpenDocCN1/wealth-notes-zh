    # 中小企业专项资金的申请方式(实操)


    一诺老师说，无偿资助、贷款贴息和资本金注入，申请时只能从中选择一种，不能兼而有之。


    无偿资助方式主要用于小企业以自有资金为主投资的固定资产建设、市场开拓、信用担保体系建设等项目，每个项目的资助额度一般不超过300万元。


    贷款贴息方式主要用于小企业以银行贷款为主投资的固定资产建设，额度根据项目贷款数额和银行同期贷款利率来确定，'
  - '[PAGE 264]


    每个项目贴息期限一般不超过 2 年，额度不超过 300 万元。


    资本金注入方式主要用于小企业在信用担保体系建设方面，在无偿资助不太适合的背景下使用。


    那么，什么样的小企业能够申请到中小企业发展专项资金呢？一诺老师研究发现，需要符合以下条件：


