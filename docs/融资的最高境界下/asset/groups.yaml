    (3)买方向卖方分期支付货款后，卖方再向借款银行逐期归还所借款项和应付利息。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_85_0.png)


    # 买方融资实操方案(实用)


    一诺老师说，买方信贷与卖方信贷的区别是，买方信贷提供的贷款是直接给买方或所在地银行的。

    由于卖方银行对买方不可能很了解，所以买方信贷的贷款手续比较复杂，需要签订两个合同，一是买卖双方签订的进出口贸易合同，二是卖方银行与买方或买方银行签订的贷款合同。

    不用说，这两者之间是有联系的，那就是贷款合同必须以贸易合同为基础，否则“皮之不存，毛将焉附”？ 在这个过程'
  - '[PAGE 86]


    中，卖方银行会要求卖方按质按量提供出口产品，而对买方信贷方面的财务安排，也必定会掌握在自己（卖方银行）手里。


    一诺老师说，卖方银行是不会把贷款直接付给买方的，而是会在买方收到货后，根据单据，代表卖方付给卖方；但贷款的归还，是需要买方按期偿还的。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_86_0.png)


    # 买方融资的量大实操方案(落地)


    +   (1)卖方银行直接向买方所在地银行提供贷款。具体步骤是：


    +   @ 双方签订进出口贸易合同后，买方预付 15%-20%的预付现汇定金。


    +   @ 双方银行以进出口贸易合同为依据签订贷款合同，卖方银行提供贷款。


    +   @ 卖方发货。


    +   @ 买方银行把借到的贷款贷给买方。'
  - '[PAGE 87]


    @买方以现汇条件向卖方支付货款。


    @买方银行根据贷款协议向卖方银行偿还贷款本息。


    @买方向卖方银行偿还本息。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_87_0.png)


    (2)卖方银行直接向买方提供贷款。具体步骤是：


