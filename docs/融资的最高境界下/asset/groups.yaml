    ## 第 51 课: 预期融资法


    ### 用将来的预期收益募集资金(神套路)


    兵马未动，粮草先行！当今，大多数企业都死于资金链的断裂！如何融到永远也花不完的钱呢？


    跟一诺老师学习《融资的最高境界》!


    ABS 项目融资是英文 Asset Backed Securitization 的缩写，意思是用项目所属资产做支撑来进行证券化融资。


    一诺老师认为，用这个项目的资产作为基础，用这个项目将来的预期收益做保证，来发行债券募集资金。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_128_0.png)


    ABS 项目融资模式出现在 1998 年的重庆，现已成为一种非常流行的项目融资方式。


    ### 预期融资的操作步骤(落地)


    - (1)专门组建一个独立的项目融资公司，称为信托投资公司或信用担保公司。

    - (2)寻求权威资信评估机构对该项目融资公司给予尽可能高的信用评价。

    - (3)项目主办方转让未来收益权，通过合同，把特许期内的项目筹资、建设、经营、债务偿还等权利转让给项目融资公司。

    - (4)项目融资公司发行债券，筹集项目建设资金，由于其信用等级较高，所以筹资成本会明显低于其他筹资方式。

    - (5)项目融资公司组织项目建设、经营，并用其收益偿还债务本息。

    - (6)项目融资公司在特许期满后，按合同规定将项目资产无偿转让给项目主办方。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_129_0.png)


    一诺老师发现，在这个过程中，无论是基础设施还是公共工程开发项目，如铁路、公路、港口、机场、桥梁、隧道、电力、煤气、天然气、供水、供电、医疗卫生项目等，只要是可


    以预见到未来收益和持续现金流量的，都适合采用这种 ABS 项目融资模式来进行运作。


    与其他融资模式相比，ABS 项目融资的特点是：具有更强的收益吸引力，一般会高于同期美国国债收益率，与同期公司债券的收益率相当；具有较高的信用评级，因为它毕竟是有项目资产做支撑的，所以大多数都能得到最高信用评级
    AAA 级；投资多元化和多样化，投资领域遍及各行各业，有助于进行多样化投资组合，如汽车消费贷款、学生贷款证券化，商用、农用、医用房产抵押贷款证券化，信用卡应收款证券化，贸易应收款证券化，设备租赁费证券化，基础设施收费证券化，门票收入证券化，俱乐部会费收入证券化，保费收入证券化，中小企业贷款支撑证券化，知识产权证券化等；现金流有保证，只有在一些高收益率的项目中其现金流才会有不确定性。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_130_0.png)


    由于 ABS 项目融资是通过另外组建独立的项目融资公司进行的，这样，项目主办方就可以避开许多政策法规的限制，如不适合融资、信用级别低等因素，改为通过独立对外的项目融资公司来经营运作、偿还债务。


    具体到大型基础设施建设来说，就可以避开政府部门征税能力、财政预算规模、不能用政府信用为经营项目担保等壁垒。


    并且，主办方委托项目融资公司独立建设、经营，实际上其决策权仍然在主办方手中，这种“换汤不换药”政府部门不会担心大权旁落，这也是 BOT 融资方式所不具备的优点。


    除此以外，项目融资公司和投资者之间的关系，是真正的债权债务关系，根本不用担心项目所有权会遭到贬损，项目运营利润不会大盐外流。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_131_0.png)


    ## 本节课干货提炼


    用资产做担保募集资金


    (1)ABS 项目融资的最大优势是，通过在高端证券市场上发行债券、募集资金，并且可以面对全球国际市场，融资成本低，适合大规模的资金募集，这是其他项目融资方式所不具备的。


    (2)与 BOT 项目融资方式相比，ABS 项目融资模式的环节少，能够在很大程度上减少佣金、手续费等中间费用。并且由于通过独立的项目融资公司筹集资金，这样这部分负债就不会出现在主办者的资产负债表上了。


    (3)ABS 项目融资方式发行的债券必定会受到众多投资者欢迎，这样也就分散了主办方的投资风险。为此，要求操作这一切都要按国际惯例行事，最好是把这个独立的项目融资公司直接设在国外，这样的信誉度会更好。


    ![](img/07ab4d5d19059316fdecec86fd7c3c51_132_0.png)


