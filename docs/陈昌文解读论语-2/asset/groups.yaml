    # 1、不要只知道吃饭，而要做实事


    原文


    宪问耻。子曰：“邦有道，谷；邦无道，谷，耻也。”“克、伐、怨、欲，不行焉，可以为仁矣？”子曰：“可以为难矣，仁则吾不知也。”


    陈昌文解读《论语》：


    这篇《论语》又是一篇大作，里面有很多可以揣摩、反复玩味的地方，待我细细讲来。


    宪，是原宪，这个人终身贫穷，以富贵、出来做事为耻辱，总觉得是跟别人同流合污。这跟社会上很多人一样，自己是什么没有能力，于是选择甘于贫穷，但总是因为自已不愿意同流合污才贫穷的。


    原宪还攻击过子贡，意思是子贡的能言善辩，能经商致富，自己也能做到，只是自己不想去做，自己不愿意去做罢了。子贡也因为原宪这样说，感觉到自己很羞愧，不愉快。


    当然，原宪这个人是不是真能做到去干，就能干好？还是甘于贫穷？这个要打一个问号。


    前面是前提介绍，后面开始解读这篇《论语》。


    原宪问什么是耻辱，什么事情是可耻的？孔子说，邦有道，就是上有明君，天下太平、盛世，大道光明，您没有本事做好官，只知道混吃等死，只是混日子，甚至还混得很差，什么也干不好，也做不好正事，这就是耻辱。邦无道，就是上无明君，下有奸臣，贪污污吏横行，人心不古，相互踩踏的社会，您还做官，跟人同流合污，鱼肉百姓，吃得很好，您这是耻辱。'
  - '[PAGE 151]


    孔子为什么说这个话？也是为了敲打原先这种人，有的人就是自己价值观不对，天天提些清高的问题。要想想自己的贫穷，是因为自己没有能力做正事，做好事，而不是世道不好，不要怪世道。要明白是自己的能力问题，做事问题，而不是自己不想同流合污。不是让您去同流合污，而是您要明确这个社会就是有黑暗面，您要在黑暗面里也能做点有意义的事情，不要只会盯着黑暗面，然后来彰显自己无能是因为清高。


    原先继续问仨，说，不做下面四点，是不是就是仁了？


    第一点，克，也就是争强好胜。


    太多的人，总想在一些小的争执上，争强好胜，总是想压别人一头。开个会，想压别人一头；在一个团队中，想压别人一头；甚至玩个游戏，也想压别人一头，压了别人一头，还要嘲讽别人，这叫傲。


    第二点，伐，自我夸耀。


    人总是喜欢自我夸耀，把话说的冠冕堂皇，想表现自己的好、自己的善良、自己的功劳，否定别人，总是觉得别人不如自己，这个行为也让人感觉不舒服。


    第三点，怨恨。


    总是抱怨社会、抱怨同事、抱怨家人、抱怨一切，一个怨夫怨妇之相。不能理解其实一切都要靠自己去把事情做好，把人际关系搞坏，不理解抱怨只会让事情变得更坏，而不是更好。


    第四点，欲。


    人是有很多欲望的，比如贪心、好色、喜欢享受，这些都是欲。能克制自己的不良欲望，能清晰的知道自已应该做哪些，哪些是在自己应该做的、应该获得的范围，哪些是不应该获得的，这些范围都很清楚。不是自己的，不该自己的，不要伸手，不要去想。'
  - '[PAGE 152]


    原宪说，不争强好胜，不自我夸耀，不怨恨，能克制自己的欲望，这算是仁了吗？


    孔子说，这个只是比较难做到，是不是仁，我不知道啊。意思就是原宪，这个不是仁。


    原宪以为自己在仁的境界，甚至用这四点去对照别人。别人过得比自己好了，比如子贡过得比自己好，就说其实自己是克制了自己的欲望，并不是不能做到，而是不为也，也就是不去做。


    我们很多人能力差，社会混得不行，就找借口说自己不想去同流合污，不想争强好胜，要是自己去做，也能做到。其实不然，这种人给自己脑袋上戴很多光环，实际上是自欺欺人。有些人甚至用清高的话语去辱骂那些有实际成就的人，其实让他自己去做，未必做得到。


    一个人，要有一些良性的争强好胜之心，这样才能做好事情。一个人也要有自己的特长，有自己值得夸耀的地方。要是什么地方都不值得夸耀，这个人也就没什么用了。一个人呢，不怨恨别人当然是对的，要学会找自己的原因，解决问题。一个人，要有一定的良性欲望，这样才能成长，变得更好。


    当然，更深一层的意思，一个人啊，不要拿着这些尺子去对照别人，讥讽、嘲笑别人。而要理解，人各有不同，要能有格局容忍别人的争强好胜、自我夸耀，甚至能容忍别人的怨恨，能理解别人的欲望。然后能在这些看似不如意的环境中，调和大家，得到一个最好的结果。


    # 2、君子忧道不忧贫


    原文


    子曰：“士而怀居，不足以为士矣。”'
  - '[PAGE 153]


    > 陈昌文解读《论语》：


    这句话领悟透彻，您就明白，为什么有些人一辈子没成就。为什么有些人一辈子想富贵功名，反而得不到。为什么有些人看起来忙忙碌碌，却碌碌无为。


    还有一句话，与此对应，君子谋道不谋食，君子忧道不忧贫。差不多都是这个意思。


    孔子说，一个士如果天天想着美好的房子、好吃的，享受、俸禄、利益，这个人就不配作为一个士。


    这是什么意思呢？就是您要有一个坚定的志向，您的目标是去实现您的志向，实现一个道，为社会做贡献也行，帮助某一部分人也行，或许您做好一门技术、一个生意、一个管理岗位也行。总之，您的目的是做好一件事，您不要贪图安逸、享乐。


    一些人终身就想追求大富大贵、享乐，甚至权力。他们理解不了，是一个人的志向坚定，谋道，做好了事情，这个富贵、权力、豪华的房子、车子，自然会靠近。


    这也是为什么很多人理解不了一些大富豪、有权力的人却非常朴素的原因，他们以为这些人就应该享受，就应该奢靡。想不通这些人为什么拥有了财富、权力，还是这么朴素。是因为，这些人都是乐道者，都是认真做事的人，而根本不是要享受，根本不是一心想着享受。所以，一心想着赚钱的人，是赚不到什么钱的。一心想着拥有多少权力的人，是拥有不了什么权力的。


    您要干好一件事，负起您该负起的责任，为社会做出对应的贡献，当您真正这样立定志向，不受外界诱惑，不动摇的去做的时候，您自然会得到对应的权力与财富。所以，一个士，不能想着要安逸享受，要有豪华的房子、'
  - '[PAGE 154]


    车子。做好您现在的工作，为社会做出贡献，您自然会拥有您应该拥有的。


    # 3、行为必须端正，说话看情况


    # 原文


    子曰：“邦有道，危言危行；邦无道，危行言孙。”


    陈尤文解读《论语》：


    孔子说，国家有道、政治清明，上有明君，下有贤臣，则说话该批评就要批评，不要客气，不要装孙子，不要明哲保身。行为上呢，也要行得正，坐得端，堂堂正正的。


    邦无道，国家无道，上面是昏君，下面是奸臣，贪官污吏当道，则我们的话语气别那么刚强。呆在家里，不出去乱说话，不得罪人，明哲保身。但是行为上还是要端正，不能同流合污。


    总体来讲，无论是有道还是无道的时候，我们都要行为端正，对得起天地良心。但是呢，我们从话语上，要学会看情况，有道的时候，我们一定要提出批评意见，有价值的意见；无道的时候，我们就不能迎着枪口往上撞了。


    对我们人生有什么启示呢？


    也就是我们要关心自己的行为是不是端正，对方能教育、能改变，我们就帮帮他；对方要是冥顽不灵，会搞破坏，会反咬我们一口，我们就只管自己，不对他言语了。'
  - '[PAGE 155]


    # 4、有德行的人必然有言论，仁义的人必然勇敢


    原文


    > 子曰：“有德者必有言，有言者不必有德。仁者必有勇，勇者不必有仁。”


    陈昌文解读《论语》：


    孔子说，有德行的人一定有言论，有名言警句；有德行的人一身正气、英气，完全是按照道义、仁义讲出来的话，大家听着就很舒服，而且有德者必然要说，不说，就不能教化众生，就不能对社会有利，也不能规正别人。看到别人倒霉了，做错了，不说，就是不帮助，就是无仁义之心。


    一个人如果不说话，万事为了保全自己，万事为了不得罪人，看到别人错了，也不说，这样的人，不算有德之人。有德的人，一定通过正气去规正自己、规正别人。


    一个能言善辩的、一个会讲道理、说话也有逻辑的人，是不是就是有德的人呢？不一定，一个会讲道理、巧舌如簧的人，有逻辑的人，也可能只是为了自己的目的说话，他并不是为了整体利益、大局利益，他只是为了自己的利益，达到目的而已。


    所以，您见到一个能言善辩的人，有很多言论、很多逻辑的人，不要认为他有德，或许他仅仅是能言善辩，有一定的言论罢了。


    一个仁者一定有勇，就比如，您组织中有人做错了，您就一定会说，一定不怕得罪人，一定敢于站出来反对，这就是勇。一个仁者，对于自己应该做的事情，是一定会做的，他有勇气去做。他不会唯唯诺诺的，贪生怕死，怕这怕哪。'
  - "[PAGE 156]\n\n但是仁者不是不怕死，就送死，他可以死于大义，为义所在，如果死这件事对他是不义的，他也不会血气方刚，逞英雄。\n\n由此，我们就可以推断出来，一个血气方刚、逞英雄、耍泼打滚、被愤怒充满头脑的人，不怕死，这种人只是有勇而已，跟仁是不相关的。\n\
    \n仁的人的勇，是按照道义、正气，该勇的时候，必然勇敢。仁人的勇，是冷静的勇，是不得不勇的道义之勇。不仁的人的勇，可能只是一时意气，血气方刚，忍不住就冲上去的勇，是头脑发热的勇。\n\
    \n# 5、领导人的能力是给大家带去福报\n\n# 原文\n\n南宫适问于孔子曰：“羿善射，奡荡舟，俱不得其死然。禹、稷躬稼而有天下。”夫子不答。南宫适出。子曰：“君子哉若人！尚德哉若人！”\n\
    \n陈昌文解读《论语》：\n\n南宫适问孔子说，羿善于射，这个羿不是后羿，是夏朝时候一个诸侯国，有穷国君主，这个人射箭非常厉害，也非常喜欢打猎。\n\n一旦喜欢射箭，而且射箭射得好，就想天天展示自己的本事，对其他人不尊重，耀武扬威的，认为别人没自己厉害，而且也容易瞧不起人。但这件事，其实是对社会没有多大意义的，对人民来讲，您射得好，又怎么样呢？\n\
    \n  奡荡舟。\n\n什么叫做荡舟，就是这个人力气能把舟在陆地上举起来，荡过来，荡过去的。形象一点讲，别人的武器是一把刀，他的武器可以是舟，您想想这是不是神力了得，那是多少人都怕他，都超不过他的。这人啊，一旦有了这样"
  - '[PAGE 157]


    的神力，就会专注于自己的神力，发挥自己的神力，进而瞧不起别人，进而轻视别人。


    在中国历史上有很多这样的人，比如项羽、吕布，都是勇猛不可挡的人，万夫莫敌。这些人都是非常有力，与众不同的，他们同时也轻视谋略，天天夸耀自己，瞧不起不如他的人。这些人的后果是什么？就是慢慢的，别人都不跟他混了，都远离他，然后团结起来整他们。


    在历史上，项羽、吕布，这些人身边其实都有文武兼备的人，都有有谋略的人，只是慢慢的都跑到对手那里去了。为什么会这样？因为一个人有了神力，有了极强的个人特长，就容易跟人比划比划，而且会把成功都归结为自己，让跟着您的人没有发挥余地，谁跟着您这样的人也不开心。而且，神力是您的，跟大众有什么关系呢？您箭射得好，您力量大，功劳都是您的，我们自然不陪您玩了。再玩下去，自己没趣啊。所以，最后的结局，就是大家都背叛您，您就不得好死了。


