    # ## 2、仁的具体操作方法


    # **原文**


    颜渊曰：“请问其目？”子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”


    颜渊曰：“回虽不敏，请事斯语矣。”


    # 陈昌文解读《论语》：


    这节学问极大，希望大家极其重视。


    前面孔子讲了什么是仁，颜渊继续追问，仁的目录是什么呢？仁的具体操作方法是什么呢？颜渊真是好学生啊，要落实到具体条目、具体干法上。而不是像有的学生那样，孔子还没开口，他们就说懂了，等孔子说一句，他们就不问了，以为自己懂了。


    然而颜渊这个学生，不认为自己聪明。其实，颜渊闻一知十，很聪明，但是他不认为自己聪明，继续问。他继续问，孔子就继续讲，孔子讲仁的具体方法了。如果颜渊不问这个，估计我们这一辈子都不知道如何操作这个“仁”字，中国几千年就少了一个重要的方法。


    孔子说，


    非礼勿视。不符合礼的，不好的，不按照规矩的事情，您不要去看。


    非礼勿听。不符合礼的，不好的，不符合规律的，您不要听。'
  - '[PAGE 68]


    非礼勿言。不符合礼的，不好的，不符合规律的，您不要说。

    非礼勿动。不符合礼的，不好的，不符合规律的，您不要行动。

    颜回说，我虽然不聪明，这几句话，我要听话、照做、执行。


    一个人倒霉，首先就是看了不该看的，被绕进去了。比如，街上看人下象棋、赌博，自己也去看，看着看着就开始参与，于是就被罚了。


    当然，有时候我们不看，结果别人叫我们去看，这就是听到了非礼的东西，听到了，赶快跑，不要听，这是高手。但是有些人行，虽然不去看，但是被人劝说，被声音吸引，于是跑去看，听了就上了瘾了，就跟着去干坏事了。有些人呢，看到了，听到了，自己也去传播邪道、坏事。说着说着自己也信了，就参与坏坏事，结果倒霉了。


    当然，一个人要倒霉，最终还是行动了。


    最后一步，非礼勿动。如果您看了、听了，也嘴巴上讲，但是没有行动，您不会倒霉。或者说倒霉的几率小。但是您行动起来，您大概就要倒霉了。


    视、听、言、动，也是一个递进关系。


    所以一个厉害的角色，首先是管住这四个点。绝对不看、不听坏东西，不说坏东西，更不会行动。远离一切恶，则您的世界就仁了。


    这个世界上总是有些坏人坏事，您不要去去、听、说、干。那是别人的事情，您要保证您从源头上杜绝这些坏事您。您想想，分析分析，就知道一切的罪恶、倒霉，都是从看了不该看的，听了不该听的，说了不该说的，干了不该干的开始的。一个高手，一门心思走正道，杜绝一切不好的东西出现在自己的眼睛、耳朵、嘴巴、行为上，这个人自然就快乐。


    眼睛、耳朵是输入信息；嘴巴、手脚是输出信息。管好输入的信息，管好输出的信息，这个人就是仁人了，就是懂礼了。我们既不让别人用有害信息毒害我们，我们也不用有害信息、行为去毒害别人，这就是仁。


    这就是为什么我喜欢儒家思想的原因，孔子能把每一个高深莫测的概念'
