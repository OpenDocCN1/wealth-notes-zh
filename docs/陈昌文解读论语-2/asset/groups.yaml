  mdcn: '

    如果您让您身边这几杆枪、几个人都过好了，自然有人帮您传播，您不想传播，都难。您的上下游供应商、您的员工、您的客户，都会传播您的。您不想做大？他们都要逼着您做大规模，您就顺其自然做大了。


    所以，什么是政治？先照顾好您身边的人，让他们开心，就是政治；让他们快乐，就是政治；让他们有收入，就是政治。而您做到这些，远方的人都会带着老婆、孩子来投奔您了。


    ## 17、不要急躁，要经得起诱惑


    ### 原文


    > 子夏为莒父宰，问政。子曰：“无欲速，无见小利。欲速，则不达；见小利，则大事不成。”


    ### 陈昌文解读《论语》：


    子夏当了莒父这个地方的长官，古代叫做城宰。来问孔子如何搞政治。孔子说，不要那么急，做事要按照正常速度，不要只能看到小的利益。为什么呢？速度快了，反而不达，要不就是到达不了。


    大家可能都有长跑的经验，一开始，如果您疯狂冲刺，势必您跑一段时间就跑不动了，很可能您就跑不了全程。做事也是如此，要想有一个长期的过程，不是短期过程。要长期坚持下去，讲究的是滴水穿石的功夫，而不是想要马上有成绩，要行的是日日不断之功。


    很多人做项目，一开始就想要成功，这是不可能的，要有板凳甘坐十年冷的精神。每天勤勤恳恳，把功夫下实在了，结果就不会差。如果一开始急吼吼的，这种人一般会放弃。而且您太急了，您的团队、您的组织跟不上您的节奏，也会出乱子。


    见小利，则大事不成。


    在我们做事的时候，总是有些小的利益诱惑，如果您贪图了这些利益诱惑，您就会放弃您的主业，偏离了主航道，结果您要做的正事就做不成了。


    很多人都有见异思迁的毛病，都有喜新厌旧的毛病。手上的事情做好，其实回报就会很大，奈何等不及，奈何这世界诱惑太多，他们能看到其他很多利益，于是做一段时间，就跟着小的利益跑了，放弃了自己正在做的正事。


    为什么有些人创业很难成功？因为在创业的过程中，总是有各种各样的利益，感觉其他地方也有利润，都想要做一做。然后去做了，还没等到结果，又看到其他地方又有利益，又去做了，就这样周而复始，忘记了开始自己要做的事。结果，就这样一辈子一事无成。


    想要做好一件事，要按部就班、按照规矩、不急不慢、经受得住诱惑，一直做下去，这样才能做到位，做好事情。


    ## 18、您应该维护您的亲人


    ### 原文


    > 叶公语孔子曰：“吾党有直躬者，其父攘羊，而子证之。”孔子曰：“吾党之直者异于是，父为子隐，子为父隐，直在其中矣。”


    ### 陈昌文解读《论语》：


    叶公对孔子说，我的家乡有个正直的人，他的父亲偷羊，他作为儿子证了他的父亲。叶公的意思是这个人大义灭亲，连自己的父亲都指证、举报，这个人真正直啊。


    孔子说，我家乡的正直标准跟您家乡不一样。儿子犯罪，父亲替其隐瞒；父亲犯罪，儿子替其隐瞒，则正直就在其中啊。


    这可能跟很多人想象得不一样，为什么父子之间还要隐瞒犯罪，这不是错误的吗？一定要大义灭亲。其实，大义灭亲是非常惨绝人寰的，甚至是打破伦理的，连自己的亲人都能下得去手的人，您很难说他是大义灭亲。


    有这样一个故事，齐桓公的厨师易牙为了讨好齐桓公，把自己的儿子杀了给齐桓公做成美味吃了。齐桓公很高兴，觉得易牙这个人好啊，为了自己有美味吃，连自己的儿子都献上来看了。


    管仲就告诉齐桓公，说这个易牙对自己的儿子都能如此残忍，对君王的忠诚必定是假的，要求齐桓公驱逐易牙。可惜等管仲死后，齐桓公又把易牙请回来，结果易牙背叛了齐桓公，把年老的齐桓公关在屋子里，不给饭吃，活活饿死。尸体腐烂了两个多月，都没人管。


    这个故事说明了什么？说明了能对亲家人下手的人，必定是狠毒之人，他的一切大义灭亲、忠诚，都是有问题的。


    如果我们为了证明一个人有罪，就鼓励他的亲人相互指证，势必会造成更多的恶，甚至是鼓励更多的恶。最终，孔子对这个伦理命题的答案就是，做父亲的可以为儿子隐瞒，做儿子的可以为父亲隐瞒。


    我再把这个问题扩充一下，跟您有关系的人、对您好的人、对您亲近的人，您本来就s应该维护。如果您连跟您亲近、对您好的人都不维护，您这个人的人品实际上是有问题的。


    所以说，我见有的投资人说一句话，如何去判断一个创业者是不是靠谱？就是去他家里，看他是如何对待他的父母、妻儿老小；去他的朋友圈子，看他是如何对待朋友的；去他的团队，看他是如何对待团队成员的。这真实的反映了这个人生价值观是不是靠谱。


    总而言之，如果您连您的亲人都不能维护的话，那么您确实是一个有问题的人。如果您连对您好的人都不维护的话，那么，您这个人也是一个有问题的人。


    ## 19、做人做事，都应该尽心尽力、恭敬忠诚


    ### 原文


    > 樊迟问仁。子曰：“居处恭，执事敬，与人忠。虽之夷狄，不可弃也。”


    ### 陈昌文解读《论语》：


    樊迟问孔子，什么是仁。孔子说了三条和一个注意事项。


    - 1、居处恭。


    居是居心的居，就是您这个人的心里一定要有恭敬之心。对人要恭敬，不要轻视任何人，不要有侮辱任何人的心理。不要表面一套说辞，心里一套理论，要真正的恭敬人。这真恭敬与假恭敬，在脸色、行为上都是有体现的，甚至在人说话的口气、声音中也有体现，骗不了人。一个人首先要有恭敬之心。


    - 2、执事敬。


    做事要敬，不要掉以轻心。一个人只有敬事，才能做好，才能用心去做，才能做到位。不敬事的人会有轻慢之心，有了轻慢之心的人，就算有能力，做的事情也会有问题，会大打折扣。不敬，您在方方面面都干不好您想要干的事情。


    - 3、与人忠。


    做人，首先不要骗人，是什么就说什么，不要骗自己。自己要做什么，就老老实实地去​做，要做个实在人。不要骗别人，能做到的就好好做，做不到的就告诉别人做不到。一件事，既然答应了别人，就一定要做到位，要尽心尽力地去做，这就是忠。


    然后还有一个注意事项，虽之夷狄，不可弃也。


    就算到了野蛮人的地方，您也要做到这3点。不能说对方是野蛮人，没有教化，我这样做，别人不这样做，我就吃亏了，不是的。儒家思想是要求自己，不要求别人。您这样做，自然有对应的人跟您交往，实在不听教化的，我们看出来了，就不跟他交往了。也就是巷而怀之，我走了。


    我就是这样一个人，做人做事都尽心尽力，有恭敬之心、忠诚之心。对任何人都一样。只是，我们会选择跟对应的人交往。


    ## 20、士的标准


    ### 原文


    > 子贡问曰：“何如斯可谓之士矣？”子曰：“行己有耻，使于四方，不辱君命，可谓士矣。”曰：“敢问其次？”曰：“宗族称孝焉，乡党称弟焉。”曰：“敢问其次？”曰：“言必信，行必果，硁硁然小人哉，抑亦可以为次矣。”曰：“今之从政者何如？”子曰：“噫！斗筲之人，何足算也。”


    ### 陈昌文解读《论语》：


    子贡问孔子，什么样的人才能称得上士呢？


    士是古代统治阶级中次于卿大夫的一个阶层，一般也是卿大夫的家臣。古代统治阶级的排序是，天子、诸侯、卿大夫、士。


    孔子说，行己有耻，知道什么是耻辱，知道什么事情不应该做，首先是有所不为。这个世界上利益很多，诱惑很多，知道自己不做什么很关键，就算天大的利益，也不受到诱惑，走在自己的正道上，跟着目标走，这算是第一步。


    人们一辈子没成就，大多数是被诱惑，走着走着，就忘记了目标，走偏了。其实，一个人如果立定了目标，一直为这个目标而奋斗，一般都不可能过得太差。因为时间长了，人总会成为这个方面的佼佼者，而大多数人都是走几步路，就被新的利益诱惑走了。然后周而复始的重复这个动作：走几步路，又被新的利益诱惑走了。于是，一辈子一事无成。


    所以，士的一个重要标准，就是知道耻，知道哪些事情不应该做，只有搞清楚了哪些事情不应该做，不受利益诱惑，守住自己最开始的目标，才能称为士。


    使于四方，不辱君命。


    派您到其他地方去做外交，外出做事，您能完成君上的使命，不使君上受到侮辱。这是能力要求。一个士不仅仅要有道德要求，还要有能力要求。没有能力，就是空吃俸禄，不能办事，不能保护君上的利益。这当然不算士。也就是您得有才能，您得有用，能搞定给您的任务。


    子贡听懂了，感觉有点难，可能觉得这两个标准太高了，于是就追问，那次一点的要求呢？


    孔子说，宗族里的人，都说孝顺；邻里乡亲，都说您友爱。您这个人虽然没什么才华、能力，但是也算是有所本了。至少把宗族乡党照顾好了。


    子贡继续问，再次一点的要求呢？


    孔子说，没什么见识的小人，但是呢，讲信用，做事有结果。也就是要成为一个士的最低要求，也不是要您能力有多强，您见识有多厉害，至少您要是一个讲信用的人，做事要做好，有一个结果。


    其实啊，如果当今当老板的，身边都是这样的人，已经很厉害多了，就是大家讲信用，不欺骗您；您交代的事情，他在他的能力范围内，都尽心尽力地完成。他不需要是什么大才、人才，但是这样的人多了，您也能当好这个老板，做好一个企业了。


    子贡继续问，那么今天这些正在从政的人怎么样呢？能达到士这个标准吗？


    孔子说，这些人啊，见识、能力、能量就如同那个斗一样，那个装饭的饭筐一样，意思就是见识、能力、德行、气量小得不能再小了，有看不起的意思，这些人怎么能算士呢？


    看了孔子对士的标准，大家要拿去对照自己，看自己够不够格，这是我们多次讲的，儒家思想是为了修正自己，修养自己，而不是拿着这个尺子去量别人。


    我们看看我们自己是不是志向坚定，为了一个目标不受诱惑？我们看看我们自己是不是有能力做好事情？


    这是这里孔子对士的最高要求。


    ## 21、要把教育资源倾斜给可望之才


    ### 原文


    > 子曰：“不得中行而与之，必也狂狷乎！狂者进取，狷者有所不为也。”


    ### 陈昌文解读《论语》：


    孔子说，如果找不到尽善尽美的，任何事都做到恰到好处的人来教育，那么这个人狂者，有进取心、心气比较高的也行，或者这个人有原则，知道有些事情不能做的也行。


    狂者进取心比较强，心气高，一心想办大事。


    狷者，有原则，有所不为。


    作为老师，当然想找到一个完美的学生，尽善尽美，能学好、千好、举一反三、有大才。这样，老师的名气、名声也会更大，也不枉费老师一番调教之心。


    一个老师，最怕把自己的时间、精力浪费在一些没什么用的人身上，任您如何教育，他就是不听、不干、不做，但是好像也在听，这些人是平庸至极的人。如果您把心思都用来教育这种人，您这一辈子算是废了。您这个老师，也不是成功的老师。一个成功的老师，首先是要挑选上好的学生的。犹如一个厨师，首先是要挑选食材的，如果食材不好，这个厨师的能力再强，做出来的食物也不会好到哪里去。


    所以，孔子说，如果不能找到顶级的学生来教育，那么就退而求其次，狂者也行啊。一个人狂妄、敢说大话、敢做大事、心气高、进取心就强。您教他，他就学，还想学好。这种人，好好调教，根据其想实现的目标，纠正他身上有问题的脾气。不断地辅助他，他也有可能成大事。


    一个狷者，有所不为，有原则，这种人靠谱。利用他的性格，让他明白很多道理，到底什么事情可以做，什么事情不可以做。他坚守下去，在对的地方发挥他的才干，他也能有成就。


    总而言之，孔子教育学生，希望这个学生是个可用之才，有可取之处。若无可取之处，浪费精力在他身上，实在是浪费生命，划不来。


    ## 22、人无恒心，干啥都干不成


    ### 原文


    > 子曰：“南人有言曰：‘人而无恒，不可以作巫医。’善夫！”“不恒其德，或承之羞。”子曰：“不占而已矣。”


    ### 陈昌文解读《论语》：


    孔子说，南方人有句话，人如果没有恒心，不可以做巫医。巫医是什么？能通鬼神，能治病。这是很了不起的本事。


    一个人如果没有恒心，当然学不会巫医。


    这句话到底要表达什么？就是说啊，您想要学到真本事，想要有大才，您必须要有的恒心，日复一日地去学，日复一日地去练习。什么事情都是建立在恒心基础之上。您做一个项目或者创业，或对一件事情感兴趣，如果您三心二意，做几天就不做了，您就不会有什么成就。真正的大事情，往往都是靠时间积累起来的。


    就说有些电子竞技选手，他们也是日复一日地练习了很多年，最终才登上了巅峰。这世界上的很多事情，很多能力根本不是一蹴而就的。


    恒心是一个人成功的必要条件。


    孔子说，这句话说得好啊。


    一个人没有恒心保持其美德，就有可能遭受到羞辱，我们自己遭到别人的羞辱，往往都是我们自己先忘记了原则、规则，授人以柄，给人机会，然后让我们自己遭到了羞辱。如果我们一直尊重规律，尊重德行，按照原则行事，就没有人能羞辱到我们。


    一个人没有恒心，做事总是摇摆不定，走走停停，三心二意，这种人，不用占卜，他一定没什么成就，做啥都不成，所以叫“不占而已矣。”


    这一段《论语》讲的就是做人必须有恒心，否则学啥都学不会，干啥都干不成，还会遭到羞辱。


    ## 23、君子与小人的本质区别


    ### 原文


    > 子曰：“君子和而不同，小人同而不和。”


    ### 陈昌文解读《论语》：


    什么是君子？真诚、善良、说实话、说老实话、讲规律、负责任，君子之交淡如水，一切尊重规律，只给您讲对的话，不为私利瞎讲。


    什么是小人？为了利益，不得罪人，只说跟您相同的话，顺应您的需求，顺应您的人性弱点，先留个好人缘再说。


    若是碰到利害关系，君子平日里面虽然针锋相对，甚至是政治死敌，也会顾全大局，大家一起努力奋斗，这就是和，虽然我们平常有些不同，但我们整体是和的。


    而小人在碰到利害关系的时候呢？平常跟您是同的，您说啥，就是啥，一碰到厉害关系，就不负责任，只为自己私利。这种人平常非常具有迷惑性，跟您玩，说您好话，只是为了捞好处，不得罪人，一碰到厉害关系，立马翻脸不认人，落井下石。


    君子的和，是理解人与人之确实因为见识、能力有所不同，意见、思想有所不同，但大家都是真诚、善良的人。


    小人的同，是不想得罪人，没有利益，没必要讲真话，心里一套，表面一套，也就是心怀鬼胎。交往、说话，都是有目的的。不走正道。这个社会上，有人采取的是小人策略，他们以为这样能获利，能左右逢源。他们碰到利害关系了，只求自保，甚至出卖您。


    有的人采取君子策略，永远真诚善良，不怕得罪任何人，即便是利害关系非常严重的人，也不怕得罪。


    历史上有一个叫魏征，就是君子，对李世民永远讲真话。李世民当然也知道他是君子，即便是在他气得破口大骂田舍翁，也没杀他。


    历史上，为什么有很多官宦干政？外戚干政？


    就是因为这些太监、外戚，只要这个皇帝要啥、说啥这些人都满足、赞同。所以，导致这个皇帝认为这个太监好得不得了，这个外戚好得不得了。


    一个人哪里可能满足您的需求？所有需求都迎合您的，必定是小人，必定只是为了“同”，出卖“和”的人。


    一个人只讲实话、真话，当然让人很生气。一般人接受不了这种人，只有高明智慧的帝王才能接受。


    大家记住，世界上永远没有“同”这回事。任何人，都是不同的，任何人都有自己的看法、意见、见识、能力。如果您说啥，就有人说您是对的，这便是小人。君子呢，他能接受大家之间的不同，然后把这些不同综合起来，不影响大家之间的真诚、善良，一切按照规律、规则办事。永远的心平气和，接受人与人之间的不同。小人则是表面随同，心不平，气不和，心怀鬼胎，目的各异。


    ## 24、价值观要分明


    ### 原文


    > 子贡问曰：“乡人皆好之，何如？”子曰：“未可也。”“乡人皆恶之，何如？”子曰：“未可也。不如乡人之善者好之，其不善者恶之。”


    ### 陈昌文解读《论语》：


    子贡问孔子，一乡的人都喜欢他，这样的人怎么样？孔子说，不好说他的好坏。


    子贡继续问，一乡的人都讨厌他，这样的人怎么样？孔子说，这也不好说，不如乡里的好人喜欢他，坏人讨厌他。


    这一段讲的就是一个爱憎分明的问题、价值观分明的的问题、立场坚定的问题。


    我们这个社会，有人八面玲珑，两面讨好，见人说话，见鬼说鬼话。其实没有立场、没有价值观、没有爱憎，见到好人装好人，见到坏人同流合污。这种人，就是乡人都喜欢。


    这种人的另一个说法，就是德之贼，其实是属于最坏的人，属于和稀泥的人。他为了讨好所有人，模糊真理。这种恶，是大恶之人，可以说是坏透了。


    一个人必然有立场，坚持自己的真实性，就必然有朋友，必然有敌人，这就是物以类聚，人以群分。好的就是好的，坏的就是坏的，黑的就是黑的，白的就是白的，没有说好坏不分，黑白不分的。


    当然，一个人让好人也讨厌，坏人也讨厌，这个人也算是极品了。这种人，就是真正的坏事做绝，跟所有人唱反调。这种人，当然没什么可取之处，连活下去，都是一种运气。


    一个真正有立场、有价值观的人，应该是好人喜欢他，吸引到对应的好人，跟对应的好人组成一个圈子。这种人，坏人当然要讨厌他了，因为他的价值观、立场、行为准则跟坏人是相反的，不跟坏人同流合污。


    这句话，也给我们讲明白了我们应该如何立身处世。我们只跟价值观正的人在一起，并且明确表示我们的价值观，宣传我们的价值观。跟我们一道的，我们交往；跟我们不一道的，我们就不交往了。


    我看有的人做直播，这直播下面，有的人已经强烈反对您，跟您唱反调了，您还留着他们干嘛？直接拉黑他就行了。因为他已经明确表示跟您不一样了，他的价值观跟您不一样，没必要同流合污，多说一句。


    ## 25、君子领导与小人领导的区别


    ### 原文


    > 子曰：“君子易事而难说也，说之不以道，不说也。及其使人也，器之。小人难事而易说也。说之虽不以道，说也。及其使人也，求备焉。”


    ### 陈昌文解读《论语》：


    这一段是讲领导哲学，一个是用来区别领导，一个是用来观察自己是一个什么样的领导。讲的是小人领导与君子领导的区别。


    “说”是悦的意思，使人愉悦、快乐、高兴。


    孔子说，君子型的领导，容易侍奉，为什么？因为这样的人就事论事，找自己的问题，反思自己，而不是找下属麻烦。


    难说也，难以取悦，您想要讨好一个君子，非常难。如果您不是用正道的方式取悦君子，君子是不会快乐、愉悦的。


    当君子使用人的时候，看这个人的能力、特长，量才而用。绝对不是求全责备，什么事情都让一个下属去干，这个下属干不了，就谩骂侮辱。


    君子能知道人与人之间的区别，下属做不好，就反思自己的用人问题，是不是自己用错了人。或者自己没有教育好下属，没有交代好，总是找自己的问题。


    这天下间是有人才的，如果我们人才凋零，自己的组织没有管理好，没有创造理想的效应，一定是领导的错误，而不是下属的错误，这是君子型领导的思维模式。


    小人型领导呢？这种人非常难以侍奉，因为其性格乖张，不按规律，想一出是一出，做事全凭喜好，有问题全怪下属，自己都是对的，这种人就是小人，不好侍奉。


    小人领导虽然不好侍奉，但是很容易取悦，您根据您的爱好、人性的弱点，去取悦他，他就高兴。随便您怎么瞎搞，通过一些不正道的手段去取悦他，他也高兴，他才不管大道是不是对他，只管他自己肤浅的精神与肉体愉悦。


    当小人型领导用人的时候，对人求全责备，交待的事情也不看这个人能不能完成，也不根据这个人的特长，只是要求您必须完成。不完成就对您辱骂、惩罚，毫无章法，一切全凭喜怒哀乐无常发挥，不会识别人与人之间的差别，也不会用人，更不会教育人，他自己就是个不靠谱的人，他怎么识别人？用人？教育人呢？


    ## 26、君子心平气和，小人骄傲急躁，表现欲强


    ### 原文


    > 子曰：“君子泰而不骄，小人骄而不泰。”


    ### 陈昌文解读《论语》：


    君子呢？泰然自若、心平气和，不假装矜持，也不骄傲，也不娇柔造作，是什么就是什么，平平淡淡、平平凡凡，又通达事理。


    小人娇柔造作、骄傲、假装矜持，内心想的和外在表现不一样。行住坐卧，待人接物都不自然，心不平，气不和，表里不一。


    君子见这个世界，按照自己内心的本来面目面对，不因为外物而委屈自己，不因为外在的人与事物骄傲。


    比如，见到地位高、富有的人，也不巴结；见到地位低的、贫穷的，也不鄙夷。正常交流，不自卑，也不骄傲。


    小人呢，见到富有的、地位高的人，赶快巴结，好话说尽。见到地位低的、贫穷的，就面露鄙夷之色。


    其实巴结富人、权贵，也不一定给自己带来什么，反而让自己没了尊严，自己都看不起自己。其实鄙夷贫穷的人也得不到什么好处，反而可能给自己带来意想不到的灾难。


    小人有点什么，就骄傲，或者恃才傲物，生怕别人不知道自己似的。


    君子呢，藏器于身，待时而动。虽然有才华，平常也注意练习自己的能力，但都藏起来，跟没有一样，等到需要他的时候，他才使用他的才华。

    '
