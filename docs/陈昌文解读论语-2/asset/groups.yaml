    # 21、孔子为什么生冉求的气


    **原文**

    季氏富于周公，而求也为之聚敛而附益之。子曰：“非吾徒也，小子鸣鼓而攻之可也。”


    **陈昌文解读《论语》：**


    季氏这个人非常富裕，是权臣，已经比以前的周公还富裕了。天天还想更富，到处求如何收刮民脂民膏的方法，来找过孔子，孔子不回答季氏，季氏就找了孔子的弟子冉求。冉求，孔子的弟子，善于理财，就帮助季氏继续聚敛财富，收刮民脂民膏，增加赋税。


    孔子很生气，就说，冉求不是我的徒弟，您们这些徒弟子们，击鼓去攻打他也可以。孔子一是希望季氏要体恤民众，不要贪得无厌。二是希望自己的弟子不要助纣为虐，可以劝阻季氏。孔子的愿望都落空了，当然是很生气。教了徒弟一身好本事，徒弟却拿着这身好本事干坏事，谁能不生气？


    # 22、性格影响命运的走向


    **原文**

