    陈昌文解读《论语》：


    长沮、桀溺，两个站在水边耕地的人，一个身材长，就叫做长，站在水边，所以叫做长沮。一个身材壮实，叫做桀，所以叫做桀溺。这两个名字都是代指。


    孔子驾车从这个地方过，看见了他们，让子路去问渡口在哪里，估计是要渡河。长沮说，那个拿着缰绳的人是谁啊？子路说，是我的老师孔丘啊。是鲁国那个孔丘吗？子路说，是啊。长沮说，既然是那个孔丘，天下事他都知道，怎么不知道渡口在哪里呢？还要来问我？


    这就是讽刺孔子了，您不是牛吗？厉害吗？一个小小的渡口在哪里，还需要问我？子路看这人不太好啊，不好交流，就换桀溺问。桀溺说，您是谁啊？子路说，我是仲由啊。是鲁国的孔丘的徒弟吗？子路说，是啊。桀溺说，这天下滔滔，您要顺应天时，天下已经坏的没办法了，世道不好，到处都是一个样，您这老师东奔西跑的，改变不了什么的，还要躲坏坏人，找到明君，我看您们是在做梦啊。不如跟我们一样隐居了算了，做个隐士，也没必要躲坏人了。找什么渡口，这天下渡不了，没办法，别找了。然后就不搭理子'
