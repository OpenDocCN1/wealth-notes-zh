    ## 17、老师的快乐就是得天下英才而育之


    **原文**


    闵子侍侧，闵闵如也；子路，行行如也；冉有、子贡，侃侃如也。子乐。 “若由也，不得其死然。”


    **陈昌文解读《论语》：**


    闵子骞这个人，随时都是恭敬而正直的样子。子路这个人，非常勇敢，非常刚强，是一个勇士、一个将军、一个保镖。冉有这个人会理财，会管理，多才多艺。子贡当然是儒商鼻祖，更是理财高手，也能言善辩。冉有、子贡看起来温和而又快乐。孔子就乐了。为什么乐？人才济济啊，得天下英才而育之，是人生极大的快乐。要是一个老师周围有很多人才，这个老师当然感觉快乐。犹如一个老板周围有很多得力干将，您能不快乐？


    不过也有不完美的地方，就是子路这个人，太过刚强、勇敢，而且特别好义气。所以，孔子评价他，子路，不得好死啊。这当然不是诅咒子路，而是根据子路的性格推断子路在那个乱世的结局。子路这种人，刚强、勇敢、好义，碰到点事情，就会舍生取义了。后来，子路也确实在一场本来可以躲避的叛乱中舍生取义了，被剁成了肉泥。


    ## 18、闷声发大财，不要大张旗鼓地找自己打不过的对手打


    **原文**


    鲁人为长府。闵子骞曰：“仍旧贯，如之何？何必改作？”子曰：“夫人不言，言必有中。”


    **陈昌文解读《论语》：**


    鲁国人要改建长府，把这个长府修建得更好些。闵子骞说，就照原来的样子吧。原来的样子如何？为什么非要改建？孔子说，闵子骞这个人话很少，但是一说话，就说对了，说到点子上了。


    鲁昭公这个人，想要修建长府。鲁昭公被季氏三家权臣欺负，心里不爽，就修建长府，打算大张旗鼓的政变，或者说要攻打季氏等权臣。闵子骞是微言大义，您不要那么大张旗鼓的，您就跟什么都没变一样，为什么要大张旗鼓的改建长府呢？这样让大家都知道您要干什么了。您实力也并没有那么强大，您能干得成？还不如一切照旧。


    一切照旧有两个意思，打不过别人，就别打，您仍然当您的君王。权臣再厉害，也是权臣，他现在也不能把您怎么样。如果您非要大张旗鼓的搞季氏，对方狗急跳墙，可能适得其反。二是，您即便是想攻打别人，也要偷偷行事，不要大张旗鼓，别人都准备好了呢？您还打什么呢？要攻其不备。


    孔子说，闵子骞这个人，平常不说话，一说话，就说透彻了本质，说到核心点了。


    ## 19、不要跟风批评比自己厉害的人，要学习比自己厉害的人


    **原文**


    子曰：“由之瑟，奚为于丘之门？”门人不敬子路。子曰：“由也升堂矣，未入于室也。”


    **陈昌文解读《论语》：**


    孔子说，子路鼓瑟，鼓的很差异啊，没有味道。子路这个人性格鲁莽、勇敢、急躁。这样的人很难精通乐器，这人啊，如果演奏音乐，其性格会融入音乐中。子路鼓瑟，也会传递自己的性格特征给听众，听众听了，会感觉到子路急躁、鲁莽的性格。所以，孔子就说了，子路就鼓瑟鼓成这样子，怎么可以在我的门下呢？亏您还是我的门下弟子。


    这当然是一个善意的批评，希望子路改进。其他弟子们听了，就不尊敬子路了，觉得老师都批评您了，证明您不行啊，子路您也没什么事。孔子知道了，就说，子路啊，已经登堂了，已经初窥门径，学到点东西了，只是还没入于内室。您们这些人，连门都没摸到，还不赶快跟着子路学？


    这里有一个很有意思的社会现象，就是一个人其实很厉害了，但是呢，有比他更厉害的人批评他，然后就有那些普通人、不怎么样的人，跟着批评这个很厉害的人，跟着不尊敬这个很厉害的人。其实这个人已经非常厉害了。


    所以啊，高明的人，都能知道自己几斤几两，也能知道谁是真正厉害的人，而不是跟风去批评谁。其实，您批评的很多大佬，都您厉害几百倍、几千倍、几万亿倍，您学习都来不及，不要跟风去批评。


    您若要批评谁，您先掂量一下自己的斤两，看看您跟您批评的那个人有多大差距。


    ## 20、做事要讲究适度，不过分，也不差火候


    **原文**


    子贡问：“师与商也孰贤？”子曰：“师也过，商也不及。”曰：“然则师愈与？”子曰：“过犹不及。”


    **陈昌文解读《论语》：**


    师是子张，商是子夏。子贡问孔子，子张与子夏谁更贤德啊？孔子说，子张有点过分了，子夏呢，又差点火候。子贡就说，那么是子张更贤德了？意思是，过了总是比不及好吧。孔子说，过分了和不足是不一样的。子张这个人，学习刻苦努力，什么都想跟圣人一样，简直学习到走火入魔的地步。而子夏这个人呢，做什么事情，都缺点火候，得过且过。


    学习刻苦努力当然好，但过分了，就会出现很多问题，一是身体搞坏了，忽略了其他问题。二是不能持续，因为人始终是会累的。要恰到好处。这就是中庸之道。而不及呢？学什么都差得不多就行了，蒙混过关，容易让人堕入平庸，虽然比大部分人好点，但是也很难有什么顶尖的成就。


    所以，一个高明的人，是张弛有度，该睡觉睡觉，该工作工作。绝对不是一曝十寒，也不是得过且过。比如，我们很多人创业，开始的时候激情满满，没日没夜地奋斗，干了3个月，没出成绩，就绝望了，就放弃了，我这么努力，还不成功？这些人，往往都是忽略了事物的规律，只会感动自己。


    还有一种人创业呢，他还以为他在打工，慢悠悠的，朝九晚五，结果储备的资金用光了，还没搞到业务，就破产了。


    真正的高手是不紧不慢，长期作战，能持续的活下去。做事要讲究适度。不过分，也不差火候。


    ## 21、孔子为什么生冉求的气


    **原文**


    季氏富于周公，而求也为之聚敛而附益之。子曰：“非吾徒也，小子鸣鼓而攻之可也。”


