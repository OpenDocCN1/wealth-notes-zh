    # 27、修炼自已剛毅木讷的性格


    # 原文


    子曰：“刚、毅、木、讷，近仁。”


    # 陈昌文解读《论语》：


    这句话短小精悍，但值得深入研读，反复琢磨，对人的提升非常大。也容易背诵，也容易用来对照、佐证自己，纠正自己。


    什么样的人才算近仁，您做不到仁，您就按照这四个字代表的四种性格去鞭策自己。


    第一是刚。


    做人要刚强，怎么会刚？无欲则刚，无欲是什么意思？不受任何诱惑，美色诱惑、好玩的诱惑、物质诱惑，您都不受到，坚守自己的目标、自己的节操，您就是刚。


    刚强的人具有正气，有邪气的人，这脸色、神态，刚不起来。


    第二是毅。'
