    # ## 3、当领导的精髓思想


    # ### 原文


    仲弓问仁。子曰：“出门见大宾，使民如承大祭。己所不欲，勿施于人。在邦无怨，在家无怨。”仲弓曰：“虽言不敏，请事斯语矣。”


    # 陈昌文解读《论语》：


    仲弓，就是冉雍。孔子说，冉雍可使南面为王，这基本是孔子弟子中最好的评价。冉雍的德行，是可以当王的，统治天下。


    冉雍也跑来问，什么是仁，所以孔子对他的回答，更像是在教一个王，而我们能从孔子的答案中，学会的是如何做一个领导。因为王也是领导啊，甚至也可以说，是孔子对领袖的教导。


    孔子说，出门如见大宾。


    只要您出了门，您见到的任何人，都是大宾。什么是大宾？就是贵宾，这出租车司机是贵宾，扫马路的也是贵宾，您的员工也是贵宾，您的朋友、亲戚、同事都是贵宾。总而言之，言而总之，您见到的一切，您都当成贵宾。果能如此，您这个人一定少灾少难，而且每个人都会回馈您、帮助您。


    我们经常看到一些新闻，某些人因为不礼貌，在外面跟人争吵，闹出人命，伤了自己，伤了别人，就是不懂孔子这句话，出门在外，见到任何人，都是贵宾。'
