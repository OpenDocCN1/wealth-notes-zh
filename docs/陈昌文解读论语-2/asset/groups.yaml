    君子对圣人的言论，听话、照做、执行，认真对待，认真思考、琢磨，理解且执行。小人则不然，小人侮辱圣人言论，藐视圣人言论，认为圣人讲得也没 gì了不超，都是大道理，没用，甚至辱骂圣人以此来彰显自己与众不同，彰显自己的能耐。这些都是极其愚蠢又无知的行为。小人不知道天高地厚，狂妄无如，以踩踏圣人言论为能事。


