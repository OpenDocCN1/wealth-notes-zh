    ## 2、仁的具体操作方法


    ### 原文


    颜渊曰：“请问其目？”子曰：“非礼勿视，非礼勿听，非礼勿言，非礼勿动。”


    颜渊曰：“回虽不敏，请事斯语矣。”


    ### 陈昌文解读《论语》


    这节学问极大，希望大家极其重视。


    前面孔子讲了什么是仁，颜渊继续追问，仁的目录是什么呢？仁的具体操作方法是什么呢？颜渊真是好学生啊，要落实到具体条目、具体干法上。而不是像有的学生那样，孔子还没开口，他们就说懂了，等孔子说一句，他们就不问了，以为自己懂了。


    然而颜渊这个学生，不认为自己聪明。其实，颜渊闻一知十，很聪明，但是他不认为自己聪明，继续问。他继续问，孔子就继续讲，孔子讲仁的具体方法了。如果颜渊不问这个，估计我们这一辈子都不知道如何操作这个“仁”字，中国几千年就少了一个重要的方法。


    孔子说：


    - 非礼勿视。不符合礼的，不好的，不按照规矩的事情，您不要去看。

    - 非礼勿听。不符合礼的，不好的，不符合规律的，您不要听。

    - 非礼勿言。不符合礼的，不好的，不符合规律的，您不要说。

    - 非礼勿动。不符合礼的，不好的，不符合规律的，您不要行动。


    颜回说，我虽然不聪明，这几句话，我要听话、照做、执行。


    一个人倒霉，首先就是看了不该看的，被绕进去了。比如，街上看人下象棋、赌博，自己也去看，看着看着就开始参与，于是就被罚了。


    当然，有时候我们不看，结果别人叫我们去看，这就是听到了非礼的东西，听到了，赶快跑，不要听，这是高手。但是有些人行，虽然不去看，但是被人劝说，被声音吸引，于是跑去看，听了就上了瘾了，就跟着去干坏事了。有些人呢，看到了，听到了，自己也去传播邪道、坏事。说着说着自己也信了，就参与坏事，结果倒霉了。


    当然，一个人要倒霉，最终还是行动了。


    最后一步，非礼勿动。如果您看了、听了，也嘴巴上讲，但是没有行动，您不会倒霉。或者说倒霉的几率小。但是您行动起来，您大概就要倒霉了。


    视、听、言、动，也是一个递进关系。


    所以一个厉害的角色，首先是管住这四个点。绝对不看、不听坏东西，不说坏东西，更不会行动。远离一切恶，则您的世界就仁了。


    这个世界上总是有些坏人坏事，您不要去、听、说、干。那是别人的事情，您要保证您从源头上杜绝这些坏事。您想想，分析分析，就知道一切的罪恶、倒霉，都是从看了不该看的，听了不该听的，说了不该说的，干了不该干的开始的。一个高手，一门心思走正道，杜绝一切不好的东西出现在自己的眼睛、耳朵、嘴巴、行为上，这个人自然就快乐。


    眼睛、耳朵是输入信息；嘴巴、手脚是输出信息。管好输入的信息，管好输出的信息，这个人就是仁人了，就是懂礼了。我们既不让别人用有害信息毒害我们，我们也不用有害信息、行为去毒害别人，这就是仁。


    这就是为什么我喜欢儒家思想的原因，孔子能把每一个高深莫测的概念讲到具体的行住坐卧上，让每一个凡人、普通人都能听话、照做、执行，有据可查。而其他思想，有的玄之又玄，您学一辈子，都不知道他在说什么。颜渊听了，说，我虽然不聪明，以后我就听话、照做、执行。颜渊曰：“回虽不敏，请事斯语矣。”


    ## 3、当领导的精髓思想


    ### 原文


    仲弓问仁。子曰：“出门见大宾，使民如承大祭。己所不欲，勿施于人。在邦无怨，在家无怨。”仲弓曰：“虽言不敏，请事斯语矣。”


    ### 陈昌文解读《论语》


    仲弓，就是冉雍。孔子说，冉雍可使南面为王，这基本是孔子弟子中最好的评价。冉雍的德行，是可以当王的，统治天下。


    冉雍也跑来问，什么是仁，所以孔子对他的回答，更像是在教一个王，而我们能从孔子的答案中，学会的是如何做一个领导。因为王也是领导啊，甚至也可以说，是孔子对领袖的教导。


    孔子说，出门如见大宾。


    只要您出了门，您见到的任何人，都是大宾。什么是大宾？就是贵宾，这出租车司机是贵宾，扫马路的也是贵宾，您的员工也是贵宾，您的朋友、亲戚、同事都是贵宾。总而言之，言而总之，您见到的一切，您都当成贵宾。果能如此，您这个人一定少灾少难，而且每个人都会回馈您、帮助您。


    我们经常看到一些新闻，某些人因为不礼貌，在外面跟人争吵，闹出人命，伤了自己，伤了别人，就是不懂孔子这句话，出门在外，见到任何人，都是贵宾。


    使民如承大祭。


    您使用您的人员，跟您办事的人，犹如祭祀一样尊重、重视，不出问题。人民感受到您尊重他们，他们就是您的祖先，您在跪拜他们，他们就会非常努力，非常用心，真正的帮您做事。您的事情也就能做好了。


    当然，这不是权术，您真这样做，保证您的跟随者有饭吃，有钱花，得到很多利益，则他们会更努力给您卖命。从心理以及物质上都尊重他们。


    - 己所不欲，勿施于人。自己不想要的，不要给别人，要有同理心。自己不想被骗，就不要骗别人；自己不想吃苦，就不要让别人吃苦；自己不想亏本，就不要让别人亏本。

    - 在邦无怨，在家无怨。在外面不要怨恨任何人，不要怨恨老板、同事、合伙人；在家里不要怨恨老婆、孩子、父母。一切都是自己的问题，是自己没做好，自己想办法去修正。怨恨只会让大家讨厌您，让事情变得更糟糕，让您遭受恶报。怨恨只会让您一时爽，于人、于事情都没好处。


    如果能做到以上四点，这个人就仁了，就能当好领导。冉雍说，我虽然不聪明，但我愿意听话、照做、执行。


    孔子这几个得意弟子，都是问了就听话、照做、执行。而有些不怎么样的弟子，就会反驳、反问。那都是不服气、自作聪明的象征。


    ## 4、想清楚了再讲话


    ### 原文


    司马牛问仁。子曰：“仁者，其言也切。”曰：“其言也切，斯谓之仁已乎？”子曰：“为之难，言之得无切乎？”


    ### 陈昌文解读《论语》


    司马牛也来问老师，老师啊，什么是仁啊？


    孔子对每个人的回答都不一样，因为孔子是因材施教、量体裁衣，每个学生有每个学生的优点、缺点，所以要的答案当然也是不一样的。


    司马牛这个人说话快，又不经过思考，天天说。于是孔子就回答他，仁啊，就是说话慢慢说。司马牛大为惊讶，说话慢慢说？这么简单？这就是仁了啊？孔子说，您别看这个简单，做到非常难啊，难道您说话做到了慢慢说？


    我也经常教育人，说这个人不会说话，很多人就很惊讶，我不会说话？我小时候就会说话了好吧？您为什么说我不会说话？


    言语，君子之动天地也。


    言语是统治人思想的，也是传播思想的，是构成这个社会的重要一环，可以说人类有了言语能力，才有了团结能力、思想传播能力，人类才撑起了这么大的文明。这言语难道是小事吗！


    很多人以为他会，这完全是高估自己。


    您说话，您说的是对的吗？不对，您还在说？就不是仁。您说的是真的吗？假的，自己都搞不清楚的，您还说？您说的，您能做到吗？要说的对，说的真，说的都能做到，说出来对人有作用，还不伤人。这些您都能做到吗？


    说话是一个人思想的终极体现，甚至是一个人本领的终极体现，一个人逻辑的体现。慢慢说，想清楚了再说。可不要像司马牛这样，很惊讶的问孔子，就这么简单？所以司马牛同学就没有颜渊、冉雍有境界，有深度。


    那些有深度的同学，一般都说，我虽然不聪明，老师您讲的太高深了，但是我愿意听话、照做、执行老师教我的。这不怎么行的学生，他什么都不懂，然后您告诉了他，他也领悟不了，但是他，啊反而觉得自己领悟了，还觉得您说的太简单了，不是教我真功夫，实际上啊，是因为这种学生太浅薄。


    大家对照一下自己，您是颜渊、冉雍这种学生呢？还是司马牛这种学生？但愿你们能做颜渊、冉雍这种学生。


    ## 5、对得起自己的良心，就是君子


    ### 原文


    司马牛问君子，子曰：“君子不忧不不惧。”曰：“不忧不惧，斯谓之君子已乎？”子曰：“内省不疚，夫复何惧？”


    ### 陈昌文解读《论语》


    司马牛前面问了仁，孔子说，说话慢就是仁。回答非常简单，司马牛有点茫然。这里司马牛又问，那么什么是君子呢？司马牛非常喜欢问孔子核心问题。整天讲仁，整天讲君子，到底有个什么标准？


    孔子说，不忧愁，不恐惧，就是君子。


    又该司马牛茫然了，这么简单？不忧愁，不恐惧，就是君子了？这样就叫君子了？显然，司马牛再一次陷入了茫然，不相信答案这么简单。


    孔子说，你别以为简单啊，你内心里没有愧疚，都是凭良心做事，又有什么忧愁，又有什么恐惧呢？剩下的事情，交给天意吧。


    不忧愁，不恐惧的核心是什么？是内省不疚，也就是完全凭良心，凭着良知良能。我们每个人内心里，其实都知道对错，都知道哪些事情应该做，哪些事情不应该做。


    一个人对得起自己的良心，为人不做亏心事，夜半不怕鬼敲门。什么意思？我的思想、行为都是端正的，我做的任何事都是坦坦荡荡的。没有欺骗，没有做过任何坏事，我自然睡得着。即便是有人找我麻烦，甚至是倒霉了，我也坦然接受，这是命运的安排。


    所以，您看，当君子其实安好，君子坦荡荡嘞。而当小人，成天算计别人，做坏事，搞破坏，这些人总是怕人报复，或者知道自己要倒霉，只是时候没来。这些人，天天的忧愁、恐惧。所以当小人其实划不来，而当君子划得来。


    我们在社会上安身立命，要做到不忧不惧，就是不要做对不起自己良心的事情，一个人对得起自己的良心，他就是君子了，就这么简单。当然每个人的良心的标准是不一样的，如果大家想要把自己的良心真正做到一个标准，还是要多读儒家思想，不然成了愚蠢的人。愚蠢的人更可怕，就是干了坏事而不知道，而无所畏惧。这种人最可怕。


    所以，要多学习一下儒家思想，以免自己是个十恶不赦的人，坏透了的人，自己还不知道。


    ## 6、把事情做好，对人有礼貌，就能事业飞黄腾达


    ### 原文


    司马牛忧曰：“人皆有兄弟，我独亡。”子夏曰：“商闻之矣：‘死生有命，富贵在天。’君子敬而无失，与人恭而有礼。四海之内，皆兄弟也。君子何患乎无兄弟也？”


    ### 陈昌文解读《论语》


    司马牛很忧愁啊，天天忧愁，又发表言论了，人们都有兄弟啊，我没有兄弟啊，司马牛本来是贵族，要权力、财富都有，但是其兄弟司马桓魉搞叛乱，这一下司马牛什么都没了。司马牛失去了一切，就是因为他的兄弟，所以，司马牛说我没有兄弟啊，我本来有荣华富贵的，过得好好的，我这兄弟，搞叛乱，弄的我什么都也没了，我失去了兄弟，表面上是失去了兄弟，实际上是失去了自己应该有的一切。


    这让谁都不爽，自己没做错什么，自己周围的人做错了一些事情，自己受到了牵连，让自己失去了本来属于自己的东西，这让谁都忧愁。


    子夏听了说，我听说的啊，死生是有命运安排的，富贵这种东西，有天命，这是什么意思呢？就是一切发生的事情啊，您要坦然接受，这东西不是您能左右有的，这是上天的事情，如果您一直忧愁，其实情况也不会好转，不如开开心心的接受。


    从逻辑上来讲，一个人无论遇到多大的风波、坏事，都应该接受，以前吃了亏了，女朋友分手了，谁给您造成牢狱之灾了，谁给您造成经济损失了，已经是既定事实，您就要学会接受。而不是痛苦，而不是忧愁。


    成事不说，既往不咎。事情过去了，就过去了，开开心心的接受。我们要做好的是现在的事情，以及为了未来活得更好。如果您领悟了这个逻辑，您就没什好忧愁的了。


    君子呢，天天非常严肃认真的做事，从来没什么过错，对人又很有礼貌，您如果这样做，大家都会对您好。那么，到处都是您的兄弟了。一个君子，不会患没有兄弟啊，后面这段话更强调自己的努力，也就是您失去了一切，没关系，您只要严肃认真的做事，事情做好了，然后您又对人恭敬、礼貌，您的人缘不错，什么都会来的。


    其实老生常谈就这东西点，但是很多人一辈子都做不道，也觉得社会难混，天天忧愁。后面这几句话，就是混社会的真理，也是得到一切的真理。首先是您能做事，把事情做好，您当然就能安身立命了。然后是您能维护好人际关系，您的事业就会进一步，您要的东西就更容易实现。如何维护好人际关系？就是恭敬任何人，对任何人有礼貌，如此，您就有了无限的兄弟，您还能回到以前的荣华富贵。


    当然，这话对大多数人来讲，也就是听听。您要我认认真真做事？这基本上对大多数人来讲, 是不可能的。您还要让我对任何人都恭敬、礼貌？这基本上都是做梦了。大家对我恭敬礼貌还差不多，凭什么我对大家恭敬礼貌？这就是大多数的想法。


    - 做事认真，无差错；

    - 对人礼貌恭敬。


    就这两个点做到了，事业、人生就会飞黄腾达。


    ## 7、做明君的标准


    ### 原文


    子张问明。子曰："浸润之谮，肤受之愬，不行焉，可谓明也已矣。浸润之谮，肤受之愬，不行焉，可谓远也已矣。"


    ### 陈昌文解读《论语》


    子张问，什么是明。我们看电视剧、电影、小说，经常有个词语，叫这个人是昏君，这个人是明君，就是指的这个明。


    - 昏君是什么？就是糊里糊涂，分不清黑白，被人诓骗。

    - 明君是什么？就是是非黑白、好坏，他都知道。您休想骗他，他知道该表扬谁，也知道该批评惩罚谁，任何人都别想欺骗他。


    所以，当老板的一个重要本事就是明，若此人不名，给个江山也白给，他迟早败掉，若此人很明，则能从小到大，而且能把昏君的江山都给抢过来。


    这骗人有两种最厉害的把戏，两种最厉害的把戏都骗不了的人，就是明了。孔子说，浸润之谮是一种把戏。


    真正骗人的高手，不是明目张胆的骗，而是旁敲侧击的骗，造成一种假象，还说的很真诚，为您好的样子，很多人都会被这种骗人的把戏给骗了。


    一个人的位置越高，他周围坏人的骗术就越高明、精湛、真诚。


    所以，明君的方法当然是明察秋毫，明君的方法是什么都知道，什么都有，自己也在收集大量的信息，自己搜集了很多信息进行对比，所谓偏听则暗，兼听则明，意思就是当一个明君，一定要多听很多人的意见，拿来斟酌。让坏人不敢骗您，没机会骗您。


    秦二世被赵高哄骗，就是因为只听赵高的，连李斯的都不听了。


    第二种高级的骗术是肤受之愬。


    这种人最可怕，他为了骗人，能痛哭流涕，能给自己皮肤上受点伤，也就是出血了。苦肉计。黄盖被周瑜打，去骗曹操说投降了，就是这种。痛哭流涕，皮开肉绽，情真意切，这让曹老板不得不相信啊。其实曹老板自己也想有人来投降，也就轻敌了。于是想象黄盖说的是真话，结果被假投降，黄盖当了攻打赤壁之战曹操的先锋，曹操损失惨重。


    如果这两种骗术，都在您面前行不通，您就是明了，您不仅很明，您还非常高远，高深莫测，有德行，您就是个厉害角色。


    想象一下，一个人非常智慧，什么高明的骗术都骗不了他，这个人是什么人？一定非常勤奋，什么信息都知道，而且极度聪明、智慧，这种人，一定会成大功。要成为一个明君，其实是难上加难的，我对大家的建议，就是多收集信息，多想想，慢慢想，想清楚，不要着急下决定。


    我个人当老板的经验就是，下属给您一个信息，您不要一惊一乍的，立刻做出反应。多听，不要听到自己不开心的，就心态爆炸，多想想，多查一查，是不是这样的？自己沉默着查，也不要听到有人报喜就高兴，还是沉默、多等等。


    我经常这样，很多下属也就不敢骗我了，因为他们发现，他们骗我的时候，我也是沉默的，他们就搞清楚我的底细了。当然，这是因为我不是明君，出此下策。因为我智慧不够，这个经验也介绍给大家。


    ## 8、领导大家的三个关键点


    ### 原文


    子贡问政。子曰：“足食，足兵，民信之矣。”


    ### 陈昌文解读《论语》


    子贡问孔子，怎么样治理一个国家。孔子说，给大家饭吃，给军队保护，让人民信任您。


    就这三条，这是治理一个国家的本质。


    人是必须吃饭的，按照现在来讲，人是必须要赚钱的，您必须带领大家有利润，有饭吃，否则，大家就不跟您混了。领导人要找粮食，找钱。不要怨恨大家不赚钱，要想尽办法给大家降低赚钱、吃饭的难度，尽可能弄更多的资源给大家。让大家吃饭容易，赚钱变得容易，要高标准要求自己。


    足兵，领导人要保护大家，要给大家安全感，要有风险管控意识。出了问题，人命关天，兵者国之大事，不可不察也。保护自己的人民不受外来侵略者伤害。


    要让人们信得过您，而不是要求人民无条件相信您。人民觉得您这个领导人可信，才会跟随您，才会为您付出，否则，都是表面上的唯唯诺诺。


    当领导的，实际上是不断地要求自己，而不是要求人民做到什么，是要求自己做什么。


    ## 9、遇到困难最先解散的是军队


    ### 原文


    子贡曰：“必不得已而去，于斯三者何先？”曰：“去兵。”


    ### 陈昌文解读《论语》


    前面我们讲了，孔子说一个君主最重要的是让人民有得吃，有军队保护，对人民有信义。这里子贡开始追问，如果因为不可抗拒的危机，这三条*必须*去掉一条，先去掉哪条？孔子说，去掉兵。


    有人就有疑问了，去掉兵，不怕人民造反吗？不怕别的国家来打您吗？如果您一直在给人民找饭吃，也不失信于民，则人民自然会保护您，也不会造反，别的国家也不敢来攻打您，您的人民自然会对抗其他侵略者。


    相反，历史上有很多人是为了抓军权，不给人民饭吃或者欺骗老百姓，则就算这个人再强大，也会被颠覆。历史上的例子比比皆是，很多朝代二世而亡，虽然国家很强大，还是败落了，都是因为失信于民，只顾自己吃，拼命抓军权，而不知道要给老百姓找饭吃，且经常失信于民。


    ## 10、信用比吃饭还重要


    ### 原文


    子贡曰：“必不得已而去，于斯二者何先？”曰：“去食。自古皆有死，民无信不立。”


    ### 陈昌文解读《论语》


    学习儒家思想，首先要理解儒家思想是要求自己凡事上琢磨，从来不是要求别人。


    君主有三个东西最重要，有吃的，有军队，有信用。前面说了遇到危机非要去除一个，就先去除军队，现在还有食物，以及信用。遇到危机是先去掉信用？还是先去掉食物呢？这是子贡进一步追问孔子。对于大多数人来讲，一定是先失去信用的，因为只要有饭吃，管他那么多？所以，古代也有很多的人，为了食物，而不讲信用的。天天骗老百姓，老百姓最后不相信君主了，君主就干啥也干不好了。


    周幽王烽火戏诸侯，这个人更过分，为了娱乐，把信用去掉了，所以丢了命。失信于人是最愚蠢的行为，名声传播开了，别人不跟您玩了，不跟您做生意了。所以很多大人物，大的生意人，都说信用比命还重要，因为他们知道丢失了信用，就丢失了一切。商鞅变法，徙木立信，就是为了给老百姓建立一个我们君主是可以相信的这样一个印象。


    信任是政治的本质，当然也是商业的本质，也可以说是人与人之间交往的本质，没有任何人愿意跟一个不讲信用的人交往。去掉食物，也不能去掉信用。况且，您去掉食物，也是分给了大家，大家只会更信任您。只要大家信任您，您就可以东山再起。没饭吃不要紧，反正大家都会死，如果没了信用，人民不可能再听您的了，您也就国破了，国破了的君主想要活命，好像不太可能。自古以来，国破了，这个君主还能活得好的，寥寥无几。


    去掉食物，信用在，翻身的几率还是有的。而去掉信用，即便是有食物，估摸着自已人都要开始造反了，不用等到敌人来了。


