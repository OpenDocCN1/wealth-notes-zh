    # 26、君子心平气和，小人骄傲急躁，表现欲强


    原文


    子曰：“君子泰而不骄，小人骄而不泰。”


    陈昌文解读《论语》：


    君子呢？泰然自若、心平气和，不假装矜持，也不骄傲，也不娇柔造作，是什么就是什么，平平淡淡、平平凡凡，又通达事理。


    小人娇柔造作、骄傲、假装矜持，内心想的和外在表现不一样。行住坐卧，待人接物都不自然，心不平，气不和，表里不一。


    君子见这个世界，按照自己内心的本来面目面对，不因为外物而委屈自己，不因为外在的人与事物骄傲。


    比如，见到地位高、富有的人，也不巴结；见到地位低的、贫穷的，也不鄙夷。正常交流，不自卑，也不骄傲。


    小人呢，见到富有的、地位高的人，赶快巴结，好话说尽。见到地位低的、贫穷的，就面露鄙夷之色。


    其实巴结富人、权贵，也不一定给自己带来什么，反而让自己没了尊严，自己都看不起自己。其实鄙夷贫穷的人也得不到什么好处，反而可能给自己带来意想不到的灾难。


    小人有点什么，就骄傲，或者恃才傲物，生怕别人不知道自己似的。


    君子呢，藏器于身，待时而动。虽然有才华，平常也注意练习自己的能力，但都藏起来，跟没有一样，等到需要他的时候，他才使用他的才华。'
