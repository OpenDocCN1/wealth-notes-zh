    当您规劝上级，进谏的时候，您也得先取得信任。如果不能取得信任，上级就会以为您是在辱骂他，在故意嘲讽、讽刺他。人都有逆反心理，都听不得好话。真正要进谏，也必须平常积累信用，表现好。您得平常一直为上级考虑，让上级理解，您做的每一件事，都在帮助上级，都是顾全大局，为'
