    接下来讲辨惑，如何做到不疑惑？


    人的疑惑大多来于自己的认识不清楚，会一会儿一个变化，这个变化就是好恶。爱之欲其生，喜欢一个人的时候，就希望他各方面都好，吃饭、睡觉、事业，什么都好。无论是男女关系，还是事业关系，甚至是仰慕的粉丝关系，'
