    ## 33、君子是用来担当重任的，小人是用来做小事的，不能错位


    ### 原文


    子曰：“君子不可小知，而可大受也；小人不可大受，而可小知也。”


    ### 陈昌文解读《论语》


    孔子说，一个君子在具体的小事上未必做得好，但是却可担当大任。而小人呢，是万万不可担当大任的，但是他在小事上却可能做得很好。


    这一段是讲用人的问题，君子与小人的用处区别。


    君子主要是有德行，德行能领导才能，能驾驭才能，这样的人主要是用来做领导，当管理者的。他可能不在意小的事情，也不愿意把自己的才华拿去做小事。


    小人呢，他的才智都去钻研小的地方了，在小地方发挥得游刃有余，可以受到宠幸。但是这样人，他的品格修炼、德行修炼或许不过关，大局观不一定有。小人，就适合做小事，如果您因为小人的才华，就把他弄去担当大任，可能就会祸国殃民。


    历史上有很多小人，因为小的才华受到君主的赏识，而步步高升的，比如，《水浒传》里面那个高俅，就因为蹴鞠玩得好，从一个小人变成了太尉，最后当然是祸国殃民。


    作为管理者，您必须搞清楚谁是君子，谁是小人，谁的才华、心胸可以在什么地方用。不要把君子放到小事上去搞，他不喜欢，他可能就走了。您就丢失一个人才。也不要把小人弄到他不堪重任的重要位置上，否则，他就给您带来巨大的损失。


    没有用人、识别人的能力，很难做好一个管理者。识别人、用人是管理者修炼的重要课题。


    每个人都有每个人的用处，知人善用，用人得当，那么，您这个组织就会蓬勃发展。搞不清楚人的气量、德行、才干、格局，乱用人，那么这个组织就很难发展。


    ## 34、我们要践行仁义道德


    ### 原文


    子曰：“民之于仁也，甚于水火。水火，吾见蹈而死者矣，未见蹈仁而死者也。”


    ### 陈昌文解读《论语》


    孔子说，人们需要仁德，比需要水火还需要。去蹈水，有人被淹死；去蹈火，也有人被烧死，但是还没有见过践行仁德而死的人。


    这句话是什么意思？


    人们当然是需要水做饭，需要火烹饪食物的，没有水火，人没得水喝，没有火取暖和使用，这人就要死。可见水火对人多么重要，但是更重要的是仁德。人没有仁德，就不称其为人了。人内心没有仁德，这个人就不知道是什么东西，可能会发狂，可能会坏事做绝。这种人，也不可能当一个领导，也没办法做管理，也没办法做君王，没有人依附他。没有仁德的人是非常可怕的。


    人们需要仁德，更需要有人践行仁德，需要管理者践行仁德。


    您去玩水，可能被淹死；去玩火，可能被烧死。但您践行仁德，大家都以您为榜样，喜欢您、爱护您、跟随您、推荐您做他们的领头人，则您的日子只会越来越好。


    既然仁德比水火都重要，人们如此需要依赖仁德的人，我们为什么不践行仁德呢？


    孔子的意思是，强烈要求我们践行仁义道德。


    ## 35、只要是行仁德，做好事，您就要争第一，不必请示谦让于老师


    ### 原文


    子曰：“当仁不让于师。”


    ### 陈昌文解读《论语》


    孔子说，当遇到要行仁德的时候，您不要谦让，就算碰到老师，也不要让老师先上，自己赶快去干，也不必要请示老师。只要这个事情是仁德的，是好事，是大善事，您就做，积极地做，努力地做，赶快做，要敢为天下先，而不是躲起来，而不是后退，而不是谦让。


    谦虚是好的，谦让也是好的，但是行仁德，可不要谦让。有些人别学错了，以为什么时候都要谦让，行仁德是自己理所当然要赶快做的事情。行仁德，做好事，您也不必请示谁，我要做吗？能做吗？您赶快做就行了。老师教大家的，也是行仁德做好事。


    ## 36、永远坚持走正道，不用为了小信丢失正道


    ### 原文


    子曰：“君子贞而不谅。”


    ### 陈昌文解读《论语》


    孔子说，君子在大道上正直而固执，但不会守小信而违背大道。


    学东西是灵活的，我们要知道什么是大道，什么是小信。大道是真正的道义，我们所有的言谈举止都必须是正义的，必须是道义的。小信，就是您发誓啊，或答应了什么，后来发现错了，偏离了大道，则您不必要守着这个小信，导致自己越错越深。


    我们与人交往的时候容易犯错，有些坏人故意设置套路，让您进入守小信的模式，慢慢地，您会发现您背离了大道。这个时候，您内心就有冲突了，明明是要走正道的，为什么守信反而走入邪道？这个时候，您要做的是放弃小信，知错就改，马上走回大道。要在大道上固执、坚持，而不是有了小信，就放弃了大道。


    所以，君子知道自己走错路了，就没必要盲必行，行必果了。没有智慧的人、心软的人、具有同情心的人，很容易犯这个错误，看不清，就给人设套，守了小信。有些人专门利用您心软，具有同情心，拖您下水，进入守小信，而失去大道的模式。


    ## 37、先把事情做好，再想钱财的事情


    ### 原文


    子曰：“事君，敬其事而后其食。”


    ### 陈昌文解读《论语》


    孔子说，侍奉君王，先把职责、事情放在心上，把俸禄、待遇、食物放在后面。侍奉君王，侍奉领导，侍奉客户，对待下属，都是一个道理。我们说的对事不对人，就是“敬其事”这句话。我们一定要按照原则、规矩，把事情做好，对方高兴不高兴，不是我们要考虑的，不是说对方不高兴，我就放弃原则。如果我们考虑对方的意愿、态度，我们就依着对方，其实对方狗屁不懂，或者根本就是瞎指挥，这会给我们造成巨大的损失。我们依着他，我们的事情也没做好，人情也没讨到，结果把自己给累死了，还没什么尊严，所以，这种事情我们是不干的。


    所以，您既然想跟我合作，那么您就必须按照我的来，按照我认为的原则、我熟悉的原则来，否则，我就不跟您合作，或者要剔除您，别浪费我时间。


    什么叫“后其食”呢？


    敬其事，这是原则问题，我一定要把事情做好。后其食，领导、君王、客户，给我们饭吃，下属也支持我们，我们在做事的时候，也要注意别得罪他们，更别故意得罪他们，拿着鸡毛当令箭，正确地产出我们的意见。好说、歹说，希望他们按照我们的原则来做事。


    照顾一下大家的情绪，并非要故意针锋相对，给我们钱财的是我们的衣食父母，我们也尊敬。但是正因为是我们的衣食父母，我们更要把事情做好，这就是敬其事在先。为什么给我们俸禄？不就是想让我们把事情干好吗？没有哪个老板是为了让我们只拿俸禄，而不干好事情、讨好老板就行了吧？


    所以，我们要敬其事在先，后其食在后。为事情服务，把事情做好，自然有人给您钱财，这里不给您，总有识货的人会给您。


    ## 38、什么人都教育


    ### 原文


    子曰：“有教无类。”


    ### 陈昌文解读《论语》


    孔子说，什么人都教育，都教。不会把人分类，分成什么人教，什么人不教。


    当然孔子也说过，自行束脩以上，吾未尝无悔。也就是只要带着十条肉干来行拜师礼的，我都会教诲他。


    有教无类会让很多人产生疑惑，这世界上，确实有人不可教化、教育的时候，会给自己惹麻烦，带来很大的负担。所以我们也要设置一些防火墙，隔离一些来找我麻烦，但并不妨碍我们教育所有人，比如，我们可以用自媒体的形式、短视频的形式播放给更多的人，让更多的人看到。但是跟我们近距离接触的人，我们还是要有一个过滤的，比如收点学费等等过滤方案。


    每个人都是可以教化的，都是可以教育好的，但是我们要考虑我们自己的时间成本、人生成本问题，甚至安全成本问题，所以教化距离远近问题，还是有所策略。


    ## 39、只跟志同道合的人一起做事，找不到，就一个人做


    ### 原文


    子曰：“道不同，不相为谋。”


    ### 陈昌文解读《论语》


    孔子说，大家的志向、思维、谋划的方式、价值观、原则、判断能力不一样，就不要在一起谋划事情。


    我们看一个人，首先看一个人的道，跟我们一样不一样，要是这个人的道跟我们不一样，就完全没有必要在一起做事，后果就是浪费时间，损失金钱。


    不谋道的人往往谋利，所思所想都是利的事情，这会导致他们的算计方式、做事方式不一样。如果您是一个谋道的人，跟一个谋利的人在一起做事，您以为您会实现您的志向，结果这个谋利的人会不断地从您身上算计金钱，这就很没意义。


    我们做事情，一开始就只能跟志同道合的人一起做。如果不是志同道合的人、只为钱的人，这个事情百分百做到后面会扯皮，也做不起来。没经验的人，会进入谋利思维，其实最后是利也没有，道也没有。有经验的人，眼光精准，一眼就能看出这个事情是合乎道的，还是合乎利的。一直跟您谈利益的人，谈谋利的人，大概率都会把您引导偏，引导偏了过后，他谋了您的利就不负责了。或者您做着做着醒悟了，就不做了，但是在这个过程中，就损失了巨量的金钱，以及时间。


    所以，我们做事，只跟志同道合，搞清楚我们的志向，只找三观合的人一起做事，只跟讲原则的人一起做事。如果找不到，我们一个人做就行了。


    ## 40、讲真话、实话、直白的话，表达到位就行了


    ### 原文


    子曰：“辞达而已矣。”


    ### 陈昌文解读《论语》


    孔子说，言语表达到位就行了，止于至善了，没必要再有其他的追求。这句话，是教我们说话、写文章的，也是教我们与人沟通、对话、表述的。我们讲话，说到位就行了，就是达，也就是关注事物本身，关注真相，然后进行直白地沟通就行，就停。千万不要故弄玄虚，把本来很简单的的事情给复杂化，让人猜测，让人琢磨不透彻，这样增加沟通成本。写作、讲话的人还洋洋得意，您看我多有水平、多优美？其实这毫无意义。


    讲真话，讲实话，讲直白的话，就是说人话，做人事。想让大家干啥，听明白啥，直接表达。不要弄得弯弯曲绕、乌烟瘴气的。在营销界也是如此，只有直白的广告，才能带来销量，带来效率。如果您的广告稀奇古怪的，则大家的注意力就不在买单上了，在研究您的广告上了，欣赏您的广告上了。


    企业管理、组织管理也是如此，当老板的，要明确告诉所有人，您的目的、您想要实现的目的，让大家实现，不要不说人话，让大家猜，结果提升沟通成本，事情走了样。


    这句话，也是教人实在，我们必须做一个直白而实在的人，如果我们的思想不实在、直白，我们以为这样可以骗了别人，往往把我们自己给耽误了。


    ## 41、心中有别人，就是道


    ### 原文


    师冕见，及阶，子曰：“阶也。” 及席，子曰：“席也。” 皆坐，子告之曰：“某在斯，某在斯。” 师冕出。子张问曰：“与师言之道与？” 子曰：“然，固相师之道也。”


    ### 陈昌文解读《论语》


    这个师，是古代搞音乐的乐师，姓冕，所以叫师冕。师冕来见孔子，到了台阶边，孔子说，这里是台阶。到了坐席边，孔子说，这里是坐席。所有人都坐下来了，孔子对师冕说，在这个方位，是谁谁谁在坐，在那个方位是谁谁谁在坐。——介绍清楚。师冕走了，子张就问孔子，与师冕见面，接见师冕，跟他说的这些话，做的这些动作，里面也有道吗？这就是接见师冕的道吗？孔子说，是啊，这就是接待师冕的道，接待乐师的道。


    这一节，讲的就是接待之道，您可以说是接待老师、接待普通客人、接待一个朋友都行。这就是礼数，您必须表现出来，而且做好。方方面面要虔诚的告诉清楚是怎么回事，不能让人出丑，也不能让人唐突。如果您的老师出丑了，您嘲笑他吗？幸灾乐祸吗？实在是您这个接待人出了大问题。


    对待客户、朋友也是一样，您要虔诚、热情、周到的告诉别人方方面面的信息，方便愉快交流，让别人感觉到受重视，让别人感觉到重视的真正原因是您真的重视别人。重视别人就是道，给别人讲明白，讲清楚，就是道。


    言谈举止里面装着别人就是道。您不这样做，就会发生唐突、不满意、尴尬，以及产生坏的名声，您就啥也干不好了。


    ## 《季氏篇第十六》


    ## 1、一切问题都在自己内心、自己家里


    ### 原文


    季氏将伐颛（zhuān）臾（yú）。冉有，季路见于孔子，曰：“季氏将有事于颛臾。”孔子曰：“求！无乃尔是过与？夫颛臾，昔者先王以为东蒙主，且在邦域之中矣，是社稷之臣也。何以伐为？”


    冉有曰：“夫子欲之，吾二臣者皆不欲也。”孔子曰：“求！周任有言曰：‘陈力就列，不能者止。’危而不持，颠而不扶，则将焉用彼相（xiàng）矣？且尔言过矣，虎兕（sì）出于柙（xiá），龟玉毁于椟（dú）中，是谁之过与？”


    冉有曰：“今夫颛臾，固而近于费（bì），今不取，后世必为子孙忧。”孔子曰：“求！君子疾夫舍曰欲之，而必为之辞。丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之。既来之，则安之。今由与求也，相夫子，远人不服，而不能来也；邦分崩离析，而不能守也；而谋动干戈于邦内。吾恐季孙之忧，不在颛臾，而在萧墙之内也。”


    ### 陈昌文解读《论语》


    季氏，就是鲁国权臣，把持朝政，这里是指季康子，颛臾，是鲁国附庸小国，依附鲁国君主。季氏为什么要攻打颛臾？贪恋颛臾的土地，又怕颛臾支持鲁国君主，威胁到自己的地位。于是想要企图霸占颛臾。


    季康子要去攻打颛臾了，冉有、季路是孔子弟子，知道这不合礼法，师出无名，想打就打，于是，就去拜访孔子，或者告诉孔子，说是季康子要打颛臾，想要推脱责任。但孔子知道他们两人心思，直接劈头盖脸就训斥了。


    冉求，这就是您的过错得了，这个颛臾，是先王让他做东蒙山之主的，又是我们邦域之内的附属国，是我们鲁国的社稷之臣。也就是合理合法，您们找什么理由去攻打他啊？没有攻打的理由嘛。冉有一听老师这么说，赶忙推卸责任，这是季康子要干，我们两个弟子都不想干啊。


    这话，我们也经常听见，总是有人，只要您一找有责任，他马上就说，这事不是我想干啊，我也无能为力啊，是谁谁谁想干，不怪我。


    孔子不吃他们这一套，继续批评，冉求啊，古代周王讲过，度量自己的本事，就占据什么样的位置，既然您没这个能力劝阻季康子攻打颛臾，您还占着那个位置干啥？季康子危险了，您不扶持，摔倒了，您不扶助，要您这个相有什么用途呢？而且您说的话非常过分啊，什么不关您的事情？是季康子要攻伐颛臾？我问您，您的职责是看管老虎、犀牛等猛兽，这老虎、犀牛跑掉了，是谁的责任？您的责任是看管贵重的龟玉，这龟玉在木匣子里毁掉了，是谁的责任？显然是看管者的责任。那么，显然，您说跟您没关系，是季康子要去攻打颛臾，这明显是您在推卸责任啊。您们既然在辅佐季康子，看着季康子干坏事，劝不住，还跟着干，这算没责任吗？


    这里面有一句话很重要，叫陈力就列，不能则止。您有本事搞定这个事情，那么您就在这个位置上好好干。您搞不定，您就应该退位让贤了。您的上司干坏事，您能劝阻，那您就是好的辅助者。您劝不住，还跟着干，这就坏透了。您如果没能力劝住，那就退位让贤，让能劝阻的来劝。


    冉有一看，老师不依不饶，就开始为季康子辩论了。这个颛臾，城墙坚固，又跟季康子的私人领地很接近，现在不攻取下来，以后如果颛臾攻打季氏，那么就是子孙的忧虑啊。言下之意，就是颛臾是个眼中钉、肉中刺，不除不快，是个祸害，不攻取下来，以后给季氏家族埋雷，所以一定要攻取颛臾。


    孔子看来冉求已经开始为季康子辩护了。又批评了冉有的态度问题，君子痛恨那些想要干什么，而不肯明说，拐着弯找些解释的人。这冉有见孔子，也拐着弯说话，这是很讨厌的。接下来，孔子开始教育他们。


    我听说一个国家、一个家庭，不怕没有财富，就怕财富不平均；不怕贫穷，就怕生活不安定。如果财富分配合理平均，就没有贫穷；如果上下和睦，就不担心人少；如果社会安定，就没有国家倾覆的危险。如果远方的人不服，我们要找自己的原因，修文德让他们服，让他们主动归附，而不是去攻打他们。我们用文德让他们来了过后，我们就安定他们。


    现在冉求、季路，辅佐季康子，让远方的人不服，又没人来。我们的邦分崩离析了，又不能守好，却想在自己的邦国内大动干戈，我恐怕他季孙氏的忧愁不在颛臾，而在自己家里吧。


    这段话的意思是，您要让别人服气，要让别人自然服气，您要修文德，这就是近悦远来了，您照顾好自己跟随着，别人看您的跟随着过得都很好，远处的人自然来找您。来找您的人，您能让人安定、繁荣、发展，则天下所有人都服您了，您哪里用打仗，攻取别人啊？


    现在是自己的邦已经分崩离析了，守不好，本来就应该搞好近悦远来。把自己这个邦处理好、守好，让人民安居乐业。而自己不这样做，天天谋划着打颛臾，恐怕忧愁不在颛臾身上，而是自己的内心出了问题，自己家里的谋略出了问题。


    其实很多事情都是这样，我们以为是外界有问题。有忧愁，其实并没有。任何一个小组织、小公司、小团队，他只要把这个小团队里的人都照顾好了，他自然安定，繁荣发展。当他的能力越来越强，自然就有更多的跟随着了。如果做不好这一步，力图去攻打外部势力，吞并谁，都是徒劳。


    一切问题都在自己的内心，都在自己的家里。家里的事情处理好了，外部的事情自然就好处理了。若是只想处理外部的事情，自己内心、家里的事情处理不好，近悦远来的道理搞不懂，则外部的事情，您也处理不好。处理了也是白处理，瞎费功夫。


    ## 2、最高权力一定在天子手中，否则就会出问题


    ### 原文


    孔子曰：“天下有道，则礼乐征伐自天子出；天下无道，则礼乐征伐自诸侯出。自诸侯出，盖十世希不失矣；自大夫出，五世希不失矣；陪臣执国命，三世希不失矣。天下有道，则政在大夫。天下有道，则庶人不议。”


    ### 陈昌文解读《论语》


    礼乐征伐，代表一个国家的最高制度、权威、权力。


    - 礼，就是礼仪制度，比如什么样的官员拥有什么样的享用标准，都是有制度的，不能越界。国家有国家的度量衡，国家有国家的文化标准，不允许其地方大员、诸侯私自定制。

    - 乐，国家有国家的歌曲、风格。什么样的音乐、歌词应该什么地方唱，什么不应该唱、演奏，都是有规定的。不是说您想表演什么就表演什么，您想唱什么就唱什么。这不行。

    - 征，谁造反，谁反对，天子制定战争策略，在国内进行征讨。

    - 伐，若是国外谁有罪，也是天子制定战争策略，对其讨伐。


    这就是礼乐征伐。这些东西，全部应该是天子说了算。这个国家就是正常的国家。所以，天下有道，礼乐征伐都是天子说了算。天下要是无道，就是大权旁落，这就是诸侯说了算。如果是诸侯说了算，国家传十代，大概就要灭亡了。如果大夫说了算，大夫比诸侯的级别低，大概五代就要灭亡了。如果是陪臣说了算，那么大概三世就灭亡了。


    天下有道的话，礼乐征伐政权在天子那里，不在大夫那里，普通老百姓也不会议论纷纷，因为也没什么好议论的。


    最后这句话让我想起了一句名言，真正的圣王之治，就是老百姓根本不知道有这君王，大家都其乐融融，因为完全没有什么好议论的。如果大家天天都议论纷纷，说明这个礼乐征伐都不在其位，出了事情。犹如我们身体一样，您经常想起的器官，就说明那个器官有问题了。您根本感觉不到，根本不注意的器官，就说明那个器官在正常运作。什么时候您特别关心某个器官，说明那个器官大概出了大问题。


    在一个组织中、一个企业中，也有对应的礼乐征伐。这个礼乐征伐，一定是企业家本身，以及组织者本身说了算的。如果这个权力被其他人谋划去了，这个组织、这个企业就会衰亡了。


    ## 3、一切都是上行下效


    ### 原文


    孔子曰：“禄之去公室，五世矣；政逮于大夫，四世矣；故夫三桓之子孙，微矣。”


    ### 陈昌文解读《论语》


    孔子说，鲁国的政治权力、赋税不人公室，不在国君那里已经五代了。大权旁落，落到大夫手里，已经四代了。到了第四代，也就是三桓的子孙，又要继续旁落了。


    桓子这个大夫，最后被阳虎这个家臣所囚，最后国家大权落人家居阳虎手中。阳虎成为鲁国执政的人。


    一个组织、一个国家的衰落，就是从大权旁落开始的。为什么大权会旁落？主要是自己做出了坏的表率。儒家思想的一切根基思想，都是向内求。

