    楚，男人进男厕所，女人进女厕所，这也是天命，天理昭昭，不由您搞理论，进行反驳。一切自然规律，一切本来就应当那样做的，您好好跟着做就行了。别想一出是一出，别自己找点邪恶的理论，就来颠覆这些天理昭昭的东西。


    # 畏大人。


    对于有德行、有地位、有位置的人，也是要敬畏、尊敬的。别人既有德行、有地位、有现实成就，就说明别人值得尊敬，是顺规律所得来的，所以，您尊敬大人、敬畏大人，本来就是尊重规律。如果不敬畏大人，重有地位的人不尊重、怠慢，势必乱了章法、乱了礼数。轻则被疏远，重则给自己招祸。


    小人看到大人有道德成就、地位成就，往往轻蔑、侮辱，说别人也不过如此，如果自己有什么机会，也能如何如何？这都是小言论。理解不了有德行、有地位，是别人修来的，是别人努力的结果，是因缘际会的结果。自己轻蔑、侮辱有德行、有地位的人，只能让自己看起来是个笑料。


