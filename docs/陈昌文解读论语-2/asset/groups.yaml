    # 19、并非什么人我们都见面，教化


    **原文**


    孺悲欲见孔子，孔子辞以疾。将命者出户，取瑟而歌，使之闻之。


    **陈昌文解读《论语》：**


    孺悲，鲁国人。曾经跟随孔子学习过士的丧礼等礼仪规范，是孔子的弟子。有一天，孺悲想来见孔子，可能是问候老师，或者是有事请教，孔子不见，并且让传话的人告诉孺悲，自己病了不能见。孺悲在大门外等着回话呢，这个传达命令的人前脚刚走，还没见到孺悲，孔子就取瑟来敲打着然后唱歌，'
  - '[PAGE 352]


    让孺悲听见。大家可以想象一下，孔子故意唱歌鼓瑟，然后传达命令的人过去给孺悲说，孔子病了，没办法见您。这明显着就是不想见，不愿意见。孔子的意思是，我并没有病，就是不想见您，您以后也不用来问我什么时候见，就是不见您，也不用来问我病好了没。


    这种拒绝人的方式是拒绝得很彻底，大概是孺悲哪个地方惹老师生气了，做得太不对了。孔子这样做，也算一种教育方式，让孺悲自己反思。有些人吧，可能就是要用这种拒绝式的教育，才能让他深刻反省自己哪里做错了。一个人屡教不改，就没有再见面、再教育的必要。一个人罪大恶极，也没有见面教育的必要。一个人，你知道教育了也是白教育，他不会听的，也没有教育的必要。一个人表面请教，实际上不执行，这种人，我们接触过他，知道他是这样的人了，我们就不再见面，教育。


    教育一个人，也是要选择好对象的，不是什么都人都教育，以免我们的精力浪费。


    # 20、不能教育的人，就让去吧


