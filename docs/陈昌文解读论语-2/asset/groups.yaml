    **陈昌文解读《论语》：**


    孔子在匡这个地方，被匡人围住，要杀死孔子，这是一个误会，因为当年阳虎在匡地为非作歹，伤害了匡人。而这个阳虎的马车驾驶者又给孔子驾车去了，刚好孔子长相又跟阳虎相像，所以匡人就认为孔子就是阳虎，一定要杀之而后快，把孔子围起来了。情况非常危急，孔子呢，一面派弟子解释，一面派人突围搬救兵。


    一个弟子找到了卫国大夫宁武子帮忙，说清楚了这个事情，然后匡人选择了相信孔子不是阳虎，放行了孔子。孔子带着弟子们急速逃跑。颜渊走在后面，孔子没见到颜渊，就非常焦急，等到颜渊跟上了，孔子脱口而出，我以为您死了呢。颜渊说，老师还在，颜回怎么敢死呢？师徒之情，溢于言表。


    颜渊是孔子的得意弟子，孔子要传道统给颜渊，颜渊也是大家公认的能继承孔子衣钵的人。孔子是非常担心颜渊的安危的。可以说，担心颜渊胜过担心自己。而颜渊呢，也是为老师着想，老师在，自己一定要好好活着，还要服侍老师呢，自己怎么敢先死啊？必须保护好自己。

