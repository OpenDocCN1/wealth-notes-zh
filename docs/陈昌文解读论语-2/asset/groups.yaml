    ## 17、老师的快乐就是得天下英才而育之


    **原文**


    闵子侍侧，闵闵如也；子路，行行如也；冉有、子贡，侃侃如也。子乐。 “若由也，不得其死然。”


    **陈昌文解读《论语》：**


    闵子骞这个人，随时都是恭敬而正直的样子。子路这个人，非常勇敢，非常刚强，是一个勇士、一个将军、一个保镖。冉有这个人会理财，会管理，多才多艺。子贡当然是儒商鼻祖，更是理财高手，也能言善辩。冉有、子贡看起来温和而又快乐。孔子就乐了。为什么乐？人才济济啊，得天下英才而育之，是人生极大的快乐。要是一个老师周围有很多人才，这个老师当然感觉快乐。犹如一个老板周围有很多得力干将，您能不快乐？


    不过也有不完美的地方，就是子路这个人，太过刚强、勇敢，而且特别好义气。所以，孔子评价他，子路，不得好死啊。这当然不是诅咒子路，而是根据子路的性格推断子路在那个乱世的结局。子路这种人，刚强、勇敢、好义，碰到点事情，就会舍生取义了。后来，子路也确实在一场本来可以躲避的叛乱中舍生取义了，被剁成了肉泥。


    ## 18、闷声发大财，不要大张旗鼓地找自己打不过的对手打


    **原文**


    鲁人为长府。闵子骞曰：“仍旧贯，如之何？何必改作？”子曰：“夫人不言，言必有中。”


    **陈昌文解读《论语》：**


    鲁国人要改建长府，把这个长府修建得更好些。闵子骞说，就照原来的样子吧。原来的样子如何？为什么非要改建？孔子说，闵子骞这个人话很少，但是一说话，就说对了，说到点子上了。


    鲁昭公这个人，想要修建长府。鲁昭公被季氏三家权臣欺负，心里不爽，就修建长府，打算大张旗鼓的政变，或者说要攻打季氏等权臣。闵子骞是微言大义，您不要那么大张旗鼓的，您就跟什么都没变一样，为什么要大张旗鼓的改建长府呢？这样让大家都知道您要干什么了。您实力也并没有那么强大，您能干得成？还不如一切照旧。


    一切照旧有两个意思，打不过别人，就别打，您仍然当您的君王。权臣再厉害，也是权臣，他现在也不能把您怎么样。如果您非要大张旗鼓的搞季氏，对方狗急跳墙，可能适得其反。二是，您即便是想攻打别人，也要偷偷行事，不要大张旗鼓，别人都准备好了呢？您还打什么呢？要攻其不备。


    孔子说，闵子骞这个人，平常不说话，一说话，就说透彻了本质，说到核心点了。


    ## 19、不要跟风批评比自己厉害的人，要学习比自己厉害的人


    **原文**


    子曰：“由之瑟，奚为于丘之门？”门人不敬子路。子曰：“由也升堂矣，未入于室也。”


    **陈昌文解读《论语》：**


    孔子说，子路鼓瑟，鼓的很差异啊，没有味道。子路这个人性格鲁莽、勇敢、急躁。这样的人很难精通乐器，这人啊，如果演奏音乐，其性格会融入音乐中。子路鼓瑟，也会传递自己的性格特征给听众，听众听了，会感觉到子路急躁、鲁莽的性格。所以，孔子就说了，子路就鼓瑟鼓成这样子，怎么可以在我的门下呢？亏您还是我的门下弟子。


    这当然是一个善意的批评，希望子路改进。其他弟子们听了，就不尊敬子路了，觉得老师都批评您了，证明您不行啊，子路您也没什么事。孔子知道了，就说，子路啊，已经登堂了，已经初窥门径，学到点东西了，只是还没入于内室。您们这些人，连门都没摸到，还不赶快跟着子路学？


    这里有一个很有意思的社会现象，就是一个人其实很厉害了，但是呢，有比他更厉害的人批评他，然后就有那些普通人、不怎么样的人，跟着批评这个很厉害的人，跟着不尊敬这个很厉害的人。其实这个人已经非常厉害了。


    所以啊，高明的人，都能知道自己几斤几两，也能知道谁是真正厉害的人，而不是跟风去批评谁。其实，您批评的很多大佬，都您厉害几百倍、几千倍、几万亿倍，您学习都来不及，不要跟风去批评。


    您若要批评谁，您先掂量一下自己的斤两，看看您跟您批评的那个人有多大差距。


    ## 20、做事要讲究适度，不过分，也不差火候


    **原文**


    子贡问：“师与商也孰贤？”子曰：“师也过，商也不及。”曰：“然则师愈与？”子曰：“过犹不及。”


    **陈昌文解读《论语》：**


    师是子张，商是子夏。子贡问孔子，子张与子夏谁更贤德啊？孔子说，子张有点过分了，子夏呢，又差点火候。子贡就说，那么是子张更贤德了？意思是，过了总是比不及好吧。孔子说，过分了和不足是不一样的。子张这个人，学习刻苦努力，什么都想跟圣人一样，简直学习到走火入魔的地步。而子夏这个人呢，做什么事情，都缺点火候，得过且过。


    学习刻苦努力当然好，但过分了，就会出现很多问题，一是身体搞坏了，忽略了其他问题。二是不能持续，因为人始终是会累的。要恰到好处。这就是中庸之道。而不及呢？学什么都差得不多就行了，蒙混过关，容易让人堕入平庸，虽然比大部分人好点，但是也很难有什么顶尖的成就。


    所以，一个高明的人，是张弛有度，该睡觉睡觉，该工作工作。绝对不是一曝十寒，也不是得过且过。比如，我们很多人创业，开始的时候激情满满，没日没夜地奋斗，干了3个月，没出成绩，就绝望了，就放弃了，我这么努力，还不成功？这些人，往往都是忽略了事物的规律，只会感动自己。


    还有一种人创业呢，他还以为他在打工，慢悠悠的，朝九晚五，结果储备的资金用光了，还没搞到业务，就破产了。


    真正的高手是不紧不慢，长期作战，能持续的活下去。做事要讲究适度。不过分，也不差火候。


    ## 21、孔子为什么生冉求的气


    **原文**


    季氏富于周公，而求也为之聚敛而附益之。子曰：“非吾徒也，小子鸣鼓而攻之可也。”


    **陈昌文解读《论语》：**


    季氏这个人非常富裕，是权臣，已经比以前的周公还富裕了。天天还想更富，到处求如何收刮民脂民膏的方法，来找过孔子，孔子不回答季氏，季氏就找了孔子的弟子冉求。冉求，孔子的弟子，善于理财，就帮助季氏继续聚敛财富，收刮民脂民膏，增加赋税。


    孔子很生气，就说，冉求不是我的徒弟，您们这些徒弟子们，击鼓去攻打他也可以。孔子一是希望季氏要体恤民众，不要贪得无厌。二是希望自己的弟子不要助纣为虐，可以劝阻季氏。孔子的愿望都落空了，当然是很生气。教了徒弟一身好本事，徒弟却拿着这身好本事干坏事，谁能不生气？


    ## 22、性格影响命运的走向


    **原文**


    柴也愚，参也鲁，师也辟，由也喭。


    **陈昌文解读《论语》：**


    这四个人都是孔子的弟子。柴，是高柴，这个人愚钝不灵活，老师教他什么，他就执行，也不拐弯，就是那种憨厚、老实的人。孔子说高柴没什么灵活性，不聪明。不过这个人，却是孔门弟子中，当官当得最多、最久的人之一。


    其实这个世界上聪明人很多，但是大多不可靠，而这种愚钝的人，您安排了什么，他就去做。这样的人，反而能混好，因为大家信任他。所以，信任感、忠诚度甚至比聪明更重要。


    所以，我跟人相处的时候，也经常是表现得憨憨的。人没必要显摆自己的聪明，您老老实实听比您厉害的人的话，您就会获得很多了。


    参也鲁。参，是曾参。鲁的意思就是反应迟钝。这个人是孔子弟子中得到真传的人，这个人反应迟钝，为什么得到真传？因为他要反复琢磨，反复复习，反复思考孔子的话，跟着孔子学。而聪明人一看就会，一问便知，记忆力超强，但这种人呢，有个毛病，就是不会深入学习，反复学习，过不了多久，就忘记了，反而不会成为最优秀的人。


    曾参虽然是那种迟钝、反应慢的人，但是却是学得最深、走得最远的人。有时候优点就是缺点，有时候，缺点会利用，恰好是优点。曾参就属于走得慢，但是能走得远的人。


    师也辟。辟的意思是有点过分了，刻苦学习。师是子张，这个人，孔子说学得东西有点过，什么都要学得惟妙惟肖，但也是最刻苦的人，虽然学得过，孔子也说了，“过犹不及”。但总算是认真在学习，也算是有很大成就的人。


    由也喭。喭，就是鲁莽、直接，勇有余而谋不足。由就是子路。这个人孔子多次批评、提醒他，要有勇有谋，不能只是勇敢，也说子路不得好死，不会自然死亡。这跟子路的性格有关系，讲义气又勇，又没那么多谋划，最终被人剁成肉泥。


    人的性格，左右影响着自己的事业、命运、未来。人的性格，也影响您的交友，也影响您的选择，也影响谁跟您做朋友。会讲听话，大家都喜欢。说话怒气冲冲，总是找别人麻烦，大家当然不喜欢。您所有的环境，都是您自己性格、您的智慧决定的，所以，如果不满意您自己的现状，反观一下自己的性格、言语、为人处世。


    ## 23、无论贫穷与富有，乐道才是关键


    **原文**


    子曰：“回也其庶乎，屡空。赐不受命，而货殖焉，亿则屡中。”


    **陈昌文解读《论语》：**


    孔子说，颜回这个人已经接近道了，但是还是--贫如洗，穷得叮当响。屡空，就是什么都没有，家徒四壁。一个接近于道的人，富贵应该来讲是很容易的，为什么还这么穷？主要是安贫乐道，乐在其中。犹如庄子这个人，楚王让其当宰相，庄子不愿意，宁愿穷得去借米，还写文章讥讽不给他借米的人。


    有些近道的人，不是普通人能理解的。普通人非要财富，而得道的人，不一定要财富，只是安贫乐道而已。


    赐，就是子贡，子贡这个人啊，就想着改变命运，为自己做生意。子贡这个人，也不为国君做事，就自己搞私营企业，什么东西要涨价，什么东西要跌价，子贡都能推测到。于是，子贡成了那个时代的首富。颜回与子贡都是孔子的高徒，一个选择了贫穷，一个选择了首富。但都是乐道之人。


    穷富不是关键，活在道中，乐道才是关键。


    ## 24、先按照老师傅的方法干


    **原文**


    子张问善人之道。子曰：“不践迹，亦不入于室。”


    **陈昌文解读《论语》：**


    子张问，这个世界上有一种天生的善人，他们的行为、道德如何呢？能到什么境界呢？孔子说，这样天生的善人，如果不按照圣人的教育、行为进行学习，也很难达到一个高深的境界。


    这种善人，我们可以理解为天才，就是这个人生天的资质就比一般的人强很多。但是这样的人，如果没有老师傅、高手进行教学，这个人也不按照老祖宗的规矩进行学习、实践，喜欢自己创新，搞点新名堂，就是浪费时间，其水平可能也就仅仅比常人高一点点，很难达到高深的境界。


    这几句话看似平淡无奇，实际上非常深刻。这世界上最厉害的东西，就是圣人、老祖宗、老师傅留下来的规矩，这些规矩几千年实践经验下来，就是对的，您必须尊重。必须跟着学习，千万不要觉得自己聪明，不用跟着学。


    老师傅、圣人总结出来的东西，为什么要这样做？一招一式都是血与泪，都是刀与火，是吃过亏了，才总结了那么几句话。是跟人拼过刺刀，知道如何摆放刺刀的方向、位置对自己最有利。而您是一个新兵蛋子，自以为是地认为自己天赋高，头脑聪明，就不愿意跟着老师傅学习，不听话，自己要另起炉灶，用另一套理论，急功近利，想走捷径，其实这个捷径是自以为是啊了。


    人生最快乐的、最幸运的是您在一个人年纪，有人教您，有老手带着您，您跟着学，按照轨迹去干就行了。可惜您偏不，您就是要自创造一门武功，结果失败、亏损、折腾。


    人性的弱点，都是自己想当王，不想甘居人下。我自己也有这个毛病，我也在反思，其实真正聪明的人，是找一个牛人直接跟随、配合。您找一个牛人、老师傅跟随、配合，您并不会少获得利益，因为您自己的才智也能充分发挥，而老师傅还会教您一些东西，还会帮您避免一些盲区，这样，您就能走得更远。所以，我们一直在讲，学习儒家思想首先要墨守成规，搜集老祖宗的道理，老老实实跟着学，跟着干，不要自作聪明，不要自以为。


    您觉得您比老师傅、老祖宗聪明，那是一个错觉，也是一个梦。您的血肉、精神都是老祖宗缔造的，您哪里可能比老祖宗、老师傅聪明？能下人者为之上，想要有成就，先要下人，先要把姿态放低，先要按照圣人、老祖宗、老师傅的规矩干。您能把老祖宗、老师傅、老手的功夫都练到位了，您自然也就功成名就了。可不要想着用自己那点有限的智慧在那里折腾，浪费时间、精力，于于人己都没什么好处。


    ## 25、儒家说话的艺术


    **原文**


    子曰：“论笃是与，君子乎？色庄者乎？”


    **陈昌文解读《论语》：**


    孔子说，您说话很诚恳，言语很诚恳，您是君子呢？还是只是表面假装庄重呢？这是一个解释。


    什么意思？这个社会有些人是真正的君子，说话诚恳、老实、可靠，您一眼就能看出来，从感觉上也能亲近这样的人，这样的人真真实实。我们希望跟这种人交往，我们自己也应该成为这样的人。那么，还有一种人，他知道诚恳老实的说话、言论可以赢取信任，而他本身不是一个老实人，心里想的是另一套，坏得很，但是他言语、态度之间能伪装得很诚恳。这种人，就是伪君子，道行高的伪君子，甚至可以欺骗到很多人，且是长时间的，但是终究会被拆穿。


    我们当然不喜欢伪君子，怕自己被欺骗、愚弄。跟这种人交往，对自己肯定是没什么好处的。我们自己呢，也不要做伪君子，因为做伪君子总有一天被拆穿，到时候就会尴尬难受，甚至受到法律的制裁。即便是不受到法律的制裁，您这内心与外表严重不符合，您自己也得小心翼翼的，怕被拆穿，自己睡觉做事都不踏实。


    还有一种解释是，论苟是与？我们到底要不要想说什么就说什么？想说什么就说什么有一个问题，一是您确实好心，又比别人高明，您懂，您说的是对的，您就应该说，这样可以帮助别人。二是，您压根不懂，就是好心，乱指点。别人、当事人比您更懂，更知道事情的原本，知道如何处理，而您不懂，您嘴唠唠就是给别人添乱。但是您是好心的，别人还不能从道德上谴责您。但实际上，您是好心办坏事，因为您不懂，不懂还要指挥当事人，就是恶。


    君子呢，当然是只干自己懂的事情，对自己懂的事情发表有利的意见。如果您想当君子，您要么比别人懂，要么别乱说话。不懂又好心去说，就不算君子，只能算个热心的烂好人。


    色庄者乎？人啊，要把什么事情都当正事，让别人看到您是个正经人，而不是瞎搞的，而不是嬉皮笑脸的人。这样，别人对您就认真了。坏人、恶人，也就不敢作恶了，自然就远离您了。


    联合起来解释这句话的意思就是，我们在社会上，可不可以随便发表自己的意见呢？答案是，您真的比别人懂，您就可以发表意见，您要是不懂，您别说，别给当事人添乱。您平常就要严格要求自己，严肃认真对待每件事，这样，您说的话、您的言论，就会得到别人的尊重。小人、恶人不会给您捣乱。如果您说话经常嬉皮笑脸，乱说话，不严肃，您就没有威信了。就算正确的意见也没人采纳了，还容易招惹到小人、恶人。


    ## 26、谋划好了，再行动


    **原文**


    子路问：“闻斯行诸？”子曰：“有父兄在，如之何其闻斯行之？”


    **陈昌文解读《论语》：**


    子路问孔子，听到了就马上去干吗？听到了就立刻行动吗？孔子说，您有父亲、兄长在，怎么可以不考虑父兄、问问父兄的意见就立刻行动呢？


    子路这个人行动力非常强，往前面冲，他只要听到什么对的了，就去做，还没做完，就非常怕听到新的理论，因为旧的还没做完呢。孔子说子路是暴虎冯河，渡河都不考虑周全，就想跳下去就渡河，也说子路有勇无谋。


    子路以为孔子打仗一定带自己，孔子说，不带他，只带那些临事而惧、好谋而成的人。就是要带那些碰到问题了，多想想，考虑周全，然后争取把事情给办成的人，而不是一上来，就冲啊冲，干啊干。由于子路这个人行动力非常强，所以孔子就劝子路，您要多多考虑考虑，也要问问父兄的意见，再行动不迟。


    如果一个人的行动力过强，不考虑谋划，这个人往往会徒劳，甚至会伤害到自己，很多多事情都是劳而无功。所以，孔子还是希望子路能好谋而成，有勇有谋。


    ## 27、听到了就去干


    **原文**


    冉有问：“闻斯行诸？”子曰：“闻斯行之。”


    **陈昌文解读《论语》：**


    冉有问，听到了就去行动吗？孔子说，听到了就去行动。冉求这个性格懦弱、畏畏缩缩，做事本来就慢，喜欢想。


    社会上大部分人都这个毛病，思考的很多，行动很少。于是冉求问孔子，是不是听到了就行动，这种人呢，可能还想得到到一个回复，多想想。要是孔子回复他，多想想，他就会一直想，一直少于行动。孔子根据冉求的具体性格特征，给他的答复是，立刻行动。


    其实一个人的行动力是不是强，自己清楚；一个人是不是优柔寡断，自己想想，也清楚。如果您是一个行动很少，天天老是思想，喜欢听课，喜欢看到别人是不是有新观点，喜欢问东问西，但是没有什么具体结果、成就的人，说明您就是一个优柔寡断、没什么行动力的人。这种人，就要立刻行动。


    成功来源于不断地行动，不断地干活，而不是只是在那里想，在那里学习。行动多了，很多经验您就有了，很多技巧您也就学会了。实践出真知。您天天都想，而不行动，您想的其实与真实的世界是有很大出入的。


    ## 28、教学要因材施教


    **原文**


    公西华曰：“由也问‘闻斯行诸’，子曰‘有父兄在’；求也问‘闻斯行诸’，子曰‘闻斯行之’。赤也惑，敢问。”子曰：“求也退，故进之；由也兼人，故退之。”


    **陈昌文解读《论语》：**


    公西华听到子路、冉求都问，听说了，就马上去行动吗？孔子对两个人的答案是不一样的，孔子对子路说，您还有父兄在，先好好考虑一下，权衡一下家庭，再作打算。冉求去问，听到了就去干吗？孔子就说啊，您听到了就去干，马上干，赶快干。公西华就迷惑了，怎么同样一个问题有两个完全相反的答案啊？所以他就问孔子。孔子就说啊，冉求这个人，本来就喜欢退缩，犹犹豫豫的，考虑问题时很长，所以，我必须鼓励他赶快行动。而子路这个人行动力本来就很强，一个人好比两个人的行动力，这样的人考虑问题不会很周全，所以，我让他慢点。


    我们在教学过程中，也经常碰到这样的人，对我们的答案有疑惑。实际上我们在现实生活中，经常是因材施教的，所以讲的话听起来是有矛盾的，但其实不是矛盾，是我们根据实际情况做出的最佳方案、答案。


    比如，您同样教一个人学习一件事，有些人一看就会了，这个时候，他就可以直接去干下一个动作了。而有的人，他需要反复听一听以前的课程，才能理解，这个时候，我们就建议他反复听以前的课程。


    这个时候，就会有些人疑惑了，为什么您教人同样一件事，有的人就可以去做下一个动作，而我们偏偏要复习呢？这是因为每个人自身的条件决定的。当然，我们碰见了有些人非要争论，我们也不跟他争论，这也是孔子对三季人的态度，若是我说了您不听，我就放弃您了，就说您是对的了。因为夏虫不可与语冰，您没见过，您没见识，我们说了您也听不懂，就只能放弃您。


    孔子的教学方法，就是因材施教，具体情况具体分析，而不是对每个人的教学都是一样的。


    ## 29、师傅在，自己就不能先死


    **原文**


