    # 24、时时刻刻琢磨改错


    原文


    蘧（qú）伯玉使人于孔子，孔子与之坐而问焉，曰：“夫子何为？”对曰：“夫子欲寡其过而未能也。”使者出，子曰：“使乎！使乎！”


    陈昌文解读《论语》：


    蘧伯玉是卫国贤大夫，孔子拜访卫国的时候，曾经住在他家里，两人相互欣赏，成为了好朋友。


    蘧伯玉有一天派使者来见孔子，孔子就接待使者，让使者坐着，这是孔子对蘧伯玉尊重的行为。按常理，使者是没有资格跟孔子坐着对话的。孔子问，蘧伯玉在家里干啥啊？使者回答，他老人家想要让过错变少，但做不到啊。使者出去了，孔子感叹说，这个使者呀，这个使者呀，真是有其主，必有其使，这是夸奖使者理解主人。


    蘧伯玉这人到底有什么特别的地方？这个人天天改过，经常改过，一定要找到自己错误的地方，今天必须比昨天更优秀，这就是蘧伯玉厉害的地方。每个人都有很多错误，但就是不愿意改，天天想学新东西。老东西、规矩都做不好。比如，一个简简单单的早起早睡、努力工作、锻炼身体，都做得到，却天天到处找新东西学习，这些人无论学多少也没有用。


    人不需要学太多，也不需要拜很多老师，您把您现在知道的错误改正了，您就是一个不得了的人物。人也知道自己应该干啥，每个人都知道，就说坐在凳子上，坐着没有坐着的样子，这一项，您就可以改进，但是又有多少人'
