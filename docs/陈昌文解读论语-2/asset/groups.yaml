    # 14、不要做过分的事情，也别道德绑架别人，


    # 将心比心


    原文


    子游曰：“丧致乎哀而止。”


    陈昌文解读《论语》：


    这句话是子游说的，亲人去世了，您尽到哀伤的礼仪就行了。不要哀痛过度，伤心欲绝，让自己的精神、身体都垮了，受到毁灭性打击。


    这世界上有这样一种人，就是亲人死了，非要做出伤心欲绝、哀痛致死、不想活了的様子。非要认为这样才是哀痛、才是有礼节、才是对的。假设父母去世了，不哀痛得想死，就认为是不孝。这是不对的。人都有一死，您的亲人若真爱您，他也不希望您去死。所以，人们大可不必做出您死了，我也
    要死，我要让自己痛苦，精神、身体都受到折磨。您受到折磨其实于事无补，您尽到礼仪，然后自己好好活着就行。


    **孔子让您学礼仪，并非让您过分。过分就不是礼仪了。什么事情都有一个度，达到这个度，就是中庸，过分了，就不是儒家思想了。过分了，就成了道德绑架。所谓己所不欲，勿施于人，将心比心，您就知道答案了。您这样做，亲人真的希望您这样做吗？您道德绑架别人的事情，如果别人也这样道德绑架您，您愿意吗？想想这些问题，您就不会做过分的事情了。**'
