    # 陈昌文解读《论语》：


    好了，这句话，女同志听到了先别骂，先反思一下自己是不是有这个毛病，反览自照，别动不动就开喷。同样，男同志，也是如此，别以为只说了女同志，还说了小人呢，您是不是小人，自己对号入座。


    现在我开始解读这句话，孔子说，唯有这个女人与小人难相处啊，为什么呢？您跟他亲近了，他就不懂礼貌，不懂规矩，做事过分。您跟他疏远了吧，他又特别怨恨您。


    有些人就是这样，您对对他好，跟他亲近一点，多帮助他一点，他就会越来越无礼，越来越瞧不起您。明明是您教会他的，您帮助他的，您亲近他的，最后反而变成了您欠他的。等到您认为不应该再跟他亲近的时候，开始疏远的时候，他又开始怨恨您。觉得您变了，为什么变了啊？他不想这个问题，他想的就是您这个人变了。


    其实人与人之间的关系应该是这样的，我待您好，帮助您，提升您，跟您亲近，您应该更感恩，更尊重才对，然而事实恰好相反，您对对他好，亲近他，


