    您觉得您比老师傅、老祖宗聪明，那是一个错觉，也是一个梦。您的血肉、精神都是老祖宗缔造的，您哪里可能比老祖宗、老师傅聪明？能下人者为之上，想要有成就，先要下人，先要把姿态放低，先要按照圣人、老祖宗、老师傅的规矩干。您能把老祖宗、老师傅、老手的功夫都练到位了，您自然也就功成名就了。可不要想着用自己那点有限的智慧在那里折腾，浪费时间、精力，于于人己都没什么好处。


    # 25、儒家说话的艺术


    # 原文


    子曰：“论笃是与，君子乎？色庄者乎？”


    # 陈昌文解读《论语》：


    孔子说，您说话很诚恳，言语很诚恳，您是君子呢？还是只是表面假装庄重呢？这是一个解释。


    什么意思？这个社会有些人是真正的君子，说话诚恳、老实、可靠，您一眼就能看出来，从感觉上也能亲近这样的人，这样的人真真实实。我们希望跟这种人交往，我们自己也应该成为这样的人。那么，还有一种人，他'
  - '[PAGE 46]


    知道诚恳老实的说话、言论可以赢取信任，而他本身不是一个老实人，心里想的是另一套，坏得很，但是他言语、态度之间能伪装得很诚恳。这种人，就是伪君子，道行高的伪君子，甚至可以欺骗到很多人，且是长时间的，但是终究会被拆穿。


    我们当然不喜欢伪君子，怕自己被欺骗、愚弄。跟这种人交往，对自己肯定是没什么好处的。我们自己呢，也不要做伪君子，因为做伪君子总有一天被拆穿，到时候就会尴尬难受，甚至受到法律的制裁。即便是不受到法律的制裁，您这内心与外表严重不符合，您自己也得小心翼翼的，怕被拆穿，自己睡觉做事都不踏实。


