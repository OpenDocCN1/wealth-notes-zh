    在包括基础设施建设投资都已大量过剩的前提下，加上政府投资的腐败损耗、民间投资不可能再像以往迅速跟风等因素，本轮泡沫行情的实际投资效果越来越差，4 元投入也许产不出
    1 元 GDP，会是一个现实图景。同时也意味着那样的话，要挽救过去留给今天的债务危机，需要制造的泡沫量也需要加倍增长。


    中国在货币泡沫中行船。老百姓口袋里的钱，必然是越来越缩水。而存款保险制度的必将出台，则使老百姓传统观念中最安全的储蓄也将变得不再安全。无知无畏都能保财富安全的时代马上就要彻底翻过去了！我还是一贯坚持的那些观点：散户都不要买黄金，不要入股市，老实实研究市场和规律、利用银行杠杆，买一两套优质房子。有网友借计划生育问题说的一句话很有才，送给大家：“对于国家号召这玩意，有个网友说得好，只要你不去响应它，迟早会有好处的。”企业投资、购置房产等，也一样。'
