    3 年（5 年？）。这样做的目的，一是利用三到五年实现有项目，二是节约成本，也通过本项目积累经验，为西边那栋的改造定位打基础。


    以下只是冷静客观描述，不涉及道德判断，也不涉及个人情感判断。


    # # 1 定位


    一共 155 套房子，124 到 260 平米一到两居，大客厅小居室，定位为商务居所。我参观的是 22 层朝南一个样板间，180 多平米，大厅很气派，卧室只有一间。这是具有代表性的户型。不适合居家。


    但这样的房子也严重不适合个人居住啊！一个人或者两个人都显人气不足。气场盖不住！古代皇帝多牛，卧室仍不过是十几平米的小房子，况且天天还有人侍寝。屋外还有太监安保类人员。


    因此，个人认为这类房子既不适合居家，也不适合空中飞人的商务办公，超级富豪买给小三，她也不敢住。太冷清的了。


    # # 2 得房率


    项目得房率超低，70%到 73%之间，主要原因 1 到 3 层 2400 平米会所面积也全部都摊到公摊里了！这就是典型的短期经营、无法长期支撑的节奏！管家和会所撑几年，房子卖出去了钱也花得差不多了，反正定位人群一年恐怕住不到十天，相关服务人员也鸟兽散了。


    # # 3 租金


    售楼小伙说，124 平最小户型 1100 万左右，租金可达 4 万一个月。理由是旁边雅诗阁同等面积可以租 3 万一月，而他们的装修更好。


    但这个理由是靠不住的。雅诗阁是全球最大的服务公寓集团，全球范围内高端商务人入口非常巨大。个人感觉，入口的重要性将占到项目经营的 90%以上。一旦落入梵悦 108
    这样的散售，这个人流入口就立即封闭，即使在家门口也彼此互不相识，鸡犬之声相闻，老死不相往来。其次，雅诗阁提供的日常服务，也是未来梵悦 108 不能相提并论的。


    # # 4 销售策略


    梵悦 108 采取的销售策略是饥饿营销。我问最小户型 124 的还有没有？答曰都卖完了，可能还有一套是一个客户去年 10 月份订的，也许他贷款批不下来。他要去申请一下看看能否帮我争取。


    我再问 LOFT 户型是否还有？他说还有 3 套，比上面的价格低个四五万一平左右，用来出租还可以，但不建议买，因为楼层低，没有景观，采光也会差一些。


    饥饿营销策略对于楼市菜鸟来说有的有效，但这样总价都在千万以上的效果未必会很显著。对我这样的人更无效。'
