  md: '但是，权力崇拜和金钱崇拜像病毒一样牢牢地扎根于我们大多数人的脑海里面。他们认为只要掌握权力和金钱的人下决定心，天下没有办不成的事情。他们相信人一定能胜天。某种程度上，中国至今还是妄想用意念、用决心战胜一切的义和团！这将给我们上至国家战略下至个人投资带来极大的困扰和灾难。


