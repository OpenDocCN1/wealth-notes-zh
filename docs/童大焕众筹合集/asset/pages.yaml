  md: '学区房的问题，其实我写过《我为什么不研究学区房》（附后）。从投资角度来说，我认为任何投资，必须尽可能剔除它的附加功能，尽可能让功能简单化，才能实现最好的投资效率。比如投资房地产，就希望它的租金和升值最大化，但如果你同时给它附上自住（离单位近）、学区等多种功能，势必就要求在租金和升值等回报上有所让步。因此，从纯投资角度，我是不研究学区房的，变数不少，特别是学区的划分，完全掌握在行政力量手里，不能以市场分析的眼光来看待。


    但学区房的确是很多人的一种客观需求。即使不从投资角度考虑，有条件的人们也尽可能给儿女创造一个更好的读书环境。与其在社会上找关系而不得，还不如买个学区房省事，同时学区房名额自己使用以后，还可以将房子卖给下一个有学区房要求的客户。比如北京著名的华清嘉园，基本上上学的孩子上到小学三年级，家长就开始挂牌卖房了。


    面对这种客观需求，我们不妨分析一下学区房的情况。首先，一个好学校的形成是多种因素共同作用的结果，其中，历史形成的品牌效应是最最重要的！比如北大清华（当然学区房一般特指小学、初中、高中），有了好的品牌效应，就会吸引最好的生源、最好的师资、最多最好的投资。如此良性循环。这种品牌效应尽管随着政府均衡教育资源的努力会有所平衡，但做到完全均衡可能很难。而在私立学校，这种品牌竞争会更激烈，虽然私立学校招生不会与学区房挂钩，但靠近优质学校的房屋仍然会受到更多的青睐（尤其是出租）。


    市场上的学区房有两种，一种是兼具居住功能+学区房额，比如北京“宇宙中心”华清嘉园；一种是基本不能居住，纯粹就是买个配额。比如北京有一些又老又破才几十平方米的房子，也能有学区名额，但房屋基本上就是个摆设和道具。


