  md: '我的切身感受是先把自己的需求，首付和月供弄清楚，作为出发点，再找项目，否则众多的信息让人容易晕，无从选择。在实际操作过程中会有微调。中介在推荐项目时，如果我们的目标不明确，那信息多的很，还经常整个特房价啥的。


