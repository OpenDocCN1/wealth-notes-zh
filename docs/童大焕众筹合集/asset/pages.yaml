    这件事的始作俑者，毫无疑问，来自于我们久已有之、于今为烈的严厉控制特大城市人口规模的思路。在 “人口控制” 这一根本不可能完成的大目标下，从 “以业控人、以房管人、以证管人”
    的收效甚微，终于发展到史无前例之最不人道的 “以教育控人、以亲情控人、以人伦控人”。


