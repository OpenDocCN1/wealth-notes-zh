    优质房产还是最好的保险和融资工具、教育基金。我们经常会遇到这样的说法：“身边很多人告诉我，房子涨了多少都没用，不卖掉就不算。”其实这类人是抱着金饭碗讨饭吃。这样回答：能升值又能跟银行随时发生借贷关系的好房子是最好的人生保险。万一急需用钱的时候，你可以十年期抵押贷款用未来十年分'
