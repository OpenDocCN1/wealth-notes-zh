    黑格尔有一句名言：存在即合理。完整的译文是：凡是合乎理性的东西都是现实的；凡是现实的东西都是合乎理性的。我认为，对自由自主的追求是人的天性，但传统家庭桎梏了人的天性，使个体的自由和自主无法破茧成蝶羽化飞升


    ——但不是因为观念或制度安排的落后，而是现实生产力的制约所致。指望通过伦理观念的变革引导制度和人类的变革，我不认为是一条切实可行的路径，因为大多数人都是懒惰的，只能被现实的变革拖着走，甚至拖也拖不走，成为时代的弃儿。“现实的变革”来自哪里？首先是来自技术进步和生产力的提高。比如城市化就是生产力和生产方式变革的产物，是结果，而不是原因。家庭的变化，也是生产力发展的结果，而不是观念进步的结果。整体的社会观念进步，是落后于社会的技术进步和生产生活方式改变的。大多数人充其量只能做到“顺变”，真正站在时代变革的思想和行动前沿、敏锐地提前洞察变化、洞见未来的，永远只是少数人。而这少数人，通常只能超前于时代半步，才能真正成为时代的弄潮儿。超前太多，就不是时代的弄潮儿和引领者，而很多时候可能成为烈士。


    传统家庭的解体、未来家庭的诞生，也是技术进步带来生产生活方式改变后， 人类进入城市化时代以后的必然产物。


