  md: '环大都市鬼城圈之一斑：“像东莞、惠州每年都是 10 多万套，但是没想到他们的销售金额也超过了深圳，这两个城市加起来差不多有 1300 亿，而深圳只有
    1200 多亿。”（语出深圳链家研究院院长肖小平）环北京更甚。韩国首都首尔卫星城龙仁市 100 万人口，5301 套待售新房就被资深房地产经纪人指斥“不负责任”，我们的环北京一个项目就数以万套房子。


    有人评论道：“韩国怎么和中国比啊，中国未来至少 8 个城市超过韩国首尔。”


    我说：“中国人的一天 24 小时不会比韩国人更长哦。”


    这位读者的意思是：韩国人口少，中国人口众多，因此，中国的大城市也一定比韩国的大城市大。因此，外溢人口也一定比日本、韩国更多，外溢半径也一定比日本、韩国更大。


    我的意思是：日本、韩国这些地域狭小、人口也远远少于中国的国家，近年来也呈现出非常明显的人口往东京、首尔市中心集聚的态势，东京、首尔市中心一房难求；30 公里之外的卫星城则冰火两重天，建设几十年都达不到当初设计的人口和规模，近年来更是呈现出明显的人口迁往市中心而衰败的态势。中国固然因为人口众多的缘故，而往大城市集聚的人口也众多，但是外溢到
    30 公里外远郊区域的人口从比例上只会更少，与现有相关区域的巨大供应量形成强烈反差：一是集聚效应会使集聚的地方更有效率和价值，比如：同样做专职滴滴司机，工作时间基本相同，在县城可能月收入
    1 千元，到地级市可能就是 6 千元，到省城和一级大都会可能就是 1 万元。二是人口居住外溢一定受到时间的限制，每个人一天都只有 24 小时，并不因为你人口众多，上帝就特别多给你单程
    2 小时路上时间。


    沿着这个思路，我们可以分析得出结论：


    人口大国和人口小国相比，城市的人口和服务业产业集聚度反而会更大！这是由人口集中的吸附效应决定的：人口越多越集中的区域，效率和赚钱机会越多，对新移民的吸引力越大。相反，那些政府规划的新区，也许十年八年甚至像日本卫星城多摩新城一样，半个世纪都达不到设计规划的人口规模。而人的生存与发展机会，是一天也不能等、不会等的。人总是先找到机会的地方去寻找发展空间。'
