  md: '时候，40万非得在北京买，只能买到偏远的非连片建成区，那就是陷阱。远不如把视野放开一点，到强二线甚至强三四五六七八线城市，比如一些特殊的小县城或镇去寻找自己的“起步产品”。


    事实上，在过去18年全国房价一片涨的高歌猛进声里，北京辖区内没有涨过河北燕郊小镇、没有涨过一些东南沿海小县城的房子比比皆是。


    正确办法是根据自的实力，精心选好自已的“起跳点”，而不是抱着“京沪永远涨”的刻板成见，死死把自己锁定在了一线或环一线地区。我在2016年上半年警告说，手里拿着三四十万首付的，最容易坠落到“环大都市鬼城陷阱”中，就是这个道理。


    +   3. 依然停留在传统的观念中看有形的房子，看不到房子的真正价值在无形的区域价值。也就是只有特定的城市空间未来才有房地产价值。全国98%以上的绝大多数空间都没有房地产投资价值——不管房子盖得多好，周围多么山美水美空气清新。


    如果你拿着不多的钱，却买到了自己各方面看来都非常满意的房子，那么你可要小心了，你买到的很可能是一个将来会跌、甚至将会没有人愿意接手的房子。反之，你用不多的钱买到的房子，户型、面积、装修等，有很多不满意，也许你反而买对了。换句话说，房子的价值，在房子本身之外大部分你看不见的地方。


    +   4. 年轻人如果总想一步到位买房，一买就要求住起来宽敞舒服，要三居，要满足两个孩子两个老人等等的需求，那我很肯定地告诉你：除非你是富二代，否则你已注定一辈子的劳命！


    这不仅仅是安逸不安逸的问题，而是一下让这些追求一步到位的跌入永远爬不起来的陷阱和深渊——在实力有限的条件下，他们只能买到很远，很偏，很没有连片建成区域的地方。他们自以为是天堂，却在奋不顾身地跳进地狱。'
