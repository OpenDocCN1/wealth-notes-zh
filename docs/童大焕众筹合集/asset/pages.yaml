    你不转变观念适应社会变化，你的旧观念就会把你自已淘汰。


    # 5 如何合法的规避限购？


    我一直说， 限购就像拦了一道三峡大坝，筑坝容易炸坝难。2015 年初中国社科院预测当年会取消一线城市限购，我说不可能，因为那样会加速供应过剩的三四线及以下城市崩盘。


    今天已是 2016 年 3 月 6 日，随着一系列货币宽松、利率降低、税费降低、非限购城市首付降低等政策出台，要去库存的三四线及以下城市还在半死不活， 仍在限购的一线城市已经非常火爆甚至楼价大涨，看这态势，限购长期化怕是难以避免的事情。


    最有楼市投资价值的地方被严厉限购，不限购的地方又是陷阱大于机会，怎么办？


    有人用代持、假结婚等各种七七八八的边缘规避办法，有人把目光聚焦于小产权房，还觉得小产权房便宜，租金却不低。我推荐更普遍的办法：宁可购买优质写字楼和商住，也不买小产权房。因为小产权房缺少了房地产的灵魂——金融属性，
    也不能拥有银行杠杆。得不偿失。而小产权房往往还牺牲了优质地段。即使同在优质地段，小产权房的涨幅，也不会高于周边商住或优质写字楼。而后两者则有加高速的杠杆，资产和增值都倍增。


    【有学员问：关于限购和不限购房子。人们一般喜欢买限购的房子。但同等价位，不限购的房子一般地段要明显好于限购的房屋。按照您的分析，那似乎应该是不限购的房子更值得投资了，但您也说过如果有购房资格应该买限购的房子，您能再具体分析下吗？'
