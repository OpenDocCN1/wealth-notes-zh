    # 心有准绳 目光如电【学员独家 注意保存和保密】


    现实生活中我们每个人都常常遇到一种情形：对同一件事物的判断，哪怕是专业人士，也是公说公有理，婆说婆有理，尤其是同一个专家学者的观点，也是良莠并存，切不可因迷信而照单全收。如果没有一个基本正确的判断尺度和准绳作为定力，我们往往会掉进越看越糊涂的陷阱。逃出这个陷阱，把握全局的理性能力和逻辑能力殊为关键。我们以分析一篇文章为例，通过建立一个正确标尺来衡量其判断，是非对错立见。一次详尽分析，甚读十年大书。


    2016 年 5 月 8 日，刘晓博先生在搜狐博客中发表了博文《关于楼市，这 25 句话你应该知道！》，其中有很多真知灼见，也有很多观点值得商榷。下面是我的一些弟子对他观点的点评，我则主要从“要用什么样的尺度和准绳来判断”这个角度提出我的意见：


    1、刘晓博：房价是一种货币现象。只要一个国家的“M2 增速减去 GDP 增速”为正，这个国家中心城市的房价就会上涨。禅宗说，不是风动、不是幡动，而是心在动。我说，不是房价在涨，而是钱在贬值。


    XJW：2016 年，房价不单纯与货币供应有关，而且与人顺着城市化方向流动有关，与某个城市房屋的供应情况有关。所以，即使 M2-GDP＞0，中国的房价也会分化。好的涨上天，坏的落入地狱。


    ZFL：房价的确与货币现象有关系，但房价上涨原因不只是“M2 增速减去 GDP 增速”为正。房价上涨主要是聚集效应，人口越聚集的城市房价越'
