  md: '# 第六大窍门：人是衡量一切的尺度。


    2016 年 7 月 14 日晚上，一个大学生在《人文经济讲座——陈志武：从自由选择看文明化进程》讲座上问陈志武：怎么学好经济学？他的回答非常好：  学好经济学关键不是学好各种公式、数学，最最关键是对人本身保持最浓厚的兴趣。


    城市化和房产问题也一样。要得到正确的判断，只需要紧紧把人放在首位来思考来研究就行了！不能眼里只看金钱，必须眼里只看真人！


    比如有私人订制客户问我：童老师，燕郊的房子涨的好快，天宫院地铁边上的房子才 32000，就是因为燕郊离通州近么？


    我说：天宫院虽然在（北京）四号线，但那些人到哪里去上班呢？到市里上班的都很分散。但是燕郊的人到哪里上班呢？国贸，（和）未来的通州新城。而且，有北京购房资格的人在全北京除通州之外都可以买房，但是没有北京购房资格的人，只有燕郊一个小小的出处。所以，以后等通州新城建好了，燕郊的交通更好了，燕郊优质房屋赶超天宫院也许并不稀奇。哪怕它没有地铁。


    有同学请我给大家总结详细推荐城市化和房产方面具体书籍，相关课程，具体专家，比较好的学习资源或讲座。我说，我读书少，城市化方面就读过《城市的胜利》和《落脚城市》，陆铭，周其仁，黄文政等人的文章断断续续读过一些，
    他们有没有系统性的相关著作我不知道。我读书比较慢所以也读得少，多数是自己观察、思考和领悟。房地产方面，什么书籍都没读过。我认为当下中国，懂城市化的房地产战略型专家太少，汲汲于技术的人太多。战略不对，技术无用。


    他又问，您真多知识，哪里得来？我认为它来自正确的分析框架和体系，紧紧围绕人口和未来就业的方向，世上一切财富都是依附于人而存在而显现。


    我自己的图书，从《买房的革命》、《世纪大迁徙——决定中国命运的大城市化》、《穷思维富思维》、到《定位中国——认清我们的时代和时代中国的我'
