  md: '5 均衡发展幻想。生产力水平越落后，世界各区域之间发展越均衡。生产力水平越高，区域差距越大。从原始社会，到农业社会，到工业社会，再到服务业社会，发展的马太效应越来越强。人类的一切努力、一切专业的学习、研究、独立的思考，以及城市化的发展，等等，也都是在拉大人与人、地区与地区之间的差距！均衡即死亡。一切妄想结果均衡的努力都会成为人类灾难！水无落差，就是死水。有了落差，一江春水，生机盎然。没有这个差距拉大作为“预期”，每个人都会成为懒汉和社会寄生虫。因此，承认不均衡的普遍存在是人类秩序和道德的前提。人的天资秉赋、努力程度各不相同，他的结果必须与此相匹配，才是真正的社会正义。


    服务业主导下的超级大都市化浪潮，已经像高铁列车一样呼啸而来，很多人冥冥之中还在期待城市发展像农业时代一样“均衡”。在实际买房过程中，他们一直纠结的是：这个地方已经这么贵了，另一个地方相对便宜得多，是不是这里已经涨不上去，另一个地方将来会涨上来呢？他们看不见越积聚集越有效率
    和创造力，越支撑起高收入人群，将来房价也越高这个基本逻辑。所以每每出错。


    正确做法是抛弃均衡幻想，紧紧追随有钱人的脚步，看他们今后积聚在哪里上班和哪里居住，就及时把资产置换到那里！而不是相反地逆潮流而动。任何人任何时候都不要和趋势为敌。任何人都战胜不了趋势。


    # 6 把权力中心当城市中心。


    在人类非常漫长的时间里，权力中心都是城市中心。在生产力水平低下的时代，政治管理者就是中心。但是随着工业时代和服务业时代的到来，世界将以企业家、思想家等智力阶层为中心。因为越来越多的财富将掌握在企业家和创造阶层手里。


    根据德鲁克的理论，管理者的素质与绩效是企业唯一拥有的有效优势，是管理导致了经济和社会的发展，从而导致了储蓄和资本投资的发展。管理层是现代机构的特殊器官，正是这种器官的活动与绩效，最终决定了特定机构的生存和绩效。'
