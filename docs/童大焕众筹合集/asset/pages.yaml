  md: '在我看来，一切真知都是有迹可寻的，有逻辑，有方法，有方向，有路径。如果谁要是说“可意会不可言传”、“天机不可泄漏”之类，我想不外乎两种情形，一种是他想明白了但不想让你分享因此故弄玄虚；第二种情况更多，他其实根本上就是个欺世盗名之徒，自己都没想清楚整明白，只是在那儿做趁学阿世的混世魔王罢了。


    那么，获得真知的正确路径和方法在哪里呢？我认为至少包含但不仅限于以下几个重要方面：理性方法全局思维；多角度获得事物全息图；重视方法轻视结论；敢于和善于甄别学者的优劣。


    **理性方法全局思维**。中国古人有句话叫做“不谋全局者不足以谋一域”，苏东坡的诗《题西林壁》说：“横看成岭侧成峰，远近高低各不同。不识庐山真面目，只缘身在此山中。”中国还有成语叫做“盲人摸象”，说的都是全局思维对看清事物真相具有至关重要的决定性作用。西方近代哲学史上重要的理性主义者、与笛卡尔和莱布尼茨齐名的巴赫普·斯宾诺莎（1632年11月24日~1677年2月21日）更是这样定义人类的“理性”：**理性就在于根据对全局的正确认识来采取适当的行动**。激情的被动性是人类的桎梏，理性的主动性才能给人类以自由。知识就意味着自由。自由并非排斥激情，而是摆脱了片面的无节制的激情。人类因理性而善良。一切理智行为都是道德行为，总之，德行就是理智。伟人并非凌驾于他人之上的统治者，而是超越了蒙昧的欲望，能够运用理性驾驭自己的人。


    我们以前在争论的时候常常是这样的：你说我不理性，我说你不理性，到底什么是理性，谁也说不清楚。中国人的模糊思维里，什么盲人摸象啦，庐山面目啦，全局一域啦等等，虽然已经非常接近理性的定义，但由于缺乏明确的边界意识，还是只有斯宾诺莎准确地定义了理性。看你是不是理性，就看你是不是看清了全局。中国人常常把理性、智慧和善良对立起来，甚至说善良比智慧更重要，简直是因果颠倒，没有理性没有智慧，连是非好坏都分不清，狗咬吕洞宾不识好人心，怎么能够善良？这不是明摆着胡说八道为自己的无知找借口嘛！


    有时候很多庞大的数据非常唬人，一下子把人就给迷惑了，但由于缺乏全局思维，所以那样的数据对于局部决策有用，但对于整体决策，仍然是非理性的。'
