  md: '如果你没有战略，就会成为其他人战略的一部分。变化不仅仅是生活的必需品，它本身就是生活。 将来不再是资源限制决策，而是决策决定资源。还有一句最著名的：未来总是来得太快，而且以错误的顺序出现。


    实话实说，我没有读过托夫勒的作品，但是我对现实世界的观察，跟他有很多近似或相同的判断：


    **人类迄今为止只经历过一次革命，就是工业革命**。工业革命之前的公元零年到1800年，人均GDP 只增长了50%，城市化率徘徊在3%左右。工业革命之后，到2000年，180年左右时间，人均GDP
    增长了8倍，城市化率达到近半。这是陈志武领衔的量化历史研究得出的结论。


    **紧接着要发生的是人类第二次革命——这是我说说的——人工智能革命，大量流水线上的工人被人工智能取代**。服务业将取代工业成为人类主要生产活动，服务业将取代工业成为城市化的主要驱动力量。花旗银行和牛津大学预测，中国77%的工作都有可能实现自动化，综合组织34个国家57%的工作有可能实现自动化。


    如果说过去200年的城市化是由工业主导，把人类从漫长的农业社会中解放出来，那么未来近在眼前的城市化则将由服务业主导，把人类从机械枯燥的工业流水线中解放出来。


    工业主导的城市化和服务业主导的城市化有个巨大的不同：工业主导的城市化，集聚程度非常有限。因为工业要占用大量的厂房，同时，环保等要求也不适宜于人口高密度集聚。


    但是服务业主导的城市化却以高密度集聚为基本特征甚至基本要求。因为高密度带来效率、安全、分工、思想碰撞和创新的极大提升，我把它命名为创新和能量的“**人口、智慧与财富核聚变**”。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '千年未有的超级大城市化，宛如社会层面的地壳运动，将完全彻底改变传统的财富生成与分配逻辑。在人口和财富两个维度，超级大都市迅速陡峭地隆起，大城市周边和广袤农村迅速塌陷！人口集中到哪里，财富就如影随形聚集到哪里，形成“人聚财聚，人散财散”的财富效应。


    上面用 1 千字简单阐述了人类上万年的发展历程。可以说，没有城市化，万古如长夜。工业化带动了人类长达 200 年的上一波城市化，人工智能和服务业将在更短时间内带动更大规模聚集的超级大都市化。我估计，全球
    90%以上的人口未来将集中到占地球总面积不到 1.5%的超级大都市生产和生活，从事农业和工业生产的人口不会超过总人口的 10%，从农业和工业流水线上解放出来的大量人口，将迅速集聚到大都市中来，而且，这个积聚的速度比工业时代的积聚速度快很多。


    在社会金刚脱壳般迅速蜕变的过程中，一定要牢牢记住一个基本的因果关 系，这是判断未来变化的基本尺度：是技术和生产方式决定生活方式和积聚程度，而不是相反。这个因果关系绝对不能颠倒。


    很多人在社会变迁面前缺乏定力，一点点风吹草动就让他摇摆了心态甚至改变了方向，导致无法集中精力和力量坚定方向去做一件正确的事情，根本原因就是对他们的大势把握不清。


    房地产投资的三个关键词是地段，地段，地段。


    看见未来的三个关键词是大势，大势，大势，是任何金钱和权力都无法改变、无法左右的大趋势。牢牢把握了大趋势，也就把握住了未来的财富金钥匙。因此，对大趋势的把握和坚守，须臾不可动摇！


    农业时代，工业时代，服务业时代，人类三个不同时代的最大差别，就在于空间和时间的分配发生了根本的改变：'
  merge: -1
  img_proc: true
- pgno: 7
  md: '农业时代，生产和居住空间极度分散，效率很低，时间不值钱，人类上万年没有什么变化；


    工业时代，生产和居住空间相对聚集，时间比较值钱，人类 200 年间变化巨大；


    服务业时代，生产和居住空间高度聚集，时间非常值钱，有钱人和有创造力的人时间尤其值钱，人类几年、几十年间变化巨大。


    今后所有的房地产投资，都将紧紧围绕着时间和空间的主线展开。社会变化的速度越快，时间就越值钱，空间的集聚效应就越明显。


    但是，人类历史的发展从来都是如此：技术进步、社会发展往往远远超前于社会整体的观念进步。超级城市化已经到来，上至天子下至庶民，多数人头脑还停留在工业甚至农业时代！


    主要表现在以下几个方面：


    1 叶落归根告老还乡情结。看不清大量乡村和中小城市迅速衰落的现实（或者即使看见也仍然抱着“乡村复兴”的侥幸心理），稍微挣几个钱就回家盖房。结果就是自己在城市住老鼠窝，家乡的房子给老鼠住。


    正确的办法是随处作主落地生根。不仅仅资产要置办在自己工作生活的地方，甚至要更进一步，把资产办在未来人口流入、有升值空间的地方，自己则在工作生活所在地租住。也就是：你买的房子给别人住，别人买的房子给你住。在今日中国房地产供应总量
    3 倍于人口数量的整体背景下，除了少数人口不断流入的一线和强二线城市，在大多数地方租房都有很大的自由选择空间，而且房租会相对越来越便宜。


    2 有天有地郊区别墅情结。仍然是农业时代的思维遗存，不适合现代社会的精致打理。安全，管理，低密度下的各种商业和公共服务配套不到位，从单位到居所的时间成本，面积和总价高，家庭小型化，防震抗灾能力不如现代化高楼，等等，都严重制约别墅（不仅是郊区别墅）的升值空间。'
