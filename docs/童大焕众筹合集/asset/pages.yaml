    # 童大焕——2016 年 3 月 12 日星期六


    近日北京某著名小学附近房子卖出每平方米 40 多万元的天价，北京市最牛名校之一北京四的校长刘长铭 2016 年 3 月 9 日在被问及“天价学区房”时说：“如果是我，我不这么做。我会把更多的精力，包括家庭财力，放在改善家庭教育的品质上。”北京市市长王安顺则表示，两会期间很多媒体记者追问代表委员们对所谓单价
    40 万一平的“北京天价学区房”情况的看法，据了解其实这并不符合事实，而是有个别中介想炒作房价，将房子挂出天价广告售卖，但这并不是普遍情况。


    在我看来，中国家长对学区房和名校的追逐到了几乎疯狂的地步，这是非常愚蠢的做法，既是对教育规律无知的体现，某种程度上也是推卸家长作为孩子第一教育责任人的责任的体现。一直以来，不论从教育还是从投资角度，我都不鼓励学员和弟子们过多关注学区房。学区房作为辅助、兼顾性考虑，是可以有，有时甚至是必需的。但过度追逐，就有本末倒置之嫌。


    学区房的本义是政府为了打破教育不均衡，改变择校热，以及改变学生路远远跑去上学的奔波，实行就近划片招生制度，结果，社会对名校的追逐，通过购买学区房的形式曲线救国。结果越来越扭曲：名校没有得到应有的社会资金支持，资质兼赋较差、不那么优秀但通过学区房硬拼进来的学生，会毁掉他们的自信。毕竟天资与后天勤奋与否不是通过钱找出来。煤球进钢炉出来只是煤渣。西安某'
