    +   - **8 商品房销售面积同比下降 13.4%，7 月同比下降 17.9%**。


    +   - **8 商品房销售额同比下降 13.7%，7 月同比下降 17.9%**。


    这表明中国房产市场泡沫问题仍很严重。伴随房地产市场下行调整而来的，是固定资产投资全面放缓，它也在拖累工业生产增长速度明显放慢。


