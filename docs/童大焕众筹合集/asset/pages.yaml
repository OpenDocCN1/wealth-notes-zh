    # 己之所欲，设身处地。


    1 年轻时。深圳链家研究院院长肖小平有两条微博：“远离市区的房子，价格比较便宜。普通年轻人的资金实力，比较薄弱。因此，总有人鼓励年轻人去买这些‘远离市区的房子’。且不说投资回报，就纯自住的角度，我觉得这也不是一个好选择。年轻人的时间其实非常值钱，应当花在加班上、花在聚会上、花在学习充电上，不应当花在塞车、等车上。”“所以，很多年轻人，即使买了这些远离市区的房子，依然是在市区租房居住。他们有两种打算：一是等到房价上涨，换回市区；二是房价若不涨，等成家了，有孩子有老人同住，那就住过去。”


    换句话说，如果你不能常住的房子，是不应该去买的，宁要市中心一张床，不要远郊区一套房。你自己都不能常住的东西，未来也别指望有多大的升值，更别指望有人来接手。


    还是我那句话：时间成本是人生最大的成本。两个层面的意思：一是有价值的房子一定是越早买越便宜，不要等什么“时机”；二是上班到居所之间，长年累月所花费的时间成本，也是比房价更昂贵的成本。


    越是年轻的时候，越应该集中力量买升值幅度最大的房子、做做强做大资产做为首要任务。而不是白日做梦妄想买“一步到位”够一家子人住的房子。


    2 中年时。很多人以为，超大户型或者郊区别墅是终极置业。但其实，未来的家庭是越来越小型化的。四代同堂的日子早已经一去不复返了。对不少家庭，超大'
