  md: '# 抽丝剥茧看扑朔迷离楼市 2014


    先说一个中国社会的心理大背景。当代中国自1949 年以至现今65 年的历史，最大问题是权力不听从规律和知识的召唤与约束，决策不尊重科学和规律，而且权力掌控着空前绝后、比古代封建皇帝还多得多的资源（不仅仅是绝对数量，更可怕的是相对比例）。这种情况下，对权力的膜拜与盲从成为整个社会的集体无意识和最基本的大众心理，最典型的例子表现在持续的公务员热和人们对楼市行政调控能力的极大迷信上。这种情况下，中国人的理性整体丧失，从草根到博土后，章被诗性、幻想、理想主义和权力迷信支配着的人大有入大。而在掌控极大社会资源和大众膜拜的双重作用下，权力自身也抽鸦片似地患上了无所不能的能力和道德幻觉症，每年的政府工作报告和领导承诺仿佛都在写赞美诗和幻想曲，动听极了。


    然而，规律本身是永远无法抗拒和违背的，就像生老病死一样不可阻挡。即使是在政府掌握几乎全部社会资源、甚至连农民和市民离开村庄或出生的城市一步都需要政府批准的年代，规律也要顽强地起作用。越是违背规律，规律的报复就越强烈。计划经济使得中国经济陷于崩溃、全民陷入饥饿危机：不许农民和市民离开村庄和出生的城市一步，则导致过度开垦使中国
    300 多万平方公里土地荒漠化。


    当代中国城市化运动自 1978 年重启以来，经济挂帅取代了政治挂帅，但走的仍然是政府主导的路。当代“中国经济奇迹”里面有条主线，其实是一枚硬币的正反两面：一是工业大跃进，一是城市化尤其是小城镇大跃进。为什么会出现大跃进？这是由经济规律决定的。这个基本规律是花别人的钱办别人的事，或者花别人的钱办自己的事，既不讲效率也不讲节约。政府主导微观经济（招商引资），官员短暂任期与地方和企业的长远利益形成不可调和的尖锐冲突。在中央
    GDP 挂帅的指挥棒下，任期短暂的地方主政官员只管不惜代价把城市规模和工业规模做大，我走后哪管洪水滔天。


    地方政府之间招商引资竞争遵循谁比谁价格更低的市场逻辑。降低地方价格的方式就是降低土地、环境和劳动力价格。而政府自身又既不产生土地也不创造财富，那么工业用地降低部分就要有东西来买单。买单的就是房地产！政府通过房地产补贴工业的模式招商引资，扭曲了土地、劳动力和环境、资源的价格，使工业产能很快过剩，也使房价不断升高。房价飙升又刺激了房地产商和购买者非理性跟风买地买房，促进了城市空间的集体非理性扩张。工业产能过剩到什么程度呢？世界平均水平是
    26%工业化率对应 70%左右城市化率，发达国家是 20% 工业化率对应 80%以上城市化率，当下中国则是 47% 的工业化率对应只有 35% 的真实城市化率。


    城市空间的过度扩张又到了什么程度呢？2013 年初国土资源部公布过一个数据，说彼时之前的 8 年间，城市空间扩张即住宅用地增量是人口增量的 3 倍。


    也就是说，不负责任、短期行为的政府主导经济，导致工业扩张和城市空间'
