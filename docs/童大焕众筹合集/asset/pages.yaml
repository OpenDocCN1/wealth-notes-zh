- pgno: 231
  md: '我特别强调这次：布置的作业非常重要，既考验大家的理论学习成果，也检验大家的实际操作能力，请大家务必尽一切可能完成作业。


    但到 9 月 17 日止，8 天时间过去，收到的作业稀稀拉拉。绝大多数同学没有完成。即使交了作业的，基本上也没有推理过程，我不知道他们得出的结论是蒙的还是经过认真思考和推理的。也许这个问题的确难，也许有的同学偷懒，也许有同学认为这是上小儿科问题，根本不必回答。但有一句话是怎么说的？——
    未经思考的人生是不值得过的。同样，未经推理的结论是不能信的，未经重新推演的知识是不可能变成自己的本领的。


    这道题正确的解题方法和步骤应该是这样的：运用卫星图等，分析上述几个项目过去涨幅不同的原因，这些原因（变量）未来是否依然存在，有没有新的重要变量产生，由此对未来各自房价形成什么影响，最后得出结论。


    在分析过程中，会有很多变量影响房价，比如地段，交通，商业，医院，区域人口和产业密集度，学区，房屋品质，年代，等等。但最关键的变量往往也就是一两个，抓紧这一两个变量也就抓住了问题的要害。诚如风格纯粹所说的：“我平常夸奖人，很喜欢夸一个人思维方式好的时候，夸他思维干净。这几乎是我对一个人最高的评价。投资或者生活，面对的变量无数，你要学会在不同的条件下，抓住最主要的变量，这也是童老师经常说的，大道至简！”


    所有的房屋，表面上是居住，但最根本的是围绕两个方面：就业和上学。这两个方面才是最决定房屋价值的“车的两轮，鸟之双翼”。人口的集中主要就围绕着两个方面来进行。这里又分为写字楼密集区，学校密集区，商业密集区等。当然也有因纯居住而集中的居住密集区。人聚财聚，人散财散，人口集中是关键。还有，就是人口集中以后，学校、商业、医疗等作为后期配套和辅助功能，也会迟早跟上来。这一点要特别注意。比如北京
    CBD 后花园之一珠江帝景的学校——陈经纶帝景分校，多年来就位房朝阳区第一。分校的历史并不长。而一些历史上的名校，由于实施划片招生的学区房制度以后，如果没有更多更高质量人口的集聚，教育教学质量也是有可能下降的。


    从收到的作业来看，分析最有条理的是上海小罗同学的。她是这样分析的：'
