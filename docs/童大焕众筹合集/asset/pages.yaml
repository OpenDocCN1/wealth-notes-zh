  md: '童大焕（不断更新中，目前截止到 2016 年 3 月）


    # 1. 中国城市化率到底是多少？


    2014 年官方数据是 54.77%。的确，54.77%的人都长期在城市生产生活，但是，从经济学意义上，2.7 亿左右的农民工人在城市心在乡【2014 年全国打工者群体
    27395 万人，其中 8400 万制造业，6000 万从事建筑业，2000 万从事家政；留守儿童 6102.55 万，流动儿童 3600 万】，他们的最主要消费和投资（尤以房地产为主）都在乡村，因此，从经济学意义上，扣除
    2.7 亿农民工、乡镇工作的机关和事业单位工作人员，中国真正的城市化率 40%都不到。


    # 2. 现在到底是中国房地产的春天还是冬天？


    真正的春天才刚刚开始。市场很复杂，政策从此变得简单，以前那种政策抽风十年九调控的时代一去不复返。市场回归它应有的本色。过去遍地黄金的时代也一去不复返，房地产跟城市化规律的紧密结合成为开发商和投资者必修的功课，甚至是惟一致胜的法宝。


    2015 年很多房地产老总离职，是因为他们根本不懂城市化。接下来会有非常多的开发商倒闭，会有非常多的投资者血本无归。因为市场检验前期投资的时代到了。2014
    年是城市化和房地产投资的一个重要分水岭。


    支撑未来房地产春天的现实需求有两点：一是投资需求，大量过去在中小城市失利的必须转到大中城市来；二是自住需求，大量过去回乡盖房的，发现没有价值而且仍得在城市买房或租房，其中逐渐会有一部分把购房注意力集中回到城市来，只需要一个时间和观念的临界点。这个临界点就在
    2014 年前后。


    支撑未来房地产春天的现实可能性在于：现有城市密度太低，城市化率太低，都市中的熟地更新太慢。


    过去由政府主导向外扩张的形式基本终结，未来由城市化规律主导的收缩模式开启。


    城市有自己的自然边界，这个边界由时间成本决定。像北京这样的超大城市，到最近一个城市中心（超大城市多中心）的正常距离一般不超过 40 公里。1.5 小时'
