  md: '第 6 套月供将近 12 万，第 7 套将近 24 万，第 8 套将近 48 万，第 9 套将近 96 万……


    这还是按每一次换房都是按首套房来计算的，在现有神经病似的的限购限售政策下，这一条并不容易实现。上述算法也没有计算实际上到了三四千万总价以上的房子，经常面临有价无市甚至亏本卖不出去的情况。


    这样下来，即使买房是纯投资，买完就出租，加上租金在内，相当多数家庭到第二套房就快支撑不住月供了！到第五套房的时候已经是一个阶层跟另一个阶层的差别了！


    如果想用快速增长工资劳务性收入的办法来提高月供能力，在资产升值远大于工资增长的时代，显然对于绝大多数人来说是不现实的。相当多数的人，从进一个单位到出这个单位，十年工资不涨几乎是大概率事件。


    因此，正确的购房投资方法是这样的：


    1 年轻的时候，第一次买房要穷尽一切月供能力，尽可能把资产做到最大。同时也是非常关键的是，选择的区域应该在涨幅可能最大的区域，为此可以牺牲租金。这样就可以用时间换空间，在我们月供能力增长不快的情况下，尽快让首付能力快速增长，以期今后进入更有价值的区域。比如最近我和一个弟子就在纠结，到底是联合在杭州核心区买房呢，还是先在河北燕郊买？两者的首付比率都差不多。杭州租金很高，燕郊涨幅更快——虽然燕郊已经进入高位，高得有点吓人——有的房子从
    2016 年的 2 月底 3 月初到现在的 8 月 31 日，已经足足涨了 1 倍以上。全燕郊几乎再也找不到 2 万元以下单价的房源。但由于它是环北京不限购区域的唯一正确出口，加上通州新城核心区的举国之力建设，国贸——通州—燕郊未来将基本形成相隔各
    15 公里的三点一线结构，因此，它即便有的房源追赶到郑州的房价，也是有现实支撑的。因此，我们最终决定还是先各自在燕郊安营扎寨。杭州核心区虽然迟早要补涨，但时间不确定。同时它的购买力也不像燕郊一样集中了全国在北京的溢出人口之力。


