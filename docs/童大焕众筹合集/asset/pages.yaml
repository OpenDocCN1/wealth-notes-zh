    **第七大窍门：** 投资是向未来要钱，不是现在斤斤计较。要舍得。有舍才会有得。舍得什么呢？舍得付出咨询费、中介费，舍得付出哪怕高一点点的代价去换取未来的更高收益，舍得银行利息（哪怕适当上浮），舍得适当的融资成本，舍得割肉抛弃非优质资产换取优质资产。楼市投资，就是和时间空间赛跑的智力游戏，归根结底是和空间赛跑。因此，
    还要舍得高时间成本的郊区小区的优美环境，换取低时间成本的市中心的次优环境。人类的审美习惯，是会改变 的。这个改变，根据人类的需要而定。


    **第八大窍门：** 只有机缘巧合之遇，没有最好时机之说。


    随着未来规律主导城市化和房地产成为主流，政策主导成为支流，在选定有价值区域的基本前提下，何时入市的时机问题将变得越来越不重要。因为靠波段炒作的空间越来越小。因此，只要条件够了，及时入市，就都是最好的时机。


    **第九大窍门：** 只有最匹配，没有最好。每个人去够他自己够得上的东西，就是最匹配的，就是最好的。


    **第十大窍门：** 去掉一个最高分，去年一个最低分。


    城市内部，区域内部，地段内部，都是一个又一个你中有我我中有你的活的生态系统。在这个生态系统中，中高低端各界人士都有相应的住房需求也有相应的住房供应。因此，在选定好地段的基础上，同一地段，只需拿掉一个最高分（最高端阶段的豪宅）和一个最低分（小产权房或者非常的老破小），其它方面的选择只要匹配自己就行，不必太纠结。就像大陆板块的漂移和升降一样，涨长远看整个版块总体是差不多的。'
