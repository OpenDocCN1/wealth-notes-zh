    \ 冥冥之中看着你呢！如果你自己都不想要的东西，却等着别人来接盘，那一定是会受到市场规律的无情惩罚的。“道德律”三个字，拆解开来就是：以道（规律） 为纪律，谨守天道，然后自然而然，成为有德之人。\n\
    \n童大焕—2016 年 9 月 2 日星期五\n\n不论是投资，做学问，还是先做好学问再来更好地投资，都是人生漫长的修炼过程。这个修炼，就要紧紧围绕着对道（规律）和人的敬畏来进行。如果三生有幸，能够管窥万事万物规律（道）之一斑一角，那简直就是上帝格外恩赐，\
    \ 让我们偷偷地看到宇宙人间的一点秘密，便要格外加倍地去珍惜它，敬畏它，遵循它，实践它。不可目光游离，不可心猿意马。上士闻道，勤而行之；中士闻道， 若存若亡；下士闻道，大笑之。作为得“道”之人，我们一定要做上士，不要做不识好货的下士，不知“道”之所存，反而大声嘲笑它。\n\
    \n我一直说，人生最大的借力不是借权力，不是借关系，而是借势，借时代发展潮流之势。也就是借万事万物发展规律（道）之势。这是我们敬畏天道、敬畏规律的应有态度和方法。这个规律本身，是各种变量约束的结果。它会有小的修正，但不会有大的逆转。任何人不可能穷尽。聪明人懂得借势，而不是试图造势，\
    \ 甚至妄想改变趋势。便纵有再大的权力，便纵有倾国倾城之人力物力，能够一时造小势，最终还是要回归大势。时势造那些顺应大势的英雄，而不是英雄造时势。\n\n\
    多数时候，说起规律，论起道，似乎非常玄奥， 非常难。一般人难以掌握。的确如此。但事实上，人世间，万事万物的规律，无非四字而已：世道人心。“道” 字说来玄奥，人心则可以衡量。把握住了人心，也就接近了道的一半。\n\
    \n普罗泰戈拉说“人是万物的尺度，存在时万物存在，不存在时万物不存在。” 的确，不论从哲学还是经济学的角度，人，都是万物的尺度，是一切财富的源泉和旨归。\n\
