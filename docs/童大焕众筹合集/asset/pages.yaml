  md: '定要把自己放对位置，如果想走创新的路，就要凑到有其他创新的人的地方去，这在我看来比什么都重要。总结一下，我不相信所谓的国家创新，所谓创新国家就是那么几块地方，比如硅谷，比如以色列。很多中国企业没有足够重视位置这一决策变量，其实位置比产品重要、比产业重要。我们生在哪个地方，不一定要在哪个地方干事业，中国文化对离开家乡的评价很低，认为背井离乡、客死他乡最悲惨，其实现代化就是‘客死他乡’，下决心别死在你出生的地方，到更好的地方发展，因为那个地方的（创新）浓度够高。”


    瓦斯要浓到一定程度才会爆炸，铀 235 达到一定浓度才能产生核反应。人类的创新创造活动也是思维核反应的过程，要有很多富于创见的大脑不断碰撞才能互相激荡出新世界的火花。否则，一个卓越的大脑在一群平庸的人那里就很有可能成为被排斥的异端，不但得不到激励，反而会与环境格格不入，形单影只，甚至有可能郁郁不得志，终生愁苦。


    周其仁先生讲的，本来是一个常识，但在理性思辨空气稀薄的中国，这样的话说出来就有石破天惊的味道。因为很多人的头脑，总是剪不掉“农村广阔天地大有作为”那根辫子。中国文化的根，是面向农村面向过去的，而不是面向城市面向未来的。在中国的文化基因里，古往今来，在外面的世界发达了一定要“衣锦还乡”；即使一生都没有发达过，人老了也要“叶落归根”；即使半途客死他乡，也要“魂归故里”。中国人对故乡的依恋，就像一个长不大的孩子，永远离不开母亲的怀抱。


    在这里，我很愿意为周其仁先生的创新浓度说添一点砖瓦，加一点现实生活的料。


    在 1990 年代末，当网络热达到顶峰的时候，许多技术爱好者预测城市很快就会成为过时的东西，因为我们不再需要共享人行道和咖啡店。便宜的三明治意味着昂贵的办公室空间的结束。


    但是，数据显示正好相反：城市和面对面的交流已经变得更有价值！正如《城市的胜利》一书中指出的那样，自从电子邮件发明之后，商业旅行显著增加。自从视频会议发明之后，商务会议的参加人数猛增。'
