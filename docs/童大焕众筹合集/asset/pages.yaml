    2011 年开始的国家层面的严厉限购限贷政策，直接把开发商和投资者赶到了三四线城市。直到 2014 年起，中国大陆楼市冰火两重天的急剧分化，三四线城市哀鸿遍野，才真正让一些人认识到了“人聚财聚人散财散”的威力。


