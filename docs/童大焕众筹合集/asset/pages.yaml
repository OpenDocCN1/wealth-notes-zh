- pgno: 261
  md: '户籍管理、学籍限制、产业强迁等往外“赶人”。


    在这个过程中，很多买房者也相信，政府会有一只点土成金的手，规划一片新区就能崛起一片新城。这么多年来我一直在提醒大家，要相信市场不要相信市长，要相信规律不要相信规划，只有大城市才能救中国。今年3月5日QQ大数据再一次证实了我的判断。


    QQ基于8亿多活跃用户，通过大数据分析，于2014年3月5日首次披露“逃离北上广”数据图。数据显示，2014年1月16日至2月1日，共计4907万人从北上广深四城回到全国各地，占四地总用户数的51%。节后，约1070万的人真正逃离了北上广深，逃离率为11%，其中，北京又以18%的逃离率成为人们最想逃离的城市。其余的人选择继续他们的打拼之路，再次离开亲人，义无反顾踏上回归北上广之路。从2014年2月2日至2月25日，1994万用户在2014年首次从全国各地来到北上广深，新增率达到21%（这里不包含727万应届大学毕业生，他们要到每年6、7月份才离校，他们中的一半以上，毕业后将直接进入北上广深四座城市）。其中近7成是18至29岁的年轻人，而北京凭借27%的涌入率，再次夺冠，成为人们最愿意来此打拼的城市。


    也就是说，每年北上广深四大城市新增就业人口将达到1994 + 350 = 2344万，而流出人则近半。这意味着每年新进入北上广深四大城市的人口总量超过每年从农村进入城市的人口总量！（国家统计局数据显示，2002年至2011年，中国城镇化率以平均每年1.35个百分点的速度发展，城镇人口平均每年增长2096万人）这样一分析，中国的城市化路径就变得很清晰了：中国的城市化过程，不仅是农村包围城市、农民成为市民的过程，而且是从小城市到大城市的过程。相当多人，包括大学毕业生，包括刚洗脚离田的青年农民，都是一步到位先进入大城市，然后其中一半左右的人，在经过大城市多年的煎与洗礼之后，因为种种原因再向中小城市分散。而大部分的人，则留在了大城市！


    中国经济的基本运行逻辑（房地产被绑架补贴工业—支撑地方债—绑架金融和经济）和中国城市化的基本规律（率先大城市化然后约一半左右的人四散回到家乡附近的中小城市）说清楚了，再来谈具体的楼市就简单多了。


    时间进入2014年，楼市好像格外扑朔迷离：杭州广州郊区降价；政府工作报告8年来首次调低危门，“分类调控”取代了之前无差别的“房地产调控”，“针对不同城市情况分类调控，增加中小套型商品房和共有产权住房供应，抑制投机投资性需求，促进房地产市场持续健康发展”；北京副市长称京津冀一体化等将使市区房价必降；人大校长陈雨露、北师大教授钟伟等称防范下跌风险比控制上涨风险更为棘手更为危险；住建部副部长称10年内中国房地产不会有大危机；李迅雷认为库次涅茨基周期下行暗示房价下跌为期不远；王健林坚决反对楼市崩盘论；传统制造业继续衰退……表面上云山雾罩，但只要紧紧抓住上述中国经济的基本逻辑、城市化的基本规律，再加上各地方土地和楼市供应、国家总体货币增量、传统制造业景气程度几条主线，抽丝剥茧，分析起来并不难。


    早在2010年8月，我在创作《世纪大迁徒——决定中国命运的大城市化》'
