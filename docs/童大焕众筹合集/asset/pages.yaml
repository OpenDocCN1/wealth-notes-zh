  md: '在 1980 年以前，孟谷西地区，香港市区之一，位于九龙半岛。1979 年人口普查，此区人口密度为每平方公里 25.2 万余人，比号称世界人口最密地区的香港深水湾区（《读者文摘》1987
    年 2 期载，此区人口每平方公里 16.5 万人）还多，是世界人口最密的地方。


    1980 年之前，城市摩天大楼并没有像现在一样如雨后春笋拔地而起，人口最高密度已经可以达到每平方公里 25 万人。随着摩天大楼在城市的普及，人口的密度还可以再提升，并且舒适度也在提升。


    城市的容纳能力那么高，你说，你跑到 30 公里之外干什么嘛？


    从人口大国和人口小国的超级城市化比较中，我们可以清晰地得出结论：不论是人口大国还是人口小国，人口向少数大城市核心区集中的趋势是一样的。但是，人口大国的集中速度会更快，密度也会更高。因为，越是人口众多，越是地区差距和城乡差距大，“人往高处走”的动力也越强劲。


    中国正是这样一个人众众多，城乡差别和地区差别巨大的国度。因此，它的超级大城市化和超高密度集聚的程度，将有可能超过世界上任何一个国家和地区。


    很多人拿着发达国家的城市化过程，照猫画虎，以为中国也必须经历同样的——城市化、郊区城市化、逆城市化、再城市化“四个阶段”：


    +   1. 城市化阶段。出现在 20 世纪 50 年代，人口从农村向城市迁移，城市人口逐渐向大城市集中，大多数城市的中心地区都比中心以外的周围地区人口增长得更快。


    +   2. 郊区化阶段。主要发生在 20 世纪 60 年代。主要特征是，伴随着城市空气污染和高速公路的发展，在城市地区内首先是相对分散，即城市中心地区的人口增长率降低，而城市中心以外的周围地区则人口增长率升高，然后是绝对分散，即无论是城市中心地区还是周围地区，人口'
