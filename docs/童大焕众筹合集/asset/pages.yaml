  md: '官方数据的 53%。因为大量农民工被统计在城市人口之内，但他们并没有真正城市化。当我们刚刚宣布城市化率过半的时候，我就专门撰文认为真实城市化率只有 35%。目前，包括国家发改委城市和小城镇中心主任李铁、北大教授周其仁等，认同的也是
    35%左右的城市化率。


    至于人民币贬值和热钱流出，也就是人民币兑美元下跌会导致热钱流出，房价就会跌。如果的确会发生这种情形，也只能是一个暂时现象。一方面是热钱占比总是少数，尤其是我们仍有外汇管制的情况下，它带动的只是短期预期。另一方面，货币超发过程就是货币贬值的过程，而这个过程正是资产价格上涨的过程。所以，中长期房价一定是由城市化规律和长期货币双重作用决定的。从事金融的人士和炒股的人常常过度夸大短期资金的影响，因为金融产品的炒作都是快进快出，这和房地产投资理财以中长线为主是不同“物种”的思路。


    大家都非常关心北京市常务副市长李士祥说“市区房价肯定要下降”的消息，在此我也做一个分析。他这话是 2014 年 3 月 5 日就京津冀协同发展、打造首都经济圈接受记者采访时说的。京华时报记者问：“有消息说，随着京津冀一体化，北京的房价会下跌，周边的房价会涨起来，您怎么看？”李士祥答：“北京市区的房价肯定要下降，一是我们的供应量加大了，特别是保障性住房。二是我们的房地产结构发生变化，房价肯定要下来。河北、燕郊房价是不是会上升？这个也没有普遍性的结论。比如将来北京有些功能纤解出去了，就没有必要在那儿买房了，功能纤解出去了，就可以住在河北，在河北上班了。整体来说，随着政府扩大保障性住房的供给，房价会回到一个合理的理性空间，应该是有这个信心的。”


    （2014 年 3 月 6 日《京华时报》）


    但是 3 月 7 日，李士祥自己又对此做了澄清。他对此回应称，对于京津冀三地的协作以及北京一些城市功能的疏解，会引起北京房价下降的说法是误解。“别的大涨大跌都是不正常的。”


    李士祥表示，首先，房价的起落还是要尊重市场规律。在政府层面，首先是逐年加大保障房的建设力度，今年要建成 47 万平方米的保障房，135 万平米的共有产权房。同时，去年土地供应量达到
    980 公顷，今年还将增加供给。“以政府为主的保障体系要建立，同时以市场为主的多样性的需求体系也要建立。”李士祥表示，通过政府这些作为，能够令房价实现稳中有降。“目前已有一定效果。”（2014
    年 3 月 8 日《新京报》）


    官员说话，很多时候就不是那么直截了当。他说的是保障性住房增加会拉低平均房价。但面对每年上百万人口的涌入，商品房房价提高会带来征地价格的提高，保障房价格也会水涨船高。再说，保障房比率如果提高，意味着商品房补贴保障房的比率也提高，商品房价格反而会更高。


    至于京津冀一体化，我是这样看，一体化首先城市轨道交通通一体化，它可能带动郊区房价上涨，但仍然遗憾的是地段、地段还是地段的楼市黄金律，而北京周边的河北等地商业文明的发育发展并不像上海周边和珠三角一样发达，要把北京周边“扶”起来，并没有那么容易，所以，周边城市和乡村整体上为北京人口服务的大格局短期内很难改变。也就是使更多的人“在北京上班，在河北居住”。在这种情况下，北京市区的房价肯定是继续上涨。而且，随着去年北京近郊包括燕郊房价大涨，我预计二季度开始，最迟下半年开始，新一轮上涨将'
