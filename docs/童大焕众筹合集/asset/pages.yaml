    花旗银行和牛津大学预测，中国 77%的工作都有被机器人代替的可能，经合组织 34 个国家 57%的工作有可能实现自动化。世界经济论坛预测，到 2020 年，
    全球有 500 万个工作岗位可以实现自动化。IBM 称其创建了一台比人类医生还更擅长诊断出癌症的计算机。甚至连新闻工作都未能幸免——美联社已经在使用 AI
