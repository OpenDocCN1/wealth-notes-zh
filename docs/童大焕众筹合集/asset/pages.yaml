  md: '但是“康老师”这种论调的确有很大的迷惑性，同时郊区和远郊区房价却确实在开发商主导下正在上演“涨幅大于城区”的大戏。2015年9月16日有学员问：“董老师您好，读了《什么样的优质房产是世代不移的印钞机》，有个问题想请教您。正如您文中有人所言（应该是有人担心——大炕注）租售比高的项目价格增值会不会跟不上？我在链家上查了一组数据，结果也不理想：万达广场公寓，同比去年上涨2.8%；蓝堡国际公寓，同比去年上涨10.76%；华贸国际公寓，同比去年上涨10.73%；新城阳光（通州梨园），同比去年上涨14.1%；保利茉莉公馆（大兴黄村北），同比去年涨17.86%；广佳小区（海淀广佳），同比去年上涨15.91%。近一年来CBD的涨幅怎么反而不如一些其他的区域，请老师解惑，谢谢！”


    我这样来回答这个问题：房价上涨有个“涟漪效应”：总是从市中心起一波波往外荡漾，到一定时候又荡回市中心。如此循环往复。一遇价格调整，总是市中心最稳定，而越远郊波动越大。如是中长期下来，市中心涨幅一定超过郊区。


    同时，一手房和二手房的涨价具有不可比性，一手房由于开发商的操控通常会涨得更快；通州则有市政府东迁的特殊利好：万达广场这样住宅立项商业使用的项目，通常租金较高，但涨幅是否更慢，还需要更多观察和数据支撑。


