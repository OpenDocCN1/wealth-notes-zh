  md: '从里昂证券排出的全球十大雇主名单中可以看出，这些雇主拥有规模庞大的劳动力队伍，用机器人代替人力的潜力巨大。（注：1、美国国防部 2、中国人民解放军 3、沃尔玛
    4、麦当劳 5、英国国民医疗服务 6、中国石油天然气集团公司 7、中国国家电网公司 8、印度铁路公司 9、印度军队 10、鸿海精密(富士康)


