- pgno: 258
  md: '能不承认我国企业的生产经营，乃至 GDP 增长过度依赖银行信贷是一个很大的问题。


    今年 7 月份，曾有不少人认为银行出现了“信贷”现象，但实际上今年 1-7 月，我国金融机构新增人民币(6.1344, 0.0049, 0.08%)贷款仍然达到
    6.13 万亿元，远高于 2012 年、2013 年同期的 5.4 万亿和 5.78 万亿元。今年 1-7 月，全社会金融机构新增贷款与新增存款之比(贷存比)达到
    85%，工、农、中、建四大银行今年以来的新增贷存比更是达到了 146%。这显然是太高了。


    从历史数据看，1990-1999 年的十年间，我国一共新增贷款 7.94 万亿，年均新增为 0.79 万亿元；2000-2008 年九年期间，我国新增信贷
    22.76 万亿元，年均新增贷款迅速上升到 2.53 万亿元；而 2009-2013 年的五年间，我国新增信贷为 42.1 万亿元，年均新增贷款更是猛增到
    8.42 万亿，一些年份甚至达到了近 10 万亿元。


    看到这些数据，我们固然可以说有国民经济总量扩大的因素，也有所谓金融深化的原因，但必须承认从宏观上看，我国的经济增长对银行贷款的依赖是过度的，我国的企业从银行的融资是过度的。


    我国应该下决心进行去杠杆，降低企业的资产负债比例。现在经常听到的说法是企业融资难，融资贵，我认为对这个问题需要深入剖析，全面看待。要正确看待银行信贷的功能和作用，办银行有明确的资本充足率约束，办企业也应该将本求利，不能总是希望通过做无本生意，完全靠借钱企业就能发展，就能获利。


    无论是国企还是民企抑或外资企业，如果其“老板”(股东、出资者)认为一个企业市场前景不错，希望能够经营下去并且进一步发展的话，那就应该以不同方式不断地向其注入资本(增加所有者权益益)，而不能仅仅寄希望靠银行贷款就可以“做大做强”。如果股东对某个企业前景并不看好，或是想增加资本金但感到力不从心，那就应该设法退出市场，或者只是进行“简单再生产”，不去追求“扩大再生产”，在这样的情况下就不应该一味地去要求银行不断对其增加贷款。否则不仅无助于调整经济结构，而且也会造成金融风险不断积累，最终导致经济运行的系统性麻烦。现在有不少人对银行应该支持实体经济发展的理解不够全面，总以为这句话的含义就是银行要进一步给企业发放更多的贷款。这是一个认识上的误区。


    总之“过剩产能”和“过度信贷”是我国经济进入新常态过程中，必须面对和解决的两个问题。我们应该按照十八届三中全会决定所要求的，充分发挥市场对资源配置的决定性作用，妥善处理好为解决当前问题而采取的权宜之计，与为了坚持社会主义市场经济改革取向必须确立的长远之策的关系，既努力解决好当前经济运行中面临的一些具体难题，又切实避免为日后新常态的建立和可持续发展增加新的障碍。(本文作者介绍：工商银行原行长)


    原网址：http://t.cn/Rhli4Zi'
