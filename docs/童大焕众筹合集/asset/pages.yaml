    万亿美元，也就是说，中国一线城市住房的总价值可以买下半个美国。


    一线城市建成区各类用地总价值可买下 60% 的美国。根据国土资源部 2015 年 12 月的数据，北京、广州、上海、深圳的平均地价分别为 29330、20962、20044、26038
    元/平米，而四个城市建成区面积分别为 1268、700、1563、661 平方公里，依此计算可得四个城市的土地总价值分别为 5.7、2.3、4.8、2.6
    万亿美元，加总起来就是 15.4 万亿。也就是说，中国的一线城市建成区所有类别用地的总价值，买下半个美国也绰绰有余了。'
