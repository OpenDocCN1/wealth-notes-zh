  md: '2015 年 10 月，房东收取了他们 53 万元房款，和首期房款一并开了 80 万元收条。然而 2016 年向房主支付尾款时，对方提出解除合网，不仅拒收尾款，还把之前收到的
    80 万元退回，“她说家里有亲戚想买这房子，补偿我们 10 万，让我们搬出去。”


