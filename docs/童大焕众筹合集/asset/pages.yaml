  md: '我研究城市化，研究经济学，就一切从人出发，到人结束。2015年底，我跟风格纯粹云端对话中国三大都市圈期间，有人问：经济学是什么？风格纯粹回答：经济学的本质是数理逻辑社会学。注意，是社会学，经济学的本质就是研究人的。就像陈志武教授在一个人文经济学讲座上回答关于怎样才能学好经济学时所说：研究经济学，不是靠一堆数字和公式，你必须对人保持高度的兴趣。


    # 世道人心四个字，拆开就是三条：


    +   第一条，**是严守正道，形成纪律。** 这就是：只做价值投资，任何诱惑面前都毫不动心。


    在大道和大道基础上形成的纪律面前，我的投资哲学就是保守保守再保守。1大道至简，把握住最关键的变量——人往哪里去？为什么会往那里去？什么样的人会在什么样的地方？坚守规律，八风不动，矢志不移；2保守。从不敢奢望摘取阶段性涨幅最高的标的，而是老老实实地坚守价值投资理念，用时间等待价值和别人的回归。即使亲身经历过交易当年房价上涨
    1 倍；交易期两个月涨幅超过此前 2 年；交易 4 个月净增值为投资额 4 倍等等经历，也不敢吹自己口能把握什么 “时机”。投资很难，首先要战胜自己的贪婪和举棋不定；投资也很容易，用最多的时间去认清价值，然后用时间和耐心静待价值回归。疯涨还是慢涨，
    那是上帝的的事情。我，只问耕耘，收获，交给时间。


    其实你只要坚守了道，坚守了规律，坚守了保守的价值投资，最小的风险最大的回报一定是你的！


    比如，2013 年底开始第一单做广州私人订制以来，广州我只推珠江新城。其它城市，依此类推。结果呢，2016 年 8 月 12 日 学习委员北京说：“广州过去一年整体上升
    10%以上，中心几个区大约 25%，好的区域如珠江新城中区整体升 40%以上，今年上半年有一段直线拉升。”


    一开始人们会感觉珠江新城一带密度的晕眩，但很快会适应，因为时间成本战胜了一切。


    很多人去追风，去追短期大涨的楼盘。但正如深圳链家研究院院长肖小平所言：“在深圳，阶段性跑赢大市的房子常有，但一直跑赢的房子几乎没有。”她的话是基于大数据的。这个结论，非常符合我的“房价波浪式上涨”的理论假设——同样有投资价值城市与城市之间，有投资价值的城市版块与版块之间，有投'
