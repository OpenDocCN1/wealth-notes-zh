  md: '很多人认为房地产市场太火爆导致实体经济状况不佳，企业主都“不务正业”去投资房地产。这是误解。一则前面说了，是房地产补贴工业导致工业产能严重过剩和污染加剧，过剩的结果必然是订单减少和利润微薄甚至亏损关门。即便如此，关了企业专事炒房的企业主也是少数，只要企业还能基本维持，大多数企业主还是愿意维持下去。又有人认为贪官大量购房，是购房大军的主体。也是误解。房地产（小产权房除外）是最透明最便于清查的资产，有多少贪官会把不明财产积极主动变成申报时的透明财产，要打一个大大的问号。


    真正的购房主体是很多中等收入群体。他们中的不少人，老家农村一栋房、家乡县城一套房，工作居住地一套房。还有不少人是父母一套房，自己一套房，还有一套留给儿女。所以即使楼市偶有波动，也不会引起抛售进而导致楼市崩盘。


    四是如何看待三四线及其以下城市的供应过量问题。如今，人们已经普遍开始担忧三四线城市的房地产过剩问题，事实上，在过去十余年中，城市人口增长0.5倍，而城市建设面积增加了接近1倍，很多三四线城市都存在建设用地过度开发问题，城市建设空有房子却没有产业支撑，最终只能是人去楼空、当地政府负债率大幅上升。（李迅雷）


    “鬼城博士”杜猛则是定义空置率：“空置率是指某时段空置房屋面积占房屋总面积比率。又分存量和增量空置率，6个月未使用即为空置率标准。参照国际惯例，本人认为：空置率在5%-10%之间为合理区；10%-15%之间为警戒区；15%-20为危险区；20%-25%以上为积压区；25%-30%为存量和增量产能过剩区；30%以上楼市房价溃败区。”


    我加一个：鄂尔多斯空置率超60%吧？但现在房价据说趋稳在八几千。这是有道理的，因为从政府到个人都钱太多，都是“羊煤土气”浮财堆的，反正资金没有地方去，放着就放着。资金链没有像温州一样断裂，于是成了“吊在空中区”。但温州可以随着未来资金链恢复而房价恢复上涨，鄂尔多斯则会长期吊在半空有价无市。


    未来“鬼城”如何消化？空置率和银行杠杆率双高的，有可能出现房价较大幅度下跌；空置率还不算太离谱的，或者银行杠杆率不那么高的，有可能长期维持。市场和行政的双重力量也会逐步化解一部分空置率：减少土地供应，减少银行贷款，城市开发权部分还给民众，尤其是在旧城改造方面。不要悲观和失望，老城区的旧城改造，如果开发权还给民众，未来还有很大的发展空间。


    如果过去有人太相信政府规划，在三四线以下城市的规划新区买了房而长期没有入住，有条件退出的尽量退出。办法是将非优质资产置换成中心城市和城市中心的优质资产。只要货币超发的态势不变，只要城市化还没有完成，一二线城市回流的人群还会有，今天的县城还有房价上涨的空间。过去的鬼城空城有两种情形，一种是城市跑太快了人口还没有跟上，农村的还没进来。一二线城市的随着供应量的减少和人口的流入，未来还有消化空间。怕的是供应量过剩太多的城市，未来永远没有人去填。尤其是警惕那些“大手笔规划”'
