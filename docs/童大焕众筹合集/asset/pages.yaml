  md: '的城市，写字楼的发展空间巨大，甚至不亚于商铺的回报率。甚至比一些好地段的伪豪宅和郊区别墅强多了。而商铺的贷款成数、年限、二手交易税费形式和写字楼一样，但比写字楼面临更多不确定性的风险。


    当然，投资写字楼，比投资住宅难度更大，原因只有一个：“强者恒强，弱者恒弱”的“马太效应”，在写字楼身上表现得比住宅强得多。


    根据北京某核心区（如 CBD）的基本市场行情，我做一些比较。这个行情的基本情况是：住宅的年租金约 2% 上下，写字楼约 6% 上下。


    # 1 和五年期存款利率及各类现金理财相比。


    查 2016 年 5 月 30 日行情，5 年期存款利率（整存整取）全国绝大多数银行在 2.75，极少数地方银行如湖州银行、德阳银行达到最高，在 5.225。


    和银行存款相比，写字楼投资“本金”会随着房屋的升值而升值，而银行存款本金不会升值。写字楼投资租金回报每年都在上涨，根据过去的经验以及将来服务业加速度发展的趋势判断，平均
    5 年左右租金有望上涨一倍。即第 1 个 5 年是 6%，5 年后（在锁定 5 年前入手房价基础上）即第 2 个 5 年是 12% 回报率，第 3 个 5
    年可能达到 24%，第 4 个 5 年有望达到 48%，以此类推。


    投资写字楼完胜银行定存。


    和各种银行投资理财类产品，以及各种风险巨大的民间融资相比，从长远看，投资一线城市优质写字楼安全性和回报率都远远高出一大截。


    在这里，我采用了“锁定 5 年前房价即入手房价”的计算比较方法。这个比较方法是客观的，因为其它各种现金理财方式，本金都是固定不变的。只有房地产投资，本金才会不断上涨或下跌。人口流出的地方，房地产投资当然是面临下跌风险的。而在人口流入或加速聚集的地方，房价上涨，但业主多年前投入的本金并没有增加，房价上涨增加的不是投入，而是业主的收益。所以我们得出的结论是“本金不变”但写字楼投资的年回报率每年都在提高。第
    5 个 5 年即第 21 年起，年租金有望接近 21 年前的本金投入，即 96%！


    # 2 同地段优质住宅和同地段优质写字楼比。


    某优质住宅 10 年涨到 5 倍多，同地段优质写字楼可能只涨到 2.5~3 倍左右。上涨回报，住宅完胜写字楼。'
