  md: '担当下的天大事情；孩子需要到国外求学的时候，你可以用未来十年时间分担他四年五年学费。


    # 第四大思维陷阱：还在用权力经济和金钱时代观念应对知识经济的未来 【“环大都市鬼城圈”最快两三年最迟四五年一定见分晓】


    权力和金钱至上的当代中国养成了一个恶习，或曰习惯性的集体无意识：权力崇拜和金钱崇拜，以为有了权力和金钱就可以办成一切想办的事情。听说政府哪里要规划机场，哪里要通高铁（地铁），哪里又要建一个新产业园，就又一窝蜂地去买房。最后的结局，往往是一手房拼命涨，但到了二手房时代，很多房子就砸在手里。


    我一直对大家：**信市场不要信市长，信规律不要信规划**。这里有两方面的原因：一是各级官员（包括中央级主要领导）都有自己的短期政绩追求，多数会追求“宏伟构建”而不管现实规律与逻辑，多数不会追求长远目标；二是政府信规划只有吻合规律才能成功。所以我们与其追逐“前官种柳弄沙，后官换了梅花，新竹这官种下，心惊胆怕，怕再来的偏爱枇杷。”的政府宏伟规划，不如老老实实研究一下谁也改变不了的规律。然后可以以规律为衡量标准与尺度，一览众山小，看戏一样看人们像无头苍蝇一样狼奔豕突。“宠辱不惊，看庭前花开花落；去留无意，望天上云卷云舒。”


    世界的变化比我们的观念变化要快得多。大家一定要把观念从工农业时代中的权力经济和金钱经济中转变过来，调到知识经济智慧经济频道上来。世界在急剧的变化，发展和进步的逻辑也在发生革命性的蜕变。过往的方式、逻辑和路径依赖全部失效了。


    如果说，农业时代土地是财富之母，工业时代石油、煤炭、铜、铁等有形资源是财富之母，这些资源性的东西都可以被权力和金钱所垄断，那么，**未来已来的服务业时代，智慧才是真正的财富之母！**如何高效的配置和利用资源，成为财富生成的新逻辑。即使权力和金钱还能控制甚至垄断那些有形资源，工农业占比也占不到GDP总量的30%。70%将掌握在知识和智慧手里！


    这就是蜕变！脱胎换骨的改变。'
