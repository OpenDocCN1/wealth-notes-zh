    **第四，**如果不是由于交易、产权复杂（比如贷款高导致交易难）等原因，区域特价二手房的出现，当然是价格洼地的价格洼地，但这种机会可遇不可求，不能作为常规投资方法来运用，否则，付出的时间成本和机会成本可能更高。


    **第五，**我们以前的独家文章里已经说过，同地段不同定位的小区，比如保障房、普通商品房、高楼商品房，长期的涨幅其实相差不大会太大的。因此，在实际买房过程中，不必太纠结买哪一种。而是应该把整体的地段选择放在第一位，
    把人生最大的时间精力用来研究到底哪些城市区域未来最有价值。选定这些区域后，买进哪类房子并不太重要（除非是明显落后于时代的，比如无电梯高楼层等），而是根据自己的实力，买得起哪个就买哪个。


    如果我们研究透了最大价值区域，以及价格洼地的呈现规律，那么，一个城市，我们只需选定那么一两个最有价值区域，就可以不断折腾，不断地从中挖掘财富宝藏。


