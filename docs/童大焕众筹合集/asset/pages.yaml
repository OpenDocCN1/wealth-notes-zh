  md: '9) 民间借贷和集资。 在江浙福建一带经济和金融活跃的南方地区，民间集资和借贷利率平均都达到 2 分以上，也就是一年利息 24% 以上。跑赢通胀。盛时很多人想方设法从银行贷款出来投入民间借贷市场。但它极其脆弱，一不小心就本息全无，连老本都没有了。最近我老家福建龙岩一个退休官员，利用其人脉和影响⼒帮助当地开发商黄⽊本融资，结果黄⽊本卷款跑路，这位老人以自杀谢幕。事实上过去相当多的民间集资和银行理财产品，也都是到房地产这个池里。如果房地产产不出比集资成本高的利润，民间集资和理财产品皮之不存毛将焉附？


    10) 换成外币储蓄。 虽然一再降息，但人民币存款利率如今差不多还是世界上最高的储蓄利率了，换外币储蓄显然得不偿失。跑输通胀。


    11) 保险。 正常的保险是消费行为，但在咱们奇葩中国硬是被活生生玩成了投资理财！单凭这种异化你就应该知道，它跑通胀那是铁定的，抽掉真正的保险部分，它的投资回报比储蓄还差。


    12) 珠宝和艺术品。 只要你是够专业，在这里暴富的机会可能比股市还多。随着地球村时代到来，富裕阶层成为“飞机上的游牧民族”，游牧民族的特点是对珠宝等随身携带的固定资产比不动产还热爱。因此珠宝的未来空间越来越大。但前提是足够专业，还要耐得寂寞，舍得时间。同时，它不是一个大众投资品种。


    13) 房地产。 在所有资产中，房地产是比较“正和”的游戏。这里的“房地产”含房产和“适合用来盖房的地产”。房产本身，不容易受到通货膨胀侵蚀。但房产大概每年
    1% 左右的折旧率。


    但对于房地产投资来说，今天的时代与历史有了很大的不同。和农业时代稳态社会完全不同的是，今天的房地产投资必须被置于前所未有的城市化背景下来考虑！2011 年起，全球已经有过半人口进入城市生产生活，而且城市化的速度还在加快。2014
    年底，中国也有 39% 左右人口在城市定居下来——我这个数字与官方公布的不同，扣除了 2.6 亿候鸟一样居无定所的流浪型农民工。


    在城市化背景下思考房地产投资，那就要紧紧抓住“人聚财聚人散财散”的规律，研究是什么原因导致人口集聚和离散，并在此基础上正确投资房地产。'
