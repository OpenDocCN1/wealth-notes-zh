  md: '在银行按揭制度刚刚传入中国的时候，为了推广这个制度，人们半真半假地编了一个故事：美国老太太在临终前说：我终于还完了房子的按揭贷款，而中国的老太太则在临终前说：我终于攒够了买房子的钱。最后的结果相同，但不同的是过程，一个充分享受了人生，一个一生清苦悲戚。


    不是我不明白，这世界变化快！在如今通胀坐火箭工资如蜗牛的时代，如果还抱着不能借钱的老皇历，中国老太太的故事还得改写，就是，多数人一辈子的积蓄，到死也买不起一套房。除非，你回到乡下，建一栋盖好了几乎就再也无人愿意接手的房子。


    换一个角度则是，美国老太太不仅不需要在临终前还完她的贷款，而且她的贷款还可以千秋万代一直欠下去，而她的净资产和资产净产出，可以表现为正数！


    这个道理不想不知道，一想吓一跳，简单得很呢：比如你年轻时候稍微努力点、辛苦点，在自住房之外再投资一套以上的房屋用于出租，若干年后甚至有的—一开始，那租金就超出月供。这样的房子，你还有还清贷款的必要吗？


    或者，你只有一套房子也没关系。尽量利用银行贷款，买市中心总价高一点的，租个好价钱，自己再在上班【或孩子上学】附近的地租个房子。等你自己的房屋租金够月供和自己租房费用的时候，你同样不必再考虑还银行钱的事情了。


    而当你的租金收入超过月供和每月开支的时候，你就已经完全彻底地实现账务自由了！财务自由并不是指你要多么大富大贵，而仅仅是指你的财产性收入比如房屋租金、公司股份收入等超过你的个人开支。你不必再为了生存而工作，可以自由地支配自己的时间和身体。这就是财务自由。


    那么，为了你的财务自由，现在开始努力吧！从现在开始，不要考虑我这辈子能不能还清贷款，只要考虑我的房租什么时候能够超过月供。'
