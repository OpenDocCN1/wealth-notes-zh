  md: '距离越远，彼此之间的引力越小，能量小的城市不必担心被远在天边的能量大的城市所吸附，却也同时不要指望能量大的城市会有什么人口和产业“外溢”到你这边来。


    比如两座城市，相差 1 公里，彼此之间就是你中有我我中有你的密不可分关系。但是 100 公里呢？它们之间的关系就只有万分之一 的关系了！等于几乎没有关系！如果两座城市彼此能量相当而且都份量很重，则相隔再远也会有彼此互动关系。如果两座城市畸轻畸重，一个是巨无霸一个在这个巨无霸面积相当于零，距离跨度又动不动
    50、100 公里，它们之间的关系就几乎等于零！


    根据万有引力定律公式，我们可以清楚地知道：城市对外扩张，它的能量是以公里数的平方的几何级数衰减的！


    除了万有引力定律的因素，还有一个理论上的土地面积供应因素也不能不考虑。假定城市中心只有半径一公里，在往外扩张中这一公里基本忽略不计，那么，城市向外扩张 10
    公里半径，理论上的建设用地供应面积可增加 100 倍；30 公里 900 倍，100 公里 1 万倍！你那么远房子那么好卖，人家隔壁地区，隔壁的隔壁地区，隔壁的隔壁的隔壁地区也都想搞一搞卖地财政，谁能挡得了？


    也就是说，在城市对外扩张过程中，除了纵向的单线向外扩张会造成城市间吸引力按公里平方的几何级数衰减，在横向的面积扩张上，也将有可能因同类区域的土地和房屋供应竞争而再次带来同样按公里平方数的几何级数衰减！


    亦即，每往外扩张 10 公里，城市中心和它之间的万有引力衰减 100 倍，同时相关区域的理论住房供应量也已增加 100 倍，那么相关区域房屋的价值与能量已经衰减了
    1 万倍；如果是 30 公里，就是理论衰减 81 万倍；如果是 100 公里，就是理论衰减 1 亿倍。


    想想其实挺恐怖的。人在这广袤的大地上，真的就是一粒尘埃。


    现实不会这么绝对，因为人是有巨大能动性的动物，两座城市之间的引力不是单纯的不动物体之间的引力，而是人在其间自由穿梭的努力。但是，相关参照却应该给我们发热的头脑带来一丝凉风与清醒。'
