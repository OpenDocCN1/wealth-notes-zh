- pgno: 25
  md: '我说：“你现在的钱太少啊，要在北京买到房子只能是非常偏远的地方，那些地方以后有没有人要还成问题。”


    刚开始投资或者刚开始买房的人非常容易犯以下几个错误:


    +   1 明明在人口持续流出地区工作，买房眼光还死死盯着家门口。不知道也不愿意让资产和人分离。世界变化越来越快，产业分工和分化越来越快，将来很少有人只在一个单位、一个地区待一辈子。人在哪里工作，有时身不由己，但是资产配置到最有价值的地方，成为人生四面出击的“根据地”，却是凭智慧可以把握的！


    这个问题性命攸关。所以我的私人订制“四不做”，首先就是“不愿离开家乡置业、或不在一线或强二线城市工作又不愿意在非工作地置业的，不做”。接着才是：讨价还价的，不做；订制前疑问太多的，不做；问多长时间能有多少收益的（不论是说比率，还是说绝对值），不做。


    世界永远有比家乡和你现在工作的地方广阔得多的天空！


    不要只爱自己家门口，世界那么大，不要只顾眼前的“家乡美”，家乡没有那么美，世界比你的家乡更大更美。更重要的是，世界发展的潮流变化很快，你即使今天不主动拥抱变化，将来也一定要被动顺应变化。因为很大的可能是，你热爱的故乡，正在迅速衰落。你爱它，它却不爱你，不久的将来，它甚至没办法给你提供一个有尊严的工作岗位！


    +   2 就像这一部分开头的那样，能力很小而欲望很大，彼此之间不匹配，而且死死把目光锁定在“高大上”的区域，比如一线城市。这样就很容易让自己陷入到城市边缘地带，无以自拔。那个坑一且掉下去，有可能永远翻不了身。


    就拿北京来说。北京全市面积 **16,410.54** 平方千米（中国省级行政区第 **30** 名）。其中市区面积 **1,368.32** 平方千米，**2012**
    年建成区面积 **1289.3** 平方千米（中国城市第 **1** 名）。山地面积 **10,317.5** 平方公里，平原面积 **6,390.3**
    千米。


    也就是说，北京真正有一定投资价值的区域不会超过总面积的十分之一，最有价值的区域更是不会超过 **1%**。在北京 **100** 万首付都很难不易买到高价值房子的'
