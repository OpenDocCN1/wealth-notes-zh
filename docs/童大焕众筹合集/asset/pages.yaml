  md: '结合近几个月的中国贸易顺差强劲增长势头，摩根大通报告认为，


    贸易顺差主要源于进口增长比预计的疲弱，即体现了从房地产到制造业等领域普遍内需疲弱。某种程度上是好消息，因为制造业和房地产投资是经济再平衡的重要环节。但还不清楚其他行业近期能否提供替代的增长源。


    8月数据无疑预示着经济下行风险，又会引起中国 GDP 增长可能无法达标的老问题。彭博经济学家 Tom Orlik 以下图展示，中国 GDP 预计同比增长率已经跌至
    6.3% ，明显低于官方 7.5% 的今年目标水平。


    要保持 7.5% 左右的经济增长速度，摩根大通认为中国应该进一步推出宽松政策，但这次难度很大，


    “尽管 8 月数据疲弱，中国政府近期还没有流露会放宽宏观政策的迹象。李克强总理本周的讲话重申，中国的增长处于合理区间，政府将更依赖结构性改革支持经济增长，并非依靠刺激。”


    中国可能出台哪些措施稳增长？摩根大通认为有以下几种选择：


    +   - 中国央行未来几个月可能扩大抵押补充贷款（PSL）的范围，以支持环保等特定产业和小企业;


    +   - 中国政府可能推出措施鼓励民间资本参与，包括撤销政府管制、放开市场渠道或者推广公私合作模式 PPP;


    +   - 目前二住房贷款首付比例不低于 40% ，今后中国地方政府可能放宽对二房买家的首付比例限制，


    摩根大通认为，更重要的是已公布的供应面措施执行如何，值得特别关注：体制改革（如放政府管控、允许私人资本进入国家垄断行业）；减轻企业税负及行政性收费；减少企业、特别是小企业的融资成本。


    原网址: http://t.cn/RHJQZfg


    # 附 2: 杨凯生: 行产能皆过剩国内已难觅非产能过剩行业




    产能过剩的范围已过去常说的钢铁、水泥、电解铝、平板玻璃、造船等行业扩展到许多所谓的新兴产业了，目前几乎找不到几个不过剩的行业了。另，我国经济增长对银行贷款是过度依赖的，企业从银行的融资是过度的。


    自从决策层提出我国的经济运行将呈现一个新常态的判断以来，无论是从事经济'
