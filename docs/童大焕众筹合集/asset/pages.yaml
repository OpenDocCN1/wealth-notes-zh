    # ## 大焕分析与设计


    你对于未来的基本判断和方向是正确的，不论是杭州还是更具体的钱江新城，都是你现在 的实力完全够得着的地方，而且也是未来大城市化过程中寸土寸金的地方。当代中国史无前
    例的城市化自然规律是：人口从中西部、东北部往东部省区集中，各省内往省会等一两座城 市集中，各大城市内部又往以 CBD 为核心的城市中心集中（大都市有多中心）。这个规律不
    以任何人的意志为转移。所以，往杭州钱江新城宏观战略正确。


    钱江新城是作为杭州 CWD 来建设的，而且据我所知已经相当成熟。虽然本人没有亲自考察过。当时拟建有两座金融城，一座在市民中心西面，另一座在钱江新城二期核心区——四堡。
    是以金融商务功能为主，商业酒店功能为辅的城市综合体。我们选择房子的时候，就以金融 街、CBD 为核心（未来产出最高），哪里写字楼、商务越成熟越多、越高，就选择哪里的
    房子。


    在这样的区域买房子，不是能不能升值的问题，而是升值会超乎想像，租金也非常可观。 虽然杭州住宅供应量偏大，但成熟核心区没有问题。


    现有资产配置存在两个比较大的战略原则问题和几个小问题。两个比较大的问题分别是：


    1 家里现有存款约 110 万元，其中 50 万买银行理财，40 万在支付宝，10 万 元定期，还有 10 万在股市天天亏钱。这些金融资产太多，在我眼里都属闲置。'
