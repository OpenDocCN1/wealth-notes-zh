    这种人群的产生，当下缘于三个方面的原因：


    一是城市规划不合理，商务区附近住宅规划不够，导致职住分离严重。如北京 CBD 核心建外街道所有就业者中，仅有 4.62% 能在该街道居住。


    二是城市中心房价贵，导致初入職人员买不起或租不起上班地点附近的房子，由此向通州、燕郊等地转移居住地。


    三是不合理的限购限贷政策，导致外来人口被迫在河北所属的一些区域购房保值并安排孩子上学。


    这种“溢出人口”相比于拆迁安置外迁人口，以及被交通物流等行业吸引的流入就业人口，收入都要高，而且收入前景变化大。他们一方面能支撑起较高的房价，另一方面自己一旦收入提高或获得北京购房资格，会及时将自己的资产置换到北京来。所以，和“溢出人口”相适应的房地产，属于过渡性住房需求。这一点务必要清醒。'
