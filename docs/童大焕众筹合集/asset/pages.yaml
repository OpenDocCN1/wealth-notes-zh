    总体而言，在高端就业岗位仍然聚集在市中心的情况下，即使市中心人口密度降低，但被疏解的群体依然需要每天通勤至市中心工作。因此，疏解人口本身只会大幅增加居民的出行距离，从而加剧城市的拥堵程度。


    政府努力地在中心城之外的地区（以新城为主）鼓励高端服务业的发展。通过补贴，减税，供地，等等，试图对市中心服务业功能进行疏解。企业会去注册（便于领补贴），但是人不会去那里上班。根据经普数据分析的上海四个主要产业部门就业密度在空间上的分布特征，金融行业高度聚集在市中心
    **3km 处**，其次是文创，**8km**， 再次是科技，**12km**。向郊区新城疏散就业岗位，本质上就是逆市场规律而行。


