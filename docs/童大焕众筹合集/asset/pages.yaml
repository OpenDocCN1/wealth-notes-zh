  md: '**问题 1：问题是拿出来散卖的写字楼大多不是什么好货。**


    **风格纯粹答：** 不一定。中国的商业地产因为税务局的原因，他们不愿意发展REITs（房地产信托投资基金( REITs) 是房地产证券化的重要手段。房地产证券化就是把流动性较低的、非证券形态的房地产投资，直接转化为资本市场上的证券资产的金融交易过程。房地产证券化包括房地产项目融资证券化和房地产抵押贷款证券化两种基本形式），所以，很多企业又没可能拥有足够的现金流持有优质物业。所以，被迫选择散售。这也是中国商业地产发展不起来的原因。因为
    REITs 会让税务局失去企业税。所以，童老师说写字楼蕴藏着巨大的机会，是因为他看懂了中国金融不自由，写字楼这个市场在这个状况下给予了个人投资者机会，要是金融发达，对个人投资者而言，不可能存在这样的机会。


    **童大焕答：** 早期开发商往往是白手起家，又占据城市中心优质地块，他们往往处在一个“卖图纸状态”。等到这些开发商有钱了，卖出容易收回难，而且到目前为止，很少有开发商认识到“做开发商不如做投资商的时代开始了”（大族语），他们不会有意识地去大规模回购优质物业。这才给了今天的个人投资者巨大的机会。优质写字楼的投资价值，会让人吃惊得目瞪口呆。只不过，写字楼对很多普通人而言，太难懂了。


    现在，写字楼和商铺地产整体转向的是 SOHO 中国，由以往的散售，全面转向自持出租。 2012 年起，潘石屹表示，经过反复的分析、测算，我们公司做了一个重大决定：告别散售，持有北京、上海有价值的物业。3Q
    中心是一种可以提供办公桌工位以及小型办公室整租的商业物业形态。微型企业和一些大企业的项目团队是目标客户群体。SOHO 中国在北京的望京 SOHO 和上海的
    SOHO 复兴广场各设一个试点，北京试点接近满租，而上海试点则只有 30% 到 40% 的出租率。亿翰智库上市房企研究中心主任张化东就此评论说：“由于北京特殊的政治地位和创业氛围，使得当地的需求方对租金不敏感。而上海聚集了大量的微小私人企业，他们对办公空间的敏感度要远高于北方。”（《SOHO
    中国转型阵痛持续：净利润暴跌 94%》 2015-09-05 08:46:13 来源: 中国经营报）


    《SOHO 中国纯利只有三年前两成，潘石屹称转型成功》 2015 年 9 月 16 日每日经济新闻。等等。 长远价值需要时间来证明。


