- pgno: 256
  md: '实务工作的还是搞理论研究的，人们普遍都接受这个判断，都认为我国近 30 多年来的经济增长态势将发生重要的变化。现在的问题是中国经济的新常态究竟应该是个什么状态，为了平稳地进入这个状态，我们需要抓紧做一些什么。


    不少人在谈到新常态时，往往都是说中国的经济增长将从过去 30 年平均增长10%左右降下来。如果有什么不同话，也只是人们对未来一个时期经济增长的潜力区间究竟会落在哪里的看法不尽一致。有的说仍可保持
    8%以上，有的说大体在 7-7.5%，还有的说在 6-7%，甚至也有人认为会掉在 6%以下。


    我的看法是所谓的新常态，首先意味着与原来的状态有所不同，这其中肯定包括了增长速度的变化，甚至也可以认为，新常态的提法本身就包含着希望大家对GDP增长速度可能下滑的情况要保持一个平稳接受的心态的含义。但新常态也绝对不仅仅是说经济增长速度将要下落或者是下落到多少。


    我认为所谓的新常态，一是“新”，就是说与原来的发展模式相比，要更突出强调遵循经济规律，遵循自然规律和遵循社会规律；二是“常”，就是说与前些年的状况相比，更要注重解决影响可持续发展的问题，使经济发展的态势更正常，进而使健康较快发展的趋势可以延续更长的时间。因此所谓的“新常态”应该是包含很多内容、具有深刻含义的一个重要表述。“新常态”既是对一种经济发展状况的概括性描述，也是对面临的下一步发展阶段的一种宏观要求和期待。


    我们现在需要做的是如何去解决那些仍然存在的不利于可持续发展，即不利于顺利进入新常态的障碍和问题。十八届三中全会的决定从 16 个方面列出了 60 项改革任务，在一定意义上就是要解决我国社会经济发展进入一个新时期、呈现一种新态势后所面临的种种问题。我这里只谈两个具体问题，一个是产能过剩问题，一个是信贷过度问题。我认为这“两过”问题如果解决不好，新常态的基础就不会牢靠，真正的可持续发展就难以实现。


    压缩过剩产能的问题已经提出多年了，各地各部门在这方面确实也下了很大功夫，花了很大力气。但近几年来这个问题可以说是越发严重了，产能过剩的范围已从过去常说的钢铁、水泥、电解铝、平板玻璃、造船等行业扩展到许多所谓的新兴产业了，目前几乎找不到几个不过剩的行业了。


    2013 年末，国家统计局统计的我国工业企业产能综合利用率基本低于 80%，今年一季度进一步降为 78.3%。有的行业甚至低于 70%，这已经属于绝对过剩了，也就是指说这些行业如果不下决心淘汰一批产能，即使整个经济周期进入上升阶段，它们也很难有复苏的机会。现在的问题是有一些过剩行业投资减少不明显，生产仍在增加，例如今年虽然整体经济呈现一定的下滑趋势，但今年
    1-7 月粗钢产量同比增加 2.67%，水泥产量同比增加 3.69%，平板玻璃产量同比增加 6.23%，电解铝产量同比增加 7.46%。这并不是这些行业的产能利用率有所提高，有关企业的经营环境有所好转的反映，相反只是进一步加大了库存压力，直接影响了工业品的出厂价格，拖累了企业效益(6
    月份出厂价格同比下降 1.1%，已连续 28个月下降)。'
