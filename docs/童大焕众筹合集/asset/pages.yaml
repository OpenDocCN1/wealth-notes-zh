  md: '在中国建立 10 座拥有 5000 万人人口的超级都市，将能实现规模经济，突破经济增长平频。理由是：


    +   1、大城市的收入比一般城市收入都高，消费水平高有利于拉动经济增长。

    2、大城市人口密集工业、商业、服务业发达，人可自由选择的职业多，就业率比一般城市就业率高

    3、大城市污染处理成本低：城市废弃物处理容易形成规模化和商业化处理。

    4、大城市公共交通有利可图，人口流动大，公共交通不在是靠政府补贴维持生存，发展地铁和清洁能源运输可大量减少汽车的废气污染。

    5、城市向高空发展，可节约大量土地，80% 的人口集中在大城市是消灭城乡差别的必由之路。要提高农业的产业效益，生产资料必须集约化和规模化。

    6、把人口从不适合人居居住的地方迁往大都市有利于保持生态平衡，

    7、巨型城市的消费没有白天黑夜，没有黄金周。一线城市未来演化


    对于中国这样的大国而言，未来会产生多少个具有一定国际影响力的超级都市呢？


    美国《对外政策》杂志曾经发表过一个全球城市排名，前二十名的城市如下： 北美：纽约、洛杉矶、芝加哥、华盛顿、多伦多。

    欧洲：伦敦、巴黎、布鲁塞尔、马德里、维也纳、莫斯科、柏林。亚洲：东京、香港、北京、新加坡、首尔、上海。

    其他：悉尼、布宜诺斯艾利斯。


    欧洲因为诸侯众多，政治力量分散，导致有 7 个国际性城市，而作为全球最大经济体的美国，经过充分的市场化竞争之后，也仅产生了 4 个国际性城市。


    1 个政治中心(华盛顿)+3 个都市群的核心(纽约、洛杉矶、芝加哥)。这或许也会成为中国未来城市发展的一个样板。


    可能的演化趋势大概是这样的：


    北京，由于独一无二的政治资源，居于最高层级的地位。


    上海、深圳，作为两大最发达都市圈的核心，处于第二层级。'
