    # ### 最终结论：


    +   1  地段不仅不是“其实没那么重要”，而是生死攸关！人在哪里，“地段”就在哪里！什么样的人在哪里，什么样的地段就在哪里！得出这个结论以后，我们买房的正确战略方向是：在有价值的大城市核心地段买房，在工作生活所在地附近租房。


    +   2  在选好地段的前提下，房子本身真的没有那么重要。把地价和房价拆开的投资分析方法是正确的，越是中心城市和城市中心，越好的地段，越贵的房子，地价占总房价的比例越高（建筑和装修成本总是有限的而且是不断贬值的），也正因此，越好的地段，越贵的房子，越不需要看房子本身，只要建筑结构安全，户型合理，客群定位，通风采光正常，买房基本可以不看房，只需像我说的看卫星图，看户型看地段即可！【当然保养差房子可以趁机压价。但给我们的启示是：保养和装修真没那么重要！】


    # ### 2 大道至简，简在何处？


    # #### 童大焕—2016 年 8 月 21 日


    投资和做学问，讲究的都是世道人心。所谓世道，就是万事万物发展的自有规律和逻辑。大道至简，就是真正的天之道，人类社会在进步发展过程中自我形成的规律，既复杂又简单，我们紧紧抓住最重要的方面就行了。


    我很赞同刘军宁《面对天道，国人要谦卑》（2016-08-20）一文中虚拟老子和孔子对话的观点：“老子：我写《道德经》，是想说明两点，一点是人类必须认真对待天道，应该去努力发现天道，认真笃行天道。另一点是，没有人能够发现全部的天道和历史规律，即使是过去、现在和将来的人的全部智慧和努力加在一起也做不到。由政治经济道德等诸方面构成的人类生存秩序是演化而成的。我们只能做旁观者和参与者，而不能做总指挥。谁要想设计这样的秩序，并强行把社会中的每一个人像棋子一样塞进其所设计的秩序中去，那是既昧于天道也违逆天道。”'
  merge: -1
  img_proc: true
- pgno: 163
  md: '也就是说，我们要努力去发现天道，即规律，然后是敬畏规律，遵守规律， 按规律确定的“天然规则”办事。


    对我来说，房地产只是城市化研究的一个副产品。或者换一种说法：不懂城市化规律之大道，汲汲于房地产投资，只会刻舟求剑，不得要领。


    而我研究城市化规律，寻找大道至简的方式方法也格外简单：人会往哪里去？他为什么会往那里去？


    人类貌似很伟大，其实很渺小。从农业社会到工业社会，从工业社会到服务业时代，人类的每一次解放，其实都伴随着巨大的阵痛和不适应。虽然从几年、几十年后的历史回头看去，人类的每一次解放，都是自由和福利增进的过程，但是当初，都有一个痛苦的怀孕和分娩过程！从城市化到超级城市化，绝大多数人都是一个被动适应的过程，并不是积极主动去追求的过程；


    工业化浪潮来了，农业 GDP 占比从一国的 95%到今天美国的 1.2%，中国不到 9%而且逐年降低，农业养不活那么多人了，很多人才很不情愿地洗脚上岸；


    服务业时代来了，机器换人和工业过剩使大量流水线上的工人失业了，工农业占 GDP 的比重也逐渐下降到 20%以下，人们才七不情八不愿地被追进入大城市，参与服务业的分工。


    由此我们亦可知，城市化是工业革命、智能机器人、信息革命等一系列技术驱动的，任何权力、任何强人都无法阻挡。一旦技术拉着人类奔跑，任何人都无法阻挡历史的潮流，不跟着一起跑，就只能被时代碾在历史的车轮下。


    工业驱动初级城市化，服务业驱动超级城市化。这就是研究城市化和房地产的总纲领。做房地产投资，须臾都不能离开这个总纲。


    或问：如何看待政府规划？'
