    第二大改变，是随着互联网和网购时代到来，传统的像北京王府井、前门这样的商业中心将不可避免地没落，取而代之的是以新型的中央商务区（CBD）、以高端写字楼、酒店为特征的新型商务中心，取代百货贸易为特征的传统商业中心，将不可逆转。商务和商业，一字之差，天壤之别。


