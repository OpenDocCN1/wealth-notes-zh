    # 2015 年 5 月以来的房价暴涨真相及后续政策与对策【学员独家 注意保存和保密】


    我一直强调房价涨跌现象归根结底在人，人聚财聚人散财散。同样的货币超发或紧缩，不一样的地方涨跌表现不一样。因此，房价现象归根结底是人口流动现象。


    但还是要专文强调一下，2015 年 5 月以来的房价暴涨，却几乎是是货币现象。因为供应、人口流动方向和速度都没有发生根本改变的情况下，仍在限购的一线城市、放开限购的强二线城市、“京津冀一体化”之类
    “大城市圈幻想”下的环一线城市不限购地区，都迎来了房价暴涨。有一些三四线以下的成熟核心地段，也迎来了微涨并且有适当的 “去库存” 效应。'
