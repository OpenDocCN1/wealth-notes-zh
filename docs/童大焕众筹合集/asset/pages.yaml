  md: '60 年才能回本，而根据住建部 2010 年的统计，我国建筑的平均寿命仅 25-30 年。由于租金相比房价更能反映真实的住房需求，从国际经验看，一线城市租售比大幅攀升说明居民购房存在非理性因素，风险在积累。


    # 3.3. 房屋空置率高，或非单纯刚需


    我国住房空置率长期远超其它国家，即使是人口流入多、住房需求旺盛的一线城市空置率依然偏高。根据西南财经大学国家金融调查与研究中心的权威调查，2013 年中国住房空置率高达
    22.4%，一线城市也达到 21.2%，远远高于美国（2.5%）、中国香港（4.7%）、欧盟（9.5%）、日本（13.1%）、中国台湾（17.6%）等国家和地区。而根据
    2015 年腾讯网、腾讯房产研究院与中国房地产报、《腾讯智慧》联合调查的数据，一线城市住房空置率 22%，二线城市 24%，三、四线城市 26%，依然偏高。


    这说明居民购房不仅仅是刚需动机，还可能存在投资甚至投机成分，对房价上涨的预期会吸引没有或者暂时没有住房需求的居民也加入购房“大军”，推升房价在短时间内上涨。


    # 4. 未来房价走势的变数


    # 4.1. 风险偏好的变化


    先介绍一下本报告的标题——非理性的繁荣。1996 年 12 月 5 日，时任美联储主席的 Alan Greenspan 在演讲中提出一个词——“非理性的繁荣”（Irrational
    Exuberance），该词提出后，当天的日经指数大跌 3.2%，恒生指数下跌 2.9%，德国股市大跌 4%，英国大跌 2.2%，第二天早上美股开盘就下跌了
    2.3%。这样一个简单的词汇何以有如此大的魔力令全球市场如此恐慌？


    2013 年的诺贝尔经济学奖得主 Robert Shiller 在其《非理性的繁荣》一书中做了解释：非理性的繁荣是基于心理基础的投机泡沫，资产价格的上涨挑起投资者的热情，并不断在投资者中散播、“传染”；在传播过程中整个故事会被放大，以证明当前价格的合理性；后续投资者尽管怀疑资产本身的价值，但出于嫉妒别人的成功或享受做赌徒的快感，也会参与进来。


    也就是说，在非理性的繁荣中，新进入的投资者多是受到资产价格上涨的吸引，而不关注资产本身的价值，甚至进入到一种编织各种故事来给自己增加信心的状态；而其实越是上涨，投资者的内心深处就越脆弱，一旦大的形势有'
