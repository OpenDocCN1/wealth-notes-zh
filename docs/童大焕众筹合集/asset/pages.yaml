  md: '就哪怕是隔了一条马路，或者马路对面，或者隔了几十米，这边 4 万涨到 8 万，那边 7 万就涨到 14 万。上涨比率、上涨幅度是差不多的。


    （附注：我观察了北京双井到珠江帝景区域，多年来，以较长的十年左右周期为界，相对高端的富力城、中端珠江帝景和风度柏林、略低端百环家园房产，涨幅基本一致。反而是最低价位的保障性住房百环家园项目，涨幅略微保守一点点。可能是一来交易过程中需要补交一定的土地出让金，另一个可能是相对低端人群资金有限，对价格反而比较敏感和计较。当然，在短期内，呈现的可能是有一定波浪起伏的轮番涨跌。）


    （另一个观察是：不管是什么区域，除非自住，否则尽量避开所谓高端豪宅项目。此类项目普遍涨不过普通项目。可能有几个原因：一是开发商手里的附加值透支；二是它离真正的豪宅也许有距离，真正的豪宅要占据绝佳位置和景观，而不仅仅是装修豪华；三是豪宅拥有者大多数拥有多套房，此类房源的稀缺性被稀释。）


    （也就是说，只要尽量避开最高端的所谓豪宅，尽量避开最低端的回迁房、经适房、小产权房，拿掉一个最高分，拿掉一个最低分，同地段不同房子，上涨幅度是差不太多的。当然期间会有波浪起伏的轮番涨跌。）


    所以放心地买 7 万的没错。尤其是 7 万那个多出上百万资产（只要在能力范围内就应该尽量把资产做强、做大），这个非常非常重要。


    在年轻的时候，你如果能够在力所能及、在月供许可的时候一定要把资产做到最大。为了做到最大，就在月供限定的条件下尽量把贷款年限拉到最长。我们不知道什么时候会把它卖掉，即使不卖掉一直持有，把贷款年限拉到最长也是没有关系的。


    # 案例二：


    +   有人有资产如下：

    1、自住农村房一套，祖传的那种

    2、本县县城房一套，2014 年买的，证件不全，现在快盖完了，但交房无期，全款二十多万买的。

    3、（2016）年前入囯安一套，孔雀城的项目，预售证还没有，办贷款 50 万左右，月供 2600 元左右（现在还没开始还贷，贷款还没下来）2019 年交房。

    4、现金 30 万。'
