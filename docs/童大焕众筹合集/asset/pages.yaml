  md: "资价值的城市版块内部的楼盘与楼盘之间，房价都是波浪式上涨而不是齐涨齐跌的（其中就孕育无限投资机会），而最有价值的区域密集的核心地段，从较长时间周期看，一定是涨幅最高的。\n\
    \n投资最需要的是智慧和纪律，而不是钱。没有智慧和纪律，再多的钱也有可能一夜败光；有足够的智慧和纪律，不需要多少钱也能够迅速翻身得解放。纪律是最大的智慧！！！\n\
    \n# 第二条，\t\t\t\t\t\t\t\t\t\t己所不欲，勿施于人。\n\n敬畏人心的根本，是己所不欲，勿施于人；设身处地，将心比心。\n\n@金色娃娃鱼\
    \ 999 说：“看了童老师这么久的微博，就看明白了一件事：房价高的地方本质是人性钱，不知道对不。[嘻嘻]”我说：“说得太对了！人是一切价值的尺度。所以那些不管不顾谁（会）来接你的盘的人，以为自己是聪明人别人都是傻瓜的人，自己不想要的东西却以为可以抛售给别人的人，最后一定会受到上帝也就是市场的惩罚。比如，环大都市鬼城圈[哈哈]”正因此，我们在任何时候都不要忘了头顶的星空和心中的道德律。举头三尺有神明，冥冥之中看着你呢！如果你自己都不想要的东西，却等着别人来接盘，那一定是会受到市场规律的无情惩罚的。“道德律”三个字，拆解开来就是：以道（规律）为纪律，谨守天道，然后自然而然，成为有德之人。”\n\
    \n比如，我和风格纯粹从 2015 年底以来在关于都市圈的云端对话中一再警告楼市风险，并且创造了一个新名词叫做“环大都市鬼城圈”。我本人 2015 年 6\
    \ 月底就拒绝了环京某大项目代理商的团购邀请（也就是从我这儿报名团购，客户有优惠，我则有提成），但是很多人在疯狂面前对风险置若罔闻，甚至嘲笑我们这些清醒理性的声音。那么，就只能让亏本甚至一生跌进陷阱不能自拔来教育他们吧！很多人认为过去投资房产闭起眼睛都能赚钱，事实上，在现有开发面积是以容纳\
    \ 34 亿人的历史背景下，多少人穷一生积蓄买下的房子，表面上升值了，事实上想卖都卖不出去，抵押给银行进行贷款，银行都不要，相当多属于阴亏的状态。以前在三四线核心地段买的房子多少还能回去住或者租给别人，现在在环大都市土地上造出的鬼城圈买的房子，以后真的大部分只能给鬼住。\n\
