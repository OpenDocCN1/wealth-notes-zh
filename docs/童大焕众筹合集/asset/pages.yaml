  md: '![](img/5445d72b69ce6e91e3ccbb6377a50f55_239_0.png)


    很明显，中国的人口密度最高的地方，聚集在北京、上海、武汉三城连线组成的三角地带中。这个地带的山东、河北、京津、河南、湖北、安徽、江苏、上海，聚集了 4.3
    亿人口，占全国人口总数的三分之一。尤其是核心省份山东+河南，人口绵密(2 亿)、沃野千里(华北平原)、矿藏丰富(石油、煤炭)，十分适合发展为大工业基地。随着城市化率的提升，这里很有可能会将孕育起中国最大的都市带。就现在而言，青岛-潍坊-淄博-济南所组成的都市带也已经是有有一定发展水平的工业区，成熟度并不低于京津唐。而就未来而言，青岛-日照-连云港组成的沿海港口带，其发展潜力更是爆炸性的。


    特别是青岛，作为第三经济大省的经济中心，离北京上海两大都市都有一千公里的距离，接近一千万的人口，完全有发展成为超级大都市的潜力。但很可惜，目前的青岛，能让人记住的仍然只是海尔、海信、青啤等制造业，作为一个二线工业中心而存在，服务业以贸易、物流为主，其他的几乎没有发展起来。


    青岛的最大问题，在于缺乏一个导火索。没有政治资源优势，没有新兴产业，也就无法凝聚人气，吸引投资者的目光和内陆腹地的人口流入，整个城市只能在自然规律的作用下缓慢的发展着。不过来日方长，有些城市，缺乏潜力，无论你给予什么样的政策扶持，都很难得到发展，有些城市，身为而龙，只要得到机会，一日展翅翱翔九万里。


    青岛，就是这样沉睡的巨龙。'
