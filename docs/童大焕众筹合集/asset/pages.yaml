    # 接下来我们继续总结【大焕购房十原则】：


    +   1. 任何投资，表面上是经济活动，实际上是人生修炼。一定要抱着弱水三千我取一瓢饮的心态。不要什么都去抓，不要什么都去看。这样才能省心力又直击要害。


    +   2. 楼市投资，首先一定是要建立大的框架和体系，确保战略方向绝对不出错。在此基础上，在全国范围内找到一个安全的人生起跑点【用于楼市投资的起步阶'
