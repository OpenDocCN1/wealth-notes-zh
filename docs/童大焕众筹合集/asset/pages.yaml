  md: '# ## 从北京五六环的生活细节看城市边界【学员独家 注意保存和保密】


    本文再次用事实、用数据警告“环大都市鬼城圈”风险。只要我们高层建筑看清城市化发展的自有规律，并且摆正心态（不追求短期暴涨，弱水三千我取一瓢饮），大可以从容自在地做“南阳诸葛亮，稳坐中军帐，排起八卦阵，单提飞来将”，等待别人回归，倒过头来追逐你买下的稀缺房子（不论租还是售）。同时，羽扇纶巾，冷眼看别人，“谈笑间樯橹灰飞烟灭。”


    童大焕—2016年8月9日星期二


    上至天子下至庶民，无数中国人在做超级大都市产业和人口外溢的美梦。在“上愚下愚”的时代背景下，“京津冀一体化”甚至直接引爆四十至七十公里外环北京地区包括固安、香河、大厂、廊坊、怀来、武清、永清等地房价大涨。


    但我想提醒大家的是，研究城市化和房地产，一定要紧紧抓住一个最核心要素——人往哪里流动？为什么往那里流动？什么样的人往什么样的地方流动？其实起决定作用的就是就业，是就业方向的改变导致人口的集聚或分散：工业革命把人从农业中解放出来，引发工业化带动的城市化，人口开始高度集聚；人工智能和机器人革命又把从工业流水线上解放出来，引发服务业主导的就业以及人口和产业更进一步的高度集聚。那种试图分散产业进而分散人口的幻想，在服务业时代只是黄梁美梦！也就是说，产业不会外溢，只会加剧向城市中心集聚，引发人口进一步集聚！


    所以，城市人口和产业的加速集聚是未来主流，人口和产业的“外溢”充其量只是非常例外的小支流。而对于“外溢”的边界，我一直有个“单程一小时最多不超过一个半小时路程”的理论假设，就是从居住地点到最近的城市中心地带，公交最长时间距离不得超出一个半小时，否则人将不堪忍受。以此派生的就是“空间价格由时间成本决定”这一理论假设。


    当大家都在憧憬环北京地区“有房有车”的美好生活的时候，我想用一则报道再次证实一下我去年以来的“环大都市鬼城圈”警告。'
