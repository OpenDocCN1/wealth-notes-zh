    # 下面说说互联网对城市化的影响。


    这个问题我在给同学们的压缩文件《中国城市化与房地产投资》中有专门章节，请大家去重温，多读几遍。这里说一点概要的也许那些章节中没有提到的。


    很多人抱着老皇历说中国的城市化必经欧美那一段逆城市化甚至反向城市化即郊区化的过程，其实他们只是死守书本的呆子。一方面他们没有看到 1949 年以来中国的政策一直都是反城市化的：二元户籍制+计划分配粮食和住房锁死农民、知青上山下乡、大小三线城市、乡镇企业和小城市建设、就地城镇化、严控特大城市人口、京津冀一体化、西部大开发、东北振兴，等等，等等，都归于失败或必将失败。


    另一方面他们没有看到，欧美国家的逆城市化过程是在工业时代的一段特殊现象，即，产业的主流是工业，但污染处理的意识和能力跟不上，导致城市中心污染极其严重，房价和房租又高。中产阶级被迫搬到郊区。（参见本人《中国城市化与世界之异同》一书，网上百度可得。）


    但是今天，且不论发达国家服务业已占 GDP 总额 80%，全球平均服务业已占 GDP 总额 50%以上。就是在中国这样的发展中国家和地区，工农业产能也已经严重过剩，被迫自然进入以服务业为主的发展潮流中。而服务业发展的基本前提就是人口集中，哪怕是低端服务业人口，也要到中高端人群集中的地方才能生存。而中高端服务产业出现，前提又是“创新的浓度”和人口的聚集！【参见附2：为周其仁创新浓度说加点料】也就是说，人口的聚集本身已在现代社会已经成为经济和人自由发展的前提。'
