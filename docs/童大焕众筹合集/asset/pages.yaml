  md: '# 用城市生态理论化解最纠结的买房困惑


    很多人在买房的时候非常纠结：为什么同一地段，房价差别那么大？面对巨大的房价差别，到底买哪个好？价格低的是不是价格洼地？很多现有能力够得上的房子，根本看不上眼，是放弃它到别处买，还是将就？旁边面粉（楼面地价）都贵过面包（现售楼价）了，是否得赶紧买，否则都赶不上趟儿了？


    本文用两个刚刚发生的真实例子，用独创的城市生态理论给大家解释。看完本文，以后大家在买房投资的时候就不再纠结于这些貌似非常重大、实则无足轻重的细枝末节，从而把最主要的时间精力，用来研究哪些地段才是未来最有价值的地段。简言之，找对地段比纠结于具体细节重要得多。


    # 案例一：


    她：童老师，中午好。我可以请教一个问题吗？ 我：可以啊。


    她：我又看了两套房子，在（深圳）市政府旁边，距离平安金融中心 5 公里，楼盘在地铁一号线地铁口。一套（A）房是 63 平，440 万，23 楼，朝南，小型
    小区，只有空中花园，楼下是购物中心，马路对面是公园，2008 年的房子，租金 7500。一套（B）是旁边 1999 年塔楼，75 平 350 万，14楼，朝北，租金
    5800。哪套好？


    我：前面一个，资产多 90 万，年代新，朝南，且购物休闲都咫尺之间。


    她：单价是 7 万，以及 4 万 7 差好远呢。他们几乎是一墙之隔。我：贵贱自有道理，未来上涨率差不多。


    她：地铁出口就在楼盘（B）旁边，（A）是购物中心上上的房子，旁边是深圳第二高写字楼，购物中心连着地铁。主要价格差太远了，不懂选了。


    我：那就更别犹豫，（A）房 440 万的！


    她：老师能告诉我，这个选择的要点吗。原因是“前面一个，资产多 90 万， 年代新，朝南，且购物休闲都咫尺之间”？


    我：一个是 A 的年代新，年代越新，金融属性越强，要和银行发生抵押借贷关系越好，二手房买卖时也好。第二是它离写字楼越近，对于写字楼里的人来说越合适，现代人，特别是富人和忙人，有创造力的、单位中坚力量都很忙，时间成本是越来越高的，有可能走路差那么三两分钟，但租金差出
    500、1000 的很正常。第三是我经过长期的观察，同一地段不同类型的房源的上涨幅度、上涨比率是差不多的。'
