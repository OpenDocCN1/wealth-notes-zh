  md: '# 杭州


    在高端服务业的规模上，杭州是目前的中国第五城，虽然地位并不那么稳固。


    长三角作为中国目前最大的都市带，经济发展成熟，孕育另一个发达的副中心，是完全有可能的。事实上，上海的龙头角色，和苏南的制造业联系更紧密， 而且由于**南京、苏州**、无锡之间的彼此掣肘，导致了杭州的相对胜出。在浙江省内，杭州拥有极高的人气和盟主地位，大量的民营资本向这个城市聚集。比如浙南沿海的制造业，一旦发展壮大，通常会将企业总部迁徙到杭州，而不是更大的上海。另一方面，随着阿里的互联网版图日益扩张，人才聚集，带动了一个朝气蓬勃的新兴创业圈子，隐然已有成为长三角的“深圳”的气质。


    相对于中西部那些拥有巨大 **GDP** 规模的工业中心而言，杭州通常被人看扁， 但是一旦剥离了代工厂的数据，杭州的优势就凸显出来了。


    # 成都


    单以甲级写字楼存量来说，成都已经可以跻身第五城的地位了。


    但是，这个地位是有点虚的。**40%**的空置率说明，第一，投资者对成都的未来十分看好，用脚投票，给予了他非常高的市盈率，相信成都飞速的发展，很快就可以填平这个鸿沟；另一方面，也切实的可以看出，成都、重庆两地的高端服务业规模目前仍然较小，别说和广深比，就算和杭州苏州比，尚且不如。


    说实在的，成都重庆两地的未来，是值得看好的。其优势，一是西部经济中心，与北上广不存在竞争关系，二是本地人口密度高，具有孕育超大城市的资源条件。但是成都的上限，估计也就是和广州比肩的程度了，要进一步超越则困难重重。


    其中最难以克服的劣势在于：成都所在的成渝都市圈，偏于内陆，缺乏与海外贸易交流的港口优势，因此在外来资金、人才的输入上始终将慢沿海一步。这将严重抑制成都的服务业创新能力，使得其对外影响力的辐射半径被限制在中西部范围内。


    # 青岛


    从都市带的发展角度来看，以中国的人口规模，当然不止限于沿海的三大都市带。在未来的二十年，中国的城市化率将从目前的 **55%**，逐步攀升至 **70%**以上，那些原来人口稠密的平原农业区，有相当一部分将会逐渐转为工业地带。


    以下是中国的人口密度分布图：'
