  md: '一样在阳光下化掉。比如有人在新浪微博上问我，于是有了下面一段对话：“童老师，现在通货膨胀的速度快不快啊？会不会十年后的两块钱只等于现在一块钱？谢谢您”“有那么多值钱吗？”“童老师你不要吓我，那我这种小城市买不了北上广的人岂不是等着资产缩水了？”“怎么叫吓你呢？我说一个事实而已。你看李远还是在走重温的投资刺激老路，在中西部大搞高铁，到时候钱、股票、黄金放在手里都是没用的，只有好房子保值。好房子也不一定非得北上广，中小城市核心成熟地段照样有保值的好房子啊，除非你贪便宜。”


    金钱在真知面前很无用很脆弱，权力在真知面前也是很愚蠢没用的东西！温总理搞了十年楼市调控，结果房价十年涨了3倍不止。相信他能降房价的、等待他能给大家分保障房的全部都傻眼了而且真的变穷了，相信任志强、董藩和童大焕的都富了。


    **坚定真知信仰破除权力和金钱迷信。**要想获得超越金钱和权力的知识，首先要建立对真知的信仰。如果你都不相信真知具有超越金钱和权力的力量，你怎么会去真正尊重知识呢？怎么去会真正努力地求索知识呢？一天到晚盯着权力的风向，甚至一天到晚巴结着权力走，怎么能够有气定神闲的视野和远见呢？古往今来，世俗权力是有效的但又是高度有限的。几千年人类文明史，无数的权力有效性都已灰飞烟灭，但知识的星空中却总有那么几颗恒星闪耀着不朽的光芒，照亮着人类的方向。


    **建立了对知识的信仰之后，大家最关心的问题**是：我怎样才能获得超越金钱和权力的真知？这是一个要害问题。


    韩国总统朴槿惠《遇见我人生的灯塔——东方哲学》讲她在困境时指明她人生方向的冯友兰的《中国哲学史》：“就在这时，有一本书悄悄地走进我的心房，成为了人生的导师，那就是冯友兰先生所写的《中国哲学史》。东方哲学与重视逻辑和论证的西方哲学不同，讲究领悟。


    中国最具代表性的哲学家冯友兰先生的《中国哲学史》蕴含着做人的道理和战胜人生磨难的智慧，让我领悟到了如何自正其身，如何善良正直的活着。”而在我看来，讲究个人顿悟而不讲究逻辑与方法，讲究个案的“特殊性”而不强调事物普遍联系与制约关系的东方哲学和东方思维方式，恰恰是近现代以来东方世界普遍落后于西方世界的主因。因为这会导致东方世界的真知匮乏。韩国、新加坡、香港和台湾亚洲小龙的当代崛起，也是缘于全面和西方世界接轨。'
