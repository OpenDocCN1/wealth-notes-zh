    3 月份所立案的房产买卖纠纷案件相比去年大幅增长，其中房屋买卖合同纠纷从 2015 年的 19 件暴涨到 2016 年的 80 件，增幅超过 300%。


    面对购房纠纷，很多人选择走法律途径，黄颖却选择了跳楼。她结束了自己的生命，却没有结束这场纷争。


    这个案例非常极端。但在一个极端案例的背后，会有一万个十万个不那么极端的案例。极端的以生命为代价，不那么极端的则以买不到房子为代价。


    网络上很多人指责高房价害了当事人。但人们为什么不换一种思路想一想：人口大规模流入的地方高房价是城市化的必然副产品，全球人口集中到占地球总面积不到 1.5%
    的地方生产生活，相应区域房价不贵都难。这是上帝都没有办法的事情。那么，为什么别人尤其是和你一样收入水平的人买得起房，而你买不起？人家也不偷不抢不坑蒙拐骗。差别只能是思维方式和行动能力。


