    人与人之间的差别，超过人与动物之间的差别。尤其是收入差距达到 3 倍以上，思维方式、观念水位就完全不在一个水平线上。所以网络上有各种质疑我是充分理解的。但以敌意之态，客气点的说我牛皮大王，不客气的直接说我骗子，
