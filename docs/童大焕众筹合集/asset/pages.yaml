  md: '# 大焕视界：泡沫是消化泡沫的唯一办法


    在这一轮新的“泡沫周期”里，泡沫行情会维持到什么时候？我的答案是要维持到房地产基本软着陆、金融安全基本无忧之后。


    童大焕—2014 年 12 月 5 日 星期五


    我在上一届总理搞大中城市房地产限购限贷伊始，便于 2011 年 2 月 11 日在英国金融时报中文网发表文章《限购恐将催涨三四线城市房价》，指出“如果严厉的限购政策进一步将社会流动性挤向三四线城市，那么我们未来必将为三四线城市的泡沫买单，并且不排除大量基层地方政府因此加大征地拆迁热情，加剧已经很激烈的征地、拆迁矛盾，也为将来留下更多类似‘鬼城’、‘烂尾城’之类的‘城市化浪费’。我们更应该警惕的是，市场信号一旦披非市场力量屏蔽，其可能造成的社会矛盾和国民损失，相比于遵从真实的价值规律——哪怕是残酷的高房价而言，从个人到社会到自然界（比如宝贵的土地上建的是烂尾城），为此付出的代价要高得多。”不幸而言中。今年以来，我一再强调一个观点：面对十里埋伏四面楚歌的中国经济形势，《谁当总理谁降难》，谁当总理谁救市。一再被验证。


    时至今日，在产能全面过剩、债务危机四伏之下，制造新泡沫已经不得已成为消化旧泡沫的唯一办法！但这不是为泡沫而泡沫，而是为了解决债务而制造泡沫，然后在泡沫中解决债务危机！诚如成思危所言，当前金融遇到的问题，主要包括两个方面，一是房地产，二是地方政府债务（地方债务也依赖于房地产解套——童大焕注）。“这两部分加起来占到银行贷款的
    50%-60%，如果这两部分出问题，那么可能就影响很大。”


