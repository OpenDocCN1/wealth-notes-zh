    人口净减少的地区和产业衰败区（如城市远郊农村、美国底特勒及各种资源型城市、城市远郊区），房地产投资跑输通胀甚至不断下跌，直至有价无市无人问津！


    人类沧海桑田，城市三十年河东三十年河西。小渔村可能变成大都市，好地段可能变成差地段，六朝古都变成二线城市。人口，科技，商业，贸易，交通，产业，能源，文化和商业习惯，生育情形，气候，地理，资源，等等，每一项重心的转变，都会导致城市的兴盛或衰败，由此伴随无数房地产价值剧烈涨落。抱残守缺的，财富分分钟都会灰飞烟灭。比如一听说“保定副中心”来了，就把全部身家砸进去，认为千载难逢的机会来了！这样的人不破产谁破产？


    房地产投资，跟着城市化的趋势和规律走还是跟着领导跟着规划走，生死一线。领导常换而趋势恒在，好风凭借力，送我上青云。很多人就害死在关系、害死在政府天花乱坠的图纸上。什么这个前景那个未来，什么这个我有个官员朋友可以低价拿地，那个朋友可以优惠。因小失大。得到
    5% 最后连另外 95% 的老本也丢了！


