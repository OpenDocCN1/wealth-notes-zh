  md: '股市是别人的提款机，楼市是自己的印钞机。不要说你钱少只能买股票，不适当的一分也不要。


    股市赚钱只有两种办法：第一种，永不入市即是赚。就像永远拒绝毒品和赌博， 沾都不要沾。在股市、赌场、彩票三种赌博产品（请注意我把 A 股也作为赌场） 中，股市最凶险，凶险程度依次是股市、赌场、彩票。


    第二种赚钱的办法，提前设定损益额度，死死守住，打死都不改变！但是这种也许能赚但赚不多，也许还远远不如正确的房地产理财投资。


    不要只看见股市的短期赢利。几天、一个月挣 200% 不是本事，有本事的是两年后还能留下 200% 的回报！投资是一个追求长期期盈利的过程，否则都是小概率事件，就像中彩，或者耕种时挖了块宝石、走路天上掉下块馅饼。南漂分子毕航说：“我小姨妈上半年股市投资十万，净赚十四万，刚出国旅游了，世界股市那么大，她要去看看。”我也说个真事：我的一个学员
    2014 年 11 月通过转变观念和 方法，盘活资产，只付出了现金 5 万元入市买房，5 个月净增值 30 万元。而且稳稳地在那儿收租！观念一新其利断金！楼市那么大，要不要来看看？况且股市是负和博弈，即使赚了钱也要卖对的房子才能落袋为安。


    # 中国 A 股的特殊本质及与楼市的区别


    和世界上正常法治国家的股市相比，中国 A 股最大的特点是先天基因不良。它一开始就是为国企解困的工具，后来慢慢又成了权贵圈钱的工具。股价发行与股值严重背离，上市公司经营好坏跟股民利益没有关系。比如亚洲最赚钱公司中石油，虽然每年拿出
    45% 的利润进行分红，但由于股价发行太高，A 股股东靠分红 100 年才能回本！对此，当年中石油董事长蒋洁敏认为不能简单这样计算，毕竟在 A 股市场更多股东投资是看重二级市场股价上涨带来的回报（赌场的本质赤裸裸暴露）。至于二级市场股价上涨，那还不是股东们口袋里的钱赢过来赢过去的结果，负和博弈，跟中石油的赢利没有关系，中石油只不过是他们手上的一张赌牌而已！2007
    年，中石油就向纽约等 H 股股民散掉 600 多亿人民币的真金白银。我们的 A 股股民，反而折掉了 60% 的老本。'
