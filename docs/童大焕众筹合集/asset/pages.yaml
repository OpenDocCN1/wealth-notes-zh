  md: '童：孩子被关注，可能比学区房重要。小王这是脱离了学区房的思考和培养方式。


    我个人建议把住房投资和孩子教育分开。这样两个方面都会有更自由灵活的选择空间。


    秦：所以学校的培养模式很重要，名校就重视划学习，老师的成续和收入挂钩，不会有太多精力关注孩子的成长问题。我现在觉得意识到晚了，孩子大了，不愿意让父母管了。从上了初中后，学校的作用其实很大。


    小王：不同地区，不同职业，各个方面的思想都碰撞下，这感觉真好。


