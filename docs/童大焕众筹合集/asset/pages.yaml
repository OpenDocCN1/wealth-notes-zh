- pgno: 9
  md: '被打敗，而那些最强壮的男性则会生育后代，这样整个部落的人口质量，特别是战争实力就会增强。人口太多，人均资源不够，就要杀人，这是计生委和希特勒的思路，而不是现代人的思路。现代的标志是资本主义，是分工和交换，所以必须依靠城市来降低成本，提高效率。”


    科技发达以后，现代人的生产生活方式不再受制于自然，而是人类学会了改造和利用自然，让自然界的一切为我所用。比如风、电、石油、核能、光能等等，这些资源，在人类漫长的农业时代和远古时代，都是不可利用的。


    人类越集聚在一起，创造能力就越强，就越能够让全世界的各种资源为人类所用。根据能量守恒物质不灭定律，可供人类使用的能量是取之不尽用之不竭的，关键在于人类能不能更好地集聚在一起，和平共处，通过自由交换的办法来发挥人的主观能动性，充分地转化和利用自然，形成智慧、能量和财富的“核聚变”。


    但时至今日，多数人观念还是停留在农业甚至远古时代的资源有限论里，认为大城市资源特别是水资源有限，应该控制人口。所以他们看见大城市很拥挤了，就一直往城外跑，往城外买房。结果就会被越来越陡峭的超级大城市化把辛苦积累的财富甩掉一空！


    不仅城市资源可以无限，国家强大也跟资源、面积没有关系。一个私权受充分尊重，个人自由的国家和地区，会磁石般吸引全世界优秀人才和资源，那个地方会变得寸土寸金。相反，私权和自由得不到应有尊重，人们纷纷出逃，广袤大地鸟不拉屎。城市化规律与此同。


    从宇宙能量守恒定律的角度看，世界上的资源（能源）多得是，而且可以不断转化，取之不尽用之不尽。关键看人类有没有足够的智慧和科技创新能力，将世界上各种资源和能量“为我所用”。当愚蠢的人们汲汲于以命相搏获取一点点现成的、可怜的、有限度的、已经可以被利用的生存资源的时候，聪明的人们正用智慧和创新的力量、自由交易的力量让各种有限资源发挥出十倍、百倍的价值与能量！并且，让每个参与其中的人都生活得更美好！'
