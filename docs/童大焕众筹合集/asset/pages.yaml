    “今天我盯了一会盘面，看到上指逼近 5000 点，看到交易记录再次超越 2 万亿，我沉默了，无语良久。我知道此时任何的理性言论，在疯狂的赚钱效应（至少是暂时的）面前是苍白的。还是回到房子那个话题，绝大多数人买房子是为了居住的，不是用来交易的。房子有金融属性，但他不是单纯的投资品。所以，很多人持有房子的目的不是为了获利，这点是非常重要的。这导致大家不可能在某个时间点，譬如房价波动的时候恐慌性抛出（进而）导致价格更加剧烈的波动。而股票不同，绝大多数人买入的目的就是卖出，所以，一旦价格触顶的信号出现，在某一时刻，甚至风吹草动，就会出现恐慌性抛盘出现，导致价格雪崩。无论分析'
