  md: '也正因此，yevon_ou 在《真正拉大贫富差距的是什么》一文中提出了一个非常重要的颠覆性概念——富人恒贫！


    “我们目前的无风险利率，银行理财产品，收益率大致在 5% 左右。而全社会的通货膨胀率，纸币增加速度，本金侵蚀速度，在 14%。也就是说，储蓄的回报率，在每年-9%


    “这推翻了我们一以贯之的常识。从小长辈们就循循教育的‘钱是有利息的’。钱是没有利息的！利生利，利滚利，谎言！每年-9% 的利率，其实对富人最为不利。越是有钱的人，受的损害越严重。富人恒贫。”


    yevon_ou 在他的另一篇文章《哪一种财富，才是万世不移的财富？》里写道：“中国人常有一句古话，‘富不过三代’。富为什么不能过三代。你以为大家族的公子们，个个都是纨绔子弟，个个都是吃喝嫖赌么。这也太小瞧贵族教育了。如此反智思维，实在污辱了鹴鹴世家的门风。真正的原因，是因为通货膨胀的洗劫。一个家族由富豪到富裕，富裕到小康，再到平庸，主要是通货膨胀的不断侵蚀。就我们所见，没有一个
    A9 家族是纯粹靠吃喝玩乐能把家产花光的。”


    正确的投资理财，不仅要力争跑赢通胀，而且要力争在比较各种投资理财产品后，选择最好、最持久的一种。


