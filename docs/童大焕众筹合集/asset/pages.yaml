    我一直强调，能够随时和银行发生抵押等借贷关系的独立产权房是普通百姓抵御通胀的唯一工具。近年来又强调，大城市核心地段的优质房源是普通百姓唯一可以凭智慧和一定的财务技巧占有的、可以传诸后世的垄断资源。


