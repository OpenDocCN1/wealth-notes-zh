  md: '他又问：“那这个对城市核心中心区域的房价会造成什么样的影响呢？”


    我回答：“短期没有直接影响，长期促进核心区价格上涨。”


    为什么会得出这个貌似非常奇怪的结论？推理的过程是这样的：如果五环外增加土地供应，那么这些地方肯定是吸引更多人进来。那么这更多被吸引进来的人，是来自城内呢还是来自更远的城外？我的答案是来自城外的多于来自城内的。因为中国有句古话——由俭入奢易，由奢入俭难。同理，由配套齐全、时间成本低的城市中心，进入郊区是不易和不舍的；但是那些远郊外的大量人口，由于近郊开始有房供应而且这些房价比市内低，就会有相当一部分人逐渐回到近郊。这就夯实了城内的房价基础。长期看，郊区，哪怕是近郊区，还是不如城区配套好，不如城区节约时间，所以这些郊区人口，有条件的还是会千方百计回到城里。又进一步推高了城内住房需求，让更有购买力的，把一部分城市中心人口置换出去。


    投资是一种非常有意思的智力迷局，它让我们享受收获和快乐，更让我们享受过程的美妙。只有能够真正享受过程的人，才能够真正享受“无意间”收获的丰硕成果。


