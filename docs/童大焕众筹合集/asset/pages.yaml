  md: '之间的差距。超发的货币大量流入股市和房地产市场，导致房价、地价均大幅飙升。


    21 世纪初的互联网泡沫破灭和“911”事件使美国经济遭受重创，美联储在 00 年至 03 年间将目标利率从 6.5% 的高位下调到 1%，且保持低利率至
    04 年中，导致货币超发；1999 年时美国实际 GDP 和 M2 增速分别为 4.7% 和 6.0%，相差不大；但到了 2001 年实际 GDP 仅 1%，而
    M2 增速却达到了 10.5%，2002 年两者之间的增速也相差 4.5 个百分点，而通胀无法解释如此大的差距。充裕的流动性使美国股市翻了一倍，20 个大中城市房价长期保持
    10% 以上的增长，滋生了地产泡沫。


    中国的货币超发对一线城市房价也起到推波助澜的作用。自 2010 年以来，中国的 GDP 增速就在不断下降，季度同比从 12.2% 的高点下降到 15 年 4
    季度的 6.8%，但 M2 增速却从 15 年年中开始回升，16 年 1 月份 M2 同比更是高达 14%，远超目标值。与此同时去年 6 月股灾后股市吸收资金也逐渐减少，市场上过剩的流动性开始流入楼市，一线城市房价也正是从这时开始飙涨。


    货币超发导致房价暴涨的同时，人民币汇率却保持了相对稳定，这使得中国房地产资产的美元价值急剧飙升，存在被高估的风险。根据我们的估算，一线城市房屋总价值可买下半个美国：北京、上海、广州、深圳常住人口分别为
    2170 万、2426 万、1308 万、1078 万人，人均住房建筑面积分别为 32、35、28、27 平方米，利用这两个变量可以估算得到四个城市的居民住房建筑总面积，再乘以四个城市的住房均价即可得到住房总价值，分别为
