  md: '话是《决定中国未来的两个大三角结构》，在这个对话里，我提出了一个概念：今天的中国，在宏观上和微观上都有三个大的、非常牢固非常稳定的三角结构，它们是决定未来中国命运的基本结构！


    宏观三角结构是城市化+互联网+金融化。这个宏观的稳定三角结构会拖着拽着古老而又韧性巨大的中国，迅速，义无反顾地往自由市场化方向走，任何人无法阻挡。这是个超级巨无霸的正面力量源泉，中国因此而迅速走向正常化的自由市场国家。微观三角结构是迁徙自由+信息自由+微观层面的金融自由。这三大自由，是一个正常社会的基本自由。


    从个体自由角度，微观三大自由也使个体迅速摆脱对家庭的束缚，进入更广义层面的经济独立和人格独立状态。传统家庭由此发生巨大改变，其中尤其以优秀女性的独立和解放为显著标志。这种改变，比女权主义者呼吁千万次妇女平等和解放有效得多，改变也深刻得多。


    受经济条件制约、无法实现个体独立和解放的，暂且先放一放。我们先说先行者。市场先满足优胜者。


    传统的五世其昌四代同堂的大家庭早已解体，接下来是父母和成年儿女之间的家庭迅速解体！理想状态是，彼此住得很近，但不在同一屋檐下，也就是不在同一套房里。孩子 18
    岁以后进入大学，进入社会，从此也要筑一个新的自己的巢。随着电子阅读时代的到来，传统的书房功能也逐渐衰退。


    那么，正常的两到三居室就足以满足 18 岁以前两个孩子家庭的生活需求了。再大的房子，等孩子离家，就显得空落。因此，未来城市的主流户型应该还是两口之家，两到三居室。随着社交运动大量移到家庭之外，以及城市中心房价的不断上涨，两到三居也要追求适当的迷你化。


