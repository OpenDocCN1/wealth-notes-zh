  md: '有关部门就出来辟谣。也就是为什么深圳房价在全国一线城市中最先暴涨，他们却不敢对原有限购措施再行严厉加码，反而史无前例地大幅度放宽了人口入户政策，希望通过人们“把根留住”来夯实房价。（《深圳入户条件放宽》2016年8月29日深圳新闻网
