- pgno: 232
  md: '“从上述几个小区过去的涨幅来看，涨幅最高的是交大嘉园，世纪城，鑫雅苑。这三个小区最大的共同点是都是学区房。但这是过去的涨幅，现在再来买是否还能简单根据过去涨幅高低来选，就首先要弄明白过去是什么因素导致涨这么多，未来这个因素还在吗？是否具有可持续性？


    “我认为过去学区房的涨幅非常高的原因有以下几点：


    “1. 当初买的价格偏低，实际是被低估了。从过去的数据来看，当时学区房的价格和非学区价格是差不多的，也就是学区名额这个附加功能的价值并没有体现在房价上。那么将来的补涨是肯定的。


    “2. 由于我国的教育都是被垄断的，最好的老师最好的教育资源都集中在了公立学校，而这些名校的进入标准却是否在周围有学区房，这就导致了很多的家长为了自己的孩子能进最好的学校而争抢那为数不多的学区房，独生子女孩也加剧了这一情况。


    “那么这两个因素在未来还在吗？第一个因素显然是不存在了，现在的学区房价格已经充分体现了学区名额这一价值，甚至存在严重高估的可能性。第二个因素还在，但持续性却存疑，首先，如何划分学区房这个是由政府决定的，随时可能改变。其次，未来是否可能进行教育改革，放开教育垄断，让公立学校和私立学校进行充分竞争。这两点是很大的政策风险，有着很大的不确定性。所以基于以上原因，这三个小区不再是好的选择。而且如果有些家长真的有学区房需求，也应该买面积小总价小的老房子，而不是上述这三个小区的学区房。买房也一定要把各种需求分清楚，投资，自住，学区，到底要什么要明白。


    “如果一定要从上述几个小区选，我会选择丽水嘉园，在朝阳公园旁，离地铁稍远，最近的地铁是团结湖站，好在离金台夕照站（CBD 核心）只有两站路，两居 1-1.2w
    的租金也证明了它的价值。”


    小罗同学的分析有条有理，对变量要素的把握也非常到位。但分析中忽略了另一个变量：人口集聚。或者说意识中有（如提到 CBD 核心和租金），但没有重点分析。'
