    老师踩点肯定花了很多时间。我：


    我没有花多少时间踩点。完全不必要。知道哪里己经成熟足矣。 2013 年底开始接广州的单子以来，我只推珠江新城一地，但我从来没到过那里。成都也一样。【原理是：高端服务业呈现越来越集中的趋势，但是绝大多数人认识到，
    因此真正的价格洼地恰恰是这些市内成熟的新核心地段，虽然价格己经很高，但仍然是被低估的。一开始人们会很抵触或晕眩于类似高密度区域，但时间越来越宝贵最终会使高密度区域价值回归。结果是：
    2016 年 8 月 12 日，微信群里有人说： “广州过去一年整体上升 10%以上，中心几个区大约 25% ，好的区域如珠江新城中区整体升 40%以上，今年上半年有一段直线拉升。”下一个是不是杭州呢？
    这个我是不知道的。我只知道，杭州类似的区域有同等价值，但是这个价值什么时间回归，我并不知道。我所能做的，就是坚持价值投资保守投资理念，用时间等待人们回归。或迟或早，它总要回归。其它城市，依此类推。】


    这就谈到了【我的投资哲学，就是保守保守再保守】 1 大道至简，坚守规律， 八风不动，矢志不移； 2 保守。我不敢奢望摘取阶段性涨幅最高的标的， 而是老实本份地坚守价值投资理念，用时间等待价值和别人的回归。即使亲身经历过交易当年房价上涨
    1 倍；交易期两个月涨幅超过此前 2 年；交易 4 个半月净增值为投资额 4 倍等等经历，也不敢吹口自己能把握什么 “时机”。投资很难，首先要战胜自己的贪婪和举棋不定；投资也很容易，用最多的时间去认清价值，然后用时间和耐心静待价值回归。疯涨还是慢涨，那是上帝的事情。我，只问耕耘，收获，交给时间。'
