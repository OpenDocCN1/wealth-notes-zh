  md: '也就是说，哪怕是同一个楼盘，由于各种原因，价格也是不同的。这种价格最终要找平，几乎是没有可能的。另一个问题是，在任何时候，都有可能有特价房出现，这个只能作为特例来考虑。不可以作为常规投资方法。特价房的出现，往往是业主要急需用钱。什么时候出现，并无规律可言。要等到特价房，只有持币待购一途。但这只有职业炒房人有可能持币待购——锁定几个区域，跟区域中介建立普遍联系，一有机会，就立即拿下，否则这种时间成本和机会成本都非常高——楼市投资，本质就是和时间空间赛跑。


    如果一定寻找特价房出现的规律，我认为恐怕在这里，就是特价房比较容易出现在高端楼盘：一是因为高端楼盘业主通常都有经营等活动，遇到经营等人生风险的概率也比工薪阶层高；二是这些业主普遍舍得割肉，知道有舍才有得的人生哲学。


    比如最近两天我在掌上链家找北京银泰中心，就突然发现了一套特价房：131平米，满两年不满五年，2016年1月19日由850万降至820万，2月27日又从820万直降到720万。比同类面积的房子报价直接低了200万。该房从2015年11月4日至今一共有3位客户看房。


