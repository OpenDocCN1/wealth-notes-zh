  md: '源（增量配套），我们通常叫做投资属性（也叫成长性）。我们常说的买房子看的是未来其实就是说房子的投资属性。也就是说，房子的周边未来会有配套工程的增加，那么这样的房子就有升值空间，而升值的原因就是未来的配套设施一旦兑现，那么就是在给配套设施周边的房子送金送银。我们看到，燕郊香河房价在今年北京
    市市政府东迁通州的消息落地以后暴涨了 40%，内在的原因就是北京市政府东迁以后必然会带动一大批城市配套设施迁到这些区域，尤其是教育医疗资源的大量迁入。


    “当一个区域还比较荒凉的时候，如果传出政府要大模建造这个区域，这就是机会，因为这个时候这里的房产就是原始股。而敢于在这个时候买进这个区域房产的人就是现在时髦的风险投资（PE、VC），因为一旦这个区域未来成熟起来那么当初的投资就会获得几倍或者几十倍的收益，就比如二十年前你投资北京三环，十年前你投资北京五环，五年前你投资燕郊，今年你投资香河一样。


