    # 写字楼投资价值简析【学员独家  注意保存和保密】


    > 不管是投资写字楼还是住宅， 都秒杀几乎一切形式的金融理财。 只要方向、方法对路， 不论住宅还是写字楼， 收获 50%到 100%甚至更高的年回报， 都是相当容易的事情。
    未来城市进入收缩和积聚阶段， 积聚所在地的房地产投资空间比过去更大， 更集中！ 关键是你要看清楚城市化规律。


    童大焕——2016 年 5 月 30 日星期一首先要说明两点：


    一是所有的投资， 都是在尽可能保证安全【这个同样受到认识水平等的约束】的前提下， 在各种客观约束条件下采取的次优选择。 对任何人来说， 几乎都不存在最优选。
    不自量力一味追求 “最优” 才能行动的人， 不是丧失投资机会， 就是堕入投资失败的陷阱。


    在把握大局、大方向、大趋势前提下， 匹配自己、合适自己的就是最好的选择。


    二是本文的 “写字楼”， 主要针对仍在限购的北、上、广、深四大城市而言， 是 不能购买住宅前提下的次优选。 而这些城市， 恰恰是未来高端服务业高度发达'
