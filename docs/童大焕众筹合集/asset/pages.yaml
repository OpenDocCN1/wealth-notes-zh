  md: '个阶段——重新向大城市核心区集聚的阶段，其实受到顽强的中小城市和郊区的后拉力——因为很多人的家已经安顿在了中小城市和大城市郊区甚至远郊区。


    在全球经济一体化时代，工业的产能是可以辐射到全世界的。


    中国这样一个经济和城市化后发的国家，由于户籍制度下迁徙不自由等原因，工业化进程出现了和城市化分离的现象，也就是人在工业所在地上班，但并不一定定居那里。2.7
    亿农民工和工业企业的中高层管理人员，人在，根未必在；而且，随着工业产能迅速过剩，以及工业产值占 GDP 比重的迅速下降，以及工业自动化下机器换人等原因，工业城市的衰退会变得特别快。也就是说，还没有经历“郊区化”和“逆城市化”两个阶段，人口就又迅速向大城市核心区集中。所以，很多
    1980 年代以后，靠工业化而发展起来的城市里，很多就业人员并没有根的存在，在那里既没有买房，也没有真正意义上的家，因此，一旦服务业时代到来，人们对这些城市的背叛和逃离比发达国家的相应城市快得多，人们义无反顾地进入超级大城市核心区的速度也快得多。


    > **结论：不论是先发国家还是后发国家，人口最终向超级大都市核心集聚的趋势是一样的！像中国这样没有迁徙自由的国度，城市化发展不必然经历发达国家的郊区化和逆城市化过程。相反，人们抛弃中小工业城市、迅速进入超级大都市核心区的速度，比发达国家还要快。**


    所以，希望我的学员，我的弟子们，在思考问题的时候一定要照搬结论，而要充分地仔细分析和研究社会发展的各种过程和变量。通过学习我的理论、方法并努力践行，成为千万富翁亿万富翁，其实只是初始境界。最高境界是养成缜密细致的思考能力，在急速变迁的社会面前，能够清晰地洞见未来。一如大焕财智书院的标志语：理性洞见未来。'
