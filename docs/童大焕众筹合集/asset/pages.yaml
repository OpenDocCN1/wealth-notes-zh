    # **3 避开风口，避开眼球**


    买房一定要避开风口和眼球，众人追逐不等于多数正确。与风口和眼球逆向而行，往往会有抄底机会。比如我上面提到的那位在平安大厦成功购房的深圳客户。


    一定要相信真理总是掌握在少数人手里，中国是个群氓社会，也是个群盲社会。当前由于货币政策放松，购房交易税费降低，一线城市仍然限购，京津冀一体化或协同发展的鼓噪等因素，在继三四线及以下城市鬼城频出之后，中国大都市周边正急剧酝酿鬼城风险！千万别贪小便宜吃大亏！


    比如 2016 年 3 月 6 日有人这样私信我：


    “董老师 通州商住经过去年大涨后 今年的投资价值是否已低于大兴 房山顺义 昌平等区域的商住？”


    我说：“世界越来越陡峭。”


    他说：“非常认同董老师的世界越来越陡峭 但资金有限 准备采取农村包围城市战略先买燕郊 待两年后有了购房资格再置换到北京 现担心经过去年暴涨以后燕郊涨不过环京其它县城
    通州涨不过其它北京区域。”


    我说：“陷阱多于机会的时代来了。您问了很多问题，但由于没有系统学习或私订，总是不太得要领。”


    # **4 把居住和购房分开，已经到了生死关头**


    我在 2010 年《买房的革命》一书里即已主张“你买的房子给别人住，别人买的房子给你住。”在全国普遍的房屋过剩背景下，这个问题今天已经到了生死攸关的地步。如果还在坚持买房就是自住的理念，不把住房和买房行为严格分开，等待着他的，可能就是财富陷阱。


    【如果说 2010 年我在《买房的革命》一书里提出“你买的房子给别人住，别人买的房子给你住”还只是一个观念倡导，到了今天，楼市遍地过剩的时代，把买房和居住工作地分离，已经成为一条多数中国人必须遵守的“纪律”，否则，很多人会成为这个时代的财富弃儿——被自己的观念抛弃！】


    任何人，都必须在全国范围内配置房产了。如果自己工作的是人口流出的小城市，宁可租房也不买房，买房一定要配置在更中心城市。


    比如 2016 年 2 月 24 日起，有一个腾讯微博网友，现金只有 13 万，月供能力 3 千元。她想让我帮她规划设计一下，想在深圳周边买房。


    我说你绝对不能局限于深圳。这点首付能力，最容易一买就错。从此被陷进去，买的房子有可能再也卖不掉。因为买得起的都很偏远了。'
