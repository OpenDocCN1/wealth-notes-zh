    # **5）宏观：人聚财聚人散财散；微观：物以类聚人以群分**


    最优秀的人在哪里，高房价就在哪里。包括最优秀的人才流入大都市，以及， 最会赚钱、最有经商传统地区的人衣锦还乡，分别决定了大城市和小县城的房价。


    <font color=''blue''>不同的产业集群，集聚不同的人群；不同的人群聚集，带来完全不同的区域房价。同样的区域，不同的人群定位，创造完全不同的楼盘价值。</font>


    人聚财聚人散财散，物以类聚人以群分，一宏观，一微观；相互补充，相得益彰。斯为城市化和房地产之天条也。务必请大家仔细观察分析。


    比如北京的房价构成，就非常值得分析思考。2015年截止 10 月 25 日，北京一二手房成交均价分别是：二环内 62650 元/平米，二至三环 46499，三至四环64247，四至五环
    52246，五环外 24172。北京三至四环间房价稳居第 1 阵营，二环内第 2 阵营，四至五环第 3 阵营，二至三环居然居居第 4 阵营，五环外房价腰斩。太耐人寻味了！


    # **6）流入人口，回流人口，溢出人口如何识别和区分？**


    人口净流出地区，房价肯定是横盘甚至下跌的，哪怕货币超发一直在进行——再多的货币也是人在使用，没有人的地方也没有货币和交易。而且首先肯定是最优秀的人才先流出。因此，不考虑人口流出地区的投资和房价，而重点考虑另三类人群对房价的影响。


    大城市房价由流入人口决定。流入人口不是均衡流入，而是到了流入地以后还会分层，比如一部分流到中关村，一部分流到动物园批发市场（当然已被强行拆迁，其实也就是消失了），一部分流到
    CBD。等等。流到滨海新区的人群，和流到浦东新区的人群，有天壤之别。于是决定了两个地方的房价也是天差地别。


    小城镇房价由回乡人口也就是回流人口决定。回流人口的整体人群素质或者是打工传统还是经商传统，直接决定回流地县城和乡镇房价。


    <font color=''blue''>**溢出人口**目前是个最面目模糊的概念。我们拿国安、燕郊和大厂来进行比较分析，就会得出比较清晰的概念。</font>


