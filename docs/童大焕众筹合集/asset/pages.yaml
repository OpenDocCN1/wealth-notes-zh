  md: '每个人的评判工具不一样，得出的结论肯定不一样。但最终时间只能给出一个答案。高明的方法是看别人的工具，而不是拘泥于别人的结论。首先要看方法对不对，才能知道结论对不对。


    论证的方法里，包括他的论证工具（设定的标准），论证依据，论证逻辑。光看结论是没有用的，结论因时因地而变。否则，即使买对了，持有了，也没有坚定的持有决心，遇到风吹草动，就不知去留，甚至做出错误的决策。


    接下来我们要用万有引力定律和城市面积扩张算法，来算一算城市面积对外扩张所造成的“能量和价值衰减”。


    将万有引力定律引入人际关系和城市化研究，恐怕是我的首创，甚至至今还是独创，我对此感到自豪。它可以清晰地研究城市向外扩张中的能量和价值衰减现象。


    先看万有引力定律公式： F=G*M1M2/（R*R）


    +   其中：

    F：两个物体之间的引力G：万有引力常数

    M1：物体 1 的质量

    M2：物体 2 的质量 R：两个物体之间的距离


    在这个公式中，万有引力常数 G，以及两个城市彼此的能量 M1 和 M2 都是在一定时期内相对稳定的。变量只在距离的平方。当然，这两座城市之间的吸引力，是表现为一座城市的“吸附力”，还是一座城市对另一座城市的“外溢力”，是大有讲究的。所谓的“吸附力”，是指一座城市把另一座城市的人口和产业吸附过来；所谓的“外溢力”，是一座城市的人口和产业外溢到另一座城市。想像它们的运动状态，所谓“外溢”，其实是“被吸附”。那么，是能量大的吸附能量小的，还是能量小的吸附能量大的？这不是不言而喻的事情吗？


    根据这个公式，两个物体、两座城市之间，距离越近，互相吸引力越大，彼此互动、纠缠越厉害，能量大的一极吸附能量小的一极的力量也越大。这可以解释为什么首都机场离国贸那么近，25
    公里，首都机场的就业和写字楼却一直难有大起色。'
