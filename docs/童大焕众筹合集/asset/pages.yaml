  md: '银行理财也是以股市和楼市为基本方向，远不如自己学会专业楼市投资。股市是别人可以看你底牌的赌场，以后坚决不沾。10 万元也只是小试，亏盈都无所谓，不必放在心上。支付宝利息低，跑不过真实通胀（真实通胀平均每年约
    14%，即 M2 增量）。


    在通胀时代，家中不必也不该留大额现金。只需留足日常流动资金就可以了。关键时刻，平安银行有一款产品，可贷 3 年，根据你月供总额提供 40 倍左右的贷款，年息按民间算法
    12% 左右。一天就出款。相信以后银行金融产品会越来越多，只要留意好自己的还款信用。只要信用好，偶尔的亲友挪腾也不会太难。


    2 现有两套房子都是全款，对资产增值造成巨大的浪费。通胀时代，银行按揭贷款利率是很低的，应该在月供许可范围内最大限度最长年限利用房屋进行按揭贷款。只要我们选择得当，未来很长时间内房屋平均升值超过
    M2（14%）是大概率事件，因此，在正确判断的前提下要勇敢地去冒险。


    两个小问题：一是镇上的房子应该尽早僵尸机换到城里来，这里的城，就不局限在义乌了，而应该放到杭州一类的市中心。二是金华的商铺，纠纷解决后及早置换成更优质的住宅或杭州核心区域的写字楼。受电商冲击，商铺过剩早已从小城市一直弥漫到大城市。某些特色商业街区除外。


    设计思路

    我们的设计思路是：沿着城市化“人聚财聚人散财散”方向，最大限度做强、做大、优化资产。方法路径是：首付用尽，月供能力用尽。


    先用月供能力反推贷款金额。您的月供能力是 2.4 万元，根据您的和太太的年龄应该至少可以贷款 25 年。利用网上房贷计算器，大致可得：月供 24325.2
    元，25 年可贷 400 万元。按照 3 成首付（现在房地产异地可能没有联网，你们现有 2 套房均无贷款，我估计完全可以按 3 成首付放贷）计算，你们可以买总价
    570 万元左右的房子（这里没有计算二手房交易的税费，每套房屋都不同）。首付则是 170 万元。


    把现有 110 万金融资产全部取出来，首付还差 60 万元，怎么办？可以用现有两套房中的一套抵押 100 万元以上，把二手房税费什么的也都准备好。建议抵'
