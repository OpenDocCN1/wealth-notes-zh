  md: '工业革命给人类带来了光明，短短 180 年时间，地球上城市化率由 3%迅速提高到 50%以上。人均 GDP 则在 180 年时间里增长 8 倍。


    技术进步和时代发展比我想像的还要快得多。我刚刚判断 2014 年是中国城市化的重要分水岭，由工业主导、政府主导的上半场，进入服务业主导、市场主导的下半场。刚刚两年过去，传统的工业化就将与城市化变得几乎没有关系！不仅是工业化无法再带动城市化，而且是传统的因工业化而带来的城市，有可能进入迅速衰退行列！


    和工业时代传统资源型城市的衰竭不同，现代工业制造业城市衰退，经济总量并不一定会衰退，而且有可能在增长，但是人口容纳能力却在迅速下降！原因是工业智能化大量取代了人工！美国制造业的回归与中国制造业大量向劳动力成本更低的东南亚转移，原因就在于此。制造业不及时实现智能机器人化的更新换代，将迅速在世界上失去竞争力。


    由此，一个结论出来了：传统城市化是由工业革命带动，工业化带来城市人口增长。这是对传统农业时代的颠覆。


    但是今天，智能机器人颠覆了传统工业主导的城市化，制造业正在迅速进入无就业甚至负就业式增长，工业化不仅不一定带来人口增长和城市生长，反而有可能因智能机器人替换人工，导致对传统工业城市的人口挤出。


    而城市的本质是人口集聚。离开了人口集聚，再强的制造业也与城市化无关！ 不论中国还是世界，城市化由此进入服务业单极主导的时代！这，是对传统工业化主导城市化的彻底颠覆。城市化的逻辑完全改写！


    工业化对传统农业的人口出清可以达到什么程度？美国、日本这些发达国家农业人口都只占总人口的 1%就是规律和趋势。请不要跟我说美国粮食寄生在发展中国家身上之类的蠢话。美国不仅是自由与法治大国，不仅是科技大国，更是农业大国，是真正的世界第一大农业国。它一个农民养活
    90 多个美国人、30 多个外国人（粮食出口）。


    那么，智能工业对传统工业和传统工业型城市的人口出清可以达到什么程度呢？先看一份最新的外媒报道，《中国 77%的工作都可能让机器人来完成》，报道说：'
