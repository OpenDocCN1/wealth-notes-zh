  md: '只有海纳百川有容乃大，虚心分析和考虑各种不同立场不同角度的不同意见，才能获得对一件事物的相对全息认知。特别要说明的是，这一条只对初入新领域的学习、思考、研究者有效，当你长期研究一个领域，获得了对这个领域的全息认知和全局思考的理性能力之后，你已经知道这个领域哪些人的话是全局理性的，哪些人的话是没有全局视野的非理性的，对于后者，就不必再浪费一分钟时间去理会他的判断了。


    重视方法轻视结论。多数人思考和研究问题往往一上来就直奔主题：老师您给我个结论，这房价（股市、黄金、期货、艺术品、珠宝）到底会涨还是会跌？老师您觉得北京房价会涨到多少钱一平米？老师您认为天津房价未来两年会翻番吗？等等。这是一种极其偷懒也极有害的思维习惯。别说是讲这投资理财，就是讲其他有关中国城市化、公共政策、思维方式等方面的课程，我都一再跟同学们强调一个观点：要格外重视我论证问题的方法，而不是舍本逐末去死抠结论。得我方法者生，得我结论者死，结论因时而定，方法万古如新。


    一切判断都必须建立在诸多外部约束条件上，比如判断楼市这个问题，就有非常多的变量：人口净流入或净流出状况（人聚财聚人散财散），货币供应量，货币和信贷政策，供需比，户籍政策，等等，任何变量发生改变，结论都会发生改变。如果你对这些分析方法和工具一无所知，你就永远会觉得公说公有理婆说婆有理，你根本无法分辨谁说的更有道理，因此你很有可能会把一个错误的结论当至若奉若至宝，把一个正确的结论当垃圾弃如敝履。


    所以任何时候都要着重关注别人思考问题分析问题的方法，只追求结论是最舍本逐末的。人家的分析判断为什么是对的为什么是错的，根本的原因就在于分析解剖问题的方法。有些人瞎蒙蒙往往也能蒙对一半，但他的瞎蒙是可以不负责任的，你相信他的瞎蒙，万一一次失误就有可能让你一辈子翻不了身。有些人明明一直都是错的，根本原因就在于他的方法和逻辑都是错的，如果你还在信他，只能说明你从来不关注正确的逻辑与方法，你将在注永远与正确的结论和选择无缘。


    重视方法的学习与提炼，你将会拥有自己的定见，并随时根据自己的情形和未来发展的趋势，做出最有利于自己的、成本最低、收益最高的各种选择。否则，只注重结论的人，永远在
    人云亦云中像一只无头苍蝇一样晕头转向，不知所终。'
