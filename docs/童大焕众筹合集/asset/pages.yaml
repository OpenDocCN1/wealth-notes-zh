  md: '其次，用风投理念来买房是错误的，风投一般投的都是已经具有明显成长性， 即市场开拓性很强的产品；而买房往往越是早期越有规划迷惑性， 很多人一听说政府有个什么规划就扎堆而入，因为大家都还没入住，这时候的欺骗性最大。而开发商除非遇到资金链紧张问题必须降价以断臂求生，否则即使从社会心理学角度，也会不断人为提高价格，造成涨价表象，吸引更多傻瓜进入。人傻钱多，一旦交房入住，才发现时间成本根本不堪忍受。


