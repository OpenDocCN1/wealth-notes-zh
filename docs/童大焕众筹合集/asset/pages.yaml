  md: '比如最近非常火的一个调查报告，西南财经大学经济与管理研究院院长甘犁发布的《城镇家庭住房空置率及住房市场发展趋势 2014》报告，调查了很多样本和数据，花的功夫肯定不少。媒体在报道这份报告的时候，用了一个很夺人眼球的标题叫做《城镇化是一个伪命题？空置的房子足够全国人民住了！》，而且一开头就说：
    “这个报告很牛逼的地方在于，央行每年都问甘先生要过来仔细研究的，高层决策依据之一啊！”


    先看看这份报告怎么说的。报告说：如今中国城镇化率都已经 89%，中国现有的住房需求 3250 万套，现有空置房是 4898 万套。未来五年，房地产新增需求约
    895 万套，但实际供给将达到 1600-2000 万套，现有存量房完全可以满足住房需求。2013 年全国城镇家庭住房空置率高达 22.4%；到 2014
    年 3 月，全国城镇住房拥有率已达 89%，位居全球第一；到 2014 年 3 月，全国城镇地区多套房拥有率已达 21%，也就是说，每五个人中就有一个人的有多套房。


    看了这份报告，相信绝大多数人会得出 “房屋早已过剩，房价非降不可” 的结论。但如果你真的得出这个结论，你的结局可能会很惨，你有可能会因为等待房价下跌而导致自己买不起房，可能会因为不敢投资楼市导致自己资产在未来严重缩水。


    这份报告你怎么看都没有错，但在你肉眼看不见的地方，报告的大背景却是错误的！也就是说，它是不见全局盲人摸象的结果。它背后的全局是什么？是城市化，而且是不以执政者和很多人妄想
    “就地城镇化” 意志为转移的大城市化， 是人口在以史无前例的规模和速度快速流动！ 在这个大迁徙大流动过程中，很多房子被空置，很多需求没满足。人在动，但房子不能动。而且先富阶层和先知先觉的阶层可能已经在农村乡下有一栋房，在老家县城一套房，在工作居住地一套房，一家拥有三套房，一套也不多，这些
    “空置房” 、“多套房” 的真实社会结构，是不是更能说明问题？同时，我们 1998 年才实行城市房地产市场化改革，至今已 16 年时间，要补 1949 年以后长达
    50 年时间 “只筑城不筑窝” 的课，很多房子名义是一套，事实上不仅窄小，而且厨房卫生间也许配套还不全呢。


    大前提大判断错误，再多的数据都说明不了问题。我们必须学会用脑子来看问题，而不仅仅是用眼睛来看问题。老鹰的眼里有整个天空和大地，屎克郎虽然身处广袤无际的大草原，但它的视野不会超过一堆牛粪。只有用脑子，只有有效'
