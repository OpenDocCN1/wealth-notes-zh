  md: '农业人口在迅速衰减，传统制造业人口在迅速衰减！而人是一切的出发点和归宿，从土地和工业流水线上解放出来的人们会去哪里？他们只有一条道路：不是在现代超级大都市，就是在奔向现代超级大都市的康庄大道上！


    服务业主导的超级大都市化，已经完全颠覆了传统工业主导的城市化逻辑，很多人却还亦步亦趋停留在过去所谓“逆城市化、郊区化”的思维陷阱中不能自拔，却对这些年来日本东京都人口回流，美国婴儿潮老人从郊区别墅回流都市中心，等等，视而不见。


    无论是过去还是未来，人聚财聚人散财散的规律不会改变！城市化程度唯一测量的指标就是人的集聚，这个也不会改变！


    人类的人口集聚是一直以来的规律，技术越发达，越集聚。不因互联网，交通而改变，也不因生育率的逐步下降而改变。因为时间越来越宝贵、创新和智慧碰撞需要人口密度和浓度、越集聚效率越高这些基本规律是不可改变的。而逆城市化、郊区化则事出有因：正是当年城市化由工业主导，带来了主城区严重的工业污染，迫使一些中产和富裕阶层迁往郊区。随着环境保护意识和能力的加强，随着工业自动化，大量工业制造可以通过少量的人、多数的机器在“无人区”进行。传统的工业化直接带动城市化时代，彻底终结了！人口向超级大都市积聚的态势，如大河奔流，如黄河壶口瀑布，千山难遮，万里无阻！


    而生育率的下降，并不导致超级大都市的衰退。相反，中国的独生子女政策，反而加速了人口向大都市流动！因为在多子女的时代，子女就父母，有父母的地方就是家；而在独生子女时代，父母就儿女，儿女在哪里，父母也搬到哪里，已成趋势和潮流！这一点，我在2011年出版的《世纪大迁徙——决定中国命运的大城市化》一书中，已有专文揭示。


    # 用尽全力 用时间等待价值回归【学员独家 注意保存和保密】


