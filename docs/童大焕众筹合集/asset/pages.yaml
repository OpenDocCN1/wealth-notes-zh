  md: '户型只是中年人生的一个过渡，等孩子上了大学，很多人就会打算换小一点的。打理方便，居住紧凑而温馨。郊区别墅更多的时候更是摆设。大家庭和超级富豪另说。大学毕业的孩子，两代人同一套房居住的也会越来越少。因为生活习惯不同，作息时间不同，甚至人生的各种观念也不同。两代人之间若即若离才是最高境界。


    3     年老时。很多忙碌的中年人，总在幻想年老时与山水为伍，做自然之友。找一个清静的所在，过养花种草的生活。但事实上，他们忘了，与年轻时中年时的喧噪完全不同，多数老年人面临的是年老时的寂寞！年老时，过度的清静是可怕的，
    适当的喧器是宝贵的。


    上述种种，就是设身处地。要让冰冷的理性战胜狂热的头脑。很多人把自己一生的财富沉浸在了概念和想像里。山景房，海景房，养老房，旅游地产，郊区别墅， 回家养老，等等等等。归根结底，还是观念落后——屁股已经进入了
    21 世纪信息时代、服务业时代，观念还久久停留在农业时代。


    最后，用一幅字给本文作结： 大道至简，


    世相人心； 头顶星空， 心守万宁。


    # 先发与后发国家 人口小国与大国的超级城市化道路之异同 【学员独家 注意保存和保密】


