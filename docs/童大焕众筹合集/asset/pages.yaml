  md: '# **楼市投资的八大思维陷阱【学员独家 注意保存和保密】**


    房地产投资必须要看到三年后是涨是跌，不看三年五年后只看短期的买房投资都是耍流氓。


    财富是思想的副品。很多人走着走着又回到了习惯性的老路上，陷入了以往的路径依赖，所以一直没有突破和飞跃性的提升。


    投资其实是一种思想游戏。清晰地洞察未来，既是成功的关键，也是十分有趣好玩的事情。本文最重要解决的就是两个字：定力。


    2014 年中国城市化进入下半场【由政府和工业主导的上半场扩张模式，进入市场和服务业主导的下半场收缩模式】以后，楼市投资，亏的人多赚的人少的时代，说来就来了！


    楼市投资，是资金密集型产业，更是智力密集型产业。“财富是思想的副品”这一财富定律，在楼市投资领域表现得格外直接，淋漓尽致，立竿见影。未来的亏盈，由思维方式决定，不由钱多钱少决定，也不由权力大小决定。正确的思维与行动，可以事半功倍快速实现财务自由；错误的思维与行动，一个决定可以让自己几十年辛苦积累功亏一篑。2011
    年的限购限贷，已经导致了一大批扎堆三四线城市的开发商破产或者正在破产的路上。2014 年底以来的大规模放水去库存，又将制造当下疯涨、未来没有未来的“环大都市鬼城圈”。大家不妨拭目以待。


    一念天堂，一念地狱，“一念”何来？思维方式而已。因此，防止“一念之差”，全面盘点楼市投资中的思维陷阱，就成为本文的主题。它是我迄今为止耗时费力最多的一篇文章，呕心沥血整整半个月时间。也是众筹费用最高的一篇文章，定价，4999
    元。就这一篇。希望人们在决定下手投资之前，都能拿这篇文章出来好好读几遍。这篇文章，反复阅读，如果能够充分领会其精髓，掌握城市化规律和购房技巧的 70%应该是可期的。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# 第一大思维陷阱：还在用农业文明和工业文明思维面对未来。【服务业带动城市化的蜕变时代已经到来】


    今天一切思想和行动，不是为了回到已知的过去，而是为了迎接未知的未来。


    但是世界上绝大多数人的观念，远远跟不上时代前进的脚步。就像我们今天的中国，99%以上的人还在用传统的农业和工业思维思考城市化问题。而不谋城市化之全局，则不足以谋房地产之一域。


    开始写这篇文章的2016年7月1日，北京时间晚间消息，世界著名未来学家阿尔文·托夫勒(Alvin Toffler)本周一（6月27日）在家中逝世，享年87岁。托夫勒是世界著名未来学家，当今最具影响力的社会思想家之一。他1970年出版《未来的冲击》，1980年出版《第三次浪潮》，1990年出版《权力的转移》。通过这三部未来学著作，托夫勒享誉全球，成为未来学巨擘，并对当今社会思潮产生广泛而深远的影响。


    在《第三次浪潮》中，托夫勒将人类发展史划分为第一次浪潮的“农业文明”，第二次浪潮的“工业文明”，以及第三次浪潮的“信息社会”，给历史研究与未来思想带来了全新的视角。


    《权力的转移》讲述了给我们带来无尽纷扰的变动，尤其是知识在权力转移中扮演的关键角色。托夫勒在书中提出“社会权力”的新观念，并探索了未来企业、经济、政治和世界局势的改变。


    许多评论家和学者认为，托夫勒在这三部著作中的所有预测几乎已全部变成现实。虽然托夫勒的理论很复杂，但他却能用简单易懂的语句来表达，这对普及他的思想起到了重要作用，例如：


    21世纪的文盲不是那些不能读写的人，而是那些不能学习、忘却和再学习的人。【大换注：也就是那些没有空杯心态，没有学习习惯和学习能力，不能及时清空和淘汰旧知识旧观念并且及时拥抱新知识新观念的人。】'
  merge: -1
  img_proc: true
