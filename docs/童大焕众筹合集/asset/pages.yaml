    # 第七大思维陷阱：在各路专家面前难产东西【辨识方法比结论更重要】


    多年来我一直建议大家少看结论多看分析过程，并且说：得我方法者生，得我结论者死，结论因时而化，方法万古如新。


    但是现实生活中太多人不动脑子，只想要结论。结果在众说纷纭的专家面前莫衷一是，不得要领。或者保险起见，“不把鸡蛋放在一个篮子里”。我就遇见过一个天津客户，推崇固安的专家也信一点，在固安买了一套房子；提醒环京鬼城圈的我的观点也信一点，我推荐的顺义那种起步型
    LOFT 产品居然也买了一套！ 买完这两套房，手里居然还有 300 万！这么多的钱，本应该集中到最有价值的地方一次性把资产做它个千儿八百万的！'
  merge: -1
  img_proc: true
- pgno: 24
  md: '有人在分答上问我：你一直不看好固安并且一直警告环大都市鬼城圈，可是很多专家仍然看好以固安为首北京周边啊。您怎么看？


    我说，包括专家在内，不同的人有不同的观点非常正常。对未来的判断，不可能人人都是事后诸葛亮，肯定有对有错。但是规律只有一个，所以时间一定会最终给出正确的答案。评判的尺度和工具不一样导致判断的不同。我评判区域价值的工具是时间，甚至认为，时间是衡量房价的唯一要素。也就是说，工业带动城市化已经是过去式，服务业带动的城市化，环北京远郊区房价要涨，前提是有很多在北京上班的人外溢到那些地方居住，但是路上的时间，会成为一票否决的最终因素。


    在我和众多专家的分歧之间，我的观点可以破众多专家的观点，就是：传统工业和物流产业带动人口集聚的城市化时代过去了，而时间成本会成为决定区位价值的首要因素。如果那些专家不能破解我这个观点，那么就听我的吧！


    如果你对两者之间的对错难以分辨，难以取舍，那么，建议你暂时远离有争议区域吧。选择那么多，何苦刻舟求剑？这是最保守最安全的做法。


    # 第八大思维陷阱：能力和欲望之间高度不匹配。


    2016 年 7 月 12 日，有人问我：“收入 1 万/月（税后），现金结余 40 万，北京户口。今年目标计划：10.1 之前必须在北京买一套房子。未来计划：打造资产性收入是一生的事业及目标。学习房地产及金融投资作为工具打造持续稳定现金流来源，支撑购买并长期持有更多核心优质房源。”


    我毫不犹豫地给他当头一瓢冷水：“明确告诉你北京市内没有可能，除非你父母亲有资产可以拿来置换优化。你现在是能力太小而目标太大，如果按你眼前的能力和目标，在北京买下的房子基本可以说一买就是陷阱。”


    他问：“童老师的意思是现在我不要买房？为什么在北京买的房子是陷阱？”'
  merge: -1
