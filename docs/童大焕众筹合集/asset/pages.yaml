    6 月就主动找我团购，我连条件都不谈一口回绝。我知道它卖得好，知道孔雀城是那里最好的房子，那又怎么样呢？房产投资不是买房子，而是占领独特的有价值的城市空间。大城市中心老破小，比你家乡别墅如何？'
