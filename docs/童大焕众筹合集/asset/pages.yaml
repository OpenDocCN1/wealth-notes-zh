  md: '# 问题 2：请问酒店式的商住两用房产怎样，投资应注意哪些？


    **童大炮答：** 那些承诺若干年租金回报的酒店式公寓和写字楼、商住，一般不建议买。若干年后，项目起不来，投资就打水漂了。他们是把房租打进了出租价格。好地段的写字楼和商住，根本不愁卖，不需要包租。


    # 写字楼和住宅投资回报远高于最保险的股票


    2016 年 6 月 13 日凌晨，我劝一位有钱的好朋友投资北京写字楼。他说：“我还是继续投资股票。买股票比买房更赚钱。股票每年增长 20 至 25，比买房划算多了。我投资股票
    1000 万，每年可以 200 万左右回报，满足了。”


    我说：“问题是你投资股票的经历别人不可以复制，但投资房子的话旱涝保收。你们投资主要是没有用银行杠杆。1000 万投资写字楼，不算房价上涨（也不算银行杠杆），前
    5 年租金 6%，每年 60 万，每年增 10%。第 6 年起约 120 万，第 11 年起约 240 万，第 16 年起约 480 万，第 21 年起几乎是
    100% 的回报。” 这样用 20 年下来，投资房产的平均回报率比巴菲特的回报还高。况且还有物业净资产的巨额升值。如果作为传诸子孙后代的财富，更是甩巴菲特几条街。


    如果是前几年，不限购不限贷，用 20% 的最低首付最高杠杆买住宅，回报率更是惊人。举两例：


    第 1 例：2007 年 2 月正式过户入手北京珠江帝景附近某小区两房，净资金投入 30 万元，含税费总价不到 100 万，现在总价 650 万，净价 600
    万，9.5 年资产是过去的 20 倍。不含过去这么多年平均租金高于月供部分。


    同期如果炒股，按不含每年稳赚 20% 计，20% 又都投入再炒股，计算复利，以 10 年计，是原来的 5.16 倍。


    显然，5.16 倍远远小于 20 倍。


    第二例：2010 年 1 月正式过户入手北京 CBD 某大两居 140 平，净资金投入 60 万元，现在净资产 490 万元（今天中介来电问 4.5 至 5
    万卖不卖，就按 4.5 万计），6.5 年资产是过去的 8.17 倍。也不含过去这么多年平均租金高于月供部分。


    同期如果炒股，也按每年 20% 复利计，算 7 年，是原来的 3 倍。'
