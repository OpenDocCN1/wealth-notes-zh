  md: '童：学区房的形成，有多种原因，政府不当干预当然是主流。我们给孩子投资学区房，主要考虑的是两点：是否真正对孩子有利？房屋投资有没有风险？风险多大，是否在心理和经济可承受范围？从外部环境看，社会的持续压力必然迫使政府淡化学区房，这对学区房构成了投资风险；从内部环境看，学校和教师团体对学区房的抵制也是必然现象，因为它不符合择优录取、因材施教的科学教育规律。这又对通过学区房上名校的孩子构成了压力和风险。


    我孩子上初中时候，听说有一位海归家长，孩子明明可以保送北京四中，但是他却让孩子上了次一流的八十中还是降经纶，理由是不要让孩子那么累，让她更轻松地保持自信。我挺佩服这个家长。


    名校离不开名师+优生，硬件投入倒其次。前几年我济南有一位文友，他老婆是名师，北京一个教育局想引进她，直接给的承诺就是一家三口马上解决户口。大家都知道北京的户口有多难。后来他们还是犹豫居家不易，到现在还没来。不承认名师的作用是不客观的。离开了人，钱什么也不是。


    老师天生喜欢优秀的学生，就像工匠天生喜欢杰出的精品。这是人类普遍的共同心理，甚至可以说惟此才算正常。如果老师不喜欢优秀学生而偏喜欢不那么优秀的学生，这个心理就不正常了。但学区房制度破坏了这种择优机制。正常的老师和老师对关系生、择优生、学区生分门别类“因材施教”，符合正常的人类心理也符合科学的教育规律。任何行业有它的底线规则和规律，我们还是有所敬畏为好。


    刘：同意童老师观点，名校对孩子是否有利，肯定有利，名校更注重素质教育，一般学校更注重应试教育；其次，投资风险，不赞同只看到教育因素，不过可以适当放大教育在众因素中的作用，交通、医疗、购物、文化娱乐设施等都要考虑；优良中差的区别有先天因素，不过我觉得后天教育更重要，只有名校教师才有因材施教的水平，一般学校大多是赶鸭子。


    童：你能告诉我什么叫素质教育，什么叫应试教育吗？因为你多次提到这个问题。还有，名校一定对孩子有利的观点，我是不同意的，如果孩子不匹配这所名校，给他带来的只是自卑、紧张和压力。再有，因材施教的前提师生比合理，如果学区房大幅度提高了入学人数，老师不堪重负，还能因材施教吗？顾得顾不'
