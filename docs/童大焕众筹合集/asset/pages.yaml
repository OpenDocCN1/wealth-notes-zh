  md: '但是有趣的是，作为中国最大都市圈的核心城市，号称中国经济中心的上海， 在高端服务业的规模上，竟然只有北京的 70%。


    其实也并不意外，在上海的 GDP 中，服务业占比远低于北京， 2014 年，北京的三产占比高达 78%，而上海，只有 64.8%，甚至低于广州。作为一个金融中心，竟然拥有着这么巨大的工业规模，显然是不合理的。随着未来地价的攀升，上海的工业将不得不大规模外迁，即使是<u>汽车</u>、石化这些相对高利润的工业，也是无法长久生存下去的。目前，宝钢的工厂外迁，已经是进行时了。


    北京作为中国的权力中心，其高端服务业的庞大规模，是建立在全中国土地之上的，不仅仅是服务于渤海湾沿岸。由于这个原因，在可以预计的将来，北京仍然将会是未来中国经济影响力最大的第一都市。


    # 广州和深圳


    广州、深圳的高端服务业规模都只有上海的一半左右，合起来刚好与上海相当。


    作为仅次于长三角的中国第二大制造业基地的高端服务业中心，广深在某种意义上来说，完全可以看作是一个城市，一个依靠轨道交通从南到北只需要半个小时的超级都市。只不过，由于种种历史的原因，这个都市的中央地带是名为东莞的制造业区，两个
    CBD 中心则分布在南北两端。


    一个类似于上海的浦西，承担的是政治、交通、教育、文化、商业等传统功能，一个类似于浦东，承担的是金融+科技的功能。


    说<u>广州发展</u>缓慢是不负责任的。最近五年的 GDP 增长率，广州并未低于北京上海。


    +   1. 广州 2009 年 GDP 是 0.91 万亿，2014 年 1.67 万亿，增长 183%；

    2. 北京同期 1.18 万亿和 2.13 万亿，增长 180%；

    3. 上海同期 1.49 万亿和 2.35 万亿，增长 157%。


    深圳同期 0.82 万亿和 1.60 万亿，增长 195%。


    广州慢于深圳，那是必然的，全中国也没有哪个城市可以跟深圳比速度，别说广州，北上不是照样输掉一截？以深圳的发展势头，跃升为第三城是毫无疑问的，而广州，居于第四的位置，也并不丢人。在一个都市圈内，终究是一荣俱荣，一损俱损，深圳上位，广州得到的好处远多于失去的。'
