  md: '答曰：**如果规划符合规律，规划会锦上添花。如果规划违逆规律，规划一定会失败！**现实中，真正遵循城市化规律的权力规划，百不足一。为什么？一方面是权力的狂妄与自大，1949年以来从来如此。不合我心的，轻则打入冷宫，重则禁忌夺命。另一方面是知识成为权力的奴仆，在中国久有传统，知识分子多数缺乏经济独立和人格独立、知识与思想独立，不能提供真正卓越的见识，供决策层参考。从历史上“学成文武艺，货与帝王家”，到今天被权力垄断性豢养的知识界，几乎成为解释权力逻辑的“第二宣传部”，可谓奴颜卑膝，于今为烈。


    在此背景下，大道至简唯一要做的事情，就是谨守天道，自有天福。切记：改变历史的最大力量是技术，是人类的组织方式和信息方式的全面改变，而不是改朝换代，更不是什么历史巨人。在当下社会，比如城市化和房地产领域，往往会发现离权力越近判断离现实越远、输得越越惨的现象。比如相信“京津冀一体化”而到环大都市圈抢房，相信北京要往外赶人200万的“内幕”而卖掉市区房子等待抄底。我说的都是有实例的，前者尤甚。


    传统工农业时代，是有形资源成为财富主体的时代，那样的时代，离权力越近，往往意味着离财富越远；现代服务业时代，是无形资源成为财富主体的时代，这样的时代，离权力越近，可能坑越多。小道消息让位于大道至简！！


    或问：如何做呢？童老师。答曰：学习，思考，信规律不轻信规划，信市场不轻信市长。


    或曰：嗯，感触很深。都是画圈，深圳和浦东都成了，曹妃甸却烂尾了。不弄清深层原因，盲目跟规划，死都死不明白。再加上现在的规划越来越弱智，唉！又或有人曰：那可不可以这样说：权力阻碍服务业时代的来临？


    我说：它阻碍不了，技术和智慧走在它前面。而权力部门也是各种人的角力，包括人对新事物的好奇，都会使技术和智慧拥有喷薄而出的缝隙。'
