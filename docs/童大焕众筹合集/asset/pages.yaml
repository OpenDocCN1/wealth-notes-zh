- pgno: 235
  md: '去过日本的同学，一定对日本的都市圈印象深刻。


    从东京出发，坐上新干线到大阪，从窗外望去，三个多小时的路程，延绵五百多公里的距离，除了起伏的群山，就是密集的城市街道和楼房，只要是一块稍微平坦的土地，都被城市覆盖了。


    你甚至几乎看不到郊区，也就是我们传统印象中像顺义怀柔、奉贤金山、番禺花都这样的地方：名义上是城市，其实仍然是农田与厂房交错，建筑密度极低的地方。更遑论是农村了。


    在行政区划上，他们隶属于十几个大大小小的城市，但在经济意义上来说，他们只属于一个紧密联系的都市圈。


    在这个都市圈里，东京、大阪、名古屋几个核心城市，相当于 CBD 功能，由规模巨大的写字楼和购物中心组成，汇聚着金融、科技、贸易、律所等高端服务业的各种企业。


    而工业和厂房，在高地价的驱赶下，全部迁到了周边的二三线城市去。一线城市，不会有他们的生存空间。


    我们传统印象中的工商业中心城市的概念，就这样被肢解了：一个城市，无论你的管辖面积有多大，人口有多少，GDP 有多高，都没有意义。在地价和利润率的作用下，工业、商业、服务业各自分离，命运不同。在一个成熟的都市圈生态里，高端服务业中心傲然居于第一层级，就像人的大脑，遥控指挥着全国的经济活动，而工业区和住宅区则散落在第二层级，接受辐射，而农村，在都市圈的范围内，已经消失不见了。


    所以一线城市和二线城市，最大的区别是什么呢？高端服务业。


    规模越大，对于周边经济地区越具有决定性的影响力。如何去衡量一个地区的高端服务业规模呢？


    最直观的指标，就是当地甲级写字楼的租赁面积。


    以下数据，是我根据戴德梁行等四大行发布的相关数据整理的主要经济中心最新甲级写字楼租赁面积。'
