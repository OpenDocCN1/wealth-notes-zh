  md: '日本房地产泡沫大家比较熟悉，哈里森模型熟悉的不太多。简要介绍一下： 哈里森模型是一种经济模型，全称：弗雷德•哈里森的“18年周期”模型。他认为自从工业革命以来，完整的房地产周期维持在
    18 年左右：“房价会先上涨


    7 年，然后可能会发生一个短期的下跌，然后再经历 5 年的快速上涨，再之后是 2 年的疯狂（哈里森称这两年为“胜利者的诅咒”）。最后是历时 4 年左右的崩溃。


    但其实这两种玩意儿到了中国都“水土不服”，没用！我把照搬照套这两种模型的人称为“书呆子的死记硬背生搬硬套”。有人曾寄给我一本书，《美国房地产泡沫史（1940-2007）》，封面上说此书被华尔街日报评为“迄今为止研究周期最长的地産泡沫经济杰作”。很长时间过去了，它的塑料膜我都没有拆封。因为我觉得这样的书，哪怕它费了非常多的功夫，调查了无比详尽和真实的资料，
    也基本没有价值，不必要为此浪费宝贵的时间和精力。


    # 为什么？


    世易时移，变法宜矣。世界上没有两片完全相同的树叶，没有两条相同曲线的河流。甚至同一条河流，也在不断地改变曲线！


    真正聪明的分析方法是变量管理而不是生搬硬套历史经验，也就是认真研究决定未来房价的变量的变化：


    +   第一， 日本泡沫和哈里森模型都是在城市化已经基本完成的前提下发生的，中国自 1949 年以来则是基本上完全通过人为手段阻止了城市化进程，时间长达 50
    年，这个课必须补也必然会补；


    +   第二， 日本泡沫和哈里森模型都是在工业化之前发生。特别是日本，工业化和城市化都已经饱和了。那时没有像现在一样的经济全球化，因此生产也向海外转移。日本“衰落”的
    20 年，GNP 增加了一倍。和国内生产总值 GDP 不同，GNP 是国民生产总值的简称。'
