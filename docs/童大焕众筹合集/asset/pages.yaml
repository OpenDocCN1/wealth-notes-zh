    # 什么样的优质房产是世代不移的印钞机（学員独家 注意保存和保密） 童大燦—2015年 9月 8日星期二


    人生一世，白驹过隙。如果人的一生一世都在辛苦赚钱，甚至到老而不能停歇，那是很可悲的事情。世界上最聪明人应该让还没有赚到的钱帮我们赚钱，在退休之前就赚取足够的被动收入，自己勾出时间和精力，把生命浪费在美好的事物上。


    被动收入一般来自三方面，从低到高层次依次是：


    最低层次是国家较为完善的社会保障。但这又是最不靠谱的，充其量能保证你退休后能够维持中低收入的生活水准。你一辈子哪怕是个人缴纳的社保费用，如果自己拿来正确理财，退休后的回报都要比退休工资高得多。现在的情形是，如果你的工资是
    1 万元，单位要为你付出 1.4 万元，而你扣除五险一金到手的只有 7 千多元！


    第二层次是创立一个百年老店一样的企业，然后交由职业经理人打理，世世代代拿红利。但企业创业成功率极低，即使少数成功的创业者，多数最优秀的企业家仍需终身忙碌，永不退休。当然他们已经进入了通过经营企业实现自我人生价值的最高境界。尽管每位企业家在企业创立之初都会有“打造百年老店”的美好愿望，但从实际情形上看，这种雄心壮志远敌不过客观的企业运行规律——企业是存在兴衰周期的。在中国，因为市场成熟度和某些中国特色原因，这个兴衰周期相对发达国家，要更短些。这种初级阶段市场特有的状态，形成了一个“企业寿命<企业家群体商业寿命<固定资产寿命<家族寿命”的格局。


    其实我们大多数普通人，通过有效的固定资产投资，可以达到更高的第三层次的被动收入境界，这就是：实现让优质房产成为世代不移的印钞机功能，赢取源源不断的被动收入！


