  md: '# 买房 12 大窍门【学员独家 注意保存和保密】


    **按：**这篇文章必须和上一篇《楼市投资的八大思维陷阱》紧密结合起来读。需要下手买房前，都不妨把这两篇拿出来读一两遍再下手。这两篇原本是一个整体，但是文字太多，两万多字，公号一次性发不出，只好拆成了两个部分。


    **第一大窍门：**一定要把规律和大趋势放在最前面。借什么力量都不如借势，违背什么都不能与大势为敌。这就是中国古人说的“不谋全局者不足以谋一域”，西哲说的“理性是在正确认识全局基础上采取适当的行动”。必须先正确认识全局，延伸到房地产上来就是“不知城市化，休谈房地产”。


    人口会怎么流动，什么样的人集中到什么区域生产生生活，这个战略大趋势性命攸关。千万不能照搬过去工业化带动城市化的经验了。所有的历史都不会在未来重复。


    这个战略问题比战术重要一万倍！如果你有志于楼市投资，你要远离这些人、远离这些声音：追求购房技巧，沉迷于月/季等短期数据分析，波波于供需比、租售比、房价收入比，把楼市当股市，把工业不景气直接和楼市挂钩，用股市短期炒作思维思考房地产，不用投资眼光来看房地产而一味注重自己眼前内部使用得“宽敞舒服”，或者一味轻视使用的时空便捷性而只考虑将来转手给别人，重视政府的工业规划而轻视城市化与服务业的自身规律与发展。等等，都要离得远远的。


    要紧紧咬定服务业主导的城市化规律和趋势——越来越收缩、越来越集中不放松，不动摇！


    一定要强调理性思维全局视野，战术要一发千钧，战略要八风不动。


    **第二大窍门：**不要沮丧于眼前或过去的不涨，不要沉醉于眼前的大涨。很多人只会追概念追风口，房地产是长周期产品，一定要以价值投资的保守方法来做，不要当成短期炒作的眼球经济。买房正式下单前（尤其是未成熟区域的一手房）'
  merge: -1
  img_proc: true
- pgno: 28
  md: '一定要仔细想一想：**将来你这个房子谁最有可能来住。房子归根结底一定要有人来住，最终谁来住？这个决定了房子的最终价值。**


    **第三大窍门**: 投资房地产绝对不能搞“民主决策”，绝对不能到处去征求亲戚朋友的意见和建议。否则你一定会“混然众人矣”，什么正确的决策也做不成。庸众总是大多数，否则世界上的财富就不会从占到目前只掌握在少数人手里。要问，就去多问专业人士和这方面的成功人士，学习他们的方法。要舍得独立思考的时间，要舍得跟专业人士学习、请教的金钱。越廉价的民主意见往往越没有营养，甚至是有害的三聚氰胺。


    **第四大窍门**：一定要有志于做少数派，坚决不要跟风，不追风头。众里寻他千百度，蓦然回首，那人却在，灯火阑珊处！最有价值的地方，往往就在不为多数人追逐和注意的地方。


    分答上有人问我：“看过您的全部博客。一直在想：如果人们都理解、认同、实施您的理论和观点，中国应该是一怎样？您能简单描述一下吗？”


    我说：“这个问题非常有意思。我想回答的是，不可能人人都理解、认同、实施我的理论和观点。如果人人都理解、认同、实施我的理论和观点的话，那么我说，中国很快就崩盘了。就像一艘船，大家都往船头跑，这个船肯定很快倾覆。它是怎么倾覆的呢？大家都往大城市跑，大城市房价肯定因为瞬间涨得非常高而崩盘，中小城市则因为人口迅速离开而崩盘。一个社会总是只有少数人站在更前面地看清时代的潮流和方向，这个过程，也决定了财富总是掌握在少数人手里。”


    **第五大窍门**: 删繁就简，弱水三千我只取一瓢饮。投资是人生最深刻的修行，首先要养成一个正确的心态，就是：世界那么大，我只能去一步一步够自己够得着的东西。就像卢亭宫失火那个隐喻：如果失火了，你只能抢救一幅画，你会救哪个？正确的方法不是救最值钱的那一个，而是救离自己最近的那一个。


    房地产投资也一样。很多人钱不多（其实对于投资人来说，钱永远是不够的），心却很大。心大在哪里？大在总够上最好的，总想够上涨幅最高的。结果就是到处看，不管是在全国范围还是城市内部，都到处看。把选房最重要的战略'
  merge: -1
