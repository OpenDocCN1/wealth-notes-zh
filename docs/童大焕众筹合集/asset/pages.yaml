    # ## 有一种借钱千秋万代不用还（学员独家 注意保存和保密）


    严重声明，本人绝不是在宣扬一种不负责任的无赖文化，而是在努力发现并且倡导全局理性、多方共赢并让当事人从速抵达财务自由彼岸的投资哲学。


    如果说货币是人类最伟大的发明，那么金融则是仅次于货币的另一个伟大发明。在金融按揭和信用消费制度发明之前，人只能花过去已经挣到的钱，所以量入为出省吃俭用是莫大美德；在金融按揭和信用消费制度发明之后，人可以提前安排一生的预期收入，早早地过上了更优越的生活，并且负责任的人会更加努力地工作和创造。


    金融按揭和信用消费制度的发明也有一个微小的副作用，就是把全人类都带进了一个微通胀的时代。在这种情况下，不擅于、不敢于向未来、向银行借钱的人，不管你工资多少身居何位，都会像吴晓波说的是个屌丝，活该穷命，即使这辈子不穷，不良思维传承给下一代也可能会变穷，“从家庭财务的角度说，屌丝的标配与他从事的职业其实没有关系，而在于两个指标：第一，屌丝只有职务性收入，甚少财产性收入；第二，屌丝的银行负债率为零。”


