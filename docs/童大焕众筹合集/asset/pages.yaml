    # ## 如何发现楼市价格洼地


    （学员独家 注意保存和保密） 童大焕—2016年 3 月 5 日星期六


    咱们先从一个新学员、一个私人订制客户的问题谈起。


    **2016 年 03 月 03 日 14:31，有新学员问：**


    > “童老师，我在读课件 9《多数人没有充分发挥自己能量》（大焕注：浙江王子民先生案例）的例子时，上链家网查了大家武林府的现在的二手房报价，发现同一小区的房子单价差得比较大，低的
    3 万 9，高的 5 万多，不太明白，为什么同一小区的房价差这么多？查到文章里的学员去年买的那套种 117 平的房子，现在报价是 485 万。学员去年买的是
    530 万，是房子的装修配置不同呢？还是朝向不同呢？因我近期也打算买杭州或苏州的房子，所以比较关注。”


    **童大焕现在回答：**


    > “当时王先生面临着两种选择：1 是有燃气管道的 117 平米 570 万（就是后来谈到 530 万的这套），朝小区内侧，较安静。在整幢楼里的位置是最好的，房主把所有家具家电都赠送，据说价值
    30 万；2 是无燃气管道的 133 平米 550 万（价格已到位），还有抵押贷款，靠高架有噪音，也有风水禁忌路冲。不同单元也不同，1 单元有燃气管道，挂出来卖的不多，就三四套；2
    单元无燃气管道，挂出来就有十多套。中介说武林府 5 号楼是酒店式公寓，没有阳台，许多人不喜欢，卖房成交量很少。这套房子是 2015-8-2 成交的，我的判断是当时王先生已抄底。”


