  md: '一书时即已预警：“高密度大城市化”具有“拯救中国”的战略意义。小城镇大跃进未来给中国社会造成的损失和浪费，可能远大于计划经济时代的“大三线”、“小三线”建设。2011
    年初，上届政府出台史上最严楼市限购限贷政策，笔者当即将于 2011 年 2 月 11 日在 FT 中文网撰文《限购恐将催生三四线城市房价》，文章写道：“人往何处去？钱往何处去？始终是我们首先要关注的时代背景性问题。即使户籍控制、上学和高考歧视都阻挡不了千军万马奔向大中城市的脚步，严厉的住房限购政策同样改变不了人口的流向，但它却可能极大地改变大中城市出租屋的供应结构，像北京上海这样的一线城市，每年净增加外来人口高达
    60 万以上，在限购政策下，这些人全部必须租居住房，如果二套房以上的购房被严厉限制，房租的飙升至不言而喻。同时，社会上充足的流动性资金仍然在一刻不停地寻找投资渠道。原本城市化速度较快、也是房价较高的全国
    72 座城市如果都实行严厉限购政策，那么意味着市场的需求和价格信号被行政手段所屏蔽，将会带来另一个巨大的弊端，就是助长三四线城市房价泡沫，使自然的城市化需求并不充足的三四线城市，一定程度上有可能成为资金追逐的热点。而这些城市的楼盘规模总体较小，不需要多大的资金量就可以推高房价；推高的房价进一步刺激资金进入，形成不符合市场要求的真实泡沫。市场信号一旦被非市场力量屏蔽，其可能造成的社会矛盾和国民损失，相比于遵从真实的价值规律——哪怕是残酷的非常高而言，从个人到社会到自然界（比如宝贵的土地上建的是烂尾楼），为此付出的代价要高昂得多。”


    市场规律一定会作为社会的最后结算力量出现。如果政策不符合规律，那就是报复性结算，结果就是楼市停滞甚至降价。至于这一天何时到来，任何经济学家都很难准确预测。但我认为，这一天于
    2014 年春节后正式到来了，最重要的标志还不是杭州和广州郊区房价下跌，而是三四线城市楼市成交量不断下跌，以及从 2012 年底开始，大发疯商、包括一向以三四线城市为主战场的恒大集团纷纷从小城市逃离，到一线城市寻找避风港，导致一线城市一年多地王频出。从
    2011 年 2 月 11 日我在 FT 中文网发表专题文章，到 2012 年底大发商开始撤离三四线城市，仅仅经过了两年零十个月时间。


    杭州和广州远郊区在 2014 年春的房价大跌，是在没有任何行政调控加码的情况下发生的，可以被视为市场力量开始翻转行政力量的标志性事件。杭州此番降价楼盘为桥西板块的德信北海公园和天鹅香榭里，降幅约
    20%。区域供给过高、竞争激烈以及开发商资金链紧张是事件本质原因。广州降价楼盘也在郊区。说明除了一些小城镇大跃进导致空城、鬼城层出不穷之外，一线城市郊区供应过量的风险同样存在。它意味着中国内地房地产十几年来几乎只涨不跌、土地金矿、遍地黄金的时代一去不复返了！接下来，不论是购房者、开发商还是各级政府，都必须把市场规律当财神供着，才能使自己立于不败之地。


    回头看肇始于 2011 年初的限购和限贷政策，它没有改变楼市的走向，但在短期内改变了楼市的部分预期（尤其是大中城市郊区），给了人们极好的入市时机。期间我动员了几个研究生刚毕业不久的朋友在北京入市买房，短短两年多时间从无所有变成了净资产增值百万元以上的百万富翁。限购限贷还加快了三四线城市房屋供应量见顶，加快了市场觉醒和市场清算的步伐。'
