  md: '所变化（例如货币收紧等政策变化），投资者的风险偏好程度也会转变。回顾历史上每一次泡沫的产生和破灭基本都是这样的一个过程。


    中国的一线城市房价是有人口流入等基本面因素的支撑，但美国、日本当年房价大跌之前也是有各种基本面支撑才上涨的，所以关键的问题是基本面能否支撑如此高的价格。当前一线城市楼市一片火爆，购房者挤破了头还买不到房，但与此同时租金上涨速度却远远慢于房价上涨，房租比大幅飙升，而房屋空置率也居高不下。中国一线城市人口流入速度已经大幅放缓，而一但像之前的创业板一样，加杠杆成为房价上涨的“故事”，地产市场就危险了。


    # 4.2 政策的选择：日本 VS 俄罗斯模式


    如果一个国家的房价永远暴涨，理论上最终可以把全世界买下来，但这显然是荒谬的。


    货币超发导致房价暴涨后有两种结果，一种是日本模式。日本80年代末货币超发，经济增速却在放缓，但由于日本央行的干预，日元还是升值的，导致的结果是日本房地产资产被严重高估。85-90年间，东京土地价格上涨了
    156%， 日元对美元升值 90% ，也就是说东京土地的美元价值上涨了 246% ，被严重高估，势必要向市场均衡回归。


    而向市场回归有两种途径，一是日元对外贬值，二是紧缩货币使资产的本来价格下降。迫于通胀和贬值压力，日本央行选择大幅提高利率、紧缩货币供给，保证日元汇率的基本稳定，但最终导致股市和楼市泡沫的相继破灭。


    另一种是俄罗斯模式。2008年前，俄罗斯也面临货币超发的问题，M2 和名义GDP 增速之间的差距最高达 40 个百分点。过剩的流动性也导致俄罗斯楼市大涨，2004-2008年俄罗斯平均二手公寓价格上涨了
    267% ，期间卢布对美元汇率升值了 14% ，资产价格也存在着高估的风险。


    但俄罗斯选择了让汇率贬值，08-09年卢布对美元贬值幅度最高达 34% ，之后卢布对美元又大幅贬值，继续释放风险。俄罗斯房价在经历了暴涨后却保持了稳定，没有出现崩盘现象，但是汇率却是一贬再贬。'
