    # 未来有两大趋势一定要注意：


    一大趋势是：中国人 50%以上的财富将会集中到一线城市，因此大城市的房价会超乎想象。我现在都无法想像它是多少。为什么？因为 50%以上的大学毕业生和年轻就业者（而且比例会越来越高）将到这些地方工作生活，其中只要稍有条件的都会倾全家几代人所有，在这些地方购房置业。


    与此同时，先知先觉的投资者也会把几乎所有资产置换到一线城市核心地区来。


    第二大趋势是：所有的城市，不论几线，都已经进入全面收缩时代。1998 年开始，十几年时间里城市土地扩张 3 倍于人口扩张的时代一去不复返了。哪怕是一线城市这样过去多年一直限制供应中心城区用地的地区，在经历了多年把人口往外赶的历史运动之后，人口还是将慢慢地回流到市中心。新增人口同样无法忍受漫长的城市和远郊之间的上下班距离，他们宁愿群租也不一定忍受得了远郊的长途奔波，把大好的社交和提升自己的时间，浪费到没有尽头的日夜奔波上。


    前几天回福建长汀老家，问公安局的朋友一个问题：县城有多少人口？答曰：25 万！这就是我们那个全县只有 54 万人的农业县！它的青壮年大部分已经离开本县到外地就业了。另一位教师补充：全县
    51%以上的中小学生，都在城里上学了！这样的县城，几公里外的工业园前几年曾经小有辉煌过一阵，如今只有两家工厂还在勉力维持了。晚上，住宅区只有少量一两座楼鬼火似地亮着几盏灯——曾经辉煌的，也在迅速黯淡下去。


    面对一线、环一线和强二线城市的房价暴涨，政府当然会很担忧，因为暴涨得越快崩盘也越快。但是他们只要稍有理智，就再也不敢像过去一样，打摆子抽风似地启动骤冷骤热的强力打压措施了。因为此轮泡沫已经迅速吹大，房地产根本经不起很大的风浪。这就是为什么上海传闻要提高首付，导致民政局只能通过每天限号
    50 人来应对离婚潮（他们不是限制离婚，而是人手不够），但是很快'
