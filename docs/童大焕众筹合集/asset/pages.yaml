  md: '**答：不限购的房子主要有三大缺点，一是银行杠杆率低，最高 5 成贷款，最长 10 年。如果换成住宅，同等月供和首付能够扛起更大的资产；二是不限购的房子二手税费更复杂，通常有可能税费更高一些；三是不限购的商住尤其是写字楼项目，弹性比限购的住宅更大，住宅刚性更强，也就是同一套房子，住宅容纳的人更少，写字楼项目一般要集中在城市核心区才有人气。**


    **好地段的房屋，不论住宅还是商住、写字楼，租金都明显高于次好或不好地段地房屋。同等地段的房屋，用于办公租金一般优于用于住宅——包括高端住宅。因此不限购的房屋往往因为地段、可注册等原因，有可能获得较高租金。**


    如果全面取消房产限购，那时目前限购和不限购的房子，还会有什么区别？


    +   6  **买房第一要紧是地段。** 在地段有保证的基础上，类似品质和年代的房子，它的上涨也是波浪起伏的，我们在弟子群里已经讨论过多次。因此，在同等地段同类房源，找价格比较低的入手，就算是抄到底了。


    +   7  **上面原则着眼于做强资产。** 在选择好上述地段、房源前提下，用足月供和杠杆，做大资产是第一要务；如果房屋用于出租，要把租金也算入月供能力。


    +   8  **基于做强做大资产的目的，** 首选当然是住宅，杠杆更高，贷款年限也更长。商住和写字楼是在被限购等前提下才买。商铺绝对不要碰，风险太大。这个我们也已经多次强调和讨论过。最近和风格纯粹的讨论也再次说到过。写字楼也只有一二线城市商务中心的才有价值。


    我一直强调做强做大资产，做强和做大不是同义反复，是完全不同的概念。就像商务和商业是完全不同的概念一样。


    做强的基础上做大才有意义，我另一个强调的方法就是：（关于区域和地段方面的）战略选择才是至关重要生死攸关的，用足月供和杠杆是战术选择雕虫小技。战略不对，战术会加倍害人害己。


    就是选对房子再加杠杆才意义，不然就是反作用，亏得更多。


    +   9  **四可原则：** 可自住、可出租、可卖、可贷款。童大焕和弟子谢晋文共同总结的智慧结晶。四者缺一不可。


    +   10  **租金原则。** 同等地段同等价位和年代的房子，哪里租金高就选哪里'
