  md: '现在切入正题：什么是城市生态理论？为什么同地段价位差别很大的不同房子涨幅会差不多？


    很多人以为同一类地段房子就是同一类价格，甚至想当然地以为这个是中产社区，那个是富人社区，还有那个是贫民社区，以为这样的分割才是理想社区和理想社会。这其实是对城市的割裂，也是对城市生态系统和城市自然活力的极大破坏。


    我的城市生态理论认为：城市就像自然界的生态系统一样，各种“物种”（此处表现为不同“收入阶层”的人）彼此之间是你中有我、我中有你，密不可分的。在同一个区域系统里，你为我服务，我为你服务，适度的区隔，同时又彼此合作与联系，才会形成互惠互利的高效的互系统，才是最舒适的同时又最高效的、最有利于社会阶层之间变动的合理生态系统。就像有参天大树，也有低矮的灌木丛，还有小花小草；有孤独的需要占据大片“领地”的猎食动物，也有各种各样的微生物。它们各安其位，各得其所。


    而房价的涨跌，是在城市化背景下进行的，像大陆板块的漂移和地壳运动的隆起或陷落。城市化是社会层面的地壳运动，隆起或陷落都会表现得非常剧烈。相应的版块（地段），就像一艘汪洋大海中的巨船——整体的漂移，或整体的随着海平面隆起或陷落。不管这艘船是怎样漂移，怎样隆起或陷落，其内部的生态基本不变——在什么层面生活的还在什么层面生活，什么样的房子吸引着相应层级相应收入的人进入或退出。


    明白了这一点，在进行房产投资时就完全不必纠结于哪个便宜哪个贵，为什么同一地段一街、一路之隔，房价会差那么多？它们之间最终会不会价格一样？ 这些问题都不必思考。而应该思考更庞大的问题：这个城市板块的未来，是整体衰落，还是整体上升甚至迅速崛起？换句话说，应该把
    90%以上的时间和精力， 用来进行城市区域和地段的选择。选对了区域和地段，喜欢哪一类型的房子，就买哪一类型的房子，同时在月供和首付许可条件下，把资产做到最大就对了！


    在选择区域和地段时，要明白：楼市涨跌两大基础一是人聚财聚人散财散， 二是货币增发。就像海平面的上升和降落一样。


    同样的货币增发，为什么不是同样地作用于所有城市，而是照样层出不穷地出现鬼城空城？那是因为不管国家层面货币再怎么增发，人口流出的地方，也仍'
  merge: -1
  img_proc: true
- pgno: 205
  md: '然是货币流出的地方！因此，支撑整个区域和板块城市房价这艘大船的城市“海平面”和“地壳”的升降，最终只取决于一个变量——人口增减！


    **如何找对地段，如何判断哪里的人口会增减？如果判断哪些的城市板块会上升？请按照下面的规律来思考：**


    **第一，**是城市的发展跟资源没有关系，甚至会出现资源越丰富发展越落后的“资源的诅咒”。但是城市发展跟地理和气候关系影响巨大，对中国来说有一条著名的“胡焕庸线”，中国西部地区不适合人类大规模生存。


    **第二，**当代中国城市化的4 个大方向，也就是人口流动的四大方向。这 4 个大方向是由于产业集聚和效率的要求自然形成的，不以任何人的意志为转移。


    第 1 个大方向，中国中部、东北、西部人口几乎全部都是一江春水向东流，向东部城市集中，尤其是跨省流动人口 88% 向北京，长三角的上海、浙江、江苏，珠三角的广东，以及福建
    6 大省市集中。


    第 2 个大方向，是在中国东部城市，人口也向少数城市集中。每年流入北、上、广、深四座城市的大学生，占全国大学毕业生总数的一半以上。全国每年流入这四座城市的人口总数，超过每年从农村进入城市的人口总数。


    第 3 个大方向，不管是西部，中部，东北还是东部地区，人口和产业总体上都越来越向一两座城市集中。越落后的地区，向省会城市集中的趋势越明显。


    第 4 个大方向，在城市的内部，比如北、上、广、深城市内部，人口和产业也在加速分化和向少数区域集中。


    **第三，**互联网和现代交通对城市化的影响。因为人们一直在憧憬：互联网和交通越来越发达，我们是不是可以不出家门就全人类共享城市化的成果？是不是因此可以天天与山水、自然为伍就好了？有人问：随着服务业技术进步（如无人驾驶，空中配送，远程医疗，虚拟现实等），会不会出现另一种反转：人类大规模聚集的理由弱化甚至消失。从而大城市扁平化农村城市化？这个问题，1990
    年代互联网兴起时人们就提出来了，当时有一种思潮认为，随着信息扁平化，城市变得没有意义和价值了。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '这 20 多年来世界城市化发展历史，以及我们思考得出的城市化理论都告诉我们：答案是否定的。互联网和交通一体化，使城市和人口更集中了，而不是更分散了。为什么？


    因为城市发展、人口集中使人更自由，更安全，更有尊严，选择和自我发展的机会更多。经济效率的逻辑，集中有利于安全的逻辑，集中有利于产业分工和增加就业机会的逻辑，见面的情感需求的逻辑，创新需要智慧碰撞的密度和浓度的逻辑，见面更有利于建立信任与合作的逻辑，越有钱、越有创造力的人越来越忙、时间越来越宝贵的逻辑，都会使人类越来越聚集，使城市越来越陡峭。使城乡之间、城市之间、城市区域内部的分化与落差越来越大。


    **第四，现代城市的生死逻辑已经发生颠覆性革命，一夜之间从工业逻辑完全进化到服务业逻辑。**


    工业革命之前，人类几千上万年的农业时代，漫漫如长夜，只在基本的温饱线上挣扎，城市化率也一直停留在 3%上下。人均 GDP 从公元零年到 1800 年，只增长了
    50%。


    工业革命给人类带来了光明，短短 180 年时间，地球上城市化率由 3%迅速提高到 50% 以上。人均 GDP 则在 180 年时间里增长 8 倍。


    可以这么说，过去两百年和中国过去 18 年的城市化历史，都是工业推动的历史。工业带来了人口聚集，但同时工业带动的聚集是有限聚集。因为工业时代对低成本的追逐，城市化的方向一定是向外拓展（比如最近华为制造业务基地由深圳迁东莞）。


    但是现在已经出现了一个崭新的情况，就是工业化进入无就业甚至负就业增长时代！因为智能机器人大规模取代人工的时代开始了。前不久富士康江苏昆山的工厂一下子裁员 6
    万人，由 11 万人迅速减到了 5 万工人。美国也因此出现制造业回流趋势。


    花旗银行和牛津大学预测，中国 77% 的工作都有被机器人代替的可能。那么，不久的将来，工业和农业容纳的就业人口不到 10%，剩下的人口只能从事服务业，而服务业主导的城市化逻辑，就是人口越集中越好！'
