    这样一来，主流居住人群从 155 位经常不在的老派富翁变成了 1500 位左右的常住高级白领，冷冷清清变成了人气十足。这里是诗意栖居的地方，是成长的地方，是恋爱的地方！它可能成为美女和王小五的集中营，还有可能是新思想新观念碰撞的集中营。


    房屋均价也可以从 12 万升级到 15 万元，每平方米的价值回报增加 3 万元，以 30000 平米估算，可以增加 9 亿元营收。


    所以，准确的定位很重要。准确的人群和户型定位，可以给项目带来巨大的附加值。当然，这个定位是否合理，需要市场检验；也希望同学们一起来探讨。


