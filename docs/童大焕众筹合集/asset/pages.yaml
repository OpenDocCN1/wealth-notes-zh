    # 附 1：我为什么不研究学区房？


    # 童大焕—2015 年 4 月 8 日星期三


    有人问：童，有没有这样问过你：你那么懂投资房地产，为什么你自己不狂妄买突闷声发大财，就好比有人问股票分析师，你这么牛逼和靠谱的话，自己直接买股票不是赚的更多更快吗？


    我回答他说：问得好！1 巴菲特那么会赚钱，为什么不闷声发大财而要去谈股市？2 个人的钱总是有限的，天下谁能不断买房不止且年年都买？况且我已经被限购了，卖了就买不回来。3
    独乐乐不如众乐乐，闷声发财之乐不如指导人一起发财之乐。我曾于 2014 年启动免费的贫民窟百万富翁计划，心想整它两百万个案例也像尤纳斯一样申请个诺贝尔和平奖，奈何
    8 个案例只有 1 个人付诸行动，所以现在只做个有偿服务且收费不菲，倒回头来实践耶克“商业是最大的公益”理论。'
