  md: '“战争，疾病和自然灾害是大规模消灭人口的三大途径，以前的人类社会就是通过以上三种手段来达到人和土地之间的生态平衡。但是到了现代，和平是世界运行的常态；随着医疗科技的高速进步，人的寿命越来越长。随着人类预测和应对自然灾害的能力和手段越来越强大，自然灾害带给人类的伤害，特别是死亡率，已经越来越小，现在更多的是经济损失。


    “这就是房地产增长的基本面。土地资源，特别是适宜居住的土地资源，将一直是稀缺并且不断减少的存量资源。不断增长的人口和无法增长的土地之间的矛盾，人类不断增长的欲望和无法增长的土地之间的矛盾是绝对的，科技的发展不仅不会缓解这个矛盾，反而会加剧这个矛盾，直至宇宙大航海时代来临。”


    这个归因有问题吗？好像一点问题都没有——人口不断增长，但是土地不能再生。潜意识的结论是：只要是宜居的土地，都会不断升值。这也是作者最后结论的基础——与其 80万在悉尼买房，不如同样的钱，在位于悉尼以西
    104 公里处的蓝山(Blue Mountains)买地或者带大地的房子（类似别墅），而在悉尼租房。40年后在蓝山买地的投资回报可能要远远高于在悉尼买房，即使后者的涨幅没有超过悉尼。原理何在？因为悉尼买房地价只占三成（假定），而蓝山的地则是90%乃至
    100%是地价。


    问题出在哪里？问题出在几个大方面：


    +   1. 历史上人口和土地的矛盾，是居住用地不够的矛盾还是土地食物产出不够的矛盾？事实上是后者！但是随着种植业和养殖业都告别传统靠天吃饭的农业逻辑，理论上可以24小时生产，这个矛盾已大大缓解而且理论上食物生产能力几乎无穷无尽。还有，就是人类的食物在不断丰富，未来的工业化生产绝非没有可能。


    +   2. 人口增长和居住用地有矛盾吗？在生产用地短缺的时候有矛盾，农村邻里之间为了一堵墙闹出人命的也不少见。但现在，一些种植业养殖业粮食生产可以楼房式
    24 小时生产；同时人们的居住方式也在改变，可以向高处生长。电梯改变一切。农业时代居住容积率（建筑面积和占地面积之比）低于 1，现在高于 20也不在话下。'
