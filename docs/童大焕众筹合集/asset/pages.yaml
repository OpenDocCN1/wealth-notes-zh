    平方米的民宅，售价却高达 340 万元。因为，附近有一所被认为是“北京最好的小学”之一的实验二小。（2014 年）6 月以来，记者走访北京一些重点小学附近的二手房市场，发现尽管中国楼市整体趋冷，但被称作“学区房”的“特种房”价格，却城市疯涨。采访中记者发现，由于离实验二小很近，文昌胡同一带的房源价格普遍都在
    15 万元/平方米以上，这一房价无疑将挤入北京最贵的房源行列，这一价格几乎超出了北京所有最高端的一手楼盘的售价，钓鱼台七号院、霞公府、'
