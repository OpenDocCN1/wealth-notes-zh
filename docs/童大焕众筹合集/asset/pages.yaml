    5 万涨 1 倍到 10 万，和 7 万涨一倍到 14 万，涨幅其实一样，但绝对值在拉大，从 2 万到 4 万，有可能会感觉 14 万那个涨得快。


    现在回头比较华清嘉园和 CBD 区域（以蓝堡为例）。


    华清是典型的优质学区房，它的特点是即使遭遇经济周期和银行紧缩，价格仍然平稳甚至微涨，因为上学是刚需。弱点是租金相对较低，哪怕用于办公也只出租蓝堡这个纯住宅的价。因为租户是北大清华等高校初创业的牛犊们，相对低端。而
    CBD 则聚集了大量跨国公司高管们。'
