    # 财无恒富而智慧永存（16 种投资工具比较）


    很多人投资理财，以为自己只要账面上的钱没有减少就是平了，有了增加就是赚钱了，这其实是一个天大的误解。现在是一个全球性通胀时代，中国未来相当长时期内将处在我文章《泡沫是消化泡沫的唯一办法》里的那种状态，长期保持
    14% 上下的 M2 增量。如果投资增值赶不过 M2 增量，实际上就是净亏损。以 M2 增量 13% 计，如果 100 万元保持不动，第 20 年的平均购买率就相当于今天的
    6 万元。所以，通胀对财富的侵蚀程度是非常厉害的。温水煮青蛙。'
