    # 中国楼市已不再有捡漏机会（学员独家 注意保存和保密）


    重要的观点要一再重复：2014 年起，中国的城市化进入市场主导的自我收缩时代！政府主导的大肆扩张时代一去不复返了！不论大中小城市，基本上都是如此。都已进入总体上自我收缩的时代！


    从写下这个标题一直到真正动笔，时间间隔近一个半月。促使我尽快动笔的， 是有人转了一篇代理香河某项目的某房地产代理公司首席分析师 2015 年 9 月 14
    日发在网上的一篇文章，《为什么出租回报率高的房子不会涨价，而出租回报率低的房子才会涨价？》，文章说：


    “我们知道，决定房子价值的因素就是房子周边的公共配套资源，主要包括地铁，公交，幼儿园，学校，医院，公园，超市，饭店，商场等等公共资源，房子的价值就是这些公共配套资源的价值总和，当房子周边的公共配套资源越多，
    房子的价值就越高，反之正好相反。就北京市来说，由于优质的公共配套资源过分的集中在城市中心区域，所以中心区域的房价要远远高于郊区，但是随着一些局部热点区域的崛起，比如中关村的教育和
    IT 优势就让中关村的房价完全和市区接近。


    “因此，房价就包含了两种收益属性：一种是房子周边已经拥有的配套资源（存量配套），我们通常叫做居住属性；另一种是房子周边未来会拥有的配套资'
