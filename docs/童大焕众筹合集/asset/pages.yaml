    5040 元，扣除租金 1500 元左右，需要月供 3500 元。（后来由于月供能力所限，调整到贷款 70 万元左右。）具体地点燕郊成熟区域二手房，即买即租。四个理由：


    +   - 一是燕郊是北京被限购溢出人口的唯一正确出口，从投资角度看，区域价值超过一些弱二线省会城市。


    +   - 二是燕郊一些房子可以做到高评，也就是一些价位合适的房子银行评估价适当超出购买价。【一些首付能力较低的购房者可以够得上】


