    # 10、牢牢记住中国城市化和房地产的两个时间节点：


    1998 年城市住房私有化开启，没有城市户口和正式单位的人终于可以在城市买房了。意味着当代中国自 1949 年以来被人为阻止的城市化正式开启。从此，中国进入城市化大规模扩张的时代。这个时代的特征是，政府主导，城市面积以
    3 倍于城市人口增长的速度迅速扩张，短短十几年时间，新增建筑面积超过过去 3 千年中国留存的建筑面积总和。房地产迅速进入整体过剩局部短缺时代。


    2014 年开始，城市化进入市场主导、自我收缩的下半场。在服务业主导城市发展的背景下，人口急剧向东部中心城市和城市中心集中。正如我在 2014 年 1 月
    27 日文章所揭示的《边过剩边短缺将长期困扰中国房地产》：“中国的房地产已经面临严重过剩和严重短缺同时并存的局面：一是农村和一些小城镇房屋严重过剩，二是大中城市房屋严重短缺。”


    短缺的地方将更加短缺，过剩的地方将更加过剩。市场集中趋势越来越明显。市场集中逻辑逐步战胜政府扩张逻辑。


    这样的背景下，不论是对于初次购房者还是升级换代的楼市投资者，都不要轻易做“这个地方房价很高了，另一个地方是不是会追上来”的美梦！


    此时，全国范围内有楼市投资价值的城市越来越少。它们基本包括 3 大类：三大都市圈以及个别环都市圈的城市，即使都市圈内目前仍然限购的北京、上海、深圳、广州，也并非所有房子都有投资价值，因为内部也在分化，内部差距也在拉大；中部省会城市中心地段；东部尤其是江浙福建一带一些小县城中心区，但这些区域基本上只和回流人口有关。除此之外的城市，包括东北和西部省会城市，都要小心谨慎为妙。


    以北京为例。价值排序依次是：北京高价值住宅>北京高价值商住（含写字楼）>环京高价值住宅>北京低价值商住>北京低价值住宅>环京低价值住宅。大家使劲想。地段决定一切。北京低价值商住通常也比北京低价值住宅好，多因太远处一'
