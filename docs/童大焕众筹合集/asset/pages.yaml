    这种文章很有欺骗性，但其标题所揭示的结论却是彻头彻尾的一个大错误！


    首先，决定地段房价未来的，配套只是次要因素，根本因素是就业以及和就业集中地之间人能够承受的时间距离！没有就业，再好的配套都只会造鬼城空城。不论是农业时代的散居生活方式，还是计划经济下工业时代的企业办社会，居住、生活都是紧紧围绕着就业来进行的。城市化、服务业时代，居住紧紧围绕着就业、配套紧紧围绕着居住，这个规律不会轻易改变。除非一些特殊的旅游、养老地产。'
