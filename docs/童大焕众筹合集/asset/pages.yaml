  md: '赵： “宁为虫中龙，不做龙中虫”，我老爸当年把可以去省重点垫底的我送到了普中，老师校工都宠着。


    吴： 家长的理性判断和抉择将决定孩子在学校的自信和学习兴趣。名校有品牌效应，资源会因马太效应向其集中，不管是资金，师资，生源，都如此。孩子自身能力相匹配学校的教育方式，孩子自然能如鱼得水。所以孩子的适应能力很重要。


