    农业人口在迅速衰减，传统制造业人口在迅速衰减！而人是一切的出发点和归宿，从土地和工业流水线上解放出来的人们会去哪里？他们只有一条道路：不是在现代超级大都市，就是在奔向现代超级大都市的康庄大道上！


    童大焕—2016 年 6 月 11 日星期六


    大多数人的观念都远远落后于时代和技术的发展。缺乏自由、有效思想竞争的时代和地区，这种落后尤其触目惊心。


    城市也像生命体一样有生有死，现代城市的生死逻辑已经发生颠覆性革命，一夜之间从工业逻辑完全进化到服务业逻辑。但在中国大陆，从庙堂到草野，从知识份子到普通百姓，从决策者到房地产开发商，对城市化的思维
    99.99%停留在工农业时代。我估计，全国范围内，有正确的现代城市化思维的人不会超过 10 万人。


    城市化从来都只是一个结果，是科技进步改变了人类的生产方式，进而带来人类组织方式和生活方式的革命。城市化的本质就是集聚对产业和创新的效率提高，因集聚而富有创造力，因集聚而使社会分工越来越细越来越复杂，因集聚而使人类生存空间越来越大。越集聚，成本和能耗越低，效率越高，时间的利用价值越大。无数的旧行业在死去，无数的新行业在新生。无数的城市在死去，少量的城市在加速度高密度集聚。不久的将来，大部分人类只集中生活在
    1.5%左右的地球空间，将不是天方夜谭。人与地球、与环境，从此进入从未有过的全面和解时代。


    工业革命之前，人类几千万年的农业时代，漫漫如长夜，只在基本的温饱线上挣扎，城市化率也一直停留在 3%上下。人均 GDP 从公元零年到 1800 年，只增长了
    50%。'
