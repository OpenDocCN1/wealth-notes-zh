  md: '就像动物园服装批发市场强制搬迁河北一样，这未必是河北繁荣的开始，更可能是市场衰落的先声。同样，国家部委所属科研机构和大学搬迁保定，也未必是保定繁荣的前兆，而有可能是这些科研机构和大学衰落的先声。


    以往，政府每一个规划出台或者仅仅只是“放风”就带来房价的大涨。但是2014 年，情况开始发生改变，市场力量开始翻转行政力量成为主导性力量，供应过量的三四线城市鬼城空城风险陡增，一线城市则照样稳涨不跌。市场的总结算功能一点也不买政府和领导的面子，一点也不相信政府会有一双双“点土成金”
    的手。


    今天一早有人问我：北京政治副中心初定保定，保定房价会不会涨过燕郊？ 我答：“不一定。第一，多少年才能成？第二，保定那么远；第三，万一将来不再是大政府呢。市场化要求，会不会像澳大利亚一样，把首都设在悉尼墨尔本之间乌不拉康的堪培拉，怎么发展都是
    30 万人口。而悉尼是 700 万，墨尔本是 300 多万。还请谨守保守投资哲学。”我现在要更加肯定地回答，即使规划落地，那边的房价涨不过燕郊。即使短期因非理性预期而暴涨，最终也难以为继甚至要掉头下来。所以，信规律不信规划，信市场不信市长，这个要牢牢记心上。当然，
    除非你有绝世神功，总能够在最低时入市，差不多最高位时就金蝉脱壳逃之夭夭而不会被退潮时套牢。有那么大本事，那真是妖。


    我手机里至今保存着一个微信对话，2014 年 3 月 26 日 10: 16，一位住在新加坡的朋友问：“童，保定的房可买吗？我想买。”10: 22 我回了她三个字：“不可以”，连解释都不带解释的。她答：“哦，知道了！”送一个拥抱和咖啡。瞧，权力的力量有多大，消息都传到遥远的新加坡了！我的知识的品牌和声音有多小，声嘶力竭也未必有多少人听。


    但是我却很自信很自豪地说：正确掌握全局和规律的真知具备超越金钱和权力的力量，金钱和权力不久远，只有知识能够永久留存。


    没有正确的知识，万贯家财一个决定就有可能败光。没有正确的知识，你哪怕 “无为而治”只存钱不做任何投资，现代通胀型社会的货币资产也会像冰块'
