    220 亿美元在美国买房，环比增长 72%，超过所有外国客户群体。

    但 2015 年 1 月 5 日和讯房产消息说，赴美购房 7 成人是亏的！


    在美国炒房的成本很高。首先，地产商在确认购房者本人入住后，才会办理产权出售手续。业主入住一段时间后才可以出租或再卖，一般是一年两年。而且，购房之后不允许让房屋空置，否则业主会被要求缴纳费用雇用公司管理。如果把房子委托给当地房地产管理公司出租，还要被收取至少
    3%的租金手续费。

    某移民投资公司总经理总结认为：“到美国买楼的中国人，应该说赚的少，亏的多，七成亏了。"


    在美国买房必须请律师。有统计称，交易时，购房者需缴纳一次性的房产交易税、律师费、产权保险费、房屋估价费、房屋检查费和登记费等，一般累计占房价的3%至 5%。


    买房便宜养房难。美国真正恐怖的还是后续的房产税、房屋保险等一系列费用。有人形容这是无底洞。例如仅仅一套 30 万美元的房屋，每年要缴税 4000 美元左右，管理费、维修费和其他杂费一年也要上千元。'
