    # ## 第十一大窍门：先买后卖还是先卖后买？


    有人问：“我看网上都是先买后卖的换法，这里面时间、资金有啥讲究？我这么敢这么弄吗？ ”


    持币待购者当然不存在这个问题。持币待购持币时间越久，机会成本越高。当然，期间有可能有机会遇到急于抛售的特价房什么的。但这一切都属于在不确定性之中，概率跟中彩差不多。


    所以我的回答是：“没什么讲究啊。关键是卖的卖好卖随时可以出手才敢这么干。否则你先签了，到时无法履约，就只有两个办法：1 违约金赔钱；2 大幅度贱卖（还不能保证如期卖出）。这其实就是一个心态问题：总想卖得比别人高买得比别人低。没有舍哪有得呢？天下好事都自己占尽，可能性有多大？很多东西说起来容易操作起来很难的。”


    思考问题必须考虑到直接操作。就像股市，低进高出谁都会说，什么时候是低什么时候是高？如何判断？


    当然，在楼市火爆的时候，在以小换大、以郊区换城区、以旧换新的优化转换过程中，为了防止低卖高买，或者是防范需要买入的标的出现飞跃式跳涨而导致自己买不起，在自己现有需要出售的标的也很好卖的情况下，可以先签有附加条件的卖出合同，这个附加条件就是约定多少天时间之内，必须在签入某个买入合同的前提下，才来签这个卖方合同。


    比如我们自己在买房的时候就签过这个协议（这个协议还是我自己草拟的）：“经双方友好协商，如果卖方【某某某】 2016 年 7 月 12 日能够正式签买房合同，则将纳丹堡某某房（面积
    93.07 平方米）以 194.7 万元总价售予买方【某某某】。'
