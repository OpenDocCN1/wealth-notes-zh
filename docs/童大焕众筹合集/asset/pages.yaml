    # 3 在认清和坚持上述两大原则基础上，匹配自己的才是最好的。C:


    老师，燕郊和杭州中心城区，哪个更有投资价值？ 我：


    类似的问题还有：北京（优质）写字楼和杭州中心城区住宅，哪个更有投资价值？你们大伙儿先想想。回头我再回答。


    C:


    老师刚才的问题，从特定的城市空间来说，应该是北京核心区域的写字楼排第一，燕郊和杭州，我觉得杭州排前面，燕郊第三，不知道对不对？


    L:


    我觉得这都是看个人情况，没有绝对的。如果首付够的话可以买北京的写字楼，过两年就会有很充足的现金流，到时候再去买杭州的就会非常轻松。如果首付不够的话就去杭州。首付非常低就去燕郊。


    我：


    任何投资，都只是在各种现实约束条件下的次优选择。绝对不会有十全十美的最优选。这个现实约束条件，最重要的包括资金、限购条件等两大限制。对甲是最好的出货时机和标的，对乙可能是最好的进货时机和标的。


    杭州新型成熟核心区的住宅，和北京新型成熟核心区的写字楼，都很有价值，但是我无法判断它们哪个涨幅会更高。但是，我可以根据每个人自己的情况，去帮助他们找到更好的匹配。


    比如当下，低于 300 万元，是几乎没办法在北京买上哪怕 400 万元左右的写字楼的（这几乎是该区域优质写字楼的最低总价），因为写字楼只能贷款 5 成，而且北京二手房评估价最高只能评到购买价的
