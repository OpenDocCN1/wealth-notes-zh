  md: '2    综合以上分析，我们会发现只有符合城市化规律的房地产投资才是仅存的“正和博弈”，但前提是必须时刻了解城市的变迁，准确掌握城市化的规律和节奏。房地产本身作为不动产，是不能天然地成为优质资产的。而如何判断城市变迁、如何掌握城市化规律，却是智慧的范畴！所以，**归根结底，唯一能够让我们拥有财富的，是智慧和勤奋啊！**这里的勤奋，农业时代是指体力劳动的多，城市化和互联网时代主要就是指学习和思考等智力劳动了！有意思的是，中国人在给孩子教育和学习投资方面几乎不惜血本，在给自己教育和学习投入方面则往往非常吝啬。这个观念和做法也要彻底改一改了！拥有财富，从改变自己开始！


    3    **国内房产投资 VS 海外房产投资**。这几年随着国内重点城市限购限贷政策的出台，以及一些先富阶层在中国转型期间看不清未来，对国内局势心存忧虑，因此转向向海外扩张投资房地产。美国、澳洲等都成为国人追捧之地。来自美国全国房地产经纪人协会
