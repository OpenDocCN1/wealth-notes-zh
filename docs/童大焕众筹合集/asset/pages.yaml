    月 25 日：“从今年开始，中国政府的主要任务由防范房价过快上涨变成了严防死守房价大范围内下跌引发全面的金融和经济危机。危难之中房地产的救命地位更加突显。楼市分化和局部震荡调整，政府无能为力；整体下跌则绝无可能。有下跌风险地区放开限购限贷、供应过量地区严格限制土地和新增房屋供应量，都将可能。”“有人说房地产是政府坐庄，所以房价难降。事情并非如此简单。补贴了工业、抵押了土地的房地产事关全面的金融和经济风险，事关全局，也事关就业。世界普遍联系，并非只与“政府”相关。农民九成收入来自打工。就业是比房价更大的政治。”


