- pgno: 260
  md: '扩张尤其是小城镇扩张都过度。但是在这个过程中，却形成了骑虎难下的工业绑架房地产、房地产反过来绑架金融和整个中国经济的环环相扣的逻辑和利益关系。其链条是：招商引资导致房地产补贴工业，政府用土地抵押向银行贷款需要通过高房价形成高地价以还银行货款；工业过剩导致工业整体不景气，加上环境污染又迫使我们进一步压缩污染工业产能，国民经济被迫深度依赖房地产。


    之所以首先要让大家了解中国宏观经济大背景，是因为正如古人说的“不谋全局者不足以谋一域”，我们对事物、对他人的理性判断，都必须建立在健全信息的基础上。西方近代哲学中重要的理性主义者、与笛卡尔和莱布尼茨齐名的著名哲学家斯宾诺莎甚至直接把理性和美德画等号，认为一切理智行为都是道德行为。而他对理性的定义则更简洁明了也出乎意料，认为理性就在于根据对全局的正确认识来采取适合自己的适当行动。多年来我一直强调做任何事情，必须先有大判断才能做小判断，先有全局意识才能知道自己和关注的事物所处的真实坐标和位置，否则容易一叶障目不见森林。接下来我们的分析过程还会不断强调各种全局判断。


    这几年银行日子非常好过，理财产品也备受老百姓欢迎，但理财产品最后相当大一部分都成了政府的地方债。政府借钱的花样很多，有土地抵押，有地方融资平台，有银行表外理财产品，有让国有或私营企业贷款再借给政府用的，甚至有让机关和国有企业单位职工个人贷款再借给政府用的，所以政府的地方债其实是个无底洞，它的进口很多，但还钱的出口基本上只有一个，就是卖地。


    如果房地产业不景气，土地就卖不出去或者卖不出好价钱，老百姓的理财产品甚至银行存款就有风险，所以各级政府其实很害怕楼市萧条，他们害怕楼市整体下跌比害怕楼价上涨怕得多。因为这是整个国家的金融和经济风险，所有人都会受害。


    但事物的发展不以任何人的意志为转移，当然也不以政府的意志为转移，就如本文一开头所强调的。房价要涨要跌，市场规律也是一定要作为最后总结算的。如果政府真有想让它涨它就能涨、想让它跌它就会跌的本事，那政府早也就有给每个需要房子的家庭人人分一套房子的本事。市场的最后总结算就是供需关系，供应过量的地方总有一天会跌，供应不足的地方则一定会涨。而在这供求关系的背后，还有一个更大的、同样不以各级政府意志为转移的城市化规律在顽强地起作用！


    这里我们又不得不暂时停下来，谈一谈楼市的另一个大背景，就是城市化规律。全世界的城市化浪潮都是大城市化，但中国很特别，出于精英阶层对大城市化和所谓“城市病”的恐惧、出于中国人整体缺乏理性的文人思维中理想浪漫化的区域均衡发展托邦梦想、出于权力的傲慢与自负，当代中国的城市化进程一直存在着规划与规划撕裂、人口流动与政府导向背离等现象。它一方面导致人口净流出地区的过度投资和过度城市化，造成各种资源的巨大浪费。不把钱当钱，一直在搞小城镇大跃进、西部大开发、就地城镇化。另一方面导致人口净流入地区、尤其是流入大城市人口的各项基本自由和权利得不到保障，不把人当人，无视人的自由选择自由迁徙权利，大城市想尽一切办法通过收容遣送（已废除）、'
  merge: -1
