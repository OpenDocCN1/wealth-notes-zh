    # 1 家庭结构变化


    杭州弟子 YZH 在弟子群里推荐阅读《布尔费墨谈家庭之一：为什么需要一个新的家庭伦 理？》，并问：“这个是不是童老师说的以后家庭会越来越小的原因？”我的回答是：“你推荐
    的布尔费墨谈家庭的文章，我是这样看的：传统农业 社会生存风险很高，大家庭有利于降低这种风险；进入工业社会和资本主义、城市化时代以后， 财产独立性增加，个人自由要求随之提升，小家庭化甚至个性化生存将趋主流，所以我的判断是，
    未来，大城市中心和郊区小户型都会受欢迎。大户型反而要谨慎，包括城市中心大户型。回 头也写一篇文章。”


    于是又有弟子问，多大面积算是小户型？140 平米是不是大概界限？还是更小的三四十 平米的面积？


    我让大家大家开动脑筋想一想，不一定等我的答案。紧紧围绕着人的需要和家庭变迁，比 如越大的城市剩下的美女越多等，以及技术进步，想一想城市中心和作为过渡型的郊区，各自
    什么样的小户型会受欢迎，最小小到什么程度？并且给了个提示，香港李嘉诚开发的房子最 小单元 16 平米，被称为“穷人的恩物”；


    万科在广州郊区开发的地铁小户型，最小面积 18 平米，一天卖光。随着家庭结构的变化， 房价的上涨，小户型向何处去？


    《布尔费墨谈家庭之一：为什么需要一个新的家庭伦理？》也许是为了吸引眼球也许是他的 行文风格，有点用力过猛用词过重，但他总方向上的基本观点我'
