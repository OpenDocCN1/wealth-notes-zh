- pgno: 243
  md: '仅仅卖掉中国北上广深建成区的土地，就可以买下半个美国。自去年股灾以来， 中国一线城市的房价就开始飙涨，买房比买“春运”的火车票都难。


    看似一片繁荣，有什么理性因素推动？有无非理性因素？未来房价走势的变数在哪里？政策在日本和俄罗斯模式间将如何抉择？有无第三条道路？本文试图分析这些问题。


    # 1.地产结构性分化，一线房价大幅飙升


    总体来说，中国的房地产是处于下行周期中。从投资角度看，房地产开发投资累计完成额同比增速从 30%以上的高点一路下滑到 15 年 12 月份的 1%；从开工状况看，房屋新开工面积累计增速在
    2010 年高点时突破了 70%，但截至目前该比例已经连续 22 个月为负值，且去年底更是降至-14%；从房价看，70 个大中城市新建住宅价格同比自 14
    年 9 月以来连续 15 个月为负，直到去年 12 月受一线城市房价提振才转为正值。


    15 年 6 月份股灾以来，房地产市场有所回暖，但出现结构分化。从 70 个大中城市新建商品住宅价格指数来看，房价同比增速从-6.3%的低位上升至 16 年
    1 月的 1.0%，其中一线城市房价同比从-4.5%的低位飙升至 22.4%，二线城市同比由负转正，三线虽然跌幅缩小，但行情与一、二线不可同日而语。从百城住宅均价看，二三线楼市自
    14 年初就处于下行趋势，且三线仍在转差。


    一线城市价格飙升，深圳涨幅超越纽约“辉煌”时期。如果计算近一年一线城市房价的涨幅，广州-2.1%，北京 8.3%，上海 14.8%，深圳 45%，而纽约房价在次贷危机爆发前的最大一年涨幅仅
    15.4%，东京在 90 年代房价暴跌前的最大一年涨幅为 86%，上海与纽约接近，深圳则超过纽约涨幅，“追赶”东京。如果计算近五年一线城市房价的累计涨幅，广州
    27.2%，北京 49.3%，上海 43.3%，深圳 92%，而纽约在房价暴跌前的五年累计涨幅仅 59%，东京 141%，北京和上海都接近纽约，深圳远远超过了纽约。


    # 2.理性因素：人口结构与人口流动


    我们得承认，房地产市场整体下行、结构性分化，一线城市房价的过快上涨， 这些现象的背后有一定理性因素驱动。


    # 2.1. 人口结构变化，决定长期下行'
  merge: -1
  img_proc: true
- pgno: 244
  md: '从日本、美国等国的经验看，房地产周期与人口结构密切相关。房地产属于典型的年轻型消费品，25-45岁人群是房地产消费的高峰期，而在45岁以后房地产消费占比会持续下降。日本的人口红利在1990年代最早结束，房地产市场新开工数量迅速下滑，地产大周期终结。


    而美国15-64周岁人口占比在上世纪80年代中期见顶回落，房地产市场也迅速下滑。之后由于移民的增加，在1995年后又贡献了10多年的地产小周期。但是从2010年开始人口红利正式宣告终结，房地产市场再次开始回落。


    中国人口红利消失，老龄化程度加剧。从2011年起，中国15-59岁的劳动年龄人口在总人口中的占比就在下降，从74.5%的高点下降到2014年的73.4%。根据联合国人口署的预测，中国总人口抚养比每5年平均升幅为0.05个百分点，至2050年将达到0.91的高点。而且总人口抚养比的上升主要是由老年人口抚养比不断上升所带动，即老龄化程度加剧。


    人口结构变化令中国房地产市场也将出现趋势性下行。过去十几年来，我国劳动年龄人口数量巨大，且占比在上升，催生了房地产市场的大辉煌。新开工住宅面积快速增长，从99年的每年不到2亿平米到经济危机前08年的8.4亿平米，在4万亿计划的刺激之下，新开工面积2010年又突破10亿平米，并在随后几年中保持这一高位。但现在劳动年龄人口占比减少，人口红利消失，房地产市场开始大幅度下行。


    # **2.2. 人口内部流动，决定结构分化**


    一方面，从各国城镇化的经验来看，人口向大城市集中是大势所趋。城镇化的过程就是人口集聚的过程，而人口的集中可以创造更多的经济需求和经济活动，提高福利水平。由于集聚效应，人口流动的总方向是从农村流向城市，而大城市的吸引力更强。从国际上来看，美国人口超过100万城市的人口总数占全国比重一直在上升，从1960年的38.7%提高到2014年的45.2%；日本从40.6%提高到65.3%；韩国更明显，从21.3%提高到45.9%；澳大利亚由54.2%提升到高点时的61.6%；加拿大从30.1%提升到45.5%。


    中国的这一比例从1960年时的7.9%提高到了2014年的23.2%，但和其它国家相比还有很大的差距。所以随着城镇化率的提高，中国人口会进一步向大城市流动，这一趋势也决定了中国房地产市场的分化格局。'
  merge: -1
  img_proc: true
- pgno: 245
  md: '另一方面，中国的资源分布更加集中，也决定了一线城市人口流入压力大。在中国，一线城市在就业、教育、医疗、娱乐以及其它基础设施方面远远超过二三线城市，均占有绝对优势，这也是人口向一线城市不断流入的一大动力。05
    年至今，北京常住人口增长 45%，上海增长 37%，广州 38%，深圳 30%。人口的集中流入增加了房地产市场的需求，也是推升一线城市房价飙涨的重要原因。


    但近几年一线城市“性价比”在降低，人口增速已大幅放缓，支撑一线城市房价上涨的力量在减弱。在 2009 年之前，一线城市人口增速从 2004 年的 1.7%
    提高到 8.7% 的高点，但是之后增速一路下滑，2014 年仅为 1.1%。原因可能有三方面：


    +   第一，在现有的土地面积和城市设施下，一线城市可容纳的人口数量逐渐趋于饱和。


    +   第二，二线城市和一线城市存在竞争，一线城市尽管具有很多优势，但随着生活成本提高、人口管理政策的实施，“魅力”也在下降。


    +   第三，国际大都市和一线城市也存在竞争关系，当年东京房价飙涨、日元高估的时候，日本出现了“Buy America”的狂潮，当前高房价也在降低中国一线城市生活的“性价比”。根据最新统计，上海市
    2015 年外来常住人口同比是在下降的，这是十五年来首次。


    # 3. 非理性因素：货币超发与风险偏好


    一线城市房价短时间内的过快上涨，也存在非理性因素的推动：货币超发和风险偏好提升。


    # 3.1. 货币供给过量，资产价格飙升


    国际经验表明：货币超发对房地产价格的上涨有重要推升作用。上世纪 80 年代广场协议签订后，为减小日元大幅升值对实体经济的不利影响，日本央行大幅下调利率，实施宽松的货币政策。日本主要银行长期贷款利率从高点时的
    10% 一路下降到不足 5%，导致的结果是货币超发严重。1985 年时日本 M2 同比增速在 8%左右，实际 GDP 同比在 7%左右，相差不大，但此后 M2
    同比不断攀升至 12%以上，而 GDP 同比却一路下降到 1987 年 1.5%的低点，而通胀并不能解释'
