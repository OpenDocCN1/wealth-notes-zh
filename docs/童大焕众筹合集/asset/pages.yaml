- pgno: 29
  md: '原则、把城市化规律抛到一边，把选房范围圈得太大，看得自己都越来越眼花缭乱越看越晕头转向。


    看房一定要先有主见。要城市化理论先入为主，有主线才会有主见。有正确的理论和方法做指导，买房不是难事。否则，看得越多越晕头转向，不知道如何选择如何下手，最后要不就是眼看着房价节节上涨而贻误时机，要不就是落入盲目跟风的巢臼，成了别人割的韭菜。


    一定要记住弱水三千我取一瓢饮的道理。删繁就简，否则人一辈子时间精力都不够用还不得要领。各种概念和版块太多，我们只能也只需集中精力研究和投资符合城市化理论和趋势的最有价值的区域。


    不管有多少概念炒作，咱们还做保守投资。**1**紧紧守住一线成熟新型核心区，尤其是商务区；**2**紧紧守住成熟区域二手房；**3**受限购的话，北京优质写字楼或者杭州优质核心区。就够了。


    删繁就简，就是不要满世界跟风。只要紧紧抓住两个点：一是资金不多的起步区域，二是高端服务业积聚的终极城市巅峰区域。前者同时也是时不时让多余的闲钱保值增值的资金池，比如燕郊。后者则是可以传诸后世的财富最终归宿地，比如一线城市成熟的高楼密集区。


    若时间精力许可，或者为了多学习经验、多检验理论的正确性，多看几个区域也未尝不可以。但在总价基本限定（由购买力决定）条件下，要详细列出单价，总价，面积，朝向，楼层，租金，税费中介费，总首付，交房年代，小区环境评价，周边商业和学校、交通配套，空置程度，租售比，贷款额度等细项，再进行微观比较。用这种微观比较，反过来检验宏观战略判断对不对；或者是根据宏观理论，可以判断出哪里被低估，哪里被高估。如果前后看房时间相隔较久，进行最后比较时还需要通过电话回访，看看前面考察的项目有没有什么价格变动。


    买房第一大原则是安全（未来有较确定的升值空间）；第二大原则是在安全前提下尽可能在首付和月供许可范围内把资产做到最大，这样就能实现以后增值最大化。'
