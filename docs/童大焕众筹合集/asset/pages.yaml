  md: '# 为什么工业新城高铁新城航空新城通通要歇菜？


    “北京大七环炒房潮：100 公里外的这些小县城房价暴涨”的消息把我惊呆了！中国人的无知与疯狂真是惊天地泣鬼神。我仿佛看到了一张张无知又被贪婪欲望胀满的脸，正被开发商铺的饥饿营销搞得晕头转向。有人要拿一套深圳房子和我打赌，我说：学者对于自己的判断，是需要以声誉和影响力为代价的，比你一套深圳房子贵多了。将万有引力定律引入人际关系和城市化研究，恐怕是我的首创，甚至至今还是独创，我对此感到自豪。它可以清晰地研究城市向外扩张中的能量衰减现象。


    童大焕—2016 年 8 月 17 日星期三


    看到界面 2016 年 8 月 17 日的一则新闻报道，我是彻彻底底被惊着了！这则报道是《北京大七环炒房潮：100 公里外的这些小县城房价暴涨》，报道说：


    > 距离北京中心城区 70 公里外的环北京地带，只要是高速公路可畅达的地区，

    城市战略定位正在发生剧烈改变。最高不超过 3 万元的房价，让这里成为刚需客户曲线进京为数不多的选择之一，“京津冀一体化”以及北京史上最大规模的人口疏散政策，也吸引着那些仍在北京楼市中寻找机会的投资客。


    实际上报道自己都没有过脑子，其所谓“让这里成为刚需客户曲线进京为数不多的选择之一”，但它的报道明显显示：


    > “8 月初的一个周末上午，在北京往南 100 公里处的霸州丽水康城售楼处，

    早起的瓢泼大雨没能浇灭一群从燕郊跋涉近 4 个小时看房人的热情，甚至有人称这是选到好房的吉兆。在这些远道而来的购房者中，投资客的比例也占了很大一部分。根据界面新闻了解，周末从燕郊过来的
