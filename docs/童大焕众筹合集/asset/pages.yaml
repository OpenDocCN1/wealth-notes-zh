  md: '我们已经通过《中国城市化和房地产投资》的全面系统理论分析，得出重要结论：中国的城市化一定是大城市化和区域中心城市化；不论互联网兴起还是工农业过剩，服务业和非物质生产都是未来主流，由此带来的结果一定是人口集中而不分散；人口的集中是动态的，越高端的人群越集中到金融、文创、科技中心，其它人口被自然流动散出；2014年起，由于过去16年的小城镇建设大跃进，接下来的城市化和房地产进入自我收缩时代，世界越来越陡峭，一线城市和区域中心城市的市中心越来越宝贵和稀缺。


    正是在这样的理论指导下，我会让我的学员和客户在资产优化过程中直捣城市的心脏地带。这一带租售比往往也是最高的！


    有人担心，童老师选的项目都是租售比高的项目，另一角度看租售比高的项目，会不会房价也是够高了，因此到时价格增值没跟上，怎么平衡两者关系？我的回答是：现在在不成熟地区捡漏机会越来越少的情況下，同类型项目，租售比高的项目一般未来涨幅也会更高。为什么？因为在其它条件相同的情况下，租售比高本身即说明需求高。而且未来城市只能是回到越来越集中的路上，优质繁华地段的房子形成垄断效应。我的目标是让我的客户尤其是弟子们占据各大城市最优地产。一定要相信一个道理：优质地段的优质房子，都是有钱人虎视耽耽的。像CBD这样的地段，从起步到成熟起码要15到20年的养育时间，一旦成熟，起码能够占据20年以上的自然垄断地位！15到20年以后再来考虑有没有更新更好的区域可以置换（但是期间可以在不增加投入的前提下实现原地置换和把资产做大）。你看，楼市投资多么省事省力同时回报率高而且稳定！


    # ## 怎样买到像世代不移的印钞机一样的优质房产？


    第一，一定要建立人和房地产分离的理念。人要实现价值最大化，房地产也要实现价值最大化，这必须在全国甚至全球范围内配置资产。只不过在我看来，今天乃至未来二三十年内，全球没有比在中国核心城市的城市中心买卖房屋更好的理财投资了，所以完全不必也不应该舍近求远到国外去。中国未来也很安全。


    第二，注重和强调房地产的金融属性，充分利用金融杠杆，把未来30年要赚的先拿到今天来投资！在我眼里，房地产就是金融，没有金融属性——不能和银行直接建立关系的房子一律不在考虑之列。比如小产权房、产权受限的军产房、经适房、自住型商品房、农村住宅等等。


    第三，注重和强调房地产的择邻属性。很多人以为买到相对周边便宜的房子是捡大便宜，其实错了！越便宜的房子可能金融属性越差（能抵押贷款的额度和比例也可能越小）。同时，千金买房万金择邻，选择房子也是个选择邻居的过程，是一个人群自动“物业类聚人以群分”的过程，居住群体素质越高，越有利于房屋保值升值。同一地段低品位的房子甚至完全有可能升值幅度不如高品位的房子。


    从社会学意义上，我是主张贫富混居的，这样有利于下层人士为中层人士提供更廉价的服务，也有利于中下层人士阶层上升；但这种贫富混居只能是同区'
