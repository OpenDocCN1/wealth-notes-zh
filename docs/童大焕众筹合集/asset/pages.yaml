- pgno: 241
  md: '广州、杭州、成都、青岛、重庆、武汉，分别作为两大都市圈的副中心，和几个新兴工业带的中心城市，处于第三层级的地位。


    大城市化是解决中国许多问题的总开关、总阀门，谁也挡不住。农业、环境、水资源、贫富差距缩小、自由、独立、平等、梦想等等，都通过这道总阀门进入进一步求解之道。这不是凭人类的主观智慧和意志开出的所谓‘药方’，而是自然和社会自身的客观发展规律。”在封面中，笔者特意写上‘“高密度大城市化”具有‘拯救中国’的战略意义”，‘传统的、过去几十年延续至今的城市化路径经不起历史和现实的检验，它需要重新定位，甚至需要‘改邪归正’”，‘是到了应该彻底反思中国的城市化战略的时候了’等字样。


    如今还应该加上一句话：大城市化还是解决中国经济停滞、避免中国堕入中等收入陷阱的康庄大道。在承认这一点之前，我们必须从上到下跨过一系列障碍，尊重一系列基本事实，包含但不限于以下几点：


    首先，中国不需要那么多农民，那么多农民留在乡村将无法养活他们自己；其次，在工业产能严重过剩和机器化大生产背景下，第二产业对农业人口的吸引和转化能力也越来越低。楼继伟在演讲中说：“由于近年来工资增长非常快，沿海一些地区制造业已经开始机器人化，它的规模和速度都超过了我们的想象。现在，全世界一半以上的机器人是在中国，当然是比较初级的，智能机器人比较少。这使得劳动生产率在变化，在提高。如果没有这些变化，我们的潜在经济增长可能还会低。”前几天，笔者应中央网信办之邀考察安徽，沿途所见也是机器大生产几乎完全取代了传统的劳动密集型生产。


    在农业和工业对劳动力消化能力大规模降低的背景下，多数中国人向服务业转型就是必然趋势。而服务业的发展，端赖于人口的大规模、高密度集聚。


    第三，我们应该彻底告别财富等同于物质生产的落后观念！像限购限贷加剧的三四线及其以下城市房地产生产过剩，就不是创造财富而是破坏财富，还给后人留下无尽的债务包袱！


    2004年，意大利的安东尼奥·奈格里来到中国，在清华大学做了一次主题为《帝国与后社会主义政治》的演讲。在这个演讲当中，他提出一个非常重要的观点，他说现在出现了一种新的生产方式，这种生产方式称之为“非物质性劳动”。非物质性劳动生产什么？生产想法、知识、信息、文本、语言、形象、情感、关系等等，而且他说这种新型的生产已经开始把传统的以工业制造为代表的生产，从强势地区逼入到从属地区当中。


    互联网的无国界链接和人口的高密度集聚，使智慧和观念这些“非物质性生产”产生核聚变式的碰撞、裂变与超级能量，像黑洞一样，吸引全世界最强大的头脑和最锐利的目光！非物质劳动很难通过权力计划，更难以实现权力垄断。惟一正确的路径是尊重个体的流动自由和知识产权。'
