    根据国家卫生和计划生育委员会发布的数据，截至 2013 年底，全国流动人口达 2.45 亿人。这意味着，全国有超过 18% 的人口离开本地或本省在外生活。根据国家卫生计生委的数据测算，目前跨省流动人口已占全部流动人口的
    38.9%。其中，人口主要从中部和西南地区流出，安徽、四川、湖南、河南、贵州和江西六省占全国跨省流出人口的 71.07%。


    虽然最近 10 多年来已出台西部大开发、中部崛起、新农村建设战略等政策，但人口从中西部向东部转移的趋势未变。跨省流入人口中，人口主要流向珠三角、长三角和北京地区，“逃离北上广”成为不折不扣的“伪命题”。国家卫生计生委的数据显示，截至
    2013 年，广东的珠三角，长三角的浙江、上海、江苏，北京，海西经济区的福建六省市占全国跨省流入人口总数的 87.83%，较 2012 年同期上升了 4.5%。


    我希望大家对数字有点敏感度。东部 6 省市占全国跨省流入人口总数同比上升 4.5% 是个非常惊人的数字。因为根据国家统计局 2002 年至 2011 年长达十年的数据显示，中国的城市化率平均每年上升
    1.35 个百分点。这意味着，跨省流入这 6 大东部地区的人口流动速度是全国城市化速度的 3.33 倍！亦即，人口向少数城市集中的速度是城市化速度的 3.33
    倍！


    也就是说，“逃往北上广”的人数在增加！除了农民工进城，流动人口中从城市到城市的人口迁移也越来越。


