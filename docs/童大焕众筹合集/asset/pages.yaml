    学问大着呢。有的人买了就跌，有的人买了小赚，有的人买了大赚。最大的借力是借势，善于借城市化规律等趋势性潮流性外力的一定成为大赢家；善于借银行等技术性外力的成为中赢家。上述两者结合到位的成为最大赢家。两者的力量都不会借的成为输家。'
