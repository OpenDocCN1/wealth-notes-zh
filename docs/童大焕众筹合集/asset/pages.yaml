  md: '通过成本顺推房价的思维方式，是一种落后的思维方式。之前我们这片土地上还曾经出现过*一*个乌龙：时任温姓总理指责开发商，要他们身上流*一*点道德的血液，开发商反唇相讥，说房价里70%都是被你们政府收走的地价和税。


    其实他们都错了。世界上几乎所有的东西价格都不是由成本决定的，而是由需求决定的。你看看齐白石张大千的画，你看看珠宝艺术品。需求大而供应小，价格就高；需求小而供应量大，就是亏本也没人要。现在鄂尔多斯和曹妃甸的房价跌破地价，还有人买不？已经有很多消逝的村庄，未来还会有很多人口净流出*出*的小城镇，房价都跌破成本价仍然无人问津。


    认为“成本决定房价”的人最容易犯的*一*个错误，是追着“地王”的指挥棒去买房。哪里出了*一*个面粉贵过面包（地价高于房价）的地王，他就认为那个区域房价*一*定跟着上涨，以为捡了*一*个大便宜，买到了比面粉还便宜的面包。


    事实上，“地王”背后有很多学问，甚至有很多猫腻：*一*种是产品定位不同，同*一*地段，*一*墙之隔，*一*边可能是贫民窟，*一*边可能是豪宅，二者没有可比性。*一*种是政府和开发商联手炒作市场，表面公开竞拍背后暗中勾兑，实际上开发商并没有付出那么*多钱。*一*种是开发商前面布局，在附近拿下不少地块，通过*一*小块“地王”炒作其他楼盘。2016年上半年全国各地出现的很多地王，更邪门，*多*是央企在拿地，地价高得离谱。比如2016年6月2日，北京远郊县延庆*一*地块出让，最终天润诚泽（*一级*开发）以10.425亿元的总价取得。楼面价4.3万，是当地房价3.5倍。这已经不是传统地王的“面粉贵过面包”可以解释。有人推测，此轮全国各地地王疯狂，不排除*一*种可能，就是央企在新*一轮*合并过程中，*为*了自保，通过这种方式迅速“做大”自己以提高合并过程中的话语权。保自己的位置要紧，企业未来死活才不管呢。这种玩法，咱们老百姓你想用*多*少钱都不够赔葬的。


