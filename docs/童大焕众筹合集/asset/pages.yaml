    # **2015 年 7 月 8 日童大复:**


    能够给你们带来惊喜，带来较大程度的财富保值增值，我也非常开心！也感谢你们的信任！回答你们的问题：


    贷款年限还是要拉到最长，目的就是要把资产做大。要知道，房租是逐年增长的，大约不到 5 年以后，房租就可以超过月供，以后还能越来越多地产出被动收入（租金-月供=被动收入）。所以，我们根本不必考虑还银行贷款的钱，一辈子都不用考虑，因为只要是真正优质的房子，一定有人替我们付月供甚至还多出很多钱供我们生活、零花。


    况且，未来房子也许不一定就一买定终身，还可以依我这种办法，不断买卖将资产做大。


    可以申请 20 年公积金贷款，当然比 10 年抵押贷款好得多。这样一来，你们的月供能力其实又增加了，还可以买总价更高一些的房子，或者让生活更轻松。


    直接到杭州找中介，楼盘附近找，最靠谱，一是房源多，二是对周边熟悉。先让他们给你们介绍，你们就可以迅速熟悉那一带。同等总价的房子，看哪里租金高又租得快，哪里就是相对好地段。


