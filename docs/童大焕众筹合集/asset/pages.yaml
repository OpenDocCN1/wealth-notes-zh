    # 关于城市化和房地产的一些基本数据【学员独家 注意保存和保密】


    2016 年 7 月 22 日按：自古不谋全局者不足以谋一域，不谋万世者不足以谋一生。用西方哲学家斯宾诺莎的话来说，人的理性，是指在正确认识全局的基础上采取适当的行动。要想成为房地产投资的赢家，前提是要知道城市化这个全局。城市化到底是怎么回事？人口和就业到底是怎么流动和分布的？这些全局问题必须了然于胸。下面是一组组简化了的扎实数据，让你对城市化和房地产走势成竹在胸。数据说话，来不得半点虚假和忽悠。内容不断更新中，目前截止到2016
    年 3 月。


