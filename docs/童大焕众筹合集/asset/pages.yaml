  md: '结论：不管是投资写字楼还是住宅，都秒杀炒股。自然，也秒杀几乎一切形式的金融理财。只要方向、方法对路，不论住宅还是写字楼，收获 50% 到 100% 甚至更高的年回报，都是相当容易的事情。


    有人说，那是过去，未来房地产没有那么好的遍地黄金了！房地产不再遍地黄金是正确的，城乡之间、地区之间、城市内部的分化都会剧烈拉大。但是，未来城市化是有规律可循的，那就是由过去工业主导的扩张时代向后服务业主导的收缩和积聚时代剧变，一旦城市进入收缩和积聚阶段，积聚所在地的房地产投资空间比过去更大，更集中！关键是要看清楚城市化规律，不要以为价格低就是价格洼地，而要清醒地认识到——不管价格高低，未来有巨大积聚空间的区域才是价格洼地。


