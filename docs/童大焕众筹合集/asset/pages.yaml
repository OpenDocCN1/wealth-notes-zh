  md: '又会从市区开始。这就是我所说的“涟漪效应”：城市房价的上涨总是从市中心开始，一波一波往外荡漾，到一定时候又荡回城中心，再接着下一波荡漾。


    有人问我：童老师，由于您当年给朋友推荐的京润国际城和华业东方玫瑰都收获了成功，如今想请教您商住楼盘哪个值得今年购买？限购人群过渡用，目前看好中弘北京像素，想听童老师意见。我的回答是：北京像素我不太了解。建议留意通州万达广场和亦庄主板块，还有通州新城核心区。


    为什么建议万达？因为万达的低价位入市、超高速形成商业氛围、商业自持率高、率先迅速抢占区域人气先机的战略经营模式，是目前任何其它商业地产都很难匹敌的。为什么建议亦庄区块？因为该区域经过了过去十多年的发展培育，目前正处于最壮观发展的“青壮年期”，卫星看地球，亦庄不是一般的亮。为什么建议通州新城核心区？你不是一再说小心提防政府规划吗？答曰：这个规划正好顺应了城市化规律，不像鄂尔多斯和曹妃甸（前任国家一二把手的金手指和十年投资了
    3 千亿，并且辅之以首钢整体搬迁过去，它仍然是扶不起的阿斗）等地方在无人的旷野上人为造城，而更像当年的浦东和深圳。也就是说，**政府规划和城市规律合拍，将是最佳选择**。


    有人说，大城市限购、小城市有风险，那旅游地产怎么样？我的态度是：旅游地产太超前，同时也已经相当过剩，虽然不排除它们仍然在涨价，但多是有价无市，尤其是二手房。你是准备房子来伺候你还是你来伺候房子？请先想好了再做。尤其是那些季节性很强的旅游地产。据美国《华尔街日报》网站
    3 月 7 日报道，继住宅和商业地产后，旅游地产已经成为房地产开发商的第三次发展浪潮。中国房价出现回调趋势，购物中心店铺大量空置，那些不甘心放慢开发速度的中国开发商押注休闲娱乐行业。他们期待，中国中阶层将开始青睐度假地产，尽管迄今为止这个市场尚未真正启动。但是我个人建议，保守投资是最好的投资，不妨让别人的子弹先飞一会儿。


    还有人不断担心房产税。去年还有一则传得非常凶、如果下手也非常猛的所谓房产税方案，言之凿凿说今年开征。有兴趣的朋友可以查查我的原创微博，很肯定地辟谣。现在，在楼市预期动荡的时候，更不敢推出房产税。大家想一想，如果房产税真正推出，并且在全国范围内登记所有房产，那么人们整体上倾向于抛售哪里的房屋？是抛售大城市房价高、保留中小城市房价低的呢？还是相反？我的结论是相反！


    表面上，抛售大城市房价高的，可以节约更多的税收，可能会有一部分人一开始这么做。但是他们马上会发现吃亏了！因为偏偏是大城市房价高的，还在涨价，因为人口还在涌入，而且涨价部分比税收高多了。而小城市则相反。这样一来，醒悟过来的人们会立即形成中小城市抛售潮，会进一步加剧中小城市房地产崩盘和大城市房价上涨！那么，这样的结果是银行和我们会以承受之重吗？


    因此，在我看来，在中国的城市化基本完成之前，房产税是连提也不能提的玩意儿。'
