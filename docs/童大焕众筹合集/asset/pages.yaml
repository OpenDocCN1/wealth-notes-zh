  md: '即使短期内因为工业大量过剩以及工业制造的智能机器人化而导致人口大量回乡，但这个回乡也是短期的，只占 GDP 总额 9.17%（2014 年数据）的第一产业绝对养活不了庞大的农牧渔业人口，他们势必还要回城，甚至是随着第一产业的占比逐年下降，传统农民还要以更迅猛的速度进城。


    即使超大城市试图通过限制孩子入学的方式限制中低端服务业人口（是服务业中低端不是人口中低端）进入，一些人被迫到环北京地区买房让孩子上学，他们的就业还是在大城市；或者另一些人被迫到其它城市就业，那么大城市空出来的就业机会，很快会被那些孩子不急于上学或者没有孩子的就业人口所填补。


    世界上从来没有两片相同的叶子，也从来没有相同曲线的两条河。因此，我的学问从来不来自书本，而是来自观察和思考本身，来自理发师、装修工、卖菜师傅、滴滴司机等等。他们就是生活和经济、政治本身。


    2015 年 9 月 3 日，我要结束这篇文章的当天，和一位装修工人聊天。他说，很多人由于孩子不能在北京上学，被迫在大厂等环北京地区买房，但人还得在北京上班，而且在北京还得租房子，谁也不可能那么远上下班。这就是现实，这就是规律。


    前几天我还在新浪微博上和《大國空築》的作者易富贤博士争论，我说 “香港的今天就是北上广深的明天。香港租房旧小区 10 平米租金 6800，第一年死约第二年起就是活约，随时可协商变更条款。没有人逼着谁来香港，也没有人逼着谁来到北上广，一切都是自然规律一切都是自由选择。而大陆，甚至相反，1949
    年以来政策和舆论一直反对大城市化，但一切都是徒劳。” 有人就说 “北京可以一只扩展到六环，大兴，黄村，地铁通到就行了。再不行，产业外移，就像 it 产业园就不在市中心。地铁可以花銭修，地花銭买不来啊。”
    我说：“你以为路修到哪个城市就扩张到哪里？什么叫城市？什么叫城市化？时代不同产业形式也不同了，逆城市化的中等城市化过程已经不复再有。”


    这时候易富贤博士说：“产业形式不同了，人口更加不必集中在北上广了。互联网 + 现代交通（比如高铁），使得零售（亚马逊超过沃尔玛了）、金融、研发、制造、甚至教育不再依赖于物理性场所，那么传统产业下形成的大城市的地位将下降。”'
