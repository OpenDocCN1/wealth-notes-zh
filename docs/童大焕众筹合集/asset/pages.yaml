    # **第十二大窍门：精密推演变化的逻辑与过程最为重要。**


    有人问我：“童老师，这个您怎么看？——据报道，2016 年 6 月 23 日国土资源部召开视频会议，安排部署土地利用总体规划调整完善工作，并给各地下发了《土地利用总体规划纲要(2006~2020
    年)调整方案》。按照《调整方案》，北京天津和上海三地的 2020 年耕地保有量指标均被大幅度降低。在原有规划中，北京需要在 2020 年保有 21.47 万公顷耕地，《调整方案》将之降低为
    11.07 万公顷；天津在原有规划中需要在 2020 年保有 43.73 万公顷耕地，《调整方案》将之降低为33.40 万公顷；上海在原有规划中需要在2020
    年保有24.93 万公顷耕地，《调整方案》将之降低为 18.80 万公顷。1 平方公里等于 100 公顷，1 公顷等于 1 万平方米。所以，我们可以计算出来，北京、天津各增加了大约
    1000 平方公里的建设用地，上海增加了大约 600 平方公里。”


    按一般逻辑分析，供应增加肯定是房价下跌。但是，我有“服务业必然导致城市化加速集聚和收缩”这个理论基础，再加上知道决策层不遗余力地往城市中心外疏散人口的愿望，因此我的回答是：


    “终于认识到需要增加土地供应了，但北京（增加土地供应）一定是在五环外。但事实上根本不需要这么多用地。而且这个跟他的控人政策也是自相矛盾的。政府的政策，摸不清头脑。我研究城市化，一般不研究供需比之类的东西，价值不高。”'
