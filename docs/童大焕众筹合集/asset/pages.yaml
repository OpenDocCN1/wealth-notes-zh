  md: '短炒的要点是快进快出，但房地产是长交易周期产品，不是你想出就能出。从买一手期房到交房，一两年时间；从交房到交房本可以二手交易，一般又是两年时间。四年过去，一切都将水落石出！所以我只建议保守的投资办法：寻找真正的价值洼地，等待价值回归。该回归的一定会回归。比如广州的珠江新城，北京的
    CBD。借用一句流行语：不要与趋势为敌。投资是人生漫长的修行，永远不要在悬崖边上跳舞。我的课程，理论和方法其实都很简单——大道至简，一篇文章，一堂课，有可能讲清楚人类上万年历史进程，最多的时间和精力，都在巩固大家的理念，都在提示风险。


    一个最重要的理性是：任何人都不是神仙，千万不要以为自己能够比别人跑得快。所以，投资首先要给自己一个打底的东西：万一房子就沉淀在我手里了，会怎样？


    大洋网-广州日报 2016 年 08 月 31 日 08:16 有一则报道《韩国楼市 “去库存” 压力大 首尔市区却供不应求》，报道说：


    韩国首都首尔的周边卫星城里，新楼盘拔地而起。然而，韩国楼市并没有呈现 “供需两旺” 的火爆局面。除了首尔市区的房子供不应求之外，首尔卫星城的大量新建住宅面临卖不出去的窘境。首尔南边的卫星城龙仁市，就是韩国楼市供过于求的典型个案。


    官方数据显示，龙仁市总人口只有 100 万，但目前待售的新房达到了 5301 户，库存量为韩国全国最高，令当地政府头疼不已。


    首尔市区的楼盘在未建成之前就早早被买家预订，真正难消化的是类似龙仁市这样卫星城的房子。在龙仁市，新公寓供过于求的情况意味着房屋转手价格可能下降。


    > “建筑公司盖的房子太多了，这是不负责任的行为。” 当地资深房地产销售人员表示：“如果买了铁定赔钱，我绝不可能向客户推荐这些新房子。”


    你看，龙仁市 100 万人口，待售新房仅 5301 套就被资深房地产销售人员指责为开发商不负责任，我们的江苏昆山，据说 160 万人口，6 万多套新房还无人指责，大家仍在房价上涨中疯狂，试图火中取栗。环北京更恐怖，通常一个开发商一个项目数以万套。前些天，2016
    年 5 月 26 日，，公告称将承接房山区张坊镇 119 平方公里约定区专门开发环大都市远郊区的大开发商城的整体开发建设！'
