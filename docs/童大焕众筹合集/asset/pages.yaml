    # 8) 未来所有的好山好水都不稀缺，稀缺的是什么？


    有人说，我的房子坐山面湖，碧水蓝天，稀缺。我说，随着服务业主导的城市化时代到来，中国东南部甚至东北地区，好山好水一点不稀缺，只会越来越多！甚至于城市中心，同一个湖，此岸有可能万家灯火，彼岸就是鬼影森森。


    钱往高处走，人往高处流。但问题关键在于“高处”在哪里？**未来稀缺的，不是青山绿水，不是房屋品质与结构，最稀缺的，是特殊地段！未来，大城市核心区域再破烂的房子，都比远郊区金碧辉煌的别墅有价值！**知道什么最稀缺了吧？


    最后，讲一个真实的故事。这个故事是首都青记协秘书长亲口跟我说的。他说，他访问美国的时候，美国博雅公共关系有限公司（成立于 1953 年，是全球领先的公共关系和传播咨询公司）创始人兼董事长夏博新跟他说，这辈子最后悔的一件事，就是上世纪
    70 年代经济危机的时候，他们在纽约曼哈顿区租用办公的房产业主动员他买下这个物业，他觉得租金不贵房屋也有些老旧，没有买。结果，现在怎么样？公司在纽约总部两层楼的员工一年创造的财富，只够这两层楼的房租！


