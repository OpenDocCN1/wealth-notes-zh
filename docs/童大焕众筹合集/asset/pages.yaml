  md: '美国硅谷和印度班加罗尔告诉我们，电子方式的交流并不会导致人们放弃面对对的接触。硅谷和班加罗尔的 IT 企业本来是最有条件进行远程办公，但他们却选择了集中，并且购买了因集中导致昂贵的房地产，目的是要获得面对面交流带来的好处。


    大量实证研究证实了面对面交流的重要性。密歇根大学的两位学者进行了一项实验，将每 6 名学生分为一组，然后进行一种让每个人人都能够通过合作赚到钱的游戏。按照规定，有些小组在游戏开始之前进行
    10 分钟的面对面交流，以便讨论本小组的战略；其他小组则通过电子方式进行 30 分钟的交流。结果表明，进行了面对面交流的小组合作得更好，赚的钱也更多。只通过电子方式进行交流的小组各自为战，每一位成员都把自己的收益置于小组的需要之上。另外进行的大量试验表明，相对于任何其他形式的交流来说，面对面的交流往往会带来更多的信任、慷慨与合作。


    显然，面对面交流比非面对面交流更节约时间、更慷慨、更容易取得信任与合作，成效自然也更高。任何时候都千万不要忘记，每个人的一辈子都只是时间单元哦！当你网上半小时的效率不如面对面
    10 分钟的时候，见面事实上相当于延长了人的生命。


    统计结果还表明，电子方式的交流和面对面的交流是相辅相成的，它们之间是互相补充、互相促进和互补关系，而不是替代关系。


    对于那些普遍的、规律性的东西，中国的情形与世界并无二致。唯一不同的是，我们的城市政策一直在反对集中、鼓励甚至强行推行分散。上海过去十年为此建设了 5 座郊区新城，但产业的自我发展却是更集中了：金融行业高度集聚在市中心
