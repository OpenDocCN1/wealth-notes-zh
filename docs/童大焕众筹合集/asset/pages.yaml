- pgno: 233
  md: '**世纪城**规模庞大，形成了以居住为特征的高密度人口集聚，所以它的“学区房”特征可能是能够维持很久的。但是世纪城成也萧何败也萧何，大，也意味着供应量大，因此，它的涨幅还是小于交大嘉园。


    **交大嘉园、丽水嘉园、鑫雅苑**相隔遥远，但都是交大附小或附中学区房。但涨幅为什么依次是**交大嘉园**>**丽水嘉园**>**鑫雅苑**呢？这也许就要从别的要素上找原因了。


    从卫星图上看，**交大嘉园**在一片低矮的房子里鹤立鸡群，是区域难得的电梯高楼。原因找到了吗？嗯，因为整个区域处于大学包围的原因，老旧房屋居多，校园内的改造又难，所以它一枝独秀。而大学老师，也是源源不断的相对高素质人口，对孩子的教育，更是不惜血本。


    **丽水嘉园**离 CBD 不远，成为它的优势之一。CBD 人口仍在集聚。


    **鑫雅苑**周边环境一般，小区也不够大，又没有上述两者之外的独特优势，所以退居其三也有道理。


    **盛今佳园**在 2006 年代属于“绩优股”，地段不错，周边环境成熟。也是学区房。缺点在于两个：周围没有高端人口的持续集聚或置换；紧挨铁路。所以，它在这
    5 个项目里涨幅最低，也就情有可原。


    通过上面的分析，几个项目过去涨幅不同的原因找到了，如果现在再来选择，答案也应该自然而然地水落石出了。我的答案依次是：1 交大嘉园——因为区域稀缺性强；2 丽水嘉园——因为
    CBD 仍在快速成长，但小区环境可能略逊于周边，否则可以与交大嘉园平起平坐；3 世纪城——学区稳定但供应量也大；4 鑫雅苑； 5 盛今佳园坚决放弃。


    当然，上面的分析还要考虑采样数据少，导致准确度不够等问题。'
