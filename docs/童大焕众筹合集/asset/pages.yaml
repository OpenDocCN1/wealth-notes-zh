  md: '增长率都降低。无论是相对分散还是绝对分散，其结果都是使整个大城市区域人口增长率降低，而位于建成区以外的城市远郊较富裕阶层居住的地区人口却迅速增长。然而，虽然在郊区化阶段大城市区域的人口增长率降低了，但总地来看，大城市区域的人口增长仍快于非大城市区域的人口增长。


    逆城市化阶段。出现在 20 世纪 70 年代早期至 80 年代早期，其主要特征是人口迁移的方向发生了倒转，即从 20 世纪 50 和 60 年代的向大城市区域迁移变为向非大城市区域迁移。大城市经历着人口的净迁出，人口数量减少，而小城市和城镇以及部分农村地区却人口迅速增长。平均来看，非大城市区域的人口增长快于全国和大城市区域，而在大城市区域内部又是城市规模越大，人口增长速度越慢。与郊区化不同的是，逆城市化并不是指人口从城市中心向周围的郊区和农村地区的迁移，而是指人口从大城市区域向较小的城市和城镇的移动。在此过程中，随着人口向非大城市区域的迁移，工业也逐渐向新的地区和非大城市区域迁移。


    再城市化阶段。出现在 20 世纪 80 和 90 年代。20 世纪 80 年代，在许多先进进入逆城市化阶段的国家中，逆城市化过程被终止，或者是出现了迁移流重新返回到较大城市的现象。再城市化现象主要表现为非大城市区域的人口增长速度再一次低于大城市区域，城市规模和迁移增长之间呈正相关关系，城市分散的速度放慢，人口重新向大城市集中。


    但事实上，真正的城市化是 19 世纪工业革命以后的事情。现有发达国家，也就是先发国家，大部分都是在工业化背景下完成城市化进程的，其所谓的“郊区化阶段”和向中小城市漫延的“逆城市化阶段”，也都是在工业突飞猛进和城市中心环境污染和安全恶化的背景下才出现的。他们没有所谓的户籍制度，人口迁徙是绝对自由的，完全由经济主导。在那种情况下，工业在哪里，城市就在哪里，人们的家就在哪里。因此，一些中小城市和大城市郊区工业发展了，顺带也把人带出去了。随着工业产能占整个
    GDP 比重的下降，人口又重新回到大城市来——因为越大的城市服务业越发达，效率越高，机会和自由度越高。但是由于发达国家人到哪里，房产和家就落地生根到哪里，因此，它们的城市发展最后一'
