  md: '过来，只能关注少数优生，其它的放羊。这是客观情况。我为什么一再提学区房问题，就是这个问题总是社会焦点，同时担心我们太想要一件东西的时候，就像前几天独家文章《小确信大趋势以及本次中央教市的正确应对》中谈到的，把一个因素放大到无视其它任何因素的地步，给我们的选择带来不利影响。


    秦：现在的名校没有因材施教的，都是应试教育，所谓名校就是不管你风吹雨打，我只抓学习，别的一概不考虑。如果考虑了，只有名次下降、家长不满意的结果。


    童：是的，现在名校的唯一标准就是升学率。不要把它想得太美。素质教育概念本身是含糊的，我们不能被一个边界都还没搞清楚的概念牵着走。还有，真正的素质教育并不排斥应试。国外的孩子，要读上名大学，比我们这里的孩子还拼。


    秦：是，孩子上学也是匹配最重要，我侄女小学一周上二奥数班都不烦，她妈都累了，她还要上。我儿子六年级上一个还抹眼泪，只有匹配才是最好的。


    老师说的是，我孩子初中同学出国上了个私立高中，军事化管理，连衣橱摆放都有图纸标准要求，打扫卫生都有标准，有学长带白手套检查。


    梁：嗯是，我女儿的幼儿园同学，一个有天才才能的孩子，小学读了中关村三小，他不符合传统学校好学生的标准，得不到老师的理解，学校的课外班资源也一律向拔尖的孩子倾斜，作为特长表现普通的他什么也没资格参加，根本享受不到，而孩子因为压力焦虑一直处在抗争中，都有身体症状了，挤眉弄眼和不可控制的点头，就是所谓抽动症的症状。


    学校还常有冷侮辱，让孩子揭发孩子这种做法，这些关系到孩子的价值感和价值观建立，我是绝不会选这样的名校的。


    谢：匹配是关键！我儿子四年级之前在公立学校读书，一个班 70 人，他比较调皮，不受老师管，所以放任！四年级转到民办学校，一个班 35 人，老师与家长沟通比较顺畅，我儿子找回了学习信心！民办学校也抓成绩，因为要在市里排名！匹配是关键。


    昊：父母在为孩子择校的时候，都会考虑孩子的能力是否符合该学校，因为怕孩子在学校总是落后于别人，心理产生自卑感。3 岁看大，6 岁看老，家长基本上都能准确判断。'
