- pgno: 257
  md: '钢铁行业亏损面在 23%以上，玻璃行业亏损面超过 25%，电解铝行业约有 80%的企业陷入亏损。因此可以明确的是，我国产能过剩的问题仍然严重存在。这种情况之所以长期以来难以根本解决，恐怕不能简单地将原因归结为人们对于压缩过剩产能的认识不足，大家仍然在盲目地追求产值，追求
    GDP，等等。


    我认为在目前情况下，为了压缩过剩产能，既要加大地方政府和有关部门的责任，也要抓好顶层设计和顶层推动。例如除了需要从国家层面进一步抓紧健全完善有关环保、节能、技术标准、安全生产等方面的法律制度，并不断增强其严肃性和权威性，以控制产能的扩张之外，考虑到治理过剩产能确实需要付出巨大的成本，有些事非上下联动，不统筹协调是难以解决的。譬如一个省为了压缩过剩产能，将减少多少财政收入，需不需增加上级财政的转移支付，需要增加多少转移支付；一个地区为了压缩过剩产能，将有多少企业员工(包括上、下游受影响的企业)可能下岗失业，如何安顿这批人员，需要拿出多少钱来；一批企业关门停产，其资产如何处置，不少企业产权结构已经实现多元化，有的企业当时建设、投产也是经过了政府有关部门审核批准的，如市场不好，经营不善，其损失当然应由企业自己负责，但现在如果是政府因压缩产能责令其关门歇业，其有关股东的损失如何“埋单”；在过剩产能的压缩调整过程中，银行的债权如何处理(90年代国企改革时，因为当时的银行主要还是国有独资的，因此对于因国企改革而形成的不良贷款通过政策性剥离和处置以卸下这些企业的历史包袱是可行的，但如今一些主要银行都已经股改上市变成了公众公司，过剩产能相关企业的股权结构也早已发生了很大变化，原来的一些处置办法已经难以继续沿用)，等等。


    总之，压缩过剩产能不仅仪要求人们增强对 GDP 适当下行的心理承受能力，更重要的是要算清每个行业、每个地区需要为此支付的成本究竟是多少。因为从宏观上来说，压缩过剩产能既是一个减收的过程，也是一个增支的过程，这些成本(有些是有形的，有些是无形的)究竟以什么方式来承担，准备在多长时间内分摊等等，都是十分具体也十分棘手的难题。但如果这些账不算清楚了，不搞明白了，就很难真正解决好转过剩产能的问题，就很难说是真正步入了比较健康的新常态。GDP
    增速下滑的“学费”付出就很难收到应有的成果。


    如果说对压缩过剩产能，大家的看法还是比较一致，只是苦于困难较多，难以短时间见效的话，那么对“信贷过度”的问题，可能意见就不会那么相同了。但信贷过度确实是妨碍我国经济发展确立新常态的另一个必须解决的问题。


    到今年 6 月底我国的总债务与 GDP 之比已经达到 251%，而在 2008 年这一数字只有 147%，仅去年一年就上升了 20 个百分点。更重要的问题是，与世界总债务水平也比较高的美国、英国、日本等国家相比，我国的总债务的结构不尽合理。在我国，尽管大家对地方政府融资平台的风险十分担心，但总的说来我国政府负债率并不算高，居民负债率更是很低，但企业负债率则非常高。我国企业债务占GDP的比重超过了
    120%，而美国约为 72%，日本约为 99%，意大利约为 82%，澳大利亚约为 59%，加拿大大约为 53%，德国仅为 49%左右。在西方发达经济体中只有西班牙的企业负债率高于我国。


    当然这里固然有我国资本市场尚不够发达，间接融资占比必然偏高的原因，但不'
