  md: '# 【学员独家  注意保存和保密】大城市内部的区域兴衰与分化刚刚开始——兼谈分析房价走势的方法和步骤


    即使在“同类地段”的大城市区域内部，房价的分化也已经非常明显，  并且，就像城乡之间、地区之间人口流动大趋势不可逆一样，这样的分化也将呈现出不可逆的趋势！


    童大焕—2016 年 9 月 17 日星期六


    2016 年 9 月 9 日，两个弟子在群里交流北京市中心几个不同小区的历史价格和涨幅：


    2006 年 9 月，莲花桥旁边的盛今佳园（莲花桥西南角，铁路南，西三环路西，三环路东为莲花池公园），三居室，10800 元（单价）。当时世纪城小区（西北三环外，四环内，紧挨西北四环）三居室，10000
    元，皂君庙的鑫雅苑小区（北三环内），9000 多。现在：盛今65000（6 倍），世纪城 10 万（10 倍），鑫雅苑 9 万多（10 倍）。不过学区不一样，盛今七一小学，世纪城人大附小，鑫雅苑小区门口与交大附中校门面对面。


    2004 年，朝阳公园对面（东三环外东四环边，路北为朝阳公园）的丽水嘉园 1 层 4900，15 层 6100，顶部几层 8100。交大嘉园（北三环、西三环内）6800。现在丽水嘉园
    65000 左右（8 到 13 倍，均值 10 倍计），交大嘉园 9 万多（13倍），都是交大附小学区房。


    这时，另外一个弟子提出一个问题：


    上面对比的都是从一手到二手的价格，如果现在来买，从投资角度，应该怎么选？我是说从上面的二手里面选。


    我觉得后面这位同学提出了一个非常好的问题，于是把它布置为作业：某同学提了一个好问题：上面那些房子，过去涨幅不一样。在现有的情境下，我们再造这些房子，怎么选？理由是什么？'
