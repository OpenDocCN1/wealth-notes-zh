- pgno: 86
  md: '也经常有人问，某某学区房怎样？我一般回答他们说：我不研究学区房，因为学区房不是房地产概念，而是政府配额的概念。


    既然是政府配额，就不由市场规律和城市化规律作主，所以很难研究，政策的须臾之变会带来财富的巨大跌宕，这样无法自主掌握的东西，不要轻易去碰为好。世界这么大，选择这么多，为什么非要在一两棵树上吊死呢？有人在城市中心买破烂房子等拆迁，也是一样的道理。


    最近广州一批业主就遇到了麻烦。《南方都市报》2015年4月8日报道，日前，广州市天河区教育局公布了2015年该区的部分小学招生地段，令不少业主大跌眼镜，有业主惊呼，花近700万买下的学位房，最后竟然是“竹篮打水一场空”。事件终于今年天河区6所小学服务地段微调，两新增楼盘明确对口小学：天河北林和村新楼盘峻林住宅小区划归华成小学，华景小区新楼盘华景锦苑划归棠下小学。天河区教育局表示，此次微调是因新增楼盘、校区及教育资源优化布局等考虑而作出的决定。同时，该局有关负责人表示，教育局从未与开发商签订过有关的“学位协议”。


    不仅新楼盘有风险，旧楼盘一样存在学区微调的可能，因为招生人数和城市人口数量每年都在变化。况且政府部门理论上还担负着“消灭学区房”也就是均衡教育资源的职责。


    学区房还有两个风险不可忽视。一是学区房基本上只适用于小学和初中尤其是小学阶段往往更被追捧。但在应试教育体系下，相当数量小学阶段进入名校的孩子，初高中阶段未必表现优秀，甚至高考也未必能体现出优势，更不用说日后漫长的人生了。因此，随着家长越来越理性，对学区房的追捧是否会发生变化，有很大的变数。


    尤其是高中阶段以后，越来越多的家长让孩子的教育与国际接轨，越来越多的优秀学生高中毕业后出国留学，会不会倒逼小学、初中传统优势教育的改变？仅举一例：据南京市委宣传部新闻发布官方微博@南京发布消息，2015年南京外国语学校的高三学生大概有470名学生，截至4月5日，有295人被美、英、法、澳、日等国名校录取，加上先期保送北大清华还有国内名校的名额，目前只剩21人需参加高考！'
  merge: -1
  img_proc: true
- pgno: 87
  md: '事实上，像北京、上海、广州、深圳这样追捧名校比较热的地区，往往也是优秀学生出国热的地区，名校高中高考前空班、空校的事实年年都在发生。在这样的变局中，小学名校一定是进入初中名校的通行证、初中名校一定是进入高中名校的通行证吗？况且小学初中都属义务教育阶段，都有可能在政府安排下各自划片招生。所以，小学名校不一定能保进入初中名校，初中名校不一定能保进入高中名校。


    第二个风险是，越是追捧名校的地区，学位房越是被炒得价格高的地区，往往也是户籍政策最封闭的地区，像北上广深，都对外实施严厉的户籍封锁。这种情况下，学位房的炒作基本上是在现有户籍人口中“体内循环”，而这些户籍人口的生育率越来越低，将意味着未来生源越来越少。而人们炒作学位房，其实是炒作配额，相当于花了一笔大钱，买了孩子的一个入学配额，并且几年后还可以把这个配额再卖给别人甚至以更高价卖给别人。但随着生源减少，配额稀缺性降低，学位房“配额价格”远高于房地产实际价格的一路高涨势头还能持续多久呢？


    这一切都需要炒作学位房的人们理性、冷静地進行思考，对于一个充满不确定性的东西，是否值得那么执着地去追捧。不考虑学位房投资回报，只是为了给孩子上个好学校而不惜代价的，不在此列。


