    D大城市内部，表现为多中心结构，金融区域集中区价值>高科技IT集中区域价值>文化创意产业、律师等服务业价值>高校价值。今天的中国高校，并不是智慧创造和技术创新的摇篮，教师收入也普遍不高（北京的西城海淀带着学区房和教师大量兼职者除外），因此，在大城市，高校普遍不能提升区域价值，从北京，到高校人数最多的武汉，莫不如此。高校充其量能够在消费上提升小城市区域价值，但这里的消费，主要还是来自学生的家长输血式投入。学区房在中国特别特殊，暂不予考虑。前三大领域，是城市价值的巅峰。传统历史文化街区的价值，处在金融之下的某个区间。各个城市会有不同。


