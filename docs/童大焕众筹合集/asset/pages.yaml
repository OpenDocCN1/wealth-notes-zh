  md: '第四，告别城市化中的民粹主义。一国之不可能实现均衡发展和一体化，区域内部也不可能实现均衡发展和一体化。此其一。其二，人口聚集必然会导致聚集区域高房价，这是市场规律的必然结果，任何人没有能力打压房价或者让人人都买得起人口高度聚集区域的房子。


    第五，交通拥堵和汽车尾气污染等城市病，不是因为人口太集中、密度太高，而恰恰是因为城市反对高密度、主张郊区化所致——它延长了通勤距离，加剧了城市对汽车的依赖。事实上，今天中国几乎所有大城市，建筑容积率也就是人口和建筑密度都远远低于新加坡、日本大阪和东京、中国香港和台湾，更不用谈低于美国纽约曼哈顿和芝加哥等地区。


    高密度大城市化是解决当下中国许多问题的总钥匙。观念不准则中国为之一新，观念不更新、政策不转向，则难免堕入中等收入陷阱。


    从社会发展的普遍规律来看，越是发达的国家和地区，服务业往往也越发达，其占国民经济的比重也越大，容纳大学生等相对高端人才的能力也越强。大学毕业生最适销对路的就业岗位就是服务业，尤其是现代高端服务业。然而，我国出现了一个异于正常社会发展路径的现象：经济越发展，服务业占比越低。国家发改委产业司副司长夏农曾表示，近年来，服务业增加值占GDP的比重持续下降，在2006年环比下降0.5个百分点后，2007年又环比下降0.3个百分点至39.1%。


    究其因，是服务业尤其是高端服务业过度垄断，导致那些原本最能容纳大学生就业的领域，就业容纳人数极其有限甚至不断萎缩。如电力、石油、电信、铁路、民航、金融等领域，始终没有能够全面向社会开放，甚至于“权力部门化，部门利益化，利益法制化”，行政主管部门给相关行业的准入设置很高的门槛，实为维护部门垄断利益甚至权力寻租，却美其名曰“规范管理”、“提高行业水准”……


    面对如此严峻的就业形势，我们必须看到，小修小补所能产生的作用是有限的。要从根本上为解决大学生就业难问题找到一条理想的途径，需要尽早下决心在一些领域迈出改革的步伐。


    # 为什么中国房价会是急剧分化的俄罗斯模式而非日本崩盘模式？


    20多年前，日本房地产市场一片火爆，卖掉东京的土地可以买下整个美国。


    20多年后的今天，中国的城市“贵”得也可以买下整个美国了。根据我们的测算，'
