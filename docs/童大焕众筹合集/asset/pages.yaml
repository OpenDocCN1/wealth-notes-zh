- pgno: 8
  md: '3 一味追求大房子，不知道买房要买的是特定的人口持续流入的城市空间。为了追求大房子，而钱又总是不够，就不断往郊区挪啊挪，把生命中大把的美好时光，浪费在了上下班路上的拥堵与汽车尾气中。


    独门独栋之类的大房子，其实是和农业生产方式相适应的产物。需要摆放农具，粮食，需要养牲畜，甚至需要室内空间来晾晒、烘烤、风干成熟的粮食蔬菜和果实，否则稀缺的食物会坏掉。


    现代人最宜居的房子并不需要多大。古代皇帝全国第一老大，他的卧室也不过 12 平方米，不是为了节约，而是太大住起来不舒服，能量场不够，镇不住。


    现代人的生活把接待、厨房什么的大部分都交给了社会，一个温馨的家，根本不需要多大的地方。


    4 资源有限论。农业时代，人类还不会利用资源，基本上跟低等动物一样完全依赖自然界。陈志武领衔的量化历史研究证明，人类是因为农作物产量的提高而带来人口增长的，而不是人口增长促进产量提高。中国的人口大幅度增长也是因为引进了玉米、红薯、土豆三种农作物，食物充足带来人口增长。


    布尔费墨在《为什么现代人类需要大城市？——城市的故事之一》

    （2016-07-04）中甚至写到：


    > “纵观人类历史，在农业产生以前，人类在地球的分布是极其稀疏的。为什么？因为原始人的生产方式决定了，有限的土地只能养活有限的人口。例如，在人类历史最漫长的旧石器时代（260
    万年前到 1 万年前左右），每平方英里土地只能养活一个人。例如上海内环线内面积 114 平方公里，现在居住着约 400 万人

    口。如果是旧石器时代，就只能居住 44 个人。相差 10 万倍。非常惊人的数字。


    > “要是一块44平方英里的区域的人口多于44个人怎么办？也很简单，杀掉。例如，旧石器时代的人会有系统性的杀死新出生的婴儿。人类学家 Marivin Harris
    推断，旧石器时代的人会杀死 23-50%的新生儿，以达到 0.001% 的人口增长率目标。而且，他们会更多地杀死女婴，以达到控制人口的目的。因为杀死女婴，限制了成年女性的数量，男人就会为了争抢生育资源而争斗，体弱多病的男性就会'
