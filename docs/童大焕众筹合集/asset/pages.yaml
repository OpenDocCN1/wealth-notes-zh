    +   4 **优化置换时，有舍才有得小姐：**


    童老师，最近在考虑置换，但目标小区这段时间业主捂盘，都不诚意卖，诚意卖的户型不太喜欢。请问是买个户型稍差点的，还是等等。有人说燕郊房价还会涨，让我明年初再置换。这段时间好焦虑。


