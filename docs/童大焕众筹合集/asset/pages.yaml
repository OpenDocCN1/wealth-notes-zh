  md: '# 3.2. 风险偏好增强，租售比飙升


    在经济形势不好的大背景下，低利率环境、货币超发提升了投资者风险偏好。资金先是大量流入金融市场，推升了金融市场的大牛市，在 15 年 6 月份股灾后，资金开始流入楼市，一线房价开始飙涨。


    租售比（房价/租金）类似于股市的市盈率，被广泛用来衡量房地产市场的低估或高估程度，也可以反映购房者的风险偏好程度。房屋作为一项资产，其最基本的功能是居住，所以租金是房屋所产生的收益，类似于股票的每股收益。


    房屋的买卖市场比较复杂，我们难以判断房价高低是否反映了真实的居住需求。但房屋租赁市场是相对市场化程度高、有效率的市场，所以租金可以作为反映住房市场需求的一个较好的变量。如果租金没有大幅变动，但房价大幅上涨，
    这往往预示着投资者风险偏好的提升。


    不过，就像我们不能直接拿 A 股的市盈率和美股、港股的市盈率去比较， 将中国的租售比与其它国家的租售比进行横向比较也没有太大意义， 所以我们这里仅作时间上的纵向比较。


    国际经验表明，租售比短期内飙升的楼市繁荣往往难以持续。一般房地产市场的租售比是相对稳定的，例如在 2000 年之前的 40 多年里，美国房地产市场的租售比基本维持在
    17-20 倍的范围内。但 2000 年之后受益于低利率环境、信贷政策等因素影响，租售比大幅攀升，从 20 倍左右一度上升至接近 30 倍。直到 2006
    年房地产泡沫开始破灭，租售比又迅速回到 2000 年的水平。日本、英国等国家的经验也表明，一旦租售比大幅飙升，偏离了稳定水平时，最终都会回到原点。


    中国一线城市租售比飙升，深圳堪称楼市中的“创业板”。从房价和租金涨幅的对比看，深圳的房价自 08 年以来上涨了 346%，而租金上涨不到 70%；广州房价上涨
    193%，而租金上涨仅 54%；北京房价涨 157%，租金涨 43%；上海房价涨 145%，而租金涨 88%。


    房价增速远远快于租金增速，导致的结果是 08 年以来中国一线城市租售比巨幅攀升，从 30 倍左右的水平，一直攀升到接近 50 倍左右。深圳的租售比从 29
    倍的水平提升到 56 倍，也就是说在深圳买一栋房子，要居住或者出租接近'
