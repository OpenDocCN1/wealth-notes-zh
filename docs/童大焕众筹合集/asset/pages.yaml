    2014 年 3 月 5 日，北京师范大学金融研究中心教授钟伟在《第一财经日报》撰文《楼市调控应转为防范房价下跌》：“如果无视现状，继续放大供给并以行政手段严厉限制合理需求，甚至贸然推出房地产税，那么泡沫破裂的风险恐怕难以避免。对中国政府而言，中长期视野内，防范房价下跌风险，远比严控房价上涨更为棘手和风险。”


