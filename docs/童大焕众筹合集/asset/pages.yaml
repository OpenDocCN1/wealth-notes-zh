    # 中国未来安全吗？


    我的答案是肯定的！今天的中国正处在百年未有的真正大变革关口，不论从执政管理者的知识结构、抱负，还是从技术改变的社会，抑或是从经济层面的内在约束，政治、经济、社会全方位决定了中国未来市场化、法治化是唯一出路也是必然出路。


    互联网颠覆了传统信息传播方式，强化了民众对权力的监督，使政府的一些错失得以更及时地得到纠正。另一方面大数据仍然掌握在政府和大公司手里，也强化了政府对某些反制力量的控制，传统的大革命已经失去空间。传统的小官吏、小商人、小知识分子中的激进革命分子不再具备长期酝酿革命而不被发现的可能。与此同时，自由市场经济、从乡土农业进入进入城市社会，饥饿导致农民主动造反或被动受激进革命分子所裹胁参与革命土壤也基本失去。


    中国自己曾经津津乐道的政府主导、国企主导型“中国模式”和“中国经济奇迹”，一定会因为官员的短期行为（国企主要领导本质上也是官员）而导致产能严重过剩和债务危机严重的问题，解决的唯一办法就是自由市场化、法治化。这个必将带来政府和权力内部的自我革命。即使最坏的一种情形发生，即权力上层所谓政变，也无法动摇市场经济和产权保护这个基本的社会稳定结构。


    同时中国已经加入世贸 15 年，世界经济一体化以及由于互联网带来服务业轻经济模式，难以被权力垄断和控制的创新型非物质生产成为市场创造力之源和经济增长的主要成分，产权和市场秩序的保护必将成为中央政府的根本职责。


    新技术、城市化、内部财政逻辑、世界经济一体，都共同指向一个更自由、更安全、更市场、更法治的未来中国。尽管道路曲折，前途依然光明。这是中国社会真正的千年未有之变局。'
