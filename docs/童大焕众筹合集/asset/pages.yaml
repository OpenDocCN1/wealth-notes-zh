    # 买房正确方法是从自己出发不是从房子出发【学员独家 注意保存和保密】


    买房过程中人们最常问也是最容易犯的错误是，总在纠结总在问：哪个楼盘值得买？哪个楼盘不值得买？


    其实，值得买的房子非常多，只是我们的钱永远不够；不值得买的房子也非常多，只是我们的眼力常常不够。因此我们不能只从房子角度出发，更应该从自己角度出发。正确的做法是，根据我们自己有多少首付，多少月供，在众多可选项目中寻找最配自己的标的房源。


    只从房子角度出发，往往会两个问题：


    一是这个房子是可以买，但是有可能超出了自己的能力，于是买不成。当下买不成也就罢了，只盯住房子的往往会因为配不上，而在观望、徘徊、犹豫、等待中丧失入市良机，甚至有可能导致“一步赶不上，永远赶不上”的末班车效应；


    另一种可能是：自己的条件和能力比匹配这个房子强得多，本来应该买更好地段、更高价值的房子，却被眼前这套房子抓住了手脚。于是浪费了自己的能力，没有将自己的资产做到最强、最大。


    因此，买房最正确的方法是遵循以下原则和步骤：


    +   1. 因为资性收入重要性远大于工资、劳务性收入，因此，从懂事那一天起，就必须坚定“今生一定要买房”的信念；'
