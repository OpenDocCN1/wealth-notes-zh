  md: '很多人担心杭州广州郊区楼价下跌和三四线及以下城市楼市成交量的下滑， 是不是楼市整体崩盘的征兆？在我看来，2014年一季度至上半年是多年以来对于楼市心理预期最为波动的时期，也差不多是最后一次预期大波动的入市好时机。如何在心理和市场波动期选择好天时、地利、人和的好项目，看大家各自的努力和造化。**大城市房价继续看涨，中小城市即使存在供应过量的地区，也未必完全没有机会。还是要看地段、项目和区域供需比、房
    地产资金结构等等。**


    接下来的楼市会呈现涨跌不一的长期分化现象，总体稳中有升，局部下跌。总体稳中有 升有几个坚硬理由：一是中国的城市化只完成三成，居民住房换代完成也极不充分。从
    QQ 大数据揭示的人口流向上，就会知道一线城市的上涨势头将会持续很长时间。而二三线城市房 价则取决于大量从一线城市回流的人群。正像我一再强调的“**大城市房价由外来人口决定，小
    城市房价由回乡人口决定**。在人口剧烈流动背景下，“**合理房价**”、“**房价收入比**”、“**租售比**” 等等都是伪命题。


    二是房地产与整体的金融、经济生死与共。各级政府包括中央政府比有房族更害怕房价 整体动荡和下跌。今年二三季度货币供应会不会适当宽松？这个可能性在八成以上。因为工业
    产能全面过剩、控制污染淘汰过剩落后产能背景下，根本不容许作为国民经济支柱的房地产长期 动荡。在服务业尚未成为中国经济主导产业的背景下，房地产是中国经济惟一救命稻草。两会上
    李克强总理作出的报告中，关于预算方面是一个赤字财政的预算报告。现在把经济增长的速度降 到7.5%，货币增长的速度在 13%（真实的可能会达到 15%甚至更高一些，因为我们的产出投入比已经徘徊在
    0.5 上下），它意味着货币超发必然会和我们形影相随。从数据来看，所有 新兴市场，特别是亚洲国家，超额货币的增长都会驱动房价上涨。友人问我：“前几天我高 中同学从深圳回来，反映实体经济主要是制造业很不妙。他是一家电子公司副总，主要是作为美
    的微波炉工厂、飞利浦小家电等生产电路板。他说美的小家电市场占有率高，是中国小家电的 晴雨表。以前，美的工厂都要开足马力每天加班加点才能完成订单，但是现在每周只开
    5 天， 而且 5 天都


    是勉强，其实 4 天就够了。还有，飞利浦上海公司，以前是我同学第一大客户，占公司毛利近一半，但是与去年一、二月比，飞利浦今年给的订单不足一半。请问，实体经济下滑，对房价何影响？”


    实体经济下滑，房价只能总体上涨（请一定记住在全国范围内是涨跌不一， 视各地供应量不同而定，但全国平均和总体趋势必须是上涨的），才能保金融、保经济、稳就业、稳
    社会。


    三是中国老百姓很多富余资金无去处，房地产是他们惟一抵御通胀和资金保值增值的 渠道。黄金投资大家都看到了，我去年初在凤凰时报《众议院》做的谈话内容再次应验，告别
    金本位以后，黄金是最没用的东西，不像翡翠、艺术品一样具有稀缺性和审美功能，黄金传统的 审美功能是完全附着在它“天然货币”的金融艺术功能上。只是文化习惯性很多人不假思索地
    追逐它。A股市场则是个道德基本面和经济基本面都不存在的权重圈钱工具和赌场，且小散 户永远赔不过大庄家——多年来我一再重复这个观点，可是总有人不愿意听，包括一些很近的
    朋友。'
