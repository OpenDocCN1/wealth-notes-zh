  md: '也就是说，未来世界，财富不由传统的资源来决定，不由权力来决定，而是由最聪明的大脑来决定。最聪明的大脑越积聚，人类的创新能力就越强，创新和财富的增长速度就越快。


    我们传统的房地产的地段决定论，是以权力和商业为中心的，以后要以商务为第一中心，教育和商业为次中心。很多时候教育和商业会慢慢成为商务区域的配套而存在。而权力中心，则是越到底层、越到小城市才越成为城市中心。是人决定地段不是地段决定人。比如有人把天安门当成北京的最中心，从政治角度可以，从房地产角度就贻笑大方。


    一个小区的价值在于房东，只有越来越有钱、有创造力的房东置换进入，这个小区才真正升值。商务中心由于有高价值的服务业，必然有高收入人群，而高收入人群不缺钱，缺时间，职住不能太远，交通必须顺畅。因此必定在商务中心附近产生稀缺的房产，也决定了其未来上涨的潜力。


    # 第二大思维陷阱：还在用“量入为出”观念应对人人都是货币发行人的“预支未来”时代。【别人为什么能够超越你十几年？】


    先从一个悲惨故事说起，这是 2016 年 6 月 30 日人民网报道的，标题是《房价涨房东毁约 举债 50 万买房的环卫工跳楼身亡》，文章说：


    黄颖的老房子在合肥老城区，一家三口“蜗居”38 平方米的空间，儿子已经 22 岁，夫妻俩琢磨着换套大房子供儿子结婚。


    2014 年年底，合肥房价还未猛涨，可选房源很多。2015 年年初，他们定下了包河区云辉阁小区，138 平方米大三室一厅现房，南北通透。夫妇俩与房主吴女士签订正式合同，约定以
    100 万价格购买该房。夫妻俩把生活了 20 多年的老房子卖了，学区房，总价卖了 30 多万，卖房款加积蓄能凑 50 万，再找亲戚朋友们借点，房款差不多够了。


    按照合同约定，黄颖支付了首期房款 27 万元，随后顺利搬进了未过户的“新家”。合同约定，首期房款付完后，须在 2015 年 3 月 20 日再支付二期房款
    63 万元，2016 年 6 月 1 日前再支付尾款 10 万元后，才能办理过户手续。由于经济困难，夫妻俩向房主提出二期房款延迟支付。'
