    B：只有人才是一切财富的依据！人口集聚和流入之地，即使全国 M2 增量为零甚至为负，房价也会上涨。反之亦然。


    2、刘晓博：只要国有企业和地方政府是中国的投资主体，中国大城市的房价就会上涨（人民币计价模式下）。


    XJW：大城市房价上涨，与投资主体无关。


    ZFL：这种观点是错误的，如果国有企业和地方政府是中国的投资主体，大城市的房价应该是上涨趋于缓慢。因为如果国有企业和地方政府是中国的投资主体，他们为了政绩就会无序投资，也就会带动较多的人就业，人们涌向大城市就业的愿望就不是太强烈，大城市房价反而上涨趋缓。好多国家国有企业和政府不是投资主体，他们大城市的房价一样在上涨。让民间资金在合法的情况下自由投资，他们多数会选择资金能发挥最大效益的大城市投资，能较强的带动就业，特别是高度企业投资，会吸引高智商人群聚集大城市，这样会推动大城市的房价上涨。


    ZX：大城市的房价是人口流入和集聚推动的，中国正在由以第二产业为主导的经济向以第三产业为主导的经济模式转变，而第三产业是政府无法作为投资主体的。


