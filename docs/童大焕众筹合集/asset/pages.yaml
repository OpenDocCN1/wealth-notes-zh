  md: '而其对外宣称的“产业开发模式”，无非是公共基础建设的 PPP（公私合营）模式而已！产业屁都没有，到头只是卖房！


    这类无情吞食百姓财富的恐龙，我相信用不了多久就会灭绝而亡。和那些靠朱相治下行政性垄断资源敲骨吸髓大国企，不出十年一个个陷入垂死挣扎一样。


    环深圳的东莞、惠州一带也很恐怖。2016 年 9 月 1 日，链家在深圳马可孛罗好日子酒店举办的“2016 大数据与深圳房地产市场走势高峰论坛”上，链家研究院深圳分院院长肖小平披露的一个数据也令人不寒而栗：“像东莞、惠州每年都是
