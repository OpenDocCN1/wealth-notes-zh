    223 平米万达西区户型，最高


    的居然疯狂地报到了 1534 万（2016年3月3日 变价），普遍报价在 5.8 万左右，而年前的成交价基本在 5.3、5.4 万。在我们推它之前，更有买方直接接
    1100 多万的报价压到不到 900 万。我准备给他晾一晾，降降温。【降低首付、降低税费以后，当下最火的是改善型和刚需住宅市场，而不是这类投资性或高端市场。】


    与此同时，链家中介也承认，“华贸，建外应该要平稳些。”（2016年3月4日 22：54 对话）。这难道跟我们这半年来没有推华贸、建外没有一点关系？


    事实上，经过年后十来天的观察，我认为建外 SOHO 已是区域价格最洼地。原因是：2009年底我买 SOHO 现代城的时候，建外 SOHO 价格比现代城高。现在已经普遍处于比现代城低的水平，而且基本上可视为区域最低均价。因此，从波浪起伏上涨的规律来看，建外已经是处在区域的价格最洼地。正是抄底好时机。


    2、“北京近几年涨幅最大的房产是学区房，有一种‘教育是刚需’的提法。”这个说法更多的是学区房交易更频繁造成的主观印象，没有严格的数据来支撑。同时就像炒股一样，外人看到的只是赚钱、赚大钱的，亏损的时候大家都闷声不响。因此，投资学区房亏损的大有人在。而且教育有自己的规律，学区房的政策风险也很大，因此我从来不把学区房投资作为主要对象。最多是兼顾学区房，而从不作为主要考虑因素。


    3、“金融街、中关村、CBD 这三大区域，老师最看好哪一个？对应 CBD 的万达东区和建议 SOHO，老师认为金融街、中关村分别有哪些项目的房子可以考虑？”都是代表未来方向的高端服务业集中地，三大区域其实都差不多，关键是有什么样的房源和我们的购买力正好匹配，匹配哪个就是哪个。相比于我对
    CBD 的熟悉程度，中关村和金融街我是相当陌生的，因此，相应的房源，还得麻烦您跟当地中介进行接洽。我跟 CBD 区域的链家中介求解，几天来他们都没能给我一个答案。


    从上述两大问题展开去，我们再来说说如何发现楼市价格洼地的问题。首先，价格洼地绝对不是地段与地段、区域与区域的分别。也就是很多人认为的：这个成熟区域房价已经这么高了，另一个新兴区域还很低，是不是可以抄底？绝对不是！这是一个生死攸关的问题。价格洼地只有在同地段中寻找。不同地段，完全不具备可比性，甚至只有可能呈现高者愈高低者愈低的马太效应。


    其次，同地段同小区甚至是同一楼盘，低价的也未必是价格洼地，而要区分到底是户型问题，人群定位问题，还是楼层等问题。


    第三，由于同地段不同社区价格轮翻起伏这么一种规律存在，价格洼地确实是一种客观存在。对于这种客观存在，必须从该区域不同楼盘的历史中进行考察，'
