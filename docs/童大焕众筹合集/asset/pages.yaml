  md: '的思考，才能让我们看见眼睛看不见的东西。在判断楼市问题上，城市化的自身逻辑和规律就是一个时刻时刻都必须置于优先考虑地位的大前提。为什么中国内地房地产成为全民最热的话题，什么人在谈房价，但是能将房产价格和价值规律分析到位和透彻的人凤毛麟角，包括很多著名的经济学家对复杂的房产发展规律也并没有把握清楚，为什么？因为其中的大多数人，缺乏对城市化规律正确把握这一生死攸关的全局视野！


    至于为什么城市化的逻辑和规律是大城市化，而不是许多人理想期待中和官方一直倡导甚至强行推动的“就地城镇化”？显然需要更多的数据、逻辑和事实来支撑，这方面，请同学们务必到当当或卓越网上购买我2011年出版的《世纪大迁徙》和2014年7月底即将正式上市的《中国城市的死与生——走出费孝通陷阱》。


    数据，尤其是总量很大的数据往往非常唬人，于是一些人拼命去寻找数据、挖掘数据，那样会显得自己很权威。比如有人去统计了长达六七十年的美国房价数据，然后编出曲线图，然后是恍然大悟的样子：哦，原来房价走势遵循如此这般多少年一波动的曲线啊！于是把它拿出来套中国的房价，什么时候快到拐点啦，什么时候涨多少什么时候跌多少啦等等。别看他们头头是道言之凿凿，其实讲的一点道理都没有。


    这个时候就要充分运用逻辑和哲学的力量了。哲学告诉我们，世界上没有两片完全相同的叶子，人不可能淌过世界上同一条河流——因为水一直在流动。同样的道理，世界上会有两条相同的房价曲线吗？房价走势就像河流，河流不走直路而走弯路（曲线）是常态，走直路不走弯路是非常态。为什么？因为前进过程中会遇到各种各样的障碍，不管是小溪还是大江大河，有些障碍都是无法逾越的，那就只有绕着走。每条河、每段路遇到的障碍，大小，力度都不一样，河流的曲线怎么能一样呢？所以，真正要思考研究的，不是拿一条过去的曲线来对应未来的方向，而是要仔细研究，前进的方向上会有什么障碍和阻力。


    要获得全局理性的思维能力，多角度获得事物全息图至关重要。人生也有涯，而知也无涯。宇宙、地球、世界、人生乃至于小小楼市，都是汪洋大海，我们每个人只不过是时间过客微尘一粒。我们每个人都站在独特的时间和空间的某个节点上，目力所及，决定了我们能够亲眼看到的东西不到百万分之一的万分之一。这就决定了我们每个人目之所见，都过不是一管之见，都不过是“偏见”，'
