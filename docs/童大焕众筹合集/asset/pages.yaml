    # 北京 CBD 核心某项目考察感想（学员独家 注意保存和保密）


    三个感想：1 房地产行业人才严重匮乏，这么中心的地段，定位始终盯住极少量高端人群；2 房地产定位除了宏观上没有研究城市化规律以外，微观上也远远没有发展到研究家庭和人口结构变迁上来；3
    只要深入学习和研究，房地产投资有无限空间，随时随地都充满机会。


    童大焕—2016 年 1 月 29 日星期五

    2016 年 1 月 28 日晚，一位微信网友 mariechen 问我：“童老师好，麻烦您请教问一下，梵悦 108，单价 7.3 万，可以考虑买么？谢谢您！"


    我说：“我有专文分析，也是我第一次进入房屋本身的定位分析。感觉它的定位可能会失败。这个分析只给学员和弟子，因此只能给你结论，不能够把分析的理由全部给你讲清楚。”“我原来是按它均价
    12 万起价 9 万做的分析。现在这是要降价的节奏么？降价同样尴尬甚至可能更尴尬。”


    这位网友头一天交了 30 万元的定金，选的是 2 层 LOFT 户型。听了我的意见，决定第二天去退定金。我说定金是不能退的，她说“可以退，昨天销售承诺了。明天就去退。”那就应该是订金而不是定金了。


    在上一篇学员独家文章《家庭结构变化与户型结构调整》中我专门分析了梵悦 108 的产品和客群定位问题，那是在没有实地看作品的前提下做出的判断。我也决定第二天（29
    日）实地考察一下该项目。出发前发了一条微博：“今天准备去微服私访某楼盘，考察它的定位。不同的（产业）原因，集聚不同的人群；不同的人群聚集，带来完全不同的区域房价。同样的区域，不同的人群定位，创造完全不同的楼盘价值。”


    我是 1 月 29 日下午两点多才从家里出发的，到项目地点不到 3 点钟，由于对那一带比较熟悉，而且项目本身也没有多少可看的东西，大部分楼层都还在改造装修，因此也就简单看了看一个位于
    22 层楼的样板间和一个位于 23 层楼的楼'
