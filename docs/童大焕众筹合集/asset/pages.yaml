    3%，1800 年时长长河里人均 GDP 只增长了 50%。但工业革命以后，190 年时间城市化率过半，人均 GDP 增长 8 倍）。随着农业产值在整个 GDP
    产值中的比例不断下降（2014 年中国第一产业终端产值只占 GDP 总量 9.17%。美国更是早就只占 1.2%——但它居然还是世界第一大农业国），不能用于工业和城市房地产的土地价值，总体上看，是不断相对下降的。农业时代，土地是财富之母；工业时代，资源是财富之母（含土地）；城市化和互联网时代，特定空间的土地和房产以及智慧是财富之母。'
