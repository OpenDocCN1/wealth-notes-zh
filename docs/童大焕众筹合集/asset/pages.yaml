    B 工业型城市高额的 GDP 和人均 GDP 同样支撑不了高房价。


    最典型如“世界工厂”的核心——东莞，和山西煤老板一样，老板们赚了钱都去哪儿啦？去相邻的深圳或广州，以及更远的北京上海买房了！一般工人和煤矿工人一样，是支撑不起当地很高房价的。


    工业型城市即使是再好的花园式厂房，也难免多少有污染和杂乱，最关键的， 是人口的密度不够，无法支撑起足够舒适和足够高密度的生活类服务业。随着现代大工业生产的大规模自动化、机器人化，工业型城市低就业、低人口密度、高产值、高增长的趋势还会加强。所以，对工业型城市楼市投资，要像对资源型城市一样保持足够警惕。


    C 物流交通型城市也支撑不起高房价。


    在农业和早期工业时代，物流交通往往是经济的枢纽。甚至城市的兴衰都由此决定。因此，港口、码头、火车站、汽车站附近往往是城市最繁华的地带。


    但是今天我们会发现，很多城市，不仅是大城市，甚至于县城这类火车站、汽车站、码头附近的房价反而涨不过其它区域和地段。这是为什么呢？很多人百思不得其解，很多人还在追逐这些地方。


    这是因为，随着科技进步，人类的生产生活方式已经发生了革命性的变化。先是农业的重要性降低，接着是工业的重要性降低，服务业成为社会主流行业， 站到历史舞台的最中央。以往那些最繁华的车站、码头，如今反而成为杂乱和治安混乱的代名词！


