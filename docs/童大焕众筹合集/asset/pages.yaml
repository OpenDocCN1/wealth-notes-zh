  md: '从自己角度出发。正确的做法是，根据我们自己有多少首付，多少月供，在众多可选项中寻找最匹配自己的标的房源。


    只从房子角度出发，往往会出现两个问题：


    一是这个房子是可以买，但是有可能超出了自己的能力，于是买不成。当下买不成也就罢了，只盯住房子的往往会因为匹配不上，而在观望、徘徊、犹豫、等待中丧失入市良机，甚至可能导致“一步赶不上，永远赶不上”的末班车效应；


    另一种可能是：自己的条件和能力比匹配这个房子强得多，本来应该买更好地段、更高价值的房子，却被眼前这套房子捆住了手脚。于是浪费了自己的能力，没有将自己的资产做到最强、最大。


    因此，买房最正确的方法是遵循以下原则和步骤：


    +   1. 因为资产性收入重要性远大于工资、劳务性收入，因此，从懂事那一天起，就必须坚定“今生一定要买房”的信念；

    2. 坚定“人屋分离”、“你买的房子给别人住，别人买的房子给你住”的信念。服务业时代和工农业时代一个重大区别就是：人的一辈子，在不断变换工作、职业和地点，但是，资产一定要配置在匹配自己的最理想的、有升值空间的地方，让它成我们纵横四海的“根据地”和“生蛋鸡”，或者更干脆说那就是我们的“印钞机”，而不是房子；

    3. 任何阶段，都不能等筹足了首付才来买房，而是有足够的月供能力了，就要尽可能把余钱用月供的方式“花出去”，作为撬动银行杠杆的支点，承担起以一当十当百当千的做强大资产的任务。要让钱帮我们挣钱，不能总是让我们时间和生命为我们挣钱。以平均
    25 年贷款年限计，5800 元月供能力就能撬动 100 万元的资产，加上房租，总价 180 万房子 5000 元计，5800 元自有月供给能力可以扛起 180
    万贷款，加上首付，呵呵，总资产 200 万打不住吧？！也就是说，5800 元月供事实上平均可以拉动 200 万以上资产！多少倍？344 倍！

    所以，一旦有了一定的月供能力，拼了命也要去用尽各种办法筹集首付，千方百计买下人生第一套房。


