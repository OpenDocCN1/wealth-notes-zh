  md: '“谢谢。环北京地区除了燕郊我都不看好。所以恐怕只能以后寻找别人（笔误，‘人’字应该去掉。）的机会。”


    “燕郊也还要看地段。”


    …………


    “以后吧。你说的这一切我都明白。但是我更清醒的是，不管房子有多好， 不管开发商多牛，不管今天多火热，到二套房的时候、到真正入住的时候就歇菜了。因为有一个无法逾越的东西，那就是通勤时间。我想提供给顾客有终极价值的东西。有些可能你一时半会不一定会理解，比如时间决定空间价值。”


    “我知道绝大多数开发商也不懂城市化。但既然我已走到这一步，比一般人更深刻地理解了城市化，那就孤独一点不跟风也没关系。”


    不知者不为过。但如果明明自己认为不对的事情还要去做，那是不道德的。也是要受到上帝（自然规律的）惩罚的。不遵 守万事万物运行之“道”，那就不可能有“德”，道之不存，德将焉附？


    有人说：你的“环大都市鬼城圈”和大都市圈理论相悖。


    我说：一点都不相悖。我们的大城市化理论是这样的：中国（几乎）所有的城市都要在版图面积上收缩，人口则在向城市内部集中！！！


    他说：人口集中也有上限，然后向卫星城溢出，案例：东京都市圈的 3700 万人口如果都集中在东京市区会怎样？


    我说：溢出严格受通勤时间限制。


    在大都市，主要产业即各种服务业是收缩的、不外溢的，人口基本上是在都市核心区就业，所以居住性外溢的界限取决于其与核心区之间的通勤时间。


    有很多人说，我只是投资，只是短炒。但不论从道德良知还是从投资智慧的角度，这样做都是不对的。你自己都不想要的东西，想长期留在别人手里，既不道德，也不明智，不现实。刚开始还没交房的时候是基于想像，人们会趋之若鹜，
    这也就是很多海景房山景房环京房等一手房能够热销的原因。这一切是基于无 知，基于理性思维的稀缺，基于没有亲身体验没有切肤之痛的美妙想像。'
