  md: '股市利用的就是人性中最顽固的贪婪和赌性。每个人都认为自己能控制自己的贪婪，平时诸如《控制欲望》之类的心灵鸡汤也会到处传播。但是一到自己真正面临诱惑，没有几个人能够站在理性、全局的立场上真正战胜自己。


    2015 年 5 月 27 日财新网贝乐斯写的《泡沫又熟了》如是洞穿人性的弱点：

    人类总认为自己有自主自由，凡事自己决定，殊不知很多时候人是自己潜意识的奴隶，投资更是如此。大脑的伏隔核（Nucleus Accumbens, NAcc）推动人类寻求回报。试验发现，当一个人的投资获得良好的回报后，大脑的伏隔变得兴奋，促使人变得更贪婪，寻求更具风险的投资。一旦参与泡沫，开启了潜意识的贪婪，人就彻底沦为了自己潜意识的奴隶而无法自拔。大多数人不能逃顶可能不是看不到风险而是人性使然。在泡沫运行了一段时间后，大部分人的大脑伏极极其兴奋，主导了人的行为，愿意冒更大的险，从而无法摆脱自身的命运。顶不是技术上的难题，而是人性的死穴。索罗斯参与泡沫但总能出来，但他要看心理医生。想要不做潜意识的奴隶，唯有理性与原则。但市场如此狂热的情况下，积极参与其中者谁也不可能保持理性，坚持原则。


    > “目前的 A 股，存在着明显的反身性循环。实体经济不好，造成货币派生下降，资本外流，造成外汇占款减少，基础货币不足。为了应对，央行只能放水注入流动性。而由于实体经济回报不佳，流动性不会进入实体经济却进入了股市，推动股市上涨，获得高回报。这样一来，反而抽走实体经济中的流动性，也让居民存款搬家到股市。实体经济的流动性进一步紧缩，央行进一步释放流动性，流动性进一步流向股市，获得高回报，如此循环往复，直到股市一飞冲天。正因如此，股市才会在经济不好的情况下牛气冲天，而且是经济越不好，股市涨得越高，不断从实体经济中抽血获得动力。”


    > “泡沫面前，任何理性的分析都显得苍白无力，任何警告都会被视作踏空者的抱怨。就在众人狂欢之时，泡沫却已经悄悄成熟。”


