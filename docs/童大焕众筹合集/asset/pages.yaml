    02 年开盘 8000 多，现在五六万，近七倍。珠江帝景最早 03 年开盘，7 千多，现在也 5.4 万左右，近 8 倍。珠江帝景这两年也有了陈经纶中小学。不过北京人说起学区房，基本是西城海淀。尤其是万柳学区房价涨得快，中关村一小二小三小。世纪城人大附小学区房不如万柳价高。


