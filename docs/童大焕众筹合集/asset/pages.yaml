    事实真的如此吗？权力真的能够如此万能吗？答案是 100%的否定。最典型的例子是当代中国政府最有钱的十年里（2003-2012），政府大手笔规划了一个曹妃甸，并作为"河北省一号工程"，国务院决定首钢整体搬迁曹妃甸，并指望将其作为继珠江三角和长江三角后中国发展的第三个极，带动环渤海地区新一轮大发展。但是在十年
    3000 亿元人民币真金白银砸下去以后，等待它的却是又一座超级大空城大鬼城的命运！事实上，过去多年，各级政府主导的城市化进程，制造出了无数的空城和鬼城。


    这都是不尊重规律、不尊重知识结下的恶果。曹妃甸太远了，根本超出了现代大都市圈所能忍受的极限范围。同样，保定也太远了，严重超出了现代大都市圈所能忍受的极限范围。姑且不论"政治副中心"本来就是个虚幻概念，就是政府权力霸王硬上弓一定要在保定搞"政治副中心"，最后留下的也不过是一座新的空城和鬼城。


    （2014 年底，一位网友不听我的坚决劝阻在浙江德清郊区花 757 万买了座整个小区只有 41 栋的绿城别墅，说什么离杭州高铁 11 分钟，开车 20 分钟。我说你那个是断代产品——将来女儿不要，卖也卖不出去，自己住，新鲜几个月就如同鸡肋，买一棵葱都得开车出门。这是有钱任性的一个表现。——大焕
