  md: '**敢于和善于甄别学者的优劣。**每个人在生命旅途中都要善于借力，最大的借力是借势，借时代潮流之势。要看清时代潮流，就要借知识之力，借知识要特别善于借专家的知识，真正的专家，他们往往代表了行业的最前沿最先进思想。什么样的专家是好专家？什么样的学者是好学者？不是最受政府器重的学者就是好学者，也不是最受群众拥戴的学者就是好学者，更不是声音最大的学者就是好学者，更不是说的话符合你愿望的就是好学者。先举几个例子，再来说明问题：


    举例一：我的朋友乔木有一则微博写道：“中央请了些经济学家开会，召集会议的不是主管经济的总理，而是组长老大，有点意思。更有意思的是，来的人里有个叫胡鞍钢的。前些年总理朱回清华，校方安排了教授座谈，某个人侃侃而谈半天。朱说，你就是胡鞍钢呀？外界都说你是我的顾问，今天总算是见到真人了。”很显然，这个用“集体总统制优于一人总统制”对上谄媚、又用“我是总理顾问”欺世盗名的胡鞍钢不是真学者。


    举例二：金岩石有一则微博说“林毅夫先生是中国经济学大师级的人物，但他的两个著名观点令人难以苟同：1，中国经济还有 20 年保持 8%左右增长速度的潜力；2，完善的市场需要有为的政府。关于（1）：经济增长潜力的主要决定因素之一是劳动力供给，难道中国人生长不老吗？关于（2）：政府干预市场是由于市场不完善（市场失灵）还是相反？”


    林毅夫简直可以说是凯恩斯主义的中国代言人，他主张政府投资刺激经济的理论，估计哪个政府都欢迎——又能体现政府很有能耐很伟大、主政官员又能大幅度从中渔利（名也是利的一种），谁不喜欢呢？在上一届政府任上，林毅夫不仅是政府座上宾，而且被政府推到世界银行副行长的位置上，应该是了不起的经济学家了吧？但我要告诉你，他出的主意只会对政府和官员有利，未必对老百姓和国家的长远有利。我说，因为林毅夫
    1、2 两个重要判断，他就只配得上渺小称号而配不上伟大了。有人说：“童老师在经济学领域还是应该尽量谦虚些。林毅夫老师的观点您全面掌握了吗？”我的回答用的是“全息思维全列判断法”：政府主导一切，产业政策、城市化等等，后者致空城鬼城无数，前者致产能严重过剩。而政府行政主导的国企垄断，则制造了大量的腐败低效和社会分配与价格不公平。在一个政府过度干预市场甚至严重破坏市场的环境里鼓吹政府干预，这样的东西要怎么评价？无非是“迎合上意”四字。林毅夫可以称之为“水面经济学家”，无尽现也。大方向错，停留在术的层面上的专家政府的短期政绩、思考
