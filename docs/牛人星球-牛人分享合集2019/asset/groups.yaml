    为什么我们会做一个吵架训练营，大家都知道夫妻之间不可能不吵架的，吵架这个话题其实是一个非常巧妙的点，帮助用户能够进入到这个流量池里面，因为婚姻情感危机、婚姻的小三问题或者是婚姻的破裂这些话题对任何人来说都会有很大的戒备心，我买了婚姻问题课程，进入这个群其实代表的就是我的婚姻有问题，其实很多人是不愿意把这个展示给别人看的，所以我们非常巧妙的用了“吵架”这个词。这样的话，用户会放心的进入这个微信群。


    这是我们在选题上的一个技巧，做完选题之后，我们在课程的设计上也做了一些技巧。


    这里而涉及到很多很深层次的心理学原理，我就不说了，如果大家有兴趣的话，可以去看一看心理学的书，去了解一下心理需求。


    我简单说一下，我们在这 7 天的课里面，设计了很多帮助用户找到维护婚姻稳定的需求点的地方。比如我们让他回忆婚姻的过去，能够帮他唤起对于婚姻的向往，比如让她回忆跟丈夫在生活中的点点滴滴，会唤起她对婚姻重修于好的想法。


    但是只做了这些还是不够的，因为有想法之后，很多人还是没有付费的意愿，我们会通过一些设计让她有很多的冲动消费。


    打比方，我们有一个打卡的环节，是晒出自己跟丈夫的照片，这时会出现一个非常两极分化的情况：好的家庭她跟丈夫是非常甜蜜的，哪怕吵架也是甜蜜的；不好的家庭吵架是非常现实的，而且是毁灭性的。当一个女生想要挽'
  - '[PAGE 84]


    回她的婚姻和情感，同时看到别人家的婚姻比她幸福的时候，她内心会产生一个很强大的冲动需求，就是我也想要获得一个好的婚姻。当我自己觉得无能为力的时候，我会去寻求别人的帮助。这个时候她会去主动找我们的咨询师，而极大地促进她去购买这个服务。


    关于产品的设计环节，还有很多细节，由于时间关系，我就不一一展开讲了。有需求的朋友可以私聊。


    总的来说就是两个地方：第一，你要理清整条完整的需求线，这个需求是现实生活中存在的刚需市场，用户极其愿意去买单的。第二，就是你的产品线要在整个运营过程中去设计，形成帮助用户去找到需求点，并促进他产生消费行为的运营手法，这样才能更好的做转化以及去唤醒他的需求。这两点在产品设计中起着比较重要的作用。


    我们开始讲第二部分，从低客单价转化到高客单价背后的原理和条件。


    在我做产品设计的讲解过程中，已经把这个成立的条件和原理简单的讲了一下，这里我再去跟大家深度讲解一下。


    我们思考一下之前在百度出现过一次非常重大的问题，有一个贴吧叫“血友病吧”被卖给莆田系医院去运营。为什么这个事情会闹得如此大的动静。除了一些竞争对手的打击之外，为什么反响会这样的强烈？


    如果你把这个问题思考清楚的话，你就能找到从低客单价到高客单价的条件和原理了。


    为什么我们会去百度？当你遇到什么情况的时候会去百度。


    我要注册一个新的公司，我需要考研，我需要去治疗一个困扰我很多年的病。


    当在生活中出现问题的时候，我们会去寻求解决这个问题的方法，除了去问身边的人之外，我们会寻求于网络，这就是百度为什么能够成为这么大的广告公司的原因。


    当我们去百度一个问题“如何创办一家公司”，这时如果有一家办公司的中介突然给你打了个电话“你是不是要办一家公司呀？我们可以给你提供办公司的一些服务，价格还很便宜”。你对比了一下跟市场的价格差不多的时候，我相信你会乐意去购买这个服务的。因此百度就变成一个信息和需求收集并对接满'
