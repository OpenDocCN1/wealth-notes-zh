    # **公众号深度写作方法**


    分享人：何加盐


    分享时间：2019 年 6 月


    本文是何加盐公众号写作与运营课的文字简化版，回顾了他公众号 3 个月做到 9 万粉丝的过程，并梳理了公众号深度文章写法，是一篇公众号发展和深度写作手把手的指南。1
    万 4 千字，全是干货。不管是对于做公众号，还是学习深度写作，都有很好的借鉴。


    各位星友，大家好，欢迎来到牛人星球！咱们今天是第一期分享，有些事情我也想先跟大家说一下。首先是特别感谢大家对何加盐以及牛人星球的支持，我们牛人星球现在刚组建不久，大部分朋友都是这一两个星期才加入进来的，星球里面目前文章内容还不够多，希望我们今后一起来创造。


    有些朋友可能刚进来会觉得，里面好像没有太多文章，其实这需要我们大家一起在未来 300 多天的时间里共建一个好的星球。以后，如果大家看到牛人星球里好的文章，也可以分享到朋友圈或者微信群，让更多的人能够加入到我们。因为一个社群，它链接的人数越多，价值越高。


    现在我们正式开始分享。


    今天分享的主题是“何加盐公众号写作方法”，实际上我这个写作方法应该叫做深度写作的方法，大家也可以看到何加盐公众号的文章和一般公众号的文章还是有点不一样的，我的文章内容会比较深度，文章的长度会比一般的公众号要长很多，一般都是
    1 万字左右，有些甚至到了一万五六千字，所以我们叫做深度写作的方法。


    首先，我对自己作一个自我介绍。这个介绍呢分成两个部分，第一部分是何加盐的过往经历，第二部分是何加盐公众号的发展经历，我们先简单介绍一下我自己过往的一些经历。


    我会从这三个角度来介绍我的过往经历，分为三段，第一段是在政府部门工作了十年，我是从事国际经济与政策研究，去年二月份的时候出来，开始做一个咨询 公司，这个咨询公司主要是从事企业战略，商业分析，组织架构以及'
  - '[PAGE 4]


    薪酬与激励机制的设计，这个两段工作对我后来写公众号也是很有帮助的，今年三月份以后，我发现自己的特长在公众号方面更加的凸显，所以我就开始写公众号。


    之所以会有何加盐这个公众号，最初其实是为了给咨询公司招新人的。因为咨询是一个流动性特别强的行业，时刻都面临着招揽新人才的需求，我当时就想我可以写一个公众号，写一些年轻人喜欢的，尤其是那些上进的、热爱奋斗的、喜欢成长的年轻人喜欢看的东西，这样我可以在身边聚集一大批的年轻人，今后我这个咨询公司随时需要人才的时候，就可以从这个人才库里面挑选。这是当时的一个起源，这跟我在牛人星球里写的酐玩实验室有一点类似。酐玩实验室也是为了给他们的无人机社区引流，所以才开始写公众号。


    我和酐玩实验室的例子可以说明一个道理，就是有时候我们是无心插柳柳成荫，说不定你为了你的主业做的一件事情，或者你因为兴趣爱好而做的事情，会长成一个比你的主业还要大的参天大树，甚至会成为你的新主业。所以如果你有一些别的特长，最好是能够让它发挥出来。


    这个号的第一篇文章是去年的 7 月 21 号，当时因为高考招生刚结束，有很多朋友就在问我，高考没有考到心仪的专业，没有考到心仪的学校，该怎么办，我就写了公众号的第一篇《致高考生：心仪的学校和专业抛弃了你，但人生并没有》，那是第一篇，当时我的粉丝基本上是
    0，也没有做任何营销，就是在自己的朋友圈，微信群里面发了一下。


    后来写到第五天的时候，当时就有一件热门的事情发生，就是拼多多上市了，因为我是浙大的，正好之前也对拼多多的黄峥（他是我们师兄）有一点点了解，那天上午他还没有上市，我在校友群里面看到有人在讨论，我觉得这个事情值得写一写。正好那时候在研究弱关系，我一看他的经历，其实很适合用“弱关系”这个现象去解释。所以我就写了《拼多多上市，80
    后创始人 28 个月做到身家 800 亿，凭的就是三个字》，这三个字就是讲弱关系的，然后那篇文章突然一下子爆发，第二天就达到了 30 多万的阅读，现在已经接近
    90 万。当时带来了大概 13000 个粉丝。


    当时本来是写着玩一下的一个公众号，就是因为这篇文章，让我觉得写公众号可能对我来说还是挺适合的，所以我就慢慢的坚持下来了，但是因为我的'
  - '[PAGE 5]


    主业咨询工作特别特别的忙，所以只能挤出很少的时间来写公众号，一个星期大概也就是两三个小时，写出来的文章质量在我自己看来不是很满意的，所以文章阅读量也不是特别高，一般就是两三千，吸引来的新关注的人数也不高，这样持续了三四个月的时间，粉丝也就增长到18000。


    然后就到了过年的时候。过年放假，有更多的时间用在写文章上，可能很多人都看过我当时写的那篇文章《浙大郑烨：一位寒门状元的重生》，那篇文章在我的公众号上阅读量不是特别高，就57000多，但是它在社会上影响特别大，包括新华社、人民日报、共青团中央都转载了。另外，中央电视台也专门为这篇文章做了一个专辑，就是派了《面对面》节目组去录了一个18分钟的节目，可以说社会影响力非常之大。这篇文章让我意识到我可能在写公众号这方面比做咨询更擅长，也更加适合自己的爱好，所以从二月份开始，我就在思考要不要专职的做公众号，后来我就下定了决心转型了。


    大家可以看到上面这都是当时的一些媒体和组织转载的截图，还有一些像我们从小读到大的读者、青年文摘、意林等杂志也全都转载了，这让我对自己的能力和未来写公众号的前景很自信，所以从3月3号开始，我就基本上专职开始写作了。到3月12号的时候就写出了《比抖音让我们堕落更可怕的，是今日头条让我变傻》那篇文章，当时那篇文章传播特别快，三四天就达到了30多万，可以说是带来了一个小高潮吧。不过因为那篇文章批抖音和今日头条比较狠，所以今日头条他们公司就在后台投诉我侵犯他们商誉，还威胁说要采取法律手段，因为那时候我完全没有经验，也不知道怎么处理，大概四五天后，我就把那篇文章删除了，其实特别可惜，现在看来话，那文章是没有任何问题的，因为当时没经验就删掉了，删掉的时候阅读量是30多万，那个时候它每天都在给我带来两三千的关注，所以一下子就把我的粉丝数量拉到了四五万。让我有了一个很好的专职做号的发展基础。


    再后来就是4月7号的时候，我写了《拼多多的黄鹂和淘宝的蒋凡打起来了，美团的王兴在起哄》这篇文章，这篇文章是我第一次尝试写这种深度的商业分析，它的阅读量现在已经99000多了，很快就十万加了。这篇文章也流传很广，据我所知很多企业家都看到了，它让宗庆后的女儿宗馥莉关注到了我，并且主动联系让我去写一写她。从这篇文章之后，我就开始从写个人成长、认'
  - '[PAGE 6]


    知、思维提升这一块转向研究企业和企业家了。


    所以大家可以看到我现在主打的一个个人定位，是一个专门研究牛人的牛人。我也还是会写一些认知和思维提升类的，但这些也是跟研究牛人的结果密切相关的。所以我的定位也是经历过前面很长时间的一个摸索，才最终确定下来的。后面就写了《张一鸣和他的流量帝国》、《猛人思维》、《美团王兴，四十不惑》、任正非、孙宇晨、李想这些，引起的反响都特别大，让我比较高兴的是我写的这些人，他们基本上都会看到，因为有很多人会特意发给他们，像王兴，他就评价写得很酷，这个让我特别开心。


    我从3月3号开始到现在6月27号，三个多月的时间，粉丝从2万增长到9万。这个也算是今年公众号领域的一个小奇迹，可能就仅次于卢克文了。


    第一部分是介绍了一下何加盐公众号的发展情况。第二部分，我们就来讲一讲公众号的未来发展形势，首先我们看一下，未来公众号有没有前途？因为很多人都说公众号的红利已经完了，15年16年一个号很容易就做起来，那时候做到几十万，上百万的粉丝都是很容易的。像我这样的文章，如果是在15、16年，现在估计早就是百万粉丝了，而我今年做到现在也才九万多，估计七月份可以超越十万+。这已经创造了这一年的奇迹了，从这个角度来讲，公众号的红利是不如以前的。但是我们可以认为红利完了吗，这个等一下再回答。


    第二个就是高维打击会不会来。什么叫高维打击呢？大家都还记得，大概十几年前，网络是BBS论坛的时代，校园BBS、天涯、猫扑、凯迪，这些都是特别火爆的。可是新浪博客出来之后，这些都死掉了，新浪微博出来之后，新浪博客也死掉了，新浪微博大概在12、13年达到顶峰，等微信红起来之后，它也开始衰落了。现在是快手抖音在跟公众号竞争，那么，像类似于之前博客取代BBS，微博取代博客，这样的一种高维打击会不会到来呢？很多人也是有这样一个担心。


    我觉得问题的关键就是在于我们这里列的第三个问题：深度内容还有没有需求。大家可以回想一下，你一般看长文章是在哪里？根据我的经验，大部分人看深度的文章，都还是在公众号，可能有一些是在今日头条，但是比例还没有那么大。我个人认为只要人们还有深度阅读的需求，公众号就还会存在，因为目前它是看深度文章最方便的一个渠道，我们每天大概十几个小时，手机都


    ![](img/74d384fc5d948a0c31090e035208669c_6_0.png)


    **公众号 懒人找资源**'
  - '[PAGE 7]


    会在旁边，我们每时每刻都会拿起微信打开来看，只要你随时随地有看深度文章的需求，你一定会通过微信来看，从这个角度讲，我认为五年之内微信公众 号还是很有发展前途的。


    刚刚说的是纵向的，那横向来看，微信公众号跟其他的自媒体相比的发展怎么样呢？


    现在快手、抖音、今日头条、还有一些直播都发展的很快。B站这种弹幕网站也发展得很快。知乎是个老牌网站了，但是现在开始衰落了。微博也还比较红火，但它更多的是侧重于社会新闻以及娱乐。对于这种深度的文章，我们一般还是在公众号上看。


    上面我说的所有这些，它们都有各自领域的发展，也都发展的挺好。但所有的这些平台，包括百度的百家号、一点资讯的一点号，还有企鹅号等等都有一个很大的问题。


    它们的共同特点就是，对于内容创作者来讲，变现特别困难，它的商业模式可能考虑不够清晰。微博还稍微好一点，但也是要超级大V才能赚到钱，直播能赚到一些钱，其他的平台一般的人都是赚不到钱的。


    只有在公众号，你粉丝达到五万十万就能够有比较好的变现了。我们看到在其他所有的平台，那些做的比较好的号都会往自己的公众号来导流。比如说知乎的大V都会在底部有一个“我的公众号是某某某，欢迎关注”。因为他必须得把他的粉丝引到公众号来，然后通过公众号再进一步一些商业化的变现，这样是最方便的。所以其他号，发展好也只是为公众号引流而已，所以那些平台也在拼命想各种办法限制住公众号导流。


    接下来我们讲一下，做好一个公众号之前要做一些什么准备。我觉得最重要的准备就是把你的公众号做好一个定位。这个定位是一切的基础。我之前有很长一段时间，就是从拼多多那篇文章到寒门状元的那篇文章中间那么长时间，大概有五个月吧，文章写得很好，但是粉丝增长的很慢，其实就是因为定位不清楚。


    我认为公众号定位需要考虑这三个方面的问题。第一个是你的目标人群是什么，像我写认知的，那可能就是对认知的提升有一定需求的。这种人群的分类有一些是专门针对女性情感的，有一些是针对少儿教育的。我现在写企业'
  - '[PAGE 8]


    家，就是针对企业家、高管、创业者和希望变成牛人的这个群体。


    第二个定位是你的内容要定位好。你是提供信息聚合类的、还是提供观点类的、还是有价值的干货、或者是情感共鸣类的、或者是幽默搞笑类的。你一定要定位清楚，你的内容是什么。像我的内容就很清晰，我是人物经历以及成长认知的干货，主要是这两类。像情感类的我就不是很擅长，前面写过的情感类的文章，基本上流传都不是很广，后来我就不写了。


    第三个是风格的定位，你的风格是偏幽默风趣、还是嬉笑怒骂、还是强烈的批判、或者是像咪蒙一样带动情绪、或者是理性分析。我的风格可能就是偏理性派，偶尔带一点点小幽默这样一种风格。所以你要写一个公众号的话，一定要自己鲜明的一个风格。这样大家一看到你的文字，就知道是你。如果换来换去，读者可能会无所适从。他们不能预期从你这里能够看到什么内容，得到什么，他们是没有一个动机来关注你的。你必须得给他们一个明确的预期，并且不断地符合这个预期，他才会关注你，并且持续的关注。


    接下来就要进入到开始写作前的一个准备了。我们写每一篇文章，一定要牢牢的记住三个目标。我们的文章为什么要写呢？你写出来其实是为了让别人看，就是你要诱惑大家点击进去。可能诱惑这个词用的会有点偏贬义，但实际上我们的意思就是让更多的人来点击。诱惑点击一般跟三个因素有关。首先是标题要起得好，一看就让人有点击的欲望。第二个有一些标题起的也很平实，但是如果很多人都在转发，是刷屏的，你在朋友圈里看到别人发了五次十次，你肯定也会好奇到底写的是什么，会点进去看。第三个是品牌信任，即使这个标题起的一般，但是是你喜欢的公众号作者写的，你也会点进去看一下。


    写文章的第二个目标就是要促进大家去分享、转载我的文章。因为一篇文章要流传的广，一定是需要大家来转发转载的。我们转发到朋友圈，转发到微信群，转的越多，或者点在看越多，这篇文章最后的阅读量以及增长的粉丝数可能就会越多。


    促进分享它主要是跟这么几个因素有关。第一个是我们去分享的动因是什么，大家可以想一想你发朋友圈，第一个需求其实是向外界展示你自己是一个什么样的人，所以是展示自我。展示自我一般会有这么三个需求，首先是求得一个身份的认同。'
  - '[PAGE 9]


    我举一个例子，假如你是摩羯座的，然后你看到一篇文章写《摩羯座的女人是世界上最好的女人》，作为一个摩羯座的女生，你可能就会很有动机去发。或者你是湖南人，你一看《湖南人是中国历史的功臣》你可能也会去发。这儿有一篇刷屏的文章，可能有几千万的阅读，它的标题叫《广东人真是太太太太太好玩了》，那广东人点进去一看，把我们广东人说那么好，大家都纷纷的转发。还有就是学校、公司、年龄、喜好的，都是身份认同的各种不同的情况。比如说《九零后，你看不懂》或者说《我们零零后跟你们不同，你不要用老眼光来看我》那九零后，零零后的人可能会分别转发。


    第二个是形象的彰显。比如说有些文章，它其实是为了给别人提供一个炫富的机会。我们在五星级酒店住一下，在高档西餐厅吃个饭，会发个朋友圈，其实这是一种炫富的需求。还有一些是为了善良的需求。比如说我看到一篇文章是讲人要做好事的，人要善良的，我发出来其实不是因为我要劝别人善良，而是要告诉别人，你看我认同这种观点，我是一个善良的人。还有一些，我今天跑了十公里、我今天背了100个单词、我今天看了一本很难的书，类似《资治通鉴》或者是《物种起源》这样的。那是展示我是一个坚强的、乐观的、上进好学的人。我们的文章要给别人展示这些形象的一个机会，他们才会去转发。


    第三个转发的动因是展示他的品味。我们可能在朋友圈会说一下，我喜欢的某个明星，或者喜欢哪个作家，其实是展示我的品味。这个品味有可能是时尚的，像我们关注的一些号，它是时尚号，我很认同，我会经常转发它的东西。有些是文章很理性，或者说看问题特别深刻，或者是特别幽默风趣。只要一篇文章能够给别人提供一个展示他品味的机会，他就可能会帮你转发。


    上面说的是展示自我的需求。第二个是抒发情感的需求。


    首先是愤怒。有很多文章是引发我们愤怒的情绪促使我们转发，比如说《疫苗之王》，我们看完之后就会觉得特别愤怒，忍不住去转发。再比如，有一个叫烧伤超人阿宝的，他会经常代替医生写一些愤怒的文章，医生群体都会去转发。因为他帮他们说出了愤怒的这种感情。


    第二个是恐惧，恐惧是最常用的。我们看过很多这样的文章，比如你不能生病，或者说人到中年再不努力，时代抛弃你都不会跟你打声招呼。激发焦虑'
  - '[PAGE 10]


    感是用的最多的一种方式。尤其是写认知、思维、成长这一类的文章经常会激发我们对不确定性的一种恐惧。


    第三个是悲伤。比如说巴黎圣母院被烧了，或者说金庸去世了，可能我们会有一些悲伤的情绪。有文章表达出这些情绪，我们就会去转发。


    第四个是喜悦。比如北京申办奥运成功了，我们会在群里转发这个喜讯。


    还有就是感动。比如有一个号叫做视觉志，他们曾经有一篇估计阅读在5000 万以上的文章，就是《谢谢你爱我》。它写了一些很让人感动的小故事，配上了感人的图片。结果大家就纷纷的转发。


    第三个大的动因，让别人会转发的就是对别人有帮助。


    我们可能经常在家庭微信群，看到爸爸妈妈转发《按这个穴位你就不生病》，或者《经常吃这种蔬菜，你的血压就会降低》类似这样的文章。他们为什么要发这个呢？就是想让别人觉得我提供了价值，我是一个有用的人，我在帮助你，这也是人的一种很大的需求。一般来说，我们的文章会提供这么一些能够帮助人的东西，首先是新鲜热辣的信息，别人不知道的我知道，我会转发告诉别人。第二个是干货类。就是让人能够得到成长，或者获得一些新的知识，获得一些思维的提升这样干货类的文章。还有就是提供愉悦感的文章。比如说一些特别幽默，特别搞笑的，我们会发在群里，让大家跟我们
    一起欢乐一下。


    写文章要注意的第三个目的就是带来关注。其实作为一个初创的公众号来说，你每一篇文章最终的落脚点都是要给你带来新增的粉丝，要不然它就是没有意义的、无价值的文章。所以我们每写一篇文章，落笔的时候，都要想一想，我这样写，我表达这么一件事情，表达这么一种情感，能不能带来新的关注。如果带不来的话，你可能就不一定要写了。有些哪怕是阅读量很高，它也不一定能带来新的关注。因为我们看文章，让我转发是一种动因，让我关注又是另外一种动因。


    我梳理了一下，觉得可以带来关注的主要是有三个需求。


    第一个是与牛人建立连接。有很多文章，它的作者通过字里行间向我们展示他是一个很牛的人。这种牛人，我们会想着去关注他，说不定能跟他建立一个连接，或者是向他学到一些东西。像何加盐这个号本身，也是向外人展示我'
