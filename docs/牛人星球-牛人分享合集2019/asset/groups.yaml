    另外，他的整个竞选团队还会进行对应的民意调查来了解谁支持特朗普。支持的人会不断的和对机器人进行对应的互动，并保持他们的忠诚度。


    接着，针对对应的不同的数据，特朗普团队会做成非常有感情的文字、视频、图片内容、散发到社交网络中，进而不断影响对应的数据。最终，不断壮大支持特朗普的美国选民。


    在第二张图民意调查下方的问题及日期，横轴代表的是日期，纵轴代表的是问题。意思说的是对应不同州的演讲，演讲日期和不同州针对特朗普想要的选民，针对想要的选民关心的一些主要的问题，从而进行对应的演讲。还有一个问题就是，在美国针对他的入数中，没有护照的人数相对于有护照的人数，占很大的比例。


    所以，从个人的角度来讲，特朗普是一个非常棒的营销家。


    另外，如果按现有的对应的一些数据显示，特朗普应该还是会成为下一届美国总统。大家可能会觉得特朗普的很多言论让人很不适应等等，但是这些言论实实在在是从不同的数据得出来的，来源于能帮助他获得总统一席位的美国民众所关心所关注的一些问题。很多的电视节目曾做过一次实验，如果走到大街上，问民众认知的一些情况，世界的情况，普通民众是真的很不知情。


    所以从侧面反映，特朗普所发布的每一条信息，对应的都是这些超过 60% 的美国民众所关心的事情的一些看法，而他只是借用了更加煽动性的说辞而已。不得不说，他很会利用别人的心智，并结合数据不断转化自己的选民数量。


    另外，我想要补充的一点就是，特朗普竞选团队的核心人物的营销理念也是完全建立在心智和数据上的。另外这个负责人最喜欢的一个人物案例，就是我之前提到的苹果 iPad。当时，苹果推出
    iPad 这个产品是 Steve Jobs。针对这个产品的发布会有两个屏幕，第一个屏幕显示时间大概是三四十秒，用于介绍这个产品可以连接无线，可以存两万多首歌曲等，主要介绍产品的优良特点等。


    针对上面的营销案例所说的重点，就是如何利用数据，所以营销的工具就是数据。


    ## 营销工具


    下面我们谈一下第四部分，营销工具。我认为做营销需要拿到的五个重点数据。请看图 8。


    ![](img/74d384fc5d948a0c31090e035208669c_40_0.png)


    图 8：营销的 5 个重点数据


    我觉得在中国做营销，第一个需要获得的数据是政府行业的政策数据。举例来说，如果你现在想开发耗油的摩托车，但是政府的政策显示，针对耗油的摩托车会被淘汰，不准上路。那如果你再研发类似的产品是完全没有意义的。


    第二个数据，很关键的数据是行业数据，你需要知道这个行业未来的发展趋势和在这个行业主要的贡献者。这样你会在这个市场有一个清楚的自我定位。


    第三个数据我觉得很重要，就是竞争对手的数据。因为想要更好的营销，一定要知道你的竞争对手是谁，只有知道了你的竞争对手是谁，你才会做出对应的策略。


    第四个数据是客户肖像数据，你需要知道你的客户是谁，你的客户年龄段是在什么范围，你的客户是什么样子的，你的客户一般涉及什么样的领域以及你的客户的一些消费习惯等等。


    第五个数据我觉得很关键，就是流量池数据。你需要知道哪里是你潜在客户的聚集地，因为在这里你相对应的营销成本是最低的，你的获客成本也是最低的。


    之所以选择这张图片，是因为之前我参与过供应链管理指导，加工行业如果不精准，加工会浪费很多的对应成本，而且生产出来的产品会有各种各样的缺陷。


    为什么这么说呢，因为你获得了大量的数据，你也知道你的目标客户的画像是什么样子，但是不同的数据只是会给你一个方向性的指引，具体的策略还是需要营销人员来做决策。


    ## 精准营销


    分享的最后板块叫做精准营销。下面我来说一下精准营销的四个要点。请看图 9。


    ### 精准营销的要点：


    ![](img/74d384fc5d948a0c31090e035208669c_41_0.png)


    - 第一个要点，就是数据和心智两点并不等于营销方案。

    - 第二要点，精准营销是建立在数据和心智上，离开心智，产品是没有办法销售的。离开数据，营销也是很困难的。如果没有办法做到精准营销，即使花费了大量的人力、物力和财力，最终的销售业绩也是会少得可怜。

    - 第三要点，我想说的就是针对第一要点和第二要点的一个总结，就是营销决策人需要具备对应的营销实战经验。因为所有的营销方案最终确立，都是在对以上几点进行评估之后进行的。所以营销决策人需要具备对应的营销实战经验。

    - 第四要点，就是营销执行的三要素。营销是一个长期项目，不是一个短期项目。另外一点是营销需要企业其它三点对应的配合，离开三点对应的配合是没有办法实现营销方案的执行的。举例来说，在加工行业里，如果对应的部门不给足够的配合，营销方案是没有办法执行的。另外一点是，数据和心智需要不断的更新，并建立在更新的版本之上，进行对应的营销方案的策划和执行。


    分享到这里基本就结束了，我想送给大家一句话，用来作为本次分享的结束语：“营销是专业和艺术的结合，谢谢您对营销的喜爱”。


    ## 投资者眼中的创业者


    ### 创业要怎样才更容易成功？


    分享者：马桶，历史学硕士，原陕西省公务员，陕西某公务员培训学校联合创始人，近年来从事投资业务，现为上海某投资集团总裁办主任。


    分享时间：2019 年 8 月


    “创业要怎样才更容易成功？”这是一个很有意思的命题。首先，确定的是创业没有“容易”的，但是我认同创业有“更容易”的。因为任何事务都有其内在规律，掌握规律的人不一定都能做好或成功，但从概率上来说有更大的可能性。


    基于我自身创业和做投资的经验，可以跟大家做一些不一定有指导意义的分享。我上大学时就跟室友一起做些小生意。那是 2001 年左右的事。那时手机还不普及，电商还未兴起。我们在学校看到某种需求后，就去批发市场发货，然后拿到学校去卖。诸如十字绣、雨伞、搜集卖家推荐信等。再把沿海的贝壳饰品拿到内地的大学去卖，在每个大学找一位同学做分销。挣的是市场嗅觉、信息差和辛苦钱，是个体户或倒爷式的初级商业模式。


    研究生毕业后，进入省级政府部门工作，但是不愿意白天上班晚上应酬的庸碌，就自己开始“白+黑”，“5+2”的双重身份的生活。白天在单位上班，作为公务员“为人民服务”。晚上、周末创业做自己的事，作为创业者“为人民币服务”。


    我和几个同年（同一批考入省政府，一起参加入职培训的同学）利用自己考上公务员的经验，编写教材，开办了公务员培训学校，以体制外的朋友的身份开办公司，我们作为老师对学生进行辅导，由于公务员考试的公平性和难以作弊，我们的经验就成为具有市场价值的商品。这件事既能为国家培养人才，又能把自己的知识和经验变现，还能帮助考公的同学实现就业，是一举三得的事。


    我们还开办过咖啡馆、农家乐、组织公益活动，捐建智障儿童学校（纯公益项目）。咖啡馆、农家乐都因经营不善倒闭，公务员学校目前仍然在运营。这个阶段的创业就是合伙人+公司组织的商业模式，挣得的是组织运营+个人辛苦

    '
