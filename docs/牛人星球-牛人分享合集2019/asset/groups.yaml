    \n我为什么敢这么说呢，是因为我们抵押贷、贷多少，是一个很大的学问。\n\n### 资金流动性管理\n\n大家一定要做好资金流动性的测算，保证在买完房之后，每个月在两三万的支出的情况下，在三年之内，如果你的工作是很稳定的，收入不会有太大的增长情况下，依然能够保证生活质量不下降，这个是完全可以做到的。\n\
    \n为什么要选择三年作为一个流动性预测，我当时的三十万三年期的月供是 9800，到现在 9800 的月供就不用考虑了，相当于我 28000 多的月支出降到了\
    \ 18000 多。一旦降到 18000 多，开支的水平就降了 40% 左右，对一个家庭来说，每个月少还一万块钱后的财务压力是很小的。\n\n### 第三套房产投资\n\
    \n关于如何购买第三套房进行投资这一块呢，具体的我就不展开说错了，因为它中间还有很多专业的问题。\n\n- 第一套房的结清和抵押，不是马上就可以去银行办理的，至少有三四个月的空档期。\n\
    - 抵押贷的问题，抵押贷款多少，可以不仅仅是贷出首付来，还需要一个测算。因为贷的越多，月供就越大。\n- 按揭贷款选择去哪家银行贷，怎么贷等问题，这是一个很专业的问题，包括像\
    \ 30 万的贷款是不计入征信的，相当于在征信里面反映出来的是一个银行卡的正常记录，而不是一笔贷款的记录。就是每个月多了一笔银行卡的消费，是一个虚拟的，所以在评估还款能力的时候，是不作为一个还款的固定支出，这对办理按揭是非常有利的。\n\
    \n正因为有了全杠杆，买了第二套房，所以才有机会投资第三套房产。因为第三套房和第二套房在操作上有很多类似的，所以在这里也就不展开讲了。\n\n我自己分享一下，首先，我觉得要有非常合适的房源，我个人是非常看重地段的。如果是市中心，有学位，有地铁，交通非常方便，离菜市场很近，又有很多的培训机构，生活非常便利，这样的房源是非常抗跌的。这些具体的问题就不做详细的展开讲了。\n\
    \n第二是购房资格的问题，这又是一个非常专业的问题了，所以我觉得大家一定要对政策有很清楚的了解，否则很多事情是做不了的。因为我老公是独生子，广州有这样的政策，如果父母退休了，可以把户口跟着子女迁到广州的，所以在去年的时候我们就把老人家的户口迁过来了，后用老人的购房资格来买。剩下是首付的问题，因为我们买第二套的时候保存了一些实力，刚好第三套房子比较合适，就把家里的一些房子处理掉，凑出第三套房的首付。\n\
    \n后面就是按揭贷款的问题了，这是一个非常专业的问题。其实银行现在有一个俗称叫接力贷的政策，购房的名额是老人家，实际的还款人是我跟我老公，由我们年轻人来还。\n\
    \n所以大家一定要对政策非常了解，才能去很好的运作这个事情。当然，在这里就会有很多专业的问题了，比如说老人家买房要几成首付，怎么样才能实现三成的首付，有什么硬性的条件。第二个，按揭贷款我们能不能批下来、跟个人的征信有没有问题、我们的收入和支出能不能达到按揭贷款的标准，目前来说市场上，你的收入一定要覆盖这个贷款的\
    \ 2 倍到 2.5 倍。\n\n### 总结：广州三套房投资经验\n\n现在总结一下，之所以能够在一年的时间里在广州搞定三套房，实现财富比较大的增值，我总结出以下四点：\n\
    \n1.  **要有专业的知识。**\n\n    俗话说隔行如隔山，我自己得益于在银行干了这么多年，比较精通和善于运用各类金融工具，对于消费贷、抵押贷、按揭贷等个人金融工具非常熟悉，熟悉房贷的政策，能够准确的把握，加上对房市准确的判断，这个是非常重要的。\n\
    \n2.  **一定要做好财务的预测和流动性的管理，这一步非常关键。**\n\n    对刚刚提到的抵押贷，因为抵押贷能够做二十年，如果说只能做五年或者更短，那这个方案就不可行了，全杠杆买房肯定是做不到的。所以这个流动性的管理是整个过程中最关键的一点，大家一定要经过缜密的测算，不然后面就会出现流动性的风险，也就是贷款还不上了。每个月的房贷还不了，那么房子可能就会被银行收回，银行拿去拍卖，归还它的这个贷款，那这个交易就失败。流动性的管理，无论是个人、家庭、企业、甚至到银行、国家都是一个非常非常重要的课题，如果没有流动性，那企业就破产了，包括基金公司。\n\
    \n3.  **负债也是一种资产。**\n\n    这个是我非常乐意和大家分享的一个观点，我个人一直坚信负债也是一种资产。大家对于负债不要抱着一种抵触的心态，其实我觉得正好相反，包括现在的个贷、房屋按揭、还有房地产。你要把一个生意做大，肯定是需要借助杠杆的力量，房贷三成首付，七成都是负债，都是杠杆。包括房地产融资，大概三四成是自有资金，剩下的也是银行贷款。所有我们一定要善于运用杠杆，用好自己的负债，这样财富的积累才能更上一层楼。\n\
    \n4.  **瞄准自己的能力，挣圈内的钱。**\n\n    雷军坚持三原则：不熟不投，不是熟悉的人不投，不是熟悉的领域不投。之前有去拜访过几个做茶叶的朋友，每个人都在炒茶。有个朋友说：你要不要来也？我当时拒绝了，因为那对我来说是一个完全陌生的领域，我肯定不会去介入，包括像股票，我现在不能说很懂，当然我们券商是不能炒股的，所以就是我们要挣能力圈内的钱。包括前面也提到，我老公当时看中那套\
    \ 450 万的房子，如果按照这个流动性预测下来，每个月是要支出四万到五万的，那是一个很大的支出，后面的流动性是有风险的，所以这件事是肯定不能做的。\n\n\
    \    两千年前孔子说过：“知及之，仁不能守之，虽得之，必失之。”我觉得就是这个道理。拿我们自己的专业能力，不能覆盖圈内的钱，哪怕一夜暴富了，我觉得是不能守之的，所以孔子的话我跟大家一起共勉。\n\
    \n### 房产投资风险提示\n\n刚才分享个人房产投资的一点经验，其实不是鼓励大家去买房，我们还是要响应政府的号召，房子是用来住的，不是用来炒的。昨天也出来一个新闻，银保监会着急了，所有的龙头信托公司都去谈话了，而且是比较严厉的谈话了。下半年房地产的融资是要收紧的，所以这个也是响应政府的号召：房子是用来住的。所以下半年我觉得房地产商项目的投资还是要注意的，不然的话流动性一年半、两年后的融资，还款的来源是不是完全来自于房地产销售的回款，其实这一块压力就挺大的。\n\
    \n### 其他投资经验：基金定投与黄金外汇\n\n这么多年除了刚才提到的房产投资，我还进行了很多其他方面的投资。\n\n比如说基金定投，我大概投了 10\
    \ 年吧，一进银行就有做这一块的基金定投，基金定投又叫懒人理财。\n\n华尔街流传着一句话，要在市场上准确的踩点入市，比在空中接住一把飞刀更难。所以我们炒股，我们这些小散，无法跟机构比。我们总部的老师天天盯盘，天天做行业研究分析。咱们一个小散，又是开会又是拜访客户又是做方案的，没空去做这方面的研究，所以肯定是被割韭菜的大头。\n\
    \n基金定投呢，其实就克服了选择时点进入和选择的缺陷，是分批的买入，也就是定时定额的买入，这样就均衡成本，积少成多，降低整体的风险。所以如果大家对这方面有兴趣的话，我是非常推荐的，你可以一百一千一万千一万的去做好这个基金定投。\n\
    \n平时我也买黄金、外汇，也取得了不错的收益。股票方面我不怎么专业，我也经常建议自己身边的朋友，如果要炒股，就跟着机构去炒。自己炒呢，一定要小，千万不要拿吃饭的钱去炒股，这个风险是很高的。\n\
    \n### 风险警示：P2P 理财\n\n最后要非常重要的提醒一下，我用红色炸弹标出来的 P2P，大家千万不要冒这个风险，风险太高。因为咱们国家的 P2P，没有机构去监管，不像国外的\
    \ P2P 受到严格的监管，所以我们的风控是非常低的，踩雷的可能性是非常大的。\n\n昨天就出来一个非常重大的消息，诺亚财富出事了。诺亚财富是我们现在第三方理财平台里面数一数二的，像诺亚、宜信也在美国的纽交所上市了。但是它毕竟是一个民企，也是一个第三方的财务管理平台，所以我个人非常中肯的给大家一些建议，不要拿自己本金盲目百分百的风险去搏\
    \ 10% 的高收益，肯定是非常不值的。\n\n### 财富管理基础：管好四笔钱\n\n下面聊一聊如何做好财富管理。\n\n上面主要是分享了个人投资的一点小小的经验。其实财富的管理是伴随终生的，投资是每个人的必修课。\n\
    \n我觉得要做好财富管理，首先我们必须要管好四笔钱：\n\n1.  **要花的钱**：主要是短期的消费，其实还是一个流动性的需求。比如说每个月、三到六个月日常生活开支，一定要预留；比如说每个月的房贷、信用卡、小朋友的支出、每个月的手机费、每个月的交通支出等日常的支出，一定要保证正常生活开支，做好这个管理，注重安全性和流动性。这部分钱大家可以放到现金管理类的工具里面，比如说支付宝，随时可以用随时可以取，包括银行理财，包括我们的券商也有一些流动性的钱，这个工具大家可以多去了解一下。\n\
    2.  **保命的钱**：关键就是我们要保险的意识，这一部分的钱其实重在保障，构筑家庭财务风险保护伞，解决家庭突发的一些大开支。这个关键我们要配置一些保险，包括存款、没有风险、保障型的，这样的一些钱主要放到这些工具里面。这里就不详细的去提保险了，如果大家有兴趣，我们也可以私下交流。像我们家是一家四口人，每个人至少两份保险吧，该配的基本都配了。可能因为在银行工作的原因，我个人的风险意识是比较强的，就像包括开车时的一些小细节，我也是非常注意的，也希望大家在这一块能提高一下，对保险不要有这种抵制心理和误解，其实这是一个非常好的产品。\n\
    \n    我跟大家讲一讲这个保险的顺序吧。首先我觉得一定要买的是社保，在这个基础上我们可以买一些百万住院医疗保险，大概每年几百块钱的支出，也就一顿饭的钱；第二个是意外险，因为现在这种意外的事件实在是太多了，飞来横祸也是不可避免的，就是要有这么个意识。意外险之后就是重疾险，我觉得这也应该是一个标配。然后接下来是一个定期的寿险，现在市场上有一些重疾险里面是含了寿险的内容，就是身故的话也是会理赔的，所以大家可以详细了解，最后有余力的话就可以买一些教育年金。\n\
    3.  **保值增值的钱**：根据大家的生命周期、家庭财富的状况、风险承受能力，做一个适当的调整。保值增值的钱，在保证安全的情况下，同时对收益率有一定的要求，不能都是放在存款里面，连通胀都跑不赢，要持续的增长。所以我们主要是要配置一些稳健增值的工具，放在比较安全收益又相对高一些的产品里面，比如说配一些债，和固定收益类的信托和资管、分红险等产品。\n\
    4.  **生钱的钱**：这笔钱也是要给他看好的。这一块主要讲究比较高的收益，高收益意味着高风险，所以比例一定要控制好，像一些股票、基金、房产、私募等等，可以根据自己的资产状况，去合理的配置高收益的产品。\n\
    \n无论你是哪行哪业、贫富怎样的，都要有财富管理的理念。很多人说：哎呀我没钱，我不用理财。现在很多理财产品一分钱都是可以的，理财不是说一定要去做什么、买什么产品，而是说大家一定要有这样的一个理念和思维，要让钱去生钱。\n\
    \n我记得前两天看了一句话：“一旦你有了省钱的脑子，就不会培养一个挣钱的脑袋，这就是为什么你穷得很稳定”。\n\n这里我想说，其实很多高净值的人群，在此基础上还要做好税务、法律筹划。\n\
    \n大家也有所了解，现在市场上像千万级以上亿级的客户都在做什么，绝对都是在做家庭信托。大家都熟悉的梅艳芳，去世的时候成立了一个家族信托。她每个月给她妈妈一笔港币作为她的生活保障，所以现在很多高净值的客户，都是在做家族信托的设计。因为它能够隔离风险，受益的不仅是下一代，受益的是\
    \ N 代，你看不见的子子孙孙，都可以受益于这类产品。\n\n![](img/74d384fc5d948a0c31090e035208669c_28_0.png)\n\
    \n## 浅谈精准营销的两个翅膀——心智与数据\n\n**分享者**：海龙，1991 年出生在韩国，由于家庭原因被 Pilkington（世界 500 强企业，后被\
    \ NSG Group 收购）高管领养。幼年生活以英国为主，高中和大学生活在德国为主。学习和接触 13 门语言，现在可以熟练使用其中 8 种。16 岁开始第一次创业。大学毕业后曾在医疗设计领域和供应链管理领域（偏塑料零部件）工作。目前代理世界优秀品牌许可商，在多个国家寻找优秀加盟伙伴。擅长利用数据占领用户心智，做精准营销。\n\
    \n**分享时间**：2019 年 8 月\n\n大家好，我叫海龙，是一个 marketer，也就是一个营销员。\n\n分享开始前，我先给大家讲一个关于自己的小故事。\n\
    \n小时候我最喜欢的节日是复活节。因为那一天，我的养父会给我藏起来很多好吃的复活节巧克力蛋，并在纸条上写上对应的复活节蛋的提示语。\n\n因为我最爱吃甜食，自然对这些巧克力蛋毫无抵抗力。但是，每次我都要找很久却一个巧克力蛋都还找不到。看到我找不到发脾气的样子，总是会逗得我的养父开心。重要的是，他会一直守在我身边提醒我，给我线索，以便可以满足我心中小小的期待。\n\
    \n在这里，我想跟大家分享一个自己的小秘密，这个小秘密就是当时我为什么没有找到巧克力蛋。\n\n- 第一，我希望自己找不到，这样他就可以一直陪伴在我的身边。因为，他的女朋友不愿意和他结婚，这对他的伤害很大。而我找不到复活节巧克力蛋，既可以让他陪伴在我身边，也可以改善他的心情。\n\
    - 第二，只要我找不到，下一次的复活节，我就可以得到更多的巧克力蛋，因为我特别喜欢吃。\n- 第三，现在为什么让他知道呢？是因为我想告诉他，以后的复活节，我也可以这样子照顾他。\n\
    \n另外一点呢，就是今年九月份，我会迎来自己的宝贝儿子，感谢养父对自己的教育之恩。\n\n故事介绍到这里，我想引出的是感情这个词汇。因为一个营销员，是需要善于关联情感，并且从中获得最大的价值的。\n\
    \n我今天的分享主题是《浅谈精准营销的两个翅膀——心智与数据》。\n\n针对今天的分享，我只是浅谈自己在实际工作和生活中经历中对精准营销的一些观点，这里不代表任何官方或者学者的专业认证。\n\
    \n我认为心智与数据是精准营销的两个翅膀，毕竟营销无处不在，包括找男朋友、找工作、面试、商务谈判、人际关系、公司运营等等。\n\n今天我主要是从公司运营的角度去谈精准营销。\n\
    \n在进入主题框架介绍前，我想先介绍一下我的分享逻辑，我认为一个好的分享演讲是基于 clear 原则。\n\n- C 字母代表 Challenging，意思是挑战；\n\
    - L 代表 Leadership，意思是领导；\n- E 代表 Engaging，意思是互动；\n- A 代表 Achievement，意思是收获；\n\
    - R 代表 Reunion，意思是社群。\n\n本次的分享对我来说蛮有挑战性的。\n\n因为我既没有在微信上使用过语音功能，也没有做过一次没有面向观众的分享，而且还是汉语演讲。我希望自己可以克服这个问题，把握一定的领导力，在没有和大家互动的过程中，也可以让大家收获满满，并建立起自己的营销社群。\n\
    \n下面我先介绍一下分享框架。\n\n本次分享是由一个“前言”和“五个板块”来谈精准营销。\n\n前言是介绍营销在企业运营中的关系介绍。在五个板块中，第一个板块是营销生活、第二个板块是营销舞台、第三个板块是营销案例、第四个板块是营销工具、第五个板块就是精准营销。要点的讲解，也就是第五个板块。\n\
    \n在前言部分中，我认为一个企业运营主要有四个要素：战略规划、商业模式、组织框架和市场营销。这四个要素没有先后顺序，同等重要。\n\n大家可能会认为财务也很重要，这是当然的。一家企业在运营，那就说明\n"
  mdcn: "\n## 银行。为什么要抵押给 A 银行\n\n为什么要抵押给 A 银行，因为当时 A 银行是可以做抵押贷款的，那时对抵押贷款的资金流向是没有严格监控的。当时的四大国行，包括我们中国银行，都是不可以操作的，所以政策大家一定要非常了解、非常清晰才能有效的运作。\n\
    \n我们把第一套房抵押给了 A 银行，从 A 银行贷出 75 万，付了第二套房的首付。因为房屋总价 250 万，三成首付 75 万，20 年，月供 5000\
    \ 元左右。\n\n付完第二套房的首付之后，在 B 银行做了房屋按揭，从 B 银行贷了 175 万，月供 13000 元。这里可能会有朋友问，为什么你要去\
    \ B 银行做按揭贷款，为什么不去 A 银行。主要当时考虑审批的速度、效率等因素。我们最开始是在汇丰银行申请房屋按揭贷款，那时汇丰银行利率最低 8 折。但是由于各种原因，一个月还没批出来。最后考虑到政策变动等因素，果断放弃，马上换到\
    \ B 银行 85 折，半个月就审批下来，并很快放款。\n\n2016 年底房价开始飙升，8 折 85 折其实没有太大的区别，不能因小失大，万一房贷政策变了导致这套房没有买成，那损失就更大了。最后还是回中行做的按揭，因为当时在中行上班，很多东西是可控的，所以在\
    \ 2016 年底比合同约定时间提前一个月完成了所有房产交易手续。\n\n### 收益测算\n\n下面我们来看一下收益测算，每个月的财务成本：\n\n- 30\
    \ 万 3 年期的消费贷，每个月 9800 元；\n- 30 万 5 年期，每个月 5750 元；\n- 抵押贷款每月还款 5000 元；\n- 房屋按揭每月还款\
    \ 13000 元。\n\n每个月的财务总成本是 33550 元。房子目前出租，每个月租金 4800 元。这样一算，我每个月的净支出是 28750 元。\n\
    \n个人认第二套房成功的杠杆运作，真的是让整个家庭的财富增值不少，而且是人生中最成功的一次投资。\n\n目前这套房子的市值 440 万以上，这是一个成交价，因为我们第三套房就买在这儿的\
    \ 6 楼，成交价 440 万。上面提到第二套房是 2016 年 12 月放的款，所以房贷是 2017 年 1 月份开始还，那我们的测算就从 2017 年的\
    \ 1 月开始，所以到今年 6 月份总共是 30 个月，我的财务总成本 28750*30=80.25 万。算下首付，如果当时没买、现在买这套房就要 440\
    \ 万，3 成首付加税就是 145.2 万，比 2016 年 85 万多付 60.2 万现金。\n\n接下来我们来算算房屋的溢价，第一套房当时如果卖的话 330\
    \ 万左右，目前市价大概 430 万，所以第一套的房屋增值为 100 万。第二套房，当时是 250 万买的，现在至少 440 万，房屋升值了 190 万。\n\
    \n### 投资收益总结\n\n最后我们来算一下投资收益。\n\n第二套房屋溢价 190 万加上第一套房屋溢价 100 万加上首付节省的现金支出 60.2\
    \ 万，减去财务总成本 86.25 万，投资收益是 263.95 万。\n\n其实收益肯定是要比这个收益率更高。为什么呢，因为财务总成本 86.25 万是每个月分期付款，而不是一次性的投入，了解到财务的话就知道其实我的中值是没有这么高的。因为我分期付款的\
    \ 86.25 万，如果折回到当时的话，其实是比这个财务的成本要低的。\n\n### 购房决策与需求分析\n\n再说一个额外的话题，就是我刚才一直说的：挣钱能力范围内的钱。\n\
    \n当时这一套九楼的学位房，我个人觉得是非常适合我的家庭的。因为整个测算下来，资金的流动性是比较好的，而且不影响我们的家庭幸福指数。最重要的是，很多人觉得九楼太高，但是买完了之后，我觉得这个是不重要的，所以大家一定要分清楚。\n\
    \n额外说一下，自己的需求点罗列出来，最在意什么，最不在意什么。因为不可能面面俱到，所以当时这个九楼其实不在我的考虑范围内，我只看重学位，面积够大，又是一个三房。\n\
    \n所以呢，当时的劣势，反而变成了后面一个很重要的优势。楼层高，我们买完之后就开始推动去加装电梯。如果电梯加装完之后，房价至少是每平方米上涨一万元，房租就从\
    \ 4800 至少变 6500 左右了。如果把这些附加的收益都加上去，那这个投资回报率，在两年半到三年内就将近涨到三倍了。\n\n在这里想额外和大家再多聊聊，当时的这个方案我记得我跟身边的一个姐姐分享过。但是她对金融不是很了解，所以她当时是没有出手买的，前两天我们在一起吃饭的时候，她表示很后悔，说当时\
    \ 16 年应该跟着我们再去买一套的，那现在整个家庭的财富积累就更上一层楼了。其实我当时帮她测算过，因为她已经买了第一套，根据她的收入水平和支出，如果买一个一两百万的两房学位房是完全没有压力的。\n\
    \n我为什么敢这么说呢，是因为我们抵押贷、贷多少，是一个很大的学问。\n\n### 资金流动性管理\n\n大家一定要做好资金流动性的测算，保证在买完房之后，每个月在两三万的支出的情况下，在三年之内，如果你的工作是很稳定的，收入不会有太大的增长情况下，依然能够保证生活质量不下降，这个是完全可以做到的。\n\
    \n为什么要选择三年作为一个流动性预测，我当时的三十万三年期的月供是 9800，到现在 9800 的月供就不用考虑了，相当于我 28000 多的月支出降到了\
    \ 18000 多。一旦降到 18000 多，开支的水平就降了 40% 左右，对一个家庭来说，每个月少还一万块钱后的财务压力是很小的。\n\n### 第三套房产投资\n\
    \n关于如何购买第三套房进行投资这一块呢，具体的我就不展开说错了，因为它中间还有很多专业的问题。\n\n- 第一套房的结清和抵押，不是马上就可以去银行办理的，至少有三四个月的空档期。\n\
    - 抵押贷的问题，抵押贷款多少，可以不仅仅是贷出首付来，还需要一个测算。因为贷的越多，月供就越大。\n- 按揭贷款选择去哪家银行贷，怎么贷等问题，这是一个很专业的问题，包括像\
    \ 30 万的贷款是不计入征信的，相当于在征信里面反映出来的是一个银行卡的正常记录，而不是一笔贷款的记录。就是每个月多了一笔银行卡的消费，是一个虚拟的，所以在评估还款能力的时候，是不作为一个还款的固定支出，这对办理按揭是非常有利的。\n\
    \n正因为有了全杠杆，买了第二套房，所以才有机会投资第三套房产。因为第三套房和第二套房在操作上有很多类似的，所以在这里也就不展开讲了。\n\n我自己分享一下，首先，我觉得要有非常合适的房源，我个人是非常看重地段的。如果是市中心，有学位，有地铁，交通非常方便，离菜市场很近，又有很多的培训机构，生活非常便利，这样的房源是非常抗跌的。这些具体的问题就不做详细的展开讲了。\n\
    \n第二是购房资格的问题，这又是一个非常专业的问题了，所以我觉得大家一定要对政策有很清楚的了解，否则很多事情是做不了的。因为我老公是独生子，广州有这样的政策，如果父母退休了，可以把户口跟着子女迁到广州的，所以在去年的时候我们就把老人家的户口迁过来了，后用老人的购房资格来买。剩下是首付的问题，因为我们买第二套的时候保存了一些实力，刚好第三套房子比较合适，就把家里的一些房子处理掉，凑出第三套房的首付。\n\
    \n后面就是按揭贷款的问题了，这是一个非常专业的问题。其实银行现在有一个俗称叫接力贷的政策，购房的名额是老人家，实际的还款人是我跟我老公，由我们年轻人来还。\n\
    \n所以大家一定要对政策非常了解，才能去很好的运作这个事情。当然，在这里就会有很多专业的问题了，比如说老人家买房要几成首付，怎么样才能实现三成的首付，有什么硬性的条件。第二个，按揭贷款我们能不能批下来、跟个人的征信有没有问题、我们的收入和支出能不能达到按揭贷款的标准，目前来说市场上，你的收入一定要覆盖这个贷款的\
    \ 2 倍到 2.5 倍。\n\n### 总结：广州三套房投资经验\n\n现在总结一下，之所以能够在一年的时间里在广州搞定三套房，实现财富比较大的增值，我总结出以下四点：\n\
    \n1.  **要有专业的知识。**\n\n    俗话说隔行如隔山，我自己得益于在银行干了这么多年，比较精通和善于运用各类金融工具，对于消费贷、抵押贷、按揭贷等个人金融工具非常熟悉，熟悉房贷的政策，能够准确的把握，加上对房市准确的判断，这个是非常重要的。\n\
    \n2.  **一定要做好财务的预测和流动性的管理，这一步非常关键。**\n\n    对刚刚提到的抵押贷，因为抵押贷能够做二十年，如果说只能做五年或者更短，那这个方案就不可行了，全杠杆买房肯定是做不到的。所以这个流动性的管理是整个过程中最关键的一点，大家一定要经过缜密的测算，不然后面就会出现流动性的风险，也就是贷款还不上了。每个月的房贷还不了，那么房子可能就会被银行收回，银行拿去拍卖，归还它的这个贷款，那这个交易就失败。流动性的管理，无论是个人、家庭、企业、甚至到银行、国家都是一个非常非常重要的课题，如果没有流动性，那企业就破产了，包括基金公司。\n\
    \n3.  **负债也是一种资产。**\n\n    这个是我非常乐意和大家分享的一个观点，我个人一直坚信负债也是一种资产。大家对于负债不要抱着一种抵触的心态，其实我觉得正好相反，包括现在的个贷、房屋按揭、还有房地产。你要把一个生意做大，肯定是需要借助杠杆的力量，房贷三成首付，七成都是负债，都是杠杆。包括房地产融资，大概三四成是自有资金，剩下的也是银行贷款。所有我们一定要善于运用杠杆，用好自己的负债，这样财富的积累才能更上一层楼。\n\
    \n4.  **瞄准自己的能力，挣圈内的钱。**\n\n    雷军坚持三原则：不熟不投，不是熟悉的人不投，不是熟悉的领域不投。之前有去拜访过几个做茶叶的朋友，每个人都在炒茶。有个朋友说：你要不要来也？我当时拒绝了，因为那对我来说是一个完全陌生的领域，我肯定不会去介入，包括像股票，我现在不能说很懂，当然我们券商是不能炒股的，所以就是我们要挣能力圈内的钱。包括前面也提到，我老公当时看中那套\
    \ 450 万的房子，如果按照这个流动性预测下来，每个月是要支出四万到五万的，那是一个很大的支出，后面的流动性是有风险的，所以这件事是肯定不能做的。\n\n\
    \    两千年前孔子说过：“知及之，仁不能守之，虽得之，必失之。”我觉得就是这个道理。拿我们自己的专业能力，不能覆盖圈内的钱，哪怕一夜暴富了，我觉得是不能守之的，所以孔子的话我跟大家一起共勉。\n\
    \n### 房产投资风险提示\n\n刚才分享个人房产投资的一点经验，其实不是鼓励大家去买房，我们还是要响应政府的号召，房子是用来住的，不是用来炒的。昨天也出来一个新闻，银保监会着急了，所有的龙头信托公司都去谈话了，而且是比较严厉的谈话了。下半年房地产的融资是要收紧的，所以这个也是响应政府的号召：房子是用来住的。所以下半年我觉得房地产商项目的投资还是要注意的，不然的话流动性一年半、两年后的融资，还款的来源是不是完全来自于房地产销售的回款，其实这一块压力就挺大的。\n\
    \n### 其他投资经验：基金定投与黄金外汇\n\n这么多年除了刚才提到的房产投资，我还进行了很多其他方面的投资。\n\n比如说基金定投，我大概投了 10\
    \ 年吧，一进银行就有做这一块的基金定投，基金定投又叫懒人理财。\n\n华尔街流传着一句话，要在市场上准确的踩点入市，比在空中接住一把飞刀更难。所以我们炒股，我们这些小散，无法跟机构比。我们总部的老师天天盯盘，天天做行业研究分析。咱们一个小散，又是开会又是拜访客户又是做方案的，没空去做这方面的研究，所以肯定是被割韭菜的大头。\n\
    \n基金定投呢，其实就克服了选择时点进入和选择的缺陷，是分批的买入，也就是定时定额的买入，这样就均衡成本，积少成多，降低整体的风险。所以如果大家对这方面有兴趣的话，我是非常推荐的，你可以一百一千一万千一万的去做好这个基金定投。\n\
    \n平时我也买黄金、外汇，也取得了不错的收益。股票方面我不怎么专业，我也经常建议自己身边的朋友，如果要炒股，就跟着机构去炒。自己炒呢，一定要小，千万不要拿吃饭的钱去炒股，这个风险是很高的。\n\
    \n### 风险警示：P2P 理财\n\n最后要非常重要的提醒一下，我用红色炸弹标出来的 P2P，大家千万不要冒这个风险，风险太高。因为咱们国家的 P2P，没有机构去监管，不像国外的\
    \ P2P 受到严格的监管，所以我们的风控是非常低的，踩雷的可能性是非常大的。\n\n昨天就出来一个非常重大的消息，诺亚财富出事了。诺亚财富是我们现在第三方理财平台里面数一数二的，像诺亚、宜信也在美国的纽交所上市了。但是它毕竟是一个民企，也是一个第三方的财务管理平台，所以我个人非常中肯的给大家一些建议，不要拿自己本金盲目百分百的风险去搏\
    \ 10% 的高收益，肯定是非常不值的。\n\n### 财富管理基础：管好四笔钱\n\n下面聊一聊如何做好财富管理。\n\n上面主要是分享了个人投资的一点小小的经验。其实财富的管理是伴随终生的，投资是每个人的必修课。\n\
    \n我觉得要做好财富管理，首先我们必须要管好四笔钱：\n\n1.  **要花的钱**：主要是短期的消费，其实还是一个流动性的需求。比如说每个月、三到六个月日常生活开支，一定要预留；比如说每个月的房贷、信用卡、小朋友的支出、每个月的手机费、每个月的交通支出等日常的支出，一定要保证正常生活开支，做好这个管理，注重安全性和流动性。这部分钱大家可以放到现金管理类的工具里面，比如说支付宝，随时可以用随时可以取，包括银行理财，包括我们的券商也有一些流动性的钱，这个工具大家可以多去了解一下。\n\
    2.  **保命的钱**：关键就是我们要保险的意识，这一部分的钱其实重在保障，构筑家庭财务风险保护伞，解决家庭突发的一些大开支。这个关键我们要配置一些保险，包括存款、没有风险、保障型的，这样的一些钱主要放到这些工具里面。这里就不详细的去提保险了，如果大家有兴趣，我们也可以私下交流。像我们家是一家四口人，每个人至少两份保险吧，该配的基本都配了。可能因为在银行工作的原因，我个人的风险意识是比较强的，就像包括开车时的一些小细节，我也是非常注意的，也希望大家在这一块能提高一下，对保险不要有这种抵制心理和误解，其实这是一个非常好的产品。\n\
    \n    我跟大家讲一讲这个保险的顺序吧。首先我觉得一定要买的是社保，在这个基础上我们可以买一些百万住院医疗保险，大概每年几百块钱的支出，也就一顿饭的钱；第二个是意外险，因为现在这种意外的事件实在是太多了，飞来横祸也是不可避免的，就是要有这么个意识。意外险之后就是重疾险，我觉得这也应该是一个标配。然后接下来是一个定期的寿险，现在市场上有一些重疾险里面是含了寿险的内容，就是身故的话也是会理赔的，所以大家可以详细了解，最后有余力的话就可以买一些教育年金。\n\
    3.  **保值增值的钱**：根据大家的生命周期、家庭财富的状况、风险承受能力，做一个适当的调整。保值增值的钱，在保证安全的情况下，同时对收益率有一定的要求，不能都是放在存款里面，连通胀都跑不赢，要持续的增长。所以我们主要是要配置一些稳健增值的工具，放在比较安全收益又相对高一些的产品里面，比如说配一些债，和固定收益类的信托和资管、分红险等产品。\n\
    4.  **生钱的钱**：这笔钱也是要给他看好的。这一块主要讲究比较高的收益，高收益意味着高风险，所以比例一定要控制好，像一些股票、基金、房产、私募等等，可以根据自己的资产状况，去合理的配置高收益的产品。\n\
    \n无论你是哪行哪业、贫富怎样的，都要有财富管理的理念。很多人说：哎呀我没钱，我不用理财。现在很多理财产品一分钱都是可以的，理财不是说一定要去做什么、买什么产品，而是说大家一定要有这样的一个理念和思维，要让钱去生钱。\n\
    \n我记得前两天看了一句话：“一旦你有了省钱的脑子，就不会培养一个挣钱的脑袋，这就是为什么你穷得很稳定”。\n\n这里我想说，其实很多高净值的人群，在此基础上还要做好税务、法律筹划。\n\
    \n大家也有所了解，现在市场上像千万级以上亿级的客户都在做什么，绝对都是在做家庭信托。大家都熟悉的梅艳芳，去世的时候成立了一个家族信托。她每个月给她妈妈一笔港币作为她的生活保障，所以现在很多高净值的客户，都是在做家族信托的设计。因为它能够隔离风险，受益的不仅是下一代，受益的是\
    \ N 代，你看不见的子子孙孙，都可以受益于这类产品。\n\n![](img/74d384fc5d948a0c31090e035208669c_28_0.png)\n\
    \n## 浅谈精准营销的两个翅膀——心智与数据\n\n**分享者**：海龙，1991 年出生在韩国，由于家庭原因被 Pilkington（世界 500 强企业，后被\
    \ NSG Group 收购）高管领养。幼年生活以英国为主，高中和大学生活在德国为主。学习和接触 13 门语言，现在可以熟练使用其中 8 种。16 岁开始第一次创业。大学毕业后曾在医疗设计领域和供应链管理领域（偏塑料零部件）工作。目前代理世界优秀品牌许可商，在多个国家寻找优秀加盟伙伴。擅长利用数据占领用户心智，做精准营销。\n\
    \n**分享时间**：2019 年 8 月\n\n大家好，我叫海龙，是一个 marketer，也就是一个营销员。\n\n分享开始前，我先给大家讲一个关于自己的小故事。\n\
    \n小时候我最喜欢的节日是复活节。因为那一天，我的养父会给我藏起来很多好吃的复活节巧克力蛋，并在纸条上写上对应的复活节蛋的提示语。\n\n因为我最爱吃甜食，自然对这些巧克力蛋毫无抵抗力。但是，每次我都要找很久却一个巧克力蛋都还找不到。看到我找不到发脾气的样子，总是会逗得我的养父开心。重要的是，他会一直守在我身边提醒我，给我线索，以便可以满足我心中小小的期待。\n\
    \n在这里，我想跟大家分享一个自己的小秘密，这个小秘密就是当时我为什么没有找到巧克力蛋。\n\n- 第一，我希望自己找不到，这样他就可以一直陪伴在我的身边。因为，他的女朋友不愿意和他结婚，这对他的伤害很大。而我找不到复活节巧克力蛋，既可以让他陪伴在我身边，也可以改善他的心情。\n\
    - 第二，只要我找不到，下一次的复活节，我就可以得到更多的巧克力蛋，因为我特别喜欢吃。\n- 第三，现在为什么让他知道呢？是因为我想告诉他，以后的复活节，我也可以这样子照顾他。\n\
    \n另外一点呢，就是今年九月份，我会迎来自己的宝贝儿子，感谢养父对自己的教育之恩。\n\n故事介绍到这里，我想引出的是感情这个词汇。因为一个营销员，是需要善于关联情感，并且从中获得最大的价值的。\n\
    \n我今天的分享主题是《浅谈精准营销的两个翅膀——心智与数据》。\n\n针对今天的分享，我只是浅谈自己在实际工作和生活中经历中对精准营销的一些观点，这里不代表任何官方或者学者的专业认证。\n\
    \n我认为心智与数据是精准营销的两个翅膀，毕竟营销无处不在，包括找男朋友、找工作、面试、商务谈判、人际关系、公司运营等等。\n\n今天我主要是从公司运营的角度去谈精准营销。\n\
    \n在进入主题框架介绍前，我想先介绍一下我的分享逻辑，我认为一个好的分享演讲是基于 clear 原则。\n\n- C 字母代表 Challenging，意思是挑战；\n\
    - L 代表 Leadership，意思是领导；\n- E 代表 Engaging，意思是互动；\n- A 代表 Achievement，意思是收获；\n\
    - R 代表 Reunion，意思是社群。\n\n本次的分享对我来说蛮有挑战性的。\n\n因为我既没有在微信上使用过语音功能，也没有做过一次没有面向观众的分享，而且还是汉语演讲。我希望自己可以克服这个问题，把握一定的领导力，在没有和大家互动的过程中，也可以让大家收获满满，并建立起自己的营销社群。\n\
    \n下面我先介绍一下分享框架。\n\n本次分享是由一个“前言”和“五个板块”来谈精准营销。\n\n前言是介绍营销在企业运营中的关系介绍。在五个板块中，第一个板块是营销生活、第二个板块是营销舞台、第三个板块是营销案例、第四个板块是营销工具、第五个板块就是精准营销。要点的讲解，也就是第五个板块。\n\
    \n在前言部分中，我认为一个企业运营主要有四个要素：战略规划、商业模式、组织框架和市场营销。这四个要素没有先后顺序，同等重要。\n\n大家可能会认为财务也很重要，这是当然的。一家企业在运营，那就说明\n"
