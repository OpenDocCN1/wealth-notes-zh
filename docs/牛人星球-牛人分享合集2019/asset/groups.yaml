    # ## 9.9 元的线上训练营如何卖出 12800 元一份的产品


    分享人：李朝军，原十点读书运营总监，现为某新教育公司创始人。


    时间：2019 年 9 月


    你在什么时间点再过来取餐，是能够让你减少这个等待时间的。


    刚刚说了系统调度派单的规则。接下来我们看一看骑手每天在送的过程中是什么样的。


    当时我去线下送餐，想体验一下骑手真正是怎么送餐的过程。因为我没有电动车，我就开着自己的车。但是穿着这个外卖的工衣。到了一个小区，我就把车停下来了，然后拎着菜往里跑这时出来几个大妈，她们看到我说，你看那个骑手挣的钱好多，都开车送单了。挺有意思的。


    我提着餐到这个小区之后，就发现了一个问题，我找不到用户写的楼层，给用户打电话也没接，想去找人问也找不到人，天也黑。就这样，我在小区里头转了十多分钟的时间。


    十分钟的时间，对于骑手来讲是非常宝贵的，尤其是在高峰的配送时段。于是，后来我带着小伙伴，把这个配送区域小区的楼层分布图做了出来，在骑手送餐之前就告诉他，你即将去送的这些小区，如果你去东门的话，离哪几栋近；西门的话你离哪几栋近，怎么走最快。就这样，可以帮助骑手在找到送餐位置的时候，节省至少三到五分钟的时间，所以将这样一份地图能够给骑手带来十分的安全。


    ![](img/74d384fc5d948a0c31090e035208669c_75_0.png)


    对于一个骑手来讲，电动车，是他这个不可或缺的工作工具。但是往往丢电池的事情也是比较多的。我们通过大数据，可以给骑手一些相应的引导，如果这个地方丢电池的过往情况比较多，系统都会给骑手提早推送一个信息，在这个地方送餐，你在送餐的时候，可以把电池拎着上去送；如果是不容易偷电池的地方，骑手就可以把电池放在车上。


    所以今天，我们看一下，按照刚刚讲的这几种逻辑，订单越多的时候配送是越快的，密度越大的时候人效就越高，那通过派单技术的精准，技术的越强的派单是越准的。这就是配送时间从一个半小时到28分钟背后的核心逻辑。


    我再跟大家讲一下，当时在日均2000万单的时候，这个订单是怎么完成的。


    按照平均一个人一天送30的来讲的，这个背后是需要60万的小哥参与配送的。基本上一年会有将近220万的这个配送小哥，加入到了这个配送工作。当然这个行业的流动性很大。


    那这些小哥的是从哪里来的呢？蓝翔毕业，我收到了美团外卖的offer，这些外卖小哥以前可能是开挖掘机的、做电焊的、以及修车的，还有还会骑马送外卖的，所以就是因为这样一个新的行业的兴起了，让很多人选择了外卖这个行业。


    作为一个劳动密集型的行业，在尤其像过年这样一个时候，是非常缺人的，那这个背后，人从哪儿来？就是一个很关键的问题。


    大家看到这张图，应该有些人会比较惊讶，这是在哪里呢？这是在农村的这个墙上。当时我们在过年返乡的这个黄金时间，把这种广告，在墙上去刷。这样就会给这些回这个回村里面去过年的年轻人一个就业的选择，在沒有这样机会的时候，他以往要工作，基本是去到500公里以外的城市、靠近省会
    的城市去打工，现在有了外卖在家门口，他就可以选择留在家里去送外卖。而且收入也不会太低。


    ![](img/74d384fc5d948a0c31090e035208669c_76_0.png)


    对于一个外卖小哥来讲，一天能够送 30 单，然后跑 100 公里是不成问题的。按照这样算下来的，一年绕地球一圈儿是没有问题的。


    讲到这里，我跟大家分享的也要快结束了。最后一张图，给大家放上一张，我们走在马路上去拍的小哥。他们每天在路上要骑着电动车，刚看到他的背影的时候，我能知道这样一群人，是他们用自己的努力，用自己的汗水在改变着自己的生活的同时，让我们的吃饭变得更加容易。


    ![](img/74d384fc5d948a0c31090e035208669c_77_0.png)


    所以在这里我希望能够通过今天的分享，让大家能够对外卖小哥这样一个群体有一个更深的一个了解，同时打消对他们的误解，


    我今天的分享就到这里，谢谢大家。


    各位同学们大家晚上好，现在是晚上 22：00，时间刚刚好，开始我们今天的交流。


    我非常珍惜这次和大家的分享，感谢大家给我 45 分钟的宝贵时间。 45 分钟的时间在互联网化的今天，是一个很长的时间。大部分的人只会听前面的 3 分钟或者
    5 分钟，就会被其他的事情打扰，主动或者被动的放弃继续听。


    我们今天的主题分享和交流，请大家如果有条件的话，尽可能的给自己找一个比较合适交流的环境，可以找一个相对独立、不被打扰的地方，可以是自己的卧室，或者是书桌，或者是自己的车里。


    群里的各位，有职场的朋友，有为人父母的，有创业者或者国家公职人员，平时都把时间给了别人，今天我们试一试，把晚上的 45 分钟时间只给给自己。


    在开始前，我想给大家放一个音乐，大概是三分钟的时间，目的是为了让大家可以找到一个适合今天分享的环境。


    我们现在正式开始。


    对于十点读书而言，大家更想了解的是：


    - 如何在一年内实现用户 1000 万的增长？

    - 如何诞生爆款，让你的文章在朋友圈刷屏？

    - 如何设计一个全网销量破 5000 万的网络课程？


    让大家比较失望的是，以上这些我都不会，尽管在十点读书这一年多的时间，我会频繁的和十点大号的主编，和文案策划反复的交流、沟通和学习。


    就如那一句海底捞，你学不会一样，这些我也学不会。


    严格意义上来说，十点读书不是一家互联网公司，本质更加接近一家流量公司。


    在和跟大家交流之前，和大家说一说，我在十点读书学到了什么？


    - 1、务实，极度的务实。

    - 2、勤奋，极的勤奋。

    - 3、战略，优秀的战略。


    除此以外，还有很多值得我学习的地方，总而言之，这是一个特别优秀的团队，如果感兴趣的话，大家找我私下交流。


    今天分享的标题是一个非常功利的标题，也是一个很商业化的标题，它是一个流量的转化模型，适用的范围比较少。为了更好的可以帮到大家，我会分三部分来和大家交流。


    第一部分：如何设计一个从低客单价转化到高客单价的产品模型


    第二部分：低客单价到高客单价背后的原理和成立的条件


    第三部分：这个模型是如何找到的。


    在讲解这个模式之前，想请大家思考一个问题，这个问题非常的重要，请大家一定仔细思考一下。


    如果你是一个党媒的主编，你会如何来策划你的选题？


    如果你是一个商场的老板，你会如何管理你的商场？


    其实，从这两个例子是想告诉大家，我们所生活的商业环境大部分是被他人所设计的。同样作为一个运营人员来说，很重要的一点就是如何设计商业的产品。


    互联网公司一直用高增长来不断的提升自身的估值，十点读书也不例外，因此在我进入到十点读书，交给我最大的任务就是如何拓展业务的新增长，这个也就是去年十分火爆的一个名词：第二曲线。


    第二曲线就是你的老业务在未来可能会遇到瓶颈的时候，通过拓展新的核心业务，保持同样的增长，这个第二曲线在很多公司被应用，也给运营的公司带去很好的发展。比如今日头条，微信的诞生，网飞。


    接到十点读书去开拓第二曲线的任务后，我们做了几个尝试，其中的尝试之一就是做在线训练营。我们现在很多人都在做在线训练营。


    我们第一个训练营是和小能熊团队做的知识管理训练营，因为之前我们做了很多的课，但是很多用户并没有把课听完，因此，我们就做了一个课程，这个课程就是专门帮人在庞杂的知识中去做知识管理，这里我们用的工具，就是印象笔记。


    因为形式和之前的课程不一样，销售量还不错，用户有了微信群可以不断的交流彼此的学习，我们发现这样的学习，用户的体验比之前简单的课程要好很多。通过大量的人力做服务，让在线的课程比之前的课程在用户的体验和实际获得上有了进一步的提升。


    做完知识管理训练营以及后面的情绪管理训练之后，我们在想一个问题，训练营和知识付费课程在本质上没有太多的差别，只是多了一个环节，就是微信群的运营和打卡以及点评。


    有没有可能我们去找到一个新的模式来拓展新的业务呢？这个时候我发现有一家公司做的特别好。这个公司就是理财产品叫长投学堂。


    这个公司的名字可以记一下，这里面也是我们去拓展新业务的方法论，当我们在一个黑暗的探索中想要去找到方向的时候，借鉴一些同行或者是别的行业在方向上的创新，往往会给你业务带来一些启发。


    我们就很快的去深入研究了一下长投学堂模式，发现他们是通过投放广告，把用户引导到QQ群，再去售卖比较高客单价的产品。销售很不错，一个上海的团队，几十人的团队一年可以做到5000万+的利润。这个产品模型被长投学堂验证过可以跑通，所以我们觉得，在十点读书也可以试用一下。


    在一个机缘巧合之下，恰好周小鹏的团队找到我们，周小鹏是一个比较有名的婚恋咨询师，他们希望能够做一个婚姻的课程，在婚姻课程中，他们希望能够加入到婚姻训练营。在微信群里面我们可以去尝试售卖一些高客单价的1对1的婚姻咨询，也就是我在今后的分享中说到12,800元的产品。


    我做了什么让它变成一个模块化运营的事情呢。这就是我今天就和大家分享的一个非常核心的内容。


    因为涉及到整个产品设计的核心，希望大家不要去外传了。


    这个产品的设计是围绕一个需求而来的，这个需求就是人的现实需求，尤其是女性在情感方面的需求，恰好契合了整个十点读书的用户。正是基于对这个需求的理解，我在所有的产品设计环节中，有了非常清晰的思考。这也是可以提醒各位的，当我们去设计一款产品的时候，一定要围绕整个需求而来，你的产品的系列化都要围绕这个需求。


    我们发现，在女性的情感市场里面，有一个非常庞大的市场。


    那我们做这个项目到底有没有前景，有没有市场呢？


    这是我们第一个要去思考清楚的问题。


    当有一大群人群聚在一起的时候，那就相当于是一个小的社会，十点读书有将近 5000 多万的用户，它其实是一个小社会的缩影，在大社会里面，那些有旺盛需求的市场，在这个小社会里同样可以存在。


    因此，我们整个产品的设计脉络就清楚了。周小鹏团队之前已经尝试去做一些转化，在微信群里把用户转化到高客单价的一对一咨询。


    这里有一个条件就是当我们 going 去设计一个高客单价产品的时候，那一定要考虑到一个非常重要的因素——用户的买单意愿和付费能力。


    影响到产品能不能售卖出去一个非常重要的因素就需求是不是刚需，或者说这个需求能不能立刻被响应而且被满足。


    这里面就会有一个更加重要的核心就是人在什么情况下会消费。


    其中最重 要的一个因素就是焦虑，或者说在情绪波动比较大的时候产生的消费冲动。


    比如，女生看到朋友背了一个她特别喜欢的包包的时候，或者是买了一个她比较喜欢的化妆品的时候，她一定会觉得我不如她，在虚荣心的驱动下，她想要去拥有这个产品，她会为此去买单。


    一个男性看到身边的朋友买了一辆他非常想要买的豪车，或者是买了一个他特别中意的手表的时候，对比之下，他也可能会去进行冲动消费。


    因此在这个环节中，如何让她产生去购买一个产品的消费冲动，成了一个非常重要的环节。


    这个焦虑本身就是存在的，而不是我们刻意创造出来的。这一点我们跟得到是完全不一样的，得到课程，很多时候他会故意去驱动你的焦虑，比如说用新的科技发展或者是新的思想理念，让你觉得与这个时代落伍而造成焦虑。


    可是它的产品本身不能够解决用户的实际问题而造成人的恐慌，当恐慌的用户去购买它的产品依然不能解决实际问题的时候，就会对他们的产品产生诟病，这也是得到需要去解决的一个非常重要的命题。我在这里不是批判得到，而是事实如此，得到的数据是下滑的，而且下滑比较严重。


    到底什么能够让这个人愿意花 1 万多块钱去买这个产品，当我们把这个问 题思考清楚之后，其实就会迎刃而解了。


    女性对情感、对婚姻会在什么情况下产生一个很大的需求，我在这里不展 开讲了，因为这里包含了很多家庭问题、社会问题及原生家庭的问题，但是我 可以非常客观的告诉大家，在目前的中国来说，婚姻问题是一个非常需要我们
    花大量时间去思考解决的，因为确实目前的离婚率比较高，而且婚姻存在诸多 不稳定的因素。


    关于这个话题，其实也蛮想跟群里的朋友去讨论交流一下，我个人觉得一 个稳定的感情和婚姻，对于一个家庭尤其是对于一个男性来说，无论是生活还 是工作都蛮重要的。所以如果我们在座的各位在婚姻和情感上有一些迷茫的
    话，我建议大家去思考清楚，维护好自己的情感和的家庭稳定、子女的教育、社会的稳定还是很有用的。


    回到我们这个主题中来，我们刚刚说了整个产品一定需要一个清晰的主 线，那就是需求这条线，如果需要用户达成购买，还需要去解决几个问题。


    用户需要在安全的环境去购买，完成销售支付，需要解决的第一个问 题就是用户的安全感。这一点上支付宝的出现完美的解决了这个问题。


    十点读书用户对于这个品牌产生了比较好的信任，这是去做转化一个非常 重要的因素。


    因此在整个产品设计的时候，给用户一个安全感是非常重要的一个因素， 但是在十点读书不需要。因为十点读书以及微信这两个品牌，对于用户来说塑 造了很好的安全感。


    解决安全感就是解决了一个叫支付的问题，至少在他能够承受的范围之内 想要去解决生活问题的时候，他是去愿意买单的。这个是我们解决问题的 一个基础。很多人会不太在意这个环节，导致转化的效果不是很好。


    解决安全感之后下一个问题就是用户如何愿意为他的这个消费而买单？


    这个需要我们在产品中做第二层的设计，如何去唤醒他的需求并让他有一 个强烈的购买欲望。


    我们把整个产品拆分开来看，第一个是推广文案，第二个是详情页，第 3 个 是微信群，第四个是打卡作业，第五个是咨询师，也就是我们完整的转化漏斗，在每一个环节都可以进行很好的设计。


    这个转化模型大部分人是能够把它设计出来的，但有一个非常重要的点很多人设计不出来，就是用户要去购买一个产品，需要销售花时间去进行引导和说服他交易，如果你的产品在这个环节中做了很好的设计，就会极大的降低他被销售说服的成本，尤其是时间成本。


    因此，在这个产品中我们是这么设计的，大家可以参考一下，因为涉及到机密，大家听听就好。


    我们的产品当时的名字叫做“14 天婚姻训练营：教你厘清吵架的真相，收获幸福婚姻”。这个标题是我们经过 5 次修改之后的内容，相当于我们的转化课程，迭代了 5
    次。


    为什么我们会做一个吵架训练营，大家都知道夫妻之间不可能不吵架的，吵架这个话题其实是一个非常巧妙的点，帮助用户能够进入到这个流量池里面，因为婚姻情感危机、婚姻的小三问题或者是婚姻的破裂这些话题对任何人来说都会有很大的戒备心，我买了婚姻问题课程，进入这个群其实代表的就是我的婚姻有问题，其实很多人是不愿意把这个展示给别人看的，所以我们非常巧妙的用了“吵架”这个词。这样的话，用户会放心的进入这个微信群。


    这是我们在选题上的一个技巧，做完选题之后，我们在课程的设计上也做了一些技巧。


    这里而涉及到很多很深层次的心理学原理，我就不说了，如果大家有兴趣的话，可以去看一看心理学的书，去了解一下心理需求。


    我简单说一下，我们在这 7 天的课里面，设计了很多帮助用户找到维护婚姻稳定的需求点的地方。比如我们让他回忆婚姻的过去，能够帮他唤起对于婚姻的向往，比如让她回忆跟丈夫在生活中的点点滴滴，会唤起她对婚姻重修于好的想法。


    但是只做了这些还是不够的，因为有想法之后，很多人还是没有付费的意愿，我们会通过一些设计让她有很多的冲动消费。


    打比方，我们有一个打卡的环节，是晒出自己跟丈夫的照片，这时会出现一个非常两极分化的情况：好的家庭她跟丈夫是非常甜蜜的，哪怕吵架也是甜蜜的；不好的家庭吵架是非常现实的，而且是毁灭性的。当一个女生想要挽


    回她的婚姻和情感，同时看到别人家的婚姻比她幸福的时候，她内心会产生一个很强大的冲动需求，就是我也想要获得一个好的婚姻。当我自己觉得无能为力的时候，我会去寻求别人的帮助。这个时候她会去主动找我们的咨询师，而极大地促进她去购买这个服务。


    关于产品的设计环节，还有很多细节，由于时间关系，我就不一一展开讲了。有需求的朋友可以私聊。


    总的来说就是两个地方：第一，你要理清整条完整的需求线，这个需求是现实生活中存在的刚需市场，用户极其愿意去买单的。第二，就是你的产品线要在整个运营过程中去设计，形成帮助用户去找到需求点，并促进他产生消费行为的运营手法，这样才能更好的做转化以及去唤醒他的需求。这两点在产品设计中起着比较重要的作用。


    我们开始讲第二部分，从低客单价转化到高客单价背后的原理和条件。


    在我做产品设计的讲解过程中，已经把这个成立的条件和原理简单的讲了一下，这里我再去跟大家深度讲解一下。


    我们思考一下之前在百度出现过一次非常重大的问题，有一个贴吧叫“血友病吧”被卖给莆田系医院去运营。为什么这个事情会闹得如此大的动静。除了一些竞争对手的打击之外，为什么反响会这样的强烈？


    如果你把这个问题思考清楚的话，你就能找到从低客单价到高客单价的条件和原理了。


    为什么我们会去百度？当你遇到什么情况的时候会去百度。


    我要注册一个新的公司，我需要考研，我需要去治疗一个困扰我很多年的病。


    当在生活中出现问题的时候，我们会去寻求解决这个问题的方法，除了去问身边的人之外，我们会寻求于网络，这就是百度为什么能够成为这么大的广告公司的原因。


    当我们去百度一个问题“如何创办一家公司”，这时如果有一家办公司的中介突然给你打了个电话“你是不是要办一家公司呀？我们可以给你提供办公司的一些服务，价格还很便宜”。你对比了一下跟市场的价格差不多的时候，我相信你会乐意去购买这个服务的。因此百度就变成一个信息和需求收集并对接满足需求的产品或服务的平台，因此百度才会有这么高的市值。


    设计一个从低客单价到高客单价的产品的时候，低客单价是需要收集到用户的信息和需求，尤其是精准的客户。高客单价的产品是要去解决用户需求背后的问题的解决方案。


    大家可以去想一下，当你要去做这个产品的时候，其实就要完整的把这个环节打通，它会适用于企业和产品发展的所有环节，因为信息和需求它是永远存在的，只是信息的来源不一样。


    比如我们最开始的是电台、电视台、互联网、短视频，到未来的可能是AI、VR之类的，这些都是信息传播的路径和方式，那我们需要做的就是产品设计的时候通过什么方式去获取到这些有用的信息。


    第二个，高客单价产品是不是能够解决他在现实生活中的问题，如果你不能够解决他们在现实生活的问题，他是不会买单的。


    回到说原理，它是基于需求和问题而来。成立的条件是低客单价产品是一个低门槛让用户愿意尝试购买、去了解你的一个信息来源，而高客单价的产品是能够帮助你去解决用户本身问题的一个方案，所以在设计流量模型的时候一定要思考清楚这个问题。


    第三部分，转化模型是如何被找到的？


    当我们遇到一个问题的时候，尤其在企业经营遇到问题的时候，我们需要找到一些方法帮助解决问题。我们当时解决十点读书第二曲线问题的方法，就是找到了上面那个转化模型。那它是怎么被找到的呢？


    我是机缘巧合的知道了长投学堂这个模式，如果这个模式在理财这个领域能够跑通，十点读书是一个小社会的缩影，我相信在长投学堂能跑通的话，它在十点读书也能跑通，因此我就做了这个尝试。


    那我在这里也讲两点：


    第一，我们在找这个模型的时候，我们尝试了很多很多。最后选择了这么一个模式。当找到这个模式之后，我们就会快速去尝试，这也是一个很重要的因素。找到新的模式，赶快去尝试，试着试着可能就对了。


    我本人是一个喜欢创新的人。当我接触到新事物的时候，我会去快速了解这个事物背后的原理，去判断这个原理它是不是能够快速迁移到我的生活和工

    '
