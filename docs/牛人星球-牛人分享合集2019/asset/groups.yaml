    第三要点，我想说的就是针对第一要点和第二要点的一个总结，就是营销决策人需要具备对应的营销实战经验。因为所有的营销方案最终确立，都是在对以上几点进行评估之后进行的。所以营销决策人需要具备对应的营销实战经验。


    第四要点，就是营销执行的三要素。营销是一个长期项目，不是一个短期项目。另外一点是营销需要企业其它三点对应的配合，离开三点对应的配合是没有办法实现营销方案的执行的。举例来说，在加工行业里，如果对应的部门不给足够的配合，营销方案是没有办法执行的。


    另外一点是，数据和心智需要不断的更新，并建立在更新的版本之上，进行对应的营销方案的策划和执行。


