    # **珠宝的鉴别**


    讲师：凌潇潇，宝石学博士，中科院高级工程师


    时间：2019 年 11 月


    大家好，我是凌潇潇。非常感谢谢老师的邀请和大家的热情，在接下来的半个小时我占用大家一点时间，分享一下我所掌握的一些关于珠宝鉴别知识。


    首先要跟大家道歉，我今天所分享的一些知识，只是理论上的，对于你了解如何鉴定珠宝真伪，可能是有用的。但是对于你在实际生活中如何购买珠宝、收藏珠宝，如何对珠宝进行买卖，可能是没有帮助的。所以，不要期望过高了。


    因为关于珠宝鉴定的知识特别的多，可以作为一个本科专业的课程，需要从零开始学四年。甚至，还有爱钻牛角尖的人可以琢磨出一个硕士研究生或者是一个博士研究生。所以呢，我半个小时也不可能把珠宝鉴定的知识讲的完。


    因此，这里就根据朋友们提的一些问题，分享三部分的内容。


    第一部分，就是珠宝的分类。


    第二部分，我将重点分享一下闪石玉，也就是我们常说的和田玉的分类和成因介绍。


    第三部分，就是如何获得跟珠宝相关的可靠信息，我想这一部分可以帮助大家以后获得一些自己想要有的信息。


    首先要介绍一本书，这本书呢，是学习宝石学必备的。就是张老师在很多年前组织了很多专项专家编写的《系统宝石学》。张老师为咱们国家宝石学的正规发展做了非常多的贡献，在这里我就不细说了，咱们呢，主要看一下书的内容。'
  - '[PAGE 100]


    ![](img/74d384fc5d948a0c31090e035208669c_100_0.png)


    我现在开始讲第一部分宝石的分类，在宝石的分类这本书里面，有详细的介绍，在我们大部分人的概念里，可能认为珠宝玉石就是一个非常贵的物品，但其实珠宝玉石它是一个非常广泛的概念，它泛指一切经过琢磨雕刻后可以成为首饰或工艺品的材料，是对天然珠宝玉石和人工宝石的统称。所以呢，它包括很多内容，下面我给大家贴一张它的分类图。


    我国现行珠宝玉石首饰行业的国家标准具体分类方案为：


    ![](img/74d384fc5d948a0c31090e035208669c_100_1.png)


    从这张图中就可以很清楚的看到，珠宝玉石，它分为两类，一类就是天然的珠宝玉石，另外一类就是人工宝石。


    天然珠宝玉石里面又分为天然宝石、天然玉石、天然有机宝石。


    具体是怎么分类的呢，天然宝石它是一般单晶矿物。'
  - '[PAGE 101]


    而天然玉石，就是我们常说的，像翡翠、和田玉等，是很多的矿物集合体。


    天然有机宝石，主要是指跟有机物相关的，比如说我们平常说到珍珠、琥珀等一些有机物。


    另外一个 人工宝石也是非常大的 一类，有合成宝石、人造宝石、拼合宝石和再造宝石，在这里面呢，合成宝石，在我们国家有非常大的市场。


    其中天然珠宝玉石种类是非常多的，因为它主要就是一些自然界的矿物，而自然界现在已发现的矿物有 3000 多种。但是现在我们大概只有 200 多种用来作为宝石的原料。这是因为，我们在认为它是珠宝玉石的时候，一般认为有三个条件，就是美丽、耐久性和稀有性，那美丽首先是做珠宝的一个首要条件，一般我们认为
    是有颜色、透明度、光泽和纯净度 等一些因素来造成的，而耐久性，当然，珠宝肯定得要耐久，因为要放很久，或者说我们要经过很多代的流传，所以不耐久的肯定是不行的。


    最后一个稀有性，因为像珠宝玉石的话，它需要有一个物以稀为贵这一特征，它才能卖得上价钱。像我们平时可以看到，在河里的鹅卵石，虽然它也很漂亮，也很耐久，可以说有的甚至经过了几亿年时间都没有被风化掉，但是因为太多了，所以它还是不具备成为珠宝的一个条件，所以这三个条件都是必须满足的。


    那我们常说的天然珠宝玉石有哪些呢。


    流传最广泛的，一般就是指钻石、红蓝宝石、祖母绿、金绿宝石、水晶、石榴石、晶晶石、绿柱石、长石、碧玺、锆石、托帕石、橄榄石、磷灰石、坦桑石这些，其它的都还比较少见。


    下面我就给大家分享一下，武改朝老师在今年分享他总结的美丽的图片，这些都是他根据网上图片综合起来的，给大家欣赏一下。


    这些只是其中一些珠宝玉石的图片。我稍微解释一下，这是武改朝老师，他根据一些珠宝玉石的特点来总结的。'
  - '[PAGE 102]


    ![](img/74d384fc5d948a0c31090e035208669c_102_0.png)


    首先第一张图片里面说的金刚石就是在山东蒙阴，辽宁瓦房店和湖南都有发现比较大颗粒的，甚至可以说当为宝石级的金刚石，所以他在这里举了三个，我国金刚石产出的地方。


    ![](img/74d384fc5d948a0c31090e035208669c_102_1.png)


    蓝宝深邃不限蓝是什么意思，就是平常我们说蓝宝石的时候，其实并不一定说它是蓝色的，因为在系统宝石学这个概念里面，刚玉类的宝石，除了深红色的以外叫红宝石，其他颜色的都可以叫蓝宝石。所以蓝宝石呢，它就有很多种颜色，像可以看到黄色，甚至是浅颜色的这种。'
  - '[PAGE 103]


    ![](img/74d384fc5d948a0c31090e035208669c_103_0.png)


    这个叫冀北橄榄含睡莲是什么意思，就是在河北出产的颗粒比较大的一些橄榄石。


    怎么判断橄榄石是天然的呢，它里面有一个特点，就是它还有一个包裹体，包裹体就是里面跟橄榄石不一样的另外一种小的包体。它的形状是像睡莲叶的，如果我们发现了这个特点呢，就可以肯定的判断它就是橄榄石了，大部分的橄榄石，是需要
    在显微镜底下观察的。


    ![](img/74d384fc5d948a0c31090e035208669c_103_1.png)


    再有一个呢，就是碧玺色多皇权益。在我们中国古代的时候，比如说在明朝、清朝有很多皇后的首饰里面都是由碧玺来组成的。碧玺在很多年前，或者说十年以前是蛮便宜的，但是在这几年的时候，因为有很多人都喜欢，所以价钱就越来越贵了。'
  - '[PAGE 104]


    上面是我分享的一些关于珠宝分类的一些知识，接下来我就主要讲一下玉石的分类。


    因为在我们国家，玉石是一个非常庞大的珠宝玉石市场。我们常见的玉石由翡翠、软玉，还有一些不太被大家接受或者说不常见的有石英质玉石，欧泊、蛇纹石玉，也就是我们说的岫玉、绿松石、青金石、峰那石、孔雀石。以及其他碳酸盐类的玉石，大理岩玉、独山玉等，还有很多像鸡血石、寿山石，青田石这些印章类的玉石，也是一个很大的类别。


    下面我给大家分享一个PPT，这是北京大学王时麒老师在2009年给学生分享他的研究成果的时候做的PPT，里面的图片是我给他配的。因为有很多图片都是来自网络，而且没有标明出处。所以，请大家一定不要外传，就自己学习或者说欣赏一下就好了。


    这是王老师在2009年的时候。给大家分享关于闪石玉的一些知识，这些知识大部分到现在来说都是没有过时的。也可以说在这近十年以内，闪石玉的研究或者说他的一些问题都没有得到很有效的解决，这也是需要进一步进行进行探索的，像和田玉的皮，和和田玉怎么区分它的产地，这两个问题到现在来说，也没有很大的进展。


    为了咱们将来在生活中，遇到珠宝玉石的一些问题，或者说想要学习知识的时候，从哪里获得有效信息，我现在分享一下，一些关于珠宝鉴定所和培训机构，以及珠宝的一些购买方式，来给大家介绍一下第三方面的内容。


    如果我们买到一个东西，不知道他真假的时候，首先肯定是要找一个鉴定证书，那这个鉴定证书必然是需要一个可以信赖的鉴定所来进行鉴定的。


    那我下面分享四个我比较熟悉的鉴定所，当然除了这四个鉴定所以外，还有很多鉴定所都是可靠的。至于您怎么查询呢，可以到当地的一些比较可靠的机构去看一下，也可以上我推荐的这四个鉴定所来查询。


    另外一个就是，如果我们想要知道价格的时候该怎么办。


    如果您想买一个非常贵的东西，或者说比较罕见的，有些历史价值的，你可以上拍卖会去比较，其次就是展销会，也是一个很好的对比价格的地方，第三个呢，就是网店，它的价格上相对来说比较公开一点，所以大家也可以去比较一下。'
  - '[PAGE 105]


    最不推荐的就是去旅游景点买东西了，因为在旅游景点买东西的话，即使他给您证书了，如果你觉得价格不合适，你也是不可能回去退货的，在这里可能要得罪很多旅游景点的老板，但是事实就是这样，所以希望大家在旅游的时候，尽量的要保持冷静。


    对珠宝玉石感兴趣的人，可以去关注中国珠宝玉石首饰行业协会的资讯，他们可以说是我们国家对珠宝行业动态了解的非常全面，而且很专业。所以如果有什么任何问题，都可以向他们咨询。


    以上就是我分享的一些内容，由于我现在的工作，跟珠宝行业基本上没有太大的关系，所以我认为说的有很多内容，可能跟现在的前沿有一定差距，如果有错误也请大家指出，谢谢大家。


    # 凌潇潇老师在分享课程中还回答了4个群友的问题，统一整理到下面。


    +   第1个问题：各种颜色的宝石，它的不同种类价值不一样，是因为颜色的关系吗？人造和天然的，仅仅是因为人造的，来得容易，比较廉价吗？


    答：我觉得这里决定珠宝价值的主要是美丽，耐久和稀少，但是决定它价格高低的就有很多人为的因素，并不一定天然的就比人造的贵，像施华洛世奇，潘多拉这些品牌，它们很多都是人造的，但是他们价格比很多天然的都要贵。


    +   第2个问题：张雨绮说碎钻不值钱是真的吗，为什么呢？


    答：我没有关注她，所以不知道她为什么这么说，但是如果从收藏准备升值角度来说，小颗粒的钻石是比较难换到现金的，从这点上来说，如果我们买黄金的话可能更容易变现，不单是小颗粒的钻石，甚至我们可以说50分（0.5克拉）以上，或者说一克拉的。你如果没有专业的途径，都是比较难变现的。所以大家如果说为了考虑换现金的话，这个真的是要好好的斟酌一下。


    +   第3个问题：玉和石的区别是什么，两者在致密程度、硬度、光滑度上是否有区别？


    答：在系统宝石学里面，玉和石从定义上是没有严格区分的，都是矿物集合体，如果非得要说有区别，那就是我们一些约定俗成的说法，我们把一些晶'
  - '[PAGE 106]


    体粒度更小，表面抛光更光滑的一些，像翡翠、透闪石玉、岫岩玉、独山玉等叫做玉而其他的矿物集合体呢，叫做岩或者石。比如说我们有石英岩玉，大理石和寿山石等等，所以在致密程度上，晶体粒度越小，看起来越致密，材料的韧性越好也就不容易摔碎。而第二点，这些就是像之前我说致密程度更大一些，可能就更叫做玉，而且二点在硬度上面，玉石的硬度是一个范围，一般来说，玉的硬度相对高，不容易刻画，但是也有的玉石是容易刻画。


    第三就是光滑度，这点不是判断玉的标准，因为玉石当它从山上采下来的时候，没有经过仔细抛光都是会很粗糙的。而我们能买到的一些成品都是经过抛光，而且要经过很多道抛光手续。所以大部分都是很光滑的，像寿山石它也是可以很光滑，像和田玉它在山上的时候也是可以很粗糙的，所以这一点不是来判断石和玉的区别。


    第 4 个问题：从地质专业角度来讲，一块石头有的地方光滑，有的地方粗糙，而另外一部分又很致密，是什么原因呢？


    答：如果是我们肉眼可见的断层它可能叫做裂隙，在一块岩石上矿物晶体大小可以使得一部分非常致密，另外一部分粗糙，一般就是在显微镜下可以看到的。'
  - '[PAGE 107]


    # 儿子清华毕业、美国留学、谷歌总部工作


    # ——我的5点家庭教育体会


    讲者：草原牧歌，南京森林警察学院教授


    时间：11月26日


    加盐星友会的各位朋友，你们好。


    我是草原牧歌，南京森林警察学院的一位老师，受我们小何老师的邀请，今天下午跟大家做一个分享，主要是我在教育孩子过程中的一点体会。


    客观的说，我教育孩子也不算是特别成功的，但成功率还是比身边的人稍高一点。之所以敢斗胆接受小何老师的邀请，主要是基于以下两方面的考虑。首先我是小何老师的朋友，小何老师非常优秀，才华横溢，刻苦努力，正直善良，对于他提的要求，应当是义不容辞响应的。第二点是借助小何老师创建的平台，让我有机会向更多人分享我家孩子的成长之路，希望大家能从他的成长过程中，找到你自己对孩子的教育方式。


    我先给大家介绍一下我儿子的情况，他有一个非常好听的名字叫秦王牧歌。我查过很多次我们国家的户籍人口资料库，有叫王牧歌的，有叫秦牧歌的，但是秦王牧歌迄今为止只有一个。所以接下来我就称他为牧歌了。


    牧歌是1995年出生的，2012年从广东省考入清华大学。在清华就读四年以后，2016年到美国留学，去的是UCSD(加州大学圣地亚哥分校)。他很努力，大概用了一年左右的时间，在2017年12月份顺利毕业。2018年3月的时候顺利入职谷歌。在今年10月他在谷歌就已经顺利升职了。


    在谷歌公司，他们的晋升还是挺难的。一般来说，本科生或者本科生以下的入职，大概是二级和一级，硕士毕业一般是三级（技术级），接着是四级，五级，逐级晋升，最高的是十三级，能够达到十三级的基本上就只有CEO了。大概走到六级以上就比较困难了，技术级从三级到四级，实际上也不是那么容易晋升的。因为跟牧歌一个小组的人，有人甚至在谷歌工作十年了还是三级。所以像他这样工作一年半的时间就晋升的，也不是特别多。


    我在教育孩子的过程中，主要是一些感性认识，因为我不是学教育学的，'
  - '[PAGE 108]


    所以还是缺乏很系统的一个理论。我们现在大都是独生子女，家庭里只培养过一个孩子，现在看起来他是孤案，不一定有广泛推广的效应，所以仅供大家参考。


    群里可能大都是年轻人，很多人可能刚做爸爸妈妈，或者还没有成为爸爸妈妈，那么我教育孩子的一点小经验，如果能跟大家分享，不要走我走过的弯路，让更多人有所收获，我就会很开心，很高兴。


    今天我跟大家谈五个方面的问题。


    +   - 第一点，就是学习能力和学习习惯的培养。

    - 第二点，是关于亲子关系的养成。

    - 第三点，关于对孩子成绩的看法。

    - 第四点，在跟孩子相处的过程中放手的重要意义。

    - 第五点，我在培养孩子过程中的一些遗憾。


    # 先说一下第一个问题，关于孩子学习能力和学习习惯的培养。


    现在很多家长都把孩子学习成绩看得特别重要，但是我想说的是，学习成绩并不是他读了书以后投入很多精力就一定有相应的回报，学习能力和学习习惯是从小要培养的，尤其是阅读习惯。孩子的阅读习惯到了15岁以后就基本上没有办法树立起来了。阅读习惯的养成要从孩子出生以后，一直到他读小学之前，这段时间都是非常重要的。


    我现在经常跟身边的年轻人说，一定要多陪孩子阅读，不管他有多小，尤其是越小的时候效果越好，一天都不能耽误。在牧歌大概三岁左右的时候，我就每天开始陪她阅读，基本上就是讲一些童话故事。稍微大一点了就是简单的科普文章，基本上坚持到了他读小学。


    从三岁到六岁期间，可以说是每一天都不落。最早的时候是我一个人，但一个人坚持相对来说是有点难度的。因为毕竟有时候要出个差或者是有的时候回家晚一点等等。后来我们看到效果以后，我的父母，还有他的爸爸都加入进来，作为我的替补。就这样，我们基本上是雷打不动的给孩子讲故事，陪他一起阅读，坚持了三年多。最早的时候都是大人读。之后就是他跟我们一块儿复述，我们讲一遍，让他用他的语言把它再复述出来，这样对于锻炼孩子的语言能力，是特别好的。再后来就是他读一半，我们读一半。在这个过程中，他也'
  - '[PAGE 109]


    慢慢认识了很多字，然后就是他来读，不认识的字我们会告诉他。就这样坚持了几年，效果非常好。


    我还有一个信条就是给孩子书籍的投资是最廉价也最有效果的。最早的时候，我都是在实体书店买书给他看，后来，当当出来了，就开始在当当上按照书籍排行榜来选择书，买给他看。我觉得一本书，买来之后他不一定当时看，你把书放到他的床头，哪怕他明年或者是后年也不看也没关系，以后只要他翻了这本书，买的就是值得的。


    孩子一旦爱上了阅读，习惯了阅读，那么等他上学以后，你就会很轻松，基本上就不需要操心了。也就是在上小学的第一个学期，家长只需要培养他一个良好的学习习惯就可以了。比如现在网上经常有很多笑话，就是家长陪孩子学习学到崩溃的那种，我基本上都是没有经历过的，因为他已经养成了一个非常好的学习习惯。而且最重要的是他自己会阅读，他喜欢阅读，所以你只需要给他买书回来让他看，买的书你把关就可以了。这是一个阅读习惯，在孩子15岁以前。


    如果超过了15岁，基本上是很难养成这个习惯了，孩子的阅读习惯是越早开始越好。那么在他两三岁之前，三岁之前怎么办呢，一两岁的时候启蒙教育也很重要，这就比较考验大人了。我比较幸运的是，我们家牧歌是姥姥、姥爷带大的，他们都是60年代大学生，都是医生，教育理念相对比同龄人会好一些，他们从孩子刚生下来开始就进行了启蒙教育。


    启蒙教育基本上是无所无处不在了，要从孩子出生开始，不停地跟孩子讲话，刺激他的语言发育能力。因为语言能力，是一个人学习能力中最基础的，语言能力强，他的阅读能力也就相应的强起来了，他做的一切学科研究，对一切知识的理解能力，都会比别人要高一点。另外，我们要把启蒙教育在日常生活中贯彻起来，比如晚上临睡前跟他一起玩形容词的游戏，大家一说形容词。我们说难的，让他说简单的，或者说某一类名词性的东西，比如动物名称或者植物名称。这些都是贯穿在生活当中的。长期坚持下来确实是有一点难度，但是如果慢慢养成了习惯了，做起来就不觉得有什么了。


    在孩子上小学以后，学习习惯的树立是特别重要的，最重要的就是刚刚上小学的第一学期，这时候一定要让他养成一个良好的学习习惯。也就是说，你'
  md: '

    个澳大利亚朋友资助的，结婚买房也是他帮的忙。


    除了热情之外，我们还可以向别人展示个人的发展潜力，这样的话，对方也会很愿意跟我们交往。有很多很有前途的年轻人，我们也会愿意去跟他们结交，给他们机会。像我本人写公众号的时候就深有体会，我当时刚一万多粉丝的时候，我去结交自媒体行业的一些大佬，他们很多是行业内顶尖的人物，我去结交他们的时候，他们都很愿意跟我交往，为什么呢？因为他们看了我的文章，他们知道，这个何加盐以后肯定会发展的比较好，他们也会愿意提前结交一下，也许以后有用，就算没用，交个朋友也挺好。所以如果有潜力就表示出潜力。


    如果说我又没有实力又不自信，觉得自己未来没有潜力，又不是一个热情似火的人，那怎么办呢？难道就不去拓展弱关系了吗？其实不是的，每个人身上都有很多的优点，比如说，我是一个办事特别靠谱的人，我是一个说话绝对算数的人，我是一个对朋友非常忠诚的人，等等等等，其实你只要发掘用心发掘身上的这些优点，你一定可以打动别人。所以，如果你没有实力，也不自信，也不够热情的话，你就想想你身上有哪些优点是可以吸引人的，然后用这些去跟人家交往也是可以的。


    最后总结一下吧，我们的生活和事业都需要惊喜。生活中的惊喜，往往是父母、妻子、孩子、朋友带给我们的，这些都是来自于强关系。而事业上的惊喜，一般来说都是属于意外，这种意外，往往都是由弱关系带来的。因为你的强关系，跟你之间的信息重叠度是非常高的，一般都没有什么意外。所以意外都是来自弱关系。


    我们可以总结一下：生活中的惊喜来自强关系，事业上的惊喜来自弱关系。


    或者我们也可以转换一些说法：强关系给我们带来爱，但弱关系给我们带来钱；或者说，强关系使我们生活具有确定性，弱关系使我们的生活充满了希望和惊喜。


    总结一句就是：强关系给我们过去，弱关系给我们未来。


    其实我们群里有很多朋友，都是人脉拓展方面的高手，比如说我知道的傅总、史老师、李朝军老师、晓伟，还有马辅老师等等。如果大家都对于拓展人脉关系，有什么想知道的，也可以跟这几位老师多交流，也希望这几位老师能够给大家提供共享的机会，对于如何拓展人脉关系，如何把弱关系变成强关系的一些想法和做法传递给大家。


    另外，关于弱关系拓展，我之前写过几篇文章，我把它写在下面，大家有空也可以看一下，有的在公众号上可能已经删掉了，到时候我也会一并发在牛人星球里面。


    今天的分享就到这里。希望大家能够用好弱关系，让自己的事业和生活都变得更美好。


    我和大家每个人之间都是弱关系，我们的生活、事业都希望遇到贵人，贵人往往是从弱关系产生的。所以我也希望我们牛人星球圈子的每一个人，互相能够成为别人的贵人。


    你，是我的贵人；我，也是你的贵人。


    谢谢大家！


