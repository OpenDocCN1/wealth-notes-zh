  - '[PAGE 44]


    的钱，最大的教训就是不要做自己不擅长也没有全心情力投入的事。由于我们不太懂餐饮业的运营，再加上农家乐在离城较远的山脚下，精力投入也不够，虽然周末有空都会开车去，一辆车三年跑了11万公里，但是仍然没有将餐饮项目做好。


    在政府工作5年做到正科级后我辞去公职。这不是一时冲动，这是计划的一部分，在此也多啰嗦一句，辞职要慎重，计划应先行。在考入政府之前，我已经在所大学教书，也是正式的编制。但是考虑到从读本科、硕士、工作，一生中这么长时间都在大学这样的象牙塔里，什么时候才能融通社会，什么时候才能有自己的事业？我就决定放弃大学教职，选择政府公职。


    做出这一选择有以下几点思考：其一、在中国政府是推动社会进步国家发展的核心组织，只有了解政府的运作才能真正读懂中国；其二、政府的工作经验，如组织能力、计划能力、执行能力（中国的公务员一定是执行力最强的一个职业群体，不在体制的人很难体会）、待人接物等；其三、政府平台所能积累的人脉资源，并非什么人情关系、非法手段，主要是政策信息的及时准确、办事程序的通顺流畅、遇事之后知道从哪里着手等。


    当时就计划在政府工作5年，刚好可以做到正科，对自己有个交待，也足够熟悉政府运作和人脉积累，但又不会因时间太长而让自己困于围城而体制化。那时候我经常给朋友说一句话：“虽身在大陆内，但是要持随时走出去的能力和信心。”从政府出来后先是经营公务员培训学校，然后与朋友以股权投资的方式入股一家中考补习学校，之后到上海加入朋友的团队从事股权投资行当。目前是合伙人+公司组织+职业经理人的商业模式，吃的是专业+资本的饭，这个世界上最能挣钱的就是钱，其次是行业精英的专业能力。


    说到这里，自己本身并不是事业有成之人，只能算是有点经历，有些失败经验的人。关于“投资人眼中的创业者”，其实每个投资人、每家股权投资公司都有自己的判别角度，也有一些大家都比较在意的点，但这个行当其实是专业+运气，和相亲差不多，谁也难以保证自己通过几次相亲就能找到真爱，找到一个旺夫的另一半。很多项目的包装和一些女士的化妆差不多，卸妆之后的素颜，有时会让人恍惚错愕。


    鉴于何老师的指示，希望能给创业者提供一些经验性指导，考虑到群里关'
