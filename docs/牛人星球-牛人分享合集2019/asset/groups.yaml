    那么第3类工具就是4象限的分析，我们主要是用它来做个人定位，当然也可以用在很多其他的方面。


    你可以用不同的维度来画四象限，找到自己再4象限的位置，并且跟其他人对比。


    这样做的好处是你可以明显看出自己在市场上处于什么样的位置？有哪些优势劣势，你需要避免或者要效仿的对象是谁？特别容易帮你找标杆。


    我用两个例子来说明四象限分析法的应用，这个是我当时做咨询的时候对自己的一个分析。


    ## 四象限分析法


    ![](img/74d384fc5d948a0c31090e035208669c_150_0.png)


    我把能不能做好咨询，从两个维度来判断，一个是思维能力，一个是表达能力。


    市场上现有公司里面，最左边我们看到这个和君咨询，它是中国目前最大的咨询公司，他们的特点是很会忽悠，实际上做的东西就一般般。


    最下方右下角的IBM，他们刚好跟和君相反，他们做的东西特别漂亮，理论性也特别强。但是IBM的人大部分都是理工科，这些工科男不是很不什么忽悠。所以我把它放在右下角。


    还有一个麦肯锡，他又特别会忽悠，做的东西又特别漂亮，在右上角。


    当时我分析我自己，我的表达能力、忽悠性不如和君，思维能力、做东西的漂亮性不如 IBM，所以我把我放在右上角，但是稍微偏低的位置。学习的对象很自然，我要学习麦肯锡，表达能力和思维能力都要增加，这是给自己一个定位和我一个标杆。


    下面我再找一个我做公众号要怎么做的一个例子。


    ## 四象限分析法


    ![](img/74d384fc5d948a0c31090e035208669c_151_0.png)


    一个公众号能不能做得好，我也用两个维度来分析，一个是内容的深度，另一个就是它的传播性。


    我们都知道有一个叫占豪的公众号，他写的都是大白话，没有什么深度，就是刺激你的民族情绪，传播性特别好，但没有深度，我把它放在左上角。


    右下角有个叫剪辑者，可能很多人不知道，他写的文章都很有深度，但了解的人不多，所以传播性就比较差，我就把它放在右下角。


    另外一个号叫做砍柴戴老板，写的东西很有深度，然后又篇篇 10 万+，所以传播性跟深度两方面都顾及到了。


    我就在他的左后方跟他有点距离，这个是我努力的方向，就是我找到定位，找到了标杆。


    其实 4 象限的分析方法，还有很多其他的应用，只要你找到两个维度来判断一个事情的，你都可以用 4 象限的分析方法。


    比如常用的时间管理的分析方法。我们可以把所有的事情分成重要和不重要，紧急和不紧急，就画出了 4 个象限。


    ## 四象限分析法应用——时间管理


    ![](img/74d384fc5d948a0c31090e035208669c_152_0.png)


    由于时间关系，我就不具体讲了，大家可以研究一下上面的字，做时间管理，一定要做重要的事，不要把目光放在紧急的事上面。


    第4类工具我要说一下逻辑树，其实逻辑树是跟MECE原则要紧密的结合起来，把要研究的一个问题或者表述的问题，画成一棵树的形式。


    首先陈述一个问题，然后把这个问题分成几个子问题，或者说需要有几个假设，然后每个子问题又都能分出新的子问题。


    ## 逻辑树


    ![](img/74d384fc5d948a0c31090e035208669c_152_1.png)


    大家看一下下面这个图。这样看很抽象，我举一个例子，可能大家马上就明白了。


    开头的时候我问过大家一个问题，广州有多少只鸟？这个问题大家一听都很懵，但是很多公司的面试又特别愿意问这样的问题。还有类似的，比如东莞有多少个厕所？北京有多少个下水道井盖？


    大家不要觉得这个问题很无聊，东莞有多少个厕所，我们是在咨询项目中算过的。因为有一家公司需要做厕所的项目。


    那么广州到底有多少只鸟呢？我们很懵，但是如果你用逻辑树，用MECE的原则来做的话，思路就很清晰了。


    ![](img/74d384fc5d948a0c31090e035208669c_153_0.png)


    我们把所有的鸟都分类，大概可以分为四类：宠物鸟、食物鸟、动物园的鸟、开放空间的鸟。宠物鸟又分为家养的和花鸟市场的，食物鸟肯定分为养殖厂的和菜市场的……


    我们就这样分类下去，每个细分类别你都可以大概的估算有多少只鸟，或者你到市场去数一下，大概就知道了，再算一下市场的规模，同等规模的在广州有多少家，大一点规模的有多少家，这个是可以估算的。


    它不一定百分百准确，但是起码给你提供了一个思路，不会让你一头雾水。我们说算厕所、算下水道井盖都是用这样的方式，你把它划分为不同的类别，不重不漏，然后不停的细化下去，你就可以找到一个切入的方法。


    另外我之前写过一篇文章是写牛人公式的，其实我们把它换成一个问题就是人生的成功取决于什么？用逻辑树的方式分析就很简单，一种是不可控的因素，一种是可控的因素。后面的我就不再细化的讲，大家可以看看下面的图，也可以看一看我那篇文章《研究了
    100 多位牛人，我总结出一个牛人公式》，这篇文章就是用一个逻辑树的方式写出来的。


    ## 逻辑树示例


    ![](img/74d384fc5d948a0c31090e035208669c_154_0.png)


    4 个思维和 4 种工具我就都已经讲完了。


    最后还有一个问题：


    前面问到的总裁办主任该怎么述职，不知道大家有没有思路？


    这个也是我们在实际咨询的时候遇到的。我们给一家公司做绩效方案，涉及到他们年终述职，总裁办主任就很苦恼的来找我们说不知道怎么述职，他把今年做的事情都列了一个流水账，这样其实在述职的时候是会被打很差的分数。我们就帮他梳理了一下。


    大家都知道总裁办主任的工作是没有办法量化的，尤其是不能换算成金钱，但是我们可以用一种巧妙的方式把它换算成了金钱。


    总裁办主任他主要有三个贡献：第一是他帮企业运作高新技术企业的政府补贴申请，以往企业每年都是申请到 300 万，业内的同行一般是 300~500 万，总裁办主任他成功的申请到了
    750 万，我们是不是可以认为 450 万是他个人的突出贡献。


    第二大功劳是他重新制定了一个审批流程，阻止了 5 笔问题采购，经过重新采购，给公司节省了 100 万。


    第三个是他优化了制度跟流程，让总裁每月审批的文件减少了很多，这个也可以以换算成钱。


    最后经过我们的辅导，总裁办主任的述职大获成功。他以往每年的年度绩效打分大概都是 0.95。奖金基数乘以 0.95，就是年度奖金，今年他的打分是 2 分，也就是说他的奖金比去年翻倍还多了。


    他个人的级别也得到了升职，原来是管理 8 级，现在是管理 10 级，变成了公司的副总兼总裁办主任。


    这就是我们管理咨询的思维和工具，在日常生活中帮助我们升职加薪的一个很好的例子。


    今天罗罗嗦嗦讲了 1 小时又 16 分钟，其实还没有讲够，还有很多，比如说上面我列的其他常用的方法和理论，时间关系，我就不能一一讲述了，大家可以在百度里面用关键词搜索一下，大概了解一下。其实很多东西都是很有用的。


    回到最开始的问题：为什么一个 22 岁的小年轻，可以教一个 55 岁的大老板怎么管公司，怎么做生意呢？其实，不是因为这个小年轻很厉害，而是因为他利用了这些管理咨询的思维与工具，对问题进行了系统化的分析，所以才能够认识到问题存在哪里，并提出相应的建议。


    好，今天我们的分享就到这里结束。


    再次祝大家春节愉快，顺利度过这一段艰难的时期，让自己能够获得更大的进步，未来得到更大的飞跃和成功，谢谢大家。


    ## 如何教育小孩


    讲者：张夏，杭州复博教育董事长、新酷学创始人、校长。张夏校长是浙江大学硕士，曾经在新东方任教，被评为明星讲师，担任考研组组长。成立复博教育和新酷学以后，多年从事少儿教育工作，自己也有两个小孩，对如何培养孩子有深厚心得。张夏校长还是一位厉害的演说家。


    时间：2020 年 2 月


    各位家长，各位朋友们，大家好！我是杭州新酷学学校的校长张夏老师。很高兴能够在 2020 的 2 月 29 号这个非常特殊的时间跟大家做一个分享。因为这样的时间呢，是四年才遇到一次，并且在这个特殊的疫情期间，我们每个人的关注，每个人的生活都发生了不一样的变化。所以呢，今天我想利用不到一个小时的时间跟大家来利用案例分享一下该如何培养孩子。


    今天我们是受到了加盐星球会的邀请，共同探讨该如何对待我们孩子的成长，该如何让孩子变得更加优秀？该如何让孩子形成良性的循环？所以今天晚上我会更多的讲一些干货，能够让大家得到更多的收获。


    经过了简单的介绍呢，很多家长和朋友们对我多少有了一点的了解。我自己现在是两个孩子，都比较小，老大是女儿，三岁；儿子不到一岁。我也是非常感恩，能够有两个可爱的宝贝。我也在向那些优秀的家长不断的学习，该如何培养孩子？让他们变成更好的小朋友。所以如果哪些地方说的还不是特别到位，请大家多多包涵。同时也请一些特别有经验的爸爸妈妈以后跟我多交流，我也多学习。


    在我过去累计十几年的教学的过程当中，无论是在教中小学的宝贝还是教大学生，我都会发现对于不同性格的孩子，有不同的培养方法。对于我们很多家长来说，同样的一种方式未必适合每一个孩子。所以当发现真正你和孩子之间的化学作用起到了非常好的效果的时候，你才会和孩子进入一种良性的循环。我们经常会说什么时候孩子能够开窍，什么时候孩子能够真正有自己的目标，真正能够愿意为自己的目标而努力，这个时候你就会变成一个特别轻松的家长。今天我们一起来分享一下我的新酷学两位宝贝的妈妈的心得体会。


    在我培养的这么多孩子当中有一个孩子非常的突出，他的名字叫应睿点，小名叫点点。现在点点同学就读于杭城最牛的初中杭州外国语学校。他是在700多个全杭州最优秀的孩子当中被最终录取的将近200个孩子当中的一个。他先后六次来我们新酷学的夏令营，他在这个过程中接触到了款非常厉害的软件叫做英语趣配音。在英语趣配音中他坚持超过了1000天（连过年假都没有间断），所以你会发现这样的一个优秀的宝贝背后，到底有怎样的一个培养过程。


    记得我第一次见到应睿点妈妈和应睿点的时候，是我在浙江图书馆做了一场分享会。在分享会中发现有一个看上去非常聪明的宝贝一直在关注着我，跟着我的演讲一直兴奋了两个多小时。在结束的时候，他的妈妈把他领过来说：张校长，我们家从来没有报过学英语，学数学的培训班。但是我们听过你的分享之后，孩子非常激动的想要参加你们学校的活动。我也非常尊重孩子。所以当场他的妈妈就给他报了名。这样我们就结识了。后来我发现这个家庭非常的特殊，尽管爸爸妈妈都是普通的上班族，但他们对孩子的培养是非常有自己的特色的。


    比如我们应睿点同学曾经有一天做了一个梦，梦到了一只瘸腿的猫，早上醒来之后他就跟妈妈进行了分享。他说：妈妈，我梦到了一只瘸腿的猫，这个猫是长得怎么样的，发生了什么样的故事。


    妈妈听得津津有味，跟他说：宝贝，你这只猫特别有特色，你画画很好，能不能把这只猫给画下来？结果，我们点点同学就把梦中的那只猫给画下来了，画完之后慢慢感觉到这是一个非常好的创意。后来就支持我们的宝贝，一直连续不断的创作了非常多的瘸腿猫的故事。同时还注册了一个公众号叫瘸腿猫，当中记载了妈妈对他成长的随笔。很有收获，我推荐给大家。


    你会发现在这个公众号中，我们点点的妈妈为了自己的孩子，或者为了自己家庭不断地总结和提高，洋洋洒洒的写了几百篇孩子的成长笔记，写了非常多的感悟。令我印象比较深刻的是写关于我们新酷学的就有20多篇文章。此外，他们带着孩子去西藏旅行，写了很多篇文章，带着孩子去了一趟黄山，就写了五篇文章。我仔细的去品味每一篇文章，发现孩子和家长互相都是对方的老师，孩子不断的给家长更多学习的机会。你会发现平等的跟孩子做朋友，也许才是让孩子快速成长的秘诀之一。


    除了应睿点，我们发现还有一位同学也非常的优秀。这个同学在温州，名字叫王若涵。今天呢，我会把两个妈妈的心得体会作一个对比，让大家一起来感受下是不是优秀的家庭都是相似的呢。


    在培养过程中我们会发现坚持这个话题非常的重要。这两个宝贝他们都毫无疑问把这两个字做到了极致。不管是英语趣配音的坚持 1000 天，还是他们自己做单词小老师已经超过了
    200 天的时间，你会发现每一个环节的背后，都有爸爸或者妈妈在背后不断的帮助和支持。所以我们对他们父母亲做了很多的访谈与沟通，从中我们也得到了一些启发。我们一起来听听他们的妈妈是怎么说的。


    点点妈妈说：在我之前当全职妈妈那段时间里，我曾自喻自己的职业是母亲，是孩子的第一任老师。从那时起我致力于，把当好孩子的第一任老师为己任，我变得越来越好学，越来越上进。我认为教育首先要完善家长自己，想把孩子教育好，是要自己成长。如果一个母亲拿着一根指挥棒，在孩子面前挥舞着，没有想以身作则、言传身教给孩子树立榜样的话，是不配值得孩子尊敬与信赖的。而孩子在渐渐长大中，如果想尽快脱离自己的原生家庭，跟父母之间几乎无话可说，那才是真正的教育失败。同时，我们来听听王若涵妈妈是怎么说的。


    若涵妈妈说:在孩子坚持各项任务的过程中，我主要做的就是陪伴与鼓励，孩子的内动力才是坚持的关键，陪伴的过程也是家长成长的过程，陪伴孩子英语小课堂打卡甚至激发了我的学习热情。每个孩子的闪光点都不同，和自己比，每天进步一点点，改变的发生需要一个过程，让我们一起努力，默默耕耘，静待花开。


    所以你会发现每一个妈妈在这个过程中，不仅是让孩子得到了进步，自己也得到了很大的进步。所以我想教学相长言外之意就是，我们不要认为孩子永远比我们低比我们差，我们从他们身上也能学到很多东西。这些思想都会体现在你的表情，你的微笑当中。


    第一个问题，周末是如何帮助孩子安排时间的？


    我曾经跟点点妈妈沟通过，点点很少报各种培训班，那么他整个周末是如何度过的？他们只唯一给孩子报了一个叫学画画的班，安排在周五晚上。周六早上让孩子多睡会儿懒觉，同时它会被各种作业占用，周末仅有一个培训班，孩子对待作业的态度就显得从容不迫了，就会很享受这个过程。因为不需要像很多孩子那样急急忙忙做完作业，然后还穿梭于各个培训班。


    她说如果你没有天天穿梭于各种培训班，那你才会比别人有更多的时间去理解透每道题。每道题百分百用心对待，才会真正的吸收和领会，入心入脑。如果真的碰到数学很难不会解的，就会求助百度搜题，但绝对不会抄上答案就完事儿，而是认真思考如何解答出来，直到弄懂为止。点点妈妈说：做作业是调动大脑的活动能力。外面没有学科培训班，上课认真听讲，下课认真做作业，非常的重要，这也一直没上培训班，但还能保持成绩优秀的原因吧。所以你发现很多孩子报了很多培训班，可是最后效果并不好，我想很多的家长要反思一下。


    另外我和他们接触的过程中，经常看到点点妈妈的朋友圈会分享今天跟儿子一起到电影院看了哪部电影，有的时候他们可能时间比较充裕，一口气就看了一两部电影院的电影。不管多忙，从小学开始就保持的一个习惯，不限什么类型的电影，只要口碑好。这对孩子的放松，包括孩子很多想象力都有很大的帮助。同时她还会允许点点玩会儿游戏，阅读自己喜欢的书，去美术馆看画展，去亲近大自然。我觉得这一点在如今功利的社会是很难很难的，很多家长巴不得给孩子报八个培训班，把两天的时间完全给占满。


    第二个问题孩子考试取得了好成绩一般如何给孩子鼓励呢？


    点点妈妈说：从小没有专门为了考得好成绩去物质奖励，一般以口头表扬赞美为主，做个优秀的孩子是常态，所以也就没有刻意要如何去奖励。这个地方你不去分析，就是说明孩子从幼儿园或者一年级的时候，我们就努力让他做到最好，让它变成一种常态。比如说经常被评为三好学生，评为优秀班干部，可能给他打下的这个烙印就比较强，他就很难再变成一个我们常说的不爱学习的宝贝。所以我们说什么事儿都是开头一定要抓好。


    在这点上王若涵的妈妈也有类似的表达。她说：孩子考好了，肯定这个阶段的学习效果，讨论哪些方面可以再微调整，更好的更高的提高我们的效率，但是一般不奖励。


    曾经我也遇到一个我的朋友，他说儿子你考得好有1万块钱等着你，考不好今年的零花钱就自捞。我觉得这样的奖励方式，未必特别的好。因为这会让孩子变得很功利，为了 money
    去考试，这不是一个良好的教育办法。


    第三个问题，如何帮助孩子完成每天的小课堂坚持任务？


    经常做培训家长和老师都知道，有一个名词叫翻转课堂，就是把我们的课堂变成孩子讲老师听，或者是孩子讲家长听。孩子如果想讲的好，他一定要认真的备课。所以我们在新酷学的教学过程中，就给孩子制定了回家之后的小课堂的任务，让孩子每天去讲我们夏令营或者冬令营中学好的三个单词。孩子就比一般的时候更加注重这三个单词的读音，三个单词的内容，还有他们对应的例句。这点我们点点妈妈是怎么做的呢？


    她说：孩子都喜欢当小老师，而小课堂恰恰符合了孩子的心理，看像玩着做老师，同时让孩子有了浓厚的兴趣。其实也不必设立高目标，只要把这一天的的小老师当好，那么这一天的这项任务也就自然完成了。同样的，家长自己在一些事情上给了坚持的榜样，长期坚持一项学习任务，也是一项顺理成章能让孩子学到的东西。所以你发现不管是英语趣配音，每天的配置一分钟两分钟，还是我们的小老师的打卡，都带给我们不同的感受，也就是说我们坚持变成了一种习惯。


    上面是我给大家上传的一个例子，我们会让很多的宝贝，不断地进行单词小课堂的打卡，比如上面的这个孩子叫李树义，英语小课堂坚持了第 24 天，整个过年期间都没有停下来。他家里有一个小白板，每天爸爸妈妈帮助拍摄我们的单词小课堂。这个过程中，孩子会对英语的理解越来越深，备课越来越多，能讲的话也越来越多，毫无疑问他会得到更大的一些进步。我们也期待李树义同学可以坚持完我们的
    100 天，能够有新的突破。


    第四个话题是孩子考试成绩不理想，该如何安慰孩子？


    点点妈妈说：如果孩子考试成绩不理想时，最不应该说的就是成绩，更应避开“分数”这个刺激的数字。哪怕你心里是那么在意，但也暂时把这个“成绩”先看轻。


    我们要知道，如果一个喜欢读书的孩子，他们比我们都想把考试考好，考不好，他们比我们还难受。此时要看重他在考试之前所努力的过程，肯定表扬他所付出的,明白要跟自己比,跟自己的上一次考试比。同时要帮助他,分析成绩取得不理想的原因,让他放下包袱,人生不仅仅只是考试。要相信他,甚至可以故意“放大”他所具有的优势,给他自信。同时要让他知道,家就是他的爱的港湾和心灵的栖息地,家是他强大的后盾。


    所以你发现最后的这句话特别的棒,我们经常说这个不要在乎成绩啊,但实际上有很多的家长啊,不看过程只看结果。上次有个家长孩子考了 98 分,就差了两分,都把孩子的卷子给撕掉了。他说:就是差两分,没有考满分,所以爸爸觉得你并不好。我们觉得呢,跟我们应睿点的妈妈可能就相差很多。因为你发现孩子他只要够重视,那么这个过程中,我们接下来要忽略一些,但是对于不重视的孩子,我们要引导他该怎么样去重视考试。所以我觉得呢,关键还在于过程,结果只是顺带的。


    对于这个话题呢,若涵妈妈说:我们一起讨论错题,找出原因,是会做的做错还是不懂的丢分,学习上做出对应的调整,并鼓励但不惩罚,我们家对成绩是不奖励也不惩罚,学习与成绩是孩子自己的事,激发孩子自己的内动力,但是我们会奖励他的坚持。


    我觉得这句话说的特别好,你奖励他的坚持过程,至于坚持最后的结果是顺理成章的,孩子也会能尝到坚持的甜头。但是如果我们只衡量结果,那其实很多孩子并不希望这个过程,因为这个过程是很漫长也很痛苦的。


    ## 第五如何培养孩子按时完成作业的习惯?


    相信很多家长很在乎这个话题,有经常辅导孩子作业的家长非常的抓狂,非常的崩溃,心脏病都要气出来了。我们来听听点点妈妈对这个问题是怎么说的:按时完成作业的习惯,最佳时间是小学一年级就应该养成。在他做作业的时候,身旁的家长就不能在做副刷,刷手机的事。平时要有意识的跟他们讲些时间管理的话题,并身体力去管理好家长自己日常的时间,这些无形中影响孩子时间上的观念,并且学会管理好自己的时间。还应让他明白如果因为自己时间没管理好,影响到别人的时间,那是一件“不好“的行为。


    同时每个孩子他的性格和效率都是不一样的。有的孩子非常快速,但是错误很多,有的孩子慢腾腾的,但是很仔细,我们针对不同的孩子,要有不同的培养和训练的方式。但是我们一定要记住补他的短板是需要鼓励的,而不是不

    '
  merge: 1
- raw:
  - '[PAGE 162]


    断的去放大他的错误，不断的去指责挖苦孩子。这样孩子反而就会把这个点越放越大，跟你的想法背道而驰。


    第六孩子遇到不喜欢的老师，导致对科目产生厌学情绪怎么办？


    点点妈妈说：孩子遇到不喜欢的老师，还取决于家长对这个老师的态度。有些家长会带两头说，这个老师怎么这么差呀？这个老师怎么这么不好？你看他这个题目都出错了。他会把自己的这种情绪传递给孩子，孩子也会觉得这个老师特别不好。那么大家都知道，在小学段或者初中段的孩子非常在意老师，这个老师年轻一点，颜值高一点或者说话的时候对孩子关心关爱多一些，孩子这一门功课可能就学的更好一点儿，但如果这个老师年龄大一些，或者讲话孩子不爱听，可能这个学科他就会受到很大的影响。


    这个时候我们要暂时放下个人的成见，一定要帮孩子放大这个老师的优点，绝对不能在孩子不喜欢的时候推波助澜他的不喜欢，这样就会导致孩子对这个科目的厌学。甚至对孩子不喜欢的科目，你还得成为他的同学，你要扮演起学生的身份，对这门科目产生浓厚的兴趣，慢慢去影响改变他。甚至孩子一旦出现这不喜欢的“苗头”，家长得及时跟这门科目的老师沟通与交流。绝对不能等到他已经彻底的不喜欢或者厌恶的时候，你才去找地方给他补课，那其实怎么补也很难提高这个孩子的兴趣。所以大家发现越小的孩子，好的苗头是非常重要的。


    对于这个问题，若涵妈妈说：有遇到很不负责的代课老师，也经常遇到换老师，告诉孩子当我们不能改变环境的时候只能改变自己，学生要去适应老师，不然吃亏的就是自己，被淘汰的永远是不适应变化的人。


    这让我想起我在上高中的时候，我的化学老师换了两个，后来换的这个老师是一个年龄非常大的老太太。因为我是班长，他对我的一些细节还比较苛刻，导致我对这个化学老师特别的不喜欢。后来在我的整个学习中，高中的化学变成了我的短板，最后在我考清华大学的时候，就是化学错了一道题和清华失之交臂。


    第七冬天如何帮助孩子早上不迟到？


    好，那么我们来讨论一个非常有必要，而且大家也很关心，经常遇到的问题。我们冬天如何帮助孩子早上不迟到？'
  - '[PAGE 163]


    点点妈妈说：冬天早上不迟到，要做到冬天的晚上不晚睡。早上不迟到，平时家长要以身作则，如往常一样，按时起床烧早饭，不能草草给孩子几元钱打发他到外面吃早餐。冬天早上不迟到，还得做到在当天晚上睡觉前，准备好第二天的衣裤，整理好书包，才能做到不慌乱。我觉得良好的习惯是第二天良好开端的前提。


    那么若涵妈妈说：我们小学到初一，从来没迟到。特别初一以来，都是孩子自己早起，再叫大人起床。她洗漱完毕，早读，等大人做早餐，孩子比妈妈还自律，从小不赖床。我觉得孩子有明确的目标与信念会激发她自律。这一点很重要。目前大学的目标有变化，但是中考的目标很坚定。所以这个目标感是我们一直要树立给孩子的，家长不要只告诉他，你要考清华，考北大。在寒暑假的时候，我们就带着孩子去更多有意义的地方，比如去北京、去香港、去上海，甚至有条件的去美国、去英国带孩子去见识，他才会有自己的明确目标。


    第八个问题是如何培养孩子健康的生活作息？


    点点妈妈说：反对说的是一套，做的又是另一套的家长。要让孩子有健康的生活作息，还是家长要当好这面镜子。家长是否有健康的作息时间，会折射到孩子身上的。你也可以按照孩子的生活作息时间来做，做到早睡，不熬夜，宁可要做的事情，早起做掉。包括点点妈妈经常非常早的起来写自己的公众号、更新，大概五六点六点起来以后睡不着了，文思泉涌。任何优秀孩子背后一定不是一个好吃懒做的妈妈。


    这一点我们若涵妈妈也是一样说，首先大人要以身作则，双职工家庭的作息很规律健康，所以孩子从小的作息都比较规律，健康，另外随着孩子长大，她自己也获取很多健康作息的知识，会更加注意。我们发现了成功的家庭都很相似，家长的以身作则是非常非常重要的。


    第九个问题在交朋友上会给孩子哪些建议呢？


    这一点点点妈妈说的，我觉得还是挺受启发。在交朋友上，会尊重孩子，尊重他所交往的，但会给建议：交朋友是不分“贵贱”不分“优生”“差生”。所谓的“差生”指的是成绩差的同学，成绩差不等于不能交这个同学作朋友，交朋友要看重的是这个人的人品和属于这孩子身上具有闪光之处。懂得“尺有所短、寸有所长”，不要给别人贴标签，每个人都是在学习中成长的。'
  - '[PAGE 164]


    那我们要分享的第十个点是孩子和同学产生矛盾的时候该如何帮助他？


    点点妈妈说：了解为何有矛盾，提出自己的一些看法，只是给他作个参考。属于孩子们之间自己可以解决的，就交给他们自己去解决。而且时常有意无意中讲些关于个人情商之类的话题。如果遇见重大的矛盾，和老师沟通交流，听取老师的意见，如果有必要可以和对方家长来开诚布公的真诚沟通与交流。


    那么我觉得在这个过程中家长一定不要放任不管，同时也不要一味的指责对方或者指责自己的孩子，一定要了解详细的情况来跟孩子做共同的分析。但如果孩子真的是被欺负了，或者被这个不好行为习惯的孩子惹怒了，我们也要帮助孩子伸张正义。


    第十一点是如何帮助孩子平衡好学习和娱乐的时间？


    这也是很多幼儿园和小学甚至初高中的家长头疼的地方，跟孩子说坚决不能玩手机，坚决不能看电视。连我们家三岁的女儿现在每天看朵拉历险记，看的都停不下来，都要把遥控器藏在身子后面，不能让我们给他关掉。点点妈妈就说到：在属于玩的年纪，如果专门来对付学习，失去娱乐的时间，那么未来势必会造成不良的后果，这样的例子其实不胜枚举。如果把平衡的时候用10分来计算，不管用的学习是7分还是8分，但必须得给孩子3分或2分的时间来娱乐，而不是学习时间填满10分，因为孩子的天性就是想玩的，我们要懂得张弛有度，孩子不是一架“学习机器”，也不是你支配的“私人物品”。


    这点若涵妈妈说：告诉孩子作业完成效率的重要性，周末基本都安排一天游玩，小学高段到初中，随着学习任务加重，娱乐相对减少，但是到周末时间外出美餐，逛下街还是可以有的，或者周五晚上松放下，看下电影等。稍长时间的旅游基本要安排在寒暑假。


    我觉得一定要张弛有度，要给孩子喘息的空间。看电影这两个小时非常的放松，其实我本人也非常喜欢看电影响，尤其喜欢看一些科幻或者魔幻的电影，恨不能融入到那样的世界中去。所以我们经常给大家提供一些非常好看的电影或者是纪录片，让孩子进入一个不一样的世界。


    在这里我给大家推荐一个小程序，比较有名的一个公众号叫爸爸营。当中就推荐了非常多的书籍，绘本，还有动画片，纪录片等等。大家如果觉得找不到资源的话……'
  - '[PAGE 165]


    到这样的书单，或者是电影的清单，可以到这个小程序里面去找一找。我们也希望很多的家长能够给孩子一些让他自由自在发挥想象力的空间。


    # 第十二点如何帮助孩子选择合适的兴趣班？


    至于怎么选择合适的兴趣班，点点妈妈还是比较以孩子为主的，她说首先要培养一个有主见的孩子。什么都是家长说了算，什么都是你觉得合适才是合适，什么都是你认为的兴趣才是兴趣，那也只是家长认为的合适。切不要把孩子培养成你想要成为的样子，孩子也是属于自己的个体，他应有自己的人生，自己要走的路，自己要定的方向。聆听孩子内心的需求，观察孩子平时的兴趣，尊重孩子，这样才会帮助到孩子。


    所以将来我的女儿，我的孩子也是希望能够看看她到底对哪一个领域更加感兴趣，我们更多地去培养她。


    这点若涵妈妈是有共鸣的，她说加强与孩子交流，知道兴趣点，幼儿园到小学低段可以多项都尝试下，随着年级升高，作业加重，可以保留最感兴趣的，经过幼儿园到小学这么长时间对各项兴趣班的接触，会很清晰最感兴趣的是什么。我们家长还需要有一个能够观察的眼睛，能够观察出孩子不同的兴趣点在哪里，切记，不要以你的爱好来进行对孩子的束缚。


    # 第十三点如何培养孩子主动开口说英语的能力？


    还有家长问如何帮助孩子培养主动开口说英语的能力，总觉得英语开口晚了，这个孩子就落后了，还有很多的朋友问我怎么上外教课，怎么上在线的一对一，值不值，有什么用等等。我们来听听点点妈妈怎么说，她说：开口说英语，首先还是要培养对英语的兴趣，比如带他去看英语原声电影，或者看些国外的科普类知识电视。看多了，就有了兴趣。还要培养他平时那种落落大方的性格。并且时不时多多赞美英语老师，哪怕就赞美老师的美丽都是可以的。老师布置的作业要积极配合完成，要饶有兴趣地主动地告诉他，想听他背诵朗读英语课本，他配的英语趣配音你听的有滋有味，哪怕装也要装下你的“有滋有味”。并把他当成小老师，向他请教英文，当你有种“处下”的心态，说不定就已经培养成一个很想说英文的孩子了。


    你会发现就是这样的家长，特别的配合能够扮演一些角色，让孩子变得越来越感兴趣，然后说：哇！你刚才讲的真棒啊。像昨天我教我的女儿讲了一个'
  - '[PAGE 166]


    英文单词，这个单词叫西瓜 watermelon，她讲了以后说爸爸这个很难啊，我说没关系，你说吧，我听了以后说：哇哦！西瓜你都会讲了，太厉害了。


    她说，爸爸，我还会讲苹果和香蕉呢，然后全都给我讲了一遍，后来还讲了其他的小动物什么的。家长这种夸张的回应，能激发她给你展示的积极性。


    今天我们举的这两个例子，我发现一个共同点，除了英文坚持以外，他们还都喜欢绘画。上面那幅图是若涵同学，画了一个象形的单词 logo 的一幅图，在里面可以找到很多的单词。下面的这是我们的点点同学在做梦的时候梦到了那只瘸腿猫，瘸腿猫是由我们一张一张的单词纸拼凑而成的。因此，孩子的想象力是非常重要的。


    未来随着我们科技的发展，AI 技术会越来越厉害，机器可以取代人类的很多工作，但是我们看到什么样的工作或者什么样的类型是无法取代的呢？


    最近读了著名作家梁晓声的一本书，让我深思了一个孩子的创造与创新，对他以后人生起到的作用。他写到 “对于小学生，有三部分脑区的发育应该是在成长时期齐头并进的，那就是：主导记忆的脑区、主导计算与推理的脑区（这部分脑区通常也被叫作
    “理性思维” 脑区）、主导形象储存与运用这种储存进行各种方式的表达的脑区（这部分脑区通常也被叫作 “感性思维” 脑区）”。


    而我们家长在孩子成长中恰恰忽视了感性脑区的作用。记忆脑区这个事情是小学老师都要求学生做的，所以不用担心会没有。而理性思维的脑区，是很大一部分家长热衷的，比如说去报一个奥数，报一个科学的编程的班级。而恰恰是感性思维的脑区被我们所忽略，而未来计算机就是不能取代很多我们感性思维的脑区所做的工作，不能取代很多创造性的工作。所以我们一定要重视这个板块。


    那么培养具有创造创新力、未来具有竞争力的孩子，拥有一生幸福快乐的能力，这也是大多数家长的愿望。但是我们不能只重视孩子的硬能力培养，而忽略了软能力和软素质的投入。一名小学生能不断提升联想的能力，包括阅读包括写作等，预示着这名小学生无论以后从事哪种工作，都可以成为一个颇具创新思维的人。


    所以我觉得每一位我们群里的朋友、家长，不管你的孩子有多大，哪怕现在孩子刚生下来或者还没有孩子，我们都要好好的去思考，我们育儿的方向，'
  - '[PAGE 167]


    运用好育儿的很多方法，培养出我们未来的优秀的宝贝。


    不知不觉一个小时的时间到了。今天，我们重点给大家回顾了两个优秀宝贝的妈妈给大家分享的一些内容，我们也会把我们很多的学员家长，对一些问题不同维度的思考，互相取长补短。我觉得这也是我们这个平台所起到的作用，非常感谢每一个家长，今天晚上抽一个小时的时间跟我一起来探讨。谢谢大家。'
  - '[PAGE 168]


    # # 如何做好时间管理


    讲师：李桥，知名企业管理培训师，拥有 10 余年培训和咨询经验，出版著作《麦肯锡真相》、《企业管理培训经理全书》等，主讲企业管理、企业员工素质提升、中国传统文化三个系列课程。李桥老师还对佛法有一定的研究和实践，2013-2017
    年曾于本焕学院（深圳弘法寺和北京大学共建的全国性高等佛学院）全职专研修学。


    时间：2020 年 3 月


    各位朋友，大家晚上好，今天晚上非常和大家分享关于时间管理的一些内容。近些年，随着我们工作越来越忙碌，大家越来越重视时间管理的内容，相关时间管理的课程也很多。今天晚上非常感谢何老师，还有群里面的所有朋友，让我们有机会来一起学习。


    首先，我需要大家找一张 A4 的白纸和一支可以写字的笔，在开始分享之前做一个小小的互动。大家不需要考虑太长的时间，最多就一分钟，想好之后就快速的写在纸上。


    首先，我们把白纸对折分成四份，我给大家 30 秒到一分钟的时间，不要超过一分钟啊。接着，大家按照我的步骤来实施。


    假设我们现在是 20 岁，到 60 岁退休，我们每个人都有 40 年的工作时间。刚才我们把白纸对折成了四份，现在我们在每一份上写下你认为最想实现的愿望。也就是说这张白纸，你要写四个人生愿望，这四个愿望必须是你认为最重要的。


    四个愿望已经写好，现在我们正式开始这 40 年的人生旅程。现在你才 20 岁，身强力壮，但是社会经验、人生阅历相对欠缺，然后你开始努力，时光飞逝，十年时间过去了，你回头一看，没有实现任何一个愿望，这个时候我需要你把这四个愿望当中的一个撕掉。


    好，现在我们已经 30 岁了。30 岁时我们有了一定的人生阅历，有了社会经验，我们继续前进，继续为自己的目标奋斗。光阴似箭，又过去了十年，你还是没有实现任何一个目标，这个时候你再把三个愿望当中的一个撕掉。'
  - '[PAGE 169]


    20 年过去了，我们已经 40 岁了。古人讲 40 而不惑，这个时候可能我们会遇到人生的转折，职业上可能也会转型。我们的人生阅历已经比较丰富，各种社会资源也积累了不少，我们又在为剩下的两个人生愿望努力。但是时间是没有情面的，十年时间又过去了，我们还是没有实现剩下两个愿望中的任何一个，这时你把其中一个愿望撕掉。


