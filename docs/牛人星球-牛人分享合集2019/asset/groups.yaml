    接下来，大家看一下我上面发的第一个营销案例，美国总统的营销案例。这张图片有一部分黑色的人。然后页面对应的，是一些红色的人物。我先对这张图片进行一定的讲解。


    不知道大家对美国总统特朗普的印象如何，我们听说他也许是关于贸易战、也许是他喜欢吹牛、也许是他总爱使用推特发一些让人很不理解的话语等等。


    但是我个人很喜欢他的营销能力，以及它在营销决策上、决策人的选择上、他竞选团队的营销负责人的选择上等，都要远远高于他的每一个竞争对手。而且整个竞选的预期，互选预判的情况，如果我没有记错的话，应该只有一周的预判是错误的。


