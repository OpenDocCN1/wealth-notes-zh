    这张 PPT 是从数字化的角度来看我们每一分钟的工作时间大概值多少钱。上面的数字是我计算出来的年工作时间，休息日我取了一个中值间，只算双休日，节假日没有完全算上，因为现在加班太多了。


    把时间数字化让我们有一种非常直观的感受，在改革开放之初，深圳就有一个口号叫做时间就是金钱，效率就是生命，看着这张 PPT，我们就会有这样的感受。另外我们还应该想的再深入点，很多时候时间实际上是更值钱的，我们有时是需要花钱来买时间的。有些事情你没有必要亲自做，或者你根本就做不了，这个时候你需要花钱来买时间，买别人的时间为你服务。


    举个例子，假设某一天，你需要了解关于佛法方面的一些内容，对你来说可能很困难，那你可以找我啊，我这方面相对比较专业。所以对于那种特别忙碌的企业家，收入非常高的人士，很多事情他都需要花金钱来买时间，买很多人为他服务，这是他需要掌握的一种技巧。


    ![](img/74d384fc5d948a0c31090e035208669c_175_0.png)


    这个表是说我们想定一个目标，去年年收入是多少，今年我想达到什么样的目标，做一个对比。这个目标可以高也可以低，不是说每年一定要增长，人生不是单行线或者一直前进，我们还可以充电，充电是为了更好地前进，这也是一种目标。


    ![](img/74d384fc5d948a0c31090e035208669c_175_1.png)


    这张讲的是时间的特性。上面给出了四个特点，一是没有弹性，第二个没有办法存储，第三个无法替代，第四个无法失而复得。


    第一个没有弹性，比如现在我们呆在家里面非常的无聊，我想把时间压缩一点，搞得短一点，不行的。我现在工作很忙，把时间拉长一点，不行的，它没有弹性，不能够收缩。


    第二点没有办法存储，这个就非常直观了，时间就是一种固有的规律在运行，你没有办法囤积起来。假设我们有能力把时间存储的话，我们可以开一个时间银行一定可以变成世界首富，一定是一个最赚钱的生意，但可惜我们做不到。


    第三个没有办法替代，谁的时间就是谁的，不管你跟对方的关系怎么样，再亲近的人也好，都没有办法替代。不管是父母、妻子，儿女，谁的时间就是谁的时间。


    第四个没有办法失而复得，时间过去了就过去了，未来的也不能够提前来到。从时间的特性我们也可以看出来时间实际上是不可以管理的。那么我们时间管理究竟管理什么呢？我相信经过我们后面的内容的分享，大家一定可以得出一个结论，时间究竟管理什么？


    ![](img/74d384fc5d948a0c31090e035208669c_176_0.png)


    好，下面是一个重点内容，我们花的时间要相对多一点点。这个说的是四代时间管理理论的演进。第一代时间管理，是一个备忘录型的。什么叫做备忘录呢？简单来说就是我现在想到一件事情，或者我想做的事情，我就把它记下来，这就叫备忘录。比如今天我们上街去，正在逛街突然看到别人在做一件什么事情，后来我就联想到我应该做一个相关的事情，我把它记下来，这就叫备忘录。


    这个备忘录的优点就是应变能力很强，没有压力。因为你想到了就把它记下来，没有其他任何安排。当然缺点跟优点往往是相对而言的，那么这个缺点就是随意忽略了整体的规划，因为我们只是想到一些事情，把它记下来，至于怎么做，什么时候做，需不需要什么条件，需要哪些人来配合，这些我们都没有考虑，所以它忽略了整体的规划。


    第二代时间管理叫做记事簿规划与准备，这个跟第一代时间管理比较，就已经有了一个对于未来的规划。它的优点是强调了行事历程，对未来有规划，缺点呢，是针对第三代时间管理来说的，就是没有考虑价值以及重要性。虽然它对事情未来有规划，比如这一周我要做什么事情大概有一个规划。但是这个规划并没有放在以价值为导向的前提下来考虑，也没有考虑这个事情跟其他事情的重要性比对。


    第三代时间管理强调价值规则，制定优先顺序。第三代时间管理的应用非常的广泛，等会我们还有另外的PPT来讲一下。它的优点就是以价值为导向，可以提高生产力，强调价值为导向。举个简单的例子，比如作为一个企业老板，我们生产东西首先是看市场需要什么我们才生产，不会说我们先生产，然后再出去搞宣传。顾客需要什么，市场需要什么，这就是一种价值为导向。让它引导我们做出相应的生产计划，这样我们就不会浪费一些人力物力。它的缺点是缺乏自然法则，缺乏远见，这是针对第四代时间管理来说的。


    第四代时间管理是强调方向很重要。就像我们最开始做的互动，在人生中你想实现的最重要的愿望究竟是什么，你的人生想要怎样过，这是一种方向性的问题，非常重要。当然第四代时间管理它也有缺点，就是方向很难确定，特别是对于年轻人来说。比如，刚刚大学毕业20多岁，人生方向不知道。需要一定的阅历、人生经历，一定的知识背景或者导师的引导，指点等各种条件，你才可能确定人生方向是什么，或者说你的职业生涯方向是什么。


    一旦我们确定对了方向，再结合前面的这些时间管理的方式方法，才能达到最好的结果。


    如果我们觉得现在各方面都挺不错，在别人眼里我们可能也过得不错，各方面取得的成绩也是很好的，但是到老了之后，突然觉得人生是没有什么意义的。觉得我以前做的事情实际上都不是我最想要的，直到老了才发现，这时已经没有时间了。所以学习时间管理，可以让我们早一点建立确定人生方向的意识。


    学习时间管理的很多同学会问同样一个问题：“李老师，我现在想把工作和生活兼顾的好一些，有没有什么好的办法呀？”


    实际上这个事情可以从两个方面来回答。第一个是从微观来讲，时间是不能够兼顾的，具体的时间点我们是不能兼顾的。但如果把时间段拉长远来看是可以兼顾的。我举个自己的亲身例子，近十多年以来，我在传统文化还有佛法方面花了大量的时间，其中包括四年全职去读佛学。四年的时间你说短不短，说长不长，在这四年里，学校管的非常严格，不能够出来，外面的事情根本就干不了，你说我怎么兼顾啊？在这个时间点我要么在学校，要么就出来，没有办法兼顾。


    但是如果把时间拉得更长远一些，从某个角度来讲，也可以说有些兼顾。因为社会上的事情我还是做了一些，并不是什么都没有做。但是有得必有失，你在哪里花的时间多就会有收获，另外的方面你可能花的时间少，取得的收益就会小一些了，这个是肯定的。哪个方面都想百分百的得到，那是不现实的。跟我同时出道或者说出道很晚的一些人，现在都已经成了这个行业里面的大咖了。所以就看你在哪里花的时间多，你需要做一个抉择，工作还有生活是一样的道理。比如你现在正在跟部门的经理开会，家里突然来一个电话让你回去，这个具体的时间点你没有办法兼顾，要么在公司，要么就回家。


    但如果时间拉长一些，十年二十年下来，你是可以有一些方式方法，用智慧来把握，兼顾的相对好一点。比如你可以制定计划，每个月跟家里吃饭几次，特别是做企业的朋友，非常忙，应酬多，考虑的事情多，每个月要陪小孩几次，要辅导几次功课啊等等，你是可以做出一些规划的。你可以相对兼顾的好一点，不可能百分百的兼顾。有些事情我们是不能够等待的，必须要当下去完成。比如孝养父母，特别是父母年龄比较大了，你现在不孝养，等到以后有时间有精力了，父母已经不在了，这样的事情时常有发生的。


    很多年以前就有人提出了第五代时间管理，实际上是一种人生的立体性管理。但这种说法没有随着时间和空间的积累影响到更多的人，现在基本上已经听不到了。


    ![](img/74d384fc5d948a0c31090e035208669c_179_0.png)


    这张 PPT 是时间管理的计算图，这是第三代时间管理的一个重要的应用。它是从事情的紧急重要与否来进行划分，紧急就是说事情是不是非常紧迫，是不是立即做，重要是说这个事情对我们的影响怎么样，如果不做影响非常大，那就是非常重要。这两个维度来划分成了四个象限，第一象限就是说不紧急但是重要；第二象限紧急重要；第三象限是不重要但紧急，第四象限是不重要也不紧急，这四种类型的事情。我们来做一些剖析。


    第一象限不紧急，重要的事情。PPT 里面列举了几种，比如准备事项，预防工作等等。这种事情就是非常重要，并且短期可能是完成不了的，所以它显得不是那么紧急。对我们个人来讲比如健康管理是非常重要的，但是现在可能你的身体状态还非常不错，所以说还不是那么紧急，这是第一象限。


    第二象限紧急非常重要。比如危机、紧急的问题，有限期的任务，会议准备事项等。现在我们当下有一个事情就属于这种，就是新冠病毒产生的疫情，这个疫情现在已经蔓延到整个世界了，这件事情就是既紧急又重要。紧急是说马上必须要处理，如果处理不好可以影响到个人的生命，这是非常重要的。所以就疫情来讲，不管是对我们个人，对公司，还是对国家，对全球都是一个紧急重要的事情，必须马上搞定。


    第三象限就是紧急但是不重要，比如干扰电话，紧急事件，凑热闹等这样的事情就是一些紧急但是不重要的事情。


    第四象限不紧急不重要，这种事情最好是不要搞啦，完全就是浪费时间。比如看太多的电视，无关紧要的信件等，这就是浪费时间，不重要也不紧急。


    这四个象限的事情就是根据紧急还有重要与否来做出了一个排序。这四个象限的事情是可以变化的，不是固定不变的。举个例子，比如现在我们的身体健康非常重要但是不紧急。好啦，你没有引起重视，过了十年八年，身体出现问题啦，然后得了什么病，如果不马上医治，很可能生命就结束了。那么它就变成了重要紧急的事情，从第一象限变成了第二象限。


    再比如说第四象限不紧急也不重要的事情，我们通常认为好像都不会变化的。但不是的，每个事情它不是一成不变的，任何一个事情展现出一种结果，都需要有一定的条件满足，条件一变这个结果就会变化的。


    比如春节很多人在家里待这么长时间，没有什么事干，就追追剧，看电视，这个事情是不重要也不紧急。看电视过程当中，可能有人就发现，或者说朋友告诉他，他说你有天赋，他看电视做出的评论很有价值，观点非常新颖，有洞察力，阐述观点的证据逻辑清晰，非常有说服力，可以影响人。这个朋友建议他可以做一个电视评论，然后他就开始兼职做，一看做的挺不错，他就全职做这件事情。看电视本来对他是不重要也不紧急的事情，但他现在把这个事情当成一个工作，那就变得比较重要。因为他要靠它收入，非常重要。是否紧急呢，如果他三天五天要出一个电视评论，甚至可能每天都要出一个，那就肯定紧急啦。所以就从第四象限变成了第二象限的事情。因此，这四个象限的事情是可以相互转化的。关于时间管理矩阵图，我们就大概分享这么多。


    ![](img/74d384fc5d948a0c31090e035208669c_180_0.png)


    这张 PPT 是说时间管理的一个不良分配，是经过调查统计，用抽样样本统计出来的。其中花费最多的就是重要紧急的事情，花了45%的时间。这种事情影响很大，非常重要并且当下就要处理，不搞定影响重大。


    第二花时间多的就是紧急不重要的事情。这种事情实际上不应该花这么多时间，比如一些骚扰电话，非常紧急但实际上不重要。


    第三花时间多的就是不紧急也不重要，就是那些浪费时间的事情。比如追剧，刷微博，刷抖音，可能对很多人来说他没有太多实质性的收获，都是一些浪费时间的事情。最后这个重要但是不紧急的事情花了
    5%，这是一个不良的时间分配。


    ![](img/74d384fc5d948a0c31090e035208669c_181_0.png)


    这张 PPT 是一个理想的状态，最佳的时间分配。这是两大类事情，花时间最多的应该是重要不紧急，然后重要紧急的事情。当然这是一个理想状态，实际上我们不可能做到这样。另外两类事情我们还是会做一些，人也不可能说百分百绷的那么紧，如果绷得太紧，是不行的，人可能会崩溃。古人讲：文武之道，一张一弛，就是说我们尽量把时间花在我们自己认为更有意义，更创造价值的一些事情上面，这是最理想的。


    ## 拖延时间的借口


    - 时间还多着呢，明天再做。

    - 期限未到，急什么？

    - 它太令人感到不愉快！

    - 它很难！

    - 目前我很忙，匀不出时间做那件事！

    - 兹事体大，我怎么能贸然采取行动？

    - 我现在没心情做这件事！

    - 在行动前，我要先休息一下！


    接下来一张是拖延时间的借口，这个我们就不每一条细讲了，不要耗大家太多时间，我们讲一些重要的原则。


    拖延时间的借口整体来归纳的话就那么几类。比如：时间还多着呢，明天再做，这就是一种拖延，非常明显是拖延。当然也有可能是某些事情，不太好搞定，现在想着手做又不好做，所以明天再做。


    第二个就是期限未到，不是那么着急。第三个是说令人感到不愉快，这完全就是心理上我们应该要克服的。我们现在是成年人相对好一点，但是现在的小孩，电子产品非常多，电脑，手机等等，他从小就在用了，玩一会儿游戏，看一会儿手机，心情就非常愉悦。但是一到做作业的时候，就感觉心情不爽，这时形成一个强烈的对比。电子产品实际上对我们成人也是影响很大的，我们大人对电子产品应该要尽量的控制，在工作的时候尽量的远离。在很多时候手机、电子产品会耗我们很多时间，并且还耗我们的元气，对身体有很大影响。


    下面是比较困难啊，确实可能有些事情是很难，也有一些可能是借口。


    下面就是比较忙啊，抽不出时间来做这个事情。有时候可能真的也很忙，有的时候可能是一种借口，如果真的很忙，有些事情你是需要花钱买别人的时间来辅助你的。或者作为一个领导，该出钱就出钱，不能什么事情都自己搞定。


    再下面就是说这个事情很重要，不能够贸然行动，你想准备的更多，但是很多时候不可能准备到 100% 才行动，这是不现实的。


    再下面的就是没有心情啊，最后就是说要休息，这些大概我们就过一下。


    ![](img/74d384fc5d948a0c31090e035208669c_183_0.png)


    接下来一张 PPT 是时间不够用的原因。这里列了 12 条，我们大概做一点点分享。第一个欠缺计划，是第四代时间管理理论的问题，可能你是方向不够，方向不够导致目标可能不准确，目标不准确就欠缺计划，当然也可能方向什么都有了，仍然欠缺计划。第二个行事优先级错误，可以用第三代时间管理理论来对应。它是价值没有搞清楚，没有制定优先顺序来操作。


    第三个是事必躬亲，不懂得让自己的时间产生最大的价值，也可能不知道怎么花钱用别人的时间来给自己服务。这个时候是有很多技巧的，比如一些简单的事情，虽然我们做到了，但是要花很多时间。如果你不想花时间，那你就需要花钱买别人的时间，比如你已经当企业家了，家里面都很忙，那做饭、打扫卫生你要请钟点工。或者说你遇到一些专业性的问题，可能要去了解相关的知识，比如有人想给你算一命，你不知道命运这种事情，你说你要去了解一下，那就要去咨询相关的专业人士了。


    第四个是沟通不良，第五个会议太多，这些都是很多公司非常容易发生事情。


    第六个就是拖延，有些人可能就是来磨洋工的，他上班可能就是这么一种状态。


    第七个是不好意思拒绝，我们要学会拒绝。要知道什么时候该拒绝，什么时候不该拒绝，然后有相应的方式方法。


    第八个干扰电话。第九个是文件满桌，找不到，我们相关的文件没有归纳整理，要找的时候可能找半天。第十个是出差，这个耗的时间太多，把我们的时间碎片化了，这些碎片化的时间就不知道怎么用。现在我们经常大块的时间碎片化，没有利用起来。第十一个是吃太饱，吃多了就容易睡觉。第十二个上司找麻烦，这个就是另外的因素了。


    ## 时间管理原则


    - 明确目标

    - 有计划、有组织地进行工作

    - 分清工作的轻重缓急

    - 合理地分配时间

    - 与别人的时间取得协作

    - 制定规则、遵守纪律


    这是最后一张 PPT 了，说了一个时间管理的大原则。第一个就是要确定明确的目标，这个目标怎么确定呢？我们可以结合前面的第四代时间管理方法，首先你要有一个正确的方向。有了正确的方向，现在你在的地方是起点，你要到哪里，你就可以根据这个制定长期目标，中期目标，短期目标。


    第二个是计划，有组织地进行工作。比如时间管理的优先级你就可以用进去了。第三个分清工作的轻重缓急，也是配合前面的方法。


    第四个合理的分配时间，不同的项目或者说不同的事情，时间的分配不太一样，这里面有些是通用的，有些是个别的技巧。比如通用的就是在关键的节点，你的时间准备的充不充分，反馈的时间有没有？纠正错误的时间有没有？现在很多事情变化很大，俗话说计划不如变化，变化不如移动电话，可能老板一个电话一来，很多计划都打乱了。那你有沒有留出相应的修正计划的时间呢，这就是一个合理分配时间。


    第五个是与别人的时间取得协作，现在这个社会是一个团队作战的时代，单打独斗的时代早已经过去了。很多事情是需要团队来完成，别人可不可以跟你同时做这个工作。如果你的工作需要别人的时间来配合，那么你要先进行协调，否则的话很多环节没有沟通好，那你这个计划可能就白做了。


    最后一点是要制定规则，遵守纪律，这个也很重要，没有规矩不成方圆，特别是公司大了，很多规章制度都必须要制定，然后要有力的实施。只有这样，在时间的利用上面才可以更加高效，更加的有成果。


    好，今天的分享就到此为止。期望能让大家在时间管理上引起重视，有所收获。今天晚上非常感谢何老师，还有群里的所有朋友，让我有机会给大家一起来分享关于高效时间管理的相关内容。最后祝大家身心健健康康，财源广进，阖家幸福，万事如意，谢谢。


    # 派驻非洲三年见闻


    ## ——中国企业与中国人在非洲的商业与生活


    讲师：朵朵，清华硕士，曾任驻非洲记者。朵朵是清华大学传播学硕士，毕业后一直当记者，她跑遍了非洲很多地方，也经历过一些动荡。她的实地观察，将帮助我们澄清很多对非洲和非洲人的误解。


    时间：2020 年 4 月


    大家好，我是朵朵，今天很荣幸受何加老师委托来给大家讲一讲非洲。我和何加老师是很长时间的朋友了，今天我给大家讲一讲非洲，主要分成三个部分。上次有群友也问了一些问题，我把这些问题也都包括在这三个部分里面。


    第一部分，我大概讲一讲非洲的概况，让大家对非洲有一个大概的概念。


    第二部分，有群友也问到欧美和中国在非洲的势力范围。我给大家讲一讲，哪些大国在非洲影响力比较大，就是大国在非洲的势力对比。


    第三部分，我主要聚焦在中非关系方面。那可能中非关系是大家最感兴趣的一个话题，里面我会涉及到基建；还有中国私营企业在那边的情况；还有中国和非洲在疫情合作方面的情况；还有一个中非的舆论的互动。


