  - '[PAGE 130]


    的相当的不错，但就是没有办法走到那一步，或者没有印度人这么普遍。


    还有一个就是即使是二代的华人和印度人相比，甚至和第一代移民的印度人相比，似乎也比不过印度人，这就是非常有意思的一个现象。大家会想为什么呢？我们到底差距在哪里或者区别在哪里？我今天就跟大家分享几个我的观察。


    我先从一个我觉得最重要的点说起，就是多样性和包容性。如果从领导力的角度来讲，这是一个非常重要的领导力胜任力。不管你是工作在跨国的大集团，还是在一个组织里，或者一个小企业里面，能够和不同的人打交道的这种能力是非常重要的。我个人感觉印度人在这方面似乎有一个优势，这个跟印度的整个大的环境背景是相关的，印度它本身就是一个多种族，多文化的国家。从社会的层级来讲，可能有不同的家庭背景：从宗教信仰来讲，可能都有不同的宗教信仰；最简单的就是从食物的选择。


    我的老板是一个印度人，他就跟我分享过，在他上学的时候，孩子们都自己带食物到学校，你就会发现，每一个孩子的饭盒里的食物都是不一样的。我们都知道穆斯林的人是不吃猪肉的，信仰印度教的人是不吃牛肉的。在等级制度中属于最上层的等级的人，他们是非常严格的素食主义，属于武士阶层的他们是少吃少量的肉类的。但他们的肉类可能又会有一些区别，有一些只吃鸡肉，有一些只吃蛋，有一些可以嚼牛奶，有一些又不能喝牛奶，这中间具有非常多的选择，每一个家庭可能由于他们的不同组合都会不一样。


    如果从印度的宗教角度出发的话，印度教是一个多宗教，他有一千多个神，跟一种教巨大的区别就是，虽然我们都是信仰印度教，但是你信的神和我信的神可能完全不一样，你敬神的方式和我敬神的方式可能完全不一样。印度的孩子从小在这样
    的环境里长大，他们对于这种多元化的包容性和接受性，我觉得会比华人强一些。


    第二点就是印度的整个社会系统是很没有秩序的。


    我就给大家举个例子，就是堵车，我在亚洲很多地方旅行的时候都有遇到堵车，也都有很严重的，比如菲律宾首都马尼拉，还有印尼首都雅加达的堵车都是有名的糟糕。但即便是再怎么糟糕的地方堵车，可能还是可以看到两条线的，一条线是过去的，一条线是过来的，只有在印度，你是看不到两条线的。'
  - '[PAGE 131]


    车真的是横冲直撞，随时可能左边来一个车，右边来个车，可能还会有车逆行，车的型号大小也各不一样。


    拿堵车来举例，是想说在印度这个社会里没有秩序的情况是怎样的极端。那么在这种极端的条件下大家都习惯了，心里想着我要想办法自己开辟道路。比如开车，我就想办法开出一条我的路来。另外印度的政府是相对不那么给力的，这个我等一会儿在聊到民主制度的时候会说。中国有一个比较给力的政府，很多事情政府会帮你想得到，帮你解决，包括我生活的新加坡也是，政府管的面面俱到，真的就像是父母官儿一样。


    在印度就不一样啦，在印度做事情，你就别想着靠政府就对了。靠政府首先慢，第二它也不一定能量解决，所以印度的各种民间组织特别的多。有一些是盈利的，有一些是非盈利的，因为每个人想解决问题都要去想办法。包括成本控制等，印度人也很擅长做一些低成本的事情，大家都知道塔塔生产的车。还有印度很多的产品都是以成本低廉为标志的，因为这个在他们看来是很重要的


    联系到领导力我觉得这对印度人的执行力，还有在非常多不确定的条件下，能够杀出一条路的这种能力都是很好的锻炼，因为他们的背景会有一个很艰难的环境，对他们的这种锻炼是很好的。


    刚才我说了两个领导力很重要的方面，一个是多元化和包容性的行为；另外一个是说执行力的方面。接下来我想说善变的能力，对于领导力来讲也是很重要的。因为我们说领导力，其实说到最后讲的就是影响别人的能力，你要能够影响别人，必须得有理有据，能跟别人进行一个
    Argue（争论），倒不一定说是吵架和辩论，但是你要把自己的观点亮出来，而且要亮的很漂亮，我觉得这一点印度人也有些优势。


    这个优势可能跟印度人的历史文化和民主制度都是有关系的。有一本很有名的书叫《好辩的印度人》。在民主制度引进之前印度的宗教不是一种教，它是多神教，多神教其实就非常强调这个
    Argue。同样一个信仰或者同样一个神，也要强调为什么是这样，为什么我们讲的这个教义是这样。包括现在印度的宗教，也还是有很多人在进行各种各样的讨论。这些其实都是对于文化的一个思辨能力，是很好的锻炼。'
  - '[PAGE 132]


    近代引进民主制之后更加强化了这种讨论、辩论的能力。我个人感觉在印度生活的时候，还有在新加坡和印度人接触的时候，我发现他们的思路比较敏捷，而且有 critical
    thinking (批判性思维) 的能力。有一些不一定完全正确的，或者是一些歪点子，他也能说的头头是道，这就是能力的表现。


    印度有很多档的节目都是以辩论为主的。这个跟我们的奇葩说还不一样，它是一种时事节目，会请四五个嘉宾来根据某个时事做一个讨论。有一次我记得他们讨论穆迪政府要不要更多的照顾穆斯林，或者说要不要这么偏袒印度教而引起宗教上的一些纷争。那四五个人就会各自讲不同的观点，电视屏幕上有四五个屏幕，大家都在叽里呱啦，叽里呱啦，讲的特别快。而且有一些讲的特别有道理，他们也没有所谓，随时可以打断别人，这种氛围、这种节目我在中国是从没有看到过。我第一次看到的时候简直就被吓到了，但是后来觉得如果一个孩子，一个年轻人在这样的氛围内长大的话，那么讨论甚至是辩论，对他来说根本就是家常便饭。这一点在我的印度同事中也能感觉到很大的不一样。


    说到这里，我再讲一下语言的问题。很多人会说，中国人跟印度人相比有劣势，因为我们的英文不如别人好。我刚才也说了，如果是二代移民，他们的英文应该跟本地人一样了，为什么他们也不如印度人呢？我觉得语言是会有一定的影响，但更多的是语言后面的一些东西。


    说到语言我又想到殖民文化、殖民历史对印度的影响。也许间接的也造就成了更多的印度领导者或者是国际人才。大家都知道印度有非常长的、屈辱的一个历史，英国人的殖民绝对不是带着好意来的。但是无意中确实也让印度跟现代化有一个很好的链接，比如在印度建了铁路，印度的很多中等以上的家庭说英文，这些东西都帮助他们跟西方世界产生一个很好的连接。


    这里而我觉得挺有意思的两个点，一个是，我的感觉印度人在和西方人沟通的过程中，他们的连接点会更多。就比如我的印度同事和我的美国同事在一起的时候，印度同事就很容易的能听懂美国同事说的笑话。有的时候我在旁边会觉得，我其实没有听懂他的笑点在哪里。英国人的黑色幽默，也不是所有人都能够明白的，但是印度人很容易明白。所以有些东西是超越语言的，中国人在国际组织中，有一些不利的地方，并不在于我们听不懂每一个单词。'
  - '[PAGE 133]


    我相信能够在国外接受过教育的中国人都是能听懂的，但是你能不能 get 到那个点，那就是另外一回事。有些东西可能需要更多的历史文化和社会背景才能明白，在这种情况下，中国人就有一些劣势。


    我还有一个挺有意思的观察，就是虽然他们经过了这么久的殖民统治，印度的传统文化保持的是相当的完整。举一个例子，我们都有传统的服装，印度的女性是很喜欢穿着传统的服装去上班的，就是她们的纱丽。


    看到公司里面那些女生穿着五颜六色的纱丽，我就觉得很神奇。这样的传统服饰，中国人也有，也有唐装、旗袍等等，唐装近几年开始越来越流行，大家开始回归。旗袍也有，但是旗袍我们一般是穿到比较正式的晚宴，或者是结婚的时候，这样穿一下，意思一下，但是不会每天穿，更不会天天穿着它去上班。但是在印度的工作环境下，穿着纱丽是很正式的，而且是很被认可的，甚至被尊重的一种做法。他们的女性可以天身穿纱丽去上班。我觉得这是一个很有意思的点，印度人对自己的文化有一种深深的认可。


    这一点反而有助于他们在国际环境中赢得尊重。我知道有一些印度锡克族的男性，他是要用头巾缠着头的，而且他们一辈子可能都不会剪头发，也很少刮胡子。在一群西装革履的公司高层里面，就有那么一个人，他坚持他的这种历史和文化的东西，反而得到了西方人更多的尊重，这一点很有意思。


    最后我也想分享一下关于抱团。很多文章有讲到印度人喜欢搞裙带关系，这个确实，如果从整体来看是有的。但我个人有一点保留意见，我觉得一个人当上领导之后，选择自己熟悉背景、相知相熟的人是很正常的。而且有意思的是印度人相互支持对方会比较多一点，反而很少看到在一些外国的企业，中国人不断的提拔中国人。


    我记得我有一个同事，他跟我讲过："索菲亚，你有没有发现，如果一个公司里面只有两个中国人，这两个中国人一定是互相踩的，他们会互相较真儿，暗斗或者明斗"，我发现好像是㴠。但从另外一个角度来讲，我又发现我们在世界各地都很容易找到唐人街，就是中国人聚居的地方，但是我们很少会发现印度人聚居的地方。这个我觉得很有意思的在于印度人对自己身份的认同，比起中国、韩国和日本人，他们好像没有那么强烈。特别是到了西方的社会里，中日韩这种文化的相似性是远远超过中国和印度文化之间的相似性的。'
  - '[PAGE 134]


    印度处于南亚次大陆的地区，西方人说到亚洲的时候，可能想到的更多是中日韩，还不一定包括印度人。印度人的文化传统可能跟中东那边会更像一些，他们本身好像又有点像南欧的人，所以我觉得印度人的圈子比中国人要开放。我认识的印度朋友，也会有一些印度帮在一起，但这个印度帮是相对松散的，不像华人帮是非常紧的在一起，有点那种抱团取暖的感觉。但是印度人会游离在各个帮之间，这里混一下那里混一下，好像都可以。


    这个大概就是我总结下来的几点了：1. 多样性和包容性；2. 在不确定中开出一条路的执行力；3. 善辩的影响力；4. 殖民和西方链接，同时对自己文化的保留；5.
    抱团的同时融入别的团体。


    那最后我又想到了一点，最近我看了一部挺火的纪录片，讲的是他乡的童年，尤其是看了印度篇，我觉得那个导演有点抓的还是挺准的。


    比如有讲到印度人如何在没有规则可循的环境中找出一条路，还有印度人自发的做一些教育的行动，还有他们如何培养孩子思辨的能力什么的，我觉得有很多东西值得借鉴。


    但其中最打动我的一个故事是讲的一个台湾的小孩。他的妈妈是台湾人，爸爸可能是印度人。这个孩子他有一点点轻微的多动症，在台湾的时候被老师说成你怎么这么笨之类的。孩子回去就问妈妈：“妈妈，我是不是真的很笨？”后来他们全家就移居到印度。


    移居到印度之后，这个孩子突然就放飞啦，孩子得到了很多认可。他的创造力也被无限的激发出来变得特别自信，能力各方面也进步的非常快。


    这一点给了我很大的启示。从教育的角度出发，我发现印度的整个大环境，对孩子的一些所谓的奇怪行为的接纳度很高。在华人社会，包括刚才提到的台湾还有新加坡，我觉得华人家长包括我自己都会有很多条条框框。你要在这个框里面才是好孩子，你出了那个框，我就有点焦虑，觉得我要纠正你，或者这样是不对的，甚至我要惩罚你。


    但是印度整个大环境就比较宽松，大家对条条框框的概念没有那么的严格。所以如果我们认真去看这些成功的印度领导人的经历，一定也会发现他们都是在 一个相对宽松的环境里面长大的。


    我有一个有趣的发现，就是在新加坡地铁等公共场所，如果你听到小孩尖'
  - '[PAGE 135]


    叫，去看看，基本上都是印度的小孩儿才会尖叫，叫的特别吵。我们华人肯定会说不可以。更有意思的是我在日本旅行的时候发现那边的小孩好安静，我就想这到底是孩子天生的还是社会原因嘞。


    今天的分享先说这么多了，谢谢大家。


