    ### 资源与民生


    有一个群友还问到，非洲据说是资源非常丰富的陆洲，很多矿藏的品质都比国内高，我国在非洲的基建项目主要是哪些。


    基建项目后面再讲。非洲的资源确实是很丰富的。但这个丰富也是分布不均的，刚果金是非洲矿产资源特别丰富的地方，有石油也有很多别的矿。但是非洲国家也有这样一个资源诅咒，所谓资源诅咒就是说因为你这个地方资源很多，所以利益很大。利益一大呢，各方势力就因为争夺资源而争斗起来，那这个地方就会很乱。比如说刚果金，其实就是非洲非常乱的国家，以前有一个非洲的世界大战，好像是十来个国家打混战，其中有七八个可能就是刚果金的邻国跟它争夺这些资源。


    还有一个群友问到，据说铁锅很值钱，嫁女儿都可以带口锅，不知道真假。我问了一下几个非洲的朋友都没有听到过这种说法，我不知道是不是有一些边远的部落会是这种说法。我比较熟悉的肯尼亚的班图人和马赛人等等，这些部落婚嫁的时候一个趣味是，他们的男方给女方的聘礼里面要有牛羊等等这些东西。


    大家可能觉得说牛羊来当聘礼是不是很落后，其实除了正好是因为当地产这个牛羊之外呢。还有另外一层寓意，因为他们觉得婚嫁是两个家庭连接在一起，是血缘关系，所以聘礼一定要有血的东西。


    ## 大国在非洲的势力对比


    好的，第一个部分我大概就讲到这里。


    第二个部分，讲大国在非洲的势力对比，在讲这个之前呢，我先给大家看一下非洲当时殖民统治的分布图。


    ![](img/74d384fc5d948a0c31090e035208669c_191_0.png)


    大家可以看到，东非主要是英殖民地，西非主要是法殖民地，此外比利时、意大利、德国、西班牙、葡萄牙也有少量的存在，但大部分都是英国和法国的殖民地。到现在英国和法国在非洲的势力也是很大大的，但这个强大有不一样，这要讲到它们当时殖民的不同方式。


    英国的殖民方式比较松散，它就是向殖民地派总督，然后总督作为这个地方的行政长官，再由一些当地人来帮助统治。还有印度人当时也是给英国来打下手帮忙统治的，所以一会儿也会讲到印度的势力范围。那么法国不一样，法国的殖民方式，是把非洲国家当作它的海外领地的。所以这就很有趣，有一些非洲人曾经都到法国去当过官。有一个非洲人，当时甚至当上了法国的财政部长。


    所以到现在法国对西部非洲的控制还是非常牢固的。比如说我们刚才说有一些西非共同体的国家，还使用的是西非法郎。法国现在也比较牢的控制着一些非洲国家的军事，还有金融，它甚至在一些非洲国家是有驻军的。比如说塞内加尔，所以它的势力是非常强大的。相比而言，英国在非洲国家的殖民统治结束之后，它主要是通过一些比较软性的方式来和殖民地进行交流。


    所以法国总统可能一年去非洲一次两次。那英国的首相，上一次就是特雷莎梅去了一次，但在特雷莎梅之前，是 30 年前撒切尔夫人来过肯尼亚一次。可见非洲和英国在这种政治上的联系是没有那么强的。但是还是有一些联系，就是通过智库，还有教育啊等这些方面进行着联系。


    说完英法我们再说一下美国。美国在非洲，它的经济和政治存在不是那么的强，美国国务卿蒂勒森是去年来非洲，他在非洲访问期间就被特朗普给解雇了。美国对非洲的控制主要是军事方面的，大家有兴趣的话可以去查一查。美国在非洲的军事基地那是非常多的。


    我们中国在非洲有一个海军保障基地，只是个保障基地，还不是那种作战的军事基地哦，都被西方盯得很紧。我们只有一个，大家可以去查查美国有多少个。美国还有非洲司令部。美国对非政策呢，我看了一些智库报告，还有一些人士的访谈，它的对非政策也是由军事方面的人来主导的，民事部门的人就主导的比较少。


    再说一下日本，日本在非洲也是有一些存在的。如果大家去到肯尼亚等国家，就会看到满大街跑的丰田。因为日本的二手车大部分都出口到非洲。日本在非洲也搞很多援助项目。然后日本为什么对非洲比较感兴趣呢？就是因为他想在联合国有地位。那要想有地位就需要去拜票，非洲国家众多，所以这对它来说是一个非常重要的政治存在。


    还有一个大国在非洲的影响力比较大，就是印度。我们之前说了印度在英国殖民统治的时候给英国人打下手，那后来它们就留下来了，印度主要的势力在商贸，还有一些政治方面。比如在肯尼亚，印度人就在银行业占主导地位，还有零售、商场等等。也有印度人进入政界去竞选议员之类的。印度人在非洲和中国人完全不一样，我们中国人很少入籍，也很少去参加政治活动，但印度人就是积极融入当地。


    还有一些国家也有零星的存在。比如说我去塞内加尔，看到它们有一些大型的雕塑，这种大型的雕塑都是朝鲜人在做的。朝鲜它们做这种金日成的大型雕塑很在行，所以它们去一些非洲国家做雕塑的工程换外汇，也很有意思。


    俄罗斯在非洲也是有一些存在的，俄罗斯主要是给非洲国家建核电站，另外一个方面就是军火。


    ## 中非关系


    那接下来我讲一下中非关系。中非关系我就按屏友的问题来好了。


    一个是说很多央企在非洲搞基建，最近搞合规培训，很多是世界银行贷款的，要按世界银行的一套去干活，对这方面有没有了解？


    确实很多央企是在非洲搞基建项目。然后可能现在有这个趋势，是去做世界还有非洲发展银行的一些项目，那么就按照它们的要求去干活，我觉得这是没有问题的。我对具体的工程管理不是很了解，但是我觉得这个趋势是存在的，因为我们在非洲的基建项目大部分都是两优贷款。


    最近一段时间我觉得基建项目应该是比较难做的，因为贷款的天花板估计快到了，虽然还没有出现过违约，但是应该也很难贷款了。像肯尼亚的蒙内铁路之后的二段，三段，第三段贷款的时候，中国就没有很干脆的答应给它们贷款。可能也是看到它们的债务已经到了一定的水准，再贷款给它们就比较危险。当然也有西方批评我们中国是债务帝国主义，可能也有一些舆论方面的考虑，这个我不是特别清楚。


    那相应的有一个朋友问到广州的朋友去南非做钢材瓷砖生意，呆了一年，效益不太好，这些业务给国内的央企垄断了。然后问说作为民营企业想在非洲发展有哪些机会，既是当地需要的又是外企，央企没有介入的。


    这个和上面说的有关系，就是大部分央企在非洲做的都是基建项目。央企做基建项目的话，它的建材方面的需求是比较大的，而且央企确实很容易向上游走。比如说肯尼亚修蒙内铁路的时候，主要是中国路桥在那做。中国路桥再往上游走，做了一些修铁路需要的这种建材厂。这些可能民营企业比较难去和央企进行竞争的，但是也不尽然。比如说广州的森大做陶瓷的，在非洲地区就做得很好。可能它规模比较大，自己本来在国内就是做陶瓷的，管理各方面都比较熟悉。


    民营企业想在非洲发展看机会的话，我个人觉得可能看一看消费行业会比较好。因为消费行业央企是不熟悉的，我们中国在制造这些消费品上又是比较有经验的。我知道有很多的企业做消费品做的比较好，比如说有些企业做纸尿裤、卫生巾在一些国家市场份额占到一半以上，而且这些东西它的利润率比较高。


    我也认识一个老板，他就是做眼镜店。他在一个非洲国家，是那个国家最大的眼镜店连锁商，这样也比较赚钱。就是你做一个行业，你选一个你熟悉的行业，在一个非洲国家生根，把它做到处于市场绝对支配地位，相对来说是比较容易的。所以有一些企业家到了非洲都很兴奋，觉得这就是改革开放前的中国，觉得有很多机遇。当然机遇是有，但是坑也很多。


    ### 中国人在非洲的发展现状


    还有人问中国人在那边发展的多吗？战狼里面的中国工厂让人印象深刻。


    中国人在非洲发展，其实可能比大家想象的要多很多。像我所在的内罗毕就有很多家中餐馆，说明那里的中国人社区还是挺大的。近代中国人走进非洲，最早的一批可能是解放前到非洲的。解放之后主要是一九几年吧，那个时候中国企业开始走出去，有一些国营企业就奉命到了非洲。有一部分人看到了非洲的机遇就留了下来，然后就变成了在非洲的第一代华侨。中非合作论坛开了之后，越来越多的中国人到非洲发展，就是
    2005 年之后又有一大批的人来到非洲发展。所以现在中国人在非洲挺多的，做的也是各行各业。


    ### 企业进入非洲的注意事项


    有群友问到国内企业到非洲做生意，生活文化、管理制度、制定相关政策需要注意些什么？


    管理制度方面，大家可能一定要注意的就是劳工方面的，因为他们的工会力量很强。你不能随意开除一个人，你必须得三次警告他。这个警告不是说口头的警告，而是需要一个书面的，经过公会认可的警告，然后你才可以开除他。否则的话，他就会到法院去告你，那你知道在他们自己的国家法院，肯定是偏向他的，所以这种劳动纠纷会比较多。


    另一方面需要注意很多的细节。比如说我们中国的工厂，你可以说我制定一个时间，比如八点上班，如果你迟到了，我就要罚你款。而在非洲，如果你制定了一个时间八点上班，但是他九点才到，然后你罚他款，他可能就不服。他可能就去告你，而且他可能告赢你，就是他们不太有被惩罚的制度。


    也有的人说这是非洲人比较懒，所以比较难管，非洲人有钱就出去玩。我觉得这些话有些是对的，有些也是一些固定成见。西方人到中国来的时候，最初也觉得中国人很懒，可能我觉得这是一个从以前的文明到工业文明有一个适应的过程。我在内罗毕，包括在南非也看到好多人为了上班，他五六点就起床。走两个小时才到他工作的地方，你能说这样的人懒嘛，我觉得没有办法说他们懒，但是管理他们需要有一些技巧。


    比如说我认识一个大姐，也是做工程的，她有一个地方要铺瓷砖，然后她请了几个非洲人来帮她铺。讲好一天多少钱，结果做了一天，她就发现第二天这些人都不来了。因为他们第一天结了工资，第二天就拿着这些钱去吃喝了。这怎么办？这活就没法干，对我们中国人来说是不可想象的。她后来就知道了我定个量，比如我跟你约定，你必须铺完这一层我才能给你钱，不铺完不给钱。这样的话就能够保证效率，对方也是比较认的，如果你跟他约定好了的话。


    人性是复杂的，该管理的时候还是要管理。还有一个要注意的就是它们的法律制度非常健全。虽然它们很弱，可能经济方面很落后，但是法律法制这方面它们是照抄了西方国家的。所以会有一个很有趣的现象，就是大家可能觉得，有一些落后产能，中国环保政策限制的比较严格，那我就去非洲做行不行呢。结果跑到非洲去看，发现非洲对工厂的环保要求可能比中国还要高，因为它们就是完全照抄了发达国家的那些环保标准。


    ## 疫情背景下的中非关系


    还有朋友问到在疫情方面中国扮演什么样的角色，帮助非洲度过此次疫情。


    非洲这次疫情在我看来马上就会非常难。非洲现在才两万多确诊，看起来数据比较小。但实际上呢，可能有一些原因，一方面是它检测的人数少。另外一方面大家也看到它的增长非常快。所以我觉得非洲疫情大爆发，可能性是比较大的，因为很多地方很难隔离。50%以上的城市人口是住在贫民窟里面的，那里就是人挤着人，没有办法进行隔离。


    在那样的环境下，很难做到保持距离，没有办法人和人之间分开的很开。而且好多地方也没有洗手的设施，口罩就更不用说了。我听说内罗毕的基贝拉已经出现了两个确诊病例，那么在这种贫民窟中的传播可能会比较快。


    在帮助非洲度过疫情方面，中国也采取了一些措施。捐款，捐物，还有医疗队已经去了尼日利亚。最近赞比亚和云南省的卫生部门有做视频的会议，中国来指导它们怎么样去应对疫情。但如果说中国完全去包揽，帮助非洲度过这次疫情，我觉得中国可能是承受不起这么重大的责任，因为实在是太难了。


    有群友还问到中国目前如何观测非洲疫情？如果非洲突然爆发病毒大流行，中国如何能第一时间观测到非洲的实时情况，并快速反馈回国内。


    如何观测非洲疫情主要就是靠在非洲的使馆、华侨、华人这样子。老实说，中国在非洲的流行病的研究和介入方面，是比较缺乏的。不像美国在非洲的流行病研究和流行病的管理深入，它们和
    CDC（疾病预防控制中心）都是有很强的合作，甚至有一些专家合作小组去指导它们。我们没有做这些方面的前期预备，所以我们对当地卫生部门的指导，其实不是那么的强和直接，我觉得这是中国以后可以加强的一个部分。


    ### 非洲如何看待中国


    还有就是谈到国内媒体总是宣扬中国对非洲的人道主义援助，而且非洲国家和人民对中国的口碑很好。问：非洲是不是像宣传中那么友善，它们是怎么看待中国的？


    我觉得这要从几方面来说，传统上中非确实还是有兄弟般的友情的。比如说中国恢复联合国席位，确实非洲的很多国家投票来帮助中国。那中国和非洲国家还有一层社会主义的联系，当时科学社会主义在非洲也是曾经风靡，所以中国和非洲有这个政党间的联系。


    中国对非洲的援助呢，要看怎么看了。一方面中国确实给了非洲国家很多优惠贷款。我个人觉得这是一种双赢，因为一方面我们给它贷款，另外一方面这些贷款又进了我们国企的口袋，也就是说从左口袋进到右口袋。非洲国家得到了路，桥，港口这些基础设施。我们中国企得到了项目，我们的机车等等设备能够出口出去，能够去一些产能，我个人觉得是比较双赢的。


    但是中国和非洲越来越深的这种经济联系，就像我今天和一个南非朋友聊的，他写了一篇文章就说到这个事，说中非的经济联系并没有转换成我们所说的这种良好的民间交往，就是民心相通方面，没有做到很好。为什么呢？我觉得是有几个原因的。


    - 首先一个原因就是意识形态方面的原因。因为非洲国家的精英都是在西方接受教育的，非洲国家又被西方殖民了那么久，所以这种殖民统治的影响是非常大的，他们就完全接受了西方那种意识形态。所以就会像西方人一样来看中国，那你就大概知道他们对中国的态度是一个什么样的腔调了。

    - 第二个方面，中国在非洲的经济存在越来越强，那么不可避免的就会有一些利益方面的竞争。有一些利益相关方就会拿这个来说事儿，挑动中非之间的这种舆论敌意。这个也是存在的。

    - 第三个呢，不可否认，中国人还有中国企业在非洲也存在一些问题。你只要想想中国人和中国企业在国内会有什么样的问题，那么到了国外，特别是在非洲这种相对可能比较容易腐败的一个环境下。他这些行为只会放大，那么这些行为被传播出去之后，非洲人肯定不会对这个有好的口碑的。


    ## 非洲旅游建议


    最后呢，有个朋友问到去非洲玩要注意什么。


    首先跟大家说一下，非洲真的有很多地方好玩，而且可以去玩。我曾经在非洲的本地杂志上看到一个笑话，觉得印象很深刻。它是这么说的，最初的时候我们有土地，后来西方人来了带着圣经。西方人对我们说：来，让我们闭上眼睛祈祷一下吧。当我们睁开眼睛的时候，我们手里有了圣经，它们手里拿着我们的土地。


    在西非，北非以外的很多非洲国家信奉基督教的比较多，他们会定期去教堂，但是他们也不太会有一些宗教禁忌什么的。他可能会问你信什么宗教。你可能得学会一下“无神论”这个英文单词。你说你什么都不信的时候，他们会觉得很惊讶，怎么会有一个没有信仰的人。但也就此而已。


    非洲的大部分穆斯林其实是比较开放，比较宽容的。不像中东一些地方的穆斯林，他也不会太禁忌，比如你吃个猪肉什么的，他也不会太有意见。甚至有一些穆斯林，像我们当时的司机，他也会在我们的食堂吃猪肉，好像也没有问题。有一些极端组织，比如肯尼亚的青年党，比如尼日利亚的博科圣地是极端宗教组织，他们可能会比较忌讳。但你去旅游也不会接触到他们，所以宗教方面其实还好。


    - 来非洲旅游要注意，一个是不要露财，在外嘛总是要注意一些。

    - 另外一个方面就是非洲的野生动物比较多，要注意遵守规定。之前就发生过台湾游客在湖边逗小河马，结果就被河马咬死咬伤的情况。

    - 第三个就是到非洲来旅游，大部分时候不太适合自由行，不太适合穷游。自由行的话是因为非洲没有很强大的公共交通，所以你肯定得租车，有导游带着你。不太适合穷游的原因是如果穷游的话，它的条件太差了。而且你到非洲来旅行一定要享受一下，在非常原始的环境下住奢侈酒店，这是一个特别棒的体验。


    最后我来公布上面的答案，6号石头是旧石器。考古队老师说，那个石头是当时人用来砍砸东西的。好的，我今天的分享就到这里了，谢谢大家的聆听。

