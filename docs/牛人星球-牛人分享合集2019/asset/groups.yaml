    人士，你需要 1 万个小时。按照一周工作七天，每天八小时，这样算下来大约是五年。


    五年你就可以成为某个领域的专家了，那么十年时间呢？所以从节约时间的角度，每天抽两个小时来专注你应该专注的事情，坚持 40 年的话，你就可以成为那个领域的大咖了，或者说成为这个领域非常专业的人士了，这是我们应该值得注意的一个事情。


    同时这个 PPT 还告诉我们专注、坚持一件事情是多么的重要，也是非常困难的。我说一个我自己的例子，有一年我跟一个出家师父到一个寺庙，这个寺庙洗澡不方便，我是南方人，不洗澡对我来说是比较困难的。但是在那里我三个月没有洗澡。所以很多事情贵在坚持，不坚持是很难取得很大的成效的。我三个月没洗澡，在去之前我也不知道，但是坚持下来后我自身觉得也是有些突破的。


