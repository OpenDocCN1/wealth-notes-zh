    # 领导力的三个误区和三个层次


    讲师：何加盐

    时间：2020 年 5 月


    大家好，今天是 5 月 8 日，是牛人星球第一期的最后一天，今天这次分享也是这一个会员年度的第 21 次分享，也是最后一次分享。


    对我来说，有种百感交集的感觉。心里既有开心，也有感激，还有不舍。


    开心，是因为大家一起度过了这么多天的时光，一起学习，一起成长。我相信，只要是认真看了星球的文章、听了牛人的分享、参与或观摩了群里的讨论的，一定会所收获。


    感激，是因为你们每一个人，都是对何加盐非常认可的，不管是理念上、行动上，你们都给了我大力的支持。在线下聚会时，我也真诚地和大家讲过，你们都是我的衣食父母。所以，请允许我对你们表示由衷的感激。


    不舍，是因为这么多天的时间，我们已经建立了深厚的感情。牛人星球的每一位朋友，加盐星友群的每一位群友，在我的生命里，都占有特别的位置，我对你们，其实非常不舍。这也是为什么我本不想再做星球了，但最终还是决定做下去的原因。


    那么今天最后一期，我们要讲的内容是：“领导力的三个误区和三个层次”。虽然决定讲这个题目，只有一个月的时间，但我这个主题而做的准备，已经有很多年。


    大家都知道，在之前，我是在政府当公务员，虽然职位只是科长，但也有一个小小的团队，尤为难得的是，由于研究的关系，我有机会接触到很多重量级的人物，近距离观察他们的领导力。


    从政府下海之后，我做的是企业管理咨询的工作，从无到有创造了一家咨询公司，组建了 11 人的团队，客户包括百亿市值的上市公司和福布斯富豪榜的上榜人物。大家知道，做咨询，需要对企业有非常深入的了解，所以我必须得和企业的领导者及高管有非常频繁和深度的访谈，对于企业家的领导力有了更入直观的感受。'
  - '[PAGE 199]


    开始写公众号以后，我确定了“研究牛人”这个主题，写的都是马云、马化腾、任正非、雷军、王兴这样的商界精英人物，从中总结出可供我们学习的干货知识，这些大部分都可以归结为领导力。


    我自己本身也曾经花了5万元学费，参加了国际比较顶尖的一个领导力培训机构CCL（创新领导力中心）的领导力课程。


    所以，这些年来，个人当领导的经历、研究牛人的领导力、上过的领导力课程培训，共同构成了我对领导力的认知，成为这次分享的理论与实践基础。


    下面我们从三个方面来谈谈我对领导力的理解。


    # ## 一、什么是领导力


    关于这方面的定义非常多，可能每个人都有自己的理解，我个人的定义是：


    **领导力，就是控制个人、团队或群体的思维与行动，使之共同作用于某个目标的能力。**


    这里可能有一点和别人不一样的地方：我把对自己的控制能力，也归到领导力里面。也就是说，领导力不仅仅是领导他人的能力，还包括领导自己的能力。


    # ## 二、关于领导力的三个误区


    很对人对领导力的理解，容易陷入三个误区。


    **误区一：我不是领导，所以不需要领导力。**


    这个可能是最常见的一个误解了。我们可能常常看到关于领导力的书籍、讨论、课程等等，但大部分人都会直接忽略，因为觉得和自己无关。


    包括咱们成长营的这个领导力标签，以及这次分享，我敢肯定，有不少同学都不会点进来看。其中一个重要原因就是他觉得自己不是领导，不需要领导力。


    其实，对于任何人而言，领导力都是非常重要的能力。


    作为个人，我们每天都要和自己作天人交战，要不要做某件事，如何做某件事，都涉及到自己的身体素质、认知水平和情绪控制能力。这就需要你建立对自己的领导力。


    作为社会人，我们每天要和家人、同事、领导、客户、陌生人打交道。他'
  - '[PAGE 200]


    们对你的认知以及他们的行动，都会影响到你的利益和心情。这就需要你建立对他人的领导力。


    所以，人人都需要领导力。认识到这一点，缺少这一点的人，会过得比较失败和痛苦。


    **误区二，领导力只能用于领导地位比较低的人。**


    有的人知道领导力很重要，也知道自己需要修炼领导力。但是他的目的只是为了更好地领导下属，因为在他的理解中，领导力只能用在自己的下属身上，而没有意识到，对自己、家人、上级、客户，都需要用到领导力。


    其中尤其重要的一点，是对领导的领导力——是的，我们不仅要善于领导下属，还要善于领导领导，对领导的领导力有多强，可能是决定你成功和快乐与否最重要的因素。


    所以，我们在练习领导力的时候，一定要注意提高“向上领导能力”。


    **误区三：领导力有放之四海而皆准的套路。**


    有人知道领导力很重要，甚至也知道领导力不光是对下属，还包括对其他人。但是他们认为，每个人需要的领导力都是一样的，有一套行之有效的办法，人人都能学，人人都能用。


    这些人常常会陷入失望。他们可能看了很多书，学了很多课程，听了很多道理，却依然领导不了自己和他人。这时候，他可能会怪书、怪老师，觉得教领导力的书是忽悠，讲领导力的老师是骗子。


    其真实原因，可能只是因为他没有找到适合自己的领导力而已。


    其实，每个人的条件不同、性格不同、目的不同、人生阶段不同、应用场景不同，根本就没有一套方法可以适用于所有人和所有场景。我们只有找到最适合自己、最适合当下的方式，才能发挥好好的领导力。


    # # 三、领导力的三个层次


    **领导力的第一个层次，是领导自己。**


    所谓领导自己，就是控制自己的身体、认知以及情绪。这是一切领导力的基础。如果一个人连自己都领导不了，那他也一定领导不了他人。


    所谓控制你的身体，就是让自己有一个能够匹配你所要求的目标的健康身体；控制你的认知，就是让自己有能够匹配目标的知识、信息和思考能力；控'
  - '[PAGE 201]


    制你的情绪，就是让自己能够不被外界环境、别人评价以及自身状态所左右，能够在必要的时候调整为最适合完成目标的状态，例如平静、激情、甚至愤怒。


    当你能够在大多数情况下轻松地控制自己的身体、认知和情绪去为目标服务，你就具备了对自己的领导力。这个领导力的提升，是一个永无止境的过程。


    建立自我领导力，需要做到三件事情。


    # 第一件事，要有目标意识。


    我们要给自己的生活、工作乃至整个人生建立一些目标，并且时刻都要记得朝着目标前进。吉姆·柯林斯把这叫做“以终为始”，我觉它把称为“不忘初心”，其实说的是一回事。


    有目标，而且做事的时候心里时刻有目标意识，是领导力的最重要的一点——我这里用一个“最”字，不管是领导自己、领导他人，还是领导团队，这个目标最重要。不然，哪怕所有人都对你言听计从，但是你们最后根本就就不是朝着目标前进，那你的领导力也等于零。


    所以，锻炼领导力的第一步，先问问自己有什么目标？


    # 第二件事，要认识自己。


    我有什么优势？有什么劣势？有什么喜好？有什么厌恶？只有问明白这四个问题，你才能把自己的才能发挥到最大，或者让自己过得很开心，或者两者同时实现。


    要弄明白这四个问题不容易。你可以改变一下问问题的方式：


    1.在过往人生中，我最大的成就是什么？我是怎么做到的？2.最大的失败是什么？是因为我的什么问题而导致的？3.过去3个月（或半年、1年、3年、5年、10年），让我最开心的事情是什么？为什么？4.过去3个月（或半年、1年、3年、5年、10年），让我不开心的事情是什么？为什么？


    这也是为什么我要强调，领导力没有放之四海而皆准的套路，你必须得从你自己的实际情况出发，来寻找什么最适合你，锻炼你自己独一无二的领导力。


    # 第三件事，要有自制能力。'
  - '[PAGE 202]


    每个人都有好逸恶劳的时候，我们也常常会面临种种的诱惑，有时事情太难，我们会想着放弃算了，这时候，领导力的表现，就是我们能不能咬紧牙关，坚持向目标走去。


    提高自制力，可以从四个方面入手：循序渐进、及时回馈、梦想激励、外部监督。


    循序渐进，是指不要一下子给自己太多、太难的任务，可以先从简单的开始；及时回馈，是指要让自己的努力时常能得到奖励；梦想激励，是指要有一个长远的愿景随时让你心潮澎湃；外部监督，是让自己的努力有一个外部力量的帮助，使自己能坚持更长时间。


    如果能够做到这四点，你对自己的领导力会有一个大幅度的提高。


    领导力的第二个层次，是领导他人。


    这个“他人”，包括自己的下属，也包括你的家人、朋友、老师、领导、客户以及和你打交道的其他人。


    我们说“领导他人”，并不是说你要当他们的领导，而是当需要时，你可以借助他们，完成自己的目标。


    我们要去影响一个人，让他服务于自己的目标，一般来说，都是通过以下五种方式：1. 威胁；2. 利益；3. 理性；4. 情感；5. 信仰。


    换句话说，就是：1. 我让他害怕；2. 我让他得利；3. 我让他明白道理；4. 我让他喜欢我；5. 我让他信任我甚至信仰我。


    举个例子，想让孩子去上学，可以采用五种办法：1. 你不去我就揍你；2. 你去的话放学给你买冰淇淋；3. 去上学才能学到知识，考有好的学校，才能找到好工作；4.
    妈妈爱你，你要好好学习哦（如果不学，妈妈会不开心）；5. 对爸妈无条件的信任，因为爸妈说要去上学，他就去。


    日常生活和工作中，我们可以根据情景不同、对象不同，而重点选择其中的一种，或者组合选择其中几种。


    在工作中，如果我们要长期影响同事、下属以及领导，让大家共同完成一个工作目标，需要做好三点：


    第一，要有较好的情商，能够和他们处好关系。或者，就算不能处好关系，也要有足够的威胁或威信，让他能够往同一方向使力，而不是搞破坏——'
  - '[PAGE 203]


    在这里我要说一个我的观点，所谓情商高，不是为了让人舒服，而是能让别人帮助你达成目的。所以你和他人交往，不是一味地讨好他人，容忍他人，让他 人喜欢我。有时候也要有自己的立场、脾气和手段，关键是要能够让对方的行为服务于目标。


    第二，你必须得有担当。在工作中，领导力的重要来源之一就是敢于负责任。如果有一件事，别人不愿意负责，你负责了，你就是那件事的领导者。如果你经常负责某些事情，你自然而然就是团队中有领导力的那个人。


    有一些人遇到事情总是不敢承担责任，不敢冒风险，不敢下决心。这样的人，就算是位居领导位子，实际上也是没有领导力的。


    第三，要考虑好利益分配。要别人听你的话，一定要给他足够的利益。这个利益不一定是金钱或物质，还可以是其他隐性的利益，例如得到成长、得到名声、得到夸奖、得到成就感等等。不管是哪一种，一定要有，不能什么利益都没有。


    当你善于给别人各种利益的时候，你自然就具有了领导力。


    上面只是说了三种通用的能力。对不同的岗位，不同的任务，可能还会有其他方面的要求。例如，有的特别需要远见；有的需要你是技术大牛；有的需要你是常胜将军；有的需要你特别会忽悠等等。这要根据不同的情况而定。总而言之，你需要能够影响别人，帮助你共同朝着目标前进。


    领导力的第三个层次，是领导团队。


    上面讲的主要适用于单对单，或者对着少数几个人的情况。而当你领导很多人的时候，就有不一样的要求了。


    要领导一群人，最重要的一点，是要给与一个共同的愿景激励。所以孙中山会说“驱除鞑虏、恢复中华、创立民国、平均地权”、伟大领袖会说“打土豪分田地；推翻三座大山，建立新中国；实现共产主义”等等。


    各大宗教在这一点上也做得特别好，例如上天堂、修来世等等。


    现代社会，做得比较好的企业，都会有一个美好的愿景，这个愿景，是维系一大群人的重要手段。


    如果你有机会领导一个较大的团队（小到20个人，大到上亿人都适用），一定要建立一个美好的愿景，这个愿景要和团队里的大多数人密切相关，要大'
  - '[PAGE 204]


    部分人都愿意为之奋斗。


    # 第二个重要的，就是要能够知人善任。


    团队人一多，你就不可控制到所有人，只能通过分授权，一层一层去控制。再厉害的领导，其最大的有效管理幅度，也就是十几个人。超过二十个人，一定有管不过来的地方。


    所以，要管好大团队，你必须学会看人和用人。你得知道你手下的高管有什么优势、劣势，有什么喜好和厌恶，并且还要想清楚你要怎样才能激励他发挥优势，怎样才能限制他的劣势。要把每一个人都放在合适的位置。


    这里还需要说一点，挑人的时候，对方和你价值观的一致性，比他的能力更重要。如果价值观很好，但能力不行，你还可以培养。如果能力很强，但价值观不一致，可能会导致你的事业完蛋。能够用好一个能力极强，但价值观和你不同的人，需要非常高超的驾驭能力，如果你不是万中无一的高手，建议不要轻易尝试。


    # 第三个重要的，是建立一个好的奖惩制度。


    团队越大，管理中制度的因素就要越突出。这时候你的领导力更主要来自于赏罚分明，人人服气。


    所以，建立一套良好的激励机制，非常重要。


    建立这个机制，一定要时刻“不忘初心“。员工的什么行为有助于目标，就应该奖励；有害于目标，就应该惩罚。其中不能有情绪的因素。很多领导者会因为一己之喜或一己之怒，就随意奖惩，这对制度和人心是极大的破坏，应该坚决杜绝。


    需要提醒的一点是，制度必须坚持原则性与灵活性的结合，不能死磕条文。唯一的判定标准只能有一条：是否有助于达成目标。如果在执行过程中发现和目标相违背的条文，应该及时修改，而不是僵化地坚持条文。


    上面三点，分别涉及到一个组织的文化、用人和制度建设，这是一个领导者最需要花精力的地方。把这三点做好，领导力自然就有了。


    最后我们总结一下全文：


    领导力是影响自己和他人完成目标的能力。人人都需要领导力，不仅需要向下领导，还需要横向领导和向上领导。'
  - '[PAGE 205]


    领导力分为三个层次，第一层是领导自己，需要认识自己、建立目标意识，并且锻炼自制能力；第二层是领导他人，需要用到影响力的五个方面，也就是威胁、利益、理性、情感、信仰，在一个组织里面，你需要有情商，有担当，并给人利益，才能获得领导力；第三层是领导团队，最重要的是建立组织文化、招到得力的助手并用好他们，以及建立好的奖惩制度。


    今天的分享就到这里。感谢大家的耐心聆听。


    作为牛人星球第一年的最后一期分享，我再多说两句：


    牛人星球第二年已经开始，我们有不少星友已经加入了第二期，谢谢大家的信任和支持，让我们继续一起走下去。今后关于牛人星球会员权益范围的文章、分享、资料等，我们会发到第二群。所以已经加入第二期的朋友，也请进入加盐星友会第二群。已经续费但是还没加入的，可以私信我，我拉你进去。


    当然，也许有的朋友已经比牛人星球走得更快，不再需要星球，我们也祝福他，让我们在不同的道路上，各自成长。我们这个“加盐星友群”，会一直保持下去，你可以继续在群里和大家交流讨论。我希望这里能成为大家在网上保留的一个温馨的港湾。


    再一次感谢大家！祝大家越变越牛，越来越好！'
  - '[PAGE 206]


    # 后记


    孔子说：学而时习之，不也很快乐吗？


    但是在这个时代，大部分人都走得很快，很难停下脚步来，学而时习之。所以，要凑够这么多爱学习的人在一起，也挺不容易的。


    我觉得，作为牛人星球的一员，我们都应该为自己鼓掌。


    一年的时间很快过去，我希望你在此刻，比你刚加入星球时，起码变好了一点点。


    也许你见识了更多的观点，也许你观摩了不同的人生，也许你学到了新的知识，也许你交到了新的好友，也许你感受到了向前和向上的激励……


    也许，你还想继续陪牛人星球走一程，那么，欢迎加入第二期，我们再一次成长。


    也许，你已经比牛人星球走得更快，不再需要星球，那么，祝福你，让我们在不同的道路上，各自成长。


    无论如何，共同点是：不要忘了成长。


    希望明年的此刻，你还能想起今天，然后问一下自己：我今年变得更牛了吗？


    我希望你的答案是坚决而自信的：是的！我变得更牛了。


    谢谢命运给我们这一年交汇的机会，谢谢你陪我走过这一年的时光。


    祝未来，越来越好！'
  md: '

    # 领导力的三个误区和三个层次


    讲师：何加盐

    时间：2020 年 5 月


    大家好，今天是 5 月 8 日，是牛人星球第一期的最后一天，今天这次分享也是这一个会员年度的第 21 次分享，也是最后一次分享。


    对我来说，有种百感交集的感觉。心里既有开心，也有感激，还有不舍。


    开心，是因为大家一起度过了这么多天的时光，一起学习，一起成长。我相信，只要是认真看了星球的文章、听了牛人的分享、参与或观摩了群里的讨论的，一定会所收获。


    感激，是因为你们每一个人，都是对何加盐非常认可的，不管是理念上、行动上，你们都给了我大力的支持。在线下聚会时，我也真诚地和大家讲过，你们都是我的衣食父母。所以，请允许我对你们表示由衷的感激。


    不舍，是因为这么多天的时间，我们已经建立了深厚的感情。牛人星球的每一位朋友，加盐星友群的每一位群友，在我的生命里，都占有特别的位置，我对你们，其实非常不舍。这也是为什么我本不想再做星球了，但最终还是决定做下去的原因。


    那么今天最后一期，我们要讲的内容是：“领导力的三个误区和三个层次”。虽然决定讲这个题目，只有一个月的时间，但我这个主题而做的准备，已经有很多年。


    大家都知道，在之前，我是在政府当公务员，虽然职位只是科长，但也有一个小小的团队，尤为难得的是，由于研究的关系，我有机会接触到很多重量级的人物，近距离观察他们的领导力。


    从政府下海之后，我做的是企业管理咨询的工作，从无到有创造了一家咨询公司，组建了 11 人的团队，客户包括百亿市值的上市公司和福布斯富豪榜的上榜人物。大家知道，做咨询，需要对企业有非常深入的了解，所以我必须得和企业的领导者及高管有非常频繁和深度的访谈，对于企业家的领导力有了更入直观的感受。


    开始写公众号以后，我确定了“研究牛人”这个主题，写的都是马云、马化腾、任正非、雷军、王兴这样的商界精英人物，从中总结出可供我们学习的干货知识，这些大部分都可以归结为领导力。


    我自己本身也曾经花了 5 万元学费，参加了国际比较顶尖的一个领导力培训机构 CCL（创新领导力中心）的领导力课程。


    所以，这些年来，个人当领导的经历、研究牛人的领导力、上过的领导力课程培训，共同构成了我对领导力的认知，成为这次分享的理论与实践基础。


    下面我们从三个方面来谈谈我对领导力的理解。


    ## 一、什么是领导力


    关于这方面的定义非常多，可能每个人都有自己的理解，我个人的定义是：


    **领导力，就是控制个人、团队或群体的思维与行动，使之共同作用于某个目标的能力。**


    这里可能有一点和别人不一样的地方：我把对自己的控制能力，也归到领导力里面。也就是说，领导力不仅仅是领导他人的能力，还包括领导自己的能力。


    ## 二、关于领导力的三个误区


    很多人对领导力的理解，容易陷入三个误区。


    **误区一：我不是领导，所以不需要领导力。**


    这个可能是最常见的一个误解了。我们可能常常看到关于领导力的书籍、讨论、课程等等，但大部分人都会直接忽略，因为觉得和自己无关。


    包括咱们成长营的这个领导力标签，以及这次分享，我敢肯定，有不少同学都不会点进来看。其中一个重要原因就是他觉得自己不是领导，不需要领导力。


    其实，对于任何人而言，领导力都是非常重要的能力。


    作为个人，我们每天都要和自己作天人交战，要不要做某件事，如何做某件事，都涉及到自己的身体素质、认知水平和情绪控制能力。这就需要你建立对自己的领导力。


    作为社会人，我们每天要和家人、同事、领导、客户、陌生人打交道。他们对你的认知以及他们的行动，都会影响到你的利益和心情。这就需要你建立对他人的领导力。


    所以，人人都需要领导力。认识到这一点，缺少这一点的人，会过得比较失败和痛苦。


    **误区二：领导力只能用于领导地位比较低的人。**


    有的人知道领导力很重要，也知道自己需要修炼领导力。但是他的目的只是为了更好地领导下属，因为在他的理解中，领导力只能用在自己的下属身上，而没有意识到，对自己、家人、上级、客户，都需要用到领导力。


    其中尤其重要的一点，是对领导的领导力——是的，我们不仅要善于领导下属，还要善于领导领导，对领导的领导力有多强，可能是决定你成功和快乐与否最重要的因素。


    所以，我们在练习领导力的时候，一定要注意提高“向上领导能力”。


    **误区三：领导力有放之四海而皆准的套路。**


    有人知道领导力很重要，甚至也知道领导力不光是对下属，还包括对其他人。但是他们认为，每个人需要的领导力都是一样的，有一套行之有效的办法，人人都能学，人人都能用。


    这些人常常会陷入失望。他们可能看了很多书，学了很多课程，听了很多道理，却依然领导不了自己和他人。这时候，他可能会怪书、怪老师，觉得教领导力的书是忽悠，讲领导力的老师是骗子。


    其真实原因，可能只是因为他没有找到适合自己的领导力而已。


    其实，每个人的条件不同、性格不同、目的不同、人生阶段不同、应用场景不同，根本就没有一套方法可以适用于所有人和所有场景。我们只有找到最适合自己、最适合当下的方式，才能发挥好好的领导力。


    ## 三、领导力的三个层次


    **领导力的第一个层次，是领导自己。**


    所谓领导自己，就是控制自己的身体、认知以及情绪。这是一切领导力的基础。如果一个人连自己都领导不了，那他也一定领导不了他人。


    所谓控制你的身体，就是让自己有一个能够匹配你所要求的目标的健康身体；控制你的认知，就是让自己有能够匹配目标的知识、信息和思考能力；控制你的情绪，就是让自己能够不被外界环境、别人评价以及自身状态所左右，能够在必要的时候调整为最适合完成目标的状态，例如平静、激情、甚至愤怒。


    当你能够在大多数情况下轻松地控制自己的身体、认知和情绪去为目标服务，你就具备了对自己的领导力。这个领导力的提升，是一个永无止境的过程。


    建立自我领导力，需要做到三件事情。


    ### 第一件事，要有目标意识。


    我们要给自己的生活、工作乃至整个人生建立一些目标，并且时刻都要记得朝着目标前进。吉姆·柯林斯把这叫做“以终为始”，我觉它把称为“不忘初心”，其实说的是一回事。


    有目标，而且做事的时候心里时刻有目标意识，是领导力的最重要的一点——我这里用一个“最”字，不管是领导自己、领导他人，还是领导团队，这个目标最重要。不然，哪怕所有人都对你言听计从，但是你们最后根本就就不是朝着目标前进，那你的领导力也等于零。


    所以，锻炼领导力的第一步，先问问自己有什么目标？


    ### 第二件事，要认识自己。


    我有什么优势？有什么劣势？有什么喜好？有什么厌恶？只有问明白这四个问题，你才能把自己的才能发挥到最大，或者让自己过得很开心，或者两者同时实现。


    要弄明白这四个问题不容易。你可以改变一下问问题的方式：


    - 在过往人生中，我最大的成就是什么？我是怎么做到的？

    - 最大的失败是什么？是因为我的什么问题而导致的？

    - 过去 3 个月（或半年、1 年、3 年、5 年、10 年），让我最开心的事情是什么？为什么？

    - 过去 3 个月（或半年、1 年、3 年、5 年、10 年），让我不开心的事情是什么？为什么？


    这也是为什么我要强调，领导力没有放之四海而皆准的套路，你必须得从你自己的实际情况出发，来寻找什么最适合你，锻炼你自己独一无二的领导力。


    ### 第三件事，要有自制能力。


    每个人都有好逸恶劳的时候，我们也常常会面临种种的诱惑，有时事情太难，我们会想着放弃算了，这时候，领导力的表现，就是我们能不能咬紧牙关，坚持向目标走去。


    提高自制力，可以从四个方面入手：循序渐进、及时回馈、梦想激励、外部监督。


    循序渐进，是指不要一下子给自己太多、太难的任务，可以先从简单的开始；及时回馈，是指要让自己的努力时常能得到奖励；梦想激励，是指要有一个长远的愿景随时让你心潮澎湃；外部监督，是让自己的努力有一个外部力量的帮助，使自己能坚持更长时间。


    如果能够做到这四点，你对自己的领导力会有一个大幅度的提高。


    领导力的第二个层次，是领导他人。


    这个“他人”，包括自己的下属，也包括你的家人、朋友、老师、领导、客户以及和你打交道的其他人。


    我们说“领导他人”，并不是说你要当他们的领导，而是当需要时，你可以借助他们，完成自己的目标。


    我们要去影响一个人，让他服务于自己的目标，一般来说，都是通过以下五种方式：


    1. 威胁；

    2. 利益；

    3. 理性；

    4. 情感；

    5. 信仰。


    换句话说，就是：


    1. 我让他害怕；

    2. 我让他得利；

    3. 我让他明白道理；

    4. 我让他喜欢我；

    5. 我让他信任我甚至信仰我。


    举个例子，想让孩子去上学，可以采用五种办法：


    1. 你不去我就揍你；

    2. 你去的话放学给你买冰淇淋；

    3. 去上学才能学到知识，考有好的学校，才能找到好工作；

    4. 妈妈爱你，你要好好学习哦（如果不学，妈妈会不开心）；

    5. 对爸妈无条件的信任，因为爸妈说要去上学，他就去。


    日常生活和工作中，我们可以根据情景不同、对象不同，而重点选择其中的一种，或者组合选择其中几种。


    在工作中，如果我们要长期影响同事、下属以及领导，让大家共同完成一个工作目标，需要做好三点：


    第一，要有较好的情商，能够和他们处好关系。或者，就算不能处好关系，也要有足够的威胁或威信，让他能够往同一方向使力，而不是搞破坏——在这里我要说一个我的观点，所谓情商高，不是为了让人舒服，而是能让别人帮助你达成目的。所以你和他人交往，不是一味地讨好他人，容忍他人，让他人喜欢我。有时候也要有自己的立场、脾气和手段，关键是要能够让对方的行为服务于目标。


    第二，你必须得有担当。在工作中，领导力的重要来源之一就是敢于负责任。如果有一件事，别人不愿意负责，你负责了，你就是那件事的领导者。如果你经常负责某些事情，你自然而然就是团队中有领导力的那个人。


    有一些人遇到事情总是不敢承担责任，不敢冒风险，不敢下决心。这样的人，就算是位居领导位子，实际上也是没有领导力的。


    第三，要考虑好利益分配。要别人听你的话，一定要给他足够的利益。这个利益不一定是金钱或物质，还可以是其他隐性的利益，例如得到成长、得到名声、得到夸奖、得到成就感等等。不管是哪一种，一定要有，不能什么利益都没有。


    当你善于给别人各种利益的时候，你自然就具有了领导力。


    上面只是说了三种通用的能力。对不同的岗位，不同的任务，可能还会有其他方面的要求。例如，有的特别需要远见；有的需要你是技术大牛；有的需要你是常胜将军；有的需要你特别会忽悠等等。这要根据不同的情况而定。总而言之，你需要能够影响别人，帮助你共同朝着目标前进。


    领导力的第三个层次，是领导团队。


    上面讲的主要适用于单对单，或者对着少数几个人的情况。而当你领导很多人的时候，就有不一样的要求了。


    要领导一群人，最重要的一点，是要给与一个共同的愿景激励。所以孙中山会说“驱除鞑虏、恢复中华、创立民国、平均地权”、伟大领袖会说“打土豪分田地；推翻三座大山，建立新中国；实现共产主义”等等。


    各大宗教在这一点上也做得特别好，例如上天堂、修来世等等。


    现代社会，做得比较好的企业，都会有一个美好的愿景，这个愿景，是维系一大群人的重要手段。


    如果你有机会领导一个较大的团队（小到 20 个人，大到上亿人都适用），一定要建立一个美好的愿景，这个愿景要和团队里的大多数人密切相关，要大部分人都愿意为之奋斗。


    ### 第二个重要的，就是要能够知人善任。


    团队人一多，你就不可控制到所有人，只能通过分授权，一层一层去控制。再厉害的领导，其最大的有效管理幅度，也就是十几个人。超过二十个人，一定有管不过来的地方。


    所以，要管好大团队，你必须学会看人和用人。你得知道你手下的高管有什么优势、劣势，有什么喜好和厌恶，并且还要想清楚你要怎样才能激励他发挥优势，怎样才能限制他的劣势。要把每一个人都放在合适的位置。


    这里还需要说一点，挑人的时候，对方和你价值观的一致性，比他的能力更重要。如果价值观很好，但能力不行，你还可以培养。如果能力很强，但价值观不一致，可能会导致你的事业完蛋。能够用好一个能力极强，但价值观和你不同的人，需要非常高超的驾驭能力，如果你不是万中无一的高手，建议不要轻易尝试。


    ### 第三个重要的，是建立一个好的奖惩制度。


    团队越大，管理中制度的因素就要越突出。这时候你的领导力更主要来自于赏罚分明，人人服气。


    所以，建立一套良好的激励机制，非常重要。


    建立这个机制，一定要时刻“不忘初心“。员工的什么行为有助于目标，就应该奖励；有害于目标，就应该惩罚。其中不能有情绪的因素。很多领导者会因为一己之喜或一己之怒，就随意奖惩，这对制度和人心是极大的破坏，应该坚决杜绝。


    需要提醒的一点是，制度必须坚持原则性与灵活性的结合，不能死磕条文。唯一的判定标准只能有一条：是否有助于达成目标。如果在执行过程中发现和目标相违背的条文，应该及时修改，而不是僵化地坚持条文。


    上面三点，分别涉及到一个组织的文化、用人和制度建设，这是一个领导者最需要花精力的地方。把这三点做好，领导力自然就有了。


    最后我们总结一下全文：


    领导力是影响自己和他人完成目标的能力。人人都需要领导力，不仅需要向下领导，还需要横向领导和向上领导。


    领导力分为三个层次，第一层是领导自己，需要认识自己、建立目标意识，并且锻炼自制能力；第二层是领导他人，需要用到影响力的五个方面，也就是威胁、利益、理性、情感、信仰，在一个组织里面，你需要有情商，有担当，并给人利益，才能获得领导力；第三层是领导团队，最重要的是建立组织文化、招到得力的助手并用好他们，以及建立好的奖惩制度。


    今天的分享就到这里。感谢大家的耐心聆听。


    作为牛人星球第一年的最后一期分享，我再多说两句：


    牛人星球第二年已经开始，我们有不少星友已经加入了第二期，谢谢大家的信任和支持，让我们继续一起走下去。今后关于牛人星球会员权益范围的文章、分享、资料等，我们会发到第二群。所以已经加入第二期的朋友，也请进入加盐星友会第二群。已经续费但是还没加入的，可以私信我，我拉你进去。


    当然，也许有的朋友已经比牛人星球走得更快，不再需要星球，我们也祝福他，让我们在不同的道路上，各自成长。我们这个“加盐星友群”，会一直保持下去，你可以继续在群里和大家交流讨论。我希望这里能成为大家在网上保留的一个温馨的港湾。


    再一次感谢大家！祝大家越变越牛，越来越好！


    ## 后记


    孔子说：学而时习之，不也很快乐吗？


    但是在这个时代，大部分人都走得很快，很难停下脚步来，学而时习之。所以，要凑够这么多爱学习的人在一起，也挺不容易的。


    我觉得，作为牛人星球的一员，我们都应该为自己鼓掌。


    一年的时间很快过去，我希望你在此刻，比你刚加入星球时，起码变好了一点点。


    也许你见识了更多的观点，也许你观摩了不同的人生，也许你学到了新的知识，也许你交到了新的好友，也许你感受到了向前和向上的激励……


    也许，你还想继续陪牛人星球走一程，那么，欢迎加入第二期，我们再一次成长。


    也许，你已经比牛人星球走得更快，不再需要星球，那么，祝福你，让我们在不同的道路上，各自成长。


    无论如何，共同点是：不要忘了成长。


    希望明年的此刻，你还能想起今天，然后问一下自己：我今年变得更牛了吗？


    我希望你的答案是坚决而自信的：是的！我变得更牛了。


    谢谢命运给我们这一年交汇的机会，谢谢你陪我走过这一年的时光。


    祝未来，越来越好！

    '
  mdcn: '

    # 领导力的三个误区和三个层次


    讲师：何加盐

    时间：2020 年 5 月


    大家好，今天是 5 月 8 日，是牛人星球第一期的最后一天，今天这次分享也是这一个会员年度的第 21 次分享，也是最后一次分享。


    对我来说，有种百感交集的感觉。心里既有开心，也有感激，还有不舍。


    开心，是因为大家一起度过了这么多天的时光，一起学习，一起成长。我相信，只要是认真看了星球的文章、听了牛人的分享、参与或观摩了群里的讨论的，一定会所收获。


    感激，是因为你们每一个人，都是对何加盐非常认可的，不管是理念上、行动上，你们都给了我大力的支持。在线下聚会时，我也真诚地和大家讲过，你们都是我的衣食父母。所以，请允许我对你们表示由衷的感激。


    不舍，是因为这么多天的时间，我们已经建立了深厚的感情。牛人星球的每一位朋友，加盐星友群的每一位群友，在我的生命里，都占有特别的位置，我对你们，其实非常不舍。这也是为什么我本不想再做星球了，但最终还是决定做下去的原因。


    那么今天最后一期，我们要讲的内容是：“领导力的三个误区和三个层次”。虽然决定讲这个题目，只有一个月的时间，但我这个主题而做的准备，已经有很多年。


    大家都知道，在之前，我是在政府当公务员，虽然职位只是科长，但也有一个小小的团队，尤为难得的是，由于研究的关系，我有机会接触到很多重量级的人物，近距离观察他们的领导力。


    从政府下海之后，我做的是企业管理咨询的工作，从无到有创造了一家咨询公司，组建了 11 人的团队，客户包括百亿市值的上市公司和福布斯富豪榜的上榜人物。大家知道，做咨询，需要对企业有非常深入的了解，所以我必须得和企业的领导者及高管有非常频繁和深度的访谈，对于企业家的领导力有了更入直观的感受。


    开始写公众号以后，我确定了“研究牛人”这个主题，写的都是马云、马化腾、任正非、雷军、王兴这样的商界精英人物，从中总结出可供我们学习的干货知识，这些大部分都可以归结为领导力。


    我自己本身也曾经花了 5 万元学费，参加了国际比较顶尖的一个领导力培训机构 CCL（创新领导力中心）的领导力课程。


    所以，这些年来，个人当领导的经历、研究牛人的领导力、上过的领导力课程培训，共同构成了我对领导力的认知，成为这次分享的理论与实践基础。


    下面我们从三个方面来谈谈我对领导力的理解。


    ## 一、什么是领导力


    关于这方面的定义非常多，可能每个人都有自己的理解，我个人的定义是：


    **领导力，就是控制个人、团队或群体的思维与行动，使之共同作用于某个目标的能力。**


    这里可能有一点和别人不一样的地方：我把对自己的控制能力，也归到领导力里面。也就是说，领导力不仅仅是领导他人的能力，还包括领导自己的能力。


    ## 二、关于领导力的三个误区


    很多人对领导力的理解，容易陷入三个误区。


    **误区一：我不是领导，所以不需要领导力。**


    这个可能是最常见的一个误解了。我们可能常常看到关于领导力的书籍、讨论、课程等等，但大部分人都会直接忽略，因为觉得和自己无关。


    包括咱们成长营的这个领导力标签，以及这次分享，我敢肯定，有不少同学都不会点进来看。其中一个重要原因就是他觉得自己不是领导，不需要领导力。


    其实，对于任何人而言，领导力都是非常重要的能力。


    作为个人，我们每天都要和自己作天人交战，要不要做某件事，如何做某件事，都涉及到自己的身体素质、认知水平和情绪控制能力。这就需要你建立对自己的领导力。


    作为社会人，我们每天要和家人、同事、领导、客户、陌生人打交道。他们对你的认知以及他们的行动，都会影响到你的利益和心情。这就需要你建立对他人的领导力。


    所以，人人都需要领导力。认识到这一点，缺少这一点的人，会过得比较失败和痛苦。


    **误区二：领导力只能用于领导地位比较低的人。**


    有的人知道领导力很重要，也知道自己需要修炼领导力。但是他的目的只是为了更好地领导下属，因为在他的理解中，领导力只能用在自己的下属身上，而没有意识到，对自己、家人、上级、客户，都需要用到领导力。


    其中尤其重要的一点，是对领导的领导力——是的，我们不仅要善于领导下属，还要善于领导领导，对领导的领导力有多强，可能是决定你成功和快乐与否最重要的因素。


    所以，我们在练习领导力的时候，一定要注意提高“向上领导能力”。


    **误区三：领导力有放之四海而皆准的套路。**


    有人知道领导力很重要，甚至也知道领导力不光是对下属，还包括对其他人。但是他们认为，每个人需要的领导力都是一样的，有一套行之有效的办法，人人都能学，人人都能用。


    这些人常常会陷入失望。他们可能看了很多书，学了很多课程，听了很多道理，却依然领导不了自己和他人。这时候，他可能会怪书、怪老师，觉得教领导力的书是忽悠，讲领导力的老师是骗子。


    其真实原因，可能只是因为他没有找到适合自己的领导力而已。


    其实，每个人的条件不同、性格不同、目的不同、人生阶段不同、应用场景不同，根本就没有一套方法可以适用于所有人和所有场景。我们只有找到最适合自己、最适合当下的方式，才能发挥好好的领导力。


    ## 三、领导力的三个层次


    **领导力的第一个层次，是领导自己。**


    所谓领导自己，就是控制自己的身体、认知以及情绪。这是一切领导力的基础。如果一个人连自己都领导不了，那他也一定领导不了他人。


    所谓控制你的身体，就是让自己有一个能够匹配你所要求的目标的健康身体；控制你的认知，就是让自己有能够匹配目标的知识、信息和思考能力；控制你的情绪，就是让自己能够不被外界环境、别人评价以及自身状态所左右，能够在必要的时候调整为最适合完成目标的状态，例如平静、激情、甚至愤怒。


    当你能够在大多数情况下轻松地控制自己的身体、认知和情绪去为目标服务，你就具备了对自己的领导力。这个领导力的提升，是一个永无止境的过程。


    建立自我领导力，需要做到三件事情。


    ### 第一件事，要有目标意识。


    我们要给自己的生活、工作乃至整个人生建立一些目标，并且时刻都要记得朝着目标前进。吉姆·柯林斯把这叫做“以终为始”，我觉它把称为“不忘初心”，其实说的是一回事。


    有目标，而且做事的时候心里时刻有目标意识，是领导力的最重要的一点——我这里用一个“最”字，不管是领导自己、领导他人，还是领导团队，这个目标最重要。不然，哪怕所有人都对你言听计从，但是你们最后根本就就不是朝着目标前进，那你的领导力也等于零。


    所以，锻炼领导力的第一步，先问问自己有什么目标？


    ### 第二件事，要认识自己。


    我有什么优势？有什么劣势？有什么喜好？有什么厌恶？只有问明白这四个问题，你才能把自己的才能发挥到最大，或者让自己过得很开心，或者两者同时实现。


    要弄明白这四个问题不容易。你可以改变一下问问题的方式：


    - 在过往人生中，我最大的成就是什么？我是怎么做到的？

    - 最大的失败是什么？是因为我的什么问题而导致的？

    - 过去 3 个月（或半年、1 年、3 年、5 年、10 年），让我最开心的事情是什么？为什么？

    - 过去 3 个月（或半年、1 年、3 年、5 年、10 年），让我不开心的事情是什么？为什么？


    这也是为什么我要强调，领导力没有放之四海而皆准的套路，你必须得从你自己的实际情况出发，来寻找什么最适合你，锻炼你自己独一无二的领导力。


    ### 第三件事，要有自制能力。


    每个人都有好逸恶劳的时候，我们也常常会面临种种的诱惑，有时事情太难，我们会想着放弃算了，这时候，领导力的表现，就是我们能不能咬紧牙关，坚持向目标走去。


    提高自制力，可以从四个方面入手：循序渐进、及时回馈、梦想激励、外部监督。


    循序渐进，是指不要一下子给自己太多、太难的任务，可以先从简单的开始；及时回馈，是指要让自己的努力时常能得到奖励；梦想激励，是指要有一个长远的愿景随时让你心潮澎湃；外部监督，是让自己的努力有一个外部力量的帮助，使自己能坚持更长时间。


    如果能够做到这四点，你对自己的领导力会有一个大幅度的提高。


    领导力的第二个层次，是领导他人。


    这个“他人”，包括自己的下属，也包括你的家人、朋友、老师、领导、客户以及和你打交道的其他人。


    我们说“领导他人”，并不是说你要当他们的领导，而是当需要时，你可以借助他们，完成自己的目标。


    我们要去影响一个人，让他服务于自己的目标，一般来说，都是通过以下五种方式：


    1. 威胁；

    2. 利益；

    3. 理性；

    4. 情感；

    5. 信仰。


    换句话说，就是：


    1. 我让他害怕；

    2. 我让他得利；

    3. 我让他明白道理；

    4. 我让他喜欢我；

    5. 我让他信任我甚至信仰我。


    举个例子，想让孩子去上学，可以采用五种办法：


    1. 你不去我就揍你；

    2. 你去的话放学给你买冰淇淋；

    3. 去上学才能学到知识，考有好的学校，才能找到好工作；

    4. 妈妈爱你，你要好好学习哦（如果不学，妈妈会不开心）；

    5. 对爸妈无条件的信任，因为爸妈说要去上学，他就去。


    日常生活和工作中，我们可以根据情景不同、对象不同，而重点选择其中的一种，或者组合选择其中几种。


    在工作中，如果我们要长期影响同事、下属以及领导，让大家共同完成一个工作目标，需要做好三点：


    第一，要有较好的情商，能够和他们处好关系。或者，就算不能处好关系，也要有足够的威胁或威信，让他能够往同一方向使力，而不是搞破坏——在这里我要说一个我的观点，所谓情商高，不是为了让人舒服，而是能让别人帮助你达成目的。所以你和他人交往，不是一味地讨好他人，容忍他人，让他人喜欢我。有时候也要有自己的立场、脾气和手段，关键是要能够让对方的行为服务于目标。


    第二，你必须得有担当。在工作中，领导力的重要来源之一就是敢于负责任。如果有一件事，别人不愿意负责，你负责了，你就是那件事的领导者。如果你经常负责某些事情，你自然而然就是团队中有领导力的那个人。


    有一些人遇到事情总是不敢承担责任，不敢冒风险，不敢下决心。这样的人，就算是位居领导位子，实际上也是没有领导力的。


    第三，要考虑好利益分配。要别人听你的话，一定要给他足够的利益。这个利益不一定是金钱或物质，还可以是其他隐性的利益，例如得到成长、得到名声、得到夸奖、得到成就感等等。不管是哪一种，一定要有，不能什么利益都没有。


    当你善于给别人各种利益的时候，你自然就具有了领导力。


    上面只是说了三种通用的能力。对不同的岗位，不同的任务，可能还会有其他方面的要求。例如，有的特别需要远见；有的需要你是技术大牛；有的需要你是常胜将军；有的需要你特别会忽悠等等。这要根据不同的情况而定。总而言之，你需要能够影响别人，帮助你共同朝着目标前进。


    领导力的第三个层次，是领导团队。


    上面讲的主要适用于单对单，或者对着少数几个人的情况。而当你领导很多人的时候，就有不一样的要求了。


    要领导一群人，最重要的一点，是要给与一个共同的愿景激励。所以孙中山会说“驱除鞑虏、恢复中华、创立民国、平均地权”、伟大领袖会说“打土豪分田地；推翻三座大山，建立新中国；实现共产主义”等等。


    各大宗教在这一点上也做得特别好，例如上天堂、修来世等等。


    现代社会，做得比较好的企业，都会有一个美好的愿景，这个愿景，是维系一大群人的重要手段。


    如果你有机会领导一个较大的团队（小到 20 个人，大到上亿人都适用），一定要建立一个美好的愿景，这个愿景要和团队里的大多数人密切相关，要大部分人都愿意为之奋斗。


    ### 第二个重要的，就是要能够知人善任。


    团队人一多，你就不可控制到所有人，只能通过分授权，一层一层去控制。再厉害的领导，其最大的有效管理幅度，也就是十几个人。超过二十个人，一定有管不过来的地方。


    所以，要管好大团队，你必须学会看人和用人。你得知道你手下的高管有什么优势、劣势，有什么喜好和厌恶，并且还要想清楚你要怎样才能激励他发挥优势，怎样才能限制他的劣势。要把每一个人都放在合适的位置。


    这里还需要说一点，挑人的时候，对方和你价值观的一致性，比他的能力更重要。如果价值观很好，但能力不行，你还可以培养。如果能力很强，但价值观不一致，可能会导致你的事业完蛋。能够用好一个能力极强，但价值观和你不同的人，需要非常高超的驾驭能力，如果你不是万中无一的高手，建议不要轻易尝试。


    ### 第三个重要的，是建立一个好的奖惩制度。


    团队越大，管理中制度的因素就要越突出。这时候你的领导力更主要来自于赏罚分明，人人服气。


    所以，建立一套良好的激励机制，非常重要。


    建立这个机制，一定要时刻“不忘初心“。员工的什么行为有助于目标，就应该奖励；有害于目标，就应该惩罚。其中不能有情绪的因素。很多领导者会因为一己之喜或一己之怒，就随意奖惩，这对制度和人心是极大的破坏，应该坚决杜绝。


    需要提醒的一点是，制度必须坚持原则性与灵活性的结合，不能死磕条文。唯一的判定标准只能有一条：是否有助于达成目标。如果在执行过程中发现和目标相违背的条文，应该及时修改，而不是僵化地坚持条文。


    上面三点，分别涉及到一个组织的文化、用人和制度建设，这是一个领导者最需要花精力的地方。把这三点做好，领导力自然就有了。


    最后我们总结一下全文：


    领导力是影响自己和他人完成目标的能力。人人都需要领导力，不仅需要向下领导，还需要横向领导和向上领导。


    领导力分为三个层次，第一层是领导自己，需要认识自己、建立目标意识，并且锻炼自制能力；第二层是领导他人，需要用到影响力的五个方面，也就是威胁、利益、理性、情感、信仰，在一个组织里面，你需要有情商，有担当，并给人利益，才能获得领导力；第三层是领导团队，最重要的是建立组织文化、招到得力的助手并用好他们，以及建立好的奖惩制度。


    今天的分享就到这里。感谢大家的耐心聆听。


    作为牛人星球第一年的最后一期分享，我再多说两句：


    牛人星球第二年已经开始，我们有不少星友已经加入了第二期，谢谢大家的信任和支持，让我们继续一起走下去。今后关于牛人星球会员权益范围的文章、分享、资料等，我们会发到第二群。所以已经加入第二期的朋友，也请进入加盐星友会第二群。已经续费但是还没加入的，可以私信我，我拉你进去。


    当然，也许有的朋友已经比牛人星球走得更快，不再需要星球，我们也祝福他，让我们在不同的道路上，各自成长。我们这个“加盐星友群”，会一直保持下去，你可以继续在群里和大家交流讨论。我希望这里能成为大家在网上保留的一个温馨的港湾。


    再一次感谢大家！祝大家越变越牛，越来越好！


    ## 后记


    孔子说：学而时习之，不也很快乐吗？


    但是在这个时代，大部分人都走得很快，很难停下脚步来，学而时习之。所以，要凑够这么多爱学习的人在一起，也挺不容易的。


    我觉得，作为牛人星球的一员，我们都应该为自己鼓掌。


    一年的时间很快过去，我希望你在此刻，比你刚加入星球时，起码变好了一点点。


    也许你见识了更多的观点，也许你观摩了不同的人生，也许你学到了新的知识，也许你交到了新的好友，也许你感受到了向前和向上的激励……


    也许，你还想继续陪牛人星球走一程，那么，欢迎加入第二期，我们再一次成长。


    也许，你已经比牛人星球走得更快，不再需要星球，那么，祝福你，让我们在不同的道路上，各自成长。


    无论如何，共同点是：不要忘了成长。


    希望明年的此刻，你还能想起今天，然后问一下自己：我今年变得更牛了吗？


    我希望你的答案是坚决而自信的：是的！我变得更牛了。


    谢谢命运给我们这一年交汇的机会，谢谢你陪我走过这一年的时光。


    祝未来，越来越好！

