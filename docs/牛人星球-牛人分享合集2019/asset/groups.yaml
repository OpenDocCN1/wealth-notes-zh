    ## 公众号深度写作方法


    **分享人**：何加盐

    **分享时间**：2019 年 6 月


    本文是何加盐公众号写作与运营课的文字简化版，回顾了他公众号 3 个月做到 9 万粉丝的过程，并梳理了公众号深度文章写法，是一篇公众号发展和深度写作手把手的指南。1
    万 4 千字，全是干货。不管是对于做公众号，还是学习深度写作，都有很好的借鉴。


    各位星友，大家好，欢迎来到牛人星球！咱们今天是第一期分享，有些事情我也想先跟大家说一下。首先是特别感谢大家对何加盐以及牛人星球的支持，我们牛人星球现在刚组建不久，大部分朋友都是这一两个星期才加入进来的，星球里面目前文章内容还不够多，希望我们今后一起来创造。


    有些朋友可能刚进来会觉得，里面好像没有太多文章，其实这需要我们大家一起在未来 300 多天的时间里共建一个好的星球。以后，如果大家看到牛人星球里好的文章，也可以分享到朋友圈或者微信群，让更多的人能够加入到我们。因为一个社群，它链接的人数越多，价值越高。


    现在我们正式开始分享。


    今天分享的主题是“何加盐公众号写作方法”，实际上我这个写作方法应该叫做深度写作的方法，大家也可以看到何加盐公众号的文章和一般公众号的文章还是有点不一样的，我的文章内容会比较深度，文章的长度会比一般的公众号要长很多，一般都是
    1 万字左右，有些甚至到了一万五六千字，所以我们叫做深度写作的方法。


    首先，我对自己作一个自我介绍。这个介绍呢分成两个部分，第一部分是何加盐的过往经历，第二部分是何加盐公众号的发展经历，我们先简单介绍一下我自己过往的一些经历。


    我会从这三个角度来介绍我的过往经历，分为三段，第一段是在政府部门工作了十年，我是从事国际经济与政策研究，去年二月份的时候出来，开始做一个咨询公司，这个咨询公司主要是从事企业战略，商业分析，组织架构以及薪酬与激励机制的设计，这个两段工作对我后来写公众号也是很有帮助的，今年三月份以后，我发现自己的特长在公众号方面更加的凸显，所以我就开始写公众号。


    之所以会有何加盐这个公众号，最初其实是为了给咨询公司招新人的。因为咨询是一个流动性特别强的行业，时刻都面临着招揽新人才的需求，我当时就想我可以写一个公众号，写一些年轻人喜欢的，尤其是那些上进的、热爱奋斗的、喜欢成长的年轻人喜欢看的东西，这样我可以在身边聚集一大批的年轻人，今后我这个咨询公司随时需要人才的时候，就可以从这个人才库里面挑选。这是当时的一个起源，这跟我在牛人星球里写的酐玩实验室有一点类似。酐玩实验室也是为了给他们的无人机社区引流，所以才开始写公众号。


    我和酐玩实验室的例子可以说明一个道理，就是有时候我们是无心插柳柳成荫，说不定你为了你的主业做的一件事情，或者你因为兴趣爱好而做的事情，会长成一个比你的主业还要大的参天大树，甚至会成为你的新主业。所以如果你有一些别的特长，最好是能够让它发挥出来。


    这个号的第一篇文章是去年的 7 月 21 号，当时因为高考招生刚结束，有很多朋友就在问我，高考没有考到心仪的专业，没有考到心仪的学校，该怎么办，我就写了公众号的第一篇《致高考生：心仪的学校和专业抛弃了你，但人生并没有》，那是第一篇，当时我的粉丝基本上是
    0，也没有做任何营销，就是在自己的朋友圈，微信群里面发了一下。


    后来写到第五天的时候，当时就有一件热门的事情发生，就是拼多多上市了，因为我是浙大的，正好之前也对拼多多的黄峥（他是我们师兄）有一点点了解，那天上午他还没有上市，我在校友群里面看到有人在讨论，我觉得这个事情值得写一写。正好那时候在研究弱关系，我一看他的经历，其实很适合用“弱关系”这个现象去解释。所以我就写了《拼多多上市，80
    后创始人 28 个月做到身家 800 亿，凭的就是三个字》，这三个字就是讲弱关系的，然后那篇文章突然一下子爆发，第二天就达到了 30 多万的阅读，现在已经接近
    90 万。当时带来了大概 13000 个粉丝。


    当时本来是写着玩一下的一个公众号，就是因为这篇文章，让我觉得写公众号可能对我来说还是挺适合的，所以我就慢慢的坚持下来了，但是因为我的主业咨询工作特别特别的忙，所以只能挤出很少的时间来写公众号，一个星期大概也就是两三个小时，写出来的文章质量在我自己看来不是很满意的，所以文章阅读量也不是特别高，一般就是两三千，吸引来的新关注的人数也不高，这样持续了三四个月的时间，粉丝也就增长到18000。


    然后就到了过年的时候。过年放假，有更多的时间用在写文章上，可能很多人都看过我当时写的那篇文章《浙大郑烨：一位寒门状元的重生》，那篇文章在我的公众号上阅读量不是特别高，就57000多，但是它在社会上影响特别大，包括新华社、人民日报、共青团中央都转载了。另外，中央电视台也专门为这篇文章做了一个专辑，就是派了《面对面》节目组去录了一个18分钟的节目，可以说社会影响力非常之大。这篇文章让我意识到我可能在写公众号这方面比做咨询更擅长，也更加适合自己的爱好，所以从二月份开始，我就在思考要不要专职的做公众号，后来我就下定了决心转型了。


    大家可以看到上面这都是当时的一些媒体和组织转载的截图，还有一些像我们从小读到大的读者、青年文摘、意林等杂志也全都转载了，这让我对自己的能力和未来写公众号的前景很自信，所以从3月3号开始，我就基本上专职开始写作了。到3月12号的时候就写出了《比抖音让我们堕落更可怕的，是今日头条让我变傻》那篇文章，当时那篇文章传播特别快，三四天就达到了30多万，可以说是带来了一个小高潮吧。不过因为那篇文章批抖音和今日头条比较狠，所以今日头条他们公司就在后台投诉我侵犯他们商誉，还威胁说要采取法律手段，因为那时候我完全没有经验，也不知道怎么处理，大概四五天后，我就把那篇文章删除了，其实特别可惜，现在看来话，那文章是没有任何问题的，因为当时没经验就删掉了，删掉的时候阅读量是30多万，那个时候它每天都在给我带来两三千的关注，所以一下子就把我的粉丝数量拉到了四五万。让我有了一个很好的专职做号的发展基础。


    再后来就是4月7号的时候，我写了《拼多多的黄峥和淘宝的蒋凡打起来了，美团的王兴在起哄》这篇文章，这篇文章是我第一次尝试写这种深度的商业分析，它的阅读量现在已经99000多了，很快就十万加了。这篇文章也流传很广，据我所知很多企业家都看到了，它让宗庆后的女儿宗馥莉关注到了我，并且主动联系让我去写一写她。从这篇文章之后，我就开始从写个人成长、认知、思维提升这一块转向研究企业和企业家了。


    所以大家可以看到我现在主打的一个个人定位，是一个专门研究牛人的牛人。我也还是会写一些认知和思维提升类的，但这些也是跟研究牛人的结果密切相关的。所以我的定位也是经历过前面很长时间的一个摸索，才最终确定下来的。后面就写了《张一鸣和他的流量帝国》、《猛人思维》、《美团王兴，四十不惑》、任正非、孙宇晨、李想这些，引起的反响都特别大，让我比较高兴的是我写的这些人，他们基本上都会看到，因为有很多人会特意发给他们，像王兴，他就评价写得很酷，这个让我特别开心。


    我从3月3号开始到现在6月27号，三个多月的时间，粉丝从2万增长到9万。这个也算是今年公众号领域的一个小奇迹，可能就仅次于卢克文了。


    第一部分是介绍了一下何加盐公众号的发展情况。第二部分，我们就来讲一讲公众号的未来发展形势，首先我们看一下，未来公众号有没有前途？因为很多人都说公众号的红利已经完了，15年16年一个号很容易就做起来，那时候做到几十万，上百万的粉丝都是很容易的。像我这样的文章，如果是在15、16年，现在估计早就是百万粉丝了，而我今年做到现在也才九万多，估计七月份可以超越十万+。这已经创造了这一年的奇迹了，从这个角度来讲，公众号的红利是不如以前的。但是我们可以认为红利完了吗，这个等一下再回答。


    第二个就是高维打击会不会来。什么叫高维打击呢？大家都还记得，大概十几年前，网络是BBS论坛的时代，校园BBS、天涯、猫扑、凯迪，这些都是特别火爆的。可是新浪博客出来之后，这些都死掉了，新浪微博出来之后，新浪博客也死掉了，新浪微博大概在12、13年达到顶峰，等微信红起来之后，它也开始衰落了。现在是快手抖音在跟公众号竞争，那么，像类似于之前博客取代BBS，微博取代博客，这样的一种高维打击会不会到来呢？很多人也是有这样一个担心。


    我觉得问题的关键就是在于我们这里列的第三个问题：深度内容还有没有需求。大家可以回想一下，你一般看长文章是在哪里？根据我的经验，大部分人看深度的文章，都还是在公众号，可能有一些是在今日头条，但是比例还没有那么大。我个人认为只要人们还有深度阅读的需求，公众号就还会存在，因为目前它是看深度文章最方便的一个渠道，我们每天大概十几个小时，手机都会在旁边，我们每时每刻都会拿起微信打开来看，只要你随时随地有看深度文章的需求，你一定会通过微信来看，从这个角度讲，我认为五年之内微信公众号还是很有发展前途的。


    刚刚说的是纵向的，那横向来看，微信公众号跟其他的自媒体相比的发展怎么样呢？


    现在快手、抖音、今日头条、还有一些直播都发展的很快。B站这种弹幕网站也发展得很快。知乎是个老牌网站了，但是现在开始衰落了。微博也还比较红火，但它更多的是侧重于社会新闻以及娱乐。对于这种深度的文章，我们一般还是在公众号上看。


    上面我说的所有这些，它们都有各自领域的发展，也都发展的挺好。但所有的这些平台，包括百度的百家号、一点资讯的一点号，还有企鹅号等等都有一个很大的问题。


    它们的共同特点就是，对于内容创作者来讲，变现特别困难，它的商业模式可能考虑不够清晰。微博还稍微好一点，但也是要超级大V才能赚到钱，直播能赚到一些钱，其他的平台一般的人都是赚不到钱的。


    只有在公众号，你粉丝达到五万十万就能够有比较好的变现了。我们看到在其他所有的平台，那些做的比较好的号都会往自己的公众号来导流。比如说知乎的大V都会在底部有一个“我的公众号是某某某，欢迎关注”。因为他必须得把他的粉丝引到公众号来，然后通过公众号再进一步一些商业化的变现，这样是最方便的。所以其他号，发展好也只是为公众号引流而已，所以那些平台也在拼命想各种办法限制住公众号导流。


    接下来我们讲一下，做好一个公众号之前要做一些什么准备。我觉得最重要的准备就是把你的公众号做好一个定位。这个定位是一切的基础。我之前有很长一段时间，就是从拼多多那篇文章到寒门状元的那篇文章中间那么长时间，大概有五个月吧，文章写得很好，但是粉丝增长的很慢，其实就是因为定位不清楚。


    我认为公众号定位需要考虑这三个方面的问题。第一个是你的目标人群是什么，像我写认知的，那可能就是对认知的提升有一定需求的。这种人群的分类有一些是专门针对女性情感的，有一些是针对少儿教育的。我现在写企业家，就是针对企业家、高管、创业者和希望变成牛人的这个群体。


    第二个定位是你的内容要定位好。你是提供信息聚合类的、还是提供观点类的、还是有价值的干货、或者是情感共鸣类的、或者是幽默搞笑类的。你一定要定位清楚，你的内容是什么。像我的内容就很清晰，我是人物经历以及成长认知的干货，主要是这两类。像情感类的我就不是很擅长，前面写过的情感类的文章，基本上流传都不是很广，后来我就不写了。


    第三个是风格的定位，你的风格是偏幽默风趣、还是嬉笑怒骂、还是强烈的批判、或者是像咪蒙一样带动情绪、或者是理性分析。我的风格可能就是偏理性派，偶尔带一点点小幽默这样一种风格。所以你要写一个公众号的话，一定要自己鲜明的一个风格。这样大家一看到你的文字，就知道是你。如果换来换去，读者可能会无所适从。他们不能预期从你这里能够看到什么内容，得到什么，他们是没有一个动机来关注你的。你必须得给他们一个明确的预期，并且不断地符合这个预期，他才会关注你，并且持续的关注。


    接下来就要进入到开始写作前的一个准备了。我们写每一篇文章，一定要牢牢的记住三个目标。我们的文章为什么要写呢？你写出来其实是为了让别人看，就是你要诱惑大家点击进去。可能诱惑这个词用的会有点偏贬义，但实际上我们的意思就是让更多的人来点击。诱惑点击一般跟三个因素有关。首先是标题要起得好，一看就让人有点击的欲望。第二个有一些标题起的也很平实，但是如果很多人都在转发，是刷屏的，你在朋友圈里看到别人发了五次十次，你肯定也会好奇到底写的是什么，会点进去看。第三个是品牌信任，即使这个标题起的一般，但是是你喜欢的公众号作者写的，你也会点进去看一下。


    写文章的第二个目标就是要促进大家去分享、转载我的文章。因为一篇文章要流传的广，一定是需要大家来转发转载的。我们转发到朋友圈，转发到微信群，转的越多，或者点在看越多，这篇文章最后的阅读量以及增长的粉丝数可能就会越多。


    促进分享它主要是跟这么几个因素有关。第一个是我们去分享的动因是什么，大家可以想一想你发朋友圈，第一个需求其实是向外界展示你自己是一个什么样的人，所以是展示自我。展示自我一般会有这么三个需求，首先是求得一个身份的认同。


    我举一个例子，假如你是摩羯座的，然后你看到一篇文章写《摩羯座的女人是世界上最好的女人》，作为一个摩羯座的女生，你可能就会很有动机去发。或者你是湖南人，你一看《湖南人是中国历史的功臣》你可能也会去发。这儿有一篇刷屏的文章，可能有几千万的阅读，它的标题叫《广东人真是太太太太太好玩了》，那广东人点进去一看，把我们广东人说那么好，大家都纷纷的转发。还有就是学校、公司、年龄、喜好的，都是身份认同的各种不同的情况。比如说《九零后，你看不懂》或者说《我们零零后跟你们不同，你不要用老眼光来看我》那九零后，零零后的人可能会分别转发。


    第二个是形象的彰显。比如说有些文章，它其实是为了给别人提供一个炫富的机会。我们在五星级酒店住一下，在高档西餐厅吃个饭，会发个朋友圈，其实这是一种炫富的需求。还有一些是为了善良的需求。比如说我看到一篇文章是讲人要做好事的，人要善良的，我发出来其实不是因为我要劝别人善良，而是要告诉别人，你看我认同这种观点，我是一个善良的人。还有一些，我今天跑了十公里、我今天背了100个单词、我今天看了一本很难的书，类似《资治通鉴》或者是《物种起源》这样的。那是展示我是一个坚强的、乐观的、上进好学的人。我们的文章要给别人展示这些形象的一个机会，他们才会去转发。


    第三个转发的动因是展示他的品味。我们可能在朋友圈会说一下，我喜欢的某个明星，或者喜欢哪个作家，其实是展示我的品味。这个品味有可能是时尚的，像我们关注的一些号，它是时尚号，我很认同，我会经常转发它的东西。有些是文章很理性，或者说看问题特别深刻，或者是特别幽默风趣。只要一篇文章能够给别人提供一个展示他品味的机会，他就可能会帮你转发。


    上面说的是展示自我的需求。第二个是抒发情感的需求。


    首先是愤怒。有很多文章是引发我们愤怒的情绪促使我们转发，比如说《疫苗之王》，我们看完之后就会觉得特别愤怒，忍不住去转发。再比如，有一个叫烧伤超人阿宝的，他会经常代替医生写一些愤怒的文章，医生群体都会去转发。因为他帮他们说出了愤怒的这种感情。


    第二个是恐惧，恐惧是最常用的。我们看过很多这样的文章，比如你不能生病，或者说人到中年再不努力，时代抛弃你都不会跟你打声招呼。激发焦虑感是用的最多的一种方式。尤其是写认知、思维、成长这一类的文章经常会激发我们对不确定性的一种恐惧。


    第三个是悲伤。比如说巴黎圣母院被烧了，或者说金庸去世了，可能我们会有一些悲伤的情绪。有文章表达出这些情绪，我们就会去转发。


    第四个是喜悦。比如北京申办奥运成功了，我们会在群里转发这个喜讯。


    还有就是感动。比如有一个号叫做视觉志，他们曾经有一篇估计阅读在5000 万以上的文章，就是《谢谢你爱我》。它写了一些很让人感动的小故事，配上了感人的图片。结果大家就纷纷的转发。


    第三个大的动因，让别人会转发的就是对别人有帮助。


    我们可能经常在家庭微信群，看到爸爸妈妈转发《按这个穴位你就不生病》，或者《经常吃这种蔬菜，你的血压就会降低》类似这样的文章。他们为什么要发这个呢？就是想让别人觉得我提供了价值，我是一个有用的人，我在帮助你，这也是人的一种很大的需求。一般来说，我们的文章会提供这么一些能够帮助人的东西，首先是新鲜热辣的信息，别人不知道的我知道，我会转发告诉别人。第二个是干货类。就是让人能够得到成长，或者获得一些新的知识，获得一些思维的提升这样干货类的文章。还有就是提供愉悦感的文章。比如说一些特别幽默，特别搞笑的，我们会发在群里，让大家跟我们
    一起欢乐一下。


    写文章要注意的第三个目的就是带来关注。其实作为一个初创的公众号来说，你每一篇文章最终的落脚点都是要给你带来新增的粉丝，要不然它就是没有意义的、无价值的文章。所以我们每写一篇文章，落笔的时候，都要想一想，我这样写，我表达这么一件事情，表达这么一种情感，能不能带来新的关注。如果带不来的话，你可能就不一定要写了。有些哪怕是阅读量很高，它也不一定能带来新的关注。因为我们看文章，让我转发是一种动因，让我关注又是另外一种动因。


    我梳理了一下，觉得可以带来关注的主要是有三个需求。


    第一个是与牛人建立连接。有很多文章，它的作者通过字里行间向我们展示他是一个很牛的人。这种牛人，我们会想着去关注他，说不定能跟他建立一个连接，或者是向他学到一些东西。像何加盐这个号本身，也是向外人展示我

    '
  merge: -1
- raw:
  - '[PAGE 11]


    有价值的一面，或者说我有一些牛的地方。为我带来特别多的关注的就是抖音、今日头条那篇文章。我里面一开篇就写我曾经在政府部门工作、研究一些很高大上的东西，我还预测对了。这里首先从身份上展示我是一个政府公务员，是有一定的工作渠道的，是能够接触到很牛的人的。第二个是我预测能力很强。通过文章本身又展示出我的思维能力、总结能力、表达能力。大家可能会觉得这个作者挺不错，挺牛的，那我关注一下他，说不定能建立一个连接，学到一些东西，这是第一种关注的需求。


    第二个就是学到干货。这是我们看很多成长类、技巧类、心理学、职场类的文章的一个需求，因为我从他这里总是能学到很多有用的东西，这样我就会关注他，省得以后每次都要去找。


    第三类是能带来情绪共鸣的。比如说咪蒙，她就特别擅长写这类的文章。她总是会骂渣男，骂贱人，这样让你总觉得她在帮你说话，你可能就会去关注她。


    我再总结一下，你每一次动笔写文章之前，你写每一段、每一句、每一个词之前都要想，我写下去有没有诱导别人点击、有没有促进别人的分享或者转发、有没有带来有效的关注，让我的粉丝数增加。每一篇文章，你都必须得抱着这三个目的去写。当然，你需要做到这些，一定是要提供你独特的价值，让读者能够有所收获的。我们这里讨论的是具体的做法，这些做法是促进我们达成这个目的，但是归根到底我们还是要提供一个独特的价值。


    接下来就进入到写作的阶段了。我们一篇深度文章，它是怎么写出来的呢？主要是跟这三个因素有关，第一个是你的资料搜集的能力，第二个是观点梳理的能力，第三个是文字表述的能力。


    首先我们看一下资料收集。写一篇深度文章，你的资料收集必须符合三个原则：第一个原则是全面。就是你掌握的资料一定要很全面，比你能看到的其它的公众号都要全面一些才行。像我写孙宇晨那篇文章的时候，我是把所有能找到关于他的资料，他的书都全部看了一遍。我发现那几天写孙宇晨的文章可能有几十篇，所有的人都没有发现孙宇晨自己是写过一本书的，那里面有大量的非常有价值的爆料，别人居然都没有看。所以我觉得现在做公众号，很多人其实是很浮躁的。而我们如果要写好一篇深度文章的话，最好是越全面地占有'
  - '[PAGE 12]


    资料越好。


    第二个就是你在全面占有资料的情况下，你掌握的信息越多，你就越能够从中发现一些独特的信息，这是别人没有看到的。我这里举的例子还是孙宇晨那篇文章里面提到的。孙宇晨他之前经常会打一个牌子，就是说“我是亚洲周刊的封面人物”，这个东西一听好像很高大上，哇，好厉害。其实你仔细看一下会发现亚洲周刊是一个对中国不太友好的外媒。它的封面人物经常是一些政治上的异见人士。我看了一下孙宇晨作为封面人物的那个文章，其实是因为他在校园里搞反对对方的校园政治，才会成为封面人物。这个跟他的能力、品德这些都没有关系，完全是因为政治的因素，所以并不是什么可吹的东西。


    然后根据那篇文章挖下去，我发现在香港中文大学交流的时候，他的导师是对他政治思想影响特别大的一个人。是占中三子之一，香港头面的反动人。而孙宇晨的政治思想正是启蒙于他，所以他从香港回来之后就大搞校园政治，并且因此得罪了校方。他害怕毕不了业，才去要求提前毕业，这个是一个很独特的点，我没有发现其它的公众号找到这个信息。


    第三个原则是要有内幕。如果你不能接触到主角身边的人的话，是很难做到的。但是如果你占有的资料特别全面，你可以挖出一些别人没发现的，其实也是很内幕的东西。比如孙宇晨因为抄袭的风波，跟耶鲁大学的一个学生互相在网上批判的事情，已经过了十几年，现在网上也找不到资料了。我是通过谷歌把当时他们所有的信息全都还原出来，这就是很内幕的信息。另外一個是我写李想的那篇文章，李想当时在石家庄做显卡之家，他认识了邵震。邵震刚好是我的朋友，所以我通过邵震得到了很多当时的内幕。比如，邵震第一次跑到石家庄去跟李想谈未来他们的事业发展的时候，他们一起躺在高低床上，听着许巍的歌，畅想未来。这种内幕信息是别的公众号很难提供的。所以文章写出来就会有一个独特的价值。那几天，写孙宇晨的可能几十篇，人家为什么要看你的，不看别人的？因为你提供了全面、独特、内幕这三方面的信息，让你的文章具有了更高的价值，以及更好的价值。


    在掌握了资料搜集三原则的情况之下，就是资料收集的渠道。


    我认为写一篇深度文章，你至少需要知道这么一些渠道：首先是书。有关那个人的书最好是都能看一遍，能够买实体书的就买实体书，有时候可能来不'
  - '[PAGE 13]


    及，在网上搜一下，比如百度搜一下，基本上很多都能搜到。现在还有一个特别好用的就是微信读书。微信读书里有可能95%以上的实体书都能找到。现在好像有十几天的无限阅读时间，我估计过了这段时间是要付费的。但是如果说你写一篇文章特别着急，可以在微信读书里先看一看。


    第二个是视频。因为视频是我们在百度或者其它渠道用文字搜不到的，但是它里面能提供特别多 的信息。尤其是一些深度的专访。像王兴、张一鸣、李想他们都是被中央电视台或者某一些创业的频道如财经频道深度专访过的，半个小时，一个小时以上。它里面有大量书上没有写或者文章里看不到的资料。所以我每次写一个人的时候，都会去找一些他们的专访来看，能看到很多独特资料、内藏的资料。何加盐公众号目前是写人物最出彩的公众号，这个也是一个必不可少的因素。


    第三个是杂志。杂志它跟网络的文章不一样，它一般采访的都会比较严谨一点。所以我们尽量要找一些杂志的文章，比如说财经杂志。它是做人物做的特别好的杂志。另外就是公众号，尤其是主角自己开的公众号一定要看。比如黄铮他就有公众号，虽然最近没写了，但是有原来他早年生活的一些文章，对了解黄铮是特别有帮助的。我看很多写黄铮的人根本连他的公众号都没有看，这个是完全不应该的。


    第四个是知乎。写深度文章的话，在知乎里能找到很多的素材和观点的启发，知乎也是必看的。


    第五个是微博。微博主要是找关于那个人的最新信息，以及看他自己没有开微博。我写王兴，王兴的所有微博我都会看一遍，包括他的饭否，我也会全部看一遍。像程维，张一鸣，他们都是有微博的。尤其是看程维早年的微博，可以看到当时的滴滴做起来的时候，他们是特别困难的。程维天天都在微博上推销嘀嘀打车APP。所以我看到这些就会觉得特别有意思。


    还有百度是肯定是要用的。关于百度，我提个很好的建议，你要学会交叉查询。我们写一个人、写一件事的时候，不要光用那个关键词，要多用一些两个关键词或三个关键词加起来的查询。比如我写刘强东，我在百度里搜索“刘强东”能出来很多的文章。但是，我如果搜索“刘强东+徐新”（徐新是最初给他投资1500万美元的那个人），我会发现很多新的东西，尤其是徐新怎么评价'
  - '[PAGE 14]


    刘强东的这些。光搜“刘强东”三个字，这个文章不一定能显示出来，但这些信息都是特别有价值的。尤其是那些创业公司，它会有很多投资人或者合作伙伴，你要是把这些名字组合起来搜的话，会有很多意想不到的惊喜。


    还有就是一定要学会用谷歌。现在我们在内地是很难用的，但是你要学会上外网。能不能找到上外网的方法本身也是你信息搜索能力的一种，而且谷歌能够提供很多百度搜不到的资料。


    最后就是各家公司的财报，以及他们的官网，这个是必看的。像我写京东，写美团，如果以后写阿里和腾讯，一定会看他们的财务报表。很多的财务报表可能是英文的，在美国证监会的网站上。这个需要一定的英文能力。但是也有很多在公司官网的“投资者关系”那一栏里面有中文的翻译，所以我们要学会去公司的官网找“投资者关系”这个栏目。


    资料收集完了，就是观点的梳理了。观点梳理也需要长期的练习。但是有两个比较好的方法，大家可以学一学的，就是金字塔原理和 MECE 原则。金字塔原理是我们一般按照总分总这个结构来写文章，层次比较分明。我们梳理观点的时候也是，首先我这篇文章要表达什么观点，我就先把这个观点亮出来，然后这个观点之下可能分一二三四五，五点。最长不要超过七点，超过七点之后，我们人的脑子记不住的。


    第二个观点梳理的原则是 MECE 原则。MECE 翻译成中文就是不重不漏。比如说我把思维的五个层次划分一下，那就是 12345，这五点不能观点是重复的，但是也不能有漏掉的。举一个例子，牛人的成功因素，我会把它分为可控和不可控。它们两个又不重复，又没有漏掉的。可控的里面，我把它分为选择，动力，方法。这个也是不重不漏。然后不可控的，有时间和环境、还有运气等等。大家要学会这个分类的原则。


    因为这两个都是特别大的话题，今天的时间有限，我不能展开讲。推荐大家看两本书，一本叫《金字塔原理》，一本叫《麦肯锡方法》。基本上看完这两书就能够掌握这种观点梳理的方法了。


    第三个讲一讲文字表述的技巧。文字表述分为三个方面，标题，内容和结构。


    首先是标题，我们怎样创造一个有吸引力的标题，这个需要长期的训练。'
  - '[PAGE 15]


    首先，我们写标题的时候不能以自己为主，要从读者的角度出发。你不能写一个标题，充满了读者不知道的名字。比如说我之前写996的时候，我会发现很多人其实不知道996是什么意思，所以我刚开始写996的文章，传播量是不高的。后来等到传播了很久之后，大家都知道了996，那个时候你就不需要解释了。但是早期的文章其实直接写996是不占便宜的。


    我看到过很多的文章，尤其是官方机构的文章，它完全是想自己表达一个意思。但是站在读者的角度想是完全不想点进去的。那种标题起了完全没有意义。


    当你拥有了读者思维之后，还要有一些其他技巧，这里面提供四点。


    第一个最好是与热点相关，比如说热点的事件或者热点的人物。因为它们 是自带流量的。


    第二个你要用一些数字来凸显。比如我说《拼多多上市，80后创始人用28个月做到身价800亿》这些数字一看就很震撼，大家就可能会点进去看。


    第三个是反差，比如我写王兴给他20亿（注意这里面有数字），80后高中 生李想，80后的高中生，而现在估值200亿，这是一种强烈的反差，大家就会 想看。


    第四个是对比，比如说我写的灰度的那篇文章有强烈的对比《普通人追求安全感，高手接受不确定性》因为对比很强烈，大家都会很想去看一看，为什 么我们普通人是这样做的，高手是那样做的，所以热点、数字、反差、对比，
    大家如果掌握这四个原则的话，你的标题一定会取得更好，点击量也会很高。


    从内容上来讲，因为我写人物稿比较多，我觉得要做好 的话，要做到夹叙 夹议。不能平铺直叙，像记流水账一样。你要有一个你自己的论述，比如他做 了这件事情，你是怎么看的。我写每个人物，会写他有什么长处，什么优点，
    他的公司走到这个地步，是好还是不好，因为什么原因，这叫夹叙夹议。另外 一个你要把内容写出深度来，并且具有独特性，资料要比较全面，这个前面说 过了，我就不再赘述了。


    那从结构上有什么技巧呢，如果是认知类的稿或者干货类的稿，最好的就 是总分结构。这个是最符合我们人类的阅读跟记忆习惯的。我首先把观点抛出 来，然后分成几个点去叙述这个观点。'
  - '[PAGE 16]


    如果是写人物类的，按照时间线是最好的。这个也是我们人类最容易接受和记忆的。我一般会分成少年时期（就是大学之前）、大学时期、创业时期、创业过程中开始辉煌腾达的时期，遭遇挫折的时期，最后是当下，一般会分成这么几个阶段来写。


    写人物稿我会经常采用的一种方式，就是制造转折。比如刚开始我会写他创业那么成功，用户数一下子达到了多少，接下来一段我会写他资金链断裂了，公司马上要倒闭了。这样的话就形成一个强烈的反差，大家看起来文章是抑扬顿挫的，会觉得感觉特别好，不是那种平铺直叙的。为什么大家觉得何加盐写人物写的精彩呢，我觉得很大一部分是因为这个文章是有高低起伏的，不是一直记流水账。大家回去看一下我所有写人物的文章，大量的利用这种转折的技巧。刘强东，王兴，张一鸣，程维，李想。大家可以回去看一下，体会一下这种感觉。


    第三种结构的就是情绪积累与爆发。这个我在《寒门状元的重生》那里面用的是最好的。有很多很感人的情节，我刻意没有在前面写出来，我都把它堆在最后一段，我说：前面我没有告诉大家的是这么几件事情，第一件是什么，第二件是什么，第三件是什么，大家越看越感动。


    最后，郑烨在做完手术之后抱着病体给他捐骨髓的天使姐姐写了一幅字，我没有说那个字是什么，直接把这个图片贴上来：“再造之恩”。很多人告诉我，看到那张图片的时候，眼泪哗的一下子就涌出来了，因为我前面有情绪积累的一个过程，最后给他一个引爆点。大家可以看看那篇文章感受一下。


    第四个结构的技巧是长短结合。我们前面有一段比较长的段落描写一个事情，后面来个短句，这个是武侠小说里面经常用的。我们看古龙的小说，就特别多这种技巧，读起来节奏感特别强，也是会让读者感觉到抑扬顿挫。今年公众号最大的奇迹卢克文，他就是特别擅长用这种方式，我的文章也是大量的用到了这种技巧。


    前面讲了我们做公众号之前要做的准备、写文章之前要做的准备、以及写文章过程中的一些方法，最后我就讲几点体会吧。


    第一个，我们做公众号写文章，一定要学会扬长避短。就是要发现你的长处，优势是在写哪一类的文章，你是擅长于写人物还是写情节，还是那种推'
  - '[PAGE 17]


    理或者干货，或者是带动情绪，或者是提供信息，一定要发现自己的长处在哪 里。如果你没有发现自己长处的话，老是用自己的短处去写，那这个文章一定 是不能够传播开来也不能带来关注的。


    这里面我自己是有惨痛的教训的。我擅长的是写人物和认知类，但是我有 时候，忍不住要写一些情绪类的文章。比如说我前不久写了一篇关于联想的， 其实那篇文章没有太多的干货，主要是发泄一种情感，那篇文章呢，发完之后
    阅读量特别高，第二天就2万多，如果我不删掉的话，肯定是一篇10万加的 文章。但是我一看后台，那篇文章并没有给我带来更多的关注，相反，有很多 人取关了。因为大家的认知中，何加盐是个理性的人，他给我们提供的是有价
    值的一些信息、观点、好看的故事。但是我突然变成了一个感性的人，去提供 一种情绪的话，他发现这不是我熟悉的何加盐，所以有些人就取关了。大家一 定要避免这种情况。


    第二点体会就是宁缺毋滥。有些人写文章总是去追求日更，每天更新一 篇。其实这个是毫无意义的。因为你每天更新一篇，可能大家不怎么转发，不 怎么点击的话，它带来的关注是很少的。而对于一个初创型的、成长型的公众
    号来说，最重要的就是尽快把关注的数量做大。所以你与其写100篇没有什么 人关注的高文章，还不如憋一个大招，写一篇可能1万阅读甚至10万阅读，一 下子能给你带来几千上万粉丝的这种文章。所以我们每写一篇文章，一定要抱
    着这样的心态，我就是奔着10万+去的。如果达不到10万+我就不写。最后的 效果可能达不到，但是你要有这样的一种决心和勇气。


    第三个是不怕掉粉。我们做公众号很怕掉粉，但是有时候它是没有办法 的。哪怕你每天什么都不写，可能也会有几十个粉丝去取消关注。因为现在大 家公众号里面的列表那么多，可能我每天也就关注几个，甚至，很多时候我都
    不愿意去看公众号的文章，玩玩抖音多好呀，所以取关是一定的。大家从心理 上就不要害怕这个东西，因为取关每天也就是几个几十个而已，但如果你写一 篇好文章的话，一下子几百个，几千个新的关注。其实那个取关你对比例上
    来讲是没有任何影响的，所以大家心理上要去接受它。


    第四个特别重要，很多写公众号的人他没有避免踩到这个坑里，其实我也 有一点踩到这个坑里，就是一定要推迟变现。因为作为一个成长性的公众号来'
  - '[PAGE 18]


    讲，你所有的努力，最终的目的就是尽量把你的号做大，让关注者越来越多，所以你所有的文章、所有的动作，全部都要围绕这个目标来，不要干扰这个目标。但是我们往往写到，比如说粉丝
    2 万的时候，就会有很多广告商找过来，然后你自己也会有一些变现的冲动。比如说接广告，或者做一个付费的社群。因为公众号是很苦，很花时间的，如果是专职做号的话，没有收入，这确实会让人很焦虑，所以我很理解这种心情，但是千万不要。


    因为当你开始做变现的时候，你就会发现变现跟增长其实是非常冲突的。咱们作为星友，我说一点坦率的话，大家可能是比较铁的粉丝，经常看到我的文章会去点赞，转发，点在看，这个我也特别感谢大家。但是有很多人，他不是这样的。他一看，哎呀，何加盐，你居然敢接广告赚钱，那我也就不帮你转发啦，不给你点赞，看了也不留言互动了，甚至我还要取关，这样子的读者还是挺多的，他就恨不得公众号作者一分钱都不赚，天天都是为大家免费服务，可能最后饿死算了。但其实这样是不正确的，因为公众号作者他自己也要吃饭的。


    但是我们作为一个成长期的作者呢，就要认识到会大量的这样的人存在。所以我们一定要延迟满足感。我个人的建议是粉丝没有到 10 万，最好不要接广告，也不要做那种付费的社群。我现在在这一个月，开始做了一些尝试，坦白讲，受到了很大的影响。所以我认为这是我踩到的一个坑儿，也是提醒后来者的，如果你能够推迟一点变现就推迟一点，越晚越好。


    总结一下，今天我们讲了何加盐公众号发展历程、公众号发展前景、开始做公众号前的定位工作、写文章的三个目标、深度写作方法、何加盐的 4 个体等内容。希望对大家有用。


    谢谢！'
