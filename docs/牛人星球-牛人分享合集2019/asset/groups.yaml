    最后还有一个问题：


    前面问到的总裁办主任该怎么述职，不知道大家有没有思路？


    这个也是我们在实际咨询的时候遇到的。我们给一家公司做绩效方案，涉及到他们年终述职，总裁办主任就很苦恼的来找我们说不知道怎么述职，他把今年做的事情都列了一个流水账，这样其实在述职的时候是会被打很差的分数。我们就帮他梳理了一下。


    大家都知道总裁办主任的工作是没有办法量化的，尤其是不能换算成金钱，但是我们可以用一种巧妙的方式把它换算成了金钱。


    总裁办主任他主要有三个贡献：第一是他帮企业运作高新技术企业的政府补贴申请，以往企业每年都是申请到 300 万，业内的同行一般是 300~500 万，总裁办主任他成功的申请到了
    750 万，我们是不是可以认为 450 万是他个人的突出贡献。


    第二大功劳是他重新制定了一个审批流程，阻止了 5 笔问题采购，经过重新采购，给公司节省了 100 万。


