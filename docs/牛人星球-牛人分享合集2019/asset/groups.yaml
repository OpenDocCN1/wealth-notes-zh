    这里我想要表达的是，特朗普抓住的是超过 60% 的人都会感兴趣的话题。所以这也就是为什么，他会得到更多人数的支持。


    第二张图，会更好的说明第一张图对应的用意，特朗普是如何在数据上完美的使用，并帮助自己获取竞选的胜利。在当时的美国主流媒体中，大家可以看到很多人反对他不喜欢他，拿他开玩笑的人特别多，但是在美国有一定的数据显示，有很多的人是不会来投票。而且还有另外一批人不在乎选择特朗普还是选择克林顿。


    所以，特朗普的着重点放在这两批人身上。第一种人不在乎选谁，第二种是不会去投票的人。他鼓励这两类人，并且关注这两类人最关心的事情。


    第二幅图主要有六个要素：民意调查、问题及日期、内容、社交媒体、数据结果、美国选民。


    其中一切的要素的核心是美国选民。从这些数据当中，整个竞选团队自然会知道，哪些人是特朗普最应该关注的人。


    大家可以在网络上收集一些特朗普的演讲，从中我们可以发现，在不同州演讲的内容会有不同对应的侧重点。


