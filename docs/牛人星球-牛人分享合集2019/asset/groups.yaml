    问答：


    问：请问您和先生在生活中有没有感受到文化冲突的时候？能不能举一些小例子说明？


    答：当然有。我先说说相似的，我觉得中印双方对家庭都是非常重视的。当然这个重视也包括了各种的家庭狗血。


    我觉得有一个很大的区别是中国人和印度人对时间的观念不一样，中国人更准时，印度人就更随意。


    我记得有一次，我们有一个共同的朋友，是一个印度女孩和一个欧洲的男生，他们组织了一次 BBQ，说是晚上七点开始。所有的欧洲人、中国人基本上是七点之前准时到的，或者是七点之前到的。印度人拖拖拉拉的，最早的也是七点半才来。我觉得时间上是有不一样的，对他们来说时间的概念相对的会长一些。


    还有一点可能我又说远了，这个跟我们的家庭生活又不一样的。比如说制造业为什么在中国能够发展的这么好，而在印度真的很难。就是跟这个时间观念确实也有关系，我在印度旅行或者是回家的时候发现印度人有点懒。对他们来讲，我为什么一天要在流水线上工作那么久的时间，都不能喝茶，都不能休息，我宁可不用赚那么多钱。这是从另外一个角度讲另外一件事情，可能跟今天讲的这个领导力又不一定相关。


    今天我们所讲的能够坐上国际 CEO 的这一群人，他们真的也都是很努力很用功的。包括我身边的这些印度人，他们在咨询业也好，在业界也好，在学术界也好，做到比较高层的，那努力程度是一样一样的。'
