    问答：


    星友：您认为现在没有比特币的普通人，也没时间研究，应该采取什么策略？是否应该少量长期持有？


    答：还是先研究，如果感兴趣，花些时间去了解，这样你才能真正心中有数，做到长期持有。比如我今天说了说，明天谁说了说，你觉得这东西可能好，但没想明白，后面即使买了，一个波动就下车了，也许就没有赚多少钱。


    当然如果你说放个人总资产 1%甚至更少的钱，一点点进去，长期持有，应该问题也不大，但就有点不痛不痒了。


    星友：在国家目前大力倡导推广研究发展区块链技术的当前，会对比特币在国内的发展有什么影响？未来比特币在国内的趋势又会是怎样？


    答：国家大力推进研究的主要是央行数字货币和它的应用领域，和比特币关系不大，有点井水不犯河水的意思。未来比特币在国内发展趋势应该是跟着国际走，目前美国很多传统金融机构已经可以合规买入比特币了，中国这方面恐怕还很遥远。


    ## 为什么跨国公司领导人多印度裔


    讲者：Sophia，新加坡国立大学博士，创新领导力中心（CCL）资深研究员。 Sophia 复旦大学毕业后，在新加坡国立大学读了博士，后来定居新加坡。她是我参加
    CCL 领导力培训班的导师，也是很多商界精英的领导力教练，特别擅长一对一的 Coaching。Sophia 的先生是印度裔，因此她对跨国公司多印度裔领导人的现象也颇有研究。


    时间： 2019 年 12 月


    大家晚上好，我的名字叫 Sophia，我现在主要是在做领导力发展相关的一些工作。我本科学的是经济学，读博士的时候学的是组织行为，这个算是应用心理学的一个分支，所以现在做的职业跟我学的背景也算是相关。除了在创新领导力中心做研究员，做咨询，做导师之外，我也是一个领导力教练。


    今天我选择的这个主题，其实也是挺有意思的事。当何老师问我你能不能分享一个关于领导力的东西，我想到你们以前这个群里的主题都挺有意思的。就自信奋勇的说，要不我来聊一聊，我对中印领导力的一个小小的感悟吧。


    这里面其实有多重的原因。首先我对领导力这个课题本身很有兴趣，其次何老师在简介里也有提到我的先生是一个印度人，我在家庭方面跟印度人有所接触。再有一个就是我从中国来到新加坡已经有
    15 年了，新加坡是一个多种族的地方，我在这 15 年中，也接触到很多的印度人，包括我的同事和上司都很多。在这个过程中我有一些比较有意思的观察和发现，想从领导力的角度跟大家分享一下。


    近几年来我们也发现，印度人似乎越来越多的做到了全球企业高管的位置，尤其是硅谷印度人越来越多。我们再放眼去看，很多商学院的院长现在都是印度人。


    关于这个现象，我在 2014 年的时候就写过一篇文章。五年过去了，我发现关于这个课题的讨论，尤其是凭什么中国人不如印度人这样的讨论越来越多，观点也很多，切入点也很多，我觉得这个很好，各家长长。


    我个人从领导力的角度来看，觉得有一些想法，跟五年前还是一致的，但


    也有一些更新和变化。所以今天借此机会跟大家做一个小小的分享，算是抛砖引玉，大家有什么想法也欢迎讨论。


    首先我想说的是，中国跟印度这两个国家都算是亚洲最大的国家，有很多 的相似之处，包括悠久的历史，根深蒂固的传统，都很相似。还有一点我也想 强调的，就是因为国家大，所以它其实是很复杂很多样的，希望我今天讲完之
    后，我们不带任何固有的刻板印象去看待印度。因为中间的各种社会层面实在 是太复杂了，我们只能截取其中一小部分，作为我们的切入点到来观察。


    这一小部分就是印度的中产阶级。如果我们去看在硅谷做到 CEO 的这些 人，去看他们的家庭背景，其实很多都是中产阶级。


    大家也知道印度是有等级制度的。这个等级制度现在已经没有以前那么的 界限鲜明了，已经开始模糊化了。它主要是分成四个等级，第一等级的是牧 师、僧侣；第二等级的是武士；第三等级的是商人，最后一个等级是不可接触
    的人。


    印度最大的分层就是前三层和后面一层之间的区别。所以现在我们看到的 比较精英的这部分印度人，一般是属于前面三层。但是，最下层的人们也 开始有崭露头角，因为印度政府也出台了很多的政策，包括在著名的印度理工
    学院里面给他们保留一些位置，来保证这些人接受平等教育的机会。在我认识 的圈子里也有从那个等级出来的，但是目前来看，我觉得能在大型的国际企业 做到很高的这些人，大多数还是印度的中产阶级。


    为什么我们中国人特别喜欢跟印度人做一个比较。这是因为当把这一撮的 印度精英，中产精英，和同样的一批中国人来做比较的时候，我们会发现有很 多的相似之处。比如，这两圈的人都是从本国开始接受精英教育，通过万人过
    独木桥的方式，上了最好的大学，然后出国，通过教育这种途径到了美国。


    到了美国之后，要成为一个好的员工，最重要的两个条件是什么。一个是 勤奋，一个是聪颖的资质，从这两点来讲，这两圈的人都有。能到美国硅谷的 印度人和能上美国名校的中国人都是够聪明，够勤奋的。正是因为有这样一些
    很重要的相似点，我觉得我们中国人才经常会反思，为什么同样是精英教育出 来的，通过自己勤奋努力出来的，印度人现在越来越多的做到 CEO 的级别了。 中国人有做到吗，其实也不是完全没有人做到
    CEO，有一些中国人在硅谷也做

    '
  mdcn: '

    实际上如果它具备了稀缺性，也具备了护城河，具备了公司管理方面或者其他技术方面的领先优势的话，那它必然也会具有垄断性。一般来说会体现在公司规模比较大，它是行业的龙头品种，它可能不是碾压级别的存在，但是至少它是一个巨无霸，提到这个行业我们都知道它的存在。比如像茅台，苹果，腾讯，阿里这样的企业，以上讲的三点的情况，它们都是符合的。这个就是优中取优，价值投资定义第二点。


    总结归纳一下价值投资的定义。我们赚的是一个公司未来成长的钱，我们判断这家公司或者说这个产品，它是具有价值投资要求的。它在未来会获得一个大的价值成长，而具体成长多少我们很难判断，也许是
    5 倍，也许是 10 倍，也许是 100 倍，这个我们很难去精确估算，但我们基于对它基本面的严格判断，认定了它未来会成长。


    另外我们买的时候在短期价格波动这方面会吃一点亏，比如你是 3 块钱买的，他是 5 块钱买的，这个我们肯定做不了那么专业买到最低点。但是从长远来看，它能涨到
    100 块钱的时候，你 3 块还是 5 块买，其实是一样的。


    同时我们选择的价值投资的标的应是非常优秀的，是非常少的。市面上大部分的投资品种，我们都应该过滤掉，我觉得只有这样才能符合真正价值投资的定义。因为不可能什么公司，什么产品都是价值投资。市面上真正的好公司肯定是少之又少，这个定律是不会错的。所以基于这两点，我们看的是长远，追求的是远期的利益。其次，价值投资定义的时间，至少是以年为例级的投资，我买了之后不会短期买卖，就像房子一样，流动性很差，你不可能今天买，明天卖。


    回到刚才说的第一项里头为什么房地产投资是中国最近 20 年时间最成功的价值投资呢，就是因为房地产的流动性比较差，它不可能短期买卖。你自己的一栋房子持有五年、十年的时候，实际上就吃到了这一波经济成长红利，避免了短线干扰和短线的波动。所以我们在做价值投资的时候，即使这个投资标的不是房产，也要有一个长期的思路和规划。一个行业的经济景气周期或者说一个公司的成长周期，绝对不会是以月为单位，不可能几个月就结束了。我看好一个东西，看好一个产品，它必然是后面三年五年甚至十年，有很好的发展，那理论上来讲，我就要持有这么长时间，去吃到它的一个完整的成长空间。


    ## 第三部分 价值投资的实践


    价值投资的实践也是因人而异的，在这里我只能讲我自己的情况。首先要找到自己的能力圈，这个是非常重要的。你要先知道自己对什么不了解，自己对什么不擅长，什么是我理解不了的。比如你自己处在苹果产业链的其中一个行业，在行业链条的某一端，那你自然会对这个行业，对这个生态，对苹果产业链有一个至少比圈外人更明确的认识，那这个就是你的优势。我们要发挥自身的优势，去找自己所在行业的机会，或者你身边的朋友、亲人，在某个行业里做了很多年，你现在想了解这个行业了，你去跟他交流，那你就具有这个行业的信息优势。


    所以在做价值投资的时候，一定要发挥自身的优势，扬长避短。你不了解的行业，完全不懂的东西，坚决不能去碰。


    比如科大讯飞语音识别技术很牛，但我不懂，完全是个门外汉，对这个行业确实不了解，而且又觉得这个专业门槛比较高，想请教身边的朋友，他们也没有懂的，那这种情况就坚决不能碰，直接忽略。


    我们在生活中尽量去找自己能够理解或者跟自己工作比较接近的一个行业去做研究，这样就是最好的。例如有的人刚好就是做智能语音行业的，那你在研究科大讯飞的时候自然就会比别人更加有优势。所以我想表达的就是不懂的行业或公司不要去碰，找你自已了解的行业。


    如果在一个行业里你具备信息优势渠道，但确实没有什么值得投资的标的，行业是夕阳行业，这个行业在走下坡路，这个时候怎么办呢。出现这种情况也很正常，这种情况之下，我觉得也依然要遵循一个原则，还是找自己身边的公司。


    这个怎么理解呢，就是说一个公司或者一个产品，它的业务逻辑越简单越好，这种就是可以作为考虑的目标，千万不要去选那些业务很复杂，你自己试图去理解，但是根本理解不了的。


    再回到苹果手机的例子，这个就很容易理解，因为你身边的人都在用，你自己也在用，你明确感觉到 iOS 从体验上确实要比安卓要强一些。在这种情况下，你首先就对这个产品有一个直观的了解，而且它的业务逻辑是非常简单的，你明确的知道苹果只要出新产品就会卖的很火，并且它的这个
    iOS 操作系统的独立性，整个生态系统构建的非常好，活跃开发者也非常多，不断会很多的创意在里面。那种产品的业务逻辑，我觉得即使你不处在这个行业，你也能很明确的了解。或者你对啤酒有很深的了解，那对白酒或者红酒行业你自然也会有一个直观的感受，这个其实也是可以的。


    当你对一个产品，对一个业务有自己的逻辑能够去理解它，那这个就是你最坚实的基础。千万不要觉得那些在新闻中天花乱坠报道的什么云计算，AR、大数据这些都是好的，感觉这个就是未来的方向。云计算这些东西我们不了解那就直接放弃，不然在不懂的情况下去投资它，可能就会吃大亏的。


    如果云计算这些东西你是行业内人士，你能理解，那自然是最好，理解不了，站在局外人的角度看看就好了。所以我们还是尽可能踏踏实实找一些身边的业务，哪怕你是买一个你每天都要用的洗手液。你就知道牌子好，你们所在的地区这个牌子的洗手液永远不愁卖不掉。那你这个朴素的逻辑，都要比去投那些不懂的云计算强的多。


    - 第二点，要具备一定的投资知识。


    比如你可能不是财务专业的，但是上市公司的一些基本的财务知识，例如现金、利润、资产、负债等这些基础的概念要懂，这个是必须要懂的。不管你是什幺行业，什幺背景，都要学习这些基本的知识。另外还要有一个比较强大的逻辑分析能力，因为很多时候做一些调研，在寻找公司的过程中是需要
    的。因为得做对比、做分析，用排除法把一些负面的东西证实或者证伪，是要用逻辑来排查的。


    所以我觉得对自己逻辑方面的训练，也需要不断加强，至少要有怀疑精神，媒体给你展现出来的，或者说你接触到的一手的信息，它有时可能是有误 导在里面的，也可能是一些潜在的失误，这些东西都要靠自己去了解，去发
    现。财务知识加上逻辑的训练都是必不可少的。


    - 第三点要建立一个交易系统和纠错的机制。


    交易系统很复杂，在这里没法展开讲，简单点说就是我们要知道一个再好 的标的，它短期也会有价格波动。虽然我们没法精确的去预测和控制，但是 理论上讲，你三块钱买肯定会比五块钱买要好，虽然从长远来讲可能不会差
    太多。但在实际交易的时候，你肯定还是要寻求尽可能的低位买入，这个用术语来讲就是要寻找安全边际。也就是说，你知道这个公司它值 10 块钱，但有时你可以用五块钱的打折价格来买入，如果你是
    12 块钱或者 13 块钱买的，从长期来看也是能接受的，但是它会耗掉你更多的利润和时间成本。所以我们尽可能的要寻找一个合理估值，在合理估值价格之下买入。


    那怎么去寻找一个标的的安全边际，或者说找一个低位买入的机会，这个牵扯的因素很多，今天就没法展开讲，这里只能简单提一下，如果感兴趣的话，可以找这样的书看或者去网上找相应的资料，应有尽有。


    另外我们要知道每个人都有自己的局限性，都有自己的认知偏差，都存在认知方面的盲点。不论你有多强的专业能力，即使你就是这个行业内的人，都存在这种情况。


    比如马化腾在 QQ 刚成立的时候，一度也想把公司卖掉，其实他自己心里也没底，公司后面会发展的怎么样，并且我们也看到马化腾最近几年都有卖出腾讯公司的股票，而他基本上每次卖都是卖在最低点，例如他
    180 块港币卖，卖完了之后可能半年就涨到了 280 港币。这就说明了，其实每个人都是有认知的盲点，当然这么讲可能不太严谨。因为世界的发展，或者说很多行业的发展，其实是一个非常复杂的系统，它的复杂程度是远远超过人脑的分析判断和计算能力的。所以我们不必苛求这一点。世界是不断在动态变化的，一定要深刻认识到这一点，你自己再牛逼，你的认知都是有局限的，所以我们在认知的基础上设定资金管理就非常重要。你再看好这个标的，也不能去梭哈，甚至于贷款上杠杆操作，这就很危险。


    资金管理实际上在很多的方面都需要用到，这里也不展开讲了，而这又是一个很大的话题，正好今天公司公众号发了一篇《中产家庭资产如何配置》(https://mp.weixin.qq.com/s/hT61KlsFymOF9gBEmv2blw)，文章里面有讲到资金管理问题，大家也可以看一下作为参考。


    - 第四点就是止损和退出的机制。


    比如有一家公司，你当初可能做了很久的研究，也确实觉得好，而且理论也是正确的，只是因为后面事态的发展或行业的变化，导致投资失败了。有些东西是我们预料不到的，也没有办法。就像诺基亚当年破产的时候，诺基亚总裁也讲了一句很伤感的话，他说：“我们并没有做错什么，但不知为什么我们输了”。没办法，很多事情都是这样，可能你做的是正确的，但结果却不好，这在生活中也经常发生。


    通过各方面的努力分析，大量的调研考察，我们可以把成功率提高到了90%，虽然有 90%的成功率，但还有 10%的失败概率，当你遇到了怎么办。那最终要有一个纠错退出机制，也就是我承认这个事情失败了，这个投资标的看来是不会有什么好的发展前景了，这种情况我们就只能退出。当然这个过程会很困难，只能靠自己去克服了。


    并且因为我们之前已经有做资金管理，所以单个标的投资失败，对个体或家庭的损失不会太大，危害也不会太大，所以把资金管理做好，纠错的心理机制调整好，我想应该也没有什么太大的问题。以上就是我讲的第三部分，关于价值投资的实践。


    那最后一部分，我简单讲一下，我个人的价值投资心得。


    接下来我说一下我投资比特币的过程。


    我是 2012 年秋天，通过一个朋友知道比特币的，我朋友对密码学比较感兴趣，所以他很早就知道比特币了。我知道比特币的时候，它的价格是 10 美金左右，换算成人民币是
    70 块钱左右。


    我刚了解到比特币的时候，第一感觉就是不靠谱，感觉有点类似传销，说好听一点就是类似像 QQ 币这种东西，类似像游戏里面的那种虚拟货币。我当时觉得这个应该没什么价值，因为我也玩过网络游戏，也有了解很多这种虚拟的货币，认为它长期来看一定会贬值的，也不会有什么好的发展空间。在这之后也没有太多的关注，只是知道了而已。


    在 2013 年春天的时候，塞浦路斯发生了一个很大的危机，金融危机过后，比特币就狂涨了一波。


    后来我发现价格已经涨了 100 多美金了，涨了十倍，所以我就觉得要花点时间了解这个东西到底怎么回事。


    之后就逐渐找一些资料去研究，到了 2013 年的秋天比特币又疯狂涨了一波，当时最高的时候涨到了 1000 美金，换算成人民币就是 7000 块钱。后来央行和五部委发通知遏制炒币，然后价格开始跌下来了。


    我在这个过程中一直没有买，因为当时还看不懂，对它还是有很多疑虑，有很多东西没想明白。因此也没有去炒币，只是一直在做研究，去看各种分析的文章，看这个行业的相关新闻，跟靠近这个行业的朋友去聊。能搜索到的资讯，都尽可能去看，去研究，去做一些自己的分析。


    之后到 2014 年，发现比特币就慢慢步入熊市，价格慢慢跌到了 5000 人民币，3000 人民币，然后 2015 年的时候最低跌到 1000 块钱人民币左右，那时候这个行业感觉要崩盘，当时很多矿工都支持不下去了，市场一片哀嚎。


    这时我分析研究比特币已经一年多时间了，我知道比特币已经有两年多的时间了，我觉得这个时候是买入的机会，所以在 2015 年从人民币 1500 元至 5000
    元这个区间，我都有买。买的理由就是看好它的长期发展，并且我认为这个是需要持有很长时间，可能十年甚至更长，一直到现在我都在持有，中间的波动也非常大，最高的时候可能涨到
    15 万，最低的时候有跌到 3 万。但你不可能把所有的钱都赚到，你看好它的长远发展，过程中的这些代价只能是忍受。以上就是我买卖比特币的过程。


    下面我讲一下，我当时之所以下定决心比特币值得投资，主要原因有这么几点：


    - 第一，经过长期的研究之后，我认为比特币，它是有实际的支付刚需的，也就是说它的应用场景非常之硬。简单讲就是每一年跨境转移的资金需求是非常庞大的，这一块资金转移的成本比较高。比如国际汇款这些正常途径的费用是非常之高的，而利用比特币进行跨境转移资金是可以的，就这一个需求其实就已经能够产生可能数百亿美金。


    除了跨境支付，还有很多不是那么光明正大的需求。比如说洗钱，一些地下产业，包括一些匿名支付，有些人他可能不喜欢走银行，喜欢走现金。所以当时从这点出发，我认为比特币不是一个空中楼阁的东西，它是有实实实在在在的支付方面的刚需和一个很强的应用场景，这些只是一部分，其实还有很多，这里不一一展开了。


    - 第二点它是有价值共识的。


    为什么在 2015 年的时候我敢买，刚知道的时候不敢买，很大程度也是因为此。2012 年的时候比特币虽然便宜，但实际上它的价值很脆弱，就是了解它的人少，用户规模也不在一个数量级，几万人和几百万人是不可同日而语的。之前除了在币圈的一部分死忠粉之外，圈外的人很少知道比特币，但经过几年的发展，很多人也开始慢慢了解了，包括很多的金融机构，我国央行在
    2014 年就已经开始研究数字货币了。所以经过几年的发展，它的价值共识已经形成了，当大家形成了共识它就有价值，如果没有共识的话，这个东西就会很脆弱。


    买的时候虽然牺牲掉一部分价格上的利润，但是在那个时间点介入，它价值共识的支撑也比两年前要强的多，风险和利润都是对等的，高风险高利润，利润少风险也低了。所以我在当时觉得值得买入时，就认为它已经形成价值共识了。


    - 第三点就是技术领先。


    从密码学的角度，包括从区块链本身的底层技术的角度考虑，它去中心化、天然匿名、安全性等等，这些都做的非常好。而且比特币已经有很多年了，该有的问题、漏洞，通通证伪了，没有一个能够颠覆它。虽然有些交易所跑路，但那跟比特币本身没有关系。


    所以白皮书里面讲的那些东西它都实现了，并且也没有出现安全上的问题，在五年之后的今天再来看，依然没有问题。比特币已经存在十年了，网络很安全，即使是断网，出现一些大的问题，因为是去中心化的，它也不会被摧毁，它的安全性、匿名性这些都经受住时间的各种考验了，这也是我当时觉得值得投入的一个很重要的原因。它刚出来的时候，婴儿期投会很不稳定，在幼儿期去投，就好很多了，它夭折的概率就远远小的多。站在现在再回头看，当时的这个判断还是正确的，这几点依然是成立的。


    注：上文中提到的白皮书指中本聪在 2008 年发表的一篇题为《比特币：一种点对点的电子现金系统》，史称“比特币白皮书”。


    链接如下:http://www.bitcpapers.com/


    【全文完】


    问答：


    星友：您认为现在没有比特币的普通人，也没时间研究，应该采取什么策略？是否应该少量长期持有？


    答：还是先研究，如果感兴趣，花些时间去了解，这样你才能真正心中有数，做到长期持有。比如我今天说了说，明天谁说了说，你觉得这东西可能好，但没想明白，后面即使买了，一个波动就下车了，也许就没有赚多少钱。


    当然如果你说放个人总资产 1%甚至更少的钱，一点点进去，长期持有，应该问题也不大，但就有点不痛不痒了。


    星友：在国家目前大力倡导推广研究发展区块链技术的当前，会对比特币在国内的发展有什么影响？未来比特币在国内的趋势又会是怎样？


    答：国家大力推进研究的主要是央行数字货币和它的应用领域，和比特币关系不大，有点井水不犯河水的意思。未来比特币在国内发展趋势应该是跟着国际走，目前美国很多传统金融机构已经可以合规买入比特币了，中国这方面恐怕还很遥远。


    ## 为什么跨国公司领导人多印度裔


    讲者：Sophia，新加坡国立大学博士，创新领导力中心（CCL）资深研究员。 Sophia 复旦大学毕业后，在新加坡国立大学读了博士，后来定居新加坡。她是我参加
    CCL 领导力培训班的导师，也是很多商界精英的领导力教练，特别擅长一对一的 Coaching。Sophia 的先生是印度裔，因此她对跨国公司多印度裔领导人的现象也颇有研究。


    时间： 2019 年 12 月


    大家晚上好，我的名字叫 Sophia，我现在主要是在做领导力发展相关的一些工作。我本科学的是经济学，读博士的时候学的是组织行为，这个算是应用心理学的一个分支，所以现在做的职业跟我学的背景也算是相关。除了在创新领导力中心做研究员，做咨询，做导师之外，我也是一个领导力教练。


    今天我选择的这个主题，其实也是挺有意思的事。当何老师问我你能不能分享一个关于领导力的东西，我想到你们以前这个群里的主题都挺有意思的。就自信奋勇的说，要不我来聊一聊，我对中印领导力的一个小小的感悟吧。


    这里面其实有多重的原因。首先我对领导力这个课题本身很有兴趣，其次何老师在简介里也有提到我的先生是一个印度人，我在家庭方面跟印度人有所接触。再有一个就是我从中国来到新加坡已经有
    15 年了，新加坡是一个多种族的地方，我在这 15 年中，也接触到很多的印度人，包括我的同事和上司都很多。在这个过程中我有一些比较有意思的观察和发现，想从领导力的角度跟大家分享一下。


    近几年来我们也发现，印度人似乎越来越多的做到了全球企业高管的位置，尤其是硅谷印度人越来越多。我们再放眼去看，很多商学院的院长现在都是印度人。


    关于这个现象，我在 2014 年的时候就写过一篇文章。五年过去了，我发现关于这个课题的讨论，尤其是凭什么中国人不如印度人这样的讨论越来越多，观点也很多，切入点也很多，我觉得这个很好，各家长长。


    我个人从领导力的角度来看，觉得有一些想法，跟五年前还是一致的，但


    也有一些更新和变化。所以今天借此机会跟大家做一个小小的分享，算是抛砖引玉，大家有什么想法也欢迎讨论。


    首先我想说的是，中国跟印度这两个国家都算是亚洲最大的国家，有很多 的相似之处，包括悠久的历史，根深蒂固的传统，都很相似。还有一点我也想 强调的，就是因为国家大，所以它其实是很复杂很多样的，希望我今天讲完之
    后，我们不带任何固有的刻板印象去看待印度。因为中间的各种社会层面实在 是太复杂了，我们只能截取其中一小部分，作为我们的切入点到来观察。


    这一小部分就是印度的中产阶级。如果我们去看在硅谷做到 CEO 的这些 人，去看他们的家庭背景，其实很多都是中产阶级。


    大家也知道印度是有等级制度的。这个等级制度现在已经没有以前那么的 界限鲜明了，已经开始模糊化了。它主要是分成四个等级，第一等级的是牧 师、僧侣；第二等级的是武士；第三等级的是商人，最后一个等级是不可接触
    的人。


    印度最大的分层就是前三层和后面一层之间的区别。所以现在我们看到的 比较精英的这部分印度人，一般是属于前面三层。但是，最下层的人们也 开始有崭露头角，因为印度政府也出台了很多的政策，包括在著名的印度理工
    学院里面给他们保留一些位置，来保证这些人接受平等教育的机会。在我认识 的圈子里也有从那个等级出来的，但是目前来看，我觉得能在大型的国际企业 做到很高的这些人，大多数还是印度的中产阶级。


    为什么我们中国人特别喜欢跟印度人做一个比较。这是因为当把这一撮的 印度精英，中产精英，和同样的一批中国人来做比较的时候，我们会发现有很 多的相似之处。比如，这两圈的人都是从本国开始接受精英教育，通过万人过
    独木桥的方式，上了最好的大学，然后出国，通过教育这种途径到了美国。


    到了美国之后，要成为一个好的员工，最重要的两个条件是什么。一个是 勤奋，一个是聪颖的资质，从这两点来讲，这两圈的人都有。能到美国硅谷的 印度人和能上美国名校的中国人都是够聪明，够勤奋的。正是因为有这样一些
    很重要的相似点，我觉得我们中国人才经常会反思，为什么同样是精英教育出 来的，通过自己勤奋努力出来的，印度人现在越来越多的做到 CEO 的级别了。 中国人有做到吗，其实也不是完全没有人做到
    CEO，有一些中国人在硅谷也做

    '
