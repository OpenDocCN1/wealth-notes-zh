    心这一起话题的朋友，可能大多是一些有创业想法或刚开始创业的逐浪者，以我的一些经验和浅见，主要介绍一些在种子轮和天使轮投资人比较在意的点。


    # ## 一、核心创始人的资本号召力


    任何一个创业项目都有其核心创始人，没有核心创始人的项目一般不会考虑，缺少“带头大哥”，迟早因意见或利益纷争作鸟兽散。而核心创始人应该具备哪些素质或特点，会更为投资方青眯内，这种让投资方青眯，愿意投钱，甚至欲罢不能的能力我将之概括为“资本号召力”。


    这种能力包含专业能力、职业资历和投入精力。专业能力是能做事的基础能力，职业资历是具有把事做好的实践证明，投入精力是能把未来事做好的基本保证。种子轮和天使轮的投资项目基本上属于科技创新类项目，当你拿着一个
    idea 或 BP 去找投资人时，你的专业背景将作为权重很大的考量要素。出身著名高校的顶级专业，比如清华、MIT、UCLA、斯坦福等高校的王牌专业，师从该领域学术大牛或奠基从事过科学研究，在著名企业的研究所从事过科研工作等这些专业能力会成为敲开投资人大门的敲门砖。比如专注种子轮和天使轮的真格基金创始人徐小平就说过，只要是斯坦福毕业的团队他都投。当然学术大牛创业失败的案例更多，靠着各种学术头衔和顶级论文，初期拉到巨额资金的初创企业不少，但是学者型创业者往往缺少企业运营和商业经验，导致在公司的成长期半路夭折。


    专业能力是做事情的基础能力，很重要。但是越来越多的投资人更看重创业者的职业资历，顶尖公司中高层的职业经历是最好的投资背书。国内的 BATJ、美国的 GAFA
    总监级别的人出来创业，投资人会拿钱堆在你门口，甚至很多投资人会各种勾引这些人出来创业。这些高层级的资深人士具有不可估量的资本号召力。并不一定他们就能创业成功，可是只要他们出来，种子轮、天使轮的钱投出去了，后面自然会有接盘侠，项目成不成功不重要，重要的是最早投资的人可以拿钱退出就行。所以有创业想法的朋友，如果你的技术过硬但是专业出身又不是那么光鲜亮丽，缺乏一定的资本号召力，不妨先去一家顶级公司历练历练，提升自己的技术、管理、商业运营、行业人脉等资本号召力，在出来创业可能会更容易拿到投资。


    投入精力是创业者未来能把项目做好的基本保障。这个要素很难在路演或'
  - '[PAGE 46]


    会谈的情况下做出判断，所以投资方一般会对项目进行尽调。种子轮的尽调一般会通过对核心创始人的同事、同学、之前的领导、合作伙伴等进行约谈，以更真实的了解其过往经历、做事方式态度等。天使轮一般已经有了团队或较为正式的公司组织，这是后投资人入驻公司进行尽调是最好的了解核心创始人的方式。总之，再牛的技术，再好的出身背景，如果不是一个全心全意的创业者，项目也很难成功。有的创业者，在找投资人时会承诺拿到投资就辞职出来全身创业，但是拿到钱后却犹豫不决，或者即使辞职了也不能全力投入，三天打鱼两天晒网，这样的案例也很多，当然有一次这样的黑历史，就会被投资圈拉入黑名单。


    还有核心创始人的领导力包括自信力、他信力、执行力；人品力涵盖信用力、凝聚力等此处就不多赘述了。


    # 二、创业团队的“合力（理）”构成


    创业是团队行为，一个人是个休户。在透视一个创业团队时，最重要的是看三点，其一是共同愿景，其二是能力构成，其三是股权结构。


    # （一）共同愿景


    共同愿景，说直白一些就是创业团队基于共同的创业平台，各自想要实现的理想的趋同性。这种趋同性越高，企业的愿景就越真实，创业团队在企业的生命周期内会一起走的更长久；趋同性越低，企业的愿景就越虚假，创业团队会因利益分配、理念不一等越早的分崩离析。比如阿里在创业初期就定下了宏大的企业愿景——让天下没有难做的生意，而且创始人团队都高度认同，所以在阿里的生命周期内，18罗汉还是一起走了较长的一段路。也有的团队就是为了赚到自己的第一桶金，所以在融资和估值较好的情况下将股权卖出，退出项目，大家各有所得，这也是好的结局。就怕有的人理想远大，想要做一个伟大的企业，实现某方面宏伟的愿景，但是有些人只是设定了一个数字，当估值到那个数字之后就要退出，这时候就会导致团队分裂，项目难以进一步进行，同时也影响项目的估值。


    所以打算创业或在路上的朋友，跟创始团队一定要谈透。能够达成一致或趋同的共同愿景最好，如果不然也要了解每个人的想法，做到有备无患，按节奏退出。'
  - '[PAGE 47]


    # （二）能力构成


    无论是技术大牛还是运营精英，谁都不是万金油，更不可能像八爪鱼一样抓住企业的各个条线。所以在种子轮时就要有搭建团队的远见，在天使轮时就要有公司运作的组织能力。天使轮的时候，技术大牛的核心创始人一定要找一位可以匹配的
    BD，解决项目的商业运作和发展问题，自己就可以专心做产品研发；而运营精英的核心创始人就一定要找到 CPO 或 CTO，要实现自己想要推出的产品，要不然再好的
    idea 也是纸上画饼。


    在天使轮就要有相对完整的公司架构，COO、CMO、HR、GR 或者 PR 等，各条线部门组建要完成，当然最重要的就是找到各条线的主将，用人做事，让他们去发挥专业和经验，快速组建能够打仗的实用部门。在天使轮，投资人会
    对公司进行尽调，各部门负责人是资历能力是很重要的考量要素。


    # （三）股权结构


    种子轮、天使轮的投资者介入项目最早，考虑到团队稳定性以及未来的融资和退出计划，会很看重股权占比问题。而这往往是核心创始人容易忽视或不懂的关键问题。对于有潜力的项目，投资者往往会协助创业团队搭建股权结构。以下是一些建议：


    +   1、股权结构的关键因素


    （1）创业团队要保持对公司的控制权。公司的控制权主要是以股权为基础的，这是《公司法》等法律的赋予股东的权力，在此不赘述。一般情况下，持有公司 50%以上股份的股东可以保持对公司控制权，处于绝对控股地位。持有三分之一以上股份的股东可以保持对特别重大事项的否决权，如其为第一大股东且公司股权比较分散，则可认为处于相对控股地位。所以创业团队的股权不宜过于分散，核心创始人应保持对公司控制权的股份占比。投资人才会预判公司会按照核心创始人或创始团队的计划发展下去，而不是经常变动或失控。


    （2）创业团队在股份份额上要体现价值性和积极性。种子轮和天使轮的创业公司，对创始团队依赖很大，企业价值约等于于创业团队的劳动价值。如果经过 ABCD 几轮融资后，创始团队股权比例会因稀释而过低，致使创始团队将无从等价的享受企业成长而带来的股权增值的收益，创业者变成了打工者，老板变成了职业经理人，这种情况轻则影响创始人积极性，导致团队士气低下，重'
  - '[PAGE 48]


    则可能导致创始团队将公司利益往体外转移。因此，从利于公司长远发展考虑，创始团队的股权比例不宜过度稀释。


    （3）克服一顿吃饱心态，为企业持续融资预留空间。创业公司一般会经过天使投资、VC、PE、IPO、上市后增发等几个阶段股权稀释过程。有时出于价值变现等原因，创业团队还会主动减持部分股份。对于初期现金流较好的项目，不需要持续投资，一般只经历其中一轮或几轮的股权稀释。但对于需要长期砸钱的项目，以在每一轮拿到投资（弹药）的时候也就意味着要稀释自己的股权。因此，天使投资阶段，创始团队在设计股权结构的时候需考虑公司的长期资金规划，为后续融资预留空间。


    （4）两种方式保持创业团队对公司的控制权。为保持创业团队对公司控制权，调动创业团队的积极性，建议创业团队经各轮稀释或主动减持后仍保持第一大股东地位且持有股份比例超过三分之一，以保持相对控股地位。因此，在IPO前，如果不能采取差别股权制度，建议创始股东的持股比例最好不低于50%，这样经过IPO的稀释（一般10-25%）、上市后增发的稀释和主动部分减持后，创业股东的股份比例仍有可能保持在三分之一以上，保持相对控股地位。当然，上市以后，随着股权的逐步分散，也可以适当降低比例。


    近年，越来越多的创业公司试图尝试差别股权制度，港交所在推出的创新板咨询文件中，也提出了推广差别股权制度的设想，差别股权制度有助于既保持创业团队的控制权，同时又能够还满足不同发展阶段融资转让股份的要求。


    具体来说，对于需要较长时间持续大笔资金投入的公司，IPO前要保持50%以上股权比例预计将有难度，为保持创业团队在持续融资后对公司的控制权，可考虑采用同股不同权的“双重投票权制度”（AB股模式），即将股票分为A、B两个系列，其中对外部投资者发行的A系列普通股有1票投票权，而管理层持有的B系列普通股每股则有N票（通常为10-20票）投票权。目前采取AB结构的公司A股上市存在障碍，香港交易所在考虑推出面对新经济公司的创新板，美国允许这种情况，这就是为什么阿里选择在美国上市的原因，如果将来有可能在这方面有所突破，有利于这类新经济公司的上市和发展。


    天使投资阶段，为保持创业团队在后续融资后继续保持对公司的控制权、避免委托代理问题并为后续加入的员工预留股份，建议在满足公司资金需求情'
  - '[PAGE 49]


    况下，尽量少出让股份，天使投资占股份比例最好在 10%~20%之间，最高不要超过 30%。


    总之。在天使投资阶段，合理的股权结构有利于创业项目和团队未来的发展。因此，股权结构的设计问题，需要创业者慎重思考。


    # 三、所在行业的发展前景


    一般能打动投资者，吸引可观投资的项目，一定属于具有较大发展空间及广阔发展前景的产业，这些行业或是新兴朝阳产业，或是得到政策倾斜，具有较大发展潜力及盈利空间。


    # （一）战略新兴产业


    战略新兴产业是包括新一代信息技术、生物产业、节能环保产业、高端制造等产业在内的以重大技术突破和重大发展需求为基础、且对经济社会全局和长远发展具有重大引领带动作用的产业。这些新兴产业的共同特点是知识技术密集、物质资源消耗少、成长潜力大以及综合效益好。从十八大以来，国家持续从政策、资金等方面加大对战略性新兴产业的支持力度，新一代信息技术、新能源、新材料等领域也不断取得突破，战略性新兴产业的市场空间和应用范围日益扩展，发展势头整体向好。


    # （二）战略支持产业


    创业者在考虑创业时，应选择相对容易的且发展势头向上的产业进入，尤其是能获得政策倾斜的战略支持行业，这些行业往往也更容易受到资本的青睞，比如大健康、生物制造、大消费等都属于这个范畴。以大消费产业为例，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。在大消费里主要行业诸如：食品饮料、休闲娱乐、养老、医疗等行业出现了明显的消费升级趋势。同时，在
    GDP 的三驾马车中投资领域因杠杆率过高而增速逐年下降，出口领域因贸易问题逐渐受阻时，唯有消费领域对 GDP 的影响逐年日升，目前已超 60%。在 7 月底刚刚举行的政治局会议中，也将扩大内需作为重中之重。随着国家持续政策支持，以及消费升级趋势下，大消费发展前景广阔，而且投资者也往往更愿意在这一领域进行投资。


    # 四、产品的商业价值


    投资人在考虑投资时，一定会先衡量所投产品是否有商业价值，是否能'
  - '[PAGE 50]


    资本创造价值从而获取利润，我们可能会在网上看到这样的消息：很多的创业公司，他们的产品做得还不错，但是市场的接受度不高，产品没办法变现，也没法获得资本的青睐。所以创业者在做任何产品之前，都应该问自己一个问题：我们的用户价值是什么，我们的商业盈利模式是怎样的，这两个问题想清楚了，产品的商业价值才能迎刃而解。


    # （一）用户价值


    在开发设计产品的时候，首先要思考产品的用户（客户）是谁？产品只有通过服务这些用户、满足目标用户的基本需求后才能实现用户价值。比如开发一款新的电商 APP，对于同样的产品，用户凭什么不在大的电商平台购买而在你的平台购买？你的价格更加优惠？你平台销售的产品质量更有保障？物流更加快速？售后服务更贴心？或是你的
    APP 体验相当出色？一款产品必须找准客户定位，同时能实现用户价值，让用户觉得使用的很愉快，这是产品需要去做的第一步。


    # （二）商业盈利模式


    创业者设计的产品终究是要创造价值的，在过了“客户关”后，要考虑的就是市场和资本认不认可你，也就是通过什么方式或模式，将产品的价值商业化。


    比如大家比较熟悉的陌陌，陌陌作为一个社交平台一开始是做会员的，但真正的最大收入，却是来自另外两个方面：一个是游戏，另一个就是直播，尤其是直播直接将最火的东西嫁接进来，并且让会员在约不到陌生人聊天时，可以在直播里消磨时间和金钱。


    回到上文所说的如果创业者要开发一个电商 APP，那在设定了目标用户且获得用户价值后，如何再进一步创造商业价值？如果是像天猫、京东这类平台型的电商，在吸引到流量后，如何将流量变现？这一方面可以好好研究一下微博，微博上的变现有很多，有广告有流量，还有自发的推广，比如现在我每发一个微博，它就会问我要不要推广，如果要推广，5000
    个人看到是多少钱，1000 个人看到是多少钱。


    总的来说，一个产品想要吸引可观的投资，并持续获得市场及资本的认可，那它必须是一个能创造用户价值、能盈利的具有商业价值的产品。'
  - '[PAGE 51]


    # 五、挑选合适的天使投资人


    对于创业者来说，在挑选投资人时做到知己知彼、了解投资人的状态，也很必要，合适的天使投资人一般会符合“眼缘好”、“聊得来”、“能帮忙”三项。


    眼缘好，指的是创业者与投资人相互间是否能留下较好的“第一印象”，在一些基本选拔条件上是否契合。比如领隆投资的蔡文胜更倾向于投资学历不高、“草根”出生的创业者，而真格基金的徐小平则说只要是斯坦福毕业的团队他
    都投。了解投资者的基本情况及喜好，筛选为投契的投资者，可能会使融资过程“更容易”。


    聊得来，指的是在寻找天使投资人时要尽量挑选价值观趋同、有共同目标的投资者，这样沟通及合作起来能更加事半功倍。


    能帮忙，指的是投资者不仅仅是能提供投资，同时还能在资源整合、产业链链接、产业并购、企业管理、发展理念等方面提供合理的建议及帮助，如果能获得这一类型投资者的青睐，无疑是收获了创业途中的一位良师益友。'
