- raw:
  - '[PAGE 110]


    可以玩儿，玩儿是孩子的天性，可以好好的玩儿，但是必须先做完作业。在孩子上学的第一学期绝对不能让他有什么坏习惯，比如说遮遮遛遛的，或者是低效率等等。因为一年级，二年级小学的时候课程不难，主要是学习习惯的培养。


    比如回到家里，第一件事情是先做作业，做完作业以后，所有的时间都是你的，你想怎么玩儿就怎么玩儿，这时候大人一定要说到做到。但是如果你作业没写完，那么你也玩不了，经过一学期的训练，孩子就已经养成了这个习惯。牧歌在学校包括上初中的时候，都会在学校争分夺秒的先把作业做完。因为他知道回到家以后，我们不干涉他，他作业做完了，剩下的时间都是他的，他可以自由支配，可以开心地玩儿。因此他对做作业从来都是把握的非常及时，不会拖拖拉拉的，不会像有的孩子一样，玩儿也没玩儿好，作业也没做好。


    最主要的是要孩子自己学，而不是我们陪着学，如果我们陪着学，这个过程是很痛苦的。此外，过了初中以后，孩子学的课程，实际上我们大人就跟不上了，理科的，英语的很多东西，甚至是语文。我本身学中文的，但是他的语文课，上了高中以后，很多题我是做不了的。所以说一定要让孩子自己学，高效率的学习，有一个良好的学习习惯。


    当然，在培养孩子学习能力和学习习惯的同时，大人需要有一点注意的。我告诉大家一个关于带孩子旅游的小技巧。


    如果我们打算带孩子旅行，那么就把他下学期的语文课本借来看，看一看下学期的语文课本里涉及到国内的哪些地方。比如讲到桂林山水，那么你就提前一学期先领他去桂林玩；讲北京，你也要提前一学期在寒假、暑假领他到北京玩。这样老师在讲这篇课文的时候，他去过了就会有一些感触，有一些感性的认识，他听起来和理解起来就会比其他人要深得多。


    还有一点就是提醒一下各位年轻的朋友，在小孩九岁之前，你领他出去玩要看人文景观而不是自然景观，我们觉得大自然是非常的奇妙。可是对于一个九岁以下的孩子来说，他是记不住的，他的欣赏能力和我们大人的是不一样的。因此，要带他看人文景观而不是自然景观。看人文景观的时候，我们提前做一些功课，可以给孩于以讲故事的形式来展现，这样的旅游效果就比较好。'
  - '[PAGE 111]


    上面是我讲的第一个问题就是学习能力和学习习惯的培养，只要坚持下来，就能达到事半功倍的效果。一旦让孩子有了很好的学习能力和优秀的学习习惯，那么在孩子求学路上，他越往后走，你会觉得你越轻松。


    # 第二点，关于亲子关系的养成。


    现在社会上的孩子大都是独生子女，大多数父母跟孩子的关系都是很亲密的。但我也见过很多失败的例子，不是说你对孩子付出多少，孩子就能够跟你有非常好的亲子关系。我们也见过很多跟父母关系不好的，确实是让人非常伤心。孩子的成长过程是不可逆的，很多错误是不能犯的，犯了以后甚至不给你纠正的机会。


    我们家的情况稍微有点特殊，因为我们是单亲家庭，在牧歌九岁的时候，我和他爸爸就离婚了。但以我现在对牧歌的观察，我觉得这个对牧歌的不良心理影响，相对来说是比较小的。孩子跟我和他爸爸都还是比较亲的，因为我不反对他跟爸爸亲热，这个血缘关系是割不断的，不能因为我跟他爸爸关系不好，或者我们分开了，就让孩子去恨一个人。因此，亲子关系不要跟对方争夺，更不要去比。


    另外我还想说的一点是，比如像我这种单亲家庭，我是一个妈妈带着儿子。很多人就担心妈妈跟孩子特别亲热，会不会以后让孩子的心理有影响，有些恋母情结什么的。这个我最早的时候也是有一些担心的，但还好，在这个问题上我基本上没有走什么弯路。当时身边有朋友是搞教育的，我也咨询了她，然后我们就得出一个共同的结论，就是这样的孩子绝对不能缺爱的。而且不要怕去跟孩子亲热，尤其是男孩子，他到了青春期以后，他自然的就会开始跟母亲疏远了。因此，只要他没有到青春期，孩子跟你的亲热，你千万不要拒绝。


    所以我现在不太能理解的就是有的家长在孩子很小的时候就让他自己睡一个房间，或者是在孩子不愿意的情况下让他往住校等等。这些我都是比较反对的，因为我觉得孩子长大以后，尤其是男孩子跟母亲，他自然而然的就会有一些距离了。在牧歌长大以后，我们现在见面也会拥抱一下，但是我能明显的感觉到他是那种礼节性的，他并不是发自真心的想拥抱妈妈，而是怕妈妈伤心。


    一个中学老师曾经给我讲过，缺爱的孩子会早恋的，不管男孩儿还是女孩'
  - '[PAGE 112]


    儿。所以，我们在跟孩子相处的过程中，一定要给孩子足够的爱，千万不要去怕跟孩子的亲热。即便是男孩子跟母亲亲热也不要担心，到了青春期以后，自然而然的，他成熟了，他就会离开你了。


    第二点我想说一下跟孩子相处的过程当中，实际上还是要赞美为主，批评为辅。尤其是严厉地批评，不到迫不得已不能把批评挂在嘴边，天天指责孩子。这样对孩子的心理伤害是特别大的，会让他变得非常不自信。他只要做得好就赞美他，但是这种赞美并不是那种无原则的赞美，而是他某些事情做得好，很具体的夸奖。比如不是你有多聪明、能干等诸如此类的，而是具体到夸他某一件事情做得好。


    第三点我想说就是在跟孩子相处的过程中，还是要放养，千万不要希望能掌控孩子，你如果要试图掌控孩子，那么你一定要碰得到头破血流，而且孩子也会非常的不舒服，跟你的关系会大打折扣，也就是说我们要给孩子充分的自由度，让他有充分的时间来自由发展。


    大概在牧歌上初中三年时间里，因为那时候工作比较忙，我基本上都没有太多的时间陪伴他，星期六、星期天我都要加班，他经常都是一个人在家里，我给他做好饭，然后出去上班，等我下班回来以后再陪他。在这个过程中，他有了大量的时间来自由安排。比如初二的时候，他特别迷恋哈利波特，就办了一个哈利波特的网站，为了充实资料，他就上英文版的
    JK 罗琳的那个网站。那时候他才上初二，学的英语相对来说没多少，学的也很简单。看不懂英文他就借助翻译工具、借助字典来翻译，当时翻译了大概有几万页 JK 罗琳网站上的资料，然后到他自己的网站上来用，就这样他在全国各地结识了有上百个大大小小的哈睿。


    这个网站一直办到他上高三，高三备考实在是太忙了，网站才荒了。最早他做网站的时候是免费的服务器，后来服务器要付费，他跟我商量，我都答应他，我说给他出钱。可是后来实际上他也没有要我的钱，因为当时有个大人发现了这个网站，给他投资了，给他交了服务器的费用。


    后来我就发现孩子大了以后，他们喜欢那种宽松一点的环境。比如他们跟宿舍的同学，或者是跟同班同学相处的过程中，有些家长每天都要跟自己的孩子联系，他们不喜欢这种把他们粘的太紧的家长，控制欲太强的家长，孩子也'
  - '[PAGE 113]


    都不喜欢。


    亲子关系的养成第四小点我想说一下这个榜样的力量。孩子是不喜欢说教的，你给他谈那么多原则、人生的信条，或者是方法，孩子是不喜欢的。这个主要是榜样的力量，润物细无声，你做的怎么样，孩子都会看在眼里。我们家是和父母一起生活，我感觉我在孝敬老人方面，可能做的相对来说稍微好一点。所以孩子他就能够看到，他也会比较体贴人，比较体贴他和他爸爸，也很体贴姥姥、姥爷。比如，他工作挣到工资以后，第一个月工资给自己什么都没舍得买，花了1500刀给我买了一部苹果手机，给姥爷买了一部iPad，给姥姥买了营养品，给奶奶买了营养品，给爸爸也买了一件礼物。另外，还给美国的一位奶奶，这位在美国的奶奶是我妈妈的一个朋友，身边的所有的人，包括舅舅、舅妈全部都买了礼物，几乎把第一个月的工资都用光了，我们还是挺感动的。


    第三点，关于孩子的成绩。


    孩子的潜力是我们不能想象的，千万不要在小学的时候，就把他的成绩看得太重，给孩子很大的压力。牧歌从小就不是那种学习特别拔尖的孩子，他是到了高中以后才开始大爆发的。如果按照他初中和小学的成绩，谁都没想到这个孩子以后会学习这么好，在学业上有这么高的成绩。


    所以我现在见到身边的年轻人，总是跟他们说小学的时候不要太看重成绩。只要孩子能够把他的成绩保持在年级的前二分之一，并且他的智力也没有问题的话，那么他也许今后就会有一个质的飞跃。我们家牧歌小学、初中中都不是学习特别好的孩子，但是上了高中以后，第一次他考到广州六中的时候，考去的时候大概是100多名，是属于撒到人堆几里都找不到的人。但是第一次月考，他就考了全年级第四名，从此以后考试就永远是第一，不管是接下来的月考和大大小小的期中，期末考试试永远是全校的第一名。他最传奇的一次，是有一次广州的四所重点中学联考，他比第二名高出20多分。也就是从此以后，他就在学校变得非常出名了，孩子们甚至编出一些口号，比如说：信牧歌不挂科。把他当作考神诸如此类的。


    他的成绩飞跃也是让我们都很吃惊，但是我现在回想起来，觉得是因为他有一个良好的基础，还有一个就是我在成绩上对他没有一个特别高的要求，所'
  - '[PAGE 114]


    以他心理上压力不大。上了高中以后，他每次考完试，其实我也很想知道成绩，但是我都憋着不问他，一直等他告诉我。后来我们谈起在他上学的过程中，我做的最好的一点是什么，牧歌对我的夸奖是这样说的：“妈妈从来没有在成绩上对我有很高的要求”。


    # 第四大点在孩子成长的过程中一定要放手，要让孩子有自由度，很多决定要听从孩子的意见。


    我们家牧歌在选择高中学校、大学专业，甚至大学以后换了专业等等诸多问题上，全都是他来自做决定的。上高中的时候学校的老师非常想让他报省实，我也很想让他报省实和华附，实际上成绩也是够的。但自己选择了六中，他不想进那种竞争力特别大的学校，不想压力太大。所以他选择了离家比较近的六中，现在看起来是成功的。


    进大学的时候他选了物理专业，而且非物理专业不读，当时我也觉得这个专业并不是特别的理想，我甚至还有朋友学物理的给他做工作，让他不要选这个专业，他都不听，我们也听从了他的意见。但后来他学了物理专业以后，发现物理和他高中想象的不是那么回事儿，就果断地转了专业，换成了数理基科。清华大学有三个试点班，分别是姚期智计算机班、钱学森力学班、还有数理基科班。数理基科班理论上毕业的时候是可以全校任选专业的，他毕业的时候选择了计算机专业。关于专业的选择也是他自己的决定。


    当时读研申请美国学校的时候，他还可以在国内保送读博。因为他毕业时是年级的前 12%，理论上清华的学生前 50%，都是可以保送读博的，他放弃了学校的直博机会。美国还有几所学校也录取了他，其中有一个印象最深刻的就是莱斯大学，我的一个同学他们对莱斯大学有一些赞助。因此，如果牧歌读了莱斯大学，在两年的研究生期间，学校会给他
    20 万奖学金。但我们还是尊重了他自己的选择。


    我们在孩子成长的过程当中，一定要适当放手，让孩子自己做决定。当然了，我们可以参与，可以提意见，但是如果我们不能说服孩子的时候，千万不要用我们的观点强加给孩子。


    # 第五点，我想说一下，我在培养牧歌过程中的一些遗憾。


    我不是搞教育的，而且就一个孩子，就做了实验田，我有很多失败的地'
  - '[PAGE 115]


    方。我看到现在的年轻人养孩子，就觉得如果是按照他们现在的方法，我如果 能够更加精心一点，不是像我当初那种放养，可能会更加成功。比如，我在孩 子艺术鉴赏力方面的培养就是很失职的。牧歌有很好的听辨音能力，在音乐方
    面素养很好，我当时一直想让他参加一个男童合唱团，居然稀里糊涂的错过了 ，也没有学门乐器，这个是我最遗憾的。当时让他学的绘画，因为他在教育部 的几个比赛中，在全国获奖了，我就以为他画画会很厉害。


    现在看来，也许是绘画班的选择不够好，他学到后期的时候，就很抵触， 在抵触的过程中，我居然没有听从孩子的意见，果断的转班，还是让他继续 学。现在看来我的决定是错误的。


    已经不知不觉跟大家分享了 45 分钟了，这个主要是我个人的一些感悟，不 一定正确，权作抛砖引玉，而且也没有系统的理论来做支撑。最后祝福大家， 以后在培养孩子过程当中都能超越我，都能把孩子培养的非常成功。


    在最后我还想说一点，就是孩子的身心健康才是最重要的，一定要让他成 为一个幸福感特别强的人，所有的成功都比不上身心健康，还有一个就是亲子 关系，和父母和家人有一个良好的关系，这个才是最重要的，而成绩不是衡量
    成功的一个标准。


    再次感谢大家！说的不对的地方请大家指正。'
  - '[PAGE 116]


    # 谈一谈我理解的价值投资


    讲师：Aceking，广州密码传媒有限公司创始人、CEO。


    时间：12 月 5 日


    大家好，今天为大家做一个主题为《谈一谈我理解的价值投资》的分享，讲的内容主要是以下 4 个部分：


    +   1、为什么选择价值投资


    2、价值投资的定义是什么


    3、价值投资的实践


    4、个人的价值投资心得


    先简单做个自我介绍，我叫 AceKing，之前做过德州扑克的培训，网络游戏的直播，现在主要做的是区块链方面的财经媒体，区块链产品的研发、测评等。今天讲的主题是价值投资，每个人对价值投资的理解都是不一样的，目前的价值投资是以格雷厄姆、巴菲特为代表的传统价值投资理念。但我觉得每个人都可以对价值投资有自己独特的理解，所以我今天讲的就是基于我个人对价值投资的理解。


    第一部分是讲，为什么要选择价值投资，或者说我们为什么要投资。


    大家在生活中也都有了解，最近这几十年，全世界都有货币超发的情况出现，具体到我们国家来说就是 M2(广义货币供应量)。从 2000 年的广义货币供应量 13
    万亿左右到今年的广义货币供应量约 190 万亿。我们可以看到，M2 在过去 20 年的时间翻了十几倍。同期美国实际上也有一个很大的增长，但是它的增幅略小于我们的三到四倍，这么大的货币超发情况在全世界都普遍存在。所以就造成了很多的问题，比如贫富悬殊越来越大、阶级固化、通货膨胀等等，都是因为货币超发带来的直接的一个因素。


    比如说最近美国有媒体做了一个分析，出生在 1930 年代，1940 年代的美国人，在他们 35 岁左右的时候，他们占有的财富占整个全社会的财富总量接近 30%，而出生在
    1970 年到 1980 年的美国人，在他们 35 岁的时候，占有的社会财富总量大概只占了 3%左右，这个就体现了在这几十年美国整个社会的贫富'
  - '[PAGE 117]


    差距。


    像我们国家统计局每月公布的 CPI，也就是居民消费价格的指数，实际上只是反映了民生领域的一些价格变化，是一些特定的商品，比如粮食、油脂和一些常用的食品等，这些东西都是国家有政策补贴的，所以这些东西长期的价格指数，可能每年上涨
    2%~3%，但整个社会的真实通货膨胀程度实际上是远远大于 CPI。


    货币超发表现在我们国家房地产上，导致了我们国家房价一直在上涨。最近的 20 年，实际上所有的投资唯一能够跑赢或者说接近真实货币总量的上涨和放大的其实只有房地产，我们国家的房价最近
    20 年涨了十几倍。


    如果是这样的话，房产投资也可以被我们认为是价值投资，因为我们价值投资最终的目的，至少要跑赢通胀，这是一个最基本的目的。如果在通胀膨胀的基础上，能够实现阶层的跨越，那就是更大的目标了。但就算以跑赢真实的通胀来讲，都是非常困难的。也就是说在最近
    20 年的中国社会里，在主要投资市场中，能够跑赢通胀或者说接近跑赢通胀的只有房地产投资，而且不是全国所有的地段，只有一些一二线城市的 core 地段，在过去
    20 年里有一个十几倍的涨幅，而一些三四线城市的房价涨幅，普遍来说是达不到的。


    了解这些信息对做投资是很有必要的，投资就是为了让我们跑赢通货膨胀，使我们的财富不贬值。


    # 第二部分，价值投资的定义是什么。


    关于价值投资这个话题，有很多的范畴可以讲，有很多的观点、理论等，在这里我只讲讲我个人的理解。


    第一点，就是 不赚短期价格波动的钱，而是赚钱价值波动的钱。


    我们拿股票举个例子，比如你七月份选中一只股票一直拿到八月份，在这一个月里面，你如果每天都盯着这支股票的话，会看到它的价格每天上蹿下跳。中途可能最高涨到八块钱，最低跌到三块钱，然后一个月之后收盘价格可能又是六块钱了。那在这个过程当中，它的股价起伏会很大，达到了
    50%，甚至更多。但实际上在这一个月过程当中，这支股票背后的上市公司，它的经营情况，实际上是没有什么变化。就是它本身的内在价值波动，不可能在一个月之内有这么大的一个表现在股票价格上的波动。那实际上这个短期的价格波动'
  - '[PAGE 118]


    我们认为是市场情绪的反应，主要是多空双方博弈之后产生的，反映在价格上的一个情况。


    股票价格每天波动主要是市场上每天都有人交易，有人会买也有人卖，或者说股市大盘受到中美贸易战或国际政治形势的影响，市场很恐慌，导致了它出现下跌这样的情况。


    所以这一部分的波动，也就是短线的一个走势的波动，有很多的投资者的或者是投机者，他们更多地还是关注在短线走势这一块。有的做短线，做日内波动的；有的可能时间长一点，做周线级别的；有的可能是更长一点的波动。但无论怎么说，他们还是处在赚价格波动的钱这个大的范畴里面。他们可能会用很多工具，用很多趋势，很多理论去武装自己，给自己找到买卖的依据。现在在也的确有很多专业的公司都是这么做的，比如量化基金，做一些对冲，做一些套利，通过程序化来交易。


    做短线的这些人他们并不关心公司的内在价值，也就是长期价值的这个波动，他们只关注短线的走势。因为市场的价格，给了他们信号，给了他们操作的依据，以及可以根据这些东西去形成一套理论去操作。但是我认为这个对绝大部分普通人来讲是绝对不适合的。有这么几点原因：


    第一是你肯定是不如这些专业化的机构。你没有他们的分析能力与专业能力，他们使用工具的能力，包括使用程序化的、量化的工具交易，包括他们的资金的优势，信息渠道的优势等各方面的优势，这样就使得我们这些个人投资者或者说散户，在投资的市场或者说在投资的领域里没法跟这些主力机构、团队、庄家去博弈的。


    第二点就是从交易本身来讲，实际上它是非常反人性的。人的本性就是趋利避害的，比如说风险厌恶，追涨杀跌，这些都是人性。例如你赚了10%，你可能会忍不住把利润给结算了，但是当你一旦出现亏损10%的时候，你的反应往往是死拿，不舍得卖。因为止损对人性来讲，要远痛痛苦于把利润给止盈掉。所以这些人性本身的机制，导致了在做短线交易的时候，我们是非常被动的，往往你可能赚一块钱，要亏掉两块五毛钱。


    真正能做到逆向思考，并且能够逆向去操作的，反人性去操作的，已经不能叫交易者了，应该叫做投机交易大师，这种人是很少的。如果有过实际的'
  - '[PAGE 119]


    股票，期货，外汇操作经验的星友应该知道，在做短线交易的时候，实际上更多的不是一个技术上的问题，而是在人性方面，你很难做到一个很好的自控。你通常是在获取利润的时候恐惧，在遇到风险的时候贪婪。这样就往往会导致一个比较差的结果。


    所以基于这两点，我认为不应该去赚价格波动的钱，特别是对大部分星友来讲，本身都是有固定工作，不可能每天去盯着盘，或者说把大量的时间用在这个短线的交易上，这是不可取的，所以对我们来讲去做一个长期的价值投资更合适。


    价值投资的定义第二点就是优中取优，宁缺毋滥，这个也是我自己定义的。


    首先任何行业，任何事情，任何人都是二八定律，这个是没有任何争议的。所有的投资标的也是这样，首先得找到那个优秀的 20%，其次你要在这 20%里面再优中取优，尽可能用排除法把一些就是你认为有瑕疵的，有不良因素的，这些标的给排除掉，尽可能的去选出那些非常优质的品种。


    这里我指的不是股票或者是期货，或者是某一个单个投资品。你在选任何的投资标的的时候，包括房产也一样，都是一定要有这个原则，就是宁缺毋滥，我尽可能是选优中之优的标的。


    具体来讲呢，我觉得优中取优的好标的，一般来说会符合以下几个条件：


    第一个是稀缺性。


    比如房产里面，上海的外滩就那么大的地方，深圳的深圳湾，北京的国贸，这些地方就具有稀缺性，它不会有很多这种地方。


    股票市场的贵州茅台，云南白药，片仔癸这些，都是比较独特的存在，也是具有稀缺性。


    第二就是这个标的或者这家公司，它是有护城河的。


    这个护城河跟稀缺性是有一定相关的，但还不完全一样。比如，在一家管理很烂的企业里面，它有很强的技术方面的优势，虽然这家公司具有很强的技术优势，但实际上公司管理层非常平庸，把公司管理的很烂，那这种我们就不予以考虑了。所以第二点一个公司要具有护城河也很重要。


    第三点垄断。'
  md: '

    可以玩儿，玩儿是孩子的天性，可以好好的玩儿，但是必须先做完作业。在孩子上学的第一学期绝对不能让他有什么坏习惯，比如说遮遮遛遛的，或者是低效率等等。因为一年级、二年级小学的时候课程不难，主要是学习习惯的培养。


    比如回到家里，第一件事情是先做作业，做完作业以后，所有的时间都是你的，你想怎么玩儿就怎么玩儿，这时候大人一定要说到做到。但是如果你作业没写完，那么你也玩不了，经过一学期的训练，孩子就已经养成了这个习惯。牧歌在学校包括上初中的时候，都会在学校争分夺秒地先把作业做完。因为他知道回到家以后，我们不干涉他，他作业做完了，剩下的时间都是他的，他可以自由支配，可以开心地玩儿。因此他对做作业从来都是把握得非常及时，不会拖拖拉拉的，不会像有的孩子一样，玩儿也没玩儿好，作业也没做好。


    最主要的是要孩子自己学，而不是我们陪着学，如果我们陪着学，这个过程是很痛苦的。此外，过了初中以后，孩子学的课程，实际上我们大人就跟不上了，理科的、英语的很多东西，甚至是语文。我本身学中文的，但是他的语文课，上了高中以后，很多题我是做不了的。所以说一定要让孩子自己学，高效率地学习，有一个良好的学习习惯。


    当然，在培养孩子学习能力和学习习惯的同时，大人需要有一点注意的。我告诉大家一个关于带孩子旅游的小技巧。


    如果我们打算带孩子旅行，那么就把他下学期的语文课本借来看，看一看下学期的语文课本里涉及到国内的哪些地方。比如讲到桂林山水，那么你就提前一学期先领他去桂林玩；讲北京，你也要提前一学期在寒假、暑假领他到北京玩。这样老师在讲这篇课文的时候，他去过了就会有一些感触，有一些感性的认识，他听起来和理解起来就会比其他人要深得多。


    还有一点就是提醒一下各位年轻的朋友，在小孩九岁之前，你领他出去玩要看人文景观而不是自然景观，我们觉得大自然是非常的奇妙。可是对于一个九岁以下的孩子来说，他是记不住的，他的欣赏能力和我们大人的是不一样的。因此，要带他看人文景观而不是自然景观。看人文景观的时候，我们提前做一些功课，可以给孩子以讲故事的形式来展现，这样的旅游效果就比较好。


    上面是我讲的第一个问题就是学习能力和学习习惯的培养，只要坚持下来，就能达到事半功倍的效果。一旦让孩子有了很好的学习能力和优秀的学习习惯，那么在孩子求学路上，他越往后走，你会觉得你越轻松。


    ## 第二点，关于亲子关系的养成。


    现在社会上的孩子大都是独生子女，大多数父母跟孩子的关系都是很亲密的。但我也见过很多失败的例子，不是说你对孩子付出多少，孩子就能够跟你有非常好的亲子关系。我们也见过很多跟父母关系不好的，确实是让人非常伤心。孩子的成长过程是不可逆的，很多错误是不能犯的，犯了以后甚至不给你纠正的机会。


    我们家的情况稍微有点特殊，因为我们是单亲家庭，在牧歌九岁的时候，我和他爸爸就离婚了。但以我现在对牧歌的观察，我觉得这个对牧歌的不良心理影响，相对来说是比较小的。孩子跟我和他爸爸都还是比较亲的，因为我不反对他跟爸爸亲热，这个血缘关系是割不断的，不能因为我跟他爸爸关系不好，或者我们分开了，就让孩子去恨一个人。因此，亲子关系不要跟对方争夺，更不要去比。


    另外我还想说的一点是，比如像我这种单亲家庭，我是一个妈妈带着儿子。很多人就担心妈妈跟孩子特别亲热，会不会以后让孩子的心理有影响，有些恋母情结什么的。这个我最早的时候也是有一些担心的，但还好，在这个问题上我基本上没有走什么弯路。当时身边有朋友是搞教育的，我也咨询了她，然后我们就得出一个共同的结论，就是这样的孩子绝对不能缺爱的。而且不要怕去跟孩子亲热，尤其是男孩子，他到了青春期以后，他自然地就会开始跟母亲疏远了。因此，只要他没有到青春期，孩子跟你的亲热，你千万不要拒绝。


    所以我现在不太能理解的就是有的家长在孩子很小的时候就让他自己睡一个房间，或者是在孩子不愿意的情况下让他往住校等等。这些我都是比较反对的，因为我觉得孩子长大以后，尤其是男孩子跟母亲，他自然而然的就会有一些距离了。在牧歌长大以后，我们现在见面也会拥抱一下，但是我能明显地感觉到他是那种礼节性的，他并不是发自真心的想拥抱妈妈，而是怕妈妈伤心。


    一个中学老师曾经给我讲过，缺爱的孩子会早恋的，不管男孩儿还是女孩儿。所以，我们在跟孩子相处的过程中，一定要给孩子足够的爱，千万不要去怕跟孩子的亲热。即便是男孩子跟母亲亲热也不要担心，到了青春期以后，自然而然的，他成熟了，他就会离开你了。


    第二点我想说一下跟孩子相处的过程当中，实际上还是要赞美为主，批评为辅。尤其是严厉地批评，不到迫不得已不能把批评挂在嘴边，天天指责孩子。这样对孩子的心理伤害是特别大的，会让他变得非常不自信。他只要做得好就赞美他，但是这种赞美并不是那种无原则的赞美，而是他某些事情做得好，很具体的夸奖。比如不是你有多聪明、能干等诸如此类的，而是具体到夸他某一件事情做得好。


    第三点我想说就是在跟孩子相处的过程中，还是要放养，千万不要希望能掌控孩子，你如果要试图掌控孩子，那么你一定要碰得头破血流，而且孩子也会非常的不舒服，跟你的关系会大打折扣，也就是说我们要给孩子充分的自由度，让他有充分的时间来自由发展。


    大概在牧歌上初中三年时间里，因为那时候工作比较忙，我基本上都没有太多的时间陪伴他，星期六、星期天我都要加班，他经常都是一个人在家里，我给他做好饭，然后出去上班，等我下班回来以后再陪他。在这个过程中，他有了大量的时间来自由安排。比如初二的时候，他特别迷恋哈利波特，就办了一个哈利波特的网站，为了充实资料，他就上英文版的
    J.K. 罗琳的那个网站。那时候他才上初二，学的英语相对来说没多少，学的也很简单。看不懂英文他就借助翻译工具、借助字典来翻译，当时翻译了大概有几万页 J.K.
    罗琳网站上的资料，然后到他自己的网站上来用，就这样他在全国各地结识了有上百个大大小小的哈迷。


    这个网站一直办到他上高三，高三备考实在是太忙了，网站才荒了。最早他做网站的时候是免费的服务器，后来服务器要付费，他跟我商量，我都答应他，我说给他出钱。可是后来实际上他也没有要我的钱，因为当时有个大人发现了这个网站，给他投资了，给他交了服务器的费用。


    后来我就发现孩子大了以后，他们喜欢那种宽松一点的环境。比如他们跟宿舍的同学，或者是跟同班同学相处的过程中，有些家长每天都要跟自己的孩子联系，他们不喜欢这种把他们粘的太紧的家长，控制欲太强的家长，孩子也都不喜欢。


    亲子关系的养成第四小点我想说一下这个榜样的力量。孩子是不喜欢说教的，你给他谈那么多原则、人生的信条，或者是方法，孩子是不喜欢的。这个主要是榜样的力量，润物细无声，你做的怎么样，孩子都会看在眼里。我们家是和父母一起生活，我感觉我在孝敬老人方面，可能做的相对来说稍微好一点。所以孩子他就能够看到，他也会比较体贴人，比较体贴他和他爸爸，也很体贴姥姥、姥爷。比如，他工作挣到工资以后，第一个月工资给自己什么都没舍得买，花了1500刀给我买了一部苹果手机，给姥爷买了一部iPad，给姥姥买了营养品，给奶奶买了营养品，给爸爸也买了一件礼物。另外，还给美国的一位奶奶，这位在美国的奶奶是我妈妈的一个朋友，身边的所有的人，包括舅舅、舅妈全部都买了礼物，几乎把第一个月的工资都用光了，我们还是挺感动的。


    ## 第三点，关于孩子的成绩。


    孩子的潜力是我们不能想象的，千万不要在小学的时候，就把他的成绩看得太重，给孩子很大的压力。牧歌从小就不是那种学习特别拔尖的孩子，他是到了高中以后才开始大爆发的。如果按照他初中和小学的成绩，谁都没想到这个孩子以后会学习这么好，在学业上有这么高的成绩。


    所以我现在见到身边的年轻人，总是跟他们说小学的时候不要太看重成绩。只要孩子能够把他的成绩保持在年级的前二分之一，并且他的智力也没有问题的话，那么他也许今后就会有一个质的飞跃。我们家牧歌小学、初中都不是学习特别好的孩子，但是上了高中以后，第一次他考到广州六中的时候，考去的时候大概是100多名，是属于撒到人堆里都找不到的人。但是第一次月考，他就考了全年级第四名，从此以后考试就永远是第一，不管是接下来的月考和大大小小的期中、期末考试，永远是全校的第一名。他最传奇的一次，是有一次广州的四所重点中学联考，他比第二名高出20多分。也就是从此以后，他就在学校变得非常出名了，孩子们甚至编出一些口号，比如说：信牧歌不挂科。把他当作考神诸如此类的。


    他的成绩飞跃也是让我们都很吃惊，但是我现在回想起来，觉得是因为他有一个良好的基础，还有一个就是我在成绩上对他没有一个特别高的要求，所以他心理上压力不大。上了高中以后，他每次考完试，其实我也很想知道成绩，但是我都憋着不问他，一直等他告诉我。后来我们谈起在他上学的过程中，我做的最好的一点是什么，牧歌对我的夸奖是这样说的：“妈妈从来没有在成绩上对我有很高的要求”。


    ## 第四大点，在孩子成长的过程中一定要放手，要让孩子有自由度，很多决定要听从孩子的意见。


    我们家牧歌在选择高中学校、大学专业，甚至大学以后换了专业等等诸多问题上，全都是他自己做决定的。上高中的时候学校的老师非常想让他报省实，我也很想让他报省实和华附，实际上成绩也是够的。但自己选择了六中，他不想进那种竞争力特别大的学校，不想压力太大。所以他选择了离家比较近的六中，现在看起来是成功的。


    进大学的时候他选了物理专业，而且非物理专业不读，当时我也觉得这个专业并不是特别的理想，我甚至还有朋友学物理的给他做工作，让他不要选这个专业，他都不听，我们也听从了他的意见。但后来他学了物理专业以后，发现物理和他高中想象的不是那么回事儿，就果断地转了专业，换成了数理基科。清华大学有三个试点班，分别是姚期智计算机班、钱学森力学班、还有数理基科班。数理基科班理论上毕业的时候是可以全校任选专业的，他毕业的时候选择了计算机专业。关于专业的选择也是他自己的决定。


    当时读研申请美国学校的时候，他还可以在国内保送读博。因为他毕业时是年级的前 12%，理论上清华的学生前 50%，都是可以保送读博的，他放弃了学校的直博机会。美国还有几所学校也录取了他，其中有一个印象最深刻的就是莱斯大学，我的一个同学他们对莱斯大学有一些赞助。因此，如果牧歌读了莱斯大学，在两年的研究生期间，学校会给他
    20 万奖学金。但我们还是尊重了他自己的选择。


    我们在孩子成长的过程当中，一定要适当放手，让孩子自己做决定。当然了，我们可以参与，可以提意见，但是如果我们不能说服孩子的时候，千万不要用我们的观点强加给孩子。


    ## 第五点，我想说一下，我在培养牧歌过程中的一些遗憾。


    我不是搞教育的，而且就一个孩子，就做了实验田，我有很多失败的地方。我看到现在的年轻人养孩子，就觉得如果是按照他们现在的方法，我如果能够更加精心一点，不是像我当初那种放养，可能会更加成功。比如，我在孩子艺术鉴赏力方面的培养就是很失职的。牧歌有很好的听辨音能力，在音乐方面素养很好，我当时一直想让他参加一个男童合唱团，居然稀里糊涂地错过了，也没有学门乐器，这个是我最遗憾的。当时让他学的绘画，因为他在教育部主办的几个比赛中，在全国获奖了，我就以为他画画会很厉害。


    现在看来，也许是绘画班的选择不够好，他学到后期的时候，就很抵触，在抵触的过程中，我居然没有听从孩子的意见，果断地转班，还是让他继续学。现在看来我的决定是错误的。


    已经不知不觉跟大家分享了 45 分钟了，这个主要是我个人的一些感悟，不一定正确，权作抛砖引玉，而且也没有系统的理论来做支撑。最后祝福大家，以后在培养孩子过程当中都能超越我，都能把孩子培养的非常成功。


    在最后我还想说一点，就是孩子的身心健康才是最重要的，一定要让他成为一个幸福感特别强的人，所有的成功都比不上身心健康，还有一个就是亲子关系，和父母和家人有一个良好的关系，这个才是最重要的，而成绩不是衡量成功的一个标准。


    再次感谢大家！说的不对的地方请大家指正。


    ## 谈一谈我理解的价值投资


    讲师：AceKing，广州密码传媒有限公司创始人、CEO。


    时间：12 月 5 日


    大家好，今天为大家做一个主题为《谈一谈我理解的价值投资》的分享，讲的内容主要是以下 4 个部分：


    - 1、为什么选择价值投资

    - 2、价值投资的定义是什么

    - 3、价值投资的实践

    - 4、个人的价值投资心得


    先简单做个自我介绍，我叫 AceKing，之前做过德州扑克的培训，网络游戏的直播，现在主要做的是区块链方面的财经媒体，区块链产品的研发、测评等。今天讲的主题是价值投资，每个人对价值投资的理解都是不一样的，目前的价值投资是以格雷厄姆、巴菲特为代表的传统价值投资理念。但我觉得每个人都可以对价值投资有自己独特的理解，所以我今天讲的就是基于我个人对价值投资的理解。


    第一部分是讲，为什么要选择价值投资，或者说我们为什么要投资。


    大家在生活中也都有了解，最近这几十年，全世界都有货币超发的情况出现，具体到我们国家来说就是 M2(广义货币供应量)。从 2000 年的广义货币供应量 13
    万亿左右到今年的广义货币供应量约 190 万亿。我们可以看到，M2 在过去 20 年的时间翻了十几倍。同期美国实际上也有一个很大的增长，但是它的增幅略小于我们的三到四倍，这么大的货币超发情况在全世界都普遍存在。所以就造成了很多的问题，比如贫富悬殊越来越大、阶级固化、通货膨胀等等，都是因为货币超发带来的直接的一个因素。


    比如说最近美国有媒体做了一个分析，出生在 1930 年代，1940 年代的美国人，在他们 35 岁左右的时候，他们占有的财富占整个全社会的财富总量接近 30%，而出生在
    1970 年到 1980 年的美国人，在他们 35 岁的时候，占有的社会财富总量大概只占了 3% 左右，这个就体现了在这几十年美国整个社会的贫富差距。


    像我们国家统计局每月公布的 CPI，也就是居民消费价格的指数，实际上只是反映了民生领域的一些价格变化，是一些特定的商品，比如粮食、油脂和一些常用的食品等，这些东西都是国家有政策补贴的，所以这些东西长期的价格指数，可能每年上涨
    2%~3%，但整个社会的真实通货膨胀程度实际上是远远大于 CPI。


    货币超发表现在我们国家房地产上，导致了我们国家房价一直在上涨。最近的 20 年，实际上所有的投资唯一能够跑赢或者说接近真实货币总量的上涨和放大的其实只有房地产，我们国家的房价最近
    20 年涨了十几倍。


    如果是这样的话，房产投资也可以被我们认为是价值投资，因为我们价值投资最终的目的，至少要跑赢通胀，这是一个最基本的目的。如果在通胀膨胀的基础上，能够实现阶层的跨越，那就是更大的目标了。但就算以跑赢真实的通胀来讲，都是非常困难的。也就是说在最近
    20 年的中国社会里，在主要投资市场中，能够跑赢通胀或者说接近跑赢通胀的只有房地产投资，而且不是全国所有的地段，只有一些一二线城市的 core 地段，在过去
    20 年里有一个十几倍的涨幅，而一些三四线城市的房价涨幅，普遍来说是达不到的。


    了解这些信息对做投资是很有必要的，投资就是为了让我们跑赢通货膨胀，使我们的财富不贬值。


    ## 第二部分，价值投资的定义是什么。


    关于价值投资这个话题，有很多的范畴可以讲，有很多的观点、理论等，在这里我只讲讲我个人的理解。


    第一点，就是 不赚短期价格波动的钱，而是赚长期价值波动的钱。


    我们拿股票举个例子，比如你七月份选中一只股票一直拿到八月份，在这一个月里面，你如果每天都盯着这支股票的话，会看到它的价格每天上蹿下跳。中途可能最高涨到八块钱，最低跌到三块钱，然后一个月之后收盘价格可能又是六块钱了。那在这个过程当中，它的股价起伏会很大，达到了
    50%，甚至更多。但实际上在这一个月过程当中，这支股票背后的上市公司，它的经营情况，实际上是没有什么变化。就是它本身的内在价值波动，不可能在一个月之内有这么大的一个表现在股票价格上的波动。那实际上这个短期的价格波动我们认为是市场情绪的反应，主要是多空双方博弈之后产生的，反映在价格上的一个情况。


    股票价格每天波动主要是市场上每天都有人交易，有人会买也有人卖，或者说股市大盘受到中美贸易战或国际政治形势的影响，市场很恐慌，导致了它出现下跌这样的情况。


    所以这一部分的波动，也就是短线的一个走势的波动，有很多的投资者的或者是投机者，他们更多地还是关注在短线走势这一块。有的做短线，做日内波动的；有的可能时间长一点，做周线级别的；有的可能是更长一点的波动。但无论怎么说，他们还是处在赚价格波动的钱这个大的范畴里面。他们可能会用很多工具，用很多趋势，很多理论去武装自己，给自己找到买卖的依据。现在在也的确有很多专业的公司都是这么做的，比如量化基金，做一些对冲，做一些套利，通过程序化来交易。


    做短线的这些人他们并不关心公司的内在价值，也就是长期价值的这个波动，他们只关注短线的走势。因为市场的价格，给了他们信号，给了他们操作的依据，以及可以根据这些东西去形成一套理论去操作。但是我认为这个对绝大部分普通人来讲是绝对不适合的。有这么几点原因：


    第一是你肯定是不如这些专业化的机构。你没有他们的分析能力与专业能力，他们使用工具的能力，包括使用程序化的、量化的工具交易，包括他们的资金的优势，信息渠道的优势等各方面的优势，这样就使得我们这些个人投资者或者说散户，在投资的市场或者说在投资的领域里没法跟这些主力机构、团队、庄家去博弈的。


    第二点就是从交易本身来讲，实际上它是非常反人性的。人的本性就是趋利避害的，比如说风险厌恶，追涨杀跌，这些都是人性。例如你赚了10%，你可能会忍不住把利润给结算了，但是当你一旦出现亏损10%的时候，你的反应往往是死拿，不舍得卖。因为止损对人性来讲，要远痛苦于把利润给止盈掉。所以这些人性本身的机制，导致了在做短线交易的时候，我们是非常被动的，往往你可能赚一块钱，要亏掉两块五毛钱。


    真正能做到逆向思考，并且能够逆向去操作的，反人性去操作的，已经不能叫交易者了，应该叫做投机交易大师，这种人是很少的。如果有过实际的股票、期货、外汇操作经验的星友应该知道，在做短线交易的时候，实际上更多的不是一个技术上的问题，而是在人性方面，你很难做到一个很好的自控。你通常是在获取利润的时候恐惧，在遇到风险的时候贪婪。这样就往往会导致一个比较差的结果。


    所以基于这两点，我认为不应该去赚价格波动的钱，特别是对大部分星友来讲，本身都是有固定工作，不可能每天去盯着盘，或者说把大量的时间用在这个短线的交易上，这是不可取的，所以对我们来讲去做一个长期的价值投资更合适。


    价值投资的定义第二点就是优中取优，宁缺毋滥，这个也是我自己定义的。


    首先任何行业，任何事情，任何人都是二八定律，这个是没有任何争议的。所有的投资标的也是这样，首先得找到那个优秀的 20%，其次你要在这 20% 里面再优中取优，尽可能用排除法把一些就是你认为有瑕疵的，有不良因素的，这些标的给排除掉，尽可能的去选出那些非常优质的品种。


    这里我指的不是股票或者是期货，或者是某一个单个投资品。你在选任何的投资标的的时候，包括房产也一样，都是一定要有这个原则，就是宁缺毋滥，我尽可能是选优中之优的标的。


    具体来讲呢，我觉得优中取优的好标的，一般来说会符合以下几个条件：


    第一个是稀缺性。


    比如房产里面，上海的外滩就那么大的地方，深圳的深圳湾，北京的国贸，这些地方就具有稀缺性，它不会有很多这种地方。


    股票市场的贵州茅台，云南白药，片仔癸这些，都是比较独特的存在，也是具有稀缺性。


    第二就是这个标的或者这家公司，它是有护城河的。


    这个护城河跟稀缺性是有一定相关的，但还不完全一样。比如，在一家管理很烂的企业里面，它有很强的技术方面的优势，虽然这家公司具有很强的技术优势，但实际上公司管理层非常平庸，把公司管理的很烂，那这种我们就不予以考虑了。所以第二点一个公司要具有护城河也很重要。


    第三点垄断。

    '
  mdcn: '

    可以玩儿，玩儿是孩子的天性，可以好好的玩儿，但是必须先做完作业。在孩子上学的第一学期绝对不能让他有什么坏习惯，比如说遮遮遛遛的，或者是低效率等等。因为一年级、二年级小学的时候课程不难，主要是学习习惯的培养。


    比如回到家里，第一件事情是先做作业，做完作业以后，所有的时间都是你的，你想怎么玩儿就怎么玩儿，这时候大人一定要说到做到。但是如果你作业没写完，那么你也玩不了，经过一学期的训练，孩子就已经养成了这个习惯。牧歌在学校包括上初中的时候，都会在学校争分夺秒地先把作业做完。因为他知道回到家以后，我们不干涉他，他作业做完了，剩下的时间都是他的，他可以自由支配，可以开心地玩儿。因此他对做作业从来都是把握得非常及时，不会拖拖拉拉的，不会像有的孩子一样，玩儿也没玩儿好，作业也没做好。


    最主要的是要孩子自己学，而不是我们陪着学，如果我们陪着学，这个过程是很痛苦的。此外，过了初中以后，孩子学的课程，实际上我们大人就跟不上了，理科的、英语的很多东西，甚至是语文。我本身学中文的，但是他的语文课，上了高中以后，很多题我是做不了的。所以说一定要让孩子自己学，高效率地学习，有一个良好的学习习惯。


    当然，在培养孩子学习能力和学习习惯的同时，大人需要有一点注意的。我告诉大家一个关于带孩子旅游的小技巧。


    如果我们打算带孩子旅行，那么就把他下学期的语文课本借来看，看一看下学期的语文课本里涉及到国内的哪些地方。比如讲到桂林山水，那么你就提前一学期先领他去桂林玩；讲北京，你也要提前一学期在寒假、暑假领他到北京玩。这样老师在讲这篇课文的时候，他去过了就会有一些感触，有一些感性的认识，他听起来和理解起来就会比其他人要深得多。


    还有一点就是提醒一下各位年轻的朋友，在小孩九岁之前，你领他出去玩要看人文景观而不是自然景观，我们觉得大自然是非常的奇妙。可是对于一个九岁以下的孩子来说，他是记不住的，他的欣赏能力和我们大人的是不一样的。因此，要带他看人文景观而不是自然景观。看人文景观的时候，我们提前做一些功课，可以给孩子以讲故事的形式来展现，这样的旅游效果就比较好。


    上面是我讲的第一个问题就是学习能力和学习习惯的培养，只要坚持下来，就能达到事半功倍的效果。一旦让孩子有了很好的学习能力和优秀的学习习惯，那么在孩子求学路上，他越往后走，你会觉得你越轻松。


    ## 第二点，关于亲子关系的养成。


    现在社会上的孩子大都是独生子女，大多数父母跟孩子的关系都是很亲密的。但我也见过很多失败的例子，不是说你对孩子付出多少，孩子就能够跟你有非常好的亲子关系。我们也见过很多跟父母关系不好的，确实是让人非常伤心。孩子的成长过程是不可逆的，很多错误是不能犯的，犯了以后甚至不给你纠正的机会。


    我们家的情况稍微有点特殊，因为我们是单亲家庭，在牧歌九岁的时候，我和他爸爸就离婚了。但以我现在对牧歌的观察，我觉得这个对牧歌的不良心理影响，相对来说是比较小的。孩子跟我和他爸爸都还是比较亲的，因为我不反对他跟爸爸亲热，这个血缘关系是割不断的，不能因为我跟他爸爸关系不好，或者我们分开了，就让孩子去恨一个人。因此，亲子关系不要跟对方争夺，更不要去比。


    另外我还想说的一点是，比如像我这种单亲家庭，我是一个妈妈带着儿子。很多人就担心妈妈跟孩子特别亲热，会不会以后让孩子的心理有影响，有些恋母情结什么的。这个我最早的时候也是有一些担心的，但还好，在这个问题上我基本上没有走什么弯路。当时身边有朋友是搞教育的，我也咨询了她，然后我们就得出一个共同的结论，就是这样的孩子绝对不能缺爱的。而且不要怕去跟孩子亲热，尤其是男孩子，他到了青春期以后，他自然地就会开始跟母亲疏远了。因此，只要他没有到青春期，孩子跟你的亲热，你千万不要拒绝。


    所以我现在不太能理解的就是有的家长在孩子很小的时候就让他自己睡一个房间，或者是在孩子不愿意的情况下让他往住校等等。这些我都是比较反对的，因为我觉得孩子长大以后，尤其是男孩子跟母亲，他自然而然的就会有一些距离了。在牧歌长大以后，我们现在见面也会拥抱一下，但是我能明显地感觉到他是那种礼节性的，他并不是发自真心的想拥抱妈妈，而是怕妈妈伤心。


    一个中学老师曾经给我讲过，缺爱的孩子会早恋的，不管男孩儿还是女孩儿。所以，我们在跟孩子相处的过程中，一定要给孩子足够的爱，千万不要去怕跟孩子的亲热。即便是男孩子跟母亲亲热也不要担心，到了青春期以后，自然而然的，他成熟了，他就会离开你了。


    第二点我想说一下跟孩子相处的过程当中，实际上还是要赞美为主，批评为辅。尤其是严厉地批评，不到迫不得已不能把批评挂在嘴边，天天指责孩子。这样对孩子的心理伤害是特别大的，会让他变得非常不自信。他只要做得好就赞美他，但是这种赞美并不是那种无原则的赞美，而是他某些事情做得好，很具体的夸奖。比如不是你有多聪明、能干等诸如此类的，而是具体到夸他某一件事情做得好。


    第三点我想说就是在跟孩子相处的过程中，还是要放养，千万不要希望能掌控孩子，你如果要试图掌控孩子，那么你一定要碰得头破血流，而且孩子也会非常的不舒服，跟你的关系会大打折扣，也就是说我们要给孩子充分的自由度，让他有充分的时间来自由发展。


    大概在牧歌上初中三年时间里，因为那时候工作比较忙，我基本上都没有太多的时间陪伴他，星期六、星期天我都要加班，他经常都是一个人在家里，我给他做好饭，然后出去上班，等我下班回来以后再陪他。在这个过程中，他有了大量的时间来自由安排。比如初二的时候，他特别迷恋哈利波特，就办了一个哈利波特的网站，为了充实资料，他就上英文版的
    J.K. 罗琳的那个网站。那时候他才上初二，学的英语相对来说没多少，学的也很简单。看不懂英文他就借助翻译工具、借助字典来翻译，当时翻译了大概有几万页 J.K.
    罗琳网站上的资料，然后到他自己的网站上来用，就这样他在全国各地结识了有上百个大大小小的哈迷。


    这个网站一直办到他上高三，高三备考实在是太忙了，网站才荒了。最早他做网站的时候是免费的服务器，后来服务器要付费，他跟我商量，我都答应他，我说给他出钱。可是后来实际上他也没有要我的钱，因为当时有个大人发现了这个网站，给他投资了，给他交了服务器的费用。


    后来我就发现孩子大了以后，他们喜欢那种宽松一点的环境。比如他们跟宿舍的同学，或者是跟同班同学相处的过程中，有些家长每天都要跟自己的孩子联系，他们不喜欢这种把他们粘的太紧的家长，控制欲太强的家长，孩子也都不喜欢。


    亲子关系的养成第四小点我想说一下这个榜样的力量。孩子是不喜欢说教的，你给他谈那么多原则、人生的信条，或者是方法，孩子是不喜欢的。这个主要是榜样的力量，润物细无声，你做的怎么样，孩子都会看在眼里。我们家是和父母一起生活，我感觉我在孝敬老人方面，可能做的相对来说稍微好一点。所以孩子他就能够看到，他也会比较体贴人，比较体贴他和他爸爸，也很体贴姥姥、姥爷。比如，他工作挣到工资以后，第一个月工资给自己什么都没舍得买，花了1500刀给我买了一部苹果手机，给姥爷买了一部iPad，给姥姥买了营养品，给奶奶买了营养品，给爸爸也买了一件礼物。另外，还给美国的一位奶奶，这位在美国的奶奶是我妈妈的一个朋友，身边的所有的人，包括舅舅、舅妈全部都买了礼物，几乎把第一个月的工资都用光了，我们还是挺感动的。


    ## 第三点，关于孩子的成绩。


    孩子的潜力是我们不能想象的，千万不要在小学的时候，就把他的成绩看得太重，给孩子很大的压力。牧歌从小就不是那种学习特别拔尖的孩子，他是到了高中以后才开始大爆发的。如果按照他初中和小学的成绩，谁都没想到这个孩子以后会学习这么好，在学业上有这么高的成绩。


    所以我现在见到身边的年轻人，总是跟他们说小学的时候不要太看重成绩。只要孩子能够把他的成绩保持在年级的前二分之一，并且他的智力也没有问题的话，那么他也许今后就会有一个质的飞跃。我们家牧歌小学、初中都不是学习特别好的孩子，但是上了高中以后，第一次他考到广州六中的时候，考去的时候大概是100多名，是属于撒到人堆里都找不到的人。但是第一次月考，他就考了全年级第四名，从此以后考试就永远是第一，不管是接下来的月考和大大小小的期中、期末考试，永远是全校的第一名。他最传奇的一次，是有一次广州的四所重点中学联考，他比第二名高出20多分。也就是从此以后，他就在学校变得非常出名了，孩子们甚至编出一些口号，比如说：信牧歌不挂科。把他当作考神诸如此类的。


    他的成绩飞跃也是让我们都很吃惊，但是我现在回想起来，觉得是因为他有一个良好的基础，还有一个就是我在成绩上对他没有一个特别高的要求，所以他心理上压力不大。上了高中以后，他每次考完试，其实我也很想知道成绩，但是我都憋着不问他，一直等他告诉我。后来我们谈起在他上学的过程中，我做的最好的一点是什么，牧歌对我的夸奖是这样说的：“妈妈从来没有在成绩上对我有很高的要求”。


    ## 第四大点，在孩子成长的过程中一定要放手，要让孩子有自由度，很多决定要听从孩子的意见。


    我们家牧歌在选择高中学校、大学专业，甚至大学以后换了专业等等诸多问题上，全都是他自己做决定的。上高中的时候学校的老师非常想让他报省实，我也很想让他报省实和华附，实际上成绩也是够的。但自己选择了六中，他不想进那种竞争力特别大的学校，不想压力太大。所以他选择了离家比较近的六中，现在看起来是成功的。


    进大学的时候他选了物理专业，而且非物理专业不读，当时我也觉得这个专业并不是特别的理想，我甚至还有朋友学物理的给他做工作，让他不要选这个专业，他都不听，我们也听从了他的意见。但后来他学了物理专业以后，发现物理和他高中想象的不是那么回事儿，就果断地转了专业，换成了数理基科。清华大学有三个试点班，分别是姚期智计算机班、钱学森力学班、还有数理基科班。数理基科班理论上毕业的时候是可以全校任选专业的，他毕业的时候选择了计算机专业。关于专业的选择也是他自己的决定。


    当时读研申请美国学校的时候，他还可以在国内保送读博。因为他毕业时是年级的前 12%，理论上清华的学生前 50%，都是可以保送读博的，他放弃了学校的直博机会。美国还有几所学校也录取了他，其中有一个印象最深刻的就是莱斯大学，我的一个同学他们对莱斯大学有一些赞助。因此，如果牧歌读了莱斯大学，在两年的研究生期间，学校会给他
    20 万奖学金。但我们还是尊重了他自己的选择。


    我们在孩子成长的过程当中，一定要适当放手，让孩子自己做决定。当然了，我们可以参与，可以提意见，但是如果我们不能说服孩子的时候，千万不要用我们的观点强加给孩子。


    ## 第五点，我想说一下，我在培养牧歌过程中的一些遗憾。


    我不是搞教育的，而且就一个孩子，就做了实验田，我有很多失败的地方。我看到现在的年轻人养孩子，就觉得如果是按照他们现在的方法，我如果能够更加精心一点，不是像我当初那种放养，可能会更加成功。比如，我在孩子艺术鉴赏力方面的培养就是很失职的。牧歌有很好的听辨音能力，在音乐方面素养很好，我当时一直想让他参加一个男童合唱团，居然稀里糊涂地错过了，也没有学门乐器，这个是我最遗憾的。当时让他学的绘画，因为他在教育部主办的几个比赛中，在全国获奖了，我就以为他画画会很厉害。


    现在看来，也许是绘画班的选择不够好，他学到后期的时候，就很抵触，在抵触的过程中，我居然没有听从孩子的意见，果断地转班，还是让他继续学。现在看来我的决定是错误的。


    已经不知不觉跟大家分享了 45 分钟了，这个主要是我个人的一些感悟，不一定正确，权作抛砖引玉，而且也没有系统的理论来做支撑。最后祝福大家，以后在培养孩子过程当中都能超越我，都能把孩子培养的非常成功。


    在最后我还想说一点，就是孩子的身心健康才是最重要的，一定要让他成为一个幸福感特别强的人，所有的成功都比不上身心健康，还有一个就是亲子关系，和父母和家人有一个良好的关系，这个才是最重要的，而成绩不是衡量成功的一个标准。


    再次感谢大家！说的不对的地方请大家指正。


    ## 谈一谈我理解的价值投资


    讲师：AceKing，广州密码传媒有限公司创始人、CEO。


    时间：12 月 5 日


    大家好，今天为大家做一个主题为《谈一谈我理解的价值投资》的分享，讲的内容主要是以下 4 个部分：


    - 1、为什么选择价值投资

    - 2、价值投资的定义是什么

    - 3、价值投资的实践

    - 4、个人的价值投资心得


    先简单做个自我介绍，我叫 AceKing，之前做过德州扑克的培训，网络游戏的直播，现在主要做的是区块链方面的财经媒体，区块链产品的研发、测评等。今天讲的主题是价值投资，每个人对价值投资的理解都是不一样的，目前的价值投资是以格雷厄姆、巴菲特为代表的传统价值投资理念。但我觉得每个人都可以对价值投资有自己独特的理解，所以我今天讲的就是基于我个人对价值投资的理解。


    第一部分是讲，为什么要选择价值投资，或者说我们为什么要投资。


    大家在生活中也都有了解，最近这几十年，全世界都有货币超发的情况出现，具体到我们国家来说就是 M2(广义货币供应量)。从 2000 年的广义货币供应量 13
    万亿左右到今年的广义货币供应量约 190 万亿。我们可以看到，M2 在过去 20 年的时间翻了十几倍。同期美国实际上也有一个很大的增长，但是它的增幅略小于我们的三到四倍，这么大的货币超发情况在全世界都普遍存在。所以就造成了很多的问题，比如贫富悬殊越来越大、阶级固化、通货膨胀等等，都是因为货币超发带来的直接的一个因素。


    比如说最近美国有媒体做了一个分析，出生在 1930 年代，1940 年代的美国人，在他们 35 岁左右的时候，他们占有的财富占整个全社会的财富总量接近 30%，而出生在
    1970 年到 1980 年的美国人，在他们 35 岁的时候，占有的社会财富总量大概只占了 3% 左右，这个就体现了在这几十年美国整个社会的贫富差距。


    像我们国家统计局每月公布的 CPI，也就是居民消费价格的指数，实际上只是反映了民生领域的一些价格变化，是一些特定的商品，比如粮食、油脂和一些常用的食品等，这些东西都是国家有政策补贴的，所以这些东西长期的价格指数，可能每年上涨
    2%~3%，但整个社会的真实通货膨胀程度实际上是远远大于 CPI。


    货币超发表现在我们国家房地产上，导致了我们国家房价一直在上涨。最近的 20 年，实际上所有的投资唯一能够跑赢或者说接近真实货币总量的上涨和放大的其实只有房地产，我们国家的房价最近
    20 年涨了十几倍。


    如果是这样的话，房产投资也可以被我们认为是价值投资，因为我们价值投资最终的目的，至少要跑赢通胀，这是一个最基本的目的。如果在通胀膨胀的基础上，能够实现阶层的跨越，那就是更大的目标了。但就算以跑赢真实的通胀来讲，都是非常困难的。也就是说在最近
    20 年的中国社会里，在主要投资市场中，能够跑赢通胀或者说接近跑赢通胀的只有房地产投资，而且不是全国所有的地段，只有一些一二线城市的 core 地段，在过去
    20 年里有一个十几倍的涨幅，而一些三四线城市的房价涨幅，普遍来说是达不到的。


    了解这些信息对做投资是很有必要的，投资就是为了让我们跑赢通货膨胀，使我们的财富不贬值。


    ## 第二部分，价值投资的定义是什么。


    关于价值投资这个话题，有很多的范畴可以讲，有很多的观点、理论等，在这里我只讲讲我个人的理解。


    第一点，就是 不赚短期价格波动的钱，而是赚长期价值波动的钱。


    我们拿股票举个例子，比如你七月份选中一只股票一直拿到八月份，在这一个月里面，你如果每天都盯着这支股票的话，会看到它的价格每天上蹿下跳。中途可能最高涨到八块钱，最低跌到三块钱，然后一个月之后收盘价格可能又是六块钱了。那在这个过程当中，它的股价起伏会很大，达到了
    50%，甚至更多。但实际上在这一个月过程当中，这支股票背后的上市公司，它的经营情况，实际上是没有什么变化。就是它本身的内在价值波动，不可能在一个月之内有这么大的一个表现在股票价格上的波动。那实际上这个短期的价格波动我们认为是市场情绪的反应，主要是多空双方博弈之后产生的，反映在价格上的一个情况。


    股票价格每天波动主要是市场上每天都有人交易，有人会买也有人卖，或者说股市大盘受到中美贸易战或国际政治形势的影响，市场很恐慌，导致了它出现下跌这样的情况。


    所以这一部分的波动，也就是短线的一个走势的波动，有很多的投资者的或者是投机者，他们更多地还是关注在短线走势这一块。有的做短线，做日内波动的；有的可能时间长一点，做周线级别的；有的可能是更长一点的波动。但无论怎么说，他们还是处在赚价格波动的钱这个大的范畴里面。他们可能会用很多工具，用很多趋势，很多理论去武装自己，给自己找到买卖的依据。现在在也的确有很多专业的公司都是这么做的，比如量化基金，做一些对冲，做一些套利，通过程序化来交易。


    做短线的这些人他们并不关心公司的内在价值，也就是长期价值的这个波动，他们只关注短线的走势。因为市场的价格，给了他们信号，给了他们操作的依据，以及可以根据这些东西去形成一套理论去操作。但是我认为这个对绝大部分普通人来讲是绝对不适合的。有这么几点原因：


    第一是你肯定是不如这些专业化的机构。你没有他们的分析能力与专业能力，他们使用工具的能力，包括使用程序化的、量化的工具交易，包括他们的资金的优势，信息渠道的优势等各方面的优势，这样就使得我们这些个人投资者或者说散户，在投资的市场或者说在投资的领域里没法跟这些主力机构、团队、庄家去博弈的。


    第二点就是从交易本身来讲，实际上它是非常反人性的。人的本性就是趋利避害的，比如说风险厌恶，追涨杀跌，这些都是人性。例如你赚了10%，你可能会忍不住把利润给结算了，但是当你一旦出现亏损10%的时候，你的反应往往是死拿，不舍得卖。因为止损对人性来讲，要远痛苦于把利润给止盈掉。所以这些人性本身的机制，导致了在做短线交易的时候，我们是非常被动的，往往你可能赚一块钱，要亏掉两块五毛钱。


    真正能做到逆向思考，并且能够逆向去操作的，反人性去操作的，已经不能叫交易者了，应该叫做投机交易大师，这种人是很少的。如果有过实际的股票、期货、外汇操作经验的星友应该知道，在做短线交易的时候，实际上更多的不是一个技术上的问题，而是在人性方面，你很难做到一个很好的自控。你通常是在获取利润的时候恐惧，在遇到风险的时候贪婪。这样就往往会导致一个比较差的结果。


    所以基于这两点，我认为不应该去赚价格波动的钱，特别是对大部分星友来讲，本身都是有固定工作，不可能每天去盯着盘，或者说把大量的时间用在这个短线的交易上，这是不可取的，所以对我们来讲去做一个长期的价值投资更合适。


    价值投资的定义第二点就是优中取优，宁缺毋滥，这个也是我自己定义的。


    首先任何行业，任何事情，任何人都是二八定律，这个是没有任何争议的。所有的投资标的也是这样，首先得找到那个优秀的 20%，其次你要在这 20% 里面再优中取优，尽可能用排除法把一些就是你认为有瑕疵的，有不良因素的，这些标的给排除掉，尽可能的去选出那些非常优质的品种。


    这里我指的不是股票或者是期货，或者是某一个单个投资品。你在选任何的投资标的的时候，包括房产也一样，都是一定要有这个原则，就是宁缺毋滥，我尽可能是选优中之优的标的。


    具体来讲呢，我觉得优中取优的好标的，一般来说会符合以下几个条件：


    第一个是稀缺性。


    比如房产里面，上海的外滩就那么大的地方，深圳的深圳湾，北京的国贸，这些地方就具有稀缺性，它不会有很多这种地方。


    股票市场的贵州茅台，云南白药，片仔癸这些，都是比较独特的存在，也是具有稀缺性。


    第二就是这个标的或者这家公司，它是有护城河的。


    这个护城河跟稀缺性是有一定相关的，但还不完全一样。比如，在一家管理很烂的企业里面，它有很强的技术方面的优势，虽然这家公司具有很强的技术优势，但实际上公司管理层非常平庸，把公司管理的很烂，那这种我们就不予以考虑了。所以第二点一个公司要具有护城河也很重要。


    第三点垄断。

    '
  merge: 1
- raw:
  - '[PAGE 120]


    实际上如果它具备了稀缺性，也具备了护城河，具备了公司管理方面或者其他技术方面的领先优势的话，那它必然也会具有垄断性。一般来说会体现在公司规模比较大，它是行业的龙头品种，它可能不是碾压级别的存在，但是至少它是一个巨无霸，提到这个行业我们都知道它的存在。比如像茅台，苹果，腾讯，阿里这样的企业，以上讲的三点的情况，它们都是符合的。这个就是优中取优，价值投资定义第二点。


    总结归纳一下价值投资的定义。我们赚的是一个公司未来成长的钱，我们判断这家公司或者说这个产品，它是具有价值投资要求的。它在未来会获得一个大的价值成长，而具体成长多少我们很难判断，也许是
    5 倍，也许是 10 倍，也许是 100 倍，这个我们很难去精确估算，但我们基于对它基本面的严格判断，认定了它未来会成长。


    另外我们买的时候在短期价格波动这方面会吃一点亏，比如你是 3 块钱买的，他是 5 块钱买的，这个我们肯定做不了那么专业买到最低点。但是从长远来看，它能涨到
    100 块钱的时候，你 3 块还是 5 块买，其实是一样的。


    同时我们选择的价值投资的标的应是非常优秀的，是非常少的。市面上大部分的投资品种，我们都应该过滤掉，我觉得只有这样才能符合真正价值投资的定义。因为不可能什么公司，什么产品都是价值投资。市面上真正的好公司肯定是少之又少，这个定律是不会错的。所以基于这两点，我们看的是长远，追求的是远期的利益。其次，价值投资定义的时间，至少是以年为例级的投资，我买了之后不会短期买卖，就像房子一样，流动性很差，你不可能今天买，明天卖。


    回到刚才说的第一项里头为什么房地产投资是中国最近 20 年时间最成功的价值投资呢，就是因为房地产的流动性比较差，它不可能短期买卖。你自己的一栋房子持有五年、十年的时候，实际上就吃到了这一波经济成长红利，避免了短线干扰和短线的波动。所以我们在做价值投资的时候，即使这个投资标的不是房产，也要有一个长期的思路和规划。一个行业的经济景气周期或者说一个公司的成长周期，绝对不会是以月为单位，不可能几个月就结束了。我看好一个东西，看好一个产品，它必然是后面三年五年甚至十年，有很好的发展，那理论上来讲，我就要持有这么长时间，去吃到它的一个完整的成长空间。'
  - '[PAGE 121]


    # 第三部分价值投资的实践。


    价值投资的实践也是因人而异的，在这里我只能讲我自己的情况。首先要找到自己的能力圈，这个是非常重要的。你要先知道自己对什么不了解，自己对什么不擅长，什么是我理解不了的。比如你自己处在苹果产业链的其中一个行业，在行业链条的某一端，那你自然会对这个行业，对这个生态，对苹果产业链有一个至少比圈外人更明确的认识，那这个就是你的优势。我们要发挥自身的优势，去找自己所在行业的机会，或者你身边的朋友、亲人，在某个行业里做了很多年，你现在想了解这个行业了，你去跟他交流，那你就具有这个行业的信息优势。


    所以在做价值投资的时候，一定要发挥自身的优势，扬长避短。你不了解的行业，完全不懂的东西，坚决不能去碰。


    比如科大讯飞语音识别技术很牛，但我不懂，完全是个门外汉，对这个行业确实不了解，而且又觉得这个专业门槛比较高，想请教身边的朋友，他们也没有懂的，那这种情况就坚决不能碰，直接忽略。


    我们在生活中尽量去找自己能够理解或者跟自己工作比较接近的一个行业去做研究，这样就是最好的。例如有的人刚好就是做智能语音行业的，那你在研究科大讯飞的时候自然就会比别人更加有优势。所以我想表达的就是不懂的行业或公司不要去碰，找你自已了解的行业。


    如果在一个行业里你具备信息优势渠道，但确实没有什么值得投资的标的，行业是夕阳行业，这个行业在走下坡路，这个时候怎么办呢。出现这种情况也很正常，这种情况之下，我觉得也依然要遵循一个原则，还是找自己身边的公司。


    这个怎么理解呢，就是说一个公司或者一个产品，它的业务逻辑越简单越好，这种就是可以作为考虑的目标，千万不要去选那些业务很复杂，你自己试图去理解，但是根本理解不了的。


    再回到苹果手机的例子，这个就很容易理解，因为你身边的人都在用，你自己也在用，你明确感觉到 iOS 从体验上确实要比安卓要强一些。在这种情况下，你首先就对这个产品有一个直观的了解，而且它的业务逻辑是非常简单的，你明确的知道苹果只要出新产品就会卖的很火，并且它的这个
    iOS 操作系'
  - '[PAGE 122]


    统的独立性，整个生态系统构建的非常好，活跃开发者也非常多，不断会很多的创意在里面。那种产品的业务逻辑，我觉得即使你不处在这个行业，你也能很明确的了解。或者你对啤酒有很深的了解，那对白酒或者红酒行业你自然也会有一个直观的感受，这个其实也是可以的。


    当你对一个产品，对一个业务有自己的逻辑能够去理解它，那这个就是你最坚实的基础。千万不要觉得那些在新闻中天花乱坠报道的什么云计算，AR、大数据这些都是好的，感觉这个就是未来的方向。云计算这些东西我们不了解那就直接放弃，不然在不懂的情况下去投资它，可能就会吃大亏的。


    如果云计算这些东西你是行业内人士，你能理解，那自然是最好，理解不了，站在局外人的角度看看就好了。所以我们还是尽可能踏踏实实找一些身边的业务，哪怕你是买一个你每天都要用的洗手液。你就知道牌子好，你们所在的地区这个牌子的洗手液永远不愁卖不掉。那你这个朴素的逻辑，都要比去投那些不懂的云计算强的多。


    第二点，要具备一定的投资知识。


    比如你可能不是财务专业的，但是上市公司的一些基本的财务知识，例如现金、利润、资产、负债等这些基础的概念要懂，这个是必须要懂的。不管你是什幺行业，什幺背景，都要学习这些基本的知识。另外还要有一个比较强大的逻辑分析能力，因为很多时候做一些调研，在寻找公司的过程中是需要
    的。因为得做对比、做分析，用排除法把一些负面的东西证实或者证伪，是要用逻辑来排查的。


    所以我觉得对自己逻辑方面的训练，也需要不断加强，至少要有怀疑精神，媒体给你展现出来的，或者说你接触到的一手的信息，它有时可能是有误 导在里面的，也可能是一些潜在的失误，这些东西都要靠自己去了解，去发
    现。财务知识加上逻辑的训练都是必不可少的。


    第三点要建立一个交易系统和纠错的机制。


    交易系统很复杂，在这里没法展开讲，简单点说就是我们要知道一个再好 的标的，它短期也会有价格波动。虽然我们没法精确的去预测和控制，但是 理论上讲，你三块钱买肯定会比五块钱买要好，虽然从长远来讲可能不会差
    太多。但在实际交易的时候，你肯定还是要寻求尽可能的低位买入，这个用术语


    公众号 懒人找资源'
  - '[PAGE 123]


    来讲就是要寻找安全边际。也就是说，你知道这个公司它值 10 块钱，但有时你可以用五块钱的打折价格来买入，如果你是 12 块钱或者 13 块钱买的，从长期来看也是能接受的，但是它会耗掉你更多的利润和时间成本。所以我们尽可能的要寻找一个合理估值，在合理估值价格之下买入。


    那怎么去寻找一个标的的安全边际，或者说找一个低位买入的机会，这个牵扯的因素很多，今天就没法展开讲，这里只能简单提一下，如果感兴趣的话，可以找这样的书看或者去网上找相应的资料，应有尽有。


    另外我们要知道每个人都有自己的局限性，都有自己的认知偏差，都存在认知方面的盲点。不论你有多强的专业能力，即使你就是这个行业内的人，都存在这种情况。


    比如马化腾在 QQ 刚成立的时候，一度也想把公司卖掉，其实他自己心里也没底，公司后面会发展的怎么样，并且我们也看到马化腾最近几年都有卖出腾讯公司的股票，而他基本上每次卖都是卖在最低点，例如他
    180 块港币卖，卖完了之后可能半年就涨到了 280 港币。这就说明了，其实每个人都是有认知的盲点，当然这么讲可能不太严谨。因为世界的发展，或者说很多行业的发展，其实是一个非常复杂的系统，它的复杂程度是远远超过人脑的分析判断和计算能力的。所以我们不必苛求这一点。世界是不断在动态变化的，一定要深刻认识到这一点，你自己再牛逼，你的认知都是有局限的，所以我们在认知的基础上设定资金管理就非常重要。你再看好这个标的，也不能去梭哈，甚至于贷款上杠杆操作，这就很危险。


    资金管理实际上在很多的方面都需要用到，这里也不展开讲了，而这又是一个很大的话题，正好今天公司公众号发了一篇《中产家庭资产如何配置》(https://mp.weixin.qq.com/s/hT61KlsFymOF9gBEmv2blw)，文章里面有讲到资金管理问题，大家也可以看一下作为参考。


    第四点就是止损和退出的机制。


    比如有一家公司，你当初可能做了很久的研究，也确实觉得好，而且理论也是正确的，只是因为后面事态的发展或行业的变化，导致投资失败了。有些东西是我们预料不到的，也没有办法。就像诺基亚当年破产的时候，诺基亚总裁也讲了一句很伤感的话，他说：“我们并没有做错什么，但不知为什么我们输'
  - '[PAGE 124]


    了”。没办法，很多事情都是这样，可能你做的是正确的，但结果却不好，这在生活中也经常发生。


    通过各方面的努力分析，大量的调研考察，我们可以把成功率提高到了90%，虽然有 90%的成功率，但还有 10%的失败概率，当你遇到了怎么办。那最终要有一个纠错退出机制，也就是我承认这个事情失败了，这个投资标的看来是不会有什么好的发展前景了，这种情况我们就只能退出。当然这个过程会很困难，只能靠自己去克服了。


    并且因为我们之前已经有做资金管理，所以单个标的投资失败，对个体或家庭的损失不会太大，危害也不会太大，所以把资金管理做好，纠错的心理机制调整好，我想应该也没有什么太大的问题。以上就是我讲的第三部分，关于价值投资的实践。


    那最后一部分，我简单讲一下，我个人的价值投资心得。


    接下来我说一下我投资比特币的过程。


    我是 2012 年秋天，通过一个朋友知道比特币的，我朋友对密码学比较感兴趣，所以他很早就知道比特币了。我知道比特币的时候，它的价格是 10 美金左右，换算成人民币是
    70 块钱左右。


    我刚了解到比特币的时候，第一感觉就是不靠谱，感觉有点类似传销，说好听一点就是类似像 QQ 币这种东西，类似像游戏里面的那种虚拟货币。我当时觉得这个应该没什么价值，因为我也玩过网络游戏，也有了解很多这种虚拟的货币，认为它长期来看一定会贬值的，也不会有什么好的发展空间。在这之后也没有太多的关注，只是知道了而已。


    在 2013 年春天的时候，塞浦路斯发生了一个很大的危机，金融危机过后，比特币就狂涨了一波。


    后来我发现价格已经涨了 100 多美金了，涨了十倍，所以我就觉得要花点时间了解这个东西到底怎么回事。


    之后就逐渐找一些资料去研究，到了 2013 年的秋天比特币又疯狂涨了一波，当时最高的时候涨到了 1000 美金，换算成人民币就是 7000 块钱。后来央行和五部委发通知遏制炒币，然后价格开始跌下来了。


    我在这个过程中一直没有买，因为当时还看不懂，对它还是有很多疑虑，'
  - '[PAGE 125]


    有很多东西没想明白。因此也没有去炒币，只是一直在做研究，去看各种分析的文章，看这个行业的相关新闻，跟靠近这个行业的朋友去聊。能搜索到的资讯，都尽可能去看，去研究，去做一些自己的分析。


    之后到 2014 年，发现比特币就慢慢步入熊市，价格慢慢跌到了 5000 人民币，3000 人民币，然后 2015 年的时候最低跌到 1000 块钱人民币左右，那时候这个行业感觉要崩盘，当时很多矿工都支持不下去了，市场一片哀嚎。


    这时我分析研究比特币已经一年多时间了，我知道比特币已经有两年多的时间了，我觉得这个时候是买入的机会，所以在 2015 年从人民币 1500 元至 5000
    元这个区间，我都有买。买的理由就是看好它的长期发展，并且我认为这个是需要持有很长时间，可能十年甚至更长，一直到现在我都在持有，中间的波动也非常大，最高的时候可能涨到
    15 万，最低的时候有跌到 3 万。但你不可能把所有的钱都赚到，你看好它的长远发展，过程中的这些代价只能是忍受。以上就是我买卖比特币的过程。


    下面我讲一下，我当时之所以下定决心比特币值得投资，主要原因有这么几点：


    第一，经过长期的研究之后，我认为比特币，它是有实际的支付刚需的，也就是说它的应用场景非常之硬。简单讲就是每一年跨境转移的资金需求是非常庞大的，这一块资金转移的成本比较高。比如国际汇款这些正常途径的费用是非常之高的，而利用比特币进行跨境转移资金是可以的，就这一个需求其实就已经能够产生可能数百亿美金。


    除了跨境支付，还有很多不是那么光明正大的需求。比如说洗钱，一些地下产业，包括一些匿名支付，有些人他可能不喜欢走银行，喜欢走现金。所以当时从这点出发，我认为比特币不是一个空中楼阁的东西，它是有实实实在在在的支付方面的刚需和一个很强的应用场景，这些只是一部分，其实还有很多，这里不一一展开了。


    第二点它是有价值共识的。


    为什么在 2015 年的时候我敢买，刚知道的时候不敢买，很大程度也是因为此。2012 年的时候比特币虽然便宜，但实际上它的价值很脆弱，就是了解它的人少，用户规模也不在一个数量级，几万人和几百万人是不可同日而语的。之'
  - '[PAGE 126]


    前除了在币圈的一部分死忠粉之外，圈外的人很少知道比特币，但经过几年的发展，很多人也开始慢慢了解了，包括很多的金融机构，我国央行在 2014 年就已经开始研究数字货币了。所以经过几年的发展，它的价值共识已经形成了，当大家形成了共识它就有价值，如果没有共识的话，这个东西就会很脆弱。


    买的时候虽然牺牲掉一部分价格上的利润，但是在那个时间点介入，它价值共识的支撑也比两年前要强的多，风险和利润都是对等的，高风险高利润，利润少风险也低了。所以我在当时觉得值得买入时，就认为它已经形成价值共识了。


    第三点就是技术领先。


    从密码学的角度，包括从区块链本身的底层技术的角度考虑，它去中心化、天然匿名、安全性等等，这些都做的非常好。而且比特币已经有很多年了，该有的问题、漏洞，通通证伪了，没有一个能够颠覆它。虽然有些交易所跑路，但那跟比特币本身没有关系。


    所以白皮书里面讲的那些东西它都实现了，并且也没有出现安全上的问题，在五年之后的今天再来看，依然没有问题。比特币已经存在十年了，网络很安全，即使是断网，出现一些大的问题，因为是去中心化的，它也不会被摧毁，它的安全性、匿名性这些都经受住时间的各种考验了，这也是我当时觉得值得投入的一个很重要的原因。它刚出来的时候，婴儿期投会很不稳定，在幼儿期去投，就好很多了，它夭折的概率就远远小的多。站在现在再回头看，当时的这个判断还是正确的，这几点依然是成立的。


    注：上文中提到的白皮书指中本聪在 2008 年发表的一篇题为《比特币：一种点对点的电子现金系统》，史称“比特币白皮书”。


