    # 投资者眼中的创业者


    # —创业要怎样才更容易成功？


    分享者：马桶，历史学硕士，原陕西省公务员，陕西某公务员培训学校联合创始人，近年来从事投资业务，现为上海某投资集团总裁办主任。


    分享时间：2019 年 8 月


    “创业要怎样才更容易成功？”这是一个很有意思的命题。首先，确定的是创业没有“容易”的，但是我认同创业有“更容易”的。因为任何事务都有其内在规律，掌握规律的人不一定都能做好或成功，但从概率上来说有更大的可能性。


    基于我自身创业和做投资的经验，可以跟大家做一些不一定有指导意义的分享。我上大学时就跟室友一起做些小生意。那是 2001 年左右的事。那时手机还不普及，电商还未兴起。我们在学校看到某种需求后，就去批发市场发货，然后拿到学校去卖。诸如十字绣、雨伞、搜集卖家推荐信等。再把沿海的贝壳饰品拿到内地的大学去卖，在每个大学找一位同学做分销。挣的是市场嗅觉、信息差和辛苦钱，是个体户或倒爷式的初级商业模式。


    研究生毕业后，进入省级政府部门工作，但是不愿意白天上班晚上应酬的庸碌，就自己开始“白+黑”，“5+2”的双重身份的生活。白天在单位上班，作为公务员“为人民服务”。晚上、周末创业做自己的事，作为创业者“为人民币服务”。


    我和几个同年（同一批考入省政府，一起参加入职培训的同学）利用自己考上公务员的经验，编写教材，开办了公务员培训学校，以体制外的朋友的身份开办公司，我们作为老师对学生进行辅导，由于公务员考试的公平性和难以作弊，我们的经验就成为具有市场价值的商品。这件事既能为国家培养人才，又能把自己的知识和经验变现，还能帮助考公的同学实现就业，是一举三得的事。


    我们还开办过咖啡馆、农家乐、组织公益活动，捐建智障儿童学校（纯公益项目）。咖啡馆、农家乐都因经营不善倒闭，公务员学校目前仍然在运营。这个阶段的创业就是合伙人+公司组织的商业模式，挣得的是组织运营+个人辛苦'
  md: '

    ## 营销与运营要素


    这家企业是有钱的。当然，如果企业要融资，还要有完美的股权架构。不过，拿到融资的企业毕竟占少数，而最终能上市的公司自然也会更少了。


    所以我这里讲的是通常企业运营的四个要素。我认为只要好好地使用这四个要素，一家企业就可以健康成长。


    在这里我需要说一下市场营销和企业的其它三要素（战略规划、商业模式、组织框架）的关系。


    大家请看图 1，显示的是两种企业的运营方式。


    ![](img/74d384fc5d948a0c31090e035208669c_31_0.png)


    第一种，是大多数企业的运营模式，每一个要素都是一个独立的个体。在中国，营销在企业的重视程度，我认为是不够高的。因为中国的企业家在排名企业要素时会认为：产品第一、服务第二、营销第三。或者你会听说某个企业在产品研发上会花多少钱，多少钱。在我看来，中国市场营销预算真的低得可怜，或者说是完全依赖市场营销人员来进行营销策划。


    下面我们要进行第一个板块的分享：营销生活。


    我从自己就是营销员的角度来看，营销这一现状很是让人担忧。因为任何一家企业存在的目的是为了创造正营收。


    但是光有好产品是不可能让企业壮大的。苹果刚推出 iPod 那会儿，市面上比 iPod 还好的产品（比如说瞩目的产品），无论从工程的哪个角度来看，瞩目的产品都要远比
    iPod 好很多。


    但是为什么 iPod 畅销但 Zoom 不畅销呢？请大家带着这个问题思考一下。


    也许你会问我，市场营销在企业中是最重要吗？答案是，市场营销是真的很重要。但是它需要融入到企业的其它三要素当中，这才是企业运营最重要的。


    通过上图的两种企业模式对比，我们可以看到第一种企业模式是一种平行架构，各个要素之间互不相交。


    因为每个要素不会对其它要素形成支持，所以这种运营模式很不稳定。第二种运营模式就比第一种好太多了。大家都知道三角形具有稳定性，所以这种模式的市场营销是融入到战略规划、融入到组织框架、融入到对应的商业模式当中的。


    营销生活这一块我们从介绍它的背景意义开始。当今，我们可以看到每人每天都在看着手机，而且尼古森全球调研报告指出，中国人平均每天在手机上花费大概 170 分钟，除去睡觉的八小时，基本上平均每五六分钟就会看一次手机。


    我们使用手机就一定离不开社交媒体，大家或多或少都会有一些微商朋友，比如说：在使用微信的过程中你就一定会翻看朋友圈，那么就一定会看到微信营销的案例——卖东西。年轻一族喜欢看直播，也一定会看到直播营销的案例。随着生活质量的不断提高，我们都会选择品牌产品。


    所以在这里我会举三个案例：第一个案例是针对我朋友圈的微信营销。第二个案例是直播营销，关于聪明的李佳琦。第三个案例是关于品牌营销当中的恒大冰泉。


    销售不好的人，大多也都具备了我多个微商朋友的一些特点：只是大量的推销产品，而没有其他对应的一些高品质的生活照片秀。


    说到这里，我想跟大家聊一下我身边的一个例子。我有一位好友留学日本，和她一起留学日本的也有 20 个人左右，但是所有人当中卖东西卖得最好的人就是我的这个好友。


    在我看来她有几个特点：


    - 第一，人长得特别漂亮。

    - 第二，生活很时尚，很有品味，喜欢用各种名牌包包，也会穿很多时尚品牌的衣服。

    - 第三，定期会在不同的国家旅行，比如说美国、加拿大、欧洲、日本、韩国等等。

    - 第四，会将各国一些好的产品分享到朋友圈中。而且她卖东西很挑人，反反复复询问客户是否需要购买，不购买的客户一律删除处理。但是她的业绩特别好，而其他人的业绩少得可怜。


    到这里大家可能会有一个疑问，我的这个好友和其他二十几个人之间应该也存在共同好友，客户难道就不会去其他人那里购买吗？


    答案是客户都会从我的这个朋友那里去购买，而没有选择其他人。


    当我的朋友和我说了这件事情之后，我觉得客户购买我朋友的产品，触发客户购买行为的原因是，我朋友的高生活质量和自己的生活品味。当我朋友分享自己高质量生活照片时，客户的潜意识是自己使用了这些产品，也可以像我朋友那样生活。不过我觉得他们自己可能没有意识到这一点。


    我为了证实我的这一个看法，我加了很多不同的代购，并和他们进行了沟通。我发现的不同点是，像我朋友那样销售产品的人，耐心都不大。而共同点是，朋友圈都会有大量的高品质生活照片，并且会有大量快递出入他们的发货地址。


    讲到这里，我想和大家说的是，我的这个朋友就是我的妻子。如果你有购买各国的其它产品的需要，我相信很大概率上你会选择联系我的妻子，去她那里购买东西。因为你会觉得她很靠谱。当然，我这里并不是为了帮助我妻子找客户，因为对她来说，买卖东西只是兴趣爱好。在生活中，真正让你下定决心买东西，从哪里购买，都是由你的大脑决定的，而不是产品本身的好坏。因为你可以注意到，同样的产品在不同人那里都可以买到，但是最终客户还是会选择在我的妻子那里购买。


    下面我们来看一下营销生活的第二个案例：直播营销。


    李佳琦为什么带货量那么大，他有什么样的方法呢？


    在我看来李佳琦是一个很聪明的人，因为他很懂得调动客户的潜意识。


    大家请看图 2，图 2 这三幅图都是我自己仔细挑选的。大家可以看一下下面的每一句话：


    ![](img/74d384fc5d948a0c31090e035208669c_34_0.png)


