    了就能拿到多少的奖金，这个都很好说。但是一个总裁办主任，他能够怎样述职呢？


    好，我希望大家带着这三个问题，我们一起来探索一下管理咨询的奥秘。三个问题的答案，我都会在下面逐一的讲到，我们整个的分享将按照这么三个模块来进行：


    第一：我会介绍一下什么是管理咨询？


    第二：介绍有哪些管理咨询的思维，以及在工作生活中有哪些应用。


    第三：介绍一些基本 的管理咨询工具，以及它们在工作和生活中的应用。


    首先什么是管理咨询呢？我给它下了一个定义，管理咨询是找到一家公司在战略或者经营管理上存在的问题，给出解决方案，并且帮助企业将方案落地实施的过程，就叫做管理咨询。可能不同的人会有不同的定义，上面说的这个是我个人对它的一个定义。


    我们从这个角度来看，管理咨询其实不仅可以用于企业，大到一个国家，小到个人，我们平时工作和生活中都可以用。比如我们日常碰到的人生目标的问题，或者我们做事的方式方法问题，我们人生的动力或者工作的激励方式等这些问题。我们的管理咨询思维和工具就可以找到问题存在哪里，并且给出一个解决方案，把它落地实施。


    所以管理咨询不光是对企业，对个人也可以产生很好的作用，这就是为什么我今天要讲这么一个题目。


    # 管理咨询工具箱


    +   麦肯锡六大分析模型，品牌延伸动力学模型，创新动力模型、定量战略计划矩阵；BQ&LE五维矩阵，大战略矩阵，战略挑战与行动评估矩阵/PSM矩阵，SCCB象
