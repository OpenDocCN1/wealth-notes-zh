    ## 从解决问题到流程化思维


    费在骂人上了，而不是解决问题。


    所以我们平时就要避免这种情况，一定要有一个问题导向，我们碰到的是什么问题？我当下做的这件事情是不是有利于解决这个问题？


    比如，公司的现金流紧张怎么办？业务萎缩怎么办？我现在只能在家办公，我要怎么解决联网的问题？等等。我们生活中碰到很多问题，它都要你想着怎么去解决，而不是发泄情绪或者抱怨。


    从事业来讲，我们可能还要拓展到我们看到社会面临哪些问题，人民群众有哪些问题？可能 90% 的人在发泄情绪，只有 10% 的人会想到其中有哪些需求？有哪些机会？


    我最近写的马云、俞敏洪、刘强东、梁建章他们这些人在面对问题的时候，都是有问题去解决问题。所以他们能够做得比一般人更成功。尤其是俞敏洪说的，我觉得特别有道理：你碰到问题去抱怨它是没有用的，只能逢山开路，遇水搭桥，遇到问题去解决问题，这就是我做新东方的态度。


    其实，这也应该是我们做任何事情的一个态度。


    第 2 个思维是流程优先思维。


    妈妈在小孩出门之前会告诉小孩，你在外面要注意安全，大家想一想这一句嘱咐对孩子有用吗？其实是没有任何效果的。我们需要告诉他的是过马路的时候先停下，看红绿灯，等红灯变绿之后，左瞧瞧右瞧瞧，再过。这样我们就把一个嘱咐或者命令变成了一个流程，它才具有可操作性。


    再比如，我们出门有时候会忘记带钥匙、身份证什么的，你老是提醒自己，你千万要记得带东西，不能落东西，也是没有任何意义的。但是你可以告诉自己，出门之前我先找一下“伸手要钱”（身份证、手机、钥匙、钱包），这就是用流程化的思维来解决一个问题。


    我前不久在星球里也写过一个朋友，他去年第 1 年创业生意做到三个亿，听起来确实是很不错。但其实上半年他也过得很难。


    他是做白酒电商的，主要就是通过电话、微信、朋友圈这些方式去推销白酒。刚开始他也想制定一个好的制度，设计一个好的 KPI 来管理，但后来发现不行。我跟他聊了之后建议他采用流程优先的方式来管理这个业务。


    怎么管？找出他们公司销售最厉害的一些人，把销售分成一个细化的流程，第 1 步干什么？第 2 步干什么，第 3 步干什么？形成一个标准操作流程，就是我们说的
    SOP。


    后来他们就总结出了一套流程，一个人进入到我的客户库里，我要怎么去接触？话术是怎样的，第 1 句话说什么，第 2 句话说什么，他提到的这个问题我应该怎么回答？把这些做成一个很专业的话术，并且不断的改进。所以他们就做的比较轻松了。


    前几天我看了一 个电影，叫做《中国机长》，可能很多朋友都看过。


    这个机长在挡风玻璃破裂那么紧急的情况下是如何拯救全飞机的人呢？我们也可以赞扬他的精神以及超人类的忍耐能力。但是机长自己在接受采访的时候说：“我就是按照操作手册来做”，其实就是流程化的运作。


    每一个飞行员都会经历年复一年日复一日的操作，就是第 1 步、第 2 步、第 3 步，他们有一个检查清单，该做什么完全按照流程，所以在碰到问题的时候，他按照流程操作就行了。


    第 3 个是经营分析思维。


    经营分析是我们在给企业做咨询的时候经常用的一种方式，可能很多企业也都会开所谓的经营分析会。但是我相 大多数企业开经营分析会，也就是把每个月或者每个季度的经营情况说一说，财务报表报一报，我这里说的经营分析思维比这就更深一步，我们需要拨开经营中呈现的表层的那些迷雾，理清里面真正的因果。


    我举一个例子大家就明白了。


    比如：有一家企业的采购总监跟老板说：“老板，我今年为我们公司节省了 1000 万的采购费用，所以年底的绩效奖金我要求要翻倍”。老板一查财务报表，跟去年相比，采购同样的东西，确实价钱少了
    1000 万，质量也没有降低。大家觉得要不要给采购总监奖励？


    其实我们深入分析一看，降低的 1000 万采购成本里面有 800 万是因为铁矿石的价格下降了，还有 200 万是因为采购总监重新梳理了采购流程，并且跟供应商之间达成了良好的关系，拿到了一些新的折扣，以及给对方提供了一些技术改进方案所带来的。因此，1000
    万里有 800 万是铁矿石下降的功劳，是偶然的因素，有 200 万是采购总监的功劳。所以我们说的经营分析，就是分析企业的每一分钱是怎样赚回来的，企业的利润是一个怎样的构成。


    用在我们的生活中，我们要想一想，我们人生中的那些成就，或者我们赚到的钱，有哪一些是我们的能力带来的？哪一些是我们的运气带来的？如果是能力的话，我们应该怎样去总结？怎样去复制经验？怎样再把这个能力提高一点？如果是运气的话，我们就分析，我们是怎样抓住这些运气的，以后能够怎样抓住更多更好的运气。


    可能我们每个人都需要对我们日常的生活、工作做一些分析，因为有些人会把他的成功都归结为自己的能力，这样就会对他未来的工作和生活产生一种错误的引导。他会觉得自己很牛逼，其实有可能
    90% 都是运气好。所以如果一个人对这一点产生了误解，并且他去复制这种经验的话，有可能对他的未来是一个灭顶之灾。


    我们以投资为例，以前房价涨得比较高的时候，可能很多人买了两个房子，结果赚了很多钱。他觉得自己特别厉害，把经验到处复制，结果到房价下跌的时候，搞得血本无归。


    这就是为什么我们要把经营分析的思维做好，用经营分析来分析我们过往的成功到底有哪些是能力，哪些是运气，不要对未来产生误解。


    第 2 个就是我们需要研究过往的成功经验，把它复制推广开。哪些可以推广给别人，哪些可以用于自己的，下一次或者下一年哪些还能够再提高一点。


    就好比写公众号，我要知道很多爆款的文章它是怎么出来的，有很多其实就是碰运气，刚好这个时候大家关注这个问题，然后你又戳中了引爆点，所以就成了一个爆款。有很多公众号作者一辈子可能就写一个爆款，然后他误以为自己是天选之子，投入到这一行业。有可能到最后，做的特别痛苦，而且也赚不到钱。


    所以我一直觉得写公众号写一个 10 万+不算本事，能写两个三个 10 万+，那可能真的是在这一行有一点能力。但同时你还要总结你个文章哪一点戳中了观众，大家点击进来分享，关注你的动机是什么？下一次写的时候就把这些因素用进去。如果你学会了这种经营分析的思路，可能对很多事情都能够起到事半功倍的效果。


    ## 第 4 个思维模式就是结构化思维


    这个做咨询的人通常都需要用到的，用的最多的两个叫做金字塔原理和 MECE 原则，其实两个事情可以说是一个事儿，侧重点有些不同。


    有一本书名字就叫《金字塔原理》，可以说是管理咨询界的一本圣经，只要是入这行的人都会看。


    金字塔原理最重要的一点就是我们不管说话还是写作，演讲表达，最好能够采取一种金字塔式的思考与表达的方式。


    为什么要采取这样的方式？因为人类大脑的结构决定了我们只能够记住结构化的、逻辑比较清晰的、数量有限的东西。


    ### 金字塔原理


    ![](img/74d384fc5d948a0c31090e035208669c_142_0.png)


    所以我们通常会建议采用一个总一分一总的结构，首先是结论先行，然后在这个结论底下说几个原因，一般不能超过 7 个，最后再复述一下你的结论，这样会记得比较清楚，表达的也比较明晰。如果你这样去跟别人说或者写文章的话，那么听众或者读者就能够比较好的获得你想要表达的信息。


    下面我以我们上一次在北京举行加盐星友会的线下聚会为例：


    一位星友，他帮我组织北京聚会，他告诉我：“何老师，小伟周六有其他事，立明要周日才能从东北回来，我们定的咖啡馆是下午 2 点开门，晚上 10 点关门。我这边还要从望京赶过去，时间还挺长的。对了，莺歌说，周日晚上她还要给老公过生日。何老师，您看我们北京星友见面会要不要安排在周日下午
    2:00~6:00？”


    这样说，你能听明白他在说什么吗？我相信绝大多数的人都是一头雾水。


    我们如果换一种表达方式，比如像下面这样：“何老师，我建议咱们的见面会安排在周日下午 2:00~6:00，原因是：小伟、利明、莺歌周日下午都可以过来。小伟周六有其他安排，利明周日从东北回中午才到北京。莺歌周日晚上要给老公过生日。我们定的咖啡馆下午
    2 点到晚上 10 点都可以用。所以我建议就安排在周日下午 2:00~6:00。”


    你看这样一说就清晰的多了。


    平时我们给老板汇报工作或者请示的时候，要经常用金字塔原理的方式，比如我们跟老板说团队要加人，你可以说：“老板，我们的团队需要加人，原因是：第一，我们现在只有三个人，同行做到我们这样的业务规模一般都是
    8 个人。第二，我们现在的工资成本其实并不高，部门的预算还没有用完，还可以加两个人。第三，我们预计下半年市场行情会很好，市场上人才会更加稀缺。如果现在不赶紧招，未来招人会更麻烦。所以我建议我们现在赶紧招两个人进来。”


    这个就是金字塔的表达方式。


    ### MECE 原则


    第 2 个叫 MECE 原则。MECE 原则是咨询界非常常用的一个术语，尤其是在麦肯锡咨询这家公司，你每天都会听到无数次这个 MECE，MECE 的英文原词
    Mutually, Exclusive, Collectively, Exhaustive，要完全穷尽且相互独立，或者我们叫不重不漏。


    它是一种结构化的思考和表达方式，说一些观点或者总结一个东西，我们给它归类的时候，不能重复也不能有遗漏。


    这样说出来就清晰又完整，而且很容易让人理解。


    我先示范一个一点都不 MECE 的例子，比如，领导这样说：“小王，你去仓库给某某医院领 100 套防护服，方便面拿 20 箱，注射器就给 500 件，另外口罩也要
    20 箱，核酸试剂盒拿 100 件。另外你再准备点素食饼干，如果有矿泉水的话也送一些，对了，还要氧气瓶 400 个，还有护目镜，听说眼睛也传播。”


    你要是小王的话，一听这话就完全晕了，不知道领导到底要你干嘛？


    如果是用 MECE 原则，这一段话应该怎么说呢？


    MECE 的表达方法是这样的："王经理，马上准备货车，给某某医院发三样东西，防护用品、医疗器械、食品。防护用品包括三种，防护服 100 套、口罩 20 箱、护目镜
    100 副；医疗器械包括三样，注射器 500 件、氧气瓶 400 个、核酸试剂 100 个；食品包括三样，方便面、素食饼干、矿泉水，各拿 20 箱。"这样就非常的清晰。列个表，他马上就可以按照这个发货了。


    关于金字塔原理和 MECE 原则，这里就不多讲，具体大家可以参阅《金字塔原理》和《麦肯锡意识》，这两本书讲的非常清楚。


    除了上面说的这 4 种思维以外，还有几种特别好的思维方式，也建议大家去了解一下，就是功劳思维、成长思维和平台思维，时间关系这三种我就不展开讲了。我之前在一篇文章里写过，到时候我会把它贴在后面。


    ## 管理咨询的工具及其在日常生活中的应用


    接下来我们来讲一讲管理咨询的工具，以及它们在日常生活中的应用。我这里主要讲这几种：SWOT 分析、BCG、GE、BTOM 模型、四象限分析法和逻辑树。


    ### SWOT 分析


    我们先看 SWOT 分析，SWOT 分析是最经典的一个管理咨询工具，也是用的最多的战略管理和目标管理的工具。


    SWOT 分析具体是指企业的优势（Strengths）、劣势（Weaknesses）、机会（Opportunities）和威胁（Threats），也就是通过两个内部因素，我们的优势和劣势，两个外部因素，外面的机会和威胁，去分析一个企业或者一个人本身所具有的能力，以及所处的环境，把两者结合起来，判断企业和人应该选择什么样的战略方向，或者确定什么样的目标，并分析可以达到什么样的成就。


    可能有些朋友会觉得这个很简单，但实际上你要是把它用好了，是特别好用的。几乎所有的管理咨询公司都会用这个工具。


    我举一个我原来做咨询时候的例子：


    我们帮一家房地产企业梳理战略，最后制定出来战略，他们非常满意。这家企业原来是纯粹做房地产的，我们去做咨询的时候，老板原来想是要在这个行业继续加大投资，我们用了
    SWOT 分析的方法给他做了分析：


    他个人最大的优势是和政府的关系特别好，当地老百姓心中也有比较好的群众基础。劣势是他并没有一个很好的做房地产的团队，他的成功是跟别的公司合作，他把地拿好，别的公司代建代售，他也就是享受地块的红利。


    而他面临的机会是他所在的城市正在进行大规模三旧改造和美丽乡村建设。


    他的风险在哪里？我们给他分析了国家政策，国家三令五申要房住不炒，从政府的规章制度、金融以及各种限购的措施这些方面来限制它。


    我们通过分析告诉他，如果做纯粹的房地产，是会越来越没有前途的。我们为他做了一个新的战略。


    他原来说我要做某某地区房地产行业的龙头，我们给他改成了我要做某某地区城市更新和美丽乡村建设的排头兵。


    大家都知道，这几年房地产商在政府那里其实是没有以前那么受欢迎的。以前只要一个房地产商去政府，所有的官员都捧着它。这几年因为国家一直限制，房地产商去见官员没有以前那么容易，关系也没有那么好。相反，去做美丽乡村、城市改造那些就特别受政府的欢迎。


    我们给他重新定位之后，他到各个地方的政府说，我是专门做城市更新和美丽乡村建设的。那些官员，本来一堆的房地产商在那等，肯定先把他叫过去谈。所以他就发挥他跟政府部门打交道特别厉害的优势，拿了很多三旧改造的地，然后再通过代建的方式去做房地产开发，而不是原来的政府正常地块拍卖，或者从别的房地产商那里买地的这种方式。


    我们做的所有分析对老板触动非常大，他说我以前从来没有想过这些，看了你们这些分析，我思路就特别清晰。


    SWOT 分析除了用在企业管理咨询以外，也可以用在我们生活中去寻找自己的目标。因为我们每个人都有自己的优势和劣势，也一定会在某些方面面临很多的机会和威胁。


    我就以自己写公众号为例。我之前是做咨询的，要做公众号，就得分析我是不适合做自媒体这一行，我有什么优势？我快速学习能力很强，信息挖掘能力很强，文笔也还可以。另外我之前在政府也做过，在咨询公司也做过，有很多经验阅历，也攒了不少人脉关系，这个是我的优势所在。


    但是我也有劣势，我写公众号时间太晚，市场已经过了红火的时期。还有我个人的是一个劣势，我的性格是属于比较内向型的，有社交恐惧症，经常跟人打交道的工作，可能我不是特别擅长。另外我在跟人交往中，是有一点讨好型的人格，不愿意去拒绝别人伤害别人。所以我们做咨询的过程中经常会碰到这样那样的问题，我也不是很擅长拒绝别人，经常会很吃亏。


    第 3 个我做公众号的劣势是我会坚持某一些自认比较清高的东西，不愿意放弃很多原则去一味的迎合市场，所以可能导致在写作的过程中很多东西我不愿意去写，或者我写的东西不一定是市场受欢迎的，比如咪蒙式的写作，我可能完全学不来。因为故意去挑动大众的情绪，这些不是我所擅长的，对写公众号来说这是一个劣势。


    我面临的机会，其实虽然说我入行比较晚是一个劣势，但是我又分析了优质的自媒体的内容非常的稀缺。我感觉这一点不仅是现在，任何时候只要是优质内容它都是稀缺的，在我自己写的过程中也非常明显。每次写了一篇好文章，就有好几百家自媒体要求转载，这使我能够深刻的体会到所有人对优质内容的渴求。如果说我能够持续的创造优质内容，那就是一个非常大的机会。另一个机会就是我写公众号的过程中，有很多人会主动找我，出版社、培训机构等，这些可能也都是我的机会。


    威胁我分析了有这么几个：第一，现在是可以说是快餐化的阅读时代，很多人对长篇大论越来越不感兴趣，尤其是我写的主题还是属于偏严肃的。有一些偏干货类的，有很多人读不下来，他们喜欢的是轻阅读、鸡汤类、幽默类，或者是图文类。所以我写的深度长文，可能会难以获得很大的市场。第
    2 个威胁是现在有很多其他的方式在争夺流量，比如快手抖音都非常厉害，很多人不看公众号了，去看那些。这对我要做这一行来说也是一个威胁。


    做完分析之后，我就需要总结，我到底适不适合做自媒体？我要不要从管理咨询行业换到公众号行业？


    我的性格有一些劣势，在管理咨询这一行会比较吃亏，但我写作上的优势，快速学习的优势，以及查找资料的优势，可能会让我在自媒体这一行有更好的发挥。我要是能够持续地产生优质内容的话，那些威胁并不一定成其为威胁。


    所以最后的结论是：搞自媒体其实是比较适合我的，所以我从去年 3 月份就开始专职的做。事实证明，我的分析是对的。


    ### BCG、GE、BTOM 矩阵模型


    接下来讲一下 3 个模型，这三个模型其实是同一类，所以我就把它归到第二大点，它分别是：BCG 矩阵也叫波士顿矩阵，是由波士顿咨询公司创立的。


    GE 矩阵，也就通用矩阵，是由通用公司创立的。还有一个叫 BTOM 矩阵。这个是何加盐本人创立的。


    我们先来看 BCG 矩阵，它是通过两个维度来判断，你的业务处于什么位置，以及你要花什么样的精力去做。


    #### BCG 矩阵


    - 战略规划项目具有长期盈利能力，可大力发展；

    - 人力资源项目提供较实现金流，段时间内必须维持；

    - IT 项目是未来增长点，但缺乏资金，需要人力资源项目支持；

    - 市场营销项目既无前景，又没赚钱，不如放弃。


    ![](img/74d384fc5d948a0c31090e035208669c_147_0.png)


    纵向的就是以某一个业务的市场发展前景为评价标准，横向的是以你现在在市场上所占有的实力地位为评价标准。


    大家看右边这个表，是以某个咨询公司的业务来分析的，它可以分成 4 块：你的竞争力很强，市场本身也很大的，就是明星业务，对这家公司来说，战略咨询是要大力发扬的。


    你的竞争能力很强，业务也很好的，那就是金牛业务，金牛业务是能够给你的企业带来现金流的，但是它的市场增长前景可能是有限的，所以你不能在这上面投入过多的精力。


    你在这方面不是很擅长，市场也是在逐渐萎缩的，那就叫瘦狗业务，这种就要果断放弃。


    市场增长的速度很快，但是你在这一方面能力不强，这种叫做问题业务。需要你去把这方面的能力增强，让它能够往明星业务变化。


    所以我们一般会建议一家企业用他的金牛业务产生的现金流去补贴问题业务，让问题业务往明星方阵移动。


    第 2 个矩阵叫 GE 矩阵，也就是通用矩阵，其实它跟上面的 BCG 矩阵是同一个意思，只不过它分的更细，分成 9 个方块。


    #### GE 矩阵


    ![](img/74d384fc5d948a0c31090e035208669c_148_0.png)


    具体的内容上面都有，我就不再说。它也是两个维度，第 1 个是市场的发展前景，第 2 个是在这个业务中你企业的能力大小，比如我们曾经做过咨询的某一家食品企业，它也有很多不同的业务，我们分析之后就会告诉他，你的哪一个业务应该保持优势，哪个业务应该收缩，哪个业务应该选择性的成长。


    在我们有不同选择、不同能力的时候，可以通过这些矩阵来分析该重点在哪个方向发力，可以放弃哪些方面的机会。


    但我个人一直觉得，不管是波士顿矩阵还是通用矩阵都很大的缺陷。它只分析你现有的能力和市场发展前景，却没有分析这个业务跟你的战略是否相关，是不是你很想做的？所以我就修改了一下，创造了一个
    BTOM 模型。


    #### BTOM 模型：不同业务的发展策略


    考量维度：


    **1. 各业务的战略重要性**

    - 与企业愿景、使命、价值观的匹配性;

    - 与企业品牌、形象的关联性;

    - 与政策引导方向及市场发展趋势的一致性;

    - 与企业内部其他业务协同性。


    **2. 各业务的盈利能力**

    - 营收占企业总营收的比重;

    - 净利润率;

    - 近期盈利增速;

    - 预期未来盈利增速。


    Business Trade-Off Model


    | 战略重要性 | 盈利能力 | 业务类型描述 | 策略建议 |

    | :--- | :--- | :--- | :--- |

    | 高 | 高 | 盈利很强且更重要 | 投入重点资源全力扩张，抢占市场份额 |

    | 高 | 中 | 盈利一般但较重要 | 优先扩张，提升盈利 |

    | 高 | 低 | 不盈利但战略重要 | 需其他产业维持，适度保障 |

    | 中 | 高 | 盈利很强且重要 | 稳健发展，不占用过多战略资源 |

    | 中 | 中 | 盈利一般但较重要 | 根据战略稳定发展 |

    | 中 | 低 | 不盈利但较重要 | 用较少的资源保障运营，提升盈利能力 |

    | 低 | 高 | 盈利很强但不重要 | 维持优势，向重要产业输送 |

    | 低 | 中 | 盈利一般且不重要 | 有限收缩，逐步收缩业务，将资源转向其他产业 |

    | 低 | 低 | 不盈利且不重要 | 全面放弃，应果断放弃 |


    当一个企业有很多业务的时候，他应该重点发展哪一个扶持哪一个，放弃哪一个？跟我们人一样，你有很多能力，有很多机会的时候，应该重点发挥哪一个能力，抓住哪个机会，放弃哪些机会？


    这是从盈利能力和战略重要性两个维度来分析的，我把它画成了9个方块，这个文字都非常清晰，我就不再一一叙述了。


    我曾经用BTOM模型给一家多元化的企业做过一次分析。这家企业有很多业务，老板没有想清楚，有一些业务他很想做，但是我给他一分析，这个业务其实是在左下角，我就建议他还是不要做了。有一个右下角的业务老板一直想大力把它做大做强。我们分析之后，它对企业的战略其实没有多大的作用，只要维持它就行了。相反左上角的很多东西跟农业相关的，是需要重点扶持的。所以经过我们这样梳理之后，老板就知道了我这里有大产业，我应该重点做哪一个，放弃哪一些。


    其实BTOM模型对我们每个人分析自己的情况非常有用，因为我们肯定有各方面的能力，面临很多的机会。


    我以自己为例，我可以继续做咨询，可以花大力气写作，可以搞一些培训或是知识付费，甚至我可以去做投资，亦或是到哪个企业去任职。


    我会根据九宫格来分析到底应该是哪一个？每个业务应该放在哪个格子里，然后做出决策。这只是给大家做一个例子，大家可以分析自己的情况，对

    '
