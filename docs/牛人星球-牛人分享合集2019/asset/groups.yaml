    # 2019 年牛人星球


    ## 牛 人 分 享


    **消息对象**：何加盐知识星球 2019 年会员

    **分享人**：何加盐邀请的各位嘉宾

    **时间**：2019 年 6 月 - 2020 年 5 月

    **公众号**：懒人找资源


    ## 前言


    大家好，我是何加盐。


    感谢你陪伴牛人星球走过了第一年。


    这一年，我们总共做了 21 期牛人分享，其中 18 期转录成文字，做成合集，共计 15 万字，就是你现在看到的这份文档。


    分享的牛人中，除了何加盐以外，还有各个领域的专家。他们给我们奉献了非常精彩的知识大餐，让我们得以了解内幕知识、学到成长干货、获得人生感悟……


    我们有：

    - 风险投资公司核心高管，讲述投资人眼中的创业者；

    - 经历了美团爆发式增长的城市经理，讲美团如何管理团队；

    - 把孩子送到清华上学、谷歌工作的大学教授，给我们讲家庭教育；

    - 公众号超级大号的前运营总监，讲如何做线上产品；

    - 清华毕业的驻非洲记者，为我们介绍中国人在非洲的生活与事业；

    - ……


    当然，作为星主，何加盐也精心准备了 4 次课程，分别是：

    - 公众号深度写作方法；

    - 如何用弱关系创造未来；

    - 管理咨询思维与工具的日常应用；

    - 领导力的三个误区与三个层次。


    这些分享和课程，每一期都很有价值，值得我们再三品味。我们建议你把特别有感触的打印出来，时不时复习一下。


    我们的星球叫“牛人星球”。我希望，它既研究牛人、又能聚集牛人，更能让大家变成牛人。何加盐可以做前面两步，但是第三步，需要靠你一起努力。


    我们并不求能够成为马云或王兴，但是，如果我们每一个今天，都能比昨天变得更牛一点，那我们就都是自己生活的牛人。


    再次感谢你的支持。


    在变得更牛的路上，何加盐与你同在。


    ## 目 录


    1. 公众号深度写作方法……1

    2. 85 后小夫妻如何在广州购买三套房——用资本的思维做好财富管理……17

    3. 浅谈精准营销的两个翅膀——心智与数据……27

    4. 投资人眼中的创业者——创业要怎样才能更容易成功？……41

    5. 我女扮男装流浪了几个月，有几点人生感悟……50

    6. 用印象笔记搭建一个终身受用的写作系统……55

    7. 我是如何管理 1500 名外卖小哥的——美团外卖崛起过程揭秘……65

    8. 9.9 元的线上训练营如何卖出 12800 元一份的产品……76

    9. 如何用弱关系创造未来……85

    10. 珠宝的鉴别……97

    11. 儿子清华毕业、美国留学、谷歌总部工作——我的 5 点家庭教育体会……105

    12. 谈一谈我理解的价值投资……114

    13. 为什么跨国公司领导人多印度裔……126

    14. 管理思维与工具在日常生活中的应用……134

    15. 如何教育小孩……154

    16. 如何做好时间管理……166

    17. 派驻非洲三年见闻——中国企业和中国人在非洲的商业与生活……184

