    # # 如何用弱关系创造未来


    分享人：何加盐


    时间：10 月 29 日


    各位牛人星球的星友，大家晚上好！


    非常感谢大家等到十点钟来听我这个分享，今天的分享大概需要 45 分钟。


    咱们今天分享的标题是：如何用弱关系创造未来。那么这里就有一个概念，什么是弱关系？


    可能有很多朋友，之前都或多或少听过这个概念，但也有些人没听过，我就再介绍一下。所谓弱关系，是跟强关系对应的、我们平时经常接触的人。像我们的亲戚、朋友、同学，这些都有自然的强联系，我们就叫它强关系；与此相对的，就是我们平时通过业务、偶遇或某一次聚会上偶尔碰到的、联系比较少的这样的一些关系，就叫做弱关系。


    弱关系这个概念，首先是美国的一个教授格兰诺维特提出的。他当时研究斯坦福大学毕业生的就业机会是怎么找的，发现大部分的学生，其实是通过弱关系才找到工作的，所以就提出了强关系和弱关系这么一个概念。


    格兰诺维特认为，在现代人找工作的过程中，弱关系比强关系更有效。后来，这个概念得到了很多的印证。


    另外有三位学者，也是美国人，他们利用英国伦敦的一些数据做了一个研究，也跟弱关系有关。


    他们拿到了伦敦的电信数据，每个小区的人打电话可能会打往不同的小区，他们就分析每个人打电话跨小区的流动量有多少，最后得出了一个结论，用下面的这个图给大家看一下。'
  - '[PAGE 88]


    ![](img/74d384fc5d948a0c31090e035208669c_88_0.png)


    从这张图我们可以看出一个信息，它的纵坐标（也就是垂直方向），代表了每个人的社会经济地位，横坐标（也就是水平方向），是每个人关系的多样性。也就是说，越往右边，他的弱关系就越强；越往上边，他的经济社会地位就越高。


    我们可以非常明显看出，一个人的关系复杂性跟他的社会经济地位是紧密相关的。可以很明确地说，你的弱关系越强，你的社会经济地位就越高。也可以说，你的弱关系越多，你就会越有钱。


    从格兰诺维特以及英国伦敦的这个研究，我们可以得出弱关系对我们的重要性。


    为什么会有这个重要性呢？我们仔细分析一下可以发现：强关系的本质是我们血缘关系的连接，或者是类血缘关系的连接，同学、老乡，这种叫类血缘关系。但是弱关系它的本质其实是信息的流通。我们不断地结识新朋友，通过他们获得新的信息，这就是弱关系和强关系的区别。


    曾经有一个社会学家叫做邓巴，他得出一个结论：因为我们人的大脑容量有限，计算效率有限，所以人的一生中最多能够维持 150 个人左右的强关系。我们平时认识的所有其他人，我们要获得所有其他的信息，都只能通过弱关系来体现。这是人类大脑的局限性决定的。


    在农业社会，我们人类一般都是被土地栓在一个地方。我们平时认识的'
  - '[PAGE 89]


    人，都是宗族里面的人，最多就是加上母亲或者妻子那边的亲戚。可能有一些进京赶考的或者外出打仗的人，他认识的人会多一点，但是这种在所有人当中占的比例是极少数。因此，农业社会，我们几乎所有的关系都是强关系，而且我们也没有必要得到外界那么多信息，因为我就种田，看一下季节，看看太阳、月亮的升起，然后看看周围宗族的人是怎么过的就可以了。


    但是到了工业社会就不一样了，我要知道物资的信息、人员流动的信息，这样才能安排好生意以及生产。所以，到了工业社会，弱关系就已经变得比强关系更重要了。


    到了信息社会之后，我们的强关系几乎不能给我们提供什么新鲜的信息，因为我们平时经常跟强关系在一起，我们得到的信息，我们看到的事物都是一样的，我们从强关系那里很难得到新鲜热辣的信息。所以，在信息时代我们几乎所有的信息都是从网上或者报纸，杂志这些地方来的，或者是通过一些弱关系传播给我们的，比如说我们在朋友圈看到的。


    上面讲的这些，就是想让大家有一个概念，为什么弱关系变得如此重要？为什么我们要重视弱关系？对我们来说，弱关系具体有什么样的作用呢？这里，我想用几个例子来说明一下。


    首先就是马云。大家都知道马云建立了阿里巴巴，现在是中国首富。他最开始是怎么样去创立阿里巴巴的呢？


    其实马云年轻的时候，对外部的世界也是一无所知。后来他为了学英语，到西湖边到处去找外国人聊天。十二岁的时候，聊到一个外国人叫做肯·莫利。莫利是个澳大利亚人。他们事先完全不认识，结识之后，两个人成了好朋友。莫利就邀请马云到澳大利亚去旅游，这是马云第一次开眼看世界。


    那个时候还是 80 年代初，我们中国内地当时还非常穷，可以想象马云出国之后受到了多大的冲击，很多观念都改变了。很多年之后，他是这样回忆的，他说：我在澳大利亚的那
    28 天，让我见识到一个完全不同的世界，这改变了我，如果没有当时这 28 天，就没有现在的我。


    所以 我们说弱关系的第一个作用就是开拓眼界。


    除了肯·莫利带马云开拓了眼界之外，他后来招揽的得力助手蔡崇信，也是弱关系。那时，台湾一个朋友，本来是想来入资马云的公司，认识了马云，'
  - '[PAGE 90]


    他就请蔡崇信来帮忙考察。所以对马云来说，蔡崇信是弱关系介绍的弱关系。后来他把蔡崇信招入麾下，把这个弱关系变成强关系，最后他们共同创造了伟大的事业。我们现在可以说阿里巴巴的成功，起码在早期是有蔡崇信一半的功劳的。蔡崇信本人通过这个弱关系，现在是加拿大的第二大富豪，财产有
    200 多亿美元。这是马云和蔡崇信的弱关系的实践。


    下一个例子，我想讲得还是一个杭州人。和马云一样，他是我的师兄，黄峥。


    黄峥是 2002 年，在浙大读书，他上的是浙大混合班，就是尖子班。他学的具体专业是计算机，经常在网上写一些关于技术方面的文章。


    有一天，黄峥上 MSN，突然有一个人加他的好友说：我看到你在网上写的文章，正好我有一个关于技术方面的问题，要请教一下。他俩就这样聊起来。找他的这个人叫丁磊，就是网易的创始人，他跟黄峥打完交道之后，觉得这个人还不错，很有能力，又很热心，自己欠了他一个情。


    黄峥不久之后要到美国去留学，可能是也想还这个情，丁磊跟我说我给你介绍一个朋友认识，就介绍了给段永平。


    可能有些朋友不一定知道段永平是谁，这么说吧，他也有可能是中国最厉害的一个隐形富豪。当年的步步高就是她创立的，后来的 oppo、vivo 都是她的手下创立的，由此你就可以知道他有多么厉害。


    他当时是网易的一个投资人。网易因为经历互联网泡沫，股价跌到了几分钱。是段永平注资，帮丁磊渡过难关。后来网易的股价又回升，段永平大赚一笔。


    由于丁磊和段永平有这层关系，黄峥要去美国的时候，丁磊就介绍段永平给他认识。


    我们知道，黄峥跟丁磊就是通过 MSN 认识的，是典型的弱关系。然后丁磊又介绍段永平，黄峥和段永平就更是弱关系了。但是，黄峥见到段永平之后，也把段永平给征服了。段永平一看，这个小伙子真不错，就跟他成了忘年交。


    黄峥硕士毕业的时候要找工作，他当时有两个 offer，一个是去微软，一个是去谷歌。那个时候零几年，谷歌刚成立没多久，才几百号人，是个小公司。但段永平就建议黄峥，说微软是老牌公司，已经过时了，谷歌前途无量，'
  - '[PAGE 91]


    你还是去谷歌吧。黄峥就听了他的话，去了谷歌，还分到了一些股权。结果过了没两年，谷歌上市了，黄峥一下子就实现了财务自由。


    另外一个段永平对黄峥的帮助，是带他见了巴菲特。段永平有一年花了 60 多万美元，拍到了跟巴菲特共进午餐的机会，可以带一个人，他就带了黄峥。


    至于在饭桌上黄峥跟巴菲特请教了什么，我们就不知道了。只知道不久之后，黄峥回国了，在李开友的手下干了一年多，然后就一直自己做创业了。他先是帮助段永平卖了一大段时间手机，然后创立了一家新的公司，叫拼多多。现在拼多多按照市值算的话，已经成为中国第四大互联网公司了，他的平台年销售额也就是
    GMV 已经超过了京东，是中国仅次于阿里的第二大电商公司。


    从黄峥的故事，我们就可以得出一个结论：弱关系可以带来很好的事业机会。


    这里还有一个例子：有一个 APP 叫做脉脉吗，是一个叫林凡的人创立的。林凡创立脉脉之后，他自己常在脉脉上面逛，认识了一个叫牛奎光的人。牛奎光刚好是个天使投资人，经过接触了解，牛奎光就投了一笔资金给脉脉，后来脉脉做成功了。牛奎光好像是投了
    200 万美元，后来变成了 20 亿美元。无论是对创业者林凡而言，还是对投资人牛奎光而言，这都是弱关系带来的很好的事业机会。


    第三个例子，我要讲的是摩拜单车的创始人胡玮玮。


    胡玮玮是一个记者，也是一个八零后。其实她的出身背景很一般，大学是一个三本的学校。毕业后做记者，做了挺多年，月薪从来没有超过 1 万。但是她有一个很厉害的特点，作为财经记者，经常会采访一些成功的人士，她的厉害之处就在于采访之后，还能够跟被采访人保持良好的私人关系——很多财经记者采访完了，对方也就不认识他了，也就不联系了，胡玮玮的厉害之处就是还能一直保持联系，并且能够把人请出来吃饭。


    所以后来她在北京做了一个汽车网站，叫做 GeekCar，她就租了一个四合院，经常邀请一些人来聚会。邀请的人里面有一个叫李斌，这个李斌很厉害，他创立过两家公司，并且都上市了，自己也做一些投资。当时其实是他先有一个想做共享单车的想法，当然有一些文章说是胡玮玮先有的，不管是谁先有吧，反正李斌也想做这个事儿。他自己有钱，有人脉，就是想找一个人替'
  - '[PAGE 92]


    他把这个事儿撑起来，他找了一圈，想到了胡玮炜，他觉得胡炜这个人特别厉害，能够召集很多的人脉关系，把他们聚拢在一起。所以他就找胡玮炜谈这个事儿，胡玮炜自然同意，他们就一起把这个事儿做起来了。胡玮炜后来的很多技术人员、管理人员，都是当时聚会的圈子里的人。


    我们从胡玮炜这个例子得出的启示：弱关系可以成为你实现梦想的一个平台。


    其实，我们在社会上可以看到有很多人，他做事看起来并不比我们自己辛苦，但是得到的东西却比我们自己多得多；我们辛辛苦苦拼死拼活，每个月却只能赚一点点工资。大家有没有想过为什么？


    可能很大的原因，就是因为别人比我们自己更善于利用社会的网络资源，比我们自己更擅长于利用掌握的资源去构建和经营他的事业。所以他不仅可以用自己自己的努力，还可以通过弱关系去撬动一些平台跟系统，放大努力的效果，这就是弱关系的力量。而我们要是只靠自己的话，肯定是比不过他们的。


    其实，我本人建立牛人星球，也是抱着打造一个弱关系平台的目的，可能很多朋友也会发现，牛人星球也是一个开拓眼界的小平台，因为我们会有很多牛人在上面分享，以及大家平时在群里讨论的一些东西，都是开拓眼界的机会，甚至可能会带来一些事业的机会。


    我看到有一些朋友在线下交流，还有人在里面找工作，有人在里面招工，或者互相达成合作的，都有。所以牛人星球也是一个带来事业机会的平台，我更希望它能够成为大家实现梦想的一个平台，这个就要靠大家共同努力了。


    讲完了弱关系的作用，下面我们来讲一讲，怎样才能够开拓弱关系、利用弱关系。


    这里涉及到这么几个要素：第一个是意识；第二个是平台；第三是行动；第四是技巧。我们逐开展开来说。


    首先，我们要认识到弱关系的重要性，以及它对我们产生什么样的作用，这样你才能够有冲动去寻找弱关系。


    我建议我们平常人平常都要保持对弱关系的饥渴，为什么呢？你一想为什么我们没有一个好的强关系？其实不就是因为我们的上一辈没有好好的经营他们的弱关系吗？我们如果好好的经营我们自己的弱关系，并且把他们转化为'
  - '[PAGE 93]


    好的强关系，是不是在我们后代要找工作、上学或创业的时候，就能够有一个比较好的强关系呢？那他就不用那么费心费力的去找弱关系了。


    这是说到对下一代的好处，其实我们个人平时的交往，还有事业的发展，生活变得更美好，都是要有良好的弱关系来维持的，所以我们一定要时时刻刻保持对弱关系的饥渴状态。


    我发现很多人，他平时就只在自己的强关系圈子里打转，这对事业的发展，对生活圈子的拓展，对你的幸福感其实都是都是很局限的。


    我经常会把寻找弱关系打一个比方，就好比我们在谈恋爱或者求偶。第一步，你肯定是要有对异性的渴望，但也有部分同志是对同性的渴望，这都没关系，总而言之，你要首先要保持饥渴。


    之后，我们要寻找一些机会去接触异性。比如你要有一些好的平台，或者是要有一个媒婆。我们拓展弱关系也同样如此，你可能需要有一些中介，或者需要有一个平台。


    有哪些平台呢？其实现在网络时代，网上的平台是最便捷的。比如说我们的微信群、朋友圈、微博、公众号、知乎、豆瓣、脉脉、领英等等，所有的这些社交网站都可以。


    我当年做经济研究工作的时候，很多问题不光是自己研究，也要跟很多经济学家、企业家、学者交流，我很多朋友其实也是通过微博、微信找的，其中还有一个是咨询界的一位大佬。我也是在他的启发和鼓励下才从政府部门跳出来做的咨询公司。如果没有这个弱关系的拓展，我可能不会从政府部门跳出来，这也是弱关系对我自己人生道路起到的作用。


    除了线上的平台以外，还有很多线下的资源，像我们参加一些行业聚会，或者自己组织的一些读书会，或者我们牛人星球的区域性的聚会，甚至你去参加一个牌局，一个KTV聚会，都是认识弱关系的好的平台，好的机会。


    我认为对于怎么样利用平台这个事情有四个层次。第一个层次是我不知道可以去用这些平台，脑子里完全没这个意识；第二个层次是我知道了可以用平台，但不知道有哪些平台，以及该怎么用；第三个层次，就像我们现在这样，我们知道了可以用平台去拓展弱关系，也知道了有哪些平台，你要怎么用；第四个层次，最高的层次，我们可以自己去创造一个平台，去聚拢弱关'
  - '[PAGE 94]


    系。


    像我前面讲到的胡炜炜，她就是自己在北京租了一个四合院，每天就在那里搞沙龙，找几帮朋友过来，然后朋友带朋友，朋友的朋友带朋友。所以很多他的技术人员和管理人员，都是在那个沙龙上认识的。


    我自己写这个公众号以及组建牛人星球，对我来说也是创造了一个弱关系的平台，所以我也能够认识到大家。我知道大家里面也是藏龙卧虎，这个对我来说也是很好的一个弱关系的拓展。我们平时自己也可以创建一个公众号、做一个微博、组织一个线下的分享会等等，其实都是第四层次的创造平台的尝试。


    所以，如何开拓弱关系的第三点，就是你一定要付诸行动。你光有意识，知道有平台，是没有用的，你一定要动起来。


    一般来说，要拓展好的弱关系，我们需要去到一些优质的地方。什么叫优质的地方呢？从地区来讲，像北上广这些一线城市，或者说美国的硅谷华尔街，或者清华北大这样的学校，如果有那样的平台，那样的圈子，我们往那些地方去，一定有优质的弱关系在那里。


    我们知道弱关系在哪里之后，就一定要自己主动的去开撩，像谈恋爱一样，你得迈出第一步。去找人，要微信或者写情书等等，你不能等着别人来追你。


    所以拓展弱关系，我不能等着别人，尤其是那些优质的弱关系，让他来主动找我，这是不现实的。你一定得行动、行动、再行动。比如说，你看到一个好的公众号，你在后台留言，去跟他的号主认识，这也是一种尝试。我当时在微博上就是这样的，我看到那些厉害的经济学家、企业家，我就会去给他们留言或者发私信，由此认识了很多好的朋友。


    其实咱们牛人星球的星友们，在这一点上已经有所行动了，你们加入牛人星球，不就是一个主动开拓弱关系的尝试吗？但是我也要说一下，有部分新群友在群里，以及在星球上是比较沉默的，这样就浪费了这个机会，入宝山而空手归。我建议，我们看到一些厉害的朋友，要主动去加他的微信，主动去跟他结交。


    第四点，我们要学习如何开拓弱关系的技巧。开拓弱关系，不仅仅是开拓'
  - '[PAGE 95]


    一个人脉，更是考验一个人的综合能力。要开拓好的弱关系，我们为人处事、演讲、写作等等各方面的能力都需要提升。开拓弱关系，并不是一个绝招教给你，然后你马上就能够开拓弱关系。一个人拥有好的弱关系，最主要是自己有这个实力带来的。


    弱关系的结交，需要三个能力。


    第一是发现能力，要善于发现弱关系在哪里，发现拓展弱关系平台在哪里；第二是学习能力，要善于学习牛人，学会向他们靠拢，观察他们的为人处事、语言表达等这些方面，他们是怎么做的；第三是表达能力，包括文字表达能力以及语言表达能力，这样有了好的弱关系，你才能够和他良好沟通，让对方信任你，接纳你。只有具备了发现，学习，表达这三个能力，才能好好地去结交那些弱关系。


    结交弱关系并不是我们的最终目的，我们的最终目的是两个：第一个是从弱关系那里获得新鲜的信息，所以要经常跟他们交流。第二个是把优质的弱关系转化为强关系。


    其中第二个可能更重要一点，像黄峥，马云，他们都是因为能够把弱关系转化为强关系，让后让强关系为自己所用，最后才成就了很成功的事业。所以我们不是为了弱关系而去结交弱关系，而是为了把弱关系变成强关系。


    怎么变成强关系呢？其实我之前写过一篇文章，是讲影响力的，这个也可以套用到强关系这一块。


    文章的标题是《肤挨还是色诱？搞定一个人的五个层次》。我在这篇文章里提到了五个方面：


    第一层次是暴力。这个在我们这里面不大适应，我就不多讲了，暴力威胁。


    第二个层次是金钱。其实很多弱关系，最初我们都是通过金钱拉拢的，这个并没有什么不妥。在社会上，你想要人家认可你，你得先付出你的真诚，而真诚往往就是首先通过物质利益让别人感知到。


    第三个层次是善于利用自己的理性能力，就是你向别人展示你的智慧和你的逻辑推理，或者信息收集等等方面的能力，让别人知道，你能够掌握一些不同的信息，或者能够提供不同的看问题的角度，或者你看一个事情看得很准，'
  - '[PAGE 96]


    或者分析一个问题分析得特别透彻，通过这样一些理性能力让别人感知到，你 对他是有价值的，这样他会主动地希望能够把你们两个人的关系加强。


    第四个层次是建立感情，就是情感方面的交流了。建立感情的方法有很 多，最主要的是要保持沟通，多交流。如果你结识了一个弱关系，但是很久不 联系，那感情就淡了。尤其是优质的弱关系，时不时得问候一下，人家有什么
    事情，你帮人出出主意，或者是帮个小忙，这样一來一去，大家建立了一个平 常的联系，然后有空的时候一起喝喝酒，打打牌；如果能够找到一些共同的爱 好，尤其如果是能够跟对方的家人也建立一个联系，你们两个人之间这种感
    情的联系就建立起来了，弱关系自然也就转化为强关系了，关键要保持沟通的 频率和深度。


    第五个层次是价值观和情怀。这个层次建立起来的强关系是最紧密的。你 们共同为一个事业去奋斗，有一个共同目标，或者你们价值观很相近的时候， 这个时候就很容易把弱关系变成强关系。比如说一个人，他特别爱狗，我告诉
    他我也是爱狗之人，我们共同去声讨那些吃狗肉、虐狗的行为；或者我知道一 个人很爱环保，我就跟他一起谈环保，我们怎么样让世界变得更美好。还有很 多，尤其是政治和宗教方面，你们的共同价值观、政治立场、意识形态就更容
    易把人绑定在一起。请注意，这里我不建议大家扭曲自己的价值观去迎合别 人，但是如果是一个特别重要的弱关系，在某些场合之下，你总可以找到和他 价值观在某些方面一致的地方，我们也可以去稍微展示一下我们认同他的价值
    观，这样有利于拉近共同之间的关系，有时候为了更好地达到你的一个善意的 目的，这个是可以的。


    我们把上面提到的这些总结一下，怎么样去开拓弱关系呢？


    如果你很有实力，那你就用你的实力说话。绝对实力可以碾压一切技巧， 什么技巧都不用，有实力，弱关系自然会找上门来。就像黄峥一样，我就是技 术很强，那丁磊就来找我帮忙，我帮他解决问题，他就会帮我介绍更好的弱关
    系，这是实力的体现。


    那如果没有实力怎么办呢？我们学马云，用我的热情去感染人。马云十几 岁的时候，就交到澳大利亚那个朋友，那时候的马云没有任何实力，他就是用 自己的热情去感染对方，结果和对方成了好朋友。后来马云上大学的钱都是那'
  md: '

    作中来，这就是学习、习得以及去运用。


    有一个很专业的名词叫做知识迁移，知识迁移在我们生活中变得很重要。比如，你看到一个公司做这个事情做得很好，你把它学习过来了，能不能在你的企业也用起来；有人在这个方面做的很好，那能不能在你的生活中应用起来。知识迁移是一个很重要的个人素养。在个人发展、生活中、企业中、职场中，当碰到瓶颈的时候，知识迁移是一个非常好的方法，能够帮助你走出困境。


    今天来听这个分享的朋友们，也许在个人成长方面有一些思考。尤其是在企业经营上面有些思考，希望今天的交流，能够给大家带去一些启发，我就非常的开心了。当我们在一个固定的思维里遇到瓶颈的时候，应该尝试跳出这个思维圈，找到新大陆。


    我们总结一下，当我们去设计产品的时候，一定要去想清楚它背后的原理，而这个原理最重要的一点就是它的需求一定是刚需的，而且是容易被激发的。


    第二就是整个产品设计的时候一定要去做一些技巧，以及运用心理学知识帮助这个产品变得更加有逻辑。


    第三点就是我们在业务发展有一定阶段的时候，一定要去思考一些问题帮助我们的业务去探索第二增长曲线。第二曲线的由来往往是来自于创新，而这个创新很有可能来自于同行或者是他行，这个时候一定要去运用知识迁移。


    我们今天的分享就到这里，如果大家有问题的话可以跟我交流。最后给大家抛一个比较尖锐的问题：如果你想要实现一个毕生的梦想，唯一的办法是需要你去行骗5年赚取第一桶金，你会去做吗？


    ## 如何用弱关系创造未来


    分享人：何加盐


    时间：10月29日


    各位牛人星球的星友，大家晚上好！


    非常感谢大家等到十点钟来听我这个分享，今天的分享大概需要45分钟。


    咱们今天分享的标题是：如何用弱关系创造未来。那么这里就有一个概念，什么是弱关系？


    可能有很多朋友，之前都或多或少听过这个概念，但也有些人没听过，我就再介绍一下。所谓弱关系，是跟强关系对应的、我们平时经常接触的人。像我们的亲戚、朋友、同学，这些都有自然的强联系，我们就叫它强关系；与此相对的，就是我们平时通过业务、偶遇或某一次聚会上偶尔碰到的、联系比较少的这样的一些关系，就叫做弱关系。


    弱关系这个概念，首先是美国的一个教授格兰诺维特提出的。他当时研究斯坦福大学毕业生的就业机会是怎么找的，发现大部分的学生，其实是通过弱关系才找到工作的，所以就提出了强关系和弱关系这么一个概念。


    格兰诺维特认为，在现代人找工作的过程中，弱关系比强关系更有效。后来，这个概念得到了很多的印证。


    另外有三位学者，也是美国人，他们利用英国伦敦的一些数据做了一个研究，也跟弱关系有关。


    他们拿到了伦敦的电信数据，每个小区的人打电话可能会打往不同的小区，他们就分析每个人打电话跨小区的流动量有多少，最后得出了一个结论，用下面的这个图给大家看一下。


    ![](img/74d384fc5d948a0c31090e035208669c_88_0.png)


    从这张图我们可以看出一个信息，它的纵坐标（也就是垂直方向），代表了每个人的社会经济地位，横坐标（也就是水平方向），是每个人关系的多样性。也就是说，越往右边，他的弱关系就越强；越往上边，他的经济社会地位就越高。


    我们可以非常明显看出，一个人的关系复杂性跟他的社会经济地位是紧密相关的。可以很明确地说，你的弱关系越强，你的社会经济地位就越高。也可以说，你的弱关系越多，你就会越有钱。


    从格兰诺维特以及英国伦敦的这个研究，我们可以得出弱关系对我们的重要性。


    为什么会有这个重要性呢？我们仔细分析一下可以发现：强关系的本质是我们血缘关系的连接，或者是类血缘关系的连接，同学、老乡，这种叫类血缘关系。但是弱关系它的本质其实是信息的流通。我们不断地结识新朋友，通过他们获得新的信息，这就是弱关系和强关系的区别。


    曾经有一个社会学家叫做邓巴，他得出一个结论：因为我们人的大脑容量有限，计算效率有限，所以人的一生中最多能够维持150个人左右的强关系。我们平时认识的所有其他人，我们要获得所有其他的信息，都只能通过弱关系来体现。这是人类大脑的局限性决定的。


    在农业社会，我们人类一般都是被土地拴在一个地方。我们平时认识的人，都是宗族里面的人，最多就是加上母亲或者妻子那边的亲戚。可能有一些进京赶考的或者外出打仗的人，他认识的人会多一点，但是这种在所有人当中占的比例是极少数。因此，农业社会，我们几乎所有的关系都是强关系，而且我们也没有必要得到外界那么多信息，因为我就种田，看一下季节，看看太阳、月亮的升起，然后看看周围宗族的人是怎么过的就可以了。


    但是到了工业社会就不一样了，我要知道物资的信息、人员流动的信息，这样才能安排好生意以及生产。所以，到了工业社会，弱关系就已经变得比强关系更重要了。


    到了信息社会之后，我们的强关系几乎不能给我们提供什么新鲜的信息，因为我们平时经常跟强关系在一起，我们得到的信息，我们看到的事物都是一样的，我们从强关系那里很难得到新鲜热辣的信息。所以，在信息时代我们几乎所有的信息都是从网上或者报纸、杂志这些地方来的，或者是通过一些弱关系传播给我们的，比如说我们在朋友圈看到的。


    上面讲的这些，就是想让大家有一个概念，为什么弱关系变得如此重要？为什么我们要重视弱关系？对我们来说，弱关系具体有什么样的作用呢？这里，我想用几个例子来说明一下。


    首先就是马云。大家都知道马云建立了阿里巴巴，现在是中国首富。他最开始是怎么样去创立阿里巴巴的呢？


    其实马云年轻的时候，对外部的世界也是一无所知。后来他为了学英语，到西湖边到处去找外国人聊天。十二岁的时候，聊到一个外国人叫做肯·莫利。莫利是个澳大利亚人。他们事先完全不认识，结识之后，两个人成了好朋友。莫利就邀请马云到澳大利亚去旅游，这是马云第一次开眼看世界。


    那个时候还是80年代初，我们中国内地当时还非常穷，可以想象马云出国之后受到了多大的冲击，很多观念都改变了。很多年之后，他是这样回忆的，他说：“我在澳大利亚的那28天，让我见识到一个完全不同的世界，这改变了我，如果没有当时这28天，就没有现在的我。”


    所以，我们说弱关系的第一个作用就是开拓眼界。


    除了肯·莫利带马云开拓了眼界之外，他后来招揽的得力助手蔡崇信，也是弱关系。那时，台湾一个朋友，本来是想来入资马云的公司，认识了马云，他就请蔡崇信来帮忙考察。所以对马云来说，蔡崇信是弱关系介绍的弱关系。后来他把蔡崇信招入麾下，把这个弱关系变成强关系，最后他们共同创造了伟大的事业。我们现在可以说阿里巴巴的成功，起码在早期是有蔡崇信一半的功劳的。蔡崇信本人通过这个弱关系，现在是加拿大的第二大富豪，财产有200多亿美元。这是马云和蔡崇信的弱关系的实践。


    下一个例子，我想讲得还是一个杭州人。和马云一样，他是我的师兄，黄峥。


    黄峥是2002年，在浙大读书，他上的是浙大混合班，就是尖子班。他学的具体专业是计算机，经常在网上写一些关于技术方面的文章。


    有一天，黄峥上MSN，突然有一个人加他的好友说：我看到你在网上写的文章，正好我有一个关于技术方面的问题，要请教一下。他俩就这样聊起来。找他的这个人叫丁磊，就是网易的创始人，他跟黄峥打完交道之后，觉得这个人还不错，很有能力，又很热心，自己欠了他一个情。


    黄峥不久之后要到美国去留学，可能是也想还这个情，丁磊跟我说“我给你介绍一个朋友认识”，就介绍了给段永平。


    可能有些朋友不一定知道段永平是谁，这么说吧，他也有可能是中国最厉害的一个隐形富豪。当年的步步高就是他创立的，后来的OPPO、vivo都是他的手下创立的，由此你就可以知道他有多么厉害。


    他当时是网易的一个投资人。网易因为经历互联网泡沫，股价跌到了几分钱。是段永平注资，帮丁磊渡过难关。后来网易的股价又回升，段永平大赚一笔。


    由于丁磊和段永平有这层关系，黄峥要去美国的时候，丁磊就介绍段永平给他认识。


    我们知道，黄峥跟丁磊就是通过MSN认识的，是典型的弱关系。然后丁磊又介绍段永平，黄峥和段永平就更是弱关系了。但是，黄峥见到段永平之后，也把段永平给征服了。段永平一看，这个小伙子真不错，就跟他成了忘年交。


    黄峥硕士毕业的时候要找工作，他当时有两个offer，一个是去微软，一个是去谷歌。那个时候零几年，谷歌刚成立没多久，才几百号人，是个小公司。但段永平就建议黄峥，说“微软是老牌公司，已经过时了，谷歌前途无量，你还是去谷歌吧”。黄峥就听了他的话，去了谷歌，还分到了一些股权。结果过了没两年，谷歌上市了，黄峥一下子就实现了财务自由。


    另外一个段永平对黄峥的帮助，是带他见了巴菲特。段永平有一年花了60多万美元，拍到了跟巴菲特共进午餐的机会，可以带一个人，他就带了黄峥。


    至于在饭桌上黄峥跟巴菲特请教了什么，我们就不知道了。只知道不久之后，黄峥回国了，在李开复的手下干了一年多，然后就一直自己做创业了。他先是帮助段永平卖了一大段时间手机，然后创立了一家新的公司，叫拼多多。现在拼多多按照市值算的话，已经成为中国第四大互联网公司了，他的平台年销售额也就是GMV已经超过了京东，是中国仅次于阿里的第二大电商公司。


    从黄峥的故事，我们就可以得出一个结论：弱关系可以带来很好的事业机会。


    这里还有一个例子：有一个APP叫做脉脉，是一个叫林凡的人创立的。林凡创立脉脉之后，他自己常在脉脉上面逛，认识了一个叫牛奎光的人。牛奎光刚好是个天使投资人，经过接触了解，牛奎光就投了一笔资金给脉脉，后来脉脉做成功了。牛奎光好像是投了200万美元，后来变成了20亿美元。无论是对创业者林凡而言，还是对投资人牛奎光而言，这都是弱关系带来的很好的事业机会。


    第三个例子，我要讲的是摩拜单车的创始人胡玮玮。


    胡玮玮是一个记者，也是一个八零后。其实她的出身背景很一般，大学是一个三本的学校。毕业后做记者，做了挺多年，月薪从来没有超过1万。但是她有一个很厉害的特点，作为财经记者，经常会采访一些成功的人士，她的厉害之处就在于采访之后，还能够跟被采访人保持良好的私人关系——很多财经记者采访完了，对方也就不认识她了，也就不联系了，胡玮玮的厉害之处就是还能一直保持联系，并且能够把人请出来吃饭。


    所以后来她在北京做了一个汽车网站，叫做GeekCar，她就租了一个四合院，经常邀请一些人来聚会。邀请的人里面有一个叫李斌，这个李斌很厉害，他创立过两家公司，并且都上市了，自己也做一些投资。当时其实是他先有一个想做共享单车的想法，当然有一些文章说是胡玮玮先有的，不管是谁先有吧，反正李斌也想做这个事儿。他自己有钱，有人脉，就是想找一个人替他把这个事儿撑起来，他找了一圈，想到了胡玮炜，他觉得胡玮炜这个人特别厉害，能够召集很多的人脉关系，把他们聚拢在一起。所以他就找胡玮炜谈这个事儿，胡玮炜自然同意，他们就一起把这个事儿做起来了。胡玮炜后来的很多技术人员、管理人员，都是当时聚会的圈子里的人。


    我们从胡玮炜这个例子得出的启示：弱关系可以成为你实现梦想的一个平台。


    其实，我们在社会上可以看到有很多人，他做事看起来并不比我们自己辛苦，但是得到的东西却比我们自己多得多；我们辛辛苦苦拼死拼活，每个月却只能赚一点点工资。大家有没有想过为什么？


    可能很大的原因，就是因为别人比我们自己更善于利用社会的网络资源，比我们自己更擅长于利用掌握的资源去构建和经营他的事业。所以他不仅可以用自己的努力，还可以通过弱关系去撬动一些平台跟系统，放大努力的效果，这就是弱关系的力量。而我们要是只靠自己的话，肯定是比不过他们的。


    其实，我本人建立牛人星球，也是抱着打造一个弱关系平台的目的，可能很多朋友也会发现，牛人星球也是一个开拓眼界的小平台，因为我们会有很多牛人在上面分享，以及大家平时在群里讨论的一些东西，都是开拓眼界的机会，甚至可能会带来一些事业的机会。


    我看到有一些朋友在线下交流，还有人在里面找工作，有人在里面招工，或者互相达成合作的，都有。所以牛人星球也是一个带来事业机会的平台，我更希望它能够成为大家实现梦想的一个平台，这个就要靠大家共同努力了。


    讲完了弱关系的作用，下面我们来讲一讲，怎样才能够开拓弱关系、利用弱关系。


    这里涉及到这么几个要素：

    - 第一个是意识；

    - 第二个是平台；

    - 第三是行动；

    - 第四是技巧。


    我们逐开展开来说。


    首先，我们要认识到弱关系的重要性，以及它对我们产生什么样的作用，这样你才能够有冲动去寻找弱关系。


    我建议我们平常人都要保持对弱关系的饥渴，为什么呢？你一想为什么我们没有一个好的强关系？其实不就是因为我们的上一辈没有好好的经营他们的弱关系吗？我们如果好好的经营我们自己的弱关系，并且把他们转化为好的强关系，是不是在我们后代要找工作、上学或创业的时候，就能够有一个比较好的强关系呢？那他就不用那么费心费力的去找弱关系了。


    这是说到对下一代的好处，其实我们个人平时的交往，还有事业的发展，生活变得更美好，都是要有良好的弱关系来维持的，所以我们一定要时时刻刻保持对弱关系的饥渴状态。


    我发现很多人，他平时就只在自己的强关系圈子里打转，这对事业的发展，对生活圈子的拓展，对你的幸福感其实都是很局限的。


    我经常会把寻找弱关系打一个比方，就好比我们在谈恋爱或者求偶。第一步，你肯定是要有对异性的渴望，但也有部分同志是对同性的渴望，这都没关系，总而言之，你要首先要保持饥渴。


    之后，我们要寻找一些机会去接触异性。比如你要有一些好的平台，或者是要有一个媒婆。我们拓展弱关系也同样如此，你可能需要有一些中介，或者需要有一个平台。


    有哪些平台呢？其实现在网络时代，网上的平台是最便捷的。比如说我们的微信群、朋友圈、微博、公众号、知乎、豆瓣、脉脉、领英等等，所有的这些社交网站都可以。


    我当年做经济研究工作的时候，很多问题不光是自己研究，也要跟很多经济学家、企业家、学者交流，我很多朋友其实也是通过微博、微信找的，其中还有一个是咨询界的一位大佬。我也是在他的启发和鼓励下才从政府部门跳出来做的咨询公司。如果没有这个弱关系的拓展，我可能不会从政府部门跳出来，这也是弱关系对我自己人生道路起到的作用。


    除了线上的平台以外，还有很多线下的资源，像我们参加一些行业聚会，或者自己组织的一些读书会，或者我们牛人星球的区域性的聚会，甚至你去参加一个牌局，一个KTV聚会，都是认识弱关系的好的平台，好的机会。


    我认为对于怎么样利用平台这个事情有四个层次。

    - 第一个层次是我不知道可以去用这些平台，脑子里完全没这个意识；

    - 第二个层次是我知道了可以用平台，但不知道有哪些平台，以及该怎么用；

    - 第三个层次，就像我们现在这样，我们知道了可以用平台去拓展弱关系，也知道了有哪些平台，你要怎么用；

    - 第四个层次，最高的层次，我们可以自己去创造一个平台，去聚拢弱关系。


    像我前面讲到的胡玮炜，她就是自己在北京租了一个四合院，每天就在那里搞沙龙，找几帮朋友过来，然后朋友带朋友，朋友的朋友带朋友。所以很多他的技术人员和管理人员，都是在那个沙龙上认识的。


    我自己写这个公众号以及组建牛人星球，对我来说也是创造了一个弱关系的平台，所以我也能够认识到大家。我知道大家里面也是藏龙卧虎，这个对我来说也是很好的一个弱关系的拓展。我们平时自己也可以创建一个公众号、做一个微博、组织一个线下的分享会等等，其实都是第四层次的创造平台的尝试。


    所以，如何开拓弱关系的第三点，就是你一定要付诸行动。你光有意识，知道有平台，是没有用的，你一定要动起来。


    一般来说，要拓展好的弱关系，我们需要去到一些优质的地方。什么叫优质的地方呢？从地区来讲，像北上广这些一线城市，或者说美国的硅谷、华尔街，或者清华北大这样的学校，如果有那样的平台，那样的圈子，我们往那些地方去，一定有优质的弱关系在那里。


    我们知道弱关系在哪里之后，就一定要自己主动的去开撩，像谈恋爱一样，你得迈出第一步。去找人，要微信或者写情书等等，你不能等着别人来追你。


    所以拓展弱关系，我不能等着别人，尤其是那些优质的弱关系，让他来主动找我，这是不现实的。你一定得行动、行动、再行动。比如说，你看到一个好的公众号，你在后台留言，去跟他的号主认识，这也是一种尝试。我当时在微博上就是这样的，我看到那些厉害的经济学家、企业家，我就会去给他们留言或者发私信，由此认识了很多好的朋友。


    其实咱们牛人星球的星友们，在这一点上已经有所行动了，你们加入牛人星球，不就是一个主动开拓弱关系的尝试吗？但是我也要说一下，有部分新群友在群里，以及在星球上是比较沉默的，这样就浪费了这个机会，入宝山而空手归。我建议，我们看到一些厉害的朋友，要主动去加他的微信，主动去跟他结交。


    第四点，我们要学习如何开拓弱关系的技巧。开拓弱关系，不仅仅是开拓一个人脉，更是考验一个人的综合能力。要开拓好的弱关系，我们为人处事、演讲、写作等等各方面的能力都需要提升。开拓弱关系，并不是一个绝招教给你，然后你马上就能够开拓弱关系。一个人拥有好的弱关系，最主要是自己有这个实力带来的。


    弱关系的结交，需要三个能力。

    - 第一是发现能力，要善于发现弱关系在哪里，发现拓展弱关系平台在哪里；

    - 第二是学习能力，要善于学习牛人，学会向他们靠拢，观察他们的为人处事、语言表达等这些方面，他们是怎么做的；

    - 第三是表达能力，包括文字表达能力以及语言表达能力，这样有了好的弱关系，你才能够和他良好沟通，让对方信任你，接纳你。只有具备了发现，学习，表达这三个能力，才能好好地去结交那些弱关系。


    结交弱关系并不是我们的最终目的，我们的最终目的是两个：

    - 第一个是从弱关系那里获得新鲜的信息，所以要经常跟他们交流。

    - 第二个是把优质的弱关系转化为强关系。


    其中第二个可能更重要一点，像黄峥，马云，他们都是因为能够把弱关系转化为强关系，让后让强关系为自己所用，最后才成就了很成功的事业。所以我们不是为了弱关系而去结交弱关系，而是为了把弱关系变成强关系。


    怎么变成强关系呢？其实我之前写过一篇文章，是讲影响力的，这个也可以套用到强关系这一块。


    文章的标题是《肤挨还是色诱？搞定一个人的五个层次》。我在这篇文章里提到了五个方面：


    - 第一层次是暴力。这个在我们这里面不大适应，我就不多讲了，暴力威胁。

    - 第二个层次是金钱。其实很多弱关系，最初我们都是通过金钱拉拢的，这个并没有什么不妥。在社会上，你想要人家认可你，你得先付出你的真诚，而真诚往往就是首先通过物质利益让别人感知到。

    - 第三个层次是善于利用自己的理性能力，就是你向别人展示你的智慧和你的逻辑推理，或者信息收集等等方面的能力，让别人知道，你能够掌握一些不同的信息，或者能够提供不同的看问题的角度，或者你看一个事情看得很准，或者分析一个问题分析得特别透彻，通过这样一些理性能力让别人感知到，你对他是有价值的，这样他会主动地希望能够把你们两个人的关系加强。

    - 第四个层次是建立感情，就是情感方面的交流了。建立感情的方法有很多，最主要的是要保持沟通，多交流。如果你结识了一个弱关系，但是很久不联系，那感情就淡了。尤其是优质的弱关系，时不时得问候一下，人家有什么事情，你帮人出出主意，或者是帮个小忙，这样一来一去，大家建立了一个平常的联系，然后有空的时候一起喝喝酒，打打牌；如果能够找到一些共同的爱好，尤其如果是能够跟对方的家人也建立一个联系，你们两个人之间这种感情的联系就建立起来了，弱关系自然也就转化为强关系了，关键要保持沟通的频率和深度。

    - 第五个层次是价值观和情怀。这个层次建立起来的强关系是最紧密的。你们共同为一个事业去奋斗，有一个共同目标，或者你们价值观很相近的时候，这个时候就很容易把弱关系变成强关系。比如说一个人，他特别爱狗，我告诉他我也是爱狗之人，我们共同去声讨那些吃狗肉、虐狗的行为；或者我知道一个人很爱环保，我就跟他一起谈环保，我们怎么样让世界变得更美好。还有很多，尤其是政治和宗教方面，你们的共同价值观、政治立场、意识形态就更容易把人绑定在一起。请注意，这里我不建议大家扭曲自己的价值观去迎合别人，但是如果是一个特别重要的弱关系，在某些场合之下，你总可以找到和他价值观在某些方面一致的地方，我们也可以去稍微展示一下我们认同他的价值观，这样有利于拉近共同之间的关系，有时候为了更好地达到你的一个善意的目的，这个是可以的。


    我们把上面提到的这些总结一下，怎么样去开拓弱关系呢？


    如果你很有实力，那你就用你的实力说话。绝对实力可以碾压一切技巧，什么技巧都不用，有实力，弱关系自然会找上门来。就像黄峥一样，我就是技术很强，那丁磊就来找我帮忙，我帮他解决问题，他就会帮我介绍更好的弱关系，这是实力的体现。


    那如果没有实力怎么办呢？我们学马云，用我的热情去感染人。马云十几岁的时候，就交到澳大利亚那个朋友，那时候的马云没有任何实力，他就是用自己的热情去感染对方，结果和对方成了好朋友。后来马云上大学的钱都是那

    '
  mdcn: '

    作中来，这就是学习、习得以及去运用。


    有一个很专业的名词叫做知识迁移，知识迁移在我们生活中变得很重要。比如，你看到一个公司做这个事情做得很好，你把它学习过来了，能不能在你的企业也用起来；有人在这个方面做的很好，那能不能在你的生活中应用起来。知识迁移是一个很重要的个人素养。在个人发展、生活中、企业中、职场中，当碰到瓶颈的时候，知识迁移是一个非常好的方法，能够帮助你走出困境。


    今天来听这个分享的朋友们，也许在个人成长方面有一些思考。尤其是在企业经营上面有些思考，希望今天的交流，能够给大家带去一些启发，我就非常的开心了。当我们在一个固定的思维里遇到瓶颈的时候，应该尝试跳出这个思维圈，找到新大陆。


    我们总结一下，当我们去设计产品的时候，一定要去想清楚它背后的原理，而这个原理最重要的一点就是它的需求一定是刚需的，而且是容易被激发的。


    第二就是整个产品设计的时候一定要去做一些技巧，以及运用心理学知识帮助这个产品变得更加有逻辑。


    第三点就是我们在业务发展有一定阶段的时候，一定要去思考一些问题帮助我们的业务去探索第二增长曲线。第二曲线的由来往往是来自于创新，而这个创新很有可能来自于同行或者是他行，这个时候一定要去运用知识迁移。


    我们今天的分享就到这里，如果大家有问题的话可以跟我交流。最后给大家抛一个比较尖锐的问题：如果你想要实现一个毕生的梦想，唯一的办法是需要你去行骗5年赚取第一桶金，你会去做吗？


    ## 如何用弱关系创造未来


    分享人：何加盐


    时间：10月29日


    各位牛人星球的星友，大家晚上好！


    非常感谢大家等到十点钟来听我这个分享，今天的分享大概需要45分钟。


    咱们今天分享的标题是：如何用弱关系创造未来。那么这里就有一个概念，什么是弱关系？


    可能有很多朋友，之前都或多或少听过这个概念，但也有些人没听过，我就再介绍一下。所谓弱关系，是跟强关系对应的、我们平时经常接触的人。像我们的亲戚、朋友、同学，这些都有自然的强联系，我们就叫它强关系；与此相对的，就是我们平时通过业务、偶遇或某一次聚会上偶尔碰到的、联系比较少的这样的一些关系，就叫做弱关系。


    弱关系这个概念，首先是美国的一个教授格兰诺维特提出的。他当时研究斯坦福大学毕业生的就业机会是怎么找的，发现大部分的学生，其实是通过弱关系才找到工作的，所以就提出了强关系和弱关系这么一个概念。


    格兰诺维特认为，在现代人找工作的过程中，弱关系比强关系更有效。后来，这个概念得到了很多的印证。


    另外有三位学者，也是美国人，他们利用英国伦敦的一些数据做了一个研究，也跟弱关系有关。


    他们拿到了伦敦的电信数据，每个小区的人打电话可能会打往不同的小区，他们就分析每个人打电话跨小区的流动量有多少，最后得出了一个结论，用下面的这个图给大家看一下。


    ![](img/74d384fc5d948a0c31090e035208669c_88_0.png)


    从这张图我们可以看出一个信息，它的纵坐标（也就是垂直方向），代表了每个人的社会经济地位，横坐标（也就是水平方向），是每个人关系的多样性。也就是说，越往右边，他的弱关系就越强；越往上边，他的经济社会地位就越高。


    我们可以非常明显看出，一个人的关系复杂性跟他的社会经济地位是紧密相关的。可以很明确地说，你的弱关系越强，你的社会经济地位就越高。也可以说，你的弱关系越多，你就会越有钱。


    从格兰诺维特以及英国伦敦的这个研究，我们可以得出弱关系对我们的重要性。


    为什么会有这个重要性呢？我们仔细分析一下可以发现：强关系的本质是我们血缘关系的连接，或者是类血缘关系的连接，同学、老乡，这种叫类血缘关系。但是弱关系它的本质其实是信息的流通。我们不断地结识新朋友，通过他们获得新的信息，这就是弱关系和强关系的区别。


    曾经有一个社会学家叫做邓巴，他得出一个结论：因为我们人的大脑容量有限，计算效率有限，所以人的一生中最多能够维持150个人左右的强关系。我们平时认识的所有其他人，我们要获得所有其他的信息，都只能通过弱关系来体现。这是人类大脑的局限性决定的。


    在农业社会，我们人类一般都是被土地拴在一个地方。我们平时认识的人，都是宗族里面的人，最多就是加上母亲或者妻子那边的亲戚。可能有一些进京赶考的或者外出打仗的人，他认识的人会多一点，但是这种在所有人当中占的比例是极少数。因此，农业社会，我们几乎所有的关系都是强关系，而且我们也没有必要得到外界那么多信息，因为我就种田，看一下季节，看看太阳、月亮的升起，然后看看周围宗族的人是怎么过的就可以了。


    但是到了工业社会就不一样了，我要知道物资的信息、人员流动的信息，这样才能安排好生意以及生产。所以，到了工业社会，弱关系就已经变得比强关系更重要了。


    到了信息社会之后，我们的强关系几乎不能给我们提供什么新鲜的信息，因为我们平时经常跟强关系在一起，我们得到的信息，我们看到的事物都是一样的，我们从强关系那里很难得到新鲜热辣的信息。所以，在信息时代我们几乎所有的信息都是从网上或者报纸、杂志这些地方来的，或者是通过一些弱关系传播给我们的，比如说我们在朋友圈看到的。


    上面讲的这些，就是想让大家有一个概念，为什么弱关系变得如此重要？为什么我们要重视弱关系？对我们来说，弱关系具体有什么样的作用呢？这里，我想用几个例子来说明一下。


    首先就是马云。大家都知道马云建立了阿里巴巴，现在是中国首富。他最开始是怎么样去创立阿里巴巴的呢？


    其实马云年轻的时候，对外部的世界也是一无所知。后来他为了学英语，到西湖边到处去找外国人聊天。十二岁的时候，聊到一个外国人叫做肯·莫利。莫利是个澳大利亚人。他们事先完全不认识，结识之后，两个人成了好朋友。莫利就邀请马云到澳大利亚去旅游，这是马云第一次开眼看世界。


    那个时候还是80年代初，我们中国内地当时还非常穷，可以想象马云出国之后受到了多大的冲击，很多观念都改变了。很多年之后，他是这样回忆的，他说：“我在澳大利亚的那28天，让我见识到一个完全不同的世界，这改变了我，如果没有当时这28天，就没有现在的我。”


    所以，我们说弱关系的第一个作用就是开拓眼界。


    除了肯·莫利带马云开拓了眼界之外，他后来招揽的得力助手蔡崇信，也是弱关系。那时，台湾一个朋友，本来是想来入资马云的公司，认识了马云，他就请蔡崇信来帮忙考察。所以对马云来说，蔡崇信是弱关系介绍的弱关系。后来他把蔡崇信招入麾下，把这个弱关系变成强关系，最后他们共同创造了伟大的事业。我们现在可以说阿里巴巴的成功，起码在早期是有蔡崇信一半的功劳的。蔡崇信本人通过这个弱关系，现在是加拿大的第二大富豪，财产有200多亿美元。这是马云和蔡崇信的弱关系的实践。


    下一个例子，我想讲得还是一个杭州人。和马云一样，他是我的师兄，黄峥。


    黄峥是2002年，在浙大读书，他上的是浙大混合班，就是尖子班。他学的具体专业是计算机，经常在网上写一些关于技术方面的文章。


    有一天，黄峥上MSN，突然有一个人加他的好友说：我看到你在网上写的文章，正好我有一个关于技术方面的问题，要请教一下。他俩就这样聊起来。找他的这个人叫丁磊，就是网易的创始人，他跟黄峥打完交道之后，觉得这个人还不错，很有能力，又很热心，自己欠了他一个情。


    黄峥不久之后要到美国去留学，可能是也想还这个情，丁磊跟我说“我给你介绍一个朋友认识”，就介绍了给段永平。


    可能有些朋友不一定知道段永平是谁，这么说吧，他也有可能是中国最厉害的一个隐形富豪。当年的步步高就是他创立的，后来的OPPO、vivo都是他的手下创立的，由此你就可以知道他有多么厉害。


    他当时是网易的一个投资人。网易因为经历互联网泡沫，股价跌到了几分钱。是段永平注资，帮丁磊渡过难关。后来网易的股价又回升，段永平大赚一笔。


    由于丁磊和段永平有这层关系，黄峥要去美国的时候，丁磊就介绍段永平给他认识。


    我们知道，黄峥跟丁磊就是通过MSN认识的，是典型的弱关系。然后丁磊又介绍段永平，黄峥和段永平就更是弱关系了。但是，黄峥见到段永平之后，也把段永平给征服了。段永平一看，这个小伙子真不错，就跟他成了忘年交。


    黄峥硕士毕业的时候要找工作，他当时有两个offer，一个是去微软，一个是去谷歌。那个时候零几年，谷歌刚成立没多久，才几百号人，是个小公司。但段永平就建议黄峥，说“微软是老牌公司，已经过时了，谷歌前途无量，你还是去谷歌吧”。黄峥就听了他的话，去了谷歌，还分到了一些股权。结果过了没两年，谷歌上市了，黄峥一下子就实现了财务自由。


    另外一个段永平对黄峥的帮助，是带他见了巴菲特。段永平有一年花了60多万美元，拍到了跟巴菲特共进午餐的机会，可以带一个人，他就带了黄峥。


    至于在饭桌上黄峥跟巴菲特请教了什么，我们就不知道了。只知道不久之后，黄峥回国了，在李开复的手下干了一年多，然后就一直自己做创业了。他先是帮助段永平卖了一大段时间手机，然后创立了一家新的公司，叫拼多多。现在拼多多按照市值算的话，已经成为中国第四大互联网公司了，他的平台年销售额也就是GMV已经超过了京东，是中国仅次于阿里的第二大电商公司。


    从黄峥的故事，我们就可以得出一个结论：弱关系可以带来很好的事业机会。


    这里还有一个例子：有一个APP叫做脉脉，是一个叫林凡的人创立的。林凡创立脉脉之后，他自己常在脉脉上面逛，认识了一个叫牛奎光的人。牛奎光刚好是个天使投资人，经过接触了解，牛奎光就投了一笔资金给脉脉，后来脉脉做成功了。牛奎光好像是投了200万美元，后来变成了20亿美元。无论是对创业者林凡而言，还是对投资人牛奎光而言，这都是弱关系带来的很好的事业机会。


    第三个例子，我要讲的是摩拜单车的创始人胡玮玮。


    胡玮玮是一个记者，也是一个八零后。其实她的出身背景很一般，大学是一个三本的学校。毕业后做记者，做了挺多年，月薪从来没有超过1万。但是她有一个很厉害的特点，作为财经记者，经常会采访一些成功的人士，她的厉害之处就在于采访之后，还能够跟被采访人保持良好的私人关系——很多财经记者采访完了，对方也就不认识她了，也就不联系了，胡玮玮的厉害之处就是还能一直保持联系，并且能够把人请出来吃饭。


    所以后来她在北京做了一个汽车网站，叫做GeekCar，她就租了一个四合院，经常邀请一些人来聚会。邀请的人里面有一个叫李斌，这个李斌很厉害，他创立过两家公司，并且都上市了，自己也做一些投资。当时其实是他先有一个想做共享单车的想法，当然有一些文章说是胡玮玮先有的，不管是谁先有吧，反正李斌也想做这个事儿。他自己有钱，有人脉，就是想找一个人替他把这个事儿撑起来，他找了一圈，想到了胡玮炜，他觉得胡玮炜这个人特别厉害，能够召集很多的人脉关系，把他们聚拢在一起。所以他就找胡玮炜谈这个事儿，胡玮炜自然同意，他们就一起把这个事儿做起来了。胡玮炜后来的很多技术人员、管理人员，都是当时聚会的圈子里的人。


    我们从胡玮炜这个例子得出的启示：弱关系可以成为你实现梦想的一个平台。


    其实，我们在社会上可以看到有很多人，他做事看起来并不比我们自己辛苦，但是得到的东西却比我们自己多得多；我们辛辛苦苦拼死拼活，每个月却只能赚一点点工资。大家有没有想过为什么？


    可能很大的原因，就是因为别人比我们自己更善于利用社会的网络资源，比我们自己更擅长于利用掌握的资源去构建和经营他的事业。所以他不仅可以用自己的努力，还可以通过弱关系去撬动一些平台跟系统，放大努力的效果，这就是弱关系的力量。而我们要是只靠自己的话，肯定是比不过他们的。


    其实，我本人建立牛人星球，也是抱着打造一个弱关系平台的目的，可能很多朋友也会发现，牛人星球也是一个开拓眼界的小平台，因为我们会有很多牛人在上面分享，以及大家平时在群里讨论的一些东西，都是开拓眼界的机会，甚至可能会带来一些事业的机会。


    我看到有一些朋友在线下交流，还有人在里面找工作，有人在里面招工，或者互相达成合作的，都有。所以牛人星球也是一个带来事业机会的平台，我更希望它能够成为大家实现梦想的一个平台，这个就要靠大家共同努力了。


    讲完了弱关系的作用，下面我们来讲一讲，怎样才能够开拓弱关系、利用弱关系。


    这里涉及到这么几个要素：

    - 第一个是意识；

    - 第二个是平台；

    - 第三是行动；

    - 第四是技巧。


    我们逐开展开来说。


    首先，我们要认识到弱关系的重要性，以及它对我们产生什么样的作用，这样你才能够有冲动去寻找弱关系。


    我建议我们平常人都要保持对弱关系的饥渴，为什么呢？你一想为什么我们没有一个好的强关系？其实不就是因为我们的上一辈没有好好的经营他们的弱关系吗？我们如果好好的经营我们自己的弱关系，并且把他们转化为好的强关系，是不是在我们后代要找工作、上学或创业的时候，就能够有一个比较好的强关系呢？那他就不用那么费心费力的去找弱关系了。


    这是说到对下一代的好处，其实我们个人平时的交往，还有事业的发展，生活变得更美好，都是要有良好的弱关系来维持的，所以我们一定要时时刻刻保持对弱关系的饥渴状态。


    我发现很多人，他平时就只在自己的强关系圈子里打转，这对事业的发展，对生活圈子的拓展，对你的幸福感其实都是很局限的。


    我经常会把寻找弱关系打一个比方，就好比我们在谈恋爱或者求偶。第一步，你肯定是要有对异性的渴望，但也有部分同志是对同性的渴望，这都没关系，总而言之，你要首先要保持饥渴。


    之后，我们要寻找一些机会去接触异性。比如你要有一些好的平台，或者是要有一个媒婆。我们拓展弱关系也同样如此，你可能需要有一些中介，或者需要有一个平台。


    有哪些平台呢？其实现在网络时代，网上的平台是最便捷的。比如说我们的微信群、朋友圈、微博、公众号、知乎、豆瓣、脉脉、领英等等，所有的这些社交网站都可以。


    我当年做经济研究工作的时候，很多问题不光是自己研究，也要跟很多经济学家、企业家、学者交流，我很多朋友其实也是通过微博、微信找的，其中还有一个是咨询界的一位大佬。我也是在他的启发和鼓励下才从政府部门跳出来做的咨询公司。如果没有这个弱关系的拓展，我可能不会从政府部门跳出来，这也是弱关系对我自己人生道路起到的作用。


    除了线上的平台以外，还有很多线下的资源，像我们参加一些行业聚会，或者自己组织的一些读书会，或者我们牛人星球的区域性的聚会，甚至你去参加一个牌局，一个KTV聚会，都是认识弱关系的好的平台，好的机会。


    我认为对于怎么样利用平台这个事情有四个层次。

    - 第一个层次是我不知道可以去用这些平台，脑子里完全没这个意识；

    - 第二个层次是我知道了可以用平台，但不知道有哪些平台，以及该怎么用；

    - 第三个层次，就像我们现在这样，我们知道了可以用平台去拓展弱关系，也知道了有哪些平台，你要怎么用；

    - 第四个层次，最高的层次，我们可以自己去创造一个平台，去聚拢弱关系。


    像我前面讲到的胡玮炜，她就是自己在北京租了一个四合院，每天就在那里搞沙龙，找几帮朋友过来，然后朋友带朋友，朋友的朋友带朋友。所以很多他的技术人员和管理人员，都是在那个沙龙上认识的。


    我自己写这个公众号以及组建牛人星球，对我来说也是创造了一个弱关系的平台，所以我也能够认识到大家。我知道大家里面也是藏龙卧虎，这个对我来说也是很好的一个弱关系的拓展。我们平时自己也可以创建一个公众号、做一个微博、组织一个线下的分享会等等，其实都是第四层次的创造平台的尝试。


    所以，如何开拓弱关系的第三点，就是你一定要付诸行动。你光有意识，知道有平台，是没有用的，你一定要动起来。


    一般来说，要拓展好的弱关系，我们需要去到一些优质的地方。什么叫优质的地方呢？从地区来讲，像北上广这些一线城市，或者说美国的硅谷、华尔街，或者清华北大这样的学校，如果有那样的平台，那样的圈子，我们往那些地方去，一定有优质的弱关系在那里。


    我们知道弱关系在哪里之后，就一定要自己主动的去开撩，像谈恋爱一样，你得迈出第一步。去找人，要微信或者写情书等等，你不能等着别人来追你。


    所以拓展弱关系，我不能等着别人，尤其是那些优质的弱关系，让他来主动找我，这是不现实的。你一定得行动、行动、再行动。比如说，你看到一个好的公众号，你在后台留言，去跟他的号主认识，这也是一种尝试。我当时在微博上就是这样的，我看到那些厉害的经济学家、企业家，我就会去给他们留言或者发私信，由此认识了很多好的朋友。


    其实咱们牛人星球的星友们，在这一点上已经有所行动了，你们加入牛人星球，不就是一个主动开拓弱关系的尝试吗？但是我也要说一下，有部分新群友在群里，以及在星球上是比较沉默的，这样就浪费了这个机会，入宝山而空手归。我建议，我们看到一些厉害的朋友，要主动去加他的微信，主动去跟他结交。


    第四点，我们要学习如何开拓弱关系的技巧。开拓弱关系，不仅仅是开拓一个人脉，更是考验一个人的综合能力。要开拓好的弱关系，我们为人处事、演讲、写作等等各方面的能力都需要提升。开拓弱关系，并不是一个绝招教给你，然后你马上就能够开拓弱关系。一个人拥有好的弱关系，最主要是自己有这个实力带来的。


    弱关系的结交，需要三个能力。

    - 第一是发现能力，要善于发现弱关系在哪里，发现拓展弱关系平台在哪里；

    - 第二是学习能力，要善于学习牛人，学会向他们靠拢，观察他们的为人处事、语言表达等这些方面，他们是怎么做的；

    - 第三是表达能力，包括文字表达能力以及语言表达能力，这样有了好的弱关系，你才能够和他良好沟通，让对方信任你，接纳你。只有具备了发现，学习，表达这三个能力，才能好好地去结交那些弱关系。


    结交弱关系并不是我们的最终目的，我们的最终目的是两个：

    - 第一个是从弱关系那里获得新鲜的信息，所以要经常跟他们交流。

    - 第二个是把优质的弱关系转化为强关系。


    其中第二个可能更重要一点，像黄峥，马云，他们都是因为能够把弱关系转化为强关系，让后让强关系为自己所用，最后才成就了很成功的事业。所以我们不是为了弱关系而去结交弱关系，而是为了把弱关系变成强关系。


    怎么变成强关系呢？其实我之前写过一篇文章，是讲影响力的，这个也可以套用到强关系这一块。


    文章的标题是《肤挨还是色诱？搞定一个人的五个层次》。我在这篇文章里提到了五个方面：


    - 第一层次是暴力。这个在我们这里面不大适应，我就不多讲了，暴力威胁。

    - 第二个层次是金钱。其实很多弱关系，最初我们都是通过金钱拉拢的，这个并没有什么不妥。在社会上，你想要人家认可你，你得先付出你的真诚，而真诚往往就是首先通过物质利益让别人感知到。

    - 第三个层次是善于利用自己的理性能力，就是你向别人展示你的智慧和你的逻辑推理，或者信息收集等等方面的能力，让别人知道，你能够掌握一些不同的信息，或者能够提供不同的看问题的角度，或者你看一个事情看得很准，或者分析一个问题分析得特别透彻，通过这样一些理性能力让别人感知到，你对他是有价值的，这样他会主动地希望能够把你们两个人的关系加强。

    - 第四个层次是建立感情，就是情感方面的交流了。建立感情的方法有很多，最主要的是要保持沟通，多交流。如果你结识了一个弱关系，但是很久不联系，那感情就淡了。尤其是优质的弱关系，时不时得问候一下，人家有什么事情，你帮人出出主意，或者是帮个小忙，这样一来一去，大家建立了一个平常的联系，然后有空的时候一起喝喝酒，打打牌；如果能够找到一些共同的爱好，尤其如果是能够跟对方的家人也建立一个联系，你们两个人之间这种感情的联系就建立起来了，弱关系自然也就转化为强关系了，关键要保持沟通的频率和深度。

    - 第五个层次是价值观和情怀。这个层次建立起来的强关系是最紧密的。你们共同为一个事业去奋斗，有一个共同目标，或者你们价值观很相近的时候，这个时候就很容易把弱关系变成强关系。比如说一个人，他特别爱狗，我告诉他我也是爱狗之人，我们共同去声讨那些吃狗肉、虐狗的行为；或者我知道一个人很爱环保，我就跟他一起谈环保，我们怎么样让世界变得更美好。还有很多，尤其是政治和宗教方面，你们的共同价值观、政治立场、意识形态就更容易把人绑定在一起。请注意，这里我不建议大家扭曲自己的价值观去迎合别人，但是如果是一个特别重要的弱关系，在某些场合之下，你总可以找到和他价值观在某些方面一致的地方，我们也可以去稍微展示一下我们认同他的价值观，这样有利于拉近共同之间的关系，有时候为了更好地达到你的一个善意的目的，这个是可以的。


    我们把上面提到的这些总结一下，怎么样去开拓弱关系呢？


    如果你很有实力，那你就用你的实力说话。绝对实力可以碾压一切技巧，什么技巧都不用，有实力，弱关系自然会找上门来。就像黄峥一样，我就是技术很强，那丁磊就来找我帮忙，我帮他解决问题，他就会帮我介绍更好的弱关系，这是实力的体现。


    那如果没有实力怎么办呢？我们学马云，用我的热情去感染人。马云十几岁的时候，就交到澳大利亚那个朋友，那时候的马云没有任何实力，他就是用自己的热情去感染对方，结果和对方成了好朋友。后来马云上大学的钱都是那

    '
  merge: 1
