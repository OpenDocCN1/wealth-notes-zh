    但我当时想的就是，如果我在没有任何自己以前知道这些方法的情况下，我还能不能够突破更多的方法，能够找到不一样的那种方式。


    我得到了我想要的答案，那就是：如果以后我很失败了，一无所有，我会觉得我心态上很平衡，其实每个人消耗的资源不是很多的，这个世界大多数都在浪费。我还是可以活的很好。然后我也会去设身处地的感受到那些遇到困难的人，我会觉得那些流浪者非常平常，不会用同情心，也不会用嫌弃心去看他们。


    我妈妈现在对我非常的放心，她知道我去过那么多地方，自己平安的回来，发现我回来过后更吃苦，很勤快，也比以前孝顺多了。说话、跟人打交道的时候会稳重些，她现在对我的评价就是，对我很放心。她挺佩服地说：去哪里的话让我把她带上。


    这过程中出现挺多有意思的事情，比如以前我挺怕蚊子的，在外面蚊子太多我就随它咬吧，反而没有咬几个包，很多不能忍耐的习惯不知不觉中淡忘了。


    路途我会静静地欣赏各种各样的那种野花小花，我觉得它们不比花店里卖的那些名贵的花差，因为它们太小了，急匆匆的人们没有办法快速的去欣赏到它的美。会一下午看那个蚂蚁怎么搬家，有时候会看看那个鸟，看云，像这些常见缓慢，被我以前忽略的东西，会觉得特别的有滋味，这种安宁喜乐啊，可以整天都是充满的。


    我的头脑也比以前清晰了很多，以前我也是一个很狂热的追星族，喜欢二次元，喜欢去跳舞，喜欢很多新潮的东西。在外面的那段时间，只要是跟钱有关，所有的消费自己都不能去参与了，会观察一些身边免费的这些娱乐活动。像有的老人，他会早上打太极，晚上跳广场舞，他也过得很好。


    我的身体也变得健康了很多，假如说外面下了暴雨，然后又有冷风吹过来，浑身湿透，都不会感冒，或者那种太阳 38 度 39 度，在外面走一下午，也不会感觉到很热。其实空气中，它这个热气很强的话，它会往别的地方扩散的话，那种空气对流就会产生挺大风的，能够把心吹的非常清凉。还有那种小漩涡，静下来时你能够感受到那种流动是有形状有方向很实体化。


    沿途遇到特别多的小动物，除了在动物园还有家宠禽宠物以外的那些只能电视上或者口里流传的。有时候还会发现有很多野果，比如说在山上公园玩的时候，我遇到很多好客的人在那边吃饭，有时候也在那边住个一晚。


    会认识到很多新鲜的事物，他们就会叫你有果子可以吃，有的植物不可以吃。我会对自己这些增加在书本上了解不到的技能，感到很自豪，因为这些东西，以让你在一无所有的情况下能够救命，正自己所拥有的知识，而不是说外面的人临时，他给你的一个地位，给你的一些短暂不确定的帮助条件。


    我动手能力在那段时间也变得很强，想现在这种螺丝刀扳手啊，各种拆卸工具，对我来说是小儿科，生活中能省很多钱和很多麻烦。


    我在外面想的最多的就是我未来人生，我想做个什么样的人，我想过什么样的生活。小的时候，特别羡慕和向往背包客，我曾经跟我妈妈说过，我长大，我一定要去流浪，去讨饭。妈妈就说讨饭也要本事啊，没有本事，有的人饭也讨不到，确实是这样子。


    流浪一个最基本的智慧，最锻炼人的智慧。我觉得我连最基本的东西都做不好的话，懂别的东西都只是一种安乐情况的掩耳盗铃。有很多人，他能够看明白别人，但依然是看不清自己，很多帮人出情感建议的还是单身。当然单身是自己的一种选择，俗话说旁观者清，有的时候就是往往看清别人是很容易的，但是看清自己不是那么容易。


    我最爱晚上躺在草地上，非常安静放松，没有人打扰，看着满天星星，这时候我就不会受种种条件的约束，这个时候就好像是一种本真显露出来了，非常接近，接近一个原来的自我。我会想一些很深邃的问题，问自己你需要什么呢，你想要什么，大多数想的都是为什么我要这个，为什么我要那个，问久了过后我就会发现，答案是我什么都不想要了，为什么我要一直想着我想要什么东西。我应该把重点放在，我想过上什么样有乐趣的人生，我想把我生命这种过程活的非常精彩，我会想着小时候那个问题是我为什么来到这个世界上，我是谁。


    在陌生城市没有错综复杂的关系，人家帮助我，就是一种人与人同类之间最纯粹本来的简单关系。经历了中间的这种种的苦恼啊，快乐啊，后面只想的是我如果能够平平安全到家，我会不浪费生命，用自己生命帮助需要的人。


    同时觉得很多人不知道外面有很多东西可以去创造，可以拥有的更多。城市很多外地人，他在外面物质没有在自己家乡过得好，但是外面可以学习，可以每天看到不同的人事物，那种精神上本性扩展的滋养，远远比在老家按照养老的生活，一眼看到头那种生活要带动。


    我很感恩何老师给我这个机会，群里的朋友，您们都是非常可爱、非常和善的人，也有很多年龄比我大点的哥哥姐姐，我想他们用成熟的眼光来看我，只会是一种理解和包容，过来人那种心态来看我的，所以我也不怕献丑就什么都说出来。


    我现在依然会很自卑，还是很失败，一事无成。我这段经历也只是对我个人的成长有帮助，就好像穷人家最好吃的饭菜都比不上人家富豪家里面最差的饭菜一样。但我挺喜欢这个氛围，也喜欢何老师和各位朋友。


    最后我想说的是，如果我的小孩长大了，他要出去，我很支持他，我希望能够多锻炼自己，能够独立。人要照顾好自己，不要拖累别人，才能谈得上去被别人所依靠，能去尽到自己的责任。但是这之前我一定会尽可能多的教他一些能力，就我自己所知的情況下，让他准备的更多更好点，而不是说那种随波逐流，事到临头去逼他做事情。


    我经常问自己，如果说，生命只剩下今天，你最想做什么事情，最后悔的事情是什么。人生无常，很多车祸猝死等意外，生死只在呼吸之间。我希望大家都不要有遗憾。现在的社会治安不比以前。


    虽然现在小孩比以前更聪明，但是也更复杂，现在小孩有现在小孩的吃苦方式，虽然方法不一样，但是达到的效果都差不多，那就是成长，不一定让孩子学我们走过的路，也不是一条路。


    咱们常说，有志不在年高，无志空活百岁。


    我觉得志是，自己想做什么样的人，自己人格目标就是志。


    ## 用印象笔记搭建一个终身受用的写作系统


    **分享者：** 欢喜，深圳知行合一教育公司创始人

    **分享时间：** 2019 年 8 月


    上次听加盐老师分享，他是从用户大概七八万的时候开始做这个付费社群。我的公众号用户不到加盐老师的十分之一，我和加盐老师走的是不同的一条路，这条路可能更适合有一技之长的人，或者是一些普通的上班族。至少我两三年走过来，也有一些心得和大家做一个分享。


    我刚开始就是自己写一些读书笔记，忽然有一天被一个主编看到了，然后他就买了我十篇读书笔记，最后扣完税到手大概差不多 1 万块钱吧！那是我第一次赚到了工资以外的收入。然后我就总结了一个套路来写这个读书笔记。就开始带着大家一起来写读书笔记，当时我记得收费是
    699 元一个人，然后两个月左右就报名了将近 200 个人。也是通过这件事情，一个北大的博士找到我，我们又合作了一把，两个月大概做了 50 万。这就让我意识到做出一个产品的重要性。


    所以我走的这条路就是先做出一个产品，然后服务好为我付费的 1000 个用户，我觉得就 OK 了。因为这个原因呢，我就学习了编程，之前参加过一次全栈营。然后我就找朋友上线了欢喜笔记，一个个人网站。当然，后面因为一些开发的成本比较高，所以我就把它给停了，最后把课程放到了小鹅通上，也就是我的一个写作系统行动营。将近有差不多半年时间卖有了
    600 多份，这些基本上是我在写作系统上的一个经历，之后慢慢就形成了一套自己的写作系统。


    所以我想对于和跟我一样的普通人，我就分享两点：


    - 一就是卯一股劲儿，先做到 1000 个铁杆的用户。给他们提供好的产品，解决他们的某个问题。

    - 二就是我个人的一些小经验，不要单打独斗，要和别人多合作，然后谈好利益分配，总之不伤和气嘛！最后大家都会有钱赚。


    我们现在正式开始这次分享，我也希望你帮我解决一个问题，就是用印象笔记搭建一套终身受用的写作系统。


    很多人一开始并没有构建一个写作系统的意识，就是我们每一次写作就真的是一次性的，就是写一次算一次，然后每次写作呢，都要是一个词汇一个词汇的敲打出来。其实就像是盖房子，然后我们和泥、砌砖，一块儿一块儿往上摞。那下次再开始写的时候呢，又得像盖房子一样推倒重来。到头来其实每一篇文章的输出，最终也只是一个简单的字数积累，这种积累呢，并没有产生一些重要的关联，所以在写作上就难以获得一个真正的复利。


    写作想要具备一个复利效应，能够保证持续的做下去，我觉得应该具备一个系统意识。经过不断的一个一个写作实践，我提炼出了写作系统的四个核心要素，如果把握好这四个核心要素的话，你把它构建在印象笔记里面，那你将会搭建起一个写作系统。那这四个核心要素就是：


    - 一、元写作

    - 二、时间银行

    - 三、知识银行

    - 四、范例银行


    后面我会一个一个给你详细介绍。


    我们先说元写作。


    元写作，我称它为写作的写作，就是把写作的复杂问题，拆解为一个一个要素，然后再逐个击破。这是提升写作能力的一个好方法。当然这个理论是来源于认知科学家-史迪芬·平克。他专门就科学写作，写过一本书叫“写作风格的意识”。然后他把提升写作的一个清晰路径，我认为讲得很清楚，比如：他说写作的技巧不是来自于一些写作指南，而是来自于一些一流作家的作品。他说一个好的作者是酷爱阅读的，他们一定是掌握了一份由海量的字词、成语、比喻和修辞技巧，来构成这样一个清单。意思大概是说，写作能力提升主要是学习一流作家的作品。积累他们用到的修辞技巧，动词、成语、类比等，然后你要分析这些用法好在哪里。


    经过我的一些实践总结，我认为写作要素，基本上有两大类构成：一个是虚构类，另一个就是非虚构类。


    虚构类主要是一些文学作品，一些散文、小说，尤其是小说，它是通往一切题材的一个路径。如果你能模仿一流的小说，那对写作是最有帮助了。当你把这些要素积累研究多了，你的文章的美感会有一个很大的提升。


    非虚构类写作主要是概念的一个阐述，观点的表达，还有一些科普性质，注重的是一个逻辑清晰或者是理性思考，也就是我们通常讲的干货文章，其知识密度会比较大。这两大类一起积累的话，就可以帮你写出一些干货美文哦！


    那比如我研习了王小波杂文的一些开头。那标签的话，我就可以给他打上“写作库”的一个标签。比如说王小波杂文开头的清单，我用笔记内容就按照“见、感、思、行”来做一些拆解。


    我的标签会打上：101-写作库-2 开头，标题就是“开头清单-王小波杂文”，下面笔记内容就是见、感、思、行。


    我会把王小波开头的素材做一个摘抄，写上我的感受和思考，最后是行动。行动就是做一个仿写。


    这样做的目的就是：他是由一个粗放到精细，或者说从一般到具体。当我想要找王小波文章的时候呢，我就可以快速的通过这个标签来找到文章。这也是我迭代三四次之后一个实践经验的总结，只要你严格的按照这种范式积累的话，你收集的知识都能够有序沉淀下来。


    然后我会把虚构类给他分成 12 个这样的一个写作要素的拆解，比如我看一篇文章，尤其是加盐兄的文章，我都可以给他做一个开头结尾，我把一些好的素材都给他拆解一下，然后都会放到按照这样的要素沉淀到相对应要素里面。这是我总结的虚构类的
    12 个写作要素。


    ![](img/74d384fc5d948a0c31090e035208669c_59_0.png)


    我就不一一去做一个案例的分享了，因为每一个案例，每一个写作的这个标签，都有一些案例的积累，你可以按照这个来做你自己的收集和积累。


    虚构类的写作要素讲完了，接下来就是非虚构类的写作要素。就是我们在阅读一本非虚构类书籍，或者是学习某一个学科时，它涉及到的要素一般有：概念、人物、故事、观点、方法、金句这六大类。那当我们读完一本书，或者是研究一个主题，你把这些要素提炼出来。就相当于你把一本书或者是一个主题的精华都带走了。


    这六大类的要素，是我之前在读读书笔记解稿的时候，总结的一些要素，还有包括甲方的一些要求，也基本上是按照这个要素来的。


    - 第一个是概念。思维的一个基本单位，当你有清晰准确的概念，就是一切思考的基石。如果你有一个足够清晰又准确的概念，而且又知道概念之间有清晰准确的联系，那么它就可以帮助你更好的解决问题。

    - 第二是人物。人物就是你通过有积累一些人物卡的话，或者人物故事的话，你可以更好的去了解知识源头的一些创作者。比如芒格就说：“当你试图让人们学到有用伟大概念的时候呢，最好是将这些概念和提出他们伟人的生活与个性联系起来”，所以撰写人物卡就可以让你更生动的去学好某一个概念，或者某一个学科。我觉得我特别认同芒格说的，他说和已逝的伟人交朋友，那这种方法比简单的给出一些基本概念，要好得多。加盐就写的是人物故事非常的棒。

    - 第三是故事。大家都知道一篇文章，如果是以故事的形式呈现的话，会让人产生一种共情能力，就是会有一些愉悦感，大家也更容易去读下去。

    - 第四是方法。方法能帮助你达到某个特定的目的，有一些实际操作模式和步骤，你可以直接拿来用。比如见感思行这样的创作框架，或者印象笔记工具的使用技巧等等，这些都属于方法。当你积累了大量有用方法的话，它可以帮助你解答疑惑，更好的能指导你的生活。

    - 第五是观点。这里我们主要提取的是一些反常识观点，也就是能让你重获心智的观点。常识的观点就是我们的认知边界，反常识观点呢，就是一些新的事物，可以拓展你的一些认知边界。

    - 第六就是金句了。当你去积累那些最打动人心、那种性感的句子，我相信感动你的同时也会感动别人，也会让别人产生无限的思考。


    所以按照这六大类，你就可以把一本书或一篇文章，然后大卸八块，精华全部带走，沉淀到你的印象笔记，然后你可以再进行一次二次创作。


    这些素材我都会以标签的形式，给它罗列放到我的印象笔记里面，那当我要收集到一些、人物或者是概念的时候，就能快速的把它们调用出来。


    那说完元写作，第二个就是时间银行。


    我们留不住时光，但是却可以让它发酵出一段记忆。用来存储我们记忆的地方、就是我们的时间银行。我认为我们可以在那里面穿越时光，来打造自己的一个生命的轨迹。那么如何低成本科学的打造一个时间银行呢，我认为就是写晨夕日记了。


    “巨人的工具”就是这个作者：蒂姆·费里斯，他采访了 100 多位牛人吧，他就询问这些牛人的晨间习惯是什么，他就结合了些牛人的习惯，结合自身的一个实验，提出了晨间五件事。他说如果一天当中我要是做到了三件儿，那我就为自己赢得了胜利。


    - 1、整理床铺（不超过 3 分钟）

    - 2、静思冥想（10-20 分钟）

    - 3、把某套身体练习重复做 5-10 次（做俯卧撑 5-10 次）

    - 4、喝杯水

    - 5、做晨间笔记或 5 分钟日志


    这五件事，一个是唤醒你的身体，让你用更饱满的精神面对新的一天，另一个就相当于是一个精神雨刮器，来帮你整理思绪，清醒的面对新的一天。


    那受蒂姆·费里斯的启发，和我的一些实践经验，我总结了一套适合自己晨夕日记的模板，希望对你有用。我把这个模板发到咱们这个群里面了。就是比如早起唤醒你的身体，我这里有六项：整理床铺、然后喝两杯凉白开、做俯卧撑、身体向上牵引、记录体重、静思冥想等等。反正我觉得通过这样一个阶段下来之后，发现每天早上都有事儿干，就好像给大脑下了一个指令，早起要干上这几件事儿，把它做完，反正还是挺有收获的，你可以根据自己的情况做一些调整。


    这个模板里面有一个 WOOP 思维，我觉得这个还是非常重要的理念。


    WOOP 思维是心理学家-彼得·范·廷根格尔维茨（Peter Gollwitzer）夫妻，他们开启了一个心理学新的流派。比如说我们普通人制定计划都是目标、意图，比如我今年的目标是什么，我今天要完成哪三件事儿，然后一般都很难达成。他们就换了一种思考的范式，就是强迫实验对象用执行意图来思考。结果就非常的
    [好]。执行意图就是利用了我们这个大脑一个未完成的情节，那目标意图就是，你在大脑中往往会自慰 [慰]，我要做什么。执行意图它就帮你提前确定好，比如你早上六点起床，那喝桌桌上的凉白开，马上出门跑步，就是给大脑编号一个指令，你不让他思考，然后机械式的去执行你的一个命令。


    **WOOP：**

    - W（愿望，Wish，罗列你的当日事件）

    - O（结果，完成事件后带来的美好结果是什么 Outcome）

    - O（障碍，你会遇到哪些障碍 Obstacle）

    - P（计划，遇到障碍你应该如何做 Plan）


    全称，可以用这个思维框架来做每日三件事。


    比如：

    - 愿望：完成晨夕日记课件

    - 结果：写作系统课件升级完成

    - 障碍：写作中途刷手机

    - 计划：如果写作中途刷手机就把手机放回卧室


    WOOP 思维，其实说白了就是把制定目标切换到用这个时间、地点、行动来执行目标。然后能更好的帮你去达成这个目标，你可以尝试一下。我把这个具体的这个发到这个群里了，你可以看一下。


    接下来就是周计划、年计划、或者月计划，目的就是来牢记自己的目标。当然 WOOP 思维也是为了达成目标服务的。那往下走就是生活，学习，工作，然后记录当天的见感思行，那接着就是成功日志。而这也是受巨人工具里面的启发，因为他们那里好多采访的成功人士，他们都是记录当天。一些最有成就感的事情，所以我就把它放到了这个模板里面了。


    所以这个模板没有特别要说的。最重要的是，你要在你的印象笔记里面建立一个晨夕日记笔记本，标题可以用日期加关键事件来组成。当你记录了 100 天或者 1000
    天的时候，就相当于给自己建造了一个时光机。你只需要搜索一个日期，那天发生的故事都会历历在目，你就会知道自己是怎样一步步走过来的，生命的层次和质量就会高很多。


    ![](img/74d384fc5d948a0c31090e035208669c_63_0.png)


    这是我随便截取了一些我写的晨夕日记，标题一个关键词加日期，就是你 [看] 标题，就会想起当天做了一件什么事情。不用阅读全文，你就能回忆起当天的一个情景。大概是这样，整个晨夕日记，如果你按照模板去写的话，其实你的启动成本会非常低，然后也能快速的把它写完。


    说完晨夕日记，接下来就是知识银行。我记得吴伯凡老师他以前也是用这个印象笔记，他说他收藏了几千条的信息。但是发现收藏就是冷藏，所以呢，他开始对每一条的信息进行加工，然后变成自己的。他把这些加工过的信息称为知识净资产，也就是之后上线的伯凡日记录。


    所以对于一些重要的信息，你可以把它变成你的知识净资产，然后存放在印象笔记的知识银行笔记本里面。我刚发的那个图片上面我的知识银行就是见感思行知识卡片。有一个什么样的好处呢，我给你看一下印象笔记非常强大的一个功能，就是扩展知识卡片的这样一个视图，他能方便你去做一些知识和知识之间的连接。


    这些经过你加工过的一些知识卡片，当你写文章的话，都是你一个非常好的素材的来源。如果你积累了 1000 张或者 2000 张的时候，其实你写作的时候，你的素材是不缺的，就不需要你到写作时候再去网上去找，然后又要再去加工，这样会耗费时间嘛！等你把它加工好的话再拼接。在组装的话就会方便很多。

    '
  mdcn: '

    在外面的地上。是我的性格，哪怕我会饿死，我也不会去偷眼皮底下的食物或者别的东西，我会去要，去拿我体力去换。


    当然做人没那么死板，假如说真的到这一步，在没有人情况下，你可以先吃，但是吃完了过后会原地等待会告知补偿，一定要诚实。这里有人会问你，受这些苦，你赶紧去工作啊，给自己有点积蓄，再出去玩，或者你在这个过程中做点短工时，或者帮人家做做一点事情，再换取一些报酬，比如说食物，或者种种的便利。


    但我当时想的就是，如果我在没有任何自己以前知道这些方法的情况下，我还能不能够突破更多的方法，能够找到不一样的那种方式。


