  - '[PAGE 64]


    那么如何去写这样的一张张的知识卡片呢，我个人总结了一个方法，就是见感思行，那什么意思呢，见就是你要把你看到的一些现象或者是信息，或者是一篇文章，用你自己的话进行一个压缩提炼。这就是通过压缩信息来提炼或者归纳知识，也就是常说的费曼技巧，这也是创造了一个最小行动，通过你的提炼压缩，其实你就改变了这个信息的呈现结构。这里你需要注意一下，如果你刚开始写见感思行卡片的话，你可以备注上这个信息来源，以免你转述出现偏差的时候，后续可以找到这个来源进行一个核查。


    那感受就是你要结合你自身的一个案例去解释这个知识，这也是费曼技巧的第二步，就是通过自身验证，你自己学会了某项知识，看你能不能结合你自身的一个案例，或者是找到一些案例讲清楚这个知识点，那写感的关键点就是在于你要找到一个线索，你可以从这样的潜台词来开始，比如说你看到一个现象，你可以说我记得那年，然后你去想你相似的一个经验，或者是相反的经验，然后你再回到现在，或者说你看见这事儿，人们往往第一时间会想到什么，然后你可以说，这种看法呢，是符合合理的，但是我的经验是什么，这样写“感”有两个好处，一个是塑造落差，我觉得什么，但是人们往往会想到什么，就容易让用户去读下去。


    思考就是说，我们个人的经验可能都是有局限性的，这时候你需要找到其他知识和这个知识之间的一个联系，思的作用其实就在于打造一个知识网络。


    你细想一下，有没有另外的一个观点或者故事表达的一些内容与你见的部分相关？这个过程，其实就像是空里的寻宝活动，本来一颗颗星星在天空上，它是随意散落的。其实看起来是没有关系的。但是经过一条特定的线，把相关的星星连接起来，就变成了璀璨的、有实际指引功能的一些星座，知识也是如此，用思的方式把他们就可以激活。把他们串联在一起，他们就会迸发出一种新的能量，可以帮你解释更多一些新的情况。


    行就是目的，就是最后你要把这些知识转化为自己的。经过你的所见、所感、所思，你在某方面的认知其实已经发生了一个改变，这种改变就会指导你在现实生活中做出一个什么样的行动。那如果你是分析文章写法的话，那么你行动就可以进行一个仿写，进行一个应用。


    这样见感思行一整套下来，这个过程呢，其实就是学习知识，然后通过自'
  - '[PAGE 65]


    身的实践。再加上其他知识来验证你看到的观点，然后举一反三，通过掌握一个知识点，再吃透其他的一些相关知识点。


    那说完见感恩行，最后一个就是范例银行。作者“Paul Graham”在《黑客与画家》中，就提到过，创作者另一个学习的途径，是通过范例。对画家而言，博物馆就是美术技巧的一个图书馆，几百年来，临摹大师的作品，一直是传统美术教育的一部分，因为临摹能迫使你去观察一幅画是如何完成的，所以作家也是这样学习写作的，比如弗兰克林，他是通过总结和模仿爱迪生和star的文章，还学会了写作，雷蒙•钱德勒也是如此，他也是这样学会了写侦探小说。


    我觉得这些道理都是相通的，包括史蒂芬·平克，他在《写作风格的意识》里面也提到，要想真正的学会写作，还是要研习一些大师的作品，去了解，这种比喻、修辞、词语的用法，他们是怎么用的，他们怎么去呈现句子结构的。你研习完之后，可以把它仿写变成自己的，就用见感恩行来仿写，那只有你知道什么是好东西，你才有可能写出好东西，所以好的写作者，不是一开始就坐下来写，而是先要积累一些范例，然后先给你的写作库蓄水，你要积累大量写作要素的素材，等你有了大量这种好的范例，你又能进行模仿、研习，然后慢慢的慢慢的写，你才有机会成为一个写作高手，来写出一些保鲜期比较长的文字，经得起时间的冲刷。


    我记得看王小波文章，他有篇叫《用一生来学习艺术》，它里面也就说，现在世界上已经有了这个杜拉斯、有了《情人》，那么这位作家和他的作品其实给我们也提供了一个范本，那你在写起来就容易多了，如果没有这些范本的话，就让你凭空去创造一种写法，其实是非常困难的事情，他说人活在世上不必什么都知道，只知道最好的就够了，所以如果你要成为一个创作高手，我个人认为，你真的需要一你自己的范例银行。研习大师作品是提升写作最快的途径了，所以我当时和一些朋友就针对王小波的杂文就进行了一个研习，做成了一个范例库我分享给大家。


    比如：


    +   - 《跳出手掌心》的写作场景是：面对有人装逼怎么怼；


    +   - 《道德堕落与知识分子》的写作场景是：看到不爽的事如何表达；'
  - '[PAGE 66]


    《论战与道德》的写作场景是：被人道德绑架时如何回应。


    《我的师承》的写作场景是：如何用一流文字真诚的赞美偶像；


    《用一生来学习艺术》的写作场景是：如何写对某一领域的热爱。


    针对王小波的一些文章，我们就想到了一些场景，然后怎么去表达，比如说遇到了一些如何看到不爽的事情，如何表达的话，那么模仿写作场景就是王小波的一篇文章，《道德堕落与知识分子》。大概是
    这样，比如表达对某一领域的热爱的话，可以模仿王小波《用一生来学习艺术》这篇文章，来学习他的布局，来学习他的一些结构，我后续找到这个电子书发到群里面分享给大家。


    其实，不仅是创作、工作、生活、学习等等，各方面你都可以形成你自己的范例银行沉淀到印象笔记。我是用了 abcd 这样的标签去沉淀我的知识，我和大家分享一下我的截图。


    只有把它们都打上一个标签。那么当你遇到一些好范例的话，或者你自己改写的范例都可以打上标签检索，这样就能快速的检索出来，这样当你有写作用到的时候。你就可以快速的调取，然后能减少你大脑决策的负担，我认为这才是行走江湖的一个杀手铜吧！就比如去医院看病，然后去找了哪个医生，第二次的话，如果你没有做记录，你再去找的话，其实还挺费劲的，那你把所有的流程都弄清楚了，第二次再去找他的话就很快速。而且我个人的一些小经验吧！当你积累了大量这样优秀范例的话，我认为你坚持写下去。真的是普通人的一个进阶路径吧！


    以上就是我今晚关于写作系统的一个分享，主要有元写作、时间银行、知识银行和范例银行，他们整体构成了一个写作系统，我都会把他部署在印象笔记，通过笔记本和标签两大块去构造，我的这样一个写作系统，需要的时候我都可以一键调取，接下来，我会把我笔记本系统和跟写作有关的标签，做一个完整的截图发给大家，在你构建的时候，你可以详细的看一下，可能能帮助你少走一些弯路吧！然后你遇到了任何问题的话，都欢迎你和我进行一个交流。


    因为时间的关系，很多内容不能一一的去讲解，所以如果有不清楚的地方，欢迎大家找我来进行交流。


    今晚的分享到这里，非常感谢加盐兄能提供这次机会，那我个人也希望以后能和群里的各位朋友能有更多的一些合作，谢谢大家！'
  - '[PAGE 67]


    # 我是如何管理 1500 名外卖小哥的


    # ——美团外卖崛起过程揭秘


    分享者：美团广州城市经理、得到大学第一期学员，梁海洋


    时间：2019 年 9 月


    加盐星友会的各位小伙伴，大家晚上好！我是梁海洋。


    今天很荣幸能够接受到加盐的邀请，在群里给大家做一个分享。过往的九年时间，我一直在做一件事情是——把线下的好吃的、好玩的搬到线上；让使用这个 APP 的小伙伴，能够更方便地去点到餐。


    在这个过程中，我经历过两个主要的业务阶段：第一个是从 2010 年开始的千团大战；第二个是在美团外卖的这段经历。而这其中，我把过往九年核心的一些业务的增长、背后所做的、核心的决策以及执行过程中的一些干货，拿出来和大家做一个分享。


    好，那我们现在开始。


    今天我想主要跟大家去分享一下，在美团外卖，从日均 200 万单到 2000 万单近 10 倍增长的过后，背后是做了哪些正确的决定，以及线下执行的过程。


    在我们身边，有这样一群人，他们每天骑着电动车穿梭在大街小巷，在下雨我们不愿意出门的时候，他们能把餐送到我们的家门口；在中午外面三十七度，热的不得了，我们不想出门的时候，同样，外卖小哥也能够把餐送到我们的办公室。


    就是这样一群人，每天为我们提供着这样的服务。但是可能多数的小伙伴对外卖小哥这个群体是不熟悉，不了解的，甚至有误解。所以今天我想借助讲外卖订单十倍增长的背后，让大家对外卖小哥这个群体有了一个了解，同时打消对他们的误解。


    我会从三个角度和大家一起去聊一下。第一个，美团外卖作为外卖行业的后来者，是如何赶超领了多少；第二个，从日均 200 万单到 2000 万单的背后做对了什么；第三个，我们讲一下日均
    2000 万单的时候是如何做到半小时送达的。'
  - '[PAGE 68]


    对于一家由线下履约环节的互联网平台，它的核心运营要素可以分成这三块：供给-流量-和履约。


    比如我们想点一份咖啡，作为用户的流量，我们有了下单；商家接到订单之后，会把这个咖啡准备好。咖啡准备得再香、再及时，它还是在店里面的，这就需要一个环节——配送的环节，把咖啡从店里送到我们的家里。


    所以这是一个履约的环节，送的越及时、服务态度越好，我们就会下更多的订单。订单多了，商家就会做出来更多的活动，有更多的商家加入到这个平台，提供供给。


    所以按照这样一个核心运营三要素来讲，互联网平台是这样运营的，对外卖来讲也是这样。


    接下来我们看一看美团是如何进入到外卖这个领域的。


    ![](img/74d384fc5d948a0c31090e035208669c_68_0.png)


    今天，随着这样一张图，我把时间带大家切换到九年前。熟悉这张图的小伙伴，应该是知道在 2010 年的时候，团购这样一个互联网的产品上线，当时我们的消费习惯可能是这样的，周一到周五的时候，每天都早上盯着团购网站更新的团品，可能是一张电影票，可能是一顿餐。然后谈完之后，周末去到这个店里去消费。


    那个时候大家还记得我们是用什么样的工具在上网吗？当时，我们用的是PC 的电脑，也是我们称为 PC 时代。


    团购这个商业模式在 2010 年的时候，为很多商家带来了新的顾客流量。但是到了 2012 年，从智能手机的陆续普及就出现了一个情况，用户以前是在电脑'
  - '[PAGE 69]


    上的提前团购，到商家里去消费，但是有了智能手机之后就会出现一个情况，到了商家门店，然后再去找团购，那个时候商家对这种模式是完全不能接受的，这就相当于你抢了我到店的生意。所以团购这个模式在
    2012 年的时候急转直下，在众多的团购网站中，美团也面临着这样一个威胁，所以当时在十个月的时间里呢，内部的团队尝试了 30 多种内部创新的项目，其中之一就是美团外卖，其他的项目现在陆续的已经都被撤掉了。


    在 2013 年，美团决定做外卖的时候，饿了么是从 2009 年开始，从大学生市场开始做外卖，到 2013 年已经有了四五年的时间，他在线下也积累了相当多的商家，以及比较有经验的一个成熟的运营团队，他的日均订单可以做到
    10 万单。


    当时用户的消费频次，一个月可以做到四次，一年的整个流水，可以做到 2.5 个亿。所以看到这样一个数据之后，我们得出了一个结论：外卖，是一个好的生意。


    所以这样美团开始了外卖的这样一个业务的尝试，在最开始的时候，因为是一个小项目在一个小范围内的一个尝试，所以最早的 APP 的界面是非常的简陋的。


    在最早的时候，外卖接单是通过 APP 上接到单之后，通过电话打给商家，然后才去下单，就这样，在什么都没有的时候，美团的内部团队，开始做了外卖这样一个生意的尝试。


    大家可以看一下这样一个标题，条幅的标题：血战 300 天，整个中国都干翻。可能到了 2019 年的今天，我们知道了，你在大街小巷，34567 线城市，都可以点到外卖。但在
    2013 年刚刚起步的时候，确实是在什么都没有的情况下，就停在一个想法，看到这样一个业务，应该有机会，然后开始做的这个项目。


    尽管在产品以及整个服务链条的这个硬件上，是没有什么太成熟的优势，但是就凭这样一个口号，我们什么都没有，但是我们有兄弟和勇气，我们的整个团队开始做了外卖这样一个业务。


    在做的过程中，我们发现了其中的第一个机会：饿了么当时抢占了整个市场的极有力的一个地位，就相当于是一个巨人一样，但在分析市场战局的时候，我们发现饿了么放弃了
    18 个二线城市——这里面包括像武汉，西安这样的'
  - '[PAGE 70]


    城市。因为当时他判断业务的这个城市是否有业务需要开展的时候，有一个逻辑，是看校园外面有没有送餐的电动车，如果有的话就可以做，没有的话就不能做。


    但今天，我们回过头来看，像武汉，西安这样的城市，在全国的大学生校园市场来讲，是排名至少是在前五名的。但是按照刚刚我说的业务逻辑，是饿了么放弃了这样一个城市，所以对于这些饿了么没有抢占的城市来讲，美团率先还是起到了一个先入为主的一个影响。


    随着双方城市的一个拓展，一共有 216 座城市，蓝色的是饿了么占优的。黄色的是当时美团占优的，灰色的是没有开拓的城市。到了 2014 年的七月份，八月份，整个市场覆盖的城市，会不断的扩大。


    ![](img/74d384fc5d948a0c31090e035208669c_70_0.png)


