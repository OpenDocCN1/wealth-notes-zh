    文化模型、丹尼森组织文化模型，Chatman的文化价值观矩阵/OCP），罗伯特评估模式，芝加哥的VOCS模型，SPROCK利管理模型、人力资源成熟度模型、PA&F管理角色模型、SCOR供应链模型、SFOE利润模型，PDCA管理闭环法，企业资源结构分析、企业经济结构分析、供应链模型，措施计划模型，诺兰的过程模型，库加信息技术、麦尔凯利技术系统模型、麦特雷全系统过程模型，麦特雷竞争分析，竞争对手分析工具、威胁分析矩阵、企业竞争优势九力分析模型、GREP模型、多点竞争战略、目标分析法、三维网络矩阵、重内部资源理论，4F内部因素评估矩阵、EIT外部因素评价矩阵、CPM竞争态势矩阵、GE/行业吸引力矩阵，价值链模型、CRM客户关系管理、波特五力理论、马士物流需求层次、波特一般战略、德鲁克
