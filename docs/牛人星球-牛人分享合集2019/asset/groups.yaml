    但是，大家应该知道的是，恒大冰泉的价格浮动，以及它的新品牌。因为恒大冰泉的业绩并不是太好，所以它的产品采用对应的策略又不断地在发生变化。这里我就不仔细去说它的产品，我想问大家一个问题，提到恒大，大家会想到什么？


    首先我想到的是恒大足球。因为它引领中国足球引进国际球星。但是，如果我在中国买矿泉水，我会选择百岁山，因为对我来说，百岁山就是矿泉水。恒大在您脑中对您的影响是什么？


    通过以上案例，相信大家对各种广告和公关背后的主攻点，会有一个清晰的认识。


    ## 营销舞台


    在这里我们引出我分享的第二个部分：营销舞台。


    营销的舞台就是心智，也就是一个人对事的印象。中国有一句成语叫对牛弹琴，意思是即使你弹得再好听，牛也不会这么认为，而且它也不会买单。


    如果贵司产品在市场的目标客户群体，没有贵司认为该有的理解，我认为您就应该开始分析是哪里出现了问题，并采取对应的策略。


    请看图 4，心智就是营销的舞台，了解自己的舞台，就需要了解自己的脑袋是如何运作的。


    ![](img/74d384fc5d948a0c31090e035208669c_35_0.png)


    大家看我上面发的这幅图，代表的是人的不同感官的信息接受度。通过这张图我们注意到，除了最里面那个小红点以外的其它圈，代表不同的感觉，从味觉到视觉是一提升的。而且信息量的接受程度也是很夸张的，大家可以看一下对应的数据，不知道大家看到这里有没有很惊讶。


    我想说的是，我们可以接受很多信息，但是我们人脑可以处理的信息却非常有限。如果你们的产品希望成为被处理的那一部分，请您一定要建立在您目标客户的认知基础上，而且您传达的信息要以少为主，以少为多。


    只要您的产品进入目标客户的心智，您才会有对应的销售额。一项哈佛的研究表明，人脑对同类产品，可以记住的品牌只有七个，而且随着时间的推移，数字大概会减少到四个。


