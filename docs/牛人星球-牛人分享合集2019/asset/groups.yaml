    # 管理思维与工具在日常生活中的应用


    讲师：何加盐


    时间：2020 年 2 月


    大家新年好。先给大家送上一个迟来的新春祝福。


    这一次也是很特别的一个春节，相信大家都留了难忘的回忆。不知道春节有没有多长几斤，可能要等到这段时间过去之后，再通过运动减下来了。


    我相信很多朋友都已经在家里憋得不行了，我也希望今天晚上分享能够给大家带来一些乐趣和启发，在这个特殊的时期，给大家带来一点新的、不一样的、正能量的精神力量。


    我们这次分享的标题是：《管理咨询思维与工具在日常工作和生活中的应用》。那么开始之前我先问大家三个问题：


    - 1. 为什么 22 岁的咨询顾问，能教 55 岁的大老板怎么做生意？

    - 2. 请问广州有多少只鸟？

    - 3. 总裁办主任要如何述职才能出彩？


    请大家看一下这三个问题，想一想。


    第一个问题。我们都知道咨询顾问很多其实是没有企业的工作经验的，有好多甚至是刚从大学毕业出来，22 岁就去做咨询，但是他们面对的对象有可能是个管理上百亿市值公司的大老板，他可能经验非常丰富。


    为什么这些老板会请这么年轻的咨询顾问来给他们做咨询，而这些这么年轻的咨询顾问，他又有什么资格能够教这些五六十岁的经验非常丰富的大老板，告诉他，你应该怎么经营？怎么管理？


    第 2 个问题，广州有多少只鸟？我后面会回答，现在就先不说。大家都知道很多咨询公司在面试的时候会出这样稀奇古怪的问题，包括谷歌、微软他们招人的时候也都会出类似的问题。很多人可能不知道怎么回答，大家可以先想一想。


    第 3 个，总裁办主任他要怎样述职才能出彩？我们都知道做销售的、做技术的，他的 KPI 是比较明显的，我到年终完成了百分之多少，或者是超额完成了就能拿到多少的奖金，这个都很好说。但是一个总裁办主任，他能够怎样述职呢？


    好，我希望大家带着这三个问题，我们一起来探索一下管理咨询的奥秘。三个问题的答案，我都会在下面逐一的讲到，我们整个的分享将按照这么三个模块来进行：


    - 第一：我会介绍一下什么是管理咨询？

    - 第二：介绍有哪些管理咨询的思维，以及在工作生活中有哪些应用。

    - 第三：介绍一些基本 的管理咨询工具，以及它们在工作和生活中的应用。


    首先什么是管理咨询呢？我给它下了一个定义，管理咨询是找到一家公司在战略或者经营管理上存在的问题，给出解决方案，并且帮助企业将方案落地实施的过程，就叫做管理咨询。可能不同的人会有不同的定义，上面说的这个是我个人对它的一个定义。


    我们从这个角度来看，管理咨询其实不仅可以用于企业，大到一个国家，小到个人，我们平时工作和生活中都可以用。比如我们日常碰到的人生目标的问题，或者我们做事的方式方法问题，我们人生的动力或者工作的激励方式等这些问题。我们的管理咨询思维和工具就可以找到问题存在哪里，并且给出一个解决方案，把它落地实施。


    所以管理咨询不光是对企业，对个人也可以产生很好的作用，这就是为什么我今天要讲这么一个题目。


