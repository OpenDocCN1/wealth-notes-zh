    我从小父母对我比较宠爱，我妈妈对我的评价是特别任性，比较懒，自理能力很差。在我 18 岁成年的时候，我性格非常自卑，因为做很多事情觉得自己很失败，这种性格让我越来越痛苦。


    我有很强烈的愿望：希望通过自己没有依赖任何人、没有任何靠山的情况下，把自己潜力逼出来，看自己能做到什么地步。所以我离开我的家乡，在保证安全的情况下，陆陆续续待了
    50 多个城市。


    2013 年中间有几个月我女扮男装，身无分文的在外面漂泊了几个月。这段经历对我一辈子都有很大的影响，到现在那段日子养成的很多习惯依然会在生活中能够表现出来。我想以后遇到任何困难，大不了和当初一样两手空空。


    除了年龄的增加，我也没有失去什么，我以前这样过来了，那还有什么害怕、还有什么不敢做的呢。


    流浪最重要的问题，大家可能会想到问：你吃饭是怎么解决的？我实话实说，我大多数是吃那种水果店剩下的一些水果，还有一些超市临近保质期的、要扔掉的那种食物，看起来好像不是那么健康，但是那段时间身体挺好的，这是一个很真实的问题。最开始的一两天，我只是到超市，看看有没有免费试吃的，但是那种量很小，自己也挺不好意思的，我就想哪个地方会有别人不需要、但是又安全合法的东西呢？边走我思考观察，我就摸清了这方面的规律。


    比如到了傍晚的时候，很多早餐店会把豆浆和不能隔夜的东西扔掉，你向他要，他就会给。到了晚上有麻辣烫煮熟的也会扔掉，因为隔夜放冷藏第二天吃出来就没有那么新鲜。


    像这种商店很多，他们扔到垃圾桶也是扔，而且这些东西如果说有顾客打样前来买的话，还是能够卖的掉。我会在他们即将收摊确定没有人买的情况下，再向他们要，他们会给。到早上水果店会挑出来很多水果，有的水果只烂了一丁点，那把那一点挖掉，对身体也没有影响。'
