    是非常多的。今天时间有限，我们也不可能都讲到。我总结出了4个思维以及5个工具，所以我们等一下就会围绕4个思维和5个工具来展开。


    我这里主要讲这4个思维模式：


    +   第1个是问题导向思维，第2个是流程优先思维，第3是经营分析思维，第4是结构化思维。


    我们首先看第1个，问题导向思维。


    我们日常工作和生活中经常会碰到各种各样的问题，男性和女性在处理问题上经常会有很多不同的地方。大家都知道女生比较感性，男生比较理性，经常你会碰到的一个问题是：老婆回家跟你讲，她在公司遇到了一个问题，比如老板有什么做的不对，她很不爽。很多时候老公就会帮她分析这个事情是什么原因引起的，老板是怎么样的人，你是什么样的人，分析得头头是道。但是老婆却一般都很生气，为什么会这样呢？


    其实老婆在说这个问题的时候，她并不是寻求一个理论的分析或者一个解决方案，她只是想要发泄一下。这个时候更好的方式有可能是你跟着她一起说，你这个老板真是太坏了。


    所以我们男性跟女性经常会因为这些问题造成一些冲突，一个是情绪发泄的思维，一个是问题导向的思维，两个不同。


    我们在管理咨询以及生活或者工作中解决问题的时候，更多的需要用到问题导向思维。碰到任何问题，不管是发牢骚生气还是大骂一通，都不解决问题，我们要的是怎么样能够把这个问题解决。


    这句话听起来好像很简单，但实际上，在我们工作和生活中，很多时候就会忘记这一点。有时候你会对孩子生气，比如他不吃饭或者老看iPad，或者不好好写作业，但是我们都知生气其实并不能解决这个问题，我们是落入到情绪发泄的思维去了。如果换一个问题导向的思维，可能你的情绪会更加平静，用孩子更能接受的方式去做这件事情。


    我们以前做咨询的时候也碰到过这样的老板，他每次开会要解决问题，首先高管把情况一读，他就开始骂人，说你怎么这个也不行，那个也不行。结果一次开会90%的时间都是他在骂人，最后问题却没有解决。所以每次开会都成了批判会，实际上对于公司的运营来说是一点用都没有的。因为他把时间都浪'
