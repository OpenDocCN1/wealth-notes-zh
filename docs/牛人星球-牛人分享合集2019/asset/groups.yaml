    # ——中国企业与中国人在非洲的商业与生活


    讲师：朵朵，清华硕士，曾任驻非洲记者。朵朵是清华大学传播学硕士，毕业后一直当记者，她跑遍了非洲很多地方，也经历过一些动荡。她的实地观察，将帮助我们澄清很多对非洲和非洲人的误解。


    时间：2020 年 4 月


    大家好，我是朵朵，今天很荣幸受何加老师委托来给大家讲一讲非洲。我和何加老师是很长时间的朋友了，今天我给大家讲一讲非洲，主要分成三个部分。上次有群友也问了一些问题，我把这些问题也都包括在这三个部分里面。


    第一部分，我大概讲一讲非洲的概况，让大家对非洲有一个大概的概念。


    第二部分，有群友也问到欧美和中国在非洲的势力范围。我给大家讲一讲，哪些大国在非洲影响力比较大，就是大国在非洲的势力对比。


    第三部分，我主要聚焦在中非关系方面。那可能中非关系是大家最感兴趣的一个话题，里面我会涉及到基建；还有中国私营企业在那边的情况；还有中国和非洲在疫情合作方面的情况；还有一个中非的舆论的互动。


