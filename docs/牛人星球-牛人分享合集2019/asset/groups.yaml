    被深深吸引了，情不自禁的拿起来阅读。时间过得很快，已经到了十点了。这时候他就感觉有些不自在了，因为他自己没有按照承诺来实施。但是转念一想，这个商业报告是一种精神食粮，也是沟通媒体呀，作为部门主管怎么可以不关心呢，他现在不看，以后也会看，这样一想他心里面安心不少。这时候他准备开始正式的工作了，可是不凑巧，来了一个电话，是顾客的投诉电话，他花了40分钟赔罪道歉，终于平息了对方的怒气。于是他挂了电话，去了一趟洗手间。


    在回来的途中，他闻到了咖啡的香味。原来是另一部门的同事正在享受上午茶，这些同事邀请他加入，他心里想草拟预算的工作很伤脑筋，要是没有一个清醒的脑袋很难做好，于是毫不犹豫的加入了，在那里聊起天来。回到办公室后，他果然感觉到精神好了很多，这时他准备开始工作了，可是一看表已经十一一点二十了，离十一点半的部门会议只剩十分钟了。他反正短时间内这个事情也完成不了，不如把这个工作留到明天来做。


    大家看到这个案例后，会发现小张他既定的目标都没有完成，干的事情好像都跟当初设定的方向有很大的差距，他在时间管理方面做的很不理想。实际上在很多公司像小张这样的一种现状是经常性的，不是个别案例，它是一种普遍的现象。


    大家回想一下我们自身，在没有学习时间管理或者说没有时间管理的一些意识，方式方法的时候，是不是就像小张这样。好，接下来我们再来看时间的价值。


