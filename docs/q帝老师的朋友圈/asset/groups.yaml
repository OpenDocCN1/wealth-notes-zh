    △一个普通人一无高人指点，二无师长提拔，三无父母管教，你让他忽然超越自我，重新定位人生价值坐标，他没有能力，也没有机遇，所以说一个人想改变原有的生活轨迹，摆脱阶层束缚，真的难上加难。


    △什么样性格的权谋家，都有成功的，所以说核心的不是自己性格问题，而是自己的性格是不是适合身边的环境，适合与周围的人进行交往。遇到挫折是不是可以及时调整自己的性格，这才是主要的。


