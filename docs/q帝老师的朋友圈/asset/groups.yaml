    中，越是上位者，越喜欢让自己的心思带点朦胧美，不喜欢周围人看透自己，正所谓大丈夫做事喜怒不形于色，毕竟领导也担心，周围的人把他的心思摸得一清二楚，这样会导致他的某些管理手段失效，降低他的威信，甚至让他感觉无法掌控，而对你产生戒心。


    △老板并非不喜欢聪明的下属，也并非不喜欢有才能的下属，但他们绝对不喜欢将聪明和才能用在老板身上的下属。在职场中，老板之所以不把某些事情向外公告或者不告诉其他人，自有他的全盘考量，有时候你只要照做就好，不需要拿起显微镜和扩音器猜测和传播老板的心思，记住在职场中，我们要学会揣摩圣意，明白上司的想法和意图，但是在老板并不打算让大家知道的情况下，我们千万不要随意昭告天下。


    △中国式开会，官僚主义的巅峰，就是清朝议政王会议：小官说不了话，大臣不敢说话，领班的亲王不知道说什么话，讨论谈不上，争辩更不会有，多半是亲王说如此如此，大家点头，散会。之后再有属员拟稿，分送各大臣签署奏报。


    △古代投降是要带家眷的，如果不带家眷都会被认为是诈降。所以背后的军事首领为了防止边关的人投降，基本上是把他们的家属放在内地当成抵押品的。因为大家都不是靠感情信任关系来控制边关的将士，而是通过人质抵押品来取得信任的。


    △打草惊蛇通常有 4 种用法：第一，通过佯动使敌人进入我们的伏击范围，第二通过小规模的进攻使敌人无法养精蓄锐，第三通过出其不意的进攻或者政治攻势使敌人败退，第四通过强大的军事力量或胜利迫使敌人放弃战斗而投降。主要目的就是使敌人由主动陷入被动。


    ⚠很多时候我们追求成功就像摸着石头过河一样，我们只有认真地去调查石头的方位和坚硬程度，确定过河的路线，只有这样才能不至于坠落河中。事情的成功和失败，表面上看起来变化无常，但当我们摸清了规律之'
