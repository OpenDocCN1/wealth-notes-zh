  md: '

    你深信不疑的东西会反复加强，而你怀疑的东西，都会主动离开，让你固步自封。但是很多人不知道还有阶层茧房，你每天和同一个层次的人交流，大家认识水平相近，信息源相近，彼此之间还能互相肯定，这让你在这个阶层中被封闭起来，思维被牢牢的锁死，这就是阶层茧房。


    △一个人的成功，表面上是看能力和机遇，其实是看人际关系的能力，而人际关系能力的底层逻辑，就是和谁形成利益共同体，代表了谁的利益。谋取利益再披上道德外衣，这就是权谋家成功的真相。


    △在一个信息不透明，机会不均等，资源也不共享的环境里，最适合权谋操作的手段，因为谁敢于突破规则，不择手段，就能占有先机，取得成功。


    △社会稳定两代人之后就会出现阶层固化，做为底层老百姓，学历已经不足以突破阶层，需要依靠裙带关系来实现阶层跃迁，这是历史上最常见，也是最有效的方法，也是唯一的方法。


    △会议不仅仅是落实内容，更重要的是重视程度，敦促执行。体制内以文件落实文件，以会议落实会议，层层开会，层层陪会，常常让大家不舒服也不理解，而事实上呢，上一级不下文或不开会或者重要领导不陪会，给下级直接印象是上一级政府、部门，这些领导不重视这个事情，那么下一级也不会重视这个事情，在执行中就会打折扣，应付了事，上一级文件级别，会议规格，陪会领导的职务越高说明涉及事情越重要，下一级就越重视，反之则不重要，不重视。


    △我们学习权谋，作为局外人，最好看的政治搏杀是双方势均力敌，杀手各提一把刀，你来我往，慢慢的达到他的目的，但对于局内人来说，搏杀的双方这样的斗争，却是苦无尽期的折磨，谁都希望尽快结束战斗，尽快把对方搞死，一求独揽大权。


    △政治斗争，最可怕的就是，敌人已经磨好了锋利的刀，但何时下手，自己一无所知，意想不到的事情不知道什么时候发生，而又一定会发生。


    ▲在职场混的好，必须知道权力规律，一切都需要按规律办事，无论你喜欢或者不喜欢，你都得按照规律，否则你就会被权力所排斥所打击。适者生存，就是适应规律。大多的失败者，就是不明白这个真实的社会规律。


    ▲道是什么，就是规律、本质、真相。所谓得道的人就是只看到了规律本质真相的人，并且按照规律本质真相去做事的人，这种人就是我们说的高人。但是规律真相往往很残忍，看到真相很多人无法接受，而权谋就是这样的真相。


    ▲每个人的精力分配，一定程度上反映着他的层次。每个人时间就这么多，精力就这么少，你看他怎么分配就知道了，根本无需多说，人往往会自主地分配给自己觉得价值高的事，你分给价值低的事，为了价值低的事来回折腾，只能说，你没有更有价值的事情投入精力，或者干脆你就是个价值低的人。


    ▲社会考试不同于学校考试，他并不需要你全部答对题，而是要明白出题人的意图。


    ▲认知越低的人，越固执，看待事情越主观。认知越高的人，越谦和，看事情就越客观。一个人的贫穷，从来不在于出身和环境，人生很长，现状可以改变。只有穷了品行与心性，穷了思维与见识，才是无可救药的贫穷。


    ▲善于为人处事的，一定精通反败为胜之道。在处理复杂的问题时，失败几乎是不可避免的，因此如何利用失败所提供的信息和资源，变不利条件为有利条件，进而反败为胜，就成了每个人必有的责任，纵观古今成功之人，他们大多经历了由败转胜的轨迹，而失败之人并非一开始就一直是失败，而是经历了由胜而败的巨大转变，成功与否就取决于对胜败关系的理解，以及对失败的反思和利用。


    △忠诚并不是中国人的专利，美国当代政治学者戈登·塔洛克，经研究发现“政治人必须避免过于频繁的改换门庭，倘若他在领导遇到麻烦时，还能坚守门户，这样的名声，会使他，比他的对手，那种随时准备见风使舵的人，得到更多的报偿。”这个问题我们在三国时候，曹操除掉吕布都搞明白了。


    △挑起性别对立，引起社会矛盾的女权操作手法：当男性是受害者时，好像并没有受害者；当女性是受害者时，全体女性都是受害者；当男性是施暴者时，全体男性都是施暴者；当女性是施暴者时，她既是施暴者，同时也一定是受害者。


    △取悦领导的技巧，西方人和我们一样。遗失在西方典籍里面的权谋：侍臣不仅遵从统治者表露出来的最细微意愿，还要花大量的时间了解统治者未曾表达的意愿，以便能未雨绸缪，与统治者个人生活相联系的所有事情都能引起政治人的巨大兴趣，他睡得好吗？他今天感觉如何？谁会是他的下一个情妇，最重要的是他对我的态度如何？对我完成的任务怎么看？每次与统治者的接触都会被精心策划，以留下适当的印象。


    △一定要让你的直属领导全力支持你，永远都要与你的直属领导搞好关系。如果你觉得他人品不正、喜欢玩阴的、业务能力极差，那么你需要做的也不是跟他对着干，而是抓住一切机会换岗，到有上进心、业务能力强、关照和保护下属的领导手下工作。这一点是如此重要，却很多人都没有意识到。你的直属领导具有推荐权，他如果不支持你，你什么也做不好，即使你的能力再强，在没有背景的情况下也几乎不可能突破他，获得任何晋升和提拔。


    △在任何时候对于同事和领导的工作都要秉持配合和支持的态度，永远不要不耐烦、给别人脸色、推脱，这种态度一但让关键领导知道了，你的职业生涯基本上就结束了。但也不是说你要一味的讨好同事和领导，而是要学会“支持性沟通”，在自己做不了或者不能做的时候就事论事、表达自己支持对方态度的基础上说明自己完成工作的困难。切记，太多人因不支持领导的态度和不会“支持性沟通”技巧倒了大霉而不自知。


    △资源不断扩张增长的时期大家无所谓，但是大家一旦资源恒定，内卷内斗时代就到来了，资源势力范围划分完毕之后，最有效的工具就是权谋。


    △当员工提拔为管理者时，就会碰到很多高手，有支持你的，有给你挖坑的，也有暗中观察你的等等。这个时候，你除了做好工作、搞好业绩外，也开启了人事斗争。能否在斗争中求发展，这就看你是不是懂权谋，能否熟练使用手腕了。


    △人是善变的，同时也惧怕改变，这是因为我们害怕破坏现有的一切，我们习惯于躲在舒适区里，自我保护，以防御伤害，或者因为某些陈旧的方法仍然可行，我们就不愿意去寻求新方法，创造新思维，超越既有的经验，但这样是不对的，尤其是对于一个领导者而言，想成为一个先知先觉的先行者，就必须面对改变，主动寻求改变。


    △资源约束型创业者，将每一位交流对象都视为潜在的客户，投资者，员工或者供应商，或者至少是他们前进路上的潜在资源，即使创业者拿不到真正的订单，但是只要他们耐心去培养对方的足够兴趣，努力建立友好好关系，今后他们还能回头去找对方。所以这种一无所有的空手起家的人，人际关系都特别成熟，特别的好，这就需要权谋这一块深谙人性。


    △社会竞争没有对错，只有输赢。在权谋家的眼里，没有永远的朋友，也没有永远的敌人，只有永远的利益。为了利益，他们可以把敌人变成朋友，也可以把朋友变成敌人；为了利益，他们可以为朋友两肋插刀，也可以插朋友两刀；他们都拥有宽大的胸怀，里面装着只为利益而跳动的心。


    △在普通人眼里有些原则的东西是不可以让步的，也是无法用金钱来衡量的，但是在权谋家看来，任何东西都是有价的，都是可以用金钱去置换的，只要价钱合适有利可图什么都是可以商量的，包括原则问题。


    △在历史长河中，评判事物并没有统一的道德标准，只有胜负之分，竞争没有对错，只有输赢。成王败寇，是千古不变的真理，过去是这样，现在是这样，将来还是这样。英雄不问出处，胜利了你是英雄，失败了你就是狗熊。成为英雄，你就有鲜花簇拥和美女相伴，若是狗熊，你就只能任人宰割，人们会砍下你的熊掌，摘下你的熊胆，献给英雄，让你成为英雄的美餐。


    △穷人都有自卑心理，他们都不愿意接近富人和老板，因为他们担心被人瞧不起，穷人都是往下交朋友，交往的都是比自己还差的人，原因有三点：首先，他们都有一精神胜利法，在他们看来我不是最穷的，还有比我更穷的人。第二他们同病相怜，需要在一起抱团取暖，相互抱怨。第三，他们能在比自己更穷的朋友面前吹嘘自己，找到某种心理上的安慰。


    △权谋家交朋友，更多的考虑是不是有权力和利益，有没有经济效益，他们花钱交朋友是为了自己的价值提升。而底层交朋友，更多考虑的是寻求共鸣和消磨时间，他们在结交朋友的过程中浪费的不仅仅是金钱，更有跟流水一样一去不复返的时间。


    △权谋家考虑问题，一切都是以利益为中心。把复杂的问题简单化，把简单的问题利益化，再复杂的问题，在利益面前可以变得很简单。再简单的问题，在利益面前可以变得很复杂。在利益的前提下，什么问题都可以沟通，什么事情都可以商量，什么问题都可以换个角度去思考。


    △权谋逻辑中的自信，就是当别人都认为你不看好的时候，你自己认为自己还行，如果你的事业需要你是一个胖子脸，你恰好又是个瘦子，那么你必须打肿脸，为了你的事业去充胖子。


    △细节决定成败的本质是数据化，比如说卖牛肉米粉，每碗粉的牛肉是多少块？每块的重量是多少克？牛肉选用什么样的牛？牛的年龄在多少岁？什么时候是最佳的采杀时间？牛肉怎么制作？牛肉汤怎么熬制？熬制多长时间为最佳？所有这些决定了最终的口感，决定了能不能形成一个稳定的品质。


    △壁垒是个什么东西？通俗的说就是人为设置一些障碍，让圈外的人进不去，只有他们少数几个人把控着话语权和圈子的游戏规则，不让你进去，你的东西，他们不想知道。他们的东西，也不会告诉你，他们是如何取得成功的，更是不可能半点信息透露给你。行业壁垒，在任何地方都是存在的。比如说，简单的夸大自己创业中的苦难，让你知难而退。


    △官场斗争中只有单选题，没有任选题和多选题，只要你不投靠，不站队，那你就是其他队伍的人，是敌人，是坏人，是恶人。


    △在中国古代特有的政治语境中，用人之道忠奸其实很难有明确的标准，就最高领导人皇帝来说，要重用的人，必须是自己人。所谓自己人无非就两种人：一类是自己的亲人或亲属，这是基于身份特权形成的，但皇帝也知道这类人可以厚禄高爵，但不能过多的给实权，否则祸生于肘腋，难以抑制。另一类；这是自己了解，信任，赏识的人，这类人可资利用，易于控制，实在不行可以杀掉，免除后患。所以严格上说在皇权专制的政治背景下，忠不忠是一个道德立场问题，奸不奸也只是个利益立场问题。


    △一个普通人一无高人指点，二无师长提拔，三无父母管教，你让他忽然超越自我，重新定位人生价值坐标，他没有能力，也没有机遇，所以说一个人想改变原有的生活轨迹，摆脱阶层束缚，真的难上加难。


    △什么样性格的权谋家，都有成功的，所以说核心的不是自己性格问题，而是自己的性格是不是适合身边的环境，适合与周围的人进行交往。遇到挫折是不是可以及时调整自己的性格，这才是主要的。


    △选大学，报志愿，先看自己家族有什么资源，如果没什么资源就看考生有什么特长，如果特长也没有就看有什么爱好，如果爱好也没有那就看当时的社会对各专业的评价。


    △任何政治家的本能就是稳定权力和利益，这是一切政治行为的原始动机，但是采用什么样的方去巩固，则考验一个权谋家的人性手腕。


    △处理纠纷，一切都是为了达到我们自己的政治目的，至于手段原因真相，都不是权谋家考虑的。权谋家考虑的是如何完成目的的同时，他们不给我们找麻烦，拖后腿。


    △当一个下属功劳很大的时候，忽然隐退或是休息，一般解释只有两种，要么是张良柔顺自保，要么是韩信讨价还价，但99%的人都是讨价还价。其意图就是告知自己的领导，让他坚量下属的价值，需要更多的表示，主要是下属对目前的待遇不满。


    △所谓的改革，说穿了就是利益再分配，分配者实现自身利益实现最大化，再贴上道德化，合法化的标签。改革表面上是抓经济；但最核心的一项就是突破规则限制，扩充领导权力，确保一切围绕政治稳定。


    △【彼众我寡，先谋其生。我众彼寡，务张其势。善胜者不争，善阵者不战。善战者不败，善败者不乱。】对手子多而已方子少，先考虑活棋。当自己子多而对手子少，一定要抓住时机大张其势。善于战胜对手的人并不拘泥局部之争，善于布阵之人并不主动求战，善于作战之人会立于不败之地，能正确对待失败的人即使局部作战失败也不会溃乱。


    △纵观历史，哪里有垄断，哪里就有暴利，哪里有暴利，哪里就有腐败，自然的，哪里有暴利和腐败，哪里就有亡命之徒。


    △【夫棋始以正合，终以奇胜。必也，四顾其地，牢不可破，方可出人出意，掩人不备。】下围棋，开始时要按常规走，而最终要出奇制胜，所以一定要在确信自己的棋没有毛病、牢不可破的前提下，才能出其不意，攻其不备。


    △人脉的本质不是互相认识，而是互相需要。


    △不是所有问题都要马上解决的。但没有搞清问题的真正原因之前，不要急于解决问题，因为解决问题的举措往往会制造出新的问题，更大的问题，这制造出的问题，往往比原来的问题还大
    100 倍，那还不如不解决。


    △办事，能不用人情的地方尽量不用人情。用人情办事，很多时候只是表面上占了便宜，如果你用人情来置换对方的付出，那么这份人情不还，关系就会失衡，这份人情要还却没有明确的价值衡量标准，这就很麻烦。所以说纯粹的交易关系看起来很冷酷，但是因为双方合作达成了一种利益共识，因此双方有什么意见看法可以直接了当的，说出来丝毫不惭及感情，这反而能够得到彼此想要的结果，另外交易结束后关系也就结束了，不会有后续人情世故需要维护，因此对个人来说更轻松。


    △普通老百姓才想研究别人想什么，想以理服人，而高层从来不考虑这个问题，只考虑让你屈服，还可能是屈辱。


    △明白怎么玩资源，明白怎么玩渠道，挣钱很轻松，靠经营关系永远比靠经营其他内容来钱快得多。


    △古代中国皇权、宦权、相权是最重要的三大力量，任何两种力量联合起来就可以击败其他一种权力，如果皇帝懂权谋，自然会在宦权和相权之间协调，有时候放放水，有时候点点火，巩固巩固自己的地位，保持权力平衡，但终究目的无非是让宦权和相权好好的，乖乖的为皇权服务，纵观历史，宦权如果一支独大，大臣的位置，不保不说，皇帝的位置甚至生命都可以受到威胁。这里面的宦权不一定都是宦官，更多的是权力身边的服务员。


    △社交的本质是价值交换，所以当别人帮助你时，一定要懂得感恩和回报，而不管对方是否在考量你的价值之后才选择帮你。因此，客观事实是对方确确实实帮了你，你也确确实实受益了，这个时候一定要给对方积极的回应，才能达到一种价值的平衡，让对方觉得帮你，帮的值。对方付出没有白费。感情不要停在心里，回应最好是及时的，给红包或者送一些小礼品。


    △我们一定要戒掉受害者思维，弱者代入，不要总去抱怨为什么别人这样对待自己，如果你的价值不够，你在周围的人看来也许就是一种负担，这样说起来很残酷，但是这就是社会真相。


    △凡风光而居台面之上者，都有其外在与内在的各种力量支撑，才得以维持及扩张自己的威势，找到对手最主要的顶梁柱，给他破坏掉或是偷梁换柱，便是还击的主要手段与内涵。来进攻你的人，大多都依托后方稳固，所以危及他的大后方，叫他后院起火，这是遏散自保的重要还击手段。


    △领导做决策其实不是漫无目的，而是有主线的，这个就是要分清楚利益共同体，然后自己永远站在利益共同体最大的一边。只有这样才能够团结大多数人，才能够让自己的权力稳定，才有机会做一些具体的事情。


