- raw:
  - '[PAGE 178]


    来，随着职场环境的变化而变化，才能一步步实现自己的梦想，在职场里，谁都无法做到完全的自己，老板不能，上司也不能，普通职员就更不能了，只能做善于适应的人，千万不要在乎别人的眼光，一成不变，只是理想状态，在生活中都不能实现，何况是步步凶险的职场。


    △职场年轻人的第一大坑：有自信心及主见的职场新人，初生牛犊不怕虎，敢于跟上司据理力争，坚信自己的见解是最正确的，希望上司接纳自己的建议，即使这种心态从工作角度出发。其实在领导眼里，也是一种有意抬杠，让他失去面子，丧失权威的行为，这是令上司不能忍受的，这种员工未来是会遭到打击的。


    △只有熟悉权谋思维，精通权力心思才能预判国家政策趋势，才能把握大的方向，创业事半功倍。但是不少人受到西方自由经济学的影响，远离政治，对政治充满鄙夷。其实中西体制不一样，西方是经济影响政策，而东方是政策影响经济。


    △农民意识缺钱了就要赚点快钱拢一把，而资本意识就是马上编一个更牛逼的故事，圈更多的钱，赚老百姓的钱，不如搞资本的更多更快。


    △面对几个同样能胜任的候选人，权谋家的选人标准是选择出身最差的那个，之所以这样是因为家庭环境更差的那个人，更能吃苦耐劳，更会打心眼里感激知遇之恩。更愿意接受教育熏陶和安排，因为这个人没有更多的选择。


    △所有的欺骗中，战略欺骗最可怕，也最能显示出权谋家的智慧和勇气，战略级的伪装不是头上插两颗草，而是有效的隐藏自己的意图，并让对手产生误判，乖乖的钻进自己编织的圈套中。


    △一个王朝之所以会衰败，主要原因是其收入枯竭，因为统治机器里面的所有成员都需要活着，不能保证他们的生存，也就对他们没有约束力，这样的统治阶级很快就会崩溃。所以王朝的中后期各种的焦头烂额都是围'
  - '[PAGE 179]


    绕着财政展开的。


    △为什么一个组织作为一把手，必须亲临一线严抓意识形态，主要原因是：一个组织的崩溃，首先是共识的动摇，然后才是组织约束的丧失，所以动摇军心者必须处死，牺牲不能被质疑，思想必须警惕，意识形态必须常抓不懈。


    △选择大于努力，但是如何选择，你必须有一个清晰的价值判断，而这个清晰的价值判断，必须固化到你的潜意中去，这就是我们的权谋价值观训练。


    △人生没有导师，关键时候，没有人把握方向和掌舵，全凭年轻时候的一腔热血，一丝冲动，一身的欲望，最终会走向歧途。


    △任何人的领导权力，都不是位置，而是一帮势力，这帮势力是盘根错节的利益联盟所构成的层层效忠。


    △想创业成功，就必须剔除自己创业理想主义的这种想法，踏踏实实的从利润下手，从生存主义下手，从预防风险的角度下手，太过于自信一直是创业的大忌。


    △上司虽然地位高人一等，但其权威难免受到挑战，比如当出现决策性失误时，在总结会议上有人可能会不留情面地指出上司的错误，这时候你应该挺身而出，即使不能成功为上司辩护，也应该据理力争；指出影响决策诸多客观因素；不要让上司成为被众人攻击的对象，你要成为上司的贴身武士，保证他的权威不受影响。


    △大部分人都好为人师，老板也不例外，你大可以带着工作中遇到的问题去向老板请教，当你带着虚心去请教并发表自己的看法时，你的老板自然会乐于与你沟通，教你怎么去处理，这当然是虚晃一枪，实质上你是为了让老板了解你的表现，知道你对公司工作所做的一切努力，让老板解惑，只是一种很好的借口而已。'
  - '[PAGE 180]


    △历史上不少权谋家都以婚姻为跳板和筹码，需要第 1 任夫人拿到第 1 桶金完成阶层转化，需要第 2 任夫人合纵连横联合更大的势力，需要第 3 任夫人进行外交，树立自己的形象，让自己享受人生。


    △在职场中想要出人头地，脱颖而出，的确需要亮剑精神，适时展示自己的能力，让老板和同事都能看到你卓越的才华，但是许多心高气傲的中层却常常陷入这样一个误区，就是表现自己的时机错误的展示给自己同一阶层的同事面前，不知道韬光养晦，最终往往在激烈竞争中输得莫名其妙。因为同级别的同事之间，如果你一个人表现的过分积极，独占功劳，就会
    Additive 被别人当成眼中钉肉中刺。


    △老板的承诺你不能当真，也不可逼着老板兑现，但是你的承诺老板却当成军令状，如果逾期不能完成或者质量不能让老板满意，结果就可想而知。


    △永远不要给别人第 2 次伤害你的机会，这是权力的天则，一次不忠终身不用。


    △你需要为组织创造价值的能力，需要为领导创造价值的能力，需要为自身自己创造价值的能力，这 3 合 1 才是我们要琢磨的事儿。


    △真正的逆天改命就是价值观的重新突破，至于其他的算命，基本上，在中国，起到的就是心理暗示，心理医生 的作用。价值观的改变，相当于重新排列了你的基因，你的社会基因。给了你极强的心理暗示，然后你认为，你觉得，你应该，向什么样的形象和方向来塑造自己。这样的话，信则有，然后呢，你就逐步改变价值观。


    △对于高层而言，专业这个东西并不是自己首要考虑的问题了，考虑的是权力的问题，所以权力性人才的需求度就非常大。


    △无论如何要记住，上司就是上司，即使你们关系很不一般，也不意味着你对他可以没有敬畏和恭维，然而我们却因为和上司走得太近而忽视了'
  - '[PAGE 181]


    这一点，从而影响了自己的职业发展。


    △与上司或者老板之间的关系必须有一个度，虽然有时候上司并不会明确的跟你说他介意什么，但事实上他心里还是很忌讳一些事情，所以千万要把握一个原则，即老板是你的客户，而且是第一客户，必须把他服务好，你才会有好果子吃。


    △如何凝聚一个组织的共识，主要是三种手段：价值观洗脑、利益引诱和充分的斗争博弈。


    △无论做什么，时间窗口都很重要，比如说，你做一个商品，无论是产品优势还是技术优势，还是运营优势，一旦引起别人的关注，巨头就会砸钱挖人，模仿者会没有底线的抄袭，以更低的成本予以竞争，此时此刻你会发现你腹背受敌，你以前那种优势在慢慢的消耗掉，而且你内部会形成一种自我遮蔽的骄傲自满以及做事的路径依赖，无法关注到周围环境的变化，及时调整自己的策略，从而让自己走向失败。


    △一个政权的建立，最开始是靠军事斗争，其主要手法就是抢地盘，后面呢需要考政治策略，政治策略是关于社会怎么治理和资源怎么分配的问题，中间主要靠外交策略外交策略就是跟谁合作打谁的问题，谁是我们的朋友，谁是我们的敌人，这是革命的首要问题，搞的朋友多多的，敌人少少的，这是外交的核心。


    △职场中，市场不仅仅是“付出就有收获”的简单交易，更有期权、泡沫、风口、炒作等随周期变动的复杂现象，将权谋规律置于其中，才能更方便的看懂各类角色和生态位。


    △每个人都有自己的爱好，有贪财的，有好色的，有贪杯的，甚至有的是工作狂，但不管怎样，有喜好，就可以被利用，上司也不例外。一个人的喜好达到某种程度成为痴迷之后，很可能成为他判断事物对错的标准，只要你摸清上司的喜好，接下来的事情就很容易了，凡是不讨他喜欢的人'
  - '[PAGE 182]


    或事一定会遇到严惩，凡是和他共同喜好的人一定会得到嘉奖。


    △每一个老板都喜欢卖弄权术，而且很要面子，尤其是跟下属在一起时，你要尽量的迁就他，只有让老板欣赏你，你才能管理他，老板喜欢能帮助他解决问题，做事效率高的人，作为公司的一员，其实不要想你会做什么，而是去想你该做什么。


    △当一个人把他幼稚的心理展示在父母面前时，他们可以以亲情理解你，展示在朋友面前时，他们可以用友情宽容你，但是在职场就不同了，如果你还以这种心态与同事，尤其是一些年长同事交往，就会被认为不成熟，幼稚，轻则不让你担任重任，重则可能让你离开组织。


    △普通人是自己亲自撞的头破血流，以沉重的代价去换取经验，而高手是直接把别人撞的头破血流得到的经验，拿来化为己用。普通人是自己吃一堑长一智，而高手是看别人，吃一堑自己长一智。


    △所谓伴君如伴虎，其实在职场说的就是员工和上司走的太近，一不小心就会把上司得罪很大，一方面是因为你不经意间发现了上司的隐私，而且不注意保密的结果，从而稍有闪失找来杀身之祸。


    △领导者的“越权”，实际上也是一种“侵权”现象。对下“越权”，实际也是一种“侵权”现象。对下“越权”，使下属有职无权，下级会产生“上级领导对自己不信任，不重用”的疑虑；群众也会对这样有职无权、说了不算的领导产生尴尬情绪，从而使领导者加深了与上级领导人的隔阂。


    △贵人给我们的往往不是实际的资源和金钱，而是一个成长机会，与其埋怨自己遇到不好的上司不如检讨自己做事的心态，这是没有好的心态才让上次没有成为我们的贵人反而成了我们的敌人。这个做事的心态其实就是权力思维，精通权力心思，让我们和上司之间化敌为友。


    △除非你平庸一辈子，越往上走斗争就越激烈，越是要压上身家性命。'
  - '[PAGE 183]


    △很多人认为死是最终的评价，其实不是，权谋家是追求在有限的生命里，活的幸福程度才是。


    △面对自己的上司、老板或是同事，不要去试图改变别人，而是想着如何去利用他们完成自己的目的，不要凭借自己的好恶去判断别人，而是凭借权谋的手腕去驾驭别人。


    △如果没有底层价值观逻辑做指导，你所看到的东西，都是你自己偏见的印证。


    △在职场，一个优秀的中层干部，一定要明白人的劣根性，一旦你太优秀会影响别人的安全感和心理平衡，所以我们对待上级给我们的特殊优待，要明白会可能带来嫉妒和障碍，所以我们不要在乎表面的风光，要搞实际的利益才是上策。


    △领导真的把你当成心腹，嫡系来培养，会有作出如下的表现：给平台、给资源、给机会、给保障、给关怀。


    △无论他心里是出于尊重你，还是害怕你，还是懒得啰嗦，还是随波逐流，不管什么心态，只要他能贯彻到权力意志这就够了，权力意志的贯彻并不问原因和心理状态，只看行为上的服从。那些没有当过领导的人，才会片面的追求下属所谓的心服口服。


    薇芯：yxsk2022


    △同事之间虽是事业的合作者却又是利益的竞争者，在名和利的面前往往会充当掣肘者，同事相处既要密切配合，又要保持适当的距离，减少不必要的摩擦，彼此少受伤害。


    △遇见事情的时候，职场高手会想出两个方案，让领导来选一个，这样做的好处在于表现了自己对事情的重视程度和细致程度。又让领导发挥了决策权，让领导觉得自己有参与感成就感。


    △能以自己的力量，消灭对方当然是很好的，但任何人的力量总是有限的，这就需要能够利用种种矛盾，特别是对方内部的矛盾，而可以利用的'
  - '[PAGE 184]


    矛盾总是存在的，就是一时的不存在，也可以制造出矛盾来削弱对方，为我所用，不断的采用各种手段，引起对方内部混乱，谋取内汛，打进来，拉出去，很快对手就可以制造出分裂来。


    △谁有权就跟谁，谁职务高就跟谁，谁的话项用就跟谁，在职场记住这个顺序。


    △机关的具体工作非常多，这些工作不一定都是领导所关心的。领导最关心的是关系到全局利益，比较急，比较难，比较重的任务。如果我们能够以敏锐的观察力，理解一个时期内领导工作思路，以自己最大的才智和干劲把领导目前最关心的事办好，那么无论在业绩上，还是在上下级关系上，都能收到事半功倍的效果。


    △不跪舔，不拍马，不送礼的人能上位吗？当然有这种机会了，只不过是不多见而已。在一些派系斗争严重的单位，双方争夺某个职位，僵持不下的情况下，谁都不想对方的人物上台，也往往会推出一个与双方都无利害冲突，而且能够被双方都接受的人，以平息双方的争执，免得在斗争中两败俱伤。


    △其实大家在底层都有一个误区，就是觉得斗争这个东西不常见，其实事实上呢，越往上走，利益越多，越复杂的地方，斗争就越残酷，手段就越阴暗，联合的人就越复杂。


    △用某个核心人物的意外事件，来扭转政治意图和政治立场，这也是国际政治的常用手法，因为权力忽然间去改变立场的话是啪啪打脸的，失信民众的，但又必须缓和关系，只能用这种意外方式。这就是围棋里常用的手法，弃子争先。


    △若想在政治上立于不败之地，则需精悉小题大做，借题发挥之策略，运用得当与敌是矛，与己是盾。美国这一次在冬奥会参加不参加的这个事上，就是用的这个权谋套路。'
  - '[PAGE 185]


    △为什么在职场，最最重要就是取得领导的信任，因为这样的话有极强的号召力，可以假托王命，狐假虎威，借权行事，可以做到自己原先做不成的事，这就是取得领导信任的核心魅力所在。


    △在工作中要尽力收起自己的锋芒，做一个和善的人，单位不是家里，不会有人惯着你的坏脾气。因为哪怕只有一点问题，都会被人拿来放大，上纲上线的做文章，体制内又不能随便跳槽，上个班每天要承受身体上和精神上的双重折磨，根本没有幸福感可言。


    △在职场上不要随便，把自己的心事诉说给别人听，因为这些心事带有危险性和机密性：例如你在工作上承担的压力与牢骚，你对某人的不满与批评，让你爽爽的清楚这些心事时，有可能他是被人拿来当成修理你的武器，最后你是怎么死的，可能你连自己都不知道。因为你目前的好朋友未必也是你未来的好朋友，你这一点必须了解。


    △人是社会关系的总和，所以说核心是社会关系，然后是总和，不然懂运作关系的，做人都做不明白。


    △无论人还是组织技巧成熟之后，到了最后的竞争比拼的就是宏观决策，对未来趋势和方向的把握。


    △权谋是一种思维训练和方法，让你可以在有限的资源下做出最高效率最高程度的变现，并不是说你可以凭空得到很多东西。


    △今天一个朋友问我，你觉得诸子百家和你的权谋有啥区别和联系，我说他们都是面条，面包、油条等，而权谋是面粉。


    △在职场并不是一个强调公平的地方，因为在里面是赤裸裸的竞争，实力强者制定规则，实力弱者必须选择闭嘴。


    △有些人讨厌职场的复杂关系，于是撸钱借钱出去独立创业，以为可以回避复杂的关系，其实，当老板更需要当孙子，更需要在社会上跪舔各种关系，你在职场上只是跪舔一个或是几个就够了，但是你自己独立创业，'
