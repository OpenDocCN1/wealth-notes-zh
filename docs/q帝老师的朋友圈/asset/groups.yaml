    △如果我们想真正控制一个人，靠语言压制，不仅不能控制，反而会适得其反。正确的做法是：让对方尽情享受表达的快感，我们安静认真仔细观察对方，等他把自己全部袒露出来，我们也就可以把对方了解透彻，这样他之后的一言一行，一举一动都会落入我方的预料之中，我们可以彻底的驾驭他利用他。对方以为自己控制了局面，畅所欲言，认为自己得到了主动权，事实上他对我们一无所知，而我们对他一切，了如指掌，对方必然会被我们所制。


    △把舞台交给对方，把光芒交给对方，把表演权交给对方，他自认为自己很得意，实际上是彻底暴露了自己，大多数人都无法抗拒表达欲、表现欲和虚荣心，如果我们运用这个方法，在现实生活中几乎没有人能够漏网，这叫做欲取反予。


