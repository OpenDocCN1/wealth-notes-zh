    场合或只有两个人相处时，一旦涉及到第三方和公共场合，对领导一定要有君臣关系，上下尊卑。


    △为人臣者，不懂事君之道，得意而忘形，失意而頽废，或恃宠而骄，或纵欲而亡，故虽得其位，旋失其身。


    △多年来美国的对中战略一直没变，就是利用中国咄咄逼人的行为，刺激邻国的对其野心的担忧，然后利用这种担忧，构筑同盟，联手在外交上迫使中国放弃挑战，让美国主导的秩序安然无恙。其实在职场上也是如此不断的在私下宣传某人对其他人威胁，把其他的人拉在自己的同盟之下。


    △小人初得志那一刻最危险，因为他还没有当过大人物，他仍然丢不起一点点面子的小人心态。如果小人已经当大官做久了，他的城府会很深，你的祸是不会来的太快，但是小人刚得志，谁让他丢面子，谁在这个档口惹他，谁就倒霉。


    △我们学习权谋就是为了不断的攀爬，目的是改变阶层，因为上一个阶层资源太丰厚了，扌根汙毛都比普通人的腿粗，再有个人才华更加不得了。


    △此心不动，随机而动。说的是，心不动，是不被外界干扰，锁定自己应有的方向，随机而动，是随着外面机会机遇，这种变化而调整自己。


    △这个社会最本质的就是利益规律，而利益最终是落脚点，是在权力上。利益自己不会动，利益需要权力保驾护航。


    △无论你是什么身份地位、有钱没钱、有权没权，都要时刻反省自己，了解自己的长处、短处，对自己的认知清楚一些，就不会被别人谄媚的夸奖，爽上头；也不会被别人无故的否定，低下头。


