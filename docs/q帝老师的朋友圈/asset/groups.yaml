    - 任何时候都不要逆势而动，这个势，分为大势和人势。大势是大环境的条件，人势是周遭人对你支持的程度。如果大势不和，以本身的能力，强力出头，不是没有成功机会，但是会花很多的力气。人势若无，而强行出头，必然遭到周围人的打压和排挤，也会伤害到别人，种下仇恨的种子，冤冤相报没完没了。因此，一个人想做成事，必然要符合大环境，也得到周围人的支持。

    - 其实儒家在生存智慧上是非常权谋的，比如说，天下有道则现，无道则隐，其实就是坐等天上掉馅饼，别人辛苦搭建了平台，他跑出来，在别人辛苦搭建平台时，看不到他的人影，而人家搭建好平台之后，进入别人的平台实现自己的理想抱负。因为他们明白，能够搭建平台的是凤毛麟角的，而绝大多数人都是普通人，只能依靠依附来实现资源转化。

    - 放弃控制权来建立和维持权力，表面上看起来是违背本能，但是这样做并不会让领导者真的失去权力，而是让组织更多的分享信息和建立信任。有朋友给我留言说看不懂领导学书上这句话什么意思，其实很简单，面对韩信提出齐王的要求的时候，刘邦就很愤怒，这就是本能，但是最终给了他齐王的位置，这就是反本能。刘邦只有放弃对韩信的控制，才能换取更多的胜利，得到更多的权力。

    - 领导用人哲学与过去有所不同。关系很重要，但，只是必要条件，并非充分条件，你还要有价值，如果加持你的稀缺性和不可替代作用，那就像虎添翼。但是，底层逻辑是利益，你对他没有利益，他只利用你不会重用你，当他有利益最大化的人，就会抛弃你。

    '
  merge: 1
- raw:
  - '[PAGE 202]


    ⚠ 有时候盟友关系比上下级关系更持久，有时候合作的效率比命令和控制的效率更高，所以现在领导学的研究方向，都在不断探究如何转变上下级关系为合作关系。


    △ 不要同情弱者和失败者，不要跟混在底层的人交朋友，牢记：可怜之人必有可恨之处！某明星感言：混在底层时，周围都是坏人；当你成功了，周围都是“好人”。如果你就是底层和失败者，不要破罐子破摔，跟他们混在一起喝酒浇愁，躲在角落里舔好伤口，卷土重来。


    ⚠ 只有获得权力，才能支配资源，而资源决定你的生存质量，这就是生活的残酷之处。很多人一辈子没摸清楚社会的底层规律，都是建立在权力基础之上的。


    ⚠ 如果你没有贵人，没有关系，没有背景，那就锻炼自己的能力，先做到你可以取代任何人，再做到任何人都替代不了你，你的位子和利益就稳了。因为再坏的上司，也不得不34用一批出业绩的人。


    ⚠ 好为人师是一种炫耀，潜意识告诉别人你比他强，这种姿态只要一出来别人的反感就会生出来。


    ⚠ 想干成一件事，必须树立明确的目标，而这个目标不应该只是一个模糊不清的概念。想把目标明确化，就必须列出所需的时间，所需要的资源，以及自身所应达到的条件，然后分列成具体的实施步骤，否则自己的目标就是妄想。


    ⚠ 不要试图讨好所有人，不要害怕得罪所有人。为所有人做好事，得不到感恩；得罪所有人，其实谁也不得罪。要学会情绪管理，但也要适当的时机发适当的脾气。目的是宣示你的底线，越过底线，我必犯人！越是讨好别人，越是暴露软弱，越委屈自己，别人越不把你当一回事。


    ⚠ 无谋则事不成。谋者，算也。算别人，算自己，算利害，算得失。没有计算，就不知道自己的优势和劣势，就不知道对手有无可乘之机，更不'
  - '[PAGE 203]


    知如何一步步走向成功。成就大事者，必须善于谋算，权谋就是计算的基本功。


    △人越穷，越自尊；人越卑微，越是玻璃心；人越富，越谦逊；要想搏出位，越要不要脸。脸皮薄、玻璃心、自尊心强，都是成功路上的绊脚石。能做到不要脸，你就踏上了成功之路。


    △摘桃与甩锅：一开始和同事，共同从事某项工作，当发现这项工作会遇到重大困难，甚至有一定风险，为了保全自己，便要找借口临时退出合作，站在一旁观望，倘若这个同事战胜了困难，便伸手摘桃子，声称自己也参与了这项工作，倘若他遭了殃，整个形势不妙，便后退躲避，马上证明此事与自己无关。


    △职场上，发现自己在同事之间有矛盾，不调解，不劝说，听之任之，任其发展，甚至暗中做手脚，火上浇油，激化矛盾，当矛盾双方都得元气大伤，威信扫地，这才以公正的面目出现，收拾残局，趁机扩大自己的势力范围。


    △少说话，你就显得神秘；说话慢一点，你就显得有威严；不说话，你就让人敬畏。咋咋呼呼的人，基本都混不起来。你看，一场饭局，越牛的人越低调，张扬的人都是嘴炮。会叫的狗不咬人，咬人的狗不乱叫。职场上，也是如此。


    △怎么完成自己的原始积累？对外无法掠夺，你就得对内压制，全程节约，从牙缝里抠。无论对国家还是对个人，都是如此。


    △权谋的核心就是分析好自己的起点判断准当下的局势，利用好自己的资源，发挥好自己的优势。


    △你不想站起来，谁也扶不起你。再说，除了至亲，没人真心想扶你起来。多少人盼着你跌倒，笑话你沉沦，防止你爬起来呢，你颓废了，就减少一个竞争对手。尤其是同事，笑你无，恨你有，见不得人好。'
  - '[PAGE 204]


    △选择大于努力，思维决定层次，是任何时代任何环境下的重要规则。


    △凡成大事的人，都懂得“以静制动”，往往不是“咄咄逼人”。因此，学会躲在暗处，是一种人生的安静，是以不变应万变，智慧无穷。


    △要么真佛系，要么真奋斗，其实，佛系是有条件的，你得有资本佛系。没有钱，你佛系个毛线。对父母不孝，对妻儿不负责任，佛系的结局就是滚在底层。底层社会不值得留恋，物质上的匮乏，面临人性的拷问。人性经不起考验，展开给你的都是痛苦。


    △人是社会性动物，怎么可能不拉帮结派呢？在利益斗争的时候，你一个人，对手一帮人，输赢还用得着说吗？人人都拉帮结派，但人人都痛恨拉帮结派，所以聪明人一方面暗中拉帮结派扩大势力，一方面指责对方拉帮结派制造舆论压力。


    △著名的马克思主义者，詹姆斯·伯纳姆在《管理革命》中写到：受压迫的农民并不代替压迫他的封建地主，他们双方都被一个完全不同的阶级，资产阶级所取代，同样的无产阶级也不接替资产阶级，他们双方会被管理阶级所替代，官僚经理阶级将成为新的统治阶级。


    △跟领导玩，没有情绪，只有理性，还有忍辱负重，守口如瓶。被领导骂了要习惯性的说，谢谢领导栽培，我知道这是领导对我好。任何时候都要学会，是是是，而不是说，对对对。


    △利益的最大获得者，往往是那些不守规矩和利用规矩的人，等他们利益到手之后，又会去维护规矩以及制定新的规矩，以便保护到手的利益。


    △社交的本质是价值交换，想让高手带你玩，先问问自己有什么价值可以拿出来。


    △作为一个成年人，要有控制自己情绪的能力，你可以表达愤怒，但不能愤怒的表达。


    △有人的地方就有江湖，有江湖就有帮派，有帮派就有帮主，谁能取得'
  - '[PAGE 205]


    帮主之位，谁就能呼风唤雨，一统江湖。所以人与人之间的本质就是权力的争夺。


    △分析案例或是新闻时，不要戴着有色眼镜预设立场，不要带情绪，一定要准确的分析人家的利益所在，人家的思路所在，我们的差距所在。


    △很多人说只有自己亲身经历了，才能真正的领会，但你的生命有限，你怎么能够体会世间的种种，看别人掉坑，避免自己掉坑，否则你就成了别人思考的源泉。所以我们不断的阅读通鉴，阅读历史上的各种故事，才能够让我们有限的人生丰富起来，避免各种坑。


    △如果我们对某人的行为很不满，但又缺乏确切的证据，为了终止他这种行为，指桑骂槐就是最恰当不过的计谋，不仅给了对方面子，还能含蓄地彰显自身的实力。如果找不到相应的桑树，我们就需要找人过来演双簧戏。主要要点就是要含沙射影，产生震慑，而不是像泼妇骂街那样含血喷人。


    △权力的存在，使群体生活趋于统一，每个个体都有自我意识，在群体中就会出现无数的矛盾，所以所有的矛盾都归结为一点，个体从群体生活的冲突，为了维护群体的利益，必然要-free共有一种权威来裁定矛盾，来控制局势，于是产生了权力，代表了群体生活的法则和利益，代表了野性的裁判。所以在任何一个群体里，在权力面前必须放弃自我。


    △先不管太远，集中精力解决眼前：当鞭长莫及时，不如与远方的敌人联盟攻击近处的敌人，这是利用矛盾分化矛盾的策略，把形势转化为有利于我方的状态，这就是远交近攻的内涵。


    △名为帮助，实为占有：只要以帮助的名义引诱他，你就可以堂而皇之的占有。帮助总是被人所接受，因为对他人有利，把攫取的手腕藏进帮助中去，对方将防不胜防。


    △小富靠努力，暴富靠周期。很多时候，体力劳动决定了你的财富下限，'
  - '[PAGE 206]


    认知观念决定了你的财富上限。遗憾的是，埋头苦干的人多，认真思考的人少。


    △职场上所谓有城府的人并不是那些完全不说话的人，也不是那些不苟言笑的人：有城府的人反而是那些看上去人畜无害，聊天也能说两句，却永远都无法与之交心的那种感觉。而且你会觉得这个人情绪特别稳定，有泰山压于顶而面不改色心不跳的感觉，一起共事这么长时间从来没见人家发过脾气，这就是道行。


    △适当的阻力使一个事物成长略微缓慢，但也能够使之成长得更加强壮健康，更受得住打击，相反如果一个事物在发展过程中阻力太小，甚至根本没有遇到阻力，虽然在短时间之内成长会显得快一些，但长期来看就会变得更加脆弱，容易夭折。


    △深藏不露是君王用于控制臣下的一种手段，聪明的当权者一般不轻易表露自己的观点，见解和喜怒哀乐，而是把自己的思想感情隐藏起来，以免让别人看到自己底细和实力，这也是在臣子面前树立权威的重要方法，基本上，帝王的深藏不露，或是由于情况不明不便表态，或是由于时机未到不可鲁莽，或者由于形势不利无力反击，因此帝王的深藏不露便是为了弄明情况，等待时机，积蓄力量，而不是长期的隐忍，无所作为。


    △勤奋努力甚至包括能力和聪明，都只是成功的前置条件，只有尊重客观规律，懂得顺势而为，才是成功的底层逻辑。


    △我们从小就被灌输各种思维、认知和价值观，可能这些道理是对的，但不一定就意味着是适合你的！即便是正确的灌输，也不一定能给你带来价值，很有可能是希望你能成为服务于他人的人。因此，有的人循规蹈矩，不懂得独立思考，如同提线木偶一般，最终沦为社会中的弱势群体。


    △交友要升维；尽可能结识比自己厉害的人；做事情，尽可能争取形成降维打击。因为，利益最大化一直是降维打击的产物。'
  - '[PAGE 207]


    △看到问题，提出问题。光是解决问题的顺手，往往也只是一个十分优秀的下属，但如果你还有敏锐的眼光，能及时看到问题，提出问题，那你就有资格成为十分优秀的领导者了。


    △话越多，反而越不过脑子，言多必有失，也更容易暴露自身底牌。对方如果比你强势，就知道该用什么态度和手段对付你。如果你愿意成为倾听者，甘愿充当配角，那么你就会有更多的时间去思考、去深挖、去揣摩、去更好地应对别人的意图和底牌，从而更好地掌控博弈的主动权。


    △为什么我们强调，以技术立身，以权谋发展？因为，提拔晋升主要在于两个方面：一方面，你确实要有拿得出手的成绩，这样领导才方便给你说话；另一方面，你要和领导的关系很好，领导才会在一群人中偏袒地把你提上去。需要注意的是，在对上、对中、对下三个维度的关系中，一定要把对上也就是与领导的关系摆在首位，作为重点。


    △控制人最好的办法，就是让他没有退路，只能前进一步步，迈向深渊，迈进一步，就断他一步后路。好的陷阱是无形的设计在细微的地方，让对方看不出这是个圈套，细微处是减少对方的防备心理。


    △和领导交往有三个原则：第一服从，领导说什么就做什么。第二尊重，领导的权威需要维护。第三理解，领导的难处要体谅。做好这三点，就能和领导建立鱼水关系。


    △中国人处事的4个特点：第一，中国人重视人情很多事情，因为人情变得难断是非，因此常碰见因人情而扭曲的事实。第二，中国人表里不一的倾向，嘴上说的和心里想的往往不一样，比如在你面前赞美你如何好，在背后大骂你如何坏。第三，中国人beh讨厌当面得罪人，明明恨死对方，还要会打哈哈，互相吹捧一番，在中国社会，中明枪少，暗箭多。第四，中国人喜欢说话拐弯抹角，为了不当面得罪人，往往在言谈中另藏深意，需要深入领会，否则就会误解其意。'
  - '[PAGE 208]


    △为什么必须学习权谋，因为生活在复杂环境中，你若不想被人暗算，若想在前进中摆脱小人一直往前，就要洞悉谄言、诡计的各种伎俩手段，采取各种针对性的防守措施，这才能立于不败之地。否则出师未捷身先死，还没开始都被人打倒了。


    △在经济利益高于一切的潮流下，竞争观念直接击毁了所有的传统价值观，让谦虚礼让之风，退出了历史舞台，它标志着团结有爱价值体系的崩溃，标志着以忠孝节义为中心的思想体系的失落，我们必须适应残酷的竞争，必须防备在竞争中某些人的不择手段。又因为社会发展文明程度的提高，人们的内心具有复杂性和隐蔽性，我们这个时候就要更加把所有人当成坏人来防备，或者先发制人，才能让自己免遭伤害。


    △要想在社会上立足，闯出一番天地，过上经济富足的生活，甚至实现财务自由，我们必须远离这些竞争激烈的非最优选项，必须按照经济学原理所说的那样去做，必须清醒认识到：“稀缺产生价值”。也就是说，我们必须另辟蹊径，一边放弃内卷化程度高的领域，一边找到一个赛道开阔的细分领域深耕细作，如此我们才能充分发挥自己的比较优势，才有可能实现闷声发大财的希望。


    △这就像在酒吧泡妞，美国这个玩家目的是刺激欧洲这个美女来一次，只是利用乌克兰做了一下媒妁情结，但是乌克兰这个女人呢，被调戏后当真了，回家就想离婚，谁知道离了婚之后回来找人家这个酒吧玩家，人家根本不搭理他。


    △中国人是个特别没有安全感的族群，做工作就开始为养老做打算。对晚年的恐惧，自然灾害的恐惧，是政府无信的恐惧甚至都印在基因里面。


    △能够成为领导心腹的人，既是情商高的可亲之人，也是智商高的可用之人。


    △当了领导，手里有了权、有了资源，也在一定程度上有了影响别人命'
  - '[PAGE 209]


    运的立场，那随便说话，就有可能带来不想要的结果。因为总有一些人在琢磨你说的话背后的意思，总有一些人想通过为你办事来获得你的支持，总有一些人在密切关注你的行动。当然，也总有一些人在等着抓你的漏洞、找你的错处，然后加工、翻炒，再用这个把你搞得灰头土脸。所以，“谨言”，是一个走上领导岗位的人必须要牢记的。


    △业务是一个人的根本，无论是领导岗位还是普通岗位。但要干好领导岗位，只有业务好是不行的。需要圆滑的处事手腕，需要四处开疆拓土的魄力，需要面对问题时的勇敢气概，等等。如果只埋头于业务，而疏于管理自己的这一亩三分地，内弄不好员工的平衡与士气，外抵不住有心人的各式攻击，那这个领导的位置便岌岌可危。


    △封闭的环境中，凡事如果做太绝，往往到最后你会发现，原来堵死的是自己的路。在中国，需要的是利益共存，如果你想独占一切，不留余地给别人，没有礼尚往来的改变，那么你的一切就会被清空？


    △越有钱的人，越懂得低调，因为他骨子里的充实无需刻意去炫耀，也无需外界虚假浮夸的赞美，往往用最普通的状态示人，不给身边人压迫感。这就是我们传统的和光同尘或者是韬晦术。


