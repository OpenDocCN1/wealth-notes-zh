    △古语云：与覆车同轨者未尝安。说的`意思就是说，你走前车翻车之路，必然得到同样的结果。很多人不懂权谋的人，被社会深深的打击，但是呢，其他人依然不思悔改，不吸取教训，对权谋嗤之以鼻，被社会毒打，也是早晚的事。


    △两性之间，关于有趣的终极形态就是“理解”。


    我理解你这么做的动机是什么，所以我不觉得奇怪，你什么梗我都能接，你的搞怪，“小孩子气”我都懂，我都配合，所以你怎么样都不会冷场，我们关系也更好了。而且，有趣之所以能成为一种“通吃魅力”，关键就在于它其中包含着：“共情”、理解他人和乐观生活的部分。


    △男性的“洞穴时间”，是说，男人遇到压力，会把自己关起来解决问题，一定程度上回避沟通。回避沟通不是真的不想理你，而是他判断，你'
