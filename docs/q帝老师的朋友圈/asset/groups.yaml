    △很多小姑娘都不明白，男人都不喜欢傻白甜，他们只是喜欢年轻、漂亮、好骗的，因为傻是“好骗”的副作用，所以，男人exp可以接受。但如果真的傻到影响他们的时候，他们就会重新考虑和你的关系了。


    △强大的学习能力和对事物敏锐的洞察力，是一个人能力的“护城河”。很多人抱怨自己赚不了钱，其实我们首先应该反省自己是否有价值，没价值的原因是否在于自己没有强大的学习能力，经常抱怨的人肯定很少会看书，其实只要我们经常去学习，多看书，这样，我们不仅能提高对事物敏锐的观察力，更能提高自己的能力和价值，有了这两样，外部环境无论如何变化，我们永远不会被淘汰，因为这就是我们的“护城河”！


