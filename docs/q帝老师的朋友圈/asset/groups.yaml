    △【权谋变术】变化是打破旧有的结构和秩序产生新的形态或本质。权谋变术是通过改变，来追求更大的利益和避免更大的损失，在破与立的过程中操作成本更高，而且具有一定的风险性，特别是在中国传统社会，变化往往与打破常规，不守祖宗之法，联系在一起，不允许轻易改变。所以权谋家，如果想通过变化，打破旧有格局的时候，需要以稳和慎作为变化的两个基本原则。


    △任何一个组织，每天睁开眼就一件事，那就是如何收割，如何更高效率的收割，更低成本的收割。更大范围的收割，当一个收割工具不行，立马就会转化为另外一个收割工具。其实国家也是如此，你品，你细品。


    △曾国藩自己总结的成功秘诀：打仗不慌不忙，先求稳当，次求变化；办事无声无息，既要老道，又要精明。


    △冯梦龙说过，温和但不顺从，叫做委蛇；隐藏而不显露叫做缪数；心有诡计，但不冒失叫权奇。不会温和，干事总会遇到障碍，不可能顺当。不会隐藏，便会暴露无遗，四面受敌，什么事也干不成。不用诡计，又难免碰上厄运，所以说，精通权谋让人生更加畅通。


    △历史上有些聪明人谋局，都有无风起浪的本领，也就是说，要适当的无中生有，适当的编造谎言，引人入局，你不必担心，对方日后会识破你，因为那时他已经失败了，做局如同经营，要以极小的成本换取尽可能大的利益，甚至空手套白狼，玩的就是心跳。


    △【靠山】在现实生活中，有了靠山就意味着有了向上爬的机会，不要怕别人说你拍马屁，拉关系。最关键的是要有背景，朝里无人是升不上去的，当然这番话是说给有想法的人，至于志向不在这方面的人，那就悉听尊便，如果能得到上面人的赏识，经由靠山的提携，一路升迁无疑是最便捷的途径。


    △【设局的秘密】想要把别人拉入你的局，一定要抚摸它，使他感到舒


    服，一定... 在错综复杂的人际关系中把精明挂在脸上，不一定是好事，做人拙朴一点，傻一点会让人感到踏实，反倒受人欢迎，当然这种傻不是真傻，而是一种低姿态，是一种掩盖。


    ▲【权谋没有高下之分，只有，有效没效】现在这种世界环境复杂多变，要想好好的生存下去，就要学会做一个变色龙，处事灵活，善于变通，对于权谋家而言非常重要。非常现实的一点就是计谋要随着对象的变化而变化，不同的对象有不同的特点，而针对他的计谋，并没有高明低下之分，关键看是否合适，合适了就是最灵的，不合适了，计谋就是失效的。


    ▲【政商关系】胡雪岩对政府关系的理解很是经典：对于清政府而言，商人稍有盈利，他就想站出来分沾你的好处，恨不得将你一口吞下去，一旦好处得不到，他便处处给商人使绊，使你不得安全，直到你破产。


    ▲尽量避免争斗，因为一旦你陷入争斗之中，就会丧失所有先机，你就会被斗争者的利益所牵扯，对于他们来说，你就是他们的牺牲品，你就会陷入各种被动。


    ▲和所有人都要保持一定的距离。不要与任何人过于亲近，否则会丧失自我，不要与地位高的人过于亲近，否则会受到别人的鄙视与排斥，不要与地位低的人亲近，否则将有损尊严，更不要与不能通情达理的过于亲近，否则你所有的善意都会成为他指责你的起因。


    ▲【流言】流言是离间的高级形式，目的是麻痹和欺骗，从而削弱对方的实力，影响对方的判断，直到控制和摆布对方，最后摧毁和灭亡对方。流言有两种表现方式，一种是制造假象，欺骗对方，而二是诱导和逢迎，最后达到对对方的利用和控制，从散布留言到控制对方，这两个环节紧紧相扣，形成完美的圈套。


    △流言是一种心理上的博弈，是对对方心理弱点的利用，这是一种深层次的心理较量，在众多危言耸听，具备相当迷惑性的流言中，主要的方式有：以假象蒙蔽对方、以谎言迷惑对方、以大话恐吓对方、以威胁要挟对方、以利益驱使对方。流言，既能形成欺骗和迷惑，也能蒙蔽和混淆真相，某些时候还可以麻痹和纵容对方，得到错误情报的敌人心情放松，疏忽大意，他们的漏洞、空档、裂缝、间隙，可以利用的机会、弱点、劣势、不足，也就一一暴露出来，这就是流言存在的最终目的。


    △权力变现，资源转化，韭菜收割，这就是中国创业的本质。


    △失败太多的人，接二连三受到失败的打击，自信心一点一点的被击溃，又长期处于溃倒之中，会慢慢的沉沦萧条下去，才能一点点干枯，终无所成，人的才能和热情就像火，它需要不断地增加干柴，否则就会渐渐熄灭，历史上诸多怀才不遇的人大多属于这种情况。


    △大多数的管理书籍都劝领导，不要感情用事，而忽视了真正的人才。但是社会现实是，大家都用自己的好恶，来决定人才的好坏。领导对于那些有好感的便委以重任，而对于那些与领导保持距离，印象不深的人便会疏远。既然社会如此，我们作为下级，干嘛要对抗这种规律，去搏一个小概率的事件，不能去迎合领导的喜好呢？


    △人才与普通人的区别并不在于没有缺点，而在于缺点与优点相比，短处与长处相比，仅处于次要的，因此判断一个人是不是人才，就要从大局总体着眼，只要大局信得过。小节，则不必斤斤计较。否则就会陷入责备求全的状态，反而让人谨小慎微，不思进取，这样工作缺乏活力，也就导致整体的失败。这就是“水至清则无鱼，人至察则无徒“的道理。


    △跟人交谈的时候，不要以讨论不同见解作为开始，而是要以强调而且不断强调，双方所共识的事情，作为开始。不断强调，你们都是为了相同的目标而努力，唯一的差异只是，在于方法的不同而不是目的不同。要尽可能的使对方在开始的时候说“是的，是的“尽量避免让他说不。因为一个否定的反应是最不容易突破的障碍，当一个人说“不“时，他所有的人格尊严都要求他坚持到底，也许事后觉得自己说“不“时说错了，然而他必须考虑到自己的尊严，既然说出了口，就得坚持下去，因此一开始就是对方采取肯定的态度，这是最重要的事情。


    △任何时候不要抢了领导的风头，不管你是有意还是无意。尤其是女领导，作为下属的更应该注意：她很讲究服饰仪表，我们也要穿得整洁得当，但不要抢了她的风头，如果你的上司不太注重服饰，那你穿得过去就行了，还有如果你穿了时尚的衣服，最好不要在她面前炫耀，不然上司就容不下你，会想尽办法给你使绊子。


    △许开祯在《跑动》这本小说里面，有一段话非常的经典：跑官是一门综合功夫，比送高雅，比买合法，也富有人情，跑离不开送，但只会送，送不出前途，官场上玩的不只是钱，还有体面，还有高层之间的相互照应，还有情分。买只能买一次两次，一辈子不可能永远做这个交易。天下的官不都是拿来卖的，那是愚人玩的游戏，真正的智者，是把权力当成种子去撒去播，等到收获时满世界都冲他笑了。


    △送礼，不是直接给领导塞钱塞东西。犹如谈恋爱。钱是要花，但不是直接塞钱，还要花心思。如果直接算钱的话，让人的感觉就是恋爱都不谈，直接就想上床，本来是一种感情关系投资，变成了性交易。你觉得女孩子能同意吗？女孩子都不会同意的事，你觉得领导的智商还不如女孩子吗？


    △借力的作用不可小视，尤其对于为官者而言，基本上没有单纯的个人成功，更多的是要依仗其身后所支持他的力量。一个人的成就大部分都承蒙他人之赐，他人把无形的资源、能量、智慧投过来，变成成功的推动力。


    △领导发脾气的时候千万不要反对，解释也不行，纵使有天大的委屈也得先忍着，还要表现出一种可怜巴巴的样子，只有领导痛痛快快的把肚子里的火发出来，你才有不被继续打击的可能。


    △许开祯在《跑动》这本小说里面，有一段话对于穿衣的解释特别经典：上班穿着朴素一点没关系，那是工作需要，可是下班就不一样，特别是到朋友或领导家走动穿的太过随便，会让人觉得失礼，再者搞不懂的人还以为你精神不振，出了什么事儿呢？


    △任何组织其实睁开眼就要想着拿什么来收割你，这个收割工具，用完了，我得想下一个收割工具，这才是这个社会的真相和本质。


    △让不顺从自己的人，走得远一点，否则会成为你的障碍，记住千万别想调教这种人。尤其是在职场这种权力体制下，官官相护，党同伐异，一定要把妨碍自己的人视为异己，必须铲除，而不是花心思去纠正他。


    △要学会管理好自己的情绪，如果你是对的，没有必要生气，如果你是错的，没有资格生气。


    △作为一个下属，领导最忌讳，平时不沟通，不请示，不联络，事情结束了把结果，一报了事，其实上级处在那个位置上，他一需要了解事情的进展，施加自己的影响，二需要下属的忠诚，这两点决定了，下属不但要把事情做好，还要把沟通做好，身为下属不光要给结果，还要给感觉。只给结果，不给感觉，过程中缺少沟通和汇报，会让领导产生置身事外、无法参与和不被认可的感觉。下手功劳越大，领导的这种感觉就越强，彼此之间的隔阂也就逐渐产生了。


    △面子是一个人的尊严，很多人利益可以失去，但面子不能失去，它代表一个人的地位，所以你如果当面羞辱某人，某人因为觉得被人看笑话很没面子，他是有可能为此跟你拼命的。也许你会说面子问题，太虚伪了，是有些虚伪，但身处社会中忽略这个问题你就会吃苦头，如果你是个人，对面子冷漠的人，那么你必定是个不受欢迎的人，如果你是个人，只顾自己面子的人，却不顾别人面子的人，那么你必定会吃暗亏。这个社会上的人很奇妙，可以吃闷亏，可以吃明亏，但是就是不能吃没有面子的亏，所以若

    '
