    人生才真的可能逆袭。


    △一定要远离垃圾人，那些诋毁你，说你坏话的人，都不如你。真正比你强的，哪怕你的存在影响了他的利益，他都不会做诋毁你这样 low 的事儿，而且但凡有正事的人，每天也不会如此无聊。遇见这样的人，我们直接屏蔽掉就行了，不需要回复，否则自己就会降低到和他一样的层次，白白消耗自己的生命和精力。


    △许多人创业失败，铩羽而归，最终沦为笑柄，主要原因不仅仅是个人能力的问题，专业问题。更主要的是他对于一个行业的竞争格局、行业结构以及参与者的背景，一无所知。


    △在漫长的封建历史进程中，皇帝面临的唯一问题就是要阻止异己力量的发展，这些力量包括来自商人、军队、宗教团体、学术团体，还要防止上层出现意识形态分裂的危险。


    △如果一个人与你相处，让你感觉无比愉快，为人处事总能同你所好，言行举止都能恰到好处的，让你感觉到满意，兴趣爱好也与你极度契合，精神层面时常能引发共鸣，让你有一种找到知己或者灵魂伴侣的感觉，十有八九是因为对方高你一个段位，这是一种降维打击的轻车熟路。和你同一层次的其他人，和这种高纬度的人交往也都会是这种感觉。


    △天道就是规律，你打败不了规律，你只能利用规律。就像我们面对权力，你只能利用领导的权力心思，权力规律为己所用，如果你利用不了，你只能避免更大程度的伤害，而不是想着去怎么打败他。


    △所有的意识形态之争，其实就是，对于是非对错的定义权和判断权。'
  - '[PAGE 136]


    有了对是非对错的定义权和裁判权，自然能够，站在道德，社会舆论的制高点。


    △真正懂得下棋的人，看到的不是棋子摆在棋盘上所呈现的态势，而是搏杀双方，你来我往的攻防策略，一步步走到现在的轨迹。资治通鉴正是这种权谋搏杀形成的轨迹，如果你只看最后的输赢，那么历史书毫无味道，如果你看得出这些斗争的轨迹，那么趣味横生。


