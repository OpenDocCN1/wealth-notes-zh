  md: '

    ⚠管人的一大任务，就是在于消除自己的威胁面，这是历朝历代管人者必须遵循的一项基本法则。


    ⚠社会就是一个大丛林，一些人的荣华富贵通常，有另外一些人的血与泪铺设而成的。尤其是内卷化严重，资源稀缺的地方。


    ⚠你会优先完成和蔼民主的领导交给的工作，还是优先完成严肃的领导交给的任务呢？虽然这几乎所有人都比较喜欢那种温和的命令方式，但是几乎所有人都会优先完成严肃而紧迫的工作任务，这就是人性的弱点。


    ⚠有些员工出现了自以为是，自作主张的情况，尽管他完成了任务，但该项任务并非你期望的，你无需表现出很高兴，也绝对不要称赞他，若无其事的应答一句，表示你知道他完成了任务就足够了。


    ⚠管人其实就是与危机较量的学问。在管人的过程中，期望一帆风顺，恐怕是天方夜谭，实际上总会出现各种各样的危机，去干扰你的管人目的。一个人的 一生中的危机很多，处理不当就会形成大祸，权谋家不管在什么时候，都在打量自己周围，及时寻找身边危机，在其未露头时及时加以遏制，以便不给自己将来找麻烦。


    ⚠假如你认为一个员工的行为应当受到某种处罚，但又拿不准什么样的处罚措施最恰当，那么可以列出三种可能处罚方案，让员工自己选择。这样做 的目的和好处有三个，一来可以增加员工的参与性，而不是等待坏消息的观众。二来可以了解员工更多的想法。三是可以避免上下级之间的激烈对抗情绪。


    ⚠人的注意力有限，面对信息泛滥，需要判断什么信息更重要，什么信息不该关注，什么信息应该抓住。我们手里的资源稀缺，面对各种选择，必须适当配置，决定哪些事必须做，哪些事绝不做，哪些事需要重点做，哪些事应该逐渐淡出…


    ⚠金钱的攫取能力，金钱的驾驭能力，以及在金钱面前所遭遇的人性，都是普通人，难以承担的，你这背后都是反人性的操作。


    △太注重形式就会丧失本质，太注重知识就会迷失方向，太克制欲望就会丧失动力。


    △领导对权力有五怕，一怕螳螂捕蝉，黄雀在后。二怕鹬蚌相争，渔翁得利。三怕部下暗中勾结加害自己。四怕同盟者背后揪刀子。五怕后台忽然倒塌。权力使领导感到焦灼、担忧、怀疑、防范等，阴影时时刻刻伴随着他，使他不能自安。


    △只有骄傲，对手才会看不起别人，才会把自己弱点暴露出来而不加防备，我们才能够一刀捅到致命处。


    △有了权谋思维的结构，你思想中的碎片才会有归宿，生活与人生诸多问题才有了查漏补缺的方向。不然你脑子里所积累的各种东西，都是互相对立和矛盾冲突的，并不会在现实中有指导作用。


    △不在最高权力心思的指挥之下的才能，都是无大用的。无法解决领导的核心问题，就不可能有超常的地位提升。


    △上级的需要是多方面的，其中最主要的有两条，一是领导工作的需要，二是维护和使用权力的需要，下级向上级所提出的要求，一旦危及到上级，这两种需求必然引起上级的极大反感和反对。与上级交涉利益问题，只知维护自己的需要，从不顾忌上级的需要，这是失败的一个重要原因。


    △老天赋予运气和赋予智商，在本质上没有任何区别；不要羡慕嫉妒恨人家那些有运气的人。


    △权谋是围绕人性和权力展开的，谁研究的好，谁搞资源的能力就强，谁混社会的本领就大。


    △因为权力的过度集中，必然导致资源的过度集中，而资源的过度集中必然导致依附文化。


    △权谋探索的是社会最底层的逻辑内核，可以穿透迷雾，看到背后的本质，只有我们清晰看到前面的路，我们才有力量，才有自信，才有方向。△啥叫上帝视角？你必须顾及到多种维度，占到足够高度，看得足够深度，这才是上帝视角。△其实我们最重要的是，在每一次做出决策的时候该怎么选的问题，就是你心里什么价值最大，不断的积累价值最大化。其实我们学习权谋最初期认为是手段的问题，技巧的问题，其实人生中哪有那么多技巧，又需要什么高深的？不需要的。△这个社会
    90%的知识是畸形欲望的，读完之后让你觉得没有顾虑的想法，一谈公利就觉得自己太俗，他没境界他没格局，不知不觉被人家长成大了毒草而不自知。△很多女人不理解，问为什么男人都喜欢钓鱼呢？钓鱼是男性狩猎那种获得感的远古快乐记忆，逛街是女性采摘的获得感的远古记忆，你们逛街有多快乐，男人钓鱼也有多快乐。。采摘也是那种边走边看，然后把合适的物品放到篮子里。。△富在术数，不在劳身。利在势居，不在力耕。——《盐铁论·通有》△高等智力的人，主要通过阅读文字来获取信息。中等智力的人，通过图片文字、视频来获取信息。低等智力的人，通常很难读懂文字，只能通过短视频来获取信息。能够阅读大段的文字，是高等智力活动的表现，不仅需要一定的时间和心性，还要有开阔的想象力和思考能力。这是智力不发达的人所欠缺的能力。△会送礼、会拉关系、会来事儿是权谋家的基本功，因为他从小受到的教育，是一种强势文化。在他的认知里，绝不会存在羊战胜狼的愚蠢故事，他非常清楚社会是怎样运行的。△富人的孩子从小就被传授了社会的规则，知道社会是充满竞争的，要想获取资源，就必须要去争去抢去拼。在学校就要讨好老师，出社会就要学会讨好领导，只有这样，有资源分配权的人才会把资源倾斜给我们。


    △权谋家玩手段，并不是堵别人的路；和别人搞对抗，而是封死他多余的路，只留一条，让他自己通往我们所期望的方向。


    △刚大学毕业，女朋友都催着男朋友创业，成了的话，自己陪他过了最痛苦的日子，不成的话可以立马换船找一个更有钱的；但是女人结了婚之后都基本上不让男人创业，都想稳定住，创业成功了，自己被抛弃，创业不成功，自己受苦。


    △无论上级给了你多大的办事权力，都要学会汇报工作：派下属了解问题，回来汇报情况，由领导决定办法。下属提出所有解决问题的可行方案，由领导来选择。让下属提出一套完整的行动计划，送领导核批。要让上级知道下级要做什么，在上级同意后，下级才能行动。下属采取行动，首先要让上级知道，在做什么，同时向上级及时汇报，事情的结果，如果不成功有问题及时与上级联系。


    △真正想挣到钱的，都是非充分博弈，要么玩渠道，要么玩信息，要么玩关系。但凡市场上经过充分博弈，出现的价格没有高价低价。


    △赚钱要么玩趋势，要么资源转化。趋势需要抓热点，资源转化需要常年的积累。又能玩趋势，又能资源转化的是重投资高科技，这个普通人不用想。


    △办事最讲究，轻重缓急，明确先后次序。权谋家的经验是：最难的事先办，大事自己办，小事委托办，新事积极办，一般事照常办。


    △当领导者将某个要害部门或者某一重要领域或者某一威摄力量交给某个下属管辖时，他总是希望在这个下属所管辖的范围内，能够出现若干既相融，又排他，既统一又独立，既协调合作，又互存戒心的势力，并且公开或者隐蔽地采取必要的手段，允许和鼓励这些势力各自保持自己的个性特色，从而使该下属很难在他所辖的范围内，组成一支统一强大的，绝对听命于他的力量，因为唯有如此领导者，才觉得最为安全。


