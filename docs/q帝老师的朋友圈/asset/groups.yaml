    △恩威并施是治政之道。古人说，恩治者衰、威治者亡，恩威并治者兴。领导者要正确把握好恩与威的关系，恩和威，是辩证的统一，恩是威的基础，威是恩的手段。用现代术语来说，恩属德治的范畴，而威则属法治的范畴；两者不可偏废。有恩无威，人不畏惧，权力的行使也就大打折扣；有威无恩，人人离心，失去凝聚力，权力将形同虚设。恩和威就像是车的两个轮子、鸟的两个翅膀都是缺一不可的。


    △身处官场，其实就是身处一堆矛盾之中，有些矛盾，你根本解不开，有些矛盾，你根本不需要去解。但你必须学会一种本事，那就是抓住主要矛盾，只要这个主要矛盾抓住并且解决了，其余的矛盾，或者迂刃而解，或者不值一解。


    △打牌者最害怕的事，肯定是人家出一个三，你却不得不拿一个大王去拦截。高手过招，一是要用最小的牌逼出对方手中的大牌，二是要将自己手中的牌用得最恰到好处，一张都不浪费。


    △高层讨论人事，并不像人们想象的那么神秘，说到底，只不过是权力平衡，也就是排排坐，分果果。


    △从某种意义上说，权力控制，只有两种手段，一是以雷霆手段动外科手术，将某些人的权力剥夺；一是在权力结构体，利用提拔、调动、正常退休等手段进行调整，完成新的权力分配，改变原有的权力结构，达到新的权力平衡。相对而言，后者更加的温和，适宜于社会的稳定，也更挑战控制者的政治智慧。前一种，稍有不慎，便可能酿成战争，可以说后患无穷。


    △权术被绝对地看成一个贬义词，等同于阴谋诡计。如果让我看，权术，其实是一很正当的权力驾驭术，是中性的。只有超越了游戏规则，越位了、犯规了，才叫阴谋诡计。而在游戏规则之内用一些计谋或者手段，那叫政治智慧。在游戏规则之内，那就叫政治智慧。一个政治家，恰恰应该有政'
