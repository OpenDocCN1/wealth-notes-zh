    △如果一个人，身受大恩之后，又和恩人反目的话。他要顾全自己的颜面，一定比不相干的陌生人更加恶毒，他要证实对方的罪过，才能解释自己的无情无义，摆脱掉道德枷锁。


    △在谈判桌上，是为了达成协议，融洽的关系是关键，但你不值得为了关系而牺牲交易。这样的话就本末倒置了，把手段当成了目的。


    △某种能力的起跑线或许是天赋获得的，但是能力的提高得到想要的结果，绝对是长期正确训练的积累。


    △只有中底层，才会用物质或是奢侈品来证明自己，而高层往往很朴素，采用的是前呼后拥的方法来证明自己，人对高层而言，才是最大的奢侈品。


    △利用“关系网”、“利益链”、“感情牌”，上托行政施压、中找熟人说情、下搞串供堵口，中国式干扰办案的手法基本上就是如此了。


    △遇盛世则笔著经典，遇乱局必力挽狂澜，这是历朝历代，权谋家的人生理想。


    △在其他条件大体相同的情况下，谁的政绩突出，谁的威望度、知名度高，谁就能在权力的阶梯上，不断的攀升，因此已经进入权力圈的人，想要获得更大的权力，必须创造突出业绩，在提高自己的威望和知名度方面下功夫。


    △权力的扩大可以分为两种，一种是外延性扩张，即通过提高职位而提高领导的权力，一种是内涵性扩张，即通过提高自己的影响力而提高自己的权威。


    △政治家要有足够的修养和风度，因为很多时候会出现这种情况：眼看到手的政治果实，只因一件事或某一个人的 一句话，失之交臂或不翼而飞，越是这样越要耐心冷静，继续努力。因为政治收获和自然收获相比，它具有很大的偶然性和随机性。


    △任何一个组织想崛起，要么对内收割，要么对外收割，要么对下收割。对内收割，就是压榨自己和自己的关系链。对外收割就是黑吃黑。剩下收割就是割韭菜，杀弱鸡。


    △看到一句很经典的话分享给大家：想实现财富自由归根结底就是一句话，要转变稀缺心态，跳出金钱本身来进行长远规划，把自己所有的财富转化成可以钱挣钱的资产。


    △做人做事不要混淆目标和欲望，目标是你真正想要实现的东西，而欲望则是你想要，但是会阻碍你实现目标的东西，如果把关注焦点都集中在个人的欲望上，那么在必要的环节没有积累，你的未来就难以发展。


    △职场上的问题很多，不是每一个都必须要解决。你改变不了人性，有些问题你也解决不了，不解决这个问题就是最大的解决方式。这不像考试，你必须把这道题做会，不是这样。


    △中国人处理任何事首先考虑两个人的关系，按照理性的原因，如果借钱的话，根本不可能给你，也不可能不让你打欠条，不可能不给你要抵押物，但是呢，在中国人的计算里面的人情比什么都重要，一句话，你开口。


    △长期做有价值的事情，选择一件事要看清楚事件后，在一年后，两年后，三年后甚至10年后，它的意思和价值，它能不能给你持续的加成，这是成功的根本秘诀。


    △很多人讨厌小人和小人保持很远的距离，其实呢，这是错误的，因为你这样做。小人会认为，你不把他们放在眼里，那么接下来，他会怀恨在心，从而找机会报复你。


    △下属打着领导的旗号说话办事，可能带来几种不好的结局，第一是别人为你办了事，但心里不痛快，对你，对领导都耿耿于怀；第二不买你的账，搞得双方都不痛快；第三既不答应也不否定，给你放一放，或者向你的领导当面问清情况，后再给你办事。这最后一种情况无异于在领导面前揭你的丑，会使你处于十分尴尬的境地，以上几种常见的情况在打领导旗号的时候，一定要注意。


    △学无常师，众家皆融。咱们权谋最通俗：怎么有用，怎么来！


    △当最高领导层内部主要掌权者之间存在着重大的政策分歧或者个人权利冲突，而这种分歧和冲突又无法通过预定规则或和平方式解决时，政变就变成了解决分歧和冲突的唯一手段。当然，许多政变并不涉及政策分歧，统治集团内部的个人权利争夺是政变的重要原因，中国历史上为争夺皇位多次政变都属于此类。


    △激将法一般有下面 4 种手法：第一吹胡子瞪眼睛，惹人发怒；第二用高帽儿赶鸭子上架；第三故意贬低挑起好胜之心；第四冷冷冰冰，佯装不信，诱导吐露真言。


    △职场领导，不管口头怎么说，内心都是这么想的：顺我者，授大权，重权，实权。逆我者，给小权，轻权，虚权。如让前者掌握指挥权，调动权，监督权，决定权等；让后者掌握操作权，使用权，咨询权，参与权等。


    △人的本质是一切社会关系的总和。处于社会关系中的人，其实是各种各样的有上中下的等级，有左中右的派别，有温和善良的谦谦君子，有阴险狡诈的狡猾小人，有合作共识的伙伴，有相互竞争的对手。权谋家，在与不同的人相处相交时，需要因人、时间、条件、环境、情景不同，而做出不同反应。需要具备纵横捭阖，左右逢源，见什么人说什么话，到什么山，唱什么歌的手段和本领，只有这样才能永远立于不败之地。


    △但凡稍微懂点职场知识的都知道，尽可能，不让自己向领导汇报坏消息，但是有一种坏消息，应该确保由我们第 1 个向上级汇报，那就是，坏消息对我们自己极为不利。这是因为作为第
    1 个汇报这个坏消息的人，你就能够在某种程度上掌控局面，你甚至可以使上级产生对你愿意承认现实，并急于让他掌握情况的好影响，至少你可以抢先观察他的反应，明智的克服坏消息所产生的、不利后果。


    △在用人活动中领导者违背正常的用人规律，无视管理活动的需要，故意将完整的权力分割成若干部分，分别交给多个互存戒心的下属掌握，让他们互相制约，互相监督，谁也威胁不了上司的地位，这种用人的权术叫做权力分割术。


    △历代权谋家，在使用才华出众的下属时，总是出于一种十分复杂的矛盾心理，既要用他又要防他，因此就不得不玩儿权力分割的手段，在使用过程中竭力限制下属拥有权力，以防不测。这种分权和管理学上的分权是有根本区别的，管理学上的分权是为了满足组织的需求，管理活动本身的需要，而权谋上的权力分割属于个人权力稳定需要，个人私利需要。


    △权谋分三大块儿叫做势、法、术。趋势判断，法律框架，权术操作缺一不可。


    △下属的职责所在，就是在于给领导营造一个舒适的环境，使上司的理想得以自由的发挥，一个不会给上司压力，能干的下属，自然能得到上司充分的信任与授权。


    △但凡说一年不给家里打几个电话的，说明都是底层家庭，为啥呢，因为父母不能给他准确的意见，除了要钱之外，大家没有什么沟通，关系也比较冷漠，如果父母有资源能给孩子指点，怎么可能沟通不顺畅呢？只有这种沟通的频繁才能够传递更多的价值和价值观，一个家族才能不断的积累和发展。


    △不要急于粉墨登场，要看准时机，在形势最需要的时候走出来，这才是大智慧的做法。因为过早的出山，身处权力斗争的漩涡之中，难以自保，另一方面在最需要的时候出来，也可以换取更多的权利和筹码。


    △全国经济低迷消费降级，就因为前一段炒鞋让整个运动鞋价格虚高，老百姓无法接受高价产品，站在市场营销角度，如何推广低端品牌？一直是中国人面子和价格平衡的难题。现在破解之道找到了：让低端品牌穿出自豪感，只有爱国这一张牌可以打。当年小米走的是发烧友来掩盖屌丝机的现实无奈。这就是异曲同工之妙。


    △当人到一定高度的时候，已经听不到真话的原因，主要是：很多信息就被屏蔽掉了，没有人敢告诉他，所以就会判断失误，身边又没有军师，对基层的情况不了解。还有就是能在大集团当到高管的人，都很明白，无论是什么决策服从是第1位的，所以大家都不会说这个项目有问题，大家都会坚决的去服从，政治觉悟都很高。政治觉悟不高的早就被淘汰了，留下来的都是人精，但服从度非常高。


    △打着红旗反红旗的套路：以捍卫最高领导者的思想、观点、指示，为手段骗取最高领导者对自己的信任和重视，并在捍卫的活动中，批判自己的竞争对手不积极，反应慢，这样做让竞争对手黯然失色，陷于不利的被动境地。然后逐步用这种手段清除自己的反对力量。从而形成自己一家独大，最终推翻最高领导，自己夺权。


    △学习权谋，很多人只关注手段，其实呢主要还是需要权谋价值观的修炼。因为你如果没有相应的权谋价值观，即使看到牛B的资料，你也无法完成解码，无法完全还原，描述对应的场景、状态和属性等细节。不管书多么的好，你只能看到你能看到的；你只相信你愿意相信的，你只会理解你能够理解的部分，超过的部分对你而言毫无意义也是不存在的。《权谋家读道德经》就是一本讲权谋价值观的书，看其他权谋资料提供解码的工具。


    △有人以为工作很重要，不管上司玩兴正浓，还去请示工作，效果是不会好的，因为，这个人太不懂人情世故，没有心眼儿，不看场合，一般懂得人情世故的人，当上司玩的开心的时候，不但不会请示工作，还会施法使上司更开心些。


    △一个人如果没有格局看到更大的利益，哪怕他一辈子很努力，都会困在一个狭窄空间里，碌碌无为。


    △滴滴就当下的局势，除了私有化退市没有任何退路可言。滴滴退市私有化应该是肯定的，他现在出来辟谣也只是想维持股价稳定，为退市做好掩护。


    △正常来说，一个人穷，应该积极上进，知道处事艰难，但这个社会很多寒门，却不这样认为，越穷越天真，觉得财富来的容易，累了不愿意，受气也不愿意，天天痛骂老板的人，指望着中彩票一夜暴富，或是打倒一个土豪，然后瓜分他的财产。等到将来他自己的孩子没出息的时候，就开始抱怨阶层固化，却忘了别人家孩子的父母拼命学习权谋，努力上爬的时候，他们却在自己刷抖音，打麻将玩游戏，而且还觉得，活在当下，诗和远方。


    △很多人很讨厌权谋，认为这个学问，非常的让人感觉到不舒服，但是，你怎么想不重要，这个社会真正怎么运行才重要，成年人考虑问题的方式从来不是从自己的感受出发，而是从现实出发。


    △突破阶层的四大因素，战争、政治运动、经济快速发展、科技革命，未来十年阶层基本就固化了，除了科技精英，绝大部分人。唯一的道路就是学好权谋在大平台上，不断的学习内卷内斗的技术，来撷取资源。


    △大灾大疫之后，必有大瓜。吴签事件成了，全民舆论的泄洪区。


    △智者不辩，因为辩不清楚的，如果你和别人争辩，他说世界是黄色的，你非要说是绿色的，你俩都是傻逼，所以凡事呵呵，就好，在低位空间生活的底层，总是天天争吵，活在高维世界的佛陀笑而不语。有些人注定一生活在低维空间里而不自知，千万不要去打搅他们。


    △这个世界有三大算法，权力算法、经济算法和道德算法。算法不一样，大家的层次也就不一样，看的高度也就不一样。


    △你每一次在面临抉择的时候都有一个判断，你不知道这个判断从何而来，很多都想当然，凭感觉，而我们权谋家有固定的算法，所以说每次都会往正确的方向做出选择，最终达到累计的效果。


    △资本是逐利的，不是说国家哪里需要资金他就去哪里，而是哪里回报大，就去哪里，并且无论他开始去了哪里，去了中小企业也好，去哪里都好，最终都会走到房地产，因为房产才是中国家庭财富的终极配置。无论是中小企业主还是谁，赚了钱都会买房。同样的道理，钱无论在谁手里，最终都会流入聪明人的口袋。


    △世界上最难教的，就是教人升官发财。因为需要改变他的观念，而一个人的观念基本上没有长时间的洗脑，很难改变。


    △权谋家是那些懂得放弃小利，完成大目标的人，看起来大智若愚，其实是一种有方向感，不计较目前小的得失，而那些小人，在一个一个战术上占了便宜，导致了整个大战略失败的人，看似聪明却没有目标，所有的行为都是应激反应，一生连起来看杂乱不堪。知道权谋逻辑的人，心里有底，自然懂得来日方长，愿意忍不知道权谋逻辑的人，只想获得捷径，心里没底，人生更像猜谜语。


    △什么是与人相处的智慧？正确的与人交往的姿势就是时刻记住“你对你有理，我马上认怂“，这十字诀可以保逢凶化吉，遇难成祥，大富大贵，后富无穷，如果什么事儿都要撕扯撕扯，眼里揉不了沙子，别人们是傻子，就你最牛逼。水至清则无鱼，人至察而无徒，什么人愿意和这样的人交往，什么人愿意把机会留给这样的人？遇见跟你抬杠的跟你撕逼的，你一定要躲得远远的，穷人爱吵架，富人讲合作。


    △权谋文章之所以很少涉及价值观的内容，因为价值观会击溃普通人原有的陈旧观念，就像拉开窗帘，阳光直射进来，会刺中他的双眼，你讲的越多，带来的不解和怨恨就越多。


    △这个社会不是精英创造的，也不是普通老百姓创造的，而是掌握规律的一群人创造的。只要你掌握规律，无论你在社会什么层次，你都是精英，你早晚都要崛起，但是如果你不掌握规律，即使你在高层也会跌落下去


    △因为中国生意讲究闷声发大财，凡事出来不断招摇做网红的老板，那都是经济不行的。不然哪有精力搞这事儿？


    △人的高光时刻也就10来年时间或者三五年时间，其余的时间都在等待、隐忍和储蓄力量。


    △又好又快的，完成领导交给的，第1项任务的下属，领导当然会很满意，但是却不可表功，一般领导都讨厌，做了一点成绩就表功、讨表扬、讨奖赏的下属，本来领导留下一个极好的第一印象，一邀功，这个印象就立即被冲淡了，留下的是相反的，令人不快的印象。


    △职场中，围绕在领导身边的权力圈子是封闭的。因为权力追求的是安全，一旦形成稳定的关系就不愿意再吸纳新人，因为这样会增加权力的变数。但是领导想行驶自己的权力，又不得不有自己的圈子，通常而言，在权力安全和圈子成员之间都会保持平衡，除非发生巨大的变化，圈子里的人没法解决，只能引进新人进圈子，否则的话一旦形成，很多人，再难进入。这个原理给我们的启示是作为职场人，面对新领导到岗的时候一定要快速接近，否则以后就没有机会了。


    △在职场的中下层，必须养成绝对服从领导的思维，你只需要执行命令的能力，不需要保持独立和清醒的思维，保持清醒的思维，会影响执行上级命令的果断性，甚至还会影响组织整体的团结。

