  md: "\n想顺利做事，必须了解到这一点，这也就是很圆通的人，受欢迎的原因，他们保住了别人的面子，别人也会投桃报李给你面子，这种情形在官场非常常见。\n\n\
    △做任何事情，都要有不断变化发展的方法，只有这样才能迷惑他人，尤其可以迷惑你的对手，不能每次都按一种方法行事，这样的话他人能预见你的行为方式，并横加阻拦，增加你失败的机会，高手下棋，自己的招法，路数，绝不能让别人想到，更不会能让对手牵着自己的鼻子走，就是要通过变化，在他人无准备的时候采取行动，取得出其不意的效果。\n\
    \n△一个人比另一个人，最强大自信的是智慧，一旦你的智慧比他强大了，他在你面前就是个小孩子，拿着一个漂亮玩具，你会嫉妒他吗？权谋给大家带来的自信是，犹如站立在人性之间，俯视众生。\n\
    \n△所谓有能力的小人，在领导周围并不鲜见，说白了也是有才无德的人，这种人在工作中经常遇到，尤其需要防备，因为他的无德的内容之一就是爱记仇，喜欢打击报复，对于一个才能平庸的人而言，他的心胸即使再狭窄与你发生冲突，也不会产生太大的危害，有才无德的人则不然，一方面他的才能会让他说话更有分量，另一方面也是至关重要的，有才能的人一旦遇到机会便会脱颖而出，甚至青云直上，说不定昨天还是背靠背互相指责，今天就成了你的顶头上司，这时候他的报复之心就会发作，你只有吃不了兜着走的份。\n\
    \n△我们处理事情的时候，要学会去观察和掌握事物的规律，然后去把握事物，获得主动权和控制权，而不是去敌对。当对一个事物没有足够把握和优势的时候，应该理智对待，先做权益之计，再去寻找可以对付和解决问题的办法，贸然行动的结果只能是白白牺牲，与人与事都没有好处。做事情之前一定先考虑自己的地位和力量，根据实际情况去做，不打无准备之仗，不做无把握之事，这是自古以来人们遵循的行事原则，冲动和鲁莽只会对事情起到反面的作用，理智的思考，积极的准备，才是战胜敌人的法宝，凡事都要仔细慎重，否则很容易被现实打败，我们一定要想办法找到控制和掌握事物发展的源头和根本，只有掌握了它，才能减少伤害，扩大利益。所以主动权和控制权在任何条件下都是最重要的。\n\
    \n△愚者做事，智者做势，人生于世，纵有千钧之力，比之天地，都属于小力。善用势者，可借天地万物之力，行雷霆之势，成就事业之大功。\n\n△心灵鸡汤有这么巨大的市场，反映了人们内心贫乏，证明了大众心智的低下，在快节奏的生活中，人们太需要成功了，但他们没有时间积累、沉淀和领悟出某些适用于人生成长的道理，因此只能寄希望于那些现成的道理，尤其是有公认的权威人物，总结出来的道理，以此来帮助自己答疑解惑，排忧解难。\n\
    \n△人为什么需要偶像呢？因为在充满浮躁感和危机感的社会环境中，每个人都需要一个偶像来支撑自己的心灵，这个偶像可能是像超人一样的幻想形象，也可能是某些卓越的成功人士；人们相信偶像，而且寄希望于偶像，这样在面对重重困难时，才能坚定的走下去，这并不是坏事。某种程度上，偶像崇拜有其不可替代的积极意义，因为人类发展到今天是竞争的结果，与人的竞争，与物的竞争，竞争无处不在，当你无法掌控局面的时候，就需要这些偶像来充当心理支柱，提供巨大的心灵力量。\n\
    \n△其实西方对权谋的研究也是比较深入的，只是很多人不知道而已，马基亚维利对“饰贤术”也作了很精辟的总结：一个为君的人不必具备所有的美德，但他们必须在表面上装成，道德高尚，要让人们看起来，仁慈的，忠实的，合乎人情的，虔诚的与正直的，甚至事实上都可以真的如此，但他必须有这样一种心理准备，即当局势要你不这样做事，你要会反其道而行之。如果可能，君王应该不违善行，但为时事所逼时，他又是能够毫无顾忌的做坏事。\n\
    \n△作为管理者赏赐下属的时候，很容易忽视赏赐的姿态。因为不注意姿态的话，很难产生一定的拉拢效果。姿态问题，主要是要体现在不以施惠者自居，要尊重下属，可以增加笼络的效力，激发他们的知遇之恩。\n\
    \n△一个组织最高领导，日常的活动有两个基本内容，第1个是，对内外种种的事項进行决策，第2个是，选择适当的人选，委以重任分管各种行政权力。\n\n△权力分配有两种形式，分割与分隔。分割者，将其势力一分为几，削弱其实力。分隔者，是隔断。权重支撑互相的联系和结盟。只有把握这两点精髓，才能把权力牢牢给控制住。\n\
    \n△今天在看《吕氏春秋》发现了一段经典的论述，能够足以概括“见人说人话，见鬼说鬼话”的精髓：善说者若巧士，因人之力以自为力，因其来而与来，因其往而与往。不设形象，与生与长，而言之与响。与盛与衰，以之所归。力虽多，材虽劲，以制其命。顺风而呼，声不加疾也；际高而望，目不加明也。所因便也。\n\
    \n△格局决定了人生的走向，天天聚焦细节的人，永远也就只能是，一肚子的鸡零狗碎。人的精力是有限的，顾了细锁，自然就错失了全局，一个是非不断的人，要离他远点。说的善良一点，是别给自己找麻烦，说的功利一点，他也不会有什么大的出息。一句话，有大志向的人，无小是非。\n\
    \n△【贵人】所谓贵人总是在寻找合适的投资对象，注意是投资对象，而非救济对象，他们的帮助，总是有价格的，是需要获得投资回报的。人要明白一件事情越往上走，愿意帮助你的人越少，之前你的普通，对别人没有危险，大家乐得做好人。而如今你的成功时刻让人如坐针毡，众人开始全力提防你，所以凡人求人帮忙，贵人只找人合作，是因为他明白了没有人能真正帮助他。那些人还在犹豫，你说我该不该开口向他求援？如果你这样想的话，你不能为对方，想出获利的理由，干脆免开尊口，贵人只能合作，不要乞求。\n\
    \n△恋爱中，穷男人把买单当成对自己的考验，真的喜欢她吗？真的有这么喜欢她吗？而富男人把买单当成对女人的考验，她喜欢我的钱，还是喜欢我的人？\n\n爱找茬吵架的女人有两类，一类是觉得拿不住男朋友没有安全感，另一类觉得拿得住男朋友，要大小姐脾气。爱找茬吵架的男人，只有一类想换女人了。\n\
    \n△处理问题一定要考虑利弊得失，不论在什么情况下，不论遇到什么问题，首先要考虑怎样处理才有利，或者利大于弊，如果弊大于利或者怎么处理都不利，那就要想方设法推脱，不要引火烧身。\n\
    \n△为什么男人通常会耐不住性子打断对方插话，表达自己的意见，而女人却往往会强迫自己耐心的等待对方的话告一段落，才表达自己的想法？这背后心理学家给出了原因，插话，表现出权力和支配欲，男人比女人更爱插话，反映出男人的更强的控制欲望。\n\
    \n△女人比男人更有表演欲，也更具表演特长，女人讲话的过程是个丰富的烹饪过程，可以添油，可以加醋，向一个女人一个热情的女人去咨询一件事，她一定会用最高昂的热情告诉你，她对这件事情目前所能搜集的所有资料，她的看法，她的朋友的看法，她亲戚的看法，她所认识一切人的看法，总之每个女人总能让倾听者感受到信息的大爆炸。\n\
    \n△佛说：我虽有宇宙最大的神通，但我有四件事做不到：因果不可改，智慧不可赐，真法不可说，无缘不能渡！\n\n△不管是创业还是生活人都会遇到许多困惑，但是千万不要停下来花力气去解决这些困惑，只要不断的向前获得更多的阅历和经验困惑自然就迎刃而解。很多时候你在自己的维度无法解决，只需要上升一个维度，什么都不是问题了。\n\
    \n△从愚钝到智慧，我们需要的是开悟；从贫困到富裕，我们需要的是选择；从依赖到独立，我们需要的是辨别；从知道到做对，我们需要的是践行。\n\n△经过权谋的训练学习和试错，你就拥有了上帝视角，这个时候在你的视野中，任何一个问题都有多种解释，任何一种现象的答案选择都不是唯一的，而且你有了自己的权谋判断，可以发现如何选择才是对自己最有利的，并从这个过程中获得心智的成长和精神的自由。\n\
    \n△人们为什么会接受权威，放弃自己的思考。主要是3点原因，从结果上讲，人的胜算会更大；从心理学角度来讲，人推卸了自己的责任；从生理角度来讲，能够让自己很轻松不累。\n\
    \n△选择挑战性的工作，要考虑三个问题，第一你有什么能力挑战？如果失败了怎么办？成功了会不会被人摘桃子？\n\n△我们大多数人，在面对该做什么，不该做什么的问题时，第一个念头，常常是别人会怎么看，而不是我为什么要这么做，人们的畏惧别人的眼光，甚于畏惧失败，所以活得卑微而没有主见，为什么要听从别人的安排呢？做或者不做，做的好不好，都跟别人没有关系，别不需要你为他们对你的看法买单，最后承担结果的是你自己。因此为自己而活，别让别人干涉你的人生。\n\
    \n△一个人如果把随波逐流当成坎坷中的精神自慰和权益之计，他或许还有自立于人的时候，而如果真的把这当做人生信仰理念，那必将一事无成，一个永远自甘平庸，无特立之行的人，不仅与成功无缘，而且是活的毫无意义和价值。\n\
    \n△所谓权谋智慧，就是要对事物进行观察，理解，再观察，再理解，直到事物在你面前透明起来，不再有盲点和黑暗部分。这需要我们日常通过阅读历史、新闻训练自己的判断力、洞察力和理解力，以达到这个境界。\n\
    \n△人脉资源就是这样，我们越觉得他管用，那么他就越有用，假如我们对人脉资源嗤之以鼻，靠自己一个人，在这个社会上单打独斗的话，碰一鼻子灰肯定的，是再所难免的事儿，我们通过自己的人脉结识了一个朋友，那么这个朋友就成了我们的熟人，他又可以给我们带来新的朋友，只有这种良性的人脉网络一直发展下去，我们会发现有一天，我们做任何事情，都有一个能够帮助我们的朋友存在。\n\
    \n△疫情过后，中国的消费分级趋势会愈加明显，大众是清单式消费，中产阶级是冲动式，触发式消费；大众是趋同化消费，中产阶层是趋优化消费；大众是功能化消费，中产是美学化，精致化，健康化消费。\n\
    \n△欺骗的存在，首先是人心复杂，难以推测，其次是利益相关可以低成本的获取更多的利益，最后是因为学习模仿是人的本性，将模仿用于不正当用途就会形成欺骗。但是从心智模式来讲，受骗者不是输给了信任和乐观的期待，而是自己心智防御模式的不够健全，把信任视作为人际关系，商业交流的基础是对的，但你不能当成全部，因为成人的世界里面欺骗是一种普遍现象，我们只能增加对这个社会的了解，骗子是怎么骗人的，进而增强防护能力，除此之外别无他途。\n\
    \n△虽然骗子们的招数越来越精明，但其核心始终没变，就是抓住人性的两个弱点进行重点攻击，这两个弱点，一个是贪婪，另一个是恐惧，人们既因欲望而贪，贪钱，希望获得越来越多的物质和情感回报，又因为欲望而恐惧，害怕失去，惧怕一切损失。如果我们将这个世界所有的骗局进行归类，你会发现他们无一不是利用人们这两个心理做文章，旁氏骗局是利用人的贪婪，你获奖了的骗局是利用人的贪婪，你收到了法院传票是利用人的恐惧，你的账户被冻结需要把钱转移到安全账户，这也是利用人的恐惧。凡是针对人心智的套路，均是抓住这两点大做文章。\n\
    \n△承认自己的错和承认别人比自己优秀，这两点都是每个人不愿接受的。\n\n△道是什么？道是客观规律，是人性。人要认识规律，遵循规律；人要认识人性，理解人性。\n\
    \n△大多数人，为什么到了三十五岁没有到领导层就会被淘汰，进入中年危机啊？其实很简单呀！对于生产，你已经不能算作“人”了，只是一个“单位零件”，这个“单位零件”的运转需要保证整个流程不受干扰且长时间保持价值的最大化，“单位零件”如果是不•可替代的，资本家会修修，如果是可被代替的，干脆就换掉。这回你就知道为什么被淘汰了吧？\n\
    \n△仕途之人最喜欢的两个字就是控制，控制是一种对力的把握力量，是一种难以控制主动权，尤其是人心的力量，正因为难以控制，因此控制心里的游戏，才是最激动人心的游戏。\n\
    \n△如何从历史材料里读出权谋呢，很多\b人有这个疑问，其实呢，训练的方法很简单，那就是看一段材料，然后进行无拘无束的大胆猜想，可以暂且不去考虑它的可操作性，先根据已有事实，建立以假说，然后寻找客观的支撑点，大胆推演，不断改进，无法获得细节时，就用想象来填补，先不管成立不成立，有总比没有好，有了假想之后就要不断推演，细化，这不但能让我们学到很多东西，也往往能够擦出思维火花。\n\
    \n△李嘉诚在长江商学院成立10周年的讲话上，有这么两段非常的精彩分享给大家：在我眼中，未来跟明天是两回事，天命和命运是不同的，明天只是新的一天，而未来是自己的一生，各种偶然中不断选择的结果，追求自我，努力改善自己，是一股正面的驱动力，当你把思维，想象和行动谐成乐章，在科技，人文，商业无限机会中实践自我。知识，责任感和目标融会成智慧，天命不一定是命运的蓝图。其实你今天站在什么位置并不重要，但你的下一步如何走却很关键，我们无法延长生命的长度，但却可以增加生命的宽度，无论你今天是多么的卑微，但你只要高尚的心理动机不变，并愿意为此不遗余力，那么总有一天别人会仰视你。\n\
    \n△如果想让别人和你达成共识，我们要做的往往不是讲清楚利弊，而是隐藏你的真实意图。因为我们对任何新事物、新观念都有很大的防备心理。\n\n△你想说服别人或宣传一种价值观，最重要的不是诉诸利益，而是解除对方的防备。消除防备最简单的方法是：提供两个“意图”，一个明显的意图，一个隐藏的意图。可以学着把对方的认知焦点放在“隐藏的意图”里。\n\
    \n△权本华说，世界上最大的监狱，是人的思维意识。每个人终其一生都在与“认知”做对抗。因为绝大多数过失都是我们自己的“认知局限”造成的。每天都只想得到眼前的好处，却从没想过打开自己的认知牢笼。\n\
    \n△朝廷对曾国藩的态度是，即任用又猜忌，即支持又削弱，曾国藩能够在夹缝中，站住脚跟，并能够频得实惠，步步高升，主要是他对皇帝采用了如下4条权谋术：第一逆来顺受，第二以死孝忠，第三无奈的时候用拖和缓来处理，第四有所欲求的时候委婉而言。\n\
    \n△诚信分之为大信和小信，君子只讲大信，不讲小信，对任何人都讲诚信，那就过于愚昧。诚信要看对象，所作所为是否符合道义，如果不符合道义，这就要平衡各方利益，进行权变。\n\
    \n△学习不应该是被动和机械的，而是通过自己的用心观察以及实践经验总结出一套无往不利的处事规则，那些高人给人的感觉总是目光锐利，对事情的判断比常人更加准确，这都得益于他们刻苦努力的学习，并在学习中获得天大的乐趣。\n\
    \n△越是底层的人，越是会用一种消耗型的方式来寻求快乐，比如肥皂剧、毒品、电子游戏，等等。当头脑的渴望和心灵的渴望相抵触时，就是消耗型快乐。而越是高层次的人，越是会用一种补充型的方式来寻求快乐，比如跑步、阅读、学习等等，当头脑渴望和心灵渴望达成默契时，就是补充型快乐。或许我们可以这样说，你选择输入什么样的信息，最终决定你享受什么样的人生和生活。\n\
    \n△权术被绝对地看成一个贬义词，等同于阴谋诡计，其实这是非常错误的认知。权术本质是很正当的权力驾驭术，是中性的。只有超越了游戏规则，越位了、犯规了，才叫阴谋诡计。而在游戏规则之内用一些计谋或者手段，那叫政治智慧。\n\
    \n△很多人，如果没有高人指点，就进行自我反思的话，基本都是错误的，因为人，都有归因偏差的这种心理倾向。直白一点就是说，在人们的潜意识中，我们习惯高估自己，将成功的原因归因于自我能力，个人特质，而将失败的原因归因于外部环境，工作本身以及他人。\n\
    \n△很多人，如果没有高人指点，就进行自我反思的话，基本都是错误的，因为人，都有归因偏差的这种心理倾向。直白一点就是说，在人们的潜意识中，我们习惯高估自己，将成功的原因归因于自我能力，个人特质，而将失败的原因归因于外部环境，工作本身以及他人。\n\
    \n△我们会习惯性惧怕，万一做错了怎么办？接着在无止境的假设中，原地转圈。某一天，猛一抬头，发现一步也没有踏出去，谁都不想让自己的时间和精力付诸东流，谁都不愿意面对岔路上形形色色的此路不通的醒目标志，可事实上，你要走的路，99%不是规划出来的，而是上路之后，随着柳暗花明，潮起潮落，逐渐浮现出来的。你要先上路，才能找到方向。\n\
    \n△一般人都会同情和帮助弱者，而对于比自己处境好的人怀有敌意，如果有机会，还会不自觉的攻击他们，而强者拥有更多的能力和机会，如果一个人想挣更多的钱，最好跟强者合作，而不是与他们为敌。也就是说，当自己处境比别人差时，人们欺骗伤害他人的倾向会增强，帮助他人的倾向会减弱，反之当自己处境比别人好时，人们帮助他人的倾向会增强，伤害他人的倾向会减弱。\n\
    \n△很多时候我们的视野是受局限的，在受限的视野下，很多事情我们会觉得不公平，当你认为不公平时，往往会受到自身情绪的影响，愤怒的放弃将会获得的利益，比如说底层人觉得，如果赚的钱比我多，我就不干，有一些人更过分，只要你有的赚我就不干。而权谋家的态度是，只要我有的赚，我都愿意干，至于别人挣多少，并不在我们的计算之内。\n\
    \n△沿着旧地图，找不到新大陆。很多人理解不了权谋，就是因为从自己的认知出发，无法理解权力的魅力，而去否定他，但是事实上呢。你如果思想是对的，为什么你还在底层呢？\n\
    \n△这个社会它永远是按照等级来分配资源和财富的，所以说我们想提升自己的收入，让自己生活过得很好，那么就要不断的把精力放在提升自己社会地位上来，而提升自己社会地位的知识就是权谋术，关于权力的技术。\n\
    \n△所谓富，并非单单指的是钱。这么说吧~随便找个工厂上班的员工，给他一百万还能变出一千万？上一辈的积累，有着经验人脉高认知等~就说我们这一辈，父母除了抛怨还把低认知和不良情绪遗传给下一代，简直就是负资产。如果有人不认可，一定是从低概率看到了他想看到的！当年分了地主的钱，却没有分地主的思想，多少年之后，当年地主的后代都大概率又蛤起了。\n\
    \n△司马懿通过联姻，编织起一张豪族的巨网：他的妻母来自河内山氏，是“竹林七贤”中山涛的姑祖母；长子司马师娶的泰山羊氏，是西晋名臣羊祜的姊姊；次子司马昭娶的东海王氏，即司徒王朗之女；女婿则是出身京兆杜氏的杜预。这些姻亲戚属无一不来自世家大族，司马懿也就名正言顺地成为地方豪族的代表和社会精英的领袖。\n\
    \n△设局通常是三步走：第1步是深度研判目标的内心，把他内心里面的 一切都全部了解清楚，知道他的欲望，动机和方向。第2步就是预判目标前进的路径，知道他要去的地方，自然能够选择的路就几条，能够选择的交通工具也就几个。我们更换目标必经之路上的一些目标性的东西，导向我们所要让目标走的路径上。第\
    \ 3 步就是在终点站设置一张网，等他想回头已经回不去了。\n\n△升职加薪的两个核心，就是做更有价值的工作和做有更有价值感的人。因为公司评估的，不是你做出了多少贡献，而是在未来的一年，公司对你的价值预估。当然也有例外情况，那就是外部市场定价的上涨以及内部不可替代性。这一切用权谋学的思维就是钱永远是稀缺的，你能否拿到加薪机会取决于给你加薪的价值是否大于给别人加薪。\n\
    \n△真正的权谋家，为了保全自己，壮大自己，并不是自己跳下来和对手直接打一架，而是充分利用对手，把自己的朋友弄得多的，把敌人弄得少少的，尽可能的削弱、孤立和分化敌人，最终消灭敌人。\n\
    \n△很多时候，社会之所以对你坏，是你太弱而已。生活就是如此残酷，锦上添花的人多，雪中送炭的人少。人只会为难软弱的人，你自己不够强大的时候，没有在乎你的尊严，你的声音，你的眼泪。请记住，当你变得优秀，整个世界都会变得可爱起来。\n\
    \n△学校打造好的第 1 荞儿韭菜：想赚钱必须勤劳致富，踏踏实实干活儿，老板会好好表扬你的，看见心动的女生就要给她买礼物，天天追着她向她表白，最终能够感动她。对于老板有毛病一定要提出来，这样才能为组织好。对社会上一定要有正义感，老人摔倒了一定要扶，只要问心无愧，就行。\n\
    \n△在职场新人最讨厌的行为：第 1 个呢是不懂得价值交换，到处请教；第 2 个就是寻求平等，和上级之间没大没小。第 3 个就是，不搞团结，自以为是。\n\n\
    △强者的教育就是让孩子尽快认识到社会规则是谁来制定的，如何利用游戏规则，如何自己去驾驭规则，最终让自己变成规则的制定者。\n"
  mdcn: "\n想顺利做事，必须了解到这一点，这也就是很圆通的人，受欢迎的原因，他们保住了别人的面子，别人也会投桃报李给你面子，这种情形在官场非常常见。\n\n\
    △做任何事情，都要有不断变化发展的方法，只有这样才能迷惑他人，尤其可以迷惑你的对手，不能每次都按一种方法行事，这样的话他人能预见你的行为方式，并横加阻拦，增加你失败的机会，高手下棋，自己的招法，路数，绝不能让别人想到，更不会能让对手牵着自己的鼻子走，就是要通过变化，在他人无准备的时候采取行动，取得出其不意的效果。\n\
    \n△一个人比另一个人，最强大自信的是智慧，一旦你的智慧比他强大了，他在你面前就是个小孩子，拿着一个漂亮玩具，你会嫉妒他吗？权谋给大家带来的自信是，犹如站立在人性之间，俯视众生。\n\
    \n△所谓有能力的小人，在领导周围并不鲜见，说白了也是有才无德的人，这种人在工作中经常遇到，尤其需要防备，因为他的无德的内容之一就是爱记仇，喜欢打击报复，对于一个才能平庸的人而言，他的心胸即使再狭窄与你发生冲突，也不会产生太大的危害，有才无德的人则不然，一方面他的才能会让他说话更有分量，另一方面也是至关重要的，有才能的人一旦遇到机会便会脱颖而出，甚至青云直上，说不定昨天还是背靠背互相指责，今天就成了你的顶头上司，这时候他的报复之心就会发作，你只有吃不了兜着走的份。\n\
    \n△我们处理事情的时候，要学会去观察和掌握事物的规律，然后去把握事物，获得主动权和控制权，而不是去敌对。当对一个事物没有足够把握和优势的时候，应该理智对待，先做权益之计，再去寻找可以对付和解决问题的办法，贸然行动的结果只能是白白牺牲，与人与事都没有好处。做事情之前一定先考虑自己的地位和力量，根据实际情况去做，不打无准备之仗，不做无把握之事，这是自古以来人们遵循的行事原则，冲动和鲁莽只会对事情起到反面的作用，理智的思考，积极的准备，才是战胜敌人的法宝，凡事都要仔细慎重，否则很容易被现实打败，我们一定要想办法找到控制和掌握事物发展的源头和根本，只有掌握了它，才能减少伤害，扩大利益。所以主动权和控制权在任何条件下都是最重要的。\n\
    \n△愚者做事，智者做势，人生于世，纵有千钧之力，比之天地，都属于小力。善用势者，可借天地万物之力，行雷霆之势，成就事业之大功。\n\n△心灵鸡汤有这么巨大的市场，反映了人们内心贫乏，证明了大众心智的低下，在快节奏的生活中，人们太需要成功了，但他们没有时间积累、沉淀和领悟出某些适用于人生成长的道理，因此只能寄希望于那些现成的道理，尤其是有公认的权威人物，总结出来的道理，以此来帮助自己答疑解惑，排忧解难。\n\
    \n△人为什么需要偶像呢？因为在充满浮躁感和危机感的社会环境中，每个人都需要一个偶像来支撑自己的心灵，这个偶像可能是像超人一样的幻想形象，也可能是某些卓越的成功人士；人们相信偶像，而且寄希望于偶像，这样在面对重重困难时，才能坚定的走下去，这并不是坏事。某种程度上，偶像崇拜有其不可替代的积极意义，因为人类发展到今天是竞争的结果，与人的竞争，与物的竞争，竞争无处不在，当你无法掌控局面的时候，就需要这些偶像来充当心理支柱，提供巨大的心灵力量。\n\
    \n△其实西方对权谋的研究也是比较深入的，只是很多人不知道而已，马基亚维利对“饰贤术”也作了很精辟的总结：一个为君的人不必具备所有的美德，但他们必须在表面上装成，道德高尚，要让人们看起来，仁慈的，忠实的，合乎人情的，虔诚的与正直的，甚至事实上都可以真的如此，但他必须有这样一种心理准备，即当局势要你不这样做事，你要会反其道而行之。如果可能，君王应该不违善行，但为时事所逼时，他又是能够毫无顾忌的做坏事。\n\
    \n△作为管理者赏赐下属的时候，很容易忽视赏赐的姿态。因为不注意姿态的话，很难产生一定的拉拢效果。姿态问题，主要是要体现在不以施惠者自居，要尊重下属，可以增加笼络的效力，激发他们的知遇之恩。\n\
    \n△一个组织最高领导，日常的活动有两个基本内容，第1个是，对内外种种的事項进行决策，第2个是，选择适当的人选，委以重任分管各种行政权力。\n\n△权力分配有两种形式，分割与分隔。分割者，将其势力一分为几，削弱其实力。分隔者，是隔断。权重支撑互相的联系和结盟。只有把握这两点精髓，才能把权力牢牢给控制住。\n\
    \n△今天在看《吕氏春秋》发现了一段经典的论述，能够足以概括“见人说人话，见鬼说鬼话”的精髓：善说者若巧士，因人之力以自为力，因其来而与来，因其往而与往。不设形象，与生与长，而言之与响。与盛与衰，以之所归。力虽多，材虽劲，以制其命。顺风而呼，声不加疾也；际高而望，目不加明也。所因便也。\n\
    \n△格局决定了人生的走向，天天聚焦细节的人，永远也就只能是，一肚子的鸡零狗碎。人的精力是有限的，顾了细锁，自然就错失了全局，一个是非不断的人，要离他远点。说的善良一点，是别给自己找麻烦，说的功利一点，他也不会有什么大的出息。一句话，有大志向的人，无小是非。\n\
    \n△【贵人】所谓贵人总是在寻找合适的投资对象，注意是投资对象，而非救济对象，他们的帮助，总是有价格的，是需要获得投资回报的。人要明白一件事情越往上走，愿意帮助你的人越少，之前你的普通，对别人没有危险，大家乐得做好人。而如今你的成功时刻让人如坐针毡，众人开始全力提防你，所以凡人求人帮忙，贵人只找人合作，是因为他明白了没有人能真正帮助他。那些人还在犹豫，你说我该不该开口向他求援？如果你这样想的话，你不能为对方，想出获利的理由，干脆免开尊口，贵人只能合作，不要乞求。\n\
    \n△恋爱中，穷男人把买单当成对自己的考验，真的喜欢她吗？真的有这么喜欢她吗？而富男人把买单当成对女人的考验，她喜欢我的钱，还是喜欢我的人？\n\n爱找茬吵架的女人有两类，一类是觉得拿不住男朋友没有安全感，另一类觉得拿得住男朋友，要大小姐脾气。爱找茬吵架的男人，只有一类想换女人了。\n\
    \n△处理问题一定要考虑利弊得失，不论在什么情况下，不论遇到什么问题，首先要考虑怎样处理才有利，或者利大于弊，如果弊大于利或者怎么处理都不利，那就要想方设法推脱，不要引火烧身。\n\
    \n△为什么男人通常会耐不住性子打断对方插话，表达自己的意见，而女人却往往会强迫自己耐心的等待对方的话告一段落，才表达自己的想法？这背后心理学家给出了原因，插话，表现出权力和支配欲，男人比女人更爱插话，反映出男人的更强的控制欲望。\n\
    \n△女人比男人更有表演欲，也更具表演特长，女人讲话的过程是个丰富的烹饪过程，可以添油，可以加醋，向一个女人一个热情的女人去咨询一件事，她一定会用最高昂的热情告诉你，她对这件事情目前所能搜集的所有资料，她的看法，她的朋友的看法，她亲戚的看法，她所认识一切人的看法，总之每个女人总能让倾听者感受到信息的大爆炸。\n\
    \n△佛说：我虽有宇宙最大的神通，但我有四件事做不到：因果不可改，智慧不可赐，真法不可说，无缘不能渡！\n\n△不管是创业还是生活人都会遇到许多困惑，但是千万不要停下来花力气去解决这些困惑，只要不断的向前获得更多的阅历和经验困惑自然就迎刃而解。很多时候你在自己的维度无法解决，只需要上升一个维度，什么都不是问题了。\n\
    \n△从愚钝到智慧，我们需要的是开悟；从贫困到富裕，我们需要的是选择；从依赖到独立，我们需要的是辨别；从知道到做对，我们需要的是践行。\n\n△经过权谋的训练学习和试错，你就拥有了上帝视角，这个时候在你的视野中，任何一个问题都有多种解释，任何一种现象的答案选择都不是唯一的，而且你有了自己的权谋判断，可以发现如何选择才是对自己最有利的，并从这个过程中获得心智的成长和精神的自由。\n\
    \n△人们为什么会接受权威，放弃自己的思考。主要是3点原因，从结果上讲，人的胜算会更大；从心理学角度来讲，人推卸了自己的责任；从生理角度来讲，能够让自己很轻松不累。\n\
    \n△选择挑战性的工作，要考虑三个问题，第一你有什么能力挑战？如果失败了怎么办？成功了会不会被人摘桃子？\n\n△我们大多数人，在面对该做什么，不该做什么的问题时，第一个念头，常常是别人会怎么看，而不是我为什么要这么做，人们的畏惧别人的眼光，甚于畏惧失败，所以活得卑微而没有主见，为什么要听从别人的安排呢？做或者不做，做的好不好，都跟别人没有关系，别不需要你为他们对你的看法买单，最后承担结果的是你自己。因此为自己而活，别让别人干涉你的人生。\n\
    \n△一个人如果把随波逐流当成坎坷中的精神自慰和权益之计，他或许还有自立于人的时候，而如果真的把这当做人生信仰理念，那必将一事无成，一个永远自甘平庸，无特立之行的人，不仅与成功无缘，而且是活的毫无意义和价值。\n\
    \n△所谓权谋智慧，就是要对事物进行观察，理解，再观察，再理解，直到事物在你面前透明起来，不再有盲点和黑暗部分。这需要我们日常通过阅读历史、新闻训练自己的判断力、洞察力和理解力，以达到这个境界。\n\
    \n△人脉资源就是这样，我们越觉得他管用，那么他就越有用，假如我们对人脉资源嗤之以鼻，靠自己一个人，在这个社会上单打独斗的话，碰一鼻子灰肯定的，是再所难免的事儿，我们通过自己的人脉结识了一个朋友，那么这个朋友就成了我们的熟人，他又可以给我们带来新的朋友，只有这种良性的人脉网络一直发展下去，我们会发现有一天，我们做任何事情，都有一个能够帮助我们的朋友存在。\n\
    \n△疫情过后，中国的消费分级趋势会愈加明显，大众是清单式消费，中产阶级是冲动式，触发式消费；大众是趋同化消费，中产阶层是趋优化消费；大众是功能化消费，中产是美学化，精致化，健康化消费。\n\
    \n△欺骗的存在，首先是人心复杂，难以推测，其次是利益相关可以低成本的获取更多的利益，最后是因为学习模仿是人的本性，将模仿用于不正当用途就会形成欺骗。但是从心智模式来讲，受骗者不是输给了信任和乐观的期待，而是自己心智防御模式的不够健全，把信任视作为人际关系，商业交流的基础是对的，但你不能当成全部，因为成人的世界里面欺骗是一种普遍现象，我们只能增加对这个社会的了解，骗子是怎么骗人的，进而增强防护能力，除此之外别无他途。\n\
    \n△虽然骗子们的招数越来越精明，但其核心始终没变，就是抓住人性的两个弱点进行重点攻击，这两个弱点，一个是贪婪，另一个是恐惧，人们既因欲望而贪，贪钱，希望获得越来越多的物质和情感回报，又因为欲望而恐惧，害怕失去，惧怕一切损失。如果我们将这个世界所有的骗局进行归类，你会发现他们无一不是利用人们这两个心理做文章，旁氏骗局是利用人的贪婪，你获奖了的骗局是利用人的贪婪，你收到了法院传票是利用人的恐惧，你的账户被冻结需要把钱转移到安全账户，这也是利用人的恐惧。凡是针对人心智的套路，均是抓住这两点大做文章。\n\
    \n△承认自己的错和承认别人比自己优秀，这两点都是每个人不愿接受的。\n\n△道是什么？道是客观规律，是人性。人要认识规律，遵循规律；人要认识人性，理解人性。\n\
    \n△大多数人，为什么到了三十五岁没有到领导层就会被淘汰，进入中年危机啊？其实很简单呀！对于生产，你已经不能算作“人”了，只是一个“单位零件”，这个“单位零件”的运转需要保证整个流程不受干扰且长时间保持价值的最大化，“单位零件”如果是不•可替代的，资本家会修修，如果是可被代替的，干脆就换掉。这回你就知道为什么被淘汰了吧？\n\
    \n△仕途之人最喜欢的两个字就是控制，控制是一种对力的把握力量，是一种难以控制主动权，尤其是人心的力量，正因为难以控制，因此控制心里的游戏，才是最激动人心的游戏。\n\
    \n△如何从历史材料里读出权谋呢，很多\b人有这个疑问，其实呢，训练的方法很简单，那就是看一段材料，然后进行无拘无束的大胆猜想，可以暂且不去考虑它的可操作性，先根据已有事实，建立以假说，然后寻找客观的支撑点，大胆推演，不断改进，无法获得细节时，就用想象来填补，先不管成立不成立，有总比没有好，有了假想之后就要不断推演，细化，这不但能让我们学到很多东西，也往往能够擦出思维火花。\n\
    \n△李嘉诚在长江商学院成立10周年的讲话上，有这么两段非常的精彩分享给大家：在我眼中，未来跟明天是两回事，天命和命运是不同的，明天只是新的一天，而未来是自己的一生，各种偶然中不断选择的结果，追求自我，努力改善自己，是一股正面的驱动力，当你把思维，想象和行动谐成乐章，在科技，人文，商业无限机会中实践自我。知识，责任感和目标融会成智慧，天命不一定是命运的蓝图。其实你今天站在什么位置并不重要，但你的下一步如何走却很关键，我们无法延长生命的长度，但却可以增加生命的宽度，无论你今天是多么的卑微，但你只要高尚的心理动机不变，并愿意为此不遗余力，那么总有一天别人会仰视你。\n\
    \n△如果想让别人和你达成共识，我们要做的往往不是讲清楚利弊，而是隐藏你的真实意图。因为我们对任何新事物、新观念都有很大的防备心理。\n\n△你想说服别人或宣传一种价值观，最重要的不是诉诸利益，而是解除对方的防备。消除防备最简单的方法是：提供两个“意图”，一个明显的意图，一个隐藏的意图。可以学着把对方的认知焦点放在“隐藏的意图”里。\n\
    \n△权本华说，世界上最大的监狱，是人的思维意识。每个人终其一生都在与“认知”做对抗。因为绝大多数过失都是我们自己的“认知局限”造成的。每天都只想得到眼前的好处，却从没想过打开自己的认知牢笼。\n\
    \n△朝廷对曾国藩的态度是，即任用又猜忌，即支持又削弱，曾国藩能够在夹缝中，站住脚跟，并能够频得实惠，步步高升，主要是他对皇帝采用了如下4条权谋术：第一逆来顺受，第二以死孝忠，第三无奈的时候用拖和缓来处理，第四有所欲求的时候委婉而言。\n\
    \n△诚信分之为大信和小信，君子只讲大信，不讲小信，对任何人都讲诚信，那就过于愚昧。诚信要看对象，所作所为是否符合道义，如果不符合道义，这就要平衡各方利益，进行权变。\n\
    \n△学习不应该是被动和机械的，而是通过自己的用心观察以及实践经验总结出一套无往不利的处事规则，那些高人给人的感觉总是目光锐利，对事情的判断比常人更加准确，这都得益于他们刻苦努力的学习，并在学习中获得天大的乐趣。\n\
    \n△越是底层的人，越是会用一种消耗型的方式来寻求快乐，比如肥皂剧、毒品、电子游戏，等等。当头脑的渴望和心灵的渴望相抵触时，就是消耗型快乐。而越是高层次的人，越是会用一种补充型的方式来寻求快乐，比如跑步、阅读、学习等等，当头脑渴望和心灵渴望达成默契时，就是补充型快乐。或许我们可以这样说，你选择输入什么样的信息，最终决定你享受什么样的人生和生活。\n\
    \n△权术被绝对地看成一个贬义词，等同于阴谋诡计，其实这是非常错误的认知。权术本质是很正当的权力驾驭术，是中性的。只有超越了游戏规则，越位了、犯规了，才叫阴谋诡计。而在游戏规则之内用一些计谋或者手段，那叫政治智慧。\n\
    \n△很多人，如果没有高人指点，就进行自我反思的话，基本都是错误的，因为人，都有归因偏差的这种心理倾向。直白一点就是说，在人们的潜意识中，我们习惯高估自己，将成功的原因归因于自我能力，个人特质，而将失败的原因归因于外部环境，工作本身以及他人。\n\
    \n△很多人，如果没有高人指点，就进行自我反思的话，基本都是错误的，因为人，都有归因偏差的这种心理倾向。直白一点就是说，在人们的潜意识中，我们习惯高估自己，将成功的原因归因于自我能力，个人特质，而将失败的原因归因于外部环境，工作本身以及他人。\n\
    \n△我们会习惯性惧怕，万一做错了怎么办？接着在无止境的假设中，原地转圈。某一天，猛一抬头，发现一步也没有踏出去，谁都不想让自己的时间和精力付诸东流，谁都不愿意面对岔路上形形色色的此路不通的醒目标志，可事实上，你要走的路，99%不是规划出来的，而是上路之后，随着柳暗花明，潮起潮落，逐渐浮现出来的。你要先上路，才能找到方向。\n\
    \n△一般人都会同情和帮助弱者，而对于比自己处境好的人怀有敌意，如果有机会，还会不自觉的攻击他们，而强者拥有更多的能力和机会，如果一个人想挣更多的钱，最好跟强者合作，而不是与他们为敌。也就是说，当自己处境比别人差时，人们欺骗伤害他人的倾向会增强，帮助他人的倾向会减弱，反之当自己处境比别人好时，人们帮助他人的倾向会增强，伤害他人的倾向会减弱。\n\
    \n△很多时候我们的视野是受局限的，在受限的视野下，很多事情我们会觉得不公平，当你认为不公平时，往往会受到自身情绪的影响，愤怒的放弃将会获得的利益，比如说底层人觉得，如果赚的钱比我多，我就不干，有一些人更过分，只要你有的赚我就不干。而权谋家的态度是，只要我有的赚，我都愿意干，至于别人挣多少，并不在我们的计算之内。\n\
    \n△沿着旧地图，找不到新大陆。很多人理解不了权谋，就是因为从自己的认知出发，无法理解权力的魅力，而去否定他，但是事实上呢。你如果思想是对的，为什么你还在底层呢？\n\
    \n△这个社会它永远是按照等级来分配资源和财富的，所以说我们想提升自己的收入，让自己生活过得很好，那么就要不断的把精力放在提升自己社会地位上来，而提升自己社会地位的知识就是权谋术，关于权力的技术。\n\
    \n△所谓富，并非单单指的是钱。这么说吧~随便找个工厂上班的员工，给他一百万还能变出一千万？上一辈的积累，有着经验人脉高认知等~就说我们这一辈，父母除了抛怨还把低认知和不良情绪遗传给下一代，简直就是负资产。如果有人不认可，一定是从低概率看到了他想看到的！当年分了地主的钱，却没有分地主的思想，多少年之后，当年地主的后代都大概率又蛤起了。\n\
    \n△司马懿通过联姻，编织起一张豪族的巨网：他的妻母来自河内山氏，是“竹林七贤”中山涛的姑祖母；长子司马师娶的泰山羊氏，是西晋名臣羊祜的姊姊；次子司马昭娶的东海王氏，即司徒王朗之女；女婿则是出身京兆杜氏的杜预。这些姻亲戚属无一不来自世家大族，司马懿也就名正言顺地成为地方豪族的代表和社会精英的领袖。\n\
    \n△设局通常是三步走：第1步是深度研判目标的内心，把他内心里面的 一切都全部了解清楚，知道他的欲望，动机和方向。第2步就是预判目标前进的路径，知道他要去的地方，自然能够选择的路就几条，能够选择的交通工具也就几个。我们更换目标必经之路上的一些目标性的东西，导向我们所要让目标走的路径上。第\
    \ 3 步就是在终点站设置一张网，等他想回头已经回不去了。\n\n△升职加薪的两个核心，就是做更有价值的工作和做有更有价值感的人。因为公司评估的，不是你做出了多少贡献，而是在未来的一年，公司对你的价值预估。当然也有例外情况，那就是外部市场定价的上涨以及内部不可替代性。这一切用权谋学的思维就是钱永远是稀缺的，你能否拿到加薪机会取决于给你加薪的价值是否大于给别人加薪。\n\
    \n△真正的权谋家，为了保全自己，壮大自己，并不是自己跳下来和对手直接打一架，而是充分利用对手，把自己的朋友弄得多的，把敌人弄得少少的，尽可能的削弱、孤立和分化敌人，最终消灭敌人。\n\
    \n△很多时候，社会之所以对你坏，是你太弱而已。生活就是如此残酷，锦上添花的人多，雪中送炭的人少。人只会为难软弱的人，你自己不够强大的时候，没有在乎你的尊严，你的声音，你的眼泪。请记住，当你变得优秀，整个世界都会变得可爱起来。\n\
    \n△学校打造好的第 1 荞儿韭菜：想赚钱必须勤劳致富，踏踏实实干活儿，老板会好好表扬你的，看见心动的女生就要给她买礼物，天天追着她向她表白，最终能够感动她。对于老板有毛病一定要提出来，这样才能为组织好。对社会上一定要有正义感，老人摔倒了一定要扶，只要问心无愧，就行。\n\
    \n△在职场新人最讨厌的行为：第 1 个呢是不懂得价值交换，到处请教；第 2 个就是寻求平等，和上级之间没大没小。第 3 个就是，不搞团结，自以为是。\n\n\
    △强者的教育就是让孩子尽快认识到社会规则是谁来制定的，如何利用游戏规则，如何自己去驾驭规则，最终让自己变成规则的制定者。\n"
