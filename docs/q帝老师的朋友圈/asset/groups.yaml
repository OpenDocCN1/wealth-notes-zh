    半，心情也清凉了许多。


    △人活着就应该学会适应，学会接受难以接受的东西，学会欣赏曾经难以欣赏的东西，这才是积极有力的处事之道。


    △在职场遇见困难，千万不要随便跳槽，因为换个泳池，你依然不一定会游泳，在一个地方持续不断的积累，才能有所成就，但是，如果领导本人确实存在着下属难以忍受的问题，比如心胸狭窄、态度粗暴、嫉贤妒能、领导无方、腐化堕落等，下属，也没有必要委屈自己的一生，强求理解和适应，一方面下属要使形势不至于恶化，另一方面要积极行动起来，把握好某些实际加以利用，一旦条件成熟果断辞职到新的岗位上，也是一种彻底解决问题的办法。


    △下属如果确实看不惯领导的某些行为，不妨和家人或者亲密的好友谈一谈，一定不要在你的同事面前，非议领导，表达自己的不满，因为没有人能保证这些话不会传到领导耳朵中，甚至为别有用心者所篡改和利用。领导，最担心最疑虑，而且最讨厌的就是别人在私下里搞阴谋，背后搞小动作，败坏领导的声誉，阻挡领导的意图实现。背后批评领导其实是自找麻烦，你不但不能动摇领导的地位，反而会招致领导的反感，是自己先处于不利地位。所以最好的办法就是三缄其口藏而不露，尽量使自己的不满得到化解，使自己心里达到平衡。


    △很多下属对领导不满和反感，对于胸怀宽广的领导，他可能会容忍彼此在观点上的不同，甚至包括你的故意言论和种种不满，但是一旦你的工作上消极应付或者从中作梗，这就明显地和领导产生敌对行为，他一定会动用自己的权力资源想办法对付你，而斗争的性质也就决定了你必败无疑或者是必然吃亏。


    △识时务者为俊杰，这句千古名言，也是中国人的处世哲学，所谓识时务，就是学会看形势，观风向，向暴力和强权低头让步，有了这个处事哲'
  - '[PAGE 132]


    学，皇帝放个屁，也要说香，千万不能把忠于上司作为自己的座右铭，不能死心眼儿，该跳槽时就不能有丝毫犹豫，尤其是当你的上司即将倒台时，千万不能再把死马当成活马医，做无谓的牺牲。


    △坏朋友，该弃则弃。与人交往的过程中，遇到一些坏朋友是在所难免的，如果你明知道，这些人不会给你的发展有帮助，甚至会在你落难时落井下石，为你的成功制造阻力，就没有必要时刻的和他维系的关系，此时最需要做的是，鼓起勇气把它们丢掉，这不是不仁不义的表现，也不是伪君子的象征，而是为自保而采取的最明智最实际的做法。


    △权谋家什么都谨言慎行呢，因为，说出去的话，如泼出去的水，无法收回，谁也不知道哪句话会被别人利用，给自己带来不必要的麻烦，所以，在说话之前必须经过大脑，深思熟虑之后再讲。


    △现在国家经济政策的尴尬就是进退两难，继续印钱，民生扛不住。贫富差距加大。不印钱人民币升值，被老美收割。输入性通胀。现在国家主要的政策都是围绕这一点展开的。


    △天时不如地利，地利不如人和，早期看起来很有道理，其实这个要看环境，看阶段，看实力。


    △你虽可以越级上诉，可更上级领导却绝对不可能为了你这普通一兵，和一名中层干部闹翻。甚至还有一种可能，更高级领导为了掌控中层，有意在下面培养几个刺头，如此一来，你就成了人家手里的枪子。


    △在职场交际中，女人和别人握手是个大学问，一般需要展示自己的优雅矜持，因此一般都是女人先伸手，但是不能主动握男士的手，而是要伸出手等待男士握住自己的手，另外女士们在与男士握手的时候不能时间过长，否则会让人觉得过于热情。


    △所以很多骂权谋的人，是没有经历过权力的甜头，也没有受过权力的害，所以说才对权力肆无忌惮。'
