    比如道德。


    - 一个人在底层吃的苦毫无意义，要尽可能的打通自己的交际面，因为圈子越往上走能量就越大，千万不要把自己的精力都困在现在的这个阶层上，因为你身边全是打工仔的时候，你每天听的都是各种烂事和及时行乐的伪逻辑，到你身边都是中产的时候听到的都是如何增值财富和提升自己的人生智慧。所以当我们能量还不够的时候，要踏踏实实做别人的小弟，不要觉得委屈，千万不要让自尊心影响自己的这种行为。向混上进圈子逐步的提高视野，这才是一条正途。


    - 许多人痛恨贪官主要是因为自己没法贪，虽然质疑体制内的人都愚蠢透顶又尸位素餐，为此痛心疾首又愤恨不已，然而，自己又会偷偷去考编。许多人无比地痛恨国人不遵守规则，当自己被某种门槛排除在外的时候又无比的渴望能走个后门。其实，你也没有那么喜欢公平、正义和自由，你也跟其他人一样，不过是想在不公平、不自由、非正义的天平上站在更有利的那一端：在我之上，需要众生平等；在我之下，务必等级森严！


