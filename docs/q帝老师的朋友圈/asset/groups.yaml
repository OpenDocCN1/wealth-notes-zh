    △皇帝陷入繁杂的具体事物之中，能比基层官吏和专职官员更加能干吗，不可能的。反而会被他们的专业性控制。企业家和企业高管技术人员之间'
  md: '

    随着职场环境的变化而变化，才能一步步实现自己的梦想，在职场里，谁都无法做到完全的自己，老板不能，上司也不能，普通职员就更不能了，只能做善于适应的人，千万不要在乎别人的眼光，一成不变，只是理想状态，在生活中都不能实现，何况是步步凶险的职场。


    △职场年轻人的第一大坑：有自信心及主见的职场新人，初生牛犊不怕虎，敢于跟上司据理力争，坚信自己的见解是最正确的，希望上司接纳自己的建议，即使这种心态从工作角度出发。其实在领导眼里，也是一种有意抬杠，让他失去面子，丧失权威的行为，这是令上司不能忍受的，这种员工未来是会遭到打击的。


    △只有熟悉权谋思维，精通权力心思才能预判国家政策趋势，才能把握大的方向，创业事半功倍。但是不少人受到西方自由经济学的影响，远离政治，对政治充满鄙夷。其实中西体制不一样，西方是经济影响政策，而东方是政策影响经济。


    △农民意识缺钱了就要赚点快钱拢一把，而资本意识就是马上编一个更牛逼的故事，圈更多的钱，赚老百姓的钱，不如搞资本的更多更快。


    △面对几个同样能胜任的候选人，权谋家的选人标准是选择出身最差的那个，之所以这样是因为家庭环境更差的那个人，更能吃苦耐劳，更会打心眼里感激知遇之恩。更愿意接受教育熏陶和安排，因为这个人没有更多的选择。


    △所有的欺骗中，战略欺骗最可怕，也最能显示出权谋家的智慧和勇气，战略级的伪装不是头上插两颗草，而是有效的隐藏自己的意图，并让对手产生误判，乖乖的钻进自己编织的圈套中。


    △一个王朝之所以会衰败，主要原因是其收入枯竭，因为统治机器里面的所有成员都需要活着，不能保证他们的生存，也就对他们没有约束力，这样的统治阶级很快就会崩溃。所以王朝的中后期各种的焦头烂额都是围绕着财政展开的。


    △为什么一个组织作为一把手，必须亲临一线严抓意识形态，主要原因是：一个组织的崩溃，首先是共识的动摇，然后才是组织约束的丧失，所以动摇军心者必须处死，牺牲不能被质疑，思想必须警惕，意识形态必须常抓不懈。


    △选择大于努力，但是如何选择，你必须有一个清晰的价值判断，而这个清晰的价值判断，必须固化到你的潜意识中去，这就是我们的权谋价值观训练。


    △人生没有导师，关键时候，没有人把握方向和掌舵，全凭年轻时候的一腔热血，一丝冲动，一身的欲望，最终会走向歧途。


