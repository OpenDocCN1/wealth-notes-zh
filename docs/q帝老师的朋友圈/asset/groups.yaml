    100 倍，那还不如不解决。


    △办事，能不用人情的地方尽量不用人情。用人情办事，很多时候只是表面上占了便宜，如果你用人情来置换对方的付出，那么这份人情不还，关系就会失衡，这份人情要还却没有明确的价值衡量标准，这就很麻烦。所以说纯粹的交易关系看起来很冷酷，但是因为双方合作达成了一种利益共识，因此双方有什么意见看法可以直接了当的，说出来丝毫不惭及感情，这反而能够得到彼此想要的结果，另外交易结束后关系也就结束了，不会有后续人情世故需要维护，因此对个人来说更轻松。


    △普通老百姓才想研究别人想什么，想以理服人，而高层从来不考虑这个问题，只考虑让你屈服，还可能是屈辱。


    △明白怎么玩资源，明白怎么玩渠道，挣钱很轻松，靠经营关系永远比靠经营其他内容来钱快得多。


    △古代中国皇权、宦权、相权是最重要的三大力量，任何两种力量联合起来就可以击败其他一种权力，如果皇帝懂权谋，自然会在宦权和相权之间协调，有时候放放水，有时候点点火，巩固巩固自己的地位，保持权力平衡，但终究目的无非是让宦权和相权好好的，乖乖的为皇权服务，纵观历史，宦权如果一支独大，大臣的位置，不保不说，皇帝的位置甚至生命都可以受到威胁。这里面的宦权不一定都是宦官，更多的是权力身边的服务员。


    △社交的本质是价值交换，所以当别人帮助你时，一定要懂得感恩和回报，而不管对方是否在考量你的价值之后才选择帮你。因此，客观事实是对方确确实实帮了你，你也确确实实受益了，这个时候一定要给对方积极的回应，才能达到一种价值的平衡，让对方觉得帮你，帮的值。对方付出没有白费。感情不要停在心里，回应最好是及时的，给红包或者送一些小礼品。


    △我们一定要戒掉受害者思维，弱者代入，不要总去抱怨为什么别人这样对待自己，如果你的价值不够，你在周围的人看来也许就是一种负担，这样说起来很残酷，但是这就是社会真相。


    △凡风光而居台面之上者，都有其外在与内在的各种力量支撑，才得以维持及扩张自己的威势，找到对手最主要的顶梁柱，给他破坏掉或是偷梁换柱，便是还击的主要手段与内涵。来进攻你的人，大多都依托后方稳固，所以危及他的大后方，叫他后院起火，这是遏散自保的重要还击手段。


    △领导做决策其实不是漫无目的，而是有主线的，这个就是要分清楚利益共同体，然后自己永远站在利益共同体最大的一边。只有这样才能够团结大多数人，才能够让自己的权力稳定，才有机会做一些具体的事情。


