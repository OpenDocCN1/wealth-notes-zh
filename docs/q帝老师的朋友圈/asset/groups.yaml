    △许多人都热衷于做是非判断，任何是非判断都会导向一种价值观，这不是解决问题的思维方式。解决问题，更关注实现目标的有效手段，不管是哪一方采用的手段，都值得研究和学习，任何得偿所愿，都基于那些有效的手段，而不是普通的是非观。权谋主要是研究手段的有效性，抛开基于社会标准，直达目的。


    △同样都是读历史，研究历史的人是在找寻事实真相，而权谋家是为了挖掘彼此的决策逻辑和各方所达成目标行使的有效手段，这是最重大的区别。


