    △权谋家经常强调对自己的领导或上级要有20万字的研究，很多人不知道从何下手，其实呢，这20万的研究包括要研究他的身份、角色、位置、工作、兴趣、学历、环境、每天接触的资讯、每天接触的人、每天做的事、每天用的东西、经常说的话、他的文字、他的作品、他的选择、他的观念、他的思想、他的状态、他的情绪、他的性格、他的反应，当这些东西了解的越多越透彻，你就越能够影响和改变他的世界。


    △好的下级要有这样的观念：对领导作出的决定、指示和要求，要不讲条件，不讲价钱，想尽千方百计，吃尽千辛万苦，排除千难万险，也要认真贯彻执行，有条件要完成，没有条件创造条件也要完成，如果领导的命令，没有被严格执行或者没有被完成，首先你就会给领导留下执行指示不坚决的印象，其次还会给领导留下此人太无能的印象，领导有了这些印象，你很难再获得领导的好感。


    △在职场小人和权谋家不一样，小人只顾上不顾下。而权谋家上下兼顾，因为，顾上是求进之道，而顾下则兼具求进与保身两种功能。注意顾下，可以助事业有成，获得上级的赏识，而一旦事有不顺，上一级一时疏远，也可以凭借良好的群众关系，韬光养晦，以图东山再起，不至于四面楚歌，四面受敌。所以权谋家都很注意，把上得欢心，下得民心，结合起来，从而使自己立于不败之地。


    △封建官场中有句话叫做，廉耻丢尽方可做官，话虽偏激，但倘若将其放到官场规则中来，就成了真理，为官者不需要自尊，因为在上级眼中，下属的自尊太过于廉价，收起廉价的自尊，并不是要你彻底的放弃做人的原则，而是要收起清高，藏起不屑。收藏，为的是有一天卖个好价钱。


    △小人物一旦进入官场，会自觉不自觉地把自己划入某个团体或圈子中，以寻求庇护，求得安全，所谓背靠大树好乘凉是也，这种归属感，尤其是在那些处于弱势地位的小人物身上，表现的特别突出，寻求靠山，是官场小人物的本能选择。


    △完成领导的任务，一定要学会充分挖掘困难，善于向领导表露困难要求，索要资源支持可以放得大一些，比你实际想象得到的多一些，给领导一些余地，不给他造成你想要多少就给多少的想法。你把困难缩小了，领导可能给你记的功就小，给你的好处就少。


    △在一个官本位国家里，钱永远是斗不过权的。


    △单地将官员分成清官或者贪官，实际上掩盖了官场本质。官场本质是什么？说起来非常简单，那就是权力平衡。


    △人家送的如果不是钱以及极其贵重物品，你还真不能不收。你如果不收，那等于告诉所有的人，你是另类，和这个官场格格不入，所有人都会

