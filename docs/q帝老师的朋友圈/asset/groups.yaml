    △别再认为业务是跑出来的了，时代变了。以前市场空白，资源紧缺，多跑几趟，大家知道，你的产品物美价廉就买了，现在呢，信息极度对称，物资极大丰富，凭什么你多磨几趟，动动嘴皮子，我就要买你的东西呢？


    △在官场职场挨骂的人，很多时候领导其实并不讨厌他，相反却很喜欢他。这就跟自家孩子一样，说训就训，别人家的小子，你会动不动就开口训斥吗？所以挨骂的是家人，不挨骂的只是路人，就像和珅他贪污腐败，无恶不作，皇帝整天骂他骂的狗血淋头，可是就是打不倒他，奥妙就在于此。


    △作为权力和利益的集散地，职场从来没有真正的安全时期，所以无论古今中外，职场从来都是步步惊心，不管你是身在高位，还是刚刚走进职场，不管背后有靠山还是无靠山，能够真正保护自己的永远是让自己平心静气，让自己隐忍。


    △不懂得隐忍，因为上司的某个训斥就和上司对抗，即使，你是对的，也会让你失去原有的优势，堵住自己的晋升之路，而下属面前，毫无顾忌，就会被众人怀恨在心，为将来的升迁之路埋下地雷，迟早在阴沟里翻船。


    △职场的隐忍，不是让你做缩头乌龟。是在退中求进，是除去眼前的烦恼，耐心的等待时机，并且时刻筹划好自己的下一步，该怎么走，只有这样的忍耐才是有价值的，否则，忍耐就没有作为，那么就算忍耐一辈子，在职场也是毫无建树，只能是原地踏步的小职员而已。


    △其实大家都忘了一个主线，那就是自己做工作是为了什么，是不断的获取信任往上爬，而不是为了工作而工作，忘了这个方向就会陷入底层的纠纷。一定要明确自己的职场的主要矛盾是什么，那就是获得权力的信任，成为他的耳目心腹和爪牙，不断的提升自己，去把握更多的资源。


    △职场是心机和权谋的战场，遇到争斗的双方，真正的作壁上观，只是一部分人的做法，稍有心机的人都会隔岸观火，当双方发生冲突时，冷眼旁观，双方受损之后，趁火打劫，坐收渔翁之利。


    △职场权谋中，每个人都在众多的关系中博弈，当某个人受困，落马，相对隔岸观火的人，见死不救已经是好人了，因为更多的人会选择，落井下石。


    △在职场不要随便帮助那些落难的人，因为职场是讲权谋的，很容易引火烧身，即使你不喜欢争斗，但是没有人可以置身事外，不得不帮助别人的时候，一定要选择好自保。


    △为什么是成王败寇呢？因为，人们的眼里成功者很少受到指责，一旦成功，各种言论就会被合理化，并且拥有立法权，而相反，失败一方言行也是不合理，自然又失去了发言权，往往成功者，意味着拥有公共宣传，历史编撰的自由，而失败者意味着，被贬损，还失去了申辩的机会。


    △一个人在职场是不是走得顺，政绩和权谋缺一不可。权谋，可以保护

    '
