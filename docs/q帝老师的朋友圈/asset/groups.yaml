    - 现代社会是一个信息爆炸的社会，在能够轻易获得巨大信息量的同时，其实真实性可靠性却大大降低了，无数真假信息混杂在一起，构成了一个庞大的社会信息体系，而如何从中识别辨认出真假或利用确切信息抢占先机，或以虚假信息迷惑对手，将计就计。在信息社会立于不败之地，是一门很高深的学问。完美的欺骗，虚虚实实，亦真亦幻的表现，能迷惑对手，掩护自己的真实目的，完全出其不意，攻其不备。

    - 作为管理者，在竞争激烈的斗争和对抗当中掩饰自己的真实目的，迷惑和欺骗对手，这是会经常用到的策略，同时准确清晰的判断真相，也是作为管理者的一项基本素质。

    - 能屈能伸既是一种进攻策略，也是一种保全自己的方法，持强、任性、冲动、不肯屈服的姿态，只会使自己受到更大的伤害，而适当退缩，刻意回避，则能够得到保全实力的良好机会。这在人与人之间的竞争，角逐和对抗中，表现得尤为明显。

    - 任何时候我们不要越级，不仅仅是在职场，在社会上也是这样，不要越级思考太远的东西，丫鬟的命没有必要操着小姐的心。住着地下室，没有必要考虑中南海。

    - 职场上的个性定律：你可以有性格，但不能有个性；可以很专业，但不能高调；可以很强大，但万万不可表现的比别人强大。

    - 官场的核心是利益交换，没有利益就没有往来，任何人都想当主角，官场的主角说到底就是利益的最大者，破坏了这一规则，你就要被排除在圈子之外。

    - 利用上流社会赚钱，的确是一个社会中富人的主要赚钱方式，是最便捷的方式和利润最大的赚钱方式。比如一个有权力的人或者一个有名望的人，他们可以只说几句话，甚至一句话，还可以不说话，就能赚回成千上万的黄金白银，而一个卖白菜的老太婆可能十辈子也赚不回他们一分钟赚的钱。封建时代的皇帝要想赚大臣的钱，便可以找一个莫须有的罪名，如果利用文字狱等剥了他们的头，将他们身下的全部黄金和妻子儿女一并掠走，皇帝在极短的时间内将此人一生的价值积累给掠夺走。当然能有皇帝这种赚钱手段的人绝对不多，但是这种赚钱的思路一直是上流社会赚钱的不二法门——那就是利用手段掠夺，合法的掠夺。

    - 和权贵们做交易，基本上就像火中取栗。结果不外有三：高明的人，很有技术的人，能够吃到栗子而不被火烧；其次是吃到了栗子却被火伤；再次是既吃不到栗子又被火烧伤。第1种人当然是最好的，占据便宜不吃亏，第2种虽说有得有失，但毕竟占到了便宜，受点儿伤，有的人也认为无所谓，第3种却完全不划算，便宜没占着浑身吃亏，鸡飞蛋打老本儿都赔上了。

    - 诽谤形成的原因，综合起来不过是这样几点，一是由于仇恨他人的成就或者为人，二是嫉妒他人的成功，惧怕他人超过自己的成就，无论是圣人，伟人还是凡人，常人都有可能受到诽谤。

    - 关键是你你要给对手，一种不设底线的斗争气势，不择手段他才会产生恐惧，但是实际斗争中还是要合理合法的。气势上震慑，手段上合规，这才是斗争的要领。

    - 客观认识自己的筹码；客观认识自己的阶段，客观认识未来的发展方向，这才是最核心的，盲目的自大和盲目的自卑都是错误的。其实为什么大家学了权谋之后，心情宁静了很多，也不再浮躁了，就是客观认识了自己。

    - 这世上没有绝对的公平，法则从来都是强者制定的，不要为不公而抱怨，你要想办法做不公的受益者而不是不公的受害者！

    - 一个人想取得成功必须学会斗争，这需要更多的勇气和智慧，这就是我们通常最熟悉的话“敢于斗争，善于斗争“，也就是说我们不仅仅要斗争的胆略，更要有斗争的艺术，如果只靠匹夫之勇，左冲右突，最后的结果很可能是有悖初衷。

    - 对人才的误判和误用，其致命的后果总会显示出来，把不是人才的小人，当成知己授以重权，常常是自毁的开始。那些没有真本事的人，从来不承认自己的无能，他们善用卑劣的手段，打击有才能者，而国家危难与不顾，统治者没有一个是自愿毁灭的。可他们极端自私和喜欢谗言却少有改变，这样也就决定了，他们在用人上必有缺失，是无力自拔的。

    - 在对局的斗争中，你所面临的往往不止一个对手，而是方方面面的，形形色色的对手，此时最坏的局面就是各方敌人都团结起来对付你一个，而最好的局面就是他们单个为战，这时，你就有了瓦解他们，然后利用敌人打击敌人的条件了。

    - 大家要记住这个原理，如果职场你不幸遭遇挫折，那么最好的办法是拉你的竞争对手一起下水，不然呢，不然你就可能翻不了盘了。

    - 吃掉对手有两种方法，一种是吞食，也就一口吃掉，好处是快速，坏处是，对手会激烈反抗，成本比较大。还有一种是蚕食，缺点是比较缓慢，好处是对手不易察觉成本就较低，此外可以先给对方一些甜头，使其入局，等他感觉不妙时，已成骑虎之势，犹如温水煮青蛙。

    - 36 计里有，一条叫做上屋抽梯，意思是诱敌深入，才能把敌人置于有进无退的绝境，其关键的招数是搭梯子，因为你要诱敌上屋，就得提供上屋的便利工具，并且你还想断敌人的后路，抽梯子。没有搭梯子的前提，哪里谈得上抽梯子的后话，这里梯子是，诱使敌人登梯上屋的利益驱动因素，也就是诱饵。搭梯子，首先要研究梯子的材料，既用什么做诱饵，诱饵的分量要适当，少了不起眼，吊不起敌人的胃口。多
    了，吞咽不方便，会卡喉咙。

    - 太完美的东西会被认为是假的，所以在与人打交道的时候，如果时时刻刻表现出滴水不漏，反倒让人心存戒心，有意无意的露一些破绽，露 出一些小的缺点，更能使人感到信赖，可以亲近，从而放松对你的警惕。

    - 在对局的时候往往是你死我活的利益之争，对手的成功，也就是你的失败，没有调和的余地，所以制止对手的成功特别重要。


    人的心理就是如此，我赢不了你也别想赢。明的招人谴责，那就来暗的，于是扯后腿拆后台，关键时候来搅局。

    - 有道是真作假时假亦真；假作真时真亦假。这样忽真忽假的做法，不失为迷惑对手的战术，在做局和对局的过程中，是完全可以拿来用的，当对手认为你的真的时候，你却是假的，当你是假的时候，他却当成是真的，这样扑朔迷离的局，能够把对手绕晕，自然他就任你摆布了。

    - 在对局的斗争中，你所面临的往往不止一个对手，而是方方面面的，形形色色的对手，此时最坏的局面就是各方敌人都团结起来对付你一个，而最好的局面就是他们单个为战，这时，你就有了瓦解他们，然后利用敌人打击敌人的条件了。

    - 要想取得成功，还就得捡着软的捏，其实这是很自然的，并非什么软怕硬，在面临诸多对手时就应该选出薄弱的一环作为突破口，进而打开局面，这样既可以出师告捷，又可以壮大实力，储备经验，以图将来。

    '
