  - '[PAGE 0]


    # Q帝老师的朋友圈


    qbeter 著


    ![](img/e7670f2c13b628c8e51046aae1f030f8_0_0.png)'
  - '[PAGE 1]


    △人都是孤独的，但孤独的意味不一样。帝王的孤独是一种无法相信的孤独，而底层的孤独是没人搭理的孤独。


    △为什么曹操不杀关羽？关键是他手里面很多大将都是投降过来的，如果杀了关羽，人人自危。


    △人最重要的就是知道自己要什么，如何得到它，如何排除掉身边的诱惑和干扰。


    △一个真正的成功者，很少在细枝末节浪费自己的时间和思考精力，所以无论从思维到语言会越加简练和深刻。


    △政治和气候一样，季节变换了，你能够感知到，但没人通知你。


    △专业和不专业核心的就在于特殊问题的处理，因为专业知识的大路货谁都会。只有特殊问题，出现难题才能展示出一个个人专业的功底。


    △权谋不是一招半式，他是发现对手漏洞，一连套的组合拳，有各种意外情况，就有各种应对手段，而不是单一的直线路径。


    △其实我们学习权谋最主要不是要全盘去模仿，而是要学习高人的思维方式，为我所用，学习高手的思考角度、思考方向、行为模式这才是我们要关注的点。


    △等你的企业到一定地步的时候，你就知道你的企业不单是你的，也是社会的，也是政府的。看看 x 帆汽车，死的不能再死了，但是政府还是要救，还不能让他死。一个企业只要活着就要纳税，当地政府可以用银行的钱去救你，但不能把银行的钱当税收。这段话前面大家都能理解，但最后一句，不是一般人能够明白。


    △用人上必须神秘莫测，但是下命令却不能朝令夕改。


    △控制自己的情绪有三个层面，第 1 个那就是需要自己，不断的克制忍让。第 2 个层面，能够让自己不产生这种情绪。第 3 个层面就是不为任何情绪所动，收发自如，俯视一切众生。'
  - '[PAGE 2]


    △收割其实是分三个层面的，底层是色，中层是钱，上层是权。底层的屌丝都是被色骗的钱。中产阶级都是被投资卷走。高层都是被权力所收割，一把搂光。


    △决定我们日后成就的，不是一开始工资有多少，而是工作的平台、资源、好老板，失败的经验、发展的机会、眼界、甚至人脉圈，这些才是一份工作，对人未来的价值。


    △小人在维护权力稳定方面有着巨大的作用。


    △每个人都会遇见职场这种困惑，所以说只有不断的深入研究不断的学习，才能让自己过得更明白，更安全。


    △所谓远大理想，就是永远在如履薄冰的想着，如何的才能活下去。动不动喊理想和抱负，想改变世界的年轻人就像到处显摆一样傻，有些事自己知道就行了。


    △功劳都是之前的成绩，关键还是看后面的好处，提拔不提拔不在看之前，而是看以后能不能拓展领导的权力，增加领导的利益。


    △在中国搞经济必须懂政治，也就是必须知道分蛋糕的学问。让自己站在食物链的最顶端，这才是我们要攀爬的阶层。


    △很多人问我李小龙女儿状告真功夫侵权的新闻，我稍微研究了一下，法律方面：李小龙女儿不可能告的赢。商标已合法注册，就不存在侵权问题。商标正式注册前，都会有公告期，有异议要提出出来。如果认为注册商标侵权，可以向商标局申诉或向法院起诉要求撤销。没撤销之前，人家合法使用自己的注册商标，哪来的侵权？侵的什么权？肖像权？别逗了，那是李小龙的照片吗？既然商标通过注册，所谓侵权，只能是肖像权，但是肖像权也打不赢，首先，肖像权权力主体只能是自然人，用公司名义去告就不对。第二，肖像权对象是特定公民，而李小龙是美国人。第三，肖像权不能被继承，女儿来了也没用。四，争议核心是图片对比，而提供的照片'
  - '[PAGE 3]


    都是剧照。。也就是影视作品中虚拟的人物，而商标又是绘画，他说他画的是陈真不是李小龙你咬他?这本来就有很大争议,况且也不是本人提起起诉。权谋方面:外国人来中国告中国企业-
    -, 一边是纳税大户，一边是外国人，用脚趾都能想到结果，只要企业有说法，本人来了也告不赢，乔丹就是好例子，商标用的篮球运动员的剪影，名字是他译名，又如何？

    △年轻的时候认为：要么孤独，要么庸俗。不惑之年才知道，孤独不是清高是感受，庸俗不是选择是归宿，中年的我们都在庸俗着也孤独着。

    △普通人把高档生活品质局限在商品上，比如说好衣服好包包好车好房，而高层的人把生活品质放在了生活方式上，比如说爬山，比如说减肥，比如说吃最健康的食品。

    △佛曰不可说，其根本原因就是一旦说出来，就会被人产生歧义或者断章取义。一篇文章不可能解决所有问题，需要很多篇文章来解决，但有些人呢，就只看一篇文章，然后发表自己一大堆意见，然后说这篇文章是错的。

    △结论不是我们所追求的，大家一定要记住，这些狗屁历史得出的结论有啥用呢？我们要的是思维训练的过程，拓展视野的过程，利害计算的过程。

    △对于权力的对抗，任何时候都不要有，如果真的想做，也永远不要公开来做，有句话说的 spanned 明枪易躲，暗箭难防。职场没有人给你玩明的，都是背后下手，然后找个公开合适的理由而已。权力都是玩的暗算，成本低，效率高，风险小。

    △研究权谋的不是一群自私自利之徒，而是洞察社会规律，敏感先机，让自己的利益最大化，而不是最多话。最大化的过程也是兼顾其他利益的过程，一个协调平衡的过程。

    △学习权谋，一开始大家认为手段比较重要，但是学习一段时间之后就'
  - '[PAGE 4]


    会明白，真正重要的是自己的价值观构建，完善自己的底层逻辑，对社会清晰的认知。


    △每个人容易活在自己的世界里。不同的是，认知越高的人，看事情就越客观，他们遵从本质和规律办事，负责操控世界的运转。而认知越低的人，看事情越主观，容易被表象迷惑，越容易有偏见，喜欢盲从，只能被操控。


    △任何造富的本质都是不合法或合法的取得不对等交易，完成财富转移。


    △古代教育的作用大多数在于愚民，就是让你不断的情绪化变成狗。活着就是要看家，看好家自然得骨头，看谁得的骨头多，我比你多我骄傲！当然骨头不能多给，给多了管够就会开始思考为何要看家，开始求“道”了！


    △凡是下了班就回家，从不出来应酬的男人，可以这么说，身边逐渐就没有朋友，没有朋友就没有信息，没有信息就没有资源流动，没有资源流动，何来挣到钱？


    △行业萎缩期会面临各种危机，这些危机就像病毒一样会逐渐侵蚀你的机体，让你耗尽当年之前所有的积累，而砸盘玩法是让大家还不知道真相之前全部透支所有东西，立刻死亡。自己不再流血，而且有大量的营养输入。


    △真正考虑利益考虑现实，我们才能过得越来越明白，越来越轻松自如，那些把所有的考虑放在虚无的东西之上，只能让自己更加焦虑


    △不懂权谋，权力只能发挥出一半的能量。


    △很多人以为自己好好工作就行了，其实摸不到方向就会南辕北辙。


    △一个人眼里如果只有事，而不是考虑这个事带来的权力变动和政治影响，这种人就不会有前途。


    △事不至大，无以惊人；案不及众，功之匪显。领导日理万机，事情扑'
  - '[PAGE 5]


    灭在萌芽之中，有功劳也是很小；但是养寇自重形成燎原之势，没有能力扑灭就是替罪羔羊，无能的表现。既要能挑事，又得能灭火，一切尽在掌握之中，才是首辅的材料，借机打击异己，扩充力量。君子不党，其祸无援，真的不党事事掣肘，真的就什么也办不成。做事的不一定能干政治，技术官僚。能做官的不一定能做实事。政治是赶牛看路两不误，提刀给糖两手抓。


    △领导对你个人的情绪、对错，毫不关心，也没有兴趣关心，只会考虑，你对我有没有用，你会不会给我添麻烦，你会不会明示或是影射对我不满。


    △权谋家从来就是把问题解决在萌芽状态，这样的成本最低，效果最好。但是如果无法在萌芽状态解决，大家利益对立，这时候，最佳的策略还是不要公开撕破脸，能够私下斗争，就私下斗争，能够延缓斗争，就延缓斗争。但是大家已经成了明着的对手，政敌了，那就没有退路，拿出鱼死网破的气势，让对手有所忌惮，这才是王道，如果不敢斗争，就会被人当软柿子捏。你不敢斗，那些背后帮你的人都不想帮你。只有直接亮剑，大家觉得你还有当枪使的价值，才没有人会抛弃你。


    △以后女人越来越贵，而剩女越来越多，男人支付不起价格，女人也不会贱卖。这就是两性关系上的经济危机。


    △规则最大的漏洞是人性。


    △「什么是政治」阎锡山问名士慕僚赵承纾：“什么叫政治？”赵引经据典，滔滔不绝。阎笑：“没那么复杂！所谓政治，就是让对手下来，咱们上去！” 阎又问赵：“什么叫宣传？”赵又洋洋洒洒，说古论今。阎更加不屑：“没那么复杂！所谓宣传，就是让大家都认为咱们好，别人不好！”


    △我们几十年上学就是为了找一个好的工作，而我们只需要拿出几个月时间好好研究领导，就可以改变一个决定我们命运的人，为什么我们不去'
  - '[PAGE 6]


    做呢？这就是我们学习权谋的意义。


    △弱肉强食的状态下，吃饱了的猛兽只想着赶紧找个地儿打盹眯一觉，哪管那么多事？只有被咬的血肉模糊的失败者才会对弱肉强食有切肤之痛。成功者不说但都信奉社会达尔文主义…


    △每天考虑三个问题，会让你不浮躁，今天的兜里的钱多了吗？脑子里的智慧增加了吗？身上的肉减去一斤了吗？


    △对于好人坏人，这种分类意义不大，我们讲究的持术不持信，他是奉承还是搞事，关键还是看对我们有好处，还是没好处。有好处，不管他说啥，接受。没好处，不管他说啥，干他。人是复杂善变的，也是伪装性极强的。我们如果识别不出现象，我们就要把自己放在最安全的地方。这样很好玩，就像喂狗一样，并不需要考虑狗叫的时候为什么，叫的好听不好听。听话就喂骨头，不听话就换鞭子。


    △律师界有句格言：“当事实对你有利时，多强调事实；当法律对你有利时，多强调法律；当事实和法律都对你不利时，就敲桌子把事情搅浑。”


    △在一个封闭环境里，所谓精英只是得利人群，而真正能改变环境的只有两个因素，一是外部高压，二是底层大众。。不过未来100年没有这些因素。


    △做下属一定要听得懂，领导的话外音和暗示语，如果领导对某些事项不表态或者态度模糊，说明领导对决策不满或有意见。但是就有些人呢，傻傻的，蠢蠢的，追着领导要求明确。


    △响应是个个人价值的最佳体现，当上司发出倡议或者寻求工作支援的时候，在第一时间做出积极响应是必须的事情，因为这关系到你的价值体现，更关系到你在领导眼里的形象，以及你对他命令的顺从程度。


    △改变价值观，积累资源，动用手段，这可以说是任何事业成功的不二'
  - '[PAGE 7]


    法门。


    △一个人的价值观决定了自己的选择，自己的选择决定了自己的道路，选择的道路决定自己的命运。


    △说服的基础是什么？第一步，正义。所以把这个项目合法化才是关键。告诉你这个项目国家支持，他们的做法让贫穷的人摆脱困境。


    第二步：打破认知。贬低他当前的生活和工作，做生意就是大环境不好，容易赔钱。打工的就是永远没头，没有事业。又讲他们这里有多少牛人。通过塑造身份，让你多见几个牛人，把你的身份和认知彻底碾压。


    第三步：才是画大饼。大饼要有细节。你投入 2888，未来一两年，你开什么车，具体的品牌和型号，住什么样子的房子，连浴缸大小，你洗澡的样子都能描述出来。把你心里最理想的样子都描述出来。用语言描述出画面，让你不断的憧憬。对了还有一个关键，不只是别人讲，让你自己讲自己的理想。自己讲，自己就把自己说服了。


    不是只看书就可以，要实战，营销和传销还有微商是一样的思路。


    △和有些人谈几句话就知道他的价值观是什么，就能猜到他这个人有没有前途。


    △不是你有错就要有罪，而是你权力不信任你必须让你出来背锅。


    △无论是好人还是坏人，从权力位置上，下来之后，如果势力不在，都会被得到清算。因为本质上权力就是一种伤害权利，都在会无形中伤害很多人，当你失去这种伤害权的话，都会得到报复。


    △真正能够做大事的人是能够超越一个所谓的 “我有什么，我就干什么的” 这样的一种狭隘的小农思想。而是 “用天底下的人，天底下的钱，为天底下人做事”，当然自己参与其中，这样的
    一种心态。这个心态的背后 是什么？其实就是权谋网常说的 “无内无外“ 的心态，以其无私而成其私。核心秘法就是怎么样突破你已有的这个东西，从你没有的东西里面'
  - '[PAGE 8]


    创造出你有的东西。


    △一个人只有每天不断的提升自己的价值，让自己变得更加值钱，这就是我们说的技术立身，每天不断的学习权谋来融通各种社会关系，让别人认可自己的价值，这就是，权谋求发展。


    △职场的事儿，别把小事儿太当回事儿，如果什么事都当成事，那么就陷入繁琐，也不能不当回事儿，因为细节决定成败。这里面就要抓住核心人物、核心问题、核心关系和核心事件。


    △举报很多时候跟证据没有关系，跟自己心情有关系，跟利益有关系，跟对手在弱势的时候有关系。


    △罗素说，“人生下来的时候只是无知，但并不愚蠢，愚蠢是后来的教育造成的。”“一个人之所以脑子混乱，是因为被错误的家庭教育、胡乱的学校教育以及商业化的社会教育所打造成的。


    △陕西军阀陈树藩说，“我用人看三点，第一要有牛马精神；第二要有土匪心肠；第三要有妓女态度。”“话糙理不糙。听话，有执行力，而且态度比较好。这就是权谋家要求下属的三点素质。


    △一个提意见的人，首先要懂得3点。首先你是否理解这种现象所形成的原因。其次，当众提意见形成是一种什么样的形象？最后为什么别人都不提？提意见的人如果不明白这3点，要么被人当枪使，要么让人觉得很幼稚，要么当众挑战权力。


    △阴谋算计并不是权谋的核心，权谋的核心是洞悉人性心理，熟悉权力规律，纯熟权术手法，该算计的时候算计，该斗争的时候斗争，该合作的时候合作。


    △李鸿章晚年有一副对联，刚刚看到，写的真好，这也就一个人想达到的理想状态：享清福不在为官，只要囊有钱，仓有米，腹有诗书，便是山中宰相；祈寿年无须服药，但愿身无病，心无忧，门无债主，可为地上'
  - '[PAGE 9]


    神仙。


    △任何一个团队首先就要解决三大问题：谁最后说了算的问题。、思想价值观统一的问题、矛盾协调的问题。如果这三大问题解决不了，这个团队就是一盘散沙。


    △不要把自己的精力，浪费在那些不重要的人和事上，和他们斗智斗勇，只能让自己没有时间去专注自身的价值提升。有句话说的好，当你穷的时候破事就逆流成河，当你弱的时候坏人就漫山遍野。


    △我不鄙视任何人，社会分工不同。权谋不会改变所有人，因为这个社会注定有很多人早上起来去扫大街，去送外卖。


    △权谋，要知其然，更要知其所以然。如果仅限于表面的知道，那么很容易出错，没有任何指导意义。


    △很多人不理解又团结又斗争，到底是怎么回事儿，其实呢，在权谋角度而言，就是圈子内怎么吵都行，但是一旦出了圈儿，就会一致对外。我们自己人骂可以，我们不允许外人来骂，这就是中国人的人性。


    △怎么说呢，斗争是一种形式，但目的是利益，利益越大的地方斗争就越多，斗争越多，那么权谋的需求就越大。


    △对你的仇人最大的报复不是踩在脚下，而是让他们仰望。


    △关于上善若水，我提出两个新观点，大家没说过的。一个是水火无情，当老大的应该像水一样无情，不过这种无情比火要柔顺一点。另一个呢，面对困难绕着走，绕过去。面对巨大的困难，水滴石穿。


    △职场抱怨就是慢性自杀。


