    △当一个下属功劳很大的时候，忽然隐退或是休息，一般解释只有两种，要么是张良柔顺自保，要么是韩信讨价还价，但99%的人都是讨价还价。其意图就是告知自己的领导，让他坚量下属的价值，需要更多的表示，主要是下属对目前的待遇不满。


