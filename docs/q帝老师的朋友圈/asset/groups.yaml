    △把领导在意的重点任务处理好，帮领导创造业绩，帮领导创造价值。这样就能获得领导认可，接着就要努力保持跟领导的互动，多跟领导接触，多主动请示汇报，以此才能获得更多的资源跟机会。这是职场正确路径。


    △婆媳关系一直是男人們最难处理的事情。因为这是两个女人为了争夺一个男人，而发动的地盘争夺战。有位名人传授过他的经验，非常的有道理：作为儿媳妇，你得把婆婆当成老板，你在单位怎么糊弄老板，就怎么哄老太太，她说什么是对的，但是听不听就是你自己的事儿，那么婆婆呢，就得把儿媳当学生，有错得说，但是不能抬手就打，因为不是你亲生的。


    △领导一般不会很在乎过程，只在乎结果，但是作为下属，一定要帮他们完善程序，不要让领导后续经不起审计跟纪检。


    △每事三思，思危，思退，思变。居安思危，知止思退，穷则思变，谋定而后动。


    △在一个公司里，每个新闻出来，就要分析，会影响谁，伤害谁。每一个决策下来，你都要分析这个决策符合了谁的利益，伤害了谁的利益。符'
  - '[PAGE 252]


    合利益的那几方一定会形成一个利益共同体，这样才能看到背后的派系和势力。


    △高手只需要你的两大价值，能力价值和立场价值。哪怕你的能力不是那么强，但是你跟他是绝对的一条心。就算你没有能力，也没有钱，他也会愿意带着你玩。


    △只要你能够给别人带来利益，即使你性格不好，脾气暴躁，别人照样能够忍受得了，如果你不能给他带来他想要的利益，你即使温顺的像只猫，他都会嫌你掉毛。


    △不要老是浪费时间在维护感情上，感情的核心就不是感情，而是你的价值。你价值高了，维护感情的行为就要对方来做了。


    △在有层次的人面前，绝大多数的人都会展现出透明的样子，心思总能被对方一眼看穿，拥有层次的人往往端坐云台，静观其变，他们看得清一切，却很少主动插手某件事。


    △关于道歉的三点经验，第一是一旦对别人造成伤害，首先决定了不是要不要道歉，而是何时道歉。其次不要在风口浪尖上立刻道歉，只有等对方准备好接受道歉时，才需要采取行动。最后是如果错误过于严重，则需要多次道歉。


    △职位的节节攀升，带来名利富贵的同时，也会带来更大的危险的挑战，会有一个个看不见或看得见的陷阱等着你，能够成功躲避灾祸，最终全身而退，需要时刻保持清醒的头脑，必须要搞明白，什么时候该进，什么时候该退，什么话该说，什么话不该说，什么人该接近，什么人该远离。


    △穷在闹市无人问，富在深山有远亲。每个人心中都有一杆秤，衡量一个个人是否值得深入交往。朋友有多少，在于你的“利用价值”大小。成年人的世界，利益未必大于感情，但感情往来却与利益共生。社交的本质是互惠互利，你若有用，必定有人前呼后拥，你若无用，到哪都有人横眉冷'
