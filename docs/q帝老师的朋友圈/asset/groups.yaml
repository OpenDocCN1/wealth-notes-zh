    △不管一个人有多大的能力，当你只是弱者的时候，最佳的办法是投降，为荣誉而战，只能<|start|>羽而归，投降的好处是可以保全自己，让自己成长和强大，当对方处于弱势之后就可以去征服他，对于弱者来说，投降也是获得权力的最佳方式。


    △一个人过于刚强，很快就会招来别人的打击和报复，不懂得委曲求全，当自己是只鸡蛋的时候，去和石头碰，自然得到的结果就是彻底的失败。先生存，后发展，只有懂委曲求全，才能够在险境中求生，也只有求生之后，才能够刚柔并济，躲过祸端。


    △有权力不为自己谋取利，自己还当官干什么。所以更多的领导，更多的是利用上述明规则，来优亲厚友，谁对自己有利就照顾谁：自己的人，人气旺，就搞投票；自己人功劳大，就按功劳分；自己人辈分大，就按资排辈；自己人刚进来，啥都没有，就利益均沾；怎么对自己人有利，就玩什么方案。


