    目。你想要融入一个圈子，就要有对等的价值。成年人的友情，一半利益，一半感情。提升自身价值，才能拥有更多人际交往的砝码。


    △世界上没有对和错的争论，都是自认为对的争论。小孩子才争对错，成年人只看利弊。凡事非要争个明白，求个对错，不过是无意义的消耗。与人相处，角度不同，难分对错。


    △坑过你的人，90%会坑你第二次。欺骗只有零次和无数次，对于那些欺骗过你的人，一定要远离。做人不要太老实，也不要轻易相信别人。有个词，叫杀熟。坑人这行当，对熟人最好使。人熟了就会放松警惕，就容易信任，而且很多人会在一个地方反复跌倒。


    △底层老百姓的孩子，最大的劣势，其实并不是父辈的原始积累的差距，而是在成长的路上没有人引领，往往会错过很多好的机会，同时也不知道朝哪个方向努力。人的经验和智慧大都是靠自己来获取，吃一堑长一智获得的，付出了很多的代价，很多时候，犯一次错，一辈子爬不起来。


    △成年人的世界，没有回复就是拒绝，我们要在沉默的语言中悟到对方的态度。切莫一味多情，高估自己在对方心目中的位置。如果做不到让别人喜欢，也别一直打扰，让人心生厌烦。不合拍的人，不必勉强，转身离开，不搞破那层窗户纸，给彼此留足体面。


    △我们去向别人道歉的时候，应该估算出道歉所需的最大延时量，也就是在承认并解释自己过错之前，他应该等待的时间长度，这听起来与我们的直觉相悖，但是我们应该尽量延长自己的道歉过程，直到对方做好了倾听的准备，道歉，其实就像在抖包袱，只不过他没有那么有趣。


    △讨厌一个人最有水平的处理方式就是：忽略他，把有限的精力用在更重要的事情上。远离他，眼不见心不烦，与其纠缠不休，不如敬而远之，保全自己。在人生的旅途中，许许多人都是过客，道不同不必同行。


