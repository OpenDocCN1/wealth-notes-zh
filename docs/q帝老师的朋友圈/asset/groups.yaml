    △走向社会之后，其实你没得选，你要么当韭菜，要么割韭菜；要么加入收割，要么被人收割。没有第 3 种选项！


    △除了极少天选之子，没有人是第 1 次创业就成功的，所以说，当准备创业的时候，不要抱着太大的希望，想一次成功基本不太现实，很多老板都是创了好多次业，积累到了足够的经验，然后在一个项目上飞到集中爆发成功的。


    △别人是跟你合作，还是要撕破脸，主要是看收益。跟你和平共处，收益大，就跟你合作；跟你撕破脸，收益大，就撕破脸。


    △这是一个狂奔的时代，他以胜负论英雄，不管你狂奔的姿势好不好，你都要争取，不被这个时代抛弃，否则没有人会记住你的高尚，因为世人不知道你存在过。《突围》的台词说的好啊，这就是权谋里面常说的吃相问题，只有吃饱了才能兼顾到吃相。不然饿死了，谁知道你是？再优雅的姿势有什么用？


    △在这个复杂多变的社会中，要想最大化体现自己的人生价值，就要勤于思考，把能看到的，都要问个为什么，把思考变成习惯，因为你所接触的各种复杂的信息，有很多的假象，有很多的带节奏，有很多的夹带私货，所以说我们必须静下来多问几个为什么，才能让自己活得更加通透。


    △所谓的深刻检讨，就是自己扇自己嘴巴子，挖根子，查动机，把一桶桶脏水往自己身上泼。


    △中年人最忌讳的就是忽然下岗失业，然后用自己的积蓄，盲目创业投资，基本上三五年之内，一切都没有了，人生陷入最低潮。


    △在当下想办成一件事，如果没有熟人，就只能靠自己努力，但是如果和你竞争的人有了熟人，你的努力就会大打折扣，这不是危言耸听，而是中国人切实的处事原则和办事规律，人际关系就像一种资源，而它的宝贵程度绝不亚于石油和矿产，人际关系不但再生能力超强，而且它的繁殖是呈几何倍数增长的。因此中国人都以自己的朋友多而自豪。


    △中国人最喜欢的就是树立道德标杆，也就是苛求别人必须接近完美，尤其是名人，必须在道德、能力、行为等方面尽善尽美，只要出现一点点和想象的不一样，大家就会群起而攻之，道德舆论立刻就会铺天盖地攻击他。


    △在职场是不谈感情的，如果你和同事交朋友就会很危险，他们表面上看起来是，那么的善意，那么的富有诚意，对你那么关心，你可能感动的把一切都告诉他，而一旦你和他利益发生冲突，他就会立即狠狠踩你一脚，你只能处处小心。


    △如果被领导利用了，然后大吵大闹，以为就可以让领导就范，其实啊，除非事关重大，他是不会公开向你道歉并赔偿的，作为上司他当然更注意自己的名誉，他的权威，如果你大吵大闹，公开宣扬上司的不是，即使他当面不好发作，背后也不会放过你，接下来不会有好日子过。


    △谁能煽动别人的非理性消费，谁就掌握了时代的趋势


    △这个圈子只要是名利场，都是江湖。一旦过去之后，都是会留下各种传说。为什么对历史我们读起来，解读的时候没有什么敬畏感，分析推理出各种可能？原因就是，哪有什么真相。


    △所谓阴谋论都是把所有东西当成设计的结果，而事实上权谋讲究的是大概率，都是顺势而为借机安排的，因为没有人拥有那么强的算力。


    △什么叫做不同不相为谋。


    王道：不听话干掉你。


    霸道：听话也要干掉你。


    天道：用因果关系干掉你。


    阴谋：面带微笑突然干掉你。


    阳谋：明确告知要干掉你。


    权谋：悄悄的干掉你。


    △所谓团结人，其实就是凝聚共识和分配利益，但是首先是分配利益，利益又分为两种，一个是公共利益，一个是私人利益，公共利益是用来做事的，私人利益是用来协作的。


    △每一个阶段做每个阶段需要做的事情，跨越和落后都不行。避免最坏的结果，是决策的第一出发点。


    △权谋家对资源的识别主要是依赖这三种能力，知识的结构、洞察力以及坚定不移的决心。如果没有判断力，往往会走一步看一步，让你看清楚以后你的资源也就消耗的差不多了，已经无力回天。如果看懂了却无法说服身边的人，就会把所有的精力浪费在协调和沟通之中，从而丧失了机遇。


    △一个组织做大之后，作为老板就必须学会分权，那种一竿子插到底的方式，已经无法管理这个团队，如果强行这么做的话，你作为老板会发现整个组织都在等待你的命令，整个组织都会把最后的责任推到你身上，你会感到很累，而且执行效果特别差越来越差。这时就必须筛选出信任的心腹，把权力分给他们。这时候权谋的作用就会越来越大，不懂权谋就无法完成驾驭，自己会被架空。


    △权力是最缺乏安全感的，所以说领导在和下属互动中最关注小事，在一点一点积累信任，从而能够保证内心的的安全感和获得确定性。


    △没有人替你的人生方向负责，如果培养你，你的方向就是螺丝钉。职场对员工都是缺陷养，让你忘记了自己的成长，而专注于技术。


    △因为你往前走，你会越来越舒服，这就是自己的行为惯性，在自己的舒适区，但是你往上爬，每一层都有不同的东西，都需要不同的技术，会让自己感觉特别的不舒服，每天都在变。


    △每一个上司都会遇到不便出手解决的事情，当他愿意把这些事情委派给你做时，说明对你的能力有了认可，有了相当的信任度，一个真正的职场高手在遇到上司派给的私事时，从不会推脱，反而会加倍用心完成，为上司做一件私事，效果抵得上给公司做
    10 件公务。


    △所谓的生存能力，就是在任何环境中都能适应并作出恰当的反应，在职场中，也应该有很强的适应生存能力，即使心怀大志，但只有先存活下

    '
