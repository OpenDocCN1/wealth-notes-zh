    △谁有权就跟谁，谁职务高就跟谁，谁的话项用就跟谁，在职场记住这个顺序。


    △机关的具体工作非常多，这些工作不一定都是领导所关心的。领导最关心的是关系到全局利益，比较急，比较难，比较重的任务。如果我们能够以敏锐的观察力，理解一个时期内领导工作思路，以自己最大的才智和干劲把领导目前最关心的事办好，那么无论在业绩上，还是在上下级关系上，都能收到事半功倍的效果。


    △不跪舔，不拍马，不送礼的人能上位吗？当然有这种机会了，只不过是不多见而已。在一些派系斗争严重的单位，双方争夺某个职位，僵持不下的情况下，谁都不想对方的人物上台，也往往会推出一个与双方都无利害冲突，而且能够被双方都接受的人，以平息双方的争执，免得在斗争中两败俱伤。


    △其实大家在底层都有一个误区，就是觉得斗争这个东西不常见，其实事实上呢，越往上走，利益越多，越复杂的地方，斗争就越残酷，手段就越阴暗，联合的人就越复杂。


    △用某个核心人物的意外事件，来扭转政治意图和政治立场，这也是国际政治的常用手法，因为权力忽然间去改变立场的话是啪啪打脸的，失信民众的，但又必须缓和关系，只能用这种意外方式。这就是围棋里常用的手法，弃子争先。


    △若想在政治上立于不败之地，则需精悉小题大做，借题发挥之策略，运用得当与敌是矛，与己是盾。美国这一次在冬奥会参加不参加的这个事上，就是用的这个权谋套路。


    △为什么在职场，最最重要就是取得领导的信任，因为这样的话有极强的号召力，可以假托王命，狐假虎威，借权行事，可以做到自己原先做不成的事，这就是取得领导信任的核心魅力所在。


    △在工作中要尽力收起自己的锋芒，做一个和善的人，单位不是家里，不会有人惯着你的坏脾气。因为哪怕只有一点问题，都会被人拿来放大，上纲上线的做文章，体制内又不能随便跳槽，上个班每天要承受身体上和精神上的双重折磨，根本没有幸福感可言。


    △在职场上不要随便，把自己的心事诉说给别人听，因为这些心事带有危险性和机密性：例如你在工作上承担的压力与牢骚，你对某人的不满与批评，让你爽爽的清楚这些心事时，有可能他是被人拿来当成修理你的武器，最后你是怎么死的，可能你连自己都不知道。因为你目前的好朋友未必也是你未来的好朋友，你这一点必须了解。


    △人是社会关系的总和，所以说核心是社会关系，然后是总和，不然懂运作关系的，做人都做不明白。


    △无论人还是组织技巧成熟之后，到了最后的竞争比拼的就是宏观决策，对未来趋势和方向的把握。


    △权谋是一种思维训练和方法，让你可以在有限的资源下做出最高效率最高程度的变现，并不是说你可以凭空得到很多东西。


    △今天一个朋友问我，你觉得诸子百家和你的权谋有啥区别和联系，我说他们都是面条，面包、油条等，而权谋是面粉。


    △在职场并不是一个强调公平的地方，因为在里面是赤裸裸的竞争，实力强者制定规则，实力弱者必须选择闭嘴。


    △有些人讨厌职场的复杂关系，于是撸钱借钱出去独立创业，以为可以回避复杂的关系，其实，当老板更需要当孙子，更需要在社会上跪舔各种关系，你在职场上只是跪舔一个或是几个就够了，但是你自己独立创业，需要跪舔的人更多。不会处理人际关系，换个赛道你依然不会。


    △阎锡山用人规则和蒋介石有相通的地方，蒋介石用人要过问，是不是黄埔系，是不是浙江籍，阎锡山也用人，大量选用五台人。但是阎锡山安排自己的亲信有独特的特点，因为政府的官位有限，军队的官位也有领，他就成立各种组织，这些组织由他直接领导，这样负责人不必接受另外上级的约束，直通阎锡山，这样有两个好处，一个是便于阎锡山控制，二是负责人感到宠幸，因而死心塌地为阎锡山卖命。


    △别人是被动交人质，而阎锡山是主动，名义上说 是，让父母开开眼界，见见大世面，把他们安居到了北京，其实，实际上是为了打消袁世凯对他的猜忌，送父当人质。而且每年的三节两寿，对给袁世凯送上好的汾酒，都是几百坛，几百坛的送。阎锡山把袁世凯伺候的好好的，其中的侍上术，权谋总结其中精髓，只有八个字“畏之如虎，敬若神明”。


    △一个人如果形成不了自己的战略判断力，做什么事都不会有长远的规划和积累，自己就会一次一次被清零，赶不上车，靠自己的双腿，再累也不会有大的进步。如何形成自己的战略判断力？比如我们研究房地产政策，不是为了刺激焦虑，而是让大家看到国家的难题，国家又想出了什么样的解决方案。面对各种问题的联动，多个维度的博弈，国家拿出什么样的方案解决各方需求？只有不断的建立自己的宏观思维。用自己的判断力去思考国家的政策方向，这就进行了预判，然后不断看国家释放出的信号，这就抓住了趋势。


    △中国历史上的朝代，往往都是从国家朝廷开始出现财政问题，军费帑银开支周转困难，就已经注定了走向衰落。钱去哪里了？被食利阶层吃光掏空了呗！贪得无厌的地主富商贪官利益集团，占有大量财富，躺着就能吃得脑肥肠满不说，还要极致剥削，敲骨榨髓，出了问题又利益勾结，打压弹劾了事，也不去解决核心矛盾，或者说从来没有考虑过要解决，这样层层下去，底层民众揭竿而起，或者外敌侵略，一个亏损，集权弱化的国家的命运，就已经提前注定了。


    △储备，在工业时代是一种强制积累，因为那时候，通胀效率比较低，不断地积累财富可以做更多的事，但是现在已经是完全金融脱钩，你所积累的财富，完全就是国家信用的纸，锚定物已经变了。那年代没有各种杠杆，社会生产发展也比较慢，抗风险能力也比较差，只能靠自己的强势积累，谁积累的多谁就可以做更大的事，谁就可以有更强的抗风险能力，但是现在呢完全不同了。


    △凡是建议领导管理时，强调心服口服，让下属内心追随的，上基本上都是扯淡，没有任何一个人真心的想去追随另外一个人，尤其是中国男人。


    △我们越是研究权谋，越是对国家政策理解比较深刻，越是能够站在更大的局面上来思考问题，调整自己的行为。


    △曹锟想当总统，必须贿赂议员。但是手里没钱，于是想出了个立竿见影的方法，那就是捉财神。


    他秘密派出20多人到各地抓贩毒团伙，抓了上百人，通通送往天津组织特别法庭审理，选出其中无力缴款的小鱼，毫不客气地枪决示众，杀鸡儆猴。而把油水大的留下来继续审，这些人见小鱼被处死，自知性命难保，哭天喊地表示只要能给活路，要啥给啥，他们听到可以用钱赎身，一个个喜出望外，别说几百元几千元就是几万元，也全部纷纷筹款送上，于是大量白银流入曹锟腰包。


    △所有骗术里面最高明的，就是先让你尝一点甜头，然后引诱最后甩出所有筹码，一次输光。


    △无论什么样的制度，在具体选拔方法上有所不同，但是都体现在权力自上而下授予的原则、民意、品德、才能、政绩等等方面的因素，都不能决定个人在仕途中的进退得失，只有君主或者上司的赏识恩宠才是获得权力的唯一来源。权力来源的唯上性，势必形成主仆关系。下级想升迁的欲望是否实现，完全取决于上司的意愿。这完全是仰泳上恩的结果。


    △为什么领导大多喜欢和稀泥，不辨是非，调和折中，因为领导不在乎谁对谁错，而是在乎处理后果，如果可能打破势力的平衡，那就不得不以和稀泥的方式来调和矛盾。


    △领导容忍甚至重用品行恶劣的下属。主要是，这种下属很容易成为众矢之的，除了对自己忠心卖命，没有其他出路。而领导可以随时用这种下属打压不听话的势力，甚至在风向突变之时，将这类下属祭旗以平息民愤。


    △防止各种“势力”发生威胁自己的火并。管理上更喜欢斗而不破，这样斗争的影响只限于内部，而一旦内部斗争公开化，常常会影响到领导的地位稳固，被怀疑管理能力，进而波及自己的地位。


    △领导为了实现某个特定目的，常常是说话不算数，甚至会做出一些违背常理的事情。比如忽然抬高某个下属，又忽然贬低某个下属，其最终的目的可能是向航下属背后的势力传递一种信号，我支持你或者是你们做的过分了，要收敛些。


    △职场的本质是价值和利益的交换，一切事务都围绕着权力和利益展开。你人际关系好，那是因为你有价值，且懂得礼尚往来的社交规则；你能获得提拔晋升，那也是因为你有价值，你的进步更能延伸领导的权力和意志。可以说，价值贯穿着任何一个人的工作和生活，有了价值，左右逢源，没有价值，寸步难行。


    △领导为什么喜欢提拔重用身边人？

    因为身边人对于他来说，风险最小，回报最高；

    风险小是因为熟悉，风险可控，出问题补救挽回的可能性也最大；

    回报高也同样是因为熟悉，能给自己稳定的回报反馈；身边的人，对自己的支持最多，付出也最多，宝贵的提拔重用资源就那么点，非常稀缺，不可能做到撒胡椒面儿一样撒，只能用在回报率最高的地方，好钢用在刀刃上。从古至今，概莫能外焉。


    △有一种人，以为和领导关系好，就直接越过部门主管，直接找大领导要指示，这样的人也会被上级厌恶。越级汇报会让大领导觉得部门主管工作不到位，对其产生影响，另一方面，还会引发部门主管的怀疑和猜忌，无论是哪种，对你未来的发展都无害无一利。


    △职场中，早请示晚汇报的人会获得领导的更多关注，相反的，一个对领导布置的工作任性为之，做完也不懂得及时告知的人，只会让领导不满。因为领导每天的工作量是非常大的，不可能关注到部门中的每一个人，也不可能主动询问员工进度，当领导无法及时掌握你每天的工作内容时，就会觉得你每天在混日子过活，自然对你没有什么好的印象。


    △很多刚进入职场的年轻人，脸皮薄，维护自身利益的意志不够坚定，有时候，别人说几句好话或者给几块糖，就同意放弃自己应得的利益，显得自己有大局观，维护大局。实际上，这种做法是非常错误的，因为在你还没有一定分量的時候，你的牺牲，没有人会记得。你的付出，更是容易被人家遗忘，不要相信什么“以后哥带你混”、“你让出这次，下次哥的机会让给你”之类的鬼话，因为私下找你的人，都是精致的利己主义者，他们绝对不可能下次把机会让给你的。


    △权谋家处理人际关系有一个原则就是喜怒不形于色，本质就是不要撕破脸。哪怕你对他恨之入骨，立即想搞死他，但是没有达到目的之前还是要和气相处，甚至在达到目的之后，对其亲人也要笑脸相迎，这样做有很多好处，一是可以麻痹对手，二是如果将来形势有变，彼此需要联手，也有個回环的余地。


    △皇帝陷入繁杂的具体事物之中，能比基层官吏和专职官员更加能干吗，不可能的。反而会被他们的专业性控制。企业家和企业高管技术人员之间

    '
