  - '[PAGE 85]


    △古往今来，领导控制属下，一般都是用两种手段，一靠笼络：许以金钱官位美色；二靠抓短儿：有贪污受贿经济问题或者是生活作风问题。不贪财不爱色不恋权的主儿，领导敢放心重用吗？因为不是害怕难于驾驭，就是害怕被取而代之。属下贪，领导安。


    △马克思早就说过了“一旦资产阶级感到其财产和统治权受到威胁时，就会把自由、平等、博爱这句格言代之以毫不含糊的步兵、骑兵、炮兵！”


    △身处高位便是众矢之的，无端被害比比皆是，岂是有罪无罪那么简单？再说，领导对下属的宠信也是多变的，看不透这一点就是没有智慧。


    △人在取得成功的道路上，需要合作过的伙伴，但却无法挑选自己喜爱的人做伙伴，很多时候需要与狼共舞，但这只是权宜之计，因为狼毕竟是狼，总是要吃人的，无论你是否有恩于他还是他有恩于你。都不能永久相伴，只是一朝一夕的相处，所以说任何时候不能被假象迷惑，不仅要防，还要找机会除掉它。


    △陷害他人并不是一定要用卑劣的言辞，言不由衷的赞美，同样可以将人置于死地，对于自高自大的顽愚之辈，捧杀他远比棒杀他更直接有效，违心的赞誉别人，虽然是小人常用的权术，但君子拿来对付小人也是无可指责的。事实上由于小人的本性，死于捧杀的小人最多，他们最容易在赞誉面前飘飘然了。


    △但凡游戏必有规则，但规则未必明说，明说的又未必当真。


    △只要一大堆人聚集在一起，无论是精神组织，还是经济组织，再或者是政治组织都是为了利益，不管他表面上说是为了谁，如何做？但最终都是为了自己的利益，为了拓展自己的生存空间，谋取生存资源，不然谁没事，聚在一起干啥？只不过每个人追求的实现方式不一样，有的追求来生，有的追求当下。


    △谋划对手最重要的是不能暴露自己，伪装成为对手的亲信，以其亲信'
  - '[PAGE 86]


    的面目施展手段，再强的对手也不堪一击，把自己真实用心隐藏起来，有时候要付出血的代价。不做牺牲，狡猾的对手就难以消除疑虑，在对手意想不到之处打击他，用最忠心的人，也难以做到的事触动他，任何人都会失去理智，潜伏在对手身边最致命。


    △为什么很多领导执行上级政策的时候，“宁左勿右”因为，左，可以表示自己已经高度重视，已经尽力，即使出了事情，也可以不负责任。


    △一个组织在发展期，需要有能力的人，开疆拓土也就会包容人才的傲慢，但是一旦发展停止，内卷化，很快，这种有能力的人就会被抛弃。


    △房价反映金融杠杆，代表富人购买力；而房租反映真实收入，代表穷人的购买力（穷人没杠杆）。为了克服疫情，不得不大量货币超发，进行金融放水，从而进一步刺激房价的上升，但是穷人却没有杠杆，无法享受到房价增值，带来的财富，而富人恰恰相反。任何一种灾难都是对社会的无差别打击，但是在那之后，会进一步撕裂社会的贫富差距。


    △底层原生家庭的父母，无论孩子多么努力，还是会给孩子浇上一盆冷水，同时还会严厉指出孩子的缺点和不足，这种做法会使孩子产生自我否定，自我蔑视感，做任何事情都不会有幸福感，所以，以上这一感受会慢慢形成一种综合的不幸感，充斥余生。


    △虽然说，“清者自清，浊者自浊“，可是在官场上却不是这种逻辑，清者难免会让浊者，感觉到威胁和不自在，清者即使不去招惹浊者，浊者也会想办法把清浊污染掉或者除掉，这样官场就一个颜色了，大家都好混。


    △善谋国的忠臣，都不善于谋身或不屑于谋身，为江山社稷考虑的多，为自身安危考虑的少，所以他们自身的命运往往多灾多难，这也基本上成了中国古代官场的一条牢不可破的规律。


    △无论官场还是职场，一旦不是一个政治核心，就会出现派系斗争，面对派系斗争，所有人都没有回旋的余地，你必须明确支持谁或者是反对谁，'
  - '[PAGE 87]


    你想逍遥世外也可以，但对不起，很快你就会被边缘化，运气好的话忍个几年还有东山再起，这运气差的话，就等着退休养老吧，宦海沉浮，一个官员政治生命的黄金时期，也就那么几年睽睽一下，所有的抱负都付之东流了。


    △我们看到的都是别人的人设，而不是真实的人性。当我们看到他的真实人性的時候，人设在我们面前崩塌，就有种被骗的感觉。


    △没有收拾残局的能力，就不要放纵自己的情绪。


    △通货膨胀从来都是财富的收割机，带来的结果就是富者越富，贫者恒贫。富人们可以通过购置各种保值增值资产而毫发无损甚至成为受益者，但是占人口绝大部分工薪阶层只能是降低各种欲望，减少消费来抵御。


    薇芯：yxsk2022

    △风平浪静时要撩动水面，逼使鱼儿浮上来，鱼儿会因为水波翻动而现身，而自投罗网，不要给对手准备的时间，先机是最重要的，谁抢得先机，谁将最终取胜。应用这一条策略，采取的手段就是控制对手的情绪、虚荣、自尊、爱与恨形成影响他的因素，在愤怒的情况下，人很难掌控自己的情绪，你制造的漩涡会将它他淹没。


    △生活中的方方面面的竞争，需要你充分利用周围的一切条件和资源，如果你想击败竞争对手，就必须比对方更早的占据和利用这些资源。谁先占据有利条件和资源，谁就会在竞争中胜出。


    △【睁一只眼，闭一只眼】很多人初入职场，都会有些不适应，他们会这也看不惯，那也看不顺眼，结果到头来，自己反而成了最不受欢迎的人，这是什么原因呢？俗话说水至清则无鱼，人至察则无徒，而职场更不是什么一方圣洁的净土，恰恰相反，它是人的本性暴露最充分的地方，什么样的人都有。所以在职场，如果你想在里面呆下去，不免要睁一只眼闭一只眼，虽然这样说，有悖于某一些人看待事情的准则，但它却是在职场待下去的一个必要条件，一则它可以使你不去逆龙鳞，激怒你的顶头上司。'
  - '[PAGE 88]


    二是也可以使你能与同僚较为和谐的相处，不至于产生尖锐的对立，这对你的前途也不会出现大的障碍了。


    △大家要记住，你犯错，对领导来说有时候不一定很讨厌，你这样，他才可以原谅你，才可以对你施恩，你才会欠他人情。这和学校犯错必然受批评，决然是不同的。


    △利益是行动的杠杆，一切事情都要在利益的驱使下完成，所以每个人都要需要，站在别人的角度去思考自己的路径，看见别人的利益需求学会除去蒙蔽在事实上的自我情感，做一个现实主义者，就可以取得巨大的成就。


    △不要公开打击一无所有的人，这背后的逻辑并不是因为公平不公平的问题，而是一无所有的人，光脚的不怕穿鞋的，将会无所顾忌，因为，他已经没有什么可失去的了，就会孤注一掷。所以真正有智慧的人能够纵观全局与宏观的眼光，考虑大事，也能够通晓厉害的关键所在，胸怀宽广，不去追求小利，不为小事所困扰，不被小人所纠缠。


    △权力的最高境界，就是能够，不对别人施加任何压力，就能让对方心甘情愿的满足你的要求，按照你的意愿行动，那么你的权力将无人可及，但要达到这样的目的，最好的办法就是让别人感到需要你或者少了你，他的计划就无法运作，他的生活就难以正常进行，一旦建立这样的关系，你的地位就变得不可替代。


    △在挫折面前，在遭人侮辱面前，人们的态度和反应是不同的。有智慧的人，处变不惊，不怨不弃，不做无用的争辩和蛮干，事实证明这是最有效的反攻之道。暂避锋芒，理智务实并不是无勇怯懦，它可以使人远离矛盾的中心，而不激发更大的打击。相反那些反应敏感，认不清形势的人，在怨天尤人时，不仅仅于事无补，也更容易让人抓住把柄。穷追猛打，便会接踵而至，非置其死地而后快，如此他们也就再没有翻身之日。'
  - '[PAGE 89]


    △对于女人而言，世界上最好的男人，大概就是有见识却又不是见识太多的男人，没有见识的，跟个猫似的，沾一点腥味就跑了，太有见识的，看开了，什么都不放在心上了。


    △调虎离山是权谋家对付强者的常用手段。一般来说，人们都争取能在自己熟悉的地方和对手谈判，谁能将对手调离去熟悉的环境，谁就能争取到主动权，这就能利用自己的天时地利去打击对手，以谍略引诱对手就范，正面交锋有危险，就想办法把对手引出后，在运动中制服对手。


