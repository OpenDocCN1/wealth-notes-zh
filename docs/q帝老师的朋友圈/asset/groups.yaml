  - '[PAGE 130]


    防着你，担心你有一天会坏了他们的事。如此一来，你就自绝于官场了，你想做什么都做不成，人家不会和你合作。官场是灰色的，你不得不让自己也成为灰色，以便融入这个圈子。


    △在没有明确上级真实意图之前，把自己的观点抛出来，是极共危险的。避险的唯©路径，就是让下面的人先说，在各人说的过程中，逐渐弄清上级领导的真实意图。


    △人类社会自从成为社会的哪一天起，其实就在建立社会规则。不管这种规则存在多少弊端，它毕竟是规则。任何人面对规则，只有两条路可走，要么适应规则，要么改善规则。除此之外，恐怕没有第三条路可走。你可能会说，我难道不能回避？是的，你或许可以回避，但你走到社会的任何一个领域，都可能有其自身的规则。你不能适应一个行业的规则，很可能也无法适应其他行业的规则。


    ⚠《宋代就开始有的众筹》宋理宗嘉熙年间，峒丁造反。黄安宰、黄炳集聚兵员加以守备。


    有一天五更的时候，发布盗寇来的警报，二黄就派巡尉率兵迎战敌人。


