- raw:
  - '[PAGE 190]


    的关系也是如此，要用自己的权术来获取自己需要的东西，而不是参与到琐碎的细节之中。


    △关于人际关系这件事，没有那么多花里胡哨的技巧，你只需要给对方提供你的价值，需要的人自然会和你合作、交朋友。如果你什么都没有，哪怕你讨好对方，都无济于事，因为价值是人际关系的基础，没有价值，就付费，不然没有人会在一个没有利益的人身上，浪费自己宝贵的时间。


    △任何你想不通的事情，都可以用利益的角度思考。事出反常必有妖，如果你发现一个人做出了反常的举动，而你怎么都想不清楚，那你不妨从利益的角度分析，看看这件事情做了，对方能获得什么利益。


    △在学校的时候问你的问题是明确的，答案都在书里，自己可以找。而走上社会之后，你连什么是问题都不知道，想找书都不知道是哪一本书，都是超纲题。


    △对于可控的事情要保持警惕，就像有句话说的，‘生于忧患，死于安乐’。人要有居安思危的警惕性，当你开始飘了，开始放松警惕了，那你距离危机就会越来越近。对于不可控的事情，尽量保持乐观，反正最差的结果你能接受就好，尽人事，听天命，把你能做的做好，剩下的事情也不会太糟糕。


    △国家一方面不允许违背社会主义的基本规律，一夫一妻制度，另一方面呢，也需要扩张人口，不能不默许有钱人多几个老婆，所以我预判在这两个政策平衡之间，国家未来会允许单身女人生孩子，承认私生子的地位。


    △社会没有想的那么险恶，尤其是彼此没有任何利益的往来，会相处的很好。那些你觉得是潜规则的，一般人是接触不到的，真正能看到最阴暗的地方，一定是利益高度集中的地方。其实普通人保护好自己，凡事留个心眼，别让人收割就算权谋入门了。


    △黑手起家，公益漂白。无论是个人发家，还是大国崛起，无不如此。'
  - '[PAGE 191]


    △任何人之间的关系，本质就不是互相帮助，而是互相利用。你对一个人好，并不足以成为别人对你好的理由，知恩图报不过是你的主观臆想。但是，如果你手里有别人想要的东西，那对方一定会对你“好”，对你点头哈腰。所以呢，真正的聪明人不是傻乎乎地去对别人好，跟别人讲感情，而是要时刻积累自己手中的筹码，让别人不得不对你“好”。


    △谁说西方人不玩权术？教父的这几句名言极具权谋味道：让朋友低估你的优点，让敌人高估你的缺点。不要憎恨你的敌人，他会影响你的判断。离你朋友近一点，但离你的敌人要更近一点，这样你才能更深刻的了解他。做出什么样的决定，就要承担什么样的代价。


    △一个人所处的社会层级，决定了他每天会接收到什么样的信息；一个人每天吸收的信息，决定了他的知识结构的形成；一个人的知识结构，决定了他所构建的认知体系层次；而一个人的认知层次，又决定了他未来会处于什么样的社会层级。在古代，贵族的孩子继续当贵族，农民的孩子继续做农民。八九成没什么变化。


    △官话套话空话，永远是职场的护身符，现在可以随意偷拍偷录的情况下，口无遮拦的人很难走向高位，也很难保持在高位。


    △当民族自信和民族尊严产生冲突的时候，民族尊严排在第一，这是睢睢眼辩论议题的核心。别拿睢睢眼强调自由和自信，长得丑不是你的错，但出来招摇，这就是你的错。


    △领导一定要切记，有两种情况下，员工的工作是不便于强制安排的：一是该下属有辞职的打算，不想在离开前接受太大压力的工作；第二该下属因私人问题困扰，如刚受失恋打击或父母离世，所以也不便于接受强制任务。


    △站在未来看现在，不拘泥于当下的条件，而是以目标为核心，反推实现目标需要创造什么条件。意思就是说，设局让别人进入你的局内当作实'
  - '[PAGE 192]


    现结果的资源。


    △身处底层的穷人，格局，思维，阅历不足，能力不足，父母亲戚都是平凡的人，无法提供有效资源，一切资源就得全靠自己去打拼、去积累，有了资源、资本或者说第一桶金，才能靠钱赚钱，但要想积累资源需要过程及正确方法的，而身处底层的穷人，最缺正确方法和人脉。而且底层人积累资金有限，无法抗击大风险，一场大病或者需要钱的大事都可以击垮。


    △在很多人眼里，一听到权谋就认为是阴谋，其原因就在于，内心算计一旦透明，自己的想法就为他人所熟知，自然别人就有了应对措施，就会被人预判和提防，你就很难开展下一步的工作，而狠人就是少说偷偷做，做成功。


    △历史上从来没有真正的以弱胜强，任何一场胜利要么就是强者碾压弱者，要么就是弱者千万百计制造或等待出一个非对称优势，在局部实现持强欺弱，扭转形势。


    △有了隐藏的计谋，有了无底线的手段，并不足以击败对手，因为还差一个好时机。而合适的时机就是，出其不意，攻其不备，制造非对称的优势，将计谋发挥到最大的效果。大多数权术都是以迅雷不及掩耳之势，突然间成就的。


