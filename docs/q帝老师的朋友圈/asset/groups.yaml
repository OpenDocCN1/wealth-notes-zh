    △许多人的努力和拼搏不过是为了应付当下的生计问题，却无法完全形成积累，凡是无法形成积累的行为，都只带来临时性的满足，事后空空如也，一无所得。只有在一个确定的流程和节奏内，并拥有确定性评价标准和奖惩机制的通道中努力，这种努力才会不断的积累，才有明确的意义，这也是草根能够突破自身所处生存阶层的关键点。


    △西方讲究开疆殖民，所以高大威猛争夺的是增量市场，而东方内敛含蓄，争夺的是存量市场，所以更讲究运筹帷幄。


