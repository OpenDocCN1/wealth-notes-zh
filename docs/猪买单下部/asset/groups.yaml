    人脉资源有了，可是如何变现呢？


    ## 第八个历程：培养信赖感


    给大家讲个信赖感的故事……


    ## 《一千零一次无坚不摧的信赖感法则》


    大家听过一句话吗：“天上九头鸟，地上湖北佬！”


    其实，这个故事发生在……


    战国时期，楚国国王梦见周公，周公对楚王说：“天上有种九头鸟非常聪明，如果能够让这只鸟若能定居在你们国家，上天将会降幅楚国百姓，让楚国风调雨顺！年年丰收！还会让楚国人更加聪明！”


    楚王醒来之后，找来大臣商量，并设坛祭祀请求九头鸟降临楚国，求了 3 年无济于事。


    有一天，楚王布告天下，谁可以把九头鸟请到楚国来，即可娶到美丽的公主，做楚国的驸马，并且赏黄金百万赐爵封侯！但是有个要求，就是不能伤害这只九头神鸟。


    九头鸟非常聪明，有九个脑袋，生性多疑，从来不相信任何人，行动起来非常的谨慎，人们只看到他在天上飞，但是从来没有人抓到他，因为九头鸟实在太聪明了。


    ![](img/9e495c245c6fc762e84f842b252dc362_565_0.png)


    有一个年轻人，由于忠厚老实，待人诚恳，没有心计，于是别人都叫他猪哥哥；猪哥哥也知道楚王的这次赏赐，于是决定试试看……


    九头鸟每次来到人间，都喜欢住在楚国北部，也就是今天苏豫皖三省交界处的一座山上。也就是汉高祖刘邦家乡的附近……


    猪哥哥摸清规律之后，开始行动了……


    九头鸟听到有沉重的脚步声，怕有危险，出于本能的躲起来……过了一会，等到那个脚步声走远了，九头鸟出来一看，哇，是最喜欢吃的美食，于是满心欢喜的享用起来。


    就这样，过了一天又一天，每次听到脚步声，九头鸟都躲起来，等到脚步声走远之后，九头鸟就出来享受自己的美食。


    ![](img/9e495c245c6fc762e84f842b252dc362_566_0.png)


    没有任何要求，没有任何索取，只是默默的付出！


    就这样每天重复一次，一天又一天的过去了！


    九头鸟心里开始接受这种“沉重的脚步声”甚至开始喜欢、还有些感激这个“脚步声”了！


    因为这“脚步声”不仅是一种声音，还是“美食”即将到来的种美丽的音符，于是，九头鸟渐渐的相信“脚步声”！


    脚步声=美食=好处=爱=信赖感


    就这样信赖感一次又一次的加强！


    ![](img/9e495c245c6fc762e84f842b252dc362_567_0.png)


    爱一旦增加爱，一切都会改变！


    一诺老师


    1000 次过去了，九头鸟从小鸟长成大鸟了，九头鸟决定亲自感谢一下这个“脚步声”。


    > （捣脸！很多垃圾人，不愿意付出、不愿意经营信赖感，就喜欢用强奸式的营销方法，恨不得一见面就抢钱！）


    在第 1001 次的时候，“脚步声”渐渐的响起……


    当“脚步声”靠近的时候，这一次九头鸟心砰砰直跳，早就想感谢这位恩人了，于是决定不要再躲起来，九头鸟从自己的洞穴里跑了出来，去拥抱“脚步声”……


    猪哥哥把自己的想法告诉九头鸟，九头鸟因为相信猪哥哥，就答应了猪哥哥的请求，留在了楚国……


    后来，上天降幅楚国百姓，楚国每年风调雨顺！年年丰收！楚国人丁兴旺，而且楚国人人读书，变得越来越聪明！


    楚王非常高兴，兑现了承诺，把公主许配给了猪哥哥。


    后来楚王问猪哥哥成功的秘诀时……


    猪哥哥拿起笔在墙上写下一句话，


    ![](img/9e495c245c6fc762e84f842b252dc362_568_0.png)


    楚国地界出了很多了不起的人物，例如：创立道家学派的老子、爱国人士屈原、抗秦名将项燕、楚霸王项羽、清朝末年大泽乡起义的陈胜吴广、推翻秦朝的汉朝开国皇帝刘邦、后来的明朝开国皇帝朱元璋，也是在楚国地界。


    后来就有了“天上九头鸟，地上楚国人。”


    现在传的是“天上九头鸟，地上湖北佬。”


    不是楚国人奸诈，而是楚国人比较聪明，就像猪哥哥一样，聪明人不是一开始就想要索取，而是想着如何付出！


    舍得舍得，大舍大得，小舍小得，不舍不得！


    想要收获玉米，首先要在地里种下玉米的种子！


    想要收获大豆，首先要在地里种下大豆的种子！


    ![](img/9e495c245c6fc762e84f842b252dc362_569_0.png)


    想要收获任何庄稼，都是同样的道理，必须先要播种，如果你没有收获，很简单，就是因为你没有播种！（付出）


    所以春天是农民的儿子，知道种瓜得瓜种豆得豆的道理，于是开始建立信赖感……


    春天建立信赖感用了五个方法：


    1. 每次学习春天不是学习的，春天是服务的，认真做笔记，把笔记整理出来，然后印刷出来，免费发给每位同学手里，那时候还没有现在的 QQ 群和微信群那么方便。

    2. 认证记住每个人的名字，从心理学角度被记住名字的人感觉你重视他，让他感觉在你心中他很重要！因为人总是喜欢跟在乎他认可他的人在一起。

    3. 每次开课前打电话给每位同学，告诉他们别忘记哪天开课，挂掉电话发条信息告诉机场、火车站到课程现场的路线。

    4. 课程结束后，经常给每位同学打电话沟通，联络感情！

    5. 帮助同学设计他们公司的招商和营销方案……


    就这样，大家越来越信任春天，在同学们的眼里，春天就是大家长，很付出！在同学们的心里，春天就是力量，就是他们坚强的后援！


    ## 第九个历程：事实胜于雄辩


    春天跟同学们建立信赖感，与此同时也不忘做一件重要的事情——榜样的力量！


    因为第一期叫做：金融杠杆


    教大家是借钱，可是很多人连银行的大门都不敢进去，更不敢见行长，可是谁的权力最大？当然是行长对吧？


    春天从小就磨练的脸皮够厚，也不知道什么叫做面子！


    于是就找银行，直接往里冲说找行长！


    被拒绝了几十次之后，春天总结了，如何才能让银行喜欢我，不拒绝我呢？


    答案很简答——好处！


    当你看《猪买单》超 100 遍以上,奇迹将在你身上出现！这种奇迹叫做:羊毛出在狗身上猪买单！

