    读书人出门转了不到五分钟，家具厂老板生怕读书人走了，赶紧出来寻找，说：“恩人呀，我现在就签字，这个协议真的写的好，都是为我好，我不该多心，不该多心……”


    大家一定很好奇里面写的啥对吧？


    各位知道让别人无法抗拒的是什么吗？——好处！


