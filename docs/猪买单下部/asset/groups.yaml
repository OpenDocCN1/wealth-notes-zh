    \ 100%分完年赚上亿的秘密\n\n陈医生从医多年，后来自己开了一家私立医院，之前总是看着人家赚钱，没想到自己干连本钱都裹不住，连续亏了 3 年，后来使用了《猪买单》的最佳资源配置方案，结果生意一日好过一日，花了\
