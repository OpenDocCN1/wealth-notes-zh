    协议里面有四大好处：


    - 第一：甲方为资产管理公司，全权负责乙方企业的运营；（资产管理是自己不用生孩子，养别人的孩子！）

    - 第二：甲方负债合理安排解决乙方债务及员工工资；

    - 第三：甲方负责筹集启动生产运营所需要的经费；

    - 第四：运营所赚收益 40%归乙方所有；


    不知道大家看懂了没有，这个协议给家具厂老板吃了定心丸意思是，我来筹集资金让你的企业重新开动起来，具体钱从哪里来？没有提！这也不是家具厂老板关心的问题。


    家具厂老板心想：反正我是没有钱，而且债务帮我解决掉，赚来的钱还有 40%给我？I 服了 U……


