    ![](img/9e495c245c6fc762e84f842b252dc362_202_0.png)


    时间就是生命！这 5 年是企业喘息的生命时间！


    5 年的时间放在庸才手里，这笔钱会吃光、花光、败光，这些无能之辈会让企业濒临破产！


    但是放在善于经营的人手里，就可以扭转乾坤！


