    ### 小赵融资结尾篇


    小赵融资 1000 多万之后，准备大干一场，那就要好好的找到好项目……


    小赵在某商业区，看中一个一楼商铺，这是一个损盘，什么是损盘？就是低于市场价的楼盘。


    例如：同一个楼盘，位置好的地方 15 万/平方，位置偏一点 7 万/平方，但是银行评估价按照 15 万/平方……


    100 平方，评估价 1500 万。


    贷款 1500 万，实际小赵只要付 700 万……


    各位，这就是聪明人与傻子的区别！


    区别在哪了呢？


    区别就在于懂与不懂，就这么简单！


    所以各位，脑袋决定口袋，一个人只有脑袋富有了，口袋才能富有啊！


    你以为这就结束了吗？


    接下来的这一幕幕，你会感觉自己在做梦！


    小赵花 1500 万买下商铺，价值 700 万，贷款 1500 万，实际自己不但没有出钱，反而还有几百万现金……


    紧接着，小赵把房子出租给嫂子的公司……


    嫂子在公司做海鲜批发酒楼配送，好家伙，这正是高附加值的产品……


    过段时间，小赵把房子 2500 万“卖”给嫂子，自己赚 1000 万……注意啦！这里很关键，因为能放 2500 万贷款给这家公司，说明这家公司的流水一定很强大！所以做海鲜的嘛，流水大！


    这里的操作很关键，首先流水大，其次评估要能够跟得上！


    也就是说，评估公司的评估价，银行要认可!!!


    当把房产过户到嫂子名下时，再用经营贷的方式，一次性把 2500 万贷款出来……


    后来，真的不能再说了，好吧，再说一句，这些都可以故伎重演，如法炮制到亲友团的公司，不是说全家总动员嘛……


