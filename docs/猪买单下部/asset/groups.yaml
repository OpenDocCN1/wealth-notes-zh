    # 套现指


    ## 第15节：空手道借尸还魂亏损中酒店，套现1亿金蝉脱壳


    吴凯从穷困潦倒、找不到工作、身无分文到屌丝逆袭没有花一分钱就整合了几十家酒店，当月实现盈利！两年半时间身价过亿，他是如何做到的呢？


    让一诺老师跟你一起来见证奇迹吧……


    吴凯是一名大学生，像很多大学生一样，自从大学毕业之后，也就失业了，发现大学学的东西在社会上已经过时了！再加上现在满大街的大学生，大学毕业已经不是什么稀罕事了，就连做保姆的都有很多大学生，可见大学生的生存越来越激烈！


    吴凯很郁闷，曾经的书中自有黄金屋，书中自有颜如玉在今天看来都是那么的不切实际！曾经满腔热血、一腔抱负的他，在踏入社会一年之后磨得一点理想都没有了……


    正当吴凯错误的认为理想很丰满，现实很骨感的时候，一个偶然的机会，在朋友的推荐下听了一诺老师的音频课程，从此一发不可收拾……


    吴凯有一种醍醐灌顶的感觉，心想如果大学四年都有这样的老师来教我，可能我就不会混成今天这个样子！


    有一天吴凯终于拥有了一次参加一诺老师课程的机会，在课程中吴凯认真听讲，在做项目设计、爆款产品、设计马甲、跨界打劫等作业的时候，忍不住感叹，这才是真正的知识！之前的书都白读了……


    ![](img/9e495c245c6fc762e84f842b252dc362_292_0.png)


    后来，吴凯在小组同学的帮助下，做了一套方案，在当时那一期的同学中获得了“最佳资源配置”一等奖！


    这套方案在实施过程中，虽然遇到很多问题，但是经过他们小组的配合，加上一诺老师对他们的指导，最终还是成功落地，没有花一分钱就整合了一家酒店……


    这个神奇的空手道大师究竟如何落地的呢？


