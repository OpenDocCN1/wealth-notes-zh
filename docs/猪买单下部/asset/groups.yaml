    #### 第四：引爆人群


    也就是你要明白目标客户人群在哪里？找到最集中的人群，这就是你首先要引爆的。


    - 母婴类最集中的人群在产房、妇幼保健院、居民区等。

    - 耐克、百事、可口可乐饮料类最集中的人群是学生。

    - 手机等电子产品最集中的人群在大学、写字楼等。

    - 茶叶最集中的人群在茶馆、酒店、加油站、写字楼等。

    - 美容护肤品的人群在学校、写字楼、商超、小区等。

    - 白酒最集中的人群在酒店、加油站、写字楼、工业区、工地、居民区、学校、BD、商超、广场、会展、活动……


    这些在后面一诺老师课程当中，都会教到大家。


    #### 第五：选择奖品


    这个奖品，也就是免费的产品体验或服务体验；

    就是成交客户的敲门砖，但必须是吸引人的，让人看起来这就是好的，绝对不能是忽悠的，客户的第一感觉很重要！


    #### 第六：口碑相传


    你要设计一套能够口碑相传的系统，最好是别让你的顾客开口，让他转发就可以，越简单越好。


    #### 第七：抓住名单


    客户来领取奖品，要有一套流程能够让客户留下更多信息，例如：电话、手机、V信、邮箱、地址……


