    家具厂老板猛地站了起来，双手握住读书人的手是泪流满面啊，激动地说：“恩人呀！恩人呀！”


    读书人说：“你别着急，我是有条件的……”


    家具厂老板抢过话米：“你说吧，我什么条件都答应你！”


    家具厂老板不断的重复：“我什么条件都答应你！”


    一边说一边抓住读书人的手不放，不停地握着读书人的手，不停地喊着：“我什么都答应你，只要你救救我！”


    读书人说：“从现在开始，所有业务听我指挥！”


    家具厂老板连忙答道：“我答应你！”


    读书人接着说：“从现在开始，所有人员由我安排面试录用！以及他们干什么，都由我说的算！”


    家具厂老板说：“我答应你，我答应你！你说什么我都答应！”


    读书人一看，时机成熟了，拿出一份协议：


    家具厂老板生怕里面有啥诈，但是一想，我都这样了一穷二白，你能骗我啥？


    但是又怕真的有啥很想仔细看看……


    同时又担心读书人不高兴……


    读书人很懂心理学，自然看出来家具厂老板矛盾的心理，马上开口道：“你先看看，我先到厂里四处转转！”


