    ## 第四个步骤：零抗拒成交


    什么是零抗拒成交？


    就是给对方不可抗拒的理由！


    理由越充分越好！


    理由越多越好？


    你可能会问：“一诺老师什么理由呢？”


    唉，都学了这么久，还问什么理由？——好处！


    所以读书人精心布置了一场零抗拒的成交，在市中心广场跟电视台一起举办了一场家具展销会，电视台提前 15 天造势，天天鼓吹，天天宣传，果然到了展销会当天，人头攒动！


    重点来了，客户迎面而来，你不要让他擦肩而去！


    一个庸才不懂客户心理学，不会定价、不会营销、不会成交的老板，和太监上青楼有什么区别？


    ![](img/9e495c245c6fc762e84f842b252dc362_201_0.png)


    没有主动成交客户方案的企业家，只会王八望绿豆，大眼瞪小眼傻呆呆的等着客户上门买！


    而读书人不一样，读书人早就设计好了促销方案：


    - 1. 本次家具展销会的主题是《免费送家具》

    - 2. 凡是现场购买超过1万以上家具者享受买一送一；

    - 3. 凡是现在购买家具3万以上者免费！


    可能大家最感兴趣的就是这条，免费？怎么免费？买3万就免费？对，3万块把家具领回家，5年后可以申请退款，钱退给你，家具也白送……


    各位，这是上个世纪最狠的促销方式！


    走遍天下，这样卖东西的还是第一个人！


    人们不仅耍怀疑了，有那么好吗？


    可是各位，有电视台的信用背书，客户就没有怀疑，结果三下五除二，家具被抢购一空……


    原来 7000 万的库存，被电视台这样一宣传，全部加价 30% 到 50% 卖出去……


    一共收到超过一个亿，给电视台一千多万，还剩下 8000 多万，足够给企业生存发展赢得了时间……


    你可能会问：“一诺老师，这家具 5 年后要退呀，这可咋办？”


