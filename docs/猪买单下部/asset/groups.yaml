    读书人现在是成竹在胸，说话挺直了腰板，问了一些关于企业的事情，最重要的是获得了一些企业的有价值的信息。


    各位，谈判不是乱谈的，要谈一些有价值的信息！


    从攀谈中读书人了解到家具厂有 7000 万的库存积压，而且都是实木家具，目前流行现代家居，所以这些实木家具就被市场无情的抛弃，变得分文不值。其实这些实木家具才是真正的好家居，可是中国就是有段时间，大概是
    90 年代前后很多现代年轻人不喜欢呆板的实木家具，只喜欢现代元素的流行家具！


    家具厂的老板显然有些语无伦次，也不知道要表达什么？


