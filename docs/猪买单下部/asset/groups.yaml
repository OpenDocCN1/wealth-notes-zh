    可是这个钱从哪里来呢？


    靠山吃山，靠水吃水！


    由于别人不知道春天负债 5000 万，而一个曾经的千万富翁，肯定气质跟别人不一样！但是春天并没有非常高姿态，而是放低姿态，管所有男人都叫哥，管所有女人都叫姐！


    现场 600 多人，都是来自全国各地的企业家，春天认真的记住每个人的名字，到了选组长的时候，这点非常关键：


    580 / 717


