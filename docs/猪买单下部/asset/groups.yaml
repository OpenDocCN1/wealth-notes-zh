    请想想一下，你有这样一张头像：


    你穿着普通甚至地摊货，满脸油光光、神情憔悴、目光呆滞，照片背景是：快餐店、公交车上、杂乱的房间……


    你用这样的照片对别人说，快来加盟呀，我赚了很多钱，结果别人会怎么想？


