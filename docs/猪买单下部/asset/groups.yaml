    \n我心想：“你不早说，让我在这折腾五天……”\n\n我就说：“医生麻烦您告诉我这个是啥药呀？”\n\n医生说：“哎，这个药有点贵哦，我建议你还是在医院治疗吧，医院的便宜……”\n\
    \nI 服了 u，只要钱能买到健康，那我宁愿要钱！\n\n我说：“医生，没关系，麻烦您告诉我吧……”\n\n![](img/9e495c245c6fc762e84f842b252dc362_280_0.png)\n\
    \n后来医生给我写了药名，然后告诉我：“在医院斜对面，全市只有他家有卖的！”\n\n作为整天教别人模式的一诺老师，对于这种套路一眼就识破，但是抱着治好病花点钱算啥的心态，就前往购药！\n\
