    ## 第一个步骤：招兵买马


    你可能会问：“都没钱了，如何聘请员工？”


    真笨！员工的工资是时间买单，什么意思呢？


    员工的工资是先发？还是后发？当然是后发对不对？


    这一来，新员工培训 7 天没有工资；


    这二来，15 号发上个月工资， 也就是有 45 天时间；


    ![](img/9e495c245c6fc762e84f842b252dc362_194_0.png)


    中国有句古话叫做：夜长梦多！


    你想想呀， 45 天可以发生很多不可思议的事情……


    ## 第二个步骤：鼓舞士气


    俗话说商场如战场，员工们的士气很重要！


    如何鼓舞士气呢？


    首先员工培训期间，让员工把厂房打扫干净！


