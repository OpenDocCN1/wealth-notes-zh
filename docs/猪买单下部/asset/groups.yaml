    这个非常、非常、非常的重要！


    ![](img/9e495c245c6fc762e84f842b252dc362_166_0.png)


    一诺老师会有一个《魔力演说家》是教会各位如何不见面就可以成交客户、经销商、股东的技术；


    还有一个复制一诺老师能力的《授证讲师班》，也是免费的，因为是免费的可能报名的人一定会非常多，因此我们按照先后报名顺序分批开班，一诺老师今后做教育不收学费，不靠学费赚钱，做教育就是一种爱好，就是为了帮助更多需要帮助的人！


    陈坤的演讲非常成功，关键是设计了几个催眠问话方式：


    - 1. 各位想要身体更健康、更有精力陪伴爱人和家人的请举手……（如果是你，你想不要？）

    - 2. 如果有一个方法可以不用占用你太多时间，让你每天最多 10 分钟就可以拥有魔鬼身材，让你拥有更健康、更迷人的体魄，如果 10 分钟就可以做到，有时间参加的请举手！（这是大多数人都可以得到的）

    - 3. 如果这个方法请一个教练，每天只需要 3 块钱，就可以给你带来你想要的身材，你是舍得花 3 块钱请教练喝水的请举手！（不举手就是 3 块钱不舍得花的人，好意思不举手嘛？）


    ![](img/9e495c245c6fc762e84f842b252dc362_167_0.png)


    陈坤接着演讲：由于受到场地和教练的限制，现场有 150 人，只能给到 50 个名额，如果后悔了可以回来退，但是如果没等到，就要花 3980 元来买这个健身套餐！


    各位，这叫做——饥饿营销，其实现场 150 人除了个别人之外，其他的基本上都交钱了，原因很简单：


    第一：之前早就被铺天盖地的广告熏陶了，在潜意识里面有个想要健身的念头；


    第二：既然来到现场都是对健身感兴趣的人；


    第三：给到的方案简单、便宜、零风险；


    ![](img/9e495c245c6fc762e84f842b252dc362_168_0.png)


    关于如何设计好处，如何做零风险承诺在《猪买单》前面的章节都有论述，在这里就不展开来讲！


    各位，你以为结束了吗？


    精彩还在后面呢，我们继续……


    ## 第四步骤：再送大礼


    现场气氛已经火爆起来，大家开始刷卡，工作人员一边引导客户刷卡买单，一边说等下坤哥有三个礼物要送给大家！


    还有现场抽奖，抽中的有价值万元礼品！


    从头到尾都是什么呢？


    送礼，也就是——好处！


    没有好处客人可能马上就走了，就是因为有万元好处，客人一听眼睛发绿了，那好听听看……


    陈坤开始演讲了：“各位，现场调查一下，刚刚已经刷卡的请举手……”


    结果现场几乎全部举手！


    陈坤接着讲：“刚刚刷卡的，等下现场抽奖，百分百中奖，给大家介绍一下奖品情况！”


    各位为什么要设置奖品呢？


    因为刚刚才做完成交动作，现在必须要干嘛呢？


    ——缓和现场气氛！


    所以大奖如下：


    三等奖：每人一双价值 198 元牛筋底防滑健身鞋；


    其实这个鞋子批量采购也就 15 块钱一双，而且自己不买单，既然学《猪买单》自己花钱那就不对了，肿么办？


    找旁边的美容院赞助，说：“客人穿着你家的广告鞋就想起来到你家来美容……” I 服了 U……


    二等奖：30 名，价值 998 元美容体验卡一张；


    这个奖品也不用自己买单，跟附近的美容院合作，说：“帮助你找客人，最好的广告叫做产品，把广告费省下来直接回馈给消费者……给你30个客户，你也没有把握留下来十个八个让他们再次交钱给你？”


    美容院会怎么说呢？肯定愿意啦！


    ![](img/9e495c245c6fc762e84f842b252dc362_170_0.png)


    一等奖：3名，价值5万元股东卡一张；


    所以这里要隆重介绍这个奖品，只要有这张股东卡，就可以享受健身房每年的股东分红，而且可以转让给别人价值5万元。


    I服了U，现场的人傻眼了，还有这个好事？


    ## 第五步骤：成交股东


    陈坤继续做催眠演讲了……


    经过一连串的催眠问话之后，当场成交400万；


    一诺老师从来没有公开过这段问话，因为这是弟子密训的内容！不过从现在开始一诺老师不靠培训赚钱了，所以，就毫无保留的将陈坤问的必杀成交话术告诉大家……


    陈坤说：“各位觉得这个健身房有没有前途！”


    大家说：“有！”


    陈坤说：“认为有的请举手！”


    现场几乎全部举手……


    陈坤说：“大家觉得在下的收钱能力如何？认为还可以的请举手……”


    结果刷的一下，现场几乎全部举手……


    ![](img/9e495c245c6fc762e84f842b252dc362_171_0.png)


    陈坤说：“我们每周都有几次这样的活动，今天才150人，收了十几万，周围有几万居民，大家相不相信一天不来，十天不来，后面他们有时间一定会来查看，至少有20%的人可能会来大家同意吗？”


    现场的人说：“同意！”


    陈坤说：“认为周围可能会有20%的人注重健康的请举手。”


    结果刷的一下，现场全部举手……


    陈坤继续说：“如果周围 5 万人的社区有 20% 就是 1 万人，每人 998 元，即是 998 万，大家觉得有没有可能他们还会购买其他产品？认为有可能的请举手！”


    结果刷的一下，现场几乎全部举手……


    ![](img/9e495c245c6fc762e84f842b252dc362_172_0.png)


    陈坤说：“如果每年可以赚到 2000 万，这两千万全部分给各位，如果免费就可以成为股东，来现场调查一下，免费让你让你成为股东，你不会生气吧？来免费成为股东不会生气，想要的请举手！”


    结果刷的一下，现场几乎全部举手……


    陈坤说：“所以，等下会有 70 个免费名额成为股东，成为股东之后呢，今后收的每一分钱，都跟你有关系，包括刚刚现场收的钱，这都是小钱！想不想要？想要的请举手！”


    结果刷的一下，现场几乎全部举手……


    陈坤说：“即使全部分给大家，而且我每年还可以赚到几千万甚至几个亿，大家想不想知道我是如何做到的？想还是不想？”


    陈坤这样问下来，现场的人早就有点迫不及待了……


    异口同声的说：“想！”


    ![](img/9e495c245c6fc762e84f842b252dc362_173_0.png)


    陈坤说：“我表面上是开健身房的，实际上是开金融小贷公司的，各位，举个例子，如果你有 10 万，如果按照 1.5%的利息，每个月就是 1500 元收益，但是你不肯借出去，为啥呀？怕收不回来是不是？


    各位有没有之前借钱借出去要不回来的？


    有的举手示意一下。”


    结果现场有好几个举手……


    陈坤说：“100 个人当中，就有 5 个人，深圳有 2000 万人口，就有几十万人是有钱在外面要不回来的对不对？


    来，再现场调查一下如果我可以帮到你要回来，你愿意分我多少？”


    现场有人回答：“给你 50%……”


    也有人这样说：“给你 70%……”


    陈坤说：“70%太多了，我不贪心，就 50%吧……”


    陈坤挥手示意，结果上来几个肌肉男，往大家面前一站……


    陈坤接着说：“他们没事的时候就是教练，有业务的时候就帮为大家催债的……”


    “来我在调查一下，你身边有没有可能有亲戚朋友有外债要不回来的？来有的请举手……”


    结果举手的多了起来，有几个……


    ![](img/9e495c245c6fc762e84f842b252dc362_174_0.png)


    “如果我们可以帮他们要回来，给我们 50%的佣金，我们分你一半，来不会生气的，会欣然接受的有没有，有的请举手！”


    结果大家笑了，很多人举手……


    “各位，这就是我们健身房为啥免费做活动！


    为啥只收 998 元就给各位减肥，我们不是为了赚钱，只为了跟各位交个朋友，来愿意交我这个朋友的请举手……”


    结果很多人举手，也有一些没举手的……


    陈坤接着说：“放心，举手我也不会去你家吃饭，放心哈。”


    这样幽默一下，现场的氛围更融洽了，大家都举手了……


    陈坤说：“说不赚钱，那是不可能的，健身房每年赚几百万很轻松的事情，只是我不愿意赚这个钱，把钱都分给股东和员工，因为只要大家赚到钱，我就开心了……”


    ![](img/9e495c245c6fc762e84f842b252dc362_175_0.png)


    而且，告诉大家一个好消息，根据以往的业务测算，未来我们盈利主要三大块：


