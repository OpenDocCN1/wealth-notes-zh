    所有人自我介绍，然后选出一个组长，春天知道这个非常关键，于是乎，站起来发表魅力演说：“各位，我叫春天……我认为咱们的组长不是领导我们的，是服务大家的，所以我们必须选出一个有责任感，能够服务大家愿意付出的人！”


    哇，居然春天说“组长不是领导，是服务大家的”，大家都渴望被服务而不是被领导，因此，没有悬念传统当选组长！


    结果几十个小组每位组长上讲台演说，然后选出一位班长，-- 各位，当班长意味着你更加具有影响力，可以影响全班的同学！


    春天早就做了功课，因为之前上过这个课程的姐姐告诉春天：“你一定要当班长，因为当班长会得到导师的支持，会更有影响力，将来做项目更方便，有更多人投资你！”


    春天上台发表魅力演说，当然这个演讲词是提前做了功课的，是一个字一个字的扣出来的……


    ![](img/9e495c245c6fc762e84f842b252dc362_561_0.png)


    大家要知道，演讲高手都是问问题的高手，而且讲话简单明白能让人听懂！


    所以 3 分钟的演讲能讲啥呢？


    春天说：“我叫什么不重要，重要的是我能够给大家带来什么好处才最重要，大家认同吗？认同的请举手！”


    结果有一些人举手！


    春天说：“各位想要快速买房买车实现财富自由的请举手！”


    这时候台下刷的大家都举手！


    春天说：“假如有一种方法，无抵押，只需要签字就能从银行拿出 100 万，来，大家想要知道的请举手！”


    这时候台下的人刷一下全部举手！


    ![](img/9e495c245c6fc762e84f842b252dc362_562_0.png)


