    # 五环 猪


    # 第 23 节：短短 16 天创造 3000 亿美金的终极模式


    一个国家如果获得奥运会的主办权，那么这个国家对生活用品和生活服务的需求就会急剧增加，造成消费市场迅速膨胀，大量国内外游客的到来也有利于发展旅游业。


    同时由奥运经济形成的巨大商机将吸引众多投资者前来寻求合作机会，形成巨大的投资市场。


    因此奥运会的举办无疑会成为 一个国家的聚宝盆。


    ![](img/9e495c245c6fc762e84f842b252dc362_419_0.png)


    然而，你可能不知道，之前有几届奥运会都是亏损的，而且亏损严重。前几届奥运会的亏损到底有多严重？


    1972 年德国慕尼黑奥运会耗费 10 亿美元，亏损 6 亿美元；


    1976 年蒙特利尔奥运会耗费 20 亿美元，亏损 10 亿美元，'
  - '[PAGE 420]


    市政府接近破产，让 300 万居民背上了 20 年才能还清的债务；


    1980 年的莫斯科奥运会更是花去了 90 亿美元而毫无盈利。


    自那以后，没人愿意接手这门赔钱的生意，所以 1984 年的奥运会只有洛杉矶一个城市申请，它自然就中标了。


    申奥成功的洛杉矶当时面临的是这样的一个烂摊子：之前申办奥运会的钱、宣传做广告的钱……背负了巨额的负债。而举办奥运会是要斥巨资的，这钱都从哪来呢？


    在过去，各城市承办奥运会的资金来源有三路：政府资助、发行彩票和捐款。但到了这届奥运会，这三路资金都阻碍重重。


    +   第一：美国政府宣布对洛杉矶奥运会不给一分钱；


