    中间是贝壳，贝壳里面爬出来的不一定是螺：


    - 很有可能是寄居蟹！

    - 还有可能是条鱼！

    - 有没有可能是虾？有！

    - 有没有可能是蚂蟥？有！

    - 有没有可能是其他水生动物呢？有！


    完全有可能，所以你看到的未必就是真的！


    我们看实物不要看表面，事物都有很多面，表面只是其中一面，所以，不能看事物的表面，我们往往被表面所迷惑！


