    ## 第一步骤：马甲公司


    首先注册一家 A 公司，做教育培训的。


    定位定江山，这客户是谁呢？——微商！


    这几年不是微商很火爆嘛？ 就要找这群想钱想疯的人！


    就是针对微商培训，找到有 **1000** 人以上微商的团队老大，告诉他，我来给你做个培训，先不要谈价格：


    我们来谈谈能够帮到你什么——利他的好处！


    ![](img/9e495c245c6fc762e84f842b252dc362_293_0.png)


    1. 帮助你倍增团队，从 **1000** 人倍增到 **20000** 人！对，倍增 **20** 倍，在 **3** 个月的时间！你要还是要？(要)

    2. 帮助你提升业绩，**3** 个月时间里，帮助你提升业绩 **20** 倍，请问你要还是不要？(要)

    3. 帮助你提升管理团队的能力，让你可以有管理 **10万** 人团队的能力，还有就是让你能够拥有不用见面就能催眠演讲的能力，让别人给你钱，给你心，甚至把你当成神一样的崇拜！请问这是你想要的么？


    各位，这绝对是微商老大不可抗拒的好处同意吗？同意！


    可是别人会问：“那你要收多少钱呢？”


    好了，问题就是答案，说服力高手都是问问题的高手！


    学完一诺老师课程不要正面回答他，要反问他：“如果我可以帮你达成这个目标，你认为值多少钱？”


    他说：“啊，啊，啊，这个……”


    你继续问他：“值多少钱？先不管你有没有这么多钱，10万值不值？”（值还是不值？肯定值啦！对吧！）


    你继续问他：“5万值不值？”


    他会怎么说呢？标准答案——值！


    你说：“假如不需要5万，也不需要3万，也不需要2万，只需要1万，你觉得值不值？”


    ![](img/9e495c245c6fc762e84f842b252dc362_294_0.png)


    各位，1000人团队的领袖，不可能被1万块钱吓到的你同意吗？同意！


    现在，你要告诉他：“你甚至连 10000 块钱你都不需要出，我有个方案可以让你不用花一分钱，你想不想听一下。”


    他会怎么说？


    你认为他还有其他的选择嘛？


    呵呵，肯定会说想呀……


    他肯定很惊讶，所以你就给他说你的方案……


    ![](img/9e495c245c6fc762e84f842b252dc362_295_0.png)


    1. 好处是…… 你要重复说出以上各个好处，并确认这是不是他想要的！等他说 是！

    2. 价格是 1 万块，你认为值不值！等他说 值！

    3. 如果团队有 1000 个人，每人只需要出 100 块钱，90 块钱给你（团队领导），我们只要 10 块钱…… 你觉得他会不会很惊讶？肯定会同意的对吧？对！

    4. 这个钱，我们配合你收上来，你呢不用先给我，先放你那里，三个月到了，如果目标实现了，1 万给我，如果没有实现，你没有任何损失，同意吗？


