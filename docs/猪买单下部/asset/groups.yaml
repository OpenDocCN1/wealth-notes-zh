    ## 第三步骤：创造长期稳定现金流


    各位，还记得一诺老师曾经在课堂上无数次的说过：有关系的发生关系，没有关系的创造条件发生关系，听过对吧？


    先跟银行发生关系，在银行开一张储蓄卡，干啥用呢？


    ——创造流水


    做生意，每天一定有支出和收入对吧，所以呢，你每天上午 9 点要去银行把“本金”从取款机里面取出来做生意用……


    每天下午 5 点前把本金和赚的钱存进去，基本上呢，从这里就能看到你生意的规模大小……


    ![](img/9e495c245c6fc762e84f842b252dc362_116_0.png)


    你每天有 10 万进出，每个月就是 300 万流水……


    如果你生意的毛利 20% 计算，那么一个月就能够给赚 60 万毛利，一年就有 700 多万毛利，按照 15% 的授信额度，若有 300 万留存，记住是留存，就可以借到大概
    100 万左右……


    当然了，每家银行不一样……


    换言之，如果你每天 2 万，一个月 60 万，毛利 20% 计算，每月赚 12 万，一年赚 134 万，跟 700 多万的实力有的比吗？没得比对吧……


    所以，你用膝盖想一想，流水是大比较好呢？还是小比较好呢？答案是——越大越好！


    当然了，现在做生意不光是现金，有可能是 POS 机收入，还有可能是转账进出的钱。


    关于流水能不能从银行借到钱？


    ### 这里总结流水五个关键


    - 1. 创造长期稳定的现金流


    三天打鱼两天晒网的流水，这样的公司饥一顿饱一顿，收入不稳定，银行哪里敢借给你？


    - 2. 符合营业时间


    例如你是卖电子产品的，三更半夜有钱进账，也不符合实际，因为你又不是夜总会……


    - 3. 符合行业特质


    例如你做的生意，金额都有零头，而别人跟你买货都是 5 万，1 万，3 万……（汗）有没有这么巧？


    - 4. 自己人的流水不算数


    通常你配偶转账给你的金额，不算数，为啥呀？你整天就跟你配偶做生意呀？你把银行当傻子呀，啊哈？


    - 5. 要留存不要飘过


    很多人自作聪明，早上进来 5 万，下午就飘走了……

    完了，你这一天生意都没赚到钱吗？

    这做的是啥生意啊？？？

    这样的流水显然不合格，会被银行否定……


    唉，现在一诺老师说着说着就想捂脸了，大家看到了吧，这就是出版社的朋友不愿意给我出版的原因，他们说这是内幕，说啥都都行，你不能把人家的行业内幕说出来呀……


    但是，为了帮助更多人实现财富自由，为了帮助更多屌丝逆袭，一诺老师就是被千千万万的银行唾骂，也要讲真话，说实话，讲对大家有帮助的话！


    作为一直在追求真理的老师，一诺老师坚持将真相大白于天下……


    好，我们继续……


    请大家翻到下一页……


    ## 第四步骤：融资第一桶金


    当这一切都达到条件的时候，接下来要干的事情，就是融资，融资是有步骤的，大家千万不要乱来，要按照步骤来：


    - 1. 信用卡融资


    开始的时候，信用卡不要办理太多张，3 张最佳，为啥？因为非常缺钱的人才会疯狂办理很多张，所以一个正常人 3 张信用卡是合理的。


    而且，记住了：信用卡的钱不要乱花，在准备投资之前，千万不要办理分期，一旦分期，银行就会警觉，甚至有些银行认为你可能是缺钱了！！！


    ![](img/9e495c245c6fc762e84f842b252dc362_119_0.png)


    - 2. 银行授信


    是的，当你办理了信用卡，不可以套现，消费的额度应该不超过总额度的 50%，要留有一定的额度，想想看借多少给你都花多少，这也太夸张了吧……所以这一步融不到钱，基本上都是被信用卡过度透支给害的！


    犹太人有个习惯，身上总是喜欢怀揣现金，但是他们总是不去用掉，而且还是习惯的再去赚更多的钱！


    这叫做——财气吸财，人气吸人！


    反观你身边的人们，有几个带着现金放很久不花的人？来给我找找看，能找出来几个？


    所以这些人，都是难成大事的人！


    20 年前一诺老师听过的最棒的一句话：


    ![](img/9e495c245c6fc762e84f842b252dc362_120_0.png)


    小赵从 A 银行融资 100 万，从 B 银行融资 50 万，经过半年的包装，啊哈，包装这个词很久没有提了，是的，是包装……按照银行要求的融资条件、办公地址、合法流水、社保等……总之一句话，按照银行的条件来……这里提醒大家，是包装，不是造假！是按照银行的要求，来提供银行认可的条件！


    - 3. 金额放大


    这一步很关键，融到 150 万，存 100 万定存在某银行，找行长签字办理 15 万信用卡+15 万授信=30 万。


    这一步挺关键的，要找到比较偏远的小地方，那个地方的银行八百年都见不到过百万的存款，特别是等到季度末银行缺钱的时候；找银行谈判：“我帮你完成任务，你要帮我批大卡”，别不好意思，富人总是喜欢谈判，穷人总是听天由命！


    卡下来之后，把定期存款取消，再换一家银行……


    如法炮制……


    - 4. 刚刚讲到哪了？3 对吧？该讲 4 了，对还有 4……


    唉，还是算了吧，第 4 点这里不方便说，等有机会参加一诺老师的课程，再谈这一点，太敏感了，真的……


    ## 第五步骤：复制方法


    小赵成功的信用融资、信用卡融资等各类融资 300 万左右，接着如何做呢？


    很简单，成功就是简单的事情重复着做！


    小赵的老婆、姐姐、姐夫、哥哥、嫂子，全家总动员……


    在这里提醒一下，为什么选择电子产品作贸易公司（融资马甲）因为电子产品价值高！一箱元器件有时候就几十万，而


    如果你选择的马甲是便利店，I 服了 U……这下你可要晕倒一万次，为啥呀，想想看银行借给你 100 万，你便利店里面的矿泉水、可乐、方便面，这能值多少钱？100
    万要多少货？？？


    所以，小赵全家总动员，选择的马甲都是什么呢？


    高附加值产品的公司，也就是公司的实际经营范围都是高附加值的产品！


    记住咯，千万千万千万不要是茶叶！


    呵呵，这个一诺老师问过某银行行长，该行长说：“之前吃过亏，有人跟银行借了几百万，结果还不起，就用茶叶抵债，一盒茶叶几千上万块，I 服了 U，拍卖会的大门都进不去……”


    从此银行是“谈茶色变”……


    小赵的公司只不过是用来融资的马甲，远看是贸易公司，近看是贸易公司，进去一看还是贸易公司，其实呢……


