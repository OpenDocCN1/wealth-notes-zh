    各位，如何整合别人？就是要做到让别人目瞪口呆、不可思议……（成功者做别人做不到的事情！）


    ![](img/9e495c245c6fc762e84f842b252dc362_69_0.png)


    春天说：“这就对了！可是今天我要告诉大家，一个方案，这个方案就能做到！”


    春天继续说：


    “各位，4年的生活费是10000元，现在我们只要拿出四分之一的生活费，2500元，20个兄弟5万块，我们共同成为这家酒楼的股东，这样我们自己吃饭不用再花钱，而且，每个月咱们还可以分红！”


    这时候大家你看看我，我看看你，都不说话……


    大家都陷入了思考中……


    但是大家又没有做过生意，又不知道该思考什么……


    其实大家就是一脸茫然加上心里没底而已……


    春天当然知道他们在想什么，所以……


    春天接着说：“我知道大家一定在想，万一亏了呢？因此，我已经想好了，只赚不亏！各位想不想知道为什么会只赚不亏？？？”


    ![](img/9e495c245c6fc762e84f842b252dc362_70_0.png)


    春天说：“我先问大家，是不是很多同学都跟我们一样，吃腻了食堂的饭菜，也想天天上酒楼吃饭？”


    春天问：“有还是没有？”


    现场的同学说：“有啊！”


    有同学说：“很多呀！”


    春天问：“我们每个人找三五位能不能找得到？”


    现场的同学大声说：“能！”


    春天问：“我们免费让他们试吃一顿，就像今天请客一样，有没有可能找三五位捧场的同学？”


    现场的同学声音更大了，说：“能！”


    春天问：“一两个月下来，有没有可能找到十位八位？”


    ![](img/9e495c245c6fc762e84f842b252dc362_71_0.png)


    大家注意春天的问话方式，凡是不是说得太满太过了，不要说绝对怎么样，那很低级……


    - 低手都说保证如何如何……

    - 低手的答案都是自己说出口!

    - 高手都是问有没有可能……

    - 高手的答案都是别人说出口!

    - 低手都卖绝对性，高手只卖可能性!


    ![](img/9e495c245c6fc762e84f842b252dc362_71_1.png)


    高手想要的答案从来都不是自己说，都是从对方嘴里说出来，这样你就可以说：“是你说的……”


    《猪买单》里有一节课叫做《终极催眠术》就是训练你拥有：一步一步引导别人说 YES 的能力，会在【猪买单】APP 里面免费给送给大家，名额有限，送完为止……


    我们回来看，经过春天的引导问话……


    春天问：“我们免费请他们试吃一顿，就像今天请客一样，有没有可能找三五个捧场的同学？”


    现场的同学说：“那肯定能！”


