    然后再去哪里？


    - ——看衣服，专挑贵的看！

    - ——看手表，挑最贵的看！

    - ——去各种奢侈品专卖店……


    服了U，就出现了朋友圈高大上的一幕一幕……


    微商开会的时候，拼命的发照片，特别是一定要住五星级酒店，一个房间2张床拼团价800块，但是这800块不能白花了，小薇如何做呢？首先把整个团队叫进来，拍照，每个人都拍照，录小视屏，多拍几个角度，留着下次用，下次说：“啊，每次都住这个酒店，熟悉的感觉……”其实也没关系，一个酒店的不同房间其实风格都差不多……


    然后大家都拍照了，拍完照片，让服务员加床，然后就有三张床了，三张床睡9个人，每个人只要出90块钱……


    这样大家就赚到了高大上的朋友圈……


    ![](img/9e495c245c6fc762e84f842b252dc362_449_0.png)


    然后了解了五星级酒店的环境之后，今后就这样干了……


    早上来到一家五星级酒店，前门拍照后门开溜；


    或者是在五星级酒店咖啡厅坐下来，告诉服务员等下还有几个朋友，等朋友来了一起点，然后服务员走开了……


    拍照，拍完装作接电话：“喂……喂……啊……啊……你在哪里？好好，我出来接你……”


    告诉服务员：“我等会过来，我出去接人……”


