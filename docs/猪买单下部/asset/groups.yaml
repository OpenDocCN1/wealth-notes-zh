    \ 公司每年提供若干小时节目。\n\n一切搞定之后。\n\n#### 第三步骤：他找到一家股票已成仙的香港上市公司老板\n\n讲他手中掌握着大量的广告时段经营权，这足以使他每年获得几个亿的广告收益。\n\
    \n老板听后，心知肚明——这就是一盒沙丁鱼罐头……\n\n![](img/9e495c245c6fc762e84f842b252dc362_100_0.png)\n\
    \n#### 第四步骤：上市公司以 现金+股票 收购 A 公司 30% 股权\n\n该读书人立即成为上市公司第二大股东。\n\n#### 第五步骤：投资制作公司\n\
    \n跟上市公司合作后，所获现金拿出部分投资给制作公司，以兑现诺言。\n\n读书人如此这般折腾后，又成了有钱人，时间不超过两年。\n\n![](img/9e495c245c6fc762e84f842b252dc362_101_0.png)\n\
    \n一诺老师总结一下，成功的关键就是——整合资源\n\n- 第一资源：电视台\n  电视台有广告时段，没节目制作能力；\n- 第二资源：制作方\n  制作方有节目制作能力，没有节目制作资金；\n\
