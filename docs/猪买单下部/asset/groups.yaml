    ## 第三步骤：创造长期稳定现金流


    各位，还记得一诺老师曾经在课堂上无数次的说过：有关系的发生关系，没有关系的创造条件发生关系，听过对吧？


    先跟银行发生关系，在银行开一张储蓄卡，干啥用呢？


    ——创造流水


    做生意，每天一定有支出和收入对吧，所以呢，你每天上午 9 点要去银行把“本金”从取款机里面取出来做生意用……


    每天下午 5 点前把本金和赚的钱存进去，基本上呢，从这里就能看到你生意的规模大小……


    ![](img/9e495c245c6fc762e84f842b252dc362_116_0.png)


    你每天有 10 万进出，每个月就是 300 万流水……


    如果你生意的毛利 20% 计算，那么一个月就能够给赚 60 万毛利，一年就有 700 多万毛利，按照 15% 的授信额度，若有 300 万留存，记住是留存，就可以借到大概
    100 万左右……


    当然了，每家银行不一样……


    换言之，如果你每天 2 万，一个月 60 万，毛利 20% 计算，每月赚 12 万，一年赚 134 万，跟 700 多万的实力有的比吗？没得比对吧……


    所以，你用膝盖想一想，流水是大比较好呢？还是小比较好呢？答案是——越大越好！


    当然了，现在做生意不光是现金，有可能是 POS 机收入，还有可能是转账进出的钱。


    关于流水能不能从银行借到钱？


    ### 这里总结流水五个关键


    - 1. 创造长期稳定的现金流


    三天打鱼两天晒网的流水，这样的公司饥一顿饱一顿，收入不稳定，银行哪里敢借给你？


    - 2. 符合营业时间


    例如你是卖电子产品的，三更半夜有钱进账，也不符合实际，因为你又不是夜总会……


    - 3. 符合行业特质


    例如你做的生意，金额都有零头，而别人跟你买货都是 5 万，1 万，3 万……（汗）有没有这么巧？


    - 4. 自己人的流水不算数


    通常你配偶转账给你的金额，不算数，为啥呀？你整天就跟你配偶做生意呀？你把银行当傻子呀，啊哈？


    - 5. 要留存不要飘过


    很多人自作聪明，早上进来 5 万，下午就飘走了……

