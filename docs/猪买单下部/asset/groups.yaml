    ##### 微商心法 2：奢侈的生活


    有些人，闲着无聊，吃个快餐也发朋友圈，I 服了 U，这样的人我真是无语了，来我们看看小薇是怎么做的……


    10 个小薇一起 AA 制去吃饭，每人 50 块去有档次有品位的地方吃饭，这样做下来之后，大家心照不宣做同样的动作，菜一上来，首先朋友圈先吃，就是先拍照，然后发朋友圈。


    一个一个的拍，然后再组合在一起拍，等大家都拍完了，才吃饭，非要做一个有品位的资深吃货……


    买买买！这群人整天没事就去逛街，到了珠宝行，把最贵的珠宝给我拿过来，然后拍照——手上的钻戒、脖子上的珍珠、脚上的链子，统统拿过来试一遍，然后煞有其事的发微信，说：“老公，你看这款怎么样？还是哪款比较好看？如果你看好了，就告诉我，马上买哈……”


    销售员一看，哇，款姐来啦，好好服务……


    最后没有看上一个，对销售员说了一句：“这些姐都喜欢，等会我带我老公一起来，让他掏钱，你都给我留着哈……”


    I 服了 U，销售员一脸槽遁的看着款姐离去的身影……


