    # 第 04 节：沙丁鱼标的及其概念只不过是用来交易的马甲


    《猪买单》课程有 300 多只小猪，36 个模式，几乎都跟沙丁猪有关系，所以大家务必要好好学习 “沙丁猪” 这一课……


    先给大家讲一个沙丁鱼的故事……约翰从英国 1 美金买来 1 盒沙丁鱼罐头，后来标价 5 美金卖给了汤姆……


    汤姆回去研究一个晚上，第二天给沙丁鱼罐头穿了一个“马甲”叫做——【皇家专供】沙丁鱼罐头，来自英国女皇御厨的亲自烹制……


    于是汤姆标价 50 美金，卖给了乔治。


    乔治精通包装技术，于是又给沙丁鱼罐头穿了一个“马甲”叫做——【稀缺性】，说沙丁鱼一般分布于南北纬度 6~20 度的等温带海洋区域中。可是，这罐沙丁鱼罐头的选材却来自——南极！对！没错，来自南极！在南极冰川底部发现的，南极考察队动用潜水艇破冰进行捕捞！极其罕见、极其珍贵……


    I 服了 U……于是标价 1000 美金卖给鲍尔。


    鲍尔琢磨着，这个鱼的价值何在？于是鲍尔也给沙丁鱼罐头穿上一个“马甲”叫做——【疗效】，说南极一共发现的鱼群制作出6盒沙丁鱼罐头，其中5盒治愈了5个病人，他们分别患有：癌症、艾滋病、心脏病、糖尿病、帕金森，难以置信的是三个月他们食用之后，哇！不可思议耶，居然完全康复了！如此奇效，全世界仅剩这一瓶……I服了U……


    于是鲍尔标价10000美金卖给了巴顿。


    巴顿有家卖水的公司，觉得这一盒沙丁鱼罐头，怎么卖也只能卖一次，如何才能像水一样源源不断，卖很多钱呢？


    ![](img/9e495c245c6fc762e84f842b252dc362_84_0.png)


    经过无数个昼夜的研究，巴顿给沙丁鱼罐头穿了一个更加高大上的“马甲”并且开记者发布会，当着记者的面宣布人类有史以来的最大伟大的发现……这个马甲就是【科学发现】，从这盒沙丁鱼罐头的沙丁鱼基因中研究发现，这些沙丁鱼有750岁，之所以能活750岁，是因为南极冰川下面的水质能够起到平衡基因、抑制细胞分裂速度与延缓衰老的作用！


    这一伟大的发现，意味着人类能够延长 250 倍的寿命，沙丁鱼寿命是 5 年，而南极冰川水质生活的沙丁鱼已经活了多久？750 岁，是正常寿命的 250 倍！


    重点来了，经过科学家 1500 次的实验证明，这个水是长寿之水！I 服了 U…… 各位有木有觉得似曾相识的感觉？


    ![](img/9e495c245c6fc762e84f842b252dc362_85_0.png)


    所以，巴顿成功的把卖沙丁鱼罐头收购过来，并把概念装入自己的壳公司，卖更高附加值东西——南极冰川之水！


    于是，巴顿卖水发了大财……


    有一天，巴顿觉得这盒沙丁鱼罐头没啥用了，就 10 万美金卖给了罗密欧……


    生性单纯的罗密欧把沙丁鱼罐头打开一看！


    I 服了 U……


    My day，沙丁鱼罐头是坏的！


    罗密欧找到巴顿算账，顿找到鲍尔，鲍尔找到乔治……


    后来大家都互相指责，最后以一句经典的话：“罐沙丁鱼是用来交易的，不是用来吃的！”


    ![](img/9e495c245c6fc762e84f842b252dc362_86_0.png)


    故事还没结束，沙丁鱼罐头的风波，导致了多米诺骨牌效应——人们因为知道沙丁鱼罐头的事件，从而怀疑“南极冰川之水”的作用，因此巴顿的南极冰川之水公司的业务一落千丈，经过媒体发酵后事态继续恶化……从此萎靡不振！


    巴顿痛定思痛，总结出一句话——沙丁鱼罐头的秘密应该永远烂在心里……


    ![](img/9e495c245c6fc762e84f842b252dc362_86_1.png)


    佛曰不可说不可说，一说皆都是错……


    是的，很多时候，商业机密只能是自己知道，第二个不要告诉。


    通过这个沙丁鱼罐头的故事，我们学到五点：


    1. 沙丁鱼罐头只是用来交易的载体——壳；

    2. 沙丁鱼罐头每次升值都因为换上了更高大上的马甲；

    3. 沙丁鱼罐头不是用来吃的，而是用来交易的；

    4. 要学会利用有限昂贵的资源去生出无限而廉价的资源；

    5. 永远不要泄露沙丁鱼罐头的秘密。


    沙丁鱼罐头的故事讲完了，沙丁鱼最重要的是告诉我们——沙丁鱼罐头就是一个交易的马甲！


    沙丁鱼罐头“物理作用”是可以吃的，但是资本角度来说已经超出了“物理作用”，已经变成了交易的载体！


    一诺老师尽量的解释清楚一些，这里学不会搞不明白，后面的案例就没有办法继续，因为在后面的案例中，会不停地提起两个字——马甲！


    - 上市公司只不过是资本家手中的马甲！

    - 收购并购是上市公司提高市值的马甲！

    - 有些项目其实就是资本家圈钱的马甲！


    后面还有很多马甲，听一诺老师跟大家举例……


