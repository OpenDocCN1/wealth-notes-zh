    ##### 微商心法1:提升形象


    去照相馆，定制一套形象照，想想看，微商一辈子可能大家都不见面，都看什么呢？首先就是你的形象照片……


    来请想想一个画面：一个人穿着邋遢，蓬头垢面，浑身恶臭，满嘴胡言乱语，左手拿个棍子，右手拿着一个碗，来猜猜看这个人像什么？——乞丐


    再来想想一个画面：某人脚踩电动车，电动车后面两个大大的包裹，满脸晒得乌黑，焦急的在马路上穿梭，手里拿很多快递单，来猜猜看这个人像什么？——快递员


    请再想想一个画面：某人头上戴着安全帽，满身的水泥，背心被汗水浸透，脖子上挂了一个毛巾，从工地里走出来，手拿一个盒饭，来猜猜看这个人像什么？——农民工


