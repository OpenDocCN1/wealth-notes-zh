    早些年我听过四川人讲过一个段子：


    说的是在茶馆里几个人的装逼境界！


    A 吃完咸菜，出门前拿了一块猪皮抹抹嘴，一嘴的猪油让人看起来很有钱的样子，跟一起喝茶的人说：“刚刚吃完红烧肉！”


    B 说：“我家不吃红烧肉，鸡腿吃不完都往屋顶上扔！”


    C 从口袋里拿出一个收音机改装的东西，反正带天线，那个年代大哥大都是带天线的，C 对着天线说：“喂？喂！听得到嘛？等会让保姆出去买两斤菠菜晚上我要吃面条，啥子？还吃鱼翅？不吃，都吃腻了！啥子？燕窝？也吃腻了！告诉你老子只吃菠菜！啥子？不方便？怎么不方便？啥子？嫌远？那就让司机开我的奔驰送保姆去，抓紧去！再给老子啰嗦，老子就炒你鱿鱼……”


    正当旁边的人都懵逼的时候……


    D 也对着上衣口袋漏出来的天线讲话：“喂？你哪个？李部长？哪个部门滴？是公安部、农业部、还是国防部？啥子？你是交通部的李部长？哦，晓得晓得，上次在人民大会堂接见过你，啥子事快说！啊？啥子？让我给中国滴火车头提供一千万个转向灯？我说李部长呀，上次给飞机装的雨刮器还没有给我钱来！啥？我小气？不是我小气，这不是小数目，你们还少我
    20 多个亿，我过几天要去米国，这个钱准备过去给孩子买点生日礼物，你一定要快点给我！啥？财政部的张部长已经安排专机把钱给我运过来？晓得，好，你办事我放心，就这样哈……”


    I 服了 U，（捂脸，这话，没法接……）


