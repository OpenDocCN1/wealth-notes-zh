    春天说：“我们 20 个兄弟，每人找 10 个人，就是 200 人，这 200 人，每个月都交 200 元生活费，每个月就是 4 万块，饭菜成本按照 2 万每个月来算，每天
    666 元，租金人工每月不到一万，我们还能有钱赚！”


    ![](img/9e495c245c6fc762e84f842b252dc362_72_0.png)


    在这里补充一下，这个是二十多年前的案例，那时候大白菜 7 分钱一斤，白萝卜 100 块钱可以买一拖拉机！肥膘肉 2 块钱一斤，正在长身体的男学生是不会挑肥拣瘦的，主要是食堂菜里没有油，整套菜单跟成本核算，都写出来了，同学们一看，对春天更有信心了！


