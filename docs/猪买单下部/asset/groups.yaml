    APP 系统！


    #### 第九：粘性营销


    90%的人在用流氓式互动：直接销售、直接发信息、直接发广告。就好像吃瓜男追女朋友，经过朋友介绍，刚刚见面就要亲人家，结果没得逞。吃瓜男加了 V 聊，结果根本不聊其他的，开口就说要亲亲。这就是令人作呕的流氓式互动。


