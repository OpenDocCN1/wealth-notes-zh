    \n是的，你没有听错！\n\n一诺老师做个大胆的举动，前期精力有限，只收十八个项目，这十八个项目的顾问全部免费、培训全部免费，而且你投资的每一分钱，亏了一诺老师还赔给你，亏多少，赔给你多少！\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_701_0.png)\n\n突然想起一首歌：把悲伤留给自己，你的美丽让你带走！\n\
    \n把你的风险留给一诺老师，赚的钱你带走！\n\n不知道只赚不亏的生意，你敢不敢做？肯定敢！不敢做还是人嘛？那如何做呢？\n\n让我们一个共创奇迹……\n\n\
    当你看《猪买单》超100遍以上，奇迹将在你身上出现！这种奇迹叫做：羊毛出在狗身上猪买单！\n\n## 第一步骤：你的好处\n\n- 1. 独立自主：品牌、产品、公司100%独立自主权；\n\
    - 2. 商业模式：为你量身打造整套商业模式；\n- 3. 顾问团队：一诺老师及整个团队是你坚强的后盾；\n- 4. 招募人才：整个平台的人才引流给你；\n\
    - 5. 培养人才：定期派员工学习，一诺老师帮你培养人才；\n- 6. 十八罗汉：平台培养十八个项目，作为榜样标兵；\n- 7. 书籍案例：《猪买单》会载入你的案例；\n\
    - 8. 课程案例：一诺老师课程讲你的案例；\n- 9. 免费学习：夫妻终身免费参加一诺老师所有课程；\n- 10. 亲密联系：拥有一诺老师个人V信高效沟通；\n\
    - 11. 平台资源：平台整个资源都为为你所用；\n- 12. 甩手掌柜：签订公司项目、资产托管协议，保证资产零损失，你只需要环游世界、查看财务报表就行了，操心操肺的事情，让一诺老师的团队来干！\n\
    \n## 第二步骤：10亿小目标\n\n- 1. 共同定一个3年的小目标——公司市值10亿；\n- 2. 加盟商人数超过1万名；\n- 3. 公司积累2000万粉丝；\n\
    \n## 第三步骤：零风险对赌\n\n- 1. 终止合作：\n  任何一项没有完成，你即可终止合作；\n- 2. 风险买单：\n  利润-投资=正/负利润\n\
    \  你亏多少，一诺老师的“资产管理公司”赔给你多少，包括所有人工、办公租金、办公耗材、电话费、招待费、车旅费等，就是这个项目公司所有运营发生的费用，最后一算账，亏了对吧？亏多少一诺老师补偿你多少！\n\
    \  请问你爽不爽？———大写的爽字！\n- 3. 结果对赌\n  输了一诺老师赔给你，公平吧？(公平)\n  什么公平，不公平！一诺老师只有风险没有利益愿意干？\n\
    \  那么怎么平衡利益呢？\n\n### 第一：利润分配\n\n利润的 10%—51%归一诺老师的“资产管理公司”；\n\n有人说多了！嗯？谁说的？那他就一边凉快去，就这点格局的人，不要浪费一诺老师和整个团队的时间！\n\
    \n哎，搞清楚了，是帮助他赚的里面他只需要分 10%—51%，是市场的钱，又不是从他口袋里面掏钱出来，如果没有一诺老师他连剩下的都没有同意吗？(同意)\n\n\
    既然对赌，一诺老师的团队付出的是实实在在的人力、财力、物理、精力、资源，而他只需要拿未来的钱，支付给一诺老师，连这种格局都没有！还属于人类吗？对不起，一诺老师只惠及全人类，非人类的勿扰！\n\
    \n我想如果主动找到一诺老师团队的人，肯定是见过世面、见过钱、有格局、有使命、有大爱的人！\n\n### 第二：10 亿目标完成\n\n**首先，终止合作：**\n\
    认为自己厉害了，好，项目物归原主，本来就是你的，无可厚非，一诺老师的团队再去帮助其他人；\n\n**其次，继续合作：**\n如何合作呢？那就是合并财务报表，合并到一诺老师的“资产管理公司”，因为这家“资产管理公司”会同时托管十八个甚至更多项目，这家公司是用来上市的，所以合并你也不吃亏。\n\
    \n为啥？因为有这么专业的团队帮你打理公司，让你只赚不亏还不愿意？那简直不可理喻！\n\n还有一个好处，就是置换股权给你。\n\n举例：你的公司去年盈利1亿，给你估值10亿，因为一诺老师的“资产管理公司”同时托管了几十个这样的公司，加上资本的介入现在估值1000亿，那你就占一诺老师“资产管理公司”的1%，这样就成为上市公司的原始股东。\n\
    \n因为资产管理公司股份97%是团队成员的，一诺老师只占3%的比例，各位你想要多少？\n\n你说，那我这么多比例，才换这么少！\n\n![](img/9e495c245c6fc762e84f842b252dc362_705_0.png)\n\
    \n如果这样想的银，大家赶紧终止合作，对于这种银一诺老师懒得浪费口水！（朽木不可雕也）\n\n## 第四步骤：设置门槛\n\n这样的事情，连假冒伪劣的商家都来了，你觉得这样有意义吗？有质量吗？(没有)\n\
    \n有没有可能有假冒伪劣产品？有没有可能？(有)\n\n有没有可能会有诈骗忽悠一笔钱就跑路的？(有)\n\n有没有可能他们的产品质量不行服务跟不上，到时候全部来找一诺老师算账，有没有可能出现这种情况？(有)\n\
    \n有没有可能出现即使是这样的只赚不赔，他格局小到一点都不想分钱的，有没有可能有这种人？(有)\n\n假如这种铁公鸡有没有可能不是为了合作，而是为了骗取一诺老师整个商业模式、市场营销及运营方案的，有没有可能就是为了骗取商业机密的？(有)\n\
    \n有没有可能有些人就是无聊，来浪费一诺老师团队时间，一诺老师带着整个团队加班加点做出一套方案，最后开始执行，这个人玩消失？有没有可能有这样无聊的人？\n\n\
    所以怎么办？\n\n### 第一：资金门槛\n\n1000 万项目运营、资产托管保证金，项目优质可适当放宽。\n\n打 100 万合作诚意金→面谈签协议→7\
    \ 天打尾款；\n\n收到钱之后，一诺老师的资产管理公司，抽调专门骨干力量，组建专业的项目运营团队。\n\n所有的风险一诺老师承担，你就是纯赚不赔的那个人！\n\
    \n### 第二：项目门槛\n\n- 1. 大众消费：吃、喝、衣、食、住、行、美容、保健、日化等；\n- 2. 流通性强：只要能用快递发往全国各地及全世界的；\n\
    - 3. 互联网+：互联网企业或能使用互联网资源的企业。\n\n例如：白领人群\n什么产品跟他们有关系？白酒、茶叶、美容保养品、服装、鞋帽、首饰、零食、电脑、手机、电子产品……\n\
    \n例如：大学生人群\n他们需要哪些产品？美容保养品、服装、鞋帽、首饰、零食、电脑、手机、电子产品……\n\n![](img/9e495c245c6fc762e84f842b252dc362_707_0.png)\n\
    \n非主流谢绝签约：\n\n非大众消费品，单平台也欢迎入驻，只是一诺老师没有时间和精力专门组建团队扶持。\n\n哪些是非大众消费品、非主流产品？\n\n例如：古董、名人字画等艺术品，这些市场需求太小；\n\
    \n例如：瑞士滑雪用品，有几个人回去瑞士滑雪？\n\n例如：左撇子网球拍，哪有这么巧左撇子还打网球，这种客户又能找到多少人？不值得投入大的精力去做！\n\n\
    公司没有使命感、没有大爱、没有格局、没有社会责任的企业谢绝合作！\n\n公司处于严重负债的企业不收，都亏得欠了几个亿，还想拉一诺老师垫背？你对一诺老师太好了吧？多谢！但不合作！\n\
    \n具体情况，欢迎有实力的企业前来洽谈。\n\n## 第五步骤：组建团队\n\n各位请问大家了，这个世界上有没有人做企业做到现在很累的，想要退休的有没有？(有)\n\
    \n他们为什么不退休？因为他们退休了没人照看企业！\n\n所以怎么办？\n\n世界这么大，一定会有人找到一诺老师托管企业，大同意吗？(同意)\n\n重点来了，世界上有没有一些人，他们满腹抱负，却没有施展才华的舞台？有没有？(有)\n\
    \n有没有一些人他们很想创业，但是没有资金？有没有？(有)\n\n如果你是一位有梦想、有目标、有使命、有激情、有行动力、有改变自己和家人命运的决心！你是这种人吗？（是）\n\
    \n如果你是这种人，一诺老师来组建团队，根据你的特长、志向、工作经验、工作能力等，大家进行分工，共同做一些项目，你适合做哪个项目，就接管哪个项目。\n\n\
    ![](img/9e495c245c6fc762e84f842b252dc362_709_0.png)\n\n> 请把这句话记下来\n> 创设施展才华的时空，搭建张扬个性的舞台！\n\
    > ——一诺老师\n\n这样创业者有了项目支持、资金支持、团队支持、顾问老师支持、平台资源支持！\n\n基于此，我们要做到：\n\n# 大跨界 · 大融合\n\
    \n## 1. 共享客户\n\n这样因为客户都是同一个群体，找来的客户，优先推广十八个托管项目的产品、商机和投资机会。\n\n例如你现在的项目假设跟十八个有\
    \ 1000 万以上实力的企业共享客户，每个项目公司有 1 千万粉丝，共享之后你就有 1.8 亿粉丝，各位这种裂变就像核武器一样。\n\n## 2. 共同资源\n\
    \n资产管理公司提供办公场地，充分的做到集团化运营，和科学的管理，共享培训导师、共享办公设备、共享顾问团队。\n\n办公场地集中化，场面更大、更气派、更彰显实力！\n\
    \n## 3. 共享资金\n\n例如本次宣传费用 900 万，十八个项目每个才出 50 万，集中资金营销宣传，才能事半功倍！集中优势兵力打歼灭战！\n\n\
    ## 4. 降低风险\n\n即使有两三个亏了，资产管理公司从其他项目赚的钱，来补贴这家公司的亏损，就可以起到抗风险的作用。\n\n现在是抱团取暖的时代，过去单打独斗的方式越来越行不通，就像一首歌\
    \ “众人划桨开大船” 的歌词唱的一样：\n\n一根筷子轻轻被折断\n十双筷子牢牢抱成团\n一个巴掌拍也拍不响\n万人鼓掌声响声震天\n一加十十加百百加千千万\n\
    你加我我加你大家心相连\n同舟嘛共济海让路\n号子嘛一喊浪靠边\n百舸嘛争流千帆进\n波涛在后岸在前\n\n# 案例分析:\n\n- 1. 拥有一诺老师为你设计模式，您必将事半功倍；\n\
    - 2. 拥有一诺老师团队亲自主导，您不用操心操肺；\n- 3. 零风险保障了企业家的利益，您再无后顾之忧；\n- 4. 对赌奖励提了高团队积极性，您只会越赚越多；\n\
    - 5. 集团运营增加实力降低成本，您站在巨人肩膀；\n- 6. 把不同产品卖给同一批顾客，您共享平台资源；\n- 7. 合并财务报表目标3年入市，您共享资本红利；\n\
    \n当你看《猪买单》超 100 遍以上,奇迹将在你身上出现! 这种奇迹叫做:羊毛出在狗身上猪买单!\n\n没有输家只有赢家，为大家买单的是托管模式。\n\n\
    为了方便大家记忆，我们给这个案例起个好听的名字叫：\n\n# 托管猪\n\n- 如果你想改变自己的命运！\n- 如果你想改变家族的命运！\n- 如果你想让人生华丽转身！\n\
    - 如果你想让世界对你刮目相看！\n- 如果你想拥有改变世界的能力！\n- 如果你想拥有免费学习的机会！\n- 如果你想免费整合办公场地！\n- 如果你想免费整合人力物力！\n\
