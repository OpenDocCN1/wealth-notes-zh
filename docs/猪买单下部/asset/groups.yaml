    ## 第二步骤：整合明星


    通过达叔、雄哥、业哥等老戏骨多年的关系，很多明星都买了前辈的面子，结果纷纷签约合作“老戏骨”的明星经纪公司，这就是一诺老师常说的——


    把这句话记下来：**少时靠背景，长大靠实力，老了靠名气！**


    出生没有什么背景，长大不愿意努力没有打拼出实力，自然老了就没有名气，就没人买你面子……


    服了 U，不可思议，很多明星都被整合了……


    ## 第三步骤：开展业务


    能够外包的统统外包……


    让很多明星经纪公司帮你找客户，如何谈呢？


    很简单，有的公司愿意支付现金的，就收代言费！这是一笔收入……


    最重要的不是为了收代言费，其实是为了参股项目公司，一起分享销售分润，或者是资本带来的红利……


    如何谈判呢？量大是致富的关键，所以……


    简单，找很多企业，一个个的谈，谈的内容是：


    你是卖面膜的、你是卖保健品的、你是卖服装的，现在如果华仔给你代言，你会得到如下好处：


    - 提升档次：瞬间拉升品牌逼格；

    - 信用加持：华仔的粉丝就变成了你的粉丝；

    - 增加销量：由于明星的加持销量会大涨；

    - 渠道更广：加盟商会更有信心，纷纷加盟你的项目；

    - 吸引投资：投资者会对你的企业更有信心；


    ![](img/9e495c245c6fc762e84f842b252dc362_361_0.png)


    总之呀，大家都会更有信心，你的企业肯定会更好，只会更好，不会更差，同意吗？（肯定同意）


    可是重点来了！


    最大的问题是什么呢？


    ——钱！


    一诺老师早就为他们设计好了，绝对让顾客不可抗拒，为什么会不可抗拒呢？——免费拥有！


    如何免费拥有呢？


    - 资产管理公司颠覆代言费了，例如 2000 万；


    有人帮你垫付代言费，帮你出钱好不好？


    - 把 2000 万的代言费做入股金，参股你的项目；


    明星帮助你卖产品、招商和影响投资人，你多赚的钱里面，我们按照股份分红，这样你一分钱都不用出，就可以拥有明星的信用加持，各位如果是你，你会不会考虑一下呢？


    哇，后来不可思议，很多企业要合作……


    重点来了，不是每个企业耍华哥，华哥都会给他代言的！


    要看企业的实力和信用，例如一个在路边卖盒饭的，让华哥代言也的确有些难为华哥对吧……


    说白了，就是每位明星的代言费价值不同，所以转换股本金的价值也不同，也会考量企业的实力，设了三个门槛：


    - 第一个门槛： 100 万左右的小项目，就让代言费几十万的明星来参与；

    - 第二个门槛：1000万以上的项日，就让代言费几百万的明星参与；

    - 第三个门槛：1亿以上的大项目，就是像华哥那样重量级的人物来参与。


    I服了U，这个项目变得不可思议，一发不可收拾，你想呀，很多现在的企业家基本上都是60后、70后、80后主导，他们都是听着四大天王的歌、看着发哥、华哥、龙哥的戏长大的，对这些人还是有感情的，早就崇拜的五体投地了……


    于是，老戏骨成立的管理公司，很顺利的参与了很多项目，每年分红都有好几个亿，而且这是源源不断地收入，比起代言费一次性的收入，那真是好的没影了……


    ## 第四步骤：授权合作


    问题来了，谁帮老戏骨去谈业务呢？


    传统办法，请员工！


    我呸！真有本事的人，有几个去打工的？


    现在都是“大众创业，万众创新”的时代，大家都在创业，有能力的用工资是请不到的……


    肿么办？


    问对人了，一诺老师的《猪买单》课程就是教会大家一种能力，这种能力叫做：“用别人的时间、花别人的钱、办大家的事情，钱进到你的口袋”。


    如果要花钱请人，那还要听一诺老师课程干嘛？


