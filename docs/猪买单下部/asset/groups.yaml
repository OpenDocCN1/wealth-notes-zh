  md: "\n先给大家讲个小故事，有一次春天打算去南疆做生意，这个生意需要一个批文，为了拿到这个批文，春天就动用公关能力，几经辗转通过某部门领导张科长的引荐，去见一个更高官阶的领导。由于南疆酷暑难耐，春天觉得反正自己是做实事有实力的人，就没有太注意着装形象，随着张科长前往面见领导……到了领导办公室，春天就把做这个项目的想法给领导汇报了一下，没想到还没有讲五分钟……\n\
    \n那位领导大发雷霆：“去去去，赶紧走！”\n\n春天傻眼了，看着张科长，张科长就出来打圆场说：“老同学，您这是怎么啦？”\n\n那位领导指着春天说：“你看看他，穿个大裤头，空口白牙就过来跟我吹的天花乱坠！你说你是什么来头？一没背景，二没公司介绍，三没一个项目说明书！”\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_243_0.png)\n\n春天刚想解释，那位领导又发话了：“要不是老同学的面子摆在这里，我早就让警察把你抓走了，骗到我这里来了……”\n\
    \n张科长懂了，连忙赔笑脸并解释：“老同学，领导……您别生气啊，他不是骗子，很有实力……”\n\n那位领导说了一句非常经典的话，这句话影响着春天的一生，领导说：“不管你是不是骗子，但是看起来不能像个骗子，即使你是个骗子，也骗的像一点……”\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_244_0.png)\n\n哎呀哎，提醒各位哟，大家不要在意，那位领导肯定是开玩笑的，就当一诺老师喝醉了说梦话吧……\n\
    \n啧啧啧，不好意思，一诺老师又说真话了，所以一诺老师这本书，真的很难出版，唉……\n\n有一位出版社主编这样说：“一诺老师呀，您这哪里是在做学问，这简直是揭别人的老底和内幕……”\n\
    \n恕一诺老师愚钝哈，我真不知道如何去说假话……\n\n所以，今后如果这本《猪买单》很不幸的成功出版，我不知道会改成什么样子？！服了 U……\n也许会“面目全非”……\n\
    所以，现在知道为什么要注册马甲公司了吧？\n注册什么公司呢？\n这次要注册两家公司：\n- 第一家：电视购物公司；\n- 第二家：媒体广告公司；\n具体怎么操作呢？\n\
