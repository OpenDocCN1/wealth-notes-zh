    \n### 第四步骤：免费蓝猫\n\n单独成立一个马甲公司\n\n这家马甲公司不同，前面的都是陪衬，为了衬托市场价格，而这家马甲公司，是用来收钱的……\n\n\
    1. 免费领养一只蓝猫押金 3000 元；\n\n但是为了防止你虐待动物，领养者只需要交3000元押金，客人一看市场上蓝猫都是 5000 到 25000 元，所以肯定这个价格不贵！\n\
    \n2. 奖励措施\n\n谁家的猫，生小猫了，生的小猫每只奖励 1000 元，蓝猫一年生一到两次，每次 3—7 只，这样不仅猫猫不要钱，而且可以赚钱，哇，这样蓝猫粉丝一听，太好了，于是更有积极性了……\n\
    \n3. 三不退\n\n而且可以退，退是有门道的——\n三不退：1. 超过 1 年的不退。2. 生病的时候不退；3. 没有接种疫苗的不退；可以确保蓝猫的健康，大家都能理解；\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_435_0.png)\n\n### 第五步骤：盈利方式\n\n……你可能会问，一诺老师他如何盈利呢？\n\
    \n- 第一个盈利方式：猫养死了，就不用退了……\n- 第二个盈利方式：主人有感情不舍得退了……\n- 第三个盈利方式：超过 1 年的不退就是赚的了……\n\
    - 第四个盈利方式：兽医（比人看病还贵）\n    - 1. 接种疫苗，蓝猫专用疫苗，要打 3 针 500 元左右；\n    - 2. 平时看病，蓝猫由于水土不服，可爱生病了（一诺老师又说实话了，捂脸……）知道嘛，猫看病比人贵多了……\n\
    \n而且如果你要退，必须是在指定兽医站看病的病例（捂脸）猫还有病例？有的！\n\n蓝猫看着好看，因为你稀缺性吧，所以谁家有的肯定拿出来炫耀一下，其实蓝猫幼崽非常难养，爱生病（眼睛流泪、身上长顽固癣、感冒、拉肚子……），从出生到长大看病不花\
    \ 3000 或 5000，起码也要 2000 打底。\n\n![](img/9e495c245c6fc762e84f842b252dc362_436_0.png)\n\
    \n- 第五种盈利方式：猫粮，一公斤 100 元（捂脸），这价格真不便宜呀……\n- 第六种盈利方式：蓝猫专用的器械，例如：练爪子的、猫窝、猫饮水机、猫衣服（捂脸）不知道这些养猫的对自己爸妈有没有这么好……\n\
    \n### 案例解析：\n\n最后小犹太人统计过一个数据，只有千分之 1 的人会来退蓝猫，其他人都不舍得退，因为有感情了……\n\n很多东西不是你表面看上去那样，现在的商业盈利模式变得越来越隐蔽，就像小犹太人的案例一样：\n\
    \n蓝猫还是那些蓝猫，在俄罗斯随处可见，没人在意，可是到了中国因为有动画片《蓝猫》的影响，大家对蓝猫有着浓烈的好奇心，小犹太人正式运用了一诺老师的“傍大款”方式，披着免费的“马甲”开始了“送蓝猫”的活动。\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_437_0.png)\n\n并且成功收取保证金，在收保证金之前又运用了“绿叶法则”来衬托蓝猫的价值，又成立蓝猫行业联盟，把所有卖蓝猫的组织起来，其中\
