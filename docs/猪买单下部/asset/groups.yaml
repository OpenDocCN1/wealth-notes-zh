    因此，之所以有那么多的创业失败者，就是因为他们没有学过一诺老师的《猪买单》课程，他们只能像赌徒一样，碰“运气”其实殊不知这所谓的运气只能注定是：十赌九输！（悲哀）


    古人们常说：“谋事在人，成事在天！”


    而很多人没有谋事的能力，却像赌徒一样的听凭“天意”，这就导致创业的路上伤痕累累，大多数的创业者都是炮灰，都是给别人垫背的！


    I服了U，这种迂腐的人，怎么配得上成功呢？


    佛祖说：众生愚昧！


    所以，需要一诺老师来度化他们，因此一诺老师上乘天命，下顺民心，来给众生法布施……


    春天经过缜密的计划之后，终于动手了……


    在这里还要插播一下，春天有个习惯，就是维护同学关系，春天知道无论经营的是什么公司，无论卖什么产品，无论提供什么服务，都是需要与人打交道！


    ![](img/9e495c245c6fc762e84f842b252dc362_60_0.png)


    春天自幼就是人际关系专家，不得罪任何人，跟任何同学都能打成一片，从来不去与人争执，要知道争赢了一个问题，却输了人心！


    所以，无论是任何人说什么，春天都是倾听，点头，顶多说一句话：“嗯，有道理！”


    当别人发生争执，他总是去劝，或者把话题扯开，避免大家的不愉快！


    因为春天早就注意经营人际关系，所以，这次春天一次就约了近二十个同学一起聚餐，春天请客！


    ![](img/9e495c245c6fc762e84f842b252dc362_61_0.png)


    春天把童鞋们都约到这家要转让的酒楼，告诉酒楼的老板，今天过来试菜，厨师的手艺好，就接了这个店做！


    老板一听，自然是很开心，但是一听说来20个人试菜，这也太夸张了吧，春天这样解释的：“靠山吃山靠水吃水，我转下这家酒楼就是因为离学校近，主要服务就是学校的学生、老师、及师生的亲朋好友……。”


    春天很会洞察人心，看到老板为难的表情，说：“这样好吧，我也不白吃白喝，你的成本算在我头上，我来出钱！”


    老板看到春天这样大方，于是欣然答应，并连忙点头说：“那就给你按五折，收个成本钱怎么样？”


    春天很为难的说：“这，这你不是吃亏了吗？这怎么好意思？？？不过看你这么有诚意，就按你说的办！”


    到了晚上童鞋们到齐后，大家开怀畅饮……


    你一杯，我一盏的，频频举杯，不亦乐乎！


    席间，春天安排了其中一位同学切入主题，这位同学说：“如果我们每天都能吃到如此可口的饭菜，那就太好了！”


    很多同学都开始附和：“是呀！是呀！……”


    不知道谁起的头，大家又开始抱怨学校的伙食差……


    大锅饭的肉要用放大镜才能找到！


    什么菜里除了舍得放盐，根本沒有一滴油……


    ![](img/9e495c245c6fc762e84f842b252dc362_62_0.png)


    从心理学角度分析，想要让别人按照你想要的去采取行动，必须要给到对方痛苦，有句话是好了伤疤忘了痛，好了怎么办？


    你就要揭对方的伤疤，这还不够，还要在伤口上撒盐……


    I 服了 U……好痛啊!!!


    对，就是要让对方感觉到痛……


    必要的时候，把伤口扯得大一些！


    这叫做——放大痛苦！


    这时候，有同学说：“学校伙食这么差，我们正在长身体，没有营养我们长不高!”


    又有人说:“营养不良影响发育，特别是营养不好大脑无法更好的思考问题，脑子都有问题了，傻了，还有将来吗？？？ ”


    还有更夸张的，说：“营养不良长不高，将来找对象都不好找……” I 服了 U……


    ![](img/9e495c245c6fc762e84f842b252dc362_63_0.png)


    其实，这里面带头说话的人:“都是春天精心安排的!”


    各位知道嘛，这就是羊群效应，羊群是一种很散乱的组织，平时在一起也是盲目地左冲右撞，但一旦有一只头羊动起来，其他的羊也会不假思索地一哄而上，全然不顾前面可能有狼或者不远处有更好的草。


    因此， “羊群效应”就是比喻人都有一种从众心理！


    ![](img/9e495c245c6fc762e84f842b252dc362_64_0.png)


    所以，想要 “头羊”的引导很重要！


    就连美国总统的选举，都是媒体引导！


    任何国家的媒体都是至关重要的 “头羊”!!!


    一诺老师不说，吃瓜群众根本不懂(捂脸)……


    舆论的走向，直接影响着民心的走向！


    说的商业一点让大家容易懂吧，你为何会去买某个品牌的产品？？？


    因为你看了广告，这个广告里往往有个明星说这个产品如何如何好对吧？？？


    仔细想想，所有的广告都是那么惊人的相似，因为他们都运用了“羊群效应”，找一个明星也就是“头羊”来引导和影响你的选择，也许你说没有呀，我没有受影响！


    别嘴硬啦，喝醉酒的人都说自己没有喝醉！


    ，你已经被“头羊”潜意识的“征服”了，只不过深入骨髓你自己不知道而已！


    ![](img/9e495c245c6fc762e84f842b252dc362_65_0.png)


    咱们接着回来继续说春天的故事，在饭桌上，同学们你一言我一语的抱怨着，加上酒精的麻醉！大家都已经是干柴烈火的状态了，就等着春天来点燃他们了！


    其实，任何时候，想要开口说服别人是要看火候的！一般人总是抢着说话，说自己想说的话，其实这是大错特错的！


    ![](img/9e495c245c6fc762e84f842b252dc362_66_0.png)


    席间大家都比较憋屈……


    看着气氛差不多了，这时候春天说：“来来来，我相信我们都会心想事成，都会成为百万富翁，因为我们不是狗熊，我们都是英雄，认同的大家连干三杯！”


    连干三杯之后……


    有人就开口说话了：“春天哥，你这么聪明，有没有好的办法，让大家每顿都吃上这么好的大餐呀！”


    春天说：“大家抬举我了！我有那么大的本事吗？”


    有几个人说：“春天哥，你就别谦虚了，我们都知道你本事大，头脑聪明，有好的方法就说说呗？？？”


    就是尧舜禹禅位一样，一定要学会恭敬和谦让……


    通俗的讲，就是要客气……


    各位，其实这个时候，才是春天该开口的时候。


    ![](img/9e495c245c6fc762e84f842b252dc362_67_0.png)


    春天说：“好吧，恭敬不如从命，我有一个方案，可以让大家不花一分钱！每天都能吃上这样的大餐！”


    这时候，有人瞪大眼睛说：“春天哥，真的假的！”


    春天说：“当然是真的了，不但是一分钱不出天天吃大餐，而且还可以赚钱！”


    几乎所有人都从醉沉沉的状态苏醒过来，目光聚焦到春天身上……


    这时候，春天压了一杯酒，说：“没错，不花钱白吃白喝还有钱赚！不知道大家想不想听一下？”


    I 服了 U……大家早已经是迫不及待了，有人就说了：“春天哥，赶紧讲吧，到底让俺怎么干？？？”


    春天说：“你们确定是吃腻了学校的饭菜吗？确定的请举手！”这时候，大家肚子里的蛔虫早就被勾起来了，每个人一边瞪大眼珠子，一边举起手来。


    春天说：“这家饭店的饭菜还可以吧？”


    大家七嘴八舌的说：“嗯！好！美味！很好吃！”


    春天接着说：“比起食堂的饭菜如何？”


    大家说：“那肯定没得比！当然是这里的好吃！”


    ![](img/9e495c245c6fc762e84f842b252dc362_68_0.png)


    春天说：“我们算一下，在学校每个月生活费 180 元，还吃不饱，每个月还要加餐，这样开支每月最少 230 元，有过过生日请客，一年算下来，怎么也要 2500
    元，大学 4 年下来，要花费 10000 元。”


    春天停顿了一下，接着说：“我想请问一下，这大学毕业的那天，你说学校会不会把四年的伙食费退给我们？会还是不会？？？”


    春天用扫视了一圈，提高了嗓门问：“会还是不会？？？”


    这时候，大家说：“哪有这么好的事？”

