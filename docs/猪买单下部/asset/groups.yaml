    上市公司吃亏了吗？没有！\n\n既然都没有吃亏，而又都是赢家，这皆大欢喜之余，我们要思考一下……\n\n这最终买单的是谁呢？\n\n我们可以看一看这张案例解析图：\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_102_0.png)\n\n——买单的不是电视台：因为电视台缺节目制作方！\n\
