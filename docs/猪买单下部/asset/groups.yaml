    上面免费传授大家！


    重要的事情再说三遍：免费的！免费的！免费的！


    一诺老师不靠学费赚钱，一诺老师投资参股了很多项目，每年分红足够一个艰苦朴素不浪费的家庭开支了……


    ## 一诺老师为什么演讲？


    就是看到很多迷茫的企业家，天天被忽悠，从来不落地！一诺老师看在眼里，痛在心里，一诺老师觉得一个靠传授知识发财的人不能够叫老师，老师的使命不是钱！


