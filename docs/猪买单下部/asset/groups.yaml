    后来小雪颠覆了整个城市的艺术培训行业，从之前的食不果腹、房租都交不起、员工工资发不起，只用了一年的时间就身价过亿，她是如何做到的呢？


    让我们一起见证奇迹吧……


    因为一诺老师课程最大的魅力不仅仅是实战案例教学，而且一诺老师还可以根据不同的行业，不同的产品，不同的企业现场辅导学员，帮助学员拥有“最佳资源配置”的能力！


    课程中会有辅导落地的作业，基本上作业做完就会有个完整的实操流程，根据这个流程就可以回去落地执行了，特别是《猪买单》课程全球免费公开之后，一定会帮助更多企业家。


    > 不以落地为目的的收费课程，都是耍流氓！

    >

    > —一诺老师


    小雪根据一诺老师的《实操落地手册》回到家里认真做作业，小雪落地方案的过程中遇到很多问题，不过都在小组的帮助下和一诺老师的辅导下迎刃而解，由于整个落地方案在课程中会给大家模板，在这里就精简到五个步骤：


    ### 第一步骤：自杀重生


    ……自杀重生，他杀灭亡！


    ![](img/9e495c245c6fc762e84f842b252dc362_403_0.png)


    既然不赚钱，就全部免费！


    小雪经常半夜做计划的时候，惊醒妈妈，小雪的妈妈吓得呀，经常半夜起来说：“女儿呀，你又梦游了？千万别想不开呀！”


    小雪说：“妈妈，我没有想不开呀，我只是太兴奋了！”


    小雪妈妈：“那你都喊自杀了，我听到了，女儿呀，千万……”


    小雪哈哈大笑……


    小雪的妈妈以为小雪疯了……


    守着小雪不敢睡觉，后来小雪把如何免费跟妈妈说了，妈妈这才恍然大悟……


    小雪说：“既然我的培训不赚钱，我就干脆免费，跨界打劫音乐器材的利润！”


    所以小雪最后公布了一个让所有人都大跌眼镜的计划，免费培训！完全免费！


    ### 第二步骤：免费的理由


    ……需要理由吗？不需要吗？需要吗？

    I服了U，肯定需要！为啥呀？


    你平白无故的免费，是不是有什么诡计呀？


    肯定有人这么想对吧！


    所以，需要一个理由，小雪想破脑筋，突然一天一拍脑袋说，就这么干了……


    刚好小雪结婚 3 年没有孩子，后来小雪对外说：“连续 15 个晚上，每晚都做同一个梦，梦见麒麟开口说话，麒麟说之所以不能生育那是因为你的阴德不够，你需要法布施大众，要不然你会一辈子不能生育……”


    ![](img/9e495c245c6fc762e84f842b252dc362_404_0.png)


    你说这年头，好事不出名，坏事传千里……


    结果这个消息一传十，十传百就这样在整个城市传开了，说的有鼻子有眼，神乎其神的……


    小雪就成了城市里街头巷议的焦点……


    后来，这个消息发酵了一个月……


    小雪对外悬赏，悬赏 10 万，说谁可以破解此梦，让自己能够生孩子，就奖励 10 万块……


    这一来，又成了焦点……


    再后来小雪的培训中心里你来我往，都来干嘛的？想赚这 10 万块……


    再后来小雪对外宣布，作为晚上又做了个梦，梦见观音菩萨，观音菩萨说要我帮助 9999 个孩子免费学习艺术，如果法布施成功了，自然会感动上天，上天自会赐子！


    ![](img/9e495c245c6fc762e84f842b252dc362_405_0.png)


    服了 U……（捂脸）


    你说这人也奇怪哈，都吃饱了没事干，这个事情又传开了，所以小雪就对外宣布：“受观世音菩萨指点，要帮助 9999 人免费学艺术，所以大家从今天开始，来学习艺术全部免费，老师的工资我来发，大家尽管报名……”


    不可思议的事情发生了……


    报名的人像潮水般涌来……


    ### 第三步骤：免费门槛


    ……但是免费是有条件的，这也是《猪买单》课程里会教会大家的免费八大注意事项，其中的“免费门槛”，有机会来到一诺老师《猪买单》课堂会免费教会大家的……


    免费门槛有 12 个，小雪用了其中的一个：

    ——纪律保证金。


    ![](img/9e495c245c6fc762e84f842b252dc362_406_0.png)


    意思是你来学习可以，比如说今天我给你安排了老师，我来付工资，可是你却无故旷课，我们白搭了工资不算啥，但是这个时间被你占用了，别的孩子失去了一次学习的机会，你觉得这样对别的孩子公平吗？（不公平）


    不公平对不对？


    好，你肯定会说，我不会的！


    那好，如何保证呢？


    我们每个人 1000 块钱纪律保证金，一年后你说不学了，我就退给你！但是迟到一次扣 50，旷课扣 300！


    家长一想，也有道理，反正其他培训中心学费都是几千上万，才付个一千块，也不多，而且还可以退……


    于是家长的抗拒几乎为零……


    ![](img/9e495c245c6fc762e84f842b252dc362_407_0.png)


    一诺老师提醒大家，门槛要设置的让别人容易跨过去，本来就是象征性的意思一下，你不要设置很大的门槛，这样就不是门槛了，那就是障碍了……


    ### 第四步骤：免费借力


    ……重点来了！


    这么多人来培训，能够安排过来吗？


    当然能了，你不看看是谁的学生，上过一诺老师课程的人，学了全世界最最最先进的商业模式——《猪买单》，就会拥有全球最佳资源配置的能力！


    如何配置呢？


    各位，现在全市的孩子，除了一些土豪和暴发户，还有一些对钱没感觉的人之外，几乎全部被吸引过来……


    ![](img/9e495c245c6fc762e84f842b252dc362_408_0.png)


    可是问题来了，既然免费的了，那么场地、设备、人工怎么办？巧妇难为无米之炊呀……


    所以摆在小雪面前有三大难题：


    - 第一个难题：场地成本

    - 第二个难题：人工成本

    - 第三个难题：设备成本


    这三个也是拖死大多数企业主的三座大山，有缘分当你上了一诺老师的课程，你就学会搬走压在企业家身上的五座大山：

    “办公成本、人工成本、设备成本、产品成本、营销成本”。学完一诺老师的课程之后，你就可以把这一切变成免费……


    我们在这里就谈谈小雪遇到的三大难题：


    第一个难题：场地成本


    这个太好办了，最好解决的就是这个……


    怎么解决呢？


    ![](img/9e495c245c6fc762e84f842b252dc362_409_0.png)


    1. 我是做公益，免费的，所以肯定就不涉及税收问题；

    2. 文化宫、市广场免费提供场地，广场舞大妈都是晚上，孩子的培训都是白天，而且哪个大妈会跟孩子抢地盘？对吧！

    3. 甚至连麦当劳肯德基，还有像万达广场都有可能免费提供场地，为啥呀？可以给他们带人气呀；


    结果，场地搞定了……


    第二个难题：人工成本


    这个有些难办，为啥呀？


    让别人不要工资肯定不干！


    那么怎么办呢？


    别着急，这不是有一诺老师帮她出主意嘛……


    其实就是会了不难，难了不会……

    ——找人发工资！


    刚开始我说的时候，小雪都傻了，说：“一诺老师，谁会有这么傻呢？帮我出工资。”


    我立刻说：“小雪，一诺老师课程你白上了，你刚刚说什么？帮你发工资？你看你的立场都错了，你在想着自己……”


    小雪糊涂了，就问：“那一诺老师说我该想谁呀？总不会让我爸妈掏钱吧？”


    ![](img/9e495c245c6fc762e84f842b252dc362_410_0.png)


    我说：“小雪同学，肯定不要，你学一诺老师的课程就是要学会用别人的时间，花别人的钱，办大家的事情，钱进你的口袋，如果被一诺老师亲自辅导你还要自己掏腰包，那一诺老师的颜面何在呀……”（舔脸）


    小雪有些迫不及待了，说：“一诺老师，您快说吧，别拐弯子了，我都急死了……”


    我说：“小雪我问你哈，你的客户同样还会是谁的客户？”


    小雪说：“同行的客户。”


    我说：“非常好，除了是同行的客户，还是谁的客户？”


    小雪说：“还是……”


    我问她：“有没有可能还会是钢琴的客户？”


    小雪说：“有……”


    我又问她：“有没有可能还会是架子鼓的客户？”


    小雪说：“一诺老师，我明白了，课程中有讲过，我突然忘记了，这叫……”。


    ![](img/9e495c245c6fc762e84f842b252dc362_411_0.png)


    #### 第 1：谈判卖钢琴的


    后来小雪找到卖钢琴的合作，说我帮你卖钢琴，给你免费提供场地，你只需要派一位会弹钢琴的人，过来促销钢琴就好了，一定要会弹几首曲子的。


    小雪帮他们算账——这种人师范学校大把的，而且兼职学生工资比较低，加上销售提成，这样厂家不亏钱，厂家愉快的答应了……


    #### 第2：谈判卖旱冰鞋的


    后来小雪找到卖旱冰鞋的，一名教练100块钱一个晚上，3000块钱一个月，你说免费教你吧可以，你总得有旱冰鞋吧？


    于是一双鞋几百块，一个教练可以带20个小朋友，而且排课表，孩子不能每天都练习，劳逸结合，一三五，或二四六，这样一个教练就带40个孩子，这样卖旱冰鞋的也赚钱……


    ![](img/9e495c245c6fc762e84f842b252dc362_412_0.png)


    #### 第3：谈判教跆拳道的


    免费学习可以，别的小朋友都穿着跆拳道服，你大人好意思，孩子的脸上挂不住了，非哭着闹着要不可，那好买吧，多少钱？198元一套，一般都是买两套，换洗着穿……


    小雪精心挑选了十个可以跨界盈利的产品……


    ### 第三个难题：设备成本


    各位，设备还要成本嘛？


    都是厂家提供，样板免费提供！

    库存不需要小雪花钱吧？

    发货物流不需要小雪花钱吧？

    适量问题维护保养不需要小雪操心操肺吧？


    各位，这才是高手做的事情，高手不具体做事，

    那高手都干啥？


    ![](img/9e495c245c6fc762e84f842b252dc362_413_0.png)


    ### 第五步骤：生孩子


    ……哈哈哈

    跟大家开个玩笑，什么生孩子？

    第五步骤就是如法炮制……


    如何炮制？


    教会每个孩子都讲——麒麟和观音菩萨托梦的故事！


    这叫什么是？

    这就叫做——口碑营销


    之前你们听的那是啥口碑营销呀，都是低级的操作：“啊，这位顾客，用的好麻烦帮忙宣传一下哈！”


    想想看有用吗？几乎很少人转介绍对吧？


    ![](img/9e495c245c6fc762e84f842b252dc362_414_0.png)


    举个例子吧：


    > 《史记·高祖本纪》载：“高祖，沛丰邑中阳里人，姓刘氏，字季。父曰太公，母曰刘媪。其先刘媪尝息大泽之陂，梦与神遇。是时雷电晦冥，太公往视，则见蛟龙于其上。已而有身，遂产高祖。”！


    各位，听懂没有？汉朝开国皇帝刘邦是龙种！（捂脸）


    刘邦的妈妈在河边洗澡，哦不好意思口误，不是洗澡，是洗衣服，然后天上的龙也就是刘邦的老爸，不，当时严格意义上还不是刘邦的老爸，不过当下来宠幸了刘邦的妈妈之后，咦，就变成刘邦的老爸了……


    于是乎，龙的传人刘邦爷，哦，对不起口误，不是爷，是真龙天子最后顺理成章的当了皇帝——汉朝第一个皇帝！


    而且是史料记载的……I 服了 U……（马上捂脸）


    来来来，回过神来，咱看看小雪的案例吧……


    你看人家小雪，这个梦做的，哎呀，啧啧啧……

    I 服了 U……真的是，太容易被传播了，有木有？


    ![](img/9e495c245c6fc762e84f842b252dc362_415_0.png)


