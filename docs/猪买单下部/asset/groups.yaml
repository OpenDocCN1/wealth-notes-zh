    # 第三步骤：封锁垄断


    ……给大家讲段历史：


    首先说一下二战前的德国体制：德国国家政体为议会共和制。联邦总统为国家元首，对外代表德国。联邦政府由联邦总理和联邦部长若干人组成，联邦总理为政府首脑。说的直白点，当时的总统保罗·冯·兴登堡，无实权，具有象征意义（相当于英国的伊丽莎白女皇）；而1月30日刚刚上任总理的阿道夫·希特勒是政府首脑，掌有行政权（类似英国首相）。此时的希特勒虽然“权势滔天”，但他上面还有天，那就是法律。那如何干掉法律呢？能干掉法律的只有法律（德国在魏玛共和国时期的宪法规定了特别授权法，即总理可以不通过议会自行制订规章以代替法律，但授权法需议会三分之二的多数议员通过才能生效）。希特勒想实行特别授权法，但希特勒的纳粹党在议会中只占有32%的席位。人不够，那怎么办？


    普通人可能想方设法增加自己人的席位，希特勒的脑回路却很奇特，他决定干掉其他人。当然第一个干掉的当然是一直唱反调而且议会中占有17%的席位第二大党——德国共产党。


    ![](img/9e495c245c245c245c245c24_476_0.png)


    1933年2月27日22点，柏林消防队接到消息，国会大厦发生火灾。直到23点30分，大火才被扑灭。经过消防员和警察对大火现场的检查，发现了20捆未烧尽的纵火燃料和一个赤裸的冻得哆嗦的男人，这个人名叫马里努斯·凡·德尔·卢贝（Marinus
    van der Lubbe），是荷兰共产党人，一个失业的建筑工人，在此前不久才到德国。“这是共产党的暴行！共产党的一名匪徒被逮捕”，希特勒称：“这是共产党发动革命的信号”。


    次日，希特勒在普鲁士新闻公报的电台上发表讲话，称“这种纵火行为是德国布尔什维克进行的最骇人听闻的恐怖主义行为”。次日希特勒要求兴登堡颁布紧急法令，废除了《魏玛宪法》中有关保证人身自由的条款。根据《国会纵火法令》，于3月1日宣布共产党意图暴动（可能也是当时德国人民太害怕苏联这头“洪水猛兽”了）。第二天，冲锋队占领了德国所有的共产党党部。德国共产党是被迫退出议会的党派。随后工会被解散，德国共产党的报刊被禁止出版，包括德国共产党领袖恩斯特·台尔曼的1.8万名德国共产党人被捕入狱。


    1933年3月5日的议会重新选举，纳粹党赢得了44%的席位，希特勒一看，这事搞得不够大呀，还得继续搞。怎么搞？偷学了我们老祖宗的合纵连横。他联合了国家人民党，共占当52%的席位，除此之外就是贿赂其他议员，“要钱不？要钱就得听话；不要钱，那要命不？不听话命都不给你”，于是特别授权法被强行通过了。希特勒终于干掉了他上面的天，从此以后，他就是法律。此后的一个月时间内希特勒肆无忌惮的取缔了所有非纳粹党派，建立了纳粹独裁政权。


    所以把话说回来，这莫总怎么垄断这个小区呢？


