    \n唉，一诺老师就爱说真话……\n\n所以出版社的朋友都让我不要这样说，这样说了书就无法出版了，以至于这本书要出版就要大动手术，因为《猪买单》都是真话……\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_105_0.png)\n\n算了，作为一个老师，一个读书人，有责任有义务追求真理！就算是不出版也不能放弃对真理的追求！\n\
