    \n《东方塔木德》——商业实操落地圣经！\n\n哇，犹太人果然聪明，这都是一诺老师花了近 20 年的时间，遍访世界名师，投资学费超过千万总结出来的智慧！\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_429_0.png)\n\n一诺老师看丹尼尔不远万里前来拜师，就想起来自己曾经也是跋山涉水、走遍世界去拜师学艺，加上丹尼尔说：“一诺老师一个人想要改变世界太慢了，让丹尼尔做您的弟子，替您帮助俄罗斯人吧……”\n\
    \n一诺老师被他这种精神所打动，一诺老师把很多从未公开的《一诺老师弟子密训》及《导师工具》，全部都送给他……\n\n不过这两套资料，后面一诺老师会送给有缘人，只要你不是为了商业，不为钱而演讲，是为了帮助更多人成功，一诺老师都会选择正心、正念、正能量的人赠送，明年的年底会送出1000\
    \ 套，到时候大家关注【猪买单】APP，就可以第一时间开抢……\n\n丹尼尔回到家后，对小丹尼尔影响是非常大的，后来小丹尼尔干脆不看《塔木德》，而只看一诺老师的智慧结晶《东方塔木德》，突然有一天，小丹尼设计出一个不可思议的方案……\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_430_0.png)\n\n> 民族有差异，智慧无国界，\n> 一诺老师的智慧就是全人类的智慧！\n\
    \n小犹太人用这个方案，小犹太人在 20 岁行加冠礼的时候，送给自己一份大礼 1.5 亿卢布的银行存款，差不多折合人民币 900 万的左右……\n\n小犹太人是如何做到的呢？\n\
    \n### 第一步骤：选择马甲\n\n就是借尸还魂也要找到可以还魂的“马甲”吧，所以小丹尼尔找到了一个马甲——蓝猫。\n\n前几年比较火的一部动画片《蓝猫》播出之后，几乎是所有的中国小朋友都知道，小犹太人听爸爸丹尼尔提起过这个动画片，说中国的小朋友都看《蓝猫》而且都很喜欢蓝猫……\n\
    \n说者无心，听着有意，这小犹太人打起了蓝猫的主意……\n\n![](img/9e495c245c6fc762e84f842b252dc362_431_0.png)\n\
    \n蓝猫原来是欧洲的品种，其实非常普通，就好像中国的狸猫、黑猫一样普通。可是由于动画片的播出，大家对蓝猫产生了好奇，尤其是这种猫中国非常少，就变得更加珍贵……\n\
    \n这小犹太人还真厉害，他明白物以稀为贵的道理！加上中国人现在生活水平提高了，消费能力也名列世界前茅，因此这个小犹太人瞄准了中国市场……\n\n蓝猫就成了小犹太人的爆款产品！\n\
    \n紧接着，在中国做了一个蓝猫繁殖基地，说是基地，其实是个农民房租下来，演了一场——空城计，里面也就是几个蓝猫而已……\n\n### 第二步骤：傍大款\n\n\
    很多企业都是有品牌故事，那么小犹太人学了一诺老师的傍大款9招(后面升级成为18招)，所以明白借力使力不费力的道理……\n\n直接傍大款《蓝猫》动画片在人们心中栩栩如生的印象一一蓝猫活泼、乐观、开朗、有运动天赋，精明而善良，头脑冷静，意志坚强，仁慈而富有同情心……\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_432_0.png)\n\n### 第三步骤：绿叶法则\n\n……免费领养蓝猫\n\
    \n哇，这个模式说出来，连丹尼尔都震惊，就问小犹太人，这免费你如何赚钱呢？免费怎么裹住成本呢？\n\n小犹太人说：“一诺老师的书你白看了，先免费，后收费，免费就是为了更好地收费……”\n\
    \n……小犹太人学会了一诺老师《弟子密训》的内容，里面谈到了以终为始，先收钱后干货的商业逻辑，以及实操方案。\n\n于是照葫芦画瓢，就开始设计了一套销售流程……\n\
    \n![](img/9e495c245c6fc762e84f842b252dc362_433_0.png)\n\n小犹太人就对自己的父亲说出了自己的计划，在和父亲反复修改方案之后，把成熟的方案拿给一诺老师看，经过一诺老师对这个方案进行指导，终于可以落地了……\n\
    \n### ——在网上卖猫\n\n你可能会问：“一诺老师，不是免费领取吗？那怎么卖猫了呢？这跟免费模式有啥关系？”\n\n记住，关系可大了，这关系到是否成功，这是一诺老师《大智慧》38\
    \ 个行业内幕，的“绿叶法则”！\n\n怎么操作呢？简单讲吧，如果你买一只蓝猫，你如何参考是否贵？还是便宜呢？\n\n所以，在网上卖蓝猫，标价 5000 元起，从\
    \ 5000 元到 25000 元不等；并且要使用《大智慧》的人海战术，就是在网上一口气开 200 家卖蓝猫的商铺，都是 5000 元打底，这样大家一对比，比来比去，看样子蓝猫就是这个价格了……\n\
    \n你可能会问，要是有人卖便宜了怎么办？\n\n好吧，成立一个蓝猫协会，把他拉进去，加上你自己人有 200 家，同行的有 3 家，203 家……\n\n什么概念呢？开会的时候，大家说要统一价格，不准低于\
