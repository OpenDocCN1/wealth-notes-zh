    \n![](img/9e495c245c6fc762e84f842b252dc362_278_0.png)\n\nI 服了 U，他说的好有道理，我竟无言以对……\n\
    \n好吧就吸鼻子吧，你知道这个治疗方式简直是凌迟的感觉\n\n(凌迟是千刀万剐的意思，3357 刀才把犯人处死，一刀不能多，一刀也不能少)\n\n医生首先给你的鼻子塞个大木棍子，然后就觉得鼻子酸酸的，眼睛开始流眼泪，过几分钟医生把木棍拿掉，换成管子，就像抽水机一样，抽你流出来的鼻涕……\n\
    \nI 服了 U，现在想想还头皮发麻……\n\n可是受了 5 天的罪，还是没好……\n\n这时候我就找医生了，说：“医生您看我这耳朵现在都听不到了，您给我这个治疗方式不行呀……”\n\
    \n医生说：“来我看看……”\n\n医生好像是真的一样检查了一番，然后说：“哦，你这个太严重了，这样吧，再给你开七天的治疗……”\n\n我去，当时想死的心都有……\n\
    \n> 客户不愿意行动就是痛苦不够，反之就是受够痛苦！\n—诺老师\n\n我说：“医生，咱们有没有更好的方法，例如不要这个治疗，简单点的，我不怕花钱，只要给我只好……”\n\
