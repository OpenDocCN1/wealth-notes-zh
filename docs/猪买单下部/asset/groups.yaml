    # 前 言


    大家都知道一诺老师自创立《商业模式》课程起，在教育行业辛勤奉献 18 年，凭借 100% 实战案例教学，不仅桃李满天下，也为社会培养无数弟子，这些弟子都在授课《商业模式》、《顶层设计》、《利他模式》、《免费模式》、《品牌魔力》、《股权兵法》、《融资兵法》、《信用融资》、《营销兵法》、《万能营销》、《魔鬼营销》、《疯狂爆粉》、《超级演说家》等，一诺老师很荣幸能为社会培养这么多优秀讲师人才。


    做为《商业模式》、《顶层设计》、《猪买单》等经典作品的始作俑者，一诺老师闭关修炼 13 个月将课程全方位升级，亲自撰写《猪买单》第 1. 2. 3. 4.
    5. 6 本，原打算 6 本合著一部，但考虑大家不方便携带，就分成上下两部。


    《猪买单》上部主要是“开悟篇”和“策略篇”两大部分，是企业家实操落地必修的基础课程！


    《猪买单》下部主要是“36 头猪”每一头猪是一个案例，每个案例都有实操的步骤、案例解析等实操模型，方便大家学'
  - '[PAGE 3]


    习。《猪买单》下部的头到尾都围绕一个主题，你不用出钱，跟你合作的人也不用出钱，大家都是赢家！是不是很神奇呢？


    # 《猪买单》跟一般书籍的五个不一样


    +   1、这本书跟一般书籍不一样——《猪买单》真实！


    《猪买单》被超过 100 位出版界的朋友拒稿！他们认为一诺老师疯了！该说的、不该说的全写进来了，赤裸裸的商业真相！可是我认为，作为一名老师，最大的执着就应该是——追求真理！


    蒋介石毕业于日本陆军军官学校，学生(蒋)打不过老师(日)！


    毛爷爷战胜日本侵略者、战胜蒋介石，因为毛爷爷 “读奇书、走奇路，才能出奇制胜！”毛爷爷读的书，书店里有的还买不到，为什么？因为大家都懂得的方法，如果管用，大家都成功了！


    很多人成功了放个屁都是香的，所以都出来著书立传，可是书里写的有几个管用你告诉我？大家有没有想过，那些成功者敢不敢讲真话？敢不敢把自己做过的事情全部写进去？不好意思写吧！


    所以，这些真相都在《猪买单》书籍里！这本书真实！'
  - '[PAGE 4]


    # 2、这本书跟一般书籍不一样——《猪买单》简单！


    你是不是有个这样的经历，看到一本书封面不错，标题不错，于是就买了，结果呢？！服了 U，你是越看越糊涂！一团浆糊！


    其实很多事情一句话就能说明白，偏偏闲着没事干整出一本书来，把简单的事情复杂化！


    一诺老师最喜欢简单，很多实战案例三到五个步骤就能说清楚！很多道理一诺老师喜欢一句话表达！


    # 3、这本书跟一般书籍不一样——《猪买单》粗暴！


    看《猪买单》这本书，大家要做好心理准备，书里面教的要么是屌丝逆袭、要么是跌入低谷的末路英雄涅槃重生、要么是颠覆一个行业、要么是垂死挣扎的企业华丽转身……


    所以请有哮喘、心脏病、高血压、心脑血管等疾病患者阅读此书准备好急救措施！（一诺老师声明：对此不承担任何责任！）


    # 4、这本书跟一般书籍不一样——《猪买单》有效！


    在《猪买单》问世之前，都是我助理或弟子等，把我的课程录音译成文字，不像这本书是一诺老师亲子撰写！虽然之前的是录音'
  - '[PAGE 5]


    内容，很多人相信一诺老师说的话 “当你学习 100 遍以上，就会出现一种奇迹！” 结果有人学习 100 遍、200 遍、300 遍，别人把他们当成是疯子！


    可是这些疯子后来无中生有，不花一分钱整合天下资源，杠杆别人的企业，用别人的时间，花别人的钱，办大家的事情，钱进到自己的口袋！（这才是聪明人干的事情）


    很多人上我的课程，我会现场辅导，我问他：“你有什么问题？”他说：“一诺老师我没有问题！” 我说：“啊！没有问题你来干嘛？”他说：“我就是来谢谢您！因为您的书籍和课程太实战了！”


    这本《猪买单》将超越 18 年来一诺老师著作的所有书籍！


    李小龙说过：“我不怕练过 10000 种武功的人，我最怕一种武功练过 10000 遍的人！”


    自从《猪买单》这本 “武林秘籍” 问世，一诺老师把家里几乎所有的商业书籍、营销书籍、企业运营书籍、融资书籍、股权书籍、广告书籍、文案书籍、市场类书籍等，那些越看越糊涂、没有重点、没有逻辑、没有实操性和不落地书籍统统的扔进垃圾桶！


    从现在起，连一诺老师本人都只学《猪买单》直到 100 遍、1000 遍、10000 遍，并且边学习变创新，每年更迭一次《猪买单》作品！


