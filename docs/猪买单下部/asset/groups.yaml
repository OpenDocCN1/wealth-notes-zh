    医院教授表示：“会引发血液方面的疾病，如再障性贫血，甚至白血病！还有肿瘤方面的疾病如肺癌，上呼吸道方面的疾病，如慢支，哮喘，可能对脑也有伤害，出现脑神经损害。还有会出现过敏等症状。还有……”


