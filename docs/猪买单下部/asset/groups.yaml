    # 土豪信


    ## 第25节：梦想总是要说的万一信的人多了你就是亿万富翁


    今天，一诺老师给大家讲的这个不是案例，是社会现象，是目前最流行的赚钱方式！


    一诺老师将一连串的社会现象揉到一起，然后一层一层的撕开，让大家彻底的看透、搞懂、学会全套的流程及操作步骤！


    为了让大家更好的记忆，我们就虚拟一个人物，叫小薇，为什么叫小薇呢？因为最近微商比较火，这个案例跟微商的内幕有关系，大多数都是这样做成功的，所以一诺老师就给大家讲小薇的故事……


    ### 第一步骤：寻找马甲


    有一个美丽的小女孩，她的名字叫做小薇……


    这首歌唱了20年，出现了微商，微商的实操中最大的卖点就是谁谁发财了，谁谁又发财了，做微商赚钱！各位有没有听到你身边有人这样说呢？肯定有！除非你不用微信。


    而且微商女人做的比较多，难怪人家说“世界上最好赚的钱就是女人和孩子的钱”。


    于是傍大款蹭热点，就瞄准了“微商发财致富”这个方向，小薇就开了一家微商公司，卖化妆品、保健品、日用品……


    但是微商公司表面上看是靠产品赚钱，其实产品只不过是掩人耳目的马甲，小薇真正赚钱的不是产品，小薇真正赚钱的是……先留点悬念吧，后面就会知道了！


    ### 第二步骤：招商加盟


    一个人的力量毕竟是有限的，要善于依靠和发动群众做好工作，人多力量大，人多才能做更大的市场。


    所以摆在面前的首要任务就是，发动群众——招商加盟。


    ![](img/9e495c245c6fc762e84f842b252dc362_442_0.png)


    于是小薇设计了很多分钱的方案，记住了：


    - 你会分一个县的钱，你就得到一个县的市场；

    - 你会分一个市的钱，你就得到一个市的市场；

