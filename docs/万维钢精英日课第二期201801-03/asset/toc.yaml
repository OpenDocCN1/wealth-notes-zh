- - '##'
  - 日课118 | 提高学习成绩的最简单心法
- - '##'
  - 特别放送 | 好家长必读
- - '####'
  - 第一，高强度竞争对孩子是不健康的。小孩需要玩，而且需要毫无意义的、浪费时间式的玩。小孩需要跟别的孩子一起胡乱的打闹，这样出来的孩子才有健全的人格。如果孩子从小就知道完成一项一项的指标，考取分数，满足大人的要求，长大了精神上容易有毛病。
- - '####'
  - 第二，名校教育和家长陪护的作用，未必有那么大。人们认名校这个牌子是一回事，名校到底在孩子能力培养上起到多大作用，是另一回事。家长陪伴也许在早期阶段有用——帮着念练习，背背乘法口诀——后期未必有用，难道好学生不应该独立学习吗？
- - '####'
  - 第三，家长们付出这么多的“牺牲”，表面上是为了孩子，其实是为了自己。名校标签就如奢侈品品牌，跟亲朋好友一说人羡慕，也许你追求的仅仅是这个羡慕。关键在于，家长们把“名校”当成了一场比赛的终点，可是人生并不都是比赛，也没有什么决胜的终点。
