    务水平来和他抗衡，这样就让他知道，不光是他一个人有能力，所以不要太傲。


    另一种方法就是让他失败一次，而且要很重要的失败，让他刻骨铭心。当年诸葛亮就是用这种办法收复的关羽，关羽够傲吧，相信在也找不出比关二哥更傲的人了，可孔明是怎么收复二爷的呢，他让二爷去守华容道，为什么？因为他不想让曹**，当时刘备的力量并未成型，全部兵马两万，将不过关
    张 赵三员，如果曹操一死，东吴很可能反咬一口把刘备吃了，然后和魏国二分天下。为了避免这样的局面出现，所以曹操不能死，看遍刘备阵营，只有关'
  md: "\n敌基础上作出的决策。霍邑之战，根据他对屈突通的了解，采取了诱敌出城、断其退路、前后夹击的打法，取得了胜利。南下攻长安时，他派王长谐等从梁山渡河，营于河西以待大军。他对王长谐说：“屈突通精兵不少，相去五十余里，不敢来战，足明其众不为之用。然通畏罪，不敢不出。若自济河击卿等，则我进攻河东，必不能守；若全军守城，则卿等绝其河梁，前扼其喉，后扼其背，彼不走必为擒矣。”（《资治通鉴》卷一八四《隋纪八》，恭帝义宁元年八月）他根据屈突通“野战非其所长，婴城善为捍御”（《大唐创业起居注》卷中）的特点，采取了避攻坚城、野战歼敌的方略。这些都体现了他正确料敌、因势定策的作战指导思想。\n\
    \n另外，李渊善于听取大家的意见，集众人之智为智，合众人之长为长，从而作出正确决策。如在南下攻霍邑途中，传来突厥联合刘武周进犯太原的消息，他召集众将商议对策，然后择善而从，决定继续南下。大军受阻河东（治今山西永济蒲州镇），众将或言先克河东，然后西进；或言避开河东，直取长安。李渊吸取了两种意见的合理部分，留部分军队围河东，自引军西趋长安，亦是得策。汾阳人薛大鼎、河东县户曹任瑰提出早日渡河以取关中的建议，李渊都虚心听取。倾听各种意见并择善而从，做到多谋善断，先胜后战，正是优秀的军事统帅所必备的素质。\n\
    \n## 四、因势定制、严明赏罚、用人所长的建军思想\n\n李渊重视军队制度建设，其基本做法是因势定制，有沿有革。起事初期，为适应战争的需要，他建立大将军府，下设左、中、右三军，由三个儿子分别统领，形成了有力的统一指挥体制；为扩充兵源，实行募兵政策。武德二年（619年），他提出，为提高军队战斗力，必须“各因部校，序其统属”（《唐大诏令集》卷一〇七《备御》），恢复府兵制，分关中为12道，置12军。三年，12军各立军号，分道治军，耕战结合。建立12卫和东宫6率，完善了中央军事体制和府兵的编制，沿用了隋朝的一些做法，又有所发展。在治军上，为适应兴兵起事的需要，他注重广施恩惠，不惜重赏；同时又强调严肃军纪，禁止侵暴百姓。积极争取起义军的支持，收编其队伍，以不断壮大自己的力量。对归顺者封以高官，如对关中起义军首领孙华；对抗逆者，在将其打败后，一般只诛敌首，对其余人采取赦“违误者”和善待俘虏的政策。强调赏罚公平，不分贵贱。霍邑之战后论功行赏，有人主张应募之奴不能与良人同，李渊坚持按功行赏，因而较大地调动了军队作战的积极性。在用将上，注重用其所长，如对李世民、李靖、李建成、李世勣等人的使用，都体现了这一思想，使他们在唐初几次重大作战中都较充分地发挥了自己的特长。\n\
    \n王夫之认为：“秦王之勇略，志大而功成，不知高祖慎重之心，持之固，养之深，为能顺天 之理，契人之情，放道以行，有以折群雄之躁妄，绥民志于未苏，故能折箠以御裒尤，而系国于苞桑之固，非秦王之所可及也。”（《读通鉴论》卷十一《唐高祖》）这一看法是比较中肯的。李渊作为开创唐朝大业的统帅，提出并实行了许多高明的战略，其军事思想理应受到重视。\n\
    \n# 当领导不懂必备这几帝王术\n\n唐太宗李世民是一位卓越的政治家、伟大的军事家，同时，也是一位集团管理的顶尖高手，他的一些成功经验值得学习和借鉴。\n\
    \n- 怎么树立理念？贞观之治的基本特色：轻徭薄赋、以民为本；广开言路、虚怀纳谏；重用人才、唯才是任；铁面无私、依法办事。\n- 怎么以人为本？李世民说：“执政23年的经验告诉我，尊重人、依靠人、发展人、为了人。就是以人为本的主旨。”唐朝集团在李世民的精心管理下，不断发展经济，出现了社会安定、政治清明、百姓安康的良好局面。\n\
    - 怎么团结一致？一个人一分钟可以挖一个洞，六十个人一秒钟却挖不了一个洞。合作是一个问题，如何合作也是一个问题。合作就是互相配合做某事或共同完成某项任务。简单地说就是团结一致。\n\
    - 怎么三剂合一？坚强的领导集体必须具有凝聚力，当然，人格魅力也不可少。什么是三剂合一？即领头人要成为领导班子高效运转的“润滑剂”，齐心协力的“粘合剂”，创新发展的“催化剂”。\n\
    \n李世民十分重视吏治的清明，曾命房玄龄省并冗员，派李靖等13名黜陟大使巡察全国，考察风评；又亲自选派都督、刺史等地方官，并将其功过写在宫内屏风上，作为升降奖惩的依据。另又规定五品以上的京官轮流值宿中书省，以便随时廷见，垂询民间疾苦和施政得失，百官遂自励廉能，直接提高政府效率。成吉思汗说：“欲安邦定国者，必悉唐宗兵法。”\n\
    \n- 怎么避免犯错？人无完人，金无赤金。人在冲动的时候，最容易犯错误。权力过大，说了算数，容易形成“家长制”、“一言堂”的短板。所以，必须发扬民主、集思广益。这样，才有利于实现决策的科学化。夫以铜为镜，可以正衣冠，以古为镜，可以见兴替，以人为镜，可以知得失。兼听则明偏听则暗的道理就在于此。\n\
    - 怎么提高修养？有一天，唐太宗得到一只雄健俊逸的鹞子，正玩得高兴，魏征来了。李世民怕魏征看到又要提意见，赶紧把鹞子藏到怀里。这一切早被魏征看到，他禀报公事时，故意喋喋不休，拖延时间。结果鹞子被憋死在李世民怀里。由此可见，李世民的气度胸怀。领导能否做到严于律己、宽以待人，这对班子成员能否成为团结战斗的集体至关重要。\n\
    \n“耕夫碌碌，少有隔夜之粮；织女波波，少有御寒之衣。日食三餐，当识农夫之苦；身穿一缕，每念织女之劳。寸丝千命，匙饭百鞭；无功受禄，寝食不安。交有德之朋，绝无益之友。常怀克己之心，闭却是非之口。若能依朕所言，富贵功名可久。”李世民这则近百字的短文，提醒为官者不忘劳动本色，保持艰苦奋斗作风；同时做到慎言、慎友、克己、清廉。这段话从表面上来看，是李世民教导领导班子如何才能保持功名富贵？但仔细推敲，实质上是告诫为官者修身克己的做人之道。\n\
    \n- 怎么居安思危？李世民知道，居安思危是预控性的关键。他把隋朝灭亡的教训当教科书，避免重蹈覆辙。关心百姓的疾苦，组织人员走南闯北进行调研，掌握第一手资料，进行科学决策。他说：“民，水也；君，舟也。水能载舟，亦能覆舟。”下令轻徭薄赋，让老百姓休养生息，其目的就是让大家都\
    \ 能过上好日子。李世民认为，只有把危险消灭在萌芽中，才能实现国泰民安的大好局面。\n\n古人云：“不谋全局者，不足以谋一域；不谋万世者，不足以谋一时。”《剑桥中国隋唐史》：“对后世的中国文人来说，太宗代表了一个文治武功理想地结合起来的盛世：国家由一个精力充沛但聪明而谨慎的皇帝治理，他牢固地掌握着他的帝国，同时又一贯谦虚耐心地听取群臣，这些大臣本人也都是卓越的人物的意见。太宗的施政作风之所以被人推崇，不仅由于它的成就，而且由于它接近儒家的纳谏爱民为治国之本这一理想，另外还由于它表现了君臣之间水乳交融的关系。”\n\
    \n- 怎么解决问题？实践是检验真理的唯一标准。李世民通过不断探索实践，制定了行之有效的集团规矩和规划，依据标准，监督检查执行情况，发现偏差，及时采取有效措施，诊断病因，对症下药。发现问题及时解决，问题解决了，那就不成问题了。\n\
    \n在李世民时代，唐朝集团与西方国家相比，无论在政治、经济还是文化上都走在世界的前列。由于唐太宗在位时年号为贞观，所以，人们把他管理的这一段时期称为“贞观之治”。司马光称太宗文武之才，高出前古。盖三代以还，中国之盛未之有也。\n\
    \n# 和谐统一之权——内外有别，恩威并重\n\n作为唐朝的第二任皇帝，唐太宗在“权”的方面，主要面临的任务有两个：一是得到皇位，拥有至高无上的权力；二是开拓疆土，成为全天下的君主。对于内部的争权者，杀之，无话可说；对于外部的争权者，盟之，不服则打。但在整个用“权”的过程中，均采用了恩威并重的方法。\n\
    \n### 玄武门之变\n\n众所周知，历朝历代皇位斗争都是最激烈、最残酷的，特别是在嫡长子或者皇太子实力不济之时。唐太宗李世民排行第二，恰好也有这么一个大哥，是其皇位的最强竞争者。而其父亲唐高祖李渊呢，又是一个特别保守的人，一直认为嫡长子应该继承自己的位置。\n\
    \n李世民是个很有心计的人，他知道嫡长子的位置是没法争了，但可以另辟蹊径，从能力、业绩、威望等方面全面超越。于是，李世民私下里学习刻苦，注意自身修为，而且还广交朋友，培植自己的势力。另外，他牢牢掌握了军权，善待手下将领和士兵，对老百姓也很好，在军队和百姓中有很高的威望。特别是在唐朝定国后，为稳定局势而进行的六次大规模的征讨活动中，李世民起到了巨大的作用。如果把六次战争的胜利比作足球场上的六个进球，那么，李世民一个人就完成了四个进球，另外还助攻两次。最重要的是，他在最关键的决赛（唐军\
    \ vs 王世充加窦建德联军）当中，打入了制胜一球。在这一仗之后，李世民的威望和势力达到了极致。据说，他回到长安时，受到军民以及皇帝的礼仪招待。\n\n这种情况，让大哥李建成很是担心。当然，李建成也不是省油的灯，他这些年更注重把持朝政，而且和一些权臣搞好关系。另外，他给四弟李元吉很多许诺，二人关系很好。关键时刻，确保这个弟弟站在自己这边。基本上，宫里宫外都是李建成的人。之前，李建成考虑到李世民在领军打仗方面的作用，一直隐忍其实力的发展。但现如今，天下基本太平，该解决内部矛盾了。于是，他向老爸李渊建议由四弟李元吉做统帅出征突厥，借此要夺取李世民的军权。\n\
    \n李世民虽然连年在外打仗，但并不是对朝内情况一无所知。其实，他早在李建成周围安排了很多“卧底”，对李建成的一举一动了如指掌。他没有沉迷于当时的成绩，更觉得有必要解决自己权力路上的障碍。当了解到李建成最新动态后，李世民决定先发制人。但到底如何处置这个皇太子呢？李世民手下将士们都很有顾虑，这毕竟是“老板”的亲大哥啊！李世民这时表了态：“有什么计策，你们尽管说，由我来决定是否执行。”大多数人的意见是将皇太子及主要同党囚禁起来，不让他们再干预政事。李世民当即反对：“李建成已经鬼迷心窍，囚禁起来不能从根本上解决问题。”众将士都明白了“老板”的意思，提出迫使李建成等进宫，但在途中进行截杀的办法。李世民这才同意，但由谁去负责做这个事情，他都不是不很放心。于是，他决定由自己亲自来完成这一任务，并带上了对自己最为忠心耿耿的尉迟恭。\n\
    \n事情的进展依计进行。而李世民最担心的一幕也确实出现了。公元 626 年 7 月 2 日晚，玄武门前，大哥李建成和四弟李元吉在逃跑时，手下将士都不敢下手，包括这个尉迟恭。“不能让大哥跑掉，否则这么多年的苦心经营就全部白费了”，李世民射出了致命的一箭，正中李建成要害，当场毙命。而尉迟恭也立即解冻，射死了李元吉。\n\
    \n唐高祖李渊知道此事后，震怒！但也没有任何办法，眼下只有这么一个儿子了，而且兵权还在其手里。因此，不得不立李世民为皇太子。两个月后，自责和无奈中的李渊，将皇位让给了次子李世民。\n\
    \n点评：李世民亲手弑兄之举，常被后人诟病。一定程度上表明了李世民对权力的向往。夺权路上，无论谁来阻挡，都将被除去。但李世民并没有大面积捕杀，反而重用了很多能臣，最有名的就是魏徵。\n\
    \n### 收服突厥\n\n虽然内部已经没有对手，但外部仍不太平。刚即位不久，突厥首领颉利可汗听说唐朝政局发生动荡，认为有机可乘。亲率大军一路南下，几乎未遇到任何抵抗，来到了与长安城隔河对峙的渭水北岸。而此时呢，长安城内并没有多少兵力，大队人马哪儿去了呢？原来，李世民是想在半路拦截突厥部队。但颉利可汗并没有和唐军硬碰硬，而是加快行军速度，绕过防线，直扑长安城。\n\
    \n正在整个朝野上下惊慌失措时，李世民异常冷静，一方面调其他部队来支援，另一方面让去拦截的部队赶紧回撤。自己则要亲自出城去会会颉利可汗，为援军多赢得一些时间。众大臣纷纷相劝：“这可使不得，这样太危险。”李世民很冷静地说：“我们大唐给突厥供奉已经快十年了，但突厥仍不满足，迟早我要和他们开战，但不是今天。今天，我只是想告诉他们，我们不怕他们。”说完，找了五个和突厥人比较熟悉的大臣出城，直奔突厥大军。\n\
    \n颉利可汗看到李世民就带了这么几个人来，很奇怪，心里犯嘀咕：“都说这小子能打仗，没想到这么狂，莫非有什么陷阱，先看看无妨。”没想到，李世民一个人径直来到桥上，大呼其名。突厥将士的目光齐刷刷转向了“大汗”：“老板，叫你呢。”颉利可汗犹豫了一下：“直接射死这小子，传出去了不好听。过去看看吧，不能装，要不这以后怎么在弟兄们面前混啊。”为示威严，颉利可汗也打马直接上桥，没有显示出丝毫停顿。突厥将士均暗自赞叹：“老板真给力啊！”\n\
    \n# 帝王术连环除对手\n\n武则天的父亲武世䪖，原本是一个木材商人，因参加了李渊反隋的起义，唐王朝建立后曾官至工部尚书。武则天生长在这样一个家庭，从小就受到比较好的教育。但她9岁时，父亲就过早地去世了。武则天容颜姣美，天生丽质，举手投足，楚楚动人。其性格刚厉，好猜忌，有权略，聪慧过人。14岁时，唐太宗召她入宫，封为才人，赐号武媚，人称媚娘。帝王的后宫等级森严，皇后之下，有四妃、九嫔，然后才是才人。皇宫中有不少才人，终其一生，皇帝都没有召见过，老死宫中，无人过问。武则天的性格和禀赋，决定了她不可能甘居才人的卑下地位而无所作为。她进宫以后，不仅为唐太宗所赏识，而且与太子李治暗通情愫，深得李治的喜爱。公元\
    \ 649 年，唐太宗驾崩，武媚娘与一些宫女一道依旧制被送到感业寺，削发做了尼姑，时年 26 岁。\n\n即位的唐高宗也深深怀念武媚娘，一天他驾临感业寺进香，与武则天相会，牵动旧情，于是让她重蓄乌发，入宫侍寝。这时的媚娘已在感业寺中度过了五年孤灯清影的生活，这一经历肯定对武则天的心理产生了极大的影响。重返后宫的武则天把权术和地位看得比什么都重要，从此，她便凭借着自己的才智，开始了争夺最高统治权力和地位的艰难历程。她的第一个目标，就是打倒萧淑妃。当时萧淑妃深得高宗宠爱，而王皇后则倍感凄凉。萧淑妃生了儿子以后，母以子贵，更加得意忘形。备受冷落的王皇后想利用初进宫的武则天牵制萧淑妃，这正好为武则天提供了一个极好的机会。一方面，她使出浑身解数，利用女人特有的魅力，充分满足高宗的欲望，使高宗一刻也离不开她；另一方面，她又极力讨好王皇后，竭尽阿谀奉承之能事，骗取王皇后的信任，王皇后多次在高宗面前称赞武则天。不久，唐高宗册封武则天为昭仪。武则天与王皇后联合起来，百般诋毁萧淑妃，唐高宗贪于新欢，很快就对萧淑妃厌倦了，萧淑妃最终被废为庶人。\n\
    \n武则天的第二个目标就是打倒王皇后，自己当皇后。因此萧淑妃被废以后，她立即又把矛头对准了王皇后。在实现这一目标的过程中，武则天充分展现了她的权谋和刚厉阴毒的性格。她与王皇后不接近的后宫之人倾心交结，广施恩惠，使她们与自己一道共同反对王皇后；同时，通过她们及时了解高宗和王皇后的动静，掌握宫中动态。在做了充分准备以后，她就开始向王皇后发动进攻。首先，她向高宗诬告王皇后同母亲一道在宫中搞魊胜之术，使高宗对王皇后产生厌恨之心。萧淑妃被废，王皇后还自鸣得意，以为武则天是自己的贴心人。但她很快就发现，武则天是一个比萧淑妃更加厉害的新对手。武则天日益受到高宗的专宠，不久便身怀六甲。王皇后最大的心病就是没有怀孕。皇后之子即为太子，母以子贵，皇后的地位才能稳固。面对武昭仪的威胁，王皇后与舅父中书令柳奭商议，决定劝高宗立地位低贱的刘氏之子燕王李忠为太子，以巩固自己的地位，同时也杀一杀武昭仪的锐气。\n\
    \n武则天有了身孕后，更得高宗宠爱。她得知燕王李忠立为太子的阴谋后，决定采取非常步骤，促使高宗废后。为了达到废后的目的，武则天不惜采用残忍的手段，活活掐死了自己的亲生女儿，然后嫁祸于王皇后。王皇后有口难辩，含冤失宠。唐高宗决定废黜王皇后，立武则天为皇后。但是围绕着废后和立后的问题，朝廷内掀起了一场轩然大波。武后生有四个儿子，长子李弘，次子李贤，三子李显，四子李旦。李弘为太子，高宗打算传帝位给他。武则天并不是一个按传统办事的女人，她虽掌握了国家的最高权力，但还想拥有与实际权力一致的名位，也就是说她还想称帝，当一个女皇帝。为达到这一目的，她用药酒毒死了李弘。李弘死后，高宗又立李贤为太子，并令他监国。李贤容貌端正，富于文才，更为武后嫉恨，不久，她又找借口废李贤为平民，将他流放到四川巴中地区。后来听说李贤不满，又令人逼其自尽。李贤被废后，高宗又立李显为太子，立李显的儿子李重照为皇太孙。\n\
    \n公元 683 年，高宗去世，李显即位，是为中宗。尊武后为皇太后，朝中政事仍由太后裁决。中宗不甘受制于太后，打算以韦玄贞为侍中，宰相裴炎认为不可。中宗大怒，说：“朕就是把天下交与韦玄贞又有何不可，何况侍中！”裴炎密告太后，于是武则天召集百官于乾元殿，勒兵入宫，废中宗为庐陵王。其子重照也被武后杖杀。就这样，武则天的四个儿子，三个被她除掉了。俗话说“虎毒不食子”，可是武则天为了当皇帝，却不惜一再杀死自己的亲生儿子，可见其决心是何等的坚决，其手段又是何等的残忍！\n\
    \n武后生有四个儿子，长子李弘，次子李贤，三子李显，四子李旦。李弘为太子，高宗打算传帝位给他。武则天并不是一个按传统办事的女人，她虽掌握了国家的最高权力，但还想拥有与实际权力一致的名位，也就是说她还想称帝，当一个女皇帝。为达到这一目的，她用药酒毒死了李弘。李弘死后，高宗又立李贤为太子，并令他监国。李贤容貌端正，富于文才，更为武后嫉恨，不久，她又找借口废李贤为平民，将他流放到四川巴中地区。后来听说李贤不满，又令人逼其自尽。李贤被废后，高宗又立李显为太子，立李显的儿子李重照为皇太孙。\n\
    \n# 帝王术与当今管理驭人兼用\n\n管理是什么，个人认为，一个是管一个是理，管是什么，当然是管人，那理呢，理事，也就是经营。个人的能力是有限的，在怎么有能力的人也不可能凭一个人的力量做成所有事，所以就要靠其他人，靠朋友，靠下属，甚至靠上级靠领导，古代的高祖刘邦，水浒里的宋江，他们都没什么大本事，武功不行，打仗不行，文化不行，可他们都成了霸主，就是因为他们会利用人，也就是驭人术，驭人术包含了管理学，心理学，人际学，厚黑学等，是一门涉及很广的学问。\n\
    \n首先我觉得不管是管理还是驭人，目的只有一个，就只利用他们达到自己的目的。那怕用完就丢掉。要知人善用。\n\n### 人得类型\n\n我觉得人大概分为几类，你身边的所有人都能从这里找到，现在介绍他们的特点与怎样驾驭。\n\
    \n- 高傲型：\n  高傲大家都明白，这种人往往都有一定的能力，他们高傲自然是有一定高傲的资本，对付这种人有两种方法，一是分化型，所谓分化就是分化他的能力，例如他的业务很好，但是人很高傲，那怎么办，就是分化他高傲的资本，怎么分化呢？可以再培养一个人或是自己提高业务水平来和他抗衡，这样就让他知道，不光是他一个人有能力，所以不要太傲。\n\
    \n  另一种方法就是让他失败一次，而且要很重要的失败，让他刻骨铭心。当年诸葛亮就是用这种办法收复的关羽，关羽够傲吧，相信在也找不出比关二哥更傲的人了，可孔明是怎么收复二爷的呢，他让二爷去守华容道，为什么？因为他不想让曹**，当时刘备的力量并未成型，全部兵马两万，将不过关\
    \ 张 赵三员，如果曹操一死，东吴很可能反咬一口把刘备吃了，然后和魏国二分天下。为了避免这样的局面出现，所以曹操不能死，看遍刘备阵营，只有关\n"
  mdcn: "\n敌基础上作出的决策。霍邑之战，根据他对屈突通的了解，采取了诱敌出城、断其退路、前后夹击的打法，取得了胜利。南下攻长安时，他派王长谐等从梁山渡河，营于河西以待大军。他对王长谐说：“屈突通精兵不少，相去五十余里，不敢来战，足明其众不为之用。然通畏罪，不敢不出。若自济河击卿等，则我进攻河东，必不能守；若全军守城，则卿等绝其河梁，前扼其喉，后扼其背，彼不走必为擒矣。”（《资治通鉴》卷一八四《隋纪八》，恭帝义宁元年八月）他根据屈突通“野战非其所长，婴城善为捍御”（《大唐创业起居注》卷中）的特点，采取了避攻坚城、野战歼敌的方略。这些都体现了他正确料敌、因势定策的作战指导思想。\n\
    \n另外，李渊善于听取大家的意见，集众人之智为智，合众人之长为长，从而作出正确决策。如在南下攻霍邑途中，传来突厥联合刘武周进犯太原的消息，他召集众将商议对策，然后择善而从，决定继续南下。大军受阻河东（治今山西永济蒲州镇），众将或言先克河东，然后西进；或言避开河东，直取长安。李渊吸取了两种意见的合理部分，留部分军队围河东，自引军西趋长安，亦是得策。汾阳人薛大鼎、河东县户曹任瑰提出早日渡河以取关中的建议，李渊都虚心听取。倾听各种意见并择善而从，做到多谋善断，先胜后战，正是优秀的军事统帅所必备的素质。\n\
    \n## 四、因势定制、严明赏罚、用人所长的建军思想\n\n李渊重视军队制度建设，其基本做法是因势定制，有沿有革。起事初期，为适应战争的需要，他建立大将军府，下设左、中、右三军，由三个儿子分别统领，形成了有力的统一指挥体制；为扩充兵源，实行募兵政策。武德二年（619年），他提出，为提高军队战斗力，必须“各因部校，序其统属”（《唐大诏令集》卷一〇七《备御》），恢复府兵制，分关中为12道，置12军。三年，12军各立军号，分道治军，耕战结合。建立12卫和东宫6率，完善了中央军事体制和府兵的编制，沿用了隋朝的一些做法，又有所发展。在治军上，为适应兴兵起事的需要，他注重广施恩惠，不惜重赏；同时又强调严肃军纪，禁止侵暴百姓。积极争取起义军的支持，收编其队伍，以不断壮大自己的力量。对归顺者封以高官，如对关中起义军首领孙华；对抗逆者，在将其打败后，一般只诛敌首，对其余人采取赦“违误者”和善待俘虏的政策。强调赏罚公平，不分贵贱。霍邑之战后论功行赏，有人主张应募之奴不能与良人同，李渊坚持按功行赏，因而较大地调动了军队作战的积极性。在用将上，注重用其所长，如对李世民、李靖、李建成、李世勣等人的使用，都体现了这一思想，使他们在唐初几次重大作战中都较充分地发挥了自己的特长。\n\
    \n王夫之认为：“秦王之勇略，志大而功成，不知高祖慎重之心，持之固，养之深，为能顺天 之理，契人之情，放道以行，有以折群雄之躁妄，绥民志于未苏，故能折箠以御裒尤，而系国于苞桑之固，非秦王之所可及也。”（《读通鉴论》卷十一《唐高祖》）这一看法是比较中肯的。李渊作为开创唐朝大业的统帅，提出并实行了许多高明的战略，其军事思想理应受到重视。\n\
    \n# 当领导不懂必备这几帝王术\n\n唐太宗李世民是一位卓越的政治家、伟大的军事家，同时，也是一位集团管理的顶尖高手，他的一些成功经验值得学习和借鉴。\n\
    \n- 怎么树立理念？贞观之治的基本特色：轻徭薄赋、以民为本；广开言路、虚怀纳谏；重用人才、唯才是任；铁面无私、依法办事。\n- 怎么以人为本？李世民说：“执政23年的经验告诉我，尊重人、依靠人、发展人、为了人。就是以人为本的主旨。”唐朝集团在李世民的精心管理下，不断发展经济，出现了社会安定、政治清明、百姓安康的良好局面。\n\
    - 怎么团结一致？一个人一分钟可以挖一个洞，六十个人一秒钟却挖不了一个洞。合作是一个问题，如何合作也是一个问题。合作就是互相配合做某事或共同完成某项任务。简单地说就是团结一致。\n\
    - 怎么三剂合一？坚强的领导集体必须具有凝聚力，当然，人格魅力也不可少。什么是三剂合一？即领头人要成为领导班子高效运转的“润滑剂”，齐心协力的“粘合剂”，创新发展的“催化剂”。\n\
    \n李世民十分重视吏治的清明，曾命房玄龄省并冗员，派李靖等13名黜陟大使巡察全国，考察风评；又亲自选派都督、刺史等地方官，并将其功过写在宫内屏风上，作为升降奖惩的依据。另又规定五品以上的京官轮流值宿中书省，以便随时廷见，垂询民间疾苦和施政得失，百官遂自励廉能，直接提高政府效率。成吉思汗说：“欲安邦定国者，必悉唐宗兵法。”\n\
    \n- 怎么避免犯错？人无完人，金无赤金。人在冲动的时候，最容易犯错误。权力过大，说了算数，容易形成“家长制”、“一言堂”的短板。所以，必须发扬民主、集思广益。这样，才有利于实现决策的科学化。夫以铜为镜，可以正衣冠，以古为镜，可以见兴替，以人为镜，可以知得失。兼听则明偏听则暗的道理就在于此。\n\
    - 怎么提高修养？有一天，唐太宗得到一只雄健俊逸的鹞子，正玩得高兴，魏征来了。李世民怕魏征看到又要提意见，赶紧把鹞子藏到怀里。这一切早被魏征看到，他禀报公事时，故意喋喋不休，拖延时间。结果鹞子被憋死在李世民怀里。由此可见，李世民的气度胸怀。领导能否做到严于律己、宽以待人，这对班子成员能否成为团结战斗的集体至关重要。\n\
    \n“耕夫碌碌，少有隔夜之粮；织女波波，少有御寒之衣。日食三餐，当识农夫之苦；身穿一缕，每念织女之劳。寸丝千命，匙饭百鞭；无功受禄，寝食不安。交有德之朋，绝无益之友。常怀克己之心，闭却是非之口。若能依朕所言，富贵功名可久。”李世民这则近百字的短文，提醒为官者不忘劳动本色，保持艰苦奋斗作风；同时做到慎言、慎友、克己、清廉。这段话从表面上来看，是李世民教导领导班子如何才能保持功名富贵？但仔细推敲，实质上是告诫为官者修身克己的做人之道。\n\
    \n- 怎么居安思危？李世民知道，居安思危是预控性的关键。他把隋朝灭亡的教训当教科书，避免重蹈覆辙。关心百姓的疾苦，组织人员走南闯北进行调研，掌握第一手资料，进行科学决策。他说：“民，水也；君，舟也。水能载舟，亦能覆舟。”下令轻徭薄赋，让老百姓休养生息，其目的就是让大家都\
    \ 能过上好日子。李世民认为，只有把危险消灭在萌芽中，才能实现国泰民安的大好局面。\n\n古人云：“不谋全局者，不足以谋一域；不谋万世者，不足以谋一时。”《剑桥中国隋唐史》：“对后世的中国文人来说，太宗代表了一个文治武功理想地结合起来的盛世：国家由一个精力充沛但聪明而谨慎的皇帝治理，他牢固地掌握着他的帝国，同时又一贯谦虚耐心地听取群臣，这些大臣本人也都是卓越的人物的意见。太宗的施政作风之所以被人推崇，不仅由于它的成就，而且由于它接近儒家的纳谏爱民为治国之本这一理想，另外还由于它表现了君臣之间水乳交融的关系。”\n\
    \n- 怎么解决问题？实践是检验真理的唯一标准。李世民通过不断探索实践，制定了行之有效的集团规矩和规划，依据标准，监督检查执行情况，发现偏差，及时采取有效措施，诊断病因，对症下药。发现问题及时解决，问题解决了，那就不成问题了。\n\
    \n在李世民时代，唐朝集团与西方国家相比，无论在政治、经济还是文化上都走在世界的前列。由于唐太宗在位时年号为贞观，所以，人们把他管理的这一段时期称为“贞观之治”。司马光称太宗文武之才，高出前古。盖三代以还，中国之盛未之有也。\n\
    \n# 和谐统一之权——内外有别，恩威并重\n\n作为唐朝的第二任皇帝，唐太宗在“权”的方面，主要面临的任务有两个：一是得到皇位，拥有至高无上的权力；二是开拓疆土，成为全天下的君主。对于内部的争权者，杀之，无话可说；对于外部的争权者，盟之，不服则打。但在整个用“权”的过程中，均采用了恩威并重的方法。\n\
    \n### 玄武门之变\n\n众所周知，历朝历代皇位斗争都是最激烈、最残酷的，特别是在嫡长子或者皇太子实力不济之时。唐太宗李世民排行第二，恰好也有这么一个大哥，是其皇位的最强竞争者。而其父亲唐高祖李渊呢，又是一个特别保守的人，一直认为嫡长子应该继承自己的位置。\n\
    \n李世民是个很有心计的人，他知道嫡长子的位置是没法争了，但可以另辟蹊径，从能力、业绩、威望等方面全面超越。于是，李世民私下里学习刻苦，注意自身修为，而且还广交朋友，培植自己的势力。另外，他牢牢掌握了军权，善待手下将领和士兵，对老百姓也很好，在军队和百姓中有很高的威望。特别是在唐朝定国后，为稳定局势而进行的六次大规模的征讨活动中，李世民起到了巨大的作用。如果把六次战争的胜利比作足球场上的六个进球，那么，李世民一个人就完成了四个进球，另外还助攻两次。最重要的是，他在最关键的决赛（唐军\
    \ vs 王世充加窦建德联军）当中，打入了制胜一球。在这一仗之后，李世民的威望和势力达到了极致。据说，他回到长安时，受到军民以及皇帝的礼仪招待。\n\n这种情况，让大哥李建成很是担心。当然，李建成也不是省油的灯，他这些年更注重把持朝政，而且和一些权臣搞好关系。另外，他给四弟李元吉很多许诺，二人关系很好。关键时刻，确保这个弟弟站在自己这边。基本上，宫里宫外都是李建成的人。之前，李建成考虑到李世民在领军打仗方面的作用，一直隐忍其实力的发展。但现如今，天下基本太平，该解决内部矛盾了。于是，他向老爸李渊建议由四弟李元吉做统帅出征突厥，借此要夺取李世民的军权。\n\
    \n李世民虽然连年在外打仗，但并不是对朝内情况一无所知。其实，他早在李建成周围安排了很多“卧底”，对李建成的一举一动了如指掌。他没有沉迷于当时的成绩，更觉得有必要解决自己权力路上的障碍。当了解到李建成最新动态后，李世民决定先发制人。但到底如何处置这个皇太子呢？李世民手下将士们都很有顾虑，这毕竟是“老板”的亲大哥啊！李世民这时表了态：“有什么计策，你们尽管说，由我来决定是否执行。”大多数人的意见是将皇太子及主要同党囚禁起来，不让他们再干预政事。李世民当即反对：“李建成已经鬼迷心窍，囚禁起来不能从根本上解决问题。”众将士都明白了“老板”的意思，提出迫使李建成等进宫，但在途中进行截杀的办法。李世民这才同意，但由谁去负责做这个事情，他都不是不很放心。于是，他决定由自己亲自来完成这一任务，并带上了对自己最为忠心耿耿的尉迟恭。\n\
    \n事情的进展依计进行。而李世民最担心的一幕也确实出现了。公元 626 年 7 月 2 日晚，玄武门前，大哥李建成和四弟李元吉在逃跑时，手下将士都不敢下手，包括这个尉迟恭。“不能让大哥跑掉，否则这么多年的苦心经营就全部白费了”，李世民射出了致命的一箭，正中李建成要害，当场毙命。而尉迟恭也立即解冻，射死了李元吉。\n\
    \n唐高祖李渊知道此事后，震怒！但也没有任何办法，眼下只有这么一个儿子了，而且兵权还在其手里。因此，不得不立李世民为皇太子。两个月后，自责和无奈中的李渊，将皇位让给了次子李世民。\n\
    \n点评：李世民亲手弑兄之举，常被后人诟病。一定程度上表明了李世民对权力的向往。夺权路上，无论谁来阻挡，都将被除去。但李世民并没有大面积捕杀，反而重用了很多能臣，最有名的就是魏徵。\n\
    \n### 收服突厥\n\n虽然内部已经没有对手，但外部仍不太平。刚即位不久，突厥首领颉利可汗听说唐朝政局发生动荡，认为有机可乘。亲率大军一路南下，几乎未遇到任何抵抗，来到了与长安城隔河对峙的渭水北岸。而此时呢，长安城内并没有多少兵力，大队人马哪儿去了呢？原来，李世民是想在半路拦截突厥部队。但颉利可汗并没有和唐军硬碰硬，而是加快行军速度，绕过防线，直扑长安城。\n\
    \n正在整个朝野上下惊慌失措时，李世民异常冷静，一方面调其他部队来支援，另一方面让去拦截的部队赶紧回撤。自己则要亲自出城去会会颉利可汗，为援军多赢得一些时间。众大臣纷纷相劝：“这可使不得，这样太危险。”李世民很冷静地说：“我们大唐给突厥供奉已经快十年了，但突厥仍不满足，迟早我要和他们开战，但不是今天。今天，我只是想告诉他们，我们不怕他们。”说完，找了五个和突厥人比较熟悉的大臣出城，直奔突厥大军。\n\
    \n颉利可汗看到李世民就带了这么几个人来，很奇怪，心里犯嘀咕：“都说这小子能打仗，没想到这么狂，莫非有什么陷阱，先看看无妨。”没想到，李世民一个人径直来到桥上，大呼其名。突厥将士的目光齐刷刷转向了“大汗”：“老板，叫你呢。”颉利可汗犹豫了一下：“直接射死这小子，传出去了不好听。过去看看吧，不能装，要不这以后怎么在弟兄们面前混啊。”为示威严，颉利可汗也打马直接上桥，没有显示出丝毫停顿。突厥将士均暗自赞叹：“老板真给力啊！”\n\
    \n# 帝王术连环除对手\n\n武则天的父亲武世䪖，原本是一个木材商人，因参加了李渊反隋的起义，唐王朝建立后曾官至工部尚书。武则天生长在这样一个家庭，从小就受到比较好的教育。但她9岁时，父亲就过早地去世了。武则天容颜姣美，天生丽质，举手投足，楚楚动人。其性格刚厉，好猜忌，有权略，聪慧过人。14岁时，唐太宗召她入宫，封为才人，赐号武媚，人称媚娘。帝王的后宫等级森严，皇后之下，有四妃、九嫔，然后才是才人。皇宫中有不少才人，终其一生，皇帝都没有召见过，老死宫中，无人过问。武则天的性格和禀赋，决定了她不可能甘居才人的卑下地位而无所作为。她进宫以后，不仅为唐太宗所赏识，而且与太子李治暗通情愫，深得李治的喜爱。公元\
    \ 649 年，唐太宗驾崩，武媚娘与一些宫女一道依旧制被送到感业寺，削发做了尼姑，时年 26 岁。\n\n即位的唐高宗也深深怀念武媚娘，一天他驾临感业寺进香，与武则天相会，牵动旧情，于是让她重蓄乌发，入宫侍寝。这时的媚娘已在感业寺中度过了五年孤灯清影的生活，这一经历肯定对武则天的心理产生了极大的影响。重返后宫的武则天把权术和地位看得比什么都重要，从此，她便凭借着自己的才智，开始了争夺最高统治权力和地位的艰难历程。她的第一个目标，就是打倒萧淑妃。当时萧淑妃深得高宗宠爱，而王皇后则倍感凄凉。萧淑妃生了儿子以后，母以子贵，更加得意忘形。备受冷落的王皇后想利用初进宫的武则天牵制萧淑妃，这正好为武则天提供了一个极好的机会。一方面，她使出浑身解数，利用女人特有的魅力，充分满足高宗的欲望，使高宗一刻也离不开她；另一方面，她又极力讨好王皇后，竭尽阿谀奉承之能事，骗取王皇后的信任，王皇后多次在高宗面前称赞武则天。不久，唐高宗册封武则天为昭仪。武则天与王皇后联合起来，百般诋毁萧淑妃，唐高宗贪于新欢，很快就对萧淑妃厌倦了，萧淑妃最终被废为庶人。\n\
    \n武则天的第二个目标就是打倒王皇后，自己当皇后。因此萧淑妃被废以后，她立即又把矛头对准了王皇后。在实现这一目标的过程中，武则天充分展现了她的权谋和刚厉阴毒的性格。她与王皇后不接近的后宫之人倾心交结，广施恩惠，使她们与自己一道共同反对王皇后；同时，通过她们及时了解高宗和王皇后的动静，掌握宫中动态。在做了充分准备以后，她就开始向王皇后发动进攻。首先，她向高宗诬告王皇后同母亲一道在宫中搞魊胜之术，使高宗对王皇后产生厌恨之心。萧淑妃被废，王皇后还自鸣得意，以为武则天是自己的贴心人。但她很快就发现，武则天是一个比萧淑妃更加厉害的新对手。武则天日益受到高宗的专宠，不久便身怀六甲。王皇后最大的心病就是没有怀孕。皇后之子即为太子，母以子贵，皇后的地位才能稳固。面对武昭仪的威胁，王皇后与舅父中书令柳奭商议，决定劝高宗立地位低贱的刘氏之子燕王李忠为太子，以巩固自己的地位，同时也杀一杀武昭仪的锐气。\n\
    \n武则天有了身孕后，更得高宗宠爱。她得知燕王李忠立为太子的阴谋后，决定采取非常步骤，促使高宗废后。为了达到废后的目的，武则天不惜采用残忍的手段，活活掐死了自己的亲生女儿，然后嫁祸于王皇后。王皇后有口难辩，含冤失宠。唐高宗决定废黜王皇后，立武则天为皇后。但是围绕着废后和立后的问题，朝廷内掀起了一场轩然大波。武后生有四个儿子，长子李弘，次子李贤，三子李显，四子李旦。李弘为太子，高宗打算传帝位给他。武则天并不是一个按传统办事的女人，她虽掌握了国家的最高权力，但还想拥有与实际权力一致的名位，也就是说她还想称帝，当一个女皇帝。为达到这一目的，她用药酒毒死了李弘。李弘死后，高宗又立李贤为太子，并令他监国。李贤容貌端正，富于文才，更为武后嫉恨，不久，她又找借口废李贤为平民，将他流放到四川巴中地区。后来听说李贤不满，又令人逼其自尽。李贤被废后，高宗又立李显为太子，立李显的儿子李重照为皇太孙。\n\
    \n公元 683 年，高宗去世，李显即位，是为中宗。尊武后为皇太后，朝中政事仍由太后裁决。中宗不甘受制于太后，打算以韦玄贞为侍中，宰相裴炎认为不可。中宗大怒，说：“朕就是把天下交与韦玄贞又有何不可，何况侍中！”裴炎密告太后，于是武则天召集百官于乾元殿，勒兵入宫，废中宗为庐陵王。其子重照也被武后杖杀。就这样，武则天的四个儿子，三个被她除掉了。俗话说“虎毒不食子”，可是武则天为了当皇帝，却不惜一再杀死自己的亲生儿子，可见其决心是何等的坚决，其手段又是何等的残忍！\n\
    \n武后生有四个儿子，长子李弘，次子李贤，三子李显，四子李旦。李弘为太子，高宗打算传帝位给他。武则天并不是一个按传统办事的女人，她虽掌握了国家的最高权力，但还想拥有与实际权力一致的名位，也就是说她还想称帝，当一个女皇帝。为达到这一目的，她用药酒毒死了李弘。李弘死后，高宗又立李贤为太子，并令他监国。李贤容貌端正，富于文才，更为武后嫉恨，不久，她又找借口废李贤为平民，将他流放到四川巴中地区。后来听说李贤不满，又令人逼其自尽。李贤被废后，高宗又立李显为太子，立李显的儿子李重照为皇太孙。\n\
    \n# 帝王术与当今管理驭人兼用\n\n管理是什么，个人认为，一个是管一个是理，管是什么，当然是管人，那理呢，理事，也就是经营。个人的能力是有限的，在怎么有能力的人也不可能凭一个人的力量做成所有事，所以就要靠其他人，靠朋友，靠下属，甚至靠上级靠领导，古代的高祖刘邦，水浒里的宋江，他们都没什么大本事，武功不行，打仗不行，文化不行，可他们都成了霸主，就是因为他们会利用人，也就是驭人术，驭人术包含了管理学，心理学，人际学，厚黑学等，是一门涉及很广的学问。\n\
    \n首先我觉得不管是管理还是驭人，目的只有一个，就只利用他们达到自己的目的。那怕用完就丢掉。要知人善用。\n\n### 人得类型\n\n我觉得人大概分为几类，你身边的所有人都能从这里找到，现在介绍他们的特点与怎样驾驭。\n\
    \n- 高傲型：\n  高傲大家都明白，这种人往往都有一定的能力，他们高傲自然是有一定高傲的资本，对付这种人有两种方法，一是分化型，所谓分化就是分化他的能力，例如他的业务很好，但是人很高傲，那怎么办，就是分化他高傲的资本，怎么分化呢？可以再培养一个人或是自己提高业务水平来和他抗衡，这样就让他知道，不光是他一个人有能力，所以不要太傲。\n\
    \n  另一种方法就是让他失败一次，而且要很重要的失败，让他刻骨铭心。当年诸葛亮就是用这种办法收复的关羽，关羽够傲吧，相信在也找不出比关二哥更傲的人了，可孔明是怎么收复二爷的呢，他让二爷去守华容道，为什么？因为他不想让曹**，当时刘备的力量并未成型，全部兵马两万，将不过关\
    \ 张 赵三员，如果曹操一死，东吴很可能反咬一口把刘备吃了，然后和魏国二分天下。为了避免这样的局面出现，所以曹操不能死，看遍刘备阵营，只有关\n"
