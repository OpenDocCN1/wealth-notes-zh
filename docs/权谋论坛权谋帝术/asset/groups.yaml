    # 和谐统一之权——内外有别，恩威并重


    作为唐朝的第二任皇帝，唐太宗在“权”的方面，主要面临的任务有两个：一是得到皇位，拥有至高无上的权力；二是开拓疆土，成为全天下的君主。对于内部的争权者，杀之，无话可说；对于外部的争权者，盟之，不服则打。但在整个用“权”的过程中，均采用了恩威并重的方法。


    +   •玄武门之变'
  - '[PAGE 185]


    众所周知，历朝历代皇位斗争都是最激烈、最残酷的，特别是在嫡长子或者皇太子实力不济之时。唐太宗李世民排行第二，恰好也有这么一个大哥，是其皇位的最强竞争者。而其父亲唐高祖李渊呢，又是一个特别保守的人，一直认为嫡长子应该继承自己的位置。


    李世民是个很有心计的人，他知道嫡长子的位置是没法争了，但可以另辟蹊径，从能力、业绩、威望等方面全面超越。于是，李世民私下里学习刻苦，注意自身修为，而且还广交朋友，培植自己的势力。另外，他牢牢掌握了军权，善待手下将领和士兵，对老百姓也很好，在军队和百姓中有很高的威望。特别是在唐朝'
  - '[PAGE 186]


    定国后，为稳定局势而进行的六次大规模的征讨活动中，李世民起到了巨大的作用。如果把六次战争的胜利比作足球场上的六个进球，那么，李世民一个人就完成了四个进球，另外还助攻两次。最重要的是，他在最关键的决赛（唐军
    vs 王世充加窦建德联军）当中，打入了制胜一球。在这一仗之后，李世民的威望和势力达到了极致。据说，他回到长安时，受到军民以及皇帝的礼仪招待。


    这种情况，让大哥李建成很是担心。当然，李建成也不是省油的灯，他这些年更注重把持朝政，而且和一些权臣搞好关系。另外，他给四弟李元吉很多许诺，二人关系很好。关键时'
  - '[PAGE 187]


