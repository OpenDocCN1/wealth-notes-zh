    # 帝王术不同时期用不同人做事


    清太宗皇太极不仅是一个文武双全、智勇兼备的优秀君王，而且也是一位求贤若渴，善于惠政揽人、敢于大胆用人、能够充分信任和器重人才的卓越领导者。在他统治的17年里，他充分认识人才的重要作用，积极采取有效措施，广揽满、汉、蒙古（尤其汉族知识分子）各族人才，并委以重任，给他们提供施展才华的政治舞台，从而为清兵入关夺取全国政权、代明而立奠定了坚实的人才基础。


    清太宗深知人才的重要性，他在建立“大清国”之后即实行开科取士，为兴盛大清畅通荐才渠'
  - '[PAGE 353]


    道。即便在残酷的战争年代，他也时刻不废渴求人才拳拳之心，并一再提醒部下：“惟多得人为可喜耳。金银币帛，用之有尽，如收得一二贤能之人，堪为国家助力，其利赖宁有穷乎？”


    为了从更大范围延揽天下英才而用之，明崇祯八年，后金（清）天聪九年，亦即 1635 年，他面向全国下达了不拘一格网络天下英才的《荐贤诏》：朕惟图治以人才为本，人臣以荐贤为要。尔满、汉、蒙古各官果有深知灼见之人，即当悉行举荐。所举之人，无论旧归新附，及已仕未仕，但有居心公正、克服任使者，即'
  - '[PAGE 354]


    呈送吏部；有通晓文艺，居心公正、足备任使者，即呈送礼部。该部贝勒奏闻，朕将量才录用。天下才全德各之人，实不易得。但能公忠任事者，其速行举荐。


    从清太宗的《荐贤诏》，我们可以看出皇太极用人有如下几个特点：


    一、用人不拘一格。满、汉、蒙古不分区别，但凡有才之士，皆在举荐之列。不分旧归新附，也不论是否及仕任职，发现足可任事者，都可大胆启用。所揽人才，不论才能高低，不以求全责备论之。能克胜任使者用，足备任使者亦'
  - '[PAGE 355]


    用，并不企求找到与任用完美无缺之人，颇具清醒而务实的用人之风。


    二、用人标准明确。国家以人才为本，大臣以荐贤为要，君臣合心，通力延揽人才。在清太宗皇太极的眼里，他的总体标准是“贤”。具体而言，就是重视居心公正，要求忠诚官事，看重克胜任使。也就是说，他用人首重其德，次重其忠，更重其才，力求才堪任用，能够有助国事。


    三、量才录用，信任器重。清太宗非常重视人才作用的发挥，尤其他深知在清兵入关、夺取'
