    二，诸葛亮在刘备面前是个小儿科。刘备是什么人物？是经历过镇压黄巾军起义，做过地方官吏，几次历经生死一线的人，是政治上的老手，城府深得很。曹操青梅煮酒论英雄，早就把他当做一个强敌了，那时刘备还是羽翼未丰呢。诸葛亮博学多才自是不假，但是学问和睿智代替不了经验，当时诸葛亮只有
    27 岁，每日“躬耕陇亩”，只是志向远大，“每自比于'
  - '[PAGE 128]


    管仲、乐毅”，然而他连南阳都没走出去过，更没有政治经验和实践磨砺，这与老道的刘备相比简直是小儿科。诸葛亮再能耐也毕竟不是神仙，隆中对不过是他自己想象中的一种政治见解而已，也不见得多高明。毛泽东就曾这样评价隆中对：“其始误于隆中对，千里之遥而二分兵力。其终则关羽、刘备、诸葛亮三分兵力，安能不败”。对诸葛亮的战略是持否定态度的。然而刘备喜欢，因为诸葛亮的策略很对自己的心思，诸葛亮说出了他想要的。


    三，刘备急于寻找政治上的出路。刘备为什么三顾茅庐，你说他求贤若渴也对，说他在寻找政治上的代言人会更恰当。刘备想称雄自不'
  - '[PAGE 129]


    必说，然而天下之大却没有他的立锥之地，被曹操追的惶惶不可终日，只能寄人篱下。他何尝不会有夺荆州取益州的心思？这也是明摆着的事，北方都是曹操控制，东南是孙权，他要想称霸，除了荆益二州也没别的地方可选了。然而他不能做，那样就会落下不仁不义的罪名。这下好了，诸葛亮当了替罪羊，“而其主不能守，此殆天所以资将军”、“智能之士思得明君”，这是上天的安排，理所当然的事，他们即是这样的不中用，你不去占领替代他们，天下智能之士都会觉得遗憾，刘备焉能不“有意乎”？'
  - '[PAGE 130]


    四，刘备在政治策略上需要舆论的支持。刘备想夺荆益二州，势必背上同室操戈的罪名，落得个伪道义的嘴脸。况且人家在他受难时收留他，没理由下手。诸葛亮正好为刘备找到了政治上的借口，并且替刘备做了舆论上的宣传。刘备把诸葛亮捧得极高，“孤之有孔明，犹鱼之有水也”，不如说是他想利用诸葛亮的声名替他造势，利用诸葛亮之口为自己的政治图谋寻找借口。来实现他自己的政治目的，话从诸葛亮口中说出来，与刘备自己做出来毕竟不一样。所以他不顾“关羽、张飞等不悦”，“于是与亮情好日密”。刘备并不是很信任诸葛亮，'
  - '[PAGE 131]


    他是有头脑的，这在后来刘备临死托孤之际交代给诸葛亮的话中，就能窥其一斑。


