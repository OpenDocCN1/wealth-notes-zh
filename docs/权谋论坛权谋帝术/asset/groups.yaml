    # 皇帝集中央之权


    皇帝集中央之权，主要体现在皇帝与宰相之间的权力变化，就是宰相的权力逐步削减，直至消亡，而削减的宰相机力则都集中到皇帝手上了。


    在战国时期，开始出现丞相相职，当时的丞相权力相当大，可以开府治国，总领政务，除了军事上的事，其他的丞相几乎可以说了算，君主最终就是表个态，同意还是不同意。因此，'
  - '[PAGE 246]


    战国时代涌现出了一大批强力变法大臣，他们可以按照自己的思想去变革所在国的政治、经济、军事、文化制度。因此当时丞相与君主的关系，颇有点像现在君主立宪制国家里首相和元首的关系。正是因为当时的丞相比较独立，权力很大，所以当时的吕不韦才能为封为“仲父”，这要放以后的朝代，那是绝对的大逆不道，除非你表明了要造反，否则谁也不敢称皇帝的“父”。


    在汉代，宰相的权力依然很大。当时皇帝和宰相各有一个“秘书处”，有各自的财政来源和财政大臣。皇帝的“秘书处”是六尚（尚是掌'
  - '[PAGE 247]


    管的意思）：尚衣、尚食、尚冠、尚席、尚浴和尚书，前五尚是管皇帝的饮食起居的，尚书就相当于皇帝的文员。而宰相的“秘书处”就很大了，有十三曹，负责政府的一切事务。政府的财政来源是田税，皇帝的资金来源是山矿盐商，当时田税是大宗，山矿盐商的收入只占一小部分。掌管政府财政的是大司农，而掌管皇帝财政的是少府，皇帝不能大司农的钱。大司农和少府都是九卿之一，也都归宰相管。也就是说政府皇帝的财政都要归宰相管。而实际上，皇帝的
    所有事物都由宰相管，因为当时皇室的所有事物都归御史中丞管，而御史中丞也是归宰相管的。'
  - '[PAGE 248]


    而到了唐代，就没有宰相了，宰相一分为三，变成了“委员会制”，宰相的职务分给了三省，即中书省、门下省、尚书省。中书省负责拟定政府的一切命令，包括皇帝的最高命令——


    “敕”；门下省负责复核审查命令；尚书省则负责执行。凡属皇帝的命令都需要在政事堂会议中正式通过，在敕字下加盖“中书门下之印”，然后再送尚书省执行，若未加盖“中书门下之印”，而由皇帝直接发出的命令，在当时是被认为违法的。当然唐代也有皇帝不经中书省而直接下命令的，但这种被当时人看作很不寻常的事，于是就被记录了下来。当时的唐'
  - '[PAGE 249]


