    ## 帝王术在起步阶段的施展很重要


    刘备从一介平民，经过个人奋斗，成为九五之尊，认真探究起来，必有其成功之道。常言说，乱世出英雄。社会大动乱的大环境，给每个有志气有才能的人提供了难得的机遇，不过有人成功，有人失败。在中国历朝历代的开国皇帝中，有如刘邦、刘秀、朱元璋，等等，就是从社会最底层经过奋斗成功的范例；而陈胜、吴广，陈友谅等，就是奋斗未获成功的例子。刘备从平民到皇帝，经过了几十年的奋斗，最终获得成功，排除环境和客观因素，就刘备主观上而言，我认为主要有以下八大因素。


    ### 一、立志


    立志是刘备成功的根本因素。刘备屡败屡战，斗志不减，根本在于志存高远，不因一时之得失而心灰意冷。刘备少有大志。就像陈胜曾经与一起劳作的人聊天时说的，燕雀安知鸿鹄之志哉！《三国演义》在刘备出场时有一大段话，表明了刘备不是社会底层碌碌无为的一般百姓。当时黄巾军前来犯幽州境界，刘焉招募义兵相抗，引出了一位英雄：“那人不甚好读书，性宽和，寡言语，喜怒不形于色，素有大志，专好结交天下豪杰”；“家住本县楼桑村，其家之东南，有一大桑树，高五丈余，遥望之，童童如车盖。相者云：此家必出贵人。玄德幼时，与乡中小儿戏于树下，曰：我为天子，当乘此车盖。叔父刘元起奇其言，曰：此儿非常人也”。这段话，表明了刘备自小就蓄大志，这个大志不是别的，而是当皇帝。刘备与张飞、关羽相识，结为异姓兄弟时，表明要救困扶危，上报国家，下安黎庶，也可看出其志向。曹操煮酒论英雄，当说到“当今天下英雄，唯使君与操耳”时，刘备惊得筷子掉在地上，说明曹操说中了刘备的心事。刘备三请诸葛亮，诸葛亮前两次避而不见，我看主要是不明刘备志向，常言道，良禽择木而栖，诸葛亮作为一代良相，自当要寻英主。刘备三顾茅庐时，诸葛亮明说了：“愿闻将军之志”，刘备屏退旁人后说：“汉室倾颓，奸臣窃命，备不量力，欲伸大义于天下”，通俗地说，就是要取天下而治理之。刘备立志可见一斑。


    ### 二、用贤


    用贤是刘备成功的关键因素。刘备用贤，最重要的是用了诸葛亮。刘备三顾茅庐，请到诸葛亮后，成了刘备事业的转折点。在此之前，刘备东奔西逐，遑遑似丧家之犬，没有立身之地，虽有大志，但不得伸。得到诸葛亮后，取荆州，定益州，终成帝业。刘备一生，对诸葛亮非常信任，大事都委任于他，让诸葛亮放手去做，从不生疑。诸葛亮也竭尽心智，鞠躬尽瘁，死而后已。正因如此，刘备才能取得成功。在用贤方面，刘备还用了庞统、马良等人，但终究没有表现出什么特出之处。特别是庞统，经孔明推荐，刘备并不识其才，几乎错过。而其他贤才，在诸葛亮的光芒掩映之下，也未得以充分发挥。因此，在刘备集团，不像曹操集团那么人才济济，倒像是诸葛亮一人之外，有点人才凋零的样子。这也是刘备的事业很快消亡的重要原因。


    ### 三、结义


    结义是刘备成功的重要因素。桃园三结义，历来为人们津津乐道，认为这体现了中国人关于义的最高境界。但刘备结义，乃是深谋远虑，主要是从事业考虑。在刘备的过程中，关张二人多次救了刘备的命。到后来，成为刘备事业的柱石。刘备入西川后，关羽镇守荆州，与曹军和东吴对峙；刘备夺取益州后，张飞任巴西太守，与新占汉中的曹军在第一线对峙。关张二人，是刘备集团的核心骨干成员，刘备集团的凝聚力、战斗力由此二人支撑。关张一生，从未与刘备离心离德，而是团结一心，浑然一体。在刘备的一生中，用义气笼络人体现最充分的另一个例子是赵云，赵云被刘备用义气打动，跟随刘备一生不悔，为刘备的事业立下大功。


    ### 四、借势


    刘备善于借势，这也是刘备事业成功的重要因素。刘备本是一介平民，不像曹操有曹家和夏侯家两大家族的势力可供倚赖，也没有孙权那样有父兄创下的宏大基业。刘备完全是白手起家。在那个时代，要做出一番伟业，必须有人跟随，组成一个势力集团。一介平民百姓，要得到别人的信任，做到一呼百应，是非常不容易的。但是刘备有办法，他充分利用了他的姓氏，也就是当时的皇姓。说他是什么中山靖王之后，一下子成了皇族血统。不仅如此，他还攀上了皇帝的叔叔的尊位，被尊为皇叔。刘姓本是中国大姓，是不是皇室血统，在当年那个乱世，想来也没有什么人去认真追究，即使追究，也不一定弄得清楚。刘备与人交往，口必称备乃中山靖王之后，打着维护汉室的旗号，以后登上皇帝宝座时又打着恢复汉室的旗号，确实蒙住了一些人。中国历来有名正言顺的说法，名不正则言不顺，言不顺则事不成，刘备深谙此道。刘备打着中山靖王之后的旗号，也增强了其事业的正义性，自己理直气壮，跟随他的人也理直气壮了。


    ### 五、装衰


    刘备有装衰的本事，是一个表演天才。历史上有一种说法，说刘备的江山是哭出来的江山，此话大致不假。综观《三国演义》通篇，写刘备哭泣、下泪的不下几十处，刘备真是一个哭才。刘备三请诸葛亮时，见其不肯出，即哭，孔明见刘备哭，就同意了。在刘表府上，在刘表墓前，刘备都曾哭过。为不还荆州给孙权，刘备哭过。娶孙尚香时，刘备在吴国太前哭过。在与刘璋相见时，刘备哭过。赵云当初离开刘备回公孙瓒处，刘备泣别。在襄阳携民渡江时，刘备大恸。在长坂坡，赵云救回了阿斗，刘备哭了。关羽、张飞死后，刘备终日哭泣，以致泣出血来。常言道，男儿有泪不轻弹，刘备作为堂堂男子汉大丈夫，为什么动不动就哭鼻子流眼泪呢？难道是真正到了伤心处吗？我看不一定。哭，只是刘备的一种处事待人的方式，是为了感动别人，打动别人，使别人被感动，引起别人同情。有时是为了表明诚心。但有时又是惺惺作态，作给别人看的。比如在襄阳渡江时，面对百姓大恸，就主要是做给别人看的，作出一种爱民如子的样子。在长坂坡赵云救回阿斗后的哭泣，既有伤心的成份，也有做样子的成份。看来，即使是想当皇帝的人，装裱也是一种可用且有效的手段。


    ### 六、傍款


    这里说的傍款，是借用当今傍大款的说法。傍款，其实也是借势的一种做法。但刘备的傍款，不只是借势，自己势力弱小时，去依傍某个强大的势力，保存自己的实力，慢慢发展壮大自己。而是夺势，喧宾夺主，以客代主。三国时期的绝大多数强大的势力，刘备几乎都去傍过。最早是傍公孙瓒、田楷，然后是傍吕布、陶谦，再是傍曹操、袁绍，然后是傍刘表、孙权，再后是傍刘璋。刘备傍大款，不只是勉从虎穴暂栖身，而是处心积虑，暗中抢夺地盘实力，准备独树一帜，反客为主。在与公孙瓒打交道时，曾向公孙瓒借兵，暗地拉拢赵云，挖公孙瓒的墙脚，由于公孙瓒警惕性高，逼着刘备还人，才未得逞。与陶谦打交道时，实际上抢夺了徐州。在与袁绍和曹操打交道时，没有占到便宜。后来，只好打同宗的主意。打刘表的主意时，被蔡瑁识破，才有马跃檀溪，但刘表死后，还是抢到了江夏作为根本。与孙权打交道时，占到了荆州的一大块地盘。最后，算盘打到了宗兄刘璋的头上，抢到了益州，终成帝业。刘备的地盘、人才，基本来自于荆州、益州。刘备从白手起家，傍款，借用已有的势力，是他的一种重要策略，这也是他能够成功的重要因素。


    ### 七、联姻


    刘备最早的夫人是谁，看过《三国演义》之后摸不着头脑，最早见到的刘备的夫人，是糜夫人和甘夫人。糜夫人是徐州豪富糜竺的妹妹。甘夫人是在小沛时娶的，不知来源如何。刘备娶糜夫人，据说是糜竺见刘备身边没有女人，没人照顾，而把妹子嫁于他的。但实际上，糜竺在徐州算一个大财主，且有影响力。刘备娶其妹，不乏政治上的考虑。糜夫人死于当阳长坂坡。甘夫人生了阿斗，因长期战乱，死于赤壁之战前后。由此，有人说刘备命硬克妻。赤壁战后，孙权把其妹孙尚香嫁给刘备为妻。这个婚姻，应该更多政治成份，是为了巩固孙刘联盟。因为刘备时年已经49岁，孙尚香还是二八佳人。刘备入成都后，孙尚香回了东吴。刘备又娶了一个寡妇——刘焉之子刘璋的妻子——吴夫人。刘备娶吴夫人，一则可能是因为她漂亮，二则可能是为了笼络益州人，巩固他在益州的地位。由此看来，刘备的婚姻，殊少爱情因素，更多政治因素，这也是政治人物的悲哀。


    ### 八、逃命


    刘备一生，逃命之时颇多。把逃命也列为刘备成功的法宝之一，是因为逃命在刘备事业成功中的重要作用。刘备深谙“留得青山在，不怕没柴烧”的道理，正由于他具有百折不挠的精神，才使得他最终能成就大业。值得一提的是，刘备逃跑有术，每每大难不死，又死灰复燃。著名的逃跑，有从徐州逃到袁绍处，有从袁绍处逃到荆州刘表处，有从新野、樊城经长坂坡逃到江夏，最后的一次逃跑，送了老命。也就是夷陵一战大败，逃回白帝城，抑郁成疾，又羞于见人，不敢回成都，终至不起。综观《三国演义》，刘备基本不会打胜仗。正如陆逊在夷陵之战中所论：寻备前后行军，多败少成，推此论之，不足为戚。还有一段，谈及刘备会逃跑、会打败仗：备是猾虏，更尝事多，其军始集，思虑精专，未可干也。今往已久，不得我便，兵疲意沮，计不复生，掎角此寇，正在今日。陆逊之论确实精到，对刘备的分析精辟入微，正是其看透了刘备，所以才定下掎角此寇之大计，一举击溃刘备，使之一蹶不起。


    ## 帝王术施展政治谎言高手


    诸葛亮“天下三分”的论断最初见诸于他和刘备畅谈天下大势的“隆中对”上。路卫兵在反复研读这段对话后，发现这不过是刘备用障眼法上演的政治谎言，是老谋深算的刘备亲手导演的一场政治阴谋。


    陈寿在《三国志》中这样记载的这段著名的对话：刘备问计诸葛亮，“君谓计将安出？”诸葛亮回答说：“今操已拥百万之众，挟天子而令诸侯，此诚不可与争锋。孙权据有江东，已历三世，国险而民附，贤能为之用，此可以为援而不可图也。荆州北据汉、沔，利尽南海，东连吴会，西通巴蜀，此用武之国，而其主不能守，此殆天所以资将军，将军岂有意乎？益州险塞，沃野千里，天府之土，高祖因之以成帝业。刘璋暗弱，张鲁在北，民殷国富而不知存恤，智能之士思得明君。将军既帝室之胄，信义著于四海，总揽英雄，思贤如渴，若跨有荆、益，保其岩阻，西和诸戎，南抚夷越，外结好孙权，内修政理；天下有变，则命一上将将荆州之军以向宛、洛，将军身率益州之众出于秦川，百姓孰敢不箪食壶浆，以迎将军者乎？诚如是，则霸业可成，汉室可兴矣”。


    从诸葛亮 的这段对答中我们不难看出出以下几个问题：


    - 一，诸葛亮“三分天下”的言论很合乎刘备的心思。曹操实力雄厚，自不必说，孙权占据江东天险，也是不可动摇了。这不是只有27岁的诸葛亮能看出来的问题，历经“军阀混战”、年纪将近50岁的政治老手刘备焉能不知？刘备当然想成就为第三方势力，诸葛亮这话是说到他心里去了。

    - 二，刘备是个无家可归的人。刘备前期一直不顺，徐州被吕布攻取之后，就投奔了曹操，然后又与董承合谋想推翻曹操，结果被曹操发觉，只得逃奔袁绍，曹操灭袁绍后，刘备又投靠荆州的刘表，荆州降曹后，刘备又被曹兵追的逃往夏口，到刘表的儿子刘琦处安身，可谓颠沛流离，几乎到了山穷水尽的地步。

    - 三，诸葛亮的战略很幼稚。请看：“天下有变，则命一上将将荆州之军以向宛、洛，将军身率益州之众出于秦川，百姓孰敢不箪食壶浆，以迎将军者乎”？说的何其轻松，却并没有实质上的战略战术。要搁现在，就是个标准的大忽悠。“百姓孰敢不箪食壶浆，以迎将军者乎”，就更是天真的想象了，刘备是“帝室之胄”老百姓就一定热烈欢迎？就不敢不欢迎？即是这样，又何来“苍天已死，黄天当立”的黄巾军起义呢？理由站不住脚。而且诸葛亮一直想当官。他“躬耕陇亩”，却“每自比于管仲、乐毅”，对刘备很是吹捧：“将军既帝室之胄，信义著于四海，总揽英雄，思贤如渴”，完全不是让刘备在草庐外坐等的姿态了。


    路卫兵之所以认为“隆中对”是刘备用障眼法上演的政治谎言，是刘备导演的一出政治阴谋，有以下五个理由：


    - 一，刘备所谓的“兴复汉室”本身就是一句门面话。刘备起兵反曹，政治口号是兴复汉室，然而汉室本身就存在着，曹操虽“挟天子以令诸侯”，但也没敢废掉汉皇自己称帝。曹操是“汉贼”，刘备执政就是兴复汉室？就是正义的了？其实这不过是刘备自己的政治野心，自己想掌权而已。再说兴复汉室一定得用你刘备？刘备是中山靖王刘胜之后，镇压黄巾军起义后以县令起家，只能勉强还算是汉室的皇亲，但绝非宗亲，刘表刘璋可是正儿八经的汉室宗亲，要兴复汉室，怎么也轮不到刘备。

    - 二，诸葛亮在刘备面前是个小儿科。刘备是什么人物？是经历过镇压黄巾军起义，做过地方官吏，几次历经生死一线的人，是政治上的老手，城府深得很。曹操青梅煮酒论英雄，早就把他当做一个强敌了，那时刘备还是羽翼未丰呢。诸葛亮博学多才自是不假，但是学问和睿智代替不了经验，当时诸葛亮只有
    27 岁，每日“躬耕陇亩”，只是志向远大，“每自比于管仲、乐毅”，然而他连南阳都没走出去过，更没有政治经验和实践磨砺，这与老道的刘备相比简直是小儿科。诸葛亮再能耐也毕竟不是神仙，隆中对不过是他自己想象中的一种政治见解而已，也不见得多高明。毛泽东就曾这样评价隆中对：“其始误于隆中对，千里之遥而二分兵力。其终则关羽、刘备、诸葛亮三分兵力，安能不败”。对诸葛亮的战略是持否定态度的。然而刘备喜欢，因为诸葛亮的策略很对自己的心思，诸葛亮说出了他想要的。

    - 三，刘备急于寻找政治上的出路。刘备为什么三顾茅庐，你说他求贤若渴也对，说他在寻找政治上的代言人会更恰当。刘备想称雄自不必说，然而天下之大却没有他的立锥之地，被曹操追的惶惶不可终日，只能寄人篱下。他何尝不会有夺荆州取益州的心思？这也是明摆着的事，北方都是曹操控制，东南是孙权，他要想称霸，除了荆益二州也没别的地方可选了。然而他不能做，那样就会落下不仁不义的罪名。这下好了，诸葛亮当了替罪羊，“而其主不能守，此殆天所以资将军”、“智能之士思得明君”，这是上天的安排，理所当然的事，他们即是这样的不中用，你不去占领替代他们，天下智能之士都会觉得遗憾，刘备焉能不“有意乎”？

    - 四，刘备在政治策略上需要舆论的支持。刘备想夺荆益二州，势必背上同室操戈的罪名，落得个伪道义的嘴脸。况且人家在他受难时收留他，没理由下手。诸葛亮正好为刘备找到了政治上的借口，并且替刘备做了舆论上的宣传。刘备把诸葛亮捧得极高，“孤之有孔明，犹鱼之有水也”，不如说是他想利用诸葛亮的声名替他造势，利用诸葛亮之口为自己的政治图谋寻找借口。来实现他自己的政治目的，话从诸葛亮口中说出来，与刘备自己做出来毕竟不一样。所以他不顾“关羽、张飞等不悦”，“于是与亮情好日密”。刘备并不是很信任诸葛亮，他是有头脑的，这在后来刘备临死托孤之际交代给诸葛亮的话中，就能窥其一斑。

    - 五，刘备自己一直想做皇帝。刘备的口号是兴复汉室，然而曹丕称帝后，刘备便迫不及待的称帝，这能说是“欲伸大义于天下”吗？既要为天下讨公道，为汉室讨公道，何以不扶持一个汉室宗亲为帝呢？整天嚷着“汉室倾颓，奸臣窃命”，而刘备自己又什么时候把汉皇帝放在眼里放在心里了呢？其原因恐怕就是他自己想做皇帝罢了。也对，谁愿意编一辈子的草鞋呀。


    ## 帝王术的奸诈与虚伪


    历史小说《三国演义》在内容倾向上，历来被人说成是“拥刘反曹”的，作者罗贯中把刘备塑造成了道德信义的化身。理所当然的，刘备也就成了理想明君的典范，既仁厚爱民，礼贤下士；又诚实忠义，贵义尚情。果真如此吗？笔者不敢苟同，其形象塑造实在是有违作者的创作意图，给人以“画虎不成反类犬”之感。


    鲁迅先生在《中国小说史略》中曾这样评论《三国志演义》的人物描写：“至于写人，亦颇有失，以至欲显刘备之长厚而似伪，状诸葛之多智而近妖。”[1]鲁迅先生对刘备形象作如此阐述，真可谓一语中的。这里鲁迅所说的“近伪”主要有两层含义：一是人物形象有违作者的初衷，与作者心目中想塑造的仁厚爱民、礼贤下士、诚实忠义、贵义尚情的理想的明君形象相去甚远；二是说人物的性格特征虚伪，是一个表面道德信义，实则假仁假义、残酷无情、不思进取而又欺世盗名的伪君子。


    刘备的这种艺术形象的成型，不仅有真实的社会历史土壤，而且也是中国历代文化的浓重沉淀的结果，铸造了這个人物形象，树立了仁君的典范。虽然作者为塑造這个人物而涂上了一层光亮的色彩，甚至不惜用了曲笔，以体现作者的主观理想和历代人民群众的愿望，但刘备毕竟只是一个封建军阀，不可能反映那个时代的基本特征。更何况他是一个由封建社会下层逐步挤进上层政治家，还不可避免的带上了小农意识的味道。他同样与董卓、曹操一样有政治野心，只是刘备掩藏得更深罢了！正是这些缺陷，才会把刘备塑造成了一个“近伪”的艺术形象，其虚伪特征要体现在以下四个方面。


    ### 一、残酷无情


    刘备是一个自私自利的人，全不为大局着想，又残酷无情，无半点怜悯之心。在第十五回中，他借古人之言说出了自己的心声：“兄弟如手足，妻子如衣服。衣服破，尚可缝；手足断，安可续？”对待至亲之人妻子儿女尚且如此，更何况他人呢？与其高祖刘邦可以不分伯仲啊！拉拢关、张，又何尝不是“惜其勇而用之”，为打拼自己的江山做准备。更可以作为印证的是第三十四回刘备一听说蔡瑁要设计害他，“急解‘的卢’马，开后园门牵出，飞身上马，不顾从者，匹马望西门而走”，半点没有想起赵云等三百将士，好一个“不顾从者”！看来他自家性命才是最重要的，其利害的取舍也可以窥见一斑了。


    为关、张复仇之事，好像义之极至，纵然赵云、诸葛亮等人劝阻，也无济于事。但当东吴把所有的仇人都送来的时候，并再次表示要送还夫人，返还荆州，以求和好后，刘备仍然不听，继续坚持“削平江南，杀尽吴狗”，可见刘备名义上是为“义”字复仇，实际上是为消灭东吴而战！其卧榻之旁又岂容他人酣睡！是为了自己的江山设计，是图美名而争天下者也。


    而其最残忍和无情的是，刘备为了自己的霸业，动辄便抛妻弃子，而且饥饿的时候竟然食同宗之人妻子之肉，真令人发指。第十九回有，“玄德见势已急，到家不及，只得弃了妻小，穿城而过，走出西门，匹马逃难”，还没有到生死关头，却把妻小都给抛弃了，深得上祖刘邦之遗风，这品质也够可以的了。


    更严重的是： “(刘备)到一家投宿，其家一少年出拜，问其姓名，乃猎户刘安也。当下刘安闻豫州牧至，欲寻野味供食，一时不能得，乃杀其妻以食之……(刘备)遂饱食了一顿……方知昨夜食者，乃其妻之肉也。玄德不甚伤感，洒泪上马。”刘安固是残忍、无耻，但罪魁是刘备。而饱食了一顿之后，刘备只是伤感而已，并没有大惊失色，更没有深疚自己，更没有给别人以适当的安慰和补偿，更别提嘱而埋之了。倒是曹操闻后，
    “乃令孙乾以金百两往赐之”，曹操真好雄，也没有食人妻子 的事情，也还知道补偿点什么给别人，相对比较，刘备也够残忍和无情的了。


    ### 二、欺世盗名


    刘备又是一个欺世盗名者。表面上他也打着“保国安民”的旗号，声称“灭曹操，共扶汉室”，利用自己占有汉家姓氏的一点便宜，便到处夸耀，显示自己的身份，时时刻刻以“汉室宗亲”自居，打着刘皇叔的金字招牌，口口声声表示“欲伸大义于天下”，“匡扶汉室”，以维护汉帝的正统地位相标榜。[2]实则不然，南朝人裴松之和元人胡三省在注《三国志》和《资治通鉴》时均已明确指出：刘备

