    # 帝王术获取权力引开注意力


    明朝第十代皇帝朱厚熹无子，他临死时遗诏：


    三个堂兄弟，谁先来到北京，谁就做皇帝。


    这三兄弟，分别在山西、河南和湖北，在湖北的朱厚熲听到消息后，向算命先生问命，算命先生趁机献上一计。


    朱厚熲依计而行。


    他坐着快马拉的囚车，抄着近路，连夜飞奔京城。为了避开对手视线，掩人耳目，他选个替身，另派一批人马，声势浩大，从另外一条路'
  - '[PAGE 350]


    线赶往京城。


    朱厚熹坐在囚车里，快马加鞭，先于其余两位皇兄到达京城，于是就绪足先登地继承了皇位。


    他就是明朝的嘉靖帝。


    我们是该感叹事情的荒谬呢，还是该赞叹嘉靖皇帝的谋略呢？


    这段史实表明了争夺皇位的激烈，我们也可以从另外的角度看待它。'
