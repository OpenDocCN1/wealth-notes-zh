    +   3. 四公子曹植（继承了曹操的文学才能，具有很高的文学，艺术方面的造诣，与老爸一起入选三国时期的七大才子，建安七子）


    +   4. 小公子曹冲（继承了曹操的谋略与智慧，被称为神童，曾经用妙法称量大象，被传为佳话）'
