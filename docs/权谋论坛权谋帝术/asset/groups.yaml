  - '[PAGE 36]


    使之改易。君臣可使之离合。万物本虚，万法本无，得虚无之窍者，知法术之要乎！'
  - '[PAGE 37]


    # 最残暴的帝王术是用杀不杀


    后世总结楚汉成败时，总不会忘记说残暴是造成项羽失败的重要因素。而项羽残暴的重要证据之一便是杀降。其坑秦降卒、坑齐降卒，杀秦王子婴及秦国宗室，尽失人心。但刘邦的杀降杀俘就很少作为一个问题提出来。其实这个问题不仅存在，而且还在一定程度上相当严重。


    早在反秦战争期间，刘邦与项羽协同作战时，就有过共同屠城的记录。如屠城阳。因为当时有项羽在，或可将此罪行记到项羽的账上。但'
  - '[PAGE 38]


    刘邦入秦时的屠武关（《秦始皇本纪》），就不能由项羽本分担了。众所周知，当时战争的酷烈，使得获胜一方在经过艰苦拼杀后，往往做出极其残暴的举动，即屠城。《项羽本纪》在汉四年，欲屠外黄事上，为后世留下了这方面的记录。估计刘邦的屠武关及楚汉战争时樊哙的屠煮枣，性质与此相类。但刘邦的问题不出在屠城上，而是在有计划地杀害降将方面。


    整个楚汉战争期间，为汉军俘获的一方势力人物为数相当不少。如魏王豹、赵王歇、代王陈余、代相国夏说、雍王章邯、齐王田广、塞王司马欣、韩王郑昌、殷王司马卬均属被俘。然'
  - '[PAGE 39]


    而除郅昌不详其所终外，其余均留下死于非命的记载。


    首先，明确记为禽，又记为斩或死者。如代相国夏说被擒（《淮阴侯列传》、《酈生陆贾列传》），《曹相国世家》记为斩；齐王田广为汉将曹参所虏，而《田儋列传》言田横“闻齐王广死，自立为王”。至于其何故而死则不可知。类似情况有：章邯分明为都昌侯朱轸所虏（《高祖功臣侯者年表》），《高祖本纪》言其自杀；陈余分明为张苍所虏（《张丞相列传》），《曹相国世家》等均言其为斩。赵王歇为禽（《淮阴侯列传》），《张耳陈余列传》'
  - '[PAGE 40]


    则明言“追杀赵王歇襄国”。两种记载之差异究竟如何，今已不可考。但笔者倾向于，这些人都是先被俘后被杀。因为死是不可改变的最后结局，而被俘可能是死前的某种状态，如章邯的被擒，就是上了功臣表这样的档案材料，应该最可靠；而《曹相国世家》记曹参之功为得王二，即俘虏了两个王，应该分别是魏王豹和齐王广。那么，上述人等皆有先俘后杀的嫌疑。这些人都是一方领袖，杀掉他们可以减少敌对势力的凝聚力。


    其次，明确被俘，又在相当一段时间后被处死，或死因不详者。如魏王豹明确被俘，却未立即'
  - '[PAGE 41]


    就死，只是在日后找理由将其杀害。汉三年，楚围荥阳，刘邦与陈平等弃军出逃，留投降的魏王豹与周苛等守城。周苛即以“反国之王，难与守城”为名，将其杀害。此等手段类似于秦二世以出巡期间诛杀大臣事，刘邦亦不想让这类杀降事与己沾上边，所以杀魏豹的周苛或因此而立功，其子周成或也因周苛之功而封侯，除此之外，周苛确实没有值得称道的功劳，所谓的守城被俘不屈，可能传说成分大于事实成分，毕竟周苛不是守城的最高甚至重要的汉军首领，项羽未必肯开出那么高的条件来收买他。在《功臣表》里有堂阳侯孙赤就是以惠侯的身份在荥阳被楚军俘虏并投降了，楚要封高'
  - '[PAGE 42]


    官也轮不到周苛。与此同类，故塞王司马欣之死亦属可疑。史称其因汉胜楚于成皋，与曹咎同自刭于汜水上。实际上，曹咎并非自杀，而是被斩。《高祖功臣侯者年表》则以曹咎为龙侯陈署所斩，这是陈署功劳薄上的记录，恐其斩曹咎事属实。因此，《项羽本纪》言曹咎及司马欣之自刭，皆不可信。再联系到日后汉王受伤入关，枭故塞王欣首之事，距其战败战“死”时间更已达数月之久。很难想象，在当时的条件下，可以将一个死者首级或尸体完好保存。如果不能保存，或就是能保存，枭其首于栎阳又有何意义呢。一种更大的可能是，故塞王司马欣当时只是被俘，后被处死。也只有'
  - '[PAGE 43]


    在示众后的斩首，才能显出汉之武功，也可以平当地之民愤，顺当地之民心。


    司马欣之死，当为《史记》中隐而微之事，却仍属有蛛丝马迹可寻者。而殷王司马卬之死，就毫无迹象留存。自汉二年司马卬降汉后（实则为灌婴所虏），就在《史记》中失了记载。而《汉书·高帝纪》却明确记其死于汉二年、汉从彭城败退后。此事不见于《史记》，班固或另有所见。如果班固所见不假，则司马卬之死与司马欣之死似有相通之处，即二者都死得不明不白。'
  - '[PAGE 44]


    尽管刘邦的杀降属于隐而微，但事实俱在，不容置疑。问题是，为何在放弃或失去抵抗后，这些人却遭到杀戮了呢？这个问题确实耐人寻味。联系到汉定天下后，韩信、彭越之死，或可对理解这个现象有所帮助。即，杀降是为了避免出现混乱局面，如果这不是全部理由，至少是一部分人如此结局的原因。


    魏王豹、代王陈余、赵王歇、齐王田广还有司马卬虽然不是最厉害的角色，但也都曾是领袖一方的人物。尤其前二人，都具有一定的开拓能力，有一定的凝聚力，可以登高一呼，从者云集。这样的人之存在，总是让志在天下的刘'
  - '[PAGE 45]


    邦心存忌讳。而司马卬亦非泛泛之辈，在赵王武臣失败后，司马卬曾一度变成了一支独立作战武装，其在秦之腹地作战，不仅没有被消灭，反而得到发展壮大。更有甚者，其先反叛项羽，后因力不能敌，与项羽派来讨伐的陈平媾和罢兵。这等能屈能伸的功夫，与刘邦极为相似，刘邦容他不下，亦是情理之中的事。至于章邯和司马欣，此二人是秦将，双手沾满了反秦武装的鲜血，刘邦对他们不仅在感情上不兼容，在理智上也不能允许他们继续存在。故在俘虏二人不久，即将其处死，满足了刘邦及其部下感情和理智的需求。还应该考虑到，赵地与齐地的平定并非一帆风顺，如果让赵、齐二国之'
  - '[PAGE 46]


    王留下来，对于二地的敌对势力来说，等于是留下了精神支柱。故处死二人，或可使两地的平定得以顺利进行。因此，刘邦的杀降将，是有其政治上的考虑的，而不能简单地归结于刘邦的本性残忍。如果与天下大势相联系起来考虑，才能见其深意。


    鉴于上述考虑，刘邦的杀降，或可包括临江王共尉。据《荆燕世家》：“汉王因使刘贾将九江兵，与太尉卢绾西南击临江王共尉。共尉已死，以临江为南郡。”而《傅靳蒯成列传》则另有说曰：“（靳歚）别定江陵，降江陵柱国、大司马以下八人，身得江陵王，生致之洛阳，'
  - '[PAGE 47]


    因定南郡。” 江陵王，即临江王，江陵为临江国都。则共尉并非战死，而是被生擒，《高祖本纪》明言，共尉是被“杀之雎阳”。其实汉击共尉一事，本来就不合情理。据《高祖本纪》，汉令卢绾、刘贾击共尉在汉五年正月后，其罪名是“故临江王骓为项羽，叛汉”。而《秦楚之际月表》记汉五年十二月，“汉虏骓”，表明，汉击临江之事是紧接着项羽之死、楚地大定之后就进行的。《史记》以一事之始的时间记其最终结果的现象经常发生，此为其一例。故临江之定或非此时的事，其始则可确定为此时的事。《韩信卢绾别传》称：“汉五年冬，以破项籍，乃使卢绾别将，与刘贾击临江王共'
  - '[PAGE 48]


    尉，破之。”汉初以十月为岁首，十二月在正月前，汉击临江时间的不统一，表明了罪名的不成立。没有任何资料表明，临江在楚汉战争中的立场。尽管临江与汉、九江、衡山一样均为旧楚将而封王，但其没有在战争中帮楚是有一定根据的。据《黥布列传》：“项王方北忧齐、赵，西患汉，所与者独九江王，又多布材，欲亲用之，以故未击。”则与项羽交好的楚军旧将惟黥布一人，其余三人，汉王刘邦已叛，临江王共敖与衡山王吴芮不执行项羽杀义帝的密令，估计也与项羽关系疏远。而吴芮因与黥布的姻亲关系，在黥布归汉后，可能也有助汉的倾向。据《汉书·高帝纪》，汉五年正月，'
  - '[PAGE 49]


    劝刘邦即皇帝位的诸侯中有衡山王吴芮，而刘邦的答谢诏称：“故衡山王吴芮，与子二人，兄子一人，从百粤之兵，以佐诸侯诛暴秦，有大功。诸侯立以为王。项羽侵夺之地，谓之番君。”则吴芮与项羽有积怨，并肯定至少在楚汉战争后期，加入到汉阵营。而临江国可能在整个楚汉战争中都处于两不相帮的境地，《高祖本纪》称其叛汉，只是欲加之罪的说法，不足为信。何况此前临江没有助汉之举，就谈不上什么叛与不叛的问题。事实可能是，先发起对临江的攻击，然后再安上罪名，因此，战争的性质是统一而非平叛。'
  - '[PAGE 50]


    根据共尉一事的隐秘因素，或者燕王臧荼的反叛也存在问题。《高祖本纪》称：汉五年“十月（实际上应该是七月），燕王臧荼反，攻下代地。高祖自将击之，得燕王臧荼。即立太尉卢绾为燕王。使丞相樊哙将兵攻代”。从这个记载来看，臧荼是反了。但臧荼反的理由并不充分。首先，臧荼之燕在楚汉战争中是帮助汉阵营的，此年正月的劝进诸侯中也有臧荼的名字。在前一年楚汉相持荥阳时，燕出兵助汉击灭楚大司马曹咎。在刘项胜负未定时助汉，到天下归汉时叛汉，情理上不通。应该考虑汉欲加之罪的情况。代地的情况当时是怎么样的呢。自汉三年韩信等汉将击灭代相国夏说后，'
  - '[PAGE 51]


    代地就落入了汉的掌握，主事者是张苍，其职位是代相，即在没有代王的情况下，代汉行使权力，署理代地事务。而汉定天下时，张苍又从赵相的位子上，回到代相之位，而汉击燕时，张苍以“代相从击臧荼有功”，看不出燕有攻下代地的痕迹。而从张苍事迹来看，这一段的历史有点乱。《张丞相列传》记张苍相代王在臧荼反前，而当时代地无王，至汉七年才由刘邦兄刘仲为代王。另有陈豨在战争中曾以游击将军别定代，汉击燕时，或者陈豨仍在代地，由张苍扶佐也未可知。《樊郦滕灌列传》记樊哙击燕，未及攻代一事，与张苍事迹合。《高祖本纪》记樊哙攻代可能是误记，因为汉七年，'
  - '[PAGE 52]


    刘邦从白城败退下来，就让樊哙定代地，或许有将二事搞混了的可能。所以，在臧荼问题上不能排除捏造罪名的可能。为什么要为臧荼捏造罪名，这就要从楚汉战争结束时诸王的情况来分析了。项羽分封立十八王，三秦王、三齐王、代王赵歇都死于战事，辽东王韩广为臧荼所杀，韩王成为项羽所杀，河南王申阳降汉失地，项羽自立之韩王郑昌也被汉俘虏，魏王被汉诛死，殷王死得不明不白。剩下的汉王称帝，九江王黥布被项羽杀了全家，死心塌地归汉；常山王张耳被陈余击败失国归汉，得汉助而为赵王；衡山王吴芮受汉封四郡之地，虽然实领一郡，应该比项羽时多。剩下的临江国共敖传


    51'
  - '[PAGE 53]


    子共尉，已安了个罪名剿灭。而臧荼之燕，实则是合并了项羽分封时燕与辽东之地，相当于战国燕的全境，疆域相当大。而此燕在战争中没受什么损失，也没得汉什么好处，要笼络住也颇为不易。这样一个与汉关系不甚密切的大国，总是让人不放心。所以，就不能排除汉为取得长治久安而给燕安个罪名的可能性。


    从韩信、黥布事件来看，汉为求得安定是愿意付出一定代价的。比如告发韩信造反的栾说，与告发黥布造反的贾赫，就分别被封为慎阳侯与期思侯，并各受封二千户。而很多在战争中出生入死、立下赫赫战功的人，受封户数远不'
  - '[PAGE 54]


    及这二人。韩信之叛，始终存在着不足以取信于人的问题，汉室也因此没有把韩信的功劳化解于无形，反而把一些不是他的功劳说成是他的，比如定魏、定代、定齐就有吕泽、陈豨等人的功劳，基本上都划归了韩信。从这个意义上来看，刘邦为了消除不安定因素，是会采用捏造罪名的办法。临江与燕的情况应该归于这一类。


    总而言之，刘邦的杀降更像是一种出于为了江山社稷安定的深谋远虑，而项羽的杀降则很具有滥杀无辜的施暴狂意味。于是，刘邦的杀降'
  - '[PAGE 55]


    常常消除了后患，而项羽的杀降，则激起了更大的反抗。'
  - '[PAGE 56]


    # 帝王术控制小人如碾死蚂蚁


    说起特务政治，大家都会想到明朝的东厂西厂。其实啊，早在三国时期，曹操就已经建立起一套非常成熟的特务政治体系了。咱们都知道，那时候的特务都是些什么人啊，不是人渣，就是流氓。雄才大略的曹操，为什么要喜欢用这些人呢？军事史专家赵楚楚，就在一篇文章中为我们解释了原因。


    大家都知道，三国时代是个乱世，在那个时代，社会秩序和道德秩序都是一团糟，有武器就是草头王。当时在曹操的阵营里，人才来自各个方面，既有投降过去的，也有各种背景的社会'
  - '[PAGE 57]


    势力的代表。


    怎么样才能充分发挥阵营里各路人马的能量，同时又能对他们进行有力的约束呢？曹操用的方法很简单，就是建立起一套独特的监察制度，以特务政治的方式达到全面控制局面的目的。


    曹操的监察制度主要分军、民两个方面：


    在军事方面，除了在出征时精心选择将领，曹操还用了其他的手段确保万无一失：一是对将领和官兵的家属名为照顾，实际上是作为人质'
  - '[PAGE 58]


    的扣押；再就是同时派出自己身边近臣侍从随军进行监督。


    在民政方面，除了之前就存在的体制传统之外，曹操还建立了一套秘密监察体系，把人事权和考察权集中在自己手里。根据《三国志》的记载，这种监察体制延续到曹丕称帝的时候还一直存在，俨然成为皇帝进行统治的日常手段。就在曹丕登上皇位短短的几年内，通过这种秘密监察系统查办的案件就多达上万件。


    那么这种秘密监察系统是怎么运转的呢？根据《三国志》的记载，可以确定的有这么几个'
  - '[PAGE 59]


    方面：


    第一，他们只有秘密监视和接受检举的权力，可不具体执行法律程序。也就是说，他们对罪犯进行审判和定罪执行。


    第二，他们只向皇帝做秘密报告，然后由皇帝转给相关官员进行系统审判和执行惩罚。说白了，这就是一帮只对皇帝负责的秘密警察，跟正常的官僚体系没有交叉关系。


