    # 人得类型


    我觉得人大概分为几类，你身边的所有人都能从这里找到，现在介绍他们的特点与怎样驾驭。


    高傲型：


    高傲大家都明白，这种人往往都有一定的能力，他们高傲自然是有一定高傲的资本，对付这种人有两种方法，一是分化型，所谓分化就是分化他的能力，例如他的业务很好，但是人很高傲，那怎么办，就是分化他高傲的资本，怎么分化呢？可以再培养一个人或是自己提高业'
