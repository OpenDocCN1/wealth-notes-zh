    甚至都有自己的征税和征兵权，在这种情况下中央肯定是无法集权专制的，此时的地方权力处于顶峰，而后 的朝代，地方上的权力不断的被中央政府削弱。


    分封制之后就是郡县制。郡县制虽创立于秦朝，但却是在汉代开始得到确立和巩固的。郡县制实行之后，取消了封国这种国中之国，全国划分郡县两级行政单位，全部受中央政府的管理。地方上也没有了征税权和征兵权。但是汉代的地方行政长官的权力还是很大的，地位也很高。汉代郡的行政长官叫太守，其地位与中央政府的九卿平等，都是二千石俸禄的官，'
  - '[PAGE 241]


