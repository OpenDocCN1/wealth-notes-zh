  md: '

    甚至都有自己的征税和征兵权，在这种情况下中央肯定是无法集权专制的，此时的地方权力处于顶峰，而后 的朝代，地方上的权力不断的被中央政府削弱。


    分封制之后就是郡县制。郡县制虽创立于秦朝，但却是在汉代开始得到确立和巩固的。郡县制实行之后，取消了封国这种国中之国，全国划分郡县两级行政单位，全部受中央政府的管理。地方上也没有了征税权和征兵权。但是汉代的地方行政长官的权力还是很大的，地位也很高。汉代郡的行政长官叫太守，其地位与中央政府的九卿平等，都是二千石俸禄的官，因此郡太守可以调到中央任九卿，再进一级就可以位列三公了，而九卿也可调到地方上做太守，而且地方的郡太守和县令长可以自行任用自己的部署，不受中央的支配。因此，当时的地方政府与中央政府还算比较平等。汉代的地方政府组织也被公认为是中国地方政府制度，因为它既能保持一个统一的国家，又能保持地方的自主性，集中而不失灵活。


    而后到了唐代，地方的行政划分虽然也是两级，分为县和州，但县却分上中下三等，州也分上中下三等，州县的等级是按照所管辖的户口多少来划分的，管辖的户口越多，等级就越高，地方官员的等级与中央政府官员的等级开始拉开了距离，地方官员要经过县的下中上、州的下中上六级的升迁才有可能到中央任官，而且到唐代也已经把地方行政长官的部署任用权都集中到中央的吏部，全国的官员都要由中央吏部来任免。此外，唐代在地方上还设有监察使和节度使。监察使原本只是中央派到地方监察政绩和民情的，这在汉代叫刺史，只是一个很小的官。而到了唐代，监察使却逐渐演变成了地方行政单位的最高一级，把原来的州县压在了下面，一下子使地方行政单位由二级变为三级。节度使则是派到边疆的监察使，它可以全权处理边疆的事物，最后节度使形成了“藩镇”，应发“安史之乱”。


    到了元明清朝代，地方上就有了省一级的行政单位。省最初出现于唐代，唐代废宰相，设三省来执行宰相的职能，分别是中书省、门下省、尚书省，这三省都是中央政府部门。到元朝，由于蒙古人对汉人的极端歧视和不信任，不敢给地方政府分权，要把地方的权力全部集中到中央，于是就由中央的中书省分出一个机关驻扎在地方，总领地方政务，这就像西方列强派总督到殖民地管理殖民地的一切事物一样，这一分出去的中书省就叫行中书省。因此元代的地方政权不再地方，而被集中到中央，由中央派出的行中书省掌握。到了明朝，它也怕地方造反，就延续了元朝的行省制度，只是因为明朝把宰相废了，中央三省也没有了，所以在地方上就不叫行中书省，而叫承宣布政使司，行省长官也就改为承宣布政使，但实际上它的本质还是和行省一样的，就是把地方政权集中到中央。到了清朝，就继承了明朝的承宣布政使，但满人对汉人更不放心，于是又在地方上常设了巡抚和总督。


    这样从分封到郡县，到监察使（节度使）州县，到行省制度的设立，再到巡抚和总督的设立，地方的行政层级越来越多，权力越来越小，最后都被集中到了中央政府。


    ## 皇帝集中央之权


    皇帝集中央之权，主要体现在皇帝与宰相之间的权力变化，就是宰相的权力逐步削减，直至消亡，而削减的宰相权力则都集中到皇帝手上了。


    在战国时期，开始出现丞相相职，当时的丞相权力相当大，可以开府治国，总领政务，除了军事上的事，其他的丞相几乎可以说了算，君主最终就是表个态，同意还是不同意。因此，战国时代涌现出了一大批强力变法大臣，他们可以按照自己的思想去变革所在国的政治、经济、军事、文化制度。因此当时丞相与君主的关系，颇有点像现在君主立宪制国家里首相和元首的关系。正是因为当时的丞相比较独立，权力很大，所以当时的吕不韦才能为封为“仲父”，这要放以后的朝代，那是绝对的大逆不道，除非你表明了要造反，否则谁也不敢称皇帝的“父”。


    在汉代，宰相的权力依然很大。当时皇帝和宰相各有一个“秘书处”，有各自的财政来源和财政大臣。皇帝的“秘书处”是六尚（尚是掌管的意思）：尚衣、尚食、尚冠、尚席、尚浴和尚书，前五尚是管皇帝的饮食起居的，尚书就相当于皇帝的文员。而宰相的“秘书处”就很大了，有十三曹，负责政府的一切事务。政府的财政来源是田税，皇帝的资金来源是山矿盐商，当时田税是大宗，山矿盐商的收入只占一小部分。掌管政府财政的是大司农，而掌管皇帝财政的是少府，皇帝不能动用大司农的钱。大司农和少府都是九卿之一，也都归宰相管。也就是说政府和皇帝的财政都要归宰相管。而实际上，皇帝的所有事物都由宰相管，因为当时皇室的所有事物都归御史中丞管，而御史中丞也是归宰相管的。


    而到了唐代，就没有宰相了，宰相一分为三，变成了“委员会制”，宰相的职务分给了三省，即中书省、门下省、尚书省。中书省负责拟定政府的一切命令，包括皇帝的最高命令——“敕”；门下省负责复核审查命令；尚书省则负责执行。凡属皇帝的命令都需要在政事堂会议中正式通过，在敕字下加盖“中书门下之印”，然后再送尚书省执行，若未加盖“中书门下之印”，而由皇帝直接发出的命令，在当时是被认为违法的。当然唐代也有皇帝不经中书省而直接下命令的，但这种被当时人看作很不寻常的事，于是就被记录了下来。当时的唐中宗就干过这样的事，但做这种事皇帝自己也心怯，所书“赦”字不敢用朱笔，而改用墨笔，装敕令的封袋也要改为斜封，因此被称为“斜封墨敕”，而唐中宗私下封的官也被称为“斜封官”，为一般人看不起。


    在汉朝政府和皇室的事都归宰相管，皇帝不能随便干涉；而唐代皇帝发出的命令必须要经过政府批准，因此当时的皇帝是很难说是专制的。


    但到了后来皇权在逐渐加强，相权逐渐的削弱，最终在明朝废除了宰相，政府的事皇帝一人办了，而到了清朝，在政治上就没有像样的制度，所有的事情是皇帝想怎么做就怎么做，想做什么就做什么，皇帝通过军机处直接对下面的官员下命令，根本不需要什么制度、中央政府，由此皇帝的集权专制在清朝达到了顶峰。


    学习帝王术精通放权、分权与集权足够


    历朝的开国皇帝都拥有强大的野心与领导力，仔细研究开来，这些宝贵经验，对于在市场经济中创业的人都有很大的借鉴作用。本文仅以北宋为例，看看宋太祖在治国时候所体现出的高超领导力。


    宋朝政治体制的主要特点是专制主义中央集权的加强，体现在职官制度上的五大特点，即中央集权、皇帝集权、百官权力分散、重文轻武和军事上内重外轻。这个可以具体到文武两条线的举措。


    先看武的方面，赵匡胤在周世宗在世的时候，可谓韬光养晦，得到了皇帝的信任与下属的拥戴。在五朝十三帝的动乱年代，自然拥有很大的夺权机会。


    机会总是给有准备的人的，在周世宗尸骨未寒的时候，利用契丹与北汉联军进犯的消息，发动陈桥兵变，就是赵匡胤极大的进取心之表现，兵不血刃地把后周的天下整个端了过来。


    赵匡胤以国之重臣与皇亲的双重身份窃取了后周的天下之后，又极力避免有后人效法自己的做法，被下属“黄袍加身”代替自己当皇帝，所以做了皇帝之后的第一件事，就是通过传说中的“杯酒释兵权”削掉高级将领的兵权，其中包括当初称兄道弟的“义社十兄弟”。


    赵匡胤首先动员拥有兵权的高级将领解甲归田，然后选拔新人接替其空缺出来的职位。他不仅把元老们的功绩归零，或者转化成为可以及时兑付的东西。同时，选择那些资历浅而听话，易于管理的人做左膀右臂，会让人有“受宠若惊”的感觉。这一点就使赵匡胤清除了对自己威胁最大的潜在竞争对手。


    北宋在军事上设置枢密院（相当于当代的国防部），将掌兵权与调兵权分开，枢密院大体是文官政治，虽然负责调兵，却不懂军事，也不负责管兵。枢密院负责军令、调动和高级军官的任免；“三衙”统率禁军；兵部负责后勤事务和管理地方的厢军；吏部负责武官铨选。


    宋太祖赵匡胤“惩藩镇之弊，分遣禁旅戍守边城，立更戍法，使（士兵）往来道路，以习勤苦，均劳逸。故将不得专其兵，兵不至于骄堕”。这种办法可收到“兵不知将，将不知兵”的效果，免去将官专权的威胁，当然，负面结果是对作战十分不利，这也是导致宋朝对外用兵的时候显得“肌无力”的重要原因。


    宋朝在兵源上实行募兵制，其中一种，就是每逢有饥荒，从饥民中招募士兵，补本城。宋朝政府对从饥民中招募士兵的办法是“天下旷悍失职之徒，皆为良民之卫”，也就是说把社会上的可能反抗者变为镇压者，一举两得。这种“以暴制暴”的举措在很大程度上缓解了北宋在社会治安管理中的矛盾。


    宋朝还有个从后周时代遗留下来的传统，就是从地方厢军中选拔出强壮者充实到中央禁军。战略要地与边疆的派兵，注重中央与地方的对抗性。这种被称作“强干弱枝”的做法也是宋朝军事制度的一个特点，直接导致的结果就是在对外抵抗入侵的时候，没有任何战斗力。


    北宋在军事结构设置上，把两司变成三衙，让更多的人做领导，却又让谁都做不了最大的领导，这是分权，放权的同时分权，就是在集权。把调兵与战争的决策权，甚至具体战役所使用的具体部署，都要由远在千里之外的皇帝来指挥，因此就会时常出现贻误战机的情况。


    文官调兵与强干弱枝，兵不识将将不识兵之类的特色，本身就是削弱诸如弟兄兵那样的情感基础与默契程度，也起到了弱化团队战斗力与向心力的效果。


    北宋的军事管理机制把士兵当作棋子，而不会被感情所左右，这本身保证了朝廷的安全，同时也极大地弱化了军事管理中的人性化成分。同时也让带兵打仗成为单纯的技术工种，而负责训练与带兵打仗的都是武将，武将以无条件“服从命令”为天职，成为单纯的战争机器。


    在文的方面，开科考试方面，赵匡胤“发明”殿试，把所有来参加考试的举人都变成“天子门生”，从根本上杜绝朝堂上的政治利益集团对皇权的威胁，而且为随后的宋太宗通过科举录用的文人形成井喷之势奠定了坚实的基础。


    在基本治国方略方面，赵匡胤立下了“不杀士大夫”的祖训。在重文轻武的宋朝，诞生了很多名垂青史的文人骚客、词曲画家。让宋朝拥有理学与儒家学派深厚的社会土壤，并使得在中国数千年的封建历史中，宋朝的读书人拥有比较高的社会地位。


    再看赵匡胤留下的政治遗产在现代管理方面的价值与启发。


    在平台机制的设定上，做领导需要多创造针对下属破格提拔的机会，领导者需要尊重每个人向上爬的内心需求，注重协调前朝旧臣、自己的功臣以及潜在贤人之间的关系。


    赵匡胤把权利细分，并建立调配与制衡机制，在动态之中保持平衡，这个是符合时代发展的总趋势的。所谓制衡机制，并不单纯是御人之术，更多的是领导提供形象展示平台，所谓御人之术更多的是从被管理者的角度提出来的。


    在现代机构的管理上，要想保持稳定，首要的是数量上的匹配，总部的市场人员必须相对强势于分支市场的规模，这是固本之法。其次是要经常换防。就是经常在区域市场之间进行管理
    人员挑换，虽然动态的换防会形成官僚作风，但官僚制度恰恰是长治久安的基础。


    我们不主张在管理的时候勾心斗角，而更多的需要上下齐心，但实际情况往往是人都有进取心。既然陈桥兵变是赵匡胤进取心的表现，那么因何就要阻碍别人同样的进取心呢？毕竟总不能说进取心是不对的，所以对领导而言，下属的进取心是需要被限制的。


    对领导而言，面对权利分配，首先是看对人，对自己的忠诚是最基本的，其次是有制度约束，让他们从理性上难以做出不好的表现，再次是要讲究策略，基于心理层面的研究与利用。在御人之术方面需要有制度性的保障。


    作为领导，要清醒地认识到：只要是授权，中层就必然会争权夺利、弄权、滥用职权，因为他们分享的是高层的权，分食的是基层的利。所以既然授权很有可能被分权，领导被架空，最终要承担全部责任，这对老板而言是很不公平的事情，所以最终还是要集权。


    领导需要时刻保持清醒的是：部署很厉害，一经授权，迟早会弄权。所谓弄权的核心就是趋利避害的人性本能所支配的行为，即使下属可以很好地控制私欲的膨胀，也会很难完全驾驭他们自己的下属的思想与行为。当中层领导都是一些权臣，自然会对高层老板构成威胁，授权与分权的同时注重集权，收放自如的领导才是安全的。


    授权的基础是信任。人与人之间，特别是在职场与商场之中，不会有与生俱来的信任，怀疑心重等于警觉性高，警惕性高一部分是由于大环境本就如此，另一部分是自己曾经受到过伤害。


    关键是要有安全感，彼此之间增加信任的核心。


    老板必须学会自我保护，用制度的方式，用尊重并满足其心理需求的方式来进进行企业管理，领导对下属的知情权是管理的基础，对中层领导而言，即使得到信任与授权，先斩后奏也必须要及时奏，这是对中层最基本的要求。


    作为领导与老板，需要大小事情都知道，但什么都不管。这就需要在授权之后不定期检查，因为授权不等于放弃知情权，一旦你的知情权被剥夺，就意味着你被架空了。


    老板一旦被架空，你这个老板就会从有权无责变得有责无权，让自己变得很无辜，虽然把权利授予了值得信任的人，但依然难以抵挡人之本能的侵蚀，自己却非常不放心。


    任何一个级别的人，不管是不是领导，都需要拥有清醒的意识与成熟的判断，耳听为虚，眼见也未必是实的。毕竟眼睛与耳朵是有高度选择性的，甚至记忆都是有选择性的，所以要想在根本上立于不败之地，就需要审时度势，依托心理研究而制订应对之策。


    对领导而言，授权要得到授权的好处，是高难度的；授权给员工，最终的结局大体都是不欢而散，不是被得势的下属干掉，就是要把他干掉。


    对中层而言，只有让自己尊重高层的权利，有所忌惮；具有战略高度地为基层争取利益，这才是值得托付的中层。离领导越近，就越会危险。在《易经》中讲“三多凶四多惧”。因为距离领导近了，不仅会跟基层隔离，连领导都要对自己严加防范。作为现代企业的领导与老板，还是多学习一些历史吧。


    ## 帝王术反间计分化瓦解排除异己


    《资治通鉴》提到的“反间”事件，没有具体统计，少不了二十件左右。我捡几件重要的有影响的学习，以加强对反间计的了解。


    什么是反间计？“疑中之疑。比之自内，不自失也。”¹意思是在疑中再布疑阵，使敌内部自生矛盾，我方可万无一失。说得更通俗一些，就是巧妙地利用敌人的间谍为我所用。


    一般说到反间计都会用田单赶走乐毅的事件，《资治通鉴》提到的第一个例子也是它。


    公元前 284 年，乐毅率联军攻占齐国的首都临淄，尔后率燕军几乎占领了齐国全境。只有莒、即墨没有拿下。原因是在攻打安平县时，临淄的管市场的官员田单在安平，他的车因在车轴头上包了铁皮，出城逃亡时车没有坏而顺利逃出。安平人认为田单聪明，守即墨时就推荐他为首领。乐毅用了一年的时间包围即墨也没有攻下。后来，燕军后退九里，使用怀柔政策以瓦解敌人，三年后还是没有攻下。这时就有人打小报告，说乐毅会打仗，“六月之间，下齐七十馀城，皆为郡县。”
    2 可即墨打了三、四年还打不下，其中原因就是不愿打下而想当齐王。笔者也认为，一个小小的即墨打不下，恐怕不是燕军不行，而是另有原因。


    听到这番话后，燕昭王召开酒会，斥责了告状的人，并且大力表彰了乐毅的功劳，说他帮我们报了先王被齐国害死的国仇，齐国也是他打下的，他当齐王也是应该的。并立即封他为齐王，他妻子封为王后，立即送她到乐毅那儿，儿子封为王子。还立即将告状者处斩。乐毅听到这个消息后“惶恐不受，拜书，以死自誓。由是齐人服其义，诸侯畏其信，莫敢复有谋者。”$
    ^{3} $乐毅不接受封赏，誓死效忠燕王，他的信义连齐国人、诸侯都佩服和惧怕，也就没有人再敢谋害他了。


    公元前 279 年，上述事情发生不久，燕昭王去世，燕惠王继位。回望从当太子时，就与乐毅有矛盾，田单听说了。便派人去燕国用反间计，散布说：“齐王已死，城之不拔者二耳。乐毅与燕新王有隙，畏诛而不敢归，以伐齐为名，实欲连兵南面王齐。齐人未附，故且缓攻即墨以待其事。齐人所惧，唯恐他将之来，即墨残矣。”$^{4}$田单反间计使用得很高明，抓住了新老班子交替之际的时机，利用新王与乐毅的矛盾，渲染即墨等两城未攻下的莫须有原因，迎合燕新王仇恨乐毅又怕他自立齐王的心理。最终按照田单的安排更换将领，“乐毅知王不善代之，遂奔赵。燕将土由是愤惋不和。”
    5 这就为田单继续使用反间计，用火牛阵打破燕军的封锁，很快收复齐国领土创造了条件。


    从以上反间计可以看出：只要内部团结，反间计就无法成功，燕昭王相信乐毅，外人再怎么挑拨都没用；相反，燕惠王一上台，人家就利用他与乐毅的矛盾使用反间计，很快解救了齐国。


    如果说田单的反间计是针对某一个人，那么，下面的例子则是针对整个军队的某个战役。


    田单反间计解救齐国后的九年，也就是公元前270年。秦国进攻赵国，围困阏与城。赵王召见廉颇、乐乘问道，可以援救吗？两人都说，道路遥远，更兼险峻，难救。再问赵奢，赵奢回答说，道路遥远险峻，就好比两只老鼠在洞穴中咬斗，勇敢者取胜。赵王于是令赵奢率领军队前去援救。赵奢刚离开邯郸三十里就停止不前，下令军中道，如有人谈及军事的，一律处死！


    秦军驻扎在武安西，列阵大喊大擂，武安城内的屋瓦都为之震动。“赵军中候有一人言急救武安，赵奢立斩之。” 6 这是赵奢实施反间计第一大措施：严格保密，不让下属谈及军事，不惜杀人以立威。


    第二个措施就是麻痹敌人，赵奢军坚守二十八天不动，反倒增修营垒，看似做长期准备，使敌人看到赵军惧怕，不敢正面与秦军交锋。第三就是让秦军相信赵军不敢救阏与城的情况是真实的。恰好秦国一个间谍潜入赵军，赵奢佯装不知，用好吃好喝招待他。间谍回去报告秦军大将，秦军大将大喜说阏与城不是赵国的了，就确定赵奢不敢救援，防备措施就松懈了。至此，赵奢的反间计就已实施成功。


    这一段写得很精彩：“赵奢既已遣间，卷甲而趋，一日一夜而至，去阏与五十里而军，军垒成，秦师闻之，悉甲而往。” 7 赵奢等间谍一走，令部队席卷而走，一天一夜急行军，如天兵天将一样，离阏与城
    50 里驻扎，并且修建好了营垒工事，秦军知道后，全部迎上来准备决战。后来，采用军士许历的计策，一举打败秦军，很快解了阏与城之围，赵奢被封为马服君，许历被任命为国尉。


    世界上的事情有时可谓一报还一报，赵奢大败秦军 10 年后，也就是公元前 260 年，秦国应侯范雎使用反间计，将赵奢的儿子赵括打败，这就是著名的长平之战，赵军被杀近
    40 万人，赵国成年人几乎消灭殆尽。


    赵兵屡次被秦军打败，廉颇便下令坚守营垒，拒不出战。赵王以为廉颇损兵折将后更加胆怯，不敢迎敌，气愤得多次斥责他。看到这种情况，应侯范雎马上派人用千金去赵国施行反间计，散布说，秦国所怕的，只是马服君赵奢的儿子赵括做大将。廉颇好对付，而且他也快投降了。赵王中计，便用赵括代替廉颇为大将。


    赵括如何被打败，大家都知道，在此不必赘述。这次反间计之所以成功，主要是赵国有一个笨蛋国王。他不但看不出范雎的反间计，也不听蔺相如、赵括的母亲的劝阻，也没有听信赵奢生前的预言：“兵，死地也，而括易言之。使赵不将括则已；若必将之，破赵军者必括也。”
    8 也就是说赵括是使赵军败亡的将军。另外一个原因就是自从赵国“胡服骑射”改革之后，也是当时三大强国之一，对秦国强大没有引起足够的认识，有些尾大不掉。


    还有一种情况，实施反间计的人，利用的是帝王最敏感的神经，那就是被打击的对象有篡位的嫌疑。

