  - '[PAGE 98]


    中，提到“仰望先生仁慈忠义，慨然展吕望之大才，施子房之鸿略，天下幸甚！社稷幸甚！"


    不光给诸葛亮戴上姜子牙、张良这样的大帽子，而且直接上升到天下、社稷的高度！在诸葛亮谦虚自己“亮乃一耕夫耳，安敢谈天下事？二公谬举矣。将军奈何舍美玉而求顽石乎？”的时候，刘备又直接给诸葛亮戴上“抱经世奇才”、“以天下苍生为念”等大帽子，直接把诸葛亮这样聪明的人拍的忘记了矜持，主动地提出自己“三分天下”的想法，更有甚者生怕刘备听不懂，连准备好的地图都拿出来，不能不说刘备先生的高明之处了。'
  - '[PAGE 99]


