    # 帝王术施展政治谎言高手


    诸葛亮“天下三分”的论断最初见诸于他和刘备畅谈天下大势的“隆中对”上。路卫兵在反复研读这段对话后，发现这不过是刘备用障眼法上演的政治谎言，是老谋深算的刘备亲手导演的一场政治阴谋。


    陈寿在《三国志》中这样记载的这段著名的对话：刘备问计诸葛亮问计，“君谓计将安出？” 。诸葛亮回答说：“今操已拥百万之众，挟天子而令诸侯，此诚不可与争锋。孙权据有江东，已历三世，国险而民附，贤能为之用，此可以为援而不可图也。荆州北据汉、沔，利尽南海，'
  - '[PAGE 123]


    > 东连吴会，西通巴蜀，此用武之国，而其主不能守，此殆天所以资将军，将军岂有意乎？益州险塞，沃野千里，天府之土，高祖因之以成帝业。刘璋暗弱，张鲁在北，民殷国富而不知存恤，智能之士思得明君。将军既帝室之胄，信义著于四海，总揽英雄，思贤如渴，若跨有荆、益，保其岩阻，西和诸戎，南抚夷越，外结好孙权，内修政理；天下有变，则命一上将将荆州之军以向宛、洛，将军身率益州之众出于秦川，百姓孰敢不箪食壶浆，以迎将军者乎？诚如是，则霸业可成，汉室可兴矣”。


    从诸葛亮 的这段对答中我们不难看出出以下几个问题：'
  - '[PAGE 124]


    一，诸葛亮“三分天下”的言论很合乎刘备的心思。曹操实力雄厚，自不必说，孙权占据江东天险，也是不可动摇了。这不是只有27岁的诸葛亮能看出来的问题，历经“军阀混战”、年纪将近50岁的政治老手刘备焉能不知？刘备当然想成就为第三方势力，诸葛亮这话是说到他心里去了。


    二，刘备是个无家可归的人。刘备前期一直不顺，徐州被吕布攻取之后，就投奔了曹操，然后又与董承合谋想推翻曹操，结果被曹操发觉，只得逃奔袁绍，曹操灭袁绍后，刘备又投靠荆州的刘表，荆州降曹后，刘备又被曹兵追'
  - '[PAGE 125]


    的逃往夏口，到刘表的儿子刘琦处安身，可谓颠沛流离，几乎到了山穷水尽的地步。


    三，诸葛亮的战略很幼稚。请看：“天下有变，则命一上将将荆州之军以向宛、洛，将军身率益州之众出于秦川，百姓孰敢不箪食壶浆，以迎将军者乎”？说的何其轻松，却并没有实质上的战略战术。要搁现在，就是个标准的大忽悠。“百姓孰敢不箪食壶浆，以迎将军者乎”，就更是天真的想象了，刘备是“帝室之胄”老百姓就一定热烈欢迎？就不敢不欢迎？即是这样，又何来“苍天已死，黄天当立”的黄巾军起义呢？理由站不住脚。而且诸葛亮一直想当官。他“躬耕陇亩”，却“每自比于管仲、'
  - '[PAGE 126]


    乐毅”，对刘备很是吹捧：“将军既帝室之胄，信义著于四海，总揽英雄，思贤如渴”，完全不是让刘备在草庐外坐等的姿态了。


    路卫兵之所以认为“隆中对”是刘备用障眼法上演的政治谎言，是刘备导演的一出政治阴谋，有以下五个理由：


    一，刘备所谓的“兴复汉室”本身就是一句门面话。刘备起兵反曹，政治口号是兴复汉室，然而汉室本身就存在着，曹操虽“挟天子以令诸侯”，但也没敢废掉汉皇自己称帝。曹操是“汉贼”，刘备执政就是兴复汉室？就是正义的了？其实这不过是刘备自己的政治野心，自'
  - '[PAGE 127]


