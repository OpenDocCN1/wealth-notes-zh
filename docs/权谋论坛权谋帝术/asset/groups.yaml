    按照惯常的先例，把犯人押赴京城，也是常有的事情，由于犯罪情况的特殊，囚车飞速赶路，也不是什么稀奇的事。


    朱厚熜正是借助了人们的惯常思路，避开对手和路人的视线，打破常规，畅通无阻地奔赴到了目的地。'
