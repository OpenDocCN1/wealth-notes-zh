    棣“允禩素行阴狡，皇考所深知，降旨不可悉数。自朕即位，优封亲王，任以总理事务。乃不能输其诚悃以辅朕躬，怀挟私心，至今未已。凡事欲激朕怒以治其罪，加朕以不令之名。允禩在诸弟中颇有治事材，朕甚爱惜之，非允禟、允祏我等可比，是以屡加教诲，令其改过，不但成朕友于之谊，亦全前三复教诲之理？朕一身上下关宗庙社稷，不得不为？皇考慈爱之衷。朕果欲治其罪，岂有于防范。允禩在皇考时，恣意妄行，匪伊朝夕，朕可不忘祖宗肇造鸿图，以永贻子孙之安乎？”说的就是着几句：“朕躬贤于允禩，允禩为人不足重，无益于社稷国家。”此时说来当然是反话。'
