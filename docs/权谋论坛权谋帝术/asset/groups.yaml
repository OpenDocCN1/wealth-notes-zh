    公元 431 年，“慧龙在郡十年，农战并修，大着声绩，归附者万余家。帝纵反间于魏，云‘慧龙自以功高位下，欲引宋人入寇，因执司马楚之以叛。’”13 说的是魏国大将王慧龙守卫荥阳十年，既劝民农桑，又积极备战，成绩显著，声名远播。前后赶来归附的百姓有一万余家。刘宋文帝乘机施用了反间计，说王慧龙自认为劳苦功高，却长期得不到重用，所以打算勾引宋人前来进犯，然后活捉司马楚之背叛魏国。魏国皇帝拓跋焘听到这些传言，颁赐给王慧龙一封亲笔诏书，说刘义隆害怕将军就象害怕老虎一样，打算从中陷害，我知道他的诡计。至于外面的风言风语，想你不会介意。刘义隆'
