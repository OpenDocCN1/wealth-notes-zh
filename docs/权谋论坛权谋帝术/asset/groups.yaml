    ## 能在斗争中晋升必须具备条件


    首先介绍一下曹操的四个有希望争夺王位的儿子，他们分别是：


    - 二公子曹丕（继承了曹操的政治才能，善于勾心斗角，笼络人心，为达目的不择手段）

    - 三公子曹彰（继承了曹操的样貌体格特征，跟老爸长的一样帅，并且身体健硕，武艺高强）

    - 四公子曹植（继承了曹操的文学才能，具有很高的文学，艺术方面的造诣，与老爸一起入选三国时期的七大才子，建安七子）

    - 小公子曹冲（继承了曹操的谋略与智慧，被称为神童，曾经用妙法称量大象，被传为佳话）


    这四个儿子还真是有意思，各自占了他们老爸身上一部分的优点，但是都有明显的缺点，所以曹操肯定会纠结了，到底要把家业传给哪一个。其实这个也不能怪曹操，如果有一个儿子能够多多少少把他各方面才能都继承一些，哪怕没有他本人那么出色，我相信他也就不会这么纠结了。但是事实就是，他的这四个儿子都只占了其中一方面，特点还特别鲜明，所以也就没有了所谓的众望所归的人选。


    看到这里，各位朋友，如果你是曹操，你会选择哪一个作为继承人？


    曹大枭雄，其实一开始心理面是有答案的，他选的是小公子曹冲，因为小公子曹冲从小就智慧过人，深得曹操的喜爱，曹操讨论一些计谋，也只有跟这个年仅 10 岁的小朋友才能找到共鸣，其他三个儿子基本上都没办法跟老爸在一个层面上讨论。


    但是曹操这么一选择，一有倾向问题就来了，曹冲越是聪明，越是得到曹操的喜爱，就越是高调行事，毕竟他还是个小孩子，情商方面还比较低，基本上就是自己比別人聪明一定要表现出来，这样就引起了其他三个候选人的不满与敌意。


    政治型的曹丕行动了，他暗地里放毒蛇咬死了曹冲，在曹操怀疑是他所为的时候，曹丕又让毒蛇咬伤了自己（有一定的风险），来洗脱嫌疑，并且把这件事嫁祸到了毫发无损的曹彰和曹植身上。最后终于抢到了继承人的位置。


    故事结束了，最后政治型的曹丕通过一个卑鄙，外加一些风险的计策，赢得了这场继承人之争的胜利。


    ## 曹操


    应该说，曹丕的胜利是必然的，因为在曹冲还以为自己能够通过一次次证明自己的能力比他哥哥强来获得继承权的时候，曹丕早已经制订了精密的谋杀他弟弟的计划。


    其实在我们现实中的职场中也经常会碰到这些不同类型的人，并且在这些不同类型的人之间发生的事情也出奇地相似。我们暂且将曹丕这一类型的人定义为政治型，而曹冲则定位为智慧型的人，最终一般总是政治型的人在职场中更胜一筹。在公司里经常会听到有这样的抱怨：“我的能力比他强的多，但是公司竟然让他做了领导的位置”亦或是“我给公司做的方案，比他的方案要出色的多，怎么会采用了他的方案”之类的。其实有这样一些抱怨的人，可以自我反省一下，自己是不是像曹冲这样的，智慧型的人才，但是不太会搞政治。换句话说就是会做事，但是做人方面相对欠缺一些。


    政治型的人才和智慧型的人才一个公司里都是必要的，就是都必须有，但是如果这两种类型的人才之间相争的话，最后基本上都是政治型的人才胜出。因为当智慧型的人才正为自己可以靠智慧取胜而沾沾自喜的时候，政治型的人才早已经在想如何去改变这个游戏规则的问题了。我想这就是曹操选世子的故事给我们带来的一个最大的启示。


    ## 帝王术与控制人才为己所用


    人才是第一资源，现代社会是这样认为的。其实古代，君王们对此更有深刻的体会。在战乱频仍的三国时代，人才的数量和质量甚至决定了国家的存亡。曹、刘、吴之所以能三足鼎立，最重要的一条，就是他们善于发现人才，吸纳人才，使用人才。纵观三国，曹魏最强，正是由于它拥有最大量、最优质的人才。魏国之所以能聚集起如此众多的人才，这与曹操独特的用人观是分不开的。


    曹操在用人手段上有他独到的地方。司马懿从政的经历就很具有代表性。这个未来魏国重要的军事家、战略家、政治家在还未出仕的时候，就非常聪明通达，有雄才大略，为世人所知闻。当时一个名士崔琰曾经用八个字评价司马懿：聪亮明允，刚断英特。这样一个杰出的人物，曹操当然不会放过，决定任他担任文学掾。司马懿那时思想很正统，他感到汉室衰微，不想屈节在曹操手下干活，借口得了风痹之症想推辞掉。曹操听了大怒，放出风声：不当官，就下狱。司马懿十分恐惧，只好接受召辟，就职上任。在汉朝末年，有一些士人确实存有很浓重的正统观念，虽然曹操控制着皇帝，但不少士人忠于皇帝，却耻于为曹操效力。


    因此，曹操对他控制区域的人才，只要是有名望，不管你的政治态度如何，他一定会拔擢使用，甚至为此不惜使用暴力，刘备三顾茅庐的作派，曹操似乎是不屑的，他喜欢用更为直接的手段。如果谁不愿意入仕，那就得倒大霉，那些入仕而又不效忠曹操的，曹操一定会想方设法除掉他。所以，曹操发现了很多人才，使用了很多人才，但与刘备、孙权相比，杀的人才是最多的，比较著名的就有孔融、弥衡、杨修等人。


    曹操用人的气量是非常罕见的。曹操手下一个大臣魏种的经历就很具有传奇色彩。曹操在兖州的时候，势单力薄，因此非常重视人才的选拔与培养。他发现了一个叫魏种的人，认为很有才，就举为孝廉，刻意加以培养。兴平元年，曹操出师攻击陶谦、刘备，留守后方的陈留太守张邈乘虚发生叛乱，并联合吕布，占领了兖州。曹操听说这一消息，立即回军平叛，并对身边的人说：“兖州发生叛乱，只有魏种一定不会背叛我。”在曹操看来，魏种一定会尽职死节的。然而，前方很快就传来了魏种逃离兖州的消息。曹操非常忿怒，说：“只要魏种你不是向南逃到越人荒蛮之地，或者向北逃到胡人塞外荒漠，我就一定要抓到你，决不放过你。”五年后，曹操攻克袁绍部将眭固困守的射犬城，意外地在城内抓到了魏种，军士们把魏种五花大绑带到曹操面前。出乎众人的意料，曹操居然亲自把魏种的绳索解开，还说了一句意味深长的话：“唯其才也！”在我看来，曹操说这句话大概有两层意思，一是对身边的人说的：当初魏种逃离职守，是因为魏种有才，不愿意没价值地死在兖州吧，当年魏种的行为是可以理解的。二是对魏种说的：现在我放了你，不是因为你没罪，而是因为你
    有才，希望能继续为我效力。于是，曹操不但放了魏种，还任命他担任河内太守，全面负责黄河以北的事务。可以想象，魏种肯定感激涕零，终身不贰。象这种曾经背叛曹操，后来又臣服曹操的将领还真的不少，比如张绣曾经发动叛乱，杀死了曹操的长子、侄儿和亲随大将典韦，但后来在贾诩劝说下重降曹操，仍然受到厚待。曹操这种用人的气量，在中国历史上实在是罕见的。


    曹操是一个非常惜才的人。我们看看他对待俘虏沮授的态度。沮授这个人物，在《后汉书》、《三国志》中都没有他的传记，但此人实在是一个了不起的人物。《后汉书・袁绍刘表列传》里，记载了沮授的几件事：第一件事，沮授在兴平二年，向袁绍建议：“挟天子而令诸侯，奋士马以讨不庭”。这个建议可不得了，要知道，曹操手下头号谋士荀彧是在第二年，也就是建安元年才向曹操提出类似的战略建议的。如果袁绍当时采纳了沮授的建议，先把汉献帝控制在手中，那中国后面的历史就没曹操什么事了。第二件事，沮授曾经向袁绍献破曹之策，就是根据袁强曹弱的特点，连年分兵袭扰曹操，打持久战，损耗曹操的实力，使之逐渐衰亡。可惜袁绍是个持速胜论的乐观主义者，拒绝了沮授的建议。第三件事，官渡之战前，袁绍势力上下认为此战必胜，洋溢看乐观情绪。而沮授呢？他在随军出征前，大会宗族，进行诀别，并把所有资产全部分掉，他跟弟弟沮宗说：“主骄将怯，军之破败，在此举矣”。第四件事，在官渡之战打响后，沮授多次建议“坚壁持久”、“分军护粮”等正确的建议，但均未被袁绍采纳。由此看来，沮授不但是个战略家，而且也是战术家，实在是个难以多得的人才，如果遭逢明主，那一定可以经天纬地、安邦定国。这样的人才，曹操是绝对不会放过的。官渡之战后，沮授在乱军中被俘，曹操与沮授有旧，亲自去见了他，两人留下了六句精彩的对话：沮授首先说，我不是投降的，而是被你们抓住的；曹操说，咱们处在不同的地区，一直被隔开不能相见，想不到今天你我才会这样见面；沮授回答，袁绍失策，自取失败，我的才智和能力全都无法施展，该当被擒；曹操说，袁绍无谋，不能采用你的计策，如今，天下战乱未定，我要与你一同创立功业；沮授说，我叔父与弟弟的性命，都控制在袁绍手中，如果蒙您看重，就请快些杀我，这才是我的福气；曹操叹息说，我如果早就得到你，天下大事都不值得担忧了。于是，赦免沮授，并给予他优厚待遇。不久，沮授策划逃回袁绍军中，曹操这才将他杀死。


    至于关羽降曹的故事，大家更耳熟能详了，曹操明知关羽不能久留，但只要关羽能够暂时在麾下效力，就予以封侯拜将的厚待。可以看出，曹操是非常惜才的，只要你人才，并且不自己的事业构成威胁，哪怕象徐庶入曹营一样，一言不发，一策不献，也会白白养着你。当然，一旦构成威胁，就只好痛下决心，尽显枭雄本色了。


    曹操创造了一个新的人才评价标准。古代用人的标准是“德才兼备”，尤以德为重。而曹操却搞了一个“唯才是举”，在他看来，德是用来教化万民的，才是用来安邦定国的。乱世之中，要以才为先。曹操更是下了一道《唯才是举令》来广征天下士人为他效力。他的观点，彻底颠覆了中国人自古以来的识才用人之道。在用许攸这个问题上就很具有典型性。许攸是个贪财好利的小人，袁绍不能满足他，于是来投奔曹操。此时正处官渡之战的最紧要关头，曹操没有粮食了，眼看就要退出战斗，自动败北。许攸劝曹操奇袭袁绍囤粮地乌巢，从而扭转了整个战局，一举赢得官渡之战的胜利。


    曹操微时，汝南许劭对他有一句著名的评语：“君清平之奸贼，乱世之英雄”。在用人这个问题上，曹操既有英雄慧眼识才的一面，也有枭雄手段血腥的一面，曹操的识才眼光，用才气量，选材手段，确实有其独到之处.


    ## 帝王术拉拢人才必要手段


    大家都知道曹操和刘备手下都有很多人才。刘备的，比如：诸葛亮、关羽，张飞等。曹操的，比如：郭嘉、张辽，夏侯惇等。我今天要说的问题，就是他俩在拉拢人才的手段方面有何不同。


    先说曹操，他在这方面的手段有两种。一：礼贤下士，狼自枉屈。就像他对关羽那样，三天一小宴，五天一大宴来款待关羽。在宴会上说关羽的功德。对关羽封官、赏银，赐宅。不过关羽最后还是没有归顺他，这是遇到了关羽这样对刘备“死忠”的人，要是一般人肯定投效曹操。二：威逼利诱，拿别人的家人作威胁。就像他对徐庶，先礼后兵，一边先写信给徐庶劝他归降另一边拿他母亲做要挟。如果徐庶不投降，就杀了他的母亲。虽然徐庶最后投降曹操，但终身未为曹操出过一计。这个手段他运用失败了。


    再说刘备，他也是两种手段。一：礼贤下士。对诸葛亮三顾茅庐，每次去还准备的特好，发现诸葛亮正在睡觉时，不让小童叫醒他，自己带着两兄弟静静地站在门外等候。直到诸葛亮醒来，没有一点烦躁。与他交谈语言十分谦虚，一点没有目中无人的样子。恳求诸葛亮出山时都快哭了。最后答应出山。这是刘备十分惯用的手段，而且相当有效。二：假意舍弃取臣。在长坂坡大战时，赵云救阿斗于千军万马之中，九死一生。刘备怀抱阿斗说道：“为这小子，几乎损我一员大将！”说罢，当着赵云的面将阿斗扔在地上。他算准了赵云会去接他，所以才敢这么做。换回了一句“臣万死难报主公知遇之恩”，这也算值了。这就是将礼贤下士升级，有多了一个儿子没大臣重要。


    那么曹操和刘备同样是礼贤下士，为什么刘备的部下对他更忠诚呢？我认为，一：刘备被人们一直认为和善，而曹操被人们骂为奸雄， 奸贼。名声两人就截然不同，那人们肯定是投效名声好的。二：刘备更注重心理，他喜欢在别
    人心里下功夫，从内心去征服部下。曹操在内心下的功夫不够，他注意物质享受，但不是每个人只要功名利禄的，关羽就是一个例子。


    ## 帝王术如何让智者为你卖命


    刘备在三国演义中最受人瞧不起，无论是曹操评价的“沛郡小辈，妄称’皇叔’，全无信义，所谓外君子而内小人也……”还是“织席贩履小儿”的“大耳贼”，就可以看得到刘备先生在三国诸雄的人望如何了!刘备能从“织席贩履”的一介布衣，最终成为蜀国的皇帝，不能说是一无是处，细读三国，不难看出刘备立足，多靠的就是他的用人之道和领导艺术。


    刘备的请人艺术，最著名的当数“三顾茅庐”这一节了。说实在的，刘备先生确实没有什么识人之才，从对庞统的态度，以及对马超的态度不难看出这一点。但是在“三顾茅庐”请孔明出山的问题上，却显示对人才的另一面。


    其一，从态度上来看，刘备先生能够三顾茅庐，而且一次比一次态度恭谨，甚至恭谨到那种有点做作的地步，尤其对诸葛亮身边的家人、朋友、亲属、仆童等的态度，让人看到甚至有点肉麻的感觉，就连他三弟张飞同志都有点看不下去了，觉得他做的有点过了，而不时地出言不逊，倒是读过《春秋》的关老爷似乎看出点猫腻来，一改那种瞧不起知识分子的态度，反而劝起张飞来。实实在在体现出“请人首在恭，态度必须敬”的请人前提。


    其二，从行动上来看，刘备先生也充分显现出来 “一谦，二拍，三高帽” 的请人技巧。首先说 “谦”， 也就是谦虚。通过司马徽、徐庶的推荐和介绍，刘备已充分了解到诸葛亮的习惯和性格，知道诸葛亮是个自命清高，狂妄自大的年轻知识分子，而这样的知识分子往往好为人师，
    喜欢高人一头，所以在请诸葛亮出山的问题上，先把自己的地位摆正，而不再张嘴比先言 “汉室宗室” 自抬身份，而是持弟子礼来博取诸葛亮的好感。其实刘备心里也给明镜似的，知道诸葛亮不会不知道他的，也是非常了解这种知识分子的心态的。第二说
    “拍”， 就是拍马屁。刘备通过了解诸葛亮常自比管仲、乐毅，当然会通过那方面来有针对性的进行溜须拍马。刘备心里会说，你诸葛先生不是才自比管仲、乐毅这两个治国之能臣吗，我干脆拍马拍到家，直接称呼你具有姜子牙、张子房两位开国能臣，一下子就拍得诸葛亮晕晕乎乎的，于是不光很快在家里等着了，而且认真准备了“隆中对”这样好的面试答卷，与刘备先生一拍即合，迅速成交。第三说“高帽”，自然就是“戴高帽子”了。刘备最会给诸葛亮戴高帽子了，先不说“白帝城托孤”一顶高帽子直接把诸葛亮一家子都用死算完，就说在请诸葛亮出山的这几句话吧，就可见这项帽子的高度。例如在二顾茅庐时给诸葛亮写的那封信中，提到“仰望先生仁慈忠义，慨然展吕望之大才，施子房之鸿略，天下幸甚！社稷幸甚！"不光给诸葛亮戴上姜子牙、张良这样的大帽子，而且直接上升到天下、社稷的高度！在诸葛亮谦虚自己“亮乃一耕夫耳，安敢谈天下事？二公谬举矣。将军奈何舍美玉而求顽石乎？”的时候，刘备又直接给诸葛亮戴上“抱经世奇才”、“以天下苍生为念”等大帽子，直接把诸葛亮这样聪明的人拍的忘记了矜持，主动地提出自己“三分天下”的想法，更有甚者生怕刘备听不懂，连准备好的地图都拿出来，不能不说刘备先生的高明之处了。


    其三，从当事人身上来看，不难看出“稳、准、狠”的特点来。稳，主要是说像刘备这样请人的主，心态要稳，任凭什么考验和意外的发生，丝毫不能干扰他的心态，尤其是要讲明的一点就是脸皮厚是心态好的关键。准，就是说看人、看事要准，最起码要一样看清对方的特点，尤其是弱点，只有抓住对方的弱点，才能有的放矢，事半功倍，直接拿下。狠，不是对人发狠，而是干净利落，不拖泥带水的意思。就像人家刘备一看诸葛亮被忽悠动了，根本不会给诸葛亮再思考得失的机会，根本不留什么反悔的余地，直接把人带走，这才是真正的“短平快”、高效率呢！


    刘备请人的这一套，并不能算高明，因为有些话对司马徽、崔州平等人也讲过，可是最终只有诸葛亮入彀，也就说明了请人艺术的针对性和特异性，只有活学活用，才会成为真正的艺术，而不是简单的“吹捧、拍马”。


    ## 帝王术使用切记因人而异


    刘备在人际关系中不同方式或者叫手段吧，刘备开始起家的本钱，也是刘备唯一的本钱，就是桃园结义，刘备对关张二人，用了一个义字，义，这里不是道义，而是义气！什么是义气，我有事情，你得帮我，你有啥事情，我也帮你，这就算义气了，而关张二人，勇武冠绝天下，对刘备来说，绝对是最好的帮手，所以这个义字，对刘备来说就最适用不过了。而这个时候的张飞，是个不小的老板，既然大家已经结义，要讲义气了，你张飞的家产，就是我们三兄弟大家的家产了，唯一的处理办法，就是张飞把家产卖掉大家一起花！后来的历史上，有忠义堂，聚义厅什么的，就是学习刘备好榜样的结果。而对于关张这样只一根筋的人来讲，义是最好的办法，就像一条绳子，把关张二人牢牢的缠住了。关羽投了曹操后，曹操三日一小宴，五日一大宴的对关羽，送黄金美女赤兔马，最后没有留住关羽，因为曹操对待关羽的，是恩和利，而不是义，曹操用错了方法，所以关羽还是跑了。


    刘备对赵云，就换了方法，不是用义字诀了，而是一个仁字，血战长坂坡，赵云在曹军千军万马中找回阿斗，当赵云把阿斗递给刘备的时候，刘备把阿斗摔在了地上，而且说了句：“为汝这孺子，几损我一员大将！”刘备的这个举动很有看点，意思是赵云比他的儿子还重要。


    而实际上，这个时候的赵云，就是保安队长，他的职责就是保护刘备的家眷，而赵云回来的时候，把夫人丢了，只带回阿斗，是应该被军法的，但刘备没这样做，而是演了摔子慰大将的高明之举，换做一般的人，肯定问赵云：“小赵，我儿子你带回来了，我老婆呢？她在哪里？”当得知夫人已死，肯定会责怪赵云，但刘备没有，这是刘备对手下战将的仁，不要说赵云，刘备的这个举动，换了谁，都会感动。如果换做关羽张飞搞出这样的结局，估计最少也要被刘备一顿臭骂的。因为关羽张飞刘备可以骂，他们三人的关系是义，帮刘备做任何事情，变得理所当然
    了！


    对于诸葛亮这样的人物，刘备用义和仁，用眼泪，都是没用的了，人家明察秋毫，真 情假意的东西，在诸葛亮面前就已经失去了表现和表示的必要，这个时候，刘备需要 的是表露自己的志！也就是自己的大目标大计划，只有刘备告诉诸葛亮自己真实的大
