    ## 解析左右牟利与毁誉


    帝王和他的左右是一个矛盾体，具有相互对立、彼此同一的矛盾属性。当然，帝王是矛盾的主要方面，起着主导作用。不过矛盾双方是可以转化的，于是，帝王与左右之间的矛盾斗争就出现三种情况：左右利用帝王牟利被发现；没被发现牟利成功；帝王利用左右驾驭大臣。


    《资治通鉴》记载：齐威王令人召来即墨的主官，对他说，自从你到即墨走马上任后，每天我都听到指责你的话传来。然而我派人去即墨调查，看到的却是开辟整治好的肥沃田土，丰衣足食的百姓，官府不需要处理各种矛盾和问题，我国的东方安定和谐。于是我知道“是子不事吾左右以求助也”，这是你不用钱物结交我的左右内臣，以此谋求他们在我面前替你说项的缘故。齐威王于是封赐即墨大夫享用一万户的俸禄。


    随后，齐威王又召见东阿的主官，对他说，自从你镇守东阿，我每天都听到称赞你的好话传来。但我派人前去调查，只见田地荒芜，杂草丛生，百姓贫困饥饿，命悬一线。当初赵国攻打鄄地，你见死不救；卫国夺取薛陵，你不知道。于是我知道“子厚币事吾左右以求誉也”。你用重金来买通了我的左右近臣，每天在我面前替你说好话。当天，齐威王下令烹死阿地大夫及替他说好话的左右近臣。“于是群臣耸惧，莫敢饰诈，务尽其情，齐国大治，强于天下。”


    《资治通鉴》齐威王杀一儆百，群臣震慑，毛骨耸然，不敢再弄虚作假，都尽力做实事，齐国因此大治，成为天下最强盛的国家。


    一个地方的主官的政绩和誉毁，往往与他们的顶头上司的左右有极大关系。我们假设一下，如果齐威王不派亲信去调查，或者去调查的人也被收买，再如果东阿大夫不仅收买齐威王左右还努力工作，和即墨与实际情况差不多，那么，得到齐威王信任的肯定是东阿大夫，倒霉的是即墨大夫。东阿大夫有人宣传，好官声远播，又得到领导信任，提拔就是早晚的事了。所以，大臣的誉毁和任用关键在于帝王的圣明。


    据《资治通鉴》记载，汉武帝与儿子们很少在一起，连皇后也难得见上一面。一次，太子进宫谒见皇后，太阳都转过去半天了，才从宫中出来。也许是为了了解太子，汉武帝暗示过宦官们要随时向他汇报太子的情况，黄门苏文向汉武帝打小报告说，太子调戏宫女。汉武帝没有较真，心想儿子大了，性欲肯定大了，于是汉武帝将太子宫中的宫女增加到二百人。后来太子知道了这件事，便对苏文怀恨在心。苏文与小黄门常融、王弼等看到太子母子已失宠，舅舅卫青大将军又已死，所以，这些小人经常暗中寻找太子的过失，然后再去添枝加叶地向汉武帝报告。对此，皇后恨得咬牙切齿，让太子禀明皇上杀死苏文等人。太子说：“第勿为过，何畏文等！上聪明，不信邪佞，不足忧也！”太子认为，只要自己没做错事，皇上是个聪明人，不会忠奸不辨，劝他母亲不要害怕。此时太子是个明白人，不像以后被江充陷害时冲动，盲目抓人杀人。


    后来，有一次汉武帝感到身体有点不舒服，派常融去召太子，常融回来后对汉武帝言道：“太子面带喜色。”汉武帝默然无语。及至太子来到，汉武帝观其神色，见他脸上有泪痕，却强装有说有笑，汉武帝感到很奇怪，再暗中查问，才得知事情真相，于是将常融处死。这时候，汉武帝还是一个明白人，没有被左右的人蒙蔽使太子蒙冤。


    以上是左右利用帝王牟利未得逞的例子。可是，再圣明的帝王，如果他的左右找到了他的软胁，也能直取其死穴，成功地致其敌于死亡。汉武帝还是栽倒在江充的手里。


    江充本不是什么好鸟。他原是赵王的门客，得罪了赵太子丹，后逃走到朝廷诬告，废掉了自己老主人儿子的太子位。由于江充善于揣摩汉武帝的心事，两人见面一谈话，汉武帝就高兴得不得了。“由是有宠，拜为直指绣衣使者，使督察贵戚、近臣逾侈者。充举劾无所避，上以为忠直，所言皆中意。”江充很快得到了汉武帝的宠信，并任命为直指绣衣使者，专门监督皇亲国戚、近臣大官。不管他官阶有多高，资历有多老，有没有真犯错误，江充都敢举报弹劾，从不避讳。所有的举报都符合武帝的心事，汉武帝认为江充对他忠心耿耿。还有一事使江充名震京城：就是他发现太子的家人驾车行走在只有皇帝才能行走的驰道，太子知道后又派人去讲情，请求不要去上报到武帝那儿去，江充不理不睬，立即去报告，武帝大加信任。至此，江充和太子结下梁子，为两人的死亡埋下了伏笔。


    江充是个聪明人，他虽然得到了老皇帝的信任，老皇帝死后太子就要继位，那时，他不就是史得进的弟弟史（死）得成吗？于是，他就像一只捕捉猎物的老鹰，盯着太子，寻找机遇猛击，一招致命。


    江充明白能致太子死地只有汉武帝，也就是只有借汉武帝之手才能达到目的。于是江充反复揣摩汉武帝的心事：到处寻求不死之药，梦想长生不老，永远稳坐皇帝宝座。如果造成太子谋害武帝的假象，又得到武帝相信，太子想活都没机会了。机会终于到来了。
    "是时，上春秋高，疑左右皆为蛊祝诅；有与无，莫敢讼其冤者。充既知上意，因胡巫檀何言： ''宫中有蛊气；不除之，上终不差。'' 上乃使充入宫，至省中，坏御座，掘地求蛊；又使按道侯韩说、御史章赣、黄门苏文等助充。"
    此时，汉武帝年事已高，怀疑周围的人都在用巫蛊诅咒于他；而那些被逮捕治罪的人，知道汉武帝对巫蛊绝杀，无论真实情况如何，谁也不敢鸣冤叫屈。江充窥探出汉武帝怀疑总是有人利用巫蛊咒他的疑惧心理，便指使胡人巫师檀何扬言：宫中有蛊气，不将这蛊气除去，皇上的病就一直不会好。于是汉武帝派江充进入宫中，直至宫禁深处，毁坏皇帝的宝座，挖地找蛊；又派按道侯韩说、御史章赣、黄门苏文等协助江充。


    欲加之罪何患无辞。江充扬言：“于太子宫得木人尤多，又有帛书，所言不道；当奏闻。”大家都知道涉及巫蛊案件就没有活路可找，太子十分害怕，无计可施，江充又苦苦相逼，加之手下没有沉稳之人出主意，而是叫太子杀江充，起兵造反，夺取皇位。结果，“太子自度不得脱，即入室跽户自经。”“皇孙二人并皆遇害”，皇后卫子夫也自杀身亡。


    我曾经讲过，不要得罪小人，因为小人总是惦记着你，不将你置于死地决不罢休。可怜太子刘据不想，也没有得罪江充，只是遇到了小人江充，结果惨遭死亡。所以，我还要加上一句，千万不要得罪，也不要遇到小人，否则，你不知何时遭遇祸害。


    以上所讲的是左右利用帝王，下面就讲帝王利用左右驾驭大臣，使自己的权利最大化。于是历史上就出现了宦官、酷吏、锦衣卫等皇帝的鹰犬，横行霸道、谗害忠良，造成国势沉沦，民不聊生。


    张汤是中国老资格的酷吏，他办案“即上意所欲释，与监、史经平者；以千乘宽为奏谳掾，以古法义决疑狱。所治：即上意所欲罪，与监、史深祸者；上由是悦之。”《汉书》也相同记载：“所治即上意所欲罪，予监吏深刻者；即上意所欲释，予监吏轻平者。”《汉书·张汤传》，张汤总是按照皇帝的意图办事，凡是皇帝所要加罪的，他就把案子交给执法严酷的人去办；皇帝想要宽容的案子，就交给执法轻平的人去办。


    杜周“其治大抵放张汤，而善候司。上所欲挤者，因而陷之；上所欲释，久系待问而微见其冤状。”《汉书•杜周传》杜周继承了张汤的革命传统，特别会按照皇帝的意图办事，皇帝要排挤的，他就设计陷害；皇帝要宽容的，他就久拖不结案慢慢找到宽恕的理由。他的手下问他为什么不按法律办事，他狡辩说过去的法律是以前的皇帝定的，我们要与时俱进按现在皇帝的意见办事。（“当时为是，何古之法乎！”）


    杜周较之张汤有过之而无不及。到他当廷尉时，皇帝交办的案子越来越多。二千石的高官被抓者新旧相连不下百人，郡守府、丞相府、御史府的案件送到廷尉的，一年有一千多件。一个大案逮捕的证人数百人，小案也有几十人，政人远的数千里，近的数十里。会审时，证人要按照起诉书写的说出证词，不这样去做就严刑拷打，直到按他们的要求提供证词为止。于是听到逮捕证人大都逃匿。久未办理的案子经过数十次大赦还会被告发，大多以“不道”为理由加以诬陷。廷尉和各府的监狱关押的由皇帝交办的有六七万，一般官吏关押了十多万。《汉书·杜周传》


    ## 帝王术看透搞阴谋人的伎俩


    俗话说，明枪易躲，暗箭难防。那是因为人们不知暗箭是何人、何时、何方射来，所以，暗箭来时，猝不及防。或饮箭而亡，或九死一生，或死也不知何故，或把暗箭当馅饼。所以，笔者在读到这些史料时往往觉得触目惊心，汗流浃背，同时，也看出了耍弄阴谋的伎俩和门道，仔细想想，从中也许能得到一些裨益。


    ### 一、逼迫人毫无退路，非死即逃。


    成侯邹忌本是齐国的美男子，古籍说他“修八尺有馀，身体昳丽。”是当时的“高富白”帅哥，可是他的心是黑的，荀子说他是“聚敛计数”之人，也就是斤斤计较的气量宵小之徒。原来看到他用自己和徐公比美来说动齐威王接受群众意见，还觉得他是个人物。由于他的讽谏，齐威王下令：“群臣、吏民能面刺寡人之过者，受上赏；上书谏寡人者，受中赏；能谤议于市朝，闻寡人之耳者，受下赏。”然而，在权利面前，就耍起了阴谋诡计，令人不屑。


    《资治通鉴》说：“成侯邹忌恶田忌，使人操十金，卜于市，曰：‘我，田忌之人也。我为将三战三胜，欲行事，可乎？’卜者出，因使人执之。田忌不能自明，率其徒攻临淄，求成侯；不克，出奔楚。”翻译成现在的话说是，邹忌嫉恨田忌的赫赫战功，害怕取而代之当丞相，于是便派人拿着十金，去集市上向算卦人说，我是田忌手下的人，将军率军作战三战三胜，现在是不是举行登位大事的时候。待到算卦人出来，邹忌令人把他抓住，准备以此陷害田忌。这一招好生厉害，搞的是个灭族的篡逆罪，抓住了与他们串通一气的证人，《战国策》说的是抓住的算卦的，“罪证”确凿，田忌无法洗刷清楚，一气之下率亲丁攻打国都临淄，想抓住邹忌，却不能取胜，只好出逃楚国。


    《战国策》记载了邹忌的部下公孙给他出主意害田忌：“公何不为王谋伐魏？胜，则是君之谋也，君可以有功；战不胜，田忌不进，战而不死，曲桡而诛。”他们的阴谋是鼓动齐王令田忌为将攻打魏国，让田忌死在战场，或因战败而被诛杀。结果田忌大胜，才有后面逼田忌造反的毒计。


    与田忌相比，晋国大臣赵盾被晋灵公和屠岸贾逼得走途无路的过程更加曲折惨烈，时间更长。


    话说晋灵公做事不合为君之道，他用沉重的税收得来的人民血汗钱，将墙壁装饰得五彩缤纷；从高台上用弹丸打人而看他们躲避弹丸的形状。有一次，厨子烧煮熊掌不熟，灵公杀死他，放在畚箕里，让女人用头顶着走过朝廷。“赵盾、随会前数谏，不听；已又见死人手，二人前谏。随会先谏，不听。”对晋灵公的这些行径，大臣赵盾、隋会多次劝谏，也没有效果。这次在朝堂上看见死人的手，二人又去劝谏，晋灵公依然故我，照样不听。不仅如此，他还想办法除掉赵盾，他与屠岸贾合伙，一计不成又生一计，三计才将赵盾除掉。


    第一计派人暗杀。 “宣子骤谏，公患之，使钅麑（chu ni）贼之，晨往，寝门辟矣，盛服将朝，尚早，坐而假寐，麏退，叹而言曰，不忘恭敬，民之主也，贼民之主，不忠，弃君之命，不信，有一于此，不如死也，触槐而死。”赵盾也算一个忠臣，给晋灵公提意见，搞得灵公都讨厌他、腻歪他，于是灵公就派手下的大力士鉏麛去刺杀赵盾。明·冯梦龙说得活灵活现：“岸贾侍灵公游戏。正在欢笑之际，岸贾忽然叹曰：‘此乐不可再矣！’灵公问曰：‘大夫何发此叹？’岸贾曰：‘赵相国明早必然又来聒聒，岂容主公复出耶？’灵公忿然作色曰：‘自古臣制于君，不闻君制于臣。此老在，甚不便于寡人，何计可以除之？’岸贾曰：‘臣有客鉏麛者，家贫，臣常周给之，感臣之惠，愿效死力。若使行刺于相国，主公任意行乐，又何患哉？”灵公曰：“此事若成，卿功非小。””当然这些都是小说家言。


    大力士清晨潜入赵盾院子，看见房门开着，赵盾已经穿好了上朝的衣服，因为天还早，坐在那儿打瞌睡。钊麇看到这些，叹气说，不忘记恭敬，真是百姓的主人。刺杀百姓的主人，就是不忠；放弃国君的使命，就是不信。两件事情有了一件，不如死了好。于是，撞在槐树上去死了。这种记载来自左丘明之《左传》，太史公采用这种看法，钱钟书解释说：“盖非记言也，乃代言也，如后世小说，剧本中之对话独白也。左氏设身处地，依傍性格身份，假之喉舌，想当然耳。……史家追叙真人实事，每须遥体人情，悬想事势，设身局中，潜心腔内，忖之度之，以揣以摩，庶几入情合理。盖与小说、院本之臆造人物，虚构境地，不尽同而可相通；记言特其一端。”


    第二计，摆“鸿门宴”刺杀赵盾。当然，那个时候还没有“鸿门宴”这个词汇，意思就是请人吃饭，在饭桌上将敌人杀死。晋灵公知道鉏麑没有杀死赵盾后，非常生气，并寻找机会。秋季九月，根据屠岸贾的建议，晋灵公请赵盾喝酒，埋伏了甲士，准备攻击杀死赵盾。赵盾的车右提弥明察觉了灵公的阴谋，快步登上殿堂，对赵盾说臣下侍奉国君饮酒，超过三杯，就不合礼了。立马拉着赵盾跑下殿堂。晋灵公唆使他的大臧獒扑过去，提弥明上前搏斗，把狗杀了。赵盾说，不用人而利用狗，虽然凶猛，又有什么用。赵盾一边搏斗一边退了出去，提弥明被伏兵杀死。


    也是赵盾命不该死，阎王爷没有在生死簿上划勾，这时有一位他曾经救过一命的人帮助了他。原来，很多年前，赵盾在苜山打猎时救过一人性命，此时，反过来又救了他。事情是这样的：
