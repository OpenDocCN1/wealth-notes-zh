    其实在我们现实中的职场中也经常会碰到这些不同类型的人，并且在这些不同类型的人之间发生的事情也出奇地相似。我们暂且将曹丕这一类型的人定义为政治型，而曹冲则定位为智慧型的人，最终一


    般总是政治型的人在职场中更胜一筹。在公司里经常会听到有这样的抱怨：“我的能力比他强的多，但是公司竟然让他做了领导的位置”亦或是“我给公司做的方案，比他的方案要出色的多，怎么会采'
