    公元前 204 年，汉王刘邦对陈平说，天下纷扰混乱，到什么时候才能安定呀？陈平说，项王身边刚直不阿的臣子，如亚父范增、钟离昧、龙且、周殷之辈，也不过几个人罢了。大王您'
