    # 帝王术的奸诈与虚伪


    历史小说《三国演义》在内容倾向上，历来被人说成是“拥刘反曹”的，作者罗贯中把刘备塑造成了道德信义的化身。理所当然的，刘备也就成了理想明君的典范，既仁厚爱民，礼贤下士；又诚实忠义，贵义尚情。果真如此吗？笔者不敢苟同，其形象塑造实在是有违作者的创作意图，给人以“画虎不成反类犬”之感。


    鲁迅先生在《中国小说史略》中曾这样评论《三国志演义》的人物描写：“至于写人，亦颇有失，以至欲显刘备之长厚而似伪，状诸葛之多智而近妖。”[1]鲁迅先生对刘备形象作如此阐述，真可谓一语中的。这里鲁迅所说的“近'
  - '[PAGE 133]


    伪”主要有两层含义：一是人物形象有违作者的初衷，与作者心目中想塑造的仁厚爱民、礼贤下士、诚实忠义、贵义尚情的理想的明君形象相去甚远；二是说人物的性格特征虚伪，是一个表面道德信义，实则假仁假义、残酷无情、不思进取而又欺世盗名的伪君子。


    刘备的这种艺术形象的成型，不仅有真实的社会历史土壤，而且也是中国历代文化的浓重沉淀的结果，铸造了這个人物形象，树立了仁君的典范。虽然作者为塑造這个人物而涂上了一层光亮的色彩，甚至不惜用了曲笔，以体现作者的主观理想和历代人民群众的愿望，但刘备毕竟只是一个封建军阀，不可能反映那'
  - '[PAGE 134]


    个时代的基本特征。更何况他是一个由封建社会下层逐步挤进上层政治家，还不可避免的带上了小农意识的味道。他同样与董卓、曹操一样有政治野心，只是刘备掩藏得更深罢了！正是这些缺陷，才会把刘备塑造成了一个“近伪”的艺术形象，其虚伪


    特征要体现在以下四个方面。


    # 一、残酷无情


    刘备是一个自私自利的人，全不为大局着想，又残酷无情，无半点怜悯之心。在第十五回中，他借古人之言说出了自己的心声：“兄'
  - '[PAGE 135]


    弟如手足，妻子如衣服。衣服破，尚可缝；手足断，安可续？”对待至亲之人妻子儿女尚且如此，更何况他人呢？与其高祖刘邦可以不分伯仲啊！拉拢关、张，又何尝不是“惜其勇而用之”，为打拼自己的江山做准备。更可以作为印证的是第三十四回刘备一听说蔡瑁要设计害他，“急解‘的卢’马，开后园门牵出，飞身上马，不顾从者，匹马望西门而走”，半点没有想起赵云等三百将士，好一个“不顾从者”！看来他自家性命才是最重要的，其利害的取舍也可以窥见一斑了。


    为关、张复仇之事，好像义之极至，纵然赵云、诸葛亮等人劝阻，也无济于事。但当东'
  - '[PAGE 136]


    吴把所有的仇人都送来的时候，并再次表示要送还夫人，返还荆州，以求和好后，刘备仍然不听，继续坚持“削平江南，杀尽吴狗”，可见刘备名义上是为“义”字复仇，实际上是为消灭东吴而战！其卧榻之旁又岂容他人酣睡！是为了自己的江山设计，是图美名而争天下者也。


    而其最残忍和无情的是，刘备为了自己的霸业，动辄便抛妻弃子，而且饥饿的时候竟然食同宗之人妻子之肉，真令人发指。第十九回有，“玄德见势已急，到家不及，只得弃了妻小，穿城而过，走出西门，匹马逃难”，还没有到生死关头，却把妻小都给抛弃了，深得上'
