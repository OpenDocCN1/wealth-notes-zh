    “虽出自孝景，而世数悠远，昭穆难明”，“自祖父以上世系不可考”。[3]可见，刘备出身于破产的贵族家庭，其上几代早已属社会下层，到他时已沦落为平民。自己声称对帝位是万不可以动其心的，可最终他却还是登上了宝位，仍不忘惺惺作态说：“备无才德，请择有才德者受之。”几番退让，甚至还“勃然变色”，但也未见当时孔明他们“逼”他为帝的态度有多坚决，倒是他自己说出了心里话“吾非推阻，恐天下人议论耳”，只是担心别人的议论，与曹丕登位所费周折的意图是何其的相似啊！这就是刘备经常装腔作势、欺人耳目的奸诈之处。


    在当时群雄竞起的战争环境中，刘备攫取帝王的野心一点也不比别人差。在小时候便云“我为天子，当乘此车盖”，看来他是自小“立志”啊，就凭这点他可以算是从小便处心积虑的想登上大统了。之所以没有实现，只不过是限于当时他势单力薄，一时无力和别人抗衡而达不到目的罢了，就象在刘表面前夸口一样“备若有基本，天下碌碌之辈，诚不足虑也”。第三十一回蔡瑗劝刘表不要引狼入室时说：“刘备先从吕布，后事曹操，近投袁绍，皆不克终，是可见其为人。”一语道破了刘备有狼子野心。否则，他就不会在战乱之时投军，其心思无非是想浑水摸鱼，捞上一把，他还是知道乱世出英雄的道理的。还好当时以他的“才智”还可以对付黄巾之类乌合之众，消灭了一部分黄巾军，多多少少还算是捞到了一点政治资本，立了所谓一点军功，不然他就真的没有机会实现几时的梦想了。


    可实际上，他除了与董承等六人书名带血诏并常在阵前宣读以示正义以外，终其一生，并没有为朝廷设为一谋出过一份力，倒是处心积虑的经营自己的蜀汉天下，时时刻刻想摆脱别人的控制去谋划自己的天下。刚与董承等人书名带血诏，都还没有行动，一见有机会逃走去经营自己的天下，便什么也不顾了。还亏他走之前对董承等人说“某此行必有以报命”，可最后董承等人都死了，也未见他报什么命，倒是把自己的事业打理的有条不紊。


    最可以突出他全然不顾“汉室”而只顾自己恩怨的是伐吴前诸人劝其勿战所说的一番话，连他自己也说“朕不为弟报仇，虽有万里江山，何足为贵？”还亏赵云劝说“汉贼之仇，公也；兄弟之仇，私也，愿以天下为重！”不知道此时他把“匡扶汉室”忘到哪里去了，而把自己的事情看的比什么都贵重，可见他平日里那些豪言壮语只不过是方便行事的幌子罢了。


    而最能揭示刘备早有野心的是：他的两个儿子，一个名封，一个名禅，合即为“封禅”——天子祭天地之礼，这样明确的政治野心及强烈的功利进取心，时时隐含着取而代之的图谋。至于他一再标榜自己是什么“汉室宗亲”，只不过是为了取“正统”之名罢了。


    ## 三、假仁假义


    他的假仁假义更是让人作呕，且不说先摔阿斗以笼络赵云，终至让赵云感其知遇，几救阿斗，诚心辅佐，后又白帝托孤，一把鼻涕一把泪的把诸葛亮感动得终身为其江山操劳而卒。虽他说的好听：“君才十倍曹丕，必能安邦定国，终成大事，若嗣子可辅，则辅之；如其无才，君可自为成都之主。”明是支持诸葛亮自己来主政，实际上是让诸葛亮辅佐刘禅，而让其开口不得也只好甘心辅佐了，单看刘备这临终遗言的意蕴，李赞就一针见血的评道：“只此一语，便得孔明之魄，玄德真奸雄哉！”


    在第十九回中，吕布被擒，求刘备为之讲情，“公为座上客，布为阶下囚，何不发一言而相宽乎？”刘备点头答应，但一转眼又劝曹操杀吕布，一点不念其辕门射戟之情，此等忘恩负义之人又岂能称得上仁义呢？所以作者仍不免跳出来借吕布的口骂道：“是儿最无信者！”同样的，当他被曹操打败，只身投奔冀州，答应表示招关羽来归，可结果是他使奸计欺骗了袁绍，[4]杀了别人的大将，之后又巧言遮掩，挑拨别人君臣关系，都是为了自己的如意算盘。当刘备装作无可奈何之状而取得刘璋之地后，却又乐不可支，“设宴于公厅”，“顾庞统曰：今日之会，可为乐乎？”得意之情，溢于言表。可见之前说不可夺同宗之地，不可行不义之事，皆是伪作，是“外君子则内小人”，既然反复说不能夺同室之地，不能行不义之事，然而一旦夺了人城邑之后，即一副胜利者的姿态，足见其伪诈到何种程度！


    当献帝被废后，曹丕称帝时，他的臣子劝其“即皇帝位”，他又以“恐天下人议论”为由，竟勃然变色说：“孤岂效逆贼所为！卿等欲陷孤为不忠不义之人耶？”说的多么冠冕堂皇，正义凛然，对比其几时的“豪言壮语”和此前他自信“备若有基本，天下碌碌之辈，诚不足虑也”是多么绝妙的讽刺啊！。只是刘备做的很隐秘罢了。他一再请诸葛亮
    “展吕望之才，施子房之宏略”，俨然以周文王、武王、汉高祖自居，可又在前面称帝惺惺作态。犹如在甘露寺前以剑劈石，对人是“破曹兴汉”，而心里想的是“成王霸之业”，其虚伪之貌昭然若揭。


    在第五十一回中，诸葛亮与刘备的一番对话，更是让刘备的假仁假义的面目无所遁形。“玄德问孔明曰：‘却才先生教备如此回答，虽一时说了，展转寻思，于理未然。我今孤穷一身，无置足之地，欲得南郡，权且容身。若先教周瑜取了，城池已属东吴矣，却如何得住？’孔明大笑曰：‘当初亮劝主公取荆州，主公不听，今日却想耶？’”一个“笑”字，把刘备的虚伪之情刻画得淋漓尽致，诸葛亮的潜台词不言而喻。


    刘备对人虽然在表面上看来是讲义的，但一旦危及自己的利益就什么也不顾了，连自己的儿子也是如此。其义子刘封听信谗言不救关羽以至于失去一员大将，贻误军机，确实有罪，但也不致死。再说死与不死自有法律断定，可刘备不但使用了郑庄公不教而诛的手段，而且在刘封拒绝投降，扯书斩使之后，已经完全证明忠于自己了，还是杀了他。直接原因就是刘封不应该强于阿斗，亏他当初收刘封为义子说的那些话，什么只要诚心待人必不相负，而此时对于危及自身利益的人的处理还管什么之前说的什么话，虚伪之貌令人恶心。


    ## 四、贪图享受


    刘备贪图享乐，不思进取，更是让人鄙其为人。在第三十九回中，刘备自己以为有了诸葛亮便可以万事无忧了，纵然已经知道曹操会时刻南下，他却以牦牛尾“结帽”，还辩解道：“吾聊假此以忘忧耳。”而当诸葛亮问及将何以迎曹兵时，他却又说：“吾正愁此事，未得良策。”一说这一说那，前言不搭后语，彼此矛盾，正是说明了他无多大志向，不愧为阿斗之父，还巧言掩饰，亏他之前说“备若有基本，何虑天下碌碌之辈耳”。就算是有基本，如果这个样子也是败家子，又一个刘阿斗。就象后来自衿才智被陆逊火烧得片甲不留，终至身亡白帝城。


    更为经典的是他差点因女而轻天下。在第五十五回中说刘备与孙夫人成亲后“自此连日饮酒”，这时候倒是会借酒忘忧啊！还是张昭了解其为人，“刘备起身微末，奔走天下，未尝享受富贵。今若以华堂大厦，子女金帛，令彼享用，自然疏远孔明、关、张等”，“玄德果然被声色所迷，全不想回荆州”，与其子看来是一样的啊，“此间乐不思蜀”，不愧是啊斗之父。若不是诸葛亮设计在先，让赵云依计行事，刘备又怎么会突然想回荆州呢？看来，孔明也知道其为人，要不怎么会考虑得如此周全呢？只是不便直说罢了。刘备一口一声要成就大事，连这点关口都过不了，还说什么“天下碌碌之辈不足虑也”。真是滑天下之大稽！还是书中评论的好：谁知一女轻天下，欲易刘郎鼎峙心！


    到了最后阶段，作为最终鼎立一方的霸主，刘备的后期已经完全没有了曹操那样始终是曹魏方面的主心骨和最高决策者的支配地位，他没有了用武之地，似乎在成功地完成了“三顾茅庐”的任务之后便可以高枕无忧了，这时刘备实则已经成为真正的刘阿斗之父了，不过徒具一个象征意义上的符号而已。[5]夷陵之战中，连不甚精通兵法的曹不也知道“岂有七百里营帐而可拒敌乎？包原隰险屯兵者，此兵法之大忌也”。刘备却还是那样的自以为是：“朕令吴班引万余弱兵……擒此竖子，江南一鼓而下矣。”


    然而时代不同了，对手也不同了，与当年伏击黄巾军这般乌合之众大不一样了，却仍那样自诩，以抱残守缺为不凡，怎么不会被吴将“营烧七百里”，“蜀营一应粮草器仗，尺寸不寸”，“蜀将川兵，降者无数”，留了个兵败身亡的下场，亏他还自诩“朕用兵老矣”。


    但之前当马良谏阻不了刘备移营之后，建议“将各营移居之地，画成图本，问于丞相”之时，刘备便猛地爆发了久蓄的不满：“朕素知兵法，又何问之？”这倒好，被陆逊火烧七百里，只落得个惨败的下场。回顾刘备的生平经历，若没有诸葛亮便一事无成，此处就是印证。其不思进取也就罢了，却又自高自大，自以为是，焉能不败！


    此上事实一一摆明在我们面前，是作者有意为之还是无心之失，无从得之。既然罗贯中是“拥刘反曹”，也应为贤者讳，隐去才是；也许是为了使人物形象更加丰满，有血有肉；到底是何目的，恐怕是无法说清的，从这一点看来似乎是艺术败笔所致，也可以说是无心之失了。作品客观的描写告诉我们：刘备用虚伪做作掩盖了其真实的意图，貌似忠厚，内藏奸诈。《三国演义》第六十回引正史曰：“操以急，吾以宽；操以暴，吾以仁；操以谲，吾以忠；每与操相反，事乃可成。”刘备的这番自白，无意中撕破了他的假仁假义，他之所以以宽、仁、忠，其实不过是一种反曹操的策略。


    ## 帝王术统一手段


    司马炎统一的影响：司马炎统一中国是中国古代最仁义的统一，能优待孙刘曹皇族，是最和谐的统一。封建专制伦理严重时，皇帝只关心自己统治时间的长短和权势，不像现代人重视社会进步、国家统一、民族生存这些内容。司马炎统一在历史上发挥了有益作用，对后世的影响也是进步的，并不是误解的黑暗腐朽统治。司马炎结束了汉末以来的长期战乱和分裂，用习凿齿评价：除三国之大害，静汉末之交争，分裂割据混战对人民来说就是大害，是阻碍历史进步的，统一的历史功绩不论怎样都是巨大的。只有实现统一才有可能推动社会进一步发展，才能开疆，让人民生活安宁幸福。


    司马炎统一后也实现了开疆，这也是对中国历史的贡献。司马炎统一也促进了中国对外交往，促进了中国科技、文化、教育的发展，晋朝有众多的发明创造和制度建设是在中国首创的，其中包括：三省制、门下省、国子学、书博士、占田制等等。科技发明有瓷器、制图术、指南舟、楼船、凸镜聚光、脉经等等，这些成就都是在司马炎统一前后的成果，有的就是为统一战争服务的创造，只是在实现统一后，才增强了汉民族的团结，也巩固了汉族和其他民族的团结，增加汉族人口，改变了汉末中原人口锐减，汉族人口比例劣势的困局。司马炎统一用了十年时间，在几个大一统开疆的朝代中，也是最快的，秦朝从始皇帝即位到统一用了二十年；汉朝从汉高祖称帝到汉武帝恢复秦朝旧疆也用了九十年；唐朝从唐高祖称帝到唐太宗恢复西域也用了三十年；元朝从成吉思汗称可汗到统一也有七十年，能统一是对中国基本贡献，要是恢复前朝旧疆是对中国的突出贡献，能开疆算是杰出贡献，在这方面，晋朝也不次于其他朝代。司马炎在统一方面能重用众多贤臣，增强国力，能抓住机会用很小的代价和短暂的进攻实现统一，这是值得尊敬的，连唐太宗都称赞司马炎是庙堂神算，这样的统一对人民自然最有利，没有严重的负担。


    司马炎统一后的中国才成为与西方罗马帝国并列的大国，在世界上占有重要地位，才有可能在对外交往中有更加广泛的外事活动和经济贸易，中国在晋朝才能实现天下无穷人的太康盛世。现代中国更应该重视晋朝对社会进步的贡献；实现了国家统一；增强了民族生存能力这些影响。


    ## 帝王术卓越的政治家路线


    李渊(566—635)，字叔德，祖籍陇西成纪(今甘肃秦安西北)，一说狄道(今甘肃临洮)，一说赵郡(治今河北赵县)，唐朝的建立者，史称唐高祖，杰出的政治家、军事家、统帅。


    李渊7岁时袭封唐国公，历任隋千牛备身、谯、陇、歧州刺史，荣阳、棣烦二郡太守、殿内少监，卫尉少卿，弘化留守兼知关右诸军事，有骁卫将军，太原留守等职。大业十三年(617年)，起兵反隋(参见李渊太原起兵)。成功地指挥了攻取霍邑(今山西霍州)之战和长安(今陕西西安)之战(参见霍邑之战、李渊攻取长安之战)。义宁二年(618年)五月称帝，立国号唐，建元武德。先后派兵击灭割据陇西的薛仁杲(参见唐击灭薛举父子之战)、南犯河东的刘武周(参见唐灭刘武周之战)、据洛阳称帝的王世充和前来援救王世充的河北起义军首领窦建德(参见洛阳、虎牢之战)、据江陵(今属湖北)称梁帝的萧铣(参见唐平萧铣之战)、据河北反唐的刘黑闼(参见唐灭刘黑闼之战)和丹阳(今江苏南京)的辅公祏(参见唐灭辅公祏之战)等，从而完成了统一全国的大业(参见唐统一战争)。武德九年(626年)八月传位于太子李世民，为太上皇。卒于贞观九年，庙号高祖。


    李渊是唐朝开国创业的军事统帅，沉谋多算、善于决断、既富远见、又善施行的政治家和军事家。旧史书把大唐创业之功多归于李世民，将李渊描写成一位庸庸碌碌、无所作为的人，是不符合历史事实的。


    从有关史料看，李渊的军事思想主要有以下几点：


    - 一、因势借力、先取关中、后图天下的兴兵起事思想


    李渊早就有起兵伐隋以取天下的思想。


    《大唐创业起居注》说他“素怀济世之略，有经纶天下之心”（《大唐创业起居注》卷上），李清和刘文静也早就察觉他有 “四方之志”（《旧唐书》卷六十七《李密传》、卷五十七《刘文静传》），他自己也认为，他们家是
    “继膺符命” 者。当隋炀帝要将其执送江都时，他曾单独对李世民说： “不早起兵者，顾尔兄弟末集耳。今遭羑里之厄，尔昆季须会盟律之师。”（《大唐创业起居注》卷上）他将自己比作周文王，要李世民等像周武王会盟诸侯伐殷一样推翻隋朝，夺取全国政权。他认为，刘武周等称帝是
    “陈涉狐鸣，为沛公驱除”（《大唐创业起居注》卷上），又将自己比作刘邦。为准备起事，他派李建成、李世民等 “潜结英俊”、“密招豪友”；以防御突厥为名，招募士兵；用急而示之不急的策略廉价购买突厥的马匹。为隐蔽企图，他
    “纵酒纳赂以自晦”（《新唐书》卷一《高祖本纪》）等。这些都说明，他早有起兵之意，并极富政治和军事才能。晋阳起兵的决策也是他最后决定并付诸实施的。在有了较为充分的准备、时机成熟之后，他以“通突厥”
    的罪名将反对起兵的副留守虎贲郎将王威、虎牙郎将高君雅斩首，从而正式起兵反隋。 从酝酿到起兵，体现了李渊周密计划、积极准备、韬光养晦、乘机起事的思想。


    李渊起兵的战略是：因势借力，发展自己，先取关中，号令天下，进而统一全国。所谓“因势”，就是因天下大乱之势；“借力”，是借突厥、李密等外部势力为己所用。当时突厥的力量相当强大，“中国人归之者甚众”；李密领导的瓦岗军是当时实力最强的起义军。另外割据朔方（治今陕西靖边白城子）的梁师都，马邑（今山西朔州）的刘武周，金城（今甘肃兰州）的薛举，武威（今属甘肃）的李轨等，均对李渊构成直接威胁，比较之下，李渊的势力还比较孤弱，他要兴兵起事，必须取得某些外部势力的支援。为了将成为后顾之忧的突厥转化为可以借用的力量，他卑辞厚礼以结交之，甚至许诺：“若能从我，不侵百姓，征战所得子女玉帛可汗有之”；给突厥可汗的信不署“书”，而署“启”，大有“心大能作小”之意。使始毕可汗转而积极主张李渊取隋而代之。他派刘文静去突厥时说：“胡骑入中国，生民之大蠹也。吾所以欲得之者，恐刘武周引之共为边患。又胡马行牧，不费刍粟，聊欲借之以为声势耳。数百人之外，无所用之。”（《资治通鉴》卷一八四《隋纪八》，恭帝义宁元年六月）可知派刘文静去的任务名为借兵，实是联络突厥，防止其与刘武周联合南侵。对李密，他则“卑辞推奖以骄其志，使其不虞于我，得入关，据蒲津而屯浍水，阻崤函而临伊洛，东观群贼如蚌之势，吾然后为秦人之渔夫矣”（《大唐创业起居注》卷中)。于是他写信称李密为“当今司牧”，希望他“早膺图篆，以宁兆庶”，讲到自己，则称“老夫年逾知命，愿不及此”（《大唐创业起居注》卷中），极尽谦恭吹捧之能事，使李密得意忘形，从而心甘情愿地为李渊充当“拒东都之兵，守成皋之厄”的角色，李渊得以乘虚入关，夺取长安。入长安后，他推戴代王杨侑为帝，倡言“废昏立明”，扛着拥隋的旗号，欲行挟天子令诸侯之事，达代隋之目的，将“弑逆”的罪名留给他人，而把自己竭力塑造成“应天顺人”的新主形象。这些，均体现他因势借力、以屈求伸、发展壮大自己、成就大业的思想，较当时群雄过早地争相称帝高出一筹。


    李渊在取得长安后，不但占据了地理上的优势，而且在政治上更是得天独厚，他出身关陇集团贵族，在关中有很大影响，入长安后，可以取得当地人士的广泛支持；同时，占据京城，挟持隋帝，号令天下，有高屋建瓴之势，为统一天下建立了最为理想的根据地，创造了极为有利的条件。


    - 二、军政兼施、各个歼灭群雄、统一全国的战略指导思想


    夺取长安是李渊统一全国战略的第一步；歼灭群雄、消除割据则是其第二步。第二步又分为两个阶段：第一阶段是和好突厥，经略西北，巩固根本；第二阶段是消灭关东、江南等群雄，统一全国。基本方略是各个击灭，先北后南。


    李渊入据长安后，曾“以书谕诸郡县，于是东自商洛，南尽巴蜀，郡县长吏及盗贼渠帅，氐、羌酋长，争遣子弟入见请降”（《资治通鉴》卷一八五《唐纪一》，高祖武德元年正月），用政治招抚手段达到了不战而胜、拓土徕民的目的。在此后征服群雄中，他也多采用军事进攻与政治瓦解相结合的手段，如在派李世民征薛举父子之前，他用认亲和封官的手段相托了李轨，从而对薛举形成战略牵制；后又派人深入李轨内部，得以不战而降其地。在平萧铣后，他命李靖为岭南道抚慰大使，招抚岭南
    96 州等，都体现了军政并用以制胜的策略思想。


    当时关东李密与宇文化及、王世充等杀得难解难分。因此，李渊对他们仍采取坐观虎斗、以敌制敌的策略，专力对付西北群雄。他采取各个歼灭、先急后缓的战略，派李世民先消灭对长安威胁较大的薛仁杲；在刘武周南犯时，又“悉发关中兵”，派李世民击灭之。在解除了这些后顾之忧后，才派李世民东出征打王世充，夺占洛阳。为平定萧铣，他于武德二年(619
    年)就派李靖入蜀协助赵郡王李孝恭做水战准备，因准备充分，用人得当，指挥得法，此役亦迅速告捷。而后又平定了刘黑闼和辅公祏，完成了统一中国的大业。很明显，李渊在战略上运筹周密，决策正确，用得其人，是取得这些作战胜利、从而统一全国的首要条件。


    - 三、正确料敌、集智用长、先胜后战的作战指导思想


    李渊在作战指导上善于正确料敌，在此基础上作出决策。如大业十二年(616 年)，李渊以不足 5000 人迎击占优势的突厥南侵之兵。他分析说：“突厥所长，惟恃骑射，见利即前，知难便走，风驰电卷，不恒其阵，以矢为爪牙，以甲胄为长服，队不列行，营无定所，逐水草为居室，以羊马为军粮，胜止求财，败无惭色，无薙夜巡昼之劳，无构垒馈粮之贵……今若同其所为，习其所好，被知无利，自然不来……若不决战，难以图存。”可见他对突厥情况了解甚深。李渊采取这一对策后，突厥兵果然不敢来战。“如此再三，众心乃安，咸思奋击”，李渊乘机“纵兵击而大破之”（《大唐创业起居注》卷上）。他用“空城计”败突厥兵，亦是建立在正确料敌、集智用长、先胜后战的基础之上。

