    此后就演绎出了“搜孤救孤”荡气回肠的历史悲剧，这个故事大多数中国人知道。故事中的两位主人翁，一个是赵朔的门客，一个是朋友。他们两人都是具有大德的人物，为了朋友，不惜牺牲家人和自己的生命。可惜这种人在战国之后就少见了，现在更是难以见着。'
