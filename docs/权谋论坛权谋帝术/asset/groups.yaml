    # 当领导不懂必备这几帝王术


    唐太宗李世民是一位卓越的政治家、伟大的军事家，同时，也是一位集团管理的顶尖高手，他的一些成功经验值得学习和借鉴。


    怎么树立理念？贞观之治的基本特色：轻徭薄赋、以民为本；广开言路、虚怀纳谏；重用人才、唯才是任；铁面无私、依法办事。


    怎么以人为本？李世民说：“执政23年的经验告诉我，尊重人、依靠人、发展人、为了人。就是以人为本的主旨。”唐朝集团在李世民的精心管理下，不断发展经济，出现了社会安定、政治清明、百姓安康的良好局面。'
  - '[PAGE 178]


    怎么团结一致？一个人一分钟可以挖一个洞，六十个人一秒钟却挖不了一个洞。合作是一个问题，如何合作也是一个问题。合作就是互相配合做某事或共同完成某项任务。简单地说就是团结一致。


    怎么三剂合一？坚强的领导集体必须具有凝聚力，当然，人格魅力也不可少。什么是三剂合一？即领头人要成为领导班子高效运转的“润滑剂”，齐心协力的“粘合剂”，创新发展的“催化剂”。


    李世民十分重视吏治的清明，曾命房玄龄省并冗员，派李靖等13名黜陟大使巡察全国，考察风评；又亲自选派都督、刺史等地方官，'
  - '[PAGE 179]


    并将其功过写在宫内屏风上，作为升降奖惩的依据。另又规定五品以上的京官轮流值宿中书省，以便随时廷见，垂询民间疾苦和施政得失，百官遂自励廉能，直接提高政府效率。成吉思汗说：“欲安邦定国者，必悉唐宗兵法。”


    怎么避免犯错？人无完人，金无赤金。人在冲动的时候，最容易犯错误。权力过大，说了算数，容易形成“家长制”、“一言堂”的短板。所以，必须发扬民主、集思广益。这样，才有利于实现决策的科学化。夫以铜为镜，可以正衣冠，以古为镜，可以见兴替，以人为镜，可以知得失。兼听则明偏听则暗的道理就在于此。'
  - '[PAGE 180]


    怎么提高修养？有一天，唐太宗得到一只雄健俊逸的鹞子，正玩得高兴，魏征来了。李世民怕魏征看到又要提意见，赶紧把鹞子藏到怀里。这一切早被魏征看到，他禀报公事时，故意喋喋不休，拖延时间。结果鹞子被憋死在李世民怀里。由此可见，李世民的气度胸怀。领导能否做到严于律己、宽以待人，这对班子成员能否成为团结战斗的集体至关重要。


    “耕夫碌碌，少有隔夜之粮；织女波波，少有御寒之衣。日食三餐，当识农夫之苦；身穿一缕，每念织女之劳。寸丝千命，匙饭百鞭；无功受禄，寝食不安。交有德之朋，绝无益之友。常怀克己之心，闭却是非之口。若能依朕'
  - '[PAGE 181]


    所言，富贵功名可久。”李世民这则近百字的短文，提醒为官者不忘劳动本色，保持艰苦奋斗作风；同时做到慎言、慎友、克己、清廉。这段话从表面上来看，是李世民教导领导班子如何才能保持功名富贵？但仔细推敲，实质上是告诫为官者修身克己的做人之道。


    怎么居安思危？李世民知道，居安思危是预控性的关键。他把隋朝灭亡的教训当教科书，避免重蹈覆辙。关心百姓的疾苦，组织人员走南闯北进行调研，掌握第一手资料，进行科学决策。他说：“民，水也；君，舟也。水能载舟，亦能覆舟。”下令轻徭薄赋，让老百姓休养生息，其目的就是让大家都
