    刘邦最大的优点，就是知人善任。张良、萧何、韩信，都堪称人中龙凤，每一个人都各有所长，且其特殊才能都远在刘邦之上，刘邦均将他们罗致麾下，而且不嫉贤妒能，不弹压掣肘，能用其所长，把每一个人放在最合适的位置上，为每个人淋漓发挥自己所长创造了条件。张良定国策谋大计，萧何理国事抓经济，韩信统大军略城地，三人均有出色表现。试想，如果让张良理国事抓经济，让萧何统兵冲锋陷阵，让韩信定国策谋大计，那结果就只能令人扼腕叹息了。


    刘邦不仅善用人，而且善驭人。韩信出身贫穷，为人所不齿，后来参加了项梁的起义军，但一直不为项梁、项羽叔侄所重用，韩信因此背楚投奔了汉军。经过汉将夏侯婴的推荐，刘邦任命韩信为治粟都尉。萧何通过几次谈话看中了韩信，认为应当重用。汉元年（公元前
    206 年）六月，韩信认为自己在刘邦麾下还没有得到完全施展才能的机会，觉得屈才，于是又从汉营逃亡。萧何知道了这件事，觉得这是个太疏忽，所以来不及与刘邦商量，就亲自去追赶韩信。这时有人在刘邦面前说丞相萧何逃跑了。刘邦听了又急又气，如同失掉了左右手。等萧何回来时，刘邦又喜又恼，责备他不该逃跑。萧何告诉他是为了追赶韩信，刘邦不太相信，认为追赶这么一员小官吏不值得。萧何对刘邦语重心长地说：“一般的将官容易得到，韩信却是不可多得的国家至宝，挑不出第二个。如果想争夺天下，就必须有韩信这样的人才共谋大计。”刘邦听取了萧何的意见，拜韩信为大将，让他统率三军。而且在任命韩信为大将那一天，举行了隆重的仪式，设置了高坛、广场，让韩信到高台上受命，给了韩信足够的尊崇和面子，树立了韩信在众人面前的威信和号召力。拜礼完毕后，刘邦把韩信召到跟前咨询平定天下方针，韩信的回答，同样语出惊人，这就是几乎与诸葛亮的《隆中对》齐名的《汉中对》（详见《史记•淮阴侯列传》）。只可惜，刘邦身边的能人太多，而后来的韩信也居功骄恣，加之品德名声不好，才不为后人称道，否则的话，他一定会和诸葛亮一样齐名。刘邦听完后大喜过望，发现他的确找到了一个不可多得的将才。


    ## 韩信想要一个“桃子”，刘邦给了他“一篮水果”


    韩信军事才华出类拔萃，很快成为刘（邦）、项（羽）争雄中影响战局胜败的关键性人物。


    汉四年（公元前 203 年），刘、项鏖战正酣。十一月，刘邦被楚军围困在荥阳（今河南荥阳），难以脱身。而韩信大军却凯歌高奏，大破楚军，斩杀楚大将龙且，占领齐地，锐不可挡。此时韩信不仅没有加急进攻楚军，解刘邦之围，而是派人给刘邦送信，请刘邦封自己为齐王。尽管韩信骄恣之态毕显，但信的措辞用语还是比较委婉，信中说：“齐伪诈多变，反复之国也，南边楚，不为假王以镇之，其势不定。愿为假王使。”“假王”就是代理诸侯王的意思。热盼韩信解围的刘邦看到韩信的这封信时，勃然大怒，大骂韩信：“吾困于此，旦暮望若来佐我，乃欲自立为王！”在张良、陈平劝说下，刘邦压住了胸中的怒火，不但满足了韩信想当代理齐王的愿望，而且更为慷慨大度，说：“大丈夫定诸侯，即为真王耳，何以假为！”派遣张良为使者赶赴韩信驻地传达旨意，不用当代理，一步到位，直接封韩信为齐王。


    韩信挟功请封假王，虽然极不合理，刘邦虽然心里极为不爽、愤懑不已，但是，洞悉时局的他却能随机应变，作出最正确的选择，直接封了韩信为真王。韩信本来想要一个“桃子”，刘邦却给了他“一篮水果”，这显示了刘邦高超的驭人之术。可以想象，获封齐王后的韩信，心情之激动、脚步之轻盈，怀着对刘邦的感恩心情，加快了攻楚的步伐，与彭越等人分进合击，很快改变了楚强汉弱的战场局势，导演了兵陈垓下十面埋伏的历史活剧。假若，刘邦当时未满足韩信的请封，势必与韩信生隙，埋下取败祸因；假若刘邦比较小气，虽满足了韩信心愿，仅封了个“假王”（代理），也会让韩信感觉出刘邦的勉强之情和心胸狭窄，也就不会换来韩信满腔的“忠汉”之心。


    韩信后来军功累累，居功自傲，成为刘邦的心腹大患，后被刘邦用计擒拿后囚在洛阳，降为淮阴侯。有一天，刘邦与韩信评论起将领们各自的才能高下。这是一场坦诚相待、十分有趣的谈话。刘邦问韩信：“依将军看，如果我带兵杀敌的话，大概能带多少兵啊？”韩信回答说：“陛下最多能带十万，不能再多了，再多了就要出问题。”“那么你最多能带多少兵呢？”刘邦问。“让我带兵嘛，多多益善。”韩信回答说。其言外之意，是说自己统兵百万，也实属平常，不足为怪。刘邦笑着又问：“好一个多多益善，那怎么会为我所擒呢？”韩信回答说：“陛下不能将兵，而善将将，这就是韩信为什么会被陛下所擒的原因。”韩信的总结是深刻的，见识也是高明的，只不过有点为时已晚。


    ## 通过封赏大臣传递政治信号


    楚汉战争胜利后，封赏大臣是摆在刘邦面前一项复杂而重大的政治任务，处理不好，就会产生矛盾。《汉书·萧何传》记载，汉五年，刘邦“即皇帝位，论功行封”，“群臣争功，岁余不决”。刘邦认为，应当将萧何推为第一。然而其他曾追随刘邦东征西讨的大将们不服，认为自己“被坚执兵，多者百余战，少者数十合，攻城略地”，浴血奋战，而萧何“未有汗马之劳，徒持文墨议论，不战”，怎能反而功劳居首呢？


    这时，刘邦说出了一番惊人的话。他反问诸将：“知道打猎是怎么回事情吗？知道猎人和猎狗的区别吗？”他说：“夫猎，追杀兽者狗也，而发踪指示兽处者人也。今诸君徒能走得兽耳，功狗也。至如萧何发踪指示，功人也。”意思为，猎狗只有追擒野兽的功能，而猎人却能指挥猎狗去追猎物。诸将只不过是擒杀野兽的猎狗，只有萧何，才能称得上是猎人。


    这话说的太伤众将官的心了。众将官内心不服，但谁也不说话，选择了沉默。后来，在论定功臣的位次时，场面又陷入了尴尬。众列侯一致认为，平阳侯曹参“身被七十创，攻城略地”，功最多，理应排第一。刘邦显然是想让萧何位列群臣之首。正在为难之时，洞明上意的关内侯鄂千秋站出来说话了，他说：诸将皆为一时之得失。而楚汉相拒五年，汉王失军亡众，只身逃遁数次，皆靠着萧何从关中遣军补其亡失，数万兵众召之即来。汉与楚在荥阳对峙多年，军无见粮，也是萧何及时转漕关中，以给不足。这样才能使汉军立于不败之地，这是万世不朽之功。这一公平的评论，终于说服了诸将，大家都公推萧何功劳位居第一。


    刘邦公然驳了众将官的面子，力排众议，推封萧何为天下第一功臣，这样做的“成本”似乎太大。而这也恰恰反映出刘邦的过人之处，他是要通过尊崇萧何来向天下释放一个个信号：天下初定，今后国家的头等大事将是恢复生产，发展经济；军事虽亦重要，但与民生问题比较起来，显然要往后放一下。今后，国家急需的是重生产、懂经济的人才，而不是冲锋陷阵、搏杀疆场的将士。可以认为，刘邦封萧何是传递其战略重心由“军事斗争”向“经济建设”转移的显著性标志。


    史书记载，刘邦封赏诸大臣是分阶段进行的。最先封赏的是最亲近、最重要的二十几位大臣。其余的大臣因对军功多寡的认定有异议，“日夜争功而不决，未得行封”。有一次，刘邦在洛阳南宫时，看见众将坐在沙地上不知在说什么，问身边的张良是怎么回事，张良说他们在谋反。刘邦问为什么，张良说怕刘邦以后不会封他们高官，怕刘邦会找机会诛杀他们。刘邦问计于张良。张良问刘邦最恨的人是谁，刘邦说是雍齿，因为他虽然功劳多，但太张狂，“多次折辱我，令我难堪，我曾经想将他杀掉”。张良听后，就建议刘邦封雍齿为侯，这样，大家就觉得自己被刘邦记恨的雍齿都能受封，其他人更不用说了，封官加爵是迟早的事，就不会乱着急了。于是，刘邦大摆庆功宴，封雍齿为什方侯，还催促丞相和御史抓紧时间草拟论功行赏分封的名单。刘邦封雍齿这一举措，看似平淡，却富有深意，他向大臣传递出一个信号，所有对建汉有功者都会按照功劳大小受到封赏，刘邦不会给大家穿小鞋，也不会暗地里使绊子。


    季布和丁公都是项羽手下的大将。在刘邦和项羽争天下时，季布领兵几次将刘邦打败，丁公也领兵追击过刘邦，但最后放过了他。刘邦做了皇帝后，记恨季布打败过自己，曾悬赏千金、缉拿季布，后来终于如愿以偿。但他想到自己也需要季布这样的忠臣来辅佐，就不再记仇，不但放了他，还封他为郎中。丁公听说了，就觉得连季布这样给过刘邦难堪的人都能释放做官，他这个曾偷偷放走刘邦的救命恩人就更不用说了。于是前去拜见刘邦，没想到却被刘邦抓了起来。刘邦对众人说：“丁公做项羽的将领时不忠，就是他这种人使项王丧失了天下。”刘邦下令处死了丁公，还在军中示众，警示大家要做忠臣，不要学丁公。刘邦杀丁公封季布传递出的信号是，朝廷需要的永远是衷心耿耿的臣子，而不是左右逢源的贰臣。


    ## 帝王术“强干弱枝”下的打压手段


    （注：原文此处存在OCR错误或内容缺失，根据上下文及历史常识，此处应为宋朝历史，但OCR文本中出现了“韩令坤”、“石守信”等宋朝人物，且前文是刘邦，这里突然跳到宋朝。为了忠实于原文，我将保留原文的混乱逻辑，但修正明显的文字错误。原文开头“担任过的职务...”似乎是上一页内容的延续或OCR错误，结合下文“杯酒释兵权”，这里显然是宋朝赵匡胤的故事。但原文第一段开头“担任过的职务...”与下文“由石守信接替韩令坤...”连接不畅，可能是OCR漏掉了上文。我将按原意整理，修正人名和引文。）


    ……由石守信接替韩令坤任侍卫马步军都指挥使。起初太祖以石守信等人都是自己的故友，并不介意，赵普就向他数次进言说：“臣也不担心他们会背叛陛下，但是如果他们的部下贪图富贵，万一有作孽之人拥戴他们，他们能够自主吗”？这些话实际上是提醒宋太祖，要他记住陈桥兵变的事件，避免类似的事件重演。果然宋太祖采取措施要解除禁军高级将领的兵权。


    建隆二年七月初九日晚朝时，宋太祖把石守信、高怀德等禁军高级将领留下来喝酒，当酒兴正浓的时候，宋太祖突然屏退从只叹了一口气，给他们讲了一番自己的苦衷，说：“我若不是靠你们出力，是到不了这个地位的，为此我从内心念及你们的功德。但做皇帝也太艰难了，还不如做节度使快乐，我整个夜晚都不敢安枕而卧啊！”石守信等人惊骇地忙问其故，宋太祖继续说“这不难知道，我这个皇帝位谁不想要呢”？石守信等人听了知道这话中有话，连忙叩头说：“陛下何出此言，现在天命已定，谁还敢有异心呢”？宋太祖说：“不然，你们虽然无异心，然而你们部下想要富贵，一旦把黄袍加在你的身上，你即使不想当皇帝，到时也身不由己了。”一席话，软中带硬，使这些将领知道已经受到猜疑，弄不好还会引来杀身之祸，一时都惊恐地哭了起来，恳请宋太祖给他们指明一条“可生之途”。宋太祖缓缓说道：“人生在世，像白驹过隙那样短促，所以要得到富贵的人，不过是想多聚金钱，多多娱乐，使子孙后代免于贫乏而已。你们不如释去兵权，到地方去，多置良田美宅，为子孙立永远不可动的产业。同时多买些歌儿舞女，日夜饮酒相欢，以终天年，朕同你们再结为婚姻，君臣之间，两无猜疑，上下相安，这样不是很好吗”！石守信等人见宋太祖已把话讲得很明白，再无回旋余地，当时宋太祖已牢牢控制着中央禁军，几个将领别无他法，只得俯首听命，表示感谢太祖恩德。第二天，石守信、高怀德、王审琦、张令铎、赵彦徽等上表声称自己有病，纷纷要求解除兵权，宋太祖欣然同意，让他们罢去禁军职务，到地方任节度使，并废除了殿前都点检和侍卫亲军马步军都指挥司。禁军分别由殿前都指挥司、侍卫马军都指挥司和侍卫步军都指挥司，即所谓三衙统领。在解除石守信等宿将的兵权后，太祖另选一些资历浅，个人威望不高，容易控制的人担任禁军将领。禁军领兵权析而为三，以名位较低的将领掌握三衙，这就意味着皇权对军队控制的加强，以后宋太祖还兑现了与禁军高级将领联姻的诺言，把守寡的妹妹嫁给高怀德，后来又把女儿嫁给石守信和王审琦的儿子。张令铎的女儿则嫁给太祖三弟赵光美。这就是历史上著名的“杯酒释兵权”。


    杯酒释兵权只是宋太祖为加强皇权，巩固统治所采取的一系列政治军事改革措施的开始。其后在军事制度方面的改革主要有三项。


    第一，建立不同于前朝的枢密院制度，长官为枢密使和枢密副使，主管调动全国军队，分掌军政大权。枢密院与三衙统领各有所司。三衙虽然掌握禁军，但却无调兵和发兵的权力。枢密院有发兵、调兵之权，而不能直接掌握军队。调兵权与领兵权分离，各自独立，相互制约，有利于皇权的控制。


    第二，内外相维政策。宋太祖把全部军队分为两半，一半屯驻在京城，一半戍守各地，使京城驻军足以制止外地可能发生的变乱，也使外地驻军合起来足以制止京城驻军可能发生了内变。内外军队互相制约，都不能发生变乱，而京城驻军又多于外地任何一个地方，这样皇帝也就可以保证牢牢控制全国的军队了。


    第三，兵将分离政策。无论驻屯京城的禁军，还是驻在外地的禁军都必须定期调动。京城驻军要轮流到外地或边境成守，有的则要到产粮的地方就粮，这种轮流驻防的办法称为“更戍法”。这种方法名义上是锻炼士兵吃苦耐劳，实际上是借着士兵的经常换防，造成兵不识将，将不识兵，兵无常帅，帅无常师。将官再也不能同士兵结合，在士兵中建立自己的声望，也就再也不能率兵同朝廷皇帝对抗了。


    对地方藩镇采取的措施主要有三项：


    第一，剥夺其权。为削弱节度使的行政权力，把节度使驻地以外兼领的州郡——支郡直属京师。同时由中央派遣文官出任知州、知县等地方官。3年一更换，直接对中央负责，向朝廷奏事，不再听令于节度使。对于一些五代以来一直盘踞一方的节度使，宋太祖又故伎重演，拿出“杯酒释兵权”的办法将其逐一罢免。后来又设置通判以分知州之权，利用通判与知州之间的相互制约，使一州之权不致为知州把持，防止偏离中央政府的统治轨道。


    第二，制其钱谷。宋初于各路设置转运使，将一路所属州县财赋，除留少量应付日常经费外，其余的钱帛都要送到京城上交中央政府，不得占留，这样地方的财权就完全收归中央了。


    第三，收其精兵。乾德三年（965年）八月，宋太祖下令各州长官把藩镇所辖军队中骁勇的人，都选送到京城补入禁军。又选强壮的士卒定为“兵样”送到各路。招募符合“兵样”标准的人加以训练，然后送到京城当禁军。这样中央禁军集中了全国精兵，而地方军队只剩下一些老弱病残，编成厢军，只供杂役，地方再也没有军事力量可以同中央抗衡了。


    通过这些措施，唐末五代的那种专制一方的藩镇，在宋初就逐渐消失了。


    在官僚制度方面，侧重削弱宰相权力。军政大权归枢密院掌握，而财政大权则由三司使掌握，宰相所掌仅限于民政了。在军、财、民三权分立中，枢密使与宰相“对掌大政”号为二府。皇帝利用这两者间的异同发号施令，独断专行。宋初不仅以三权分立的办法削弱相权，而且设置参知政事、枢密副使和三司副使，作为宰相、枢密使和三司使的副手，与各部门长官发生制约的作用，以削弱各部门长官的权力。此外，宋初还在设官分职、科举制度等方面，也进行了有利于加强皇权的政策。


    赵匡胤的“强干弱枝”、“重文轻武”政策，虽然成功地削弱了地方权力，大大加强了宋专制主义中央集权制，造成了统一的政治局面，为经济、文化的高度发展，创造了良好条件，使宋朝国祚延长。但是由于“以防弊之政，作立国之法”，一些强化专制主义中央集权制的政策和措施，转化成为它的对立面。“冗官”、“冗兵”和“冗费”与日俱增，造成了两宋的积贫积弱，使财政拮据、外患深重。终两宋之世，这种局面一直没有大改变。


    # 帝王权力控制与发展


    中国古代政治自秦汉以至清朝，其发展演变的一大趋势就是，皇帝越来越集权专制，一方面是中央收地方之权，把权力都集中到中央政府，另一方面是皇帝收中央政府之权，把权力都集中到皇帝手上，最终就是全国的军政权力都集中到皇帝一人手上。


    ## 中央集地方之权


    在地方政府上，首先是战国及其之前的分封制，把地方土地包括治理权力，分给诸侯功臣。这种分封的封国具有很大的独立性和自治性。

    '
