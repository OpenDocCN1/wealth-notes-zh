    祖刘邦之遗风，这品质也够可以的了。


    更严重的是： “(刘备)到一家投宿，其家


    一少年出拜，问其姓名，乃猎户刘安也。当下


    刘安闻豫州牧至，欲寻野味供食，一时不能得，


