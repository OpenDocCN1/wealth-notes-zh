    最后，“朕即让以此位，不少迟疑”。这当然是不可能的，天子重器岂是说让就让的。这时情势不同于“禅让”，又不是“兄终弟及”，没有先例，也不可能有先例，即便是雍正“让了”，想想“烛影斧声”，他也不可能这么做。为什么雍正说了这么句不可能兑现的话，有三层意思。第一，朕与允禩势不两立，要么朕让位，要么朕杀了允禩，我们当中只有一个能当皇帝。第二，朕让以此“位”，不一定让以此“权”，毕竟此时掌握军权，治权的大部分人忠于雍正。让以此位，允禩敢接受那么他希图大位，意图谋反就证据确凿，我现在杀他名正'
  - '[PAGE 392]


    言顺。第三，这句话不会说第二遍，更不可能说第二遍，就是说你们表态的机会只此一次，下次再有人翻出这句话那就是让朕“不少迟疑”的砍你的脑袋。


    这篇上谕说到这，雍正就完完全全的掌握了他对八爷党斗争的主动权，因为所有的道理都在他的手上，允禩完完全全的成了“俎上冻鱼”，因为不会有任何大臣王公再继续在道理上支持他了。资料上没写有没有人当真这么奏报没有，可以肯定没有人敢这么做。


    雍正完全达到了他这篇上谕的目的，没有人敢'
  - '[PAGE 393]


    说，那么允𧉾就是奸诈之徒，雍正怎么处置都行。随后的两年里雍正斥责允𧉾越发严厉，手段越发的残酷，直到允𧉾“病死”于禁所。可以想见雍正正在发出这篇上谕时，不会是完全的赌气无奈，更多的是成竹在胸，步步为营，真是可怕的帝王心术。'
  - '[PAGE 394]


    # 帝王术路上只有利益无亲情


    雍正帝是在亲如兄弟的各皇子的猜忌中登上皇位的。由于康熙帝两次废立皇太子胤礽，原是四皇子的胤禛，也就是后来的雍正帝与康熙的感情并不十分深厚，因此，雍正帝的继位最引人注目，引发种种猜忌和不满。因此，胤禛登上皇位之后就大刀阔斧对康熙末年存在的一些弊端进行改革，同时，为了巩固自己的统治地位，也对亲兄弟进行残酷的迫害，对那些政敌也给予了严厉的打击。'
  - '[PAGE 395]


    首先，雍正在与朋党的同时，将矛头指向了诸位兄弟，势力庞大的八阿哥允祺集团首当其冲。雍正对付允祺采取了欲擒故纵的手法。他先是任命允祺为总理事务四大臣之首，并将他封为廉亲王，隐住允祺，接着便进行指责和打击。雍正帝在谕旨中揭露八阿哥允祺、九阿哥允禟结党营私的往事，指使大臣发动了强大的舆论攻势。接着，雍正帝下令夺去允祺的黄带子，除去宗籍，逐出宗室。允祺的亲信大臣也都各自遭到了流放或是杀头的处罚。同年二月，雍正帝下令将允祺从亲王降为民王，交给他所在旗稽查。随后又将其囚禁在宗人府，不久便圈禁在高墙，只留两名太监随侍在身边。'
  - '[PAGE 396]


    三月，在雍正帝的授意下，允祺请求改名为“阿 其那”，最终在幽禁中被害死了。


    对于一直站在允祺身边的九阿哥允禟，雍正帝 也没有放过。雍正帝下令将允禟发配西宁，并 命令年羹尧监视，不准回京。雍正四年二月， 雍正帝下令夺去允禟的黄带子。四月，雍正帝
    命人将允禟从青海押解至京城，罗列了他的二 十八条罪状，并令其改名为“塞思黑”。六月， 允禟被押往直隶监禁。夏季十分酷热，平日里 养尊处优的允禟无法适应这种生活，很快疾病
    缠身，最终不省人事，病死在监禁中。'
  - '[PAGE 397]


    雍正帝的同母胞弟十四阿哥允禵也是雍正帝的劲敌，也是康熙最疼爱的皇子之一，允禵年幼时就被任命为抚远大将军，在平定西部葛尔丹作乱中立过赫赫战功。康熙帝死后，允禵奔丧回京，发现雍正即位，因与八阿哥感情甚好，内心感到不平，由此而受到雍正帝的迫害。雍正帝以他“狂妄无知，心高气傲”这样莫须有的罪名，除去他的爵位，同时将其派往遵化，为康熙帝守灵，变相地将其软禁。


    至于其他阿哥，雍正帝也给予了不同程度的处罚：二阿哥允朿因事被革爵位；三阿哥允祉被革去爵位软禁起来。目睹了这些兄弟的下场七'
  - '[PAGE 398]


    阿哥允佑被吓得胆颤心惊，只求活命。十七阿哥允礼则依附雍正帝，被封为果亲王。


    所谓兄弟本该亲如一家人，曹植在诗歌中这样写着：本是同根生，相煎何太急？真的伤害自己的亲兄弟，造成骨肉相残，是很残酷的。那么，雍正帝为何一登上皇位就大刀阔斧地残害自己的亲兄弟呢？究其根源，最根本的原因是他的继位不得人心，众兄弟和臣子都心怀猜忌，心存不满。这问题与我上文所写的雍正帝用了权谋登上皇位有关。'
  - '[PAGE 399]


    事实上，自从康熙帝两次对皇太子胤礽进行废立之后，诸位皇子就为皇位之争进行骨肉相残，十分残酷。而原是四皇子胤禛的雍正帝为人很有心机，狡猾且奸诈，是个善于使用权谋的伪君子。


    每个人都渴求权力和财富，胤禛也不例外，对于太子之位，他也窥视良久，志在必得。只是他的高明之处就在于不像其他皇子那样表现得过于明显，而是摆出一副毫不在乎的样子，蒙骗了康熙帝。


    当康熙宣布废立皇太子胤礽，并将其遣送回'
  - '[PAGE 400]


    京，由胤禛负责看管。在众位皇子纷纷指责胤礽时，胤禛却站出来为他说话，让康熙帝看到了他的兄弟“真情”，使得康熙帝对胤禛的好感又增加了一份，直夸他的深明大义，重视手足之情。后来康熙帝因为立皇太子的事身患重病，忧戚之情溢于言表，这些行为都让康熙帝感到很欣慰。对于康熙帝吩咐他做的事情，如处理敲诈官员的太监，查勘京通各仓放米弊端，胤禛都处理得十分得当，显示出卓越的政治才能，给康熙留下了良好的印象。


    只是，因为康熙帝对胤禛的感情不及胤礽，关系也不是很亲厚。所以，对于一个心机高深莫'
  - '[PAGE 401]


    测的四皇子，随时随地都会运用权谋夺取皇位，因此，有人认为，在那样激烈的皇位争夺中，谁权谋高，谁能逢场作戏，谁会博取上下各种地位人物的好感，谁当皇帝就在情理之中。确实如此，四皇子夺取皇位的权谋如同《红楼梦》中的王熙凤般，手段毒辣且高明。


    有人认为胤禛的皇位是通过偷改遗诏的方法得来的，也就是康熙帝本想把皇位传给十四皇子，胤禛在隆科多的帮助下，改动了遗诏，把“十”字改为“于”字，于是遗诏就变成“皇位传于四子”。这说法不科学，也只是猜测而已，因为大清的诏书多使用满文，况且在遗诏'
  - '[PAGE 402]


    上会写下皇子的名字，这种说法是不可信的。


    只是，雍正帝在诸多皇帝众兄弟的猜忌中登上皇位，在登基后曾亲自撰写上谕驳斥，不但收效甚微，反而给人以欲盖弥彰的感觉，导致众兄弟猜忌更重。确实如此，或许康熙帝根本来不及写下传位的遗诏，因为在康熙帝病重时，也就只有隆科多一人负责保卫安全，而隆科多与四皇子胤禛的关系非同一般，利用权谋夺位是大有可能的。


    也只因为原是四皇子胤禛的雍正帝登上皇位引发诸多猜忌，众皇子也就是胤禛的亲兄弟心'
  - '[PAGE 403]


    中十分不满，雍正帝亲身经历了康熙年间皇子们为了太子之位明争暗斗，深知其害。也知道众兄弟对自己的继位心怀猜测，自己利用权谋登上皇位心中有鬼，因此，雍正帝一登上皇位之后就大刀阔斧地对所有亲兄弟进行残酷的迫害。确实是为了巩固他自己的统治地位，毫不顾及兄弟亲情，真的是一个善于运用权谋善于使用铁腕手段的残酷的大清皇帝！'
  - '[PAGE 404]


    # 结语：


    学成帝王术，卖身帝王家


    春秋战国是我国最灿烂的时代，那个时代人才辈出，文学灿若星河，照亮了以后中国的道路，那是一个另人无限遐想的时代。


    千百年来，另人神往


    威烈王二十三年（戊寅，公元前四零三年） 虢柕初命晋大夫魏斯、赵籍、韩虔为诸侯。'
  - '[PAGE 405]


    通鉴从这一年写起，在太史公眼里，一切的重大变故从这年开始，开始的标志是就是三家分智，晋分三卿，曾享受春秋五霸的晋重耳的那个辉煌的国家，被三分了，于是天下大乱。


    初，智宣子将以瑶为后。智果曰：“不如宵也。瑶之贤于人者五，其不逮者一也。美鬓长大则贤，射御足力则贤，伎艺毕给则贤，巧文辩慧则贤，强毅果敢则贤，如是而甚不仁。夫以其五贤陵人，而以不仁行之，其谁能待之？若果立瑶也，智宗必灭。”弗听，智果别族于太史为辅氏。


    智果是个明白人，一眼看出继承人的重大具备'
  - '[PAGE 406]


    条件,当时对于敌我情况不明,用智去,能比别人高多少,贤,又贤于玩物,如来有条件去和别人斗.


    其实智果要说的就是你根本的实力都不具备,最终只能失败.不光是你,是我,还有很多人,盲目得前进,自己拿什么和别人拼都不知道就光个脑袋上去拼,第一个挂的就是你,斗智要斗天道之谋,斗勇要斗地裂之狠.'
  md: '

    # 帝王心术：俎上冻鱼


    贤良是假，狡诈是真；信佛是掩饰，残忍是真；慈悲是虚，杀戮是他作为帝王常干的事。不管是对谋士的“训斥”还是对佛学的“虔诚”，都是胤禛、雍正的一道假面具，是他炉火纯青的骗术。


    当然，客观地说，雍正有他勤勉尽责的一面，有他励精图治的优点，但他的虚伪欺骗，假戏真做，“阳斥阴纳”，是阴谋而非阳谋，是必须谴责的！在他之后，乾隆朝“成就”了和珅那样“阳奉阴违”的大奸臣，不能不说与雍正帝的不良传统有关，毕竟，欺瞒是会有报应的，人在做，天在看，对于两面派，人们终究是会看破的，虚伪的表演，没有好的未来。雍正及后来的和珅，后世被谴责批判，这一事实其实在告诉后来的政治家，玩阴谋代价太大，弄不好会“机关算尽太聪明，反误了卿卿性命”！


    雍正二年四月七日的上谕可以说是雍正正式向“八爷党”首领允禩“开刀”的一篇“檄文”。


    在这篇上谕中雍正历数允禩自康熙四十七年允礽被废以来结党乱政，希图夺嫡种种不法行为，有些是上不得“台面”的，现在说出来，真可谓言辞俱厉。在这篇上谕的后半部分，雍正说出了这样一句话：“尔诸大臣内，但有一人或明奏，或密奏，谓允禩贤于朕躬，为人足重，能有益于社稷国家，朕即让以此位，不少迟疑！”这句话表面上来看是句赌气话，就情理而言，这句话应该是在一发雷霆之怒，口不择言时说出来才合理。现在却出现在了明发全国的上谕中，就很寻常，细细品来这句话当真深不可测。


    首先，“尔诸大臣内”而不是“尔诸王公大臣内”，康熙末年所谓“九王夺嫡”，而今要么被圈禁，要么“本分”，要么年纪尚幼，其他王公估计站中间，也有被处理的，雍正元年三月十三日，以吴尔占、色尔图等“无知妄乱，不安本分”，遣往盛京居住，夺其属下佐领，谕称：“从前伊父获罪于皇考，贬其亲王之爵，伊等怨望，肆行诽谤。”“伊等希图王爵，互相倾害，陷伊宗嗣于死地。”（吴尔占，故安亲王岳乐之子，色尔图，岳乐之孙），本年十二月，撤安亲王爵；“八爷党”允褋被发往西宁，允祁我在张家口，十四爷在景陵，此时有能力左右朝局的“王公”们都不在，“八爷党”大臣们群龙无首，允禩孤掌难鸣，雍正有恃无恐。这句话第一个意思，王公们没人能给允禩撑腰，也不会给你们这些“诸大臣”撑腰，你们好自为之。


    “诸大臣内”分为三派，支持雍正的不论，中间派墙头草也不论，余下支持八爷十四爷的举几例，雍正元年二月初十日，将苏努之子勒什亨革职，发往西宁，跟随胤褋效力；其弟乌尔陈因同情其兄，一并发往；雍正元年四月初二日，命皇十四弟、贝子胤䜣留遵化守陵，又命胤䜣家人雅图、护卫孙泰、苏伯、常明等永远枷示，伊等之子年十六以上者皆枷；在四月七日这篇上谕发出之前，雍正已经处理了几个为首的八爷十四爷的亲信。这句“尔诸大臣内”的第二个意思，是雍正向这些八爷党“摊牌”，“领头”的都“处理”了，“剩下的”你们也请好自为之。


    接着，“但有一人或明奏，或密奏”这句话看似明确，因为只有这两种奏报方式，但实则摸棱两可，含糊其词。密奏不用说，当然是不让人知道，那就是说你奏的不论是什么，都“可以”不让人知道，方法很简单“留中”或者干脆烧了，反正是密奏，让不让人知道是皇帝说了算。至于明奏，康熙废太子后也曾说“一哇公议是从”还不是照样反悔，更何况此时明奏无异于强出头自找倒霉，想要大家一起“出头”想要众口一词，那就是“朋党”真正的犯了圣忌，恐怕当时就会使出雷霆手段，把允褀杀了以绝后患。因此不论是明奏，密奏，一人奏，百人奏，只要奏了就绝没有好果子吃。


    在接下来，“谓允褀贤于朕躬，为人足重，能有益于社稷国家”。这篇上谕从头开始连篇累牍“允禩素行阴狡，皇考所深知，降旨不可悉数。自朕即位，优封亲王，任以总理事务。乃不能输其诚悃以辅朕躬，怀挟私心，至今未已。凡事欲激朕怒以治其罪，加朕以不令之名。允禩在诸弟中颇有治事材，朕甚爱惜之，非允禟、允祏我等可比，是以屡加教诲，令其改过，不但成朕友于之谊，亦全前三复教诲之理？朕一身上下关宗庙社稷，不得不为？皇考慈爱之衷。朕果欲治其罪，岂有于防范。允禩在皇考时，恣意妄行，匪伊朝夕，朕可不忘祖宗肇造鸿图，以永贻子孙之安乎？”说的就是着几句：“朕躬贤于允禩，允禩为人不足重，无益于社稷国家。”此时说来当然是反话。


    最后，“朕即让以此位，不少迟疑”。这当然是不可能的，天子重器岂是说让就让的。这时情势不同于“禅让”，又不是“兄终弟及”，没有先例，也不可能有先例，即便是雍正“让了”，想想“烛影斧声”，他也不可能这么做。为什么雍正说了这么句不可能兑现的话，有三层意思。第一，朕与允禩势不两立，要么朕让位，要么朕杀了允禩，我们当中只有一个能当皇帝。第二，朕让以此“位”，不一定让以此“权”，毕竟此时掌握军权，治权的大部分人忠于雍正。让以此位，允禩敢接受那么他希图大位，意图谋反就证据确凿，我现在杀他名正言顺。第三，这句话不会说第二遍，更不可能说第二遍，就是说你们表态的机会只此一次，下次再有人翻出这句话那就是让朕“不少迟疑”的砍你的脑袋。


    这篇上谕说到这，雍正就完完全全的掌握了他对八爷党斗争的主动权，因为所有的道理都在他的手上，允禩完完全全的成了“俎上冻鱼”，因为不会有任何大臣王公再继续在道理上支持他了。资料上没写有没有人当真这么奏报没有，可以肯定没有人敢这么做。雍正完全达到了他这篇上谕的目的，没有人敢说，那么允𧉾就是奸诈之徒，雍正怎么处置都行。随后的两年里雍正斥责允𧉾越发严厉，手段越发的残酷，直到允𧉾“病死”于禁所。可以想见雍正正在发出这篇上谕时，不会是完全的赌气无奈，更多的是成竹在胸，步步为营，真是可怕的帝王心术。


    # 帝王术路上只有利益无亲情


    雍正帝是在亲如兄弟的各皇子的猜忌中登上皇位的。由于康熙帝两次废立皇太子胤礽，原是四皇子的胤禛，也就是后来的雍正帝与康熙的感情并不十分深厚，因此，雍正帝的继位最引人注目，引发种种猜忌和不满。因此，胤禛登上皇位之后就大刀阔斧对康熙末年存在的一些弊端进行改革，同时，为了巩固自己的统治地位，也对亲兄弟进行残酷的迫害，对那些政敌也给予了严厉的打击。


    首先，雍正在与朋党的同时，将矛头指向了诸位兄弟，势力庞大的八阿哥允祺集团首当其冲。雍正对付允祺采取了欲擒故纵的手法。他先是任命允祺为总理事务四大臣之首，并将他封为廉亲王，隐住允祺，接着便进行指责和打击。雍正帝在谕旨中揭露八阿哥允祺、九阿哥允禟结党营私的往事，指使大臣发动了强大的舆论攻势。接着，雍正帝下令夺去允祺的黄带子，除去宗籍，逐出宗室。允祺的亲信大臣也都各自遭到了流放或是杀头的处罚。同年二月，雍正帝下令将允祺从亲王降为民王，交给他所在旗稽查。随后又将其囚禁在宗人府，不久便圈禁在高墙，只留两名太监随侍在身边。


    三月，在雍正帝的授意下，允祺请求改名为“阿其那”，最终在幽禁中被害死了。


    对于一直站在允祺身边的九阿哥允禟，雍正帝也没有放过。雍正帝下令将允禟发配西宁，并命令年羹尧监视，不准回京。雍正四年二月，雍正帝下令夺去允禟的黄带子。四月，雍正帝命人将允禟从青海押解至京城，罗列了他的二八条罪状，并令其改名为“塞思黑”。六月，允禟被押往直隶监禁。夏季十分酷热，平日里养尊处优的允禟无法适应这种生活，很快疾病缠身，最终不省人事，病死在监禁中。


    雍正帝的同母胞弟十四阿哥允禵也是雍正帝的劲敌，也是康熙最疼爱的皇子之一，允禵年幼时就被任命为抚远大将军，在平定西部葛尔丹作乱中立过赫赫战功。康熙帝死后，允禵奔丧回京，发现雍正即位，因与八阿哥感情甚好，内心感到不平，由此而受到雍正帝的迫害。雍正帝以他“狂妄无知，心高气傲”这样莫须有的罪名，除去他的爵位，同时将其派往遵化，为康熙帝守灵，变相地将其软禁。


    至于其他阿哥，雍正帝也给予了不同程度的处罚：二阿哥允朿因事被革爵位；三阿哥允祉被革去爵位软禁起来。目睹了这些兄弟的下场七阿哥允佑被吓得胆颤心惊，只求活命。十七阿哥允礼则依附雍正帝，被封为果亲王。


    所谓兄弟本该亲如一家人，曹植在诗歌中这样写着：本是同根生，相煎何太急？真的伤害自己的亲兄弟，造成骨肉相残，是很残酷的。那么，雍正帝为何一登上皇位就大刀阔斧地残害自己的亲兄弟呢？究其根源，最根本的原因是他的继位不得人心，众兄弟和臣子都心怀猜忌，心存不满。这问题与我上文所写的雍正帝用了权谋登上皇位有关。


    事实上，自从康熙帝两次对皇太子胤礽进行废立之后，诸位皇子就为皇位之争进行骨肉相残，十分残酷。而原是四皇子胤禛的雍正帝为人很有心机，狡猾且奸诈，是个善于使用权谋的伪君子。


    每个人都渴求权力和财富，胤禛也不例外，对于太子之位，他也窥视良久，志在必得。只是他的高明之处就在于不像其他皇子那样表现得过于明显，而是摆出一副毫不在乎的样子，蒙骗了康熙帝。


    当康熙宣布废立皇太子胤礽，并将其遣送回京，由胤禛负责看管。在众位皇子纷纷指责胤礽时，胤禛却站出来为他说话，让康熙帝看到了他的兄弟“真情”，使得康熙帝对胤禛的好感又增加了一份，直夸他的深明大义，重视手足之情。后来康熙帝因为立皇太子的事身患重病，忧戚之情溢于言表，这些行为都让康熙帝感到很欣慰。对于康熙帝吩咐他做的事情，如处理敲诈官员的太监，查勘京通各仓放米弊端，胤禛都处理得十分得当，显示出卓越的政治才能，给康熙留下了良好的印象。


    只是，因为康熙帝对胤禛的感情不及胤礽，关系也不是很亲厚。所以，对于一个心机高深莫测的四皇子，随时随地都会运用权谋夺取皇位，因此，有人认为，在那样激烈的皇位争夺中，谁权谋高，谁能逢场作戏，谁会博取上下各种地位人物的好感，谁当皇帝就在情理之中。确实如此，四皇子夺取皇位的权谋如同《红楼梦》中的王熙凤般，手段毒辣且高明。


    有人认为胤禛的皇位是通过偷改遗诏的方法得来的，也就是康熙帝本想把皇位传给十四皇子，胤禛在隆科多的帮助下，改动了遗诏，把“十”字改为“于”字，于是遗诏就变成“皇位传于四子”。这说法不科学，也只是猜测而已，因为大清的诏书多使用满文，况且在遗诏上会写下皇子的名字，这种说法是不可信的。


    只是，雍正帝在诸多皇帝众兄弟的猜忌中登上皇位，在登基后曾亲自撰写上谕驳斥，不但收效甚微，反而给人以欲盖弥彰的感觉，导致众兄弟猜忌更重。确实如此，或许康熙帝根本来不及写下传位的遗诏，因为在康熙帝病重时，也就只有隆科多一人负责保卫安全，而隆科多与四皇子胤禛的关系非同一般，利用权谋夺位是大有可能的。


    也只因为原是四皇子胤禛的雍正帝登上皇位引发诸多猜忌，众皇子也就是胤禛的亲兄弟心中十分不满，雍正帝亲身经历了康熙年间皇子们为了太子之位明争暗斗，深知其害。也知道众兄弟对自己的继位心怀猜测，自己利用权谋登上皇位心中有鬼，因此，雍正帝一登上皇位之后就大刀阔斧地对所有亲兄弟进行残酷的迫害。确实是为了巩固他自己的统治地位，毫不顾及兄弟亲情，真的是一个善于运用权谋善于使用铁腕手段的残酷的大清皇帝！


    # 结语：学成帝王术，卖身帝王家


    春秋战国是我国最灿烂的时代，那个时代人才辈出，文学灿若星河，照亮了以后中国的道路，那是一个另人无限遐想的时代。


    千百年来，另人神往


    威烈王二十三年（戊寅，公元前四零三年） 虢柕初命晋大夫魏斯、赵籍、韩虔为诸侯。


    通鉴从这一年写起，在太史公眼里，一切的重大变故从这年开始，开始的标志是就是三家分智，晋分三卿，曾享受春秋五霸的晋重耳的那个辉煌的国家，被三分了，于是天下大乱。


    初，智宣子将以瑶为后。智果曰：“不如宵也。瑶之贤于人者五，其不逮者一也。美鬓长大则贤，射御足力则贤，伎艺毕给则贤，巧文辩慧则贤，强毅果敢则贤，如是而甚不仁。夫以其五贤陵人，而以不仁行之，其谁能待之？若果立瑶也，智宗必灭。”弗听，智果别族于太史为辅氏。


    智果是个明白人，一眼看出继承人的重大具备条件,当时对于敌我情况不明,用智去,能比别人高多少,贤,又贤于玩物,如来有条件去和别人斗.


    其实智果要说的就是你根本的实力都不具备,最终只能失败.不光是你,是我,还有很多人,盲目得前进,自己拿什么和别人拼都不知道就光个脑袋上去拼,第一个挂的就是你,斗智要斗天道之谋,斗勇要斗地裂之狠.

