    陈平于是用许多黄金雇佣间谍到楚军中去进行离间活动，扬言说，各位将领如钟离昧等人为项王领兵打仗，功劳卓著，但是却终究不能分得一块土地而称王，因此他们便想与汉军联合起来，借此灭掉项羽，瓜分楚国的土地，各'
