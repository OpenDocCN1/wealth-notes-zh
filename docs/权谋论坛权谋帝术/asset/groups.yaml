    学习帝王术精通放权、分权与集权足够


    历朝的开国皇帝都拥有强大的野心与领导力，


    仔细研究开来，这些宝贵经验，对于在市场经


    济中创业的人都有很大的借鉴作用。本文仅以


    北宋为例，看看宋太祖在治国时候所体现出的


    高超领导力。


    宋朝政治体制的主要特点是专制主义中央集


    权的加强，体现在职官制度上的五大特点，即


    中央集权、皇帝集权、百官权力分散、重文轻


    武和军事上内重外轻。这个可以具体到文武两


    条线的举措。'
  - '[PAGE 252]


    先看武的方面，赵匡胤在周世宗在世的时候，可谓韬光养晦，得到了皇帝的信任与下属的拥戴。在五朝十三帝的动乱年代，自然拥有很大的夺权机会。


    机会总是给有准备的人的，在周世宗尸骨未寒的时候，利用契丹与北汉联军进犯的消息，发动陈桥兵变，就是赵匡胤极大的进取心之表现，兵不血刃地把后周的天下整个端了过来。


    赵匡胤以国之重臣与皇亲的双重身份窃取了后周的天下之后，又极力避免有后人效法自己的做法，被下属“黄袍加身”代替自己当皇帝，'
  - '[PAGE 253]


    所以做了皇帝之后的第一件事，就是通过传说中的 “杯酒释兵权” 削掉高级将领的兵权，其中包括当初称兄道弟的 “义社十兄弟”。


    赵匡胤首先动员拥有兵权的高级将领解甲归田，然后选拔新人接替其空缺出来的职位。他不仅把元老们的功绩归零，或者转化成为可以及时兑付的东西。同时，选择那些资历浅而听话，易于管理的人做左膀右臂，会让人有
    “受宠若惊” 的感觉。这一点就使赵匡胤清除了对自己威胁最大的潜在竞争对手。


    北宋在军事上设置枢密院（相当于当代的国防'
  - '[PAGE 254]


    部），将掌兵权与调兵权分开，枢密院大体是文官政治，虽然负责调兵，却不懂军事，也不负责管兵。枢密院负责军令、调动和高级军官的任免；“三衙”统率禁军；兵部负责后勤事务和管理地方的厢军；吏部负责武官铨选。


    宋太祖赵匡胤“惩藩镇之弊，分遣禁旅戍守边城，立更戍法，使（士兵）往来道路，以习勤苦，均劳逸。故将不得专其兵，兵不至于骄堕”。这种办法可收到“兵不知将，将不知兵”的效果，免去将官专权的威胁，当然，负面结果是对作战十分不利，这也是导致宋朝对外用兵的时候显得“肌无力”的重要原因。'
  - '[PAGE 255]


    宋朝在兵源上实行募兵制，其中一种，就是每逢有饥荒，从饥民中招募士兵，补本城。宋朝政府对从饥民中招募士兵的办法是“天下旷悍失职之徒，皆为良民之卫”，也就是说把社会上的可能反抗者变为镇压者，一举两得。这种“以暴制暴”的举措在很大程度上缓解了北宋在社会治安管理中的矛盾。


    宋朝还有个从后周时代遗留下来的传统，就是从地方厢军中选拔出强壮者充实到中央禁军。战略要地与边疆的派兵，注重中央与地方的对抗性。这种被称作“强干弱枝”的做法也是宋'
  - '[PAGE 256]


    朝军事制度的一个特点，直接导致的结果就是在对外抵抗入侵的时候，没有任何战斗力。


    北宋在军事结构设置上，把两司变成三衙，让更多的人做领导，却又让谁都做不了最大的领导，这是分权，放权的同时分权，就是在集权。把调兵与战争的决策权，甚至具体战役所使用的具体部署，都要由远在千里之外的皇帝来指挥，因此就会时常出现贻误战机的情况。


    文官调兵与强干弱枝，兵不识将将不识兵之类的特色，本身就是削弱诸如弟兵那样的情感基础与默契程度，也起到了弱化团队战斗力'
  - '[PAGE 257]


    与向心力的效果。


    北宋的军事管理机制把士兵当作棋子，而不会被感情所左右，这本身保证了朝廷的安全，同时也极大地弱化了军事管理中的人性化成分。同时也让带兵打仗成为单纯的技术工种，而负责训练与带兵打仗的都是武将，武将以无条件“服从命令”为天职，成为单纯的战争机器。


    在文的方面，开科考试方面，赵匡胤“发明”殿试，把所有来参加考试的举人都变成“天子门生”，从根本上杜绝朝堂上的政治利益集团对皇权的威胁，而且为随后的宋太宗通过科举'
  - '[PAGE 258]


    录用的文人形成井喷之势奠定了坚实的基础。


    在基本治国方略方面，赵匡胤立下了“不杀士大夫”的祖训。在重文轻武的宋朝，诞生了很多名垂青史的文人骚客、词曲画家。让宋朝拥有理学与儒家学派深厚的社会土壤，并使得在中国数千年的封建历史中，宋朝的读书人拥有比较高的社会地位。


    再看赵匡胤留下的政治遗产在现代管理方面的价值与启发。


    在平台机制的设定上，做领导需要多创造针对'
  - '[PAGE 259]


    下属破格提拔的机会，领导者需要尊重每个人向上爬的内心需求，注重协调前朝旧臣、自己的功臣以及潜在贤人之间的关系。


    赵匡胤把权利细分，并建立调配与制衡机制，在动态之中保持平衡，这个是符合时代发展的总趋势的。所谓制衡机制，并不单纯是御人之术，更多的是领导提供形象展示平台，所谓御人之术更多的是从被管理者的角度提出来的。


    在现代机构的管理上，要想保持稳定，首要的是数量上的匹配，总部的市场人员必须相对强势于分支市场的规模，这是固本之法。其次是'
  - '[PAGE 260]


    要经常换防。就是经常在区域市场之间进行管理 人员挑换，虽然动态的换防会形成官僚作风，但官僚制度恰恰是长治久安的基础。


    我们不主张在管理的时候勾心斗角，而更多的 需要上下齐心，但实际情况往往是人都有进取心。既然陈桥兵变是赵匡胤进取心的表现，那 么因何就要阻碍别人同样的进取心呢？毕竟
    总不能说进取心是不对的，所以对领导而言， 下属的进取心是需要被限制的。


    对领导而言，面对权利分配，首先是看对人， 对自己的忠诚是最基本的，其次是有制度约'
  - '[PAGE 261]


    束，让他们从理性上难以做出不好的表现，再次是要讲究策略，基于心理层面的研究与利用。在御人之术方面需要有制度性的保障。


    作为领导，要清醒地认识到：只要是授权，中层就必然会争权夺利、弄权、滥用职权，因为他们分享的是高层的权，分食的是基层的利。所以既然授权很有可能被分权，领导被架空，最终要承担全部责任，这对老板而言是很不公平的事情，所以最终还是要集权。


    领导需要时刻保持清醒的是：部署很厉害，一经授权，迟早会弄权。所谓弄权的核心就是趋'
