    远的地区，这样，朝廷便吸纳了更远边陲的利洞，百川归流。


    第五琦和刘晏的改革，都是为了把地方的钱财收归中央，可是，刘晏对盐法的改革，成效更好。


    刘晏改革盐法的措施和效果都是超过第五琦的，也就是说，刘晏比第五琦的敛财本领更高明一些。刘晏高明在何处呢？他不过是把食盐的运销权放给了商人而已，但就是这么一放，财源就滚滚而来。


    ——这是一个顶划算的政治算术。


    从刘晏改革盐法的道理中，可以看出是国家利用了商品市场关系，从而达到财政税收的目的，国家可以不直接介入市场，但经过商人这个中间环节，可以间接地控制市场，控制了市场也就等于控制了地方的财政，这是国家利用权力控制经济运行的表现，目的不外乎还是为了保证中央政权的稳固。


    经过刘晏改革的盐法是比较成熟的食盐专利制度，为以后的朝廷所效仿。国家经营并操控市场，成为永远的赢家，只有到了把地方的财力抽干榨尽，民不聊生之时，下层民众才会沸腾起来，进而把中央政权推翻，改变一个朝代的中央政权永远作为赢家的局面。


    ## 帝王术：获取权力，引开注意力


    明朝第十代皇帝朱厚熜无子，他临死时遗诏：


    > 三个堂兄弟，谁先来到北京，谁就做皇帝。


    这三兄弟，分别在山西、河南和湖北，在湖北的朱厚熜听到消息后，向算命先生问命，算命先生趁机献上一计。


    朱厚熜依计而行。


    他坐着快马拉的囚车，抄着近路，连夜飞奔京城。为了避开对手视线，掩人耳目，他选个替身，另派一批人马，声势浩大，从另外一条路线赶往京城。


    朱厚熜坐在囚车里，快马加鞭，先于其余两位皇兄到达京城，于是捷足先登地继承了皇位。


    他就是明朝的嘉靖帝。


    我们是该感叹事情的荒谬呢，还是该赞叹嘉靖皇帝的谋略呢？


    这段史实表明了争夺皇位的激烈，我们也可以从另外的角度看待它。


    按照一般的思路，谁都不会想到朱厚熜会坐上囚车，毕竟作为皇家人物，他太高贵了，但正是由于别人不会这么想，才不会有怀疑“囚犯”的身份。


    按照惯常的先例，把犯人押赴京城，也是常有的事情，由于犯罪情况的特殊，囚车飞速赶路，也不是什么稀奇的事。


    朱厚熜正是借助了人们的惯常思路，避开对手和路人的视线，打破常规，畅通无阻地奔赴到了目的地。


    ## 帝王术：不同时期用不同人做事


    清太宗皇太极不仅是一个文武双全、智勇兼备的优秀君王，而且也是一位求贤若渴，善于惠政揽人、敢于大胆用人、能够充分信任和器重人才的卓越领导者。在他统治的17年里，他充分认识人才的重要作用，积极采取有效措施，广揽满、汉、蒙古（尤其汉族知识分子）各族人才，并委以重任，给他们提供施展才华的政治舞台，从而为清兵入关夺取全国政权、代明而立奠定了坚实的人才基础。


    清太宗深知人才的重要性，他在建立“大清国”之后即实行开科取士，为兴盛大清畅通荐才渠道。即便在残酷的战争年代，他也时刻不废渴求人才拳拳之心，并一再提醒部下：“惟多得人为可喜耳。金银币帛，用之有尽，如收得一二贤能之人，堪为国家助力，其利赖宁有穷乎？”


    为了从更大范围延揽天下英才而用之，明崇祯八年，后金（清）天聪九年，亦即 1635 年，他面向全国下达了不拘一格网络天下英才的《荐贤诏》：朕惟图治以人才为本，人臣以荐贤为要。尔满、汉、蒙古各官果有深知灼见之人，即当悉行举荐。所举之人，无论旧归新附，及已仕未仕，但有居心公正、克服任使者，即呈送吏部；有通晓文艺，居心公正、足备任使者，即呈送礼部。该部贝勒奏闻，朕将量才录用。天下才全德各之人，实不易得。但能公忠任事者，其速行举荐。


    从清太宗的《荐贤诏》，我们可以看出皇太极用人有如下几个特点：


    - **用人不拘一格。** 满、汉、蒙古不分区别，但凡有才之士，皆在举荐之列。不分旧归新附，也不论是否及仕任职，发现足可任事者，都可大胆启用。所揽人才，不论才能高低，不以求全责备论之。能克胜任使者用，足备任使者亦用，并不企求找到与任用完美无缺之人，颇具清醒而务实的用人之风。


    - **用人标准明确。** 国家以人才为本，大臣以荐贤为要，君臣合心，通力延揽人才。在清太宗皇太极的眼里，他的总体标准是“贤”。具体而言，就是重视居心公正，要求忠诚官事，看重克胜任使。也就是说，他用人首重其德，次重其忠，更重其才，力求才堪任用，能够有助国事。


    - **量才录用，信任器重。** 清太宗非常重视人才作用的发挥，尤其他深知在清兵入关、夺取政权的路程上，知识分子尤其汉族优秀知识分子的帮助和作用丝毫也不能忽视。因此对汉族知识分子不管是举家投靠者还是单身投靠者，他都一律恩养厚待，并根据其德能表现，对其杰出人才委以重任，充分信任，让他们参与机务，给他们提供活动舞台，让他们充分施展才华，助推大清国日渐强盛。其中，最典型的例子就是他对范文程的使用。


    范文程是宋代名臣范仲淹之后，胸怀文韬武略，腹有治世良谋。皇太极深知范文程是个难得的政治人才，因此对范文程特别器和信任，任命他为内秘书院太学士、进世职二等甲喇章京，凡事都注意充分发挥他的聪明才干：官员议政方案，征求他的意见；议政不决，与其议之；范文程参与议决的事情一律签署批准；范文程病，重大问题等待他裁决；范文程起草的重要文书“乃不复详审”，悉信“当无谬也”。君臣信任之深，堪为历代典范。清太宗重视人才，重用人才，敢于大胆使用汉人，在当时的历史背景条件下，可谓勇气、胆识、视野、胸襟、魄力、气度都令人赞叹。


    ## 帝王术：夺权第一步是击倒政敌


    权臣，是皇权时代的特有品种。在宪政民主的框架下，几乎不可能出现权臣这种人物，因为个人的政治权力不论在时间还是空间上，都是有限的，随时可以被收回，任何人都不可能一劳永逸、持续膨胀地长期掌握政治权力。


    权臣与皇权的关系，常常是多面的，充满张力，二者既有对立，又有合作，随着时局的变化而不断转换。权臣之兴起，必须得依托皇权的支持，权臣本人往往也一度对皇权的巩固和发展贡献不菲。但随着权臣势力的壮大，他会部分攫取、侵夺皇权，对皇权形成威胁，最终又被皇权所清算。


    有清一代，中央集权程度达到中国皇权时期的顶峰，故而并未出现太多权臣。史学家杨珍曾做了个统计，认为清代真正能达到权臣地位的人只有 7 个（康熙初年的鳌拜、康熙前期的索额图与明珠、雍正初年的年羹尧与隆科多、乾隆后期的和珅以及咸丰中后期的肃顺），其中鳌拜是排名第一的强势人物。


    鳌拜是满清镶黄旗贵族，三朝元勋。他以军功起家，在清军入关前的关键战役“松锦会战”中，他大败明军步兵营，功劳卓越。明朝总督洪承畴率 13 万大军来援，他随皇太极应战，“辄先陷阵，五战皆捷”。明军败遁，他率军追杀，大获全胜，“擒斩过半”。其后，他又随阿巴泰入长城，围攻北京，掠至山东、兖州、临清而返。


    1644 年，清兵攻陷北京，多尔衮考核群臣功绩，鳌拜以“忠勤戮力，晋一等子”。稍后，鳌拜随阿济格征湖北，破李自成军；随豪格入四川，与张献忠战于川北西充，斩献忠于阵。在明清鼎革之际，鳌拜可说是战功赫赫，为清王朝贡献卓著。


    1661 年，顺治遗命索尼、苏克萨哈、遏必隆、鳌拜为辅政四大臣。鳌拜军功最高，但因资历、威望等缘故，名列第四。他不甘于此，遂倾力施展诸种扩权、夺权手段。


    夺权第一要义，是击倒政敌。先是，借圈地换地之争，鳌拜在索尼、遏必隆的附和之下，杀尚书苏纳海、总督朱昌祚、巡抚王登联。鳌拜就此成为四辅臣中政治实力第一的权臣。


    等到 1667 年，康熙满 14 岁亲政，四辅臣的政制安排理应退出历史舞台。此时，索尼已死，苏克萨哈要求辞职，还政康熙。鳌拜不甘心退出权力中心，遂裹挟遏必隆，对苏克萨哈发动致命攻击。他诬陷苏克萨哈请辞是“背负先帝”，“别怀异心”，更罗织二十四条罪状，要将苏克萨哈斩首抄家。康熙以“核议未当，不许所请”。鳌拜在殿前对康熙疾言厉色，恐吓要挟，刚亲政的康熙羽翼未丰，无法抗衡鳌拜，苏克萨哈遂被处绞刑。


    苏克萨哈死后，鳌拜的权力达到顶峰。学者杨珍小结了鳌拜在权力顶峰的四个特征：


    - **一是蔑视皇帝，飞扬跋扈。** 他常在康熙面前对部臣高声喝问，还拒绝执行康熙的旨令。

    - **二是将朝廷治权私人化。** 一切政事，鳌拜先于私家议定，然后施行。他常把各地奏折拿回家中与亲信议办，几视康熙为无物。

    - **三是部分掌握生杀大权。** 前面提到的诛杀尚书苏纳海等人，以及罗织辅臣元老苏克萨哈罪名致其死等，均是其擅权决杀的得意之作。

    - **四是部分掌握人事大权。** “所喜者举荐，所恶者陷害”，大力培植私党，对不附己者严厉打击。


    行政权、司法权与人事权本是皇权至为重要的组成部分，却为鳌拜逐次侵占或部分侵占。


    鳌拜的骄横在清代权臣中也是罕见的，或许只有雍正初期的年羹尧勉强可以比拟。在朝贺新年时，鳌拜竟身着黄袍（黄色是帝王之色，着黄袍是相当跋扈的僭越之举），仅帽结与康熙不同。不仅如此，他甚至可能暗藏谋杀康熙、发动政变的祸心。昭槤《啸亭杂录》记，有次鳌拜称病在家，康熙去宅中探望。鳌拜卧于床上，席下悄置利刃一柄。康熙侍卫搜检出凶器，场面颇为紧张，康熙却于不动声色间消弭危机，他笑着说：刀不离身是满洲故俗，你们不必大惊小怪。


    任何一个稍有抱负的帝王，都不可能容忍鳌拜这种权臣。康熙开始谋划铲除鳌拜。康熙八年（1669年），康熙与近臣索额图密谋，支开京城随后又安排自己的亲信掌握了京师卫戍部队的指挥权。在鳌拜入朝时，康熙密令庭前布库少年们（布库是满族的一种摔跤游戏）将之生擒下狱，并宣布鳌拜三十条罪状，本应处革职、斩立决，但康熙帝念其往日功勋，将其免死禁锢。


    据法国传教士白晋记载，鳌拜被擒后，请求觐见康熙，露出其为救皇太极（康熙的祖父）而留下的累累伤疤，唤起康熙的恻恤之情，终于得保性命。不久，鳌拜在禁所死去，死因至今未有定论。


    值得注意的是，鳌拜的覆灭，不是他一个人的覆灭。绝大多数权臣的周围，都会形成一个以其为核心的利益集团。鳌拜的利益集团，势力盘根错节，深入政体骨髓，从军队到皇家侍卫，从中枢三院六部到地方督抚大员，均为其渗透乃至控制，所谓“文武各官，均出其门下”。


    鳌拜被擒后，其党羽也或死或革。不过，鳌拜集团的覆灭，并未经过军事流血，也未引发社会重大骚动，故而有人评论康熙处置鳌拜案说：“声色不动而除巨恶，信难能也。”


    康熙固然是一代政治强人，但灭鳌拜集团而不引发政体或社会巨变，也并非全因他的英明神武、雄才大略。当知，在皇权时代，不论某人如何位极人臣，他的权势都必须依靠皇权的庇护才能存在。权臣的合法权力来源，只能是经由皇权授予、确立和保障，即使权臣可以偶尔超出皇权的管辖和约束范围，但他终究还是不可能另立门户、改变江山的颜色。


    如此看来，权臣与皇帝之间的斗争，只是上层政治人物的角力游戏，它关涉到高层权力的再分配，是有中国特色的内阁重组，顺便也对民众进行公关教育，但对整个国家的走向、政体的变革、民众的福祉，并无太大影响。


    那些被诛灭的权臣，本人既是皇权的支持者、既得利益者，又是皇权的偷窥者、僭越者，最终还成了皇权的专政对象。以此观之，当权臣在权力最炽热之时，其人生已带有某种不值得同情的悲剧意味。


    ## 帝王术最高境界 “阳斥阴纳”


    帝王权谋是中国古代谋略学的一个极为重要的组成部分，大家知道，在《贞观政要》中记载了中国古代杰出的帝王唐太宗李世民开明的治国谋略，陈述了李世民与他的谋士、武将的是如何商议治理国家的策略的，表现了太宗与他的大臣、武将们沟通无间、坦诚相待的亲密协和关系，他的
    “智囊团” 对他几乎是知无不言、言无不尽，这在中国古代历史上的君臣关系中是少有的。与唐太宗李世民相比，清代的著名皇帝雍正，却是完全不同的，他对于他的谋士、智囊保持着很深的城府，对臣下的策略、计谋，从不轻易表露出赞许，更不会表示接受，反而经常训斥、敲打他们，既表示高高在上的帝王对他的“奴才”们的严厉要求，也表现自己的明智和贤良，可是，暗地里他又经常采纳他们的策略和建议。如果说，在奸诈的帝王面前，权臣们经常是阳奉阴违，那么，在臣下面前，雍正帝却是典型的“阳斥阴纳”。


    早在他还是当皇子的时候，胤禛就比别的皇子有城府，在诸皇子中，可能只有皇八子胤禩的智谋能与他相比，胤禛的内心里特别想当皇位继承人，但在公开的场合却处处表现出不在乎的样子，似乎并不想继位。他的巧妙的伪装让很多的王公大臣对他的印象很好，也让其他皇子对他缺少提防，而他却有计划有目的地筹划和行动着，盯紧了皇帝的宝座。


    他的这一套高深的城府到当帝王时，依然没有改变，反而更老到。在雍正身边，也有一帮智囊，经常为他出谋划策，而面对着谋士们的筹划和建议，他常常是底气十足、义正辞严地板起脸孔大讲堂堂正正的话，在臣下面前时时刻刻保持着仁义圣人样子，他俨然成了圣贤的化身。这在清王朝讲究以孔孟之道治国的那档口，是很管用的，政出仁义，治之有道。但是，这当然是一种仁义装扮起来的假象。在王权统治的古代权谋社会中，这装假很管用，有时能欺世盗名，获得众多的支持。胤禛正是巧妙地假借儒家的王道名义，获得朝廷内外更多的支持者。


    当时，在雍正的“智囊团”中有一个虽不是很出名，但却颇有谋略的人，他叫戴铎，早在雍正还是皇子的时候就跟随着他，这位谋士为他的主子接二连三地提出对策，上了“十启”，也就是献上了十条建议，为他夺取皇位出谋划策。对于戴铎的建议和对策，胤禛经常表现出一副高深莫测的样子，义正词严地加以训斥，似乎对这位奴才的“歪点子”十分反感，但在背后却对其计策认真琢磨，悄悄地采纳。


    比如，在康熙五十二年，当时正是各皇子争夺皇位继承权的关键时期，戴铎为胤禛献上了“第一启”，这位聪明的奴才当然不会忘记先向他的主子来些奉承拍马、大表忠心的话，然后把话转上了正题，他提出了四点重要的建议：


    - 一是劝胤禛要更亲近他父皇，要与其他皇子搞好关系，说该“孝以事之，诚以格之，和以结之，忍以容之”，这样方能使父子、兄弟之间，相安相待，创造和谐气氛。

    - 二是劝胤禛要和臣僚、下属搞好关系，积累人脉资源，逐步扩展自己的势力。

    - 三是劝胤禛不要掺和是非，不要计较小利，要大处着眼，别纠缠于小事。

    - 四是劝胤禛要多奖励有才干的人，收拢优秀人才，为自己的未来培养嫡系团队。


    对于内心很想当皇帝的胤禛来说，这几条忠恳建议可谓是正中下怀，按理他该是喜出望外的，但胤禛听了却不露声色，表现出一副很淡漠的样子。他若无其事地作了批覆：你的这些建议听起来像是金石之言，可是对于我来说毫无用处，我若有继位之心，定不会按你说的这样去行事的，何况，当皇上是一项吃力不讨好的事，我避之惟恐不及，怎会去刻意追求呢？至于君臣利害、兄弟亲和、终身荣辱的紧要之处，根本就不在当不当皇上。我仅想无祸便是福，始终尽责做事即是，别无它求，请你放心好了，像你这样的言语，有叵测之嫌，往后不可再有，请你往后务必谨慎！


    胤禛的这一批复，表现出很高明的策略，首先，他以平淡的语言把自己紧盯皇位的野心很巧妙地掩盖起来，同时又以亲切而严正的话来教训了下属，显示其贤良正派，执意在下属面前竖起更高的威信；其次，君臣的这一对话，如果传到外面，还可让朝中大臣们看到他胤禛无意于皇位，是淡泊功利的仁义君子，甚至还可以让他在父皇面前，有好的印象，并还能让其他的皇子对他丧失警惕，这可谓有多利而无一害。


    再如，在康熙五十六年，戴铎上了“第七启”，这一“启”颇有朱升为明太祖建议“广积粮，高筑墙，缓称霸”的意味，戴铎认为，主子想成就大业，必需有屯粮之所，也许有练兵之地，臣愿去台湾，“替主子屯聚训练，亦可为将来之退计”。


    对于这个建议，胤禛心里窃喜，但表面上却大义凛然，对戴铎训斥一通，雍正说：“我以亲近的仕宦待你，你却比谩骂我更甚，你若存此心，若非灾难，必遭天谴。我劝你好自为之，多行正道，别惹麻烦。”看来，胤禛对戴铎这个折子颇不以为然，但在实际上，他难道不想给自己筹划未来吗？其实，胤禛早就在西北边陲安插了自己的亲信，他的第一心腹大将年羹尧，早就在那里实施为他掌兵了，你戴铎筹划的是对的，但已经用不着了。既然用不着，胤禛不如乘机一骂，既教训这奴才，又给自己的贤良形象进一步添光彩，一举两得，何乐而不为？


    又如，康熙五十七年，这一年，胤禛的老爹康熙皇帝刚把宠臣李光地从福建召回，据传闻是为了商议立太子之事，忠诚的戴铎怕其他皇子被确立为太子，仗着与李光地有一面之交，私下向李光地询问，并斗胆建言，夸自己的主子“聪明天纵，才德兼全，恩威并济，大有作为”，并很气派地对李光地承诺：“大人如肯相为，将来富贵共之”。


    事后，自鸣得意，胸有成竹的戴铎立马上奏雍正，上陈事由经过，有请功领赏之意，并借机分析了几个王爷之优劣好恶，推测他主子当皇帝的巨大可能性，他以奴才的尽忠，预祝主子早登大位，似乎对主子君临天下已是十拿九稳。可是，胤禛对此如何反应呢？


    戴铎接到胤禛的批示是：“我在京时，此等言语，我何曾向你提过一句，你却在外大放厥词，居然敢如此大胆，你之死生，轻若鸿毛，我之名节，关乎千古，作为你之主子，想必有前世的冤孽。”


    这一批示，依然是正气凛然，冠冕堂皇，仁至义尽，谁知道了，对雍王爷必是无不敬服的，可是，明眼人都知道，胤禛完全是装模作样的。他对戴铎的训斥，对戴铎的谩骂，看似正义凛然，胸怀坦荡，背地里确实居心叵测、深谋远虑。这时，胤禛对皇位已是势在必得，他能不能不喜欢戴铎对李光地的建议吗？聪明的胤禛不会不知道，当时的李光地可是康熙帝的亲密重臣，李光地可以在不通报的情况下直入康熙书房，与康熙探讨儒家学说，胤禛对戴铎的“训斥”只不过是为了让自己的兄弟们、让那些窥视皇位的皇子们更加的放松警惕，同时也让他自己装扮得更像是康熙、李光地所喜欢的儒者形象，俨然是传统圣贤的那种仁义至上，不争名利的贤者，显然，其训斥何等微妙。实际上，胤禛，包括后来的雍正，很多方面是采纳着他的谋士戴铎的建议，“阳斥阴纳”！


    雍正继位后，他特意让人把戴铎的“十启”连同他的批示成册示人，不难看出，雍正帝是想告诉后人，有戴铎这样谋士的超常建议，他胤禛却屡屡对之训斥，显然我胤禛本来就不想继承皇位，我对自己的亲信骂得还不够吗？


    雍正帝玩弄的权术何止这些，他有很多的“创造”：


    - 比如，杀戮不惧多的他，在康熙的晚年，为夺得皇位，居然很“虔诚”地“信奉”佛教，把自己弄得“神神道道”，俨然是佛祖在上，诚以感天动地。其实，这是一种巧妙的掩饰，迷惑众皇子，似乎他无意逐鹿皇位，这是在麻痹对手，大放烟幕弹，这是在欺骗他父皇，似乎他胤禛是天下最虔诚的人，惟佛是敬，菩萨心情。在他继位后，更是不仅拜了喇嘛高僧为师，还自己选刊佛学书籍，一副始终虔诚的模样，但是，在现实的政治斗争中，他苛酷严刻，杀人不眨眼，连自己的创业亲情，如年羹尧等，也毫不留情。

    - 再如，他“始创”了清王朝最可怕的特务制度，把自己的亲信秘密派到权臣、武将的身边，秘密潜伏，定期通报信息，秘密监控文臣武将的动向，在雍正朝，大有武则天时期的恐怖气氛。

    - 又如，雍正朝大兴“文字狱”，镇压文化人士，其严酷与毒辣，远胜于他的老爹康熙。


    如今看来，非常明显，不管是作皇子的胤禛，还是登上皇位的雍正，训斥是假，采纳是真。

    '
