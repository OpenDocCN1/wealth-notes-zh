    # 获取权力第一步是人思想上的毁灭


    《资治通鉴卷七》


    原文：（公元前213年）丞相李斯上书曰：“异时诸侯并争，厚招游学。今天下已定，法令出一，百姓当家则力农工，士则学习法令。今诸生不师今而学古，以非当世，惑乱黔首，相与非法教人；闻令下，则各以其学议之，入则心非，出则巷议，夸主以为名，异趣以为高，率群下以造谤。如此弗禁，则主势降乎上，党与成乎下。禁之便！臣请史官非秦记皆烧之；非'
  - '[PAGE 3]


    博士官所职，天下有藏《诗》、《书》、百家语者，皆诣守、尉杂烧之。有敢偶语《诗》、《书》弃市；以古非今者族；吏见知不举，与同罪。令下三十日，不烧，黥为城旦。所不去者，医药、卜筮、种树之书。若有欲学法令者，以吏为师。”制曰：“可。”


    译文：丞相李斯上书说：“过去诸侯国纷争，以高官厚禄招徕游说之士。现在天下已定，法令统一出自朝廷，百姓理家就要致力于耕田做工，读书人就要学习法令规章。但今日的儒生却不学习现代事务，只知一味地效法古代，并借此非议现实，蛊惑、扰乱民众，相互非难指'
  - '[PAGE 4]


    责现行制度，并以此教导百姓；闻听命令颁下，就纷纷根据自己的学说、主张妄加评议，入朝时口是心非，出朝后便街谈巷议，夸饰君主以提高自己的声望，标新立异以显示自己的高明，煽动、引导一些人攻击诽谤国家法令。这种情况如不制止，就势必造成君主的权势下降，臣下结党纳派活动蔓延民间。唯有禁止这些才有利于国家！因此我建议史官将除秦国史记之外的所有史书全部烧毁；除博士官按职责收藏书外，天下凡有私藏《诗》、《书》、诸子百家著作的人，一律按期将所藏交到郡守、郡尉处，一并焚毁；有敢于相对私语谈论《诗》、《书》的处死；借古非今的诛杀九族；官吏发'
  - '[PAGE 5]


    现这种事情而不举报的与以上人同罪；此令颁布三十天后仍不将私藏书籍烧毁的，判处黥刑，并罚处修筑长城劳役的城旦刑。不予焚烧的，是医药、占卜、种植的书。如果想要学习法令，应以官吏为师。”始皇下制令说：“可以。”


    帝王术讲解：


    +   一、不让议政。不让人有思想，有异见。


    “焚书坑儒”是秦始皇实行诸多暴政统治的重要体现，而嬴政也因此成为了历史上为数不多'
  - '[PAGE 6]


    的暴君代表。其实不然，焚书坑儒的目的是为了统一思想，在思想文化上形成一统的局面，采取愚民的政策，进而使秦朝能够长期的统治下去。结合当时的局势而言，这种想法无可厚非，也是必要的。嬴政刚刚兼并六国，统一中国，秦始皇所面对的是一个从春秋到战国，诸子百家争鸣
    500 余年的文化思想盛世也是思想文化乱世，而众多思想的存在无疑是对秦王朝进行中央集权统治的一中潜在威胁。从这里也不难看出，“焚书坑儒”的实质并非仅有统一思想、愚民这样的简单，其背后隐藏着的是法家思想和其他诸子百家思想在权力上和统治地位的争夺，是主张实行新政的秦王朝对提'
  - '[PAGE 7]


    倡“尊古制”的儒家思想的一次压迫。


    # 二、以官吏为师。


    “以吏为师”的算盘大致是这样打的:吏是层层挑选任命的，吃着皇粮，拿着俸禄，毕生的富贵前程都在上司手里攥着，应当能够唯上之命是从；吏的利益是与政权兴替拴在一处的，一荣俱荣，一损俱损，为了维护既得利益，应该不会做出损害政权的事情来；吏所受的训练是熟悉法律条文或政府的诏令，然后照章办事，不越雷池，因此应该不会想入非非，弄出一些稀奇古怪的思想。'
  - '[PAGE 8]


    把思想的传授权和裁决权交由吏来执行，为的就是在思李斯的“以吏为师”究竟如何实行，还需要细加考证，粗略说来，大致有三：


    一是烧书。除了医药、种树、卜筮之类实用之书，统统烧掉。“令下三十日不烧，黥为城旦。”


    那时没有“破四旧”这样的术语，但指责读百家语的诸生“不师今而学古”、“道古以害今”的意思，同指责帝王将相古人死人统治舞台之类取向是一样的。天下只烧剩皇家的指令，自然不见异端，使心不乱。


    二是镇压。那时还没有发明“群众专政”和“大批判”一类花样，所以采取的是赤裸裸的镇压'
  - '[PAGE 9]


    手段——“有敢偶语《诗》《书》者弃市”，“以古非今者族”


    三是思想传授，只准以吏为师，学着做忠于上、勤于事、习于法的官吏。至于百姓，只要当会说话的工具就成了。


    三种办法归于一，即运用政权的力量禁绝皇家思想以外的一切思想领域杜绝“异端”。'
  - '[PAGE 10]


    # 获取权力第二步是为赤裸欲望穿一件外衣


    原文：


    《资治通鉴》卷十七


    《春秋》大一统者，天地之常经，古今之通谊也。今师异道，人异论，百家殊方，指意不同，是以上无以持一统，法制数变，下不知所守。臣愚以为诸不在《六艺》之科、孔子之术者，皆绝其道，勿使并进，邪辟之说灭息，然后统纪可一法度可明，民知所从矣！”


    天子善其对，以仲舒为—江一 都相。会稽庄助亦以贤良对策，天子擢为中*大夫。丞相卫


    9'
  - '[PAGE 11]


    绾奏： “所举贤良，或治中、韩、苏、张之言乱国政者，请皆罢*。” 秦可。董仲舒少治《春秋》，孝景时为博士，进退容止，非礼不行，学者*皆师尊之。及为一江一 都相，事易王。易王，帝兄，素骄，好勇。仲舒以礼匡正，王敬重焉。


    翻译：


    > “《春秋》推崇的天下一统，这是天地之间的永久原则，是古往今来的一致道义。现在，每个经师传授的道不同，每个人的论点各异，百家学说旨趣不同，因此，君主没有办法实现统一，法令制度多次变化，臣下不知应该遵守什'
  - '[PAGE 12]


    么。我认为，方向不同，所有不属于儒家 ‘六艺 ’ 范围之内，不符合孔子学说的学派，都禁绝其理论，不许它们与儒学并进，使邪恶不正的学说归于灭绝，这样做了就能政令统一，法度明确，臣民就知道该遵循什么了！
    ”


    武帝很赞赏董仲舒的对答，任命他做江都国的相。会稽人庄助也以贤良的身份参加了考试对答，武帝擢拔他担任中大夫。丞相卫绾向武帝上奏： “ 举荐来的贤良，有研究申不害、韩非、苏秦、张仪的学说，扰乱国家政治的，请都予以遣返。
    ” 武帝批准了奏请。董仲舒从小研究《春秋》。孝景帝时做了博士官，进退举止，'
  - '[PAGE 13]


    不做任何不合乎礼法的事，学者们都用尊师的礼节尊敬他。等到董仲舒做了江都国的相，侍奉江 二 都易王刘非。易王刘非，是武帝的哥哥，历来骄横，好逞勇力。董仲舒用礼义来辅佐纠正他，易王也很敬重董促舒。


    帝王术讲解：


    景帝刘启死前的一个遗憾，就是没有解决匈奴问题；汉朝虽然国力蒸蒸日上，但面对匈奴，仍然只能被动防御，靠和亲与“岁贡”安抚对手——长此下去，那就不能说实现了华夏民族的“伟大复兴”。十六岁的武帝血气方刚，决意继承父亲的遗志。但他举目四望，却感觉有'
  - '[PAGE 14]


    劲没处使，不知该如何下手——因为他发现，此

    时的朝中大臣，个个都是老油条，自己虽是

    皇帝，却被处处掣肘。其实，这些人未必是故

    意与皇帝作对，但长期的“无为而治”已经造

    就了一个以贵戚豪强为主的既得利益团体，他

    们小日子过得滋润着呢，才不愿改弦更张呢！


    那么，武帝首先要做的，就是让整个国家再一

    次动起来。那么具体该怎么做呢？年轻的武帝

    自己没什么经验，于是向爷爷文帝刘恒学习，

    在即位后八个月，即武帝建元元年冬十月，“诏

    举贤良方正直言极谏之士”——也就是招贤纳士、群策群力。当年通过举贤良这招，爷爷招'
  - '[PAGE 15]


    到了贾谊，爸爸招到了晁错，那朕的又在哪里呢？


    ——结果还真让他找到了。


    广川人董仲舒，在景帝时期担任博士，教授《公羊春秋》，为儒学一派。见武帝诏问国策，董仲舒就上了一篇《举贤良对策》；这篇策论很长，有两三千言，但却被司马光全文收录——原因无它，此策实是奠定了后世以儒学为尊之根基。司马光亦是孔门子弟，对此重视自是不足为奇。


    董仲舒看出来了，当时的贵戚豪强们，已有失去制约的危险，那么怎样重新治住他们呢？严


    14'
  - '[PAGE 16]


    刑峻法自是一种方法，但董仲舒身为儒家弟子，对法家那套是嗤之以鼻的——你看秦二世而亡，就是教训。董仲舒开的药方，是加强礼乐教化，使人们知道上下尊卑，自然能“阴阳调而风雨时，群生和而万民殖”——也就是行王道！虽然老董是出于门派之见贬低法家，但其实也道出一个事实——此时的中国太大了，以当时的技术条件，全盘法治，技术上已无法实现。盖法乃是规定了社会活动的下限——下限越低，需要法出面处理的事情就越多，行政效率就会越来越低；而儒家的“王道”，则是强调道德的作用，努力提高这个下限，最后达到一种平衡，社会就和谐了。'
  - '[PAGE 17]


    为了实现“王道”，董仲舒使出了三招：


    一是行察举制，即由诸列侯、郡守、二千石官员等，每岁推举治下二人为候补官员。这是为了使官僚体系正规化，避免官职成为世袭，否则就又回到封建时代的老路上了。后来，直到魏文帝行“九品中正制”为止，察举制一直是中国最主要的官吏选拔制度。当然，与隋以后的科举制相比，察举制仍不够公平，所以科举大兴后就逐渐让贤，但这毕竟是向官僚社会转型的重要尝试，饭总要一口一口吃嘛！而且，科举时代也不是说就完全废除了察举制，举贤良、举孝廉，仍然长期存在。'
  - '[PAGE 18]


    二是建太学。太学者，用以养士。儒家本就有重视教育之传统，这也成为后世公办学校之滥觞。


    第三，就是大名鼎鼎的“罢黜百家，独尊儒术”！不过嘛，其实董仲舒并没有说过这样的话。当然，以他的本意，这样干自然最妙；但武帝在思想上，并不会这么激进，他只是出于统一思想的政治需要，逐渐提高儒学的地位，那么渐渐地大家自然会放弃研究别家学说了。实际治理国家中，武帝仍是“儒法并用”的。


    董仲舒的对策，为武帝打开了思路，他终于明白该干些什么了。不过，董仲舒却并未得到重'
  - '[PAGE 19]


    用，而是被任命为江都国相。这原因吗，一方面是董仲舒本身不喜做官，另一方面，倒与当年的贾谊有些类似。'
  - '[PAGE 20]


    # 获取权力第三步弱化解体敌人组织


    汉武帝独尊儒术统一思想服务于消灭旧贵族独尊王权。


    夏朝是个传说，商朝周朝是成熟王朝。商周一千多年，奠定了中国文化基因，塑造了中国帝王术基因。


    商周都有共同点，天下是造反夺来的。打天下坐天下，王权化国为家，化天下为私产。王权关心的是不要再丢天下。丢天下不仅丢财，也要丢命。坐稳天下，不仅是保财，也是保命。'
  - '[PAGE 21]


    身家性命，全搭进去，就得死保王权。王权的存在，就是王权存在的目的。


    要保王权，就得把一切有助于王权巩固的力量都抓在手里，就得把一切可能挑战王权的力量予以摧毁。这就是君王之大事，这是帝王术的指向。在中国精湛的帝王术面前，马基雅维利的《君主论》只是小儿科。


    《左传》上说：“国之大事，在祀与戎。”祭祀与军事，王权两大支柱，两手得抓两手得硬，这是商周两朝统治经验的总结。商周甲骨文、周代金文，周代文献，多有祭祀与军事记载。'
  - '[PAGE 22]


    国之大事之一的宗教祭祀是什么？商朝祭祀上帝一自然神一祖先。周朝承袭商朝，敬天法祖为主，兼祭自然神。周王权军教一体，以宗教优势和军事优势维持统治。


    公元前771年，申侯犬戎灭西周。后起的东周无军事优势，靠着宗教祭祀传统，仍维系东周王权五百余年。


    “祀”是宗教凝聚力，“戎”是军事暴力。维护王室特权统治，祭权与军权为本，控制意识形态，垄断军事暴力。'
  - '[PAGE 23]


    春秋战国，是诸侯国卿大夫僭越、挑战和剥夺周王室祭权和军权的时代。秦始皇统一中国，汉武帝罢黜百家独尊儒术，君王垄断上天祭权和唯一军权的中央集权格局得以形成，以后二千多年格局未变。


    祭权分层。王权垄断上天上上帝祭祀，民众有宗教需要，怎么解决？对有集体性宗教，实行家国分离。朝廷支持民间以祖先崇拜为中心，以家族祠堂为组织系统的民间宗教存在。祖先崇拜非普世宗教，家族祠堂组织力限于家族范围，这对朝廷不会构成跨家族的大的组织性威'
  - '[PAGE 24]


    胁。你不可能用你家的祖先祭祀去动员别家的人与你共同奋斗。


    上天、上帝不限于一家一族，上天、上帝的祭祀权，具有超越家族的凝聚力，由皇家独家垄断。


    儒家礼教以孝为基，服从父亲，由孝及忠，顺从君主，君亲一体，忠孝一体。家族精神归祠堂，皇家精神归天坛。家族祠堂遍布天下，皇家天坛天下唯一。皇家天坛主祭，即天子自己。敬天法祖，中国几千年皇家宗教。民间法祖，以家庭和家族祠堂为中心。皇家敬天法祖，以'
  - '[PAGE 25]


    天坛和太庙为中心。


    中国农村不也有“天地君亲师”牌位吗？这不是敬天吗？不是。“天地君亲师”的“天”是自然之天，不是皇家祭祀的那个至上神昊天上帝。民间可设祭坛祭祀昊天上帝吗？不可以。中国有几个天坛？只要国家统一，就只会有一个。


    在农村的家族祠堂中


    仍可看到“天地君亲师”牌位


    佛教、道教呢？不也发展起来了吗？历史上规模也不小，这与帝王术有什么关系吗？有，关系很深。


    24'
  - '[PAGE 26]


    请注意，佛教修佛，道教修仙，成佛成仙，皆指向个人，属个人化宗教。没听说佛教徒约起来为修佛成佛而共同奋斗，没听说道教徒约起来为修仙成仙而团结牺牲。成佛成仙的目标指向个人而非集体，指向彼岸而非现世，指向个人生命修炼而非理想社会实现。


    佛道宗教哲学，深深把人个人化、原子化和分散化。佛寺里满是佛菩萨罗汉，且佛经称一粒沙中有千万个佛国。一切因缘而生因缘而灭，万物无自性，现世如梦如幻，全无恒定之依靠。修佛之目的，在于超越生死轮回现世苦难，抵达彼岸之宁静佛国。从哲学意义上，这解构了'
  - '[PAGE 27]


