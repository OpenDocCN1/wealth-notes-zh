    政权的路程上，知识分子尤其汉族优秀知识分子的帮助和作用丝毫也不能忽视。因此对汉族知识分子不管是举家投靠者还是单身投靠者，他都一律恩养厚待，并根据其德能表现，对其
    中杰出人才委以重任，充分信任，让他们参与 机务，给他们提供活动舞台，让他们充分施展 才华，助推大清国日渐强盛。其中，最典型的例子就是他对范文程的使用。


    范文程是宋代名臣范仲淹之后，胸怀文韬武略，腹有治世良谋。皇太极深知范文程是个难得的政治人才，因此对范文程特别器和信任，任命他为内秘书院太学士、进世职二等甲'
