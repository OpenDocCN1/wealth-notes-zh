    # 帝王术统一手段


    司马炎统一的影响：司马炎统一中国是中国古代最仁义的统一，能优待孙刘曹皇族，是最和谐的统一。封建专制伦理严重时，皇帝只关心自己统治时间的长短和权势，不像现代人重视社会进步、国家统一、民族生存这些内容。司马炎统一在历史上发挥了有益作用，对后世的影响也是进步的，并不是误解的黑暗腐朽统治。司马炎结束了汉末以来的长期战乱和分裂，用习凿齿评价：除三国之大害，静汉末之交争，分裂割据混战对人民来说就是大害，是阻碍历史进步的，统一的历史功绩不论怎样都是巨大的。只有实现统一才有可能推动社会进'
  - '[PAGE 155]


    一步发展，才能开疆，让人民生活安宁幸福。


    司马炎统一后也实现了开疆，这也是对中国


    的历史贡献。司马炎统一也促进了中国对外交


    往，促进了中国科技、文化、教育的发展，晋


    朝有众多的发明创造和制度建设都是在


    中国首创的，其中包括：三省制、门下省、国


    子学、书博士、占田制等等。科技发明有瓷


    器、制图术、指南舟、楼船、凸镜聚光、


    脉经等等，这些成就都是在司马炎统一前后


    的成果，有的就


    是为统一战争服务的创造，只是在


    实现统一


    后，才增强了汉民族的团结，也巩固了


    汉族和其他民族的团结，增加汉族人口，


    改变了汉末中原人口锐减，汉族人口比例


    劣势的困局。司'
  - '[PAGE 156]


    马炎统一用了十年时间，在几个大一统开疆的朝代中，也是最快的，秦朝从始皇帝即位到统一用了二十年；汉朝从汉高祖称帝到汉武帝恢复秦朝旧疆也用了九十年；唐朝从唐高祖称帝到唐太宗恢复西域也用了三十年；元朝从成吉思汗称可汗到统一也有七十年，能统一是对中国基本贡献，要是恢复前朝旧疆是对中国的突出贡献，能开疆算是杰出贡献，在这方面，晋朝也不次于其他朝代。司马炎在统一方面能重用众多贤臣，增强国力，能抓住机会用很小的代价和短暂的进攻实现统一，这是值得尊敬的，连唐太宗都称赞司马炎是庙堂神算，这样的统一对人民自然最有利，没有严重的负担。'
  - '[PAGE 157]


    司马炎统一后的中国才成为与西方罗马帝国并列的大国，在世界上占有重要地位，才有可能在对外交往中有更加广泛的外事活动和经济贸易，中国在晋朝才能实现天下无穷人的太康盛世。现代中国更应该重视晋朝对社会进步的贡献；实现了国家统一；增强了民族生存能力这些影响。'
