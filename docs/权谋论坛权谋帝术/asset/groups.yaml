    # 四、因势定制、严明赏罚、用人所长的建军思想


    李渊重视军队制度建设，其基本做法是因势定制，有沿有革。起事初期，为适应战争的需要，他建立大将军府，下设左、中、右三军，由三个儿子分别统领，形成了有力的统一指挥体制；为扩充兵源，实行募兵政策。武德二年（619年），他提出，为提高军队战斗力，必须“各因部校，序其统属”（《唐大诏令集》卷一〇七《备御》），恢复府兵制，分'
  - '[PAGE 174]


    关中为12道，置12军。三年，12军各立军号，分道治军，耕战结合。建立12卫和东宫6率，完善了中央军事体制和府兵的编制，沿用了隋朝的一些做法，又有所发展。在治军上，为适应兴兵起事的需要，他注重广施恩惠，不惜重赏；同时又强调严肃军纪，禁止侵暴百姓。积极争取起义军的支持，收编其队伍，以不断壮大自己的力量。对归顺者封以高官，如对关中起义军首领孙华；对抗逆者，在将其打败后，一般只诛敌首，对其余人采取赦“违误者”和善待俘虏的政策。强调赏罚公平，不分贵贱。霍邑之战后论功行赏，有人主张应募之奴不能与良人同，李渊'
