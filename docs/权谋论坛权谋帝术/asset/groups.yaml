    在当时群雄竞起的战争环境中，刘备攫取帝王的野心一点也不比别人差。在小时候便云“我为天子，当乘此车盖”，看来他是自小“立志”啊，就凭这点他可以算是从小便处心积虑的想登上大统了。之所以没有实现，只不过是限于当时他势单力薄，一时无力和别人抗衡而达不到目的罢了，就象在刘表面前夸口一样“备若有基本，天下碌碌之辈，诚不足虑也”。第三十一回蔡瑗劝刘表不要引狼入室时说：“刘备先从吕布，后事曹操，近投袁绍，皆不克终，是可见其为人。”一语道破了刘备有狼子野心。否则，他就不会在战乱之时投军，其心思无非是想浑水摸鱼，捞上一把，他还是'
  - '[PAGE 141]


    知道乱世出英雄的道理的。还好当时以他的“才智”还可以对付黄巾之类乌合之众，消灭了一部分黄巾军，多多少少还算是捞到了一点政治资本，立了所谓一点军功，不然他就真的没有机会实现几时的梦想了。


    可实际上，他除了与董承等六人书名带血诏并常在阵前宣读以示正义以外，终其一生，并没有为朝廷设为一谋出过一份力，倒是处心积虑的经营自己的蜀汉天下，时时刻刻想摆脱别人的控制去谋划自己的天下。刚与董承等人书名带血诏，都还没有行动，一见有机会逃走去经营自己的天下，便什么也不顾了。还亏他走之前对董承等人说“某此行必有以报命”，可'
  - '[PAGE 142]


    最后董承等人都死了，也未见他报什么命，倒是把自己的事业打理的有条不紊。


    最可以突出他全然不顾“汉室”而只顾自己恩怨的是伐吴前诸人劝其勿战所说的一番话，连他自己也说“朕不为弟报仇，虽有万里江山，何足为贵？”还亏赵云劝说“汉贼之仇，公也；兄弟之仇，私也，愿以天下为重！”不知道此时他把“匡扶汉室”忘到哪里去了，而把自己的事情看的比什么都贵重，可见他平日里那些豪言壮语只不过是方便行事的幌子罢了。


    而最能揭示刘备早有野心的是：他的两个儿子，一个名封，一个名禅，合即为“封'
  - '[PAGE 143]


    禅 ”—— 天子祭天地之礼，这样明确的政治野心及强烈的功利进取心，时时隐含着取而代之的图谋。至于他一再标榜自己是什么“ 汉室宗亲”，只不过是为了取“ 正统”
    之名罢了。


    # 三、假仁假义


    他的假仁假义更是让人作呕，且不说先摔阿斗以笼络赵云，终至让赵云感其知遇，几救阿斗，诚心辅佐，后又白帝托孤，一把鼻涕一把泪的把诸葛亮感动得终身为其江山操劳而卒。虽他说的好听：“
    君才十倍曹丕，必能安邦定国，终成大事，若嗣子可辅，则辅之；如'
  - '[PAGE 144]


    其无才，君可自为成都之主。”明是支持诸葛亮自己来主政，实际上是让诸葛亮辅佐刘禅，而让其开口不得也只好甘心辅佐了，单看刘备这临终遗言的意蕴，李赞就一针见血的评道：“只此一语，便得孔明之魄，玄德真奸雄哉！”


    在第十九回中，吕布被擒，求刘备为之讲情，“公为座上客，布为阶下囚，何不发一言而相宽乎？”刘备点头答应，但一转眼又劝曹操杀吕布，一点不念其辕门射戟之情，此等忘恩负义之人又岂能称得上仁义呢？所以作者仍不免跳出来借吕布的口骂道：“是儿最无信者！”同样的，当他被曹操打败，只身投奔冀州，答应表示招关羽来归，可结果是他使奸计'
  - '[PAGE 145]


    欺骗了袁绍，[4]杀了别人的大将，之后又巧言遮掩，挑拨别人君臣关系，都是为了自己的如意算盘。当刘备装作无可奈何之状而取得刘璋之地后，却又乐不可支，“设宴于公厅”，“顾庞统曰：今日之会，可为乐乎？”得意之情，溢于言表。可见之前说不可夺同宗之地，不可行不义之事，皆是伪作，是“外君子则内小人”，既然反复说不能夺同室之地，不能行不义之事，然而一旦夺了人城邑之后，即一副胜利者的姿态，足见其伪诈到何种程度！


    当献帝被废后，曹丕称帝时，他的臣子劝其“即皇帝位”，他又以“恐天下人议论”为由，竟勃然变色说：“孤岂效逆贼所为！卿等'
  - '[PAGE 146]


    欲陷孤为不忠不义之人耶？ ”说的多么冠冕堂皇，正义凛然，对比其几时的“豪言壮语”和此前他自信“备若有基本，天下碌碌之辈，诚不足虑也”是多么绝妙的讽刺啊！。只是刘备做的很隐秘罢了。他一再请诸葛亮
    “展吕望之才，施子房之宏略”，俨然以周文王、武王、汉高祖自居，可又在前面称帝惺惺作态。犹如在甘露寺前以剑劈石，对人是“破曹兴汉”，而心里想的是“成王霸之业”，其虚伪之貌昭然若揭。


    在第五十一回中，诸葛亮与刘备的一番对话，更是让刘备的假仁假义的面目无所遁形。“玄德问孔明曰：‘却才先生教备如此回答，'
  - '[PAGE 147]


    虽一时说了，展转寻思，于理未然。我今孤穷一身，无置足之地，欲得南郡，权且容身。若先教周瑜取了，城池已属东吴矣，却如何得住？’孔明大笑曰：‘当初亮劝主公取荆州，主公不听，今日却想耶？’”一个“笑”字，把刘备的虚伪之情刻画得淋漓尽致，诸葛亮的潜台词不言而喻。


    刘备对人虽然在表面上看来是讲义的，但一旦危及自己的利益就什么也不顾了，连自己的儿子也是如此。其义子刘封听信谗言不救关羽以至于失去一员大将，贻误军机，确实有罪，但也不致死。再说死与不死自有法律断定，可刘备不但使用了郑庄公不教而诛的手段，而且'
  - '[PAGE 148]


    在刘封拒绝投降，扯书斩使之后，已经完全证明忠于自己了，还是杀了他。直接原因就是刘封不应该强于阿斗，亏他当初收刘封为义子说的那些话，什么只要诚心待人必不相负，而此时对于危及自身利益的人的处理还管什么之前说的什么话，虚伪之貌令人恶心。


    # 四、贪图享受


    刘备贪图享乐，不思进取，更是让人鄙其为人。在第三十九回中，刘备自己以为有了诸葛亮便可以万事无忧了，纵然已经知道曹操会时刻南下，他却以牦牛尾“结帽”，还辩解道：'
  - '[PAGE 149]


    “吾聊假此以忘忧耳。”而当诸葛亮问及将何以迎曹兵时，他却又说：“吾正愁此事，未得良策。”一说这一说那，前言不搭后语，彼此矛盾，正是说明了他无多大志向，不愧为阿斗之父，还巧言掩饰，亏他之前说“备若有基本，何虑天下碌碌之辈耳”。就算是有
    了基本，如果这个样子也是败家子，又一个刘阿斗。就象后来自衿才智被陆逊火烧得片甲不留，终至身亡白帝城。


    更为经典的是他差点因女而轻天下。在第五十五回中说刘备与孙夫人成亲后“自此连日饮酒”，这时候倒是会借酒忘忧啊！还是张昭了解其为人，“刘备起身微末，奔走天下，'
  - '[PAGE 150]


    未尝享受富贵。今若以华堂大厦，子女金帛，令彼享用，自然疏远孔明、关、张等”，“玄德果然被声色所迷，全不想回荆州”，与其子看来是一样的啊，“此间乐不思蜀”，不愧是啊斗之父。若不是诸葛亮设计在先，让赵云依计行事，刘备又怎么会突然想回荆州呢？看来，孔明也知道其为人，要不怎么会考虑得如此周全呢？只是不便直说罢了。刘备一口一声要成就大事，连这点关口都过不了，还说什么“天下碌碌之辈不足虑也”。真是滑天下之大稽！还是书中评论的好：谁知一女轻天下，欲易刘郎鼎峙心！


    到了最后阶段，作为最终鼎立一方的霸'
  - '[PAGE 151]


    主，刘备的后期已经完全没有了曹操那样始终是曹魏方面的主心骨和最高决策者的支配地位，他没有了用武之地，似乎在成功地完成了“三顾茅庐”的任务之后便可以高枕无忧了，这时刘备实则已经成为真正的刘阿斗之父了，不过徒具一个象征意义上的符号而已。[5]夷陵之战中，连不甚精通兵法的曹不也知道“岂有七百里营帐而可拒敌乎？包原隰险屯兵者，此兵法之大忌也”。刘备却还是那样的自以为是：“朕令吴班引万余弱兵……擒此竖子，江南一鼓而下矣。”


    然而时代不同了，对手也不同了，与当年伏击黄巾军这般乌合之众大不一样了，却仍那'
  - "[PAGE 152]\n\n样自诩，以抱残守缺为不凡，怎么不会被吴将“营烧七百里”，“蜀营一应粮草器仗，尺寸不寸”，“蜀将川兵，降者无数”，留了个兵败身亡的下场，亏他还自诩“朕用兵老矣”。\n\
    \n但之前当马良谏阻不了刘备移营之后，建议“将各营移居之地，画成图本，问于丞相”之时，刘备便猛地爆发了久蓄的不满：“朕素知兵法，又何问之？”这倒好，被陆逊火烧七百里，只落得个惨败的下场。回顾刘备的生平经历，若没有诸葛亮便一事无成，此处就是印证。其不思进取也就罢了，却又自高自大，自以为是，焉能不败！\n\
    \n  此上事实一一摆明在我们面前，是作者有"
  - '[PAGE 153]


    意为之还是无心之失，无从得之。既然罗贯中是“拥刘反曹”，也应/为贤者讳，隐去才是；也许是为了使人物形象更加丰满，有血有肉；到底是何目的，恐怕是无法说清的，从这一点看来似乎是艺术败笔所致，也可以说是无心之失了。作品客观的描写告诉我们：刘备用虚伪做作掩盖了其真实的意图，貌似忠厚，内藏奸诈。《三国演义》第六十回引正史曰：“操以急，吾以宽；操以暴，吾以仁；操以谲，吾以忠；每与操相反，事乃可成。”刘备的这番自白，无意中撕破了他的假仁假义，他之所以以宽、仁、忠，其实不过是一种反曹操的策略。'
