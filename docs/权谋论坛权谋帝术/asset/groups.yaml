    # 解析左右牟利与毁誉


    帝王和他的左右是一个矛盾体，具有相互对立、彼此同一的矛盾属性。当然，帝王是矛盾的主要方面，起着主导作用。不过矛盾双方是可以转化的，于是，帝王与左右之间的矛盾斗争就出现三种情况：左右利用帝王牟利被发现；没被发现牟利成功；帝王利用左右驾驭大臣。


    《资治通鉴》记载：齐威王令人召来即墨的主官，对他说，自从你到即墨走马上任后，每天我都听到指责你的话传来。然而我派人去即墨'
  - '[PAGE 287]


    调查，看到的却是开辟整治好的肥沃田土，丰衣足食的百姓，官府不需要处理各种矛盾和问题，我国的东方安定和谐。于是我知道 “是子不事吾左右以求助也”，这是你不用钱物结交我的左右内臣，以此谋求他们在我面前替你说项的缘故。齐威王于是封赐即墨大夫享用一万户的俸禄。


    随后，齐威王又召见东阿的主官，对他说，自从你镇守东阿，我每天都听到称赞你的好话传来。但我派人前去调查，只见田地荒芜，杂草丛生，百姓贫困饥饿，命悬一线。当初赵国攻打鄄地，你见死不救；卫国夺取薛陵，你不知'
  - '[PAGE 288]


    道。于是我知道“子厚币事吾左右以求誉也”。你用重金来买通了我的左右近臣，每天在我面前替你说好话。当天，齐威王下令烹死阿地大夫及替他说好话的左右近臣。“于是群臣耸惧，莫敢饰诈，务尽其情，齐国大治，强于天下。”


    《资治通鉴》齐威王杀一傲百，群臣震慑，毛骨耸然，不敢再弄虚作假，都尽力做实事，齐国因此大治，成为天下最强盛的国家。


    一个地方的主官的政绩和誉毁，往往与他们的顶头上司的左右有极大关系。我们假设一下，如果齐威王不派亲信去调查，或者去调查的人'
  - '[PAGE 289]


    也被收买，再如果东阿大夫不仅收买齐威王左右还努力工作，和即墨与实际情况差不多，那么，得到齐威王信任的肯定是东阿大夫，倒霉的是即墨大夫。东阿大夫有人宣传，好官声远播，又得到领导信任，提拔就是早晚的事了。所以，大臣的誉毁和任用关键在于帝王的圣明。


    据《资治通鉴》记载，汉武帝与儿子们很少在一起，连皇后也难得见上一面。一次，太子进宫谒见皇后，太阳都转过去半天了，才从宫中出来。也许是为了了解太子，汉武帝暗示过宦官们要随时向他汇报太子的情况，黄门苏文向'
  - '[PAGE 290]


    汉武帝打小报告说，太子调戏宫女。汉武帝没有较真，心想儿子大了，性欲肯定大了，于是汉武帝将太子宫中的宫女增加到二百人。后来太子知道了这件事，便对苏文怀恨在心。苏文与小黄门常融、王弼等看到太子母子已失宠，舅舅卫青大将军又已死，所以，这些小人经常暗中寻找太子的过失，然后再去添枝加叶地向汉武帝报告。对此，皇后恨得咬牙切齿，让太子禀明皇上杀死苏文等人。太子说：“第勿为过，何畏文等！上聪明，不信邪佞，不足忧也！”太子认为，只要自己没做错事，皇上是个聪明人，不会忠奸不辨，劝他母亲不要害怕。此时太子是个明白人，不像以后被江充陷害时冲'
