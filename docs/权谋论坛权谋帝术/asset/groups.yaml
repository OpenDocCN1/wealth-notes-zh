    # 帝王心术：俎上冻鱼


    贤良是假，狡诈是真；信佛是掩饰，残忍是真；慈悲是虚，杀戮是他作为帝王常干的事。不管是对谋士的“训斥”还是对佛学的“虔诚”，都是胤禛、雍正的一道假面具，是他炉火纯青的骗术。


    当然，客观地说，雍正有他勤勉尽责的一面，有他励精图治的优点，但他的虚伪欺骗，假戏真做，“阳斥阴纳”，是阴谋而非阳谋，是必须谴责的！在他之后，乾隆朝“成就”了和珅那样“阳奉阴违”的大奸臣，不能不说与雍正帝的不良传统有关，毕竟，欺瞒是会有报应的，人在做，天在看，对于两面派，人们终究是会看破的，虚伪的表演，没有好的未来。雍正及后来的和珅，后世被谴责批判，这一事实其实在告诉后来的政治家，玩阴谋代价太大，弄不好会“机关算尽太聪明，反误了卿卿性命”！


