    “诸大臣内”分为三派，支持雍正的不论，中间派墙头草也不论，余下支持八爷十四爷的举几例，雍正元年二月初十日，将苏努之子勒什亨革职，发往西宁，跟随胤褋效力；其弟乌尔陈因同情其兄，一并发往；雍正元年四月初二日，命皇十四弟、贝子胤䜣留遵化守陵，又命胤䜣家人雅图、护卫孙泰、苏伯、常明等永远枷示，伊等之子年十六以上者皆枷；在四月七日这篇上谕发出之前，雍正已经处理了几个为首的八爷十四爷的亲信。这句“尔诸大臣内”的第二个意思，是雍正向这些八爷党“摊牌”，“领头”的都“处理”了，“剩下的”你们也请好自为之。


