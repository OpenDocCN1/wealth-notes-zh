    # 帝王术卓越的政治家路线


    李渊(566—635)，字叔德，祖籍陇西成纪(今甘肃秦安西北)，一说狄道(今甘肃临洮)，一说赵郡(治今河北赵县)，唐朝的建立者，史称唐高祖，杰出的政治家、军事家、统帅。


    李渊7岁时袭封唐国公，历任隋千牛备身、谯、陇、歧州刺史，荣阳、棣烦二郡太守、殿内少监，卫尉少卿，弘化留守兼知关右诸军事，有骁卫将军，太原留守等职。大业十三年(617年)，起兵反隋(参见李渊太原起兵)。成功地指挥了攻取霍邑(今山西霍州)之战和长安(今陕西西安)之战(参见霍邑之战、李渊攻取长安之战)。义宁二年(618年)五月'
  - '[PAGE 159]


    称帝，立国号唐，建元武德。先后派兵击灭割据陇西的薛仁杲(参见唐击灭薛举父子之战)、南犯河东的刘武周(参见唐灭刘武周之战)、据洛阳称帝的王世充和前来援救王世充的河北起义军首领窦建德(参见洛阳、虎牢之战)、据江陵(今属湖北)称梁帝的萧铣(参见唐平萧铣之战)、据河北反唐的刘黑闼(参见唐灭刘黑闼之战)和丹阳(今江苏南京)的辅公祏(参见唐灭辅公祏之战)等，从而完成了统一全国的大业(参见唐统一战争)。武德九年(626年)八月传位于太子李世民，为太上皇。卒于贞观九年，庙号高祖。'
