    # 帝王术拉拢人才必要手段


    大家都知道曹操和刘备手下都有很多人才。刘备的，比如：诸葛亮、关羽，张飞等。曹操的，比如：郭嘉、张辽，夏侯惇等。我今天要说的问题，就是他俩在拉拢人才的手段方面有何不同。


    先说曹操，他在这方面的手段有两种。一：礼贤下士，狼自枉屈。就像他对关羽那样，三天一小宴，五天一大宴来款待关羽。在宴会上说关羽的功德。对关羽封官、赏银，赐宅。不过关羽最后还是没有归顺他，这是遇到了关羽这样对刘备“死忠”的人，要是一般人肯定投效曹操。二：威逼利诱，拿别人的家人作威胁。'
  - '[PAGE 91]


    就像他对徐庶，先礼后兵，一边先写信给徐庶劝他归降另一边拿他母亲做要挟。如果徐庶不投降，就杀了他的母亲。虽然徐庶最后投降曹操，但终身未为曹操出过一计。这个手段他运用失败了。


    再说刘备，他也是两种手段。一：礼贤下士。对诸葛亮三顾茅庐，每次去还准备的特好，发现诸葛亮正在睡觉时，不让小童叫醒他，自己带着两兄弟静静地站在门外等候。直到诸葛亮醒来，没有一点烦躁。与他交谈语言十分谦虚，一点没有目中无人的样子。恳求诸葛亮出山时都快哭了。最后答应出山。这是刘备十分惯用的手段，而且相当有效。二：假意舍弃取臣。'
  - '[PAGE 92]


    在长坂坡大战时，赵云救阿斗于千军万马之中，九死一生。刘备怀抱阿斗说道：“为这小子，几乎损我一员大将！”说罢，当着赵云的面将阿斗扔在地上。他算准了赵云会去接他，所以才敢这么做。换回了一句“臣万死难报主公知遇之恩”，这也算值了。这就是将礼贤下士升级，有多了一个儿子没大臣重要。


    那么曹操和刘备同样是礼贤下士，为什么刘备的部下对他更忠诚呢？我认为，一：刘备被人们一直认为和善，而曹操被人们骂为奸雄， 奸贼。名声两人就截然不同，那人们肯定是投效名声好的。二：刘备更注重心理，他喜欢在别
    人心里下功夫，从内心去征服部下。曹操在'
  - '[PAGE 93]


    内心下的功夫不够，他注意物质享受，但不是每个人只要功名利禄的，关羽就是一个例子。'
