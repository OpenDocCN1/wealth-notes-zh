  - '[PAGE 107]


    # 帝王术在起步阶段的施展很重要


    刘备从一介平民，经过个人奋斗，成为九五之尊，认真探究起来，必有其成功之道。常言说，乱世出英雄。社会大动乱的大环境，给每个有志气有才能的人提供了难得的机遇，不过有人成功，有人失败。在中国历朝历代的开国皇帝中，有如刘邦、刘秀、朱元璋，等等，就是从社会最底层经过奋斗成功的范例；而陈胜、吴广，陈友谅等，就是奋斗未获成功的例子。刘备从平民到皇帝，经过了几十年的奋斗，最终获得成功，排除环境和客观因素，就刘备主观上而言，我认为主要有以下八大因素。


    106'
  - '[PAGE 108]


    一、立志。立志是刘备成功的根本因素。刘备屡败屡战，斗志不减，根本在于志存高远，不因一时之得失而心灰意懒。刘备少有大志。就像陈胜曾经与一起劳作的人聊天时说的，燕雀安知鸿鹄之志哉！《三国演义》在刘备出场时有一大段话，表明了刘备不是社会底层碌碌无为的一般百姓。当时黄巾军前来犯幽州境界，刘焉招募义兵相抗，引出了一位英雄：“那人不甚好读书，性宽和，寡言语，喜怒不形于色，素有大志，专好结交天下豪杰”；“家住本县楼桑村，其家之东南，有一大桑树，高五丈余，遥望之，童童如车盖。相者云：此家必出贵人。玄德幼时，与乡中小儿戏于树下，曰：我为天'
  - '[PAGE 109]


    子，当乘此车盖。叔父刘元起奇其言，曰：此儿非常人也”。这段话，表明了刘备自小就蓄大志，这个大志不是别的，而是当皇帝。刘备与张飞、关羽相识，结为异姓兄弟时，表明要救困扶危，上报国家，下安黎庶，也可看出其志向。曹操煮酒论英雄，当说到“当今天下英雄，唯使君与操耳”时，刘备惊得筷子掉在地上，说明曹操说中了刘备的心事。刘备三请诸葛亮，诸葛亮前两次避而不见，我看主要是不明刘备志向，常言道，良禽择木而栖，诸葛亮作为一代良相，自当要寻英主。刘备三顾茅庐时，诸葛亮明说了：“愿闻将军之志”，刘备屏退旁人后说：“汉室倾颓，奸臣窃命，备不'
  - '[PAGE 110]


    力量，欲伸大义于天下， ”通俗地说，就是要取天下而治理之。刘备立志可见一斑。


    二、用贤。用贤是刘备成功的关键因素。刘备用贤，最重要的是用了诸葛亮。刘备三顾茅庐，请到诸葛亮后，成了刘备事业的转折点。在此之前，刘备东奔西逐， 遑遑似丧家这之犬，没有立身之地，虽有大志，但不得伸。得到诸葛亮后，取荆州，定益州，终成帝业。刘备一生，对诸葛亮非常信任，大事都委任于他，让诸葛亮放手去做，从不生疑。诸葛亮也竭尽心智，鞠躬尽瘁，死而后己。正因如此，刘备才能取得成功。在用贤方面，刘备还用了庞统、马良'
  - '[PAGE 111]


    等人，但终究没有表现出什么特出之处。特别是庞统，经孔明推荐，刘备并不识其才，几乎错过。而其他贤才，在诸葛亮的光芒掩映之下，也未得以充分发挥。因此，在刘备集团，不像曹操集团那么人才济济，倒像是诸葛亮一人之外，有点人才凋零的样子。这也是刘备的事业很快消亡的重要原因。


    三、结义。结义是刘备成功的重要因素。桃园三结义，历来为人们津津乐道，认为这体现了中国人关于义的最高境界。但刘备结义，乃是深谋远虑，主要是从事业考虑。在刘备的过程中，关张二人多次救了刘备的命。到后来，成'
  - '[PAGE 112]


    为刘备事业的柱梁。刘备入西川后，关羽镇守荆州，与曹军和东吴对峙；刘备夺取益州后，张飞任巴西太守，与新占汉中的曹军在第一线对峙。关张二人，是刘备集团的核心骨干成员，刘备集团的凝聚力、战斗力由此二人支撑。关张一生，从未与刘备离心离德，而是团结一心，浑然一体。在刘备的一生中，用义气笼络人体现最充分的另一个例子是赵云，赵云被刘备用义气打动，跟随刘备一生不悔，为刘备的事业立下大功。


    四、借势。刘备善于借势，这也是刘备事业成功的重要因素。刘备本是一介平民，不像曹操'
  - '[PAGE 113]


    有曹家和夏侯家两大家族的势力可供倚赖，也没有孙权那样有父兄创下的宏大基业。刘备完全是白手起家。在那个时代，要做出一番伟业，必须有人跟随，组成一个势力集团。一介平民百姓，要得到别人的信任，做到一呼百应，是非常不容易的。但是刘备有办法，他充分利用了他的姓氏，也就是当时的皇姓。说他是什么中山靖王之后，一下子成了皇族血统。不仅如此，他还攀上了皇帝的叔叔的尊位，被尊为皇叔。刘姓本是中国大姓，是不是皇室血统，在当年那个乱世，想来也没有什么人去认真追究，即使追究，也不一定弄得清楚。刘备与人交往，口必称备乃中山靖王之后，打着维护汉'
  - '[PAGE 114]


    室的旗号，以后登上皇帝宝座时又打着恢复汉室的旗号，确实蒙住了一些人。中国历来有名正言顺的说法，名不正则言不顺，言不顺则事不成，刘备深谙此道。刘备打着中山靖王之后的旗号，也增强了其事业的正义性，自己理直气壮，跟随他的人也理直气壮了。


    五、装衰。刘备有装衰的本事，是一个表演天才。历史上有一种说法，说刘备的江山是哭出来的江山，此话大致不假。综观《三国演义》通篇，写刘备哭泣、下泪的不下几十处，刘备真是一个哭才。刘备三请诸葛亮时，见其不肯出，即哭，孔明见刘备哭，就同意了。在刘表'
  - '[PAGE 115]


    府上，在刘表墓前，刘备都曾哭过。为不还荆州给孙权，刘备哭过。娶孙尚香时，刘备在吴国太前哭过。在与刘璋相见时，刘备哭过。赵云当初离开刘备回公孙瓒处，刘备泣别。在襄阳携民渡江时，刘备大恸。在长坂坡，赵云救回了阿斗，刘备哭了。关羽、张飞死后，刘备终日哭泣，以致泣出血来。常言道，男儿有泪不轻弹，刘备作为堂堂男子汉大丈夫，为什么动不动就哭鼻子流眼泪呢？难道是真正到了伤心处吗？我看不一定。哭，只是刘备的一种处事待人的方式，是为了感动别人，打动别人，使别人被感动，引起别人同情。有时是为了表明诚心。但有时又是惺惺作态，作给别人看的。'
  - '[PAGE 116]


    比如在襄阳渡江时，面对百姓大恸，就主要是做给别人看的，作出一种爱民如子的样子。在长坂坡赵云救回阿半后的哭泣，既有伤心的成份，也有做样子的成份。看来，即使是想当皇帝的人，装裱也是一种可用且有效的手段。


    六、傍款。这里说的傍款，是借用当今傍大款的说法。傍款，其实也是借势的一种做法。但刘备的傍款，不只是借势，自己势力弱小时，去依傍某个强大的势力，保存自己的实力，慢慢发展壮大自己。而是夺势，喧宾夺主，以客代主。三国时期的绝大多数强大的势力，刘备几乎都去傍过。最早是傍公孙瓒、田楷，然后'
  - '[PAGE 117]


    是傍吕布、陶康，再是傍曹操、袁绍，然后是傍列表、孙权，再后是傍刘璋。刘备傍大款，不只是勉从虎穴暂栖身，而是处心积虑，暗中抢夺地盘实力，准备独树一帜，反客为主。在与公孙瓒打交道时，曾向公孙瓒借兵，暗地拉拢赵云，挖公孙瓒的墙脚，由于公孙瓒警惕性高，逼着刘备还人，才未得逞。与陶谦打交道时，实际上抢夺了徐州。在与袁绍和曹操打交道时，没有占到便宜。后来，只好打同宗的主意。打列表的主意时，被蔡瑁识破，才有马跃檀溪，但列表死后，还是抢到了江夏作为根本。与孙权打交道时，占到了荆州的一大块地盘。最后，算盘打到了宗兄刘璋的头上，抢到了益'
  - '[PAGE 118]


    州，终成帝业。刘备的地盘、人才，基本来自于荆州、益州。刘备从白手起家，傍款，借用已有的势力，是他的一种重要策略，这也是他能够成功的重要因素。


    七、联姻。刘备最早的夫人是谁，看过《三国演义》之后摸不着头脑，最早见到的刘备的夫人，是糜夫人和甘夫人。糜夫人是徐州豪富糜竺的妹妹。甘夫人是在小沛时娶的，不知来源如何。刘备娶糜夫人，据说是糜竺见刘备身边没有女人，没人照顾，而把妹子嫁于他的。但实际上，糜竺在徐州算一个大财主，且有影响力。刘备娶其妹，不乏政治上的考虑。糜夫人'
  - '[PAGE 119]


    死于当阳长坂坡。甘夫人生了阿斗，因长期战乱，死于赤壁之战前后。由此，有人说刘备命硬克妻。赤壁战后，孙权把其妹孙尚香嫁好刘备为妻。这个婚姻，应该更多政治成份，是为了巩固孙刘联盟。因为刘备时年已经
    4 9 岁，孙尚香还是二八佳人。刘备入成都后，孙尚香回了东吴。刘备又娶了一个寡妇——刘焉之子刘璋的妻子——吴夫人。刘备娶吴夫人，一则可能是因为她漂亮，二则可能是为了笼络益州人，巩固他在益州的地位。由此看来，刘备的婚姻，殊少爱情因素，更多政治因素，这也是政治人物的悲哀。'
  - '[PAGE 120]


    八、逃命。刘备一生，逃命之时颇多。把逃命也列为刘备成功的法宝之一，是因为逃命在刘备事业成功中的重要作用。刘备深谙“留得青山在，不怕没材烧”的道理，正由于他具有百折不挠的精神，才使得他最终能成就大业。值得一提的是，刘备逃跑有术，每每大难不死，又死灰复燃。著名的逃跑，有从徐州逃到袁绍处，有从袁绍处逃到荆州刘表处，有从新野、樊城经长坂坡逃到江夏，最后的一次逃跑，送了老命。也就是夷陵一战大败，逃回白帝城，抑郁成疾，又羞于见人，不敢回成都，终至不起。综观《三国演义》，刘备基本不会打胜仗。正如陆逊在夷陵之战中所论：寻备前'
  - '[PAGE 121]


    后行军，多败少成，推此论之，不足为戚。还有一段，谈及刘备会逃跑、会打败仗：备是猾虏，更尝事多，其军始集，思虑精专，未可干也。今往已久，不得我便，兵疲意沮，计不复生，掎角此寇，正在今日。陆逊之论确实精到，对刘备的分析精辟入微，正是其看透了刘备，所以才定下掎角此寇之大计，一举击溃刘备，使之一蹶不起。'
