    是曹操选世子的故事给我们带来的一个最大的启示


    # 帝王术与控制人才为己所用


    人才是第一资源，现代社会是这样认为的。其实古代，君王们对此更有深刻的体会。在战乱频仍的三国时代，人才的数量和质量甚至决定了国家的存亡。曹、刘、吴之所以能三足鼎立，最重要的一条，就是他们善于发现人才，吸纳人才，使用人才。纵观三国，曹魏最强，正是由于它拥有最大量、最优质的人才。魏国之所以能聚集起如此众多的人才，这与曹操独特的用人观是分不开的。'
  - '[PAGE 80]


    曹操在用人 的手段上有他独到的地方。司马懿从政 的经历就很具有代表性。这个未来魏国重 要的军事家、战略家、政治家在还未出仕的时 候，就非常聪明通达，有雄才大略，为世人所
    知闻。当时一个名士崔琰曾经用八个字评价司 马懿：聪亮明允，刚断英特。这样一个杰出的 人物，曹操当然不会放过，决定任 him 担任文 学掾。司马懿那时思想很正统，他感到汉室衰
    微，不想屈节在曹操手下干活，借口得了风痹 之症想推辞掉。曹操听了大怒，放出风声：不 当官，就下狱。司马懿十分恐惧，只好接受召 辟，就职上任。在汉朝末年，有一些士人确实
    存有很浓重的正统观念，虽然曹操控制着皇'
  - '[PAGE 81]


    帝，但不少士人忠于皇帝，却耻于为曹操效力。


    因此，曹操对他控制区域的人才，只要是有名望，不管你的政治态度如何，他一定会拔擢使用，甚至为此不惜使用暴力，刘备三顾茅庐的作派，曹操似乎是不屑的，他喜欢用更为直接的手段。如果谁不愿意入仕，那就得倒大霉，那些入仕而又不效忠曹操的，曹操一定会想方设法除掉他。所以，曹操发现了很多人才，使用了很多人才，但与刘备、孙权相比，杀的人才是最多的，比较著名的就有孔融、弥衡、杨修等人。


    曹操用人的气量是非常罕见的。曹操手下一个'
  - '[PAGE 82]


    大臣魏种的经历就很具有传奇色彩。曹操在兖州的时候，势单力薄，因此非常重视人才的选拔与培养。他发现了一个叫魏种的人，认为很有才，就举为孝廉，刻意加以培养。兴平元年，曹操出师攻击陶谦、刘备，留守后方的陈留太守张邈乘虚发生叛乱，并联合吕布，占领了兖州。曹操听说这一消息，立即回军平叛，并对身边的人说：“兖州发生叛乱，只有魏种一定不会背叛我。”在曹操看来，魏种一定会尽职死节的。然而，前方很快就传来了魏种逃离兖州的消息。曹操非常忿怒，说：“只要魏种你不是向南逃到越人荒蛮之地，或者向北逃到胡人塞外荒漠，我就一定要抓到你，决不放过'
  - '[PAGE 83]


    你。” 五年后，曹操攻克袁绍部将眭固困守的射犬城，意外地在城内抓到了魏种，军士们把魏种五花大绑带到曹操面前。出乎众人的意料，曹操居然亲自把魏种的绳索解开，还说了一句意味深长的话：“唯其才也！”
    在我看来，曹操说这句话大概有两层意思，一是对身边的人说的：当初魏种逃离职守，是因为魏种有才，不愿意没价值地死在兖州吧，当年魏种的行为是可以理解的。二是对魏种说的：现在我放了你，不是因为你没罪，而是因为你
    有才，希望能继续为我效力。于是，曹操不但放了魏种，还任命他担任河内太守，全面负责黄河以北的事务。可以想象，魏种肯定感激涕零，终身不'
  - '[PAGE 84]


    贰。象这种曾经背叛曹操，后来又臣服曹操的将领还真的不少，比如张绣曾经发动叛乱，杀死了曹操的长子、侄儿和亲随大将典韦，但后来在贾诩劝说下重降曹操，仍然受到厚待。曹操这种用人的气量，在中国历史上实在是罕见的。


    曹操是一个非常惜才的人。我们看看他对待俘虏沮授的态度。沮授这个人物，在《后汉书》、《三国志》中都没有他的传记，但此人实在是一个了不起的人物。《后汉书・袁绍刘表列传》里，记载了沮授的几件事：第一件事，沮授在兴平二年，向袁绍建议：“挟天子而令诸侯，'
  - '[PAGE 85]


    奋士马以讨不庭”。这个建议可不得了，要知道，曹操手下头号谋士荀彧是在第二年，也就是建安元年才向曹操提出类似的战略建议的。如果袁绍当时采纳了沮授的建议，先把汉献帝控制在手中，那中国后面的历史就没曹操什么事了。第二件事，沮授曾经向袁绍献破曹之策，就是根据袁强曹弱的特点，连年分兵袭扰曹操，打持久战，损耗曹操的实力，使之逐渐衰亡。可惜袁绍是个持速胜论的乐观主义者，拒绝了沮授的建议。第三件事，官渡之战前，袁绍势力上下认为此战必胜，洋溢看乐观情绪。而沮授呢？他在随军出征前，大会宗族，进行诀别，并把所有资产全部分掉，他跟弟弟沮宗'
  - '[PAGE 86]


    说：“主骄将怯，军之破败，在此举矣”。第四件事，在官渡之战打响后，沮授多次建议“坚壁持久”、“分军护粮”等正确的建议，但均未被袁绍采纳。由此看来，沮授不但是个战略家，而且也是战术家，实在是个难以多得的人才，如果遭逢明主，那一定可以经天纬地、安邦定国。这样的人才，曹操是绝对不会放过的。官渡之战后，沮授在乱军中被俘，曹操与沮授有旧，亲自去见了他，两人留下了六句精彩的对话：沮授首先说，我不是投降的，而是被你们抓住的；曹操说，咱们处在不同的地区，一直被隔开不能相见，想不到今天你我才会这样见面；沮授回答，袁绍失策，自取失败，我的才'
  - '[PAGE 87]


    智和能力全都无法施展，该当被擒；曹操说，袁绍无谋，不能采用你的计策，如今，天下战乱未定，我要与你一同创立功业；沮授说，我叔父与弟弟的性命，都控制在袁绍手中，如果蒙您看重，就请快些杀我，这才是我的福气；曹操叹息说，我如果早就得到你，天下大事都不值得担忧了。于是，赦免沮授，并给予他优厚待遇。不久，沮授策划逃回袁绍军中，曹操这才将他杀死。至于关羽降曹的故事，大家更耳熟能详了，曹操明知关羽不能久留，但只要关羽能够暂时在麾下效力，就予以封侯拜将的厚待。可以看出，曹操是非常惜才的，只要你人才，并且不自己的事业构成威胁，哪怕


    86


    关注更多绝学V：357607890'
  - '[PAGE 88]


    象徐庶入曹营一样，一言不发，一策不献，也会白白养着你。当然，一旦构成威胁，就只好痛下决心，尽显枭雄本色了。


    曹操创造了一个新的人才评价标准。古代用人的标准是“德才兼备”，尤以德为重。而曹操却搞了一个“唯才是举”，在他看来，德是用来教化万民的，才是用来安邦定国的。乱世之中，要以才为先。曹操更是下了一道《唯才是举令》来广征天下士人为他效力。他的观点，彻底颠覆了中国人自古以来的识才用人之道。在用许攸这个问题上就很具有典型性。许攸是个贪财好利的小人，袁绍不能满足他，于是来'
  - '[PAGE 89]


    投奔曹操。此时正处官渡之战的最紧要关头，曹操没有粮食了，眼看就要退出战斗，自动败北。许攸劝曹操奇袭袁绍囤粮地乌巢，从而扭转了整个战局，一举赢得官渡之战的胜利。


