    # 帝王术任用、敛财背后的目的


    公元 755 年，唐朝发生了安史之乱，经过这场战乱，可纳税的人口数量减少，财政吃紧，为扭转财政亏损局面，需要另辟途径，寻找税收来源，所以唐玄宗就任用了第五琦，整顿财政。


    为了驱散全国政治上架的乌云，应急眼下战事所需的军费，第五琦全面垄断盐业，把食盐的生产、运输、销售全部收归朝廷，对私煮私卖食盐者进行定罪。


    可是，盐价大涨，当然，客观上也增加了朝廷的收入。另外，官府垄断盐业，还造成各个环'
  - '[PAGE 345]


    节的腐败行为，使官营的盐业收入流入私囊，不能很成功地增加朝廷收入。


    这个时候，国家又利用刘晏，制定新的盐法政策，与第五琦的盐法相比，由官收、官运、官卖，变成了官收、商运、商卖。食盐的生产、收购、储存等方面还是由官府把持，由官方掌握食盐价格，然后卖给商人，由商人们去运送和销售他处，如此就减少了食盐运销方面的官吏，减少了人力成本，相应地也就减少了政府在运输、销售方面的开支和费用。同时还减少了腐败行为，提高了效率。又由于利润的刺激，商人会把食盐行销到全国各地，甚至是较为边'
  md: '

    人，示眯明也。盾与之食，食其半。问其故，曰：‘宦三年，未知母之存不，愿遗母。’盾义之，益与之饭肉。已而为晋宰夫，赵盾弗复知也。”这个人，《左传》叫灵辄。赵盾给他饭吃，并让他带回一些饭食给他母亲。他后来当了晋灵公的卫士，当其它卫士要杀死赵盾时，他帮助抵挡敌人，让赵盾逃走。古籍说他“然不知明之为阴德也”，也就是只要做好事，就会积阴德，得好报。


    第三计，军队攻打赵家，将其灭门。赵盾逃到边疆的时候，赵盾的弟弟赵穿将晋灵公杀死，赵盾另立新君，还是当他的丞相。但是，弑君的责任归赵盾担当，原因是弑君时他还在晋国境内，同时，也没有惩处弑君者。“大史书曰，赵盾弑其君，以示于朝，宣子曰，不然，对曰，子为正卿。亡不越竟，反不讨贼。非子而谁，宣子曰，呜呼，我之怀矣，自诒伊戚，其我之谓矣。孔子曰：董狐，古之良史也。书法不隐，赵宣子，古之良大夫也，为法受恶，惜也，越竟乃免。”孔夫子同时表扬了两个人：良史董狐，据法直书毫不隐瞒；良吏赵盾，为遵守法制甘愿承受坏名声。


    赵盾死后，他的死敌屠岸贾利用赵盾弑君的罪名，不请示国君就擅自和将领们在下宫攻袭赵氏，韩厥反对，但势单力薄。他就告知赵朔赶快逃跑。赵朔不肯逃跑，他说，您一定能不使赵氏的香火断绝，我死了也就没有遗恨了。韩厥答应了他的要求，他谎称有病不出门。“贾不请而擅与诸将攻赵氏于下宫，杀赵朔、赵同、赵括、赵婴齐，皆灭其族。”


    此后就演绎出了“搜孤救孤”荡气回肠的历史悲剧，这个故事大多数中国人知道。故事中的两位主人翁，一个是赵朔的门客，一个是朋友。他们两人都是具有大德的人物，为了朋友，不惜牺牲家人和自己的生命。可惜这种人在战国之后就少见了，现在更是难以见着。


    我们可以从上面两个例子看到，搞阴谋的人一般都是以最大的罪名陷害人，这些罪名不是篡逆、叛国，就是弑君。而他们的手段就是把要陷害的对象，往这罪名的路上逼。我觉得要避免遭遇阴谋，首先就是要淡泊名利，远离小人，最好是像陶朱公范蠡、张良学习，功成身退，不要恋栈，逃离是最好的选择。否则，反误了卿卿性命而不知。


    ## 二、诱骗人上当受骗，坠入圈套。


    诱骗人的伎俩，第一是装好人，他似乎是集公平正义于一身，是一个正直的人，一切为他人着想的人。他可能是你的熟人、朋友，甚至是亲戚。第二是他在做好事，所做一切都是为了你好，第三是让你相信你会得到一个好结果。他手里拿着香喷喷的诱饵，正是你需要的那种东西，也就是投你所好。最后是凭借其三寸不烂之舌，翻云覆雨之手段，使你堕入其挖好的坑，让你哑巴吃黄连——有苦说不出。历史上有很多这方面的高手。


    李林甫是其中的佼佼者，他因身体力行创造出“口蜜腹剑”成语而遗臭万年，他比狐狸精更狡猾，其骗人手段堪称范例。《资治通鉴》记载：“李林甫为相，凡才望功业出己右及为上所厚、势位将逼己者，必百计去之；尤忌文学之士，或阳与之善，啖以甘言而阴陷之。世谓李林甫‘口有蜜，腹有剑’。”《资治通鉴》意思是说，李林甫当丞相就是武大郎开店，能力政绩比他强的，或者皇帝喜欢，对他的相位有威胁的，就千方百计将他们除掉。对他的政敌“当面嘴巴里喊哥哥，背后手里拿家伙（棍棒刀枪）”，个个被他击倒。


    李林甫文化水平有限，特别忌恨有学问的人。天宝元年（742）有一次艺术家玄宗在勤政楼工作之余也不忘记观赏歌舞，因怕有人说工作时间搞娱乐，拉下了窗帘。兵部侍郎卢绚以为玄宗已经离开，于是就没有下马，而是提鞭按辔，从楼下穿过。卢绚风度翩翩，清新儒雅，玄宗目送其远去，感叹卢绚含蓄不露的风度。因平时李林甫常常用金钱贿赂玄宗左右的人成为他的眼线，玄宗的一举一动，李林甫都了如指掌。于是李林甫就召来卢绚的儿子说，你父亲素来有名望，现今交州、广州需要有才能的人去治理，皇上想令你父亲去，不知道愿意不愿意去。我这可是违反了组织原则私下告诉你，谁要你爹是咋哥们呢？言下之意他是学习雷锋做好人好事。接下损招就出来了，而在不知内情的人们看来这是在帮助他。李林甫说，如果害怕到边远地区工作，就应该降官，否则，只有以太子宾客或詹事的身份在东都任官。这也算是优惠贤者的任命，不知你们的意见如何。卢绚听后，十分害怕，于是就主动奏请担任太子宾客或詹事。李林甫又恐怕违背众望，引起众怒，就任命卢绚为华州刺史。“到官未几，诬其有疾，州事不理，除詹事、员外、同正。”《资治通鉴》最后将卢绚彻底闲置在那儿，没有与他争宠的能力了。


    有一次玄宗问李林甫，严挺之现在在哪里任官，这个人可以重用。谁知道皇帝一句问话，严挺之就开始倒霉了，严当时为绛州刺史。李林甫退朝后，立马召来严挺之的弟弟严损之，告诉他说，皇上十分重视你哥哥，为何不乘此机会，上奏说得了风疾，请求回京师治病。李林甫又是装好人，表面上看他对人家的健康关怀备至，多好的组织部门的领导啊。严挺之感潸潸，激动得马上写了治病的报告。李林甫拿着严挺之的报告对玄宗说，皇上如此器重严挺之，可他有负皇上期望，衰老中风，应该授以散官，便于治病养身，以体现皇上爱臣如子的大恩大德。玄宗听后，感叹不已。四月二十八日，任命严挺之为詹事。又任命汴州刺史、河南采访使齐澣为少詹事，二人都是员外同正，一道在东京养病。“澣亦朝廷宿望，故并忌之。”《资治通鉴》齐澣也是因为在朝中甚有名望，所以遭到李林甫的猜忌。


    历史上有一个比李林甫更高明的诱骗人的高手，他就是楚国的费无忌。李林甫只诱骗一个对象，费无忌同时诱骗两个人，然后借助其中一方将他嫉恨的人铲除。


    鲁昭公二十七年（前516），楚国大将左尹郤宛与吴国打仗，因吴国国内发生政变，无心恋战，被打得大败而逃，楚国缴获了大量武器粮草，俘获了很多士兵。郤宛班师回朝，楚王给予极大奖励，将缴获的战利品一半奖给了郤宛，并特别倚重于他，费无忌和右领鄢将师十分嫉妒恨。于是，费无忌史上第一次设计了利用
    “饭局” 陷害人的骗局。


    费无忌看中了 “令尹子常贿而信谗” 《左传译注》，也就是喜欢别人送东西而又听信谗言的弱点，也许平时费无忌没有捐给子常送东西，利用他作为自己害人的工具也是手到擒来。于是，他找到子常，说郤宛得到了很多奖金，非常感谢你对他工作的支持，想请你聚一聚，吃个饭乐呵乐呵。子常是楚庄王第三子的孙子，这个人身形高大威猛，心眼坏倒不坏，就是四肢发达头脑简单。以前楚灵王的时候，他是灵王的车夫，齐国的晏子出使楚国时，带头刁难晏子的那个人就是他。对费无忌的话没加考虑就爽快地答应了。


    搞掂了一头，又去找另一头。费无忌对郤宛说，令尹要到你家里去喝酒，这可是对你极大的恩宠呀。郤宛说，我是下贱的人，不足以让令尹到这里来。令尹如果真想要前来，赐给我的恩惠就太大了。我没有东西奉献，怎么办？费无忌说，令尹喜欢皮甲武器，您拿出来，我来挑选。选取了五领皮甲，五种武器，说放在门口，令尹到来，一定要观看，就乘机献给他。等到举行酒宴的那一天，傻帽郤宛把皮甲武器放在门边的帐幔里，此时，恐怕他心中喜滋滋，内心里感谢费无忌牵线，要不哪有机会向令尹大人献殷勤。正满脸笑容指挥家人，忙前忙后迎接贵客。


    郤宛哪知道一场阴谋造成的灾难向他袭来，请人来吃饭变成引人来灭族。费无极对令尹说，我几乎让您遭祸，郤宛打算对您不利，皮甲和武器都放在门口了。您一定不要去！子常也是没脑子，阴着杀人的武器能放在门口吗？费无忌还另外添了把火，说这次打吴国本来可以取得更大的胜利，是郤宛受了贿赂而回来，又贻误了将领们，让他们退兵，说“乘人动乱而进攻，不吉祥”。吴国乘我们有丧事，我们乘他们的动乱，不也是可以的吗？令尹让人到郤氏那里看动静，就看到有皮甲和武器在门口。令尹不去郤家了，便召见鄢将师并把情况告诉他，鄢将师退下，就下令攻打郤氏，并且放火烧了他的家。郤宛听到消息，就自杀了，除了儿子伯眊逃跑外，“尽灭郤氏之族党，杀阳令终，与其弟完，及佗，与晋、陈，及其子弟。”《左传译注》郤宛、阳令终和晋陈三家被灭族，可谓惨绝人寰。


    虽然，对搞阴谋诡计骗人的人防不胜防，但只要留心观察、思考，还是能看出破绽的。对找上门的“好人”为你做“好事”，要问几个为什么，害人之心不可有，防人之心不可无。要透过现象看本质，找到他这样做的目的，反其道而行之，不跌入他设计的坑，事情的发展就会有利于自己了。


    ## 帝王术 4 大要点历史帝王无一不精


    古来的智士想要扬名、立业、建功、上位，途径相当有限，“将身货与帝王家”几乎是不二的选择。如此一来，除非他们甘冒极大的风险去造反夺权，不然的话，赢得帝王的赏识才是一条相对稳妥的出路。危则能使之安，安则能使之强，强则能使之霸，许多时候，只须提供幻觉和假象就行，一旦龙颜大悦，智者何求不获？很显然，他们想美梦成真，就不仅要具备灵活机敏的头脑、三寸不烂之舌和回春妙手，而且必须将帝王学修炼到炉火纯青的程度，方可闪亮登场。


    帝王学，更准确的名称应该是帝王术。任何人文之“学”都讲求格物致知，悲天悯人，有定法、定则、定理、定律可供众人寻绎，多多少少总得包含些终极关怀。“帝王术”注重的却是达变通权，审时度势，扳倒对手，折损敌方，为达目的，不择手段，没有定法、定则、定理、定律可供众人寻绎，它的工具理性冰冷彻骨。说白了，帝王术只判明得失利害，不辨别是非曲直；只在乎胜负输赢，不顾及礼义廉耻；它是中国土生土长的马基雅维利主义。


    关于“帝王学”，唐浩明先生的判断值得我们参考：“其中最重要的内容有帝王如何驾驭臣下，权臣如何挟帝王以令群僚，野心家如何窥伺方向，选择有利时机，网罗亲信，笼络人心，从帝王手中夺取最高权力，自己做九五之尊。”


    帝王学的尖端技术在于“借权”，其巅峰表现是“挟天子以令诸侯”，权力久假不归，傀儡戏的牵线人便走上前台。


    ### 一、修炼帝王学的“四要”


    修炼帝王学，要在“明目”。智者静观天下大势，捕捉要点和重点，透析疑点和难点。诸葛亮《隆中对》预言天下鼎足三分，充分显示了这位青年才俊惊人的眼力。曹操将汉献帝玩弄于股掌之间，随时可以颠覆汉室，却迟迟不肯篡位，也是看出火候未到，不宜操之过急。智者师心自用，最忌走眼，若见识不明，鉴人不准，则很可能痛失好局。


    修炼帝王学，要在“下心”。大头领礼遇奇才异能之士，竭诚网罗天下英雄豪杰，方能使勇者奋其力，智者竭其谋，愚者搏其命。汉高祖刘邦、明太祖朱元璋均发迹于卑微，他们能一统江山，成就帝业，礼贤下士的高光表现起到了决定性作用。


    修炼帝王学，要在“利口”。“一言兴邦”、“利口覆国”这样的成语透露了个中信息。有人说：“一支笔，抵得过三千毛瑟枪；三寸之舌，重于九鼎之宝；一人之辩，强于百万之师。”智士修成利口，舌灿莲花，天衣无缝，其大忽悠就无往而不利。


    修炼帝王学，要在“辣手”。开国之君登基之后，就忙着剪除功臣，用铁扫帚收拾老伙计。他们打江山时礼贤下士，坐江山时翻脸不认人，这正好体现了帝王学的诡异莫测之处，术随时变，法无定法。须知，他们打江山时成功优先，坐江山时安全第一，彼一时也，此一时也，不可同日而语。


    ### 二、找准了对象即找准了方向


    范蠡和文种都是智者中的智者，他们看准勾践是位能够成就霸业的英主，故而为之效命，即使勾践战败失国，仅存五千甲士，困居会稽，卧薪尝胆，受尽屈辱，他们仍然不离不弃。勾践采取范蠡的方略，“十年生聚，十年教训”；运用大夫种的“九术”，培元固本，秣马厉兵。二十年后，他胜算在握，向吴王夫差摊牌，彻底洗刷失国之耻，夷平姑苏，称霸诸侯。范蠡、文种看不起威风八面的吴王夫差，却看得起失国忍辱的越王勾践，他们不买“大妖股”，却满仓“ST
    股”，最终功成名就，足见眼力不凡。


    公孙鞅在魏国只是相国公叔痤的家臣，公叔痤临死前将他推荐给魏惠王，说是若不用则杀之，以绝后患。魏惠王是个典型的草包，竟把公叔痤的遗言当成笑话。秦孝公志存霸业，重用贤才，公孙鞅闻讯后赴秦面试，先以帝道、王道试探，不进油盐，终以霸道见用。君臣相契，富国强兵，秦国遂以僻远之国一跃而为群雄之首。公孙鞅因封地在商於而被称为商君、商鞅，实堪称中国历史上的头号改革家。


    苏秦、张仪是鬼谷子的得意门生。鬼谷子是纵横家的鼻祖，他的学说讲求“捭阖”“反应”“忤合”“揣摩”和“权谋”，这无疑是帝王学的标准胚胎。


    苏秦、张仪学成下山，从理论到实践，举步维艰，在事业上均遭遇挫折。苏秦先去游说身价大跌的周显王，不灵；再去游说秦惠文王，还是不灵；旅费用完了，黑貂皮大衣上的毛也磨光了，苏秦踌躇于咸阳街头，就像一片秋风中惆怅的落叶；他落魄潦倒，惭愧回家，妻子不肯正眼瞧他，嫂子不肯给他做饭。


    张仪在楚国的处境也好不到哪儿去，他在楚国令尹家做客，却被怀疑为窃贼，一顿拳脚后，满地寻牙。如此惨状，他非但得不到妻子的同情，还受到冷嘲热讽，但张仪的幽默感超强，他让妻子看看他的三寸不烂之舌在不在，只要舌头安然无恙，希望就能仍能茁壮成长。


    失败是成功之母，苏秦以合纵策略说服了燕文侯，一旦芝麻开门，他就因势利导，相继说服赵肃侯、韩威侯、魏襄王、齐宣王、楚威王，组成六国军事联盟，对抗强大的秦国。苏秦下得最妙的一步棋是故意当面折辱师弟张仪，然后暗地里派人将张仪护送到秦国，为他铺平道路，张仪果然没辜负苏秦的厚望，成为了秦国的丞相。


    师兄合纵，师弟连横，一个“做多”六国，一个“做空”六国，双簧好戏，热闹非凡，荣华富贵都成了他们的囊中之物。两人威风八面，张仪的表现尤其出色，竟可以收到“一怒而诸侯惧，安居而天下熄”的奇效。


    儒家学说堪称广义的帝王学，然而孔子周游列国，四处碰壁，惶惶如丧家之犬；孟子游说梁惠王和齐宣王，也是对牛弹琴，以失败而告终。


    春秋战国，礼崩乐坏，王道滞销，霸道横行，儒家学说力主仁义，不被诸侯、诸王待见待听，完全合乎逻辑。汉朝初期，与民休息，主张清净无为的道家学说占据上风。


    及至汉武帝，其做大做强的雄心昭然若揭，董仲舒把握时机，以天人感应酱制儒家学说，极合汉武帝的胃口，从此“罢黜百家，独尊儒术”，两千余年，独沽一味。儒家学说被反复改造，理所当然地荣升为正牌的帝王学，孔子、孟子被捧为至圣、亚圣，文庙里的冷猪头肉便很少断供。


    ### 三、风险难以把控


    为学不精，难以成才;持术不慎，危及性命。


    帝王学是一柄见血封喉的双刃剑，操持帝王学的顶尖高手乘时而起，顺势而为，确实能够称帝封王，出将入相，但很多人无法把控其风险，往往死无葬身之地。


    修炼帝王学能全身而退的人少之又少，范蠡的表现特别值得称道。功成之日，他弃官远引，泛舟五湖，嗣后成为天下首富陶朱公，以聚财散财为乐事。他曾写信提醒好友文种：“高鸟已散，良弓将藏；狡兔已尽，良犬就烹。”可惜文种执迷不悟，殊不知，其“破吴九术”只用三术，尚剩六术，这正是文种的取死之道。


    待到越王勾践派遣使者送来那柄淬了剧毒的鱼肠剑，文种悔之晚矣。


    司马迁在《史记•商鞅列传》的结尾评议道：


    “商君，其天资刻薄人也。迹其欲干孝公以帝王术，挟持浮说，非其质也。其所由变臣，及得用，刑公子虔，欺魏将卬，不师赵良之言，亦足发明商君之少恩也。”商鞅能将秦国做大做强，可是他命保乏术，终被五马分尸。


    挟持帝王学以为利器，最终却以身殉道的高人，我们可以举出许多位：吴起在鲁则鲁强，在魏则魏强，在楚则楚强，最终却在楚悼王的尸体旁被乱箭射死。吴起要变法图强，势必与权贵为敌，一旦谗言四起，主子断气，他就没有活路。吕不韦立主定国，其政治献金所获得的回报极其丰厚，拜为秦国丞相，封为文信侯，食洛阳十万户，身为大臣，富贵已极。然而一招（他将嫪毐送给赵姬做男宠）不慎，满盘皆输。李斯辅佐秦始皇统一天下，功勋盖世，算度无人能出其右，他设计害死师兄韩非，足见其手段狠辣。然而他贪恋富贵，竟与暴虐弱智的胡亥和阴险奸恶的赵高结盟，矫诏害死公子扶苏，风险失控之后，三族诛夷和秦朝灭亡的悲剧就铁定上演。晁错是汉景帝信任的智囊，他的削藩主张乃是正确的国策，七国举兵，以清君侧为借口，死对头袁盎一言，晁错即沦为替罪羊和冤死鬼。景帝深惜之，尚且如此，遑论其他。


    伴君如伴虎，玩火必自焚。帝王学是一柄淬毒的双刀剑，它见血封喉，既能伤人，也能伤己，风险极难把控。


    ### 四、帝王学死而未僵


    晚清文豪王闿运一生修炼帝王学，欲做帝王师，可是他费尽口舌，也没能说服曾国藩，以湘军覆清，取而代之。其弟子杨度急功近利，颇有“一舞剑器动四方”的气概，曾致书友人，大言不惭：“余诚不足为帝王师，然有王者起，必来取法。”1903年，章太炎被囚禁于上海西牢，写诗讥讽杨度，其中两句为“长策惟干禄，微言是借权”，就是嘲弄杨度操持帝王学，哭着喊着要报效清廷，其实打的全是个人的如意算盘。


    民国初期，杨度将帝王学包装成光鲜无比的君主立宪论，孤注一掷，牵头成立筹安会，为袁世凯称帝摇旗呐喊。杨度昧于时势，异想天开，他认为袁世凯能够成为德皇威廉一世、日本明治天皇那样雄心勃勃的有为明君，他可以效仿铁血宰相俾斯麦、伊藤博文，成就一番伟业。为了捞足政治资本，杨度擅自在劝进书上代恩师签名。


    王闿运年逾八旬，却并不糊涂，在大是大非的问题上，他劝杨度不可犯下常识性错误：“若先劝进，则不可也。何也？总统系民立公仆，不可使仆为帝。”王闿运致信袁世凯，也婉言劝导后者打消称帝魔念：“但有其实，不必其名。四海乐推，曾何加于毫末？”袁世凯正在乐颠颠地试穿龙袍，这种逆耳之言，哪里听得进去。


    王闿运崇尚风骨远胜过重视利禄，就算他要兜售帝王学的“老锅底”，也绝对不肯沿街叫卖。袁世凯得陇望蜀，欲壑难填，王翁视之为一介鄙夫。后来，王闿运出任过国史馆馆长，不足一年，即自劾离任，挂印南归。


    杨度是一位刚愎自用的政治操盘手，他走的是一条黑路，一条通往坟场的路，一条通往地狱的路。尽管这位虎禅师抱有“我不入地狱，谁入地狱”的道德勇气，但与地藏菩萨的宏愿“地狱未空，誓不成佛”毫不相干，最终他沦为了洪宪丑剧中的“扛尸人”，可晒复可悲。


    诚然，帝王学与世界潮流背道而驰，它代表不了先进文化的方向。有人说，这门昔日的显学早已过气；有人说，帝王学死而未僵。不管怎样，它要借尸还魂，绝对千难万难。


    ## 帝王术任用、敛财背后的目的


    公元 755 年，唐朝发生了安史之乱，经过这场战乱，可纳税的人口数量减少，财政吃紧，为扭转财政亏损局面，需要另辟途径，寻找税收来源，所以唐玄宗就任用了第五琦，整顿财政。


    为了驱散全国政治上架的乌云，应急眼下战事所需的军费，第五琦全面垄断盐业，把食盐的生产、运输、销售全部收归朝廷，对私煮私卖食盐者进行定罪。


    可是，盐价大涨，当然，客观上也增加了朝廷的收入。另外，官府垄断盐业，还造成各个环节的腐败行为，使官营的盐业收入流入私囊，不能很成功地增加朝廷收入。


    这个时候，国家又利用刘晏，制定新的盐法政策，与第五琦的盐法相比，由官收、官运、官卖，变成了官收、商运、商卖。食盐的生产、收购、储存等方面还是由官府把持，由官方掌握食盐价格，然后卖给商人，由商人们去运送和销售他处，如此就减少了食盐运销方面的官吏，减少了人力成本，相应地也就减少了政府在运输、销售方面的开支和费用。同时还减少了腐败行为，提高了效率。又由于利润的刺激，商人会把食盐行销到全国各地，甚至是较为边

