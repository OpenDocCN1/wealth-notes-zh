  mdcn: '

    ![](img/d52f43ea52294dd9949052def724b433_21_0.png)


    打个比方：


    如果3个相邻的碱基是ATG，对应的就是一个氨基酸；


    如果是AAG，那对应的就是赖氨酸；


    如果是6个碱基，ATG AAG连起来，对应的就是一个氨基酸，后面连一个赖氨酸。


    就这么简单。


    不管这一段DNA分子是扭曲还是拉直，是在活动还是锁死，碱基分子之间的先后顺序是不会发生变化的，永远都是ATG AAG。所以，它所携带的信息也是不会变化的，对应的永远就是这两个氨基酸连在一起。


    这就像是你抄写一篇文言文，不管你是钢笔抄还是铅笔抄，是横着写还是竖着写，是顺着抄还是倒着抄，从单位信息复制和传递的角度，你做的事情是完全一样的。


    这样一来，任何一个三维空间里复杂的蛋白质分子，它的全部信息，也就是它所有氨基酸分子的排列顺序，都可以被记录在一条一维线性的DNA分子长链上。


    那为什么复制一根一维线性的分子，比复制三维分子机器要容易得多呢？


    如果你还有点迷糊，那我就再打一个比方：


    想要精细地复制一个蛋白质，就像是你给一台机器，让它反向工程。先把机器里面每一个细节都搞清楚，然后再从无到有地制造出一个完全一样的机器，因难度可想而知。


    但是复制DNA就像是给你一本机器的制造手册，只要你每个字符都抄对，手册里的信息就是完好无损的，这当然就简单多了。


    这就是我所说的降维打击的概念。有了这个概念，我们就可以设计出生命的2.0版本。


    在这个版本上，除了执行具体生命活动任务的蛋白质分子机器，还有一套忠实记录这些分子机器制造信息的DNA分子。


    在生命2.0需要自我复制的时候，它就不需要去操心三维尺度的复制问题了，它只需要复制一维尺度的DNA分子就可以了，所有的遗传信息都在DNA分子上。


    生命完成自我复制以后，在它的子孙后代的身体里，这条DNA分子就可以按照3个碱基对应1个氨基酸的规则，重新制造蛋白质分子机器，新的生命就可以照常运转了。


    其实，DNA分子作为遗传信息的载体，不光能够实现降维打击，而且还有两个别的好处。


    首先是精确性。DNA复制的时候，精度是非常高的，高到复制10亿次才会出错1次。这就像是为了遗传信息能够很可靠地代代相传，而偶然出现的错误呢，恰好又能给生物的变异和适应环境提供可能性。


    其次它很节约，DNA存储信息的效率是非常高的。我提到过，DNA记录信息的方法是3个碱基对应1个氨基酸。你可能会觉得奇怪，为什么一定是3个碱基，不是2个碱基或者4个碱基呢？这里面的道理非常有意思：


    刚才我说过，碱基分子一共是4种，而氨基酸分子一共是20种。我们可以计算一下下怎么编码效率最高：


    - 1个碱基对应1个氨基酸是不够的，因为这样一来，4个碱基也就只能代表4种氨基酸；

    - 2个碱基对应1个氨基酸也不够，因为两个碱基的排列，一共只有4的2次方，也就是16种组合，还不够20；

    - 而3个碱基对应一个氨基酸就绰绰有余了——3个碱基可以产生4的3次方，一共64种组合，要比氨基酸的数量大，还提供了几点冗余；

    - 而如果再去计算，要是4个碱基对应1个氨基酸，那么就会产生4的4次方，共256种组合，这就比氨基酸的数量大了一个数量级，显然是一种浪费。


    | 氨基酸 | 蛋白质 | 组合数 |

    | :---: | :---: | :---: |

    | `[1碱基]` -> `[氨基酸]` -> `[蛋白质]` | 1 | |

    | `[2碱基]` -> `[氨基酸]` -> `[蛋白质]` | 16 | |

    | `[3碱基]` -> `[氨基酸]` -> `[蛋白质]` | 64 | |

    | `[4碱基]` -> `[氨基酸]` -> `[蛋白质]` | 256 | |


    所以，地球生命在用DNA分子记录生物遗传信息的时候，使用的编码原则是恰好够用，但是也不浪费。


    实际上今天也确实有人在试图研究如何用DNA分子来记录人类世界的海量信息，这个方法的存储效率比硬盘和U盘都要高不少。


    总结一下，生命用了一个非常巧妙的方法解决了自己复制的难题，我形象地把它称作DNA的降维打击。在我看来，这是生命繁衍精妙的秘密，也是关于生命最值得收藏的秘密。欢迎你把这个讲分享和你一样热爱生命的朋友们。


    那么接下来，DNA分子在技术层面上是怎么完成复制的？特别是在地球生命出现的早期，生命形式还非常简单，但是遗传信息复制是个非常精密、复杂 的任务，我们的祖先们是怎么做到的呢？


    下节课，我会展开探讨这个看起来不可能完成的任务。


    ## DNA的降维打击


    > 一维的DNA分子，记录三维的蛋白质信息，大大简化了遗传信息记录和复制的难度。这就是关于生命最值得收藏的秘密。


    ![](img/d52f43ea52294dd9949052def724b433_21_1.png)


    王立铭 · 生命科学50讲


    换句话说，沃森和克里克提出双螺旋模型，实际上或多或少有一点偷窃富兰克林工作成果的嫌疑。而且更可惜的是，DNA双螺旋结构虽然获得了诺贝尔奖，但是富兰克林本人却因为卵巢癌，在颁奖的五年前就英年早逝了。


    所以很多人都猜测，如果富兰克林能活得足够长，最终，是谁站在诺贝尔奖的领奖台上就不一定了。


    当然，在生命本质的科学探讨上，究竟谁发现了DNA双螺旋，其实无关紧要。重要的是，这个双螺旋结构提示了生命自我复制的秘密，更重要的是，这个秘密居然能被人类智慧和科学研究逐步揭示。这一点值得我们每个人骄傲。


    好，现在你知道DNA在技术上是怎么实现自我复制的了。双螺旋结构让DNA通过半保留复制的方式，实现自我复制。


    说到这里，我想给你提一个挠头的问题：**DNA是怎么解开螺旋，完成半保留复制的呢？**


    之所以说这个问题很挠头，是因为DNA分子在化学性质上是一个很稳定，很有惰性的分子，不容易和其它的物质发生反应。


    这个属性其实也不奇怪，甚至应该说是非常合理的。


    作为生物遗传信息的记录载体，**DNA越稳定，记录的信息也就越精确，越持久。**它要是总能随便和环境中的物质发生反应，这样的东西是没法作为遗传信息的稳定载体的。


    但是相反，既然DNA如此稳定，你就不能指望它自己能随便便解开螺旋，完成遗传信息自我复制的整个过程。


    **也就是说，要实现DNA复制，必须有帮手帮助它解开螺旋，完成配对，形成两个新的双螺旋。**


    这些帮手是谁呢？特别是在生命起源的时候，在DNA刚开始执行遗传信息载体的使命的时候，谁来帮助它完成复制呢？这是一个特别有意思的问题，下一讲，我就会回答它。我们下讲见。


    **DNA双螺旋结构一揭晓，科学家们马上就推测出DNA分子是怎样完成自我复制的。这一点，才是DNA双螺旋结构被看成现代科学智力巅峰的原因。**


    ![](img/d52f43ea52294dd9949052def724b433_22_1.png)


    # 13 | 自我复制的实现：DNA双螺旋


    ![](img/d52f43ea52294dd9949052def724b433_23_0.png)


    你好，我是王立铭，欢迎来到生命科学50讲。今天我们继续讨论DNA分子，看看DNA分子在技术实现上是怎么自我复制的。


    上一讲，我知道生命自我复制的时候，采用了一种很巧妙的方式——降维打击。但是话说回来，我们知道自我复制在生理上是这样实现，不代表我们知道它技术上是怎么进行的。


    这个技术问题直到1953年才开始得到解决。


    那一年，两位生物学家——詹姆斯·沃森（James Dewey Watson）和弗朗西斯·克里克（Francis Harry Compton Crick），提出了DNA的双螺旋模型，DNA复制的具体过程才开始慢慢浮现。


    这一讲，我就带你们来看到达到是怎么回事。


    ## DNA双螺旋结构的发现


    双螺旋是个什么样子呢？简单来说，我们可以把DNA看成一条由一堆堆碱基组成的长字符串，每一碱基都是ATCG四种碱基分子之一。


    这四种碱基分子大小和化学性质不一样，所以彼此会间形成非常特殊的配对关系：A总是会和T配对，C和G总是配对。


    这样你可以想象，如果两条DNA分子上面的碱基顺序，恰好能够一一配对，那么这两条长线程就平行地结合在一起，样子就有有点像我们常见的梯子。梯子两条边就是两条长的DNA分子，梯子的每一级台阶，那就是A和T，C和G这样的配对。


    ![](img/d52f43ea52294dd9949052def724b433_23_1.png)


    在生命体内，这样一把长梯子可以很紧，会自己拧成一个右手螺旋。现在，你可以跟我一起试试，伸出你的右手，四指并成束，大拇指向你的右侧，大拇指指向的方向，DNA双螺旋的前进方向。你那根手指向的，那就是DNA双螺旋转的方向。


    这就是DNA双螺旋大致的样子，你可以看看下面这个DNA双螺旋的示意图。


    ![](img/d52f43ea52294dd9949052def724b433_23_2.png)


    不得不说，DNA双螺旋结构的发现，是现 代科学发展的重要里程碑。很多时候，它都会被当成现代科学，甚至是整个人类智慧的标志，出现在图书、科技馆、产业园，甚至是科学新闻里面。


    你可能会有一点不理解，DNA双螺旋结构的发现有那么重要吗？既然DNA存储信息的方式可以看成是一维的，那就不是说，不管DNA分子到底多扭曲，怎么形成双螺旋，都不会影响它上面携带的信息吗？区一个DNA双螺旋结构有什么了不起的呢？


    其实，DNA双螺旋的价值还是有的，在这里，我稍做几个科普：


    在20世纪上半叶，特别是三四十年代的时候，实际上已经有充足的科学证据证明DNA分子就是真的遗传物质。但是必须说，那个时候至少在科学共同体内部，对于这个结论的接受度非常低。


    原因就在于当时的生物学家很抽象，一个由ATGC这种碱基分子串起来的长链，到底怎么执行存储遗传信息，完成自我复制功能的。


    直到五十年代，英国人罗莎琳·富兰克林（Rosalind Elsie Franklin）通过x射线衍射的方法，揭示了DNA分子的三维结构，沃森和克里克在此基础上提出了双螺旋模型。这个对得起大家才恍然大悟，原来自我复制的秘密就隐藏在这里。


    也许你还没听说过，没关系，我来多解释几句。


    刚才我说了，双螺旋结构的核心，就是两条DNA链，根据A和T配对，C和G配对的原则，首尾相连在一起，然后拧成一个麻花。


    这样一来，一条链上如果出现A，和它相对的那条链必然是T。以此类推，一条链上如果是C，另外一条链上也必然是G。


    这样看的，两条DNA链虽然碱基的组成和顺序不同，但是他们携带和编码的信息是完全一致的。因为只要一条链是AAA，你就知道另一条碱基只能是TTT，在信息层面上可以完成实时的替换。


    换句话说，DNA双链，本质上是信息完全一致的两个拷贝。


    ## DNA的半保留复制


    这样一来自我复制实现起来就非常容易了。既然碱基之间是完全配对的，那两条链完全可以在DNA分子需要完成复制的时候，从中分开，一分二。


    然后，每条DNA链都可以继续根据碱基配对的原则，结合上一堆新的碱基分子，重新形成两条完全一样的DNA双螺旋。


    ![](img/d52f43ea52294dd9949052def724b433_23_3.png)


    打个比方，如果原本的DNA双螺旋是AAA和TTT，在自我复制的时候，AAA和TTT链就会解开双螺旋彼此分离。


    AAA链上可以再次按照碱基配对原则，结合上去三个T。


    TTT链上，也可以结合上去三个A。


    这样一来，原来的一个双螺旋就变成了两个完全一样的双螺旋。生物遗传信息的自我复制就完成了。


    在这个过程中，每一条老的DNA链，都会用来指导一条新的DNA链的合成，每一条新形成的DNA双螺旋里面，都有一对旧的链和一条新的链，这个过程有一个很形象的名字，叫半保留复制。


    DNA双螺旋结构一揭晓，沃森和克里克马上推测出了这个过程，预测出DNA分子作为遗传信息的载体，就这样完成自我复制的。而这一点，才是DNA双螺旋结构被大家看成是科学发展的划时代的原因。


    我再提个八卦。今天说到DNA双螺旋，可能很多人都会听说沃森和克里克的名字，甚至有有时候，双螺旋会被直接叫做沃森-克里克螺旋。但说实话，从DNA双螺旋被发现到到今天半个多世纪始终都存在不少争议。


    比如，我刚才说到，真正利用x射线衍射技术，获得DNA结构图，实际上是英国科学家富兰克林。而且富兰克林，沃森和克里克看到的是那张DNA结构图，是富兰克林的同事，但是你们看图这件事，没有得到富兰克林本人的允许。


    # 14 | DNA复制的两大难题


    ![](img/d52f43ea52294dd9949052def724b433_24_0.png)


    你好，我是王立铭，欢迎来到生命科学50讲。


    这节课，我会向你抛出自我复制的两大难题。这两个难题看起来关系不大，但是非常有意思的，一项重要的科学发现，竟然一举解决了这两个难题。


    对这两个难题的思考和解决，把对我自我复制问题的理解推进到了一个更高的层次，而且还对生命起源的问题多了一层新的理解。


    ## 先有DNA，还是先有蛋白质？


    咱们来先看看第一个难题：在生命诞生之前，蛋白质和DNA这两种非常重要的物质，到底是谁先出现的呢？


    上上讲我说过，DNA是一种化学上很“懒惰”的分子，它光靠自己是不可能完成自我复制过程的。


    它解开双螺旋，完成碱基配对，形成新的螺旋，整个过程中肯定需要很多“帮手”，而它的“帮手”就是蛋白质。


    这一点倒是不奇怪，因为蛋白质就是分子机器。具体来说，在自我复制的过程中，DNA需要很多种蛋白质的帮助，比如：


    - 叫解旋酶的蛋白质，帮它解开双螺旋；

    - 叫引物酶的蛋白质，在DNA链上设置一个自我复制的起点；

    - 叫DNA聚合酶的蛋白质，把单个碱基搬运过来，装到新的DNA链。


    可想而知，这个过程是非常复杂的。


    ![](img/d52f43ea52294dd9949052def724b433_24_1.png)


    换句话说，一个生命体想要利用DNA作为遗传信息的载体，光有DNA是远远不够的，它还需要同时准备大量的蛋白质分子来完成DNA复制，两者都非常重要，而且需要相互配合。


    但这样一来，就出现了我所说自我复制的第一个难题：先有DNA，还是先有蛋白质？


    这个怪问题想起来挺麻烦的，有点像“先有鸡还是先有蛋”的问题。鸡就是DNA分子，蛋就是蛋白质分子。


    如果假设没有鸡，也就是先有DNA，那么因为DNA分子化学上非常稳定，所以这只鸡什么事儿都干不了，只能慢慢地在环境里降解。


    反过来说，如果假设没有蛋，也就是先有蛋白质分子，它可以做很多事。比如推动生物化学反应，或者像ATP合成酶那样制造能量货币。


    但是我们也已经讨论过了，蛋白质具备非常精细的空间结构，如果没有DNA作为媒介，是很难被复制的。


    所以，如果只有蛋白质分子，那么这些蛋白质分子只能执行一段时间的功能，之后很快会降解消失，没办法留下后代。


    顺着这个思路再推进一点，切赫发现的其实是一个不是鸡也不是蛋，即既像鸡又像蛋的东西，切赫给这个新物质命名为“核酶”。


    也就是说，核酶既是核糖核酸RNA，能记录遗传信息，同时又很像一个蛋白质酶，能切割和拼接自己。


    ![](img/d52f43ea52294dd9949052def724b433_25_0.png)


    这个发现本身解决的当然是个具体的生物学问题，也就是RNA剪接如何发生，但是这在逻辑上太重要了。因为这个既像鸡又像蛋的东西，首先就解决了“先有鸡，还是先有蛋”这个很挠头的问题。


    你可以想象，在地球生命起源的早期，有可能就是这种RNA分子，独立承担了今天分别属于DNA和蛋白质的功能：既能实现信息的存储和复制，又能催化各种各样的生物化学反应。


    这样，我们就不需要假设在生命起源的早期，DNA和蛋白质一定要同时出现，而且必须完美配合的问题了。由此，生命起源在概率上变得更更容易了。


    同时，我们还可以想象，在生命起源之后，伴随着生物演化，地球生命越来越精巧和复杂，RNA承担的两个职责分别被转移出去了：


    - 承载遗传信息的职责，转移给了更稳定、更精确的DNA；

    - 推动生物化学反应的职责，转移给了更强大、高效的蛋白质。


    这样一来，RNA就彻底退居二线，只在DNA和蛋白质二者间作为桥梁存在，有点像生物演化留下来的遗迹，比如人的阑尾和男人的乳房。


    这刚好又回答了第二个难题，也就是为什么在今天的地球生命里，RNA这个“第三者”存在的原因。


    两个难题居然就这样被一举解决了。


    正因为这个发现如此重要，几年之后，切赫就获得了诺贝尔化学奖。


    下一讲，我会更深入地告诉你切赫到底是怎么发现核酶的，这是一段非常精彩的科学故事。


