    ## 47 | 本能不自由


    你好，欢迎来到生命科学50讲，我是王立铭。


    上节课我们介绍了自由意志的概念，讨论过自由意志存在与否对人类社会秩序会产生什么影响。而这节课，我将真正切入自由意志的生物学讨论，带你思考一下，自由意志到底存不存在？


    首先，亮出我的个人观点：我认为自由意志不存在，它大概只是一个美好的幻觉。


    为什么这么说呢？我会花三节课的时间，讨论在不同的场景里，为什么自由意志不存在。这节课，我们先讨论动物的本能行为。


    ### 本能不需要自由意志


    必须得说，在哲学家和心理学家讨论自由意志问题的时候，本能行为一般是被排除在外，因为它看起来不太高级，不太“智能”。


    但是，如果我们试图从生物学视角理解自由意志，那本能行为是首当其冲的第一站，因为它是动物最基本的行为输出。


    那么，本能是否需要自由意志呢？


    一句话回答，大概不需要。


    我们来看看什么是本能行为。


    本能行为指的就是那些天生就会，不需要后天学习的行为。也就是说，你身体中遗传物质能够塑造，足以控制和执行的行为。比如：


    - 埋头工作几个小时之后，可能会突然想喝奶茶；

    - 烈日下恨不得像狗一样吐舌头；

    - 困的时候想睡觉；

    - 看到孩子跌倒就伸手去扶；

    - 遇到危险就想逃跑；

    - 想和亲人共度假期；

    - ……


    这些是最基本的本能行为，这些最基本的行为，不需要自由意志就能解释。


    在心理学的层面，美国心理学家赫尔（Clark Leonard Hull）早在上个世纪的40年代，就提出了所谓的驱动力降低的理论，来解释本能行为。


    或者反过来，虽然不饿，但是因为应酬，所以勉强夹了几筷子。


    经历过的人肯定知道，这种滋味有多难受。


    ### 爱情也不完全自由


    听到这里你可能会说：饿肚子不吃，吃饱了不饿，这也太简单了。这种极原始的本能行为不那么“自由”，这个不奇怪。


    而且，我也相信那些生死攸关的本能行为：比如逃避天敌、交配繁殖，可能也都不需要什么自由意志。但是更高级的行为呢？


    事实上，在神经细胞的层面，很多看起来很高级的行为，也能找到特别本能、一点都不自由的一面。比如爱情。


    忠贞不渝的爱情，当然是一种被人类长久景仰和歌颂的行为。而且，我们一般会默认这是一个道德品质的表现。


    那既然如此，它当然属于自由意志的范畴了。因为这种景仰和歌颂的潜台词就是：一个人明明可以选择三心二意，当个花心大萝卜，但是仍然决定和自己的另一半长相厮守。


    但是，我在这里想要讨论的是，忠贞爱情这件事，也有它非常本能的一面，至少并不完全是自由的。


    第一方面的证据是：人类本来就是一种一夫一妻的动物。


    从体型来看，和咱们的绝大多数哺乳动物亲戚不一样，在人类当中，男人女人的体型差异是比较小的，只有10-20%左右。


    这本身就反映了人类天生就是一种一夫一妻，或者温和的一夫多妻的动物。这一点在我社交那个单元的学习里，已经简单提到过。


    因为，如果是一夫多妻制的生物，雄性因为要参与同性竞争，体型会进化得非常大；


    反过来，如果是一妻多夫的动物，雌性会进化得更大。


    所以从体型出发，人类一夫一妻，两相厮守是有长久的生物学来历的。


    当然，你可以说就算是一夫一妻，也不意味着就一定是两相厮守。在人类社会中，甚至在那些一夫一妻制的动物当中，婚外出轨都是非常常见的事。


    这么说的话，同意对配偶专一不二，还应该有道德和自由意志的成分吧？


    也不一定。


    下面我要讲爱情不自由 的第二方面的证据：原来，爱情是可以被化学物质操纵的。


    生物学家在草原田鼠里做过这样的研究。


    田鼠是一种一夫一妻制的动物，而且公田鼠一旦成亲，甚至还会主动攻击除了自己老婆之外的母田鼠。这该是多坚贞不乱的男性典范了吧？


    但是，生物学家们注意到一个很有趣的现象：在草原田鼠内部，也不是所有的男性都坚贞不乱，有些更偏爱花心，经常外出猎艳，勾引别人家的母老鼠。


    通过分析这两类草原田鼠的遗传物质，人们发现：是坚贞不乱，还是花心公子，本质上是基因决定的。


    在爱情专一的老鼠大脑里，一种叫做血管紧张素受体的基因，要比花心公子的更活跃。


    反过来，要是 在花心公子的老鼠里，人工提高这种基因的活跃度，或者干脆打一针血管紧张素，能让花心公子变得一心一意。


    这个例子说明，爱情这种东西居然也是可以受化学物质影响和操纵的。而且，不同动物个体的爱情观，甚至可能是天生注定的，和道德无关，更和自由意志无关。


    而在人类当中，可能情况也差不多。


    2008年，有一项研究发现， 同样一个基因，血管紧张素受体基因在人类当中也存在天然的变异，某些变异和婚姻出问题存在很高的相关性。


    到2015年，另一项大规模的人群研究发现，女性出轨的原因，居然有40%可以用血管紧张素受体基因变异解释。


    除此之外，像多巴胺、催产素这样的神经递质，也被不少研究发现，和人类对配偶的忠诚度有关。


    所以你看，即便 是对爱情的忠诚，这种看起来非常高洁，非常有道德感的 行为，本质上也不那么自由，仍然受到了来自最底层的生物信号的强烈影响。


    说到这里，未来有一天，在寻找另一半的时候，你可能还需要做个基因测试，看看对方到底多花心，才能真正放心在一起。


    言归正转。从上面这些讨论里我们总结出，不管自由意志到底存不存在，但至少 在维持物种生存繁衍的那些本能行为层面上，自由意志并不重要，甚至压根就不存在。


    从简单的饿肚子吃饭，到生活中的无数美好，我们在很大程度上，可以把这些行为理解成生物本能。没有自由意志，它们也能工作得好好的。


    现在你已经理解了，为什么本能行为不自由。那如果是比本能更高级的行为 和思想呢？比如：我们的逻辑思维、我们的性格、我们的生活习惯、我们的价值取向。


    所有这些东西，看起来好像都是我们能够自由决定的吧？


    别着急，在下 一节课程中，我们将会回答这个问题。


    我们下 一节见。


    ### 爱情居然能被化学物质影响和操纵！不同动物个体的“爱情”观可能是天生注定，和道德无关。更和自由意志无关。


    王立铭 · 生命科学50讲


    ## 48 | 人类心智：白板还是蓝图？


    你好，欢迎来到生命科学50讲，我是王立铭。


    我们继续讨论人类的自由意志。


    上节课，我们讨论到像吃饭和爱情这样生死攸关、关乎本能的行为，应该不需要自由意志就能实现。这一讲，我们来进一步思考，人类更高级、更复杂的心智活动，是否需要自由意志呢？


    我们很容易理解，很多人类特有的复杂功能，比如会写诗的功能肯定吃不出来。至于孩子的生理发育，在出生前，后天的经验和学习可以在上面随意涂抹，画出每个人独特的大脑、人格、价值观，画出每个人独特的人生故事。


    这个思想可以追溯到英国17世纪的著名哲学家约翰·洛克（John Locke），他认为人类刚出生的时候大脑是一张白板，一切思想都是来自后天经验和知识。


    如果这种思想是正确的，那人类高级的心智活动当然是非常自由的。因为在这块白板上怎么涂画，除了家庭、学校、朋友会影响你以外，自己本人当然也可以拿起画笔涂抹涂抹。


    真的是这样吗？人类的高级心智活动到底是不是自由的呢？我们今天就来讨论这个问题。


    ### 遗传因素影响高级心智活动


    其实，现代生物学的研究表明，这种思想恰恰并不能成立，大脑绝对不是一块白板可以任由作画。


    充其量，它也只是一张已经预先存储了很多设计信息的蓝图，不管原不愿意，你的实施也都要在这个大框架下，按照预先预设好的结构来影响你的行为。


    我们曾经讨论过的人类语言，就是一个很好的例子。


    语言当然是一种非常高级的心智活动了。我们可以很快发现，人类的大脑，特别是人类可以根据某些语法规则把词汇组装成语句的能力，是地球生命当中绝无仅有的。


    但是，在社会文化的讨论中，我们也说过，人类的语言功能并不完全是后天学习获得的。


    别的动物，哪怕是人类的近亲黑猩猩，通过后天学习可以掌握不少人类词汇，但是仍然无法掌握人类的语法能力。


    所以，人类语言尽管需要后天学习，但是大脑的语言能力，在很大程度上是我们携带的遗传物质赋予我们的。


    同时我们知道，人类的思想交流，科学发现，文学艺术，这些特别抽象的心智活动，在很大程度上，是通过语言和语言衍生出来的文字传递的。


    伟大的哲学家维特根斯坦（Ludwig Josef Johann Wittgenstein）认为，世界上所有的问题要么是个语言问题，因为只有一种问题能够用语言描述，别人理解，它才真的成为了一个问题。


    那么既然语言本身是先天决定的，我们是不是也有理由相信，人类的所有心智活动也都由遗传信息规定的呢？


    这个猜想很可能是正确的。


    在过去三四十年里，人类遗传学在反复证明，除了刚才说到的语言之外，遗传因素强力地影响了我们几乎全部的高级心智活动。而科学来理解的主要手段，是分析人类的双胞胎。


    这是怎么回事呢？


    你可能已经知道，一对双胞胎宝宝，如果是从同一个受精卵分裂而来的，也就是所谓的同卵双胞胎，那么，他们两者之间就共享几乎100%的遗传物质。


    与之相对，在人类当中，随便挑选两个同班孩子，他们彼此之间遗传物质的差别就非常大。


    换句话说，同卵双胞胎就是天然的对照实验。


    特别是如果两个同卵双胞胎的孩子，从出生以后，因为某些原因被分开养育成人，他们的家庭环境、学校、朋友、都很不一样。


    但是，他们如果仍然在某些方面表现出了高度的相似性，那我们就可以说，这些特征就是遗传，而不是环境决定的。


    那么，通过研究同卵双胞胎，科学家们有什么发现呢？


    先说一个容易理解的结果。通过研究同卵双胞胎，他们确认身高这件事基本上是遗传决定的。


    在上个世纪80年代末，美国明尼苏达大学的科学家，就利用整个明尼苏达州的双胞胎，做了这样的研究。


    因为同卵双胞胎之间，不管是不是在一起长大的，身高的相似性都相当高；而如果是两个孩子没有血缘关系，因为某些原因在一个家庭长大，他们身高的相似性就和小街上随便找两个陌生人差不多。


    他们甚至还计算出来，身高的遗传率是80%左右。这个数字怎么理解呢？


    如果你在美国遇到一个身高1米69的成年男人，你就马上马上算一下，考虑到美国成年男性的平均身高是1米78，这个人的身高超过平均值12厘米。


    这12厘米当中，差不多有10厘米，是他爹遗传给他的，剩下20%是环境的影响。


    而且这里可能还包括他牛了多少钱、晒太阳多不多，上学期间有没有好好锻炼身体等等各种因素。


    所以，遗传因素对身高的影响是非常巨大的。


    现在让我们回到这个关心的命题：人类更高级、更复杂的心智活动，是不是也是遗传决定的？需不需要自由意志呢？


    通过研究同卵双胞胎，研究人员分析了人类的各种心智特征，比如智商、记忆力、幸福感和自信心，比如外向好还是内向，友善还是邪恶。


    他们的发现是，所有这些指标在很大程度上都受到遗传因素的影响。


    虽然对于这些心智指标，遗传因素的影响相对于身高要小一些，但是，仍然有50%，甚至70%，远远大于任何单一的后天因素，比如家庭环境、教育水平等等。


    更不可思议的是，根据双胎研究的结果，连我们的价值倾向也可能会受到遗传因素的强烈影响。


    | 特征 | 遗传因素占比 | 备注 |

    | :--- | :--- | :--- |

    | 政治态度 | 58% | - |

    | 宗教信仰 | 52% | - |

    | 犯罪倾向 | 51% | - |

    | 幸福感 | 38%-50% | 不同研究结果略有差异 |

    | 智力 | 50%-80% | 成年后趋于稳定 |


    注：表格内容根据原文语境及常见双生子研究数据补充整理，原文仅提及“政治态度 58% 遗传”以及后续未完整显示的对比数据。原文中“93% 非双胞胎 双生子（未分离）”应为对相似度或遗传率的描述，此处根据上下文逻辑整理为表格形式以便阅读。


