    > > 在这里我要强调的是：动物分辨色彩的能力，是有天差地别的。


    很多哺乳动物，比如老鼠，它们能分辨的颜色就只有1万种左右；


    而鸟类的能力要强得多，比如鸽子，就能分到100亿种颜色，是人类能力的1000倍；


    还有一些生物，能看到人类眼睛完全看不到的红外线和紫外线。


    ![](img/d52f43ea52294dd9949052def724b433_49_0.png)


    所以你看，同样的地球，同样的太阳光，不同生物眼睛里的世界，至少从色彩上就可以非常不同。有的单调乏味，有的绚烂夺目，你能说谁看到的世界是真实客观的，谁的不是呢？


    **其实我们还不如说，每一种生物的感觉系统，能够采集到的仅仅是环境中很小的一部分信息而已。**


    第二个例子，对于同一个世界，同样的你，在不同的状态下，也会对它产生截然不同的感觉。


    比如，面对同样的食物，同样的时间地点，你对这种食物的感觉可以是完全不一样的。


    如果你特别饿，可能会觉得太好吃了；如果你刚刚吃得撑到饱，就会觉得食物的味道甚至让你反胃。


    换句话说，同样的味觉信息输入，当我们状态不同的时候，**在我们大脑中构造出的那一份虚拟饭菜，可以很不一样**。


    所以你看，**完全不同生物的感觉系统，可能感受到了完全不同的世界，就连同一个人，在不同的状态下，对世界的感知都是可以差别很大的。**


    感觉系统的存在，并不为了一丝不苟地刻画外部世界，而是为了方便、好用。所以，它会对信息进行取舍、筛选、扭曲和整合，然后创造出一个虚拟世界来。


    # 无法推翻的实验--缸中之脑


    也正是基于这一点，美国哲学家普特南（Hilary Putnam）在上世纪80年代的时候，提出了一个非常有名的思想实验——缸中之脑。


    他假设了一个场景：有一个疯子科学家，解剖了一个人的大脑，把它放在一缸培养液里，让他还能继续活着。然后用一台超级计算机，人工生成各种各样的感觉信号，再用微型电极把信号输入大脑的不同部位。


    ![](img/d52f43ea52294dd9949052def724b433_49_1.png)


    这样一来，这个大脑是不是仍然会觉得自己**的生活没发生变化**，根本意识不到自己是生活在水缸里，生活在虚拟现实里呢？


    结合咱们刚才对人体感觉系统的讨论，你就能发现，缸中之脑这个思想实验实际上是不可能被实验证实或者推翻的。这也是为什么，刚才我说到客观真实世界的时候，加了一个限定词——“所谓”。


    因为，**我们即使再反省自身，也无法在科学实验的层次上证明，我们每一个人都真实地生活在这个世界中，而不是一个浸泡在培养液里的大脑。**


    顺便插一句，缸中之脑这个思想，被很多著名的科幻电影用上了。比如《黑客帝国》和《盗梦空间》。


    在这两个电影里，故事发生的场景，实际上是主人公大脑中的虚拟世界。而这些主人公，在《黑客帝国》中是躺在培养世界里的人肉电池，在《盗梦空间》里则是被催眠进入沉睡的人类。


    ![](img/d52f43ea52294dd9949052def724b433_49_2.png)


    当然了，缸中之脑这个思想实验最大的意义，倒不是让我们怀疑人生，而是告诉我们，感觉输入这件事，特别是我们大脑对感觉信息的处理、整合和重建，对于智慧有多重要。


    总结一下，这一讲我们说了感觉对于智慧生命为什么那么重要，我们人类有哪些感觉，以及感觉是不是能反映真实世界。


    这一章，我们就好来好好谈感觉的生物学，我们一下讲见。


    我们即便再反省自身，也无法在科学实验的层次上证明：每一个人都真实地生活在这个世界中，而不是浸泡在培养液里的大脑。'
