    # # 12 | 自我复制的降维打击


    ![](img/d52f43ea52294dd9949052def724b433_20_0.png)


    你好，我是王立铭，欢迎来到生命科学50讲。


    上课咱们知道了自我复制，或者说繁衍，是比永生更重要的事情。因为有了自我复制，生命才经过五次夭折，战胜意外，适应变化，存活到今天。那么，自我复制这么重要的事到底是
    怎么实现的呢？今天，我就带你来看看自我复制的机密。


    # ## 蛋白质无法独立自我复制


    今天这节课可能有几 点烧脑，希望你能跟 紧思路。首先，我们来做一个思维体操， 在纸面上构造一个极端简化的生命，探讨一下生命自我复制的原理。


    这个最简 单的生命，应该就是一个蛋白质分子，我们给它 取名叫生命1.0。


    从前面的故事里你可以很轻易地想象，最 有资格入选的蛋白质大类就是ATP合成酶，因为它就是生命制造能量货币的。有了它，而它又工作得非常给力。当它， 它就为你制造ATP分子，然后
    用ATP来驱动各种生命活动了。


    但是问题来了：生命1.0——也就是ATP合成酶——几乎不可能实现自我复制。


    为什么呢？因为这个古老的蛋白质虽然 只 很小，只有几千纳米大，但是，它却 极其复杂。它的一个结构 极其复杂。它 有三个 叶形结构，一个普通的精密三维结构。在氢
    离子的推动下，这个微型发电机的叶片还 可以旋转不停，产生ATP分子。


    ![](img/d52f43ea52294dd9949052def724b433_20_1.png)


    这个机器里每一个原子排列的精确度 需要达到零点几个纳米的水平。空间位置 稍 错一点，化学性态改变一点，它就 法 工作了。而且它 它的时间精度也非常高，每一秒钟可以旋转上百次。


    所以你可以想象，要想完美复制这 个三维分子机器，对时空精度的要求那是非 常苛刻的。


    其实，别说 复制起来困难，就 是 要看 得清楚一些 都是 不容易。举个例子：


    在 上世纪90年代，英国科学家约翰·沃克（John Ernest Walker）利用X射线衍生的 方法，在三年之后就 对这个发现 获得了诺 贝尔奖。你可以想象，这是一个多么微
    小而精 的生命特性。


    ![](img/d52f43ea52294dd9949052def724b433_20_2.png)


    所以，从逻辑上说， 生命体 需要 一种方法，能更简单， 但是也 更精确地记录 和 复制自身。


    最好不要 让我们瞪大眼睛 去记录 和 复 制一个超 级复杂的三维结构，而且还得记录它 在 每个 时刻下，每一 点的空间信息，这样太 笨拙，也 太容易出错了。


    其实， 我们 可以回过头来 想想ATP合成酶的构造，看看会不会有启发。


    这个分子机器是由许多 个 蛋白质部件拼 装起来的。 加起来一共需要 五千多个氨基 酸分子，按照某种特定的 顺序组装。当然， 这个 组装过程不需要人类或者外部力量的
    参与，在三维空间 中，这些氨基酸彼此 吸引、排斥、碰撞，结合，能够自 己 形成复杂、动态的三维结构。


    ![](img/d52f43ea52294dd9949052def724b433_20_3.png)


    # ## DNA的降维打击 和两个优势


    那么，到 底怎样 才能设计一个 简单的 方法，把 五千多个氨基 酸的先后 顺序和 位置忠实地 记录 和 复制下来呢？


    不得不说，地球 生命想到一个 非常 巧妙的 方法。 我们可以举 一个流行的科幻小说名字——降 维打击——来 解释这件事。


    这个概念最早是来自刘慈欣的科幻小说《三体·死神滚水》。简 单来说，就是 生 命 简化 了 记录 和 复制的过程，把立体的、三维 空间 里的蛋白质信息， 记录
    在 了线性的、一维的DNA分子上面。


    那 这个过程具体 是怎 么 实现的 呢？


    这就需要 说到DNA这种物质的奇妙特性 了。DNA也 然 所以，中文 名字叫 脱氧 核糖核酸。 几乎 每个 地球 生命都依赖DNA 存储 自身 的遗传信息，用
    来指导 生命活动，实 现自我 复制。


    和 蛋白质一样，DNA也是 尺寸很 大 的生命物质。但它和 蛋白质不一样 的地方是，蛋白质在空间尺 度上 非 常复杂， 在时间尺度上又 很 灵活。


    而DNA 化 学性 质很简单， 并且是 一维 的，也 就是 线 性的。因此 它 进行信息 存储 和复制的 过 程就比 蛋白质简单 得多。


    为什么这么说呢？我们 先来看 看DNA长 什么样。


    ![](img/d52f43ea52294dd9949052def724b433_20_4.png)


    DNA的 化学 构 造 比 蛋白质简单。我们说 过， 蛋白质分 子 可以 看成 是20种氨基 酸分子 按照特 定的 顺序 首 尾 相 连 形成 的 肽 链，然后
    这 些 肽 链、 或者 几 条 肽 链 卷 在一起 缠绕、折叠、扭 曲， 形成 一个 有 立 体 形状的蛋 白 质分子机器，而这台 分子机器 如何 工作，
    完全 取决 于这个 三 维 形 态的细 部构 造。


    而DNA呢？它 是由4种 氨基 酸分子 构 成的 链。 顺 便 说 一 句， 这 4种 氨基 酸的 字 样 在中 学 生物 课 里 也 学 过，腺 嘌呤、
    鸟 嘧啶、胸腺 嘧啶 和 胞 嘧啶， 具 体 的 名 字 你 不用 记， 用A、G、T、C 这4个 英 文 母 来代 表 就行。


    那 为什 么 说DNA是 一维 线性 的 呢？在 生物 体内，DNA分子 当然 也有 三 维 结 构的， 也 是 会 发生 空 间 扭转 的。


    但 是， 变化 的 只 是 一 下 而 已， 管 它 空 间 结构 怎么 变，DNA分子 上面 所 携 带的 信息 是 恒定 不变的——你 只 需 要 按
    照 3个 相 邻 的 碱 基， 对 应 一 个 氨基 酸 的 远 方 法， 来 记录 蛋 白 质 分子 里 氨基 酸 的 先 后 顺 序。


