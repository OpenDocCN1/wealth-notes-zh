    黑猩猩的反应和人照镜子是一样的；相反，同样的实验如果是一只猕猴来做，就做不到。


    猕猴照镜子的时候，会以为笼子里出现了一只长相怪异的新同伴，会展现出愤怒或者好奇的社会行为。


    这个实验非常简单，但是仔细想想，它的含义是很深刻的。


    能够从镜子里认出自己，首先就说明这个生物是知道自己是自己。它到底是如何判断的，我们留到下一讲再仔细讨论。但是有一点非常关键：


    镜子实验第一次把对自我意识的探讨，从人类推广到了动物世界，从哲学、心理学、语言学范畴，推广到了看得见、摸得着的实验科学领域。


    实际上，有人真的用镜子实验来测试人类的婴儿，发现婴儿也差不多是在一岁半到两岁之间，学会照镜子，知道镜子里出现的是他自己的。这和婴儿熟练使用“我”这个字来造句，恰好是同一个时间段。


    顺便插话，到现在为止，能够通过镜子实验测试的动物一共也只有10多种。其中，大多数确实也是那些人们普遍认为比较聪明，比较智慧的动物，比如：大猩猩、黑猩猩、海豚、鲸鱼、大象。


    但是，居然有一种鸟类也通过了镜子实验，大出人们意料，这种鸟是喜鹊。


    也许喜鹊的体内还隐藏着什么大秘密。当然了，镜子实验也有它天然的缺陷，比如：


    > 很容易想到，如果有一种视觉不发达的动物，哪怕再有帮助，也不太可能通过镜子实验——它可能根本就什么都看不清嘛。


    我们言归正传。不管镜子实验本身是不是还存在很多问题，但是有了镜子实验这个武器，特别是，既然不少动物也和人类一样，能通过镜子实验的测试，科学家就知道，自我意识并不是人类独有的，我们也可以对自我意识展开科学研究了。


    # 自我意识让行为有目的


    最后，我们得解决第三个问题：为什么会有自我意识？自我意识有什么用？


    关于这个问题，很遗憾，我没有办法回答，因为科学界还没有明确的答案。


    在这里，我忍不住要感慨几句。


    > 很多人都觉得科学家是非常博学的人，其实错了。实际上，科学家可能是最值得人类无知的人。


    我常常感叹，与浩渺的宇宙、复杂的生命相比，我们人类已经掌握的知识实在是少得可怜。


    许多看似平淡无奇的现象背后，只要你多问几个为什么，你就会很快遭遇到你已经知道的知识边界，这里面也包括“我是谁”，“自我意识有什么用”这些问题。


    回到我们的主题，关于自我意识的功能，我们还没有能力给出进化论上的合理解释。在这里，我只想针对人类的自我意识，提出我自己的一一个假说：


    > 行为来说，我的认为，自我意识的出现给出了行为清晰的自的，让智慧生命能拥有更复杂的功能和情感。


    我来解释一下。


    我们知道，人类的大脑有很多基础的功能，比如：我们讨论过的感觉、学习、和社会；


    还包括一些生死攸关的功能，比如：控制呼吸、心跳和体温，感受饥饿，体会恐惧和愤怒等等。


    这些功能不是人类特有的，许多简单得多的动物大脑，甚至很多昆虫的大脑，都或多或少具备了这些功能。它们能帮助动物更好地躲避危险、延续生命、繁殖后代。


    但是，有一些更加复杂的生命功能，比如：着羞耻、成就感、好奇心和责任感，如果脱离开自我意识，是很难想象的。比如：


    +   羞耻感的本源，是意识到“我”做错了坏事；

    成就感的本源，是意识到“我”做好了一件事；

    本质感，是意识到“我”必须做什么事，等等。


    > 换句话说，生物的生存和演化没有目的，但是自我意识的出现，让智慧生命的行为第一次产生了清晰的自的。


    这些复杂的情感和认知体验，在很大程度上，就是智慧生命发达社会，乃至走出家园，探索世界的动力。


    所以，我们放眼宇宙，假设真存在和人类一样，甚至比人类高级得多的智慧生命体，我也有充分的自信，说他们一定也拥有自我意识。


    这就是我“为什么要有自我意识？”这个问题的一点个人看法。


