    - 第一，这个基因一旦出现故障，病人说话就会含糊不清，颠三倒四。

    - 第二，尽管有不少动物体内也有版本不一的FOXP2基因，但是人体当中的FOXP2版本非常年轻，可能也就是10-20万年，比人类出现的时间还晚。


    所以你听，也许是FOXP2基因的突变，导致了大脑言语区域的扩张，给我们带来了独特的语言能力，帮助我们建立了人类文明。


    ### 人类文明第二特质：自我意识


    接下来，我们说说自我意识。


    自我意识，听起来好像有点玄乎。所谓自我意识，指的就是知道世界上有“我”这么一个独一无二的存在，知道我和其他所有人、所有生物、所有东西都不同，这么一种认知。


    必须得说，人类看起来并不是唯一一种拥有自我意识的动物。如果在动物面前放一面镜子，除了人类之外，还有十来种动物也能准确地认出它自己，包括黑猩猩，也包括海豚和大象，甚至还有喜鹊。


    自我意识是一种至关重要的能力。


    一台机器人可以干活，可以联网，也可以通过程序输入来学习，但是人类世界的许多情感，比如自豪感、责任感、羞耻感，离不开对我们的认知的关联。


    生物的生存和演化本来没有目的，但是自我意识的出现，让智慧生命的作为第一次产生了清晰的目的性，让智慧生命发展壮大。


    和语言一样，自我意识也一定藏身在人类大脑当中。


    近年来的研究告诉我们，也许大脑中一个叫内侧前额叶皮层的区域，对于自我意识的形成很关键。


    当我们在脑中精心思考有关我的问题的时候，比如我喜欢干什么，我的朋友是谁，这根区域就会异常活跃。而人类大脑里的内侧前额叶皮层，也确实要比我们的灵长类亲戚大出太多了。


    结合这些证据来看，也许这个听起来有点虚无缥缈的“我”的感觉，就以某种方式，藏身在大脑内侧前额叶皮层里。而这种方式至今我们仍然一无所知。


    ### 人类文明第三特质：自由意志


    最后，我们再来说自由意志。


    也许你觉得这个词听起来，跟我们刚听说的“自我意识”有点像，但它们其实是两个很不一样的概念。


    自我意识，是能意识到世界上有一个独一无二的“我”的存在。而自由意志呢？重点在“自由”两个字。简单来说，就是能够自主决定此时此刻的思想和行为。


    自由意志这种感受，可以说代表了人类最深层的自豪感。


    我们为自己、为自己的智慧和聪明感到骄傲，归根到底，是因为我们认为，这一切都是我们自发、自主、自由地创造出来的。


    反过来说，没有自由意志的火箭，显然不会觉得探索太空有什么意义；没有自由意志的手枪，就容易被坏人当做武器，也就不需要人去立法约束了。


    不过，近年来的生物学研究，在极大地动摇自由意志的存在基础。


    你的生存本能，你的遗传特质，甚至你大脑神经细胞的自主活动，都可能会在你还没有意识到的时候，为你准备好行动预谋。自由意志，只是一个幻觉而已。


    但是我仍然要说，即便如此，这还可能是一种最美好、也最重要的幻觉。


    你肯定也有过这样的经历：当你自己设定一个目标，然后完成它的时候，你会获得成就感和心情非常好；如果同样一个目标，是别人要求去做，那结果很可能就完全不同了。


    大脑中古老的奖赏中枢，结合自由意志这种有力量的人类独有的感受，会产生前所未有的力量。


    自由意志的一个作用，就是给我们的好奇心和探索精神，赋予更大的意义，让我们在面对自己探索未知的时候，会感到更大的快感和成就感。


    说到这儿，我必须停一下。


    说到底，关于语言，自我意识，自由意志，我们的了解仍然比较有限，我们大概能猜到，哪些大脑区域可能和他们有关，但是到现在到底人体当中什么基因，什么细胞，通过怎样的信号网络创造了这些能力，我们还处于一知半解中。


    但是，这三种能力结合在一起产生的威力是无比巨大的。


    自我意识可能并非人类独有，至少我们的近亲黑猩猩就有类似的能力。自我意识加自由意志，就让人类智能有了自由探索世界、主宰地球的主动力，也许就是这种动力让我们走出非洲，甚至飞向宇宙。


    而自我意识加人类独特的语言能力，人类就创造出源自自身想象的精神载体，特别是艺术，科学，宗教。由此建立想象的共同体，发展出社会与国家，而三者相加，人类文明便在一瞬间绽放开来。


    所以，在我看来，语言，自我意识和自由意志，就是人类之所以如此与众不同的原因。


    必须得说，关于它们仍然充满未解之谜，这背后的生物学原理，很可能会是这个世纪、甚至下个世纪神经科学家们始终关注的焦点。


    但是，与此同时我也相信，面对这些复杂、抽象的概念，人类不需要动用神秘主义的力量来求得安慰。它们一定隐藏在大脑深处，一定源自我们的基因，一定与我们的生理结构相关，也一定伴随着我们的诞生，历经了几十万年进化历程的洗礼。


    所有这一切，我们终将揭晓。


    最后，我来预告一下，在《生命科学50讲》这门课的下半部分，我会展开探讨智慧之源的讨论，包括演化、学习、社交、自我意识和自由意志。如果说这门课的上半部分，我带你了解生命的结构和力量，那下半部分，我会和你一起探索人类智慧的绝佳风景。


    我们下节再见。


    # 特别放送 | 万维钢回答：人工智能主导的“正确”世界，才是最可怕的


    **王立铭**


    你好。


    昨天我回答了万维钢老师一个关于“基因演化”的问题，同时也向方老师请教了一个“智慧演化”的问题，今天就分享一下方老师对这个问题的回答。


    请万维钢老师的问题是：


    人类智演化终点，是不是让机器和算法接管一切？未来一万年有可以自利产权什么？


    我们都知道，在千百万年前基本权利的时候，在面对巨大力量，比如洪水猛兽或者猛兽时，人类是没有反抗能力的。而现在的我们，可以轻易地让机器人和算法接管一切。


    这当然不是坏事，但是问题是，如果人类把权利让出去了，谁来保证这些权利不被滥用？如果人类失去了判断力，谁来保证我们做出的决定是正确的？这是一个非常深刻的问题，也是我最困惑的地方。


    **万维钢老师的回复如下：**


    王老师这个问题是我们这些讲书人都很关心的。我最近也在思考这个问题，今天跟你分享一下我的看法。


    我觉得，如果人类的智演化终点，是机器和算法接管一切，那其实不是坏事。因为人类最大的弱点，就是我们太情绪化、太容易犯错。如果我们把决策交给一个足够理性的系统，那其实是我们人类的一个进步。


    但是，这里有一个非常大的问题，就是“谁来保证这个系统是正确的？”


    如果这个系统本身是有漏洞的，或者被别有用心的人控制了，那我们可能会失去自由，甚至失去生存的权利。所以，我们要保证这个系统是安全的，是符合人类的利益的。


    这需要人类有一定的掌控力，能够随时“刹车”，让这个系统停止运行。这也是为什么我觉得，人类的智演化终点，不应该是完全交给机器，而是人类和机器的结合。


    我们还有一个很重要的问题，就是“什么是正确的？”


    如果机器和算法是“正确的”，那这个“正确”是谁定义的？是人类定义的，还是机器自己定义的？如果是由机器自己定义的，那我们可能会面临一个巨大的风险，那就是机器可能会做出对人类不利的决定。所以，我们需要保证，这个“正确”是由人类定义的，是符合人类利益的。


    我个人的观点是，人类的智演化终点，应该是人类和机器的结合，而不是机器取代人类。人类应该保留一定的掌控力，保证这个系统是安全的，是符合人类利益的。


    希望我的回答能对你有所帮助。


    万维钢


    **王立铭**


    非常感谢万维钢老师的回答，希望我能和维钢老师继续探讨关于演化的理解再深一些。


