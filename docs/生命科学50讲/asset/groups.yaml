    这种化学分子叫AHL，为了简单起见，我们干脆就叫它“存在感”信号就行了。这种存在感信号，同时满足了秀存在感和相互配合这两个要求。


    你可以想象一下。当细菌单个生活的时候，AHL这种分子只能靠它自己生产和释放，环境中的“存在感”信号是非常弱的。


