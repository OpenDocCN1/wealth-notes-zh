    ## 11 | 自我复制比永生更重要


    | 标题 | 1 | 2 | 3 | 4 | 5 | 6 |

    | :--- | :---: | :---: | :---: | :---: | :---: | :---: |

    | | | 地球生命存在的两个缺陷 | | | | |

    | | | | | 不精确的自我复制让生命延续 | | |


    你好，我是王立铭，欢迎来到生命科学50讲。


    今天我们进入到构成生命的第三个要素——自我复制。通俗地说，就是繁殖，生孩子，传宗接代。


    假如把生命比喻成一栋大厦，物质就像是砖头瓦块，能量就像是建筑工人，那么，是不是有了物质和能量，就可以开工建造生命了呢？


    理论上讲，我们可以猜想，也许远古地球上最早形成的第一批生命就是这样的，甚至在我们身边，这样的生命也存在出现的可能。


    但是，这种物质+能量构成的生命有个巨大的缺陷，那就是它们没有能力去传授自己的生命。可能几秒钟、几分钟、几个小时就死亡消失了。


    所以，今天我们能够在这里讨论生命，一个重要的前提是：生命具备自我复制的能力，能够代代相传，直到有了今天的你和我。


    你可能会继续问，为啥生命这座大厦就不能建造得坚固点，生命要不要长，岂不需要多繁殖吗？


    有一部法国科幻电影叫《无姓之人》，里面就设想出一天人类掌握了永生技术，随之而来的是丧失了性爱和繁殖能力，同一批人就这么一直活下去。


    ![](img/d52f43ea52294dd9949052def724b433_18_0.png)


    能够永殖青春的生命，还真不是只在科幻电影里有，在现实世界里，有科学家真的找到了疑似不会衰老的物种。


    一类叫做水螅的动物就是这样，他们的身体可以不断地自我更新和修复；在实验室环境里，持续待的果蝇进入老年时也会出现寿命增加而衰老。这就有意思了，不是永生的生物就不需要繁殖了？


    ![](img/d52f43ea52294dd9949052def724b433_18_1.png)


    我要告诉你一个可能反常识的答案：不是的。


    对于生命来说，繁殖，也叫做自我复制，比永生更重要。这节课来就告诉你这是为什么。


    ### 地球生命存在的两个缺陷


    这个问题的答案，可以用一句话来概括：生命大厦再坚固，也经不住地球母亲的翻脸无情。


    这是什么意思呢？从理论上说，有足够的原料和持续的能量输入，在原始地球的环境中出现生命可能并不困难，但是这样的生命形态会有两个非常重大的缺陷。


    第一个缺陷，就是抵抗意外的能力非常弱。


    就像一个真正的大厦，万一来场地震或者火灾，把它毁灭了怎么办？大厦地下被蚂蚁啃空了，或者来一场台风，把大厦的顶层卷走了，怎么办？


    当然，你可能说这些都是一些小概率的事情，但是别忘了，任何小概率的事件，乘以三四十亿年的时间，出现的概率可能就高到几乎是必然会发生了。


    换句话说，如果最初真的构建过可以自生自灭的大厦，而且远古真的存在过地球出现过，而我们今天之所以见不到它们的原因，一定是已经毁于意外事故了。


    这个缺陷还不是最严重的。


    第二个，也是最致命的缺陷是，地球环境不是永恒不变的。


    当然，我们每个人在区区几十年的生命里，还是可以安全生活的，因为在这短的时间里，地球环境应该不至于出现特别剧烈的变化。


    但是，如果把时间尺度放大一点，放大到生物演化的尺度，我们就能发现，地球环境的变化，远比沧海桑田更加剧烈。


    举个例子，大气中的氧气。


    人类和大多数生物生存都需要氧气，最重要的原因可能就是代谢产生ATP的过程需要氧气。之前的课程中我们讲过：


    > 1个葡萄糖分子，分解成2个乳酸分子，或者2个酒精分子，只能产生2个ATP；

    > 而如果葡萄糖彻底分解成二氧化碳和水，就有可能产生28-38个ATP，与此相同，葡萄糖彻底分解需要氧气分子参与的。


    这就是为什么大气中的氧气非常重要，今天人类来说，大气层中的氧气非常需要的。


    而实际上，人体对氧气含量的适应区间是非常狭窄的。


    在海拔四五千米的青藏高原，氧气浓度会下降到10%多一点，只有正常的水平的一半，这时人体就会有缺氧的症状；


    相反，如果呼吸的氧气浓度过大，人体也会呈现出呼吸“氧中毒”，结果是神经系统、肺和眼球都会受到严重的影响。


    如果我们去回顾地球自然历史，就会发现一个事实：今天大气层的氧气，含量绝对不是专门给人类准备好的。


    在地球历史上，大气层中氧气的含量最高曾经达到过百分之二十九。


    也还不是最极端的情况。实际上在二十多亿年之前，大气层中根本没有氧气，当时的地球基本状态是所谓的厌氧生物，它们可以在没有氧气的环境里生活。


    ![](img/d52f43ea52294dd9949052def724b433_18_2.png)


    就在那个时候，地球发生了一次非常重大的环境变化，也就是所谓的大氧化事件，大量出现的氧气导致生物大灭绝。


    因为对于当时绝大多数地球生命来说，氧气不是支撑生存，而是有害的。而在大氧化事件之后，逐渐演化出来的生物，才开始学着利用氧气，才能在氧气中安全地生活。


    所以，就以氧气为例，假设在大氧化事件之前，能够依靠生物材料和能量输入，生物大厦就已经被构建出来了，那么这座大厦也完全没在大氧化事件中存活下来，我们今天仍然不可能见到它的踪影。


    而氧气仅仅是一个例子，实际上在几十亿年的地球生命史中，几乎所有环境指标都发生过剧烈的变化。


    温度、气压、太阳光强度、大气组成、土壤的化学成分、水的成分、食物、天敌等等。而这些环境变化，也曾经至少五次大规模地扫荡了地球生物圈。


    ### 不精确的自我复制让生命延续


    既然生命抵抗意外的能力很弱，地球环境又不发生变化，那么一个显而易见的悖论出现了。


    诞生于远古地球的祖先们，那些由能量这个天才建筑师搭建的生命大厦，到底是怎么一直活到今天的，而且还经历了各种意外和抵抗无法抵抗的环境变化呢？


    这个问题的答案就是，自我复制。因为，自我复制能够弥补生命形态的两个“缺陷”。


    第一个缺陷，抵抗意外的能力弱。这个比较容易理解，因为自我复制能够不停地造出越来越多的子孙后代。这样，即便其中一些个体因为意外事故死去，还能保证有足够的个体存活下来，延续香火。


    对于生命的第二个“缺陷”，自我复制怎么帮助生命适应变化多端的地球环境呢？它的方法就是不够精确的自我复制。


    其中的巧妙之处在于，每个生命个体的后代，都或多或少和他们的父母有些差别。这种差别大多数时候难以察觉，像是生命大厦悄悄更换了天井的绿植或是大堂的灯饰，有些时候也可以惊天动地，比如把整座大厦的楼高或者主干结构更换一新。


    但是无论如何，自我复制过程中发生的变化，总是比地球环境的变化快，后者的尺度动辄以千万年计数。也正因为这样，地球上的生命来了又走，样貌也千变万化。


    科学家们估计，在这颗星球上，可能已经有超过50亿个物种诞生过，而今天地球上仅存的可能只有其中的百分之一。物种们诞生、繁盛、变化、死亡，用这种方式，它们才能在地球上顽强地走过40亿年的漫漫长路。


    我要强调一句，自我复制中出现的变化，本身没有什么对错，也没有什么方向性可言。不够精确的自我复制，其实是提供了大量在地球环境中“试错”的生物样品。


    谁能活下来，谁能继续完成自我复制的新一轮循环，谁就是胜利者。是地球环境的缓慢变迁，决定了不同时刻的胜利者，也因此最终塑造了生物演化的路径。


    自我复制的两个特点虽然看起来自相矛盾，但这恰恰保证了地球生命的延续。


    对自身的不断复制保证了生命不会因一场意外而突然毁灭，而自我复制过程中出现的错误，则帮助生命适应了地球环境的变化。


    现在你应该理解了，为什么自我复制比永生更重要吧。即使像水螅这样，几乎逃避了衰老和死亡的生物，它仍然需要自我复制，仍然要面临进化的竞争和意外的侵袭，需要想办法持续适应多变的地球环境。


    地球并不是一位溺爱子女的母亲，她用冷酷残忍的手段训练着自己的孩子学会独立生存，而自我复制就是孩子们找到的最佳生存方案。


    从物种的长期生存来看，繁殖的意义远远大于永生。


    说到这儿，我们应该反过来理解一开始的问题。并不是说生命就必须自我复制，而是只有那些具备自我复制能力的生命，而且还是那种不太精确的自我复制能力的生命，才真的有可能逃脱自然历史上的意外和环境变迁，生存到今天，被你我看见。


    这节课我们说到了自我复制，知道了它对于生命有多重要，那么，自我复制又是怎么发生的呢？下一讲，我们将进入基因的神秘世界。


    > 地球并不是一位溺爱子女的母亲，她用冷酷残忍的手段训练着自己的孩子学会独立生存，而自我复制，就是孩子们找到的最佳生存方案。


    ![](img/d52f43ea52294dd9949052def724b433_19_0.png)


    ## 12 | 自我复制的降维打击


    ![](img/d52f43ea52294dd9949052def724b433_20_0.png)


    你好，我是王立铭，欢迎来到生命科学50讲。


    上课咱们知道了自我复制，或者说繁衍，是比永生更重要的事情。因为有了自我复制，生命才经过五次夭折，战胜意外，适应变化，存活到今天。那么，自我复制这么重要的事到底是怎么实现的呢？今天，我就带你来看看自我复制的机密。


    ### 蛋白质无法独立自我复制


    今天这节课可能有几点烧脑，希望你能跟紧思路。首先，我们来做一个思维体操，在纸面上构造一个极端简化的生命，探讨一下生命自我复制的原理。


    这个最简单的生命，应该就是一个蛋白质分子，我们给它取名叫生命1.0。


    从前面的故事里你可以很轻易地想象，最有资格入选的蛋白质大类就是ATP合成酶，因为它就是生命制造能量货币的。有了它，而它又工作得非常给力。当它，它就为你制造ATP分子，然后用ATP来驱动各种生命活动了。


    但是问题来了：生命1.0——也就是ATP合成酶——几乎不可能实现自我复制。


    为什么呢？因为这个古老的蛋白质虽然只很小，只有几千纳米大，但是，它却极其复杂。它的一个结构极其复杂。它有3个叶形结构，一个普通的精密三维结构。在氢离子的推动下，这个微型发电机的叶片还可以旋转不停，产生ATP分子。


    ![](img/d52f43ea52294dd9949052def724b433_20_1.png)


    这个机器里每一个原子排列的精确度需要达到零点几个纳米的水平。空间位置稍错一点，化学性态改变一点，它就无法工作了。而且它的时间精度也非常高，每一秒钟可以旋转上百次。


    所以你可以想象，要想完美复制这个三维分子机器，对时空精度的要求那是非常苛刻的。


    其实，别说复制起来困难，就是要看得清楚一些都是不容易。举个例子：


    在上世纪90年代，英国科学家约翰·沃克（John Ernest Walker）利用X射线衍射的方法，在三年之后就对这个发现获得了诺贝尔奖。你可以想象，这是一个多么微小而精的生命特性。


    ![](img/d52f43ea52294dd9949052def724b433_20_2.png)


    所以，从逻辑上说，生命体需要一种方法，能更简单，但是也更精确地记录和复制自身。


    最好不要让我们瞪大眼睛去记录和复制一个超级复杂的三维结构，而且还得记录它在每个时刻下，每一点的空间信息，这样太笨拙，也太容易出错了。


    其实，我们可以回过头来想想ATP合成酶的构造，看看会不会有启发。


    这个分子机器是由许多个蛋白质部件拼装起来的。加起来一共需要五千多个氨基酸分子，按照某种特定的顺序组装。当然，这个组装过程不需要人类或者外部力量的参与，在三维空间中，这些氨基酸彼此吸引、排斥、碰撞，结合，能够自己形成复杂、动态的三维结构。


    ![](img/d52f43ea52294dd9949052def724b433_20_3.png)


    ### DNA的降维打击和两个优势


    那么，到底怎样才能设计一个简单的方法，把五千多个氨基酸的先后顺序和位置忠实地记录和复制下来呢？


    不得不说，地球生命想到一个非常巧妙的方法。我们可以举一个流行的科幻小说名字——降维打击——来解释这件事。


    这个概念最早是来自刘慈欣的科幻小说《三体·死神滚水》。简单来说，就是生命简化了记录和复制的过程，把立体的、三维空间里的蛋白质信息，记录在了线性的、一维的DNA分子上面。


    那这个过程具体是怎么实现的？


    这就需要说到DNA这种物质的奇妙特性了。DNA也然所以，中文名字叫脱氧核糖核酸。几乎每个地球生命都依赖DNA存储自身的遗传信息，用来指导生命活动，实现自我复制。


    和蛋白质一样，DNA也是尺寸很大的生命物质。但它和蛋白质不一样的地方是，蛋白质在空间尺度上非常复杂，在时间尺度上又很灵活。


    而DNA化学性质很简单，并且是一维的，也就是线性的。因此它进行信息存储和复制的过程就比蛋白质简单得多。


    为什么这么说呢？我们先来看看DNA长什么样。


    ![](img/d52f43ea52294dd9949052def724b433_20_4.png)


    DNA的化学构造比蛋白质简单。我们说过，蛋白质分子可以看成是20种氨基酸分子按照特定的顺序首尾相连形成的肽链，然后这些肽链、或者几条肽链卷在一起缠绕、折叠、扭曲，形成一个有立体形状的蛋白质分子机器，而这台分子机器如何工作，完全取决于这个三维形态的细部构造。


    而DNA呢？它是由4种氨基酸分子构成的链。顺便说一句，这4种氨基酸的字样在中学生物课里也学过，腺嘌呤、鸟嘧啶、胸腺嘧啶和胞嘧啶，具体的名字你不用记，用A、G、T、C这4个英文母来代表就行。


    那为什么说DNA是一维线性的呢？在生物体内，DNA分子当然也有三维结构的，也是会发生空间扭转的。


    但是，变化的只是形状而已，管它空间结构怎么变，DNA分子上面所携带的信息是恒定不变的——你只需要按照3个相邻的碱基，对应一个氨基酸的远方法，来记录蛋白质分子里氨基酸的先后顺序。


