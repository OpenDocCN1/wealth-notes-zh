    一样，在进化历史上早早地就已经分道扬镳了。


    这些古细菌能够抵抗滚烫的泉水，而且还能靠泉水从地底深处带出来的化学物质生存。而它们本身也成了天然的食物来源，吸引了更多的海鱼生成海泉口附近生活，比如软体动物、鱼和虾。


