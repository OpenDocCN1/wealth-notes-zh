    你好，我是王立铭，欢迎来到生命科学50讲。今天我们继续讲自我复制。


    上一讲，我抛出了生命如何发明的两个难题，让人类感兴趣的，核酸的自我给出一个一石二鸟的答案：它既能记录遗传信息，又能催化生物化学反应。


