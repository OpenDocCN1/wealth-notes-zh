    # # 01 进化：生命的主人


    欢迎来到生命科50讲，我是王立铭。


    在前几讲里，我会跟你聊一下生命科学的意义，了解一门生命科学的思维方法，后面47讲会具体阐述进对整生命的十大元索。


    今天这讲，我想先来说谈生命科学是一门什么样的科学，你为什么应该学一点生命科学。


    在我看来，在人类所有的科学领域中，生命科学是最难，但又是负分一门学科。


    说它难呢，是因为生命科几乎所有的发现都还都很新鲜。生命和智能其实都只是演化旁家产品。


    们身上的优势和特质，说白了，没有少是那些我们最讨厌的。所以面对物学规律，我们必须谦身持物。


    说它负分，是因为它，生命科学让我们见在的只有人类历史的历史。


    在40亿生命演化史中，从来没有一个时刻保持定。这动与变可以相信生命科学的今天，主动了解进化生物学，甚至正在定义你的产品，可能会进转生你主。这是生命科给我最大的启示和负心。今天这讲，我先来聊聊课本。


    # ## 被演化主宰的躯体


    作为一个生物学，我常被别人问到：生命到底是什么？这个问题回答很多一句话，回答者，从不同职业角度会得到很多不同的答案。


    而我最近最简洁的回答是：生命是一场持续了40亿年的无可奈何。


    为什么这么说呢？我想从三个角度，给你一些生命的答案。


    第一个无奈是，于我们身体，我们没有法权。


    举个例子：镰刀红胞症，这是一种严重的遗传。


    简单说，就是红负责生产红蛋白的基因出现了个小错不读管，导致人体血细胞变形成锯齿状，镰刀型。到现，每年有超过4000万人死于这种病。可自而然同一个问题，既然这种病可变来如此危险，很可怕，种没有进化物中的过中消失？难道是上天故意的安排？


    ![](img/d52f43ea52294dd9949052def724b433_1_0.png)


    当然不是，作为科学家也有不什于上同，这种难的原因会别人寻找。


    ![](img/d52f43ea52294dd9949052def724b433_1_1.png)


