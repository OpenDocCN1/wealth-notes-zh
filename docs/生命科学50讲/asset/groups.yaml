    ## 38 | 团结就是力量


    你好，欢迎来到生命科学50讲，我是王立铭。这一讲，我们继续介绍社会的生物学。


    上节课我们讲到，社交是费氏弧菌繁衍和竞争的新策略。这种细菌聚集在一起发光，能帮助自己更好地生存。


    实际上，这样的社交行为在动物里很常见。


    荒野上的狼群集体捕猎，可以杀死比自己个头大得多的猎物。反过来，食草动物，比如斑马和羚羊，也会集体行动来吓跑一部分捕食者。


    毫无疑问，这些行为能够帮助动物们活得更安全、更有效率。所谓团结就是力量嘛。


    > 其中，最能体现这种团结的力量，最能展示精密的分工合作的，就是所谓的真社会性的生物。


    世界上有什么真社会性的动物呢？最容易想到的就是蜜蜂和蚂蚁。地球上已经发现了超过17000种真社会性动物，除了一种哺乳动物，其它的大多是蚂蚁和蜜蜂一类的昆虫。


    这一类生物除了存在分工和合作外，还有一个特别重要的特征，就是它们当中有一部分个体，彻底放弃繁殖的权力。


    你看，这一点是不是很像微观层面上，我们身体细胞之间的分工？红细胞也好，皮肤细胞也好，神经细胞也好，为了执行它们的功能，也确实都放弃了自己的繁殖权力。


    别小瞧了这种动物。在自然界，真社会性昆虫只能占到所有昆虫种类数的区区2%，但是它们的生存和繁殖能力非常强，以至于它们全部个体的重量加在一起，超过了所有昆虫的一半。


    这么强的竞争力是怎么做到的呢？今天，我们就来好好研究一下它们。


    ### 竞争力来自社会协作


    一句话总结，它们的竞争力，全靠复杂的社会协作。


    如果你见过蜜蜂的蜂巢，哪怕仅是见过它的照片，你肯定会惊讶于这种建筑结构是多么气势恢宏。


    我们在设计方案，这些身材那么小的虫子，是怎在没设计图，也没统一的指挥的情况下，修建出严密的六角形结构蜂房的。


    ![](img/d52f43ea52294dd9949052def724b433_70_0.png)


    特别是，你还要考虑到蜂巢的原材料，要靠每一只工蜂身上一滴一点的分泌，而且要全程，显然得不到任何现代科技和机械的帮助下，这工作的难度应该要比这及人修建金字塔，还要大得多。


    而在严密的建筑结构背后，支撑它的更加严密的社会结构。


    我们还是拿蜜蜂做例子。


    一窝蜜蜂可能有上万只，但它们当中只有一只蜂后，专门负责生育后代，每天吃得以后能生出上千个卵。蜂后的后宫里有几百只雄蜂，专门负责和它交配，提供精子。


    在外围，有成千上万只工蜂，负责所有的日常工作，这里包括修建和清理蜂窝，照看蜂后，采花粉喂养后代，抗击入侵者等等。


    而负责干活的工蜂内部，也会继续出现更精细的分工。比如：刚刚发育成熟的工蜂是不会飞，因此主要做内部工作，像清理蜂窝，给幼虫喂食。


    而这一两个月之后，等它们逐渐长了翅膀，学会了飞行，它们才开始做外部工作，比如采蜜和保卫家园。


    你可以想象，这个更加细致的分工，当然是很有意义的，让工蜂做到了一尽其长。


    说到这里，你也能看出来，这一窝蜜蜂像个多细胞的多形体复生生物个体。蜂后和雄蜂是它的生殖细胞，而所有的工蜂都是它的体细胞，而且具有精细分工的，不同类型的体细胞。


    从蜂巢里单独抓任何一个蜜蜂，它们生存能力和行为都是极为有限的，但是上万只蜜蜂在一起，依靠这个复杂的社会组织，能完成伟大的工程。


    ### 蜂后：The Chosen One


    那么，这种严密的社会结构和分工合作，在生物学上是怎么实现的呢？


    > 你可能不知道，蜂后和工蜂，实际上在遗传物质层面，是高度相似的姐妹，而且天生都具备生殖能力。它们的差别是在出生之后，被环境塑造的。


    简单来讲，蜂后和工蜂在幼虫阶段，吃到的食物非常不一样。


    在成千上万的卵里面，负责照顾幼虫的工蜂会随机挑其中一个，用营养更加丰富的蜂王浆来喂养。


    这样一来，它长大以后会体型更大，长出非常丰满的翅膀，而且会生育非常多的后代，它就是独一无二的蜂后了。


    我们经常说谁谁擅长干什么事情，是天之骄子，是chosen one。你看，蜂后才是真正字面意思上的the chosen one。


    相反，没有任何蜂王浆，只能吃相对没有那么营养的花蜜，它们的体型比较小，生殖器官也退化了，变成了勤勉勤劳的工蜂。


    ![](img/d52f43ea52294dd9949052def724b433_70_1.png)


    更有意思的是，那只被挑出来的蜂后长大以后，还会专门分泌一些化学物质，保证其它蜂王幼虫都只能变成工蜂，确保它独一无二的权力。


    ### 利他主义的生物学原理


    讨论到这里，你有没有发现出现了一个新问题？


    之前我们说过，在多细胞生物体内，生殖细胞和体细胞也出现了类似的分工，前者负责繁殖，后者放弃了繁殖权利负责干活，共同保证这个个体可以很好地生存和繁殖下去。


    但是蜂后和工蜂是完全不同的生物个体，工蜂为什么要把它的自私让出去，一辈子勤勤恳恳，帮助别人的繁殖呢？


    这种现象，在生物学有个专有名词，叫做利他主义。


    在历史上，这种现象曾经对达尔文的进化论造成很大挑战。而目前来看，我们可以逐步理解利他主义的生物学原理。


    想到进化论，你肯定知道这样的说法，“物竞天择，适者生存”。谁能在环境中生存，繁殖后代，谁就会被选定为自然选择的赢家。


    换句话说，在达尔文提出进化论的时候，自然选择的对象很明确，是一个个的个体，“个体选择”。


    很明显，按照蜂后们刚才的讨论，这一点和真社会性生物的生存方式矛盾。按照经典的进化论，不繁殖的生物总是被淘汰掉的。所以，针对很多真社会性生物，陆续提出了很多的学说。


    首先登场的是“群体选择”学说。


    这种学说的逻辑是，自然选择的对象，其实不是生物个体，是群体，甚至是整个物种。


    一个特性只要能帮助这个群体生存得更好，就会被自然选择所青睐，从而保留下来。


    这种学说的出发点，其实是一个简单朴素的思想，套用咱们中国人常说的一句话，就是“集体主义”，“舍小家，为大家”。


    但是这个学说的麻烦在于，它没办法解释，为什么工蜂里没有出现自私自利的叛徒。


    连多细胞生命，都因为分工付出了永恒的代价，比如癌细胞，为什么真社会性动物就那么和谐，那么伟大呢？


    所以，在 1964 年，英国科学家汉密尔顿（William Donald Hamilton）提出了一套替代理论，在短时间内就把群体选择学说扫地出门了。


    汉密尔顿的学说叫“亲 属 选 择”。


    从名字上你就能感觉到，他这套理论恰好介于个体选择和群体选择之间。自然选择的对象是一群生物，但又不是随随便便的一群，而是发生在亲戚之间，朋友可不能算。


    怎么理解这种理论呢？汉密尔顿说：


    自然选择的胜利者，是能把自己的基因，尽可能地传递下去的生物。至于这些基因是自己亲自携带和传递，还是通过自己的亲属间接传递，都无所谓。


    甚至在极端的情况下，如果牺牲自己，能帮助自己的亲戚更好地传递基因，那就会出现利他主义。


    比如：之前我们提到，蜂后和工蜂实际上是亲姐妹，它们之间基因的相似性，可以高达75%。


    这样一来，更好地照顾蜂后，让它源源不断地产生后代，对于工蜂来说是**有利可图**的。


    所以归根结底，自我牺牲和利他主义的背后，仍然是生物学的精密计算，不需要动用人类世界里更崇高、更抽象的集体主义感情。


    顺便插句话，你可能听说过一个词叫“自私的基因”。实际上，正是在汉密尔顿的亲属选择理论的影响下，英国科学家理查德·道金斯（Clinton Richard Dawkins）提出：


    自然选择的对象，其实压根连个体都不是，而是生物体内部的基因。只要基因能传下去，能发扬光大，自然选择才不在乎你一个生物过得好不好。


    总结一下。在这一讲里，我们讨论了蜜蜂这种真社会性生物，极致的社会分工。我们先是了解了它们怎么通过个体之间的分工和合作，让基因得到更大程度的传递和扩散，然后思考了工蜂自我牺牲，利他主义的生物学原理。


    本质上，这种利他主义行为背后的目的，是让自己的基因传递下去。


    你会不会好奇，既然真社会性生物这么厉害，那么，人类和大部分哺乳动物，为什么没有出现像蜜蜂一样的真社会性分工呢？


    这确实是个有意思的问题。对此，我只能说不知道。必须承认，生物演化并没有什么规划好的路径可寻。有太多的偶然因素影响了生物进化的走向。


    至于我们人类，虽然没有走上真社会性分工这条路，但是有其他的方法来提高社会协作能力，比如：语言。


    下一讲，我们就来重点讲一下，构造出人类社会的最重要的基础——语言。


    我们下讲再见。


    > 自我牺牲和利他主义的背后，仍然是生物学的精密计算，不需要动用人类世界更崇高、更抽象的集体主义感情。


    ![](img/d52f43ea52294dd9949052def724b433_71_0.png)


    ## 39 | 语言：伟大社会的基础


    ![](img/d52f43ea52294dd9949052def724b433_72_0.png)


    你好，欢迎来到生命科学50讲，我是王立铭。


    我们继续讨论人类社会和社交的生物学。


    上一讲，我们介绍了蜜蜂的利他主义行为背后，不是什么集体主义，而是生物学的精密计算，仍然只是为了最大化它自己遗传物质的传递。


    很明显，这种形式是有竞争力的。但是，人类为什么没有走上蜜蜂社会一样的道路呢？


    人类和其它地球生物，到底有什么本质差别？


    差别只有我们人类能够创造文学艺术，能够发展科学技术，能够建设辉煌的文明呢？


    可能有一个地方，能让我们在人类和其它地球生物之间画一条分界线，那就是人类语言。


    这一讲，我就来带你看看这个让人骄傲的分界线。


    ### 语言能力并不特别


    其实，语言能力本身并不特别。生物个体之间任何形式的交流，都可以看成是某种形式的语言。


    比如在前面两节里面，发光细菌利用“内在感应信号”来相互识别：蜜蜂的蜂后分泌一种化学物质，阻止其它蜜蜂继续变成蜂后，这就是某种化学语言。


    除了化学语言，动物还演化出了更复杂的交流的形式。比如著名的蜜蜂舞蹈。


    你也可以想到，几只工蜂想要形成分工合作，总需要彼此共享信息。


    早在上个世纪40年代，奥地利科学家——利利（Karl Ritter von Frisch）就已经发现蜜蜂之间可以通过身体语言交流信息。


    比如：采蜜归来的工蜂，会一边快速摆动尾部，一边在蜂巢上沿直线爬行。这个动作可以画而复始，重复很多次。


    利利的研究表明，这个特定动作携带了非常丰富的信息。蜜蜂爬行的直线和太阳光之间的角度，就标注了食物的方向；而舞蹈的总时间，就标志着食物的距离。


    其他的工蜂看准了这种身体语言，就能够集合出发采蜜，帮助它们更好地找食物。


    ![](img/d52f43ea52294dd9949052def724b433_72_1.png)


    类似的例子还有听觉语言。


    鸟类世界里，有着差不多一半的物种，有非常发达的鸣叫能力，而且更重要的是，它们可以发出不同的叫声，传递不同的信息。


    那么，一个难题就来了，这么神奇的人类语言是怎么来的呢？


    你想一想就会意识到，这个问题回答起来，真的堪比登天。有两个原因：


    - 第一，既然只有人类具备这种特殊的，用语言搭积木的能力，那就意味着，你根本不可能在动物身上研究它，但是，你又不可能整天解剖活人做研究。

    - 第二，语言是一种无形的东西，它不会形成化石，这也就意味着我们也不可能通过分析人类祖先的历史变化，找出语言功能的源头。


    所以，著名的语言学家诺姆·乔姆斯基（Avram Noam Chomsky）甚至说过这么一句半开玩笑的话：


    > 也许就是几万年之前，一次突如其来的宇宙射线照射地球，改变了我们某个祖先的基因和大脑，人类才突然具备了语言能力。


    这个观点本身当然是没有什么证据支持。但是问题恰恰就出在这里，因为想要解释人类语言的生物学，我们能够用到的证据实在是太少少了。


    顺便说一句，乔姆斯基是20世纪最著名的语言学家，他相信，人的语言功能是天生的，是人类独有的。


    而刚才我们提到的那只黑猩猩，尼姆·钱玛斯基，它的名字是不是和诺姆·乔姆斯基非常像？其实，这个名字就是为了嘲笑诺姆·乔姆斯基的，因为这项猩猩实验的出发点，就是为了证明猩猩也能在人类家庭里学会语言，乔姆斯基是错误的。


    可惜，实验结果我们已经看到了，乔姆斯基还是笑到了最后，人类语言果然是一座无法逾越的高峰。


    我们言归正传，继续思考人类语言是怎么来的。虽然有那么多困难，但是科学家仍然找到了和人类语言相关的一些线索。


    在19世纪下半叶，有个叫布鲁卡（Pierre Paul Broca）的法国医生，收到了一个非常罕见的病人。


    这个病人智力正常，也能听懂别人说话，声带的发音功能也没问题，但就是当他自己说话的时候，没办法把词汇组装成句子。


    用中文来打个比方，如果他想说“我今天中午想吃面条”，那他大概会说成“面条。今天。吃…我…中午”，这个样子。


    在这个病人死后，布鲁卡医生为他做了解剖，发现他的大脑里某个区域，大致是大脑左半球，额头下面靠后一点的位置，受了严重的伤。所以布鲁卡医生就猜测，也许这个区域专门负责语法，也就是利用词汇搭积木的能力。


    为纪念这个法国医生的发现，这个可能负责语法的大脑区域，后来就被叫做布鲁卡区。


    ![](img/d52f43ea52294dd9949052def724b433_73_0.png)


    而且，还有个特别有意思的现象，对比人类和我们的近亲黑猩猩和大猩猩，像布鲁卡区这样的大脑区域，在人类中明显更大、更复杂。


    所以，也许这个差别就能解释，为什么尽管我们和猩猩们在很多地方非常相似，但是只有人类发展出了独一无二的语言功能。


    当然，我们可以进一步追问：人和猩猩之间的这个大脑结构差别，又是从何而来呢？


    对这个问题的研究长时间陷入了僵局，直到近年来，一个名叫FOXP2的基因引起了大家的注意。


    2001年，英国科学家发现，如果人体当中的FOXP2基因出现了缺陷，病人的表现就和布鲁卡区出现损伤的患者差不多，说话缓慢，吐字不清，而且语法乱七八糟。


    ## 40 | 性的生物学


    ![](img/d52f43ea52294dd9949052def724b433_74_0.png)


    你好，欢迎来到生命科学50讲，我是王立铭。


    我们继续讨论社会性的生物学。在前面的几节课里，从细菌到昆虫到人类语言，社交手段的丰富程度在飞快地上升，但是到目前为止，有没有发现，我们描述的生物社会里少了点什么？


    没错，就是性别。


    性别当然是地球生物里非常特殊，又非常重要的一个特征。而性别出现，也极大地丰富了生物的社交生活。


    而且，一个特别有意思的事情是，有太多关于我们人类美好或负面的想象，像孔雀的羽毛，鸟类的歌唱，公狮子之间的争斗，人类世界的美妙诗句和歌曲，都和性别之间的互动有关。比如求偶、炫耀、繁殖、暴力，甚至战争。


    可以说，性别的出现，极大地丰富了生物社会的形态，以及生物之间社交生活的多样性。


    所以，在这个单元的最后，我会花三节课的时间，和你聊聊性别和社会的关系。


    在这一讲，我们要首先讨论性别的这件事本身的意义。它为什么会出现？它是怎么出现的？


    ### 繁殖低效的两性繁殖


    我们首先讨论第一个问题，性别这件事为什么会出现？


    一个下意识的答案可能是：性别当然需要出现。


    这个想法其实没有错，在地球生物圈，所有的复杂生命形态，包括动物、植物，也包括拥有线粒体的单细胞生物，几乎都存在性别。


    但是你仔细思考会发现，性别这件事虽然带给了我们很多美好的想象，但在生物学上却是一件非常累赘，代价很大的事情。


    为什么这么说呢？


    当一种生物没有性别的时候，比如细菌，它要想繁殖后代，是一件非常简单的事。


    一个细胞可以完全不需要依靠同类的帮助，就自己完成自我复制和繁殖后代。它只需要复制自己的DNA，然后自己从中间断开，变成两个细胞就行了。


    ![](img/d52f43ea52294dd9949052def724b433_74_1.png)


    换句话说，在有性别存在的条件下，这种生命存活的概率，就不再是10亿亿分之一了，而是接近10亿分之一。


    如果你没有跟上刚才计算的思路，也没关系，你只要记住这句话：单单是性别这一个因素，就可以把这种小生命存活的概率，一下子提高了10亿倍。


    所以你看，性别的出现看起来似乎多此一举，还降低了生物个体传递自身遗传物质的效率。但是，它却极大地增加了生物个体之间彼此交流共享遗传物质的能力。


    让不同性别的小生命个体，在交配繁殖的过程中能够彼此传递遗传信息，让它们的后代拥有更多的遗传多样性，让它们在多变的地球环境中能够更加游刃有余地繁衍下去。


    ### 两性的核心差异：生殖细胞


    好了，讨论完了性别出现的重要意义，我们来简单地讨论一下，性别这件事在生物学上是怎么实现的。


    首先，两种性别的核心差别是什么呢？


    我们抛开具体的样貌特征不谈，其实男性和女性，或者说雄性和雌性，最本质的区别，是它们产生的生殖细胞的长得不一样。


    - 雄性产生的是数量众多，但是个头较小的生殖细胞——比如男人的精子；

    - 雌性产生的是数量较少，但是营养丰富的生殖细胞——比如女人的卵子。


    在两个生殖细胞结合之后，雄性提供的主要仅仅是遗传物质；而雌性，除了提供遗传物质之外，还提供了营养物质，支持了受精卵的发育成长。


    这才是两种性别之间最大的差别。生物学家们在讨论不同生物性别的时候，这也是最客观和核心的判断标准。


    这个两性的区分，我想你还是比较了解的。但是你有没有想过，为什么会有这样的区分呢？


    这就要从有性生殖的麻烦事说起了。


    我们说过，性别的出现让繁殖后代变得非常麻烦，因为一个生物个体没法自己完成，必须寻找一个异性才行。


    或者说得更具体一点，当一个生物产生了生殖细胞之后，每一个生殖细胞必须很快找到一个异性产生的生殖细胞，两者结合在一起，才有生长、存活、继续繁殖的机会。


    这当然是一件很麻烦的事。所以，一个生存策略就是：尽可能产生天文数字的生殖细胞，广撒网，守株待兔，这样也许还有机会遇到另一半，产生后代。


    但是，这里其实有个矛盾：产生大量生殖细胞，那就保证了每个生殖细胞里面携带的营养物质会很有限，这对于受精卵的发育是很不利的。


    所以进化的结果就是，两种性别的生物，分别演化出了截然不同，但是相互匹配的繁殖策略：一方生产数量庞大的精子，一方生产数量稀少，但是营养丰富的卵子。这样，它们找到彼此，然后孕育后代的成功率最高。


    也因为这个原因，两性的差别就出现了。想一想，进化出两性生物，是不是一种特别巧妙的安排呢？


    好了，言归正传。我们已经知道了，两性之间的核心差别是生殖细胞，那想要在生物学上，制造雄性或者雌性生殖细胞的能力。

    '
