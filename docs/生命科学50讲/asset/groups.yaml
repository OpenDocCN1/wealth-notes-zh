    # 15 | RNA：生命的起源


    ![](img/d52f43ea52294dd9949052def724b433_26_0.png)


    ![](img/d52f43ea52294dd9949052def724b433_26_1.png)


    你好，我是王立铭，欢迎来到生命科学50讲。今天我们继续讲自我复制。


    上一讲，我抛出了生命如何发明的两个难题，让人类感兴趣的，核酸的自我给出一个一石二鸟的答案：它既能记录遗传信息，又能催化生物化学反应。


    今天，我想带你在进化的研究当中，看看RNA从想得到底是切默斯发现的，也看看RNA这种今天看起来有点多余的分子，和生命的起源有关系吗。


    # 一场失败的RNA剪接实验


    我们先来回忆一下切默斯关心的事情——RNA剪接。


    简单来说，就是当RNA分子被生产出来之后，RNA需要把自己链条上多余的部分剪掉，才能去指导生产蛋白质。


    打个比方，如果把DNA和RNA比喻成记录遗传信息的密码本，那RNA剪接这一步就相当于撕去密码本中间多余的纸张。这个过程非常重要，所以切默斯想搞清楚它是怎么发生的。


    为了开展研究，切默斯选的研究对象是嗜热四膜虫。这是一种在沸水里分布广泛的单细胞生物，很耐寒大量培养，而且它个头很大，也很方便进行各种显微操作和化学提纯。


    ![](img/d52f43ea52294dd9949052def724b433_26_2.png)


    和很多人一样，切默斯开始也假设，肯定是某些蛋白质分子帮助RNA剪开并连接。


    这个假设合理合理，蛋白分子是最适合的连因也土，在没有ATP到到助DNA复制，蛋白质分子确实广泛地参与了生命体内的各种生物化学反应。


    那要么去找出这个蛋白质呢？切默斯使用了最经典的化学提纯方法。


    他先从大四膜虫样本里提纯一批没有被切RNA，完整的RNA分离，再同时提纯了一大堆蛋白质混合物。


    那么，如果这两个东西混在一起，负责剪接的蛋白质找到目标RNA，RNA分子就应该会被切断和组合，剪接步骤就完成了。


    ![](img/d52f43ea52294dd9949052def724b433_26_3.png)


    然后呢，在切默斯的设想里，为了找出具体是哪个蛋白质分子执行了这个步骤，他可以把蛋出没有蛋分分子一步步地分离、一点点点蛋，排除掉那些对RNA剪接没有影响的蛋白质，最终留下的，应该就是他找的那个蛋白质了。


    整个设想听起来有点1个几像炼丹。古时候的炼丹术土，在没有化学代托什么化学物质就一起煮一煮、晒一晒就能炼出丹，所以他们只能盲目地靠各种各样的化学物，天然的或者人工地在放在一起做各种实验，一旦发现哪个配方一起就能炼出丹，之后就总是按照配方来就行了。


    但是，让人匪夷所思的是，切默斯的实验几乎一开始就失败了。


    他发现从细胞里提纯出来的RNA，就算什么蛋白质都不加，也会发生剪接反应。也就是说，后面本计划的分离提纯的步骤根本没有进行下去。


    切默斯的第一反应是：RNA样品是不是被污染了？如果把RNA清得更干净不是一就执行了？


    但是，他们忙活了几十年之后，什么果都没有。到了1982年，他们放弃了对于RNA分子进行提纯的想法，而系打算直接在试管里合成一条新的RNA分子，这样肯定就是纯净的RNA。'
