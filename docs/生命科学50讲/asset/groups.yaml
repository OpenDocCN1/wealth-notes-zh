    当然了，这个过程一定是非常复杂、充满 各种细节的。不过没关系，我们这一讲，主 要拆解这个过程里最核心的几个步骤。


    # 建造大脑第一步：安放元器件


    这么说吧，我们可以把自己的大脑看成是 一个超大规模的集成电路，里面有1千亿个 元件。这些元件之间产生了1百万亿个连 接。


    那么，咱们来探究一下，这个超大规模集 成电路是怎么被设计出来的。


