    ## 发词 | 邀请你见证一个40亿年的奇迹


    你好，我是王立铭。


    前几天，我和科学圈的朋友吃饭。饭桌上，他们聊起得到APP，聊自己喜欢过的课的老师，问我喜欢哪门。我没有就犹豫了一下，说“我就成要得到老师了。”


    这一天终于到了，欢迎来到《王立铭生命科学50讲》。


    非常荣幸，能够讲授第一门自然科学，把生命科学魅力讲给你听。


    ### 1


    必须得说，这门课很难讲。


    它既需要通俗易懂，又要有趣的洞见；既要核心知识，又要讲清科学发现的对；既要给予新认知，又要对我们现实生活有启发。


    我教科学、讲科学讲已经十几年了，但面对这个任务，还是感到沉甸甸的压力。


    原因在于，生命科学有一个“老大难”问题：生命应该怎么定义？


    这个问题，至今没有人能够准确回答。在什么时候，定义中哪种生命现象的边界非常困难。结果就是，用科学的语言，生命没有严格的定义，比如科学定义：


    你有新陈代谢才叫生命？病毒在生成当中，很多时候完全不进行新陈代谢，它算生命吗？


    你说拥有细胞膜的才叫生物，能运动的就动物，没有细胞质生活的，但有些动物有时有细胞体有运动能力，它算什么？


    你说拥有自我意识的就是智慧生命，但看那对着镜子也能认出你自己，它算有意识吗？


    但反过来，其实这也正是这门学科迷人的地方。


    生命科学研究对象，本质上不是任何确定的个体，而是一个漫长的过程，是40亿年的地球上演化历史。


    地球生命的奋斗，是存活，是繁殖，是抗拒灭绝的宿命。是穿越自然选择的剪刀，我们才在乎什么“定义”。


    想到这里，我就明白这门课该怎么做了。


    如果能去火星，我就带你上火星，帮你用望远镜看到地球上生命。跨越空间，这是宇宙的角度。


    如果真有上帝，我就带你回到他制造生命的现场，带你见证40亿的造物奇迹。跨越时间，这是上帝的视角。


    现在打开这门课程，你将在宇宙尺寸度上帝视角，真正理解生命的奇迹。


    ### 2


    这门课程，我会讨论这些问题：


    40亿年，进化，50亿个种的生物，它们有什么隐秘的联系？


    从一个蛋白质，DNA到人体，细胞怎么构建？器官怎么学？头脑怎么形成？


    在这个尺度下，智慧生命维度有什么普遍规律？


    ## 01 进化：生命的主人


    欢迎来到生命科学50讲，我是王立铭。


    在前几讲里，我会跟你聊一下生命科学的意义，了解一门生命科学的思维方法，后面47讲会具体阐述进化对整生命的十大要素。


