    # 06 | 生命以负熵为生


    # 06 生命以负熵为生


    ![](img/d52f43ea52294dd9949052def724b433_8_0.png)


    你好，我是王立铭。欢迎来到生命科学50讲。


    在上一讲课程中，从维纳的尿素合成，到米勒的烧瓶实验，我们已经有足够证据相信，构成生命最基础的物质并不神秘，完全可以在实验室中造出来。


    从此，至少在构成生命的物质这个层面，生命现象就成为了一个可以被科学研究的正常自然现象，而不再是扑朔迷离的神话。


    # 制造生命的重大突破


    可以想象，从生命无法神坛的那一刻起，人类就产生了一种无法遏制的冲动：制造生命。


    既然我们能够制造生命物质，那么能否像零件制造机器、用砖头盖大楼一样，制造人工生命呢？


    在得出结论前，首先说点乐观的。


    **从制造生命基础物质，如氨基酸，再到制造复杂物质，如蛋白质，在这条路上，人类确实取得了大量重要突破。**


    先说蛋白质，1965年，中国科学家成功合成了牛胰岛素，这是一个由51个氨基酸组成的蛋白质。到今天，我们可以用机器自动合成更多的复杂蛋白质分子，或者更进一步，利用微生物帮助我们制造几乎所有的蛋白质。


    再说DNA，2017年初，美国哥伦比亚大学的科学家居然人工合成了一个超长的DNA链，并利用DNA编码规则，在里面存储了一整套计算机操作系统和一部法国电影。


    ![](img/d52f43ea52294dd9949052def724b433_8_1.png)


    你看，至少在构成生命的复杂物质这个层面上，人类取得的成就还是很大的。那制造出的生物体，是不是指日可待呢？


    肯定不是。


    一个最简单的比方，我们常说“煮熟的鸭子飞不了”。鸭子在煮熟前后同一瞬间，身上的物质构成并没有发生变化，但生命却是有的区别。这又说明了物质之外，生命的运转还需要一些别的东西。


    别的东西是什么呢？


    如果我们把生命比喻成一座大厦，那么氨基酸、蛋白质、DNA这些物质就是建造大厦用的砖头瓦块，虽然砖头瓦块并不能自动搭起大厦，而需要蓝色的工。


    同样的道理，构建一个生命，给物质赋予活力的又是谁呢？从这节课开始，我要讲到生命的第二个必不可少的元素：能量。


    # 活着就是对抗热力学第二定律


    回答这个问题，我们还得提到一个人：薛定谔。我在上一讲中提到了他的名著《生命是什么》，但并没有提到这本书中最经典的观点：“生命以负熵为生”。


    要理解这句话，首先要理解什么是“熵”，理解“熵”之前需要补充一个重要的物理知识点：热力学第二定律。


    **热力学第二定律是说在任何一个孤立系统里，总体的混乱程度，只会增大不会减小，直到达到混乱的最大化。**


    请你一定要记住这个定律，因为所有生命活着的终极使命只有一个，就是对抗它。如果有一天不再对抗了，那生命就离终结不远了。


    我举个形象的例子，帮你粗略理解一下热力学第二定律：请你想象这里有半杯咖啡，现在往里倒进半杯牛奶，并且不断搅拌，会发生什么呢？


    生活经验告诉我们，当然是两者开始慢慢融合，咖啡的颜色变浅，而奶也不再有乳白色，最后融合成一杯奶咖咖啡。


    这事太常见了。那假设下面这些命题吧：


    +   * 咖啡和奶为什么会融合呢？在微观的分子层面，发生了什么？

    * 咖啡和奶的融合会停止吗？什么时候停止呢？

    * 混合了的咖啡和奶，还能再分开吗？


    回答了这三个问题，你大致就能知道热力学第二定律在说些什么了。


    咖啡与牛奶接触的那一刻，这个杯子里就出现了一个新的“系统”。这个新系统形成之初，咖啡分子和牛奶分子仍然要聚焦集中在自己那一半空间里，自己人挨着自己人，比较有群。


    在没有任何外力干预的情况下，随着时间流逝，双方的分子都会逐渐对方的空间扩散，和对方分子混合在一起。这时，我们看到的是咖啡和牛奶的慢慢融合。


    这个过程会停止吗？


    当咖啡分子和牛奶分子达到最均匀状态的时候，这个系统就达到了最终的平衡。什么是最均匀的状态呢？


    就是假如有一屋子大小的潜水艇沉入这杯液体中，会看到无数多的咖啡分子和牛奶分子乱糟糟地混混在一起，完全没有丝毫规律性可言。要想把这两种分子彻底分隔开，已经是不可能完成的任务了。


    ![](img/d52f43ea52294dd9949052def724b433_8_2.png)


    现在我们把热力学第二定律对应起来。


    刚刚加入半杯牛奶的咖啡杯，是一个独立系统。混合形成之初，分子排布呈现出比较大的有序性。


    在没有外力介入的情况下，随着时间推移，分子的秩序自发走向越来越大的混乱，直到达到混乱的最大化，系统达到最终的平衡。


    这个过程是完全不可逆的，混合一旦开始，我们就再也没有办法把牛奶从咖啡中分离出来了。


    这种从有序到混乱的变化，背后的驱动力就是热力学第二定律。


    这个定律的表述是，系统的混乱程度被称做“熵”。任何一个孤立的系统，都会向更大的混乱、也就是熵不断增加，熵最大的时候，就意味着丧失了变化的能力，新的平衡出现了。


    一个苹果，落地之后，内部秩序从有序走向无序，再难增加，从无序到无序，最终落入大地，达到新的平衡；


    一棵树森，塌墙的过程就是不断被破坏的过程，一块岩石，熔蚀的过程就是被风化的过程……


    这里要再重申一遍，我们对热力学第二定律的解释其实很浅显，如果大家要深入理解，还是要读一读物书。


    # 生命以负熵为生


    简单了解了热力学第二定律，你就可能马上就会想到，生命现象好像根本不该出现啊。


    生命是个多有序的现象啊，复杂的生化反应自发地在生物体内发生，动物数以百万亿细胞在一个生物体内自发分工协作运转。


    如果大自然必然走向不可逆的无序，那么生命这样高精精复杂的时空结构，是怎么在无序中产生的呢？


    不光如此，要是生命体还活着，它就必须有能力持续地保证它的混乱程度非常大。'
  - '[PAGE 9]


    有能力持续地保证它的混乱程度非常小，时空结构高度精密，这都是和热力学第二定律恰好相反的。难道你你真的是逃出自然规律之外的异类吗？


    解答就藏在热力学第二定律中。


    不知道你注意没有，我刚才的表述里有 “孤立系统”这 4 个字。什么是孤立系统？就是没有能量和物质输入、输出的系统。


    如果有能量持续地输入，那么热力学第二定律就打开了一扇后门：在一定空间、一定时间的范围内，混乱程度有可能持续下降。


    只要有持续的能量输入，生命现象、高度精密的时空结构，是能够存在并得到很好的维持的。


    所以，能量才是生命现象得以发生的根本动力。


    薛定谔说，一个动物想要活着，就得持续不断地吃下去混乱度比较低、熵也比较低的食物，然后排泄出混乱度比较高，熵也比较高的粪便。


    这样一来，动物就等于是从环境中攫取了负的熵，从而能够降低自身的混乱度，维持生命现象的发生。


    当然听到这儿，你可能会问，动物可以从食物中获得能量、攫取负熵，那植物呢？薛定谔也给出了一个解释——最终的负熵来源，就是太阳光携带的能量。


    因此，吃东西或者晒太阳这些日常行为，其实是生命体在完成一个崇高的使命——吸取能量，对抗热力学第二定律，维持生命现象，这就是“生命以负熵为生”。


    回到我们开头时提出的问题：人类有可能像制造汽车一样制造生命吗？


    也许有。但无论如何制造，首先要解决一个问题，就是要让那些构成生命的基础物质拥有自发从环境中获取能量、利用能量的能力。


    总结一下，这节课我们思考了只有物质是不能构成生命的。通过了解热力学第二定律，我们知道只有不断地输入能量，生命现象才有可能发生。这就是薛定谔的名句 “生命以负熵为生”的真正含义。


    那么，能量从哪儿来呢？能量又是如何被生命利用的呢？接下来的几讲中，我将一步步带你揭示能量更多的秘密，我们下一讲再见。


