  - '[PAGE 18]


    # 11 | 自我复制比永生更重要


    | 标题 | 1 | 2 | 3 | 4 | 5 | 6 |

    | :--- | :---: | :---: | :---: | :---: | :---: | :---: |

    | | | 地球生命存在的两个缺陷 | | | | |

