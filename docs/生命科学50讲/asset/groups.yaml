    # 30 | 嗅觉与味觉为什么“不智能”？


    ![](img/d52f43ea52294dd9949052def724b433_54_0.png)


    你好，欢迎来到生命科学50讲，我是王立铭。这一讲我们继续讲感觉。


    不知道你有没有听过一个比较振奋的猜测，它是说：主要依靠视觉信息输入的动物，才可能发展出高度的智慧。


    虽然现在有好多史上最亮的实验基础可以证明，但是今天地球上最聪明的那些动物，包括人类、猩猩、海豚、大象，确实也都是以视觉信息为主的。


    我的猜测，这些可能是因为视觉信息，或者说人更广一些，光这样的电磁波，在准确反映环境变化、承载丰富的信息这两点上，要比其他的**躯体**都强大。


    所以你看，天人类卫星里使用的交流工具，比如手机、电器卫星，还有互联网，也确实都是利用电磁波作为载体的。


    如果我这个猜测成立，这就意味着，如果我们有一天能够找到有高度智慧的**外星人**，在很大程度上，它应该也会长着类似眼睛的**高级视觉**，依靠收集环境中的电磁波信号感知世界。


    那么反过来问呢？如果不是视觉这样基于光、或者广义的电磁波的感觉，而是基于味觉和嗅觉这样的感觉系统，有可能支撑智慧的诞生吗？


    我个人的观点是：几乎不可能。


    为什么呢？这就需要我讲清楚味觉、嗅觉和视觉到底有什么不同了。


    这一讲，我们就从信号源的性质、信号采集、信号处理三个层次，来理解一下其中的区别。


    # 信号源：光与化学信号的区别


    第一个，我们先来看看信号源的区别。


    视觉系统感受的信号是光信号，或者更广义地说是电磁波信号。这一类信号有三大特点：


    +   1. 直线传播；

    2. 光速传播；

    3. 不依赖具体的介质。


    这三大特点就保证了，根据视觉信息的输入，动物能够非常准确和及时地判断物体的位置、大小、运动方向等信息。


    甚至在外星球，在宇宙深处，没有大气的地方，视觉信号也是可以发射和采集。


    对比起来，嗅觉和味觉系统，它们感知的是具体的化学物质。'
  md: "\n## 细胞分工的过程，有点像一个物理学常用的概念——对称破缺。\n\n当我生产的Delta比你多了微不足道的一点点之后，根据Delta信号的第一个抑制特性，你会因此少生产一点点Delta；而因为你生产的Delta少了一点，对我产生的抑制能力更小了，所以我会生产更多一点点点的Delta。这一直循环下去，原本非常微弱的、甚至是随机导致的差别，就会被放大到非常显著的程度。\n\
    \n你应该已经发现了，这其实是一个正反馈循环。在这样的循环中我生产的Delta会最大化，而你生产的Delta会被彻底抑制住。\n\n然后呢，基于Delta信号的第二个特性，你的周围被大量Delta信号包裹，因此会变成上皮细胞，而我周围什么Delta信号都没有，因此我将会变成神经细胞。\n\
    \n就这样，从一群完全一样的细胞里，在一个没有差别的外部环境里，细胞内部一些非常微弱的随机变化，也能够被持续放大，从而锁定细胞的命运走向。\n\n这一段可能也有点烧脑，我们稍微停顿一下。\n\
    \n抛开具体的生物学机制，这个例子其实说明的是：就算外部环境是一样的，细胞内部非常微弱的信号波动，也可以被反复放大，作为内因决定细胞命运的走向。\n\n所以你看，细胞的对称破缺，还真的是内因和外因共同作用的结果。\n\
    \n当然了，为了便于理解，我只提供了两个具体的例子，WNT和Delta。但是你完全可以把WNT当做是细胞外因的代表，Delta信号当做是细胞内因的代表。在真实场景里，内因和外因肯定不是非此即彼的，它们之间一定会相互影响，共同决定细胞的命运。\n\
    \n说到这里，我想简单总结一下上一讲和这一讲的核心思想：在生物体的发育过程中，在一个受精卵变成100万亿个细胞的过程中，细胞命运发生过三次重大转折。它们出现了精细的分工，形成了成百上千条永不交叉的命运曲线。而主宰它们走上不同命运的，既有外部环境的诱导，也有自身特性的变化。我们身体上每一个器官、每一块组织，都是这么来的。\n\
    \n而这一切发展的巅峰，可能就是我们人类的大脑了。下一讲，是分工这个要素的最后一讲，我会带你看看，我们的大脑到底是如何发育而来的，其中有没有什么独特的原理。我们下一讲见。\n\
    \n![](img/d52f43ea52294dd9949052def724b433_45_0.png)\n\n## 25 | 分工的巅峰之作：人类大脑\n\
    \n![](img/d52f43ea52294dd9949052def724b433_46_0.png)\n\n你好，我是王立铭，欢迎来到生命科学50讲。\n\
    \n今天是分工的最后一讲，也是我们课程上半场部分的最后一讲。在前面的四个单元里，你从物质到能量，再到自我复制和细胞分工，我们已经知道了如何构造一个单细胞生命。在分工这个单元里，我们在逐步学习怎么建造一个多细胞复杂生物。这一讲，是分工的收官，我想给你讲代表了细胞分工合作最高水平的作品——人类的大脑。\n\
    \n你可能对它习以为常，觉得它人人都有，很普通。但是，在我看来，它其实是所有地球生命体内最复杂、最精巧的一个器官。\n\n这一讲，我们就来探讨这个复杂器官的制造问题。\n\
    \n当然了，这个过程一定是非常复杂、充满各种细节的。不过没关系，我们这一讲，主要拆解这个过程里最核心的几个步骤。\n\n### 建造大脑第一步：安放元器件\n\
    \n这么说吧，我们可以把自己的大脑看成是一个超大规模的集成电路，里面有1千亿个元件。这些元件之间产生了1百万亿个连接。\n\n那么，咱们来探究一下，这个超大规模集成电路是怎么被设计出来的。\n\
    \n不要被集成电路设计、1千亿、1百万亿这些词吓到。你只要想一想，这个过程一定需要三个步骤的：\n\n- 第一，将每个元器件安放在合适的位置上；\n- 第二，按照一定的规则，在集成电路板上蚀刻电路，将元器件连接起来；\n\
    - 第三，调试和完善电路。\n\n它是怎么做到的呢？这还不算，人体内最长的轴突，可能要从脊椎的位置，一直延伸到人的脚趾部位，长度可能超过1米。它们到底要完成如此精确的定位呢？\n\
    \n![](img/d52f43ea52294dd9949052def724b433_47_0.png)\n\n现在我们知道了，这个连接的过程，其实和第一阶段有些相似。刚才我们提到的那些，能够改变细胞移动方向的信号分子，其中大多数，也参与了神经细胞连接的整个过程。只不过，这一次它们改变的不是整个细胞的位置，而是轴突顶端的生长方向。\n\
    \n信号分子会产生各种信号，让轴突那小小的尖端，能够按照预设的方向移动。等到轴突到达目标部位后，就会和当地的神经细胞建立联系。这就是第二步：建立电路连接。\n\
    \n### 建造大脑第三步：调试完善\n\n好，在前两个基本完工之后，我们已经建造了一个足够有样的大脑。元器件安装就位，电路连接完成。人类刚出生时的大脑，基本就是这样子的。\n\
    \n这个时候的大脑，也的确可以完成一些很基本的功能了，比如：哭、移动身体、吃奶等等。\n\n但是你得知道，这个时候的大脑，功能还不是很完备，还是很粗糙的。\n\
    \n比如，新生的婴儿看东西是看不清楚的，肌肉控制能力很差，也没有语言、逻辑分析、数学计算这些高级能力。\n\n当然，这并不奇怪，就像任何一个程序员或者芯片设计师都会告诉你：没有谁设计的一版程序或者芯片就是完美的，肯定得经过反复调试和修改之后，才能正常工作。\n\
    \n人脑其实也一样。\n\n它需要依靠丰富的外部环境，进行测试和修改，最终在很短的时间里，实现不断地迭代升级。这也是我们说的第三个步骤。\n\n在这个过程又会发生什么呢？\n\
    \n你也许会猜，这个升级过程，可能需要更多新的神经细胞，以及更多神经细胞的连接。\n\n可真实的情况恰恰相反，人脑完善的过程，主要不是依靠新元素的加入，反而是删减没用的，或者错误的旧东西。\n\
    \n比如，在人类发育的过程中，特别是青春期前后，大脑中神经细胞的总量，将达到1000亿的量级，并且在此之后，就不再有新的神经细胞加入，所以，大脑中的神经细胞是在缓慢减少的。\n\
    \n与此同时，神经细胞之间连接的数量，也会出现明显的下降，将会有接近一半的连接消失。\n\n这其实就已经说明，人类大脑发育完善和积累经验的过程，实际上，主要是靠原有连接的消失来完成的，而不是增加新细胞或者新连接。\n\
    \n当然，在这个调试修改的过程中，具体发生什么，现在我们知道还不是很非常多。\n\n那如果我们继续追问，大脑这个巨型集成电路的完成和修改，是根据什么指导原则来完成的呢？\n\
    \n换句话说，大脑自己怎么知道哪些连接需要增强或者删除，哪些细胞需要杀死或者增加呢？\n\n可以肯定地说，环境中的各种刺激，一定起到了非常重要的作用。\n\n\
    比如，在上个世纪八十年代，两位神经科学家——休伯尔 (David Hunter Hubel) 和维斯 (Torsten Nils Wiesel) 就发现，如果让出生不久的小鼠的一只眼睛封起来，让它看不光线，经过几个月后再打开，这个眼睛就再也看不清东西了，尽管眼睛的各种结构还是完好无损的。\n\
    \n也就是说，在没有光线刺激的时候，大脑的神经系统就失去了分析视觉信号的能力。\n\n所以你看，在这个例子里，环境里面的光线，对于大脑处理视觉信息这个功能的完善和保持，是绝对必要的。\n\
    \n以此类推，大脑的其他功能，比如语言、运动、情绪、学习，其实也都都需要和环境持续的互动才能完成。\n\n一句话总结：建造大脑的第三步，也是调试完善的步骤，需要环境信息的持续参与。\n\
    \n说到这里，大脑这块集成电路终于设计完成了。总结一下，大脑的建造就像设计集成电路一样，需要三个步骤：\n\n首先，安装元器件；其次，搭建电路；最后，依靠外部环境进行调试。\n\
    \n就这样，在这个伟大工程完工之后，人脑大脑这台智慧机器就能投入运行。\n\n### 本章总结\n\n![](img/d52f43ea52294dd9949052def724b433_47_1.png)\n\
    \n#### （A）为什么会出现细胞分工？\n\n分工解决了单细胞生物无法解决的问题：生存与繁殖的矛盾。有了细胞分工，生物体负责繁殖与运动的细胞，就可以各司其职。\n\
    \n#### （B）多细胞生物有什么生存优势？为此付出了什么代价？\n\n- 优势：\n    1. 细胞功能的专业化；\n    2. 细胞间的密切协作；\n\
    \    3. 新功能的产生\n\n- 代价：癌症\n单个细胞复制新细胞的同时，细胞聚集的体能受到压制，这可能导致细胞发生“叛变”，疯长繁殖后代，因此产生癌症。\n\
    \n#### （C）分工在技术上是怎么实现的？\n\n具备分裂潜能的细胞，放弃繁殖，换取特定的功能。\n\n这个过程中有三次转折：\n\n1. 胎盘和胎儿的分化；\n\
    2. 细胞具体功能的分化；\n3. 彻底放弃分裂，成为体细胞。\n\n#### （D）分工的内在原理是什么？\n\n由内因和外因共同决定\n\n- 外因：细胞所处环境中的化学信号强度\n\
    - 内因：细胞之间的反复博弈\n\n#### （E）如何构建出人类的大脑？\n\n三个步骤：\n\n1. 大脑中产生化学信号，使神经细胞发生迁移；\n2.\
    \ 通过轴突，建立细胞之间的信号连接；\n3. 在环境的共同作用下，增强或删除神经细胞之间的连接。\n\n![](img/d52f43ea52294dd9949052def724b433_47_2.png)\n\
    \n> 人脑就像一个超大规模的集成电路。它需要依靠丰富的外部环境进行测试和修改，在很短时间内迅速迭代升级。\n\n## 26 | 缸中之脑：我只是我的感觉\n\
    \n你好，我是王立铭，欢迎来到《生命科学50讲》\n\n从这一讲开始，我们进入课程的下半部分，来讲讲智慧的生物学。\n\n我们总是喜欢带着点淡淡的优越感，表达这样的意思：咱们人类这种跑得不够快、跳得不够高、不怎么会游泳、力气也不大的生物，能够站在生物圈的金字塔顶端，靠的是独一无二的人类智慧。\n\
    \n但是，“智慧”到底是怎么一回事呢？\n\n老实说，“智慧”这个词儿太大、太复杂了。感知外部世界、学习和记忆、运动、情感、理性思考、自主意志，这些似乎都可以说是智慧的一部分。\n\
    \n想给它一个简单好记的定义也不是那么容易，更别说彻底搞清楚它的生物学原理了。\n\n但是，按照咱们前面那么多讲的经验，我们还是可以利用生物学思维，从复杂多样的智慧现象里，抽象出一些放之四海而皆准的元素来，和你一起逐层解构成人类智慧的规律。\n\
    \n所以，从这一讲开始，我会用五个单元的内容，带你剖析人类智慧的五大元素。\n\n而第一个元素就是感觉，因为感觉对智慧生命至关重要。\n\n### 感觉是智慧的基础\n\
    \n为什么这么说呢？首先，我们要知道什么是感觉。\n\n简单来说，感觉就是生物体从外部世界获取信息的过程。感觉是人类作为一种智慧生命，和环境互动、甚至改变环境的基础。\n\
    \n当然如果你说有点儿悬，我拿来两个例子证明这个观点。\n\n第一个例子——注意。\n\n有很多人认为，注意这种能力就是最底层的智慧。这话说得有点牵强，注意这东西会不会有，也算个能力？不过我得说，其实这是很有道理的。\n\
    \n我们就拿视觉做例子，我们的眼睛能看到光，但是外部世界的光源实在太多了，大白天走在大街上，几乎周围的所有东西，不管是尺寸、形状、颜色，都在用光信号吸引你的注意。\n\
    \n这个时候，你的眼睛得先选择盯着一眼哪里了解个大概，再选择盯着哪里搞清楚它的细节本身选择反映着，你的大脑对外部信息重要程度的区分。\n\n而且，这个倾向还会受到你的认知能力、你的经验、你的内在状态的影响，比如：\n\
    \n- 一个男生在大街上走，更容易注意周围的美女；\n- 一个小偷可能更注意周围人的钱包；\n- 一个流浪汉更容易注意哪里有垃圾，等等。\n\n而在注意之后，更复杂的神经活动，比如：情绪变化、理性思考、采取行动，才有可能发生。\n\
    \n然后忠实地把信息传递给大脑，它们的工作就完成了。其实我错了，**感觉系统并不反映真实世界**。\n\n我们举两个例子来说明这一点。\n\n第一个例子，对于同一个世界，不同的生物，会对它产生截然不同的色彩感觉。\n\
    \n我们知道，人的眼睛能看到好多种颜色，大概能分辨出多少种呢？10000多种，具体是怎么分辨这么多颜色的，我们这个在后面会详细拆解。\n\n> 在这里我要强调的是：动物分辨色彩的能力，是有天差地别的。\n\
    \n很多哺乳动物，比如老鼠，它们能分辨的颜色就只有1万种左右；\n\n而鸟类的能力要强得多，比如鸽子，就能分到100亿种颜色，是人类能力的1000倍；\n\n\
    还有一些生物，能看到人类眼睛完全看不到的红外线和紫外线。\n\n![](img/d52f43ea52294dd9949052def724b433_49_0.png)\n\
    \n所以你看，同样的地球，同样的太阳光，不同生物眼睛里的世界，至少从色彩上就可以非常不同。有的单调乏味，有的绚烂夺目，你能说谁看到的世界是真实客观的，谁的不是呢？\n\
    \n**其实我们还不如说，每一种生物的感觉系统，能够采集到的仅仅是环境中很小的一部分信息而已。**\n\n第二个例子，对于同一个世界，同样的你，在不同的状态下，也会对它产生截然不同的感觉。\n\
    \n比如，面对同样的食物，同样的时间地点，你对这种食物的感觉可以是完全不一样的。\n\n如果你特别饿，可能会觉得太好吃了；如果你刚刚吃得撑到饱，就会觉得食物的味道甚至让你反胃。\n\
    \n换句话说，同样的味觉信息输入，当我们状态不同的时候，**在我们大脑中构造出的那一份虚拟饭菜，可以很不一样**。\n\n所以你看，**完全不同生物的感觉系统，可能感受到了完全不同的世界，就连同一个人，在不同的状态下，对世界的感知都是可以差别很大的。**\n\
    \n感觉系统的存在，并不为了一丝不苟地刻画外部世界，而是为了方便、好用。所以，它会对信息进行取舍、筛选、扭曲和整合，然后创造出一个虚拟世界来。\n\n###\
    \ 无法推翻的实验--缸中之脑\n\n也正是基于这一点，美国哲学家普特南（Hilary Putnam）在上世纪80年代的时候，提出了一个非常有名的思想实验——缸中之脑。\n\
    \n他假设了一个场景：有一个疯子科学家，解剖了一个人的大脑，把它放在一缸培养液里，让他还能继续活着。然后用一台超级计算机，人工生成各种各样的感觉信号，再用微型电极把信号输入大脑的不同部位。\n\
    \n![](img/d52f43ea52294dd9949052def724b433_49_1.png)\n\n这样一来，这个大脑是不是仍然会觉得自己**的生活没发生变化**，根本意识不到自己是生活在水缸里，生活在虚拟现实里呢？\n\
    \n结合咱们刚才对人体感觉系统的讨论，你就能发现，缸中之脑这个思想实验实际上是不可能被实验证实或者推翻的。这也是为什么，刚才我说到客观真实世界的时候，加了一个限定词——“所谓”。\n\
    \n因为，**我们即使再反省自身，也无法在科学实验的层次上证明，我们每一个人都真实地生活在这个世界中，而不是一个浸泡在培养液里的大脑。**\n\n顺便插一句，缸中之脑这个思想，被很多著名的科幻电影用上了。比如《黑客帝国》和《盗梦空间》。\n\
    \n在这两个电影里，故事发生的场景，实际上是主人公大脑中的虚拟世界。而这些主人公，在《黑客帝国》中是躺在培养世界里的人肉电池，在《盗梦空间》里则是被催眠进入沉睡的人类。\n\
    \n![](img/d52f43ea52294dd9949052def724b433_49_2.png)\n\n当然了，缸中之脑这个思想实验最大的意义，倒不是让我们怀疑人生，而是告诉我们，感觉输入这件事，特别是我们大脑对感觉信息的处理、整合和重建，对于智慧有多重要。\n\
    \n总结一下，这一讲我们说了感觉对于智慧生命为什么那么重要，我们人类有哪些感觉，以及感觉是不是能反映真实世界。\n\n这一章，我们就好来好好谈感觉的生物学，我们一下讲见。\n\
    \n我们即便再反省自身，也无法在科学实验的层次上证明：每一个人都真实地生活在这个世界中，而不是浸泡在培养液里的大脑。\n\n## 29 | 视觉：捕捉色彩\n\
    \n![](img/d52f43ea52294dd9949052def724b433_52_0.png)\n\n你好，欢迎来到生命科学50讲，我是王立铭。\n\
    \n今天我们讲视觉的最后一讲。在前两讲里，你知道了光点是怎么被视网膜细胞看到的，而光点组成的光束，是怎么被视网膜感受到的，这一讲，我想讲讲颜色。\n\n你也许会问，**颜色有啥用**？黑白的世界虽然单调了一点，但是好像也不妨碍我们正常生活嘛。\n\
    \n其实，你可能不知道，看见颜色的能力对人类可能很重要。\n\n在绝大多数**哺乳动物**的眼里，这个世界其实很单调的，而人和猿猴的祖先可能是在**演化**的过程中，意外获得了对更多颜色的感知能力。\n\
    \n有些人猜测，这个能力可以帮助我们更好地**从一望无际的绿色中挑出**，找到已经成熟的、呈现出鲜艳颜色的水果。这样一来，我们的祖先们就更容易填饱肚子，生存在下，繁殖后代。\n\
    \n既然颜色这么重要，那**颜色的感知**到底是怎么实现的呢？\n\n这件事就要从牛顿说起了。\n\n### 从三原色类比三原光\n\n你可能知道，牛顿做过一个很著名的**三棱镜折射实验**。他发现，太阳光如果透过三棱镜之后，就会变幻成红橙黄青绿蓝紫几种不同的单色光。\n\
    \n就是因为这个研究，发现了牛顿是**光**的微粒说/波动说争议中的关键人物，有的人就是怎么看到不同颜色的光的。\n\n他提出了一个假设：各种颜色光的**物理性质——比波长——是不一样的**。那么在人的眼睛里，就**应该有不同的感光器，**不同的光，颜色的感觉就是这么来的。\n\
    \n牛顿这个理论框架被很多人继承了下来，因为它在原理上确实非常简单。\n\n按照这个模型，人的眼睛里只需要长出**区域**几种不同的光感受器，它们之间按不同的比例配合起来，就能形成非常多种颜色的感知。\n\
    \n你闲下来没事的时候，不妨幻想一下，在皮皮虾眼中，这世界该长得多么娇艳。\n\n![](img/d52f43ea52294dd9949052def724b433_53_0.png)\n\
    \n#### 不同色彩感受器的出现原因\n\n我们言归正传。现在你知道了人眼里有红绿蓝三种色彩感受器，那你知道这些不同的色彩感受器是怎么出现的吗？\n\n\
    其实，它们仍然是视网膜的感光细胞。感光的基础还是我们上两讲讨论过的——视紫红质这个蛋白质分子。\n\n只不过在这三种色彩感受器里，视紫红质的结构发生了一些微小的变化，所以能对不同波长的光更加敏感。\n\
    \n我们刚才提到，很多哺乳动物只有两个色彩感受器，人类是在演化过程中，获得了第三种新的色彩感受器。\n\n一个简单方便的解释就是：编码原先两种光感受器的DNA片段，不知道什么时候，在自我复制的时候重复复制了一次，然后它上面又发生了一些随机的遗传变化。\n\
    \n这样一来，它们的后代体内就会出现三个不同的视紫红质蛋白，产生三种不同的色彩感受器。\n\n因为拥有三种不同的光感受器，能帮助人类的祖先在森林中找到鲜艳的水果，所以这个特性就被保留了下来，让今天的人类普遍带有三种不同的色彩感受器，而且能看到百万到千万种不同的颜色。\n\
    \n**有趣的是，在人类中也有极少一部分人，天生就具有四种光感受器，能比正常人看到丰富得多的色彩。**\n\n在他们的身体里，其实就是编码记录某一个视紫红质的DNA片段，又出现了一个多余的重复。\n\
    \n当然了，现在你应该也能自己做出推演，这种超长的色彩感受的能力，应该对我们祖先们的生存意义不大，所以并没有成为人类社会的主流。\n\n总结一下，这一讲我们试图说明的是，人类对丰富色彩的感知，实际上是三种不同的色彩感受器，分别感受不同波长的光，然后彼此之间信号组合的结果。\n\
    \n## 30 | 嗅觉与味觉为什么“不智能”？\n\n![](img/d52f43ea52294dd9949052def724b433_54_0.png)\n\
    \n你好，欢迎来到生命科学50讲，我是王立铭。这一讲我们继续讲感觉。\n\n不知道你有没有听过一个比较振奋的猜测，它是说：主要依靠视觉信息输入的动物，才可能发展出高度的智慧。\n\
    \n虽然现在有好多史上最亮的实验基础可以证明，但是今天地球上最聪明的那些动物，包括人类、猩猩、海豚、大象，确实也都是以视觉信息为主的。\n\n我的猜测，这些可能是因为视觉信息，或者说人更广一些，光这样的电磁波，在准确反映环境变化、承载丰富的信息这两点上，要比其他的**感觉**都强大。\n\
    \n所以你看，天人类卫星里使用的交流工具，比如手机、电器卫星，还有互联网，也确实都是利用电磁波作为载体的。\n\n如果我这个猜测成立，这就意味着，如果我们有一天能够找到有高度智慧的**外星人**，在很大程度上，它应该也会长着类似眼睛的**高级视觉**，依靠收集环境中的电磁波信号感知世界。\n\
    \n那么反过来问呢？如果不是视觉这样基于光、或者广义的电磁波的感觉，而是基于味觉和嗅觉这样的感觉系统，有可能支撑智慧的诞生吗？\n\n我个人的观点是：几乎不可能。\n\
    \n为什么呢？这就需要我讲清楚味觉、嗅觉和视觉到底有什么不同了。\n\n这一讲，我们就从信号源的性质、信号采集、信号处理三个层次，来理解一下其中的区别。\n\
    \n### 信号源：光与化学信号的区别\n\n第一个，我们先来看看信号源的区别。\n\n视觉系统感受的信号是光信号，或者更广义地说是电磁波信号。这一类信号有三大特点：\n\
    \n1. 直线传播；\n2. 光速传播；\n3. 不依赖具体的介质。\n\n这三大特点就保证了，根据视觉信息的输入，动物能够非常准确和及时地判断物体的位置、大小、运动方向等信息。\n\
    \n甚至在外星球，在宇宙深处，没有大气的地方，视觉信号也是可以发射和采集。\n\n对比起来，嗅觉和味觉系统，它们感知的是具体的化学物质。\n"
  mdcn: "\n## 细胞分工的过程，有点像一个物理学常用的概念——对称破缺。\n\n当我生产的Delta比你多了微不足道的一点点之后，根据Delta信号的第一个抑制特性，你会因此少生产一点点Delta；而因为你生产的Delta少了一点，对我产生的抑制能力更小了，所以我会生产更多一点点点的Delta。这一直循环下去，原本非常微弱的、甚至是随机导致的差别，就会被放大到非常显著的程度。\n\
    \n你应该已经发现了，这其实是一个正反馈循环。在这样的循环中我生产的Delta会最大化，而你生产的Delta会被彻底抑制住。\n\n然后呢，基于Delta信号的第二个特性，你的周围被大量Delta信号包裹，因此会变成上皮细胞，而我周围什么Delta信号都没有，因此我将会变成神经细胞。\n\
    \n就这样，从一群完全一样的细胞里，在一个没有差别的外部环境里，细胞内部一些非常微弱的随机变化，也能够被持续放大，从而锁定细胞的命运走向。\n\n这一段可能也有点烧脑，我们稍微停顿一下。\n\
    \n抛开具体的生物学机制，这个例子其实说明的是：就算外部环境是一样的，细胞内部非常微弱的信号波动，也可以被反复放大，作为内因决定细胞命运的走向。\n\n所以你看，细胞的对称破缺，还真的是内因和外因共同作用的结果。\n\
    \n当然了，为了便于理解，我只提供了两个具体的例子，WNT和Delta。但是你完全可以把WNT当做是细胞外因的代表，Delta信号当做是细胞内因的代表。在真实场景里，内因和外因肯定不是非此即彼的，它们之间一定会相互影响，共同决定细胞的命运。\n\
    \n说到这里，我想简单总结一下上一讲和这一讲的核心思想：在生物体的发育过程中，在一个受精卵变成100万亿个细胞的过程中，细胞命运发生过三次重大转折。它们出现了精细的分工，形成了成百上千条永不交叉的命运曲线。而主宰它们走上不同命运的，既有外部环境的诱导，也有自身特性的变化。我们身体上每一个器官、每一块组织，都是这么来的。\n\
    \n而这一切发展的巅峰，可能就是我们人类的大脑了。下一讲，是分工这个要素的最后一讲，我会带你看看，我们的大脑到底是如何发育而来的，其中有没有什么独特的原理。我们下一讲见。\n\
    \n![](img/d52f43ea52294dd9949052def724b433_45_0.png)\n\n## 25 | 分工的巅峰之作：人类大脑\n\
    \n![](img/d52f43ea52294dd9949052def724b433_46_0.png)\n\n你好，我是王立铭，欢迎来到生命科学50讲。\n\
    \n今天是分工的最后一讲，也是我们课程上半场部分的最后一讲。在前面的四个单元里，你从物质到能量，再到自我复制和细胞分工，我们已经知道了如何构造一个单细胞生命。在分工这个单元里，我们在逐步学习怎么建造一个多细胞复杂生物。这一讲，是分工的收官，我想给你讲代表了细胞分工合作最高水平的作品——人类的大脑。\n\
    \n你可能对它习以为常，觉得它人人都有，很普通。但是，在我看来，它其实是所有地球生命体内最复杂、最精巧的一个器官。\n\n这一讲，我们就来探讨这个复杂器官的制造问题。\n\
    \n当然了，这个过程一定是非常复杂、充满各种细节的。不过没关系，我们这一讲，主要拆解这个过程里最核心的几个步骤。\n\n### 建造大脑第一步：安放元器件\n\
    \n这么说吧，我们可以把自己的大脑看成是一个超大规模的集成电路，里面有1千亿个元件。这些元件之间产生了1百万亿个连接。\n\n那么，咱们来探究一下，这个超大规模集成电路是怎么被设计出来的。\n\
    \n不要被集成电路设计、1千亿、1百万亿这些词吓到。你只要想一想，这个过程一定需要三个步骤的：\n\n- 第一，将每个元器件安放在合适的位置上；\n- 第二，按照一定的规则，在集成电路板上蚀刻电路，将元器件连接起来；\n\
    - 第三，调试和完善电路。\n\n它是怎么做到的呢？这还不算，人体内最长的轴突，可能要从脊椎的位置，一直延伸到人的脚趾部位，长度可能超过1米。它们到底要完成如此精确的定位呢？\n\
    \n![](img/d52f43ea52294dd9949052def724b433_47_0.png)\n\n现在我们知道了，这个连接的过程，其实和第一阶段有些相似。刚才我们提到的那些，能够改变细胞移动方向的信号分子，其中大多数，也参与了神经细胞连接的整个过程。只不过，这一次它们改变的不是整个细胞的位置，而是轴突顶端的生长方向。\n\
    \n信号分子会产生各种信号，让轴突那小小的尖端，能够按照预设的方向移动。等到轴突到达目标部位后，就会和当地的神经细胞建立联系。这就是第二步：建立电路连接。\n\
    \n### 建造大脑第三步：调试完善\n\n好，在前两个基本完工之后，我们已经建造了一个足够有样的大脑。元器件安装就位，电路连接完成。人类刚出生时的大脑，基本就是这样子的。\n\
    \n这个时候的大脑，也的确可以完成一些很基本的功能了，比如：哭、移动身体、吃奶等等。\n\n但是你得知道，这个时候的大脑，功能还不是很完备，还是很粗糙的。\n\
    \n比如，新生的婴儿看东西是看不清楚的，肌肉控制能力很差，也没有语言、逻辑分析、数学计算这些高级能力。\n\n当然，这并不奇怪，就像任何一个程序员或者芯片设计师都会告诉你：没有谁设计的一版程序或者芯片就是完美的，肯定得经过反复调试和修改之后，才能正常工作。\n\
    \n人脑其实也一样。\n\n它需要依靠丰富的外部环境，进行测试和修改，最终在很短的时间里，实现不断地迭代升级。这也是我们说的第三个步骤。\n\n在这个过程又会发生什么呢？\n\
    \n你也许会猜，这个升级过程，可能需要更多新的神经细胞，以及更多神经细胞的连接。\n\n可真实的情况恰恰相反，人脑完善的过程，主要不是依靠新元素的加入，反而是删减没用的，或者错误的旧东西。\n\
    \n比如，在人类发育的过程中，特别是青春期前后，大脑中神经细胞的总量，将达到1000亿的量级，并且在此之后，就不再有新的神经细胞加入，所以，大脑中的神经细胞是在缓慢减少的。\n\
    \n与此同时，神经细胞之间连接的数量，也会出现明显的下降，将会有接近一半的连接消失。\n\n这其实就已经说明，人类大脑发育完善和积累经验的过程，实际上，主要是靠原有连接的消失来完成的，而不是增加新细胞或者新连接。\n\
    \n当然，在这个调试修改的过程中，具体发生什么，现在我们知道还不是很非常多。\n\n那如果我们继续追问，大脑这个巨型集成电路的完成和修改，是根据什么指导原则来完成的呢？\n\
    \n换句话说，大脑自己怎么知道哪些连接需要增强或者删除，哪些细胞需要杀死或者增加呢？\n\n可以肯定地说，环境中的各种刺激，一定起到了非常重要的作用。\n\n\
    比如，在上个世纪八十年代，两位神经科学家——休伯尔 (David Hunter Hubel) 和维斯 (Torsten Nils Wiesel) 就发现，如果让出生不久的小鼠的一只眼睛封起来，让它看不光线，经过几个月后再打开，这个眼睛就再也看不清东西了，尽管眼睛的各种结构还是完好无损的。\n\
    \n也就是说，在没有光线刺激的时候，大脑的神经系统就失去了分析视觉信号的能力。\n\n所以你看，在这个例子里，环境里面的光线，对于大脑处理视觉信息这个功能的完善和保持，是绝对必要的。\n\
    \n以此类推，大脑的其他功能，比如语言、运动、情绪、学习，其实也都都需要和环境持续的互动才能完成。\n\n一句话总结：建造大脑的第三步，也是调试完善的步骤，需要环境信息的持续参与。\n\
    \n说到这里，大脑这块集成电路终于设计完成了。总结一下，大脑的建造就像设计集成电路一样，需要三个步骤：\n\n首先，安装元器件；其次，搭建电路；最后，依靠外部环境进行调试。\n\
    \n就这样，在这个伟大工程完工之后，人脑大脑这台智慧机器就能投入运行。\n\n### 本章总结\n\n![](img/d52f43ea52294dd9949052def724b433_47_1.png)\n\
    \n#### （A）为什么会出现细胞分工？\n\n分工解决了单细胞生物无法解决的问题：生存与繁殖的矛盾。有了细胞分工，生物体负责繁殖与运动的细胞，就可以各司其职。\n\
    \n#### （B）多细胞生物有什么生存优势？为此付出了什么代价？\n\n- 优势：\n    1. 细胞功能的专业化；\n    2. 细胞间的密切协作；\n\
    \    3. 新功能的产生\n\n- 代价：癌症\n单个细胞复制新细胞的同时，细胞聚集的体能受到压制，这可能导致细胞发生“叛变”，疯长繁殖后代，因此产生癌症。\n\
    \n#### （C）分工在技术上是怎么实现的？\n\n具备分裂潜能的细胞，放弃繁殖，换取特定的功能。\n\n这个过程中有三次转折：\n\n1. 胎盘和胎儿的分化；\n\
    2. 细胞具体功能的分化；\n3. 彻底放弃分裂，成为体细胞。\n\n#### （D）分工的内在原理是什么？\n\n由内因和外因共同决定\n\n- 外因：细胞所处环境中的化学信号强度\n\
    - 内因：细胞之间的反复博弈\n\n#### （E）如何构建出人类的大脑？\n\n三个步骤：\n\n1. 大脑中产生化学信号，使神经细胞发生迁移；\n2.\
    \ 通过轴突，建立细胞之间的信号连接；\n3. 在环境的共同作用下，增强或删除神经细胞之间的连接。\n\n![](img/d52f43ea52294dd9949052def724b433_47_2.png)\n\
    \n> 人脑就像一个超大规模的集成电路。它需要依靠丰富的外部环境进行测试和修改，在很短时间内迅速迭代升级。\n\n## 26 | 缸中之脑：我只是我的感觉\n\
    \n你好，我是王立铭，欢迎来到《生命科学50讲》\n\n从这一讲开始，我们进入课程的下半部分，来讲讲智慧的生物学。\n\n我们总是喜欢带着点淡淡的优越感，表达这样的意思：咱们人类这种跑得不够快、跳得不够高、不怎么会游泳、力气也不大的生物，能够站在生物圈的金字塔顶端，靠的是独一无二的人类智慧。\n\
    \n但是，“智慧”到底是怎么一回事呢？\n\n老实说，“智慧”这个词儿太大、太复杂了。感知外部世界、学习和记忆、运动、情感、理性思考、自主意志，这些似乎都可以说是智慧的一部分。\n\
    \n想给它一个简单好记的定义也不是那么容易，更别说彻底搞清楚它的生物学原理了。\n\n但是，按照咱们前面那么多讲的经验，我们还是可以利用生物学思维，从复杂多样的智慧现象里，抽象出一些放之四海而皆准的元素来，和你一起逐层解构成人类智慧的规律。\n\
    \n所以，从这一讲开始，我会用五个单元的内容，带你剖析人类智慧的五大元素。\n\n而第一个元素就是感觉，因为感觉对智慧生命至关重要。\n\n### 感觉是智慧的基础\n\
    \n为什么这么说呢？首先，我们要知道什么是感觉。\n\n简单来说，感觉就是生物体从外部世界获取信息的过程。感觉是人类作为一种智慧生命，和环境互动、甚至改变环境的基础。\n\
    \n当然如果你说有点儿悬，我拿来两个例子证明这个观点。\n\n第一个例子——注意。\n\n有很多人认为，注意这种能力就是最底层的智慧。这话说得有点牵强，注意这东西会不会有，也算个能力？不过我得说，其实这是很有道理的。\n\
    \n我们就拿视觉做例子，我们的眼睛能看到光，但是外部世界的光源实在太多了，大白天走在大街上，几乎周围的所有东西，不管是尺寸、形状、颜色，都在用光信号吸引你的注意。\n\
    \n这个时候，你的眼睛得先选择盯着一眼哪里了解个大概，再选择盯着哪里搞清楚它的细节本身选择反映着，你的大脑对外部信息重要程度的区分。\n\n而且，这个倾向还会受到你的认知能力、你的经验、你的内在状态的影响，比如：\n\
    \n- 一个男生在大街上走，更容易注意周围的美女；\n- 一个小偷可能更注意周围人的钱包；\n- 一个流浪汉更容易注意哪里有垃圾，等等。\n\n而在注意之后，更复杂的神经活动，比如：情绪变化、理性思考、采取行动，才有可能发生。\n\
    \n然后忠实地把信息传递给大脑，它们的工作就完成了。其实我错了，**感觉系统并不反映真实世界**。\n\n我们举两个例子来说明这一点。\n\n第一个例子，对于同一个世界，不同的生物，会对它产生截然不同的色彩感觉。\n\
    \n我们知道，人的眼睛能看到好多种颜色，大概能分辨出多少种呢？10000多种，具体是怎么分辨这么多颜色的，我们这个在后面会详细拆解。\n\n> 在这里我要强调的是：动物分辨色彩的能力，是有天差地别的。\n\
    \n很多哺乳动物，比如老鼠，它们能分辨的颜色就只有1万种左右；\n\n而鸟类的能力要强得多，比如鸽子，就能分到100亿种颜色，是人类能力的1000倍；\n\n\
    还有一些生物，能看到人类眼睛完全看不到的红外线和紫外线。\n\n![](img/d52f43ea52294dd9949052def724b433_49_0.png)\n\
    \n所以你看，同样的地球，同样的太阳光，不同生物眼睛里的世界，至少从色彩上就可以非常不同。有的单调乏味，有的绚烂夺目，你能说谁看到的世界是真实客观的，谁的不是呢？\n\
    \n**其实我们还不如说，每一种生物的感觉系统，能够采集到的仅仅是环境中很小的一部分信息而已。**\n\n第二个例子，对于同一个世界，同样的你，在不同的状态下，也会对它产生截然不同的感觉。\n\
    \n比如，面对同样的食物，同样的时间地点，你对这种食物的感觉可以是完全不一样的。\n\n如果你特别饿，可能会觉得太好吃了；如果你刚刚吃得撑到饱，就会觉得食物的味道甚至让你反胃。\n\
    \n换句话说，同样的味觉信息输入，当我们状态不同的时候，**在我们大脑中构造出的那一份虚拟饭菜，可以很不一样**。\n\n所以你看，**完全不同生物的感觉系统，可能感受到了完全不同的世界，就连同一个人，在不同的状态下，对世界的感知都是可以差别很大的。**\n\
    \n感觉系统的存在，并不为了一丝不苟地刻画外部世界，而是为了方便、好用。所以，它会对信息进行取舍、筛选、扭曲和整合，然后创造出一个虚拟世界来。\n\n###\
    \ 无法推翻的实验--缸中之脑\n\n也正是基于这一点，美国哲学家普特南（Hilary Putnam）在上世纪80年代的时候，提出了一个非常有名的思想实验——缸中之脑。\n\
    \n他假设了一个场景：有一个疯子科学家，解剖了一个人的大脑，把它放在一缸培养液里，让他还能继续活着。然后用一台超级计算机，人工生成各种各样的感觉信号，再用微型电极把信号输入大脑的不同部位。\n\
    \n![](img/d52f43ea52294dd9949052def724b433_49_1.png)\n\n这样一来，这个大脑是不是仍然会觉得自己**的生活没发生变化**，根本意识不到自己是生活在水缸里，生活在虚拟现实里呢？\n\
    \n结合咱们刚才对人体感觉系统的讨论，你就能发现，缸中之脑这个思想实验实际上是不可能被实验证实或者推翻的。这也是为什么，刚才我说到客观真实世界的时候，加了一个限定词——“所谓”。\n\
    \n因为，**我们即使再反省自身，也无法在科学实验的层次上证明，我们每一个人都真实地生活在这个世界中，而不是一个浸泡在培养液里的大脑。**\n\n顺便插一句，缸中之脑这个思想，被很多著名的科幻电影用上了。比如《黑客帝国》和《盗梦空间》。\n\
    \n在这两个电影里，故事发生的场景，实际上是主人公大脑中的虚拟世界。而这些主人公，在《黑客帝国》中是躺在培养世界里的人肉电池，在《盗梦空间》里则是被催眠进入沉睡的人类。\n\
    \n![](img/d52f43ea52294dd9949052def724b433_49_2.png)\n\n当然了，缸中之脑这个思想实验最大的意义，倒不是让我们怀疑人生，而是告诉我们，感觉输入这件事，特别是我们大脑对感觉信息的处理、整合和重建，对于智慧有多重要。\n\
    \n总结一下，这一讲我们说了感觉对于智慧生命为什么那么重要，我们人类有哪些感觉，以及感觉是不是能反映真实世界。\n\n这一章，我们就好来好好谈感觉的生物学，我们一下讲见。\n\
    \n我们即便再反省自身，也无法在科学实验的层次上证明：每一个人都真实地生活在这个世界中，而不是浸泡在培养液里的大脑。\n\n## 29 | 视觉：捕捉色彩\n\
    \n![](img/d52f43ea52294dd9949052def724b433_52_0.png)\n\n你好，欢迎来到生命科学50讲，我是王立铭。\n\
    \n今天我们讲视觉的最后一讲。在前两讲里，你知道了光点是怎么被视网膜细胞看到的，而光点组成的光束，是怎么被视网膜感受到的，这一讲，我想讲讲颜色。\n\n你也许会问，**颜色有啥用**？黑白的世界虽然单调了一点，但是好像也不妨碍我们正常生活嘛。\n\
    \n其实，你可能不知道，看见颜色的能力对人类可能很重要。\n\n在绝大多数**哺乳动物**的眼里，这个世界其实很单调的，而人和猿猴的祖先可能是在**演化**的过程中，意外获得了对更多颜色的感知能力。\n\
    \n有些人猜测，这个能力可以帮助我们更好地**从一望无际的绿色中挑出**，找到已经成熟的、呈现出鲜艳颜色的水果。这样一来，我们的祖先们就更容易填饱肚子，生存在下，繁殖后代。\n\
    \n既然颜色这么重要，那**颜色的感知**到底是怎么实现的呢？\n\n这件事就要从牛顿说起了。\n\n### 从三原色类比三原光\n\n你可能知道，牛顿做过一个很著名的**三棱镜折射实验**。他发现，太阳光如果透过三棱镜之后，就会变幻成红橙黄青绿蓝紫几种不同的单色光。\n\
    \n就是因为这个研究，发现了牛顿是**光**的微粒说/波动说争议中的关键人物，有的人就是怎么看到不同颜色的光的。\n\n他提出了一个假设：各种颜色光的**物理性质——比波长——是不一样的**。那么在人的眼睛里，就**应该有不同的感光器，**不同的光，颜色的感觉就是这么来的。\n\
    \n牛顿这个理论框架被很多人继承了下来，因为它在原理上确实非常简单。\n\n按照这个模型，人的眼睛里只需要长出**区域**几种不同的光感受器，它们之间按不同的比例配合起来，就能形成非常多种颜色的感知。\n\
    \n你闲下来没事的时候，不妨幻想一下，在皮皮虾眼中，这世界该长得多么娇艳。\n\n![](img/d52f43ea52294dd9949052def724b433_53_0.png)\n\
    \n#### 不同色彩感受器的出现原因\n\n我们言归正传。现在你知道了人眼里有红绿蓝三种色彩感受器，那你知道这些不同的色彩感受器是怎么出现的吗？\n\n\
    其实，它们仍然是视网膜的感光细胞。感光的基础还是我们上两讲讨论过的——视紫红质这个蛋白质分子。\n\n只不过在这三种色彩感受器里，视紫红质的结构发生了一些微小的变化，所以能对不同波长的光更加敏感。\n\
    \n我们刚才提到，很多哺乳动物只有两个色彩感受器，人类是在演化过程中，获得了第三种新的色彩感受器。\n\n一个简单方便的解释就是：编码原先两种光感受器的DNA片段，不知道什么时候，在自我复制的时候重复复制了一次，然后它上面又发生了一些随机的遗传变化。\n\
    \n这样一来，它们的后代体内就会出现三个不同的视紫红质蛋白，产生三种不同的色彩感受器。\n\n因为拥有三种不同的光感受器，能帮助人类的祖先在森林中找到鲜艳的水果，所以这个特性就被保留了下来，让今天的人类普遍带有三种不同的色彩感受器，而且能看到百万到千万种不同的颜色。\n\
    \n**有趣的是，在人类中也有极少一部分人，天生就具有四种光感受器，能比正常人看到丰富得多的色彩。**\n\n在他们的身体里，其实就是编码记录某一个视紫红质的DNA片段，又出现了一个多余的重复。\n\
    \n当然了，现在你应该也能自己做出推演，这种超长的色彩感受的能力，应该对我们祖先们的生存意义不大，所以并没有成为人类社会的主流。\n\n总结一下，这一讲我们试图说明的是，人类对丰富色彩的感知，实际上是三种不同的色彩感受器，分别感受不同波长的光，然后彼此之间信号组合的结果。\n\
    \n## 30 | 嗅觉与味觉为什么“不智能”？\n\n![](img/d52f43ea52294dd9949052def724b433_54_0.png)\n\
    \n你好，欢迎来到生命科学50讲，我是王立铭。这一讲我们继续讲感觉。\n\n不知道你有没有听过一个比较振奋的猜测，它是说：主要依靠视觉信息输入的动物，才可能发展出高度的智慧。\n\
    \n虽然现在有好多史上最亮的实验基础可以证明，但是今天地球上最聪明的那些动物，包括人类、猩猩、海豚、大象，确实也都是以视觉信息为主的。\n\n我的猜测，这些可能是因为视觉信息，或者说人更广一些，光这样的电磁波，在准确反映环境变化、承载丰富的信息这两点上，要比其他的**感觉**都强大。\n\
    \n所以你看，天人类卫星里使用的交流工具，比如手机、电器卫星，还有互联网，也确实都是利用电磁波作为载体的。\n\n如果我这个猜测成立，这就意味着，如果我们有一天能够找到有高度智慧的**外星人**，在很大程度上，它应该也会长着类似眼睛的**高级视觉**，依靠收集环境中的电磁波信号感知世界。\n\
    \n那么反过来问呢？如果不是视觉这样基于光、或者广义的电磁波的感觉，而是基于味觉和嗅觉这样的感觉系统，有可能支撑智慧的诞生吗？\n\n我个人的观点是：几乎不可能。\n\
    \n为什么呢？这就需要我讲清楚味觉、嗅觉和视觉到底有什么不同了。\n\n这一讲，我们就从信号源的性质、信号采集、信号处理三个层次，来理解一下其中的区别。\n\
    \n### 信号源：光与化学信号的区别\n\n第一个，我们先来看看信号源的区别。\n\n视觉系统感受的信号是光信号，或者更广义地说是电磁波信号。这一类信号有三大特点：\n\
    \n1. 直线传播；\n2. 光速传播；\n3. 不依赖具体的介质。\n\n这三大特点就保证了，根据视觉信息的输入，动物能够非常准确和及时地判断物体的位置、大小、运动方向等信息。\n\
    \n甚至在外星球，在宇宙深处，没有大气的地方，视觉信号也是可以发射和采集。\n\n对比起来，嗅觉和味觉系统，它们感知的是具体的化学物质。\n"
