    # 人类大脑


    ![](img/d52f43ea52294dd9949052def724b433_46_0.png)


    你好，我是王立铭，欢迎来到生命科学50讲。


    今天是分工的最后一讲，也是我们课程上 半场部分的最后一讲。在前面的四个单元 里，你从物质到能量，再到自我复制和细胞 分工，我们已经知道了如何构造一个单细胞
    生命。


    在分工这个单元里，我们在逐步学习怎么 建造一个多细胞复杂生物。这一讲，是分工 的收官，我想给你讲代表了细胞分工合作最 高水平的作品—人类的大脑。


    你可能对它习以为常，觉得它人人都有， 很普通。但是，在我看来，它其实是所有地 球生命体内最复杂、最精巧的一个器官。


