    原来，虽然镰刀红胞症是一种很重的疾病，但导致它发的基因突变竟然是最好的办法。它可助防治疟。


    你可能不知道，在1985年，一疟病于和霍乱素。一埃及一，一南一印度是一带种最可怕的疾病。南的历太大约存能于古代。中国的皇也一一点北死。


