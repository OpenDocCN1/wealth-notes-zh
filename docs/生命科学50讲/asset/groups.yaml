    回到我们最开始的问题：生命为什么选择用离子浓度差这种看起来节外生枝的方法，来制造能量货币，而不是直接用简明扼要化学反应呢？


    也许一个答案是这样的：并不是今天的地球生命不约而同地选择了这种方式，反而是这种方式催生了地球生命的出现。


