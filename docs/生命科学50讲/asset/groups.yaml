    ## 43 | 镜子里的自我


    ![](img/d52f43ea52294dd9949052def724b433_80_0.png)


    你好，欢迎来到生命科学50讲，我是王立铭。


    今天是我们第九个单元的第一课。我想先问你一个问题：在前面的八个单元里，我们从物质到能量，从单细胞到多细胞，从感觉输入到社会生活，已经讨论了构建生命和智慧的八个元素。


    如果我们在脑海中构建出一个假想的生命，完全具备前面这八个元素，你觉得它已经具有智慧了吗？


    好像还不能。


    比如：我们完全可以假设有这么一台机器。给它通电上，它就能够按照固定的程序开始零件装配，组装出一台和自己完全一样的机器。


    - 它可以利用各种传感器，获得周围世界的很多信息，对零件做储存起来；

    - 它可以通过代码的输入来实现学习；

    - 它还能够和其他机器联网，彼此分工和配合。


    你觉得它拥有智慧吗？


    好像不行。也许你说不出为什么不行，但是我信，你一定会觉得那里有点不对劲。


    这样的机器似乎今天我们也有能力设计制造，但是这样的机器和咱们人类，似乎差距还不是那么一点点，这就是讨论智慧的麻烦。


    曾经有个美国最高法院的大法官，说起如何鉴别色情内容，他用了一句话，说这东西很难定义，但是，


    > “我只要看见它，我就知道它是不是。”


    这句话用来形容人类智慧似乎也挺恰当的。给智慧下个确定义决不容易，但是，只要我看看它，我就知道它是不是。


    从这一讲开始，我会跟你一起讨论构成生命的第九个要素——自我意识。


    从这个名字你就能够感觉到，我们要触及人类智能的核心，也是最神秘，人类理解最难的部分。


    意识到自己的存在，意识到自己和周围的世界完全区间，也许是人类智慧和机器之间最本质的区别之一。


    这节课，我们就来讨论关于自我意识的三个最基本的问题：


    1. 自我意识是什么？

    2. 它是人类独有的吗？

    3. 它对生命和智慧的存在有什么意义？


    ## 自我意识并非天生俱来


    先说这第一个问题，自我意识是什么？


    为了回答这个问题，现在请你想想“我是谁？”这个经典的问题。当你听到这个问的这一刻，你脑海中浮现出来的是什么图像？


    所谓自我意识，指的就是这种知道世界上有“我”这么一个独一无二的个体，知道我和世界其他所有人，所有生物，所有东西所有不同的这样一种感觉。


    黑猩猩的反应和人照镜子是一样的；相反，同样的实验如果是一只猕猴来做，就做不到。


    猕猴照镜子的时候，会以为笼子里出现了一只长相怪异的新同伴，会展现出愤怒或者好奇的社会行为。


    这个实验非常简单，但是仔细想想，它的含义是很深刻的。


    能够从镜子里认出自己，首先就说明这个生物是知道自己是自己。它到底是如何判断的，我们留到下一讲再仔细讨论。但是有一点非常关键：


    镜子实验第一次把对自我意识的探讨，从人类推广到了动物世界，从哲学、心理学、语言学范畴，推广到了看得见、摸得着的实验科学领域。


    实际上，有人真的用镜子实验来测试人类的婴儿，发现婴儿也差不多是在一岁半到两岁之间，学会照镜子，知道镜子里出现的是他自己的。这和婴儿熟练使用“我”这个字来造句，恰好是同一个时间段。


    顺便插话，到现在为止，能够通过镜子实验测试的动物一共也只有10多种。其中，大多数确实也是那些人们普遍认为比较聪明，比较智慧的动物，比如：大猩猩、黑猩猩、海豚、鲸鱼、大象。


    但是，居然有一种鸟类也通过了镜子实验，大出人们意料，这种鸟是喜鹊。


    也许喜鹊的体内还隐藏着什么大秘密。当然了，镜子实验也有它天然的缺陷，比如：


    > 很容易想到，如果有一种视觉不发达的动物，哪怕再有帮助，也不太可能通过镜子实验——它可能根本就什么都看不清嘛。


    我们言归正传。不管镜子实验本身是不是还存在很多问题，但是有了镜子实验这个武器，特别是，既然不少动物也和人类一样，能通过镜子实验的测试，科学家就知道，自我意识并不是人类独有的，我们也可以对自我意识展开科学研究了。


    ## 自我意识让行为有目的


    最后，我们得解决第三个问题：为什么会有自我意识？自我意识有什么用？


    关于这个问题，很遗憾，我没有办法回答，因为科学界还没有明确的答案。


    在这里，我忍不住要感慨几句。


    > 很多人都觉得科学家是非常博学的人，其实错了。实际上，科学家可能是最值得人类无知的人。


    我常常感叹，与浩渺的宇宙、复杂的生命相比，我们人类已经掌握的知识实在是少得可怜。


    许多看似平淡无奇的现象背后，只要你多问几个为什么，你就会很快遭遇到你已经知道的知识边界，这里面也包括“我是谁”，“自我意识有什么用”这些问题。


    回到我们的主题，关于自我意识的功能，我们还没有能力给出进化论上的合理解释。在这里，我只想针对人类的自我意识，提出我自己的一一个假说：


    > 行为来说，我的认为，自我意识的出现给出了行为清晰的自的，让智慧生命能拥有更复杂的功能和情感。


    我来解释一下。


    我们知道，人类的大脑有很多基础的功能，比如：我们讨论过的感觉、学习、和社会；


    还包括一些生死攸关的功能，比如：控制呼吸、心跳和体温，感受饥饿，体会恐惧和愤怒等等。


    这些功能不是人类特有的，许多简单得多的动物大脑，甚至很多昆虫的大脑，都或多或少具备了这些功能。它们能帮助动物更好地躲避危险、延续生命、繁殖后代。


    但是，有一些更加复杂的生命功能，比如：着羞耻、成就感、好奇心和责任感，如果脱离开自我意识，是很难想象的。比如：


    - 羞耻感的本源，是意识到“我”做错了坏事；

    - 成就感的本源，是意识到“我”做好了一件事；

    - 本质感，是意识到“我”必须做什么事，等等。


    > 换句话说，生物的生存和演化没有目的，但是自我意识的出现，让智慧生命的行为第一次产生了清晰的自的。


    这些复杂的情感和认知体验，在很大程度上，就是智慧生命发达社会，乃至走出家园，探索世界的动力。


    所以，我们放眼宇宙，假设真存在和人类一样，甚至比人类高级得多的智慧生命体，我也有充分的自信，说他们一定也拥有自我意识。


    这就是我“为什么要有自我意识？”这个问题的一点个人看法。


    讲到这里，我来总结一下这一讲的内容。


    这一讲，我尝试回答了关于自我意识的三个基本问题：


    1. 它是什么？

    2. 它是人类所独有的吗？

    3. 它对生命和智慧有何意义？


    简单来说，自我意识有清晰的物质基础，是大脑中孕育出的一种实实在在的能力。镜子实验告诉我们，自我意识不是人类所独有的。


    而关于它存在的意义，虽然科学界没有明确的答案，但是我认为，正是自我意识的出现，才给了行为清晰的目的，让智慧生命能拥有更复杂的功能和情感。


    既然自我意识非常重要，又确实存在实在的生物学基础，那我们当然希望搞清楚它到底是怎么回事，是怎么装进大脑里的。


    下一讲，我们继续讨论这个问题。


    我们下讲见。


    ![](img/d52f43ea52294dd9949052def724b433_81_0.png)


    ## 44 | 自我意识的基础：镜像神经元


    ![](img/d52f43ea52294dd9949052def724b433_82_0.png)


    你好，欢迎来到生命科学50讲，我是王立铭。我们继续讨论自我意识的生物学。


    上节课，我们回答了自我意识三个最基本的问题：自我意识是什么？它是人类独有的吗？它对生命和智慧的存在有什么意义？


    这一节课，我们就来讨论一个更深层次的问题：自我意识的生物学科解释到底是什么？


    我先给出一个简单的回答——自我意识的生物学基础，可能是大脑里一群特殊的神经细胞，叫做镜像神经元。


    我用了“可能”这个词，是因为一直到今天，关于自我意识的神经生物学基础，关于镜像神经元在中间起的作用，仍然是一个争论不休的话题。


    我们甚至对大脑中到底存在多少镜像神经元，它们主要分布在哪儿，它们的生物学本质是什么，都非常不清楚。


    因此，一个非常有趣的现象是：关于镜像神经元，存在一种科学发现，多种表述，所谓“一科各家”的情况。


    特别乐观的人会认为，它是塑造人类智慧的最重要的物质基础；特别悲观的人会认为，它是上个世纪神经生物学最大的谎言。


    咱们的课程到现在，还是第一次遇到类似的情况：这样的困惑在整个生物学，乃至整个自然科学里面都很少见。


    ## 黑手党实验：自我意识的新思路


    在介绍镜像神经元这个概念之前，我想先带你来思考一个问题：请你闭上眼瞎想想一下，当你自己照镜子的时候，你到底是如何判断出镜子里的那个形象，就是我们自己的？


    你可能会说这太简单了，通过照片，通过录像，我就知道自己长什么样子了。当我在镜子里看到过一个长得一模一样的人的时候，我知道那就是自己。


    但你仔细想想，可能就发现自己一个解释站不住脚。


    在照片发明之前，在肖像画发明之前，甚至在镜子发明之前，普通人其实是不可能提前知道自己长什么样子了。更不要说放在著名的镜子实验当中，黑猩猩是从来没有使用过镜子的。


    但即便如此，你把它第一次拉到一面镜子面前，它仍然可以准确地识别出，镜子里的这个形象就是它自己。这种识别过程是怎么发生的呢？


    我设计了一个全新的思想实验，来和你一起讨论这个问题。我给它取了一个好听的名字——“黑手党实验”。


    假设我找一二十个高矮胖瘦和你差不多的人围在你周围，每个人都穿一样的衣服，戴一样的帽子，戴墨镜，穿着黑风衣，绑着左腕手套，一副黑手党的打扮。


    然后，你们十个人同时对着照一面大镜子，这个时候，你还能不能知道镜子里到底哪个人是你呢？


    你还是有办法的。


    比如：你偷着地做几个小动作，转动一下眼珠，皱一下眉头，扭一扭腰，就会马上知道，镜子里面在同时做同样动作的人，必然是你自己。


    这个假设的黑手党实验，其实提供了一个解释自我意识的简单思路。


    什么意思呢？


    根据这个实验你会发现，自我意识的产生，需要综合两方面的信息。


    一方面，需要采集你外部世界的信息输入，比如：看到你镜子里到底是谁正在转眼珠、皱眉头、扭腰；


    而另一方面，同时需要采集关于自身的信息输入，得知道我自己现在也正在转眼珠、皱眉头、扭腰。


    如果两方面的信息在时空上高度吻合，我们就会产生一个“这就是我”的想法，就能顺利通过镜子测试。也就是说，我们客观上也拥有了自我意识。


    这里或许也有点得意劲，没关系，我再说得更具体一些：如果想象我们的大脑中存在这样的一些神经细胞，它能够同时检测到外部世界的感觉输入和来自身体内部的感受输入。


    如果两种输入很吻合，它就会产生类似的反应。那这群神经细胞的活动，就有可能是自我意识的生物学基础。


    ## 镜像神经元：可能的生物学基础


    那么，根据黑手党实验提供的这个解释自我意识的思路，我们大脑中到底有没有这样的神经细胞呢？


    还真有，这就是所谓的镜像神经元。这种神经细胞由上个世纪90年代初，意大利神经生理学家里佐拉蒂（Giacomo Rizzolatti）发现的。


    他当时正在研究猴子的大脑是如何控制躯体运动的，于是，他就把非常细的电极，插入猴子大脑里专门负责运动的那块区域，来记录神经细胞的电传信号。


    他发现，猴子的脑皮层有这么一些神经细胞，在猴子伸手去抓桌子上放着的花生时，就会产生强烈的电信号。


    紧接着，当他看到花生，是负责做实验的科学家去抓桌上的花生，猴脑皮层里的这些神经细胞，也同样会产生强烈的电信号。


    这也太有意思了。


    也就是说，猴子大脑中有一群细胞，会而且只会对两种相互对应，但性质截然不同的事情起反应：


    - 第一种，是猴子自己在做某件事情的时候；

    - 第二种，是猴子看见别人在做同样一件事情的时候。


    这个现象其实很像照镜子的过程。正因为这些神经细胞，会对互为镜像的两种印象产生类似的反应，所以里佐拉蒂就叫它镜像神经元。


    结合我们刚刚的讨论，这群镜像神经元好像天然就能和以自我意识联系起来。因为它确实具备了对外在世界的感知和外在世界的印象，联系在一起的威力。


    在过去20年里，对于镜像神经元的功能有各种各样的研究。


    比较保守的推测认为，它们可能能够帮助我们更好地理解他人的行为。而更激进的猜测则是认知同他、共情能力等等。当然还有最高级的自我意识。


    当然，这些假设也收获了非常多的反对意见。有些人甚至完全不相信，真的存在一群特殊的镜像神经元。


    因为，直到今天为止，人类判断一个神经细胞是不是镜像神经元，唯一的方法就是扎入一根电极，看看它对镜子和外界的同样动作产生类似的反应。


    我们也不知道这些神经元分布在大脑的哪些。实际上，在大脑的很多区域，据说都发现了镜像神经元存在。但是，又没有哪一个地方集中出现得很多镜像神经元。


    我们也不知道这种神经元长什么样子，表达什么样的蛋白质，有什么的功能。


    我们甚至都不能确定，人类的大脑中有没有类似的神经细胞。毕竟，我们没办法在大脑里面扎入电极做实验。


    一个更好的反驳意见，镜像神经元理论一个非常让人担忧的假设，那就是这些


    有一个非常让人迷惑的假设，那就是这些神经细胞能看懂别的动物的动作。


    比如：我们回到里佐拉发现镜像神经元的那个实验里，猴子的神经细胞会对拈花生这个动作发生反应。但是，如果科学家仅仅是挥挥手摸摸头，它就不会有反应。


    也就是说，这些神经细胞能一眼判断出这个科学家的动作是什么，是不是冲着花生去的。


    这个判断涉及到非常复杂的心理活动，很难想象一个孤零零的神经学自己是怎么做到的。


    当然，科学史上惊人的发现也多得是，但是请切记一句老话：惊人的说法需要更惊人的证据。


    而至少在镜像神经元这个例子里面，人类科学家能拿得出手的证据，实是少得可怜。


    所以，关于镜像神经元，关于自我意识的争论，还将持续很长时间。


    ## 吃药片的机器人：人工创造自我意识


    前面我们已经讨论了黑手克实验和镜像神经元，如果你们哪里不太清楚，建议你以后可以再听一遍。


    现在，我们可以暂且不管镜像神经元是不是真的，能不能解释自我意识，黑手克实验和镜像神经元的研究，本身就能提示一种人工创造自我意识的思路。


    说到底，黑手克实验和镜像神经元，都是在说需要通过能够同时进行自我状态检测，和外部环境监测的功能。


    在一个机器人上建造这样的功能并没有什么技术门槛。比如：


    - 可以在机器人的每个机械关节上安装传感器，检测身体的扭动角度和运动状态；

    - 同时安装一个摄像头，检测外部世界的运动；

    - 然后再用一块芯片接受两方面的信息，实时对两方面的输入进行比较就可以了。


    在2015年，真的有一位来自美国伦斯勒理工学院的科学家用类似的思路，做出了一个具备“自我意识”的机器人。当然，这里的“自我意识”和人类的自我意识之间，还是有天壤之别的。


    在他的实验里，三个能够编程的机器人组形成了一个简单的任务场景。


    每次任务开始的时候，科学家会随机地从三个机器人中选择两个，让它们吃下一个机器人失去意识会告诉它的，另一个机器人吃的则是一个不会有任何作用的假药片。


    当然了，实际上研究者做的事情，是在代码层面激活了两个机器人的静音功能而已。


    然后，研究人员会问这三个机器人一个问题：你吃的是真药还是假药？


    两个吃了真药的机器人自然是没法开口回答了，剩下一个一切正常的机器人的反应特别有趣，它会首先回答“我不知道”。


    这其实是一个理性的决定，因为它确实没有能力，预判出自己吃下的那个药片是真的还是假的。


    但是，接下来非常神奇的事情就发生了。这个机器人在说完“我不知道”这句话之后，马上修改了自己的答案，说“我就是那个吃了假药的人”。


    ![](img/d52f43ea52294dd9949052def724b433_83_0.png)


    这个实验背后的逻辑，实际上和我们讨论的黑手克实验原理，还有大脑中的镜像神经元，是非常相似的。


    因为，这个机器人恰恰是在说出“我不知道”这句话之后，才立刻意识到自己实际上是可以在说话的，因此，它自己就是那个吃下假药片的机器人。


    在这个实验中，机器人就需要像大脑中的镜像神经元一样，一方面采集自我状态——也就是自己有没有在说话；另一方面采集外部状态——也就是它有没有听到自己发出的声音。


    它对这两个信息进行比较之后，就得出了一个结论：自己是能够说话的。


    所以，至少从这个简单任务的表现上说，机器人的这个能力，确实和人类的自我意识有异曲同工之妙。


    或者反过来，不管镜像神经元是否存，镜像神经元的逻辑，都可以用来给人工智能和机器人安装自我意识。


    这个新闻当时炒得炒得蛮热，还有不少媒体表达了惊讶的心情——连这么简单的机器人都知道自己是谁了。


    当然，严肃地说，我们似乎还不用太过惊讶。这个机器人完成的任务，只需要输入几行简单的程序语言就可以了。它所实现的自我意识——如果真的是可以叫做自我意识的话，相比咱们人类还是非常粗浅的。


    而且，它的自我意识也仅仅能用来解决这个预设好的任务场景，不会自己出现，也不能自由拓展。


    总结一下，今天我们讲了一个很有意思的主题，那就是自我意识可能的生物学基础——镜像神经元。


    我们先从黑手克实验里找到了解释自我意识的思路，然后了解了镜像神经元。这种细胞能够对自身的动作和观察到的动作产生类似反应，确实有点像能够触发自我意识的一种神经细胞。


    最后，我们还考虑了怎么人工创造出一个具有自我意识的机器人。


    相比机器人，咱们人类确实很厉害。不需要外界的程序输入，就能够从无到有的，在大脑中发育出丰富的自我意识。


    你知道这个进程在人类大脑中是如何发生的吗？我们下节课会继续讨论这个问题。


    ### 留一道思考题


    我们开头提过，镜像神经元是比较少见的，存在巨大争议，甚至一科各表的科学概念。你还知道有什么别的科学发现，直到今天还有巨大争议吗？欢迎在留言区分享。


    我们下一讲见。


    ## 镜像神经元


    乐观的人认为它是帮助人类智慧最重要的物质基础，悲观的人认为它是一个世纪神经生物学最大的谎言。


    ![](img/d52f43ea52294dd9949052def724b433_83_1.png)


