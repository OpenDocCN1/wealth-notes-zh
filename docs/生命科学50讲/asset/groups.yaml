    ## 自我意识


    所以，根据类似的一些研究，人脑中的某些特定部位，比如内侧前额叶皮层，就很有可能就参与了自我意识的构建。


    这个假设似乎听起来挺有道理的，特别是考虑到这个大脑区域在人类当中不成比例地增大了，而且远比其他哺乳动物大得多。


    不过，问题肯定没有我们描述得这么简单。


    内侧前额叶皮层是挺大的一块区域，在这个区域内部，到底什么东西扮演了超级观众的角色，生成了自我意识？在神经细胞的层面，自我意识又是怎么一种生成方式？


    这些问题我们仍然连头绪都还没有。更要命的是，人脑的可塑性还非常大，比如：


    在2012年就有科学家发现，有一位遭受了严重颅外伤的病人，大脑中的内侧前额叶皮层几乎完全被毁掉了，记忆力也所剩无几，但是，他的自我意识却没有受到任何影响，仍然可以顺利地通过镜子实验。


    所以，自我意识这个超级观众不光又顽固又灵活，它还可以在大脑中随时搬家。这就让我们真正理解人类的自我意识，变得更困难了。


    ### 自我意识的疾病：多重人格


    如果你觉得刚刚我们讲的自我意识，已经非常复杂，难以研究，那么接下来我要说的，会让自我意识的研究变得雪上加霜。当然，你也可能觉得更加有趣。


    我想说的是一种叫做解离型人格障碍的疾病，也就是大家常说的多重人格。


    在这节课开头，我们已经讨论过，自我是不能被复制的。哪怕复制技术再精确，同一个自我也不能分别居住在两个人的身体里。


    但有意思的是，反过来的情形却有可能发生。


    在多重人格患者的头脑中，可能同时存在好几个互相独立的自我意识，住着几个观察角度很不一样的超级观众。这些独立的自我意识，能够在不同的时间、地点，轮流统治患者的思想和身体。


    结果就是，这些人一生当中的某些经历，某些场景，可以属于其中的一个我；而另一些经历，另一些场景则属于另外一个我。


    这几个自我之间，可能世界观、人格特质、情绪控制能力都特别的不一样。


    更奇怪的是，多重人格可能还是一种挺常见的疾病，甚至有医生认为，有多达1%的人都患有这种疾病。


    一个特别著名的例子，是一个叫比利·密立根（Billy Milligan）的美国人。他在1977年的时候，因为强奸和抢劫被起诉，但是很快，他的心理医生就发现他是一个典型的，具有多重人格的人。


    事实上，心理学家们在密立根的身体里，发现了24个互相独立的自我意识。


    这24个独立的自我意识各自起了不同的名字，他们的性别、年龄、口音、动作习惯、暴力倾向都非常不同。


    举两个比较极端的例子。


    - 有一个自我意识，名字叫亚瑟，他是一个受过高等教育，在科学和医学方面很有造诣的英国男人；

    - 而另一个自我意识叫阿龙纳拉，是一个十九岁的女同性恋，会做饭，还会写诗。


    而密立根的辩护律师，最后成功地让陪审团相信，在密立根犯下罪行的时候，是他体内的其他几个自我意识在起作用。所以在庭审结束的时候，密立根被裁定无罪释放了。


    这个案子在当年的美国引起了轩然大波，也把自我意识这个充满未来，带有哲学色彩的话题，带到了普通老百姓的视野里。


    所以讨论到这里，我们可以对人类的自我意识做一个简单的画像了。


    毫无疑问，直到今天，它仍然具备很多难以理解的属性。


    - 它很顽固，能将一切外部世界挡在自我之外；

    - 它也很灵活，能随时容纳我发生的任何经历；

    - 它经常居住在一个叫内侧前额叶皮层的大区域中，但是它可以随时搬家；

    - 它大多数时候是独立的、唯一的，但是在少数情况下，又居然能变出好多同类，居住在一个大脑里。


    相比我们之前单节讨论过的很多生物学问题，自我意识显然的确非常重要，但是它的生物学本质却依然混沌不明，可能需要很多年的继续研究，才能真正被揭示。


    ## 本章总结


    （A）自我意识是什么？


    自我意识是意识到“我”的存在的能力，能够知道“我”和其他生物是不同的。它具备物质基础。


    （B）自我意识的物质基础是什么？


    镜像神经元是可能的物质基础。它可以把对自己的感觉，和对外在世界的感觉联系在一起。


    （C）如何检验自我意识的存在？


    大脑的内侧前额叶皮层的细胞，在思考与自己相关的问题时，会更加的活跃。核磁共振成像法可以捕捉到这种变化。


    （D）自我意识是人类独有的吗？


    不是。能通过镜子实验测试，也就是能从根本上认识自己的动物，包括大猩猩、黑猩猩、海豚、鲸鱼、大象、喜鹊等。


    ## 46 | 自由意志，最重要的幻觉


    你好，欢迎来到生命科学50讲，我是王立铭。


    从这一讲开始，我们讨论构造生命和智慧的最后三个元素——自由意志。


    我猜，你肯定有这样的时刻：做错了件事，或者说着了一句，你就想，要是时光能倒转，一切都能重新来该多好。这样，我就能有意识地避免自己犯这样的错误了。


    听起来这个愿望很自然是吧？但是我要是听到这句，假设时光真的能倒转，你就真的能改变原来你的决定吗？


    我不太残忍地告诉你，现实很可能是，不管时间倒转多少遍，你做的事都不能改变。你说的那句话，你错的那件事，仍将会坚定不移地延续下去。


    为什么呢？


    这就需要提到我们这个单元的核心概念——自由意志了。


    这一讲，我们先来回答两个问题：


    1. 自由意志到底是什么？

    2. 自由意志存在与否，会对人类社会产生多大的影响？


    ### 自由意志是什么？


    首先，我们来着什么是自由意志。


    围绕自由意志这件事，人类哲学家已经进行了超过两千年的思考和争论，光是自由意志这个的定义，都可以讨论很久。


    当然了，在生命科学50讲里，不需要太过纠结这个问题的复杂。


    为了简单起见，我们就把它有一个比较通俗的解释：我们一个人，是否能够自主决定自己此时此刻的思想和行为。


    或者换个法，某个时刻下表现出来的一切具体的思想或行为，到底是谁决定？是自由意志，还是早已被决定好了？


    你也许觉得“早就被决定好了”这个概念比较难得，不过想一想就懂了。这句话的意思是，你的思想或者行为，是在此之前发生过的所有事情，叠加在一起带来的必然结果。


    所有事情包括你的遗传基因、生活经历、做决定之前的外部环境、吃没吃晚饭、精神好不好、心情如何、面前的人穿红色还是绿色、等等。


    所有这些因素加和起来，造就了一个无可更改的决定。


    以此类推，如果这个人其实也没有自由意志，无法控制自己的行为，比如他是一个严重的精神分裂症患者，那我们追究他的责任，就和给那把枪判刑一样毫无道理了。


    我们继续往前推进一步。如果有一天我们发现，所有人，不管看起来多理性多聪明，其实根本不拥有自由意志，那怎么办？


    如果扣扳机这个行为，其实是这个人身上携带的遗传物质，是他从小到大的生活经历，是他在事发当天的吃喝拉撒，所有这些因素在一起，共同做出的一个无可更改的决定。那么，他和那枪一样，只不过是一个无辜的执行者而已。


    这样一来，我们好像也不能对这个判刑了。那么，人类好像不管干什么，都不需要承担道德和法律责任了，人类社会的秩序该怎么维持下去呢？


    前面我们讨论了如果不存在自由意志，那么人类的骄傲会荡然无存，我们的现有的道德和法律体系也会崩塌。


    如果你觉得这已经很棒了，那么，接下来我还想说一个更严重的后果，那就是全人类将丧失前进的动力。


    如果没有自由意志，那每个人还需不需要努力让自己变得更更好？这些事还有意义吗？而如果真的每人都失去了自我约束和进步的动力，整个人类社会又会多么恐怖、多绝望呢？


    事实上，还真有人设计过实验来证明，相信自由意志的存在，是很重要的感觉。


    2008年，美国明尼苏达大学的研究者就设计了这么一个实验：


    他们把受试者分成两半，一半的人，阅读一些文字材料，内容是自由意志并不存在，一切都注定的；而另一半人阅读的是和这个话题无关的材料。


    阅读时间结束之后，两组人都要接受同样的考试和测验。


    结果研究者发现，前面那组人受到了提前暗示，觉得自由意志可能真不存在，而他们确实更容易在考试中作弊，偷看答案，或者偷偷多拿不属于自己。


    这个实验本身，当然是没法证明自由意志到底存不存在，但是，它生动地说明，「我拥有自由意志」这个感觉，对维持人类世界的正常秩序有多么重要。


    换句话说，自由意志就算是个幻觉，也是一个美好的幻觉，一个非常重要的幻觉。


    ### 希望不等于真实


    说到这儿，我想泼一盆冷水给你。


    并不是我们希望有的东西，它就一定真实存在。梦想成真，只不过是某些美好的愿望而已。这样的例子，在人类科学史上已经出现过太多次了。


    - 我们曾认为地球是宇宙的中心，很多的星辰都围绕地球转。这个模型很和谐，因为人类和这个世界都是上帝创造的，所以肯定位于中心，日月星辰都围转我们。但是，哥白尼的日心说给了人类当头一棒；

    - 我们曾认为人类是上帝的恩宠，是上帝根据自己的模样制造出来的。但是，达尔文的进化论又给我们致命一击：我们和黑猩猩之间的，遗传物质相似度高达98.8%，与其说我们像想象中的上帝，还不如说我们更像黑猩猩。


    科学的发现，已经无数次把人类从宇宙中心、唯我独尊的神圣地位上给拽了下来，但是，人类照样好好地活着。这些科学发现反而成了人类力量和智慧的证明。


    所以，就算有一天，科学真能证明自由意志不存在，人类的行为也是某些因素暗中操控的，我相信，也无非是历史又重演了一回而已。


    至于在此之后，各个国家的法律怎么执行，人类社会的秩序怎么维持，那就不是生命科学本身能解决的问题了。


    总结一下。在这一讲里，我们讨论了自由意志这个概念的含义，以及自由意志存在与否，会对人类社会的秩序、法律和道德产生多大的影响。


    我得承认，这一讲的内容实际上没有涉及到自由意志的生物学的，这些讨论是想给你提前做好精神准备。


    在这里，我想给你留个思考题：这一讲我们讨论了如果自由意志不存在，会对现有的道德和法律体系造成什么影响。


    那么，我想请你思考一下，如果自由意志不存在，对你的个人生活和人生选择会有什么影响？欢迎你留言分享给大家。


    在接下来的三节课里，我将从三个不同的方向讨论自由意志的生物学，来论证自由意志是否存在。


    我们下讲再见。


