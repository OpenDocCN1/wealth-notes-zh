    这些区域在现代人类中显著地扩张增大了。而这种现象的变化背后，也许是一个名叫FOXP2的基因。


    至今有两个证据可以说明这一点：


    - 第一，这个基因一旦出现故障，病人说话就会含糊不清，颠三倒四。

    - 第二，尽管有不少动物体内也有版本不一的FOXP2基因，但是人体当中的FOXP2版本非常年轻，可能也就是10-20万年，比人类出现的时间还晚。


    所以你听，也许是FOXP2基因的突变，导致了大脑言语区域的扩张，给我们带来了独特的语言能力，帮助我们建立了人类文明。


    ### 人类文明第二特质：自我意识


    接下来，我们说说自我意识。


    自我意识，听起来好像有点玄乎。所谓自我意识，指的就是知道世界上有“我”这么一个独一无二的存在，知道我和其他所有人、所有生物、所有东西都不同，这么一种认知。


    必须得说，人类看起来并不是唯一一种拥有自我意识的动物。如果在动物面前放一面镜子，除了人类之外，还有十来种动物也能准确地认出它自己，包括黑猩猩，也包括海豚和大象，甚至还有喜鹊。


    自我意识是一种至关重要的能力。


    一台机器人可以干活，可以联网，也可以通过程序输入来学习，但是人类世界的许多情感，比如自豪感、责任感、羞耻感，离不开对我们的认知的关联。


    生物的生存和演化本来没有目的，但是自我意识的出现，让智慧生命的作为第一次产生了清晰的目的性，让智慧生命发展壮大。


    和语言一样，自我意识也一定藏身在人类大脑当中。


    近年来的研究告诉我们，也许大脑中一个叫内侧前额叶皮层的区域，对于自我意识的形成很关键。


    当我们在脑中精心思考有关我的问题的时候，比如我喜欢干什么，我的朋友是谁，这根区域就会异常活跃。而人类大脑里的内侧前额叶皮层，也确实要比我们的灵长类亲戚大出太多了。


    结合这些证据来看，也许这个听起来有点虚无缥缈的“我”的感觉，就以某种方式，藏身在大脑内侧前额叶皮层里。而这种方式至今我们仍然一无所知。


    ### 人类文明第三特质：自由意志


    最后，我们再来说自由意志。


    也许你觉得这个词听起来，跟我们刚听说的“自我意识”有点像，但它们其实是两个很不一样的概念。


    自我意识，是能意识到世界上有一个独一无二的“我”的存在。而自由意志呢？重点在“自由”两个字。简单来说，就是能够自主决定此时此刻的思想和行为。


    自由意志这种感受，可以说代表了人类最深层的自豪感。


    我们为自己、为自己的智慧和聪明感到骄傲，归根到底，是因为我们认为，这一切都是我们自发、自主、自由地创造出来的。


    反过来说，没有自由意志的火箭，显然不会觉得探索太空有什么意义；没有自由意志的手枪，就容易被坏人当做武器，也就不需要人去立法约束了。


    不过，近年来的生物学研究，在极大地动摇自由意志的存在基础。


    你的生存本能，你的遗传特质，甚至你大脑神经细胞的自主活动，都可能会在你还没有意识到的时候，为你准备好行动预谋。自由意志，只是一个幻觉而已。


    但是我仍然要说，即便如此，这还可能是一种最美好、也最重要的幻觉。


    你肯定也有过这样的经历：当你自己设定一个目标，然后完成它的时候，你会获得成就感和心情非常好；如果同样一个目标，是别人要求去做，那结果很可能就完全不同了。


    大脑中古老的奖赏中枢，结合自由意志这种有力量的人类独有的感受，会产生前所未有的力量。


    自由意志的一个作用，就是给我们的好奇心和探索精神，赋予更大的意义，让我们在面对自己探索未知的时候，会感到更大的快感和成就感。


    说到这儿，我必须停一下。


    说到底，关于语言，自我意识，自由意志，我们的了解仍然比较有限，我们大概能猜到，哪些大脑区域可能和他们有关，但是到现在到底人体当中什么基因，什么细胞，通过怎样的信号网络创造了这些能力，我们还处于一知半解中。


    但是，这三种能力结合在一起产生的威力是无比巨大的。


    自我意识可能并非人类独有，至少我们的近亲黑猩猩就有类似的能力。自我意识加自由意志，就让人类智能有了自由探索世界、主宰地球的主动力，也许就是这种动力让我们走出非洲，甚至飞向宇宙。


    而自我意识加人类独特的语言能力，人类就创造出源自自身想象的精神载体，特别是艺术，科学，宗教。由此建立想象的共同体，发展出社会与国家，而三者相加，人类文明便在一瞬间绽放开来。


    所以，在我看来，语言，自我意识和自由意志，就是人类之所以如此与众不同的原因。


    必须得说，关于它们仍然充满未解之谜，这背后的生物学原理，很可能会是这个世纪、甚至下个世纪神经科学家们始终关注的焦点。


    但是，与此同时我也相信，面对这些复杂、抽象的概念，人类不需要动用神秘主义的力量来求得安慰。它们一定隐藏在大脑深处，一定源自我们的基因，一定与我们的生理结构相关，也一定伴随着我们的诞生，历经了几十万年进化历程的洗礼。


    所有这一切，我们终将揭晓。


    最后，我来预告一下，在《生命科学50讲》这门课的下半部分，我会展开探讨智慧之源的讨论，包括演化、学习、社交、自我意识和自由意志。如果说这门课的上半部分，我带你了解生命的结构和力量，那下半部分，我会和你一起探索人类智慧的绝佳风景。


    我们下节再见。


    # 特别放送 | 万维钢回答：人工智能主导的“正确”世界，才是最可怕的


    **王立铭**


    你好。


    昨天我回答了万维钢老师一个关于“基因演化”的问题，同时也向方老师请教了一个“智慧演化”的问题，今天就分享一下方老师对这个问题的回答。


    请万维钢老师的问题是：


    人类智演化终点，是不是让机器和算法接管一切？未来一万年有可以自利产权什么？


    我们都知道，在千百万年前基本权利的时候，在面对巨大力量，比如洪水猛兽或者猛兽时，人类是没有反抗能力的。而现在的我们，可以轻易地让机器人和算法接管一切。


    这当然不是坏事，但是问题是，如果人类把权利让出去了，谁来保证这些权利不被滥用？如果人类失去了判断力，谁来保证我们做出的决定是正确的？这是一个非常深刻的问题，也是我最困惑的地方。


    **万维钢老师的回复如下：**


    王老师这个问题是我们这些讲书人都很关心的。我最近也在思考这个问题，今天跟你分享一下我的看法。


    我觉得，如果人类的智演化终点，是机器和算法接管一切，那其实不是坏事。因为人类最大的弱点，就是我们太情绪化、太容易犯错。如果我们把决策交给一个足够理性的系统，那其实是我们人类的一个进步。


    但是，这里有一个非常大的问题，就是“谁来保证这个系统是正确的？”


    如果这个系统本身是有漏洞的，或者被别有用心的人控制了，那我们可能会失去自由，甚至失去生存的权利。所以，我们要保证这个系统是安全的，是符合人类的利益的。


    这需要人类有一定的掌控力，能够随时“刹车”，让这个系统停止运行。这也是为什么我觉得，人类的智演化终点，不应该是完全交给机器，而是人类和机器的结合。


    我们还有一个很重要的问题，就是“什么是正确的？”


    如果机器和算法是“正确的”，那这个“正确”是谁定义的？是人类定义的，还是机器自己定义的？如果是由机器自己定义的，那我们可能会面临一个巨大的风险，那就是机器可能会做出对人类不利的决定。所以，我们需要保证，这个“正确”是由人类定义的，是符合人类利益的。


    我个人的观点是，人类的智演化终点，应该是人类和机器的结合，而不是机器取代人类。人类应该保留一定的掌控力，保证这个系统是安全的，是符合人类利益的。


    希望我的回答能对你有所帮助。


    万维钢


    **王立铭**


    非常感谢万维钢老师的回答，希望我能和维钢老师继续探讨关于演化的理解再深一些。


    一言：我们回到故事里，开始了生命不可分割的第四个要素——细胞。我们下期见。


    # 特别放送 | 接招万维钢：人类的基因是否会发生整体变化？


    **王立铭**


    你好。


    我一直都是个专来挑刺的读者，万维钢老师所写的很多思想，我都爱着盯着。所以我当时听说万老师第一期节目就开讲了他的问题，非常高兴。在上期的节目中，我帮万老师对进化的问题进行了第二次提问。


    今天，我把万老师的提问和我的回答分享出来。明天，也请你关注老师的精彩回答。


    万老师的问题是这样的：


    生物进化的机制是用自然选择淘汰不好的基因而保留下好的基因。自然下，基因就是好的个体拥有更大的生存权和生育权。


    人类进入文明时代，特别是工业革命以来，个人权利与医疗技术的改善，大家改变着，几乎每个人都有同样的生存权和生育权，身体比较虚弱、遗传缺陷的人也可以生育。那么，人类的基因库还会像过去那样发生明显变化吗？


    请回答王老师，自然选择机制是否还在起作用？人类的基因是否会发生整体变化？


    这是一个非常有意思的问题。在文明时代，人类是否还在进化？如果进化，人类会如何进化？


    实际上，我也经常从朋友那里听到类似的疑惑甚至是担忧。借此机会，我也来系统描述一下我的看法。


    这一类疑惑的基础可以归纳为三个递进的问题：


    1. 第一，在没有自然选择压力的时候，生物是否还在进化？

    2. 第二，有没有“好”基因和“坏”基因？

    3. 第三，在文明时代，残酷的自然选择似乎在减弱甚至消失，人类的基因库正在“退化”吗？


    请注意到，前两个问题之所以被提出来，都是因为前面说的没有选择压力。生物就停止了进化。如果说，没有自然选择压力，就停止了进化，那显然就是事实的，但如果“好”基因和“坏”基因可以保留，人类基因库显然就会发生变化。


    我来分别回答这三个问题：


    ## 第一，在没有自然选择压力的时候，生物是否还在进化？


    首先，根据严格的生物学定义，不管有没有自然选择，人类都没有停止进化，也永远不可能停止进化。


    这里这个术语源自英文 *evolution*，翻译成“演化”比“进化”要准确。但无论“演化”还是“进化”，这个词汇本身都没有什么进步或者积极的情感色彩。


    在分子生物学的语境里，演化指的是在一个生物群体当中，随时间推移，基因频率发生变化。这种变化可能是由于自然选择引起的，也可能是由其他因素导致的。


    如果给一群细菌施加抗生素，那么很快，抗药细菌的出现频率就会急剧上升，这是由自然选择驱动的演化。


    有了上面两个问题做铺垫，我们就更容易看清第三个问题的症结所在了：


    ## 第三、在文明时代，残酷的自然选择似乎在减轻甚至消失，那人类的基因库是在变“僵”么？


    当然不是。


    在我看来，恰恰是因为现代文明，因为人类利用科学技术——特别是规模农业、疫苗和抗生素的推广——在很大程度上让我们摆脱了残酷的生存竞争，人类的基因库才有了可以变得更好的奢侈。


    为什么这么说呢？


    请注意我刚才说到的一句话：自然选择的标尺总是变化无常。在40亿年的生命史上，地球环境的变化可能比翻书还快。


    所有你能想到的自然环境参数：气温、湿度、大气氧含量、海水酸碱度、岩石的化学成分、食物、天敌……都在反复不断地沧海桑田。


    曾经的地球被厌氧生物统治，但在山崩地裂般的大氧化事件之后，新生的氧气毒死了几乎所有地球上所有生物；


    曾经的地球被恐龙家族统治，但是在小行星击中尤卡坦半岛之后，反而是原来生活在地洞里延续残端的哺乳动物开始称王称霸。


    而且更要命的是，一种生物越是能够在原来的环境里称王称霸，它的性状可能就越适应了那种生存环境，一旦环境变迁，生存出现危机的首先就是它们。


    所以，想要自己的物种和文明万古长青，人类要做的不是主动去筛选符合一时一地生存要求的特定基因和性状，反而是应该尽可能地保留所有可以保留的基因变异和性状，给未来可能的环境变化做好准备。


    对于人类而言，这种变化可能是星际远航，是人脑联网，是超级细菌，是核战争，是超新星爆发……总而言之，可能比地球环境曾经出现的灾难更加难以预测。


    而更完美的是，人类文明的进步恰恰给这种操作提供了可能性。


    因为农业发展，我们不再需要在野外追逐猎物，所以，我这样的高度近视患者也活了下来；


    因为疫苗和抗生素的出现，像黑死病和天花这样的死亡骑士不再肆虐人类；


    因为辅助生殖和新生儿护理技术的发展，许多原本根本无法出生，或者活不到成年的孩子也都活了下来。


    所有这一切，不光反映了人类文明和道德的进步，不光浸透着人文主义的光辉，而且即使从生物学上说，也为人类的生存尽可能保留了基因层面的火种。


    我还要再次强调一下，基因没有所谓的“好”“坏”之分，在不同的生存环境里，任何一种基因突变都有可能大放光彩。


    说到这，你可能意识到了，基因这东西，实际上和人类的思想有一种微妙的对应关系。


    在思想王国里自然也有主流认为好或者不好的思想，但是思想更重要的是“百花齐放，百家争鸣”。五花八门的思想可以通过碰撞和交流产生新的智慧火花，同时也更是为人类不同时间地点可能出现的困惑和难题提供了思想的军火库。


    我想，罗素那一句名言，“须知参差多态，乃是幸福的本源”，可能对于基因，对于思想，都是成立的。


    好了，简单总结一下我的观点：


    1. 不管有没有自然选择，人类的演化都正在发生，而且从未停止；

    2. 基因永远没有所谓的“好”“坏”之分；


    # 王立铭紧急发声：为什么基因编辑婴儿在今天不可原谅？


    **王立铭** | 生命科学50讲


    就在今天，2018年11月26日，一条科技新闻刷爆朋友圈。


    南方科技大学的生物学家贺建奎在香港接受美联社会访时声称，他的实验室利用一种基因编辑技术，在至少六对夫妇的受精卵上，修改了一个名叫CCR5的基因。并且，其中一个修改后的一对双胞胎女儿已经在这个月出生了！


    贺建奎表示，这种操作能够让这些孩子具有对艾滋病的天然免疫力，这种能力在当今的世界十分罕见。


    如果美联社的新闻属实，那今天是一个注定要载入人类历史的日子。


    有史以来第一例和第二例被人为修改过基因的人类个体，就这样不声不响、无声无息的时候，来到了这个世界上。


    我相信在未来几天，会有更多的技术和监管细节被审查和发布出来，我会和得到的朋友们一起，看看最新消息和有关方面的后续处理办法。但是在第一时间，我想和得到的朋友们分享我的解读和思考。


    必须说明，这条消息让我个人是非常愤怒的。


    我是一个比较熟悉基因编辑领域的生物学家，2016年6月甚至还写了一本专门解读基因编辑技术，书名叫《上帝的手术刀》。


    这项技术仍然充满未知风险。所以，我认为，目前就在人类个体身上尝试基因风险，又几乎没有任何健康好处的研究，不光是不科学的，更是不道德的。这是对人类尊严和科学精神的践踏。


    1


    你可能会很想知道我的愤怒来自哪里。为了说明清楚这一点，我们还是先闪回科学本身来讨论。


    首先得明确，用修改CCR5基因的方法来对抗艾滋病并不是什么新鲜的主意。


    我们知道，艾滋病的发病原因，是一种叫做人类免疫缺陷病毒——简称HIV的感染。


    HIV能够确切识别人体中的某一类免疫细胞，从而杀死这些免疫细胞，从而让患者丧失免疫功能，最终可能会死于严重的感染。请注意，HIV之所以能够识别细胞的感染对象，是借助自己基因中的信息，而它的表面，有一个天然的分子结合桩被HIV借用了。这个分子结合桩就是CCR5基因生产的。


    所以，反过来说，如果人体当中天生就没有这个CCR5基因，那是不是就能天然对艾滋病免疫呢？


    还真是这样，在人类世界里，有1%的北欧人由于基因缺陷的CCR5基因的缺失，从而对艾滋病免疫。


    人类世界里存在的这个天然的艾滋病防御武器，给很多医生和科学家提供了对抗艾滋病的思路。


    比如说，在著名的柏林病人的案例中，同时感染了艾滋病和白血病的美国人蒂莫西·雷·布朗接受了来自CCR5基因缺陷人群的骨髓移植，没想他的白血病和艾滋病竟然被同时治好了！


    就在几年前，美罗华加拿大公司还在研究通过一项骨髓移植技术，人为破坏掉艾滋病病人体的CCR5基因，他们确定也发现，这些病人体内的病毒水平明显降低了。这些案例在我的书里也有详细的讨论。


    患者的子孙后代。这可以看成基因编辑技术最后的防火墙——即使带来了灾难性的后果，也只有患者本人需要承担。


    而现在，这最后一层防火墙被突破了。


    这些接受了基因编辑的孩子，他们身体内携带的、被修改过的基因，将会慢慢融入整个人类群体，成为人类基因库的一部分。这里面当然也包括可能被基因编辑操作贬低误伤的那些基因！


    从这个角度说，这项基因编辑操作的最坏风险是不可控的。人类可能需要很多年、很多代才会发现其后果。


    除了这两层科学上的考虑之外，我们也确实要面对很多更现实的技术性考量。


    在这次实验的审批过程中，是否暴露了相关法律法规的空白或者灰色地带？现在的流程是不是能尽到监管责任和确保监管质量？受试者有没有被明确告知自己接受的是一项什么研究，有什么风险？这项研究在正式接受学术界评审之前就急急忙忙地诉诸媒体，出于什么动机，是合适的做法么？等等等等。


    3


    其实，在科学的考量之上，我还有更深层次的担忧。


    对人类这个物种未来命运的担忧。


    把基因编辑技术从“治疗”推动到“预防”，大大延伸了这项技术的适用范围。一个显而易见的问题就是：基因编辑技术的应用边界在哪里？


    仔细想想，你会发现这条边界非常难以人为划定。


    编辑CCR5基因治疗艾滋病很合理，那提前修改CCR5基因保护自己难道不是人之常情吗？既然如此，一个普通人也希望保护自己的孩子不得艾滋病难道有错吗？


    再退演一步，如果一个人因为自己的1个基因变异，会提高1%的某种疾病的风险，他要求基因编辑降低风险合不合理呢？如果合理的话，那有万分之一的风险能不能做基因编辑呢？百万分之一呢？如果不合理的话，那多大的风险我们觉得应该允许做基因编辑呢？


    而更要命的是，一旦“治疗”和“预防”的边界被打开，“预防”到“改善”的窗户纸更是一捅就破！


    如果一个人想要他/她的孩子获得更多的肌肉，更高的个子，想要金发、双眼皮、高鼻梁怎么办呢？更甚者，如果他/她想要求孩子是高智商、是强大的语言能力、分析能力、领导气质呢？


    如果刚才你还没觉得担忧，现在应该嗅到了巨大的危险了吧？


    尽管今天我们对人类基因的理解仍非常粗糙，对于基因能否决定智商、气质等一些性状，又是怎么决定的问题，还是两眼一抹黑。但我相信总有一天，我们能把这些事情通通搞清楚。


    到那时候，基因编辑技术的推广是不是把人类带向万劫不复的深渊？基因编辑会不会破坏人类基因库的多样性？基因编辑会不会让人类变得千篇一律，毫无特色？更重要的，基因编辑会不会塑造永恒的不平等？


    当然了，人类社会已经充满了各种资源和能力的不平等。我们当然也没有天真到认为这些不平等等会一夜之间消失。但是，这一切至少是有可塑性的。


    # 《王立铭·巡山报告》创刊号


    你好，我是王立铭。


    从今天起，我将开始做一件事：定期梳理发生在我们身边的生命科学大事件，按月发布一份生命科学领域的《巡山报告》。


    这件事的期限是：只要我的头脑还能对你有用，我就将终身坚持。


    不管是当时万众欢呼还是万人唾骂，不管是当时热火朝天还是悄无声息，只要是我觉得值得知晓、应该思考的生命科学大事件，我都会为你整理出来。


    ## 为什么要做这件事呢？


    对于生命科学来说，我们身处一个波澜壮阔的伟大时代。这个大时代当中所有光明和黑暗的角落，都可能对我们每个人、我们所有人产生影响。


    光明是毋庸置疑的。


    - 2003年，人类基因组计划完成，编码人类生命的30亿DNA碱基序列从此大白于天下。

    - 2010年，第一个“人造生命”诞生，它细胞深处的DNA分子完全由人工合成而来。

    - 2013年，美国“脑计划”启动，带动世界各国纷纷跟进，人类开始向双耳之间的神秘小宇宙进军。

    - 2018年，诺贝尔奖授予癌症免疫疗法，正式标志着人类拥有一种对抗肿瘤之王的革命性武器。


    不少科学家乐观地估计，到21世纪末，人类的平均寿命将达到100岁。我们有理由乐观，在我们这代人的有生之年，生物科学的进步将彻底重塑我们的身体状况、生活方式，乃至社会结构。


    但是伴随着光明，生物医学也陷入了前所未有的怀疑和危机当中。


    - 2015年，《华尔街日报》的一篇报道揭穿了百亿美金独角兽公司Theranos的真相，医学检测领域的一个当代传奇轰然倒地。

    - 2018年，哈佛大学宣布撤回31篇围绕心脏干细胞的研究论文，宣告这个红火了几十年的前沿研究领域是个彻头彻尾的骗局。

    - 就在刚刚过去的这几个月里，接连发生的“基因编辑婴儿”和“疟疾疫苗”新闻事件，又在拷问我们，狂飙突进的生命科学研究究竟有无伦理和监督的边界。


    而在这一切的背后，还隐藏着一个更深刻的疑问：关于每个人类个体、关于人类这个物种、关于人类的未来，我们究竟能做什么，我们又不能做什么？


    而更要命的是，因为专业的天然门槛，因为传播中的扭曲，因为人性和理性的天然对抗，面对着可能交织着光明和黑暗的未来，可能大多数人的反应会相当迟钝。


    我想，我们特别需要的，是一点专业判断，再加上一点历史感和文献视角。我们需要习惯把当下许许多多正在发生的科学事件，放到更大的时空尺度里去冷静分析，看清楚它对可能对我们每个人，对我们所有人，意味着什么。


    这就是这份“巡山报告”的由来。


    我坚持，这份报告输出的，不是情绪，而是硬核观点；


    我坚持，这份报告体现的，不是新闻价值，而是文献价值。


    我坚持，这份报告要做到：


    - 用书写历史档案的态度，来记录当下发生的历史，不抢新闻，不追热点；

    - 观点可能会犯，但事实绝不造假，如果发现错误，一定及时公开承认和修正；

    - 永久免费，并且，为了保证观点的客观公正，不接受行业内的商业赞助或商业合作，不接受人情干扰。


    哦对了，这么件郑重其事的大事，为什么要叫“巡山报告”？


    倒也没有什么特别的原因。只是我们都觉得，在生物演化的伟大力量面前，在人类探索的伟大热情面前，我们都没有资格称自己打了什么上常规机。


    我们能做的，就是守住承诺，做个老老实实的巡山小妖，带你一起兜兜转转，看遍这个波澜壮阔的伟大时代。


    当然了，如果巡山的官路上碰到什么妖魔鬼怪，我也绝对不会客气。只要是招架不住，也一定要亮亮锋头。毕竟，作为生命科学这片山林的原住民，守护她的纯净和美好，也是小妖义不容辞的责任。


    最后，特别感谢得到App的支持，让我不以不理论，专心于内容生产。


    这份报告会在每月6号定期发布，遇到重大事件，也会随时增加号外。另外，这份报告产生的系统思考，我也会定期整理在得到App发布，你可以随时去调阅。


    2019年3月6日，我将正式发布《王立铭，巡山报告》第一期。我们来聊聊刚刚发生的一个医学大新闻。下午6点见。

