    所以，根据类似的一些研究，人脑中的某些特定部位，比如内侧前额叶皮层，就很有可能就参与了自我意识的构建。


    这个假设似乎听起来挺有道理的，特别是考虑到这个大脑区域在人类当中不成比例地增大了，而且远比其他哺乳动物大得多。


    ![](img/d52f43ea52294dd9949052def724b433_85_0.png)


    不过，问题肯定没有我们描述得这么简单。


    内侧前额叶皮层是挺大的一块区域，在这个区域内部，到底什么东西扮演了超级观众的区角，生成了自我意识？在神经细胞的层面，自我意识又是怎么一种生成方式？


    这些问题我们仍然连头绪都还没有。更要命的是，人脑的可塑性还非常大，比如：


    在2012年就有科学家发现，有一位遭受了严重颅外伤的病人，大脑中的内侧前额叶皮层几乎完全被毁掉了，记忆力也所剩无几，但是，他的自我意识却没有受到任何影响，仍然可以顺利地通过镜子实验。


    所以，自我意识这个超级观众不光又顽固又灵活，它还可以在大脑中随时搬家。这就让我们真正理解人类的自我意识，变得更困难了。


    # 自我意识的疾病：多重人格


    如果你觉得刚刚我们讲的自我意识，已经非常复杂，难以研究，那么接下来我要说的，会让自我意识的研究变得雪上加霜。当然，你也可能觉得更加有趣。


    我想说的是一种叫做解离型人格障碍的疾病，也就是大家常说的多重人格。


    在这节课开头，我们已经讨论过，自我是不能被复制的。哪怕复制技术再精确，同一个自我也不能分别居住在两个人的身体里。


    但有意思的是，反过来的情形却有可能发生。


    在多重人格患者的头脑中，可能同时存在好几个互相独立的自我意识，住着几个观察角度很不一样的超级观众。这些独立的自我意识，能够在不同的时间、地点，轮流统治患者的思想和身体。


    结果就是，这些人一生当中的某些经历，某些场景，可以属于其中的一个我；而另一些经历，另一些场景则属于另外一个我。


    这几个自我之间，可能世界观、人格特质、情绪控制能力都特别的不一样。


    更奇怪的是，多重人格可能还是一种挺常见的疾病，甚至有医生认为，有多达1%的人都患有这种疾病。


    一个特别著名的例子，是一个叫比利·密立根（Billy Milligan）的美国人。他在1977年的时候，因为强奸和抢劫被起诉，但是很快，他的心理医生就发现他是一个典型的，具有多重人格的人。


    事实上，心理学家们在密立根的身体里，发现了24个互相独立的自我意识。


    这24个独立的自我意识各自起了不同的名字，他们的性别、年龄、口音、动作习惯、暴力倾向都非常不同。


    举两个比较极端的例子。


    有一个自我意识，名字叫亚瑟，他是一个受过高等教育，在科学和医学方面很有造诣的英国男人；


    而另一个自我意识叫阿龙纳拉，是一个十九岁的女同性恋，会做饭，还会写诗。


    而密立根的辩护律师，最后成功地让陪审团相信，在密立根犯下罪行的时候，是他体内的其他几个自我意识在起作用。所以在庭审结束的时候，密立根被裁定无罪释放了。


    这个案子在当年的美国引起了轩然大波，也把我意识这个充满未来，带有哲学色彩的话题，带到了普通老百姓的视野里。


    所以讨论到这里，我们可以对人类的自我意识做一个简单的画像了。


    毫无疑问，直到今天，它仍然具备很多难以理解的属性。


    它很顽固，能将一切外部世界挡在自我之外；


    它也很灵活，能随时容纳我发生的任何经历；


    它经常居住在一个叫内侧前额叶皮层的大区域中，但是它可以随时搬家；


    它大多数时候是独立的、唯一的，但是在少数情况下，又居然能变出好多同类，居住在一个大脑里。


    相比我们之前单节讨论过的很多生物学问题，自我意识显然的确非常重要，但是它的生物学本质却依然混沌不明，可能需要很多年的继续研究，才能真正被揭示。


    # 本章总结


    ![](img/d52f43ea52294dd9949052def724b433_85_1.png)


    （A）自我意识是什么？


    自我意识是意识到“我”的存在的能力，能够知道“我”和其他生物是不同的。它具备物质基础。


    （B）自我意识的物质基础是什么？


    镜像神经元是可能的物质基础。它可以把对自己的感觉，和对外在世界的感觉联系在一起。


    （C）如何检验自我意识的存在？


    大脑的内侧前额叶皮层的细胞，在思考与自己相关的问题时，会更加的活跃。核磁共振成像法可以捕捉到这种变化。


    （D）自我意识是人类独有的吗？


    不是。能通过镜子实验测试，也就是能从根本上认识自己的动物，包括大猩猩、黑猩猩、海豚、鲸鱼、大象、喜鹊等。'
