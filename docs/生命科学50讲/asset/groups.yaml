    # 知，90个不？ 纵生

    新抑郁药上市意味着什么？


    王立铭·生命科学50讲


    # 【重大新闻】


    2019年5月5日，美国食品药品监管管理局（FDA）正式批准了美国强生公司的一款新药Spravato。


    这款鼻喷雾型的抗抑郁新药，结合口服抗抑郁药效果，可以用来试图缓解用至少两种抗抑郁药患者——也就是尝试过至少两种抗抑郁药治疗但没有明显作用的患者。


    ![](img/d52f43ea52294dd9949052def724b433_104_0.png)


    对于全世界饱受抑郁症困扰的3.5亿患者来说，这种药物的上市有着重要的历史意义。在著名的抗抑郁药百忧解（Prozac）1987年上市之后的三十多年来，Spravato是第一个拥有全新治疗机理的抗抑郁新药，丰富了人类对抗精神疾病的武器储备。


    相比传统的抗抑郁药，Spravato最显著的优点是起效快：使用数小时之内就有显著的抗抑郁效果。患者或研究员显示，用药40分钟后就会显著降低抑郁症患者的自杀倾向，而传统的口服抗抑郁药往往需要几周时间才能体现出治疗效果。


    但Spravato的短板也非常明显：长期抗抑郁效果仍待更多的进一步的研究和证实，还可能引发诸如幻觉、认知障碍、药物成瘾在内的副作用。


    因此，FDA在批准Spravato上市时也附加了一些限制条件，特别是要求患者必须在认证过的医疗机构中，在医生监督下使用这种药物，保留24小时之后才可以离开，这当然大大增加了这种药物的推广难度。


    但无论如何，强生公司仍然对旗下这款新药寄予厚望，预测上市后的峰值销售额有望达到每年10亿美元。


    这种新药目前还未在国内上市，但是强生公司已经于2018年5月在国内开展了三期临床试验，这也意味着如果一切顺利，Spravato可能会在未来几年内登陆国内市场。


    借Spravato上市的契机，我来和你一起梳理这种药物的开发和上市历程，以及人类对抗精神疾病的历史和未来的。


    # 【深度解读】


    # 1.这款新药到底是什么？


    必须说明，这款新药的开发和上市过程中涉及非常多点。梳理这些历史，我们也看到医学、商业和利益之间复杂的竞争过程。


    严格来说，Spravato其实不能被称作一款完全全的“新”药。这种药物当中有效成分是一种小分子化学物质，右旋氯胺酮。而它脱胎于一种拥有悠久历史和传奇色彩的老药，氯胺酮。


    ![](img/d52f43ea52294dd9949052def724b433_104_1.png)'
  - '[PAGE 105]


    真相可能会让你垮掉下行。


    所谓右旋氯胺酮，就是氯胺酮的成分之一，也是氯胺酮的一部分。


    人们很早就发现，化学合成的氯胺酮，其实是两种分子的双胞胎：左旋氯胺酮和右旋氯胺酮。人和人的左右手一样，这两种手性物质的化学结构是完全对称的，它们看起来的感觉就像是照镜子一样。


    强生公司利用了這個信息，从氯胺酮当中分离出了右旋氯胺酮的成分，抢先它已经上市了专利，并且把它开发成了新药 Spravato。


    当然，我还是要强调，不管持有多多专利，强生公司 的产品线是受 到法律保护 的，这也给了他们足够的商业动力去 推动 Spravato 的开发。


    在 过去的 几年 中 强生 公司 已经 让 “新” 药做过 了 几轮 临床 试验， 证明 它 有效 不 难， 也能 够 有 效地 治疗 抑郁症 患者 的 这一种
    疾病。 因此， 就在 2019 年 3 月 5 日， Spravato 获得 了美国 FDA 的批准 正式 上市。


    30 年来 第一款 全新 的 抗抑郁 药， 就这样 登上 了历史 舞台。


    ![](img/d52f43ea52294dd9949052def724b433_105_0.png)


    # 2.新版旧药的Spravato，还有什么特殊价值吗？


    看到这，你可能已经有有点不耐烦了吧？


    既然 所谓 的 新药 Spravato 就是 这么 个 新老 组合 的 东西， 我们 还有 什么 必要 在 这里 长篇 大论 当成 一件 正经 大事 来 分析
    ？


    别急，事情还没完。


    Spravato 本身 确实 乏善 可陈。 实际上 根据 现有的 临床 数据， 右旋 氯胺 酮 的 治疗 效果 大概率 也 比 不 上 老药 氯胺 酮。 强生
    公司 的 五个 临床 研究 没有 两个 根本 没有 达到 预期 效果， 能否 用来 长期 治疗 抑郁症 患者 也有 很多 未知数。


    与 此 同时， 作为 鼻吸 制剂， Spravato 使用 起来 也 需要 静静 注射 的 鼻吸 喷剂 更 方便 一些， 但也 有 研究 提出， 鼻吸 的
    吸收效 率 要 比 静脉 注射 更 高。 更重要 的 是， 新药 Spravato 的 价格 可能 是 老药 的 十倍 甚至 更多， 单 使用 费 可能 高达
    7 美元！


    也 就是 说， 在 现 有 专利 和 药物 上市 制度 的 保护 下， 研制 者 与 药商 可 以 市售 花 上 十倍 的 价格， 使用 一个 效果 可能
    还有 退步 的 “新”药。 Spravato 上市 这件 事情， 与 其它 某些 科学 和 医学 上的 本 质 突破 不同， 倒 不如 说是 某种 钻空子
    的 商业 策略 的 成功。


    从 这个 角度 出发， 我 很 不 看好 这 款 新药 在 咱们 中国 的 前景。 原因 简单， 中国 医疗 系统 对 氯胺 酮 的 Spravato 买单
    的 还 是 不 那么 严格 监管 下 使用 氯胺 酮 的 抗抑郁 药。 只要 程序 规范、 用量 适当、 收费 合理， 这 完全 是 一件 医生、 患者、
    医保 支付 系统 三 方 受益 的 好事。


    但是 站在 更大 的 时间 尺度 上， 这款 药物 的 上市 还是 有 里程碑 意义 的。 它 的 实现 可能 代表 着 抑郁症 治疗 的 一个 全新 的
    历史 方向。 这 也 是 我 在这 报道 里 报告 Spravato 当 主角 的 原因 所在。


    “30 年来 第一款 全新 的 抗抑郁 药”， 这是 这篇 报道 头条 里 用到 的 词。 这种 形容 丝毫 没有 夸大 其词。


    实际上， 自 1950 年代 最早 的 抗抑郁 药 上市 以来， 人类 对 抗抑郁 药 的 认知 一直 没有 发生过 本质 的 变化， 特别 是 作用 于
    突触 的 分子 调节 模型 几乎 没有 变过。 实 在 已经 等 得 太久了。


    在 过去 半个 多 世纪 里， 世界 各国 先后 批准 了 好几 十种 抗抑郁 药 进入 临床， 但 其实 它们 大多 只是 模仿 药， 花样 繁多， 但
    归根 到底， 它们 只是 调节 着 大脑 中 的 血清素 信号， 对 抑郁症 患者 的 治疗 起 着 相同 的 作用。


    它们 都 是 通过 调节 人 脑 中 某些 神经 信号 分子 的 活动， 比如 血清素 (serotonin)， 对 抗 抑郁 症 的 治疗。 这一 点 我们
    接着 下来 还会 继续 探讨。


    ![](img/d52f43ea52294dd9949052def724b433_105_1.png)'
  - '[PAGE 106]


    说到底，我就可以稍微总结一下第一代抗抑郁药开发的历史大循环了，其实可以简分成三步：


    +   偶然发现，某种药物能够治疗抑郁症（比如异烟肼药丸）；


    部分理解，这种药物的作用机制（比如提高血清素水平）；


    再根据这个机制，开发出更多的抗抑郁药物（比如百忧解）。


    这是第一代抗抑郁药留给我们的历史经验。


    那这个经验能不能照搬，帮助我们开发出新的一代抗抑郁药呢？


    说起来也有意思，和异烟肼药丸一样，氯丙嗪的出场也充满了偶然色彩。


    异烟肼药丸最早是作为结核菌药出现的，而氯丙嗪最早是作为麻醉解毒剂出现的。在医生们发现它们对精神疾病的疗效之后，才被正式引入抑郁症的治疗。


    类似血清素模型的出现，在过去的20年里，研究也在持续研究氯丙嗪的作用机制，确实是一些简单粗暴，但却被广泛接受的模型。


    比如说，氯丙嗪能够抑制，可能和人脑中另一个神经信号分子——谷氨酸（glutamate，有关联系，至今Spravato，强生公司也已证明，它和氯丙嗪一样，能提升大脑谷氨酸的活跃度。


    这么看的话，第二代抗抑郁药开发的历史大循环已经开始步第一位了：


    +   偶然发现，某种药物能够治疗抑郁症（比如氯胺酮）；


    部分理解，这种药物的作用机制（比如提高谷氨酸活跃度）；


    再根据这个机制，开发出更多的抗抑郁药物（比如Spravato）。


    基于这个逻辑，不少药企在过去几年纷纷杀入抗抑郁药开发的战场。截至目前，有大约20个采用类似工作机理的药物（特别是针对NMDA受体和GABA受体的药物），正在各地接受临床试验。


    展望未来，以Spravato上市为标志，我们很快会迎来第二代抗抑郁药扎堆上市的一波小高潮。从第一代抗抑郁药的角度来看，会迎来一次重大的扩充和升级。


    # 4.既如此，那更遥远的未来，人类能很快彻底解决抑郁症吗？


    不太可能。这条新路仍然布满荆棘。


    武腾库的分歧虽然对人类好有很多很乐观地一边，但，人类对抑郁症还是有很长的路要走。甚至有可能，我们至今都还还没走在正确的方向上！


    为了说明上面的悲观根源所在，我们先重新回顾一下非经典药物开发的两个历史大循环。


    第一代药物：


    +   偶然发现，某种药物能够治疗抑郁症（比如异烟肼药丸）；


    部分理解，这种药物的作用机制（比如提高血清素水平）；


    再根据这个机制，开发出更多的抗抑郁药物（比如百忧解）。


    第二代药物：


    +   偶然发现，某种药物能够治疗抑郁症（比如氯胺酮）；


    部分理解，这种药物的作用机制（比如提高谷氨酸活跃度）；


    再根据这个机制，开发出更多的抗抑郁药物（比如Spravato）。


    两次大循环非常相似，这也是为什么有人说第二代抗抑郁药的出现就是历史大循环的开端，屠格涅夫一场悲剧。


    但很麻烦，两个偶然发现，都是先有针对性地寻求和开发，让人类拥有了先后两代抗抑郁药。这是真味着，我们可能会无法预测出人类什么时候会第三次走运，完全无法预测第三代抗抑郁药要到何时年月才能到来。


    而另一方面，在作用机制部分，我们是用了一部分，这个惨痛循环。


    读到这直到今天，人们也不承认自己真地理解抑郁症的科学本质，理解了两代抗抑郁药到底是怎么起效的。血清素和谷氨酸假说饱受质疑，也是为数不多的反面证据在威胁它们的统治地位。


    不少药物虽然能提升血清素和谷氨酸水平，却并没有治疾的能力。也有少部分药物能够有效治疗，但我们其实不知道它们到底是怎么起作用的。


    作为对比，我们可以看看人类对抗癌症的战场发生了什么。


    在过去10年里，每年FDA都会批准超过10款新型癌症药物上市。癌症的全基因组、全新生学特性，潜在的药理设计起点，更是层出不穷。


    如果说对癌症，人类对抑郁症认知，对情活动、对精神疾病的理解，仍然非常基础。'
  - '[PAGE 107]


    疾病模型；


    再然后，利用这些药物模型，开展药物开发。


    这场革命当然并不容易。毕竟，它的革命对象，可能是整个宇宙里最复杂的单个系统：由860亿个神经细胞、数百万亿个突触构成的大规模并行式的三维信号处理网络。


    这是我悲观思想的真正根源。对大脑秘密的彻底解决，可能很难发生在一两代人之间。而这可能也就意味着，精神疾病对人类的困扰，可能要持续相当长的时间，这些疾病可能要比癌症或者艾滋病更加顽固！


    # 5. 那在未来，精神疾病的药物开发，有没有什么可能的突破口？


    在这儿我可以和你一起开开脑洞，看看精神疾病治疗的下一场革命可能发生在哪里。


    比如说吧，血清素模型也好，谷氨酸模型也好，尽管确实能部分地解释和抑郁症的发病，但它们有一个共同的问题，“粗糙”。用一个分子的浓度来解释复杂的人脑活动状态，这本身就不太可能靠谱。


    这两种信号分子在人脑当中，其实是有非常精密的时空分布和动态变化的。


    如果它们的参与人类情绪状态的控制，那也一定是在某个大脑区域，某种神经细胞当中，通过某些特别的信号机制，影响到大脑的某些特殊功能实现的。所有这些细节问题都必须首先要得到解决。


    在接下来的5年到10年内，我期待人类能在更精确的时空尺度上认识这些神经信号分子的作用原理：它们究竟在大脑中的哪个区域、哪些特定的神经细胞中存在？在人情绪状态发生变化时，它们又是在人脑的哪些神经细胞和神经网络当中发生了变化？它们具体发生了什么变化，是合成速度、分解速度、响应敏感度，还是别的参数？想要治疗精神疾病，我们应该在什么时候、哪里、如何去操纵相关的神经网络？


    也许等这些问题都有了一些新的答案后，我们会有更多的抓手，去对付人类精神疾病。


    过去几年里，浙江大学医学院胡海岚教授的实验室在这个方面就取得了很大的成就。我们不妨以他们的研究发现为例，来看看未来可能的模样。


    2018年初，胡海岚实验室在《自然》杂志发表了两篇研究论文，为氟胺酮抗抑郁的机制提供了新解释。他们发现，动物大脑中一个特殊的区域——名叫“外侧缰核”，可能和抑郁症的发病有关。


    在抑郁小鼠当中，通过两个特殊的蛋白质分子（T-VSCC和NMDA受体，这两个具体的名字你可以忽略），这个小小小的大脑区域出现了异常的快速放电现象。而反过来，他们发现，氯胺酮之所以能够抗抑郁，可能也是通过抑制这种快速放电现象。


    ![](img/d52f43ea52294dd9949052def724b433_107_0.png)


    当然我必须强调，胡海岚他们的研究只是抑郁症发病和氯胺酮治病可能的机制之一。关于复杂的人脑工作，现像还会有哪个模型能够彻底解释现有现象。但是他们的研究完美验证了上面我们的讨论：人类对抑郁症和抗抑郁药物的理解，必须逐渐走向精确。


    本来我们对氯胺酮的认识，仅仅是一个信号分子受体的激动剂，现在我们的目光可以聚焦到特定的人脑区域，某种特定神经细胞的活动，甚至是某个特殊蛋白质分子身上。


    顺着这样的思路推演，也许未来治疗抑郁症和其他的精神疾病，医生们会开出一张非常精确的“药方”：用某个药物精确地结合大脑里某一个特殊的蛋白质分子；用一种药物传送系统把药物精确地投放到某个特殊的大脑区域；用一种医疗器械精确地精准大脑某些特殊的神经细胞；用一种操纵方法精确地改变神经细胞的活动方式，等等。


    这一切当然都不容易，但超级难题也意味着巨大的机会。当年我自己投身神经科学研究，吸引我的可能就是这样的巨大挑战和机遇。说句有点私心的话，我也很期待会有更多的聪明头脑，投入这场注定艰苦卓绝，但却充满惊喜的漫漫长征当中。


    # 抑郁症药物演化图


    发现 -> 机制 -> 代表性药物


