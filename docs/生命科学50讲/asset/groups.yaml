    ![](img/d52f43ea52294dd9949052def724b433_21_0.png)


    打个比方：


    如果3个相邻的碱基是ATG，对应的就是一个氨基酸；


    如果是AAG，那对应的就是赖氨酸；


    如果是6个碱基，ATG AAG连起来，对应的就是一个氨基酸，后面连一个赖氨酸。


    就这么简单。


    不管这一段DNA分子是扭曲还是拉直，是在活动还是锁死，碱基分子之间的先后顺序是不会发生变化的，永远都是ATG AAG。所以，它所携带的信息也是不会变化的，对应的永远就是这两个氨基酸连在一起。


    这就像是你抄写一篇文言文，不管你是钢笔抄还是铅笔抄，是横着写还是竖着写，是顺着抄还是倒着抄，从单位信息复制和传递的角度，你做的事情是完全一样的。


    这样一来，任何一个三维空间里复杂的蛋白质分子，它的全部信息，也就是它所有氨基酸分子的排列顺序，都可以被记录在一条一维线性的DNA分子长链上。


    那为什么复制一根一维线性的分子，比复制三维分子机器要容易得多呢？


    如果你还有点迷糊，那我就再打一个比方：


    想要精细地复制一个蛋白质，就像是你给一台机器，让它反向工程。先把机器里面每一个细节都搞清楚，然后再从无到有地制造出一个完全一样的机器，因难度可想而知。


    但是复制DNA就像是给你一本机器的制造手册，只要你每个字符都抄对，手册里的信息就是完好无损的，这当然就简单多了。


    这就是我所说的降维打击的概念。有了这个概念，我们就可以设计出生命的2.0版本。


    在这个版本上，除了执行具体生命活动任务的蛋白质分子机器，还有一套忠实记录这些分子机器制造信息的DNA分子。


    在生命2.0需要自我复制的时候，它就不需要去操心三维尺度的复制问题了，它只需要复制一维尺度的DNA分子就可以了，所有的遗传信息都在DNA分子上。


    生命完成自我复制以后，在它的子孙后代的身体里，这条DNA分子就可以按照3个碱基对应1个氨基酸的规则，重新制造蛋白质分子机器，新的生命就可以照常运转了。


    其实，DNA分子作为遗传信息的载体，不光能够实现降维打击，而且还有两个别的好处。


    首先是精确性。DNA复制的时候，精度是非常高的，高到复制10亿次才会出错1次。这就像是为了遗传信息能够很可靠地代代相传，而偶然出现的错误呢，恰好又能给生物的变异和适应环境提供可能性。


    其次它很节约，DNA存储信息的效率是非常高的。我提到过，DNA记录信息的方法是3个碱基对应1个氨基酸。你可能会觉得奇怪，为什么一定是3个碱基，不是2个碱基或者4个碱基呢？这里面的道理非常有意思：


    刚才我说过，碱基分子一共是4种，而氨基酸分子一共是20种。我们可以计算一下下怎么编码效率最高：


    首先1个碱基对应1个氨基酸是不够的，因为这样一来，4个碱基也就只能代表4种氨基酸；


    2个碱基对应1个氨基酸也不够，因为两个碱基的排列，一共只有4的2次方，也就是16种组合，还不够20；


    而3个碱基对应一个氨基酸就绰绰有余了——3个碱基可以产生4的3次方，一共64种组合，要比氨基酸的数量大，还提供了几点冗余；


    而如果再去计算，要是4个碱基对应1个氨基酸，那么就会产生4的4次方，共256种组合，这就比氨基酸的数量大了一个数量级，显然是一种浪费。


    | 氨基酸 | 蛋白质 | 组合数 |

    | :---: | :---: | :---: |

    | `[1碱基]` -> `[氨基酸]` -> `[蛋白质]` | 1 | |

    | `[2碱基]` -> `[氨基酸]` -> `[蛋白质]` | 16 | |

    | `[3碱基]` -> `[氨基酸]` -> `[蛋白质]` | 64 | |

    | `[4碱基]` -> `[氨基酸]` -> `[蛋白质]` | 256 | |


    所以，地球生命在用DNA分子记录生物遗传信息的时候，使用的编码原则是恰好够用，但是也不浪费。


    实际上今天也确实有人在试图研究如何用DNA分子来记录人类世界的海量信息，这个方法的存储效率比硬盘和U盘都要高不少。


    总结一下，生命用了一个非常巧妙的方法解决了自己复制的难题，我形象地把它称作DNA的降维打击。在我看来，这是生命繁衍精妙的秘密，也是关于生命最值得收藏的秘密。欢迎你把这个讲分享和你一样热爱生命的朋友们。


    那么接下来，DNA分子在技术层面上是怎么完成复制的？特别是在地球生命出现的早期，生命形式还非常简单，但是遗传信息复制是个非常精密、复杂 的任务，我们的祖先们是怎么做到的呢？


    下节课，我会展开探讨这个看起来不可能完成的任务。


