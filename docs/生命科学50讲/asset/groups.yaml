    # 《王立铭·巡山报告》创刊号


    ![](img/d52f43ea52294dd9949052def724b433_103_0.png)


    你好，我是王立铭。


    从今天起，我将开始做一件事：定期梳理发生在我们身边的生命科学大事件，按月发布一份生命科学领域的《巡山报告》。


    这件事的期限是：只要我的头脑还能对你有用，我就将终身坚持。


    不管是当时万众欢呼还是万人唾骂，不管是当时热火朝天还是悄无声息，只要是 我觉得值得知晓、应该思考的生命科学大事件，我都会为你整理出来。


    # 为什么要做这件事呢？


    对于生命科学来说，我们身处一个波澜壮阔的伟大时代。这个大时代当中所有光明和黑暗的角落，都可能对我们每个人、我们所有人产生影响。


    光明是毋庸置疑的。


    2003年，人类基因组计划完成，编码人类生命的30亿DNA碱基序列从此大白于天下。


    2010年，第一个“人造生命”诞生，它细胞深处的DNA分子完全由人工合成而来。


    2013年，美国“脑计划”启动，带动世界各国纷纷跟进，人类开始向双耳之间的神秘小宇宙进军。


    2018年，诺贝尔奖授予癌症免疫疗法，正式标志着人类拥有一种对抗肿瘤之王的革命性武器。


    不少科学家乐观地估计，到21世纪末，人类的平均寿命将达到100岁。我们有理由乐观，在我们这代人的有生之年，生物科学的进步将彻底重塑我们的身体状况、生活方式，乃至社会结构。


    但是伴随着光明，生物医学也陷入了前所未有的怀疑和危机当中。


    2015年，《华尔街日报》的一篇报道揭穿了百亿美金独角兽公司Theranos的真相，医学检测领域的一个当代传奇轰然倒地。


    2018年，哈佛大学宣布撤回31篇围绕心脏干细胞的研究论文，宣告这个红火了几十 年的前沿研究领域是个彻头彻尾的骗局。


    就在刚刚过去的这几个月里，接连发生的 “基因编辑婴儿” 和 “疟疾疫苗” 新闻 事件，又在拷问我们，狂飙突进的生命科学研究究竟有无伦理和监督的边界。


    而在这一切的背后，还隐藏着一个更深刻的疑问：关于每个人类个体、关于人类这个物种、关于人类的未来，我们究竟能做什么，我们又不能做什么？


    而更要命的是，因为专业的天然门槛，因为传播中的扭曲，因为人性和理性的天然对抗，面对着可能交织着光明和黑暗的未来，可能大多数人的反应会相当迟钝。


    我想，我们特别需要的，是一点专业判断，再加上一点历史感和文献视角。我们需要习惯把当下许许多多正在发生的科学事件，放到更大的时空尺度里去冷静分析，看清楚它对可能对我们每个人，对我们所有人，意味着什么。


    这就是这份“巡山报告”的由来。


    我坚持，这份报告输出的，不是情绪，而是硬核观点；


    我坚持，这份报告体现的，不是新闻价值，而是文献价值。


    我坚持，这份报告要做到：


    用书写历史档案的态度，来记录当下发生的历史，不抢新闻，不追热点；


    观点可能会犯，但事实绝不造假，如果发现错误，一定及时公开承认和修正；


    永久免费，并且，为了保证观点的客观公正，不接受行业内的商业赞助或商业合作，不接受人情干扰。


    哦对了，这么件郑重其事的大事，为什么要叫“巡山报告”？


    倒也没有什么特别的原因。只是我们都觉得，在生物演化的伟大力量面前，在人类探索的伟大热情面前，我们都没有资格称自己打了什么上常规机。


    我们能做的，就是守住承诺，做个老老实实的巡山小妖，带你一起兜兜转转，看遍这个波澜壮阔的伟大时代。


    当然了，如果巡山的官路上碰到什么妖魔鬼怪，我也绝对不会客气。只要是招架不住，也一定要亮亮锋头。毕竟，作为生命科学这片山林的原住民，守护她的纯净和美好，也是小妖义不容辞的责任。


    最后，特别感谢得到App的支持，让我不以不理论，专心于内容生产。


    这份报告会在每月6号定期发布，遇到重大事件，也会随时增加号外。另外，这份报告产生的系统思考，我也会定期整理在得到App发布，你可以随时去调阅。


    2019年3月6日，我将正式发布《王立铭，巡山报告》第一期。我们来聊聊刚刚发生的一个医学大新闻。下午6点见。


