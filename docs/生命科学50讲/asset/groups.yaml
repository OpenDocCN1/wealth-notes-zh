    比如美国心理学家平克（Steven Pinker）就曾提到，一个人的价值倾向，是自由主义还是保守主义，有62%是遗传决定的。


    2015年，英国国王学院有一项研究证明：一个人投票给保守党还是工党，这么一个看起来非常具体的，完全是当事人自己决定的事情，居然也有57%的因素是遗传决定的。


