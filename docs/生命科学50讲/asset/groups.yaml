    ## 活力论：生命是独一无二的特殊物质


    人尽皆知这种现象，给了机械主义致命一击。


    我先做个背景介绍，海胆是一种生活在海洋的球形生物，说不定你在寿司店里还吃过。一个海胆受精卵正常情况下会一分为二，二分为四，四分为八，这样慢慢变多，最终长成一个大海胆。


    杜里舒做了这样一件事，他收集了一分为二、二分为四的海胆胚胎，然后把四个细胞分裂开来单独培养。


    ![](img/d52f43ea52294dd9949052def724b433_5_0.png)


    按照机械论哲学的预测，这四个细胞应该会分别变成海胆的一部分，拼起来才是一个完整海胆。但是实验结果是，四个细胞分别长成了体型较小，但是仍旧形态正常的海胆。


    这太奇怪了。毕竟对于任何一种机械，如果大卸四块的话，肯定立刻停止工作，怎么可能还会变成四个头较小的机械？这种奇怪的现象没办法用机械主义的逻辑来解释。


    但是先别急着悲观，机械论虽然听起来希望不大，但我们要介绍的第三种理论又另辟蹊径。它不再把生命的本质诉诸于物理规律，而是转向了化学。


    这就是我们要介绍的第三种错误认知，我们叫它“活力论”。这个话题要从两个很牛的牛人说起。


    第一个牛人是瑞典化学大师贝采利乌斯（Jöns Jacob Berzelius）。他与道尔顿（John Dalton）、拉瓦锡（Antoine-Laurent
    de Lavoisier）一起被称为现代化学之父。他提出了生命的活力论。


    贝采利乌斯认为，生命之所以是生命，因为它具有一种独特的“活力”性质。而这种活力的来源呢，就是生物体内某些特殊的化学物质。它们只存在于活着的生物体内部，绝不会在自然界凭空出现。


    第二个稍晚一点的牛人巴斯德（Louis Pasteur），是微生物学的开拓者。他第一个研究出了狂犬病疫苗。他发明的消毒方法至今仍被称为巴氏消毒法。


    巴斯德在研究发酵时发现，糖的发酵需要酵母这种微小的单细胞生物参与。所以他 认为，既然只有活酵母才能催化发酵过程，那么反过来，发酵就是只有生命才具备的化学反应。


    也就是说，生命和非生命的界限，可能像发酵这样，是仅能在生命体内发生的化学过程。


    综合两位大牛的看法，我们可以说，他们的理论实际上和亚里士多德的灵魂论有相似之处。


    亚里士多德认为生命现象的出现在于灵魂，而贝采利乌斯和巴斯德认为生命现象的存在，在于它们体内存在特殊的活力物质和活力反应——这就是活力论。


    所以说到这儿你应该看出来了，灵魂论、机械论、活力论，本质上都是生命特殊论。


    他们认为生命现象之所以存在，是因为生命体内存在某种驱动生命现象的东西——比如灵魂，比如机械，比如活力物质。生命和非生命的界限，其实就是这些生命特有的东西。


    但是必须得说，虽然活力论看起来简直就是改头换面的灵魂论，但是和灵魂论不一样的是，活力论可以接受科学实验的检验。


    ## 05 | 烧瓶里的原始地球


    你好，我是王立铭。欢迎来到生命科学50讲。


    在上一讲中，我们介绍了在现代生命科学出现之前，人们对生命体的存在有4种典型的错误认知：神秘主义、机械主义和活力论。


    这三种理论的共同点在于，它们都认为生命现象的出现，是因为生命体内存在某些特殊的东西，要么是灵魂，要么是机械，要么是活力物质。


    对生命有错误认知本身并不奇怪。但奇怪的是，直到19世纪，机械主义和活力论思想，甚至是古老的灵魂论，仍然在欧洲大行其道。


    19世纪，已经是什么时代了？距离牛顿发现万有引力定律都过去了一个半世纪了；而工业革命大爆发，也已经在上个世纪的末了。


    但这时人类甚至都无法理解到是什么构成了自己，什么驱动了生命。解释生命现象，居然还需要动用类似灵魂、活力这样有点不可言说的概念。


    不知道你有没有觉得有点悲哀？面对复杂的生命现象，人类当时的无知远远超过了今天的想象。


    但第一道裂缝总会打开，第一道光终会降临。


    ### 维勒实验：击穿活力论


    放进第一道光的人，是德国化学家弗里德里希·维勒（Friedrich Wohler）。


    有点讽刺的是，维勒只是贝采利乌斯的学生，是那个提出“活力论”的瑞典人。


    咱们先来复习一下“活力论”。它认为，生命之所以是特殊的，是因为生命带有“活力”，而活力来自于生物体内的化学物质和化学反应。这些物质在自然界中找不到，这些反应也不会在自然界中发生。


    但1824年的一个实验改变了一切。


    这一年，维勒试图在实验室中合成一种新的化学物质。实验结果出乎他意料，烧瓶里生成的白色晶体看起来有点陌生。


    实际上，维勒一直到1828年才最终确认这个东西是什么，而这个结果对于贝采利乌斯的学生来说太魔幻了，太难接受了。


    原来，这个东西是尿素。顾名思义，这是一种存在于生物尿液中的东西。长久以来，人们一直认为尿素就是一种典型的活力物质。请注意，维勒的实验里面，两种原料物质都是可以从自然中获取的。


    ![](img/d52f43ea52294dd9949052def724b433_6_0.png)


    所以这个结果说明，生命体内的物质是可以在实验室里从无到有制造出来的，这没有什么特别的。“活力论”的天花板就这样被捅了个大窟窿。


    插个八股。1828年，维勒去世100周年的时候，德国专门发行了一枚邮票纪念维勒的实验，因为这个实验除了成功合成了尿素之外，还有更深远的意义。


    ![](img/d52f43ea52294dd9949052def724b433_6_1.png)


    稍微引申一下，那些传统上认为只有生命体才有的活力物质，居然可以在实验室里很方便地合成。既然如此，地球生命的物质基础好像并没有我们想象的那么神秘。


    顺着这个逻辑往下推演，可能不光是物质，也包括生命体内进行的化学反应，还有生命的结构、繁殖和生存方式，甚至智慧形态存在，也不都是设计什么神秘的，也都能在实验室里面很方便地解剖、分析、甚至制造出来？


    换句话说，就是从维勒实验开始，人们才开始觉得生命现象是可以被揭示、被操纵、甚至是可以被预测和改造的。


    从这时开始，人类科学家真正开始了理解生命现象的探索过程。


    ### 烧瓶里的原始地球：生命物质不特殊


    当然了，不管我们怎么引申维勒实验的结果，尿素毕竟只是一种不复杂生命物质。我们必须要追问一句：构成生命体的核心复杂物质，比如DNA、蛋白质，是不是仍然只有生命才能生产呢？


    如果是，那么似乎可以说生命物质在某些独特性。仅是维勒实验，并没有让“活力论”死去。


    彻底葬送生命特殊论的杀手在1952年出现了，此时距离维勒实验已经过去了128年。


    这个杀手叫斯坦利·米勒（Stanley Miller），这个芝加哥大学上的博士后的人物，对地球生命的起源问题产生了浓厚的兴趣，成功说服了自己的导师，做了一个特别有创意的实验。


    实验本身其实很简单，但野心却非常大。


    米勒模拟远古地球的环境，准备了一个大大的烧瓶，里面灌上水，模拟海洋，然后在烧瓶底下加热，模拟海洋的高温。他在烧瓶里面充上气体，比如甲烷、氨气、氢气，模拟原始的地球大气。除此之外，他还在烧瓶里面充上电，电击发生电火花，模拟远古地球大气上的雷鸣闪电。


    ![](img/d52f43ea52294dd9949052def724b433_6_2.png)


    可想而知，这个实验做起来挺危险的。在烧瓶底部，海洋在不断翻滚，不断冒出水蒸气。与此同时，烧瓶上方则是密布，时不时闪过一个电火花，甚至还有些盆大雨。


    米勒的野心很大，他希望直接检验在远古地球环境中，复杂的生物物质能不能被从无机物直接创造出来。


    这个野心远比合成一种活力物质还要大，它实际上是在检验在地球生命出现之前，地球上所需要的物质，是不是就已经在全球被准备好了。


    结果，实验做了一天，某些奇迹的事就发生了，海洋的颜色已经不再清澈无色的了，而是变成了粉红色，这说明肯定有一些新的化学物质诞生了。


    过了一个星期的化学物，打开烧瓶，检测里面的化合物成分，实验结果把他们惊呆了，原始海洋中居然出现了几种氨基酸。


    氨基酸这个词，大家肯定都不陌生。我们的人体70%之外，含量最多的是各种各样的蛋白质。蛋白质分子构成了我们身体的组织结构，也催化着，而氨基酸呢，就组成蛋白质的最小单位。


    所以，如果我们要给地球生命赋予一种最重要的化学品质的，那氨基酸的当之无愧。说话到了，你就能理解米勒的实验到底有多重要了。


    仅仅是利用地球大气的成分，在短短一周内，就在一烧瓶的小里，生产出几十种氨基酸。你要知道，米勒的时空尺度要比米勒的烧瓶大不知多少倍。


    所以在几十亿年的演化时间尺度上，在面积千万平方公里的广袤海洋里，构成生命的所有氨基酸，乃至化学物质，从逻辑上都应该能被从无到有地制造出来。


    换句话说，我们至少可以从物质构成的角度上，认为地球生命没什么特别之处，使用的都是唾手可得的原材物，这就是米勒实验的重要意义。


    ![](img/d52f43ea52294dd9949052def724b433_7_0.png)


    这里我们必须加个插曲，米勒在1950年代做的实验，其实是有问题的。


    一方面，他当时的化学检测手段还不够灵敏。在他去世之后，他的学生们又一次分析了米勒烧瓶中的化学物质，发现生产出来的氨基酸不止几种，而是多达数十种。


    另一方面，后来的研究发现，远古地球大气中的主要成分可能并不是米勒所用的氢气、氦气、甲烷，反而是二氧化硫，二氧化碳，硫化氢要多一些。


    但是即便如此，用新的大气成分来做米勒实验，同样可以生产出非常多的生命物质。


    所以你看，从尿素合成到米勒实验，人类科学家终于可以说，至少在物质水平，生命没有什么特殊之处，完全可以被我们理解。活力论，甚至是全部的生命特殊论，到这里也就被彻底抛弃了。


    这个时候我特别想提一个人，他是著名的量子物理学家埃尔温·薛定谔。他跨界写过一本生物学科普书《生命是什么》，对生命的本质有精彩的预言，他指出：


    > 尽管复杂的生命体中很可能会涌现出全新的规律，但是这些新规律绝对不会违背物理学规律。


    ![](img/d52f43ea52294dd9949052def724b433_7_1.png)


    他的言论激励了大量物理学家投身生命科学研究，开启了生命科学研究的黄金时代。更厉害的是，此后半个多世纪的生物学突破，也一直在印证薛定谔自信的预言。


    生命现象虽然确实高度复杂和多样，但是在科学原理方面，没什么了不起的。套用一句德国数学家希尔伯特的名言：我们必须知道，我们必将知道。


    ## 太紫总结


    ![](img/d52f43ea52294dd9949052def724b433_7_2.png)


    （A）理解生命物质，人类有过什么错误理论？


    - “三种灵魂”理论：亚里士多德提出，用灵魂解释生命物质的特殊性；

    - 机械论：笛卡儿提出，生命现象可以用简单的机械原理解释；

    - 活力论：认为生命由特殊的活力物质构成，活的生物体内存在独有的生物化学反应。


    结论：三种理论都认为生命物质是特殊的。活力论的不同之处在于，它可以接受科学实验的检验，是人类智慧的一个进步。


    （B）对于生命物质的构成，人类如何获得了科学的理解？


    - 维勒的尿素合成实验：在烧瓶里偶然合成了生命物质—尿素；

    - 米勒的烧瓶实验：在烧瓶里模拟原始地球大气，生成了多种氨基酸。


    结论：这两个实验说明，构成生命的物质材料不是特殊的，而是能够在自然界里生成的。从此，人类对生命物质的理解进入了新时代。


    今天，我们能够欣赏生命的精彩，能够亲手揭开更多生命的神秘，这是过去二三百万年的人类史上，不曾有人享有过的幸运，这是维勒和米勒给全人类的礼物。


    课程进行到这里，我们已经知道了生命物质没有什么特别的。那生命的诞生还需要什么呢？物质已经有了，但是物质简单堆积在一起，好像也不会自然的产生生命。那建筑生命大厦的驱动力从何而来呢？


    下一讲，我会带你进入生命的第2个元素：能量。我们下一讲见。


    ## 生命科学史上最科幻的实验


    米勒的野心很大，他要在烧瓶中模拟原始地球，检验构成生命的物质能否自然产生。实验结果表明，生命没什么特殊的，制造它的原材料在大自然中唾手可得。


    ![](img/d52f43ea52294dd9949052def724b433_7_3.png)


