    # **05 | 烧瓶里的原始地球**


    你好，我是王立铭。欢迎来到生命科学50讲。


    在上一讲中，我们介绍了在现代生命科学出现之前，人们对生命体的存在有4种典型的错误认知：神秘主义、机械主义和活力论。


    这三种理论的共同点在于，它们都认为生命现象的出现，是因为生命体内存在某些特殊的东西，要么是灵魂，要么是机械，要么是活力物质。


    对生命有错误认知本身并不奇怪。但奇怪的是，直到19世纪，机械主义和活力论思想，甚至是古老的灵魂论，仍然在欧洲大行其道。


    19世纪，已经是什么时代了？距离牛顿发现万有引力定律都过去了一个半世纪了；而工业革命大爆发，也已经在上个世纪的末了。


    但这时人类甚至都无法理解到是什么构成了自己，什么驱动了生命。解释生命现象，居然还需要动用类似灵魂、活力这样有点不可言说的概念。


    不知道你有没有啥点得有点悲袁？面对复杂的生命现象，人类当时的无知远远超过了今天的想象。


    但第一道裂缝总会打开，第一道光终会降[临。]


    # **维勒实验：击穿活力论**


    放进第一道[光]的人，是德国化学家弗里德里希·维勒（Friedrich Wohler）。


    有点讽刺的是，维勒只是贝利乌斯的学生，是那个提出“活力论”的瑞典人。


    咱们先来复习一下“活力论”。它认为，生命之所以是特殊的，是因为生命带有“活力”，而活力来自于生物体内的化学物质和化学反应。这些物质在自然界中找不到，这些反应也不会在自然界中发生。


    但1824年的一个实验改变了一切。


    这一年，维勒试图在实验室中合成一种新的化学物质。实验结果出乎他意料，烧瓶里生成的白色晶体看起来有点陌生。


    实际上，维勒一直到1928年[才最终确认]这个东西是什么，而这个结果对于贝利乌斯的学生来说太魔幻了，太难[以接受了。]


    原来，这个东西是尿素。顾名思义，这是一种存在于生物尿液中的东西。长久以来，人们一直认为尿素就是一种典型的活力物质。请注意，维勒的实验里面，两种原料物质都是可以从自然中获取的。


    ![](img/d52f43ea52294dd9949052def724b433_6_0.png)


    所以这个结果说明，生命体内的物质是可以在实验室里从无机到有制造出来的，这什么特别的。“活力论”的天花板就这样被捅了个大窟窿。


