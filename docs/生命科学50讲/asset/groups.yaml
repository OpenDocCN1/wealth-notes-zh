    ## 10 | 生命来自热泉口


    ![](img/d52f43ea52294dd9949052def724b433_16_0.png)


    你好，我是王立铭，欢迎来到生命科学50讲。


    今天能量学的最后一讲。上节课，你知道了生命体系里ATP的过程，在绝大多数时候根本不是典型的化学反应，而是更像水力发电站一样，借助了细胞里面海潮的张力差，借助了氢离子浓度差储存势能，借助了ATP合成酶做微型水力发电机，来制造能量货币。


    上一节，我们学这个答案完美地解决了20世纪最大的生物学谜团——生物的能量来源问题。


    **不过，你有没有好奇过这样一个问题：生命为什么会选择用水力发电站的方式来制造能量货币呢？** 我们说，ATP的使用方法已经显得有点多余了，但是制造ATP的过程好像更多此一举。


    你可以想想，化学反应本来也是可以产生ATP的，而且葡萄糖分解为乳酸的化学反应，已经普遍存在于各种生物体内。


    生命为什么不遵循这种更稳妥、更精确的思路，在葡萄糖一步分解的化学反应中获取能量，制造ATP？难道选择多此一举的办法有什么特别的优势吗？


    这节课，让我来开拓你的脑洞。


    尽管这个问题目前还没有确定的答案，但是近来的一些研究，提供了很有说服力的线索：**制造ATP的方式，并不是被地球生命所普遍选择的，而是这种方式本身催生了地球生命的出现。**


    ### 三十多亿年前的蛋白质分子机器


    我之前提到，进化生物学家们推测出，三四亿年前，LUCA是地球生命的共同祖先。2016年，科学家威廉·马丁分析了现存地球生物6百多个万能的DNA序列，确认了有355个基因广泛存在于主要的生物门类。


    ![](img/d52f43ea52294dd9949052def724b433_16_1.png)


    所以马丁推测，这355个基因应该存在于LUCA体内。并且，因为它们的有极端重要的生物学功能，以至于跨越了三十多亿年的光阴，一直保存至今。


    **而在这355个基因里，就有ATP合成酶基因的身影，就是那个像水力发电机的蛋白质。**


    这是不是说，在地球生命形成的早期，水力发电站的形态就已经形成了，就可利用高强度的离子浓度差来供给能量了呢？


    如果是这样，那就很有意思了。


    这些古细菌能够抵抗滚烫的泉水，而且还能靠泉水从地底深处带出来的化学物质生存。而它们本身也成了天然的食物来源，吸引了更多的生物生成海泉口附近生活，比如软体动物、鱼和虾。


    所以，地球生命的祖先出现在海底热泉口这个说法，现在听起来没有**耸人听闻**了吧？


    > 天然的离子浓度差，为最初的生命提供了最简单的能量获取方式。只需要在一次偶然的机会下，诞生出ATP合成酶，生命的发动机就可以启动了。


    回到我们最开始的问题：生命为什么选择用离子浓度差这种看起来节外生枝的方法，来制造能量货币，而不是直接用简明扼要化学反应呢？


    也许一个答案是这样的：并不是今天的地球生命不约而同地选择了这种方式，反而是这种方式催生了地球生命的出现。


    明白了这一点，我们就能把视野放得更广阔些。


    或许在宇宙深处，生命应该也不罕见。因为不需要阳光，不需要环境适宜，只要存在离子浓度的差别，存在能够阻挡离子流动的物理屏障，生命就有可能诞生。


    很可能，不需要到特别遥远的地方，在我们太阳系某颗星球上，就存在着可以利用离子浓度的原始生命。


    我们回到地球。当生命的祖先掌握了利用离子浓度差制造能量的技能后，同时，他们也就掌握了远离热泉口的能力。因为，他们已经不再需要现成的氢离子浓度差和天然的岩石水坝来制造能量了。


    此时的他们拥有了能够蓄积氢离子的水泵，能够稳定储存氢离子的水坝，能够制造ATP的水力发电机，甚至还能将能量储存在诸如葡萄糖这样的营养物质中长期备用。


    三四亿年弹指一挥间，当今天的你在饱餐一顿出门上班，穿上跑鞋开始运动，坐上飞机飞向远方的时候，在幕后默默支持你的，依旧是氢离子永不停歇的流淌。


    ## 本章总结


    ![](img/d52f43ea52294dd9949052def724b433_17_0.png)


    （A）为什么生命需要能量？


    生命活着需要对抗热力学第二定律，攫取“负熵”，降低自身的混乱程度。


    热力学第二定律是指在封闭系统内，系统的混乱程度只会增大，不会减少。混乱程度用“熵”表示。


    （B）生命是怎么利用能量的？


    太阳光是能量的最终来源，葡萄糖是一切生命储存能量的物质。葡萄糖分解产生能量，供生命使用。


    葡萄糖有两大优势：一、分子结构稳定；二、方便快捷释放能量，因此一切生命都选择葡萄糖作为能量之源。


    （C）既然葡萄糖可以产生能量，为什么还需要“中介”ATP？


    ATP储存能量的单位更小，生产能量的化学反应更易发生。


    ATP与ADP之间极易发生相互转化，从而完成能量的释放和储存，这个过程循环进行，使能量生产和利用更高效。


    （D）产生ATP的过程是什么样的？


    米切尔提出的水电站模型解释了ATP的生产原理。


    葡萄糖分解释放的能量，将离子从低浓度的一侧运到高浓度的一侧，积累势能。然后离子通过ATP合成酶，带动ATP合成酶内的叶片结构转动。每通过3个氢离子，就能带动产生1个ATP分子。


    （E）生命为什么用水电站的方式生产ATP，而不是用化学反应？


    不是生命选择了这种方式，而是这种方式催生了生命的出现。


    在生命早期的自然界中，海底热泉口周围存在天然的离子浓度差，一旦ATP合成酶出现，浓度差就会带动ATP合成酶，用水电站的方式产生ATP，进而为生命提供能量，加速生命的出现。


