    人听闻的现象，给了机械主义致命一击。


    我先做个背景介绍，海胆是一种生活在海洋的球型生物，说不定你在寿司店里还吃过。一个海胆受精卵正常情况下会一分 为二，二分为四，四分为八，这样慢慢变多，最终长成一个大海胆。


    杜里舒做了这样一件事，他收集了已经一 分为二，二分为四的海胆胚胎，然后把四个细胞分裂开来单独培养。


    ![](img/d52f43ea52294dd9949052def724b433_5_0.png)


    按照机械论哲学的预测，这四个细胞应该 会分别变成海胆的一部分，拼起来才是 一个完整海胆。但是实验结果是，四个 细胞分别长成了体型较小，但是仍旧形态正 常的海胆。


    这太奇怪了。毕竟对于任何一种机械，如 果大卸四块的话，肯定立刻停止工作， 怎么可能还会变成四个头较小的机械？ 这种奇怪的现象没办法用机械主义的逻辑 来解释。


    # 活力论：生命是独一无二的特殊物质


    但是先别急着悲观，机械论虽然听起来希 望不大，但我们要介绍的第三种理论又另 辟蹊径。它不再把生命的本质诉诸于物理 规律，而是转向了化学。


    这就是我们要介绍的第三种错误认知，我 们叫它“活力论”。这个话题要从两个很 牛的牛人说起。


    第一个牛人是瑞典化学大师贝采利乌斯 （Jöns Jacob Berzelius）。他与道尔顿 （John Dalton）、拉瓦锡（Antoine- Laurent
    de Lavoisier）一起被称为现代化 学之父。他提出了生命的活力论。


    贝采利乌斯认为，生命之所以是生命，因 为它具有一种独特的“活力”性质。而这 种活力的来源呢，就是生物体内某些特殊 的化学物质。它们只存在于活着的生物体 内部，绝不会在自然界凭空出现。


    第二个稍晚一点牛人巴斯德（Louis Pasteur），是微生物学的开拓者。他第一 个研究出了狂犬病疫苗。他发明的消毒方 法至今仍被称为巴氏消毒法。


    巴斯德在研究发酵时发现，糖的发酵需要 酵母这种微小的单细胞生物参与。所以他 认为，既然只有活酵母才能催化发酵过 程，那么反过来，发酵就是只有生命才具 备的化学反应。


    也就是说，生命和非生命的界限，可能像 发酵这样，是仅能在生命体内发生的化学 过程。


    综合两位大牛的看法，我们可以说，他们 的理论实际上和亚里士多德的灵魂论有相 似之处。


    亚里士多德认为生命现象的出现在于灵 魂，而贝采利乌斯和巴斯德认为生命现象 的存在，在于它们体内存在特殊的活力物 质和活力反应——这就是活力论。


    所以说到这儿你应该看出来了，灵魂论、 机械论、活力论，本质上都是生命特殊论。


    他们认为生命现象之所以存在，是因为生 命体内存在某种驱动生命现象的东西—— 比如灵魂，比如机械，比如活力物质。生 命和非生命的界限，其实就是这些生命特 有的东西。


    但是必须得说，虽然活力论看起来简直就 是改头换面的灵魂论，但是和灵魂论不一 样的是，活力论可以接受科学实验的检验。'
