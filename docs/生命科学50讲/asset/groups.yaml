  - '[PAGE 59]


    可想而知，海兔的鳃对于它的生存，是至关重要的。因此，保护好鳃就成了海兔的头等大事。


    所以，海兔就发展出了一个叫做缩鳃反射的应激应答模式。


    如果海水突然剧烈地冲击在海兔身上，或者如果在水毯毯地撞击海兔，它就会迅速地把鳃尖紧紧卷起来，防止它在海兔身体剧烈变形的时候被伤害。


    这个缩鳃反射如此重要，相对应，它也需要非常稳定和坚固的生物学，也就是刺激—反射模式。


    而且，它简单到只需要两个神经细胞的参与。


    首先，是一个感觉神经细胞，它连接在海兔的水管上。


    如果有海水剧烈地冲击，那么这个神经细胞就能感受到，并且把这种环境刺激转化成一个生物电信号。


    第二，是一个运动神经细胞，它连接在鳃上，可以控制周围肌肉的收缩。


    这个感觉神经细胞和运动神经细胞之间有直接的联络。前者的信号输出端—也就是轴突，和后者的信号接收端—也就是树突之间，能够直接传递电信号。


    这样一来，海兔的这个缩鳃反射理解起来就很简单了。


    海水剧烈波动的时候，前面这个感觉神经细胞就会感觉到海水的冲击，产生一个生物电信号，而这个电信号会输出给后面这个运动神经细胞，因此这个运动神经细胞也会产生电信号，从而能够驱动肌肉收缩，完成缩鳃反射。


    从这个非常经典的案例中可以看到，在动物体内发展出刺激—反射的对应模式，实际上并不难。


    最少只需要两个神经细胞相互连接，一个负责感受，一个负责运动输出，就可以完成此事。


    实际上，即便在人体内，类似的对应模式，可能也并不是需要很复杂的生物学。比如：你可能知道一个叫做膝跳反射的实验，很多时候体检中还会做这样的测试。


    翘起一条腿，用一个小锤子轻轻地敲击膝盖下方，小腿就会不由自主地弹起来。


    在人体中的这样一个反射，实质上也需要两个神经细胞的参与。一个负责感知敲击，一个负责收缩肌肉，抬起小腿。


    ![](img/d52f43ea52294dd9949052def724b433_59_0.png)


    # 刺激—反射模式有两大缺陷


    说到这里，你已经知道了刺激—反射模式的好处和实现方法。听出来，这个模式又有效、又普遍、又简单。


    既然如此，回到这一讲开头的问题：我们为什么还要学习呢？直接用刺激反射来应对外界环境不就行了吗？


    不行，因为略带坏地说，刺激反射模式仍然有两个很大的缺陷。


    第一个缺陷，就是它的局限性。


    因为这样的刺激反射模式，需要动物在出生前、在它的遗传物质DNA里，就必须事先携带能够在脑里制造这种模式的全部遗传信息。比如：


    对于海兔来说，它的DNA里面就必须要有基因告诉海兔，到底在哪儿长一个感觉神经细胞，感觉海水的冲击，又在哪儿需要长一个运动神经细胞，控制鳃的收缩，又要怎么让这两个神经细胞找到彼此，产生连接。


    这样一来，遗传物质能够编码的天生的刺激反射模式就一定是有限，一定只能用来生生死攸关的事情做准备，比如吃的、交配、逃跑、攻击和防御等等。


    我们难以想象，类似于看书、写字、唱歌、画画、演算方程，或者在得到听课这样变化多端的复杂任务，也能预先设置好反应模式。如果这种遗传物质装不下，我们的大脑就装不下。


    第二个缺陷，是刺激—反射模式有盲目性。


    这话是什么意思呢？就是说，在这种模式中，再多次的重复，也无法变成能够积累的经验。


    每次遇到一模一样的刺激，生物体都还是只能机械地重复一模一样的反应。反应错了，它做不到吃一堑长一智；反应对了，它也不会总结出成功经验。


    这是个很大的问题。


    你可以设想一下，如果一只动物永远记不住哪儿才有丰富的食物，哪个配偶比较优，哪儿更少有危险，适应它只能依靠先天的反应模式，每次都要重新寻找，去碰哪里有配偶，它一定活得非常辛苦，非常低效。


    那有什么办法能让动物的行为模式摆脱局限和盲目，能够从容地应对千变万化的地球环境呢？


    有，就是学习。


    在我看来，学习的生物学本质，就是生活经验对天生的刺激—反射模式，进行修饰的过程。


    有学习能力之后，环境对于动物来说，就不再是永恒的陌生和黑暗了。


    我们可以看到，过去通过的经验知道，左边那个山头出现猎物的概率要比右边大，所以，如果饿了的话，应该先去左边看看；它们也可以根据经验知道，接下来可能会有长时间的海浪刺激，所以最好把鳃好好地保护起来。


    这对于智慧生命更重要。只有了学习能力，我们才能有可能掌握自然界从未出现过的新奇的事物，而不是没有准备好的全新技能，比如：看书识字、沟通交流，上天南下海，造汽车、造飞船，以及在得到上听生命科学课。


    所以，在这个单元，我们要集中解决的问题就是：学习能力到底是怎么回事儿？它在我们大脑中是如何发生的？我们能不能提高学习能力？


    今天，我们讲了刺激—反射，讲了我们为什么要学习。下一讲，我们就来着着学习的生物学本质。


    我们下一讲见。


