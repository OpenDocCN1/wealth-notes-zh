    所以，环境中存在感信号的强弱，反映了环境中细菌密度的高低。


    然后，这个存在感信号能反过来重新进入每个细菌的内部，通过一个特殊的生物化学反应，让细菌开始生产荧光素酶。荧光素酶，从名字你就能看出来，是一种能够产生光的蛋白质。


