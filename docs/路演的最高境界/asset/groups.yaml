    ## 第94课：盈利模式14


    ### 赚过路的钱


    顾名思义，钱或者业绩从你这里经过的时候，你抽取一点点。只要有营业额发生，就收取一定比例的费用。


    随着交易量的倍增与持续，这也会变成一笔可观的收益。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 只要公司的体量做大了，赚钱真的很容易！

    > ——诺老师


    中介商家就基本上都属于赚过路的钱，地产中介、二手车中介、招聘中介、贷款中介、相亲平台、网络中介平台。


    连锁加盟店，它们不收管理费，吸引了大部分商家加盟后，会要求提取2%的营业额，这也是过路的钱。


    其实代理赚的也是过路的钱。


    省级代理拿货是40元，市级代理拿货是50元，但市级代理拿货必须到所在省份的省级代理那里去拿，那只要市级代理有营业额，省级代理就稳赚10元。


    这几年流行起来的二级分销、三级分销也是如此。还有直销也是一样，只要下面的人有业绩，上面的人就有钱赚。


    一诺老师的一位亲传弟子叫作张俊，他专门做大品牌的授权业务。有很多产品自己没有品牌，比较难打开市场，他可以帮助你获得白云山制药厂、南京同仁堂等知名品牌的授权。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 只要你的品牌好，

    > 你就可以赚品牌使用费、品牌授权的钱！

    > ——诺老师


    有了知名品牌的信用背书，做市场就容易得多了。


    这时候品牌商收取的费用，就是过路的钱。


    有一些项目，想用直销的方式来做市场，但是自己没有直销牌照，于是就找那些有牌照的直销企业，给该直销企业支付一定的营业额提成，利用他们的牌照来做市场。


    这个有牌照的直销企业赚的也是过路的钱。


    ## 第95课：盈利模式15


    ### 赚挖坑的钱


    马云搭建了一个平台，让大家都可以在上面买东西，但消费者的钱不是直接给到商家，而是先到支付宝里面，等到消费者收到货了确认没问题了，支付宝再把钱给到商家。


    那这些钱会在支付宝里面待多久呢？一般是7天的时间。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 资本的最大成本是时间！

    > ——诺老师


    这就相当于在现金流的旁边挖了一个坑，如果淘宝、天猫、阿里巴巴每天的营业额有50亿元，那么坑里面就有350亿元躺着，只要淘宝、天猫、阿里巴巴平台上的交易持续，这350亿元就可以无限期地被用来做别的事情。


    一诺老师把这种对现金流进行截留的方式叫作——赚挖坑的钱。


    挖坑还有很多种形式，比如有些连锁店把现金统一收上去，按1个月或半个月结算给到各个店；


    收保证金，锁定一年、两年、三年的时间，也会形成一个钱坑；有一些企业采取提货券的做法，买家先付钱，然后给提货券，真正去提货的时候再交货，这个过程也形成一个钱坑。


    千万要注意的是：


    操作的过程里面，千万不要牵着后面人的钱来给前面的人发回报，不然就会变成“庞氏骗局”，那就是违法的了。


    所以，没有系统地学习一诺老师课程的人，很容易踩到法律的禁区。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 人生需要磨难，成功需要教练！

    > ——诺老师


    ## 第96课：盈利模式16


    ### 赚股权的钱


    如果是好的项目，一般不会把原始投入比例作为原始股的股权比例来招募纯投资人。


    根据项目的需要，可以引进技术入股、能力入股、业绩入股等。


    另外，分红股的招募也是一种方式，即只给分红，但没有话语权。


    随着企业的发展，企业的估值会不一样，可以一轮一轮引进投资人与投资机构，我们常说的天使轮、PE轮、IPO以及企业上市后的股权交易等，都属于股权的钱。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 人无股权不富，马无夜草不肥!

    > ——诺老师


    ## 第97课：盈利模式17


    ### 赚信用的钱


    除了股权的钱以外，剩下的融资方式，一诺老师把它们称为信用的钱。


    贷款、信用融资、发行债券、担保抵押、股权质押、融资租赁、银行承兑、资产证券化等，都属于这一类型。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 富人的钱，都不是自己的，

    > 都是借银行和资本家的钱！

    > ——诺老师


    这些呢，都属于金融领域的范围，一诺老师在本书就不作深入探讨了。


    ## 第98课：盈利模式18


    ### 赚投资的钱


    我们把钱放到银行，银行赚到钱后分我们一点，这就是投资的钱。银行把钱贷给企业，企业赚到钱后付利息给银行，这也是投资的钱。


    所有的投资行为，都是赚投资的钱，投资股权、房产、股票、基金、外汇债券、保险等，收益部分就是赚投资的钱。


    另外一种情况是所经营的商品本身具有增值的空间，这也是投资的钱。如果你经营的是电器，那么你的商品会慢慢不值钱，所以，越早清货越好。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 资本的最大成本是时间！

    > ——诺老师


    但如果你经营的是普洱茶、珠宝、玉石、艺术品、白酒等具有收藏价值的商品，那么随着时间的推移，这些商品就会有不同的程度的涨价，时间越长，价值越高。


    到了某一天你把存货变现了，就能获得一大笔资金。


    对于走资本化路线的企业来说，投资的对象更多是上下游，并购上下游，使上游的利润、下游的利润都归自己。


    这样也利于更好地控制成本。


    另外就是并购同行，除了可以解决产能不够的问题外，并购一些有技术的同行还可以使自己的企业实现技术升级。


    以上就是一诺老师的18种赢利方式。


    当你看完一诺老师这18种方式之后，你就已经了解了所有合法赚钱的方式了。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 成功很简单，只要方法正确！

    > ——诺老师


    优秀的企业会把所有能赚钱的方法都用上，比如麦当劳。


    - (1) 产品买卖的钱：汉堡、薯条、汽水

    - (2) 产品涨价的钱：根据市场变化逐年涨价

    - (3) 搭售的钱：套餐、玩具

    - (4) 产品链的钱：全家桶等

    - (5) 重复消费的钱：客户经常去消费

    - (6) 转介绍的钱：客户带朋友去消费

    - (7) 节约成本的钱：统一装修，统一采购机器设备

    - (8) 资源互换的钱：用消费优惠券换取流量

    - (9) 未来的钱：企业一次性购买麦当劳餐券作为礼品赠送

    - (10) 平台规模的钱：因为麦当劳是大品牌，所以，很多商场会以比较低的租金价格吸引它进驻

    - (11) 品牌影响力的钱：麦当劳与相关产业的结合

    - (12) 上游的钱：延长上游供应商的结算周期

    - (13) 下游的钱：收取加盟商的加盟费

    - (14) 过路的钱：收取加盟店的管理费

    - (15) 挖坑的钱：加盟费、管理费等资金沉淀

    - (16) 股权的钱：上市融资

    - (17) 信用的钱：属总部操作，不对外公开

    - (18) 投资的钱：投资物业。麦当劳大部分的店面都是自己买下来的。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 实业是资本的马甲，

    > 因此你看到的未必是真的盈利模式！

    > ——诺老师


    再看看阿里巴巴：


    - (1) 产品买卖的钱：提供淘宝平台，提供网络开店服务

    - (2) 产品涨价的钱：开店的成本越来越高

    - (3) 搭售的钱：商品套餐

    - (4) 产品链的钱：天猫店

    - (5) 重复消费的钱：下载APP进行交易

    - (6) 转介绍的钱：一键分享朋友圈，有效引流

    - (7) 节约成本的钱：强势品牌强势谈判

    - (8) 资源互换的钱：属总部操作，不对外公开

    - (9) 未来的钱：把钱先放到支付宝

    - (10) 平台规模的钱：很多商家在上面打广告

    - (11) 品牌影响力的钱：天猫的开店费用比淘宝要高

    - (12) 上游的钱：商家先发货给买家

    - (13) 下游的钱：买家先把钱打入支付宝

    - (14) 过路的钱：3%-5%的扣点

    - (15) 挖坑的钱：支付宝、开店的保证金

    - (16) 股权的钱：孙正义及其他投资机构投资，纽交所上市融资等

    - (17) 信用的钱：余额宝

    - (18) 投资的钱：投资入股其他互联网企业


    各位，看完了这些案例，我们可以想一想：


    自己企业的赢利模式都有哪些？


    主要的赢利模式又是哪些？


    我们是否可以在赢利点上去进行一些规划？


    我的商业模式可以用什么样的方式来创新一下？


    > 记住一诺老师这句话，顿悟商业真谛！

    > 企业找不到盈利模式，就只有死路一条！

    > ——诺老师


    有一家企业，是做有机粮油的。


    其产品在同类产品中算得上比较高端。


    原来的推广方式是到各个比较有消费能力的小区去摆摊开拓客户，客户下单后送货上门。


    通过2年的时间积累了3000个客户，每个客户每年平均消费2000元左右，年营业总额大概600万元。


    这种商业模式的竞争力怎么样？很弱。


    因为开发客户的成本非常高，需要支付摆摊的租金，人员的工资、提成等；同时客户的黏度也很弱，容易被抢走。


    后来这家企业就对商业模式进行了创新。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 实业是资本的马甲，

    > 因此你看到的未必是真的盈利模式！

    > ——诺老师


    这3000个客户都是有很实力的客户，在银行的活期存款一般都会有10万元以上。


    即便以每个客户有5万元存款来计算，他们加起来也至少会有1.5亿元的存款。如果能够为银行拉去1.5亿元的存款，


    是不是就可以跟银行谈回报的条件？


    假设回报谈到一年5%就是750万元。


    假设普通储户的活期存款年利率为0.35%，那1.5亿元的活期存款的年利息为52.5万元。


    这个时候去跟消费者谈新的合作方案：


    只要他把活期存款转移到指定的银行，一年2000元的粮油就免费送。


    > 记住一诺老师这句话，顿悟商业真谛！

