    ## 第68课：何谓资本路演


    ### 资本路演的形式


    什么是资本路演：其实就是以融资为目的的路演。具体来说就是面对投资人、投资机构，阐述自己的商业想法，说服投资人与投资机构给自己投资的行为。


    资本路演的形式：在企业的初创期，第一笔创业资金可以是几个人合伙共同出资，也可以找身边的朋友去筹集。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 企业的头等大事就是融资！

    > ——一诺老师


    当企业的商业计划已经成型，就可以寻找天使投资人，或是通过一些平台来众筹。


    当企业发展到一定规模，可以找风险投资基金，进行A轮、B轮、C轮、PE轮等融资。


    当企业上市后，则是通过IPO，以及在交易市场出售股票、股权获得资金。


    ### 企业资本路径图


    一诺老师《资本兵法》企业资本路径图


    - P0轮

    - 天使轮

    - A轮

    - B轮

    - C轮

    - PE轮

    - IPO

    - 创业


    ### 为什么要做资本路演


    资本路演会给企业带来的好处主要有两个方面，一个是钱，一个是资源。


    很多人都以为找投资人、投资机构只是简单地融钱，这是一个严重的误区。


    聪明的创业者在选择投资人或投资机构的时候，钱不一定是第一考虑要素，资源才是放在第一位的。


    有的投资机构进来，可以解决市场开拓的问题；有的投资机构进来，可以解决成本降低的问题；有的投资机构进来，可以解决技术的问题。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 投资机构可以帮助解决：

    > 市场开拓、成本降低、技术难题！

    > ——一诺老师


    ### 概括来说，资本路演可以帮助创业者：


    - (1)获得更多资金

    - (2)快速扩大企业规模

    - (3)更好地抓住市场机会

    - (4)横向与纵向并购产业

    - (5)降低现金流压力

    - (6)获得投资人的相关资源


