    ## 第98课：盈利模式18


    ### 赚投资的钱


    我们把钱放到银行，银行赚到钱后分我们一点，这就是投资的钱。银行把钱贷给企业，企业赚到钱后付利息给银行，这也是投资的钱。


    所有的投资行为，都是赚投资的钱，投资股权、房产、股票、基金、外汇债券、保险等，收益部分就是赚投资的钱。


    另外一种情况是所经营的商品本身具有增值的空间，这也是投资的钱。如果你经营的是电器，那么你的商品会慢慢不值钱，所以，越早清货越好。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 资本的最大成本是时间！

    > ——诺老师


    但如果你经营的是普洱茶、珠宝、玉石、艺术品、白酒等具有收藏价值的商品，那么随着时间的推移，这些商品就会有不同的程度的涨价，时间越长，价值越高。


    到了某一天你把存货变现了，就能获得一大笔资金。


    对于走资本化路线的企业来说，投资的对象更多是上下游，并购上下游，使上游的利润、下游的利润都归自己。


    这样也利于更好地控制成本。


    另外就是并购同行，除了可以解决产能不够的问题外，并购一些有技术的同行还可以使自己的企业实现技术升级。


    以上就是一诺老师的18种赢利方式。


    当你看完一诺老师这18种方式之后，你就已经了解了所有合法赚钱的方式了。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 成功很简单，只要方法正确！

    > ——诺老师


    优秀的企业会把所有能赚钱的方法都用上，比如麦当劳。


    - (1) 产品买卖的钱：汉堡、薯条、汽水

    - (2) 产品涨价的钱：根据市场变化逐年涨价

    - (3) 搭售的钱：套餐、玩具

    - (4) 产品链的钱：全家桶等

    - (5) 重复消费的钱：客户经常去消费

    - (6) 转介绍的钱：客户带朋友去消费

    - (7) 节约成本的钱：统一装修，统一采购机器设备

    - (8) 资源互换的钱：用消费优惠券换取流量

    - (9) 未来的钱：企业一次性购买麦当劳餐券作为礼品赠送

    - (10) 平台规模的钱：因为麦当劳是大品牌，所以，很多商场会以比较低的租金价格吸引它进驻

    - (11) 品牌影响力的钱：麦当劳与相关产业的结合

    - (12) 上游的钱：延长上游供应商的结算周期

    - (13) 下游的钱：收取加盟商的加盟费

    - (14) 过路的钱：收取加盟店的管理费

    - (15) 挖坑的钱：加盟费、管理费等资金沉淀

    - (16) 股权的钱：上市融资

    - (17) 信用的钱：属总部操作，不对外公开

    - (18) 投资的钱：投资物业。麦当劳大部分的店面都是自己买下来的。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 实业是资本的马甲，

    > 因此你看到的未必是真的盈利模式！

    > ——诺老师


    再看看阿里巴巴：


    - (1) 产品买卖的钱：提供淘宝平台，提供网络开店服务

    - (2) 产品涨价的钱：开店的成本越来越高

    - (3) 搭售的钱：商品套餐

    - (4) 产品链的钱：天猫店

    - (5) 重复消费的钱：下载APP进行交易

    - (6) 转介绍的钱：一键分享朋友圈，有效引流

    - (7) 节约成本的钱：强势品牌强势谈判

    - (8) 资源互换的钱：属总部操作，不对外公开

    - (9) 未来的钱：把钱先放到支付宝

    - (10) 平台规模的钱：很多商家在上面打广告

    - (11) 品牌影响力的钱：天猫的开店费用比淘宝要高

    - (12) 上游的钱：商家先发货给买家

    - (13) 下游的钱：买家先把钱打入支付宝

    - (14) 过路的钱：3%-5%的扣点

    - (15) 挖坑的钱：支付宝、开店的保证金

    - (16) 股权的钱：孙正义及其他投资机构投资，纽交所上市融资等

    - (17) 信用的钱：余额宝

    - (18) 投资的钱：投资入股其他互联网企业


    各位，看完了这些案例，我们可以想一想：


    自己企业的赢利模式都有哪些？


    主要的赢利模式又是哪些？


    我们是否可以在赢利点上去进行一些规划？


    我的商业模式可以用什么样的方式来创新一下？


    > 记住一诺老师这句话，顿悟商业真谛！

    > 企业找不到盈利模式，就只有死路一条！

    > ——诺老师


    有一家企业，是做有机粮油的。


    其产品在同类产品中算得上比较高端。


    原来的推广方式是到各个比较有消费能力的小区去摆摊开拓客户，客户下单后送货上门。


    通过2年的时间积累了3000个客户，每个客户每年平均消费2000元左右，年营业总额大概600万元。


    这种商业模式的竞争力怎么样？很弱。


    因为开发客户的成本非常高，需要支付摆摊的租金，人员的工资、提成等；同时客户的黏度也很弱，容易被抢走。


    后来这家企业就对商业模式进行了创新。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 实业是资本的马甲，

    > 因此你看到的未必是真的盈利模式！

    > ——诺老师


    这3000个客户都是有很实力的客户，在银行的活期存款一般都会有10万元以上。


    即便以每个客户有5万元存款来计算，他们加起来也至少会有1.5亿元的存款。如果能够为银行拉去1.5亿元的存款，


    是不是就可以跟银行谈回报的条件？


    假设回报谈到一年5%就是750万元。


    假设普通储户的活期存款年利率为0.35%，那1.5亿元的活期存款的年利息为52.5万元。


    这个时候去跟消费者谈新的合作方案：


    只要他把活期存款转移到指定的银行，一年2000元的粮油就免费送。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 先免费后收费，免费比收费更赚钱！

    > ——诺老师


    消费者愿不愿意？


    当然愿意，因为钱放哪里都是放。


    银行愿不愿意？


    当然愿意，因为多了1.5亿元的存款。


    那这家粮油企业呢？


    银行要给储户52.5万元的利息，再给粮油企业697.5万元的回报(750万元-52.5万元=697.5万元)。


    粮油企业每年要送出价值600万元的粮油，但这并非实际成本，算下来，能获得超过97.5万元的利润，而且客户黏度还提高了。这就是商业模式的创新。


    这家企业原来赚什么钱？


    赚产品买卖的钱。


    现在呢？


    赚的是“融资+投资”的钱，等于汇集了一大笔钱投到银行，让银行给高回报。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 表面上你是开企业的，

    > 实际上你是开银行的！

    > ——诺老师


    这就是，干着企业的活，赚着银行的钱。


    有一家企业，原来是卖植物盆栽的。


    买植物盆栽的客户有两个痛点：


    一是都想买好的充场面，但好的植物太贵；


    二是不擅长打理，植物经常会养着养着就死掉了。


    这家企业设计的模式是：客户交2万元保证金，可以任意挑总值2万元的植物放到自己的企业，过一段时间觉得不好可以换，总额2万元不变；


    哪一天企业搬走了，把植物还回去，保证金还可以退；另外每周派人到场打理这些植物两次，每次收10元。


    这就等于植物不用钱了，客户都愿意合作。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 只要不花钱，客户什么都想要！

    > ——诺老师


    如果你学过一诺老师的课程叫《融资兵法》你就知道，这就是影子银行模式。这背后的商业逻辑是什么呢？


    一诺老师来给大家算一笔账：


    通过这个方法收了300个客户，每个客户交了2万元的保证金，总共到账600万元；


    假设每个员工每天能够打理10家客户的植物，一家客户每周打理2次，一周工作6天的话打理30家；


    打理300家企业需要请10个员工；


    10个员工的工资为：10人×5000元/月×12月/年=60万元/年；


    植物成本：600万元×5%=30万元；


    其他支出大约2万/月，一年为24万元；


    经营这家企业的是一位女士，她的先生是开小贷公司的，资金在她先生的小贷公司每年可以得到30%的收益。


    如果是600万元，收益就是180万元；


    纯利润=180万元-60万元(工资)-30万元(植物成本)-24万元(其他)=66万元。


    原来靠卖盆栽赚钱，现在靠投资赚钱。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 商业模式的创新，

    > 是建立在自己资源的基础上的！

    > ——诺老师


    有一点要注意的是，如果没有她先生的小贷公司让这些保证金产生30%的年收益，那么这个方法就行不通了。


    ## 第99课：资本战略规划


    ### 一个清晰的资本规划


    一诺老师研究发现，如果你要走资本化的路线，就必须有一个清晰的资本规划，包括：


    - 1. 清楚地知道自己要用钱；

    - 2. 清楚地知道为什么要用钱；

    - 3. 清楚地知道什么时候要用钱；

    - 4. 清楚地知道需要用多少钱。


    拿一诺老师前面讲到的滴滴出行来举例子。通过这个列表可以发现，滴滴出行就非常清楚自身的发展需求：


    - 1. 知道自己要用钱，及早地开始准备融资；

    - 2. 知道自己融资是为了开拓市场；

    - 3. 知道什么时候开拓到多少市场；

    - 4. 知道把这些市场打下来，需要用多少资金。


    ## 第100课：商业计划书


    ### 做一份见人爱的商业计划书


    如果没有专业学习过怎么做商业计划书的PPT，那么在商业计划书的内容逻辑、要点强调、动画方面都容易出现问题。


    这也是为什么很多企业家都花333万直接找一诺老师做的原因。今天，一诺老师先把商业计划书的逻辑给大家讲解清楚。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 用人的三层境界：

    > 用友者霸，用徒者强，用师者王！

    > ——诺老师


    1、计划书封面


    - ● 企业名称：公司全名。如果全名太长就用简称。

    - ● 口号：一句话描述价值主张。

    - ● 联系人：融资方面工作的负责人，一般是企业一把手或二把手。

    - ● 联系方式：电话、邮箱。

    - ● 提交日期：标注日期，时间久了信息会发生变化。

    - ● 保密声明：内部机密，敬请保密。


    # 2、计划书目录


    商业计划书的目录，分成几个部分来给大家介绍。


    一般是：市场需求、解决方案、增长空间、竞争对手分析、赢利模式、核心团队、企业规划、融资方案。


    # 3、市场需求


    - **用户是谁：** 定位的客户是哪些群体?细致一点，还可以标注性别、年龄、收入水平、职业情况、生活习惯、居住分布。

    - **有何痛点：** 他们有什么需要解决的问题?生活或工作当中的痛点是什么？

    - **是否迫切：** 解决这些痛点的需求是否迫切？

    - **目前尝试：** 目前这些用户尝试过哪些方式来解决痛点？最后的效果如何？


    > 记住一诺老师这句话，顿悟商业真谛！

    > 需求就是市场，

    > 没有需求就没有市场！

    > ——诺老师


    # 4、解决方案


    - **是何方案:** 针对上述的痛点, 我们提出什么样的解决方案？

    - **有何优势:** 我们的解决方案有哪些优势？

    - **如何解决:** 有了这些优势, 我们如何解决上述痛点

    - **进展情况:** 目前我们的解决方案处于什么阶段？是研发、测试，还是已经在市场上推广？市场占有率如何？


    > 记住一诺老师这句话，顿悟商业真谛！

    > 成功很简单, 只要方法正确!

    > ——诺老师


    5、增长空间


    - **市场容量:** 这个方面的市场有多大？国内市场有多大？全球市场有多大？

    - **市场存量:** 目前已经被占有了多少？还有多少没有被开发？

    - **增长情况:** 这个需求的增长情况怎么样？这个行业的增长情况怎么样？接下来的增长预测怎么样？

    - **增长动力：** 这个行业的增长动力有哪些？国内外的比较是怎么样的？


    6、竞争对手


    - **都有哪些对手：** 我们这个项目都有哪些直接竞争对手、间接竞争对手？

    - **彼此的优势和劣势：** 跟竞争对手比起来，我们的优势是什么？劣势是什么？

    - **竞争对手融资情况：** 竞争对手有没有融资？融资情况怎么样？


    7、赢利模式


    - **主要收入来源：** 这个项目主要是靠什么赚钱？


    > 记住一诺老师这句话，顿悟商业真谛！

    > 没有盈利模式，就没有未来！

    > ——诺老师

