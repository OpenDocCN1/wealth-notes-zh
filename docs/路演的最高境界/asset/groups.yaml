    \n一诺老师喜欢研究做得好的企业，不管是什么行业。\n\n一诺老师虽然不做直销，但喜欢研究直销的模式与市场打法。中脉是做养生系列产品的，富迪(前身是月朗国际)是卖卫生巾的，安利、如新、完美是做日用品和保健品的，旅爸爸和\
    \ WY 是做旅游的。\n\n第①时间分身术等更多绝密课程 加微信：357607890\n\n一诺老师从中发现一些很有意思的事情：中脉起家的时候挖了富迪的一支团队；有一次跟一个富迪的人聊天，他天天想的就是怎么挖安利、如新、完美的团队；旅爸爸起家的时候，一部分团队成员来自WY。\n\
    \n对于有能力做市场的人来说，换的行业只要跨度不是太大，一般情况下他们都能够做起来。\n\n这就是一诺老师说的“找能把市场做好的人”\n\n其实这种做法，也不是直销公司的专利。\n\
    \n有很多日化品牌的高管都是来自于宝洁公司，所以人们都称宝洁公司是行业的“黄埔军校”。\n\n> 记住一诺老师这句话，顿悟商业真谛\n> 谁的客服资源多，我们就找谁合作！\n\
    > 谁能把市场做好，我们就找谁合作！\n> ——一诺老师\n\n当然，把别人挖过来，让别人动老东家的资源，这样有点不厚道。所以，高尚一点的打法是把他挖过来后让他组建团队重新开拓市场，而不动原东家的客户资源。\n\
    \n## 第56课：招商路演的五个版块\n\n### 第三个版块：客户资源2·如何找到他们\n\n既然知道要找哪些人合作了，就要去研究怎么找到他们了。\n\n\
    对于如何寻找潜在代理商、加盟商，一诺老师归纳了9个方向。\n\n在一诺老师这句话，领悟商业真谛！\n\n> 成功很简单，只要方法正确！\n> ——一诺老师\n\
    \n+ **(1)自身资源**\n  自己的人脉、社交圈子等。需要注意的是：保护自己得信誉，信誉一旦受损，负面影响将很快蔓延，而且很难修复。\n\n+ **(2)广告投放**\n\
    \  互联网、自媒体、传统媒体。注意投放后流量数据与转化数据的统计。\n\n+ **(3)电话邀约**\n  精准群体名单。需要注意的是：尽可能拿到精准群体的电话，或者加到他们的微信。\n\
    \n+ **(4) 人员拜访**\n  专业市场、批发市场、代理商市场、商圈。需要注意的是：拜访人员的团队激励与氛围打造。\n\n+ **(5) 行业渠道**\n\
    \  商会、行业协会、资源平台、宗亲会等。需要注意的是：\n\n  记住一诺老师这句话，领悟商业真谛！\n\n  > 台上路演比台下的沟通有用得多，\n \
    \ > 台下准备说的话尽量留在台上说！\n  > ——一诺老师\n\n+ **(6) 转介绍**\n  朋友的转介绍、现有合作伙伴的转介绍。需要注意的是：设定好转介绍的机制，给予他们想要的激励方案。\n\
    \n+ **(7) 展会**\n  国际性展会、全国性展会、区域性展会、行业展会。需要注意的是：在项目有比较明显优势的时候去参加，在需要开发新市场的时候去参加。\n\
    \n+ **(8) 内部孵化**\n  从员工里孵化，从客户里孵化。需要注意的是：如果要实行内部孵化，可以结合企业文化、策略等一起引导，同时要做好人才储备。\n\
    \n+ **(9)教育平台**\n  行业课程、专题课程等。需要注意的是：要找对有潜在合作商的教育平台，让教育平台的工作人员也协助你对接。\n\n记一诺老师这句话，悟商业真谛！\n\
    \n> 天下资源不为我所有，但能为我所用！\n> ——一诺老师\n\n在找潜在合作商的时候，可以从这9个方向进行头脑风暴，找出符合自己企业的、可执行的方式。\n\
