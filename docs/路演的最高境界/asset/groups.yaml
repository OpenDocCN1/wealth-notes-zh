    \n> 记住一诺老师这句话，洞见商业真谛\n>\n> 所有的合作条件都是可以谈的！\n>\n> ——一诺老师\n\n跟这个忽悠用语类似的，还包括：“我们所有项目的投资协议都是这么签的”、“这个条款绝对是不能修改的，这是行业惯例”、“其实，这些都是标准条款，没有什么好谈的”。\n\
