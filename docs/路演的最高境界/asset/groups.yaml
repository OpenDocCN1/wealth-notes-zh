    对于创业者来说，如果某家VC知道你同时还在跟很多其他的VC沟通，这家VC愿意独自投这一轮，创业者的融资额度他可以独自消化，不愿意或不需要其他投资者的参与，那么创业者有理由相信这家VC是有诚意的。


    或者有VC说“如果你们还没人领投，我们愿意”，这样的VC也是真正认可你的公司的投资人。


    跟这个忽悠用语类似的还包括：“我们对这个领域很感兴趣，但是想跟一家更了解这个行业的VC一起做。”、“我们的单笔投资额度没有这么大，你要是能找一个联合投资者，我们就投。”


    通常情况下，这些话的潜台词是：“你这个烂项目，能找到VC投资，那是活见鬼了！”


