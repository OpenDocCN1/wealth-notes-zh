    C小贩一边称李子，一边向老太介介绍其他水果：“猕猴桃有多种维生素，特别有营养，尤其适合孕妇。您要给您媳妇买两斤猕猴桃，她肯定高兴。完了我再给您送半斤新鲜葡萄，对孕妇还有安胎作用。”


    老太说：“是吗?好，那我就再来两斤猕猴桃。”


