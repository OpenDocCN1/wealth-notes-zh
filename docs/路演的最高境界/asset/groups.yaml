    \n正当我幼小的心灵，被社会的残酷，摧残地满目疮痍！我遇到了生命中最重要的贵人，全宇宙最最最伟大的梦想教练：一诺老师！在老师的帮助下，我3个月人生华丽转身，拥有几十位创业的兄弟团队！现在我们团队已经在开拓：云南、广西、广东、福建、江西、湖南、湖北、贵州等几十个省市的市场。\n\
    \n### 开天发表韩力讲\n\n从事教育行业多年，亲眼目睹从业人员水深火热。因为有太多假大空的讲师只是为了收钱，没有帮到别人！\n\n看一诺老师的“猪买单”让我拨云见日、醍醐灌顶、顿悟商业真谛，感觉这几年白活了，要是早认识一诺老师，也不至于负债累累，所以我豪无犹豫报名一诺老师的亲传弟子，并申请参加一诺老师亲自指导的实操团。\n\
    \n在一诺老师的帮助下，一个月不到我的人生华丽转身，事业快速进入正轨！感恩遇见！感谢一诺老师！\n\n大家好，我是天一，之前是个收破烂的，成为一诺老师弟子后，参加了实操团，在一诺老师的亲自指导下，我开始改头换面，从一个收破烂的，6个月不到人生华丽转身！\n\
    \n公司在筹备阶段，居然所有样车都被抢完了！来自云南、湖南、湖北、河南、河北、山东、安徽、江苏等几十位加盟商，在朋友的介绍下抢着要加盟我的事业！\n\n这始料未及的结果，我要特别、特别感谢我的恩师，他就是：全宇宙最最实战、最有格局、最有大爱的一诺老师。\n\
    \n愿景：惠及全人类 使命：帮助更多人实现梦想 活着就是为了改变世界\n"
  mdcn: "\n# 第115课：投资人套路8\n\n创业者在拿到VC的Term Sheet（投资条款清单）的时候，是既高兴又发愁的。高兴的是，终于得到VC的一个书面的投资承诺（尽管没有法律效力并且还有一些前提条件），融资成功就近在眼前了；发愁的是，Term\
    \ Sheet里的条款看得稀里糊涂的，搞不明白其中的奥秘啊！\n\n自己搞不懂那就请律师帮忙吧，可是律师的费用对于创业者来说实在是太贵了，动辄几万美金或者几十万元人民币。\n\
    \n于是VC就说了：“其实这些条款都是标准条款，也没什么好谈的，要不让我的律师给你解释一下就行了。”\n\n> 记住一诺老师这句话，领悟商业真理\n>\n\
