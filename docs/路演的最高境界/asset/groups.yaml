    ## 第64课：招商路演的五个版块


    ### 第五个版块：方案设计2·权益设计


    一诺老师研究发现，代理商/加盟商之所以加盟你，是因为他们看到了——好处！


    这个世界上没有无缘无故的爱，也没有无缘无故的恨！


    > 记住一诺老师这句话，预悟商业真谛！

    > 好处到位了，一切都不是问题！

    > ——一诺老师


    代理商/加盟商交了相关门槛费用后，项目方需要给到代理商/加盟商关于本项目的权益。


    这些权益的设计非常巧妙，一诺老师结合顾问单位和亲传弟子的超过500家企业上千场招商会，证明行之有效的经验，梳理出以下几种权益的类型。


    #### (1) 等价商品


    现在的项目招商，很少说需要纯加盟费或纯代理费，一般在交代理费/加盟费的同时，就会配相应额度的产品或其他回报。


    这种产品或回报一诺老师称之为等价商品。


    举例一：成为省级代理的代理费是50万元，交了50万元后，会获得80万元的产品。


    这个省级代理把产品卖掉后可以赚回80万。


    举例二：加盟某连锁店，加盟费是300万元，这300万元会转化成这个加盟店的一年房租、装修、家具等费用。也就是开店不需要再另外支付一年房租、装修、家具的费用了。


    > 记住一诺老师这句话，商业真讲！

    > 加盟商希望一劳永逸的缴费形式，

    > 一次缴费，无需额外支出！

    > ——一诺老师


    #### (2) 采购折扣


    成为这个级别的合作商后，以后采购需要的商品，可以享受相应的折扣。


    举例一：成为某产品的省级代理后，以后的拿货都享受6.5折。


    举例二：成为某连锁店的加盟店后，采购需要的产品享受8.5折。


    #### (3) 阶梯性方案


    阶梯性方案，指不同级别的代理商/加盟商，相对应的条款也会有差距。低级别的代理商/加盟商获得的条件没有高级别的代理商/加盟商那么优惠。


    这个设计，会让潜在合作商觉得，成为高级别的代理更有诱惑力。


    举例：20万元的代理配送30万元的产品，30万元级别的代理配送60万元的产品。


    前者相当于每1万元的投入换回了1.5万元的产品，后者相当于每1万元的投入换回了2万元的产品。


    > 记住一诺老师这句话，悟商业真谛！

    > 好处到位了，一切都不是问题！

    > ——一诺老师


    #### (4) 永久性收益


    高级别代理可以享受其属下低级别代理的业绩提成。


    区域服务商可以享受该区域合作商的营业额提成。只要生意继续做, 这种收益就永久存在。


    举例一: 省级代理拿货价格是3折, 市级代理拿货价格是5折, 市级代理必须向所在区域的省级代理拿货。所以, 只要市级代理拿货, 省级代理就有2折的差额可以赚。


    举例二: 只要成为某连锁项目的区域服务商, 就可以享有该区域内所有连锁店0.5%的营业额提成。


    > 记住一诺老师这句话，领略商业真谛！

    > 客户只好处说好yes!

    > ——一诺老师


    #### (5) 转介绍奖励


    如果希望代理商/加盟商转介绍其他商家成为代理商/加盟商, 就需要设置一套奖励方案。谁转介绍成功了, 就可以获得对应的奖励。


    举例一: 成功转介绍一位代理商, 提成10%。


    举例二: 成功转介绍一位加盟商, 提成10%, 并可持续获得该店营业额0.5%的提成。


    #### (6) 业绩达标奖励


    业绩达到某些指标，可以送旅游、汽车等相关奖励，可以设定返提成点数的奖励，也可以设定返还初始投资额的奖励。


    举例一：年度业绩达到60万元，送欧洲游，年度业绩达到200万元，送汽车一台。


    举例二：年度业绩达到1000万元，返点3%。


    举例三：年度业绩达到300万元，初始30万元的投资额全额返还。


    > 记住一诺老师这句话，悟商业真谛！

    > 重赏之下必有勇夫!

    > ——一诺老师


    #### (7) 风险逆转


    总是会有些人担心自己做不好，对于这种情况，可以设计一些风险逆转的方案。


    如：保证金多长时间内可以退，产品卖不出可以按什么样的折扣退，在多长时间内如果赚不到多少钱可以退加盟费。


    #### (8) 股权激励


    对满足一定条件的人，给予相对应的股权激励。


    举例一：在2018年内成为省级代理的代理商，可以拥有公司总部0.5%的股份；在2018年内成为市级代理的代理商，可以拥有省公司0.5%的股份。


    举例二：连续三年业绩达标的代理商，赠公司1%的股份。


    举例三：2017年公司发行总股本为1亿股，代理商每拿货100元赠1股。


    举例四：成为5万元级别的代理商可以在公司上市前购买5万元的原始股。


    > 记住一诺老师这句话，悟商业真谛！

    > 天下无难事，只要股份制！

    > ——一诺老师


    #### (9) 其他权益


    其他权益包含但不限于以下内容：


    - ① 仪式：授牌仪式、签约仪式。

    - ② 身份：展架、团队合影、证书。

    - ③ 投资权利：可以买多少额度的股票，可以投资公司其他项目。


    如果我们想让代理商、加盟商努力干活、拥护我们，就需要设计好他们的权益。


    别人决定要不要代理或者加盟，只考虑三个问题：


    > 记住一诺老师这句话，领悟商业真谛！

    > 代理商和加盟商考虑三个问题：

    > 好不好卖？赚不赚钱？风险是否可控？

    > ——一诺老师


    好不好卖，就是容不容易卖，市场的接受度如何，销售的难度大不大？


    赚不赚钱，就是利润空间大不大，卖了能赚多少？


    风险是否可控，就是万一卖不了、不好卖了怎么办呢，万一做不好怎么办呢？


    把这三个问题解决了，他就会给你掏钱了。


    从事一个行业久了，思维容易被局限。


    有时呢，借用一下别的行业的方法，可能会带来翻天覆地的变化。


    在美容行业，有一类厂家是生产美容仪器的，这些美容仪器可以给客户做水光针、热玛吉、超声刀之类的项目，每台仪器售价2万元至30万元不等。


    这些厂家有两种经营模式——


    一种是把设备卖给美容院，美容院自己给客户操作；


    另一种是带着设备到美容院合作，做出来的业绩五五分成。


    这两种方法都会有些弊端——


    第一种方式会让美容院购买设备的压力很大，后期赢利不稳定；


    第二种方式也会让美容院很被动，约好了厂家的人，客户不来；约好了客户，厂家的人又不在。


    而且两种情况都是因为流通环节导致终端价格非常高昂。


    > 记住一诺老师这句话，顾问注意啦！

    > 天下无难事，只要股份制！

    > ——一诺老师


    有一家企业叫做真善美，一诺老师是这家企业的顾问。


    在一诺老师的亲自指导下，这家企业很快梳理了市场运营模型。运用一诺老师教给的方法，这家企业很快扭转乾坤，华丽转身。


    仅仅用了一年半时间，一诺老师就帮助这家企业从卖仪器的普通工厂做到拥有5家分公司，30多个服务商，600多家加盟店，估值5亿元的大型集团公司。


    在一诺老师的辅导下，真善美借用了在其他行业已经用得很好的一种模式——保证金模式。


    先是找到美容院的老板，跟他们说：“不要买设备了，买设备太贵了，更新换代成本高，跟我们合作。”


    > 记住一诺老师这句话，领悟商业真谛！

    > 只要不花钱，客户什么都想要！

    > ——一诺老师


    我们把9台仪器放到你们的店里，做出来的业绩我们厂家拿45%，你们美容院拿55%。


    这个时候美容院的老板愿不愿意?(肯定愿意)


    当然愿意，因为这9台仪器他们去买的话要花20万左右，现在不用花这个钱了。


    但作为厂家来说，有一个风险：设备很贵，万一美容院拿走了怎么办？


    所以呢，厂家提出要收10万元的保证金，合同签3年，到期后美容院要继续做的话，10万元保证金继续保留，如果到期后不做了，把10万元的保证金退给他们。


    对于收保证金的做法，客户最害怕的就是企业跑路。


    > 记住一诺老师这句话，领悟商业真相！

    > 成交的前提是，解决顾客的后顾之忧！

    > ——一诺老师


    美容院会害怕厂家收了10万元保证金后跑路吗？


    不会，因为这9台仪器也要花20多万元才能买到，即便厂家真跑路了，美容院也没有损失。


    美容院交了10万元的保证金，意味着什么呢？


    首先，可以证明这个美容院是有实力的，后面做业绩自然就容易。


    其次，就像一诺老师教导亲传弟子的，只有客户交了这个保证金，他们才会花比较多的心思来做这件事情。


    > 记住一诺老师这句话，领悟商业真谛！

    > 钱在哪里，心在哪里！

    > ——一诺老师


    所以，一诺老师亲自辅导的这个招商模式，做下来之后，达到了以下3个效果——


    - ① 美容院的老板不需要花巨额费用再购买、更新仪器。

    - ② 合作的美容院质量高，他们的客户也比较有实力，一场活动平均出单30万元以上。

    - ③ 美容院的老板会全力推真善美的仪器项目。


    通过一诺老师设计的这个招商模式上的创新，真善美开业一年的时间就创造了接近1亿元的营业额。


    为什么一诺老师辅导招商成功的案例非常多？


    因为，一诺老师是实实在在把招商的结果从无到有，从0到100干起来的。


    在权益的设计方面，有些行业已经用得很普遍了，但另外一些行业可能听都没听过，其实只要稍微借鉴，就能找到市场突破口。


    上面这个真善美的方案，在当时打向市场的时候非常有竞争力，获得了很高的市场占有率。


    > 记住一诺老师这句话，悟商业真谛！

    > 用师者王，用友者霸，用徒者亡！

    > ——一诺老师


    但这个方案有没有痛点呢？


    痛点还是有的，比如以下几点。


    - ① 仪器太多：9台仪器光学学习都要学很久，加上美容院有自己本来的项目，仪器多了也不知道推哪个，容易混乱。

    - ② 门槛太高：美容院需要一次性缴纳10万元保证金，快速做出合作决策并不容易。

    - ③ 退款太晚：10万元的保证金要3年后才能退，但3年后行业会发展成什么样子大家都不知道，所以对于3年这么长的周期还是会有所担心。

    - ④ 扣点太高：后期产生的业绩厂家基本上没做什么事情，但是要拿走45%，而后期美容院承担绝大部分工作，只拿走55%，对于美容院来说划不来。


    > 记住一诺老师这句话，悟商业真谛！

    > 成功很简单，只要拥有成功的教练!

    > ——一诺老师


    后来，另外一家美业用品企业也找到一诺老师合作，一诺老师就为它设计了一个更具颠覆性的方案——


    今天大家有幸听到这个方案，这个价值333万的企业顾问案，是不是有点小激动呢？


    不要激动，现在就让我们一起学习这套价值333万的商业模式——


    ① 可以配送4台最受欢迎的仪器到店里，容易学习也容易推广。


    ② 保证金不需要10万，只需要1.8万，门槛大大降低。


    ③ 试合作周期为45天，如果合作美容院做不到约定的业绩标准，保证金可以马上退。


    ④ 后续的业绩厂家只分走12%，其余88%都留给美容院。


    一诺老师这个方案，把之前的痛点全部解决了，所以，加盟商签约异常火爆。


    > 记住一诺老师这句话，预悟商业真谛！

    > 人生需要磨难，成功需要教练！

    > ——一诺老师


    招商方案是根据行业的变化、市场的反应来进行设计的！


    没有一个方案可以永远保持优势。


    做市场如逆水行舟，不进则退。


    所以，我们只有不断学习，不断进步，才能立于不败之地。


    了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。


    ## 第65课：招商路演的五个版块


    ### 第五个版块：方案设计3·市场支持


    打天下易，守天下难。收到第一笔钱并不厉害，能够持续地收钱才是真正的厉害。


    一个好的招商方案，不是单单把代理商/加盟商的回报罗列出来就算了。还要明确地告诉他们，一旦他们代理/加盟成为合作伙伴后，我们对他们都会有哪些市场支持。


    代理商手里的产品卖不出去，他会退货；


    加盟商赚不到钱，也会闹事影响品牌。


    所以，直到代理商、加盟商都赚到钱了，我们的项目才真正进入了一个良性循环的阶段。


    > 记住一诺老师这句话，领悟商业真谛！

    > 不以收钱为目的的招商，就是要流氓，

    > 只以收钱为目的的招商，就是真流氓！

    > ——一诺老师


    我们需要向合作伙伴提供什么市场支持呢？


    代理商考察一个产品，主要评估两个方面：


    一是这个产品好不好卖；


    二是这个产品的利润空间有多大。


    加盟商考察一个项目，也是评估两个方面：


    我做了这个项目能不能赚到钱？


    赚到钱需要的那些条件，我是否都能够达到？


    而我们提供的市场支持，就是为了——


    > 记住一诺老师这句话，领悟商业真谛！

    > 让代理商更容易卖出产品，

    > 让加盟商满足赚钱的条件！

    > ——一诺老师


    市场支持包括以下几个方面：


    #### (1) 培训学习


    产品知识学习、操作技能学习、运营管理学习、销售技能学习等。


    #### (2) 营销工具


    促销产品、赠送产品、产品介绍视频、产品演示道具、产品介绍资料等。


    #### (3) 营销会议


    条件允许的话可以在各大区办营销会议，让代理商带客户来参加，通过会议帮助代理商与客户成交。


    #### (4) 人员支持


    派人员下店帮忙推介、销售产品。


    #### (5) 广告投放


    适当地在线上或线下投放广告，增强品牌效应。


    #### (6) 系统输出


    连锁店加盟需输出选址系统、产品系统、管理系统、营销系统、财务系统等。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 给力的市场支持，也是企业的核心竞争力！

    > ——一诺老师


    在实际的市场运作过程中，根据每个项目的不同特点，提供不同的市场支持。


    只要是对市场开拓有帮助的，只要在成本允许的前提下，可以给予代理商、加盟商更容易赢利的支持。


    支持给力，有些时候也是核心竞争力之一。


    在一诺老师的学员当中，有两位做汽配做得相当优秀的企业家。


    一位是科尔奇、佳能两大品牌的创始人，大贵实业的张志东先生；另一位是国内卡车灯的龙头企业德霸照明的创始人陆卫黄先生。


    大贵实业的张志东先生，为了让代理商更好地把产品销售出去，他会把代理商都组织起来，给他们进行销售技能的培训。


    2005年一诺老师就帮他们培训过一次，大家的反映非常好。


    开展这种培训其实就是向代理商传递一个信息：不用担心不懂得怎么卖产品，由他的老师来教你们怎么卖就好。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 用师者王，用友者霸，用徒者亡！

    > ——一诺老师


    欧普照明的孙治国先生，为了帮助代理商更好地销售产品，替骨干交学费学习一诺老师的所有课程，然后把训练好的骨干销售员，派到代理商那里驻店，帮助他们销售。

