    ## 第72课：资本路演的原则2


    ### 让投资方更多地了解你


    资本路演的另外一个误区是——需要钱的时候再去找投资方。要知道，投资方决定要不要投资你的项目，也是有流程的。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 要在口渴之前，把井挖好！

    > ——一诺老师


    - (1)搜寻投资机会

    投资机会可以来源于投资方自行寻找、企业家自荐或第三人推荐。


    - (2)初步筛选

    投资方根据企业家交来的投资建议书，对项目进行初次审查，并挑选出少数感兴趣的项目作进一步考察。


    - (3)调查评估

    投资方会花大约6~8周的时间对投资建议进行十分广泛、深入和细致的调查，以检验企业家所提交材料的准确性，并发掘可能遗漏的重要信息：在从各个方面了解投资项目的同时，根据所掌握的各种情报对投资项目的管理、产品与技术、市场、财务等方面进行分析，以做出投资决定。


    - (4) 寻求共同出资者

    通常，风险资本家作为投资方的一个重要角色，一般都会寻求其他投资者共同投资。

    这样，既可以增大投资总额，又能够分散风险。

    此外，通过这个举动还能分享其他风险资本家在相关领域的经验，互惠互利。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 强者懂得合作，弱者只会逞强！

    > ——一诺老师


    - (5) 协商谈判投资条件

    一旦投、融资双方对项目的关键投资条件达成共识，作为牵头投资者的风险资本家就会起草一份 “投资条款清单”，向企业家做出初步投资承诺。


    - (6) 最终交易

    只要事实清楚，一致同意交易条件与细节，双方就可以签署最终交易文件，投资生效。


    如果你等到没钱了，再去找投资机构，是否能熬到“最终交易”这个步骤还有个大大的问号。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 越有钱的时候越是要融资，

    > 要融到永远也花不完的钱！

    > ——一诺老师


    所以，如果打算要走引入资本这条路线的，可以在项目一开始就就让投资人或投资机构关注项目，走该走的流程。


