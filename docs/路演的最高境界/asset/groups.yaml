  - "[PAGE 458]\n\n但有很多懒惰的、水平和眼光很差的VC也有自己的方法，那就是跟着大牌VC走，或者随大流。那些红杉资本、鼎晖投资、IDG、赛富投资等大牌VC都看好的项目，他们一定哭着喊着要跟投，但是就怕人家不会带他玩。\n\
