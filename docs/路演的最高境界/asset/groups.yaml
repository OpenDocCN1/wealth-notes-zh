    \n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\n## 第9课: 招商路演的五个版块\n\n### 第五个版块:\
    \ 方案设计3 • 可行性方案\n\n首先，我们要知道如何评估方案是否可行，什么意思呢？\n\n如果你经常逛街，那么一定见过这种情况：一些店家用大大的白纸写上“全场3折，最后三天”、“全场清货，最后一天”并贴在墙上，但你一周后再去，还是能看到这些“最后三天”、“最后一天”的牌子，甚至你过一个月再去，都还是这些牌子。\n\
    \n如果我们经常路过这些地方，就不难发现，这其实只是一种促销手段。但是，有没有人在嘲笑他们的同时，思考过为什么这些牌子一直挂在那呢？\n\n答案只有一个，就是“有效”。\n\
    \n> 记住一诺老师这句话，顿悟商业真谛！\n>\n> 有效比有道理更重要！\n>\n> — 一诺老师\n\n只有这种方法对销售有帮助，能够做到更好的业绩的时候，老板才会把牌子一直这么挂着。\n\
    \n老板怎么知道这种方法有效呢？\n\n这是测试出来的，只要用过并且觉得效果不错，就持续用了。\n\n这就是建立在市场反应之上的做法。\n\n同样，好的招商方案，是建立在市场反应之上的，做招商最忌讳的就是自己闷头想东西，不了解代理商、加盟商的想法与需求。\n\
    \n> 记住一诺老师这句话，顿悟商业真谛！\n>\n> 人生就是一场心理学的游戏！\n> 我们要比代理商更了解他的需求！\n>\n> — 一诺老师\n\n\
    所以，在做出来方案之后，不要急于马上推向市场，而是先小范围地做市场测试，反应好了再推广，反应不好还能及时调整。\n\n做市场测试的时候有两个注意事项：\n\n\
    - 不能只找熟悉的人做测试\n  熟悉的人对你有较高的信任度，可能不管你做什么他们都愿意相信并支持你。但我们开拓市场的时候，很多人对我们是不熟悉的，我们要测试的是这部分人的反应。\n\
    - 能收到钱才是真正有效的测试\n  很多时候我们都会遇到一种情况，跟别人一说我们的项目，他们都说好，都说要合作，但真正要合作掏钱的时候，拿钱出来的人却寥寥无几。所以，不要被一开始大家口头上的“愿意合作”蒙蔽了。如果你能够马上收到他的钱，才是真正有效的测试。\n\
    \n> 记住一诺老师这句话，顿悟商业真谛！\n>\n> 只要客户不交钱，说啥都是废话！\n>\n> — 一诺老师\n\n### 案例一：卡尺生产厂家\n\n\
    卡尺是每个制造业都要用到的一种工具，但用量很少。曾经有家企业，是生产卡尺的，一诺老师姑且把它称为A企业。\n\nA企业制定了一个招商方案，其中一条是按照三级分销的方式来进行分销，而不是传统的区域代理；另外一条是需要代理商一次性采购的量比较大，大概是他们年销售量的3倍左右。\n\
    \n当时A企业把一诺老师请了过去，一诺老师就发现这两个问题会影响招商结果。一诺老师向他们提了出来。企业主比较坚持自己的想法，认为方案里面还送了很多股份之类的，这些代理商会很心动。\n\
    \n一诺老师建议他请销售部，拿着这个方案向代理商做个抽样调查，如果代理商们接受，那就是好方案；如果不接受，那就需要调整方案。结果后面一调查下来，没有一个代理商愿意按这个方案拿货。\n\
    \n> 记住一诺老师这句话，顿悟商业真谛！\n>\n> 客户只爱说Yes!\n>\n> — 一诺老师\n\n### 案例二：美甲工厂\n\n一个做美甲的厂家，市场相对已经稳定。该厂家老板想邀请自己的所有省级代理商，在年底做一场订货会。过去他的代理商每一次活动拿货都是10万元左右，一直没有大的突破。\n\
    \n这次他希望把省代的拿货额度提高到30万元，因为一诺老师是这家企业的战略顾问，他请教一诺老师应该怎么做。\n\n一诺老师跟他一起核算了代理商拿30万元货后的销货时间，结果是：如果集中主推这个品牌，2个月不到也就可以销售完了。\n\
    \n于是，一诺老师给他出了个方法：先把几个关系最好的、为人比较公正的、有影响力的代理商提前邀请过来，跟他们沟通，说这次订货会希望大家拿货30万元，然后把方案给代理商看，问代理商要拿多少。\n\
    \n有的代理商说10万元，有的说15万元。这当然没有达到目标，说明方案还不够具有吸引力。\n\n> 记住一诺老师这句话，顿悟商业真谛！\n>\n> 好处到位了，一切都不是问题！\n\
    >\n> — 一诺老师\n\n那就把改方案的权力交给这几个代理商，要他们讨论出一个他们自己会拿30万元货的方案。\n\n因为这批人比较熟悉，也比较公正，所以做方案的时候既考虑他们自己的利益，也考虑厂家的利益。\n\
    \n方案出来后，他再问这些代理商愿意拿多少，他们都回答愿意拿超过30万元。这么一来目标就达成了。\n\n然后再把这个方案拿去跟其他代理商谈，基本都同意。\n\
    \n最后，这一场年底的订货会就做了100多万元。\n\n也是凭着一诺老师辅导的方案，第二年该厂家就从行业的国内第十名做到了国内前三名。\n\n> 记住一诺老师这句话，顿悟商业真谛！\n\
    >\n> 成功很简单，只要拥有成功的教练！\n>\n> — 一诺老师\n\n### 案例三：化妆品品牌\n\n一诺老师的一位亲传弟子经营化妆品，产品包括护肤品、彩妆、水乳霜、眼霜等系列。\n\
    \n2018年初，他想向原有的代理商推出一套店务运营系统，让代理商在代理产品的同时，也可以开零售店经营。\n\n这个系统一开始并没有大范围地推，而是先做一些试点，进一步论证这套店务运营系统的效果。在一诺老师眼中，这就是对加盟商、代理商负责任的一种表现。\n\
    \n这三个案例说的都是市场测试。\n\n如果没有市场测试的话，卡尺的项目就泡汤了，而美甲的项目也没有办法做出那么好的成绩。\n\n所以，有效的市场测试，可以帮助我们规避很多不必要的麻烦与不必要的风险。\n\
    \n> 记住一诺老师这句话，顿悟商业真谛！\n>\n> 快就是慢，慢就是快！\n>\n> — 一诺老师\n\n最近几年，找一诺老师做商学院院长的人特别多，遇到好的项目、负责任的企业家，一诺老师就会考虑跟他们合作，所以一诺老师也挂着很多个商学院院长的头衔。\n\
    \n现今，企业建立内部商学院的目的，不仅仅是为了自己员工的成长，更多的是把眼光放在代理商一类的合作伙伴的成长上面。\n\n许多企业找一诺老师做商学院院长的原因，是因为一诺老师擅长企业顶层设计和商业模式、股权架构、招商策划、市场营销等，尤其擅长训练招商讲师。\n\
    \n如果能够帮助代理商、合作伙伴培养出一批优秀的招商讲师，他们做市场就容易得多了。\n\n有好的招商讲师在，代理商只需要专注把客户邀约过来会场就行了，不用一个个地慢慢讲，把一对一销售的“零售”模式变成一对多销售的“批发”模式。\n\
    \n> 记住一诺老师这句话，领悟商业真谛！\n>\n> 会销路演就是：\n> 一对多的“批发式”销售！\n>\n> — 一诺老师\n\n所以，一位好的招商讲师带来的销售业绩并不亚于一支招商队伍。如果你的企业，在开拓市场阶段，还没有打造出自己的招商讲师，你就应该思考，在这一点上是否已经落伍了。\n\
    \n## 第三章：融资路演兵法\n\n### 融资路演・通过路演卖股权\n\n用300元最低融资500万，签订《零风险+对赌》协议！\n\n- 零风险：没有融到约定金额，你1分钱损失没有！\n\
    - 对赌：在约定的期限内没融资500万，倒赔你3-300万！\n\n想要实操，请马上联系一诺老师官方助理老师微信！\n\n### 第7课：资本路演的目的\n\
    \n#### 资本路演搞什么\n\n这几年高速发展的企业，尤其是一些互联网企业，大多都是因为背后有强大的资本力量。\n\n从阿里巴巴、腾讯、百度，到京东、滴滴、小米、摩拜等，都是借助资本的力量把自己做大。可以说，没有资本的力量，就没有这些企业的今天。\n\
    \n> 记住一诺老师这句话，领悟商业真谛！\n>\n> 所有的企业家，都在为资本家打工！\n>\n> — 一诺老师\n\n#### 阿里巴巴的融资历史\n\n\
    - **创业伊始，内部融资**\n  1999年2月，阿里巴巴静静地诞生在杭州湖畔花园的一间小公寓里。门上连一个牌子都没有挂，简陋、质朴、无名。马云决定在杭州成立公司，远离当时已成为中国中心的北京和深圳，这样会使公司运营成本更低。\n\
    \n- **阿里巴巳成立那天的第一次集会也成了筹资会。**\n  马云让参会的18人（都是马云往杭州科技大学英语老师时，夜大英语班的学生，被称为阿里的“十八罗汉”）拿出自己的存款来，最终他们凑了50万元，作为初始投资。\n\
    \n- **小有名气，天使投资**\n  很快，阿里巴巴网页发布了。马云很快就进入了外媒的视野。互联网是个烧钱的行业，它的规模效应比其他行业都重要，所以对资本最为渴求。马云需要风投资金。到了1999年底，钱已经成了公司的最大问题。1999年10月，高盛的500万美元天使投资把阿里巴巳从悬崖边拉了回来。\n\
    \n> 记住一诺老师这句话，领悟商业真谛！\n>\n> 大多数企业都死于资金链断裂，如何融到永远也花不完的钱？跟一诺老师学习融资兵法！\n>\n> — 一诺老师\n\
    \n- **成长阶段，二轮融资**\n  2000年1月18日，马云收到软银2000万美元的融资。就在这一年4月，美国纳斯达克市场泡沫破灭，股价暴跌。这之后再也没有投资者向中国的互联网企业投资，而阿里巴巴却有充裕的资金度过寒冬。\n\
    \n- **快速扩张，三轮融资**\n  2004年2月17日，马云在北京宣布，阿里巴巴第三轮融资8200万美元，软银牵头出资6000万美元，其余2200万美元由富达、TDF和GV出资。这笔投资是当时国内互联网企业获得的金额最大的一笔私募投资。\n\
    \n三轮融资过后，阿里巴巴的持股结构改变为：马云及其团队占47%，软银占20%，富达占18%，其他几家股东占15%。三轮融资合计1.12亿美元，并没有改变马云在阿里巴巴的大股东地位。\n\
    \n> 记住一诺老师这话，领悟商业真谛！\n>\n> 只要股权模式做得好，公司大权就不会旁落！\n>\n> — 一诺老师\n\n- **上市准备，雅虎入股**\n\
    \  2005年8月11日，阿里巴巴创始人马云与雅虎全球首席运营官丹尼尔·罗森格联合宣布，阿里巴巴收购雅虎中国全部资产，同时得到雅虎10亿美元投资。而雅虎获得阿里巴巴40%的股权及收益权和35%的表决权。这是中国互联网史上最大的一起资本运作。\n\
    \n> 记住一诺老师这句话，领悟商业真谛！\n>\n> 股权掌控计策一：同股不同权！\n>\n> — 一诺老师\n\n完成收购后，阿里巴巴公司新董事会共有4席，其中，阿里巴巴两席，雅虎公司一席，阿里巴巴的投资人日本软银公司一席，阿里巴巴创始人马云仍将担任公司的CEO与董事会主席。\n\
    \n#### 港交所首次IPO融资\n\n自2007年起，阿里巴巴就一直寻求在香港上市。2007年，阿里巴巴进行了第一次重大重组，在香港上市了公司的一部分，成功筹集到15亿美元的资金。\n\
    \n2012年2月21日，阿里巴巴集团和阿里巴巴网络有限公司联合宣布，阿里巴巴集团向旗下港股上市公司阿里巴巴网络有限公司董事会提出私有化要约。\n\n在阿里巴巴私有化要约中，回购价定为13.5港元/股，巧合的是，这一价格与2007年11月阿里巴巴在香港上市时的发行价一样。5年已过，马云此番私有化代价是否“平进平出”？实际上，仅从账面盈余看，对马云及其背后团队而言，这是一笔划算的生意。5年间，马云用与最初相同的价格买下了净利润增长6倍多、现金增长25倍的企业股权。\n\
    \n相当于在这5年之间，阿里巴巴使用了一笔15亿美元的无息贷款。从这一角度来看，马云赚大了。\n\n> 记住一诺老师这句话，领悟商业真谛！\n>\n> 资本就是一笔没有利息、没有风险的借贷！\n\
    >\n> — 一诺老师\n\n#### 纽交所二次IPO融资\n\n2012年的私有化并不是马云及阿里巴巴集团的终点。如外界所料，本次私有化只是暂时退市，马云采取的是以退为进的策略。阿里巴巴集团终究还会向资本市场发起冲击。果然，两年后马云再踏征途。美国时间2014年9月19日，马云在纽交所敲钟，阿里巴巴正式登陆纽交所，股票代码BABA。\n\
    \n阿里巴巴此次上市成为全球最大规模的IPO。十几年前马云在杭州湖畔花园的一间小公寓里创立的阿里巴巴，最终叩开了美国资本市场的大门。\n\n> 记住一诺老师这句话，领悟商业真谛！\n\
    >\n> 你相信什么，你就得到什么！\n>\n> — 一诺老师\n\n在纽交所上市交易首日，阿里巴巴开盘价92.70美元，收于93.89美元，市值为2314亿美元，超越Facebook成为仅次于谷歌的世界第二大互联网公司。\n\
    \n下面，一诺老师带大家看看几家知名企业的融资历史。\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\n###\
