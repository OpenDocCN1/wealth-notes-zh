    他们会向你采购商品或使用你的系统。如果你有相对成熟的技术壁垒，就可以进一步赚它们的钱。


    收代理费、加盟费，提高代理的门槛，提出采购的数量要求，提出年度与季度的业绩要求，按照区域收代理费用(省级代理、市级代理、区级代理)，提前收取半年或一年的商品采购费用等。


    > **一诺老师寄语：成功很简单，只要拥有成功的教练！**

    >

    > 一诺老师


    一诺老师的一位弟子，是做传统制造业的。


    在一起吃饭时，聊到他想增加一条自动化生产线，预计投入1000万元，通过这条生产线可以创造的年报大概是1500万元。但他手头资金紧张，拿不出资金来投入。


    一诺老师在给他出方案之前，先了解了他上下游情况。


    上游主要的供应商有10家左右，每家每年供应原材料 100-500万元不等，结款方式都是月结。


    下游主要的代理商也是10家左右，每家每年拿货200万 -800万元不等，结款方式也是月结。一诺老师的这位弟子为人比较诚信，长久以来在上下游中建立的口碑都不错。


    > **一诺老师寄语：诚信会24小时为我们工作！**

    >

    > 一诺老师


    一诺老师就给他出了个方案：跟上游供应商协商，未来一年的时间把他的款由月结改成年结，然后赠送这条新生产线一定的分红权给他们；


    再跟下游代理商协商，让他们提前把一整年的货款先付了，也同样赠送这条新生产线的分红权给他们。


    有闲钱的、信任他的，又没有太多其他投资门路的上下游就会答应。结果他没花自己一分钱就把生产线建立起来了。


    这里面用的方法就是赚上游的钱与下游的钱。

