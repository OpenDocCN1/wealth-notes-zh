    # 第102课：资本路演套路2


    ## 如何路演 • 路演注意事项


    ### （1）得体的形象


    要体现出自己对路演的重视，穿符合路演场合的服装。


    如果同时能符合自己创业项目的风格就更好了。


    ### （2）沉稳的语气语调


    用沉稳的语气表达。投资人会喜欢对事业狂热的人，但不喜欢轻浮的人。


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 沉稳而自信的语气，有助于增加投资人的信赖感！

    >

    > ——一诺老师


    ### （3）多点使用数据


    数据对于理性的听众是最有说服力的，像百分比、市场占有率、利润率、消费者使用率等，不妨多些使用与强调。


    ### （4）语言的通俗化


    有很多项目涉及比较多的专业术语，或者比较抽象的概念，一定要通俗化地表达，尽量少用专业术语。


    ## 案例一：1500亿元的资产


    很多人对1500亿元并没有什么概念，我们不妨这样表达：假设你买彩票中奖，中一次是500万元，每天中一次，中间还不能有周六日休息，也要连续82年中奖才能拥有1500亿元。


    在2016年初，1500亿元相当于一个新浪的市值，超过网易，超过9个搜狐、3.5个奇虎360。


    > 记住一诺老师这句话，顿悟商业真谛！

    >

    > 企业家要重视市值管理，

    > 比赚钱更重要的是让自己值钱！

    >

    > ——一诺老师


    ## 案例二：5亿中产阶级


    2015年马云就说过，今天中国有3亿的中产阶级，但是，我们的钱可能达到中产阶级了，但我们的消费水平和消费能力依旧处于初等阶段，未来的15年，中国将会有5亿人成为中产阶级。


    5亿中产阶级意味着什么？


    美国今天的中产阶级不到1.5亿人，但是美国的内需拉动了、带动了整个世界经济的发展，也就是说未来15年中国的内需将3倍于美国，挖掘这个内需才是中国经济真正可以持久发展的基础。


    这样的表达要形象得多，可以让你的听众更具体形象地接收到你所表达的概念。


