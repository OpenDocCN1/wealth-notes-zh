    >

    > 一诺老师


    假如：一个产品的成本是8元，原来的销售价格是10元，利润是2元，我们可以有以下的选择——


    - ①原来的成本是8元，现在需求量增加，把销售价格涨到11元，利润就变成了3元。

    - ②原来的成本是8元，现在重新包装，增加了1元的成本，把销售价格涨到12元，利润也变成了3元。

    - ③原来的成本是8元，现在花1元打广告，即增加了1元的成本，把销售价格涨到11元，利润还是2元，但是销量增加了。

