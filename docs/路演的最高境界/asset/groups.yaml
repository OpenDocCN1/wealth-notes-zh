    ## 第06课：成交的逻辑5


    ### 听众在现场时都在想什么


    其实是一份购买的保障，以此来保证，你花这些钱购买的产品效果或产品功能是可以实现的。


    我们购买的东西通常都符合一诺老师说的这四个条件：需求、信任、价格、保障。


    我们买房子，不管出于自住的目的还是投资的目的，都是我们的需求。


    我们会更愿意找信任的品牌或者信任的人来买。


    我们对房价有一个心理价位，在考虑买哪个区域的房子时，我们会考虑自身的购买能力。


    最后我们要签合同，还要办房产证，来保障我们付钱后拥有对房子的所有权。


    这些条件有一个不符合的话，就会影响我们的购买行为。


    记住一诺老师这句话，感悟商业真谛！


    客户购买行为的四个前提条件：


    - 需求

    - 信任

    - 价格

    - 保障


    一诺老师


    各位不妨回想一下，过去我们成交的那些客户，是不是四个条件都符合了？


    过去我们没有成交的那些客户，又是不是因为没有符合哪个条件？


    如果要在这四个购买的条件中挑最重要的，会是哪个？


    假设，一个人现在得了重病，来到医院，医生说要手术，但是，不敢保证做完手术就一定能治好，治愈的可能性只有75%。


    如果不做，这个人马上就要死了，他做不做这个手术？


    他一定会做！


    记住一诺老师这句话，感悟商业真谛！


    当需求足够大的时候，


    购买者会放弃考虑保障的问题！


    一诺老师


    但是这个病人，他全部积蓄只有5万元，做这个手术要20万元，他会不会做？


    很大概率还是会的，他会找人借钱，想尽一切办法凑够20万元来支付手术的费用。


    也就是说，当需求足够大的时候，消费能力是可以被激发出来的。


    如果说，这个病人听说这家医院的医生都是骗子，一天到晚干的都是骗钱的事情，还会不会治呢？


    这个时候就很难说了，要么这个病人自己能够判断这家医院是值得信任的，并坚持在这里治疗，要么他会选择其他可以信任的医院。


    通过以上例子，一诺老师给大家总结了一下。


    记住一诺老师这句话，顿悟商业真谛！


    在四个购买的前提条件里面——


    - 需求是成交的核心，没有需求就没有成交。

    - 信任是成交的前提，信任你才会向你购买。

    - 价格是成交的基础，好价格促成更多成交。

    - 保障是成交的动力，有保障让他买得安心。


    了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。


    ## 第07课：成交的逻辑日


    ### 听众喜欢被什么样的讲师成交


    一诺老师曾经不断地问亲传弟子：如果你是客户，你喜欢被什么样的人成交?弟子给出的答案非常多，包括——


    - 人品好 幽默 有能量 自信

    - 诚信 有使命感 有气场 相似经历

    - 有能力 有成功案例


    既然客户喜欢被这样的人成交，那我们是不是要把自己变成这样的人?如果我们成为这种人，客户是不是就会喜欢被我们成交了?答案是——肯定的。


    记住一诺老师这句话，顿悟商业真谛！


    只有投其所好，才能赢得客户芳心！


    一诺老师


    你会发现，有些时候，销售人员沟通半天，都谈不下来的单子，讲师过去谈下就成交了。


    是因为这位讲师的水平高出很多吗？


    答案是——不一定！


    很多弟子听到这里就迷惑了……究竟是什么原因呢？


    有很大的原因是因为客户喜欢被讲师那样的人成交。


    记住一诺老师这句话，顿悟商业真谛！


    不是因为这位讲师的水平很高，


    而是听众喜欢被那个讲师成交！


    一诺老师


    一诺老师的亲传弟子叫作白雪，从事美业多年，同时也是国内顶级的纹绣师之一。再难缠的客户，只要跟她一见面聊上两句，三两下就成交了！


    可是，同样的话术别人也用过，没起什么作用，但她说出来就有效，连她自己也不知道为什么。


    一诺老师告诉她：“因为客户本身，就喜欢被你这样的人成交。”


    从气质、打扮、谈吐、眼神、手势、语气、为人处事等方面面来说，她都是别人信任或者崇拜的对象。


    所以，当客户一见到她，就很信服，很多问题都不用考虑了，马上愿意刷卡。


    甚至很多人会主动说：“白雪老师，您觉得哪个方案适合我？您建议我做哪个方案，我就做哪个方案。”


    当然，这位白雪老师也不会因为客户信任她，就拼命推荐价格高的方案，她一定会推荐最适合客户的。


    记住一诺老师这句话，顿悟商业真谛！


    小成交靠话术，大成交靠人品！


    一诺老师


    想把成交变轻松，就先把自己变成客户喜欢的那种人。


    在产品路演中最重要的是，我们要告诉客户或要让客户知道，我们就是这样的人，怎么告诉他们呢？三个方法：


    1. 自己个人品牌与口碑的打造


    一诺老师经常说“市场很大，圈子很小”。


    生意是做完不完的，只要去开发，客户就源源不断。


    但圈子是很小的，特别是在互联网时代，可以传播得很快。


    你通过努力取得一些不错的成绩，很快就会有人知道。


    反之，要是你做了违反规则、违反道德的事情，也一定会传播得很快。


    所以讲师也好，企业家也好，一定要注意自己口碑的打造。


    你诚实守信，大家都愿意和你做生意。


    你不诚信，也很快就会传播出去。


    记住一诺老师这句话，顿悟商业真谛！


    我们要像保护心脏那样去保护我们的信用！


    一诺老师


    2. 销售人员在前期给客户做的铺垫


    如果销售人员在客户参加会议之前，已经把讲师与企业塑造得很好，多说说讲师的故事、观点，让客户很期待，那就自然比较容易成交。


    3. 讲师在演说过程中讲述的故事


    讲师可以讲自己与产品的故事、自己与企业的故事、自己与客户的故事、自己的使命、自己的爱心等，这些都在影响着客户，不断构建一个形象。


    而这个形象就是客户喜欢的，愿意被他成交的。


    客户喜欢被什么样的企业成交？


    道理也是一样的，一诺老师给出标准答案——


    记住一诺老师这句话，顿悟商业真谛！


    要把企业打造成客户喜欢的类型，


    客户自然就喜欢被这家企业成交！


    ——一诺老师


    如何让客户相信你、喜欢你、疯狂地爱上你的企业，对你


    的企业品牌和产品欲罢不能呢？


    经过一诺老师20年的顾问经验，加上一诺老师3000位弟子实操经验总结，方法如下：


    - 企业的品牌与口碑的打造。

    - 销售人员在前期给客户做的铺垫

    - 在演说过程中讲述企业的故事。


