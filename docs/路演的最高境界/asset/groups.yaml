    ## 误区五：严重缺乏爆品思维


    ### 什么是爆品思维？


    就是找到客户的核心痛点并解决它，这个解决痛点的产品或项目，就是爆品。


    比如，卡凡开发的巧克力染膏，解决了染发产品气味很重的痛点，是一个非常成功的爆品；


    卡仕邦的汽车隔热防爆膜，解决了夏天汽车被晒后温度很高的痛点，也是一个非常成功的爆品；


