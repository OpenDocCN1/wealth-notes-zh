    # 第52课：招商路演的五个版块


    ## 第二个版块：企业战略1 • 充分地认识自己


    做好企业各个方面的盘点，简单说来，就是审视一下企业现在发展得怎么样了，做出了哪些成果，都有哪些资源，具备哪些优势，又有哪些劣势。


    企业要正确地面对自己。


    盲目自信的企业认为自己什么都能做，可以创造一切不可能的事情，结果往往死得很快。


    记一诺老师这句话，悟商业真津！


    > 有所为有所不为，才能大有所为！

    > 一诺老师


    有一个项目的创始人，他过去没有什么创业经验，只是学了一些商业模式的课程，才刚刚踏入这个行业一年，但因为被供应商捧上天了，因此把供应商的话都当真，觉得自己各种牛气冲天，各种天下无敌，一副救世主的姿态。


    该行业所有的店开张第一天最多做20万元, 他说自己的店开业当天要做200万元。


    结果怎样？


    当然是死得很惨。


    他喊出的口号最终成了整个行业的笑柄。


    这就是对自己没有正确认识的表现。


    一诺老师不是说明通人无法创造奇迹, 而是指创造奇迹是有条件的。你应该问问自己, 是否你智商特别高, 团队特别强, 客户资源特别丰富, 说服力特别牛？


    记住一诺老师这句话, 顿悟商业神！


    > 不要让自己的能力, 配不上自己的野心！

    > 一诺老师


    所以, 盘点自己, 正确认识自己的实际情况, 也是招商成功的基础！


    如何盘点自己？


    经过一诺老师多年的经验, 我们可以从以下几个方面着手。


    ### (1) 核心竞争优势


    企业的优势是什么？


    资金?人才?产品?企业特色?关键资源？


    找到自己的核心优势是商业竞争的根本，什么优势都没有的企业是难以生存的。


    记你一诺老师速句话，悟商业真！


    > 只要是做得比行业平均水平高的地方，都是自己的优势！

    > 一诺老师


    **案例一：**


    之前，有一位弟子叫张海燕，开了一家香港贵族女子学堂，


    有一天，张海燕来到一诺老师的课堂学习《招商大师》。


    尽管之前已经有所接触，但是在这一次的交流中一诺老师才算比较全面地了解这家学堂。


    香港贵族女子学堂是亚洲优雅仪态培训的泰斗，它不仅是这个行业的初创企业，也一直是这个行业的龙头企业。


    企业成立5年，帮助超过20万名女性打造优雅仪态、高贵气质，也在行业内培养了超过5000位优雅仪态类的老师，可以说，目前全国做优雅仪态类培训的老师，基本上都是出自这家学堂。


    该学堂还与时俱进地开发了许多视频课程、微课程、语音课程等。这家学堂的核心竞争优势是什么？


    是历史、规模、品牌、领导地位、持续创新。


    > 记住一诺老师这句，语商业美详！

    > 优势越多，在行业的地位就越高，招商自然也容易得多！

    > ——一诺老师


    **案例二：**


    一位弟子叫张晓敏，他在2005年创立了大唐棉业，主营服装填充棉、家纺、酒店布草、枕芯、被芯这几样产品。


    该企业最大的优势是生产能力——枕芯的日产量居全国第一。这样的企业跟竞争对手在市场上面拼的时候，就会拥有规模效应所带来的成本优势。


    **案例三：**


    有一家企业叫做陈金英，是国际某知名集团旗下的企业，目前有三个品牌。


    该企业特别重视教育，在教育上的投入在同行里面是最大的。不仅仅是让自己的内部员工来学习一诺老师的课程，还包括自己投入费用让代理商、加盟商也来学习。


    在第一次跟一诺老师合作之后，该企业马上加订了5000个培训名额，并升级获得一诺老师330万的顾问案名额。一诺老师发现，这是一诺老师遇到过的学习态度最好的团队之一。


    > 记一诺老师这句话，顿悟商业具！

    > 付费，是对老师最大的认可！

    > 一诺老师


    该企业的一位CEO曾分享说：“我认为我们企业最大的优势不在于品牌、模式产品、技术等方面，而在于学习!学习最重要的是选对教练，一诺老师是我见过全世界最实战的教练!”


    另外，这家企业还有一个非常强大的核心优势，就是技术研发与生产。


    在走美容院路线的化妆品品牌里面，很少有人会带加盟商去参观自己的工厂，因为大部分的品牌都只是代工而已。


    而陈金英却能够做到自己研发与生产。在带加盟商参观后，加盟商基本都不会再做别的品牌。


    **案例四：**


    有一位弟子名叫刘启明，他的企业涉足房地产开发、工程、建筑材料等。


    凭着自己多年的行业经验，他研发出了一套新颖的别墅建筑系统，并成立了“欧美”这个品牌来专门推广这个项目。


    别人要用半年到一年才能建好的别墅，他用1个月就可以建好了；普通的房子能抗8-9级地震，他建的房子能抗12级地震；建同样的别墅，他的造价能比别人低10%-15%。


    这些优势就非常明显！


    因为他是一诺老师的亲传弟子，在一诺老师的亲自指导下，设计了一个所向披摩的商业模式：只要你找欧美给你在当地盖一套房子，你就可以拥有欧美在该区域的代理权。


    记一诺老师这句话，须悟商业真难！


    > 成功很简单，只要拥有成功的教练!

    > 一诺老师


    企业一定要去发现并且持续打造自己的优势，没有优势就要创造优势。当我们清晰了解企业的优势，再去招商，就会方向更明确，成交率更高。


    记摧一老师速句话，概俗商业真诗!


    > 懂得扬长避短，就能事半功倍!

    > 一诺老师


    ### (2)企业资金情况


    资金就是子弹，就是粮草，决定了我们目前的招商规模和范围可以做到多大。


    ### (3)人力资源情况


    要想把市场开拓到目标区域，就要考虑你的销售和市场团队是否跟得上，人才培养的速度是否够快。


    ### (4)企业产品情况


    产品的结构能否满足市场的要求，产品的更迭能否跟上市场的变化，产品的生产能否满足市场增长的速度。


    ### (5)竞争对手分析


    最常见的就是——“SWOT”分析， 分析企业的优势、劣势、机会、威胁。


    另外，还需要时刻关注竞争对手，关注他们又推出了什么产品和策略，他们的重点市场是哪些，与竞争对手正面作战还是避开锋芒。


    陈女士参加过一诺老师课程的学习，她自己也是行业的十大品牌之首哎呀呀品牌的创始人之一。


    她的竞争对手的特点是——投放传统媒体广告量大，品牌效应强，产品标准化，同时代理费门槛高，回报相对比较慢。


    对于竞争对手的这些特点，一诺老师教导她采取的策略是——避免零和游戏的正面交锋，转攻线上媒体，实现产品定制化、个性化，设定较低的代理费，并帮助代理商实现5个月回本，1年300%的回报。


    后来在一诺老师的指导下，一发不可收拾，成为行业的龙头老大!


    记住一诺老师句证，悟商


    > 成功很简单，只要方法正确!

    > 一诺老师


    这在行业里面是非常强大的竞争优势。


    ### (6)区域市场情况


    对区域市场进行评估，分析竞争对手在该区域市场的占领情况，计算一下如果要去这个区域的市场需要投入多少的人力、物力财力。


    记一诺老师这句话，悟商


    > 不仅要四两拨千斤，还要懂得量力而行!

    > 一诺老师


    ### (7)后端服务能力


    把代理商和加盟商招进来是需要提供服务的，最基本的就是协助他们把销售做得更好，所以我们也要盘点企业做服务的资源以及做服务的能力。


    ### (8)成本结构分析


    企业的直接成本、间接成本的盘旋，单位产品的成本核算，成本占销售额的比例等。


    ### (9)运营管理能力


    在做全国市场的时候，最考验的就是运营管理能力。


    要看看自己的团队是否有具备这方面的经验的人；


    如果没有，则需要通过学习、聘请顾问等方式来弥补这一块的不足。


    > 记生一诺老师这句话，顿悟商业真计！

