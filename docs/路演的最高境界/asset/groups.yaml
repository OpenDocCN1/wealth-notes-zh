    ## 第19课：激发需求3


    因为大部分情况下只有不够好了，有痛点了，才会想到要解决。这个时候，他就开始去回忆并叙述那一次痛苦的经历了。


    在他回忆及叙述的时候，我们是不是就等于让他把这种不舒服的感觉又重新感受了一遍？


    如果剩下的2%的人回答的是好的经历怎么办？


    > 成功很简单，只要方法正确！

    > ——一诺老师


    一诺老师还有另外一套话术。


    (4) 还有吗？


    如果你觉得他说得不够具体，就可以问这个问题，目的是让他说得再具体点，回忆越仔细，感受就越深刻。


    (5) 当时的感觉怎么样？


    从事情反映出内心，前面是让他回忆整个故事，这个问题是让他回忆自己当时的感觉，让他说出自己的身体反应、心理变化。


    (6) 这样会给别人什么感觉？


    感受完了自己的不舒服，再让他感受一下别人的目光、表情、窃窃私语对他表现不佳的看法等。


    (7) 这种情况如果不改变，对你有什么影响吗？


    把痛点再放大到未来。


    > 不光要挖掘过去的痛苦，

    > 还要把痛苦放大到未来！

    > ——一诺老师


    这几个问题让客户从回忆痛点、深入回忆痛点、感受自己身上的不舒服到回忆别人对自己的看法，再到分析对他未来的影响，步步深入。


    (8) 你已经下定决心要改变了吗？


    确认客户改变的决心，当得到肯定的回复之后，只需要简单介绍课程并建议他上哪一门课程，客户都很容易接受，因为他已经痛到愿意去改变了。


    后来一诺老师拿这套话术给很多口才培训机构培训过，它们都一直沿用到现在。


    这里面最大的技巧是问到客户的痛点，而客户回答的时候也能自己感受到痛点。


    所以，我们在设计问题的时候，就要思考两件事情：


    (1) 客户是不是一听到这个问题就会感到痛？


    (2) 客户是不是回答这个问题的时候也会感到痛？


    如果是的，那他的需求不就被激发出来了吗？


    虽然这是面对面沟通的例子，一对一地发问和回答，但是，在会议上，大部分的时间，讲师不能单独问一个人，所以，设计的问题，就要对全场的人都形成刺激！


    > 只要你问的问题精准，他们开始思考，

    > 你的问题就问对了！

    > ——一诺老师


    举例：


    - 一个天然水的项目会议现场，讲师提问：“自来水为什么不能喝？”

    - 一个定制游的项目会议现场，讲师提问：“为什么跟团旅游感觉不好？”


    一个投资理财的项目会议现场，讲师提问5个问题——


    - 第1个问题：“你的钱是越花越多还是越花越少？”（绝大部分听众想到的都是越花越少。）

    - 第2个问题：“你工作够努力吗，工资够花吗？”（绝大部分听众都会回答虽然工作很努力但钱总是不够花。）

    - 第3个问题：“现在的生意有多难做？”（几乎所有人都觉得现在的生意很难做。）

    - 第4个问题：“通货膨胀有多严重？”（听众会不自觉地联想到现在通货膨胀很严重，货币贬值。）

    - 第5个问题：“你的钱在被谁使用？”（引导听众想到钱被银行使用，被贷款的人使用。）


    这里要注意一件事情，


    > 你提出来的听众的痛点，

    > 必须是你的产品/服务能够解决的！

    > ——一诺老师


    挖出别人的伤口却不治疗，那是不道德的。


    ## 第20课：激发需求4


    ### 激发需求三要点3：案例列举


    什么是案例列举呢？一诺老师研究发现，案例列举，就是举出和你提的问题有关的例子。


    **自来水为什么不能喝？**


    例子：自来水的水源很脏、水塔漂白粉很多、水管生锈、水管有细菌、蓄水池很不卫生、烧开了很多不好的物质没法除掉等。


    > 案例就是给你的观点，找出活生生的证据！

    > ——一诺老师


    **为什么跟团旅游感觉不好？**


    例子：人太多、行程太赶、吃得不好、住得不好、同行的人素质不高、旅行团服务不好、态度恶劣等。


    **你的钱是越花越多还是越花越少？**


    例子：供房子花钱、交通费花钱、吃饭花钱、孩子花钱、老人花钱、买衣服花钱、生活用品花钱、看病花钱等，年龄越大，花得越多。


    **你工作够努力吗？工资够花吗？**


    例子：加班、应酬、通宵、健康问题、工作压力、钱还不够花等。


    **现在的生意有多难做？**


    例子：原材料价格上涨、人力成本增加、利润减少、现金流压力大、跨界冲击、三角债、身体垮掉等。


    **通货膨胀有多严重？**


    例子：房子涨价、医疗费用涨价、各种商品涨价、通货膨胀的统计数据等。


    **你的钱在被谁使用？**


    例子：银行在用、朋友在用、创业者在用、贷款的人在用、金融机构在用等。


    > 每问出一个挖痛点的问题后，

    > 我们都可以举出相应的例子！

    > ——一诺老师


    这样我们传达给听众的观点就会更加充实。


    在激发需求这个环节有几个注意事项：


    - (1) 关于大势所趋，可以重点使用列举名言、统计学数据（用具体的数字）、政府文件报告（分量越重的人说的越好）、事物变化规律等来论证。

    - (2) 学会分析伪痛点和核心痛点。

    - (3) 找准客户的痛点来设计问题。

    - (4) 选择会让客户产生共鸣或者危机感的案例。


    > 客户之所以没有行动，是因为痛得不够深！

    > ——一诺老师


    ## 第21课：项目介绍1


    ### 要用通俗易懂的语言进行讲解


    如果别人根本听不懂你讲什么东西，怎么成交呢？


    所以，最好用通俗易懂的语言，来告诉听众你的项目！


    而且，对于说话的对象、时机要有所掌握，有时过分修饰反而达不到目的。


    过去20多年的教育生涯里，一诺老师就见过很多的路演者，没把自己的项目讲清楚，本来项目很好，却导致了不好的销售结果，让人惋惜至极。


    > 成功一定有方法，失败一定有原因，

    > 你不改变，谁也救不了你！

    > ——一诺老师


    在做项目介绍的时候，有哪些要点能帮助我们项目讲清楚，以避免这种情况发生呢？


    - 1、项目说明：简单概括这是什么项目。

    - 2、**项目优点**：讲出项目能够打动人的地方、和别人不同的地方。最大的特色是什么，定位的客户、重点宣传产品的特色是什么，这些要根据你的客户群体而定，他们关注什么你就包装什么特点。

    - 3、**项目好处**：前面讲优点是给好处作铺垫的，所以要把项目能够给客户带来的好处讲清楚，这是重点。

    - 4、**效果举例**：讲完了好处，还要举些例子来进一步说明，这可以让人别的理解更形象，也让别人对项目的效果更期待。

    - 5、**项目体验**：现场设计一些体验，最好是能够让客户现场感受你的项目，因为现场的体验是最好的。


    > 没有体验就没有感觉，没有感觉就没有购买。

    > 要让客户看得见、摸得着、感受到！

    > ——一诺老师


    ## 第22课：项目介绍2


    ### 站在听众角度的讲解步骤


    一诺老师现在给授课讲师做训练的时候，也会用另外一种站在听众角度的讲解步骤来进行训练——


    > 要站在听众的角度讲解步骤！

    > ——一诺老师


    - 我要给你介绍什么？

    - 客户都有什么迫切想要解决的痛点？

    - 我的产品有什么特点？

    - 我的产品如何为客户解决痛点？

    - 会为你带来什么好处？

    - 我来给你举例说明。

    - 现在给你震撼的体验。


    举例： 介绍卡凡巧克力染膏


    - 我要给你介绍什么？(卡凡新产品——巧克力染膏。)

    - 客户都有什么迫切想要解决的痛点？(普通染发膏化学气味太重。)

    - 我的产品有什么特点？(染膏是香浓巧克力味。)

    - 我的产品如何为客户解决痛点？(香浓皇家巧克力味代替了化学气味。)

    - 会为你带来什么好处？(染发体验更愉快，身体更健康。)

    - 我来给你举例说明。（用一部微电影讲述客户体验染发的过程。）

    - 现在给你震撼的体验。（现场让大家闻染膏的味道。）


    这也是一种逻辑非常清晰，非常有震撼力的项目介绍步骤。


    > 要想成功很简单，只要方法正确！

    > ——一诺老师


    项目讲解的注意事项：


    - (1) 一般建议针对痛点来做项目优点的提炼。

    - (2) 无法直接体验的产品/项目，也要设想一些间接的体验方式让客户体验到，比如招代理，你就帮他演算他能获得多少收益。

    - (3) 要把产品/项目讲清楚，可以使用模块化、图形化、顺序化、图表化、类比化五种方式。


    一诺老师在超级讲师班已经讲过，这里就不再重复。


    > 深入浅出，通俗易懂，

    > 感受深刻，方为高手！

    > ——一诺老师


    ## 第23课：信用背书1


    ### 背书能增加客户对我们的信度


    信用很好了解，背书是什么意思呢？金融领域的背书，指的是——找人或找机构给自己做担保的行为。


    > 就是请自己以外的名人，

    > 为自己的项目做个见证！

    > ——一诺老师


    客户要购买一件新的东西最容易有不安全感，我们要把这种不安全感去除，让他产生信任感，所以要做信用背书。


    有很多的路演，不是产品不够好，也不是成交方案不够诱惑，而是因为客户不相信演说者说的话。


    他不相信，你说什么都充满怀疑。


    在构建信任这个环节，我们要借助一切有影响力的元素，来为我们做信用背书，增加客户对我们的信度。


    信用背书的做法有4种：权威影响背书、火爆市场背书、客户见证背书、企业故事背书。


    ## 第24课：信用背书2


    ### 做法1：权威影响力背书


    权威影响背书指的是，找一些有权威或者有影响力的人或机构来给自己做个见证。包括：


    - (1) 该领域的权威专家


    研发产品的权威专家，认可产品的权威专家等。


    很多牙膏的广告，都会有个牙科专家在为产品说话或者用该产品做实验。


    > 人们迷信专家和权威！

    > ——一诺老师


    - (2) 行业名人


    该行业商会会长、资深人士、泰斗级别人物等。


    比如说，很多培训讲师，在做非常大型活动的时候，会把他的师傅一诺老师请去坐镇。


    - (3) 权威机构


    政府、科研机构、顶级律师机构、会计师机构、评估机构等。有的项目会说，我们请的是某某律师事务所，来做上市辅导规划。


    - (4) 社会名人


    政府官员、企业家、社会突出贡献者、作家等。


    比如说，很多亲传弟子都在一诺老师的指导下，写出了自己的书，然后自己就成为了有文化的商人。


    - (5) 代言明星


    为自己产品代言的明星等。


    比如说，香港著名影星古天乐为改变世界商学院代言，林志玲姐也在积极地帮一诺老师做音频课程的主持人。


    > 明星的信用背书能够提升品牌形象！

    > ——一诺老师


    - (6) 正在合作的大品牌


    权威大品牌，已经在跟自己合作的行业佼佼者。


    在世界500强企业里面，肯耐珂萨（人力资源服务商）服务过的就超过300家。


    做酒的企业都会强调自己跟茅台、五粮液的合作关系。


    - (7) 有实力的合作伙伴


    那些已经在合作的有实力的投资方、战略合作方、渠道商、加盟商等。


    有的人说我的项目被红杉资本投资了，除了意味着资金实力雄厚以外，还意味着背后有红杉资本的资源。


    乔布斯在第一代iPhone发布的时候也会邀请销售代理商来现场做分享。


    > 傍股东就可以拥有股东背后的资源！

    > ——一诺老师


    - (8) 经典名言


    一些名人名言或者经典语录也是有影响力的，比如“你可以拒绝学习，但你的竞争对手不会”就是借用经典名言来为自己的教育培训产品背书。


    这8种类型是最常见的通过权威的、有影响力的个人或机构来为自己进行信用背书的方式！


    > 有权威、有影响力的人都在使用、

    > 认可你的产品，会影响客户产生信任感！

    > ——一诺老师


    ## 第25课：信用背书3


    ### 做法2：火爆市场背书


    火爆市场背书，就是要把自己的项目在整个市场中的火爆情况告诉客户，让客户感受到大家都在疯狂购买。


    > 成功很简单，只要方法正确！

    > ——一诺老师


    具体要怎么做呢？


    - (1) 公布你的销售数量


    公布销售数量达到多少。比如小米公布月销量已经超过1000万台。


    - (2) 公布你的市场占有率


    公布市场占有率达到多少。比如苹果公布市场占有率已经达到35%。


    - (3) 公布你的增长速度


    如果销售数量不多、市场占有率不高，可以通过公布增长速度来体现火爆程度。


    比如销售量比上季度增长了200%。


    - (4) 公布销售的火爆场面


    比如大家排队、提货、发货的截图。


    - (5) 公布付款的火爆场面


    比如刷卡截图、转账截图、汇款截图。


    > 你看起来像什么，比是什么还要重要！

    > ——一诺老师


    这些都是为了告诉消费者我们的项目好，性价比高，引领趋势跟潮流，所以才会这么火爆，从而刺激客户跟风购买。


    人是很容易跟风的，当大家都买的时候，自己不买就好像很奇怪了。


    ## 第26课：信用背书4


    ### 做法3：客户见证背书


    指在会议过程中，请已经使用过产品的老客户来分享使用心得的背书方式。


    很多产品路演都会有这个环节，但是通常没做好，因为请来分享的老客户不知道怎么说，结果乱说一通，起的是反效果。


    > 人生需要磨难，成功需要教练！

    > ——一诺老师


    分享是要有技巧的，一诺老师多年研究下来，认为以下方式的分享最能打动客户。


    - (1) 购买之前


    三五句话概括遇到产品之前的经历。


    - (2) 购买痛点


    遇到这个项目之前，都有一些什么样的疑惑、困难、问题。其实这些就是场下的听众当下面临的事情。


    - (3) 购买过程


    讲自己购买这个项目的过程是怎么样的，一般我们建议讲爽快买单的经历。


    因为你的分享有一定的导向性作用，你分享爽快买单的经历，客户听了也容易跟着爽快买单。


    > 金杯银杯不如客户的口碑！

    > ——一诺老师


    - (4) 使用结果


    讲述购买之后的使用结果是怎么样的，和前面的痛点形成强烈的对比，引发客户跟你一样追求购买后的快乐。


    - (5) 感悟总结


    这里的感悟总结其实就是隐性的促成，说一些号召性的话语，不直接说促成的话语，但暗含让客户赶紧购买的观点。


    值得注意的是，不是仅仅告诉分享人这5个步骤就可以了，还要给他做训练。


    > 没有训练过的士兵上了战场就是送死，

    > 没有训练过的分享人上场最容易搞砸！

    > ——一诺老师


    最后还有一种方法：由讲师来把这些客户见证讲出来。讲师可以根据自己的需要来讲述。


    ## 第27课：信用背书5


