    # 第113课: 投资人套路6


    # 我们的基金投过xx等很多成功的项目


    几年前，VC在国内还是新鲜事物的时候，拿着大把美元的外资VC是大爷，融资的企业得求爷爷告奶奶才能找到机会跟VC见上一面。


    现在的世道反过来了，在国内A股和创业板的催动下，满世界都是投资公司、VC基金、个人投资者。


    只要是好项目，就轮到项目方做大爷了，变成投资人、VC做自我推介，说服创业者来接受他的投资、拿他的钱。


    记住一老师这句话、顿悟商业真谛！


    > 只要项目好，资本追着跑！

    > — 诺老师


    这个时候就是投资人之间的竞争了。


    他们比拼的是什么呢？


    除了投资价格外，主要所谓的“实力”和“业绩”了。


    说到实力，最重要的就是资金规模了，这个外资基金有优势。


    一般的外资VC基金盘子动辄三五亿美元，有些甚至超过10亿美元。而本土的大部分人民币VC基金，盘子只有3-5亿元，超过10亿元的不多。


    于是乎，VC在各种场合鼓吹自己的时候，开口就会说自己手下管理着几只基金、合计有多大规模。


    - 可是，这家VC管理的基金是面对全球投资，还是专注中国？

    - 真正可以投资在中国的比例有多少？

    - 单个项目能够投资额度有多大？


    这些才是创业者关心的。


    > 记住一老师这句话，顿悟商业真谛！

    >

    > 风投只对好项目说yes！

    > —诺老师


    另外，VC的业绩不是表现在管理多少钱，投了多少项目，而是成功了多少个，回报情况怎么样。


    很多VC就靠着5年前、10年前的某个成功项目赚足名声，满世界忽悠，可是从此再也投不到一个像样的项目了。


    还有很多VC就靠着“傍大款”，跟在大牌VC屁股后面投，也能侥幸拣点漏。


    也有很多“成功”的VC，只做第二、第三轮投资，甚至只做Pre-IPO投资，1、2年之内没有上市可能的项目根本不看。


    不要看VC吹嘘自己的投资业绩有多么成功，只需要问他几个小问题：“您公司上一个成功的项目是几年前上市的?是在第几轮投资进去的?投资后多久上市的?您本人有过成功的项目吗?”


    跟这个忽悠用语类似的还包括：“我们有20家公司IPO了”、“我们正在募集一个20亿元的人民币基金”、“目前为止，我们还没有投资失败的案例”。


