  - '[PAGE 29]


    # 第04课：成交的逻辑3


    # 什么是成交


    我是销售产品的，你购买了，就成交了；


    我是招商加盟的，你加盟了，就成交了；


    我是股权融资的，你投资了，就成交了。


    记生一诺老师的话，俗语商业真！


    > 成交无处不在！


    ——一诺老师


    +   谈判，达成一致，签订协议，这是成交；


    宣讲，吸引人才，精英加入，这是成交；


    竞岗，突出优势，得到聘用，这是成交；


