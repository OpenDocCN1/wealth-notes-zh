    # 第103课：资本路演套路3


    ## 如何路演 • 加深投资人的好感


    ### （1）不卑不亢


    不要嚣张也不要奉承，毕竟双方合作是平等的。


    在与投资人打交道与路演的过程中：


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 保持不卑不亢的态度就是最好的礼貌！

    >

    > ——一诺老师


    ### （2）真诚


    不隐瞒、不欺骗，把项目进行适当的包装与塑造并呈现给投资机构。


    ### （3）知识沉淀


    在自己创业项目的专业领域，应该要有足够多的知识沉淀，这样才能在与投资人的交流过程中应对自如。


    ### （4）问题预测并准备


    路演前，最好先做一些预演，找到一些做投资的朋友，提前预设一下投资人有可能会提问的问题，并准备好回答的话术。


    ### （5）情怀


    创业除了为了赚钱以外，还应该有些情怀。部分投资人会欣赏有情怀的创业者。这个跟一诺老师前面讲到的，把企业使命上升到一定高度是一样的道理。


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 我们要做一个有情怀的企业家！

    >

    > ——一诺老师


    ### （6）故事


    创业者要会讲故事，讲能打动投资人的故事。比如创业的初心、创业的决心等。


    ### （7）适当的个性


    创业者要有不屈不挠的精神。每个成功的创业者都有自己的特点。保持个性是必要的，但要把握好分寸，过了就不好了。


