    # 第108课：投资人套路1


    # 保持联系哟


    但更多的创业者在跟VC的接触中，常常被VC忽悠了。


    下面一诺老师就列举VC常用的十大忽悠用语，以便创业者在融资时参考使用，明白自己的处境，不要被VC忽悠之后还说句：“谢谢哦！”


    投资人经常忽悠创业者的一句话叫：保持联系！


    这句忽悠用语的频率是最高的，一个活跃的VC也许一天就要用这句话忽悠10个创业者，几乎可以成为他们的口头禅了。


    > 记住一诺老师这句话，顿悟商业真难！

    >

    > 人生就是一场心理学的游戏！

    > —诺老师


    在某个会议论坛上，一群创业者将某个大牌VC团团围住，VC逐一分发名片之后，有一两个幸运儿拉住VC要沟通一下他们的商业计划，3分钟之后VC为了尽快摆脱，跟创业者握手及挥手：“保持联系！”，然后一路小跑溜之大吉。


    在VC的会议室，你和你的创业团队给VC做融资演示，1个小时之后，你们兴高采烈地迈出VC大门，依依不舍地跟VC道别，VC握着你的手说：“保持联系！”


    这个忽悠用语极具迷惑性，初次接触VC的创业者通常会非常兴奋，以为VC真的还会跟他保持联系，殊不知这纯粹就是一句礼节用语，跟“再见”是一个意思。


    如果VC真的对创业者的项目非常感兴趣，他们会马上查一下级别更高的“领导”的时间表，尽快安排下一次会面，而不会说“保持联系”的。


    跟这个忽悠用语类似的还包括：“我们研究一下再跟你联系。”、“稍后给你电话。”


    通常情况下，这些话的潜台词是：“有多远走多远，以后别再来烦我了！”


    记性一诺老师句，顿悟商业真谛！


    > 不要看对方说什么，要看对方背后的含义！

    > —一诺老师


    # 第109课：投资人套路2


    # 我还有个会


    VC做得最多的一件事就是开会了，他们的日程通常被各种会议塞得满满的，而跟创业者见面、沟通项目的会则是最多的一种。


    “我还有个会”也是他们用来忽悠创业者常用的一个借口。


    还是在VC的会议室，你和你的创业团队给VC做融资演示，100页的PPT，你激情澎湃地讲到第30页，对面的几个VC却开始面色呆滞了。


    两个资深的VC打断你的话，说：“抱歉啊，张总，我们后面还有一个会，先过去下，你们继续。”


