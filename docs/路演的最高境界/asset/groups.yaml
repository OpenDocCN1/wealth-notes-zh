  md: "\n卖产品，卖商机，卖股权《路演的最高境界》收钱，收人，收心，收灵魂\n\n微商销售员带客户来品酒，用的或者卖的肯定是自己销售的酒，也就是他们会拿走酒水这部分的利润。\n\
    \n这样餐厅的收入就会大大减少。\n\n如果微商销售员来这里不能卖自己的酒，那他为何还要把客户带来这里？所以，要搞清楚做这个店的定位，到底是用来辅助市场，还是用来赢利？这就是企业的当下需求。\n\
    \n弟子被一诺老师这样一点拨，醍醐灌顶、恍然大悟！\n\n记住一诺老师这句话，顿悟商业真谛！\n\n> 用师者王，用友者霸，用徒者亡！\n> ——一诺老师\n\
    \n另外一家企业在这个方面就做得很成功——7天连锁酒店。7天连锁酒店是以快速招商的方式进行市场扩张的，它在招商之前对自己有个非常清楚的分析。\n\n一个连锁企业要快速在全国扩张，有三个核心条件：\n\
    \n- 人才\n- 系统\n- 资金\n\n人才，指经营连锁企业的人，包括店长、员工及其他岗位职员。\n\n系统，指一套完善的店务管理系统，包括员工管理、财务管理、营销管理、客户管理等。\n\
    \n资金，就是开新店所需投入的资金量。三者缺其一，新店就没法开起来。\n\n7天连锁酒店有着强大的人才培养能力，比如说，一般酒店培养一位店长需要2-3年，7天连锁酒店只用半年到1年就可以完成。\n\
    \n> 记住一诺老师这句，领悟商业真谛\n> 成功很简单，只要方法正确！\n> ——一诺老师\n\n另外，7天连锁酒店自己也研发了非常完善的运营管理系统，从开店要怎么选址、怎么装修、用什么样的设备，到新店怎么做营销、员工怎么管理、客户怎么管理、财务怎么管理等一系列的运营管理工作，都已经形成了可以快速复制的流程与标准。\n\
    \n所以，要快速扩张只需要解决资金的问题就可以了。\n\n7天连锁酒店采用了招商加盟的方式来做扩张，但招商方案里面就设定了“投资人只投资，不参与任何的经营管理”的条件，投资人唯一可以做的贡献就是推荐好的物业给7天连锁酒店的专业团队来评估，看这个地方是否适合做酒店。\n\
    \n其实，这也刚刚好利用了投资人的优势，规避了他们的劣势。因为很多投资人本身都不是做酒店行业的，要他来管理，很容易出问题。\n\n由于采用直营管理模式，保证原来设计好的流程标准能够执行到位，所以7天连锁酒店前期的年回报率达到30%，好的甚至达到100%。\n\
    \n可以看到，7天连锁酒店招商加盟的成功，是建立在清晰了解自己情况的基础上的。\n\n记住一诺老师这话，顿悟商业真谛！\n\n> 对自己没有清楚的了解，\n\
    > 研发不出最适合自己的招商方案！\n> ——一诺老师\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\n用300元最低融资500万，签订《零风险+对赌》协议！\n\
    \n- 零风险：没有融到约定金额，你1分钱损失没有！\n- 对赌：在约定的期限内没融资500万，倒赔你3-300万！\n\n想要实操，请马上联系一诺老师官方助理老师微信！\n\
    \n愿景：惠及全人类 使命：帮助更多人实现梦想 活着就是为了改变世界\n第①时间分享更多绝密课程 加微信：357607890\n\n## 第54课：招商路演的五个版块\n\
    \n### 第三个版块：客户资源\n\n李嘉诚先生说过，投资房产有三个核心：位置、位置、位置。过去做生意，开店的地段很大程度上决定了这家店的生死。\n\n\
    地段本身不值钱，值钱的是地段所带来的客户流量。现在互联网上面的生意也是，流量很大程度上决定了销量。\n\n记住一诺老师这句话，悟商业真谛！\n\n> 地段带来流量，流量决定销量！\n\
    > ——一诺老师\n\n当然，流量有精准的流量，也有不精准的流量。我们要明确自己要什么样的流量，也就是要明确客户群体。\n\n有一家企业叫魔鬼营销，创始人是一诺老师的弟子叫道一老师，是一位非常落地的创业导师。\n\
    \n一诺老师看着道一成长的，从他为一诺老师做助理、放音乐……擦黑板等，到一诺老师给他第一次机会让他上台演讲。\n\n曾经还被一诺老师的学员轰下讲台三次!\n\
    \n后来痛定思痛，道一从弟子升级为亲传弟子，在一诺老师的帮助下，道一的命运被改变，成为了万人敬仰的营销大师!\n\n万能营销在开展业务的时候发现，比起大中型企业，小微企业其实更需要管理咨询服务。\n\
    \n这些小微企业也明白自己需要咨询服务，也想购买咨询服务，但对于普通咨询公司动辄数十上百万元的咨询费用，它们只能望而却步。\n\n> 记住一诺老师这句话，顿悟商业！\n\
    > 成功很简单，只要方法正确!\n> ——一诺老师\n\n因为是亲传弟子，所以拥有一诺老师微信，有问题就可以请教一诺老师，在一诺老师的帮助下万能营销的定位非常清晰，专为小微企业提供咨询服务，所以开发了一系列针对小微企业的在线咨询、管理咨询、培训产品，主题包括企业战略、赢利模式、管理系统构建、人力资源、团队打造等。\n\
    \n万能营销对单个企业的服务收费比其他同行都要低，让小微企业很容易接受。\n\n因为市场需求的量极为庞大，万能营销又通过规模效应把咨询师、培训师的成本大大降低，同时更注重服务的实效性与落地性，所以创造了比其他咨询公司更好的口碑。\n\
