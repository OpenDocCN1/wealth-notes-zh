    #### (4) 永久性收益


    高级别代理可以享受其属下低级别代理的业绩提成。


    区域服务商可以享受该区域合作商的营业额提成。只要生意继续做, 这种收益就永久存在。


    举例一: 省级代理拿货价格是3折, 市级代理拿货价格是5折, 市级代理必须向所在区域的省级代理拿货。所以, 只要市级代理拿货, 省级代理就有2折的差额可以赚。


    举例二: 只要成为某连锁项目的区域服务商, 就可以享有该区域内所有连锁店0.5%的营业额提成。


