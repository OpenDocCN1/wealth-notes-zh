  md: "\n## 第41课：招商路演的形式\n\n招商加盟、招代理商、招合作商户\n\n招商路演的形式主要有三种：招募加盟商、招募代理商、招募合作商户。\n\n\
    ### 第一：招募加盟商\n\n招募加盟商更多是针对服务业与零售业来说的，为了便于大家理解，下面统称为门店。\n\n比如我们是开店的，已经有2家以上的门店了，也有一套相对完善的运营系统，这时，可以选择打造我们的连锁体系，让别人来加盟我们，开更多我们这个品牌的店。\n\
    \n这种行为就是招募加盟商。\n\n> 性一诺老师这句话，顿悟商业真理！\n> \n> 招商加盟就是：把发财机会卖给别人！\n> \n> ——一诺老师\n\n\
    最典型的就是麦当劳、肯德基。\n\n用这种方式做加盟的，餐饮行业最多，其次是服务业与零售业，如酒店、美容院、发廊、服装店、水果店、培训机构等。\n\n它们都有一个共同的特点，就是有门店——这里说的门店不一定是开在街边或者商业场所，也有的是在写字楼里。\n\
    \n### 第二：招募代理商\n\n招募代理商更多是针对制造业来说的。\n\n比如我是厂家，我希望生产出来的产品能够卖到全国，所以要找一些能够卖货的商家来销售我们的产品；或者说我们是项目方，我们希望找到更多的人来帮我们开拓市场。\n\
    \n这种行为就是招募代理商。\n\n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 招募代理就是：用别人的钱，花别人的时间，办大家的事情，钱进自己的口袋！\n\
    > \n> ——一诺老师\n\n绝大部分生产产品的厂家都是采用这一种方式。\n\n这些代理商的形式包括区域代理商、直销的经销商，甚至微商等。\n\n###\
    \ 第三：招募合作商户\n\n小到一个商场，大到一个商圈乃至一个城市，它们都希望有更多符合自己条件的商家进驻。\n\n这种行为就是招募合作商户。\n\n商场希望引进一些大品牌，因为大品牌，本身就很能够吸引人气。\n\
    \n每个城市都希望引进大企业，因为这会为当地带来税收、带来GDP、带来就业机会。\n\n一诺老师在本书和大家探讨的，主要是前面两种：招募加盟商、招募代理商。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 如果成功有一万个方法，最简单的是合作！\n> 如果成功只有一个方法，那铁定是合作！\n> \n>\
    \ ——一诺老师\n\n## 第42课：为什么要招商路演\n\n就是吸引天下资源为我所用\n\n为什么要做招商路演？一诺老师认为，就是吸引天下资源为我所用。就是希望借用更多的时间、资本、资源等，把自己的企业做大做强的过程！\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 天下资源不为我所有，但为我所用！\n> \n> ——一诺老师\n\n招商能够为企业带来的效益是显而易见的，它可以帮助企业实现以下目标：\n\
    \n- (1) 找到合作伙伴把蛋糕做大\n对于门店来说，自己开两三家店，只能做两三家店覆盖的市场，但如果能够开100家，就能做100家店覆盖的市场。\n\n\
    对于厂家来说，单靠厂家的能力，产品销量肯定是有限的。要把整个市场做好，还得借助全国，甚至是全世界合作伙伴的力量。\n\n- (2) 更好地发挥自身的优势\n\
    对于门店来说，已经形成较为清晰的赢利模式与运营系统，如果只用两三家店就很可惜，而如果能够用在100家店，那就有可能产生100家店的效益。\n\n对于厂家来说，其优势应该是产品研发、系统构建、市场战略布局，如果有好的合作伙伴，厂家就可以强化自身的优势，构建商业壁垒，快速发展。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 如果成功有一万个方法，最简单的是合作！\n> 如果成功只有一个方法，那铁定是合作！\n> \n>\
    \ ——一诺老师\n\n- (3) 适当弥补自身的劣势\n对于门店来说，现有资金或者现有资源只能开3家店，要开更多的店就必须等这3家店赢利起来之后，这个时间可能是半年、一年或者更久。\n\
    \n这个时候，就容易出现自己的开店模式被他人抄袭的风险。\n\n对于厂家来说，一般的厂家比较难在全国各地都建立自己的销售公司。若能与全国各地的代理商达成合作，通过代理商自身的资源进行推广，销量就可以很快上规模。\n\
    \n- (4) 快速建立品牌形象\n一个城市有一定数量的门店，消费者就会容易认为这个品牌做得好、做得专业，购买其产品和服务就更有安全感和保障。\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 门店的数量越多，就越能形成品牌效应！\n> \n> ——一诺老师\n\n对于厂家来说，销量上来了，产品的消费者或者使用者随着使用频率的增加，就会逐渐对该品牌形成认知，品牌形象就逐渐打造出来了。\n\
    \n- (5) 快速抢占市场\n对于门店来说，可以通过招商加盟借用别人的资金、资源来开更多的店，在竞争对手反应过来之前就占领市场。\n\n对于厂家来说，那些技术含量不高的新产品，又或者在知识产权保护不明确的情况下，是很容易被抄袭或者模仿的。\n\
    \n如果不能快速占领市场，就有可能会出现抄袭模仿的做得比自己还好的现象。\n\n- (6) 形成项目的良性循环\n对于门店来说，有了核心优势，开了更多的门店，占领了市场，就是构建起了壁垒，从而得以专注于系统的优化与市场的管理，降低经营性风险。\n\
    \n对于厂家来说，招商完成，代理商开始销售，工厂产品销量稳定，项目就形成良性循环。\n\n否则，没有代理商，销量很低，工厂产能无法发挥，或者生产出来变成存货卖不出去，那就很可惜了。\n\
    \n只要你的产品足够好，你的项目足够好，哪怕现在只是星星之火，借助着招商路演，发展成燎原之势也是完全可能的。\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 拿起麦克风，讲到台下全发疯！你就是亿万富翁！\n> \n> ——一诺老师\n\n## 第43课：招商路演的五个板块\n\n### 第一个版块：项目价值\n\
    \n要在招商路演讲中收到钱，单单凭一张嘴是不够的，还需要做很多的准备工作。当一切就绪的时候，收钱就易如反掌了。\n\n项目价值是招商路演讲的根本。\n\n\
    招商路演讲的成功，最根本的就是项目本身。\n\n其他所有的部分，都是由项目引申出来的。\n\n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 如果我们想赚别人的钱，就要用我们的“大价值”来换别人的“小钱”！\n\
    > \n> ——一诺老师\n\n那你的产品或者项目是不是具有价值呢？\n\n很多时候，不是我们没有价值，而是不懂得如何去塑造价值。\n\n项目的价值，是包装出来的。\n\
    \n所谓“包装”，不是无中生有，而是选择性地告诉客户我们项目的亮点，从而去塑造价值。\n\n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 包装不是无中生有，而是选择性地告诉客户，我们项目的亮点，从而去塑造价值！\n\
    > \n> ——一诺老师\n\n一诺老师给大家举几个例子：\n\n- 红酒——进口红酒——原瓶原装进口红酒——法国xx庄园原瓶原装进口红酒。\n- 羊肉串——新疆羊肉串——新疆原生态羊肉串——新疆维吾尔族大草原生态羊肉串。\n\
    - 酸奶——牦牛酸奶——西藏牦牛酸奶——西藏林芝鲁朗（中国的“阿尔卑斯山脉”）牦牛酸奶。\n\n如这3种商品，你看到最前面的名字，是不是没有什么感觉？但是，当你看到最后一个名字的时候，是不是充满着想象与期待？这就是包装的威力。\n\
    \n接下来一诺老师会从以下几个方面，来和大家谈谈如何包装项目价值。\n\n## 第44课：招商路演的五个板块\n\n### 第一个版块：项目价值1·深挖项目价值\n\
    \n项目价值，是指这个项目能够为社会创造的价值。再说得具体一点，就是这个项目能够做到：\n\n1. 解决什么痛点。\n2. 带来什么好处。\n3. 提供什么便利。\n\
    4. 增加什么效益。\n5. 降低什么成本。\n6. 构建什么未来。\n7. 如何影响世界。\n\n> 一诺老师道：\n> \n> 一场好的路演，一定要有一个令人唏嘘的痛点被化解的时刻！\n\
    > \n> ——一诺老师\n\n乔布斯无疑是其中的世界顶级大师。\n\n他在发布iPod播放器的时候，用的广告词是“iPod播放器，把1000首歌装进你的口袋”。\n\
    \n在iPhone 3G上市前，乔布斯只用一句话就直击听众痛点：“售价减半，速度翻倍。”\n\n发布Macbook Air的时候，乔布斯称它非常薄，可以装进一个信封。但是乔布斯并没有到这里就结束，因为这句话只是提出了很多人感到电脑过于厚重的痛点，并不足以戳痛他们。\n\
    \n所以，乔布斯接下来做了一个动作——从一个信封中，拿出了一台Macbook Air。\n\n这就是痛点的解决！\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 一个好的产品或项目的诞生，必定伴随着用户痛点的解决！\n> \n> ——一诺老师\n\n一诺老师再以iPhone为例，从7个方面去思考项目价值。\n\
    \n1. 解决什么痛点：手机按键太多，麻烦。\n2. 带来什么好处：各种软件都可以在手机上运行。\n3. 提供什么便利：操作、使用方便。\n4. 增加什么效益：处理工作的效率加快，与家人联系的效果更好。\n\
    5. 降低什么成本：许多功能集合在手机上，不用买很多其他设备。\n6. 构建什么未来：iPhone会变成世界第一家手机品牌。\n7. 如何影响世界：用手机处理一切原来只有用电脑才能处理的事项。\n\
    \n这就是iPhone的项目价值。\n\n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 客户购买的不是产品，而是价值！\n> \n> ——一诺老师\n\
    \n一诺老师再带大家一起来看看阿里巴巴的例子——\n\n1. 解决什么痛点：做生意铺面租金太贵。\n2. 带来什么好处：网上就可以购物，网上就可以做生意。\n\
    3. 提供什么便利：商家线上就可以找到客户，客户线上就可以找到商家。\n4. 增加什么效益：不用在经常跑到商圈、批发市场去找商品。\n5. 降低什么成本：节省铺租等费用。\n\
    6. 构建什么未来：只要能上网，几乎所有的东西都可以买到。\n7. 如何影响世界：让天下没有难做的生意。\n\n不是每一个项目都会包含以上7种项目价值，但我们可以深挖、深挖、再深挖。\n\
    \n为什么互联网的项目价值高？因为互联网正在改变世界。\n\n为什么高科技的项目价值高？因为科技也在改变世界。\n\n## 第45课：招商路演的五个板块\n\
    \n### 第一个版块：项目价值2·项目概念包装\n\n为什么要做项目概念的包装？\n\n因为，新概念，就有新机会，所以呢，我们要学会包装概念，操作概念！\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 概念可以让我们的项目：更高大上、更有影响力与震撼力！\n> \n> ——一诺老师\n\n那要如何进行包装呢？\n\
    \n这就要求你在设计项目的时候跟当下的风口结合起来。\n\n雷军不是说了句大家都很熟悉的话嘛：“站在风口上，猪都会飞起来。”\n\n也就是说，你的项目要符合当下的风口。\n\
    \n符合风口的项目，不仅会让你的潜在代理商、加盟商很感兴趣，投资机构也会很感兴趣。\n\n## 第46课：招商路演的五个板块\n\n### 第一个版块：项目价值3·行业趋势包装\n\
    \n行业趋势包装，目的是告诉大家，接下来这个行业的发展趋势会很猛。从哪些方面能够体现呢？\n\n1. 政府部门对本行业的表态\n比如政府部门说这个行业接下来会怎么发展，国家会有哪些政策支持，国家预测未来一段时间这个行业会发展成怎样。\n\
    \n2. 行业营业额增长情况\n把该行业过去5年、10年的营业额进行对比，从而计算出增长率，来体现行业趋势。\n\n> 记住一老师这句话，领悟商业真理！\n\
    > \n> 人们渴望追逐趋势，而又害怕失去机会！\n> \n> ——一诺老师\n\n例如：xx行业过去10年的营业额年增长率为40%。\n\n3. 行业消费者数量增长情况\n\
    这个行业过去3年、5年的消费者数量增长情况。\n\n比如：过去3年，移动互联网消费者数量以每年多少倍的速度在增加。\n\n4. 外国统计数据跟本国统计数据的对比\n\
    通过与发达国家进行数据对比，体现市场潜力。\n\n例如：美国人均拥有3.5张信用卡，中国人均拥有0.3张信用卡。\n\n5. 社会名人对这个行业的表态\n\
    名人、企业家、资深专家学者对行业的判断。\n\n例如：百度的李彦宏特别看好AI(人工智能)，巴菲特先生特别看好中国的新能源汽车。\n\n6. 其他能够体现这个行业趋势的数据或信息\n\
    \n> 记住一诺老师这句话，领悟商业真理！\n> \n> 我们要拿出足够的证据，来证明我们说的是对的！\n> \n> ——一诺老师\n\n## 第47课：招商路演的五个板块\n\
    \n### 第一个版块：项目价值4·企业实力包装\n\n企业实力包装，通俗地说就是告诉别人你“很厉害”。\n\n怎么体现呢？\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 你看起来像什么，比是什么还要重要！\n> \n> ——一诺老师\n\n1. 模式优势\n企业商业模式的优势，企业招商模式的优势，企业销售模式的优势。\n\
    \n2. 创始团队\n创始团队的背景。\n\n如果团队中有“牛人”，比如大企业高管、顶尖技术人才等，就重点说说；如果没有，简单带过就可以了。\n\n3. 企业人数\n\
    企业人数通常代表着企业的规模，但最好是跟企业的营业额成正比。\n\n4. 企业营业额\n比起人数，企业营业额的规模及营业额的增长速度更能体现企业的实力。\n\
    \n5. 人均产能\n人均产能反映企业创造价值的效率。\n\n同样是1000万元的营业额，一家公司有100个员工，另一家公司只有10个员工，实力就完全不一样了。\n\
    \n他们的人均产能分别是10万元/人和100万元/人。\n\n一家公司平均每人每年创造100万元的价值，另一家公司平均每人每年创造10万元的价值，哪个实力强？高下立见。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 要学会拿自己的优势，去PK对手的劣势！\n> \n> ——一诺老师\n\n6. 赢利状况\n这个更多是针对门店来说的。\n\
    \n一个门店自己能够赢利是别人加盟你的先决条件，赢利的速度越快，说明你能力越强，别人加盟的渴望度也越高。\n\n7. 核心技术\n核心技术是竞争对手无法超越或者短期内无法超越的商业壁垒，也是市场拓展、招商加盟的利器。\n\
    \n8. 所得荣誉\n借助官方机构、权威机构、第三方的报告、评估或评价来体现自己的强大。\n\n9. 名人参观\n试想，如果国家主席、国家总理参观过你的企业，哪怕是省长、市长来参观过，那也是超强的信用背书。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 你是谁不重要，重要的是你跟谁在一起！\n> \n> ——一诺老师\n\n10. 投资机构\n你舅舅投资了你的公司，没有人会在意，但如果是红杉资本、阿里巴巴投资了你的公司，那加盟你的人是不是信心倍增？\n\
    \n11. 合作伙伴\n比如腾讯跟你形成了战略合作，给你提供相关支持，或者打算要收购你。这也是很强大的背书。\n\n12. 客户见证\n都有哪些有影响力的个人、企业、单位在使用或者采购你的产品，这些权威的个人、企业都在使用你的产品，已经为你这个项目的信誉度拉高了很多分数。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 客户的一个yes，胜过自己的千言万语！\n> \n> ——一诺老师\n\n13. 其他能体现企业实力的信息\n\
    \n## 第48课：招商路演的五个板块\n\n### 第一个版块：项目价值5·产品价值包装\n\n如何进行产品价值的包装？可以分为5个步骤：\n\n1. 第一步骤：找到痛点——找到市场上用户的痛点\n\
    2. 第二步骤：放大痛点——阐述该痛点的严重后果\n3. 第三步骤：产品特点——针对性地介绍我们的产品有什么特点\n4. 第四步骤：解决痛点——我们的特点如何解决前面所说的痛点\n\
    5. 第五步骤：升级高度——我们这个产品是解决国内(甚至世界)多少亿人的什么问题\n\n> 记住一老师这句话，顿悟商业真理！\n> \n> 客户的一个yes，胜过自己的千言万语！\n\
    > \n> ——一诺老师\n\n举例：国内有许多直销公司。\n\n每一家直销公司都有自己的产品优势。\n\n但大部分直销公司的产品价格都比较高。\n\n以日用品来说，大部分直销公司销售的日用品的价格都会高于在超市销售的其他品牌。\n\
    \n这就形成了一个痛点——很多直销的销售员是消费不起自己销售的产品的，于是就没有了产品的使用体验，不能很好地说服客户。\n\n十多年前，有一个直销品牌，请一诺老师出山，给他们做全国第一届招商讲师培训。\n\
    \n通过了解，一诺老师发现这家企业的产品性价比非常高，而且价格居然跟超市的其他知名品牌更低。\n\n这就找到了市场上的痛点。\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 客户最大的痛点，就是我们最大的卖点！\n> \n> ——一诺老师\n\n在一诺老师的帮助下，这个品牌发展得非常快，两年时间里足足增长了15倍多。\n"
  mdcn: "\n## 第41课：招商路演的形式\n\n招商加盟、招代理商、招合作商户\n\n招商路演的形式主要有三种：招募加盟商、招募代理商、招募合作商户。\n\
    \n### 第一：招募加盟商\n\n招募加盟商更多是针对服务业与零售业来说的，为了便于大家理解，下面统称为门店。\n\n比如我们是开店的，已经有2家以上的门店了，也有一套相对完善的运营系统，这时，可以选择打造我们的连锁体系，让别人来加盟我们，开更多我们这个品牌的店。\n\
    \n这种行为就是招募加盟商。\n\n> 性一诺老师这句话，顿悟商业真理！\n> \n> 招商加盟就是：把发财机会卖给别人！\n> \n> ——一诺老师\n\n\
    最典型的就是麦当劳、肯德基。\n\n用这种方式做加盟的，餐饮行业最多，其次是服务业与零售业，如酒店、美容院、发廊、服装店、水果店、培训机构等。\n\n它们都有一个共同的特点，就是有门店——这里说的门店不一定是开在街边或者商业场所，也有的是在写字楼里。\n\
    \n### 第二：招募代理商\n\n招募代理商更多是针对制造业来说的。\n\n比如我是厂家，我希望生产出来的产品能够卖到全国，所以要找一些能够卖货的商家来销售我们的产品；或者说我们是项目方，我们希望找到更多的人来帮我们开拓市场。\n\
    \n这种行为就是招募代理商。\n\n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 招募代理就是：用别人的钱，花别人的时间，办大家的事情，钱进自己的口袋！\n\
    > \n> ——一诺老师\n\n绝大部分生产产品的厂家都是采用这一种方式。\n\n这些代理商的形式包括区域代理商、直销的经销商，甚至微商等。\n\n###\
    \ 第三：招募合作商户\n\n小到一个商场，大到一个商圈乃至一个城市，它们都希望有更多符合自己条件的商家进驻。\n\n这种行为就是招募合作商户。\n\n商场希望引进一些大品牌，因为大品牌，本身就很能够吸引人气。\n\
    \n每个城市都希望引进大企业，因为这会为当地带来税收、带来GDP、带来就业机会。\n\n一诺老师在本书和大家探讨的，主要是前面两种：招募加盟商、招募代理商。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 如果成功有一万个方法，最简单的是合作！\n> 如果成功只有一个方法，那铁定是合作！\n> \n>\
    \ ——一诺老师\n\n## 第42课：为什么要招商路演\n\n就是吸引天下资源为我所用\n\n为什么要做招商路演？一诺老师认为，就是吸引天下资源为我所用。就是希望借用更多的时间、资本、资源等，把自己的企业做大做强的过程！\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 天下资源不为我所有，但为我所用！\n> \n> ——一诺老师\n\n招商能够为企业带来的效益是显而易见的，它可以帮助企业实现以下目标：\n\
    \n- (1) 找到合作伙伴把蛋糕做大\n对于门店来说，自己开两三家店，只能做两三家店覆盖的市场，但如果能够开100家，就能做100家店覆盖的市场。\n\n\
    对于厂家来说，单靠厂家的能力，产品销量肯定是有限的。要把整个市场做好，还得借助全国，甚至是全世界合作伙伴的力量。\n\n- (2) 更好地发挥自身的优势\n\
    对于门店来说，已经形成较为清晰的赢利模式与运营系统，如果只用两三家店就很可惜，而如果能够用在100家店，那就有可能产生100家店的效益。\n\n对于厂家来说，其优势应该是产品研发、系统构建、市场战略布局，如果有好的合作伙伴，厂家就可以强化自身的优势，构建商业壁垒，快速发展。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 如果成功有一万个方法，最简单的是合作！\n> 如果成功只有一个方法，那铁定是合作！\n> \n>\
    \ ——一诺老师\n\n- (3) 适当弥补自身的劣势\n对于门店来说，现有资金或者现有资源只能开3家店，要开更多的店就必须等这3家店赢利起来之后，这个时间可能是半年、一年或者更久。\n\
    \n这个时候，就容易出现自己的开店模式被他人抄袭的风险。\n\n对于厂家来说，一般的厂家比较难在全国各地都建立自己的销售公司。若能与全国各地的代理商达成合作，通过代理商自身的资源进行推广，销量就可以很快上规模。\n\
    \n- (4) 快速建立品牌形象\n一个城市有一定数量的门店，消费者就会容易认为这个品牌做得好、做得专业，购买其产品和服务就更有安全感和保障。\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 门店的数量越多，就越能形成品牌效应！\n> \n> ——一诺老师\n\n对于厂家来说，销量上来了，产品的消费者或者使用者随着使用频率的增加，就会逐渐对该品牌形成认知，品牌形象就逐渐打造出来了。\n\
    \n- (5) 快速抢占市场\n对于门店来说，可以通过招商加盟借用别人的资金、资源来开更多的店，在竞争对手反应过来之前就占领市场。\n\n对于厂家来说，那些技术含量不高的新产品，又或者在知识产权保护不明确的情况下，是很容易被抄袭或者模仿的。\n\
    \n如果不能快速占领市场，就有可能会出现抄袭模仿的做得比自己还好的现象。\n\n- (6) 形成项目的良性循环\n对于门店来说，有了核心优势，开了更多的门店，占领了市场，就是构建起了壁垒，从而得以专注于系统的优化与市场的管理，降低经营性风险。\n\
    \n对于厂家来说，招商完成，代理商开始销售，工厂产品销量稳定，项目就形成良性循环。\n\n否则，没有代理商，销量很低，工厂产能无法发挥，或者生产出来变成存货卖不出去，那就很可惜了。\n\
    \n只要你的产品足够好，你的项目足够好，哪怕现在只是星星之火，借助着招商路演，发展成燎原之势也是完全可能的。\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 拿起麦克风，讲到台下全发疯！你就是亿万富翁！\n> \n> ——一诺老师\n\n## 第43课：招商路演的五个板块\n\n### 第一个版块：项目价值\n\
    \n要在招商路演讲中收到钱，单单凭一张嘴是不够的，还需要做很多的准备工作。当一切就绪的时候，收钱就易如反掌了。\n\n项目价值是招商路演讲的根本。\n\n\
    招商路演讲的成功，最根本的就是项目本身。\n\n其他所有的部分，都是由项目引申出来的。\n\n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 如果我们想赚别人的钱，就要用我们的“大价值”来换别人的“小钱”！\n\
    > \n> ——一诺老师\n\n那你的产品或者项目是不是具有价值呢？\n\n很多时候，不是我们没有价值，而是不懂得如何去塑造价值。\n\n项目的价值，是包装出来的。\n\
    \n所谓“包装”，不是无中生有，而是选择性地告诉客户我们项目的亮点，从而去塑造价值。\n\n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 包装不是无中生有，而是选择性地告诉客户，我们项目的亮点，从而去塑造价值！\n\
    > \n> ——一诺老师\n\n一诺老师给大家举几个例子：\n\n- 红酒——进口红酒——原瓶原装进口红酒——法国xx庄园原瓶原装进口红酒。\n- 羊肉串——新疆羊肉串——新疆原生态羊肉串——新疆维吾尔族大草原生态羊肉串。\n\
    - 酸奶——牦牛酸奶——西藏牦牛酸奶——西藏林芝鲁朗（中国的“阿尔卑斯山脉”）牦牛酸奶。\n\n如这3种商品，你看到最前面的名字，是不是没有什么感觉？但是，当你看到最后一个名字的时候，是不是充满着想象与期待？这就是包装的威力。\n\
    \n接下来一诺老师会从以下几个方面，来和大家谈谈如何包装项目价值。\n\n## 第44课：招商路演的五个板块\n\n### 第一个版块：项目价值1·深挖项目价值\n\
    \n项目价值，是指这个项目能够为社会创造的价值。再说得具体一点，就是这个项目能够做到：\n\n1. 解决什么痛点。\n2. 带来什么好处。\n3. 提供什么便利。\n\
    4. 增加什么效益。\n5. 降低什么成本。\n6. 构建什么未来。\n7. 如何影响世界。\n\n> 一诺老师道：\n> \n> 一场好的路演，一定要有一个令人唏嘘的痛点被化解的时刻！\n\
    > \n> ——一诺老师\n\n乔布斯无疑是其中的世界顶级大师。\n\n他在发布iPod播放器的时候，用的广告词是“iPod播放器，把1000首歌装进你的口袋”。\n\
    \n在iPhone 3G上市前，乔布斯只用一句话就直击听众痛点：“售价减半，速度翻倍。”\n\n发布Macbook Air的时候，乔布斯称它非常薄，可以装进一个信封。但是乔布斯并没有到这里就结束，因为这句话只是提出了很多人感到电脑过于厚重的痛点，并不足以戳痛他们。\n\
    \n所以，乔布斯接下来做了一个动作——从一个信封中，拿出了一台Macbook Air。\n\n这就是痛点的解决！\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 一个好的产品或项目的诞生，必定伴随着用户痛点的解决！\n> \n> ——一诺老师\n\n一诺老师再以iPhone为例，从7个方面去思考项目价值。\n\
    \n1. 解决什么痛点：手机按键太多，麻烦。\n2. 带来什么好处：各种软件都可以在手机上运行。\n3. 提供什么便利：操作、使用方便。\n4. 增加什么效益：处理工作的效率加快，与家人联系的效果更好。\n\
    5. 降低什么成本：许多功能集合在手机上，不用买很多其他设备。\n6. 构建什么未来：iPhone会变成世界第一家手机品牌。\n7. 如何影响世界：用手机处理一切原来只有用电脑才能处理的事项。\n\
    \n这就是iPhone的项目价值。\n\n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 客户购买的不是产品，而是价值！\n> \n> ——一诺老师\n\
    \n一诺老师再带大家一起来看看阿里巴巴的例子——\n\n1. 解决什么痛点：做生意铺面租金太贵。\n2. 带来什么好处：网上就可以购物，网上就可以做生意。\n\
    3. 提供什么便利：商家线上就可以找到客户，客户线上就可以找到商家。\n4. 增加什么效益：不用在经常跑到商圈、批发市场去找商品。\n5. 降低什么成本：节省铺租等费用。\n\
    6. 构建什么未来：只要能上网，几乎所有的东西都可以买到。\n7. 如何影响世界：让天下没有难做的生意。\n\n不是每一个项目都会包含以上7种项目价值，但我们可以深挖、深挖、再深挖。\n\
    \n为什么互联网的项目价值高？因为互联网正在改变世界。\n\n为什么高科技的项目价值高？因为科技也在改变世界。\n\n## 第45课：招商路演的五个板块\n\
    \n### 第一个版块：项目价值2·项目概念包装\n\n为什么要做项目概念的包装？\n\n因为，新概念，就有新机会，所以呢，我们要学会包装概念，操作概念！\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 概念可以让我们的项目：更高大上、更有影响力与震撼力！\n> \n> ——一诺老师\n\n那要如何进行包装呢？\n\
    \n这就要求你在设计项目的时候跟当下的风口结合起来。\n\n雷军不是说了句大家都很熟悉的话嘛：“站在风口上，猪都会飞起来。”\n\n也就是说，你的项目要符合当下的风口。\n\
    \n符合风口的项目，不仅会让你的潜在代理商、加盟商很感兴趣，投资机构也会很感兴趣。\n\n## 第46课：招商路演的五个板块\n\n### 第一个版块：项目价值3·行业趋势包装\n\
    \n行业趋势包装，目的是告诉大家，接下来这个行业的发展趋势会很猛。从哪些方面能够体现呢？\n\n1. 政府部门对本行业的表态\n比如政府部门说这个行业接下来会怎么发展，国家会有哪些政策支持，国家预测未来一段时间这个行业会发展成怎样。\n\
    \n2. 行业营业额增长情况\n把该行业过去5年、10年的营业额进行对比，从而计算出增长率，来体现行业趋势。\n\n> 记住一老师这句话，领悟商业真理！\n\
    > \n> 人们渴望追逐趋势，而又害怕失去机会！\n> \n> ——一诺老师\n\n例如：xx行业过去10年的营业额年增长率为40%。\n\n3. 行业消费者数量增长情况\n\
    这个行业过去3年、5年的消费者数量增长情况。\n\n比如：过去3年，移动互联网消费者数量以每年多少倍的速度在增加。\n\n4. 外国统计数据跟本国统计数据的对比\n\
    通过与发达国家进行数据对比，体现市场潜力。\n\n例如：美国人均拥有3.5张信用卡，中国人均拥有0.3张信用卡。\n\n5. 社会名人对这个行业的表态\n\
    名人、企业家、资深专家学者对行业的判断。\n\n例如：百度的李彦宏特别看好AI(人工智能)，巴菲特先生特别看好中国的新能源汽车。\n\n6. 其他能够体现这个行业趋势的数据或信息\n\
    \n> 记住一诺老师这句话，领悟商业真理！\n> \n> 我们要拿出足够的证据，来证明我们说的是对的！\n> \n> ——一诺老师\n\n## 第47课：招商路演的五个板块\n\
    \n### 第一个版块：项目价值4·企业实力包装\n\n企业实力包装，通俗地说就是告诉别人你“很厉害”。\n\n怎么体现呢？\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 你看起来像什么，比是什么还要重要！\n> \n> ——一诺老师\n\n1. 模式优势\n企业商业模式的优势，企业招商模式的优势，企业销售模式的优势。\n\
    \n2. 创始团队\n创始团队的背景。\n\n如果团队中有“牛人”，比如大企业高管、顶尖技术人才等，就重点说说；如果没有，简单带过就可以了。\n\n3. 企业人数\n\
    企业人数通常代表着企业的规模，但最好是跟企业的营业额成正比。\n\n4. 企业营业额\n比起人数，企业营业额的规模及营业额的增长速度更能体现企业的实力。\n\
    \n5. 人均产能\n人均产能反映企业创造价值的效率。\n\n同样是1000万元的营业额，一家公司有100个员工，另一家公司只有10个员工，实力就完全不一样了。\n\
    \n他们的人均产能分别是10万元/人和100万元/人。\n\n一家公司平均每人每年创造100万元的价值，另一家公司平均每人每年创造10万元的价值，哪个实力强？高下立见。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 要学会拿自己的优势，去PK对手的劣势！\n> \n> ——一诺老师\n\n6. 赢利状况\n这个更多是针对门店来说的。\n\
    \n一个门店自己能够赢利是别人加盟你的先决条件，赢利的速度越快，说明你能力越强，别人加盟的渴望度也越高。\n\n7. 核心技术\n核心技术是竞争对手无法超越或者短期内无法超越的商业壁垒，也是市场拓展、招商加盟的利器。\n\
    \n8. 所得荣誉\n借助官方机构、权威机构、第三方的报告、评估或评价来体现自己的强大。\n\n9. 名人参观\n试想，如果国家主席、国家总理参观过你的企业，哪怕是省长、市长来参观过，那也是超强的信用背书。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 你是谁不重要，重要的是你跟谁在一起！\n> \n> ——一诺老师\n\n10. 投资机构\n你舅舅投资了你的公司，没有人会在意，但如果是红杉资本、阿里巴巴投资了你的公司，那加盟你的人是不是信心倍增？\n\
    \n11. 合作伙伴\n比如腾讯跟你形成了战略合作，给你提供相关支持，或者打算要收购你。这也是很强大的背书。\n\n12. 客户见证\n都有哪些有影响力的个人、企业、单位在使用或者采购你的产品，这些权威的个人、企业都在使用你的产品，已经为你这个项目的信誉度拉高了很多分数。\n\
    \n> 记住一诺老师这句话，顿悟商业真理！\n> \n> 客户的一个yes，胜过自己的千言万语！\n> \n> ——一诺老师\n\n13. 其他能体现企业实力的信息\n\
    \n## 第48课：招商路演的五个板块\n\n### 第一个版块：项目价值5·产品价值包装\n\n如何进行产品价值的包装？可以分为5个步骤：\n\n1. 第一步骤：找到痛点——找到市场上用户的痛点\n\
    2. 第二步骤：放大痛点——阐述该痛点的严重后果\n3. 第三步骤：产品特点——针对性地介绍我们的产品有什么特点\n4. 第四步骤：解决痛点——我们的特点如何解决前面所说的痛点\n\
    5. 第五步骤：升级高度——我们这个产品是解决国内(甚至世界)多少亿人的什么问题\n\n> 记住一老师这句话，顿悟商业真理！\n> \n> 客户的一个yes，胜过自己的千言万语！\n\
    > \n> ——一诺老师\n\n举例：国内有许多直销公司。\n\n每一家直销公司都有自己的产品优势。\n\n但大部分直销公司的产品价格都比较高。\n\n以日用品来说，大部分直销公司销售的日用品的价格都会高于在超市销售的其他品牌。\n\
    \n这就形成了一个痛点——很多直销的销售员是消费不起自己销售的产品的，于是就没有了产品的使用体验，不能很好地说服客户。\n\n十多年前，有一个直销品牌，请一诺老师出山，给他们做全国第一届招商讲师培训。\n\
    \n通过了解，一诺老师发现这家企业的产品性价比非常高，而且价格居然跟超市的其他知名品牌更低。\n\n这就找到了市场上的痛点。\n\n> 记住一诺老师这句话，顿悟商业真理！\n\
    > \n> 客户最大的痛点，就是我们最大的卖点！\n> \n> ——一诺老师\n\n在一诺老师的帮助下，这个品牌发展得非常快，两年时间里足足增长了15倍多。\n"
