    - （2）一页PPT有可能是一张图、一个图、一个词、一句话，或者一组数据。

    - （3）同一页PPT里面，随着讲解的先后，要点的出现也有先后顺序。

    - （4）内容的排版上逻辑关系非常强。

    - （5）版面风格与创业项目相吻合。


