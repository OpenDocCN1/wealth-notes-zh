    # 第114课：投资人套路7


    # 我们能够给企业带来很大的帮助


    VC的钱其实跟某些人差不多，比如山西煤老板、江浙富二代，但VC自己绝对不会这么看，他们常常号称他们的钱更有价值。除了钱之外，他们还会附上“增值服务”。


    记住—诺老师这句话，顿悟商业真谛！


    > 投资人是没有时间帮你做，除了投资以外的任何事情！

    > —诺老师


    VC的商业模式里，最重要的一条就是“不把鸡蛋放在同一个篮子里”，那么如果把鸡蛋放在10个篮子里，即便打翻了9个篮子，打碎了9个鸡蛋，只要有1个鸡蛋孵出小鸡，他们就算成功了。


    实际上，绝大多数VC公司不会只把“鸡蛋”（资金）放在10个“篮子”（被投资企业）里的，有时候VC公司的一个合伙人需要照顾10多个“篮子”。


    VC合伙人要是每月能够为每家企业花5到10个小时去了解企业的经营状况，帮助企业出谋划策，就算是谢天谢地了。


    这些VC每天还要忙着见一大堆新项目，国内国外、省内省外飞来飞去的，能够带来的“增值服务”可能仅仅是为企业省了一点儿广告费而已。


    当然，也有真的能够提供增值服务的VC，但数量少得可怜，应该不超过十分之一。


    如果某个VC碰巧刚好了解企业所处的行业，或者认识某个不错的职业经理人，也许还真的能给企业提供一点帮助。


    > 记一诺老师这句话，悟商业真谛！

    >

    > 世界上没有无缘无故的爱，关系到位了一切都不是问题！

    > 一诺老师


    这些有价值的VC通常有过多 年创业并成功的经历，但他们中的大部分远离企业经营多年，对市场的感觉已经与实际脱节。


    绝大部分VC所谓的“行业经验”，真实情况是这样的——

    - 你是做新能源的，他也认识一个煤老板；

    - 你是做医疗器械的，他投资过保健品公司；

    - 你是做B2C电子商务的，他看过十几家垂直B2B网站。


    最可怕的是那种投行出身或VC公司成长起来的VC合伙人，他们毫无企业经营管理经验，却可以拿被投资企业做试验田，给企业提供所谓“战略规划”方面的“增值服务”，常常会把企业给整到沟里去。


    跟这个忽悠用语类似的还包括：“我们在这个行业有很多经验。”、“我们能够给公司带来战略价值。”、“我们跟红杉、鼎晖这些VC也很熟，跟摩根、高盛这些投行的人很熟，以后的融资、上市我们很容易搞定。”


    通常情况下，这些话的潜台词是：“我们其实都是MBA出身，做过几年投行券商，但没有经营过企业，什么行业发展、战略、市场、营销、人力资源我们统统不懂！赶紧上市捞一笔就好了。”


    記一诺老师这句，顿悟商业真谛！


    > 天下熙熙皆为利来，天下攘攘皆为利往！

    > —一诺老师


