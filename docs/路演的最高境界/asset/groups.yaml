    上台的三个好处：拍照很好看，便于宣传，而且台上的人会有压力，成交率更高一些！\n一诺老师\n\n一诺老师在成交环节，通常会对已经被邀请上来说：\n> “台上的朋友，一诺老师不会一个一个逼你们报名，一诺老师不干那种事情。因为大家这么认一诺老师。一诺老师其实没有其他要求，只是想和大家拍照而已。各位朋友，我们一起把右手伸出来，掌心向上，面带微笑看向摄影师。”\n\
