    - 团队执行的故事：体现有铁军团队，强大的执行力，这是项目、产品成功的保障。

    - 员工工作的故事：体现员工用什么样的态度在这里做事，有什么心得。

    - 研发产品的故事：体现用户至上，一切从用户角度出发。

