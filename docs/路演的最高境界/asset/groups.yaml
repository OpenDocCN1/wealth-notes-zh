    - 后记 2：终极成功秘密 ... 509\n  - 自古成功有路——师道也 ... 509\n\n### 第 01 课：产品路演\n\n#### 什么是产品路演\n\
    \n乔布斯通过产品路演引爆苹果手机的销量，打败了原来的行业龙头诺基亚。\n\n小米也通过产品路演，带来巨大的订单，短短几年就把销量做到行业前三名。\n\n\
    直销公司通过产品路演，销售产品及招募，吸引更多人加入到他们的事业。\n\n保险公司通过产品路演，让消费者认识到保险的重要性，从而进行购买。\n\n我们可能对另外一个词语比较熟悉，那就是“会议营销”。\n\
    \n> 路演的最高境界就是：\n> 收钱、收人、收心、收灵魂！\n> ——诸老师\n\n会议营销的主要内容包括“产品路演”、“招商路演”和“资本路演”，可以说这三部分是会议营销的三种主要形式的细分。\n\
    \n它们之间的区别是——\n\n- 产品路演的目的是销售产品/服务；\n- 招商路演的目的是招代理商/加盟商/合作商；\n- 资本路演的目的是为进入资本市场而融资。\n\
    \n本书讲解将围绕第一部分：“产品路演”展开。\n\n**什么是产品路演？**\n\n所谓的产品路演，就是通过邀约客户来参加会议，走完一系列会议流程，最终达到让客户购买产品的目的。\n\
    \n> 产品路演就是通过一对多的演说，\n> 来让客户购买产品/服务的过程！\n> ——诺老师\n\n产品路演每天都在进行，如果不懂这里面的门道，想要成交产品恐怕不是件很轻松的事情。\n\
    \n虽然市场上面成功的产品路演比失败的产品路演要多，但这并不代表大家都会做产品路演，而是因为不会做产品路演的公司都倒得差不多了，会做产品路演的公司都活下来了，并不断优化。\n\
    \n所以，产品路演的好坏涉及企业的生死存亡一点都不为过。\n\n产品路演有大型的，也有小型的。\n\n大型的如苹果、小米的发布会；小型的就是直销或保险行业的产品说明会，还有各种公司的沙龙会等。\n\
    \n你会发现这些会议的核心目标只有一个，就是卖出更多的产品/服务。\n\n不管是大型的还是小型的路演，有一个角色都非常重要，那就是会议营销的主讲人，一诺老师也把他称为“成交讲师”。\n\
    \n这位成交讲师将直接影响结果。\n\n产品路演失败无非就三个原因——\n\n> 一是会议团队配合得不好，\n> 二是客户不够精准，三是讲师讲得太差！\n\
    > ——一诺老师\n\n而在一诺老师的统计里面，讲师讲得太差而导致产品路演失败的情况占了 70% 以上。\n\n也就是说，10 场失败的产品路演里面，有 7\
    \ 场以上是因为讲师讲得不够好。\n\n从某种程度上来说，只要把这个主讲人训练好，我们就可以避免 70% 的失败可能性。\n\n如何才能成为一名好的成交讲师呢？\n\
    \n我们必须先搞明白成交的逻辑是什么。\n\n> 成功很简单，只要拥有成功的教练！\n> ——诺老师\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\
    \n### 第 02 课：成交的逻辑 1\n\n#### 从成交过程中学习成交\n\n在一诺老师的课堂里，讲述“成交的逻辑”这部分内容的时候，一诺老师会问大家，学习成交最好是研究谁？\n\
    \n有很多人都回答会说，要研究做得好的人。\n\n其实不是的，最需要的研究对象是——客户。所以一诺老师提出一个概念，叫做“从成交过程中学习成交”。\n\n\
    > 学习最好的课堂就是，不断试错的过程！\n> ——一诺老师\n\n成交过程是和谁成交的过程？是跟客户成交的过程。\n\n史玉柱先生说过：“营销是没有专家的，唯一的专家就是消费者，也就是说，只要打动消费者就可以了。”\n\
    \n所以，我们需要研究的对象就是消费者，因为买单的是他们。那么，我们要如何来梳理成交的逻辑呢？一诺老师通过以下五个问题来研讨，相信大家就会明白。\n\n###\
    \ 第 03 课：成交的逻辑 2\n\n#### 好的讲师必须具备什么特征\n\n好的讲师必须具备什么特征呢？\n\n一诺老师在课堂中，常常会问这个问题，大家会给一诺老师很多答案，例如：\n\
    \n- 台风、知识、气质、好看的衣着\n- 智慧、精神饱满、口才、手势、内容吸引人\n- 丰富的经验、自己先做到、反应要快、了解需求\n- 气场、亲和力、控场经验\n\
    \n在大家一番激烈的分享后，一诺老师说：“如果现在你是主办方，你要办一场会议营销，你的团队辛辛苦苦把客户邀请到现场并铺垫好了，有一个讲师符合上面你们说的所有条件，但讲完之后成交结果很糟糕，你下次还会不会请他？”\n\
    \n大家很整齐地回答：“不会！”\n\n一诺老师继续说：“假设有另外一位讲师，上面的条件他只符合一小部分，但是讲完之后成交的结果特别好，你下次会请他吗？”\n\
    \n大家异口同声地说：“会！”\n\n一诺老师再继续问：“那各位现在认为好的讲师必须具备什么特征？”\n\n后来听了一诺老师的答案，大家恍然大悟。\n\n\
    > 好的讲师能带来好的结果，\n> 好的路演大师会带来好的成交结果！\n> ——一诺老师\n\n记得在多年前，一诺老师在讲台上分享时说到：“什么是销讲讲师？重点在于销而不在于讲，通俗地说，销讲讲师就是个会讲课的业务员。”\n\
    \n是的，有很多销讲的讲师，就是太把自己当讲师了！\n\n把自己抬得太高，放不下身段去做销售的动作，迈不出销售的那一步，说不出销售的话，最后没有成交。\n\n\
    这是一件非常悲催的事情！\n\n曾经有一位亲传弟子，跟一诺老师倾诉自己的苦处：“有很多讲师课讲得很好，但成交就是不行。很会讲但不会卖。甚至有些请过来的讲师直接说他只管讲，卖的事情交回给主办方，这让人很痛苦。”\n\
    \n其实对企业来说真不缺把课讲得好的讲师。\n\n缺的是能够把产品卖得好的讲师。\n\n最开始这种角色叫做“会议营销讲师”，后来有些机构直接称呼其为“销售讲师”、“营销讲师”、“销讲讲师”，还有些机构把这个称呼浓缩为“销讲师”。\n\
    \n一诺老师觉得这些名字都不够贴切！\n\n因为会议营销、销讲、销售、营销都是过程，但我们更想要的是结果。结果是什么？标准答案——成交。\n\n> 一切不以成交为目的的路演都是耍流氓！\n\
    > ——一诺老师\n\n不管是哪一种路演，一位好的路演讲师是会带来好的成交结果的，所以一诺老师把这种角色命名为“成交讲师”。\n\n而成交讲师刚好是主办方需要的讲师。所以一诺老师经常说，一切不以成交为目的的销讲都是“耍流氓”。\n\
    \n好的讲师必须具备什么特征？\n\n**成交能力！**\n\n对于路演来说，成交大于一切。\n\n> 商业路演，成交大于一切！\n> ——诺老师\n\n\
    了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\n### 第 04 课：成交的逻辑 3\n\n#### 什么是成交\n\
    \n我是销售产品的，你购买了，就成交了；\n\n我是招商加盟的，你加盟了，就成交了；\n\n我是股权融资的，你投资了，就成交了。\n\n> 成交无处不在！\n\
    > ——一诺老师\n\n- 谈判，达成一致，签订协议，这是成交；\n- 宣讲，吸引人才，精英加入，这是成交；\n- 竞岗，突出优势，得到聘用，这是成交；\n\
    - 孩子想吃雪糕，通过表达，爸爸买了给他，这是成交；\n- 男孩喜欢女孩，通过追求，女孩嫁给了他，这是成交；\n- 妻子看上首饰，通过沟通，丈夫送给了她，这是成交。\n\
    \n成交是什么？\n\n一诺老师认为，根据你的目的，通过沟通影响他人，从而使他人产生行动，以达到你的目的，这就是成交。\n\n目的是成交的方向，影响是成交的过程，行动是成交的结果。\n\
    \n成交是一个双赢的过程，至少成交的那一刻，双方都是那么认为的。\n\n> **人行为的根本动机是：**\n> 追求快乐，逃离痛苦！\n> ——一诺老师\n\
    \n为什么要工作？\n\n不工作就赚不到钱，赚不到钱就没得吃、没得穿、没得住、没得用，就会很痛苦，所以工作是为了逃离痛苦。\n\n为什么要努力工作？\n\n\
    因为努力工作就会赚到更多的钱，有更多的钱就吃得好、穿得好、住得好、花得爽，就会很快乐。\n\n所以努力工作就是为了追求快乐。\n\n为什么要结婚？\n\n\
    因为两个人在一起相处很快乐，为了永久地拥有这份快乐，所以结婚。结婚是在追求快乐。\n\n为什么要离婚？\n\n因为两个人在一起相处很痛苦，为了永久地逃离这种痛苦，所以离婚。离婚是在逃离痛苦。\n\
    \n站在销售的角度来说，成交可以让客户感觉拥有了快乐，逃离了痛苦。\n\n成交的过程就是——不断让客户感觉到，他行动了、购买了就会拥有很多的快乐，如果不行动、不购买就会承受很多的痛苦！\n\
    \n> 要和客户达成成交，\n> 让客户感觉到购买的快乐与不购买的痛苦！\n> ——一诺老师\n\n是的，成交讲师要和客户达成成交，就必须让客户感觉到购买的快乐与不购买的痛苦。\n\
    \n### 第 05 课：成交的逻辑 4\n\n#### 客户为什么会买单\n\n我们回想一下，在我们买过的东西里面，我们做出购买动作的时候都符合哪些条件？\n\
    \n比较大的有房子、车子；比较小的有衣服、手机；天天买的有吃的、喝的；偶尔买的有家具、电器。\n\n那，符合什么条件我们才会买？\n\n> 客户购买行为的四个前提条件：\n\
    > 需求、信任、价格、保障！\n> ——一诺老师\n\n**(1) 需求**\n\n就是我需要这个东西我才会掏钱买。\n\n买衣服穿、买食物吃、买房子住、买车子代步，我买的都是我需要的。\n\
    \n拥有了这些我就快乐，拥有不了我就痛苦。\n\n所以“需求=快乐+痛苦”。\n\n相信很多人都听过“把梳子卖给和尚”的故事，里面最核心的部分，就在于发现了未被发现的需求，甚至说是创造需求。\n\
    \n**(2) 信任**\n\n当客户信任这个品牌、信任这家公司、信任卖东西的人的时候，客户才会买。\n\n这就是打造品牌的原因，人们不是愿意为品牌付出更高的价格，而是因为对这个品牌有更高的信任度，觉得它值。\n\
    \n之前的微商之所以火爆，就是因为微商的销售对象都是自己的朋友，对微商有足够的信任度，所以卖什么都比较容易。\n\n> 信赖感解决了，一切都不是问题！\n\
    > ——一诺老师\n\n一诺老师的一位亲传弟子，两年前在云南做原生态羊的众筹，规则是——消费者可以在羊羔期就进行认购，由养殖方养大后做成羊肉成品发货给消费者。\n\
    \n认购一只羊羔是 2000 元，众筹时间为 3 个月。\n\n众筹结束时，只被认购了一只羊羔，就是一诺老师买的。\n\n为什么呢？\n\n因为一诺老师认可这位亲传弟子的为人，觉得他做事肯定靠谱。为什么其他人不认购呢？\n\
    \n因为不认识，无法信任他，掏 2000 元就难多了。\n\n**(3) 价格**\n\n消费者可以接受的价格，不一定是高的也不一定是低的。\n\n很多人以为越便宜越好，其实错了。\n\
    \n价格高低跟客户的心理价位和消费能力有关系。\n\n如果客户对这个产品的心理价位很低，就很难卖出高价格。\n\n当然，如果客户的消费能力很低，也很难卖出高价格。\n\
    \n> 做销售要先找到有消费能力的人！\n> ——一诺老师\n\n**(4) 保障**\n\n对产品效果的保证。\n\n比如你要买一台空调，你会问销售人员多长的时间包退或包换，帮不帮安装、维修等，你想要的表面看起来是售后服务，\n"
