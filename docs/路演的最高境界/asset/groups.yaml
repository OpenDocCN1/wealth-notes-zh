    ## 第71课: 资本路演的原则1


    ### 清晰的企业战略规划


    进行资本路演的第一个要点就是——做好5年的规划。


    有的人会说，现在时代变化太快，计划赶不上变化。


    其实，这是一种没有长远眼光的表现。


    马云就说过：“阿里巴巴今年做的事情不是去年规划出来的，而是10年前我们就已经预测到今天的社会会变成这个样子，所以10年前就已经布局，可以说阿里巴巴今天的结果是由10年前就已经决定的。”


    > 记住一诺老师这句话，顿悟商业真谛！

    > 一个优秀的企业家必须有长远的战略眼光！

    > ——一诺老师


    当然，规划出来了也有可能根据实际情况进行调整，而我们要做的，就是让我们的眼光尽量准确。


    这里说的企业战略规划，就是把未来5年企业的各个板块的关键指标、目标，用数字化的形式表达出来。


