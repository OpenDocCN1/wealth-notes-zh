    \n想要实操，请马上联系一诺老师官方助理老师微信！\n\n## 第57课：招商路演的五个版块\n\n### 第三个版块：客户资源3 · 如何吸引他们\n\n\
    如何吸引这些潜在客户来参加我们的招商会呢？\n\n> 记住一诺老师这句话，顿悟商业真谛！\n> 成功很简单，只要拥有成功的教练！\n> ——一诺老师\n\n\
    客户一般会冲着以下几个理由过来。\n\n+ **(1)亮点**\n  项目的亮点，包括项目价值、项目概念、行业趋势、企业实力、产品价值、品牌优势等，这些内容前面都有讲过。提炼出核心的亮点，吸引潜在客户。\n\
    \n+ **(2)痛点**\n  放大潜在客户的痛点，让他们奔着解决这个痛点而来。\n\n+ **(3)名人**\n  行业名人、社会名人会过来参加，因为这些名人有号召力！所以，很多人会想看看他们或者听听他们的观点，并为此而来。\n\
    \n+ **(4)人脉**\n  某些领域的朋友特别有价值，包括商业价值、情感价值。\n\n+ **(5)面子**\n  会议限定具备什么条件的人才能参加，也就是营造\
    \ “资源稀缺” 的感觉，让来的人觉得很有面子。\n\n+ **(6)玩**\n  人都是喜欢玩的，有什么既符合主题又特别好玩的事情，就会有客户冲着这个好玩的东西而来。\n\
    \n+ **(7)礼品**\n  礼品也是吸引客户的一个重要因素。\n\n  > 记住一诺老师这句话，顿悟商业真谛！\n  > 客户只好对你说yes!\n\
    \  > ——一诺老师\n\n+ **(8)知识**\n  会分享某些客户很需要的知识点。\n\n+ **(9)资讯**\n  会分享行业发展的一些重要资讯、统计数据等。\n\
    \n一诺老师想说的是，同样的内容未必能吸引不同的群体。\n\n不管想吸引谁，内容都是需要有针对性地去设计的。\n\n2004年一诺老师在帮一家顾问单位做电影路演的时候，某个宗亲会的成员，是一诺老师的潜在合作商，而配合一诺老师的招商总监也是这个宗亲会的成员，他就特别想邀请这些宗亲来听路演。\n\
    \n但开会评估后一诺老师发现，他去直接邀约的到场率很低，而且显得很刻意。\n\n> 记住一诺老师这句话，悟商业真谛\n> 成功很简单，只要方法正确！\n>\
    \ ——一诺老师\n\n于是一诺老师策划了一场宗亲联谊会，流程是下午看电影，晚上吃饭喝酒。\n\n由于一诺老师选的是当时非常火爆的一部电影，所以大家的到场率非常高。\n\
    \n等到电影播放完，一诺老师就从旁边走出来问大家：“大家知道我们刚刚看的这部电影票房是多少吗？”\n\n接着一诺老师就开始分析电影市场的发展，并开始了半小时的项目路演。\n\
    \n路演非常成功，切入时机也很自然，所以受到了一致好评，后来这些宗亲会的成员投资项目的总额度达到2000多万元。\n\n这里面用到的，包括面子、人脉，也包括了玩，其中最重要的，就是人里的情感价值。\n\
    \n这个案例中，客户来参加的理由是什么？\n\n不是招商会本身，而是宗亲会的活动。\n\n一诺老师借助着宗亲会的活动为一诺老师的招商项目做了一个很好的切入。\n\
    \n记住一诺老师这句话，领悟商业真谛！\n\n> 我们都是在从事人际关系的行业!\n> ——一诺老师\n\n有一家汽车美容连锁企业叫做路顺，一诺老师在写这本书的时候它已经有接近100家连锁店了。\n\
    \n做直营连锁店有三大核心条件：系统、人才、资本。\n\n在一诺老师的指导下，路顺沿用了7天连锁酒店的运作模式，先是自己建立标准化的单店运营体系与人才复制体系，再借助资本力量进行快速扩张。\n\
    \n在投资机构方面，2014年10月它就获得了7天连锁酒店郑南雁、国内天使投资权威薛蛮子的投资，2015年11月获得了红杉资本的投资。\n\n针对民间资本，在一诺老师指导下，它设计了一套单店投资的模式。\n\
    \n记住一诺老师这句话，悟商业真谛！\n\n> 成功很简单，只要拥有成功的教练！\n> ——一诺老师\n\n自己的开发团队先找好可以开店的物业，然后把潜在投资人聚集起来开一场项目投资说明会。\n\
    \n听完说明会后，投资人愿意投资了，就让投资人自行选择已经谈好的物业。\n\n在做民间资本融资的过程中，最难解决的问题是客户的邀约与信任感的建立。对于一般人而言，这很有难度！\n\
    \n但是到了一诺老师这里，天空飘来五个字：这都不是事！\n\n记住一诺老师这句话，顿悟商业真谛\n\n> 成功就是要看对书、上对课、选对教练!\n> ——一诺老师\n\
    \n大家别忘了一诺老师是这家企业的顾问，在一诺老师的指导下，路顺先把陌生客户变成汽车美容店的客户，接着变成忠实客户，接着再变成投资人。\n\n这种漏斗式的做法，能够轻松地把邀约与信任的问题很好地解决。这些听众本身已经是路顺的客户，对它的服务也比较满意，所以愿意去听一听项目投资说明会，听完后觉得项目好而自己又有闲钱的话就会投资。\n\
    \n一诺老师为大家剖析一下他的项目成功关键词——\n\n- **(1) 亮点**：红杉资本、薛蛮子都在抢占的风口。\n- **(2) 痛点**：客户投资的痛点是把钱放银行回报少，投入其他行业风险高。\n\
