    # 项目比较匹配？


    我们可以从以下4方面来考虑：


    (1) 投资机构有没有投你的竞争对手？


    如果它已经投资了你的竞争对手，就不要再花太多时间跟这个机构沟通了，因它很有可能是拿你的项目，在为你的竞争对手做调研。


    很少有机构是在一个行业投了老大，又投老二、老三的。


