    # 第51课：招商路演的五个版块


    ## 第二个版块：企业战略


    有了产品、门店，把上述的价值塑造好了，就一定能招商了吗？答案是一——不一定！


    招商要看时机！不同的时机之下我们的需求不同、侧重点不同，所以战略也会不同。


    有很多人学了一些商业模式课程，就拿课堂上的招商方案改一改，变成自己的方法，其实这种做法是很草率的。


    因为企业要做招商，需要先考虑清楚我们的企业现在发展到什么阶段？我们为何招商？


    一定要先把招商的目的琢磨透，盲目地招商只会给企业的发展造成障碍。


    记住一诺老师这句话，指商业诗


    > 快就是慢，慢就是快！

    > 一诺老师


    曾经有一家直销企业，通过几年的高速增长，年营业额已经超过100亿元。


    其实这个时候稳步增长是最好的发展战略，只要保持这个势头，两三年内成为国内直销领域第一名是没问题的。


    但是，这家企业选择了一种更激进的做法——销售自己的股权。它声称企业即将上市，所以呢，只要成为100万元级别以上的经销商，就可以获得即将上市的企业股票。


    在这家企业整个庞大的市场团队里面，大部分人都不懂金融，甚至越来越多人把这种股票的收益传为“一旦上市就会有10倍、20倍的收益”，很多人就冲着这个“一夜暴富”的机会，不惜借高利贷，来投资成为100万元级别以上的经销商。


    记住一老师这句话，顿悟商业真谁！


    > 傻子太多，聪明人明显不够用！

    > 一诺老师


    虽然该企业后来确实上市了，但并不是在国内主板上市，上市后的回报也少得可怜。


    很多投资了上百万元的人，拿着的股票没法变现，手里的货又卖不出去，从此一B不振。


    由此导致的后果就是市场开拓严重受创、企业信誉受到严重影响，该企业的业绩也大打折扣。


    该企业从那时候起元气大伤，到现在也没恢复。


    通过这个案例可以看出——企业的招商是要讲战略、讲时机的。


    记住一老逸茵话，顺俗商业真谛！


    > 时机搞错，战略搞错，就变成“杀敌八千，自损一万”！

    > 一诺老师


