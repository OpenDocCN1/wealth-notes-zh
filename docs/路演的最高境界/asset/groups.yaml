    # 案例二：软银集团与阿里巴巴


    马云在经历了两次创业失败之后，依然不死心，和当下的创业者一样，执着地、勤劳地拿着项目资料和名片挨个拜访各家机构，去解释自己的创业想法，寻求资金支持。


    1999年10月，阿里巴巴刚过满月，还是一个名不见经传的小公司，没有人知道它日后会成长为千亿帝国，称霸国内互联网圈。而孙正义就是在这个时候走进马云的世界的。


    当时马云只用了6分钟来做路演，路演完后，孙正看好马云，就把已经决定的另外一项投资停下来了。虽然孙正义不是马云的第一个贵人，但绝对是成就阿里巴巴的关键人物之一。他不仅投资阿里巴巴，还帮阿里巴巴对接很多资源。


