    # 第53课：招商路演的五个版块


    ## 第二个版块：企业战略2·分析自己当下需求


    做企业最需要做的事情就是——“模仿”！


    模仿就是学习别人先进有效的做法。


    但做企业最可怕的事情也是“模仿”，很多人看到别人用那种方法招商，自己就跟着复制。


    > 记住一诺老师这句话，顿悟商业泰！

    > 不要盲目地复制和模仿，要知道，适合别人的不一定适合你！

    > 一诺老师


    所以是否要招商，用什么方法招商，还得看自己当下的具体需求和状况。一诺老师前面说了，招商会为企业带来很多好处，同时，也能满足企业当下的一些需求，包括：


    - (1)带来现金流

    企业处于投入阶段，现金流不足的时候，招商可以帮助企业收到现金，解决现金流短缺的问题。

    - (2)提高营业额

    招商能够带来企业营业额的倍增。

    - (3)利润与利润率增长

    营业额增长了，利润就会相应增长，只要控制好成本，就能带来利润率的增长。

    - (4)提高市场占有率

    代理商的销售，会让产品铺开的更广；有更多加盟商的加盟，就有更高的市场占有率。

    - (5)让市场产生裂变

    好的招商方案可以让市场自动裂变，说通俗点就是代理商会转介绍其他代理商，加盟商会转介绍其他加盟商。

    - (6)增加客户数量

    最典型的就是互联网企业，对这类企业来说，活跃的用户数量是非常重要的。好的招商可以让客户数量倍增。

    - (7)提高企业产能

    市场的销量大了，企业产能就会提高，从而形成规模效应，相对应的边际成本就会降低。

    - (8)形成品牌效应

    对连锁店来说，在一个区域里开店的数量多，就会在客户心中形成品牌形象，从而带来品牌效应。

    对于制造业来说，到处都有自己的产品在销售，也会在消费者心中形成品牌效应。


    这8个方面其实都是企业需要的，但我们要分析清楚，目前最迫切需要的是哪些，哪些是一打开局面就会产生的。


    > 记住一迭老师自话，商亚真！

    > 了解自己当下的需求，是招商致胜的关键！

    > 一诺老师


    就像一诺老师前面讲的直销企业的失败案例，它当下最迫切的需求已经不是钱了，就没有必要用这种方式来刺激市场。


    有一次，一诺老师去浙江义乌，给某控股集团的顾问培训招商团队后，一诺老师受弟子之邀，去参观他的红酒企业。义乌被称为微商之都，这家企业也是用微商的方式在做。


    弟子当时跟一诺老师聊到一个想法，就是在各地开西餐厅，让销售自己红酒的微商，可以带朋友到西餐厅品尝红酒。


    弟子的观点是，微商是在线上做的，没有落地的实体，如果开了这些西餐厅，就能够“空军、陆军(线上、线下)相结合”，西餐厅做西餐赚钱，微商销售员卖红酒也赚钱。


    听着是相当不错的一个设想。


    一诺老师当时就提出了自己的顾虑：如果开西餐厅是纯投入，作为对微商人员销售红酒的辅助，那是没有问题的，这样就要做好西餐厅不赚钱甚至亏钱的打算。


