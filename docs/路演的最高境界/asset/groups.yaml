    # 第105课：资本路演套路5


    ## 天使投资人选项目的标准


    ### （1）熟悉的领域


    对于熟悉的领域，投资人会更了解里面的需求、运作方式、成功的关键点，所以投资自己熟悉的领域会更有安全感。


    ### （2）未来趋势


    符合未来趋势的项目，当然是天使投资人最感兴趣的。这些项目可能还没成型，有比较大胆的想法。


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 要让投资人看到未来无限的可能性！

    >

    > ——一诺老师


    ### （3）分摊风险


    天使投资人投的项目比较多，而且一般额度不会特别大，这样可以分散他们的投资风险。


    ### （4）创业者本身


    天使投资人最看重的往往是创业者本身是否具备成功者的特质。


    ### （5）带有个人风格


    国内著名的天使投资人都比较有个性，他们的投资行为也带着自己的风格，像薛蛮子、徐小平等就是典型例子。


    > 记住一老师这句话，悟商业真谛！

    >

    > 企业家要有性格，

    > 性格来自于企业的精神领袖！

    >

    > ——一诺老师


    了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。


    # 第106课：资本路演套路6


    ## 风险投资机构 (VC) 选项目的标准


    ### （1）务实


    对于创业这件事来说，务实无疑是最重要的事情。


    很多创业型公司一开始就过分地讲究各种排场，证明了它们的注意力没有放在做事业上，而是放在炫耀事业上。


    ### （2）激情


    创业会遇到很多的困难，所以需要整个创业队伍有源源不断的激情与能量去解决问题。


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 没有激情，创业必败！

    >

    > ——一诺老师


    ### （3）执行力


    执行力可以说是创业成功的第一要素。


    马云就曾经说过：“我宁愿要三流的项目，一流的执行力，也不要一流的项目，三流的执行力。”


    ### （4）团队背景


    内部团队的背景，还有外部团队的背景，当然也包括外部投资机构。


    这就是为什么，有一些著名机构投资的项目会形成“领投效应”，其他机构会愿意跟投。


    ### （5）数据增长


    数据是最实在的、无法忽悠的指标。创业团队的刻意表现可以骗得了人，但数据骗不了人。


    > 记住一诺老师这句话，顿悟商业真谛！

    >

    > 快速增长的企业，更容易获得下一轮的融资，

    > 因为，这是风险投资机构最想要看到的结果！

    >

    > ——一诺老师


    了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。


    # 第107课：资本路演套路7


    ## 私募股权投资机构(PE)选项目的标准


    ### （1）国家政策扶持


    私募股权投资机构看的层面通常更高，它们投资进来就是为了企业的IPO，那些有国家政策扶持的企业与行业，IPO成功的可能性自然会更大。


    ### （2）有独特优势


    有核心技术优势，有独特的难以复制的商业模式，已经成为行业的领军企业，或者在传统行业基础上的产业升级等。


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 差异化是企业致胜的基础！

    >

    > ——一诺老师


    ### （3）利润与高成长性


    走到这个阶段的企业，利润的重要性就显示出来了。


    因为利润对上市的股价，会产生比较大的影响（不是绝对，京东就是例外）。


    其实，好的项目是自己选择投资人，能够选到用各方面的资源来帮助项目成长的投资机构就是最好的了。


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 成功是一种选择！

    >

    > ——一诺老师


    ## 案例一：今日资本与京东


    徐新第一次见到刘强东的时候，就很看好京东，如她所说：


    “京东销售收入5000万，一分钱广告不打，每个月比上个月增长10%，这说明生意模式对了。”


    那是在2006年10月，京东在持续亏损中严重缺钱，刘强东不得不硬着头皮开始寻求融资，他当时只想要200万美元，但是徐新担心这点钱不够，果断给了1000万美元。


    这1000万美元将京东从困局之中成功解救。


    钱到账之后，刘强东立刻开始扩充产品线，商品品类大幅增加，逐渐确立起在2C领域的地位，京东强大的物流体系也是在这个时候开始建立的。


    徐新选择投资京东，从一开始就做了长期规划。


    她对刘强东承诺，只要前四年公司每年的营业收入都能增长100%以上，就拿出18%的股份作为员工期权。


    这个承诺不仅让京东飞速发展，也为京东招聘人才、完善管理层打下了良好的基础。


    2008年，京东遭遇了另一个困境——年初的大雪压坏了京东上海的仓库，上轮的融资快要花光了，物流处于持续亏损状态，市场上不看好京东的投资者越来越多，京东的估值断崖式下降。有人说刘强东“一夜白头”。


    此时，徐新依然没有放弃京东，今日资本不仅多次借给京东过桥贷款，徐新本人也积极地帮刘强东寻找新投资人。


    终于，在今日资本的年会上，徐新将来自香港的百富勤投资创始人兼香港超级富豪梁伯韬引荐给了刘强东。


    > 记住一诺老师这句话，顿悟商业真相！

    >

    > 我们都是从事人际关系的行业！

    >

    > ——一诺老师


    梁伯韬以美国的零售业作为参考，研究了京东的模式，他很认同刘强东自建物流的做法。最终，刘强东喜获2100万美元。

