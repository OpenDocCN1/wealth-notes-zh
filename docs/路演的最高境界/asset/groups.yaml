    \n## 第40课：招商路演的特点\n\n通过演讲批发式地卖商机\n\n我们都听说过这句话：“酒香不怕巷子深。”但酒香真的不怕巷子深吗？—诺老师的答案是——不一定！\n\
    \n在1912年的巴拿马世界博览会上，茅台酒是中国展团的成员之一。由于包装不华丽，只是用普通的陶瓷罐装着，所以茅台酒没能从视觉上引起世界各国的商家及博览会评委的注意。到了第三天，茅台酒依然无人问津。\n\
    \n记住一诺老师这句话，顿悟商业真谛！\n> 成功很简单，只要方法正确！\n—诺老师\n\n茅台酒的代表非常焦虑，因为照此下去，茅台酒在博览会的白酒评估排名肯定上不去，这么好的酒不为人知确实是一件很可惜的事情。正在他着急之际，忽然一道灵光闪过，于是他装作不小心把一瓶茅台酒摔落在了地上，酒水洒了一地。顿时，茅台酒展区附近都弥漫着茅台酒特有的香味，很多人闻香而来了解、咨询。这也令茅台酒引起了博览会酒类评委的注意。最后，世博会落幕之时，茅台酒被评为了“全世界最好的白酒”。\n\
    \n看完这个真实的故事，你是否还会觉得“酒香不怕巷子深”?要是茅台酒没有去参加世博会，要是茅台酒罐没有被摔碎，整个世界就要晚很多年才能认识到茅台酒了。所以，“酒香”还是怕“巷子深”的，好的产品、好的项目就需要被更多的人知道，招募更多的商家来合作，共同把生意做大。\n\
