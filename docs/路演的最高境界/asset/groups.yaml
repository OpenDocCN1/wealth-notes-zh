    \n## 第55课：招商路演的五个版块\n\n### 第三个版块：客户资源1·找四种人合作\n\n要知道“他们”在哪，先要知道“他们”是谁。\n\n好的项目，不会乱招商!好的项目清楚地知道自己需要什么样的合作伙伴，所以其招商肯定是定向的，是针对特定人群的。\n\
