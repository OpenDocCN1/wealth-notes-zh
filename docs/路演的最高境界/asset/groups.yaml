    ## 第69课：资本路演的对象1


    ### 我们要面对谁来路演


    一诺老师在本书所探讨的资本路演的对象，主要分为个人投资者和机构投资者。


    个人投资者包括家人、朋友、同学、同事等，他们的投资决策更多取决于对你的信任与支持。


    而机构投资者又可以分为天使投资、风险投资(俗称VC)、私募股权投资(俗称PE)，他们的投资决策则更多取决于对创业项目的一系列理性的分析判断。


    其实天使投资某种意义上也属于风险投资，相比起风险投资，它介入更早，风险更大，回报也有可能更高。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 人无横财不富，马无夜草不肥！

    > ——一诺老师


    一些具有大量人脉的前企业高管，尤其是互联网行业的前企业高管最早成为天使投资人，代表人物有李开复、徐小平、雷军。


    因为对企业运作及资本行业十分了解，因此这些天使投资人也趋向于用机构的方式规范投资行为。


    想要拿钱, 就必须知道你的客户是谁。如果你的客户就是这些股权投资机构, 你就要去了解他们的关键信息。


    比如: 投资机构一年会看多少个创业项目? 它们每年会投资多少个项目? 顶级投资机构正常的话一年会收到2万到4万个项目。一般的投资机构见过面的项目和最后投资的项目,
    两者之比是100: 1, 甚至更高。


    > 记住一诺老师这句话, 顿悟商业真谛！

    > 不能出类拔萃, 就没有出头之日!

    > ——一诺老师


    也就是100 个项目中, 真正投的可能不到1个。像红杉资本、IDG、深创投、九鼎这些, 平均每年的投资项目是60~80个。中国的股权投资机构有15000多家,
    哪些投资机构跟你的项目比较匹配？


    我们可以从以下4方面来考虑：


    - (1) 投资机构有没有投你的竞争对手？

    如果它已经投资了你的竞争对手，就不要再花太多时间跟这个机构沟通了，因它很有可能是拿你的项目，在为你的竞争对手做调研。很少有机构是在一个行业投了老大，又投老二、老三的。


    > “记住一诺老师这句话，顿悟商业真谛！”

    > 融资过程中，要保护好自的商业秘密！

    > ——一诺老师


    - (2) 投资机构的行业相关性如何？

    大多数投资机构都有自己侧重投资的领域。如果你是做生物科技的，去找一个只投互联网的机构，结果可想而知。


    - (3) 投资机构的定位是什么？

    初创期的项目，要找的是天使投资机构；成长期的项目，找的是VC，也就是俗称的A、B、C轮；成熟期的项目，找的是PE投资机构。


    - (4) 投资机构有什么资源支持？

    一诺老师前面也讲过，我们不仅仅是要投资机构的资金，还要它的资源。获得投资机构的资源支持，是有可能提高我们的销售、降低我们的成本、加快我们的速度的。


    > 记住一诺老师这句话，顿悟商业真谛！

    > 融资就是——融钱、融资源、融人才！

    > ——一诺老师


    前海梧桐并购基金成立于2014年3月，被誉为投资行业的一匹黑马：


    - 投资“昆仑决”，3个月翻了1倍；

    - 投资“鲜丰水果”，4个月翻了1.33倍；

    - 投资“敏众数据”，1年零3个月翻了2.71倍；

    - 投资“欣欣旅游”，1年翻了4倍。


    为什么能取得这么好的结果? 因为该基金称自己是“一个有思想的资本”，有自己的一套独特的运作方式。


    首先，在做投资的时候，该基金在一个细分领域只挑一个领军企业进行投资。除了上述说到的项目以外，还包括：


    - 中国移动音频行业第一名——喜马拉雅；

    - 中国共享办公领域第一名——优客工场：

