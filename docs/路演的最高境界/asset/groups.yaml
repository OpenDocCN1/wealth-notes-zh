    # 第110课：投资人套路3


    # 我们内部讨论没有通过


    VC要看大量的项目，但通常只会投很少的项目，比例可能为小于100：1，所以要拒绝99%的项目，对于VC来说，就是让99%的创业者不高兴了。


    按说一天到晚拒绝创业者，那VC的口碑和人品应该遭到很多创业者的唾弃才对，但通常很少有VC会让创业者因此而憎恨自己，那他们是怎么做的呢？


    很简单----推卸责任。


    记一老师句话，顿悟商业真谛！


    > 借口是给双方一个台阶下！

    > —一诺老师


    即便是某个VC自己觉得某个项目不好，他拒绝的时候，也会跟创业者说：“我很喜欢你们公司和你们的团队，但是我们内部讨论没通过。”


    这样拒绝，会让创业者觉得他人不错，认可你的公司，但VC公司的“其他人”不认可，所以不要怪他。


    当然还有其他理由。总之，VC会让创业者觉得，不是某个人让你受委屈，而是背后公司的项目决策机制的原因，要怪就怪公司吧。


    因此，常常会听到很多创业者骂VC公司，但骂具体某个VC合伙人、投资经理的却不多。


    真正挨骂的VC可能是两种人：一种是VC圈最善良的人，他们愿意告诉你VC拒绝的真实理由，并给你提出一堆建议；另一种是确实啥也不懂的一帮VC混混。


    跟这个忽悠用语类似的还包括：“这个项目太早期了。”、“我很喜欢你们公司，但合伙人投票3：2没通过。”、“你的融资额度太低了，我们不投1000万美元以下的项目。”


    通常情况下，这些话的潜台词是：“这是个烂项目，我老早就Pass（否定）了！”


    记住一诺老师这句话，顿悟商业真谛！


    > 不要怪风投拒绝你，要怪模式不够吸引人！

    > —一诺老师


    # 第111课：投资人套路4


    # 如果有人领投，我们跟


    众所周知，VC都是非常贪婪的，他们整天都梦想着能够投资下一个Google，获得几百、上千倍的投资回报。


    可现实是，真正获得超过10倍回报的项目都可以被VC称为“明星”案例了。


    既然VC是贪婪的，那么遇到好项目的时候，只有独享才能保证利益最大。


    VC说愿意跟投就如同是婉转拒绝，这种忽悠话，比“保持联系”更加赤裸和讨厌。


    > 记住一老师这句话，顿悟商业真谛！

    >

    > 风投拒绝的背后，是自己的模式不够强大！

    > —一诺老师


    VC还有一个特性，就是在投资前，尽量做足工作，避免出现投资风险对拟投资项目做尽职调查，这是VC避免投资风险的一个惯用手段。


    但有很多懒惰的、水平和眼光很差的VC也有自己的方法，那就是跟着大牌VC走，或者随大流。那些红杉资本、鼎晖投资、IDG、赛富投资等大牌VC都看好的项目，他们一定哭着喊着要跟投，但是就怕人家不会带他玩。


    所以，如果有VC跟你说：“我们还需要讨论一下，但是如果你能够让红杉资本领投，我们愿意跟投你……”


    如果是这样，你就直接跟他拜拜，头也不要回。


    住一诺老师这句话，顿悟商业真谛!


    > 我们的时间很宝贵，只浪费在认可的人身上！

