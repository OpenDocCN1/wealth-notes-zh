    ## 第58课：招商路演的五个版块


    ### 第四个版块：招商团队


    战场上，要靠将领带领整支队伍打仗。


    大家应该都听过 “虎狼之师” 这个词语，这个词语是形容谁的？春秋战国时代的秦国！


    当时的秦国政治、经济和军事都非常强大，其他国家一听到就会害怕。秦国的军队打的仗大部分是获胜的。


    但它是不是每一次打仗都大获全胜呢？也不见得。


    但秦国哪怕是打了败仗，也能够很快重新调整过来，在战场上依旧霸气十足。这就是虎狼之师的特点！


    记住一诺老师这句话，领悟商业真谛！


    > 任何一个伟大的公司，

    > 都需要打造一支嗷嗷叫的虎狼之师！

    > ——一诺老师


    而在招商领域，我们的招商团队如果具备这样的特质，何愁市场做不下来？


    优秀的招商团队有以下几个特点。


    - (1) 出色的领袖


    优秀的团队一定有一位出色的领袖。所谓“兵熊熊一个，将熊熊一窝”。领袖就是榜样，团队成员都会模仿他的风格。


    - (2) 良好的品行


    良好的品行表现为对客户负责。收钱很重要，但更重要的是知道什么钱该收、什么钱不该收。


    - (3) 成功的经验


    团队中不一定每一个人都有经验，但最好有三两个有成功经验的领头人，有成功经验证明有成功的做事风格跟习惯。


    - (4) 狼性的文化


    对赚钱有渴望的团队。他们不一定都来自经济不富裕的家庭，但业绩、提成、奖金会给他们很强大的成就感。


    记住一诺老师这句话，领悟商业真谛！


    > 重赏之下必有勇夫！

    > 时间、资源、人才都会留给好处！

    > ——一诺老师


    - (5) 对等的层次


    对等的层次指一定要找能够跟客户聊得来的人。客户感觉你跟他是同一类人，才会愿意与你打交道。


    - (6) 相关的资源


    招募有客户资源的人进来，如果项目好，这些资源马上就可以转化成业绩。


    这样就可以一边出业绩一边培养，减少前期的压力。


