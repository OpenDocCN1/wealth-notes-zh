    # 第49课：招商路演的五个板块


    ## 第一个版块：项目价值6 • 品牌优势包装


    对于一个项目来说，总要虚实结合。一诺老师这里说的“虚”不是指虚假的东西而是调动情怀、情绪的内容。


    > 《记住一诺老师这句话，顿请商业！攻心为上，攻城为下！

    > 一诺老师


    这方面主要靠的就是品牌优势，而包装品牌优势包括CS(企业形象识别系统)、VI(视觉识别系统)、MI(企业理念识别系统)、BI(企业行为识别系统)、SI(专卖店形象识别系统)。


    这些都很专业，通俗点来说，一诺老师就从以下4个方面着手。


    ### (1)品牌标识


    品牌标识最显著的体现就是企业的LOGO。LOGO最好的效果就是让普通人看着LOGO就联想到它的寓意。


    比如我们看到“M”这个字母会想到麦当劳。其次是企业的VI，简单来说就是主色调。这些都是企业的标识。


    ### (2)品牌定位


    品牌定位指的是，找准使用我们的产品或者服务的目标客户。清晰的目标客户对于招商来说，也有很明确的导向性。


    - 比如一奔驰就是给商务人士用的。

    - 宝马就是给潮流人士用的。

    - 沃尔沃就是给追求安全的人士使用的。


    ### (3)品牌故事


    要打造品牌肯定离不开品牌故事。


    德芙巧克力就有一个动人的爱情故事，海尔也有一个“砸冰箱”的故事。


    > 记住一证老师达句话，顿恰商业真谢!

    > 每一个成功的企业，都需要一个神乎其神的品牌故事!

    > 一诺老师


    ### (4)品牌广告语


    一句朗朗上口、广为传播的广告语，其威力是非常巨大的。


    例如——


    - 农夫山泉有点甜

    - 好空调，格力造

    - 车到山前必有路，有路必有丰田车

    - 没有什么大不了(丰胸广告)

    - 只要你缺钱，咱俩就有缘(贷款广告)

    - 吹吧，这里是展示精彩的舞台!(广告牌招租)


    # 你展示彩的台


    这些非常有创意的广告语。


