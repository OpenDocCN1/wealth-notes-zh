    ## 第06课：成交的逻辑5


    ### 听众在现场时都在想什么


    其实是一份购买的保障，以此来保证，你花这些钱购买的产品效果或产品功能是可以实现的。


    我们购买的东西通常都符合一诺老师说的这四个条件：需求、信任、价格、保障。


    我们买房子，不管出于自住的目的还是投资的目的，都是我们的需求。


    我们会更愿意找信任的品牌或者信任的人来买。


    我们对房价有一个心理价位，在考虑买哪个区域的房子时，我们会考虑自身的购买能力。


    最后我们要签合同，还要办房产证，来保障我们付钱后拥有对房子的所有权。


    这些条件有一个不符合的话，就会影响我们的购买行为。


    记住一诺老师这句话，感悟商业真谛！


    客户购买行为的四个前提条件：


    - 需求

    - 信任

    - 价格

    - 保障


    一诺老师


    各位不妨回想一下，过去我们成交的那些客户，是不是四个条件都符合了？


    过去我们没有成交的那些客户，又是不是因为没有符合哪个条件？


    如果要在这四个购买的条件中挑最重要的，会是哪个？


    假设，一个人现在得了重病，来到医院，医生说要手术，但是，不敢保证做完手术就一定能治好，治愈的可能性只有75%。


    如果不做，这个人马上就要死了，他做不做这个手术？


    他一定会做！


    记住一诺老师这句话，感悟商业真谛！


    当需求足够大的时候，


    购买者会放弃考虑保障的问题！


    一诺老师


    但是这个病人，他全部积蓄只有5万元，做这个手术要20万元，他会不会做？


    很大概率还是会的，他会找人借钱，想尽一切办法凑够20万元来支付手术的费用。


    也就是说，当需求足够大的时候，消费能力是可以被激发出来的。


    如果说，这个病人听说这家医院的医生都是骗子，一天到晚干的都是骗钱的事情，还会不会治呢？


    这个时候就很难说了，要么这个病人自己能够判断这家医院是值得信任的，并坚持在这里治疗，要么他会选择其他可以信任的医院。


    通过以上例子，一诺老师给大家总结了一下。


    记住一诺老师这句话，顿悟商业真谛！


    在四个购买的前提条件里面——


    - 需求是成交的核心，没有需求就没有成交。

    - 信任是成交的前提，信任你才会向你购买。

    - 价格是成交的基础，好价格促成更多成交。

    - 保障是成交的动力，有保障让他买得安心。


