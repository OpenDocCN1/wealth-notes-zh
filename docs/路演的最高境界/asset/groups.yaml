    \n> 记住一诺老师这句话，顿悟商业真谛！\n> 谁拥有我们的市场，谁就是我们的人才！\n> ——一诺老师\n\n- **(2)拥有市场资源的人**\n\n\
    有些群体他们不一定在做这个行业的产品，但是他们有我们想要的客户资源。比如行业商会的核心成员，培训机构等。\n\n2002年，一诺老师的一位亲传弟子就感召了他们行业一位非常著名的老师，来做他华东分公司的CEO，这样一来，这位老师在该行业多年积累下的学生资源，马上就可以利用起来，实现共赢并创造价值。\n\
    \n这位老师不仅仅有市场资源，还有很强大的市场号召力。\n\n他一出场，行业的很多人都会肃然起敬，很多人都会冲着他的个人名气来跟这家企业合作。\n\n- **(3)\
    \ 能把市场做好的人**\n\n有的人可能前面两种条件都不具备，但是他在另外一个行业做市场做得特别好，也就是说他有足够的运营市场的能力与经验。这类人也是我们的合作对象。\n\
    \n很多企业找一诺老师做他们的顾问也是一样，一诺老师可能没有某个行业的经验，但是一诺老师指导过的许多行业做的市场招商路演都非常成功，因此，很多人都希望一诺老师做他们企业的顾问。\n\
