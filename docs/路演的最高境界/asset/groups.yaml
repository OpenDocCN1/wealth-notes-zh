    \n这也是为什么创业者也需要有自己的律师的原因。\n\n> 记住一诺老师这句话，品味商业真意\n>\n> 律师就是拿人钱财替人消灾，替不替你消灾关键是，有没有拿你钱财！\n\
    >\n> ——一诺老师\n\n其实，Term Sheet中大部分的条款都是可以协商的。有律师帮忙解释和沟通会让你更有针对性，另外，如果你手上能够拿到好几家VC的Term\
