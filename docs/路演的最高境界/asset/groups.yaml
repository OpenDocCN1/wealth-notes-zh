    \n想要实操，请马上联系一诺老师官方助理老师微信！\n\n## 第79课：资本路演的套路4\n\n### 商业模式3 • 当下风口\n\n当下的“风口”，既然说到赚钱，那肯定会有难易之分。投资人对赚钱的难易程度的判断，形成了他们的投资倾向。\n\
    \n而整个社会发展的未来走向，必定会产生一些比较被看好的趋势。我们要拿到钱，就要知道“风口”是什么。\n\n站在风口上，要想拿到投资人的钱就容易得多。\n\n\
    记住一诺老师这句话，悟商业真谛！\n\n> 趋势就是我们俗称的风口！\n> —— 一诺老师\n\n在《招商路演大师》中，一诺老师讲到项目在概念包装的时候，就讲到当下的风口。今天在这里呢，一诺老师再把这个风口给大家讲得更细一些。\n\
    \n- **(1) 互联网**\n  过去20年是互联网飞速发展的时代，它的普及为我们的生活带来了太多太多的便利。许多互联网巨头应时而生。早期的搜狐、新浪、网易，中期的阿里巴巴、腾讯、百度，近期的京东、滴滴、摩拜，这些企业创造了一个又一个的互联网神话。\n\
    \  未来10年内，互联网领域肯定还是商业开拓的主阵地。\n\n- **(2) 高科技**\n  也叫做高新技术。一般认为，高科技是一种人才密集、知识密集、技术密集、资金密集、风险密集、信息密集、产业密集、竞争性和渗透性强、对人类社会的发展和进步具有重大影响的前沿科学技术。\n\
    \  这个领域包括核燃料加工、信息化学品制造、航空航天器制造、电子及通信设备制造业、电子计算机及办公设备制造业、医疗设备及仪器仪表制造业等。\n\n  记住一诺老师这句话，悟商业真谛！\n\
    \  > 科技是企业市值裂变永恒的良药!\n  > —— 一诺老师\n\n- **(3) 人工智能**\n  人工智能，英文缩写为AI。它是研究、开发用于模拟、延伸和扩展人的智能的理论、方法、技术及应用系统的一门新的技术科学。目前应用得比较多的就是机器人、无人驾驶系统，其实搜索引擎也是人工智能应用的一种。\n\
    \n- **(4) 节能环保**\n  节能环保产业是指为节约能源资源、发展循环经济、保护环境提供技术基础和装备保障的产业，主要包括节能产业、资源循环利用产业和环保装备产业，涉及节能环保技术与装备、节能产品和服务等。\n\
    \n- **(5) 新一代信息技术**\n  新一代信息技术分为六个方面，分别是下一代通信网络、物联网、三网融合、新型平板显示、高性能集成电路和以云计算为代表的高端软件。\n\
    \n  记住一诺老师这句话，扬悟商业真谛！\n  > 企业的迭代能力，\n  > 构筑未来商业的内在力量！\n  > —— 一诺老师\n\n- **(6)\
    \ 生物医学**\n  生物医学工程是综合应用生命科学与工程科学的原理和方法，从工程学角度在分子、细胞、组织、器官乃至整个人体系统多层次认识人体的结构、功能和其他生命现象，研究用于防病、治病、人体功能辅助及卫生保健的人工材料、制品、装置和系统技术。\n\
    \n- **(7) 高端装备制造**\n  高端装备制造产业指装备制造业的高端领域，包括：关键基础零部件和基础制造装备、重大智能制造装备、船舶及海洋工程装备、轨道交通装备、民用飞机、民用航天、节能环保装备、能源装备等。\n\
    \n  记住一诺老师这句话，顿悟商业真谛！\n  > 企业走高端，才能高大上！\n  > —— 一诺老师\n\n- **(8) 新能源**\n  又称非常规能源。是指传统能源之外的各种能源形式，即刚开始开发利用或正在积极研究、有待推广的能源，如太阳能、地热能、风能、海洋能、生物质能和核聚变能等。\n\
    \n- **(9) 新材料**\n  新材料是指新近发展的或正在研发的、性能超群的一些材料，这些材料具有比传统材料更为优异的性能，包括：特种金属功能材料、高端金属结构材料、先进高分子材料、新型无机非金属材料、高性能复合材料、前沿新材料等。\n\
    \n  记住一诺老师这句话，悟商业真谛！\n  > 只要是新的，就给资本无限的想象空间！\n  > —— 一诺老师\n\n- **(10) 新能源汽车**\n\
    \  新能源汽车是指采用非常规的车用燃料作为动力来源 (或使用常规的车用燃料但采用新型车载动力装置)，综合车辆的动力控制和驱动方面的先进技术，形成的技术原理先进，具有新技术、新结构的汽车。\n\
    \  新能源汽车包括纯电动汽车、增程式电动汽车、混合动力汽车、燃料电池电动汽车、氢发动机汽车、其他新能源汽车等。\n\n- **(11) 新消费**\n \
    \ 新消费包含两方面内容：新的消费方式、新的消费领域。\n  随着生活水平的提高与“80后”、“90后”进入主流消费市场，他们更倾向于个性化消费、时尚消费、品质消费，更倾向于电子商务与跨境电商，这就是我们说的新消费方式。\n\
    \  2015年底国务院出台相关意见，明确服务消费、信息消费、绿色消费、时尚消费、农村消费和品质消费六大领域作为消费升级的重点领域和方向，这就是我们说的新消费领域。\n\
    \n- **(12) 教育(幼儿)**\n  为什么教育，尤其是幼儿教育也是风口？\n  除了跟全世界的育儿观在成长有关以外，还跟我国的生育政策放开“二胎”有很大关系。这一领域包括：婴幼儿教育、学前教育、课外辅导、综合技能提升等。\n\
    \n  记住一诺老师这句话，领悟商业真谛！\n  > 教育是永远的趋势！\n  > —— 一诺老师\n\n- **(13) 实体+互联网**\n  共享单车的诞生，就是“实体+互联网”的模式；共享充电器、共享雨伞、共享办公室、共享汽车、共享别墅等，只要加上互联网，就能拿到投资人的钱。\n\
    \n- **(14) 教育+互联网**\n  大家都知道，教育是永远的趋势，现在随着互联网技术的不断革新，很多线下课程和培训已经搬到互联网上了，就好像是一诺老师，之前做了18年的线下传统教育，粉丝不过100万，但是自从做了互联网演讲，粉丝在3个月突破500万，半年突破1000万，1年拥有3000万粉丝！\n\
    \  现在一诺老师已经把毕生课程陆续地录制成音频课程，大家无论是山南海北，还是世界各地，都可以24小时无休地通过**【改变世界APP】**学习一诺老师的所有智慧。\n\
    \n  记住一诺老师这句话，商业真谛！\n  > 一诺老师的使命是：帮助更多人实现梦想！\n  > —— 一诺老师\n\n- **(15) 在家创业模式**\n\
    \  各位，知道什么叫作家吗?不仅是以创作为家，而且大多数的作家都是在家里完成自己的作品。\n  就像一诺老师一样，在家里就可以写书、写课、录课，可以不用上班打卡，每天睡到自然醒。\n\
    \  相比很多企业家，以企业为家，一年到头很少见到自己的妻儿老小，亲戚朋友，失去了人生的天伦之乐！\n  后来很多人都羡慕一诺老师的生活方式，并认同一诺老师的生活方式——\n\
    \  - 什么是作家?在家写作!\n  - 什么是演说家?在家演讲!\n  - 什么是企业家?陪伴家人不耽误赚钱!\n  所以现在，很多的亲传弟子，申请到深圳跟着一诺老师来学习这一切，回去后，住在别墅里就可以月入几万、几十万、几百万……既不少赚钱，又不影响自己孝顺父母和陪伴家人。\n\
    \n  记住一诺老师这句话，悟商业真谛!\n  - 在家创业模式:\n  - 让人生多一些自由，少一些遗憾!\n  > —— 一诺老师\n\n这15个领域，是当下投资机构最看好的领域，也就是说，如果你的项目是属于这15个领域的，投资机构投资你的可能性相对来说就会大很多。\n\
    \n2012-2014年，O2O的项目非常流行，那时，O2O的项目只要有些数据，就很有机会拿到机构的投资。\n\n但现在不同了，风口已过，投资机构对这类项目的兴趣已经大不如前，考察这类项目的指标也会严格很多。\n\
    \n到了2017年，大部分机构看互联网的项目都要求它自身本身一定要有赢利能力，才会考虑投资。\n\n所以，我们要明白一件事情：风口是会随着时代改变的。我们要做的，是跟上时代的步伐。\n\
    \n记住一诺老师这句话，领悟商业真谛！\n\n> 世界上唯一不变的就是变化！\n> —— 一诺老师\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】.\n\
    \n**卖产品，卖商机，卖股权。《路演的最高境界》：收钱，收人，收心，收灵魂。**\n\n用300元最低融资500万，签订《零风险+对赌》协议！\n\n零风险：没有融到约定金额，你1分钱损失没有！\n\
    \n对赌：在约定的期限内没融资500万，倒赔你3~300万！\n\n想要实操，请马上联系一诺老师官方助理老师微信！\n\n## 第80课：资本路演的套路5\n\
    \n### 商业模式设计的误区\n\n创业者，如果没有足够的市场开拓工作的经验，如果没有跟一诺老师系统地学过“商业模式·顶层设计”，也没有这方面的顾问老师，那么设计出来的商业模式是存在比较大的风险的。\n\
    \n我们都认同一个观点：85%以上的老板都是干销售出身的。\n\n为什么干销售出身的人比较容易创业成功？\n\n因为他们更了解一线市场，更了解客户需要什么，也更知道市场、销售才是企业的生存之本。\n\
    \n记住一诺老师这句话，商业真谛！\n\n> 销售是商业的第一生产力！\n> —— 一诺老师\n\n总结一诺老师看过的几千个项目，一诺老师把容易犯的商业模式的误区分成6种类型。\n\
    \n**误区一：总想着烧钱抢用户**\n\n看到支付宝、微信、滴滴、饿了么等的补贴大战之后，很多人就一味道想着创业第一件事情就是烧钱把客户数量做起来。\n\n\
    这是很严重的个误区，没有一个企业是单纯靠烧钱就可以创业成功的。\n\n如果说，随便融点钱来做就可以成功，那创业岂不太简单了吗？\n\n记住一诺老师这句话，悟商业真谛！\n\
    \n> 太容易成功的事情，根本轮不到你！\n> —— 一诺老师\n\n**误区二：商业逻辑不够清晰**\n\n通俗地说就是把握不到创业项目的重点，不清晰企业的营收是怎么一步一步构建的。\n\
    \n一诺老师就遇到过一家企业，创业一开始就建立品牌中心，整个品牌中心每个月发十几万的工资，而这个品牌中心，做的事情就只是做做平面设计、活动邀请函、朋友圈文案等，几乎不产生业绩。\n\
    \n结果是最重要的市场中心完全忽略乃至撤销，后来一步一步把投资人的钱花完，没有给到投资人应有的回报，导致投资人集体抗议。这就是典型的商业逻辑不清晰。\n\n\
    **误区三: 一厢情愿，自以为是**\n\n犯这种错误的一般都是没有市场销售工作经验的人，他们觉得客户有需求，只是基于他们自己的感觉，而且非常偏执。\n\n\
    凭感觉来判定的市场需求当然不如真实的市场感受、市场调查来得靠谱。\n\n还有种情况是，这些自以为是的需求不是不存在，而是客户不愿意为这些需求付费。\n\n\
    **误区四：想法过大，变成空想**\n\n人要立大志，创业要往大格局去想，这没有错，但也要考虑自己的资源与承载能力。\n\n记住一诺老师这句话，悟商业真谛！\n\
    \n> 不要让自己的能力，配不上自己的野心！\n> —— 一诺老师\n\n曾经有一个创业项目，其商业逻辑是清晰的，但这个项目需要整合五大行业的商品与渠道资源。\n\
