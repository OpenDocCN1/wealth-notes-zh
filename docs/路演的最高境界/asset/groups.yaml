    记住一诺老师这句话，领悟商业真谛！


    > 用师者王，用友者霸，用徒者亡！

    > ——一诺老师


    企业的董事长刘敏先生和总裁张小雨都是一诺老师的粉丝，后来全部报名成了一诺老师的亲传弟子，因此也进入小组里面学习，上交手机，认真听课、记笔记、做作业，试问员工看到这种情形，还敢偷懒，还敢不认真么？


    这就是自上而下的强大执行力。


    课程结束后，张小雨把一诺老师讲课的要点一个字一个字地用电脑打出来，发到他们的群里让大家复习，刘敏也是每学习一节课，就用学到的知识来修改他们的招商PPT，一诺老师被他们深深地感动，所以，一诺老师也加班加点协助他们设计了一个符合他们招商会的成交模式。


    好的团队是能够带动人、感染人的。这家企业只推两款产品，一款面霜，一款面膜，但仅2007年一年时间就卖了9000多万元，2008年的目标是1.8亿元。能有这样的成绩，跟自上而下的强大的招商团队是分不开的。


    > 记住一诺老师这句话，领悟商业真谛

    > 用师者王，用友者霸，用徒者亡！

    > ——一诺老师


    招商团队也有分工，通常可以按照以下岗位来进行设计。


    - 招商总监：统领整个市场团队，制定与调整方案，特殊条件审批：把控方向，调配公司内部资源与外部资源协助招商。

    - 招商经理：开拓客户、成交客户、维护大客户、整合渠道。

    - 招商专员：前端开拓客户与维护客户，做大客户的引流文案。

    - 美工策划：这里可以是一个岗位也可以是几个岗位，负责设计制作招商的相关资料。

    - 后勤：可以根据需求设置客服、法务等岗位。

    - 会务：招商活动的执行岗位，如果活动外包，则设置一个“会务统筹”的岗位来负责对接。


    有的项目自己有很强的引流资源，招商人员就很少，可直接通过渠道引流做业绩。


    有的项目，把前端的市场招商部门与后端的市场服务部门分开，市场招商完成后，就把这些加盟商代理商交给市场服务部门。


    记住一诺老师这句话，顿悟商业真谛！


    > 一流的企业需要一流的团队，

    > 一流的团队需要一流的教练！

    > ——一诺老师


    接下来一诺老师要教大家的是——招商会的会前、会中、会后我们的招商团队分别要做什么。


    ## 第59课：招商路演的五个版块


    ### 第四个版块：招商团队 1• 会前铺垫


    在招商会议前，我们要如何进行铺垫呢？会议前，我们的招商团队要做到以下几件事情：


    > 记住一诺老师这句话，领悟商业真谛

    > 成功很简单，只要拥有成功的教练！

    > ——一诺老师


    - (1) 构建客户对品牌项目的认可度；

    - (2) 构建客户对市场团队的信任度；

    - (3) 构建客户对主讲人的尊崇度；

    - (4) 构建客户对方案的认知度；

    - (5) 构建客户对项目操作的熟悉度；

    - (6) 构建客户对签约的渴望度；

    - (7) 构建客户对会场的配合度。


    这些认可度、信任度、尊崇度、认知度、熟悉度、渴望度、配合度塑造到位了，会议中的成交就变得简单多了。


    十几年前，某集团的支付项目招商，找到一诺老师亲自出马，那个时候，但凡一次性支付330万的大客户，一诺老师会亲自设计这家企业的招商流程、话术、环节！并亲自上台演示一遍。


    因为这样的话，可以录像留给后面的企业招商师来学习。


    这家集团是跟一个培训机构合作的。培训机构开办4天的课程，一诺老师会在第三天晚上上台做招商路演。因为课程的主讲老师非常认可某集团的项目，并且同时也是一诺老师的骨灰级粉丝！所以呢，他在前面3天的课程中都会拼命地塑造某集团和一诺老师。


    > 记住一诺老师这句话，领悟商业真谛！

    > 会前塑造就是塑造品牌和主讲人的价值！

    > ——一诺老师


    等到第三天下午，台下的听众对某集团和一诺老师已经有了足够的认可度、信任度、尊崇度、认知度、熟悉度、渴望度、配合度了，所以呢，在一诺老师上台路演的时候，大家都充满


    着期待，听得特别认真。


    最后的成交签约环节，一下子就有500多人上台签约成交了。当场就签约1.2亿的合作意向。


    > 记住一诺老师这句话，领悟商业真谛

    > 用师者王，用友者霸，用徒者亡！

    > ——一诺老师


    这都是十年前的案例，现在没有800万是不可能让一诺老师亲自出马为你登台路演，但是只要成为一诺老师的顾问案弟子，也就是333万顾问费，首付33万，等到一诺老师指导你多赚1个亿，再补交尾款，这样你就可以拥有一诺老师的私人微信，有任何问题随时能得到一诺老师的亲自辅导。


    听到首付33万没有被吓倒的企业家，可以联系一诺老师的助理或者是一诺老师的全球合伙人，有惊喜等着你……


    了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。


    ## 第60课：招商路演的五个版块


    ### 第四个版块：招商团队 2• 会前流程


    会议中的流程要如何进行呢？这部分的内容讲两个方面，一个是流程设计，一个是岗位安排。


    关于招商会的流程设计，要把握三个原则：目的明确、节奏紧凑、体验震撼。


    (1) 目的明确


    整个流程的设计，最终目的都是为了成交！


    > 记住一诺老师这句话，领悟商业真谛

    > 成交的四个前提：

    > 需求、信任、价格、保障！

    > ——一诺老师


    也就是说，我们整个招商会的流程设计，都是为了让客户产生强烈的需求，信任我们的项目，愿意支付相应的价钱，感觉到做我们的项目很有保障，从而最终达到成交的目的。


    (2) 节奏紧凑


    整个流程的设计，要从客户的理解，与感受的角度出发来设计。


    站在客户的角度，应该先理解什么，再理解什么，最后理解什么，按照这样的节奏安排顺序。


    另外呢，你还要环环相扣，各个环节相互搭配好，不拖沓、不拖延，拖延的讲师简直就像老太太的裹脚布是——又臭又长！


    因此，一诺老师经常开玩笑地说——


    > 记住一诺老师这句话，顿悟商业真谛！

    > 演讲就像是美女的超短裙，

    > 长不能多一块布，短不能失去重点！

    > ——一诺老师


    (3) 体验震撼


    很多招商会最容易漏掉、忽略、不重视的一个环节就是体验，而这个环节恰恰是成交的关键。


    为什么呢？


    我们看乔布斯的苹果发布会，他80%的时间都在讲解产品，并带着大家一起体验产品。


    当体验足够震撼，客户就会产生强烈的购买欲望。但很多


    招商会都是项目、产品还讲得不清楚就急于成交。


    一诺老师把这种行为称为 “强奸客户”，对此鄙视至极。


    下面是一诺老师给到亲传弟子用的——招商会流程的表格模板，给大家参考：


    - ★时间：就是几点到几点。

    - ★主题：就是这部分时间安排做什么环节。

    - ★内容：就是这个环节具体要做什么。

    - ★目的：就是做这个环节的目的是什么。

    - ★负责人：就是这个环节的负责人是谁。

    - ★注意事项：就是这个环节特别要强调的事项。


    举例如下：


    | 时间 | 主题 | 内容 | 目的 | 负责人 | 注意事项 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 13:00-14:00 | 签到 | 到场客户签到。前期沟通了解客户情况 | | 迎宾姐 | 签到台、签到表、胸卡 |

    | 14:00-14:05 | 开场白 | 主持人致欢迎词，塑造企业 | 让客户了解、信任企业 | 主持人 | |

    | 14:05-14:10 | 视频播放 | 观看企业介绍视频 | 客户了解、信任企业 | DJ | 企业介绍视频 |

    | 14:10-14:15 | 讲师介绍 | 主持人塑造讲师 | 推崇讲师，让客户信任、认可讲师 | 主持人 | |

    | 14:15-14:45 | 讲师授课 | 行业发展趋势、客户的痛点 | 剖析趋势，挖掘痛点，让客户产生购买需求 | 讲师 | |

    | 14:45-15:30 | 产品体验 | 感受产品的魅力 | 让客户体验产品，深度产生购买需求 | 讲师 | 把产品准备好，销售人员按照讲师的步骤让客户体验产品
    |

    | 15:30-16:00 | 客户见证 | 使用者分享，权威人士做信用背书 | 信用背书，使客户感觉到购买有保障 | 分享嘉宾 | 分享嘉宾提前练习好，准备好PPT
    |

    | 16:00-16:30 | 合作方 | 讲师讲解购买方案 | 使客户接受购买价格 | 讲师 | |

    | 16:30-17:15 | 成交、签约 | 销售人员现场促成客户成交 | 成交，客户交订金或全款 | 销售组 | 订购单、刷卡机、礼物 |

    | 17:15-17:30 | 总结 | | | 总统筹 | |


    这是半天的招商会的例子，还有些招商会是一天的、两天的，甚至三天的。


    时间长的招商会主要是体验部分占了比较多的时间，比如企业参观、生产线参观、样板店参观、现有加盟商与代理商分享等。


    有很多人纠结招商会要不要设计一些表演环节。


    如果这个问题问到一诺老师，基本上都会被一诺老师打回去。


    因为招商会跟做秀不同。做秀的目的是彰显企业实力派，没有成交的环节。但招商会的一切是以成交为目的的！


    > 记住一诺老师这句话，领悟商业真谛！

    > 不能成交的招商会，都是在耍流氓！

    > ——一诺老师


    如果是在表演环节对成交有帮助，时间又允许的情况下，那就可以放进去，否则，就不要安排。


    要做好这三点，前提是有一个合理的岗位安排。以下是常见的招商会的岗位设置。


    - 会务统筹：整个会议的总统筹，安排会议的一切事项。

    - 主持人：会议所有环节的串联者。

    - 讲师：项目的主讲人。

    - 分享嘉宾：分享人，提前练好分享的内容，做好PPT。

    - 销售总监：销售团队的管理、激励，协助大客户的谈判，负责完成业绩指标。

    - 销售员：邀约客户，迎接客户，沟通客户，与客户成交。

    - 屏幕管理：保证投影屏幕的顺利播放，PPT与图像、视频切换。

    - DJ：调音，控制现场播放什么音乐，调节音量的大小。


    > 记住一诺老师这句话，领悟商业真谛！

    > 招商会必须协同作战，

    > 短板会影响成交结果！

    > ——一诺老师


    - 灯光：控制会议室的灯光，开灯、关灯、调暗。

    - 迎宾：一般在楼下与会场门口，形象好。

    - 签到：负责客户签到，发放胸卡。

    - 引位：把客户引导到已经安排好的座位上。

    - 门神：不让会场里面的人随便进进出出，门打开后及时关上。

    - 控时：控制每个环节的时间，适当的时候对台上的人做提醒。

    - 物资管理：管理所有会议的物料。

    - 财务：收钱、刷卡、统计。


    某些招商会还会有某些特殊的岗位要求，可以根据需要再去增加或减少岗位设置。


    > 记住一诺老师这句话，领悟商业真谛！

    > 成功很简单，只要拥有成功的教练！

    > ——一诺老师


    在选择主讲人的时候，要注意以下 4 个方面：


    - (1) 主讲人的风格能否为品牌形象加分

    - (2) 主讲人能否把内容演讲好。

    - (3) 主讲人能否调动气氛。

    - (4) 主讲人能否促成成交。


    最后，不要忘了制作一张订购单，在招商会结束之际，销售人员就应该拿着订购单去找客户成交。


    了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。


    ## 第61课：招商路演的五个版块


    ### 第四个版块：招商团队 2• 会后三件事


    会议后如何进行跟进，围绕着成交，会议后要做3件事情。


    - (1) 对于没有现场刷款的，但是又有意向的，继续跟进成交。


    会后跟进有个“黄金48小时”，就是会议结束后的两天内都是跟进的黄金时期，两天后，客户的热情会开始有所回落。


    > 记住一诺老师这句话，领悟商业真谛！

    > 机会迎面而来，不要让它擦肩而去！

    > ——一诺老师


    - (2) 对于现场刷了订金的，跟进补齐余款。


    已经交过订金，收余款相对来说就比较容易了。


    一般的客户都享有一个补齐余款的时间，这里面可以设计一些优惠或者赠送的方案，在完款期限之内就可以享受，超出期限就没法享受。


    - (3) 对于已经完款的，马上开始服务、管理与裂变。


    这一点是最重要的。


    因为，只要实际的合作还没开始，客户可还是会有退款的可能。


    如果客户硬要退款，不管原来合同怎么签，你也很难处理。


    所以，赶紧开始对客户进行服务与管理，帮助他们快速赚到钱，这个招商才算稳稳地完成。


    同时，可以设计一些激励制度让客户转介绍。


    我们都知道物以类聚，人以群分，客户肯定也认识很多潜在客户。


    > 记住一诺老师这句话，领悟商业真谛！

    > 成交的客户，表示对我们已经认可！

    > ——一诺老师


    这个时候让他们去做分享、转介绍，甚至帮助我们说服别的客户加盟，他们都会比较乐意。


    ## 第62课：招商路演的五个版块


    ### 第五个版块：方案设计


    招商方案的设计是招商工作中最重要的工作之一。


    一个成功的项目必定源于一个好的方案，一个失败的项目也很可能是因为一个失败的方案。在设计方案之前，必须结合一诺老师前面讲到的企业战略来进行考虑——


    > 记住一诺老师这句话，领悟商业真谛！

    > 当下需要什么，能给合作伙伴什么，

    > 再结合我们招商的目的来设计方案！

    > ——一诺老师


    潜在合作伙伴在考虑是否与你合作的时候，往往是在考虑以下几个问题：


    - 1. 需要我做什么？

    - 2. 我会得到什么？

    - 3. 保障我的是什么？

    - 4. 马上成交还有什么？

