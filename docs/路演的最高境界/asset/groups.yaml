    \n记住一诺老师这句话，领悟商业真谛！\n> 放大招是给到客户，立刻行动的理由！\n一诺老师\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\
    \n## 第38课：现场成交4\n\n### 现场成交步骤3：精准促成\n\n消费可以冲动，但是投资一定要了解清楚很多东西。如果是产品路演，哪怕是客户第一次来，都可以现场促成。但如果是投资项目，客户才第一次来，现场促成就要慎重。\n\
    \n记住一诺老师这句话，顿悟商业真谛。\n成交的三种类型：\n- 台下成交\n- 台上成交\n- 会后成交\n一诺老师\n\n#### ① 台下成交\n\n\
    举例一：有没有谁是对我们送的礼物有兴趣的?请把手举高伸直。请我们的销售人员把订购单发给大家，填好了就去右手边的财务处刷卡，领取礼物。\n举例二：现在各位只需要拿出你的手机，扫一扫我们显示屏上面的二维码，就可以完成付款了。\n\
    我们今天送出的大礼仅限前面20位，先付款成功的先得到。付款成功后，拿着付款成功的二维码到我们后面就可以领取礼品了。\n这个时候销售人员就该拿着订购单去促成交易了。订购单的设计可以简单一些，把今天的成交方案包含在里面，让客户签名，就可以带客户去刷卡了。\n\
