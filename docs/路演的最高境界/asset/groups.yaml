    \ 拥有市场的人**\n\n比如一诺老师是做化妆品的，我可以找已经在代理别的化妆品的代理商来代理我的产品。\n\n他们本身已经在做这个行业的代理，他们的客户就是我需要的客户，如果他们能够代理我的产品，只要一上架就可以向他们现有的、已经有足够信任感的客户销售一诺老师的产品了。\n\
    \n记住一诺老师这句话，悟商业真谛！\n\n> 谁拥有我们的客户，谁就是我们的\n> 大客户！\n> ——一诺老师\n\n一诺老师的亲传弟子叫张敏，他的企业做得很好，是国内做翻页笔的龙头企业，自创的品牌也是行业的翘楚。\n\
    \n他的一位朋友准备做一个生物科技领域的原材料项目，这种原材料的成本只有同行的三分之一，可以为很多使用这种原材料的企业节省很大的成本。这是一个相当有优势的项目。\n\
    \n当时产品已经研发好，生产能搞定，就是不知道要怎么开拓市场。\n\n于是张敏就带着他的这位朋友报名了一诺老师的亲传弟子顾问案，顾问案收费330万，当时由于对方是经济紧张，加上一诺老师也想帮助他，首付30万，帮他赚到1个亿，再付剩下的300万。一诺老师教了他很多方法，最后一诺老师问他，想知道终极大招吗?他说当然想！\n\
    \n于是乎，一诺老师就给他列了一张清单，告诉他：“你就按照这张清单来挖人就可以了。”\n\n+   这张清单是：\n+   - 市场总监/渠道总监\n+ \
    \  - 市场副总监/渠道副总监\n+   - 各大区总监/经理\n+   - 大区的代理商\n+   怎样找到这些人？\n+   肯定是从同行中找，这是最快的！\n\
    \n记一诺老师这句话，顿悟商业真谛！\n\n> 优秀的人才都在竞争对手的企业里！\n> ——一诺老师\n\n因为这些岗位的人本身已经拥有了市场资源!挖的时候最好挖一些有市场开拓经验的，也就是说，那个市场原来是空白的，或者做得不怎么样，他去了以后才做出来的。\n\
