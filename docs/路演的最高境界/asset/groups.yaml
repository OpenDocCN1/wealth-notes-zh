    # 第112课: 投资人套路5


    # 我们最看重的是团队


    每家VC都有自己的投资准则，包括投资领域、投资额度、投资阶段等也有各自的评判项目的标准。


    可是，几乎所有的VC，都会声称自己评判项目的标准中，最重要的是“团队”。


    这句忽悠话不知道让多少创业者误入歧途。


    记生一诺老师这句话，格商业真谛！


    > 只要风投不投你，所有的原因都叫做借口！

    > —一诺老师


    很多创业者为了能够向VC融资，创业之初就拼凑所谓的“梦幻团队”，这样的团队绝大部分是很难产生预期的经营效果的，当然也对融资没有帮助。


    现在VC基本都一窝蜂地看传统行业的成熟项目，这些项目的创始人团队和管理团队很多，甚至是农民企业家，没什么学历，不懂什么管理学，但一身市场打拼经验、胆子和魄力。


    他们在5年前、10年前创业的时候，没有人会说他们“团队很强”。


    甚至像Google、腾讯、百度等成功企业，当初创业的时候，也没人说过他们的团队很好，VC投资的时候，这些创业的毛头小伙怎么看都不是“团队很强”。


    所以，说“团队很强”其实有点儿“事后诸葛亮”的意思，对于一个成功的企业，说不清它怎么成功的，就可以归功于“团队很强”


    《记你一诺老师这句话，顿悟商业真谛！


    > 只要项目好，风投也会相信：有我就有千军万马！

    > —诺老师


    另外，从那些成功的企业里出来的人，在VC眼里，也可以作为好的团队的必要条件，可是这些所谓“很强”的团队，除了拿VC的钱方面比较成功之外，到底有几家把公司做成
    功了呢？


    连续创业成功的创业者又有几个呢？


    VC说“我们最看重的是团队”，其实这不是一句完整的话。


    尽管他们也许确实是投资这个团队，但创业者千万不要以为VC不会炒掉你。


    也许VC是因为你和你的团队才决定投资，似乎没理由炒掉你，但VC隐去的后半句是：“如果公司运作良好，那么你可以继续干下去，否则，我们会炒掉你，因为没有谁是不可缺少的。”


    VC看项目就跟姑娘相亲找对象一样：VC说看重的是团队，就像姑娘说看重的是小伙子的人品；VC说你的团队不错，就等于姑娘说小伙子“人好”。


    没有钱、没好工作、没好家境、没长相、没学历……什么都没有人，才会被姑娘用“人好”来“夸奖”的。


    因此，当VC真的这么“夸”你的时候，你也就知道他其实是想说什么了…


    记住一诺老师这句话，领悟商业真谛！


    > 当别人夸你的时候，就是不想跟你合作的意思！

    > —一诺老师


    跟这个忽悠用语类似的还包括：“我们不会干预创业者对企业的管理”、“我们评估项目主要看三点：第一是人，第二也是人，第三还是人”、“我相信你们的团队可以把公司带到上市。”


    通常情况下，这些话的潜台词是：“你们这帮傻帽，要是能把公司做大，算我瞎了眼!”


    记住一老师过句话，顿悟商业真谛!


    > 只要风投不投你，说再多都是废话!

    > —一诺老师


