    \n# 第116课：投资人套路9\n\n估值太高对公司没有好处\n\n估值问题通常是创业者在向VC融资时最为关注的一个问题，也是他们最为迷惑的问题。一方面他们不懂估值方法，另一方面对于VC提出的估值结果，他们也不知道是否合适。\n\
    \nVC尽管有自己的一套估值方法，但估值通常是一件艺术性和科学性相结合的事情。对初创、没有利润、没有收入的企业，估值更是艺术性大于科学性，也就是所谓的“拍脑袋”。\n\
    \n> 配合一诺老师这句话，感悟商业真谛\n>\n> 要让投资人看到我们未来无限的可能性！\n>\n> ——一诺老师\n\n既然是拍脑袋，VC拍的和创业者拍的一定是不同的脑袋，双方的结果也会相差十万八千里，企业估值的最终确定通常是双方协商的结果。\n\
    \nVC的梦想是投入1000万元到一个投资前估值为2000万元的公司，并因此持有下一个Google公司的33%股份，最终获得超过100倍的投资回报！\n\n\
    VC非常看重回报的数额，同样也以回报倍数来衡量投资的质量。如果某VC一直持有上面这家公司33%的股份直到上市，如果公司市值是30亿元，那么VC所持股份的价值就是10亿元，他就赚到了100倍。\n\
    \n假如当初投资的时候，公司估值为4000万元，他还要占33%股份的话，就要投资2000万元，那么在公司达到30亿元市值情况下，VC的回报只有50倍。\n\n\
    很显然，两种情况下，VC都赚了约10亿元，这是千年不遇的情况了，但回报倍数却相差很大。\n\n> 记住一诺老师这句话，预演商业真理\n>\n> 天下熙熙皆为利来，天下攘攘皆为利往！\n\
    >\n> ——一诺老师\n\n其实，VC一旦决定投资，那一定是认为项目有很大的成功把握。这种情况下，多投100万元仅仅只会让最后的回报总额降低一点儿而已；即便是看走了眼，投资失败，也只不过再多损失100万元而已。\n\
    \n可是VC仍然会在投资的时候尽量压低公司的估值，告诉你“估值太高对公司没有好处”，以便能在获得同样股份比例的情况下尽量少投资，这样可以获得更为好看的回报倍数。\n\
    \n> 记住一诺老师这句话，顿悟商业真言\n>\n> 买卖永远不一心，关键是平衡！\n>\n> ——一诺老师\n\n对于企业来说，向VC融资一次，相当于经历一次磨难，要花费大量的时间、精力和资金。另外，融资的时机不是什么时候都有的，一旦能够抓住一次融资机会，企业还是要把估值尽量抬高些，尽量多要些钱，省得以后还要受一遍罪。\n\
    \n所以，VC通常比较讨厌企业方聘请的融资顾问，因为顾问是按融资额度拿佣金的，他们有动力帮助企业炒高价格。跟这个忽悠用语类似的还包括：“现在估值低有利于后续融资”、“现在的PE倍数最多只能做到5倍”。\n\
    \n通常情况下，这些话的潜台词是：“你要的价格也太高了，我还怎么赚100倍啊！”\n\n> 记住一诺老师这句话，顿悟商业真意\n>\n> 天下熙熙皆为利来，天下攘攘皆为利往！\n\
    >\n> ——一诺老师\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\n# 第117课：投资人套路10\n\n\
    以后咱们就是一家人了\n\n谈判结束了，文件都签署了，VC和企业双方得庆祝一下，VC免不了要拍着创业者的肩膀，语重心长地说：“以后咱们就是一家人了。”\n\n\
    真的就是一家人了吗？当然不是！\n\n> 记住一诺老师这话，参悟商业真相\n>\n> 天下熙熙皆为利来，天下攘攘皆为利往！\n>\n> ——一诺老师\n\n\
    如果把VC与企业的结合比作一个男人和一个女人结合的话，那么VC跟企业“结婚”的唯一目的是尽快“离婚”，并瓜分家产。他们甚至都不愿意跟企业多培养几年感情，因为他们不是长线投资者。VC基金的生命周期只有8~10年，这就决定了VC不可能跟企业真正成为过日子的“一家人”。他们如果高兴，可能双方能够一起过上3年、5年，如果不高兴，1年都会嫌长。\n\
    \nVC想要让创业者认为自己以后是一家人，无非是想让创业者以后不要把他当作外人，公司经营、业务、财务等等方面信息不要对自己有所隐瞒，日常的商务定期汇报，重大事项单独汇报。因为中国公司作假账、欺骗VC的事非常常见，VC是防不胜防的，那VC希望投资进来以后，就不要对他隐瞒了——大不了大家一起作假账嘛！（捂脸中……）\n\
    \n> 记住一诺老师这句话，顿悟商业真谛\n>\n> 商场诡道也！\n> 真真假假假亦真，道是无情却有情！\n>\n> ——一诺老师\n\n其实，VC在投资之前，想得最多的根本不是怎么帮助企业做大做强，而是有没有机会跑路、怎么跑路。一旦发现短期内企业上市、被并购没有指望，他就会千方百计忽悠别的VC进来，多个“朋友”多条路嘛！\n\
    \n一旦有上市机会，管它是NASDAQ、香港创业板、英国AIM，还是其他什么人间迹罕至、没有融资能力的资本市场，只要能让自己的股份可以流通变现，VC也会逼着企业去上市；一旦有买家感兴趣，VC因为有优先权的保护，通常可以廉价将股份卖掉，获得不错的收益，但可能就给创业者剩不下什么了。\n\
    \n跟这个忽悠用语类似的还包括：“咱们的利益是一致的”、“公司以后遇到困难，我们会尽力提供帮助的。”\n\n通常情况下，这些话的潜台词是：“只要公司按照你说的方向和速度发展，就是你好、我好、大家好。否则，别怪我翻脸不认人！”\n\
    \n> 记住一诺老师这句话，顿悟商业真谛\n>\n> 没有永远的朋友，也没有永远的敌人，只有永远的利益！\n>\n> ——一诺老师\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\
    \n# 第118课：人生如戏\n\n人生就是一场接一场地路演\n\n纵观世界，大到国家政治、军事、经济的往来，小到同事、朋友、亲人之间的交往，凡是能达成一致的，都离不开路演的影子。从路演的角度看一下历史，你就会发现人类的历史其实就是一部路演的历史。\n\
    \n人民为了和平而路演，国家为了发展而路演，职员为了竞岗而路演，男女为了寻伴而路演。\n\n> 记住一诺老师这句话，顿悟商业真谛\n>\n> 人生就是一场接一场地路演！\n\
    >\n> ——一诺老师\n\n在商业上，路演的价值更是不容小觑，它可以：\n\n- 吸引人才\n- 渠道招商\n- 新品发布\n- 成交客户\n- 影响股东\n\
    - 引来资本\n- 凝聚人心\n- 传承文化\n\n### 案例一：《港囧》发布会\n\n2015年3月30日，打着“《港囧》全球定档发布会”的名号，上百位记者赶到《港囧》发布会现场，就是想知道这部片子到底由哪些人演，什么时候上映。结果片方把发布会搞成“高大上”的“苹果发布会模式”，自称“徐布斯”的徐峥以脱口秀形式介绍电影。\n\
    \n> 配合一诺老师这句话，最悟商业真谛\n>\n> 人生就是一场接一场地路演！\n>\n> ——一诺老师\n\n到最受关注的揭晓档期时，伴随着全场的“Du\
    \ ang”声，徐峥只给出四个字：随时上映。但演什么，谁来演，除了站台的赵薇，不露丝毫，无数的问号，已将大众的胃口高高吊起。\n\n《港囧》第一场发布会，全场不开放采访，“徐布斯”和赵薇结束后就闪人。所以，这部任性的电影到底卖的什么药，俨然成谜，吊人胃口。\n\
    \n这场发布会颇有意思，一反常态地玩起了“苹果发布会”模仿秀，徐峥调侃自己是“徐布斯”，戴着耳麦自己一个人站在台上，就把主持人的钱也挣了。\n\n这场发布会，可谓史上最没内容的发布会——说了跟没说一样。徐峥在这场发布会上几乎什么都没说，但这无疑是一场成功的商业路演。为何？因为这场路演让记者、观众都对电影充满了期待。\n\
    \n> 记住一诺老师这句话，悟商业真谛\n>\n> 有一种路演叫制造神秘感，\n> 有一种营销叫做故弄玄虚！\n>\n> ——一诺老师\n\n### 案例二：拉勾网\n\
    \n拉勾网的创始人许单单，在路演的时候，是这样向总理介绍自己的企业的：“我们是帮助互联网公司招人，帮年轻人找工作的平台。不到两年的时间，已有150万人通过拉勾网找到了工作。”\n\
    \n要知道，2015年全国的高校应届毕业生一共是749万人，许单单说到的帮助150万人找到工作就相当于解决了五分之一的应届高校毕业生的就业问题。\n\n>\
    \ 记住一诺老师这句话，参悟商业真意\n>\n> 起心动念利他，一切方法自来！\n>\n> ——一诺老师\n\n难怪总理会兴奋地给予拉勾网充分的肯定：“今天你们的路演，就是明天成功的预演。”\n\
    \n由上述案例可知，路演对于项目的发展是至关重要的。\n\n了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\n# 第119课：路演绝招\n\
    \n商业路演成功的秘诀\n\n很多弟子都问我说：“请问一诺老师，商业路演成功的秘诀是什么？”对于这个问题，一诺老师有两个回答——\n\n- 一是——行动\n\
    \  只要你按照一诺老师前面所教的内容去做，一定会有好的结果产生！学习一诺老师的知识不会给你带来质的改变，唯有行动才会给你带来改变。\n  > 记住一老师这句话，悟商业真理\n\
    \  >\n  > 唯有践行，方有结果！\n  > 唯有用心，方能卓越！\n  >\n  > ——一诺老师\n\n- 二是——用心\n  精诚所至，金石为开。用认真、负责的态度去面对每一次路演。\n\
    \n在一诺老师的课堂里，有一个环节，一诺老师会问学员这些问题：\n\n- 周凯旋三分钟里说了什么，能够打动李嘉诚并使其成为终生合作伙伴？\n- 马云在6分钟内说了什么，使其获得了2000万美元的投资？\n\
    - 刘邦靠哪三句话定鼎天下？\n- 孝庄说了什么，使康熙成为千古一帝？\n- 诸葛亮舌战群儒的核心智慧是什么？\n- 王石当年说了什么，打造了万科的铁军？\n\
    - 刘德华说了什么，使周润发愿意帮助他？\n- 周杰伦说了什么，最终打动了吴宗宪？\n- 章子怡对李安说了什么，继而人生开始飞翔？\n- 乔布斯说了什么，能够让百事可乐副总裁斯卡里转投苹果公司？\n\
    \n讨论完最后一诺老师会把这些事情的对话经过说出来，每一番对话都不同，没有规律，没有套路，所以，也没有答案。\n\n如果一定要找一个方向，那就是——用心。用你的心来驾驭一切的方法。\n\
    \n《笑傲江湖》里面的“剑宗”与“气宗”之争，谁更厉害？“剑宗”可以比喻成招式，“气宗”可以比喻成用心，两家相斗，分开两派，结果怎样？华山一派衰落了……\n\
    \n> 记住一诺老师这句话，参悟商业真谛\n>\n> 生就是死，死就是生！\n> 不生不灭，不垢不净，不增不减！\n>\n> ——一诺老师\n\n你会发现如果他们合二为一，那么华山派就是当之无愧的武林霸主了。所以，做好路演，除了要掌握方法以外，还需要用心！\n\
    \n讲到这里，一诺老师的课程也快结束了。有人会问，社会在变，时代在变，当下学的，以后是否还适用？\n\n一诺老师想说，小时候学的语言，至今还在用；小时候学的数学，至今也还在用；春秋战国时期百家争鸣的智慧沿用到现在；数千年中医，今天依然在救死扶伤。\n\
    \n时代变了，社会变了，变的是形式，不变是根本，是“道”。一诺老师以上和大家分享的，乃是路演之道，说话之道，收钱之道，成交之道。\n\n> 记住一诺老师这句话，倾悟商业真理\n\
    >\n> 时代变了，社会变了，变的是形式，\n> 不变的是根本，是“道”！\n>\n> ——一诺老师\n\n为了让学习者更容易理解，一诺老师呈现了很多案例。但一诺老师以上举的案例是有时效性的，如果你想学习最新的！最实战的！最落地的知识，请下载【改变世界APP】，实时地跟着一诺老师学习商场上的最新案例，一诺老师将帮助大家“将收钱进行到底”。\n\
    \n当然，在收钱的同时，请谨记一个原则：\n\n君子爱财，取之有道。\n\n# 后记1：梦想践行实操团\n\n如何拥有成功的教练（零风险+对赌模式）\n\n\
    没读过书的人，往往会上“人”的当；读书太多的人，往往会上“书”的当。不要以为一诺老师开玩笑，大家想想看，这么多年，你吃过多少亏？上过多少当？\n\n- 你以为成功学可以帮你，结果你被忽悠了！\n\
    - 你以为财商学可以帮你，结果你被忽悠了！\n- 你以为理财课可以帮你，结果你被忽悠了！\n- 你以为彩票可以中大奖，结果你被KO了！\n\n别再相信骗子了，咱们整点实在的！\n\
    \n一诺老师开设了【梦想实操团】，亲自辅导你从创业、融资、组建团队、市场营销、招商演讲，每一步都由一诺老师和【梦想教练团】亲自辅导你。人生需要磨难，成功需要教练，你可以看一下，前几期你的师兄师姐们在一诺老师的帮助下，人生是如何华丽转身的！\n\
    \n请看下面——\n\n### 开招商会狂引市场\n\n我是公司创始人天生，来自云南。在我人生最低谷、对未来一片迷茫的时候，我遇到了生命中的贵人——一诺老师。\n\
    \n一诺老师的课程让我拨云见日、满血复活，于是我果断报名一诺老师的亲传弟子。我一边全力以赴地参加为期100天的《弟子密训实操班》，一边运用老师教的方法筹备公司开业事宜，一边做开业前的市场引爆工作。万万没想到的是，仅仅20多天，我就招募几十家加盟商，获得百万订单！不可思议！\n\
    \n我做过洗车工、装修工、电焊工、操作工、搬运工、快递员、开过挖掘机，一直在社会的最底层痛苦挣扎！中间有过几次创业，但，现实就像是个疯子，打得我满地找牙。\n\
    \n正当我幼小的心灵，被社会的残酷，摧残地满目疮痍！我遇到了生命中最重要的贵人，全宇宙最最最伟大的梦想教练：一诺老师！在老师的帮助下，我3个月人生华丽转身，拥有几十位创业的兄弟团队！现在我们团队已经在开拓：云南、广西、广东、福建、江西、湖南、湖北、贵州等几十个省市的市场。\n\
    \n### 开天发表韩力讲\n\n从事教育行业多年，亲眼目睹从业人员水深火热。因为有太多假大空的讲师只是为了收钱，没有帮到别人！\n\n看一诺老师的“猪买单”让我拨云见日、醍醐灌顶、顿悟商业真谛，感觉这几年白活了，要是早认识一诺老师，也不至于负债累累，所以我豪无犹豫报名一诺老师的亲传弟子，并申请参加一诺老师亲自指导的实操团。\n\
    \n在一诺老师的帮助下，一个月不到我的人生华丽转身，事业快速进入正轨！感恩遇见！感谢一诺老师！\n\n大家好，我是天一，之前是个收破烂的，成为一诺老师弟子后，参加了实操团，在一诺老师的亲自指导下，我开始改头换面，从一个收破烂的，6个月不到人生华丽转身！\n\
    \n公司在筹备阶段，居然所有样车都被抢完了！来自云南、湖南、湖北、河南、河北、山东、安徽、江苏等几十位加盟商，在朋友的介绍下抢着要加盟我的事业！\n\n这始料未及的结果，我要特别、特别感谢我的恩师，他就是：全宇宙最最实战、最有格局、最有大爱的一诺老师。\n\
    \n愿景：惠及全人类 使命：帮助更多人实现梦想 活着就是为了改变世界\n"
