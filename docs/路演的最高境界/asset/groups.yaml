    ## 第83课：盈利模式3


    ### 赚搭售的钱


    服装店卖衣服，卖了一件衣服还搭售了一条裤子，再搭售一件外套，这就是搭售的钱。


    > **一诺老师寄语：搭售又可以分为：产品搭售、产业搭售、跨界搭售！**

    >

    > 一诺老师


    1. 产品搭售


    像饭店卖的套餐，会比单点那几样菜更便宜一些，但如果没有这个套餐的方案，消费者可能就只点一样菜了，这就是产品搭售。超市、大商场、便利店的竞争力就是产品搭售。


    2. 产业搭售


    就是销售自己产品的同时，也销售相关产业的产品。比如电影院在卖电影票的同时还会卖爆米花、汽水；房地产开发商本来只是卖房子现在连装修一起卖；房东租房子，把家电、家具配上一一起租；培训公司销售课程，连带企业咨询服务也一起做。移动、电信公司卖话费，后来连手机也一起卖，于是就有了充话费送手机。这叫相关产业搭售。


    3. 跨界搭售


    两个不太相关的行业搭配起来销售，比如看房送加油卡、买保健品送花生油、买电器送大米等。


