    > 先要卸载听众的防备心理：攻其不备，才能出奇制胜！\n一诺老师\n\n#### ③ 台上一对一\n\n用这个方法，讲师的语气、眼神必须非常坚定。\n跟第一个人说：“贵姓?相信一诺老师能帮到你吗?相信就百分之百地相信，刷全款，好还是不好?这边请。”\n\
    跟第二个人说：“怎么称呼你?相信我能帮到你吗?相信就百分之百地相信，刷全款，好还是不好?这边请。”\n后面都一样，遇到不能全款的就说：“你还是相信一诺老师能帮到你吗?那就在旁边先等一等，一诺老师一会来帮你。”然后请他们往队伍后面站。\n\
    等到能够刷全款的都处理完了，再来逐个问他们：“一诺老师相信你是个有决心的人，你今天最多能刷多少?”\n\n如果总额为3万元，他说今天可以刷1万元，那就问他：“以你的决心程度，最快什么时候可以全部付完？”等他说出一个时间后，就回应：“好的，一诺老师相信你，现在先刷1万元吧。请到旁边办理。”让他先刷1万元，会务人员后续跟进。\n\
    如果总额为3万元，他说刷1000元，那就说：“一诺老师相信你的决心不止这么点，刷多少？”然后眼睛看着他，不要让他别的话。\n\n记住一诺老师这句话，顿悟商业真谛！\n\
    > 成交时，后发制人！谁先说话，谁先输！\n一诺老师\n\n所以，上台不用问太多的问题，也不用讲太多。刷卡之前不要让他们分享，因为一分享就可能会控制不住时间，破坏掉成交的气氛！成交的时刻要快!要用霹雳手段，快刀斩乱麻！刷完卡以后，倒是可以请他们分享一下。这就是一诺老师经常说的“快、准、狠”的上台成交！\n\
    \n因为书里面没有办法很清晰地呈现，有兴趣的朋友将来来到一诺老师课堂上，一诺老师现场演示给大家看。\n\n《记住一诺老师这句话，顿悟商业真谛！\n**人生需要磨难，成功需要教练!**\n\
    ——一诺老师\n\n#### ④ 会后成交\n\n会后成交就是会后跟进客户。如果用的是这种方法，在现场只需要把项目和方案讲清楚，讲得有吸引力就可以了。\n\n\
    了解书籍和课程，请在微信内添加一诺老师官方公众号【改变世界商学院】和【梦想教练】。\n\n用300元最低融资500万，签订《零风险+对赌》 协议！\n零风险：没有融到约定金额，你1分钱损失没有！\n\
    对赌：在约定的期限内没融资500万，倒赔你3-300万！\n想要实操，请马上联系一诺老师官方助理老师微信！\n\n## 第39课：现场成交5\n\n###\
    \ 现场成交步骤4：气氛营造\n\n一诺老师认为，现场成交是需要气氛的，如果现场买单的人很多，客户的购买冲动也会被带动起来。\n记住一诺老师这句话，顿悟商业真谛！\n\
    > 要创造抢购的氛围，来带动客户的冲动！\n一诺老师\n\n经过一诺老师研究发现，有几个地方对于成交气氛的营造尤为关键——\n- ① 在高潮中做成交动作：比如你的大招，应该要在现场有大家一起说“哇”的效果。这是需要现场的工作人员带动和配合的。你设计的会议成交点一定是整场会议的高潮。\n\
    - ② 销售人员给力：销售人员反应要快，要能跟得上讲师的节奏。在讲师号召客户上台的时候，销售人员就要在台下配合，推动那些有意向、很认可、情绪高涨的人。最好能陪同客户一起上台，保证有人跟进刷卡事项。如果在台下成交，销售人员就要配合着讲师的要求发订购单。\n\
    - ③ 充分的铺垫：现场要买单，铺垫一定要够。同样的讲师，同样的场地，邀约的客户质量不同，会务不同，结果也可以完全不同。这就是为什么那么多人模仿一诺老师，那么多人抄袭一诺老师的课件和书籍，却没有一个人能够超越一诺老师的！因为一诺老师花了大量的时间跟听众建立信赖感！\n\
    \n记住一诺老师这句话，顿悟商业真谛！\n> 信赖感解决了，一切都不是问题！\n一诺老师\n\n一诺老师把整个培训界甩开了一个银河系的距离！这绝不是自吹自擂，你看市面上那些下三滥的讲师，三句话就想成交听众，就想收钱，眼里只盯着钱！却没有心思去付出！\n\
    \n曾经一诺老师的一位弟子，因为从来不付出，只想着讲完话就收钱，后来饿得面黄肌瘦住在贫民窟，后来他问一诺老师说：“一诺老师啊，我也是按照您教的方法来成交别人呀，为什么我却没有您这么伟大、这么成功呢？”\n\
    一诺老师对他说\n> 记住一诺老师这句话，顿悟商业真谛！\n方法皆空，因果不空！\n你之所以还没有成功，因为你付出的还不够！\n一诺老师\n\n他一味地索取，不想付出，这就是他失败的原因！很多老学员都知道那个弟子，一诺老师让他录课，他就是不录，还说“没钱干嘛要录？我的课不给不认可的人听。”由于他心态有问题，总想不劳而获，面对一诺老师对他的教导总是抱怨，一诺老师就把他逐出了师门！\n\
    \n> 记住一诺老师这句话，顿悟商业真谛！\n不要抱怨，\n抱怨是无能的表现，抱怨是死亡的开始！\n一诺老师\n\n- ④ 熟客的感召：客户讲一句，比我们讲一百句都好。所以要学会借力，让你的老客户帮你邀约新客户到场，让老客户也来到现场帮我们说话，帮我们成交。\n\
