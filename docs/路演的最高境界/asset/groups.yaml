    # 第104课：资本路演套路4


    ## 如何成交投资人


    在人与人之间的沟通方面，一诺老师概括了三句话：


    - （1）人所欲，勿施于人。

    - （2）人之所欲，施之于人。

    - （3）授之以欲，成之于人。


    这三句话，简单来说就是：


    - （1）不要给别人不想要的东西。

    - （2）给别人需要的东西。

    - （3）让他产生某些需求，并通过你来满足这些需求。


    要与投资人成交，就要先弄清楚投资人的需求，思考一下他为什么要投资你。


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 要给到对方投资自己的理由！

    >

    > ——一诺老师


    个人投资者投资你，可能会有以下的原因：


    - （1）给创业者面子；

    - （2）看重创业者的个人能力、品行、经验或行业背景；

    - （3）认同创业者的使命；

    - （4）被创业者的故事感动；

    - （5）漂亮的包装能够很好地凸显项目优势；

    - （6）看中项目高额的回报。


    从上面可以看得出来，要与个人投资者成交，更多是要引发他的情绪。


    > 记住一诺老师这句话，悟商业真谛！

    >

    > 成交是信心的传递，情绪的转移！

    >

    > ——一诺老师


    不同的投资人喜好多！


    所以，最好对你要成交的对象有个提前的了解。


    而机构投资者，基本就是理性化地看待项目了，他们有一套流程与标准。


    所以，经过一诺老师几十年的企业顾问经验，今天把投资人看项目的秘诀告诉大家。


    投资机构针对企业发展的不同的阶段，关注的重点不一样，一诺老师可以用一句话概括为：


