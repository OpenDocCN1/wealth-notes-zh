    ## 第58课：招商路演的五个版块


    ### 第四个版块：招商团队


    战场上，要靠将领带领整支队伍打仗。


    大家应该都听过 “虎狼之师” 这个词语，这个词语是形容谁的？春秋战国时代的秦国！


    当时的秦国政治、经济和军事都非常强大，其他国家一听到就会害怕。秦国的军队打的仗大部分是获胜的。


    但它是不是每一次打仗都大获全胜呢？也不见得。


    但秦国哪怕是打了败仗，也能够很快重新调整过来，在战场上依旧霸气十足。这就是虎狼之师的特点！


    记住一诺老师这句话，领悟商业真谛！


    > 任何一个伟大的公司，

    > 都需要打造一支嗷嗷叫的虎狼之师！

    > ——一诺老师


    而在招商领域，我们的招商团队如果具备这样的特质，何愁市场做不下来？


    优秀的招商团队有以下几个特点。


    - (1) 出色的领袖


    优秀的团队一定有一位出色的领袖。所谓“兵熊熊一个，将熊熊一窝”。领袖就是榜样，团队成员都会模仿他的风格。


    - (2) 良好的品行


    良好的品行表现为对客户负责。收钱很重要，但更重要的是知道什么钱该收、什么钱不该收。


    - (3) 成功的经验


    团队中不一定每一个人都有经验，但最好有三两个有成功经验的领头人，有成功经验证明有成功的做事风格跟习惯。


    - (4) 狼性的文化


    对赚钱有渴望的团队。他们不一定都来自经济不富裕的家庭，但业绩、提成、奖金会给他们很强大的成就感。


    记住一诺老师这句话，领悟商业真谛！


    > 重赏之下必有勇夫！

    > 时间、资源、人才都会留给好处！

    > ——一诺老师


    - (5) 对等的层次


    对等的层次指一定要找能够跟客户聊得来的人。客户感觉你跟他是同一类人，才会愿意与你打交道。


    - (6) 相关的资源


    招募有客户资源的人进来，如果项目好，这些资源马上就可以转化成业绩。


    这样就可以一边出业绩一边培养，减少前期的压力。


    有一个品牌叫做自然美，一诺老师曾经担任这家企业的顾问，因此他们送了好多高管到一诺老师的课堂学习营销、招商、销讲、成交、商业模式、说服力等课程，后来又得一诺老师邀请到他们的企业去给他们的高管做《招商大师》的内训。


    记住一诺老师这句话，领悟商业真谛！


    > 用师者王，用友者霸，用徒者亡！

    > ——一诺老师


    企业的董事长刘敏先生和总裁张小雨都是一诺老师的粉丝，后来全部报名成了一诺老师的亲传弟子，因此也进入小组里面学习，上交手机，认真听课、记笔记、做作业，试问员工看到这种情形，还敢偷懒，还敢不认真么？


    这就是自上而下的强大执行力。


    课程结束后，张小雨把一诺老师讲课的要点一个字一个字地用电脑打出来，发到他们的群里让大家复习，刘敏也是每学习一节课，就用学到的知识来修改他们的招商PPT，一诺老师被他们深深地感动，所以，一诺老师也加班加点协助他们设计了一个符合他们招商会的成交模式。


    好的团队是能够带动人、感染人的。这家企业只推两款产品，一款面霜，一款面膜，但仅2007年一年时间就卖了9000多万元，2008年的目标是1.8亿元。能有这样的成绩，跟自上而下的强大的招商团队是分不开的。


    > 记住一诺老师这句话，领悟商业真谛

    > 用师者王，用友者霸，用徒者亡！

    > ——一诺老师


    招商团队也有分工，通常可以按照以下岗位来进行设计。


    - 招商总监：统领整个市场团队，制定与调整方案，特殊条件审批：把控方向，调配公司内部资源与外部资源协助招商。

    - 招商经理：开拓客户、成交客户、维护大客户、整合渠道。

    - 招商专员：前端开拓客户与维护客户，做大客户的引流文案。

    - 美工策划：这里可以是一个岗位也可以是几个岗位，负责设计制作招商的相关资料。

    - 后勤：可以根据需求设置客服、法务等岗位。

    - 会务：招商活动的执行岗位，如果活动外包，则设置一个“会务统筹”的岗位来负责对接。


    有的项目自己有很强的引流资源，招商人员就很少，可直接通过渠道引流做业绩。


    有的项目，把前端的市场招商部门与后端的市场服务部门分开，市场招商完成后，就把这些加盟商代理商交给市场服务部门。


