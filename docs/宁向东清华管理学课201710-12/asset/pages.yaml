  md: '订单。


    这套新的核算方法，叫做作业成本法，英文叫Activity Based Costing，简称ABC。作业成本法的出现，实际上顺应了两个潮流，第一，就是企业内部的成本结构，需要分摊的部分，比例越来越大。在大约50年前，需要分摊的费用一般不会超过企业全部成本费用的10%。但现在，企业中超过一半的费用，都是无法简单直接地被归集到哪一个产品下面，都需要经过非常细致的区分，才能归集准确。在这种情况下，一笔费用发生了，就必须通过追溯是什么行为引发了它，是哪生产的驱动因素是什么，才能找到哪一个产品、哪一个项目该负担这个成本。


    # 宁向东


    最后，我要和你分享一个事实：中国企业的作业成本管理，是比较低的。很多企业一年忙到头，其实在很多客户的身上是不挣钱的，甚至是亏钱的。导致这种情况的原因是，你的成本管理水平比较低。ERP软件、财务软件里中面可能有ABC，也就是作业成本核算的部分，但是，企业不会用。所以，成本分不清，就不知道客户里哪个是好客户，哪个是坏客户。天天加班，经理、员工都累个半死，但根本没赚到钱。


    # 课后思考


