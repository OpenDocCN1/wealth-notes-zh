    \nSWOT分析框架, 请你一定要记住。我帮你罗列了一个思考程序, 可以先预个热, 后面我们还会细讲。\n\n![](img/3148dc16965f9a57e897fce984cfd348_150_0.png)\n\
    \n总之, 制定战略的逻辑和“打麻将”的过程有很多相似的地方, 都需要对环境、对手等等外部的东西进行分析, 也需要对自己手里的牌作评估, 作判断。然后, 再根据自己的愿望去作取舍、作出决断,\
