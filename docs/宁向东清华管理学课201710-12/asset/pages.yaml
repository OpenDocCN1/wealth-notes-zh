  md: "完整。比如，通过邮件的讨论方式，很容易因为大家彼此不见面而产生的距离感，导致沟通中的参与者更容易以自我为 本位，加大争议，有可能会拉长讨论时间，而且效果还不好。\n\
    \n我们一般都比较习惯用语言来进行沟通，表达自己的想法，因为随时可以看到对方的表情，可以控制自己的措辞和情感。但是，以冰冷的文字来代替它们的时候，就很容易引发.out歧义和误解。同时，当你无法即时看到对方表情的场合，我们就不知道话说到什么程度。比如，在面对面进行交流的时候，我们说了前一句话，看到对方的反应大约就明白后半句话该不该说，以及该怎么说。但在邮件的环境下则没有这样的交互过程，有时会一股脑把自己想说的话都说了，或者因为担心误解而不去说。\n\
    \n我前几天和朋友聊起这个问题的 时候，他们还讲了另外一个要点，也很有意思。如果是熟悉的同事，使用网络一般会直来直去，但如果不熟悉的同事，往住就会去猜一猜对方到底是个什么样的人。所以，有人建议应该为邮件讨论规定一个格式，以避免不必要的误会，这是很有道理的。\n\
    \n**宁向东**\n\n不过，无论有多少问题在，未来的会议交流一定会更充分地使用互联网。我觉得用不了十年，当80后这一代彻底成为社会中坚的时候，会议的形式一定会发生大变化，所以，我建议你未雨绸缪，早作准备。不过，如果你是领导者，你也一定要知道，使用互联网是为了解放人们的，而不是为了给人增加更多负担。所以，请你一定要计算好，因为增加了互联网的交换环节，总的会议时间应该是大幅减少，而不是大幅增加的。\n\
