  md: '负的。什么意思？就是我一年赚一千万利润，在会计上是盈利的。但是，我用了价值两个亿的办公楼，如果这两个亿的办公楼用来出租，租金都不止一千万。你说，这个公司在为股东创造价值吗？所以，大多数企业都经不起这种经济成本的检验。李荣融做国资委主任的时候，给央企搞了个EVA考核，就试图通过经济手段来抑制企业的扩张。你占用国家的投资多，每100块钱，一年你要交给我5块5的回报。但这个门槛，对于很多企业，还是很难跨越的。


