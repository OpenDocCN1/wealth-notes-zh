  md: '# 120讲：购后管理 | 忠诚度从何而来


    你好，欢迎回到《宁向东的清华管理学课》。


    昨天我们讲了通过数字驱动生意的逻辑，也讲了一些即将流行的岗位。这很可能会让你立刻联想到自己的工作。十年之前，当你现在网上买了一件商品时，商家经常会根根据你的有限信息立刻向你推送商品。比如，在你的购物界面上，会感性地出现一个折扣券来绑定另外的商品。而现在，则会单独为了你的购物界面，做出“猜你喜2.
    购后冲突1.120讲：购后管理 | 度从何而来的介绍


    购 1.购后冲突购


    在消费者行为学中，有一个专门的词汇，叫作“购后冲突”。什么意思呢？可能是有人在完成购买之后，在使用之前，就会对自己的购买决策不是那么满意，会出现某种不安，会产生反悔之心。这就是所谓的“购后冲突”，绝大多数人都在购物过程中都有过类似的感受。那么，问题厂商将如何对这个重要的客户群象进行


    +   1. 就是要不那么强烈地推荐购物物，因为在不确定是否有效是否消费者需要的前提下，过度销售实际上是违反客户利益广而说的，这个信任，在未来商业活动中是最重要的东西；


    +   2. 就是需要允许客户无理由退货。


    允许客户无理由退货，固然可以增加消费者对商家的满意度，但是，也会导致很多道德风险问题。上个世纪90年代，我有一次出国，我才知道在中国留学生中有一些是喜欢到那些大超市去“偷东西”的。什么意思呢，是在確定要购买那个品牌之后，就去超市拿一个，反正在一个月之内，按照商店的政策，你是可以随意退货的。


    我 记得 我的 第一台电视机，是 想在 Kmart® 买。 因为 当时 没钱，就想 在 Maxent® 的 “打折”再 买，以省 便 宜 点钱， 先 去 看一看
    有一台 电视 就，然后， 再约 在10天3到4 周 就之前 电视 到了，到 Kmart®的 退货 台，原价 退款， 相当于 白看 了 一个 月 电视。


    在一个时代的中国，退货不是质量问题，一般不会给消费者退货，但是，如果是因为质量问题给消费者退货，也要费半天功夫，而 Kmart®的退货政策就显得简单，不压理由，就是一个月之内不管什么


    况。现在，商家有学生太信任、借款方信任，所以，商家如果有无理由退款，一定会有这样的道德风险问题。


    现在，商家已经变得很聪明了，他们一方面动用各种手段反欺诈，另一方面又允许客户退货，只是为了防止退货退货，比退货条件设定得比较严格，退货时间也缩得很短，不再像我在美国的情况：能做一个。我们现在的情况，就是几天。


    当然，在大件商品销售之后，聪明的厂商会打电话给客户，以指导客户使用，或者是事后回访的形式，购买者确实少购，让他们对自己的购买行为有一定的强化，还有些厂家会给最新购买的客户寄这些能够强化他们的正确选择，包括通过这种电话信件向正确选择，这都是为了强化你的正确感的影响行为。


    无论是主动打电话，还是被动用售后服务，来接待，会看到客户后沟通，化瘀顾客，已经成了获取客户满意度的关键环，这也是今天要讲的重点内容。甚至，聪明的商家还会在这个过程中，发现和改变你的认知。比如，NIKE公司就由设计师球运动员发的一些细节，然后，设计师景观，发现运动员身上有一个球员外观察在“系”上鞋带的那个时刻获得的心理感觉，就像一样，在比之刻后引导买这些事的感受一样，所以，后来的品设计故意让客户获得一种仪式感的享受。


    2.杰尼亚的客户关系管理


    我下面和你们分享的文章来自欧洲管理学院一位教授的论文。这篇文章是一篇十年前的旧文章，谈了杰尼亚的客户关系管理，很大的篇幅就是杰尼亚的购后管理，杰尼亚是意大利著名的奢侈品企业，它的男装品位之高，冠绝全球。在很多名人的经营策略不同，杰尼亚不是做好广告，吸引客户来购买，而是购买者管理系统来邀请客户，根据客户的偏爱来设计产品，甚至设计客户购物环境。这篇文章给人最大的启示在于：客户关系建设，其实都是从购后开始的，有效的购后管理，不仅是为了保证已经出售的产品可以得到有效的使用，更是企业走向未来更高管理水平的起点。


    做男装，做 好了 非常 容易， 男人 的 口 味 很 单调，又复杂，所以，男装要 做好 异 化，不容易。 杰 尼亚 是 标杆 性 的 男装 品 牌， 经营
    更加 不 容易。 所以， 在新 世纪 的 初期 几 年， 杰 尼亚 的 业绩 呈 下滑 的 态势， 后来 管理层 就 是 靠 着 客户 管理 系统 所 提供
    的 数字来 改善 经营 策略， 逐渐 走出 了 低谷。


    杰 尼亚 的 购 后 管理 已 经 到 了 哪 样 的 境 界呢？ 在 十 年前， 杰 尼 亚 就 已 经 给 它 的 客 户 只要在 它 的 客 户 管
    理 系 统 里 面 留 下 信息， 你在 全 世 界 任何 一个 地 点 买 到 它 的 商 品， 当 地 的 店 员 就 会 告诉 你 有关 你 的 购
    物 信 息， 这 有 助 于 你 在 当 地 得 到 服 务。 同 时， 在 你 的 常 住 地， 你 会 得 到 针 对 你 的 买 衣 习 惯 所 奉
    来 的 产 品 信 息。


    那 么， 客 户 都 愿 意 留 下 信 息 吗？ 杰 尼 亚 的 客 户 都 是 高 端 客 户， 一 般 不 愿 意 透 露 自己的 资 料。 杰 尼
    亚 会 引 导 它 的 员 工， 他们 培 养 获 得 客 户 信 息 的 态 度， 也 就 是 根 据 你 在 周 的 商 店 中 所 做 的 现 行 销
    的 能 力， 有 信 任 的 基 础 上， 再 去 有 针 对 性、 有 节 制 的 征 取 数 据。 杰 尼 亚 对 于 能 够 获 得 客 户 数 据
    的 店 员， 有 业 绩 考 核 与 奖 励 的 制 度， 但是， 对于 故意 造 假 数 据 的 店 员， 则 坚决 予 以 开除。


    3. 用 好 你的 “小 数据”


    我 今天 的 课 特 意 选 了 杰 尼 亚 的 案 例， 而且 我 告 诉 你， 这 个 故 事 是 发 生 在 十 年 前 的。 你 也 许 马 上 就
    会 想到： 难 道 老 师 不 嫌 这个 故 事 旧 吗？ 我 告 诉 你 今 天 和 你 们 分 享 的 一个 新 案 例。 昨 天， 我 们 讲 了 数
    字 驱 动 商 业， 讲 了 最 新 的 东 西， 你 听 着 有 所 惊 艳。 为 什 么？ 过 去 你 对 于 你 听 说， 有 所 额 的 信 息 量，
    有 新的 名 词， 比 如 数 据， 比 如 微 数 据， 就 有 一 种 新 的 感 觉。 等 等， 但 是， 你 得 到 可 以 落 地 的 东 西 没
