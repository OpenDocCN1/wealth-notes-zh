    # 课后实践


    在商学院的课程架构里，有关理解客户需求、理解市场，并且由此为客户创造价值的学问，叫做“市场营销”(Marketing)。而其中，深入理解消费者的动机、意愿和行为，讨论消费者是如何对企业的商品和服务产生意识、产生判断、产生购买行为的学问，叫做“消费者行为学”。而讨论如何通过有效的人员行动，将产品和服务卖给客户的学问，叫做“销售管理”(Sales
    Management)。听完今天的课，如果最近有时间，你可以去一下附近的新华书店，跑到专门卖工商管理教科书的专柜前，大致翻翻不同书名的教材，用个半小时、一小时的。如果你真按照我说的做了，我觉得你大概在这个领域，就有了基本的概念。


    同样，你也会知道，在企业组织里面，负责一线销售工作的，比如我们说的地推，属于“销售”，而负责市场和客户整体规划的部门，就叫做“营销”。做营销和做销售，从职位上是两种不同类型的工作，但有一条是共同的，就是它们都要利用好“客户接触点”。


