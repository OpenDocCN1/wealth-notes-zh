  md: "就越高。2006年，夏普的全球第一条液晶8代线工厂开始批量生产；2009年，夏普又搞出了全球第一条液晶10代线，并批量生产。这就是著名的“堺工厂”，但这个“堺工厂”投资额实在太大了。一颗追求技术、炫酷、让人模仿的雄心，最后，彻底演砸了。\n\
    \n让夏普演砸了的原因，很重要的是，后边的人不模仿你了。你还在那按照自己的如意算盘鸣瑟呢，一回首，人没了。你以为人家要一直模仿你，人家觉得实在整不过你，人家就不跟你玩了。2009年，日本的永旺集团推出了32寸的液晶电视，价格在5万日元以下。而夏普同样的东西，价格要12万日元。这还怎么玩？所以，2012年9月，夏普迎来了公司创建100周年的纪念日，也爆出了3760亿日元的历史最高亏损额。\n\
    \n前面我们讲了，文化这个东西，要让人发展，它可以起大作用；同样，它也会搞死人，力量一样大。百年夏普的企业文化一旦形成了，你要让它转换企业经营风格，它不会，因为它长期已经习惯了靠技术吃饭，靠技术优势获得领先的地位。我们中国企业现在缺少技术，所以，我们听夏普的故事，就像听笑话一样。其实，好文化走过了，效果也不会好。这就是辩证的逻辑。\n\
