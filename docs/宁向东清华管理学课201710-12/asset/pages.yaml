    3. 组织如何保证既守住了规矩，又能鼓励人做事。


    当然，这是我理出的门道。不一定对。读书有趣的地方，就是同样的文字，不同的人，可以读出不同的味道。同一本书，不同的年龄，可以读出不同的味道。甚至不同的心情，感受也会不同。文字不会变，但你会变，所以，感受也会不一样。


    总之，学完今天的课，你大概可以知道一个企业组织随着时间的发展，需要作出哪些变化，以适应经营的需要。格雷纳的总结，有点简单，现在看还有点落伍，因为毕竟是50年前的东西了，但是，大逻辑都没有变。你用一个思路来看企业成长，我相信就不再是大海捞针，而是有了针对性。这是今天的课的意义。


