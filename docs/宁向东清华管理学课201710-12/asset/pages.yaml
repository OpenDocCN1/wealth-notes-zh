  md: '础和兴趣，然后再提出结论，效果才会好。


    比如，当你要告诉部下，因为业绩不够理想，奖金的数额要减少时，就绝对不能直接说出结论。因为你直接提出结论，沟通的对象会感到很突然，甚至会很负面地看待这个结论，认为完全不能接受。在这种沟通中，就应该先铺垫背景，最后再提出结论。


    还有一个关于“表达”的认识误区，就是沟通都必须要结果。在很多情况下，审时度势的结果，就是在沟通中即时判断出，这一次沟通应该不可能达到预想结果了，在这种情况下，核心问题就是如何巧妙地结束这一次沟通，并为下一次沟通留下一个比较有利的情境。所以，有时要学会放弃，要学会顾左右而言他。我以前在同学的留言中，看到了一些留言都是讲领导不表态，或者对于领导行为的不理解。我从留言的描述来分析，很多都属于领导认为这件事目前解决起来还不成熟。听了今天的课，你以后应该多一个心眼，领导也不傻，他不接你的招，或者是直接装傻的时候，一定是他当下不准备碰这件事。


    # 5.动作


    ![](img/3148dc16965f9a57e897fce984cfd348_60_0.png)


    最后一个词，叫做“动作”，就是请你多注意沟通中别人的身体语言，你要学会把别人的身体语言和他们的话结合起来，看他们的沟通内容。同时，你也要学会使用你的身体语言来帮助你，达到更好的沟通效果。研究表明，像微笑、凝视对方的眼睛等面部语言，还有语调，可以在两个人的沟通中达到90%的沟通效果。


    今天的课中，讲了与沟通过程控制的五个词，分别是“倾听”，“审势”，“他人”，“表达”，“动作”，希望对对你有帮助。


