    \ 所得出的指导原则, 就是战略。\n\n有清晰的战略, 对于一个玩家来说, 非常重要。因为一旦这个大原则定了, 后面的行动, 每一招、每一式怎么弄, 也就都清楚了。这就可以保持我们昨天说的:\
