- pgno: 144
  md: '个方向走，是非常重要的。我们在这个模块中讨论了“固定成本”和“变动成本”的结构关系，也讨论了“直接成本”和“间接成本”之间的结构关系。我希望能够给你一些启示。比如，对于主要以人力资源为主的企业，你是绝对不能走低价格路线的。你的成本结构决定，如果你靠低价竞争，最后只能是死路一条。


    我们在这个模块比较细致地介绍了作业成本核算的方法。很多企业是因为计算成本的公式落后了，所以，从一些客户身上辛苦赚来的利润，在服务另外一些客户的时候，都和一些看不见的方式流失掉了。所以，对于间接成本比较高的企业，需要通过作业成本分析来对待客户，进行合理的客户成本分配。甄别到对客户的的能力，是企业重要的竞争能力，也是企业盈利的重要来源。


    +   126讲： 成本：财务、经营的基础

    127讲： 成本结构！其实原本最可伯

    128讲： 作业成本法！你真的赚钱了么？

    129讲： 穿透成本 | 管理领域的革命

    130讲： 甄别管理 | 客户不都是上帝


    # 6.盈利


    服务客户的最终的，还是盈利。


    企业是商业性机构，服务客户的最终目的，还是为了盈利。利润等于收入减去成本，而收入是等于价格，价格乘以数量，定价是企业追求盈利的重要手段。企业给产品和服务进行定价，思考的出发点有三个：


    +   1、是从竞争对手出发。如果企业的产品和服务有类似的产品，你只能采取“竞争对手定价法”，根据对手产品的性价比来确定自己的产品给价。所以，这就是为什么我在前面强调要走差异化的道路；


    2、是基于自己的成本来定价，这对成本有优势的企业，是一种可行的方式；


    3、就是基于客户的需求满足程度来定价。这是定价的最高境界，叫做“客户需求定价法”。


    你还要知道，当你的价格确定了之后，客户的需求量会因为你的定价发生变化，价格高并不一定是盈利，要素有价格、销量和成本这三个盈利。请你记住：企业追求的目标，不是最贵、不是最多，而是利润最大化。这跟面的更多细节，我们后面的模块会继续讨论。


    今天下课前，我多我几句活。二十年前，最好的报纸之一是《经济观察报》，我很喜欢读。在这份报纸中，最好玩的内容是那些社会分析、宏观分析。但我最后有内容是，产业分析和企业分析。后者和我的专业很近。每次，报纸买回来，我都是把最有用的内容从报纸中拿出来、收藏起来，然后，看那些最好玩的内容。方法的一段时间，我突然发现了这种现象过法的大弊病，就是一段时间下来，我看了很多好玩的内容，而那些最有用的内容，收藏了，反而没太注意看。所以，如果你听了音频有启发，周末可以抽时间看看文稿，整合一下。


    +   131讲： 定价方法 | 星巴克凭什么那么贵

    132讲： 差异定价 | 各种套餐的组合拳

    133讲： 保留价格 | 商家的花花开子

    134讲： 补贴与盈利 | 为什么会免费？


    # 划重点


    +   1.企业的目标：满足客户需要，同时有利可图。


    2.了解客户的方法：多渠道，多形式，讲实效。


    3.企业应该是独特的，独特性体现为战略。


    4.客服化是趋势，接触点是战场。


    5.盈利的前提，是要算清你的成本。


    6.服务客户的最终目的，还是盈利。'
