    # 模块6. 企业文化与沟通


    ![](img/3148dc16965f9a57e897fce984cfd348_90_0.png)


    096讲：企业文化 | 员工的心，企业的智，老板的行


    企业文化能不能起到效果，不是看你说什么，而是看领导做什么、怎么做。要看领导者行为背后传递出怎样的价值观。


    换句话说：


    +   1. 企业文化就是老板文化，就是制度文化；


