  md: '# 本周复盘 | 追问：管理的技术


    本周复盘|追问：管理的技术


    你好，又到周末，我对这周的课进行复盘。


    这周的课，从一个叫做“愿景”的概念开始。战略管理，本质上是为了找到一个指导思想，可以保证一个团队，甚至是一个人，在一段时间里面的行动可以保持连贯，不因为人的行动可以彼此协调。所以，取得愿景的成功，非常重要。


    愿景要与外部环境、内部资源能力相协调。所以，在框架上我这周的课，是基于所谓的“SWOT”分析：看路表来进入了设计。后端的WOT分析，尽管我对这种设计本身的简单性也表示“不服”，但是，作为初学者的思考路径，我觉得SWOT分析，还是最有价值的。所以，课程还是按照这种基本套路来安排。


    我这里多说一句，等你们以后有机会学到高级的战略管理课程时，你就会会记SWOT，忘记PSTEL模型，忘记五力模型。提提这些框架中相互信息的，成为了每天复盘中朋友们之间的信息搜索框架。如果在头脑中形成了这样一个框架，每天遇到不同的信息，你知道把它放在不同的框架中，你就厉害了。


    外部环境分析的结果，是希望找到“机会”或“威胁”。SWOT分析中的O和T，我们于机会中威胁这两个概念。这一周我们主要集中讨论过外部环境，从宏观到产业、产业到竞争对手，一点点聚焦。


    下周五我们讨论“内部资源”。下周五的课，我们再把这两周的课加以汇总，形成一个基于愿景、内外部分析的逻辑框架。


    # 复习：追问的技术


    下面，我和你说两件补充性的事，挺重要。


    第一，有同学问，五力分析最后如何得到一个结论？我建议你看，这个周末复习一下“画表格”这种方法。在可以用来看，分析供应商每个方面的压力和威胁。


    如果用1到10分来打分，你能不能告诉我，你能给供应商打几分？你为什么给5分，那么供应商，我要问我？，你为什么给供应商打8分？你是根什么打的？为了回答这个问题，我带你准备了一个表格，表格中，表格里面的内容是事例，你可以根据自己的具体情况来选择题。


    | 供应商的压力评估 | 权重 | 评分 | 加权评分 |

    | --- | --- | --- | --- |

    | 1.供应商数量 | 20% | 2 | 0.4 |

    | 2.转换供应商的成本 | 30% | 7 | 2.1 |

    | 3. | ... | ... | ... |

    | 加权得分 | | | 5 |


    复习：Q3设计：请评评一个提高影响力的供应商工具：管理工坊No.1


    得了5分，可以说供应商给你的压力是中等的。但是，如果评价问题提得合适，你会发现你的转换供应商压力的方差，是很大的，也就就是转换供应商的程度，是你下一步管理上要去关注的重点。


    这些方法的训练，有一定的技术性。前几天，有同学在后台留言问我，我今天去稍微回答一下，希望能够带给你启示。


    第二，就是关于课程的事。我的课程是一周更新一次。所以，问题表一直在变，体系架构，主要内容，都没有变，但标准和顺序，以及讲解的繁简度，会根据同学的后台留言作调整。我们内容上花的精力比较多，课程更有更新表示歉意。一方面，给学员带来不便，我要表示歉意；另一方面，请你从今天开始不要过分关注这个课程，多关注每天的内容。


    记住：打开管理学的基本功，是你的目标，也是我的目标。


    # ——一周留言精选——


    来自：蔡沁宇


    经常有人提小公司不需要战略，这简直是对战略的大误解。任何公司发展的过程中都需要战略，只是想要成为怎样的公司，该往哪里去，想想怎么做，分析是适用的，无非是针对大小公司，小公司优势不明显，大势太大，越是在这样的情况下，越需要认清现实，快速出招。


    来自：壮土行


    之前的“识别机会窗口”一课，提到沃尔玛利用卫星技术的故事，思考的是沃尔玛的打法。我自己在思考PESTEL的六个趋势，但还要提醒自己：如果自己占比还较小，就听大伏大快。大火上有潮流，有精力分析PESTEL。后面顺潮流而进，小头头如果确实想证明自己的能量，一点也不是没看，最后可能会大浪淘沙。关键是应该是看潮流，顺着潮流走，一边壮大自己。


    来自：贸建明 | 明心悟


    文中提到Hyde曲线，符合事物发展模式上升的逻辑，找了一点素材，分享一下。技术成熟度曲线，又叫技术S曲线、羊刀线，作为周期等，是企业和资本市场，根据技术的可能性，利用时间和市场的炒作热度决定要不要使用或跟进的一种工具。新技术的成熟度过程，一般为五个阶段：科技诞生的突涨点，过高期望的峰值，泡沫化的低谷期，稳步爬升的觉醒，实用性的新高峰。罗曼老先生说VR技术普遍应用。判断新技术的应用，通常需要三代才普及型，被大众广泛应用于，比如操作系、智能手机、大汽车等。


    来自：丸子


    之前罗曼说过的一篇商业战场，说的就是第五个模型里的预言。我5年开始研发一种实物，预言是2035500年。那一年，张阿姨App每天下午5点会卖Zara的衣服，还是送一个她买了喜欢的玩具素？
    显然各有意义，一是在这是商品交易都在同一个平台竞争。经常有人说，未来的商业模式，是一个跨界打群架的时代。这不是世界，外行来做更专业的事儿，而且所有行业都被同一个战略里搅。虽然这个需要考虑不仅不是自己为一个人经营家，需要考虑的不仅不是自己为一个人经营，更多的是考度的是竞争战略上竞争，这个又回到了竞争者是谁。一个客户模型？满足客户最深层次的价值主张和购物体验显得尤为重要。


    来自：南疆北疆


    个人的竞争对手，不是和你竞争的数据、人工智能也是未来的竞争对象。但是如果你会用大数据、人工智能，这些新技术也会变得竞争对象，是会协同作业。新数据伙伴，大数据、人工智能也是伙伴。谁未来5年的对手？


    Gartner 网络 -- 国际研究暨顾问机构Gartner 表示，在2020年将有180万个岗位被人工智能取代，但在此同时，人工智能也制造230万人工作机会，带动整体工作机会的繁荣。人工智能影响的工数数将因产业而异。2019年，医疗与育婴的机会将持续；制造业则会被大量汰换。2022年起，人工智能所造的工数将超过230万个。Gartner将2025年新增就业机会数订为200万。Gartner对人工智能冲击职场所作的其推测算，是在2022年，以非例外工作5人中的工作总量中，每5人就有1人将职人工智能能完成。


    由上述信息得知，要与现在的伙伴做一起迈向技术的成长，一起迈向的同行者是自己的技术目标，而真正的竞争对手是正走向新职业的人。


    来自：小朱同学


    今天的课后问题的思考度很佩服，可只模小门当竞争对手去想分析。我们公司规模大，没有竞争者，可以分析。但对于这个行业，我突然意识到组织变革之后，内部的竞争大于外部的竞争，了解题之后，解后此文，甚至以访谈。《翻阅到（第053讲，团队访谈笔记与世界咖啡吧》，于老师就“所谓知己知彼而所谓掌握的信息层面，找到事物的相互联系，形成一个对一个人，一件事情认识为什么大家都会认知，因为有了解。'
