    宁老师早上好！我在大学里是学"市场营销"专业的，从中也学习过4P和4C的经典理论。不过当时在上学期间没有工作经验，没能完全明白这个词语背后的意思。直到今天工作了近十年，有了沉淀，听您再次系统地提起这些，我感同身接地理解了这两个理论。从4P到4C，简单地看就是企业的重点是从先前的关注产品、价格、渠道和促销（关注企业自身），过渡到或者说升级到关注客户的满意度、交易成本、便利性和沟通效果（关注客户本身）。其实，这个升级就恰当地反应了由过去的"卖方市场"转化为现在的"买方市场"。由福特时代的"不管你喜欢什么颜色的汽车，我只生产黑色的"，简单粗暴地不顾客户的需求，到现在的"你想要什么颜色的汽车，我都可以满足你！"的贴心的个性化的定制！从中也可以看出，市场的各品牌的竞争越来越激烈。品牌越来越多，产品供给也就越多，我们作为客户的发言权也就越来越有分量！


