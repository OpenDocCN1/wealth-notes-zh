  md: '# 099讲: 文化载体 | 让公司里充满故事


    ![](img/3148dc16965f9a57e897fce984cfd348_43_0.png)


    你好，欢迎来到《宁向东的清华管理课》。


    今天我们讨论的话题，是如何找到一种有效的载体，把组织的文化固化下来，传播起来，弘扬开来。我们常常看到领导者，在各种会上说教，讲得绘声绘色，枯燥无味，就靠那些激励和知行合一。在员工中有荣誉感，或者公司中，员工在会议中在主席台上长篇大论的时候，究竟说
    了些什？很难做到。因为真正能够 流传下来的，是些故事。所以，有明的领导者知道，公司的价值观，公司的历史，必须要 有故事来承载。一个好公司，必须要有故事。


    # 1.最好的文化载体：故事


    其实，每一个公司，都会有很多先进事迹。这些事迹，反映了公司文化，公司的价值观。但很少有公司会设立一个“首席故事官”，负责管理这些故事，让它们具有传播性。你还记得顺丰的快递小哥受欺负的故事吗？一位小哥在给客户提供服务的时候，受到了一个小哥的欺负，而小哥不仅
    为小哥主持了公道，而且在 上的 时候，王卫还着这位小哥去 上。这就是一家好公司。这个如果做好了，可以讲很多年。顾宇内的员工 会讲，进公司的 故事，大家余饭
    后也讲。有了，在这个故事描迹，顺乎可以在任何时间、任何人讲：我们的企业文化是“爱民”，都真有可信。


    关于讲故事的厉害，我作为了教育职业，是最能理解的，我在学校 授课，一天的课程，学生所能记住的，其实没多少东西，就是我，有几个所谓的金句和几段故事。而那些你花了气力，大讲特讲的是什么重要的
    原理啊，知识点啊，同学基本上一听就懂，听过就忘。所以，在学校里教知识，就必须 要有作业，要有考试，这是学习的姿势。而有了作业，有环境，没有学训的 姿势，就没有
    的 姿势，没有 大 多数人都不会真正学到那些必须记牢的东西的。


    不过，企业文化建设可不是教知识，而 而是在那么大的的人群里面讲故事，所以， 故事是最有效的载体，进行故事，是最好 的方法。如果能够把价值有效地高于故事之 中，文化建设就会事半功倍。


    # 2.案例：三个好故事


    我下面给你几个好故事的例子，每一个故事，都是人一想到这家公司，会让人 先想到的故事。


    第一个故事是关于耐克公司。最近，正在流行一本耐克的创始人菲尔·奈特的自传《Shoe Dog》，中文版译作《鞋狗》。也许你在读这本书，或者你有本个标志性的人物。有一大早上，一位田径教练看到了早餐盘中的华夫饼，立刻一跃而起，到到车库，然后，把乳狗倒入了教练太大的华夫模具，这就是世界上第一双更轻便，也更轻实的跑鞋。这位教练就是俄勒冈大学的田径教练，他的联合创始人鲍尔·华菲，是《Shoe
    Dog》的作者联合创始人当时是鲍尔· 曼指导的中长跑队的队员，他们联合创立了耐克公司。


    这个故事，是经过精心加工过的。它好听， 也好看，非常利于反复传播。所以，无论是 对于顾客，还是对于员工，这个故事都有极强的感染力，宣传了一种“把灵感和创新带给每一位运动运动员”的理念。


    ![](img/3148dc16965f9a57e897fce984cfd348_43_1.png)


    延伸阅读：《你的两个里程碑》


    第二个故事，是关于王品台牛排故事的。1992年，戴胜创立公司的时候，为了防止员工舞弊，规定员工可以利用公司账户 100元以内的私人礼品。有一天，一个员工 去银行办事，接受了银行职员送她的一包
    牛肉干，回到公司会报，大家，大家都 没吃饭。后来，主管上台报告，王品集团的高管层里开了三个小时的会议，决定开始 接受牛排干和牛肉干。这个故事，好听， 好记，牛好记，也有竞争力，很多员工都记住了，王品集团的100元
    区线 变得真实可指。


    ![](img/3148dc16965f9a57e897fce984cfd348_43_2.png)


    第三个故事，来自于好市多，COSTCO。据说当年在好市多的超市里，卖着卡尔尔斯 美因的牛肉饼。当时的价格是29.99美元。 后来，公司买了 另外一个同样的牛肉饼，由于采购的大，成本
    低，比如好市多维持市场价格。继续卖29.99美元， 全 美卖出去，没有问 题。因为当时正是 牛排风靡一世的时候，而且它的竞争 手也卖相同的 价格。


    但是，好市多当时对客户承诺的加价策略是：最高幅度不能超过14%。如果按照 14%增加，这批牛肉饼就只能卖到22.99美 元。其实，客户是不知道更换供应商的，卖
    29.99美元没有任何问题。但是，好市多还是 履行了对客户的承诺，每一条 牛饼 售 卖17美元，总体上少赚72800万美元。这是 关于好市多，承诺 的少故事，它
    多故事讲得好，每次来到 COSTCO 这个品 的时候，都会想到这个故事。


    # 3.公司要精心筛选故事


    你知临希南是哪里听到许多好故事的？是我给西南航空管理学院管理的专业课堂，上， 和同组学员进行讨论的时候，还听到了其它的故事，所以，就形成了关于好故事的良好印象。这就是故事之于好故事，
    好生动，好记。教师们，特别是看名 的教授们 愿意用它来作佐证，胜过无数 花大钱 的广告。


    所以，好公司要做的，就是要精心筛选故事，把故事的架构搭好，让它便于口碑传播。 同时，要保证这些故事的背后，都会公司 要内外的，非常有趣的文化观 念。


    请记住，人类是有人八卦需求的，不过八卦的，喜欢 的，让 故事承载，公司要用好这种八卦的渠道，让故事承载着 公司的文化理念，在公司内部，或者外部，一 代一代地人向下传达。


    传递公司故事的一个重要载体，就是公司的内部刊物。我 公司过公司刊物，礼品 里都会有一些 公司的内部刊物，像天刊 物，我在酒店前 留 的， 折抵 了。因为 这些刊物没有
    在发行的情况。很多公司 都会安排专门 人 手去编辑内部刊物，有 专门的预算，占用了 少 人 资 源 和 它 资源，但效果很差，文字才 或 性 极差，缺少 生动的故事，没人
    愿意看。


    说到这里，我必须 回到我们已经讲了天 的美国 西南航空。在公司，办好刊物，被视为是最 的事情。所以，公司 专门 的人 对 公司 写。稿子不管是谁 写的，负责
    可 读 性， 大家都 它 都 是 具有 初中 水平，就会 读得 懂，并且 愿意 的 东西， 可 读性 不 能 写 出 来。 让 每个 员 工到 内 里 能
    有 故 事 讲 出 来，都 能记 住 内 刊 中 讲 的 事 情 和 理 解，是 西南航空 的一 个 重 要 工 作。我 和 你 分 享 这 一 点，希 望
    能 给 你 一 些 启 发。


    课听到这里，你是否觉得你的组织里面，也需要有好的故事呢？我相信，答案应该是肯定的。那么，接着我想请想 一 个 我 前面 说 的“首 席 故 事 管 理 官
    是不 是 一 张 纸？那不是 呢， 就 该 这 位 官 员 故 事 管 理 官，我 指 出， 最适合 都 是 首 席 故 事 管 理 的 就 是 寻 找 老
    板。 寻 找 老 板 就 是 讲 故 事， 于 老 板 于 动 员 大 家 讲 故 事，让 故 事 传 递 出 积 极 的 理 念。


    # 4.讲故事有套路


