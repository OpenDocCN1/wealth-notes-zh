    | 原方法销售价 | 244.69 | 356.59 | 166.14 |\n| 原方法单位成本 | 211.69 | 305.59 | 127.8 |\n\
    \n# 3.作业成本法的意义\n\n不过，我必须强调，如果你听了我前面向的话，觉得作业成本法就是为了算准成本，那把这门学的意义看小了。你可以把我们前面讲过的不同算账重新分配顺序之后，下面讲到的各家公司发现什么？看完下面这一个表格，同时比照第一张表格，你会发现两个最简单的结论：\n\
