  md: '2. 由于核算方法不准确，在不同的部门之间，存在着一种看不见得产品交叉补贴。第一种产品和第二种产品的成本在原来的核算方式下，有了很大的高估，其实，它们并没有那么的低估。由于成本没有那么高，所以，它们的市场价格也不应该定那么高。这就是为什么，该企业的经营者发现，其它企业生产相同的产品可以将价格定得比较低，而这家企业却不敢轻易降价，因为算下来的“成本”摆在那里，销售团队在市场上承受着很大的压力。


    而对于第三种产品，由于在传统的核算方法下，成本有很大的低估，所以，虽然每生产一件产品，实际上把第一件和第二件产品挣回来的钱，全部散出去了，但却没有人能够看出来是成本核算方面的原因。


    # 4. 正在进行的管理革命


    发明“作业成本法”的管理学家，叫做卡普兰。这位大师级的学者，还有另外一个重要的创造，就是“平衡记分卡”，我们后面的课程会讲。卡普兰提出“作业成本法”的时间点，是在上个世纪的八、九十年代，当时的背景是美国的制造业被日本全面攻击，而卡普兰发现美国制造业处在劣势地位的根本一大部分原因，是因为企业的成本核算制度不准确，导致了资源配置上的错配。


    ![](img/3148dc16965f9a57e897fce984cfd348_127_0.png)


    卡普兰为此写了大量的论文，后来又出版了《成本与动因》、《时间驱动的作业成本法》等书，掀起了一场成本核算领域，也是管理领域的大革命。这场革命至今其实都没有结束。不过，以制造为立身之本的中国企业，很多企业管理的领导者至今还不知道“作业成本法”，更不用说有针对性地使用了，这不能不说是一种悲哀。


    坦率地说，在很多企业里面，由于成本核算的问题很大，很多业务部门都不愿意相信财务部提供的数据，因为你总是感觉什么地方不对。但是，是什地方不对呢？业务部门又不容易从财务数字上将之说清楚。这种情况长期存在，直接导致了业务部门之间的冲突，以及一线部门和后台部门之间的冲突。可是，因为企业最高领导者为核算方法没有认识，所以，单从一个局部无法解决这二问题，财务人员也没有改变核算方法的动力，因为主动提出这件事，就是给自己找事，得罪老板，可谁也不说。有一句话，我听得可能不对，中国企业里面明白人其实不少，但为什么组织的效率并不是那么高，就是因为等级和文
    化，事不关己，高高挂起。


