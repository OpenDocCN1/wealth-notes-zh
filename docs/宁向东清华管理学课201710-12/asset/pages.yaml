  md: "品、上架等等工作，一边卖货、一边补货，服务质量就会大打折扣。而且，店面里摆放很多杂物，客户的购物体验会很差，客户满意度这些东西都会下降。而7-ELEVEN现在的办法是，24小时营业，在晚间客人特别少的时候，由营业人员一方面照顾生意，一方面完成补货工作。显然，从成本上来考虑，没有比这更划算的事情了。\n\
    \n那么，我前面提到的超市能不能借鉴7-ELEVEN的模式呢？也搞个24小时营业呢？我觉得不行，因为它的成本结构和7-ELEVEN完全不同。不仅仅是固定成本与变动成本的比例不同，而且变动成本内部细项的比例也完全不同。于是，整体来学7-ELEVEN，它学不了，顶多可以搞一个夜间服务专区，模仿一下便利店里的模式。\n\
