  md: '作为制造企业，最难算清楚的就是成本，因此在定价的过程中会出现老师课上说的问题。而今天讲的免费，我想到了我们公司曾经和华为竞争过，华为为了在竞争中取胜，会免费为客户提供设备，而收益则是从后续的维护、配件等工作中获取，这也是扩展定价的一个思路。


