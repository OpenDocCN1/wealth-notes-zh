  md: '# 086讲：组织互赖|怎么看组织的水平


    ![](img/3148dc16965f9a57e897fce984cfd348_9_0.png)


    086讲：组织互赖｜怎么看组…


    等你，欢迎回到《宁向东的清华管理课》。


    今天我们讨论一个叫做“组织互赖”的概念。什么是组织互赖？往前再走一步说，就是组织内部的部门间关系。组织中不管有多少个部门，不同的业务单元，不管你用什么样的方式来联系它们，不管是矩阵式，还是事业部模式，但有一条是必须保证的，就是打一起，能够一起上，而且彼此之间配合的系数要好、要高，这就是我们专业上的术语叫做“互赖（interdependence）”。组织的互赖水平越高，它的战斗力就越强，组织的水平就越高。


    # 1. 三种互赖


    第一种，是并列型互赖。比如，我所在的清华大学经济管理学院，下面设有不同的系，每一个系都是一个相对独立的组织，系与系之间的关系是一种平行式的关系。各个系会共享一些资源，比如学生、教室、学院的品牌等等，但彼此之间是相互独立的，我们做销售，有时就不了解学国际部的朋友，打电话给我说是要找我，这到学院要成立一个，不同的学科，彼此间都处于一种无时甚至可以说“老死不相往来”，但不影响各自业务的完成，因为他们在技术上没有太多互赖的需求。


    第二种，是顺序型互赖。这就跟并列型互赖完全不用，前一个部门做得不好，后一个部门的成绩就会受到影响。比如，在学校里，招生、教学就收到些影响。但是招生做得不好，教学做再精，好东西的课程都难听人，教学就很难看。好质量的才，就业好卖，负责学生就业的部门，业绩也不会太好，这就是顺序互赖。


    讲到这里，我大概能够出来我要讲的点。如果一个组织是顺序型互赖程度比较高的，怎么能够创造出好的产出效果呢？还用商学院的例子，有时候都得拼，比如，你在招研究生的时候，如果是有学术型研究生，而组织安排多更多的讲师带；如果是职业型的研究生，也就需要MBA，就需要用人选的人的先生，毕业多年的杰校长看到过招生和教学的中节中，也就是在组织重构的一些要求，尽量往组织，往组织做结构，组织运作的安排上，尊重这种互赖关系，利用好这种互赖关系。


    第三种互赖，叫做“交互型互赖”。这种互赖需要每一个部门的工作，都需要和其它部门保持紧密的联系，否则就很难把工作做好，所以，各个部门之间高度协调，才能有效地完成工作目标。在大专院，专业院的研究部门，为企业定制的培训项目，都是交互型互赖的典型。需要一种高度强互配合的组织安排和制度设计。


    # 2. 通过“互赖”看组织构造


    到了这里，我们有了三种互赖的概念了，我们也就可以用互赖的眼光，去评价一个组织的架构设计和流程设计了。我们看组织的构造就相对高起来了。前几天的课，我开了一个概念，要务
    从组织图上考工作单元之间的关系的角度图上不同 有不同类型的组织结构。今天，我再把你 组织的构造往上一层一步；你要争强能够 判断 互赖关系，来看组织架构的水平。


    进入到一家新公司，如果你能够看出 它的组织结构不利于信息交互的，不是利于 大家合作完成工作目标的，是背后互赖关系 的还原的，看你 的水准就 高 了。如果 你能够
    提出解决方案了， 这是你具备一定管理水平的标志。你 一定知道 上面有多管 程的管理 公司，这 些公司的 任务 之一是帮助企业 进行组织 架构设计， 这些 年，
    他们 做过 很多组织 结构的 咨询 报告， 也 帮助 企业 做 组织 结构 的 设计， 但是， 很多 报告 并没有 从 互赖 的 角度 去 分析 ，而是 照抄了
    其它 公司 的 结构， 这个 水准 就 是 较 低的 。


    那么，什么样的咨询公司水平较高就是可以了呢？从单组织结构的维度看，一个的咨询顾问，首先，应该是有效解决分工和协调问题的。首先，是组织内部工序工 分 割 开
    ，这 是一个 基 础 性 工作。工作 单元 划分 一定要 强调 专业化。 组织 结构 不能有 前 的 地 支 持 专业 化 能 力， 组织 就 没 有 前
    的 。 其次， 在 分工 基础 的 基础 上 ， 能 够 解决 组织 构架 中 的 变 和 协 调 问题 ，是 咨询 报 告 水 平 高 的 第二 个 能
    力 。


    为什么今天的会花时间和你讲咨询公司的事情呢？因为组织架构设计的事情，是比专业深一些。企业的变革，往往需要不断调整企业的组织架构。我一直主张，最直接的情况，是企业会有一套自己的框架，自己做出方案，来解决问题。但是，这一点不容易做到。很多时候，由于企业碰到到问题，是新的问题，企业自己没
    法 设 计 新的 组织 架构 ， 企业 会 出 于 组织 架构 设 计 是 企业 最 需 要 顾 问 咨 询 公 司 来 帮 忙 的 重 要 领 域 。


    咨询顾问帮忙，有两个要点是管理者 必 须 注 意 的 ：


    第一，就是他给你的方案水平不够，很多咨询公司目前做的，就是在的公司面前谈半天，把你说的问题原原封的整理，再用专业的语言做成漂亮的PPT发给你，但是，他帮你提出的解决方案是靠用了
    标准 的 组织 架构， 对你 分 不 出 对 性 ，基 本 就 是 改 改 组 架 构 ，这 就 不 必 须 要 对 识别 的 。 今天 ， 我 和 你 分
    享 的 互赖 的 概念 ， 下一 次 你 也 许 会 用 到 。


    第二，咨询能 够 针 对 的 项 是 它 们 有 方 法 ， 但是 ， 你 不 能 给 针 对 性 的 方 法 了 。 不定 。 所以 ， 最 理 想 的
    解 决 办 法 ， 就 是 你 学 会 搭 建 支 一 支 内 部 的 顾 问 咨 询 方 法 的 人 。 比 如 ， 你 的 老 板 ， 你 要 记 住
    找 老 天 的 人 。 如 果 你 是 一 名 员 工 ， 或 者 基 层 管 理 者 ， 当 咨 询 公 司 进 入 到 企 业 重 组 之 后 ， 你
    对 他 访 问 说 ， 你 要 从 领 导 重 要 未 来 案 的 设 计 和 落 地 的 题 ， 这 也 许 对 你 的 职 业 生 涯 ， 是 一 个
    重 要 的 机 会 。


    # 3. 四个“有助于”


    前面讲到一个故事，有一家很有名的公司，十年前发展到一定规模，出现的问题都是他们 自 己 解决 不 了 的 ， 自 己 决 定 不 了 ， 一方 面 的 原
    因 是 管 理 的 专 业 化 能 力 不 足 ； 还 有 一 个 方 面 的 原 因 是 人 才 无 法 达 得 外 部 人 士 有 的 审 视 眼 光
    。 因 此 ， 你 身 为 部 人 ， 你 的 身 份 决 定 你 无 法 有 利 。 所 以 ， 这 家 公 司 提 出 了 外 部 的 咨 询 顾 问
    也 很 到 ， 他 们 也 请 了 IB 的 顾 问 团 队 。


    IBM是咨询顾问的后起之秀。首先，他们有 智 接 术 和 信 息 技 术 的 专 业 能 力 ； 其次 ，是 它 刚 好 赶 成 交 一 次 组 织 形 态
    的 变 ： 从 安 定 设 备 供 应 商 ， 变 成 了 技 术 服 务 方 案 的 提 供 商 。 所 以 ， 他 也 有 自 己 的 转 变 革 基
    金 ， 就 记 了 有 IBM 的 《 谁 改 不 走 的 新 局 》， 这 一 有 1 本 书 在 这 次 文 化 变 革 。 不 知 道 得 看 “每
    天 读 书 ”栏 目 有 没 有 这 本 书 ， 就 我 听 的 看 来 ， 有 很 多 学 者 找 人 解 读 这 一 下 ， 没 得 回 看 到 ， 不
