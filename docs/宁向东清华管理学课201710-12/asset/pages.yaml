  md: '# 2017最后一天请问问自己


    ![](img/3148dc16965f9a57e897fce984cfd348_169_0.png)


    2017最后一天请问问自己


    你好，马上跨年了，祝你新的一年一切顺利。


    又到周末，我们对课程做下简单的总结。


    这周的课，**我们在讨论企业的内部分析方面，讨论的重要概念包括资源、能力、核心概念、核心竞争力。我对你介绍了价值链的概念。也介绍了一个VRIO的分析框架。**这一周的复盘，我不再帮你做内容上的梳理，我希望你建立一点对于自身业务宏观上的认识。


    到了年底了，很多企业赚了钱，一些企业也挣扎在保本和亏损的边境。一年刚好是一个周期，是一个可以回顾一下，盘盘下一个自己，问问想未来的时候的时钟。我建议你可以从下方面，综合想一想自己的企业，自己的业务，甚至，想想自己。


    接下来，是一个**清单**。首先，**我们想想客户**。其次，**我们想想花点时间想想自己**，**想想我们的能力**，想想未来。


    # 1.关于客户，请问自己：


    企业经营，说到底，是**以客户为中心的**。所以，**我们先分析自己是不是拥有足够多的、可以带来更多稳定收益的客户**。关于客户，你可以通过询问自己以下问题来看得更清楚：


    +   1. 你了解你的客户吗？他们在这1年，情况变好了，还是坏了？

    2. 市场上已经有一点焦灼的味道，你是否够及时了解到你的情况？明年你是否建立了**对你的核心信息进行跟踪的方法？**

    3. 你客户是否有建立比较深入的接触度。如果你是否想去拜访客户，你准备和他们讨论些什么问题？这些问题对你会有什么帮助？

    4. 你是否需要进一步细分你的客户？是否需要用不同的**客户建立更有效、更优其好的经营模式？**

    5. 你可以通过怎样的方式建立好的客户关系，什么方法可以进一步提高客户忠诚度？

    6. 你有没有办法增加客户的转换成本，让他即使在困难的情况下，也离不开你？


    # 2.回过头思考自己：


    从客户分析的角度，**你再回过头来思考一下自己**。这一年，**你的核心业务怎么样？这些核心业务中，是不是具有独特的战略性的能力？你是不是具有这些能力提供产品和服务？**你也可以再自己6个问题：


    +   1. 你是不是做到了成本最低？

    2. 你是不是创造了独特、广泛的产品和服务功能？

    3. 你有没有明确的办法抢占竞争对手的市场份额？你是不是在通过增加利润将竞争对手拖垮的路上？

    4. 你渠道上的力量是不是在增强？

    5. 你是不是和一级业务大商建立了更加紧密的伙伴关系？你是不是拥有充足的资本？

    6. 你的战略性资产：资源关系、技术专利、商标和市场控制地位，是不是在增强？


    如果对这些**问题多数是否定的，** 你就要好好反思自己的业务了，可以说，**你没有多少竞争优势。** 你需要更好地去复习过去两周的课程。


    下一周，我们开始讨论一下市场竞争的方法，也叫**竞争战略**。


    # ——一周留言精选——


    # 来自：离河


    今天看完有很多疑问，本能的感受是理解上可能出现偏差，于是去搜索了一下，然后发现学术上的资源学派与能力学派中所提到的资源理论，跟通论之里理解的微妙的差别。 这是其一。两派均以独立发展又互相补充，经过众多大师的完善，那么既也不存在一个能力资源或者资源胜过能力的轻松理论。也不存在说两方抓什么都重要**的**“和稀泥”**的结论。
    这是其二。**


    我目前理解出来的关键逻辑：


    +   1. 两派都认为，**资源和能力对核心竞争力起作用，着眼点在于“持续竞争优势”的保持。**

    2. 资源学派从资源出发，核心能力也当做资源的一部分，资源和产业环境会影响能力的发挥。

    3. 能力学派从能力出发，认为企业内部环境决定了能力，能力影响对资源的配置。

    4. 所以问题的核心不在于资源和能力谁不影响谁，在于怎么影响，在传递和相互间机制是什么，**这是目前前沿是黑箱。**


    所以能力与资源两派的差异不在于上下之分，而是视角不同。就像看解开一个纠缠的线团，一方从头部开始解，一方从尾部开始，以共享单点：资源学派以客户比为用户群是独特的，需要占据最广大的用户偏好，是通过补足来抢占客户。能力学派**好认为运营才是关键，是通过改善客户体验，**
    获得比较优势，争取到客户。**从实际情况下，各种手段都被混合使用，** 所以实践比理论复杂。个体发展角度，欢文迪思典型的资源路线，通过占优优质资源出现了能力的杠杆突破，而能力又带来更多资源。**大众往往还是能力路线，通过专业能力培养获取资源，**
    并利用资源加资源，最后成为细分领域专家。


    现实意义：**1. 在特定阶段，** 一定有一方比另一方更重要，标准因人而异，要学会抓重点，或者制造重点。2矛盾总是相互转化，**生活不是辩论，** 不要抱着一个重要的结论不放。**3.
    结合更多现实意义时，要指出在抓住资源或能力的方向，比泛泛而谈更有价值。**


    # 来自：站在悬崖边缘


    邓亚萍丰富的退役后，从一个4个字母都不认不全的人到剑桥英语专业硕士毕业。**做事的关键不取决于你多学、多聪明、** 关键在于你**能调动周边的多少资源帮助你。**
    能力取决于经验，也可以说不同，两地的也不同。资源短缺时，比如创业初始，**资源和能力，** 资源表现在第一位。** 企业稳定了，能力要求就是显现出来，这时候资源多了，要警惕认真资源，调动资源的能力**就是第一位。同一时代，不同的企业和个人，**对资源和能力的配置要求不一样。不能一概而论，并不是资源和能力非要争个上下。才举警悟。**


    # 来自：青山罗刚


    所有的成功，都是资源和能力的相遇，二者缺一不可。而在不同的具体场景，**资源和能力的侧重不同**，从微软到特斯拉是90年代开创新，从云计算到特斯拉。那时候**以能力不需要的资源**摆在**“国家队”手里**，基本不需要的能力，顺势而为即可大胆做。但2000年以后，**新入买方市场**，市场领袖换座。一些建立了良好买方机制，**倡导团队合作**成立下的国企依然在中场中占据主导地位。同时，一些民营**企业依靠领导的眼界开拓能力，打通了企业命脉，占领了买方山岗。**
    资源和能力的匹配，是个和企业发展的关键。


    # 来自：学无止境


    昨天河河同学的发言很有见地，我深受启发。资源**能**力的辩证关系为我们提供了一个分析问题的独特视角，**由此出发，我们不妨也试着去发现一下，那么**对于看核心能力的是优势资源，**
    这些资源可以是老师列出的人才、技术，也可以是，甚至**是独有资源是获得核心竞争力的基础。"吃苦劳"这种**品质是成为个人的重要，** 例如在**他**的**本质中，**
    就给自己成功很大程度上归源于自己吃苦精神（他北大时候，聪明的同学就读一遍就懂，他读三遍还记不住的**同**学读**果**，**一起**和**去**，导致自己**没有出过任何人的努力，因此**这**个品**质**具有较**强的**连**接**性，会被**一些人**当做**核心**能力。**'
