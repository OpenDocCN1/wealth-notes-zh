- pgno: 28
  md: '办公场地。在没有办公场地的情况下，你还能创造出大开间才能有的效果，那你才是真的厉害。这标志着你的管理能力，可能已经超过了Zara。


    其实，办公室设计的核心就是要兼顾每个人“专心工作”的需要，同时也要兼顾大家一起交流讨论，“共同创造”的需要。我们现在已经适应了每人一个小格子的办公环境，这种办公环境比较有利于保护个人隐私，也有利于大家专心工作，但是，它的问题是对人会形成工作环境的局限。人进入那样一个场，就很容易封闭在一个特定的情境中，不利于取得突破性观念。


    如果把这些隔断拆掉又会如何呢？环境心理学研究表明，这又会导致工作节奏常常会被外界环境打乱，不利于专心工作。特别是那些对环境控制欲望比较强的人来说，这种开放的结构也不是最好的。


    ![](img/3148dc16965f9a57e897fce984cfd348_28_0.png)


    # ◆ 课后思考 ◆


    那么，如何想出更好的办法，设计出有效的办公室，兼顾两种不同的需要呢？这是今天的作业。我已经在一些公司看到了员工可以自己选座位，有些是开放的，有些是封闭的，有些是分区的，专门供特定项目组使用，而不是大家开会到会议室，干活自己回自己的工位。我觉得这样的探索也许对你有参考价值。


