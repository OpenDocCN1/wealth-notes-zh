  md: "达美乐租了纽约时代广场上那块最著名的广告屏，就在那张屏上实时滚动播出网友的各种批评，甚至谩骂。达美乐自始至终没有作任何解释，就是请大家出主意：第一，邀请大家献计献策、用手机参与到匹萨制作的过程；第二，请大家对匹萨的口感的改善献计献策。这种危机处理的态度和方式最后取得了意想不到的效果。最初公司的销售业绩一落千丈，但很多拒绝型的客户又渐渐地转变了态度，因为公司的坦诚而重新给予公司信任。所以，当年的业绩又呈现了恢复性的增长。\n\
    \n![](img/3148dc16965f9a57e897fce984cfd348_115_0.png)\n\n不过，2010年前后，达美乐还是陷入了成长的低谷。后来，为了彻底扭转这个局面，公司加大了科技力度和时尚因素，希望满足新时代用户的新的“价值主张”。比如，2011年开始，客户可以通过iPad定制专属于你自己的、口味独特的匹萨。2012年，公司在英国开始利用无人机送匹萨外卖。2015年，公司更是推出在匹萨车里面完成匹萨的最后加工，当年子把匹萨送到你手里的时候，就像匹萨刚出烤箱的样子，有更好的口感。就在前些天，我又听到公司应用人工智能（AI）来参与匹萨制作的消息。\n\
    \n![](img/3148dc16965f9a57e897fce984cfd348_115_1.png)\n\n总之，达美乐的案例告诉我们，作为商家，你一定要不断把握客户的价值主张，只有这样，才能不断地发掘客户，实现对于客户的转化，无论他们先前是准非顾客，还是拒绝型的顾客。\n\
    \n# 课后思考\n\n今天的课后，请你结合自己的工作，考虑一下哪些客户是准非客户、哪些客户是拒绝型的客户，他们拒绝的原因是什么，你明年通过什么办法可以对现状作出一点改善呢？\n\
    \n# 划重点\n\n+   1. 企业的非客户，可以分成三种人：准非顾客、拒绝型的非顾客、企业从未探知的客户。\n2. 作为商家，不断把握客户的价值主张，才能发掘客户，实现对客户的转化。\n\
    3. 达美乐被拉利用各种手段满足非客户的价值主张，成功实现对客户的转化。\n\n# 你正在学习的知识模块\n\n+   *   1. 人与行为\n    *\
