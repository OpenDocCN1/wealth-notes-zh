  md: '第二步，他就想有没有办法获得健康、安全的食材？他和供应商，乃至更上游的供应链形成一个怎样的关系？然后，他要通过怎样的安排，把这种关系透明地传递下去，可以让客户感受到其原料选择的健康和安全？这就是供应商分析加上客户分析。比如，最近他就在考虑让食客可以看到那些即将被烹饪的原料。


    第三步，也是他花费脑筋想得最多的，就是如何形成与现有竞争对手的区间。学生的餐厅叫“罗勒轻食”。我问他，“轻食”这两个字能够让他竞争对手面前更加凸显出独特性吗？学生说：差不多，我在不断充实“轻食”的含义。比如，他的每个菜都只有“三克油”，他说就是要像西餐中的色拉一样，做得健康。但他却是做中餐，除了健康，还要有营养，要有鱼有肉，要好吃。前几天，他发给我一个做菜的短视频，名字居然叫“长肉算我输”。当然，我的学生还做了如何防止新进入者和替代品的分析，因为涉及到商业秘密，我在这里就不多说了。


    总之，波特的五力分析是个很好用的工具。我的很多创业成功的学生，和正在创业的学生都在使用这个工具。所以，今天我反复推荐你要把这个框架记住。


    # 课后思考


    最近出了一件事，媒体狠狠地炒作了一番。这就是波特参与创立的咨询公司Monitor Group在2012年正式提出破产保护的申请，最后被德勤公司收购。媒体炒作的话题是战略大师，竟然保证不了自己的战略咨询公司的生存。所以，有人开始对波特的五力分析框架有所非议。比如，有人说波特的模型更多地是考虑企业和外部环境之间的对立关系，而现在的产业关系则更强调合作。还有人说，在当下的动态竞争环境中，五力模型过时了，五力分析很难满足动态竞争的需要。


    坦率地说，对此观念，我持保留态度。我认为五力模型作为一种思考问题的角度，它对我们的指导价值依然是很大的。


    今天的课后，我请你思考一下，对于你自己的企业，是否会出现你从来没有想到过的竞争对手呢？他们是来自于替代品，还是新进入者呢？他们会不会是你的供应商，或者客户呢？


    # 划重点


    +   1.  五力分析模型：威胁主要来自于五个方面：现有竞争对手的压力；替代品的压力；新进入者的压力；供应商的压力；来自于客户的压力。


    +   2.  下游企业一般都愿意选择几家上游企业来供货，上游企业也会努力让自己成为几家下游企业的战略供应商，这就是行业内的生态。


    +   3.  跨界会打破行业之间的界限，以前从来没有想过什么企业，有一天会突然成为你的竞争对手。


    # 你正在学习的知识模块


    管理与破局


    +   1.  人与行为


    +   2.  领导力


    +   3.  团队


