  md: '保持在高层的，这时候的组织就是一个“集权”的组织。后来，为了防止决策错误和管理 的低效率，就要向“授权”，把权利沿着不同的管理轴线下分下去。于是，渐渐的，组织下层得到的权利越来越多，组织就变成了一个“分权”的组织。


    总结：


    今天的课，我重点介绍了管理幅度和管理 层级的概念，它们是理解组织结构的核心 概念，请你一定要记住。最后再强调一次， 管理幅度受很多因素影响，比如，在下属 力强的组织里，管理幅度可能会因此而增
    大。


