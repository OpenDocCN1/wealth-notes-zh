  md: '要。因为一种核心资源、核心能力，是可以很快被人家学去，你的竞争优势就是暂时的。所以，普拉哈拉德在讨论核心竞争力的时候说，核心竞争力都是具有难以模仿性的，包括资源能力的建构过程，及其它与竞争优势之间的因果关系，不容易被说清楚，所以，竞争对手往钻偷不去，也学不会，所以，竞争优势可以持续很长一段时间。


    比如，我们前面讲的邓亚萍的核心能力，那是在很小的时候打打慢慢历练出来的，那个过程别人很难模仿。你说，我的孩子也可以很小就去打球，但你不是专业人士，人家邓亚萍的爸爸是专业出身。你说，我有钱，我可以请个专业教练。但那个教练，不是你孩子的爸爸，他就没有邓亚萍爸爸那么上心。所以，有时候我们说，龙生龙，凤生凤，其实背后是有一定道理的。


    VRIO 的最后一个字母 O，来自于 Organization，组织。对于核心资源和能力的发挥，组织是极其重要的。我的理解是，这种重要性来自于两个方面：


    +   1.  组织要对对它的那些独有资源有深刻的认识；

    2.  组织能够围绕着核心资源和核心能力进行布局，要能够把这些资源能力转化成竞争优势。


    举个例子，如果中国男篮知道姚明是最核心的资源，有着最核心的能力，但是，大家都不能配合他，没有后卫给他做球，他能够发挥作用吗？其实，中国的好多企业，不是没有好东西，也不是没有优秀的人，而是没有让他们发挥作用的组织保证和组织氛围。如果再碰上一个特别自恋的领导，就像《水浒传》中的王伦一样，始终要把聚光灯照在自己一个人身上，这个组织要想有前途，恐怕也难。


    ![](img/3148dc16965f9a57e897fce984cfd348_166_0.png)


    # ◆— 课后思考 —◆


    今天的课，我们讲了要用画价值链的方法去清理企业的每一个环节，要争取能够找出最核心的资源和能力。同时，我们也介绍了核心能力和竞争优势的关系，只有在 VRIO
    四个方面都能得到好答案的资源，才会为企业带来竞争优势。


    今天的课后练习，我在前面说过了，你还记得吗？我是故意这样做的，就是希望通过这个安排，让你自己判断一下听课效果。如果没记住，你真的要反思一下自己的学习方式了。


