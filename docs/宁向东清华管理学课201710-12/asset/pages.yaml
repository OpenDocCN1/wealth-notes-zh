  md: '其实，在Consult的情况下，讲话的人一定要意识到自己的信息不足。我这里给你一个提示，一个单位的领导者之所以组织座谈会，或者在讲话之后留下比较多的提问答疑环节和讨论环节，多数情况下都是信息不足领导者已经意识到，他所拥有的信息，不足以作一个果断的、有效的决策了。在这样的环境下，如果你位于下层，你的发言应该以贡献信息为主。但是，在公开场合讲话应该注意分寸、注意团结、注意不要把自己陷入不利的环境。可是，有些信息还是要提出，而且你还要有意愿参与这些讨论，如何处理好这里的微妙关系，是你需要留意把握的关键点。


    # 4. Join


    最后的一种情形，英文叫Join，可以翻译成“群策群议”。比如，在一家创业公司里面，绝大多数讨论其实都应该是这种类型的。无论大家的职位怎么样，每一个发言人都应该把自己定位成是一个参与者。为什么呢？因为，每一个讲话所参与者的信息都相当少，而且都是局部信息，哪怕是高层领导，其实在一定程度上说，他占有的也是局部信息。而从另外一个方面看，每一个听话者都有更多的信息和发言权，他们对于议题的关心程度和渴望参与的程度上都特别高。在这种情下，积极地让每一个有信息的人，能够分享信息，就成为讲话设计的关键。


    中国有一句古话，叫抛砖引玉。但很多人在说这句话时是口是心非的。嘴上说的是“抛砖引玉”；实际上心里想的却是“抛玉引砖”。这个心态是非常要不得的。如果你是在这样的情境里工作，你一定要知道，讲话时要留有分寸，不要把话说满了。另外，在这种情境里工作，要懂得经常性地让自己闭嘴，多去进行倾听。


    今天的课，我们讲了这四种说话的技术，假如你对自己的讲话做过录音，你再用今天课上的内容对自己的讲话作个复盘，看看看有没有收获。


    周末我们会有一个复盘。在我们原有课表中，有一周的预留时间，我把它拿到下周，讲一讲谈判的技术，这个谈判的技术来源很特别，周末我告诉你，这里卖个关子。


    另外就是得到增加了“知识账本”这个功能，以后，我会把特别重要的话放在里面，方便你收藏。


