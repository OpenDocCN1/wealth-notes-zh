  md: '# 138讲：外部分析｜2018你需要抓住哪些技术趋势


    你好，欢迎回到《宁向东的清华管理课》。


    今天和明天，我们主要讨论如何来研判外部环境：今天，我们的重点放在外部的宏观环境；明天，我们研究如何分析产业环境。


    # 1.PESTEL


    研究判断外部宏观环境的基本套路，叫做PESTEL框架，就是从六个方面来去理解你所经历的外部环境。第一个字母是政治，英文叫political，第一个字母是P；经济，英文叫Economic，第一个字母是E；社会，英文是society，第一个字母是S；技术，technology，第一个字母是T；环境，environment，第一个字母是E；法律，英文叫legal，第一个字母是L。很明显，所谓PESTEL，是把这六个角度的第一个字母放在一块，代表了一个分析框架。你从这六个方面去分析外部坏境，肯定就不会漏掉东西。


    我先以技术为例。最近十年，有这样一些技术在发生非常大的变化。


    # 2.进行中的技术革命


    ![](img/3148dc16965f9a57e897fce984cfd348_151_0.png)


    首先，能源技术在发生大的变化，我们现在正经历着第三次能源革命。好多年前，德国政府开始对德国的普通居民进行补贴，家里屋顶可以安装等等等一切可以利用的空间铺设太阳能发电的光伏板，这就是分布式发电，然后，把这些分布式光伏所发的电卖给电网，连接到电网中去。这样的结果是什么呢？就是德国的所有电表是既可以顺时针转，也可以逆时针转的。


    你们家不是一个电表就逆时针转，说明科学家和工程师，科学家是，科学家呢，科学家和工程师，就把电表设计成既可以顺时针转，也可以逆时针转。


    你白天不在家，电表就逆时针转，说明你们家自己是一个小型电厂，你们家在发电，同时再把电卖给电网。晚上，你回家开始用电，你家的电表开始顺时针转。


    近十年前，当我第一次见到这两种功能都转的电表，我非常震惊。这完全是颠覆性的能源革命，就悄悄无声地心在欧洲发生了。当时的光伏转化效率还是很低很低的，科学家们说，如果转化率再提高2、3个
    点，一切都可以让经济上通过市场交易的方式进行。当时，就是补贴效率差了一点，德国政府就通过补贴方式硬推了推。政府和家庭签订20年的买电合同，买电的价格是市场价的4倍。虽然这件事后来影响到大众的批评，但是毫无疑问，一旦因为需求增大而加快了技术进步的步伐，对于很多相关业务是巨大的影响。


    我举个别的例子。前面我们，我们讲过供应链管理的专家创业公司，我讲过四年以前，我亲自听到冯国经理主席提议3D打印对于利来医药，我当时的结论是该讲透气，令我感到非常震惊。我就问他讲他谁，课下我问问他自己，那么冯主席他我私下找他说，你对自己公司的供应链管理是有很大信心的，我，你说他的管理，他什么都不担心，他最怕的就是3D技术的广泛应用。


    3D技术一普及， 3D技术的整个产业链式都必须要发生彻底的改变。因为他的透气，我特意花了几点时间研究了一个3D打印，还特意去考察医疗用的3D打印应用。


    我当时的感受是非常震惊的，由于是外行，所以无法知道这种技术革命的大规模爆发，我在哪一天，是一种什么样的规模，会引发怎样的场景。我当时最关心的事情，就是3D打印能多久一天来。而几天，冯主席已经又来到清华，这次是他在做3D技术和未来供应链的关系。这又唤醒了我的深深的忧患意识。3D，
    技术还没有成熟，而最成熟的美国的中子、光伏发电的效率也没有特别突破性的改善。


    # 3.Hype曲线


    那么，这些技术究竟会什么时候来呢？我相信，这个问题，不但我关心，你关心，我们课程的绝大多数字同学会关心。我们必须要关心。因为不仅仅是做企业、做战略，明确企业的战略机会，要关心，
    打拼不做企业，我们每一个在职场中努力打拼的人，要规划自己的职业生涯，安排好学习，也是需要了解其中的趋势的。


    美国有一个叫做Gartner的公司，他们把技术发展的速度曲线，描述了一个关于技术发展趋势的曲线，描述了新式技术曲线被更加命名为Hype个cycle。这家公司把这条曲线定义为Hype个cycle，在下面，我给你找了2017年的Hype个cycle，
    请你仔细研究一下。


    ![](img/3148dc16965f9a57e897fce984cfd348_151_1.png)


    Gartner公司把一个新技术从出现到最后阶段的过程分为五个阶段，第一个阶段，这个产品没什么人知道， 但专家和业内人士评价的。要么它到，曙光初现高、显现增长快的，往往是第二个阶段。第二个阶段，
    可以被称为“先驱阶段”。在这个阶段，技术其实还没有成熟，产品也还不够完善，但是，市场已经热得火热，人们对它抱着很大的希望。


    比如，去年大家在谈虚拟现实和增强现实，就是所谓的VR和AR。我有时候和学生去吃饭，就发现很多人在讨论它，但这个东西出来一应用，并且盈利，还得很难。再比如，今年大家动不动就是人工智能（AI），在这个领域用，在那个领域用，（AI），或者那个用。


    按理说，我因为是工科出身，有同学、朋友到还在研究生的一线工作，我也接触到来自于的同事这样或那样的同学。按道理，我了解的可能更多，但原来我很多时候听大家谈论，都会有点疑问，因为经常所不用，就是特别焦虑。你们，
    有人非常焦虑在贩卖知识焦虑。我觉得，这么说的人真是太老套要了。这种焦虑感真是一个信息爆炸， 我们都全面、开放、现在开放的天地。行业专业做的那些头脑牌，想技术每天都在变化。碰上这个时代，你得不焦虑，都！


    那我现基本不焦虑了，靠什么呢？就靠我今天和你们分享的这个Hype周期，彻底摆脱了焦虑。这个曲线，首先它知道技术成熟的过程，它是有其内在规律的，不一下就来了，而是会经过一个过程。所以，你只要了这样一个过程有了判断，就可以有计划、有针对性地学习。不懂就学，了解了这个节奏的学习，就不会不是东一榔西、西一棒子，
    而是可以按部就班地了解和学们。


    我和你，按照Hype曲线，大家天天都挂在嘴边上的那些新技术，处于技术周期的第二阶段。 你不说谁说话，到了两年，基本上遗忘越越就。就像去军的VR，没有 那么多人谈了，这个Hype曲线，就渐进入第三阶段了。第四一cycle上第二阶段。幻泡破裂之后，
    这个技术已经进入到低谷，甚至这项技术投入从大众的哪里，又重新回到了专业人手里，这时，就在倒用信息中，技术进入了最关键的第 四个发展阶段。


    第四个发展阶段的特点就是：应用的领域可能会变得非常细，产品可能也改变了 版本，甚至技术还是完全是一个以前从未 有设论的新研通新东西到了应用从来不像原来谈的那那么泡沫，
    是在大众的应领域谈得非常非常细，只是从大众话题变成了小众话题， 来着接者谈到 第五个阶段，大家不再谈论这项技术， 但大家都能细分成 家都不应该应用用 项技术。而且这项技术实在在在在带来了
    盈利， 而不是热商闹地赚钱。


    这就是Hype曲线的描述个五个阶段。 这家年 是Gartner的，每年都会发年一度的Hype曲线。在这条曲线 上，关于某一个技术，在几年之中会进入到它的行列，五年，还事年？这家公司会给一个预测。我跟踪了五年时间，'
