  md: '活动，联手让作业效率不断提高。


    改善，是丰田管理方式的重要内容。丰田生产方式中很重要的一个做法，就是一旦出现不良品、出现问题，他们就立刻把生产线停顿，然后把不良品摆在大家面前，大家一找原因把它解决掉。话说有一次，有一位工人表示腰不舒服，按理讲是不会出现这种情况的，因为机器的高度都是根据作业者的身高中来调整过的。但是，经过有关人员分析之后，发现这个腰痛的是人要进行两种操作，有一种操作就是需要他在身高不合适的情况下来进行，时间长了，腰就出了问题。所以，公司开始对此进行改善，努力不让员工在扭曲身子的情况下进行作业。所以，美国人了解了这些细节后，叹服得不得了。


    # 4.组织能力


    ![](img/3148dc16965f9a57e897fce984cfd348_164_0.png)


    日本是一个家文化极强的国家。家文化，一方面造成了很强的等级化观念。我有一次在大阪街头，特意看日本人晚餐过后的散席场面，印象极深。尊者先走，直到最后一个相对年长的人离去，最年轻、职位最低的人，面对着倒数第二个离去的人的背影，不停地鞠躬，直到那个人转过街角。


    虽然等级观很强，但是家文化也在丰田这样的工厂里面形成极强的团队意识。英文里面有一个词nomu-nication，就是从日本文化里面创造出来的一个新词。Nomu的意思是“喝酒”，后面再跟上一个“communication”，英文“沟通”一词的后半部分。两个词合在一起，就成了一个新词，意思是一边喝酒、一边沟通。


    在日本，男人下班之后那是一定要和同事一起喝酒的，一边喝酒，一边增进感情，一边讨论工作中 的事情，当然，也可能会吵起架来。不过，这个过程确实塑造了日本非常独特的团队文化。所以，如果一个男人下班了，不去和同事喝酒，而是直接回家，太太一般就会怀疑丈夫是不是失业了。丰田生产方式，就是在这样的环境下发展起来的，你会发现，这个生产方式的本质，是充分调动人的力量。


    # —课后思考—


    关于“丰田生产方式”，后面我们讲“运行”那个模块时，还会提到。今天的课后，请你把今天的课和以前关于“组织”和“文化”的内容联系起来，想想该怎样更好地调动人的力量，才能让你的组织更有竞争力。


    # 划重点


    > 1.“丰田生产方式”，简称TPS，蕴含了一种最深层的竞争力：基于人的组织能力。

    2.丰田的经验：一线人员有权力决定怎样做才可以最大程度地发挥机器的效能，生产线的设计人员、维修人员和一线的作业工人，一起参与改善生产，联手让作业效率不断提高。

    3.资源、能力、核心能力等等背后更深层的内容，其实是人，是人的组织能力。


