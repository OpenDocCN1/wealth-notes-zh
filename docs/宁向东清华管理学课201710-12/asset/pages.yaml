- pgno: 148
  md: "上一次直播，我说前一半的课程，我们的重点讲职场，讲组织内部的事情；后面一半的课，比较多地讲商场，讲外部竞争，但是，前后两半的课会交叉，我们的课会从这里开始折叠。今天，我就想折叠一下，就想把组织的使命、价值观和愿景，与领导者的品质和格局联系起来。我觉得，中国的很多企业，之所以缺乏持久的竞争力，组织缺乏凝聚力，其实和领导者的心胸、格局有很大关系。领导者的个人品德不行，市场竞争也会出问题，就算是运气一时不错，也会昙花一现。\n\
    \n021讲：格局修炼 | 当骨干前来辞职\n064讲：道德领导 | 正大光明的力量\n\n第二点，我想和你分享的，就是《基业长青》的作者通过研究发现，企业的愿景和战略都是历时而变的。很多人都觉得，伟大的公司都是来自于一个伟大的构想，一个伟大的、正确的起点，但现实的情况是，伟大的公司最初甚至可能是从错误中不断起步的。但是，它们都是凭借着强大的价值观，不断地调整自己的愿景，不断调整自己的战略，一点一点走向成功。我自己的理解也是这样。好公司的发展都应了中国人的一句老话，草鞋无样，边打边像。\n\
    \n第三点我要分享的，就是有愿景的公司，不会把竞争对手放在很重要的是上去考虑。它们更加关注的是能不能战胜自己，不管它们做得已经多么好了，它们更关心是不是还可以更好，像自己的愿景一样好。把愿景转化成目标，自己和自已比，而不是和对手比，是这些百年公司战略实施的一个重要特征。\n\
    \n# 课后思考\n\n今天的课，我们的核心概念，讲了目标、愿景和战略，三者之间的关系。课后请你通过思考一下十年之后的自己，领会一下怎样运用这些概念，作出好的战略规划。\n\
    \n# 划重点\n\n+   1. 战略的任务，是为了保持行动的一致性，保持团队成员、不同的人都高度理解团队目标，彼此能够协同一致。\n2. 战略，一定要体现为一个目标，一个方向。\n\
    3. 很多时候，好战略就体现在一个的“小目标”上。\n4. 有愿景的公司，不会把竞争对手放在很重要 的位置上去考虑。\n\n# 你正在学习的知识模块\n\n\
    +   1. 人与行为\n  1. 管理与破局\n  2. 领导力\n  3. 团队\n  4. 指导下属\n5. 组织发展\n6. 文化与沟通\n7. 客户\n\
