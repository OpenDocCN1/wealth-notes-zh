    # 3.戴蒙德谈判法


    戴蒙德教授的谈判技巧，除了我们前面讲过的要格外关注对手的需要、要有明确的目标、要有底线思维之外，还有技术性的十条理念：


    +   1. 谈判的时候，一定要遵循循序渐进的逻辑。很多人在心目中是按照对手来设计谈判的，所以希望毕其功于一役，就是一举把所有价值的东西全部拿走。其实，这种想法的结果往往会适得其反，会让对方没有获得感，把可能的合作伙伴赶走。谈判，不是你的是你的，你的是你的，终归会是你的。不是你的，巧取豪夺，最后就意味着失去一个伙伴、失去了信用。生意场上无买卖，但是，有伙伴、有朋友。一锤子买卖做多了，事业一会做大。你想想，熟人生意和生人业务，难度会差多少。


    +   2. 一定要用自己不重视的东西，换取对方重视的东西，这是谈判顺利的关键。交换的本质，就是用自己相对劣势的东西去换取对方相对优势的东西。前几天，我的一位同事告诉我，作为一个商学院的老师，他正在出售一项知识服务。对他说，价格是非常重要的，他们非常不诚信，因为知识服务不诚信，因为他随时可以创造，而对他的客户来说，知识服务对他非常有价值，钱对他们相对来说少一些。他虽然态度特别诚恳，但是在谈价格的时候完全忽视市场规律，在他们相对不重的东西上过于计较。我觉得，对手在谈判观念，甚至是交易观上完全错了。


    +   3. 对方的谈判方往往违反了他们的价值观和行为标准，以此为突破口，就很容易取得谈判的成果。


    +   4. 在谈判中，理性不一定那么重要，人是情感的动物。谈判过程中，要善于利用人的情感作为突破口。特朗普大限的购买过程，就利用了康德尔要传统给后辈的情感。


    +   5. 同一次谈判，在不同的时间，不同的地点进行，就意味着一次新的谈判，要找到情境中可以利用的地方。所以，在谈判僵局的时候，要能够想到改变情境。


    +   6. 不要透露所有信息，要保护出自己的信息优势，识地位。要防止对方通过特定的话术探知你的信息。


    +   7. 要保持沟通的渠道畅通，而不是避而不见，搞心理战。


    +   8. 要知道随机应变。


    +   9. 要接受必要的差异，不一定追求那个最优方案。


    +   10. 要把双方的利益诉求放在平等的视角下去观察，去讨论，而不是只讨论自己的利益诉求。


    # 课后思考


    今天的课后，请你思考一个场景：年底了，领导和也会和你谈绩效，谈话的内容是明年的业绩目标。这就是一次谈判，请你依照这几天的教学内容，设计一个谈判计划。


    针对这次特朗普访华，《马徐骏·世界名利速读》今天发布的内容深度解读了美国各大刊物，包括《商业内参-- Business Insider》《美国CNBC新闻网站》《纽约邮报》和《纽约时报》对于此次访华事件的深度报道，其中也包括特朗普商业谈判技巧的内容，你可以去马老师的专栏里收听。


