  md: '第一桶金就来自于贸易。但是，在现在这样一个信息化愈演愈烈的趋势下，传统贸易越来越难做，利丰于是从区域贸易商开始转型。在冯国经和冯国纶两兄弟的控制下，利丰在15年之间完成了35次并购，在2005年前后完成了它的全球供应链整合，完成了从贸易商，到供应链运营者的转型。而它的组织架构，也形成了非常独特的“海棠式”组织形态。


