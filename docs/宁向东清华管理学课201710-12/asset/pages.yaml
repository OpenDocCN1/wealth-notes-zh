    # 课后思考


    今天的课后，请结合你的工作，思考一下怎样识别盈利性客户，并对客户进行甄别管理呢？


    # 划重点


    1. 可以用销售额和利润作为参考维度，划分出四种客户。

    2. 从实现利润和服务成本的角度对客户进行了细分，可以把客户分为："慷慨型""谈判被动型""谈判主动型""讨价还价型"。

