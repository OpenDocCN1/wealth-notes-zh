    有收获。


    # 4. 主持会议需要练习


    总之，主持会议，是管理者的一个基本功，也是管理能力的一个重要体现，需要你去精心练习。还是那句话，演一百次，演的就是你自已，所以，练习对于提高主持会议技术是非常有用的。比如，你在主持会议的时候，一定会遭遇到沉默。你能不能有效地理解沉默的含义？在很多时刻，沉默的意思，不是同意，通常意味着无可奈何，或者是不同意。那么，你该如何应对这些沉默呢？再比如，由于会议出现稍许争议，你是该及时打断，还是让子弹稍飞一会儿呢？及时打断，很有可能保证了会议的气氛和节奏，但很可能会引发火烧身，把参加者的不满引到了自己的身上。那究竟该如何处理呢？观察、学习、不懈地练习。


    前面，我们提到了卡耐基，今天课程的最后，我就给你讲讲大师卡耐基的故事。卡耐基一辈子命运动机，但他不停地努力。他妻子最传佳的思想就是那本《How To Win
    Friends and Influence People》，中文版翻译为《怎样赢得朋友和影响他人》。卡耐基最重要的思想就是要去了解别人的内在动机，然后去精心练习，来影响他人。我们也需讳言，卡耐基在管理理论上其实没有过多的建树，但是，他通过培训影响了一批经理，改变了很多人的工作和生活。比如，你一定知道股神巴菲特。现在，在巴菲特的办公室墙上，还挂着卡耐基培训班毕业的证书。


    ![](img/3148dc16965f9a57e897fce984cfd348_80_0.png)


    # ● 课后思考 ●


    昨天的作业是请你复盘最近开过的一个会议，试着重新做个评估。今天的课后，请你再从召集者和主持人的角度，为会议写个详细提纲。另外，今天的课后，我摘录了一段引导者的最佳经验和最差表现，请你抽时间看一下，也许会给你一些启示。


    # 推荐阅读


    | 引导者的最佳经验 | 引导者的最差表现 |

    |-------------------|-------------------|

    | 仔细了解和评估参加者的需求 | 忽视参加者的需求和想法 |

    | 创建一个开放、信任的氛围 | 处于自我保护的状态 |

    | 为大家的需要服务 | 忽视大家的需要 |

    | 语言简单、直接 | 用不出格的幽默 |

    | 有较高的能量和自信 | 在过程中显得过于被动 |

    | 公平对待每位参与者，一视同仁 | 让某个人或团队领导主导整个团队的交流 |

    | 积极聆听，完全理解对方的表达 | 聆听不准确，没有完全理解对方的意思 |

    | 大家讨论一段时间之后，提出一个总结 | 未能很好地鼓励参会者多发言 |

    | 确保大家到最后会议成成果，有共识 | 不允意见会议进展状况 |

    | 觉察参与者之间的不同文化与背景 | 未能激发出大家的主人翁意识 |

    | 对参加者的背景差异持比较宽态度 | |


    ![](img/3148dc16965f9a57e897fce984cfd348_80_1.png)


