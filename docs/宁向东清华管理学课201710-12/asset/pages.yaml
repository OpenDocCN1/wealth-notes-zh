    # 3.组织里的4种沟通


    最后，我和你分享一个观点。有一对研究管理学的夫妻，他们把组织里的沟通分成了四种：


    +   1. 是倡议性沟通。这种沟通的目的是，提出一个建议，希望大家一起努力，共同实现一个目标。所以，这种倡议性沟通，就是为了向别人勾勒出一个美好的愿景，让大家觉得这个目标是可以实现的，最好能够引发更多的人参与、支持；


    +   2. 是理解性沟通。这种沟通多发生在请求对方投入资源、参与合作的情境时，关键是要让沟通的对方知道合作对于他的好处，一定要说明对方在合作中能够得到什么好处；


    +   3. 是执行性沟通，业绩谈话常常属于这一类沟通。这种沟通的核心是让对方明白自己已有行动的效果，以及未来需要投入承诺、采取行动，在什么时间、投入何种努力，才能达到预期的效果；


    +   4. 是总结性沟通。用于在工作结束之后，表达感谢或者告诉这个工作已经完成的沟通。


    在这四种不同类型的沟通中，所需要的时机、方式和沟通内容，是不一样的。这是你格外要注意的。


    # ◆ 课后思考 ◆


    今天的课后，请你对近期让你印象最深的一次沟通，作一个复盘，明确它的类型，然后作个检讨，看看成功的要点是什么，以后需要改善的又是哪几点。我会精选一些同学的留言，请你抽时间再学习和分析一下同学的留言。


