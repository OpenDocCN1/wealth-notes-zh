- pgno: 489
  md: "# Endowments\n\n+   p₁=2 and p₂=3 so the value of the endowment (ω₁,ω₂) = (10,2)\
    \ is\n+   \n+   p₁ω₁ + p₂ω₂ = 2 × 10 + 3 × 2 = 26\n\n+   Q: For which consumption\
    \ bundles may the endowment be exchanged?\n\n+   A: For any bundle costing no\
    \ more than the endowment’s value."
  merge: -1
  img_proc: true
- pgno: 490
  md: "# Budget Constraints Revisited\n\n+   So, given p₁ and p₂, the budget constraint\
    \ for a consumer with an endowment (ω₁, ω₂) is\n+   \n+   p₁x₁ + p₂x₂ = p₁ω₁ +\
    \ p₂ω₂.\n\n+   The budget set is\n+   {(x₁, x₂) | p₁x₁ + p₂x₂ ≤ p₁ω₁ + p₂ω₂,\n\
    +    x₁ ≥ 0, x₂ ≥ 0}."
  merge: -1
