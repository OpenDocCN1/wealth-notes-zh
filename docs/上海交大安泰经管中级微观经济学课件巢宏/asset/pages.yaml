- pgno: 328
  md: '# Assumptions on Preferences


    +   - **Preferences**

    +     - do not change while the choice data are gathered.

    +     - are strictly convex.

    +     - are monotonic.

    +   - Together, convexity and monotonicity imply that the most preferred affordable
    bundle is unique.'
