- pgno: 1253
  md: '# Pure Competition


    +   ◆ A firm in a perfectly competitive market knows it has no influence over
    the market price for its product. The firm is a **market** price-taker.

    +   ◆ The firm is free to vary its own price.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1253_0.png)'
  merge: -1
  img_proc: true
- pgno: 1254
  md: '# Pure Competition


    +   - If the firm sets its own price above the market price then the quantity
    demanded from the firm is zero.

    +   - If the firm sets its own price below the market price then the quantity
    demanded from the firm is the entire market quantity-demanded.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1254_0.png)'
  merge: -1
