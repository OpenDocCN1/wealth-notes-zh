- pgno: 156
  md: '# Monotonic Transformations & Marginal Rates-of-Substitution


    +   ◆ For U(x₁,x₂) = x₁x₂ the MRS = - x₂/x₁.

    +   ◆ Create V = U²; i.e. V(x₁,x₂) = x₁²x₂². What is the MRS for V?


    MRS = - ∂V / ∂x₁ / ∂V / ∂x₂ = - 2x₁x₂² / 2x₁²x₂ = - x₂ / x₁


    which is the same as the MRS for U.'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# Monotonic Transformations & Marginal Rates-of-Substitution


    ◆ More generally, if V = f(U) where f is a strictly increasing function, then


    *MRS* = − ∂V / ∂x₁ / ∂V / ∂x₂ = − [f′(U) × ∂U / ∂x₁] / [f′(U) × ∂U / ∂x₂]


    = − ∂U / ∂x₁ / ∂U / ∂x₂.


    So MRS is unchanged by a positive monotonic transformation.'
  merge: -1
  img_proc: true
