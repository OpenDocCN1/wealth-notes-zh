- pgno: 1422
  md: '# Monopolistic Pricing & Own-Price

    Elasticity of Demand


    $$MR(y)=\frac{d}{dy}(p(y)y)=p(y)+y\frac{dp(y)}{dy}$$


    $$=p(y)\left[1+\frac{y}{p(y)}\frac{dp(y)}{dy}\right].$$


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1422_0.png)'
  merge: -1
  img_proc: true
- pgno: 1423
  md: '# Monopolistic Pricing & Own-Price Elasticity of Demand


    MR(y) = d/dy (p(y) y) = p(y) + y dp(y)/dy


    = p(y) [ 1 + (y / p(y)) dp(y)/dy ] .


    # Own-price elasticity of demand is


    ε = p(y)/y dy/dp(y)


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1423_0.png)'
  merge: -1
  img_proc: true
- pgno: 1424
  md: '# Monopolistic Pricing & Own-Price Elasticity of Demand


    MR(y) = d/dy (p(y) y) = p(y) + y dp(y)/dy


    = p(y) [ 1 + y/p(y) dp(y)/dy ] .


    # Own-price elasticity of demand is


    ε = p(y)/y dy/dp(y) so MR(y) = p(y) [ 1 + 1/ε ] .


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1424_0.png)'
  merge: -1
  img_proc: true
- pgno: 1425
  md: '# Monopolistic Pricing & Own-Price Elasticity of Demand


    MR(y) = p(y) [1 + 1/ε].


    Suppose the monopolist’s marginal cost of production is constant, at $k/output
    unit. For a profit-maximum


    MR(y*) = p(y*) [1 + 1/ε] = k which is p(y*) = k / (1 + 1/ε).


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1425_0.png)'
  merge: -1
  img_proc: true
- pgno: 1426
  md: '# Monopolistic Pricing & Own-Price Elasticity of Demand


    $$p(y^*) = \frac{k}{1 + \frac{1}{\varepsilon}}.$$


    E.g. if ε = −3 then p(y*) = 3k/2, and if ε = −2 then p(y*) = 2k.

    So as ε rises towards −1 the monopolist alters its output level to make the market
    price of its product to rise.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1426_0.png)'
