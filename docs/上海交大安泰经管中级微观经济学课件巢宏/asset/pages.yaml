- pgno: 1340
  md: '# Long-Run Industry Supply


    +   - Positive economic profit induces entry.

    +   - Economic profit is positive when the market price pₛᵉ is higher than a firm’s
    minimum av. total cost; pₛᵉ > min AC(y).

    +   - Entry increases industry supply, causing pₛᵉ to fall.

    +   - When does entry cease?'
  merge: -1
  img_proc: true
