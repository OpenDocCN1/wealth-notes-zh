- pgno: 1004
  md: '# Short-Run Profit-Maximization


    $$MP_1 = \frac{w_1}{p} \quad \Leftrightarrow \quad p \times MP_1 = w_1$$


    $p \times MP_1$ is the marginal revenue product of input 1, the rate at which
    revenue increases with the amount used of input 1.


    If $p \times MP_1 > w_1$ then profit increases with $x_1$.


    If $p \times MP_1 < w_1$ then profit decreases with $x_1$.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1004_0.png)'
  merge: -1
  img_proc: true
- pgno: 1005
  md: '# Short-Run Profit-Maximization; A Cobb-Douglas Example


    Suppose the short-run production function is y = x₁^(1/3) x̃₂^(1/3).


    The marginal product of the variable input 1 is MP₁ = ∂y/∂x₁ = (1/3) x₁^(-2/3)
    x̃₂^(1/3).


    The profit-maximizing condition is MRP₁ = p × MP₁ = (p/3) (x₁*)^(-2/3) x̃₂^(1/3)
    = w₁.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1005_0.png)'
  merge: -1
  img_proc: true
- pgno: 1006
  md: "# Short-Run Profit-Maximization;  \nA Cobb-Douglas Example\n\n**Solving** \\\
    (\\frac{p}{3}(x_1^*)^{-2/3}\\tilde{x}_2^{1/3}=w_1\\) **for** \\(x_1\\) **gives**\n\
    \n\\[(x_1^*)^{-2/3}=\\frac{3w_1}{p\\tilde{x}_2^{1/3}}.\\]\n\n**That is,**\n\n\\\
    [(x_1^*)^{2/3}=\\frac{p\\tilde{x}_2^{1/3}}{3w_1}\\]\n\n![](img/e3f3f402f74cf453caf4596d2d7d7398_1006_0.png)"
  merge: -1
  img_proc: true
- pgno: 1007
  md: "# Short-Run Profit-Maximization;  \nA Cobb-Douglas Example\n\n**Solving** \\\
    (\\frac{p}{3}(x_1^*)^{-2/3}\\tilde{x}_2^{1/3}=w_1\\) **for** \\(x_1\\) **gives**\n\
    \n\\[(x_1^*)^{-2/3}=\\frac{3w_1}{p\\tilde{x}_2^{1/3}}.\\]\n\n**That is,**\n\n\\\
    [(x_1^*)^{2/3}=\\frac{p\\tilde{x}_2^{1/3}}{3w_1}\\]\n\n**so**\n\n\\[x_1^*=\\left(\\\
    frac{p\\tilde{x}_2^{1/3}}{3w_1}\\right)^{3/2}=\\left(\\frac{p}{3w_1}\\right)^{3/2}\\\
    tilde{x}_2^{1/2}.\\]"
  merge: -1
