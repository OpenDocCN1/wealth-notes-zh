- pgno: 958
  md: '# Technical Rate-of-Substitution; A Cobb-Douglas Example


    y = f(x₁, x₂) = x₁ᵃ x₂ᵇ


    so ∂y/∂x₁ = a x₁ᵃ⁻¹ x₂ᵇ and ∂y/∂x₂ = b x₁ᵃ x₂ᵇ⁻¹.


    # The technical rate-of-substitution is


    dx₂/dx₁ = − (∂y/∂x₁)/(∂y/∂x₂) = − (a x₁ᵃ⁻¹ x₂ᵇ)/(b x₁ᵃ x₂ᵇ⁻¹) = − (a x₂)/(b x₁).'
