- pgno: 1578
  md: '# Quantity Competition


    +   - Assume that firms compete by choosing output levels.


    +   - If firm 1 produces y₁ units and firm 2 produces y₂ units then total quantity
    supplied is y₁ + y₂. The market price will be p(y₁+ y₂).


    +   - The firms’ total cost functions are c₁(y₁) and c₂(y₂).'
  merge: -1
  img_proc: true
- pgno: 1579
  md: '# Quantity Competition


    +   - Suppose firm 1 takes firm 2’s output level choice y₂ as given. Then firm
    1 sees its profit function as

    +     Π₁(y₁; y₂) = p(y₁ + y₂) y₁ − c₁(y₁).

    +   - Given y₂, what output level y₁ maximizes firm 1’s profit?


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1579_0.png)'
  merge: -1
  img_proc: true
- pgno: 1580
  md: '# Quantity Competition; An Example


    +   Suppose that the market inverse demand function is

    +   p(y_T) = 60 − y_T

    +   and that the firms’ total cost functions are

    +   c₁(y₁) = y₁² and c₂(y₂) = 15y₂ + y₂².


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1580_0.png)'
  merge: -1
  img_proc: true
- pgno: 1581
  md: '# Quantity Competition; An Example


    Then, for given y₂, firm 1’s profit function is


    $$\Pi(y_1;y_2)=(60-y_1-y_2)y_1-y_1^2.$$


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1581_0.png)'
  merge: -1
  img_proc: true
- pgno: 1582
  md: '# Quantity Competition; An Example


    Then, for given y₂, firm 1’s profit function is

    Π(y₁;y₂) = (60 − y₁ − y₂) y₁ − y₁².

    So, given y₂, firm 1’s profit-maximizing output level solves

    ∂Π/∂y₁ = 60 − 2y₁ − y₂ − 2y₁ = 0.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1582_0.png)'
