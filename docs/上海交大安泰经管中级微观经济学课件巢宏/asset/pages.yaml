- pgno: 87
  md: "# Assumptions about Preference Relations\n\n+   - **Transitivity: If**\n+ \
    \    x is at least as preferred as y, and\n+     y is at least as preferred as\
    \ z, then\n+     x is at least as preferred as z; *i.e.*\n+   \n+     x ≽ y and\
    \ y ≽ z → x ≽ z.\n\n![](img/e3f3f402f74cf453caf4596d2d7d7398_87_0.png)"
