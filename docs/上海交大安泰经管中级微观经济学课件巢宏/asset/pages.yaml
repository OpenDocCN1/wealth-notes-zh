- pgno: 1269
  md: '# The Firm’s Short-Run Supply Decision


    For the interior case of y_s* > 0, the first-order maximum profit condition is


    dΠ_s(y)/dy = p − MC_s(y) = 0


    That is, p = MC_s(y_s*).


    So at a profit maximum with y_s* > 0, the market price p equals the marginal cost
    of production at y = y_s*.


