- pgno: 1891
  md: "# Implications of Walras’ Law\n\nWhat if, for some positive prices p₁ and p₂,\
    \ there is an excess quantity supplied of commodity 1? That is,\n x₁*ᴬ + x₁*ᴮ\
    \ − ω₁ᴬ − ω₁ᴮ < 0.\n\nThen\n p₁(x₁*ᴬ + x₁*ᴮ − ω₁ᴬ − ω₁ᴮ) + \n p₂(x₂*ᴬ + x₂*ᴮ −\
    \ ω₂ᴬ − ω₂ᴮ) = 0\n\nimplies\n x₂*ᴬ + x₂*ᴮ − ω₂ᴬ − ω₂ᴮ > 0.\n\n![](img/e3f3f402f74cf453caf4596d2d7d7398_1891_0.png)"
