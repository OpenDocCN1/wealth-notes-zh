- pgno: 562
  md: "# Intertemporal Choice\n\n+   Finally, if c₁ units are consumed in period 1\
    \ then the consumer spends p₁c₁ in period 1, leaving m₁ - p₁c₁ saved for period\
    \ 1. Available income in period 2 will then be\n+   \n+   m₂ + (1 + r)(m₁ - p₁c₁)\n\
    +   \n+   so\n+   \n+   p₂c₂ = m₂ + (1 + r)(m₁ - p₁c₁)."
  merge: -1
