  md: '# Quantity Competition; An Example


    +   ◆ An equilibrium is when each firm’s output level is a best response to the
    other firm’s output level, for then neither wants to deviate from its output level.

    +   ◆ A pair of output levels (y₁*, y₂*) is a Cournot-Nash equilibrium if y₁*
    = R₁(y₂*) and y₂* = R₂(y₁*).


