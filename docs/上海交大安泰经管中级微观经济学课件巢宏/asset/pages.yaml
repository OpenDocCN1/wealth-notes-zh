- pgno: 498
  md: '# Net Demands


    +   Suppose (ω₁, ω₂) = (10, 2) and p₁=2, p₂=3. Then the constraint is p₁x₁ + p₂x₂
    = p₁ω₁ + p₂ω₂ = 26.


    +   If the consumer demands (x₁*, x₂*) = (7, 4), then 3 good 1 units exchange
    for 2 good 2 units. Net demands are x₁* - ω₁ = 7 - 10 = -3 and x₂* - ω₂ = 4 -
    2 = +2.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_498_0.png)'
