- pgno: 28
  md: '# Pareto Efficiency


    +   - Vilfredo Pareto; 1848-1923.

    +   - A Pareto outcome allows no “wasted welfare”;

    +   - i.e. the only way one person’s welfare can be improved is to lower another
    person’s welfare.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_28_0.png)


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_28_1.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Pareto Efficiency


    +   - A Pareto inefficient outcome means there remain unrealized mutual gains-to-trade.

    +   - Any market outcome that achieves all possible gains-to-trade must be Pareto
    efficient.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Pareto Efficiency


    +   **Competitive equilibrium:**

    +   - all apartment renters value them at the market price pᵉ or more

    +   - all others value apartments at less than pᵉ

    +   - so no mutually beneficial trades remain

    +   - so the outcome is Pareto efficient.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Pareto Efficiency


    +   - **Discriminatory Monopoly:**

    +     - assignment of apartments is the same as with the perfectly competitive
    market

    +     - so the discriminatory monopoly outcome is also Pareto efficient.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_31_0.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Pareto Efficiency


    +   ◆ Monopoly:

    +   - not all apartments are occupied

    +   - monopolist can increase profit by renting an empty apartment to someone
    who does not have an apartment before as long as the price he charges this person
    is not higher than this person’s reservation price.

    +   - so the monopoly outcome is Pareto inefficient.'
  merge: -1
  img_proc: true
