- pgno: 994
  md: '# Economic Profit


    +   ◆ How do we value a firm?


    +   ◆ Suppose the firm’s stream of periodic economic profits is Π₀, Π₁, Π₂, ...
    and r is the rate of interest.


    +   ◆ Then the present-value of the firm’s economic profit stream is


    PV = Π₀ + Π₁/(1+r) + Π₂/(1+r)² + …'
