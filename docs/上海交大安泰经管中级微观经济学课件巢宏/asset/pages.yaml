- pgno: 1415
  md: '# Profit-Maximization; An Example


    At the profit-maximizing output level y*, MR(y*) = MC(y*). So if p(y) = a - b
    y and c(y) = F + α y + β y² then MR(y*) = a − 2b y* = α + 2β y* = MC(y*)


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1415_0.png)'
