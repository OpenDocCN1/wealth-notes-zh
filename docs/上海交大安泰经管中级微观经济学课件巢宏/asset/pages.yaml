  md: '# Elasticities


    +   - Elasticity measures the “sensitivity” of one variable with respect to another.

    +   - The elasticity of variable X with respect to variable Y is

    +     εₓ,ᵧ = %Δx / %Δy.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_682_0.png)'
