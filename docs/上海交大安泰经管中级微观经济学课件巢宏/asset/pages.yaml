- pgno: 54
  md: '# Budget Constraints - Income Changes


    +   - No original choice is lost and new choices are added when income increases,
    so higher income cannot make a consumer worse off.

    +   - An income decrease may (typically will) make the consumer worse off.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_54_0.png)'
  merge: -1
  img_proc: true
