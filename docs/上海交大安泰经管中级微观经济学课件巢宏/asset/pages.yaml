  md: '# Utility Functions


    ◆ A utility function U(x) represents a preference relation ≽ if and only if:


    +   1. x ≻ y ⇔ U(x) > U(y)

    +   2. x ≺ y ⇔ U(x) < U(y)

    +   3. x ~ y ⇔ U(x) = U(y)


