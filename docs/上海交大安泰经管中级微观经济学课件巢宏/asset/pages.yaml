- pgno: 1500
  md: '# Third-degree Price Discrimination


    $\Pi(y_1,y_2)=p_1(y_1)y_1+p_2(y_2)y_2-c(y_1+y_2).$


    # The profit-maximization conditions are


    $$\frac{\partial \Pi}{\partial y_1}=\frac{\partial}{\partial y_1}\bigl(p_1(y_1)y_1\bigr)-\frac{\partial
    c(y_1+y_2)}{\partial (y_1+y_2)}\times\frac{\partial (y_1+y_2)}{\partial y_1}$$

    $$=0$$


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1500_0.png)'
  merge: -1
  img_proc: true
- pgno: 1501
  md: '# Third-degree Price Discrimination


    Π(y₁,y₂) = p₁(y₁)y₁ + p₂(y₂)y₂ − c(y₁ + y₂).


    # The profit-maximization conditions are


    ∂Π/∂y₁ = ∂/∂y₁ (p₁(y₁)y₁) − [∂c(y₁ + y₂)/∂(y₁ + y₂)] × [∂(y₁ + y₂)/∂y₁] = 0


    ∂Π/∂y₂ = ∂/∂y₂ (p₂(y₂)y₂) − [∂c(y₁ + y₂)/∂(y₁ + y₂)] × [∂(y₁ + y₂)/∂y₂] = 0


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1501_0.png)'
  merge: -1
  img_proc: true
- pgno: 1502
  md: '# Third-degree Price Discrimination


    ∂(y₁ + y₂)/∂y₁ = 1  and  ∂(y₁ + y₂)/∂y₂ = 1  so


    the profit-maximization conditions are


    ∂/∂y₁ (p₁(y₁) y₁) = ∂c(y₁ + y₂)/∂(y₁ + y₂)


    and  ∂/∂y₂ (p₂(y₂) y₂) = ∂c(y₁ + y₂)/∂(y₁ + y₂).'
