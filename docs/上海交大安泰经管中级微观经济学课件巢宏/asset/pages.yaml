    | Bonnie / Clyde | S | C |

    |---|---|---|

    | S | (-5,-5) | (-30,-1) |

    | C | (-1,-30) | (-10,-10) |


    The only credible NE for this game is where both Clyde and Bonnie choose Confess
    in every period. This is true even if the game is repeated for a large, but finite,
    number of periods.'
  merge: -1
  img_proc: true
- pgno: 1784
  md: '# The Prisoner’s Dilemma


    |          | Clyde S | Clyde C |

    |----------|---------|---------|

    | Bonnie S | (-5,-5) | (-30,-1) |

    | Bonnie C | (-1,-30) | (-10,-10) |


    However, if the game is repeated for an infinite number of periods then the game
    has a huge number of credible NE.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1784_0.png)'
  merge: -1
  img_proc: true
- pgno: 1785
  md: '# The Prisoner’s Dilemma


    | Bonnie \\ Clyde | S | C |

    |---|---|---|

    | S | (-5,-5) | (-30,-1) |

    | C | (-1,-30) | (-10,-10) |


    (C,C) forever is one such NE. But (S,S) can also be a NE because a player can
    punish the other for not cooperating (i.e. for choosing Confess).'
  merge: -1
  img_proc: true
