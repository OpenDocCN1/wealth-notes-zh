  md: '# Implications of Walras’ Law


    So one implication of Walras’ Law for a two-commodity exchange economy is that
    if one market is in equilibrium then the other market must also be in equilibrium.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1890_0.png)'
