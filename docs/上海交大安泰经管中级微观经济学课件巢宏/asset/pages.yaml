  md: '# Long-Run Industry Supply


    +   ◆ In the long-run every firm now in the industry is free to exit and firms
    now outside the industry are free to enter.

    +   ◆ The industry’s long-run supply function must account for entry and exit
    as well as for the supply choices of firms that choose to be in the industry.

    +   ◆ How is this done?'
  merge: -1
