- pgno: 1147
  md: '# Short-Run & Long-Run Total Costs


    +   ◆ The long-run cost-minimization problem is $\min_{x_1,x_2 \ge 0} w_1 x_1
    + w_2 x_2$ subject to $f(x_1,x_2)=y$.


    +   ◆ The short-run cost-minimization problem is $\min_{x_2 \ge 0} w_1 x_1''''
    + w_2 x_2$ subject to $f(x_1'''',x_2)=y$.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1147_0.png)'
  merge: -1
  img_proc: true
- pgno: 1148
  md: '# Short-Run & Long-Run Total Costs


    +   ♦ The short-run cost-min. problem is the long-run problem subject to the extra
    constraint that x₁ = x₁''''.


    +   ♦ If the long-run choice for x₁ was x₁'''' then the extra constraint x₁ =
    x₁'''' is not really a constraint at all and so the long-run and short-run total
    costs of producing y output units are the same.'
  merge: -1
