- pgno: 706
  md: '# Revenue and Own-Price Elasticity of Demand


    +   - If raising a commodity’s price causes little decrease in quantity demanded,
    then sellers’ revenues rise.

    +   - Hence own-price inelastic demand causes sellers’ revenues to rise as price
    rises.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_706_0.png)'
  merge: -1
  img_proc: true
- pgno: 707
  md: '# Revenue and Own-Price Elasticity of Demand


    +   - If raising a commodity’s price causes a large decrease in quantity demanded,
    then sellers’ revenues fall.

    +   - Hence own-price elastic demand causes sellers’ revenues to fall as price
    rises.'
