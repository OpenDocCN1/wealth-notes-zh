- pgno: 360
  md: "# The Strong Axiom of Revealed Preference (SARP)\n\n+   ◆ If the bundle **x**\
    \ is revealed (directly or indirectly) as preferred to the bundle **y** and **x\
    \ ≠ y**, then it is never the case that the **y** is revealed (directly or indirectly)\
    \ as preferred to **x**; *i.e.*\n+   \n+   **x ≽ᴰ y** or **x ≽ᴵ y**\n+   \n+ \
    \  ➜ not (**y ≽ᴰ x** or **y ≽ᴵ x**).\n\n![](img/e3f3f402f74cf453caf4596d2d7d7398_360_0.png)"
  merge: -1
  img_proc: true
