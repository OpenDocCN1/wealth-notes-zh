- pgno: 86
  md: '# Assumptions about Preference

    Relations


    ◆ **Reflexivity:** Any bundle x is always

    at least as preferred as itself; *i.e.*


    $x \succeq x.$


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_86_0.png)'
  merge: -1
