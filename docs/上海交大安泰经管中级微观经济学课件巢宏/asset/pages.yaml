- pgno: 36
  md: '# Consumption Choice Sets


    +   ♦ A consumption choice set is the collection of all consumption choices available
    to the consumer.

    +   ♦ What constrains consumption choice?

    +     — Budgetary, time and other resource limitations.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_36_0.png)'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# Budget Constraints


    +   ♦ A consumption bundle containing x₁ units of commodity 1, x₂ units of commodity
    2 and so on up to xₙ units of commodity n is denoted by the vector (x₁, x₂, ...,
    xₙ).

    +   ♦ Commodity prices are p₁, p₂, ..., pₙ.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_37_0.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Budget Constraints


    ◆ Q: When is a consumption bundle (x₁, ..., xₙ) affordable at given prices p₁,
    ..., pₙ?'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# Budget Constraints


    +   ◆ Q: When is a bundle (x₁, ... , xₙ) affordable at prices p₁, ... , pₙ?

    +   ◆ A: When

    +   p₁x₁ + ... + pₙxₙ ≤ m

    +   where m is the consumer’s (disposable) income.'
  merge: -1
  img_proc: true
- pgno: 40
  md: "# Budget Constraints\n\n+   - All the bundles that are only just affordable\
    \ form the consumer’s budget constraint. This is the set\n+   \n+   { (x₁,...,xₙ)\
    \ | x₁ ≥ 0, ..., xₙ ≥ 0 and p₁x₁ + ... + pₙxₙ = m }."
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Budget Constraints


    +   ♦ The consumer’s budget set is the set of all affordable bundles;

    +   B(p₁, ..., pₙ, m) =

    +   { (x₁, ..., xₙ) | x₁ ≥ 0, ..., xₙ ≥ 0 and

    +   p₁x₁ + ... + pₙxₙ ≤ m }


    +   ♦ The budget constraint is the upper boundary of the budget set.'
  merge: -1
  img_proc: true
