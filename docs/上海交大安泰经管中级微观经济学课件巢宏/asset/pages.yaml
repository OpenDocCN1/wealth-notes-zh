- pgno: 1083
  md: '# Revealed Profitability


    (p′ − p″)y′ − ( w′ − w″)x′ ≥ (p′ − p″)y″ − (w′ − w″)x″


    so


    (p′ − p″)(y′ − y″) ≥ (w′ − w″)(x′ − x″)


    That is, ΔpΔy ≥ ΔwΔx


    is a necessary implication of profit-maximization.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1083_0.png)'
