  md: '# The Weak Axiom of Revealed Preference (WARP)


    +   If the bundle x is revealed directly as preferred to the bundle y then it
    is never the case that y is revealed directly as preferred to x; i.e.


    x ≽_D y → not (y ≽_D x).


