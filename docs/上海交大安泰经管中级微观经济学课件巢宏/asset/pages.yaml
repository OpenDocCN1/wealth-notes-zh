- pgno: 954
  md: '# Technical Rate-of-Substitution


    +   - How is a technical rate-of-substitution computed?

    +   - The production function is $y = f(x_1, x_2)$.

    +   - A small change $(dx_1, dx_2)$ in the input bundle causes a change to the
    output level of $dy = \frac{\partial y}{\partial x_1}dx_1 + \frac{\partial y}{\partial
    x_2}dx_2$.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_954_0.png)'
  merge: -1
  img_proc: true
- pgno: 955
  md: '# Technical Rate-of-Substitution


    dy = ∂y/∂x₁ dx₁ + ∂y/∂x₂ dx₂.


    But dy = 0 since there is to be no change to the output level, so the changes
    dx₁ and dx₂ to the input levels must satisfy


    0 = ∂y/∂x₁ dx₁ + ∂y/∂x₂ dx₂.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_955_0.png)'
  merge: -1
  img_proc: true
- pgno: 956
  md: '# Technical Rate-of-Substitution


    0 = ∂y/∂x₁ dx₁ + ∂y/∂x₂ dx₂.


    # rearranges to


    ∂y/∂x₂ dx₂ = − ∂y/∂x₁ dx₁


    # so


    dx₂/dx₁ = − (∂y/∂x₁)/(∂y/∂x₂).


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_956_0.png)'
  merge: -1
  img_proc: true
