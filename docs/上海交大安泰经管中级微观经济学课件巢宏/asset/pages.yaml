- pgno: 1084
  md: '# Revealed Profitability


    **ΔpΔy ≥ ΔwΔx**


    is a necessary implication of profit-maximization.


    Suppose the input price does not change. Then Δw = 0 and profit-maximization implies
    ΔpΔy ≥ 0; *i.e.*, a competitive firm’s output supply curve cannot slope downward.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1084_0.png)'
