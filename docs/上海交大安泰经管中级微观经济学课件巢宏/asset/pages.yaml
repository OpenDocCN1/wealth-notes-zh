- pgno: 1102
  md: '# A Cobb-Douglas Example of Cost Minimization


    At the input bundle (x₁*,x₂*) which minimizes the cost of producing y output units:


    (a) y = (x₁*)¹/³ (x₂*)²/³ and


    (b) − w₁/w₂ = − (∂ y / ∂ x₁)/(∂ y / ∂ x₂) = − [(1/3)(x₁*)⁻²/³ (x₂*)²/³] / [(2/3)(x₁*)¹/³
    (x₂*)⁻¹/³] = − x₂* / (2 x₁*)'
