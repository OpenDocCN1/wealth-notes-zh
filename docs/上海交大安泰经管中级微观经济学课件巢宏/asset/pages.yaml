- pgno: 1772
  md: '# How Many Nash Equilibria?


    +   - A game with a finite number of players, each with a finite number of pure
    strategies, has at least one Nash equilibrium.

    +   - So if the game has no pure strategy Nash equilibrium then it must have at
    least one mixed strategy Nash equilibrium.'
  merge: -1
  img_proc: true
- pgno: 1773
  md: '# # Repeated Games


    +   - A strategic game that is repeated by being played once in each of a number
    of periods.

    +   - What strategies are sensible for the players depends greatly on whether
    or not the game

    +     - is repeated over only a finite number of periods

    +     - is repeated over an infinite number of periods.'
  merge: -1
  img_proc: true
