- pgno: 148
  md: '# Marginal Utilities


    +   ♦ Marginal means “incremental”.

    +   ♦ The marginal utility of commodity i is the rate-of-change of total utility
    as the quantity of commodity i consumed changes; i.e.


    $MU_i = \frac{\partial U}{\partial x_i}$'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Marginal Utilities and Marginal Rates-of-Substitution


    The general equation for an indifference curve is

    U(x₁,x₂) ≡ k, a constant.

    Totally differentiating this identity gives

    ∂U/∂x₁ dx₁ + ∂U/∂x₂ dx₂ = 0'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Marginal Utilities and Marginal Rates-of-Substitution


    ∂U/∂x₁ dx₁ + ∂U/∂x₂ dx₂ = 0


    rearranged is


    ∂U/∂x₂ dx₂ = − ∂U/∂x₁ dx₁


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_150_0.png)'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# Marginal Utilities and Marginal

    Rates-of-Substitution


    And


    $$\frac{\partial U}{\partial x_2}dx_2=-\frac{\partial U}{\partial x_1}dx_1$$


    rearranged is


    $$\frac{dx_2}{dx_1}=-\frac{\partial U/\partial x_1}{\partial U/\partial x_2}.$$


    This is the MRS.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# Marg. Utilities & Marg. Rates-of-Substitution; An example


    ◆ Suppose U(x₁,x₂) = x₁x₂. Then

    ∂U/∂x₁ = (1)(x₂) = x₂

    ∂U/∂x₂ = (x₁)(1) = x₁


    so MRS = dx₂/dx₁ = − (∂U/∂x₁)/(∂U/∂x₂) = − x₂/x₁.'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# Marg. Utilities & Marg. Rates-of-Substitution; An example


    U(x₁,x₂) = x₁x₂; MRS = - x₂/x₁


    x₂


    8


