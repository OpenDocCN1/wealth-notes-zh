- pgno: 13
  md: '# A Monopolistic Landlord


    +   - When the landlord sets a rental price p he rents D(p) apartments.

    +   - Revenue = pD(p).

    +   - Revenue is low if p ≈ 0

    +   - Revenue is low if p is so high that D(p) ≈ 0.

    +   - An intermediate value for p maximizes revenue.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_13_0.png)'
