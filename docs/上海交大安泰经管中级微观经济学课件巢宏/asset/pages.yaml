- pgno: 948
  md: '# Returns-to-Scale


    +   - A marginal product is the rate-of-change of output as one input level increases,
    holding all other input levels fixed.

    +   - Marginal product diminishes because the other input levels are fixed, so
    the increasing input’s units have each less and less of other inputs with which
    to work.'
  merge: -1
  img_proc: true
- pgno: 949
  md: '# Returns-to-Scale


    +   When all input levels are increased proportionately, there need be no diminution
    of marginal products since each input will always have the same amount of other
    inputs with which to work. Input productivities need not fall and so returns-to-scale
    can be constant or increasing.'
  merge: -1
  img_proc: true
