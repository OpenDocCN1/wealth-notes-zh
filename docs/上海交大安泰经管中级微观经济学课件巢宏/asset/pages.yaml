  md: '# Economic Applications of Elasticity


    +   - Economists use elasticities to measure the sensitivity of

    +     - quantity demanded of commodity i with respect to the price of commodity
    i (own-price elasticity of demand)

    +     - demand for commodity i with respect to the price of commodity j (cross-price
    elasticity of demand).'
