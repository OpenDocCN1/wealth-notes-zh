  md: '# Quantity Tax Levied on a Monopolist


    +   - Can a monopolist “pass” all of a $t quantity tax to the consumers?

    +   - Suppose the marginal cost of production is constant at $k/output unit and
    the monopolist is facing a constant-elasticity demand curve.

    +   - With no tax, the monopolist’s price is $p(y^*) = \frac{k\varepsilon}{1+\varepsilon}$.'
  merge: -1
  img_proc: true
- pgno: 1445
  md: '# Quantity Tax Levied on a Monopolist


    +   - The tax increases marginal cost to $(k+t)$/output unit, changing the profit-maximizing
    price to

    +     $$p(y^t)=\frac{(k+t)\varepsilon}{1+\varepsilon}.$$


    +   - The amount of the tax paid by buyers is

    +     $$p(y^t)-p(y^*).$$


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1445_0.png)'
  merge: -1
  img_proc: true
- pgno: 1446
  md: '# Quantity Tax Levied on a Monopolist


    p(yᵗ) − p(y*) = (k + t)ε / (1 + ε) − kε / (1 + ε) = tε / (1 + ε)


    is the amount of the tax passed on to buyers. E.g. if ε = -2, the amount of the
    tax passed on is 2t.


    Because ε < -1, ε / (1 + ε) > 1 and so the monopolist passes on to consumers more
    than the tax!'
  merge: -1
