- pgno: 1477
  md: '# How Should a Monopoly Price?


    +   - So far a monopoly has been thought of as a firm which has to sell its product
    at the same price to every customer. This is uniform pricing.

    +   - Can price-discrimination earn a monopoly higher profits?


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1477_0.png)'
  merge: -1
  img_proc: true
- pgno: 1478
  md: '# Types of Price Discrimination


    +   - **1st-degree:** Each output unit is sold at a different price. Prices may
    differ across buyers.

    +   - **2nd-degree:** The price paid by a buyer can vary with the quantity demanded
    by the buyer. But all customers face the same price schedule. *E.g.,* bulk-buying
    discounts.'
  merge: -1
  img_proc: true
- pgno: 1479
  md: '# Types of Price Discrimination


    +   ◆ 3rd-degree: Price paid by buyers in a given group is the same for all units
    purchased. But price may differ across buyer groups.

