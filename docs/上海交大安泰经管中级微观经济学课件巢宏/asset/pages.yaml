- pgno: 595
  md: '# Valuing Consols


    PV = x/(1+r) + x/(1+r)^2 + x/(1+r)^3 + ...


    = 1/(1+r) [ x + x/(1+r) + x/(1+r)^2 + ... ]


    = 1/(1+r) [ x + PV ]. Solving for PV gives


    PV = x/r.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_595_0.png)'
  merge: -1
  img_proc: true
- pgno: 596
  md: '# Valuing Consols


    E.g. if r = 0.1 now and forever then the most that should be paid now for a console
    that provides $1000 per year is


    PV = x / r = $1000 / 0.1 = $10,000.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_596_0.png)'
