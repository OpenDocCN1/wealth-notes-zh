- pgno: 530
  md: '# Present and Future Values


    +   - Begin with some simple financial arithmetic.

    +   - Take just two periods; 1 and 2.

    +   - Let r denote the interest rate per period.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_530_0.png)'
  merge: -1
  img_proc: true
- pgno: 531
  md: '# Future Value


    +   - E.g., if r = 0.1 then $100 saved at the start of period 1 becomes $110 at
    the start of period 2.

    +   - The value next period of $1 saved now is the future value of that dollar.'
  merge: -1
  img_proc: true
- pgno: 532
  md: "# Future Value\n\n+   ◆ Given an interest rate *r* the future value one period\
    \ from now of $1 is\n+   \n+   $$FV = 1 + r.$$\n\n+   ◆ Given an interest rate\
    \ *r* the future value one period from now of $m is\n+   \n+   $$FV = m(1 + r).$$\n\
    \n![](img/e3f3f402f74cf453caf4596d2d7d7398_532_0.png)"
  merge: -1
  img_proc: true
- pgno: 533
  md: '# Present Value


    +   - Suppose you can pay now to obtain $1 at the start of next period.

    +   - What is the most you should pay?

    +   - $1?

    +   - No. If you kept your $1 now and saved it then at the start of next period
    you would have $(1+r) > $1, so paying $1 now for $1 next period is a bad deal.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_533_0.png)'
  merge: -1
  img_proc: true
- pgno: 534
  md: '# Present Value


    +   ◆ Q: How much money would have to be saved now, in the present, to obtain
    $1 at the start of the next period?

    +   ◆ A: $m saved now becomes $m(1+r) at the start of next period, so we want
    the value of m for which m(1+r) = 1

    +   That is, m = 1/(1+r),

    +   the present-value of $1 obtained at the start of next period.'
  merge: -1
  img_proc: true
- pgno: 535
  md: "# Present Value\n\n+   ◆ The present value of $1 available at the start of\
    \ the next period is\n+   \n+   $$PV = \\frac{1}{1+r}.$$\n\n+   ◆ And the present\
    \ value of $m available at the start of the next period is\n+   \n+   $$PV = \\\
    frac{m}{1+r}.$$\n\n![](img/e3f3f402f74cf453caf4596d2d7d7398_535_0.png)"
  merge: -1
  img_proc: true
- pgno: 536
  md: "# Present Value\n\n+   E.g., if r = 0.1 then the most you should pay now for\
    \ $1 available next period is\n+   \n+   PV = 1 / (1 + 0.1) = $0.91.\n\n+   And\
    \ if r = 0.2 then the most you should pay now for $1 available next period is\n\
    +   \n+   PV = 1 / (1 + 0.2) = $0.83."
  merge: -1
  img_proc: true
