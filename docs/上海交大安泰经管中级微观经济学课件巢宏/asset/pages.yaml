- pgno: 333
  md: '# The Principle of Revealed Preference


    **The Principle of Revealed Preference.** Let $(x_1, x_2)$ be the chosen bundle
    when prices are $(p_1, p_2)$, and let $(y_1, y_2)$ be some other bundle such that
    $p_1x_1 + p_2x_2 \geq p_1y_1 + p_2y_2$. Then if the consumer is choosing the most
    preferred bundle she can afford, we must have $(x_1, x_2) \succ (y_1, y_2)$.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_333_0.png)'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Indirect Preference Revelation


    ◆ Suppose x is revealed directly preferred to y, and y is revealed directly preferred
    to z. Then, by transitivity, x is revealed indirectly as preferred to z. Write
    this as


    x ≻ᵢ z


    so  x ≻ᴰ y and y ≻ᴰ z  ➜  x ≻ᵢ z.


