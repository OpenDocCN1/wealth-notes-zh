    # ## Logit regression


    $P_{ijt}=1$ if person $i$ placed a bet on number $j$ on spin $t$, 0 otherwise


    $H_{ijt}$ = how many times has number $j$ appeared previous to spin $t$ but while
    person $i$ was at the table minus its expected frequency of appearance $(1-(37/38)^{t-1})$


    $F_{ijt}$ = favorite numbers, % of spins player $i$ has bet on number $j$ previous
    to period $t$


    $L_{ijt}$ = winning chip left on table


