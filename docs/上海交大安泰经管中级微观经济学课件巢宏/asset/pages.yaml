- pgno: 598
  md: '# $ Equivalent Utility Gains


    +   - Suppose gasoline can be bought only in lumps of one gallon.

    +   - Use r₁ to denote the most a single consumer would pay for a 1st gallon --
    call this her reservation price for the 1st gallon.

    +   - r₁ is the dollar equivalent of the marginal utility of the 1st gallon.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_598_0.png)'
  merge: -1
  img_proc: true
- pgno: 599
  md: '# $ Equivalent Utility Gains


    +   - Now that she has one gallon, use $r_2$ to denote the most she would pay
    for a 2nd gallon -- this is her reservation price for the 2nd gallon.

    +   - $r_2$ is the dollar equivalent of the marginal utility of the 2nd gallon.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_599_0.png)'
  merge: -1
  img_proc: true
- pgno: 600
  md: '# $ Equivalent Utility Gains


    +   - Generally, if she already has n-1 gallons of gasoline then rₙ denotes the
    most she will pay for an nth gallon.

    +   - rₙ is the dollar equivalent of the marginal utility of the nth gallon.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_600_0.png)'
  merge: -1
  img_proc: true
- pgno: 601
  md: '# $ Equivalent Utility Gains


    +   ♦ r₁ + ... + rₙ will therefore be the dollar equivalent of the total change
    to utility from acquiring n gallons of gasoline at a price of $0.

    +   ♦ So r₁ + ... + rₙ - p_G n will be the dollar equivalent of the total change
    to utility from acquiring n gallons of gasoline at a price of $p_G each.'
  merge: -1
  img_proc: true
