- pgno: 837
  md: '# Who Uses Auctions?


    +   ◆ Owners of art, cars, stamps, machines, mineral rights etc.

    +   ◆ Q: Why auction?

    +   ◆ A: Because many markets are imperfect and it is hard to discover potential
    buyers’ true valuations of your asset. Auctions help to discover this information.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_837_0.png)'
  merge: -1
  img_proc: true
- pgno: 838
  md: '# Types of Auctions


    +   - **English auction:**

    +     - bids are public announcements

    +     - bid price rises until there are no further bids

    +     - highest bid wins

    +     - winner pays his bid.'
  merge: -1
  img_proc: true
