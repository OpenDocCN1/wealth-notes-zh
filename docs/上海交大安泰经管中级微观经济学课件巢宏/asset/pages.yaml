- pgno: 849
  md: '# # Why Use a Reserve Price?


    +   - Suppose there are 2 buyers.

    +   - The seller believes each buyer’s valuation is $20 with chance 1/2 and $50
    with chance 1/2.

    +   - I.e. with chance 1/4 each, the seller believes she faces buyer valuations
    ($20,$20), ($20,$50), ($50,$20) and ($50,$50)'
  merge: -1
