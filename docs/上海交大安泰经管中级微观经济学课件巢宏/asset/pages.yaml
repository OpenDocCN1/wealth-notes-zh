- pgno: 1105
  md: '# A Cobb-Douglas Example of Cost Minimization


    (a) y = (x₁*)¹/³ (x₂*)²/³      (b) w₁/w₂ = x₂* / (2 x₁*)


    From (b), x₂* = (2 w₁ / w₂) x₁*.


    Now substitute into (a) to get


    y = (x₁*)¹/³ ( (2 w₁ / w₂) x₁* )²/³


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1105_0.png)'
