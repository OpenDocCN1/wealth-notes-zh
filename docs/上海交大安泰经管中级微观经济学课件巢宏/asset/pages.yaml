- pgno: 1104
  md: '# A Cobb-Douglas Example of

    Cost Minimization


    (a) $y=(x_1^*)^{1/3}(x_2^*)^{2/3}$


    (b) $\frac{w_1}{w_2}=\frac{x_2^*}{2x_1^*}$.


    From (b), $x_2^*=\frac{2w_1}{w_2}x_1^*$.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1104_0.png)'
  merge: -1
