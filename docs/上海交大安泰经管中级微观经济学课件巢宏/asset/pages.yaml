  md: "# Budget Constraints Revisited\n\n+   The constraint\n+   \n+   p₁x₁ + p₂x₂\
    \ = p₁ω₁ + p₂ω₂\n+   \n+   is\n+   \n+   p₁(x₁ − ω₁) + p₂(x₂ − ω₂) = 0.\n\n+ \
