  md: '# Endowments


    +   - E.g. $\omega = (\omega_1, \omega_2) = (10,2)$ states that the consumer is
    endowed with 10 units of good 1 and 2 units of good 2.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_487_0.png)'
