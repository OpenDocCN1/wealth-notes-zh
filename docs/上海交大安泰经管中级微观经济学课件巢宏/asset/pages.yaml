- pgno: 1886
  md: '# Walras’ Law


    p₁x₁*ᴬ + p₂x₂*ᴬ = p₁ω₁ᴬ + p₂ω₂ᴬ

    p₁x₁*ᴮ + p₂x₂*ᴮ = p₁ω₁ᴮ + p₂ω₂ᴮ


    # Summing gives


    p₁(x₁*ᴬ + x₁*ᴮ) + p₂(x₂*ᴬ + x₂*ᴮ)

    = p₁(ω₁ᴬ + ω₁ᴮ) + p₂(ω₂ᴮ + ω₂ᴮ).


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1886_0.png)'
  merge: -1
  img_proc: true
- pgno: 1887
  md: '# Walras’ Law


    p₁(x₁*ᴬ + x₁*ᴮ) + p₂(x₂*ᴬ + x₂*ᴮ)

    = p₁(ω₁ᴬ + ω₁ᴮ) + p₂(ω₂ᴮ + ω₂ᴮ).


    Rearranged,


    p₁(x₁*ᴬ + x₁*ᴮ − ω₁ᴬ − ω₁ᴮ) +

    p₂(x₂*ᴬ + x₂*ᴮ − ω₂ᴬ − ω₂ᴮ) = 0.


    That is, ...


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1887_0.png)'
  merge: -1
  img_proc: true
- pgno: 1888
  md: '# Walras’ Law


    $$p_1(x_1^{*A}+x_1^{*B}-\omega_1^A-\omega_1^B)+p_2(x_2^{*A}+x_2^{*B}-\omega_2^A-\omega_2^B)=0.$$


    This says that the summed market value of excess demands is zero for **any** positive
    prices p₁ and p₂ -- this is Walras’ Law.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1888_0.png)'
