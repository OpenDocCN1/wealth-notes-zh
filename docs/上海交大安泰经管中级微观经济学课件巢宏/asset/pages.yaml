- pgno: 515
  md: '# Slutsky’s Equation Revisited


    +   - A change in p₁ or p₂ changes y = p₁ω₁ + p₂ω₂ so there will be an additional
    income effect, called the endowment income effect.

    +   - Slutsky’s decomposition will thus have three components

    +     - a pure substitution effect

    +     - an (ordinary) income effect, and

    +     - an endowment income effect.'
