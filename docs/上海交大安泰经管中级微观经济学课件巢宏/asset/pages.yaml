- pgno: 603
  md: '# $ Equivalent Utility Gains


    +   - The dollar equivalent net utility gain for the 1st gallon is $(r₁ - p_G)

    +   - and is $(r₂ - p_G) for the 2nd gallon,

    +   - and so on, so the dollar value of the gain-to-trade is $(r₁ - p_G) + $(r₂
    - p_G) + ... for as long as rₙ - p_G > 0.'
