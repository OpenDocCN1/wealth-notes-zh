- pgno: 992
  md: '# Economic Profit


    +   ♦ The economic profit generated by the production plan (x₁,...,xₘ,y₁,...,yₙ)
    is

    +   Π = p₁y₁+⋯+pₙyₙ − w₁x₁−⋯wₘxₘ.


