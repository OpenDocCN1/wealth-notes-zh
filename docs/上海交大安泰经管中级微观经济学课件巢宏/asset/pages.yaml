  md: '# Consumer’s Surplus


    That is, choose x₁ to maximize


    V(x₁) + m − p₁x₁.


    The first-order condition is


    V′(x₁) − p₁ = 0


    That is,     p₁ = V′(x₁).


    This is the equation of the consumer’s inverse demand for commodity 1.


