- pgno: 1597
  md: '# Quantity Competition


    Generally, given firm 2’s chosen output level y₂, firm 1’s profit function is


    $$\Pi_1(y_1;y_2)=p(y_1+y_2)y_1-c_1(y_1)$$


    and the profit-maximizing value of y₁ solves


    $$\frac{\partial \Pi_1}{\partial y_1}=p(y_1+y_2)+y_1\frac{\partial p(y_1+y_2)}{\partial
    y_1}-c_1''(y_1)=0.$$


    The solution, y₁ = R₁(y₂), is firm 1’s Cournot-Nash reaction to y₂.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1597_0.png)'
  merge: -1
  img_proc: true
- pgno: 1598
  md: '# Quantity Competition


    Similarly, given firm 1’s chosen output level y₁, firm 2’s profit function is


    Π₂(y₂; y₁) = p(y₁ + y₂) y₂ − c₂(y₂)


    and the profit-maximizing value of y₂ solves


    ∂Π₂/∂y₂ = p(y₁ + y₂) + y₂ ∂p(y₁ + y₂)/∂y₂ − c₂′(y₂) = 0.


    The solution, y₂ = R₂(y₁), is firm 2’s Cournot-Nash reaction to y₁.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1598_0.png)'
