- pgno: 1093
  md: '# Iso-cost Lines


    +   ◆ A curve that contains all of the input bundles that cost the same amount
    is an iso-cost curve.


    +   ◆ E.g., given w₁ and w₂, the $100 iso-cost line has the equation w₁x₁ + w₂x₂
    = 100.'
  merge: -1
  img_proc: true
- pgno: 1094
  md: '# Iso-cost Lines


    +   Generally, given w₁ and w₂, the equation of the $c iso-cost line is

    +   w₁x₁ + w₂x₂ = c

    +   i.e.

    +   x₂ = - w₁/w₂ x₁ + c/w₂.


    +   Slope is - w₁/w₂.'
  merge: -1
