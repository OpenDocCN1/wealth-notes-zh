- pgno: 1087
  md: '# Cost Minimization


    +   - A firm is a cost-minimizer if it produces any given output level y ≥ 0 at
    smallest possible total cost.

    +   - c(y) denotes the firm’s smallest possible total cost for producing y units
    of output.

    +   - c(y) is the firm’s total cost function.'
  merge: -1
  img_proc: true
- pgno: 1088
  md: "# Cost Minimization\n\n+   ◆ When the firm faces given input prices **w** =\
    \ (w₁, w₂, ..., wₙ) the total cost function will be written as\n+   \n+   c(w₁,\
    \ ..., wₙ, y).\n\n![](img/e3f3f402f74cf453caf4596d2d7d7398_1088_0.png)"
  merge: -1
  img_proc: true
- pgno: 1089
  md: '# The Cost-Minimization Problem


    +   - Consider a firm using two inputs to make one output.

    +   - The production function is

    +     y = f(x₁,x₂).

    +   - Take the output level y ≥ 0 as given.

    +   - Given the input prices w₁ and w₂, the cost of an input bundle (x₁,x₂) is

    +     w₁x₁ + w₂x₂.'
  merge: -1
  img_proc: true
- pgno: 1090
  md: '# The Cost-Minimization Problem


    +   ◆ For given w₁, w₂ and y, the firm’s cost-minimization problem is to solve
    min w₁x₁ + w₂x₂

    +   x₁,x₂≥0

    +   subject to f(x₁,x₂) = y.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1090_0.png)'
  merge: -1
  img_proc: true
- pgno: 1091
  md: '# The Cost-Minimization Problem


    +   ♦ The levels x₁*(w₁,w₂,y) and x₂*(w₁,w₂,y) in the least-costly input bundle
    are the firm’s conditional demands for inputs 1 and 2.


    +   ♦ The (smallest possible) total cost for producing y output units is therefore
    c(w₁,w₂,y) = w₁x₁*(w₁,w₂,y) + w₂x₂*(w₁,w₂,y).'
  merge: -1
  img_proc: true
