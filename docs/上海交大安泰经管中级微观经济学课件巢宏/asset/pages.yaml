- pgno: 850
  md: '# Why Use a Reserve Price?


    +   - I.e. with chance 1/4 each, the seller believes she faces buyer valuations
    ($20,$20), ($20,$50), ($50,$20) and ($50,$50).

    +   - Use an English auction.

    +   - Bids must be raised by at least $1.

    +   - With chance 1/4 each, winning bids will be $20, $21, $21 and $50 if there
    is no reserve price.'
  merge: -1
