- pgno: 792
  md: '# Quantity Taxes & Market Equilibrium


    D(p_b) = a − b p_b and S(p_s) = c + d p_s.


    With the tax, the market equilibrium satisfies


    p_b = p_s + t and D(p_b) = S(p_s) so


    p_b = p_s + t and a − b p_b = c + d p_s.


    Substituting for p_b gives


    a − b(p_s + t) = c + d p_s ⇒ p_s = (a − c − b t)/(b + d).


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_792_0.png)'
  merge: -1
  img_proc: true
- pgno: 793
  md: '# Quantity Taxes & Market Equilibrium


    pₛ = (a − c − b t)/(b + d) and p_b = pₛ + t give


    p_b = (a − c + d t)/(b + d)


    The quantity traded at equilibrium is


    qᵗ = D(p_b) = S(pₛ)

    = a + b p_b = (a d + b c − b d t)/(b + d).'
  merge: -1
  img_proc: true
- pgno: 794
  md: '# Quantity Taxes & Market

    Equilibrium


    $$p_s=\frac{a-c-bt}{b+d}$$


    $$q^t=\frac{ad+bc-bdt}{b+d}$$


    $$p_b=\frac{a-c+dt}{b+d}$$


    As $t\to0$, $p_s$ and $p_b\to\frac{a-c}{b+d}=p^*$, the equilibrium price if there
    is no tax ($t=0$) and $q^t\to\frac{ad+bc}{b+d}$, the quantity traded at equilibrium
    when there is no tax.


