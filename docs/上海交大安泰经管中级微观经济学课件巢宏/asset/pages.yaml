- pgno: 422
  md: '# Index Numbers


    +   ◆ Over time, many prices change. Are consumers better or worse off “overall”
    as a consequence?

    +   ◆ Index numbers give approximate answers to such questions.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_422_0.png)'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# # Index Numbers


    +   - **Two basic types of indices**

    +     - price indices, and

    +     - quantity indices

    +   - **Each index compares expenditures in a base period and in a current period
    by taking the ratio of expenditures.**


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_423_0.png)'
  merge: -1
  img_proc: true
- pgno: 424
  md: '# Quantity Index Numbers


    ◆ A quantity index is a price-weighted average of quantities demanded; i.e.


    I_q = (p₁x₁ᵗ + p₂x₂ᵗ) / (p₁x₁ᵇ + p₂x₂ᵇ)


    ◆ (p₁,p₂) can be base period prices (p₁ᵇ,p₂ᵇ) or current period prices (p₁ᵗ,p₂ᵗ).'
  merge: -1
