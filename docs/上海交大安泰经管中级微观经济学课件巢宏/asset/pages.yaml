- pgno: 82
  md: '# Rationality in Economics


    +   ◆ Behavioral Postulate:

    +   A decisionmaker always chooses its most preferred alternative from its set
    of available alternatives.


    +   ◆ So to model choice we must model decisionmakers’ preferences.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_82_0.png)'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# Preference Relations


    +   - **Comparing two different consumption bundles, x and y:**

    +     - **strict preference:** x is more preferred than is y; x ≻ y.

    +     - **indifference:** x is exactly as preferred as is y; x ∼ y.

    +     - **weak preference:** x is as at least as preferred as is y; x ≽ y.'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# Preference Relations


    +   - ◆ x ≽ y and y ≽ x imply x ~ y.

    +   - ◆ x ≽ y and (not y ≽ x) imply x ≻ y.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_84_0.png)'
  merge: -1
  img_proc: true
- pgno: 85
  md: "# Assumptions about Preference Relations\n\n+   ◆ **Completeness:** For any\
    \ two bundles x and y it is always possible to make the statement that either\n\
    +   \n+   \\[\n+   x \\succeq y\n+   \\]\n+   \n+   or\n+   \n+   \\[\n+   y \\\
    succeq x.\n+   \\]\n\n![](img/e3f3f402f74cf453caf4596d2d7d7398_85_0.png)"
  merge: -1
