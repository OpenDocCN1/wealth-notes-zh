  md: '# Own-Price Elasticity


    ε_{X_i^*, p_i} = p_i / X_i^* × dX_i^* / dp_i


    E.g. Suppose p_i = a - bX_i.


    Then X_i = (a - p_i)/b and


    dX_i^* / dp_i = -1 / b. Therefore,


    ε_{X_i^*, p_i} = p_i / ((a - p_i)/b) × (-1 / b) = - p_i / (a - p_i).


