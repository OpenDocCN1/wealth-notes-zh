  merge: -1
  img_proc: true
- pgno: 859
  md: '# Second-Price, Sealed-Bid Auction


    +   - No bidder knows any other bidder’s true valuation of the item for sale.

    +   - Yet, it is individually rational for each bidder to state truthfully his
    own valuation. Why?

    +   - E.g. two bidders with true valuations v₁ and v₂.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_859_0.png)'
  merge: -1
  img_proc: true
- pgno: 860
  md: '# Second-Price, Sealed-Bid

    Auction


    +   - E.g. two bidders with true valuations $v_1$ and $v_2$.

    +   - Bids are $b_1$ and $b_2$.

    +   - Expected gain to bidder 1 is


    $$(v_1-b_2)\Pr(\text{win})+0\times\Pr(\text{lose})$$

    $$=(v_1-b_2)\Pr(b_1\geq b_2).$$'
  merge: -1
  img_proc: true
- pgno: 861
  md: '# Second-Price, Sealed-Bid Auction


    +   - **Expected gain to bidder 1 is**

    +     $(v_1 - b_2)\Pr(b_1 \ge b_2)$.

    +   - **How is this maximized?**

    +   - **If $v_1 > b_2$, then maximize the prob. of winning; i.e. set $b_1 = v_1$.**

    +   - **If $v_1 < b_2$, then minimize the prob. of winning; i.e. set $b_1 = v_1$.**

    +   - **Either way, telling the truth is best!**


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_861_0.png)'
  merge: -1
  img_proc: true
- pgno: 862
  md: '# Second-Price, Sealed-Bid

    Auction


    +   - Since truth-telling is best for every bidder, the highest valuation bidder
    will win.

    +   - Hence the second-price, sealed-bid auction is Pareto-efficient.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_862_0.png)'
  merge: -1
  img_proc: true
- pgno: 863
  md: '# Common-Value Auctions


    +   ♦ The item for sale has the same value to every potential buyer.

    +   ♦ Potential buyers differ in their own estimates of this common value.

    +   ♦ Bidder i’s estimate is $V_i = V + \varepsilon_i$ where $V$ is the common
    value and $\varepsilon_i$ is bidder i’s estimation error.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_863_0.png)'
  merge: -1
  img_proc: true
- pgno: 864
  md: '# Common-Value Auctions


    +   - Bidder i’s estimate is \(V_i = V + \varepsilon_i\), where \(V\) is the common
    value and \(\varepsilon_i\) is bidder i’s estimation error.

    +   - If every bid is truthful, the winner is the bidder with the largest estimation
    error \(\varepsilon_i\).

    +   - So a truthful winner on average pays more than the true value \(V\)—the
    winner’s curse.'
  merge: -1
  img_proc: true
- pgno: 865
  md: '# Common-Value Auctions


    +   ◆ If every bid is truthful, the winner is the bidder with the largest estimation
    error ε_i -- call it ε_i^max


    +   ◆ If ε_i^max > 0 then a truthful winner on average pays more than the true
    value V -- the winner’s curse.


    +   ◆ So bids should on average be less than V in a common-value auction.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_865_0.png)'
  merge: -1
  img_proc: true
