- pgno: 1388
  md: '# Fixed Inputs and Economic Rent


    +   Q: When there is a barrier to entry, will not the firms already in the industry
    make positive economic profits?


    +   A: No. Each firm in the industry makes a zero economic profit. Why?


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1388_0.png)'
  merge: -1
  img_proc: true
- pgno: 1389
  md: '# Fixed Inputs and Economic Rent


    +   ♦ An input (e.g. an operating license) that is fixed in the long-run causes
    a long-run fixed cost, F.

    +   ♦ Long-run total cost, c(y) = F + c_v(y).

    +   ♦ And long-run average total cost, AC(y) = AFC(y) + AVC(y).

    +   ♦ In the long-run equilibrium, what will be the value of F?


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1389_0.png)'
  merge: -1
  img_proc: true
- pgno: 1390
  md: '# Fixed Inputs and Economic Rent


    +   - Think of a firm that needs an operating license -- the license is a fixed
    input that is rented but not owned by the firm.

    +   - If the firm makes a positive economic profit then another firm can offer
    the license owner a higher price for it. In this way, all firms’ economic profits
    are competed away, to zero.'
  merge: -1
  img_proc: true
- pgno: 1391
  md: '# Fixed Inputs and Economic Rent


    So in the long-run equilibrium, each firm makes a zero economic profit and each
    firm’s fixed cost is its payment for its operating license.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1391_0.png)'
  merge: -1
  img_proc: true
