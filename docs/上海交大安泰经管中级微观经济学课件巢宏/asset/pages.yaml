- pgno: 1689
  md: '# Sequential Price Games


    +   ◆ Think of one large firm (the leader) and many competitive small firms (the
    followers).

    +   ◆ The small firms are price-takers and so their collective supply reaction
    to a market price p is their aggregate supply function Y_f(p).


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1689_0.png)'
  merge: -1
  img_proc: true
- pgno: 1690
  md: '# Sequential Price Games


    +   - The market demand function is D(p).

    +   - So the leader knows that if it sets a price p the quantity demanded from
    it will be the residual demand

    +     L(p) = D(p) − Y_f(p).

    +   - Hence the leader’s profit function is

    +     Π_L(p) = p(D(p) − Y_f(p)) − c_L(D(p) − Y_f(p)).


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1690_0.png)'
  merge: -1
  img_proc: true
- pgno: 1691
  md: '# Sequential Price Games


    +   - The leader’s profit function is

    +     Π_L(p) = p(D(p) − Y_f(p)) − c_L(D(p) − Y_F(p))

    +     so the leader chooses the price level p* for which profit is maximized.

    +   - The followers collectively supply Y_f(p*) units and the leader supplies
    the residual quantity D(p*) - Y_f(p*).'
