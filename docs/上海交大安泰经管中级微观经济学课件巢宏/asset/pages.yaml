- pgno: 647
  md: '# Consumer’s Surplus, Compensating Variation and Equivalent Variation


    If          U(x₁, m) = v(x₁) + m          then


    CS(p₁′) = v(x₁′) − v(0) − p₁′x₁′


    and so the change in CS when p₁ rises from p₁′ to p₁″ is


    ΔCS = CS(p₁′) − CS(p₁″)


    = v(x₁′) − v(0) − p₁′x₁′ − [v(x₁″) − v(0) − p₁″x₁″]


