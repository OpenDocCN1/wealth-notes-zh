- pgno: 1184
  md: '# Marginal Cost Function


    ◆ The firm’s total cost function is


    \[

    c(\mathbf{y}) = F + c_v(\mathbf{y})

    \]


    and the fixed cost \(F\) does not change with the output level \(\mathbf{y}\),
    so


    \[

    MC(\mathbf{y}) = \frac{\partial c_v(\mathbf{y})}{\partial \mathbf{y}} = \frac{\partial
    c(\mathbf{y})}{\partial \mathbf{y}}.

    \]


    ◆ MC is the slope of both the variable cost and the total cost functions.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1184_0.png)'
  merge: -1
  img_proc: true
- pgno: 1185
  md: '# Marginal and Variable Cost Functions


    ◆ Since MC(y) is the derivative of cᵥ(y), cᵥ(y) must be the integral of MC(y).
    That is,


    $$MC(y)=\frac{\partial c_v(y)}{\partial y}$$


    $$\Rightarrow\quad c_v(y)=\int_0^y MC(z)\,dz.$$'
