- pgno: 851
  md: '# Why Use a Reserve Price?


    +   - With chance 1/4 each, winning bids will be $20, $21, $21 and $50 if there
    is no reserve price.


    +   - Seller’s expected revenue is ($20 + $21 + $21 + $50)/4 = $28 with no reserve
    price.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_851_0.png)'
  merge: -1
  img_proc: true
- pgno: 852
  md: '# Why Use a Reserve Price?


    +   - With chance 1/4 each, the seller believes she faces buyer valuations ($20,$20),
    ($20,$50), ($50,$20) and ($50,$50).

    +   - Set a reserve price of $50.

    +   - With chance 1/4 there will be no sale.

    +   - With chance 3/4 the winning bid will be $50.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_852_0.png)'
  merge: -1
  img_proc: true
- pgno: 853
  md: '# Why Use a Reserve Price?


    +   - Set a reserve price of $50.

    +   - With chance 1/4 there will be no sale.

    +   - With chance 3/4 the winning bid will be $50.

    +   - Seller’s expected revenue is

    +     3/4 × $50 + 1/4 × $0 = $37.50 > $28.'
  merge: -1
  img_proc: true
