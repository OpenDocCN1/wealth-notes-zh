- pgno: 717
  md: '# Marginal Revenue and Own-Price Elasticity of Demand


    A seller’s marginal revenue is the rate at which revenue changes with the number
    of units sold by the seller.


    ```

    MR(q) = dR(q)/dq

    ```


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_717_0.png)'
  merge: -1
  img_proc: true
- pgno: 718
  md: '# Marginal Revenue and Own-Price Elasticity of Demand


    p(q) denotes the seller’s inverse demand function; i.e. the price at which the
    seller can sell q units. Then


    R(q) = p(q) × q


    so

    MR(q) = dR(q)/dq = [dp(q)/dq] q + p(q)


    = p(q) [ 1 + (q / p(q)) dp(q)/dq ] .'
  merge: -1
  img_proc: true
- pgno: 719
  md: '# Marginal Revenue and Own-Price Elasticity of Demand


    $$MR(q)=p(q)\left[1+\frac{q}{p(q)}\frac{dp(q)}{dq}\right].$$


    and  $$\varepsilon=\frac{dq}{dp}\times\frac{p}{q}$$


    so  $$MR(q)=p(q)\left[1+\frac{1}{\varepsilon}\right].$$


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_719_0.png)'
  merge: -1
  img_proc: true
- pgno: 720
  md: '# Marginal Revenue and Own-Price Elasticity of Demand


    MR(q) = p(q)\left[1 + \frac{1}{\varepsilon}\right] says that the rate at which
    a seller’s revenue changes with the number of units it sells depends on the sensitivity
    of quantity demanded to price; i.e., upon the own-price elasticity of demand.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_720_0.png)'
  merge: -1
  img_proc: true
- pgno: 721
  md: '# Marginal Revenue and Own-Price Elasticity of Demand


    MR(q) = p(q)[1 + 1/ε]


    If ε = -1    then  MR(q) = 0.


    If -1 < ε ≤ 0 then  MR(q) < 0.


    If ε < -1    then  MR(q) > 0.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_721_0.png)'
  merge: -1
  img_proc: true
- pgno: 722
  md: '# Marginal Revenue and Own-Price Elasticity of Demand


    If ε = −1 then MR(q) = 0. Selling one more unit does not change the seller’s revenue.


    If −1 < ε ≤ 0 then MR(q) < 0. Selling one more unit reduces the seller’s revenue.


    If ε < −1 then MR(q) > 0. Selling one more unit raises the seller’s revenue.'
  merge: -1
  img_proc: true
