- pgno: 1409
  md: '# Marginal Revenue


    Marginal revenue is the rate-of-change of revenue as the output level y increases;


    MR(y) = d/dy (p(y) y) = p(y) + y dp(y)/dy.'
  merge: -1
  img_proc: true
- pgno: 1410
  md: '# Marginal Revenue


    Marginal revenue is the rate-of-change of revenue as the output level y increases;


    MR(y) = d/dy (p(y) y) = p(y) + y dp(y)/dy .


    dp(y)/dy is the slope of the market inverse demand function so dp(y)/dy < 0. Therefore


    MR(y) = p(y) + y dp(y)/dy < p(y)


    for y > 0.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1410_0.png)'
  merge: -1
  img_proc: true
- pgno: 1411
  md: '# Marginal Revenue


    E.g. if p(y) = a - by then

    R(y) = p(y)y = ay - by²

    and so

    MR(y) = a - 2by < a - by = p(y) for y > 0.


