- pgno: 1920
  md: '# Near Misses (Near Wins)


    # Gambling


    > “a special kind of failure to reach a goal, one that comes close to being successful”
    (Reid 1986)


    > “a failure that was close to a win” (Harrigan 2008)


    # Industrial accidents


    > “the outcome is non-hazardous, but a hazardous or fatal outcome could have occurred”
    (Dillon and Tinsley 2005)


    “Aww Shucks” / “That was a close one!” (Locke 2001)'
