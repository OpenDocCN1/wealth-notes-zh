- pgno: 1437
  md: '# A Profits Tax Levied on a Monopoly


    +   - A profits tax levied at rate t reduces profit from Π(y*) to (1-t)Π(y*).

    +   - Q: How is after-tax profit, (1-t)Π(y*), maximized?

    +   - A: By maximizing before-tax profit, Π(y*).


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_1437_0.png)'
  merge: -1
  img_proc: true
- pgno: 1438
  md: '# A Profits Tax Levied on a Monopoly


    +   - A profits tax levied at rate t reduces profit from Π(y*) to (1-t)Π(y*).

    +   - Q: How is after-tax profit, (1-t)Π(y*), maximized?

    +   - A: By maximizing before-tax profit, Π(y*).

    +   - So a profits tax has no effect on the monopolist’s choices of output level,
    output price, or demands for inputs.

    +   - I.e. the profits tax is a neutral tax.'
  merge: -1
  img_proc: true
- pgno: 1439
  md: '# Quantity Tax Levied on a Monopolist


    +   - A quantity tax of $t/output unit raises the marginal cost of production
    by $t.

    +   - So the tax reduces the profit-maximizing output level, causes the market
    price to rise, and input demands to fall.

    +   - The quantity tax is distortionary.'
