- pgno: 1787
  md: '# Exchange


    +   - Two consumers, A and B.

    +   - Their endowments of goods 1 and 2 are ω^A = (ω₁^A, ω₂^A) and ω^B = (ω₁^B,
    ω₂^B).

    +   - E.g. ω^A = (6,4) and ω^B = (2,2).

    +   - The total quantities available are ω₁^A + ω₁^B = 6 + 2 = 8 units of good
    1 and ω₂^A + ω₂^B = 4 + 2 = 6 units of good 2.'
  merge: -1
  img_proc: true
