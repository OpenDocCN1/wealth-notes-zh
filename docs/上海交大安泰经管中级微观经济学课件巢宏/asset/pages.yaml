  md: '# The Firm’s Long-Run Supply Decision


    +   ♦ A competitive firm’s long-run profit function is

    +   Π(y) = py − c(y).

    +   ♦ The long-run cost c(y) of producing y units of output consists only of variable
    costs since all inputs are variable in the long-run.'
