- pgno: 563
  md: '# Intertemporal Choice


    **p₂c₂ = m₂ + (1 + r)(m₁ − p₁c₁)**


    **rearranged is**


    **(1 + r)p₁c₁ + p₂c₂ = (1 + r)m₁ + m₂.**


    This is the “future-valued” form of the budget constraint since all terms are
    expressed in period 2 values. Equivalent to it is the “present-valued” form


    $p_1c_1 + \frac{p_2}{1+r}c_2 = m_1 + \frac{m_2}{1+r}$


    where all terms are expressed in period 1 values.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_563_0.png)'
