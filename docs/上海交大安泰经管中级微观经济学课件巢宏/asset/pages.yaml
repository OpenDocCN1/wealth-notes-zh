- pgno: 294
  md: '# Homotheticity


    +   - A consumer’s preferences are homothetic if and only if

    +     $(x_1,x_2) \prec (y_1,y_2) \Leftrightarrow (kx_1,kx_2) \prec (ky_1,ky_2)$

    +     for every $k > 0.$


    +   - That is, the consumer’s MRS is the same anywhere on a straight line drawn
    from the origin.'
  merge: -1
  img_proc: true
