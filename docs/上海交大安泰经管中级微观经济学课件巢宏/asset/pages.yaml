  md: "# Revealed Profitability\n\n**The firm’s technology set must lie under all\
    \ the iso-profit lines**\n\n![](img/e3f3f402f74cf453caf4596d2d7d7398_1081_0.png)\n\
    \n`(x′, y′)` is chosen at prices `(w′, p′)` so  \n`p′y′ − w′x′ ≥ p′y″ − w′x″.`\n\
    \n`(x″, y″)` is chosen at prices `(w″, p″)` so  \n`p″y″ − w″x″ ≥ p″y′ − w″x′.`"
