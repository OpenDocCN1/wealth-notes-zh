  md: '# Goods, Bads and Neutrals


    +   - A good is a commodity unit which increases utility (gives a more preferred
    bundle).

    +   - A bad is a commodity unit which decreases utility (gives a less preferred
    bundle).

    +   - A neutral is a commodity unit which does not change utility (gives an equally
    preferred bundle).'
