- pgno: 569
  md: '# Price Inflation


    +   ♦ Define the inflation rate by π where p₁(1 + π) = p₂.


    +   ♦ For example,

    +   π = 0.2 means 20% inflation, and

    +   π = 1.0 means 100% inflation.'
  merge: -1
  img_proc: true
- pgno: 570
  md: '# Price Inflation


    +   - We lose nothing by setting p₁=1 so that p₂ = 1+ π.

    +   - Then we can rewrite the budget constraint

    +     p₁c₁ + (p₂ / 1+r) c₂ = m₁ + (m₂ / 1+r)

    +     as

    +     c₁ + ((1+π) / 1+r) c₂ = m₁ + (m₂ / 1+r)'
  merge: -1
  img_proc: true
- pgno: 571
  md: '# Price Inflation


    c₁ + (1 + π)/(1 + r) c₂ = m₁ + m₂/(1 + r)


    rearranges to


    c₂ = - (1 + r)/(1 + π) c₁ + [(1 + r)m₁ + m₂]/(1 + π)


    so the slope of the intertemporal budget constraint is


    - (1 + r)/(1 + π)'
  merge: -1
  img_proc: true
- pgno: 572
  md: '# Price Inflation


    +   ◆ When there was no price inflation (p₁=p₂=1) the slope of the budget constraint
    was -(1+r).

    +   ◆ Now, with price inflation, the slope of the budget constraint is -(1+r)/(1+
    π). This can be written as


    −(1 + ρ) = − (1 + r) / (1 + π)


    ρ is known as the real interest rate.'
  merge: -1
  img_proc: true
- pgno: 573
  md: '# Real Interest Rate


    ```

    -(1 + ρ) = - (1 + r)/(1 + π)

    ```


    gives


    ```

    ρ = (r - π)/(1 + π).

    ```


    For low inflation rates (π ≈ 0), ρ ≈ r - π. For higher inflation rates this approximation
    becomes poor.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_573_0.png)'
  merge: -1
  img_proc: true
