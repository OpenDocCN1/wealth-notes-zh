- pgno: 619
  md: '# Consumer’s Surplus


    The consumer’s utility function is quasilinear in x₂.


    U(x₁, x₂) = v(x₁) + x₂


    Take p₂ = 1. Then the consumer’s choice problem is to maximize


    U(x₁, x₂) = v(x₁) + x₂


    subject to


    p₁x₁ + x₂ = m.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_619_0.png)'
