- pgno: 993
  md: '# Economic Profit


    +   - Output and input levels are typically flows.

    +   - E.g. x₁ might be the number of labor units used per hour.

    +   - And y₃ might be the number of cars produced per hour.

    +   - Consequently, profit is typically a flow also; e.g. the number of dollars
    of profit earned per hour.'
  merge: -1
