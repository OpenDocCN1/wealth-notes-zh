- pgno: 58
  md: '# Budget Constraints - Price Changes


    +   Reducing the price of one commodity pivots the constraint outward. No old
    choice is lost and new choices are added, so reducing one price cannot make the
    consumer worse off.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_58_0.png)'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Budget Constraints - Price Changes


    +   ◆ Similarly, increasing one price pivots the constraint inwards, reduces choice
    and may (typically will) make the consumer worse off.


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_59_0.png)'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# Uniform Ad Valorem Sales Taxes


    +   ♦ An ad valorem sales tax levied at a rate of 5% increases all prices by 5%,
    from p to (1+0.05)p = 1.05p.

    +   ♦ An ad valorem sales tax levied at a rate of t increases all prices by tp
    from p to (1+t)p.

    +   ♦ A uniform sales tax is applied uniformly to all commodities.'
  merge: -1
  img_proc: true
- pgno: 61
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 62
  md: "# Uniform *Ad Valorem* Sales Taxes\n\n+   ◆ A uniform sales tax levied at rate\
    \ *t* changes the constraint from\n+   \n+   p₁x₁ + p₂x₂ = *m*\n+   \n+   to\n\
    +   \n+   (1+*t*)p₁x₁ + (1+*t*)p₂x₂ = *m*\n+   \n+   i.e.\n+   \n+   p₁x₁ + p₂x₂\
    \ = *m*/(1+*t*)."
  merge: -1
  img_proc: true
