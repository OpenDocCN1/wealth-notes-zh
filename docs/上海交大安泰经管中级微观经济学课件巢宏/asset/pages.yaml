- pgno: 10
  md: '# Taxation Policy Analysis


    +   - Local government taxes apartment owners.

    +   - What happens to

    +     - price

    +     - quantity of apartments rented?

    +   - Is any of the tax “passed” to renters?


    ![](img/e3f3f402f74cf453caf4596d2d7d7398_10_0.png)'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Taxation Policy Analysis


    +   - Market supply is unaffected.

    +   - Market demand is unaffected.

    +   - So the competitive market equilibrium is unaffected by the tax.

    +   - Price and the quantity of apartments rented are not changed.

    +   - Landlords pay all of the tax.'
  merge: -1
  img_proc: true
