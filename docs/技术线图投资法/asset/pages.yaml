  md: '# 若「K 線」是樹，

    「均線」就是森林


    # 光看 K 線，無法了解行情走勢


    前文提到可以看K線了解股價走勢。但光看K線無法精準交易。


    這是因為K線出現在上漲中、下跌中，還是作頭區、打底區等，會影響後續的股價變動。例如出現在打底區的紅 K 線可能暗示即將反彈上漲，但在股價漲個不停時出現的紅
    K 線，可能就表示進入作頭區了，明天說不定就反轉向下了。


    股票投資要獲利，必須知道價格波動的趨勢（方向）。只看 K 線圖可能陷入「見樹不見林」的窘境。而均線就是看見大局的必要工具。


    # 五條均線代表不同日期的重要關卡


    在相場流投資術中，原則上會使用五條均線。設定是 5 日、20


    > *在股票術語中，頭部代表賣出訊號，是價格連續下跌形成的圖形，而底部是價格連續上漲前行程的圖形，是買進的訊號。'
