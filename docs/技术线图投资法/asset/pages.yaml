- pgno: 26
  md: '就算業績、本益比（P/E Ratio）、股價淨值比（P/B Ratio）等數字真的很漂亮，光靠這些數值決定「要買賣這檔個股」，我想這種交易方式很難讓散戶累積出令人滿意的資產。


    因為不只基本面因素會影響股價，投資人的鑽牛角尖和心理、欲望也會左右股價。


    # 股價波動看供需


    經濟學家凱因斯在自己的著作中，批評投資人的行為「和選美投票一樣」。他所謂的「選美投票」就是從100張照片中，投票給自己認為是「美人」的女性，主辦單位會發獎金給得票最多的女性。凱因斯認為這種投票方式，大家投的不是「自己認為美」的女性，而是投給「一般人認為美」的女性，他力主投資人也有一樣的行為模式。


    這到底是什麼意思呢？我用股票投資來說明。


    就算自己因為業績好而打算買進這檔股票，但其他投資人沒有一樣的想法，股價還是不會漲。反而是要去預測並買進大多數投資人想買的個股，才能獲利。


    供需左右股價波動。所謂供需，其實就是買方和賣方的角力關係。供需會受到投資人的心理，如「買的人好像很多，我也來買吧」、「漲太高了，該賣了」影響。


    這麼一來，其實就和選美投票的心理一樣，也就可以說只要看'
