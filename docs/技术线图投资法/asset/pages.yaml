  md: '# 【圖解】日本股神壓箱嚴務的 技術線圖投資法


    ![](img/7d8739be94e45f3207e2174a81662558_44_0.png)


    # 均線可自高處俯瞰市場行情


    均線線如其名，就是求出某段期間的平均股價，然後連結而成的線條。


    我以 5 日均線為例來說明。


    加總 4 日前、3 日前、2 日前、1 日前和當日的收盤價，然後除以 5，就是當日的 5 日均價。每日計算當日的 5 日均價，把得出的數值連成一條線。


    換言之，均線可以看出那段期間中的平均收盤價。當均線呈現左下右上的走勢時，就表示股價每日上漲；呈現左上右下走勢時，就表示每日下跌。所以只要看均線的傾斜狀況，就很容易判斷趨勢是漲還是跌。


    再看看均線和 K 線的位置關係。當 K 線位於均線之上，可說表示買氣強勁（多頭市場），K 線位於均線之下，表示賣壓沉重（空頭市場）。連接過去平均收盤價而成的均線，會略微落後目前的
    K'
