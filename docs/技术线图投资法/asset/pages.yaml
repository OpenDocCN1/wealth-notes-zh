  md: '靠幾天的短期買賣，來獲利的「散彈槍」投資手法來說，實在不能說合適。


    所以，我也針對是否有能儘早掌握漲跌趨勢起點的均線，進行研究。


    均線其實是把一定期間的平均收盤價畫成圖表的結果。期間越短的均線，反應股價波動的速度就越快。所以我想試著運用期間比5日、20日更短的均線。然而期間太短波動又太劇烈，反而難以掌握股價變化。


    經過不斷地研究，我設定了約為5日線一半的3日線、20日線一半的10日線，以及幾乎是5日線和10日線中間的7日線（因為5日和10日之間距離太長）。


    7日線其實是「職人直覺」所導出的結果。就像木工或鐵工職業人，在進行最後0.1mm單位的調整時，會仰賴自己雙手的觸感一樣。我試過許多均線後，最後再用自己的雙眼確認，導出「就是它了！」的均線，也就是7日線。


    我立刻在30年間的日經指數圖上，加入3日線、5日線、7日線、10日線，結果出現極為優美的股價波動圖，更容易了解趨勢。而且可以更精準地掌握趨勢的起點。


    當然不光是日線，週線和月線也可以早一步察覺趨勢轉換的起點。只要把週線設定為3週、5週、7週，把月線設定為3個月、5個月、7個月即可。'
