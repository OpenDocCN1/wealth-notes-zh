    # 用於預測趨勢的 3、7、10 日線


    股價有趨近均線的傾向。均線向上發展時，即使股價下跌，也不過是暫時的現象，最終還是會跟著均線向上發展。反之，均線向下發展時，股價自然也會下跌。


    也就是說，股價大多追隨著均線趨勢而動。因此買賣股票時只要搭上均線發展的順風車，自然可以從中獲利。


    前文已經以 5 日線和 20 日線為例說明均線的技巧，除此之外，還有其他用來預測趨勢的均線，也就是 3 日線、7 日線和 10 日線。


