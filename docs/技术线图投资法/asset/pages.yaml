  md: '# 屁股（反巴爾坦）


    確認底部跟在趨勢後頭起哄！


    ![](img/7d8739be94e45f3207e2174a81662558_151_0.png)


    # 可用 4 根 K 線確認底部


    巴爾坦是在作頭區看跌的訊號，屁股則相反，所以也可以稱呼其為反巴爾坦。但在我眼裡，W 型就很容易看成屁股，所以就命名為屁股了。這個訊號也要用收盤價曲線來確認。以
    K 線圖的排列來說，就是黑 K 線→紅 K 線→黑 K 線→紅 K 線。只要這 4 根 K 線即可預測底部，所以會比雙重底（W 型底）更早察覺趨勢的轉換。


    由下跌要轉為上漲，低點必須不斷地創新高。第二個底部在還未到第一個底部的低點時就反彈向上，若又突破了第一個底部上漲後的高點（頸線），趨勢就可能轉換。屁股線型出現，在轉換成上漲趨勢時，是低價買進的好時機。'
  merge: -1
  img_proc: true
