  md: '# 18 A局面、B局面、C局面


    價格波動反覆上漲、盤整、下跌


    ![](img/7d8739be94e45f3207e2174a81662558_157_0.png)


    # 股價走勢就是上漲、下跌、盤整


    股價走勢有三種，也就是上漲、下跌和「盤整」。


    所謂盤整，就是沒有大漲也沒有大跌，持續著上下小波動的狀態。就像是螃蟹橫行一樣的狀態。


    也可以說就是沒有方向感，不會向上突破或向下跌破的發展。


    那麼股價事實上是這樣波動的呢？


    我針對東證一部上市的400檔個股，調查了每檔個股30年間的線圖，總計調查了12,000年分的線圖。


    結果我發現了一些特定的模式。也就是股價下跌和上漲之間，會有盤整期。


    # 股價反覆出現 A 局面、B 局面、C 局面


    股價波動的基本模式如下：'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 下跌→盤整→上漲


    針對這三種波動，我把下跌稱為A局面，盤整為B局面，上漲則為C局面。股價波動就是A面。股價的反覆出現。也就是說股價由A局面（下跌）發展至B局面（盤整），然後到C局面（上漲），觸頂後又回到B局面。


    用ABC局面來看股價發展，就更容易了解股價趨勢，考慮買賣時機。


    # 順勢操作買賣


    例如由B局面發展至C局面時就下買單。相反地，由B局面發展至A局面時就佈局賣出。


    可能會有說「這不是癡話嗎」，但事實上，股價明明在C局面中途，還是有人覺得「不應該漲這麼高」而佈局賣空，結果就虧大了。


    買賣時必須冷靜地判斷局面。


    B局面就是買賣雙方勢力互相抗衡的局面。持續下跌後有投資人認為差不多要觸底了，而下買單或賣空回補，反之也有投資人認為還會再跌而下買單，市場上充斥著兩種完全反向的操作。相反地，當持續上漲時，也會有獲利了結、加碼買進、認為已到頭部而賣空等操作盡出。這麼一來股價就會在一定區間內來回，呈現盤整局面。


    在盤整的B局面中，也可以看準價格波動的上限，在高點賣'
