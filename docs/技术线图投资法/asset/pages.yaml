- pgno: 35
  md: '![](img/7d8739be94e45f3207e2174a81662558_35_0.png)


    # 紅 K 線、黑 K 線、影線就是判斷趨勢資訊


    接著說明一些，可供大家推測漲跌等趨勢的代表性 K 線形狀。


    表示漲勢強勁的 K 線是長紅 K 線，實體很長，影線很短。一眼看去是不是讓人覺得投資人買氣勢如虹呢？


    下影線比實體長的紅 K 線，表示股價下跌後又反彈上漲，以高點作收，這也表示買勢強勁。長紅 K 線的相反就是實體長的黑 K 線（長黑 K 線），看得出貨氣沸騰。對賣方來說或許是很有氣勢的
    K 線，但卻表示市場行情疲軟。有上影線的黑 K 線也表示雖然盤中上漲，卻在收盤時失速，下跌作收。


    十字線表示雖有上下波動，但結果仍舊不變。看得出來投資人一個頭兩個大，不知到底該買還是該賣。


    還有一種 K 線的日文名稱很不利吉，稱為墓塔，也就是倒 T 字型 K 線。這是沒有下影線的十字線，也就是急漲後急跌，收盤價同開盤價，表示買方氣勢無法持續的形狀。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '| 名稱 | 形狀 | 意義 |

    | --- | --- | --- |

    | 長紅 K 線 | （見圖） | 實體比影線長的紅 K 線。股價收在高點，表示多頭強勢，可期待繼續上漲。 |

    | 長黑 K 線 | （見圖） | 實體比影線長的黑 K 線。股價收在低點，表示賣壓強勁，行情不佳。 |

    | 小紅 K 線 | （見圖） | 實體短，也有影線。是局勢不明，盤整局面常見的紅 K 線，如果連續出現也可能演變成長紅 K 線。 |

    | 小黑 K 線 | （見圖） | 實體短，也有影線。收盤價低於開盤價，看得出投資人氣勢萎靡，或有迷惘。常出現於盤整局面。 |

    | 有下影線的紅 K 線 | （見圖） | 下影線比實體長的紅 K 線。開盤價偏低，但買氣集中以高點作收。如果出現在下跌趨勢中表示可能要打底。 |

    | 有下影線的黑 K 線 | （見圖） | 下影線比實體長的黑 K 線。雖然大跌，最後卻回升到收盤價。表示跌勢暫停，可能反彈上漲。 |

    | 有上影線的紅 K 線 | （見圖） | 上影線比實體長的紅 K 線。雖然開高卻無法持續，漲勢出現陰影。可推測即將反轉向下跌入盤整局面。 |

    | 有上影線的黑 K 線 | （見圖） | 盤中觸及高點卻以低點作收。看得出投資人的失望。出現在上漲趨勢時可預測即將做頭反轉，出現在下跌趨勢時則可預測將繼續下跌。
    |

    | 十字線（十字星 K 線） | （見圖） | 收盤價等於開盤價。沒有實體的 K 線。會出現在行情轉換期。 |

    | 墓碑（倒十字型 K 線） | （見圖） | 長長的上影線表示多頭勢力占上風，但空頭勢力逆襲，結果以開盤價作收。股價觸及高點後遭大量賣出，空頭勢力占上風。
    |


    # 圖表 2 各種 K 線形狀'
