  md: '飛的 K 線排列，平空頭倉，加碼多頭部位等。兩區操作完全相反。


    因此我們必須判斷這種 K 線，是出現在作頭區還是打底區。可是到底是高點還是低點，卻要事後才能弄清楚。所以「如果出現在作頭區（打底區）」根本是沒有意義的條件。


    結論就是還是必須畫出均線，檢討均線位置和 K 線，與前一波高點、低點之間的關係。這麼做才能大致判定，目前股價位置到底是在作頭區內還是打底區內。


    可是這麼一來就會出現令人遺憾的結論，也就是「夜星」無法單獨運用在投資交易中。'
