    驗證標的：三井住友FG（週線）


    出現次數：7次（符合定義上漲只有3次）


    # 有故事的「紅三兵」不一定會漲


    不停下跌後，以為進入打底區時，突然出現 3 根紅K線。此時的上漲被推論成「上漲行情的初期」，我可以理解這種想法。可是


    ![](img/7d8739be94e45f3207e2174a81662558_65_1.png)


    # 特徵&定義


    在打底區持續盤整時，連續出現 3 根短紅 K 線。當股價連漲三天，就有可能進入上漲行情。因為常出現強勁的行情，可能是買進的訊號。


    圖表13 紅三兵'
