  md: '# 03 鳥嘴（上漲趨勢）


    根據雞鳴察覺股價將起飛


    ![](img/7d8739be94e45f3207e2174a81662558_110_0.png)


    # 由均線的形狀就能知道反彈向上的轉換點


    鳥嘴看的不是K線形狀，而是看5日和20日均線的形狀，來預測趨勢的轉換。向上的20日線被原在下方的5日線突破，就可說是轉換成上漲趨勢的預兆。


    請看下圖。原在下方的5日線向上穿過20日線。這和黃金交叉有什麼不同呢？


    ![](img/7d8739be94e45f3207e2174a81662558_110_1.png)


    圖表60 「鳥嘴」示意圖'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 這個線型和黃金交叉的不同之處


    烏嘴的 5 日線和 20 日線都朝上，這一點很重要。此外，交叉點形成明顯的銳角，有如烏嘴。因為 5 日線向上突破了已經朝上的 20 日線，表示漲勢強勁。


    另一方面，黃金交叉在 20 日線持平或向下時仍成立。因此雖有交叉，偶爾還是會出現股價盤整、或股價早已飆漲、或立刻反轉向...等。烏嘴則大多出現在上漲趨勢的初期，只要進場買進，獲利可期，精準度可說高於黃金交叉。


    # 烏嘴前夜出現下半身時，可考慮進場


    常常在烏嘴出現在 5 日線的平均值高於 20 日線平均值之前，就已經出現下半身的線型。因此，當 5 日線向上且出現下半身時，就可以進一步確認 20 日線是否朝上。如果
    20 日線看起來也要反轉向上了，就可預測烏嘴即將出現，可考慮買進。


    ![](img/7d8739be94e45f3207e2174a81662558_111_0.png)


    所謂黃金交叉，指的是股價下跌後短期均線由下而上突破長期均線的現象。反之，死亡交叉指的則是股價上漲後，短期均線由上而下穿過長期均線的現象。'
  merge: -1
  img_proc: true
