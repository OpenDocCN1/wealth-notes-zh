  md: '# 10  反 N 大（下跌趨勢）


    5 日線被 20 日線阻擋後直直落


    ![](img/7d8739be94e45f3207e2174a81662558_133_0.png)


    # 5 日線上漲，被 20 日線阻擋後下跌


    N 大是 5 日線很有元氣地先漲後跌，然後再漲的線型，反 N 大則是有氣無力的 5 日線描繪出的線型。


    5 日線、20 日線依序由上而下排列，5 日線反轉向下，由上而下穿過 20 日線。原以為要就此進入下跌趨勢了，5 日線卻又反轉向上。可是在接近 20 日線時卻開始疲軟，再次反轉向下。這就是反
    N 大的線型，看起來像 N 倒過來，因此才有了這個命名。


    反 N 大中 20 日線成為阻力線，阻擋了 5 日線和股價的上漲。而被 20 日線阻擋的 5 日線則加速下跌。當被 20 日線阻擋時出現黑 K 線，就可說是賣空獲利的機會。'
