  md: '線後出現長黑K線，而且是連續3根黑K線，這段期間內共出現過2次。在我漫長的投資生涯中只出現過2次……


    這樣的訊號無法運用在投資操作中。


    # ### 連續出現 3 根黑 K 線，的確可說行情不佳


    我也仔細想了一下三隻烏鴉*的定義。為什麼定義中要強調開盤價要高於前一根K線的收盤價？


    > 「開高卻以低於前一根K線收盤價的價格作收。這種價格波動在一波漲勢後連續出現 3 根……行情不佳的象徵」


    這就是理論基礎。我懂這種心情，這種想法也沒錯。可是幾乎沒有符合這個條件的線型。我只能說這是「先有結論」，再找理由。


    # ### 晨星和三隻烏鴉，都是三根黑 K 線的線型


    接著我們來看看前面驗證過的「晨星」線型。都是三根黑K線，和三隻烏鴉的線型一樣。可是晨星卻說跳空出現星就會反轉向上。


    一樣的線型，完全相反的預測。


    那是因為自古以來都說晨星出現在打底區，三隻烏鴉出現在作頭區。可是驗證晨星時也說過，這些訊號到底出現在打底區還是


    三隻烏鴉又稱為「黑三兵」。黑色烏鴉是不吉利的象徵，所以才有這種命名。'
