  md: '術分析，以成為股市職人為目標，日復一日，努力不懈的經驗。希望我的經驗可以成為想成為股市職人的各位，成長茁壯的參考！同時我也希望大家能理解，我在自己的著作和讀書會上提及的各種技術，都是我自身實際體驗和學習鍛鍊的所得。


    # 徹底改變我的人生事件


    當我知道線圖存在的那一天，至今我仍記憶猶新。如果沒發生那件事，可說現在就不會有相場師朗的存在。三十多年前那個時代，根本沒人可以想像得到，未來任何人都可以在網絡上買賣股票。


    當時我還是正值青春的 20 歲學生。腦袋裡想的不外乎是怎麼做才能認識美女、交個美女當女朋友……想是這麼想，但我是一個耿直又單純的學生，連開口和女生說話都需要極大的勇氣。有一天我想著：「看看電視殺殺時間吧！」就走向客廳。一打開客廳的門，看到爸爸慌慌張張地把不知什麼藏到椅子靠墊後方，看起來好像是一本筆記本。


    > 「爸爸藏起來的東西……是不能給別人看的東西嗎？是被別人看到很丟臉的東西嗎？一定是這樣沒錯！」


    身為身心健全的男學生，我的想像不斷發酵，忍不住想確認爸爸藏起來的東西到底是什麼。我腦海中充斥著說不定是養眼的寫真集等幻想，不過爸爸當然完全不知道，還一副沒事的样子，就這麼站起來走出客廳。


    這真是天賜良機！'
