  md: '![](img/7d8739be94e45f3207e2174a81662558_23_0.png)


    # 常把股價數字搞得太複雜


    頭腦好的人可能就會開始想為什麼會止跌？為什麼會觸頂？


    他們會著手調查是否出現什麼經濟指標、發生什麼事件或社會現象，以調查數字的背景。甚至是企業業績、美國就業統計資料、美金日圓匯率、國際情勢等。桌上堆積如山的資料，包含了報紙、財報、白書、報告等，然後五、六個人就努力研讀，開始預測股價走勢。


    明明只看股價數字就可以判斷股價趨勢和走向，他們的做法只是讓事情越來越複雜。如果志成成為經濟學家也就算了，可是我們明明只是想靠投資賺錢而已……


    # 不需要探索經濟狀況的基本面分析


    經濟指標也好，結算結果也罷，最終都會反映在股價上。所以只看股價數字判斷，也可以獲利。探究影響股價的原因究竟有什麼意義呢？我開始覺得「是不是根本不需要基本面分析？」'
  merge: -1
  img_proc: true
- pgno: 24
  md: '研習結束後，我終於開始實際進場買賣股票。學生時代我就有過光看 K 線圖買賣日本郵船股票而獲利的經驗，所以我以為在金融機關也只要依樣畫葫蘆即可。


    我真是大錯特錯。


    # 判斷買賣時機，不必做複雜的企業分析


    決定買賣某檔個股前，必須分析該公司的財報和營運計畫，讀調查公司提供的報告，判斷成長性等。有時還必須去見該公司的幹部或財務負責人，經過複雜計算才能預測股價等，其實有很多很細節的步驟。


    終於拿到買賣股票的許可後，我們會在紙上寫下從幾月幾日起連續幾天買進，例如買進 50 萬股，然後交給交易員。交易員每天在市場上買進一點點。一次買進 50 萬股會導致股價暴漲，所以分幾次買進。


    回到本題。根據我的經驗，就算不做複雜的企業分析，只靠線圖判斷買賣，應該也可以獲利。所以我就想到一招。也就是先用線圖分析買賣時機，然後再寫一份煞有介事的報告，請上司批准。我這樣做了幾筆交易，果然成果就如同我的預期！而且我的獲利還是首屈一指的水準。


    現在我之所以敢斷言「只要看線圖即可！」就是因為有過這種成功體驗。'
