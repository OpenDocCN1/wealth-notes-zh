  md: '需要任何基本面分析。現在我要再加上一項：不需要酒田戰法。


    我自認為「股市職人」。


    所謂職人，就是磨練技術到極致的技術人員，能隨心所欲地運用具製造物品。投資也一樣，只要磨練運用具的手法，並加以鍛練，自然可以得到好成果。


    本書提及的訊號、新秘技，都是讓人在股市中勝出的道具。道具唯有能運用自如才有意義。然而「運用自如」說來簡單，做起來可沒那麼容易。因為實際操盤時必須能立即洞察訊號，並即時因應才行。


    因此，請先徹底牢記本書提及的技術，並回顧過去的線圖，反覆練習讀取訊號、預測走勢。長此以往一定可以隨心所欲地運用這些技術。只要熟讀並學會本書中的技術，一定可以飛躍性地提升你的技巧，讓你成長為可以一輩子在股市中所向披靡的股市職人。最後請大家一邊享受滿載相場世界的獨特圖鑑，一邊學習帶領你走向成功康莊大道的各種技術吧。'
