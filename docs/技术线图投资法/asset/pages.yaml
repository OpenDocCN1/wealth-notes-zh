  md: 'Column 01


    # 利用 3 日線和 5 日線

    可以早點發現鳥嘴


    # 改變均線，增加獲利機會


    鳥嘴在均線上升交叉後完成。如果能早一步察知交叉的瞬間，在趨勢轉換的初期就下單，獲利應也可以更為豐碩。可以利用更短期的均線來確認，也就是把 5 日線和 20
    日線變成 3 日線和 5 日線。因為期間越短的均線，能越快反應股價變動，所以用 3 日線和 5 日線，來取代 5 日線和 20 日線。


    下跌的股價轉為上漲，5 日線就會呈左下右上的走勢。而當 K 線要向上突破 5 日線時，3 日線會率先反應，用一個大銳角穿越 5 日線向上發展，完成鳥嘴的線型。


    如圖表 13 所示，5 日線和 3 日線有時可以提早 2 根 K 線察知局面。'
