  md: '# 「收盤價」會收在多數人認為合理的價格


    用收盤價來判斷還有其他考量。盤中有時會公布財報、出現個股正負面題材等影響股價走勢的各種消息。有些投資人會因應這些消息調節持股，導致盤中趨勢有時會因此反轉。


    影響股價的消息會讓盤中股價大幅震盪，但到了收盤時一定會收斂到一個價格作收。所以收盤價可說是大多數投資人認為合理的股價。


    看線圖時請多注意收盤價。第 4 章會有更詳盡的說明，也有一些簡單明瞭的訊號是只連接收盤價的線型，如巴爾坦（見第 148 頁）等。看 K 線即可知道四種價格：開盤價、最低價、最高價、收盤價，


    ![](img/7d8739be94e45f3207e2174a81662558_39_0.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: '而掌握收盤價特別重要。


    此外，股價觸及最高價或最低價後到收盤之間的價格波動，其實也反映出投資人的心理。不管是紅 K 線還是黑 K 線，影線越長，賣壓或買壓就越沉重。'
