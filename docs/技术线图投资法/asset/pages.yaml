    # 特徵&定義


    在多頭行情中出現短實體、長上影線*的紅K線。之後出現一根實體很短的紅K線，且形成孕出線；若接下來的K線向上跳空就買進，向下跳空就考慮賣出。所謂孕，就是第二根K線的實體，被包在第一根K線實體內的狀態。


    圖表 36 浪高線


    # 相場流觀點


    有上影線的紅K線之後出現黑K線，讓人覺得走勢疲軟。但如果K線還是在各均線之上，要賣空也嫌太早。若有上影線的紅K線之後出現了紅K線，且K線還是在各均線之上，就能繼續持有多頭部位。


    > 上影線很長的K線表示股價崩跌。也有很大的可能會由上漲轉為下跌，成為行情轉換點。'
