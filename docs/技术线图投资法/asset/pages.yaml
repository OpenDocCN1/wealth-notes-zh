  md: '![](img/7d8739be94e45f3207e2174a81662558_160_0.png)


    # 搭配組合，操作更有效！


    # 利用下半身、反下半身來操作


    我用這個專欄來說明組合放浪兄弟線型和其他訊號來操作的方法。


    下跌後反彈向上時，紅 K 線會突破 5 日線形成下半身。相反地，由高點反轉向下時，K 線會跌破 5 日線出現反下半身。


    所以就可以考慮以下的有效操作方法。


    +   出現下半身時買進，確認放浪兄弟線型完成後，繼續持有或加碼買進。


    +   出現反下半身時賣出，確認放浪兄弟線型完成後，繼續持有或加碼賣出。


    # 3 日線和 5 日線的上下與低點、高點的關係


    再來關心放浪兄弟線型和前一波高低點的關係，並活用操盤上吧。


    上漲的放浪兄弟線型要成立，就是 3 日線、5 日線要在觸及低點後反彈向上發展。此時的低點若高於前一波低點，就是跌勢趨緩的證明。假如又持續創新上漲，就可認為是正式轉換成上漲趨勢，應考慮買進。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '反之，下跌的放浪兄弟線型要成立，3日線和5日線要在觸及高點後反折向下發展。此時的高點若未能創新高，就該考慮買氣縮手的可能，當高點越來越低，就可認為是轉換成下跌趨勢，應考慮賣出。


    # 線圖小知識


