  md: '# 前一波高低點


    股價和人生一樣，都有重要的關卡


    ![](img/7d8739be94e45f3207e2174a81662558_175_0.png)


    # 預測趨勢轉換時，要經常意識到關卡


    大家應該都知道「人生的關卡」這種說法，指的就是入學、就業、結婚等人生的重要轉捩點。


    股價一樣有關卡。例如大家應該看過「日經指數跌破2萬點大關」這條報導。


    所謂關卡，指的就是過去趨勢中的轉捩點的股價，也就是「前一波高低點」、「整數股價」。


    許多投資人都很注意，買賣時也會意識到這些股價，所以很容易成為趨勢的轉換點、上漲趨勢的作頭區或下跌趨勢的打底區，也可說是讀線圖時的重點。


    # 突破？跌破？用來預測趨勢轉換


    前一波高低點也可以說成是「最近的」高低點。


    那麼前一波高低點指的又是哪個股價？'
  merge: -1
  img_proc: true
- pgno: 176
  md: '收盤價嗎？還是當天（週、月）的最高點、最低點？


    答案是最高點、最低點。用K線來說就是影線的頂點。


    若跌不破前一波低點、創新高，就會進入上漲趨勢。反之，跌破前一波低點、無法創新高，就會進入下跌趨勢。既無法突破高點，又無法跌破低點，在一定股價區間內波動的局面，就是盤整（箱型區）。


    # 高低點可成為支撐，加速發展，也可能成為阻力


    前一波低點常會成為止跌的緩衝，但如果跌破這個低點，就會加速下跌。這是因為會買在低點附近的投資人，通常只要有一點獲利就出脫持股，再加上停損賣壓和賣空操作，導致跌跌不休。


    前一波高點容易成為上漲趨勢的阻力，但若能突破這個關卡，漲勢就會受到激勵，前一波高點搖身一變成為下跌支撐線。


    只要突破前一波高點，就進場買進吧。此外，創新高後反轉下跌，但未能跌破前一波低點又反彈回漲時，就考慮在漲勢途中拉回時買進（在停止下跌時點買進）。


    反之，不能突破前一波高點即反轉下跌時即賣出，跌破前一波低點時就是加碼賣出的機會。'
