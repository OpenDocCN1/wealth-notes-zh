    # 除了單點，還有「群組 Kokoda」


    到目前為止，我已經說明由兩根紅 K 線、兩根黑 K 線所形成的 Kokoda。


    除了這種單點式的狀況，還有「群組 Kokoda 式」。群組 Kokoda 也是預測止跌或趨勢轉換的工具。


    群組 Kokoda 指的是幾根價格幾乎相同（以高點或低點為基準）的 K 線在下跌或上漲途中排列在一起的狀況。


    群組⑩開始下跌，進入群組⑫，然後反彈向上出現群組⑬。⑬是相對於⑩的高點群組，可說是相對於⑩的群組 Kokoda。底部越來越越高，所以是可期待上漲的局面，但後來又下跌了。不過，群組⑬的底部高於⑫，所以是群組
    Kokoda。可做出止跌的預測。


