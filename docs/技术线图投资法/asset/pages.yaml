- pgno: 168
  md: '# 靠 5 日線及 K 線來判斷趨勢是否持續


    趨勢持續與否，需要靠 5 日線和 K 線的關係來推測。


    下跌時出現下半身線型等，K 線向上突破 5 日線後，只要一直位於 5 日線之上，就會持續上漲。反之，上漲時若出現反下半身，K 線向下跌破 5 日線後，只要一直位於
    5 日線之下，就會持續下跌。


    此外，均線的排列若一直維持 PPP、反 PPP，股票趨勢也會持續下去。


    ![](img/7d8739be94e45f3207e2174a81662558_168_0.png)


    趨勢持續的局面以外預測頭部、底部的手法，就是下一節介紹的「7 日法則」。'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 7 日法則


    行情趨勢以外獲利了結的有效手法


    ![](img/7d8739be94e45f3207e2174a81662558_169_0.png)


    # 以收盤價為基準計算，察覺頭部、底部


    進場買賣後，到底什麼時應該獲利了結出場呢？這實在讓人傷透腦筋。此時「7日法則」就可以發揮作用了。不論漲跌，都會在第 7 日結束，計算方法則是以收盤價為基準，不分紅黑K線。在上漲局面中即使出現黑K線，只要收盤價高於前一天，就要算進去。在下跌局面中即使出現紅K線，只要收盤價低於前一天，也要算進去。十字線也要算進去，但如果十字線連續出現就不用算進去。


    結束計算的時間點，以上漲局面來說，就是紅K線之後出現黑K線或十字線，且收盤價低於前一天時，就算足上漲行情告終。以下跌局面來說，就是黑K線之後出現紅K線或十字線，且收盤價上漲止跌，就算下跌行情結束。


    不過，幾乎實際上漲跌都會在 4 天結束。如果連續 4 天漲或跌，就要考慮獲利了結了。'
  merge: -1
