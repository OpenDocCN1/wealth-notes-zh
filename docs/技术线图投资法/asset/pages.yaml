  md: '![](img/7d8739be94e45f3207e2174a81662558_135_0.png)


    # # 不要錯過逢低買進的機會點


    # ## 分歧和 N 大的突破點就是機會點


    漲跌終會到頭，但在到頭之前常常會在某個時間點盤整一下，突破後再持續走勢。代表訊號就是分歧。


    此外，N 大也是分歧的一種，因為有一樣的跌後漲的走勢。不過，一樣是逢低買進，出現 N 大時的操作比較能獲利。


    請再看一次 N 大線圖。N 大的起點是位於 20 日線下方的 5 日線轉而向上（分歧則是 5 日線在 20 日線上方），之後下跌、再上漲。因為這一連串走勢開始於
    5 日線在 20 日線下方急漲，N 大給人買氣更強的感覺。


    無論如何，重點就是不要錯過分歧或 N 大的線型，在走勢轉弱的突破點逢低買進、加碼買進，累積獲利吧。


    # ## 利用 5 日線和 20 日線掌握趨勢


    到目前為止，說明了利用 5 日線和 20 日線的組合讀取趨勢的方法。其中包含了許多訊號，在此先複習一下：


    +   - 烏嘴……趨勢轉換

    - 高中生時間……趨勢老實地持續

    - 分歧……有驅線（突破點）的趨勢持續

    - 驢大……更容易出現大行情的「分歧」的一種'
  merge: -1
  img_proc: true
