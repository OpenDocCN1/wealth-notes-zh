  md: '# 【圖解】日本股神壓軸服務的技術線圖投資法


    比起盤整局面，在 5 日線、20 日線都變成左上右下的線型時出現的反下半身，精準度更高，是賣空的時機。看週線也一樣。出現黑 K 線由上而下穿過 5 週線的線型時，行情就會停滯或反轉向下。週
    K 線是否出現黑 K 線，則根據週五的股價（下午二點半以後「近乎收盤價」）來判斷。


    ![](img/7d8739be94e45f3207e2174a81662558_108_0.png)


    # 線圖小知識


    在股市漲了一陣子後，有著長上影線的黒 K 線成為下跌趨勢的初期，或者是跌了一陣子後，有著長下影線的紅 K 線成為上漲趨勢的初期，都很常見。'
