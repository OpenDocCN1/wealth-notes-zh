- pgno: 38
  md: '![](img/7d8739be94e45f3207e2174a81662558_38_0.png)


    # 靠「收盤價」投資：

    晚上想好，隔天下單


    買賣時間點，就是當天收盤前


    股價持續前一天的漲勢持續上漲，可是到了下午 3:00 收盤卻大跌，原來這一天其實是下跌趨勢的轉換點……這種狀況屢見不鮮。


    即使開高，在收盤前都不會知道收盤價究竟會不會比前一天高。可以說，盤中競價的動向實在作不得準。相場流投資術的基礎就在於看趨勢。我也說過看趨勢的資料來源之一，就是可以了解行情走勢的
    K 線。


    然而，在股價波動不定，且 K 線也尚未完成的盤中競價時，很難判斷趨勢。因此，盤中競價階段不適合買賣。那麼到底要在什麼時間點，判斷是否要進行買賣呢？


    其實就是在收盤前半小時，以日股來說就是在下午 2:30 分到 3:00 之間（台股收盤時間為下午 1:30）。因為到了這個時間點已經接近收盤，K 線也差不多要完成了。或者是前一天晚上仔細思考，然後在第二天開盤前下單也可以。這樣就可以在前一天仔細研究線圖了。'
  merge: -1
  img_proc: true
