  md: '![](img/7d8739be94e45f3207e2174a81662558_6_0.png)


    投資股市，只要懂得看線圖就行了。因為不論是市場檯面上、 檯面下發生的事，或是市場心理、買賣盤算，都會反應在線圖上。


    線圖這個字，其實有「航海圖」的意思。航海圖記錄水深、潮流、 海底和海岸地形等，只要看著航海圖就可以安全航行在大海上，不 用擔心撞上暗礁，或被複雜的洋流吞沒。


    股市投資中的線圖也有一樣的功用。


    投資人的眼前是一片寬廣的股市汪洋，船隻航行其上，海象有 時平和，有時波瀾萬丈。為了更安全地交易，收穫更多成功的果實， 投資人需要等同於航海圖的線圖，提示大家前進的方向，這是不言
    而喻的事實。


    每當股價震盪趨勢轉換時，事前一定會出現相同的訊號，幾乎 毫無例外。也就是會出現即將跌停或漲幅的訊號，就如同預兆。這 也正是本書要談的各種訊號。這些訊號是我投資股票
    36 年來，利用 過去數十年間的日經指數和個股股價等，驗證、分析長達數萬年的 膨大時間的線圖後，獨自開發出來的結果。訊號包含了 K 線、移動'
  merge: -1
  img_proc: true
- pgno: 7
  md: '平均線、高點、低點等，每種訊號我都有獨特的命名。


    本書把這些訊號化為有趣角色並整理成圖鑑。同時搭配實際的線圖，顯示訊號出現時的股價動向，讓買賣點更為明確。


    另外，我還會在本書中公開新開發的均線和 K 線秘技。新秘技可以更精準地預測股價走勢，對此，我相當有自信地推薦給大家。


    本書的內容都是可以現學現用的內容。換句話說，這是一本每翻一頁，就會更深入了解師朗世界的有趣實用書籍。


    再者，我也著手研究自江戶時代流傳至今的線圖分析工具「酒田戰法」，並將結果加入本書中。酒田戰法是江戶時代起源的著名 K 線分析方法。現在也有不少人運用酒田戰法投資，甚至還出版相關書籍。既然大家覺得這種手法這麼好用，就一定有值得我學習的地方，所以我用了
    30 年的日經指數進行驗證。


    結果顯示，很遺憾，這並不值得學習（第 3 章將說明結果）。「晨星」、「夜星」都不適用於現代股市。


    1976 年，汽車評論家德大寺有恒出了一本書《錯誤百出的選車方式》，毒舌批評「引擎很爛」、「過時又老氣」等，讓當時的愛車人士有種恍然大悟的感覺。


    酒田戰法也可說是「錯誤百出的酒田戰法」。對於酒田戰法的信奉者來說，這或許是個令人震驚的結果。


    我認為，與其花時間去記住酒田戰法，不如把時間拿來學會本書的技巧。我常說，要在股市中勝出，不需要學歷、洞察力，更不'
  merge: -1
  img_proc: true
