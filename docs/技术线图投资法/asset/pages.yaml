    # 流傳兩百多年的

    技術分析工具


    # 「酒田戰法」分析行情的 5 種基本線型


    各位是否聽過「酒田戰法」*？投資股票的人應該很多人都聽過吧？說不定學技術分析時，一開始學的就是「酒田戰法」。前文也提到過，K 線是江戶時代的人發明，用來做為預測米市行情的工具（見
    32 頁）。「酒田戰法」就是組合 K 線來讀取買賣時機點的五大法則。


    「酒田戰法」的 5 大基本線型就是「三重頂」、「三川」、「三空」、「三兵」和「三法」，由此再衍生出「晨星」（見第 53 頁）、「三隻烏鴉」（見第 61 頁）等組合。基本五法見圖表
    6。


    # 酒田戰法適用於現代股市嗎？


    「酒田戰法」又衍生出數根 K 線的分析手法，也是用數根 K 線的組合來讀取行情方向、買賣時機點。這些組合都被賦予「妙不


    > *「酒田戰法」據說是酒田的大富豪本間宗久（1724～1803 年）所發明，但無法證實。


    50'
