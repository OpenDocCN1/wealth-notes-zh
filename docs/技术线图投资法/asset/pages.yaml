    # 圖表 99 低點（＝底部）屢創新高的「Kokoda」


    兩根紅 K 線要看的是低點。出現紅 K 線後上漲，然後反轉向下跌盤整，接著再出現紅 K 線。若第二根紅 K 線的低點位置比第一根高，即可預測下跌或盤整不過是暫時現象，股價還會再漲。


    之前一直漲的 K 線反轉向下或盤整時，還沒跌到上一根紅 K 線的位置時，又再出現紅 K 線時，那就是「Kokoda」！此時就應該考慮買進。


    正在猶豫何時進場買進時，出現紅 K 線。這正是會讓人不經意脫口而出「買點就在這裡！」的情形，所以才會命名為 Kokoda（之所以用羅馬拼音，是因為我希望在海外也能通用……笑）。'
