- pgno: 66
  md: '驗證的結果並非如此。


    我認為這是有故事的 K 線型。


    事實上，我想這個訊號並非大量分析過去的價格波動後導出的定義，而是先創作出由打底區反彈上漲的故事，亦即「連續出現 3 根紅 K 線後，市場上就會彌漫著行情強勁的想法。於是買盤集中，自然會轉而上漲」，然後再定義「紅三兵會出現在上漲行情的初期」。


    看看實際的股價波動，即便在打底區內出現紅三兵，之後也有持續上漲和不漲的情形。


    如圖表 14 的線圈所示，持續大跌後的盤整行情中即使出現紅三兵，也常常會反覆下跌幾次後，再反彈上漲。


    # 要靠紅三兵獲利，必須懂得操作部位


    相場流投資術稱盤整行情為「B 局面」（見第 157 頁）。


    那麼 B 局面出現紅三兵時，應該如何操作才好呢？


    要獲利就必須「操作部位」*。


    B 局面後不知道會漲還是跌。首先出現紅三兵就先買進。然後


    +   * 部位指的是持有多頭和空頭兩種部位。利用「部位操作」，漲了就買，跌了就賣，以求在股市中獲勝。


    +   66'
