    # 透過均線排列看清上漲趨勢


    PPP 就是狀聲詞「碰碰碰」的縮寫，也就是均線發出表示上漲趨勢的嘹亮號角聲。我是在欣賞航空自衛隊，藍色衝擊波飛行表演隊的空中飛行表演時，想到這個命名。當時
    5 架戰鬥機升空，在天空中留下鮮明的飛行軌跡，讓我想到 5 條均線氣勢如虹的上漲趨勢，腦海中不禁響起勝利的號角聲。


    ![](img/7d8739be94e45f3207e2174a81662558_136_0.png)'
