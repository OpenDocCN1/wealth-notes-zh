- pgno: 137
  md: 'PPP 成立的均線排列，由上而下依序為 5 日、20 日、60 日、100 日、300 日線，且方向全朝上。再者，K 線又在 5 日線上方。均線之間不會太過接近，有一定的距離，且向上的角度大比平坦好。只要
    PPP 線型不變，股價就會持續上漲。


    # ## 短期上漲，可透過前期 PPP 知道


    PPP 通常是代表上漲趨勢長期持續的訊號，而代表上漲趨勢短期持續的訊號則是前期 PPP。這是朝上發展的均線，由上而下依序為 5 日線、20 日線、60 日線的訊號（100
    日線不一定要在最下方）。


