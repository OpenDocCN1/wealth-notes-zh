- pgno: 171
  md: '# Column 5


    # 把股價當成戀人


    # 別錯過任何訊號，預測動向


    大家有沒有聽過「隨機漫步理論」？就是股價不受過去波

    動的影響，不論漲跌，機率各為二分之一的想法。也就是說，

    股價波動根本無法預測。不過大家都應該都發現了，其實並非如

    此。


    股價波動時會出現多個訊號以為預兆。上漲趨勢中的分歧

    完成前，常會出現下半身。而多次挑戰新高失敗後，就是嘗試

    攻頂失敗，會出現巴爾坦線型。股價波動並非隨機漫步，可經

    由訊號進行預測。因此，大家平時還是多看線圖，練習讀取股

    價波動的訊號。


    # 找出多個訊號的讀線圖練習


    比方說，練習時可以在高中生時間用「9 日法則」來預測

    漲勢告終的時間點。此外，也可以試著判斷是否會創新高、整

    數股價是否會成為阻力等，檢查多個訊號。每天反覆進行這種

    練習，在腦中建立「那樣的話就會這樣」的思考回路。有了這

    樣的回路，自然有助於在實戰時打勝仗。


    覺得練習或檢查訊號很煩，就把股價當成是自己的戀人，

    這樣就不會放過任何訊號。若現在剛好沒有戀人，那真是再好

    不過了。'
  merge: -1
  img_proc: true
