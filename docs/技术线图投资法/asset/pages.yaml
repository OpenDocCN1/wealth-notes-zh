  md: '# 逢低買進和反彈賣出的不同點


    逢低買進指的是在下跌途中買進，相反地反彈賣出則是在股價反彈向上時賣出。分歧訊號就是在確認5日線雖接近20日線，卻未能突破20日線後再進行買賣。因此確認再次下跌後出手，買賣的精準度更高。


