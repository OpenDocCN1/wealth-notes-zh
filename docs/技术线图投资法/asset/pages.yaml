- pgno: 218
  md: '線圖。我建議大家大量地練習看線圖，「出現這個訊號後股價就會這樣動」、「這裡就是買賣時機點」等。日復一日練習，操盤功力自然會和你的練習量等比增加。


    師傅帶進門，修行看個人。光讀書不可能學會技巧。只有腳踏實地不斷練習，才能讓技巧為自己所用。投資股票不用學歷也不用才能，只要肯埋首努力即可。


    努力一定會有回報！「幾年後要賺 1 億圓！」這不是夢想，是現實。股票教室的學員中還有人是以 10 億日圓為目標，不斷地努力練習。有些人事業有成，已經退休享福，卻還是勇於挑戰投資，努力不懈。


    我必須再強調一次，練習最重要。可是有時一個人練習很辛苦，會感到厭煩。甚至覺得，已經到達極限，無法再繼續下去了。此時，我會建議大家來參加股票教室主辦的讀書會。這裡有同好，而且看到別人練習的樣子，也可以激勵自己。最大的好處就是可以聽我親自授課（笑）。並且還可以學到到不斷進化中的相場流投資術最新理論。


    這的確是在宣傳打廣告，不過就像是得到一流教練加持的一流運動選手，可以有效地改寫個人最佳成績一樣，借助教練的力量可以最快到達終點，這也是不爭的事實。


    我也為了提供大家更有價值的授課內容，不斷地精進自己的技巧。各位也是有緣才會購買本書。就讓我們更加珍惜這段緣分吧。


    我期待大家都能活用本書，並在股海中屢戰屢勝！'
