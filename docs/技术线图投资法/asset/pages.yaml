  md: '這個結論，表示這種戰法並不適用於日經指數的波動。


    # 當下無法判斷是否出現在打底區


    現代的市場幾乎可說「晨星」不存在。看著書中和網站上的分析，讓我感到空虛不已。或許也有人存疑「有必要嚴格定義嗎？沒有缺口（跳空）也沒關係吧？」


    我似乎聽到有些人的這種質疑聲。可是「晨星」中的缺口很重要。大多數說明都解釋得頭頭是道，「明明下跌壓力大而跳空下跌，卻又跳空上漲，表示買盤強勢。因此晨星就是上漲的訊號」。現在卻說「不需要缺口（跳空）」*，這不是很矛盾？


    ![](img/7d8739be94e45f3207e2174a81662558_54_0.png)


    * 所謂缺口，就是因為某些好或壞的題材而出現大買或大賣時，和前一天的K線之間的空間。K線之間出現明顯空間的現象就稱為「跳空」。'
