    ![](img/7d8739be94e45f3207e2174a81662558_12_0.png)


    # 成為股市職人的終身目標


    對我來說，所謂「職人」，就是埋首精進技術，以熟練的技術製造物品，自尊心很強的專家。


    這也正是我的目標所在！所以我希望自己成為一名股市職人。


    為了在股市中創佳績，我每天都在磨練自己的技術。我研讀包含日經指數在內，各種個股過去30年的線圖，每天努力精益求精，在腦海中建構、解讀股價走勢的「迴路」。


    我終於發現了「下半身」、「分歧」、「9日法則」等股價走勢預測技巧。我很自豪，因為這是獨一無二、唯我獨有的技術。


    職人必須經過很長時間的學習鍛鍊才能出師，我也一樣。我並不是有天突發奇想，突然就說「我要用線圖預測股價走勢！」經過三十多年的學習鍛鍊，才有今天的我。當然，我現在也仍在持續學習鍛鍊中。


    接下來要跟大家分享，在我年輕時開竅之後，活用線圖進行技'
