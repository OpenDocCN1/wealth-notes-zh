  md: '# 活用 Kokoda 操盤的整理


    Kokoda 是看著高低點下探或墊高來判斷趨勢的訊號。


    而且也是進場布局買賣的時機點。


    現實中操盤時，請搭配第 4 至 6 章說明的一半身與「9 日法則」等買賣訊號、均線排列和 Kokoda，來判斷買賣時間點吧。


    磨鍊一個技巧到極致很重要，但若能充分活用多種技巧，可以更精準地預測趨勢，也可降低操盤失敗的機率。


    儘量不落入虧損的窘境、較不會失敗的操作，就是在 A 局面和 C 局面的操作。而且，如果均線排列是 PPP、反 PPP 線型，不論何時進場都容易獲利。


    這種簡單的局面，1 年中一定會出現幾次。不要選在困難的局面出手，而是等待簡單的局面出現，腳踏實地累積獲利，這也是一種選擇。


    ![](img/7d8739be94e45f3207e2174a81662558_214_0.png)


    **線圖小知識**


    有人或許會想與其加碼買賣，不如一開始就大買大賣。然而現實中卻怕到不敢出手。其實只要一邊確認趨勢，一邊增加部位即可。'
