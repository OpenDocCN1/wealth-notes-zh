  md: '# 不同期間的三種手法


    # 幾天內只買或賣的「散彈槍」


    所謂散彈槍，指的是 2 日到 1 週左右的短期操作。只靠買或賣單向獲利，是「只鎖定一邊」的投資。如果只鎖定買進，也可不透過信用交易，只在現貨市場交易。


    資金少時就以最小單位來買賣，一點一滴地累積獲利。不過，交易時不要只鎖定一档個股，而是一路改變標的，針對出現買賣訊號的個股交易。


    做法其實很簡單。大家可以想成進場買進出現下半身訊號的個股，等出現黑 K 線後立刻出場。然後買進創新高的個股，遇到關卡再立刻出場。第 7 章將會詳細說明適合散彈槍短期操作的均線新技巧。


    # 長期操作建立部位的「掌握股價波動慣性」


    掌握股價波動慣性則是 3 至 6 個月的長期操作。鎖定一档個股，視趨勢進行買或賣的「部位」操作。這是利用股價波動的投資方法，標的是線圖上股價呈現大幅波動的個股。


    操作時會反覆買賣，所以必須採用信用交易。實際上很複雜的部位操作，其實可以如下面所描述，進行想像。


    在打底區買進，搭上上漲趨勢的順風車後加碼買進。出現長黑 K 線，並覺得「奇怪！」時就下賣單（做為萬一下跌時的避險），等到實際進入下跌趨勢後，就停買加碼賣出......用'
