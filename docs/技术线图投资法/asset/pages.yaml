    # 會漲的「晨星」幾乎不存在


    驗證期間:1987 年 10 月～2019 年 2 月為止 32 年


    驗證標的:日經指數(日線) 出現次數:0


    # 平均 1.5 年出現一次類似線型


    結論是「晨星一次也沒出現過」!


    這實在是太驚人了,這難道不是一個大發現嗎?應該有很多人深信「晨星」組合 K 線,並試圖活用牠來投資。可是就算把這個線型列印在腦海中,也無法因此投資獲利。因為
    32 年來它一次也 沒 出 現 過 。


    如果是類似線型,32 年間總共出現過 19 次,也就是平均 1.5 年 出現一次。然而,「晨星出現就會漲」的法則,19 次當中只有 7 次 是成立的。


    所以加上類似線型,我的結論如下:


    +   • 32 年來並未出現符合定義的「晨星」線型


    +   • 平均 1.5 年出現一次類似線型,但之後反轉向上的機率只有 36%'
