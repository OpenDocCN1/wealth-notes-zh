    # 沒有尾數的整數股價，有時會成為關卡


    整數股價有時會成為股價走勢的頭部、底部或趨勢轉換的關卡。所謂整數股價指的就是像 300 點、500 點、1000 點等沒有尾數的數字。這樣的數字在上漲趨勢中，很可能成為阻升壓力，在下跌趨勢中很可能成為止跌緩衝。


    看看過去的日經指數，也可以發現 23000 點、22000 點、21000 點、20000 點等都成為了關卡。


    個股也是一樣的情形。下跌趨勢的股價可能在 1000 點等整數股價止跌，若 K 線超出 5 日線，就是觸底反彈的訊號。而上漲的股價如果不能突破 2000 點等整數股價，即可預測將反轉向卜，進入下跌趨勢。'
