    當 K 線在 5 日線下方時，分歧線型成立前，會先出現 K 線實體向上穿過 5 日線的下半身線型。確認到下半身出現，就可以準備在分歧後進場了。只要分歧線型完成後又突破前一波高點，還可以期待大漲行情的出現。建議大家組合下半身、分歧、創新浪段高點等不同技巧，提高獲利機率，穩健獲利吧。


