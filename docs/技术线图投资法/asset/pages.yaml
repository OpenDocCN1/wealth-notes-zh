  md: '# 04 反鳥嘴（下跌趨勢） 📈

    飛鳥邊啼叫、邊下墜


    ![](img/7d8739be94e45f3207e2174a81662558_113_0.png)


    # 在反鳥嘴前夜的「反下半身」布局賣空


    5日線由上而下穿過左上右下向下發展的20日線，這就是反鳥嘴的線型。一樣會用5日線和20日線來說明。位於已經轉而向下的20日線上方的5日線開始傾斜，由上而下穿過20日線，二條均線都呈左上右下的走勢，即完成反鳥嘴的線型。這是轉換成下跌趨勢的轉換期。


    ![](img/7d8739be94e45f3207e2174a81662558_113_1.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: '不同於死亡交叉的地方，在於 5 日、20 日線都向下發展。如果 5 日線由上而下穿過持平或略微向上的 20 日線，這並不算是反鳥嘴線型。出現反鳥嘴之前幾乎可說一定會出現反下半身。在出現反下半身時布局賣空，出現反鳥嘴後加碼，這也是有效的戰略。


    鳥嘴、反鳥嘴出現前，確認到下半身、反下半身等線型時就先試水溫買賣，等到鳥嘴、反鳥嘴線型完成後，就加碼買賣。


