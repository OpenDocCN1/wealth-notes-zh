    技術線圖投資法


    ![](img/7d8739be94e45f3207e2174a81662558_172_0.png)


    # 無法突破前一波高點，加速下跌


    股價要持續上漲，就必須突破前一波高點，不斷墊高低點才行。


    話雖如此，不論漲勢再怎麼強勢，總有一天也會到頭，這是很正常的事。


    股價走勢一旦疲軟，就無法突破前一波高點。


    ![](img/7d8739be94e45f3207e2174a81662558_172_1.png)'
  merge: -1
  img_proc: true
- pgno: 173
  md: '雖然漲到前一波高點附近，卻無法突破轉而下跌；雖然又反彈上漲，仍舊無法突破而又下跌，形成疲軟的走勢。這就是「嘗試攻頂失敗」的線型。此外這個訊號在無法突破
    500 點、1000 點等整數股價時也成立。


    那麼在嘗試攻頂失敗時，股價又會如何波動呢？漲勢會反轉向下，如果再次嘗試攻頂失敗（也無法觸及高點），就有跌勢加速發展的趨勢。


    # 為消除未實現損失而產生的賣壓是主因


    買在高點的投資人們其實都有未實現的損失。所以當股價重回到高點附近時，他們為了消除未實現損失，就會賣出持股。要突破前一波高點就必須消化這種賣壓。因此漲勢不夠強勁的話就會嘗試攻頂失敗。


    # 嘗試攻頂失敗型，是賣空的機會


    確認到嘗試攻頂失敗的線型，如果又出現多個訊號，如反下半身、反島嘴、創新低等，就是賣空的好時機。再次出現的嘗試攻頂失敗線型常常會加速跌勢，所以也是賣出的時機。'
  merge: -1
  img_proc: true
