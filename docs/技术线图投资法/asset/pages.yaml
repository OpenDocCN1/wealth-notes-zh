  md: '![](img/7d8739be94e45f3207e2174a81662558_28_0.png)


    # 推薦市值和成交量大的個股


    前文提到分析線圖後買賣，才是可以獲利的投資方法。所以如果你的目標是成為股市常勝軍，就必須看大量的線圖，充分運用本書中的技巧判斷趨勢，培養預測股價波動的能力。


    話雖如此，可是光是東京證券交易所（簡稱東證一部）就有約 3,600 家上市公司（2020 年台灣約有 994 家上市公司）。到底該看哪家公司的線圖才好呢？真是令人頭痛不已。


    此時，你應該看的標的，其實就是市值 3,000 億日圓以上，每日成交量 50 萬股以上的個股*。市值和成交量大的個股波動穩定，因此容易判斷趨勢。具體來說其實就是東京證券交易所裡，採用的
    225 檔個股的「日經指數」、獲利高外資也有興趣的「JPX 日經 400」等**。


    * 在日本，股票單位分為 100 股或 1000 股。在台灣，一張股票等於 1000 股；美國 1 張股票等於 100 股。


    ** 等同台灣 0050 或其他指數的 ETF 指數。'
