  md: '![](img/7d8739be94e45f3207e2174a81662558_104_0.png)


    # 01 下半身（上漲趨勢）


    看到「出類拔萃」的訊號準備買進！


    超簡單且高精準地暗示上漲趨勢


    下半身的特徵，就是讓人不禁聯想到旺盛漲勢的性感曲線。這個訊號雖簡單，精準度卻驚人！


    這個線型就是當5日線持平或開始向上時，紅K線身體（實體）有一半以上突出在5日線以上的形狀。出現這個訊號後，常常之後幾天會連續出現紅K線，股價起漲。


    ![](img/7d8739be94e45f3207e2174a81662558_104_1.png)


    104'
  merge: -1
  img_proc: true
- pgno: 105
  md: '因此，下半身出現可想成是「買進時機」。K線直接突出5日線，未和5日線相交的線型也可說是下半身。不過關鍵是紅K線實體要突出5日線，只有上影線突出不能算是下半身。此外，5日線向下時如果出現下半身，表示下跌力道強勁，也可能無法反彈向上。


    # 前景看好，買盤安心


    因為股價低於最近5天的平均收盤價，股價被5日線壓抑，只能在均線下徘徊。在這種狀態下，應該有很多投資人擔心股價下跌，避免進場買股。此時如果K線突破5日均線，多數投資人會認為這是上漲訊號，因此瀰漫著「可以買的安心感」（「買股獲利的可能性提高」的心理）。此外很多人期待上漲導致買氣集中，趨勢也容易反彈向上。


    # 搭上漲順風車賺錢的機會


    在5日線由向下轉為持平，甚至是向上的局面出現下半身的線型，就可以期待之後出現大漲行情，也可以考慮進場買進。'
  merge: -1
  img_proc: true
