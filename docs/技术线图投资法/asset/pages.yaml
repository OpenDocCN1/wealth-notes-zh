- pgno: 32
  md: '【圖解】日本股市曆戰勝務的

    技術線圖投資法


    # 什麼是K線？


    ![](img/7d8739be94e45f3207e2174a81662558_32_0.png)


    # 自江戶時代米市行情衍生的K線


    買賣要常勝，就必須具備看線圖預測股價的能力。如同第1章的說明，基本面分析並非必要。看線圖時我們用的是K線和均線。


    首先說明K線的基礎知識。


    追本溯源，K線的起源可以回溯到江戶時代的米市行情。


    白米的期貨、現貨交易市場源自1730年的大阪堂島。這也是全球首見的期貨交易市場。交易方式幾乎和現在一樣。說得極端一點，你覺得未來的價格比現在貴就先買進，覺得未來的價格比現在便宜就先賣出，到時再買回來。隨著白米商人越來越多，他們的盤算和策略也會影響價格。因此為了預測行情走勢，本間宗久發明了K線。


    雖然無法證實K線發明人到底是不是本間宗久，但K線本身是日本獨家發明，然後流傳到全世界，成為可讀取投資人心理和市場行情走勢的線圖，這一點倒是無庸置疑。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '# 收盤價相同，也可由 K 線形狀看出走勢


    K 線，又稱「日本蠟燭線」，用以表示某段期間的股價波動。這段期間如果是 1 日就稱為日線，1 週就稱為週線，1 個月就稱為月線。而 K 線排列出的線型就是
    K 線圖。


    K 線由實體（燭身）和影線（燭芯）組成，K 線又分成紅 K 線和黑 K 線兩種。不論哪一種 K 線，實體兩端都表示開盤價和收盤價。收盤價高於開盤價時就是紅
    K 線，反之則為黑 K 線。在臺灣，線圖上漲 K 線都以紅色表示（本書以白色表示），下跌黑 K 線則以綠色表示（歐美則相反；日本是紅 K 線以白色、黑 K
    線以黑色表示）。


    影線則有上影線和下影線，表示那段期間（1 日、1 週、1 個月）的最高價、最低價。


    ![](img/7d8739be94e45f3207e2174a81662558_33_0.png)'
  merge: -1
  img_proc: true
- pgno: 34
  md: '【圖解】日本股神壓軸壓賭的技術線圖投資法


    只要看K線，那段期間的股價走勢就一目了然。是開高走低還是開低走高？還是雖然中途波瀾萬丈卻以平盤作收呢？


    一樣收在 300 點，是漲勢強勁下的 300 點，還是上漲動能不足的 300 點？從K線就可以看出行情走勢。只要知道行情走勢，自然可以做為預測趨勢，判斷該買還是賣的線索。'
  merge: -1
