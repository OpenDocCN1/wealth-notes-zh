  md: '# **02** # 反下半身（下跌趨勢）


    看起來就很不祥的「勢力衰退」訊號


    ![](img/7d8739be94e45f3207e2174a81662558_107_0.png)


    # ## 垂頭喪氣的黑K線是下跌趨勢的訊號


    5日均線持平或轉向向下時，之前在5日線上方的K線，若出現實體一半以上都在5日線以下的黑K線，就是反下半身的線型。黑K線未和5日線交叉，而是完全在5日線下方，也算是反下半身的線型。在上漲趨勢時出現反下半身，就是漲勢停滯，盤整或是反轉向下的局面。


    ![](img/7d8739be94e45f3207e2174a81662558_107_1.png)


    圖表59 「反下半身」示意圖'
