  md: '![](img/7d8739be94e45f3207e2174a81662558_51_0.png)


    行情三段上昇，觸及高點（山）又下降，是倒頭反轉的訊號。如果三次都無法突破高點，那個高點就是頭部，之後就會反轉向下。


    ![](img/7d8739be94e45f3207e2174a81662558_51_1.png)


    行情三段下跌，觸及低點（川）又上升，是觸底反彈的訊號。如果三次都無法跌破低點，那個低點就是底部，之後就會反彈向上。


    # 例「三空陽線」（P66）


    ![](img/7d8739be94e45f3207e2174a81662558_51_2.png)


    跳空上漲或下跌時，表示突然出現好或壞的題材。連續出現三次時，很多投資人會選擇獲利了結。


    # 例「紅三兵」（P49）


    ![](img/7d8739be94e45f3207e2174a81662558_51_3.png)


    連續出現三根紅K線或黑K線。如果是紅K線，表示漲勢強勁，如果是黑K線，則表示行情不佳。


    # 例「上升三法」（P60）


    ![](img/7d8739be94e45f3207e2174a81662558_51_4.png)


    黑K線、紅K線交互出現，沒有方向感的盤整狀態。不動時暫停。然後行情會朝上或下發展，等待方向明朗後再操作為宜。


