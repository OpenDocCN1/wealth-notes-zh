  md: '# 比性冺寫真更讓我著迷的股市線圖


    我忐忑不安地從靠墊後方找到父親藏的東⻄，發現那竟然是手畫 K 線和用直線連接收盤價的線圖！


    在那之前，我的生活中根本沒有 K 線和股價等存在，所以我還花了一點時間，才想到那是日線圖。等我發現那是線圖，我竟然沒有「搞什麼啊。原來不是寫真集，真令人失望」的想法，反而看到著迷了。


    一條又一條的紅 K 線矗立著，越來越高聳，收盤價的折線圖也隨之急升。當終於觸頂，出現了不吉祥的黑 K 線，然後反轉向下。中途紅 K 線看來好像有些掙扎反彈……


    我內心激動不已。這實在是極為性感的形狀，瞬間我就成為線圖的迷弟了。


    爸爸手繪的線圖是製糖公司「鹽水港精糖」的股價走勢圖。這是一家 1904 年創業的東證一部上市公司。


    我立刻湧出「我也想投資股票！」的想法。鹽水港加上精糖的公司名稱，讓我連想到用船把甘蔗運到港口的樣子。


    船！我腦海立刻浮現日本郵船公司，很單純的想法。


    線圖其實也有航海圖的意思，指引航行在浩瀚汪洋上的船隻。這麼一想，日本郵船還真是極為合適的選擇。


    我立刻買了方眼紙，然後調查每日股價的動向，畫出一根又一'
