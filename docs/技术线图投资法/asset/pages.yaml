  md: '![](img/7d8739be94e45f3207e2174a81662558_20_0.png)


    # 在股市世界，努力和鍛鍊缺一不可


    學生時代，我靠著買賣日本郵船股票賺了一點錢，但股市也沒那麼好混，我也很清楚我無法以此為生。因此畢業後我決定先成為一個獨立的社會人士，進入一家和股票投資一點兒關係也沒有的公司就職。


    誰知道，後來我因緣巧合得以進入金融機關服務，還被分發到自營部。


    當時的股票投資和現在不同，下單買賣撮合等都是人工交易。我想長輩們應該還記得，當時證交所內還有交易廳，報唱交易聲此起彼落，好不熱鬧。真的是一個很俗氣的世界。然而，這或許正是股票投資最原始的樣貌。


    在電腦或手機上輕輕點一下，就可以賺到數十萬日圓。這聽來就像是一個高尚的世界，有些人可能是在這種想像下進入股票投資的世界。但是這誤會可大了。股票投資，原本就是一個俗氣且需要毅力的世界。如果想賺到錢，就必須一步一腳印的努力和鍛鍊。'
