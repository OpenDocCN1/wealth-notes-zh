  md: '【圖解】日本股神實戰歷勝的技術線圖投資法


    發現漲不上去出現黑K線。雖然獲利微薄，此時就先平倉。


    股價下跌進入 B 局面，然後出現 3 根紅 K 線，此時買進。之後又上漲，所以利用「9日法則」（見第 166 頁）獲利了結。接著再次進入 B 局面，又於紅三兵出現時買進，再根據「9日法則」獲利了結。在紅
    K 線突破高點、關卡時買進。


    要靠紅三兵獲利，就必須用如此頻繁的「部位操作」，亦即「買進」、「平倉」、「買進」、「平倉」……


    有時可能才買了兩天就要平倉，是極短期的交易操作。這樣的話有可能因為工作等原因，一天無法看盤，然後再看的時候卻發現「啊？怎麼跌了！」這是很難避免的狀況。


    如何識破漲勢初期出現的紅三兵呢？我想最好還是畫出均線，根據傾斜和短線、長線的位置關係，來預測趨勢，這才是堂堂正正的戰術。'
