  md: '# 找出 Kokoda''精準抓住買賣時機


    ![](img/7d8739be94e45f3207e2174a81662558_197_0.png)


    # 用 K 線高精準地預測股價波動


    買賣股票要賺錢，就必須順著股價波動的趨勢買賣，這已是老生常談。股價波動不外乎是漲、跌、盤整的排列組合。就算在盤整期間，股價也並非靜止不動，而是在一定的範圍內上下波動。前面介紹過預測股價波動的技巧之一，就是看收盤價是否突破或跌破前一波的高低點，來推測股價趨勢。


    Kokoda 也是預測趨勢，讓投資人更容易進場買賣的技術之一。只要學會這個技巧，就算股價未突破前一波的高低點，或是股價處於盤整期間，也可以預測股價走勢，找出最合宜的買賣時機。


    # 讓你不經意脫口而出「就是這裡！」


    Kokoda（日文「在這裡」的音譯）利用兩根紅 K 線或兩根黑 K 線，也就是兩根 K 線的位置關係，來預測股價會漲還是跌（見圖表 97）。'
