- pgno: 25
  md: '# 線圖，就像股票的 X 光片


    ![](img/7d8739be94e45f3207e2174a81662558_25_0.png)


    不只基本面分析會影響股價，投資人的心理欲望也會


    投資不需要基本面分析。


    我確信這一點後，就結束在金融機關的學習。我辭去工作，進入下一階段的學習，也就是每天看著線圖磨練技術，確立獨一無二的技巧。之後不論是睡著還是醒著，我把日常生活全奉獻給線圖分析，一個人走在旁人口中的「變態之路」上，直至今日。


    相場流投資術完全不重視基本面分析。因為只要看著線圖上的股價變化，就可以預測今後的股價。雖然有點突兀，不過在這裡我要跟大家分享一個朋友的例子。他是腦外科醫師，也是股票教室的學員。


    他看病時很重視 X 光片。據他說所有線索都藏在 X 光片中。不論患者再怎麼強調「我都有聽醫生的話」，只要看 X 光片，他就知道患者有沒有說謊……也就是說，患者所言不一定為真，只要看
    X 光片就可以撥雲見日。這和「只要看線圖即可」的說法是不是很像？'
