  md: '可言！」的名號，如「夜星」、「晨星」、「陰孕陽」等。


    券商官網等常有這種 K 線的組合線型，也有許多相關網站。絕大多數網站都表示這些組合仍適用於現代股市。


    若兩百多年前的技術在現代還能通用，那真是太厲害了！我想其中一定有許多值得學習的內容。但我也不禁懷疑，真的有人仔細驗證過嗎？


    身為股市職人，我當然不能放過驗證「酒田戰法」的機會。如果這種戰法仍適用於現代股市，那就多了一種預測趨勢的工具，可以提高預測精準度。一想到這裡，我體內流著的職人血液不禁沸騰起來！我立刻徹底調查
    30 年來的日經指數日線圖和週線圖等，確認出現機率和精準度。我逐一查看每根 K 線，花大量時間仔細地調查。


