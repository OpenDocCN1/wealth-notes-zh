- pgno: 46
  md: '# 知道趨勢，就知道現在該買還是賣


    只要用均線掌握趨勢，就可以判斷應該買還是賣，應該持有多頭還是空頭部位*。判明趨勢後就把 K 線叫出來看吧。這麼一來應該就可以根據均線和 K 線的關係，如下半身、反下半身（見第
    104、107 頁）等，看出買賣時機點。


    用 K 線看出股價走勢，再根據均線由高處俯瞰股市行情。K 線和均線可說是股市的兩大至誠勝武器。


    # 線圖小知識


    除了 K 線和均線，技術指標還有包寧傑帶（Bollinger Band）、相對強弱指數（Relative Strength Index, RSI）、指數平滑異同移動平均線（Moving
    Average Convergence / Divergence, MACD）、心理線（PSY）等，種類繁多。


    > * 部位（position）是指投資人持有的額度。若投資人看好股市，先買進股票，等上漲再賣出以獲利，其持有的額度稱為「多頭」；反之，若看壞市長而先放空股票，等股價下跌再回補，其放空額度稱為「空頭」。'
