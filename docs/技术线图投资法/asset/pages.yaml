    # 5 日線和 20 日線互相靠攏，最終仍持續下跌的趨勢


    和分歧這個充滿哀愁的名稱最吻合的出現時機，其實是下跌趨勢。下跌趨勢中和 20 日線一同向下並肩前行的 5 日線反轉而上，接近 20 日線。當大家都以為它會突破
    20 日線，轉為上漲行情時，5 日線卻連碰都沒碰到 20 日線，又反轉向下了。這就是下跌趨勢中的分歧訊號。


