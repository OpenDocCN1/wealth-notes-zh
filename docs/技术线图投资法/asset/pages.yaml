- pgno: 146
  md: '# 無尾熊交纏在 20 日線之下就會漲


    5 日線位於下跌的 20 日線下方，向上接近 20 日線。遠離後又接近……形狀很像下跌趨勢中的分歧。可是在盤整局面中，5 日線試圖交纏 20 日線的形狀，是預言漲勢的無尾熊線型。此時累積買進部位，等待
    5 日線突破 20 日線的瞬間，為轉換成 PPP 的機會做好準備。


    # 20 日線上方的無尾熊纏上 20 日線，轉趨直下


    另一方面，若 5 日線位於 20 日線上方，向下接近 20 日線後又分開，在上漲趨勢進入盤整的局面中，且 5 日線接近 20 日線並交纏在一起的狀態，就是預言下跌的無尾熊線型。進入此狀態後股價就無法突破前一波高點，不久
    5 日線就會向下跌破 20 日線，轉換成反 PPP 的可能性變大。


    不過，這種訊號並不表示一定會轉換成上漲趨勢或下跌趨勢。即使出現下跌訊號的無尾熊，10 次中也有 3 次不跌反漲……所以不要因為出現無尾熊線型就急著買賣，先觀察一段時間吧。'
