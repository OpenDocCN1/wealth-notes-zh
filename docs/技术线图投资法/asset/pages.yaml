  md: '【圖解】日本股神擇戰勝腦的技術繪圖投資法


    # 17 放浪兄弟


    預測趨勢的移動線表現


    ![](img/7d8739be94e45f3207e2174a81662558_154_0.png)


    # 均線指出下跌、上漲的轉換時機


    說到放浪兄弟，大家都知道是一個以歌舞表演出名的團體。十多人一起跳的舞蹈，不但速度快，又充滿節奏感。因受到他們的舞蹈啟發，所以我把轉為上漲、下跌的均線走勢命名為放浪兄弟。這到底是什麼樣的走勢呢？


    ![](img/7d8739be94e45f3207e2174a81662558_154_1.png)


    圖表 83 「放浪兄弟」示意圖'
  merge: -1
  img_proc: true
- pgno: 155
  md: '上漲、下跌都構成放浪兄弟線型的均線，指的是短期均線。原則上看的是 3 日線、5 日線、10 日線的走勢和位置。一開始是 3 日線突破 5 日線，接著突破
    7 日線、10 日線，然後 5 日線也跟隨 3 日線的腳步，突破 7 日線、10 日線，就算放浪兄弟線型完成。


    這個線型主要出現在趨勢轉換的局面，但也會出現在上漲趨勢的局面中下跌後再上漲，或是下跌趨勢的局面中上漲後再下跌、或盤整局面中的上下波動。


    # 不能錯過放浪兄弟線型前一夜的預兆


    放浪兄弟線型出現前會有預兆。首先股價會反轉，3 日線隨之反應，反折呈銳角。看到此預兆就要預測可能出現放浪兄弟線型，隨時關注均線走勢吧。


    接著說明放浪兄弟和股價令人在意的關係。


    一開始的走勢是 3 日線和 5 日線交叉，股價反應則更早出現。在形成交叉前，股價應已先一步突破 5 日線了。所以也常常會出現 K 線訊號如下半身或反下半身。此外，從突破前一波高點、低點等走勢，也可預測放浪兄弟線型即將出現。'
