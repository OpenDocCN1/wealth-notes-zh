- pgno: 72
  md: '![](img/7d8739be94e45f3207e2174a81662558_72_0.png)


    # 市場環境不同，無法完全套用


    我認為，「酒田戰法」的確是江戶時代預測米市行情的優秀線圖分析方法，否則不可能流傳 200 年以上，直至今日。仔細想想，江戶時代的米市，其實是在一定收成量下的買賣，而且市場參加者也有限。可能因為如此，「酒田戰法」才能充分通用吧。


    使「酒田戰法」活躍的環境，卻無法套用在現代股市。如此說來，「現在仍適用」的主張，可說是並未考慮到這種環境差異。


    而現在仍適用這種主張能橫行至今，我想是因為沒有人詳查過去的線圖並檢討所致。至少，沒人驗證過過去 30 年的線圖。


    經由本次驗證作業，我證明了「酒田戰法」記載的多根 K 線的線型，出現的次數很少。因此不得不說，它幾乎無法適用在現代股市中。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 洞悉投資人心理，有助分析股價走勢


    然而，我並非全面否定「酒田戰法」。


    不論是米市還是現代股市，經由買賣左右股價的永遠都是人。而人的心理不論是在過去的江戶時代或是現代，應該沒有太大不同。所以，我認為「酒田戰法」的技術說明書籍中所寫的投資人心理，應該是正確無誤的。


    例如「十字線表示投資人的迷惘」、「長紅 K 線的出現讓投資人期待上漲」、「有上影線的紅 K 線表示投資人認為行情已到頭部的心理」等，都充分說明了投資人的心理。


    了解投資人心理也有助於看線圖，因為分辨投資人的心態偏強勢還是疲軟，有助於分析股價走勢。


    # 考量投資人心理，才能活用技術


    驗證「酒田戰法」讓我又深深感受到了了解 K 線出現局面的趨勢，有多麼重要。


    舉例來說，不論是「晨星」或「夜星」，出現在上漲行情還是下跌行情時，意義完全不同，當然投資操作也不同。


    可以說投資要獲利，與其記住「酒田戰法」，不如學會現代適用的趨勢預測手法，更為有用。老王賣瓜，我所提倡的相場流投資術，不只看 K 線和均線的動向，還考量到投資人心理以預測趨勢。'
  merge: -1
  img_proc: true
- pgno: 74
  md: '此外，為了讓相場流投資術永不退流行，能永遠在股市中，成為大多數投資人支持活用的技術，我也有強烈決心，必須不斷地精益求精。


    「酒田戰法」跨越了兩百多年的時空流傳至今，但很遺憾地，這種技術已不再適用於現代股市。


    接下來，我會一邊介紹「酒田戰法」的代表性K線線型，一邊提出我的評語，以幫助大家活用這些線型。'
