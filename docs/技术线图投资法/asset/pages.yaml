- pgno: 217
  md: '# 結論


    # 不斷精進練習，讓你在股市屢戰屢勝


    ![](img/7d8739be94e45f3207e2174a81662558_217_0.png)


    若每天看盤，想發現值得注意的訊號時，能有一本像圖鑑的參考書，拿來即可確認那是賣出或買進的訊號，那就好了。這也是我編纂本書的初衷。本書內容網羅了現階段我研究出的所有訊號。就像我給那些訊號的有趣命名一樣，我相信這會是一本有趣的書籍。


    然而，在編纂的過程中，我也有一些感觸。雖然有老王賣瓜的嫌疑，但我還是不禁覺得，自己研究出的訊號「真是太厲害了！」


    職人很寶貝自己的工具。料理職人一定會常常磨刀，確保刀鋒銳利能發揮食材的美味。


    對於自認為股市職人的我來說，訊號就是我的工具之一，所以我必須時時磨練這個工具。每天我都兢兢業業地驗證與研究，有沒有哪裡有陷阱？有沒有更精準預測股價波動的方法？


    這次也介紹了新技巧給大家，但這不會是終點。只要驗證幾萬年分量的線圖，一定還有可以開發的技巧。技巧會不斷地進化。


    我在自己主持的股票教室中，常不厭其煩地對學員們說：「要強硬起來！要努力再努力！」如果想在股市獲利，就要研讀過去的'
