  md: '線，彷彿追著 K 線一樣漲跌。


    # 均線的排列可預測趨勢


    線圖上紅黑 K 線交錯出現，時而漲幅，時而下跌，劇烈震盪，未來到底會朝什麼方向波動？這實就像暴衝的馬匹，難以預料。**此時建議大家不要看 K 線，只要看均線。**


    因為從 5 日線（5 週線）和 20 日線（20 週線）的位置和傾斜，即可推測股價趨勢。當 20 日線在上 5 日線在下，而且都呈左上右下的走勢，那就是下跌趨勢。反之，當
    5 日線在上 20 日線在下，而且都呈左下右上的走勢，那就可視為上漲趨勢。


    ![](img/7d8739be94e45f3207e2174a81662558_45_0.png)'
