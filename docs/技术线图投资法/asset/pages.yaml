- pgno: 149
  md: '形成 M 字型的曲線是收盤價連成的曲線。以 K 線來說，紅 K 線的收盤價在實體上方，黑 K 線的收盤價在實體下方。只要看習慣了，光看 K 線的排列可能就可以在腦中描繪出收盤價曲線，不過這樣還是不太容易理解。所以如果可以，就把線圖軟體的設定由
    K 線改成收盤價曲線吧。只要收盤價曲線呈現 M 字型，就可推測漲勢到頭了。


    K 線的排列則是紅 K 線→黑 K 線→紅 K 線→黑 K 線。


    # 投資人的疑心暗鬼，造就巴爾坦


    漲了跌，然後又漲、又跌，這就是巴爾坦線型。看來充分表現出投資人對於該買、該獲利了結、還是該賣的迷惘不安。作頭區出現此線型，常常就是狂跌的起點。這可能是因為投資人痛下決心，不再迷惘了。


    表示作頭區的均線訊號有雙重頂（Double Top）和三重頂（Triple Top）。也就是線圖上出現 2 個或 3 個山形的訊號，但用收盤價曲線來看，常會發現最後的山頂形成巴爾坦線型。只要確認雙重頂和巴爾坦線型出現，就可以很精準地預測股價將在作頭區反轉向下。這也是布局賣空的時機。'
