  md: '第 3 章

    驗證 K 線經典「酒田戰法」的 40 種組合


    # 相場流觀點


    這就相當於最低價屡創新高的「Kokoda」（見第 197 頁）。第一根紅 K 線和第五根紅 K 線相比，低點越來越高。如果多條均線都上升，可以先試水溫買進，或者等再出現一根紅
    K 線或突破高點時再買進。


    ![](img/7d8739be94e45f3207e2174a81662558_83_0.png)


    # 相場流觀點


    所謂覆蓋線，指的就是吃掉紅 K 線實體的黑 K 線。例如黑 K 線為「反下半身」，就應該覺得「怪」，心裡要考慮下跌的可能性。這也是根據均線排列和 K 線位置，來預測會向上突破還是向下跌破的場面。


