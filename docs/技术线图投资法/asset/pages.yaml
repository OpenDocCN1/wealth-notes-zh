  md: '![](img/7d8739be94e45f3207e2174a81662558_166_0.png)


    # 利用反應投資人心理的法則，尋找趨勢轉換點


    股價天天有漲有跌，沒有股票永遠在漲或下跌，漲跌終有盡頭。而這種股價波動或多或少都受到投資人「心理」的影響。


    當漲勢持續時有人會意識到是否已到頭，出現「在轉跌前了結獲利吧。來賣空為下跌做準備」的心理，反之，則會意識到是否已觸底，出現「逢低買進、進場買進為上漲做準備吧」的心理。


    反應出這種投資人心理的法則就是「 9 日法則」。


    上漲趨勢、下跌趨勢時，投資人開始意識到頭部、底部，下意識決定獲利了結，大概是在第 9 日左右。因此不論漲跌，大概都會在 9 日左右暫時告終，這常常是趨勢轉換的時間點。


    操盤時可有效活用 9 日法則，決定在行情中獲利了結的時間點。不知是否該收手時，就是 9 日法則大展身手的機會。


    若是上漲趨勢，可以算一下自己買進的那天，是起漲後第幾天。如果是第 3 天，就可推測還可能漲 6 天，藉此設定獲利了結的預定日期。在下跌趨勢佈局賣出時也一樣，算算是第幾天，然後設定回'
  merge: -1
