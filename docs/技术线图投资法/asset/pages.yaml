  md: '走勢我稱之為「川」。


    # 「川」下跌劇烈時，看起來像「瀑布」


    「川」這個命名，大家只要看圖就可以一目了然。進入下跌局面的川，看起來或許也像是一道氣勢磅礡的瀑布，由上游沖瀉而下。


    由 A 局面（下跌）進入 B 局面（盤整），再由 B 局面（盤整）進入 C 局面（上漲）時，也都會形成川。


    在 B 局面中，原本在 20 日（週）線下方來回的三條均線的排列重疊，而後相交，變成由上而下依序為 3、5、7 日（週）線的排列。接著，由 3 日（週）線帶頭，開始依序向上突破
    20 日（週）線，於就由盤整進入上漲趨勢。


    也就是說，不論漲跌，在趨勢轉換時三條均線會先重疊，然後相交，依照 3、5、7 的順序穿過 20 日（週）線形成川。這種均線走勢可說是順勢操作買賣時，不可錯失的重要關鍵。
