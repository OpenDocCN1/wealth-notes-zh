  md: '這種操作來累積獲利。


    # 同時具備兩種手法特徵的「短線操作」


    第三種「短線操作」則是介於散彈槍和掌握股價波動慣性之間的交易手法。操作期間為 1 至 2 週左右。觀察多檔個股，在出現買賣訊號的標的之間轉換，到此為止和散彈槍一樣。但也會視需要操作部位，這一點則可說較接近掌握股價波動慣性的手法。


    無論哪種手法，第 4 至 6 章介紹的買賣訊號都有效。此外，我也要附帶說明，釐清趨勢的方法和平倉點也很有效。


    | 名稱 | 散彈槍 | 掌握股價波動慣性 | 短線操作 |

    |---|---|---|---|

    | 特徵 | 期間 | 2 日～1 週 | 3～6 個月 | 1～2 週 |

    | | 部位操作 | 不操作部位。只做買或賣的「只鎖定一邊」的投資 | 頻繁操作 | 視需要操作 |

    | | 觀察個股 | 觀察多檔個股。投資 2 檔個股以上的分散投資 | 鎖定自己擅長的一檔個股 | 觀察多檔個股。投資 2 檔個股以上的分散投資 |

    | | 難易度 | 初級 | 高級 | 中級 |

    | | 附注 | 幾天就平倉，所以初學者和資金少的人也容易上手。而且適合前景不明的市場 | 掌握該檔個股特有的波形，和價格波動的特性操作。由行情上下波動以雙向獲利
    | 也用過線圖來判斷，也看日線圖操作。如果價格波動不如預期，就操作部位填補損失 |


    圖表 93 三種交易手法與特徵'
