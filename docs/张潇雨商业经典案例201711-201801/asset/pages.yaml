  md: '# 小败局 | 造成易到败局的三大错误


    在上期专栏里，我们讲到了周航在创立易到之前的创业史，以及刚刚创立易到时候的孤独。而这种孤独，马上就被无数个局的打车软件公司冲得一干二净。


    易到最辉煌的时刻应该是2013年年末到2014年下半年，那个时候易到在专车的市场有80%的市场份额。业务做得好，融资也顺利。


    易到在2013年12月和2014年8月两次拿到了6000万美金左右的来自携程的融资，而且携程作为战略投资者，还把自己的接口开放给了易到。那时候用户去机场，接送机都可以直接叫易到的服务，那个时候易到过得相当舒服。到了2014年9月，易到又获得了以GIC，也就是新加坡政府投资公司领投的1亿美元的D轮融资。


    当然与此同时，易到的对手们也没有闲着。


    # 丨周航的第一个错误：对行业理解不够深


    2012年，滴滴和快的成立。


    一开始资本并没有大规模进入这个行业，转折点发生在2014年1月1日。当时腾讯以1亿美元领投了滴滴，投资的重要逻辑是，打车可以是一个培养用户使用移动支付的很好的入口。


    结果这一开始，资本就疯狂进入这个行业。到了2015年年初，滴滴累计融资了8亿美元左右，而快的是7亿。


    # 丨周航的第二个错误：算错了经济账


    其实他曾经模糊糊地想过，如果在打车市场先积累起大量用户，可以顺便带起易到中高端的专车业务，但最后分析，这种做法非常不经济。


    # 丨周航的第三个错误：融资拖大


    当然，如果算账的失误属于一个理性创业者的自我坚持的话，那么周航在融资上面的拖大，应该就是他后来反复反思过的一个错误。'
