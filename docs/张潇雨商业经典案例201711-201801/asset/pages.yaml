  md: '# 阿里 | 蚂蚁金服和支付宝、阿里集团的关系


    昨天和前天，我们通过“支付宝VIE事件”这个案例详细讲了讲关于VIE的知识以及支付宝当年脱离出阿里集团的风波。


    今天，我们就顺着这个思路，来看看支付宝和蚂蚁金服是个什么关系，以及马云又是用怎样高超的手段，以几千万人民币来控制现在估值已经超过700亿美金的蚂蚁金服的。


    # | 支付宝和阿里巴巴集团的关系


    昨天我们提到，马云为了让支付宝拿到牌照，“先斩后奏”地切断了支付宝的母公司，也就是浙江阿里巴巴电子商务有限公司和阿里巴巴之间的控制协约。


    后来经过谈判，在2011年7月29日，阿里巴巴集团、雅虎和软银宣布，就支付宝股权转让事项正式达成了协议，协议里面的内容就是支付宝怎样补偿阿里集团，主要有以下几个方面：


    +   第一，支付宝将继续为阿里巴巴集团及其相关公司提供服务；

    第二，阿里巴巴集团会获得支付宝的控股公司给予的合理经济回报。回报额是支付宝在上市时总市值的37.5%（以IPO价为准），另外，这个回报额要不低于20亿美元且不超过60亿美元。这相当于一次性性的补偿，在支付宝上市的时候兑现；

    第三，协议还规定，支付宝公司将会支付知识产权许可费用和软件技术服务费给阿里巴巴集团。该项费用为支付宝及其子公司税前利润的49.99%。当支付宝或者其控股公司上市或发生其他变更事件之后，这笔服务费就不再需要支付了。本质上，这相当于上市之前每年把支付宝利润的一半支付给阿里巴巴，作为补偿。


    后来在2014年，阿里巴巴启动了上市计划，为了能够获取支付宝和蚂蚁金服更多的利益，双方又对这份协议进行了修改。其中有三处改动比较重要：


    +   一是49.99%利润分享降低到了37.5%，但分享的领域从支付宝扩大到了整个蚂蚁金服；

    二是取消了60亿美元的上限；

    三是阿里巴巴将小微业务划入了蚂蚁金服。


    也就是说，从此以后阿里每年可以获得蚂蚁金服37.5%的税前利润，而当蚂蚁金服上市的时候，还有一笔首次公开发行价格37.5%的一次性回报，没有上限。


    # | 支付宝和蚂蚁金服的关系


    关于这两者的关系，简单来说是这样：2013年3月的时候，支付宝的母公司，也就是我们之前反复提到的，纯内资的浙江阿里巴巴电子商务有限公司，宣布会以自己为主体筹建小微金融服务集团。同时进行股权调整，小微金融40%的股权归小微金服和阿里巴巴集团员工持有，60%归外部战略投资者持有。而马云个人持股比例不会高于他在阿里巴巴集团的持股比例7.3%。


    等到了2014年6月11日，阿里巴巴电子商务有限公司更名为浙江蚂蚁小微金融服务集团有限公司，简称“蚂蚁金服”。


    # | 蚂蚁金服的股权结构


    根据截止到2017年年中的数据，蚂蚁金服的主要股东有两个，一个叫做杭州君瀚股权投资合伙企业，占股42.28%，一个叫做杭州君澳股权投资合伙企业，占股34.15%，两家加起来有76.4%左右。


    剩下的23%左右的股份，由非常多的机构分散持有，里面有一些你听说过的，比如：全国社保基金、中国人寿保险、马云的云峰基金，等等，但占比都很小。


    # | 本周总结


    本质上，除了各种理论和技术细节以外，这几天的专栏我想讲的是两件事：

    首先，比较获得结论，学历研究一家公司的办法才是最重要的。搞清楚蚂蚁金服的历史或者支付宝的风波事件当然可以获得好玩的故事和结论，但去尝试研究它们的方法，才是这个专栏和我希望给你展示的。

    以及，我想起了马云说过的那句话：企业家的胸怀都是被委屈撑大的。'
