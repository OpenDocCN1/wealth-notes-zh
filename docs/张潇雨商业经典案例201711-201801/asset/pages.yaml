  md: '# 王兴｜校内网的发展与失败


    王兴｜校内网的发展与失败


    在找到自己创业的清晰定位，也就是基于真实社交关系 dumps 的大学生社交网站之后，王兴的校内网开始快速发展。然而产品有了，团队有了，创业还要有一个必不可少的因素——资金。而初出茅庐的王兴，就在这个方面上栽了一个大跟头。


    # ｜红杉资本的橄榄枝


    其实本来校内网的融资形势不错。


    2006年年初有一个小插曲：当时校内网推出的时候没钱请设计师，整个用户界面都是复制的Facebook。后来就有人在网上写文章骂他们抄袭，结果这篇文章被全世界最著名的投资机构红杉资本看到了。


    于是有一天早上，王兴敲开王慧文办公室的门，说红杉资本打电话来找他们，让他们准备一下商业计划书，去红杉的办公室谈一谈。结果，王兴、王慧文加上当时另一个同事赖斌强三个人快速地写了一页纸的商业计划书，还在出租车上给丢了，后来又在红杉的会议室临场写了一份。


    那个时候的王兴对于资本和商业的概念还非常浅，但是心高气傲，开的价格不低。投资人想砍价的时候，他们却回答：“再等段时间，我们的价格就更高了。”


    # ｜来自陈一舟的“威胁”


    在王兴团队寻找投资的时候，还有一个人虎视眈眈地盯着他们。这个人就是 陈一舟。


    陈一舟1969年生人，比王兴年长十岁，也是中国互联网界一个传奇式的人物。


    # ｜校内网再一次融资失利


    在红杉之后，王兴还谈了一家美国的投资机构，融资额度是100万美元。2006年7月，这个投资机构派人来中国转了一圈，拜访了腾讯、千橡、占座网等等公司，相当于尽职调查了。那时候千橡已经融资了4800万美元，正在大力扶持旗下的5Q校园网，在人寿大厦的豪华写字楼里办公，办公室有几千平米；占座网当时也有国家政府机构支持和红杉的投资。校内网呢？只有一个一百多平米的民居，几张桌子，十几个人。


    # ｜卖掉校内网


    而只有一个 人还对校内网“不离不弃”，那就是陈一舟。


    > “这取决于我们遇到什么样的投资人。如果投资人能够在很多地方帮助我们，是可以做成的。如果投资完就不怎么管，让我们自己随便搞，那就不行，因为我们还不够成熟。”'
