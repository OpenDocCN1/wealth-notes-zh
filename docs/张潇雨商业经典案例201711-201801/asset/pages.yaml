  md: '完成有重要影响。如果我们的目标是登上世界最高峰，那么每天的适应性训练可能就不再有很多痛苦感受；如果我们的目标是让产品为更多人群提供价值，那么每次产品迭代后的琐碎与辛苦就不会带来很多压力和沮丧。如那三个石匠的故事中所说，把工作当成养家糊口的任务，就很辛苦。其工作感受与工作的效果远远不如为上帝建造一座最伟大的教堂的石匠。做人也是这样，心中怀有天下疾苦的人，每天的工作就会有无穷的动力，我想扎克伯格和很多真心做慈善的人都有这种期怀。


    有人说，如何判断一段感情质量的好坏，要看恋爱双方有没有“成长性思维”，其实判断一个人是不是伟大的企业家，又何尝不是同一个道理呢？拥有“成长性思维”的企业家会知道，想要改变外部世界，一定
    Hierbei 要先改变自己；拥有“成长性思维”的企业家会知道，当企业遇到问题的时候，他不应该想这条路是不是走错了，而是应该想—我们是在什么事情或者观念上出现了问题？有没有改变的可能？我要怎么去才能够对？拥有“成长性思维”的企业家会知道，当面前困难重重，成长的机会就到来了；拥有“成长性思维”的企业家会知道，自己和企业所处的阶段不同，要做的事情也会不同；拥有“成长性思维”的企业家会知道，无论结果如何，自己都可以坦然面对，然后总结经验教训，去迎接更好的自己，更广阔的未来。扎克伯格3.0，是一个心怀天下、关心着人类未来，又有很强个人做事风格的慈善家和资本家，也是一个拥有“成长性思维”的企业家，是我们大家的榜样，我们不得不心生佩服，并向他看齐！


    # Facebook | “普遍基本收入”的利与弊


    基本收入的概念我想提出一个简单问题来思考，毕竟问出一个真的想知道的问题比答案重要。Q: 钱从哪里来？来源稳定吗？钱从政府来，政府的钱从人民+企业纳税得来，如果当地的企业无法维持稳定收入，例如发生了战争，技术变革造成的当地企业倒闭，金融危机发生等等，会不会让税收出现补助金的资金链断裂。这个复杂的问题考验了国家的制度，企业=(


    我记得罗胖曾经讲过一篇关于穷人之所以穷是因为他们没有钱的文章。贫穷限制了他们的想象力，每天醒来做的第一件事情就是在想怎么弄到今天的食物。在这样的环境下，穷人们只能用智慧解决眼前的饥饿，而不能想到未来的一切，也就更不可能去规划未来。的确普遍基本收入肯定会养出一批好吃懒做的人，但是整体社区的创造力会大幅增加。我觉得决定一个人是好吃懒做还是为社会做贡献完全取决于其教育水平。所以如果要推行普遍基本收入的话，基本的教育水平一定要发达。


    老师，今天的话题让我想到了《娱乐至死》，其实有的时候我想问的是为什么有一部分人会很富有，而有一部分人不会，为什么呢？因为财富本是一个相对概念，我有100，他有50，我比他富有，但这只是个数字概念，其实最可怕的是很多人的生活并没有目标，会保活着一样有玩，有吃，为什么要努力呢？人赚钱是为了什么？为了自我实现？为了同伴压力？为了生存？如果贫穷不再被排斥，那么会不会有更多人“贫穷”，贫穷到底是个人问题还是社会的问题呢？如果投胎在埃塞比亚，就是天生看“得到”会不会人生真的有大不同？这是个问题。其实，贫穷是个结果，是社会、个体、世界，共同的结果，这绝对不是一个美好理想主义就能解决的。因为这个问题太复杂了，复杂到没有终极答案，只能摸着石头过河。资本只有越来越集中化才能解决人类社会更大的问题，如果这是个大方向，那么“贫因”是不是就很难终止呢？最后，《娱乐至死》里面说的那个问题就是有很多没有电视，依然不愿意接受教育，在移动互联网的今天，依然是“王者农药”的天下，这是不是个问题呢？


    从经济学的角度来看，我认为这个无法实现。可以参考通货膨胀产生的过程来分析，像水也像蜜，是一个逐渐扩散的过程。货币超发最初阶段，人们可能觉得手里的钱多了，可以购买的商品多了，但是慢慢的，人们会发现物价也会提上来，经过一段时间购买力和通货膨胀前几乎没有差别。普遍基本收入可能也是这个过程，最初阶段可能会解决一些问题，但是随着时间的推移，每个人都有了普遍基本收入，情况再次回到原点，与之前一样。


    罗振宇老师之前有一期专讲了德国的社会福利制度。说德国的穷人都领着很高的福利，人们基本上是没有动力去工作的，他们生活也不错，有的地方，电视和冰箱一样不少，每天就是躺在家里面喝酒，身材变得肥胖臃肿。出去工作的话，交完税拿到手的钱可能还不如在家里领的福利多，导致大家的上升心确实是不够的。但是真正上进的人，一旦找到了工作，就会马上搬离这个社区，进而导致这个社区更加破败，为什么呢？因为这些人可能只是暂时失业，他们有很好的手艺，会修理社区，是足球教练，会带领孩子们踢足球，他们走了，这个社区就什么都没有了，一步步衰败下去。领福利的人的小孩就在家里玩，看电视，他们长大了也就父母一样领福利。如此循环。而且这种制度导致单亲妈妈特别多，因为有了福利，年轻女性能未婚先孕，怀孕了也不用担心，可以不用依靠男人了，自己靠福利能抚养小孩长大。但是在这种环境下成长起来的小孩，身心不会太健康，长大了还得靠政府。有一种阴谋论的说法，说这种福利制度是上流精英人群为了自身利益，用于巩固自己的地位而鼓动政府采取的。因为精英人士会从小鼓励自己的小孩吃苦，比如每天在足球队训练，发奋读书，将来好继续保持精英的地位，而弱势群体就一直去领福利吧。


    # Facebook | 劫敌Snapchat上线


    Snapchat成功本身就带着Facebook的影子，创始人都非常年轻，都是名校级学生。能够在短时间内把用户数做上去，并且在纽交所上市，其产品可用性应该也是不错的（我自己没用过）。回顾谌雨老师在小船局中提到商业世界的两个真理：消费者的喜新厌旧和永远增长。Snapchat成功突围Facebook，作为一种新的比较小众的社交软件很好地满足了消费者喜新厌旧的需求，然而当它的用户群体不断扩大时，就面临着under
    armour面绌的问题，如何在产品大众化后仍然让消费者觉得你很酷，如何留住用户，以及更重要的，如何保持增长，吸引更多的用户。回顾Facebook的成长历程，Facebook推出了一系列革新性的产品特性，比如改变信息消费模式的news
    feed，比如open graph，扎克伯格强悍的产品能力与学习能力让公司能够突破强敌环伺，构建起庞大的社交帝国。在巨头林立的时代，Snapchat如何突破社交帝国Facebook的封锁，恐怕不是一件容易的事情。


    [1] 猎奇之后如何持续运作，可能是未来持续产生效益的关键。目te前的各新兴App都在采用各种酷炫的特点来吸引大家的注意力，虽然短期内是可以获得成果的，但这种酷炫自身存在着快速衰减的属性，同时这类新特点也会很快被其他产品所克隆。就像没有几个表情包能够持久地在微信群中传播，大家都会选择最新出现的热门表情，而那些过气的表情也很难再火起来。[2]
