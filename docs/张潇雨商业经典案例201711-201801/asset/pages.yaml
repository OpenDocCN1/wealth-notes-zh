    今天的专栏，我们就先介绍这几组概念。下一期我们继续讲解这两份投资文件里面的条款，而且还要讲解一个更重要的东西，就是它们里面没有哪些条款。毕竟这两份文件都是对创业者非常友好的，很多常见的条款都没有加入。


