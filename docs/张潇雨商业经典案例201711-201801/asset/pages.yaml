  md: '# YC｜面试的五个重要原则


    YC｜面试的五个重要原则


    在上一期专栏里，我们讲到了创业公司早期做招聘的几个标准：驱动力、好奇心、品德操守。可能你也感受到了，其实初创公司招人需要衡量的东西，和很成熟的大公司确实很不一样。虽然专业技能这种“硬”东西也很重要，但是能让一个创业公司存活下去的往往是那些“软”性的人的品质。这一点在我们讲过的很多公司里面都能体现。


    讲完招人的标准，我们这期专栏讲一讲后面的两个部分：面试流程和几个最重要的原则。


    # ｜招聘之前要做什么准备？


    YC的保罗·格拉姆说过，十几年来他见到的创业公司最常犯的招聘方面的错误其实是：当你招聘的时候，其实你根本不知道自己想要什么样的人。


    我曾经总结过，创业公司的招聘有两个最有意思的矛盾：


    +   1. 当你想招一个人，尤其是早期比较重要的人的时候，TA Iq定在某个方面是比你要更专业的，否则你也不需要TA了。但是由于你在那个领域并不专业，所以很难判断出某个人是不是在TA那个领域真得干得很
    好，还只是虚有其表。


    +   2. 越是弱小的创业公司，越需要非常好的人来加入，一起把公司做强做大。但反过来，越好的人选择就越多，对机会也越挑剔，所以越难加入那些弱小的公司。


    所以在公司早期，能用各种方法锁定一个牛人，那是非常值得开心 的事。


    # ｜该为面试做什么准备？


    马克·安德森提到过他见过的创业公司里，在面试流程这个环节经常被人忽视的一个问题——虽然每个人都口口声声说招聘重要，但是却从来不优化自己的招聘流程。


    # ｜面试的五个重要原则


    这五个原则，是我从硅谷的最重要的几个投资人的文章、斯坦福的创业课和我自己个人的经验总结出来的。希望未来有一天你在创立一家企业，或者管理团队的时候，能想到它们。


    原则一：多花时间


    原则二：慢慢招人


    原则三：快速开人'
