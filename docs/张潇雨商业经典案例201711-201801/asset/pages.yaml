  md: '# Facebook | beta版扎克伯格的初级进化（附投票）


    Facebook | beta版扎克伯..


    在前面的文章里，我们讲到了Facebook这家公司之于我们这个时代的标志性意义，相信你应该已经感受到了这家公司的特别之处。而在这里面，你可能发现，Facebook之所以这么成功，一个最关键的原因就是它的CEO马克·扎克伯格。


    # I 为什么是扎克伯格？


    我之前在专栏里讲，扎克伯格完全定义了我们这个时代对公司领袖和顶级创业者的模版和想象，这个评价绝对是不夸张的。


    现在主流的投资界和媒体界都认为，Facebook之所以能有如此大的成功，扎克伯格的天才思想和不断进化的品质功不可没。就像硅谷的那个笑话说的：“Facebook
    为什么在当初能打败MySpace？因为Facebook的CEO是扎克伯格，而MySpace的经理是一群猴子。”


    我们可以再来换一种说法。


    从2004年Facebook成立，到之后的十几年里，整个世界经历了很明显的几次浪潮：社交网络、移动互联网、人工智能和VR，中间还穿插了一次金融危机。


    而有家公司：


    +   在诞生的时候已经不是第一名，在它之前有Friendster和Myspace；

    有股权问题和法律纠葛；

    在之后巨大的产业浪潮中经历了几次转型。


    结果，它不但没有死掉，而且还靠着正确的战略和执行力打下了天下，几乎在每个正确的节点都做对了必要的动作，从而屹立不倒，越来越大，变成了全球的霸主和巨头。


    而这家公司的掌舵者只是一个每天穿着阿迪达斯拖鞋的大学辍学生，而他完成这件事的时候只有三十岁。


    我要是写这么一个剧本，你能相信这个故事吗？是不是得说我是瞎编的？但实际上，这个故事就在Facebook上真实地发生了。


    想一想当世最伟大的CEO乔布斯——关于他的历史我们之前已经介绍得非常清晰了——他从25岁到50岁，用了25年的时间才完成了这种从偶头青到全球顶级企业家和时代领袖的进化，而扎克伯格完成这件事的时间是10年，而且是从20岁到30岁。这是一种怎么样的存在？


    所以，每当有人问我应该如何理解Facebook这家公司，或者应该从这家公司获得怎样的启示的时候，我的回答都是：最应该去感受的，其实不是什么Facebook的商业模式，而是扎克伯格近乎恐怖的学习能力和进化能力。如果能学到这个东西，不管是对个体，还是对“CEO就是公司天花板”的企业，都是有巨大好处的。


    所以接下来的三天时间，在进入Facebook业务层面的分析之前，我们先来简单梳理一下马克·扎克伯格截止到三十出头的神奇人生。在这个过程里，你会看到他非常明显的进化与迭代，同时也能发现他始终如一的一些品质。如果我们把扎克伯格比作一个系统的话，你就会发现他从扎克伯格“beta版”，到扎克伯格3.0版的伟大进化。就让我们从“扎克伯格beta版”开始讲起。


    # I “扎克beta版”犯下的两大错误


    “扎克beta版”应该就是他的幼年到初入大学的阶段。在这个阶段里，他已经展现出了一个天才工程师的苗头。


    扎克伯格1984年出生在美国的一个中产家庭里，十岁开始就接触爸爸的电脑。十二岁那年，他写了自己人生中的第一个小程序，把爸爸办公桌的电脑和个人电脑连接了起来，并且起名叫ZuckNet。


    之后，扎克伯格一直对编程很感兴趣，在上大学之前，他就做出了一个可以识别你音乐口味和爱好的软件，现在看起来是个非常流行的音乐流媒体服务了。当时，微软就想以100万美元的价格把这个软件收购，并且买断扎克伯格，让他来为微软工作，但是扎克伯格直接拒绝了这个offer，去了哈佛大学。这时候，扎克伯格正好18岁。


    但对于“扎克beta版”来说，虽然他展现了天才工程师的天分，但在*(-阶段他最大的特点还是毫无经验，犯错很多。


    Facebook早期创立的故事可能很多人都熟悉了，当时扎卡伯格犯了两个很大的错误。


    +   1. 和温科沃斯兄弟（Cameron Winklevoss & Tyler Winklevoss）的知识产权纠纷。


    当时是温科沃斯两兄弟找的扎克伯格，要“做一个社交网站”，但最终扎克伯格抛弃了这两个人，决定把这个创意纳为己有。虽然扎克伯格自己对这个创意做了很多修改，但后来两兄弟也一直在状告Facebook和扎克伯格，官司打了很多年，最终以扎克伯格赔偿了传说中的6500万美元和解了。


    +   2. 和好友、Facebook的始人爱德华多·萨维林（Eduardo Saverin）的纠纷。


    简而言之，爱德华多本来是占Facebook30%股份的创始人之一，但后来两人理念不合，扎克伯格在律师的帮助下使用了一些技巧，把爱德华多的股份稀释到了10%以下，自己把控制权牢牢地握在了手中。


    这段纠纷的官司也打了很多年，最终爱德华多保留了一定的股份，但彻底退出了公司，当然这样已经让他成为了亿万富翁。


    现在回头看，这两个错误，放在大部分创业公司上都是非常致命的了。而且毫无经验的扎克伯格当时的融资能力也不强，见了一大圈VC，最终也只有彼得·蒂尔给了他50万美元，占比9%左右。50万美元比起现在动辄融资几千万美元的创业公司来说如何？可以说，扎克伯格就是在这样一种近乎恶劣的环境下成长起来的。


    # I “扎克beta版”的两大宝贵品质


    那么为什么，犯了如此多错误，作为一个商业领袖也不合格的扎克伯格，可以在非常脆弱的早期阶段仍然高歌猛进呢？因为在这个“beta版”的阶段，扎克伯格就展现出了两个极其宝贵的品质，在后来的日子里，这两个重要的品质也一直贯穿在Facebook的成长和扎克伯格的进化历程里，带着他们走得很远很远。这两个品质就是：第一，强悍的产品力和执行力；第二，善于从他人身上学习的能力。


    +   1. 强悍的产品力和执行力。


    如果一个公司犯了那么多错误还能活下来，可能从另一个方面证明，Facebook的产品实在是太好用了。


    虽然前有Friendster和MySpace，但Facebook出众的产品设计，对实名制的追求，还有从顶尖大学慢慢向外扩张的策略，都让Facebook在最艰难的时候站稳了脚跟。


    而且，虽然Facebook现在已经成了全世界最大的广告公司之一，但之前，扎克伯格很长一段时间都坚持不在Facebook里放置广告。这种清爽并且抗拒的产品观比起MySpace上的暧昧、各种不友好信息和各种花样的广告比起来，迅速地赢得了人们的心。


    出众的产品力和执行力带来的还有很多微创新的能力。


    很多人应该都听过Facebook“十天七个好友”的故事。在早期的時候，Facebook的员工发现很多人注册以后一点也不活跃，这样用户就慢慢流失了。于是公司就组织了团队，研究怎么提高用户的留存率问题。后来他们发现，能留下来的用户一般都是加了一些好友，已经形成自己的社交网络的用户。


    于是他们经过计算，确立了一个目标，那就是：想要用户留下，那么就让TA在10天内完成7个好友的添加，这样这名用户的留存概率就会大大增加了。


    后来，促使用户10天内添加7个好友就成为了Facebook内部全体员工的一个核心目标之一。这个目标甚至一直坚持到了Facebook有了10亿用户的时候。'
