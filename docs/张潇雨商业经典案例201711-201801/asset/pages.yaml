  md: '明确。为了拿到牌照必须撕裂VIE，不论撕也没假都需要在桌面上的决裂并且要声势浩大。所以雅虎的公开声明会不会是情势需要呢？纯属臆测！张老师认为是否有这种可能性呢？


    张潇雨


    其实有可能会有这样的因素。因为雅虎如果能在台面下解决问题，是没有必要闹到台面上的。发公告就一定有发公告的作用，毕竟这么大的公司，每一步都是精心计算过的。


    一个企业家每时每刻想的事情是如何让企业活下去，为了活下去有时候必须要拿出非常手段。优步的创始人和齐帮主当年都做过类似的事情，不去亲身做企业估计永远体会不到当时的压力和焦虑。


    真是不险一跌啊。不空否认支付宝已经是内资了。做任何事情你更有一个更大的使命，看得更远，才能走得更长。电商解决了支付、信用、物流问题，才能走得更长久。马云的决定是对的，脱离外汇控制，从某种意义来说也是向中央的一个表态。同时，马云是有私心的，支付只是一个起点，后面的大数据金融才是重点。没有中央认可，这件事办不成，马云说的让天下没有难做的生意，也只是一句口号而已。


    ①这个事件的过程，其实比我们想象得更加复杂，有涉及国家金融安全、股东利益、支付宝当时5亿用户、行业影响等各方利益的博弈，完美的解决方案很难，只能妥协，找到最好。②我们商业分析的目的，不是为了事后诸葛亮的点评，而是融入当时的场景中，用关联、整体、动态的方式来体验当事人的心境和拷问、磨炼自己的内心。


    # 阿里 | 支付宝VIE事件（上）


    记得以前主页上面，《李翔商业内参》里讲到过，感兴趣的小伙伴可以在9月初的专栏中找此专题的分析。VIE架构，是著名大律师刘钢先生设计出来的。灵感源自于当初摩根士丹利投资中国平安，因为时间紧，审核流程复杂，刘律师提议让摩根在中国设立WFOE，根据深圳特殊的商业投资规定，摩根很快就签署了投资协议。在新浪的上市案里，刘钢就是因为源自摩根投资案的灵感，将新浪拆分，将拥有专利、做技术
    denominated部门拿到海外成立WFOE，国内公司做媒体和互联网接入，国外公司之后通过协议控制国内公司。之后网易等各大互联网公司也由刘钢负责。但2001年安然事件的发生，美国证监会增强了公司表外资产的管理，要求即使上市公司在表外的公司没有股权，但拥有控制权的话，两者也要合并资产负债表。但因为仅为美国证监会要求，实质对中国投资不能造成致命影响。


    VIE架构的设计者是律师界大名鼎鼎的刘刚。因为设计出这个VIE架构，2010年他被授予“亚洲律师界终身成就奖”，这也是中国律师首次获此殊荣。


    互联网公司通过VIE结构，在海外上市。我发现很多足球明星也是通过这种方式来避税的。C罗在法罗群岛设计一家空壳公司，把自己的代言收入和广告收入等等转移到空壳公司上，来躲避
    head生活国家的高额所得税。还有很多大牌的过气明星，比如贝克汉姆。在职业生涯晚期，他在巴黎圣日耳曼踢球，就把自己在俱乐部的收入全部捐给儿童基金会，这样法国就不会再对他在英国的资产收个人所得税了。


    在网上了解了一下关于我国企业尤其是互联网企业为什么选择VIE模式的原因，供大家分享。新浪运用VIE模式成功在境外上市之前，我国企业特别是民企主要是通过“红筹模式”在境外融资。2006年9月商务部联合发布了《关于投资者并购境内外企业的规定》（10号文）在一定程度上承认了“红筹模式”合法性，也因为如此，商务部和外汇管理局等其他部委更是严格监控“红筹模式”。据百度百科解释，“红筹模式”是指境内公司将境内资产、权益与股权、资产收益或协议控制（VIE）等形式转移至在境外注册的离岸公司，而后通过境外离岸公司来持有境内资产或股权，然后以境外注册的离岸公司名义申请在境外交易所挂牌交易的上市模式。此后几年，基本上没有一家企业通过审批成功建立“红筹模式”。VIE模式作为改进了的“红筹模式”，被大规模使用，原因如下：1.国内上市门槛较高。互联网等其他高新技术企业具有高度成长性，比较难达到A股上市的条件，而我国国内创业板和中小板的财务门槛太高，拒绝了很多优秀企业。相比美国等的证券市场的上市门槛低而且程序更简单，很适合还没有盈利但有巨大潜力的企业。2.
    在境外直接上市门槛的限制。我国证监会有相关法规规定，境内的企业赴境外直接上市要经过证监会的审批，且需满足净资产不少于4亿元人民币，过去一年的税后利润不少于6000万元人民币，并还有增长潜力，按照合理预期市盈率计算，筹资额不能少于5000万美元，上市之后每一次再融资都需要审批。这些规定限制了企业在境外直接上市。3.行业外资准入限制。这是潇雨老师在课上讲过的。


    # 阿里 | 蔡崇信：CFO的三层功力


    我现在是一家日本大型互联网上市公司的ceo office一名成员，公司旗下有80多个子公司。CFO招我们来就是当他的手和脑的延伸。说白了就是帮他实现他的vision。但是很多我的精英同事都觉得一开始，直到现在，很不适应。因为太灵活了。我这工作一年多以来，看到了公司最高层的种种行事和格局，也看到很多下做具体一件事的员工看不到的事。看到老师的这篇文章，我便回想这一年来看到的CFO和CHO的水平和作为，确实就是一个三角，视野方向+资本+人。而我的这份工作分三个层次，1.执行一作出CEO最急于实现的事情、产品、服务、战略等等。2..幕后推手———直和子公司的领导人交流，帮助他们找方向，并用自己的专业知识与见解，给予建议，也可以帮他们做些启动。3.洞察———抽离出来，把自己看作老板（CEO）本人，或者投资人，看看能不能比老板先想一步，每周一个想法。以上分享了一下个人想法，希望老师能指点我还有没有漏的地方，或者我想的方向是否正确。


    张潇雨


    我觉得思路特别对。


    CEO管战略、CHO管人才、CFO管钱，通常我们所说的创业成功所需要的三个条件：人、钱、方向，就都具备了，这应该叫做成功三角。


    作为公司运输部的一名小职员，我认真地思考了这份工作的三层境界：1.了解工作内容、流程和细节，能够独挡一面；2.了解工作中存在的风险以及可能会遇到的风险，提前防范，比如运输合同的疏漏，对公司的不利之处，对物流方的深入了解等；3.能够与其他部门和物流方协调运营的能力。


    设身处地，如果我站在当时蔡崇信的位置，我是否愿意抛弃70万美金的年薪去加入当时还处在概念状态的阿里巴巴呢？我下意识就给出答案，不会！但是，静下心来仔细思考一番，发现加入当时的阿里巴巴还是值得一搏的。如果阿里巴巴失败了，但我的能力还在，还可以回去领个十万年薪的工作，损失的就一年时间。这就又让我想起谷创始人们拉里·佩奇，当时他们的想法也是如果谷歌失败就回去继续读博士。像蔡崇信这种CFO人才，对于风险的评估绝对是深思熟虑过的，而不是我们局外人所认为的那样，被马云一忽悠就相信了。'
