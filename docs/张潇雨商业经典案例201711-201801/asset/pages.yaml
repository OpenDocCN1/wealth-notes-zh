  md: '如果只是钱，那么这就不是好的投资人。真正好的投资人其实扮演的都是伯乐+导师的角色，帮助企业家拓宽视野，拓宽资源圈。因为真正做事的人是没有太多时间去挖掘社会资源的（为什么马云有了蔡中信以后就马上不一样了呢？），刘强东同样也要面对这个问题，徐新恰恰就是刘强东与更广阔的资源对接的节点。最后，与其说是徐新帮助刘强东，不如说徐新笃定中国市场必然要诞生世界级的零售企业。这是个大概率事件，如果从这个角度看，当时的京东是最好的选择。


    就像之前Y.C的保罗·格拉姆一直极力推荐Airbnb一样，徐新也非常肯定京东的商业模式，认定他是一个“好苗子”。之前看刘强东参加一综艺节目，不算标准的普通话，透着宿迁口音，举止投足却又透出一种大佬的风范。之前在中关村卖光盘的经历，自己亲自请京东快递小哥吃饭的故事，实干的作风，优秀的品行，或许这些都是打动徐新的地方。由于自己在电视台工作，平时接触了太多以领取政府创业扶持奖励金而创业的创业者，所以对刘强东这样的实干家，由衷地钦佩。


    1.有时候，两个人相处是相互影响的，就跟找对象一样，首先要有眼缘，相处一段时间，有可能就坠入爱河，走在一起，问到为什么会走到一起？那就列出对方的优点，这些优点感觉其他人也有，其实这都不是主要的，有可能在相处中由于对方的一个不经意的举动而感动，往往不经意恰恰彰显人品。2.伯乐识千里马就是一个很费时的事情，挑选的过程也可能看走眼。3.徐新投资京东的刘强东，认为刘强东就是他心目的千里马，但商场如战场，千里马能不能冲出险地，就要看他的能力和造化了。千里马经过几次磨炼，有了经验，伯乐更加爱护千里马，感情越来越深。再往后，千里马有困难，伯乐就会出手相助！徐新就是伯乐，同时也是伴侣。


    # 京东Ⅰ从线下到线上


    今天简单看了下留言，基本上就两个极端：1.是夸京东好的；2.是贬京东不好的。这里面特别想用罗永浩在《长谈》里谈到的几个点来阐述下，如果一个消费者的购物体验出了问题，不管是产品本身还是平台服务，他的不满意程度是100%，可能得需要10次以上的超级好的体验才能够背回来，但是现实是大部分人是不会给平台第二次机会的。我们这个社会的容错率太低，可是如果从平台的大数据上来看，这都是可以接受的，追求100%满意度那是天方夜谭。单从用户体验上看，京东在一线城市的服务绝对是行业第一，单从快这一个字就不言而喻，或许它在个别城市的个别站点的个别有人问题，但是从整体数据上真是无可挑剔。生活类、电子类和家电类几乎都会首选京东。


    为他人着想，考虑，助人才能自助，自助者天助。中关村那段经历，坚持正品低价，当时看来所有人都会觉得刘强东是傻子，可结果人家赢了。正品是对作者版权的尊重，低价是对客户的着想。宁可自己吃亏，也不让别人吃亏。这是多少宝贵的品质，这是这个年代稀缺的品质！需要创业者反思，学习并真正践行！由此引出另一个话题，就是长线思维。从这个案例看，长线思维不是想出来的。看一个人能否具备长线思维，取决于他身上的品质。这种品质是生活带给他的。你很难想象一个没吃过苦，没经历过风浪的富二代会有这样的行为。你也不会奢望一个穷人家的孩子放弃短期利益而不为所动。做事先做人，这是绝对的真理！


    今日得到：1.企业的品牌永远最最重要。品质和信誉一样，相比于淘宝天猫的鱼龙混杂，京东自营的“正品”观念早已深入人心。2.创始人的格局与企业的命脉和规模息息相关。从坚持正品到力排众议全面转线上，再到顶住压力自建物流。事后看来，刘强东的每一步都正确无比，可又有多少人在当时可以理解和领会？又翻看了下吴军老师昨日的专栏文章，在介绍Google的发展历程时他写道：“如果不了解佩奇和布林的雄心和胸怀，就不可能懂得Google为什么能成功。我常常想，凡做大事的人，必须有做大事的气度和胸怀。佩奇和布林就是这样气度恢弘的人。”现在看来，人以群分，大抵如此。


    坚持正品是商业道德基本准则，坚持低价是在代理商众多假货伪品大行其道的商业生态环境下的生存之道，坚持好的服务是更好地体现核心竞争力的杀手锏。三条宗旨都坚持，是一个高学历企业家与一般短视的小企业主的重要区别。爱国者冯军刚开始也被大家称为“冯五元”，坚持正品，而且只挣五块钱。


