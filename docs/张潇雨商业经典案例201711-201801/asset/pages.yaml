  md: '# 阿里丨欺诈事件与卫哲的离开


    阿里丨欺诈事件与卫哲的离...


    两周十篇文章过去，我相信大家对阿里的认识应该多了一些。不过我之前也反复说，即使用两周篇幅解读，对阿里这样一家如此庞大的公司也一定是挂一漏万的。希望我们的专栏能给你带来很多启发，这就足够了。


    这最后一篇文章，我们就来重新回顾一下阿里巴巴历史上一个著名的事件，B2B欺诈问题；以及一个早已经不在阿里任职，但对阿里这家公司仍然是标志性的一个人物，卫哲。这段历史也是阿里无数精彩历史里我印象非常深的一个，希望你在读完之后，能更进一步理解这家公司，以及它一直以来能走到今天，经历了多少风风雨雨。


    # | 诚信危机


    2011年1月的一天，马云偶然上网收了一下邮件——阿里的员工都知道马云没有异常收邮件的习惯，但就在这次，马云看见一封邮件感觉有些蹊跷。


    那会儿正好是春节假前，几个阿里老同事在邮件里讨论去吃点什么。创业元老之一蒋芳在邮件里随口说了句：“他妈的，我还在看一个案子，可能个别员工涉及到欺诈问题。”


    马云说他当时很好奇：什么案子会让一个女子说“他妈的”？


    于是马云就找到了蒋芳，和她聊了聊，聊完就觉得有些问题。于是，他马上找卫哲问话——当时卫哲是阿里巴巴B2B业务的CEO，一个名副其实的上市公司CEO。


    这里可以简单介绍一下所谓的欺诈是怎么回事。简单说，阿里的当时的B2B业务为了冲业绩，很多销售人员允许骗子商家在上面打广告，来吸引客户。甚至还有一些销售人员主动帮助虚假企业和骗子企业绕过平台的认证，来迅速上线。


    实际上，卫哲和他的团队很早就知道阿里B2B平台上的商家欺诈问题，也一直试图处理和防范，而且取得了一些成效。不过显然力度还不够。而且，当时卫哲并不清楚阿里巴巴员工跟作弊商家的关联度有多高，据说当马云问他的时候，他的惊讶程度也不亚于马云。


    当天晚上，几个关键人物就被马云从外地叫回杭州开会。一聊，马云觉得这件事搞大了。会上决定，立即成立一个小组来调查。最后的调查结果是，在这次欺诈事件里，阿里内部有超过100人牵涉其中，近2300家作弊商家混入了平台。


    用马云的话说，这次事件碰上了阿里巴巴的高压线。


    当时马云的原话是：“这个一亮，谁都跑不掉的。当我发现公司内部的员工，对诚信问题的看法居然是可以睁一只眼闭一只眼的时候，那就是大问题。假如B2B一万三千名员工中出现几个、十几个人有诚信问题，还正常，但涉及到将近100个销售人员，这就是系统问题。”然后他又重重补了一句，“这是管理层的问题！”


    于是离春节还有三天的时候，马云匆匆离开杭州。这对于他来说算是反常。因为这么多年马云没有在年三十前提前离开公司，基本都会去看看员工，有时还跟他们一起吃年夜饭。这次，马云说，“要走很多路，想一些问题”。


    # | 卫哲的传奇经历


    在加入阿里之前，卫哲就是个传奇人物。


    1992年卫哲在上海外国语大学读书，因为看了一部电影《华尔街》，对投资银行产生了很大的兴趣。当时中国还没有投行，沪深股市成立还不到两年。卫哲因为一次翻译任务，争取到了去万国证券实习的机会，结果当时万国证券的创始人管金生有点名要见见他。这一见，卫哲成了管金生的秘书。


    管金生对于下属非常严厉，一般的秘书连一年都做不到。结果卫哲不仅干满了一年，还干成了副总经理。他的秘诀很简单，就是把小事当大事干，不放过任何细节。


    比如，一开始卫哲只是负责翻译、剪报。结果这么小的事情他也千出了名堂——他会暗中观察哪一类是老板看过的，然后重点剪裁。到后来，管金生不看他的剪报就不下饭。


    还有比如打印资料，也是简单得不能再简单了，但卫哲也把它做到了极致。他会根据领导的习惯和偏好来调整字体和大小，让对方看着舒服。他还按照自己理解的重要性对资料进行排序，而不是像一般秘书那样直接堆在一起。


    时间一长，管金生对卫哲刮目相看，索性让他替自己写报告和演讲稿。


    卫哲一开始写不好，经常被要求返工，但他一遍一遍修改，最终获得了认可。于是，卫哲很快就被提拔为资产管理总部副总经理，成为当时国内证券界最年轻的副总。那一年他24岁，简直是志得意满。


    然而世事真的无常，就在卫哲事业蒸蒸日上的时候，1995年2月震惊业界的327国债事件爆发，管金生豪赌做空失败，进了监狱，公司也濒临破产。


    老板被抓后，卫哲白天被人追债，晚上找别人讨债，几天几夜都睡不着觉。最后，他得出了一教训：无论干什么事都不能赌而走险，一定要学会财务管理。


    于是，卫哲决定跳槽来到全世界最好的四大会计师事务所之一，普华永道。


    卫哲来的时候普华的人很犯难，因为给他个高职位吧，他对财务还不算太懂；但给他个低职位吧，人家毕竟曾经是副总，一度管着二三十人，还有秘书和司机。


    结果卫哲自己上来说提出：“给我一个尽量低的职位，就当财务顾问吧。”


    于是是一夜之间卫哲从副总变成了“小兵”。不过他说自己还占了便宜，不但能“免费上MBA”，而且还是带薪的，“有30个老师可以教我”。


    结果后来在普华，卫哲一年内破格晋升两次，很快就变成了经理，后来还获得了去英国工作的机会。最终卫哲越做越勇，很快当上收购兼并部的高级经理，还成为了普华永道史上最年轻的合伙人之一。这一年他29岁。


    做到这个程度，卫哲又不满足了。他发现自己虽然对财务懂了，但对执行关注不够，同时也缺乏一些管理大团队的经验。


    于是他毅然离开普华，加盟了做建材零售的百安居。他从自己最擅长的财务经理干起，然后每一年都向老板提出“多给我点任务”，结果最后，整个百安居有12个部门，卫哲一人就分管了9个。


    于是当CEO职位出现空缺时，公司上下除了卫哲，实在找不到更好的<|message|>


    2002年，32岁的卫哲出任百安居中国区总裁，成为公司的灵魂人物。从1999年到2002年，百安居三年只开了5家店，卫哲上任后，短短四年开了46家，员工也从几百人增加到13000人。并且通过并购主要对手欧倍德在中国
    yap


    # | 卫哲入伙阿里


    2001年，哈佛大学组织了一场中国企业家演讲活动，卫哲在这...第一次见到了马云。当时阿里才成立两年，但是马云已经宣布：要把阿里做成全球最大的贸易网站。结果很巧，在返程航班上，两人坐到了一起。一交谈发现对方都是金庸迷，还喜欢下围棋。结果他们感情迅速升温。


    而此后几年，马云一直想要拉卫哲入伙。他知道这种既有国际视野，又懂中国国情的人才实在是太难得了。


    卫哲一开始对阿里并不感兴趣，结果马云就不断开展攻势。


    马云：“你的生意扩大一倍需要投入多少？花多长时间？雇用多少人？”


    卫哲：“4000万美元，1万名员工，用时三年。”


    马云：“我只要五台服务器，不需要增添人手，三个月就搞定。”'
