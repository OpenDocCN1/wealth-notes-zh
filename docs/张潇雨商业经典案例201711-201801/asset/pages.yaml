  md: '# 腾讯 | 马化腾的产品观（下）


    上期专栏里我们讲了马化腾认为产品经理常犯的七个错误里面的前三个。接下来讲剩下的四个。


    # 错误四：对产品的核心能力关注不够


    任何产品都有核心功能，宗旨就是能帮助到用户，解决用户某一方面的需求，比如节约时间、解决问题、提升效率等等。


    但是很多产品经理对核心能力的关注不够，也不是说完全没有关注，而是没有关注到位。


    核心能力不仅仅是功能，也包括性能。


    对于技术出身的产品经理，特别是做后台出来的，如果自己有能力、有信心做到对核心能力的关注，肯定会渴望将速度、后台做到极限。但是问题往往是产品做不好。


    比如我们做网页速度优化，优化之后速度提高很多。真不知道之前都做什么去了，让用户忍受了这么久，既浪费时间又浪费我们的资源。如果不抓，就没人理，很说不过去。所以我们要在性能方面放入更多精力。


    谈到核心的能力，首先就要有技术突破点。比如做QQ影音，我们不能做人家有，我也有的东西，否则总是排在第二、第三。虽然也有机会，但缺乏第一次出来时的惊喜，会失去用户的认同感。这时候，你第一要关注的就是产品的硬指标。在设计和开发的时候就要考虑到，外界会将其与竞争对手做比较，如播放能力、占用的内存等等。


    而且核心能力要做到极致。要多想如何通过技术实现差异化，让人家做不到，或通过一年半载才能够追上。


    QQ影音当时在硬指标上其实也有很多选择，比如网络播放、交流、分享，有很多思路，但最后都砍掉了，我们就是要做播放器，因为这是用户需求。只有硬指标满足了，用户说，我这个破机器，只有QQ影音能放，就这一句话：口碑就出来了，用户知道你的东西行。


    很多用户评论QQ时说用QQ唯一的理由是传文件快，有群。那这就是我们的优势，我们要将这样的优势发挥到极致。比如离线传文件，以邮件方式体现就是一个中转站，即使是超大的文件也不困难，关键是要去做。虽然真正使用的用户并不一定多，但用户会说，我要传大文件，找了半天找不到可以传的地方，万般无奈之下用了QQ邮箱，居然行了，于是我们的口碑就来了。


    # 错误五：把添加当成提高


    做交互设计的时候要求我们细致，视觉简洁清晰。产品经理要想象自己是个挑剔的用户，想象自己是个笨用户，复杂的看不懂。


    产品人员的精力有限，交互内容很多，所以要抓最常见的一块。流量、用量最大的地方都要考虑，规范化要让用户使用得舒服，要在感觉、触觉上都有琢磨，有困惑要想到去改善。如鼠标少移动、可快速点到等等。


    拿QQ邮箱举例，邮箱的一个按钮“返回”放在什么位置，放右边还是左边，大家都会多琢磨，并上线尝试。


    再比如输入邮箱密码出错，输入框内的内容选择上，不用用户清除错误的密码就可以直接重新输。


    还有对同一个用户发信，在此用户有多个邮箱的情况下会默认选最近用的一张账号。


    这些需求都很小，但你想清楚，用户就会说好，虽然用户未必说得出好在哪个。这些都是对用户体验的优化。


    产品的*>使用要符合用户的习惯，如写邮件的时候拷贝东西，更多人习惯用键盘来操作，虽然有些技术难度，但也可以解决，要考虑用户对鼠标反馈的灵敏性，便捷性。


    在设计上应该坚持几点：


    +   第一，不强迫用户，不为1%的需求强扰99%的用户；

    第二，操作便利。如QQ音乐的快捷播放，从圆形到方形，最后因为影响性能而放弃；

    第三，淡淡的美术，点到即止。在UI界面上不用太重也能做得很好，图案和简洁并不一定是矛盾的；

    第四，重点要突出，不能刻意地迎合低龄化。


    # 问题六：认为内部竞争是浪费资源


    在产品研发过程中，我也会有一个困惑：自己做的这个产品万一失败了怎么办？


    我的经验是，在面对创新的问题上，要允许适当的浪费。


    怎么理解？就是在资源许可的前提下，即使有一两个团队同时研发一款产品也是可以接受的，只要你认为这个项目是你在战略上必须做的。


    比如说微信，当时新浪微博起来之后，开始从社交媒体转向社交网络。那时候我们听说，谁谁学校里有一个微博做班级之间的通信，这对我们是很大的危机。它开始往往撤网，第一反应就是我们也要做微博。

    但这很难，同样的产品是没有办法去战胜对手的，你只有找到一个完全不一样的产品才能解决这个问题。微信就这样诞生了，它是纯手机的移动通信。当时QQ的包袱很重，要解决PC的问题，也要解决手机终端的问题，内部几个团队都在开发，谁最先解决问题就胜出。


    那时候在腾讯内部，先后有三个团队都在同时研发基于手机的通讯软件，每个团队的设计理念和实现方式都不一样。原来集集团有几个不同的平台在做移动端产品，有QQ，还有我们的无线部门，当时是分开的。另外一个就是我们QQ邮箱的团队。


    我们很早接触手机邮件，用黑莓手机，最初只给高管配。后来我们想，能不能在QQ邮箱开发一个软件，让每个员工都能很方便地使用手机邮件。于是就 accordingly
    小分队研发手机邮箱。幸好有这个布局，最后微信出来了，就是这个团队做的，最先把手机端的邮件客户端改成微信。最后用户都很难喜欢。


    为什么自己打自己？因为往往自己打自己，才会更努力，才会让公司不失去一些大的战略机会。如果你不做，竞争对手或者业界总会有人做出。

    你能说这是资源的浪费吗？我认为不是，没有竞争就意味着创新的死亡。即使最后有的团队在竞争中失败，但它依然是激发成功者灵感的源泉，可以把它理解为“内部试错”。并非所有的系统冗余都是浪费，不尝试失败就没有成功，不创造各种可能性就难以获得现实性。


    # 错误七：把产品发布当成成功


    我经常会看到这样几种现象：有些人一上来就把噱头做得很大，恨不得面面俱到地布局好；有些人习惯于追求完美，总要把产品反复打磨到自认为尽善尽美才推出；有些人心里面很清楚创新的重要性，但又担心失败，或者造成资源的浪费。


    这些做法在实践中经常没有太好的结果，因为市场从来不是一个耐心的等待者。


    在市场竞争中，一个好的产品往往是从不完美开始的。同时，千万不要以为，先进入市场就可以高枕无忧了。我相信，在互联网时代，谁也不能偷懒5秒钟。你的对手会很快赶上来，很快追上来。他们甚至会比你做得更好，你的安全边界随时有可能被他们突破。


    我的建议是“小步快跑，快速迭代”。也许每一次产品的更新都不是完美的，但是如果坚持每天发现、修正一两个小问题，不到一年基本就把产品打磨出来了，自己也就很有产品感觉了。


    所以，首先就是要为了实现单点突破允许不完美，但要快速向完美逼近。


    快速迭代产品的关键是主动变化，互联网生态瞬息万变，适常情况下会认为应变能力非常重要，但是实际上主动变化能更重要。管理者、产品技术人员而不仅仅是市场人员，如果能更早地预见问题、主动变化，就不会在危机出现时被动应对。'
