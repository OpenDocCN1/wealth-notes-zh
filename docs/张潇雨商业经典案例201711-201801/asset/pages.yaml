  md: '最后的结尾，让我想起了巴菲特说的一段话：最后任何公司都会交到一个蠢货手里。


    所谓成也萧何败也萧何。新的公司，因消费者不断地喜新厌旧而上位，因资本贪婪而壮大；同时也因消费者的喜新厌旧而遗忘，因资本贪婪而死亡。所以很认同做企业其实就是在针尖上跳舞，永远无法停下来。如果想基业长青，必须学会归零。像人的基因一样，卸下曾经成功的包袱，重新获取学习成长的能力，方能生生不息。对于UA，过去因专业体育和智能穿戴而成功，如今业绩遭遇滑铁卢，个人认为，需要归零。重新面对消费者，什么才是他们真正需要的运动产品？而智能穿戴，个人认为是不变的方向，未来在大数据反哺之下，必然会有更大前景。不以一时论英雄，加油UA。


    # 小败局 | “跨越鸿沟”理论


    老师好！为什么被称为“鸿沟”？就因为很多企业往往都没有或者很难跨过这道沟，一旦跨不过去，可能就是终点站。“小败局”这个跨年系列课，让人有种“过去怎么看，未来怎么办？”的启示意义。谈谈收获最大的三点：第一，超级用户思维。找到细分领域切入、精准定位核心用户群、提供有价值的优质解决方案，这是创业者在制定战略规划时的三个重点。围绕自己的超级用户，放弃简单的流量思维，可能是未来商业的发展方向。第二，善于处理与资本的关系。周航、吴长江以及UA，成败都有资本的力量发挥了重要作用，这让我想起“蔡崇信不是找来的，是上天送来的”这句感慨。第三，谨慎多元化。莫说小企业，即使是大企业在制定多元化经营战略的时候都应该十分审慎。我以为“飞轮效应”是中标杆，围绕核心业务，整合生态链上各个环节的资源，提升价值和竞争力的多元化才是正途。


    1.人无远虑、必有近忧。商场没有永远的赢家，越是处于上升期和鼎盛期越要考虑后续发展。特别是对手是谁、越来越有点儿像玄学，“死都不知道怎么死”常态化了。2.不忘初心、知足常乐。日本有很多百年老店，说工匠精神也好，说传统保守也好，它们用活下来的方式成为了赢家。具体到一家企业，不是必须越做越大的，小而美始终都是一种选择。3.尽人事、听天命。虽然从小一直受唯物主义观教育，但有时也谈运气、天命。勤奋、能力、洞见可能支持企业从0走到95，但总有5分是交给运气和天命的。


    延伸：1.每个人他都是立体多维度的，在某领域他可能是一个创新者、早期接受者，而在某些领域他也可能是一个落后者。这取决于他的底层思维和情感倾向：愿意将资源配置到什么地方。我们公司中，知道质量管理的，喜欢用ISO，到处标准化；知道ERP的，凡事流程分析，到处信息化；知道量化管理的，凡事就统计分析，到处数据化……2.历史上的帝王事就是如何跨越“建业”和“守业”之间的鸿沟。例如刘备、关羽、张飞是创新者，他们用自己的“技术”和强烈的价值观看解决问题，诸葛亮属于早期接受者，以“商业导向”规划布局，他们四人加起来就是“传道者”，来了个联吴抗曹，三分天下的“隆中对”战略部署。接着后续跟进的黄忠、赵子龙等等可归为早期大众，不是忠于价值观看，而是认可意见领袖；直到刘备三分天下有其一，逐渐跟进了晚期大众和落后者。


    一家企业，一个产品成功的因素会有很多，时代的因素（网飞），创始人独特的哲学思维（王兴），一个优秀的人才（LV，古奇），甚至是不断迭代不断改进的“烂想法”（Airbnb）等等。一家企业，一个产品失败的因素也很多，创始人对行业的理解不够透彻（易到），盲目扩张和没有正确的发展战略（太子奶，盛大），没有建立好的合伙人分配制度（雷士照明），产品定位不明确和没有多元化发展思维（GoPro，UA）等等。商业世界是一个极其复杂的混沌的系统。这就回到我们专栏刚开始就提到的归因谬误，任何简单和过度归因都不足以解释一家公司成功或者失败的关键。我们只有不断重复观察，利用动态的视角在混沌的系统中寻找秩序和自我观照。而只有这个过程，才是我们商业世界里前行的道路。'
