    # 腾讯 | QQ的诞生


    QQ给我的最大感受就是内容太多太杂，貌似要建立一个什么都有的社区，比如读书、社交、娱乐，但是很多时候我都不知道从何选择，而且内容质量不是很好，不适合所有人的。市场细分没有，这和它大平台的定位可能有关。只能说腾讯去摘到了低垂的果实，而现在要做类似设计应用，只能从更垂直更有主题的领域开始了。


    [1] QQ最初满足的就是人们的各类需求，记得一开始版本迭代的时候，不管你这个功能是否需要，只要有一定的客户群提出来了，QQ总会尽可能地满足，进而导致QQ的界面一度经常变化，里面的菜单层层叠加。也许正是因为中国用户多，需求不同的特点，这种快速迭代很大程度上满足了用户的即时需求，进而获得成功。[2]
    而微信则迥然不同，似乎就是因为用户数量级变大，它似乎更关注提供哪些功能，能够让更多的人收益，能够尽可能地减少对用户的打扰。所以微信功能的迭代升级，似乎总是落后的。单纯从功能层面来分析，QQ的功能已经完全可以替代微信，甚至更强。但从简洁性来说，微信似乎更被大家认为是一个准办公用的沟通工具，似乎使用微信就默认带入了一个相对正式的工作场景。而工作场景中，往往并不需要五颜六色的变化以及纷繁复杂的功能，所以微信始终保持着这样一种风格。


