  md: '# 复习 | 皮克斯的创意秘诀


    张潇雨


    无论是票房还是质量，皮克斯的动画电影都是业界的标杆。就在上周，皮克斯新出品的《寻梦环游记》又登顶了票房的周冠军。为什么皮克斯总能做出富有创意的动画电影？它是如何激发并保持长久的创新活力的？今天，带你复习一下皮克斯的创意秘诀。


    # —— 皮克斯创意清单 ——


    +   1. 动画电影最大的特点是不确定性太大。一部原创动画要花费四五年的时间、上百人的精力以及巨大的资金投入，而且期间一直花钱，在上映前没有任何收入。然而，它更大的不确定性还在于：最终能不能成功谁也说不好，很大程度上只能看运气。\n2.
    面对巨大的不确定性，皮克斯的秘诀是四個字：资产配置——每开发一部原创，就开发两部续集。这样既可以降低成本，又能保证票房，一举两得。我们看到的《玩具总动员》系列、《海底总动员》系列，都是这么诞生的。\n3.
    什么是好的创意？最成功的创意是在原有的成功想法基础上，再往前突破一步，就一步，不太守旧，也不能太先锋。比如，好莱坞电影的惯常套路是一个人在冒险中成长的故事，但你在皮克斯的动画里总能找到不同：《美食总动员》，一个厨房里发生的事情，焦周居然是一只老鼠；《机器人总动员》，开篇40分钟没有一句台词；《头脑特工队》，可能是主流动画长片里唯一一部没有反派的电影。\n4.
    好的创意要通过碰撞才能产生。乔布斯非常坚信这一点，所以他在设计皮克斯办公楼的时候，把本来是四栋楼的设计改成了一栋大楼，而且只有两层，就为了让大家多碰面。甚至为了让大家多走动，乔布斯在一层只安排了两个洗手间，后来在员工的强烈呼吁下才增加了一些。\n5.
    在皮克斯看来，好创意并不是“天生”的，而是一步步迭代出来的。皮克斯内部管电影的初样叫“很丑的婴儿”（ugly baby），因为刚出生的婴儿跟新的创意一样，一开始都很丑，但通过培养可以有非常大的变化。比如我们熟悉的《怪物公司》，主角之一是个7岁小女孩，但一开始剧本的主角是个30岁的男会计；还有《飞屋环游记》，一开始的设计是两个兄弟争yski的故事，最后变成了一个小胖子加老爷爷的历险记。\n6.
    如何保证创意往正确的方向迭代？皮克斯的方式是“智囊团”。每部电影进行到一定阶段，皮克斯的核心员工组成的委员会就会聚在一起，边看样片边给导演提意见。这个机制的核心是“真诚+坦诚”，让所有人畅所欲言。\n7.
    “对事不对人”对创意的诞生来说非常重要。创意型人才在沟通上最容易犯的错误，就是把创意和作品当成自己的化身，对批评意见的反应很激烈。但事实上，任何好的创意都是需要反复修改，甚至推翻重来的，所以无论是提意见的人还是接受意见的人，都要永远想着对事是对事不对人。\n8.
    给创意型人才提意见，最好不要做“简单的批评”，而是做“有建设性的批评”，措辞上稍微变化一下就会非常不一样。比如：说“这场戏我觉得拍得比较一般”，就不如说“这么重要的一场戏，我觉得应该有一两句台词一下就能被观众记住。但现在看来还没有。”\n9.
    皮克斯在激发创意的控制上已经到了非常细致的程度。比如他们发现，“长桌子+座位牌”会让坐中间的人的意见显得更重要，旁边的你显得不重要，而不分主次的方桌更适合自由沟通，所以取消了所有长桌和座位牌。\n10.
    想让电影打动人，光有创意是不够的，还要和真实生活结合起来。皮克斯在电影筹备阶段都会做“考察旅行”，比如《美食总动员》，主角是一只有大厨梦想的老鼠，皮克斯就会去法国的米其林星级餐厅吃饭、参观、和主厨交流，甚至去下水道体验老鼠的生活环境，让电影的细节更真实。


    # —— 一张图看懂皮克斯 ——


    # 皮克斯的创意秘诀


    皮克斯的创意启示：好创意并不是有天马行空、无法复制才能产生，通过管理和机制也可以做成。


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_82_0.png)


    一句話秘诀：先打造一个鼓励创意和创新的企业文化，然后在日常的大大小小事情践行这种文化。'
