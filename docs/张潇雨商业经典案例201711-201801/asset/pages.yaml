  md: '# YC | 关于如何融资的六大要点（下）


    昨天我们提到了关于创业公司早期融资的一个重要原则，那就是尽快拿到第一个投资意向书。因为一旦你有了第一个offer，你就掌握了融资的主动权。


    围绕着这个原则，我们在后面又展开了两个要点：首先，白纸黑字的投资协议才算数，其他都是没意义的；然后，要创造一个投资机构集中的竞争环境。在理解了这几个要点之后，我们就来讲一讲下面的几个要点。


    # | 别太在意估值


    我们还可以从“尽快拿到第一个offer”延伸，比如：创业早期别太在意估值，拿到钱最重要。


    我认识的投资人常常和我说，他们经常看到的一个现象就是，创始人早为了这一点估值非常纠结，最终耽误了融资，或者最后找的是并不太好的投资人。


    实际上早期融资真的没有太必要纠结估值，因为一方面，早期的時候不管是公司业务数据还是财务指标都非常不成熟，大家的谈判基本上是围绕着公司一阶段和团队，价格都差不多，不会相差太大。


    另一方面，我常给人举这么一个例子：假设你没拿到这笔钱，公司没坚持下去，和你拿到了这笔钱，本来要占40%的股份，结果上市时只占了35%，这两种情况相比，肯定是没拿到钱对你的生活影响更大。


    所以还是那句话，尽快拿到钱才是最重要的，尤其是在资本市场变化非常快速的情况下。


    甚至，保罗·格拉姆还在这个说法上面又往前推进了一步。他说，最好先拿给估值最高的那家投资机构的钱。这里面有两个重要原因：


    第一，最好的投资人对你选择他们是很有信心的，而且也知道自己对创业者的价值很大，值得这个钱，所以他们反而不会乱报价格；


    第二，更重要的是，更多的资本就意味着更多的期待。比如这一轮融资你可以以300万美元占15%，也就是2000万美元的投后估值来融资。但是这时候突然有人说，我给你500万美元吧，就占据12.5%，这样算下来就是4000万美元的投后估值。实际上，你的公司在此刻业务是没有任何变化的，只是因為投资人哄抬物价，就把价格抬上去了。


    这意味着什么呢？这意味着，在下一轮融资的时候你把自己架在了一个很高的位置上，如果你这轮估值是2000万，那么下一轮你可以以4000万、3000万，甚至2500万的价格去融资，公司的空间比较大；但是如果你这轮就给自己架到了4000万的水准，那么接下来的一年多你就要把公司做到6000万甚至8000万的水准了，你可以想想这里面的压力有多大？万一再赶上资本寒冬，融资变难，很可能你之前的高估值就变成了一种巨大的枷锁。


    最终我们说的其实都是一个道理：创业本来就很难，也是一个非常长线的事情，所以能把事情做成最重要，大事不拘小节。


    这就是我们关于融资的第四个要点：早期融资的时候别太在意估值，甚至不要接受过高的出价。


    当然，责任也不总是创业者的。


    实际上保罗·格拉姆写过文章建议说，对那种“估值敏感型”的投资人要非常当心。这种人经常会占用你很多时间和和你压低价格，或者纠结一些细小的条款——注意，我们并不是说这种人完全不可取，实际上有一些爱压价的投资人的水平也是非常高的。但是你可以优化你的流程，比如在融资的中后期再见他们，理想的情况是，那时候你已经有一些offer了，然后你就可以说：“这个价格是大家基本公认的价格了，你可以接受也可以放弃。”这样就会省下很多时间。否则的话如果你一上来就找到这种人，万一他报了一个非常低的价格，后面的投资人也是会受这个价格影响的。


    # | 进入“融资模式”


    第五个要点：要不就在“融资模式”里，要不干脆就不要想。


    很多创业者在经历过融资之后都会发现，融资这件事其实是非常消耗心力的，一旦公司进入融资状态了，很多其他事情就顾不上了。比如产品、业务、招聘等等都是，尤其是在早期人手不足的情况下。


    而且，创业公司早期的增长主要是靠创始人带动，一旦你的心思跑到了别的地方，公司的增长就会出问题。而公司增长出了问题，投资人也会更加犹豫要不要投资你。最终这就变成了一个死亡循环。


    所以，当开始融资的时候，就让整个公司进入融资模式，比如：准备好融资需要的各种材料、把该记下来的数字记得烂熟于心、安排投资机构在一个比较集中的时间段统一见面——当然这也是我们之前讲过的“创造一种竞争环境”，甚至你还可以安排两个人专门处理融资的事情。


    关于融资，保罗·格拉姆的话非常经典，他说：融资的最重要目的不是证明你的公司有多好多值钱，而是赶紧结束这个过程，把钱拿到，然后回去干活。所以，最忌讳的就是，没事就有投资人找你聊聊，劝你融资，于是你就去了。实际上很多时候这只是他们做市场调研的一种方法而已。


    当然，有一些投资人好朋友还是非常必要的，你们可以互通有无，相互给对方一些意见。但是不要受别人诱导，不明不白地就开始融资，那个时候很可能你只接触了这么一家机构，没法营造一种竞争环境。


    所以，一旦决定要融资，就开足马力进入融资模式，否则的话就踏实做事。这就是我们的第五个要点。


    # | 做人留一线，日后好相见


    第六个要点就是：做人留一线，日后好相见。


    当然这是一个有点不正规的说法，不过话糙理不糙，其实道理就是：咋怕你按照我们的方法，拿到了很好的投资意向书，收到了好几家的<|start|>>offer，掌握了主动权，也不要做得太笨太过分。


    比如轮番要求给offer的人提价，提到自己满意为止；或者拒绝投资人的时候非常傲慢无礼。因为，创业圈太小了，你是怎样一个人、怎样一家公司，很快大家都会知道，而且创业这件事本来就起起伏伏，今天得意的你可能明天就需要别人的帮助，所以对大家友善和礼貌一些，大家都会念你的好。


    甚至，当别人拒绝你的时候也不用恼羞成怒，好的投资人不会纠结于第一印象的一...如果你是投资人，一开始没投到Facebook，到了第三轮的时候Facebook又找到你，你难道会拒绝吗？其实投资人也是人，都会犯错误，而且好的投资人是非常愿意改正自己的错误的，而且他们花了那么多时间研究你，很可能对你有很大的帮助。


    所以，不但要礼貌对待拒绝过你的人，甚至可以把这当成一段新关系的开始。


    到这里，我们关于融资的六大要点都讲完了。就像我们一开始所说，我们关注的更多的是“原则”和“道”层面的事情，“术”方面的很多东西，大家可以去找更多的资料学习。


    随便举个例子，每次在和投资人开完会的时候，一定记得询问他们接下来的流程是什么。比如还要不要加什么资料？程序上还要不要见其他合伙人？大概什么时候能约到？这些细节都会在你融资的时候帮到你。


    当然，这对于找工作以及很多事情都是一样的。最后，还是用我尊敬的保罗·格拉姆的一句话结束这两期专栏吧。他说：


    > “讲了这么一大堆道理，其实融资的最佳方式是什么呢？是把你的业务做得足够好，让别人根本无法拒绝投资你。”


    # 张潇雨


    这两天讲了关于如何融资的六大要点，你最大的收获是什么呢？欢迎写在留言区和大家分享，我们明天再见。'
