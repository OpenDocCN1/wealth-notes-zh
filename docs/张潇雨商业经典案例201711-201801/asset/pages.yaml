  md: '# YC | 如何看懂投资意向书（上）


    你可能已经发现了，我们这两周好几篇文章都是当成“工具书”来写的，本质上我是希望大家以后真的能用得着的时候——不管你是想自己创业，还是想加入一家创业公司，还是帮朋友出谋划策，都能想起我们这个系列的专栏文章，打开看一看。


    当然，关于创业的话题有很大很多，未来有机会，甚至我们专栏第二季的时候也可以再展开。


    今天我们就顺着融资这件事情，再给大家提供一个非常干货的材料，实际上是两份文件：YC投资旗下公司使用的投资意向书模板，以及 徐小平老师的真格基金投资公司使用的投资意向书模板（文件在文章最后），一份中文一份英文，这也是中国和美国最好的两个天使基金使用的投资文件，相信未来有一天你可能就会用到。


    另外，把这两份文件贴出来还有一个重要的原因，不管是YC还是真格，它们都是对初创企业和普通创业者非常友好的投资机构。


    实际上，YC的旧主席，大家很熟悉的保罗·格拉姆，和新主席，年轻有为的萨姆·奥特曼（Sam Altman）都反复强调过，YC成功的最重要原因就是对创始人非常友好，体现在投资文件里就是，它们确实没有很多对创业者限制很大或者防范很严的条款；同样，真格基金在2015年就发布了所谓的“一纸纸投资意向书”，同样也是拿掉了很多业界惯常的限制创业者的条款。


    所以，这两份文件放在这里，你就可以对业界最友好的投资意向书是什么样，有了最真实的概念了。


    当然，虽然这两份文件本身就非常有价值，但我还是要花点时间给你讲解一下里面的具体知识和条款，也正好普及一些关于投资协议的概念和知识。相信这两篇专栏之后，你应该对创业公司的早期融资概念又有更深的理解了。


    # | 投资后估值Vs.投资前估值


    首先这两份文件的开头都是一些基本信息，比如双方机构的名称、投资的金额、所占股权比例、估值是多少等等。这些都是非常标准的信息。不过里面有个基本概念可以简单说一下。


    真格的文件在提到估值的时候用了一个词叫做“投资后估值”，而对应的YC的文件里有个词是“pre-money”，翻译过来就是“投资前估值”。这里面“前和后”的概念是这样的：假设有个投资人看好你的公司，想要投资，说一我投资你200万人民币占你20%股份吧，这时候他给你的投资后估值（post-money）是200/20%，也就是1000万，投资前估值就是1000-200=800万。换个角度理解就是，投资人在评估你现在这家企业的同时，觉得它值800万，然后他决定投资你200万，那么你的企业在收到这200万的一瞬间，其实就值1000万了——因为你的账上多了200万现金。


    所以，当你和投资人谈估值的时候，一定f要分清是投资前估值还是投资后估值，很多时候它之间差距还是不小的。


    # | 期权池


    除了“投前投后”，还有一个隐含的条款会影响融资的价格，就是所谓的期权池。


    因为在你成立一家公司的时候，很可能人f员还不齐备，未来还很需要很多关键的人物甚至合伙人级别的人加入公司，所以投资人一般都会要求你预留出的一部分股份作为期权池。未来有比较重要的人加入的时候就可以从这个池子里拿出一部分给他们，当然也可以发放给员工。这是业界非常标准的做法。


    所以你可以看到在真格的文件里，“投资后估值”那一栏后面有一个括号，就是说你要留下15%的期权池给大家未来可能加入的员工。


    当然，这15%的数字有两个特性：第一，没人要求你一定要发干净所有15%的股份，理论上在你发出之前，这些股份都是创业者自己的；第二，这个期权池也会在后续公司的发展中不断动态变化。


    本质上，这个数字是保护投资者利益的。我们还可以举用刚才的例子：假设一个投资人用200万占了你20%的股份，你的企业在投资后估值是1000万。那么这个时候你自己股份是多少呢？如果没有这个期权池，你的股份显然就是80%，但有这个期权池你的股份就是80-15=65%了。如果没有这个期权池，未来有人加入，你需要给他比如5%股份的时候，这5%就要你和投资人一起出，而如果有期权池的话，就从这里面拿就行了。所以这也是投资人明确自己利益的一个条款。


    真格的这个做法非常标准。而比较恐怖的是，YC连这个条款都不要了，他们甘心在新加入的时候，和创业者一起稀释股份。这种做法是非常少见的。


    # | 清算优先权


    说完了基本信息里面的知识点，我们接下来讲一个非常重头的概念，YC的文件里第一个写的就是这个条款，真格的文件里当然也有。这个概念叫做“清算优先权”，英文是 liquidation
    preference。这是投资意向书里面非常重要的一个条款。


    实际上，所谓的清算优先权，说得简单一点，就是一旦公司出现了一些情况，比如被收购、和其他公司合并、破产等等的时候，大家该以怎样的顺序和优先级分钱。这实际上也是在保护投资人的权益。


    比如我们可以举一个极端的例子：假设投资人给你的公司投资了1000万美元，占30%的股份。结果资金一到账，你就选择把公司彻底关了。如果没有清算优先权的话，而且恰好你的公司也没有什么其他值钱的资产了，那么投资人就只能从企业关门时候的价值一一也就是你刚拿到的1000万里面拿到30%，就是300万美元，你自己就凭空得到了700万美元，而投资人当初投的是1000万美元。这显然是非常不合理的。


    所以，一般在投资文件里，投资人都会设立一个至少一倍的清算优先权。一倍的清算优先权的意思就是说，投资人退出的时https://example.com候至少可以把自己之前投资的钱拿回来。


    当然这里可以补充一下，假设投资人给你累计投了3000万，但是清算的时候公司价值最后只有2000万，那么创业者当然也不用补上中间差的钱，而是所有投资人按照之前设定好的优先级分这2000万就行了。


    这也是对创业者的保护。


    所以你可以看f到，YC的投资文件上是有写到，清算的时候要拿回原始投资，也就是设立了一倍的清算优先权。


    不过这一点上，真格基金非常大方。它连这个一倍的清算权都不要了，条款写的是：一旦公司发生清算或者整体出售，全部可分配款项将基于优先股转换普通股后的比例分配给所有股东，包括自己。


    这里面有一个优先股和普通股的概念，我们不过多展开，可以简单理解成优先股比普通股有更多的权利，所以投资人在投资的时候使用的都是优先股的形式。这里其实是在说，一旦真格投资的公司清算，它们都不需要拿回原始的投资额，而是和所有其他股东一起按照比例分配就行了。YC的主席奥特曼也说过，他们投资文件里面的那个一倍的清算权在实际签署的时候也会经常去掉。


    而相反，很多其他投资机构不但会有清算优先权，还会设立1.5倍等这样的指标，也就是清算的时候要拿回当时投资的150%才可以。之前我说这两份投资文件是对创业者非常友好的投资文件。'
