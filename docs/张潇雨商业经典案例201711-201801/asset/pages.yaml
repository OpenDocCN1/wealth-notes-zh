  md: '# 王兴 | 竞争的终极境界——不争


    竞争永远不是目的，而真正的目的是自我成长，是纵情向前，是边界扩张——今天专程给你印象最深的话。无论是王兴还是佐斯，貌似有相同的一点，就是无论世界如何变化？我有万变不离其宗的核心！核心永远不动摇是关键。边界不断扩张，但是我在服务什么人？他们需要什么样的需求？竞争的目的不是为了打倒对方，而是不断让自己围绕核心确立目标，永远处在强大之中。足球队竞争和开车的例子比喻得很形象，同样印象深刻。感谢老师一周的解读，收获颇多！


    人是什么？就是不断地超越自己的过程，而不是一成不变的。人要有一个终极的目的。只要人在不断地超越下去，那么商业也必然自我更替下去。


    从王兴的战略思想可以看出，要把自己的理想变成现实，就要在创业路上越走越远且越走越好，重要的事情是做好自己。只有自己变强大后才能适应可能遇到的恶劣环境和不断变化的时代步伐；同时生态链很重要，把自身的核心业务做好后可以不断向外延伸，做好整个生态链的产业。就像阿里集团先把淘宝业务做稳，然后是支付宝、天猫、聚划算等等，以至于可以使企业有百年长青之基业。


    以前的我对于竞争有着消极避世的想法，在竞争上总是败下阵来。思考为什么一定要争个输赢，事情总是做不好，其他人总比我强。现在关于竞争的看法：专注于自己的成长跟收获，想要拥有一件事情就让自己配得上它，为此我们是需要付出成本的（可能是时间、金钱、提升品格、学习一项技能等等）。在这个追逐的过程中，我们早会发现生活的意义，而且完善自身的方式也是一种追求幸福的方法。有人喜欢安逸，有人喜欢追寻，可能没有结果，但是我能感受到生活在变得丰富。


    # 王兴 | 竞争之道——胜可知而不可为


    今天的课有两段话，我划了重点，一是：很多公司其实败就败在了不知道可以“不作为”，不知道事情可以不办。或者说，没有取胜的策略和把握的时候，不出战也是一种选择。二是结局的：绝大部分时候，我们只需要做好自己，再等待某个好时机的来临，生活就会发生很大的变化。只是在那之前，我们真的要有足够的耐心。这两段放在一起理解会更深刻些。根据第二段话，就知道第一段说的“不作为”，不是说真的什么都不做，而是说不管你的处境如何，不管什么时候，你都要去积累，去锻炼自己的身体、去练就一技之长、去学习、去形成自己的认知体系……做好这些充分的准备，然后开始一点点地释放自己的能量，让机会看到你，最后让机会遇中你。


    我又回想到了向内成长。其实反思我的生活，很多时候简单的道理也是共同的。比如我们不需要在意如何超越对手，只要我们自己在正确的道路上坚持前進不放弃，一段时间后就会发现原来身边的
    人都已经掉队了。今天讲到的《孙子兵法》也是不断完善自我，等待别人犯错。这让我想到了网球比赛，有一种计分叫“非受迫性失误”，也可以理解为保持自己不犯错等待对手犯错（等待对手送分给你）。吴军老师在提到如何战胜对手时也是上面的观点，可以看出大师们的观点、成功的经验及处世哲学往往都是齐聚一点的。


    商场竞争之道，可谓博大精深。这个专题分析了很多经典案例，究其根本，其实都是在谈竞争之道。就耐心这个品质而言，的确对成事事业以及为人处事都非常重 要。记得有句话：雄心的一半是耐心。我们也常听说：凡成大事者，需耐得住寂寞，经得起诱惑。我认为，无论东方哲学还是西方哲学，在求解人类终极问题时，都能在方法论的层面，借由提供不同的理论工具来实现“你中有我”“我中有你”。因此，商战中的各种制胜之道，应该也融汇了东西方哲学的思想精髓，从而使商业竞争超越了物的范畴，上升到艺术的境界。


    很多时候你之所以赢得胜利，不是你做了多少事，而是你的对手做错了很多事。在竞争中，如果做对了事就有利益，做错了事就有损失，战斗通常不是一局定胜负，而是长期胶着的状态。那么在这种情况下，最好的策略是先发展自己的实力，这样就不会被对手一招打死，只要不下赌桌，总有赢的机会。如果把这个思维用在投资当中，给我的教训是要不要<|start|>哈，要保证有足够的现金流。当然，最好的做法是努力提高自己的场外赚钱能力，因为源源不断的现金流代表了源源不断的筹码。在投资中，没有人能赚尽每一个波段，操作越频繁，错误就越多。但是“总想做点什么”是人的本能，这也是为什么说在投资中“不动”是最难的。觉察到自己的本能，和我们的本能做斗争，这是每一个想成为更好的人一生的修行之路。


    # 王兴 | 竞争之道——通盘无妙手


    作为一个球迷，希望能补充一些关于门将的信息。首先，当今足坛判断一个门将优劣的最重要指标就是“稳定”，顶级门将都是很“稳”的那种，极少出错，还要懂得指挥后防线的站位。其次，才是面对射门或一个单刀球的反应及扑救能力。所谓“弱队出门将”，就是说很多后来的顶级门将，一开始所在的球队往往不是什么强队，尤其是后防线一般比较薄弱，所以守门员一场球下来常常会接抵挡，成为最忙碌的球员，也就会比较容易引起注意。而强壮的球队，可能对一脚射正球门范围的射门都没有，门将的扑救就更无从谈起了。


    1.大学时，我的大学老师给我们讲过扁鹊和他哥哥医术的故事，今天给大家分享一下。故事是这样的：一天，魏文王问扁鹊：“你们家兄弟3人，都精于医术，到底哪一位最好呢？”扁鹊答：“我的大哥医术最好，二哥次之，我最差。”文王再问：“那么为什么你最出名呢？”扁鹊答道：“我大哥治病，是治病于病情发作之前的时侯，由于一般人不知道他能事先铲除病因，反而觉得他的治疗没有什么明显的效
    果，所以他的名气无法传出去，只有我们家的人才知道。我二哥治病，是治病于病情初起的时候，看到上去以为他只能治轻微的小病，所以他的名气只能在我乡里流传。而我治病，是治病于病情已经严重的时候。一般人看到我在经脉上针灸放血，在皮肤上敷药，用麻药让人昏迷，做的都是些罕不可议的大手术，自然以为我的医术高明，因此名气响遍全国，远远大于我的两位哥哥。”高手往往在民间，但人们却不断听到他们的故事。扁鹊的哥哥正如满老老师所说的“善医者无瘳煌之名”，扁鹊的哥哥是医学界的“通盘无妙手”。2.对“真正思考真正做事的人，总是承受更多的误解”是这样理解的，当你干一件事情，有时候不被理解，造成误会核深，众人指手画脚，你是孤独的。这个时候要懂得自我调整，不能在此一蹶不振，要耐得住寂寞，真理有可能会掌握在少数人手里。


    张老师好，关于倒数第二段说“投资人也对通盘思考方式无法理解”，我认为更准确地说，是投资人与美团经营团队对“什么才是通盘看眼”的理解不同。毕竟，“不耻全局者，不足谋一域”这样的名言很容
    易念，但是具体问题上，怎样灵活运用才是关键。什么才是决定全局胜负的要害，是北上广深还是20～100名的二线城市？每个人的理解就不一样了，而这可能才是大家产生分歧的根本原因。


    无独有偶，巴菲特的投资人生也似乎是这样的，通盘无妙手，却获得了持续、稳定、长期的收益。


    # 王兴 | 竞争之道——“每天前进三十公里”


    日拱一卒无有尽，功不唐捐终入海；“锲而不舍，天道酬勤”。宁可十年不将军，不可一日不拱卒。只要锲而不舍、坚持不懈，每天像个卒子一样前进一点点、进步'
