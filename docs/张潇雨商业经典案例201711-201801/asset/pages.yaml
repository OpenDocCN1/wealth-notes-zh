  md: '缺，所以手里有资金的人有话语权。可慢慢的，我们经历了二战后很长一段时间的和平发展期，资本已经不那么匮乏了。资金使用利率也从6%~8%到现在的3%~2%，日本甚至出现了负利率。所以，市场上钱不再是问题的时候，一个好的想法的创业公司就显得非常珍贵。Airbnb是这样的，我们学习YC的时候也是这样的。对于有梦想、有能力的人来说，我们现在所处的这个时代是最好的时代，抓住机会，人人都有可能登上风口。


    想到了《硅谷来信》的一句话，虽然和今天的课程没什么关系，但还是想码过来。“很多人尤其是媒体为了哗众取宠，过分渲染退学创业的故事，但是他们常常故意忽略了因果关系。盖茨、佩奇、布林和扎克伯格退学创业能够成功，是因为他们找到了挣钱的方法，然后才退学。而不是反过来，因为退学，所以创业成功了。”


    # Facebook | 垄断者还需要创新吗


    滴滴和快滴刚刚上线的时候通过对交易双方的补贴，迅速赢得了传统出租车和黑车行业的市场，也确实在某种程度上降低了用户的交易成本，通过提升匹配效率来增加利润空间。原来司机员在街上游荡一个小时可能才能碰见三单，而且都是南辕北辙，但有了滴滴的抢单系统和数据匹配，可以在一个小时内饱和运输五单六单，对司机而言绝对收入是上涨的，对乘客而言因为司机获益空间的上漲，他们可以获得一定比例的让利。然而，这一切是建立在未形成垄断的前提下，垄断一旦成型，滴滴就变成了最大的出租车+黑车运营公司，能够真正的称得上共享经济的，或许只有顺风车这一个品类。原来司机通过饱和运行提升的利润空间将被当做平台收佣上交给滴滴，从而使乘客享受到的让利空间也小了很多。于是，我们会发现打车更难了更贵了，但所有游戏角色都已经入局，想要回到过去亦是难如登天。


    巨头的收编、拷贝之所以成功不仅仅是自己拥有巨大的用户基数、拥有巨大的资本，还因为他们能把市面上的创意发挥得更好，对于用户来说更好用，因为最终之所以能成功还是用户自己的选择的行为。也ur就是我认为所谓的“垄断”只是在用户层面，并且改变底层企业之间的竞争，就算Facebook把Snapchat打败了还是需要“早鸟”为自己构筑一个防御机制，这也是增加了大公司竞争成本，暗藏在“垄断”底下的竞争是很微看不见的。我认为当今滴滴打车用起来还是很方便的。首先微信和支付宝两大支付平台对于滴滴的支付来讲给用户给司机以及滴滴都带来了巨大便利，另外就好像Facebook把Snapchat的功能都放到自己的功能上一样，支付宝、微信内也有滴滴打车的功能，对于用户来说很方便。对于感觉现在打车费“变贵”只是一个补贴没有之后的感覺，现在的打车费属于正常资费，而以前在滴滴与Uber竞争的时候的打车价格是优惠给了客户的资费。


    滴滴重度使用者，不用养车不用操心停车问题，不管远近都不用开车，节省精力。现在的滴滴也算好用，价格感觉还算相对合理吧。最担心的是因为滴滴没有竞争对手，涨价很多，但是已经习惯使用又没有替代方案，只能被涨价。毕竟现在垄断的滴滴，定价权在手，向用户收多少钱价格是它说了算，收到的钱它抽成多少，也是它说了算。现阶段的滴滴是非常挣钱的，百分之二十，每天这么多单子。当然，垄断也有垄断的好处。几乎所有的司机都接入到滴滴这一个平台，大部分的用户也都用滴滴，那用户和服务者可以最大程度地匹配起来。基本上不担心打不到车。希望滴滴能够发挥规模效应，把各种不必要的费用降下来，给客户最大的实惠。


    今日商业心法总结：1.用户洞察。我觉得Snapchat的stories功能是一个非常天才的功能，用户看着自己亲手发的图片和小文字组合成一个作品，那是一种看着自己孩子长大的幸福感。iPhone手机的相册也有这个功能，每隔一段时间就提醒你有一段新回忆录。2.等待比进攻更重要，这是《孙子兵法》的核心观点之一。我们都认识了太多多少胜多、以弱胜强的案例如赤壁之战、官渡之战，但《孙子兵法》的颐覆之处在于教会我以强胜弱，不应该学习诸葛亮那样，在实力不足时六出祁山，好的将军不应让士兵们靠蛮气厮杀，而是养精蓄锐、韬光养晦，要么是等待敌人出错（文中说的“敌疲我打”），要么找到战略制高点，居高临下攻击敌人，于万仞之上推倒千钧。


    # Facebook | 扎克伯格的豪华导师团


    通过扎克伯格的案例分析，我的收获和感受有两点：1.做个靠谱的人，很简单，也很难。简单是因为道理并不复杂，难是因为很多人“竟然做不到”。比如给过推荐、给过建议之后，竟然杳无音讯。2.扎克伯格之所以有这么多“豪华导师”，那是因为他是个值得棒，别
    人愿意帮的人，是个靠谱的。不积跬步无以至千里。但行好事，莫问前程。萧雨老师又让我对这个“心法”有了更深的体会和了解！感谢！


    2018年我在尝试创业，很幸运，有个朋友给我推荐了合作伙伴。对方是估值几十亿公司的老板，我添加了微信后，先做了简单的自我介绍，对方因为太忙很晚才回复，不过对我的介绍表现了兴趣，说当天晚上会联系我，不过可能因为有事一直未找我。过了几天，我在早晨的时候发了条祝福短信，并问到什么时候有空，可以聊一聊，对方告知近期会来北京，有机会见一下。于是我在大概约定的时间前又确认了几次，并在约定的时间前到场。我们聊得时间不长，但是对方给予了我很多建议，提出能否提供更详细的资料，我回去后第一时间就整理完成。次日，对方就电话联系我说咱们考虑下实际合作的事宜吧。前后差不多两周时间。主动联系+有始有终+主动反馈，优秀的人都会欣赏你。


    听完这几天的课程，最大的感想不是别的，而是——扎克伯格是个信仰型的人。他一旦决定相信某事，就会深入践行，做出极致的效果。意志既开放，也不会摇摆不定，决定既清晰，也不会一成不变。他相信自己的选择，所以会贵倨。私董会对于他来讲不是一个杂乱无章的意见风暴，而是一个点出他内心真实想法和认可的桥梁。他听了别人建议后的决定，已经是他的决定。


    今日商业心法总结：从扎克伯格身上学到的几点：1.低到尘埃里，才有可能长出花来。扎克伯格海绵一样惊人的学习能力，内心一定是有足够的谦卑，愿意弯下腰去仰望世界，甚至是低到尘埃里。而我们生活中很多人，甚至我自己，多学了一点东西就容易自满，尤其是那些严重新触动自己的瞬间，很容易产生“老子天下第一”的幻觉。2.在对的时间里找到对的人，然后从他们身上学习最需要
    的东西。扎克伯格本来就很忙，而且还有自己的每 年挑战要完成，但还是能够冷静分析出每一个阶段自己需要重点关注的问题，迅速向那些“最强大脑”学习，然后发起猛烈进攻，而不会整天忙得像救火队长，却忽视企业现阶段最重要的問題。3.沟通能力。我把交流那些大佬的过程（包括对别人有用、问出具体问题等等）统称为沟通能力，从我目前职场经历来看，职场上把话说清楚绝对是稀缺能力！'
