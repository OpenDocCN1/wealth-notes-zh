  md: '# 腾讯｜艰难的融资之路


    上期专栏里我们说到了腾讯最初的创业史，和QQ成立的故事。但一个好产品不等于一个好公司，腾讯是经历了生死的挣扎以后，才来到今天的。这期专栏里我们就讲一讲这段历史。


    # ｜用户增长Vs.资金困境


    上线几个月之后，OICQ的增长就成了一条陡峭上升的曲线，有一段时间，用户数每90天就增长4倍。几个月之后，腾讯的后台服务器已经完全承受不住了，必须买新服务器，但是一台配置好点的服务器起码要五六万，对于当时的腾讯来说，这个成本是相当高的。


    一开始，马化腾自己去深圳华强北买了一堆零件，自己先搓了一台山寨机。但是很快这也不够用了，而且还老出问题。当时腾讯的创始人工程师郭武自告奋勇在距离公司不到400米的地方租了个小房子，一接到服务器报警就第一时间冲到办公室。他在那里一直住到了2004年前后。


    当时的腾讯陷入了一种两难的境地。发布仅仅九个月之后，OICQ的注册用户就到了一百万。而相对应的是，公司账上就只有一万块现金了。


    最终大家商量，咬着牙一起再投入50万，然后把五个创始人的月薪抠腰减半，马化腾和张志东每月领2500块，其他三个每个月1250块。而且有段历史后来腾讯很少提及，那就是马化腾和团队一度想把公司卖掉，他们的开价是300万。但跑了很多家公司之后，全部都被拒绝。因为大部分公司当时都不知道怎么给互联网公司估值，大部分还在看腾讯有几台服务器、电脑、甚至桌椅板凳。结果出价最高的是60万。


    当时几个创始人还非常不害臊地各种即朋友借钱，因为银行是显然不会贷款给这样看不见摸不着的企业的。当时至少有两位有钱的朋友借给过腾讯20万和50万。马化腾可能不能用腾讯的股票来还债，他们都婉转地拒绝了。甚至有一位慷慨地说：“你要真的没钱了，不还也可以，不过我不要你的股票。”


    在几乎弹尽粮绝的时候，创始人之一的曾李青建议马化腾去找一找“风险投资”，这也是他第一次听说这个词。


    # ｜腾讯的第一个救星——IDG


    腾讯命中的第一个救星是著名的风投机构IDG，这是一家美国老牌的投资集团，进入中国很早，当时在深圳负责看项目的人叫王树。曾李青知道这是他们最后的机会了，于是洋洋洒洒写了一个20页的商业计划书。当时马化腾还在生病，他硬是把马化腾拉起来来参加会议。


    王树其实当时也对腾讯非常犹豫，而且他知道这已经是他们的生死关头了，如果IDG不投资，这家公司可能就真的倒闭了。


    王树后来回忆说，当时他问马化腾：“你怎么看你们公司的未来？”结果病恹恹的马化腾沉默了好久说：“我也不知道。”旁边的曾李青简直都要哭了。很多年后王树说，正是当年马化腾的这个回答让他对马化腾另眼相看，觉得这是一个很实在的领导者，值得信赖和合作。不过这是不是对当时情况的美化，和一种成王败寇的理解方式，就不得而知了。


    不过毫无疑问，王树在这笔交易里起了很大的作用。他不仅坚持了这笔投资，后来IDG在互联网泡沫之后，想在后面一轮融资里卖掉腾讯的股票，还是由于王树的坚持，最终保留了7.2%的股票，没有让这条大鱼完全溜走。


    # ｜腾讯的第二个救星——香港盈科


    但另一个投资方就没这么幸运了。当时在IDG这轮融资的时候，曾李青还找到了香港盈科，这是大名鼎鼎的华人首富李嘉诚的二儿子李泽楷创办的企业，他们也有意向投资腾讯。


    当时马化腾和曾李青给腾讯估值550万美元，想要募资220万美元，也就是要出让40%的股份——回想一下，孙正义找到马云的时候提出的占股比例其实更多，是49%。现在来看，第一次融资就出让这么多股份显然太不合理了，而当时的马云账上有500万美元、身边有个蔡崇信，所以把孙正义的49%生生砍下去一半。但是马上弹尽粮绝的腾讯可没的谈判了。


    马化腾当时计算，未来一年买服务器加发工资至少要一千万，所以最后要价200万美元，之后又加了20万美元是因为还要送一些股份给中间人。最终，IDG和盈科决定投资腾讯，一共出资220万美元，各占20%。


    结果，也就一年时间，李泽楷可能做了他人生中最错误的一个决定，因为他把这20%的股份，全部卖给了下一轮的新投资人。


    不得不说，风险资本的目光有时候的确是短浅的。在拿到投资之后的整个2000年，腾讯的QQ虽然发展很快，但是仍然没找到盈利模式。而2000年的互联网泡沫爆裂之后，IDG投资的很多企业都遭受重创，于是他们萌生了退出腾讯，找下家接盘的想法。


    当时他们找了新浪的王志东，被拒绝了；又找到搜狐的张朝阳，也被拒绝了。毕竟在股灾的影响下，谁都不敢轻举妄动。


    而神奇的是，腾讯的现金流有多差，它的用户增长就有多好。等到了2000年年底，股灾阴影下的QQ用户还在狂涨，很可能再过半年用户数就突破一亿。结果硕大的中国，偏是没有一个人愿意买他们的股份。


    # ｜腾讯第一大股东出现


    这个时候，一家没什么人知道的投资机构走入了历史。如果你看了我们这周第一篇专栏，应该还记得腾讯如今的第一大股东叫MIH，占股有1/3之多。他们就是在这个时期进入腾讯的。MIH是南非最大的付费电视运营商，同时它也很多投资。而当时找到他们的，是负责中国投资的网大为一别看这个名字是中国，但网大为其实是美国人，不过能说一口流利的汉语。


    也许，腾讯在命中注定就是网大为和MIH一生寻找的那个完美的投资案例。在接触了腾讯团队之后，MIH很快就决定投资腾讯。他们提出了两个条件：第一，MIH给腾讯的估值是6000万美元，也就是上一轮融资的11倍；第二，MIH希望成为第一大股东。


    结果IDG大喜过望，因为在互联网寒冬期还能有10倍以上的收益，实在是天上掉馅饼的好事。


    而李泽楷一开始并不想卖掉股份，但到了2001年中，盈科因为收购香港电信举债太多，连续两个季度出现巨额亏损，只好把全部20%的股份卖给了MIH。


    就这样，偶然闯入的MIH最终持有45.5%，变成了除了团队之外的第一大股东。不得不说，MIH的腾讯股份能拿到现在，也印证了它们不凡的眼光。


    而对于腾讯来讲，这次融资让它从此以后基本上摆脱了资金短缺的困境。拿到这笔钱后，不论是QQ和电信运营商合作开展短信、彩铃、图片等等增值服务收费，还是后来推出的QQ秀，都是腾讯顺水推舟顺理成章的发展。


    某种程度上来说，腾讯是极其幸运的。因为它两次关键的融资都发生在互联网股灾时期，如果没有这些救命钱，如果当时真有人300万收购了腾讯，如果任何一个创始人不愿意继续融资，可能今天我们都不会见到这样一个娱乐和社交帝国。所以我常说，人生很多时候都是“但是好事，莫问前程”。运气是生活里很大的一个因素，但是如果不去做点什么的话，运气怎么又会降临到你的身上呢？


    张潇雨


    在你看来，成功和运气之间有什么关系呢？欢迎把你的见解写在留言区跟大家分享，我们明天再见。'
