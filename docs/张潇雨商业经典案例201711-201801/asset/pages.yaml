  md: '# 王兴 | 竞争之道——通盘无妙手


    王兴 | 竞争之道——通盘无妙...


    昨天和前天，我们讲了一个案例和一个故事，从中看到了一些王兴对竞争的理解。今天我们再来换一个角度。


    在2016年年初，《财经》杂志对王兴进行了一次采访，那次访谈非常精彩。其中有一句话令我印象极其深刻，当时美团和大众点评合并时间不久，于是《财经》问：新公司下一步的产品规划是？


    王兴是这么答的：


    我们要定要让内容更加丰富，因为我们希望总体上我们能给消费者提供更多、更好、更优惠的吃喝玩乐。我相信，下棋的高境界是通盘无妙手。你真的能够想得非常好才行。


    在之前很多篇专栏里，相信你都体会到了王兴非常深的思考力。但这里我非常喜欢这句话：下棋的高境界是通盘无妙手。我觉得这句话才代表了王兴关于竞争的一个非常重要的思考和总结。这一期专栏，我们就来说说什么是所谓的“通盘无妙手”。


    # 1. 下棋的“通盘无妙手”


    “通盘无妙手”是一个下棋的术语，原话叫做“善弈者通盘无妙手”——也就是说很会下棋的人，往往一整盘棋你是看不到那种神奇的一招，或者力挽狂澜的一手的。这有点违反我们的直觉，为什么是这样呢？


    我们可以把这句话和另外两句话结合起来理解一下：善战者无赫赫之功，善医者无煌煌之名。


    这句话也很好理解，也就是：善于打仗的人往往没有什么显赫的功绩，而好的医生没有很大的名声。


    # 2. 斯诺克台球的“通盘无妙手”


    如果你打过或看过斯诺克台球比赛应该知道，它是这样的一项运动：台子上有各种不同颜色的球，代表不同的分数，两个人按照规则轮流击球。而且只要球进了，就可一直打，直到自己打丢了一颗球，就换对方上场击球。最后看谁得的分数多。


    所以，斯诺克台球比赛非常重要的就是保持自己击球的连续性。所以在打球的时候，球手一定要对整盘球的形势有整体的分析和规划，并且每一杆击球都要为下一杆做好铺垫，这样才能打得比较顺，否则就是自己给自己制造麻烦。


    于是纵观斯诺克的历史，有两类球手是非常顶尖，经常拿下大赛冠军的：


    第一类是球手天赋极佳，击球特别准，即使对别人来说难度很高的球他也能打进。虽然整体控制局势的能力稍差，可能在局面上给自己“挖坑”，但由于自己总能超水平发挥，打得别人没办法，所以也能夺得冠军。


    而另一类球手是，对局面的掌控非常完美，每一杆每一次计算都非常到位，给后面留了很多的余地和铺垫。看这种人打球你会发现他很少有那种难度很大，非常精彩的击球，但他经常不知不觉、波澜不惊地就赢下了比赛。这样的球手也能获得大赛的冠军。


    不过，这两类顶尖选手有一个最大的区别——后一类球手职业生涯的长度往往比前一类要长得多。而前一种天赋型的选手，往往会在巅峰期的几年里非常耀眼，但下滑也会很快，过了一阵就会淡出公众的视野了。


    # 3. 守门员的“通盘无妙手”


    大家都知道，在足球场上，守门员是个非常重要的位置。但外行看守门员的水准，往往会在于意那些特别精彩的扑救，比如飞身一跃把一脚势大力沉的射门扑出去，这确实非常精彩；但是懂业务的人评价一个守门员，其实是看TA是否能把问题化解于无形。


    比如何史上一些伟大的足球守门员，其实都是后防线的指挥家。TA会观察对手的进攻路线和模式，然后帮助整条后卫线做好整体规划，把很多问题消除在无形中。所以，你在场上不会看到他们经常有超水平发挥的精彩扑救，主要是因为他们早就杜绝了隐患，把对方有威胁的射门化解在了无形中。这才是一个足球守门员的高境界。


    # 4. “通盘无妙手”的含义


    我想，所谓的“通盘无妙手”应该有两层意思：


    真正善于下棋、善于打仗的人，其实在战争之前就运筹帷幄，把兵、情、战、势了解得清清楚楚，直接把可能的隐患消除了。


    其实这很好理解，所谓的“赫赫之功”，一定是要发生在自己力量相对弱小、局势并不占优的情况下——这时候居然还能赢得某场战役或者战争，才是一种奇迹，是一种“赫赫之功”。


    但真正善于打仗的人从来就不让自己陷入这种局面，甚至通过外交手段直接就把战争消除了，就像《孙子兵法》说的“不战而屈人之兵”，以及老子说过的“如果我知道自己会死在哪个儿，那我一辈子不去那里就好了。”


    说得再通俗点，5万人赢了50万人叫做赫赫之功，但是战略大家是不会允许自己把一场战争的胜负手托在一场奇迹上的。同样，善医者一定是把疾病消除在萌芽中，自然也就没有“煌煌之名”了。


    关键在“通盘”二字。


    我们在做决策的时候，应该站在一个全局的高度来看问题，而不只是计较一城一池的得失。


    一个很好的例子就是之前我们讲过的美团“开城市”的案例，如果我们把300个可以开的城市分为三个档次：前20名、20-100名、100名之后的话，最终美团真正投入资源拿下的是看似不上不下的中间档次，而正是这些城市帮助他们打下了很好的基础，最终拿下了胜利。


    这样做看起来好像是美团在北上广深这样的一线地区有所落后，但从全局的角度来说，这恰恰是整场战争的胜负手。所以，站在更广阔的格局看问题，也许你的答案会非常不一样。


    当然，这种策略也有很多的挑战。最大的挑战之一可能就是别人的不理解。


    于嘉伟后来提到美团这段历史的时候说过，当时他们很大的一个挑战其实是来自董事会。他说：“我在很长一段时间里，很不愿意去开董事会会，因为董事们都是住在北京和上海，而因为我们在北京上海的资源投入不足，导致落后。有时候投资人跟我说，‘我今天又买了糯米，你看在我这个商圈打开美团就是没有我喜欢的商家。’对于A轮和B轮的投资人来说，他们没有时间和精力去把每个城市分析一遍。所以我们总是得跟他们解释说，美团其他城市很好，得看总体的数字。当然，这还有另外一个选择，就是把资源大量地投入到北京和上海。这样投资人会感觉很好，但是这就变成to
    VC，面向投资人，而不是to C，面向用户了。”


    所以你看，即使是美团投资人这样的业内人士，他们在那个时候也是对这种“通盘着眼”的思考方式无法理解的。所以，真正思考真正做事的人，总是要承受更多的误解。我想这对我们每个人都是一样的。


    这就是我们今天的内容。希望你记住了“善弈者通盘无妙手”这种思考格局。三篇文章之后，我们应该更了解王兴对于竞争的思考之“道”了。明天的专栏，我们会再往前一步，我们明天再见。'
