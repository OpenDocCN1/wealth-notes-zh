  md: '# Facebook｜五大划时代意义（上）


    Facebook｜五大划时代意义...


    我们之前讲了一些重要的中国公司，也讲了三周的“小败局”。我想暂时把这个系列放一放，回到一些国际最重要的大家身上。所以，接下来我们会讲四个非常重要的美国公司：Facebook、谷歌、微软和特斯拉。


    当然，我知道讲好这几家大家熟悉的公司很不容易，不过我还是希望能做到一点，那就是即使是大家习以为常的公司和商业现象，我也希望能提供一些不同的角度，注入一些新的意义。所以，希望在我讲完了美国大科技公司系列之后，你会对商业的理解又有一层新的提升。


    另外，随着专栏过半，进入一个新的学习篇章，我想再次重申一下这个专栏的定位和意义。


    本质上，“得到”和我都想做到的一个事情是：通过对这些当今乃至未来都非常重要的公司的梳理和讲解，建立起一个大家对商业世界的最基础、最本源的认知。


    所以我在选题和写作的时候，脑子里永远萦绕着三句话：


    +   第一，这家公司在它的行业里足够有代表性么？值不值得讲述？它会不会是昙花一现？

    第二，如果有无数个角度都能解读某家公司或者某个行业，哪些角度和维度是用户最应该关心的？

    第三，我们这个专栏写到的东西，五年、十年、五十年之后再看，还有没有意义？


    这三个问题，就是我在创作这个专栏的时候，不停地问自己的问题。也希望不论是新来的同学，还是我们专栏的老朋友，在阅读和收听我们专栏的时候，能记住这三个问题。我甚至希望在这个专栏结束的几年之后，你还能回来重读专栏的内容，并且能在里面发现新的东西，而不是看到一堆过时的内容。这样，我的目的就达到了。


    Facebook这家公司相信大家都很熟悉了——至少名字听过很多次。但是我相信，很多人们没有意识到Facebook这家公司非常重要的，划时代一般的意义。


    这么说吧：很多年后，如果未来的历史学家想要研究一下21世纪开始的这二十年：从互联网普及化、到泡沫破裂、到Web2.0的新时代，到移动互联网和智能手机的大浪潮，再到人工智能、机器学习和区块链的火热——如果要研究这个科技爆发最剧烈的二十年的话，如果他们想从一家能代表这个时代的公司入手的话，这家公司就应该是Facebook。


    没错，苹果非常伟大，在2018年年初仍然是世界市值第一的公司；谷歌和亚马逊乃至微软也用不说，非常厉害；中国的腾讯和阿里也绝对不是等闲之辈，但我认为，只有Facebook才能够承担起代表这个时代的任务。要想真正理解这家公司，意识到这一点是非常重要的。


    有的同学可能会对我的这个观点有些疑惑，那么就让我来详细说一说。


    本质上，Facebook这家公司有五个非常重要的意义，可以说完全地引领了我们这个时代。今天我们先说前三个意义，分别是：Facebook定义了我们这个时代的创业方法论，Facebook定义了我们这个时代公司领袖的模板，Facebook和扎克伯格的成功重塑和巩固了整个投资界的信念。


    # 意义一：Facebook定义了这个时代创业的方法论


    相信你也知道，Facebook是由一个在校大学生在大学校园里创建的。2004年的马克·扎克伯格（Mark Zuckerberg）在哈佛大学成立了Facebook的前身Facemash，后来又改名叫The
    Facebook。


    那个时候，他没有什么商业头脑，也没有反复请朋友或者顾问来确认自己的想法，甚至没申请什么专利和商标。他唯一做的事情就是，找几个好朋友一起把这个看起来很“酷”的东西做出出来，然后推向市场，并且不断迭代。最终长成了世界上最大的社交帝国。


    我们来仔细想想：后来风靡整个硅谷，乃至整个世界“小步快跑、快速迭代”的“精益创业”的思想，是从哪里来的？其实就是从Facebook来的。


    注意，这里我并不是说Facebook的扎克伯格是历史上第一个这么创业的人，这显然不是——我们之前讲的GoPro和Under Armour的创始人都是这么做的了，更别说更早的硅谷企业家们。但由于Facebook巨大的、耀眼的成功，这套方法论第一次被系统地总结了出来，并且迅速发扬光大，影响力甚至已经超出了硅谷。一时间人人都在谈论“最小可行性产品”“MVP”以及“小步快跑、快速迭代”——远在太平洋彼岸的中国都一样。所以说Facebook定义了我们这个时代创业的方法论，这丝毫不夸张。


    # 意义二：Facebook定义了这个时代公司领袖的模板


    如果现在让你想象一个硅谷科技公司的创始人，你脑子里会浮现出怎样一种形象？


    八成是这样的：非常年轻、非常聪明的，可能是个天才的程序员，没准是个名校的辍学生，虽然并不那么善于言谈，但是骨子里很酷，敢于挑战权威、觉得自己的产品可以改变世界，甚至，对衣着似乎不那么在乎，老是穿着一件灰色的T恤或者是帽衫……


    这个经典的形象是从哪里来的？其实就是马克·扎克伯格。


    而且，这种模板一般的形象不仅仅存在于你我这样的普通用户的大脑里，也大大影响了这个时代的企业家、创业者和投资人们。


    想一想，为什么很多VC的投资人热衷于投资年轻人、名校大学生、不善言谈的程序员？一一其实这非常违反常理，因为我们一贯认为的商业领袖，都是西装革履、英姿飒爽、侃侃而谈、中等年纪，一切已经尽在掌握的样子，怎么可能是一个不爱说话的大学生程序员呢？改变这种刻板印象的是谁？其实就是马克·扎克伯格和他的Facebook。


    如果不是Facebook有这样巨大的成功，怎么会有这么多大学生、年轻人想创业，怎么会有这么多VC和资金来支持他们。一个成功的典型，可以激发无数.sell，后人，这就是榜样的力量。


    我曾经总结过一句话是这样的：乔布斯和扎克伯格的最大区别就是，乔布斯让人觉得，只有天才的CEO才有这样的成功；而扎克伯格让人觉得，只要努力，我也能有这样的成功。


    当然，硅谷的企业家一向都非常年轻。谷歌的两位创始人创立谷歌的时候不到三十岁，乔布斯早早就开始鼓捣电脑；再早的硅谷元老级的企业家，惠普公司的两位创始人也不过二十六七岁就开始了自己神奇的旅程。但是，从来没有一个在校大学生可以如此成功。


    而且在2000年互联网泡沫破裂之后，人们对这个产业是有所质疑的，然而，马克·扎克伯格却把一个学校里的小项目迅速带到了如此的高度。这有多么可怕？


    想象一下我们都很尊敬的企业家，亚马逊的CEO贝佐斯。他三十出头的时候开始做亚马逊，经过二十多年的努力，打造了一个巨大的帝国。他本人也在五十多岁的时候成为世界首富，获得了巨大的影响力，改变了我们生活的方方面面。而扎克伯格做到这一点的年纪是：三十岁。而他未来二十年、三十年、五十年还会做出什么来？这简直不可想象。


    # 意义三：Facebook和扎克伯格的成功，重塑和巩固了整个投资界的信念


    2012年5月18日，Facebook上市，估值超过了1000亿美元。这个震撼有多大？8年做出一家千亿美元的公司，即使在硅谷，这样的速度和规模也是难以想象的。


    有有趣的是，当年Facebook的上市几经波折，很多人都觉得这家公司不值这么多钱，华尔街对这种小年轻领导的社交网络公司也处于一种看不懂的状态。


    时间来到了2018年年初，在这个当口，Facebook的市值是5000亿美元。已经是全世界最大的几家公司之一了，人们对Facebook超过媒体公司、电信公司、石'
