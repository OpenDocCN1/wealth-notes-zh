  md: '# 王兴 | 竞争之道——“每天前进三十公里”


    王兴 | 竞争之道——“每天前... ↓


    这周我们的主题是，王兴的“竞争之道”。昨天我们借由当年美团在“团囤大战”时期的竞争策略，初步了解了王兴和美团在竞争这件事情上的一些观念。


    今天，我想借由王兴曾经在内部演讲的时候讲过的一个故事，来从另外一个角度审视一下王兴对待竞争的态度。在这几天的学习之后，我会在这一周的结尾给你做一个最终的打通和总结。


    先来介绍一下这个演讲的背景。这次王兴的内部演讲发生在2012年春天。如果你还记得我们之前梳理过的时间线，这个时候美团正是在行业寒冬的早期，初步奠定了一点点优势的时候。在这个阶段，你会发现王兴思考问题的方式已经非常成熟，很有那种在行业遥遥领先的领导者的心态了。


    那么王兴这个成熟的思考是什么呢？


    这次演讲的最终启示其实很简单，用八个字就可以概括：日拱一卒，功不唐捐。但是要真正理解，还是得在具体的事例中体会才行。


    # 演讲原文：


    今天是2012年的立春，2011年刚刚过去。在这个百年讲堂，我想跟大家讲一个故事，一个发生在enciamento...


    在1911年12月之前，没有哪个地球人到过南极点，所以这是一百年前所有最伟大的探险者、所有最有探险精神及梦想的人最想做到的事情。他们的故事和我们将要进行的事情有几分相似，所以他们的经验教训对我们来说有借鉴意义，所以我想跟大家分享这个故事。


    阿蒙森团队的成功经验，最后可以总结成一句话：不管天气好坏，坚持每天前进大概30公里。在一个极限环境里面，你要做到最好，但是，更重要的是，你要做到可持续的最好。


    相反，斯科特团队从他们的日志来看，是一个比较随心所欲的团队，天气很好就走得非常猛，可能四五十公里甚至六十公里。但天气不好的时候，他们就睡在帐篷里，吃点东西，诅咒恶劣的天气，诅咒运气不好，希望尽快转晴，尽快能够前进。


    事后总结，这两种做法很可能是他们最大的区别。不管环境好坏，不管容易与否，坚持每天前进三十公里。不管是到达南极点还是从南极点顺利返回。这是一个非常重要的区别。


    张潇雨

    相信在听完这个故事之后，你会有很多的感悟。在这里，我并不想过多地干涉你的思考，我想说的只有这八个字：日拱一卒，功不唐捐。王兴的演讲是一段非常有启发性的话，如果你从中得到了什么感悟和想法，我希望你能写下来，无论是什么，写在哪，都可以，你一定能得到自己的收获。我们明天再见。'
