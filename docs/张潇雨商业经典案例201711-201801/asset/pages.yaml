  md: '# 小败局 | 网约车鼻祖“易到”的诞生


    小败局 | 网约车鼻祖“易到”...


    专栏到现在，我们已经讲到了很多成功企业的案例。相信如果你跟着我们学习到这里，应该已经对商业这件事有了更多维度的认识。


    不过，最近经常会有同学提议说，看了这么多成功企业的案例，难免会有“幸存者偏差”的怀疑。毕竟公司成功了，怎么说都是对的。但商业从来不存在成功和必胜的法则，其实失败的案例才能给大家更多东西，所以我们也应该讲一些失败企业的例子。


    我觉得这个建议很好，所以接下来，我们稍微花点时间来看一些失败的案例。相信在读了大半年成功企业的历史和理论之后，这些失败案例可能会给你耳目一新的感觉。


    那么第一家公司，我们就从时间和距离都离我们并不远的公司开始说起。这家公司就是易到用车。


    接下来，我们讲一讲易到用车和它的创始人周航的历史。


    # ｜周航的第一次创业


    即使易到以失败告终，但毫无疑问，在整个过程中，它的创始人周航都是一个受到很多尊重的创业者和商人。就像圈内人评价过的：


    易到这个故事基本可以作为一个败局来研究，而且是一个十亿美元的教训。不过，在这个教训中，周航纵然有各种反思，但在私德上无可争议，甚至在为人处世上有着超然的境界。非常值得我们学习。


    易到的创始人周航是1973年出生的，和很多传奇的硅谷创业者一样，他也是一个大学退学学生。


    19岁的时候，周航在广东外语外贸大学读了一年就退学了。因为广东的商业氛围浓厚，周航的舅舅很早就做生意就非常成功。所以周航就来.ret...一毕业，周航就跟着哥哥一起创业了。


    # ｜财务自由之后的迷茫


    周航说过很多次，他后来创业真的不是为了钱，因为自己2003年的时候就已经实现了财务自由。那一年，周航30岁。


    # ｜周航盯上了网约车


    于是周航就开始琢磨第二次创业的方向。


    2010年5月，周航创办易到，从商务租车切入，通过网络约车解决用车痛点。


    # ｜孤独的易到


    易到上线的前三年，用周航的话说就是两个字：孤独。因为“当时整个行业就我们一家，所有的投资者都会质疑——这个市场到底存不存在？”'
