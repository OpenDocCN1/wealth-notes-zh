  md: '# 庆三万送福利 | 巴菲特的人生战略观


    张满雨


    咱们专栏的订阅数在前天突破了三万，为了感谢你的支持，今天为你特别放送一篇我之前写的文章，文章未为你准备了有奖活动，记得看到最后。


    工作特点使然，我时常要密集地和朋友讨论“战略”问题，说得具体一点，大概是“应该做哪些事情”和“下一步的计划”是什么。这些问题经常是公司层面的，也有很多人候是个人的。


    而讨论了这么久，我最近才意识到，战略的核心意义是“做出选择”。不需要选择的，就不是战略。


    比如对于一个企业来说，“提供良好的客户体验”和“建立高效的运营体系”就不能算是战略，因为这是大家都要努力做到的。《哈佛商业评论》有一篇小文的表述方法是：你战略的相反面必定是另一个战略——“提供很差的客户体验”肯定不是。


    同样，对于个人来说，“勤奋学习”或者“认真工作”也不是战略，决定花时间“学好英语”而不是“提高做PPT的技能”才是。


    战略没有小事。那下一个问题就是：作为个人，如何进行选择，以及构建自己的目标呢？


    # | Mike Flint与巴菲特的故事


    前一阵读书，有个故事很好地解答了这个疑问。


    故事是关于巴菲特和他的私人飞机飞行员Mike Flint的：Mike Flint做了巴菲特的私人飞行员十年之久，还曾为美国四任总统开过飞机，但他仍在事业上有更多追求。有一次，他和巴菲特在探讨他的职业生涯目标时，巴菲特让他去做这么一件事情：


    首先，巴菲特让Flint写下他职业生涯最重要的25个目标来。


    于是，Flint花了一些时间，把这些目标写了下来。


    然后，巴菲特让他审视一下这个清单，然后圈出他认为最重要的5个。Flint也照做了。


    Flint现在有了两个清单。一个是他认为自己职业生涯最重要的5个目标，另一个是另外20个他也觉得比较重要的事。


    巴菲特问Flint：你现在知道该怎么做了吗？


    Flint答：知道了。我现在会马上开始着手于实现这5个目标。至于另外20个，并没有那么紧急，所以可以放在闲暇的时间去做，然后慢慢把它们实现。


    巴菲特听完后说道：不，Mike，你搞错了。那那些你并没有圈出来的目标，不是你应该在闲暇时间慢慢完成的事，而是你应该尽全力避免去做的事——你应该像躲瘟疫一样躲避它们，不去花任何的时间和注意力在它们上面。


    这让我想到了三件事：


    +   1）有目标是非常重要的。


    当有了具体的目标，你才能反复地推演实现这个目标的方法和路径，才能在每天早上睁开眼之后明白自己应该围绕什么东西优化和努力。


    我听过的另外的一个很好的表述方法是：将开放式的问题变成封闭式的问题。而“什么都能做”或者“所有方向都可以是方向”是最大怕的，对于个人或是企业都是如此。


    滴滴早期找到了“五分钟内叫到出租车”的这么一个封闭式的目标，就意味着，它一开始不需要去开拓专车或快车，不需要优化用户乘坐出租车的体验（比如培训司机，在车内放上水、纸巾或者杂志），而只需要围绕着如何覆盖更多的车，以及优化车辆的匹配算法来执行。这样整个公司的目标是极明确的。


    +   2）专注很有力量。


    在一个人的认知资源有限的情况下，一段时间...真正的需要的东西的人，还是少数。


    +   3）比起“有所为”，“有所不为”可能更关键。


    这可能和芥格说的“Invert, always invert（反转）。”有相通之处。没有被选中的那20件事，其实也...更加危险。


    # | 一个可操作的方法


    顺着这个思路，我也去做了和Mike Flint相同的事。


    在这个过程中我发现，虽然听起来简单，但列出清单再剔掉那些不重要的选项，其实是个相当考验人的过程。于是我做了一些细化和补充，如果你有兴趣，下面是一个可以执行的方案：


    +   1. 列出20-25个对你最重要的事，或是最想达成的目标


    +   a. 这个清单上的目标，既可以是阶段性的，比如“未来一年我想达成的目标”，也可以是永久性的——我自己写的就是“我的生活里到底什么对我最重要”。


    但如果...可以稍微模糊一些，比如“和最聪明的...”。


    +   b. 如果你想不出25个也没关系，试着天马行空，go crazy with your list。你心底里一定有一些最深的渴望和最疯狂的想法，把它们写出来。


    +   c. 慢慢来，这不是一个一蹴而就的过程。


    我的经验是，列出一个“自己希望做的事”的清单，绝不是花一个小时头脑风暴一下的结果，而是一个细细琢磨，偶尔...你完全可以更多。


    +   2. 将这个清单上的目标慢慢缩减成5个


    +   a. 这应该是整个步骤中最重要的一步，我曾在一个...。


    过去十年里，你还记得自己最开心的某个瞬间么？当时发生了什么？你为什么那么开心？

    曾经你对哪些东西是非常有热情，但后来又放弃了？原因是什么？

    如果现在你的银行账户里突然多出来了三亿的存款，那么目前生活里的哪些事你仍然是会继续做的？……


    +   b. “5”是一个虚指的数字，至少对于我来说。


    如果设立短期目标的话（比...留...真正想要的东西。


    +   c. 不要急，慢慢来。


    比起疯狂地列举好玩儿的事，去除掉...你不必害怕需要更长的时间。


    +   3. 根据你精简的情况，列出一个“一定不去做”的清单来（not-to-do list）'
