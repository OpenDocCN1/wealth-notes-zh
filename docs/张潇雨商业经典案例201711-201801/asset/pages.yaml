  md: '# 周末互动 | 关于承诺


    你好，欢迎来到《商业经典案例课》。我是张满雨。


    我们的专栏来到了一个奇妙的巧合，这期周末互动正好是阿里和所有零售商的“双十一”狂欢节，希望大家买得开心。


    另外，也别忘了我们之前好几期专讲过的消费主义的话题——买买买当然很开心，但定义我们的从来不是我们消费了什么，而是我们创造了什么。


    这一周我们都在一个非常宏观的高度来看阿里巴巴这家公司，所以周末互动的时候我就不想再多说这些业务或者数字方面的东西了，我们来讲一个小故事。这个故事的关键词是：承诺。这也是马云非常看重的一个东西。


    时间拉回到2007年，这一年正好是阿里巴巴B2B业务上市的那一年。之前我们也讲到，在达沃斯论坛的时候，马云突然感觉到金融危机可能要来了，所以他马上督促整个公司进入战备状态，一定要Singleton
    这... 1


    马云后来説：


    > “2007年的时候，我在2、3月有IPO的想法，到了7、8月，我非常焦急，让大家一定加块、加块、加块，越快越好，要出事儿了，一最多也是要故事。礼拜一。”


    结果，马云突然想起一件事情。


    时间再往前走，来到2004年。当时的阿里一度出现了资金周转问题。危急的时刻，当时的CFO蔡崇信四处奔走去找投资，结果，他想到了自己从小长大的台湾。


    于是蔡崇信找到了著名的台湾豪家，也就是中信集团的大家长，也可以说是台湾第一政商豪门。另外通过关系，马云和蔡崇信还找到了富邦蔡家等好几个知名的台湾企业家族。最终这些家族和私人捐钱参与增资，而且非常低调，大多通过香港和海外的私人渠道投资。他们也帮助阿里巴巴渡过了那个时候的难关。


    于是马云和蔡崇信一直对他们非常感恩。到了2006年的时候，马云在APEC会议上碰上了台湾豪家的掌门人辜澄松，答应他2007年要去台湾做个演讲，结果到了阿里上市的前夜马云突然想起来，这个日子就是阿里要上市的11月5号啊。


    结果马云纠结了一下，然后和所有人说，这个演讲我已经答应了别人，不能不去。IPO的日期就推迟一天，推到11月6号。


    当时的律师都恨死了他了，催也是你，推也是你。但马云还是去了，并且在台湾·中国信托举办的“领袖高峰论坛”上发表了演讲，赢得了很多喝彩。结果马云说：“那一天我去了台湾，结果股票大盘当天狂跌。活动结束以后我回到香港，第二天上市，结果那天整个股票市场就开始涨，于是我们趁势而上。这是一件事情，关于承诺。”


    这个关于承诺的故事就讲完了，不知道你有什么感受，可以给我留言讨论。


    # —— 本周留言精选 ——


    # 阿里 | 业务、财务宏观纵览


    如果说，亚马逊通过AWS、MarketPlace和Prime构成了一个理想的飞轮架构，那么从阿里的四个板块来看，风格有着极大的不同。即便算上分出去的阿里云支付和蚂蚁金融，似平也有着阿里布局的独持思考。应该说，亚马逊是一个样板，但必定不是唯一的一种模式。特别是阿里在中国这样一个发展中国家一步步走来，里面的很多布局和业务也注定打下了本土烙印。期待能够看到更深层次的分析，从而解读阿里各个板块在不同历史时期的逻辑关系。


    # 阿里 | 马云上过的三堂“创业课”


    1964年出生，1992-1999，三次创业，之后才是阿里巴巴。没有人能随随便便成功。每一个创业者，几乎都是连续创业者。他们在不断的创业中，逐渐成熟，这包括商业（运作出公司）、创业（习惯创业，自己养自己，对公司负责，对财富负责，对未来负责）、人生（知道自己该干什么，不该干什么，知道自己的人生该如何度过，知道自己的人生意义和使命）等；他们在不断的创业中建立团队本身，或者磨炼建立团队的理念；他们在不断创业中积累人脉，了解别人，也让别人了解自己。最重要的是行动和信念。在行动中学习完善自己。坚定自己的使命感，让自己坚持。'
