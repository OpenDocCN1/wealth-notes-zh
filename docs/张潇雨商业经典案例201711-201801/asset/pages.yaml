  md: 'Facebook超过媒体公司、电信公司、石油公司这样的新闻也完全不惊讶了。因为大家好像已经默认了，Facebook不管再创造出什么样的奇迹，好像也都非常正常了。


    而这种现象引领了一个什么样的思潮呢？那就是整个风险投资界都再次意识到，并且坚定了一个信念，那就是：投资最重要的就是投出“独角兽”，错过一个Facebook的风险，比投错100个公司的风险要大得多。


    我们在之前的专栏里讲过投资的“幂法则”，英文叫power law。而这个观念是谁把它传播并且变成业界主流价值观的呢？正是在早期投资了Facebook的，赚了2000倍的Peter
    Thiel，彼得·蒂尔。


    硅谷最顶级的投资人和投资机构们当然知道，他们所在行业的特点就是要找到独角兽，努力投到最好的创业者，但这始终不是一个全行业的基础共识，直到彼得·蒂尔在全世界演讲、发声，发表了畅销书《从零到一》，宣扬了这个概念。


    所以说，是Facebook教育了这十几年杀进投资领域的后来者们。它让人们意识到，错过一个真正好公司的代价是多么巨大，而如果你投到了这样的好公司，就应该紧紧抓住不放，而不是把钱漫无目的地撒到别的地方。


    我们专栏之前讲到过的京东之于徐新、Airbnb之于YC，本质都是这样的。而后来 的团购大战、打车软件大战、共享单车大战等等等等，也都是在这种指导思想下结 成的果，因为人们再也不敢错过所谓的“风
    口”了。谁知道那个看起来不靠谱的年轻 人，是不是下一个扎克伯格？


    所以说，Facebook之于这个时代的意 义，就是如此巨大的。当然，它象征的意义还不仅仅于此。在下期专栏里，我们继 续来一起讨论。


