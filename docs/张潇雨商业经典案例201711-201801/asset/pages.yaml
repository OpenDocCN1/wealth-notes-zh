    实是别人早就做过，而且被证明为是失 败的，他们却不知道。这就要求，要保 持开放的思想，多接触新信息，新理 论。千万不要做井底之蛙。不管什么时 候，未知的东西，永远大于已知的东
    西，所以，扩大自己的已知范围，尽量 在自己的能力内，向外拓展。要学会主 动为难自己，这样，才能成长。

