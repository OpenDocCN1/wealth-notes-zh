  md: '# 王兴 | 竞争之道——“农村包围城市”


    上周的专栏，我们用了一整周的时间来介绍王兴和他的创业历程。在这段历史里，你可以看到从一开始的校内网、人人网，到后来的饭否，再到后来的美团，甚至后来和大众点评合并之后的美团点评集团，其实已经超出了简单的几次创业，而是一个人完整的成长轨迹。


    有意思的是，当年美团起源于对团购鼻祖Groupon的模仿，但如今的美团点评集团，已经逐渐成长为了一个没有任何对标公司和竞争对手的企业。现在美团的业务，从到店餐饮、外卖、电影票、酒店旅游，已经逐渐扩张到了用车和出行、共享经济、新零售甚至无人驾驶等等领域。


    而这种貌似没有边界、可以无限延展的业务布局，也让美团面临着更大的竞争。因为按照它现在的业务分布，如果非要给美团点评寻找对标公司的话，它可能是“饿了么+携程+小猪短租+滴滴+等等等”。美团的战线拉得很长，这就意味着美团要在各个产品上接受竞争对手的考验。


    更有意思的是，其实王兴本人不论是出身背景，还是风格个性，都从来不是一个争强好胜、凶悍好斗的形象，所以有一个问题就显得非常重要了——王兴的竞争方法论到底是怎样的？他底层的商业思维和哲学认知是如何让他屡屡在竞争中活下来的？


    这一周的专栏，我们就会通过各种商业案例，还有王兴的采访，以及一些更延伸性的信息，来近距离地分析一...“竞争之道”。


    # 1. 团购这个生意到底能开多少个城市？


    这个问题随之而来的是，团购这个生意的商业形态是什么？用户行为是怎样的？开一个城市的运营成本大概是多少？等等等等。这个数字决定了整个扩张策略的上限。


    # 2. 应该先在哪些城市投入资源？


    300家可能在当时是个上限，或者是阶段性的结局。但是，并不是所有人都能活到结局，很多企业可能开不到300个城市就资金链断裂了，倒闭了。所以问题就是：应该先在哪些城市投入资源？


    # 3. 排名150以后的城市要不要开？


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_57_0.png)


    > 实际上在2011年年初，所有做团购的人在城市管理水平上都是很差的，包括美团也是。基本在2012年之前，我们经常连公司一共有多少员工都不知道，因为公司发展速度太快，而内部管理水平又跟不上。美团其实对自己开城市的能力和管理城市的能力也没把握，所以当时根本没想什么“农村包围城市”策略。真正...“我觉得得惜...”'
