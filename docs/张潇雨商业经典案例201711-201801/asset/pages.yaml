  md: '来。“无翼而飞者声也，无根而固者情也，无方而富有生也”，意思是没有翅膀能够飞的是言语，没有根但能够稳固的是情谊，没有固定方式而能富贵的是善于变化。王兴面对大起大落还有团队跟随，也能够不断认知和改变自己更是值得学习的。


    今早刚读了一本关于华为的书，华为有一个很好的精神就是“灰度开放妥协”，我觉得这是东方思维和管 servicio略结合得很 好 的一个实例。我们都需要 在系统里存活
    兴旺发展，所以寻找机会坚持自己的目标，并能够根据情况妥协灰度思维，是智慧长远的成功之道！这也许也是王兴从咳否的收获之一吧！何帆老师说我们要向大自然学习容忍失败和多样性，天将将大任于斯人也，必先苦其心志，所有
    的成功都不是偶然的，我们要给科 需要向马云和王兴这样的企业家学习，永不言败，屡败屡战，成功才会降临！


    之前认为王兴的校内和咳否和美团都是模仿，这个有画面，如今看是王兴对商业的敏锐度很高。这个要基于学习能力，能及时发现国外的商业信息，并且能整合为己用。同时打开十几个网址浏览，这个说明阅读量很大。过去是通过书籍学习，如今知识信息迭
    代的速度日新月异，还没出版时已经被迭代，能第一时间浏览相关网址的内容才是学习的一个手段。


    之前李奕老师说他投资比特币就是在比特币发行的早期看到了国外网站的介绍，继续深入研究之后，决定作为投资对象。对信息的思考加工，浏览网站是第一步，更重要的是阅读这些信息之后的思考，加工和处理，为自己的领域所用才是重要的商业敏锐度。在这个过程中，商业的敏锐度才逐渐被打磨，逐渐练习而成。


    以前罗胖说过，“未来不迎，过去不恋”，讲的是一种对于未来的思维逻辑。而这里，王兴的处世风格告诉我们，只有去思考未来，并努力付出自己的努力，才有可能在创业方面取得成功。这里的主动出击看似与“不迎”相矛盾，实际上是给出了一个更积极的处世态度——要积极地去行动，在曲折前进的过程中不经意地靠近未来，而不是单纯地坐下脚步而期待未来。


    # 王兴 | 校内网的发展与失败


    追了专栏这么久，发现成功的企业家有普通的一面，也有不普通的一面。成功的企业家也像普通人一样会犯错，不普通的地方在于对于错误 的态度。有的将错误怪罪于其他人；有的将错误归结于运气不好，而那些成功的企业家，将错误看成上天给予的财富，拼命地从错误中吸收营养，然后再次踏上创业之旅。


    无论是王兴还是马云的经历，都告诉我们犯错要趁早，许 多人就是怕犯错才错过了所有。马云在“环球转理论坛”上的一次演讲 中，讲到了创业中犯错的意义，“我们犯的每一个错误，都是一个很好的令你将成为成功的宝库。是错误使我们与众不同。每一次我们犯错，我们学习，检查自己。大多数人都会失败。如同在战场上，生存下来的才是赢家。所以当你做生意的时候，你得从别
    人的错误中学习。不要担心。大多数错误，你觉得那个家伙怎么那么傻，他怎么能犯这样的错误，其实你也会犯同样的错。我读过很多很多的案例，人们为什么失败，我不断地问，这家伙这么聪明，而他失败了，为什么我会有机会赢。你了解得越多，你就变得越积极。”这同时也是我们在学习商业案例的原因。订阅这个专栏的同学无疑是智慧的，对商业案例了解越多，在商业世界你就会变得越积极。这句可以成为我们这个专栏的口号了。


    今天得到：1.不断试错、自 我迭代，积累的试错成本最后转化为机会成本，找到属于自己的事业。2.创始人对自己正在做的创业项目，要有一种 扛得住心，脱去左右有欲，让创始人与创业项目共同成长。3.投资方需要了解创业方的需求，创业方也要了解投资方的价值观。4.老罗说过，创业资金要充足，足够度过本轮融资的“
    排他期”，和下一轮融资的资金需求，至少有半年以上的资金储备。


    以下两点思考：1.资本的认识：资本是助力还是害人，取决于认识程度。要打铁的那必须要有根草，初期创业对待根草的态度正确与否相当重要。2.竞争视角：如果当时有众多大厂要做同样市场服务，走得快有先发优势，走得深有谈判筹码。我觉得他们是后者，透过深化产品本质，即使最后没做还还是有价值与能量，而非多元化发展，最后死后无人过问。


    # 王兴 | 不可避免的“创业课”


    这个专栏有点回忆杀啊，勾起了关于校内网的记忆。高考后一个高中同学在QQ上发给我一个链接，邀请我注册校内网。 上大学后大家也都是互加校内网，发图发状态发日志，初高中
    的同学也都能找到，整体而言互动性还是很强的。后来还可以在上面养狗、种菜领菜，那可能是校内网最火的时期了吧。记得自己定了半夜的闹钟，就为了准时收获，防止被偷，哈哈。后来改名人人网以后，感觉就开始走下坡路了。最后的记忆是关注了一些公共号，主要是体育和动漫相关的，但也慢慢就怎么登录了。最后一次更新状态是工作一个月之后，就再没登录过了。


    至于校内网为什么突然就不行了，我觉得微博、微信的冲击是很大的原因，而且改名人人网是想跳出学生圈的限制，像Facebook一样连接所有人，但事实证明失败了。我觉得如果就选择继续深耕学生群，如果能做出自己的特色，也许不会衰落得这么快吧。


    理工科出身的人创业，还存在一个潜在的问题，就是财务知识方面的欠缺。我还记得当年看新闻报道说，因为资金链断裂，王兴悄悄卖掉校内网。我已经记不得具体是什么原因了，比如说是运营成本的掌控，抑或是融资的时机把握问题。但是对于王兴个人而言，不但已出售校内网，应该是非常大的一个教训。由此我也联想到，满屏老师在讲阿里巴巴的时候说，蔡崇信不是找来的，是上帝派来的这句话，有什么样的意义。作为一个2006年刚彻本科读书的人，自己经历了校内网的全盛时期，也见证了它逐步衰败的过程。个人以为，当时大家玩校内网，主要有以下几个目的。1.自己的高中、大学同学都在玩，通过校内网可以保持联络，查看大家的近况。2.通过校内网认识新朋友，尤其是异性。3.各种连接线上和线下的活动。以
    上几点其实和早期的Facebook是非常像的，但是校内网的早期用户毕业了以后，似乎没有什么有效的措施把他们留下来。毕竟工作之后所关注的内容，和在学校期间关注的内容是有非常大的差距的。此外，留言中好几位同学也有提到，2010年左右移动互联网开始蓬勃发展，微博和微信逐步黏住大家，形成了自己的网络效应和生态圈，而校内网在这一步也逐步落后了。以上是自己的一些观察，期待满两老师明天的讲解。


    应该算是校内网的第一批用户，也是亲身经历了从频繁使用，追求互联数量，到最终放弃的过程。[1] 需求发生变化。第一批用户的粘性会随着年龄的增长迅速缩减，单靠学校这个单一维度已经不足以让进入社会的人回归到校内网。例如现在的微信不需要通过学校或者公司进行好友推荐，更多的是工作关系或兴趣所投。[2]
    特色单一。当时展示自己特色的空间只有校内网，但随着微信等其他手段的增多，校内网已经失去了独特的优势，也没有再次开发出新的功能，因此让新生代很难直追校内网。[3]
    没有跟上移动互联网的步伐。移动客户端普及之后，校内网的App端并未给出更好的服务，几经改版，让用户看不到希望。此外，仅仅依赖站内信是不足以满足人们沟通需求的，错过了与微信最初竞争的优势。


    个人一点愚见，因为那个时候我本人对互联网还停留在打游戏的状态，赎愧。说说看，我觉得校内网的最大问题就是遇到了后来崛起的移动互联。如果我没记错的话，在校内网如日中天的时候，QQ已经有手机版本了，校内网却停留在网页互动的状态，直白地说就是错过了移动互联的萌芽。另外就是校内网没有及时地与自己第一批老用户成长，比如第一批老用户毕业了，对社交的需求从原来
    的小规模社交，变为大规模了，可那时 候校内网还是校内网，目标市场还是在校大学生，这就给后来的微博很多机会。因为社交是网络状态的这张网要不断地织下去，需要阶段性迭代才行。我所说的迭代也一定是基于用户的考虑才说的，在'
