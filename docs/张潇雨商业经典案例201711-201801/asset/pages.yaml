  md: '容纳几百人，所以学生节的时候往往一票难求。于是校内网给学生节赞助了1000块钱，换来100张票，拿着票在校内网上搞抽奖，而且要求抽奖者必须留邮箱、姓名、专业、头像，总之是真实信息。结果这一下就拉来了800多个用户，都是清华电子系的学生。


    之后他们还组织过其他推广活动，有一个是租大巴把学生送去火车站。当时的北京没有那么多地铁，火车班次也很少，很多学生需要半夜去火车站，等到凌晨3点上火车。


    于是校内网发起了一个活动：清华、北大、人大三所学校的学生，在校内网注册账号，凑够50个人，时间也合适就可以免费乘大巴。


    结果为了凑满50人，学生们自己就主动到处宣传，拉老乡注册。还有的男生为了跟甘比... 女生... 木... 不重... 从... 升... 拍摄


    我们知道，一个社交网络公司必然是一个具有网络效应的公司，而一个具有网络效应的公司最艰难的就是“鸡和蛋”的问题。只有用户数达到一定量级，在上面互动的人才会觉得有意思，并且拉更多的人进入。所以校内网通过做“笨”事情积累的这一万个用户是非常关键的。


    现在，王兴的团队已经明确了产品，积累了用户，也有一个相互信任的团队，校内网即将进入一个高速发展的时期。然而，那时候还很青涩的王兴在一件事上并没有把握好，导致了校内网最终的败局。明天我们就来说说王兴在这个阶段得到的经验和教训。


