  md: '# 复习 | 迪士尼帝国的崛起


    张潇雨


    迪士尼刚刚收购了市值几百亿美金的福克斯集团。今天带你复习一下迪士尼的发展史和过人之处。


    # —— 迪士尼清单 ——


    +   1. 几乎每个人都知道迪士尼很牛？但事实上，它真实的实力可能还是超过很多人的想象。作为全世界最大的娱乐公司，迪士尼市值超过1800亿美金，说是“迪士尼帝国”也毫不夸张。做个简单对比：同样是娱乐业公司，迪士尼市值抵得上18个万达院线。


    +   2. 提到迪士尼，大家都知道制作精良的动画和遍布世界的迪士尼乐园。但事实上，迪士尼不是“动漫电影”和“乐园”的双轮驱动，而是在试图打造一个“娱乐帝国”——业务包括有线电视网、出版、零售、音乐、戏剧、主题乐园等各个方面。


    +   3. 在迪士尼，对收入贡献最大的，恰恰就是我们不熟悉的媒体网络业务，主要指电视。《绝望主妇》《丢失》《摩登家庭》这些受欢迎的美剧，都是迪士尼旗下的电视公司制作的。而我们最熟悉的影视娱乐和迪士尼乐园，两部分的收入占比还不到一半。


    +   4. 在看似多元发展的背后，是迪士尼一套独特的商业模式。一句话概括：迪士尼是内容、渠道和衍生品的全产业链模式，将内容的价值释放到最大。其中，内容（电影IP）是链条发轫的原点，传播渠道（电视网络）是内容的放大器，最后衍生品（主题乐园和周边）的部分，将内容所有的价值进一步释放。


    +   5. 迪士尼试图牢牢抓住每一年轻段、每一代人的注意力。不仅打破原有偏见，成功地将动画片从小孩子的专属，打造成老少皆宜的影视产品。而且，为了保证每一代小孩都看过迪士尼的动画、尽可能让内容IP长盛不衰，在北美，迪士尼每七年都会把动画电影拿出来在各种渠道重映一遍。当然，这还得益于它的渠道优势。


    +   6. 观众无论男女，都在迪士尼的覆盖范围内。最初，迪士尼像米老鼠、白雪公主这些经典角色，更吸引女性观众。为了获得更多的男性观众，迪士尼收购了有超级英雄主题的漫威工作室，以及拥有《星球大战》系列的卢卡斯电影公司，拥有了美国队长、复仇者联盟等一大批IP。自此，迪士尼变得男女通吃。


    +   7. 迪士尼秉持“高度控制”的产品哲学，认为最好的选择就是不给选择。如果你去过迪士尼乐园就会发现，从进入的那一刻起，自己就被牢牢“控制”了。去买吃的东西，在不同主题区就会看到不同风格的食物包装，比如西部风、公主风等；在街道上看到的迪士尼角色，被严格规定不许商下头套；甚至迪士尼那一站的地铁从包装到语音报站，都是特别设计的。你会感觉自己处在一个真实的梦幻王国。这种“沉浸式体验”，非常符合未来的娱乐趋势。


    +   8. 迪士尼之所以能成为今天的娱乐帝国，关键一步就是“买卖买卖”。从一家简单的动画工作室，到现在，不仅经营着美国广播公司、有线电视网，还有出版、零售及戏剧部门，甚至还拥有一个成功的音乐集团，基本都是收购获得。这些对迪士尼今天的成功就没有。要知道，光是一个叫ESPN的电视网，一年就能给迪士尼贡献100亿美金左右的收入。


    +   9. 作为一个娱乐创意公司，迪士尼还非常重视人才的作用。秉持着“得不到你，就买下你的公司”的原则，迪士尼将大量的人才挖到旗下。现任CEO鲍勃·伊格尔一度被认为缺乏创意、难以胜任，但他通过买卖买卖收购了大量创意人才，也加速了迪士尼的“扩张”。


    +   10. 收购并不难，拥有那么多品牌后依然能有效管理、有效协作，这才是迪士尼的厉害之处。事实上，迪士尼对于被收购的公司非常尊重。比如，收购皮克斯之后，不仅不强制改变对方的文化和工作流程，还反过来让自己被对方影响。后来漫威和卢卡斯影业之所以愿意把自己卖给迪士尼，除了业务上的协同性之外，很大程度上，也是因为看到了迪士尼是这样对待皮克斯的。


    +   11. 迪士尼在发展过程中占尽了天时地利人和。在低迷期，出现了一个性格暴戾的CEO迈克尔·埃斯纳，他的激进扩张把迪士尼从泥潭中拉了出来；当帝国基础打好后，又出现一位温和谦逊的CEO鲍勃·伊格尔，修复了之前因埃斯纳受损的公司关系、员工关系，利用自己的和善达成了一笔笔收购，让迪士尼进一步扩张。如果把这两个时期或人稍微微换一下，迪士尼可能就不会有今天。


    # —— 图解迪士尼发展史 ——


    # 娱乐帝国迪士尼的发展史


    迪士尼公司并不是一家简单的动画电影公司，而是一个覆盖全产业链的媒体与娱乐帝国，业务包括出版、有线电视网、零售、音乐、戏剧、主题乐园等各个方面。


    1923 - “迪士尼兄弟动画工作室”成立。


    1928 - 米老鼠首次出现。

    影片名叫《蒸汽船威利》。

    米老鼠在超过130部电影中出现过，是第一位在好莱坞电影中拥有固定位置的卡通人物。


    1934 - 唐老鸭首次出现。

    影片名叫《聪明的丹尼》。

    1937 - 《白雪公主和七个小矮人》上映。

    这是电影史上第一部彩色动画电影，世界第一部发出了电影原声带的电影。


    1955 - 第一座迪士尼乐园在加州开放。

    1961 - 迪士尼熊到小熊维尼诞生。


    1966 - 创始人沃尔特·迪士尼去世，迪士尼自此陷入长达二十年的低迷期。


    1984 - 迈克尔·埃斯纳出任CEO。

    20年间，埃斯纳让迪士尼从年收入16亿美金变成了年收入308亿美金。


    1995 - 《玩具总动员》上映。

    后来《玩具总动员》获得了三项奥斯卡奖。


    1996 - 收购美国广播公司，包括其旗下的娱乐与体育节目电视网ESPN。


    2003 - 《加勒比海盗》成为迪士尼第一部评为PG-13的影片。


    2004 - 埃斯纳辞去首席，鲍勃·伊格尔上任。

    如果说埃斯纳让迪士尼脱离了泥沼，鲍勃·伊格尔就是把迪士尼打造成帝国的 人。


    2006 - 以74亿美金收购皮克斯。

    2009 - 以42亿美金收购漫威娱乐。


    2012 - 以41亿美金收购卢卡斯影业。

    2016 - 上海迪士尼度假区开幕。


    2017 - 迪士尼市值达到1800亿美金。


