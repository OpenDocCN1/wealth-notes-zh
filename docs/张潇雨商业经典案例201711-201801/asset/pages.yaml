  md: '# YC | 如何看懂投资意向书 (中)


    YC | 如何看懂投资意向书 (...) ↓


    今天我们继续来讲投资意向书 (term sheet) 里的一些关键条款。


    # ｜保护性规定与知情权


    从昨天的清算优先权接着往下走，真格的文件里有两个比较常见的条款，一个是“保护性规定”，一个是“知情权”。


    什么叫“保护性规定”呢？“保护性规定”也叫“保护性条款”，是投资人为了保护自己的利益设置的条款。这个条款可以很简单，也可以非常非常复杂，但主要的目的只有一个——要求公司在做某些潜在可能损害投资人利益的事情之前，要获得投资人的批准。


    实际上就是给投资人一个否决权，对于公司的某些特定的行为，投资人和小股东有权来阻止。从这个描述里你也能发现，这里面的谈判空间很大。


    当然比较好的早期投资人都不좌过分纠结这个条款，我们来看看到真格是怎么写的：


    +   采取以下任何行动需事先取得真格基金的同意：

    1) 清算、合并、兼并或解散；

    2) 修改、变更投资者权利或可能影响投资者的权利的事项；

    3) 购买或赎回股分；

    4) 支付任何股息。


    这几条都是非常合理的条件。凭什么说这些条款非常合理？我举几个例子你就明白了。比如，如果没有保护性条款，作为创业者你就可以做这些事：


    +   1. 把公司以一块钱的价格卖给你的亲戚，然后公司就归他了。银行账上的钱你们分；

    2. 你要求公司以1000万美元的价格把自己的股份买走，然后自己退休养老去了；

    3. 公司突然发行巨量的股票给你自己，这样其他投资人的股份就被稀释到接近于0；

    4. 你突然决定利用公司的钱发放一个巨额分红，因为创始人一般都是大股东，所以你拿到的也最多。


    这些事情，如果投资人不写到保护性条款里的话，理论上你是都能干的……所以你应该明白这些条款的必要性了吧。


    而真格这简单的几条保护性条款，其实是有非常大的风险的，这恰恰反映了真格对于创业者们的极度信任。在YC的文件里，写的基本也是类似的要求。


    当然在实际的谈判中，不同创业者和投资人之间，不同融资轮次之间，双方都是有谈判空间的。到那个时候，你找一个靠谱的律师就好了。


    “知情权”也不难理解：你做的有关公司的重大决策，或者相关的财务信息，投资人是有知情权的。


    不过在我的实际经验里，靠谱的早期投资人其实很少向你打探各种消息，更多的是给创业者时间和空间把事情想明白，做好。毕竟把公司做大才是双方真正一致的利益。


    # ｜反稀释条款


    接下来我要讲一个非常经典的投资协议里的条款，就是反稀释条款。


    “反稀释条款”，也可以叫防稀释条款，或者价格保护机制，这也是投资协议里面非常标准的条款了。本质上这个条款也是用来保护投资人的利益的，它的意思就是：防止公司在后续经营的过程中，或者融资的过程中，把之前投资人的股份过度稀释。


    我们举一个稍微夸张点的例子。


    比如你的公司目前估值一个亿，投资人占20%，你占80%。结果你的公司经营不太好，加上资本寒冬很难融到钱，最后只有一家机构愿意投资你，但是要求估值之前的一半，也就是5000万，他投资1000万，占公司股份的20%。这时候有没有反稀释条款就可以体现出区别了。


    如果czek ... 老投资人也有这个反稀释条款 ...


    # ｜董事会成员设置


    在真格的文件里你也可以看到，在“公司治理”那一栏，投资人是有权利委派董事会成员或者董事会观察员的。之前讲迪士尼的时候我们讲到过董事会和公司、股东以及CEO的关系。总体来讲，董事会的责任就是向全体股东负责，并且挑选出合格的CEO来管理公司。


    在创业早期，由于创始人团队基本是大股东，所以董事会一般也是创始人方占多数，而投资人只是起到一个参与、观察和监督的作用。但到了公司发展后期，创始人 ...'
