  md: '险，甚至还有合作者的资本野心。


    今日商业心法总结：我认为主要是三方面原因导致了吴长江的败局。1.过于迷恋权力，缺乏格局。从一开始同学情谊的破裂，到后来为赶走阎焱而引狼入室，到最后悲情地阐述“自己对雷士这个孩子感情”，都可以看出吴长江对权力的迷恋，控制欲和占有欲特别强，缺乏共赢共创的大格局。2.见识不够。吴长江第二次被驱逐出公司很大的原因就是因为缺乏与资本市场打交道的经验、不了解反稀释条款、不了解资本的局中局，可以说是对资本市场一窍不通。3.手段被对方识破、摸清。吴长江两度重返雷士都是因为对渠道商的强势控制（垫钱手段和感情牌双重办法），这一点被王冬雷摸得一清二楚，最后一次出局就是被王冬雷反过来控制住了渠道商（全国36家运营中心的30家支持王冬雷的决议）。


    从众多经典商业案例中可以看出，成功是偶然的，有运气的成分，而失败是必然的，而事后回顾，又容易陷入归因谬误中。1.雷士的商业崛起，有客观上的必然，也有主观上的人的推动因素。客观上，照明市场需要新产品填补当时的市场空白，随着照明市场的成熟和发展，市场需要重新定义重新划分重新定位，不断挖掘潜力，雷士照明顺应了潮流，成功了。主观上，雷士照明采用“胡萝卜加大棒”深度捆绑经销商的方式，在企业发展处于上升期时，经销商与企业是命运共同体，有互相提携、共同发展的要求和动力。但是这种利益驱动的方式，同时也埋下了不稳定的种子，企业自身出现裂痕时，经销商容易保全自身而一边倒地选边站队，加剧企业的分裂。2.雷士照明的兴衰成败，明显暴露了制度设计上的缺陷，雷士照明从最初的三人合伙，到后来的股权不断地分化合并，公司深陷控制权纠纷泥潭，自救导致分裂，他救也没有长久。商业良性有效运转，在法律层面上的制度设计之外，最重要最根本的制度建设，就是企业的价值观建设。3.有个疑问，为什么在雷士照明的每次震动中，暗中都有一股力量在搅动？明局中有暗局，这个暗局是由什么挑起的，又是由什么推动的，最后，又是谁得益了，谁吃亏了，它又能给我们以怎么样的启示呢？


    第一次同学之情，如果没断或许结局会完全不一样。第二次、第三次没有本质的区别，都是资本在把你掏空，此时，你又恰好没有战友，利益的朋友永远不会成为一家伟大企业的发起人。之前看了那么多商业案例，无一例外都是组合，而他太过于独立了。'
