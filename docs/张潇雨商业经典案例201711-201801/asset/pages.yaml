  md: '# 阿里｜支付宝VIE事件（上）


    阿里｜支付宝VIE事件（上）


    我们都知道，阿里巴巴可以说是这二十年来中国乃至全世界最现象级的一家公司，它不但创造了巨额的收入、利润和很多的工作岗位，还慢慢改变了整个国家和社会的很多很多方面。相信在你的生活中，肯定已经离不开阿里的某些服务了。


    当然，阿里的这种影响力不仅停留在日常生活层面，在企业、金融、法律，甚至政治层面也有着很多具有影响力的事件。接下来的两期专栏，我们就来回顾曾经闹得沸沸扬扬，对后来的阿里产生过巨大影响的“支付宝VIE事件”。


    现在回头来看2010-2011年发生的“支付宝VIE”事件应该是個合适的时机了，因为随着事件的推移以及阿里后来的上市，当时大家讨论的各种有争议的信息和细节都在逐渐地水落石出，而这件事情对后来科技行业甚至整个市场的影响也越来越清晰。


    所以，我们接下来就借由这个非常经典的案例，来重新梳理一下这个当年争议极大，在阿里和马云的创业史上都涂漆重彩，甚至让声誉一直非常良好的马云背上了“赖账”称号的事件，到底是怎么回事。


    # ｜什么是VIE


    VIE的全称是Variable Interest Entity，中文可以翻译成可变利益实体。


    这个名字并不重要，但VIE这个东西在过去二十年里成为了中国科技公司和资本市场最重要的一种结构。


    简单概括一下就是：


    所谓的VIE模式，是在境外或者海外成立一个空壳公司，然后通过这个空壳公司和境内——也就是在中国 的公司——签订一系列协议，然后通过这些协议完全完全控制境内这家公司的这么一种结构。


    于是这个空壳公司就可以拿去上市了，因为空壳公司在签署了这些协议之后，就“相当于”境内这家公司了。总之，这个VIE的设置主要是为了让公司能够顺利上市搭建的，当然为什么要使用这种“曲线救国”的方法，一会儿我们会解释。


    另外，VIE架构在实际操作中会比这个方法更复杂一些，但是原理完全一样。比如会有壳套壳，再套壳的设置。在这里我可以讲一下最基本的情况。


    # VIE结构


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_31_0.png)


    我们假设，现在你在中国成立了一家公司A。然后由于各种原因，你这个公司需要到境外比如美国上市，于是接下来我我就得这么操作：


    +   1. 企业的创始股东，比如创始人和管理团队，先在境外成立一个公司C。你在中国 的公司叫A，这家境外公司是C。一般出于税收和监管等各种考虑，C公司都可能会放在开曼群岛或者维京群岛（BVI）这种小地方；


    +   2. 这个公司C，会和其他公司股东——比如新老投资人——再共同成立一个公司B，一般也放在开曼。这个B，就是之后我们要拿去在境外，比如美国的纽交所或者纳斯达克上市的那个公司，一般叫做上市主体。


    +   3. 出于各种税收、监管或者管理方面之类的考虑，这个上市主体B公司，会在香港设立一个公司D，B对D的股权是全权掌控的，也就是这个新成立的公司D是归上市主体B管的。


    +   4. 这个D公司，会以外商投资的身份，在中国境内成立一个公司E。这个E公司有个专有名词叫做“外商独资企业”，英文是 Wholly Foreign Owned
    Enterprise，名字非常直观好懂。行内人一般简称为 WFOE。


    +   5. 这个外商独资企业E，会和你创办的这个中国公司A，签订一系列各种协议，达到完全控制国内这个A公司的目的。


    那A和E签订的协议都包括什么呢？我们可以简单举举例子：


    股权质押协议。这是 最重要的协议，也就是中国公司A的股东把所有持有的股票完全质押给这个WFOE公司E。


    独家顾问服务协议。这个协议规定，由WFOE企业E向经营实体企业A，提供排他性的知识产权及技术顾问服务，而实体公司向WFOE支付的费用额为全年的净利润。说白了就是，A公司一年不管挣多少钱，都给给E公司，本质上这就是一个利润转移协议。


    其他协议，比如贷款协议、资产运营控制协议、认股权协议、投票权协议。总之，所有协议的目的都是把这个境内的A公司，让它等同于要上市那个B公司。


    总之，这五步完成之后，一个经典的VIE结构就搭好了。


    听到这里你也应该明白了，绕了这么一大圈，其实我们最终的目的是让这个A公司上市，但实际上又办不到，所以只好让境外的这个B公司上市，而B公司通过控制D和E，也就相当于全权控制了A公司，所以大家一般就认为，B上市也就相当于A上市了。那就可以买B的股票了。


    或者我们也可以这么说，本质上控制一家公司有两种途径。一种是股权控制，这也是大家最熟悉的，天经地义；另一种就是VIE这样的“协议控制”，其实本质上E公司和A公司没什么真正的关系，靠的就是这些协议来保证这种关系。当然，这里面就留下了操作的空间，因为，协议总是有可能被撕毁的。


    不过今天我们先不深入讲这个 问题。我们要先来回答另外一个问题——你肯定想知道，绕了这么一大圈，如此的“曲线救国”，是 图什么呢？


    # ｜VIE诞生的原因


    这个大名鼎鼎的VIE模式，其实现第一家使用 的公司是新浪。


    大家都知道，互联网企业都非常需要融资，但是由于很难短期盈利，所以拿不到银行贷款；这时候，风险投资的作用就产生了，尤其是大量国外的风险资本。但是我们国家的一些行业是禁止或者限制外资进入的，比如互联网、媒体等等行业。


    比如，1993年发布的电信法就规定：禁止外商介入电信运营和电信增值服务，而当时信息产业部的政策性指导意见是，外商不能提供网络信息服务，也就是所谓的ICP业务，但可以提供技术服务。


    而1999年的時候，新浪正在筹划海外上市。结果当年9月底，信息产业部在一次讲话里，认定互联网内容服务（ICP）是电信增值服务。根据中国的政策法规，这块不允许外资进入。那么这部分就不能拿去海外上市了。


    结果为了解决这个问题，新浪和新浪的律师们开创了一种新做法。他们提交了一份重组方案，把原来互联网内容服务相关的业务从母公司里面剥离出来，成立了两家全新的纯内资公司。剥离之后，这两家纯内资的公司不参与上市，而仅仅把母公司拿去上市。


    但是，母公司和这两家公司签订了软件技术服务、顾问服务、股权质押等一系列控制协议，所以也享有了它们的各种利益，最终这些利益也会反映在股价里。这就是大名鼎鼎的VIE架构，甚至大家也称它为“新浪架构”。


    结果二十年来，VIE架构成了很多行业采取的经典架构。我可以随便举出一些非常著名的采用了VIE架构的公司：新浪、网易、搜狐、360、百度、携程、盛大、新东方、分众传媒、三生制药、泛华保险、焰盛重工等等等等。可以说这个模式已经成为了最标准
    的希望在海外上市的内资企业的设置。


    当然，你可能觉得这种操作也有点擦边球的意思。监管部门目前仍然默许VIE架构的存在，是因为互联网的发展确实需要大量资金投入，所以这些企业能够到海外上市，拿外国投资者的钱来发展我们自己的事业是很好的一件事情；但同时，监管部门也意识到包括媒体、文化、出版、互联网等
    等行业，相对敏感，应该加以引导和监督，所以让VIE模式走得太远，也是不符合我们国家利益的。所以，VIE模式就像是一把“达摩克利斯之剑”，一直悬在很多企业的头上。


    当然，之前我们也讲到，只要是协议，就有'
