  md: '# 小贩局 | “盛大盒子”为什么会失败


    小贩局 | “盛大盒子”为什么...


    之前的专栏我们说到，陈天桥凭借着《传奇》这款游戏上市的豪赌，五年时间里就随着盛大的发展成为了中国首富。但是，对于他的野心来说，这还远远不够。


    实际上，31岁成为首富的陈天桥心里有很多的别扭。


    # I 从“人人喊打”到战略转型


    在2005年那个时间，网络游戏还是个“人人喊打”的行业。很多媒体都在报道各种青少年沉迷网络游戏的新闻，陈天桥也是那时候家长们眼里的“罪魁祸首”。


    2004年3月，有一名男青年冲进了盛大公司，拿着一瓶汽油和一个打火机想要自焚，多亏盛大员工及时把火扑灭了。原因就是，这个男青年在《传奇》里花钱买了很多装备，但没想到这些装备是不法分子用“外挂”生产“废品”，结果外挂被盛大封了之后，这些物品也消失了。于是他情绪失控，甚至以死相逼。


    5月份，央视的《今日说法》栏目还报道了一个15岁孩子杀人的事件。一个叫“龙龙”的孩子因为迷恋《传奇》这款游戏，在网吧和另一个孩子对骂。最后龙龙买了一把刀，把另一个孩子捅死了。


    这些事件都困扰着陈天桥。他既感到委屈，又觉得不好反驳。


    后来接受采访的时候，他说：“我们企业一年给国家上税就是几个亿。这要是在钢铁或者能源行业，一定会受到政府的嘉奖和表彰。但对于盛大来说，我们就要低调低调再低调，灰溜溜地做人。”


    另外从业务层面来说，盛大也需要转型。很长一段时间，盛大都靠着一两款明星级的游戏支撑着绝大部分的营收，这让整个公司都像行走在钢丝上。


    实际上陈天桥吃过一次亏，2003年的时候，盛大和开发《传奇》的韩国方面闹矛盾，最后还对簿公堂。导致<|start|>银那笔4000万美元的投资差点泡汤。


    对于陈天桥来说，把命运牢牢掌握在自己手里才是关键的。


    # I “盛大盒子”的艰难诞生


    于是，陈天桥开始思考向哪里转型。他后来回忆，有一阵他“每天除了睡觉之外，几乎剩下时间全都是思考该如何转型”。


    后来，他终于把大致的方向理顺了，然后兴奋地给公司各个副总裁级的人物打电话时，出乎意料的是，大多数高管都不看好。


    这个转型战略，就是后来著名的“盛大盒子”。


    所谓的“盛大盒子”其实是一个硬件：通过连接电视、电脑、手机等等电子设备，把电影、音乐、游戏、广告、电商等等全部连接在一起。


    盛大要从一个游戏公司变成一个全平台的娱乐公司，要从1亿电脑用户走向4亿个家庭用户和手机用户，主战场要从网吧走向家庭的客厅。


    现在看来，不得不说陈天桥是个天才的战略家。和周航的共享Better理念早于Uber三个月一样，盛大的“盒子”战略比第一款苹果TV早了一年。


    # I “盛大盒子”的四个障碍


    +   1. 算错了做盒子的难度


    当时陈天桥完全全算错了一点，就是做一个好盒子的难度。


    +   2. 没有好内容


    +   3. 操作系统不够好


    +   4. 没有天时'
