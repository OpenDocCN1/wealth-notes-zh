  md: '# 小股东｜第三次出局，雷士告别“吴长江时代”


    小股东｜第三次出局，雷士…


    这期专栏，我们就把雷士照明和吴长江的故事收个尾。


    之前的专栏我们讲到，吴长江被投资者赶出了公司，而他在二级市场收购雷士股份所做的努力，也因为股价大跌之后被强制平仓而失败了。但是，吴长江还有最后一招没有出。


    这一招就是：吴长江对经销商的掌控力。


    # Ⅰ 吴长江的第二次回归


    这次内4江桥段与2005年那次分家的剧本非常类似，吴长江再次动用了同样的“杀手锏”，他在经销商的支持下，开始图谋第二次回归。


    2012年7月13日，由雷士经销商带领的罢工正式开始。


    一个月之后，雷士照明的核心供应商停止向雷士供货，内部多名高管离职。8月20日，吴长江现身重庆，动员供应商恢复供货，部分供应商表示会响应吴长江的提议。


    # Ⅰ 闾羞出局


    为了对抗闾炎，经由熟人牵线，吴长江认识了一个新的“白衣骑士”。所谓的白衣骑士，就是在发生恶意收购的时候，来帮忙解救目标公司，帮助公司驱逐恶意收购者的第三方个人或者公司。这个人就是德豪润达公司的王冬雷。


    # Ⅰ 密谋者王冬雷上线


    然而在这种模式之下，吴长江在两边都不是第一大股东了，话语权很有限。于是他和王冬雷另外签署了一份秘密协议，要求保证他对雷士照明的独立运营管理的权力。吴长江认为，只要雷士的经营权在他手上，就没人能真正给他威胁。


    # Ⅰ 吴长江锚钩入狱，终成败局


    2014年8月8日，雷士照明一纸声明彻底捅破了窗户纸，公告宣称CEO吴长江辞职，同时下任的还有其他吴长江的亲信。如果你计算一下，这已经是吴长江第三次被自己创立的公司驱逐了。'
