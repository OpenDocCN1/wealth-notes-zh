  md: '# 周末互动 | 张朝阳：人生的意义在于参与和创造


    大家好，这里是《商业经典案例课》。我是张漠雨。


    这周我们的专题叫做“小失败局”，顾名思义，说的是一些失败的案例。下周我们还将会继续一周围这个话题。


    实际上讲这个专题，第一是想和大家分享失败案例，因为比起漂亮的成功，很多时候失败教给我们的更多。但是我觉得更重要的，也是我更想和你分享的，是如何正确看待“成功”和“失败”的定义，面对“成功”和“失败”的态度应该是怎么样的。我觉得这是我们人生非常重要的课题。


    所以在这周你会看到易到和盛大的案例，虽然在商业层面 hittar 他们确实失败了，而且是十亿美金级别的失败，但是我从来不觉得周航和陈天桥是失败者。但你同样也能看到，即使是成就了如此事业的人，他们面对的烦恼和困扰也是非常真实的，我觉得这应该给我们一点启发。


    而且有意思的是，像周航和陈天桥这样走过一个起起伏伏心路历程的企业家，绝对不止他们两个。中国互联网圈里还有一个著名的人物也有类似的经历，也曾经在成功中迷失自己，然后慢慢又找到自己，这个人就是张朝阳。


    老同学应该已经非常熟悉了，我们这个专栏的视角常常会从商业走到人物本身。我其实非常鼓励大家去看看张朝阳的故事，因为他的人生历程也非常有代表性，能从里面学到非常多的东西。


    在这里我给大家介绍一篇小的采访，是我曾经推荐过的科技写作者程苓峰老师对张朝阳的一次采访。虽然不长，但是里面很有信息量。


    另外，这篇采访是2013年的时候完成的，那个时候张朝阳刚刚“关闭”完并，开始走出抑郁症的困扰，但显然还没有如今的他这么通透。但无论如何，我觉得他都是一个很不错的学习对象。


    # ——采访全文——


    张朝阳：媒体业变化太大了。前两年是要请很多记者到酒店开发布会。现在变成了跟媒体人一对聊。


    程苓峰：发布会出去的信息是零碎、表面的。单聊的信息是整体、深入的。社会化媒体又把这些系统的信息再分散出去。说明你们在与时俱进。


    下面说正事。搜狐的内部创业在行业里做得相对好，有了比较成功的多元化。游戏、输入法、搜索、视频，都是这样。你是怎么做到的？


    张朝阳：它们先是自然形成的，后来我们顺水推舟。


    刚开始做游戏，我们屡战屡败，从韩国引进到在国内找开发公司，都不成功。后来看中王滔团队，说等你做到什么地步就分给你什么东西。后来一下子做成了，我就必须兑现承诺，然后就形成拆分的状态。


    对于有点历史的公司，有大锅饭的问题。当时王滔来搜狐，如果做不成也就什么都没有，他是背水一战。后来我觉得游戏这种模式可以推广，使得一群人集中精力做一件事情而且有明确的目标，并且这个目标实现和不实现是有区别的。


    后来就有了搜狗输入法、搜狐视频。


    程苓峰：选团队、给承诺之后，你的角色如何转变？


    张朝阳：具体的财务指标、销售还有日常竞争、战术层面我不太管。但我管的一个是产品的竞争力，另外一个是营销。拆分以后好像我不管它也能正常运行。我的介入是要实现超越，让天下人知道我们在做一件事情。第三个，当我觉得需要重大变革，或一个产品可以整合搜狐其他部门的力量实现突破，我就介入。


    程苓峰：那你们有没有因此对内部创业形成制度？


    张朝阳：不能。公司是一个有机体，不能一般化，必须具体项目具体对待。要选对项目，选对领域。


    程苓峰：为什么不能一般化？


    张朝阳：公司是个生命体，你要跟着它的生命形态、生长过程顺水推舟。不能像积木或机器化，说你们都可以创业了，洒一堆种子下去。这样是不行的。必须精心看着它怎么长，长的方式跟具体的人有什么关系。有人适合有人不适合创业。


    如果一个部门做得有声有色，说明部门领导人有能力，就有可能让他创业拆分。到底是否选择这个人，当然是种感觉。他们都是共事很多年的同事，相当了解。这种了解是一种感觉。


    程苓峰：但搜狐手里的几个东西都遇到了瓶颈。


    张朝阳：新闻客户端异军突起，挑战是如何在强大的微信面前不被边缘化。搜狐的三级火箭，本来可以直接插百度故宫。但冒出来360，现在的挑战也是巨大的。


    视频的瓶颈是流量和品牌。如何让“到搜狐看视频”成为一种大众习惯，过去两年搜狐视频的营销做得不够。另外UGC也是做得不够。两方面共同导致流量处在一个瓶颈。UGC是用用户原生力量，如果没有UGC，那就在跟数学在赛跑，跟原子弹赛跑。你是跑不过数学和原子弹的。


    光靠内部创业和拆分还是不行的，光靠我撒手不管让大家自求奋斗也是不行的。现在搜狐新闻客户端，没有分拆，也很成功。不能简单说拆分解决一切，游戏的成功并不一定能复制。


    程苓峰：这些瓶颈的背后，有没有共同的原因？


    张朝阳：通过拆分，使得各个战线有强力的队伍在做，没太大失误。但又因为我的没参与，导致有缺失。一是整体搜狐的品牌营销。就像2008年奥运会，2009年打盗版。这两年搜狐品牌有点弱。一是没有产生爆发性的以数学规律爆炸的东西，无论微博还是微信。


    本来2010年我在考虑下决心打UGC这一仗。紧急从白社会调人到微博拍板，搞微博相亲、灿烂登山，当时搜狐微博的势头有起来一点。但后来终止了。


    程苓峰：江湖上有一个说法。搜狐老出独当一面的人，赛宇、古永锵、李善友、陈一舟、王小川。这跟你的风格有关。“张老板在后面。下面人要想清楚，然后去急、拼、要资源，逼着你成熟”。另一个风格是陈天桥。“桥哥很逞，想清楚后直接画张蓝图给你；但下面跟不上，揪苗助长”。马化腾和马云处于两个风格之间，比较平衡。


    张朝阳：我部分认可。我的姿势是lay back。更多是观察形态，看它的生长。不像陈天桥那种。主观的计划性往往跟不上现实。尤其互联网，哪里能爆发这个事谁也预测。


    如果要想预测，你必须深地潜入这个产品当中，你才能准确预测。这就是腾讯为什么做得好的原因。战略计划的推进行前提条件是，你必须成为一个最好的产品经理，你在第一线能摸着方向，能判断，开启战线。


    我介于马云和马化腾之间，我没像马化腾变成深入浅出的产品经理。但也不像马云那样，那么不是一个产品经理。我以前在营销上做得很多，在产品上花时间不多。我曾经深入过，但没特别在第一线做产品经理。这样的话，我太主动规划产品，方向就可能错。我就坐在一边看怎么生长。


    程苓峰：你怎么看搜狐新闻客户端长起来的原因？


    张朝阳：人们拿着手机，用碎片化的时间来了解天下，是刚需。以前是中国移动的短信新闻，后来这个界面变成互联网之后，需要有两种基因组合起来才能成功。一种是内容本身，一种是渠道。


    市面上的公司有的是强内容，有的是强渠道。之前我觉得搜狐的技术、内容和产品部门割裂得有害，就决定整合内容、产品包括无线部门。我们经历过SP时代，2001年跟各地运营商和终端厂商都有经验和资源，这就是渠道能力。


    这样我们这个组织的基础比较全面。产品比凤凰强很多，内容比新浪很多。'
