  md: '# 小败局｜雷士照明的巅峰与分家大戏


    在讲完了太子奶和李途纯的案例之后，我在很多的失败案例里找寻下一个要讲述的对象。在筛选了很多个公司以后，有一家公司引起了我的注意。


    它成长壮大乃至失败的历史和我们之前讲到的几家公司有非常相像的地方，但又不完全一样。相信你在这家公司失败的故事里，可以看到很多个公司的影子。这家公司就是雷士照明。


    雷士照明成立于1998年年底，2010年在香港上市，是国内最大的专注于照明行业 的企业之一。


    然而，和很多民营企业家的结局一样，2016年12月21日，雷士照明的创始人之一吴长江，被广东省惠州市中级人民法院作出一审判决，以挪用资金、职务侵占罪，判处有期徒刑14年。而他与软银赛富基金的合伙人间崚之
    之间的权力之争，也成为了中国商业史上最经典的一次博弈。


    这里面的故事到底是什么？这个案例又能带给我们什么样的启示呢？我们接下来就讲讲雷士照明和吴长江的故事。


    # ｜雷士照明从无到有


    和很多中国民营企业的创始故事一样，雷士照明的成立也是因为一种“不安分”。


    雷士照明有三个合伙人，吴长江、胡永宏、杜刚。他们三个都是重庆人，而且是高中同学。吴长江是班书记，胡永宏是班长。


    1992年的时侯，耐不住寂寞的吴长江从陕西的军工企业辞职，南下广东。他先是进了一家港资的灯饰企业，但这次给香港老板打工的经历并不是很成功，几年以后，吴长江离开了这家企业。


    # ｜合伙人之间出现裂痕


    然而，能够共患难，但无法同安乐的故事我们已经看过太多，雷士照明又是一个很好的例子。到了2002年，公司成立三年之后，三个合伙人开始逐渐有了分歧。


    最核心的问题就在于是赚的钱应该怎么用。吴长江一直主张扩张，赚了钱就要投入到公司里，再发展。而其他两位股东希望赚了钱要分红。


    # ｜雷士照明销量持续走高


    但在商业层面上，雷士照明的确非常成功。到了2002年，雷士的销售额就超过了1亿，2003年超过3个亿，2004年超过5个亿，2005年超过7个亿。增长非常迅速。


    +   胡永宏进行了四项非常有效的改革：

    第一，推出专卖店模式。

    第二，把雷士定位在商业照明。

    第三，开辟了新的渠道。


    # ｜合伙人分家大戏上演'
