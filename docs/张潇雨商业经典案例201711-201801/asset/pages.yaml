  md: '# 复习 | 爱马仕为何能成为“奢侈品中的奢侈品”


    张满雨


    说起爱马仕，大家的共识就是：爱马仕是奢侈品界的“一段清流”，是皇冠上的明珠，是将商业与艺术平衡得最完美的一个奢侈品牌。爱马仕是怎么做到的？今天带大家复习一下爱马仕的高贵之处。


    +   1. 从创立一开始，爱马仕就奠定了工匠精神的基调。创始人蒂耶里·爱马仕创立品牌之初，只是为了让马戴的皮具能舒服一些，他做的马具是所有同行里最用心、手艺最好的。整个欧洲的王室，甚至包括越南、暹罗、巴西、俄罗斯、日本的王室都向他们订购马具。没错，爱马仕一开始只是一家马具店。


    +   2. 从创立到现在，其他奢侈品品牌不知道完成多少次商业化了，而爱马仕还是最初的那个家族企业。正在掌管爱马仕的是爱马仕家族的第五代和第六代成员。


    +   3. 即使是工业革命和汽车工业崛起之后，爱马仕转型做女包了，也没有将生产工业化，因为他们相信：想要与机器对抗，唯一的方式就是坚持精雕细琢的 cycle.
    手工工艺，突出产品的稀缺和珍贵。


    +   4. 20世纪末期，其他的奢侈品品牌都在为降低成本向发展中国家转移生产线，偷工减料，流水线代替手工，大肆宣传、商业化的时候，爱马仕的信条是：不管别人如何变化，保持自己的手工工艺，不盲目扩张，保持只服务一小部分人群。


    +   5. 即使扩张，爱马仕也非常理性。如果你翻开爱马仕2016年的财报就会发现，虽然在20世纪90年代初爱马仕就有超过200家门店了，但如今爱马仕总店数也不过315家上下，而且过去五年居然是持平甚至还是小幅下降的。相比起来，LVMH已经有接近4000家门店了。


    +   6. 我们今天对拉链已经司空见惯了，这都是爱马仕的功劳。瑞典人发明了拉链后并没有引起人们的重视，是爱马仕花了很大力气取得了专利权，把拉链引入了法国，并且第一次用到了服装和皮具上。当时，除了爱马仕的人，没有人懂得怎么装拉链，甚至很长一段时间，连香奈儿裙子的拉链都是爱马仕的员工代装的。


    +   7. 很多明星名流都是爱马仕丝巾的忠实拥趸。1955年，摩纳哥王妃格蕾丝·凯利用爱马仕丝巾来固定受伤骨折的胳膊，堪称史上最伟大又不经意的广告；英国女王从30岁开始偏爱爱马仕丝巾，一直戴到了90岁，可以说是最高情的客户了。这些都是爱马仕品牌魅力的最好证明。


    +   8. 每条爱马仕丝巾平均包含30-45种色彩，而每一种色彩印染后，少则需要几个小时，多则需要一周来晾干，然后才能印染第二种颜色。等到几十种色彩都染完，几个月又过去了。上色完成之后，还需要人工裁边、清洗、蒸焙、晾干，以及卷边。光是卷边这么一个小小工序，熟练的工匠每天也就只能完成六七条。


    +   9. 爱马仕的丝巾就是一块块艺术品。对于艺术家的创作，爱马仕不但不会干涉，还有预算来帮助艺术家去世界旅行。所以你会在爱马仕的丝巾上看到：美国原住民画家安东尼·查波夫(Antoine
    Tzapoff)勾画的十九世纪蒙大拿平原上高乃依族印第安人的画像，让大家勿忘历史；插画家爱丽丝·雪莉(Alice Shirley)画出的世界上最大最长的珊瑚礁群，号召人们更重视生态平衡等等。这些设计，都已经让爱马仕丝巾远远超出了简单的日用品范畴，而像是一块块艺术品。


    +   10. 爱马仕铂金包是一种硬通货。过去十几年里，爱马仕铂金包的价格平均涨幅可以达到8%以上，收益比很多股票和基金还要高。而且除了2008年金融危机以外，每一年铂金包的价格都是在增长的，表现比金融产品稳健得多。而且任何时候你想要卖出，都会有人接盘。


    +   11. 全世界最贵的包就来自于爱马仕铂金包。一个基础款的爱马仕铂金包价格在一万美元左右，平均价格是6万美元。2016年在香港佳士得的春季拍卖中，一只30厘米的白色“喜马拉雅”系列鳄鱼皮的铂金包拍出了294万的价格，是现在全世界最贵的一只包。


    +   12. 为什么即使有钱，也买不到爱马仕铂金包？爱马仕的官方解释是：“我们的包全是法国工人手工制作，光是培养工人就要几年。而且有些铂金包是鳄鱼皮或者鸵鸟皮做的，原材料相当稀少。”在关于爱马仕的一部纪录片里，曾经有这么一个细节。爱马仕的现任CEO埃克塞尔·杜马斯在参观的途中，停在了一张工作台旁边，惊喜地看着那名手工艺匠人正在处理一张齐末黄色的皮，这是来自澳大利亚的一种叫鹦鹉嘴的鳄鱼皮。他解释说：“这是我们等了两年的东西，因为只有颜色这么浅的鳄鱼皮，才能染成我们需要的淡颜色。有时候客户会预订一个这种颜色和皮质的手袋，所以他们也必须Ы要等到我们找到这样一张皮才行。”然后他又补充了一句说：“对于独一无二的东西，你是可以随定意价的。”


    +   13. 奢侈品行业的从业者都知道一个传说：全球最好的供应商都会将皮革的第一轮优先选择权给爱马仕，其他人只能挑剩下的。


    +   14. 爱马仕这家公司的独到之处就在于商业和艺术之间的完美平衡。这世界上一定还有比爱马仕更加小众、更加要求极致工艺、更加私密的品牌，但它们往往在商业上没法取得太大的成功；反过来，很多大奢侈品集团的年收入和利润都比爱马仕高，但是只有爱马仕，有那种“奢侈品中的奢侈品”的地位。在商业和艺术中取得完美的平衡，正是这个品牌最让人钦佩的地方。


