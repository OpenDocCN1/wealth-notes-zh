  md: '网、电视网、互联网)融合的产品。通过盒子，用户可以在电视上玩游戏，看新闻、股票、电影，听音乐。但实际上，这显然触动了传统广电系统的利益。


    2005年5月14日国家广电总局公布，上海文广新闻传媒集团下属的上海电视台已经正式获准开办了IP电视、手机电视。这是所谓IPTV业务的第一张牌照。所谓IPTV业务，也就是打通网络和电视媒体的综合性业务。广电总局还发布规定说：“开办以电视机为接收终端的信息网络传播视听节目集成运营服务的主体，必须是省级或省会市、计划单列市级广播电台、电视台、广播影视集团或由其设立的机构。”显然，这里根本没有盛大的事儿。


    而到了2006年4月，广电总局以一纸禁令叫停了“准IPTV”业务。通知里以上海盛大为例明确指出，凡是未获得许可证而把互联网内容搬上电视机的行为，均在被叫停之列。


    至此，推出还不到一年的“盛大盒子”正式失败了。它不仅败在战略上的冒进，败在产品上的幼稚，也败给了中国特色的“牌照”与“监管”。到这一天，陈天桥在这个计划上已经投入了接近10亿美元。


    自此，盛大开始进入了一个不温不火的发展时期。虽然在游戏和文娱产业上仍然一直增长，但对于陈天桥来说，30岁就达到人生巅峰的他可以说是壮志未酬。然而等待他的，还有一个人一生更大的考验，这个考验也让陈天桥的人生再有了一个巨大的转折。关于这段故事，我们下期再讲。


