  md: '# 阿里｜大战eBay给淘宝带来了什么


    昨天我们回顾了阿里巴巴从创立到成立淘宝网之前的过程，今天我们当然要进入马云最核心的这一段创业历程，也是奠定了阿里江湖地位的一段历程——2003年淘宝网的创立，以及之后三年与eBay的大战。


    同样，关于淘宝网的成立，网上的资料简直到太多了。在这里请允许我跳过对这段历史故事的重複，而把更多的篇幅用在对这段历史的解读上。如果有不太熟悉这段历史的同学，可以找些补充资料看看。


    当然，在做解读之前，我们可以迅速地明确一下淘宝与eBay大战的时间线作为参考：


    2002年3月，eBay收购中国的C2C平台易趣33%的股份，马云确立了自己的对手。阿里巴巴投放了1亿资金推广淘宝，而eBay和各大门户网站签署协议，规定它们不能接受同类电商网站的广告。之后，淘宝的推广经历了三个阶段：1）依靠口碑传播；2）针对通过底层信业务为生的中小型网站和个人网站进行了大规模推广，这个战略就像是“农村包围城市”；3）从2003年年底到2004年年初，和搜狐以及MSN建立联盟合作伙伴关系。


    2003年6月，eBay以1.5亿美元收购了易趣剩下的67%的股份。这次收购也成就了中国互联网的另一个传奇人物，邵亦波，这个人我们有机事情再讲。


    2004年2月，阿里完成了第四轮8200万美元的融资。淘宝启动了所谓的“三年免费战略”，这使得大量eBay的用户向淘宝转移。


    2005年10月，马云追加投资淘宝10亿，承诺继续免费三年。淘宝占据了中国C2C市场70%的份额，与eBay的大战结束。


    2006年12月20日，eBay宣布与TOM网组建合资公司，放弃中国C2C市场。


    这次著名的战争里面，有很多值得注意的东西，下面我们就来说一说。


    # 1. 生态系统


    在当时更像是一种“防守策略”的淘宝网，今天恰恰变成了阿里最主要也是最赚钱的业务，而且一个淘宝网还引出了一系列的公司，不管是天猫，还是支付宝，还是后来的蚂蚁金服和菜鸟集团等等等等，都是依托于淘宝这个全国崭新的C2C平台发展起来的。


    # 2. 关键人物——孙正义


    # 3. “农村包围城市”战略


    # 4. 设置秘密级别


    # 5. 开启免费时代


    > 在当时的观察者们看来，淘宝和eBay的竞争就好像大卫和歌利亚之间的战争。这是一个媒体最喜欢的故事：双方力量极度不对称，但是弱小者竟然取得了最终胜利。


    马云自己使用了另外一种表达。他用了一个比喻，他说：“eBay是海里的一条鲨鱼，可我就是扬子江里的鳄鱼。如果我们在海里交战，我会输，但如果我们在江里对峙，我稳赢。”'
