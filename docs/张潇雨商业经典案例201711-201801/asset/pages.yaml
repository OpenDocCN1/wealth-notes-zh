  md: '# 阿里｜业务、财务宏观纵览


    阿里｜业务、财务宏观纵览


    上周我们结束了关于创业的一个小专题；接下来我们要进入一个新的专题了，那就是中国公司系列专题。


    在接下来的几周时间里，我们会集中讲一些在中国诞生、成长、发展壮大的公司，也讲一讲我们国家的经典案例。希望这个系列除了熟悉感之外，也能给大家带来一些新意。


    作为这个系列的开篇，我们当然要从如今中国社会影响最大的公司讲起，所以这周我们的主题是阿里巴巴。


    阿里这家公司相信你已经非常熟悉了，包括他的创始人马云，相信很多“得到”用户可能比我还要懂得多。所以，我想了我很久到底要怎么写这家公司——毕竟它如今已经是价值4000亿美元的巨头，业务也涵盖了我们生活的方方面面，接近20年的创业历史也反复被人们解读、分析、传颂……所以想要面俱到，还要写得好准确实在很难。说实话，为此我也颇为头疼了一阵。


    最终，在经过很久的思考之后，我决定化繁为简。面对非常复杂的一个东西，可能最好的呈现它的笔法就是朴实。所以，接下来关于阿里的一系列文章，我的主要思路一句话就可以概括：我不打算全面地解读这家公司——可能这也是谁都做不到的——而是为你提供了理解这家公司可以使用的线索、框架和切入角度。换句话说，我们接下来一系列的文章像是一个“索引”或是“目录”，可能每一篇都还可以无限延伸，但有了这个框架，你对这家巨无覇似的公司的理解起码不会偏差太大。这就是我接下来想达到的一个小小的目标。


    为了这个目标，我们会利用这样一些材料解读阿里：


    首先是阿里在美国上市的年报，我会带领大家纵览一下阿里目前的整个业务模块和各自的表现。这会对你理解这家公司有一个最宏观也最直接的把握。


    其次，我会参考一本非常重要的书，书名叫做《穿布鞋的马云：决定阿里巴巴生死的27个节点》。在阅读了几十万字阿里的材料之后，我发现这本书的整体精神非常像是我们-nov要完成的任务——宏观性、框架性地把握阿里。而且非常巧，这本书的作者之一也是“得到”用户非常熟悉的《李翔知识内参》的主编李翔老师。相信大家都知道他也是马云本人非常信任的记者，所以这本书的信息应该是非常准确的。这本书还有另外两名作者，一位是《赢在中国》的前制片人王利芬女士，现在是优米网的创始人和CEO；还有一名作者是阿里的内部人士，也就是阿里巴巴集团的副总裁，政策研究室的主任高红冰。有这三位作者坐镇，对阿里这家公司的梳理也不会出现大的偏差。


    当然，除此之外我还会根据各种公开和半公开的资料，来提供理解阿里的另外一些角度。比如非…常低调的二号人物蔡崇信的故事、比如当年闹得沸沸扬扬的支付宝VIE事件、比如大家已经非常熟悉的“双十一”购物节等等，这些在这一两周我们都会讲到。


    就像我们之前所说的，希望这一系列下来，你能对阿里有一些更清晰、更结构化的认知。


    现在我们就开始吧，今天我们的任务是，看一看阿里的年报。


    首先我们来说个相关的小概念，就是“财年”，也就是“财务年度”的简称。所谓的财务年度就是每个公司统计自己各种业务数据和财务数据的一个完整年度，很多公司的财务年度和自然年度是一致的，也就是1-12月，但也有很多公司的财年和自然年并不完全重合。阿里恰恰就是一个不重合的例子，它的财年开始时间是每年的4月，也就是每年4月1日到第二年的3月31日是阿里巴巴集团一个完整的财务年度。


    至于为什么要这么做，当然有很多不同层面的原因，不过一般零售商包括电商的一个特点是，下半年是旺季，尤其是11月、12月、1月，是大家购物花费最大的时候，为了把这几个月打包在一起，阿里采取了从4月1日计算财年的做法。这只是一个技术细节。今天我们讲的数据，都是截止到2017年3月31日的。


    # ｜阿里的主要业务模块


    阿里巴巴集团目前把自己的业务划分成了四大模块，分别是核心电商、云计算、数字媒体和娱乐以及创新和其他。


    # 模块一：核心电商（Core Commerce）


    这里面又包括四个小部分：


    +   1. 中国商业零售（China Commerce Retail）：里面有大家很熟悉的淘宝、天猫、聚划算，还有农村淘宝、阿里妈妈、菜鸟国际等等；

    2. 中国商业批发（China Commerce Wholesale）：这里面就是曾经在香港上市的B2B业务，也叫1688.com；

    3. 国际商业零售（International Commerce Retail）：这里面包含两个模块，一个是AliExpress，中文是“全球速卖通”。这个业务是2010年4月上线的，简单说来就是“国际版淘宝”；另一块业务是Lazada，这块业务是阿里在2016年4月收购的。当初它们以10亿美元左右的估值收购了54%的Lazada这个东南亚电商。Lazada的业务覆盖了印尼、马来西亚、菲律宾、新加坡、泰国、越南等等地方，现在已经是阿里的全资子公司了。；

    4. 国际商业批发（International Commerce Wholesale）：它对应的就是在国际范围内的B2B业务。


    所以，所谓“核心商务”也不难理解，就是“国内+国际”，以及“零售+批发”的一个2x2的矩阵。这也构成了阿里最核心的业务所在。


    # 模块二：云计算（Cloud Computing）业务


    相信读过我们亚马逊专题的同学都应该对亚马逊的AWS云服务非常熟悉了，如果说AWS是中国之外全世界最成功也最大的云服务，那么它最强劲的对手就是阿里云了。


    熟悉马云演讲的同学可能知道，马云这几年一直在强调所谓的“DT”，也就是data technology，数据技术。其中重要的一环依托的就是阿里云。


    # 模块三：“数字媒体和娱乐”（Digital Media Entertainment）


    大家更熟悉的叫法可能是阿里的“大文娱”。这个模块里包括了优酷土豆、UC、阿里体育、阿里音乐和天猫TV这些业务。


    # 模块四：“创新和其他”


    从名字就知道这里包含的是公司的一些新业务和尝试验性的业务，包括高德地图、阿里的云OS，钉钉企业服务软件都被归在这里一类。


    这四大模块和十几个业务，就构成了目前阿里的整个版图。


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_11_0.png)


    # ｜阿里的主要财务数据


    在2017年财务年度，阿里集团整体的总收入是1582.73亿元人民币，比上一年增长了56%；2017财年调整后净利润为578.71亿元人民币。


    在这1582.73亿的总收入里，核心电商业务收入是1338.80亿，占比84.6%；阿里云收入是66.63亿元人民币，占比4.2%；数字媒体和娱乐业务的收入是147.33亿，占比9.3%；而创新类业务收入接近30个亿，占比不到2%。


    另外，还有一组有趣的业务相关数据值得你知道一下：阿里目前中国零售平台的年度活跃买家有4.54亿，也就是说，大约1/3的中国人每年都在阿里的各个零售平台上购物；另外，阿里移动端月度的活跃用户高达5.07亿，带来的交易额占到了整体交易额的80%，说明现在大家购物的主要行为模式都迁移到了手机上。以及，2017财年阿里巴巴集团平台成交额达到了3.77万亿元人民币。这意味着什么呢？如果拿沃尔玛来比较一下的话，沃尔玛2017财年的交易额是4969亿美元，按照6.6的汇率计算大概是3.28万亿人民币，所以可以说，在2016-2017年，阿里已经超过了沃尔玛，成为全球第一的零售集团。'
