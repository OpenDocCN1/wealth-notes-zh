    # YC | 如何看懂投资意向书（中）


    创业者和投资人关系的核心，我的理解，是创业公司控制权的分配问题。投资人的控制权，体现为优先清算权、股份分期授予、股份回购、反稀释权、优先购买权、投票权（否决权）、知情权、对赌协议等方面；创始人控制权则表示在投票权设计（表决权与经济权分离）、投票委托权、一致行动人协议等方面。双方合作的原则，是基于最坏的情况，争取最好的结果。因此，投资人和创业者的信任是相互约束条件下的信任，而约束下的信任，才是真正的信任。同理，监督下的自由，才是真正的自由。


    # YC | 如何看懂投资意向书（上）


    我觉得投资人和创业者的关系，可以用男女朋友结交交往，直至步入婚姻的关系状态来理解。首先彼此坦诚，相互欣赏、匹配和认可，有着共同的目标和方向，携手共进，签订投资意向书就如同步入婚姻，发展的过程中继续彼此理解、支持、包容、相互促进和共进，建设美好事业（共建美好家园）。


