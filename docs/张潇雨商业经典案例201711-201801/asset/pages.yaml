  md: '# Facebook | 扎克伯格 2.0：从企业家到战略家


    Facebook | 扎克伯格：从…


    今天我们来讲讲扎克伯格1.0到扎克伯格2.0的进化。


    如果说beta版的扎克伯格是一个缺陷很多的天才工程师和初出茅庐的创业者，1.0版本的扎克伯格是一个走向成熟的企业家的话，那么2.0版本的扎克伯格就是一个合纵连横的顶级战略家了。


    在大慨2010年至2014年这个阶段，扎克伯格带领Facebook做出了一系列非常重大而且正确的决策，也赢得了几场关键的战役。在这个过程中，扎克伯格也完成了自己的又一次进化。


    # ｜打败Google+


    一个很好的例子应该是Facebook战胜Google+的故事。比较年轻的同学可能都已经忘了Google+是什么了，但这恰恰证明了Facebook的成功。


    在社交网络的时代，Google作为搜索引擎好像显得有些落后了。在纠结和计划了很长时间之后，2011年6月，Google推出了一个明显山寨Facebook的产品——Google+，也就是Google自己的社交网站。


    另外，Google充分地利用了自己旗下的各种资源，把Gmail邮箱、Youtube视频、谷歌照片等等一系列应用全部整合了进来，打通了自己产品的底层，让用户能以一个在线身份在互联网上存在。


    想一想，这其实和Facebook把自己当成互联网上的“身份证”，用自己来连通一切的思路非常相似。所以，Google+极大地威胁到了Facebook的生存。


    而且Google+本身的产品做得也不错，并且相比于Facebook还有一个优点：没有广告。因为Google可以用自己的搜索的收入来补贴社交业务，所以完全不怕亏钱。但是广告业务可是Facebook的命脉。


    我们在商业史里已经见过无数类似的案例了：沃尔玛降低价进入玩具市场，打赢只有玩具这个单一品类的零售商；亚马逊在初期并不在乎Kindle的利润或者电子书是不是过于便宜，因为它零售的现金流太好了；微软也用Windows捆绑IE浏览器的方式彻底击溃了网景浏览器。这一次，Google准备故技重施。


    扎克伯格这时候做了什么呢？他宣布公司进入“禁闭”状态一所谓的禁闭状态是Facebook早年间的一种文化。当公司面临巨大的竞争性威胁或者技术性威胁的时候，扎克伯格就会要求所有员工不得离开大楼，然后他会发表讲话。


    年轻的创业公司这么搞倒是很有特色，但2011年，Facebook的员工已经超过了1万人，再过一年就要上市了。但扎克伯格仍然这么做了。


    宣布完“禁闭”状态之后，他站在一个主管的办公室上，发布了一次叩兴演讲。


    扎克伯格说，现在市场变成了一场刺刀见红的零和游戏，世界好像正在进行一场Facebook对决Google的大型真人实验，最终只会有 一个赢家，不是Google失败，就是Facebook灭亡。所以，整个公司都要变成战备状态。


    所有的Facebook工程师、设计师和产品经理都围在扎克伯格身边聚精会神地听着他的演讲，就像是将军在战场上对自己的部下进行训话。


    演讲的最后，扎克伯格说：“知道吗，有一位我很喜欢的罗马演说家每次演讲都会用‘迦太基必须被消灭’作为结束。不知怎么的我现在也想到了这句话。”


    熟悉古罗马与迦太基这段战争史的同学应该知道，扎克伯格说到的那位演说家是老加图（Cato the Elder），一个著名的罗马元老院议员以及迦太基人的抨击者。据说他每次演讲结束都要说那句话，无论演讲的主题是什么。


    在这个时刻，一次讨谏教导的大会已经变成了一次群情激昂的军事动员，一个曾经穿着阿迪达斯鞋到处晃晃的耶鲁大学生，已经变成了可以鼓舞三军的真正将军。


    演讲在雷鸣般的欢呼和鼓掌声中结束，此时，Facebook的每个人都已经摩拳擦掌做好了战斗的准备。最终，这场战斗得以Facebook的完胜而告终。


    在这个阶段，Facebook也有一些产品上的巨大突破。最重要的应该是2012年1月宣布的“Open Graph”（开放图谱）计划。


    这个计划是用来干什么的呢？它可以让各个第三方和Facebook连接，在Facebook上开发应用，实现自己的产品和Facebook的打通。这一步骤，和微信开通公众号、服务号和小程序的思路一模一样，利用微信作为底层的蕴基础设施，然后连接各种业务和服务，形成一个生态。


    顺便提一句，微信公众号的正式推出正好是2012年的8月，只比Facebook的Open Graph晚了半年。


    # ｜影响Facebook未来的两次重大收购


    当然，在这个阶段，真正标志着扎克伯格从成熟CEO到顶级战略家的蜕变的，毫无疑问就是那两次著名的收购：10亿美金收购 Instagram 和 190 亿美金收购
    WhatsApp。


    +   1. 收购Instagram


    2012年4月10号，Facebook宣布以3亿美金加上当时价值7亿美金的Facebook股票收购图片社交应用Instagram，震惊了整个互联网界。


    一方面，当时的Instagram上线还不到20个月，员工只有16个人，收入基本是零；


    另一方面，之前的 一个礼拜，Instagram才刚刚完成5000万美元的第二轮融资，估值是5亿美金。这笔投资用了一周时间就翻了一倍。


    当时很多人都非常不看好这笔交易，觉得扎克伯格实在太嫩，根本不懂得怎么谈价格。


    最关键的，是这笔交易达成的速度。在4月5号的时候，扎克伯格打定主意要收购Instagram了，他给Instagram的CEO凯文·希斯特罗姆(Kevin Systrom)打了一个电话，说“我想收购你们”。


    当时的希斯特罗姆其实面临三个选择：第一个选择，当时红杉资本刚刚给了他们一个5000万美元的投资意向书，估值是5亿美元；第二个选择，Twitter的创始人杰克·多西（Jack
    Dorsey）想要以同样的价格收购他们；第三个选择就是扎克伯格的电话了。


    换句话说，无论哪个结局，对希斯特罗姆和他的团队来说都不算差，而他想自己把公司做大，于是拿了红杉的投资，回绝了Twitter和扎克伯格。


    事情到这里，无论如何都应该是结局了，但是扎克伯格根本不打算放弃。他第二天就直接约见希斯特罗姆，告诉他说“我是非常非常认真的”。于是，希斯特罗姆就好开车去扎克伯格的家里和他聊聊。


    见面之后，扎克伯格就开出了一个没法拒绝的价格，10亿美金。一个在大多数人看来都非常不可思议的价格。然后，这两个不到30岁的年轻人在家中聊了两天，敲定了所有细节，包括Instagram会继续保持独立运作，不会成为Facebook大产品策略的牺牲品。


    这时候，距离希斯特罗姆拒绝Twitter刚过了4天。


    而在Facebook这一边，决策是怎么做出来的呢？


    几天之前，扎克伯格告诉Facebook的董事会说，他想收购Instagram。后来有人回忆说，扎克伯格的意思是“告知”，而不是“征求意见”。


    想象一下，一般的公司要发起一个十亿美金级别的收购都是什么样的？董事会要反复研究讨论，双方要雇大量的律师、银行家和会计师来各种谈判，最后耗费几个月的时间搞定。但是扎克伯格只用了三天，外加两个人——他自己和Instagram的CEO。


    到现在，已经没有任何人质疑这笔收购了，或者说，这应该是扎克伯格最漂亮的战略决策之一。Instagram如今即使独立出来，可能也要值六五百亿美金不止，而'
