  md: '# 腾讯 | 从巨型怪兽到合作伙伴的关键转折


    上期专栏我们提到了周鸿祎和他的创业史。在他来到奇虎之后，一开始设想的业务和推出的产品都是失败的，但是很快，他就找到了新的发力点。


    说来可能也有点让人感慨。后来让360发展壮大的安全软件，最开始针 Threshold 的其实就是周鸿祎当初做3721的时候自己发展出来的业务模式。


    当时3721想出了一个“插件模式”，可以安装在浏览器里，使用非常方便。但同时，它也很難被卸载，而且时不时就蹦出一些广告来。


    结果，这种模式在其他人的模仿中愈演愈烈，变本加厉。几乎所有互联网公司都开始不经用户同意，强制在电脑中安装各种软件和插件，然后劫持流量，乱弹广告，同时还几乎无法删除。甚至有些还会窃取文件。后来人们给这种软件起了一个名字，叫做“流氓软件”。


    当时几乎所有电脑用户都受过“流氓软件”的危害，而周鸿祎慢慢在大众那里变成 了“流氓软件之父”。


    # I 大战一触即发


    就在中秋节过后的9月27日，360突然发布了一个直接针对QQ的“360隐私保护器”，同时在360网站上设立了一个《用户隐私大过天》的专题网页，里面有大量针对性的文章，标题都是这样的风格：《QQ窥探用户隐私由来已久》《QQ侵犯用户隐私》《请慎重选择QQ》等。然后，在揭露和谴责了QQ所谓窥探用户隐私的行为之后，360宣布这个“360隐私保护器”将能实时监测曝光QQ的行为。


    就像我们之前所说，由于那个时候的腾讯的确是中国互联网界的一个大怪兽，而周鸿祎恰恰利用了这种社会氛围，把这场战争一上来就定义成了“草根创业者对垄断巨头的反抗”，加上他非常懂得利用舆论以及传播规律，所以这次宣言在当时真的造成了很大反响，也引起了公众很多的讨论甚至支持。


    而腾讯当时也做出了一些回应。不过现在看来，比起周鸿祎和360完全不按常理出牌，准备非常充分甚至可以说“蓄谋已久”的攻击，腾讯的回应实在是太常规了。


    首先它们在QQ上面“弹窗”回应说：腾讯QQ软件绝对没有窥探用户隐私的行为，也绝对不涉及任何用户隐私的泄露。


    同时，法务部门开始起诉360不正当竞争，要求奇虎及其关联公司停止侵权、公开道歉并赔偿损失。


    另外，腾讯还联合金山、百度、傲游、可牛等五大企业发布了一个《反对360不正当竞争的联合声明》，里面说：“这家企业热衷的不是保护用户安全，而是打着‘安全’的幌子，通过对用户实施‘安全恐吓’和‘安全欺诈’，以诱导安装自己的软件，获取不正当商业利益。”


    但是这些举动，全部被周鸿祎当做了“腾讯在行业里以大欺小”的又一个证明。


    周鸿祎先发微博说：各界对腾讯提出的质疑，腾讯一直回避。这时候起诉360，除了打击报复之外，不排除是为了转移视线，回避各界质疑。然后他又写道：360免费杀毒颠覆了传统收费杀毒，所以遭到了全行业的嫉恨。360宣称向一切灰色利益和潜规则宣战。不怕得罪任何厂商，哪怕是中国最大和第二大的互联网巨头。


    我认为，对大公司的监督、质疑和反抗，一直是小公司和公众都应该注重视的事。360这次攻击在一定程度上的确是起到了这样的作用，但它利用的一些手法实在让人难以认同。


    比如它曾以弹窗的方式曝光所谓“马化腾享受深圳市的经济适用房补贴”，还以网友的名义创作了一首《幼儿不能太马化腾》的口水歌。


    不过这里，360明显犯了一个事实错误，混淆了“经济适用房补贴”和“高层次专业人才住房补贴”的区别。而这种人身攻击的手段也是非常突破下限的。


    但那个时候的腾讯，的确是众矢之的。大多数民众都是以看热闹的心态来观察这次“3Q大战”的。而腾讯相对温文尔雅的风格也对周鸿祎这种胡搅蛮缠的非常规手段非常不适应，所以事情一度愈演愈烈。


    而腾讯没想到，周鸿祎还有杀手锏在后面。


    2010年的10月29号，正是马化腾39岁的生日。结果在这一天，周鸿祎送出了一份“大礼”：360宣布推出一款叫做“扣扣保镖”的新工具，宣称能“全面保护QQ用户的安
    全”，能自动对QQ进行“体检”，扫描之后用户可以点击“修复”。


    周鸿祎还说：“扣扣保镖”的推出给用户创造了价值，既然QQ这个工具不可取代，那为什么我不做一个陪伴性的产品，让QQ用户感受更好呢？这样用户会更喜欢360，腾讯就不能把我赶走了。”


    结果，腾讯和金山的技术团队同时发现这个“扣扣保镖”有两个极其可怕的后门：


    +   第一，当用户在选择点击“修复”之后，将被进行系统重置。然后QQ安全中心会被360安全卫士替换；

    第二，QQ用户的好友关系链被360直接备份，所有的用户关系被导入到360的操作平台上。


    吴晓波老师的《腾讯传》里是这么记录这段历史的：当马化腾聆听张东等人的汇报后，脸色惨白，呆坐在桌前，喃喃自语说：“怎么也没有想到，周鸿祎会做这种事。”


    腾讯因团队迅速向深圳市公安局报案，同时向工信部投诉，并且把“扣扣保镖”定义成“全球互联网罕见的公然大规模的数据级客户端软件劫持事件”。


    结果，公安局和工信部也完全没处理这种事的经验，时间一分一秒就这么过去。才过了三天，“扣扣保镖”就已经留下了2000万QQ用户。而当时360已经开始诱导用户生成图片分享，假设每个QQ用户有40个好友，那2000万用户就有可能扩散到几亿个，形势已经非常危险了。


    到了6天后的11月3日上午，马化腾做出决定，在装有360软件的电脑上停止运行QQ软件。


    于是，那天晚上的6点19分，腾讯以弹出新 闻的方式，发表了那封可以说改变了中国互联网历史的《致广大QQ用户的一封信》，它的开头是这么写的：


    > 亲爱的QQ用户：


    当您看到这封信的时候，我们刚刚做出了一个非常艰难的决定。在360公司停止对QQ进行外挂侵犯和恶意诋毁之前，我们决定将在安装有360软件的电脑上停止运行QQ软件。我们深知这样会给您造成一定的不便，我们诚恳向您致歉。同时也把做出这一决定的原因写在下面，盼望得到您的理解和支持。'
