    # Facebook | 五大刻时代意义（上）


    看了今天老师总结的Facebook的3个意义，觉得Facebook和腾讯两个社交领域的巨无霸，在这3个方面非常相似。1.产品开发方面，Facebook定义了“小步快跑、快速迭代”这种互联网产品开发模式……'
