  md: '第年轻就开始创业，为人低调，都是程序员。跟传统印象中的企业领导形象格格不入。3.对投资界的影响也类似。投资要当时候也不知道腾讯的QQ这样的产品能不能赚钱，有什么盈利模式，最后甚至香港盈科等把手中的股份卖掉，直到最后MIH出现。也是给投资界上了一堂重要的课。


    满雨老师周一好！经由你的解析，确实让我更清晰地看到了Facebook和马克·扎克伯格对这个时代的巨大影响力和非凡价值。三点中我很赞同定义了方法论MVP和重塑投资界的投资信念的说法，至于第二点重新定义和树立了这个时代的商业领袖形象，如果是从“努力也一样可以成功”的角度，我是赞成的，而如果是从年纪很轻这个维度去定义，我觉得偏颇了，有点简单归因。首先，放眼当下的风云商界领袖，马化腾、马云、刘强东、王兴、罗胖......他们应该都不是仅仅三十岁出头而已吧；其次，任何人与事务的成长发展与壮大，必然需要“天时地利人和”的条件，也就是需要一定的环境、土壤和支撑条件等，国内和国外本就有一个“经济发展状态差值”，这个大背景就极大可能导致“不同”，不是一样有很多“嘲丧”过于年轻创业的事例和言论吗？再有，我依然很推崇《百岁人生》那本书，也很赞同“青春是一种状态，而不仅仅是年龄数字”的说法，创业也是同理吧。可能由于自己也是“高龄”在腾讯的状态，或许许多少有点给自己找支撑理论的嫌疑。这些仅作为交流交换看法。


    扎克伯格做Facebook初始阶段依赖于热情。但公司上市且市值增长5倍，这依赖于对于主营业务相关行业整体的投资，收购和投资已是独角兽公司的王主业务。阿里系和腾讯系亦是如此，不是怕错失投资独角兽的机会，而是避免一个独角兽发展起来颐覆自己，而且可怕的是和自己没有任何投资的关系。当滴滴和快车疯狂价格战时，背后还是腾讯和阿里对于一个市场的争夺，近乎每个当下热门的市场都会有这种争夺且会持续下去。当你买腾讯和阿里的股票时，不仅仅买了这一家公司，而是腾讯系阿里系，背后几十家上百家公司的整合体，比单纯投资一家企业安全得多。


    [1] 记得在读博期间，曾听过讲科史和哲学的老师说过：“你们写文章，动不动就是三点或者四点，然后排比用词合敲抑韵。但你们有没有思考过为什么一定是三点或者是四点，这几点观点的提取完备吗？逻辑自洽吗？这些观点能不能多一点？能不能少一点？”应该说，提出观点做刻严谨是个不小的挑战，略显糊弄其实也并没有人深究。但是如果给自己更高的要求，认真去提炼和整理，将一定会有更多的收获和提升。[2]
    Facebook的榜样价值是这个时代最吸引人和最耀眼的。与以往刻意制造一个榜样不同，这个活生生的年轻CEO从工作风格到年度计划，甚至是穿衣打扮和家庭生活，都是一个很好的模板。这个模板并不是处处最优，但他体现着这个群体的精神状态，是真正的榜样，更是鲜活的榜样。


    # Facebook | 五大划时代意义（下）


    Facebook就像从山顶滚落下的雪球，随着雪球越来越大，它压平了崎岖的道路，也将路边的小花小草一扫而光。互联网上开放和封闭的斗争从未停止过，最终选择的权力在每位用户手中。得到在这一点上表现得就很开放（甚至公司例会都会向用户公开），其实腾讯、Facebook这些公司完全可以将其与外部的联系做成一个付费通道，不过对于这样量级的媒体平台，能够自由掌控信息可能更加性命攸关吧！


