  md: '# Facebook | 扎克伯格的豪华导师团


    Facebook | 扎克伯格的豪…


    这是我们Facebook专题的最后一篇文章。


    在这两周的专栏里，我们都在以非常宏观的视角来看Facebook和扎克伯格这个人。在写文章的时候我经常会想，同ске们会不会觉得，Facebook和扎克伯格确实非常厉害，有划时代的意义和影响力，但我能从中学到什么呢？这件事和我的关系是什么呢？其实连我自己也会琢磨这个问题。


    所以，今天我们就说一件小事。也算是对我们这两周内容的一个补充和总结。那就是扎克伯格的“导师团”。


    曾经被问到如何评价Facebook的时候，我引用了《快公司》这本杂志的一个标题，我说：Facebook是“真正的独角兽”。什么意思呢？


    # I 扎克伯格的豪华导师团


    我们之前在讲到扎克伯格进化史的时候也提到过这件事—扎克伯格之所以能第一次创业就如此成功，很重要的一点是他太善于在对的时间结交对的人，然后从他们身上学习自己最需要的东西了。


    肖恩·帕克'
  merge: -1
  img_proc: true
- pgno: 182
  md: '时也加入了“捐赠誓言”。


    其实这就是我想说的：每个人都不可能生来就是完美的。哪怕像扎克伯格这样的天才，也需要很多很多好的老师来一路帮助他，否则光靠他自己的话，世界上早就没有Facebook这样一家公司了。


    好老师的作用是巨大的，我觉得这是我们每个人都可以去学习和实践的一件事。


    # I 找导师的四点经验


    最后我想简单说一说，我自己看过扎克伯格找导师的经历之后，有哪些是我们Lay可以学习借鉴的。一共有四点：


    +   1. 试着把自己变得对他人有用。


    我觉得这是我们常常容易忽视的一件事。虽然我们往往需要向别人请教，但这不意味着我们对对方就没有帮助。


    当初对于初出茅庐的大学生扎克伯格来说，《华盛顿邮报》的CEO唐纳德·格拉姆比他在各方面可能有经验多了。但扎克伯格有一件事是一定超过格拉姆的，那就是他一定更懂什么叫社交网络。


    所以在那个时期，扎克伯格在请教格拉姆之余，也经常花时间给他讲解社交网络的各种相关知识。往往只有这样，导师和被辅导人的关系才是更加牢固的。


    所以在你向他人请教或者求助的时候，可以先想一想，你自己对别人可能有什么帮助呢？


    +   2. 把问题问对。


    这一点应该是我的个人的一点经验总结。在平时我也经常遇到各种别人问我问题的时候，在这个过程中我发现出现最多的情况就是，来问我的问题实在太大了，很难回答。


    比如我经常收到的问题有：老师你觉得我应该出国留学么？或者是，老师你说Facebook和腾讯未来是不是必有一战，有的话谁能赢？或者类似于，老师我现在打算创业，你觉得我应该怎么招人？


    实际上，这每一个问题都太大了，可能每个都需要写篇论文才能说清楚。我觉得向他人请教的时候一定要把问题问得具体，把背景信息提供清楚，并且很重要是，一定显示出你已经对这个问题有过研究和思考了，而不是什么都没想过，直接就来问。


    想象一下，扎克伯格要是跑去问巴菲特，你觉得Facebook上市之后我应该注意什么？我估计巴菲特也得崩溃。更好的一个问题可能是这样的：Facebook上市意味着我要外部投资人股东了，作为一个CEO我应该多大程度在意他们的想法，我应不应该每年也写一封股东信呢？


    +   3. 形成一个固定的设置。


    这一点其实是我在讲“找导师”这件事情上非常想强调的一点。我觉得如果你确实想向别人学习，那么就不应该想起一件事来就跑去问一问，平时则没有什么联系。


    我觉得某种固定的设置是非常重要的，比如你们可以约定，每两周就固定见一次，聊一个小时左右，探讨一些之前双方已经划定好的问题，顺便还可以回顾一下之前留下的问题。


    在这里，定期、定时、固定的话题都是非常有意义的。这能给双方一种稳定感，并且对对方都有一种比较合理的期待。甚至就像我刚才提到的，如果一个德高望重的前辈很难配合你，你同样也可以找两三个好朋友，形成某种程度的“私董会”，相互给一些意见和建议，在生活中相互支持，这样也是很好的。


    +   4. 要记得展现你的成长，多给对方反馈。


    想象一下，作为一个导师，最乐于见到的就是自己辅导的人有进步了。所以在这个过程中，一定要记得多进行反馈。


    我举一个非常非常简单的例子。都不用说导师，就说“推荐餐厅”这件事。因为我在北京比较多，所以很多朋友来北京的时候，经常会问我，北京哪里吃饭比较好。这时候我当然会给出我的推荐。


    后来我发现，我有一个朋友每次在我推荐之后都会给我反馈，比如他会说：昨天你推荐的那个餐厅我去了，烤鸭确实很好吃，服务也很好，我朋友很满意。而且他们最近出了新菜，你有时间也可以去试试——你看，简单的这么一段回复，就远远超出了大部分朋友推荐完之后完全没有任何回信的情况。你想，我会不会下一次更加愿意给这个朋友推荐餐厅呢？对于导师和学生之间的关系，其实也是这样。


    张潇雨


    这就是我们Facebook的最后一期内容。希望你读完我们这一期内容之后，能从扎克伯格身上学会一些东西，并且应用在自己的生活上。不积跬步，无以至千里，伟大的CEO也不是一蹴而就的。重要的是不断向前。今天，你就可以把你从扎克伯格身上学到的东西记下来，写在留言区跟大家分享，我们明天周末互动见。


