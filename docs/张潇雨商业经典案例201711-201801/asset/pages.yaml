  md: '人。前有导师格拉姆的指点，后有贵人桑德伯格的辅佐，对于扎克伯格这样心中有大格局的人来说，占尽天时地利人和，Facebook的事业自然如日中天。


    扎克伯格从企业主到企业家的蜕变，印证了“格局决定结局，境界决定高度”并不是一句鸡汤。


    每个人的成功都不一样，我觉得不可以模仿。但是可以从成功者身上总结出可以学习的经验，其实就离成功很近了！听张老师的课我学习到的：1.选人比培养人更重要，找到真正可以一起的人和团队，是成功的加速器！2.做自己擅长的，把不擅长的交给擅长的人去做！要站在巨人的肩膀上攀爬，要有效利用他人完成任务。3.不忘初心！


    老师，看到这里我觉得扎克伯格与其他企业家不同的地方在于，他真的是喜欢他所做的事情，而不仅仅是为了商业利益，可能他赚钱的目的只是为了做更多可以改变世界的事吧。我记得我看过一本书，有句话我到现在还没有忘记，说中国的土壤只会生出史玉柱这类的人才，而美国的土壤也只会生出乔布斯这类的人才，没有好坏高下之分，但我们的企业家更务实，这也是不争的事实。任何塔尖的企业家都是时代的产物，扎克伯格也是如此。我只能说他的确出众，足够优秀，但也足够幸运，天时地利人和，他占齐了，阶段性的成功是必然的，但下一个时代的到来，是否还有他的一席之地也未曾可知啊。


    # Facebook | 扎克伯格2.0：从企业家到战略家


    这一课给我印象最深刻的是扎克伯格站在桌子上动员三军的演讲，一个卓越的领导必然有这样的内在力量，以必胜的信念鼓舞召唤下属，两军交战勇者胜。在低调和谦卑的外表下面，扎克伯格有着抵挡不住的气场和强大，再加上卓越的洞察力和利他的心态，这为他日后进行的两次重要收购奠定了基础。无论是内部员工还是收购对象，面对他可能会油然而出一种尊敬和欣赏吧。我们在生活中也要有这种必胜的信念，并且积累自己在他人眼中的专业度，就会有真正的影响力。查理·芒格说过在重要投资面前，一旦判断是好的机会，就要果断出手。同样我们在生活里也要积累自己的洞察力和见识，寻找这样的机会，果断行动。区别扎克伯格和其他的企业家的关键所在，的确是他难得的利他之心和心怀众生。稻盛和夫先生也有他这样的心态，但是他在人生已经比较成熟的时期才达到这样的境界，而扎克伯格在如此年轻的时候就已经浑然天成地到了这里。以前有传言说他会竞选美国总统，我现在很希望这个传言会成真，这个世界目前需要更多的扎克伯格这样的企业家来做出努力改变世界！


    关于打败Google+，收购Instagram和WhatsApp，这个分析应该很多了。我就今天看到的扎克伯格在这几件事情当中的表现，谈谈给自己的启发。第一个是面对和巨头的竞争，毫不畏惧，懂得采用非常手段动员大家作战，领袖气质就是在一场一场的硬仗当中锻炼出来的。当时Facebook主要优势是在PC端，2011年，也就是微信推出来的那一年，移动互联网风起云涌，Facebook如果不在移动互联网上发力，结果很有可能不是现在这个样子。创业就是跳下悬崖，然后在落地前组装好一架飞机，如果Facebook没有收购Instagram和WhatsApp，我估计已经坠下悬崖，摔得很惨了。所以我们也不得不佩服扎克伯格的远见卓识，看准了就下重注，义无反顾。扎克伯格在关键时候的决断力确实非常强，值得学习。


    扎克伯格进化的速度确实惊人，我想不是他天生如何。他是天才这个大家都知道，但那是针对他的智力水平，然而管理一家犹如巨型航母的公司却不仅仅是智力问题。从找到桑德伯格，到收购WhatsApp和Instagram，马克很清楚地感知到了时代的脉搏。这是他不断学习并把自己主要精力投入的地方是有关系的。智力不能决定成就，但是却可以决定学习的速度。作为普通人我们应该学马克，怎么把自己那点儿远逊不如他的智力投入到真正关乎未来的事情上。逊择的智慧是这一系列伟大动作背后的底层建筑。


    今日商业心法总结：1.促进人的连接，是商业的底层逻辑之一。阿里巴巴和腾讯在社交领域的苦战已然旷日持久，真没想到，Google和Facebook竟然也在社交领域干过一仗！为什么巨头们争夺如此激烈，昨晚看梁宁老师《结婚教练》那一课有了新的启发，其中有一句“有一种慈悲，叫做给对方存在感”让我彻底沦陷，一下想明白了很多问题！对我理解这些巨头的竞争、商业的很多现象，以及处理日常人际关系，都有非常大的启发。2.动员时，学会制造仪式感、调动情绪。感慨扎克伯格天才的发明——企业面临威胁时进入禁闭状态，这是一种非常醒脑的仪式感，能够迅速调动大家进入备战状态，然后又通过“军事动员”彻底激发全体员工的战斗欲，还能想到用迦太基和罗马人的故事来类比。脑海中对扎克伯格涌现一个词：人性的大师。3.令人惊骇的执行能力和执行速度。两次大的谈判和收购都是以迅雷不及掩耳之势达成的，手起刀下，干净利落，精准有效，玩的都是心跳！这让我想起二战时期沙漠之狐隆美尔的打仗战略，闪电般速度——一击破，让对方毫无规律可循。这种速度可怕之处不在于击败了多少敌人，而是对敌人造成超强的精神镇压。4.创业是边开车边换轮胎，是边开航母边换引擎，柳传志也说过类似的话：创业就是开着飞机从悬崖上俯冲下来，在落地之前重新组装起飞。'
