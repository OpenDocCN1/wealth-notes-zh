  md: '# 腾讯 | 从微积分、概率论视角看腾讯和阿里的底层逻辑差异


    其实说实话，腾讯这家公司讲到这里，既可以说远远还没沾到毛皮，也可以说已经讲完了。


    前面那句话很好理解：对于一家如此庞大、历史如此精彩的企业来说，写上十本八本的书仍然是挂一漏万；


    但后面那句话其实也对，因为当你明白：一家伟大的公司也是靠一点点试错、一点点改进才走到今天的，精髓你也就已经抓住住了。


    从这个角度来说，游戏业务的腾讯和3Q大战，绝对是腾讯这家公司能够走到今天的里程碑式的事件。一个形成了腾讯做事的方法论，一个奠定了腾讯如今的价值观。这两个东西，缺一不可，是一家公司得以存在的真正的基石。


    另外，开专栏之前之后我都反复说过，我们的专栏，当然要有商业故事、公司历史、经典案例、商业理论等等这些东西，但我更想传播和告诉大家的，其实是商业哲学，是那些我们可以商业中借鉴的，能够映照我们每个人生活的东西。


    只有走到商业世界的最底层，走进那些伟大的企业家的思想，这个专栏才真正有价值，才能在很多年以后仍然立得住。


    # 第一件事：关于“黑天鹅”和“反脆弱”


    我们亚马逊的专题里介绍过《黑天鹅》这本书的一些思想，以及它的作者纳西姆·塔勒布。


    很多人都是因为这本书知道的这个黎巴嫩的数学家、投资家和哲学家，但很多人不知道，《黑天鹅》其实是塔勒布思想的一个阶段性的成果，他的核心思想体系其实贯穿在一个“三部曲”里，就是三本书：《随机漫步的傻瓜》《黑天鹅》和《反脆弱》。而最后这本《反脆弱》其实才是塔勒布思想之大成。


    而《反脆弱》里面的核心思想，和我们在讲的腾讯非常相关。


    《反脆弱》的核心思想其实用一段话就可以概括：这个世界是混沌的、不确定的。所以每隔一段时间，人类社会就会发生那种之前很难预测的，但一旦发生破坏性就极强的“黑天鹅”事件。而人们对于这种事件不仅预测不足，而且还采用了错误防范方法。


    # 第二件事：关于微积分和概率论


    你可能想，数学的东西和我们讲的公司有什么关系呢？别急，让我慢慢说。


    现在我们再来看腾讯和阿里的业务，应该已经无比清晰了：腾讯的底层是社交，人与人之间的关系驱动一切；阿里的底层是零售，人对物的需求驱动一切。


    +   1. 阿里与微积分


    微积分可能很多人都知道，但我们仍然可以简单讲讲。'
