- pgno: 14
  md: '是他最重要的学习期——在北京不但有对互联网和电子商务更先进的理解，当然也凝聚了更多的资源。正是北京期间，马云认识了雅虎的创始人杨致远，他还请马云去做过中国雅虎的总经理。


    总之，这段最后的蛰伏期，为马云今后的创业打下了最坚实的基础。35岁，一个看似可能性已经关闭了太多的年纪，马云就要成立他的阿里巴巴了。


    # 划重点


    > 在创立阿里巴巴之前，马云有过三次创业经历：海博翻译社、中国黄页和外经贸部商务信息中心。


