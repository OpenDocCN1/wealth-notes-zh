  md: '# 复习 | 关于麦当劳你必须知道的13个问题


    张潇雨


    作为全世界最成功的连锁餐饮店之一，麦当劳创造了独特的商业模式。今天通过13个问题，带你快速复习麦当劳。


    # 1. 为什么说早期的麦当劳代表了美国精神和美国梦?


    第一家麦当劳餐厅的创办人是理查德·麦当劳和莫里斯·麦当劳，兄弟俩来自一个普通的美国家庭，父亲是鞋子工厂的工人。麦当劳兄弟通过反复的琢磨和试验，把传统汽车快餐厅冗长的菜单精简到只有汉堡、薯条和饮料，把送餐改成了排队取餐，还通过改良厨房布局，把等餐时间从30分钟缩减到了30秒，没多久餐厅就年收入几十万美金。这是一个典型的普通美国人通过奋斗实现梦想的“美国梦”故事。


    # 2. 为什么“麦当劳之父”不是麦当劳兄弟?


    公认的麦当劳公司创始人确实不是麦当劳兄弟，而是雷·克洛克。他原本是一个销售员，50多岁时拿到了麦当劳的特许经营权，接着把麦当劳扩张到了整个美国。他在彻底拿到麦当劳商标权之前，已经把餐厅开到了17个州，而麦当劳兄弟只有最初的那家小店。


    # 3. 麦当劳兄弟为什么要卖掉麦当劳?


    守着一家小店的麦当劳兄弟财力远不及克洛克，深知已无力回天，于是要价279万美元，把商标卖给了克洛克。其实，麦当劳兄弟还提出要未来麦当劳每年1%的利润。然而，这个没有被克洛克写在合同里的条款，从未被履行过。


    # 4. 失去了麦当劳的麦当劳兄弟过得如何?


    1984年，克洛克去世时，身价大概有5亿美元；而理查德·麦当劳1988年去世时只留下了180万美金的遗产，莫里斯·麦当劳更是因为承受不了诀别精神崩溃，最后心脏衰竭而死。


    # 5. 麦当劳带给我们的最著名的商业启示是什么?


    产品界有一个来自麦当劳的非常经典的商业案例——“奶昔错误”。为了提高奶昔销量，麦当劳请了很多 DWORD 做调研，关注点都在奶昔本身，然而克里斯朕森教授的团队通过每天18小时的观察，发现事实和大家预想的不一样：大家买奶昔是因为它能在开车的时候当早餐，还能打发时间，和奶昔的味道没关系。于是，他们做了更浓稠、带果粒的奶昔，管饱又有趣，销量大增。


    # 6. 麦当劳跟肯德基为什么总是挨着?


    想象一条路，路的两头分别是肯德基和麦当劳，为了争夺路中心的客源，肯德基和麦当劳会相继搬到离路中心更近的地方。在互不相让的博弈下，最终结果一定是两家店一起出现在路中心。在一个理性的市场里，竞争者最好的方案就是把产品做得彼此都<|message|>


    # 7. 为什么中国的麦当劳比肯德基少很多?


    麦当劳在中国布局有两个失误：一，开放特许经营权的时间晚，肯德基在2000年左右在中国开放了特许经营权，而麦当劳是2008年，晚了整整八年；二，麦当劳完全低估了中国三四线城市的消费能力，布局完全不足。如今，肯德基在中国有5000多家店，而麦当劳只有2000多家。


    # 8. 你知道“金色拱门理论”吗?


    “金色拱门理论”算是半经济半社会学理论，提出者是著名作家托马斯·弗里曼。这个理论说的是：任何开设了麦当劳的两个国家，不会彼此打仗。因为弗里曼认为，一个拥有麦当劳的社会，基本上等同于一个经济稳定、中产力量强盛的社会。人
    arc


    # 9. 你知道“巨无霸指数”吗?


    “巨无霸指数”是《经济学人》杂志在1986年推出 ...


    # 10. 为什么说麦当劳本质上不是餐饮公司，而是地产公司?


    餐饮公司的资金来自于餐饮收入，而麦当劳很大一部分资金来自于：先以低价买或长期租到一块地，再以更高的价格租给加盟方，然后再拿这块地去抵押贷款，进而获得源源不断的新资金，所以说麦当劳是一家地产公司也不为过。但是，如果麦当劳的品牌不能给地产加持的话，高价租出再抵押贷款的模式也无法成立。


    # 11. 为什么说麦当劳是全世界最大的玩具经销商?


    以绝对数量来看，麦当劳确实是全世界最大的玩具经销商，因为它每年通过全球3.5万家门店向外输出15亿只玩具，这是沃尔玛、玩具反斗城这样的大玩具经销商都无法追赶的数字。而麦当劳通过与大热、经典IP合作生产主题玩具，俘获了无数小朋友的欢心。


    # 12. 如今健康理念当道，麦当劳的业绩还好吗?


    麦当劳采取了三个拯救业绩的措施：一，出售直营店，直营店变加盟，提高开店的速度；二，丰富产品种类，连巨无霸都分了三个不同的大小型号；三，在服务、营销和数字化上做尝试，比如自动触屏点餐机、新的咖啡机等等，甚至在美国，麦当劳会提供送餐到桌的服务。2017年6月，麦当劳中国还请了吴亦凡做新的代言人。所以，2015年开始，麦当劳又进入了新一轮的增长，股价和市值都在2017年创下了新高。


    # 13. 麦当劳改名叫“金拱门”是怎么回事?


    今年年初，麦当劳中国成立了一家新公司，未来20年，中国内地和香港麦当劳的经营权都归这家公司所有，而这家公司的老板就是中信。 ...


