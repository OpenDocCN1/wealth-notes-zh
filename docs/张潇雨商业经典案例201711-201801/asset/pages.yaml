  md: '但这个过程里吸取了非常多的教训。这让我想起《三国演义》里的刘备，刘备的军队经常打败仗，但也正是因为经常打仗，他手下的将军也是最能打的。


    今天的专栏怎么听，都觉得是在用阿里以及马云告诉我们“你想得到一样东西，最好的方式就是配得上它”。


    # 阿里｜两笔大融资与第一次危机


    企业是一群人聚集在一起朝一个目标共同努力的结果，创业者就是找到目标，再将那群人聚集起来，你说影响他人与凝聚人心重不重要？


    影响他人和凝聚人心当然重要，一个好的创业者，无论是“忽悠客户”还是给“给员工画大饼”都是推动事业发展的基石。只有能影响他人和凝聚人心才可以在发展中变化目标，让大家始终相信你，因难来时创始人是避风港，大家才有动力，才敢手牵手继续走。


    作为一个创业者，凝聚人心应该是基本素质。因为创业初期一个未经验证的想法，随时都可能面临着质疑，随时都有可能因为大家的不同意见而发生偏移，导致功亏一篑。我的公司就处在创业初期，一切都还在探索摸索当中。在这个过程中，稍微遇到困难就有人背后议论，自我怀疑。这样的情绪一旦散播开来，整个团队的士气都会严重受挫。大家不再积极思考解决问题的方法，而是被各种困难捆绑束缚，自我泄气。明明有很多可能，都生生地被自己的恐惧打败了。所以，创始人的个人魅力和凝心聚力的能力就格外重要了。


    我觉得对一个创业的领导者来说，影响力和凝聚力是必备的能力。在一个创业的初期，缺人、缺钱、缺市场，在面对这么恶劣的环境下，要突出重围，很多情况下，靠的就是创始人的隐显。而这个隐显是创始人，不团队的，那么，就要靠创始人的影响力来影响他人跟随，用凝聚力来凝聚人心及目标，统一到一致的行动作上来。如此这般，才可能有一线生机。根據胜者偏见我们可以知道，生存下来的企业，他们领导者所具备的共同的品质，一定是创业者所必备的品质，那么，放眼中外创业成功者，甚至包括大企业的领导者，无一不是具备影响力和凝聚力的。比如乔布斯、孙正义、马云、马化腾等等，虽然，他们性格迥异，但是这两点品质我们都能看到。说得大一点，不光是创业，即使不创业，要做成做大任何一件事情，影响力和凝聚力都是必备的。不是说有这种品质就一定能成事，但没有，事几乎就不可能成。所以，我觉得即使自己不是创业者或是创业成员，我们也要培养自己这些能力。


    # 阿里｜大战eBay给淘宝带来了什么


    任何行业里打败领头羊本来是很难的，这其实要等到领头羊犯错，但像易趣这样好犯死的错误却犯掉的行业领袖是很难找的。其中一个重大错误之一就是像席尔波曾说过的，eBay的失败，收费与不收费是一个因素，但不是决定性因素。平台迁移是比较大的一个影响，做持这件事，差不多砍掉了易趣的一条腿。他说的是eBay当时决定把易趣平台关掉，把用户迁移到eBay美国平台上去。在易趣向eBay国际网站的转过程，用户也大规模地转移。这些用户一时间无法适应业务模式的转变，更重要的是，在整个平台实现整合后，eBay的系统性能极不稳定，给广大用户带来了很多麻烦。于是，eBay用户流失成为一个不可避免的问题。但对淘宝而言，这是一次难得的机会。当时，淘宝已经在几个月前进行了一次系统升级改造工程。面对eBay用户的大量流失，eBay的决策层似乎并没有意识到决策的错误，反而把责任归咎于淘宝的“不正当竞争”。而易趣在这个过程中不能做任何新功能，其中有一个功能就是担保交易（就是eBay的支付宝）。


    今日得到，1.识时务者为俊杰，随机应变者为英豪。马云用80年代世界上最大B2B的愿景影响了创始人团队，但这必不妨碍他接受孙正义的建议，重磅出击C2C的淘宝，并围绘其打造生态系统。所以，不要嘲笑某某大佬又食言打脸了，企业变得更好才是他们真正需要的。2.在晴天修屋顶，下雨就来不及了。对于个人来说，健康和成长也是同样的道理，等生病或者机会来了才想到补救就差就太不及了，要从现在做起。3.胜者为王。我们在感叹胜利者的方法和机遇的同时，也要去总结失败者的原因。


    京东的崛起恰好是阿里最大的两个失败，一如eBay做慢地无视阿里免责赛略一般，阿里顽固地认为电商不该自己建仓做物流，也不看好B2C业务。于是京东利用阿里的覆盖盲区趁势而起，我印象里在2012年京东的影响力覆盖还很ln分，但是后来却敢于挑战双十一的阿里，甚至于创制让阿里跟随的中年大促！大公司最大的失败就是对自己看不懂的新模式用传统态度来看待，于是市场被颓覆坑法，屡屡次次逆袭高富帅。


    看完这期专栏，我的感受是商业世界里的攻守切换真的比想象中频繁。我觉得看起来弱小的公司像当年的阿里其实并不弱，可以看出阿里是比eBay更懂市场更懂客户，甚至还创造出新的商业模式。为更好满足顾客，eBay的做法倒是让我大跌眼镜。想起之前的专栏eBay收购的PayPal和X.com斗得天昏地暗，对手做些什么我立刻跟进什么，而eBay竟然对阿里免费的做法一无所知。公司大确实不是傲慢的资本，怀着一颗谦虚的心，在竞争激烈的商业世界中，不断地向顾客学习，向竞争对手学习，不忘初心，自我成长。这大概才是我们要追求的吧。


    # 阿里｜造节“双十一”


    从阿里的发展历程，以及全球范围内其他大公司的情况下，再优秀、伟大的公司都 没有完美的历史，都会在其前进的道路上犯过这样那样的错误。比如：阿里做搜索、与雅虎的文化融合以及融资结构等。成功与失败是一枚硬币的两面。对成功者而言，失败是试错和探索的过程，他们能够得起，能在倒阔后继续前行。就公司并购后的整合问题，其实，很多失败的案例并非并购本身之错，而是两家公司的文化不兼容，导致融合局势甚至严重内耗，进而自毁前程。从阿里与雅虎的文化融合失败中，可以给我们的启示是，如果要构建良好的企业文化生态，求同存异，包容多元文化，应该要求文化统一更高明而有效。


    延伸：1.跨界是发生相关联的，阿里当时独立地做雅虎搜索无疑是让自己和其他搜索引擎在同维竞争，使用者对比的就不是阿里优势，而是两个独立搜索引擎的优势，但如果搜索和阿里连接在一起相关了，就会把竞争升维。比如我现在常要去解决某些问题，我可能不会用百度，我会用淘宝去找直接解决方案。因为现在有些很冷门的东西在淘宝上可以找到，甚至有时侯我想了解某个东西也会去淘宝。因为淘宝商家为了卖得更好，他们会研究得更深刻。我还可以提倡，在某些方面比别的搜索引擎要方便。2.“居其所而非其所，不在其位，不谋其政”。（《论语》）意思是像北斗星一样占据了重要位置，众星才会围绕过来。不在那个位置，无法以那个位置的视角和责任去看待问题。创业也一样，不到真正需要的时候，就无法真正深刻理解你所需要的。阿里不断地升级、扩展、连接各个领域，不是它预划出来的，而是它到一定量级的位置自然看到的，它在这个位置需要这些布局来支撑。许多创业者容易犯不在那个量级位置却想大跃进，陷入创业者的窘境，但到一定量级又不愿意容纳新事物，陷入创新者的窘境。


    《硅谷来信》的主理人吴军老师在所著的《浪潮之巅》一书中一再强调“基因决定论”——“2006年，我和李开复博士等人多次谈论科技公司的兴衰。我们一致认为一家公司的基因常常决定它今后的命运。”往往一家企业的创始人或拓疆者的性格对企业基因有着决定性的影响。以IBM为例，其创始人托马斯父子奠定了这家企业的三项企业文化基因：尊重员工、重视科学和以机构客户为主要服务对象。除了这三项基因之外，一切都是表面的、非核心的内容。因此，无论企业发展处于何种阶段，都要将企业文化基因真正地植入企业员工和服务用户的身体中。而且，每到一个阶段都要细回味、观察一下，企业文化基因是否发生了变异。正是由于这三项基因的佰存，才让IBM在这久'
