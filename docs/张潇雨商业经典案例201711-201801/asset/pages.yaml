  md: '# 腾讯 | 马化腾的产品观（上）


    在从商业哲学的角度理解了腾讯之后，我们当然要来学习一下腾讯最核心的一个能力——做产品。最后的两篇专栏，我们就来看看马化腾的产品观。


    这两期内容都来自他在腾讯内部的分享。马化腾总结了产品经理常犯的七个错误，水平和境界很高。推荐大家一起来阅读。这里面的很多内容由“摘手志”和“创业者”整理总结，在此感谢一下。


    下面我们就来听听小马哥讲的“做产品的时侯最常犯的七个错误”。


    # 错误一：忽视产品的隐性特性


    一个产品我们要少谈它要包括哪些功能。应该多想，我要提供一个服务，这个服务有哪些特性，它的整体服务流程是怎样的，它的整体服务成本是多少。


    举个例子，我们来研究一下ATM机。


    +   1. 现金管理：保证ATM机里随时有钱。这里包括了数据、现金出库、运送等复杂的流程；

    2. 硬件管理：包括电源工作正常，打印机工作正常，打印机的纸、油墨耗材正常等等；

    3. 客服管理：也就是对于客户问题或者投诉的处理要有全流程规划设计。


    # 错误二：自己猜测用户的需求


    用户需求是产品的核心，说用户有点老生常谈，但最简单的事情恰恰是做起来最难的。


