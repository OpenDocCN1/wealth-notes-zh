  md: '# 京东 | 高瓴资本张磊的投资智慧


    京东 | 高瓴资本张磊的投资...


    这期专栏是我们京东系列专题的最后一期，我想稍微从主线做一点延伸，来讲一个和京东以及刘强东有着千丝万缕联系的人。他就是我们之前提到过的，高瓴资本的张磊。


    之所以要讲高瓴资本的张磊，是因为就像我们专栏之前讲过的很多企业家一样，我觉得他的很多关于投资、创业以及生活、做人的思想都很值得学习。


    我一直强调，学习商业、学习各种投资理念就是学习生活本身，这也是我特别想告诉给每一个读者和听众的。所以，今天我们就来聊聊张磊这个人，也推荐大家去翻翻他之前做过的各种演讲，很多讲的都很不错。


    # | 张磊：不走“寻常路”


    张磊是1972年生人，出生在河南省驻马店市。他的家境还 dime 够，家里有很多书，张磊小时候就经常抱着书到班里借给同学看。他学习好，人缘不错，周末时常有同学去他家，张磊的母亲就包包子给大家吃。张磊组织能力强、口头表达能力也不错、爱读书，涉猎面广，高中的时候《资本论》就读过两遍。后来，他在1989年以省状元的身份进入了人民大学国际金融专业学习，在1998年，又成功申请到美国耶鲁大学管理学院，读研究生。


    1999年，张磊开始在耶鲁管理学院读书，当时他还经常勤工俭学，从本科生助教到汉语陪聊都做过。结果一次偶然的机会，他去面试耶鲁大学投资办公室，正好遇到了对他一生影响和改变最大的人：西方机构投资的教父大卫·史文森
    (David Sewensen) 先生，从此一生和投资结下了不解之缘。


    史文森是投资行业非常著名的人物，也是耶鲁大学捐赠基金的主脑。他1983年从华尔街离开，回到耶鲁，仅仅拿百万美金的年薪——这一相比于他在华尔街能拿到的钱来说，实在是不值一提——别人问他拿这么点钱回耶鲁，是为什么，他说：脑袋坏了。


    这么多年来，史文森把耶鲁捐赠基金打造成了全球最好的捐赠基金。后来，全球私募股权投资基金行业权威研究机构PEI发布过一个“2001-2011十年总结报告”，选出来100位对全球PE投资业有历史意义的人物。第1位是前美联储主席艾伦·格林斯潘，位列第2的就是耶鲁大学基金首席投资官大卫·史文森。


    这里可以稍微解释一下捐赠基金是什么。可能大家稍微有些概念，美国很多顶尖的大学都是私立的，他们运营的资金主要来自于校友捐赠，连学费的占比都很少。有兴趣研究的同学，可以看文末的链接，是斯坦福大学每年收入和支出的官方统计。像哈佛、斯坦福、耶鲁这些顶级学校都管理着超过200亿美金甚至更多的资金，所以让这部分钱保值和升值，是很重要的一个任务。张磊去应聘实习的就是耶鲁大学的投资管理办公室。


    张磊讲过一个他找工作时候很有趣的小故事，他说：


    我当年在美国耶鲁大学读研究生期间，曾经去波士顿的一家咨询公司面试。面试官让大家分析整个波士顿区域需要多少加油站。别人都做数据分析验证时，我向面试官提出了一连串问题——为什么只建加油站？为什么不能也同时开杂货店？未来要是有了别的出行方式，修那么多加油站干什么？可能我是“恐”面试官太狠，结果他现场就把我KO了。后来这样一“轮游”的面试我还参加了不少。


    就在所有的门似乎都关闭的时候，我在耶鲁投资基金找到了一份实习生工作。在那里我找到了自己事业的坐标系，选择进入投资行业。


    现在回想起来，我如果按照面试官的要求建模型做论证，今天我可能还在华尔街做咨询或投行。当然这不错。但是我选择的是诚实面对自己的内心，坦诚表达自己的想法，选择不走“寻常路”。就像弗罗斯特(Robert
    Frost)在他最著名的诗《未选择的路》(The Road not Taken)里说的，“I took the one less traveled by,
    and that has made all the difference.”我选择了一条与众不同的道路，而这对彼此生意义非凡。


    # | 张磊：耶鲁改变了我的一生


    在捐赠基金办公室实习的时候，张磊被派去木材行业做行业研究，几周后回来他就交出了好几厘米厚的报告。后来，这种非常重视研究的传统也在他的高瓴资本延续了下来，这也让他们捕捉了京东这条大鱼。


    后来张磊回忆说，“当时我曾经向标普500的每家公司发邮件索要年报。结果难以置信的是，这些年报竟然是免费的。从年报里看管理层讨论公司经营以及资本与资本投资回报的内容，我受益匪浅。这是非常好的培训。”所以你看，只要你想学习，就总能找到合适的渠道和方法，发现别人发现不了的东西。


    后来张磊说，“耶鲁管理学院改变了我的一生，这一点也不夸张。我在这里学到了很多东西，不仅仅是金融或企业家精神，还有给予的精神。”2010年的时候，他宣布向耶鲁管理学院(Yale
    School of Management)捐赠寓意吉利的888.8888万美元，这也是耶鲁商学院有史以来收到的最大一笔校友捐赠款项。


    说耶鲁管理学院改变了张磊的一生，一点也不夸张。因为他不仅在这个时期受到了最好的投资训练，也在这个时期结识了还是清涩期的马化腾和马云们。


    毕竟2000年前后的时候，这些人都刚刚起步。而到了2005年，张磊想要成立自己的基金的时候，也是耶鲁大学给了他2000万美元，让他去投资中国的新公司。连高瓴资本的英文名字Hillhouse，都来自耶鲁大学所在地纽黑文市的一条大街，它距离耶鲁投资基金办公室原先所在地只有一街之隔。


    而张磊拿到这笔钱之后，在2005年就投资了刚刚上市一年的腾讯的股票。十几年后，张磊管理基金的规模从2000万美元已经惊到了300亿美金。在中国乃至亚洲都是最大的一只私募基金。而这几年，高瓴在国内的互联网行业非常活跃。


    在这里可以给大家简单留个作业：大家可以去搜一搜，这几年来中国互联网界频繁发生的第一第二名的合并大潮，有多少是高瓴在后面作为推动促成的？


    # | 张磊的投资智慧


    当然，我自己最欣赏的还是张磊的投资智慧。他把自己的投资哲学概括成了三句话，他的原话是这么说的：


    作为投资人，我常说起我的三个投资哲学：


    第一个叫“守正用奇”、第二个叫“弱水三千，但取一瓢”、第三个叫“桃李不言、下自成蹊”。这三句话分别源自《道德经》《论语》《史记》。虽然现代金融投资的工具和方法大多源自西方，但如何使用好这些工具，我还是更推崇我们优秀的中国哲学思想和传统民族文化。


    +   1. 守正用奇


    在中国做投资最难的一点就是市场很浮躁，每天都有人告诉你市场上又发生了什么事情。我如何能在浮躁的市场 crate 冷静，就是我的第一个投资哲学一“以正治国，以奇用兵”，守正用奇。当你能够做到正，不论是做人正还是做事正，你就能够经得起各种各样的诱惑与挑战。


    为什么要用奇呢？因为你会发现，大部分人宁肯要很保守的失败，也不愿意要很创新的成功，因为大多数人都“不愿意打破常规，去犯错误”，这也是凯恩斯讲的原话。


    其实你的想法如果和别人不一样，就可以走出一 自己的道路。就像在中国做投资，每天大家都在抢项目，都失去了判断力，去抢一个东西。但人应该独立思考，守正以后给了你用奇的空间，用奇之后是你能够更好地守正。


    +   2. 弱水三千，但取一瓢


    另外，在中国不是机会太少了而是太多了。在中国做投资，知道自己碗里能装多少东西更重要。所以第二点就是，“弱水三千，但取一瓢”。自己的这一瓢最关键，你每天的功夫就是要把你的这一瓢做得更大更结实更深，而不是整天晕里的和桌上的...'
