  md: '# 周末互动｜扎克伯格有什么值得学习的地方


    周末互动｜扎克伯格有什么...


    你好，欢迎来到《商业经典案例课》。我是张漠雨。


    这两周我们讲的是Facebook专题，而对于Facebook，我们的切入角度更多的是从个人层面和企业的社会责任层面切入的。我知道很多同学对Facebook商业的部分也很感兴趣，别急，我们“美国科技大公司系列”还会继续，慢慢我们会再回来分析关于Facebook、亚马逊、苹果这些大公司的商业前景，毕竞我知道有一小部分同学是跟着这个专栏买股票的。


    这期的周末互动，我就不讲太复杂概念了。说三件小事吧。也算是给大家一点花絮内容，顺便推荐一本书。算是对我们这两周内容的一点补充。


    # 一，扎克伯格有什么值得学习的地方？


    这是一名Facebook的员工写的，所以是一手信息。当时有个问题是：马克·扎克伯格有什么很值得人学习的地方？他是这么说的：


    Facebook上市不久，最早的天使投资人，也是硅谷教父之一的Peter Thiel卖掉了手上所有的FB股票，使得一路下跌的股价雪上加霜。员工唏嘘。


    周五Zuck在公司食堂组织QA的时候（注：相当于公司的开放问答时间）找到了Peter Thiel，两人一起来面对员工的质问。当时被问的问题有：“在这个时间点卖股票变现，你不觉得是不对的吗”，“既然你已经卖了股票，是不是该退出董事会了”等等等。


    2014年2月，Facebook花了190亿美元买下WhatsApp。消息发出当天，员工再次唏嘘。


    第二天Zuck在公司食堂组织临时QA，解释自己的决定，面对员工的质问。当时被问的问题有：“为什么在收购上愿意花那么多钱，却不愿意给自己员工涨工资”，“为什么不自己复制个WhatsApp，是对我们自己的工程师没信心吗”等等。


    Zuck在内部QA上不止一次地做过道歉，说自己搞砸了，对不起大家的辛苦工作。印象比较深的一次是Facebook发表了一篇社会心理学领域的学术文章，不料被媒体指责有操纵用户情绪的嫌疑。Zuck带着相关一串负责人QA上解释道歉。


    你能发现，员工问的很多问题，有时候是带有道德绑架意味的指责。然而，每每有事情发生，Zuck依然会组织问答会，依然会站在大家面前解释自己的想法，虽然他完全不需要这样做。而正是因为CEO如此包容的态度，Facebook内部的意见表达一直很活跃，也保证了公司文化的健康程度。


    # 二，温克莱沃斯兄弟有什么值得学习的地方？


    这件事更像一个小八卦。看过电影《社交网络》的人，或者熟悉Facebook早期历史的人，应该知道扎克伯格最早和哈佛的双胞胎两兄弟合作开发过一个社交网站，叫ConnectU。后来他直接甩掉了这两
    人，自己单独弄出了Facebook。


    当时这两兄弟，卡梅伦·温克莱沃斯和泰勒·温克莱沃斯，不仅把扎克伯格告到了学校，还告到了法院。最终Facebook拿出了一笔钱和他们和解，这个案子才算完。


    那么后来这两兄弟干什么去了？其实他们两个人也很厉害。在2008年北京奥运会上，这两兄弟参加了赛艇比赛，还获得了名次。可以说是奥运级别的运动员。而之后他们又一头扎入了比特币的世界，在2013年，他们花钱买了接近总数的1%的比特币，还成立了自己的交易所和信托基金。不用说，两个人再次赚得盆满钵满了。


    要声明一下，我对这两个人的品行和品格并不太了解，也对“炒币”这件事很不支持。但我觉得这种关注前沿，一直学习和尝试新东西的态度还是很值得学习。而 且只要你持续地去尝试，而且是在自己的承受限度内尝试，不要赌博一即便错过了Facebook，也可能会迎来自己的“比特币”。


    # 三，桑德伯格有什么值得学习的地方？


    最后一件事情稍微有点悲伤，但我还是很想分享给大家。


    我们之前的专栏也提过Facebook的COO雪莉·桑德伯格这个人。她也是我非常钦佩的一个企业家和一名女性。


    不过在2015年的时候，发生了一场悲剧。桑德伯格的丈夫大卫·戈德堡（Dave Goldberg）在健身的时候突然倒地，然后发生了猝死。戈德堡也是硅谷非常著名的企业家，他俩的感情一直也非常好。结果桑德伯格一下就失去了丈夫和两个孩子的父亲。


    后来，桑德伯格花了不少时间从这场悲剧中走出来。她把自己这段经历写成了一本书，叫 Option B，也有中文翻译《另一种选择》。我看了这本书，里面有很多真挚的情感，以及再遇到重大的存什么时候，应该怎么调整自己，度过危机的很多很多心得。


    我想，不管你是不是一个著名的企业家，不管你身家多少，产品有多少用户，生活中的那些生老病死，那些猜疑、痛苦、侮辱，我们都是需要去面对的。所以我也把桑德伯格的这本书推荐给大家。


    下周我们开始讲Google。


    最后，万维钢老师在他的专栏《万维钢·精英日课第一季》中刚好解读了 Option B 这本书，我从万老师的专栏里拿到了这本书的一篇总结文章，如果你对这个话题感兴趣，看看这篇文章是最快速了解本书精髓的方法，点击下面的链接你就可以免费看了。


