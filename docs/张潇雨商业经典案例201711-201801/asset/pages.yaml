  md: '# 小 accomplice | 从明星企业家到银铛入狱


    小 accomplice | 从明星企业家到银铛...


    上期专栏我们说到，李途纯靠着两次豪赌，用了十年时间把太子奶从一家默默无闻的企业，打造成了年收入超过20亿的明星公司。这也让他成为了明星级的企业家。


    那时候的李途纯出镜率极高，无论走到哪里都前呼后拥，讲起来更是声人听闻。2005年的时候，他主导写了一本小册子，名字叫做《千年构想》，里面说，要把太子奶做成一家长盛不衰的“千年企业”。


    但就在他做着千年美梦的时候，太子奶命中注定的那场财务危机悄悄地到来了。


    # Ⅰ 太子奶又陷财务困境


    我在观察企业家一生命运的时候，经常会觉得很有意思。


    比如，有时候你会发现人执念之强大，比如我们之前说过的，一直有搜索情结的周鸿祎；有的时候你会发现，人的行为模式永远都不会改变——对于李途纯来说，当年的他能抵押自家房产卖历挣个一两百几，然后再把钱投进各种无关行业里全部亏掉甚至背上债务，而如今成为了明星企业家的他，几乎做的是同样的事情。


    # Ⅰ “天时”危机集中爆发


    看多了商业历史，尤其是大的失败史之后你会发现，就像一个成功的产品或企业需要天时、地利、人和一样，一个败局也往往是在天时、地利和人和上出了一些问题。对于太子奶而言，它失败的原因除了李途纯的好大喜功之外，还有老天似乎也没有那么眷顾他了。


    # Ⅰ 从出局到重新出山再到被捕


    在和国际投行约定的一个月之后，李途纯并没有找到可以接盘的人。所以三大投行决定将太子奶租给政府。'
