  md: '气吗？如果京东没有但行“坚持正品，坚持做电商，自建物流”的好事，还会有好运气吗？如果马云没有但行“让天下没有难做的生意”的好事，还会有好运气吗？运气就找不到他们了。但行好事，莫问前程。如果还没见到好运，很可能还差一个“但行好事”的距离。


