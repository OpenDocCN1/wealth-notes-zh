  md: '# Facebook | “普遍基本收入”的利与弊


    Facebook | “普遍基本收入”... ↓


    在上期专栏里，我们提到了如今这个3.0版本的扎克伯格。他已经从一个初出茅庐的青涩的大学生，成长为一个关心人类未来的慈善家甚至是社会活动家了。


    我们还说到，如今这些大公司和大公司的领头人，对整个社会的经济、政治活动的 olmak影响是巨大的，所以我们在这个时代来探讨“企业社会责任”是更加必要的。


    # I “普遍基本收入”


    之前在一次哈佛大学的演讲上，扎克伯格提到了一个概念，他说：我们应该探索类似“普遍基本收入”这样的理念，确保人们能在保障基本生活的前提下去解放自己，试验各种新的想法。像“普遍基本收入”这种社会机制，可能可以成为我们这一代人的一个“新的社会契约”。


    > 他在说，“在未来我们不应该只用GDP这样的指标来衡量社会进步，而是整个社会里面有多少人觉得自己的社会角色是有意义的。”


    这里扎克伯格提到了一个很有意思的概念，叫做“普遍基本收入”。这个词来自于英文的“Universal Basic Income”。


    # I 我们为什么需要“普遍基本收入”？


    那为什么这种看起来非常“乌托邦”的福利机制突然流行了呢？


    # I “普遍基本收入”的利


    不论“普遍基本收入”能不能实现，我们当然得先探讨一下它的利与弊。从现在主流的观点看，“普遍基本收入”有这么几个好处：


    +   1. “普遍基本收入”可以让更多的人从贫困中脱离出来。


    +   2. “普遍基本收入”大大降低了政府复杂的文书工作，降低了管理成本。


    +   3. 现有的福利制度还有一些缺陷。


    +   4. “普遍基本收入”还可以促进人权的平等。


    +   5. 激发创造力。


    # I “普遍基本收入”的弊


    +   1. 好吃懒做。'
