  md: '# 阿里 | 造节“双十一”


    阿里 | 造节“双十一”


    今天已经周五了，我们才梳理到了2006年淘宝和eBay大战的结束，离后面阿里 Curriculum 的另一个高速发展期还遥远呐。可这家公司的历史的确非常厚重。


    当然，我们的思路仍然是帮助你建立一个理解他们的框架，然后再选取几个切面和角度来近距离看看这家公司。如果能够给大家启发，或者帮助大家在未来更深入的研究里获得一些指引，专栏的目的也就达到了。


    今天我想把阿里剩下的几个重要节点梳理完，下周我们就能进入更微致一点的解读了。当然，这十几年的历史也是很雄简概拓的，我本着挂一漏万的精神，选择了几个历史意义最重要的节点在今天说一说。它们分别是：
    阿里与雅虎的并购、2007年香的港上市、2008-2009年布局云计算业务、阿里造节“双十一”。这几个节点，代表了阿里最核心的战略能力、规划思路和对整个社会的影响。


    # | 阿里与雅虎的并购


    2005年，雅虎投资阿里巴巴10亿美元，占股40%。由于孙正义也是雅虎的投资人，所以不难想像他在这一交易里面起到了很大的作用。但现在看来，这笔交易更像是一次“杀敌一千，自损八百”的举动。


    为什么这么说呢？阿里当时确实通过这笔交易获得了重要的资金，尤其2005年正是和eBay争夺最激烈的时候，但同时这笔交易也带来了几个负面影响：


    +   1. 进入搜索领域失败


    当时这笔融资很重要一个原因，是马云看到了搜索引擎的重要性，想借助雅虎的技术和经验把搜索做起来。但从现在回头看，阿里对搜索的尝试、对社交的尝试，腾讯对企业服务的尝试都失败了，百度就更不用提了。有时候“基因”这种东西真的像是“玄学”。


    当时拿到钱后，阿里花了8000万在《新闻联播》之后播放广告，又花3000万请来一线大导演为雅虎搜索拍摄广告，这些当法的结果你现在也看到了。有时候只能说，当一个公司账上钱太多的时候，反而也是一种阻累。


    +   2. 文化融合失败


    当时的阿里为了融合雅虎团队下了很大的功夫。有这样一个细节：当时阿里用一个整个列车把雅虎的员工运到杭州，车到站的时候，阿里的同事以为雅虎员工准备的早餐包子还是热的。


    +   3. 股份稀释过多


    # | 2007年香的港上市


    # | 布局云计算业务


    > “人们一直觉得阿里巴巴的技术可能是中国互联网公司里最差的。百度李彦宏懂技术，腾讯马化腾懂技术，只有马云什么都不学，好像认为马云很差。其实正因为我不懂技术，我们公司技术才最好。不懂技术，但我对技术尊重，我们没法吵架。如果我很懂技术，我们公司的技术人员就会很悲催，我三天两头就会告诉他们应该这样应该那样。因为我不懂，我才会好奇、敬仰地看着他们说，就应该这么做。


    # | 阿里造节“双十一”


    +   2009年，天猫商城“双十一”的销售额只是5000万左右；


    2010年，这个数字跳到了9.36亿；


    然后就是一系列爆发式的增长：33.6亿，191亿，340亿，571亿，912亿；


    2016年，这个数字已经变成了1207亿。'
