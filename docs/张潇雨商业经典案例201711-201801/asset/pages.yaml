  md: '# 王兴 | 不可避免的“创业课”


    王兴 | 不可避免的“创业课” ↓


    今天我们开讲一家新的公司——美团。


    与其说是讲美团，不如是讲它的创始人王兴。当然，美团现在作为一家估值超过300亿美 元，业务横跨外卖、酒店、短租、打车、支付等等领域，并且还在发展壮大的公司，已
    经足够成功了。但是我觉得更值得研究的 是王兴这个人创业十几年来的进化史，以及他真正底层 的思想是什么。


    毫不夸张地说，我一直觉得作为中国少  派CEO代表的王兴，是国内最接近亚马逊 CEO贝佐斯的人。当然，他还有自己非常特别的东西。


    所以接下来的两周时间，我们就以王兴这个人为主题，来讲一讲他的创业史、美团这家公司的经典案例和战役，以及最重要的，王兴的商业思想和理念到底是什么。希望在这两周的学习之后，你不仅能学到创业理论，还能对商业与哲学的关
    系有更深层次的认识。


    # | 王兴从哪里来？


    实际上，这 是著名的科技媒体人程 峰一篇 文章的题目，文章就叫做《王兴从哪里来》。他在文章里写道：


    格局、境界、理性、勇气……所有这些赞美以及很多的王兴语录，都只是告诉你他站在什么样的位置，在这个位置上有怎样的野心，而没有告诉你他是如何来到这个位置的。我们被结果惊叹，但很可能忘记了找寻原因，于是就困在一个激动不已的虚幻里。


    王兴赞赏跟美团有类似的亚马逊的布局。但据我所知，王兴对贝佐斯的认可和琢磨至少在2008年便开始了，那时还没 有美团。从2008年到2017年，屡败屡战的王兴对贝佐斯的解读如同一
    步步的进化。如果不知道这个漫长的过程而只是忽然加深了对亚马逊 或者美团的崇拜，那这很可能成为一个偏见之源。


    能够接近王兴的商业境界并且隔离领悟个中道理的人应该不会超过三位数，10 万+ 的读者只是脑袋里又多了一个教条。


    几年前“百团大战”腥风血雨的时候，胜负渐分。当时一个投资人大颇说了这么一句话，“王兴是从死人堆里爬出来的”。我觉得这是迄今为止对于王兴最有力量的一个评价。王兴就是这么来的。今天对王兴所有的赞美在这句话面前都瞬间粉碎。王兴的所有幸运和所有实力都提炼在这一句话里了。


    在藏区有句老话，“你得有足够大的福报，才会换上师一顿打”。大部分的人弱不禁风，上师只能对他们笑脸护佑。你得有足够大的福报，才会在壮年生一场重病，遭一场濒死的大难。这是清零，清零才是让一个人彻底反思、脱胎换骨的方式。清零了，你才会重新架构起一套更具有生命力的性格和思维系统，开始对暴露出来的所有盲点做出修复。而这套系统里装进什么样的新东西，那是因人而异，并且自然而然，水到渠成的。


    1979年生人的王兴，出生在福建龙岩的一个富裕的家庭里。他的父亲是做水泥出身，后来拥有了生产能力百万吨级的水泥厂，而且完全是自己白手起家打拼出来的。


    王兴的父亲对孩子的教育很宽松民主，虽然他希望自己的儿一女去搞科研，为国家做贡献，但王兴想要创业的时候，家里也没有阻拦。后来王兴的姐姐在清华毕业之后去了美国留学，在硅谷做工程师，自己买了房子和车，没有管父亲要一分钱。而王兴除了最初的一小部分创业资金来自老爸的支持，后来也没有管家里要过钱。当然，现在王兴的生意早已超过了父亲，这可能是他们当时也没想到的。


    # | 创业的“上课”阶段


    2003年的冬天，在美国读博士的王兴向导 师请了一个长假，准备回国创业。


    他最先联系的就是自己的本科室友 王慧文，现在也是美团最重要的合伙人之一。实际上，这两个人很早就是一起讨论创业了。


    他们聊过各种项目，比如可穿戴设备，但发现那个时候的传感器和芯片计算能力都有些问题；还讨论过制作个性化T恤的网站，不过发现市场已经非常饱和。不过这次王兴有了一个新发现，那就是美国有一个东西开始很火，叫做SNS。


    SNS全称是Social Network Services，也就是大家如今都已经非常熟悉的社交网络服务，最具代表性的公司当然就是Facebook。不过Facebook其实也不是这个行业的先驱，2002年的Friendster和2003年的MySpace都是社交网站中的先驱者。


    我们常说，创业的时候未必要第一个做才有优势，某个领域越拥挤，有的时候机会越大。这一点在社交网络这个领域里，体现得非常充分。


    2004年的3月，王兴和自己的几个同学在清华大学旁边租了个房子，开始创业。


    我们之前在讲创业专题的时候就讲过，很多伟大的企业家和创业者在 一开始其实根本不知道自己在干什么，王兴就是一个很好的例子。


    虽然他们看到了社交网络 这个大机会，但那个时候整个团队对SNS这件事的理解还非常浅，基本就是停留在“六度空间”理论上。所以在长达一年半的时间里，大家都在不停地换项目。


    他们最先开发的一个网站叫做“多友友”——就是很多朋友的感觉——结果什么反馈都没有。于是他们开始开发一系列别的东 西，比如活动邀请网站“电邀”，替海归留学生打印照片然后寄给国内家长的网站“游子图”，甚至还有一个叫做“Just
    Input”的拼音输入法。


    总之，那个时候的王兴和他的团队，正在经历着人生中第一堂不可避免的创业课。


    # | 校内网上线


    于是，一个更加清晰的想法诞生了：做一个基于真实社交关系的，面向大学生的社交网站。这就是后来的校内网。


    2005年12月，校内网正式上线。王兴的创业之路迈出了第一个坚实的步伐。'
