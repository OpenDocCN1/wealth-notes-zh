  md: '# 小败局 | GoPro犯下的三大错误


    小败局 | GoPro犯下的三大...


    上篇专栏我们说到，尼克·伍德曼和他创立的GoPro经过十年的努力，终于在纳斯达克上市了。上市当天收盘时，GoPro的市值在30亿美金左右，而后来巅峰的时候，整个公司的市值达到过130亿美元。但到了2018年年初，GoPro的股价已经跌掉了90%，整个公司只有10亿美元出头。短短几年时间，这个公司到底发生了什么呢？我们今天就来看看这个问题。


    本质上，任何公司的衰落，一定都是由于非常综合、多元的原因造成的。不过，我们也可以用一句话来总结GoPro的失败，那就是：在核心产品受到巨大挑战的同时，又没有开发出新的业务线。


    我们来看看这几年的GoPro都出了哪些问题。


    # 问题一：核心产品线的策略出错。


    从2014年6月上市后，GoPro就开始了产品线的无限扩张之路。


    2014年10月份，GoPro更新了旗舰产品线，推出售价499美元的Hero4 Black以及399美元的Hero4 Silver——GoPro相机的系列命名都是以“Hero（英雄）”这个单词开头的，也就是说这两款相机都是第四代产品，一个黑色，一个银色。


    另外，与Hero4系列同期登场的还有一款Hero入门级产品，售价仅仅是129美元。实际上GoPro希望能用一款相对便宜的低端产品来吸引更多的客户。


    但是这款低端产品实在是太简陋了，既没有取景器，也没有随时间传输照片和视频的内置WiFi。结果就是：核心用户，也就是运动相机爱好者最后还是选择了价格贵得多的Hero4系列，而小白用户还是对GoPro无感。


    这是GoPro公司遇到的第一次挫折。


    商业的东西很多时候就是一步错，步步错。


    等到Hero4度过热门期，开始下滑的时候，整个公司都开始有点恐慌了一一因为他们发现自己找不到新的增长点了。


    为了应对危机，GoPro开始祭出“机海战术”。从2015年6月开始，GoPro先后推出了一系列产品，有主打中低端市场，售价299美元的Hero + LCD。这款相机相比Hero，背面多了一个LCD触控屏；还推出了全新造型，售价399美元的Hero4
    Session，就相当于更小的迷你版Hero4；另外还有售价199美元的Hero +，相比之前那个低端产品，多了WiFi和蓝牙连接功能。


    可能我说了这么一大串之后，你已经晕了。实际上，运动相机本来就是个细分市场，非发烧级用户进到这个领域的时候，看到这么多产品，一下就无所适从了。所以虽然GoPro推出了这么多产品线，但真正成功的一个都没有。


    > 我学习到了一件事情，就是不能给用户太多选择。因为太多选择会让用户觉得非常困惑，最终他们就哪个都不买了。


    另外还有一件事情，体现出了GoPro对自己产品定位的错误理解。


    2015年7月推出的399美元的Hero4 Session，实际上就是一个小小的、防水 的、没有屏幕，只有一个按钮的四方盒子。


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_142_0.png)


    伍德曼对这款产品非常有信心，他觉得这款相机既简单好用，外形又酷，一定会病毒式地在用户之间自发传播。所以他们干脆连营销活动都没做。


    结果，根本没人想花400美元买一个小盒子，这款相机完全没有流行起来。后来GoPro只做两次降价，现在这款相机只要199美元。


    后来，GoPro的发言人承认这属于典型的自大，他说：“我们觉得，每个人都热爱我们在做的事情。我们以为我们可以把东西放出去然后收个399美元大家也会买，因为这是GoPro。”但实际上并不是这样的，至少对于大众并不是。


    # 问题二：竞争激烈。


    随着运动相机领域越来越热，很多竞争对手也开始进入了这个行业。


    除了宝丽来这种传统相机公司外，索尼、HTC，包括小米也都进军了便携摄 影市场。结果人们发现，GoPro的那些设备零件加起来根本不值那么多钱。


    拿小米生态链的产品“小蚁相机”来说，它 的入门款就是四五百人民币，而高端款 也就是一千出头。这比起Gopro动辄四五 百美元的售价实在是实惠太多了。


    实际上这个道理很好理解，对于非常核心的极限运动玩家来说，他们是愿意付出品牌、情怀等这些溢价来购买GoPro的，但对于非核心的轻度用户，花三千块钱单独买个运动相机实在是没有必要。


    # 问题三：自身定位摇摆导致转型失败，还损伤了自己的核心竞争力。


    我们都能理解，本质上GoPro是个相机硬件公司。那么硬件公司应该干什么？看看苹果、小米、华为都在做什么——他们在不断地做硬件上的技术突破创新；把产量提高上去之后，努力整合供应链，提高良品率；然后发展软件生态来反哺硬件。


    但是GoPro完全违背了这个道理。尼克很早就提出来，GoPro不想做一个硬件公司，而应该做一个内容公司、媒体公司。他多次在采访里和媒体强调：“内容才是我们发展的核心，硬件只是辅助。”


    GoPro所指的内容是什么呢？


    首先，是用户自己编辑和上传的内容。


    上市之后，他们斥资一亿美元收购了两家移动视频编辑公司，希望和自己的产品整合，能够给用户提供从拍摄、编辑到分享的无缝体验。最终，用户通过运动相机来记录生活，就像人们会通过手机拍摄视频、照片一样。所以，GoPro是想最终运营一个以图片和视频为核心的社区生态。


    结果，这种意图完全没有什么收获，甚至还产生了一些负面影响，因为越来越多平淡和平庸的视频被上传到GoPro频道上。比如小孩子在桌子上爬，一家人出去野餐等。这些内容的出现恰恰说明，用户完全不需要特地购买一部GoPro，这个东西好像只适合那些高端玩家。


    另外，从2014年到2015年两年之间，GoPro招聘了超过100名员工来发展娱乐业务。他们从电视台挖来了高管，投入几百万美金来开发一系列的纪录片和电视剧。然而我们知道，内容这种东西，不认真耕耘个十年八年，很难一下就出成果，结果这笔钱基本也打了水漂。


    更加令人遗憾的是，GoPro新的领域没有 扩张出来，自己的核心业务也受到了影 响。


    在2015-2016年之间，GoPro的硬件出了很多问题。比如它后来的旗舰产品Hero 5 代，作为一个运动相机居然在水下漏水，损伤了公司长久以来建立的品牌。


    更修的是，GoPro后来也看 到了无人机广阔的市场，于是也开始研发无人机项目。2016年年底，承载着GoPro新希望的无人机Karma上市。不 同于其他无人机的是，Karma的机身上并没有摄像
    头，而是通过机头的三轴稳定器连接GoPro的运动相机。很显然，GoPro的策略是希望借Karma来提升自家运动相机的销量。


    结果GoPro的这个美好蓝图仅仅过了十几 天就破灭了。因为当时用户发现，很多GoPro Karma无人机在飞行途中会突然断电坠机。


    虽然当时Karma 20分钟左右的电池续航能力确实一般，但其实GoPro已经设置好了，当Karma剩余飞行时间不足4分钟的时候会自动返回起飞地点，理论上不会中途断电。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '途断电。


    但问题就是问题，GoPro只好宣布召回所有卖出的Karma无人机，并且全额退款。


    后来经过检查发现，其实只是飞机上一个小小的固定电池的闩锁结构出了问题，修复起来非常容易。但毫无疑问，之后再上市的Karma无人机，是无法和大疆的产品系列相抗衡的。毕竟GoPro进军的是一个自己几乎完全陌生的新领域，而大疆已经是这个行业里毫无疑问的王牌了。


    最后，GoPro在无人机上的这个转型，也带出了它面临的最后一个困境——你肯定也想到了，在如今手机如此普及，性能越来越好，携带也越来越方便的时代，到底有多少人真的还需要GoPro呢？未来的拍摄市场的新爆发点，也许是无人机，也许是VR相机，也许是光场相机……但无论哪一个，都不是困境中的GoPro最熟悉的。而GoPro最擅长的运动相机市场早已饱和，它的未来之路又在哪里呢？


    所以，就像我们开篇时候说的，GoPro这几年迅速衰落的原因就是，核心产品受到巨大挑战的同时，又没有开发出新的业务线。这里面蕴含了一系列的失误和错误，但无论如何，这都是一个令人感叹唏嘘的案例。


    # | 结语


    当然，在文章的最后，我还是想为GoPro多说两句。


    纵观整个商业史，我们其实能看到很多公司陷落于低谷，蛰伏很久之后又绝地反击的案例。


    大家最熟悉的例子应该是苹果，当年它一度惨到四处兜售自己而没有人要，但现在已经是市值逼近一万亿美元的全球第一大公司了。


    如果你关注游戏产业，类似的故事还发生在日本游戏公司任天堂，和曾经的显卡第一品牌英伟达身上。这两家公司也经历过巨大的低谷，被市场和华尔街嘲笑，但他们一直坚持了下来，并且不断寻找新的机遇，最终等来了属于自己的“风口”。这两
    年买了任天堂和英伟达股票，并且一直持有的朋友，应该已经赚了个盆满钵满。


    所以，作为商业的观察者，我从来不会以一时的成败论英雄，也 spinal 不愿意随大流地鼓吹或者唱衰任何一家公司。商业本来就是非常复杂的事情，潮起潮落、跌宕起伏本来也是人生的常态。


    某种程度上来说，那句“创业的真正失败在于你放弃的那一刻”，是很有道理的。所以，我们也祝福GoPro能早日走出困境，而尼克·伍德曼和他的团队也能经历过失败之后，走向新生。


    张潇雨


    今天我们讲了GoPro在产品线策略、产品定位以及转型方面的失败，这些其实都是做产品的时候非常关键的问题。而在去年12月16号的周末互动里，我提到过一个我非常喜欢的商业作家，在我看来她的文章都非常值得学习。她就是著名产品经理，湖畔大学产品模块学术主
    任梁宁。巧的是，梁宁老师昨天刚刚得到开了一门大师课，主题就是“给每个人的产品课”，所以，如果你想学习怎么做产品，甚至摸透最核心的产品思维的话，推荐你点击文稿末尾的图，或者去得到首页看看梁宁老师的大师课。我们明天再见。


