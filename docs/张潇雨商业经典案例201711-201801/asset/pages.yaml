  md: '# 小败局 | 盛大游戏的"传奇"崛起


    小败局 | 盛大游戏的"传奇"...


    之前的专栏我们说的是周航和他的易到用车，诚实来说，虽然我们的专栏叫“小败局”，但对于周航来说，我从未觉得他是一个失败者，而且非常值得学习和尊敬。


    那么接下来三期的内容，我们就再来说一个，虽然在某种世俗意义上可以叫做“失败”，但实际也非常值得我们学习和尊敬的人物和案例，那就是陈天桥和他的盛大。


    # ｜陈天桥"弃仕从商"


    也许有点巧合的是，陈天桥和周航一样，也是1973年出生。不过和中途退出学业的周航不同，陈天桥从小就是个“学霸”。


    他出生在一个知识分子家庭——父亲是上海海导航仪器厂的工程师，母亲是新昌敬关中学的英语教师。陈天桥考上了上海最好的高中之一，然后又顺利上了复旦大学。1993年，作为上海市唯一的一“市优秀学生干部标兵”，陈天桥获得了提前毕业就业的机会。他成为了当年复旦大学18个提前毕业的优秀毕业生，这也是复旦历史上的头一回。


    后来，陈天桥靠代理网络游戏《传奇》开始登上新闻头条和报纸的时候，很多老同学都以为是同名同姓，因为在他们眼里，陈天桥是要走仕途的。


    # ｜失败的"网络迪士尼"梦


    回首我们讲过很多的商业史和创业史，你不得不感叹大势的重要性。


    陈天桥和马云、马化腾、李彦宏、刘强东、张朝阳都是在1999年前后踏入的中国互联网。


    # ｜正式进军游戏业


    当然，这时候的陈天桥也很难过过。由于资金紧张，他只能把50人的团队缩减到20人，留下的都是最早的员工，而且也只能拿80%的工资。所以非游戏部门的队伍全部被裁撤掉。


    而在这个最艰难的时候，陈天桥下了他一生中最重要的一個赌注——执迷于游戏的他，拿着和中华网分手后剩下的30万美元，和拥有《传奇》这款网络游戏的韩国厂商签约，全权在国内代理《传奇》游戏。'
