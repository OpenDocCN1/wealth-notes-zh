  md: '# 复习 | 亚马逊的制胜秘诀


    张潇雨


    咱们专栏从开始到现在已经半年多了，积累了很多内容，今天带大家复习一家以前讲过的很重要的公司——亚马逊。清单后面还有为大家准备的图解，欢迎收藏或分享。


    # —— 亚马逊清单 ——


    +   1. 亚马逊，总部位于美国西雅图，由杰夫·贝佐斯于1994年创立。以卖书起家，如今是全球最大的互联网线上零售商之一，在2016年《财富》杂志评选的全球最大500家公司榜单中排名第44。


    +   2. 亚马逊为什么利润率低？相比于利润，贝佐斯更在意自由现金流，就是把维持利润需要的支出去掉之后，剩下的利润。自由现金流是判断股票价值的一个重要指标，重视自由现金流的亚马逊上市20年，股票价值翻了600倍。


    +   3. 亚马逊的制胜秘诀：飞轮效应。亚马逊有三大核心业务，分别是会员服务、第三方卖家平台、和云服务。表面上看，这三大业务要么增加运营成本，要么给自己增加竞争对手，要么是赚不到多少钱，都不靠谱，但亚马逊的算盘是：有了第三方卖家的加入，会员的商品选择就会变多；选择多，会员就多；会员多，亚马逊卖的东西就多；卖的东西多，对供应商的压价权就越大；货便宜，会员就会更多……也就是说，这几个业务模块之间会像咬合的齿轮一样，形成有机地互相推动，一旦转动起来，轮子就会越转越快，这就是飞轮效应（Flywheel）。


    +   4. 亚马逊核心理念之一：拜客户教，也就是极度重视客户。重视到什么程度？亚马逊云服务的老用户——美国最大的超市之一塔吉特——决定放弃亚马逊的云服务，自己建云，结果，亚马逊不仅没有阻拦，还花了接近两年时间，帮塔吉特把所有的架构和数据从亚马逊迁走。


    +   5. 亚马逊核心理念之二：勤俭节约。亚马逊没有免费的午餐，工资只是业界平均水平，停车也没有补贴，很多年亚马逊的办公桌都是用便宜的门板拼成的。贝佐斯自己也一直非常节俭，有员工说，贝佐斯身家过亿的时候，还会拿着优惠卡在咖啡厅排队，自己买完还递给同事，让TA替自己集一杯咖啡。


    +   6. 亚马逊核心理念之三：超级接口化。亚马逊会把自己用的系统服务化、标准化，然后卖给外面的客户用。这样做有什么好处呢？以亚马逊的物流服务为例，当第三方卖家习惯了亚马逊的物流，就会离不开亚马逊，而亚马逊上的卖家越多，用户的选择就越多，亚马逊的会员就越多……这就又进入了飞轮效应的完美循环。


    +   7. 亚马逊核心理念之四：长线思考。在亚马逊看来，如果你发现了一个值得做的事情，而且10年后也值得做，那么它就值得你投入大量精力。更低的价格、更快的物流、更多的商品选择，对亚马逊来说就是那些不变的东西。


    +   8. 亚马逊的竞争策略：占优策略。什么叫占优策略？直接拿亚马逊来说，“多、快、好、省”就是它的“占优策略”，因为在竞争中，亚马逊只要掌握了这四点，对手无论做什么，亚马逊都可以按兵不动。


    +   9. 影响贝佐斯最大的两大思想之一：制造“可选择权”。举个例子来解释“可选择权”。亚马逊的第三方卖家平台业务，创立之初颇受争议，因为第三方卖家确实会抢亚马逊的生意，但在贝佐斯看来，如果这个业务没成功，亚马逊不至于伤筋动骨；但如果成功了，它能带来的回报就是巨大的。用可以控制下限的成本，去博一个没有上限的回报，这就是“可选择权”的精髓。


    +   10. 影响贝佐斯最大的两大思想之二：反熵。有机体都趋向于混乱，而企业是由人构成的，如果你不对这个组织采取任何措施，它就会慢慢走向混乱。亚马逊对抗熵增的方法可以概括成两个关键词：流动和开放。亚马逊的“自由现金流”和“可选择权”就是在打造“流动”；而“超级接口化”、“飞轮效应”就是“开放”。


    +   11. 亚马逊的终极野心：向所有网上的活动“收税”。复盘一下我们会发现，亚马逊的业务包括书籍、数码用品、各种百货；生鲜（刚收购的全食超市）、杂货、你的生活必需品；电影、电视剧、各种文娱产品；以及云服务。试问，作为一个现代人，你上网都要干什么？在亚马逊看来，你是消费者？请交给我99美元金的会费；你是商家？请交给我物流和仓储的服务费；你是作家或者导演？我们一起来制作好内容，我帮你发行；你是创业者或者大公司？云服务任意你取用。只要你使用互联网上的服务，你就得向亚马逊交税。


