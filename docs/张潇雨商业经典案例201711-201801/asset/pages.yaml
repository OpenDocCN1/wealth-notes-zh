  md: '# 复习 | 星巴克的成功秘诀


    张潇雨


    为什么星巴克的店都开得很密集？星巴克为什么横着排队？星巴克的杯型为什么是中、大、超大，而不是小、中、大？今天我们来一起复习一下星巴克的成功秘诀。


    # 1. 为什么说星巴克和麦当劳越来越像了？


    麦当劳推出了麦咖啡和全日早餐，星巴克也宣布认真进攻午餐市场，开启“免下车外卖”业务等，某种意义上说，星巴克和麦当劳已经成为了直接竞争对手。


    为了保住高端形象，星巴克做了两个布局：一是打造豪华咖啡宫殿“烘焙工坊”；二是大量开设“Reserve”甄选咖啡精品店，比星巴克高档不少。


    # 2. 为什么星巴克的店都开得很密集？


    星巴克的开店策略确实很激进一用大量的商铺侵略性地覆盖一个地区。这样做有三个目的：一，分流顾客，减少排队时间，给店内消费者提供更多的空间和座位；二，减少固定成本，每个星巴克都需要中央厨房的运营支持，而一旦设立了中央厨房，它能覆盖的门店越多，成本就摊得越薄；三，迅速加深消费者对星巴克的品牌印象。


    # 3. 星巴克为什么横着排队？


    一，不用担心看不到墙上的菜单，也不用担心不知道展示柜里放着什么、星巴克又出了什么新周边，还可以边看着边发时间；二，眼前的咖啡制作过程会让你格外觉得有仪式感、体验感，以及星巴克的咖啡值这个价钱；三，更方便你和其他顾客交流，甚至如果你看到前面一个人点的东西很有意思，就可以询问他是什么，好喝吗？


    # 4. 星巴克的杯型为什么是中、大、超大，而不是小、中、大？


    星巴克的杯型更地道的说法叫tall、grande和venti，来自意大利语。


    在一个社区群体里——无论是虚拟群体还是实际群体——有一套只有自己群体人听得懂的行话、黑话，会迅速提升人们的群体认同感。星巴克就是要通过语言的力量让你不知不觉爱上星巴克。


    # 5. 在星巴克工作和在其他地方工作有什么不同？


    在星巴克，无论职级高低，互相的称呼都是“伙伴（partner）”；在星巴克，无论是刚入职的员工还是店长，都要轮流收银、做咖啡、做清洁；在星巴克，区域经理也没有办公室，一般都是巡店的时候随便找一家店的一个座位开始工作；在星巴克，哪怕是兼职员工，符合最低工时要求之后也可以以折扣价购买星巴克的股票。这就是星巴克的企业文化——伙伴文化。


    # 6. 星巴克员工的围裙颜色不一样，这里有什么学问？


    绿围裙：普通店员。熟练掌握的技能包括咖啡知识和操作方法；


    黑围裙：咖啡大师。技能包括知道咖啡的生产地，咖啡豆的风味、故事，懂得如何给客人传授咖啡的文化和知识等。只有通过每年一次的笔试和面试，才能获得“黑围裙”的称号。


    咖啡色围裙：咖啡大使。这是星巴克最稀有，等级最高的围裙。每两年，星巴克会举行一个咖啡大使的比赛，比赛内容包括咖啡拉花、咖啡品尝、创意饮料、咖啡盲品、专业知识考核等等，只有胜出，才能获得咖啡色的围裙。一般来说，每年每个大区只有一个咖啡大使，而且期限只有两年。


    # 7. 人们为什么喜欢待在星巴克？


    社会学教授奥登伯格说：人们需要有非正式的公开场所，把工作和家庭的忧虑暂时放在一边，放松下来聊聊天。这就是著名的第三空间理论。


    在这一点上，德国有啤酒花园，英国有酒吧，美国有星巴克。


    # 8. 星巴克现在有什么困难吗？


    星巴克目前面临着两个困境：一，美国市场接近饱和，全球超过25000多家星巴克里，15000家在北美地区；二，想在咖啡上让大家增加消费很艰，毕竞再怎么营销，也没法让一个人从每天喝两杯咖啡变成喝五杯咖啡。所以，要提高营业额，星巴克只能从提高单店营业额和多开店这两方面入手。


    # 9. 如果让你用一个词概括星巴克的文化基因，这个词是什么？


    社交基因。星巴克从空间布局设计（桌与桌间的距离让你刚好可以和邻桌交流，又不至于因为太近而尴尬），到如何引导顾客排队（横向排队）、如何引导服务人员移动的路线（服务员会走到吧台前和你聊天），再到对产品的命名（tall、grande、venti），无一不是围绕着“社交”这个核心基因打造的。


    # —— 一张图看懂星巴克 ——


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_186_0.png)


    # “第三空间”理论


    > 人们需要有非正式的公开场所，把工作和家庭的忧虑暂时放在一边，放松下来聊聊天。一座城市有这样的“第三空间”，才能培育出自由、开放、平等的人际关系。——社会学教授奥登伯格

    德国有啤酒花园，英国有酒吧，美国有星巴克。


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_186_1.png)


    # “黑话”文化


    > 在一个社区群体里——无论是虚拟群体还是实际群体——都有一套自己的“黑话”，让人对群体迅速产生强烈的文化认同。“Tall、Grande、Venti”就是“星巴克族”人的“黑话”。


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_186_2.png)


    # “伙伴文化”


    > 在星巴克，不论什么职位，即使董事长在前也都互称“伙伴（partner）”；即使是店长也要轮值做收银、做清洁、做咖啡；区域经理没有办公室，巡店时随便找一家店的一个座位开始工作；即使是兼职员工，也有低价购买星巴克股票的机会；即使打碎了杯子收错了钱，一样会得到尊重。


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_186_3.png)'
