  md: '# 周末互动｜一起来做四个有趣的思想实验


    你好，欢迎来到《商业经典案例课》，我是张满雨。


    这两周，我们都在讲王兴这个人。在开篇的时候我说，王兴是我个人非常敬佩的一个企业家，同时他的思维方式和底层的哲学观也特别值得我们去了解和思考。希望这两周十篇专栏下来，你能对我当初说的这句话有所理解了。


    本期周末互动，我想讲个好玩儿的小东西。大家都知道王兴是个很爱看书的人，而且他有一个“思想实验”非常有意思，他是这么说的：


    > “我依然尽可能地多看书，商业管理有一些，小说有一些，读得最多的还是历史相关的书。看书对我而言是心灵层面的成长，不管我是CEO还是干别的事情了，有一些东西不会改变——我还是对事物充满好奇，有些事情对我来说，它的乐趣在于了解它本身。


    “我有一个朋友，他提出了一个概念，我觉得挺好的，叫人类文明体验计划：假设某一天你要代表地球向外星文明介绍地球，你是否理解地球上几十亿年下来的自然构成，以及整个人类历史演变当中的精华？你是否听过最好的音乐、看过最好的文学作品、欣赏过最好的艺术品，以及看过能代表人类文明尖端的城市？现实来看，虽然你不会有机会代表地球向外星人介绍我们，但这却不失为一个认识自己与世界的角度。”


    我觉得这个“思想实验”很有趣，因为很多时候这种思想实验可以更好地帮我们聚焦问题，思考问题，给出我们的答案。这里面王兴采用了一个“人类文明体验计划”的概念，帮自己厘清了一个很重要的问题，就是人生在世到底需要做点什么事情，体验一些什么东西才好。


    我觉得这种思维方式很赞，碰巧，我自己也有一些经常做的思想实验，所以我就顺着王兴的这个“思想实验”的思路分享给大家。


    我经常被问到一个问题：“如何确定自己真正想做的事情是什么？”当然我之前说过，期待别人能理解你的境况然后给你一个标准答案是不现实的，因为每个人的判断优先级都不一样，你是很难真正了解其他人的。不过，我也可以通过做四个小的思想实验的方式，来分享一些对于这个问题的思考方法。也就是说，如何确定自己真正想做的事情是什么？


    # 思想实验一：如果此刻就把做这件事情的附带结果都给你，你还愿意继续做它吗？


    举个例子。比如你现在天天跑健身房，特别有动力，特别坚持。结果有一天你正在跑步时，突然出现了一个外星人。这个外星人拿着一颗药丸说：现在你吃下这颗药，就可到死之前都能保持理想的身材和很好的身体机能了，没有任何副作用。唯一的要是就是，一旦你吃了这颗药丸，就再也不能健身了。这时候你可以想一想，你会愿意吃下这颗药丸吗？


    实际上，这个问题辨析的是结果对动机的影响。或者说，你做一件事情的主要目的是这件事情本身还是它的一些附加属性。比如我常常见到很多说自己喜欢做金融的人，很多时候他们都会直接说，你喜欢的不是做金融，是做金融带来的其他东西。就是这个道理。


    # 思想实验二：如果有一件事情你只能默默做，不能告诉任何人，你还愿意做它吗？


    还是举个例子。比如你觉得自己特别喜欢旅游，我好像几乎没见过不喜欢旅游的人。那么现在又有一个外星人出现了，TA告诉你说：现在我就可以给你无穷尽的资源来让你旅游：比如时间、健康、钱、全世界所有国家甚至外太空的永久有效的签证等，但是唯一的要是就是你不能和任何人讲挪和展示其中的细节（最基本的告知还是可以的，但是不能展示任何细节）。那么你还愿意旅游吗？


    这个问题是用来区分内在动机和外在动机的。说白了就是，你做一件事情的源动力是来自分别人的眼光和看法，还是真正来源于自己的内在驱动力。这个思想实验也是我自己在做判断的时候经常使用的一个。


    # 思想实验三：假设你想知道某件事A，是不是你真正喜欢做的事。现在你可以想象一个你同样很喜欢做的事，B。然后你可以问向自己说，假设有一个外星人和你说，现在TA可以给你提供无限的资源，在你剩下的人生里慢慢帮助你把A做好，但前提是你这辈子再也不能做B了。你愿意答应TA？


    这个思想实验就更加直白了，它其实就是在直接对比你对两件事情的真实看法，或者说，你对做好一件事愿意支付多大的代价。我一直说，怎么判断自己真正喜欢什么，不是它给你带来多少轻松愉快的感受，而是你愿意为这件事情放弃什么，牺牲什么，付出什么。


    # 思想实验四：如果你注定十年后会死掉，那么你还愿意做某件事情吗？


    有些听众可能想起了乔布斯的演讲，他曾经说过要把每一天当做最后一天来活。我很能理解这种想法，不过觉得这个限制条件有点严苛了。毕竟我要只有一天可活，肯定用来和我爱的人们告别了。所以我自己把条件放宽了一点，就是假设一个外星人告诉你说，不好意思你十年后就会死掉，那你觉得现在应该做点什么呢？如果你能找到这么一件事情，可能就是你真正应该做的那件事情了。甚至你都不应该等到还有十年可活的时候再做，而应该是现在。


    好的，这四个我自己常用的思想实验就介绍完了。这里要特别说明一下，这四个思想实验主要的目的 negociação帮助我们思考，并不是说所有事情都要四个问题打上勾才能做，或者说每个问题的答案都是绝对的100%才能做，否则都不许做。真实生活是不会那么非黑即白的，但重要的是形成一个思维框架，然后不停歇地询问自己的内心。


    另外，昨天也就是11月30号我做了一期直播，直播之后应该有很多新来的同学，欢迎大家在未来一起学习。如果你昨天错过直播了也不要紧，直播的精华文字版会在明天同一时间更新，欢迎你们来看。而且非常感谢昨天在直播中支持我的同学，答应寄给你们的签名书下周就会给大家寄出，获得签名书的同学名单也会在明天跟直播的文字版一起公布。


    最后，给你准备了一张关于王兴创业历程的案例梳理图，梳理的内容是上周讲过的案例，欢迎你学习、保存、分享。


