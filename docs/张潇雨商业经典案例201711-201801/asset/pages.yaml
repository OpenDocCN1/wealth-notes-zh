    \ Y.（点赞数7），大生（点赞数6）\n\n# 京东 | 高瓴资本张磊的投资智慧\n\n提到张磊，就应该提到大卫·斯文森，他是真正的传奇。桃李不言，下自成蹊，这用来形容斯文森也非常合适。美国十大校产基金里有七个是他和他的徒弟在运营的。作为校产基金双璧，即鲁校产基金与哈佛校产基金完全不同。哈佛校产基金好比对冲基金，完全市场化操作，薪酬也按对冲基金的市场标准，管理人能拿到上亿美金收入。斯文森管理着260多亿美金的耶鲁校产基金，而他自己一年收入不过几百万美金，与市场薪酬完全不成比例。他使校产基金与耶鲁大学和谐共生，自己也收获了威望和尊敬。守正用奇，就是以正和，以奇胜。张磊的非常幸运，在耶鲁找到自己的志向，又遇到了伯乐和导师。耶鲁校产一方面对投资对象非常了解，也经常是刚刚设立的基金的第一个投资者，一起打造结构，创造文化。这些刚刚设立的基金也是最有激情的，而耶鲁校产基金外部管理人员表现最好的往往属于这一类。张磊成立高瓴资本时毫无投资记录，斯文森拍板投资1000万美元，获得高瓴回报。一方面研究基础扎实，另一方面注重方式创新，这也是做人的智慧吧。\n\
    \n# 京东 | 为什么要自建物流\n\n如果由老师上周五直播里讲的四个核心概念来看刘强东自建物流的一意孤行，答案就会非常的清楚简单。这四个概念就是风险、回报、成本、时间。风险：中国没有UPS，没有Fedex，而且国内的物流成本相比国外奇高无比，所以做这个事的风险很小。回报：自己的物流还能对外提供服务，回报没问题。成本：自建物流的成本很高，但一旦建成，会形成很高的壁垒。时间：自己的物流体系，时间可以是永远。显然刘强东就是看清了这几悀点，才那么一意孤行的。对于如何抵抗周边的压力，去实现自己的一意孤行，我的体会是尽快做出一个阶段性的成"
