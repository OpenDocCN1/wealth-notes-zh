  md: '# 京东丨从线下到线上


    今天我们开始讲一家新的公司，京东。


    相信和之前的阿里、美团一样，京东也是你非常熟悉的一家公司了。现在刘强东和他的京东，在中国已经是可以和阿里巴巴分庭抗礼的一家非常大的电商公司了。更准确地说，是一个以零售为核心业务的平台型公司。相信未来阿里和京东的竞争关系也是商业世界里非常重要的一各看点。


    之前我们梳理过整个零售行业，也讲解过阿里巴巴，我觉得这些背景知识对于了解京东的业务逻辑和未来走向已经比较充足了。想要复习的同学可以重看看看我们之前“美图零售简史”专题，还有一期周末互动《刘强东的“终极零售”观》。


    当然，这些你还没看过也没关系，这周我们来讲京东，主要会从两个角度切入，第一个角度是：京东从哪里来？因为我们反复说过，了解一个企业最重要的就是了解它的历史；第二个角度是：京东在历史上最关键的几个瞬间。了解了这些瞬间之后，你应该对商业这件事会有不同的认识。


    今天我们就来讲：京东从哪里来？


    # 丨京东多媒体


    很多人可能不知道，其实京东的创始人刘强东在1998年就开始创业了。那个时候，中国最火的互联网公司叫做狐，张朝阳刚刚成为了《时代》杂志评选的“全球数字精英50人”；大洋彼岸的谷歌才刚刚诞生，连马云还在扛着他的中国黄页，阿里巴巴还没有影子呢。


    准确的时间是1998年6月18日，当时24岁的刘强东带着工作两年攒下来的12000块钱，在北京中关村租了一个4平方米的摊位，开始了自己的创业。当时的京东还叫京东多媒体，主要的业务是给婚纱影楼的视频编辑提供硬件和系统，后来公司业务扩大，刘强东开始卖光磁产品、刻录机和录像机这种东西。


    熟悉京东历史的同学们可能知道，京东很长一段时间主打的产品品类都是3C数码产品，这和刘强东早期的创业经历很有关系。


    另外，刘强东还把早年创业经历里的一些习惯带到了后来的京东。


    +   1. 坚持正品。


    从中关村市场开柜台的时候，刘强东就坚持做正品。他每一笔销售都会开正式的发票，曾经工商局还来京东查过三条，发现他们没有逃税，没有水货，没有假盘。


    其实，当时光盘仿制非常简单，用空白光盘和丝网印刷做上logo，再做个和正品一模一样的包装就行了，利润是正品的几十倍。但是刘强东觉得自己做的是个长线的生意，所以拒绝这么做。


    +   2. 坚持低价。


    刘强东一直很相信价格的力量，所以哪怕是在草创初期，他就很爱打“价格战”。


    在线下做刻录机代理的时候，京东经常上午一个价格，下午一个价格，把其他代理商都打残了，最后做成了独家代理。别人都想的是一笔赚多一点儿，刘强东想的是怎么赚少一点儿，这样别人才抢不走他的客户。


    当然，为了维持低价，刘强东和自己的团队也非常节俭。


    +   3. 好的服务。


    当时刘强东还不懂什么叫“用户体验”，但是他和团队服务客户的时候一点也不含糊。


    # 丨从线下到线上


    当然，在京东创业的早期阶段。刘强东做得最正确的决策还是，从线下转到线上，成为一家电商公司。


    其实这个转变说偶然也有点偶然。在2003年的時候，北京爆发了非典疫情，结果全城的零售业全部遭受重创。中关村卖家所有产品都大量积压，京东不到一个月就亏了800万，当时公司账面资金只有两三千万，再过两三个月就要死掉了。


    # 丨彻底转型电商


    在2004年，尝到了互联网甜头的刘强东想要把公司线下柜台全部关掉，彻底转型电商。主要原因就是他觉得线下的用户体验不好，而电商的体验远远超过线下，足不出户就能买到商品，还有发票。'
