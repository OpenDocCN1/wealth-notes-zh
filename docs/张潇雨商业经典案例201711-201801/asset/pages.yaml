  md: '总结过，当时他们犯了几个错误：


    错误一：用了一个豪华团队创业。


    要技术有技术，要经验有经验，跟百度单挑过，还融来一大笔钱。但带来的一个问题就是心态浮躁，觉得自己无所不能，好大喜功。可互联网是不断变化的，经验往往靠不住，创业者必须有随时归零的能力。


    错误二：奇虎还是以平台化的思路为主，没有聚焦一个切入点。


    而平台型产品在最开始的时候，一定是通过打动用户的某个点来切入的。


    后来周鸿祎在总结这一段教训的时候这么说道：


    > “女人生第一个孩子要怀孕十月，生第二个孩子也要怀孕十个月。但我们在生第二个孩子的时候，就觉得自己有经验了，加大努力两个月就能生出来。这是很严重的错误。事后来看，如果当时稍微专注一点，能把这当中任何一件事情坚持做下来，那也会成为一个不小的事业。可以说，当时我们把一个创业者该犯的错误都犯了。有一次，著名的投资人王功权和我说：‘我也不懂你们的业务，但是我们给你投资，是希望你做点与众不同的东西。结果，你好像做了一个新浪，又做了一个百度，又做了一个阿里巴巴。你准备和大家都竞争吗？你们能同时做这么多东西吗？’他的这些话，当时对我而言如醍醐灌顶，当头棒喝。”


    然而好消息是，就像当初の王兴一样，周鸿祎虽然在奇虎出师不利，但是他明确了自己的思想，也保留了一支非常有战斗力的队伍。而这也保留了火种。


    马上，周鸿祎就要找到他的安全软件业务，也要碰上他宿命中的敌人，腾讯和马化腾了。


