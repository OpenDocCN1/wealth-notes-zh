  md: '这么多年过后把中国整个的电商水平抬到了非常可怕的程度。现在如果说中国有全世界第一位的电商生态系统，可能反对的人不会太多。某种程度上，这也是阿里对整个社会的贡献。


    自此之后，阿里真正地成为一个无处不在的大公司，它和腾讯一起，构成了中国互联网的两极，在深深影响着我们每个人生活的同时，也在所有创业者和小企业之上笼罩了一层阴影。


    当然，阿里巴巴在之后还做了很多事，在这里我们必定无法全部讲述，不过其中有一些很有意思的转折点、事件和人物，还是很值得放大看看的。所以在这周框架性的梳理之后，下周的专栏我们就进入更细节的部分。'
