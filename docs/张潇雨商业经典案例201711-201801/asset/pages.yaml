    正的offer才行，口头承诺不能做保证。对 于营造竞争环境也是非常重要的，让潜 在的意向公司知道除了他们自己还有别 的公司也要请你。这样不仅让你在谈判 的时候更有筹码，同时也让公司知道自
    己的决定是正确的，不只是他们有意向。我们也不应该过于在意工资，因为工资总 是围绕着你的工资上下浮动的。而浮动 得太高，容易让人浮躁，这反而影响你的 表现，让你把注意力放在不重要的地方。
    进入融资模式也是很重要的，一边找工 作一边在工作容易两边都做不到，虽然 感觉对自己比较有利，可以无缝地连接 两份工作，但是也容易让你不能接触更 多的公司。最后一点是，就算是对方最后没
    有聘用你，也不要耿耿成怒，未来也可能 有合作的机会。


    美国神剧《硅谷》就曾描述有一家明星公 司由于拿了过高的融资，而导致第二轮 进入了down round，最终公司经济链断 裂CEO下台，而主角的公司拒绝了过高报
    价算是捡回一条命。


    我的理解：创业就资金方面可以分为两 类，融资创业和非融资创业。作为融资创 业，开始了就必须延续，并且有信心有力 量把主业务做好，切忌去拿别人的钱来 玩，玩死了不负责任，这样的结果最终自
    己受害。在熟知的圈内，很难有人再信任 支持到自己！非融资创业虽然慢，但自 由，没有信任压力，可以更多尝试选择， 当主业有了方向和起色后，再来决定是 否发展快而融资。我会选择后者。


    # YC | 关于如何融资的六大要点（上）


    创业公司和投资者是机会和资本之间的 博弈，谈判时自己掌握的谈判筹码越多 越处于有利地位。今天讲的融资的三个 要点就是在帮助创业公司获取筹码。本 质上获得的offer越多，创业公司的价值
    就会越高，被投资的稀缺性也就越高。从 双方在融资成功的那一刻起相当于达成 了一个价值挂钩，以此为起点投资者赌 的是沉没成本的边际收益是递增的，在 这一刻起创业公司的利益才真正和投资
    者绑定在了一起。


    面试和投资有很多相同之处，无论是采 取先低后中高，还是先中高再低，无论是 先练习获得一些经验，还是直接进入攻 势节奏一并拿下的状态，其实这些方式， 都需要有两个前提，一方面是自己要做
    好充分的准备，不能敷衍豪混不当时事， 二是自己充分自信，有积极的态度，相信 自己的能力，相信自己能把事情做好，相 信自己做的事情对其他人，对人类是有 价值的，是社会需要的。


    +   1.低调的待价而沽好过高贵的焦头烂额；

    2.占到坑才能跟人一起赛跑。


    体会：1.《孙子兵法》里面说“夫未战而庙 算胜者，得算多也；未战而庙算不胜者， 得算少也”。在未开始之前就需要占据至高 的大局视角（庙算：在庙堂之上的顶层多
    视角群策讨论）去谋算自己的胜面，这也 是一次全面梳理自己和市场关系逻辑的 过程，在这个基础上对融资的诉求才会 有较为清晰的概念，从而为自己量身分 出优先级。2.开始进行融资后又是第二次
    从投资方的视角来梳理自己和市场的逻 辑关系，所以即便有优先级之分，也要全 力以赴地对待每一次融资，这些融资过 程也是迅速调整自身的机会，最后把握 好时机一蹴而就，拿下第一座城池。


