- pgno: 189
  md: '# 谷歌 | 人工智能时代的两大挑战


    在之前的专栏里，我们给谷歌这家公司的本质下了一个定义——一个通过提供各种服务，赚取广告收入的公司。


    而这种模式的公司最重要的就是，努力触达所有可以触达的用户。所以这意味着，谷歌的产品应该在所有地方出现——不管是安卓、iOS，还是三星、小米，都是谷歌的朋友和伙伴。像苹果那样搞封闭系统肯定是不对的。


    但是，这个战略定位在马上到来的人工智能和机器学习的新时代，突然在逻辑上又有了一些问题。而我们也能从谷歌的产品演进历史上看出这一点。


    这其中到底发生了什么呢？我们今天来说一说谷歌面临的挑战。


    # I 好技术=好产品？


    实际上，当我们在谈论谷歌的时候，我们经常会说，谷歌是技术最强的科技公司。这一点哪怕在iPhone风头无两的智能手机时代，大家也不会否认。2017年AlphaGo战胜人类顶尖围棋选手柯洁，更加深了大家的这种印象。


    但实际上，很多人没有意识到的一个东西是，虽然谷歌确实技术非常好，但好技术永远不等于好产品，更不等于好公司。历史上有太多技术也非常好，但由于做不出好的产品，或者做出来的产品找不到商业模式而死掉的公司。我们可以看看如今最重要、最大的几家科技公司能够存活下来，是不是因为技术好的缘故：


    对于微软来说，当年比尔·盖茨和保罗·阿伦的第一个产品叫Altair BASIC，大家最熟悉的DOS系统其实是买来的。1983年的时候，微软谈下了一个生死攸关的大单，就是给IBM公司提供操作系统。从那里开始，抱上了大腿的微软才开始了自己二十多年的辉煌历程。


    亚马逊的故事你可能更熟悉。贝佐斯根本不是技术出身，但看到互联网大潮的他认为，做一个“万货商店”可能很有前途。当然亚马逊的技术也不错，但是对于一个二十年前的电商来说，决定从书这个非标准化的品类开始，以及提供好的物流和售后服务，都比技术本身更加重要。


    同样对于Facebook来说——扎克伯格当然是个天才工程师，但是他的第一个CTO，扎克伯格的室友达斯汀·莫斯科维茨，连编程都不会。Facebook起家的真正原因是它在早期完全复制了线下的关系图谱，这让人们可以把很多社交行为搬到网上来。某种程度上说这和贝佐斯线下的购物行为搬到网上是一样的。技术起到了作用，但是这种从哈佛大学开始、实名制、复制真实的线下社交关系的路径更为关键。


    苹果就更不用说了。伟大的产品、领先的设计和创始人​的远见从来都是这家公司最被人们称道的地方，而技术只是实现这些东西的工具罢了。


    # I 谷歌是例外吗？


    但是看起来，谷歌好像是最大的例外。


    谷歌的起家，完全就是技术驱动的。毕竟当年Yahoo搜索是市场第一，谷歌的超越好像的确是因为技术好，搜索结果最合理，产品体验高出其他竞争对手一大截。而且这么多年以来，谷歌的产品设计经常有人吐槽，但是技术能力没人会质疑。所以，谷歌到底是不是个例外呢？


    # I 谷歌和用户的连接在哪里？


    # I 谷歌面临的到底是怎样的挑战？


    +   1. 和用户的联系变弱'
