  md: '去做“的清单来（ not-to-do list）


    到这里，你终于完成了绝大部分的流程，但行百里者半九十，这最后一个步骤也是非常重要的。


    刚才你已经划掉了20件你有些兴趣但最终决定不作为最高优先级的的事，现在，基于它们，你应该列出一个以后“一定不要花时间去做”的清单来。如果你决定了在未来一段时间专心把做PPT的水平提高，就先不要想着练习PhotoShop的技巧，虽然这看起来也在“努力”。当你有了这么一个清单之后，以后再面临各种各样的“诱惑”，就可以很坚定地进行选择了。放弃很难，感动自己则容易得多。


    最后，一点心理学上的小事。


    任何“自我提升”方面的东西都是知易行难的。我知道哪怕这篇文章已经努力地把这个过程写得明白，但离读者真正做到也是不那么容易的。很多时候，是否能做到是个心理问题。我在想，完成这件事，大概有三件事需要克服：说“不”的能力；抵抗“害怕错过”的能力；以及行动的能力。


    祝你好运。记住：


    You can do anything. But not everything.


