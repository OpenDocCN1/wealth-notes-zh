  md: '# 周末互动 | 刘强东：所有的失败都是人的失败


    周末互动 | 刘强东：所有的…


    你好，欢迎来到《商业经典案例课》。我是张潇雨。


    这几周我们讲的都是中国的公司，这周的主角是京东。


    从写法上来说，由于大家对这些公司往往非常熟悉了，所以我在写专栏的时候更注重回到历史，而不是随便对一些正在发生的事做些什么点评。这里面的原因有两个。


    第一，我们专栏的作用应该是启发大家的兴趣，在听到某家公司的时候能自己去扩展地研究，而不是就止于专栏了，而这些中国公司的资料网上一大把，大家应该学会自己去看、去理解；


    第二，我们专栏叫“经典案例”课，不是时事点评课。本质上郜政和我在商讨这个专栏的时候就希望这个专栏的内容在几十年后看也是成立的，所以我尽量不追热点和时事，毕竟互联网公司节奏快、动作多，很多事情再过一两年看意义就不大了，比如当年火热了一波的O2O。所以，守住“经典”的部分才是最重要的。


    # —— 演讲原文 ——


