    # 失败原因五：动机错误


    杰西卡是这么说的：


    > “我发现，非常成功的创业者，和一般成功的创业者以及失败的创业者之间，往往有一个很大的区别，那就是他们的动机和动力来源往往不同。特别成功的创业者，往往也不排斥靠创业发财，或者希望自己看起来特别酷，但他们一定会有些其他的动力，比如非常热情地喜欢和信仰自己做的事情。”


    当然杰西卡也说，如果你是为了钱开始创业，也没有一点问题。但在整个过程中，你的动力一定会慢慢变化，否则你不会真正的成功。


    当然这背后的原因有很多：比如动力很强的创业者往往会非常努力地工作，因为往往他们不觉得这是“工作”；还有，由于不只是为了钱，他们也会更长时间地思考；另外，他们也会拒绝那些能让他们发笔小财的机会，比如大公司的收购，等等。


    可以说，随着年龄的增长，我也越来越相信这一点。


    因为如果你看到了周航的故事，看到了陈天桥的故事，看到了张朝阳的故事，就会发现这些曾经走向人生巅峰的企业家，最终也都要找到自己最核心的那个动力，也都要找到自己存在于这个世界上的意义。


    所以，做人们想要的东西、保持专注、量化以及监测你的目标、保持你的花销和欲望、找到属于自己的那个动机。做到这五点的你，生活是一定会有所不同的。


    # —— 本周留言精选 ——


    # 小败局 | 天生赌徒李途纯的两次豪赌


    那个时候是中国饮品行业的高速增长期，与之前后的有娃哈哈、乐百氏、健力宝、椰树椰汁、露露杏仁露，还有什么沪港可乐（时间上可能不太一致）、牵手果蔬汁、汇源果汁、红牛、旭日升冰茶、农夫山泉、蒙牛、银鹭等一大批新型的国产饮品，不过现在还能见到的真不多。得益于中国的改革开放，那个时候可以说所有的行业的发展都突飞猛进。按现在的说法就是风口，很多猪都飞了起来，只可惜没有翅膀的最后都掉下来摔死了。这个翅膀我想就是企业领导者具有的真正的战略、管理及经营能力了。那个时候的企业家大多数都具备几个相同的特质：胆子大、敢打敢拼、扩张无度、疏于管理等。现在想想，风口真的很重要，但一定要记得飞起来之前有一对翅膀更重要。


    今日商业心法分享：1.天生的野心家和理想主义者，也是天生的乐观派。能够因为高飞而痛哭流涕的人，绝不是一般人，一定是那种有非常强烈的渴望成就自己的人，一定是那种有情怀的人。而商业本质上也是一场对未来的预测，只有那种“盲目”相信未来的人，才有可能驰骋商场。不过，有些人是基于理性的市场分析
    and 用户洞察，有些人如李途纯是通过冒险的胆魄和激进的手段（变卖家产、基于扩张、好大喜功）。2.不达目的誓不罢休。永远相信“法力总是比问题多”，剩下的就是去做，死死盯着目标一路做一路调整和优化战略。


    先祝老师和全体同学新年快乐！每每听到创业成功的故事，总是憧憬；每每听到创业失败的故事，又会引起反思。正如孔子所说的：“见贤思齐焉，见不贤而内自省也。”第一，花钱漂亮太难。《闾微草堂笔记》有个故事讲一位书生突然有了一笔钱，很富足，但有个小鬼说：别看他得意，etter会就会花在妓女上而变得一无所有。我们的格局、对时机的把握，以及做事的魄力等等，能聚集多少资源将我们推向什么位置；反过来，资源到来我们又怎样去花钱才能实现增值，不去被耗损。我觉得“花钱”要花得漂亮真的很难，我们的情商能支持我们多远，持续基业长青。第二，多谋能否善断。李途纯虽然来了一场“小败局”，但他也是那个时代的“弄潮儿”，也算精彩的经历了，然而他看似不懂经营，过度扩张的豪赌，让我想起历史上多谋寡断的人创业都比较艰难，而独断有勇的人守业又容易失去方准，两者之间的关系真是难言。


    成功者的成功都是有方法论的，而赌徒只是在赌一个概率，就像掷硬币一样，每次的概率都是独立的，只有百分之五十分。李途纯，就好象股市当中刚进入股市的新手自己投资的两次，两次买进卖出都赚钱了，就以为自己很牛，所以以为自己第三次、第四次的豪赌都依然会赚钱，其结果可想而知。所以在股市当中，很多人都是赌徒，他们每次买入和卖出的概率都是独立的都只有50%，而股神巴菲特和他的合伙人芒格却是有一个自己投资所独特的方法论，那就是价值投资。只做黄金融才圈的事情，只做自己认为获胜概率更大的事情。


    # 小败局 | 从明星企业家到锒铛入狱


    看了李途纯的故事，也去查了一下文中提到的几位风云人物的历史，令人唏嘘。这些人不缺之能力，也不能说没有运气，也曾叱咤风云，但结局都比较悲惨。这其中不仅有时代的问题，也有体制政策的复杂原因，但更多的我觉得还是人的问题。一方面是性格的原因。一是好大喜功爱奢华，追求面子上的好看，忽视“里子”的扎实，最终“里子”没了，也就没了面子。二是赌徒心理，赌赢了固然要继续赌，赌输了更是要继续赌，想着靠赌博翻身。三是无视法律，他们这一类的企业家，大多信奉的是江湖规则，对法律既不慑也不屑，时常游走于灰色地带。另一方面是经营管理体制上的问题。一是不注重管理，跟著时代走，躺着都挣钱的人怎么会觉得管理很重要，大多是放养的心态；二是管理体制不健全，很难想象现在哪一家企业能发生1000多名业务员联手经销商虚报营业额的事情。健全的财务体制、监督管理体系是一个企业健康发展的基...三是与国企、政府剪不断理还乱的关系。这就是把双刃剑，好的时候人捧，人都来分一杯羹，不好的时候就是人踩人，大家都来踹一脚。多了解一些这些曾经失败的企业家的故事，可以让我们把商界的逻辑看得更透彻。


    李途纯的失败让人扼息，从红极一时到顷间陨落，太子奶的失败可以说是多种因素共同作用的结果。比较有感触的有以下几点。随着企业规模的扩大，创始人的能力圈能否及时地得到提升更重要，因为这决定了一个企业所能达到的上限。以当前的互联网界为例，国外的谷歌、Facebook和亚马逊，其创始人或掌舵者无不拥有超越一般人的思考力以及视野。国内的腾讯和阿里巴巴亦如此，曾经三足鼎立之一的百度已经明显落后。企业的现金流非常重要，在谈太子奶的商业案例时，时常想起贝佐斯和巴菲特老爷子强调的现金流。太子奶危机直接起因便是现金流的问题，通过融资来解决只能是饮鸠止渴，前两年乐视疯狂扩张的步伐跟太子奶颇为相似。此外，企业如何处置商关系也是一门学问。


    今日思考：李途纯虽然取得了非常大的成功，但这种成功与陈天桥的成功完全不能相比较；从现在的角度来看李途纯不是一个合格的企业家。首先是对风险的管控，无论是盲险投资，还是从花旗借款等事情可以看出，李途纯只看到了事情达成的一面，并没有对潜在危机进行管控；其次企业战略管理上，没能做到抗拒诱惑，什么都想做，是他屡次失败的原因之一；最后李途纯对企业家的理解，对人性的理解的深度还远远不够。其实李途纯是一个很好的将才，能够很好地开拓一方疆土，但守不住城池。


    > 巴菲说过：“衡量一个人是否成功，不是看他到达顶峰的高度，而是从顶峰跌落谷底的反弹力！”但其实一个人在他成功后的表现，也决定他能到达的高度。李途纯的《千年构想》现在看起来更像是一个笑话。任正非值得尊敬的地方就是，他常提醒说：华为为什么问题不解决，华为会面临倒闭的风险。《孙子兵法》里这句话更为实用：胜，不骄；败，不馁；胸有激雷而面如平湖者，可拜上将军！中国改革开放40年，获得如此巨大成就，除了天时、地利、策略等因素外，还有一个重要的因素，那就是出现了一大批的企业家群体。相比类似李途纯那样成功后倒下的企业家，那些倒下了又能够重新站起来的更让人钦佩不已。巨人的史玉柱、红塔的褚时健、联想的孙宏....每每想到他们'
