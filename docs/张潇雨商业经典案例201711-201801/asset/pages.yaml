    # YC | 如何看懂投资意向书（下）——什么是创业者最重要的品质


    万老师的日课这两天说的是信息，在我看来，依循宇宙的规律，折腾不息，让自己的信息量大更广，是让人生更有价值的好方法！很多的人生成功者都有类似的规律，屡败屡战，最后成功！创业也好，追求自己的梦想也好，要想人生发光发亮，唯有坚持不懈，扩大自己的信息量和不可预测性，死磕自己愉悦他人，天上不会掉馅饼，真正在生命里的收获和付出永远成正比！


    今天是创业模块最后一期，昨天也在想这个问题，创业者最重要的品性是什么，今天也得到了所想的印证。1.不论创业者才技各异，总有一点让人啧啧不已，就是孔子赞叹颜回的精神："人不患其忧，回也不改其乐。"这种状态最好还是本能的，即当你面对困难都没有第二意识来暗示自己要保持乐观，你的条件反射（第一反应）就已经在乐观状态。2.创业时面对未知需要通过"试错"来获得真知，这种野蛮式的生长，由信念来引路，又要有乐观来承托，即建立刻对待世界的正确态度：乐观和勇敢。至于是能否有智有谋，我想应当建立起勇气，正义和善良的品格，一定会支持我们在一一次次"试错"中，获得开悟的机会，而不是中道而废。3.智者无困厄，圣人无死地。正因为有所欲为，所以不以物喜，自强不息；也正因为有所不为，所以不以己悲，厚德载物。谢谢张老师的辛苦授课，期待下期继续学习。


    坚持，是因为喜欢。如果不喜欢，也很难坚持。创业也好，写作也好，都是长期工程。希望一天两天就能出成果，不现实。所以，长期这个概念非常重要。我们需要用长期的眼光，来看待我们所做的事。不管做什么，如果能够以10年的时间，来持续，那么，短期内的失败、打击、低迷、低谷都不算什么。由长期这个概念，可以深入复利这个概念。所以长期很重要，是因为有复利在。每年能做到复利15%，就非常不错了。巴菲特的目标，就是每年15%的复合增长率。当然，实际上他做到了19.8%，持续了50多年，这就让他成为了股神。


    美国作家 JONH STEINBECK 说过下面这段话，我觉得很深刻地说明了人性与成功之间的关系。The things we admire in men,
    kindness and generosity, honesty, understanding and feeling, are the concomitants
    of failure in our system. And those traits we detest, sharpness, acquisitiveness,
    meanness ,egotism and self-interest, are the traits of success. And while men
