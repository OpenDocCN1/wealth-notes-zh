  md: '# 小败局｜雷士照明的资本“局中局”


    小败局｜雷士照明的资本“...”


    我们继续来讲雷士照明与吴长江的命运。之前的专栏我们说到，经销商的介入让雷士的命运峰回路转，本来要出局的吴长江杀了一个回马枪。而公司的另外两个创始人胡永宏和杜刚刚不得不接受了拿着现金离开公司的安排。


    不过，在付完第一笔一个亿的股权买断费之后，雷士的账面上只有几十万了。如果不能马上获得流动资金，雷士照明和吴长江可能就会像《大败局》那本书里面描写过的爱多VCD和它的创始人胡志标一样，一旦供应商信心不足，公司就得倒闭。


    从2005年年截至2006年下半年，吴长江把全部精力都放在了找钱上。他甚至借过5分的高利贷，天天晚上做噩梦，但是白天在员工面前还要装作什么事都没有。


    2006年3月，吴长江到联想集团拜会了中国商业历史上教父级的人物柳传志。他一五一十地把雷士的情况告诉了柳总，柳传志很欣赏这位后辈的魄力与决心，考虑用旗下的联想投资来入股雷士照明。
    不过像联想投资这样的正规投资机构，决策程序一般都比较长，为了救急，柳传志还拿线朋友借了吴长江200万美元。后来吴长江一直很感谢柳传志。


    当然，仅仅200万美元根本无法解决吴长江的问题。这个时候，一个神秘的女性出现在了吴长江的世界里。她的名字叫“毛区健丽”。


    # ｜毛区健丽的“小算盘”


    毛区健丽成立了一家叫做亚盛投资的机构，主营业务其实就是金融 fatos， 帮助企业融资等等。


    毛区健丽从2005年年底开始就接触了吴长江，对雷士内部的各种问题非常了解，当然也知道公司极度缺钱的情况。于是，她慢慢承担起了帮助吴长江融资的任务，外界戏称她是雷士的“金融保姆”。甚至为了显示诚意，毛区健丽还借给雷士2000万元，帮助雷士进行资金周转。


    然而资本从来都是无利不起早的。毛区健丽有自己的“小算盘”。


    她一直和吴长江吹风说，联想的投资决策很慢，自己找来的投资人3个月钱一定到账。而吴长江几乎没有任何与资本打交道的经验，所以就听信了她的话。


    接下来，毛区健丽找到了三个愿意出资的投资人：“涌金系”掌门人蔡东的妻子陈金霞、优势资本总裁吴克忠、个人投资者姜丽萍，他们三人合计出资400万美元投资雷士。


    毛区健丽向出资人承诺，投入这400万美元可以获得雷士10%的股份，但有一个条件，他们三人的资金必须先以她的名义投入雷士，之后再将雷士的股份转给这三人。三人最终答应了。


    2006年3月，毛区健丽抢在联想做出投资之前，用募集来的400万美元，加上自有资金494万美元，再加上融资顾问费折合的100万美元，总计994万美元入股了雷士，占比30%。


    而其中最有玄机的是，30%里的10%是三个外部投资人的股份，对应的投资是400万美元，而毛区健丽仅仅用494万美元的现金就换来了20%的股份。她心里算准了吴长江当时已经火烧眉毛，借机“杀价入股”。这难免给人一种“趁人之危”的嫌疑。


    # ｜新的威胁一阎焱


    当然，在入股之后，毛区健丽继续行使着自己融资顾问的职责。她给雷士介绍了许多潜在的投资人，其中最重要的就是软银赛富基金和它的合伙人阎焱。


    到了2006年8月，软银赛富正式决定投资雷士。8月14日，软银赛富投入的2200万美元到账，占雷士股权比例35.71%。这个价格是毛区健丽之前入股价格的两倍。


    这半年下来，随着三笔资金的先后进入，雷士获得了超过2.6亿的资金。除去支付胡永宏和杜刚的1.6亿元，还有余额补充运营资金。解决了创业股东问题以及资金问题之后，雷士从此时走上了稳健的扩张道路。


    # ｜“资本局中局”


    2011年7月21日，雷士照明引进法国施耐德电气作为战略性股东。软银赛富、高盛联合吴长江等六大股东向施耐德转让2.88亿股股票。施耐德出资12.75亿港元，股份占9.22%，成为雷士照明第三大股东。而此时第一大股东赛富的持股在18%左右，而吴长江个人持股大概是15%。


    # ｜吴长江的第二次出局


    到了2012年，由于意见不合，阎焱赛性把吴长江赶出了雷士，自己接替他出任董事长。'
