  md: '# 王兴 | “饭否”的诞生与陨落


    在把自己亲自做起来的校内网卖给陈一舟之后，王兴、王慧文和一些核心团队成员都跟着收购加入了千橡集团。但是锁定期间一过，大家就都陆续离开了公司。虽然协议规定如果再多留一两年，王兴可以拿到额外的一笔钱，但对于他来说，时间显然更加重要。


    不过这时候，王慧文正忙着休息和游山玩水，王兴的另一位创业伙伴开始唱了主角。这个人就是后来美团网的联合创始人兼技术副总裁穆荣均。穆荣均是王兴在清华的学弟，有意思的是他就是在校内网认识的，当时穆荣均已经是百度的一个工程师了。


    # | 饭否的诞生


    美国得克萨斯州有一个叫“西南偏南”的大会，这是一个每年举办的关于电影、多媒体、科技以及音乐的艺术节和大会。2007年3月，穆荣均在浏览网站新闻的时候发现了一个消息：在这次大会上，一个叫做Twitter的服务一炮走红。它是由埃文·威廉姆斯（Ev
    Williams）和杰克·多西（Jack Dorsey）创立的，2006年3月成立，7月向公众开放。


    现在大家对Twitter已经非常熟悉了，新浪微博就是=i照着Twitter做起来的业务。当时140个字符短信的模式可以说横空出世，对如今这一代新媒体的影响非常大。


    # | 饭否被关停


    后来发生的事，可能熟悉这段历史的同学知道，当年饭否其实一直发展不错，虽然谈不上大爆发，但各种数据一直增长。在2009年上半年的时侯用户已经有了上百万。然而，2009年7月8日，饭否因为敏感言论被关闭了。


    # | 新浪与腾讯的微博大战


    而且更有趣的是，就在饭否被关停的一个月之后，新浪微博诞生了。'
