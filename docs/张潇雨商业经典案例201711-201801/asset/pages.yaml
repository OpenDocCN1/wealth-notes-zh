  md: '# 周末互动｜企业失败的五大原因


    你好，欢迎来到《商业经典案例课》。我是张潇雨。


    在写作这个系列的时候，我有很多感触。想起来最多的一句话就是托尔斯泰的那句：“幸福的家庭都是相同的，不幸的家庭各有各的不幸。”


    我发现在商业领域里，这句话应该是反过来说的：失败的企业都是相同的，成功的企业各有各的成功。


    想一想，腾讯、迪士尼、耐克和爱马仕的成功原因各不相同，甚至很大一部分原因其实只是运气。但对于那些没有做成的企业来说，它们失败的原因往往是相近的：产品不行、战略出错、缺乏关键人物或者团队不和、资金链出了问题，甚至大环境和政治原因等等等等。所以，总结失败的案例的确会为我们有更多的启示。


    # 失败原因一：产品没人要


    这应该是最常见的公司失败的原因了。所有公司的立足基础都应该是好产品或者好服务，这一点不管是对以产品为生命的腾讯这样的公司，还是对沃尔玛、麦当劳和无印良品，都是一样的。


    # 失败原因二：无法保持专注


    +   - 和投资人喝个咖啡

    - 去各种场合社交

    - 给公司找各种“顾问”

    - 和一些公司“战略合作”，以为这样能增加用户

    - 在人们确定想要你的产品之前，花很多力气PR

    - 参加各种大会

    - 在社交媒体上和人辩论


