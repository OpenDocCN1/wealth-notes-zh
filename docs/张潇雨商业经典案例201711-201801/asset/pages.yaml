  md: '# YC｜如何看懂投资意向书（下）——什么是创业者最重要的品质


    今天是我们创业小专题的最后一期。我们来把term sheet——投资意向书的常见条款讲完。


    其实前两篇专栏之后，我们已经把文件上面重要的概念基本都覆盖到了。不过我之前说过一句话——为什么说YC和真格的投资文件对创始人非常友好呢？因为比起文件上面写了什么条款，没写什么条款才更重要的。


    如果你仔细观察一下真格的那份投资文件，会发现最后has一行小字写的是——未纳入本条款摘要的有利于投资者的典型条款有：优先清算权、赎回权、强制随售权、反稀释保护、详尽的保护性规定。


    你应该发现了，里面有几个条款我们已经讲过了。比如优先清算权在真格的文件里面只是“清算权”，等于把优先股的权益放弃了；同样，反稀释保护也被弱化成了简单的“跟股权”；另外，保护性规定也列得不多，我上一期专栏也讲过到。两个没讲到的是赎回权和强制随售权。这期专栏我们就来讲讲这两个概念。


    # ｜赎回权


    所谓 طالب赎回权（Redemption Right）一般的表述方法是这样的：如果公司未能在投资完成后N年内实现合格IPO并上市，投资人有权要求公司赎回全部或部分股份。赎回价格为投资金额加上每年x%的内部回报率。


    用大白话说就是：如果创业者不能在规定年限内让公司完成上市而且市值达到一定门槛的话，投资人有权要求公司连本带利地还钱。


    # ｜强制随售权


    接下来我们来讲“强制随售权”。强制随售权是从英文的 Drag-along Right翻译而来的，还有一些别名，比如：拖售权、强卖权或者被售权。


    # ｜优先投资权


    还有个有意思的小条款我们可以提一下。在真格的文件里有一个条款叫做“优先投资权”，它说的是：若交割之后创始人从事任何新项目，在条件等同的情况下，真格享有优先投资的权利。


    到这里，我们关于投资意向书的关键条款解析就结束了。这也标志着我们专栏创业小专题的结束。作为结尾，让我最后来说一点关于创业的自己的心里面话。'
