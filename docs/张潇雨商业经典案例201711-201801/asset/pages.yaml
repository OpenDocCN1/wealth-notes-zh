    而对于刘强东和很多伟大的企业家来说，这次“一意孤行”的举动就像是“一个英雄式的瞬间”。日后有人想把这家公司写进历史，甚至拍成电影的时候，这都是一个不可错过的，熠熠生辉的瞬间。一个个人坚持了自己内心认定最对的东西，并且义无反顾地把自己的命运和公司紧紧地绑在了一起，最终走向胜利，在他人的冷嘲热讽中成为一个真正的英雄，这可能是成为一个企业家最令人满意的事情之一吧。


