  md: '# 小败局｜超越阿迪走向巅峰的Under Armour


    小败局｜超越阿迪走向巅峰的...


    你好，欢迎来到商业经典案例课。这周我们继续讲“小败局”系列，这篇专栏我们要讲一家新的公司。


    这家公司和GoPro有很多类似之处：比如，都有一个非常专注和热忱的创始人；再比如，都默默无闻地耕耘了很多年；再比如，都借助时代风潮的契机爆红，然后达到了巅峰；还有，都一度是华尔街和资本市场的宠儿，但后来都因为各种失误和问题，股价大跌，公司陷入低谷。所以在GoPro之后再来看看这家公司的轨迹，相信你会有很多不一样的收获。


    这家公司，就是运动装备公司：Under Armour，中文名叫 安德玛。为了方便，后面我 \$就都简称它为UA了。


    # | Under Armour 的崛起


    先来简单介绍一下这家公司。


    UA是著名的运动装备公司，如果你还不太熟悉它的话，它的竞争对手你肯定知道，就是耐克和阿迪达斯。


    在国内，UA还算不上最流行的运动品牌，但是这两三年也有越来越多国人认识了它。尤其是在2014年年底，2015年年初的时候，UA在北美的销售额第一次超过了阿迪达斯，成为了北美第二运动品牌，仅次于耐克。


    当时的UA可以说风头无两，和曾经的GoPro也是不相上下的，市值最高也冲到过150亿美元以上。


    然而就像GoPro一样，在达到巅峰之时，UA一系列错误的决策和糟糕的运气，使它很快从顶峰跌落。到了2017年年底的时候，股价已经跌去了60%多，市值只剩下五六十亿美元了。


    那么这中间到底发生了什么事情呢？


    # | Under Armour的创立


    UA正式成立是在1996年，他的创始人叫做凯文·普兰克（Kevin Plank）。


    普兰克是一名标准的体育爱好者，从小就非常热爱橄榄球运动。到了1995年，普兰克23岁的时候，身强体壮、意识出众的他担任了美国马里兰大学的橄榄球队队长。


    不过，普兰克在打球的时候发现了一个非常不舒服的地方，当时他穿在球衣里的纯棉T恤，训练和比赛的时候经常会被汗水浸透，贴在身上非常不舒服。于是他萌生了一个想法：能不能给像他这样的专业运动员打造一款他们真正需要的运动T恤呢？这个想法，就成了后来UA的雏形。


    结果大学毕业之后，普兰克没有去当职业橄榄球运动员，而是开始了创业。


    他一开始就住在外祖母留下的 XA 小房子里，他住在楼上，楼下和地下室就是厨房和办公区。和他一起的还有他在马里兰大学一起打过曲棍球和橄榄球的好友，他们也成了UA的联合创始人。


    1996年，普兰克在一个小小的裁缝铺研发出了第一款产品——可以快速干燥排汗的强力伸缩运动T恤，光听这个名字就知道有多专业了，这是UA最著名的明星产品。


    他先是把样品寄给自己大学的队友和在NFL（美国国家橄榄球联盟）打球的朋友，让他们给予反馈，然后继续不断送产品。之后，普兰克开着车几乎跑遍了整个东海岸推销他的T恤。到了1996年年底，普兰克卖出了500件UA的T恤，带来了17000美元的销售额。


    听到这里，有没有一种和GoPro、耐克这些公司的起家历史似曾相识的感觉？


    每个消费品牌，都需要第一个伯乐。对于苹果来说，伯乐就是附近那个，订阅了50台苹果一代的卖电脑的小店；对于耐克来说，就是真正识货的长跑队教练；而对于UA来说，他们最应该感谢的是佐治亚理工大学橄榄球队的装备经理——也就是负责给全队置办各种装备的负责人。


    由于UA研发的T恤的确对运动员来说非常好穿，于是佐治亚理工大学橄榄球队一口气订购了350件。那时候普兰克连足够的库存都没有，只能分批发货。


    在这次和佐治亚理工大学的成功合作之后，UA的速干紧身T恤一炮打响，好评如潮，越来越多的球队开始联系普兰克，希望能穿上UA的衣服。从此，UA开始了统治橄榄球领域装备的旅程，除了T恤，还开始开发为橄榄球运动量身定制的球场钉鞋，等等等等。普兰克也终于搬出了外祖母的房子，把公司迁到了巴尔的摩，在那里设立了UA的总部和仓库。


    到这里，一切都是我们最熟悉的故事，某种程度上来说，这可能都是创业的一个必备公式了：


    +   首先，产品应该是一个非常热爱 and 懂得这个领域的人开发的；然后这个产品进入的市场一定是非常细分非常专业的领域，换句话说，是很多大公司照顾不到的领域；然后，创始人或者创始人团队一定自己就是很好的销售，能够把好的产品真正卖出去；最后，这个产品开始统治和垄断这个细分领域。


    到这，这家创业公司从零到一的旅程，基本上就算 是走完了。某种程度上来说，这也是我们提到过的《创新者的窘境》这本书里的思想的另一种显现。


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_144_0.png)


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_144_1.png)


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_144_2.png)


    # | Under Armour早期成功的原因


    在这里，我们还可以从不同侧面多说两句UA早期的成功。


    从商业的角度来看，UA早期的成功其实是做到了两件事：


    +   第一，UA可以说生生创造出了一个品类；

    第二，UA所有的商业行为，不管是产品、设计、营销等等，全部带有很强的价值观主张。


    # 1. 创造品类


    在UA之前，运动紧身衣根本算不上是一个品类。那时候体育用品的巨头是耐克、阿迪达斯、锐步，大家基本都盯着在各种运动鞋，尤其是篮球鞋和足球鞋领域打架，还有就是争取普通运动服，以及女性运动市场，专业运动员的市场没人顾得上。这就给UA创造出了一个可以突破的空间。


    # 2. 价值观强


    也因为这个品类非常集中于服务一个特定人群，所以UA在很长时间以来，都有着非常清晰的价值观主张。他们的这种强烈的价值观主张就是：让运动员更强。所以UA比起爱使用顶级运动员代言的耐克，还要显得更专业，更硬核，更极端。


    有几个很好的例子能说明这一点：


    +   第一，在执行层面上，UA很爱用运动员。


    这里可不是说代言人，而是在公司里真正担任要职的中层管理层。


    UA的理念是，找十个MBA做市场调研，还不如找一个职业运动员来给意见。所以，他们雇佣了很多退役的、半职业的、业余顶级的运动星和玩家来UA工作，因为他们才最懂什么是真正的专业。


    所以他们的产品有很多小细节都很受运动星喜...'
