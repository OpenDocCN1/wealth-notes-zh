  md: '# 京东 | 为什么要自建物流


    如果我们翻看那些伟大公司的历史的话，你可能会发现，很多公司都有一个共同点——在它们漫长而波折的历史中，总有那么一个时刻，这家公司的创始人或者CEO，顶着所有压力，不顾所有人的冷嘲热讽，几乎是一意孤行地做出了一个决定。然而很多年过去之后，人们发现这个决定居然是正确的。对于京东，这个决定应该是2007年，刘强东决定自建物流的战略决定。


    其实在京东历史上，有三次非常具有决定性的战略决策。


    第一次是我们之前讲过的，在2004年京东从线下销售靠近一亿的经销商转型做电商的决策，京东借此完成了转型，抓住了未来十年中国互联网界最重要的电商大潮。


    第二次，是刘强东决定扩张品类，从以数码3C产品为主的品类，转型成了一站式的消费平台。这次决策暗合了我们之前说过的很多次的“多、快、好、省”里的“多”，也呼应了之前沃尔玛提供非常多种类、美团加大供应端产品，于是销售一下腾飞的策略。尤其是当年京东扩张到图书品类的时候，和当时的大家还令人印象深刻。


    # ｜为什么要自建物流？


    当时的时间是2007年，刘强东刚刚不顾大家反对，开始扩张品类，结果他又萌生了一个新的想法，就是自建物流。


    很多人都说京东当初自建物流是为了用户体验，这一点也没错。当时京东收到的一半以上的客户投诉都是到货慢，或者货摔坏了，都跟物流相关。当时物流行业还是第三方的天下，野蛮卸货装货的现象很严重，这对以3C数码产品为主的京东影响很大。


    # ｜刘强东的“一意孤行”


    别忘了当时是2007年，在年初京东刚拿到第一轮今日资本的1000万美元融资。京东自己年收入还不到5个亿。刘强东在董事会一提出自建物流的计划，投资人就说，要不你先做做预算吧——不直接否掉的原因是不太好意思直接说。'
