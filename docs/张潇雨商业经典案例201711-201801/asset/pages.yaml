  md: '# 周末互动丨美国最顶级的投资机构在关注什么


    周末互动丨美国最顶级的投...


    你好，欢迎来到《商业经典案例课》。我是张满雨。


    随着YC这两周专栏的结束，我们关于创业的这个小专题也进行完了。我知道很多同学可能还想更更多，但一年的专栏还要继续往前走，有机会以后我们再慢慢讲。


    相信这两周之后，大家对YC这家公司，或者说这个学校应该有很多了解了。就像我在开篇说的，希望这些文章能启发你对创业这件事情的想法，并且树立一些最端正的观念。这可能比学习具体了一些技巧roy更重要。不过在这期周末互动里，我们可以来点实实在的内容。


    关于YC还有一个东西可以和大家分享，就是他们在自己的网站上，贴出了他们接下来最关注的一些领域，我今天就给大家简单介绍一下。你也可以看看美国最顶级的投资机构在关注什么。这篇文章的链接我也一同附上（http://www.ycombinator.com/rfs/#n1）。


    当然，YC在开篇就强调说：你不应该像做命题作文那样按照这个清单去创业或者申请YC，好的创业想法往往会给我们惊喜，而不是我们坐着等来的。所以，这份清单上的东西更多是一种提升视野的角度，供你参考。


    YC一共提及了24个很有意思的方向：


    +   1. 能源。


    便宜的能源和人类消除贫穷，提高社会福利水平息息相关，所以YC非常看重这一领域。目前在能源领域里，不管是发电，还是传输、储存，都有很大提升空间。更别说如果电池技术有突破，我们的社会会有多大变化了。


    +   2. 人工智能。


    这个领域相信已经有很多人提及过。YC说，除了那些大家都能想到的自动驾驶、药物研发、智能助手、防许骗等领域，希望有人能做一些更冷门的创业或者研究。


    +   3. 机器人。


    这个领域同样大家也很熟悉。YC说他们的定义非常宽泛，比如他们管自动驾驶的车也叫机器人。所以这个领域也有非常多可以做的事。


    +   4. 生物科技。


    YC说，虽然还很早，但是貌似我们终于在这个领域这么多年要来有突破了。他们列举了很多具体的方向，比如抗击疾病、延缓衰老、基因检测，甚至下载记忆、人机结合……他们觉得未来几十年是生物科技的时代，就像20世纪70年代以来的芯片时代一样。


    +   5. 医疗。


    这一点，美国的朋友们可能更加感同身受。YC说，医疗在美国是非常有问题的一个系统，GDP的20%居然都用在了这个方面，这是无法持续的。所以在这个领域的任何创新他们都很关注。


    +   6. 医药。


    在美国，药物研发已经越来越慢而且越来越贵。YC希望能投资用更新的方法去研发药物的企业。他们提到了一个词叫做“nootropics”，我搜了一下蛮有意思，和治疗甚至提升大脑的能力有关。


    +   7. 人类增强。


    这个领域的定义也很广，你可以说给残疾人安上假肢也是一种“增强”，或者因为疾病更换一些人体器官也是。当然，这里里面的空间非常大，甚至稍微想一想就走到科幻了。


    +   8. VR和AR。


    这个领域就不用多说了，YC的讲法是，现在差不多数时候了。


    +   9. 交通和房屋。


    同样是一个和民生非常有关的领域，看得出YC还是非常心怀天下的。他们说，我们一半的能源基本都用在了交通上，但是整个交通的体验其实并不好。我们希望能创造出更好的方式让人类进行移动。这让我不禁想到了Elon
    Musk搞的地下隧道公司。


    +   10. “一百万个工作岗位”。


    YC说，我们希望能投资那些可以创造一百万个工作岗位的公司。这不仅意味着这个公司本身非常具有影响力，而且在人工智能可能代替很多人类工作情况下，这类公司的出现也是非常重要的，也是非常具有突破性的。


    +   11. 编程工具。


    YC是一个工程师气质很强的机构，所以他们也希望能为工程师提供更顺手的工具来改变世界。而且，更优化的工具还可以让整个社会更多的人来学会编程，这也是一种很好的教育。所以编程工具非常重要。当然YC说，也许我们还可以思考一个问题，就是：如果有一天有东西代替编程语言了，那会是什么？


    +   12. 好莱坞2.0。


    这个领域也很有意思，因为整个娱乐业也在被重塑。相信听过我们迪士尼和Netflix等等等几个系列的同学会感知到，电影业、娱乐业、电视剧行业都在发生变化。旧有的好莱坞权利体系很可能会被颠覆，人们获取娱乐的手段和工具也会产生很多变化，所以这也是一个很好的投资领域。


    +   13. 多样性。


    这里的“多样性”更多是从社会福利和政治的角度说的。YC说，他们愿意来资助非营利机构，利用技术来帮助我们工作和生活的环境增强更多平等，更多多样性。这也是一个社会福利方面的创新。


    +   14. 企业软件。


    这个领域也不难理解。YC的说法是，希望能把买的变得更便宜；让更多人使用上企业软件；然后把每个行业都数字化。这是一个非常实在的方向。


    +   15. 金融服务。


    同样是一个很大的领域，也是一个面临很多变革和创新的领域。比特币最终变成什么样还不知道，但是金融领域一向是创新很滞后的领域。YC觉得，是时候改变一些东西了。


    +   16. 计算机安全。


    毫无疑问，在人类未来的计算能力上一个台阶之后，新的计算机安全问题也会到来。黑白两方的博弈永远不会停止，这就是人性。


    +   17. 全球非盈利的健康组织。


    又是一个非盈利领域，YC希望它们能通过技术把医疗和健康带给更多的人。


    +   18. 消除社会不平等。


    YC说，上千万的美国相对贫困的群体都看不到上升到中产阶级的路径，他们希望有公司或者组织来改变这一点。盈利或者非盈利都可以。


    +   19. 食物和农业。


    又是一个大民生项目。YC说，全球大概40%的人在农业相关行业工作，这个领域大有可为。不管是对于农民，还是农作物，甚至是改进养殖动物的生存状况，都是他们愿意尝试的。


    +   20. 大众媒体。


    媒体仍然在剧烈地变革，还有什么是我们能够做的？


    +   21. 民主的改进。


    可能是由于特朗普的当选，最近很多硅谷人士和群体都越发地关心起政治来。有兴趣的同学可以多观察一下。


    +   22. 工作的未来。


    YC的一句话评价是：25年之后，有什么工作会和现在非常非常不同？


    +   23. 新闻。


    和中国一样，美国的假新闻问题也是姗姗来迟...'
