  md: '体会是尽快地做出一个阶段性的成功，让别人看到。这个方法我自己用过，非常有效。


    一意孤行总是和英雄如影随形，英雄在成长的道路上看的是远方。别忘了，其实大多数的英雄都会在别人还没看的时候，就在默默研究，甚至是拿望远镜看着过了。英雄之所以能一意孤行，而立于不败之地，是早都盘算好差不多了，只等那一点的到来。只知道头去做的不英雄，那就是莽夫。英雄盘算好了，就冲着那个点一点一点地前行，把大整体的压力分解成一点一点的压力，这时的英雄就可以轻松控制和应对压力。


    这个问题很大，我就仅限于所在部门的实际感受谈谈我的一点小经验。我是一个码农，但是我的想法跟其他人不一样。比如针对具体的项目我会有一个别人认为不太可能的方法，或者不符合目前的实际情况的方案。尽管如此，我还是依旧不断地去思考更好的解决方案，不会因为身边人的不理解而放弃。有一次刚好老板过来开会，我就趁着这个机会将之前提出的一个方案再次提出来。会后老板让我去办公室详细地聊了下我的想法，可能是老板同我的解决方案吧，最后让技术经理一起开了个临时候议，最终临时动议让我的方案先上。当时我的心情是无法言说的，所以我想说天道酬勤，你的工作态度和你的思想决定了你的深度。延伸开来这个事件，坚持自己的初心，用自己最大的开明去接受周围的一切。与此同时通过学习和沟通逐步改善，相信未来的路都是好走的。希望给大家一点启示。


    “刘强东的长远目标和一如既往的企业哲学”这一期在我看来，可以说是和张老师在Airbnb那里星 altres 讲的一篇《创业要从“笨事情做起”》交相辉映。第一点我想说的是刘强东的
    consistency，从一开始主张“多、快、好、省”以及为消费者让利的哲学后，他再也没有过。第二点接着要讲的是在我看来很重要的事情是，刘强东的思路清晰、逻辑完整，这就导致他特别容易抓到事物的矛盾点。一直主张为消费者让利的刘强东敏锐地发现加盟快递的弊端：加盟商和快递公司的利益是不一致的，这导致了快递服务无法保证，这是刘强东决定自建物流的缘起。第三点，就像Airbnb初期通过给早期缔约的host拍照这件极其有效的“笨事情”一样。刘强东在当时轻资产的风潮下依然决定要做笨重、需要大资金投入的物流行和仓储建设——他看到了这个矛盾点，而解决这个矛盾点，不得不通过这个方式，无论多么难、多么需要钱，但是躲不过的不能躲。张磊和他去亚马逊参观学习后，应该更是确定了这个事情的必要性。所以在很多人看来，刘强东这个想法很笨，不切实际，但是在当时的刘强东（以及张磊）看来，那可能是唯一的正确答案。后来事实也证明了。就像这篇文章里面提到的，小城市里面的人其实很依赖于京东这样有正品和物流保障的电商可以提供的产品，所以京东物流建立的护城河之坚固——虽然搭得很紧、很累，但是后面的人超越也一样难（就像Airbnb那个例子一样）。第四点，网络效应和飞轮效应。这点不用赘述了，就像fulfillment
    by amazon，京东的 fulfillment by JD一样带来很好的网络效应和飞轮效应，前期的投入，在后期终究会有火箭般速度的回报。


    # 京东｜腾讯的入股


    +   1.第一句认清现状、制定战略（认识困局）：人生苦短，是限制条件，这个就是人在局中的现实，要想破局，就要“做大”。做大，也就是在限制条件中的战略思考，是追求卓越，但并不是盲目！这一句启示，认清所处环境——人生苦短（局中），战略布局高远（破局想法），完成第一步“思局破”。

    2.第二句发展路径（破局依赖）：先迅速做大（先发影响力），然后持续优化做好做长久（长久持续），搞大了，体量规模效益有了，却不一定能长续占有发展，还不能说永恒，波峰起得快谷底可能也落得快。从两性婚姻角度来类比，“春秋成婚”就是在“大了”的基础上假性占有，然而长线的两性互相占有是虔华的事件，仅仅是大了，还不足以长续维系双方关系。如果从物质属性来看，“大了”是空间属性发生变化，“永恒”则是时间属性的持续。一时做大相比较容易，永远做好却很难。“大了”是阶段目标，“永恒”则是不断追求不断努力的终极目标！

    3.第三句指导思想（破局方法论）：永恒是不可能的，也说明了物极必反、盛极则衰的辩证思想。事物发展的周期性，生死有期限，也决定了要不断创新铺路延续，迭代更新维持存续（保证存续的状态——永恒）！老而不死是为贼。基业长青就要内部不断迭代更新，引入创新机制，鼓励创新。

    4.第四句局破（破局）：有始有终、无始无终，这也是个悖道的境界吧：置之死地而后生。一个体系要保持发展就要反熵，甚至还要引入外界机制来促使内在的新陈代谢。要么自戕，要么他戕。生死循环，想要生生不息，势必要忍受风雨浸染的痛苦。生死的局要破，胆略谋识都要足够！


    # 京东｜刘强东最重要的事业伙伴


    徐欣，今日资本的掌门人。要研究她为什么会看刘强东，就要研究一下徐欣的过去经历。徐欣在今日资本成立前，先后投资过娃哈哈和网易，为股东获取了丰厚的回报。这样的成功案例恰恰为徐欣投资京东提供了很好的参考体系，一个是针对消费类，一个是互联网企业。京东又转型做2C的电子商务，这不正互联网和消费类结合的绝佳案例吗？当然除了商业模式外，徐欣的慧眼识英雄也很重要。所以双方都是互相成就的，资本的助推剂对于互联网企业尤为重要，刘强东的眼界和视野也慢慢开阔起来了。正如一首歌词写的“你选择了我，我选择了你，这是我们的选择”。'
