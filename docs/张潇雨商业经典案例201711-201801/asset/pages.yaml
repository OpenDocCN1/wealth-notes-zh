  md: '# Facebook | 扎克伯格 1.0：从创业者到企业家


    Facebook | 扎克伯格：从...


    在上期专栏里我们说到了"beta版"的扎克伯格，这个阶段基本上是2005年之前，扎克伯格刚刚创立Facebook不久，犯了很多错误，但凭借命运的眷顾、自身的努力和贵人的帮助，还是在迅速地前行。可以说，这个阶段的扎克伯格几乎是凭借着能梗在槛冲直撞。


    但我们都知道，一个企业的发展，背后一定是领头人自身的迭代。所谓著名的"move fast and break things"——横冲直撞，在公司早期可能非常重要，但到了一个阶段，所有的创始人都需要保持速度的情况下变得更加稳重和成熟，扎克伯格也不例外。


    当然，在接下来四五年的里，扎克伯格完美地完成了从"beta版"到"1.0版"的进化。


    # I “社交之王”地位的确立


    从2006年到2010年的这段时间里，Facebook进入了一个高歌猛进的高速发展期。


    在这个阶段，Facebook基本打败了MySpace和Friendster等一众社交网站，确定了自己"社交之王"的地位；也开始探索一些新的商业模式，比如和著名的"开心农场"游戏模式的开发公司Zynga的相爱相杀。


    但最本质的东西，还是扎克伯格坚持了他最核心的两个品质：强悍的产品力，以及不断向身边人学习的的能能力。并且，他还发展出了第三种能力，而这个能力也让他为日后长期执掌Facebook打下了最最重要的基础。


    我们先来说Facebook的产品力和执行力。


    其实在这个阶段，Facebook有过多多失败的产品，比如Beacon、Facebook搜索、Facebook Paper等等，这些产品现在你也没必要了解了。但伟大的公司都会有无数次的实验和失败，比如苹果的Lisa电脑和Newton掌上机。但是和庸庸公司不同的是，在无数次的失败里，他们总能发现那些改变时代的东西。


    在2006年，扎克伯格连同几个同事组建了一个内部团队，准备开发一个新项目。这个项目就是大名鼎鼎的，不仅改变了Facebook，还在很多方面改变了整个互联网行业的News
    Feed——信息流。


    你可能对"News Feed信息流"这个东西并不那么熟悉，其实这恰恰证明了它的伟大。因为，如今已经有太多互联网产品，继承和发扬了"信息流"这个产品机制。你可以把News
    Feed的地位理解成第一代iPhone，从iPhone出现之后，所有的手机样子就长得差不多了。


    # I 桑德伯格的加入


    当然，这个阶段的扎克伯格也没有浪费他强大的学习能力。在2008年，他在这件事上做出了一个新突破。


    2008年3月，Facebook宣布雪莉·桑德伯格加入，担任公司的首席运营官，基本上就是公司的二把手。'
