  md: "权等等都由A和B来决定。比如说我只能管公司副总裁，招聘一个总监都不需要经过我面试，对于升职、加薪、授权包括辞退等等我都不知道。但是我们公司设立CEO，这是我知道的。\n\
    \n所以按照ABC来讲，我是A，子公司下面的副总裁属于公司的C。这样就是为了避免一个人说了算，同时旁边还跟着HR，HR没有提名权，他不可以跳过A或者B决定给C升职、给他涨工资，但是可以审核。对C的提名都是A和B一块，A不可以跳过B给C加薪和升职。HR是监督你的决定是否符合公司的价值观和普遍人事的政策。通过这种AB资源就避免了公司单一员工决定生杀的权力。\n\
    \n# 3. 8120原则\n\n第三张表格就是公司的8120原则，就是我们管人的一张表格。什么意思？我们认为一个管理人员最佳的管理数是8到12个人，让他能够有足够的时间思考战略，同时也不会很清闲。我们看到很多公司都是一个人管理两个人的结构，在京东公司不允许。如果出现这种情况怎么办？合并上面A，变成一个团队。\n\
    \n每个管理人员管理的下属不能低于八个人，低于的话合并。原则上不超过十二个人，就不允许拆分业务。如果说我的一個副总裁管了九个总监，公司只有一个副总裁，不可能有两个。一个副总裁管了十二、十三或者十五个人，超过十二个人之后公司可以考虑设立第二个副总裁。\n\
    \n# 4. 2N原则\n\n最后一个原则是2N原则，两件事情在公司是不可以做的。所有加入集团公司的，过去有很多工作经历，每个人最多只允许带原单位的一个人过来，如果带的人多怎么办？也欢迎，去别的部门。\n\
