  md: '# 阿里 | 蔡崇信：CFO的三层功力


    在上周的专栏里，我们从非常宏观的层面梳理了阿里这家公司的一些重要的节点，那么这一周，我们就从相对更加细节点、聚焦以及理论的方面来解读一下阿里这家公司。


    另外我也想再次强调，对于阿里这家非常庞大同时大家也非常熟悉的公司，我们专栏解读的东西一定是挂一漏万的。所以，我还是希望这周内容的作用应该是帮助你提出更多的好问题，而不是给你直接的答案。希望你能带着这种思路，去享受本周关于阿里的内容。


    今天的专栏，我们先从一个人和他在阿里的角色开始。这个人就是阿里当之无愧的二号人物——蔡崇信。


    # | 蔡崇信是什么人


    读过我们上周专栏的同学，应该知道蔡崇信对于阿里巴巴及马云的重要性。在上市之前，阿里董事会的四个席位其中一个就是蔡崇信，而在阿里的合伙人制度中，有两个人是永久合伙人：一个是马云，另一个就是蔡崇信。


    很多人都说他是“马云背后的男人”，而马云自己也说过，他人生中最感激的四五个 人里面，一定是有蔡崇信的。那么，蔡崇信到底是个什么样的人呢？


    蔡崇信出身于台湾的一个法律世家。他的父亲蔡中丞、祖父蔡六乘，是国际法方面的大律师，祖父曾经为杜月笙做过法律咨询，父亲是台湾取得耶鲁大学法学博士的第一人，还担任耶鲁大学的校董。


    蔡崇信从小就跟在父亲身边，对法律和财务的事务也是耳濡目染。后来他13岁赴美留学，最后同样拿到了耶鲁法学博士学位。从专业能力上来说是绝对没问题的。


    # | 蔡崇信加入阿里


    1999年5月的时候，蔡崇信和马云第一次见面。去之前，他的台湾朋友说“马云这个人有点疯狂”，结果他去了之后，发现马云甚至还没有成立自己的公司，而且只有一个上线刚刚几个月的网站，就是阿里巴巴。


    # | CFO的三层功力


    作为一个CFO，本质上要有三层功力。


    +   第一层：少在资金上走弯路


    +   第二层：风险管控


    +   第三层：资源调配


