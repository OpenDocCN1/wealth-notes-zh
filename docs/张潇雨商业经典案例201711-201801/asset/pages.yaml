  md: '# 京东｜腾讯的入股


    京东｜腾讯的入股


    上期专栏里，我们开始梳理京东三次最重要的融资。我们先讲到了京东第一次拥抱风险投资机构的经历，也是刘强东遇上他一生的最重要的事业伙伴之一徐新的过程。今天我们就来讲讲京东后两次非常关键的融资。


    某种程度上说，刘强东虽然身在中国竞争最激烈的一个行业——电商里面，但是他又是非常幸运的。因为虽然企业一直很缺钱，但是他总能在关键节点遇到非常支持他的投资人，甚至在他最需要钱的时候还会给他更多的钱。之前刘强东想要融资200万美元的时候，徐新的今日资本就给了他1000万美元，而后来，这样的故事又发生了一次。


    # ｜张磊：要么一分钱不投，要么就投3亿美元


    这次故事的主角是高瓴资本的张磊。这家基金和他的创始人也非常传奇，高瓴资本现在已经是整个中国最大的私募基金了，有过非常多的成功的投资经历。关于高瓴资本和张磊的故事，我们之后的专栏也会讲到。


    在2009年年底，张磊和刘强东在一个行业论坛上碰到了，当时张磊是听众，刘强东是演讲人。他俩都毕业于人民大学，有一层校友关系。会后，张磊主动找到刘强东，问他需不需要融资。刘强东说，公司肯定是需要钱的，但他不喜欢跟风险投资机构谈，因为谈得很多，而理解他的人很少。几乎每个投资人见到刘强东都会问：你们和淘宝到底有什么区别？你们搞物流烧这么多钱有意义吗？你们的模式为什么这么重？


    结果，张磊和刘强东在高瓴资本的办公室聊了两个小时，他就决定投资京东了。


    张磊问刘强东，需要多少钱？刘强东报出的数字是5000万-7500万美元。结果张磊说，“我要么一分钱不投，要么就投3亿美元。”


    一开始刘强东拒绝了，因为3亿美元会让张磊一下变成京东第一大股东。不过最终双方都进行了妥协，高瓴投资2.65亿美元，之后又追加了5000万美元。但是刘强东有董事会控制权，并且高瓴资本把自己股票的投票权全部委托给了刘强东，这样整个公司还是他一个人说了算。最终，这笔超过3亿美元的投资，回报道了高瓴几十亿美元。是整个基金历史上最成功的一笔投资。


    # ｜为什么投京东？


    在这次看起来有点“非比寻常”的投资里，有几点特别值得讲一讲。


    首先，这笔投资是张磊早就计划好的，并不是见了刘强东之后孩子一热就抬高了出价。


    实际上，高瓴资本是一个研究型的基金。他们的运作模式是花大量时间和资源来调研各个行业，在研究中确定自己的投资主题。


    当时他们在中国就很看好电商，从2008年开始，张磊就在找几家大的传统企业，想说服他们分拆电商让高瓴来投资，结果所有的传统企业都说，你们这么小孩什么都不懂，之后就都没有下文。最后碰到京东的时候，可以说是“一拍即合”，所以就有了这个“要么不投，要么就投3亿美元”的故事。


    第二，张磊和他的高瓴资本在投资京东之前，研究了很久的亚马逊。


    当时张磊看了一个贝佐斯的采访。贝佐斯说，成立亚马逊这么多年来最大的遗憾其实是，有亚马逊的时候美国已经有UPS这样的物流巨头了，所以他再想做供应链和物流基础设施的整合就没什么机会。但对于京东来说，它在中国不存在这样的对手，甚至面临更好的历史机遇。


    所以张磊告诉刘强东说：“我必须要投3亿美元，因为这个生意本身就是需要烧钱的生意，不烧足够多的钱在物流和供应链系统上看不出来效果，而这些才是你未来的核心竞争力。”


    实际上3亿美元是当时国内早期互联网企业最大的一笔单笔投资，高瓴也一度被人们笑话成“钱多人傻”，但这笔投资不但让京东在非常短的时间里迅速确立了在中国电商界的地位，某种程度上也震慑了未来的潜在竞争者。这些年过去，张磊的眼光已经完全被证明了。


    第三，张磊说，自己投资必须有创始人控制条款，如果创始人不能控制公司，他就不会投。


    因为虽然创始人控制公司不一定成功，但是如果失去了控制，那么失败是必然的。而且为了保证创始人一直具有话语权，高瓴在帮助京东挑选后续的投资人的时候也非常小心，希望他们所有的股东都能跟高瓴一样，没有短期退出的压力，能真正放眼未来，支持公司的长远发展。


    张磊说，“我们把其他投资人急着卖股份，导致公司动荡的风险叫做‘邻居风险’。就像买房子一样，你也要看周围的邻居是怎么样的。”


    最后，在谈到为什么要投资刘强东的时候，张磊说，他还看中了一点，就是刘强东的坦诚。


    因为当时淘宝已经非常大了，所以大部分互联网创业者都在讲自己要走轻资产模式，其实都是挑投资人爱听的说。但只有刘强东实在，一直在说他就是要做重资产模式，自己搭建物流体系和整合产业链，于是他们一拍即合。


    # ｜腾讯入股京东


    在高瓴投资之后的第二周，张磊就带着刘强东去了美国，目的就是参观学习沃尔玛。


    刘强东在沃尔玛总部待了四五天，全面了解了沃尔玛的物流网络和仓储系统，而且回来之后，很快就在京东展开了供应链再造和物流渠道优化几个项目。张磊还安排京东的管理层与高瓴投资的线下零售企业大润发的хим团队进行全天的经营管理跨界经验交流，帮助京东团队学习线下零售的管理知识。这些都对京东帮助非常大。


    当然，高瓴带来的更重要的一个变化，应该就是我们要讲的京东第三次非常关键的融资——腾讯的入股。


    2014年3月10日，京东与腾讯双方共同宣布建立战略合作伙伴关系：


    京东将收购腾讯B2C平台QQ网购和C2C平台拍拍网的100%权益、物流人员及资产，以及易迅网的少数股权和购买易迅网剩余股权的权利。腾讯将向京东提供微信和手机QQ客户端口的一级入口位置及其它主要平台的支持。腾讯将获得京东约15%的股份。后来又补充超过5%，腾讯成为了京东第一大股东。


    某种程度上来说，这也是腾讯+京东与阿里巴巴在国内电商领域争霸赛局面的真正确立。而这背后的推手，正是张磊和他的高瓴资本。


    其实从2011年开始，张磊就拉着刘强东和马化腾一起聊天。但是当时双方的心态都不开放：腾讯觉得自己做电商也可以，没有那种合纵连横的想法；而京东也在上升期，刘强东还不想要“抱大腿”。


    直到2013年的时候，整个互联网从PC端到移动端的趋势已经非常明显了，而且速度很快。董事会就老问刘强东，京东在移动互联网时代到底怎么办？那个时候刘强东才意识到，京东的技术和流量都是瓶颈。于是张磊知道，和腾讯的合作机会来了。


    从腾讯的角色来说，那个时刻也是投资京东最好的时机。那时候京东估值在80亿-100亿美元，在走向500亿甚至1000亿的路上要克服的东西还有很多，腾讯的支持绝对是非常重要的筹码。而且，张磊的意见在其中再次起到了很大的作用，他用两个字打动了马化腾，那就是：库存。


    实际上，腾讯作为一个大平台，涉及的领域已经非常多。但是马化腾做了一半子生意，从来没见过需要库存的商品。腾讯最擅长的领域，不管是社交还是游戏还是文化娱乐，都是虚拟产品，这和实体商品非常不同。


    当时腾讯的电商平台易迅网增长也很块，如果每年翻一倍，也能达到1000亿的规模。但是张磊告诉马化腾说：如果易迅做到1000亿，就需要有两三百亿的库存，'
