  md: '例子。换个角度讲，我们现在数得出来的这些成功大公司，没有一个没面临过艰巨的转型时刻的。它们和那些已经成为历史尘埃的公司的唯一区别就是，不管是因为运气好，还是创始人或者领头人天才，甚至干脆就是运气好，它们挺过来了，转型成功了，而失败的那些公司没有。


    对于UA来说，他们就吃了这样一个大亏。并不是我不信任创始人凯文·普兰克的能力——毕竟不是谁都能从零开始把一个企业变成百亿美金的一一但你让一个橄榄球运动员出身，以专业、效率、硬核为DNA的公司，非要去赶一个时尚风潮的东西，它可能拼得过别人吗？


    换句话说，每个人都有自己的能力圈，都有自己的优势和短板，要是普兰克和UA团队真的特别懂时尚，可能这个牌子早也不是现在这样了。


    一个相反的例子就是彪马Puma。这个牌子其实也是很老的运动品牌了，一度经营非常惨淡，2007年还被奢侈品集团开云集团收购过——我们在奢侈品专题的时候提到过开云这个全球第二大奢侈品集团。而且开云买了彪马之后也不知道怎么弄，亏了好多年。


    结果，2014年年底的时候，彪马下出了一招极妙的棋。它和著名歌手蕾哈娜（Rihanna）签署了一个合约，聘请她担任公司的创意总监。于是蕾哈娜开始以她时尚界潮流引领者的眼光和理念来改造彪马，结果一炮而红。彪马出品了像PUMA
    Suede Creepers这样一系列顶级爆款。彪马瞬间就翻了身，成为了时尚界和运动界最火热的品牌。


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_147_0.png)


    ![](img/0721c7303aaeef5b824d2ca74a56e0d1_147_1.png)


    爆款不仅带来了利润，也带来了流量和品牌效应。而在这种变化之下，Under Armour一下就显得没那么酷了。


    对于以品牌形象胜出的消费品来说，"不酷"很可能就是最致命的打击。


    这反映在商业领域和财报上就是，UA开始失去最重要的北美市场。2014年，UA超越阿迪成为北美第二大运动品牌，但仅仅过了一年多，这个宝座就被"时尚化"非常成功的阿迪反超了。


    本质上，失去北美市场非常可怕，因为美国用户是有杠杆效应的。失去一个美国用户，可能意味着失去三四个全球用户。


    因为消费品的全球扩张，本质上是文化输出。消费行为其实就是一种寻找认同感，或者标签感的过程。我们曾经喜欢麦当劳、米老鼠，现在喜欢星巴克、特斯拉，说得直白一些，背后很大一部分原因就是"那是美国人用的东西"。而当引领潮流的全球第一大国的用户也开始抛弃一个品牌的时候，它的衰退就是不可避免的了。


    所以，我们在看UA的失败的时候，可以有很多种角度解读。比如它的明星款篮球鞋"库里三代"设计得非常难看，没人买单；比如向生活方式市场转型不力；比如在领头羊耐克自己都放弃了，苹果的Apple
    Watch也不温不火的情况下，UA还一直执着地向智能硬件领域扩张；比如凯文·普兰克本人言多语失，支持特朗普等等一系列发言惹来了公关危机，甚至连自己的代言人都与其划清界限……


    但本质上，UA的起家就是等来了一阵风潮，而这阵风潮一过，你逼着一个品牌去做自己不擅长的事，它的失败也就不可奇怪了。


    而这背后的一切，都是资本主义的"增长"逻辑在作祟。看多了商业历史和商业案例我就会觉得，失败其实是每个公司的宿命，只是有一些公司，可以活得更长一些罢了。


    这也是我心目中的，资本主义的一种原罪吧。


    消费零售总结篇 ｜ 从宝洁看快消行业的两大本质'
