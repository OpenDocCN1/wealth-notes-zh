  md: '# 小败局 | 商业世界不变的两个真理


    小败局 | 商业世界不变的两...


    上一篇专栏里我们提到，Under Armour靠着自己在细分市场的耕耘，靠着自己非常专业 的产品，靠着自己精彩的营销和品牌影 响力，从耐克和阿迪这种运动巨头之间成
    功突围，成为一个无比成功的品牌。


    它们曾经自己放出过一张图，就是UA曾经 连续26个季度，每个季度的销售额都同 比增长了20%。这是非常非常可怕的成绩。


    然而就在2015年UA达到巅峰之后，仅仅 三年时间，它就从顶峰跌落，陷入了各种 困境和麻烦之中。那么这三年的时间，到 底发生了什么呢？今天这篇专栏，我们就
    来看看这段历史。


    # | 商业世界的两个真理


    在展开这段历史之前，请允许我先下一 点定论。


    专栏更新到现在，我们已经讲过大大小 小、中国外国的几十家公司了。不知道大 家在这些公司中，有没有发现一些规律。


    在我开设这个专栏之前，我研究了很多公 司，看了很多时间的商业史和商业案例。


    最终我发现，有两个东西是商业世界永恒 不变的真理，而这两个真理，可以解释几 乎所有我看到的公司的成败和兴衰。


    你可能觉得我是说大话，怎么可能有如此 简单的道理来解释这么多事情呢，张老师你 是不是在忽悠我。但允许我把话讲完，讲 完之后，你再做个判断：


    这两个真理，说起来也非常简单：


    +   第一：在商业世界里，潮流来了又去，消费者永远是喜新厌旧的；


    +   第二：资本主义的核心就是，要求你永远增长。而这也造成了很多商业上的奇迹与悲剧。


    让我来分别解释一下。


    # 1. 在商业世界里，潮流来了又去，消费者永远是喜新厌旧的。


    我在零售专题的时候讲过类似的观点。


    我们看看周围的商业世界吧，麦当劳吃多了，你就想要Shake Shack；沃尔玛逛烦了，你就想要无人便利店；去年双十一买的口红，今年再看就没那么喜欢了，需要新的；iPhone
    X一出，7啊8啊之类的就迅速黯淡无光了；你要是一发现了一个特别喜欢的小众品牌，后来这个牌子越来越火，你是不是还有点不高兴呢？可能就去找下一个小众品牌了。


    所以一句話概括：消费者永远喜新厌旧，永远需要新鲜的刺激。


    # 2. 资本主义的核心就是，要求你永远增长。而这也造成了很多商业上的奇迹与悲剧。


    同学们可能没有意识到，当我们探讨商业的时候我们到底在探讨什么？本质上，我们探讨的是资本主义。


    我们现在接触到的周边所有的东西，你看到的各种公司，你使用的各种商品，你买的股票、比特币和基金，全部的大前提就是，它们全是在资本主义框架下生产出来的。而资本主义的本质是什么？就是逐利。而怎么才能有利可图？那就要无限地增长。


    # | 资本、增长与公司


    我们来看以前讲过的各种公司。


    +   耐克为什么要发展女性市场？是因为它格外关爱女性吗？可能有这个原因，但更大的驱动力是，公司要找到新增长点；


    +   Prada一个高级时装品牌，为什么几十年 前要增加香水产品线？为的是获得增长；


    +   咔怕是苹果、迪士尼，为什么要从电脑和音乐播放器业务跳到手机，为什么要收购男性喜欢的户外卡工作室和漫威？还是为了增长。


    所以，“增长”二字，就是资本主义的天职，是永远不可撼动的底线。


    而反过来，资本市场也对企业们提出了这个母庸置疑的要求。


    比如，你现在做了十年的企业终于要上市了，上市的时候，你肯定要告诉会买你股票的机构投资人们，你怎么帮他们赚钱吧。否则谁要买你的股票？这个时候，你就需要“讲故事”，告诉他们你的企业未来是有前途的，未来是很有大增长空间的。说得更直白一点就是，买了你的股票，之后你是可以帮他们赚钱的。


    +   这个逻辑，对应到GoPro身上，就是一个“从硬件厂商变成内容社区和制作平台”的故事；


    +   放到盛大身上，就是“从网游公司变成家庭娱乐中心”的故事；


    +   放在我们这篇文章的主角Under Armour身上，就是“从给专业运动健身者提供装备，到全品类全用户”的故事。


    所以这些故事的背后，都由一个东西在暗自驱动着这一切，那就是资本。


    我们可以再来举一个例子。


    假设GoPro的创始人尼克·伍德曼，他的公司从来没有上市过，也没有外部投资着。他一年能卖三五千万美元的相机，每年净利润有个大几百万美元，你觉得他的日子会过得如何？甚至，今年你卖了五千万，下一年你想休息一下，或者市场有点不好，你卖了三千万，可能这也不算什么灾难，甚至你日子过得还更舒服了。


    但是，如果你背后站着整个资本主义，这就是一次巨大的灾难——你的股票会暴跌；员工会士气低落、心神不宁；投资人会对你口诛笔伐，甚至想要弹劾你；媒体更是爱看热闹了。这背后的真正原因是什么？不就是因为你没有保持公司的成长势头么？


    # | Under Armour为什么会衰落？


    我们刚才说的这一系列的事，其实就是Under Armour的故事。等到了2015年的巅峰，UA面临寻找到新的增长点的任务。然而这时候它面临的局面是这样的：


    我们都知道，UA起家就是专业运动装备。本质上，在UA崛起的十几年里，美国整个运动界的潮流就是专业化，比如原来大家就买个运动鞋完事，最多有个乔丹的篮球鞋。但是这段时间里，运动品牌开始各自细分自己的产品线，网球有网球鞋、瑜伽有瑜伽裤、跑步还分长跑和短跑……总之人们玩得越来越专业，所以UA这种细分领域的专家就非常吃香。


    但是等到了2013年、2014年之后，就像我们刚才说的，整个运动界风潮开始突变，运动衣和运动鞋开始不只出现在运动界了，而是进入了普通生活里。一时间，时尚达人和超级模特们开始在大衣下面搭配运动鞋，开始穿着瑜伽裤和运动外套出街。结果突然间，运动装扮和时尚装扮的界限开始模糊，运动品牌开始变得更为生活化式品牌。人们开始把每年一次的纽约马拉松比赛，形容成“世界上最大规模的紧身裤时装秀”。


    我们之前在耐克专题的时候也讲过这个现象，还给同学们介绍过一个新词汇，叫做“athleisure”。就是“athletic，运动的”和“leisure，休闲的”两个词拼在一起合成的一个新词，也是时尚界这几年的最热词之一。而这种现象背后的驱动力是什么？无非就是我们刚才说的两点：一，消费者喜新厌旧，正式衣服穿烦了，就要换点新鲜的；二，要实现不断的增长。


    很多媒体都写到过，很多UA的非核心客户——并没有专业运动健身习惯的客户——之所以会买UA，本质的原因就是“这个牌子的logo看着没有耐克、阿迪那么‘烂大街’”。这也很好理解，LV包买的人多了以后，你自然就想去找一些更小众的牌子了。


    运动品牌为什么要时尚化？也很简单。以前人们只会在健身房和特定的运动场合下穿运动鞋和运动裤，但“时尚化”之后，日常生活都能穿了，这个利润得有多大？谁会和钱过不去？所以，对“不断增长”的追求，也让品牌方非常有动力来配合这种改革和变化。大家一拍即合，新的一种风潮就形成来了。


    而我们之前还讲过一个逻辑，不管对于人还是公司，一个亘古不变的道理就是，曾经让你走得非常远的那些优势，到后来就会反过来限制你。


    我们在之前的专栏已经举过无数个这样的例子。换个角度讲，我们现在数得出来的'
