  md: '# 阿里 | 马云上过的三堂“创业课”


    昨天我们通过一种最宏观的方式解读了阿里巴巴这家公司。可以说阿里巴巴现在已径是一个巨大的集团了，业务触角已经伸到了我们生活方方面面。但是就像每家大公司一样，阿里也是从一个很小很小的公司成长起来的，而它短短不到二十年的历史也非常精彩，所以接下来的几篇专栏，我们就按照一个节点一个节点的方式来梳理一下阿里巴巴成长的历史。


    今天，我们就从最早的那段故事开始，看着马云创立淘宝之前的那些日子是怎么过来的，这段经历又有之为之后淘宝的成立打下了怎样的基础。这一段阶段是马云的1992-1999年。重要的节点是在成立阿里巴巴之前的三次创业——海博翻译社、中国黄页和外经贸部商务信息中心。


    # 节点一：海博翻译社


    很多人都会把马云在1995年创办中国黄页看做他的第一次创业，但实际上在它之前，马云云已经做过一家小公司了。


    海博翻译社是马云在1992年，他28岁的时候成立的。你可能知道，马云在杭州电子工业学院做过英语和国际贸易专业的老师，后来发现杭州开始出现很多外贸公司，需要大量专职或兼职的外语翻译人才，加上杭州还没有一家专业的翻译机构，于是他就成立了一家。


    # 节点二：中国黄页


    1995年对于马云来说应该是个人极重要的转折，因为在这一年，为了帮助杭州市政府去美国讨债的他，在西雅图第一次见识到了互联网这个东西。


    # 节点三：外经贸部商务信息中心


    当然，创业的九九八十一难，马云只走了一点点。在成立阿里巴巴之前，他还要经历一次创业，那就是外经贸部商务信息中心。'
  merge: -1
