  md: '监督的作用。但到了公司发展后期，创始人团队很可能就不占多数股份了，而是投资人联合的团体，在董事会里占多数席位。


    最典型的例子就是之前Uber的权力斗争大戏，即使创始人卡拉尼克被投资人赶出局之后，双方在董事会席位上面还进行了很多轮的博弈。有兴趣的同学可以深入地去看一看。总之硅谷有一句经典的话：一个好的董事会不一定能拯救公司，但一个坏的董事会一定会毁掉公司。


    > 公司治理：董事会全员要有—位公司董事和董事会观察员。


    # ｜创始人股份限制


    这也是创业中非常常见的一个重要概念，你在真格的文件里就可以看到“创始人股份限制”。


    实际上这不只是限制创始人的，在发放员工期权的时候也会经常用到。它的英文叫做vesting，没有很好的中文翻译，我们来看文件里描述的细节就能很容易明白了：各创始人25%的股份将于交割后一年时悉数归属，各创始人其余75%的股份将在之后三年内等额分期归属。


    这句话是什么意思呢？其实很好理解。我们还是用之前的例子：你创立了一家公司，投资人占20%，期权池有15%，你占65%。但是你是完全可以这么干，比如投资款打进来了，然后你就说：我不干啦。这样，我花30%的股份来找个人帮我干，我自己拿着剩下的35%睡觉去了。这样当然对公司的发展是非常不利的。同样，你可能一开始有个合伙人，他拿了20%的股份。但是做着做着你俩就有矛盾了，或者他根本不合适，甚至人品道德方面有问题，这时候如果你把他开除，但是他又撩着这20%的股份，对公司也是非常不利的。


    所以，在创业圈一个比较流行的做法就是这个“vesting”，也就是说，你理应获得的股份不是一下给你的，而是分期给你。


    真格文件里面就是一个非常典型的四年分期，第一年给你自己也有部分的25%，然后剩下三年里每年都再给你25%，四年之后你就可以拿到全额了。


    这里面有两个小细节值得注意一下：


    +   1. 所谓的“各创始人25%的股份将于交割后一年时悉数归属”的意思其实是说，哪怕你干了11个月离开，这股股份也是没有的，必须要做满12个月。这在硅谷叫做“cliff”，直接翻译就是“悬崖”，说的其实就是到了12个月一下就兑现，但是11个月29天都不行；

    2. 这个所谓的“分期付股权”具体怎么付也是有很多变空间的。比如有的公司是，一年的cliff和一真格的文件里说的一样，满一年之后一次给25%——然后后三年的时间是每季度兑现，也就是说每个季度，你都可以拿到25%的四分之一，这样如果你干了18个月走人，后面的6个月也是没有收获的。


    同样，有些公司在兑现日程上也会更严格一些，比如亚马逊这样的公司，第四年的兑现部分是比第一年多的，甚至有的公司兑现日程是：第一年10%，第二年20%，第三年30%，第四年40%。实际上这就是鼓励员工尽量长时间地留在公司，当然这个兑现方式在我看来是有点苛刻的，作为创始人或者员工你愿不愿意接受，就是你自己的选择了。


    > 创始人股票限制：各创始人25%股份将于交割后一年时悉数归属，各创始人其余75%股份将在之后三年内等额分期归属。


