  md: '掉公司和消失在公众视野中的角度去衡量。但我觉得他这一系列决定却是人生精神的升华，他的决定让我想起乔布斯在斯坦福大学毕业典礼上的讲话，追随我心。他就是一个因经历病痛甚至濒死之后觉悟不同的人，改变是因为他所体会和理解的完全不一样了，所以才会做出之后的选择。大众眼中的成功在他眼中不过是游戏中的一道白光，这对他来说追求的太肤浅了，最终他的选择是向更深的领域延伸，对于他的最终的选择，我表示由衷的佩服和理解，对于他本人我也深表敬意！


    人生的意义在于大脑。一个30岁就成为中国首富，享受过成功给他带来的荣耀与地位，遭遇过失败给他带来的惨痛的教训与反思，36岁遭遇重大疾病的困扰，而后重新思索人生的意义，就是这样的人说：人生的意义在于大脑。那么我们更值得深思我们的人生意义到底是什么。很多时候我们没有长远的眼光，我们被眼前的被当下的资源稀缺所限制，所以无法着眼于长远思考。就像人们常说的，是贫穷限制了我们的想象力。很多人更是抛出了前半生拿命换钱，后半生拿钱买命。关于疼痛、恐惧，主要还是来自于大脑。爷爷在他60多岁时，一个偶然的放炮动作，不幸被一只鞭炮，擦撞了一下眼睛，从此眼睛看东西变得模糊了，一直访遍了周遭所有的医院和名医，都说他的眼睛，因为鞭炮所带来的疾病已经完全解决了，他所讲的眼睛的模糊和疼痛，可能主要来自于年龄的增长和大脑意识。然而将近90岁的他依然固执地以为，在他此后人生的20多年里，他所有眼睛的疾病和痛苦都是因为那只鞭炮，而且这20多年来，他对鞭炮充满了恐惧。关于脑科学，最近几年脑科学的卓越成就已经开始被大家所普遍接受，很多脑科学的研究成果已经在心理学领域得到了广泛的应用，而且效果相当可观，我们有更多的理由期待脑科学的发展，能够为人类解决更多的人生困惑，给人们带来更多的思考。为陈天桥夫妇点赞，向那些曾经在商业社会取得过巨大成就，而拥有资本的人，在他们实现了人生的财富自由之后，他们还想为社会做更多贡献的人，特别是为科学的发展文明的进步，做更多贡献的人致敬。'
