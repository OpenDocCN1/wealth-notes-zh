  md: '# 王兴｜竞争的终极边界——不争


    王兴｜竞争的终极边界一...


    我们这周的主题叫做：王兴的“竞争之道”。我们之前从很多角度说了竞争这件事情，不论是全局规则，还是“日拱一卒”，或者“通 ibland妙手”，以及“胜可知，而不可为”，都很好地阐释了竞争这件事情的各种维度，而且是一种层层递进的关系。


    所以，最后这一篇专栏，我们就试着走到“竞争之道”的最深处，来讲讲关于竞争的终极哲学。用我的话说，竞争的终极边界就是：不争。


    这句话看起来可能有点故弄玄虚，我们可以先来看看王兴是怎么说的。


    如果把O2O的产品逐步细化下去，做“猫眼电影”相当于做了电影票的业务，做“美团酒店”相当于做了“去哪儿”的业务。那BAT是否也会成为美团的竞争对象？


    我之前也考虑过竞争的问题，其实竞争两字是完全不一样的。同向为竞，相向为争，竞是一个比争更好的状态，所以大家都说竞争。互联网行业唯一不变的就是变化本身，而互联网本身也无边际而言。这也是互联网行业能够高速发展、刺激、吸引这么多热血沸腾的年轻人原因。我们可以在短短30年内走过很长的路，赶超传统行业，这就是互联网的威力。


    我们再来看王兴说过的另一段话：


    同向为竞，相向为争。即使是“争”也分两种：一种是拳击式竞争，一种是足球式竞争。


    足球式竞争的目标是把球踢进球门里，为了把球踢进去，“这个过程需要过人、需要铲球、需要假动作，这都是可以理解的，但最终目的是把球踢进门框；而拳击竞争，为了获胜，就必须把对方打倒。”


    我们从事的行业是竞为主，即使是竞争也是足球式的竞争，而不是拳击式的竞争。


    这两段话，应该是王兴对于“竞争”的理解的精髓之处。


    什么是“同向为竞，相向为争”呢？其实说的就是，在生活中、在商业中，大部分时候我们是在竞赛，目的是早点到达某个终点，甚至只是自己在和自己比，而不是为了击败他人、打倒他人。


    想象一下如今的美团，甚至是阿里和腾讯，如果他们的着眼点只是击败竞争对手，精力主要花在盯着竞争对手在做什么的话，他们还能发展到如今的程度么？


    对于创业公司其实也是一样，想想我们曾经讲过的Netflix网飞，它们的成立很大的原因之一就是巨头百视通的服务很有关问题，而且模式也开始跟不上时代了。但是，一旦一家公司建立起来，要做的就是自己打磨好产品、找到自己的客户群体、找到盈利的方式手段，至于百视通在做什么，知道一下就好，和自己其实关系不大。


    所以，王兴还有一个很经典的比喻，他说美团和竞争对手的关系就像是开车——你要时不时看一眼后视镜，但你不能盯着后视镜开车。这其实才是我们和竞争对手真正的关系。


    然而，我们还可以把这个逻辑再向前推一步。2017年年中左右，王兴还接受过这么一段采访：


    美团点评开新业务的逻辑是什么？


    我们的使命是“We help people eat better, live better”，中文是：让大家吃得更好，活得更好。在这个使命之下，我们认为凡是最终要发生的，我们就会选取合适的角度进入。现阶段美团点评是一个扩张的状态。


    美团的业务边界在哪里？还是完全没有边界？


    太多人关注边界，而不关注核心。你可以把边界理解为万有引力，每一个物体因为质量的存在，它会产生引力，会影响其他所有物质。差别就在于——离核心越远，影响力越小，或者是它本身的质量越小，变得影响力越小。万物其实是没有简单边界的，所以我不认为要给自己设限。只要核心是清晰的—我们到底服务什么人？给他们提供什么服务？我们就会不断尝试各种业务。


    美团目前的几块业务，各自多长时间可以结束战役？


    当我们的市场渗透率超过50%的时候，如果不犯显着的错误，就很难被翻盘。我们希望每个领域都做到第一，至少确保第二。但我们并不期望完全消灭敌人，所有人在下半场都要接受竞争合作才是新常态。


    业界质疑，美团各个业务既看不到胜负终局，又看不到规模盈利的可能性。


    我们上个月刚刚实现整体盈亏平衡（2017年年中左右）。如果不开拓新业务，我们可以在一年之后规模盈利，但我不认为短期盈利是我们追求的目标。其实无论是讨论边界还是讨论终局都是一种思考角度，但并不是唯一的思考角度，哪里有什么真正的终局呢？终局本来是下棋的术语，可是，现在的实际情况是棋盘还在不断扩大。


    我想，这段采访已经彻底地归纳了王兴的“竞争之道”，或者说是商业竞争的终极哲学。那就是：企业的扩张可以无垠无届，商业竞争也没有终局可言。


    想一想：美团从一个团购网站开始，后来有了餐饮外卖、本地生活、酒店旅游，甚至打车的项目；亚马逊从一个“卖书的网站”开始，变成了“万货商场”，还开发出了云服务、生鲜冷链、电影电视制作，甚至游戏直播等业务；迪士尼从米老鼠和白雪公主主开始，有了迪士尼乐园、有了ESPN和ABC电视台、有了皮克斯和《星球大战》，还开发了自己的流媒体业务；哪怕是“得到”，也从一个人的微信语音60秒开始，到有了自己的视频节目、有了自己的电商模块，又找到了“建立一所终身学习的大学”的使命……这些企业一路走来，是在和谁竞争呢？


    好像很多人都是它们的竞争对手，但有没有人真正是它们的竞争对手；这些公司未来的边界在哪儿呢？我知道它们的边界也可以无限延伸，直到它们再也跟不上时代的变化为止。


    这就是王兴后来在清华演讲里提到的柏拉图的名句：Only the dead have seen the end of war. 只有死人才见过战争的结束。


    也就是说，对于我们来说，对于人类来说，只有死亡才是真正的边界，其他东西都不。是。甚至，连死亡都不是边界，因为哪怕死亡终将到来，我们创造的东西、建立的文化、产生的思想，也会不断地以各种形式流传下去，生生不息。


    也正因为人生没有边界，战争也没有终局，所以所有的竞争，都不过是过程中的一种工具和一些手段罢了。竞争永远不是目的，而真正的目的是自我成长、是纵情向前、是边界扩张。


    所以，竞争的终极边界大概就是《道德经》的那句“夫不争，则天下莫能与之争”。只要你心中不是总是想着怎么打败别人、怎么踩着别人实现一些短暂的胜利，而用“不争”的心态独<|message|>于世的话，那么你就是天下无敌的。


