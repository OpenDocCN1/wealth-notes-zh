  md: '# 王兴｜美团如何在“千团大战”中胜出


    王兴｜美团如何在“千团大... ↓


    关于美团的这段历史，相信很多同学都略知一二。毕竟当年的“千团大战”还历历在目，当时团购行业的疯狂程度，是不亚于后来的打车行业和共享单车行业。


    有时候我也在想，为什么在我们国家的创业总是这种一窝蜂式的、资本迅速催熟的、你死我活式的创业。这个问题大家有时也应该思考一下。


    当然，我们之前也讲过，一流的团队可以把二流的项目做成功，而二流的团队可以把一流的项目也做失败。每当我讲到这个观点的时候，最喜欢的案例就是王兴和他的美团。


    # ｜千团大战中王兴做对的事


    如果我们回顾一下美团或者说团购大战的历史，就会发现，虽然大家做的项目都是“团购”，但做的方法、路径、对行业的理解，以及执行力都是非常非常不同的。我常用的一集喻是，就像登山一样，虽然大家都知道登山很伟大，登顶的状态也很好，但这不意味着任何人都能自然地登山成功。不管做什么事情，真正考验的还是你的思维能力和执行力。


    实际上这也是王兴的优势。虽然创业两次的王兴是个行动派，但他最大的优势还是他的思考能力，他的战略眼光和他的大局观。毫不夸张地说，正是因为王兴对团购这个业务思考得足够深，才最终使他们脱颖而出，成为了最后的赢家。


    现在再回头看，王兴在整个这场快速的战争中，有两件事是做得极为正确的。


    +   一、王兴在很早就看明白了团购行业的本质


    本质一：消费者第一


    很多同学可能知道，团购模式的鼻祖是美国的公司Groupon。当时这家开创了团购模式的公司风头非常强劲，很快融资几千万美元。


    王兴刚开始做美团的时候，很多记者问他美团和Groupon有什么不同，王兴说：


    > “虽然都是团购，但我们对这件事情的理解非常不同。你看Groupon毛利是40%，从商家身上获取价值，商家第一，消费者第二；但是美团认为消费者第一，商家第二。所以必须把毛利率降低，把实惠留给消费者，当然这也需要大量的消费者购买才能维持这个模式。高毛利的Groupon可以<|message|>
    麦肯锡、投资银行的人，开高工资，用粗放式的管理快速增长；但是低毛利的美团必须精细化管理。”


    > “Groupon花钱太大大手大脚了。在高速成长的时候，你在质量、成本、速度里面必须三选二，要舍弃一个。Groupon舍弃的是成本，但是由饥入奢易，由奢入俭难，之后要砍掉成本就比较难了。我们自己也没有什么妙方，就是清了，团购是长期追求低成本、高效率的一件事。”


    如果你觉得这段话听着似曾相识，不妨来听听王兴说的另外一段话，他是这么说的：


    > “回到价值排序，客户第一。客户又分为消费者和商户两端，两端都很重要，都要服务。但是这两者有了冲突怎么办呢？我们选择把消费者排在第一位。如果没有消费者，商户是不会用我们的。首先，消费者要什么东西？永远要更价格、高品质的。其次，如何做到低价格、高品质？这对运营有什么要求？要高效率、低成本，只有做到这个，你才能够盈利。我们给消费者的价格肯定是商家给我们的价格加上我们的运营成本，能低成本运营的话，就不用加价很多，低成本有利于达到前面说的低价格。如何提高效率，不能靠大家加班，那是有限度的，还需要IT系统技术提升管理效率，需要高科技。但是高科技不一定是高毛利，苹果是典型的高科技、高毛利，不过还有其他典型，亚马逊就是高科技、低毛利。这就需要大规模了，如果低毛利的规模小，就没有商业价值，如果它有巨大的规模，哪怕低毛利，也有巨大的商业价值。亚马逊就证明了这件事情。”


    从这段话里，我一直觉得，从思考问题的方式和所在的行业来说，王兴一直是国内最接近贝佐斯的一个企业家。实际上他也从很早就开始研究亚马逊和贝佐斯了，在上面这一段话中，相信你也感受到了这一点。


    本质二：美团的定位是“本地生活服务商”


    所谓“本地生活服务”就是我们很熟悉的那些线下服务，比如餐饮、电影、KTV、美容美发等等，这些大家如今都非常熟悉了。


    但其实，当年团购起家的时候大量其他团购网站做的都是“实物团购”，也就是卖东西，比如化妆品、服装等等。因为服务业本来毛利就低，价格提不上去，还有地域的限制，但是实物商品可以发往全国，还有高毛利，看起来好像更合适。


    但王兴心里非常明白，他说：如果不能形成长久的竞争优势，任何短期的快速增长都是没有未来的。要做实物团购，除非你选品、价格、物流等都有非常明显的体验优势，否则长期来看你怎么可能打得过淘宝呢？淘宝有非常大的流量，你做的事
    情它也能做，还比你做得更好。如果要和它们竞争，为了差异化的体验你可能得自建物流了，但这里面消耗的资金会是巨大的。


    当然，那个时候的京东已经开始自建物流，并且借助这个竞争优势和阿里形成了分庭抗礼之势，不过这也是后话了。


    从这些你就可以看出，王兴对自己在做的事情的理解是非常深的。


    +   二、美团抵住了压力和诱惑


