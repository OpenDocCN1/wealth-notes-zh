    # 腾讯 | 腾讯游戏从哪里来


    我爸是联众铁粉，在扑克、象棋和跳棋几种游戏里积分无数。后来不玩了因为牌友都转移了，老跟陌生人玩容易生气。所以说，腾讯游戏成功确实是跟QQ分不开的，也许要借助社会学某些理论来分析，跟好友玩游戏、战友变朋友，这是一个可以持续下去的循环。


    其实想想真的蛮神奇，我们常常说XX公司具有XX基因，不外乎是该公司因为某项业务成名后而进行的总结概括。比如阿里之于电商，百度之于搜索，腾讯之于社交，网易之于游戏。但当某家公司打破基因藩篱另辟蹊径，闯出―片新天地，不知该感慨基因限制并没有那么可怕，还是惊讶于人的潜力和创造力无穷无尽。


    今天的课后，我想做一个假设。如果腾讯在进军游戏领域之前，就建立了腾讯互动娱乐事业部，并且明确了网易的运行模式，第一个做=

    就是QQ游戏平台，主打产品就是QQ斗地主，那么，腾讯游戏会成功吗？我的答案是否定的。就像我们之前学习美团、阿里巴巴，某种程度上来说，第一次甚至第二次创业失败是肯定的，即使拥有最好的员工，最好的运行模式，最好的产品，失败仍然是最大的可能性。有了这种想法，我们就不会去奢望第一次就成功，而是勇敢去做，失败了就去总结，总结完了继续上路。刘强东没想过，我创业过程中一直很缺钱怎么办？王兴没想过，我做的“砍否”影响到国家言论自由怎么办？这些都是创业过程中遇到的问题，是最开始想不到的问题。有了这个思想准备，面对失败，我们也会更加从容。


    聊到任宇昕的时候让我再次感慨选择的重要性：（1）倘若腾讯没有选择任宇昕，任宇昕没有选择网易模式的项目管理制度，没有选择正确的主战场，腾讯都有可能早已万劫不复。（2）对个人而言，选择比努力重要，一个明智的选择会把一个人带上螺旋直上的康庄大道，也可能把人卷入暗无天日的漩涡中，这或许也是我们要坚持终身学习的原因：通过不断把自己拆开和重组，变成一个更有智慧、有超强预测能力、有见识的人。（3）说到底，很多的选择就是选人，无论是选择得到以及这个专栏，还是选择身边的朋友、选择工作，最终都是看上背后的人能让自己变得更加美好。


    # 腾讯 | “赛马机制”


    谈到腾讯的开始、组织架构的调整和游戏业务的曲折之路，再提及内部的赛马机制，不由得想起“蚂蚁和大象的故事”：已经成为了大象，如何才能打破“创新者窘境”的桎梏？在此分享吴军老师介绍谷歌时说过的一个故事：佩奇在公司一次内部会议上讲，企业和生物一样，从小到大，慢慢老化再到衰亡，难以避免。据他了解，全世界只有―种生物可以不死，就是一种海蜇。这种海蜇在正常情况下和其他生物没有什么不同，都会老病死亡，但是如果刻意用针去刺激它，它会长出新的细胞，然后当母体死亡时，新的细胞会发育成完整的海蜇。佩奇希望Google能不断创造的产品部门，这些小的部门就如同那只海蜇新发育出来的细胞，它们最终能够不依赖于母体生存长大。佩奇希望通过这种方式，逃脱大公司的宿命。因此，他利用公司的财力资源和智力资源，不断尝试新领域的创新。为此，Google成立了Google风投、X实验室等独立的部门，这件事情在一开始交给布林负责，而他则负责公司日常的管理。现在看来，腾讯在业务上不局限自己，从社交到游戏（包括现在的投资），在内部管理上充满活力（内部竞争，先打赢自己），这也不是不是不断培育“新细胞”的做法吗？


    起起伏伏都是正常的，就看有没有一个好的心态。不必过于强调波折，有波折是常态，就像经济学中的理性预期学派认为市场波动像发生洪水和地震一样正常。对于波折无须害怕，无须恐惧。波折相当于一个刺激，在刺激和反应之间是自由选择的意志，要在这个部分多琢磨。一句话：见招拆招，怕什么。关键是能不能在一个领域持续深挖，只要持续扎根，资源就会向你靠拢，实现目标就不困难。铭记人是一切的根本，人的能力包括了资源、程序和价值观。如何找到对的人并让他们发挥作用是关键中的关键。所以说的官方意志都是一群高手会集讨论出来的。最后要说一句：别人的成功是只能借鉴不能模仿的。


    同事说腾讯只会“模仿”。确实，QQ游戏大厅和联众，还有QQ堂、QQ飞车等。以前的腾讯确实擅长“模仿”，虽然被大家玩家诟病，可是这个模式也还行得通，大家一边骂一边玩……身体还是很诚实。可是今天我们再用“模仿”思维去理解腾讯，就有点以偏概全了。腾讯全球市值前五，这可不是单靠模仿就能做到的，它一定还有被我们忽略了的优势。用过往的思维思考历史，可能是“正确”的，用过往的思维面对成长，你会掉到坑里。


    吴军老师曾经说过在一个和谐社会里面有动力的人应该成为引擎，有经验的人应该成为刹车。而一个好的组织架构里面应该是地方自治层层向上构建，因为动力来自底层。在我看来，腾讯的赛马机制非常好地激发了底层团队的创造力。在腾讯这个大平台上面，如果能做出一个爆款游戏，成为全民热议的话题，同时还能拿够到丰厚的奖金，还有什么比这更有吸引力呢？'
