  md: '要！


    今日商业心法思考：1.像诸葛丧尸登陆那样强势出产品的核心竞争力。可以说，无论是早期还是现在，腾讯的商业模式完全建立在基于人性的社交关系QQ和微信上，一直认为：我们在打开微信时，那个独自看着这个星球的人，是一个强烈激发起孤独感的伟大设计一那是人非常本质的一种状态，同时又道出人是多么需要äsident。即我现在不了解当年的3Q大战，QQ的社交关系一定让我选择腾讯这边站。这就是一家公司或者产品的核心竞争力，就像当年盟军专执住诸葛丧尸这个点强行登碉，强势扭转整个二战的战局。2.善待自己商业生态系统中的朋友。腾讯这种无所不包的成长方式，让我想起了水浒变，每来到一处，就以推枯拉朽之势对当地生态系统造成致命性摧毁。其实，无论是个个人、公司，还是一个物种，都处于一个网络/生态系统中，一家独大不让别人活，最后必然是自讨苦吃，自取灭亡。3Q大战，腾讯就像是一个到处惹架的熊孩子，在命中注定遇到专门派来收拾他的更熊的孩子360。


    对用户来说，人们更关心的是鸡蛋好不好吃，而不关心究竟是哪只鸡生的蛋。如果腾讯有能力让资源利用率更高，让用户体验更好，它就该成为赢家，他的抄袭可以被原谅。这也符合周磊老师讲的科斯定律：谁能将资源利用得更好，资源就从谁来利用。这样可以使社会效率最高。但同时，如果小公司的原创被抄袭，也该获得一定的补偿，这样有利于保护创新。就像zara，商业模式之一就是借鉴，时不时地被借鉴者起诉，要求赔偿。zara是要被肯定的，该赔偿的也是要赔偿的。不过互联网领域确定版权是件很困难的事。


    有时期，民间有一句俗语‘有钱不赚，是王八蛋’，能赚钱为什么不赚呢？底线和边界随着社会进步和科技进步，逐步被国人理解。价值观测渐被放在极其重要的高度。什么钱可以赚，什么钱可以和别人一同赚，什么钱不能赚。背后是什么事可以做，什么事不可以做。什么东西能吃，什么东西不能吃。现在的人对边界和效率已经有了较深的理解，而几年前、十几年前，跨界、通吃、全产业链覆盖很流行，原因就是什么钱都想赚，什么事都想干，什么都会吃，根本不怕吃多了消化不良。这些都是那个时期的特点。能够看清边界和效率的少数公司，在穿越那个时期后，都跑出来了。如本期的主人公腾讯。


    # 腾讯 | 从巨型怪兽到合作伙伴的关键转折


    3Q大战的反思：1.不能混淆个人道德与商业道德：腾讯极端的照抄其他公司的模式是属于商业道德的评价领域；360从骨子里就包含周鸿祎底层无节操的“流氓”基因，无论是制造“流氓软件”，还是摇身一变成为了缉杀“流氓软件”的英雄，这里里面具有太多的个人道德因素；360直接模仿并走腾讯用户信息的行为，更树立开了无底线的流氓模式，属于公然侵犯腾讯公司财产的严重违法行为。腾讯公告，导致装载360的电脑无法正常运行，又是典型权利纠纷公众利益，从商业道德影响到个人道德的评价。2.血与泪的升华坏事变好事，腾讯走向开放、自律与成熟；而360依然习惯投机，难以摆脱道德评价；360自美股的私有化从商业逻辑上无可厚非，但进一步体现360的不成熟，依然没学会如何真正从提升市场的体验、为世界创造更好的价值服务与壮大的理念，疑似依然沉迷于投机、阴谋的老使例，前景堪忧。3.无所不用其极的反思。也许朋友们会提出腾讯当年山寨无所不用，这正是正当也是不得已；但，人从来不是没有选择，而是价值<|message|>


    老师好！两周的课的确让人感慨良多，尤其今天的讲述方式画面感强烈，特别是马化腾在做决定时的那种纠结和mo识，让人看到一个真实的企业家在面临残酷竞争、生死抉择时，那种不可与人言的心路历程。第一，“作为人，何谓正确”。稻盛和夫先生的这句名言，是对人性和商业活动的拷问。在残酷且激烈的商业竞争中，适者生存法则将人性的复杂暴露无遗。华为任正非提出“发商”的概念，他指出“华为要成为灯塔，但是这个过程不是要让爱立信、诺基亚这些灯塔倒下，是让大家一起成为灯塔”。不择手段、唯利是图并非正途，合作共赢才能更加繁荣。第二，“福祸相倚”。从过程来看心里动魄，对身处其中的企业和人来说可能并非像旁观者一样“看热闹”，面临的是“生死存亡”。当时这场大战可能对两家企业而言都是不愿意面对的祸事，但事后却意外改变了这两家公司和两位创始人，无论是公司战略还是思维方式都有了变革，反而推动了自身和整个互联网产业的发展和繁荣，这是一种福报。


    “3Q”大战以及腾讯今天的发展说明：成小事，你需要朋友；成大事，你需要敌人，而且越强大越好。


    “马八条”可以概括为：一、互联网即将走出其历史的“三峡时代”，激情会更少，力量会更大。二、客户端将不再重要，产业上游的价值将重新崛起。三、“圣迷”是一个令人烦恼的罪名，但有的时候确实是一个假想的罪名。四、截杀渠道者仅仅是“刺客”，占据源头者才是“革命者”。五、广告模式是“产品经济”的产物，知识产权模式是“体验经济”的胎儿。六、不要被“免费”听倒。拥有“稀缺性”，就拥有了破解免费魔咒的武器。七、产品经济束缚人，互联网经济将解放人。八、在“云组织”时代，“伟公司”不见得是“大公司”。


    # 腾讯 | 从微信积分解、概率论视角看腾讯和阿里的底层逻辑差异


    很喜欢老师讲商业哲学。最开始是亚马逊，来回听了好几次，然后是王兴，来回听了好几次，今天也是如此。看了很多就发现其实没有对错，只有适合。每个人的选择都是当时认为的最好的选择。腾讯的改变不过是他们认识到短痛的必要，可能很早就知道不能大包大揽，但是利益在前方实在不舍得拒绝。3Q大战最终让他们做出了坚定的选择。诺基亚那么早就发明了智能机，只是舍不得放弃已有利益，如果他事先知道乔布斯在研制智能机他们肯定会杜士断腕。只可惜，苹果盛名太盛，产品太好，创新太大，诺基亚无法回天了。腾讯发现现在的模式是最适合他们的，但是如果有一日事态在变，他也不得不变，除非第二个诺基亚。阿里，也是在摸索中前进，从身后看似乎是战略布局，其实都是走一步看一步来的，只不过它无法做出一个个产品，而他适合大布局大视野，虽然每个布局都是一步一步来的。阿里和腾讯都已经是很厚的公司，有太多的底蕴，人才，现金流，就像大唐王朝，可以开放，可以兼收并包，可以经受一定的风吹雨打。但是，视野、方法论、执行力，一个都不能少。否则也会日渐凋零。是火是水，个人感觉都是抽象过度了，他们的层次应该很难以单一介质描述。光靠火阿里怎么做到现在，光靠水腾讯怎么可能挺住这么大的挑战。就像管仲治齐，陶朱公富贵，视野都是高远的，手款都是复杂的，情结都是多变的。越高级的食物越复杂，越复杂的事务，面临的环境越复杂，越需要复杂的对应。所谓万变不离其宗，可以从中找出一个大模，但绝对不是唯一。他肯定存在着一个对立面，就像万维钢所说的在头脑中，同时容下两个对立的思想，而且还都能自洽。张老师给了我们一个很好的探索之路。


    阿里如树：所有的业务纵使像“根”一样盘根错节，也都为躯干服务。腾讯似花：绽放绚烂尽自然，物竞天择。


    杀不死我的，使我更强大。其实关键在于是前半句。我的理解是，如果要践行反脆弱，就要勇于犯错，勤犯错，早犯错，在错误中学习，在错误中进步，并且不要犯致命的错误。'
