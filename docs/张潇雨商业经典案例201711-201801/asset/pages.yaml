  md: '# 京东 | 刘强东最重要的事业伙伴


    在上期专栏里，我们讲到了京东的创业历史，也就是“京东从哪里来”的问题。而想要了解京东为什么能走到今天，还不能绕过另外一件事情，就是京东发展历史上的三次非常重要的融资。


    和中国很多如今已经特别成功的互联网公司不同，京东的创业史一直是非常艰苦的，可以说缺钱是个默认的常态。


    现在来看，这主要有两个原因：


    首先是零售业的天然特点。


    我们之前分析过零售业的历史，相信你对“多、快、好、省”这四字诀还应该有印象。实际上不管是沃尔玛、Costco这种传统企业，还是亚马逊这种新形态的零售企业，降低成本，让利给用户从来都是最重要的一件事。再加上在中國做电商竞争非常激烈，所以这个行业本身资金就非常紧张，亏钱也是常态。


    另外，京东起家的时间其实很早，整个风险投资业还没有那么发达，不像现在，基金遍地都是。


    连马云也是被拒绝了几十次以后才找到他的雅虎和孙正义。所以无论如何，在中国做电商都是一件非常艰难的事，对于京东就更是这样。所以，现在再来回顾一下京东融资的历史，会格外有意义。今天和明天，我们就来谈谈京东历史上最重要的三次融资。


    这三次融资中，最重要的一次应该是京东历史上第一次正式的融资。很多人都知道，这次融资不仅成就了刘强东，也成就了今日资本和它的掌门人徐新。


    # | 徐新—刘强东的蔡崇信


    2006年的时候，刘强东和徐新第一次见面。徐新对刘强东第一印象就很好，觉得他很有诚信，也很有抱负，心里只想做第一，不想做第二。另外，徐新还发现在没有任何大广告的情况下，京东每个月的收入都比上个月增长10%，显然是业务方向做对了。


    两个人聊到凌晨两点，徐新直接买了两张第二天早上9点的机票，和刘强东从北京去往上海，这也是今日资本的总部所在地。当然后来徐新回忆说，这么安排主要是怕刘强东还去见别的投资人。


    今日资本迅速做了尽职调查，他们访问了几个京东的客户，反馈是方便、便宜、专业。他们还打电话给10个京东的供应商，供货商说，京东这家公司拿货不多，但是团队斗志昂扬，感觉自己特别来劲，有种“我跟你们就是不一样”的感觉。


    当然，他们也在网上看到很多骂京东的帖子，比如送货有点慢、东西到了都磕坏了，或者一些售后问题等等。徐新觉得这恰恰是钱能解决的问题，所以最终拍板，投资京东。


    当时刘强东希望融资200万美元。徐新说：“200万美元哪够啊，当机会来临的时候你要舍命狂奔，迅速做大，成为第一品牌，这样其他家就没机会了。所以你需要1000万美元。”估值是刘强东定的，徐新马上就答应了，价都没有还。非常有意思的是，这种听起来有点传奇的故事在京东后来融资的时候，又发生了一次。


    # | 好的投资人能给公司多大帮助?


    刚才我们说京东历史上很长时间都缺钱，2008年算是他们最危险的时候。


    我们今天讲了京东第一次拥抱风险投资机构的经历，也是刘强东遇上他一生的最重要的事业伙伴之一徐新的过程。明天，我们会继续讲京东后两次非常关键的融资。


    张潇雨


    在今天的讲解中你也看到了，徐新对刘强东的帮助确实特别大，先是做伯乐，之后是像朋友一样提供建议，货款给刘强东渡过难关，还引荐其他的投资人给他。

    在你看来，徐新为什么会一直这么帮刘强东呢？欢迎把你的见解写在留言区跟大家分享，我们明天见。'
