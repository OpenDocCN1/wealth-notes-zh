  md: '相对于腾讯，阿里巴巴的商业模式是创新的，独此一家，包括像淘宝、支付宝这些产品都是中国独创的，非抄袭国外的模式，这也是中国的支付系统比美国、韩国先进的原因。腾讯的商业模式基本是模仿，包括早期的微信、QQ都是模仿外国的类似产品。这样的商业模式非常可怕，原始积累使得腾讯财大气粗，任何能模仿的东西都可以模仿，而且一般还做得更好，不能模仿的就收购，入股。阿里巴巴更像是马云的从创新到创造，这样一比，腾讯更稳、更成熟，可能活得会更久，风险也相对小些。当今国内互联网由BAT三足鼎立的格局，变成了阿里、腾讯双寡头争先的局面，某外媒曾这样评论：“中国无论诞生多么有潜力新兴企业，都会被认为反正要被阿里巴巴和腾讯收购，市场竞争会立刻结束，这种消极的氛围正开始在中国蔓延”。这也正是我们要警惕的，现在回头看当年周鸿祎拒绝雷军，放弃马云，直面挑战的马化腾是多么的难能可贵，正因于此我们的互联网才蓬勃发展了这么多年。往后呢？从这一周腾讯的先入后股永辉超市、唯品会的一系列动作，两大寡头正面竞争将不可避免。腾讯自己联合行业老二、老三挑战老大阿里"，有点类似于小米做插线板、空气净化器的打法，马总要认真思考了。


    # 腾讯｜马化腾的产品观（上）


    薛兆丰老师曾经在专栏中讲过，一个事件发生后，有些影响是看得到的，有些影响是一般人看不到的，但是有些思考深入的经济学家是能够看到的。大意如此，其实就是指我们在思考一件事情的时候，要从不同的维度以及时间长度去思考，这样才能看得更广、更远。小马哥所谓的隐性特性，大抵如此。关于用户需求，我一直好奇苹果公司是怎么用用户需求调研的，反正每次购买苹果产品之后不久，就会收到他们发给用户体验调研邮件。我以为乔布斯他自己首先就是一个科技产品的重度使用者，在此条件下，他主导开发的产品便自带了头部用户的体验和反馈，然而对于大多数人甚至是产品经理而言，可能都未必是一个合格的产品使用者，这时如果还不能倾听用户需求，就会适得其反了。关于口碑，小马哥的思路跟小米的思路很像，服务好发烧友，进而将影响力推广至更多的人。这与
    Paul Graham 的那句，拥有3000个普通用户，不如拥有300个重度用户不谋而合。


    我认为隐性需求的关键点还是真实的服务对象决定的，你产品特性能不能为隐性需求服务，这就需要搓据客户要什么。比如设计ATM机器，这其实是客户与银行服务的一个接触点，可能对银行的评价就会产生微妙的变化。目前大家都差不多，有没有可能加入些其他应用场景呢？比如打印账单、发票，生活服务缴费等。这样客户的黏度会不会更好？产品要和应用场景匹配，才能成为一个好产品。平白无故想出来的需求可能是一个伪需求，还是要了解客户，为客户解决问题，解决痛点，帮助客户节省时间和不必要的麻烦，才有可能赢得客户。


    老师，应该先从不猜测用户需求开始，然后考虑产品的隐性特征，再考虑头部资源的口碑。其实，说到底，先吃客户的需求研究透，这个是基础，可以偏，但不能错，比如你觉得客户的需求是A，但其实际客户的实际需求是A-，那么调整起来是相对可行的<|message|>，如果一开始你判断顾客的需求是C，那就是方向的错误了，是致命的，可能就快速停止，重新研究方向。其次，隐性特征从根本上讲就是产品的战略思维，这个产品对用户，乃至于对公司的意义在哪里。最后，口碑的传播问题是建立在前两个条件具备的基础上才具备可延伸性的。但我的问题就是“知道做什么，和怎么卖完全是两个问题”，难就难在How的问题上。


    1.忽视隐性特性，不注重积累口碑，我觉得藏在其中的核心问题都是没有明白做产品核心解决的问题是什么。我想起之前提到的，携程、去哪儿要解决的问题应该是不在家里有地方住，而不是一定是要住怎么样的酒店，所以airbnb横空出世并异军突起，要隔段时间提高一个维度去看自己的产品。清楚了自己要解决什么问题才能在对的功能上瞄准，花心思做好，而忽略那些不重要的。一些显性特性以及注重口碑宣传，都是优化作用，如果不能解决核心问题，外部优化做得再好也是不能长久的。2.自己猜测用户需求，很类似“奶昔错误”。去弄清客户要的是什么才是解决问题、优化产品的根本途径。现在很多产品其实都有类似的错误，把程序搞得很复杂，似似乎很高大上，但不好用，不会用，客户也就慢慢放弃。现在的竞争压力确实很大，有很多时候不是自己不好，而是别人提供了更好的服务。但正是因为这样不断更新迭代的产品服务，才让我们的生活越来越美好。努力向上永远是件好事！


    # 腾讯｜马化腾的产品观（下）


    看完今天的内容，我首先想到的是之前张老师专栏中讲过的，深泽直人的“无意识设计”——用户不需要“想太多”就能很自然地使用产品，不需要任何说明书。感觉上腾讯的产品就是在进行这方面的追求。从我个人使用一些产品的体验上来说，如果一个产品能够让用户使用得很自然，让用户感觉不到好才是真的好。一款满足用户自然体验的产品，会让用户在换用其他产品时感觉到别扭不舒服，然后产生：原来它这么好用，这样的念头，这样一款产品才是真的有用户价值。相反，如果一款产品，完全不站在用户的角度来设计，拍脑袋，想当然，经常性地折腾用户，要不了多久，用户就都跑光了。


    这几章下来整体印象最深刻的就是马化腾的危机意识，保持动态的理念，不论是前期复制别人的成果，还是开发游戏、邮箱、微信等业务领域的扩张，他要求公司始终不停在前行，要有新的东西呈现给他的用户。他自己也在不断进化，对3Q大战的冲击的反应时间也比较短，迅速调整成开放宽容的态度。我觉得他就像一个赛车手，总是在路上，一点不放松，小步试错，快速迭代。我们也应该学习始终以变化的眼光看世界，我相信腾讯还会出来更多的产品。


    对我触动最大的是忽视产品的隐性特征这一条。有句话说得好，客户想要的是墙上开个孔而不是为了得到一个钻头，产品的背后是服务，是客户为了完成某项任务。如果不清楚地认识这一点，可能就会困在自己的局里，单纯为了创新而创新。互联网软件产品适合小步快跑，快速迭代。但是这个方法论试了以后发现不适合我们的产品和行业，作为一个有已知道资客户的需求和方法论的行业，像家具，一次做好比小步快跑重要，我们没有迭代的机会，因为一次性做不好就会失去口碑。


    账本：最后一主点让我有感触，“用筷子法才能跑完全程”，就像吴军老师讲的那样“上帝喜欢筷子人”。筷子法往往意味着低风险，像笑来说的，越会投资的人往往是越会降低风险的人。一个风险如果真的发生，之前用小聪明积累的优势也就化为乌有，甚至更加麻烦。'
