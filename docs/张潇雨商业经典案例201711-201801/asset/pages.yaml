    # 划重点


    投资意向书中的五个重要条款：

    1. 保护性规定：投资人要求公司在做可能损害他们利益的事之前，要获得他们的批准。

    2. 知情权：公司的重大决策、财务信息，投资人有知情权。

    3. 反稀释条款：用于防止投资人的股份后续被过度稀释。

    4. 董事会成员设置：公司发展后期，董事会中的主导位置将由创始人变为投资人团体。

    5. 创始人股份限制：将创始人股份分期归属，以防创始人提前离开。


