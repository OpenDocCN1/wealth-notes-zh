  md: '# 腾讯｜腾讯游戏从哪里来


    相信你还记得，之前我们在纵览腾讯整个业务的时候，提到过最大的一块收入来自游戏。我们对腾讯的整体印象也一直是一个“游戏+社交”的公司。但实际上，腾讯的游戏业务能发展到今天，其实现为不易，还差点夭折在半路上。这期专栏我们就来讲一讲腾讯的游戏业务。


    # ｜第一次试水失败


    腾讯第一次接触游戏其实非常失败。当时的时间是2003年，我们之前讲过，腾讯靠着从MIH融到的钱，后来发展出了与电信运营商的合作，还有QQ秀业务，渐渐开始盈利，公司算是比较安全的了。这时候，马化腾知道他要开拓新战线了。


    当时网络游戏在中国其实已经非常火热了。


    2001年，陈天桥创办的上海盛大公司代理了韩国的《传奇》，结果这个30万美元代理的产品，一年以后就创造了60万人同时在线的记录。当时盛大每天的收入都超过100万人民币，陈天桥后来也成为了中国首富。


    而同时，网易的丁磊也投身了网游，他收购的团队开发出了《大话西游Online》，然后第二年又推出了《大话西游2》，这些都成为了后来网易的主要收入支柱。


    于是，腾讯也坐不住了。他们征调了一支新团队，开始进军网络游戏领域。


    为了快速进入市场，当时的腾讯没有选择自主研发，而是非常自然地选择了代理模式。他们的思路是，要引进就引进最好的，于是当时他们就代理了韩国最先进的3D角色扮演游戏《凯旋》。


    这款游戏不管在画面上、可玩程度还是丰富性上，都大大超过了2D版的《传奇》。


    然而，当年靠非常细致的用户体验胜出的腾讯，在网游界犯了一个大错误。


    当时《凯旋》这款游戏所采用的先进的3D技术，对电脑配置和网络带宽的要求很高，这和我们相对落后的国情是非常不符合的。结果，尽管腾讯技术团队对游戏底层做了很多次优化，但是游戏的流畅性还是很差，画面上全是锯齿和马赛克。最终导致这款重金引进的游戏很快被玩家抛弃，腾讯第一次试水游戏的行为以失败告终。


    当时盛大公司的发言人还略带嘲笑地对媒体说：“我们对腾讯进入网游领域表示敬畏，不过，腾讯也要对网游行业本身产生敬畏。”


    因为这次失利，很长一段时间腾讯都有点不敢再碰游戏了。直到2004年年中，腾讯的核心管理团队才重提再次进军游戏领域。


    不过在讲这段历史之前，我们先要看一个腾讯在组织架构上的变化。理解了这一点，才能理解腾讯游戏的业务是怎样起飞的。


    # ｜腾讯的组织架构


    在2003年初左右，由于腾讯开启了和中国移动合作的“移动梦网”业务，核心管理层对腾讯的组织架构进行了第一次调整，整个公司被划分成了三大部门，分别是市场部、研发部和职能部门。因为研究的英文是Research，市场的是Marketing，所以后来研发被简称为“R线”，市场也被称之为“M线”。


    另外在公司决策上，腾讯采取了所谓的“总办会议制度”。这个会每两周召开一次，参加者是5位创始人和各核心业务的部门主管，人数基本在10-12人，不会因为人太多而不可控。这个人数一直相对稳定，哪怕到后来腾讯员工数超过2万之后，总办会的参加人数也就是16个。


    腾讯还有一个比较特殊的惯例是，总办会没有表决制度。


    > 吴晓波老师在他的《腾讯传》里也写道：


    根据人力资源部门主管奚丹等人的记忆，“十来年里，没有一次决策是靠表决产生的”。在部门业务事项上，相关责任主管的意见很受重视，“谁主管，谁提出，谁负责”。在关系到公司整体战略的事务上，以达成共识为决策前提，如果反对的人多，就暂时搁置。而一旦大多数人赞同，反对者可以保留意见。而且，马化腾并没有被授予“一票赞成”或“一票否决”的权力，他看上去更像是一个折中者。


    但随着腾讯业务的增长，这种“R线”和“M线”划分的方式有点跟不上节奏了。研发和市场经常脱节。互联网业务的迭代速度非常快，信息一旦跨部门传递，效率马上就下降了。


    所以当时马化腾决定，新组建一个游戏部，然后把相关的人聚集在一个团队里，也就是实行事业部制，大家各自自我负责。当时丁磊把网易的游戏部门叫做互动娱乐部，而腾讯的游戏事业部也借鉴了网易的做法，于是，腾讯互动娱乐事业部成立了。


    另外在这里可以插一句，我们之前在讲苹 果的时候，提到过组织架构的问题，文章的链接我放在了文稿末尾，非常推荐大家再去读一读，相信你会有不同的收获。


    # ｜腾讯互动娱乐事业部的建立


    腾讯互动娱乐事业部的负责人叫任宇昕，现有已经是腾讯的COO了。他1975年出生，在2000年1月以工程师的身份入职，严格意义上说是腾讯第一个从社会上招聘来的员工。


    任宇昕也知道，这是腾讯和马化腾交给他的一项任务，在游戏上做出突破。对于当时已经足够落后的腾讯来说，这是一场硬仗。作为这场战斗的将领，任宇昕做了两个重要的决定：


    +   1. 确定组织架构


    腾讯的大架构有了，互娱部得有自己的小架构。


    当时游戏界有所谓盛大模式和网易模式两种：


    盛大模式：将开发和运营分离开来，一个团队专门开发，一个团队专门运营，这样比较术业有专攻；


    网易模式：合二为一，实行项目制。这种模式一开始会比较困难，因为负责团队的领头人一般是技术出身，对运营一窍不通。但是从长远看，这种模式可以倒逼出一批有运营头脑的技术主管。


    最终，任宇昕选择了网易模式。后来这个模式被固定了下来，腾讯经常以一个游戏为独立单元组建专门的工作室，成则回报巨大，失败则拆散重构，形成了一种内部的赛马机制。这里面的细节我们下期专栏会说更多。


