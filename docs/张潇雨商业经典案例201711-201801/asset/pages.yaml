  md: '# 谷歌 | 谷歌的业务本质是什么


    这周我们继续“大科技公司”的专题。在讲完Facebook之后，我们来谈谈谷歌。


    # ｜近期内容预告


    现在全世界最大的科技公司里，除了中国的阿里、腾讯，应该就是美国的“五大”了。所谓的“五大”是：苹果、亚马逊、谷歌、Facebook和微软。


    苹果和亚马逊我们都已经讲了不少，Facebook也讲了一部分，那么接下来我们会陆续地讲到谷歌和微软。当然，除了独立地介绍这些公司以外，我们在专栏里还会穿插着对几大公司之间错综复杂的关系的平行性讲解。相信在这个专题之后，同学们会对这几家和我们生活息息相关的科技大公司有更底层的认识，而不只是停留在表面印象里。


    另外还可以透露一个小消息，由于很快就要步入春节假期了，我在春节期间的专栏给大家留了彩蛋——到时候我们会讲一些好玩儿的内容。


    # ｜思考：谷歌是一家什么样的公司？


    和之前讲过的几家大公司一样，对于谷歌这样一家我们既熟悉又陌生的公司，我也想了很多讲解它的角度。最终我想通过谷歌这家公司，讲三个平时我在分析一家公司的时候经常使用的视角，同时，这也是很多人看一家公司的时候非常容易忽略的角度和视角。尤其是对于亚马逊、苹果、谷歌这样我们非常熟悉的公司，我们常常对于它们只是停留在表面印象上，很多时候这还不如完全不了解一家公司呢。就好像那句话说的，偏见有时候比无知更可怕。


    那么我在谷歌系列里想传递的三个分析公司的视角是什么呢：


    +   第一，如何从一个公司重要决策的时间脉络，来理解一个公司的战略走势；

    第二，如何从一家公司产品功能之外的属性，来理解一家公司的战略意图；

    第三，如何从最简单、最本质的问题出发，来理解一个公司的底层特性。


    接下来几期专栏，我就会围绕着这三个问题讲解谷歌。


    首先，我觉得我们可以思考一个问题：当我们说起谷歌的时候——当然，从2015年底开始，谷歌已经是母公司Alphabet的一个全资子公司了，不过我们这里出于习惯还是叫谷歌吧——当我们说起谷歌的时候，你觉得这是一家什么样的公司呢？


    我能想到这样一些答案：


    +   谷歌是全世界最大最好的搜索公司；

    谷歌是全世界最大的广告公司；

    谷歌是人工智能和机器学习最领先的公司；

    谷歌是全世界技术水平最高的、非常重视工程师的公司；


    等等等等。


    这些回答其实都没错，但这些回答都没有触及到谷歌这家公司的本质。


    # ｜谷歌在和谁对抗？


    带着刚才这两个问题，我们来一起看看安卓的故事。理解了这个故事，你就理解了谷歌。


    很多人可能都以为安卓是谷歌创建出来的，但其实，安卓（Android）是谷歌收购的一家公司。当然更少人知道的是，谷歌收购安卓的时候，世界上根本没有iPhone这个东西，iOS系统当然也是从无谈起的。


    # ｜谷歌在智能手机时代的定位是什么


    非常重要的是，在2012年，也就是安卓和iOS争夺的白热化的时期，出现过这么一件事情。'
