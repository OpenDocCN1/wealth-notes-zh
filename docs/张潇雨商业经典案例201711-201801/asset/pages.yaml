- pgno: 33
  md: '# 阿里 | 支付宝VIE事件（下）


    昨天，我们详细地解释了VIE这个知识点。本质上，它就是利用协议控制的方式，用境外的公司控制境内实际在经营的公司，来绕过国内对一些行业的监管政策。而国家出于各种原因，也是对这种方式睁一只眼闭一只眼的。很多我们耳熟能详的公司，包括阿里、腾讯、百度、京东等等都是这样设置的架构。


    然而到了2011年，出现了一次震动整个社会和行业的大事件，这就是当年的“支付宝VIE事件”。


    在这次事件里，一向声誉非常好，深受敬仰的马云却被绘成了一个“小偷”，而背后反映的整个经济和政治问题在当年也是闹得沸沸扬扬，引起了多方的争论。今天我们就来复盘一下当时的情景，重新看看这个经典案例。


    # | 雅虎的指控


    在2011年5月10日的时候，雅虎发布了一个震动整个社会的公告，上面说：


    > 马云把支付宝从阿里巴巴集团转移到了另外一个公司里，这个公司是马云和阿里创始人之一谢世煌设立的“浙江阿里巴巴电子商务有限公司”。而作为阿里巴巴集团大股东的雅虎，对于马云转移支付宝的行为毫不知情。


    结果这个消息一出，当时雅虎的股价就下跌超过7%。


    +   1. 违背公司治理规则。雅虎在公告里的言外之意是，马云转移支付宝并没有获得阿里集团董事会​​的授权许可，因为作为董事会成员的雅虎代表杨致远对此事并不知情。这肯定是严重违背公司治理规则的。


    2. 为自己谋私利。马云这种将集团资产转移到自己绝对控股权公司的行为，不仅是对契约精神的违背，甚至可能是一种为自己谋私利的违法行为，这对在国内外声誉一向良好的马云是很大的指控。


    3. 打破行业规则。VIE这种架构，基本是每个在美国上市的中国互联网公司，和想要去海外上市的互联网公司都在采用的架构。马云的撕毁协议可以说是制造了一个极坏的案例，可能威胁到所有采用这种架构的公司的股价和前景。


    # | 马云的解释


    一个月之后，马云亲自开了发布会作了解释。这些解释在当时大家将信将疑，而且由于其中包括很多专业知识，所以大家还有很多误会，但随着时间的流逝，现在看来马云在当时的解释是站得住脚的：


    +   第一，转移支付宝是得到了董事会授权的。


    第二，转移后，支付宝仍然属于阿里集团。


    第三，马云并没有从中获利。'
