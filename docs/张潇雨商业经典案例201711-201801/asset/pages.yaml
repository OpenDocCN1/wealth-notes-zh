    # 三、时间


    John Bogle老先生说，绝大多数人都很重视回报，但是只有少数人会管理风险，更少的人会注重成本，但只有极少的人，真正理解了时间的价值。


    投资的秘诀之一是用四毛钱买一块钱的东西。其实想要提高回报率，还有另一种方法——用四毛钱买一个每年都能回报你一毛钱的东西，这个东西也许能持续一百年。


    我有一个很喜欢的商业小故事是关于耐克的。他们有一条明星产品线——Nike Air Max系列，鞋里面有气垫。


