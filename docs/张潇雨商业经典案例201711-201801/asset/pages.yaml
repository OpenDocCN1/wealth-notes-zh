  md: '# 阿里 | 两笔大融资与第一次危机


    昨天我们讲到了马云在创立阿里之前的三次创业经历。而35岁的他，再次选择回到杭州，即将开始他目前为止的人生最后一测，也是最伟大的一次旅程。


    今天的内容，我们会从1999年1月阿里巴巴的创立，讲到2003年淘宝网成立之前。在这几年的时间里，阿里有这么几个重要的节点：B2B模式的阿里巴巴出现；公司二把手蔡崇信神奇加入；阿里完成了高盛和软银的两笔大融资；在互联网泡沫的时候，阿里面临了首次危机并大量裁员；阿里终于找到了稳定的盈利模式；最后就是大家熟悉的和美国eBay的大战。


    # | B2B模式的阿里巴巴出现


    很多人都知道，阿里巴巴是在杭州的湖畔花园住宅里面创立的。当时马云召集了后来被称为“十八罗汉”的团队开会，讲 eyelash description...


    > “我们要办一家B2B的电子商务公司，目标有三个：第一，要建立一家生存80年的公司；第二，要建立一家为中国中小企业服务的公司；第三，要建成世界上最大的电子商务公司，进入全球网站前10名。”


    # | 公司二把手蔡崇信神奇加入


    > “我创业后一直想找一位懂资本的人，人家问我想找什么样的人的时候，我说我要找蔡崇信那样的人。朋友们对我说：蔡崇信那样的人不是找来的，而是上帝送来的。”


    # | 高盛、软银两笔大融资


    1999年马云和蔡崇信来到硅谷融资，据说一周时间见了几十个投资人，但是没有一个看好他们。结果，在最不被看好的时候阿里的团队创造了奇迹。在10月的时候，他们获得了一笔500万美元的融资，领投的是著名的投资银行高盛，其他参与的机构还有蔡崇信的老东家瑞典的Investor
    AB。


    # | 首次危机大裁员


    +   此次危机来临的时间是2000年，原因有三个层面：

    第一，从外部环境来说，互联网泡沫的突然崩盘给所有互联网公司都带来了非常巨大的考验，阿里当然也不例外。

    第二，马云在创业一年就拿到了两亿左右人民币的融资，一下子让他不知道如何是好。

    第三，当时的阿里，除了蔡崇信是国际化人才，其它的员工是基本不具备管理国际化团队的能力的。


    # | 稳定的盈利模式


    再之后，阿里在西湖举办了当年的“西湖论剑”。马云再次展现了他善于与媒体交道的夭赋，他以一种行业领导者的姿态连续五六年召开了这个非常有特色的会议。'
