  img_proc: true
- pgno: 160
  md: 'Facebook有了10亿用户的时候。


    而且更可贵的是，这种级别的创新绝对不是孤例。在Facebook创立的整个历史 上，从扎克伯格到下面的员工，这种在产品上的自发创新，对用户的关注是非常普遍的。这让Facebook逐渐超越了其他社交网站，脱颖而出。


    # 2. 善于从他人身上学习。


    从某种程度上说，我觉得他成功的秘诀就是组建了一个豪华的“导师团”，而且在最合适的时间，他总能找到最合适的老师来帮助他，引导他。在之后专栏里我们还会提到扎克伯格的导师们，有一些名字你可能会很熟悉，比如巴菲特、盖茨或者齐布斯，不过这不是今天的重点，我们来看看看“beta版”的扎克伯格是如何向老师学习的。


    在这个阶段，扎克伯格重要的老师有两个，一个是硅谷著名的黑客肖恩·帕克（ Sean Parker ），一个是《华盛顿邮报》的CEO唐纳德·格拉姆（ Donald
    Graham ）。


    肖恩·帕克


    肖恩·帕克的故事我们在之前的专栏就说到过。他是一名传奇的硅谷黑客，创立过已 经成为传奇的音乐分享软件Napster，也被自己的投资人红杉资本赶出了公司。


    当时肖恩·帕克发现了Facebook以后，主动给扎克伯格写信，没过多久他就变成了公司的联合创始人之一。


    帕克在硅谷绝对是个传奇，扎克伯格在他身上除了学会了那种天不怕地不怕的“海盗”精神之外，也明白了资本可怕的力量。在帕克的帮助下，扎克伯格学会了应该怎样把企业的控制权牢牢掌握在自己手里，这对未来Facebook的发展作用是巨大的。


    另外，肖恩·帕克在这个阶段还有一个好玩的小作用：在他的建议下，扎克伯格把网站的名字从The Facebook，改成了Facebook。


    唐纳德·格拉姆


    “扎克beta版”的另一个良师益友是《华盛顿邮报》的CEO唐纳德·格拉姆。


    有意思的是，帕克和扎克伯格基本是同龄人，而唐·格拉姆认识扎克伯格的时候已经60岁了。这也显示了扎克伯格非常乐于从任何人身上汲取知识的一种特点。


    扎克伯格是通过一个哈佛同学认识格拉姆的，2005年两人见面，结果相差40岁的两个人一见如故。扎克伯格给格拉姆讲了讲Facebook和他的愿景，而格拉姆作为回报，直接带他去华盛顿的办公室参观了好几天，还让他出席了高层会议、投资者大会和新闻发布会等等活动。


    这段经历对扎克伯格的影响是巨大的，他后来为说：参观《华盛顿邮报》的经历，不但让他第一次明白做一个企业的方方面面，还让他发现了一个很神奇的地方，那就是，在《华盛顿邮报》里面，没人谈怎么盈利，股价如何，所有人都再谈我们应该做怎样的报道，做的东西对未来的几年甚至几十年是不是有意义。


    他第一次发现，建立一家企业的真正意义在于对社会的长久的影响力。这也奠定了扎克伯格之后十几年掌管Facebook的坚定的价值观。


    后来两人的交往还有一个小花絮。格拉姆其实一直一辈子没做过风险投资，但他见到扎克伯格，和他相处了之后，就提出要投资Facebook。不过他给Facebook的估值很低，只有4000万美元。而同时硅谷另一家顶级风投Accel
    Partners给出了8000万的估值，要投资1000万美元。


    扎克伯格左右为难，但最终为了全体股东的利益，他还是选择了Accel。当时因为这件事，扎克伯格还哭了一场，然后给格拉姆亲自打电话解释。而格拉姆不但理解，还完全不记前嫌地继续帮助扎克伯格。到了2008年年底，格拉姆还出任了Facebook的董事。而Accel当然也赢得了自己一生寻觅的那个完美投资。


    2003年到2006年这个阶段，的确是扎克伯格飞速成长的一个阶段。如果说创立Facebook的前后三年，扎克伯格还是个踌躇学步的年轻公司的创始人 ROG的话，接下来的1.0版本，他就完成了从青涩的创业者到成熟的公司领头人的进化。在下一期专栏里，我们就来讲讲扎克伯格的1.0版本。


    张潇雨


    我们今天说到了扎克伯格非常强的学习能力，以及对他影响非常大的两位导师。在你的人生中，有没有那种重要到影响你的观念和重大决策的导师呢？他在哪事情上帮助了你？欢迎你把自己独特的经历和我们分享。我们明天再见。


    在上周日特别放送的一篇文章里，我们办了一个小活动，叫“一句话说出案例课给你带来的影响或帮助”。现在。10名候选人的答案已经出来了，请你投票。


