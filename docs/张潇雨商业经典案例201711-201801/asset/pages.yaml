  md: '比凤凰强很多，内容比新浪强很多。


    程章峰：不同公司的做法还是跟CEO个人禀赋有关。你觉得自己相对最强在什么地方？


    张朝阳：公司内部比较宽松、随意。没繁文缛节、条条框框。我不想让条条框框遮蔽我对问题的认识。还是比较敏锐，能看到一些机会，或者让同事能表达出他们看到的机会，然后抓住它。


    我对营销的感觉非常好，能迅速把一个事变得“天下皆知”。但做营销的过程也会占用我对产品的心思研究的時間。以及我的戮奋度又不如马化腾。我之前晚上就不工作了，就出去玩。这就是我的优缺点。


    程章峰：你现在最想“天下皆知”的是什么？


    张朝阳：人生的意义。


    以前目标就是把搜狐做好，让员工都赚到钱，然后就休闲娱乐。现在觉得人生意义在于参与和创造。这就是人和动物的区别，人要创造价值，活着才有意义。工作本身就是一种存在。


    人存在的意义以及快乐的前提，是人要跟这个世界充分地交流。这样就能理解为什么默多克70多了还在拚命为公司工作，为什么盖茨那么成功还要做慈善事业，每天乐此不疲去解决人类的问题。


    以前我不太理解，以前我觉得我的人生太快乐了，有那么多好玩的事，为什么要工作。但那些好玩的事很肤浅，人存在的深刻意义在于他必须参与。做一些有价值的事。


    程章峰：做搜狐是件有价值的事吗？


    张朝阳：比如搜狐有一万个员工的责任，比如搜狐做新闻媒体，有社会责任。中国娱乐业以前很糟糕，后来我们打盗版，现在版权起来了，做内容能赚到钱了。


    现在中国娱乐业处于爆发前夜。我在美国亲眼看到好莱坞的伟大，让美国文化输出全世界，让美国人生活有趣。我希望在中国的娱乐业爆发过程当中推一把力。同时搜狐作为新闻平台能以建设性和向上的力量推动中国进步。这样在人生存在的意义上又增加了一层。


    这都是脱离小我、脱离低层次的赚钱、花天酒地的那个层面。这也是人类进化所选择 的，引起来人类深刻的快乐而不是浅层次的快乐。几十万年前有很多物种，物种如果不创造价值让自己快乐，就不能延续。


    丛林法则和弱肉强食不会产生规则、秩序、精神力量、道德尺度。那个环境里没有谁有序地去创造，那样的物种会消亡。


    人和动物的区别，是人类大脑皮层极其发达，对理智的精神的超越，不是动物层面的愉悦感。愿意利他，而且创造价值，人类才能发展。其他物种消亡了，人类还存在，这是大脑的进化选择。


    如果说我以前规划的人生是赚很多钱出很大名，自己享乐度过余生。现在觉得那个东西持久不了。必须还要工作创造价值，活到老工作到老。


    程章峰：中国娱乐产业处于爆发前夜。为什么？


    张朝阳：市场规模很大。两件事促进了它。


    一个打盗版，滑滑溪流到现在成为洪流。对知识产权的尊重使影视作品能赚钱，这很重要。一些私营制作企业即使没关系卖到电视台，也可以卖给网站。网站是民营的。


    二是民营的文化地产院线起来了。比如万达影城。以前都是国营电影院。现在要 hesap得清楚，要能赚到钱。这两个推动力导致中国对内容的制作产生前所未有的爆发，品质越来越好。


    程章峰：刚才你说2010年本来想发力UGC但终 止了。为什么？


    张朝阳：当我下定决心、整合力量做这件事时，我自己休假了。


    程章峰：为什么？


    张朝阳：抑郁了。碰到一些事焦虑，在雪山上缺氧，受到刺激，抑郁。


    程章峰：我不相信是偶然的事故会导致抑郁，应该有以往生活经历的原因。


    张朝阳：我在2010年以前是非常阳光、非常快乐的。


    程章峰：那两年时间你干嘛了？


    张朝阳：在跟自己的精神搏斗。这方面我不想多谈。


    程章峰：这个过程当中让你逐渐转变，走出来 的一些事？


    张朝阳：尝试过很多方面。尤其理解大脑的工作原理。从中医、佛教、西医、西方心理学、脑科学、行为科学各个方面全面了解。


    程章峰：听说你至少五六年前就开始打坐了？


    张朝阳：以前不是真打坐，包括以前绅瑜伽、登山、对健康极其关注，身体也好。但那些都是小儿科，我这两年来真打坐了一段时间。


    程章峰：真打假打有什么区别？


    张朝阳：以前打坐就是自己思考问题。真打坐是不思考，关注呼吸。我倒没有出禅，但体会到清安的感觉。进入到什么都不想、一种快乐的感觉。


    这两年是人生观整体在苦难中成长。现在看之 之前，那时真是快乐得不知所以然。


    程章峰：在苦难中成长。你的苦难是什么？


    张朝阳：这个我不想多谈，这是一个精神问题。


    结果是我对大脑必须有所关注。了解到所谓神经原可塑性原理。如果你你的思维不管好它，如果朝负面走，像游戏一样，很可怕。往正面走就很好。大脑是任意的，思维是可塑的。


    一个痛苦的人可以变成一个快乐的人，一个快乐的人如果钻牛角尖也变得痛苦。脑子是可以变的。但改变大脑的方式不能靠思想，而是靠重复性的行为。只有行为可以改变脑子，而且要重复。


    佛教已经证明了这一点，西方科学也在证明这一点。佛教几千年来让多少人摆脱了痛苦。通过重复的打坐念咒，重复性的行为。修为，是说你的人格一定是要修的，靠思考是出不来的。一定要修，修的话，需要重复性的行为才能改变。


    程章峰：怎么样形成重复性的行为？


    张朝阳：要有一些原则和一些坚持，也就是所谓的价值。有了坚定的价值和原则，就会坚定不移重复去做很多事。当重复做很多事，长时间后你的性格就会被改变。价值和，以及原则的重要性。


    程章峰：这就是佛教里的“戒”和“定”？


    张朝阳：对。


    我们这代人尤其是成功的人，出现精神危机 的很多。比如在美国就不是。像盖茨、巴菲特，基督教文化以及整个国家 的价值观很牢固。基本的谦卑，做事有一定的规则，有媒体、公众、上帝看着他。所以美国成功的人没有发展成精神问题。因为他认为自己在上帝面前是谦卑的，他有规则。


    如果不按照这个规则。像泰格·伍兹那么多女朋友，社会和媒体就一顿子打死，他没法活。


    中国知识分子的传统的观念是先天下之忧而忧、后天下之乐而乐。但利益他观念被中断了。


    我们这代人实际是没有价值观的，也没原则。所以—丛林法则，各种各样的原因你可能就成功了。你开始利用而不是遵守原则，利用的尺度很大。最后你放弃了谦卑，开始自 我膨胀。


    神经原可塑性原理就是说，你管理不好自己就到负面，思维很容易陷入。尤其是当你获得很多、自我膨胀时，神经原可塑性原理就会从负面角度来攻击你。


    神经原可塑性原理是2000年一个诺贝尔奖获得者证明的。是近几十年人类大脑最大的科学发现。


    程章峰：中国很多人是为所欲为的。


