  md: '# 复习 | 如何正确面对竞争


    张潇雨


    竞争无处不在，该以什么样的心态面对竞争？如何才能赢得竞争？商业世界中，企业家们是靠什么赢得了竞争？之前在讲王兴和亚马逊的时候，我们都讲过跟竞争有关的内容，今天带大家复习一下。


    +   1. 我们面临的绝大多数竞争都是足球式竞争——目标是先于对方把球送进球门，而不是拳击式竞争——把对方打到。明白了这点就会知道，竞争跟你死我活完全不是一回事。


    +   2. 不要怕竞争，要渴望竞争，有竞争才证明你找对了地方。毕竟世界上没有那么多天才能发现全世界几十亿人都没有想过的东西。


    +   3. 不是所有人都有资格成为你的竞争对手，你要学会选择，因为最终你们会变得很像。盯着沃尔玛，你就会成为一个零售商，盯着苹果，你就会成为科技公司。想清楚你自己是什么很重要。


    +   4. 竞争对手不是用来关注的，你最该关注的还是你自己。贝佐斯在很多场合半开玩笑地说过：不要管你的竞争对手在做什么，因为他们又不给你钱。他确实也是这么做的。如果他天天盯着其他电商在干什么，就不可能发展出AWS云服务这种对电商来说很奇怪的业务；如果他整天琢磨着沃尔玛或者梅西百货会不会是威胁，也不会去开发Alexa人工智能语音助手，或者亚马逊Echo智能音箱。关注对手你可能做到第一，但关注自己你会做到唯一。


    +   5. 竞争中，做到最好远远不够，你必须从头到尾持续保持你能达到的最好状态。就像是南极探险，你可以不管天气好坏，每天坚持走30公里，也可以天气好的时候走50，天气不好就休息。但后者等来的很可能不是好天气，而是弹尽粮绝。这已经不是赢与输的区别，而是生与死的区别。


    +   6. 真正的战场不在短兵相接中，而在战争发生之前。懂围棋的人知道，下棋的最高境界是通盘无妙手。真正的高手是不会让自己身陷绝境再力挽狂澜的，问题出现之前就已经被解决，你根本没有赞叹他的机会。


    +   7. 竞争不是加减法，没必要计较一城一池的得失。它是一个“全或无”的博弈，你必须通盘考虑，找准战争的胜负手，不然手里有多少城池都没意义。


    +   8. 如果这场战争你打赢了，一定不是你做对了什么，而是对手做错了什么。我们以为战争是由拼搏和牺牲组成的，但它是由忍耐和煞熬组成的。你赢了是因为你做好了自己，而且有足够的耐心，等到了对方的失败。就像《孙子兵法》说的，胜可知，而不可为——胜利是可以预见的，但是不能强求。


    +   9. 有时候，什么都不做才是应对竞争的最好方式。很多人都觉得，处于竞争之中就一定要做点什么，不管做的事情对不对、有没有意义，至少做了自己就不焦虑。但是，在该蛰伏、该“深挖洞、广积粮”的时候非要出击，很多时候就是最大的败笔。


    +   10. 在竞争过程中，无论如何都不要忘记一句话：人生没有边界，战争也没有终局，所有的竞争，都不过是路程中的一种工具和一些手段罢了。竞争永远不是目的，而真正的目的<|message|>自我成长，是纵情向前，是边界扩张。


    —— 如何正确面对竞争 ——


