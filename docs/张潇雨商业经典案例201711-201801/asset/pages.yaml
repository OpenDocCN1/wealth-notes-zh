  md: '# Facebook | 垄断者还需要创新吗


    Facebook | 垄断者还需... ↓


    上期专栏我们说到，Snapchat走过了一条非常跌宕起伏的创业之路。最终在2017年3月的时候，Snapchat的母公司Snap成功上市。一开盘，公司就价值300亿美元，可以说大获成功。


    但是，仅仅仅过了不到一年，Snap的市值就已经跌到了160亿美元左右，直接跌掉了2%。为什么会发生这样的事情呢？这里面很大的原因正是Facebook。


    # Ⅰ 扎克伯格和斯皮格的第一次接触


    实际上，Facebook和Snapchat一直非常有渊源。他们的故事可以追溯到2012年。


    如果你记得我们之前的内容，2012年Facebook有两件大事发生：一，Facebook收购了Instagram，后来大获成功；二，Facebook成功上市，给8年创业生涯翻开了新的篇章。


    你不得不佩服扎克伯格的眼光之毒。2012年年底Snapchat刚起势头的时候，扎克伯格就注意到了这家公司。他给斯皮格发了个邮件说：“欢迎到Facebook总部找我聊聊。”


    > 结果斯皮格说：“我很愿意见你，要是你来找我的话。”


    扎克伯格从来都是拿得起放得下的人，他直接来到了洛杉矶，安排了一个比较私人的地方和斯皮格见面。一到场，扎克伯格就给斯皮格和墨菲一个下马威，他说：Facebook马上就要推出一个和Snapchat非常像的应用了，几天后就发布。然后暗示他们说：是我们直接开战，还是你把公司卖给我算了？


    结果心高气傲的斯皮格坚决不卖公司。他做出的回应是，给Snapchat公司全员一人买了一本英文的《孙子兵法》。当然，那个时候的Snapchat只有6个人。


    2012年12月21日，一个叫Poke的应用上线，这款应用几乎是完全拷贝了Snapchat。扎克伯格甚至给斯皮格发送邮件说：希望你喜欢这个应用。


    上线的第二天，Poke就登上了App Store排行榜第一，但是，到了圣诞节那一天，Poke滑落到了三名之后，反而是Snapchat的排名开始疾速上升。一个
    Ciudad 后，Poke在App Store上跌到了700名之外。


    +   • 随着Snapchat的发展，里面的功能越来越复杂，产品越来越不好用；

    • 阅后即焚这种机制总体对“网红”和广告主们不太有利，因为发的广告不容易被看到，所以动力越来越小；

    • 经过几年的增长，Snapchat总体的用户群还是偏向年轻，很难渗透到社会相对主流的、购买力强的人群里。


    # Ⅰ 扎克伯格和斯皮格的第二次接触


    2013年对于Snapchat是个重大的转折点，在夏天它们获得了8000万美元的B轮融资；到了9月份，用户每天在Snapchat里上传的照片变成3.5亿张；10月份，Snapchat推出了一条杀手级的功能——Stories，故事。


    “故事”这个功能理解起来也不复杂。在原来的Snapchat里，用户之间主要以互相发送阅后即焚的照片和简单的文字来交流。而“故事”这个功能可以帮助你汇集多张照片以及视频，然后帮你把它们组合成一个小作品，就像串联起来讲一个故事一样。而且这个产生出来的“故事”会广播给你所有的联系人，在24小时内都不会消失。


    说到这儿我可以简单插一句话i。我其实非常鼓励我们的同学不要只靠着文章来理解我们讲过的公司，有机会大家多去用用各种产品，体会一下它们设计的思路，是非常有好处的。


    # Ⅰ Facebook强势进攻


    然而，这并不是一个后来者打败巨头的故事。因为Facebook发现，之前它们使用的策略错了。只要稍加改变，等待一个好的时机，打击Snapchat的目标就一定能完成。


    Facebook等了将近三年。实际上，这三年里，Facebook一直在密切监测Snapchat的动向。我们之前介绍过Facebook公司里有一套“早鸟”系统，是用来监测突然走红的社交应用的；对于Snapchat这种明处的敌人，他们的监测更是全方位的。


    到了2016年，Facebook发现了一件事，就是Snapchat的活跃用户数开始下降了。


    这里面当然有很多原因，比如：


    《孙子兵法》里说“致痞我打”，虽然斯皮格买过这本书，但身经百战的扎克伯格更懂得这里面的道理。


    +   • 第一，Facebook不再抻着于出一个和Snapchat一样的App，而是把它最明亮的功能做在了自己的App里；

    • 第二，Instagram几乎没做任何“改良”，而是对Snapchat Stories的功能进行了像素级的拷贝。说白了，Facebook直接放下了大公司所谓“底线”，提出了一个态度：我就是来抄你的。


    +   • 2017年2月，WhatsApp在新版本里加入了类似Snapchat Stories的功能；

    • 2017年3月，Facebook Messenger——一个Facebook自己的通讯软件，也推出了一个叫Messenger Day的功能，同样是Stories风格的；'
