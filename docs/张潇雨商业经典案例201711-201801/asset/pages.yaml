  md: '# 小败局 | GoPro犯下的三大错误


    今日商业心法总结：1.不能给用户太多选择，否则会异常困惑，最终什么都不选。《道德经》有一句：少则得，多则惑。公司其中国一个产品不断创新迭代，不断超出用户的期待，用户就容易“上瘾”；如果为了占据市场不断推出新产品，而新产品又没有和公司原来的产品发生联动效应，用户就容易困惑，而且一旦新产品没有广受好评反而问题连连，那么反而伤害了原来建立起来的品牌。2.完全脱离用户。推出新产品原以为能够病毒式传播，最后是不断降价出售。这让我想起之前提到的“10/100/1000”原则。3.确定公司核心竞争力。核心竞争力有点像战场上的指挥中心和大本营，公司丧失核心竞争力，就是指挥中心、大本营被人家直接端了。4.公司定位。尼克把公司定位为内容和媒体公司，但在内容把控和生产上完全忘记了自己是一家运动相机公司。因此，每迈出一步、每做一个选择，都要回到公司的定位上去思考，多想想：这个选择，会在用户心智中形成什么印象，有没有破坏用户原来对我形成的排他性印象？5.产品质量是一家公司、一个产品最重要的界面。好事不出门，坏事传千里，原来处于神坛上的公司一下跌落，商业史上的这种桥段最容易引发病毒式传播，最近埃特尔就遇到这样的挑战。6.创业真正在失败，是放弃的那一刻。我会常常问自己：现在放弃了，接下来还能做些什么？


    运动相机本身就是一个细分市场，这句话的背后潜台词其实就是，在这个公司成立之初，就已经可以预见到天花板的高低了，这也是很容易被公司高层预见和发现的问题。所以我们不难知道公司从便携到软件，从拍摄到内容，包括无人机市场的拓展实际都是在试图转型和突破。或许正是这种紧迫与急躁反而带着跟外界忽略核心的发展心态，使得公司核心产品无论是产品线还是定位都出现了问题。宽泛的产品选择实际就已经体现了公司管理层潜意识扩大市场空间的意图，对未来市场的焦虑，导致了盲目的外延扩张。其实我们应该很容易理解这种心境，只是这对于任何一个企业与战略管理者来说都是一个极为艰难的行动，所以我很赞同萧雨老师后来对该公司的评价与看法。毕竟，成功转型与转型失败的对比，后者却占有绝对优势的数据。我们希望未来的一天，或许会有新的奇迹发生。说到转型与发展，在国内企业当中，我印象最深的还是步步高，从学习机到无线电话，从mp3到OPPO，vivo，一步步始终紧跟趋势发展，似乎从未那么高端醒目，但总有自己的一席之地，把营销发挥到极致的能力似乎无人能及。很多企业并不具备成为华为、苹果、小米的先天基因，其实步步高的发展转型之路倒是可以成为我们学习的榜样。


    其实做内容做平台，是没有问题的，但对于一个“硬件”厂商来说，那是1-2的事情，0-1还是你的产品。你的产品拥有相对领先的竞争优势地位以及稳定的市场份额后，再据此搭建你的“生态链”，而如果一开始，就抱着硬件只不过是我建造“大”世界的一个步骤，而不是“目的”，那么，GoPro的失败就不能理解了。你是一个厨师，你不好好做菜，就想着出本菜谱，能成功吗？


    # 小败局 | 超越阿迪走向巅峰的Under Armour


    个人认为UA的产品质量有所欠缺，作为一个女性健身党，UA的训练鞋舒适度是我所喜欢的，但是衣服好看的不少，legging没有Lululemon舒服，bra更偏爱lorna
    Jane，我觉得UA只要坚定地做训练鞋，让衣服更好看，我依然会坚定地支持UA，毕竟每个品牌都有各自特色。


    # 小败局 | 商业世界不变的两个真理


    张老师提了一个让我思考的名词，具有杠杆效应的客户。明星、专家、教授、自媒体人等自带流量的客户，都是杠杆客户，以前不用这个名词来描述这种为产品带来销量的人群。金融里用杠杆这个词比较多，杠杆资金。在零售业里很少听到，是否把能够自带流量的产品叫杠杆产品。'
