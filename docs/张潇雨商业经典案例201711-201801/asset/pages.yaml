    # | 阿里的投资布局


    说完了主要的财务和业务数据，我们来看一看另外一个不能错过的信息——阿里巴巴集团目前参与投资的一些企业。


    当然我们没法做到100%全面，这里还是以阿里向美国证监会递交的公开材料为准，这里里面统计的都是相对比较重大的一些公司：


    +   1. 饿了么。在之前的几轮投资之后，阿里在2017年4月再次投资了外卖平台饿了么，在这次投资之后，阿里对饿了么的占股是23%左右；

    2. 滴滴出行。阿里对滴滴的投资主要分成两个阶段：滴滴和快的合并之前的阶段，以及合并之后再次投资的阶段。截止到2017年3月31日，阿里对滴滴出行的占股大概是7%左右；

    3. 银泰零售。阿里对银泰的投资和持股也经历了一个过程。从2014年第一次投资到现在，阿里已经变成了银泰的控股股东，持股大概在74%左右；

    4. 苏宁集团。从2015年阿里和苏宁就开始相互投资了。目前阿里拥有的苏宁股份应该是19.9%，已经是公司第二大股东；

    5. 菜鸟网络。菜鸟是阿里与合作伙伴共同创立的物流网络平台，现在已经覆盖了全球224个国家和地区以及国内2800个城市和县区。全国大概70%的快递包裹都在菜鸟数据渠道上。目前阿里有菜鸟网络47%左右的股权；如果你去翻看阿里上报给美国证监会的综合性披露文件20-F文件，还会发现更多的信息，包括阿里投资的华人文化基金、口碑网、美国的AR公司Magic
    Leap以及陌陌等等一系列公司，在这里我们就不一一列举了。


    # | 阿里的股权分布


    最后当然还有一个数据不能忘掉——根据阿里公开的最新文件，阿里巴巴集团董事会主席马云对集团的持有股权比例为 7%；阿里巴巴集团董事会执行副主席蔡崇信的持股比例为
    2.5%；阿里巴巴管理层持股比例共计 10.6%。


    而公司目前第一大股东是软银，持股比例是29.2%；第二大股东是雅虎，持股比例是15%。在之后的专栏，我们也会提到这两段神奇的历史。


    这期专栏我们对阿里巴巴整个集团的业务、财务、投资以及股权的宏观纵览就完成了。正如我之前所说，这一序列的文章都是希望能给你提供一个理解阿里、研究阿里的框架。希望未来当你想更深入地分析这家公司的时候，我的专栏能帮你指明方向。


    另外有些同学可能发现，为什么我们通篇都没有提支付宝和蚂蚁金服呢？原因也很简单：它们并不在阿里巴巴集团的下面，而是单独的实体。当然这段支付宝和马云以及阿里巴巴之间的沸沸扬扬的往事，我们之后的专栏肯定要讲到。大家敬请期待。


    # 划重点


