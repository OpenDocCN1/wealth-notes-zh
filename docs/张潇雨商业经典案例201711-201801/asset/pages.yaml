  md: '作为一个职场新人，并不是说订阅这个专栏，你就能获得怎样可观的物质奖励。而是能让你通过形形色色的企业历程，发掘出你对一件事、一个决策乃至一家企业不同的认知。前人的思考、博弈和智慧，加上张潇雨老师的总结与升华。这是我们订阅用户的一份幸运。


    这大半年來，我跟随《商业经典案例课》死磕了近百本商业书籍，你敢不敢和我一起死磕？！


    当我站在决策的十字路口时，总有一个商业案例，诉说着属于他的经典。


