  md: '# 周末互动 | 研究成功或失败有什么意义


    欢迎来到《商业经典案例课》。我是张潇雨。


    我们最近连续三周讲的都是“小败局”这个系列，也就是失败的案例。我发现不少同学都会问我一个问题，就是：


    大家都说，失败的教训往往比成功的经验更能帮助我们，那么学习失败的案例的意义到底是什么呢？它和成功经验的区别到底在在哪儿呢？我们应该怎么样看待成功和失败给我们的启示？


    我觉得这是一系列很好的问题。这个问题也非常大，我想每个人都会有自己的看法。所以我就简单来说说自己的一些想法，肯定不是标准答案，但看看能不能给大家一点启发。


    总体来说我觉得：失败的经验是教我们怎么样避开那些明显错误的；而成功的经验是教给我敬畏之心的。


    # 1. 学习失败经验的意义


    看了多了商业案例和生活中的各种现象你会发现一件事情：人们做一个东西最主要的失败原因就是那么三四个。上期的周末互动里我们总结过创业公司失败主要的几个原因，其实就是那么几个。我们可以简单地量化一下。


    比如我们说，1000家公司里面，最后比较成功只有1家。那么犯的最明显的错误也就那么几个，比如开头就开发了一个根本没人用的产品，比如公司合伙人之间不和，或者股权有问题；比如什么都想做，什么用户都想要，导致产品不专注，也没有核心竞争力等等等等。这几个问题，可能就导致了800家公司的失败。所以我觉得可以这么说：由于大多数人犯的错误都差不多，一旦你排除了那些最主要的坑，那么成功的概率就会一下子提高很多。你看，1/200比1/1000还是要好很多的，对吧。


    接下来，如果你再去更加深入地研究一下各种失败的原因，甚至自己先找个小东西上手做一做，算作一种练习和积累的话，那么你就会开始发现一些相对罕见一点的错误，或者用我的话说，就是“高级一点”的错误。


    # 2. 研究成功案例的意义


    从我自己的角度来说，我觉得最重要的意义就是让自己知道：比较大的成功是非常稀少的——不管你是誰，之前干过什么，多么聪明，多么有资源等等，你做一件事情成功的概率就是很低的。


    我们到现在已经讲过几十家公司了，不说那些失败的，就说那些非常成功的企业家，有几个没经历过想把自己公司贱卖了的时候？有几个没有过很大的低谷，离破产就差一步的？你说他们后来为什么成功了？其实没人能总结得出来——你当然可以说他们有一个很优秀的品质叫做“坚持”，但是也有更多的人坚持了好久还失败了。


    所以，任何事情想要成功，都要有天时地利人和，加上各种运气的作用。1/100不是什么高概率，但只有认识到了这一点，只有明白自己在做的是一个小概率的事，有这种敬畏之心，在做事的过程中，才能有更好的心态去面对各种挫折和失败。我觉得这就是所谓“向死而生”。


    # 小败局 | GoPro是如何打开运动相机市场的


    老师好！身边有朋友喜欢极限运动，所以对这个品牌有些了解。“GoPro”曾几几乎成为“极限运动专用相机”的代名词，GoPro主要有三款，Silver、Session、Black。GoPro是一款超广角的，1200万像素的相机+最高可以拍摄4k
    30fps的摄像机；GoPro很轻，普通鼠标再缩小一半就是GoPro。Black是最贵的一款，但是没有屏幕；Silver属于入门级，价格亲民，有屏幕可以看；Session是纯粹辅助用的机位，用来放在头盔上或者固定在胸前、车上比较合适，因为不能换电池，没有屏幕，因此纯粹是其他相机的辅助。


