    # Facebook｜扎克伯格3.0：从战略家到慈善资本家


    从看山是山，看水是水，到看山不是山，看水不是水，再到看山是山，看水是水，这是境界的变化与提升。我觉得同样适用于对商业的看法与理解，也许商业的初衷是激情，是梦想，是对财富的渴望，经过打拼与运气的垂青你会实现这些目标，但这之后又叫做什么选择呢？是安于现状，还是继续前进，或者是另辟蹊径。有些人会说他是富豪，有的是钱可以任性做事。我是普通人没有时间也没有钱，过好眼下就可以了，这种务实的态度没错，但我想每一个人，即使作为一个普通人也可以多维度地提升自己，尤其从认知的角度开始，成为商业领袖的机会固然不多，但做个更好的自己，却是一个力所能及的事情。从最早的听故事，到总结出成功与失败的商业规律（不一定正确），到领会到一种企业家精神，这些都是在专栏的收获，不仅仅是知识上的满足，也影响到自己的行动，改变的也許不仅仅是作为，会潜移默化地影响命运。


    [1] 人这一生来过，究竟留下什么才有意义。古人常说要“立德、立功、立言”，才能让自己不朽。上述这些似乎都只关注个人的阶[段]性成果，而忽略这些成果对周边人乃至社会的影响。站在当代企业家的角度来看，让自己成为一个时代的榜样，能够引领并同时帮助更多的人在正确的道路上显得更加重要。一个公司的产品想要经久不衰的确很[难]，但作为个体，自己就是自己的产品的角度来看，值得好好打造和提升自己的言行，步岁迭优，立足长远。[2]
    当人类意识到自己的渺小与不足的时候，一种是畏惧资源与自然对抗，另一种是有效投入推动发展。应该说很多企业家在成家立业，有了后代之后，都更愿意将自己的资源向人类所共同面对的困境上倾[斜]。这既是我们这个物种最宝贵的财富，也是作为个体应當积极追求，并在合适的机会努力做出自己贡献的号召。


