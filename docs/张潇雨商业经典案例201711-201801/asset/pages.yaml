  md: '# 王兴 | 竞争之道——胜可知而不可为


    王兴 | 竞争之道——胜可知...


    今天我们再做一点新的尝试。既然要讲竞争，有一本奇书就一定绕不过去，那就是《孙子兵法》。今天我想讲一点《孙子兵法》的内容。因为它和我们这周的主题非常相关。


    # Ⅰ 王兴的“学贯中西”


    在今年年中，王兴接受《财经》杂志采访的时候，有过这样一段对话，我觉得非常经典：


    > 《财经》：有人评论美团在“千团大战”，以及最早进酒店旅游时，都是别人打仗在烧钱的时候美团在等待，美团是靠等待成功的。


    王兴：一位参加过对越自卫反击战的投资人跟我说，多数人对战争的理解是错的，战争不是由拼搏和牺牲组成的，而是由忍耐和煎熬组成的。《孙子兵法》说过“不可胜在己，可胜在敌”，确实困
    mums 的事情不是我们打赢的，不是我打倒了对手，是他们自己先倒了。


    # Ⅰ 东西方哲学的异同


    非常笼统地说的话，我觉得西方哲学体系更讲思维和逻辑，它希望帮助你建立一种思考方式和思维框架，在这个框架里你去做各种归纳和演绎，结论都是非常牢靠的；而东方哲学的魅力在于它的模糊性。它往往叙述模糊、容错性高、阐释空间大而不是直接讲述某种理论。


    # Ⅰ 千团大战与《孙子兵法》


    > 昔之善战者，先为不可胜，以待敌之可胜。不可胜在己，可胜在敌。故善战者，能为不可胜，不能使敌之必可胜。故曰：胜可知，而不可为。


    +   1. 做好自己，不要管他人。

    2. 所谓的“不可强求”，也在于“不作为”。

    3. “我们可以贪婪，但是我们要长期贪婪。”'
