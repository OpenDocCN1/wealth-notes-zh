  md: '所以36岁以后，我就离开了CEO的位置，离开了给我荣誉的环境，出售了给我带来财富的公司，我希望去寻找这道白光背后的东西。


    这应该是一个佛法、商业、科学和生活结合的东西，通过大脑研究，我们人类可以去感受更妩媚的白光，也可以让人类从这道白光中顿悟而回溯生命的本源。


    大脑研究最终的目的，可以有很多种表述角度，因为大脑实在是神奇的领域，微小的突破就可以让我们得到无数的收获。


    其中一个重要的角度就是，希望用科学的方法来研究信仰，《金刚经》说“一切有为法，如梦幻泡影，如露亦如电，应作如是观”，但这个“有为法”，到底是如何影响和改变人生的？又如何被理解为梦幻和泡影？我们不知道。其实人类研究了宇宙，研究了海洋，研究了人类眉毛以下所有的东西，我们现在是该研究眉毛以上、让我们“如是观”的部分了。


    如果用电脑来比喻我们，眉毛以下的部分都只是Input（输入）和Output（输出）的功能，只有大脑才是主机。我们需要研究我们的主机，整个世界在这上面研究得太少。


    所以，我在后面这段时间，除了继续做好投资业务以外，会跟世界最顶尖的脑科学的专家一起学习互动，想想这就是个令人激动的过程。


    这就是大脑研究的无穷魅力。我不知道自己能不能成功，但如果我能参与人类解决大脑问题的最后一刹那，能通过我们的投入产生一点作用，那比我做一辈子“首富”都更有意义。


