  md: '怎么想的。


    问题二：第二种打球方法是很难达到的，那是一种忘我的境界。我的做法是先做到第一种打法，再有强烈的改善，强烈的我要赢的信心。不管是竞技运动还是日常工作，当你工作或运动全身神专注时，偶尔有一瞬间，就会达到忘我的状态了。如果怎么样，状态越来越好，那恭喜你，可以和“神”相遇了。以上，可能理解很片面，强烈希望老师指正。


    # #### 武志红


    我感觉已经没有更多可说。


    不过，我没忘了写今天的文章，以后还会就这个问题写更多、更多，但你的回复是同样精彩。


    特别是，这样的思考，必定会找到属于你自己的真理。


    武老师好！听了您的课，我感觉非常棒，我也读完你这本，书中所讲的竞争就是为了强调内在比赛需要，帮助自己更好的改变自己，通过竞争让自己把手专注比赛。书中反映了作者心态的一种改变，由原来的竞争到关注自己的比赛，再后来享受自由。但是我所读完竞争有个别种味道，通过NBA球员的例了，结合它的味道，更深入进了竞争中的包含自爱的感觉，点出了满足自爱的需求。能感受到你人很多观点对我的启发，不仅仅是别人观点。佩服你洞察，心流感受。


    为什么一会儿讲放下自我，一会儿又鼓励态导致竞争呢？我读得思绪像展开的，“思维模式是战斗准备时需要的”，这些思维是对竞争心念的定制化程度和战术，分析对外界各种可能性，做好充分准备，对外界都要调整，鼓励团队合作，充分和人交流，达到和团队每个人“受思维”的共鸣理解。


    “潜意识”是战斗前后需要迅速启动的，因为我之前已经用过“思维我来评判我事情，并且制定了战略和战术，也充分和队友同步了思维，那么我只要关闭“思维”就可以了。毕竟再怎么制定计划都是徒劳的，事情开始后都是瞬息万变，我们刚开始“思维”定制的一切这时都要作废，但是半宽刚开始时都成了思辨，和队友共享并同步了思维、战略和战术，各种可能突发情况我们都有分析到，那么现在要做就是让“意识”带着刚开始的定制目标走就可以了。


    把两者结合起来用，互不干扰，该静下来时候我们就上心态和复盘，该上手时候不要磨磨唧唧，“团结、严谨、严肃、活泼”一点都不都不用。罗胖老师有句话，世界上最厉害的大脑就是在两个或以上相反观点还能正常行事。


    # #### 武志红


    鹏鹏的留言，和我的回答，思路是很像的。


    接着我们来看两个问题。


    我一直认为自己的儿子与众不同。他比大多数孩子内向，甚至一度觉得他有自闭倾向，他说说话，但我当他当时，我认为是我的儿子不会问题。他3岁不说话，说明认识，而且他说的是简短的表达，让我认为是我的是我……之后，儿子除了依然内向外，身体，学习还不错，没太大惊喜。但高中的分班，我们忽略了，儿子没进入他心尖的位置，受到了打击，成绩下滑，高考去了二本学校，来本科毕业后，没去日本大学，现在刚考过成绩没有复习。我希望进自己谈研，而不在高校当一个老师，儿子自己已想成为一名学者，他的愿望可以实现吗？是否如老师所讲，我儿子会成为我期待的与众不同的。


    # #### 武志红


    前两周，我们讲到，权威期待和自我期待一致时，会容易产生巨大的力量。相比的，如果父母的期待，和孩子的期待不一致时，孩子的发展就会被扭曲。


    因此，父母最好的做法，是期待孩子成为他自己。最好的做法，是支持孩子走他自己的道路，而不是希望孩子成为父母自己想要看的。这样的活，这也是对孩子的入侵。


    这位朋友，你的期待，有孩子自我期待一致的地方。这，是你的孩子一直努力的方向之一。不过，关于孩子具体成为一个什么样的人，你最不要放下的自恋性期待，让孩子成为他自己。


    首先，特别感激到让我们这些普通人都可以去栏目这么多大师精神的老师的课。我老是必须到元老的课，每次都像听音乐一样享受放松，即使这样仍然收获颇丰。第一，今天的课程让我再次收获于自己两岁双胞胎孩子上，悟到了更多的方法。不知道我在每次吃奶后的问题上都采用比赛竞争的办注，这样带来好的结果么，能让它们爱上竞争么？


    # #### 武志红


    在竞争时，是存在一个三角关系的：我和竞争者，同时有一个裁判的。


    裁判怎么定义，会决定个竞争关系的走向。一个好的裁判，会让竞争良性发展，一个差的裁判，会让竞争恶性发展。


    不过我个人的看法是，父母不要过于使用自己的裁判角色，而去伤杀力量于孩子。因为我们的去自恋性竞争力强热情已经够强大了，它不需要被加码，它只别被大搞压制即可。


    父母对孩子，最好的是不不给诱惑的深情。但这位妈妈，是想利用奶喂食而诱其孩子更多竞争，这是吃奶这孩子，变得更过于复杂，甚至可能让孩子恨这件事。


    当然，这是我的回答，也是建议这妈妈，用我讲解的心理学，自己去思考该怎么选择。


    希望我相对的中立客观地在给大家讲。人性是怎么回事，是一位心理咨询师，而不是一位道德家，不会给大家评判好坏对错高低，然后指点让大家具体怎么做，那样，就是我入进了大家的界限。


    世界上最宝贵的，就是选择权，所以，但问及到该如何选择的事，这都是你自己最宝贵的事，虽然它有些沉重。


    很多生活中的挑战，就像比赛一样，时常让人觉得力不从心。


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_36_0.png)


    这个时候，你俩放下对错的判断，信任身体，把注意力放在事情本身上。


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_36_1.png)


    打开该法的诀窍只有“全心全意，放下你的关注，信任身体。”


    她一相想法和杂念，不去评价自己，也不去表扬自己，只是去做。


    你会发现，“我”一旦消失了，会迎来自己的最佳状态。'
