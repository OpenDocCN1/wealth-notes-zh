  md: "# 自我07 | 进入别人的现象场\n\n# 自我07 | 进入别人的现象场\n\n武正\n\n前两篇我们专栏内容中都提到了“现象场”这个概念，今天，我们就来深入谈一谈这个概念。\n\
    \n# | 现象场\n\n先来复习一下之前的内容，现象场这个概念是美国人本主义心理学家罗杰斯提出的。具体是什么意思呢？\n\n+   1. 罗杰斯认为“我”是一切体验的总和。\n\
    \n    2. 他认为，如果你想要了解一个人，就需要进入他的现象场，体验他的体验。\n\n现象场就是一个人的体验和时空等环境因素的结合。\n\n假设一个人一生中有十个重大体验，这些体验都发生在个体的时空中的概念，也就是说每个体验都有一个标记，在某个特定的时空中，当然每个特定的时空，都带有很强烈的环境，因素。这就像我们小时候写作文，老师建议我们要考虑到很多内容，比如时间、地点、人物、环境等各种因素。\n\
    \n每个重大体验，就是一个“现象”，而时空，就是现象发生的“场”，它们结合起来，就构成一个人的现象场。\n\n如果我们进入了这个人的现象场，了解这个人的十个重大体验，就深刻地触碰到了他。\n\
    \n你可知小雌现象场，如果你掌握了现象场这个概念，就会发现，有非常大的实用价值。\n\n# | 进入他人的现象场\n\n我先给你讲个故事。\n\n我有一位朋友，她的儿子两岁多时，变得非常贪吃，好像是多吃都吃不饱，就像是要把世界上的一切，都塞到自己小小的肚子里一样。去医院检查，没发现什么问题。实际上，小医院都要有朋友长，只是我这位朋友非常焦虑，她问我，该怎么办。\n\
    \n我给她提的建议是，你可以好好观察孩子想吃东西的样子，然后试着变成他这个样子，看看体会体验到什么。\n\n我认为我的建议非常简单清晰，但我这位朋友一开始并没有明白我的建议到底是什么意思，所以没有去做，后来呢，又很焦虑，又给我打了电话，于是我就把这个建议更加细化，给了她一个非常有操作性的建议：\n\
    \n+   1. 找到孩子的关键细节，让你印象最深的，孩子吃东西的样子是什么样的？\n\n    2. 标定这个细节所在的现象场，也就是说，这个关键细节具体发生在什么时间，什么地点。\n\
    \n    3. 进入孩子的这个现象场，成为他的样子，体验他的体验。\n\n我这位朋友说，关键细节就发生在家里的饭桌上，孩子埋头狂吃，样子急不可耐，把抢着的那一碗饭，他满得不得了吧，但接着有一点点害羞，不久后，又饿就想吃。\n\
    \n我建议您进入到孩子的现象场，也就在每天吃饭的那个时间点，试着坐在孩子的位置上，想象孩子小小的身体，用孩子吃饭的状态感觉，看看会体验到什么样的感觉。\n\n\
    说得这么具体后，我这位朋友就照做了，他感觉到非常复杂的体验，后来逐渐明白，孩子的这种焦虑可能和这一年多来我们家频繁太有关，孩子七到八个月大时，因为工作变动，和卖房子，他们搬了五六次，这确实也没想到这对孩子也造成了巨大影响。\n\
    \n其实这不难理解，孩子需要相对稳定和熟悉的养环境，完全，甚至到一岁后他们才会发展出基本的安全感。\n\n接下来很有意思的事情是，我这位朋友进入“现象场”的体验后，小傢伙的贪吃竟然逐渐消失了。说这话是因为他进入到了更深度的体验，因为对于小傢伙而言需要的是父母理解，当父母进入了孩子的现象场，对孩子的问题就有最新近的理解，也就最简的解决问题。"
