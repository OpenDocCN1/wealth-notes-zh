    二元关系，是极具根本性的关系，如果两个人的心灵都非常强大，也许就会是所谓的灵魂伴侣。但是，二元关系张力太大，难以容纳其中的“坏”，所以需要找一个第三者去投射这个“坏”，在一个三元世界中去消化。


    当在三元世界中不断去消化、处理“坏”，一个人的心灵就越来越得以淬炼，然后可以归于二元关系，最终归于一元世界。


