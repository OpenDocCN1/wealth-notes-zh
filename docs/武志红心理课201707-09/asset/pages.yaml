  md: '# # 直播回顾之二 | 来自罗胖的提问与分享


    在周四的直播「界限意识与共生关系」里，罗胖主要针对我提了三个问题，都非常有意思，我也一一回答了。今天，就将我们这一来一回问答内容重新出来，作为特别放送分享给各位。


    # —— 罗胖一问 ——


    共生关系看上去是很复杂的问题；有个实验是这样的，假设你俩合伙做事，都有好处，但好处是你挣 1 万元，他能挣 100 万元。带着这个假设去做调查，绝大多数人会说，我宁可不做也不做这个生意。


    在经济学里，有个概念叫「帕累托最优」。通俗地说，就是在资源调配过程中，在没有使任何人情况变坏的前提下，使得至少一个人变得更好。


    帕累托最优（Pareto Optimality），也称为帕累托效率（Pareto efficiency），是指资源分配的一种理想状态。


    但读到刚刚的例子，你就知道，实际上不是这样的，现实的情况即在这个状态指导下是存在差别的。全世界都有一种共同心理：我们  在  一  个  集 体  中，就
    要 有 相 对 的公平。


    那在树立界限的过程中，如何看待公平问题呢？


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_37_0.png)


    # 武志红


    我  们  历 史 上 有 很 多「均 贫 富 」 的 思 想 ， 也 就 是 说，不 管 你 是 干 的 还 是 我 挣 的， 咱 们 两 个 干 。 这
    就 行 了 。 我 们 也 都 在 追 求 这 样 的 状 态 。


    为什 么会 出 现 这 样 的 情 况 呢？ 已 经 几 届 的 用 户 会 认 为 ，这 究 竟 是 因 为 人 的「自 恋」。我 之 前 讲 过 了 自
    恋 的 两 种 表 现 ：


    +   1. 我是对的。

    2. 我比你强。


    这会 导 致 ， 如 果 你 比 我 分 得 多 ， 我 会 告 知 ， 对 不 起 ， 如 果 你 比 我 分 得 多 ， 我 得 意 了 ， 但 也 担
    心 你 恨 我 。


    所 以 我 们 的 文 化 提 出 了 一 个 解 决 方 案 就 是「均贫富」。我们不敢得罪，也不想压抑自己，就一碗水端来来解决。


    # —— 罗胖二问 ——


    听 到 一 个 故 事 ， 某 人 界 限 意 识 很 强 ， 500 米 开 外 有 人 放 炮 仗 ， 他 就 能 急 了 。


    那 在 人 们 相 处 过 程 中 ， 什 么 样 的 界 限 是 合 理 的？ 如 何 把 握 合 理 的 界 限 呢？


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_37_1.png)


    # 武志红


    刚 刚 罗 胖 举 了 一 个 例 子 ， 说 某 些 人 听 到 500 米 开 外 有 人 在 放 炮 仗 ， 就 会 觉 得 是 种 不 好。


    这 里 面 其 实 包 含 了 一 种 思 想 ： 整 个 世 界 都 是 「 我 」 的 地 盘 ， 这 个 地 上 任 何 一 个 东 西 和 「 我
    」 想 关 系 不 到 你 ， 却 是 对 「 我 」 的 触 触 。 这 就 像 一 个 极 大 延 伸 的 地 盘 。


    但 是 ， 你 需 要 懂 得 ， 界 限 不 仅仅是在说「我」的地盘在哪儿，还有很重要的另外一个部分 ——「我」也要知道，「你」的地盘在哪儿。一旦形成成熟的界限意识之后，「我」就能明白，「我」的地盘「我」说了算，但是在「我」的地盘「我」说了算，还有属于「你」的地盘，有时候会有共同交集的部分。


    有一 次， 有 个 哥 们 请 我 去 他 的 饭 店 吃 饭。 那 天 下 着 瓢 泼 大 雨， 电 闪 雷 鸣 ， 饭 店 那 里 环 境， 似 乎 风
    浪 很 大 。 到 了 午 后 我 就 想 说 休 息 一 会 儿 ， 等 待 下 午 讲 课。 过 了 多 久， 有 服 务 员 来 到 门 口。 她 敲
    门 的 时 候， 老 板 张 还 在 说 话， 说： 「 武 老 师 要 休 息， 你 怎 么 可 以 那 么大 声， 打 扰 我 有 的 休 息？」


    那 一 刻 ， 不 仅 仅 老 师 有 些 不 满 ， 其 实 还 有 点 不 高 兴， 因 为 之 前 已 经 说 好 了 我 要 休 息 ， 请 不 要
    打 扰 我 。 结 果 服 务 员 还 是 进 来 了。


    那 这 时 候 我 就 想 考 虑 这 样 一 个 问 题 ： 这 个 服 务 员 为 什 么 真 音 量 有 那 么 重 呢？ 当 时 外 面 大 风 呼
    啸， 电 闪 雷 鸣 ， 当 时 的 声 音 下 面 的 人 不 知 道 这 个 是 不 是 这 个 大 声 音 ， 而 为 什 么 我 要 更 在 乎 这
    个 服 务 员 的 声 音 ， 而 不 去 在 乎 电 闪 雷 鸣 呢？


    因 为 老 天 爷 是「 我 」 干 涉 不 了 的 事 情，「 我 」 权 利 再 大 ， 也 没 那 么 牛 了。 涉 及 老 天 的， 但 那 个 服
    务 员 是「 我 」 可 以 决 定 的 对 象， 其 中 最 关 键 的 点 是 不 是 电 闪 雷 鸣， 但「 我 」 仍 然 可 以 跟 你 说，「
    你 」 冒 犯 了 。


    所 以 你 发 现 了 吗？ 界 限 通 常 是 权 力 关 系 起 到 了 作 用 。 你 的 权 力 大 到 别 人 的 范 围 内 了， 你 会 觉
    得 别 人 做 到 是 你 的 地 盘， 你 会 容 易 记 住 别 人 的 界 限 。


    再 打 个 比 方 。


    当 年， 波 斯 和 希 腊 的 时 候， 薛 西 斯 二 世 率 领 大 军， 想 把 希 腊 一 举 端 掉。 下 马 于 岸 边， 他 们 的 军 队
    在 海 上 搭 起 了 浮 桥， 没 想 到 大 多 不 久 下 了 大 雪， 把 浮 桥 给 冲 了 ， 薛 西 斯 二 世 很 不 领 情 ， 他 认
    为 是「 我 」 是 王 王 之 王， 怎 么 可 以 有 不 听 自 己 的 东 西 ， 就 发 怒 了， 命 令 自 己 的 士 兵 堵 住 河 流 ，
    抽 打 大 海 300 下。


    # —— 罗胖三问 ——


    缺 少「 界 限 意 识 」 所 带 来 的 问 题， 在 情 侣 之 间， 闺 密 之 间， 父 母 友 好 之 间， 都 会 有。 但 是 很 多 情
    况， 当 事 者 没 有 的 界 限 意 识 的， 还 是 他 只 关 于 情 面 而 其 他 的 原 因 不 能 为 这 个 做 事 的 不 同？ 「 不
    」， 请 问， 有 什 么 招 可 以 帮 到 他 们？


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_37_2.png)


    # 武志红


    关 于 如 何 树 立 界 限 意 识 ， 我 在 之 前 的 直 播 回 顾 第 一 集 里 已 经 告 诉 大 家 了 六 招 。 你 可 以 去 查
    看 那 边 的 超 级 完 整 六 招 。


    不 过， 在 这 里， 也 可 以 学 一 下 罗 胖 在 直 播 中 为 大 家 说 的 第 七 招， 相 当 精 彩。


    —— 直播回顾 | 界限意识与共生关系


    # —— 罗胖支招 ——


    每 个 人 都 要 有 界 限 意 识 ， 对 方 在 冒 犯 你 的 时 候， 其 实 他 心 里 也 明 白 这 个 东 西 。 你 的 拒 绝 很 容
    易 让 他 知 道 ， 喂 ， 原 来 你 也 是 在 侵 犯 我。


    我 在 工 作 生 活 中 有 一 招 很 管 用， 巧 用【 非 正 式 话 题 的 正 式 沟 通 】。


    我 们 在 工 作 的 时 候 ， 其 实 不 太 适 应 正 式 沟 通， 我 们 是 喜 欢 非 正 式 沟 通 。 为 什 么 有 的 人 喜 欢 打
    高 尔 夫 球？ 打 完 球 后 ， 在 饭 桌 上 谈 天， 达 成 意 见 。 很 多 正 式 的 情 况 ， 你 用 非 正 式 的 沟 通 道 去
    进 行 的 时 候 ， 效 果 更 好 。 比 如 说 ， 有 在 座 遇 到 家 族 中 ， 精 精 朝 朝 的 同 事 ， 其 实 是 很 有 限 的
    。 很 多 人 不 喜 欢 正 式 的 正 式 沟 通 ， 却 反 应 正 式 回 答 。 不 不 知 不 觉 它 也 可 以 解 决 正 式 问 题 ，
    非 正 式 的 话 题， 你 能 不 能 用 正 式 的 方 法 去 沟 通？


    我 们 家 个 女 儿 出 生 后 ， 就 有 了 两 个 阿 姨， 因 为 二 生 五 也 不 一 样 ， 便 给 多 一 个 阿 姨 ， 我 老 婆 偶
    尔 会 去 看 看 家 里 ， 比 如 二 生 不 及 时 清 洗 碗 碟 之 类 的 问 题。 她 之 前 的 举 动 不 到 了 ， 就 说 上 了 马
    上 去 了 。 但 二 生 发 现 双 方 用 。 毕 竟 之 前 的 生 活 方 式 不 一 样 ， 很 难 一 下 子 改 掉。


    怎 么 办 呢？ 有一 天 ， 我 跟 老 婆 说， 你 来 我 可 不 一 定 ， 这 事 儿 应 该 怎 么 办 。 你 明 天 一 天 能 不 忍 住
    了？ 看 见 什 么 现 象， 都 不 先 说， 等 我 下 班， 你 告 诉 我， 我 来 解 决。 果 然 ， 那 天 下 班 后， 我 老 婆 接 了
    一 天 的 状 态 。


    我 就 把 两 个 阿 姨 叫 来， 开 家 庭 会 议 。 首 先 ， 我 说， 对 你 们 二 位 之 前 的 辛 苦 ， 我 们 表 示 感 谢 。
    但 今 天 的 工 作， 我 来 做 一 个 复 盘 。 我 们 发 现 有 四 点 的 态 度 ：1 ...2 ...3 ...4 ...。 不 过， 没
    发 现， 你 都 会 无 论 怎 么 了， 我 们 不 来 讨 一 下 整 改 方 案 呢， 怎 么 样 保 证 这 四 件 事 不 后 又 会 发 生？
    听 完 这 条 ， 她 们 就 慌 了 。 我 接 着 开 始 提 醒 整 改 方 案 ， 并 告 诉 她 们， 以 后 发 现 同 类 问 题， 我 仍
