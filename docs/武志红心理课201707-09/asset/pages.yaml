    我很容易对别人评判自己，你这个地方做的不好那个地方做的不对。 想想是对他人怎么评判对的，从来如此，我也不想知道他放下这份评判，好多年候啊，都是事，这感受到了自己在评判，不过，相比于两三年，对他人的评判现在已经少了很多。


