    用四念住的方法来读懂自己的生命体验


    # 一、实际运用案例


    一位男士，也是一位心理咨询师，有一位老太太，吵得非常痛苦，然后独自坐下来思考的时候，他想起了小时候父母吵架的情形。


    “首先他回忆情绪，感受到了当时的细节，然后从情绪感受、身体感受和想法三个方面入手来观察自己。过程分别是这样的：


    情绪。他感到恐惧、无助、愤怒和悲伤。过去情绪像水流的一样，有时会很激烈，有时会很平静。


    身体。他感到身体上很多部位是有反应的，紧、热、麻、冷、跳、酸、胀等。当身体感觉是紧绷的时候，他感到自己很紧张，当身体感觉是松弛的时候，他感到自己很放松。


    念头。他回忆起小时候父母吵架时，他有很多不愉快的记忆，比如妈妈让他洗碗，爸爸让他去倒垃圾，而他只是想和小伙伴玩耍。


