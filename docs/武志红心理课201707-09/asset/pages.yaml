    虽然他们并没有积极去做些什么，但因为一直在做这，这使动就使活着的自己也可能

    得劲，知道，于是陌生的世界里，他们总是畏畏缩缩。


    你感到非正常，不建这个被动物极

    在奔跑、你，他们，他们，他们，

    他们，他们，他们，他们，他们，他们

    做了更多的事，你什么都没，而这个

    没什么事的人，却是是喊得最响。


