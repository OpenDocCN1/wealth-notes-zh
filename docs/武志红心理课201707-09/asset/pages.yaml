  md: '第一章看你在说命运，其实说的是自恋。


    并且，我们这样一层层递进，好像在说自恋是好的。但第三周的第三篇《竞争，是最终的合作》，又好像突然从自恋“正了名”。


    这就是人性的矛盾之处，最容易导致问题的部分，也是价值最大的部分。所以，虽然身心得不好，也能出现奇迹。自恋尽管生出了各种问题，但它也是推动我们变得更好的**根本动力**。


    所以，**人类并不是非得需要高峰体验去获得成就感，而就是看着“我是对的”、“我比你们强”这种自恋与竞争，就可以变得出类拔萃，甚至在某一领域**称王称霸。**


    这三周的内容，讲了这一环扣一环的复杂逻辑关系，你发现，好像没办法依靠某一个简单的原则就**去冲刺人生**。


    这也是我的目的。因为人性如此复杂，我们的确**找不到一个**简单的原则，只凭它就能活得无往而不利。


    如果，我认为这个原则是，尊重他的感受。可一旦让你看到，再没有比它**更难**、更难以琢磨的东西了。


    # 4. 打赢你的内在比赛


    第四周，我讲的是“人生脚本”。


    自我期待、权威期待、自恋性竞争、身心的体验……这些复杂的人性力量结合在一起，形成了你的人生脚本。


    前面三周，我们是在讲一些基本逻辑，而最后一周，是想让你看到，**你具体的命运模型，可能会是什么样的**。


    也正因自恋，我们很容易认为，自己是一往无前的，但实际上是按**照一个**人生脚本**去不断轮回、不断地“强迫性重复”的**。


    认识了这个轮回，**也就有了打破它的**可能，让复杂化的生命逻辑乃至身体，重新归于自由的流动。


    这是这个专栏的根本目的，也是我**自己的人生目标**。


    # —— 认识与觉知 ——


    第一章更具体的目的，则是希望我们**看到，认识自己，是多么重要**。否则你虽然认为自己在一往无前，但其实就是原地打转。如果看不到这一点，是不是有点太悲哀？


    古希腊人充分认识到这一点，所以德尔菲神庙前有一句著名的话：


    认识你自己！


    德尔菲神庙位于希腊的福基斯（Phocis），1987年联合国教科文组织将其列入《世界遗产名录》。主要由阿波罗太阳神庙、雅典女神庙、剧场、体育训练场和运动场组成。古希腊人认为，德尔菲是地球的中心，是“**地球的肚脐**”。


    大思想家苏格拉底则说：


    未经省察的人生不值得一提。


    对苏格拉底这句话，我的理解是，**如果没有**觉知，你的人生，就是按照一个脚本在不断轮回，这有何意义？


    看大家的留言，我想，我们第一章的“命运”主题，已经部分实现了这个目的，譬如一位朋友留言说：


    >   今晚**发现**了一件发生在我**命**里，几乎以完全相同的方式，**重复循环了8次的一件事**。


    心理学上说：如果一件事反复出现，肯定是有原因的，这件事带有某种信息。要么解开这个循环、就要理解这件事情所隐藏的信息。


    >   我**只感到震惊，我竟然才发现这件事，8次事件的相似度几乎是百分百。**


    这就是我们心理学说的一个意义所在——**形成“觉知自己”的意识，就像这位朋友，没有形成这份意识时，一件事强迫性重复8次，这个轮回仍然没被他关注到，而形成这份意识后，就发现一个如此重要的事实横亘在自己眼前，再也**不能忽视**了。


    形成这个意识，只是开始，而有这样的开始，就已经很好了。接下来，我们会从各个方面来强化我们的学习。


    愿你**能爱上自己的英雄之旅**。


