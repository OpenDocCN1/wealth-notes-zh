  md: '# 预告｜权威期待的力量


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_15_0.png)


    从今天开始，咱们进入第二周新主题的探讨，也是自我实现预言的延续，叫做“权威期待的力量”。


    如所说，自我实现的本质之一，那每个人都需要别人对自己说：你是好的。越是重要的人告诉你，“你是好的”，这个影响力就越大。特别是在我们的自我还比较弱小的时候。假设我们把来自外界的反馈都比喻成镜子，那么在所有的镜子里，有一面对人有巨大的影响力，这面镜子叫做权威。


    当一面权威的镜子对一个自我比较弱小的人说：你是坏的，你是差劲的，你是糟糕的。这个破坏力尤其巨大。


    不可避免的是，最初养育我们的人，像父母，是最最重要的权威，他们对我们有什么样的期待，就成了我们最初的命运。


    和上周一样，我们也可以先来做一个小练习。


    +   *   拿出一张纸写一下，或者在心里默默想下，自己的父母，或者其他重要的权威人物，对你最常说的一句话。

