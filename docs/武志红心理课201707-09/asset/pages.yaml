  md: '# 关系16｜从一元关系到三元关系


    武志红


    我们这一周的主题是“一元、二元和三元关系”，今天是第二讲“从一元到三元关系”。


    在之前的预告中，我们说从关系的基本形态看，关系可以分为一元关系、二元关系和三元关系。


    一元关系，是指一个人只看到自己的意志，只感受到自己的感受，他希望别人都来配合他的意志；关系中，只能是他说说了算。


    二元关系，是指一个人意识到另外一个人和自己，是一个独立存在，有自己 的意志和意愿，他能共情对方的感受，也能尊重对方的意志。


    三元关系，是指一个人能意识到关系的复杂之处，在复杂的关系中，他能同时看到“我”、“你”和“他”三人的感受与意志，并尊重 这个 复杂的三元关系 中的竞争与合作。


    通过一个新生儿的 心灵发展阶段，可以清晰地看到一个 一个新生命的 人是如何一步一步地认识到关系的 复杂 之处的。


    精神分析 学 认为可以将一个 孩子 6 岁 前 的发展 按照 3 种关系 分成 三个 阶段：


    # 一元关系阶段


    时间是 六个月前，这个 阶段的 婴儿 处于共生期， 觉得 自己和 妈妈 是一体的，甚至 自己和整个 世界 都是 一体的 和 心理 上的 一体 至少包括 两个
    层面：身体上 和 情绪上。


    一元 关系的 境界， 在 成年人 中 并不 少见。例如 恋爱 中的 女人 会 容易 想， 我不 说话就 要知道 我 在 想 什么， 否则 就是 不 爱 我，
    这是 恋爱 中 进行 到 共生 期 了， 渴望 自己 恋人 合二 为 一。 既然 合二 为 一 了， 自然 不用 沟通 就知道 彼此 想 什么。


    一元 关系 的 核心 规则 是“ 剥削”， 处于 一元 关系 的人， 会 总 不 往 去“利 他”， 掠夺 别人， 就 要 像我 “剥削” 妈妈 的 乳汁
    一样， 因为 婴儿 就 觉得 自己 什么都 有， 又 认为 既然 世界 一体， 所以 什么 都是 我 的， 我 可以 肆意 使用， 习惯 剥削 的 人， 也
    是 活 在 一元 关系 中， 但是 把他 自己 放在 了 母亲 角色 上， 这就是“ 圣母 情结”。


    # 二元 关系 阶段


    二元 关系 的 时间 是 6 个 月 到 3 岁， 从 五 个 月 开始， 孩子 进入 一 种 矛盾 感觉， 他 一方面 觉得 仍 要 得 妈妈 和 自己
    是 一体 的， 但 同时也 发现， 越来越 多 的 事 情 显示 他 和 妈妈 又是 两个 人。


    必须 说明 一下， 心理学 的 各种 发展 阶段 论 中， 涉及 的 年龄 都 要 看 成 一 个 大概， 而 不是 精确 的 数字。 比如 说 6 个 月
    前 是 共 生 期， 并不 是 精确 到 比如 六分 三 秒 就是 共 生 期， 六 个月 六 分 三 秒 就 进入 了 下 一 个 阶段 了， 这 只是
    一 个 大概 数值。


    孩子 意识 到 自己 和 妈妈 是 两个 人， 那 可能 意味 着 这是 孩子 和 妈妈 分离 的 开始， 这 个 分离 包括 除了 身上 的 分离 和 心灵
    上 的 分离， 表达 方面， 孩子 会 开始 表达 不 一样 的 意识， 会 用 语言 表达“ 不”， 这 是 孩子 在 划清 边界， 以 捍卫 自己 的
    独立 性。


    良好 的 照料 下， 孩子 到 差 不 多 三 岁 时， 会 初步 形成 自己 的 个性， 这 是 很 重要 的 一 个 里程碑。 与此 同时， 另 一个
    重大 的 事情 发生， 孩子 对 三 元 里 最 初 有 一点 认识， 他 会 有 一个 稳定 的 内在 客体。 这种 情况 可以 有 很 复杂 的 表达，
    比较 简单 的 是 孩子 内心 中间 有 了“ 爱 的 和 恨”， 这 意味 着， 孩子 心中 终于 有了“我 和 妈妈 两个 人 并存” 的 关系， 因此
    进入 了 二元 关系 的 世界。


    这 两个 里程 碑 中， 心 中 住 下 了 一个 稳定 的 爱 的 客体， 是 很 重要 的 一个 点， 这 意味 着， 孩子 有 了 一 个 可以 寄托
    情感 的 对象， 同时 也 意味 着， 他 可以 用 这个 客体 来 理解 自己 和 妈妈 的 关系， 这 就 是 心 中 住 下 了 一个 爱 的 人，
    他 心里 不 虚。


    二元 关系 的 核心 规则 是“ 控制”， 孩子 和 母亲， 在 争夺 对 孩子 的 控制 权。 妈妈 会 想 控制 孩子， 而 孩子 也 会 想 控制 妈妈。
    这 是 一 个 非常 关键 的 时期， 如果 控制 得 好， 孩子 会 形成 一 个 良好 的 自我 控制 能力。'
