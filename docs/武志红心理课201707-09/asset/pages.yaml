  md: '# 问答：尊重你的感觉，聆听你的心


    问答：尊重你的感觉，聆听...


    你好！今天是我们的问答时间，我先来回答一下大家的问题。明天我们会就第二章一共四周的内容来做一个复盘。


    本周的内容很好理解，几乎没有从大家留言中看到说“听不懂”，不像是前两周讲自我理论和弗洛伊德的性心理发展理论时，不少朋友说有些晦涩。


    内容虽然很好理解，但本周讲的故事，很多用户表示印象很深刻，“苹果的味道”和“完美七天”这两个故事，讲了如果一个人几天内彻底遵从自己的感觉，会抵达什么样的境界。


    现实中，我们都感觉到了“做自己”实在不易。本周的预告中，我留了一个作业：说一下你特别想做但一直没做的五件事。


    大家的回复非常踊跃，很快就有了上千条，我请我的助手，美丽而专业的Anny做了一下统计：


    旅行类占21.2%，其中想去西藏的，占15%；


    工作类占16.4%，最多的是“辞职，重新开始一份新的工作”，占这一类的49%，“创业、开店、有自己的工作室”占22%；


    体验类也占16.4%，多次被提及的有蹦极、跳伞、爬山顶峰、爬雪山、看星空、日出、极光、潜水冲浪等；除此之外还有：坐一次飞机、去河里摸鱼、跑十公里、泡在图书馆、用一年去流浪等；


    提升自我占15.2%，如找一个咨询师、学心理学、拼命高考；


    保持良好习惯占13.2%，如坚持健身、有规律作息、形成阅读和写作的习惯、学英语、学习到订阅专栏等；


    学技能的占9.2%，如游泳、学车、画画、唱歌、武术、拳击等，其中想学乐器类的占这一类总数的40%；


    关于房子的，占8%；


    关于恋爱的，占5.6%；


    ......


    和我有关的，占了2.4%，譬如想预约我的咨询，请我吃顿饭，去我们工作室参观等。


    # —— 本周问答 ——


    老师我就是一个外部评价体系的人，很在意别人的看法。要怎样才能改变成一个内部评价体系的人呢？


    这一类问题是第一篇文章《内部动机和外部动机》中最常见的提问，占了总数的一半还多。我们第二篇文章《哺育你的精神胚胎》其实已经给出了答案：回到你的感觉上，让你的感觉滋养你的精神胚胎。


    巴菲特曾说，他最受益的教诲，是父亲一再对他说：尊重你的感觉，你的感觉越是别具一格，别人越喜欢对你说三道四，这时候你需要的，就是继续尊重你的感觉。因为有这样的教诲，巴菲特才能做到“别人贪婪的时候我恐惧，别人恐惧的时候我贪婪”。


    我讲的心理学也很复杂，如果说只给出一个建议的话，那就是尊重你的感觉。


    这是超一流人才都会讲的东西，比如乔布斯就曾说：聆听你的心，而不是你头脑中的信条。使用提摩·加尔韦的术语，就是遵从自我2，而不是自我1。


    1. 我们做事时是不是同时使用两种评价体系，只是不同的人有不同的倾向，如同人性的向内和向外？ 2. 是不是有些人可以做些事是内在动机驱动，而做另外一些事是外在动机驱动？
    3. 内在动机和外在动机可以相互转化？ 4. 是否有些人有强烈内在动机，同时他/她也在乎外部评价？总觉得完全不在乎外部评价是不可能的？关于老师红老师写专栏的例子，如果专栏不是最受欢迎的或者不受欢迎，那还要坚持自己风格吗，领导的建议是不是就会形成外部压力？期待老师解惑。


    关于这些问题我认为，外部评价体系当然非常重要，如果我没有外部评价体系的话，就意味着一个人不会去实现实验能力，而没有现实检验能力，是精神病的一个诊断标准。


    只是，外部评价体系和内部评价体系谁更重要，谁是核心。就像我和本我一样，'
