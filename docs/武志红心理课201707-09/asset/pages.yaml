  md: '# 命运04｜罗森塔尔效应


    你好，欢迎来到《武志红的心理学课》。


    我们这一周的主题是“权威期待的力量”，今天是第一讲“罗森塔尔效应”。


    上一周，我们讲了自我实现的预言，意思是**我们自己说的话，就像是命运预言一样，在影响着我们的 人生。**


    其中的一个故事是说，一位女士认为“男人都不好好 办事”，不停地用自己的行为去推动这个相信，以此证明“我是对的”。我相信有敏感朋友会看到，这位女士的命运，和**其他一些执着于“我的爸爸打她妈妈，而她的丈夫三太都打她”**
    的故事一样。


    那么，所谓的自我实现的预言，会不会是一种权威期待呢？在我们童年的时候，父母、老师或某些养育者主导的经历中总结了一些话，成为了自己的认知。而因为自我的心机制，我们是不断地去追求“我是对的”，“我的认知是
    正确的，那么这些话很有可能是预言了我们未来的人生。


    的确是这样，所谓命运，就是这样的东西。我们对别人不太积极或消极的预言，常常最先来自于 别人对我们的预言。


    这就来讲心理学的 一个名词：皮格马利翁效应，也叫罗森塔尔效应。


    # ——罗森塔尔效应——


    先来解释我的第一个名词，皮格马利翁效应，皮格马利翁是古希腊神话中的塞浦路斯国王，性 格很孤独，喜欢独居。他非常寂寞，就用象牙雕刻了一个美女，爱上了这个雕像，祈求爱神
    的 美洛狄斯或爱神维纳斯给他一个雕像生命。爱神 被他 的诚意感动，答应了他，皮格马利翁得偿所愿，娶了雕像美女。


    这看起来是一个妥妥的宅男梦啊，找一个完全符合自己想象的美女为伴，而且竟然 还实现了。


    这个古希腊的神话就是皮格马利翁效应的由来，中文的意思是说，如果老师对于一些 人赋予强烈 的期待，这份期待就会奏效。


    美国心理学家罗森塔尔用实验证明了这一点。


    这个实验发生在1968年，罗森塔尔帮助 人们来到一所乡村小学，在一到六年级各选了 三个班，对这18个的学生进行一个“未来发展趋势测验”，测验结束后，他把一份“最有发展前景的”名单给了校方，并叮嘱**老师
    们一定要保密，免得影响实验的正确性。**


    这个名单占了学生总数的20%，但其实，校长和老师们都不知道，名单上的学生都是随机选择的，罗森塔尔根本没有看 过这个测验的成绩。


    奇妙的是，8个月后，情况果然有些变化。在针对这18个班学生的测验中发现，上了名单的那部分学生，成绩普遍有了显著的提高，而且性格更外向，自信心，求知欲都更强。


    面对这个结果，罗森塔尔提出了一个词，叫“权威谎言”。他认为，**对于 权威来说，权威，有 利 于 学生 求 取 长 远 的 成 就**，老师**将“ 你有
    发展 前景” 的预言 传递到那些学生身上，他们便** 逐渐**变成了**“**最有 发展 前景**”的人。**


    **可 以 说，是 这些学 生 并 没有得 到** **老师** **的** **预言 信 息， 来 告 知 自 己 是 “ 最有 发 展 前 途 ” 的
    人， 是 老 师 通 过 情 绪、 态 度 影 响 了 他 们。**


    在这里，还得跟你补充一个背景。在做这个实验前，罗森塔尔先拿小白鼠做过实验。


    他把 一群小白鼠随机地分成A组和B组，先告诉A组的饲养员说，你这一组的老鼠非常的聪明，接着告诉B组的饲养员说，你这一组的老鼠智力一般。几个月后，罗森塔尔 对两组老鼠做
    迷宫迷迷宫测试，结果发现，A组老鼠的表现显然比B组老鼠更好。


    听完小白鼠的实验和学校的实验，你会说，**权威 的 期 待， 可 不 是 对 于 小 白 鼠 动 物 也 一 样 有 效 果**，**其 实 也 有 很 多
    人 认 为 老 师 都 有 很 大 的 期 待， 不 是 所 有 的 老 师 都 是 相 信 的**，**在 这 里 我 告 诉 你 们， 并 不 是 所
    有 的 期 待 都 对 一 个 生 灵 造 成 重 大 的 影 响， 在 罗 森 塔 尔 的 实 验 中， 都 是 权 威 的 期 待 发 挥 了 力 量。**


    小白鼠，是行为主义心理学用的最多的实验对象，于是 针对行为主义心理学的 一个 大攻击就是，你怎么可以 从小白鼠 中观察到的规律中引申出 人 身上 ？


    我 在 此 发 过 生 物 学 家 科 顿 时， 学 过 过 小 白 鼠、 青 蛙、 兔 子 等 大 部 分 实 验。 小 白 鼠 和 青 蛙 会 被 冷
    待 的， 而 猴 子 与 豚 鼠 则 是 观 察 它 们 的 行 为。 曾 经 一 只 猴 子 是 到 处 名 闻 北 京 的 科 学 院， 好 一 段 时
    间 后 才 回 来。


    在这里，我要告诉你们，并不是所有人的 期待 对一个生灵是挺重大的作用。在罗森塔尔的实验中，都是权威的期待发挥了力量。


    什么是权威？就是 有权力，有威望，有资源的那一方。


    像在小鼠的实验中，饲养员对小鼠有巨大 权威，因为他们可以 决定小鼠的饮食，甚至生死。


    而在学校的实验中，校长和老师对学生有巨大权威，因为他们可以评 一个学生的资质。


    对于我们每个人来说，最原始，也最重要的权威，是父母。所以，父母对孩子的期待，可以是 很大很上至 影响孩子，在罗森塔尔的实验中，**对 孩 子 什 么 样 的
    期 待， 发 出 了 什 么 样 的 预 言， 对 他 的 成 长 是 一 件 非 常 关 键 的 事。**


    # ——关于我的故事——


    接下来 我讲讲我自己的故事。我名字中的“红”，不是因为生在红色年代，而是因为出生那天，我父亲梦见，他在地里捡了一块红石头。


    因为我出生之前家境非常贫穷，而我出生之后情况开始好转，所以我父母认为，是我 给家里带来了鸿运。其中最一个印证的是，我出生那 年，他 们买 了一个时代的“三大件”，也就是自行车、衣柜和缝纫机。


    这其实是一个典型的“权威性谎言”了。之所以 那 年买了“三大件”，是因为他们之前一直在攒钱。这些财富是他们创造和积累下来的，但他们却理解为，把这些都好归因到我这里，觉得是我
    带来了 家的鸿运。


    我父母甚至还觉得，全世界好像都在配合我似的，因为家里穷，所以遭遇我升举这样的事情，总会 有好运降临。要么 是借钱容易，要么 是家里母猪生小猪了，生意突然变好，等等。


    我的这种认为 和期望，可能 从我出生前就已经开始了，之后一直持续着。这终生的期待注入到我的潜意识深处，成为了我自身的一部分。


    我也确实如他们所期望，成绩 一直都非常好，而且 学得很轻松，最终 以一个 贫穷 家 的孩子，走到了今天。


    这些事情 看上去，像有命运在安排，因为这些当然不是自己 可以 直接 操 控 的 力量，但 就 罗 森 塔 尔 的 实 验 结 果 显 示 那 样，**这 可
    能 是 我 的 父 母 有 强 烈 的 期 待， 结 果 得 到 了 回 应。**


    所以，你对孩子有什么样的期待，发出了什么样的预言，对他的成长是一件非常关键的事。'
