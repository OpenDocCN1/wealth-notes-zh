  md: '# 预告｜心理大家们关于自我的理论


    今天，进入我们专栏的第六周，也是第二章 “自我”的第二周内容，这一周的主题是 “心理大家们关于自我的理论”。


    上周，我们谈了 “衡量自我的五个维度”，主要讲的是如何识人，也就是如何判断一个人的自我。


    这周，我们借心理大家们的一些理论，来谈谈，自我或人格，到底是怎么回事？


    这些理论中，最广为人知的，就是心理学家弗洛伊德的人格结构理论，也就是一个人的人格可以分成三部分：本我、自我和超我。


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_61_0.png)


    要想准确地理解弗洛伊德的本意，也许会有些难度，但是 “本我” 和 “超我” 这两个词汇，在传播中，已经表达了它们自身的含义：


    本我，就是本能；超我，就是道德。


    还可以说，本我，就是野心；超我，就是德性。


    作家刘慈欣在他的科幻小说《三体》中，写了一句超有名的话：


    > 失去人性，失去很多；

    失去兽性，失去一切。


    刘慈欣这句话传播相当深远，像有了超出他小说文本的独立生命力一般。


    理解 “本我” 和 “超我”、“野心” 和 “德性”、“人性” 和 “兽性”，是我们在 “自我” 这一章里要去完成的主要功课。


    作为本周的调查，我想问你两个问题：


    +   这辈子，你最 “本我” 的时候，是什么样的？

    这辈子，你最 “超我” 的时候，又是什么样的？


    你可以就我们刚刚介绍的概念，先想一想，然后留言告诉我。请讲得具体一些，有环境细节、有感受、有想法，那最好不过。当然你也可以有你自己的自由表达。


    你自己的思考和感觉，至关重要，因为这是你的视角。如果深入去看不同的心理大家们的思考，你会发现，他们都是在从不同的视角去讲同一个东西。


    最后，再分享一句鲁迅的诗：


    > 如果我们能人人手一根蜡烛，

    齐步走入黑室，

    自能看出

    象的全貌。'
