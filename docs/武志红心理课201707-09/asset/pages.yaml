    # 4. 成为你自己


    第二周和第三周，是最晦涩的两周内容，在留言中很多用户说听不懂，而到了最后一周“成为你自己”时，我就没见到一个人说听不懂了。


    这周的概念都很容易理解，包括外部评价体系、内部评价体系、外部动机和内部动机、精神胚胎胎、真自我和假自我等。


    这周让大家印象最深的两个故事吧：《天才在左疯子在右》中的“苹果的味道”，还有我的一位来访者的故事——“高二男生的完美七天”，这样的故事显示了，如果一个人完全跟随自己的感觉，他的感官充分打开时，会进入出神入化的迷人境地。


    这周我们更深刻地理解了“感觉”。蒙特梭利说，精神胚胎的养料就是感觉，而感觉，是“我”和其他事物建立关系时的产物。但如果“我”和其他事物间，插入了“你”的评价，这时感觉就被破坏了。


    懂得这一点后，再回到第一周的，我们可以发现“这篇个性化文章中的，我们就明白，为什么我和其他使用直觉判断人的朋友，识人反而那么准。


    ↓ 一键回顾：


    +   - 自我 12 - 内部动机和外部动机

    - 自我 13 - 养育你的精神胚胎

    - 自我 14 - 真自我和假自我


    问答：尊重你的感觉，聆听你的心


    在“命运”这一章中，四周内容的逻辑很严密。后一周的内容，都是重构了上一周的说法，而整合到一起，又非常好地说明了，外在命运和内在想象是如何相互呼应的。


    但“自我”这一章的四周内容，就没有这么严密的逻辑了，我是在通过介绍各方面的关于自我的理论，来强调“成为你自己”的原则。


    但这一周内容也有一条主线：如果说本我是“我”，而超我是“你”，我们会看到，最初“我”的本能喷涌而出，都是需要权威的“你”的允许和滋养。


    而最初的权威，势必就是父母等抚养者。所以实际上，我们都是在关系中，才能“成为自己”。


    这就引出了“关系”，我们下一章的主题。


    这一章很值得期待，对于精神分析不是非常了解的用户来说，你会发现，人际关系的奥妙，远远超出我们的认识和想象。'
