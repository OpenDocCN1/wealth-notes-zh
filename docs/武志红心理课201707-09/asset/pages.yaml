  md: '但我们可以发现，她的这份强悍，是在严重的创伤里生出的。


    后来，她的生命每一次重复强悍的时候，常常也意味着，她在重复一份被忽视的痛苦。


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_43_0.png)


    一个两岁半的小女孩，自己走了几公里的山路回家，这件事在很多人看来是不可能的。但是有两点需要说明：


    第一，她的弟弟的确小她两岁半，所以可以肯定的是，这件事就是发生在她两岁半的时候。


    第二，也许在路上，大人们也曾想抱过她，但她修改了自己的记忆，这个不奇怪，因为幼小的孩子重构记忆是一件常见的事。不过，这段路程主要是她自己走回来的，这事她后来还找自己父母求证过，是真实的。


    所以我们可以发现，在她的生命里，幼年自己走回家和生下儿子后被冷落这两件事像是经典重复似的，孤立无援的情景和带给她的感受都非常相似，这里面至少有5个共同点：


    +   * 这两件事情都和生育有关；

    * 都是一位母亲生了一个儿子，前一个情景是她的母亲生下了弟弟，后一个是她生下了儿子；

    * 在这两个情景里，她都被忽视了；

    * 两次被忽视的感觉都给她带来了巨大的痛苦；

    * 她自己父母家和她的丈夫家，都有明显的重男轻女思想；


    ......


    而这两件事中，不同的是，在她两岁半时发生的这份创伤情景中，她是被动的、资源匮乏的，她只能承受，然后靠发下“自强”的誓言，创造出了强悍的人格特质，但在她生下儿子的时候，她有了丰富的资源，可以主动掌握自己的命运。朋友过来帮了她忙，而她后来也找心理咨询师做咨询，由此解开了心结。


    其实，在生儿子之前，两岁半时发生的那件事，早被她给忘了，她的强悍是怎么来的，也被她忘了。但成年后，她生儿子那天的情景，又让她感受到了类似的强迫性重复，她记起了原初的痛苦，彻底地感悟到，她的强悍，是从被忽略的痛苦中产生的。


    她还明白了，她现在的处境已经非常不同，她需要学习，重新发出渴望被照顾、被宠爱的需求，这样才能活出女强人的对立面。当她能够这样做的时候，她就可以构建依恋和亲密的关系了，这解决了她从前往这缺失的缺失。


    现在，来回想一下，结合咱们昨天讲的主题“读懂你的人生长篇”，你会发现，这位女士在两岁的时候给自己构建的人生脚本，需要在成年之后再一次重复，借助成年后的资源和觉知能力，来化开两岁半时的心结。


    这就是强迫性重复，也就是轮回的价值。


    不过，必须配上相应的觉知，它才有这份价值。否则，就成了单纯的轮回。


