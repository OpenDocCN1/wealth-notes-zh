    # ### 武志红


    常常以为， 用该鞭子抽打自己，以此鞭策自己努力。这有时候会奏效，但也会带来一个反作用力，你鞭策自己，会给上很了劲鞭策，鞭策其实就是一种自我批判，而自我批判的力量和自我批判的恨，加在一起，
    会削弱我们做事的力气，也是所事无的。


    恨，是一个极为重要的力量，它常常起到的作用是切断链接。 我们需要看到它。


    不过，同时也要说，不要将恨视为不对的，因为有时，我们需要切断一些自己并不想要联接，来守护住自己的境界。


    关于“界限意识”， 今晚我在得到的直播里，也会重点来讲讲，欢迎你的关注。


    曾有过武老师的书《不再回应答案》，今天又回顾了一次关键的知识，我发现自己完全凭感觉做事的经验并不多，即使在打羽毛球的时候，我也会很努力地评价，最后导致打得意很不舒服。
    同我还在还评判别人，所以我经常会觉得：那些人和动物是观看， 为什么就能过，能后是看，看 觉得这样不公，然后引发更多的评判，更多的用力…… 需要在某一场景里打到更省力的去思考的时候，我才能把打好，那，
    时我的大脑就会停止思考的。 我学习PET（父母效能训练）时，知道有一个可控的概念，所限在我是活动的，可控。那么就会带来一个理：每个人对待孩子的界限都不一样，看起来总是够在自由的，但当我点到时，我的自由时点，事件有点麻烦。
    我可能会压力于服从了某家庭教育的界限设定（通常是因为我没有任何反应），这样会对孩子有不好的影响吗？


    # ### 武志红


    这位朋友的问题，也是一个常见的养育问题， 如果大人对孩子的教育不一 该怎么办？


    这个问题，明显忽视了一点——孩子 自己， 时候都需要使用巴希特父母的智慧了。 我们不断在讲巴希特： 尊重你自己的感受， 不仅仅是对其他人的态度的，也是面对父母的态度。


    也就是，面对因为孩子的问题，大人起了冲突，甚至大人间孩子起了冲突， 时候， 要求 孩子。 但，在解决冲突时，需要注意，要尊重 自己的感受，而不是相信各大权威成就你的判断和建议。


    最后，我想留一个问题， 这个问题很多朋友提出来了：


    我们先是讲了身心合一的奇迹力量， 说放下自责，但为什么第三篇文章又说了 态觉察的重要性能呢？这如何处理这一矛盾呢？


    我们的课程，已经讲了 我，我相信很多朋友都发现了， 三周的内容涉及到了很多矛盾：


    +   * 外在意见与内在想象；

    * 实现预言预言与权威的期待；

    * 自尊与低能；

    * 头脑与身体；

    * 放下自尊与自恋竞争

    * ......


    我们该如何处理这些矛盾？ 特别是本课读的最后一篇，为什么一会儿讲放下自我， 一会儿又鼓励自尊自强的竞争呢？


    我想先听听你的思考。


    必须说一句，在得到，我不是一个纯粹的讲者，我也是，也是一个学习者， 大家有太多的留言，有感情性的，也有知识性的，我屡屡受益。


    所以，期待你的参与。


    # ## ——————背景知识——————


    今天内容里提到的米歇尔·艾瑞克森，是美国的传奇催眠大师，他天生有音盲色盲，17岁时还得了小儿麻痹症导致全身瘫痪，但他因此逐渐悟到了催眠的真理，并花了三年时间通过自我催眠，让自己站了起来。


    在他之前，催眠显然也被一些心理治疗师和精神科医生使用， 但并未被严肃真正承认， 是更是被为玄学。但在之后，催眠被承认， 并成为一个重要的治疗流派或技术。


    大家知道，催眠中，催眠师不断说： 放松，放松。 放松， 是为了放松肌肉和骨骼的紧张，而每一个肌肉和骨骼的紧张，都对应着一个紧张的头脑意识层面的思维。 所以，
    当全身自然放松时， 意识也就放下来了。


    然而， 全然放松并非容易， 而艾瑞克森的小儿麻痹导致的全身瘫痪， 让艾瑞克森体验到极致的放松。 作为普通人， 艾瑞克森的一生是， 生命会在每个关卡上一扇门。
    全身瘫痪 也许会死到死不死很多人， 但让艾瑞克森进入了不可思议的境。


    国内现在有很多书在介绍艾瑞克森，我推荐《催眠之声伴随你》一书，非常精彩和好书的一本书。


    # ### 武志红


    最后再预告一下，今晚八点，也就是一个小时之后，我会在得到直播间跟你们见面， 主题是“界限意识，希望届时你能 有得到直播间 留言区里互动。 如果你现在有空，
    可以直接去得到首页点击“预约直播”。


