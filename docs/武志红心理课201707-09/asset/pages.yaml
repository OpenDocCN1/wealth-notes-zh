  md: '略名词，Tittyainment，由奶嘴（Titty）与娱乐（Entertainment）两个英文单词组合而成。意思是说，通过把令人陶醉的消遣娱乐和充满了感官刺激的产品填满足我们的生活，最终达到目的。好，什么呢？占用人们大量时间，让他们在不知不觉中丧失思考的能力。


