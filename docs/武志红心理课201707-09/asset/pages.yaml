  md: '中间是有界限的。


    # 六招划出“界限”


    # 1. 不含敌意的坚决


    第一招，不含敌意的坚决。


    界限意识是要说“no”，如果你是想影响我，我就要拒绝你。我研究生的时候，妈妈逼问我什么时候结婚。我发现，我很想躲着她，我越躲她越着急。终于我躲避不了，在一次回家，做了充分准备，跟妈妈长谈。我主动讲了我为什么不结婚，结婚就未必生孩子。


    我是北京大学心理学系的研究生，她是个老太太。到了第 3、4 天，她辩论不过我了。后来她就不愿意强求了。到我今天 43 岁，没有结婚、生孩子，我的母亲也没有过多说什么了。


    这就是不含敌意的坚决。很多人发现这招很管用，有人却说这招不管用。为什么管用呢，因为你的妈妈讲道理。所以就好好说了。


    # 2. 从小事开始


    如果第一招不行，那来第二招：从小事开始。


    实际上，一切共生关系中，都存在着严重的剥削，就像殖民地和宗主国的关系一样。历史上，殖民地独立的话，会有流血冲突。但是，如果周围都是亲人，就不用流血方式了。


    树立界限意识要从小事开始，从吃喝拉撒睡开始，这事虽然很小，但传递了“我”很坚决的态度。


    举个例子：有位母亲曾经有一次非要孩子加班后回家吃饭，孩子告诉她不用等，结果当孩子晚上八点回到家才发现家人都没吃饭，在等自己。这时候有一种强烈的被绑架的感觉，其实母亲意识是想用这种方式让孩子晚上早回家，但孩子直接和他们说：我今晚不吃饭晚了，以后再有这种情况我也不吃。以后母亲再也没有用这种行为“绑架”过孩子。


    # 3. 尊重事实，驳回情绪


    第三招，尊重事实，驳回情绪。


    第一层：理清事实。第二层：表达情绪。


    如果情绪是好的，可以接过来，情绪是垃圾的时候，必须驳回去。


    我有一个好朋友，在企业中做老板秘书，有一天老板突然对他说：你爱谁谁呀，我一天挣的比你一年都多。我朋友愣了一下，听啊，他说，老板你说的很对，我一辈子都挣不到你一年多的钱，但我很累，我不想这样。从此之后，老板对他刮目相看，他获得了特殊的位置。实际上，这个特殊位置，是这样换来的。


    # 4. 直击命门


    第四招，直击命门。


    共生绞杀中，有一个根本，我把事情弄得那么复杂，其实就是，“你为什么不听我的呢，为什么不按照我的来”。


    我们做事情说得复杂，其实就是为了控制对方，让对方按照自己的来，说得再复杂，就是让对方听你的。例如，一点小事，就上升到你爱我还是不爱我的高度。这其实打着爱的名义要入侵对方。所以谈的不是爱，而是“你听我听话还是不听我的”。


    爱，其实是幌子，是为了让对方无条件听你的，按照你的来。有人说：天啊，武老师，我感觉每个女孩有时都有这样的极端一面啊。其实，男朋友未必是百依百顺才是好的。


    所以，当遇到界限不清、对方干涉你的时候，你可以跟对方说，你比我说得更有道理，但是我的事情还是我的事情，还得我说了算。


    # 5. 让对方疼


    刚才讲了四招，都行不通的话，还有第五招，让对方疼：当各种方法都不行时，就来这个。可能是心理疼，可能是身体疼。'
