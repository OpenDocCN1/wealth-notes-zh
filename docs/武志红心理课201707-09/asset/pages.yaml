    # 武志红


    在这个留言里，我发现了“觉知”的存在，更重要的是，这位朋友讲了一个关键性事件：五六岁时，严重感冒发烧了一个月，然后就从调皮孩子，变成了一个听话的孩子。


    我把这样的事件，称为“生命隐喻”，也就是说，在这种转折性事件中，会藏着一个极为关键的新折性事件。


    我们需要的是，先去破解这份生命隐喻。怎么破解呢？原则就是，**试着从各个方面去解**。在这个感冒发烧事的前后，你，和你的家人——也就是你的“权威”，中间发生了什么事情。这绝对不仅仅是一个生理性事件。


    既然这件事重要，你需可以从方方面面去调查这件事，有时就清醒了，可能就会发现，为什么这次感冒发烧会带来那么大的影响。


    针对这个问题，今天只是说了个大轮廓，以后我会介绍各种方法，去帮助带你深入了解这些关键事件带给自己的影响。


    最后，说一下我对大家留言的观感。我发现，太多的留言，已经和我们讲课程内容没有关系了，很多朋友在问其他的问题，也一样是急着访问，该怎么办。


    这是非常重要的需求，我会特别重视。并且，我自己和我的团队，构建了一个“心灵乐土”心理咨询师系统，在全国7个城市了工作室，也招募了有近90名心理咨询师，我想可以选我们最优秀的咨询师，来专门回复大家的这些问题。


    不过，在我的专栏课程里，我会集中回复的是和课程直接相关的问题，而且是一些经典的、引发我思考的问题。而现在为此，这四篇问答文章，都是出乎我预料的，我没想到是要这样写文章。


    所以，经过两周的讲解互动以及阅读大家的留言，我想，我在体验上看到了我们的真实课程是怎样的，还可以怎样改善。目前，我也在思考学习小组等方面的内容，也在和得到的团队沟通，怎么可以把我们的课程，变得更好。


    也期待大家的宝贵意见。


    作为孩子的权威，批评会让孩子失去自信。


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_24_0.png)


    如果不能发自内心地肯肯他，就需要找寻另一个权威去鼓励他。


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_24_1.png)


    权威的期待，会强有力地影响一个人。


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_24_2.png)


    如果你想要被你影响的人变得卓越，那你就需要给对方积极的期待。


    ![](img/a007ea2715b4a3e87bd8fce34a8d163b_24_3.png)


    最后，也有一个小贴士给大家：本周我们在讲“权威期待”的同时，隔壁专栏《宁向东的清华管理学》也谈到了作为管理者时下属产生积极的影响，其中提到了一些有趣的现象，比如皮古效应、霍化效应，感兴趣的朋友可以去宁老师专栏的试读内容中了解一下。


