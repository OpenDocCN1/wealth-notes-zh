  md: '最后，我们再来谈谈预告中的那个问题：想象你去了天堂，天使对你说，你可以彻底按照你的意愿，选择一个你最喜欢的环境生活，那么，你会想要一个什么样的环境？


    现在你要看看你回答的这个环境中，有多少人在，其中又有谁是中心，而那个中心人物是一个、两个还是三个？这虽然不是一个严格的测试，但我觉得可能还是能看出你的世界是一元、二元还是三元关系。


    # 今日得到


    +   1. 一元关系，是指一个人只看到自己的意志，只感受到自己的感受，他希望别人都来配合他的意志；关系中，只能是他说了算。对应到早年的心灵发展阶段，一元关系的阶段是六个月前的共生期，婴儿觉得自己和妈妈，甚至和整个世界在身体和心理上都是一体的。


    +   2. 二元关系，是指一个人意识到，另一个人是和自已一样的独立存在，有自己的感受和意志，他能共情对方的感受，也真能尊重对方的意志。二元关系的阶段是6-36个月。孩子开始和妈妈分离，在身体和心理两方面。此阶段实现两个里程碑：心中住下一个爱的人，同时形成自己的个性。这两者都具备后，孩子就有了基本的能量。


    +   3. 三元关系，是指一个人能意识到关系的复杂之处，在复杂的关系中，他能同时看到我、你和他三个人的感受和意志，并尊重这个复杂的三元关系中的竞争与合作。三元关系的阶段是三到六岁。孩子充分意识到，除了“我”、“你（妈妈）”，还有“他（爸爸）”的存在，也就是孩子觉得这个家庭有三个中心，孩子会充分意识到关系的复杂性以及他内在心灵的复杂性。三元关系，是一切复杂关系的源头。


