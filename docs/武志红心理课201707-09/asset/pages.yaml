  md: '如果超我成核心，而本我受超我指挥，事情就变了。超我没有动力，动力只能来自于本我。


    使用内部评价体系的人，他做事情时，主要感觉到的是动力，而使用外部评价体系的人，他做事情时，主要感觉到的是压力。


    我专栏成功的例子，我想是因为在工作上我没为难过自己，从大学时做脑仁心理学工作后，我选择的都是符合我的内部评价体系的事，结果我在自己的任何一个职位上，成绩都非常出色。


    四岁半的孩子最近迷奥特曼迷得不行，暑假看电视的时间太多了，想着怎么通过转化为外部机制的办法让他不再沉迷iPad呢？


    # 武志红


    你可以使用奖励惩罚的方式，因为作为大人和家长，你有太多的资源可以使用。但是，你也很容易失败，因为哪怕去控制一个孩子，都不容易。如果真功成了，你也要做好准备，你可能会收获一个以外部评价体系为主的孩子。


    你可以和孩子一起，创造一些比奥特曼更好玩的东西。实际上，世界上最好玩的，就是人与生命之间，就是人与自然之间。


    一位心理学家说过一句名言：对于婴儿来讲，世界上最好玩的，就是妈妈的那张脸。当然，这句话说的是妈妈的神情，如果孩子和妈妈间能有充分互动，这是比任何事情都更有吸引力。


    两个使用不同评价体系的人，应该如何相处？


    # 武志红


    对于内部评价体系为主的人，你必须学习去尊重他的感受，对于外部评价体系为主的人，你可以控制他，通过使用言语评价或物质评价等。


    内部评价体系和外部评价体系有可能相互转换吗？比如一件事情，我原本是抗拒的，在环境的影响下，潜移默化中接受了，并最终成为了自己的认知，这样看来，外部评价体系就更有可能会自己的内部评价体系。再比如，我们每个人都会收到权威期待的影响，我们每个人持有的观念，有可能真的不是自己的观念，只是外部或者是权威期待对我们的影响，那么这样看来，内外部评价体系还有区分吗？或者说，内外部评价体系其实质上是一体和相互转化的？


    # 武志红


    关于这个问题，我想说，在我做咨询做到非常细腻的时候，我会发现，这是有巨大差异的。来访者对于以来访者为中心，还是以咨询师为中心，可以说是极度敏感。


    来访者有时会主动选择向咨询师认同，就像孩子一样，主动选择向父母认同，但一旦主动选择，就是内部评价体系。


    当然，权威或团体，比如说企业，是有一些基本规则，要求员工必须去遵守的。我们也知道，欧美企业更人性化，更重视员工的感受，而东方企业要更权化，就是会忽略员工的内部评价体系，而要求服从。


    不知道为什么，从小到大我总感觉有双眼睛在盯着我，所以我要一直做大太太是正确的事情，说大家喜欢的话，不然哪怕别人不在意，但这双眼睛就会告诉所有人，所以我一直很在乎别人的看法，就是老师说的外部评价体系。至于原因我真的不知道，我只是觉得做任何事，说任何话都要考虑别人的感受，否则每个人以自我中心，为所欲为，岂不大乱？我觉得活着不能太自私，所以我除了为自己而活，我也为别人而活，至少我一直都是这样认为，所以我从来没有享受过特性自由发挥的快乐。不知道有多少我这样心理的人？也希望武老师能解答一下原因。


    # 武志红


    关于这个问题，我想建议你试试看完成我们的作业：列出十件自己想做而没做的事，最好时小事，然后给自己一个期限，比如一个月或三个月内，把它们完成，看看会如何。


    尊重孩子的感受，就是他的精神胚胎自由成长，既然是自由，就可能向各个方向发展，那么如何判断和确定孩子精神胚胎的成长方向是积极或健康的？或者说只要是成长，只要是他做自己，就是好的吗？


    # 武志红


    我想与你分享罗杰斯的一句话：“要相信一个人想要被主流社会价值认可的天然倾向。”如果不被过多干涉、限制，孩子会选择向主流社会所认可的价值观而发展。我们第二周的问答中，一篇文章的题目可以回答这个问题“最好的期待，是我相信你”。


    既然人们对生命力非常惧怕，如同深渊一般，我们如何对待？是用抱持的环境让它流动，有意识控制还是如何？'
