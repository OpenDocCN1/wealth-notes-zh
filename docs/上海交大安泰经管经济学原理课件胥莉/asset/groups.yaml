    # 乘数公式


    注：ΔG 表示政府购买的变动量

    ΔY 与 ΔC 是产量与消费的最终变动量


    Y = C + I + G + NX        恒等式


    ΔY = ΔC + ΔG        I 与 NX 没有改变


    ΔY = MPC ΔY + ΔG        由于 ΔC = MPC ΔY


    MPC：边际消费倾向


    解出 ΔY


    ΔY = 1 / (1 - MPC) ΔG


    乘数'
