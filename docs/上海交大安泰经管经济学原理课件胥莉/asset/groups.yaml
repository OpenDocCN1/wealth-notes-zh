    ![](img/518b44ff56ad05e168220626515b534d_309_0.png)\n\n## 第6章 供给、需求与政府政策\n\n##\
    \ 本章我们将探索这些问题的答案：\n\n- 什么是价格上限与价格下限？各有什么例子？\n- 价格上限与价格下限如何影响市场结果？\n- 税收如何影响市场结果？对买者还是卖者征税对市场结果有什么不同吗？\n\
    - 什么是税收归宿？什么决定税收归宿？\n\n## 供给、需求与政府政策\n\n- 在一个自由、无管制的市场系统中，市场力量实现均衡价格和均衡交易量。\n\
    - 这种均衡结果也许是有效的，但并不是每个人对此都感到满意。\n- 市场的均衡价格可以反映和调节商品供求，但是却未必是能兼顾社会各方面利益的价格，所以政府要进行干预。\n\
    - 经济学家的作用之一就是利用他们的理论帮助制定政策。\n\n## 改变私人市场结果的政府政策\n\n- 价格控制：\n  - 价格上限：出售一种物品或服务的法定最高价格\
    \ 比如：租金控制\n  - 价格下限：出售一种物品或服务的法定最低价格 比如：最低工资\n- 税收：\n  - 政府要求买者或卖者每买进或卖出一单位物品所支付的一定数量的货币\n\
    \n我们将使用供求模型来分析各种类型的政府政策如何影响市场结果（买者支付的价格，卖者得到的价格，以及均衡数量）\n\n## 价格控制\n\n- 当政策制定者认为市场价格对买者或卖者不公平时，往往实行价格控制。\n\
    - 这就促使政府实行价格上限和价格下限政策。\n- 价格上限（Price Ceiling）\n  - 可以出售一种物品的法定最高价格。\n- 价格下限（Price\
    \ Floor）\n  - 可以出售一种物品的法定最低价格。\n\n## 价格上限如何影响市场结果\n\n当政府实行价格上限时，可能出现两种价格：\n\n\
    - 如果价格上限高于均衡价格，价格上限没有限制作用。\n- 如果价格上限低于均衡价格，价格上限对市场有限制作用。\n\n## 没有限制作用的价格上限\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_316_0.png)\n\n## 有限制作用的价格上限\n\n![](img/518b44ff56ad05e168220626515b534d_317_0.png)\n\
    \n## 价格上限如何影响市场结果\n\n- 价格上限的作用（$Q_D > Q_S$）\n  - 造成短缺。例：70年代的汽油短缺\n  - 非市场价格方式配给。例：排长队，卖者歧视\n\
    \  - 这些配给机制既可能是不公平的，也是无效率的：因为物品并不一定会卖给对它评价最高的买者\n  - 与此相比，一个自由竞争市场中的配给机制既有效率（物品卖给对它评价最高的买者），也是客观的（就是公平的）\n\
    \n## 加油站前的长队\n\n1973年，石油输出国组织（OPEC）提高了世界石油市场的原油价格。由于原油是用于生产汽油的主要投入，较高石油价格减少了汽油供给。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_319_0.png)\n\n![](img/518b44ff56ad05e168220626515b534d_319_1.png)\n\
    \n谁对加油站前的长队负责？\n\n经济学家把它归咎于限制石油公司对汽油收取价格的政府管制。\n\n## 汽油的价格上限有限制性\n\n![](img/518b44ff56ad05e168220626515b534d_321_0.png)\n\
    \n## 短期中和长期中的租金控制\n\n- 租金控制——房东能向房客收取的租金上限。\n- 这一政策的目的是帮助穷人更能租得起住房。\n- 一位经济学家称租金控制是“除了轰炸之外毁灭一个城市的最好方法”。\n\
    \n## 短期的租金控制\n\n公寓租金价格\n\n供给\n\n供给与需求都相对缺乏弹性\n\n受控制的租金\n\n短缺\n\n需求\n\n0\n\n公寓数量\n\
