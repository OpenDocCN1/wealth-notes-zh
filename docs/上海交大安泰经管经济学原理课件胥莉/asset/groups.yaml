    \n## 收入变动如何影响消费者的选择\n\n- **正常物品与低档物品**\n  - 如果当消费者收入增加时，消费者想更多地购买一种物品，这种物品被称为**正常物品**。\n\
    \  - 如果当消费者收入增加时，消费者想更少地购买一种物品，这种物品被称为**低档物品**。\n\n## 低档物品和正常物品\n\n百事可乐数量\n\n\
    新预算约束线\n\n原来最优点\n\n新最优点\n\n原来的预算约束线\n\nI₁\n\nI₂\n\n比萨饼数量\n\n0\n\n1. 当收入增加时预算约束线向外移动...\n\
