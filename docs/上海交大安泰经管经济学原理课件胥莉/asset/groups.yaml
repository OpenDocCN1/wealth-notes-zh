    \n### 练习2\n\n- 需求函数为Q=50−p/2。问价格从6元下降到4元时，消费者剩余增加了多少？\n\n### 生产者剩余\n\n- 生产者剩余——生产者得到的量减去卖者的成本。\n\
    - 成本：卖者为了生产一种物品而必须放弃的每种东西的价值（也是机会成本）\n- 包括所有用于生产物品的资源的成本和卖者对于他们自己时间的评价\n- 它衡量了生产者从参与市场中得到的利益。\n\
    - 正如消费者剩余与需求曲线密切相关一样，生产者剩余也与供给曲线紧密相关。\n\n### 四个可能卖者的成本\n\n| 卖者 | 成本 |\n|---|---:|\n\
    | Mary | $900 |\n| Lucy | 800 |\n| Georgia | 600 |\n| Grandma | 500 |\n\n### 供给表和供给曲线\n\
    \n| 价格 | 卖者 | 供给量 |\n| --- | --- | --- |\n| 900 美元或以上 | 玛丽、露西、乔治亚、格拉玛 | 4 |\n\
    | 800—900 美元 | 露西、乔治亚、格拉玛 | 3 |\n| 600—800 美元 | 乔治亚、格拉玛 | 2 |\n| 500—600 美元 |\
    \ 格拉玛 | 1 |\n| 500 美元以下 | 无 | 0 |\n\n"
