    \n## 政府的应对措施\n\n- 为了缓和信用危机，美联储和美国财政部向银行系统投放了千亿美元价值的资本\n- 这次不同寻常的政策暂时使美国纳税人成为许多银行的部分拥有者.\n\
    - 该政策成功地使银行系统再资本化并促进了2009年贷款向正常水平的恢复.\n\n## 美联储如何影响准备金量\n\n- 我们知道\n  货币供给 = 货币乘数\
    \ × 银行准备金\n- 美联储能通过改变银行准备金或改变货币乘数来改变货币供给\n\n## 控制货币供给中的问题\n\n- 美联储通过 **公开市场操作、银行贷款、法定准备金和准备金利息**\
    \ 来影响市场中的货币供给，但是往往会受到两个因素影响其效果：\n- 1、如果家庭以 **通货形式** 持有更多的货币，那银行拥有较少的准备金，放贷减少，货币供给也减少\n\
    - 2、如果银行持有 **超额准备金**，银行放贷减少，货币供给也会减少\n- 因此，在部分准备金银行制度中，经济中的货币量会受到储户及银行行为的影响。但是，美联储可以尽可能掌握家庭或银行行为的变动，并对这些变动做出反应，以此来控制货币供给\n\
    \n## 银行挤兑与货币供给\n\n- **银行挤兑：**\n  当储户怀疑银行可能要破产时，他们会“挤”到银行去提取自己的存款，持有更多的通货和更少的存款\n\
    \n- 在部分准备金银行制度下，银行没有足够的准备金来满足所有储户的提款要求，所以银行不得不被迫关门\n\n- 在这种情况下，银行将发放更少的贷款，保留更多的准备金以满足储户的提款要求\n\
    \n- 这些事件提高了准备金率，使货币创造过程逆转，并减少货币供给\n\n## 联邦基金利率\n\n- 在某一天，银行发现自己的准备金不足，可以向有超额准备金的银行贷款\n\
    - **联邦基金利率**：银行相互贷款时收取的短期利率。\n- 联邦公开市场委员会用公开市场操作来钉住联邦基金利率：买入债券将注入准备金，从而降低联邦基金利率。\n\
    - 联邦基金利率的改变会导致其它利率的改变，并对经济产生重大影响\n\n## 联邦基金利率与其他利率： 1970–2012\n\n![](img/518b44ff56ad05e168220626515b534d_1478_0.png)\n\
    \n## 货币政策与联邦基金利率\n\n为提高联邦基金利率，美联储出售政府债券\n\n银行体系准备金减少，并减少联邦基金的供给\n\n导致 r_f 上升\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1479_0.png)\n\n## 第 30章 货币增长与通货膨胀\n\
    \n## 本章我们将探索这些问题的答案：\n\n- 货币供给如何影响通货膨胀和名义利率？\n- 货币供给影响真实GDP或真实利率这样的真实变量吗？\n- 通货膨胀与税收有多像？\n\
    - 什么是通货膨胀的成本？它们有多严重？\n\n## 通货膨胀\n\n- **通货膨胀**是指一般物价水平的持续的和显著的上升。\n- 度量：**通货膨胀率**（即从一个时期到另一个时期一般价格水平变动的百分比）\n\
    - 当通货膨胀率小于0时，称为通货紧缩。\n\n## 通货膨胀的特点\n\n- 不是物价总体水平的轻微上升。\n  比如，1%的上升率就不被认为是通货膨胀。\n\
    - 是指物价总体水平的持续上升。\n  - 一次性的价格调整，就不被认为是通货膨胀。\n- 通货膨胀是物价总体水平的上升，而不一定是每一种商品有同一水平上升。\n\
    - 通货膨胀不一定意味着生活水平的下降，因为收入水平有可能以同一比率上升。\n\n## 通货膨胀率的计算\n\n- 消费价格指数（CPI）\n- 某年CPI=某年消费品价格水平/基年消费品价格水平\n\
    - 例如：已知消费品价格水平：1998 8.07；1999 10.82；2000 12.37，以1998年为基期，计算1999和2000年的CPI\n- 1999年CPI=10.82÷8.07=134%\n\
    - 2000年CPI=12.37÷8.07=153%\n- 通货膨胀率=（本年CPI一上年CPI）/上年CPI\n- 1999年通胀率=（134%一100%）/100%=34%\n\
    - 2000年通胀率=（153%一134%）/134%=14%\n"
  mdcn: "\n\n## 银行与货币供给：一个例子\n\n## 情形 3： 部分准备金银行制度\n\n如果借贷者在第二国民银行存款90美元\n\n最初，第二国民银行的T型账户：\n\
