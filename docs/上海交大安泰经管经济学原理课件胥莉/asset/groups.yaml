    # # 消费者剩余的求解


    +   - 令反需求函数 $P_d=f(Q)$，价格为 $P_0$ 时的消费者的需求量为 $Q_0$

    +   - 消费者剩余=需求曲线以下，市场价格线之上的面积


    ![](img/518b44ff56ad05e168220626515b534d_1032_0.png)


    ```

    $$CS=\int_{0}^{Q_0} f(Q)\,dQ-P_0Q_0$$

    ```


    > 消费者愿意支付的总数量−消费者实际支付的总数量'
