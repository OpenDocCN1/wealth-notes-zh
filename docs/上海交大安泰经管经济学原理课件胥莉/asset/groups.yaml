  - '[PAGE 1264]


    # 生产率:作用及决定因素


    +   - 生产率在决定世界上所有国家的

    +     生活水平方面起着关键的作用。

    +   - 生产率是指一个工人在每个单位劳动

    +     时间生产的物品与劳务的数量。'
  - '[PAGE 1265]


    # 生产率


    +   - 第一章中的经济学十大原理之一：一国的生活水平取决于它生产物品与劳务的能力

    +   - 这种能力取决于**生产率**：每单位劳动投入所生产的物品和劳务的数量。

    +   - Y = 真实GDP = 生产物品与劳务的数量

    +     L = 劳动数量

    +     因此生产率 = Y/L（人均产出）'
  - '[PAGE 1266]


    # 为什么生产率如此重要


    +   - 当一个国家的工人的生产率很高，那它的真实GDP和收入都会很高

    +   - 如果生产率快速增长，那么生活水平也会提高很快

    +   - 那么什么决定了生产率及其增长率？'
  - '[PAGE 1267]


    # 生产率是如何决定的


    +   - 用于生产物品与劳务的投入被称为**生产要素**

    +   - 生产要素直接决定了生产率。

    +   - 生产要素

    +     - 物质资本

    +     - 人力资本

    +     - 自然资源

    +     - 技术变革


    经济增长最终要受到资源的限制。'
  - '[PAGE 1268]


    # 生产率是如何决定的


    +   - **物质资本**

    +     - 是生产出来的生产要素。

    +       - 它是生产过程的投入，也是过去生产过程的产出。

    +     - 是用于生产物品与劳务的设备与建筑物的存量。

    +       - 用于生产或修理汽车的工具。

    +       - 用于生产家具的工具。

    +       - 办公楼，学校等等...'
  - '[PAGE 1269]


    # 人均物质资本


    +   - 用于生产物品和劳务的设备和建筑物存量称为 [物质]资本，用K表示

    +   - K/L = 人均资本

    +   - 如果普通工人有更多的资本（机器，设备等），那么生产率会更高

    +   - 就是说： K/L的增加导致Y/L的增加'
  - '[PAGE 1270]


    # 生产率是如何决定的


    +   - **人力资本**

    +     - 经济学家用来指工人通过教育、培训和经验而获得的知识和技能的一个术语。

    +     - 和物质资本一样，人力资本提高一个国家生产物品与劳务的能力。

    +     - 人力资本是指把这些理解传递给劳动力的资源消耗'
  - "[PAGE 1271]\n\n# 人均人力资本\n\n+   - **人力资本 (H)**: \n+     工人通过教育、培训和经验而获得的知识与技能\n\
    +   - H/L = 普通工人的人力资本\n+   - 如果普通工人有更多的人力资本（知识、技能等），那生产率会更高\n+   - 就是说： H/L 的增加会导致\
    \ Y/L 的增加"
  - '[PAGE 1272]


    # 生产率是如何决定的


    +   - 自然资源

    +   - 由自然界提供的用于生产物品与劳务的投入，如土地、河流和矿藏。

    +   - 可再生资源包括树木和森林。

    +   - 不可再生资源包括石油和煤炭。

    +   - 可能是重要的，但它们并不是一个经济体生产物品与劳务中生产率高的必要条件。'
  - '[PAGE 1273]


    # 生产率是如何决定的


    +   - 自然资源

    +     - 其他条件相同的情况下，一个国家有更多的N便可以生产出更多的Y

    +     - N/L的增加会导致Y/L的增加

    +   - 一些国家很富裕是因为它们拥有丰富的自然资源

    +     （比如沙特阿拉伯有大量的石油）

    +   - 但国家并不需要有大量的自然资源才能使自己富裕

    +     （比如日本进口它所需的自然资源）'
  - '[PAGE 1274]


    # 生产率是如何决定的


    +   - 技术变革

    +     - 社会对生产物品与劳务的最好方法的理解（技术知识）。

    +     - 经济增长更多地是依靠技术变革。

    +     - 技术进步并不仅仅意味着更快的计算机，更清晰的电视，或者更小的手机

    +     - 它意味着能提高生产率的一切高级知识(使社会从已有的资源中得到更多的产出)

    +       - 比如亨利·福特和生产线'
  - '[PAGE 1275]


    # 技术知识与人力资本


    +   - 技术知识是指社会对如何生产物品和劳务的理解

    +   - 人力资本源于人们为获得这种知识所做的努力

    +   - 两者对于生产率都很重要'
