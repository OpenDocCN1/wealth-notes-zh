  - '[PAGE 730]


    # 成本曲线及其形状


    边际成本随着产量增加而上升。边际成本递增 反映了边际产量递减的性质


    平均总成本曲线 是 U型的。


    +   - 在产量水平极低时，平均总成本高，这是因为固定成本只分摊在少数几个单位产品上。

    +   - 平均总成本随着产量增加而降低。

    +   - 当平均可变成本大幅度上升时，平均总成本开始增加。

    +   - 在使平均总成本最小的产量时，U型曲线的底部就出现了。这种产量有时被称为企业的有效规模。'
  - '[PAGE 731]


    # ATC 通常是 U 型的？


    伴随产量的上升：

    最初，AFC 的减少使 **ATC** 下降

    然而，AVC 的上升使 ATC 增加


    有效率的规模：

    使 ATC 最小的产量


    ![](img/518b44ff56ad05e168220626515b534d_731_0.png)'
  - '[PAGE 732]


    # 边际成本和平均总成本之间的关系


