    需求\n\n![](img/518b44ff56ad05e168220626515b534d_277_0.png)\n\n## 总收益与需求价格弹性的关系\n\
    \n- 当需求缺乏弹性时，增加产量会使总收入减少；\n- 当需求富有弹性时，增加产量会使总收入增加；\n- 当价格弹性=1时，总收入达到最大。\n\n##\
    \ 总收益与需求价格弹性的关系\n\n证明：\\(\\frac{dTR}{dP} = \\frac{d(P \\cdot Q)}{dP} = Q + P \\\
    cdot \\frac{dQ}{dP} = Q\\left(1 + \\frac{dQ}{dP} \\cdot \\frac{P}{Q}\\right) =\
    \ Q(1 + e_d)\\)\n\n若1+e_d>0，即e_d>-1或|e_d|<1，则 \\(\\frac{dTR}{dP} > 0\\)\n\n若1+e_d<0，即e_d<-1或|e_d|>1，则\
    \ \\(\\frac{dTR}{dP} < 0\\)\n\n若1+e_d=0，即e_d=-1或|e_d|=1，则 \\(\\frac{dTR}{dP} =\
    \ 0\\)\n\n## 总收益与需求价格弹性\n\n需求价格弹性 = 需求量变动百分比 / 价格变动百分比\n\n收益 = *P* x *Q*\n\n-\
    \ 如果需求是有弹性的，那需求价格弹性 > 1\n  需求量变动百分比 > 价格变动百分比\n- 需求量减少使收益减少的幅度大于价格上升使收益增加的幅度，总收益减少\n\
    \n## 总收益与需求价格弹性\n\n富有弹性的需求\n(弹性 = 1.8)\n\n如果 P = $200,\nQ = 12，收益 = $2400\n\n\
    如果 P = $250,\nQ = 8，\n收益 = $2000\n\n当需求富有弹性时，价格上升会使收益减少\n\n对你的网站的\n\n价格上升所需求增加的收益\n\
    \n需求量减少所损失的收益\n\n![](img/518b44ff56ad05e168220626515b534d_281_0.png)\n\n## 总收益与需求价格弹性\n\
    \n需求价格弹性 = 需求量变动的百分比 / 价格变动的百分比\n\n收益 = *P* x *Q*\n\n- 如果需求是缺乏弹性的，那需求价格弹性 < 1，需求量变动的百分比\
    \ < 价格变动的百分比\n- 需求量减少使收益减少的幅度小于价格上升使收益增加的幅度，总收益增加\n- 在我们下面的例子中，当你提高价格到$250时，假定需求量只减少到10（而不是8）\n\
    \n## 总收益与需求价格弹性\n\n现在，需求是缺乏弹性的：\n弹性 = 0.82\n\n如果 *P* = $200,\n*Q* = 12 ,\n收益 =\
    \ $2400\n\n如果 *P* = $250,\n*Q* = 10 ,\n收益 = $2500\n\n当需求缺乏弹性时，价格上升会使收益增加\n\n价格上升的网站的\n\
    增加的收益\n\n需求量\n减少所\n损失的\n收益\n\n![](img/518b44ff56ad05e168220626515b534d_283_0.png)\n\
    \n## 需求价格弹性与总收益的关系\n\n| 需求价格弹性 E_d | 价格变动 | 需求量变动 | 总收益变动 |\n|---|---|---|---|\n\
    | | E_d | >1 | 上升<br>下降 | 下降更多<br>上升更多 | 下降<br>上升 |\n| | E_d | <1 | 上升<br>下降 |\
    \ 下降较少<br>上升较少 | 上升<br>下降 |\n| | E_d | =1 | 上升<br>下降 | 同比率下降<br>同比率上升 | 不变<br>不变\
    \ |\n\n## 讨论\n弹性与支出/收益\n\nA. 药店将胰岛素的价格提高10%，对胰岛素的总支出会增加还是减少？\n\nB. 作为价格战的结果，游轮价格下降了20%。游轮制造公司的收益会增加还是下降？\n\
    \n## 讨论\n参考答案\n\nA. 药店将胰岛素的价格提高10%，对胰岛素的总支出会增加还是减少？\n\n支出 = P x Q\n\n胰岛素的需求缺乏弹性，需求量下降幅度不超过10%，因此支出增加\n\
    \n## 线性需求曲线的弹性\n\n![](img/518b44ff56ad05e168220626515b534d_288_0.png)\n\n线性需求曲线的斜率为常数，但它的弹性不是常数\n\
    \n价格\n\n弹性大于1\n\n弹性小于1\n\n数量\n\n7\n6\n5\n4\n3\n2\n1\n0\n\n2\n4\n6\n8\n10\n12\n\
    14\n\n## 同一条直线上的弹性值不同：\n\n- • 在直线的需求曲线上，各点斜率相同，但弹性系数却不同；\n- \n- • 在直线的需求曲线上可以找到一点，其弹性值恰好等于1；在此点之上，每点的弹性的绝对值都大于1；而在此点以下，每点的弹性绝对值都小于1。\n\
    - \n- • 正是因为前述同一条直线上弹性值不同，这就决定了在陡峭的曲线的上部，降价也能增加销售收入，反之，在平坦曲线的下部，降价则要减少销售收入。\n\n\
    ## 练习\n\n例1、某人对商品x的需求函数是 p = 100 − √q\n\n计算价格p=60和p=40的价格弹性系数(中点法)\n\n例2、某家公司生产录音机。原价为每台800元，每月销售量为1000台。销售部门估计其价格弹性为2。\n\
    \n如果公司降价至600元，则每月销售量可增至多少？公司销售额是否增加？\n\n## 例题分析\n\nEₚ = -[(Q₂-Q₁)/(Q₁+Q₂)/2]/[(P₂-P₁)/(P₁+P₂)/2]\n\
    **Q₂**=1800\nR₂ = P₂ * Q₂ = 600*1800 = 1,080,000\nR₁ = P₁ * Q₁ = 800*1000 = 800,000\n\
    R₂ > R₁\n\n"
