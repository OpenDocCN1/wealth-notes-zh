    \   - 它是消费者为了补偿放弃一个单位的其他物品而要得到一种物品的数量。\n\n## 边际替代率 MRS\n\n商品的边际替代率：在**维持效用水平不变**的前提下，消费者增加一单位某种商品的消费量所需要放弃的另一种商品的消费量，被称为商品的边际替代率。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1054_0.png)\n\n## 消费者偏好\n\n![](img/518b44ff56ad05e168220626515b534d_1055_0.png)\n\
    \n百事可乐\n数量\n\n比萨饼数量\n\n0\n\nMRS\n1\n\n无差异曲线\n\n$I_1$\n\n$I_2$\n\nA\n\nB\n\nC\n\
    \nD\n\n## 边际替代率\n\n- **边际替代率（MRS）**：消费者愿意以一种物品交换另一种物品的比率。\n- 小马的边际替代率是他愿意为多得到一条鱼所愿意放弃的芒果数量\n\
    - 沿着无差异曲线向右下方移动，MRS不断减少\n\n芒果的数量\n\n鱼的数量\n\nMRS = 无差异曲线的斜率\n\nA\nMRS = 6\n1\n\n\
    B\nMRS = 2\n1\nI₁\n\n## 无差异曲线的四个特征\n\n- 特征1: 对较高无差异曲线的偏好大于较低无差异曲线。\n  - 消费者通常对东西多的偏好大于东西少。\n\
    \  - 更高的无差异曲线所代表的物品量多于较低的无差异曲线。\n\n## 图2．消费者偏好\n\n![](img/518b44ff56ad05e168220626515b534d_1059_0.png)\n\
    \n百事可乐\n数量\n\n比萨饼数量\n\n无差异曲线\n\n$I_2$\n\n$I_1$\n\n0\n\nA\n\nB\n\nC\n\nD\n\n##\
    \ 无差异曲线的四个特征\n\n- 消费者对较高无差异曲线的偏好大于较低无差异曲线\n- 相对于 I₁ 上的每个消费束(如消费束 A)，小马更喜欢 I2 上的每个消费束(如消费束\
    \ C)\n- 他对 I₁ 上的每个消费束(比如消费束 A)的偏好要大于 I₀ 上的每个消费束 (比如 D)\n\n![](img/518b44ff56ad05e168220626515b534d_1060_0.png)\n\
    \n## 无差异曲线的四个特征\n\n- 特征2: 无差异曲线向右下方倾斜。\n  - 如果要减少一种物品的量，为了使消费者同样幸福就必须增加另一种物品的量。\n\
    \  - 如果一种物品的数量减少，另一种物品的数量必须增加。\n  - 由于这个原因，大多数无差异曲线向右下方倾斜。\n\n## 消费者偏好\n\n![](img/518b44ff56ad05e168220626515b534d_1062_0.png)\n\
