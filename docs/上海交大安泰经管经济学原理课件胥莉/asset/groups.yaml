    \n- 1. 一些买者离开市场\n- 2. 留在市场中的买者支付更高的价格\n\n![](img/518b44ff56ad05e168220626515b534d_377_0.png)\n\
    \n### 消费者剩余衡量了什么？\n\n消费者剩余，买者愿意为一种物品支付的量减他们实际支付的量。\n\n- 衡量了消费者从一种物品中得到的买者自己感觉到的利益。\n\
