    \n- 供给和需求的弹性越大；\n- 均衡数量下降的越多，\n- 税收的无谓损失也就越大。\n\n## 讨论\n弹性与税收的无谓损失\n\n下面各组物品中，对哪种物品征税的无谓损失更大？\n\
    \n- A. 谷类早餐还是防晒霜？\n\n- B. 短期的宾馆住房还是长期的宾馆住房？\n\n- C. 普通食品还是高档餐馆的用餐？\n\n## 讨论\n\
    参考答案\n\n**A. 谷类早餐还是防晒霜**\n\n我们在第五章已经知道：谷类早餐相对于防晒霜有更多相近的替代品，谷类早餐的需求价格弹性要大于防晒霜的需求价格弹性\n\
    \n因此，对谷类早餐征税造成的无谓损失要大于对防晒霜征税造成的无谓损失\n\n## 讨论\n参考答案\n\n- B. 短期的宾馆住房还是长期的宾馆住房\n\n\
    我们在第五章已经知道：长期宾馆住房的需求弹性和供给弹性都要大于短期宾馆住房\n\n因此，对长期的宾馆住房征税所造成的无谓损失要大于对短期的宾馆住房征税造成的无谓损失\n\
    \n## 讨论\n参考答案\n\n**C. 普通食品还是高档餐馆的用餐**\n\n我们在第五章已经知道：普通食品是必需品，其需求的价格弹性要低于高档餐馆用餐的需求弹性\n\
    \n因此，对高档餐馆用餐征税造成的无谓损失要大于对普通食品征税造成的无谓损失\n\n## 讨论\n\n- 政府需要增加税收收入来支付对学校，警察等的支出。为达到这个目的，政府既可以对普通食品征税也可以对高档餐馆的用餐征税\n\
    - 应该对哪个征税？\n\n## 税收规模变动的影响\n\n- 政策制定者经常提高或降低税收\n- 当税收变动时，无谓损失的变动情况如何？我们接下来考虑这个问题......\n\
    \n## 无谓损失和税收收入随税收变动而变动\n\n- 随着每一次税率增加，税收无谓损失的增加要快于税收规模。\n\n## 无谓损失与税收收入\n\n![](img/518b44ff56ad05e168220626515b534d_444_0.png)\n\
    \n小额税\n\n## 无谓损失与税收收入\n\n中额税\n\n![](img/518b44ff56ad05e168220626515b534d_445_0.png)\n\
    \n## 无谓损失与税收收入\n\n大额税\n\n![](img/518b44ff56ad05e168220626515b534d_446_0.png)\n\
    \n价格\n\n税收收入\n\n数量\n\n供给\n\n需求\n\n无谓损失\n\nP_B\n\nP_S\n\n0\n\nQ₂\n\nQ₁\n\n## 无谓损失与税收规模\n\
    \n最初，每单位物品征税 T\n\n双倍征税\n使无谓损失的增加超过一倍\n\n![](img/518b44ff56ad05e168220626515b534d_448_0.png)\n\
    \n## 无谓损失与税收规模\n\n最初，每单位物品征税 $T$\n\n三倍征税使无谓损失超过原来的三倍\n\n![](img/518b44ff56ad05e168220626515b534d_449_0.png)\n\
    \n新的无谓损失\n\n最初的无谓损失\n\n## 无谓损失与税收规模\n\n税收规模增加时，无谓损失增加的更快\n\n舍义：\n当税率低时，提高或降低税率既不会带来太大的损失，也不会带来太多的好处\n\
