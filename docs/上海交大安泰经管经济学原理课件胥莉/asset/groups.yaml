    +   - 外国投资者想要更多的美国债券

    +   - 外汇市场上对美元的需求增加

    +   - 美元升值

    +   - 美国出口物品相对于外国人而言变得更贵，而美国居民觉得进口的物品变得更便宜


    结果：净出口减少'
