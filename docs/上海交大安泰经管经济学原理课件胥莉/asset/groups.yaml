    \n## 无谓损失与税收收入\n\n大额税\n\n![](img/518b44ff56ad05e168220626515b534d_446_0.png)\n\
    \n价格\n\n税收收入\n\n数量\n\n供给\n\n需求\n\n无谓损失\n\nP_B\n\nP_S\n\n0\n\nQ₂\n\nQ₁\n\n## 无谓损失与税收规模\n\
    \n最初，每单位物品征税 T\n\n双倍征税\n使无谓损失的增加超过一倍\n\n![](img/518b44ff56ad05e168220626515b534d_448_0.png)\n\
    \n## 无谓损失与税收规模\n\n最初，每单位物品征税 $T$\n\n三倍征税使无谓损失超过原来的三倍\n\n![](img/518b44ff56ad05e168220626515b534d_449_0.png)\n\
    \n新的无谓损失\n\n最初的无谓损失\n\n## 无谓损失与税收规模\n\n税收规模增加时，无谓损失增加的更快\n\n舍义：\n当税率低时，提高或降低税率既不会带来太大的损失，也不会带来太多的好处\n\
