    \n![](img/518b44ff56ad05e168220626515b534d_223_0.png)\n\n## 非均衡状态\n\n短缺：当价格低于市场均衡价格时，需求量超过了供给量的状态。\n\
    \n- 存在着超额需求或短缺。\n- 供给者的反应是提高价格。\n- 随着价格提高，需求量减少，供给量增加，价格将趋向于均衡价格。\n\n## 判断题\n\n\
    - 均衡价格是供给等于需求时的价格（N）\n- 均衡价格是供给价格等于需求价格时的价格（N）\n- 均衡价格是供给量等于需求量时的价格（N）\n\n均衡价格只能是供给曲线和需求曲线相交时的价格。它必须同时满足：\n\
    \n供给量等于需求量\n\n供给价格等于需求价格。\n\n## 分析均衡的三个步骤\n\n- 确定该事件是使供给曲线移动，还是使需求曲线移动，或者使两种曲线都移动。\n\
    - 确定曲线是向右移动，还是向左移动。\n- 用供求图来考察这种移动如何影响均衡价格和数量。\n\n## 需求增加如何影响均衡\n\n猪肉的价格\n\n猪肉的数量\n\
    \n1. 春节到来使猪肉需求增加…\n\n2. …引起价格上升…\n\n3. …又销售量更多。\n\n供给\n\n新均衡\n\n原来的均衡\n\nD₁\n\n\
    D₂\n\n2.50\n\n2.00\n\n7\n\n10\n\n0\n\n## 例：混合动力汽车市场\n\n![](img/518b44ff56ad05e168220626515b534d_228_0.png)\n\
    \n混合动力汽车价格\n\n混合动力汽车数量\n\n## 例 1：需求增加如何影响均衡\n\n注意：当混合动力汽车价格上升时，生产者的供应量会增加，即使供给曲线没有移动\n\
    \n仔细区分供给/需求曲线的移动和沿着供给/需求曲线的移动\n\n![](img/518b44ff56ad05e168220626515b534d_230_0.png)\n\
    \n## 供给减少如何影响均衡\n\n猪肉的价格\n\n猪瘟减少了猪肉的供给...\n\nS₂\n\nS₁\n\n新均衡\n\n原来的均衡\n\n需求\n\n\
    2. ...引起价格上升...\n\n2.50\n\n2.00\n\n猪肉的数量\n\n3. ...以及销售量减少\n\n![](img/518b44ff56ad05e168220626515b534d_231_0.png)\n\
    \n## 例：供给减少如何影响均衡\n\n事件: 新技术降低了生产混合动力汽车的成本\n\n第一步：供给曲线移动，因为该事件影响生产成本\n\n第二步：供给曲线向右移动，因为该事件\n\
    \n第三步：这种移动使价格下降，产量增加\n\n![](img/518b44ff56ad05e168220626515b534d_232_0.png)\n\n\
    ## 例：供给和需求移动如何影响均衡\n\n事件：汽油价格上升与新技术降低生产成本\n\n第1步：两条曲线都移动\n\n第2步：两条曲线都向右移动\n\n\
    第3步：产量增加，但价格不确定。如果需求相对于供给增加的更多，那价格上升\n\n![](img/518b44ff56ad05e168220626515b534d_233_0.png)\n\
    \n## 例 3: 供给与需求的移动\n\n事件：汽油价格上升与新技术降低生产成本\n\n第3步：继续\n\n如果供给相对于需求增加更多，那价格下降\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_234_0.png)\n\n## 曲线移动与沿曲线移动\n\n- **供给变动：**\
    \ 影响供给变动的非价格因素使供给曲线移动（比如技术或投入品成本）\n- **供给量的变动：** 沿着一条固定供给曲线的变动\n- **需求变动：** 影响需求变动的非价格因素使需求曲线移动（比如收入或买者的数量）\n\
    - **需求量的变动：** 沿着一条固定需求曲线的变动\n\n## 需求和供给曲线的移动\n\n- 需求增强则使需求曲线向右上方移动，均衡价格上升，均衡产量增加；反之则反之。\n\
    - 供给增加则使供给曲线向右下方移动，均衡价格降低，均衡产量增加；反之亦反之。\n- 如果供给和需求都变动，其效果则取决于这两条曲线移动的净距离。\n\n\
    ## 当供给或需求变动时，价格和数量会发生什么变化？\n\n供求规律：均衡价格和均衡产量与需求呈同方向变动；均衡价格与供给呈反方向变动，而均衡产量与供给呈同方向变动。\n\
    \n|  | 供给未变 | 供给增加 | 供给减少 |\n|---|---|---|---|\n| 需求未变 | 价格相同<br>数量相同 | 价格下降<br>数量增加\
    \ | 价格上升<br>数量减少 |\n| 需求增加 | 价格上升<br>数量增加 | 价格不确定<br>数量增加 | 价格上升<br>数量不确定 |\n\
    | 需求减少 | 价格下降<br>数量减少 | 价格下降<br>数量不确定 | 价格不确定<br>数量减少 |\n\n## 讨论\n\n## 供给与需求的移动\n\
    \n用三步法来分析下列事件对音乐下载的均衡价格与均衡数量的影响\n\n- 事件 A: CD价格下降\n- 事件 B: 下载音乐的卖者通过谈判降低了他们出售每一首歌需要支付的特许使用费\n\
    - 事件 C: 事件A和事件B都发生\n\n## 讨论\n\n## A. CD价格下降\n\n## 步骤\n\n- 1. 需求曲线移动\n- 2. 需求曲线向左移动\n\
    - 3. 价格与数量都下降\n\n下载音乐市场\n\n![](img/518b44ff56ad05e168220626515b534d_239_0.png)\n\
    \n## 讨论\n\n## B. 专利使用费的下降\n\n## 步骤\n\n- 1. 供给曲线移动\n  (专利使用费是卖者成本的一部分)\n- 2. 供给曲线向右移动\n\
    - 3. 价格下降，数量增加\n\n## 音乐下载市场\n\n![](img/518b44ff56ad05e168220626515b534d_240_0.png)\n\
    \n## 讨论\n\n## C. CD价格下降且特许使用费也下降\n\n## 步骤\n\n- 1. 两条曲线都移动（见 A 与 B）\n- 2. 需求曲线向左移动，供给曲线向右移动\n\
    - 3. 价格肯定下降，而数量则不确定：需求减少会减少数量，而供给增加会使数量增加\n\n"
