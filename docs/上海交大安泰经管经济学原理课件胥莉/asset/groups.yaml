    \n消费者剩余是买者愿意为一种物品支付的量减去其为此实际支付的量\n\n复习：三角形的面积 = ½ x 底 x 高\n\n高 = $60 − 30 = $30.\n\
    \n所以\n\nCS = ½ x 15 x $30\n= $225\n\n![](img/518b44ff56ad05e168220626515b534d_376_0.png)\n\
