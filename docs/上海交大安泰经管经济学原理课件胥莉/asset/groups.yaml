  md: "\n## 市场细分\n- 前提是对用户信息掌握\n  - 用户应由多种差异度较大的群体组成\n  - 网上销售有助于了解客户\n- 网络效应有利于细分市场的发展\n\
    - 可培育细分市场的锁定功能\n  - 软件对青年和学生的打折\n  - 《华尔街日报》对商业和经济学界的打折\n\n## 市场细分案例：优惠券\n- 认为优惠券价值大于搜索成本的人才会大量使用优惠券\n\
    - 优惠券的发放要考虑用户的搜索成本\n  - 优惠券兑换率：产品包（14%）；直接邮寄（5.8%）；报纸插页（2%）\n- 有钱人的搜索成本高\n  -\
    \ 年收入5万美元以上的消费群，74%使用之\n  - 年收入在4-5万美元的消费群，86%使用之\n  - 年收入1.5万美元以下的，83%使用之\n\n\
    ## 竞争和垄断的利弊分析\n- 竞争：\n  - 价格低，产量大\n- 垄断：\n  - 价格高，产量小\n  - 但：有利于发挥规模经济优势；有利于技术进步\n\
    \n## 垄断的收益\n- 垄断可使经济外部性转为内部化\n  - 当产业存在负的经济外部性时，竞争性市场可能导致生产过度；垄断可能可以调节产量\n  -\
    \ 当知识产权保护机制不完善时，竞争性市场可能导致研发投入不足；垄断可能可以有所弥补\n  - 当市场不确定性较大时，竞争性市场可能导致行为短期化；垄断可以有助于实现长期优化\n\
    \n## 政府与企业的关系\n- 政府是市场经济健康发展的维护者和管理者，而不是领导者。\n- 政府经济政策的着眼点是改善市场业绩\n  - 保护竞争：反垄断法，反不正当竞争法\n\
    \  - 保护垄断：专利制度，规定规模\n  - 协调经济外部性：环境保护，税收调整\n\n## 对垄断的公共政策\n- 用反托拉斯法增强竞争：\n  -\
    \ 禁止一些反竞争的行为，允许政府打破垄断\n  - 例如：谢尔曼反托拉斯法(1890)，克莱顿法案(1914)\n- 管制\n  - 政府机构设定垄断价格\n\
    \  - 对于自然垄断，在任一产量上 MC < ATC，因此边际成本定价会导致损失\n  - 如果这样，管制者可以补贴垄断者或者把价格定为P = ATC 来使垄断者赚到零利润\n\
    \n## 政府管制的手段与特点\n- 价格控制\n- 收益率控制\n- 集中度控制\n- 间接与柔性\n  - 可转让污染许可证（与不许排放或罚款比较）\n\
    \  - 新加坡的汽车牌照拍卖\n  - 管制延迟对效率的影响\n\n## 政府管制的合理性与低效率\n- 管制可以协调垄断与规模经济\n- 管制可以减少经济外部性带来的扭曲\n\
    - 公共管制中的若干问题\n  - 信息不对称问题\n  - 公正性问题\n\n## 用反托拉斯法增强竞争\n- 反托拉斯法是目的在于遏制垄断力量的法律集成。\n\
    - 反托拉斯法给予政府促进竞争的各种方法。\n  - 这些法律允许政府阻止合并。\n  - 这些法律允许政府分拆公司。\n  - 这些法律禁止公司采取使市场竞争减弱的行动。\n\
    \n## 用反托拉斯法增强竞争\n- 美国两个重要的反托拉斯法\n  - 谢尔曼反托拉斯法 (1890)\n    - 减少当时被认为主宰经济的大而强的“托拉斯”的市场势力。\n\
    \  - 克莱顿法 (1914)\n    - 加强了政府的权利，并使私人对此类诉讼合法化。\n- 中国的《反垄断法》（2008）\n\n## 中国的反垄断法案例\n\
    - 相关市场界定\n  - 奇虎360诉腾讯QQ\n- 2010年10月14日，腾讯起诉360“隐私保护器”不正当竞争。\n- 2010年10月29日，360推出“扣扣保镖”，声称要对腾讯实施系列“净身”动作。\n\
    - 2010年11月3日，腾讯要求用户二选一。\n- 2010年11月4日，工信部介入调停，QQ和360软件完全兼容。\n- 2011年4月，北京朝阳法院一审判决，360“隐私保护器”构成不正当竞争。\n\
    - 2011年9月18日，腾讯向广东高院起诉360“扣扣保镖”不正当竞争。\n- 2011年11月15日，360向广东高院提起腾讯滥用市场支配地位垄断案诉讼。\n\
    - 2013年3月28日，广东高院一审判定，360诉腾讯垄断案，腾讯不具有市场支配地位，驳回360的全部诉讼请求。360上诉。\n- 2014年10月16日，最高人民法院终审判决，360诉腾讯垄断案，判决驳回360上诉，维持原判。\n\
    \n## 中国互联网反垄断法案例\n- 2021年4月10日，市场监管总局对阿里巴巴集团实施“二选一”等垄断行为作出行政处罚，处以182.28亿元天价罚款，创下中国反垄断执法最大罚单。\n\
    - 2021年4月12日，上海市市场监督管理局对上海食派士商贸发展有限公司实施“二选一”等垄断行为作出行政处罚，处以1168644.90元罚款 https://hao.360.com/?hj=llq2c\n\
    \n## 结论：垄断者的普遍性\n- 垄断问题有多普遍？\n  - 垄断是常见的。\n  - 许多企业对它们收取的价格都有一些控制能力，因为它们提供的物品与其它企业提供的物品并不完全一样。\n\
    \  - 有相当大垄断势力的企业是很少见的。\n  - 很少物品真正是独一无二的。\n\n## 练习\n\n假定垄断者面临的需求曲线为P=10-3Q。总成本函数为TC=Q²+2Q。求解并请用图形示意说明：\n\
    \n- (1) 垄断者利润最大化时的产量，价格和利润；\n- (2) 如果政府打算对该垄断厂商采取限价措施迫使其达到社会福利最大化所能达到的产量水平，则厂商的产品价格和利润为多少？\n\
    \n- • （1）因为P=10-3Q，则MR=10-6Q；又因为总成本函数为TC=Q²+2Q，所以MC=2Q+2所以MC=MR，得Q=1；P=7；利润=4\n\
    \n- • （2）社会福利最大化时，P=MC，所以Q=1.6，利润=2.56\n\n![](img/518b44ff56ad05e168220626515b534d_913_0.png)\n\
    \n## 第六篇 劳动市场经济学\n\n## 第18章 生产要素市场\n\n## 本章我们将探索这些问题的答案：\n- 什么决定了一个竞争企业对劳动的需求？\n\
    - 工资如何决定劳动供给？决定劳动供给的其他因素有哪些？\n- 各种事件如何影响均衡工资和劳动雇佣市场？\n- 其他投入的均衡价格和数量是如何决定的？\n\n\
    ## 生产要素与要素市场\n- **生产要素**：用于生产物品与劳务的投入。\n  - 劳动\n  - 土地\n- **资本**：用于生产物品与劳务的设备和建筑物\n\
    - 这些投入的价格与数量是由要素市场的供给和需求来决定的\n\n## 派生的需求\n- 生产要素市场类似于物品与劳务市场，然而：\n- 对生产要素的需求是一种派生的需求\
    \ – 是企业向另一个市场供给物品的决策派生出来的\n\n## 两个假设\n\n我们假设所有市场是竞争的\n\n代表性企业在下面市场中是一个价格接受者\n\
    - 它生产产品的市场\n- 劳动市场\n\n我们假设企业以利润最大化为目标\n- 每个企业产出的供给和投入的需求都是由这个目标派生的\n\n## 一个例子：\
    \ 农民Jack\n- 农民Jack 在一个完全竞争市场上出售小麦\n- 他在一个完全竞争劳动市场上雇佣工人\n- 当决定雇佣多少工人时，Jack考虑边际量以使利润最大化：\n\
    \  - 如果雇佣额外一个工人的收益大于成本，Jack会雇佣那个工人\n\n## 一个例子： 农民Jack\n- 雇佣额外一个工人的成本：\n  工资 –\
    \ 劳动的价格\n- 雇佣额外一个工人的收益：\n  Jack 可以生产更多的小麦来出售，从\n  而增加他的收益\n- 收益的大小取决于Jack的**生产函数**：用于生产一种物品的投入量与该物品的产量之间的关系\n\
    \n## Jack 的生产函数\n\n| L（工人的数量） | Q（每周生产小麦/蒲式耳） |\n|---|---|\n| 0 | 0 |\n| 1 | 1000\
    \ |\n| 2 | 1800 |\n| 3 | 2400 |\n| 4 | 2800 |\n| 5 | 3000 |\n\n![](img/518b44ff56ad05e168220626515b534d_923_0.png)\n"
