    # 经济学家的思考方式


    +   - 观察、理论、进一步观察，也就是通过观察，得出结论，进一步观察，修正结论。

    +   - 假设，从与实际情况并不相符的前提出发。

    +   - 经济学的研究是证实，而不是证伪。

    +   - 经济学分析要建立模型，也就是依据假定和逻辑关系，建立有关经济变量的,模型，可以简化认识实际生活,帮助解释复杂的真实世界如何运行。 。

    +   - 实证表述只说明是什么，而不作出价值判断；规范分析则要说明应该是什麽，也就是做出价值判断。'
