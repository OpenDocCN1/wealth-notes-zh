    +   - 例如，GDP中需要对住房存量提供的住房服务进行估算；

    +   - 政府服务通过成本来估算；

    +   - 一些难以估算的物品不列入GDP

    +   - GDP中不包括非法的活动（走私、贩毒等地下经济）

    +   - GDP中也不包括家庭内的生产和消费'
  - '[PAGE 1152]


