    # 本章我们将探索这些问题的答案：


    +   - 什么是外部性？

    +   - 为什么外部性的存在使市场结果无效率？

    +   - 什么公共政策能够解决外部性问题？

    +   - 人们有时如何自己来解决外部性问题？为什么私人解决方法并不总是有效？'
