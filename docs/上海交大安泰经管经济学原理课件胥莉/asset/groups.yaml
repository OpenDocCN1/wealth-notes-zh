    +     - 雇佣额外一个工人的收益（MPL）是用产出单位来衡量的


    +   - 解决方法：把 *MPL* 转化为美元


    +   - **边际产量值：**一种投入的边际产量乘以该产品的价格


    $VMPL = 劳动的边际产量$

    $= P \times MPL$'
