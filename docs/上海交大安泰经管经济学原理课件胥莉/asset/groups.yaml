    - 对美国人来说，瑞士轿车涨价，CPI上升，但是，美国的GDP平减指数不变，因为GDP中不含瑞士的轿车。\n- 经济学家和政策制订者为了估计物价上升有多快，即要关注GDP平减指数，又要关注消费物价指数。\n\
    - 有两个重要的差别导致这两个数字不一致。\n\n## GDP 平减指数与消费物价指数\n\n- **消费物价指数**比较固定的一篮子物品与劳务的价格与基年这一篮子物品与劳务的价格（劳工局只是偶尔改变这一篮子物品）…\n\
    - **GDP平减指数**比较现期生产的物品与劳务的价格与基年同样物品与劳务的价格。\n\n## 通货膨胀的两个衡量指标\n\n![](img/518b44ff56ad05e168220626515b534d_1226_0.png)\n\
    \n## 根据通货膨胀的影响校正经济变量：比较不同时期的美元数字\n\n- 通货膨胀使比较不同时期的美元数字变得更加困难\n- 例如： 最低工资\n  -\
    \ 在1964.12是$1.15\n  - 在2007.12是$5.85\n- 最低工资在1964年12月还是在2007年12月有更强的购买力？\n- 为了方便比较，我们用CPI把1964年的数字转换为“今天的美元”……\n\
    \n## 根据通货膨胀的影响校正经济变量：比较不同时期的美元数字\n\n今天美元的数量 = T年美元的数量 × 今天的物价水平 / T年的物价水平\n\n\
    - 在我们的例子中，\n  - “T年” =: 12/1964，“今天” =: 12/2007\n  - 最低工资 = $1.15 (T年)\n  - CPI\
    \ = 31.3(T年), CPI = 211.7(今天)\n\n1964的最低工资在今天（2007）是 $7.78\n\n$7.78 = $1.15 ×\
    \ 211.7 / 31.3\n\n## 根据通货膨胀的影响校正经济变量：比较不同时期的美元数字\n\n- 研究人员，商业分析师和政策制定者经常使用这种方法把一个时间序列的当期美元数字（名义）转换为不变美元（真实）数字\n\
    - 他们可以看到一个变量在根据通货膨胀的影响校正后是如何变化的\n- 例如：最低工资，从1950年1月转换到2007年12月.....\n\n## 根据通货膨胀的影响校正经济变量\n\
    \n- 当比较不同时点上美元数时，价格指数被用来校正通货膨胀的影响。\n- 通过以下计算将巴波·鲁思的1931年的薪水转换成按1999年美元计算的薪水：\n\
    \n$$\\text{薪水}_{1999}=\\text{薪水}_{1931}\\times\\frac{1999\\text{物价水平}}{1931\\\
    text{物价水平}}$$\n\n$$=$80,000\\times\\frac{166}{15.2}$$\n\n$$=$873,684$$\n\n## 用目前的美元和2007年的美元计算美国的最低工资，1950-2007\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1231_0.png)\n\n## 表. 前10名卖座电影（根据通货膨胀进行了调整）\n\
    \n| 片名 | 上映年代 | 按1999年美元估算的国内总票房收入（百万美元） |\n|---|---:|---:|\n| 1.乱世佳人 | 1939 |\
    \ 920 |\n| 2.星球大战 | 1977 | 789 |\n| 3.音乐之声 | 1965 | 638 |\n| 4.泰坦尼克号 | 1997 |\
    \ 601 |\n| 5.外星人：外星人入侵 | 1982 | 601 |\n| 6.十诫 | 1956 | 587 |\n| 7.大白鲨 | 1975 |\
    \ 574 |\n| 8.日瓦戈医生 | 1965 | 543 |\n| 9.丛林日记 | 1967 | 485 |\n| 10.白雪公主 | 1937 |\
    \ 476 |\n\n## 讨论\n转换为“今天的美元”\n\n美国普通的公立四年制学院与大学每年的教育费用：\n\n- 1986-87: $1,414 \
    \ (1986的CPI = 109.6)\n- 2006-07: $5,834  (2006的CPI = 203.8)\n\n经过通货膨胀校正，学生在哪一年会支付更多的费用，1986年还是2006年？将1986年的数字转化为2006年的美元进行比较\n\
    \n## 讨论\n参考答案\n\n美国普通的公立四年制学院或大学每年的教育费用：\n\n- 1986-87: $1,414  (1986的CPI = 109.6)\n\
    - 2006-07: $5,834  (2006的CPI = 203.8)\n\n解决办法：\n\n把1986的数字转换为“今天的美元”\n\n$1,414\
    \ x (203.8/109.6) = $2,629\n\n即使经过了通货膨胀校正，1986年的学费仍比2006年的学费低得多！\n\n## 根据通货膨胀的影响校正经济变量：指数化\n\
    \n- 当某一美元量根据法律或合约自动地按通货膨胀校正时，这种美元量就称为通货膨胀的指数化。\n- 比如, CPI的增加会自动调整:\n- 许多长期劳动合同的COLA\n\
    - 社会保障补助和联邦所得税等级的调整\n\n## 根据通货膨胀的影响校正经济变量：实际与名义利率\n\n- 利率代表未来要为过去转移的货币进行支付。\n\
    - 名义利率 是没有根据通货膨胀校正的利率。存款或债务的美元价值的增长率，它是银行所支付的利率。\n- 实际利率 是根据通货膨胀校正的利率。存款或债务的实际购买力的增长率\n\
    \n实际利率 = 名义利率− 通货膨胀率\n"
