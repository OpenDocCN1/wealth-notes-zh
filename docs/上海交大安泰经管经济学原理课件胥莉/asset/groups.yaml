    # 例1


    ![](img/518b44ff56ad05e168220626515b534d_53_0.png)


    +   - 一事务所估计每月复印1000张，市面上复印1张的价格是0.25元。若租用复印机，每月租金及杂费为100元，纸张价格是0.10元。

    +   决策问题一：是否租用复印机？'
