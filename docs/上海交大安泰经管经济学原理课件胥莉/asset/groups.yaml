    \n### 许多卖者的生产者剩余与光滑的供给曲线\n\n如果 P = $40 在 Q = 15（千双），边际卖者的成本是 $30，她的生产者剩余为 $10。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_392_0.png)\n![](img/518b44ff56ad05e168220626515b534d_392_1.png)\n\
    ![](img/518b44ff56ad05e168220626515b534d_392_2.png)\n\n鞋的供给：生产者剩余是价格以下和供给曲线以上的面积。\n\
    \n这个三角形的高度 = $40 − 15 = $25。\n\n因此，\nPS = ½ x b x h\n= ½ x 25 x $25\n= $312.50。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_393_0.png)\n\n### 更低的价格如何减少生产者剩余\n\n\
    如果价格降到 $30，\nPS = ½ x 15 x $15\n= $112.50。\n\n生产者剩余减少有两个原因：\n\n- 卖者离开市场减少的生产者剩余\n\
    - 仍留在市场的卖者只能得到更低的价格所引起生产者剩余的减少\n\n![](img/518b44ff56ad05e168220626515b534d_394_0.png)\n\
    \n### 讨论\n\n生产者剩余\n\n**供给曲线**\n\n- A. 找出边际卖者在 Q = 10 时的成本\n- B. 计算 P = $20 时的总生产者剩余\n\
    \n如果价格上升到 $30，计算下列情况下的生产者剩余：\n\n- C. 多售出 5 个单位物品所增加的生产者剩余\n- D. 最初 10 个单位物品在更高价格下增加的生产者剩余\n\
    \n![](img/518b44ff56ad05e168220626515b534d_395_0.png)\n\n### 参考答案\n\n**供给曲线**\n\
    \n- A. 在 Q = 10 时，边际成本 = $20\n- B. PS = ½ x 10 x $20 = $100\n\n价格上升到 $30：\n\n\
    - C. 多售出 5 个单位所增加的 PS = ½ x 5 x $10 = $25\n- D. 最初 10 个单位所增加的生产者剩余 = 10 x $10\
    \ = $100\n\n![](img/518b44ff56ad05e168220626515b534d_396_0.png)\n\n## 市场效率\n\n\
    消费者剩余和生产者剩余可以用来回答下面问题：\n\n由自由市场决定的资源配置是以一种合意的方式进行的吗？\n\n### 消费者剩余、生产者剩余与总剩余\n\n\
    CS = (买者的评价) − (买者支付的量) = 买者参与市场得到的收益\n\nPS = (卖者得到的量) − (卖者的成本) = 卖者参与市场得到的收益\n\
    \n总剩余 = CS + PS = 参与市场贸易得到的总收益 = (买者的评价) − (卖者的成本)\n\n### 资源的市场配置\n\n- 市场经济中，资源的配置是由许多分散自利的买者与卖者相互作用决定的\n\
    - 市场对资源的配置是合意的吗？还存在另一个不同的配置方法能使社会更好吗？\n- 为回答这个问题，我们使用总剩余作为衡量社会福利的指标，我们也考虑市场配置是否有效率\n\
    - 尽管这里我们主要关注效率，但政策制定者同样关注公平\n\n### 效率\n\n总剩余 = (买者的评价) − (卖者的成本)\n\n如果资源配置使总剩余最大化，那我们可以说，这种配置表现出效率。效率意味着：\n\
    \n- 物品是由对这种物品评价最高的买者消费\n- 物品是由生产这种物品成本最低的卖者生产\n- 增加或减少这种物品的数量并不会使总剩余增加\n\n###\
    \ 谁会消费物品？\n\n支付意愿 ≥ $30 的买者会购买\n\n支付意愿 < $30 的买者不会买\n\n因此，对物品评价最高的买者就是最终消费物品的人\n\
    \n![](img/518b44ff56ad05e168220626515b534d_402_0.png)\n\n### 市场均衡产量最大化总剩余了吗？\n\
    \n- 在 Q = 20 时，生产物品的边际成本是 $35，消费者对物品的边际评价是 $20。因此，降低产量能增加总剩余，只有生产物品的数量大于 15。\n\
    - 在 Q = 10 时，生产物品的边际成本是 **$25**，消费者对物品的边际评价是 **$40**。因此，增加产量能增大总剩余，只要生产物品的数量小于\
    \ **15**。\n- 市场均衡产量使总剩余最大：在其他任何产量条件，向市场均衡产量移动都能使总剩余增加。\n\n![](img/518b44ff56ad05e168220626515b534d_406_0.png)\n\
    \n### 市场效率\n\n- 市场效率——资源配置使社会所有成员得到的总剩余最大化的性质。\n- 除了效率之外，社会计划者还应关心平等——福利在各种买者与卖者之间分配的公平性。\n\
    \n### 市场均衡时的消费者与生产者剩余\n\n![](img/518b44ff56ad05e168220626515b534d_408_0.png)\n\
    \n### 三种关于市场结果的观点\n\n- 自由市场把物品的供给分配给对这些物品评价最高的买者。\n- 自由市场把物品的需求分配给可以以最低成本生产这些物品的卖者。\n\
    - 自由市场生产使消费者和生产者总剩余最大化的产量。\n\n### 自由市场与政府干预\n\n- 市场均衡是有效率的，任何其他结果的总剩余都不会高于市场均衡产量的总剩余\n\
    - 政府不能通过改变资源的市场配置方法而增加总剩余\n- 自由放任（法语意思是“让他们自由行事吧”）：表达了政府不应该干预市场的主张\n- 如果资源不是由市场来配置，而是由一个关心社会福利的中央计划者来配置\n\
    - 为了达到资源配置的效率和最大化总剩余，计划者需要知道市场中每个特定物品对每个潜在消费者的价值和每个潜在生产者的成本\n- 这个任务实际上是不可能完成的，这就解释了为什么中央计划经济没有效率\n\
    \n### 结论\n\n- 本章用福利经济学证明了经济学十大原理之一：\n  - 市场通常是组织经济活动的一种好方法\n- 重要的注释：\n  - 这些观点都是在假定完全竞争市场基础上推导出来的\n\
    - 我们将在接下来的章节中学习其他情况：\n  - 市场也可能使资源配置无效率……\n\n### 市场势力\n\n- 如果一个市场系统不是完全竞争的，就会出现市场势力。\n\
    - 市场势力是影响市场价格的能力。\n- 市场势力可以使市场无效率，因为它使价格和数量背离供求均衡。\n\n### 外部性\n\n- **外部性**——当某一市场结果影响根本不参与此市场的人时，外部性就产生了。\n\
    - 外部性使市场福利还要取决于买者评价和卖者成本之外的因素。\n- 在买者决定消费量和卖者决定产量而不考虑外部性时，市场均衡可能是无效率的。\n"
  mdcn: "\n\n## 用供给曲线衡量生产者剩余\n\n油漆房子的价格；供给\n\n价格 = 600美元：价格以下和供给曲线以上的面积衡量市场的生产者剩余。格拉玛的生产者剩余（100美元）。要油漆的房子数量。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_388_0.png)\n\n价格 = 800美元：价格以下和供给曲线以上的面积衡量市场的生产者剩余。$900\
    \ 800 600 500 0 1 2 3 4 要油漆房子的数量。总生产者剩余 (500美元)，乔治亚的生产者剩余 (200美元)，格拉玛的生产者剩余 (300美元)。\n\
    \n### 图6. 价格如何影响生产者剩余\n\n#### (a) 价格在 P₁ 时的生产者剩余\n\n价格以下和供给曲线以上的面积衡量市场的生产者剩余。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_390_0.png)\n\n#### (b) 价格在 P₂ 时的生产者剩余\n\
    \n价格、数量、供给、P₂、D、E、F、P₁、B、C、A、0、Q₁、Q₂。原来生产者新增的生产者剩余、原来的生产者剩余、新生产者的生产者剩余。\n\n![](img/518b44ff56ad05e168220626515b534d_391_0.png)\n\
    \n### 许多卖者的生产者剩余与光滑的供给曲线\n\n如果 P = $40 在 Q = 15（千双），边际卖者的成本是 $30，她的生产者剩余为 $10。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_392_0.png)\n![](img/518b44ff56ad05e168220626515b534d_392_1.png)\n\
    ![](img/518b44ff56ad05e168220626515b534d_392_2.png)\n\n鞋的供给：生产者剩余是价格以下和供给曲线以上的面积。\n\
    \n这个三角形的高度 = $40 − 15 = $25。\n\n因此，\nPS = ½ x b x h\n= ½ x 25 x $25\n= $312.50。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_393_0.png)\n\n### 更低的价格如何减少生产者剩余\n\n\
    如果价格降到 $30，\nPS = ½ x 15 x $15\n= $112.50。\n\n生产者剩余减少有两个原因：\n\n- 卖者离开市场减少的生产者剩余\n\
    - 仍留在市场的卖者只能得到更低的价格所引起生产者剩余的减少\n\n![](img/518b44ff56ad05e168220626515b534d_394_0.png)\n\
    \n### 讨论\n\n生产者剩余\n\n**供给曲线**\n\n- A. 找出边际卖者在 Q = 10 时的成本\n- B. 计算 P = $20 时的总生产者剩余\n\
    \n如果价格上升到 $30，计算下列情况下的生产者剩余：\n\n- C. 多售出 5 个单位物品所增加的生产者剩余\n- D. 最初 10 个单位物品在更高价格下增加的生产者剩余\n\
    \n![](img/518b44ff56ad05e168220626515b534d_395_0.png)\n\n### 参考答案\n\n**供给曲线**\n\
    \n- A. 在 Q = 10 时，边际成本 = $20\n- B. PS = ½ x 10 x $20 = $100\n\n价格上升到 $30：\n\n\
    - C. 多售出 5 个单位所增加的 PS = ½ x 5 x $10 = $25\n- D. 最初 10 个单位所增加的生产者剩余 = 10 x $10\
    \ = $100\n\n![](img/518b44ff56ad05e168220626515b534d_396_0.png)\n\n## 市场效率\n\n\
    消费者剩余和生产者剩余可以用来回答下面问题：\n\n由自由市场决定的资源配置是以一种合意的方式进行的吗？\n\n### 消费者剩余、生产者剩余与总剩余\n\n\
    CS = (买者的评价) − (买者支付的量) = 买者参与市场得到的收益\n\nPS = (卖者得到的量) − (卖者的成本) = 卖者参与市场得到的收益\n\
    \n总剩余 = CS + PS = 参与市场贸易得到的总收益 = (买者的评价) − (卖者的成本)\n\n### 资源的市场配置\n\n- 市场经济中，资源的配置是由许多分散自利的买者与卖者相互作用决定的\n\
    - 市场对资源的配置是合意的吗？还存在另一个不同的配置方法能使社会更好吗？\n- 为回答这个问题，我们使用总剩余作为衡量社会福利的指标，我们也考虑市场配置是否有效率\n\
    - 尽管这里我们主要关注效率，但政策制定者同样关注公平\n\n### 效率\n\n总剩余 = (买者的评价) − (卖者的成本)\n\n如果资源配置使总剩余最大化，那我们可以说，这种配置表现出效率。效率意味着：\n\
    \n- 物品是由对这种物品评价最高的买者消费\n- 物品是由生产这种物品成本最低的卖者生产\n- 增加或减少这种物品的数量并不会使总剩余增加\n\n###\
    \ 谁会消费物品？\n\n支付意愿 ≥ $30 的买者会购买\n\n支付意愿 < $30 的买者不会买\n\n因此，对物品评价最高的买者就是最终消费物品的人\n\
    \n![](img/518b44ff56ad05e168220626515b534d_402_0.png)\n\n### 市场均衡产量最大化总剩余了吗？\n\
    \n- 在 Q = 20 时，生产物品的边际成本是 $35，消费者对物品的边际评价是 $20。因此，降低产量能增加总剩余，只有生产物品的数量大于 15。\n\
    - 在 Q = 10 时，生产物品的边际成本是 **$25**，消费者对物品的边际评价是 **$40**。因此，增加产量能增大总剩余，只要生产物品的数量小于\
    \ **15**。\n- 市场均衡产量使总剩余最大：在其他任何产量条件，向市场均衡产量移动都能使总剩余增加。\n\n![](img/518b44ff56ad05e168220626515b534d_406_0.png)\n\
    \n### 市场效率\n\n- 市场效率——资源配置使社会所有成员得到的总剩余最大化的性质。\n- 除了效率之外，社会计划者还应关心平等——福利在各种买者与卖者之间分配的公平性。\n\
    \n### 市场均衡时的消费者与生产者剩余\n\n![](img/518b44ff56ad05e168220626515b534d_408_0.png)\n\
    \n### 三种关于市场结果的观点\n\n- 自由市场把物品的供给分配给对这些物品评价最高的买者。\n- 自由市场把物品的需求分配给可以以最低成本生产这些物品的卖者。\n\
    - 自由市场生产使消费者和生产者总剩余最大化的产量。\n\n### 自由市场与政府干预\n\n- 市场均衡是有效率的，任何其他结果的总剩余都不会高于市场均衡产量的总剩余\n\
    - 政府不能通过改变资源的市场配置方法而增加总剩余\n- 自由放任（法语意思是“让他们自由行事吧”）：表达了政府不应该干预市场的主张\n- 如果资源不是由市场来配置，而是由一个关心社会福利的中央计划者来配置\n\
    - 为了达到资源配置的效率和最大化总剩余，计划者需要知道市场中每个特定物品对每个潜在消费者的价值和每个潜在生产者的成本\n- 这个任务实际上是不可能完成的，这就解释了为什么中央计划经济没有效率\n\
    \n### 结论\n\n- 本章用福利经济学证明了经济学十大原理之一：\n  - 市场通常是组织经济活动的一种好方法\n- 重要的注释：\n  - 这些观点都是在假定完全竞争市场基础上推导出来的\n\
    - 我们将在接下来的章节中学习其他情况：\n  - 市场也可能使资源配置无效率……\n\n### 市场势力\n\n- 如果一个市场系统不是完全竞争的，就会出现市场势力。\n\
    - 市场势力是影响市场价格的能力。\n- 市场势力可以使市场无效率，因为它使价格和数量背离供求均衡。\n\n### 外部性\n\n- **外部性**——当某一市场结果影响根本不参与此市场的人时，外部性就产生了。\n\
    - 外部性使市场福利还要取决于买者评价和卖者成本之外的因素。\n- 在买者决定消费量和卖者决定产量而不考虑外部性时，市场均衡可能是无效率的。\n\n"
