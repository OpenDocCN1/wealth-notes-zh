  mdcn: "\n\n## 经济波动的两个原因\n\n- 总供给的不利移动\n  - 总供给决定因素中任何一种降低都使**总供给曲线向左移动**：\n    -\
    \ **产量**下降到自然就业率水平以下。\n    - **失业率**上升。\n    - **物价水平**上涨。\n\n## 总供给移动的影响\n\n\
    - 滞胀\n  - 总供给的不利移动会引起滞胀——衰退和通货膨胀并存的时期。\n  - 产量减少而物价上升。\n  - 那些能影响总需求的决策者不能同时抵消这两种不利的影响。调节起来非常困难\n\
    \n货币政策：提高利率——压低物价 但会加重产量减少\n\n## 总供给移动的影响\n\n- 对付衰退的政策\n  - 政策制定者可以用下列手段之一来对付衰退：\n\
    \    - 什么也不做，等待价格和工资调整。\n    - 利用货币和财政政策增加总需求。\n\n## 短期总供给移动的影响\n\n## 事件：油价上涨\n\
    \n- 1. 成本上升，SRAS曲线移动（假设 LRAS 不变）\n- 2. SRAS曲线向左移动\n- 3. 短期均衡在点B，P上升，Y下降，失业率上升\n\
    \n从A点到B点，滞涨：\n产出下降而物价水平上升的一段时期\n\n![](img/518b44ff56ad05e168220626515b534d_1734_0.png)\n\
    \n## 抵消短期总供给的不利移动\n\n如果政策制定者不作为：\n\n**4.** 低就业使工资下降，**SRAS**曲线一直向右移动，直到长期均衡点 **A**\n\
    \n如果政策制定者使用财政或货币政策来增加总需求，以此抵消总供给的移动：\n\n**Y** 回到 **Yₙ**\n\n但 **P** 会永远都更高\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_1735_0.png)\n\n紧缩的货币政策/扩大就业（给中小微企业发放贷款）\n\
    \n## 20世纪70年代的石油冲击及其影响\n\n|  | 1973-75 | 1978-80 |\n|---|---|---|\n| 真实石油价格 |\
    \ + 138% | + 99% |\n| CPI | + 21% | + 26% |\n| 真实GDP | − 0.7% | + 2.9% |\n| 失业量的变化\
    \ | + 3.5 百万 | + 1.4 百万 |\n\n## 约翰.梅纳德.凯恩斯 1883-1946\n\n- 《就业、利息与货币通论》 1936年\n\
    \n- 衰退和萧条之所以发生，是因为对物品与劳务的总需求不足；政策制定者应该移动总需求\n\n- 对古典经济学理论的著名批评：\n\n长期是对当前事情的一个误导。在长期中我们都会死。如果在暴风雨季节，经济学家只能告诉我们，暴风雨在长期中会过去，海洋必将平静，那么他们给自己的任务就太容易且无用了\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1737_0.png)\n\n## 第34章 货币与财政政策对总需求的影响\n\
    \n## 本章我们将探索这些问题的答案：\n\n- 利率效应如何帮助我们解释总需求曲线的斜率？\n- 中央银行如何使用货币政策来移动总需求曲线？\n- 财政政策通过哪两条途径来影响总需求？\n\
    - 支持和反对使用政策来稳定经济的理由分别是什么？\n\n## 介绍\n\n- 前面章节包括：\n  - 财政政策对于利率、投资和经济增长的长期影响\n \
    \ - 货币政策对于物价水平和通货膨胀率的长期影响\n- 本章主要介绍货币政策与财政政策通过变动总需求来影响经济的短期效应\n\n## 总需求\n\n- 除了货币和财政政策之外，还有许多其他因素影响总需求。\n\
    - 特别是，家庭和企业的合意支出决定了物品与劳务的总需求。\n  - 当合意支出变动时，总需求移动，引起产量与就业的短期波动。\n  - 货币与财政政策有时被用来抵消这种移动，从而稳定经济。\n\
    \n## 货币政策如何影响总需求\n\n- 总需求曲线由于以下三个原因而向右下方倾斜：\n  - 财富效应：通过物价变动影响家庭实际财富，刺激消费支出。\n\
    \  - 利率效应：较低的物价水平降低了利率，较低的利率刺激了投资支出\n  - 汇率效应：较低的物价降低利率，致使资本外流，本币对外币贬值，刺激净出口。\n\
    \n## 货币政策如何影响总需求\n\n对美国来说，货币占全部财富比重较小，财富效用有限；进出口的比重也较小，外汇效应也比较有限。所以美国总需求曲线向右下方倾斜的主要原因在于利率效应。这就提出了利率决定的流动性偏好理论。对美国经济来讲，总需求曲线向右下方倾斜的最重要原因是利率效应。\n\
    \n## 流动偏好理论\n\n- 凯恩斯提出了流动偏好理论来解释决定经济中利率的因素。\n- 根据这一理论，利率的调整使货币供给与货币需求平衡。\n\n##\
    \ 流动偏好理论\n\n- 货币供给\n  - 货币供给由美联储通过以下方式控制：\n    - 公开市场活动\n    - 改变法定准备金\n    -\
    \ 改变贴现率\n  - 由于货币供给量由美联储所固定，所以货币供给量不取决于利率。\n  - 一条垂直的供给曲线代表固定的货币供给。\n\n## 流动偏好理论\n\
    \n- 货币需求\n  - 货币需求有几个因素所决定。\n  - 根据流动偏好理论，最重要的因素之一是利率。\n  - 人们选择持有货币而不持有其他提供较高收益率的资产，是因为货币可以用于购买物品与劳务。\n\
    \  - 持有货币的机会成本是本来可以在有利息的资产上赚得的利率。\n  - 利率上升增加了持有货币的机会成本。\n  - 结果是，货币需求量减少。\n\n\
    ## 流动偏好理论\n\n- 货币市场的均衡\n  - 根据流动偏好理论:\n    - 利率的调整使货币的供求平衡。\n    - 存在一种利率，即所谓的均衡利率，在这种利率时，货币的需求量正好与货币的供给量平衡。\n\
    \n## 流动偏好理论\n\n- 货币市场的均衡\n  - 假设一个经济体如下：\n    - 物价水平固定在某一水平。\n    - 给定任一物价水平，利率调整使货币供给与需求平衡。\n\
    \    - 产量水平根据对物品与劳务的总需求进行调整。\n\n## 流动性偏好理论\n\n- 一个关于利率的简单理论\n- 利率的调整使货币供给与货币需求平衡\n\
    - 货币供给：假设由中央银行的政策固定，不取决于利率\n\n## 流动性偏好理论\n\n- 货币需求反映了人们想以流动性的形式持有多少财富\n- 为简化期间，假设家庭财富只包括两种资产：\n\
    \  - 货币——具有流动性但不支付利息\n  - 债券——支付利息但不具有流动性\n- 一个家庭的“货币需求”反映了它对流动性的偏好\n- 影响货币需求的变量：$Y$，$r$\
    \ 和 $P$。\n\n## 货币需求\n\n- 如果其他条件不变，而真实收入（*Y*）增加，那货币需求会发生什么变动？\n- 如果 *Y* 增加：\n \
    \ - 家庭想购买更多的物品与劳务，因此他们需要更多的货币\n  - 为得到货币，他们会试图出售一些债券\n- 就是说：其他条件不变，Y 增加会引起货币需求的增加\n\
    \n## 讨论\n货币需求的决定因素\n\n- A. 假设 *r* 上升，而 *Y* 和 *p* 不变。货币需求会发生什么变动？\n- B. 假设 *p*\
    \ 上升，但 *Y* 和 *r* 不变。货币需求会发生什么变动？\n\n## 讨论\n参考答案\n\n**A.** 假设 *r* 上升，而 **Y** 和\
    \ **P** 不变。货币需求会发生什么变动？\n\n*r* 是持有货币的机会成本\n\n*r* 的上升降低了货币需求：高利率会使家庭试图购买债券\n\n\
    因此，**其他条件不变，*r* 的上升会降低货币需求**\n\n## 讨论\n参考答案\n\n- **B.** 假设 *P* 上升，但 *Y* 和 *r*\
    \ 不变。货币需求会发生什么变动？\n\n如果 **Y** 不变，人们希望购买相同数量的物品与劳务\n\n而由于 *P* 上升，人们需要更多的货币才能购买相同数量的物品与劳务\n\
    \n所以，**其他条件不变，*P* 的上升导致货币需求的增加**\n\n## 总需求曲线向右下方倾斜\n\n- 物价水平是货币需求量的一个决定因素。\n-\
    \ 较高的物价水平增加了货币需求量。\n- 较高的货币需求引起了较高的利率。\n- 较高的利率减少了物品与劳务的需求量。\n\n这种分析的最终结果是物价水平与物品和劳务需求量之间的负相关关系。\n\
    \n## 利率是如何决定的\n\nMS 曲线是垂直：\n货币供给量由美联储固定， r 的变动并不影响 MS\n\nMD 曲线向右下方倾斜：\nr 下降会使人们增加货币需求\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1757_0.png)\n\n"
