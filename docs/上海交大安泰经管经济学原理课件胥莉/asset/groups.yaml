    # 降低通胀的代价


    +   - 降低通胀，必须实行紧缩性货币政策，这就导致生产的紧缩和就业的减少，实际上就是以失业为代价，换取通胀率的下降。

    +   - 牺牲率是指降低1%的通胀率将会导致产出下降的百分比。

    +   - 实行紧缩性政策可以使通胀率沿着原来的菲利普斯曲线下降，失业增加，但同时公众形成了通胀率会下降的预期，菲利普斯曲线向左移动，表明紧缩性政策可以使失业率回到初始位置，物价相应下降了。'
  - '[PAGE 1832]


    # 本篇小结：


    1、菲利普斯曲线描述通胀和失业之间负相关关系，刺激总需求可以实现高通胀，低失业；遏制总需求则可造成低通胀，高失业。

    短期中失业和通胀有替代关系，长期中没有，长期中的菲利普斯曲线是条垂线。

    受到不利的供给冲击以后，管理层只能在既定的失业率下，接受较高的通胀，或者在既定通胀率下，接受较高的失业率。

    紧缩货币可能使经济沿着短期菲利普斯曲线移动，引起暂时的高失业。反通胀的代价取决于通胀预期下降的速度，可信任的低通胀承诺可以引起预期的迅速调整，降低反通胀的代价。'
  - '[PAGE 1833]


    # 本篇小结：


    2、经济围绕长期趋势发生短期波动，这种波动是无规律的，无法预测的。它表现为GDP和就业指标的相应波动。


    总需求曲线向右下方倾斜的主要原因是财富效应、利率效应和汇率效应。


    长期总供给曲线是条垂线，因为长期中商品劳务的供给取决于劳动、资本、自然资源和技术，而不取决于物价水平。


    根据粘性工资理论，未预料到的价格水平下降暂时增加实际工资，使企业减少就业和生产；根据粘性价格理论，未预料到的物价水平下降企业价格暂时升高，这就减少了它们的销售；根据错'
  - '[PAGE 1834]


    # 本篇小结：


    觉理论，未预料的价格水平下降使供给者错误地认为，他们的相对价格下降，他们就减少供给。这就使得短期总供给曲线向右上方倾斜。这三种理论都表明实际物价与人们的预期物价背离时，产量与自然率背离。


    致使短期供给曲线移动的因素除了改变长期供给曲线位置的变量外，还有预期物价水平。


    总需求曲线向左移动导致产量减少，价格下降；向右移动则产量增加，价格上升。


    总供给曲线向左移动，价格上升，产量减少；向右移动，价格下降，产量增长。'
  - '[PAGE 1835]


    # 本篇小结：


    3、根据流动性偏好理论，利率变动可以实现货币供求相等。货币供给增加可以降低利率，投资成本下降刺激投资和总需求，反之则是这些变量反向变动。


    政府购买和税收变动，可以影响公众可支配收入，使总需求曲线相应变化，进而影响利率，调节总需求。


    乘数效应是国民收入的增加超过支出的增加，挤出效应则减少财政政策对总需求的影响。


    积极的财政货币政策有熨平经济波动的一面，也可能因为公众的预期和对策削弱或扰乱政策的效果。'
