    \ P}{P^*}$\n  其中：\n  - $P$ = 国内价格\n  - $P^*$ = 国外价格（用外国通货衡量）\n  - $e$ = 名义汇率，就是每一单位国内通货可以兑换的外国通货\n\
    \n**一种物品的例子**\n\n一个巨无霸在美国的价格是 \\$2.50，在日本的价格是 400 日元。\n\ne = 120 日元/每美元\n\ne ×\
    \ P = 一个美国巨无霸的日元价格 = (120 日元/每美元) × (\\$2.50) = 300 日元/每个美国巨无霸\n\n计算真实汇率：\n\n\
    e × P / P* = 300 日元/每个美国巨无霸 / 400 日元/每个日本巨无霸 = 0.75 日本巨无霸/一个美国巨无霸\n\n![](img/518b44ff56ad05e168220626515b534d_1583_0.png)\n\
    \n**真实汇率的解释**\n\n> “真实汇率 = 0.75 日本巨无霸/一个美国巨无霸”\n\n解释：为在美国购买一个巨无霸，一个日本居民只需用在日本购买0.75个巨无霸的钱\n\
    \n### 讨论：计算真实汇率\n\ne = 10 比索/每美元\n\n一杯星巴克拿铁咖啡的价格：\nP = 3 美元（美国），P* = 24 比索（墨西哥）\n\
    \n- A. 用墨西哥比索表示一杯美国拿铁咖啡的价格\n- B. 计算真实汇率（一杯美国拿铁咖啡可以购买多少墨西哥拿铁咖啡）\n\n### 参考答案\n\n\
    e = 10 比索/每美元\n\n一杯星巴克拿铁咖啡的价格：\nP = 3 美元（美国），P* = 24 比索（墨西哥）\n\n**A. 用墨西哥比索表示一杯美国拿铁咖啡的价格**\n\
    \ne × P = （10 比索/每美元）×（3 美元/一杯美国拿铁咖啡）= 30 比索/一杯美国拿铁咖啡\n\n**B. 计算真实汇率**\n\n(e ×\
    \ P) / P* = （30 比索/一杯美国拿铁咖啡）/（24 比索/一杯墨西哥拿铁咖啡）= 1.25 杯墨西哥拿铁咖啡/一杯美国拿铁咖啡\n\n###\
    \ 有许多物品的真实汇率\n\nP = 美国的物价水平，比如消费物价指数，衡量一篮子物品的价格\nP* = 外国的物价水平\n真实汇率 = (e × P)\
    \ / P*\n= 国内得到的一篮子物品相对于国外得到的一篮子物品的价格\n\n如果美国真实汇率上升，那美国物品相对于外国物品变得更昂贵。\n\n### 结论\n\
    \n- 如果美国真实汇率 ↑，那美国物品相对于外国物品变得更昂贵\n- 如果美国真实汇率 ↓，那美国物品相对于外国物品变得相对便宜\n\n![](img/518b44ff56ad05e168220626515b534d_1588_0.png)\n\
    \n## 一价定律\n\n- **一价定律：** 一种物品在所有地方都应该按同样的价格出售\n  - 如果咖啡在西雅图的价格为 \\$4/每磅，在波士顿的价格为\
    \ \\$5/每磅，并且可以无成本地转运\n  - 这就存在**套利**的机会，人们可以在西雅图买进咖啡而在波士顿卖出咖啡，很快获得利润\n  - 套利的存在使西雅图咖啡的价格上升，而波士顿咖啡的价格下降。这个过程会一直持续到最终两个市场上的价格相同时为止\n\
    \n**咖啡豆**\n\n西雅图：\\$4/磅\n\n无成本转运\n\n波士顿：\\$5/磅\n\n![](img/518b44ff56ad05e168220626515b534d_1590_0.png)\n\
    \n**套利**\n\n结果：这个过程会一直持续到最终两个市场上的**价格相同**时为止\n\n![](img/518b44ff56ad05e168220626515b534d_1590_1.png)\n\
    \n"
