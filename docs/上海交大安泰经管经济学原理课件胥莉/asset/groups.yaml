    \ 玻利维亚1985年通胀率为23,000%。\n  - 货币流通速度极大地加快，相对价格极不稳定。\n\n## 通货膨胀的形成原因\n\n- 本章介绍货币数量论来解释第一章中的经济学十大原理之一：\n\
    \  当政府发行了过多货币时，物价上升\n- 许多经济学家认为货币数量论能较好地解释通货膨胀的长期行为\n\n## 货币数量论\n\n- 古典通货膨胀理论认为在长期中货币数量决定物价水平。\n\
    - 16世纪法国经济学家波丹提出货币数量论（quantity theory of money）；\n- 18世纪哲学家大卫·休谟（David Hume）讨论了货币数量论。\n\
    - 现代货币数量论的代表是弗里德曼（Milton Friedman）。\n  - 我们通过两条途径来学习该理论：\n    1. 供需表\n    2. 方程式\n\
    \n## 物价水平与货币价值\n\n货币的价值（货币购买力）和物价水平都由货币数量决定。货币的价值与货币数量成反比，物价水平和货币数量同方向变动。货币数量越多，货币价值越低，物价水平越高。\n\
    \n## 货币价值\n\n- P = 物价水平\n  （如 CPI或GDP平减指数）\n  P 是用货币衡量的一篮子物品的价格\n\n- 1/P 是用物品衡量的1美元的货币价值\n\
    \n- 例如： 篮子含1个糖果\n  - 如果 P = $2， 1美元的价值等于 1/2 的糖果\n  - 如果 P = $3， 1美元的价值等于 1/3\
    \ 的糖果\n\n- 通货膨胀使物价总水平上升，并减少货币价值\n\n## 货币供给\n\n- 货币的供给与需求决定了货币的价值和均衡的物价水平。\n- 在现实世界，货币供给由美联储，银行体系和消费者共同决定。\n\
    - 货币的需求受许多因素影响，其中平均物价水平是最重要的影响因素。\n- 在这个模型中，我们假设美联储精确地控制货币供给量，并使它为一个固定的数量\n\n\
    ## 货币需求\n\n- 反映了人们想以流动性形式持有的财富量\n- 取决于物价水平：\n  物价水平的上升减少了货币价值，因此需要更多的货币去购买物品与劳务\n\
    - 因此，在其他条件不变的情况下，货币需求量与货币的价值负相关，与物价水平正相关\n  （这些其他条件包括实际收入，利率以及可用的ATM机的数量）\n\n\
    ## 货币供给与货币需求\n\n货币价值\n$1/P$\n\n物价水平\n$P$\n\n![](img/518b44ff56ad05e168220626515b534d_1493_0.png)\n\
    \n随着货币价值的增加，物价水平下降\n\n货币量\n\n## 货币供给与货币需求\n\n美联储将货币供给量固定，无论价格高低\n\n货币价值\n1/P\n\
    1\n3/4\n1/2\n1/4\nMS₁\n$1000\n货币量\n物价水平\nP\n1\n1.33\n2\n4\n\n## 货币供给与货币需求\n\n\
    货币价值下降（或物价水平上升）会增加货币的需求量\n\n货币价值\n1/P\n\n物价水平\nP\n\n货币量\n\n1\n3/4\n1/2\n1/4\n\n\
