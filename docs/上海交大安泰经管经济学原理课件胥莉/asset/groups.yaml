    \n## 第32章\n开放经济的宏观经济理论\n\n## 本章我们将探索这些问题的答案：\n\n- 在开放经济中，真实利率由什么决定？真实汇率呢？\n- 可贷资金市场与外汇市场是怎么联系起来的？\n\
    - 政府预算赤字如何影响汇率和贸易余额？\n- 其他政策或事件如何影响利率，汇率和贸易余额？\n\n## 介绍\n\n- 前一章介绍了开放经济的一些基本概念：净出口（*NX*），资本净流出（*NCO*）和汇率\n\
    - 本章介绍将所有这些概念联系在一起的开放经济理论\n- 我们用这个理论来考察政府政策和各种事件如何影响贸易余额，汇率和资本流动\n- 我们从可贷资金市场开始……\n\
    \n## 可贷资金市场\n\n- 从前一章所讨论的恒等式：\n- S = I + NCO\n\n储蓄\n\n国内投资\n\n资本净流出\n\n- 可贷资金的供给\
    \ = 储蓄\n\n- 每一美元储蓄可以为下列需求筹资：\n- 购买国内资本资产\n- 购买国外资本资产\n\n- 因此，可贷资金的需求 = I + NCO\n\
    \n## 可贷资金市场\n\n- 复习：\n  - *S* 与真实利率 *r* 正相关\n  - *I* 与真实利率 *r* 负相关\n- NCO与真实利率又是什么关系？\n\
    \n## 资本净流出如何取决于真实利率\n\n真实利率 r 是国内资产的真实收益\n\nr 的降低使国内资产相对于国外资产缺乏吸引力\n\n- 美国人会购买更多的国外资产\n\
    - 外国人会减少美国资产的购买\n- NCO 上升\n\n![](img/518b44ff56ad05e168220626515b534d_1604_0.png)\n\
    \n## 可贷资金市场\n\n可贷资金\n\nr 调整使可贷资金的供需平衡\n\nI 和 NCO 都与 r 负相关，因此需求曲线向右下方倾斜\n\n![](img/518b44ff56ad05e168220626515b534d_1605_0.png)\n\
    \n## 讨论\n\n## 预算赤字与资本流动\n\n- 假设政府产生预算赤字(之前是预算平衡)\n- 用合适的图形分析预算赤字对真实利率和资本净流出的影响\n\
    \n## 讨论\n\n## 参考答案\n\n用这个模型时，记住：可贷资金市场决定 r (左图)，但利率的大小决定 NCO (右图)\n\n## 可贷资金\n\
    \n## 资本净流出\n\n![](img/518b44ff56ad05e168220626515b534d_1607_0.png)\n\n![](img/518b44ff56ad05e168220626515b534d_1607_1.png)\n\
    \n## 外汇市场\n\n- 上一章的另一个恒等式：\n  * *NCO* = *NX*\n  * 资本净流出\n  * 净出口\n\n- 在外汇市场上，\n\
    \  - *NX* 代表对美元的需求：\n    外国人需要美元来购买美国物品与劳务的净出口\n  - *NCO* 代表对美元的供给：\n    美国居民为了购买外国资产需要把美元兑换成外国通货\n\
    \n## 外汇市场\n\n- 复习：\n\n美国的真实汇率（E）衡量一单位美国物品与劳务能交换的外国物品与劳务的数量\n\n- *E* 是外汇市场上美元的真实价值\n\
    \n## 外汇市场\n\n*E* 调整到使外汇市场上美元的供求平衡\n\n*E* 的上升使美国物品相对于外国人更贵，进而减少对美国物品的需求，也减少了对美国美元的需求\n\
    \n*E* 的上升对储蓄或投资并没有影响，因此它不会影响 *NCO* 或美元的供给。\n\n![](img/518b44ff56ad05e168220626515b534d_1610_0.png)\n\
    \n## 参考资料：美元的需求与供求\n\n如果美国居民购买进口物品，这个交易会影响外汇市场的供给还是需求？两种观点：\n\n- 1. **美元的供给增加**\n\
    \  这个人需要用美元兑换外国通货来购买进口物品\n- 2. **美元的需求减少**\n  进口增加减少了 *NX*，使对美元的需求减少\n  （因此，实际上\
    \ *NX* 是对美元的净需求）\n\n两种观点都是相同的，我们更习惯用第二种观点来考虑问题\n\n## 参考资料：美元的需求与供求\n\n如果一个外国人购买美国资产，这个交易会影响外汇市场上的供给还是需求？两种观点：\n\
    \n- 1. 美元需求增加\n  外国人需要美元来购买美国资产\n- 2. 美元供给减少\n  这个交易减少了NCO，也减少了美元的供给\n  （因此，实际上NCO是美元的净供给）\n\
    \n同样，两种观点都是相同的，我们将用第二种观点来考虑问题\n\n## 讨论\n\n## 预算赤字，汇率和净出口\n\n- 最初，政府预算平衡，贸易平衡（*NX*\
    \ = 0）\n- 如果政府出现预算赤字，正如我们前面所说，*r* 上升而 *NCO* 减少\n- 预算赤字会如何影响美国真实汇率和贸易余额？\n\n##\
    \ 讨论\n参考答案\n\n预算赤字减少 NCO 和美元的供给\n真实汇率升值\n净出口减少\n因为最初 NX = 0，预算赤字导致贸易赤字 (NX < 0)\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1614_0.png)\n"
  mdcn: "\n\n## 购买力平价\n\n- **购买力平价：** 一种认为任何一单位货币应该能在所有国家买到等量物品的汇率理论\n- 根据一价定律的原理得出\n\
    - 意味着名义汇率应该调整到使不同国家的一篮子物品的价格相等\n\n## 购买力平价\n\n- 例如： 篮子里有一个巨无霸\n  * *P* = 美国巨无霸的价格（美元）\n\
    \  * *P** = 日本巨无霸的价格（日元）\n  * *e* = 汇率，日元/1美元\n\n- 根据购买力平价，\n  * *e* x *P* = *P**\n\
    \  * 日元衡量的美国巨无霸的价格\n  * 日元衡量的日本巨无霸价格\n\n- 解出 *e*:\n  * *e* = *P** / *P*\n\n![](img/518b44ff56ad05e168220626515b534d_1592_0.png)\n\
    \n## 购买力平价\n\n- 购买力平价意味着名义汇率等于外国物价水平与国内物价水平的比率\n\n```\ne = P* / P\n```\n\n- 如果两个国家有不同的通货膨胀率，那名义汇率会发生变化：\n\
    \n  - 如果日本的通货膨胀率高于美国，那P*上升的速率要快于P，因此名义汇率上升 —— 美元相对于日元升值\n  - 如果美国的通货膨胀率高于日本，那P上升的速率要快于P*，因此名义汇率下降\
    \ —— 美元相对于日元贬值\n\n## 购买力平价理论的局限性\n\n名义汇率并不总是反映两个国家之间物价水平的两个原因：\n\n- 许多物品是不容易进行贸易的\n\
    \  - 例如：理发，看电影\n  - 套利不能消除这些物品之间的价格差\n- 即使是可贸易物品，当它们在不同国家生产时，也并不总能完全替代\n  - 例如，一些美国消费者相对于丰田汽车更偏爱雪佛兰，反之亦然\n\
    \  - 价格差别反映了嗜好的不同\n\n## 本章复习\n\n1. 下列关于一个国家贸易赤字的表述中，哪个是不正确的？\n\n- A. 出口 < 进口\n\
    - B. 资本净流出 < 0\n- C. 投资 < 储蓄\n- D. Y < C + I + G\n\n2. 一辆福特野马SUV在美国的价格是24,000美元，在俄罗斯的价格是720,000卢布\
    \ 如果购买力平价成立，名义汇率应该是多少（1美元兑换多少卢布）？\n\n## # 主要主数据的申请书・届出书\n\n下記のとおり、各种申请书・届出书を整备しています。\n\
