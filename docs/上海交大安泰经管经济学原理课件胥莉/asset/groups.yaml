    \n## 有限制性的价格下限\n\n冰激凌蛋卷的价格\n供给\n需求\n价格下限\n过剩\n$4\n$3\n均衡价格\n80\n需求量\n120\n供给量\n\
    冰激凌蛋卷的数量\n0\n\n## 价格下限如何影响市场结果\n\n- 价格下限阻止供给和需求调整到均衡价格和均衡数量\n- 当市场价格达到下限时，它就不能再下降，此时市场价格等于下限价格。\n\
    \n## 价格下限如何影响市场结果\n\n- 有限制作用的价格下限导致过剩，因为 Qₛ > Q_D\n\n- 非价格方式配给是根据歧视来配给物品的一种方式。\n\
    \  例：最低工资，对农产品价格的支持。\n\n## 最低工资如何影响劳动市场\n\n![](img/518b44ff56ad05e168220626515b534d_332_0.png)\n\
    \n## 最低工资\n\n最低工资法对技能高的工人并没有影响，它们影响的是青少年\n\n研究表明：最低工资每上升10%，就会使青少年就业减少1-3%。\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_333_0.png)\n\n## 讨论\n价格控制\n\n## 宾馆住房市场\n\
    \n决定下述政策的影响：\n\n- A. 价格上限为\n$90\n\n- B. 价格下限为\n$90\n\n- C. 价格下限为\n$120\n\n![](img/518b44ff56ad05e168220626515b534d_334_0.png)\n\
    \n## 讨论\n\n## A. 价格上限为$90\n\n价格降低到 $90\n买者的需求是 120个房间，而 卖者只愿意供给 90个房间，导致 短缺\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_335_0.png)\n\n## 讨论\n\n## B. 价格下限为$90\n\
    \n均衡价格高于价格下限，因此价格下限没有限制性\n\n$P = $100，\n$Q = 100$ 个房间\n\n![](img/518b44ff56ad05e168220626515b534d_336_0.png)\n\
    \n## 讨论\n\n## C. 价格下限为$120\n\n## 宾馆住房市场\n\n价格上升到 $120。\n买者的需求是60个房间，而卖者的供给是120个房间，导致过剩\n\
    \n![](img/518b44ff56ad05e168220626515b534d_337_0.png)\n\n## 对价格控制的评价\n\n- 第一章讨论的经济学十大原理之一是：\n\
    \  **市场通常是组织经济活动的一种好方法**\n\n- 价格是指引社会资源配置的信号。当政府进行价格控制时，这种配置通常会发生变化\n\n- 价格控制想帮助穷人，但往往却伤害了那些它本想帮助的人\n\
    \n## 税收\n\n- 政府对许多物品与劳务征税是为了给国防，公立学校等这类公共项目筹资\n- 政府能向买者或卖者征税\n- 税收可以是物品价格的一个比例或者每售出一单位物品需支付一定数量的货币\n\
    - 简化起见，我们仅分析后者对买者和卖者收税如何影响市场结果\n  - 税收抑制了市场活动。\n  - 当一种物品被征税时，它的销售量减少。\n  - 买者和卖者分摊税收负担。\n\
    \n## 弹性与税收归宿\n\n- 税收归宿 —— 关于由谁承担税收负担的研究。\n- 税收导致市场均衡的变动。\n- 不管向谁收税，买者支付的价格更高，卖者收到的价格更低。\n\
    \n## 向买者征收0.5美元税收的影响...\n\n价格\n\n供给, S₁\n\n买者支付的价格\n\n$3.30\n\n没有税收时的价格 3.00\n\
    \n税收 0.5美元\n\n2.80\n\n卖者得到的价格\n\n没有税收时的均衡\n\n有税收时的均衡\n\nD₁\n\nD₂\n\n数量\n\n0\n\n\
    90 100\n\n## 向卖者征收0.5美元税收的影响\n\n价格\n\n买者支付的价格\n\n$3.30\n\n有税收时的均衡\n\nS₂\n\n向卖者征税使供给曲线向上移动，移动量为税收（0.5美元）\n\
    \n3.00\n\n税收 0.5美元\n\n没有税收时的价格\n\n2.80\n\n卖者得到的价格\n\nS₁\n\n没有税收时的均衡\n\n需求, D₁\n\
    \n0\n\n90\n\n100\n\n数量\n\n## 讨论\n税收的影响\n\n## 宾馆住房的市场\n\n假定政府对买者\n所入住的每个房\n间都征税$30\n\
    \n找出新的\nQ, P_B, P_S,\n以及税收归宿\n\n![](img/518b44ff56ad05e168220626515b534d_343_0.png)\n\
    \n## 讨论\n参考答案\n\n## 宾馆住房市场\n\nQ = 80\n\nP_B = $110\n\nP_S = $80\n\n税收归宿\n\n- 买者：\
    \ $10\n- 卖者： $20\n\nP\n\nQ\n\nS\n\nD\n\nP_B = 110\n\nP_S = 80\n\n80\n\n税收\n\n\
    ## 税收负担如何分摊\n\n（a）供给富有弹性，需求缺乏弹性\n\n价格\n\n买者支付的价格\n\n没有税收的价格\n\n卖者得到的价格\n\n0\n\n\
    供给\n\n需求\n\n税收\n\n1. 当供给比需求富有弹性时...\n\n2. ...税收负担更多地由消费者承担\n\n3. ...更少地由生产者承担。\n\
    \n卖者相对于买者更容易离开市场，因此买者承担了大部分税负\n\n![](img/518b44ff56ad05e168220626515b534d_346_0.png)\n\
    \n## 税收负担如何分摊\n\n(b)供给缺乏弹性，需求富有弹性\n\n1. 当需求比供给富有弹性时...\n\n2. ...税收归宿更多地由生产者承担...\n\
    \n3. ...\n\n价格\n\n数量\n\n买者支付的价格\n\n没有税收的价格\n\n卖者得到的价格\n\n供给\n\n税收\n\n买者相对于卖者更容易离开市场，因此卖者承担了大部分的税负\n\
    \n![](img/518b44ff56ad05e168220626515b534d_347_0.png)\n\n## 弹性与税收归宿\n\n所以, 税收负担是如何分摊的?\n\
    \n税收负担更多地落在缺乏弹性的市场一方身上, 即, 当市场变得不利时, 买者和卖者离开市场的意愿。\n\n![](img/518b44ff56ad05e168220626515b534d_348_0.png)\n\
    \n## 案例研究：谁支付奢侈品税\n\n- 在1990年，国会通过了一项针对游艇，私人飞机，皮衣，珠宝和豪华轿车这类物品的新的奢侈品税\n- 税收的目的；增加富人的税收\n\
    - 但真正支付税收的人士谁？\n\n## 案例研究：谁支付奢侈品税\n游艇市场\n\n![](img/518b44ff56ad05e168220626515b534d_350_0.png)\n\
    \n买者承担的税负\n\n卖者承担的税负\n\n需求是富有弹性的\n\n在短期内，供给缺乏弹性\n\n因此，游艇工厂承担了大部分的税收\n\n## 结论：政府政策与资源的配置\n\
    \n- 本章的两种政策都会影响社会资源的配置：\n  - 例 1：对商品的征税降低了均衡数量。当商品的产量降低时，资源（工人，设备，投入品）将会转移到其它行业\n\
    \  - 例 2：一个限制性的最低工资会引起工人的超额供给，这是对资源的浪费\n\n- 因此，决策者在应用这些政策时需要非常小心\n\n## 本篇重点\n\n\
    - 供给与需求相交决定均衡价格。\n- 需求价格弹性反映价格变动影响需求的程度，低弹性商品提价销售，高弹性商品薄利多销。\n- 均衡价格并非符合社会利益的价格，所以政府要干预，干预也要遵循市场规则。\n\
    \n## 评析\n\n- 供求分析的理论缺陷\n- 均衡价格和劳动价值论\n- 供求分析和市场调节\n\n## 评析\n\n- 供求分析的理论缺陷\n  -\
    \ 不切实际的假设\n  - 没有真正说明均衡的现实问题\n  - 仅仅是一种局部均衡\n\n## 评析\n\n- 供求分析和市场调节\n  - 优点\n\
    \    - 有助于解释市场运行的许多现象\n    - 对分析资源配置有重要意义\n  - 缺点\n    - 可能出现低效率的市场失灵\n    - 自发调节的盲目性可能引发经济波动\n\
    \    - 自发调节的结果可能导致不公平\n\n"
