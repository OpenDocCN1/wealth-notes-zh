    \  - 有时间收集折扣券的人们通常收入和支付意愿都较低\n\n## 常见的定价方法\n\n- 分段定价法\n  - 依据数量定价\n  - 累进与累退\n\
    - 高峰负荷定价法\n  - 依据时间定价（以减少需求的波动）\n    - 上海电力分时间段定价\n    - 新加坡出租车高峰时间加收附加费\n  -\
    \ 产品储存成本对定价的影响\n\n## 创造价格歧视的条件\n\n- 加强市场分析，了解消费者意愿和消费者差异；\n- 增加套利的难度，减少套利的价值（服务、担保、区分、交易费用、协议、纵向一体化等）\n\
    \n## 价格歧视的分类\n\n- 一级价格歧视（完全价格歧视）\n  - 是指垄断者完全了解每个消费者的支付意愿，并对每位消费者收取不同价格的情况。\n\
    \  - 一级价格歧视要求垄断企业能够区分不同消费者对产品价值的预期或保留价格，从而向产品价值预期高的消费者卖高价，低的卖低价。\n- 二级价格歧视（如，两部定价）\n\
    \  - 对给定的消费者，依据其购买量的多少来确定价格。\n- 三级价格歧视（市场分割）\n  - 进行市场分割，对不同团体的顾客收取不同的价格。\n\n\
