    ## 2019 年中国的GDP和其组成部分


    支出法的2019年： 国内生产总值GDP（99.5万亿元）=最终消费支出（55.1万亿，55.4%）+资本形成总额（42.9万亿，43%）+货物和服务净出口（1.48万亿，1.5%，其中出口18.52万亿，进口17.04万亿）


    ![](img/518b44ff56ad05e168220626515b534d_1172_0.png)


    ## 讨论


    ## GDP及其组成部分


    在下面的各种情形下，计算GDP及它受影响的组成部分的变化量


    - A. Debbie在波士顿最好的饭店花了$200请他丈夫吃晚饭

    - B. Sarah为了出版业务的需要，在美国花$1800买了一台新笔记本。这台笔记本是在中国制造的

    - C. Jane为了她编辑业务的需要花了$1200购买一台新电脑，这台电脑是由本地的制造商在去年生产的

    - D. 通用汽车公司生产了价值5亿美元的汽车，但消费者只购买了价值4.7亿美元的汽车


    ## 讨论

    参考答案


    - A. Debbie在波士顿最好的饭店花了$200请他丈夫吃晚饭


    消费和 GDP 都增加了 200 美元


    - B. Sarah为了出版业务的需要，花$1800买了一台新笔记本。这台笔记本是在中国制造的


    消费增加1800美元，净出口减少1800美元，GDP 不变


    ## 讨论

    参考答案


    C. Jane为了她编辑业务的需要花了$1200购买一台新电脑，这台电脑是由本地的制造商在去年生产的


    当前的GDP不变,投资减少，消费增加，因为电脑是在去年生产出来的


    D. 通用汽车公司生产了价值5亿美元的汽车，但消费者只购买了价值4.7亿美元的汽车


    消费增加4.7亿美元，存货投资增加0.3亿，GDP 增加5亿美元


    ## 名义GDP和实际GDP


    通货膨胀会扭曲像GDP这样的经济变量，因此我们有两种类型的GDP：


    一种是经过通货膨胀校正，另一种则没有校正


    - ▪ 名义GDP——按**现期**价格计算的物品与劳务产出的价值。

    - ▪ 实际GDP——按不变的**基年**价格计算的物品与劳务产出的价值。

    - ▪ 名义GDP按报告期的实际价格乘上实际产出（P₁Q₁）计算。

    - ▪ 实际GDP则按基期的价格乘上报告期的产量（P₀Q₁）计算。反映产量的变动，而不反映价格的变动。


    ## 例：


    |  | Pizza |  | 拿铁咖啡 |  |

    |---|---|---|---|---|

    | 年份 | *P* | *Q* | *P* | *Q* |

    | 2018 | $10 | 400 | $2.00 | 1000 |

    | 2019 | $11 | 500 | $2.50 | 1100 |

    | 2020 | $12 | 600 | $3.00 | 1200 |


    计算每年的名义GDP：


    增加：__


    2018: $10 x 400 + $2 x 1000 = $6,000


    2019: $11 x 500 + $2.50 x 1100 = $8,250


    2020: $12 x 600 + $3 x 1200 = $10,800


    37.5%


    30.9%


    例：


    | 年份 | Pizza: $P$ | Pizza: $Q$ | 拿铁咖啡: $P$ | 拿铁咖啡: $Q$ |

    |---|---:|---:|---:|---:|

    | 2018 | $10 | 400 | $2.00 | 1000 |

    | 2019 | $11 | 500 | $2.50 | 1100 |

    | 2020 | $12 | 600 | $3.00 | 1200 |


    计算每年的真实GDP，


    以2018年作为基年：


    2018：$10 x 400 + $2 x 1000 = $6,000


    2019：$10 x 500 + $2 x 1100 = $7,200


    2020：$10 x 600 + $2 x 1200 = $8,400


    增加：


    20.0%


    16.7%


    ## 例：


    | 年份 | 名义 GDP | 真实 GDP |

    |---|---|---|

    | 2018 | $6000 | $6000 |

    | 2019 | $8250 | $7200 |

    | 2020 | $10,800 | $8400 |


    - - 名义GDP是用当期价格来衡量

    - - 真实GDP是用不变的基年价格来衡量（本例中以2018年作为基年）


    ## 例：


    | 年份 | 名义 GDP |  | 真实 GDP |  |

    |---|---|---|---|---|

    | 2018 | $6000 | 37.5% | $6000 | 20.0% |

    | 2019 | $8250 | 30.9% | $7200 | 16.7% |

    | 2020 | $10,800 |  | $8400 |  |


    - - 名义GDP的变化反映了价格与产量的变化

    - - 真实GDP的变化是价格不变时（就是零通货膨胀条件），GDP数量的变化


    因此，真实 GDP经过通货膨胀校正


