    # 重商主义：15世纪-17世纪中期


    +   - 代表及著作：蒙克莱田

    +     - 《献给国王和王太后的政治经济学》

    +   - 利益代表：商业资本家（后来的工场主）

    +   - 观点：

    +     - 金银是财富的唯一形态

    +     - 财富来自对外贸易

    +     - 研究重点：贸易流通'
