  mdcn: "\n\n# 人们如何做出决策\n\n## 原理四：人们会对激励做出反应\n\n- **激励：** 引起一个人做出某种行为的某种东西，诸如惩罚或奖励的预期\n\
    - 理性人会对激励做出反应\n  例如：\n  - 当汽油价格上涨时，消费者会更多的购买混合动力汽车，更少购买耗油的越野车\n  - 当烟草税上升时，青少年吸烟人数会下降\n\
    \n- 边际成本和边际利益的变化会激励人们作出反应。\n- 理性决策者会作出边际利益大于边际成本的决策，并采取行动。\n\n## 原理的应用\n例 2\n\n\
    你准备出售一款1996年的福田野马，并且已经在这辆车的维修上面花了$1000。然而，车的变速器坏了，你能够选择再花$600将车修好，或者就此售出\n\n在下面的情形中，你应该把变速器修好吗？并解释\n\
    \n- A. 如果变速器正常，汽车价值是$6500。如果不正常，则是$5700\n- B. 如果变速器正常，汽车价值是$6000。如果不正常，则是$5500\n\
    \n修理变速器的成本= $600\n\nA. 如果变速器正常，汽车价值是$6500。如果不正常，则是$5700\n\n修理变速器的收益= $800\n($6500\
    \ – 5700)\n因此，修理变速器是值得的\n\nB. 如果变速器正常，汽车价值是$6000。如果不正常，则是$5500\n\n修理变速器的收益仅仅为$500\n\
    因此花费$600修理变速器是不值得的\n\n思考：\n\n- 你最初花在维修上的 $1000 没有任何影响，重要的是边际修理（变速器）的收益与成本\n- 由A情形到B情形激励的改变导致你决策的改变\n\
    \n# 人们如何相互交易\n\n## 原理 5 : 贸易可以使每个人的状况都变得更好\n\n- 人们可以从与他人相互交易的能力中获益。\n- 竞争可以使人们从贸易中获益。\n\
