    最优\n\nB\n\nA\n\nI₁\n\nI₂\n\nI₃\n\n- 最优购买行为条件：\n- 商品组合必须能带来最大效用\n- 最优支出位于给定预算线上。\n\
    \n把钱花光，买到商品的最大数量\n追求最大的满足\n\n![](img/518b44ff56ad05e168220626515b534d_1076_0.png)\n\
    \n## 最优化：消费者选择什么\n\nA是最优点：预算约束线上位于最高无差异曲线上的一点\n\n小马偏好B胜过A，但他买不起B\n\n小马买得起C和D，但A在更高的无差异曲线上\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1077_0.png)\n\n最优点是小马负担得起的所有消费束中最偏好的消费束\n\
    \n## 最优化：消费者选择什么\n\n在最优点，无差异曲线的斜率等于预算约束线的斜率\n\nMRS = P_F / P_M\n\n鱼的边际价值（用芒果来衡量）\n\
    \n鱼的价格（用芒果来衡量）\n\n消费者优化是“考虑边际量”的另一个例子\n\n![](img/518b44ff56ad05e168220626515b534d_1078_0.png)\n\
    \n## 收入增加\n\n百事可乐数量\n\n新预算约束线\n\n1. 收入增加使预算约束线向外移动...\n\n新最优点\n\n原来最优点\n\nI₂\n\
    \n3. ...百事可乐的消费。\n\n原来的预算约束线\n\nI₁\n\n0\n\n比萨饼数量\n\n2. ....增加了比萨饼的消费...\n\n##\
