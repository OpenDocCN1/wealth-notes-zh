  - "[PAGE 1516]\n\n# 参考答案\n\n已知：**Y** = 800，**V** 不变，  \n　　　**M** = $2000，**P** =\
    \ $5，2008年  \n2009年，美联储货币供给增加5%，增加到2100美元\n\n+   **a.** 计算2009年的名义GDP和P，并计算从2008年到2009年的通货膨胀率\n\
    \n名义 GDP = **P** × **Y** = **M** × **V**（数量方程式）  \n　　　　　　　= $2100 × 2 = **$4200**\n\
