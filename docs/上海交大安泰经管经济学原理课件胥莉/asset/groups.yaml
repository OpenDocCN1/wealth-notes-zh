    \n### 人力资本\n\n- **人力资本：** 对人的投资的积累，如教育和在职培训\n- 人力资本影响生产率，进而影响劳动需求和工资\n\n### 日益增加的技能价值\n\
    \n![](img/518b44ff56ad05e168220626515b534d_963_0.png)\n\n最近几十年，接受过大学教育和没有接受过大学教育的工人之间的收入差距一直在扩大\n\
    \n**表19-1 不同受教育程度的人的平均年收入**\n\n|  | 1975 年 | 2011 年 |\n|---|---|---|\n| 男性 高中,\
    \ 未上大学 | 48 720 美元 | 46 038 美元 |\n| 大学毕业生 | 69 146 美元 | 80 508 美元 |\n| 大学毕业生高出的百分比\
    \ | +42% | +75% |\n| 女性 高中, 未上大学 | 28 066 美元 | 32 249 美元 |\n| 大学毕业生 | 37 804 美元\
    \ | 58 299 美元 |\n| 大学毕业生高出的百分比 | +35% | +81% |\n\n注：收入数据根据通货膨胀进行了调整，并用 2011 年的美元表示。数据适用于\
    \ 18 岁及以上的全职工人。大学毕业生的数据不包括有大学以上教育经历的工人，例如有硕士或博士学位的人。\n\n资料来源：U.S. Census Bureau\
    \ 以及作者的计算。\n\n两个假说：\n\n1. 国际贸易：国际贸易使国内熟练劳动生产的物品的出口增加，国内不熟练劳动生产的物品的进口增加。\n2. 技术变革引起的技能偏向：新技术增加了对熟练工人的需求，减少了对不熟练工人的需求。\n\
    \n很难说哪种假说能更好地解释不断扩大的收入差距；可能两者都是重要的。\n\n### 问题\n\n如果你面临如下选择：\n\n- A. 花四年的时间在世界上最好的大学学习，但却不能让别人知道你曾在那里学习过\n\
    - B. 从世界上最好的大学那里得到一个正式学位，但实际上却从来没有在那里学习过\n\n你认为哪一个更能提高你的未来收入？\n\n### 教育的信号理论\n\
    \n教育的另一种观点：\n\n- 企业把教育状况作为区分高能力工人与低能力工人的一种方法\n- 获得大学学位的困难向未来雇主表明毕业生是高能力的\n- 然而，教育本身对生产率或技能并没有影响\n\
    - 政策含义：增加受教育程度一般不会影响到工资\n\n### 高于均衡的工资的原因\n\n1. 最低工资法\n\n   最低工资会高于最不熟练而又最无经验的工人的工资\n\
    \n2. 工会\n\n   工会：与雇主谈判工资和工作条件的工人协会\n\n   工会可以利用它们的市场势力来获得更高的工资；大多数工会工人比类似的非工会工人赚的钱高出10-20%\n\
    \n3. 效率工资\n\n   效率工资：企业为了提高工人的生产率而支付的高于均衡工资的工资\n\n   企业可能为了减少工人的流动性，提高工人的努力程度，或者提高申请企业工作的工人素质而支付更高的工资\n\
    \n### 解释工资差别\n\n在每个例子中，比较哪个工人的收入更高并解释为什么\n\n- A. 地球上最好的物理理论家，还是地球上最好的作家\n- B.\
