    - 美元升值

    - 美国出口物品相对于外国人而言变得更贵，而美国居民觉得进口的物品变得更便宜


    结果：净出口减少


    ## 总需求曲线的斜率：总结


    物价水平的上升减少物品与劳务的需求量，因为：


    - **财富效应**（消费减少）

    - **利率效应**（投资减少）

    - **汇率效应**（净出口减少）


    ![](img/518b44ff56ad05e168220626515b534d_1684_0.png)


    ## 总需求曲线的移动


    - 移动起因于

    - 消费

    - 投资

    - 政府购买

    - 净出口

    - 消费、投资、政府购买和净出口等的增加，都会在同样的价格水平上，引起社会支出的增加，总需求曲线向右移动，反之则向左移动。


    ## 为什么总需求曲线会移动


    任何改变消费，投资，政府购买或净出口的事件—除物价水平的变动—都会移动总需求曲线


    例如：股市繁荣使家庭觉得更富有，消费增加，总需求曲线向右移动


    ![](img/518b44ff56ad05e168220626515b534d_1686_0.png)


    ## 为什么总需求曲线会移动


    - 消费变动引起的移动

    - 股市繁荣/大跌

    - 偏好变化：消费与储蓄之间的权衡取舍

    - 增税/减税

    - 投资变动引起的移动

    - 企业购买新计算机，设备和建造新工厂

    - 乐观预期/悲观预期

    - 利率，货币政策

    - 投资税收优惠或其他税收激励


    ## 为什么总需求曲线会移动


    - 政府购买变动引起的移动

    - 联邦政府的支出，如国防开支

    - 州和地方政府支出，如公路、学校

    - 净出口变动引起的移动

    - 购买我们出口产品的国家经济的繁荣/衰退

    - 外汇市场上国际投机者引起货币升值/贬值


    ## 讨论


    ## 总需求曲线


    在下列各种情形中，总需求曲线会发生什么变动？


    - A. 一个十年期的投资税收优惠到期

    - B. 美元汇率下降

    - C. 物价水平的下降增加了消费者财富的真实价值

    - D. 州政府对利息，红利和资本收益征收新税以取代销售税


    ## 讨论

    参考答案


    - A. 一个十年期的投资税收优惠到期

    - 投资减少，总需求曲线向左移动

    - B. 美元汇率下降

    - 净出口增加，总需求曲线向右移动

    - C. 物价水平的下降增加了消费者财富的真实价值

    - 沿总需求曲线移动（财富效应）

    - D. 州政府对利息、红利和资本收益征收新税以取代销售税

    - 消费增加，总需求曲线向右移动


    ## 总供给曲线


    - 在长期中，总供给曲线是垂直的。

    - 在短期中，总供给曲线是向右上方倾斜的。


    ## 总供给（AS）曲线


    **总供给曲线**告诉我们在任何一种既定的物价水平时企业生产并销售的物品与劳务总量


    总供给曲线：


    - 在短期内向右上方倾斜

    - 在长期中垂直


    ![](img/518b44ff56ad05e168220626515b534d_1692_0.png)


    ## 总供给曲线


    - 长期总供给曲线

    - 在长期中，一个经济的物品与劳务供给取决于它的资本、劳动和自然资源的供给，以及用来把资本与劳动变为物品与劳务的生产技术。

    - 在长期中，物价水平并不影响这些变量。


    ## 总供给曲线


    - 长期总供给曲线

    - 长期总供给曲线是在自然产量率时的一条垂线。

    - 这一产量水平也被称为潜在产量或充分就业产量。

    - 经济中任何改变自然产量率的变动都会使长期总供给曲线移动。

    - 可以根据古典模型中影响产量的各种因素把这些移动进行归类。


    ## 长期总供给曲线（LRAS）


    **自然产量率（Yₙ）：**

    一个经济在长期中当失业处于其正常率时达到的物品与劳务的生产


    自然产量率也称为**潜在产量**或**充分就业产量**


    ![](img/518b44ff56ad05e168220626515b534d_1696_0.png)


    ## 为什么长期总供给曲线是垂直的


    自然产量率取决于经济中劳动，资本和自然资源的存量以及技术水平。


    物价水平上升并不影响它们之中的任何一项，因此也不会影响自然产量率。


    （古典二分法）


    ![](img/518b44ff56ad05e168220626515b534d_1697_0.png)


    ## 为什么长期总供给曲线会移动


    任何改变决定自然产量率因素的事件都会使长期总供给曲线移动。


    例如：移民使工人数量增多，因而自然产量率也会增加。


    ![](img/518b44ff56ad05e168220626515b534d_1698_0.png)


    ## 长期总供给曲线的移动


    - 移动起因于

    - 劳动

    - 资本

    - 自然资源

    - 技术知识


    ## 为什么长期总供给曲线会移动


    - 劳动或自然失业率变动引起的移动

    - 移民

    - 生于婴儿潮时期的人的退休

    - 政府降低自然失业率的政策

    - 物质资本或人力资本变动引起的移动

    - 工厂，设备投资

    - 更多人获得大学文凭

    - 飓风损坏工厂


    ## 为什么长期总供给曲线会移动


    - 自然资源变动引起的移动

    - 新矿藏资源的发现

    - 进口石油供给的减少

    - 影响农业生产的气候模式变化

    - 技术知识变动引起的移动

    - 技术进步提高生产率


    ## 用总需求与总供给来描述长期增长与通货膨胀


    在长期中，技术进步使长期总供给曲线向右移动


    货币供给增加使总需求曲线向右移动


    结果：产量增长和持续的通货膨胀


    ![](img/518b44ff56ad05e168220626515b534d_1702_0.png)


