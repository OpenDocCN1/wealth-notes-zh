    # 预算赤字与投资激励


    +   - 对投资的税收激励和预算赤字有类似的效果：

    +     - *r* 上升，*NCO* 减少

    +     - *E* 上升，*NX* 下降

    +   - 但有一个重要的不同：

    +     - 投资的税收激励增加投资，并提高了长期生产率和生活水平

    +     - 预算赤字减少投资，降低了生产率和生活水平'
  - '[PAGE 1623]


    # 贸易政策


    +   - 贸易政策：

    +     直接影响一国进口或出口的物品与劳务数量的政府政策

    +   - 例如：

    +     - 关税 — 对进口物品征收的税

    +     - 进口配额 — 对进口物品数量的限制

    +     - “自愿出口配额” — 由于外国政府压力而使一个国家限制它的出口，本质和进口配额相同'
  - '[PAGE 1624]


    # 贸易政策


    +   - 限制进口政策的一般原因：

    +     - 挽救国内缺乏竞争力行业的工作机会

