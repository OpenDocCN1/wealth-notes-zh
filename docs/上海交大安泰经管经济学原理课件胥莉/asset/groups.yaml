    - 什么是生产者剩余？它与供给曲线有什么联系？\n- 市场能使资源达到合意的配置吗？还是市场结果有改善的余地？\n\n### 回顾市场均衡\n\n- 市场均衡价格和数量能否使买者和卖者的总利益最大化？\n\
    - 市场均衡反映了市场配置稀缺资源的方式。\n- 市场配置资源是否合意可以根据福利经济学理论判定。\n\n### 福利经济学\n\n- 资源配置涉及下述问题：\n\
    \  - 每种物品分别生产多少？\n  - 谁生产它们？\n  - 谁消费它们？\n- 福利经济学——研究资源配置如何影响经济福利。\n- 买者和卖者可以从参与市场活动中获得利益。\n\
    - 市场均衡可以使买者和卖者的总利益最大化。\n\n### 福利经济学\n\n- 消费者剩余从消费者角度衡量经济福利。\n- 生产者剩余从生产者角度衡量经济福利。\n\
    \n### 效用\n\n效用U（Utility）：消费者从商品消费中得到的满足程度。\n\n消费者需求某种商品的目的是为了得到满足。\n\n- 完全是消费者的一种主观心理感受。\n\
    - 满足程度高，效用大；\n- 满足程度低，效用小。\n\n萨缪尔森提出：幸福 = 效用 / 欲望\n\n使幸福增加的有效方法是：\n1. 欲望不变而提高效用；\n\
    2. 清心寡欲\n\n消费者剩余：消费者消费某种商品所获得的总效用与为此花费的货币总效用的差额。\n\n### 消费者剩余\n\n- 支付意愿——买者为某种物品愿意和能够支付的最高价格。它衡量买者对物品的评价是多少。\n\
