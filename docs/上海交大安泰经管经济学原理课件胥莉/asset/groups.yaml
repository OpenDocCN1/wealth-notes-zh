  mdcn: "\n\n# 劳动的边际产量(MPL)\n\n- **劳动的边际产量：** 增加的一单位劳动所引起的产量增加量\n\n$$MPL = \\frac{\\\
    Delta Q}{\\Delta L}$$\n\n其中：\n\nΔQ = 产出变动量\n\nΔL = 劳动变动量\n\n# 边际产量值\n\n- **问题：**\n\
    \  - 雇佣额外一个工人的成本（工资）是用美元来衡量的\n  - 雇佣额外一个工人的收益（MPL）是用产出单位来衡量的\n\n- 解决方法：把 *MPL*\
    \ 转化为美元\n\n- **边际产量值：**一种投入的边际产量乘以该产品的价格\n\n$VMPL = 劳动的边际产量$\n$= P \\times MPL$\n\
    \n# 讨论\n计算MPL 与 VMPL\n\n*P* = $5/蒲式耳\n计算 *MPL* 与 *VMPL*，并将它们填入表中\n\n然后作出VMPL曲线，将VMPL画在纵轴，L画在横轴\n\
    \n| L<br>(工人的数量) | Q<br>(小麦/蒲式耳) | MPL | VMPL |\n|---|---|---|---|\n| 0 | 0 |\
    \  |  |\n| 1 | 1000 |  |  |\n| 2 | 1800 |  |  |\n| 3 | 2400 |  |  |\n| 4 | 2800\
    \ |  |  |\n| 5 | 3000 |  |  |\n\n# 讨论\n参考答案\n\nJack 的生产函数表现出边际产量递减的特征：*MPL* 随着劳动的增加而减少\n\
    这个特征很常见\n\n| L<br>(工人的数量) | Q<br>(小麦/蒲式耳) | MPL = ΔQ/ΔL | VMPL = P x MPL |\n|---|---|---|---|\n\
    | 0 | 0 |  |  |\n| 1 | 1000 | 1000 | $5,000 |\n| 2 | 1800 | 800 | 4,000 |\n| 3\
    \ | 2400 | 600 | 3,000 |\n| 4 | 2800 | 400 | 2,000 |\n| 5 | 3000 | 200 | 1,000\
    \ |\n\n# 讨论\n\n# 参考答案\n\nJack的 VMPL 曲线是向右下方倾斜的，这是因为边际产量递减\n\n# VMPL 曲线\n\n![](img/518b44ff56ad05e168220626515b534d_928_0.png)\n\
    \n# Jack 的劳动需求\n\n如果工资为\nW = $2500/每周\nJack应该雇佣多少工人？\n答案： L = 3\n\n在大于3的工人数量，减少雇佣工人会增加利润\n\
    \n在小于3的工人数量，多雇佣一个工人会增加利润\n\n# VMPL 曲线\n\n![](img/518b44ff56ad05e168220626515b534d_929_0.png)\n\
    \nL (工人的数量)\n\n# VMPL 与劳动需求\n\n对任何一个竞争，\n利润最大化企业：\n\n- 为了最大化利润，企业会雇佣工人直到 VMPL\
    \ = W\n- VMPL 曲线是劳动的需求曲线\n\n![](img/518b44ff56ad05e168220626515b534d_930_0.png)\n\
    \n# 劳动需求的移动\n\n劳动需求曲线\n= VMPL 曲线\n\nVMPL = P x MPL\n\n提高价格或工人劳动的边际产量都会增加劳动的边际产量值，并使劳动需求曲线向上移动\n\
    \n![](img/518b44ff56ad05e168220626515b534d_931_0.png)\n\n# 使劳动需求曲线移动的因素\n\n- 产品价格的变动，\
    \ *P*\n- 技术变革 (影响 *MPL*)\n- 其他要素的供给 (影响 *MPL*)\n  - 例如：\n    如果企业有更多的设备（资本），工人生产率会提高；*MPL*\
    \ 和 *VMPL* 增加，劳动需求曲线向上移动\n\n# 投入需求与产量供给之间的联系\n\n- 复习： 边际成本(MC)\n  = 生产额外一单位产量的成本\n\
    \  = ΔTC/ΔQ，其中 TC = 总成本\n- 如果 W = $2500， MPL = 500 蒲式耳\n- 如果 Jack 多雇佣一个工人，\n \
    \ ΔTC = $2500， ΔQ = 500 蒲式耳\n  MC = $2500/500 = $5 蒲式耳\n- 也就是： MC = W/MPL\n\n\
    # 投入需求与产量供给之间的联系\n\n- 因此： MC = W/MPL\n- 注意：\n  - 为生产额外的产量，需要雇佣更多的劳动\n  - 随着 L\
    \ 的增加， MPL 下降...\n  - W/MPL 会增加...\n  - 也会使 MC 上升\n- 因此，边际产量递减与边际成本递增是同一枚硬币的两面\n\
    \n# 投入需求与产量供给之间的联系\n\n- 竞争企业劳动需求的规则：\n  $P \\times MPL = W$\n- 两边都除以 $MPL$：\n\
    \  $P = W/MPL$\n- 用 $MC = W/MPL$ 替换：\n  $P = MC$\n- 这是竞争企业产量供给的规则\n- 因此，投入需求与产量供给是同一枚硬币的两面\n\
    \n# 劳动供给\n\n- 工作与闲暇的权衡取舍：\n  你在工作上花的时间越多，你享受闲暇的时间便越少\n\n- 闲暇的机会成本是工资\n\n# 劳动供给曲线\n\
    \n工资的增加也是闲暇机会成本的增加\n\n人们对此的反应：少享受闲暇，多工作\n\n![](img/518b44ff56ad05e168220626515b534d_937_0.png)\n\
    \n# 使劳动力供给曲线移动的因素\n\n- 嗜好的变动或者对劳动-闲暇权衡替代的态度发生变化\n- 其他劳动力市场上工人的机会\n- 移民\n\n# 劳动市场均衡\n\
    \n工资调整使劳动的供求平衡\n\n工资等于劳动的边际产量值\n\n![](img/518b44ff56ad05e168220626515b534d_939_0.png)\n\
    \n# 讨论\n\n# 劳动市场均衡的变动\n\n利用汽车工人市场（国内）来图解分析下面各种情形对工资和就业的影响\n\n- A. 汽车行业中婴儿潮的那一代工人退休\n\
    - B. 汽车消费者对进口汽车的偏好增加\n- C. 技术进步提高了汽车生产行业的生产率\n\n# 讨论\n\n# 参考答案：B\n\n对美国生产的汽车的需求减少使价格\
    \ $P$ 下降\n\n在每一个 $L$，$VMPL$ 下降\n\n劳动需求曲线向下移动\n\n$W$ 和 $L$ 都减少\n\n![](img/518b44ff56ad05e168220626515b534d_942_0.png)\n\
