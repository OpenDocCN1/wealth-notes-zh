    \n芒果的数量\n\n鱼的数量\n\n小马的一条无差异曲线\n\n![](img/518b44ff56ad05e168220626515b534d_1063_0.png)\n\
    \n## 无差异曲线相交的不可能性\n\n![](img/518b44ff56ad05e168220626515b534d_1065_0.png)\n\n\
    ## 无差异曲线的四个特征\n\n- **无差异曲线不相交**\n- 如果相交\n- 由于消费束B的两种物品的数量都大于消费束C的两种物品的数量，相对于C，小马会更偏好B。然而，小马却是在B与C之间无差异：\n\
