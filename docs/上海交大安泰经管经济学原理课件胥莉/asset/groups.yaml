  - '[PAGE 13]


    # 经济学产生的原因与现实


    +   - 人类欲望的 **无限性**

    +   - 满足人类需求的产品和资源 **稀缺性**

    +   - 由此而产生选择


    **经济学**——研究社会如何管理自己的稀缺资源的学科。'
  - '[PAGE 14]


    # 经济学是一门社会科学


    +   - 经济学是一门有趣、有用的社会科学。

    +   - 它的主题是社会的——人们的选择如何引导他们的生活，以及他们如何相互影响

    +   - 它以科学的态度来研究这个主题'
  - '[PAGE 15]


    # # Fields in Economics 经济学的领域


    +   - 微观经济学Micro

    +   - 宏观经济学Macro

    +   - 计量经济学Econometrics

    +   - 金融学Finance

    +   - 产业组织Industrial Organization

    +   - 劳动经济学Labor

    +   - 公共财政Public Finance


    +   - 国际经济学International

    +   - 发展经济学Development

    +   - 比较经济学Comparative

    +   - 法和经济学Law and Economics

    +   - 政治经济学Political economy

    +   - 经济史Economic History'
  - '[PAGE 16]


    # 金融学是经济学的一部分


    +   - 什么是金融学(Finance)

    +     - 宏观金融

    +       - 货币经济学/货币银行(monetary economics/money and banking)

    +       - 开放经济的宏观经济学/国际金融(open economy macroeconomics/international finance)

    +     - 微观金融

    +       - 公司金融/公司财务(corporate finance)

    +       - 资产定价(asset pricing)'
  - '[PAGE 17]


    # 经济学与管理学关系密切


    +   - 会计学：前沿研究领域深受信息经济学的影响

    +   - 管理信息系统：网上拍卖运用博弈论、信息产品定价运用价格理论

    +   - 市场营销学：定价策略得益于信息经济学和博弈论

    +   - 人力资源管理学：大量运用组织经济学和激励理论的分析方法

    +   - 公司战略：延伸产业组织理论'
  - '[PAGE 18]


    # 经济学研究什么问题


    +   - **稀缺性**: 社会资源的有限性

    +   - **经济学**: 研究社会如何管理自己的稀缺资源,

    +   - 从而研究

    +     - 人们的经济行为（人们如何做决策）

    +     - 社会的经济现象（人们决策的相互作用）

    +   - 比如:

    +     - 人们决定购买什么, 工作多长时间，储蓄多少，消费多少

    +     - 企业决定生产多少，雇佣多少工人

    +     - 社会决定如何在国防，消费物品，环境保护和其他需求之间分配资源'
  - '[PAGE 19]


    # 为什么学习经济学


    +   - 经济学有助于你了解你生活的世界。

    +   - 经济学使你更精明地参与经济活动。

    +   - 经济学使你更好地理解经济政策的潜力与局限性'
  - '[PAGE 20]


    # # 学习经济学的三个层次


    +   - 初级经济学

    +     - 经济学原理

    +   - 中级经济学：

    +     - 中级微观经济学

    +     - 中级宏观经济学

    +   - 高级经济学

    +     - 高级微观经济学

    +     - 高级宏观经济学'
  - '[PAGE 21]


    # 经济学三个层次的特点


    +   - 经济学原理：

    +     - **图和表**（没有公式）

    +     - 入门课

    +   - 中级经济学：

    +     - 用一些数学和概率统计

    +     - 较为严格的数学推理

    +     - 较为系统的经验实证分析

    +   - 高级经济学：

    +     - 用很多数学

    +     - 前沿的学术研究'
  - '[PAGE 22]


    # # 经济学原理的课程目的


    +   - 体会现代经济学的基本思想、概念与分析方法

    +   - 培养对现实世界经济行为与经济现象的观察能力

    +   - 训练经济学直觉'
