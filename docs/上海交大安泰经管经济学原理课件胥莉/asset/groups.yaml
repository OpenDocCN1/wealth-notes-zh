    # 世界价格和比较优势


    +   - $P_W$ = 物品的世界价格，

    +     一种物品在世界上所通行的价格

    +   - $P_D$ = 没有贸易时的国内价格

    +   - 如果 $P_D < P_W$，

    +     - 该国在这种物品上有比较优势

    +     - 在自由贸易条件下，该国将会出口这种物品

    +   - 如果 $P_D > P_W$，

    +     - 该国在这种物品上没有比较优势

    +     - 在自由贸易条件下，该国将会进口这种物品'
  - '[PAGE 458]


    # 小型经济假设


    +   - 小型经济是世界市场的 **价格接受者**：它对市场价格没有影响

    +   - 并不总是如此，尤其对于美国。但这可以简化分析，其基本结论也不会改变

    +   - 当小型经济参与自由贸易时，世界价格 $P_W$ 是唯一的相关价格：

    +     - 没有一个卖者会接受低于世界价格的价格，因为他可以在世界市场上以世界价格卖出物品

    +     - 没有一个买者会支付高于世界价格的价格，因为他可以在世界市场上以世界价格买进物品'
