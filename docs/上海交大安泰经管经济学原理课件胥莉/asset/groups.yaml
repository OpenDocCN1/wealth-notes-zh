  - '[PAGE 45]


    # 人们如何做出决策


    # 原则一：人们面临权衡取舍


    +   - 社会面临一种重要的权衡取舍：

    +     **效率 vs. 平等**


    +   - **效率**：社会能从某稀缺资源中得到的最大利益


    +   - **平等**：经济成果在社会成员中平均分配


    +   - 权衡取舍：为使社会更加平等，需要在富人与穷人之间重新分配收入。但这会减少工作与生产的激励，并缩小经济“蛋糕”的规模'
