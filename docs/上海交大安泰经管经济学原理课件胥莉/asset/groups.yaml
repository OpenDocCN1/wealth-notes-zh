    # 练习3


    完全竞争市场中某厂商的成本函数为STC=Q³-6Q²+30Q+40，产品价格P=66美元。试求：


    +   （1）利润最大时的产量和利润。

    +   （2）若价格降为P=30美元，厂商是否亏损？如果亏损，最小亏损额是多少？

    +   （3）厂商在什么情况下才会停止生产？'
  - '[PAGE 822]


    +   - 在完全竞争市场：利润最大时MR=MC=P

    +     MC=3Q²-12Q+30, MR=P=66 解得Q=6那么利润=TR-STC=PQ-STC(6)=176.2.

    +   - 当价格是30时， MC = P MC = 3Q² - 12Q +30 得 Q* =4 ， 最小亏损额=-8

