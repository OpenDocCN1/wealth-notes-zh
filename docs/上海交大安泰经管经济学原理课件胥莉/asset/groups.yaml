    # 运用政策来稳定经济


    +   - 自从1946年的“就业法案”以来，经济稳定一直是美国政策公开的目标。

    +   - 经济学家对政府在稳定经济上所扮演的角色存在争议

    +   - 支持积极的稳定政策

    +     - 就业法案有两种含义:

    +       - 政府应该避免成为经济波动的原因

    +       - 政府应该对私人经济中的变动作出反应以便稳定总需求。'
  - '[PAGE 1789]


    # 支持积极稳定政策论


    +   - 凯恩斯：“动物本能” 使家庭和企业产生悲观主义与乐观主义，从而使总需求移动和产出与就业的波动

    +   - 其他因素也会引起波动，比如：

    +     - 外国经济的繁荣与衰退

    +     - 股市的高涨与低迷

    +   - 如果政策制定者不作为，这些波动会影响企业，工人与消费者'
  - '[PAGE 1790]


    # 支持积极稳定政策论


