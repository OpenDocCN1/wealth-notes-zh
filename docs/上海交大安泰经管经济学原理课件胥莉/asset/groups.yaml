    - 如果贸易的赢家补偿输家，补偿之后赢家的状况仍然比之前更好\n- 然而，这种补偿很少发生\n- 输家常常集中在一个小团体，我们能经常听到他们的声音。而收益则由许多人共享，单个人的收益很小，甚至根本看不到贸易有什么收益\n\
    - 因此，输家更有激励去组织和游说对贸易添加限制\n\n### 关税：限制贸易的一个例子\n\n- **关税：** 对进口物品征收的税\n- 例：棉衬衫：$P_W\
    \ = \\$20$；关税：$T = \\$10$ / 每件；消费者必须为每件进口衬衫支付 $30$。因此，国内生产者可以对每件衬衫定价 $30$\n- 一般而言，国内买者与卖者都面临相同的价格\
    \ $P_W + T$\n\n### 对棉衬衫征收关税的分析\n\n**$P_W = \\$20$**\n\n自由贸易：买者需求80，卖者供给25，进口 =\
    \ 55。\n\n**$T = \\$10$ / 每件**\n\n价格上升到 $30$。买者需求70，卖者供给40，进口 = 30。\n\n![](img/518b44ff56ad05e168220626515b534d_467_0.png)\n\
    \n自由贸易：CS = A + B + C + D + E + F，PS = G，总剩余 = A + B + C + D + E + F + G。\n\n\
    关税：CS = A + B，PS = C + G，政府收入 = E，总剩余 = A + B + C + E + G。\n\n![](img/518b44ff56ad05e168220626515b534d_468_0.png)\n\
    \nD = 衬衫过度生产的无谓损失\nF = 衬衫消费不足的无谓损失\n\n![](img/518b44ff56ad05e168220626515b534d_469_0.png)\n\
    \n### 进口配额：限制贸易的另一个例子\n\n- **进口配额：** 对进口物品的数量限制\n- 进口配额和关税的作用很相似：\n  - 提高物品价格，减少进口物品的数量\n\
    \  - 降低买者的福利\n  - 增加卖者的福利\n- 关税为政府创造收入，而配额为进口物品的外国生产者创造利润，因为他们可以以一个更高的价格卖出物品\n\
    - 或者政府可以通过拍卖进口物品的许可证来使外国生产者的利润变为政府的收入，但通常政府并不这样做\n\n### 各种限制贸易的观点\n\n**1. 工作岗位论**\n\
    \n与其他国家进行贸易消灭了国内的一些工作岗位。\n\n**经济学家的回应：** 总体失业并不因为进口增加而上升，因为一些由于进口而损失的工作机会会被出口行业工作机会的增加来抵消。即使所有的物品都是国外生产更便宜，国内只需要在一种物品上有比较优势，有一个可行的出口行业，并从贸易中获益。\n\
    \n**2. 国家安全论**\n\n当一个行业受到来自其他国家的竞争威胁时，自由贸易的反对者往往会争辩说，该行业对国家安全是至关重要的，对防止战争期间进口物品的依赖是重要的。\n\
    \n**经济学家的回应：** 对于国家安全的合理考虑，保护关键行业可能是合理的。但生产者可能夸大了他们对于国家安全的重要程度，以此来获取与国外竞争者竞争时的保护政策。\n\
    \n**3. 幼稚产业论**\n\n新兴产业有时认为，应实行暂时性贸易限制，以有助于该行业的成长。等到这些行业成熟了，它们也就能与外国企业竞争了。\n\n\
    **经济学家的回应：** 政府难以决定哪个行业最终能与外国企业竞争，并且保护这些行业的收益是否真的大于消费者因贸易限制而遭受的损失。此外，如果一个企业能在长期中盈利，它就应该能够承受暂时的损失。\n\
    \n**4. 不公平竞争论**\n\n生产者认为其他国家的竞争者具有不公平的优势，比如政府补贴。\n\n**经济学家的回应：** 太棒了！这样我们就可以进口由其他国家纳税人补贴的便宜的产品。我们消费者的收益将超过生产者的损失。\n\
    \n**5. 作为讨价还价筹码的保护论**\n\n例如：美国政府可以威胁对法国葡萄酒进行进口限制，除非法国政府取消对美国牛肉的配额。\n\n**经济学家的回应：**\
    \ 假如法国政府拒绝，那么美国政府将只有两个坏的可能性：\n\n- A) 限制法国葡萄酒的进口，而这将减少美国的经济福利\n- B) 不限制法国葡萄酒的进口，而这将会减少美国政府的威信\n"
