    \  - 排他性：冰淇淋，鸡蛋灌饼，QQ音乐的周杰伦的最新单曲\n  - 非排他性：调频广播信号，国防\n- 一种物品具有消费中的**竞争性**是指一个人使用该物品将减少其他人对它的使用的特性。\n\
    \  - 竞争性：冰淇淋，鸡蛋灌饼\n  - 非竞争性：美团App（免费），QQ音乐里面的非付费周杰伦单曲\n\n## 物品的类型\n\n- **私人物品**\n\
    \  - 既有排他性又有竞争性。例如：食品\n- **公共物品**\n  - 既无排他性又无竞争性。例如：国防\n- **公共资源**\n  - 有竞争性但无排他性。例如：海洋中的鱼\n\
    - **俱乐部物品**\n  - 有排他性但无竞争性。例如：有线电视\n\n## 四种物品类型\n\n| 排他性 | 竞争性 是 | 竞争性 否 |\n|---|---|---|\n\
    | 是 | **私人物品**：冰激凌；衣服；拥挤的付费道路 | **俱乐部物品（自然垄断）**：有线电视；不拥挤的付费道路 |\n| 否 | **公共资源**：海洋中的鱼；环境；拥挤的不付费道路\
    \ | **公共物品**：国防；知识；不拥挤的不付费道路 |\n\n## 讨论\n\n### 道路的分类\n\n- 道路是这四种物品中的哪一类？\n- 提示：答案取决于道路是否拥挤，以及它是否收费。考虑不同的情形。\n\
    \n### 参考答案\n\n- 消费中的竞争性？仅当道路是拥挤的时候。\n- 排他性？仅当道路收费时。\n- 四种可能性：\n  - 不拥挤也不收费：公共物品\n\
    \  - 不拥挤但收费：俱乐部物品（自然垄断）\n  - 拥挤但不收费：公共资源\n  - 拥挤也收费：私人物品\n\n## 俱乐部物品\n\n- 对外排他性。俱乐部物品仅仅由其全体成员共同消费。\n\
    - 非竞争性。单个会员对俱乐部物品的消费不会影响或减少其他会员对同一商品的消费。\n  - S4 颛桥—剑川路高速公路（非高峰时段），兰香湖公园\n  -\
