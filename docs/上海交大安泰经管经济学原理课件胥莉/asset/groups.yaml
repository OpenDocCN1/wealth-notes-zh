    \n## 正外部性\n\n供给曲线和社会价值曲线的交点决定了社会最优产量水平。\n\n- 社会最优产量比市场均衡产量多。\n- 市场生产的量比社会所希望的量少。\n\
    - 物品的社会价值大于私人价值。\n\n## 正外部性\n\n- 外部性内在化：补贴\n  - 作为首选的办法将正外部性内在化。\n- 技术政策\n  -\
    \ 政府旨在促进产业技术进步的经济干预\n\n## 正外部性\n\n一个企业的创新或设计不仅给本企业带来效益，还会增加社会的 技术知识存量，给全社会带来效益，也就是说创新和设计存在着技术溢出效应，技术溢出效应是一种正外部性。\n\
    \n- 专利保护是一种技术政策。专利法通过给予发明者在一定时期内排他性地使用自己的发明而保护了发明者的权益。\n- 专利制度将外部性内在化\n\n## 外部性的私下解决方式\n\
    \n两种方法：\n\n- **命令与控制政策：** 直接管制\n  例如：\n  - 限制排放的污染数量\n  - 强制企业采取某种技术来减少排放量\n-\
    \ **以市场为基础的政策：** 向私人决策者提供由他们自己来解决问题的激励。\n  例如：\n  - 矫正性税收与补贴\n  - 可交易的污染许可证\n\n\
    ## 矫正性税收与补贴\n\n- **矫正税**：旨在引导私人决策者考虑负外部性引起的社会成本的税收\n- 这种税也被称为**庇古税**，它是以最早主张采用这种税收的经济学家阿瑟·庇古（Arthur\
    \ Pigou，1877-1959）的名字命名的\n- 理想的矫正税=外部成本\n- 对于有正外部性的活动，理想的矫正补贴=外部利益\n\n## 矫正性税收与补贴\n\
    \n- 其他税收与补贴会扭曲激励，并使经济远离社会最优数量\n- 矫正性税收与补贴\n  - 使私人激励与社会的利益结合在一起\n  - 使私人决策者做决策时考虑到他们行为的外部利益与外部成本\n\
    \  - 使经济向一个资源配置更有效率的方向移动\n\n"
