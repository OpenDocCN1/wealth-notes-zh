    # 银行与货币供给


    +   - 银行可以影响经济中的活期储蓄额和货币供给。

    +   - 100%准备金制度:银行吸收存款，并将其保持在帐户上，这就是准备金。如果商业银行将所有的资金都留在帐户上，这就不能发放贷款，帐户上的所有资金与公众的存款凭证完全相等。

    +   - 部分准备金制度: 商业银行留下一部份准备金，把其余的资金全部贷出，这就是余额准备金制度。在这种制度中，公众持有的存款凭证要大于商业银行帐户上的资金余额。在一个部分准备金银行系统中，银行把收到存款的一部分作为准备金，其余的贷出去。'
