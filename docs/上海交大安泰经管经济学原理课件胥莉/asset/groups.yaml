  md: "\n## 练习1\n- 1. 封闭经济下 I=S，因此 50-100r=400r，得到 r=10%。因此 S=I=40，NX=0。\n- 2. I=50-12=38，S=400×12%=48。由\
    \ S=I+NCO，得 NCO=10。由于 NCO=NX，NX=10。\n- 3. 预算赤字时政府资金供给减少，因此真实利率上升，投资减少，资本净流出减少。因此，在外汇市场上供给减少，导致真实汇率提高，净出口减少。\n\
    \n## 练习2\n- 假设一国的物价水平与货币需求的关系为 Q=200P，其中 P 表示物价水平，Q（亿美元）表示货币需求量。该国的银行的准备金率都是10%。\n\
    - **(a)** 假定一国2012年的货币供给是1000亿美元，名义GDP是1000亿美元，实际GDP为200亿美元。计算2012年的物价指数和货币流通速度。\n\
    - **(b)** 假设2013年该国央行购买了20亿美元的政府债券。这一行为在银行体系下最多会创造出多少货币？最少会创造出多少货币？\n\n## 练习2\n\
    - （1）物价指数P=名义GDP/真实GDP=5。或者1000=200P，得到P=5。货币流通速度V=名义GDP/货币供给=1。\n- （2）最多：20亿美元全部参与银行的货币创造，创造出新货币20×10=200。\n\
    - 最少：20亿美元不参与银行的货币创造，创造出新货币20。\n\n## 练习2\n- （3）货币供给最多为1200，带入Q=200P，得到P=6。此时，通货膨胀率为(6-5)/5=20%。\n\
    - 货币供给最少为1020，带入Q=200P，得到P=5.1。此时，通货膨胀率为(5.1-5)/5=2%。\n- （4）假设居民存款为100。2012年的真实利息为100×5%=5，税后利息为5×(1-20%)=4。税后真实利率为4/100=4%。\
    \ 2013年的名义利息为100×15%=15，税后名义利息为15×(1-20%)=12。税后名义利率为12/100=12%。税后真实利率为12%-10%=2。\n\
    \n## 本篇小结：\n- 净出口是指一国的商品和劳务出口减进口；因为每次交易都发生资产与商品的交换，所以资本的净流出总是等于其净出口。\n- 一国储蓄既用于国内投资，又用于购买国外资产，所以国民储蓄等于国内投资加资本净流出。\n\
    - 名义汇率是两国通货的名义价格，实际汇率是两国商品的相对价格。一国货币可以购买更多的外国货币时为升值；反之为贬值。\n\n## 本篇小结：\n- 按照购买力平价理论，一国货币在任何国家可以购买等量的商品，所以两种通货的名义汇率应该反映两国的物价水平。高通胀因此导致货币贬值。\n\
    - 利率调整可以使可贷资金供给等于可贷资金需求；汇率调整可以使美元供给（资本净流出）和美元需求（净出口）相等。因为资本净流出是可贷资金需求的一部分，而且为外汇市场提供了美元，所以它是联系着两个市场的变量。\n\
    \n## 本篇小结：\n- 外汇市场美元需求，导致美元升值，使得美国商品比国外更贵，从而抵消贸易限制对净出口的初始影响。\n- 政治不稳定会引起资本外逃，利率上升和通货贬值。\n\
    \n## 练习题\n1、假设某国2013年的名义GDP为16万亿元，流通中需要的货币量为4万亿元。2014年该国劳动生产率提高20%，货币流通速度下降20%。\n\
    （1）若商品价格水平不变，2014年流通中需要的货币量为多少万亿元？\n（2）根据第1题的结果，为了适应市场中货币量的变化，中央银行一般会采用哪几种工具，如何操作？\n\
    （3）假设法定存款准备金率为10%，央行购买了5000万元的国债，这一行为在银行体系中会创造多少货币？\n\n## 练习题\n解：（1）MV=PY， 4V=16,\
    \ 货币流通速度V=4\nM×4×0.8=16×1.2, M=6万亿元\n\n（2）新增加的2万亿元货币量，央行的操作手段：公开市场操作，向市场购买国债；降低存款准备金率；降低贴现率。\n\
    \n（3）0.5×10=5亿元\n\n## 练习题\n2、假设某经济体中只生产面包和食用油，\n2013年---2015年的产出和价格见下表：\n\n| \
    \ |  | 面包(元) | 食用油(元) |\n|---|---|---|---|\n| 2013(基年) | P1 | 30 | 100 |\n|  |\
    \ Q1 | 900 | 192 |\n| 2014年 | P2 | 31 | 102 |\n|  | Q2 | 1000 | 200 |\n| 2015年\
    \ | P3 | 36 | 100 |\n|  | Q3 | 1050 | 205 |\n\n1）2014年的名义GDP是：31×1000+102×200=51400\n\
    \n2014年的实际GDP是：30×1000+100×200=50000\n\nGDP平减指数为\n\n名义GDP / 实际GDP = 51400 / 50000\
    \ ×100 = 102.8\n\n（2）2015年的名义GDP是：36×1050+100×205=58300\n\n2015年的实际GDP是：30×1050+100×205=52000\n\
    \nGDP平减指数为\n\n名义GDP / 实际GDP = 58300 / 52000 ×100 = 112.1\n\n（3）2014年——2015年的通货膨胀率为：\n\
    \n112.1-102.8 / 102.8 = 9.04%\n\n因此2015年的实际利率为：0.96%\n\n（4）因为V=1, M×V = P×Y =\
    \ 58300 所以 M=58300 ； 新增的18300元货币量，央行的操作手段：公开市场操作，向市场购买国债； 降低存款准备金率； 降低贴现率。\n\n\
    ## 第十二篇 短期经济波动\n\n## 本篇主要内容\n- 第33章　总需求和总供给\n- 第34章　货币和财政政策对总需求的影响\n- 第35章　通货膨胀与失业之间的短期权衡取舍\n\
    \n## 第33章  总需求与总供给\n\n## 本章我们将探索这些问题的答案：\n- 什么是经济波动？它们的特点是什么？\n- 总需求与总供给模型如何解释经济波动？\n\
    - 为什么总需求曲线向右下方倾斜？什么使总需求曲线移动？\n- 短期总供给曲线的斜率是多少？长期的呢？什么使总供给曲线移动？\n\n## 介绍\n- 长期中，真实GDP平均每年增长3%左右\n\
    - 短期中，经济活动每年都有波动，GDP的增长围绕这个趋势波动：\n- 在大多数年份，物品与劳务的产量增加了。\n- 在过去的50年间，美国经济的产量平均每年增长3%左右。\n\
    - 在一些年份，并没有出现这种正常增长，导致衰退。\n  - 衰退：真实收入下降和失业增加的时期\n  - 萧条：严重的衰退\n- 短期的经济波动通常称为经济周期。\n\
    \n## 关于经济波动的三个事实\n- 经济波动是无规律的和无法预测的。经济中的波动通常被称为经济周期。\n- 大多数宏观经济变量同时波动。但是它们波动的大小并不相同。\n\
    - 随着产量减少，失业增加。\n- 实际GDP的变化与失业率的变化是反向相关的。\n- 在衰退期间，失业率大幅上升。\n\n## 关于经济波动的三个关键事实\n\
    ### 事实1： 经济波动是无规律的且不可预测\n\n![](img/518b44ff56ad05e168220626515b534d_1667_0.png)\n\
    \n美国真实GDP，2000年的十亿美元\n\n阴影面积表示衰退\n\n## 关于经济波动的三个关键事实\n### **事实 3：** 随着产量减少，失业增加\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1669_0.png)\n\n失业率，劳动力百分比\n\n1965 \
    \ 1970  1975  1980  1985  1990  1995  2000  2005  2010\n\n## 介绍\n- 解释这些经济波动较为困难，并且经济波动理论仍然是有争议的。\n\
    - 大多数经济学家用总需求与总供给模型来研究经济波动。\n- 这个模型与古典经济学家用来解释长期世界的模型不同。\n\n## 古典经济学\n- 前面章节的内容都是基于古典经济学，特别是：\n\
    - 古典二分法，把变量分为两类：\n  - 真实变量 — 衡量数量或相对价格的变量\n  - 名义变量 — 按货币衡量的变量\n- 货币中性：货币供给的变动影响名义变量，而不影响真实变量\n"
