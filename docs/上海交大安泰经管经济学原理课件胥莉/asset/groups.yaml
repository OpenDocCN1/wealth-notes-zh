    \  菲利普斯曲线向右下方倾斜\n- 理论（弗里德曼与费尔普斯）：\n  长期菲利普斯曲线是垂直的\n- 为使理论与证据相一致，弗里德曼与费尔普斯引入了一个新的变量：预期通货膨胀——衡量人们预期物价总水平的变动幅度\n\
    \n## 菲利普斯曲线方程\n\n失业率 = 自然失业率 − a（实际通货膨胀 − 预期通货膨胀）\n\n### 在短期中\n\n美联储可以使失业率降到自然失业率以下，而使实际通货膨胀高于预期通货膨胀\n\
    \n### 在长期中\n\n实际通货膨胀和预期通货膨胀越来越接近\n\n预期通货膨胀与现实相符，失业率回到自然失业率，无论通货膨胀是高还是低\n\n## 预期通货膨胀如何移动菲利普斯曲线\n\
    \n最初，预期通货膨胀与实际通货膨胀都等于3%，失业率 = 自然率（6%）\n\n联储使实际通货膨胀比预期通货膨胀高出2%，失业率降到4%\n\n在长期中，预期通货膨胀会上升到5%，菲利普斯曲线向右上方移动，失业率回到自然失业率水平\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1811_0.png)\n\n## 图：预期的通货膨胀如何使短期菲利普斯曲线移动\n\
    \n1. 扩张性政策使经济沿着短期菲利普斯曲线向上移动……\n2. ……但在长期中，预期的通货膨胀上升，而且短期菲利普斯曲线向右移动。\n\n![](img/518b44ff56ad05e168220626515b534d_1812_0.png)\n\
    \n长期菲利普斯曲线  \n高预期通货膨胀时的短期菲利普斯曲线  \n低预期通货膨胀时的短期菲利普斯曲线  \n通货膨胀率  \n自然失业率  \n失业率\
    \  \nA  \nB  \nC\n\n## 讨论\n\n一个数值例子\n\n自然失业率 = 5%，预期通货膨胀率 = 2%，在菲利普斯曲线方程中的 *a*\
    \ = 0.5\n\n- A. 画出长期菲利普斯曲线\n- B. 找出实际通货膨胀为 0%、6% 时的失业率，并画出短期菲利普斯曲线\n- C. 如果预期通货膨胀率上升至\
    \ 4%，重复 B 过程\n- D. 如果自然失业率下降到 4%，画出新的长期菲利普斯曲线，再重复 B 过程\n\n"
