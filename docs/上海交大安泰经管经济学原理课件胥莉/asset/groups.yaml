    - 第30章　货币增长与通货膨胀\n\n## 第29章　货币制度\n\n## 本章我们将探索这些问题的答案：\n\n- 哪些资产可以看作“货币”？货币有什么作用？有什么类型？\n\
    - 什么是美联储？\n- 银行在货币制度中扮演什么角色？银行如何“创造货币”？\n- 美联储如何控制货币供给？\n\n## 什么是货币以及它为什么重要\n\n\
    - 没有货币，贸易只能依靠物物交换—用一种物品或劳务交换另一种物品或劳务\n- 交易要求欲望的双向一致性—一种不大可能的偶然巧合，即两个人中每个人都有对方想要的物品或劳务\n\
    - 许多人都要花时间去搜寻其他人与之贸易—这是对资源的巨大浪费\n- 有了货币（经济中人们经常用于向他人购买物品和劳务的一组资产）之后，这样的搜寻就变得没有必要\n\
    \n## 货币的含义\n\n- 货币——经济中人们经常用来向其他人购买物品与劳务的一组资产。\n- 所有的资产都可以用来交换商品，都具有货币的某些职能，但是只有货币最具有流动性，能够最方便、且不遭受损失地转换成其他资产。\n\
    - 货币的职能\n  - 交换媒介\n  - 计价单位\n  - 价值储藏\n\n## 两种类型的货币\n\n## 商品货币：\n\n以有内在价值的商品为形式的货币\n\
    \n例如：金币，战俘营中的香烟\n\n![](img/518b44ff56ad05e168220626515b534d_1445_0.png)\n\n![](img/518b44ff56ad05e168220626515b534d_1445_1.png)\n\
    \n## 法定货币：\n\n没有内在价值、由政府法令确定作为通货使用的货币\n\n例如：美元\n\n## 货币供给\n\n- 货币供给（或货币存量）：经济中流通的货币量\n\
    - 什么样的资产看作货币供给？\n  两种：\n  - 通货：公众手中持有的纸币钞票和铸币\n  - 活期存款：储户可以通过开支票而随时支取的银行账户余额\n\
    \n## 美国经济中货币存量的衡量指标\n\n- 美国经济中货币存量的衡量指标\n- **M1**: 通货，活期存款，旅游支票，其他支票存款 traveler’s\
    \ checks, and other checkable deposits.\n  M1 = $2.3万亿美元 ( 2012年6月)\n- M2: M1中的每一项加上储蓄存款，小额定期存款，货币市场共同基金和几种不重要的项目\n\
    \  M2 = $9.9 万亿美元 ( 2012年6月)\n\n就本课程的目的而言，我们在讨论货币供给时，M1与M2之间的区别并不重要\n\n## 中央银行与货币政策\n\
    \n- **中央银行：** 为了监管银行体系和调节经济中的货币量而设计的机构\n- **货币政策：** 中央银行的决策者对货币供给的安排\n- **联邦储备（美联储）：**\
    \ 美国的中央银行\n\n## 银行与货币供给\n\n- 银行可以影响经济中的活期储蓄额和货币供给。\n- 100%准备金制度:银行吸收存款，并将其保持在帐户上，这就是准备金。如果商业银行将所有的资金都留在帐户上，这就不能发放贷款，帐户上的所有资金与公众的存款凭证完全相等。\n\
    - 部分准备金制度: 商业银行留下一部份准备金，把其余的资金全部贷出，这就是余额准备金制度。在这种制度中，公众持有的存款凭证要大于商业银行帐户上的资金余额。在一个部分准备金银行系统中，银行把收到存款的一部分作为准备金，其余的贷出去。\n\
