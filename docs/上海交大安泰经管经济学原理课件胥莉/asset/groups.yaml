    ## 衡量经济活动的价值：国内生产总值


    +   - 研究整个社会的经济活动，首先必须要对我们所研究、处理的对象---总产出或总收入进行定义、计量和描述的一套方法，正如做生意要记账，管仓库要称量。国民收入核算就是研究这套方法的。核算国民经济活动的核心指标是国内生产总值(GDP)。


    ## 国内生产总值


    +   一个从棉花到制成服装的例子


    假设所有价值都是当年新生产的值，不计生产棉花消耗的肥料、种子等价值。棉花售价为50元，纺成棉纱后售价为60元，棉纱织成棉布后售价为70元，棉布制成服装后售价为90元。


    在这个过程中，社会所创造的新价值是不是 50+60+70+90=270元呢？


    ## 国内生产总值


    ![](img/518b44ff56ad05e168220626515b534d_1140_0.png)


    ## 国内生产总值


    因为棉花价值50元在棉纱、棉布和服装中共重复计算过3次，而棉纱的价值在棉布和服装中重复计算过2次，同理，棉布的价值在服装中也被重复计算了如果我们把重复计算的部分除去，则棉纱厂新创价值10元，织布厂新创价值10元，服装厂新创价值20元。本年中全社会新创造的总价值50+10+10+20=90元，正好等于服装最终卖给消费者的价格是90元。


    ## 中间产品与最终产品


    上例中，服装由作为最终使用者的消费者购买并消费，是最终产品；而棉花、棉纱、棉布都被用于再出售、再次加工，以生产另外的产品，属于中间产品。


    +   • **最终产品**：在一定时期内生产的并由最后使用者购买的产品和劳务。


    +   • **中间产品**：用于再出售以供生产另外产品用的产品。


    ## 国内生产总值 的衡量


    +   - 国内生产总值 (GDP) 衡量一个经济体的收入和支出。

    +   - 国内生产总值 (GDP) 是在某一既定时期一个国家内生产的所有最终商品（物品）与服务（劳务）的市场价值。

    +   - GDP同时衡量

    +     - 经济中所有人的总收入

    +     - 用于经济中的物品与劳务产量的总支出


    ## 循环流量图


    +   - 宏观经济的一个简单描述

    +   - 用支出，收益，要素支付和收入来说明GDP

    +   - 预备知识:

    +     - 生产要素：诸如劳动，土地，资本，自然资源等投入

    +     - 要素支付：支付给生产要素的报酬（例如，工资，租金）


    ## 经济的收入与支出


    每一道生产的流程中所新增的价值都会以工资、租金、利息、利润形式，作为生产要素劳动、土地、资本、管理才能的报酬转化为要素提供者的收入。企业利润转化为企业所有者的收入。


    一个企业的支出等于其收入，把所有企业加总起来，即一个国家的总支出也等于它的总收入。


