    # 垄断企业的行为


    +   - 完全垄断企业不同于其他企业之处：

    +     - 垄断企业总在需求弹性大于1处生产

    +     - 垄断企业控制市场和价格，有能力并会让P>AC，从而获得超额利润

    +     - 垄断企业具垄断势力

    +       - 垄断势力（Monopoly Power）： P—MC

    +     - 市场的需求弹性越小，垄断企业的垄断势力越大


    ```

    P − MC = P − MR = P − P·(1 − 1/|E|) = P/|E|

    ```'
