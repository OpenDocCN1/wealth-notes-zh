    - 曲线状的生产可能性边界意味着递增的机会成本\n\n## 生产可能性边界\n\n电脑产量\n\n小麦产量\n\n- 效率\n- 权衡取舍\n- 机会成本\n\
    - 经济增长\n\n生产可能性边界\n\n3,000、2,200、2,000、1,000、0、300、600、700、1,000\n\nD、C、A、B\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_113_0.png)\n\n## 作为政策顾问的经济学家\n\n- 作为科学家，经济学家试图做出关于世界是什么样子的实证表述\n\
    - 作为政策顾问，经济学家试图做出关于世界应该是什么样子的规范表述\n- 实证表述能被证实或证伪，但规范表述则不能\n- 政府雇佣许多经济学家来提供政策建议。比如美国总统有一个经济顾问委员会，本书的作者即是2003-2005经济顾问委员会的主席\n\
    \n"
