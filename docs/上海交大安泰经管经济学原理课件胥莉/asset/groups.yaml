    - **结果：这种物品不会被生产，即使买者对于物品的集体评价要大于提供它的成本**\n- 搭便车者问题排除了私人市场提供公共物品。\n\n## 解决搭便车问题\n\
    \n- 如果政府确信一种公共物品的总利益大于成本，它就可以提供该公共物品，并用税收收入对其进行支付，从而可以使每个人的状况变好。\n- 问题：衡量利益通常是困难的。\n\
    - 成本—收益分析：比较提供一种公共物品的社会成本与社会收益的研究。\n- 成本—收益分析是不精确的，因此提供有效率的公共物品的难度要远远大于提供有效率的私人物品的难度。\n\
    \n## 一些重要的公共物品\n\n- 国防\n- 基础研究创造的知识\n\n## 公共资源\n\n公共资源与公共物品一样没有排他性。想使用公共资源的任何一个人都可以免费使用。\n\
    \n公共资源具有竞争性，因为一个人使用公共资源就减少了其他人对它的享用。\n\n- 与公共物品一样，公共资源也没有排他性\n  - 不能阻止搭便车者的使用\n\
    \  - 企业没有激励提供这种物品\n  - 政府的角色：确定它们的供给\n- 公共资源的附加问题：消费中的竞争性\n  - 一个人的使用会减少另一个人对它的享用\n\
    \  - 政府的角色：确保它们不被过度使用\n\n## 讨论\n\n### 公共资源的政策选择\n\n- 小镇上的人们（或者他们的政府）能为防止这种悲剧做点什么？\n\
    - 尝试想出两种或三种办法。\n\n### 参考答案\n\n- 对土地的使用征收一种税收，使“外部性内在化”。\n- 管制公地的使用（“命令与控制”的方法）。\n\
    - 拍卖使用土地的权利。\n- 把土地分成小块，并出售给家庭；每个家庭将会有不过度放牧的激励。\n\n## 结论：产权的重要性\n\n- 当没有很好地建立产权时（这就是说，某些有价值的东西并没有在法律上有权控制它的所有者），市场就不能有效地配置资源。\n\
    - 当没有产权而引起市场失灵时，政府可以潜在地解决这个问题。\n\n## 防止公共资源过度消费的政策选择\n\n- 管制资源的使用\n- 征税，使外部性内在化\n\
    \  - 例如：打猎与捕鱼的许可证，对拥挤的国家公园收门票\n- 拍卖使用资源的许可证\n  - 例如：美国联邦通信委员会的频谱拍卖\n- 如果资源是土地，将土地分为小块，并出售给个人，使之成为私人物品\n\
    \n## 一些重要的公共资源\n\n- 清洁的空气和水\n- 拥挤的道路\n- 鱼、鲸和其他野生生物\n\n## 第五篇 企业行为与产业组织\n\n###\
    \ 第16章 垄断竞争\n\n### 本章我们将探索这些问题的答案：\n\n- 在完全竞争与垄断之间有什么样的市场结构？它们有什么特征？\n- 垄断竞争企业如何决定产量和价格？它们能获得经济利润吗？\n\
    - 垄断竞争通过什么方式影响社会福利？\n- 广告的社会成本与利益分别是什么？\n\n### 介绍：在垄断与完全竞争之间\n\n两个极端：\n\n- 完全竞争：许多企业，相同的产品\n\
    - 垄断：一家企业\n\n在这两个极端之间：不完全竞争\n\n- 垄断竞争：存在许多出售相似但不相同产品的企业\n- 寡头：只有几个提供相似或相同产品的卖者\n\
    \n### 垄断竞争\n\n- 条件：许多厂商；进入壁垒很低；产品可差异化\n- 产业：服装；餐饮酒店；百货零售；家用电器等\n- 市场策略：产品差异化\n\
    - 效率得失：生活多样化；规模经济性差\n\n### 垄断竞争市场中价格和产量的决定\n\n- 垄断竞争市场的特点\n  - 存在产品差别（Product\
    \ Differentiation）\n    - 内在品质不同\n    - 外观形象不同\n    - 经济空间不同\n    - 推销方式不同\n \
    \ - 企业可以没有限制地进入或退出一个市场。市场上企业的数量要一直调整到经济利润为零时为止。\n  - 厂商对产品价格略有影响力\n- 垄断竞争厂商利润最大化行为\n\
    \  - 垄断竞争厂商面临向右下倾斜但较完全垄断厂商平坦的需求曲线。\n  - 按 MR=MC 确定产量\n  - 根据需求曲线确定该产量对应的价格\n \
    \ - 垄断竞争厂商在短期可能获得超额利润、无超额利润或亏损\n  - 但在长期只会无超额利润，且产量水平在 AC 最低点左边。\n\n"
  mdcn: "\n\n## 免费物品向经济分析提出了特殊的挑战\n\n- 当一些物品可以免费得到时，在正常情况下，经济中配置资源的市场力量就不存在了。\n- 当一种物品没有价格时，私人市场就不能保证该物品生产和消费的适当数量。\n\
    - 在上述情况下，政府政策可以潜在地解决市场失灵，并增进经济福利。\n- 第一章的十大原理之一：\n  - 政府有时可以改善市场结果\n\n## 不同类型的物品\n\
