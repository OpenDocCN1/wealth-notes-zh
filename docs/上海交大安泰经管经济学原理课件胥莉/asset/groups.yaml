    \  - 将他们生产的产品出口而得到一个更好的价格\n  - 从国外进口更便宜的物品而不用在国内自己生产\n\n## 原理 6 : 市场通常是组织经济活动的一种好方法\n\
    \n- **市场:** 大量的买者与卖者\n  (不必在同一个地点)\n- 组织经济活动意味着需要决定\n  - 生产什么\n  - 怎么生产\n  - 生产多少\n\
    \  - 谁将得到它们\n- **市场经济**：许多企业和家庭在物品和劳务市场上相互交易，通过他们的分散决策来配置资源的经济\n- 在一个**市场经济**中，\n\
    \  - 家庭决定为哪家企业工作，以及用自己的收入买什么。\n  - 企业决定雇佣谁和生产什么。\n- 由于家庭和企业在决定购买和出售什么时关注价格，所以他们就不知不觉地考虑到了他们的行为的社会收益与成本。\n\
    - 结果是，价格指引这些个别决策者在大多数情况下实现了整个社会福利最大化的结果。\n- 亚当.斯密在《国富论》（1776）中的著名观察结果：家庭和企业仿佛被一只“看不见的手”所指引，在市场上相互交易，并增进整体经济的福利\n\
