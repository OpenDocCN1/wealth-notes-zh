    # 失业率真的衡量什么？


    +   - 失业率并不是衡量失业或劳动力市场健康状况的完美指标：

    +     - 它将丧失信心的工人排除在外

    +     - 它没有区分全职工作和兼职工作，或者人们只是因为找不到全职工作才去做兼职

    +     - 在劳工统计局调查时，一些人并没有如实报告自己的工作状况

    +   - 尽管存在这些问题，失业率仍然是劳动力市场和经济的一个非常有用的晴雨表'
