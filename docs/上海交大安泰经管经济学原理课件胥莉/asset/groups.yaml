    # 市场


    ![](img/518b44ff56ad05e168220626515b534d_159_0.png)


    ![](img/518b44ff56ad05e168220626515b534d_159_1.png)


    +   - 市场是指某种物品或劳务的一群买者与卖者的集合。

    +   - 供给与需求这两个术语是指人们在市场上相互交易时的行为。

    +   - 本章我们假定市场是完全竞争的'
  - '[PAGE 160]


    # # 完全竞争市场


    +   - 竞争市场是有许多买者与卖者，以至于每个人对市场价格的影响都微乎其微的市场

    +   - 在一个完全竞争市场里：

    +     - 可供销售的物品是完全相同的

    +     - 买者与卖者人数众多，以至于没有任何一个买者或卖者可以影响市场价格，也就是说，每个人都是“价格接受者”

    +     - 完全信息'
  - '[PAGE 161]


    # 市场与竞争


    +   - 买者决定**需求**


    +   - 卖者决定**供给**


    ![](img/518b44ff56ad05e168220626515b534d_161_0.png)'
  - '[PAGE 162]


    # 需求与需求量的变动


    需求则是需求量的组合，也就是在纵坐标表示价格，横坐标表示需求量的图表上，把每个价格点上的相应需求量都标出，并连接起来画出向右下方倾斜的需求曲线。这曲线就是需求，它的数学表达式则是
    D=f（a，b，c，d，…n）而需求量则是该曲线上的点。'
  - '[PAGE 163]


    # 需求


    需求量：是指人们在一定的时期内，在某一 个价格水平上，指买者愿意而且能够购买的 一种物品或劳务的数量。


    需求规律认为，价格与需求量之间的关系是 负关系。


