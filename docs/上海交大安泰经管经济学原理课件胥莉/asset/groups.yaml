    # 劳动的边际产量(MPL)


    +   - **劳动的边际产量：** 增加的一单位劳动所引起的产量增加量


    $$MPL = \frac{\Delta Q}{\Delta L}$$


    其中：


    ΔQ = 产出变动量


    ΔL = 劳动变动量'
  - '[PAGE 925]


    # 边际产量值


