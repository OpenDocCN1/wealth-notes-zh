  md: "\n## 贸易协定\n\n- 一个国家可以用两种方法来实现自由贸易：\n  - 用单边的方法减少自己的贸易限制\n  - 与其他国家签署贸易多边协定来减少贸易限制\n\
    - 贸易协定的例子：\n  - 北美自由贸易协定 (NAFTA), 1993\n  - 关贸总协定 (GATT)\n- 世界贸易组织 (WTO), 1995：执行贸易协定，解决争端\n\
    \n## 本篇小结：\n\n- 消费者剩余是需求曲线以下，实际价格以上的部分；生产者剩余则是供给曲线以上，实际价格以下的部分。\n- 税收将造成无谓的损失，税率越高，无谓的损失越大。\n\
    - 国内市场价格提高至国际市场，生产者剩余增加，消费者剩余减少；反之则反是。关税增加无谓的损失。\n\n## 第四篇 公共部门经济学\n\n## 本篇主要内容：\n\
    \n- 第10章 外部性\n- 第11章 公共物品和公共资源\n\n## 第10章 外部性\n\n## 本章我们将探索这些问题的答案：\n\n- 什么是外部性？\n\
