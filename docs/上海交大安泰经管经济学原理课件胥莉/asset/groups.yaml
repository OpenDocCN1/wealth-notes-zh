  mdcn: "\n\n## 教师和助教介绍\n\n- 课程授课教师：安泰经济与管理学院经济系副教授胥莉。主要研究方向：产业组织理论（平台经济）、数字平台的竞争与反垄断规制、数字化转型与数字经济、工业互联网与人工智能、金融科技与数字货币\n\
    - 担任本科经济学原理主讲教师。目前还讲授中级微观经济学、博弈论。\n- 课程助教：崔楚涵，安泰经济与管理学院硕士2年级，应用经济学专业学生；本科上海交通大学，安泰经济与管理学院金融学专业。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1_0.png)\n\n![](img/518b44ff56ad05e168220626515b534d_1_1.png)\n\
    \n**学生与老师、助教联系的主要方式：**\n\n- 微信群：经济学原理微信群\n- Canvas 网站讨论区\n- 电子邮件：\n  - 胥老师：shirleyxu@sjtu.edu.cn\n\
    \  - 崔楚涵：cuichuhan@sjtu.edu.cn\n- 电话：胥老师 53201281\n\n![](img/518b44ff56ad05e168220626515b534d_1_2.png)\n\
    \n## 教材：\n\n曼昆（N. Gregory Mankiw）《经济学原理》第八版 北京大学出版社\n\n![](img/518b44ff56ad05e168220626515b534d_2_0.png)\n\
    \n## 其他\n\n- Canvas 网站：PPT 下载，阅读材料下载，课后讨论，提交个人作业，小组项目讨论，观看直播的视频\n\n### 考核方式\n\n\
    - 1) 考勤：10%\n- 2) 平时作业：30%\n  - 一个案例\n  - 期中随堂练习\n  - 课后作业\n- 3) 期末考试（闭卷）：60%\n\
    \n## 教学目标：\n\n培养同学们对于经济学的兴趣。\n\n## 教学思路：\n\n面面俱到，浅尝辄止。\n\n## 经济学的两大内容\n\n- **微观经济学**\n\
    \  - 只见树木不见森林、资源配置、价格理论、人的完全理性\n- **宏观经济学**\n  - 只见森林不见树木、资源运用、国民收入决定理论\n\n##\
    \ 课程安排\n\n- 13 篇\n  - 33 章 课堂讲授\n  - 3 章 自学\n\n## 教学内容\n\n- 导论、供给与需求：市场如何运行、市场和福利、公共部门经济学、企业行为与产业组织、深入研究的论题、宏观经济学的数据、长期中的真实经济、长期中的货币与物价、短期经济波动\n\
    \n## 问题\n\n你希望从本课程中学到些什么？\n\n## 你希望从本课程中学到些什么？\n\n## 经济学\n\n## 问题\n\n- 为什么会有经济学？\n\
    - 经济学包含什么？\n- 谁做出选择？\n\n## 经济学产生的原因与现实\n\n- 人类欲望的**无限性**\n- 满足人类需求的产品和资源**稀缺性**\n\
    - 由此而产生选择\n\n**经济学**——研究社会如何管理自己的稀缺资源的学科。\n\n## 经济学是一门社会科学\n\n- 经济学是一门有趣、有用的社会科学。\n\
    - 它的主题是社会的——人们的选择如何引导他们的生活，以及他们如何相互影响\n- 它以科学的态度来研究这个主题\n\n### Fields in Economics\
    \ 经济学的领域\n\n- 微观经济学 Micro\n- 宏观经济学 Macro\n- 计量经济学 Econometrics\n- 金融学 Finance\n\
    - 产业组织 Industrial Organization\n- 劳动经济学 Labor\n- 公共财政 Public Finance\n- 国际经济学\
    \ International\n- 发展经济学 Development\n- 比较经济学 Comparative\n- 法和经济学 Law and Economics\n\
    - 政治经济学 Political Economy\n- 经济史 Economic History\n\n## 金融学是经济学的一部分\n\n- 什么是金融学（Finance）\n\
    \  - 宏观金融\n    - 货币经济学/货币银行（monetary economics/money and banking）\n    - 开放经济的宏观经济学/国际金融（open\
    \ economy macroeconomics/international finance）\n  - 微观金融\n    - 公司金融/公司财务（corporate\
    \ finance）\n    - 资产定价（asset pricing）\n\n## 经济学与管理学关系密切\n\n- 会计学：前沿研究领域深受信息经济学的影响\n\
    - 管理信息系统：网上拍卖运用博弈论、信息产品定价运用价格理论\n- 市场营销学：定价策略得益于信息经济学和博弈论\n- 人力资源管理学：大量运用组织经济学和激励理论的分析方法\n\
    - 公司战略：延伸产业组织理论\n\n## 经济学研究什么问题\n\n- **稀缺性**：社会资源的有限性\n- **经济学**：研究社会如何管理自己的稀缺资源，从而研究\n\
    \  - 人们的经济行为（人们如何做决策）\n  - 社会的经济现象（人们决策的相互作用）\n- 比如：\n  - 人们决定购买什么，工作多长时间，储蓄多少，消费多少\n\
    \  - 企业决定生产多少，雇佣多少工人\n  - 社会决定如何在国防、消费物品、环境保护和其他需求之间分配资源\n\n## 为什么学习经济学\n\n- 经济学有助于你了解你生活的世界。\n\
    - 经济学使你更精明地参与经济活动。\n- 经济学使你更好地理解经济政策的潜力与局限性\n\n### 学习经济学的三个层次\n\n- 初级经济学\n  -\
    \ 经济学原理\n- 中级经济学：\n  - 中级微观经济学\n  - 中级宏观经济学\n- 高级经济学\n  - 高级微观经济学\n  - 高级宏观经济学\n\
    \n## 经济学三个层次的特点\n\n- 经济学原理：\n  - **图和表**（没有公式）\n  - 入门课\n- 中级经济学：\n  - 用一些数学和概率统计\n\
    \  - 较为严格的数学推理\n  - 较为系统的经验实证分析\n- 高级经济学：\n  - 用很多数学\n  - 前沿的学术研究\n\n### 经济学原理的课程目的\n\
    \n- 体会现代经济学的基本思想、概念与分析方法\n- 培养对现实世界经济行为与经济现象的观察能力\n- 训练经济学直觉\n\n## “经济学原理”课可以改变人生\n\
    \n> “在我当学生的20年中，最令我兴奋的课程是我在上大学一年级时所选的连续两个学期的经济学原理。可以毫不夸张地说，这门课改变了我的一生。”\n>\n>\
    \ ——曼昆《经济学原理》序言\n\n## 重商主义：15世纪-17世纪中期\n\n- 代表及著作：蒙克莱田\n  - 《献给国王和王太后的政治经济学》\n\
    - 利益代表：商业资本家（后来的工场主）\n- 观点：\n  - 金银是财富的唯一形态\n  - 财富来自对外贸易\n  - 研究重点：贸易流通\n\n##\
    \ 关于古典学派的不同定义\n\n### 马克思\n\n- 古典经济学——在资本主义处于上升时期代表着进步力量的政治经济学\n- 庸俗经济学——为资本主义制度进行辩护，代表资产阶级利益，热衷于对经济体系的表面现象进行研究的经济理论\n\
    \n### 凯恩斯\n\n从斯密起到凯恩斯之前的理论：将当代西方经济学所认为是新古典经济学的理论也包括在内\n\n### 熊彼特\n\n斯密被归为重商主义，1790-1879\
    \ 年间的经济理论属于古典经济学。\n\n### 主流观点\n\n从斯密《国民财富的性质和原因的研究》出版开始到马歇尔《经济学原理》出版之前这段时期的理论\n\
    \n## 新古典经济学：19世纪中后期-20世纪初期\n\n### 时代背景：资本主义由竞争向垄断过渡\n\n- 特点：边际分析与数量分析\n- “边际革命”：\n\
    \  - 边际效用论：门格尔、杰文斯、瓦尔拉斯\n  - 边际生产力分配论：克拉克\n- 马歇尔及其《经济学原理》\n  - 第二次综合\n  - 当代西方微观经济学的形成\n\
    \  - 局部均衡分析\n- 一般均衡分析\n- 微观经济学的进一步发展：\n  - 不完全竞争、制度、福利\n\n"
