    \n### 能力、努力和机遇\n\n- 更高的能力或努力通常需要更高的工资。这些特征能增加工人的边际产量，使得他们对企业而言更有价值\n- 工资也会受机遇影响：\n\
    \  - 比如：没有预测到的发明会使一些岗位过时，增加另外一些工作岗位的需求\n- 能力，努力和机遇都难以衡量，因此它们对工资的影响也难以量化\n- 然而它们可能是重要的，因为一些容易衡量的特征（比如教育，年龄等）只能解释我们经济中不足一半的工资差别\n\
    \n### 案例研究：漂亮的福利\n\nHamermesh和Biddle的研究表明：\n\n- 那些被认为更有魅力的人平均比相貌平常的人收入高5%\n- 那些相貌平常的人比那些被认为不太有魅力的人的收入高5-10%\n\
    \n假说：\n\n1. 漂亮对生产率是重要的\n   - 在一些外表是重要的工作中，有魅力的工人对企业而言更有价值，需要支付更高的工资\n2. 漂亮与能力间接相关\n\
