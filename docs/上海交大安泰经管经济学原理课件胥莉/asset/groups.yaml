  md: "\n## 第8章 应用: 税收的成本\n\n## 本章我们将探索这些问题答案：\n\n- 税收怎样影响消费者剩余，生产者剩余和总剩余？\n- 什么是税收的无谓损失？\n\
    - 决定无谓损失大小的因素有哪些？\n- 税收规模如何影响税收收入？\n\n## 复习第六章\n\n- 税收\n  - 在买者支付的价格和卖者得到的价格之间打入一个楔子\n\
    \  - 提高了买者为该物品支付的价格，降低了卖者从该物品得到的价格\n  - 减少了购买与销售的数量\n- 无论是对买者还是卖者征税，结果都一样。因此本章我们不做这种区分\n\
    \n## 税收的无谓损失\n\n一种物品的税收是向买者征收还是向卖者征收是不重要的...\n\n结果都是买者支付的价格上升，而卖者得到的价格下降。\n\n\
    税收的无谓损失——市场扭曲（比如收税）引起的总剩余减少。\n\n## 税收效应\n\n价格\n\n供给\n\n需求\n\n数量\n\n0\n\n税后的需求量\n\
    \n税前的需求量\n\n买者支付的价格\n\n没有税收时的价格\n\n卖者得到的价格\n\n税收规模\n\n## 税收如何影响市场参与者\n\n- 税收在买者支付的价格和卖者得到的价格之间打入了一个楔子。\n\
    - 由于这种税收楔子，销售量低于没有税收时应该达到的水平。\n- 对一种物品征税使这种物品的市场规模收缩。\n\n## 税收如何影响福利\n\n价格\n\n\
    买者支付的价格 = P_B\n\n没有税收时的价格 = P_1\n\n卖者得到的价 = P_S\n\n供给\n\n需求\n\n数量\n\n0\n\nQ2\n\
    \nQ1\n\n征税减少了消费者剩余（用面积B+C代表）和生产者剩余（用面积D+E代表）\n\n税收 = (B+D)\n\n无谓损失 = (C+E)\n\n\
    A\n\nB\n\nC\n\nD\n\nE\n\nF\n\n## 税收如何影响福利\n\n| | 没有税收时 | 有税收时 | 变动 |\n|---|---|---|---|\n\
    | 消费者剩余 | A + B + C | A | - (B + C) |\n| 生产者剩余 | D + E + F | F | - (D + E) |\n\
    | 税收收入 | 无 | B + D | + (B + D) |\n| 总剩余 | A + B + C + D + E + F | A + B + D +\
    \ F | - (C + E) |\n\nC+E 的面积表示总剩余减少，而且是税收的无谓损失。\n\n## 税收如何影响福利\n\n总福利的变动包括：\n\n\
    - 消费者剩余的变动，\n- 生产者剩余的变动，\n- 税收收入的变动。\n- 买者和卖者由税收受到的损失大于政府筹集到的收入。\n- 无谓损失——税收引起的总剩余减少。\n\
    \n## 无谓损失与贸易的好处\n\n- 税收引起无谓损失是因为它使买者与卖者不能实现某些贸易的好处。\n\n## 无谓损失\n\n价格\n\n供给\n\n\
    需求\n\n数量\n\nP_B\n\nP1\n\n没有税收时的价格\n\nP_S\n\n买者的评价\n\n卖者的成本\n\nQ2\n\nQ1\n\n由于税收引起的数量减少\n\
    \n税收规模\n\n损失的贸易好处\n\n0\n\n![](img/518b44ff56ad05e168220626515b534d_427_0.png)\n\
    \n## 讨论\n税收分析\n\n- A. 计算没有税收时的CS, PS, 以及总剩余\n- B. 如果每张机票征税$100，计算：\n  CS, PS,税收收入，总剩余以及无谓损失\n\
    \n![](img/518b44ff56ad05e168220626515b534d_428_0.png)\n\n## 讨论\n参考答案：A\n\n机票市场\n\
    \nCS\n= ½ x $200 x 100\n= $10,000\n\nPS\n= ½ x $200 x 100\n= $10,000\n\n总剩余\n\
    = $10,000 + $10,000\n= $20,000\n\nP = 200\n\n![](img/518b44ff56ad05e168220626515b534d_429_0.png)\n\
    \n100\n\n## 讨论\n参考答案：B\n\nCS\n$400\n= ½ x $150 x 75\n= $5,625\n\nPS = $5,625\n\
    \n税收收入\n= $100 x 75\n= $7,500\n\n总剩余\n= $18,750\n\n无谓损失\n= $1,250\n\n对每张机票征税 $100\n\
    \nP_B = 250\n\nP_S = 150\n\n75\n\n![](img/518b44ff56ad05e168220626515b534d_430_0.png)\n\
    \n## 无谓损失的决定因素\n\n什么因素决定税收的无谓损失是大还是小？\n\n- 无谓损失的大小决定于供给量和需求量对价格变动的反应程度。\n- 也就是说，决定于供给和需求的价格弹性。\n\
    \n## 税收扣曲与弹性\n\n缺乏弹性的供给\n\n![](img/518b44ff56ad05e168220626515b534d_432_0.png)\n\
    \n价格\n\n供给\n\n需求\n\n数量\n\n税收规模\n\n当供给比较缺乏弹性时，税收的无谓损失小。\n\n## 税收扭曲与弹性\n\n富有弹性的供给\n\
    当供给比较富有弹性时\n，税收无谓损失大。\n\n价格\n\n数量\n\n0\n\n供给\n\n需求\n\n税收\n规模\n\n## 税收扭曲与弹性\n\n\
    缺乏弹性的需求\n\n价格\n\n数量\n\n0\n\n供给\n\n需求\n\n税收规模\n\n当需求比较缺乏弹性时，税收的无谓损失小。\n\n## 税收扭曲与弹性\n\
    \n价格\n\n数量\n\n0\n\n富有弹性的需求\n\n供给\n\n需求\n\n税收规模\n\n当需求比较富有弹性时，税收的无谓损失大。\n\n## 无谓损失的决定因素\n\
    \n- 供给和需求的弹性越大；\n- 均衡数量下降的越多，\n- 税收的无谓损失也就越大。\n\n## 讨论\n弹性与税收的无谓损失\n\n下面各组物品中，对哪种物品征税的无谓损失更大？\n\
    \n- A. 谷类早餐还是防晒霜？\n\n- B. 短期的宾馆住房还是长期的宾馆住房？\n\n- C. 普通食品还是高档餐馆的用餐？\n\n## 讨论\n\
    参考答案\n\n**A. 谷类早餐还是防晒霜**\n\n我们在第五章已经知道：谷类早餐相对于防晒霜有更多相近的替代品，谷类早餐的需求价格弹性要大于防晒霜的需求价格弹性\n\
    \n因此，对谷类早餐征税造成的无谓损失要大于对防晒霜征税造成的无谓损失\n\n## 讨论\n参考答案\n\n- B. 短期的宾馆住房还是长期的宾馆住房\n\n\
    我们在第五章已经知道：长期宾馆住房的需求弹性和供给弹性都要大于短期宾馆住房\n\n因此，对长期的宾馆住房征税所造成的无谓损失要大于对短期的宾馆住房征税造成的无谓损失\n\
    \n## 讨论\n参考答案\n\n**C. 普通食品还是高档餐馆的用餐**\n\n我们在第五章已经知道：普通食品是必需品，其需求的价格弹性要低于高档餐馆用餐的需求弹性\n\
    \n因此，对高档餐馆用餐征税造成的无谓损失要大于对普通食品征税造成的无谓损失\n\n## 讨论\n\n- 政府需要增加税收收入来支付对学校，警察等的支出。为达到这个目的，政府既可以对普通食品征税也可以对高档餐馆的用餐征税\n\
    - 应该对哪个征税？\n\n## 税收规模变动的影响\n\n- 政策制定者经常提高或降低税收\n- 当税收变动时，无谓损失的变动情况如何？我们接下来考虑这个问题......\n\
    \n## 无谓损失和税收收入随税收变动而变动\n\n- 随着每一次税率增加，税收无谓损失的增加要快于税收规模。\n\n## 无谓损失与税收收入\n\n![](img/518b44ff56ad05e168220626515b534d_444_0.png)\n\
