    \n- 由于垄断者通过收取高于边际成本的价格发挥其市场势力，它就在消费者的支付意愿和生产者的成本之间打入一个楔子。\n  - 这个楔子使销量低于社会最优产量。\n\
    - 垄断引起的无谓损失类似于税收引起的无谓损失。\n- 税收和垄断之间的差别是政府得到税收的收入，而私人企业得到了垄断利润。\n\n## 垄断的无效率\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_870_0.png)\n\n垄断者生产的产量小于社会有效率的产量。\n\n\
    ## 垄断企业的行为\n\n### 价格歧视\n\n- 价格歧视是以不同价格向不同消费者出售同一种物品的做法。\n  - 两个消费者消费的产品生产成本是相同的。\n\
    \  - 对不同成本的产品向不同的购买者收取相同的价格。\n- 当一种物品在竞争市场上销售时，价格歧视是不可能的，这是因为有很多以市场价格销售同一种物品的企业。为了做到价格歧视，企业必须具有一些市场势力。\n\
    \n## 价格歧视的条件\n\n- 厂商具有一定的市场力量。\n- 消费者具有不同的偏好，且能够被区分（需求弹性不同）。\n- 消费者群体或销售市场相互隔离。无法转卖或转卖的成本太高从而不值得转卖。\n\
    \n## 价格歧视的例子\n\n- 电影票\n  - 对老年人，学生以及可以在工作日下午看电影的人们实行折扣，因为他们的支付意愿要低于那些在周末晚上买全价电影票看电影的人们\n\
