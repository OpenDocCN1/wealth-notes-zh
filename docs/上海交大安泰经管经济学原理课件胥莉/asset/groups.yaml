    \n## 第 24 章 生活费用的衡量\n\n## 本章我们将探索这些问题的答案：\n- 什么是消费物价指数 (CPI)？怎么计算？它有什么用？\n- CPI存在怎样的问题?它们有多严重？\n\
    - CPI与GDP平减指数有何区别？\n- 我们如何用CPI来比较不同年份相同数量的美元?我们为什么要做这个？\n- 我们怎样用通货膨胀来校正利率？\n\n\
    ## 生活费用的衡量\n- 通货膨胀是指经济中物价总水平上升的情况。\n- 通货膨胀率是从前一个时期以来物价总水平变动的百分比。\n\n## 消费物价指数\
    \ (CPI)\n- 衡量普通消费者的生活成本\n- 在许多合同与社会保障中作为生活费用调整的依据\n\n## 1996-2021居民消费指数\n## 1996-2021居民消费指数\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1200_0.png)\n\n## 消费物价指数\n- 消费物价指数（CPI）是普通消费者所购买的物品与劳务的总费用的衡量标准。\n\
    - 当CPI上升时，普通家庭不得不花费更多的美元来保持原来的生活水平。\n\n## 如何计算消费物价指数\n- **固定篮子：** 确定哪些物价对普通消费者是最重要的。\n\
    - **找出价格：** 找出每个时点上篮子中每种物品与劳务的价格。\n- **计算这一篮子东西的费用：** 用价格数据计算不同时间点一篮子物品与劳务的费用。\n\
    \n## 如何计算消费物价指数\n- 选择基年并计算指数：\n  - 指定一年为基年，即其他各年与之比较的基准。\n  - 每年一篮子物品与劳务的价格除以基年一篮子物品与劳务的价格，然后把这个比率乘以\
    \ 100，所得出的数字就是消费物价指数。\n\n## 如何计算消费物价指数\n- **计算通货膨胀率**：通货膨胀率是从上一年以来物价指数的变动百分比。\n\
    \n第2年的通货膨胀率 = \\(\\frac{\\text{第2年CPI}-\\text{第1年CPI}}{\\text{第1年CPI}}\\times\
    \ 100\\)\n\n例：\n\n## 篮子：{4个Pizza, 10杯拿铁咖啡}\n\n| 年份 | Pizza价格 | 拿铁咖啡价格 | 篮子费用 |\n\
    |---|---:|---:|---:|\n| 2017 | $10 | $2.00 | $10 × 4 + $2 × 10 = **$60** |\n|\
    \ 2018 | $11 | $2.50 | $11 × 4 + $2.5 × 10 = **$69** |\n| 2019 | $12 | $3.00 |\
    \ $12 × 4 + $3 × 10 = **$78** |\n\n计算每年的CPI，以2017年为基年　通货膨胀率：\n\n2017：100 × ($60/$60)\
    \ = **100**\n\n2018：100 × ($69/$60) = **115**\n\n2019：100 × ($78/$60) = **130**\n\
    \n**15%** = \\frac{115-100}{100} × 100%\n\n**13%** = \\frac{130-115}{115} × 100%\n\
    \n## 讨论\n## 参考答案\n\nCPI 篮子：\n\n{10 磅牛肉,\n20 磅鸡肉}\n\n2017年CPI 的篮子费用是120 美元，以2017年为基年。\n\
    \nA. 计算2018年的 CPI：\n\n2018年CPI篮子的费用\n\n= ($5 x 10) + ($5 x 20) = $150\n\n2018的CPI\
    \ = 100 x ($150/$120) = 125\n\n| | 牛肉价格 | 鸡肉价格 |\n|---|---|---|\n| 2017 | $4 |\
    \ $4 |\n| 2018 | $5 | $5 |\n| 2019 | $9 | $6 |\n\n## 讨论\n参考答案\n\nCPI 篮子：\n{10\
    \ 磅牛肉，\n 20 磅鸡肉}\n\n| 年份 | 牛肉价格 | 鸡肉价格 |\n|---|---:|---:|\n| 2018 | $4 | $4 |\n\
    | 2019 | $5 | $5 |\n| 2020 | $9 | $6 |\n\n2018年CPI篮子的费用是120美元，以2018年为基年。\n\nB.\
    \ 2018年到2020年以CPI计算的通货膨胀率是多少\n\n2020年CPI篮子的费用\n= ($9 × 10) + ($6 × 20) = $210\n\
    \n2020年的CPI = 100 × ($210/$120) = 175\n\nCPI通货膨胀率 = (175 − 125)/125 = 40%\n\n\
    ## 衡量生活费用中的问题\n- CPI是所选择的构成消费篮子的物品的准确衡量，但它并不是生活费用的完美衡量指标。\n- 替代倾向\n- 新产品的引进\n\
    - 无法衡量的质量变动\n\n## 衡量生活费用中的问题\n- 替代倾向\n  - 当不同产品的相对价格发生变化时，消费者会通过改变购买习惯对此有所反应，而计算物价指数的市场篮子保持不变。\n\
    \  - 消费者转向购买变得相对便宜的替代物品。\n  - 消费物价指数不考虑这种消费者替代的可能性，从而高估了生活费用的增加。\n\n## 讨论\n替代偏向\n\
    \nCPI 篮子：\n{10 磅牛肉，\n 20 磅鸡肉}\n\n2018-5:\n家庭购买CPI篮子\n\n| 年份 | 牛肉 | 鸡肉 | CPI篮子的费用\
    \ |\n|---|---:|---:|---:|\n| 2018 | $4 | $4 | $120 |\n| 2019 | $5 | $5 | $150\
    \ |\n| 2020 | $9 | $6 | $210 |\n\n2020年6月：家庭买 {5 磅牛肉, 25 磅鸡肉}\n\n- A. 计算2020年家庭购买篮子的费用\n\
    - B. 以2020年6月家庭篮子费用来计算增长率，并与CPI通货膨胀率比较\n\n## 讨论\n参考答案\n\nCPI篮子：\n{10 磅牛肉,\n20\
    \ 磅鸡肉}\n\n家庭在2020年购买篮子：\n{5 磅牛肉, 25 磅鸡肉}\n\n| | 牛肉 | 鸡肉 | CPI篮子的费用 |\n|---|---|---|---|\n\
    | 2018 | $4 | $4 | $120 |\n| 2019 | $5 | $5 | $150 |\n| 2020 | $9 | $6 | $210\
    \ |\n\nA. 计算2020年家庭购买篮子的费用\n\n($9 x 5) + ($6 x 25) = $195\n"
