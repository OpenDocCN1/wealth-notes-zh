    \n- 储蓄因此等于私人储蓄与公共储蓄之和。政府税收大于支出为盈余，反之则为赤字。\n- 该等式表明通过金融市场可以在整体上实现社会的储蓄等于投资。\n\n\
    ## 储蓄与投资的含义\n\n储蓄等于投资的机制：个人存款银行或买股票的储蓄未必等于另一个人购买厂房设备的投资，但是，投资者可以通过金融机构借到不足的资金，这就能在总量上实现投资等于储蓄。\n\
    \n## 储蓄与投资的含义\n\n- 对整个经济而言，储蓄必定等于投资。$S=I$\n- 预算盈余与预算赤字\n  - 如果$T>G$，政府由于得到的资金大于支出，政府有预算盈余。\n\
    \  - 这种$T-G$的盈余代表公共储蓄。\n  - 如果$G>T$，政府支出大于其税收收入，政府有预算赤字。\n\n## 讨论\n\n参考答案：A\n\n\
    已知：\nY = 10.0, C = 6.5, G = 2.0, G − T = 0.3\n\n公共储蓄 = T − G = −0.3\n\n税收：T =\
    \ G − 0.3 = 1.7\n\n私人储蓄 = Y − T − C = 10 − 1.7 − 6.5 = 1.8\n\n国民储蓄 = Y − C − G\
    \ = 10 − 6.5 = 2 = 1.5\n\n投资 = 国民储蓄 = 1.5\n\n## B.减税如何影响储蓄\n\n- 用前面练习的数据。\n  现在假定政府减税2千亿美元\n\
    - 在下面的两种情形中，公共储蓄，私人储蓄，国民储蓄和投资会发生怎样的变动\n  1. 消费者把所有的减税都作为储蓄存起来\n  2. 消费者把减税的1/4存起来，花掉另外的3/4\n\
    \n## 讨论\n\n## 参考答案： B\n\n在两种情形下，公共储蓄都减少了2千亿美元，预算赤字从3千亿美元上升到5千亿美元\n\n- 1. 如果消费者把所有的2千亿美元都作为储蓄，那国民储蓄不变，投资也不变\n\
    \n- 2. 如果消费者存500亿美元并花费1.5千亿美元，那国民储蓄和投资都会减少1.5千亿美元\n\n## C. 问题讨论\n\n这个练习的两种情形是：\n\
    \n- 1. 消费者把所有的减税都作为储蓄存起来\n- 2. 消费者把减税的1/4存起来，花掉另外的3/4\n\n- 你认为这两情形中哪一个比较现实？\n\
    - 为什么这个问题很重要？\n\n## 储蓄与投资的含义\n\n- 私人储蓄：家庭在支付了税收和消费之后剩下来的收入\n- 家庭如何使用储蓄：\n  - 购买企业债券或股票\n\
    \  - 存进银行\n  - 购买共同基金的股份\n  - 让储蓄或支票账户不断增加\n\n## 储蓄与投资的含义\n\n- **投资：** 新资本的购买\n\
    - 投资的例子：\n  - 通用汽车公司投资2.5亿美元在密歇根州的弗林特建造一个新工厂\n  - 你为生意上的方便买了一台$5000的电脑\n  - 你父母花$30万建新房\n\
    \n## 可贷资金市场\n\n- 金融体系的供给-需求模型\n\n- 帮助我们理解：\n  - 金融体系如何使储蓄与投资相匹配\n  - 政府政策和其他因素会如何影响储蓄、投资和利率\n\
    \n## 可贷资金市场\n\n- 假设存在这样一个市场\n  - 所有的储蓄都进入这个市场\n  - 所有的投资都借自这个市场\n  - 这个市场只有一个利率，它既是储蓄的收益，又是借款的成本。\n\
    - 金融市场在可贷资金市场上协调经济中的储蓄与投资。\n\n## 可贷资金市场\n\n- **可贷资金市场**——想储蓄提供资金的人和想为投资需求借资金的人的市场。\n\
    - **可贷资金**是指人们选择储蓄并贷出而不用于自己消费的所有收入。\n\n## 可贷资金的供给与需求\n\n- 可贷资金的供给来自那些有额外收入并想储蓄和贷出的人。其方式可以是直接的买债券，也可以是间接的存款。\n\
    - 可贷资金的需求来自希望借款进行投资的家庭和企业。包括抵押贷款购置住房或购买设备建立工厂。\n\n## 供给曲线斜率\n\n利率上升会鼓励储蓄，并增加可贷资金的供给\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1336_0.png)\n\n## 需求曲线的斜率\n\n利率降低会减少借贷的成本，增加可贷资金的需求量\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1337_0.png)\n\n## 可贷资金的供给与需求\n\n- **利率**\
    \ 是贷款的价格。\n- 它代表借款者要为贷款支付的量以及贷款者从其储蓄得到的量。\n- 可贷资金市场上的利率是**实际**利率。\n\n## 均衡\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_1340_0.png)\n\n利率调整使可贷资金供求平衡\n\n可贷资金的均衡数量等于均衡投资，也等于均衡储蓄\n\
    \n## 可贷资金的供给与需求\n\n- 影响储蓄与投资的政府政策\n  - 税收与储蓄\n  - 税收与投资\n  - 政府预算赤字\n\n## 政策1：储蓄激励\n\
    \n- 对利息收入征税大大减少了现期储蓄的未来收益，因此，减少了对人们储蓄的激励。\n- 税收减少提高了任何一种既定利率水平下对家庭储蓄的激励。\n  -\
    \ 可贷资金的供给曲线向右移动。\n  - 均衡利率下降。\n  - 对可贷资金的需求量增加，投资增加；反之则向左移动，利率上升，投资减少。\n\n## 图．可贷款资金供给增加\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1343_0.png)\n\n1. 储蓄的税收激励增加了可贷款资金的供给……\n\
    2. …这导致均衡利率下降…\n3. …并增加了可贷款资金均衡数量。\n\n"
