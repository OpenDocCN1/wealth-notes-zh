  md: "\n## 储蓄、投资及其与国际流动的关系\n\n一国的储蓄和投资是其长期经济增长的关键。\n\n封闭经济下：\n\nS = I\n\n那么，开放经济下：\n\
    \nS ? I\n\n- Y = C + I + G + NX（核算恒等式）\n- Y − C − G = I + NX（移项）\n- S = I + NX（由于\
    \ S = Y − C − G）\n- S = I + NCO（由于 NX = NCO）\n\n国民储蓄 = 国内投资 + 资本净流出\n\n- 封闭经济下：NCO\
    \ = 0 → S = I\n- 开放经济下：\n  - 当 S > I 时，多余的可贷资金流出国外，资本净流出为正\n  - 当 S < I 时，外国人为一部分国内投资筹资，资本净流出为负\n\
    \n## 案例研究：美国的贸易赤字\n\n- 美国的贸易赤字在2006年创造了历史记录，并在2007、2008年仍然很高\n- 由于 *NX = S − I\
    \ = NCO*，贸易赤字意味着 *I > S*\n- 从1980年开始，这样的贸易赤字已成为常态……\n\n- 1990年后，美国的贸易赤字一直保持较高的水平，截至到2010年底，美国财政赤字上升到1.6万亿美元，相当于美国GDP的10.6%\n\
    \n- **贸易赤字意味着 I > S，因此 NCO < 0**\n\n- 为什么美国的储蓄会小于投资：\n  - 在20世纪80年代和21世纪初期，高预算赤字与低私人储蓄减少国民储蓄\n\
    \  - 在20世纪90年代，随着经济增长国民储蓄也在增加。但由于信息技术的兴起，国内投资增长得更快\n\n**美国的国民储蓄、国内投资与资本净流出：1960—2010**\n\
    \n**图 31-2 国民储蓄、国内投资与资本净流出**\n\n![](img/518b44ff56ad05e168220626515b534d_1573_0.png)\n\
    \n(a) 国民储蓄与国内投资 (占GDP的百分比)\n\n**美国的资本净流出：1960—2010**\n\n![](img/518b44ff56ad05e168220626515b534d_1574_0.png)\n\
    \n(b) 资本净流出 (占GDP的百分比)\n\n资料来源：U.S. Department of Commerce.\n\n- 美国的贸易赤字是一个问题吗？\n\
    \  - 二十世纪90年代投资高潮所留下的额外资本存量可能会产生巨大的收益\n  - 20世纪80年代和21世纪初期的储蓄下降尽管不是合意的，但至少不会减少国内投资，因为企业可以从国外借款\n\
    \n- 一个国家好比一个人，会由于某种原因而负债。贸易赤字本身并不是一个问题，但可能是问题的前兆\n\n到2007年12月31日截止：\n\n- 外国人拥有20.1万亿美元美国资产\n\
    - 美国居民拥有17.6万亿美元外国资产\n- 美国对其他国家净负债 = 2.5万亿美元\n- 净负债比任何其他国家都高\n\n因此，美国是“世界上最大的债务国”\n\
    \n- 至今为止，美国在外国资产上的利率要高于它付给外国人债务的利率\n- 但如果美国的债务持续增长，外国人会要求更高的利率，支付债务利息将会消耗掉美国的收入\n\
    \n## 升值与贬值\n\n![](img/518b44ff56ad05e168220626515b534d_1578_0.png)\n\n- **升值（或者“坚挺”）**：按所能够买到的外国通货量衡量的一国通货的价值增加\n\
    \  - 例如：2011年4月12日，人民币……\n    - 对美元中间价为6.5440\n    - 2011年1月1日，对美元中间价为6.5359\n\
    \    - 2011年，人民币兑美元升值1.24%\n\n- **贬值（或者“疲软”）**：按所能够买到的外国通货量衡量的一国通货的价值减少\n  - 例如：2022年5月17日，人民币……\n\
    \    - 对美元中间价为6.77\n    - 2022年1月1日，对美元中间价为6.3828\n    - 自今年年初以来，人民币跌了8%左右\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_1579_0.png)\n\n## 名义汇率\n\n- 名义汇率：一个人可以用一国通货交换另一国通货的比率\n\
    - 我们用每一单位国内通货可以兑换的外国通货来表示汇率\n- 在2011年4月27日的部分汇率\n\n每单位美元可以兑换：\n\n- 欧元（EUR）：0.6817\n\
    - 英镑（GBP）：0.6065\n- 日元（JPY）：81.6645\n\n### 讨论：货币贬值\n\n以下哪类人或企业会因美元贬值而高兴？\n\n-\
    \ A. 在欧洲旅行的美国旅游者\n- B. 俄罗斯伏特加酒的美国进口商\n- C. 向美国出口红酒的法国出口商\n- D. 进口美国钢铁的意大利进口商\n\
    - E. 向美国出口石油的沙特阿拉伯王子\n\n答案：D\n\n![](img/518b44ff56ad05e168220626515b534d_1581_0.png)\n\
    \n## 真实汇率\n\n- **真实汇率：** 一个人可以用一国物品与劳务交换另一国物品与劳务的比率\n\n- 真实汇率 = $\\frac{e \\times\
    \ P}{P^*}$\n  其中：\n  - $P$ = 国内价格\n  - $P^*$ = 国外价格（用外国通货衡量）\n  - $e$ = 名义汇率，就是每一单位国内通货可以兑换的外国通货\n\
    \n**一种物品的例子**\n\n一个巨无霸在美国的价格是 \\$2.50，在日本的价格是 400 日元。\n\ne = 120 日元/每美元\n\ne ×\
    \ P = 一个美国巨无霸的日元价格 = (120 日元/每美元) × (\\$2.50) = 300 日元/每个美国巨无霸\n\n计算真实汇率：\n\n\
    e × P / P* = 300 日元/每个美国巨无霸 / 400 日元/每个日本巨无霸 = 0.75 日本巨无霸/一个美国巨无霸\n\n![](img/518b44ff56ad05e168220626515b534d_1583_0.png)\n\
    \n**真实汇率的解释**\n\n> “真实汇率 = 0.75 日本巨无霸/一个美国巨无霸”\n\n解释：为在美国购买一个巨无霸，一个日本居民只需用在日本购买0.75个巨无霸的钱\n\
    \n### 讨论：计算真实汇率\n\ne = 10 比索/每美元\n\n一杯星巴克拿铁咖啡的价格：\nP = 3 美元（美国），P* = 24 比索（墨西哥）\n\
    \n- A. 用墨西哥比索表示一杯美国拿铁咖啡的价格\n- B. 计算真实汇率（一杯美国拿铁咖啡可以购买多少墨西哥拿铁咖啡）\n\n### 参考答案\n\n\
    e = 10 比索/每美元\n\n一杯星巴克拿铁咖啡的价格：\nP = 3 美元（美国），P* = 24 比索（墨西哥）\n\n**A. 用墨西哥比索表示一杯美国拿铁咖啡的价格**\n\
    \ne × P = （10 比索/每美元）×（3 美元/一杯美国拿铁咖啡）= 30 比索/一杯美国拿铁咖啡\n\n**B. 计算真实汇率**\n\n(e ×\
    \ P) / P* = （30 比索/一杯美国拿铁咖啡）/（24 比索/一杯墨西哥拿铁咖啡）= 1.25 杯墨西哥拿铁咖啡/一杯美国拿铁咖啡\n\n###\
    \ 有许多物品的真实汇率\n\nP = 美国的物价水平，比如消费物价指数，衡量一篮子物品的价格\nP* = 外国的物价水平\n真实汇率 = (e × P)\
    \ / P*\n= 国内得到的一篮子物品相对于国外得到的一篮子物品的价格\n\n如果美国真实汇率上升，那美国物品相对于外国物品变得更昂贵。\n\n### 结论\n\
    \n- 如果美国真实汇率 ↑，那美国物品相对于外国物品变得更昂贵\n- 如果美国真实汇率 ↓，那美国物品相对于外国物品变得相对便宜\n\n![](img/518b44ff56ad05e168220626515b534d_1588_0.png)\n\
    \n## 一价定律\n\n- **一价定律：** 一种物品在所有地方都应该按同样的价格出售\n  - 如果咖啡在西雅图的价格为 \\$4/每磅，在波士顿的价格为\
    \ \\$5/每磅，并且可以无成本地转运\n  - 这就存在**套利**的机会，人们可以在西雅图买进咖啡而在波士顿卖出咖啡，很快获得利润\n  - 套利的存在使西雅图咖啡的价格上升，而波士顿咖啡的价格下降。这个过程会一直持续到最终两个市场上的价格相同时为止\n\
    \n**咖啡豆**\n\n西雅图：\\$4/磅\n\n无成本转运\n\n波士顿：\\$5/磅\n\n![](img/518b44ff56ad05e168220626515b534d_1590_0.png)\n\
    \n**套利**\n\n结果：这个过程会一直持续到最终两个市场上的**价格相同**时为止\n\n![](img/518b44ff56ad05e168220626515b534d_1590_1.png)\n"
