  - '[PAGE 933]


    # 投入需求与产量供给之间的联系


    +   - 复习： 边际成本(MC)

    +     = 生产额外一单位产量的成本

    +     = ΔTC/ΔQ，其中 TC = 总成本

    +   - 如果 W = $2500， MPL = 500 蒲式耳

    +   - 如果 Jack 多雇佣一个工人，

    +     ΔTC = $2500， ΔQ = 500 蒲式耳

    +     MC = $2500/500 = $5 蒲式耳

    +   - 也就是： MC = W/MPL'
  - '[PAGE 934]


    # 投入需求与产量供给之间的联系


    +   - 因此： MC = W/MPL

    +   - 注意：

    +     - 为生产额外的产量，需要雇佣更多的劳动

    +     - 随着 L 的增加， MPL 下降...

    +     - W/MPL 会增加...

    +     - 也会使 MC 上升

    +   - 因此，边际产量递减与边际成本递增是同一枚硬币的两面'
  - '[PAGE 935]


    # 投入需求与产量供给之间的联系


    +   - 竞争企业劳动需求的规则：

    +     $P \times MPL = W$

    +   - 两边都除以 $MPL$：

    +     $P = W/MPL$

    +   - 用 $MC = W/MPL$ 替换：

    +     $P = MC$

    +   - 这是竞争企业产量供给的规则

    +   - 因此，投入需求与产量供给是同一枚硬币的两面'
