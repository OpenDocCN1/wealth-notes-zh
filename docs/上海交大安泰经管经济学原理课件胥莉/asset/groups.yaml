    # 长期平均总成本—三种不同规模的工厂


    在任何低于 $Q_A$ 的产量，企业在长期会选择规模 **S**


    生产在 $Q_A$ 与 $Q_B$ 之间的产量，企业在长期会选择规模 **M**


    生产高于 $Q_B$ 的产量，企业在长期会选择规模 **L**


