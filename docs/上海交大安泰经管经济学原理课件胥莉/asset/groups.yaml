    - 使市场已有企业面临的需求曲线向左移动。\n- 市场已有企业的产品需求减少，利润下降。\n\n## 短期中的垄断竞争企业(企业有利润)\n\n企业面临向下倾斜的需求曲线\n\
    在每个 Q, MR < P\n为利润最大化，企业生产产量直到 MR = MC\n企业使用需求曲线来设定价格 P\n\n## 短期中的垄断竞争企业\n\n短期经济亏损激励企业退出市场。随着企业退出：\n\
    \n- 顾客可选择的产品数量少了。\n- 增加了继续留在市场中的企业面临的需求。\n- 使继续留在市场中的企业的需求曲线向右移动。\n- 使继续留在市场中的企业的利润增加。\n\
    \n## 短期中的垄断竞争企业(企业亏损)\n\n对这个企业而言，在\nMR = MC\n时生产，\n此时\nP < ATC\n\n这个企业\n最好的对策是减少\n\
    损失\n\n![](img/518b44ff56ad05e168220626515b534d_569_0.png)\n\n## 长期中的垄断竞争企业\n\n\
    企业进入或退出的过程一直持续到市场中的企业的经济利润正好是零时。\n\n进入与退出市场会停止，直到\nP = ATC和\n利润=0\n\n注意企业在边际成本上面有一个价格的加成，并没有在ATC的最小处生产。\n\
    \n价格\nP=ATC\n0\n利润最大化产量\n产量\nMC\nATC\n需求\nMR\n\n## 垄断竞争市场的长期均衡\n\n- 两个特点\n  -\
    \ 正如在垄断市场一样，价格大于边际成本。\n    - 利润最大化要求边际收益等于边际成本。\n    - 向右下方倾斜的需求曲线使边际成本小于价格。\n\
    \  - 正如在竞争市场一样，价格等于平均总成本。\n    - 自由进入与退出使经济利润为零。\n\n## 比较完全竞争与垄断竞争\n\n| | 完全竞争\
    \ | 垄断竞争 |\n|---|---|---|\n| 卖者的数量 | 许多 | 许多 |\n| 自由进入/退出市场 | 是 | 是 |\n| 长期经济利润\
    \ | 零利润 | 零利润 |\n| 企业出售的产品 | 完全相同 | 不同 |\n| 企业有市场势力吗？ | 没有，价格接受者 | 有 |\n| 企业面临的需求曲线\
    \ | 水平 | 向右下方倾斜 |\n\n## 比较垄断与垄断竞争\n\n| | 垄断 | 垄断竞争 |\n|---|---|---|\n| 卖者的数量 |\
    \ 一个 | 许多 |\n| 自由进入/退出市场 | 不是 | 是 |\n| 长期经济利润 | 正利润 | 零利润 |\n| 企业有市场势力吗？ | 有 |\
    \ 有 |\n| 企业面临的需求曲线 | 向右下方倾斜\n(市场需求) | 向右下方倾斜 |\n| 相近的替代品 | 没有 | 许多 |\n\n## 垄断竞争与完全竞争\n\
    \n- 过剩生产能力\n  - 在长期中，完全竞争企业没有过剩生产能力。\n  - 竞争市场上的自由进入使企业生产平均总成本最小的产量，即企业的有效规模产量。\n\
    \  - 在长期中，垄断竞争企业存在过剩生产能力。\n  - 垄断竞争企业的产量低于完全竞争企业生产的有效规模产量。\n\n## 垄断竞争与完全竞争\n\n\
    ### (a) 垄断竞争企业\n\n### (b) 完全竞争企业\n\n价格\n\n产量\n\nP\n\nMC\n\nATC\n\n需求\n\n过剩生产能力\n\
    \n生产量\n\n有效规模\n\n价格\n\n产量\n\nP = MC\n\nMC\n\nATC\n\nP = MR\n(需求曲线)\n\n产量 = 有效规模产量\n\
    \n## 垄断竞争与完全竞争\n\n- 高于边际成本的价格加成\n  - 对一个竞争企业来说，价格等于边际成本。\n  - 对一个垄断竞争企业来说，价格高于边际成本。\n\
    \  - 因为垄断竞争企业的价格高于其边际成本，以该价格多销售出一个单位产品就意味着利润多了。\n\n## 高于边际成本的价格加成\n\n### (a) 垄断竞争企业\n\
    \n### (b) 完全竞争企业\n\n![](img/518b44ff56ad05e168220626515b534d_578_0.png)\n\n![](img/518b44ff56ad05e168220626515b534d_578_1.png)\n\
    \n## 垄断竞争和完全竞争\n\n### (a) 垄断竞争企业\n\n### (b) 完全竞争企业\n\n![](img/518b44ff56ad05e168220626515b534d_579_0.png)\n\
    \n过剩市场能力\n\n## 垄断竞争与社会福利\n\n- 垄断竞争市场并不具有完全竞争市场所具有的全部合意的福利特点\n- 因为 P > MC，垄断竞争市场的产量小于使社会有效率的产量\n\
    - 然而，政策制定者解决这个问题很困难：企业获得零利润，因此不能要求它们降低价格\n- 管制所有生产差异产品的企业的管理负担将是巨大的。\n- 垄断竞争可能引起社会无效率的另一个方面是市场上的企业数量可能并不是“理想”的数量，可能有太多或太少的企业进入。\n\
    \n## 垄断竞争与社会福利\n\n- 市场上企业的数量可能并不是理想的数量，这是因为与新企业进入市场相关的外部性：\n  - 产品多样化外部性：\n  \
    \  - 由于消费者从新产品引进中得到了一些消费者剩余，所以存在与进入相关的正外部性。\n  - 抢走业务的外部性：\n    - 由于其它企业从与新进入者的竞争者中失去顾客和利润，所以存在与进入相关的负外部性。\n\
    - 垄断竞争的无效率的模糊的，并且难以衡量。政策制定者没有简单易行的方法来改善市场结果\n\n## 讨论\n广告\n\n- 1. 目前为止，我们学习了三种市场结构：完全竞争，垄断与垄断竞争。在这三种市场结构中，你想企业花钱为它们的产品做广告吗？为什么会或者不会？\n\
    - \n- 2. 从社会的角度来说，广告是好事还是坏事？试着想出至少一个正反面\n\n## 广告\n\n- 在垄断竞争行业，产品差异与加成定价导致了广告的使用\n\
    - 一般来说，产品之间差别越大，企业在广告上的花费就越多\n- 经济学家关于广告的社会价值有不同的意见\n\n## 垄断竞争市场的广告竞争\n\n- 在垄断竞争市场，短期中，每一个生产有差别的厂商都可以在部分消费者中形成自己的垄断地位，处于完全垄断状态。\n\
    - 垄断竞争市场最需进行广告宣传\n\n- 可口可乐与百事可乐的差异\n  - 许多消费者对可口可乐与百事可乐有强烈的偏好，但测试结果却只有37%的人能准确识别出自己偏好的品牌\n\
    \  - “差异”是指消费者心目中的差异\n- Bayer的阿司匹林\n  - 化学测试显示，绝大多数阿司匹林在含量和溶解速度上几乎没有差别\n  - 但Bayer声称其阿司匹林是400余种同类产品中最好的，并因此遭到美国FTC的诉讼\n\
    \  - 消费者显然相信之，所以其价格是最贵的\n\n## 差异化：构筑进入壁垒和建立市场优势\n\n- 差异化是在位厂商建立和巩固自身市场地位的重要手段\n\
    \  - 努力加强用户对自身产品的使用偏好，提高其转移成本，如茶叶、咖啡，甚至毒品\n  - （通过广告等）强化用户对自身产品的认同，提高其收集其他产品信息的成本，尤其对于潜在进入者，可以提高进入壁垒\n\
    \  - 研究表明，后来品牌只能享有先行品牌75%的市场份额；如果要达到相同份额，则必须支出3.5 倍于先行者的广告费用\n\n## 差异化的关键\n\n\
    - 差异化以用户的（潜在）兴趣点为基础\n  - 当消费者开始感到兴趣，差异化就有了空间\n  - 当消费者开始感到厌倦，差异化就需要调整\n- 差异化：不是最好，而是特色\n\
    \  - 麦当劳是最好吃的食品吗\n    - 如何实现保持自身特色的质量控制\n\n## 非价格竞争\n\n垄断竞争厂商产品间有一定替代性，使厂商更着重于非价格竞争。\n\
    \n- 产品变异\n  - 变换产品的颜色、款式、质地、做工和附带服务等以形成产品差别\n- 推销活动\n  - 广告\n\n## 广告：产品差异化的重要手段\n\
    \n- 广告的价值\n  - 信息作用\n  - 说服作用\n- 不同的产品特性对广告的依赖程度不同\n  - 搜寻商品\n  - 经验商品\n  - 信任商品\n\
    - 不同的产业特征和产品特征，广告所起的作用是不同的\n\n## 广告的社会福利效果\n\n很难笼统地评价广告的福利效果，一般性讲：\n\n- 信息型广告会增加市场竞争并促进社会福利；\n\
    - 说服型广告有诱使消费者改变甚至扭曲消费行为的可能性。\n\n## 广告\n\n- 当企业销售有差异产品并收取高于边际成本的价格时，每个企业都有靠做广告来吸引更多顾客购买自己特殊产品的激励。\n\
    - 销售很大差异消费品的企业，通常都把收益的10%—20%用于广告支出。\n- 总体上，广告支出占企业总收益的2%左右，或者在1 000亿美元以上\n\n"
