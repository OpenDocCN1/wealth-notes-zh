  md: "\n## 对效用的理解——《钻石和木碗》\n\n- 一个穷人家徒四壁，只得头顶着一只旧木碗四处流浪。\n- 一天，穷人上了一只渔船去帮工。不幸的是，渔船在航行中遇到了特大风浪，船上的人几乎都淹死了，穷人抱着一根大木头，才得幸免于难。\n\
    - 穷人被海水冲到一个小岛上，岛上的酋长看见穷人头顶的木碗，感到非常新奇，便用一大口袋最好的珍珠宝石换走了木碗，派人把穷人送回了家。\n- 一个富翁听到了穷人的奇遇，心中暗想，一只木碗都能换回这么多宝贝，如果我送去很多可口的食物，该换回多少宝贝！于是，富翁装了满满一船山珍海味和美酒，找到了穷人去过的小岛。\n\
    - 酋长接受了富人送来的礼物，品尝之后赞不绝口，声称要送给他最珍贵的东西。富人心中小得意。一抬头，富人猛然看见酋长双手捧着的“珍贵礼物”，不由得愣住了！\n\
    \n说明物以稀为贵。\n\n## 两种效用理论\n\n- **基数效用**\n  - 效用的大小可以用基数（1，2，3，……）来表示，可以计量并加总求和。\n\
    \  - 基数效用论采用的是**边际效用分析法**。\n- **序数效用**\n  - 效用作为一种心理现象无法计量，也不能加总求和，只能表示出满足程度的高低与顺序，效用只能用序数（第一，第二，第三，……）来表示。\n\
    \  - 序数效用论采用的是**无差异曲线分析法**。\n\n### 基数效用——边际效用分析法\n\n- **效用U（Utility）**：消费者从商品消费中得到的满足程度。\n\
    - 消费者需求某种商品的目的是为了得到满足。\n  - 完全是消费者的一种主观心理感受。\n  - 满足程度高，效用大；\n  - 满足程度低，效用小。\n\
    \n> 萨缪尔森提出：幸福 = $\\frac{效用}{欲望}$\n>\n> 使幸福增加的有效方法是：\n> ◆ （1）欲望不变而提高效用；\n> ◆ （2）清心寡欲\n\
    \n### 总效用TU与边际效用MU\n\n- 总效用TU（Total Utility）：指人们从商品的消费中得到的总的满足程度。\n\n$$TU=f(Q)$$\n\
    \n- 边际效用MU（Marginal Utility）：每增加一个单位的商品消费量所增加的满足程度。\n\n$$MU=\\frac{\\Delta TU(Q)}{\\\
    Delta Q}$$\n\n$$MU=\\lim_{\\Delta Q\\to 0}\\frac{\\Delta TU(Q)}{\\Delta Q}=\\\
    frac{dTU(Q)}{dQ}$$\n\n| 例 | 消费量 | 边际效用MU | 总效用TU |\n|---:|---:|---:|---:|\n| \
    \ | 0 | 0 | 0 |\n|  | 1 | 30 | 30 |\n|  | 2 | 20 | 50 |\n|  | 3 | 10 | 60 |\n\
    |  | 4 | 0 | 60 |\n|  | 5 | -10 | 50 |\n\n- 面包的消费量从一个增加到两个，满足程度从5个效用单位增加到8个，即增加了3个效用单位。\n\
    \n### 总效用TU与边际效用MU的关系\n\n- 当MU > 0，TU↑；\n- 当MU < 0，TU↓；\n- 当MU = 0，TU最高点，总效用达到最大。\n\
    \  - 处于↑、↓的拐点\n- 总效用固定增加时，边际效用不变\n\n![](img/518b44ff56ad05e168220626515b534d_1025_0.png)\n\
    \n### 边际效用递减规律\n\n边际效用递减：随着对某商品消费量的增加，人们从该商品连续增加的每个消费单位中得到的满足程度逐渐下降。\n\n- 生理原因：兴奋度递减。\n\
    - 心理原因：人性。\n- 物品本身用途的多样性。\n\n| 消费量Q | 边际效用MU |\n| --- | --- |\n| 0 | 0 |\n| 1\
    \ | 30 |\n| 2 | 20 |\n| 3 | 10 |\n| 4 | 0 |\n| 5 | -10 |\n\n![](img/518b44ff56ad05e168220626515b534d_1026_0.png)\n\
    \n### 货币的边际效用\n\n- 货币如同商品一样，也具有效用。\n- 边际效用递减规律对货币也适用。\n- 随着货币的不断增加，货币边际效用递减。\n\
    - 消费者用货币购买商品，就是用货币的效用去交换商品的效用。\n- 在分析消费者行为时，通常假定货币的边际效用不变。\n- 因为：一般情况下，单位商品的价格只占消费者总货币收入量中的很小部分，支出的货币的边际效用的变化非常小，可以略去不计。\n\
    \n> “富人的钱不值钱，穷人的时间不值钱”。\n\n### 基数效用论消费者均衡的条件\n\n**消费者均衡的假设前提**\n\n- 消费者的偏好（嗜好）既定\n\
    - 消费者的收入既定\n- 商品的价格既定\n\n**消费者均衡的条件：**\n\n- 把全部收入用完。\n- 每一元钱都花在刀口上，每一元钱用在不同商品上的边际效用相等。\n\
    \n**效用最大化原则：**\n\n- 收入既定的情况下，\n- 消费者应使自己花费在各种商品购买上的最后一元钱所带来的边际效用相等。\n- 或者，消费者应该使自己所购买的各种商品的边际效用与价格之比相等。\n\
    \n### 简单的——两种商品均衡条件\n\n- M：消费者的收入\n- P1：1商品的价格\n- P2：2商品的价格\n- Q1：1商品的数量\n- Q2：2商品的数量\n\
    - MU1：1商品的边际效用\n- MU2：2商品的边际效用\n- MUm：每元钱的边际效用\n\nP1·Q1 + P2·Q2 = M（把钱用完）\nMU1/P1\
    \ = MU2/P2 = MUm（货真价实）\n\nIf: MU1/P1 < MU2/P2\n\n说明：对于消费者，同样的1元钱购买商品1的边际效用小于商品2的边际效用。\n\
    \n- 这样：理性消费者就会调整这两种商品的购买量：\n  - 减少商品1，\n  - 增加商品2。\n\n意味着：总效用会增加。\n直到两种商品的边际效用相等时，便获得最大效用。\n\
    \n### 需求曲线向右下方倾斜\n\n- 价格P与需求量呈反方向变动；\n- 边际效用递减，量增，愿意出价递减。\n\n![](img/518b44ff56ad05e168220626515b534d_1030_0.png)\n\
    \n> 价格不反映一件商品的总效用，而是反映它的边际效用。\n\n> 价值悖论：\n> ◆ 必需品（水）的市场价值很低；很少能交换到任何东西。\n> ◆ 奢侈品（钻石）使用价值很小，但市场价格很高，可以交换到大量其他物品。\n\
    \n- \U0001F534 对于任一商品来说，随着需求增加，MU递减。\n- \U0001F534 为了保证MU/P恒等于1，商品价格要同MU成比例地递减。\n\
    \n### 消费者剩余\n\n- 边际效用递减，所以，消费者愿意支付的价格逐步下降。\n- 但，消费者在购买商品时是按照实际市场价格支付的。\n- 于是，消费者愿意支付的价格和实际市场价格之间就存在一个差额，便构成**消费者剩余**的基础。\n\
    - 消费者剩余：消费者愿意支付的价格与实际支付的价格之间的差额。\n- 或者：消费者消费某种商品所获得的总效用与为此花费的货币总效用的差额。\n\n> -\
    \ 是消费者的主观心理评价\n> - 反映消费者通过购买商品所感受到福利改善\n\n### 消费者剩余的求解\n\n- 令反需求函数 $P_d=f(Q)$，价格为\
    \ $P_0$ 时的消费者的需求量为 $Q_0$\n- 消费者剩余 = 需求曲线以下、市场价格线之上的面积\n\n![](img/518b44ff56ad05e168220626515b534d_1032_0.png)\n\
    \n$$CS=\\int_{0}^{Q_0} f(Q)\\,dQ-P_0Q_0$$\n\n> 消费者愿意支付的总数量−消费者实际支付的总数量\n\n###\
    \ 序数效用论——无差异曲线分析法\n\n1. 消费者偏好\n2. 序数效用理论认为，效用只能根据偏好程度排列出顺序，即偏好。\n3. 即消费者能对可能消费的商品进行先后排列。\n\
    \n**理性消费者的三大基本偏好**\n\n第一，完全性。可以明确比较和排列不同商品组合。要么 A<B；要么 A=B；要么 A>B。\n\n第二，可传递性。如果\
    \ A>B，B>C，那么，A>C。\n\n第三，非饱和性。对每一种商品的消费都没有达到饱和点。对任何商品，总认为多比少好。\n\n### 预算约束：消费者买得起什么\n\
    \n- 预算约束线——对消费者可以承受的消费组合的限制。\n- 预算约束线表示给定收入和两种商品的价格，消费者所能买得起的消费组合。\n  - 人们之所以消费得比他们愿意的少，是因为他们受到收入的限制。\n\
    \n### 消费者的预算约束线\n\n- 预算约束线上任何一点表示了消费者的消费组合或者两种商品之间的权衡取舍。\n- 例如，如果消费者不买比萨饼，他就可以购买500ml的百事可乐（B点）。如果他不买百事可乐，他就可以购买100个比萨饼（A点）。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1037_0.png)\n"
