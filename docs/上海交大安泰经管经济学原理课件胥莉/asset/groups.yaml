  - '[PAGE 740]


    # 规模经济与规模不经济


    +   - 当长期平均总成本随着产量增加而减少时，可以说存在**规模经济**。

    +   - 当长期平均总成本随着产量增加而增加时，可以说存在**规模不经济**。

    +   - 当长期平均总成本不随着产量变动而变动时，可以说存在**规模收益不变**。'
