    # 完全竞争市场简评：优缺点


    +   - 完全竞争市场的缺点：

    +     - 第一，各企业的平均成本最低并不一定是社会成本最低。

    +     - 第二，产品无差别，消费者的多种需求无法得到满足。

    +     - 第三，生产者的规模都很小，就没有能力去实现重大的科学技术突破，不利于技术发展。

    +     - 第四，在实际中完全竞争的情况是很少的，而且，竞争一般必然引起垄断。'
