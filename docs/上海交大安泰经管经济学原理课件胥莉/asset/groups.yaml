    - 两种影响哪种更大？这要取决于需求价格弹性\n\n## 总收益与需求价格弹性的关系\n\n总收益是一种物品买者的支付量和卖者得到的量。用该物品的价格乘以销售量来计算。\n\
    \nTR = P x Q\n\nP x Q = $400\n总收益\n\n价格\n\n数量\n\n$4\n\n0\n\n100\n\nP\n\nQ\n\n\
