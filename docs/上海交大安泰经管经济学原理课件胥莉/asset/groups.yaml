  - '[PAGE 742]


    # 生产规模变动时平均总成本如何变动


    +   - 规模经济的产生是因为较高的产量水平允许工人实现专业化：专业化可以使工人更精通某一项工作

    +     - 在产量低时，规模经济更常见

    +   - 规模不经济的产生是由于任何一个大型组织中固有的协调问题

    +     例如：管理团队越庞大，成本控制就越困难

    +     - 当产量高时，规模不经济更常见'
