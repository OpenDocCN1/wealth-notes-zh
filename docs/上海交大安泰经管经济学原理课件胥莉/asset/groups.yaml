    # 需求曲线向右下方倾斜


    +   - 价格P与需求量呈反方向变动；

    +   - 边际效用递减，量增，愿意出价递减。


    ![](img/518b44ff56ad05e168220626515b534d_1030_0.png)


    > 价格不反映一件商品的总效用，而是反映它的边际效用。


    > 价值悖论：

    > ◆ 必需品（水）的市场价值很低；很少能交换到任何东西。

    > ◆ 奢侈品（钻石）使用价值很小，但市场价格很高，可以交换到大量其他物品。


    +   🔴 对于任一商品来说，随着需求增加，MU递减。

    +   🔴 为了保证MU/P恒等于1，商品价格要同MU成比例于递减。'
