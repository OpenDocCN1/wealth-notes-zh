    # 例子：小镇移动电话的双头


    +   - 双寡头会在垄断的结果上达成一致。

    +   - 勾结：一个市场上的企业之间就生产的产量或收取的价格达成的协议

    +   - T-Mobile 和 V-Mobile 就各自生产垄断产量的一半达成协议：

    +     - 每个企业： Q = 30, P = $40, 利润 = $900

    +   - 卡特尔：两个企业联合起来，采取一致行动。

    +     比如： T-Mobile 和 V-Mobile 勾结决定的产量

    +     - 虽然寡头希望形成卡特尔并赚到垄断利润，但这往往是不可能的，反托拉斯法把禁止寡头之间的公开协议作为公共政策的重点。'
