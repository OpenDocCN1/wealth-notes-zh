    # 现值：衡量货币的时间价值


    +   - 现值——用现行利率带来一定量未来货币所需要的现在货币量。

    +   - 未来价值——在现行利率为既定时，现在货币量将带来的未来货币量。

    +   - 货币的时间价值是按照复利计算的，其公式为： FV=PV（1+r）t

    +   - 将未来的货币转换成现在的货币，若利率是 r ，则 t 年后收到的货币量 X 的现值是：其公式为： PV=FV/（1+r）t'
