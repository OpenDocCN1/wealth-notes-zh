    # 经济学产生的前提：稀缺(Scarcity)


    +   - 经济这个词来源于希腊语，其意为“管理一个家庭的人”。

    +   - 由于资源稀缺，社会资源的管理就是重要的。

    +   - **稀缺性**：指社会拥有的资源是有限的，因此不能生产人们希望拥有的所有物品和劳务。


    > **稀缺**　指相对于人们无穷的欲望而言，资源是稀少短缺的'
