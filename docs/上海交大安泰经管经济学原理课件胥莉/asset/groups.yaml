    +   - **有效市场假说（EMH）：** 认为资产价格反映了关于一种资产价值的所有公开的、可获得的信息的理论。'
  - '[PAGE 1392]


    # 有效市场假说的含义


    +   - 股票市场是**信息有效的**：

    +     每种股票价格反应了有关公司价值的所有可获得的信息

    +   - 股票价格应该是**随进行走的**：

    +     只有改变公司价值的市场感觉的新闻才能改变股票价格。但新闻是不可预期的，所以股票价格的变动也是不可预期的

    +   - 系统性地胜过市场是不可能的。当你得到新闻的时候，共同基金的管理者早已对此作出反应'
  - '[PAGE 1393]


    # 指数基金与管理基金


    +   - **指数基金**是一种按照既定股票指数购买所有股票的共同基金

    +   - 积极管理的共同基金的目标是只购买最好的股票

    +   - 积极管理基金收取的费用比指数基金要高

    +   - 有效市场假说（EMH）意味着积极管理的基金的收益不可能一直大于指数基金的收益'
