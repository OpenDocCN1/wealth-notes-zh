  - '[PAGE 1593]


    # 购买力平价


    +   - 购买力平价意味着名义汇率等于外国物价水平与国内物价水平的比率


    ```

    e = P* / P

    ```


    +   - 如果两个国家有不同的通货膨胀率，那名义汇率会发生变化：


    +     - 如果日本的通货膨胀率高于美国，那P*上升的速率要快于P，因此名义汇率上升 —— 美元相对于日元升值


    +     - 如果美国的通货膨胀率高于日本，那P上升的速率要快于P*，因此名义汇率下降 —— 美元相对于日元贬值'
  - '[PAGE 1594]


    # 购买力平价理论的局限性


    名义汇率并不总是反映两个国家之间物价水平的两个原因：


    +   - 许多物品是不容易进行贸易的

    +     - 例如：理发，看电影

    +     - 套利不能消除这些物品之间的价格差

    +   - 即使是可贸易物品，当它们在不同国家生产时，也并不总能完全替代

    +     - 例如，一些美国消费者相对于丰田汽车更偏爱雪佛兰，反之亦然

    +     - 价格差别反映了嗜好的不同'
