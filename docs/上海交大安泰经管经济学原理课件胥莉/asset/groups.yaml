    ## 短期经济波动的基本模型


    - 两个变量被用来建立模型分析短期经济波动。

    - 用实际GDP衡量的经济中的物品与劳务的产量。

    - 用CPI或GDP平减指数衡量的物价总水平。


    ## 经济波动的基本模型


    - 总需求与总供给基本模型

    - 经济学家用**总需求与总供给**模型来解释经济活动围绕其长期趋势的短期波动的模型。

    - **总需求曲线**——一条表示在每一种物价水平下，家庭、企业和政府想要购买的物品与劳务量的曲线。

    - **总供给曲线**——一条表示在每一种物价水平下，企业选择生产并销售的物品与劳务量的曲线。


    ## 总需求与总供给模型


    物价水平


    模型决定了均衡物价水平


    均衡产出(真实 GDP)


    ![](img/518b44ff56ad05e168220626515b534d_1676_0.png)


    ## 总需求（AD）曲线


    总需求曲线告诉我们在任何一种既定的物价水平时经济中所有物品与劳务的需求量


    ![](img/518b44ff56ad05e168220626515b534d_1678_0.png)


    ## 为什么总需求曲线向右下方倾斜


    - Y = C + I + G + NX

    - 假设G由政府政策固定

    - 为了解总需求曲线为什么向右下方倾斜，我们必须考察物价水平如何影响用于消费，投资和净出口的物品与劳务需求量


    ![](img/518b44ff56ad05e168220626515b534d_1679_0.png)


    ## 总需求曲线


    - GDP (Y) 的四个组成部分对物品与劳务的总需求做贡献。

    - Y = C + I + G + NX

    - 通过财富、利率和汇率三个效用，使得国民收入与物价水平呈反方向变动。

    - 物价水平与消费：财富效应

    - 物价水平与投资：利率效应

    - 物价水平与净出口：汇率效应


    ## 利率效应（物价水平与投资）


    假设物价水平上升：


    - 购买物品与劳务需要更多的货币

    - 为了得到货币，人们出售债券或其他资产

    - 这使利率上升


    结果：投资降低

    （回忆：投资与利率负相关）


    ## 汇率效应（物价水平与净出口）


    假设物价水平上升：


    - 美国利率上升（利率效应）

    - 外国投资者想要更多的美国债券

    - 外汇市场上对美元的需求增加

    - 美元升值

    - 美国出口物品相对于外国人而言变得更贵，而美国居民觉得进口的物品变得更便宜


    结果：净出口减少


    ## 总需求曲线的斜率：总结


    物价水平的上升减少物品与劳务的需求量，因为：


    - **财富效应**（消费减少）

    - **利率效应**（投资减少）

    - **汇率效应**（净出口减少）


    ![](img/518b44ff56ad05e168220626515b534d_1684_0.png)


    ## 总需求曲线的移动


    - 移动起因于

    - 消费

    - 投资

    - 政府购买

    - 净出口

    - 消费、投资、政府购买和净出口等的增加，都会在同样的价格水平上，引起社会支出的增加，总需求曲线向右移动，反之则向左移动。


    ## 为什么总需求曲线会移动


    任何改变消费，投资，政府购买或净出口的事件—除物价水平的变动—都会移动总需求曲线


    例如：股市繁荣使家庭觉得更富有，消费增加，总需求曲线向右移动


    ![](img/518b44ff56ad05e168220626515b534d_1686_0.png)


    ## 为什么总需求曲线会移动


    - 消费变动引起的移动

    - 股市繁荣/大跌

    - 偏好变化：消费与储蓄之间的权衡取舍

    - 增税/减税

    - 投资变动引起的移动

    - 企业购买新计算机，设备和建造新工厂

    - 乐观预期/悲观预期

    - 利率，货币政策

    - 投资税收优惠或其他税收激励


    ## 为什么总需求曲线会移动


    - 政府购买变动引起的移动

    - 联邦政府的支出，如国防开支

    - 州和地方政府支出，如公路、学校

    - 净出口变动引起的移动

    - 购买我们出口产品的国家经济的繁荣/衰退

    - 外汇市场上国际投机者引起货币升值/贬值


