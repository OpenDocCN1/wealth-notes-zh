  - '[PAGE 735]


    # 典型的成本曲线


    +   - 成本曲线的三个重要特征

    +     - 随着产量增加，边际成本最终要上升。

    +     - 平均总成本曲线是U型的。

    +     - 边际成本曲线与平均总成本曲线在平均总成本最低点相交。'
  - '[PAGE 736]


    # 短期与长期成本


    对许多企业来说，总成本分为固定和可变成本取决于所考察的时间长短。


    +   - **短期**：生产者来不及调整全部生产要素的数量，至少有一种生产要素的数量固定不变的时间周期。在短期中一些成本是固定的。

    +   - **长期**：生产者可以调整全部生产要素的数量的时间周期。在长期中成本都是可变的。


    由于许多成本在短期中是固定的，但在长期中是可变的，所以企业的长期成本曲线不同于其短期成本曲线。'
  - '[PAGE 737]


    # 长期平均总成本—三种不同规模的工厂


    企业能选择三种不同的工厂规模：**S, M, L.**


    每种规模都有它的短期平均总成本曲线


    企业能在长期里选择一个不同的工厂规模，而在短期里则不能


    ![](img/518b44ff56ad05e168220626515b534d_737_0.png)'
