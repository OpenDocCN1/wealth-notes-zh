    ![](img/518b44ff56ad05e168220626515b534d_797_0.png)\n\n## 长期：有进入与退出的市场供给\n\n-\
    \ 长期\n  - 既指企业可根据市场需求变化而调整生产规模的时期，又指企业有时进入或退出行业的时期。\n- 企业进入或退出市场，直到经济利润为零。\n-\
    \ 在长期中，价格等于最小平均总成本。\n\n## 长期：进入与退出市场\n\n- 长期中，由于企业的进入与退出市场，企业数量会发生变化\n- 如果市场上的企业获得正的经济利润：\n\
    \  - 新企业会进入，短期市场供给向右移动\n  - 价格下降，利润降低，企业进入速度减慢\n- 如果市场上的企业有亏损：\n  - 一些企业会退出市场，短期市场供给向左移动\n\
    \  - 价格上升，减少仍在市场上企业的损失\n\n## 零利润条件\n\n- **长期均衡：**\n  在进入和退出过程结束时，仍然留在市场中的企业的经济利润必定为零\n\
    - 当 P = ATC 时，经济利润为零\n- 由于企业在 P = MR = MC 处生产，零利润条件是\n  P = MC = ATC\n- 复习：MC\
    \ 曲线在 ATC 曲线的最低点与 ATC 曲线相交\n- 因此，在长期，**P = 最小的 ATC.**\n\n## 如果企业利润为零，为什么它们要留在市场？\n\
    \n- 记住，经济利润是收益减去所有的成本–包括隐性成本，比如所有者用于经营的时间的机会成本和金钱的成本\n- 在零利润均衡时：\n  - 企业的收益必须能补偿能够补偿所有者的上述机会成本\n\
    \  - 会计利润为正\n\n## 长期：有进入与退出的市场供给\n\n- 行业的长期调整方式\n  - 行业中企业数量的变动\n    - 有经济利润=>新企业进入=>行业供给增加=>价格下降=>经济利润消失\n\
    \    - 存在亏损=>老企业退出=>行业供给减少=>价格上升=>亏损消失\n  - 原有企业经营规模的变动\n    - 扩大规模=>成本降低=>获得经济利润=>其他企业跟进=>行业供给增加=>价格下降=>经济利润消失=>规模不再变动\n\
    - 长期市场供给曲线是这一价格时的水平线。\n\n## 作为价格与平均总成本之间面积的利润\n\n![](img/518b44ff56ad05e168220626515b534d_803_0.png)\n\
    \n## 作为价格与平均总成本之间面积的利润\n\n**b. 亏损企业——退出市场**\n\n![](img/518b44ff56ad05e168220626515b534d_804_0.png)\n\
    \n价格\n\nATC\n\nP\n\nMC\n\nATC\n\nP = AR = MR\n\n亏损\n\n亏损最小化产量\n\nQ\n\n产量\n\n0\n\
    \n## 有进入与退出的市场供给\n\n![](img/518b44ff56ad05e168220626515b534d_805_0.png)\n\n**(a)\
    \ 企业零利润状态**\n\n**(b) 市场供给**\n\n左图坐标轴：纵轴为“价格”，横轴为“产量（企业）”；曲线包括 MC 和 ATC，虚线表示 $P=\\\
    text{最小 ATC}$。\n\n右图坐标轴：纵轴为“价格”，横轴为“产量（市场）”；市场供给曲线为水平线。\n\n## 长期：有进入与退出的市场供给\n\
    \n- 在这种进入和退出过程结束时，仍然留在市场中的企业必定得到零经济利润。\n- 只有当价格与平均总成本被推向相等时，进入与退出过程才结束。\n- 竞争市场长期均衡一定是企业在其有效规模时运行。\n\
