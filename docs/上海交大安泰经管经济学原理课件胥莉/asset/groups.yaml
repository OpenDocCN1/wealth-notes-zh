  - '[PAGE 27]


    # 关于古典学派的不同定义


    # 马克思


    • 古典经济学——在资本主义处于上升时期代表着进步力量的政治经济学


    • 庸俗经济学——为资本主义制度进行辩护，代表资产阶级利益，热衷于对经济体系的表面现象进行研究的经济理论


    # 凯恩斯


    从斯密起到凯恩斯之前的理论：将当代西方经济学所认为是新古典经济学的理论也包括在内


    # 熊彼特


    斯密被归为重商主义，1790-1879 年间的经济理论属于古典经济学。


    # 主流观点


    从斯密《国民财富的性质和原因的研究》出版开始到马歇尔《经济学原理》出版之前这段时期的理论'
  - '[PAGE 28]


    # 新古典经济学：19世纪中后期-20世纪初期


    # 时代背景：资本主义由竞争向垄断过渡


    +   - 特点：边际分析与数量分析

    +   - “边际革命”：

    +     - 边际效用论：门格尔、杰文斯、瓦尔拉斯

    +     - 边际生产力分配论：克拉克

    +   - 马歇尔及其《经济学原理》

    +     - 第二次综合

    +     - 当代西方微观经济学的形成

    +     - 局部均衡分析

    +   - 一般均衡分析

    +   - 微观经济学的进一步发展：

    +     - 不完全竞争，制度，福利'
