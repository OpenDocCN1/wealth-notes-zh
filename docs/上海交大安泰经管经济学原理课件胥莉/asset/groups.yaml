    # 序数效用论——无差异曲线分析法


    +   1. 消费者偏好

    +   2. 序数效用理论认为，效用只能根据偏好程度排列出顺序，即偏好。

    +   3. 即消费者能对可能消费的商品进行先后排列。


    理性消费者的三大基本偏好


    第一，完全性。可以明确比较和排列不同商品组合。要么 A<B；要么 A=B；要么 A>B。


    第二，可传递性。如果 A>B，B>C，那么，A>C。


