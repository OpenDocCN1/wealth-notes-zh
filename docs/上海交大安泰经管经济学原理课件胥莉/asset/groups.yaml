  md: "\n## 广告的批评者\n- 广告的批评者\n- 社会花钱在广告上是浪费资源\n- 企业做广告是为了操纵人们的偏好。\n- 广告抑制了竞争－它制造了一种错觉，使消费者认为产品之间的区别要大于它们实际上所具有的区别，这样便可以有更高的价格加成\n\
    \n## 广告的辩护者\n- 广告的辩护者\n- 企业用广告向顾客提供信息。企业愿意用大量的钱来做广告，这本身就向消费者传递了一个所提供产品质量的信息。\n\
    - 得到信息的买者能更容易找到和发现价格之间的不同\n- 因此，广告促进了竞争，为顾客提供了更多的产品和价格，并减少了市场势力\n\n- 一个著名研究的结果表明：\n\
    禁止眼镜生产者做广告的州的眼镜价格要高于那些不限制做广告的州的眼镜价格\n\n## 关于品牌的批评\n- 品牌的批评者相信：\n- 品牌使消费者感觉到实际上并不存在的差别\n\
    - 消费者对有品牌物品支付意愿更大是广告引起的一种非理性\n- 取消政府对商标的保护会减少品牌的影响，并降低价格\n\n## 关于品牌的辩护\n- 品牌的辩护者相信：\n\
    - 品牌是消费者保证他们购买的物品具有高质量的一种有用方法。\n  - 品牌给消费者提供关于它们质量的信息\n  - 向企业提供了保持高质量的激励。企业有激励保持它们品牌的质量，这是为了保持品牌的声誉\n\
    \n## 结论\n- 有差别的产品到处都是，这都是垄断竞争的例子\n- 垄断竞争理论描述了经济中的许多市场，然而并没有给政策制定者提供多少能够用来促进市场配置资源的方法\n\
    \n## 第17章 寡头\n\n## 本章我们将探索这些问题的答案：\n- 寡头市场的可能结果是什么？\n- 为什么寡头企业很难合作？\n- 反托拉斯法如何用来增加竞争？\n\
    \n## 在垄断和完全竞争之间\n\n**不完全竞争**——一个完全竞争和纯垄断之间的市场结构。\n\n**不完全竞争**产业中的企业有竞争对手，但同时又没有面临使它们成为价格接受者的激烈竞争。\n\
    \n## 不完全竞争市场的类型\n- **寡头**\n  - 只有少数几个卖者的市场结构，每个卖者都提供与其企业相似或相同的产品。\n- **垄断竞争**\n\
    \  - 很多企业出售相似但不相同的产品。\n\n## 集中度的衡量\n- **集中度：** 市场上最大的几家企业供应的产量占市场总产量的百分比\n- 集中度越高，竞争越少\n\
