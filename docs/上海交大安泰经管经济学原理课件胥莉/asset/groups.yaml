    \n![](img/518b44ff56ad05e168220626515b534d_1262_1.png)\n\n## 不同的增长经历\nThe Variety\
    \ of Growth Experiences\n\n![](img/518b44ff56ad05e168220626515b534d_1263_0.png)\n\
    \n## 生产率:作用及决定因素\n\n- 生产率在决定世界上所有国家的\n生活水平方面起着关键的作用。\n- 生产率是指一个工人在每个单位劳动\n时间生产的物品与劳务的数量。\n\
    \n## 生产率\n\n- 第一章中的经济学十大原理之一：一国的生活水平取决于它生产物品与劳务的能力\n- 这种能力取决于**生产率**：每单位劳动投入所生产的物品和劳务的数量。\n\
    - Y = 真实GDP = 生产物品与劳务的数量\n  L = 劳动数量\n  因此生产率 = Y/L（人均产出）\n\n## 为什么生产率如此重要\n\n\
    - 当一个国家的工人的生产率很高，那它的真实GDP和收入都会很高\n- 如果生产率快速增长，那么生活水平也会提高很快\n- 那么什么决定了生产率及其增长率？\n\
    \n## 生产率是如何决定的\n\n- 用于生产物品与劳务的投入被称为**生产要素**\n- 生产要素直接决定了生产率。\n- 生产要素\n  - 物质资本\n\
    \  - 人力资本\n  - 自然资源\n  - 技术变革\n\n经济增长最终要受到资源的限制。\n\n## 生产率是如何决定的\n\n- **物质资本**\n\
    \  - 是生产出来的生产要素。\n    - 它是生产过程的投入，也是过去生产过程的产出。\n  - 是用于生产物品与劳务的设备与建筑物的存量。\n  \
    \  - 用于生产或修理汽车的工具。\n    - 用于生产家具的工具。\n    - 办公楼，学校等等...\n\n## 人均物质资本\n\n- 用于生产物品和劳务的设备和建筑物存量称为\
    \ [物质]资本，用K表示\n- K/L = 人均资本\n- 如果普通工人有更多的资本（机器，设备等），那么生产率会更高\n- 就是说： K/L的增加导致Y/L的增加\n\
    \n## 生产率是如何决定的\n\n- **人力资本**\n  - 经济学家用来指工人通过教育、培训和经验而获得的知识和技能的一个术语。\n  - 和物质资本一样，人力资本提高一个国家生产物品与劳务的能力。\n\
    \  - 人力资本是指把这些理解传递给劳动力的资源消耗\n\n## 人均人力资本\n\n- **人力资本 (H)**: \n  工人通过教育、培训和经验而获得的知识与技能\n\
    - H/L = 普通工人的人力资本\n- 如果普通工人有更多的人力资本（知识、技能等），那生产率会更高\n- 就是说： H/L 的增加会导致 Y/L 的增加\n\
    \n## 生产率是如何决定的\n\n- 自然资源\n- 由自然界提供的用于生产物品与劳务的投入，如土地、河流和矿藏。\n- 可再生资源包括树木和森林。\n\
    - 不可再生资源包括石油和煤炭。\n- 可能是重要的，但它们并不是一个经济体生产物品与劳务中生产率高的必要条件。\n\n## 生产率是如何决定的\n\n-\
    \ 自然资源\n  - 其他条件相同的情况下，一个国家有更多的N便可以生产出更多的Y\n  - N/L的增加会导致Y/L的增加\n- 一些国家很富裕是因为它们拥有丰富的自然资源\n\
    \  （比如沙特阿拉伯有大量的石油）\n- 但国家并不需要有大量的自然资源才能使自己富裕\n  （比如日本进口它所需的自然资源）\n\n## 生产率是如何决定的\n\
    \n- 技术变革\n  - 社会对生产物品与劳务的最好方法的理解（技术知识）。\n  - 经济增长更多地是依靠技术变革。\n  - 技术进步并不仅仅意味着更快的计算机，更清晰的电视，或者更小的手机\n\
    \  - 它意味着能提高生产率的一切高级知识(使社会从已有的资源中得到更多的产出)\n    - 比如亨利·福特和生产线\n\n## 技术知识与人力资本\n\
    \n- 技术知识是指社会对如何生产物品和劳务的理解\n- 人力资本源于人们为获得这种知识所做的努力\n- 两者对于生产率都很重要\n\n## 生产函数\n\n\
    - 如果给定任何一个正数x，下式成立，则该生产函数的规模收益不变。\n\nxY = A F(xL, xK, xH, xN)\n\n- 这就是说，投入翻番(每种投入数量乘以2)就会使产出翻番。\n\
    \n2Y = A F(2L, 2K, 2H, 2N)\n\n- 所有投入数量增加10% (每种投入数量乘以1.1)会使产出也增加10%：\n\n1.1Y =\
    \ A F(1.1L, 1.1K, 1.1H, 1.1N)\n\n## 生产函数\n\n- 这个公式说明，生产率 $(Y/L)$ 取决于每个工人的物质资本\
    \ $(K/L)$、每个工人的人力资本 $(H/L)$、每个工人的自然资源 $(N/L)$，以及技术状况 $(A)$。\n- 技术的变革在经济增长中十分重要。\n\
    \n## 经济增长和公共政策\n\n接下来我们转向公共政策，看看哪些政策可以促进生产率的长期增长和提高生活水平\n\n## 储蓄和投资\n\n- 我们可以通过投资来增加资本，以提高生产率\n\
    - 因为资源是稀缺的，把更多资源用于生产资本就要求把较少资源用于生产现期消费的物品与劳务\n- 降低消费 = 增加储蓄\n  增加的储蓄向投资物品的生产提供资金（下章将更详细地考察具体细节）\n\
    - 因此，当期与未来的消费之间存在一种权衡取舍\n\n## 储蓄与投资的重要性\n\n- 提高未来生产率的一种方法就是把更多现期资源投资于资本的生产。\n\
    - 在长期中，储蓄是投资的来源，投资规模与经济增长正相关，所以储蓄是长期中经济增长的源泉，投资则直接带动经济的增长。\n\n## 收益递减与追赶效应\n\n\
    - 政府可以实施提高储蓄和投资的政策，K增加会提高生产率和生活水平\n- 随着资本存量的增加，从增加的一个单位资本中生产的额外产量减少。这种特性被称为收益递减。这是高储蓄未必带动高增长的一个原因。\n\
    - 因为收益递减，储蓄率增加所引起的更高的增长只是暂时的。\n\n## 收益递减与追赶效应\n\n- 正是因为收益递减，发展中国家投资规模小，其收益要高于投资规模大的发达国家，这就是追赶效应。\n\
    - 追赶效应是指在其他条件相同的情况下，如果一国开始时较穷，它要迅速增长是容易的。\n- 在长期中，高储蓄率引起高水平的生产率和收入，但在这些变量中并没有高增长。\n"
