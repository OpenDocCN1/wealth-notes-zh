    \n## 绝对优势\n\n- 牧民生产一盎司土豆只需要10分钟，而农民则需要15分钟。\n- 牧民生产一盎司牛肉只需要20分钟，而农民则需要60分钟。\n\
    - 牧民在生产牛肉和土豆方面都有绝对优势。\n\n## 比较优势与贸易\n\n谁有绝对优势？\n\n农民还是牧民？\n\n谁有比较优势？\n\n农民还是牧民？\n\
    \n## 牛肉和土豆的机会成本\n\n|  | 一盎司牛肉的机会成本 | 一盎司土豆的机会成本 |\n| --- | --- | --- |\n| 农民 |\
    \ 4盎司土豆 | 1/4盎司牛肉 |\n| 牧民 | 2盎司土豆 | 1/2盎司牛肉 |\n\n## 比较优势与贸易\n\n- 牧民生产一盎司土豆的机会成本是1/2盎司牛肉，而农民生产一盎司土豆的机会成本是1/4盎司牛肉。\n\
    - 牧民生产一盎司牛肉的机会成本是2盎司土豆，而农民生产一盎司牛肉的机会成本是4盎司土豆。\n- 农民在生产土豆上有比较优势，牧民在生产牛肉上有比较优势\n\
    \n## 比较优势与贸易\n\n- 贸易的利益来源于比较优势（机会成本的不同）\n- 当每个国家专门生产具有比较优势的物品时，所有国家的总产量会更高，世界的“经济蛋糕”也会更大\n\
    - 这也同样适用于个体生产者（比如农民和牧场工人）专业生产不同的产品，并彼此贸易\n\n## 比较优势与贸易\n\n- 亚当·斯密在1776年的著作《国民财富的性质和原因的研究》中，对贸易和相互依存就进行了详细的分析，至今经济学家还继承了这一分析。\n\
    - 李嘉图在1817年的著作《政治经济学及赋税原理》中，提出了我们现在熟知的比较优势原理。\n\n## 讨论：绝对优势与比较优势\n\n### 巴西在生产咖啡上有绝对优势：\n\
    \n- 巴西生产1磅咖啡仅需要1个劳动小时，而阿根廷需要2个劳动小时\n\n### 阿根廷在生产酒上有比较优势：\n\n- 阿根廷生产1瓶酒的机会成本是2磅咖啡，因为生产1瓶酒需要4个小时，而4个小时可以生产2磅咖啡\n\
    - 巴西生产1瓶酒的机会成本是5磅咖啡\n\n## 西方经济学的科学因素和阶级属性\n\n- 内容主要来自《西方经济学》（第1版），高等教育出版社/人民教育出版社\n\
    - **科学的一面**\n  - 对资本主义市场经济运行的分析方面比较系统\n  - 对微观、宏观经济政策的分析有实际意义\n- **阶级性**\n  -\
    \ 为资产阶级经济利益辩护和服务，如不承认剩余价值的来源……\n- **应有的态度**\n  - 以马克思主义为指导，立足中国国情，在批判中借鉴\n\n##\
    \ 西方经济学的研究对象\n\n- 对西方经济学研究对象的评析\n  - 研究生产关系还是研究稀缺性\n    - 研究生产关系还是研究物与物之间的关系\n\
    \  - 对资本主义生产过程的分析\n    - 着眼于其中的资本主义生产方式的实现还是物质技术关系\n  - 对资本主义制度的看法：为其辩护\n  - 关于市场的作用。\n\
    \n## 如何看待西方经济学的研究方法\n\n- **均衡假设不完全现实**\n  - 经济体系处在持续的变化之中\n  - 均衡可能是偶然，而非均衡可能是常态\n\
    - **演绎法不能揭示经济现象的复杂性和历史性**\n  - 重演绎轻归纳，有局限性\n- **数学滥用导致经济学形式化**\n  - 诺奖得主里昂惕夫：专业经济学杂志上连篇累牍地充满了数学公式，这使读者从一套似乎有理而完全是任意的假说引到精确的但却是无关的理论结论\n"
