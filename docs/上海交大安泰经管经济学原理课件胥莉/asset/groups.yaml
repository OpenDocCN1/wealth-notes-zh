    \n### 消费者剩余\n\n- 边际效用递减，所以，消费者愿意支付的价格逐步下降。\n- 但，消费者在购买商品时是按照实际市场价格支付的。\n- 于是，消费者愿意支付的价格和实际市场价格之间就存在一个差额，便构成**消费者剩余**的基础。\n\
    - 消费者剩余：消费者愿意支付的价格与实际支付的价格之间的差额。\n- 或者：消费者消费某种商品所获得的总效用与为此花费的货币总效用的差额。\n\n> -\
    \ 是消费者的主观心理评价\n> - 反映消费者通过购买商品所感受到福利改善\n\n### 消费者剩余的求解\n\n- 令反需求函数 $P_d=f(Q)$，价格为\
    \ $P_0$ 时的消费者的需求量为 $Q_0$\n- 消费者剩余 = 需求曲线以下、市场价格线之上的面积\n\n![](img/518b44ff56ad05e168220626515b534d_1032_0.png)\n\
    \n$$CS=\\int_{0}^{Q_0} f(Q)\\,dQ-P_0Q_0$$\n\n> 消费者愿意支付的总数量−消费者实际支付的总数量\n\n###\
    \ 序数效用论——无差异曲线分析法\n\n1. 消费者偏好\n2. 序数效用理论认为，效用只能根据偏好程度排列出顺序，即偏好。\n3. 即消费者能对可能消费的商品进行先后排列。\n\
    \n**理性消费者的三大基本偏好**\n\n第一，完全性。可以明确比较和排列不同商品组合。要么 A<B；要么 A=B；要么 A>B。\n\n第二，可传递性。如果\
    \ A>B，B>C，那么，A>C。\n\n第三，非饱和性。对每一种商品的消费都没有达到饱和点。对任何商品，总认为多比少好。\n\n### 预算约束：消费者买得起什么\n\
    \n- 预算约束线——对消费者可以承受的消费组合的限制。\n- 预算约束线表示给定收入和两种商品的价格，消费者所能买得起的消费组合。\n  - 人们之所以消费得比他们愿意的少，是因为他们受到收入的限制。\n\
    \n### 消费者的预算约束线\n\n- 预算约束线上任何一点表示了消费者的消费组合或者两种商品之间的权衡取舍。\n- 例如，如果消费者不买比萨饼，他就可以购买500ml的百事可乐（B点）。如果他不买百事可乐，他就可以购买100个比萨饼（A点）。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1037_0.png)\n\n"
