    \n在这个例子中，\n对芒果的净效应应是负的\n\n## 收入效应和替代效应\n\n- 价格变动：替代效应\n  - 价格变动首先使消费者沿着同一条无差异曲线从一点移动到另一点。\n\
    \    - 在图上看就是从A点移动到B点。\n\n- 价格变动：收入效应\n  - 在同一条无差异曲线上从一点移动到另一点以后，消费者将移动到另一条无差异曲线上。\n\
    \    - 从图上看就是从B点移动到C点。\n\n## 收入与替代效应\n\n![](img/518b44ff56ad05e168220626515b534d_1092_0.png)\n\
    \n## 当百事可乐价格下降时的收入与替代效应\n\n| 物品 | 收入效应 | 替代效应 | 总效应 |\n|---|---|---|---|\n| 百事可乐\
    \ | 消费者更富了，因此他购买了更多的百事可乐。 | 百事可乐相对便宜了，因此消费者购买了更多的百事可乐。 | 收入与替代效应同方向发生作用，因此消费者购买更多的百事可乐。\
    \ |\n| 比萨饼 | 消费者更富了，因此他购买了更多的比萨饼。 | 比萨饼相对贵了，因此消费者购买的比萨饼少了。 | 收入与替代效应反方向发生作用，因此对比萨饼的总效应难以确定。\
    \ |\n\n## 需求曲线的推导\n\n可以把消费者的需求曲线作为他的预算约束线和无差异曲线引起的最优决策的总结\n\n## 需求曲线的推导\n\n##\
