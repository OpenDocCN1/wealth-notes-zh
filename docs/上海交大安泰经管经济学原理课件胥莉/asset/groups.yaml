    \n- 如果 P > PE\n  - 收入增加，但劳动成本不变\n  - 生产有利可图，于是企业提高产量和增加雇佣工人\n- 更高的物价水平引起更高的产量，因此短期总供给曲线向右上方倾斜\n\
    \n## 短期中总供给曲线向右上方倾斜的原因\n\n- 粘性工资理论\n  - 名义工资调整缓慢，或者说在短期中是“粘性的”\n    - 工资不能根据物价水平迅速调整。\n\
    \  - 较低的物价水平使就业和生产不利。\n  - 这就引起企业减少物品与劳务的供给量。\n\n### 粘性价格理论\n\n- 不完全性：许多价格在短期内是粘性的\n\
    \  - 由于存在菜单成本，调整价格是有成本的\n  - 例如：印刷新菜单的成本，改变价格标签所需要的时间\n- 企业根据预期物价水平PE设定一个粘性价格\n\
    \n- 假设美联储未预料到地增加货币供给。在长期中，物价水平上升\n- 在短期内，没有菜单成本的企业会立即提高价格\n- 有菜单成本的企业需要时间来提高价格。同时，他们的价格相对较低，这会增加对他们产品的需求。他们会提高产量和增加雇佣工人\n\
    - 因此，高物价水平与高产出联系在一起。所以短期总供给曲线向右上方倾斜\n\n## 短期中总供给曲线向右上方倾斜的原因\n\n- 粘性价格理论\n  > 一些物品与劳务的价格对经济状况变动的调整也是缓慢的：\n\
    \  > 未预期到的物价水平下降使一些企业的价格高于合意水平。\n  > 这就抑制了销售，并引起企业减少它们生产的物品与劳务量。\n\n### 错觉理论\n\
    \n- 不完全性：\n  - 企业可能会混淆物价水平的变动与它们出售产品相对价格的变动\n- 如果P高于PE，企业会在注意到所有产品价格上升之前看到它出售产品价格的上升，并据此认为它出售产品的相对价格上升，进而提高产量和增加雇佣工人\n\
    - 因此，物价水平的上升引起产出的增加，使短期总供给曲线向右上方倾斜\n\n## 短期中总供给曲线向右上方倾斜的原因\n\n- 所有这三个理论都表明，当物价水平背离人们的预期，产量就背离自然率。\n\
    - 实际产量 = 自然产量 + a（实际物价水平 - 预期物价水平）\n- a是人们预期到的物价变动对产量的影响程度\n- 如果人们预期的物价水平与实际的物价水平一致，产量供给量就等于自然产出率\n\
    \n## 三种理论的共同点\n\n在这三个理论中，当实际物价水平背离人们预期的物价水平时，短期产量就背离其长期水平（自然产量率）\n\n```\nY = Y_N\
    \ + a(P - P_E)\n```\n\n产量的供给量\n\n自然产量率\n（长期）\n\na > 0，衡量产量对物价水平未预期到的变动做出多大反应的数字\n\
    \n实际物价水平\n\n预期的物价水平\n\n$Y = Y_N + \\alpha(P - P_E)$\n\n$P > P_E$\n\n预期物价水平\n\n\
    $P < P_E$\n\n![](img/518b44ff56ad05e168220626515b534d_1717_0.png)\n\n## 短期总供给曲线与长期总供给曲线\n\
    \n- 在这些理论中的不完整性都是暂时的。随时间推移：\n  - 粘性工资与粘性价格都将具有伸缩性\n  - 相对价格的错觉也会得到纠正\n- 在长期中，\n\
    \  - PE = P\n  - 总供给曲线垂直\n\nY = Y_N + a(P - P_E)\n\n在长期中，P_E = P，Y = Y_N。\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_1719_0.png)\n\n## 为什么短期总供给曲线会移动\n\n移动长期总供给曲线的任何事件都会使短期总供给曲线移动。预期物价水平\
    \ PE 变化也会移动短期总供给曲线：如果 PE 上升，工人与企业会制定更高的工资，在每个 P，生产获利减少，Y 下降，短期总供给曲线向左移动。\n\n![](img/518b44ff56ad05e168220626515b534d_1720_0.png)\n\
    \n## 短期总供给曲线的移动\n\n- 移动起因于\n  - 劳动\n  - 资本\n  - 自然资源\n  - 技术\n  - 预期物价水平\n\n-\
    \ 预期物价水平上升减少了物品与劳务供给量，并使短期总供给曲线向左移动。\n- 预期物价水平下降增加了物品与劳务供给量，并使短期总供给曲线向右移动。\n\n\
    ## 长期均衡\n\n在长期均衡中，\n\n$P_E=P$，\n\n$Y=Y_N$，\n\n失业率等于自然失业率\n\n![](img/518b44ff56ad05e168220626515b534d_1723_0.png)\n\
    \n## 经济波动的两个原因\n\n- 总需求移动\n  - 在短期中，总需求移动引起经济中物品与劳务产量的波动。\n  - 在长期中，总需求移动影响物价总水平，但不影响产量。\n\
    \n## 经济波动\n\n- 是引起AD或AS曲线移动的事件所致\n- 分析经济波动的4个步骤：\n  1. 确定某个事件是使总需求曲线移动，还是使总供给曲线移动（或者两条曲线都移动）\n\
    \  2. 确定曲线移动的方向\n  3. 用总需求和总供给图说明这种移动如何影响短期的产量和物价水平\n  4. 用总需求和总供给图分析经济如何从其新的短期均衡变动到其长期均衡\n\
    \n## 总需求移动的影响\n\n事件：股票市场崩溃\n\n1. 影响消费，AD曲线：人们财富下降\n2. 消费减少，所以AD曲线向左移动\n3. 短期在B点达到均衡。物价水平与产出都下降，失业增加。\n\
    4. 在长期中，P_E下降，生产增加。SRAS曲线一直向右移动，直到达到长期均衡点C。产出与失业回到起始水平。物价水平下降了。\n\n![](img/518b44ff56ad05e168220626515b534d_1726_0.png)\n\
    \n## 总需求两次重大的移动：1.大萧条\n\n从1929-1933年，\n\n- 由于银行体系出现问题，货币供给量下降28%\n- 股票价格下降90%，消费与投资减少\n\
    - *Y*下降27%\n- *P*下降22%\n- 失业率从3%上升到25%\n\n![](img/518b44ff56ad05e168220626515b534d_1727_0.png)\n\
    \n## 总需求两次重大的移动：2.第二次世界大战\n\n从1939-1944年，\n\n- 政府支出从91亿美元上升到913亿美元\n- Y增加90%\n\
    - P上升20%\n- 失业率从17%下降到1%\n\n美国真实 GDP，2000年的十亿美元\n\n![](img/518b44ff56ad05e168220626515b534d_1728_0.png)\n\
    \n## 讨论 模型的应用\n\n- 画出美国经济的AD-SRAS-LRAS图形，从经济的长期均衡开始\n- 加拿大出现经济繁荣，用你的图形分析这对美国 GDP，物价水平和失业率的短期与长期影响\n\
    \n## 讨论 参考答案\n\n事件：加拿大经济繁荣，净出口增加\n\n1. 影响 NX， AD曲线\n2. AD曲线向右移动\n3. 短期均衡在点B。 P与Y\
    \ 增加，失业率降低\n4. 随时间的推移， PE上升， SRAS曲线一直向左移动，直到达到长期均衡点C。 Y与失业率回到起始水平\n\n![](img/518b44ff56ad05e168220626515b534d_1730_0.png)\n"
