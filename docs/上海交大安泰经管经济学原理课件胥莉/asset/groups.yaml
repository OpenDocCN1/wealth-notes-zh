  md: "\n## 练习\n\n一种物品：玉米\n\n经济有足够的劳动、资本和土地来生产 $Y = 800$ 蒲式耳的玉米\n\n$V$ 不变\n\n2008年，$M\
    \ = \\$2000$，$P = \\$5/\\text{蒲式耳}$\n\n计算2008年的名义GDP和货币流通速度\n\n## 讨论\n\n### 参考答案\n\
    \n已知：$Y = 800$，$V$ 不变，$M = \\$2000$，$P = \\$5$，在2008年\n\n计算2008年的名义GDP和货币流通速度\n\
    \n名义GDP = $P \\times Y = \\$5 \\times 800 = \\$4000$\n\n$V = (P \\times Y) / M\
    \ = \\$4000 / \\$2000 = 2$\n\n## 货币数量论的本质\n\n由数量方程式开始：$M \\times V = P \\times\
    \ Y$\n\n- 1. $V$ 一直较为稳定\n- 2. 所以当中央银行改变货币量（$M$）时，它引起名义GDP（$P \\times Y$）的同比例变动\n\
    - 3. $M$ 的变化不影响 $Y$：货币是中性的\n  - $Y$ 由技术与资源决定\n- 4. 因此，$P$ 与 $P \\times Y$ 或 $M$\
    \ 同比例变动\n- 5. 当中央银行迅速增加货币供给时，结果就是高通货膨胀率\n\n## 练习\n\n一种物品：玉米。经济有足够的劳动、资本和土地来生产\
    \ $Y = 800$ 蒲式耳的玉米，$V$ 不变。2008年，$M = \\$2000$，$P = \\$5/\\text{蒲式耳}$\n\n2009年，美联储货币供给增加5%，增加到2100美元\n\
    \n- a. 计算2009年的名义GDP和 $P$，并计算从2008年到2009年的通货膨胀率\n- b. 假设技术进步使2009年的产出 $Y$ 增加到824，计算从2008年到2009年的通货膨胀率\n\
    \n### 参考答案\n\n已知：$Y = 800$，$V$ 不变，$M = \\$2000$，$P = \\$5$，2008年。2009年，美联储货币供给增加5%，增加到2100美元\n\
    \n- **a.** 计算2009年的名义GDP和 $P$，并计算从2008年到2009年的通货膨胀率\n\n  名义GDP = $P \\times Y\
    \ = M \\times V$（数量方程式）\n\n  $= \\$2100 \\times 2 = \\$4200$\n\n  $P = \\dfrac{P\
    \ \\times Y}{Y} = \\dfrac{\\$4200}{800} = \\$5.25$\n\n  通货膨胀率 $= \\dfrac{\\$5.25\
    \ - 5.00}{5.00} = 5\\%$（与货币供给增加的比例相同！）\n\n- **b.** 假设技术进步使2009年的产出 $Y$ 增加到824，计算从2008年到2009年的通货膨胀率\n\
    \n  首先，用数量方程式计算 $P$：\n\n  $P = \\dfrac{M \\times V}{Y} = \\dfrac{\\$4200}{824}\
    \ = \\$5.10$\n\n  通货膨胀率 $= \\dfrac{\\$5.10 - 5.00}{5.00} = 2\\%$\n\n## 货币数量论的总结\n\
    \n- 如果真实GDP不变，那么：\n  - 通货膨胀率 = 货币增长率\n- 如果真实GDP增加，那么：\n  - 通货膨胀率 < 货币增长率\n- 过程：\n\
    \  - 经济增长增加了经济中的交易数量\n  - 这些交易数量增加需要货币量的增加\n  - 货币量增加过多会导致通货膨胀\n\n## 超速通货膨胀\n\n\
    - 超速通货膨胀一般被定义为每月通货膨胀率在50%以上\n- 第一章中的经济学十大原理之一：\n  - 当政府发行了过多货币时，物价上升\n- 货币供给的过度增长总是导致超速通货膨胀\n\
    \n## 图. 超速通货膨胀时期的货币与物价\n\n![](img/518b44ff56ad05e168220626515b534d_1520_0.png)\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1521_0.png)\n\n**c) 德国**\n\n指数（1921.1\
    \ = 100）\n\n物价水平\n\n货币供给\n\n德国图表纵轴刻度：1000万亿、1万亿、100亿、1亿、1百万、1万、100、1；横轴刻度：1921、1922、1923、1924、1925。\n\
    \n**d) 波兰**\n\n指数（1921.1 = 100）\n\n物价水平\n\n货币供给\n\n波兰图表纵轴刻度：10百万、1百万、10万、1万、1,000、100；横轴刻度：1921、1922、1923、1924、1925。\n\
    \n## 津巴布韦的超速通货膨胀\n\n大额的政府预算赤字导致了大量货币的产生和高速的通货膨胀率。\n\n![](img/518b44ff56ad05e168220626515b534d_1522_0.png)\n\
    \n公共厕所的布告\n\n## 通货膨胀税\n\n- 当政府税收收入不足以支付其支出，借款能力又有限时，政府可能会印发货币来筹集收入\n- 几乎所有的超速通货膨胀都是这样开始的\n\
    - 政府通过创造货币而筹集的收入是通货膨胀税：印发货币导致通货膨胀，通货膨胀税就像是一种向每个持有货币的人征收的税\n- 今天美国通货膨胀税占总收入的比例不到\
    \ 3%\n\n## 费雪效应\n\n费雪效应——名义利率对通货膨胀率一对一的调整。\n\n根据费雪效应，当通货膨胀率上升时，名义利率上升同样的量。\n\n\
    实际利率保持不变。\n\n名义利率 = 实际利率 + 通货膨胀率\n\n- 真实利率由可贷资金市场上储蓄和投资共同决定\n- 货币供给的增长决定通货膨胀率\n\
    - 因此这个等式表明名义利率是如何决定的\n- 在长期，货币是中性的。因此货币增长率的改变只影响通货膨胀率而不影响真实利率\n- 所以名义利率对通货膨胀率进行一对一的调整\n\
    - 这种关系被称为费雪效应，以第一个研究这个问题的经济学家阿尔文·费雪的名字命名\n\n## 美国的名义利率与通货膨胀率：1960–2012\n\n这两个变量之间的密切联系验证了费雪效应\n\
    \n名义利率\n\n通货膨胀率\n\n## 费雪效应与通货膨胀税\n\n名义利率 = 通货膨胀率 + 真实利率\n\n- 通货膨胀税是对人们持有的货币征税，而不是对他们的财富征税\n\
    - 费雪效应：名义利率对通货膨胀率进行一对一的调整，因此真实利率（财富的真实利率）没有改变\n\n## 通货膨胀的成本\n\n- **皮鞋成本**：当通货膨胀鼓励人们减少货币持有量时所浪费的资源\n\
    \  - 包括更频繁去银行取钱的时间与交易成本\n- **菜单成本**：改变价格的成本\n  - 印刷新菜单，寄新目录等\n- **相对价格波动与资源配置不当**：企业并不是同时提高所有物品的价格，因此相对价格会变化……\n\
    \  - 这会扭曲资源配置\n- **混乱与不方便**：通货膨胀改变了我们用以衡量经济交易的尺度，使长期计划和不同时间点美元数量的比较变得更复杂\n- **税收扭曲**：\n\
    \  - 通货膨胀使名义收入比真实收入增长得更快\n  - 税收基于名义收入，而没有根据通货膨胀进行调整\n  - 因此即使人们的真实收入并没有增加，通货膨胀也会使人们缴纳更多的税收\n\
    \n## 讨论\n\n### 税收扭曲\n\n你在银行存款1000美元，期限为一年\n\n情形 1：通货膨胀率 = 0%，名义利率 = 10%\n\n情形\
    \ 2：通货膨胀率 = 10%，名义利率 = 20%\n\n- a. 在哪种情形中，你存款的真实价值增长的更快？\n- 假定税率为25%\n- b. 在哪种情形中，你纳税最多？\n\
    - c. 计算税后名义利率，然后减去通货膨胀率计算两种情形的税后真实利率\n\n### 参考答案\n\n存款 = 1000美元\n\n情形 1：通货膨胀率\
    \ = 0%，名义利率 = 10%\n\n情形 2：通货膨胀率 = 10%，名义利率 = 20%\n\n- a. 在哪种情形中，你存款的真实价值增长的更快？\n\
    \n  两种情形的真实利率都是10%，因此存款真实价值的增长率都是10%（税前）\n\n税率 = 25%\n\n- b. 在哪种情形中，你纳税最多？\n\n\
    \  情形 1：利息收入 = 100美元，因此你纳税25美元\n\n  情形 2：利息收入 = 200美元，因此你纳税50美元\n"
