    \n## 沃尔克的反通货膨胀\n\n美联储主席保罗·沃尔克\n\n- 在经济高通货膨胀与高失业的1979年底被任命为美联储主席\n- 转而实行反通货膨胀的政策\n\
    \n### 1981-1984年\n\n- 由于当时实行扩张性的财政政策，联储必须实行非常紧缩的货币政策来降低通货膨胀\n- 反通货膨胀成功：通货膨胀率从10%降到4%，但却以高失业率为代价……\n\
    \n反通货膨胀的代价非常高\n\n在1982-1983年，失业率接近10%\n\n通货膨胀率（年百分比）\n\n失业率（百分比）\n\n![](img/518b44ff56ad05e168220626515b534d_1826_0.png)\n\
    \n## 格林斯潘时代\n\n- 1986年：石油价格下降了50%\n- 1989-1990年：失业率下降，通货膨胀上升，美联储提高利率，引起经济的微小衰退\n\
    - 20世纪90年代：失业率和通货膨胀都下降\n- 2001年：不利的需求冲击使美国经济经历了十年中的第一次衰退，政策决策者用扩张性的货币政策与扩张性的财政政策帮助结束了这次衰退\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1827_0.png)\n\n**格林斯潘**  \n联邦公开市场委员会主席\
    \  \n*1987.8-2006.1*\n\n通货膨胀率（年百分比）\n\n在格林斯潘担任美联储主席的大部分时间里，通货膨胀与失业率都较低\n\n![](img/518b44ff56ad05e168220626515b534d_1828_0.png)\n\
    \n失业率（百分比）\n\n## 格林斯潘时代通胀和失业率都很低\n\n其主要原因：\n\n- 日本和亚洲等国经济的严重衰退，减低了美国进口商品的价格成本。\n\
    - 劳动平均年龄的提高降低经济的自然失业率，因为老人不像年轻人那样频繁地更换工作。\n- 技术进步提高了劳动生产力，降低了生产成本。\n\n## 伯南克的挑战\n\
    \n- 总需求冲击：\n  - 次贷危机，住房价格下降，大量丧失赎回权，金融机构处于困境\n- 总供给冲击：\n  - 食品/农产品价格上涨，如每蒲式耳玉米的价格从2005-2006年的2.10美元上涨到2008年5月的5.76美元\n\
    \  - 石油价格上涨\n    - 每桶原油价格：2004年2月的35美元到2008年6月的134美元\n- 从2007年6月到2008年6月：\n  -\
    \ 失业率从4.6%上升到5.5%\n  - CPI通货膨胀率从2.6%上升到4.9%\n\n## 降低通胀的代价\n\n- 降低通胀，必须实行紧缩性货币政策，这就导致生产的紧缩和就业的减少，实际上就是以失业为代价，换取通胀率的下降。\n\
    - 牺牲率是指降低1%的通胀率将会导致产出下降的百分比。\n- 实行紧缩性政策可以使通胀率沿着原来的菲利普斯曲线下降，失业增加，但同时公众形成了通胀率会下降的预期，菲利普斯曲线向左移动，表明紧缩性政策可以使失业率回到初始位置，物价相应下降了。\n\
    \n## 本篇小结\n\n1. 菲利普斯曲线描述通胀和失业之间负相关关系，刺激总需求可以实现高通胀，低失业；遏制总需求则可造成低通胀，高失业。短期中失业和通胀有替代关系，长期中没有，长期中的菲利普斯曲线是条垂线。受到不利的供给冲击以后，管理层只能在既定的失业率下，接受较高的通胀，或者在既定通胀率下，接受较高的失业率。紧缩货币可能使经济沿着短期菲利普斯曲线移动，引起暂时的高失业。反通胀的代价取决于通胀预期下降的速度，可信任的低通胀承诺可以引起预期的迅速调整，降低反通胀的代价。\n\
    \n2. 经济围绕长期趋势发生短期波动，这种波动是无规律的，无法预测的。它表现为GDP和就业指标的相应波动。总需求曲线向右下方倾斜的主要原因是财富效应、利率效应和汇率效应。长期总供给曲线是条垂线，因为长期中商品劳务的供给取决于劳动、资本、自然资源和技术，而不取决于物价水平。根据粘性工资理论，未预料到的价格水平下降暂时增加实际工资，使企业减少就业和生产；根据粘性价格理论，未预料到的物价水平下降使企业价格暂时升高，这就减少了它们的销售；根据错觉理论，未预料到的价格水平下降使供给者错误地认为，他们的相对价格下降，他们就减少供给。这就使得短期总供给曲线向右上方倾斜。这三种理论都表明实际物价与人们的预期物价背离时，产量与自然率背离。致使短期供给曲线移动的因素除了改变长期供给曲线位置的变量外，还有预期物价水平。总需求曲线向左移动导致产量减少，价格下降；向右移动则产量增加，价格上升。总供给曲线向左移动，价格上升，产量减少；向右移动，价格下降，产量增长。\n\
    \n3. 根据流动性偏好理论，利率变动可以实现货币供求相等。货币供给增加可以降低利率，投资成本下降刺激投资和总需求，反之则是这些变量反向变动。政府购买和税收变动，可以影响公众可支配收入，使总需求曲线相应变化，进而影响利率，调节总需求。乘数效应是国民收入的增加超过支出的增加，挤出效应则减少财政政策对总需求的影响。积极的财政货币政策有熨平经济波动的一面，也可能因为公众的预期和对策削弱或扰乱政策的效果。\n"
