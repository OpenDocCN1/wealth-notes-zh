    \n## 结论：人们真的这样想吗？\n\n- 人们并不是在画出预算约束线和无差别曲线之后，再来做消费决策\n- 但他们力图在资源有限的情况下，做出能最大化他们满意程度的决策\n\
    - 本章的理论只是作为消费者如何做决策的一个比喻\n- 它很好地解释了许多情况下的消费者行为，也为更高深的经济分析提供基础\n\n## 小结\n\n- 对较高无差异曲线上各点的偏好大于对较低无差异曲线上各点。任何一点上无差异曲线的斜率是消费者的边际替代率。\n\
    - 消费者通过选择在既定预算约束线上又在最高无差异曲线上的一点而实现最优化。\n\n## 小结\n\n- 当一种物品价格下降时，对消费者选择的影响可以分解为收入效应与替代效应。\n\
    - 收入效应是由于低价格使消费者状况变好而引起的消费变动。\n- 收入效应反映在无差异曲线由低向高的移动上。\n\n## 小结\n\n- 替代效应是由于价格变动鼓励更多消费变得便宜的物品而引起的消费变动。\n\
    - 替代效应表现为沿着一条无差异曲线向不同斜率的点的移动上。\n\n## 小结\n\n- 消费者选择理论可以解释：\n  - 为什么需求曲线有可能向右下方倾斜。\n\
    \  - 高工资如何影响劳动供给。\n  - 利率如何家庭储蓄。\n"
