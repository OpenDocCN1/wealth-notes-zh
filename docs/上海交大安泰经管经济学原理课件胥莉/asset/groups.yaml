    # 人们如何做出决策


    # 原理三：理性人考虑边际量


    理性人：


    +   - 系统而有目的地尽最大努力实现其目标的人

    +   - 通过比较成本与利益的边际变动来做出决策


    边际变动 – 对现有行动计划的微小增量调整


    人们通过比较边际利益和边际成本作出决策'
  - '[PAGE 51]


    # 人们如何做出决策


    # 原则三：理性人考虑边际量


    +   - 当一个大学生考虑是否要多上一年学时，他会比较学费加上损失的工资和多上一年学所增加的额外收入

    +   - 当一个经理在考虑是否要增加产出时，她会在增加的劳动力与原材料的成本和额外的收益之间进行比较'
