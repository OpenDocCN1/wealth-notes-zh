    \n## 铝市场和福利经济学\n\n> “市场均衡时的生产量和消费量是有效率的”，这句话的意思是说生产者和消费者的总剩余最大。\n\n- 每生产一个单位量的铝，社会成本既包括铝生产者的私人成本，也包括污染给旁观者带来的成本。\n\
    - 如果铝厂排放污染（负外部性），那么生产铝的社会成本就比铝生产者的私人成本高。\n\n## 污染和社会最优\n\n铝的价格\n产量\n0\n污染成本\n\
