    \n## 外部性内在化\n\n- 需求曲线和社会成本曲线的交点决定了社会最优产量。\n- 社会最优产量比市场均衡产量低。\n- **外部性内在化：**改变激励，以使人们考虑到自己行为的外部效应\n\
    - 在例子中，对卖者征税$1/每加仑使卖者的成本 = 社会成本\n- 当市场参与者必须支付社会成本时，\n  - 市场均衡 = 社会均衡\n  （对买者征税也能达到相同的结果；市场均衡量等于社会最优量）\n\
    \n## 负外部性及其对策\n\n- 外部性的内在化——通过改变激励，使人们考虑他们自己行为的外部效应。\n- 实现社会最优产量\n- 政府可以向生产者收税以降低市场均衡产量为社会所希望的产量，将\
    \ 外部性内在化。\n- 合并\n\n## 正外部性例子\n\n- 接种预防传染病的疫苗不仅保护你自己，而且也保护其他人。\n- 研究与发展创造出了别人也可以使用的知识\n\
    - 人们上大学提高了教育水平，并减少了犯罪和改善了政府\n\n![](img/518b44ff56ad05e168220626515b534d_497_0.png)\n\
    \n## 正外部性\n\n- 当外部性有利于旁观者时，就存在正外部性。\n  - 物品的社会价值大于私人价值。\n\n## 正外部性的分析\n\n流感疫苗市场\n\
    \n![](img/518b44ff56ad05e168220626515b534d_500_0.png)\n\n外部利益\n= $10/每支疫苗\n\n\
    - 画出社会价值曲线\n- 找出社会最优数量 Q\n- 应该用什么政策来使外部性内在化？\n\n## 正外部性的分析\n\n流感疫苗市场\n\n外部利益\n\
