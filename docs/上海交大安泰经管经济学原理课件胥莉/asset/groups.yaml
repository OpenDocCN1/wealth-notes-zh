    # 国民收入帐户中的储蓄与投资


    GDP既是一个经济的总收入，又是用于经济的物品与劳务产量的总支出。


    Y = C + I + G + NX'
  - '[PAGE 1319]


    # 一些重要的恒等式


    +   - 假设一个封闭经济——不与其他经济交易的经济。

    +     $Y = C + I + G$，现在，从上面等式两边减去C和G，得出：

    +     $Y - C - G = I$


    +   - 这个等式的左边是在用于消费和政府购买之后留下的总收入，这个量被称为国民储蓄，或简称储蓄 (S)。


    +   - 用S代替Y-C-G，上式可以写为：

    +     $S = I$


    储蓄 = 封闭经济中的投资'
  - '[PAGE 1320]


    # 一些重要的恒等式


    +   国民储蓄或储蓄等于：


    S = I


    S = Y − C − G


    S = (Y − T − C) + (T − G)

    =私人储蓄 + 公共储蓄'
  - '[PAGE 1321]


    # 储蓄与投资的含义


    +   - **国民储蓄**

    +     - **国民储蓄**——一个经济在用于消费和政府购买后剩下的总收入。


    +   - **私人储蓄**

    +     - **私人储蓄**——家庭在支付了税收和消费之后剩余的收入量。

    +     - **私人储蓄 = (Y - T - C)**


    +   - **公共储蓄**

    +     - **公共储蓄**——政府在支付其支出后剩余的税收收入量。

    +     - **公共储蓄 = (T - G)**'
  - '[PAGE 1322]


    # 储蓄与投资的含义


    $S=I$


    也可以是 $S=Y-C-G$


    或者　$S=(Y-T-C)+(T-G)$


    +   - 储蓄因此等于私人储蓄与公共储蓄之和。政府税收大于支出为盈余，反之则为赤字。

    +   - 该等式表明通过金融市场可以在整体上实现社会的储蓄等于投资。'
  - '[PAGE 1323]


    # 储蓄与投资的含义


    储蓄等于投资的机制：个人存款银行或买股票的储蓄未必等于另一个人购买厂房设备的投资，但是，投资者可以通过金融机构借到不足的资金，这就能在总量上实现投资等于储蓄。'
  - '[PAGE 1324]


    # 储蓄与投资的含义


    +   - 对整个经济而言，储蓄必定等于投资。$S=I$

    +   - 预算盈余与预算赤字

    +     - 如果$T>G$，政府由于得到的资金大于支出，政府有预算盈余。

    +     - 这种$T-G$的盈余代表公共储蓄。

    +     - 如果$G>T$，政府支出大于其税收收入，政府有预算赤字。'
  - '[PAGE 1325]


