    # 人们如何做出决策


    # 原理一：人们面临权衡取舍


    所有决策都面临着权衡取舍。比如：


    +   - 参加期中考试前一天晚上的聚会意味着更少的时间学习

    +   - 想要更多的收入需要工作更长时间，这就使得休息时间减少

    +   - 保护环境意味着生产消费物品的资源减少


    作决策时需要在两个目标之间权衡取舍'
  - '[PAGE 44]


    # 人们如何做出决策


    # 原理一：人们面临权衡取舍


    > “天下没有免费的午餐”


    我们为了得到一件东西就不得不放弃另一件东西。


    +   - 食物 v. 衣服

    +   - 闲暇时间 v. 工作时间

    +   - 效率 v. 平等


