    # 练习1


    +   - 某成本不变的完全竞争行业的代表性厂商的总成本函数为 $TC = q^3 - 60q^2 + 1500q$ ，产品价格P=975美元，试求：

    +   - 求利润最大时的产量、平均成本和利润。'
  - '[PAGE 818]


    +   - 利润极大化的数学模型及其条件

    +   - 数学模型 max π(Q)=TR(Q)-TC(Q)

    +   - 一阶条件：\(\frac{d\pi}{dQ}=0, P=MR=MC\)

    +   - 二阶条件：\(\frac{d^2\pi}{dQ^2}<0, \frac{dMR(Q)}{dQ}<\frac{dMC(Q)}{dQ}\)

    +   - 利用一阶条件算出：q为5或35

    +   - 验证二阶条件得q=35

    +   - AC=625，π=12250'
  - '[PAGE 819]


    # 练习2


    某成本不变的完全竞争行业的代表性厂商的总成本函数为 LTC = q³ -60q² +1500q ，产品价格 P=975美元，试求：


    +   （1）该行业长期均衡的价格和厂商的产量。


    +   （2）若市场需求曲线是 P=9600-2Q，长期均衡中留存于该行业的厂商数是多少？'
