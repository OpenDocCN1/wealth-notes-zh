    \n![](img/518b44ff56ad05e168220626515b534d_1087_0.png)\n\n## 价格变动的影响\n\n最初，\n\
    $P_F = $4\n$P_M = $1\n\n如果 $P_F$ 下降到\n$2\n预算约束线向外移动，小马会买更多的鱼和更少的芒果\n\n![](img/518b44ff56ad05e168220626515b534d_1088_0.png)\n\
    \n## 收入效应与替代效应\n\n鱼价格的下降对小马两种物品的最优消费有两种效应：\n\n- 收入效应\n  $P_F$ 的下降增加了小马收入的实际购买能力，允许他购买更多的芒果和鱼\n\
    \n- 替代效应\n  $P_F$ 的下降使芒果相对于鱼的价格上升，会使小马买更少的芒果和更多的鱼\n\n注意：对芒果的净效应并不确定\n\n## 收入效应与替代效应\n\
