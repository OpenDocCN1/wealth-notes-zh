    - 这种投资的减少被称为挤出。\n  - 政府为其预算赤字借款挤出了那些想为投资筹资的私人借款者。\n\n## 政策3：政府预算赤字与盈余\n\n- 预算赤字减少了可贷资金的供给。\n\
    \  - 使供给曲线向左移动。\n  - 提高了均衡利率。\n  - 减少了可贷资金的均衡量。\n\n## 图. 政府预算赤字的后果\n\n![](img/518b44ff56ad05e168220626515b534d_1351_0.png)\n\
    \n利率\n\n供给，$S_1$\n\n$S_2$\n\n需求\n\n6%\n\n5%\n\n0\n\n$800\n\n$1,200\n\n可贷资金\n（10亿美元）\n\
    \n1. 预算赤字减少了可贷资金的供给…\n2. 导致均衡利率上升…\n3. …可贷资金的均衡数量下降。\n\n## 政策3：政府预算赤字与盈余\n\n-\
    \ 当政府存在预算赤字时，减少了国民储蓄，利率上升，投资减少。\n- 预算盈余增加了可贷资金的供给，降低了利率，并刺激了投资。\n\n## 政策3：政府预算赤字与盈余\n\
    \n- 如果发生盈余，就是公共储蓄增加，也就是可贷资金供给增加，但可贷资金需求保持不变。可贷资金供给曲线向右平行移动，利率下降，均衡可贷资金增加。\n- 如果发生赤字，就是公共储蓄减少，可贷资金供给曲线向左平行移动，利率上升，均衡可贷资金减少。\n\
    \n## 政策3：政府预算赤字与盈余\n\n美国历史上的战争带动美国政府的债务同步上升，而在20世纪初，美国政府的债务下降。为对付911以后的形势，政府支出增加，但是，法律的约束限制了债务的增长。\n\
    \n## 图.美国政府债务\n\n![](img/518b44ff56ad05e168220626515b534d_1355_0.png)\n\n## 美国政府债务史\n\
    \n- 政府用借款为赤字融资（出售政府债券）\n- 长期赤字导致政府债务增加\n- 债务—GDP比率是衡量相对于政府筹集税收收入的能力而言，政府负债程度的指标\n\
    - 在历史上，债务—GDP比率通常在战争期间上升，在和平时期下降（直到1980年代初期）\n\n## 第27章  基本金融工具\n\n## 本章我们将探索这些问题的答案：\n\
    \n- 什么是“现值”？我们怎么用它来比较不同时点的货币量？\n- 为什么人们是风险厌恶的？风险厌恶的人们如何用保险和多样化来管理风险？\n- 什么决定资产的价值？什么是“有效市场假说”？为什么赢得市场是不可能的？\n\
    \n## 介绍\n\n- 金融体系协调储蓄与投资\n- 金融体系的参与者考虑不同时期的资源配置和风险管理，由此做出决策\n- **金融学**——研究人们如何在某一时期内配置资源和应对风险时作出决策的学科。\n\
    \n## 现值：衡量货币的时间价值\n\n- 现值——用现行利率带来一定量未来货币所需要的现在货币量。\n- 未来价值——在现行利率为既定时，现在货币量将带来的未来货币量。\n\
    - 货币的时间价值是按照复利计算的，其公式为： FV=PV（1+r）t\n- 将未来的货币转换成现在的货币，若利率是 r ，则 t 年后收到的货币量 X 的现值是：其公式为：\
    \ PV=FV/（1+r）t\n\n## 现值：衡量货币的时间价值\n\n### 现值的概念说明以下问题：\n\n- 接受现在给付的一定量货币比接受未来等量的货币更可取。\n\
    - 为了比较不同时点上的货币价值，就要比较它们的现值。\n- 如果一个项目的现值超过成本，企业就应该投资这个项目。\n\n## 例 1: 一个简单的存款\n\
    \n- 以5%的利率在银行存款$100，这笔钱的未来值是多少？\n- *N* 年以后， FV = $100(1 + 0.05)^N\n- 3年以后， FV\
    \ = $100(1 + 0.05)^3 = $115.76\n- 2年以后， FV = $100(1 + 0.05)^2 = $110.25\n- 1年以后，\
    \ FV = $100(1 + 0.05) = $105.00\n\n## 例 1: 一个简单的存款\n\n- 以5%的利率在银行存款$100，这笔钱的未来值是多少？\n\
    - *N* 年以后, FV = $100(1 + 0.05)^N\n- 在这个例子中，100美元是现值 (PV)\n- FV = PV(1 + *r*)^N\n\
    \  这里 r 代表利率\n  PV = FV/(1 + *r*)^N\n- 解出PV：\n\n## 例2：投资决策\n\n未来值公式：PV = FV/(1\
    \ + r)^N\n\n- 如果 $r = 0.06$。\n  通用汽车公司是否应该花100万美元造一个在未来十年内能产生两百万元收入的工厂？\n- 解决办法：找出未来十年两百万元的现值\n\
    \  \n  $PV = (\\$200\\text{ 百万})/(1.06)^{10} = \\color{red}{\\$112\\text{ 百万}}$\n\
    \  \n  因为 PV > 工厂成本，通用应该造这个工厂\n\n## 例2：投资决策\n\n- 如果 $r = 0.09$。\n  通用汽车公司是否应该花100万美元造一个在未来十年内能产生200万美元收入的工厂？\n\
    - 解决办法: 找出未来十年两百万美元的现值\n  \n  $PV = (\\$200\\text{ 万})/(1.09)^{10} = \\$84\\text{\
    \ 万}$\n  \n  因为 PV < 工厂成本，通用公司不应该造这个工厂\n\n现值帮助解释了为什么利率上升时投资会减少\n\n## 讨论\n现值\n\n\
    你正在考虑以7万美元买一块6亩的土地，这块地在5年后会值10万美元\n\n- A. 如果 r = 0.05，你是否应该买？\n- B. 如果 r = 0.10，你是否应该买？\n\
    \n## 讨论\n参考答案\n\n你正在考虑以7万美元买一块6亩的土地，这块地在5年后会值10万美元\n\n- A. 如果 $r=0.05$，你是否应该买？\n\
    \  \n  PV = $100,000/(1.05)^5 = \\color{red}{\\$78,350}$。\n  \n  土地的PV > 土地的价格\n\
    \  \n  \\color{red}{是}，买下它\n\n- B. 如果 $r=0.10$，你是否应该买？\n  \n  PV = $100,000/(1.1)^5\
    \ = \\color{red}{\\$62,090}$。\n  \n  土地的PV < 土地的价格\n  \n  \\color{red}{不}，不买它\n\
    \n## 复利\n\n- **复利：** 货币量的积累，即赚得的利息仍留在账户上以赚取未来更多的利息\n- 由于复利，利率的微小差别在长期会产生巨大的差别\n\
    - 例如：买$1000微软的股票，并持有30年\n  如果回报率 = 0.08，  FV = $10,063\n  如果回报率 = 0.10，  FV =\
    \ $17,450\n\n## 70规则\n\n- 70规则：\n  如果一个变量每年按x%增长，那么大约在70/x年以后，该变量翻一番\n- 例如：\n\
    \  - 如果年利率是5%，那么大约在14年后存款额将会增长1倍\n  - 如果年利率是7%，那么大约在10年后存款额将会增长1倍\n\n## 讨论\n\n\
    ### 70 规则\n\n- A. 根据70规则，如果你的收入每年增加5%，那么你的收入翻一番需要多长时间？\n- B. 如果你在28岁开始工作，年收入20万元，而且每年收入增长5%，那么到了70退休的时候，你赚到了多少钱？\n\
    - A 70/5=14年 翻一番\n- B 42年的收入翻三番，那么200000*2³=1600000元。\n"
