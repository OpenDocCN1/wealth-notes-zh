    # 平均决策问题


    +   - 是否租用复印机？


    ![](img/518b44ff56ad05e168220626515b534d_54_0.png)


    不租用：

    总费用 = 0.25 × 1000 = 250(元)


    租用：

    总费用 = 0.10 × 1000 + 100 = 200(元)


    决策：租用。'
  - '[PAGE 55]


    # 决策问题二：若另一个人提出0.15元/张出价要求复印，是否接受？


    # 平均量方法：


    平均成本 = 200/1000 = 0.20(元)


    出价低于平均成本，不接受。


    # 边际量方法：


    边际收益 = 0.15元


    边际成本 = 0.10元


    # 决策：边际收益 > 边际成本，接受。


