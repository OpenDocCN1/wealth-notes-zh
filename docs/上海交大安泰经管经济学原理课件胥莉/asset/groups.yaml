    # 两种效用理论


    +   - **基数效用**

    +     - 效用的大小可以用基数（1，2，3，……）来表示，可以计量并加总求和。

    +     - 基数效用论采用的是**边际效用分析法**。


    +   - **序数效用**

    +     - 效用作为一种心理现象无法计量，也不能加总求和，只能表示出满足程度的高低与顺序，效用只能用序数（第一，第二，第三，……）来表示。

    +     - 序数效用论采用的是**无差异曲线分析法**。'
  - '[PAGE 1023]


    # # 基数效用——边际效用分析法


    +   - **效用U（Utility）**：消费者从商品消费中得到的满足程度。

    +   - 消费者需求某种商品的目的是为了得到满足。

    +     - 完全是消费者的一种主观心理感受。

    +     - 满足程度高，效用大；

    +     - 满足程度低，效用小。


    > 萨缪尔森提出：幸福 = $\frac{效用}{欲望}$


    > 使幸福增加的有效方法是：

    > ◆ （1）欲望不变而提高效用；

    > ◆ （2）清心寡欲'
  - '[PAGE 1024]


    # # 总效用TU与边际效用MU


    • 总效用TU（Total Utility）：指人们从商品的消费中得到的总的满足程度。


    $$TU=f(Q)$$


    ▪ 边际效用MU（Marginal Utility）：每增加一个单位的商品消费量所增加的满足程度。


    $$MU=\frac{\Delta TU(Q)}{\Delta Q}$$


    $$MU=\lim_{\Delta Q\to 0}\frac{\Delta TU(Q)}{\Delta Q}=\frac{dTU(Q)}{dQ}$$


    | 例 | 消费量 | 边际效用MU | 总效用TU |

    |---:|---:|---:|---:|

    |  | 0 | 0 | 0 |

    |  | 1 | 30 | 30 |

    |  | 2 | 20 | 50 |

    |  | 3 | 10 | 60 |

    |  | 4 | 0 | 60 |

    |  | 5 | -10 | 50 |


    +   - 面包的消费量从一个增加到两个，

    +   - 满足程度从5个效用单位增加到8个，

    +   - 即增加了3个效用单位；'
