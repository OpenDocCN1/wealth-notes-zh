  - '[PAGE 1201]


    # 消费物价指数


    +   - 消费物价指数（CPI）是普通消费者所购买的物品与劳务的总费用的衡量标准。

    +   - 当CPI上升时，普通家庭不得不花费更多的美元来保持原来的生活水平。'
  - '[PAGE 1202]


    # # 如何计算消费物价指数


    +   - **固定篮子：** 确定哪些物价对普通消费者是最重要的。

    +   - **找出价格：** 找出每个时点上篮子中每种物品与劳务的价格。

    +   - **计算这一篮子东西的费用：** 用价格数据计算不同时间点一篮子物品与劳务的费用。'
  - '[PAGE 1203]


    # 如何计算消费物价指数


    +   - 选择基年并计算指数：

    +     - 指定一年为基年，即其他各年与之比较的基准。

    +     - 每年一篮子物品与劳务的价格除以基年一篮子物品与劳务的价格，然后把这个比率乘以 100，所得出的数字就是消费物价指数。'
  - '[PAGE 1204]


    # 如何计算消费物价指数


    +   - **计算通货膨胀率**：通货膨胀率是从上一年以来物价指数的变动百分比。


    第2年的通货膨胀率 = \(\frac{\text{第2年CPI}-\text{第1年CPI}}{\text{第1年CPI}}\times 100\)'
  - '[PAGE 1205]


    <!-- no content -->'
  - '[PAGE 1206]


    例：


    # 篮子：{4个Pizza, 10杯拿铁咖啡}


    | 年份 | Pizza价格 | 拿铁咖啡价格 | 篮子费用 |

    |---|---:|---:|---:|

    | 2017 | $10 | $2.00 | $10 × 4 + $2 × 10 = **$60** |

    | 2018 | $11 | $2.50 | $11 × 4 + $2.5 × 10 = **$69** |

    | 2019 | $12 | $3.00 | $12 × 4 + $3 × 10 = **$78** |


    计算每年的CPI，以2017年为基年　通货膨胀率：


    2017：100 × ($60/$60) = **100**


    2018：100 × ($69/$60) = **115**


    2019：100 × ($78/$60) = **130**


    **15%** = \frac{115-100}{100} × 100%


    **13%** = \frac{130-115}{115} × 100%'
