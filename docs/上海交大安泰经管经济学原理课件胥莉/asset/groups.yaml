    +   - 无法衡量的质量变动

    +     - 如果从一年到下一年物品的质量上升了，即使该物品的价格保持不变，一美元的价值也上升了。

    +     - 如果从一年到下一年物品的质量变差了，即使该物品的价格保持不变，一美元的价值也下降了。

