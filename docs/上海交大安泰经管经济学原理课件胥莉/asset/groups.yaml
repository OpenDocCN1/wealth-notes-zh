  md: "\n## 例 1：谷类早餐与防晒霜\n\n- 这两种物品的价格都上升20%。哪种物品的需求数量下降的最多？为什么？\n  - 谷类早餐有很多相近的替代品（比如，煎饼，Eggo华夫饼，剩余的披萨等），如果价格上升买者可以很容易购买其他物品\n\
    \  - 防晒霜没有类似的替代品，如果价格上升，消费者不可能少买太多\n- 总结：有相近替代品的物品的需求往往较富有弹性\n\n## 例 2: “蓝色牛仔裤”与“衣服”\n\
    \n- 如果两种物品的价格都上涨20%，哪种物品的需求量下降的最多？为什么？\n  - 定义范围狭窄的物品比如蓝色牛仔裤有很多的替代品（卡其，短裤，Speedos等）\n\
    \  - 定义范围宽泛的物品很少有替代品（衣服没有什么替代品，除非是流行裸体的殖民地）\n\n- 总结：范围小的市场的需求弹性往往大于范围大的市场的需求弹性\n\
    \n垄断市场的界定\n\n## 例 3：胰岛素与加勒比游轮\n\n- 如果两种物品的价格都上涨20%，哪种物品的需求量下降的最多？为什么？\n  - 对数以百万计的糖尿病患者来说，胰岛素是必需品。胰岛素价格的上升基本上不会引起需求的下降\n\
    \  - 游轮是奢侈品，如果价格上升，有些人会放弃购买\n\n- 总结：奢侈品的需求弹性要大于必需品的需求弹性\n\n## 例 4：短期的汽油与长期的汽油\n\
    \n- 汽油价格上涨20%，短期还是长期的汽油需求量会下降更多？为什么？\n  - 短期内，人们除了坐公交或者自己开车之外，并没有什么其他办法\n  - 长期中，人们可以购买省油的小排量汽车或搬到上班地方附近居住\n\
    - 总结：相对于短期，物品的需求往往在长期更富有弹性\n\n## 决定需求价格弹性的因素：一个总结\n\n需求价格弹性取决于：\n\n- 相近替代品的可获得性\n\
    - 物品是必需品还是奢侈品\n- 物品的定义是宽泛还是狭义\n- 时间框架—长期比短期更富有弹性\n\n## 美国若干消费品的长期与短期价格弹性（1970）*\n\
    \n| 商品 | 短期弹性 | 长期弹性 |\n|---|---|---|\n| 电视维修 | 0.47 | 3.84 |\n| 电影 | 0.87 | 3.67\
    \ |\n| 瓷器与玻璃器皿 | 1.54 | 2.55 |\n| 烟草 | 0.46 | 1.89 |\n| 家用电器 | 0.13 | 1.89 |\n\
    | 国际旅行 | 0.14 | 1.77 |\n| 公共交通 | 0.20 | 1.20 |\n| 医疗保险 | 0.31 | 0.92 |\n| 首饰 |\
    \ 0.41 | 0.67 |\n| 文具 | 0.47 | 0.56 |\n\n*上述价格弹性均为绝对值\n\n## 问题：\n\n为什么农产品丰收要毁掉农产品，而工业品产量大时则可竞相削价？\n\
    \n降价能激发出更多需求\n\n## 总收益与需求价格弹性\n\n- 如果你把价格从$200上升到$250，你的收益会增加还是减少？\n- 收益 = P x\
