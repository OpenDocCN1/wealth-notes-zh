    # GDP和经济福利


    +   - GDP是社会经济福利一个好的衡量指标

    +   - 人均GDP告诉我们经济中每个人的平均收入与支出。

    +   - 较高的人均GDP说明较高的生活水平。

    +   - 但是，GDP并不是幸福或生活质量的完美衡量指标。

    +   - 罗伯特·肯尼迪慷慨激昂地批评了这种经济衡量指标'
