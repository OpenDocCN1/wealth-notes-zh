  - '[PAGE 398]


    # 消费者剩余、生产者剩余与总剩余


    CS = (买者的评价) − (买者支付的量)


    = 买者参与市场得到的收益


    PS = (卖者得到的量) − (卖者的成本)


    = 卖者参与市场得到的收益


    总剩余 = CS + PS


    = 参与市场贸易得到的总收益


    = (买者的评价) − (卖者的成本)'
  - '[PAGE 399]


    # 资源的市场配置


    +   - 市场经济中，资源的配置是由许多分散自利的买者与卖者相互作用决定的

    +   - 市场对资源的配置是合意的吗？还存在另一个不同的配置方法能使社会更好吗？

    +   - 为回答这个问题，我们使用总剩余作为衡量社会福利的指标，我们也考虑市场配置是否有效率

    +   - 尽管这里我们主要关注效率，但政策制定者同样关注公平）'
  - '[PAGE 400]


    # 效率


    总剩余 = (买者的评价) − (卖者的成本)


    如果资源配置使总剩余最大化，那我们可以说，这种配置表现出效率。效率意味着：


    +   - 物品是由对这种物品评价最高的买者消费

    +   - 物品是由生产这种物品成本最低的卖者生产

    +   - 增加或减少这种物品的数量并不会事总剩余增加'
