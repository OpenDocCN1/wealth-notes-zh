    第三国民银行贷款 = $ 72.90\n:\n:\n货币供给总量 = $1000.00\n\n在这个例子中，100美元的准备金产生了1000美元货币\n\n\
    ## 部分准备金银行的货币创造\n\n- 当一个银行贷出货币时，这些货币往往被存入另外一个银行。\n- 这就创造了更多的存款和更多的准备金，可以贷出去。\n\
    - 当一个银行把它的准备金贷出时，货币供给就增加了。\n\n## 货币乘数\n\n- 货币乘数——银行体系用每一美元准备金所引起的货币供给量。\n- 货币乘数是准备率的倒数：\n\
    \  *M = 1/R*\n- 银行创造多少货币量取决于准备金率。当准备金率是100%时，货币乘数是1，此时银行不进行贷款，也不创造货币。\n- 在我们的例子中，R\
    \ = 10%\n  货币乘数 = 1/R = 10\n  100美元的准备金产生了1000美元的货币\n\n## 讨论\n银行与货币供给\n\n你打扫房间时在沙发坐垫下找到一张50美元的钞票（和吃了一半的墨西哥煎玉米面卷）。你把钱存入支票账户，美联储规定的法定存款准备金率是20%。\n\
    \n- A. 货币供给量增加的最大数量是多少？\n- B. 货币供给量增加的最小数量是多少？\n\n## 讨论\n\n## 参考答案\n\n你在支票账户存款50美元\n\
