  - '[PAGE 996]


    # 收入再分配的政治哲学


    我们考虑三种哲学：


    +   - 功利主义

    +   - 自由主义

    +   - 自由自上主义'
  - '[PAGE 997]


    # 功利主义


    +   - 效用：衡量幸福或满足程度的指标

    +   - 功利主义：认为政府应该选择使社会上所有人总效用最大化的政策

    +     - 奠基者： Jeremy Bentham, John Stuart Mill

    +   - 由于边际效用递减，收入从富人向穷人再分配会使穷人增加的效用大于富人减少的效用

    +   - 然而，功利主义者并不赞同收入的完全平等化 - 这是由于激励的作用和效率损失，会减少所有人的总收入'
  - '[PAGE 998]


    # 自由主义


    +   - **自由主义：** 认为政府应该选择必要的公正的政策，这种公正要由一位在“无知面纱”背后的无偏见观察者来评价

    +     - 奠基者； John Rawls

    +   - **最大最小原则：** 政府的目标应该是使社会上状况最差的人的福利最大化

    +   - 这要求比功利主义者所要求更大的收入再分配(尽管仍不是收入的完全公平)

    +   - 收入再分配是**社会保险**的一种形式，社会保险是旨在保护人们规避负面事件风险的政府政策'
  - '[PAGE 999]


    # 自由至上主义


    +   - **自由至上主义：** 认为政府应该惩罚犯罪并实行自愿的协议，但不应该进行收入再分配

    +     - 提倡者： Robert Nozick


    +   - 自由至上主义者不关注结果，转而关注过程

    +     - 政府应该保护个人权利，力图达到机会公平

    +     - 只要收入再分配过程是公正的，政府便不应该干预，即使分配结果不公平'
  - '[PAGE 1000]


    # 减少贫困的政策


    +   - 贫困家庭的成员更可能经历：

    +     - 无家可归

    +     - 毒品依赖

    +     - 健康问题

    +     - 未婚少女怀孕

    +     - 文盲

    +     - 失业

    +   - 大部分人认为政府应该提供一个“安全网”

    +   - 现在我们考虑一些这样的政策……'
  - '[PAGE 1001]


    # 1. 最低工资法


    +   - 支持者认为：

    +     - 保护穷人而又不用政府花钱

    +     - 如果对不熟练劳动的需求相对缺乏弹性，那么最低工资法对就业几乎没有影响

    +   - 反对者认为：

    +     - 长期里，对不熟练劳动的需求可能是富有弹性的，这样最低工资会引起不熟练劳动工人的大规模失业

    +     - 这些被最低工资保护的工人，更可能是中产阶级家庭的青少年，而不是成年的低收入工人'
  - '[PAGE 1002]


    # 2. 福利


    +   - **福利：** 补贴需要者收入的政府计划

    +     - 贫困家庭临时援助(TANF)

    +     - 补充保障收入(SSI)

    +   - 批评者认为这些计划激励人们成为或继续成为“需要帮助者”，认为福利使单亲家庭的数量上升

    +   - 然而，这些激励的严重程度仍不为所知

    +   - 支持者注意到经过通货膨胀调整后的福利补助一直在下降，但单亲家庭的数量却在上升'
  - '[PAGE 1003]


    # 3. 负所得税


    +   - **负所得税：** 向高收入家庭征税并给低收入家庭补贴的税制

    +   - 例如： 应纳税额 = (1/3 的收入) − $10,000

    +     - 如果收入 = $90,000, 应纳税额 = $20,000

    +     - 如果收入 = $60,000, 应纳税额 = $10,000

    +     - 如果收入 = $30,000, 应纳税额 = $0

    +     - 如果收入 = $15,000, 应纳税额 = −$5,000

    +       那就是说，将从政府得到$5000的收入

    +   - 劳动所得税抵免(EITC)类似于负所得税'
  - '[PAGE 1004]


    # 4. 实物转移支付


    +   - 实物转移支付是给穷人提供物品或劳务

    +     例如：

    +     - 给无家可归者提供避难所

    +     - 慈善厨房

    +     - **食品券**：政府发放的，可以用来在商店购买食物的票证

    +     - **医疗援助**：政府向穷人提供医疗保健


    +   - 一种替代：现金支付

    +     - 能够让穷人买他们最需要的东西

    +     - 但批评者认为这可能用在购买毒品和嗜酒上'
  - '[PAGE 1005]


    # 反贫困计划和工作激励


