    - 收入一部分分给波音公司工人（作为工资），\n  另一部分分给股东（作为利润或股票红利）\n- 这些人同时也是消费者，他们会将增加收入的\n  一部分作为消费支出\n\
    - 额外的消费引起总需求进一步增加\n\n**乘数效应：** 当扩张性财政政策增加了收入，从而增加了消费支出时引起的总需求的额外变动\n\n## 乘数效应\n\
    \n政府购买最初增加200亿美元使总需求曲线向右移动200亿美元，Y的增加使C上升，使总需求曲线进一步右移\n\n![](img/518b44ff56ad05e168220626515b534d_1773_0.png)\n\
    \n## 边际消费倾向\n\n- 乘数效应有多大？\n- 它取决于消费者对收入增加的反应\n- 边际消费倾向(MPC):\n  - 家庭额外收入中用于消费而不用于储蓄的比例\n\
    \  - 例如： MPC = 0.8，如果收入增加$100，那消费会增加$80\n\n## 乘数公式\n\n注：ΔG 表示政府购买的变动量\nΔY 与 ΔC\
    \ 是产量与消费的最终变动量\n\nY = C + I + G + NX        恒等式\n\nΔY = ΔC + ΔG        I 与 NX\
    \ 没有改变\n\nΔY = MPC ΔY + ΔG        由于 ΔC = MPC ΔY\n\nMPC：边际消费倾向\n\n解出 ΔY\n\nΔY\
    \ = 1 / (1 - MPC) ΔG\n\n乘数\n\n## 乘数公式\n\n乘数的大小取决于边际消费倾向\n\n例：\n如果 MPC = 0.5  \
    \  乘数 = 2\n如果 MPC = 0.75    乘数 = 4\n如果 MPC = 0.9 乘数 = 10\n\nΔY = 1/(1 - MPC) ΔG\n\
    \n乘数\n\nMPC 越大，消费对收入变动的反应越大，因此乘数也越大\n\n## 乘数效应的其他应用\n\n- 乘数效应：\n  - 政府购买增加1美元使总需求的增加大于1美元\n\
    - 它适用于改变GDP的任何一个组成部分\n  - 例如：国外的经济衰退使其对美国净出口的需求减少了100亿美元\n  - 起初，总需求减少100亿美元\n\
    \  - 收入的下降使消费减少，从而进一步减少总需求和收入\n\n## 政府购买\n\n当政府购买变化时，有两种宏观经济效应：\n\n- 挤出效应：\n-\
    \ 挤出效应——当扩张性财政政策引起利率上升，从而减少了投资支出时所引起的总需求减少。\n- 挤出效应倾向于减弱财政政策对总需求的影响。\n  - 财政政策对经济的影响也许并不像乘数预测的那样大。\n\
    \  - 政府购买增加引起利率上升。\n  - 较高的利率减少了投资支出。\n\n## 挤出效应\n\n- 当政府增加200亿美元的购买时，物品与劳务总需求的增加可以大于或小于200亿美元，这取决于乘数效应是大于还是小于挤出效应。\n\
    - 当政府减少个人所得税时，它就增加了家庭可以拿回家的工资。\n  - 家庭把一部分额外的收入储蓄起来。\n  - 家庭也把一部分收入支出于消费品。\n \
    \ - 家庭支出增加使总需求曲线向右移动。\n\n## 税收变动\n\n- 税收变动引起的总需求移动的大小受乘数和挤出效应的影响。\n- 这还取决于家庭对税收变动是持久的还是暂时的感觉。\n\
    \n## 税收变动\n\n- 减税增加了家庭可以拿回家的工资\n- 家庭对于这种收入的增加的反应是增加消费支出，使总需求曲线向右移动\n- 总需求移动的幅度要受乘数效应与挤出效应影响\n\
    - 另一个因素：家庭对税收变动是持久变动还是暂时变动的感觉\n  - 持久的减税会比暂时的减税增加更多的消费支出，使总需求曲线移动的幅度也更大\n\n##\
    \ 讨论\n练习\n\n经济处于衰退之中，总需求曲线向右移动2000亿美元就可以结束衰退\n\n- A. 如果 MPC = 0.8，没有挤出效应，国会应该批准增加多少政府购买来结束衰退？\n\
    \  \n\n- B. 如果存在挤出效应，国会批准的政府购买应该大于还是小于这个数量？\n\n## 讨论\n参考答案\n\n经济处于衰退之中，总需求曲线向右移动2000亿美元就可以结束衰退\n\
    \nA. 如果 MPC = 0.8，没有挤出效应，国会应该批准增加多少政府购买来结束衰退？\n\n乘数 = 1/(1 − 0.8) = 5\n\n政府购买增加400亿美元\n\
    \n会使总需求曲线向右移动 5 x 400亿 = 2000亿\n\n## 讨论\n参考答案\n\n经济处于衰退之中，总需求曲线向右移动2000亿美元就可以结束衰退\n\
    \n- **B.** 如果存在挤出效应，国会批准的政府购买应该大于还是小于这个数量？\n  \n- 挤出效应减少了政府购买对总需求的影响\n  \n- 为抵消挤出效应，国会批准的政府购买应该大于这个数量\n\
    \n## 财政政策与总供给\n\n- 大多数经济学家认为，财政政策的短期宏观经济效应主要是通过总需求发生作用的\n- 然而财政政策也会影响总供给\n- 第一章的经济学十大原理之一：\n\
    \  - 人们会对激励做出反应\n- 税率的降低会使工人增加工作时间，因此会增加物品与劳务的供给量，并使总供给曲线向右移动\n- 供给学派的经济学家认为减税对总供给的影响很大\n\
    \n"
