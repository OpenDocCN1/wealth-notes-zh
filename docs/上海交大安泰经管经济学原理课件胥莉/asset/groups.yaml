  md: "\n## 通货膨胀的分类\n\n- 温和的通货膨胀\n  - 年通胀率低于10%的通货膨胀。\n  - 整个货币体系尚能正常运行。\n  - 货币流通速度大体稳定。\n\
    - 奔腾的通货膨胀\n  - 二位数甚至三位数的通货膨胀（10%—100%）\n  - 货币流通速度加快。\n  - 货币体系已被扭曲。\n  - 通货膨胀有了惯性，停止通胀更为困难。\n\
