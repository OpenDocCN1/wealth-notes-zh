    \ | Q（蒲式耳小麦） | MPL |\n|---|---|---|\n| 0 | 0 | 1000 |\n| 1 | 1000 | 800 |\n| 2\
    \ | 1800 | 600 |\n| 3 | 2400 | 400 |\n| 4 | 2800 | 200 |\n| 5 | 3000 |  |\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_690_0.png)\n\n## 劳动的总产量、平均产量与边际产量\n\n\
    一种可变投入的生产函数：$Q = f(L, \\overline{K}) = f(L)$\n\n总产量：$TP_L = Q = f(L)$\n\n平均产量：$AP_L\
    \ = TP_L / L = Q / L$\n\n边际产量：$MP_L = \\Delta Q / \\Delta L$ 或 $dQ / dL$\n\n-\
    \ 极大值点，递增与递减的转折点\n- $dQ/dL = 0$\n- TP 切线斜率 = MP，如点 M\n- TP 连线斜率 = AP，如点 N\n- 点\
    \ R 切线、连线斜率 = MP & AP\n- 拐点，凸弧与凹弧的转折点\n- $d^2Q/dL^2 = 0$\n\n![](img/518b44ff56ad05e168220626515b534d_692_0.png)\n\
    \n## 总产量、平均产量与边际产量\n\n考察的一种生产要素可变的生产函数，是在分析短期生产函数。\n\n总产量曲线、平均产量曲线和边际产量曲线都是先呈上升趋势，而后达到各自的最大值以后，再呈下降趋势。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_693_0.png)\n\n## 短期生产函数\n\n$Q(L) =\
    \ f(L, \\overline{K})$\n\n## 为什么劳动的边际产量重要\n\n- 经济学十大原理之一：\n  - 理性人考虑边际量\n- 如果农民\
    \ Jack 多雇佣了一个工人，\n  - 由于付的工资多了，他的成本增加\n  - 他的产出上升了 MPL\n- 比较上述情形，帮助 Jack 决定他能否从这个新雇佣的工人身上获益。\n\
    \n## 为什么劳动的边际产量递减\n\n- 随着工人数量的增加，农民 Jack 的产出增加的越来越少。为什么？\n- 伴随着 Jack 增加工人，平均工人变得只有更少的土地去种植，也会变得更缺乏效率。\n\
    - 总而言之，MPL 随着 L 的增加而减少，不管固定投入是土地还是资本（仪器、机器等等）。\n- **边际产量递减：** 一种投入的边际产量随着投入量增加而减少的特征（其他条件不变）。\n\
    \n## 边际产出递减\n\n**边际产出递减**是指当其他生产要素投入量不变时，随着一种生产要素的不断增加，新增产量会逐渐减少！\n\n**例：**由于雇佣的工人越来越多，每个新雇佣的工人对产量的贡献越来越小，这是因为有限的设备数量不能将他的潜能发挥出来。\n\
    \n## 边际收益、边际报酬递减规律\n\n- 边际报酬递减规律：技术和其他要素投入不变，连续增加一种要素投入，边际产量递减；\n- 当投入量小于某一特定数值时，边际产量递增；\n\
    - 当投入量连续增加并超过某一特定值时，边际产量最终会递减；\n- 边际报酬递减规律是短期生产的一条基本规律；\n- 是消费者选择理论中边际效用递减法则在生产理论中的应用或转化形态。\n\
    \n## 边际报酬递减规律存在的条件\n\n- 第一，以技术水平不变为前提；\n- 第二，以其它生产要素投入不变为前提；\n- 第三，并非一增加投入这种生产要素就会出现边际报酬递减规律，只是投入超过一定量时才会出现；\n\
    - 第四，所增加的生产要素在每个单位上的性质都是相同的，先投入和后投入的在技术上没有区别，只是投入总量的变化引起了收益的变化。\n\n**例证：【土地报酬递减规律】**\n\
    \n在1958年大跃进中，不少地方盲目推行水稻密植，结果引起减产。\n\n## 边际收益递减规律原因\n\n- 生产中，可变要素与不变要素之间在数量上都存在一个最佳配合比例，即最佳技术系数；\n\
    - 开始时，由于可变要素投入量小于最佳配合比例所需数量，随着可变要素投入量的逐渐增加，越来越接近最佳配合比例；\n- 边际产量是呈递增的趋势；\n- 当达到最佳配合比例后，再增加可变要素的投入，可变生产要素的边际产量就是呈递减趋势。\n\
    \n## 边际报酬递减规律的3阶段\n\n总产量要经历一个逐渐上升加快 → 增长趋缓 → 最大不变 → 绝对下降的过程。一种生产要素增加所引起的产量变动分为三个阶段：\n\
    \n1. **第一阶段：边际产量递增**\n   - 总产量增加\n2. **第二阶段：边际产量递减**\n   - 总产量增加\n3. **第三阶段：边际产量为负**\n\
    \   - 总产量开始减少\n\n![](img/518b44ff56ad05e168220626515b534d_700_0.png)\n\n- MP 与\
    \ TP 之间关系：\n  - MP>0，TP↑\n  - MP=0，TP最大\n  - MP<0，TP↓\n\n如果连续增加生产要素，在总产量达到最大时，边际产量曲线与横轴相交。\n\
    \n- MP 与 AP 之间关系：\n  - 当MP>AP，AP↑\n  - 当MP<AP，AP↓\n  - MP=AP，AP最高，边际产量曲线与平均产量曲线相交\n\
    \n![](img/518b44ff56ad05e168220626515b534d_701_0.png)\n\n## 单一生产要素连续投入的三个生产阶段\n\
    \n与边际报酬递减规律的3阶段有点区别：MP和AP最高点\n\n- 第一个阶段，平均产出递增。\n  - （一个和尚挑水吃）\n- 第二个阶段，平均产出递减，总产出增速放慢。\n\
    \  - （二个和尚抬水吃）\n- 第三个阶段，边际产出为负，总产出绝对下降。\n  - （三个和尚没水吃，需减员增效）\n\n![](img/518b44ff56ad05e168220626515b534d_702_0.png)\n\
    \n## 从生产函数到总成本曲线\n\n- 一个企业可能的生产量和它的成本之间的关系决定了它的产品定价。\n- 用来说明生产产量和生产总成本之间关系的图被称为**总成本曲线**。\n\
    \n## 例 2：农民 Jack 的成本\n\n| L（工人的数量） | Q（蒲式耳小麦） | 土地的成本 | 劳动的成本 | 总成本 |\n|---|---|---|---|---|\n\
