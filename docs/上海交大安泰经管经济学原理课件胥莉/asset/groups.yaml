    \ 只要收入再分配过程是公正的，政府便不应该干预，即使分配结果不公平\n\n## 减少贫困的政策\n\n- 贫困家庭的成员更可能经历：\n  - 无家可归\n\
    \  - 毒品依赖\n  - 健康问题\n  - 未婚少女怀孕\n  - 文盲\n  - 失业\n- 大部分人认为政府应该提供一个“安全网”\n- 现在我们考虑一些这样的政策……\n\
    \n## 1. 最低工资法\n\n- 支持者认为：\n  - 保护穷人而又不用政府花钱\n  - 如果对不熟练劳动的需求相对缺乏弹性，那么最低工资法对就业几乎没有影响\n\
    - 反对者认为：\n  - 长期里，对不熟练劳动的需求可能是富有弹性的，这样最低工资会引起不熟练劳动工人的大规模失业\n  - 这些被最低工资保护的工人，更可能是中产阶级家庭的青少年，而不是成年的低收入工人\n\
    \n## 2. 福利\n\n- **福利：** 补贴需要者收入的政府计划\n  - 贫困家庭临时援助(TANF)\n  - 补充保障收入(SSI)\n- 批评者认为这些计划激励人们成为或继续成为“需要帮助者”，认为福利使单亲家庭的数量上升\n\
    - 然而，这些激励的严重程度仍不为所知\n- 支持者注意到经过通货膨胀调整后的福利补助一直在下降，但单亲家庭的数量却在上升\n\n## 3. 负所得税\n\n\
    - **负所得税：** 向高收入家庭征税并给低收入家庭补贴的税制\n- 例如： 应纳税额 = (1/3 的收入) − $10,000\n  - 如果收入 =\
    \ $90,000, 应纳税额 = $20,000\n  - 如果收入 = $60,000, 应纳税额 = $10,000\n  - 如果收入 = $30,000,\
    \ 应纳税额 = $0\n  - 如果收入 = $15,000, 应纳税额 = −$5,000\n    那就是说，将从政府得到$5000的收入\n- 劳动所得税抵免(EITC)类似于负所得税\n\
    \n## 4. 实物转移支付\n\n- 实物转移支付是给穷人提供物品或劳务\n  例如：\n  - 给无家可归者提供避难所\n  - 慈善厨房\n  - **食品券**：政府发放的，可以用来在商店购买食物的票证\n\
    \  - **医疗援助**：政府向穷人提供医疗保健\n\n- 一种替代：现金支付\n  - 能够让穷人买他们最需要的东西\n  - 但批评者认为这可能用在购买毒品和嗜酒上\n\
    \n## 反贫困计划和工作激励\n\n- 收入增加，从反贫困计划中得到的资助便会减少\n- 结果：贫困家庭面临高的有效边际税率（在某些情况下甚至会超过100%）\n\
    - 因此这样的政策不鼓励穷人靠他们自己走出贫困\n- 一种可能的解决办法：“劳动福利”，一种要求任何一个得到补贴的人接受一份政府提供的工作的制度\n\n##\
    \ 结论\n\n- 贫困是社会最严重的问题之一\n- 第一章中的经济学十大原理之一：\n  政府有时可以改善市场结果\n  公共政策可以帮助减少贫困和不平等\n\
    - 另一个原则：人们面临权衡取舍\n  旨在帮助促进公平的政策通常会以损失效率为代价，因此合理的政策范围是一个持续争论的主题\n\n## 内容提要\n\n\
    - 收入分配数据表明了我们社会中存在的巨大不平等。最富有的20%家庭的收入是最穷的20%家庭的收入的十倍还多\n- 实物转移支付，经济生命周期，暂时收入和经济流动性使不平等程度的衡量变得困难。当考虑到这些因素时，经济福利的分配会比年收入的分配更平等\n\
    \n## 内容提要\n\n- 政治哲学家关于政府在改变收入分配中的作用的观点并不相同。功利主义者选择使社会中每个人效用之和最大化的收入分配；自由主义者认为政府的目标应该是使社会上状况最差的人的福利最大化；自由主义至上者认为政府的目标应该是保证机会的公平，而不是收入的公平\n\
    \n## 内容提要\n\n- 有许多旨在帮助穷人的政策--最低工资法，福利，负所得税以及实物转移支付\n- 由于经济援助随着收入增加而减少，因此，穷人往往面临很高的有效边际税率。这种高有效税率不鼓励贫困家庭依靠自己的力量脱贫\n\
    \n## 第七篇 深入研究的问题\n\n## 本篇主要内容：\n第21章 消费者选择理论\n\n## 本章我们将探索这些问题的答案：\n\n- 预算约束如何代表了一个消费者能负担得起的选择？\n\
    - 无差异曲线如何代表了消费者的偏好？\n- 什么决定了消费者如何将他的资源花在两种物品上？\n- 消费者选择理论如何解释诸如消费者储蓄多少，供给多少劳动等决策？\n\
    \n## 消费者选择理论回答以下问题：\n\n- 所有需求曲线都是向右下方倾斜吗？\n- 工资如何影响劳动供给？\n- 利率如何影响家庭储蓄？\n\n##\
    \ 消费者选择理论\n\n- 从短期而言，是生产引导消费，不生产哪来消费；但从长期而言，还应当是消费引导生产，只有生产的产品有需求再生产才能继续下去。\n\
    - 在需求曲线背后，有庞大的消费者偏好、消费者行为规律；从消费者行为可推导出需求曲线。\n\n## 介绍\n\n- 第一章中的经济学十大原理之一：\n  人们面临权衡取舍。\n\
    - 当消费者多买某种物品时，他只能买更少的其他物品\n- 工作时间更长意味着更多收入，更多消费，但更少的闲暇时间\n- 减少储蓄会增加今天的消费，却会减少未来的消费\n\
    - 本章我们考察消费者面临这些问题如何做出选择\n\n## 效用\n\n- 消费者消费物品或劳务所获得的满足程度，并且这种满足程度纯粹是一种消费者主观心理感觉\n\
    - 实质上是主观上的使用价值，但大量人群的主观使用价值其统计结果具有客观性。。\n\n## 对效用的理解——《最好吃的东西》\n\n- 兔子和猫争论，世界上什么东西最好吃。兔子说，“世界上萝卜最好吃。萝卜又甜又脆又解渴，我一想起萝卜就要流口水。”\n\
    - 猫不同意，说，“世界上最好吃的东西是老鼠。老鼠的肉非常嫩，嚼起来又酥又松，味道美极了！”\n- 兔子和猫争论不休、相持不下，跑去请猴子评理。\n- 猴子听了，不由得大笑起来：“瞧你们这两个傻瓜蛋，连这点儿常识都不懂！世界上最好吃的东西是什么？是桃子！桃子不但美味可口，而且长得漂亮。我每天做梦都梦见吃桃子。”\n\
    - 兔子和猫听了，全都直摇头。那么，世界上到底什么东西最好吃？\n\n- 说明效用完全是个人心理感觉。\n- 不同的偏好决定了对同一种商品效用大小的不同评价。\n\
    \n## 对效用的理解——《傻子地主》\n\n- 从前，某地闹起了水灾，洪水吞没了土地和房屋。人们纷纷爬上了山顶和大树，想要逃脱这场灾难。\n- 在一棵大树上，地主和长工聚集到一起。地主紧紧地抱着一盒金子，警惕地注视着长工的一举一动，害怕长工会趁机把金子抢走。长工则提着一篮玉米面饼，呆呆地看着滔滔大水。除了这篮面饼，长工已一无所有了。\n\
    - 几天过去了，四处仍旧是白茫茫一片。长工饿了就吃几口饼，地主饿了却只有看着金子发呆。地主舍不得用金子去换饼，长工也不愿白白地把饼送给地主。\n- 又几天过去了，大水悄悄退走了。长工高兴地爬到树下，地主却静静地躺着，永远留在大树上了。\n\
    \n- 说明效用因时因地而异。\n- 金窝银窝不如自己的穷窝？\n\n"
