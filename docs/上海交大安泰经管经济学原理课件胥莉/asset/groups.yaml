    \ 最好的办法是生产 Q = 40。\n\n## 不同市场结构结果的比较\n\n当寡头企业单独地选择利润最大化的产量时：\n\n- 它们生产的产量大于垄断但小于竞争的产量水平。\n\
    - 寡头价格低于垄断价格，但高于竞争价格。\n\n## 寡头数量如何影响市场结果\n\n- 随着寡头市场上卖者数量增加，寡头市场就越来越像竞争市场。\n-\
    \ 市场价格接近于边际成本，生产量接近于社会有效率的水平。\n\n## 博弈论\n\n- **博弈论**研究人们在各种战略情况下如何行事。\n- **战略决策**是指每个人在决定采取什么行动时，必须考虑其他人对这种行动会作出什么反应的决策。\n\
    \n## 博弈的分类\n\n- 按照参与人的先后顺序分为静态博弈和动态博弈。\n- 按照参与人对其他参与人的了解程度分为完全信息博弈和不完全信息博弈。\n\
    - 按照参与人之间是否合作分为合作博弈和非合作博弈。\n\n## 博弈论对厂商策略选择的作用\n\n- 对于厂商来说，能够在实际事件发生之前，提前几步或至少提前竞争者一步正确地预测到有关进出市场、技术创新、产品开发、定价和促销方面的变化常常是其成功的关键。\n\
    - 毫无疑问，事前主动行为是最佳的，但它需要对竞争对手的发起行动和反应作出准确而可靠的预测。这就需要运用博弈论的思想方法去制订自己的策略目标，包括预测竞争对手的行为和作出自己的选择。\n\
    \n## 博弈论\n\n- 博弈论的精髓在于全盘思维（系统思考）和换位思考。\n- 博弈论的换位思考是指理性分析：在选择你的行动时不仅仅是考虑你的利益（当然你的利益可以已经在一定程度上包容了他人的利益），但是你应当用他人的利益去推测他人的行动、从而选择你自己的最佳行动。\n\
    \n## 思考：海盗分金博弈\n\n- 有5个亡命之徒在海上抢到100枚金币，他们决定通过一种民主的方式来分配这笔财富。投票规则如下：5个海盗通过抽签决定每个人提出分配方案的顺序，由排序最靠前的海盗提出一个分配方案，如果有半数或半数以上的人赞成，那么就按照这个海盗提出的分配方案分配金币，否则提出这个方案的海盗就要被扔进海里；再由下一个海盗提出分配方案，如果有半数或半数以上的人赞成，那么就按照他提出的方案进行分配，否则他也会被扔进海里；以此类推。\n\
    \n![](img/518b44ff56ad05e168220626515b534d_634_0.png)\n\n每一个海盗都非常聪明并且知道其他人的凶残。对于海盗而言，他们希望自己获得尽可能多的金币，但是被丢到海里就意味着喂鱼，因此他们都不愿意丢掉性命。试问在这种规则下最后的分配结果是什么？\n\
    \n![](img/518b44ff56ad05e168220626515b534d_635_0.png)\n\n### 博弈示意图\n\n![](img/518b44ff56ad05e168220626515b534d_636_0.png)\n\
    \n∑_{i=1}^{5} x_i^j = 100，x_i^j 表示海盗 j 愿意付给海盗 i 的金币数量。\n"
