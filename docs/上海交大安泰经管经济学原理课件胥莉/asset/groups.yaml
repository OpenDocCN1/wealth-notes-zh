    +   - 存在着超额需求或短缺。\n- 供给者的反应是提高价格。\n- 随着价格提高，需求量减少，供给量增加，价格将趋向于均衡价格。'
  - '[PAGE 225]


    # 判断题


    +   - 均衡价格是供给等于需求时的价格（N）

    +   - 均衡价格是供给价格等于需求价格时的价格（N）

    +   - 均衡价格是供给量等于需求量时的价格（N）


    均衡价格只能是供给曲线和需求曲线相交时的价格。它必须同时满足：


    供给量等于需求量


    供给价格等于需求价格。'
