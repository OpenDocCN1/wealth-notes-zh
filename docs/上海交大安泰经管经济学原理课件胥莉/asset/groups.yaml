    \n- 提高产业价格的能力\n  - 卡特尔形成主导厂商\n  - 剩余需求函数缺乏价格弹性\n- 政府惩罚的较低预期\n- 较低的组织成本\n  - 市场集中度高\n\
    \  - 涉及厂商数量少\n  - 产品同质\n  - 商业协会的存在\n\n## 卡特尔的维持\n\n- 大部分卡特尔中的成员都有违约动机\n- 欺骗的察觉\n\
    \  - 成员数量少\n  - 价格不会无故波动\n  - 交易公开\n- 防止欺骗的方法\n  - 分割市场或固定市场份额\n  - 使用最惠国待遇或相遇—竞争条款\n\
    \  - 建立触发价格机制\n\n## 卡特尔的解体\n\n- 一种观点认为，卡特尔应容易在经济不景气时期解体，因为需求减少导致厂商经营困难\n- 另一种观点认为，卡特尔应在经济高涨时期解体，因为这时违约带来的利润最大\n\
    - Suslow 对47个行业中的72个国际卡特尔协议的分析，支持前一种观点，并得出如下结论\n  - 经济活动不稳定性越大，卡特尔失败概率越高\n  -\
    \ 只有20%的卡特尔能够维持10年以上\n\n## 案例：咖啡卡特尔的解体\n\n- 1991年10月，哥伦比亚和巴西的17家最大咖啡生产商达成限产协议\n\
    - 但是没有制订限制系统（如限定生产上限、监控机制和惩罚措施等）\n- 1992年，咖啡豆丰收，价格暴跌\n- 成员纷纷降价出售，卡特尔解体\n\n## 案例：胡椒卡特尔的失败\n\
    \n- 巴西、印度、印度尼西亚和马来西亚的胡椒产量占95%\n- 卡特尔组织依然无法控制价格\n- 主要是卡特尔成员难以制约\n\n## Cartel 的社会福利损失\n\
    \n- • 提价上的成功，会造成消费者的损失；后者的损失通常超过前者的获益\n\n![](img/518b44ff56ad05e168220626515b534d_656_0.png)\n\
    \n## 寡头均衡的总结\n\n- 如果寡头企业个别追求它们的利益最大化，可能以下结果：\n  - 它们生产的产量之和大于垄断的产量，但小于竞争产业的产量。\n\
    \  - 市场价格低于垄断价格，但高于竞争价格。\n  - 它们的利润之和小于垄断利润。\n\n## 限制与反托拉斯法\n\n- 反托拉斯法将试图限制贸易或垄断一个市场的行为视为非法\n\
    \  - 1890 的谢尔曼反托拉斯法\n  - 1914的克莱顿法\n\n![](img/518b44ff56ad05e168220626515b534d_659_0.png)\n\
    \n## 关于反托拉斯法的争论\n\n- 反托拉斯政策有时禁止有潜在正效果的企业行为：\n  - 转售价格控制\n  - 掠夺性定价\n  - 搭售\n\n\
    ## 关于反托拉斯法的争论\n\n- 转售价格控制（又称公平贸易）\n  - 是指供应商（如批发商）要求零售商在向消费者零售时只能收取某一特定价格的行为。\n\
    - 掠夺性定价\n  - 是指一个大企业采取降价措施将其竞争者赶出市场，建立垄断地位后再提高价格以获取垄断利润。\n- 搭售\n  - 是指一个公司以单一价格同时提供两种或更多产品，而不是分开提供。\n\
    \n## 本篇小结：\n\n- 1、生产成本是生产过程中发生的各种支出，它可以分成固定成本、变动成本、平均成本、边际成本和机会成本等。\n- 2、竞争就是谁也控制不住市场价格。有关企业只能根据边际成本等于边际收益的原则决定产量，但不能决定价格。\n\
    - 3、完全垄断就是一家企业控制整个市场，主要为政府特许、资源和技术的控制。\n\n## 本篇小结：\n\n- 4、寡头为几家企业控制市场，寡头又勾结又竞争，卡特尔的博弈具有不稳定性。\n\
    - 5、垄断竞争产生于产品品牌和质量的差别。\n\n## 练习：\n\n1. 假设某个市场上只有A、B两个厂商。他们的价格和利润如下表所示：\n\n| 价格\
    \ | 利润 |\n|---|---|\n| A生产低价格，B生产低价格 | A的利润30，B的利润20 |\n| A生产高价格，B生产高价格 | A的利润60，B的利润40\
    \ |\n| A生产高价格，B生产低价格 | A的利润20，B的利润50 |\n| A生产低价格，B生产高价格 | A的利润70，B的利润10 |\n\n\
    - (1) 请画出这个博弈的收益表，标明每个厂商的策略以及在每种情况下的利润。\n- \n- (2) 每个厂商是否存在一个占优策略？如果是，请写出每个厂商的占优策略，并解释原因。如果不存在，请解释原因。\n\
    - \n- (3) 这个博弈的纳什均衡是什么？解释原因。\n\n"
