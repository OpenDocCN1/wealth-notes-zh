    # 货币数量论的本质


    由数量方程式开始： *M* x *V* = *P* x *Y*


    +   1. *V* 一直较为稳定

    +   2. 所以当中央银行改变货币量（*M*）时，它引起名义GDP (*P* x *Y*) 的同比例变动

    +   3. *M* 的变化不影响 *Y*：货币是中性的

    +      *Y* 由技术与资源决定

    +   4. 因此，*P* 与 *P* x *Y* 或 *M* 同比例变动

    +   5. 当中央银行迅速增加货币供给时，结果就是高通货膨胀率'
