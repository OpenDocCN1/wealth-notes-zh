    \ | 2.6 | 2.5 |\n\n经济学的十大原理之一：一国的生活水平取决于它生产物品与劳务的能力。理论告诉我们工资与劳动生产率之间的关系（W = VMPL）。我们看看数据。\n\
    \n### 其他生产要素\n\n- 关于土地和资本，必须做出区分：\n  - **购买价格** - 对某种要素永远拥有所支付的价格\n  - **租赁价格**\
    \ - 在一个有限的时间段内使用某种要素所支付的价格\n- 工资是劳动的租赁价格\n- 资本和土地租赁价格的决定类似于工资的决定...\n\n### 土地的租赁价格是如何决定的？\n\
    \n企业通过比较土地的租赁价格与边际产量值(VMP)来决定租赁多少土地\n\n土地的租赁价格调整到使土地需求与供给平衡\n\n![](img/518b44ff56ad05e168220626515b534d_948_0.png)\n\
    \n### 资本的租赁价格是如何决定的？\n\n企业通过比较资本的租赁价格与资本的边际产量值(VMP)来决定租赁多少资本\n\n资本的租赁价格调整到使资本的需求与供给平衡\n\
    \n![](img/518b44ff56ad05e168220626515b534d_949_0.png)\n\n### 租赁价格与购买价格\n\n- 购买一单位的资本或土地会产生有价值的租赁收入流\n\
    - 在任一时期的租赁收入等于边际产量值 (VMP)。\n- 因此，一种要素的均衡购买价格取决于该要素当前的边际产量值以及预期未来会有的边际产量值\n\n###\
    \ 生产要素之间的联系\n\n- 在多数情况下，生产要素以某种方式组合在一起使用，这就使得每种要素的生产率都取决于生产过程中使用的其他要素的可获得量\n-\
    \ 例如：资本数量增加\n  - 资本的边际产量和租赁价格下降\n  - 更多的资本使工人的生产率提高，MPL 和 W 增加\n\n### 结论\n\n-\
    \ 本章所提出的理论称为新古典收入分配理论\n- 它表明：\n  - 要素价格是由要素的供给与需求决定的\n  - 每种要素赚到了它的边际产量值\n- 大多数经济学家用这个理论作为理解收入分配的一个起点\n\
    - 接下来的两章将沿着这个主题深入\n\n### 内容提要\n\n- 经济的收入是在生产要素市场上分配的。三种最重要的生产要素是劳动，土地和资本\n- 一个企业对一种要素的需求是它产量供给的派生需求\n\
    - 竞争的，以利润最大化为目标的企业在某要素的边际产量值等于其租赁价格这一点上使用该要素\n- 劳动的供给产生于个人在工作和闲暇间的权衡取舍，并有一条向右上方倾斜的劳动供给曲线\n\
    - 支付给每种要素的价格的调整使该要素的供给与需求趋于平衡。在均衡时每种要素根据其对物品和劳务生产的边际贡献得到报酬\n- 由于生产要素是同时使用的，一种要素数量的变动会影响所有要素的边际产量和均衡收入\n\
    \n### 本章我们将探索这些问题的答案\n\n- 工资如何来补偿不同工作的特征之间的不同？\n- 为什么教育程度越高，工资也越高？\n- 为什么工资有时会高于它们的均衡价值？\n\
