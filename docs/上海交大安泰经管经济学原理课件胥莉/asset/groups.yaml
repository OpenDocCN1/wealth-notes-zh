  - '[PAGE 626]


    # 寡头的均衡


    +   - 纳什均衡： 相互作用的经济主体在假定所有其他主体所选策略为既定的情况下选择自己最优策略的状态

    +   - 我们双头例子的纳什均衡是每个企业生产 Q = 40

    +     - 如果 V-Mobile 生产 Q = 40, T-Mobile 最好的办法是生产 Q = 40.

    +     - 如果 T-Mobile 生产 Q = 40, V-Mobile 最好的办法是生产 Q = 40.'
