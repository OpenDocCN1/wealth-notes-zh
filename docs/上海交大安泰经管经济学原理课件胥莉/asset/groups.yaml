    # 什么是货币以及它为什么重要


    +   - 没有货币，贸易只能依靠物物交换—用一种物品或劳务交换另一种物品或劳务

    +   - 交易要求欲望的双向一致性—一种不大可能的偶然巧合，即两个人中每个人都有对方想要的物品或劳务

    +   - 许多人都要花时间去搜寻其他人与之贸易—这是对资源的巨大浪费

    +   - 有了货币（经济中人们经常用于向他人购买物品和劳务的一组资产）之后，这样的搜寻就变得没有必要'
  - '[PAGE 1444]


