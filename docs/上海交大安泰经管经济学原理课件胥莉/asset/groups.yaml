    \n![](img/518b44ff56ad05e168220626515b534d_605_0.png)\n\n资料来源：根据央行支付体系运行总体情况报告整理\n\
    \n## 支付行业为例\n\n支付领域活跃用户稳定增长，移动支付和支付APP渗透进入日常生活，逐渐成为我国商业发展的基础性工具。\n\n![](img/518b44ff56ad05e168220626515b534d_606_0.png)\n\
    \n## 支付行业为例\n- 移动支付快速发展，不仅提高了商品交易的效率，而且大大改变了人们的生活方式。\n\n![](img/518b44ff56ad05e168220626515b534d_607_0.png)\n\
    \n资料来源：根据央行支付体系运行总体情况报告整理\n\n## 支付行业为例\n\n# 非银网络支付规模\n\n![](img/518b44ff56ad05e168220626515b534d_608_0.png)\n\
    \n资料来源：根据央行支付体系运行总体情况报告、易观分析整理\n\n## 支付行业为例\n\n# 2013-2022年中国第三方产业支付交易规模\n\n![](img/518b44ff56ad05e168220626515b534d_609_0.png)\n\
    \n数据来源：艾瑞咨询《迈向产业支付时代：中国第三方支付行业研究报告》\n\n## 支付行业为例\n\n# 2020Q2中国第三方移动支付交易规模市场份额\n\
    \n![](img/518b44ff56ad05e168220626515b534d_610_0.png)\n\n数据来源：艾瑞咨询\n\n## 图1. 市场结构的四种类型\n\
    \n![](img/518b44ff56ad05e168220626515b534d_611_0.png)\n\n# 企业数量\n\n# 产品类型\n- **垄断**（15章）\n\
    \  - 自来水\n  - 有线电视\n- **寡头**（16章）\n  - 网球\n  - 原油\n- **垄断竞争**（17章）\n  - 小说\n \
    \ - 电影\n- **完全竞争**（14章）\n  - 小麦\n  - 牛奶\n\n## 市场结构：寡头垄断\n- 条件：少数几家大厂商；进入壁垒很高\n\
    - 产业：石油化工；钢铁；汽车制造；飞机制造；航空运输等\n- 市场策略：根据不同的信息结构、决策机制以及合作倾向等进行选择\n- 效率得失：有利于实现规模经济性；促进技术进步；消费者在市场上处于劣势\n\
    \n## 寡头市场的特征\n- 只有少数几个卖者提供相似或相同的产品。产品既可同质，也可存在差别\n- 企业之间的行为相互影响。厂商之间互相依存，厂商行为具有不确定性。\n\
    - 由于寡头市场只有几个卖者，所以寡头的关键特征是合作与竞争之间的冲突。\n- 寡头集体合作起来并像一个垄断者那样行事——生产少量产品并收取高于其边际成本的价格，它们的状况会最好。\n\
    \n## 典型的寡头垄断产业\n- 航空运输业\n  - 美国：AA，UA，Delta市场份额在50%以上\n  - 中国：国航、东航和南航的市场份额在80%以上\n\
    - 汽车制造业\n  - 美国的三大汽车制造厂占70%左右\n  - 中国的三大汽车制造厂占50%左右\n- 钢铁制造业（C4）\n  - 美国：61；日本：73；俄罗斯：69；中国：18\n\
    \n"
