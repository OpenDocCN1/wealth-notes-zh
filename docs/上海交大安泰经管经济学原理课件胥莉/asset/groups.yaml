    # 边际决策与平均决策


    # 边际决策与平均决策


    +   - 与我们经常使用的从整体上比较收益和成本的“平均决策方法”不同

    +   - 边际决策方法的思想：过去事就让它过去，不要让它影响你未来的决策。'
