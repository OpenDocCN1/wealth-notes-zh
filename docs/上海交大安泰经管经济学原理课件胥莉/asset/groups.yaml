    \n（1）该行业长期均衡的价格和厂商的产量。\n\n（2）若市场需求曲线是 $P=9600-2Q$，长期均衡中留存于该行业的厂商数是多少？\n\n（1）完全竞争企业的长期均衡条件：经济利润为零，产品价格等于最低平均成本，$P=LMC=\\\
    min LAC$。\n\n（2）$q=30$，$P=LAC=600$。\n\n（3）$Q=4800-0.5P=4500$。\n\n## 练习3\n\n完全竞争市场中某厂商的成本函数为\
    \ $STC=Q^3-6Q^2+30Q+40$，产品价格 $P=66$ 美元。试求：\n\n（1）利润最大时的产量和利润。\n\n（2）若价格降为 $P=30$\
    \ 美元，厂商是否亏损？如果亏损，最小亏损额是多少？\n\n（3）厂商在什么情况下才会停止生产？\n\n在完全竞争市场：利润最大时 $MR=MC=P$。$MC=3Q^2-12Q+30$，$MR=P=66$，解得\
    \ $Q=6$，那么利润 $=TR-STC=PQ-STC(6)=176$。\n\n当价格是 30 时，$MC=P$，$MC=3Q^2-12Q+30$，得 $Q^*=4$，最小亏损额\
    \ $=-8$。\n\n停止生产：$AVC$ 最低点处对应的产量 $Q=3$，$AVC_{\\min}=21$，所以当 $P=21$ 时停止生产。\n\n\
    $P=3Q^2-12Q+30$（$Q\\ge3$）。\n\n## 练习4\n\n假设完全竞争市场的需求函数和供给函数分别是 $Q_d=50000-2000P$\
    \ 和 $Q_s=40000+3000P$。求：\n\n（1）市场均衡价格和均衡产量。\n\n（2）厂商的需求函数是怎么样的？\n\n由 $Q_D=Q_S$：$50000-2000P=40000+3000P$，得\
    \ $P=2$。\n\n厂商的需求函数是 $P=2$。\n\n## 练习5\n\n假设完全竞争市场中有 100 个厂商，每个厂商的成本函数为 $STC=0.1q^2+q+10$，成本单位为美元。试求：\n\
    \n1. 求市场的供给函数。$P=0.2q+1$；$q=5P-5$（$P\\ge1$）。\n2. 假设市场需求函数为 $Q_D=4000-400P$，求市场的均衡价格和产量。\n\
    3. 假设对每单位产品征收 0.9 美元的税，新的市场均衡价格和产量是多少？$Q_S=500(P-0.9)-500$。\n\n## 练习6\n\n假设完全竞争市场中一个企业的产品单价是\
    \ 640 美元，成本函数为 $TC=240Q-20Q^2+Q^3$。\n\n（1）求利润最大化时的产量、此产量的单位平均成本、总利润（$MR=MC$）。\n\
    \n（2）若这个企业是代表性企业，行业是否处于长期均衡状态？否。\n\n（3）若处于长期均衡，均衡时，这家企业的产量是多少，单位成本是多少，产品单价是多少？\n\
    \n$P=140$，$Q=10$，单位成本 $=140$。\n\n## 第五篇 企业行为与产业组织\n\n## 第15章 垄断\n\n## 本章我们将探索这些问题的答案\n\
    \n- 为什么会产生垄断？\n- 为什么垄断者的 $P>MR$？\n- 垄断者如何决定它们生产产品的价格与数量？\n- 垄断者对社会的福利有何影响？\n-\
    \ 政府能对垄断做些什么？\n- 什么是价格歧视？\n\n## 介绍\n\n- **垄断**：一个没有相近替代品的产品的唯一卖者的企业\n- 本章我们将学习垄断，并将它与完全竞争做对比\n\
    - 关键的区别：垄断企业具有**市场势力**，能影响它出售产品的市场价格的能力。一个竞争性企业则没有市场势力\n\n## 完全垄断市场\n\n- 完全垄断市场：指一家厂商完全控制整个市场的商品供给。\n\
    - 形成完全垄断的条件：\n  - 唯一的卖者\n  - 无相近的替代品\n  - 存在进入障碍，可竞争性的市场不是完全垄断市场\n- 完全垄断市场上，垄断者能获得超额利润主要是由于实行了卖方垄断。\n\
    \n## 为什么会产生垄断\n\n垄断的基本原因是进入障碍。\n\n![](img/518b44ff56ad05e168220626515b534d_832_0.png)\n\
    \n## 垄断的成因\n\n进入障碍有三个主要来源：\n\n- 关键资源由一家企业拥有；\n- 拥有生产某种商品的专利权和技术；\n- 政府给予一个企业排他性地生产某种产品或劳务的权利，如铁路；\n\
    - 生产成本使一个生产者比大量生产者更有效率，自然垄断。如自来水公司、煤气公司。\n\n自然垄断：一个企业能够以低于其他企业的成本向整个市场供应一种所需的物品或劳务。\n\
    \n例如：1000 个家庭需要电力。如果一个企业向 1000 个家庭供应电力的平均总成本比两个企业分别向 500 个家庭供应电力的平均总成本更低。\n\n\
    电力\n\n由于固定成本很大，而边际成本很小，ATC 曲线向下倾斜。\n\n![](img/518b44ff56ad05e168220626515b534d_834_0.png)\n\
    \n## 作为垄断原因的规模经济\n\n![](img/518b44ff56ad05e168220626515b534d_835_0.png)\n\n成本；产量；平均总成本；0\n\
    \n## 垄断企业与竞争企业的比较\n\n| 垄断企业 | 竞争企业 |\n| --- | --- |\n| 市场上唯一卖者 | 很多生产者当中的一个 |\n\
    | 其需求曲线是向右下方倾斜 | 其需求曲线是水平的 |\n| 价格制定者 | 价格接受者 |\n| 降低价格才能提高销量 | 在相同价格下想卖多少就卖多少\
    \ |\n\n## 垄断企业与竞争企业面临的需求曲线\n\n### (a) 一家竞争企业的需求曲线\n\n![](img/518b44ff56ad05e168220626515b534d_837_0.png)\n\
    \n### (b) 一家垄断企业的需求曲线\n\n![](img/518b44ff56ad05e168220626515b534d_837_1.png)\n\
    \n一家厂商就是整个行业，厂商的需求曲线就是整个市场的需求曲线。\n\n在完全竞争市场，市场需求曲线向下倾斜，但在市场价格上，一家竞争企业面临的需求曲线是水平的，企业能够增加产品数量而不降低价格，因此对竞争企业而言：$MR=P$。\n\
    \n## 垄断者如何作出生产与定价策略\n\n- 完全垄断厂商的需求曲线与收益曲线\n- $d=AR=P$，厂商的需求曲线即市场的需求曲线\n- $MR=\\\
    frac{dTR}{dQ}=\\frac{d(P\\cdot Q)}{dQ}=P+Q\\cdot\\frac{dP}{dQ}<P$\n- 边际收益小于平均收益\n\
    \nTR 总收益曲线是一条抛物线。\n\n![](img/518b44ff56ad05e168220626515b534d_838_0.png)\n\n##\
    \ 完全垄断厂商的需求曲线与收益曲线\n\n- 例：设反需求函数为 $P=a-bQ$，则总收益函数为 $TR=P\\cdot Q=aQ-bQ^2$，边际收益函数为\
    \ $MR=dTR/dQ=a-2bQ$。\n- $\\frac{dP}{dQ}=-b$，$\\frac{dMR}{dQ}=-2b$。\n- 当垄断厂商的需求曲线是直线时，需求曲线和边际收益曲线的纵轴截距相等，边际收益曲线的横轴截距是需求曲线横轴截距的一半。\n\
    \n## 总收益、边际收益、价格与需求弹性的关系\n\n$$MR=\\frac{dTR}{dQ}=\\frac{d(P\\cdot Q)}{dQ}=P+Q\\\
    cdot\\frac{dP}{dQ}=P\\left(1+\\frac{dP}{dQ}\\cdot\\frac{Q}{P}\\right)=P\\left(1-\\\
    frac{1}{|e_d|}\\right)$$\n\n$$\\frac{dTR}{dP}=\\frac{d(P\\cdot Q)}{dP}=Q+P\\cdot\\\
    frac{dQ}{dP}=Q\\left(1+\\frac{dQ}{dP}\\cdot\\frac{P}{Q}\\right)=Q\\left(1-\\frac{1}{|e_d|}\\\
    right)$$\n\n- 当 $|e_d|>1$ 时，边际收益 $>0$，总收益与价格反向变动；此时，TR 斜率为正，表示厂商总收益随销售量的增加而增加。\n\
    - 当 $|e_d|=1$ 时，边际收益 $=0$，总收益与价格变动无关；此时，TR 斜率为零，表示厂商总收益达到极大值点。\n- 当 $|e_d|<1$\
    \ 时，边际收益 $<0$，总收益与价格同向变动；此时，TR 斜率为负，表示厂商总收益随销售量的增加而减少。\n\n"
