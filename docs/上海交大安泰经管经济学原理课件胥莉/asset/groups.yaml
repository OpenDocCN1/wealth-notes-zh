    \n- 供给冲击：直接改变企业的成本和价格，使经济中的总供给曲线移动，进而使菲利普斯曲线移动的事件\n- 例如：石油价格的大幅上涨\n\n## 不利供给冲击如何移动菲利普斯曲线\n\
