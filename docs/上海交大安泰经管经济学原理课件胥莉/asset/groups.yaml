    \n失业率没有发生变化，因为一个人无论是做全职还是兼职工作都被视作“就业者”。\n\n事情变得越来越糟，但失业率并没有反映该状况。\n\n## 失业率真的衡量什么？\n\
    \n- 失业率并不是衡量失业或劳动力市场健康状况的完美指标：\n  - 它将丧失信心的工人排除在外\n  - 它没有区分全职工作和兼职工作，或者人们只是因为找不到全职工作才去做兼职\n\
    \  - 在劳工统计局调查时，一些人并没有如实报告自己的工作状况\n- 尽管存在这些问题，失业率仍然是劳动力市场和经济的一个非常有用的晴雨表\n\n## 周期性失业与自然失业率\n\
    \n尽管每年的失业率一直在变化，但总是有失业存在。\n\n### 自然失业率\n\n- 失业率围绕它而波动的正常失业率\n\n### 周期性失业\n\n-\
    \ 失业率对自然失业率的背离\n- 这和商业周期有关，我们在接下来的章节中将学习这些内容\n\n## 美国的失业：1960–2012\n\n![](img/518b44ff56ad05e168220626515b534d_1417_0.png)\n\
    \n## 对自然失业率的解释：一个概述\n\n即使经济状况很好，失业总是存在，包括：\n\n### 摩擦性失业\n\n- 由于工人寻找最适合自己嗜好和技能的工作需要时间而引起的失业\n\
    - 对大多数工人而言，失业持续时间较短\n\n### 结构性失业\n\n- 由于某些劳动市场上可提供的工作岗位数量不足以为每个想工作的人提供工作而引起的失业\n\
    - 通常持续时间较长\n\n## 寻找工作\n\n- 工人有不同的嗜好与技能，不同的工作有不同的要求\n- 寻找工作是使工人与合适的工作相匹配的过程\n-\
    \ 部门转移是各行业或各地区之间的需求构成变动\n- 这样的部门转移会清退一些工人，他们必须重新寻找适合他们技能与嗜好的新工作\n- 由于经济一直在变动，摩擦性失业不可避免。\n\
    \n## 公共政策和寻找工作\n\n- 政府管理的就业机构\n  - 发布有关职位空缺的信息，加快工人与工作的匹配\n- 公共培训计划\n  - 其目的是使处于衰落行业的工人学到转移到增长行业所需的技能\n\
    \n## 失业保险\n\n- **失业保险：** 当工人失业时为他们提供部分收入保障的政府计划\n- 失业保险增加了摩擦性失业\n  - 想知道为什么，想想经济学的十大原理之一：**人们会对激励做出反应**\n\
    - 当工人找到一份新工作时，失业补助停止发放。所以当还可以享受失业补助时，失业者不会努力地找工作\n\n## 公共政策与寻找工作\n\n- 结构性失业——当劳动供给量大于需求量时的失业。\n\
    - 结构性失业通常被认为可以解释较长的失业持续时间。\n\n## 结构性失业的解释\n\n- 当工作岗位数量不足以为每个想工作的人提供工作时，便会产生结构性失业\n\
    - 结构性失业通常被认为可以解释较长的失业持续时间。\n\n当工资高于均衡工资时，就会产生结构性失业。这其中有三个原因……\n\n![](img/518b44ff56ad05e168220626515b534d_1423_0.png)\n\
    \n### 1. 最低工资法\n\n- 对低技能或缺乏经验的工人而言，最低工资超过均衡工资，这会导致结构性失业\n- 但这部分工人只是劳动力的一小部分，因此最低工资不能解释大部分的失业\n\
    \n### 2. 工会\n\n- **工会：** 与雇主就工资、津贴和工作条件进行谈判的工人协会\n- 工会用它们的市场势力来为工人争取更高的工资\n- 参加工会的工人的工资比不属于工会的类似工人的工资要高20%，并且参加工会的工人还能得到更多的其他好处\n\
    - 当工会把工资提高到均衡水平以上时，劳动需求量减少，引起失业\n- “局内人”——仍然就业的工人，他们的状况变好了\n- “局外人”——以前有工作而现在失业的工人，他们的状况变坏了\n\
    - 一些局外人会去没有工会的劳动市场，增加那些市场的劳动供给，并减少均衡工资。\n\n工会对经济是好还是坏？经济学家对此的看法并不一致。\n\n- 批评者：\n\
    \  - 工会是一种卡特尔，它们把工资提高到均衡水平以上，引起失业并降低了其他没有工会的劳动市场的工资\n- 支持者：\n  - 工会与大企业的市场势力相抗衡，并使企业对工人的要求更积极地做出回应\n\
    \n### 3. 效率工资\n\n- **效率工资**理论：\n  - 企业为了提高工人生产率而自愿地支付高于均衡水平的工资\n- 不同的效率工资理论对企业为什么想支付高工资给出了不同的解释\n\
    \n企业支付效率工资的四个原因：\n\n#### 1. 工人健康\n\n在一些欠发达国家，营养不良是一个很普遍的问题。支付更高的工资可以使工人吃好，更健康，更有生产率。\n\
    \n#### 2. 工人流动率\n\n企业雇佣并培训新工人是有成本的。支付高工资可以鼓励工人留在原企业，减少流动率。\n\n\n"
