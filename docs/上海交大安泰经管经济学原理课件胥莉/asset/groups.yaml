    \ 让我们用模型来分析：为挽救美国汽车行业的工作机会，美国对日本汽车实行进口配额时的影响\n\n## 对日本汽车实行进口配额的分析\n\n由于进口配额不影响储蓄或投资，因此它不会影响\
    \ NCO\n(NCO = S - I)\n\n## 可贷资金\n\n## 资本净流出\n\n![](img/518b44ff56ad05e168220626515b534d_1625_0.png)\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1625_1.png)\n\n## 对日本汽车实行进口配额的分析\n\n\
    ## 外汇市场\n\n由于NCO没有改变，外汇市场的供给曲线也不变\n\n需求曲线移动：\n在每个E，进口汽车的数量下降，净出口增加，需求曲线向右移动\n\n\
    在E₁，外汇市场对美元有超额需求\n\nE上升，外汇市场重新回到平衡\n\n![](img/518b44ff56ad05e168220626515b534d_1626_0.png)\n\
    \n## 对日本汽车实行进口配额的分析\n\n## *NX* 发生了什么变化？什么也没发生！\n\n- 如果 *E* 仍然维持在 *E*₁，*NX* 会上升，对美元的需求量也会增加\n\
    - 但进口配额不影响 *NCO*，因此美元数量的供给不变\n- 由于 *NX* 必须等于 *NCO*，因此 *E* 必须上升，而 *NX* 不变\n- 因此，限制进口的政策并没有减少贸易赤字\n\
    \n## 对日本汽车实行进口配额的分析\n\n这种政策能挽救汽车行业的工作机会吗？\n\n配额减少了日本汽车的进口：\n\n- 美国消费者购买更多的美国汽车\n\
    - 美国汽车生产商雇佣更多的工人来生产这些额外的汽车\n- 因此这种政策挽救了美国汽车工业的工作机会\n\n但 E 上升，减少了外国对美国出口的物品与劳务的需求\n\
    \n- 出口行业受损，出口企业解雇工人\n\n进口配额挽救了汽车行业的工作机会，但却减少了美国出口行业的工作机会！！\n\n## 案例研究：中国的资本流动\n\
    \n- 过去数年，中国通过压低人民币的汇率来鼓励出口，从而积累了大量美国资产\n- 导致美国：\n  - 美元相对于人民币升值\n  - 从中国进口更多物品\n\
    \  - 贸易赤字增加\n- 一些美国政治家要求中国停止“通货操纵”，否则会限制与中国的贸易，以此来保护受影响的美国产业\n- 然而，美国的消费者却从低价格中获益，中国通货操纵对美国经济的净影响也许并不大\n\
    \n## 墨西哥的资本外逃\n\n随着外国投资者出售他们的资产并把资本转移出墨西哥，每笔资本筹集来的资金流入的增加使可贷资金的需求也增加\n\n![](img/518b44ff56ad05e168220626515b534d_1631_0.png)\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1631_1.png)\n\n## 资本外逃的例子：墨西哥，1994\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1633_0.png)\n\n## 资本外逃的例子：东南亚，1997\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1634_0.png)\n\n## 资本外逃的例子：俄罗斯，1998\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1635_0.png)\n\n## 资本外逃的例子：阿根廷，2002\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1636_0.png)\n\n## 案例研究：贬值的美元\n\n两种可能的原因：\n\
    \n- 次贷危机\n  - 对美国住房抵押贷款证券的信心下降\n  - 资本净流出增加\n- 美国利率下降\n  - 从2006年7月到2008年7月，为刺激经济，联邦基金利率从\
    \ 5.25%下降到2.00%\n  - 资本净流出增加\n\n## 讨论\n贸易政策\n\n- 假设纺织工人工会鼓励人们只购买美国制造的衣服。这种政策对贸易余额和真实汇率有什么影响？对纺织行业有什么影响？对汽车行业有什么影响？\n\
    \n## 讨论\n参考答案\n\n- （1）纺织工人工会鼓励人们只购买美国制造的衣服，这会减少服装的进口。由于净出口等于出口减进口，因此，在每一既定的真实汇率上，美国的净出口增加了。这将引起外汇市场的需求曲线向右移动，如图所示，结果是真实汇率上升，但并不影响贸易余额。\n\
    \n## 讨论\n\n## 参考答案\n\n![](img/518b44ff56ad05e168220626515b534d_1641_0.png)\n\n\
    ## 讨论\n参考答案\n\n- （2）纺织行业的进口将减少，但因为真实汇率上升了，其他行业（如汽车行业等）的进口将增加。\n\n## 讨论\n贸易政策\n\
    \n- 假设欧洲各国真实利率上升。解释这将如何影响美国的资本净流出，然后用本章的理论解释这种变化将如何影响美国的净出口。美国的真实利率和真实汇率将发生什么变动？\n\
    \n## 参考答案\n\n- 欧洲各国真实利率上升会引起美国资本净流出的增加。由于均衡时净出口等于资本净流出（NX=NCO），资本净流出的增加导致净出口增加。如图所示，净外国投资的增加导致真实汇率降低，真实利率上升和净出口增加。\n\
    \n"
