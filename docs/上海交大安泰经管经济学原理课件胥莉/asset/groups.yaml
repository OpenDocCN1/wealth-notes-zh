    # 第35章 通货膨胀与失业之间的短期权衡取舍'
  - '[PAGE 1798]


    # 本章我们将探索这些问题的答案：


    +   - 短期内通货膨胀与失业有什么关系？长期内呢？

    +   - 什么因素会改变通货膨胀与失业之间的这种关系？

    +   - 减少通货膨胀的短期成本是什么？

    +   - 为什么在20世纪90年代美国的通货膨胀与失业率都很低？'
  - '[PAGE 1799]


    # 介绍


    物价水平上涨不影响产出


    +   - 在长期中，通货膨胀与失业是不相关的：

    +     - 通货膨胀率主要取决于货币供给的增长率

    +     - 自然失业率取决于最低工资法，工会的市场势力，效率工资以及寻找工作的有效性

    +   - 经济学十大原理之一：


    社会面临通货膨胀和失业之间的短期权衡取舍'
  - '[PAGE 1800]


    # 失业和通货膨胀的关系：


    凯恩斯学派认为，失业与通货膨胀之间存在着替代关系，菲里普斯曲线向右下方倾斜，因为货币供给增加，利率下降，企业 的边际成本下降，企业家扩大生产规模，就业增加，所以政府可以以增加货币供给的方式降低失业率。


    货币主义者认为，公众只有在短期中存在“货币幻觉”，长期中，他们会意识到自己的实际收入随物价的上涨而下跌，所以要求增加工资，企业家就会缩小生产规模，实际失业还要回到“自然失业率”水平上，菲里普斯曲线'
  - '[PAGE 1801]


    在**短期**中是条**斜线**，而在**长期**中则是条**垂线**，货币供给增加只会造成物价的上涨。


    失业率=自然失业率−a（实际通胀率−预期通胀率）


    弗里德曼认为无论通胀如何，失业率都要回到自然率水平上，这被称为自然率假说。也就是说，在长期中，失业和通胀之间没有替代关系。'
  - '[PAGE 1802]


    # 菲利普斯曲线


    +   - 菲利普斯曲线：一条表示通货膨胀与失业之间短期权衡取舍的曲线

    +   - 1958年，菲利普斯（A.W. Phillips）说明英国名义工资增长率与失业率之间的负相关关系

    +   - 1960年，保罗·萨缪尔森（Paul Samuelson）与罗伯特·索洛（Robert Solow）发现美国通货膨胀与失业之间也存在这种负相关关系，他们把它称为“菲利普斯曲线”'
  - '[PAGE 1803]


    # 菲利普斯曲线的推导


    +   - 假设今年 $P = 100$

    +   - 下面的图形表示明年可能出现的两种结果：

    +     - **A.** 总需求低，物价水平上升缓慢（低通货膨胀），低产出，高失业

    +     - **B.** 总需求高，物价水平上升快（高通货膨胀），高产出，低失业'
