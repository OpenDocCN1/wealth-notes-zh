    - 现代货币数量论的代表是弗里德曼（Milton Friedman）。\n  - 我们通过两条途径来学习该理论：\n    1. 供需表\n    2. 方程式\n\
    \n## 物价水平与货币价值\n\n货币的价值（货币购买力）和物价水平都由货币数量决定。货币的价值与货币数量成反比，物价水平和货币数量同方向变动。货币数量越多，货币价值越低，物价水平越高。\n\
    \n## 货币价值\n\n- P = 物价水平\n  （如 CPI或GDP平减指数）\n  P 是用货币衡量的一篮子物品的价格\n\n- 1/P 是用物品衡量的1美元的货币价值\n\
    \n- 例如： 篮子含1个糖果\n  - 如果 P = $2， 1美元的价值等于 1/2 的糖果\n  - 如果 P = $3， 1美元的价值等于 1/3\
    \ 的糖果\n\n- 通货膨胀使物价总水平上升，并减少货币价值\n\n## 货币供给\n\n- 货币的供给与需求决定了货币的价值和均衡的物价水平。\n- 在现实世界，货币供给由美联储，银行体系和消费者共同决定。\n\
    - 货币的需求受许多因素影响，其中平均物价水平是最重要的影响因素。\n- 在这个模型中，我们假设美联储精确地控制货币供给量，并使它为一个固定的数量\n\n\
