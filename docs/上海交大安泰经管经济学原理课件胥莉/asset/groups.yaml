    \n## 讨论\n低档物品与正常物品\n\n- 收入增加会使**正常物品**的需求量增加，**低档物品**的需求量减少\n- 如果鱼是正常物品，而芒果是低档物品\n\
    - 用图形表示出收入增加对小马的鱼与芒果的最优消费量的影响\n\n## 价格变动如何影响消费者的选择\n\n任何一种物品价格下降都会使预算约束线向外转动，从而改变预算约束线的斜率。\n\
    \n## 价格变动\n\n百事可乐\n数量\n1,000\n500\n0\n\n新预算约束线\n\n原来的预算约束线\n\n最新优点\n\nI₂\n\nI₁\n\
