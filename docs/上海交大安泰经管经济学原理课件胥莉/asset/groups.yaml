    # 金融市场


    +   - 股票市场

    +     - 股票 代表企业的所有权，所以也代表对所获得利润的索取权。

    +     - 出售股票来筹资称为股本筹资。

    +       - 与债券相比，股票的风险高，潜在收益也高。

    +     - 美国经济中最重要的股票交易所是纽约股票交易所、美国股票交易所和纳斯达克（NASDAQ）。'
  - '[PAGE 1316]


    # 金融中介机构·银行


    +   - **银行**

    +     - 从想储蓄的人那里得到存款，并用这些存款向想借款的人进行贷款。

    +     - 向存款人的存款支付利息，并向借款人的贷款收取略高一点的利息。

    +     - 银行通过允许人们根据自己的存款签发支票，帮助创造出一种**交换媒介**。

    +       - 交换媒介是人们能容易地用来进行交易的东西。

    +     - 这方便了物品与劳务的购买。'
