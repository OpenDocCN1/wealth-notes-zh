    +   - 政府雇佣许多经济学家来提供政策建议。比如美国总统有一个经济顾问委员会，本书的作者即是2003-2005经济顾问委员会的主席'
  md: "\n## 经济学训练你……\n\n- 从不同的角度思考问题。\n- 评估个人和社会选择的成本。\n- 检查和理解一些事件和问题是如何相互关联的。\n\n\
    ## 经济学家的思考方式\n\n- 观察、理论、进一步观察，也就是通过观察，得出结论，进一步观察，修正结论。\n- 假设，从与实际情况并不相符的前提出发。\n\
    - 经济学的研究是证实，而不是证伪。\n- 经济学分析要建立模型，也就是依据假定和逻辑关系，建立有关经济变量的模型，可以简化认识实际生活，帮助解释复杂的真实世界如何运行。\n\
    - 实证表述只说明是什么，而不作出价值判断；规范分析则要说明应该是什么，也就是做出价值判断。\n\n## 我们的第一个模型：循环流量图\n\n- 循环流量图：一个说明货币如何通过市场在家庭与企业之间流动的直观经济模型\n\
    - 两类主体：\n  - 家庭\n  - 企业\n- 两个市场：\n  - 物品与劳务市场\n  - 生产要素市场\n\n## 图1：循环流量图\n\n-\
    \ 家庭：\n  - 拥有并出售或出租生产要素给企业以获得收入\n  - 购买并消费物品与劳务\n- 企业：\n  - 购买或雇佣生产要素并用以生产物品与劳务\n\
    \  - 出售物品与劳务\n\n## 经济循环流向图\n\n![](img/518b44ff56ad05e168220626515b534d_94_0.png)\n\
    \n## 我们的第二个模型：生产可能性边界\n\n- 生产可能性边界（PPF）：表示在可得到的生产要素与生产技术既定时，一个经济所能生产的两种产品数量的各种组合的图形\n\
    - 例如：\n  - 两种物品：电脑与小麦\n  - 一种资源：劳动力（以小时为单位来衡量）\n  - 每月经济有50,000个劳动小时可用于生产\n\n\
    ## 生产可能性边界的例子\n\n- 生产一台电脑需要100个小时的劳动\n- 生产一吨小麦需要10个小时的劳动\n\n| 点 | 雇佣的劳动小时（电脑）\
    \ | 雇佣的劳动小时（小麦） | 生产（电脑） | 生产（小麦） |\n|---|---:|---:|---:|---:|\n| A | 50,000 |\
    \ 0 | 500 | 0 |\n| B | 40,000 | 10,000 | 400 | 1,000 |\n| C | 25,000 | 25,000\
    \ | 250 | 2,500 |\n| D | 10,000 | 40,000 | 100 | 4,000 |\n| E | 0 | 50,000 | 0\
    \ | 5,000 |\n\n| 图表上点 | 生产（电脑） | 生产（小麦） |\n|---|---:|---:|\n| A | 500 | 0 |\n\
    | B | 400 | 1,000 |\n| C | 250 | 2,500 |\n| D | 100 | 4,000 |\n| E | 0 | 5,000\
    \ |\n\n![](img/518b44ff56ad05e168220626515b534d_97_0.png)\n\n## 讨论：不在生产可能性边界上的点\n\
    \n- A.在图上找出代表（100台电脑，3000吨小麦）的点，并标作F。经济能生产出这样的两种产品数量组合吗？为什么？\n- B.接下来，找出代表（300台电脑，3500吨小麦）的点，并标作G。经济能生产出这样的两种产品组合吗？为什么？\n\
    \n## 讨论：参考答案\n\n- 点 F：100台电脑，3000吨小麦\n- 点 F 需要 40,000个小时的劳动。能够达到但没有效率：不用减少任何物品的生产便能获得更多的两种物品\n\
    \n![](img/518b44ff56ad05e168220626515b534d_99_0.png)\n\n- 点 G：300台电脑，3500吨小麦\n\
    - 点G需要65,000个小时的劳动，因为经济只有50,000个劳动小时，所以不可能。\n\n![](img/518b44ff56ad05e168220626515b534d_100_0.png)\n\
    \n## 关于生产可能性边界目前为止我们所知的内容\n\n### 在生产可能性边界上的点（A-E）\n\n- 能够达到\n- 效率：所有资源都已经充分利用\n\
    \n### 在生产可能性边界以内的点（F）\n\n- 能够达到\n- 没有效率：一些资源没有充分利用（比如，工人失业，厂房闲置等）\n\n### 在生产可能性边界以外的点（G）\n\
    \n- 不能达到\n\n## 生产可能性边界与机会成本\n\n- 复习：机会成本是为了得到某种东西所必须放弃的东西\n- 沿着生产可能性边界移动意味着将资源（比如劳动）从一种物品的生产转移到另一种物品的生产中\n\
    - 社会面临权衡取舍：得到更多的一种物品需要以更少的另一种物品为代价\n- 生产可能性边界的斜率告诉我们以一种物品来衡量另一种物品的机会成本\n\n![](img/518b44ff56ad05e168220626515b534d_103_0.png)\n\
    \n直线的斜率等于直线的横坐标向右移动一个单位时，直线的纵坐标变化的大小。本图，1台电脑的机会成本是10吨小麦。\n\n在哪个国家布料的机会成本更小？\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_104_0.png)\n\n![](img/518b44ff56ad05e168220626515b534d_104_1.png)\n\
    \n英格兰，因为它的生产可能性边界的斜率没有法国的陡峭。\n\n![](img/518b44ff56ad05e168220626515b534d_105_0.png)\n\
    \n![](img/518b44ff56ad05e168220626515b534d_105_1.png)\n\n## 经济增长和生产可能性边界\n\n如果有额外的资源或技术进步，经济便能生产更多的电脑，小麦，或两种物品的组合\n\
    \n![](img/518b44ff56ad05e168220626515b534d_106_0.png)\n\n## 生产可能性边界的形状\n\n- 生产可能性边界可以是直线或曲线\n\
    - 取决于经济将资源从一个行业转向另一个行业时机会成本的变化情况\n  - 如果机会成本不变，那生产可能性边界为一条直线（在上述例子中，1台电脑的机会成本恒为10吨小麦）\n\
    \  - 如果一种物品的机会成本随着生产数量的增多而上升，那生产可能性边界为曲线\n\n## 为什么生产可能性边界可能是曲线\n\n当经济把资源从啤酒行业向山地自行车行业转移时：\n\
    \n- 生产可能性边界变得更加陡峭\n- 山地自行车的机会成本也不断上升\n\n![](img/518b44ff56ad05e168220626515b534d_108_0.png)\n\
    \n在点B，大部分工人都在生产自行车，留在啤酒行业的工人是最好的酿酒师。生产更多的自行车需要将最好的酿酒师从啤酒行业转移出来，这会使啤酒产量大幅度降低。\n\
    \n在点B，山地自行车的机会成本很高。\n\n![](img/518b44ff56ad05e168220626515b534d_110_0.png)\n\n\
    - 因此，当不同的工人有不同的技能，多生产1单位物品的机会成本也不同，这使生产可能性边界为曲线\n- 当经济中存在一些其他资源，或者机会成本不同的资源混合时，生产可能性边界也可能是曲线（例如，不同类型的土地有不同的用处）\n\
    \n## 生产可能性边界：一个总结\n\n- 生产可能性边界表示在可得到的生产要素与生产技术既定时，一个经济所能生产的两种产品数量的各种组合\n- 生产可能性边界阐释了权衡取舍与机会成本，效率与无效率，失业和经济增长等的思想\n\
    - 曲线状的生产可能性边界意味着递增的机会成本\n\n## 生产可能性边界\n\n电脑产量\n\n小麦产量\n\n- 效率\n- 权衡取舍\n- 机会成本\n\
    - 经济增长\n\n生产可能性边界\n\n3,000、2,200、2,000、1,000、0、300、600、700、1,000\n\nD、C、A、B\n\n\
    ![](img/518b44ff56ad05e168220626515b534d_113_0.png)\n\n## 作为政策顾问的经济学家\n\n- 作为科学家，经济学家试图做出关于世界是什么样子的实证表述\n\
    - 作为政策顾问，经济学家试图做出关于世界应该是什么样子的规范表述\n- 实证表述能被证实或证伪，但规范表述则不能\n- 政府雇佣许多经济学家来提供政策建议。比如美国总统有一个经济顾问委员会，本书的作者即是2003-2005经济顾问委员会的主席\n"
