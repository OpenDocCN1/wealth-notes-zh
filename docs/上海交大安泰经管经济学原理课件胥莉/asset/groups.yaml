    \n## 为什么长期供给曲线向右上方倾斜\n\n- 长期市场供给曲线是水平的，如果：\n  1. 所有企业都有完全相同的成本\n  2. 一些企业进入或退出市场并不改变其他企业的成本\n\
    - 如果任意一个假设不成立，那么长期供给曲线会向右上方倾斜\n\n## 1) 有不同成本的企业\n\n- 如果价格上升，具有低成本的企业将在高成本企业之前进入市场\n\
    - 价格进一步上升会促使高成本企业也进入市场，这会增加市场供给量\n- 因此，长期市场供给曲线向右上方倾斜\n- 在任意 P,\n  - 对边际企业而言，\n\
    \    P = min ATC ， 利润 = 0.\n  - 对低成本企业， 利润> 0.\n\n## 2) 企业进入市场，成本增加\n\n- 在某些行业，一些关键投入的供给是有限的（比如，适宜耕种的土地数量是有限的）\n\
    - 新企业的进入使这种投入的需求增加，从而价格上升\n- 这会增加所有企业的成本\n- 因此，价格上升将引致市场供给量增加，长期供给曲线向右上方倾斜\n\n\
    ## 完全竞争市场简评：优缺点\n\n- 完全竞争市场的缺点：\n  - 第一，各企业的平均成本最低并不一定是社会成本最低。\n  - 第二，产品无差别，消费者的多种需求无法得到满足。\n\
    \  - 第三，生产者的规模都很小，就没有能力去实现重大的科学技术突破，不利于技术发展。\n  - 第四，在实际中完全竞争的情况是很少的，而且，竞争一般必然引起垄断。\n"
