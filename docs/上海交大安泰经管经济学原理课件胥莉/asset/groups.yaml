    参考答案\n\n## 生产率的决定因素：\n\n- **K/L**，人均物质资本\n- **H/L**，人均人力资本\n- **N/L**，人均自然资源\n\
    - **A**，技术知识\n\n## 提高生产率的政策：\n\n- 鼓励储蓄与投资，增加 **K/L**\n- 鼓励国外的投资，增加 **K/L**\n-\
    \ 提供公共教育，增加 **H/L**\n\n## 讨论\n参考答案\n\n## 生产率的决定因素：\n\n- **K/L**, 人均物质资本\n- **H/L**,\
    \ 人均人力资本\n- **N/L**, 人均自然资源\n- **A**, 技术知识\n\n## 提高生产力的政策：\n\n- 专利费或补助，增加 **A**\n\
    - 控制人口增长，增加 **K/L**\n\n## 自然资源会限制经济增长吗？\n\n- 有些人认为人口增长耗尽了地球上的不可再生资源，因此会限制生活水平的提高\n\
    - 但技术进步通常能提供办法来避免这些限制：\n  - 混合动力汽车使用更少的汽油\n  - 住房隔热程度的提高会减少保暖或降温所需的能量\n- 随着自然资源变得越来越稀缺，它的市场价格会不断上升，这给了人们节约使用和寻找替代品的激励\n\
    \n## 本章我们将探索这些问题的答案：\n\n- 美国经济中有哪些主要金融机构？它们有什么功能？\n- 储蓄有哪三种类型？\n- 储蓄与投资的区别是什么？\n\
    - 金融体系如何协调储蓄与投资？\n- 政府政策如何影响储蓄，投资和利率？\n\n## 金融体系\n\n- 金融体系由经济中帮助一个人的储蓄与另一个人的投资相匹配的机构组成。\n\
    - 它把经济的稀缺资源从储蓄者手中转移到借贷者手中。\n\n## 经济中的金融机构\n\n- 金融体系由帮助协调储蓄者与借贷者的各种金融机构所组成。\n-\
    \ 金融机构可以分为两种类型：金融市场和金融中介机构。\n\n![](img/518b44ff56ad05e168220626515b534d_1312_0.png)\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1312_1.png)\n\n## 经济中的金融机构\n\n- 金融市场：\
    \ 想储蓄的人直接向想借款的人提供资金的机构。\n- 最重要的金融市场：\n  - 股票市场\n  - 债券市场\n- 金融中介机构： 储蓄者可以通过它间接地向借款者提供资金的金融机构。\n\
    \  - 银行\n  - 共同基金\n\n## 金融市场\n\n- 债券市场\n\n— **债券**——一种债务证明书，规定了借款人向债券持有人的负债责任。\n\
    \n— 债券特点\n\n+   • **期限**：债券到期之前的时间长度。\n\n+   • **信用风险**：借款者不能支付某些利息或本金的可能性。\n\n\
    +   • **税收待遇**：税法对待债券所赚到的利息的方式。\n    - 政府债券利息免征联邦所得税。\n"
  mdcn: "\n\n## 生产函数与收益递减\n\n当经济的资本水平低时，增加的一单位资本引起产量大幅度增加\n\n当经济的资本水平高时，增加的一单位资本引起产量小幅度增加\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1286_0.png)\n\nY/L\n\nK/L\n\n每个工人的资本\n\
    \n**追赶效应：**开始时贫穷的国家倾向于比开始时富裕的国家增长更快的特征。\n\n![](img/518b44ff56ad05e168220626515b534d_1287_0.png)\n\
    \n富裕国家的增长\n\n贫穷国家的增长\n\n贫穷国家从这里开始\n\n富裕国家从这里开始\n\n## 追赶效应的例子\n\n- 从1960年到1990年，美国和韩国用于投资的GDP份额相似，因此你会预期它们有相似的增长表现\n\
    - 但韩国的经济增长率>6% 而美国只有2%\n- 解释： 追赶效应\n  1960年，韩国的K/L远小于美国，因此韩国增长更快\n\n## 来自国外的投资\n\
    \n- 政府可以通过鼓励来自国外的投资来增加资本积累和长期的经济增长。\n- 来自国外的投资采取几种形式：\n  - 外国直接投资\n    由外国实体拥有并经营的资本投资。\n\
    \  - 外国有价证券投资\n    用外国货币筹资，但由国内居民经营的投资。\n\n## 来自国外的投资\n\n- 国外资本购买本国股票，使本国人有卖股票收益，而增加固定资产投资。这就增加本国的资本存量，国外投资还能带来先进技术、管理经验，还有合理的开发项目，从而加快本国经济增长的速度。\n\
    - 世界银行和国际货币组织是促成国际资本合理流动的重要组织。\n\n## 教育\n\n- 教育对一个国家的长期经济成功至少与物质资本投资同样重要。\n  -\
    \ 在美国，每一年正规教育使人的平均收入增加10%左右。\n  - 因此，政府可以提高生活水平的一种方法是提供良好的学校，并鼓励人们利用这些学校。\n\n\
    ## 教育\n\n- 一个人受过教育的人会产生一些有关如何最好地生产物品与劳务的新思想，这些新思想进入社会知识宝库，并给他人带来**外部效益**。\n- 一些贫穷国家面临的一个问题是**人才外流**——许多受过最高教育的工人移民到富国。\n\
    \n## 健康与营养\n\n- 使人口更健康的支出是人力资本投资的一种——更健康的工作生产率更高\n- 在营养极度缺乏的国家，提高热量的摄入会增加工人的生产率：\n\
    \  - 从1962年到1995年，韩国迅猛的经济增长期间，热量的消费增加了44%\n  - 诺贝尔奖获得者罗伯特·福格尔：\n    从1790年到1980年，英国30%的经济增长是由于营养的改善\n\
    \n## 产权和政治稳定\n\n- 复习：\n  市场通常是组织经济活动的一种好方法\n  价格体制能最有效率地配置资源\n- 这需要对产权的尊重，产权指人们对自己拥有的资源行使权利的能力\n\
    \n## 产权和政治稳定\n\n- 产权是指人们对其拥有的资源行使权力的能力。\n  - 价格制度发生作用的一个重要前提是经济中广泛尊重产权。\n  - 让投资者感到他们的投资安全是必要的。\n\
    \n## 产权和政治稳定\n\n- 在许多不发达国家，司法制度不能很好地运行：\n  - 合同很难得到实施\n  - 欺诈，腐败往往没有得到应有的惩罚\n\
    \  - 在一些国家，企业为了获得许可必须贿赂政府官员\n- 政治的不稳定性(比如经常性的政变)使得产权在未来是否能得到保护很值得怀疑\n\n## 产权和政治稳定\n\
    \n- 如果人们担心他们的资产会被罪犯偷走或被腐败的政府没收，那么投资包括海外投资就会减少，经济的运行便会更缺乏效率\n  结果：低生活水平\n- 经济稳定，有效率以及健康增长需要拥有有效的法院体系，稳定的宪法和忠诚的政府官员\n\
    \n## 自由贸易\n\n- **贸易可以使每个人都变得更好**\n  - 贸易与发明新技术有相似的作用——它可以提高生产率和生活水平\n  - 实行内向型政策的国家一般都不能促进经济增长\n\
    \  - 比如20世纪的阿根廷\n  - 实行外向型政策的国家通常都取得成功\n  - 比如1960年以后的韩国，新加坡和台湾\n  - 在某些方面，贸易是一种技术。\n\
    \  - 取消了贸易限制的国家将有重大技术进步以后出现的可类经济增长。\n\n## 自由贸易\n\n- **内向型**贸易政策：避免与世界其他国家相互交易。\n\
    \n  内向型经济可以保护本国经济的发展，但是它却难以获得与别国贸易的比较优势，因为所有产品自己生产的成本要高于贸易，所以不应该通过关税保护等限制自由贸易。\n\
    \n- **外向型**贸易政策，鼓励与其他国家相互交易。\n\n## 研究与开发\n\n技术进步是长期生活水平提高的主要原因\n其中一个原因是知识是公共物品：思想可以免费分享，从而提高生产率\n\
    促进技术进步的政策：\n\n- 专利法\n- 对私人R&D部门的税收激励或直接的资助\n- 对大学基础研究的资助\n\n- 技术知识的进步带来更高的生活水平。\n\
    - 大多数技术进步来自企业和个人所进行的私人研究。\n- 政府通过补贴、减税和专利制度来鼓励新技术的开发从而可以极大地推动经济的增长。\n\n## 人口增长\n\
