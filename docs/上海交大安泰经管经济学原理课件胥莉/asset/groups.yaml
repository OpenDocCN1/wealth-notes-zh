    # 财政政策与总供给


    +   - 政府购买可能会影响总供给，例如：

    +     - 政府增加对公路的支出

    +     - 更好的公路提高了企业的生产率，增加物品与劳务供给，从而使总供给曲线向右移动

    +   - 这种对总供给的影响也许在长期中比在短期中更重要：因为政府修建新公路并使之投入使用需要一段时间'
