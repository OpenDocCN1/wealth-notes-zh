    - 作为对比，管制并没有给已经减少一定数量污染的企业继续减排的激励\n\n## 税收的例子：汽油税\n\n汽油税的目标在于消除三种负外部性：\n\n- 拥挤\n\
    \  - 你驾车越多，你对拥挤的贡献便越大\n- 车祸\n  - 一辆更大的车在车祸中造成的损害也更大\n- 污染\n  - 燃烧矿物燃料会排放出温室气体\n\
    \n## 外部性的私人解决方法\n\n私人解决方法的类型：\n\n- 道德规范和社会约束\n- 慈善行为\n- 市场的参与者与受影响的旁观者之间签订合约\n\
    \n## 科斯定理\n\n- 科斯定理——一种观点，认为如果私人各方可以无成本地就资源配置进行协商，那么，他们就可以自己解决外部性问题。\n\n## 科斯定理：一个例子\n\
    \nDick 有一条名为 Spot 的狗。\n\n负外部性：Spot 的狂吠干扰了 Dick 的邻居 Jane。\n\n社会有效率的结果：最大化 Dick\
    \ 与 Jane 的福利。\n\n——如果 Dick 对 Spot 的评价比 Jane 对平静与安宁的评价要高，那 Dick 应该养狗。\n\n科斯定理：私人市场可以自己达到有效率的结果……\n\
    \n![](img/518b44ff56ad05e168220626515b534d_514_0.png)\n\n### 例1\n\n- Dick 有养 Spot\
    \ 的权利\n- Dick 养 Spot 的利益 = $500\n- Jane 承受 Spot 狂吠的成本 = $800\n\n社会有效率的结果：Dick\
    \ 放弃养 Spot。\n\n私人结果：Jane 支付给 Dick $600，让他放弃养 Spot，Jane 和 Dick 都会更好。\n\n私人结果 =\
    \ 有效率的结果。\n\n### 例3\n\n- Jane 拥有平静与安宁的权利\n- Dick 养 Spot 的利益 = $800\n- Jane 承受\
    \ Spot 狂吠的成本 = $500\n\n社会有效率的结果：Dick 继续养 Spot。\n\n私人结果：Dick 支付给 Jane $600，并继续养狗。\n\
    \n私人结果 = 有效率的结果。\n\n无论最初的权利如何分配，私人市场最后能达到有效率的结果。\n\n## 讨论\n\n### 科斯定理的应用\n\n总的来说，1000\
    \ 个绿谷的居民觉得能在蓝湖中游泳价值 $100,000。\n\n一个附近的工厂污染了湖水，只愿意花 $50,000 购买可以减少污染的设备。\n\n- A.\
    \ 描述科斯定理的私人解决办法\n- B. 你认为在现实世界中这种解决办法不起作用的原因是什么？\n\n## 为什么私下解决方式不能总是有效\n\n- 交易成本\n\
    \  - 交易成本——各方在协商达成与遵守协议过程中所发生的成本。\n  - 有时候，交易成本很高而不可能私下达成协议，因此私下方式不能解决外部性问题。\n\
    \  - 这些成本可能最终使双方达不成对双方都有利的结果。\n- 固执\n  - 即使协议对双方都是有利的，双方也可能不会达成协议，而是等待一个对自己更好的交易。\n\
    - 协调问题\n  - 当利益各方人数众多时，协调各方变得成本高昂、困难，甚至不可能。\n\n## 以市场为基础的政策\n\n- **可交易的污染许可证**允许排污权在企业之间自愿进行转移。\n\
    \  - 交易这种许可证的市场将最终形成。\n  - 以低成本可以减少污染的企业愿意将污染许可证出售给只有以高成本才能减少污染的企业。\n  - 污染量没有增加，但污染许可证这一稀缺资源重新配置给对其评价更高的企业。\n\
    \n## 庇古税和排污许可证的等效性\n\n| (a) 庇古税 | (b) 污染许可证 |\n| --- | --- |\n| 污染的价格 | 污染的价格\
    \ |\n| 庇古税 | 排污许可证的供给 |\n| 对排污权的需求 | 对排污权的需求 |\n| 污染量 | 污染量 |\n| 1. 庇古税决定污染价格\
    \ | 1. 污染许可证确定了污染量…… |\n| 2. ……庇古税和需求曲线决定污染量 | 2. ……许可证和需求曲线决定污染的价格。 |\n\n## 讨论\n\
    \n### A. 降低 SO₂ 的排放量\n\n- Acme 公司与美国电气公司都用煤做燃料，每家公司每个月排放 40 吨的 SO₂，总排放量 = 80吨/每月。\n\
    - 目标：减少25%的SO₂排放，实现60吨/每月的排放目标。\n- 减少排放的成本：Acme 公司 $100/每吨，美国电气公司 $200/每吨。\n\n\
    ### 政策选项 1：管制\n\n每个企业必须减少25%的排放（10吨）。\n\n你的工作：计算每个企业的成本和使用管制政策完成目标的总成本。\n\n###\
    \ B. 可交易的污染许可证\n\n- 最初，Acme 公司与美国电气公司每个月分别排放 40 吨的 SO₂。\n- 目标：减少 SO₂ 的排放，实现 60吨/每月的排放目标。\n\
    \n### 政策选项 2：可交易的污染许可证\n\n- 发放总共60吨的污染许可证，每个企业分别发放30吨。建立可交易的污染许可证市场。\n- 每个企业既可以用光它的许可证，排放30吨；也可以排放小于30吨的SO₂，然后出售剩余的许可证；或者购买许可证，排放大于30吨的SO₂。\n\
    \n你的工作：如果 Acme 公司排放 20 吨 SO₂，然后以 $150/每吨的价格出售 10 吨的许可证给美国电气公司，计算在这种情况下完成排放目标的成本。\n\
    \n### B. 参考答案\n\n- 目标：减少排放量，实现60吨/每月的排放目标。\n- 减少排放的成本：Acme 公司 $100/每吨，美国电气公司 $200/每吨。\n\
    \n计算完成目标的成本：\n\n**Acme 公司**\n\n- 以 $150/每吨的价格出售10吨的许可证给美国电气公司，得到 $1500。\n- 使用20吨的许可证，排放20吨的SO₂。\n\
    - 花费 $2000 减少20吨的排放。\n- Acme 公司的净成本：$2000 - $1500 = **$500**。\n\n**美国电气公司**\n\n\
    - 从 Acme 公司购买10吨的排放许可证，花费 $1500。\n- 使用购买的10吨许可证和最初的30吨许可证，排放40吨的SO₂。\n- 没有花钱在减排上。\n\
    - 美国电气公司的净成本 = $1500。\n\n完成目标的总成本 = $500 + $1500 = $2000。\n\n按照可交易的许可证政策，可以以更低的总成本完成目标，并且每个企业的成本都低于管制政策下的成本。\n\
    \n## 可交易的污染许可证\n\n- 可交易的污染许可证制度能比管制以更低的成本降低污染。\n  - 减少污染成本低的企业可以出售他们的污染许可证。\n\
    \  - 减少污染成本高的企业可以购买污染许可证。\n- 结果：污染的减少主要集中在那些降低污染成本低的企业。\n\n## 现实世界中可交易的污染许可证\n\
    \n- 美国 SO₂ 污染许可证从1995年开始可以进行交易。\n- 在美国东北部，氮氧化物污染许可证从1999年开始可以进行交易。\n- 欧洲从2005年1月开始允许碳排放量的交易。\n\
    - 在2008年1月，巴拉克·奥巴马和约翰·麦凯恩各自提出一个“限制和贸易”方案来减少温室气体的排放。\n\n## 税收与可交易的污染许可证\n\n- 像大多数需求曲线一样，企业对污染的需求也是污染价格的减函数。\n\
    - 税收增加了污染的价格，因此也减少了企业对污染的需求数量。\n- 可交易的污染许可证制度限制了供给污染的权利，与税收也有同样的效果。\n- 当政策制定者不知道需求曲线的位置时，这种许可证制度能更好地达到减少污染的目标。\n\
    \n## 对关于污染的经济分析的批评\n\n- 一些政客以及许多环保主义者宣称：没有人拥有“购买”污染的权利，也不能对环境标价。\n- 然而，人们面临权衡取舍。清新的空气与清洁的水的价值必须与它们的成本进行比较。\n\
    - 以市场为基础的方法降低了保护环境的成本，因此能增加公众对于清洁环境的需求。\n\n## 第11章 公共物品和公共资源\n\n### 本章我们将探索这些问题的答案：\n\
    \n- 什么是公共物品？什么是公共资源？各举出一些例子\n- 为什么市场在提供这些物品的有效率数量上总是失败？\n- 在公共物品或公共资源上，政府怎么做才能改善市场结果？\n"
