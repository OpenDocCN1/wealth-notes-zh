    \    - 政府应该对私人经济中的变动作出反应以便稳定总需求。\n\n## 支持积极稳定政策论\n\n- 凯恩斯：“动物本能” 使家庭和企业产生悲观主义与乐观主义，从而使总需求移动和产出与就业的波动\n\
    - 其他因素也会引起波动，比如：\n  - 外国经济的繁荣与衰退\n  - 股市的高涨与低迷\n- 如果政策制定者不作为，这些波动会影响企业，工人与消费者\n\
    - 积极稳定政策的支持者认为政府应该使用政策来减少这些波动：\n  - 当GDP低于自然产量率时，使用扩张性货币或财政政策来阻止衰退\n  - 当GDP高于自然产量率时，使用紧缩性政策来防止或降低通货膨胀\n\
    \n## 白宫的凯恩斯主义者\n\n1961年：\n约翰·F·肯尼迪主张用减税来刺激总需求，他的一些经济顾问是凯恩斯主义的追随者\n\n![](img/518b44ff56ad05e168220626515b534d_1791_0.png)\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1791_1.png)\n\n2001年：\n乔治·W·布什主张用减税来帮助正面临进入衰退的美国经济复苏\n\
    \n## 反对积极稳定政策论\n\n- 一些经济学家认为，货币和财政政策反而使经济更加不稳定。\n- 货币与财政政策对经济的影响有相对长的时滞。\n- 由于这些时滞，积极稳定政策论的反对者认为政策可能是在使经济不稳定，而不是稳定经济：\n\
    \  - 当这些政策引起总需求变动时，经济状况可能已经发生改变\n- 他们建议让经济靠自己的力量去克服短期波动。\n- 这些反对者认为政策决策者应该关注长期目标，比如经济增长与低通货膨胀\n\
    \n## 自动稳定器\n\n- 自动稳定器：\n  当经济进入衰退时，决策者不必采取任何有意的行为就可以刺激总需求的财政政策变动\n\n需要很长的时间\n\n\
    ## 自动稳定器：例子\n\n- 税制：\n  - 当经济进入衰退时，政府所征收的税收量会自动减少，刺激总需求\n- 政府支出：\n  - 当经济进入衰退时，更多人申请社会补助（福利补助、失业保险补助）\n\
    \  - 政府在这些项目上的支出自动增长，也会刺激总需求\n\n## 第35章 通货膨胀与失业之间的短期权衡取舍\n\n## 本章我们将探索这些问题的答案：\n\
    \n- 短期内通货膨胀与失业有什么关系？长期内呢？\n- 什么因素会改变通货膨胀与失业之间的这种关系？\n- 减少通货膨胀的短期成本是什么？\n- 为什么在20世纪90年代美国的通货膨胀与失业率都很低？\n\
    \n## 介绍\n\n物价水平上涨不影响产出\n\n- 在长期中，通货膨胀与失业是不相关的：\n  - 通货膨胀率主要取决于货币供给的增长率\n  - 自然失业率取决于最低工资法，工会的市场势力，效率工资以及寻找工作的有效性\n\
    - 经济学十大原理之一：社会面临通货膨胀和失业之间的短期权衡取舍\n\n### 失业和通货膨胀的关系\n\n凯恩斯学派认为，失业与通货膨胀之间存在着替代关系，菲利普斯曲线向右下方倾斜，因为货币供给增加，利率下降，企业的边际成本下降，企业家扩大生产规模，就业增加，所以政府可以以增加货币供给的方式降低失业率。\n\
    \n货币主义者认为，公众只有在短期中存在“货币幻觉”，长期中，他们会意识到自己的实际收入随物价的上涨而下跌，所以要求增加工资，企业家就会缩小生产规模，实际失业还要回到“自然失业率”水平上，菲利普斯曲线在**短期**中是条**斜线**，而在**长期**中则是条**垂线**，货币供给增加只会造成物价的上涨。\n\
    \n失业率 = 自然失业率 − a（实际通胀率 − 预期通胀率）\n\n弗里德曼认为无论通胀如何，失业率都要回到自然率水平上，这被称为自然率假说。也就是说，在长期中，失业和通胀之间没有替代关系。\n\
    \n## 菲利普斯曲线\n\n- 菲利普斯曲线：一条表示通货膨胀与失业之间短期权衡取舍的曲线\n- 1958年，菲利普斯（A.W. Phillips）说明英国名义工资增长率与失业率之间的负相关关系\n\
    - 1960年，保罗·萨缪尔森（Paul Samuelson）与罗伯特·索洛（Robert Solow）发现美国通货膨胀与失业之间也存在这种负相关关系，他们把它称为“菲利普斯曲线”\n\
    \n## 菲利普斯曲线的推导\n\n- 假设今年 $P = 100$\n- 下面的图形表示明年可能出现的两种结果：\n  - **A.** 总需求低，物价水平上升缓慢（低通货膨胀），低产出，高失业\n\
    \  - **B.** 总需求高，物价水平上升快（高通货膨胀），高产出，低失业\n\n## 菲利普斯曲线：一个政策菜单？\n\n- 由于财政政策与货币政策都能影响总需求，菲利普斯曲线给政策制定者提供了一个可以选择各种经济结果的菜单：\n\
    \  - 低失业与高通货膨胀\n  - 低通货膨胀与高失业\n  - 两者之间的任何情况\n\n美国：调高利率\n\n- 20世纪60年代，美国的数据支持菲利普斯曲线。许多人认为菲利普斯曲线是稳定可信的\n\
    \n## 菲利普斯曲线的证据？\n\n通货膨胀率（年百分比）\n\n![](img/518b44ff56ad05e168220626515b534d_1806_0.png)\n\
    \n在20世纪60年代，美国政策制定者选择以提高通货膨胀率为代价来降低失业率\n\n失业率（百分比）\n\n## 垂直的长期菲利普斯曲线\n\n- 1968年，米尔顿·弗里德曼和爱德蒙·费尔普斯指出通货膨胀与失业之间的权衡取舍是暂时的\n\
    - **自然率假说：** 认为无论通货膨胀率如何，失业最终要回到其正常率或自然率的观点\n- 这是基于古典二分法和垂直的长期总供给曲线\n\n在长期中，货币增长越快只会导致通货膨胀率越高\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1808_0.png)\n\n## 使理论与证据一致\n\n- 来自20世纪60年代的证据：\n\
    \  菲利普斯曲线向右下方倾斜\n- 理论（弗里德曼与费尔普斯）：\n  长期菲利普斯曲线是垂直的\n- 为使理论与证据相一致，弗里德曼与费尔普斯引入了一个新的变量：预期通货膨胀——衡量人们预期物价总水平的变动幅度\n\
    \n## 菲利普斯曲线方程\n\n失业率 = 自然失业率 − a（实际通货膨胀 − 预期通货膨胀）\n\n### 在短期中\n\n美联储可以使失业率降到自然失业率以下，而使实际通货膨胀高于预期通货膨胀\n\
    \n### 在长期中\n\n实际通货膨胀和预期通货膨胀越来越接近\n\n预期通货膨胀与现实相符，失业率回到自然失业率，无论通货膨胀是高还是低\n\n## 预期通货膨胀如何移动菲利普斯曲线\n\
    \n最初，预期通货膨胀与实际通货膨胀都等于3%，失业率 = 自然率（6%）\n\n联储使实际通货膨胀比预期通货膨胀高出2%，失业率降到4%\n\n在长期中，预期通货膨胀会上升到5%，菲利普斯曲线向右上方移动，失业率回到自然失业率水平\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1811_0.png)\n\n## 图：预期的通货膨胀如何使短期菲利普斯曲线移动\n\
    \n1. 扩张性政策使经济沿着短期菲利普斯曲线向上移动……\n2. ……但在长期中，预期的通货膨胀上升，而且短期菲利普斯曲线向右移动。\n\n![](img/518b44ff56ad05e168220626515b534d_1812_0.png)\n\
    \n长期菲利普斯曲线  \n高预期通货膨胀时的短期菲利普斯曲线  \n低预期通货膨胀时的短期菲利普斯曲线  \n通货膨胀率  \n自然失业率  \n失业率\
    \  \nA  \nB  \nC\n\n## 讨论\n\n一个数值例子\n\n自然失业率 = 5%，预期通货膨胀率 = 2%，在菲利普斯曲线方程中的 *a*\
    \ = 0.5\n\n- A. 画出长期菲利普斯曲线\n- B. 找出实际通货膨胀为 0%、6% 时的失业率，并画出短期菲利普斯曲线\n- C. 如果预期通货膨胀率上升至\
    \ 4%，重复 B 过程\n- D. 如果自然失业率下降到 4%，画出新的长期菲利普斯曲线，再重复 B 过程\n"
