  md: "\n## 金融市场\n\n- 股票市场\n  - 股票 代表企业的所有权，所以也代表对所获得利润的索取权。\n  - 出售股票来筹资称为股本筹资。\n\
    \    - 与债券相比，股票的风险高，潜在收益也高。\n  - 美国经济中最重要的股票交易所是纽约股票交易所、美国股票交易所和纳斯达克（NASDAQ）。\n\
    \n## 金融中介机构·银行\n\n- **银行**\n  - 从想储蓄的人那里得到存款，并用这些存款向想借款的人进行贷款。\n  - 向存款人的存款支付利息，并向借款人的贷款收取略高一点的利息。\n\
    \  - 银行通过允许人们根据自己的存款签发支票，帮助创造出一种**交换媒介**。\n    - 交换媒介是人们能容易地用来进行交易的东西。\n  - 这方便了物品与劳务的购买。\n\
    \n## 金融中介机构：共同基金\n\n- 共同基金 是一个向公众出售股份，并用收入购买各种股票、债券，或股票与债券都有的选择，或资产组合的机构。\n  -\
    \ 它们可以使钱并不多的人进行多元化投资。\n\n- 其他\n  - 信用社\n  - 养老基金\n  - 保险公司\n  - 地方高利贷者\n\n## 国民收入帐户中的储蓄与投资\n\
    \nGDP既是一个经济的总收入，又是用于经济的物品与劳务产量的总支出。\n\nY = C + I + G + NX\n\n## 一些重要的恒等式\n\n-\
    \ 假设一个封闭经济——不与其他经济交易的经济。\n- $Y = C + I + G$，现在，从上面等式两边减去C和G，得出：\n- $Y - C - G\
    \ = I$\n\n- 这个等式的左边是在用于消费和政府购买之后留下的总收入，这个量被称为国民储蓄，或简称储蓄 (S)。\n\n- 用S代替Y-C-G，上式可以写为：\n\
    - $S = I$\n\n储蓄 = 封闭经济中的投资\n\n## 一些重要的恒等式\n\n- 国民储蓄或储蓄等于：\n\nS = I\n\nS = Y −\
    \ C − G\n\nS = (Y − T − C) + (T − G)\n=私人储蓄 + 公共储蓄\n\n## 储蓄与投资的含义\n\n- **国民储蓄**\n\
    \  - **国民储蓄**——一个经济在用于消费和政府购买后剩下的总收入。\n\n- **私人储蓄**\n  - **私人储蓄**——家庭在支付了税收和消费之后剩余的收入量。\n\
    \  - **私人储蓄 = (Y - T - C)**\n\n- **公共储蓄**\n  - **公共储蓄**——政府在支付其支出后剩余的税收收入量。\n\
    \  - **公共储蓄 = (T - G)**\n\n## 储蓄与投资的含义\n\n$S=I$\n\n也可以是 $S=Y-C-G$\n\n或者 $S=(Y-T-C)+(T-G)$\n\
    \n- 储蓄因此等于私人储蓄与公共储蓄之和。政府税收大于支出为盈余，反之则为赤字。\n- 该等式表明通过金融市场可以在整体上实现社会的储蓄等于投资。\n\n\
    ## 储蓄与投资的含义\n\n储蓄等于投资的机制：个人存款银行或买股票的储蓄未必等于另一个人购买厂房设备的投资，但是，投资者可以通过金融机构借到不足的资金，这就能在总量上实现投资等于储蓄。\n\
    \n## 储蓄与投资的含义\n\n- 对整个经济而言，储蓄必定等于投资。$S=I$\n- 预算盈余与预算赤字\n  - 如果$T>G$，政府由于得到的资金大于支出，政府有预算盈余。\n\
    \  - 这种$T-G$的盈余代表公共储蓄。\n  - 如果$G>T$，政府支出大于其税收收入，政府有预算赤字。\n\n## 讨论\n\n参考答案：A\n\n\
    已知：\nY = 10.0, C = 6.5, G = 2.0, G − T = 0.3\n\n公共储蓄 = T − G = −0.3\n\n税收：T =\
