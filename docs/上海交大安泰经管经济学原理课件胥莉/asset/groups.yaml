  - '[PAGE 1524]


    # 费雪效应


    +   - 费雪效应——名义利率对通货膨胀率一对一的调整。

    +   - 根据费雪效应, 当通货膨胀率上升时，名义利率上升同样的量。

    +   - 实际利率保持不变。


    名义利率=实际利率 + 通货膨胀率


    +   - 真实利率由可贷资金市场上储蓄和投资共同决定

    +   - 货币供给的增长决定通货膨胀率

    +   - 因此这个等式表明名义利率是如何决定的'
  - '[PAGE 1525]


    # 费雪效应


    名义利率 = 通货膨胀率 + 真实利率


    +   在长期，货币是中性的。因此货币增长率的改变只影响通货膨胀率而不影响真实利率


    +   所以名义利率对通货膨胀率进行一对一的调整


    +   这种关系被称为费雪效应，以第一个研究这个问题的经济学家阿尔文·费雪的名字命名'
