  md: "\n## “所有的……”\n\n- 为了成为一个有效的全面衡量指标，GDP包括在**经济中生产并在市场上合法地出售的**所有东西；\n- 例如，GDP中需要对住房存量提供的住房服务进行估算；\n\
    - 政府服务通过成本来估算；\n- 一些难以估算的物品不列入GDP\n- GDP中不包括非法的活动（走私、贩毒等地下经济）\n- GDP中也不包括家庭内的生产和消费\n\
    \n## “最终……”\n\n- GDP只包括最终物品的价值，中间物品的价值已经被包括在最终物品中了，因此需要避免重复计算；\n- 当中间物品作为**存货**出现时，这个原则就出现了一个重要的例外。在这种情况下，中间物品被暂时作为“最终”物品，其价值作为存货投资而加到GDP中；\n\
    - 当以后使用或销售中间物品从而减少存货时，企业的存货投资就是负的，计算GDP时予以扣除；\n\n## “最终……”\n\n- 例：一辆新的奔驰汽车是在2019年生产的，但是到了2020年才第一次出售，那么应该计入2020年的GDP，因为当它第一次出售时才作为一种最终物品。错\n\
    - 这个是根据GDP的定义和核算原则：在哪一期生产就计入哪一期的GDP。\n- （1）这个最终物品不是销售的，是当期生产出来的。简言之，就是当年生产的产品数量，不是卖出去的产品数量\n\
    - （2）在某t期交易过去生产的东西而形成的交易额是不能计入第t期GDP的，因为它是过去生产的；\n- （3）第t期生产出来的东西如果要到t+1期甚至以后才能卖出去，它依然以存货的名义计入该期（t期）的GDP，而不是t+1期的GDP，因为它是第t期生产的。\n\
    \n## 讨论\n\n判断：\n\n- 1、如果木材林地把1000美元木材出售给木匠，木匠用这些木材盖了一座以5000美元出售的房子，则对GDP的贡献是6000美元。\n\
    \n选择题：\n\n- 2. 以下哪一项的销售不包括在1989年GDP中（ ）\n- a. 1989年在田纳西州生产的本田车。\n- b. 理发。\n- c.\
    \ 房地产经纪人的服务。\n- d. 在1988年建成而在1989年第一次售出的房子。\n\n## 讨论\n\n判断：\n\n- 1、如果木材林地把1000美元木材出售给木匠，木匠用这些木材盖了一座以5000美元出售的房子，则对GDP的贡献是6000美元。**错**\n\
    \n选择题：\n\n- 2、以下哪一项的销售不包括在1989年GDP中（**d**）\n- a. 1989年在田纳西州生产的本田车。\n- b. 理发。\n\
    - c. 房地产经纪人的服务。\n- d. 在1988年建成而在1989年第一次售出的房子。\n\n## “物品与劳务……”\n\n- GDP中既包括有形的物品（如食物、衣服、汽车），也包括无形的劳务（理发、清扫房屋、看病）。\n\
    - 例如，当你花了5元购买了李宇春的最新数字专辑时，是一种物品；当你花了500元去听同一专辑的演唱会时，你实际上是购买一种劳务。这时的票价也是GDP的一部分。\n\
    \n## “生产的……”\n\n- GDP包括现期生产的物品和劳务，但并不包括涉及过去生产的东西的交易；\n- 前面说的“总收入=总产出=总支出”，是以产出量为基准的。经济中有很多次交易，但只有与产出最终产品相关的交易所联系的总收入/总支出才被列入到GDP中；\n\
    \n## 国内生产总值 (GDP)：\n\n在某一既定时期**一个国家**内生产的所有\n最终物品和劳务的市场价值\n\nGDP 衡量的生产价值局限于一个国家的地理范围之内，\n\
    不管是由本国的国民还是住在本国的外国人生产\n\n## 国内生产总值 (GDP):\n\n在某一既定时期一个国家内生产的所有\n最终物品和劳务的市场价值\n\
    \n通常是一年或一个季度（3个月）\n\n## 练习\n\n- 假设一个非常简单的经济体只生产下列产品和服务：眼科检查、比萨、书本和纸张，情况1，假定经济体中所有纸张都是用来生产书本的；情况2，消费者购买纸张用于打印机使用。根据表的数据分别计算情况1和情况2的GDP\n\
    \n| 产出 | 数量 | 单位价格（元） |\n|---|---:|---:|\n| 眼科检查 | 100 | 50 |\n| 比萨 | 80 | 10\
    \ |\n| 书本 | 20 | 100 |\n| 纸张 | 2000 | 0.1 |\n\n## GDP的组成部分\n\n- GDP包括一个经济体生产并在市场上合法销售的所有物品与劳务。\n\
    - 什么未计算在GDP之内？\n  - GDP不包括在家里生产和消费而没有进入市场的大多数商品和服务。\n  - GDP不包括非法生产和销售的项目，如毒品。\n\
    - 计算方法：支出法、收入法和部门法。是最终产品的加总，也可以是中间产品增值部分的加总。\n\n## 其他收入衡量指标\n\n- **国民收入总值（GNP）**：一国永久居民（称为国民）所赚到的总收入。\n\
    - **国民生产净值（NNP）**：一国居民的总收入减去折旧的消耗。**折旧**是经济中设备和建筑物存量的磨损或损耗。\n- **国民收入**：一国居民在物品与劳务生产中赚到的总收入。\n\
    - **个人收入**：居民户和非公司企业得到的收入。\n- **个人可支配收入**：是家庭和非公司企业在完成他们对政府的义务之后剩下的收入，等于个人收入减去个人所得税和某些非税收支付（例如，交通罚单）。\n\
    \n## 国民生产总值的分解\n\n- 国民生产净值（NNP）=国民生产总值—折旧\n- 国民收入（NI）=国民生产净值—间接税\n  =工资、利润、利息和地租之和\n\
    - 个人收入（PI）=国民收入—公司未分配利润—企业所得税+政府给居民户的转移支付+政府向居民支付利息\n- 个人可支配收入（DPI）=个人收入—个人所得税=消费（C）+储蓄（S）\n\
    \n## 各个指标的区别\n\n- **GNP** 与 **GDP** 不同之处在于包括本国公民在国外赚到的收入，而不包括外国人在本国赚到的收入。\n- **国民收入**\
    \ 与 **国民产值** 的不同之处在于不包括间接的企业税（例如销售税），而包括企业补贴。\n- **个人收入** 与 **国民收入** 不同，个人收入不包括留存收益（未分配利润），留存收益是公司赚到但没有支付给其所有者的收入。\n\
    - 另外，个人收入包括家庭从其持有政府债券中得到的利息收入，以及从政府得到的转移支付（例如福利和社会保障收入）。\n\n## 各个指标的区别\n\n- 国民生产总值以国民为统计对象，只要是本国人的产出，不过他在哪里生产的都要算，那么对外开放程度越高，该指标就越不准确。\n\
    - 国内生产总值以国境为统计对象，只要是在本国境内，不管是本国人，还是外国人生产的都要算。这不仅准确，而且公道，所以后者正在取代前者。\n- 一般来说，衡量国民享有的福利用GNP，衡量经济的增长用GDP。\n\
    \n## GDP的组成部分\n\nGDP（Y）是以下项目之和：\n\n- 消费（C）\n- 投资（I）\n- 政府购买（G）\n- 净出口（NX）\n\n\
    Y = C + I + G + NX\n\n## 消费 (C)\n\n- 家庭除购买新住房之外用于物品和劳务的总支出\n- 关于居住成本的注释：\n  -\
    \ 对租房者而言，消费包括租金\n  - 对房主而言，消费包括住房的隐含租金价值，但不包括住房的购买价格或按揭贷款\n\n## 投资（I）\n\n- 投资是对用于未来生产更多物品和劳务的物品的购买\n\
    - 包括下列支出：\n  - 资本设备（比如机器，工具）\n  - 建筑物(工厂，办公楼，住宅)\n  - 存货（已经生产出来但尚未售出的物品）\n\n注意：“投资”并不是指购买股票或债券这类金融资产\n\
    \n## 政府购买（G）\n\n- 是地方、州、和联邦政府用于物品与劳务的支出。\n- 政府购买不包括转移支付，比如社会保障补助或失业保险补助\n- 因为它们不是物品与劳务的购买\n\
    \n## 净出口（NX）\n\n- NX = 出口 - 进口\n- 出口代表外国对国内生产物品与劳务的支出\n- 进口是消费，投资和政府购买中对外国生产的产品和劳务的支出\n\
    - 把所有组成部分加总起来得到：\n\nY = C + I + G + NX\n\n## GDP和其组成部分\n\n| 项目 | 总量（10亿美元）（2015）\
    \ | 总量（10亿美元）（1998） | 人均量（美元）（2015） | 人均量（美元）（1998） | 占百分比（%）（2015） | 占百分比（%）（1998）\
    \ |\n|---|---:|---:|---:|---:|---:|---:|\n| 国内生产总值，Y | 17938 | 10082 | 55882 |\
    \ 35375 | 100 | 100 |\n| 消费，C | 12268 | 6987 | 38218 | 24516 | 68 | 69 |\n| 投资，I\
    \ | 3018 | 1586 | 9402 | 5565 | 17 | 16 |\n| 政府购买，G | 3184 | 1858 | 9119 | 6519\
    \ | 18 | 18 |\n| 净出口，NX | -532 | -349 | -1657 | -1225 | -3 | -3 |\n\n资料来源：U.S.\
    \ Department of Commerce\n"
