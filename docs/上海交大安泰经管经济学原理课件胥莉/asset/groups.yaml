    # 为什么长期供给曲线向右上方倾斜


    +   - 长期市场供给曲线是水平的，如果：

    +     1. 所有企业都有完全相同的成本

    +     2. 一些企业进入或退出市场并不改变其他企业的成本


    +   - 如果任意一个假设不成立，那么长期供给曲线会向右上方倾斜'
  - '[PAGE 813]


    # 1) 有不同成本的企业


    +   - 如果价格上升，具有低成本的企业将在高成本企业之前进入市场

    +   - 价格进一步上升会促使高成本企业也进入市场，这会增加市场供给量

    +   - 因此，长期市场供给曲线向右上方倾斜

    +   - 在任意 P,

    +     - 对边际企业而言，

