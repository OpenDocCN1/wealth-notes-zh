    \n均衡的\n物价水平\n\nA\n\nB\n\nMD₁\n\n¾\n\n½\n\n¼\n\n2\n\n4\n\n$1000\n\n$2000\n\n货币量\n\
    \n## 调整过程简述\n\n从图中可以看出：货币供给增加使物价水平上升\n这是为什么？简单的考虑：\n\n- 在最初的物价水平，货币供给增加导致超额的货币供给\n\
    - 人们用这些超额货币购买物品与劳务，或者向其他人发放贷款，这些贷款又使其他人可以购买物品与劳务\n- 结果：物品的需求增加\n- 但物品的供给并没有增加，因此物价上涨\n\
    \  （在短期内会发生其他事情，这是我们在接下来章节中将要学习的内容）\n\n## 真实变量与名义变量\n\n- 名义变量：按货币单位衡量的变量\n  例如：名义\
    \ GDP\n  名义利率（用美元衡量的回报率）\n  名义工资（每工作小时的美元收入）\n\n- 真实变量：按实物单位衡量的变量\n  例如：真实GDP\n\
    \  真实利率（用产出衡量）\n  真实工资（用产出衡量）\n\n## 真实变量与名义变量\n\n价格常用货币来衡量\n\n- 一张CD的价格： $15\n\
    - 一个意大利辣味香肠披萨的价格： $10\n\n相对价格是一种物品与另一种物品相比的价格\n\nCD相对于披萨的价格：\nCD的价格 / 披萨的价格 =\
    \ $15 / $10 = 1.5 个披萨/每张CD\n\n相对价格用实物单位衡量，是真实变量\n\n## 真实工资与名义工资\n\n一个重要的相对价格是真实工资：\n\
    \nW = 名义工资 = 劳动力价格，如$15/每小时\n\nP = 物价水平 = 物品与劳务的价格，如，$5/每单位产出真实工资是劳动力相对于产出的价格：\n\
    \nW/P = $15/每小时 / $5/每单位产出 = 3 单位产出/每小时\n\n## 古典二分法\n\n- **古典二分法：** 名义变量和真实变量的理论区分\n\
    - 休谟和古典经济学家认为货币制度发展影响名义变量，但不影响真实变量\n- 如果中央银行使货币供给翻一番，休谟和古典经济学家会认为：\n  - 所有名义变量（包括价格）会翻一番\n\
    \  - 所有真实变量（包括相对价格）保持不变\n\n## 货币中性\n\n- **货币中性**：认为货币供给变动并不影响真实变量的观点\n\n- 货币供给翻一番使所有名义价格都翻一番；那相对价格呢？\n\
    \n- 最开始，CD相对于披萨的价格：\n  \n  $$\\frac{\\text{CD的价格}}{\\text{披萨的价格}}=\\frac{\\$15}{\\\
    $10}=1.5\\text{披萨/每张CD}$$\n\n相对价格不变\n\n- 名义价格翻一番之后：\n  \n  $$\\frac{\\text{CD的价格}}{\\\
    text{披萨的价格}}=\\frac{\\$30}{\\$20}=1.5\\text{披萨/每张CD}$$\n\n## 货币中性\n\n- **货币中性：**\
    \ 认为货币供给变动并不影响真实变量的观点\n- 类似，真实工资 *W/P* 没有变化，因此：\n  - 劳动供给量不变\n  - 劳动需求量不变\n  -\
    \ 劳动的就业数量不变\n- 资本以及其他资源的使用也是同样道理\n- 因为所有资源的使用都不发生变化，那总产出就不会受货币供给变动的影响\n\n## 货币中性\n\
    \n- 大多数经济学家认为古典二分法和货币中性描述了长期中的经济\n- 在接下来的章节，我们将学习货币变动对真实变量有重要的短期影响\n\n## 货币流通速度与货币数量论方程式\n\
    \n- 货币流通速度——在经济中普通一美元从钱包到钱包之间流动的速度。或者指货币在一定时期内完成交易的次数。货币易手的速度\n- 货币流通速度是货币数量方程式表现为货币量与流通速度的乘积要满足产出量的价格要求。\n\
    - V = (P x Y)/M\n  V 货币流通速度\n  M 货币数量\n  P x Y = 名义GDP= (物价水平) x (真实GDP)\n\n##\
    \ 货币流通速度与货币数量论方程式\n\n- 重新整理，得到**货币数量论方程式**\n\n$$M \\times V = P \\times Y$$\n\n\
    - 货币数量论方程式把货币数量（$M$）与产量的名义价值（$P \\times Y$）联系起来了。\n\n## 货币流通速度\n\n货币流通速度公式： V\
    \ = P × Y / M\n\n只有一种物品的例子：披萨\n\n在2008年\n\nY = 真实 GDP = 3000个披萨\n\nP = 物价水平 =\
    \ 披萨的价格 = $10\n\nP × Y = 名义 GDP = 披萨的价值 = $30,000\n\nM = 货币供给 = $10,000\n\nV =\
    \ 货币流通速度 = $30,000/$10,000 = 3\n\n每美元钞票每年平均易手三次\n\n"
