  - '[PAGE 950]


    # 租赁价格与购买价格


    +   - 购买一单位的资本或土地会产生有价值的租赁收入流

    +   - 在任一时期的租赁收入等于边际产量值 (VMP).

    +   - 因此，一种要素的均衡购买价格取决于该要素当前的边际产量值以及预期未来会有 的边际产量值'
  - '[PAGE 951]


    # 生产要素之间的联系


    +   - 在多数情况下，生产要素以某种方式组合在一起使用，这就使得每种要素的生产率都取决于生产过程中使用的其他要素的可获得量

    +   - 利润：资本数量增加

    +     - 资本的边际产量和租赁价格下降

    +     - 更多的资本使工人的生产率提高，MPL 和 W 增加'
  - '[PAGE 952]


    # 结论


    +   - 本章所提出的的理论称为新古典收入分配理论

    +   - 它表明：

    +     - 要素价格是由要素的供给与需求决定的

    +     - 每种要素赚到了它的边际产量值

    +   - 大多数经济学家用这个理论作为理解收入分配的一个起点

    +   - 接下来的两章将沿着这个主题深入'
  - '[PAGE 953]


    # 内容提要


