    \ **P** 不变。货币需求会发生什么变动？\n\n*r* 是持有货币的机会成本\n\n*r* 的上升降低了货币需求：高利率会使家庭试图购买债券\n\n\
    因此，**其他条件不变，*r* 的上升会降低货币需求**\n\n## 讨论\n参考答案\n\n- **B.** 假设 *P* 上升，但 *Y* 和 *r*\
    \ 不变。货币需求会发生什么变动？\n\n如果 **Y** 不变，人们希望购买相同数量的物品与劳务\n\n而由于 *P* 上升，人们需要更多的货币才能购买相同数量的物品与劳务\n\
    \n所以，**其他条件不变，*P* 的上升导致货币需求的增加**\n\n## 总需求曲线向右下方倾斜\n\n- 物价水平是货币需求量的一个决定因素。\n-\
    \ 较高的物价水平增加了货币需求量。\n- 较高的货币需求引起了较高的利率。\n- 较高的利率减少了物品与劳务的需求量。\n\n这种分析的最终结果是物价水平与物品和劳务需求量之间的负相关关系。\n\
    \n## 利率是如何决定的\n\nMS 曲线是垂直：\n货币供给量由美联储固定， r 的变动并不影响 MS\n\nMD 曲线向右下方倾斜：\nr 下降会使人们增加货币需求\n\
