    - 企业的经济目标是**利润最大化**。一个企业竞争生存的基本准则。\n\n## 成本是机会成本\n\n- 生产成本是指生产过程中发生的各种费用。\n- 一个企业的生产成本包括生产物品与劳务量的所有机会成本。\n\
    - 机会成本是指做这件事，而不做别的事，失去了做别的事上的最大收益，就是做这件事的机会成本。机会成本因人而异，因时而异。\n  - 显性成本和隐性成本\n\
    \    - 显性成本—要求企业直接支付货币的投入要素成本。\n    - 隐性成本—不要求企业支付货币的投入要素成本。\n\n生产成本＝机会成本＝经济成本＝隐成本+显成本\n\
    \n## 显性成本与隐性成本：一个例子\n\n你需要 $100,000 开始你的业务。利率为 5%。\n\n- 情形 1：借 $100,000\n  - 显性成本\
    \ = $5000 借款利息\n\n- 情形 2：使用 $40,000 储蓄，并借 $60,000\n  - 显性成本 = $3000（5%）借款利息\n\
    \  - 隐性成本 = $2000（5%）损失了你原本可以获得的 $40,000 的利息\n\n**在两种情形中，总成本（显性 + 隐性）都是 $5000**\n\
    \n## 经济利润与会计利润\n\n- 经济学家计量企业的经济利润，即企业的总收益减去生产所销售物品和劳务的所有机会成本（显性的和隐性的）。\n- 会计师计量企业的会计利润，即企业的总收益减去企业的显性成本。\n\
    - 当总收益大于显性成本和隐性成本时，企业赚取经济利润。经济利润小于会计利润。\n\n## 经济利润与会计利润\n\n## 经济学家如何看企业\n\n##\
    \ 会计师如何看企业\n\n收入\n\n经济利润\n\n隐性成本\n\n显性成本\n\n所有机会成本\n\n会计利润\n\n显性成本\n\n收入\n\n##\
    \ 讨论\n经济利润与会计利润\n\n办公室的均衡租金上涨了 $500/月\n在以下情形下，比较对会计利润与经济利润的影响：\n\n- a. 你租用办公室\n\
    - b. 你自己拥有办公室\n\n## 讨论\n参考答案\n\n办公室的均衡租金上涨了 $500/月\n\n- a. 你租用办公室\n  \n  显性成本增加了\
    \ $500/月。会计利润与经济利润都减少了 $500/月\n\n- b. 你自己拥有办公室\n  \n  显性成本没有变化，因此会计利润也不会变。隐性成本增加了\
    \ $500/月（使用你办公室的机会成本是租用它的价格），因此经济利润减少了 $500/月\n\n## 生产理论研究的问题\n\n生产理论要解决的基本问题是将投入产出的关系转换成函数关系，研究如何组合劳动、资本等生产要素，最有效地把既定产量生产出来，并随着时间的推移，最有效地实现产量的增长。也就是要确定**短期中的生产最优区域**，长期中的生产扩展路线。\n\
    \n## 生产理论\n\n![](img/518b44ff56ad05e168220626515b534d_681_0.png)\n\n两种投入要素—一种产品的生产函数\n\
    \n## 生产函数\n\n表格中数字表明，资本和劳动力的组合可以形成相应的产出，但并非产出与投入要素成同方向同比例变化，只有在某一点上要素组合才是最优。\n\
    \n要素组合既注意技术上可行，更要考虑经济上有效率，经济效率要求成本最低，也就是要将两个投入的价格充分考虑进去；同时，这些产出的组合都假定技术不变，如果技术发生变化，产出结果也都不同了。\n\
    \n## 生产函数\n\n- 产量Q与生产要素L、K、N、E等投入存在着一定依存关系。\n- Q = f（L、K、N、E）--- 生产函数其中N是固定的，E难以估算，所以简化为：\n\
    \  Q = f（L、K）\n\n- 研究生产函数一般都以特定时期和既定生产技术水平作为前提条件；\n- 这些因素发生变动，形成新的生产函数。\n- 生产函数表示在一定时期内，在技术水平不变的情况下，生产中所使用的各种生产要素的数量与所能生产的最大产量之间的关系，即生产中投入量与产出量的关系。\n\
    \n## 柯布-道格拉斯生产函数\n\n（C—D生产函数），由美国数学家柯布和经济学家道格拉斯于1928年根据历史统计资料提出的。\n\n$Q=AL^\\\
    alpha K^\\beta$\n\n$Q=AL^\\alpha K^{1-\\alpha}$\n\n- A为规模参数，A>0\n- a表示劳动贡献在总产中所占份额\n\
    - $0<a<1$\n- 1-a表示资本贡献在总产中所占份额\n\n美国20世纪初期的经验数值\n\n$Q=L^{3/4}K^{1/4}=1.014L^{3/4}K$\n\
    \n- 资本不变，劳动单独增加1%，产量将增加1%的3/4，即0.75%；\n- 劳动不变，资本增加1%，产量将增加1%的1/4，即0.25%；\n- 劳动和资本对总量的贡献比例为3:1。\n\
    \n## 一种可变生产要素的生产函数\n\n- 经济学中的短期与长期\n  - 短期：生产者来不及调整全部生产要素的数量，至少有一种生产要素的数量固定不变的时间周期。\n\
    \  - 长期：生产者可以调整全部生产要素的数量的时间周期。\n\n**注意：** 本篇中考察的一种生产要素可变的生产函数，是在分析短期生产理论。\n\n\
    ## 生产函数\n\n- **生产函数：** 用于生产一种物品的投入量与该物品产量之间的关系\n- 它能用表格，方程式或者图形来表示\n- 例1：\n  -\
    \ 农民Jack 种植小麦\n  - 他有5英亩的土地\n  - 他可以雇佣任意数量的工人\n\n## 边际产量\n\n- 如果Jack多雇佣一个工人，他产出增加量为劳动的边际产量\n\
    - 投入的边际产量：在其他投入量不变情况下，增加一单位投入所引起的产量增加\n- 符号：\n  $\\Delta$ (delta) = “变动...”\n\
    \  \n  例：\n  \n  $\\Delta Q$ = 产出的变动量，$\\Delta L$ = 劳动的变动量\n- 劳动的边际产量(MPL) = $\\\
    frac{\\Delta Q}{\\Delta L}$\n"
