    # 总产量、平均产量与边际产量


    考察的一种生产要素可变的生产函数，是在分析短期生产函数。


    总产量曲线、平均产量曲线和边际产量曲线都是先呈上升趋势，而后达到各自的最大值以后，在呈下降趋势。


