    # 贸易协定


    +   - 一个国家可以用两种方法来实现自由贸易：

    +     - 用单边的方法减少自己的贸易限制

    +     - 与其他国家签署贸易多边协定来减少贸易限制

    +   - 贸易协定的例子：

    +     - 北美自由贸易协定 (NAFTA), 1993

    +     - 关贸总协定 (GATT)

    +   - 世界贸易组织 (WTO), 1995：执行贸易协定，解决争端'
