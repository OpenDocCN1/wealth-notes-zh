  - '[PAGE 839]


    # 完全垄断厂商的需求曲线与收益曲线


    +   - 例：设反需求函数为 $P=a-bQ$，则总收益函数为 $TR=P\cdot Q=aQ-bQ^2$，边际收益函数为 $MR=dTR/dQ=a-2bQ$


    +   - $dP/dQ=-b$　$dMR/dQ=-2b$


    +   - 当垄断厂商的需求曲线是直线时，需求曲线和边际收益曲线的纵轴截距相等，边际收益曲线的横轴截距时需求曲线横轴截距的一半。'
  - '[PAGE 840]


    # 总收益、边际收益、价格与需求弹性的关系


    $$MR=\frac{dTR}{dQ}=\frac{d(P\cdot Q)}{dQ}=P+Q\cdot\frac{dP}{dQ}=P\left(1+\frac{dP}{dQ}\cdot\frac{Q}{P}\right)=P\left(1-\frac{1}{|e_d|}\right)$$


    $$\frac{dTR}{dP}=\frac{d(P\cdot Q)}{dP}=Q+P\cdot\frac{dQ}{dP}=Q\left(1+\frac{dQ}{dP}\cdot\frac{P}{Q}\right)=Q\left(1-\frac{1}{|e_d|}\right)$$'
  - '[PAGE 841]


    # # 总收益、边际收益、价格与需求弹性的关系


    +   - 当 \(|e_d|>1\)时，边际收益>0，总收益与价格反向变动；此时，TR斜率为正，表示厂商总收益随销售量的增加而增加。

    +   - 当 \(|e_d|=1\)时，边际收益=0，总收益与价格变动无关；此时，TR斜率为零，表示厂商总收益达到极大值点。

    +   - 当 \(|e_d|<1\)时，边际收益<0，总收益与价格同向变动。此时，TR斜率为负，表示厂商总收益随销售量的增加而减少。'
