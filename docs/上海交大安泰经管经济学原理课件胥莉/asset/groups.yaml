    # 边际效用递减规律


    边际效用递减：随着对某商品消费量的增加，人们从该商品连续增加的每个消费单位中得到的满足程度逐渐下降。


    +   - 生理原因：兴奋度递减。

    +   - 心理原因：人性。

    +   - 物品本身用途的多样性。


    | 消费量Q | 边际效用MU |

    | --- | --- |

    | 0 | 0 |

    | 1 | 30 |

    | 2 | 20 |

    | 3 | 10 |

    | 4 | 0 |

    | 5 | -10 |


    ![](img/518b44ff56ad05e168220626515b534d_1026_0.png)'
  - '[PAGE 1027]


    # 货币的边际效用


    +   - 货币如同商品一样，也具有效用。

    +   - 边际效用递减规律对货币也适用。

    +   - 随着货币的不断增加，货币边际效用递减。

    +   - 消费者用货币购买商品，就是用货币的效用去交换商品的效用。

    +   - 在分析消费者行为时，通常假定货币的边际效用不变。

    +   - 因为：一般情况下，单位商品的价格只占消费者总货币收入量中的很小部分，支出的货币的边际效用的变化非常小，可以略去不计。


    > “富人的钱不值钱，穷人的时间不值钱”。'
  - '[PAGE 1028]


    # 基数效用论消费者均衡的条件


    # 消费者均衡的假设前提


    +   - 消费者的偏好（嗜好）既定

    +   - 消费者的收入既定

    +   - 商品的价格既定


    # 消费者均衡的条件：


    +   - 把全部收入用完。

    +   - 每一元钱都化在刀口上，每一元钱用在不同商品上的边际效用相等。


    效用最大化原则：


    +   - 收入既定的情况下，

    +   - 消费者应使自己花费在各种商品购买上的最后一元钱所带来的边际效用相等。

    +   - 或者，消费者应该使自己所购买的各种商品的边际效用与价格之比相等。'
  - '[PAGE 1029]


    # 简单的——两种商品均衡条件


    M：消费者的收入

    P1：1商品的价格

    P2：2商品的价格

    Q1：1商品的数量

    Q1：2商品的数量

    MU1：1商品的边际效用

    MU2：2商品的边际效用

    MUm：每元钱的边际效用


    P1·Q1 + P2·Q2 = M （把钱用完）

    MU1/P1 = MU2/P2 = MUm （货真价实）


    If: MU1/P1 < MU2/P2


    说明：对于消费者，同样的1元钱购买商品1的边际效用小于商品2的边际效用。


    +   这样：理性消费者就会调整这两种商品的购买量：

    +   减少商品1，

    +   增加商品2。


    意味着：总效用会增加。

    直到两种商品的边际效用相等时，便获得最大效用。'
