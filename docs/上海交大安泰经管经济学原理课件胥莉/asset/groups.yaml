  - '[PAGE 850]


    # 理解垄断者的边际收益


    +   - 增加产量对收益有两种影响：

    +     - 产出效应：更高的产出增加收益

    +     - 价格效应：价格下降减少收益

    +   - 为了卖出更多的数量，垄断者必须降低它出售的每一单位产品的价格

    +   - 因此，MR < P

    +   - 如果价格效应超过产出效应，MR 甚至可能为负

    +     (例如，星巴克把产量从5增加到6时)'
