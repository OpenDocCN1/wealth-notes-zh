    | 10 | 120 |

    | 15 | 110 |

    | 20 | 100 |

    | 25 | 90 |

    | 30 | 80 |

    | 35 | 70 |

    | 40 | 60 |

    | 45 | 50 |


    如果两个企业都遵守协定，每个企业都得到利润 = $900


    如果T-Mobile违反协定生产 **Q = 40**：

    市场产量 = 70，**P** = $35

    T-Mobile的利润 = 40 × ($35 − 10) = **$1000**


    违反协定时，T-Mobile 的利润更高


    V-Mobile 也会做出同样的推断，因此两个企业都会违反协定，分别生产 **Q = 40**：

    市场产量 = 80，**P** = $30

    每个企业的利润 = 40 × ($30 − 10) = **$800**'
