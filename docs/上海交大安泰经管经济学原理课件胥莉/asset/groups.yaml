    # 垄断者如何作出生产与定价策略


    +   - 完全垄断厂商的需求曲线与收益曲线

    +   - d = AR = P 厂商的需求曲线即市场的需求曲线

    +   - MR = dTR/dQ = d(P·Q)/dQ = P + Q·dP/dQ < P

    +   - 边际收益小于平均收益


