    # # 介绍


    +   - 由于自利的买者与卖者忽略了他们行为的外部成本或收益，因此市场结果没有效率

    +   - 经济学十大原理之一：

    +     **政府行为有时可以改善市场结果**

    +   - 在存在外部性的情况下，公共政策能提高效率'
  - '[PAGE 485]


    # 市场效率和市场失灵


    **回顾：** 亚当·斯密所说的市场中“看不见的手”引导着市场中自利的买者和卖者追求自己利益最大化的同时，使整个社会从市场中获得的总利益也达到最大化。


    # 但是市场也会失灵'
  - '[PAGE 486]


    # 外部性与市场无效率


    +   - 一个经济主体的行为对别的经济主体造成的影响就是外部性，它有正的和负的两种。前者增加别人的福利，后者损害别人的利益。

    +   - 一个人的行为对旁观者福利的影响，这种影响得不到补偿。

    +   - 外部性导致市场失灵，因此单靠市场力量不能使社会总剩余最大化。'
  - '[PAGE 487]


    # 外部性产生于：


    +   - 当一个人的行为影响到旁观者的福利时，若此人既不为此支付成本（给旁观者带来成本时）又不能得到补偿（给旁观者带来利益时），外部性就产生了。

    +   - 给旁观者带来不利影响的外部性称为**负外部性**

    +   - 给旁观者带来有利影响的外部性称为**正外部性**'
  - '[PAGE 488]


