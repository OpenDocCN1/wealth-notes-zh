    - **国外有价证券投资：** 国内居民购买另一个国家的股票或债券，为外国企业提供“可贷资金”\n\n资本净流出衡量一个国家资产贸易的不平衡：\n\n- 如果资本净流出\
    \ > 0，“资本流出”：本国居民购买的外国资产大于外国人购买的国内资产\n- 如果资本净流出 < 0，“资本流入”：外国人购买的国内资产大于本国居民购买的外国资产\n\
    \n### 影响资本净流出的变量\n\n- 国外资产得到的真实利率\n- 国内资产得到的真实利率\n- 持有外国资产可以觉察到的经济与政治风险\n- 影响国外对国内资产所有权的政府政策\n\
    \n### 讨论\n\n资本净流出\n\n以下哪一项**直接**增加了美国的资本净流出？\n\n- A. 通用电气公司向英国空中客车公司出售了一台飞机发动机\n\
    - B. 特斯拉在上海建了新工厂\n- C. 本田公司在俄亥俄州建了一个新工厂\n- D. 丰田公司购买AT&T的股票\n\n答案：B\n\n### 净出口与资本净流出相等\n\
    \n- 一个开放经济以两种方式与世界其他经济相互交易。哪两种方式？\n- 净出口和资本净流出分别衡量了在这两个市场上的不平衡类型：\n  - 净出口衡量（产品市场）\n\
    \  - 资本净流出衡量（金融市场）\n- 对整个经济而言，一个核算恒等式\n\n资本净流出（NCO） = 净出口（NX）\n\n– 这个等式之所以成立，是因为影响净出口的每次交易同样会完全等量地影响资本净流出（反之亦然）\n\
    \n![](img/518b44ff56ad05e168220626515b534d_1564_0.png)\n\n- 当一个中国人从美国购买 iPhone\
    \ 13 时：\n  - 美国：出口 ↑，净出口 ↑\n  - 中国人以人民币或资产支付，因此美国得到一些中国资产，使资本净流出 ↑\n- 当一个美国国民购买中国瓷器时：\n\
    \  - 美国：进口 ↑，净出口 ↓\n  - 美国购买者以美元或美国资产支付，因此中国得到美国资产，使美国资本净流出 ↓\n\n![](img/518b44ff56ad05e168220626515b534d_1565_0.png)\n\
    \n- 核算恒等式：\n  - **资本净流出（NCO）= 净出口（NX）**\n    - 这个等式之所以成立，是因为影响净出口的每次交易同样会完全等量地影响资本净流出（反之亦然）\n\
