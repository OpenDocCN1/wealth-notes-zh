    \n## 当代西方经济学：20世纪30年代-现在\n\n- 新自由主义对凯恩斯理论的批评\n  - 现代货币主义\n  - 供给学派\n  - 新古典主义宏观经济学\n\
    \  - 西方国家的实践：里根与撒切尔\n- 新凯恩斯主义宏观经济学的崛起\n- 超越新古典经济学的研究范式\n  - 行为经济学与实验经济学\n  - 复杂性科学思路\n\
    \n## 当代西方经济学：20世纪30年代-现在\n\n- 当前的西方主流经济学\n\n| 西方主流经济学框架 | 宏观经济学特点 |  |  |  | \
    \ |\n|---|---|---|---|---|---|\n| 微观经济学 | 宏观经济学 | 基础 | 出发点 | 假设 | 结论 |\n| 1.新古典传统\
    \ | 1.新古典主义 | 微观经济学 | 理性，自利 | 市场出清 | 经济是稳定的 |\n| 2. 实验经济学，行为经济学 | 2. 新凯恩斯主义 |\
    \  |  | 市场不能出清 | 经济是不稳定的 |\n\n## 亚当·斯密\n\n(1723-1790)\n英国古典政治经济学体系的建立者。经济学之父，在西方经济学界具有神一样的地\
    \ 位\n\n《国民财富的性质和原因的研究》： 人的利己性\n《道德情操论》： 人的利他性\n\n![](img/518b44ff56ad05e168220626515b534d_32_0.png)\n\
    \n## 马歇尔\n\n（1842—1924）\n\n现代微观经济学奠基人。\n\n马歇尔提出系统的微观经济理论，广泛流行于西方。\n\n![](img/518b44ff56ad05e168220626515b534d_33_0.png)\n\
    \n《经济学原理》\n\n## 约翰·梅纳德·凯恩斯\n\n![](img/518b44ff56ad05e168220626515b534d_34_0.png)\n\
    \n（1883-1946）\n\n20世纪最有影响的经济学家之一，现代宏观经济学的奠基人。\n\n“凯恩斯革命”\n\n《就业、利息和货币通论》\n\n##\
    \ 本篇主要内容\n\n- 第1章　经济学十大原理\n- 第2章　经济学家的思考方式\n- 第3章　相互依存性与贸易的好处\n\n## 本章我们将探索这些问题的答案：\n\
    \n- 经济学研究什么问题？\n- 人们如何做出决策？\n- 人们如何相互交易？\n- 整体经济如何运行？\n\n## 第1章    经济学十大原理\n\n\
    ## 经济学的含义\n\n- **经济学(Economics)**：研究社会如何管理自己的稀缺资源。\n\n## 经济学的本质（the ethic of economics）\n\
    \n- 选择（making choice）\n- 资源配置（Allocating Resources）\n\n## 经济学产生的前提：稀缺(Scarcity)\n\
    \n- 经济这个词来源于希腊语，其意为“管理一个家庭的人”。\n- 由于资源稀缺，社会资源的管理就是重要的。\n- **稀缺性**：指社会拥有的资源是有限的，因此不能生产人们希望拥有的所有物品和劳务。\n\
    \n> **稀缺**　指相对于人们无穷的欲望而言，资源是稀少短缺的\n\n## 人类需要是无限的\n\n## 马斯洛五个层次需要\n\n![](img/518b44ff56ad05e168220626515b534d_41_0.png)\n\
    \n自我实现的需要\n\n地位的需要\n\n社会的需要\n\n安全的需要\n\n生理的需要\n\n![](img/518b44ff56ad05e168220626515b534d_41_1.png)\n\
    \n## 人们如何做出决策\n\n## 原理一：人们面临权衡取舍\n\n所有决策都面临着权衡取舍。比如：\n\n- 参加期中考试前一天晚上的聚会意味着更少的时间学习\n\
    - 想要更多的收入需要工作更长时间，这就使得休息时间减少\n- 保护环境意味着生产消费物品的资源减少\n\n作决策时需要在两个目标之间权衡取舍\n\n##\
    \ 人们如何做出决策\n\n## 原理一：人们面临权衡取舍\n\n> “天下没有免费的午餐”\n\n我们为了得到一件东西就不得不放弃另一件东西。\n\n-\
    \ 食物 v. 衣服\n- 闲暇时间 v. 工作时间\n- 效率 v. 平等\n\n![](img/518b44ff56ad05e168220626515b534d_44_0.png)\n\
    \n作决策时需要在两个目标之间权衡取舍\n\n## 人们如何做出决策\n\n## 原则一：人们面临权衡取舍\n\n- 社会面临一种重要的权衡取舍：\n  **效率\
    \ vs. 平等**\n\n- **效率**：社会能从某稀缺资源中得到的最大利益\n\n- **平等**：经济成果在社会成员中平均分配\n\n- 权衡取舍：为使社会更加平等，需要在富人与穷人之间重新分配收入。但这会减少工作与生产的激励，并缩小经济“蛋糕”的规模\n\
    \n## 人们如何做出决策\n\n## 原理二：某种东西的成本是为了得到它所放弃的东西\n\n## 作出决策时需要比较可供选择的行动方案的成本与收益\n\n\
    - 上研究生还是去工作？\n- 刷抖音还是玩游戏？\n- 去上课还是睡觉？\n- 听经济学还是刷数学题？\n\n## 人们如何做出决策\n\n## 原理二：某种东西的成本是为了得到它所放弃的东西\n\
    \n## 机会成本（opportunity cost）\n\n——为了得到某种东西所必需放弃的东西。\n\n## 人们如何做出决策\n\n原理二:某种东西的成本是为了得到它所放弃的东西\n\
    \n## 上一年大学的成本是什么呢？\n\n上一年大学的机会成本不仅仅是学费，书籍，住宿和伙食的钱全部加起来，还包括由于没有工作而损失的工资\n\n看一场电影的机会成本不仅是票价，还包括你呆在剧院的时间的价值。\n\
    \n## 人们如何做出决策\n\n## 原理三：理性人考虑边际量\n\n理性人：\n\n- 系统而有目的地尽最大努力实现其目标的人\n- 通过比较成本与利益的边际变动来做出决策\n\
    \n边际变动 – 对现有行动计划的微小增量调整\n\n人们通过比较边际利益和边际成本作出决策\n\n## 人们如何做出决策\n\n## 原则三：理性人考虑边际量\n\
    \n- 当一个大学生考虑是否要多上一年学时，他会比较学费加上损失的工资和多上一年学所增加的额外收入\n- 当一个经理在考虑是否要增加产出时，她会在增加的劳动力与原材料的成本和额外的收益之间进行比较\n\
    \n## 边际决策与平均决策\n\n## 边际决策与平均决策\n\n- 与我们经常使用的从整体上比较收益和成本的“平均决策方法”不同\n- 边际决策方法的思想：过去事就让它过去，不要让它影响你未来的决策。\n\
    \n## 例1\n\n![](img/518b44ff56ad05e168220626515b534d_53_0.png)\n\n- 一事务所估计每月复印1000张，市面上复印1张的价格是0.25元。若租用复印机，每月租金及杂费为100元，纸张价格是0.10元。\n\
    - 决策问题一：是否租用复印机？\n\n## 平均决策问题\n\n- 是否租用复印机？\n\n![](img/518b44ff56ad05e168220626515b534d_54_0.png)\n\
    \n不租用：\n总费用 = 0.25 × 1000 = 250(元)\n\n租用：\n总费用 = 0.10 × 1000 + 100 = 200(元)\n\n\
    决策：租用。\n\n## 决策问题二：若另一个人提出0.15元/张出价要求复印，是否接受？\n\n## 平均量方法：\n\n平均成本 = 200/1000\
    \ = 0.20(元)\n\n出价低于平均成本，不接受。\n\n## 边际量方法：\n\n边际收益 = 0.15元\n\n边际成本 = 0.10元\n\n\
    ## 决策：边际收益 > 边际成本，接受。\n\n![](img/518b44ff56ad05e168220626515b534d_55_0.png)\n\n\
    ## 决策问题三：实际复印业务为500张时的复印业务的要价是多少？\n\n- 状况：\n\n- 平均成本=(0.10×500+100)/500=0.3 大于市场复印价0.25元，亏损。\n\
    \n- 不过，边际成本并没有因亏损而发生变化，因此，只要复印业务的要价大于0.10元，就可以接受。\n\n## 过去的事就让它过去\n\n- 凡是不能改变的东西在进行边际决策时一律不予考虑，通俗的说，它是过去的东西，把它忘掉。\n\
    - 前面例子中的决策二，“忘掉”的是固定费用。\n- 前面例子中的决策三，“忘掉”的不仅有固定费用，还有决策失误状态。\n"
