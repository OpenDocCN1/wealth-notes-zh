    - 系统性地胜过市场是不可能的。当你得到新闻的时候，共同基金的管理者早已对此作出反应\n\n## 指数基金与管理基金\n\n- **指数基金**是一种按照既定股票指数购买所有股票的共同基金\n\
    - 积极管理的共同基金的目标是只购买最好的股票\n- 积极管理基金收取的费用比指数基金要高\n- 有效市场假说（EMH）意味着积极管理的基金的收益不可能一直大于指数基金的收益\n\
    \n## 市场非理性\n\n- 许多人认为股票价格波动部分是心理原因造成的：\n  - 约翰·梅纳德·凯恩斯：股票市场是由投资者的“本能冲动”，“乐观主义与悲观主义非理性波动”驱动的\n\
    \  - 艾伦·格林斯潘：在20世纪90年代，股票市场的高涨是由于“非理性的繁荣”\n- 当投机者以高估的价格购买资产，并预期它的价格不断上升时，投机泡沫就会出现\n\
    - 背离理性定价的重要性仍未可知\n\n## 第28章 失业\n\n## 本章我们将探索这些问题的答案：\n\n- 如何衡量经济中的失业？\n- 什么是“自然失业率”？\n\
    - 为什么总有些人是失业者？\n- 工会和最低工资法如何影响失业？\n- 什么是效率工资理论？它又是如何帮助我们解释失业？\n\n## 劳动力数据\n\n\
    - 由美国劳工部劳工统计局调查统计\n- 数据来自于6万个家庭的定期调查\n- 调查家庭中的“成年人”（16岁及以上）\n\n## 劳动力数据\n\n劳工统计局（\
    \ BLS ）把受调查家庭中的成年人分为三个类别：\n\n- **就业者**： 包括作为得到报酬的员工而工作的人，在自己的企业里工作且得到报酬的人，以及在家族企业里工作但拿不到报酬的人\n\
    - **失业者**： 包括能够工作且在之前4周内努力找工作但没有找到工作的人\n- **非劳动力**： 不属于前两个类别的人\n\n**劳动力** 定义为就业者和失业者之和\n"
  mdcn: "\n\n## 风险管理\n\n- 如果一个人表现出不喜欢不确定性，就称这个人为风险厌恶者。\n- 对于风险厌恶者来说，失去1000美元的痛苦大于赢得1000美元的快乐，效用曲线是递减的。\n\
    - 对于风险偏好者来说，情况正好相反，效用函数是递增的。\n- 大多数人都是风险厌恶性的，这就产生了保险、多元化与风险-收益权衡取舍。\n\n## 图1.\
    \ 风险厌恶\n\n效用\n\n财富\n\n赢得1000美元\n获得的效用\n\n失去1000美元\n损失的效用\n\n失去1000美元\n\n现期财富\n\
    \n得到1000美元\n\n![](img/518b44ff56ad05e168220626515b534d_1374_0.png)\n\n## 风险管理\n\
    \n- 对付风险的一种方法是购买保险。\n- 保险合约的一般特点是，面临风险的人向保险公司支付一笔保险费，作为回报，保险公司同意接受所有或部分保险。\n-\
    \ 保险如何起作用：\n  - 面临风险的人向保险公司支付一笔保险费，作为回报，保险公司同意接受所有或部分风险\n  - 保险允许风险分摊，能使风险厌恶的人更好\n\
    \  - 比如，对于房子着火的风险，一万个人承担万分之一的风险比你自己一个人独自承担全部风险容易得多\n\n## 保险市场的两个问题\n\n1. **逆向选择**：\n\
    \   高风险的人从保险的保护中获益更大，所以高风险的人比低风险的人更可能申请保险（**事前**）\n\n2. **道德风险**：\n   人们在购买保险之后，对他们谨慎从事以避免风险的激励小了（**事后**）\n\
    \n保险公司无法充分保护自己免受损失，所以它们会收取一个较高的保费\n\n结果，低风险的人有时不会购买保险，从而失去了风险分摊的利益\n\n## 讨论\n\
    逆向选择还是道德风险？\n\n指出下述情形属于逆向选择还是道德风险的例子\n\n- A. Joe在买火险之后开始在床上吸烟\n- B. Susan的父母都因为牙龈疾病而失去了他们的牙齿，因此Susan购买了牙科保险\n\
    - C. 当Gertrude停车的克尔维特敞篷车时，她懒得把把车顶关好，因为她购买的保险能够补偿车内的任意大窃\n\n## 讨论\n参考答案\n\n指出下述情形属于逆向选择还是道德风险的例子\n\
    \n- A. Joe在买火险之后开始在床上吸烟\n  道德风险\n\n- B. Susan的父母都因为牙龈疾病而失去了他们的牙齿，因此Susan购买了牙科保险\n\
    \  逆向选择\n\n- C. 当Gertrude停她的克尔维特敞篷车时，她懒得把车顶关好，因为她购买的保险能够补偿车内的任意失窃\n  道德风险\n\n\
    ## 特有风险的多元化\n\n- 不能把所有的鸡蛋放在一个篮子里。如果用所有则资金去买一个股票，那就有50%亏损的可能。但如果买多种股票，一个亏损可以用另一个的赚来平衡，风险下降。\n\
    - **多元化**——通过用大量不相关小风险代替一种风险来减少风险。\n\n## 特有风险的多元化\n\n- **特有风险**——只影响一个经济主体的风险，与某公司相关的不确定性。\n\
    - **总风险**——同时影响所有经济主体的风险，与影响所有公司的整个经济相关的不确定性。\n- 多元化不能消除总风险，人们可以通过接受低回报率来降低风险。\n\
    \n## 风险与收益的权衡取舍\n\n- 权衡取舍：\n  风险较大的资产其平均收益也较高，这是为了补偿持有它们的额外的风险\n- 例如：在过去的两个世纪中，股票提供的平均真实收益率为每年8%左右，而短期政府债券支付的真实收益率每年只有3%\n\
    \n## 风险与收益的权衡取舍\n\n- 例：如果你的有价证券组合中有两种类型的资产\n  - 风险股票的多元化组合：平均收益率 = 8%，标准差 = 20%\n\
    \  - 安全资产：收益率 = 3%，标准差 = 0%\n\n- 有价证券组合的风险与收益取决于两种类型资产的比例……\n\n## 图2.多元化\n\n风险\
    \ (有价证券组合的标准差)\n\n(风险大)\n\n49\n\n20\n\n(风险小)\n\n特有风险\n\n总风险\n\n有价证券组合中股票的数量\n\n\
    0 1 4 6 8 10 20 30 40\n\n![](img/518b44ff56ad05e168220626515b534d_1384_0.png)\n\
    \n## 图3. 风险与收益权衡取舍\n\n收益\n（每年百分比）\n\n风险\n（标准差）\n\n没有股票\n\n25% 股票\n\n50% 股票\n\n\
    75% 股票\n\n100% 股票\n\n风险越大，收益也相应越多，反应收益和风险的曲线向右上方倾斜。\n\n## 资产评价\n\n- 基本分析——研究一家公司的会计报表与未来前景以决定其价值。\n\
    - 人们可以通过基本分析试图发现某一股票是否被低估、高估还是公正的估价。\n- 基本分析的目的就是购买被低估的股票。\n- 对公司进行基本分析要分析它能致富的红利、利润率、产品需求、资本状况顾客的忠诚程度、政府管制和税收等。\n\
    - 进行基本分析可以是自己关注报表、请分析师咨询，以及购买共同基金等。\n\n## 资产评估\n\n- 当你考虑是否要购买某家公司股票时，你要比较购买的企业股份的价值与股份出售时的价格：\n\
    \  - 如果价格>价值，则股票被**高估**\n  - 如果价格<价值，则股票被**低估**\n  - 如果价格=价值，则股票被**公正地评估**\n\n\
    ## 讨论\n股票价值的估计\n\n如果今天你买了一些AT&T公司的股票：\n\n- 你可以在三年后以30美元的价格把它卖出去\n- 在这三年的每个年末，你都会得到1美元的分红\n\
