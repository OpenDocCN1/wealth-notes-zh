  - '[PAGE 745]


    # 本章我们将探索这些问题的答案：


    +   - 什么是完全竞争市场？

    +   - 什么是边际收益？它和总收益与平均收益有什么关系？

    +   - 竞争企业如何决定利润最大化的产量？

    +   - 短期内，竞争企业何时会选择停业？长期内，竞争企业何时会选择退出市场？

    +   - 短期的市场供给曲线是什么形状？长期的呢？'
  - '[PAGE 746]


    # 介绍：一个故事


    +   - 你毕业三年之后，你开始自己做生意

    +   - 你必须决定生产多少，定怎样的价格，以及雇佣多少工人等等

    +   - 哪些因素会影响这些决策？

    +     - 你的成本（前一章我们学过的内容）

    +     - 你面临怎样的竞争

    +   - 我们开始在完全竞争市场中研究企业的行为'
  - '[PAGE 747]


    # 什么是竞争市场？


    +   完全竞争市场有以下特点：

    +   - 市场中有许多买者和许多卖者:P既定；

    +   - 产品同质：各个卖者所提供的物品大体上是相同的。单个企业无法提价；

    +   - 要素自由流动：企业可以自由地进入或退出市场企业进出自由。

    +   - 信息充分：不会有高价购买或低价出售。'
  - '[PAGE 748]


    # 什么是完全竞争市场？


    +   - 由于以上特点, 完全竞争市场 具有以下结果:

    +     - 市场上任何一个买者或卖者的行动对市场价格的影响都可以忽略不计。

    +     - 每一个买者和卖者都把市场价格作为既定的。买者和卖者必须接受市场决定的价格，是价格接受者。'
  - '[PAGE 749]


    # 竞争企业的收益


    +   - 一个企业的总收益等于销售价格乘以销售量。TR = (P X Q)，总收益与产量同比比例变化

    +   - 平均收益 告诉我们企业从普通一个单位产品销售中得到了多少收益。平均收益等于总收益除以销售量。

