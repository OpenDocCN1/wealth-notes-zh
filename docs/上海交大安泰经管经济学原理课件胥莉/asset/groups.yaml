    # 总效用TU与边际效用MU的关系


    当MU > 0, TU↑；

    当MU < 0, TU↓；


    当MU = 0, TU最高点，总效用达到最大。

    处于↑、↓的拐点


    总效用以固定增加时，边际效用不变


