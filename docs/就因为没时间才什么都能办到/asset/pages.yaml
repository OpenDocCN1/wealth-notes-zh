  md: '什麼都想碰。


    不過有些事情在留學之後就變了。


    我在留學前，總想著要獲得眾人的認同。身為婦產科醫師，當然想對孕婦有所貢獻，想幫助婦女病的患者，但最終的理由仍然是「希望人們覺得我很能幹」。


    但哈佛教授們常說的一句話，讓我有所改變。


    那句話是，「各位是世界的領導者！去改變世界吧！」


    教授們總把「Make a difference」掛在嘴邊，讓我不禁反省自己。


    我究竟爲何要如此努力學習？


    是想要哈佛研究所畢業的光環？


