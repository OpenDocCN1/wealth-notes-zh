  md: '斤，壓力沉重到連月經都停了。


    「這種房子我根本不想繳房租！」「這樣下去根本沒辦法念書了！」走投無路之下，我只好找上羅貝塔哭訴。羅貝塔是人學時很照顧我的哈佛研究所學生顧問。


    訴。如果你不先告對方違約，對方就會告你遲繳房租！」接著還介紹了認識的律師給我。


    但我不可能有錢支付高額的律師費，而且這輩子也沒打過官司，當時真的嚇到腿軟。


    即使如此，我還是誠惶誠恐地去見律師，並且一開頭就說明白來龍去脈，自己是窮學生，付不起律師費，如果不先了解諮詢費用就不能下委託。


    結果這位名叫傑克的律師，很有耐心的聽我說完整個狀況，接著以一億美元


    # 找律師商量，用最低價幫忙寫存證信函


    ![](img/b1d54a6a2c751335b185b23df17a8ad1_182_0.png)'
  merge: -1
