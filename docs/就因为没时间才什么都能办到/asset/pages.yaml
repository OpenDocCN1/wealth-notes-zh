  md: '# 【自序】


    「沒時間」讓人無所不能！



    帶著新生兒和一歲、三歲的女兒去哈佛留學



    二〇〇八年八月，美國休士頓。下午兩點，我與丈夫、三個女兒以及我的爸媽，抵達波士頓機場。午後的陽光刺眼，但微風舒爽，晴空萬里無雲。我大口地吸入異國的空氣後，揚起了嘴角。想著，啊，終於到了。


    朝思暮想的海外留學生涯就要開始了！



    我原本在日本擔任婦產科醫師，而且有三個幼齡孩子，該做的家事一樣沒少地準備著各項留學事宜，完全是蠟燭多頭燒的狀態。這一刻，我終於成了留學生。既然如此，白天是哈佛大學的研究生，就優游自在地研究課業，與同學切磋'
