  md: '我想任何人都有類似的經驗，只要切換開關，打定主意「動手做！」「向前走！」並且真的採取行動，便能感覺到自己脫胎換骨，變了個人。


    對著理想向前衝，闖關難過闖關過，讓我有種人生加速狂飆的爽快感。


    「不是因爲某件事情很難，你才不想做，而是因爲你不想做，所以變得困難。」我經常想起這句話，然後就會動手去做，結果就真的「有志者事竟成」。


    回想準備留學的過程，有很多難關也是因爲只剩六個月才能過關。因爲半年的時間短暫，我才能專心致志。如果入學的目標是後年九月，我想我花在準備的總時間長度並不會改變，但是更關鍵的「加速度」卻會完全不同。


    在工作上碰到自己想做的事情，只要有規定期限，而且期限迫在眉睫，我也會興奮地握拳，把握機會。


    有期限限制，便能發揮「臨陣磨槍」的狂熱。期限是讓人「加速」的要件。以正常速度無法完成的事情，只要加速就可能成功。


    期限短，代表能刺激自己更加努力，真是天賜良機……只要從這個觀點來看事情，拚命戰到最後一刻即可。


    話雖如此，我偶爾也會在期限前後悔，要是事先多做些準備就好。焦頭爛額'
