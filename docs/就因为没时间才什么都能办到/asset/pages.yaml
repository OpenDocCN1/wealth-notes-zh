    # 不指責對方的錯，展現信任，請求幫助


    話說研究所經常舉辦「交涉及技巧」的講座，講座內容針對求職、談薪水、非營利組織申請資金等情境，介紹各種有效的交涉方法。


    每個案例的基礎都在於「態度優雅，要求明確」。日本並沒有這樣的講座，出於好奇心作祟，我多次參加這樣的講座。


    於是我決定，利用講座上學到的哈佛交涉術與事務負責人交涉。


    首先，我用上了哈佛交涉術的第一要點：「不要責難對方的錯誤」回信給負責的事务員和指導教授。


    信的開頭先為回信太晚致歉，再接續以下的內容：'
  merge: -1
