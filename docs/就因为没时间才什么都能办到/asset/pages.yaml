  md: '還沒起床時向他請教數學。


    結果不知道考了几次GRE，總算拿了數學七百一十分，英文兩百九十分，勉強及格。


    我的程度是從「三角形內角和爲一百八十度」開始學，最後卻能在數學這項拿到七百一十分，固然要感謝艾夫教導有方，但只做題庫也是致勝原因。


    其中的關鍵在於「鎖定單一目標，反覆練習」。


    我經歷過高中考試、大學考試、國家醫師考試等重重關卡；在準備考大學時，因爲缺乏信心而買了一大堆題庫，結果根本來不及做完，好幾本連碰都沒碰過。考醫師執照時也是壓力沉重，只要有人介紹什麼好題庫就都買來做做看，結果一樣沒能做完全而且還多到有點消化不良。


    應該不少人都有過類似的經驗：考完後才發現這本參考書沒用，那本題庫浪費錢，然後把全新的參考書和題庫給扔了。就因爲有過這樣的經驗，準備留學時我才下定決心「題庫要少買！」


    我痛定思痛，考GRE只買了一本題庫，但這本也有A4大小，三公分厚，剛'
