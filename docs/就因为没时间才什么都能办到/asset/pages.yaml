- pgno: 178
  md: '![](img/b1d54a6a2c751335b185b23df17a8ad1_178_0.png)


    # 遇到麻煩要懂得向人求助


    我曾經與朋友想像過一件事：「我們希望自己的孩子，在十八歲時能具備怎樣的能力？」


    我的女兒們在十八歲時，不知道會是住在自己的國家或其他國家，也不知道經濟會是寬裕還是貧困。在此前提下，我期望他們能成為怎樣的人，可以不靠雙親地在任何情境下都能獨立生存？


    結果我列舉了三項：


    +   ①能自己做決定

    ②懂得重視對方的心情

    ③自己有麻煩的時候，能向身邊的人求助'
  merge: -1
  img_proc: true
- pgno: 179
  md: '我不敢大聲說自己十八歲時已經有了這些能力，但至少活到這把年紀，這三項能力幫了我不少忙，所以才希望孩子們也能學會，尤其是第三項。


    比方說要搭電車上學時，發現自己忘了帶月票和皮夾，而且也沒帶手機（我並不打算給小孩辦手機），當天早上又有重大考試，來不及回家拿……這時候可以尋找車站裡有沒有同校同學或老師，或是找站務員、找派出所警察商量解決之道。我期望孩子們在這種時候，會動腦想辦法，並動手去做。


    碰到麻煩，辛苦難過的時候，就算蹲在路邊哭泣，情況也不會改善。


    我認為人生總有些狀況，光靠自己根本無力解決，這時候就該求助他人，大聲說「我有麻煩了，請幫幫我！」「一事關重大，請幫個忙！」這或許需要勇氣，但我想這是很重要的求生能力。


    我也認為，只要開口說「幫個忙」，一定有人會伸出援手，一定有很多好心腸的人，社會還是充滿溫情的。


    當我在美國碰到居住麻煩時，對此更是深信不疑。'
  merge: -1
  img_proc: true
- pgno: 180
  md: '到了美國之後，我們租了一房一廳的公寓住家，每個月的房租是一千九百美元（報考前已看過哈佛的學生宿舍，可以全家進住的兩房一廳月租要兩千兩百美元，實在住不起）。


    哈佛大學位於波士頓，冬天非常寒冷。到美國一個月後的九月底，氣溫驟降，大樓卻在此時通知要進行暖氣更新工程。每天都有五、六個工人到家裡來敲牆壁、拆暖氣管，換通風口。簽約時根本沒聽說這件事，嚇了一大跳。


    如果幾天內結束還能忍受，但聽說工程要到隔年五月才完工。


    十月，客廳的暖氣因爲施工而停掉，白天的室溫降到五度以下。我們向工程負責人借來了煤油暖爐，但只有一部根本不夠暖和，若是裝三部以上又會跳電。我家的電費還因爲這樣漲了一倍。


    再來，施工敲掉了我家與鄰居間的隔牆，只用塑膠布擋著應急。聲音與味道完全擋不住，毫無隱私可言。雖然都是在白天施工，但傍晚回到家，到處都是施工後的垃圾、灰塵以及隨意放置的工具。自從牆壁敲破之後，老鼠更是在走廊上


    # 租屋意外碰上大麻煩'
  merge: -1
  img_proc: true
- pgno: 181
  md: '亂竄。


    我向房東提出立刻搬離的要求，但房東回答簽約前已經決定施工，所以不接受降租或退租。再與房東交涉下去也不會有結果，於是我將屋內的慘狀拍照存證，準備了說明工程概要文件，前往當地衛生單位申請監察居住环境。


    衛生所監察之後，對大樓管理人發出通知：「室內工程可能對健康有不良影響，應讓住戶移居別處。」但大樓方面並未安頓住戶，只是讓工人多穿了鞋套，在施工位置的地板上加鋪塑膠布，繼續施工。


    我不知如何是好，便去找哈佛大學的學務處商量，學務處的職員很熱心的與我一起思考該怎麼寫電子郵件與房東交涉（內容僅聲明主張，沒有攻擊或威脅字眼，而且很清楚的表達我方的要求）。結果去信給房東，情況還是沒有改善。


    托兒所問題、健保問題，再加上居住麻煩。我一個人留學，帶了整個家過來，卻讓家人面臨如此窘境，想到就難過，幾乎要得憂鬱症了。


    此外研究所每天都有大量的功課，不僅要上課，還要花好幾倍的時間預習與複習才能跟上進度。我的精神狀況根本無法專心念書，三個月體重就少了五公'
