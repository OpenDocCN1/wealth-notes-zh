  md: '11月1日星期四


    今天也多謝妳的幫忙！再過兩個月就要過年了，真的很快。


    上次的清爽套餐大受好評，我丈夫也很愛吃。感謝妳的用心。往後請做烤、蒸等清爽菜色。


