- pgno: 126
  md: '如果總是以責任為優先，理想就難以實現。然而責任是永無止境的。如果要等責任盡了才去追求理想，等到天荒地老也還是沒動手。


    完成夢想的關鍵就是，理想和責任一起扛，也就是同時進行想做的事和應該做的事。無論跨出的第一步有多小，都要踏出去。一旦踩上踏板，就持續踩不停。


    我認為這就是實現理想的要訣。


    為了達到目的，需先建立一個重要的觀念，就是「中途停頓很正常」。比方說原本決定「今天要做到這裡」，但卻沒能完成進度，就換個念頭「沒關係」、「有前進就好」。


    準備考哈佛的時候，平日我是利用凌晨三點到六點，以及每天三小時的通勤時間來念書。週休二日，則是在圖書館裡享受珍貴的學習時間。


    每個假日上午，我們一家四口就前往附近的圖書館。當時大女兒三歲，就與丈夫在繪本區玩，我則背著一歲大的二女兒，在閱覽室做題庫。


    但，二女兒可不會乖乖的讓我背一上午，要不了多久就開始手舞足蹈，發出'
  merge: -1
  img_proc: true
- pgno: 127
  md: '「嗡嗡啊啊」的聲音。因爲擔心吵到旁人，我只好拿著單字卡，在圖書館內走來走去，分散女兒的注意力。


    等女兒安靜下來，再回到閱覽室。但好景不常，馬上換大女兒跑來喊說：「馬麻？肚子餓了！這時候我就要走出圖書館去買飯糰或麵包，帶她到公園吃完。大女兒吃飽了就在公園裡跑來跑去玩耍，我則在一旁逗著三女兒玩。之後母女三人再回到圖書館，由丈夫接手照顧大女兒，我就趁著三女兒睡著的好機會，在閱覽室裡專心做題庫。


    大家一看就知道，我的「假日圖書館學習之旅」總是斷斷續續，無法一口氣完成。


    正因爲這樣我才能肯定的告訴各位「堅持到底的關鍵在於不放棄」。就算中途受到打擾，只要鼓勵自己「多少有進步」就好。孩子本來就愛玩，而且假日本來就應該陪孩子玩一整天，所以能讀個兩頁三頁就該慶幸了。即使被打斷，也不要氣急敗壞地怒吼放棄。若是非得中斷不可，就老實停手，靜待機會來臨，全力再出發。'
