    至於我是怎麼念書的，就留待下一章說明！


    # ☕ 週一凌晨三點列出［應辦事項清單］


    往留學前進！話雖如此，日常生活除了例行公事外還有數不清的事情必須做：工作、家事、帶小孩、雜務……因此怎麼編排行程，確保念書時間，顯得格外重要。


    我參考了史蒂芬·柯維所著的《與成功有約》，訂出一週計畫。詳細行程內容的安排請各位參考該書，在此只介紹我如何套入自己的念書時間。'
