- pgno: 52
  md: '# 06

    有期限，才會「加速」


    ![](img/b1d54a6a2c751335b185b23df17a8ad1_52_0.png)


    準備考試的時間只有六個月


    我在二〇〇七年六月下旬，下決心「一定要去留學！」也由於我的急性子，只要下定決心，就立刻採取行動，最好還能立刻看到成果，所以具體的目標內容，就是「明年九月一定要到某個研究所留學！」


    九月入學的申請書，截止日期是前一年的十二月一日。也就是說只有大約半年可以準備考試。


    「才半年!?」可能有人會大吃一驚，但我認為只剩半年時間，正是能夠成功留學的原因之一。


    因為有期限，才能實現。


    歐美研究所與日本研究所不同，並不需要在當地報考受測。但相對地，必須'
  merge: -1
  img_proc: true
- pgno: 53
  md: '透過網路提交論文、托福成績單等文件，依內容判斷考取與否。當時我報考了四間研究所，涵蓋哈佛在內，而必要的文件都大同小異，包括：


    +   申請書


    +   托福成績單


    研究所方面會以托福成績判斷考生的英語能力，科目包含閱讀、聽力、口說、書寫四項。四科滿分一百二十分，想報考哈佛必須拿九十分以上。


    +   GRE成績單


    GRE是美加地區研究所的共同入學考試，有數學、英文、論文三科。報考哈佛研究所需要一千分以上。


    +   小論文


    +   推薦信三封


    我拜託實習時期的醫院醫師、國內大學與研究所的恩師為我準備。由於老師們都很忙，我並不請他們撰文，而是自己先打好草稿，再請老師修改。


    +   國內大學（或研究所）的畢業證書與成績單'
  merge: -1
  img_proc: true
- pgno: 54
  md: '其中申請書就像求職履歷，註明學經歷等個人資料，並不困難。至於大學、研究所的畢業證書與成績單，只要向學校申請英文版證明，也是輕鬆就搞定。


