  md: '我並不覺得這段時間非留給自己不可。當身體疲憊，情緒低落時，我也會睡到六點才起床（平時我都和小孩一起晚上九點就寢，算起來大概睡了九小時）。而且，不時還會發生睡過頭的糗事。但無論睡比較多還是睡過頭，只要能消除一身的疲勞，重拾笑容，我認為這也是有價值的時間運用。所以，這本書絕不是什麼女強人的成功經驗談，而是經過我反覆試驗，並承蒙眾人理解與協助，好不容易匍匐前進走出來的一條坎坷道路。這條路真的是崎嶇不平，我死也不會告訴大家：「走這裡就對了！」只能對你們說：「我的確是這樣想、這樣做才辦到的。」就這一點我希望能引發各位的共鳴，就算只有一個人也好，能從中得到任何啓發，並且覺得「穗波女士都做得到，那我或許也可以！」也就不枉費我傾全力寫成本書了。


    話說我抵達波士頓機場時，期待的是玫瑰色般的留學生活，但現實的情況卻完全怎樣，可說是超乎想像的糾紛不斷的挑战。即便如此，從下決心「我要留學！」開始，到考上哈佛研究所、完成學業的'
