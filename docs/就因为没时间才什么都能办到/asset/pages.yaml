- pgno: 62
  md: '落而洶氣，我們能在多短的時間內充飽它？我認爲，這就是成功的關鍵。反過來說，只要抱持「一定會達成目標！」「美夢會成真！」的堅定信念，時間自然會跑出來，所以第一要務是「張羅情緒」。


    根據我過去的經驗，當自己尊敬的女長和前輩給予鼓勵與建議時，都能打開我的「鬥志開關」。


    光是聽到所信任的人對自己說：「一定會成功！」就覺得自己已經跨過天涯海角，飛越藍天白雲，無所不能了。


