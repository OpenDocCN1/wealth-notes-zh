  md: '朋友說，與其在這達車上連坐二十分鐘，不如有座位搭四十分鐘，較能靈活運用，因為在座位上可以專心念書，或打開筆電處理郵件與工作等。


    旁人常問我：「搭新幹線通勤很貴吧？」但對我來說卻是舒服而珍貴的念書時間。


    雖然一個月 的月票超過台幣三萬元，但診所提供大約台幣一萬五千元的通勤補助，等於我只要自付一半的錢，這對於沒時間的我來說，花這種錢很值得。


    # 徹底運用「零碎時間」


    這麼一來，我每天都有凌晨三小時與通勤來回三小時的時間念書，但其其實整天下來還有其他時間可以念書。


    那就是通勤時的步行時間，以及等車時間。從我家到芋都宮車站大約五分鐘，到車站花三分鐘左右等新幹線，從東京車站走到診所約十分鐘，回程從車站騎腳踏車到托兒所，要十分鐘左右。總共加起来大約三十分鐘。


    這段時間我就用mp3聽英文成語專輯、對話CD、英文版《與成功有約》的'
