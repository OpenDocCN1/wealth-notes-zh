  md: '這時候就在當天的清單上打叉，稍微調整計畫，利用當週剩餘時間或是挪到下週完成。


    順利完成的事項就打個大勾勾。一旦化成肉眼可見的表格，就可以清楚體會到儘管緩慢但事情確實都完成了，而產生出極大的激勵效果。


    # 先把時間安排給「大石頭」


    每週一清晨在列「應辦事項清單」時，我總會特別注意「大石頭」。


    各位可有聽過「大石頭理論」？


    這是說，如果你手邊正好有幾顆河岸邊常見的大石頭，以及十杯的小石頭，還有一袋細沙。除了這些之外旁邊還有個空桶子。


    如果要在桶子裡裝進最多的石頭和細沙，應該怎麼裝才好？


    正確答案是先裝大石頭，再裝小石頭，最後倒入細沙。


    如果先裝小石頭或細沙，就很難把全部的大石頭塞進去，但只要先裝大石頭，小石頭與細沙就能流入大石頭之間的縫隙，這樣才能裝進最多。甚至還可以'
  merge: -1
  img_proc: true
- pgno: 82
  md: '倒水進去，讓水滲入石頭與石頭，沙與沙之間的微小空隙裡。


    平時的時間管理也跟這個道理一樣。在有限的人生中，我們最優先的必做事項就是大石頭，先安排大石頭，自然而然就會有給小石頭使用的時間。如果把時間分配給雜事小事，就沒時間做重要大事了。


    換句話說，我們其實很容易將重要的人生時光，分配給不那麼重要的芝麻小事。


    我是在《與時間有約：全方位資源管理》這本書看到這種說法，看了之後才發現，明明心裡清楚應該先放「大石頭」，但在平日生活裡卻總是忘記。


    從那之後，我在安排行程表時，就會開始思考當下的「大石頭」是什麼？接著，將完整的時段分配給我認定的「大石頭」。


    排念書行程時也一樣。前面提過，報考哈佛研究所必須準備以下項目：


    +   托福考試九十分以上

    GRE 考試一十分以上

    寫小論文：「我想成為怎樣的親子保健專家，希望對世界帶來怎樣的貢'
