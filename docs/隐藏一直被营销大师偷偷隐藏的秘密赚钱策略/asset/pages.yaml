  md: '所以，你必须从观念上理解“免费”在整个营销流程中，对你意


    什么？理解清楚以后，就是要注意第二点……


    免费，不是真的免费，是看起来像免费……


    免费的手法有两种……


    +   1. 大部分人免费，小部分人付费。


    大部分人免费，小部分人付费，怎么理解呢？很简单，比如说，我讲课是要收费的，对吧？但是我为什么要讲公开课呢？


    是因为我们通过讲公开课，让大部分人免费享受到这个价值，然后借力成交之后，让少部分人付费，那么少部分人付费带来的经济价值是足够让我赚回我的时间和空间成本的……


    那么虽然大部分人是免费的，但是小部分人的付费，就让我赚回了大部分人免费的时间成本，何乐而不为呢？


    我还是拿美甲店这个案例来说，如果你算一个获客成本是 15 块钱，那么一百个客户就 1500 元，所以你可以把 15 元可以做出来的美甲套餐，定个价，例如：138
    元，然后……


    做 100 张面值 180 元的“美甲储值卡”，找周边的理发店，SPA 水疗馆，KTV 等店铺，通过虚拟筹码，异业联盟的手法，让他们把储值卡送给他们的女'
