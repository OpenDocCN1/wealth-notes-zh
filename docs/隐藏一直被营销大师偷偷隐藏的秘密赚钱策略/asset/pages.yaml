  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    所有的营销，在成交之前，都需要解决两个问题：


    一个是信任问题；


    +   • 一个是风险问题；


    那么什么是信任呢？我在《营销真经·赚钱导图》中，写出了信任的公式，如下：


    信任二彼此在对方大脑里的记忆残留深度；


    记忆二有价值的互动产生记忆；


    怎么理解这两句话呢？假如你接到一个电话，是你的一位朋友找你借钱，这个时候你借与不借，是由什么决定的？


    并不是他的借钱理由，而是他在你大脑中的记忆决定的，更准确的说是好的记忆，和有价值的记忆决定的……


    成交之所以要建立在信任的基础上，是因为成交之前有一个信任的高坎要爬，具体怎么理解呢？请看下方图片：'
