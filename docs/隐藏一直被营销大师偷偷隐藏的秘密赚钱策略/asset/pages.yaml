    早在上个世纪，就有一位美国文案大师，总结了《生钱文案》的三大目的：


    +   第一：让看见的人打开；

    第二：让打开的人看完；

    第三：让看完的人行动；


    如何实现呢？如果你在朋友圈发布一篇文章，这个时候，请问用'
