  md: '一直被营销大师范俊隐藏的秘蜜赚钱策略


    第二步：修改菜单，原本几十种选择，全部去掉，只剩下6个套餐；


    吃快餐，不是享受，学生要的是速度，所以品类多，选择就困难，而且对于餐馆来说准备食材也麻烦，菜单上有的又不得不备货，备货又不一定有人点，其实是一种鸡汤，所以……


    还不如精简到只剩下6个爆品，例如：红烧排骨、农家小炒肉、西红柿炒蛋等等……套餐让人们抉择更容易，你想我们去吃KFC的时候；


    第三步：送超级赠品：一碗汤+一碟咸菜；


    快餐店很多时候有汤，但是都很稀，稀到你找个蛋都难，所以我建议他做浓稠度高的汤，然后再送一碟精品咸菜，如果你读过大学，吃过快餐，你就知道一碗好汤+一碟好吃的咸菜，意味着什么，对吗？


    有没有同感？


    好了，前面3个准备好了，最重要的是最后的营销方案，如下：


    第四步：装修开业大酬宾，做一张2元免费任选一款套餐的活动；


    什么意思呢？其实很简单，就是让刘老板，做了一张2元的套餐卡，凭这种卡可以到店里任选一个12元的套餐吃，你可能有点懵，这样做不要亏死吗？


    表面上看，肯定是要亏的，但却不是真的会亏，为何呢？'
