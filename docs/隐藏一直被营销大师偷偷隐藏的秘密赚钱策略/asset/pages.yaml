  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    ① 赠品必须要有用有价值的产品；


    如果你送的东西是无关紧要，并且没有实用价值，那么客户一样 很难行动，虽然是送的，但是一样也要是好的东西，不然等于没有 送；


    ② 赠品必须和销售的核心产品具有相关性；


    比如说你卖的是情趣内衣，你说送盒牙膏给对方，显然没有效果，因为跟人群的核心需求不相关，但是如果你送杜蕾斯，并且是珍藏版，估计用户行动的可能性极强；


    ③ 赠品是免费的，但你也需要塑造价值；


    是的，赠品最终是要免费送给客户的，但是同样也要塑造他的价值，要明码标价，不要让用户猜它值多少钱，如果你不塑造，只是一堆赠品陈列出来，那么对于客户来说一样是一文不值；


    ④ 最后，你不得不考虑赠品的成本；


    综合起来，赠品要有价值，要和主打产品相关，同时成本还要低，因为赠品的成本直接影响你的利润，所以最好是成本低价值大的赠品，例如：DVD 光盘一套，价值 888
    元，因为知识的价值是可以放大的，最后还要和零风险承诺配套使用，威力无穷；


    第二：零风险承诺/负风险承诺；'
