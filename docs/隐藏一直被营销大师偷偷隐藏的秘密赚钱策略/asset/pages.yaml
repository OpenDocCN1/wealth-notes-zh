- pgno: 138
  md: '很多手头有粉丝的老板或者创业者，除了不知道如何营销，如何成交之外，最重要的一点是如何定价，价格高了怕粉丝承受不了，低了的又特别辛苦。经过我这2年的营销实战，我发现了4个秘诀：


    +   1、人们对价格是没有认知的，都是对比出来的：


    我有一个朋友开火锅店的，他的服务员经常向他反馈说“老板，很多客人都说，我们家的牛肉好贵！”，这个价格能不能再便宜一点，有一天……


    他跟我聊天说起这个事情，我说这个问题其实很容易解决，你只需要重新调整下菜单就好，他说什么意思？


    非常简单，你只需要在菜单加上两个产品即可，改完之后的结果是：普通肥牛28元，雪花肥牛35元，极品肥牛40元。自从改完菜单之后……


    再也没有客人反应牛肉贵了，并且营业额有了提升，因为通常客人在点菜时，不会点最差的，所以大部分人都点了35元的雪花肥牛。


    这个故事告诉你，人们对价格的认知不是绝对的，而是相对的。就好像你看“唐伯虎点秋香”一样，里面周星驰饰演的“唐伯虎”在街上看到“秋香”的时候，并不……


    感觉特别漂亮，但是当所有的丫鬟都回头的时候，对比之下，秋香就美的不行，道理是一样的。


    +   2、人们只会在相对的空间内对比；'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# 一直被营销大师偷偷隐藏的秘蜜赚钱策略


    价格不仅是对比出来的，并且人们通常只能在相对空间内对比。 我们来看一个案例，来自于美国《经济学家》杂志的一次实验。以前


    他们卖杂志都是卖两个版本，一个是实物版本，100 美元；另一个是电子版本，内容是一样的，60 美元。通常 80%的人会选择电子版本，20%的人会选 择实物版本。


    也就是这样的销售额为：(80 人 x 60 美元) + (20 人 x 100 美元) = 6800 美元，他们的预定量遇到了瓶颈，也就是说……


    如果订购人数不增加的情况下，要增加销售额只有一种选择，就是增加客单价。


    后来，有位营销高手给他们出了一个主意，什么都没有改变，还是那两个同样的版本，同样的杂志内容，但是成交主张不一样，结果 他们的销售额瞬间就发生了巨大的变化。为什么？


    我们来看一下那位营销高手，玩了一个什么样的魔术？


    方案是这样的：实物版 100 美元，电子版 60 美元，实体加电子版 105 美元。


    我想问你，如果是你，你会选哪个？……显然结果证明了一切， 80%的人选择了“实体加电子版“，10%的人选择了实体版，10%的人选 择了电子版，就这样没有增加任何成本的情况下，销售额增长到了
    10000 美元。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '一直般营销大师偷偷隐藏的秘密赚钱策略


    不难发现其实人们对价值的判断是没有绝对标准的，原本《经济学家》杂志的客户在 60 美元和 100 美元之间做选择，后来……


    加入了“实体加电子版”这个选项之后，人们就在 105 美元和 160 美元之间做比较了。


    就是这样，人们在有限的时间和空间里，只要展示不同等级，人就会自动的对其进行对比，然后选择看似最佳选择的那个，以免自己吃亏，所有的认知都建立在对比之上，呵呵！


    题外话，后来《经济学家》杂志他们调整了策略，实体版：100 美元，电子版：60 美元，实体加电子版：100 美元。


    不错，你又认为自己眼花看错了，其实是真的，就是这样设计的，请问你会如何？……大部分人认为他们搞错了，所以疯狂的下单。


    就像上面火锅店的案例，别人店的肥牛可能只要 18 元，但是他看不到，他无法进行对比，只能在现有的餐牌上进行对比。


    3、你的东西值多少钱，取决于多少人在说它值多少钱；


    排除对比因素以外，你的东西值多少钱，取决于有多少人说它值多少钱。社会心理学中有一个现象，就是人们更愿意相信我你之外的第三方，比如……


    我自己说自己的课程值 19800 元，那肯定没有人信，但是如果有很多行'
