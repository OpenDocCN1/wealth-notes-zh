- pgno: 112
  md: '修脚的兴趣，说能不能教他一招，提升点收入，他在修脚这个行业干了10几年，教了很多徒弟，但徒弟赚钱跟他也没有什么关系……


    我非常简单，就跟上面“瓦罐鸡汤”的故事，结果他修脚，兴奋不已，从那天之后，他从每个月只能赚1万多，变成每个月赚10几万，并且自己永远不用……


    每天睡眠就有钱收，而且他很愿意把绝活都教给徒弟，因为徒弟的收入都良与他有关，你知道他是怎么做的吗？


    相信你已经悟到了


