- pgno: 208
  md: '做任何生意，第一个要面临的问题，就是客户的问题，虽然这个 问题是营销中最容易的问题，但是对于大部分创业者，和企业家来 说，非常痛苦，那么……


    今天我就用最简短的表达方式，给你解密三个引流的秘密：


    一、反向捕获：


    流量是天然存在的，你的客户一定存在在这个世间上，只是你无 法知道茫茫人海中谁才是你的客户，所以电话销售诞生了，通过……


    每天拨打几百个电话，来碰可能对你产品感兴趣的人，天呐…… 这是多么笨拙的方式……


