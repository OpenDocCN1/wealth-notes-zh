  md: '一直被营销大师偷偷隐藏的秘中赚钱策略


    其实很简单，我让刘老板找来之前在他家吃过饭，又比较熟悉的 学生，招募 2个，然后说给他们一个赚外快的项目，0 成本，最少可以赚 500 元，然后给他们每个人
    500 张 2 元套餐卡，告诉他们……


    你们拿这个卡去学校卖，卖一张分一块，500 张卖完，就有 500 元零花钱，你想想，2 元就可以吃到以前要付 12 元吃的快餐，请问这 个卡好不好卖？


    答案是：肯定好卖，那么……


    如果每个人都卖出去，就是 1000 个客户进来，这样就不缺流量 了，果然不出所料，重新开业之后……


    流量爆满，一个快餐的成本大概是 4-5 元，会员卡收回 1 元成 本，那么也就是每个客户买入的成本等于是 3-4 元，如果没有后招，那肯定是亏本的，所以……


    当客户吃完，用 2 元卡买单的时候，老板会跟学生说，今天的菜 还满意吧，下次还想不想免费吃？这个时候如果你是学生，你想不 想？


    肯定想，所以刘老板会说“今天只需要 12 元购买 6 张 2 元的套餐 抵扣券（每次可以当 2 元现金用），就可以再送你一张免费套餐 卡”，这个诱惑是够大了吧？


    花原本要花的 12 元，还可以免费吃一次 12 元的套餐，这种好 事，天下哪里找？


    所以成交率高达 90%以上，这个时候，我们来算一笔账，看看刘 老板这次会不会亏本？'
