  md: '一直被营销大师偷偷隐藏的秘密赚钱策略

    这就是共享单车的成交主张，有的人说，这能一样吗？一个是买 车，一是租车，但其实是一样的，同样都是 300 元的支付行为，但是人类会认为不同，不同在哪里呢？


    行为是相同的，都是掏 300 元出去，不同在于于人类大脑的认知，买东西叫消费，钱出去回不来，而“保证金”对人类 的认知是什么 呢？可以拿回来的钱叫“保证金”，有种莫名的安全感，很神奇吧？


    最开始我跟同学说明这个道理时，他不理解，说不一样，现在他非常确信是一样的，因为他支付的多个保证金，`毛都拿不回来了，哈哈！！


    只要保证金最终我们可以让他变成消费，那么本质就是一样的，但是用户行动的速度加大了 10 倍，这对于营销人来说太棒了，例如：


    在 2015 年的时候，我做过 2 次营销活动，销售 1000 元的课程，第一次 1000 人在线，我说希望跟我系统学习的同学，支付 1000 元，报名即可，我成交了
    50 人，而第二次……


    同样是 1000 人在线，我说希望跟我系统学习的同学，今天只需要支付 1000 元的保证金，然后我邀请你进我的群学习 48 小时，如果你 学完 48 小时后感觉我是吹牛的，你说一声，我立即退还你
    1000 元保 证金，如果 48 小时后你感觉不错，那么保证金就转为课程费，你猜发 生了什么？


    这次报名的人超过 150 人，看见没有，这就是应用人类大脑里固有的定式，然后用到营销中发生的巨大威力为：'
