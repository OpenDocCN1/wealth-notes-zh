  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    美国有一个超市，这个超市有大门，当然也有侧门。这个侧门 是在一个巷子里面，这个巷子的底部就是侧门……


    然后本地人比较熟悉，所以他们喜欢骑着自行车，然后停在两边 的巷子里面，然后他们走进这个侧门，然后进去买东西……


    那么这个心理学家，做了一个实验，就是当人们把自行车停在这个巷子里面，走进超市之后他们偷偷的把那些广告，广告条去贴在他们的这个自行车的把手上……


    然后当人们从门里走出来，要骑自行车回家的时候发现，这个把手上有广告，对不对，有广告条……


    所以，心理学家需要测试的是，看有多少人会撕下这个广告丢在 地上，有多少人会撕下这个广告把这个广告带回家，丢到垃圾桶……


    结果发现，当这个巷子两边的墙上是干净的时候，那么里面有百 分之七八十的人都会把这个纸条这个广告条带回家丢到垃圾桶里面……


    但是，当另一组计划实施的时候，这个数据就发生了逆转……


    同样的方法就是在两边墙上喷上涂鸦，喷涂鸦是一种个性张扬的 行为，喷上涂鸦之后……


    我们会发现一个绝妙的现象，就是从超市走出来的人，然后把自 行车上面东西撕下来丢到地上的概率大大的增加了，那是为什么 呢……


