- pgno: 200
  md: '# 第二：认知有定式:


    对于人类来说，最可怕的是定式，也就是固有的习惯，认知，作为营销人一定要学会跳出世界看世界，否则很难做出有效的营销，举


    例:


    ．现在你打开朋友圈，看到一段文字，配合一张带二维码的海报发出来，请问你的认知是什么？


    广告，宣传信息，报名链接？一堆固有的定式反射出来，大部分时候现在这样的内容，会潜意识自己过滤跳过了，也就是说，你的广告会变的无效，怎么办？


    这个时候，你要问自己，人类会看到一些类型的内容，条件反射的认为那就是广告，但同时人类也会看到一些类型的内容，条件反射的毫无防备的直接打开，对吗？


    不错，定式是无处不在的，那么我能否把自己要推广的内容，伪装成用户毫无防备的形态呢？当然可以……


    你会发现人们对“白皮书”，“报告”类内容没有防备，例如：2018年腾讯发布关于00后网络行为白皮书，很多人看到就直接点开了，对吗？


    不错，那么我们再来看一个例子，如果今天让你花300元去买一台自行车，我敢打赌你会想很久，买什么款式，买了之后放哪里等等问题会让你思考许久，但是如果让你支付300元保证金，租一台自行车，你的行动速度会快10倍以上，不错……'
