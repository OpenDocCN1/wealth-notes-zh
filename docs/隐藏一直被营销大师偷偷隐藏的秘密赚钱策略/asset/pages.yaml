- pgno: 146
  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    2019 年 6 月的一个晚上，我跟电商营销大神“逐鹿”聊天到晚上 1: 30 分，这个过程中最少聊到了 6 个年赚几百万的商机，同时走的时候，我发现手机里多了
    4 个 APP（秘密所在），到底怎么回事呢？


    如今，移动互联网的发达，创业者，企业家们，都开始对“裂变”这门技术特别沉迷，因为这门技术可以在极短的时间内，让你的产品，你的企业获取大量的用户，而且“不要一分钱”，很多人说……


    智多星老师，如果你是中国微信社群裂变第二，估计没人敢认第一，对此……我不确定，虽然我曾经通过 130 个人，裂变了 100 万人在线，但是……


    在我的角度来看，与其说“裂变”是一门技术，我更把它看作是一种营销的哲学，你越对它有敬畏之心，你才能让让你为你所用，因为裂变用的不好，是会死人的，请看：


    我们拿中国近几十年的商业来看，我们从小大脑里的生意都是什么思维？没错……


    **1.直销思维：**


    所以，我们准备创业，做生意的第一个想法就是：点对点，一手交钱一手交货的生意思维，直销的定义是，以你为中心，点对点面对每一个客户，客户与客户之间是没有关系的，并且客户也不会帮你裂


    变客户（在没有机制的情况下），然而……'
