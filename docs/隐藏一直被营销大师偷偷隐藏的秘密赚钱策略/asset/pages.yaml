- pgno: 114
  md: '一直被直销大师偷偷隐藏的秘密赚钱策略


    我们看一下分叉思维的核心三要素是什么，如下图：


    ![](img/c557fe3fd80ef15cfe828239e0babf1d_114_0.png)


    +   1、产品：你的核心产品，跟别人的场景是互补的，可以是实物，也可以是虚拟的（因为互联网分叉多都是内容产品）；


    +   2、载体：乱撒野汤的载体是餐厅，修脚师的载体是澡浴店，办公家具的载体是空的办公楼，互联网内容的载体是什么呢？想想……


    +   3、可控：有了产品，有了载体，关乎你利润的核心，是否可控，缺一不可；


    我们再来看看 2 个案例，相信看完，你就可以把“分叉思维”打穿到你的大脑里……


