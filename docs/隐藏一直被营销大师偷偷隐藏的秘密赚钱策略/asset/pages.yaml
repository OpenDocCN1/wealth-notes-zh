  md: '这就是一个简单的设定过程，那我们再来看一个红枣的故事……


    +   3、红枣的故事，一包红枣卖 1000 元：


    我记得有一次我去朋友的公司，我带了一包红枣给他，然后我说 这包红枣非常好吃，非常贵，我送给你，然后他说一包红枣能有多 贵……


    那我说你知道吗？这包红枣是有机的，然后他说那个那可能会贵 一点，然后我说你知道吗，这包红枣不仅有机，他还是来自于马来西 亚的一座山上，然后他说那可能会更贵……………………………………


    然后，我说你知道吗？这包红枣不仅来自于马来西亚的山上并且他每年只产 1000 包，他说那可以更贵……


    你知道吗？这 1000 包有 800 包是给马来西亚的特首选的，所以只 有 200 包流传出来，这个时候他就会觉得这包红枣会值 1000 块钱……


    那这就是通过不断的释放信息去改变他的认知，然后他对这个红 枣的认知就发生了改变，其实红枣本身没有变化，只是，故事发生了 变化……


    +   4、如何把螃蟹大卖？


    那么，我再继续讲一个卖螃蟹的故事，前些天在朋友圈卖了个螃 蟹，卖螃蟹，你看“啊，我的第一种卖法是如何卖的呢？


    我第一种卖法是，买螃蟹，这个螃蟹 239 元，你只要买这一套八 只装的'
