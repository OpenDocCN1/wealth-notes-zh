- pgno: 202
  md: '人的大脑很奇怪，总是对新鲜的认知充满好奇，人类喜欢把同样的信息，同样的东西装在一个区域，大脑就是这样工作的，很多人不清楚，为什么我每次的课程，计划，都会取一个新的名字，其实……


    是因为，不想别人用他大脑里固有的认知来界定我，那样我就没有了任何市场和特色，如果别人讲微信营销，我也是微信营销，那么我就会被归类到他们一起，举例：


    2016 年，我做了 5 期淘宝客培训，但是我的课程名字并不像同行一样叫“某某淘宝客总裁班”，而是叫《微信粉丝掘金计划》，这样……


    用户大脑需要开辟一块新的区域来存放我，因为这是全新的东西，大脑里没有哪个类别可以存放它，所以大脑莫名的喜欢，并且被记住，大脑永远对第一和唯一的东西纪录的非常清晰，所以……


    你一定要记住，你的营销计划，从名字开始，就要让用户拥有一个全新的认知，这样更容易引起人们的注意……'
