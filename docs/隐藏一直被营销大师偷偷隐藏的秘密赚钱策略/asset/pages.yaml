- pgno: 141
  md: '一直被营销大师偷偷隐藏的秘实赚钱策略


    业前辈说“智多星的课程非常实战，19800 元这个价格没得 说，值！”那么就会更多的人愿意相信值这个价。


    但是这还是不够，因为人们没有亲眼看到，只是听说。说服力还不够大，所以最好还发生过，就好像一个古董花瓶，它应该值多少钱其实没有绝对的定义。对于普通人来说……


    它可能就是一个插花的瓶子，摔碎了也无所谓。但是如果你是一名收藏家，你就会觉得它价值巨大，具体多少钱，你也不清楚。


    你也看到，大部分古董鉴赏栏目，都只会说这个市场价值估 30-50 万不等，他们只能拿以往发生过的相同花瓶的交易来评估你的价值。 但是……


    如果你立刻找一个朋友，花 40 万买了你这个花瓶，那么从那一刻开始，这个花瓶就有了具体的价格，至少 40 万以上。甚至……


    如果你要抬价，你可以找一个朋友花 100 万买你这个花瓶，那么从此它就值 100 万。


    不错，值多少钱，完全取决于多少人在说，并且有没有发生过，只要发生过，人们就会相信。就好像如果你在淘宝上看到一把雨伞卖 3000 元，在 0 销量的时候……


    你肯定不相信它值这个价钱，哪个傻通会买。但是随着销量不断增长，'
