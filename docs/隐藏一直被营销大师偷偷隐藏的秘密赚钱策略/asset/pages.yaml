- pgno: 110
  md: '有一次，我与“心然”（三星人家创始人之一）在富力盈凯65楼喝咖啡，他给我分享了一个“秘密”，当时听完……


    我犹如茅塞顿开，原来他之所以几个项目都能做到“亿级”是因为架构思考的难度不同，到底什么绝话让我兴奋不已呢？


    在我正式解密之前，为了帮助你更好的理解和吸收，我们先来看 看几个故事：


    ![](img/c557fe3fd80ef15cfe828239e0babf1d_110_0.png)


    +   一、瓦罐靓汤；


    2006年的时候，我们在东莞樟木头开了一家中餐厅，我的第一份暑假工，就是在餐厅里做传菜员，广东人都很喜欢喝汤，所以……


    餐厅一楼门口，永远都有一个大瓦罐的缸，还有一个年轻的小伙子，起初我以为也是店里聘请的员工，后来才知道……


    原来，生意还可以这么做，当时觉得很神奇，到底是怎么回事'
