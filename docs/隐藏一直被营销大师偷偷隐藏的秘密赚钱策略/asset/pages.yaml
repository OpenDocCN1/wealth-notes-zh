- pgno: 149
  md: '大，更符合人性：


    # **第二个APP：微蜂看看；**


    这个 APP 做的是广告生意，直营模式怎么做的呢？早期都是站长自己建站，做 SEO、搞流量，然后在自己网站挂这些联盟的悬浮、贴片广告，广告费都自己赚，流量也自己买，本质上一个差价生意，而


    微蜂看看的裂变模式，是如何做的呢？其实很简单，就是把广告费分给阅读者，用户自己，自己留一点差价，然后用户推荐用户，还可以赚下级用户阅读广告的收益，结果就成……


    不用花一分钱广告费，就来了大量的用户，而同样的产品，今日头条极速版，是怎么做的？


    没错是用直营模式，那么它为什么用直营模式呢？原因很简单，他的流量获取成本足够低，因为“今日头条”里面直接诱导下载，所以全部广告费自己赚，也很爽，但是……


    一定要注意，直营模式，只有一种情况下，你能够发财……


    +   1. 团队管理打造能力强；

    2. 有直接获取流量的绝活；

    3. 流量基数可以足够大；


    直营模式是 1 对 N 的生意，所以如果 N 不是够大，一下就到了天花板，'
