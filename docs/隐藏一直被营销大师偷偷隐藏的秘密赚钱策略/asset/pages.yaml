- pgno: 123
  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    比如商家售价 200 元，你的旧锅可以当 40 元使用，你要花 160 元 换了一口新锅。很多人会觉得说，我用旧锅去换新锅，而不是去买。 有没有感觉销售的味道没有了。你会觉得没有这种感觉？


    呵呵呵，聊到这里，你开始觉悟了吧……“


    可是，上面说的有点复杂了，我直接用一句话概括吧，这样你会 更容易理解……


    相当于每份


    优惠降价 40 元


    以旧换新这只是表象，真正的目的就是让利 40 元，和平时的打折 没有任何的区别，只是换了一个说法……


    可是，说到这里你已经明白了大部分的道理，但是还没有完，真 相是事实上商家一点都没有优惠！


    你会不会觉得说不可能吧？已经优惠 40 元了呀！商家给新锅的时 候减掉 40 元了，为什么说没优惠呢？


    你想想，你不是把一口旧锅送给商家了吗？商家不但把产品卖给了 你，还得到了你家的一口锅！这口锅也值钱的，你明白吗？


    真实答案是商家什么都没有优惠！'
