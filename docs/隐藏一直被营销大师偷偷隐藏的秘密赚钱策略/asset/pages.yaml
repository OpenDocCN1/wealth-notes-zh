- pgno: 111
  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    呢？


    那个小伙子+那个大缸，都不是我们餐厅的，是别人外派来的，不用发工资，汤的菜单都是他们自己带的，客人点了之后，钱统一餐厅收，每个月结算一次……


    汤每卖一罐，给餐厅固定比例，你听懂了吗？原来背后是有一个做汤的餐饮公司，他们跟所有做中餐厅的合作，自带设备，派人过去给你做汤，赚了大家分……


    当时一天卖几十罐汤非常容易，做汤的小伙子也是按提成结算的，这家公司像这样的小伙子听说有100多个，分布在各个城市：


    ![](img/c557fe3fd80ef15cfe828239e0babf1d_111_0.png)


    # 二、足浴修脚师


    有一次比较累，就去足浴店洗脚，顺便修脚，在这个过程中跟旁边的边的人聊天，你也知道我们都是喜欢聊生意，聊营销，结果……'
