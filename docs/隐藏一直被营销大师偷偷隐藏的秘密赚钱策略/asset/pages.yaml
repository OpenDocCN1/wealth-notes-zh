    # ### 1、要有营销流程：


    首先，不管你准备卖什么产品，是实物也好，虚拟的也好，在销售之前，你必须设计好一个营销流程，否则……


    你要的结果往往可能达到。你不可能完全没有征兆的“跳出来”直接销售一个东西，你必须要有个流程。这个流程就像一个“滑滑梯”，滑滑梯的最底下是你要实现的目的，然后……


    你需要把每个新粉丝都放在滑梯的顶部，然后一步一步引导，让每个粉丝都轻松的从滑梯下来，最终实现“成交转化”。


