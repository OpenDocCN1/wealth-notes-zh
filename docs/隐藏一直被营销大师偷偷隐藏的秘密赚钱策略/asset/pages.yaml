    团队奖励，是用级差的方式结算，如果不懂，可以百度科普一下，那么这样设计，就一次解决了刚刚第一种模式的 BUG,因为……


    三级，不管哪一级进入会员，产生消费，你的利益是一样的，所以人不会舍远求近，然后因为有团队奖的设计，只要升级到经理级别 以上……。


