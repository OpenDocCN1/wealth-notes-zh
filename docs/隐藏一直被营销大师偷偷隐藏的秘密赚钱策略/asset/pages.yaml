- pgno: 82
  md: '随着移动互联网的发展，我相信你对于免费这个概念已经不陌生了，现在中国几乎不管是虚拟的网络里面，还是实体的现实里面，大 大小小的免费模式已经见惯不惯了，的确……


    我认为最重要的原因是他不知道“免费策略”的核心是什么？


    免费，你记住，免费不真的免费，免费，是一系列动作的开始！


    如果你使用免费做为入口，而后面没有一系列的动作，那么你用 免费来获取客户，那么就真的免费了……


    举个例子，如果你开了一家理发店，或者你开了一家美甲店，那么这个时候你需要很多女性的客户，那么这个时候你可能会用“免费 美甲”把用户吸引进来……


    那么这个时候，假如说你用这个免费美甲吸引了一百个客户进 来，每个客户的成本可能需要 15 元，那一百个客户，你就要花掉 1500 的成本，那么


    如果一百个客户进来，你免费美甲完，而没有设计后续的营销动 作，那这样的话你有可能真的免费了，就是亏了，所以……


    这样就不行，你需要谨记的是，免费送，只是你这个营销流程的 第一环，那么你的第二环是什么，第三环是什么？那么第一环、第二 环、第三环之间的这个滑梯是怎样的？'
