  img_proc: true
- pgno: 147
  md: '# **2.裂变思维；**


    这个是截然不同的思维，如果直营思维是一个品类的活，那么裂变思维就是与其在完全不同空间内的新品类，他们之间的优缺点是非常明显的，请看：


    **直营思维优点：**


    +   1. 利润都归自己；

    2. 客户名单可控；


    **直营思维缺点：**


    +   1. 客户成本太高；

    2. 体量有天花板；

    3. 员工成本太高； / 4>广告成本太高；


    **裂变思维优点：**


    +   1. 体量无限空间； .

    2. 没有广告成本；

    3. 抢市场速度快；


    **裂变思维缺点：**'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    几乎没有缺点，如果硬要说什么是裂变思维的缺点，就是大部分 利润分掉了，但是体量足够大的时候，赚的仍然比直销的多……”


    在没有互联网的时代，我们不懂慌，好像危机感也不不是很强，因为别人很难入侵你的那个一亩三分地，而如今……


    完全不一样了，现在你的对手被称为“无形的对手”，以前的思 维，我们总盯着同行，而现在干死你的可能是跨行过来打劫你的人，甚至打劫的不只是你，而是你的整个行业，品类，所以……


    我强烈建议，作为创业者，企业家，一定要在开始的时候，就拥有“裂变思维”，否则你即使开始能够赚钱，有一亩三分地，我敢打 赌，只要有懂裂变思维的高手进入你的品类时，你就特别危险，那
    么……


    我们来看一下，同一个生态，直销思维、和裂变思维的做法有什么 不同？


    还记得，本章开头我提到的 4 个 APP 吗？我拿其中两个来举例， 请看：


    **第一个 APP：趣专享；**


    做的其实就是淘宝客平台，关于淘宝客这个行业，有直营模式做 的，也就是开发个 APP, 然后买流量，佣金自己赚，比较代表性的就 是返利网，省钱快报等，而用裂变思维做的呢？


    有很多，花生日记，粉象生活，这类 APP 主要是裂变模式，把钱 部分给代理商和消费者自己，虽然每笔订单可能只赚 1%，但是不需要 获客成本，量'
