- pgno: 221
  md: '![](img/c557fe3fd80ef15cfe828239e0babf1d_221_0.png)


    # 一、成交需要越过信任高坡：


    不管任何交易，即使是亲弟弟让你买一个东西，为什么你都需要思考，甚至有的时候会犹豫？原因很简单……


    因为信任的高坡永远都会存在，只是不同环境下，这个高坡的高 度不同，例如你哥让你买一份保险，和一个同学让你买一份保险， 和一个素不相识的业务员让你买一份保险，保险没有变，变的是……


    找你买保险的人改变了，对吗？


    不错，不同的人在你心目中的信任基础不同，基础不同，那么摆在你面前的高坡就不同，那么有没有办法让第一次成交没有高坡呢？


    答案是：没有，即使'
