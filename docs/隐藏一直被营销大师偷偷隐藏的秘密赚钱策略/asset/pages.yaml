- pgno: 142
  md: '一直被营销大师偷偷隐藏的秘密赚钱策略

    1000 笔销量的时候，你的认知就会发生改变，好像这把伞真 的值这个价。


    +   4、任何东西在没有塑造价值之前说出价格，都是愚蠢的；


    这一点我深有体会，由于我是依靠“宝贝详情心理学”出名的， 所以很多做淘宝的粉丝都找我做“详情页”的设计，在微信上问我多 少钱？


    我说 2 万一个，99. 99%的人都不吭声了，都觉得异常的贵，因为 市面上 一个详情页的设计就几百到几千不等。


    后来我发现了这个原因，之后别人问我，我就问他是卖什么产 品，我看能否做，因为我之前做过类目， 一般我不接第二 家。第二我会说我做一个详情页最少要 15 天，
    一个月最多只能做 2 个，所以……


    就算如果你的产品能做，也要排期到下个月。第三，我只做极致 转化的 宝贝详情页，如果你这个产品不是要打爆款，我建议你别找我 做；然后……


    第四，如果确定要做了，我们会确保转化率高于行业平均的 1.5 – 2 倍之间， 也就是说如果你现在什么都不变的情况下，如果每天可以 卖 100 件，我优化之后最少可以卖
    150-200 件， 你可以算算是否值 得。


    这样经过一番塑造价值之后，2 万元就显得理所应当， 因为它带 来的价值回报远远超过 20 万。 你可能会说我的产品价格不贵，就 99 元，不需要塑造


    139'
