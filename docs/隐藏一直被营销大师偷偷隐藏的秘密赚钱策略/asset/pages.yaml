- pgno: 150
  md: '而裂变模式不同，他是 1对 N X N X N 的模式，你听懂了 吗？


    我们生活中，同一个行业，项目，有用直营赚钱的，也有用裂变 赚钱的，举例：


    +   1， 知识付费平台：


    +   得到： 直营模式；


    +   樊登： 裂变模式；


    +   2， 快餐行业：


    +   真功夫：直营模式；


    +   肯德基： 裂变模式；


    如果没有听懂，也没关系，我们来看人类 的繁殖发展图谱，记 得我们抗日战争时期都说一句话，我们中国 4 万万同胞，是多少人


    呀？没错，4 亿，而今天中国 14 亿人口，所以……


    你知道为什么我说“裂变”是 种哲学思维了吧？因为我们人类 的繁衍就 是一■种裂变，只要每一对夫妻结婚生孩子 超过 2, 那么裂变 就是指数级的；


    很多人害怕销售，害怕成交，其实是因为方法不对，快速翻页， 了解”成 交的秘密” "'
