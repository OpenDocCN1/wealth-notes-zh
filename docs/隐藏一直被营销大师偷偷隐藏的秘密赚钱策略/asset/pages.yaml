  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    正所谓，人脉二钱脉，但是大部分人第一不会经营人脉，第二是不 知道如何获取优质的上层人脉，今天我分享三个不为人知的秘密：


    +   第一：圈层黑洞；


    大多时候，圈层是一个一个的黑洞，如果你做的是淘宝的，跟你一起玩的都是做电商的多，你想认识周杰伦，太难，你想进入明星圈，更是不可能，但是……


    也不是完全没有办法，因为圈子与圈子很多时候，有重叠的地方，所以你只需要找到两个圈层的重叠部分，通过他，你就可以打破圈层黑洞的禁锢，举例：


    > 我是如何进入投资圈的？非常简单，我有一个朋友是投资人，通过他，我认识了很多投资人，所以……


    打破圈层黑洞最快的方式，就是你要跟不同领域的牛人做朋友，所以抓紧时间，打开微信扫一扫，加《营销真经·赚钱导图》背面各领域的牛人吧，链接最直接的优质资源……


    记住：人脉就是钱脉，江湖行走，多一个朋友，多一条出路；


    +   第二：社交货币；


    通过圈层叠加的部分，我们可以在各个圈层中自由活动，但是不'
