- pgno: 130
  md: '2019 年，社交电商大爆发，平均每天都有 3 家公司宣布他们要做 社交电商平台，那么这种分销背后到底有什么秘密呢？并且……


    琳琅满目的分销机制，哪一个才是最棒的呢？这是一个值得深思 的问题，因为很多小白不知道，模式的设计，决定了项目的存亡，也 决定了哪一层人会赚钱………………………………………………


    商业模式的设计，有很多种，有正规的，也有不正规的，正规的 就是没有泡沫，在百分百之内做分配，而不正规的呢？


    通常会结合新热点，新概念，新趋势，然后投资回报率惊人，而 且还有泡沫，所以我不推荐你去碰，既不要设计，也不要参与这类游 戏（来自我内心的忠告）……


    商业模式的设计，其实本质就是分钱游戏的设计，核心要满足人 性：


    分钱艺术=即得利益和长远利益的完美平衡；


    这句心法，是我做营销，商业模式 4 年来的总结，怎么去理解 呢？


    即得利益，就是你的分销商，帮你推荐一个用户，或者代理进入 的时候，他能获得什么？这个很关键……


    如果你说，你帮我推荐客户，等这个客户后面产生消费的时候， 我再给你提成，看似合理，但其实行不通，因为……'
