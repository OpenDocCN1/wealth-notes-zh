  md: '价值吧？


    那你就大错特错了，不管什么东西，如果你直接说价格，都会有 人感觉不值。所以在任何时候你都需要给你的产品塑造价值，把锚点 提高，然后再对比直线下降，用户就会感觉特别的便宜。


