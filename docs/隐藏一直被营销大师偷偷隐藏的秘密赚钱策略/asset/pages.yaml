  md: '一直被营销大师偷偷隐藏的秘密赚钱策略

    这本《套路之王》是卖一千块钱一本，对吗？


    所以，有一些粉丝，他知道了这本书，然后，在微信上找我聊，说那个智多星老师，我想买《套路之王》……


    他问多少钱一本，我说一千块钱，然后他说，哎呀太贵了，这个时候他为什么会觉得贵呢？


    因为，这个《套路之王》是一本书，那么人自然会把这本书跟其他书进行对比，你要知道马云的书也才卖 59 块钱，我的书架 1000 块 显然是很离谱的一个价格……


    然后，这个时候他的认知关联里面，是对传统书的一个认知，你 卖 1000 块钱肯定是贵的，你做为一个营销人，你要怎么办，你要重新 去设定他的认知 ………………………………


    那么，如何设定呢，非常简单，你说，嘿，那个这个书，如果你 把他当成一本书来看一千块钱肯定是贵的……


    .但是，如果你知道这本书里面的课程，这本书里面的内容我在线下 讲课，至少收五千块钱，这个时候你就会觉得它非常的便宜，对吗？


    但是如果你更加知道这本书帮助我赚了五百万的话，那么你就就 知道这本书的价值远远不止一千块钱……


    我通过这样设定之后，他就觉得这一千块钱非常的便宜（1000 本，每本 1000 元不到一个月就被疯抢"空"）…………………………………………'
