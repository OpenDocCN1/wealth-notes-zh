  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    案例一：一招以旧换新，7 天处理完 80 万的男裤库存


    我有一个学生，手里压了 2000 条裤子，在广州线下课的时候，问 我怎么办？我说非常简单，你回去把裤子都标价 800 元一条，然后店 门口拉横幅，做活动……


    山区捐赠日，拿任何一条旧裤子，到本店都可以直接当 400 元使 用，你听懂了吗？


    案例二：劳俣鞋如何通过“以旧换新”，长期锁定客户？


    阿英，是我的弟子，她在深圳销售“劳俣鞋”，2016 年的时候， 我给她策划了淘宝的详情页，销售量大增，与此同时，还给她设计了一个“再销”策 略，让客户穿坏了还找我买，具体怎么做的呢？


    我们在去到工地实地考察时，发现一双劳俣鞋，寿命一般在 6~8 个月，工 人是比较追求性价比的，以前坏了，再到原来的店铺购买的几率很低，因为时 间太久了……


    为了解决这个问题，我让她在“鞋耳”的内部打上红色的四个字“以旧换 新”，这样穿鞋的工人就可以经常看见，时间一久，等真的坏时，大脑就会浮 出一个信息“以旧换新”，那么……


    工人就会找到“阿英”，说怎么以旧换新呀？非常简单，旧鞋抵 30 元， 你听懂了吗？'
