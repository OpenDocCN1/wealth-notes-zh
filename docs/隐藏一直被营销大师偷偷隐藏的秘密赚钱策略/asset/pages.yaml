  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    ![](img/c557fe3fd80ef15cfe828239e0babf1d_121_0.png)


    以旧换新，在我们生活中有这样的一些产品，例如：电视机，电饭锅，空调，洗衣机什么的，我们今天就拿“电饭锅”来举例吧……


    你知道为什么商家要以旧换新吗？你第一时间会联想到什么呢？为什么那么多人都拿去换？这背后的驱动力是什么？商家这样做的目的又是什么？难道他们傻？


    这背后商家，到底隐藏了多少不为人知的秘密……


    秘决一：让你感觉占了大便宜：


    如果你家附近出现了这样的摊位，当你第一眼看到“以旧换新”的时候，你的第一条件反射是什么？……是不是感觉已经占了便宜的 感觉？你会觉得，哇！用旧的电饭锅来换新的电饭锅！大棒了，划算，回去把家里的电饭锅拿来换一个……


    你用旧的锅去把人家的新锅换回家，谁不乐意呢？是不是有一种 冲动想'
  merge: -1
  img_proc: true
- pgno: 122
  md: '换了？


    你的第一个感觉已经对商家有一个比较好的印象了，感觉商家是 对你好， 而不是只想赚你的钱，起码是赚的良心钱。你的感觉呢？


    人总是有个梦想，如果我的东西用旧了，随时可以换一个新的继 续用多好听，呵呵！


    秘诀二：让你把家里的锅拿来送给他；


    其实以旧换新目的，就是强行加速产品的死亡周期，因为现在 经济高速发展，但是有些产品本身就寿命很长，1-2 年才换一个，这 样使得这些产品的厂家很蛋疼，因为东西卖不掉……


    说真的，这一步很关键，如果你不是把旧锅拿来换，你还是不会 买的！为什么呢？因为旧锅还能用嘛（搞不好你的锅也没用多久，但人都想要更新的），可是你舍不得丢到垃圾桶吧？


    既然你家里有锅，你当然就不需要买新锅！既然这样，商家怎么 能卖掉新锅呢？所以商家就想到了，先把你家的旧锅想办法处理了！ 这招就太厉害了！因为把你家的旧锅送给商家，商家还能把锅卖给
    你！


    商家就用这种以旧锅换新锅的方法！一个旧锅抵 40 元，然后你补 价格买！你不是去换新锅，其实你上当了……


    秘诀三：你感觉不到是在卖，而是在换；'
