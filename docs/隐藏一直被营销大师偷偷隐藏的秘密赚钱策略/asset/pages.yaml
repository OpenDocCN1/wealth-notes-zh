  md: '一直被营销大师偷偷隐藏的秘密赚钱策略是分享关于认知的设定，可以看出她们要实现最终的卖货目 标，前提是先把淘宝用户转移到微信，对吗？不错……


    她们第一步就遇到了困难，她们的做法跟普通商家没有什么区 别，就是在包裹里放了一张 5 星好评返现卡，效果很一般，而我给的 建议是这样的，每个包裹里放 3 张刮刮卡，一张刮开是“谢谢参
    与”，一张刮开是“2 元”，一张刮开是“3 元”，扫描加微信，一秒 领红包，这个时候


    你猜会如何？这样的做法与之前 5 星好评的返现成本是一样的，


    但是结果却会大大不一样，为什么呢？因为……


    5 星好评返现卡，每天能见到大量，而且你有一个认知就是人人 都有的，商家发货标配，对吗？而给 3 张刮刮卡，用户会如何感受 呢？


    人类天生看到奖就会去刮，而为什么不是放一张呢？因为一张用 户会感觉一刮就中，摆明就是标配，但是如果是 3 张，并且有一张刮 开的确是“谢谢参与”，那么用户感觉真实性就会强很多，当然这里
    最重要的不是给用用户多少钱，而是用户会行动加你的微信，我之 前


