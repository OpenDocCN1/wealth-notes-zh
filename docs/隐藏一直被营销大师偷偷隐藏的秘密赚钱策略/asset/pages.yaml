  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    做实体生意，难免要做一些充值，促销，打折的活动，但是你也知道，传统的打折，满减，满送，满抵，都已让客户消费麻木了，对吗？


    接下来，我将与你分享两个变种的打折，充值，促销的策略：


    # 一、3元办卡，消费返现


    传统办会员卡的方式，通常是一次充值多少钱，然后消费打折的模式，这种模式客户充值压力较大，并且用户不清楚下次什么时候才回来消费，所以办卡率不高，而……


    有一家餐厅换了一个做法，没有损失利益的情况下，还锁定了客户的未来消费，他是怎么做的呢？


    老板让服务员，在客户吃饭的时候，告诉客户只需要微信扫码，支付3元，即可成为本店的会员，获得一张会员卡，并且本次所消费20%会存入卡中，下次可以直接当现金消费……


    你看懂了吗？其实就是变相打8折，而本次现金收入没有少，钱是下次消费才能抵扣的，但是会员会惦记着，会员卡里还有钱，下次吃饭，他会优先考虑这家店铺……


    而服务员为何会拼命推卡呢？原因很简单，每办理一张，有2元提成，所以他们会拼命推广；


    # 二、充值免费拿，现金变抵扣券'
