  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    我之前在《营销真经》的课程中说过，我们在销售产品的时候，障碍只有两个，第一个是信任问题，第二个是风险问题，即使用户已经相信你，大脑里渴望与你成交，但是依然无法做到
    0 担心、0 顾虑。


    好比，你已经确定购买一辆奔驰车，但是当销售代表让你先付 5 万的定金时，你还是希望能不能先交 1 万，其实一家 4S 店的存在，理论上我们不应该有所担心，但是内心总有某种东西在提醒你。


    其实当你的客户跟着你的脚步走了那么远了，如果在关键时刻，要成交的时候他退缩了，对于我们来说损失是巨大的，所以我们 需要一个强有力的承诺，如果你购买我的产品使用后没有达到我向你
    保证的结果，我就把你付给我的每一分钱都退送给你。


    零风险承诺，就是只要客户不喜欢，不管什么理由，我们都会把 钱退还给他，那什么是负风险承诺呢？


    负风险承诺，就是当客户不喜欢，我们花更多的钱买回来，例如 上一篇文章里讲到的魔术道具礼盒的案例，产品价格是 59 元，只要用 户不喜欢，我们花 60 元买回来。


    我知道，你有一个巨大的担心，用用户的来退怎么办？


    如果你的产品是个坑货，质量不好，你自己都不能 100%自信，我 建议你不要用，但是如果你的产品是良心货，我保证你用零风险承诺 不会增加你的售后率，因为我大量测试过，几乎没有人退货。'
