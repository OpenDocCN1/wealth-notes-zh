- pgno: 199
  md: '一直被誉为销大师偷偷隐藏的秘密赚钱策略


    通过上面两个案例，你应该大概理解了解不同的认知，给人类产生 的影响是不同的，不同的认知产生不同的行为，那么认知的设定，改 写有没有一些规律呢？


    当然是有的，由于本书篇幅的关系，我在这里与你分享认知的三个规律，如下：


    # 第一：认知有顺序；


    之前网络上一直流传的一个段子，说一个大学生，每天晚上去 KTV 上班，非常堕落，但是说到一个在 KTV 上班的小姐，白天还攻读 大学学历，人们都感觉很励志，为什么呢？


    如果你公司有几个业务员，你用以下两种方法激励，你认为哪个 效果更有动力：


    +   1、这款软件系统，每套 3000 元，卖一套提成 1000 元，加油；


    +   2、这款软件系统，每套 3000 元，这里有 1 万元，我锁在你抽屉 里，每卖一套提成 1000 元，卖出 10 套，这抽屉里的 1 万元就是你的
    了；


    你认为哪种表述，对业务员的驱动力更大？当然是第二种方式， 第一种方式业务员会这样思考，卖一套提成 1000 元，我努力卖，但是 卖不出去，我也没有什么损失，而第二种方式，是先给每个人
    1 万元，每卖一套自己从里面拿走 1000 元，如果这个月他只卖了 5 套，他们 认为他会损失 5000 元，所以他会更加卖力；'
