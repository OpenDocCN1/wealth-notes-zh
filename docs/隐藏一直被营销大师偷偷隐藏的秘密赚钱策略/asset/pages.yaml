- pgno: 132
  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    一级: 30%;


    二级: 12%;


    三级: 8%;


    这是我们比较常见的设计模式, 入会+三级分销模式, 当然这种常见的不是最佳的, 因为模式是有 BUG 的……


    BUG 一: 由于越往后, 分成越少, 所以大部分人都聚焦在直推, 而不去扶持团队长, 所以导致很快断层;


    BUG 二: 三级之后发展的人, 与我无关, 所以自然就无法形成团队概念;


    那怎么办呢? 非常简单, 我们改变一种分配方式即可, 情况如下:


    支付 99 元成为会员, 可以获得 5 盒面膜, 同时:


    一级: 10%


    二级: 10%


    三级: 10%


    推荐 50 位会员, 升级为经理, 获得团队 10%奖励;


    推荐 5 位经理, 升级优秀经理, 获得团队 15%奖励;'
