    这个策略的绝妙之处，并且我还会送你八只装的阳澄湖大闸蟹，那你试想一下，买的人会不会更多呢？


    那其实买的人得到的就是八只装的螃蟹加课程，加一本电子书，但是正向卖和反向卖它在人的认知中是完全完全不同的……


