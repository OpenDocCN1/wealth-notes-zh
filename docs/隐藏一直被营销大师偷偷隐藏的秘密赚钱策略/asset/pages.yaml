  md: '# 一直被营销大师偷偷隐藏的秘密赚钱策略


    这个客户什么时候消费，是一个未知数，如果我今天拼命给你推荐了100个客户，而没有及时的奖励刺激，第二天我可能就没有动力了，所以……


    为什么直销要报表，社交电商加入会员都需要购买一个礼包，原因是考虑即得利益，这样的话，如果每个礼包我能分到100元，那么今天我推荐10个客户，就可以立刻拿到1000元的奖励，这是非常舒服的，然后……


    什么是长远利益？就是这10个客户，未来在这个系统内的消费，都与我有关，我都有奖励可以拿，那么我当然有动力推广了，当然这样还不够……


    因为，一个正常人，直接的人脉是有限的，所以很多没有新的血液，那么赚钱也是零花钱，不可能发财，所以……


    这个时候，就多了一个设计，叫间接利益，A推荐B，B推荐C，C推荐D，而D消费，上面的ABC都有奖励，那么……


    这个时候，想象空间就被无比的放大了，三级分销就诞生了，我们来通过一个具体的产品，看看如何给他设计一个三级分销的商业模式：


