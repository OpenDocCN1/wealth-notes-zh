  md: '一直被营销大师偷偷隐藏的秘密赚钱策略


    同圈层的资源能否为你所用，那么就要看你的“社交货币”了，这里……


    讲的不是指钱，钱只是社交货币的一种，而不是全部，例如：在投资圈，我的社交货币就是“营销绝活”，在KTV，我的社交货币就是“口技+魔术”……


    社交货币，就是你在人脉社交的过程中，你有，并且对别人有价值的资源，技能，特长等等，这些统称：社交货币，如果……


    ，你没有社交货币，那么不管在什么圈层中，你对于别人来说，都是透明的，因为没有人会记住你，自然圈层资源也不会为你所用；


    .第三；信用货币；


    只要你是人，你从小到大的人际交往过的成长过程中，你都在“存钱”，这个钱不是指具体你银行账户里的，而是指：信用货币，怎么理解呢，


    你在不同人的心中，其实都有一个价钱，而这个价钱，其实就是你与他交往过程中存进去的，你随便找个朋友借下钱，就知道我在说什么了，哈哈！！


    保险公司，就把这招用到了极致，你知道为什么他们那么喜欢大量的搞培训，招募业务员吗？'
