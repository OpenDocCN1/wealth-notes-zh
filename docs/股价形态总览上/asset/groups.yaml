    ![](img/843a88de0b50d7a36e65238281a4e722_264_0.png)


    圖 10.9 盈餘報告引發的迴光返照走勢。陳小姐在反彈走勢結束之後進場放空，當收盤價向上穿越下降趨勢線，回補空頭部位。這筆交易在 1 個月之內獲利 20%。


    當公司正式宣佈盈餘報告之後，股價在兩天之內又繼續下跌 20%。陳小姐預料這支股票會發生另一波迴光返照的走勢，決定繼續持有部位。隨後一個星期內，股價向上反彈，但波動相當劇烈，然後又開始下滑。


    沿著暴跌之後的走勢高點，陳小姐繪製下降趨勢線。最後，當收盤價向上穿越下降趨勢線，她決定回補空頭部位。隔天，陳小姐買回股票，成交價格為 $12，較當天收盤價低
    1/4 點。然後，她開始計算這筆交易的收穫，每股獲利將近 $3，1 個月內的報酬率大約是 20%。


