    ## 統計數據


    表 18.2 列示頭肩底排列的一般統計數據。排列的樣本數量很恰當，在 2,500 年的日線資料中，總共有 330 個案例，包括 281 個反轉型態（85%）與
    49 個連續型態。幾乎所有的案例都發生預期中的行為（失敗率只有 5%）：價格向上突破頸線，而且出現 5% 以上的跟進漲勢。向上突破案例的平均漲幅為 38%。


