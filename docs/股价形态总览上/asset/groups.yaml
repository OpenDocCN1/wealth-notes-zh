    | 杯狀長度介於 7~65 星期是否重要？ | 不知道，所有的案例都落在這個區間內 |

    | 杯狀長度與最後漲幅之間是否存在關聯？ | 無。隨機關係 |

    | 杯子深度（12%~33%）是否有助於排列績效？ | 無。有害而侷限績效 |

    | 柄部期間長度（至少 1 星期）是否重要？ | 不知道，期間更短的柄部案例被剔除 |

    | 柄部價格趨勢朝下，對於排列績效是否重要？ | 無。有害績效 |

    | 柄部位在杯子上半部的條件是否重要？ | 是，但篩選過程中，基本上就挑選符合這個條件的對象 |

    | 柄部低點位在 200 天移動平均之上，這個條件是否重要？ | 不，對於績效沒有影響 |

    | 柄部低點距離杯口右線的距離少於 15%，這個條件是否重要？ | 不，對於績效沒有影響 |

    | 突破過程的成交量放大，這個條件對於排列績效是否重要？ | 有，但影響有限 |

    | 杯子深度與最後漲幅之間是否存在關聯？ | 無。隨機關係 |


    杯狀長度對於排列績效是否重要？我所挑選的全部案例，杯狀長度都落在 7~65 星期之內。另外，我希望知道杯子深度與排列績效之間的關聯，於是繪製兩者之間的散佈圖（scatter
    plot，譯按：類似圖 9.8），結果顯示它們不存在統計上顯著的關係。


    對於杯子深度做限制，是否能夠改善績效？設定杯子深度的限制，對於績效都會產生有害影響。把最低深度由 12%調高到 30%，最大深度由 33%調整到 55%（換言之，杯子深度介於
    30%~55%之間），失敗率與平均漲幅都有所改善，前者由 38%降低為 33%，後者由 34%上升為 36%。在我採用的未經過濾準則，沒有針對杯子深度做限制。


    我挑選的所有案例，柄部期間都至少是一個星期。所以，我不知道這個條件是否重要。


    柄部期間的價格與成交量趨勢向下傾斜，這兩個條件對於排列績效都有不利影響。剔除這兩方面的限制，失敗率會降低，平均漲幅會提高。採用過濾準則篩選的排列績效較差，主要原因就是目前這兩個條件。


    柄部低價的位置是否重要？這個問題可以由兩方面來回答。我發現，柄部低點應該保持在杯子的上半部（篩選過程中，基本上就挑選符合這個條件的對象，所以這方面的分析並不客觀），但柄部低點是否必須高於
    200 天價格移動平均，以及柄部低點由杯口右緣下跌的幅度是否應該保持在 15%之內，似乎都沒有關聯。


    突破當時的成交量是否重要？剔除這個條件，對於排列續效產生不利影響，但程度非常有限。


    歐尼爾把相關的排列區分爲帶柄杯狀與帶柄碟狀型態，兩者的差別只在於杯子深度，前一頁已經討論杯子深度與排列續效之間的關係。可是，我希望知道杯子深度與平均漲幅之間是否存在顯著的關聯。在未經篩選準則挑選的案例中，我繪製杯子深度與平均漲幅之間的散佈圖，結果顯示兩者之間只存在隨機關係。對於經過篩選的案例，散佈圖同樣顯示隨機關係，但樣本數量太小而缺乏統計意義。


    表 9.3 顯示未經過濾準則篩選排列的統計數據。關於未經過濾準則的內容，請參考表 9.1。總共篩選 391 個案例，包括 302 個連續排列，89 個反轉排列，大部分的反轉排列都失敗。整體失敗率爲
    26%，遠低於過濾準則篩選案例的失敗率 38%。如果等待向上突破之後，失敗率下降爲 10%。


    表 9.3 顯示的平均漲幅爲 38%，高於表 9.2 的對應數據 34%。最經常發生漲幅介於 10%到 20%之間。請參考圖 9.7，前三個欄位（10%、15%與
    20%）的發生次數大約相同，漲幅超過 50%的案例佔總案例的 27%，這使得平均漲幅向上扭曲。漲幅低於 15%的案例大約佔總案例的四分之一，漲幅低於 25%的案例大約佔總案例一半。次數分配提供的資料很清楚：操作帶柄杯狀排列，如果你希望取得偏高的報酬率，最好三思。根據統計數據顯示，報酬率超過
