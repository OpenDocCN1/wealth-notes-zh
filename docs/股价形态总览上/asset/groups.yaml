    # 辨識準則


    上升擴張排列具有哪些特質？為了考慮這個問題，請詳閱表 2.1 的內容，同時參照圖 2.3，這是一份上升擴張排列週線圖，整體形狀類似於一邊水平狀的喇叭。排列底部呈現水平狀，上側趨勢線朝右上方傾斜。上側趨勢線至少需要觸及兩個轉折高點。所謂的轉折高點，是指圖形上清楚可見的價格峰值，顯著不同於其他高點。下側的水平趨勢線也至少觸及兩個轉折低點。所謂的轉折低點，是指清楚可以辨識的價格谷底。這些觸及點可以協助界定價格排列的邊界。


    ![](img/843a88de0b50d7a36e65238281a4e722_67_0.png)


    圖 2.3 週線圖：趨勢線提供支撐與壓力的功能，而且延伸到未來。


    由圖形 2.3 或先前兩個走勢圖可以察覺，成交量型態缺乏規則。可是，大多數情況下，突破過程會出現大量。雖然圖 2.3 的案例沒有向下突破，但 1993 年初還是出現大量。


    所謂的提前突破（premature breakout，即是所謂的假突破 [false breakout]），是指收盤價穿越排列的邊界，但穿越之後沒有出現跟進走勢，在型態結束之前又回到排列之內。這種型態的提前突破相當罕見，應該沒有考慮的必要。


    某些上升擴張排列，初期的價格高點持續墊高，下側形成堅實的水平底部，但後期階段卻出現長達幾月的橫向盤整。最後，價格會穿越排列上緣或突破底部趨勢線。一旦突破發生之後——大多是向下突破——通常會出現回升走勢（pullback）。對於向下突破，價格經過一段跌勢之後，可能向上折返到底部趨勢線附近，這段折返走勢稱為向下突破的回升走勢。向上回升的過程中，價格雖然可能繼續上漲，但通常碰到水平趨勢線之後都會再度下挫，然後展開正式的下跌走勢。所以，回升走勢往往是投資人放空股票或加碼空頭部位的良好機會。可是，採取行動之前，最好確定回升走勢已經結束，價格又恢復跌勢。


    圖 2.3 呈現兩個共通的支撐與壓力區域，都是由趨勢線決定。首先觀察上升擴張排列的水平底部，它在二年之後繼續提供支撐的功能（1994 年底到 1995 年
    4 月份之間）。排列的上側趨勢線也是如此，這個壓力在一年之後曾經三度壓回落勢（1993 年 5 月到 10 月之間）。這個事實凸顯一項重要意涵。如果你持有某支股票，價格剛創新高，當然希望估計上檔還有多少空間。估計的方法之一，是觀察先前發生的排列（類似圖
    2.3 的情況）。過去的趨勢線往往能夠延伸到未來，繼續發揮支撐或壓力的功能。


    在圖 2.3 中，上側趨勢線雖然不能預測絕對價格高點，但透露價格壓回的可能位置。結果，這個壓力區域確實代表理想的賣出機會。


    # 失敗案例


    讓我們觀察排列失敗的案例，看看能夠得到什麼結論？圖 2.4 有兩個擴張排列，左側排列不成功，沒有向下突破，但右側排列則彌補前述的失敗。這個案例顯示一個清楚的教訓：突破經過確認之後，才可以採取行動；換言之，必須等待價格跌破下側趨勢線，才可以結束多頭部位或建立空頭部位。雖然大部分的上升擴張排列都向下突破，但失敗率還是很高（34%），不適合提早採取行動。如果在圖
    2.4 的第一個擴張排列中建立空頭部位，大約在半年之後才能開始獲利。對於稍早的圖 2.3，如果在排列低檔放空股票，就必須忍受數年的虧損。


    過早賣出股票，情況也幾乎一樣糟。在圖 2.4 中，如果你在 6 月底賣出股票，恐怕會非常後悔，因爲一直到 12 月份，股價才低於你當初的賣價。反之，如果你決定等待價格向下突破，則第一個排列不會讓你賣出股票。在第二個排列中，如果賣點設定在價格向下貫穿水平趨勢線的位置，結果也應該優於第一個排列內的任何賣價。


