    上升擴張楔形排列很少發生突破之後的回升（pullbacks）或回挫（throwbacks）走勢。由於向上突破的案例原本就不多，所以回挫只出現 2 次也就不足爲奇了。由向上突破發生，到回挫走勢完成，兩者之間只相隔
    1 個星期。其他排列向上突破的回挫期間長度大約是 10~12 天。此處的回挫期間偏短，很可能是樣本太少的緣故。


    向下突破之後的回升走勢總共發生 26 次，但發生頻率 21% 也低於其他排列的對應數據。回升走勢的期間長度為 9 天。由這些數據顯示，上升擴張楔形的回挫與回升走勢沒有操作上的參考價值。可是，如果真的發生回升走勢，一旦走勢完成而價格向下反轉，可以考慮加碼空頭部位。


    對於向下突破的案例，我觀察這些突破發生在最近 12 個月價格區間三等份的哪個位置。結果，64% 的向下突破發生在年度價格區間的上緣。這似乎有些奇怪，因爲發生在排列下端的突破竟然會出現在年度高價附近。上升擴張楔形通常發生在上升趨勢的末端，所以排列本身通常位在年度價格區間的上緣，雖然突破點位在排列下端，但還是在年度價格區間的上緣。


    另外，按照向下突破落在年度價格區間的位置（上緣、中央與下緣），我計算它們的平均跌幅。結果，突破發生在下緣的跌幅最大 25%。這個跌幅超過正常水準，但最大跌幅的突破發生在年度價格區間的下緣，這個現象應該不奇怪。其他空頭排列也呈現這種傾向。可是，這有什麼意義呢？放空股票的時機應該是股價創新低——不是新高——的時候。


    表 5.3 顯示突破發生一個星期內與突破前一天的成交量關係。如同我們預期的，突破當天的成交量很大，大約較前一天高出 65%。隨後一個星期內的成交量也很大，但缺乏穩定的型態。

