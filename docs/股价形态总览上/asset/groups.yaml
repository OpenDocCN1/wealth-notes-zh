    ![](img/843a88de0b50d7a36e65238281a4e722_278_0.png)


    圖 11.8 菱形底排列的失敗案例。菱形底完成之後，價格沒有向上反轉，卻繼續排列發生之前的下降趨勢。雙重底沒有經過確認；不是真正的雙重底。


    雙重底與菱形底都是多頭反轉排列，既然如此，價格為什麼會下跌呢？我找不到任何技術性理由足以解釋排列失敗的原因。可是，由於股價最後下跌到 $1 之下，這意味著基本面發生重大問題，這或許才是股價下跌的真正原因。


    ## 統計數據


    表 11.2 列示菱形排列的一般統計數據。由於 1991 年~1996 年基本資料庫內的菱形排列案例不多，所以我同時採納 1996 年~1999 年之間的近期資料庫。結果顯示菱形排列確實非常罕見。


    ### 表 11.2 菱形排列的一般統計數據


    | 說明 | 菱形底排列 | 菱形頂排列 |

    | :--- | :--- | :--- |

    | 排列數量： | | |

    | 1991年~1996年的 500 支股票； | 34 | 111 |

    | 1996年~1999年的 299 支股票 | 11 | 27 |

    | 反轉或整理排列 | 9 個整理， 36 個反轉 | 31 個整理， 107 個反轉 |

    | 失敗率 | 6/45 相當於 13% | 35/138 相當於 25% |

    | 成功排列的平均漲幅 / 跌幅 | 漲幅 35% | 跌幅 21% |

    | 最經常發生漲幅 / 跌幅 | 漲幅 15% | 跌幅 20% |

    | 在成功排列中，符合或超越目標價位者 | 35 個或 95% | 86 個或 79% |

    | 排列平均長度 | 1.5 個月（49 天） | 1.5 個月（52 天） |

    | 相對於突破前一天，突破當天與隨後 5 天的成交量 | 151%，174%，151% 123%，137%，139% | 152%，200%，177% 160%，160%，179%
    |


    它們大多屬於反轉型態（80% 為底部排列，78% 為頭部排列）。


    菱形頂的失敗率高於菱形底，前者為 25%，後者為 13%。失敗率超過 20% 就屬於不可靠的型態；所以，如果你打算操作菱形頂排列，必須格外謹慎。在這兩種排列中，唯有菱形頂才有
    5% 失敗的案例。換言之，向下突破之後，還沒有發生 5% 或以上的跟進跌勢，價格又向上反轉。菱形底的案例總共只有 45 個，樣本實在太小，雖然沒有發生 5%
    失敗的案例，但也不足以做成任何結論。


    底部排列完成之後的平均漲幅為 35%，最經常發生漲幅則是 15%。請參考圖 11.9，其中顯示菱形底排列漲幅的次數分配，最高欄位對應的漲幅（20%）代表最經常發生漲幅。編製這個次數分配的案例總數雖然只有
    37 個，但漲幅 20% 的欄位發生次數（27%）還是顯著超過其他欄位。如果漲幅的間距採用 5%，則最高欄位發生在 15% 漲幅的位置。所以，圖 11.9
    顯示的最高欄位雖然是 20%，但最經常發生漲幅實際上是 15%。


    ![](img/843a88de0b50d7a36e65238281a4e722_280_0.png)


    菱形頂排列完成之後的平均跌幅是 21%，最經常發生跌幅則是 20%。圖 11.10 顯示排列跌幅的次數分配狀況。頭部排列的案例較多，次數分配曲線也比較平滑。我們發現，平均跌幅與最經常發生跌幅非常接近，這意味著圖
    11.10 峰位兩側的分配非常均勻（換言之，跌幅偏高的離群值不多，不至於把平均跌幅向上拉）。


    菱形底突破的平均漲幅為 35%，低於一般多頭排列的平均漲幅 40%。反之，菱形頂突破的平均跌幅為 21%，約略等於一般空頭排列的平均跌幅 20%。


    ![](img/843a88de0b50d7a36e65238281a4e722_281_0.png)


    圖 11.10 菱形頂排列的跌幅次數分配 最經常發生跌幅為 20%。


    最低目標價位是由突破點向上或向下衡量排列高度（排列最高價減去排列最低價），計算細節請參考後文的「交易戰術」一節。底部排列幾乎能夠完全達成目標價位（達成率為
    95%），但頭部排列完成目標價位的達成率只有 79%。我認為目標價位達成率超過 80% 才屬於可靠型態。


    由排列開始到突破為止之間的期間長度，頭部與底部排列大約相同，分別為 52 天與 49 天，屬於期間較短的排列。


    表 11.3 列示菱形排列突破的相關統計數據。不論是頭部或底部排列，突破當天的成交量平均而言是前一天的 150% 左右；隨後五天的情況也大致如此（參考表 11.2）。在頭部排列中，向下突破之後有
    10 個案例沒有發生 5% 或以上的跟進跌勢，這部分的失敗率為 9%，相當不錯。至於菱形底排列，向上突破之後的跟進漲勢都超過 5%。如同前文的解釋，沒有 5%
    失敗案例，這可能是因為樣本太小的緣故。


    所以，在菱形排列中，一旦價格突破之後，通常都會出現相同方向的跟進走勢（至少是 5%），這意味著投資人應該等待突破，然後才順勢交易。


    表 11.3 的數據顯示，底部排列向上突破的發生頻率為 82%，頭部排列向下突破的發生頻率為 79%。


    底部排列向上突破之後，價格有 43% 的機會回挫到菱形邊緣；頭部排列向下突破之後，價格有 59% 的機會回升到菱形邊緣。回挫走勢讓投資人有第二個進場機會或進行加碼，回升走勢讓投資人有第二個出場機會或建立空頭部位。如果最初的判斷錯誤而市場給你第二個機會，最好接受，否則會愈來愈糟。


    ### 表 11.3 菱形排列突破的統計數據


    | 說明 | 菱形底排列 | 菱形頂排列 |

    | :--- | :--- | :--- |

    | 向上／向下突破的 5%失敗 | 0 | 10 個或 9% |

    | 向上突破 | 37 個或 82% | 29 個或 21% |

    | 向下突破 | 7 個或 16% | 109 個或 79% |

    | 水平突破 | 1 個或 2% | 0 |

    | 回挫／回升 | 16/37 或 43% | 64/109 或 59% |

    | 完成回挫／回升走勢的平均期間 | 11 天 | 11 天 |

    | 對於成功的排列，突破與最終峰位／谷底的相隔時間 | 4 個月（122 天） | 2 個月（65 天） |

    | 突破點位在最近 12 個月價格區間的下緣、中央或上緣 | 下緣 16%<br>中央 56%<br>上緣 28% | 下緣 7%<br>中央 24%<br>上緣
    69% |

    | 前遠突破位置的平均漲幅／跌幅 | 下緣 30%<br>中央 37%<br>上緣 35% | 下緣 26%<br>中央 15%<br>上緣 20% |


    不論是回挫或回升走勢，價格折返到突破點的平均時間為 11 天。請注意，此處考慮的回挫或回升走勢期間不得超過 30 天，否則視為正常的價格波動。


    對於成功的排列，由突破點衡量到最終高點（底部排列）或最終低點（頭部排列）的平均時間，分別為 122 天與 65 天。這是相當合理的現象，因為底部排列突破的平均漲幅是
    35%，頭部排列突破的平均跌幅是 21%，前者的距離較遠，自然需要耗費較多的時間。


    突破點經常落在年度價格區間三等分的哪個位置（上緣 / 中央 / 下緣）？就底部排列而言，56% 落在年度價格區間的中央。在頭部排列中，69% 落在年度價格區間的上緣。考慮這些數據，讀者或許覺得奇怪，菱形底為什麼會發生在年度價格區間的上緣（28%），菱形頂又為什麼會發生在年度價格區間下緣（7%）？


    我是根據排列發生之前的價格趨勢來定義頭部或底部，不是根據排列發生的價位。菱形底發生之前，價格處於跌勢；菱形頂發生之前，價格處於漲勢。如果你還是覺得困惑，請回頭參考圖
    11.1 與 11.2。


    按照價格趨勢來歸納排列，如此才能凸顯共通的特性。如果價格出現延伸性漲勢而進入排列（菱形頂），一旦反轉排列完成之後，價格通常會下跌。如果根據價位來歸納排列，那麼頭部排列應該發生在年度價格區間的上緣，底部排列應該發生在年度價格區間的下緣。在這種情況下，如果排列發生在年度價格區間中央，如何歸類呢？


    按照突破發生在年度價格區間的位置，我計算排列完成之後的平均漲幅與跌幅。結果，發生在年度價格區間上緣 / 中央 / 下緣的底部排列，平均漲幅分別為 35% /
    37% / 30%，差別不大。請注意，計算三個平均漲幅的樣本數量很小，分別為 9 個（上緣）、18 個（中央）與 5 個（下緣）。


    至於頭部排列，發生在年度價格區間下緣的平均跌幅最大（26%），但計算這項平均跌幅的樣本數量只有 5 個，實在沒有辦法歸納有意義的結論。計算上緣與中央平均漲幅的樣本分別為
    50 個與 17 個。


    ## 交易戰術


    表 11.4 列示菱形排列的交易戰術。衡量法則用來計算突破之後的最低目標價位。請參考圖 11.11，其中分別顯示菱形頂與菱形底的排列範例。首先，計算排列高度，這是以排列最高價（A
    點）減去排列最低價（B 點）的差距。其次，頭部排列由突破點（C 點）向下衡量排列高度，底部排列則由突破點（C 點）向上衡量排列高度，結果就是突破之後的最低目標價位。


    ### 表 11.4 菱形排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算排列最高價與最低價之間的差值，這代表排列高度。頭部排列由突破點向下衡量排列高度，底部排列由突破點向上衡量排列高度，結果就是突破之後的最低目標價位。
    |

    | 等待突破 | 最好等待收盤價突破菱形排列的趨勢線，然後才建立部位。 |

    | 風險／報酬關係 | 建立部位之前，必須考慮上檔壓力與下檔支撐，由預計進場點評估獲利潛能與潛在損失之間的關係，兩者至少應該維持 2：1 的比率。 |


    # Dow Chemical Co.（基本化工，NYSE，代碼 DOW）


    ![](img/843a88de0b50d7a36e65238281a4e722_286_0.png)


    圖 11.11 菱形頂與菱形底排列範例。計算 A 點與 B 點之間的排列高度。對於頭部排列，最低目標價位是由 C 點向下衡量排列高度。菱形排列完成之後，經常會折返排列發生之前的價格底部或頂部。圖形中標示的預期下跌與預期上漲就是衡量最低目標價位的另一種方法。5
    月底出現等腰三角形排列。


    對於菱形頂的例子，排列高度是 $7^{5} /_{8}$（＝79$^{1} /_{4}$ - 71$^{5} /_{8}$）。由 C 點（$73^{1} /_{2}$）向下衡量
    $7^{5} /_{8}$，目標價位是 $65^{7} /_{8}$。請注意，C 點是價格向下突破菱形排列趨勢線的位置。突破之後，一個星期之內就完成目標價位。


    菱形底的目標價位也是透過相同方法計算。在圖 11.11 中，菱形底的高度為 $3^{3} /_{4}$（71$^{3} /_{4}$ - 68），由 C 點（突破點
    $70^{3} /_{4}$）向上衡量排列高度，最低目標價位為 $74^{1} /_{2}$（＝70$^{3} /_{4}$ + 3$^{3} /_{4}$）。向上突破之後，三天之內就完成目標價位。


    「統計數據」一節曾經提到，底部排列的目標價位達成率為 95%，頭部排列為 79%。這兩個比率都很高，使得目標價位成為值得參考的數據。


    還有另一種衡量目標價位的方法，結果可能更精確。這種方法是觀察圓形結構，看看是否存在可供反轉的走勢。舉例來說，菱形頂經常發生在一波跳躍漲勢之後。若是如此，菱形頂完成之後，價格可能又回到跳躍漲勢的底部。


    圖 11.1 就是一個典型的例子。在菱形頂排列發生之前，價格由 $20 附近向上跳躍，一天之內就上漲 1% 點。當頭部反轉排列完成之後，價格很快又退回 $20
    附近。圖 11.11 也顯示兩個跳躍點。菱形頂排列發生之前，價格由 $68 附近展開一波跳躍漲勢。頭部排列完成之後，價格快速折返這個區域（請參考圖 11.11
    標示的「預期下跌」）。


    同樣地，在菱形底形成之前，價格突然由 $74 附近重挫（請參考圖 11.11 標示的「預期上漲」），這代表向上突破的目標價位。事實上，向上突破之後，價格在三天之內觸及這個目標價位，然後在兩個月之內始終遊於該價位之下。


    針對菱形頂或菱形底之類的價格型態進行操作，最保守的做法還是等待實際突破。雖然這個底部排列的失敗率只有 13%，但頭部排列出差錯的可能性相對較高（失敗率為 25%）。


    如果你不願意等待突破，很可能碰到「失敗案例」討論的情況，價格沒有如預期般的出現反轉走勢，反而朝排列發生之前的趨勢方向繼續發展，提前採取動作可能造成獲利減少，或蒙受重大損失。


    建立部位之前，應該是先考慮風險／報酬關係。原則上，首先判斷上檔壓力與下檔支撐，計算預期進場價位與這兩個水準之間的差距。風險／報酬比率最好維持 1:4 或更理想的關係。如果比率不足
    1:4，或許不值得承擔風險。讓我們透過一個例子來說明，請回頭參考圖 11.6。假定我們對於這支股票所拥有的資料就是圖 11.6，目前是 1993 年底，預料菱形態排列即將向上突破，我們打算進場買進。在走勢圖的左側，股價下跌到
    $6^{1} /_{2}$ 而向上反彈。這個水準可以視為目前的下檔支撐。


    如果這個排列向上突破成功的話，衡量法則計算的最低目標價位為 $14^{5} /_{8}$，這剛好也對應 8 月中旬到 10 月初的頭部價位。目前（突破前一天）的收盤價是
    $11^{13} /_{16}$，計算該價位與支撐／壓力之間的差距，結果的風險（11$^{13} /_{16}$ - 6$^{1} /_{2}$）／報酬（14$^{5}
    /_{8}$ - 11$^{13} /_{16}$）關係為 5.31:2.82。這個比率大約是 2:1，距離我們設定的 1:4 關係差太遠。如果建立這筆交易，獲利潛能只是潛在損失的一半。當然，你可以把停損設定在菱形排列底部的稍下方（例如
    $9^{3} /_{4}$）或更接近買點的位置。可是，停損設定得愈近，愈可能被正常的價格波動引發。


    ## 交易範例


    史考特最近剛由某家著名工學院畢業，立即進入一家軟體公司服務。公司的薪水不錯，但他有一大堆學費貸款與其他債務等著清償。所以，除了正常的薪水之外，他必須另外尋找財源，才能滿足目前的生活需要。他把目標設定在呈現多頭行情的股票市場。


    史考特準備在 7 月初舉辦一場舞會，在此之前需要購買一套新的音響。目前的時間已經相當緊迫，他希望儘快挑選一個具有獲利潛能的價格型態，然後進場操作。結果，他發現圖
    11.11 中的 5 月份菱形底部排列，似乎幾天之後就會向上突破。根據他的估計，一旦價格向上突破之後，應該不會再跌破 $70$ 的整數價位，這也是 1 月份數度出現的價格峰位。所以，他打算把買進部位的停損設定在
    $69 \frac{7}{8}$。


    根據推算，突破價位大約在 $70 \frac{3}{4}$，所以這個部位承擔的下檔風險只有 $0.75$，上檔獲利潛能為 $3.75$，風險 / 報酬比率為
    1 : 5，相當不錯。如果一切按照預期發展，應該可以小賺一筆，足以購買音響。


    向上突破的隔天，史考特進場買進，成交價格為 $71 \frac{1}{4}$（圖 11.11 的 C 點附近）。雖然價格稍微偏高，但根據當時的股價走勢強度判斷，這筆交易應該還是可以順利進行。他把停損單設定在
    $69 \frac{7}{8}$。三天之後，股票的收盤價為 $75$，已經超過最低目標價位。下班回家的途中，史考特繞道到音響店，想要先觸摸一下音響的按鍵與轉鈕。


    可是，情況的發展似乎開始發生問題。隔天的股價下跌將近 $3$，收盤價為 $72 \frac{1}{8}$。次一天，價格再度收低 $71 \frac{3}{8}$。又隔一天，甚至出現新的低價。突然之間，史考特發現部位已經陷入虧損，音響也即將泡湯。是否應該趕快認賠賣出股票，把舞會往後延一陣子？


    還好，股價及時回升，不久又出現 $74$ 的價位，但好景不長。價格逐漸形成等腰三角形排列，但史考特並沒有察覺。等腰三角形完成之後，價格跌破下側趨勢線（對應菱形排列右下側趨勢線的延伸）。不久，股票向上回升到三角形排列的下緣，提供另一個讓史考特能夠勉強獲利了結的機會。可是，史考特忙著準備舞會的一些瑣事，沒有注意股價的發展。6
    月中旬，他接到經紀人的電話，通知他在 $69 \frac{7}{8}$ 停損賣出。史考特只能抓抓頭，搞不清楚究竟出了什麼差錯？你可以告訴他嗎？


    # 雙重底排列


    ![](img/843a88de0b50d7a36e65238281a4e722_291_0.png)


    ## 摘要資料


    - 外觀：下降趨勢見底回升，再度下跌之後向上反轉。

    - 反轉或整理：短期的（長達3個月）多頭反轉排列。

    - 失敗率：64%。

    - 等待突破之後的失敗率：3%。

    - 平均漲幅：40%，最經常發生漲幅為20%~30%。

    - 成交量趨勢：突破之前呈現下降趨勢。

    - 回挫：68%。

    - 價格目標達成率：68%。

    - 意外發現：相隔較近的底部，漲幅較大。

    - 參閱排列：（19）複雜頭肩底排列；（22）雙角度排列。


    關於雙重底排列（double bottoms），最大的意外發現或許是失敗率偏高。所有潛在的案例中，只有三分之一屬於真正的雙重底。所謂真正的雙重底，是指第二個底部形成之後，價格上漲超過確認點（兩個谷底所夾的峰值）。如果經過確認之後，雙重底的失敗率下降為
    3%。這份研究只涵蓋經過確認的排列。


    平均漲幅為 40%，但大約有三分之一案例的漲幅不足 15%。由於某些漲幅偏低，為了彌補起見，另外三分之一案例的漲幅則超過 45%。最經常發生漲幅介於 20%
    與 30% 之間；在多頭排列之中，這個讀數屬於相對偏高者。


    回挫走勢（throwbacks）的發生頻率為 68%，讀數很高，投資人或許應該等待突破之後的拉回走勢。某些情況下，等待回挫走勢，往往可以避開一些不佳的交易。


    我們發現一個相當奇怪的現象：兩個底部相隔的距離愈近，排列的表現愈好。關於這個現象的詳細討論，請參考「統計數據」一節。


    ## 緣起


    雙重底排列的形狀究竟如何？請參考圖 12.1。價格峰位出現在 1992 年 3 月中旬。隨後三個月之內，價格持續下滑，一直到 6 月份才出現底部。


    6 月 18 日，價格創新低 $12.69$，當天出現大成交量 110 萬股。由 3 月份的高點衡量，三個月之內的股價跌幅為 47%。


