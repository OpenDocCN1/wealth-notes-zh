    15.6 標示「突破水準」的位置。如果你對於這個準則有所懷疑，請回頭參考圖 15.2。股票創新高之後的第五天，股價突然上揚而開始形成高位緊密旗形排列。價格很快又下向發展。在價格穿越排列最高價之前，大約經過一個月的時間，一個月之內可能發生很多事故！另外，圖
    15.4 的假突破可能是更好的例子。當價格穿越排列上側趨勢線，如果你在這個位置進場買進，必定發生虧損；如果等待價格穿越排列最高價，你根本不會進場。


    建立多頭部位之後，只要上漲趨勢沒有變化，就繼續持有部位。整個上漲過程通常不會呈現直線狀走勢。股價發展會交替出現整理／上漲的階梯狀走勢，請參考圖 15.6。9
    月中旬，在價格峰位爆出大量之後，股價曾經稍微回撤整理，然後才繼續上漲，並且形成高位緊密旗形排列。整理結束之後，又開始上漲，這段漲勢在 12 月份又出現整理。這種上漲／整理的階梯狀走勢持續一陣子，只要結構沒有發生根本的變化，就繼續持有多頭部位。


    ## 交易範例


    老周是一個痴漢，我這麼說完全是基於善意。當然，他非常不可靠，但永遠是個甘草人物。始終精力充沛，對什麼都很熱忱，他操作股票的方法，就像他過日子一樣的漫無頭緒。


    當他看見圖 15.6 的高位緊密旗形排列，一點也不打算浪費時間，當價格穿越排列上側的趨勢線，立即進場買進（圖形中標示 A 點的位置）。他把停損設定在當時排列下緣的
    1/8 點處（$5.5）。兩天之後，他被停損出場。


    「這裡一點，那裡一點，很快就聚少成多。」他喃喃地向我抱怨交易的經過。


    經過幾天的休息，等到股價向上穿越排列的最高價 $6½，他又再度進場買進，成交價格也剛好是 $6½。他認為旗形排列本身就代表下檔支撐，所以把停損設定在排列的底部。可是，他沒有把停損單實際下單，只採用心理停損（換言之，停損設定在腦海裡）。採用心理停損當然沒有問題，只要到時候真的願意扣動扳機的話。可是，就老周的個性來說，心理停損實在非常不可靠。


    老周時常查閱走勢圖，嘗試瞭解最近的股價發展。年底左右，股價攀升到 $8 附近，以此為底部，盤整很長一段期間。這個時候，老周把心理停損價位調高到 $7¾。


    不久，股價又向上攀升。整個走勢似乎有意忽略 1 月初與 2 月底的雙重頂排列，老周也沒有留意這個空頭型態。4 月份的時候，股價再創新高，默默宣佈先前的雙重頂排列無效。


    4 月中旬，當股價向上穿越 $13 的時候，老周開始留意了。他看見股價由 $13¼ 回檔，低點觸及 $11⅛。不久，股價又快速上漲。老周沿著最近走勢的下緣，繪製一條上升趨勢線，當價格向下貫穿趨勢線的時候，他打電話給經紀人，賣出股票。結果，成交價格是
    $13⅝，距離最高價 $15⅞ 還有一段差距，但他表示「已經夠接近了」。扣除佣金成本之後，在不足 8 個月的期間內，他獲利 108%。


    ## 跳空缺口


    ![](img/843a88de0b50d7a36e65238281a4e722_380_0.png)


    ## 摘要資料


    **外觀** 由於該時段低價高於前一時段的高價（向上跳空缺口），或該時段高價低於前一時段的低價（向下跳空缺口），價格走勢圖出現一段沒有成交價格的缺口。


    **反轉或整理** 短期（長達 3 個月）整理


    **區域、普通或型態缺口** 90% 的缺口案例，在一個星期內填補。填補的平均時間為 6 天。


    ### 上升趨勢


    | 缺口類型 | 一週內填補（%） | 填補平均期間（天） |

    | :--- | :--- | :--- |

    | 突破缺口 | 1 | 83 |

    | 連續缺口 | 11 | 70 |

    | 竭盡缺口 | 58 | 23 |


    ### 下降趨勢


    | 缺口類型 | 一週內填補（%） | 填補平均期間（天） |

    | :--- | :--- | :--- |

    | 突發缺口 | 6 | 86 |

    | 連續缺口 | 10 | 43 |

    | 耗盡缺口 | 72 | 17 |


    價格缺口總共有五種類型，本章準備討論其中四種。我們不打算討論除息缺口（ex-dividend gap），因為這種缺口很罕見，而且也沒有技術上的意義。除息缺口通常出現在公用事業類股或其他支付高股利的股票。在股票的除息日，股價必須向下調整，幅度剛好等於每股支付的股利。所以，在除息日當天，開盤價經常會向下跳空，但這種缺口很可能當天就被填補，根本看不出來曾經存在缺口。


    我所謂的填補缺口，是指價格回到缺口而完全封閉缺口。區域缺口（area gap，又稱為普通缺口 [common gap] 與型態缺口 [pattern gap]）很容易被填補，大約有
    90% 的區域缺口在 1 個星期內被填補。


    關於各種缺口的填補平均期間，請參考「摘要資料」。某些缺口很容易被填補，例如：耗盡缺口（exhaustion gap），它們發生在趨勢的末端，價格反轉之後很容易把缺口填補起來。另一些缺口比較不容易被填補，例如發生在趨勢起點的突發缺口（breakaway
    gap）。連續缺口（continuation gap）則發生在一段走勢的中間。


    ## 緣起


    就日線圖而言，向上跳空缺口是指今天的低價高於昨天的高價，兩支線形之間夾著一段沒有成交價格的缺口。同理，向下跳空缺口是指今天的高價低於昨天的低價。不論向上或向下的價格缺口，跳空走勢經常是受到某種極端力量的驅使。某些情況下，跳空缺口只代表股票價值因為分派股利而減少。其他情況下，跳空缺口的意涵很複雜。如果公司的盈餘能力全然不同於市場的預期，股價可能開盤就跳空上漲
    10% 或 15%，或跳空下跌 30%；至於缺口的大小，則取決於消息的嚴重程度。


    圖 16.1 呈現許多不同類型的缺口。區域缺口或普通缺口經常發生在橫向盤整區間，當時的交易往往很清淡，這些缺口沒有任何意義，經常很快就被填補。突破缺口發生在某個趨勢的起點。這類缺口時常出現，一般都伴隨著大成交量。連續缺口（通常稱為逃逸缺口
    [runaway gap] 或衡量缺口 [measuring gap]）比較少見，發生在一段強勁走勢的中點。這類強勁走勢本身就非常罕見，夾著連續缺口的走勢當然更少見。竭盡缺口發生在趨勢的末端，這些缺口一旦出現，通常都意味著價格即將反轉。


    ## 辨識準則


    表 16.1 列示價格缺口的辨識準則。區域缺口、普通缺口或型態缺口都是指相同類型的缺口而言。這些缺口都發生在價格整理區間之內。走勢圖經常點綴著這種勾狀缺口，通常都在一個星期內就被填補。圖
    16.2 顯示許多這類勾狀的特色。舉例來說，3 月底曾經出現一個向下跳空缺口，隔天就被填補。這種快速的勾狀走勢，就是區域缺口的特質。一般來說，區域缺口發生之後，不會立即出現新高價或新低價。


    ![](img/843a88de0b50d7a36e65238281a4e722_383_0.png)

    ![](img/843a88de0b50d7a36e65238281a4e722_383_1.png)


    圖 16.1 日線圖出現很多缺口，最常见的是區域缺口，或稱為普通缺口。


    區域缺口當天的成交量可能很大，但通常很快就萎縮下來。請參考圖 16.2 在 1 月底的情況。缺口當天爆出突兀狀成交量，但隔天立即恢復常態。


    突破缺口意味著新趨勢的開始。成交量顯著放大，價格向上（或向下）跳空之後，走勢持續上漲（或下跌），並且創新高價（或新低價）。


    ## Advanced Micro Devices, Inc. (半導體，NYSE，代碼 AMD)


    ![](img/843a88de0b50d7a36e65238281a4e722_384_0.png)


    請參考圖 16.2 發生在 1 月初的突破缺口，價格連續上漲三天，伴隨著明顯放大的成交量。然後，價格開始走平，呈現幾個星期的橫向走勢，接著出現向下跳空的區域缺口。兩天之後，又出現一個向上突破缺口（圖形上沒有標示），價格連續三天創新高。


    4 月中旬出現一個很大的缺口，同時爆出大量，這很可能是竭盡缺口，但因為跟進的漲勢非常明確（價格創新高），所以圖形內標示為突破缺口。6 月初又發生類似的情況，但方向朝下；缺口很寬，成交量顯著擴大。一般來說，缺口很大是竭盡缺口的特色，但價格在短期之內又繼續下跌，所以我在圖形內標示為突破缺口。


    ### 表 16.1 缺口的辨識特質


    | 缺口類型 | 討論 |

    | :--- | :--- |

    | 區域、普通或型態 | 發生在密集交易區（行情沒有明顯的趨勢），很快被填補。缺口當天的成交量可能很大，但隨後一、二天就恢復正常。缺口發生之後，不會出現新高價或新低價。缺口被填補而形成勾狀，這是區域缺口的特色。
    |

    | 突破 | 代表新趨勢的開始，通常藉此脫離整理區域。突破缺口當天的成交量很大，而且會持續幾天。突破缺口發生之後，通常會出現數個新高價或新低價。 |

    | 連續、衡量或逃逸 | 發生在直線狀漲勢或跌勢的中央。缺口發生之後，價格持續創新高或新低，短期之內不會填補缺口。成交量通常很大，驅動價格持續朝既有方向發展。
    |

    | 除息 | 由於股票分派股利而產生的缺口。股價必須按照分派股利而向下調整，如果當天的交易價格缺乏向上動能，就會產生除息的缺口。 |

    | 竭盡 | 發生在趨勢的末端，通常伴隨著大量。這類缺口發生之後，通常不會立即出現新高或新低，而且缺口本身可能很寬。缺口發生之後，走勢會陷入整理。這類缺口通常發生在連續缺口之後。竭盡缺口很快被填補，時間通常在一個星期之內。
    |


    連續缺口發生在趨勢的中央。這種缺口並不常見，因為它們必須發生在快速的漲勢或跌勢過程，缺口出現之後，價格繼續朝先前的方向快速發展。請參考圖 16.2，8 月份的漲勢在兩個星期內由
    $23½$ 上漲到 $32⅝$，其中出現兩個連續缺口，缺口當天的成交量雖然很大，但不特別顯著。連續缺口發生之後，價格繼續創新高，缺口在短期之內不會被填補（請對照區域缺口的情況）。當然，如果在下降趨勢中，連續缺口發生之後，價格將持續創新低價。


    竭盡缺口通常都發生在連續缺口之後。請參考圖 16.2，8 月份上升走勢最上端的缺口就是竭盡缺口。缺口發生當時，看起來像是另一個連續缺口，但缺口太寬，而且新高價發生之前經過兩天的整理。這些都是竭盡缺口的特色。當缺口發生的時候，如果某個趨勢已經發展一段期間，而且缺口寬度又特別大，通常是竭盡缺口。圖
    16.2 有兩個竭盡缺口，分別發生於 8 月份與 9 月份。9 月份的缺口很快被填補，這也是竭盡缺口的特色之一。


    竭盡缺口通常伴隨著大量，這是趨勢即將反轉的徵兆，就像油燈將滅之前展現的最燦爛光芒。圖 16.2 的兩個竭盡缺口成交量都很大，尤其是 9 月份的缺口。即使是向下跳空的缺口，仍然爆出巨量，成交量雖然立即縮小，但隨後幾天還是超過正常水準。大成交量代表買、賣雙方的看法相當紛歧——持股者因為價格大跌而急著出場，但很多投資人希望逢低買進。


    ### 統計數據：區域缺口


    表 16.2 列示區域缺口的統計數據。此處只考慮 25 支股票，因為我發現這類缺口的案例實在太多（5 年期間共有 174 個區域缺口）。由於這類缺口沒有太大的意義，所以我忽略某些統計數據。在所有
    174 個缺口中，98% 在一年之內被填補，在一星期內被填補的案例佔 90%。區域缺口被填補的平均期間很短，只有 6 天。


    表 16.2 區域缺口的統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：1991 年~1996 年的 25 支股票 | 174 個 |

    | 一年內填補的缺口數量 | 171/174 或 98% |

    | 填補缺口的平均期間 | 6 天 |

    | 一星期內填補的百分率 | 90% |

    | 缺口當天與隨後五天的成交量（相對於 25 天移動平均） | 135%, 90%, 89%, 96%, 87%, 86% |


    由於缺口只存在於單一線形，時間非常短，所以我決定比較成交量與其 25 天移動平均。發生缺口的當天，成交量是平均量的 135%，隨後五天的成交量都低於平均水準。這反映一項事實：區域缺口當天的成交量很大，然後成交量迅速萎縮。成交量型態乃是辨識區域缺口的最重要特色之一。


    ### 統計數據：突破缺口


    表 16.3 顯示突破缺口的統計數據。突破缺口可能是最重要的缺口類型。我在 50 支股票的 5 年走勢中找到 199 個案例，樣本數量遠超過抽樣理論的需要。由於突破缺口通常發生在趨勢的起點附近，向上與向下跳空缺口的平均漲幅與跌幅分別為
    25% 與 20%——對於缺口來說，屬於相當可觀的幅度。最經常發生漲幅與跌幅分別為 10%~20% 與 10%~15%。關於最經常發生漲幅或跌幅的數據，我是採用突破缺口實際漲幅（或跌幅）編製次數分配圖形，發生次數最高欄位的漲幅（或跌幅）就代表最經常發生漲幅（或跌幅）。這種處理方法可以避免平均數受到偏高漲幅（或跌幅）離群值的向上扭曲。當你進行某筆交易，最經常發生漲幅或跌幅比較能夠代表預期績效。


    表 16.3 突破缺口的統計數據


    | 說明 | 上升趨勢 | 下降趨勢 |

    | :--- | :--- | :--- |

    | 排列數量：1991 年~1996 年的 50 支股票 | 98 個 | 101 個 |

    | 平均漲幅/跌幅 | 25% | 20% |

    | 最經常發生漲幅/跌幅 | 10%~20% | 10%~15% |

    | 到達最終高價/低價的天數 | 77 天 | 52 天 |

    | 缺口位在最近 12 個月價格區間的下緣、中央或上緣 | 下緣 21% 中央 27% 上緣 52% | 下緣 23% 中央 29% 上緣 48% |

    | 前述缺口位置的平均漲幅/跌幅 | 下緣 26% 中央 31% 上緣 24% | 下緣 25% 中央 18% 上緣 19% |

    | 一年內填補的缺口數量 | 74/98 或 76% | 67/101 或 66% |

    | 填補缺口的平均期間 | 83 天 | 86 天 |

    | 一星期內填補的百分率 | 1% | 6% |

    | 缺口當天與隨後五天的成交量 (相對於 25 天移動平均) | 197%, 144%, 133%, 139%, 120%, 143% | 260%, 183%,
    156%, 139%, 126%, 113% |


    由向上（向下）跳空缺口發生，衡量到最終高點（低點）的平均期間為 77 天（52 天）。期間很短暫，這意味著突破缺口的操作，手腳需要非常俐落。


    把最近 12 個月的價格區間劃分為三等份（下緣／中央／上緣），考慮缺口最可能發生在哪一部分。大部分的突破缺口發生在年度價格區間的上緣，包括向下跌空缺口也是如此。分別考慮突破缺口發生在這三個位置的平均績效，結果顯示績效最高的向上升空缺口發生在年度價格區間的中央，平均漲幅為
    31%；績效最高的向下跳空缺口則發生在年度價格區間的下緣，平均跌幅為 25%。


    突破缺口在 1 年之內被填補的百分率，向上跳空為 76%，向下跌空為 66%。不論向上或向下跌空，突破缺口被填補的平均期間大約是 3 個月。突破缺口在 1
    年內被填補的數量可能低估，因為某些缺口案例發生在 1991~1996 年期間結束的最後一年之內。這些缺口部分被填補，有些在研究期間結束還沒有被填補，前述的統計數據並沒有繼續追蹤這些缺口，也沒有考慮它們是否在
    1 年內被填補。


    突破缺口在 1 星期之內被填補的案例，只有 1%（向上升空）與 6%（向下跌空）。讀者對於這個結果應該不覺得意外，因為突破缺口通常都發生在趨勢起點，隨後的價格走勢會持續上漲或下跌，立即反轉的可能性不高。請注意，突破缺口發生之後，平均漲幅為
    25%，平均跌幅為 20%，這意味著價格需要經過一段相當漫長的走勢才能填補缺口——大多數缺口所需要的時間都超過 1 個星期。


    由表 16.3 的最後一列數據顯示，突破缺口發生當天的成交量大約是平均量的兩倍，隨後 5 天仍然維持大量。大成交量是辨識突破缺口的關鍵線索；所以，如果對於缺口類型產生任何疑惑，請留意觀察成交量型態。


    ### 統計數據：連續缺口


    表 16.4 顯示連續缺口的統計數據。連續缺口屬於相對罕見的缺口類型，在 100 支股票的 5 年走勢內，總共只發生 160 個案例。連續缺口的最重要特質，或許是缺口位置通常發生在一段趨勢的中點。所以，連續缺口的平均漲幅（11%）或跌幅（11%）大約是突破缺口的一半（漲幅
    25% 與跌幅 20%）。


    向上或向下跳空的連續缺口，最經常發生漲幅與跌幅都是 10%。同樣地，此處也是利用績效的次數分配，藉以避免平均數受到極端離群值的扭曲。


    向上跳空缺口距離趨勢高點的平均天數為 14 天，向下跳空缺口距離趨勢低點的平均天數為 11 天，這與突破缺口的情況相差頗多。就這方面的數據來說，讀者或許認為連續缺口讀數是突破缺口讀數的一半，因為突破缺口發生在趨勢起點附近，連續缺口發生在趨勢的中點。可是，表
    16.4 考慮連續缺口距離趨勢高點或低點——不是最終高點或低點——的平均天數，因為我希望知道連續缺口是否位在一段趨勢的中點。


