    ## 辨識準則


    表 3.1 列示下降直角三角形擴張排列的辨識準則。排列的形状類似於上側水平狀的喇叭。價格上漲到特定價位而拉回，構成上側趨勢線；下跌走勢則呈現持續下降的底部，銜接為向下傾斜的下側趨勢線。不論頭部或底部，趨勢線都至少必須由兩個轉折點銜接而成。由於擴張排列需要很長的醞釀時間，所以趨勢線通常都由兩個以上的觸及點構成。


    這個排列缺乏穩定的成交量型態。有些情況類似三角形排列，成交量在排列過程中逐漸萎縮，然後爆量突破。另一些情況下，成交量逐漸放大而展開突破。第一種情況的發生頻率高於第二種，比率分別爲
    53%與 47%。可是，由於兩個數據非常接近，所以成交量型態沒有重要參考價值。


    部分漲勢（參考圖 3.3）或部分跌勢經常可以顯示隨後突破的方向。一旦部分漲勢（或跌勢）發生反轉之後，通常會直接——換言之，不會在排列內繼續發生轉折——向下（或向上突破）。在我們考慮的案例中，部分跌勢發生的頻率高於部分漲勢，比率分別為
    78%與 58%（請參考「統計數據」一節）。


    趨勢線向未來延伸幾個月（甚至幾年），仍然可以扮演往後走勢的支撐或壓力（究竟是支撐或壓力，則取決於價格由哪個方向接近延伸趨勢線；相關案例請參考圖 3.1、3.3
    與 3.7）。


    ### 表 3.1 下降直角三角形擴張排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 形狀 | 稍微下傾的喇叭狀，但排列頭部為水平狀，下側趨勢線朝右下方傾斜。 |

    | 頭部水平壓力線 | 銜接頭部成為水平狀壓力線。至少需要兩個顯著的觸及點（轉折高點）才能銜接一條趨勢線。 |

    | 底部向下傾斜趨勢線 | 持續下滑的底部銜接為一條向下傾斜的趨勢線。至少需要兩個顯著的轉折低點才能銜接一條趨勢線。 |

    | 成交量 | 不規則，缺乏穩定的型態。 |

    | 提前突破 | 非常罕見。收盤價突破趨勢線，通常就是真正的突破。 |

    | 突破 | 價格可能朝上或朝下突破，通常伴隨大量，但成交量很快就恢復正常。 |

    | 部分漲勢或跌勢 | 在明確的排列型態內，價格朝上反彈或朝下拉回，但不能實際觸及上側或下側趨勢線，隨後通常會朝相反方向進行突破。 |

    | 支撐與壓力 | 兩條趨勢線的延伸，偶爾會繼續發揮支撐與壓力功能。 |


    ## 失敗案例


    由於下降擴張排列可能向上或向下突破，所以我們考慮兩種失敗的情況。圖 3.4 的例子在 11 月底出現一波具有預示意義的部分跌勢。部分跌勢結束之後，價格向上彈升，最後貫穿上側趨勢線。當收盤價穿越趨勢線之後，不久就出現向上突破之後的回挫走勢。在正常的情況下，價格在回挫走勢中會重新測試排列的突破位置，或是觸及上側趨勢線，或是重新進入排列，但應該只停留在排列三等份的上緣；測試完畢之後，價格繼續上漲。可是，在目前這個例子中，價格在$45
    被壓回，回挫走勢折返到排列的中央位置。回挫走勢結束之後，價格一度向上彈升，但觸及原先的上側趨勢線之後，就展開持續性下跌。


    如果你在向上突破之後進場，買進價格大約在$44½附近，但突破失敗的低價為$36 7/8。即使你把停損設定在排列最低點的下側，恐怕也只能在$39 出場，損失還是很慘重。可是，在突破確定失敗之後，如果繼續持有股票（不建議這麼做），最後的獲利相當豐厚。圖
    3.4 最右端跌勢的低點發生在 4 月份的$36 7/8（圖形沒有顯示），這個價格實際上也是未來兩年的最低價。1993 年 11 月初，這支股票在$60 附近創峰位。


