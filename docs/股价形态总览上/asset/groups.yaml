    突破當天的成交量明顯放大（是突破前一天的 191%），然後逐漸縮小。


    小量突破是否比較容易發生回升走勢？沒有證據顯示如此。小量突破發生回升走勢的案例佔 65%，大量突破發生回升走勢的比率爲 67%。


    我把大量突破定義爲突破量超過突破前一天成交量的 150%，把小量突破定義爲突破量低於突破前一天成交量的 75%。如果小量突破的定義門檻由 75% 降低爲 50%，則只有
    62% 的小量突破發生回升走勢。在這種情況下，或許可以歸納出一個結論：大量突破比較容易發生回升走勢。這是合理的現象，因爲當股價向下突破的時候，如果大部分持股者都賣出股票，稍後買盤比較容易推升股價，因爲上檔沒有賣壓。


    大量突破的案例，平均跌幅是否較大？沒錯，而且這個結論具有統計上的顯著意義。大量突破案例的平均跌幅為 21%，小量突破排列的平均跌幅為 15%。


    ## 交易戰術


    ### 表 13.5 雙重頂排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算排列最高點與最低點之間的高度，由突破點（亦即是確認點，也是兩個峰位所夾谷底的最底价）向下衡量排列高度，結果就是最低目標價位。這個目標價位的達成率為
    39%；如果取排列的一半高度衡量目標價位，達成率提高為 70%。 |

    | 不要交易 | 最經常發生涨跌幅只是 10% 到 15% 之間，謹慎考慮是否值得賣出持股？如果決定賣出，則在第二個峰位附近賣出，如果股價重新向上穿越峰位，立即買回股票（因爲股價恢復上升趨勢）。
    |

    | 峰位接近 | 挑選峰位間距不大的對象（例如：60 天），這類排列的績效通常比較理想。 |

    | 谷底很深 | 爲了提高操作績效，兩個峰位所夾谷底的深度應該稍深，在 15% 或以上。 |

    | 等待突破 | 第二個峰位完成之後，大約有 65% 的案例會向上突破峰位，如果準備針對向下突破進行交易，最好等待收盤價跌破確認點之後再採取行動。收盤價跌破確認點之後，股價至少繼續下跌
    5% 的機率有 83%。 |

    | 等待回挫 | 向下突破之後，三分之二的排列會回升到突破點附近。所以，可以等待回升走勢結束而價格重新下跌。 |


    表 13.5 建議一些可供運用的交易戰術。首先討論衡量法則，這是估計股價向下突破之後的最低目標價位。關於衡量法則如何運用在雙重頂排列，請參考圖 13.9 的例子。雙重頂排列發生之前，股價由$9$\text{1/4}上漲到$15$\text{1/8}（圖形沒有顯示），然後形成頭部型態。就這方面來說，圖
    13.9 的排列有些異常，因爲在第一個峰位發生之前的兩個月，曾經出現更高的價位。雖說如此，但投資人如果還是準備操作這個排列，首先必須估計獲利潛能，這也是運用衡量法則的目的所在。


    首先，計算排列高度，把排列最高價減去最低價。排列最高價是第一個峰位的$14$\text{3/8}，最低價是兩個峰位所夾谷底的確認點$12$\text{1/8}，排列高度是
    2\text{1/4}點。由確認點（$12$\text{1/8}）向下衡量排列高度；最低目標價位是$9$\text{7/8}。目標價位完成於 3 月底。


    前述衡量法則的目標價位達成率只有 39%，這意味著只有三分之一的排列能夠滿足目標價位，所以我們或許應該考慮另一個比較保守的衡量方法：排列的一半高度。這種情況下，目標價位達成率可以提高到
    70%。對於圖 13.9 而言，如果採用排列的一半高度（$1$\text{1/8}），目標價位為$11（=12$\text{1/8}$-1$\text{1/8}）。這個目標在突破當天就完成了。


    ![](img/843a88de0b50d7a36e65238281a4e722_334_0.png)


    **圖 13.9** 衡量雙重頂排列的目標價位。一旦回升走勢結束而價格重新向下反轉，進場建立空頭部位。


    進行一筆交易之前，最好還是察明基本面的情況。大多數的雙重頂排列都發生在基本面轉差的環境下。不幸地，不論是媒體的相關報導，或是經紀商提供的研究分析報告，在情況發生變化的關鍵期間，資料往往最不可靠。在股價頭部附近，經紀商經常調高公司的投資建議等級或盈餘預測。這不能完全歸咎於經紀商，因為盈餘預測原本就是非常困難的工作，而且經紀商本身的判斷也可能受到市場樂觀氣氛的影響。


    對於任何一笔交易，你都應該嘗試理解股價走勢呈現某種型態的真正理由。這方面的理解對於雙重頂尤其重要，因為這種排列的最經常發生跌幅很有限（只不過是 10%到 15%之間）。如果你發現公司的基本面確實轉差，或許就更有理由與信心操作雙重頂排列。


    雙重頂排列的統計績效既然很差，爲什麼還要冒險操作呢？如果你決定不操作這種排列，或許是明智的抉擇；第二個峰位出現之後，股價可能繼續創新高——尤其是在多頭市場的環境之下。潛在雙重頂演變爲真正雙重頂的機會，大約只有三分之一。某些情況下，雙重頂排列確實可能出現重大的跌勢，但根據圖
    13.6 的數據顯示，跌幅超過 50% 的案例只佔 4%（379 個排列的 17 個）。當然，30% 的跌幅也非同小可（發生的機會爲 28%）。


    面對雙重頂排列，爲了提高操作績效，可以考慮在第二個峰位出現之後立即賣出股票。大多數情況下，股價可能反彈而重新穿越峰位。若是如此，可以買回股票。反之，如果第二個峰位出現之後，股價直接跌破確認點，那股票就賣在最理想的價位。


    如同前文提到的，表現比較理想的雙重頂，經常是那些峰位間距很近，而且所夾谷底很深的案例。圖 13.9 就是這類例子。兩個峰位相隔 35 天，中間的谷底爲 16%（由最高峰位向下衡量的跌幅），最低目標價位在確認點（$12^{1/8}$）下方的
    2 1/4 點處，由突破位置衡量的目標跌幅爲 19%，似乎值得操作。


    如何拿捏交易的時間呢？唯有當收盤價跌破確認點，雙重頂才算完成（經過確認）。對於圖 13.9 的案例，1994 年 1 月底的盤中價格曾經向下穿越確認線，這並不視爲突破，因爲當天的收盤價格沒有跌破確認點。2
    月 2 日，收盤價才夾著大量穿越確認線。


    向下突破之後，價格經常會回升到突破點附近，這類走勢的發生頻率爲 69%；所以，進場點或許應該定在回升走勢結束。請參考圖 13.9，正式跌破確認點之後，第三天的價格收高，隨後三天的走勢繼續回升，然後盤整於突破點附近。一旦價格又開始下跌，才賣出或放空股票。


    ### 交易範例


    潘小姐是某家大型共同基金公司的執行秘書，非常聰明，人長得又漂亮，經常與基金經理人約會。這段日子裡，她聽到一些投資消息，也學會一些專業術語。最重要者，她與這些人始終保持很好的關係，他們隨時都願意幫忙。


    當她看見圖 13.9 的機會，就徵詢這些朋友，這支股票是否適合放空。得到他們的鼓勵，並且自行研究之後，她決定進場放空，時間是 3 月 8 日，成交價位為$12。不久之後，股價開始下跌，很快就滿足下檔目標價位。可是，由於走勢相當疲軟，潘小姐覺得沒有必要急著回補。


    3 月 31 日，情況發生變化，當天的價格收高。由於她都是在收盤之後才評估市場行情與個股走勢，所以當天來不及採取行動，只能等待隔天開盤。隔天，價格又恢復跌勢，所以她決定多等一天。


    當價格又向上飆升的時候，她決定回補，成交價格為$9。扣除佣金之後，每股獲利將近$3，三個星期的報酬率爲 25%。如果她繼續持有空頭部位，獲利原本可以更高。這支股票經過三個月的橫向盤整，最後又展開跌勢，再創低價$6\frac{1}{8}。


    ## 旗形與三角旗形


    ![](img/843a88de0b50d7a36e65238281a4e722_337_0.png)

    ![](img/843a88de0b50d7a36e65238281a4e722_337_1.png)


    ### 摘要資料


    #### 旗形

    - **外觀**：由兩條平行趨勢線界定的傾斜矩形狀。

    - **反轉或整理**：短期的（長達 3 個月）整理排列。

    - **上升趨勢失敗率**：13%。

    - **下降趨勢失敗率**：12%。

    - **上升趨勢平均漲幅**：19%，最經常發生報酬率 20%。

    - **下降趨勢平均跌幅**：17%，最經常發生報酬率 15%。

    - **成交量趨勢**：下降。

    - **回升**：20%。

    - **回挫**：10%。

    - **上升趨勢價格目標達成率**：63%。

    - **下降趨勢價格目標達成率**：61%。

    - **參閱排列**：（32）矩形成排列，（33）矩形頂排列。


    #### 三角旗形

    - **外觀**：由收斂趨勢線界定的傾斜三角形排列。

    - **反轉或整理**：短期的 (長達 3 個月) 整理排列。

    - **上升趨勢失敗率**：19% 。

    - **下降趨勢失敗率**：34% 。

    - **上升趨勢平均漲幅**：21% , 最經常發生報酬率 15% ~ 20% 。

    - **下降趨勢平均跌幅**：17% , 最經常發生報酬率 25% 。

    - **成交量趨勢**：下降。

    - **回升**：17% 。

    - **回挫**：16% 。

    - **上升趨勢價格目標達成率**：58% 。

    - **下降趨勢價格目標達成率**：52%。

    - **參閱排列**：(40) 等腰三角形底部排列, (41) 等腰三角形頭部排列, (44) 下降楔形排列, (45) 上升楔形排列。


    旗形 (flags) 與三角旗形 (pennants) 看起來很相像, 行爲也頗為類似。這些排列的期間通常很短, 可能幾天之內就完成, 很少超過 3 個星期,
    通常發生在一段快速走勢的中央位置。旗形與三角旗形具有短線投資價值, 但手腳必須俐落, 才能充分掌握走勢。三角旗形在下降趨勢中的失敗率高達 34%, 遠超過我所能夠接受的最高門檻
    20%。除此之外, 上升趨勢的三角旗形與上升 / 下降趨勢的旗形排列, 失敗率都還不錯, 分別為 19% 與 13% / 12%。


    不論旗形或三角旗形，目標價位達成率都不甚理想，介於 52%到 63%之間，距離我認為可靠型態的 80%門檻差很遠。所以，當你操作這些排列的時候，對於傳統目標價位的預期不可過高。


    這些排列的最經常發生漲幅（跌幅）不甚可靠，讀數高於平均漲幅（跌幅）。在次數分配圖中，這意味著某個欄位的發生次數雖然最多，但該欄位之前的各欄位發生次數總和很大，使得平均值向下扭曲。


    ### 緣起


    圖 14.1 是一個典型的旗形排列範例。排列由兩條平行趨勢線界定，期間少於 3 個星期（甚至可能是幾天而已）。這些排列通常都發生在快速的上升或下降走勢過程中（類似圖
    14.1 的情況），位置通常是在該走勢的中央附近。一般來說，排列整理方向與趨勢方向相反；換言之，如果旗形或三角旗形發生在下降趨勢內，排列的整理方向朝上（參考圖
    14.1 的例子）；反之，上升趨勢內的排列整理方向朝下（參考圖 14.4 的例子）。當然，前述的現象只代表一般狀況，某些旗形或三角旗形的整理方向也可能呈現水平狀，甚至與當時的趨勢方向相同。


    旗形排列內的成交量型態，通常呈現下降趨勢。這種傾向相當顯著，詳細數據請參考「統計數據」一節。


    ### Advanced Micro Devices, Inc.（半導體，NYSE，代碼 AMD）


    ![](img/843a88de0b50d7a36e65238281a4e722_340_0.png)


    **圖 14.1** 旗形排列，由兩條平行趨勢線界定，成交量通常呈現下降趨勢。


    圖 14.2 顯示三角旗形的例子。就外觀來說，三角旗形與旗形的唯一差別只在於排列界定的趨勢線：三角旗形的兩條趨勢線相互收斂（換言之，兩條趨勢線向右延伸將會彼此相交）。所以，三角旗形的形狀相當於是小一号的楔形。如同前述的說明，三角旗形的傾斜方向與當時趨勢方向經常相反；下降趨勢的三角旗形朝上，上升趨勢的三角旗形朝下。


    三角旗形的成交量型態也是呈現下降趨勢，這點與旗形排列相同，但發生的頻率更為普遍。幾乎所有的三角旗形案例（90%）都存在這種現象。


