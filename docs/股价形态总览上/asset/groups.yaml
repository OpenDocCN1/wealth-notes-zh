    如果擴張頂向上突破的位置發生在年度價格區間的上線，平均漲幅為 35%；如果突破位置發生在年度價格區間的中央，平均漲幅為 24%。對於向下突破，不論突破點位在年度價格區間的哪個位置，平均跌幅都差不多是
    22%（只有中央位置為 24%）。


