    ### 摘要資料


    - **外觀** 價格沿著兩條向下傾斜的趨勢線發展。兩條趨勢線向外發散。

    - **反轉或整理** 長期的（超過 6 個月）多頭整理排列。

    - **失敗率** 37%。

    - **平均漲幅** 46%，最經常發生漲幅為 20%。

    - **成交量趨勢** 通常隨著時間經過而增加。

    - **回挫** 向上突破有 40% 發生回挫走勢。

    - **價格目標達成率** 81%。

    - **意外發現** 排列末端出現部分跌勢，向上突破的可能性為 76%。


    實在非常意外！當初，我以為這個排列的行為應該類似於下降楔形（falling wedge），結果並非如此。下降楔形屬於反轉型態，但下降擴張楔形（descending
    broadening wedge）屬於整理型態，完成之後繼續先前的價格趨勢。成交量型態也不同於下降楔形。下降擴張楔形的成交量隨著時間經過而增加，但下降楔形則呈現減少的趨勢。


    觀察資料庫內的個股走勢，我發現這種排列通常發生在上升趨勢的末端。在排列的發展過程中，整體價格趨勢朝下，在幾個月之內構成擴張楔形，然後價格向上突破，又回到排列出現之前的方向：朝上。這是一個典型的趨勢整理連續型態。


    如何衡量這個排列的失敗率呢？因為下降擴張楔形屬於連續型態，如果發生趨勢反轉的走勢，就屬於失敗案例。另外，如果連續型態完成（突破）之後，沒有出現 5% 或以上的跟進走勢，也視為失敗。這兩種情況造成
    37% 的失敗率，超過可靠排列所能夠接受的最高水準 20%。


    這種多頭整理排列的平均漲幅高達 46%。最經常發生漲幅為 20%，另外有高達 40% 的案例呈現 50% 以上的漲幅！由於這些數據顯著偏高，所以失敗率稍微偏低似乎也可以接受。


    由於這種排列完成之後的上漲動能十足，所以目標價位的達成狀況也非常理想。不同於上升擴張楔形，目前這個型態是由突破點向上衡量排列高度作為目標價位。下降擴張楔形向上突破之後，80%
    以上的案例達成目標價位。


    所有的擴張排列都有一種算不上意外的意外發現：部分跌勢。價格由上側趨勢線下跌，還沒有觸及或靠近下側趨勢線之前就向上反擊；在這種情況下，價格有 76% 的機會直接向上突破。


    ## 緣起


    這種排列的形状如何呢？圖 6.1 提供一個下降擴張楔形的範例。這支股票起漲於 1994 年 6 月，一年之後的 8 月份形成頭部。9 月份期間，股價拉回，呈現上下擺動的重整，隨著時間經過而構成擴張型態。一個月之後，銜接轉折高點與低點的兩條趨勢線，凸顯出可能的楔形排列。


    排列最初的成交量遠低於正常水準。成交量型態雖然不規則，但隨著時間經過，隱約有逐漸放大的傾向。計算成交量迴歸直線的斜率，也確認前述的結論：斜率為正數（向上傾斜），意味著成交量逐漸擴大。


    10 月中旬，價格透過跳空缺口直接向上穿越趨勢線，當時的成交量巨幅放大，而且隨後幾天也是夾著大量繼續上漲。


    仔細觀察圖 6.1，我們發現價格走勢的發展呈現三個階段：第一階段是由 1994 年 6 月到 1995 年 8 月之間的長期多頭行情，然後出現第二階段的 2
    個月期向下整理，接著又向上突破繼續攀升（第三階段）。所以，圖 6.1 的擴張排列代表上升趨勢的重整（連續）型態。整體而言，擴張排列是波段上升走勢的修正。


    ## Cognex（精密儀器，NASDAQ，代碼 CGNX）


    ![](img/843a88de0b50d7a36e65238281a4e722_152_0.png)


    圖 6.1 下降擴張楔形是上升趨勢的整理排列。界定價格行為的兩條趨勢線向下傾斜，而且向外擴張（發散）。成交量通常隨著時間經過而增加。


    不同於圖 6.1，圖 6.2 的下降擴張楔形扮演中期下降趨勢的反轉型態。價格漲勢在 1992 年 5 月出現峰位，然後向下反轉。8 月份期間，價格持續下跌，但擺動幅度擴大。9
    月中旬，下降擴張楔形逐漸成形。


    擴張排列的初期，成交量很低，偶爾會出現大量。9 月份開始，成交量逐漸放大，但型態顯得更不規則。10 月初，在價格向上突破之前的最後一波漲勢中，成交量明顯萎縮。向上突破的過程中，成交量並沒有放大，然後價格持續走高。向上突破代表中期趨勢可能反轉。


