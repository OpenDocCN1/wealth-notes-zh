    在向上突破的案例當中，47% 出現回挫走勢，發生的頻繁程度還不足以據此擬定任何操作戰術。如果你發現高位緊密旗形向上突破之後發生回挫走勢，就應該等待回挫走勢完成。你應該等待回挫走勢停頓，而且價格向上反轉，然後才進場買進，否則回挫走勢可能繼續走低。完成回挫走勢的平均期間長度為
    11 天，大約是本書排列的平均水準。


    價格向上突破旗形排列之後，到達最終高價的期間很短，平均只需要 2 個月（70 天）。排列出現之前，曾經發生 2 個月的快速走勢，經過幾天到幾個星期的整理之後，又恢復上升趨勢。所以，高位緊密旗形就如同一般旗形或三角旗形一樣，都是飄揚在旗桿的中央——之前與之後都發生
    2 個月的漲勢。


    大部分案例都發生在年度價格區間三等份的上緣（佔 92%），極少部分發生在年度區間的中央。另外，發生在上緣的排列平均漲幅為 70%，遠高於發生在年度價格區間中央的案例（平均漲幅為
    34%）。請注意，沒有任何案例落在年度價格區間的下緣。


