    可是，某些情況下，旗形排列本身呈現不規則狀，很難由趨勢線界定，突破的位置也不明確，所以我把排列最高點視為突破點。這可能會對統計數據造成一些偏頗的影響，但如果遇到不可避免的情況，還是保守一點。


