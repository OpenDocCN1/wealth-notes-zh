    同樣地，我觀察兩肩谷底的高度，希望驗證傳統的看法：右肩較高，意味著排列的漲幅較大。可是，實際的情況並非如此。右肩較高案例的平均漲幅為 36%，左肩較高案例的平均漲幅為
    41%。


    請注意，關於頸線傾斜方向與兩肩高度對於排列漲幅的影響，前述結論都不具備統計上的顯著意義。換言之，前述的結論可能純屬巧合。


    表 18.3 列示突破相關的統計數據。幾乎所有的頭肩底排列都向上突破（98%），總共只有 8 個案例向下突破。在向上突破的案例中，總共有 10 個排列沒有發生
    5% 以上的跟進漲勢。


    排列向上突破之後，價格回挫到頸線的案例佔 52%。這意味著突破之後的漲勢可能發生躊躇不前的情況。完成回挫走勢的平均期間為 11 天，類似於大多數其他排列。


    突破過程的成交量偏低，是否比較容易發生回挫走勢？沒有證據顯示如此。我比較突破當天與前一天的成交量，如果


