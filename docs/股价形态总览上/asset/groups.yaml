    Bethlehem Steel Corp.（綜合鋼鐵，NYSE，代碼 BS）


    ![](img/843a88de0b50d7a36e65238281a4e722_175_0.png)


    圖 7.2 蹦跳-奔馳底部反轉排列的不同部分。前奏階段的價格呈現細長區間，然後暴跌進入蹦跳階段，股價緩步上升，最後向上奔馳而創新高價。


    趨勢線也沒有用，各種用途都採用前奏階段的 30 度趨勢線）。蹦跳階段初期，成交量顯著放大，但賣壓明顯超過買進力道，投資人最後終於知道其中緣故：公司本身發生問題。隨著精明資金與动能玩家持續離場，股價也繼續下跌。


    慢慢地，下跌壓力逐漸舒解，股價甚至緩步向上攀升，形成圓弧狀的走勢，觸及原先的 30 度趨勢線。在這條趨勢線附近，價格可能稍做停頓，經過數度嘗試才突破，但也可能直接貫穿。向上突破之後，大約有三分之一的案例會出現回挫走勢（throwback），股價折返趨勢線附近稍做整理，然後才繼續上漲。


    價格向上突破而呈現快速上漲，成交量也會隨之放大。向上奔馳階段的特色是價格漲勢。在3個月之內，大約有半數案例會出現最終高點，並且向下反轉。


    # 失敗案例


    圖 7.3 顯示蹦跳-奔馳底部反轉排列失敗的情況。整波段漲勢開始於 1994 年 6 月份的低點$24\%$（沒有顯示）。經過一段正常的起伏波折，股價在一年之後創新高（圖形最左側的峰位）。然後由此向下發展。剛開始的時候，下跌走勢顯得很穩定，沿著下降趨勢線發展。9月中旬，價格夾著大量下跌，進入蹦跳階段。不久，價格創$33^{5}/_{8}$的低價，然後逐漸回升，11月下旬穿越趨勢線。向上突破之後，立即出現回挫走勢，沿著趨勢線向下發展，這段期間相當長。最後，價格終於脫離趨勢線而暴跌。1996年6月底，股價跌到$20之下，尚不及前一年同期高價的一半。


    這個排列為何失敗？圖 7.3 不是標準的範例，但絕大部分的實例都稱不上是標準範例。在這個例子中，蹦跳階段的高度不及前奏階段的兩倍。可是，這個結論也取決於如何繪製趨勢線。如果把趨勢線的起點設定在
    A，那麼蹦跳階段與前奏階段的高度大約是 2:1 的關係。新的趨勢線也觸及 B 點的峰位。所以，如果你等待收盤價穿越這條新趨勢線，就不會進場買進股票。某些情況下，你應該由不同的角度觀察或繪製走勢圖（不要忘记在對數刻度的價格座標上繪製圖形）。

