    我編製表 17.2 的主要目的是嘗試檢定一個假設：如果價格收在當天最高價附近，隔天將出現更高的最高價。根據表 17.2 的數據顯示，前述假設顯然非常不可靠，距離我所能夠接受的
    80% 精準度差太遠。總之，如果今天價格收在最高價附近，並不能保證明天會出現更高的高價，至少對於普通股來說是如此。


