    這一切究竟有什麼意義？整體而言——包括這 5 年期間與圖 I-1 沒有涵蓋的另外 2、3 年——股票市場處於大多頭環境內。可是，雖然整體股票市場明顯向上，但某些個股未必如此幸運。有些股票持續下跌，另一些股票先是大漲，然後反轉向


