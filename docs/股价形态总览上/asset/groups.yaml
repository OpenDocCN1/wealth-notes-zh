    # ## 摘要資料


    # ### 菱形頂排列


    外觀 菱形狀，排列發生之前曾經出現延伸性的漲勢。


    反轉或整理 短期的（少於 3 個月）空頭反轉排列。


    失敗率 25%。


    平均跌幅 21%，最經常發生跌幅 20%。


    成交量趨勢 突破之前呈現下降趨勢。


    回升 59%。


    價格目標

    達成率 79%。


    參閱排列 （20）頭肩頂排列。'
