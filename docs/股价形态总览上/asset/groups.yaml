    所有的案例中，約有四分之一（24%）向上突破，6%呈現水平突破（參考第 75 頁），剩下的 70% 案例向下突破。所謂「突破」是指收盤價跌破下側趨勢線或穿越上側趨勢線。某些情況下，價格可能出現長達幾月的橫向盤整，最後才突破。


    價格向上突破之後，往往會回挫（throwback）到上側趨勢線附近，發生的頻率為 44%。向上突破回挫走勢的平均時間長度為 2 星期（11 天），這是指價格向下反轉到觸及上側趨勢線的時間。如果價格經過
    1 個月以上的時間折返趨勢線，應該視為正常的價格行為，不視為向上突破的回挫。


    價格向下突破之後，發生回升走勢（pullback）的頻率更高 72%。這是價格向下突破之後，價格重新折返下側趨勢線附近。完成回升走勢的平均時間為 12 天。同樣地，此处不包括
    30 天以上的折返走勢。


    上升擴張排列突破之後，到達最終低點或高點的時間很短，分別為 69 天或 96 天。下跌走勢相當短促，一方面是因為排列的跌幅不深（最經常發生跌幅低於 10%），所以不需要很長的時間就能到達最終低點。


    大多數上升擴張排列都發生在最近 12 個月價格區間的中央附近（我考慮下側趨勢線的突破位置）。事實上，不論排列發生在價格區間三等份的最下緣或最上緣，平均跌幅都差不多，分別為
    17% 與 18%。所以，在年度價格區間之內，排列發生位置與隨後發展結果，兩者之間沒有統計上的顯著關聯。請注意，某些排列在這方面呈現顯著的關聯。


    整個排列發展過程中，雖然成交量都不規則，但我衡量突破前後的成交量數據。以突破前一天的成交量為基準，突破隔天的成交量通常最大，較基準量平均多出 70%，往後四天的成交量遞減。這種型態似乎很正常，因爲投資人一旦察覺價格向下突破，通常都會賣出持股。


    接著，我希望知道排列的成功或失敗，是否與突破過程的成交量大小有關。不論向上或向下突破，突破過程通常都夾著大量。所以，突破成交量的大小，並不是決定排列成功或失敗的重要因素。換句話說，即使向下突破的成交量很小，也不能因此而懷疑價格可能回升。


    # 交易戰術


    表 2.4 列舉相關的交易戰術。衡量法則顯示向下突破之後的目標價位。首先計算排列最高點與水平趨勢線之間的排列高度。由水平趨勢線向下衡量排列高度，結果就是目標價位。一般而言，衡量法則都指最低目標價位而言，但對於上升擴張排列來說，價格通常都不能到達目標（達成率只有
    43%）。


    比較保守的做法，是由水平趨勢線向下衡量排列高度的一半。如此計算的目標價位，達成率高達 91%。這個保守的目標價位顯示上升擴張排列似乎不值得進行交易——至少向下突破是如此。


    圖 2.5 清楚說明目標價位的計算方法。上升擴張型態的最高價為 $34\frac{1}{8}$，水平趨勢線位在 $29\frac{1}{4}$，排列高度是
    $4\frac{7}{8}$。由水平趨勢線向下衡量排列高度，目標價位是 $24\frac{3}{8}$。由於這個目標價位的達成率只有 43%，所以另外取排列一半高度
    $2.44$，計算保守的目標價位 $26.81$。一旦排列向下突破之後，完成保守目標價位的比率有 91%。


    表2.4 上升直角三角形擴張排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算型態最高點到水平趨勢線之間的排列高度。由水平趨勢線向下衡量排列高度，結果就是目標價位。另一種比較保守的估計方法，是取排列高度的一半距離向下衡量。
    |

    | 等待確認 | 由於排列的失敗率相對偏高 (34%)，應該等待收盤價向下穿越水平趨勢線，或向上穿越上側趨勢線。 |

    | 向上突破買進 | 一旦突破之後，價格通常都會繼續朝突破方向發展。向上突破之後買進，最經常發生報酬為 20%。 |

    | 忽略向下突破 | 大多數排列都向下突破，但這類情況的最經常發生跌幅尚不足 10%。由於價格跌幅很小，似乎不值得承擔空頭部位的風險。 |


    附註：最佳運用方法是在向上突破之後買進。


    由於排列的整體失敗率高達 34%，所以投資人應該等待價格突破之後才採取行動。


    雖然上升擴張排列通常都向下突破，但你也可以專門挑選向上突破進行交易。如果價格向上突破，最經常發生的漲幅為 20%。同樣地，你應該等待價格確實向上突破，然後才進場買進，因為向上突破的機會大約只有三分之一。


    當價格向下突破，我不贊成放空股票。雖然突破方向通常都朝下，而且失敗的比率不高，但最經常發生跌幅畢竟只有 10%，似乎不值得承擔放空股票的風險。如果你已經持有股票，不希望發生
    10%或更大的價格跌幅，可以在收盤價跌破下側趨勢線的時候賣出，或者是在價格接近或觸及上側趨勢線而向下反轉的時候賣出。


    # Wal-Mart Stores Inc. (零售商店，NYSE，代碼 WMT)


    ![](img/843a88de0b50d7a36e65238281a4e722_77_0.png)


    圖 2.5 上升擴張排列。利用排列的完整與一半高度衡量目標價位。1992 年 10 月底似乎出現擴張頂排列。


    # 交易範例


    老鮑相當神經質，就像吞下太多的咖啡因，我相信你也碰過這類的人。1993 年 2 月份，他遇到圖 2.5 顯示的情況，立即採取果斷的行動。當股票在 A 點觸及上側趨勢線，他進場放空，成交價格為
    $33\frac{3}{8}$，停損買單設定在 $34$。


    然後，股價開始下滑，不久就觸及下側的水平趨勢線。不幸地，因為沒有預先設定停止買單；所以，當價格觸及低點而快速反彈，老鮑不能在下側趨勢線（$29\frac{3}{8}$）獲利了結，隔天才在
    $30\frac{5}{8}$ 回補（B 點），而且在相同價位反轉做多。


    多頭部位的停損賣單設定在下側趨勢線的稍下方 $29\frac{1}{4}$。老鮑把既有的上側趨勢線稍作延伸，但擔心股價或許沒有辦法觸及這條趨勢線。所以，他把目標價位設定在先前高點（A
    點）的下側 1/8 點。不到一個星期，股價觸及目標價位，多頭部位在 $33\frac{1}{2}$ 出場（C 點）。由於股票當時的上升動能仍然強勁，老鮑沒有反手放空，只是靜待趨勢反轉。三天之後，他又進場建立空頭部位，放空價格爲
    $33$。這次，他把獲利了結的停止買單設定在下側趨勢線（$29\frac{1}{2}$）的上方 1/8 點處（D 點）。這個空頭部位最初發生虧損，價格曾經上漲到
    $34$，然後出現 3 個星期的橫向整理，但價格始終沒有觸及 $34\frac{3}{8}$ 的停損點。橫向走勢結束之後，價格暴跌而直接貫穿下側趨勢線，空頭部位在
    D 點回補出場。


    由於市場的氣氛轉趨樂觀，他在回補空頭部位的同時，又在 D 點買進股票，停損設定在水平趨勢線下側 1/4 點處。隔天，價格觸發 $29\frac{1}{4}$
    的停損單，老鮑認賠出場，這筆交易損失 3/8 點。基於某種不明的原因，老鮑沒有繼續交易這支股票，或許是因爲最後一筆交易發生些微的虧損，也可能是因爲血液內的咖啡因濃度轉淡。


    # 擴張排列 下降直角三角形


    ![](img/843a88de0b50d7a36e65238281a4e722_80_0.png)


    # 摘要資料


    | | |

    | :--- | :--- |

    | 外觀 | 水平狀頭部，低點持續下滑，下側趨勢線向下傾斜。 |

    | 反轉或整理 | 短期的（少於 3 個月）反轉排列。 |

    | 等待向下突破的失敗率 | 3%。 |

    | 等待向上突破的失敗率 | 19%。 |

    | 平均漲幅 | 27%，最經常發生漲幅介於 20%到 30%之間。 |

    | 平均跌幅 | 19%，最經常發生跌幅大約是 10%到 15%之間。 |

    | 成交量趨勢 | 不規則。 |

    | 回升 | 向下突破有 33%發生回升走勢。 |

    | 回挫 | 向上突破有 23%發生回挫走勢。 |

    | 價格目標達成率 | 成功的向下突破 69%，成功的向上突破 89%。 |


    研究某種特定排列之前，我會瀏覽既有的文獻，決定該排列的可能突破方向。對於一般性的擴張排列來說，大多數資料都顯示型態向下突破；換言之，擴張排列應該屬於空頭型態。可是，當我整理這個排列的統計數據，卻意外發現下降直角三角形擴張排列（right-angled
    descending broadening formations）向上突破的案例多過向下突破。最初，我把向上突破視為失敗案例，因為我預期突破的正確方向應該朝下。這個看法顯然錯誤。所以，我重新檢視文獻，發現下降擴張排列可能朝上或朝下突破。於是，我重新整理相關的統計數據與案例，確定它們符合新的處理方法。


    在「摘要資料」的「反轉或整理」欄位中，並沒有歸納排列的多頭或空頭性質，因為這取決於突破的方向。如果向上突破（47 個案例，相當於 57%），則屬於多頭排列；如果向下突破（30
    個案例，相當於 37%），則屬於空頭排列。其餘的案例呈現水平突破或沒有特定的突破方向。


    如果排列朝某個方向突破，但沒有出現相同方向的 5%跟進走勢，就視為失敗。對於任何型態，我認為失敗率低於 20%就可以接受。在我們所考慮的下降擴張排列案例中，向上與向下突破的失敗率分別為
    19%與 3%，都屬於可以接受的範圍。


    目前這個排列的平均漲幅（27%）與平均跌幅（19%）都低於標準（整體多頭排列的平均漲幅大約是 40%，整體空頭排列的平均跌幅大約是 20%）。可是，對於向上突破的案例，最經常發生漲幅相對偏高，介於
    20%與 30%之間。由於我們是利用次數分配來計算最經常發生漲幅，而且每個報酬率區間的發生次數分配相當均勻，所以漲幅偏高案例會造成平均漲幅向上偏頗（27%）。不幸地，由於樣本案例很少，前述數據的可信度不高。我相信最經常發生漲幅應該介於
    10%到 15%之間，約略等於一般多頭排列的正常水準。


