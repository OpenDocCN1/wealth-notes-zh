    ...點處。她認為排列最高點代表支撐區，如果股價回檔，應該在支撐區止跌反彈，不至於觸發停止賣單。


    2 月中旬，當股票在 $17 附近創第二個峰位，她發現潛在的雙重頂排列。於是，她把停止賣點調高到雙重頂確認點的下方 1/8 點處（$14 1/4）。大約又經過兩個星期，這個停止賣單遭到觸發，因為股價暴跌到
    $12 1/8（前一天收盤價為 $15 5/8）。扣除佣金成本之後，這筆交易在不足 4 個月內獲利 33%。


    ## 5 上升擴張楔形排列


    ![](img/843a88de0b50d7a36e65238281a4e722_128_0.png)


    ### 摘要資料


    - 外觀：價格沿著兩條向上傾斜的趨勢線發展。兩條趨勢線向外發散。

    - 反轉或整理：短期的（長達 3 個月）空頭反轉排列。

    - 失敗率：24%。

    - 等待向下突破的失敗率：6%。

    - 平均跌幅：20%、最經常發生跌幅為 10%。

    - 成交量趨勢：隨著時間經過而稍有增加。

    - 回升：向下突破有 21% 發生回升走勢。

    - 回挫：向上突破有 7% 發生回挫走勢。

    - 價格目標達成率：61%。

    - 意外發現：排列末端出現部分漲勢，向下突破的可能性為 84%。


    我稱這種排列為上升擴張楔形（ascending broadening wedge），因為這種擴張排列的外觀很像上升楔形（rising wedge）。在搜尋等腰狀擴張排列（symmetrical
    broadening formations）的過程中，我開始注意到這種排列。什麼是等腰擴張排列呢？這種排列在水平軸兩側出現相互對稱的價格型態：價格高點持續墊高，價格低點持續下滑，所銜接的兩條趨勢線分別向上與向下傾斜。


    上升擴張楔形與上升楔形不同。兩種排列中，界定價格行為的兩條趨勢線都向上傾斜，但這只是兩者的唯一相似之處。上升擴張楔形的兩條趨勢線向外發散（擴張）；換言之，上側趨勢線的斜率陡峭程度超過下側趨勢線，兩條趨勢線向未來延伸不會相交。反之，上升楔形的兩條趨勢線向外收斂。


    上升擴張楔形與上升楔形的成交量型態也不同。上升擴張楔形接近突破點的位置，成交量通常會放大，但上升楔形的成交量通常會隨著時間經過而縮小。


    「摘要資料」列示上升擴張楔形的一些統計數據。這種價格型態的失敗率相當高 24%，如果等待向下突破，失敗率下降到 6%。按照我的標準，型態的失敗率低於 20%
    才可以接受；所以，如果針對這個型態操作，應該等待向下突破之後才放空。


    突破之後的回升（pullbacks）與回挫（throwbacks）走勢相當罕見，發生的機會分別為 21% 與 7%，在擴張排列中顯得稍微不尋常。這些數據顯示，突破一旦發生，通常就不會回頭；向下突破之後，就繼續下跌。當然，這種說法也不一定完全正確；請參考本章首頁的小圖，股價在下側趨勢線附近，還是顯得有些猶豫。


    排列突破之後，滿足目標價位的達成率為 61%，低於我希望接受的水準（至少 80%）。事實上，這個達成率還有些高估。請注意，衡量目標價位並不採用排列高度，而是把排列最低點設定為目標；換言之，此處是按照楔形排列的方法衡量目標價位。價格跌破下側趨勢線之後，大約有三分之二的案例會繼續下跌到排列最低點或以下。


    部分漲勢（partial rise）是上升擴張楔形的意外發現。所謂「部分漲勢」，是指價格由下側趨勢線向上反彈，在靠近上側趨勢線之前，又開始向下折返。一旦發生部分漲勢，向下突破的可能性為
    84%。


    ### 緣起


    上升擴張楔形排列的形狀究竟如何？請參考圖 5.1。首先，我們發現兩條向上傾斜的趨勢線，上側趨勢線的陡峭程度超過下側趨勢線。換言之，這兩條向上傾斜的趨勢線，隨著時間經過而向外擴張。一旦下側趨勢線被突破之後，價格出現暴跌走勢。整個形狀如同向上傾斜的楔形，所以稱為上升擴張楔形。在排列內，價格起伏波動，受到兩條趨勢線的界定。這兩條趨勢線不是相互平行。如果平行的話，就是通道（channel）或矩形排列（rectangle，如果兩條趨勢線都是水平狀的話）。


    ## Air Express Intl. Corp. (空運, NASDAQ, 代碼 AEIC)


    ![](img/843a88de0b50d7a36e65238281a4e722_131_0.png)


    圖 5.1 上升擴張楔形。界定價格行爲的兩條趨勢線向上傾斜，而且隨著時間經過向外擴張（發散）。


    圖 5.2 是一個更典型的例子，兩條趨勢線的陡峭程度明顯不同，非常清楚的向外擴散。


    圖 5.1 與 5.2 的情況非常類似。兩個排列都發生在上升趨勢的末端，代表可能的反轉型態。雖然上升擴張楔形不一定向下突破，排列也不一定發生在上升趨勢的末端，但這兩種情況的發生機會很大。


    圖 5.2 也顯示一個有趣的型態，這是判斷另一個新價格趨勢的重要參考：部分漲勢。價格觸及下側趨勢線而向上反彈，但沒有觸及上側趨勢線。價格向下反轉之後，跌破下側趨勢線，而且繼續下跌。請注意，1992
    年 1 月份也出現一個類似的部分漲勢。在這個例子中，價格向下反轉之後，只觸及而沒有買穿上側趨勢線，然後又恢復正常的上升擴張楔形走勢。這個部分漲勢沒有正確預示趨勢變動。我們稍後還會繼續討論部分漲勢的問題。


    ## Barrick Gold（礦產，黃金 / 白銀，NYSE，代碼 ABX）


    ![](img/843a88de0b50d7a36e65238281a4e722_132_0.png)


    圖 5.2 上升擴張楔形。兩條趨勢線隨著時間經過而明顯向外擴張。部分漲勢沒有觸及上側趨勢線，意味著價格即將向下突破。


    擴張楔形為什麼出現呢？假定你是某家大型投資機構的主管，手頭上有一大筆資金，準備買進另一家公司的股票。當時的股票很低，你指示交易部門買進股票。交易部門透過幾家不同的經紀商分批買進，但突如其來的買盤還是推高股價。雖然儘可能保持低調，但你進場的消息還是傳到市場上。動態玩家自然會趁機搭轎，進場買進。這使得股票更進一步上漲，所以你的交易部門暫停買進。


    價值型投資人發現股價進入超買狀態，在高價拋售股票。很快地，價格開始回檔。可是，在價格回到先前的低價之前，準備回檔接手的人又進場，阻止股價繼續下跌。你的交易部門察覺股價底部墊高，也趁著價格運算合理而買進。某些投資人發現這支股票值得一試，也加入買進行列。甚至這家公司本身也進場買進，執行董事會很久之前宣佈的股票買回計畫。這個股票買回計畫已經接近到期，公司方面認為目前是履行承諾而買進股票的適當時機。


    股價創新高。當價格向上過度延伸之後，買壓逐漸蓄積而超過賣進力道，造成股價下跌，但跌幅不深——因為太多人希望在理想價位買進。所以，在失控的買盤力道刺激下，股價高點持續墊高，而你嘗試在下檔某固定價位買進。可是，你的買進計畫也不太成功，被迫在愈來愈高的價位買進，結果低點也愈墊愈高。


    不久，股價上漲到你也不能接受的水準。於是，你決定賣出部分或全部持股。在這種情況下，當動能玩家再度驅動股價走高的時候，股價已經不能靠近上側趨勢線。


    每個人都有觸角或管道，嘗試瞭解市場的演變。遙遠的地方，隱隱約約出現一些雜音。空頭表示，本季的相同店面銷售量將下降。這一次，空頭謠言獲得廣泛的認同。精明資金首先採取行動而奔向出口。價格開始快速下滑。在下側趨勢線附近，一些還沒有察覺風向變動的無知投資人或許會買進股票。可是，這些有限的買盤力道很快就消耗完畢，股價貫穿下側趨勢線，而且繼續下跌。


    ### 辨識準則


    表 5.1 列示一些獨特的辨識準則。當我們討論這些辨識準則時，請參考圖 5.3。這個排列不同於圖 5.1 與 5.2，因為型態發生之前屬於橫向盤整走勢。由
    1991 年 7 月開始，價格就出現橫向盤整走勢，不曾跌破 $15 \frac{3}{8}$ 的水準（圖 5.3 只顯示一部分走勢）。


    1992 年前後，橫向盤整走勢開始發生變化。價格在 12 月 23 日向上發展，1 月中旬創新高，但很快又下跌。這個時候，可以分別銜接轉折高點與低點而繪製兩條暫時趨勢線。雖然還沒有明確的結論，但擴張楔形似乎逐漸成型。隨後，價格走高觸及上側趨勢線，然後折返觸及下側趨勢線，擴張楔形排列已經相當清楚。3
    月初，價格向上攀升，但距離上側趨勢線還很遠的時候，又向下反轉，直接貫穿下側趨勢線。部分漲勢與趨勢線貫穿，意味著趨勢即將發生變化。


    這是假突破（false breakout）。向下突破之後，出現連續 3 天的緊密線形，然後重新穿越下側趨勢線，並且快速攀升到上側趨勢線。下側趨勢線需要重新繪製，納入先前發生的向下假突破，往後價格在排列內的上下起伏寬度更大。


    一個月之後，價格又回到下側趨勢線，反彈回升幾天，然後又穿越下側趨勢線，但隔天又回到趨勢線之上，並且繼續走高。整個情況類似於 3 月中旬的走勢。可是，這波漲勢的成交量沒有放大，很快又退回下側趨勢線。4
    月 6 日，價格向下跳空，直接穿越下側趨勢線，這是真正的突破，價格暴跌到 $12 \frac{3}{4}$ 之下，由高點起算的跌幅將近 50%。


    ![](img/843a88de0b50d7a36e65238281a4e722_135_0.png)


    圖 5.3 擴張排列出現向下的假突破，需要重新繪製下側趨勢線。內側的部分漲勢相當罕見，發生機會只有 18%。


    回頭觀察圖 5.1、5.2 與 5.3，我們發現上升擴張楔形具備幾個共通的特性。整體形狀呈現喇叭狀，與擴張排列的情況一樣，只是喇叭的開口朝向右上方：兩條趨勢線都朝右上方傾斜。上側趨勢線的陡峭程度超過下側趨勢線，兩條趨勢線向外擴散。下側趨勢線的斜率也朝上，使得這個排列不同於直角三角形或等腰類型的擴張排列。


    根據我的認定標準，上升擴張楔形的兩側趨勢線都至少需要 3 個觸及點（這些觸及點至少要相當靠近趨勢線）。至少三個觸及點的規定，可以排除一些正常的價格行爲，協助辨識可靠的價格型態。


    成交量型態不規則，但大體上還是「價漲量增 / 價跌量縮」。另外，成交量也會隨著時間經過而增加，但這個現象在走勢圖中並不明顯，在整體擴張楔形排列內的傾向也不顯著，所以不屬於必要的辨識準則。


    圖 5.3 顯示一個提前突破（假突破）的案例。一般來說，價格會沿著下側趨勢線發展，除非接近正式突破點，否則盤中價格都很少穿越趨勢線。一旦收盤價穿越趨勢線之後，走勢可能非常混亂，如同前述幾個圖形顯示的。某些情況下，價格貫穿之後就繼續下跌；另一些情況下，突破之後，價格還會來回穿越趨勢線，最後才正式下跌。不論哪一種情況，突破的方向通常都是朝下。


    最後，幾乎半數的上升擴張楔形都出現部分漲勢。由於部分漲勢發生之後，通常立即向下突破，所以部分漲勢代表重要的趨勢變動指標。何謂部分漲勢？價格觸及下側趨勢線而反彈，但隨後的漲勢還沒有觸及或靠近上側趨勢線之前就向下折返。這個折返下側趨勢線的走勢，經常會出現真正的突破。請注意，部分漲勢的起點是下側趨勢線。


    ### 失敗案例


    圖 5.4 顯示一個失敗案例。價格雖然向下突破，但沒有出現 5% 或以上的跟進跌勢，價格接著又向上發展。向下突破發生在 $50^{1/8}$，兩個星期之後的最低價爲
    $48^{5/8}$，跌幅大約是 3%——不足以視爲有效的向下突破。


    全部 126 個向下突破案例中，只有 7 個（相當於 6%）沒有出現 5% 或以上的跟進跌勢。這是明顯偏低的數據。可是，這並不代表向下突破必定不會失敗。在全部上升擴張楔形排列中，76%
    的案例成功向下突破。這是很高的比率；如果你等待向下突破，則成功的機會更高。雖然排列的成功率為 76%，但剩下的 24% 案例可能向上突破或橫向發展。失敗率
    24% 顯然不是一個可以忽略的數據。如同其他排列一樣，採取行動之前，最好等待收盤價突破的確認訊號。


    ![](img/843a88de0b50d7a36e65238281a4e722_138_0.png)


    圖 5.4 失敗的上升擴張楔形。向下突破之後，沒有出現 5% 或以上的跟進跌勢，價格隨後又走高。


    ### 統計數據


    表 5.2 列示上升擴張楔形的一般統計數據。相對於其他擴張型態，目前這種排列的案例較多。在 500 支股票的 5 年期間內，我找到 157 個案例，其中 118
    個排列（75%）屬於反轉型態。


    **表 5.1 上升擴張模形的辨識特質**


    | 特質 | 討論 |

    | :--- | :--- |

    | 形狀 | 向上傾斜的喇叭狀，界定價格行為的兩條趨勢線都向上傾斜。 |

    | 趨勢線 | 兩條趨勢線都向上傾斜，上側趨勢線的陡峭程度超過下側趨勢線。 |

    | 觸及點 | 每側趨勢線都至少需要 3 個不同的觸及點（或近似觸及點）。這有助於確認型態與續效。 |

    | 成交量 | 不規則，但隨著時間經過而稍有增加的傾向。 |

    | 提前突破 | 非常罕見。收盤價跌破下側趨勢線，通常代表真正突破。 |

    | 突破 | 絕大多數情況下突破，但還是可能向上突破。 |

    | 部分漲勢 | 價格觸及下側趨勢線，向上反彈而不能觸及上側趨勢線，然後向下反轉而突破下側趨勢線。 |


    **表 5.2 上升擴張楔形的一般統計數據**


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：1991 年~1996 年的 500 支股票 | 157 個 |

    | 反轉或整理排列 | 39 個整理，118 個反轉 |

    | 失敗率 | 38/157 相當於 24% |

    | 等待向下突破之後的失敗率 | 7/126 相當於 6% |

    | 成功排列的平均跌幅 | 20% |

    | 最經常發生跌幅 | 10% |

    | 在成功排列中，符合或超越目標價位者 | 73/119 相當於 61% |

    | 排列平均長度 | 4 個月（116 天） |

    | 成功向下突破距離最終低點的天數 | 3 個月（95 天） |

    | 部分漲勢緊跟著向下突破 | 63/75 相當於 84% |

    | 所有排列發生部分上漲的百分率 | 75/157 相當於 48% |

    | 部分漲勢不代表排列結束 | 29/157 相當於 18% |

    | 成交量隨著時間經過而擴大的百分率 | 59% |


    附註：絕大部分的上升擴張楔形排列都向下突破，部分漲勢可以視為即將向下突破的可靠訊號。


    失敗率 24% 相對偏高，相當於每 4 個案例就有 1 個向上突破（或橫向發展）。如果你等待收盤價向下突破，失敗率下降為 6%。在 126 個向下突破案例中，只有
    7 個沒有出現 5% 或以上的跟進跌勢。所以，假突破非常罕見，不值得擔心。


    向下突破之後，股價跌幅通常有多大？平均跌幅為 20%。可是，跌幅的次數分配（參考圖 5.5）顯示稍微不同的結論，最經常發生跌幅為 10%。大約四分之一案例的跌幅落在
    10% 區間，將近一半案例的跌幅落在 15%、20% 與 25% 等區間，這意味著最經常發生跌幅 10% 可能低估，這個數據很可能是落在 15% 到 20%
    之間。


    一般排列突破之後的目標價位，通常是由突破點向上或向下衡量排列高度。可是，對於楔形排列，通常是以排列最高點或最低點做為突破之後的目標價位，此處也採用這種衡量方法。在成功向下突破的案例中，大約只有
    61% 完成目標價位。這個達成率顯然偏低，我認爲至少需要 80% 才可靠。


    ![](img/843a88de0b50d7a36e65238281a4e722_140_0.png)


    由排列開始到結束之間的平均長度，大約是 4 個月（116 天）；另外，由突破發生到最後低點之間的平均時間為 95 天。


    考慮突破發生到最後低點之間的天數次數分配，可以反映這個排列適用於短期、中期或長期投資。在 119 個成功的向下突破案例中，81 個排列的期間短於 3 個月，中期與長期的案例各有
    19 個。這意味著上升擴張楔形基本上屬於短期型態。當價格向下突破，如果你進場放空，部位很可能在 3 個月內結束。


    關於部分漲勢的行爲，統計數據顯示非凡的意義。在全部上升擴張楔形案例中，大約有半數（48%）發生部分漲勢（請參考圖 5.2）；一旦發生部分漲勢，84% 的案例隨後立即發生向下突破。全部案例中，部分漲勢發生在排列之內的情況只有
    18%（請參考圖 5.3 的例子）。即使你不把部分漲勢視為放空訊號，也應該把它視為趨勢變動的警訊。這個走勢本身就具有重要意義，尤其是你當時考慮買進股票。


    成交量的趨勢（衡量線性迴歸直線的斜率），顯示 59% 案例的成交量隨著時間經過增加。這項結論不具有統計上的顯著意義，意味著成交量並不是辨識這種排列的重要準則。如果實際觀察走勢圖上的成交量型態，大體上呈現不規則演變。


    **表 5.3 上升擴張楔形排列突破的統計數據**


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 向上突破而失敗 | 1 個或 3% |

    | 向下突破而失敗 | 7 個或 6% |

    | 向上突破 | 29 個或 18% |

    | 水平突破 | 2 個或 1% |

    | 向下突破 | 126 個或 80% |

    | 向上突破回挫發生次數 | 2 次或 7% |

    | 回挫完成的平均時間 | 7 天 |

    | 向下突破回升發生次數 | 26 次或 21% |

    | 回升完成的平均時間 | 9 天 |

    | 下向突破點位在最近 12 個月價格區間的下降線 | 19% |

    | 下線、中央或上緣中央 | 27% |

    | 上線 | 64% |

    | 前述突破位置的平均跌幅：下降線 | 25% |

    | 中央 | 21% |

    | 上線 | 19% |

    | 相對於突破前一天，突破當天與隨後 5 天的成交量 | 165%，134%，116% <br> 96%，114%，109% |


    除了向上與向下突破之外，其餘的案例屬於水平突破（2 個，相當於 1%）。


    上升擴張楔形排列很少發生突破之後的回升（pullbacks）或回挫（throwbacks）走勢。由於向上突破的案例原本就不多，所以回挫只出現 2 次也就不足爲奇了。由向上突破發生，到回挫走勢完成，兩者之間只相隔
    1 個星期。其他排列向上突破的回挫期間長度大約是 10~12 天。此處的回挫期間偏短，很可能是樣本太少的緣故。


    向下突破之後的回升走勢總共發生 26 次，但發生頻率 21% 也低於其他排列的對應數據。回升走勢的期間長度為 9 天。由這些數據顯示，上升擴張楔形的回挫與回升走勢沒有操作上的參考價值。可是，如果真的發生回升走勢，一旦走勢完成而價格向下反轉，可以考慮加碼空頭部位。


    對於向下突破的案例，我觀察這些突破發生在最近 12 個月價格區間三等份的哪個位置。結果，64% 的向下突破發生在年度價格區間的上緣。這似乎有些奇怪，因爲發生在排列下端的突破竟然會出現在年度高價附近。上升擴張楔形通常發生在上升趨勢的末端，所以排列本身通常位在年度價格區間的上緣，雖然突破點位在排列下端，但還是在年度價格區間的上緣。


    另外，按照向下突破落在年度價格區間的位置（上緣、中央與下緣），我計算它們的平均跌幅。結果，突破發生在下緣的跌幅最大 25%。這個跌幅超過正常水準，但最大跌幅的突破發生在年度價格區間的下緣，這個現象應該不奇怪。其他空頭排列也呈現這種傾向。可是，這有什麼意義呢？放空股票的時機應該是股價創新低——不是新高——的時候。


    表 5.3 顯示突破發生一個星期內與突破前一天的成交量關係。如同我們預期的，突破當天的成交量很大，大約較前一天高出 65%。隨後一個星期內的成交量也很大，但缺乏穩定的型態。

