    失敗率高達 67%，這是所有排列的最差績效。關於失敗率統計數據，我考慮的吊人線形必須符合下列三個條件：


    - 開盤價、最高價與收盤價完全相同。

    - 盤中低價至少必須較盤中高價低 5%。

    - 發生在短期（或稍長期）價格上升趨勢。


    對於符合前述三個條件的案例（換言之，處在價格上升趨勢的吊人線形），我觀察隔天是否出現趨勢反轉（換言之，向下突破）。大多數情況下（67%），價格繼續上揚。對於向下突破的案例，不存在對應的失敗率，因為吊人線形原本就應該向下突破（換言之，隔天的價格下跌）。在我考慮的股票與期間內，符合前述三個條件的吊人線形共有
    155 個，其中 104 個向上突破（原本應該向下突破，所以向上突破視為失敗）。


    由於失敗率非常高，這讓我心中頗有疑惑，所以觀察向上與向下突破的 5% 失敗狀況。所謂 5% 失敗，是指價格朝某個方向突破，但還沒有出現 5% 或以上的跟進走勢之前，價格又朝另一個方向反轉。向上突破發生
    5% 失敗情況的比率為 11%，向下突破的比率為 22%，提高一倍。就我個人的觀點來說，失敗率超過 20% 就不被接受。


    關於向上突破與向下突破的平均漲幅與跌幅，首先剔除 104 個向上突破失敗的案例，然後分別計算向上與向下突破的數據，結果平均漲幅為 40% 與平均跌幅為 16%。


    圖 17.3 與 17.4 分別顯示向上突破漲幅與向下突破跌幅的次數分配。向上突破的最經常發生漲幅低於 10%。請參考圖 17.3，漲幅超過 90% 的向上突破案例佔
    15%，漲幅超過 50% 的案例超過三分之一。這些偏高的漲幅會造成平均漲幅向上抻曲。


    圖 17.4 顯示向下突破的情況。請注意，橫軸的刻度單位是 5%。雖然最高欄位發生在 10%，但 5% 欄位的讀數也很高，所以我把最經常發生跌幅視為 5%
    到 10% 之間。


