    圖 15.4 則顯示一個徹底失敗的高位緊密旗形例子。最初，這個排列看起來很不錯。波段走勢起漲於 10 月初的$12½，12 月初創$27 的高價——價格在
    2 個月內上漲超過 100%。然後，價格緩步下滑，形成狹幅整理的旗形排列……而且價格繼續下跌。雖然符合歐尼爾提出的全部條件，但該排列並沒有向上突破而繼續走高。3
    月底，股價創$11¼的新低，把先前的全部漲幅完全吐出。這個例子可以凸顯高位緊密旗形排列在操作上的風險。除非等待向上突破，否則你可能陷入虧損。


