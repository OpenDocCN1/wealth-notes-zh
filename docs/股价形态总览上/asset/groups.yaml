    # 交易範例


    老鮑相當神經質，就像吞下太多的咖啡因，我相信你也碰過這類的人。1993 年 2 月份，他遇到圖 2.5 顯示的情況，立即採取果斷的行動。當股票在 A 點觸及上側趨勢線，他進場放空，成交價格為$33$^{3/8}$，停損買單設定在$34$。


