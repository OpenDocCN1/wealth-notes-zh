    ## 統計數據


    當我跑完主要的資料庫之後，發現擴張頂排列的案例顯然太少。在我檢驗的股票之中，大約只有 25% 曾經出現擴張頂型態。所以，我採用當時每天運用的資料庫，希望增添一些樣本。後面這個資料庫較小，大約只包括
