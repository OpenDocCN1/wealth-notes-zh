    ![](img/843a88de0b50d7a36e65238281a4e722_228_0.png)


    圖 9.2 帶柄杯狀排列。杯狀與柄部的形狀都很好，杯狀右緣稍高於左緣。


    圖 9.3 的例子中，價格向上突破之後，大約只出現 11% 的漲幅。可是，價格回到柄部下緣附近就止跌，而且又向上發展，重新創高價。最後，股價的漲幅為 52%。


    Genetech, Inc. (藥品，NYSE，代碼 GNE)


    ![](img/843a88de0b50d7a36e65238281a4e722_229_0.png)


    圖 9.3 週線的帶柄杯狀排列。突破之後只出現 10%~15% 的漲勢，在這種排列中屬於正常情況。可是，目前這個例子，價格又恢復漲勢。


    圖 9.3 也凸顯出篩選錯誤的可能性：內杯（inner cup）。內杯出現之前並沒有緊跟著 30% 的漲勢（1991 年底出現一段跌勢，然後形成 1992
    年上半年的內杯），而且在柄部出現的第 3 天就向上突破 (柄部期間只有 2 天) 。可是，內杯提供很好的交易機會，因爲你可以掌握一波漲勢的底部。即使價格只能上漲到外杯的杯口左緣，幅度也可能相當可觀。細節部分請參考稍後討論的「交易戰術」。


    圖 9.4 顯示另一個挑選擇誤的範例。由 A 點到 B 點之間的漲幅不足 30%。在價格向上突破杯緣之後，如果你進場買進這支股票，價格一度攀升到 $34 \frac{1}{2}$，由突破點衡量的漲幅大約只有
    11%。股價創峰位之後，接著就出現暴跌走勢。不到一個月的期間內，價格下跌到 $21 \frac{1}{2}$，損失 38%。


