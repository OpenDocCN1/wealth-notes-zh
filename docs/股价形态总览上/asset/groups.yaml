    ## 投資的足印


    如果你閉起雙眼，默想 JCB 超級市場的股價走勢，應該可以發現三種價格型態：雙重底（double bottom）、雙重頂（double top）與迴光返照（dead-cat
    bounce）。對於有經驗的投資人來說，價格型態並不是毫無意義的鬼畫符；它們代表精明資金的足跡。這些足跡即是精明資金累積財富的途徑。對於某些人——例如：湯姆——他們深入研究，經過周詳的考慮，然後才會在某支股票上建立部位。他們就是創造這些足跡的人。他們就代表設定遊戲規則的精明資金；這場遊戲——任何人都可以參與——稱為「投資」。


    關於交易決策，不論你採用技術分析或基本分析，都應該瞭解市場究竟在想些什麼。換言之，你應該詳細探究這些足印。這些足印可以帶你遠離懸崖，讓你及時出脫某支股票。印下這些足跡的腳，也就是踢醒你而向你許下賺錢承諾的腳。


    本書提供一些工具，讓你審視投資足印，這些足印透露一些玄機：股價走勢的方向、距離與可靠性。這些工具不會讓你發財；很少工具能夠辦到這點。可是，它們是通往財富寶庫的鑰匙——務必善用。


    ## 資料庫


    如果你想測試自己對於某個價格排列的認識程度，不妨嘗試告訴電腦如何辨識價格型態。撰寫本書的過程中，我花費很多工夫在這方面。電腦程式協助我發現、分析與挑選 15,000
    多個價格排列。電腦程式不能取代我的雙眼或大腦，而不過是另外一套輔助工具罷了。不妨把電腦程式看成另一雙客觀的眼睛，一位朋友碰碰你的肩膀說：「看看這裡，有一個蹦跳-奔馳反轉（bump-and-run
    reversal）。」


    為了收集本書所需要的統計資料，我挑選 500 支股票做為觀察對象，完全採用日線圖，涵蓋期間都是 5 年（由 1991 年中期到 1996 年中期）。這些股票包括道瓊工業指數的
    30 支成分股，以及各種市值規模的股票。我所挑選的股票排除一些對象：走勢太過於單調（5 年期間的走勢都很平坦）或波動過份劇烈（成交量太小或每天價格區間太大）。


    我通常會剔除價格在$1.00 以下的股票，因為這些公司隨時可能宣佈破產。資料庫內的股票，大多是在紐約證交所（NYSE）、美國證交所（AMEX）或那斯達克（NASDAQ）掛牌交易的美國著名公司。本書每章提供的說明範例，即是這些股票的代表性樣本。


    某些價格排列非常罕見，以至於 2,500 年（500 支股票乘以 5 年）的日線圖資料都不夠運用。這種情況下，我就運用目前使用的資料庫，其中包括另一套 300
    支股票的圖形，涵蓋期間剛好銜接前一個資料庫。


    ## 1991 年~1996 年期間的股價表現


    正式探討本書的各種價格型態之前，最好回顧這段期間內的整體市場表現。圖 I-1 是 S&P 500 指數的月線圖。由 1991 年中期開始，我們發現市場走勢相當猶豫，這種情況一直拖到
    1992 年 1 月為止。該月份的行情突然向上發展，可能是受到 1 月效應（January effect）的影響；然後，在 5 月份之前，整體趨勢朝下發展。（所謂
    1 月效應，通常是指投資人基於節稅理由而在年底賣出股票，然後在 1 月份再買回。年底的賣壓未必會造成股價下跌，但 1 月份的買進經常造成短暫的推升力量。）1992
    年的年底，1 月效應似乎提早發生，股價在 12 月份向上突破整理而創新高。往後，股票市場基本上處於漲勢，直到 1994 年 3 月份出現暴跌走勢，接下來的五個月連續上漲，然後連續下跌四個月。1995
