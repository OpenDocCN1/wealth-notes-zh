    ## 統計數據


    當我跑完主要的資料庫之後，發現擴張頂排列的案例顯然太少。在我檢驗的股票之中，大約只有 25% 曾經出現擴張頂型態。所以，我採用當時每天運用的資料庫，希望增添一些樣本。後面這個資料庫較小，大約只包括
    300 支股票，而且只涵蓋 3 年的期間（1996 年~1999 年）。本書運用的主要資料庫則涵蓋 500 支股票與 5 年的期間（1991 年~1996
    年）。綜合兩個資料庫之後，案例還是不多，大約只有 189 個，但樣本數量已經足以歸納有效的結論。表 4.2 列示一般的統計數據。


    ### 表 4.2 擴張頂的一般統計數據


    | 說明 | 向上突破 | 向下突破 |

    | --- | --- | --- |

    | 排列數量 | | |

    | 1991 年~1996 年的 500 支股票共有 132 個；1996 年~1999 年的 300 支股票共有 57 個 | 100 | 89 |

    | 反轉或整理排列 | 100 個整理 | 89 個反轉 |

    | 失敗率 | 4/100 相當於 4% | 4/89 相當於 4.5% |

    | 成功排列的平均漲幅 / 跌幅 | 34% | 23% |

    | 最經常發生漲幅 / 跌幅 | 10%~15% | 10%~20% |

    | 在成功排列中，符合或超越目標價位者 | 72 個或 75% | 54 個或 64% |

    | 排列平均長度 | 2.5 個月（72 天） | 2 個月（67 天） |

    | 部分上漲而最後下跌 | | 45/69 相當於 65% |

    | 部分下跌而最後上漲 | 25/29 相當於 86% | |

    | 3 個月內發生趨勢反轉的百分率 | 41% | 47% |


    相對於排列發生之前的既有價格趨勢，擴張頂屬於反轉或整理型態？在全部 189 個案例中，100 個排列持續既有的趨勢而屬於整理型態（又稱為連續型態），89 個發生趨勢反轉。當然，排列屬於整理或反轉型態，完全取決於突破的方向。根據定義，擴張頂排列發生之前的既有價格趨勢向上，所以向上突破的排列屬於連續型態，向下突破的排列屬於反轉型態。


    某些分析家認為擴張頂排列在本質上屬於空頭反轉型態，但我找不到任何證據支持這個論點。我寧可把向上突破的擴張頂視為弱勢的多頭型態，或把向下突破的擴張頂視為稍微強勢的空頭型態。


    失敗率不容易決定，因為這種排列沒有向上或向下突破的明顯傾向，所以我採用 5% 的跟進走勢作為判斷基準。所謂「突破」，是指收盤價貫穿到排列最低點之下或穿越到排列最高點之上；突破發生之後，在出現
    5% 以上的跟進走勢之前，如果價格朝突破的相反方向發展，則視為排列失敗。


    我採用這種處理方式，理由很簡單。如果你在向上突破之後買進股票，但隨後沒有發生 5% 以上的跟進漲勢，你一定覺得失望，甚至可能認賠。在前述的定義之下，考慮全部
    189 個擴張頂案例，只有 8 個排列在突破之後沒有發生 5% 的跟進走勢。相當不錯的數據。


    突破發生之後，走勢的平均幅度如何？向上突破的平均漲幅為 34%，向下突破的平均跌幅為 23%。前者低於一般多頭型態的漲幅水準 40%，後者則超過一般空頭排列的跌幅水準
    20%。


    平均數可能受到離群值的扭曲，所以我透過次數分配計算最經常發生漲幅與跌幅，請參考圖 4.5。在向上突破的情況*


    *譯按：請參考本頁倒數第二段的解釋。


    ![](img/843a88de0b50d7a36e65238281a4e722_116_0.png)


    圖 4.5 擴張頂報酬率次數分配 向上突破的最經常發生漲幅為 10%~15%，向下滑破的最經常發生跌幅為 10%~20%。


    下，離群值顯然發生在上側，漲幅超過 50% 的案例佔 21%，漲幅平均數 (34%) 受到扭曲而向上偏頗。如果我們忽略這個欄位 (漲幅超過 50% 者)，次高欄位的報酬率是
    10%~15%。換言之，如果你在擴張頂排列向上突破的時候進場買進，這項投資最可能發生的報酬率是 10%~15%。如果你很幸運，實際的報酬率可能更高，但不要抵押房屋來下注。


    向下滑破的最經常發生跌幅介於 10% 與 20% 之間，包括圖形內的最左側三個欄位；由於這三個欄位緊靠在一起，所以我把它們歸納為一個區間。在全部向下滑破的案例中，超過半數
    (前三個欄位的總和為 56%) 的跌幅低於 20%。


    目標價位的衡量方法也類似於大多數其他排列。把排列最高價減去最低價，結果是排列高度；由突破價位向上或向下衡量排列高度，結果就是目標價位。


    請參考表 4.2，向上突破的目標價位達成率為 75%，向下突破的達成率只有 64%。我認為，達成率超過 80%，型態的目標價位才具備可靠的參考價值，擴張頂顯然不太符合這個標準。關於目標價位的詳細計算過程，請參考「交易戰術」一節。


    兩種突破方向的排列平均長度大約相同，分別為 72 天與 67 天。排列長度足夠讓型態顯示在週線圖上。


    部分漲勢與部分跌勢是判斷排列突破方向的可靠指標，投資人可以依此提早建立部位。請參考圖 4.3，點 5 的部分漲勢預示隨後的向下突破。如果擴張頂排列發生部分漲勢——價格由下側趨勢線反彈走高，但還沒有靠至上側趨勢線之前就折返——有
    65% 的案例隨後緊跟著發生向下突破。部分跌勢的預測可靠性更高；如果價格由上側趨勢線向下反轉，但還沒有靠近下側趨勢線之前就反彈走高，這類擴張頂案例隨後有 86%
    發生向上突破。


    某些分析家認為，擴張頂排列屬於空頭型態，即使擴張頂沒有向下突破，隨後也應該很快就發生趨勢反轉。我瀏覽相關的資料庫，觀察前述結論是否正確。對於向上突破的排列，只有
    41% 的案例在隨後 3 個月內出現最後峰位。換言之，向上突破擴張頂代表頭部反轉型態的可能性不到一半。向下突破的情況稍微好一點，數據為 47%，但仍然不足以支持前述結論。所以，按照我的統計數據顯示，擴張頂排列不代表上升趨勢已經結束，即使該排列向下突破也是如此。


