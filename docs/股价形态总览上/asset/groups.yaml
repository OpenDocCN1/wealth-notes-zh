    頸線與肩部高度有兩個意外發現。頸線向下傾斜的排列，績效稍優於頸線向上傾斜，前者的平均跌幅爲 27%，後者爲 26%。同樣地，最外側左肩高度超過對應的右肩，平均跌幅爲
    28%；反之，最外側右肩高度超過對應的左肩，平均跌幅爲 27%。可是，這兩種情況的績效差異都不存在統計上的顯著意義（換言之，可能純屬巧合）。


