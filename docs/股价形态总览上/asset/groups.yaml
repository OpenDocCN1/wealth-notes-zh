    某些技術分析者相信，突破會發生在觸及點數較少的一邊。對於 5 點反轉排列（上側有 3 個觸及點，下側有 2 個觸及點），突破的方向應該朝下。我的資料庫中總共有
    30 個 5 點反轉案例，其中只有 47% 向下突破。


    逆向的 5 點反轉排列又如何呢？這類排列有 2 個轉折高點與 3 個轉折低點。統計數據顯示，這類排列向上突破的案例數量是向下突破的兩倍（68% 對 32%）。可是，我希望強調一點，還有
    36 個案例的觸及點超過 5 個。換言之，不論順向或逆向，5 點反轉會繼續發展，來回觸及對側趨勢線。一旦發生這種情況，就已經不屬於 5 點反轉排列。總之，不論
    5 點反轉或其逆向排列，完全都沒有任何神奇之處。它們都屬於擴張排列，我實在找不出它們有任何特殊的性質。


    ## 交易戰術


    表 4.5 列示擴張頂排列的交易戰術。首先考慮突破之後的目標價位衡量法則。對於大多數排列來說，最低目標價位的衡量方法是計算排列的高度，然後由突破點向上或向下衡量。擴張排列的目標價位也適用這種衡量方法。請參考圖
    4.6，排列高度是排列最高價（$12^{1}/_{8}$）減去最低價（$10$），相當於 $2^{1}/_{8}$。這個例子向上突破，由突破點（也是排列最高價
    $12^{1}/_{8}$）向上衡量排列高度，目標價位是 $14^{1}/_{4}(=12^{1}/_{8}+2^{1}/_{8})$。


    ### Esterline Technologies.（精密儀器，NYSE，代碼 ESL）


    ![](img/843a88de0b50d7a36e65238281a4e722_122_0.png)


    圖 4.6 衡量目標價位。首先，計算排列的高度，把排列最高價減去排列最低價。其次，由突破點向上或向下衡量排列高度（衡量方向取決於向上或向下突破），結果就是突破之後的目標價位。


    衡量法則或目標價位有什麼用處呢？假定你考慮買進圖 4.6 的股票。由於不能確定擴張頂排列的突破方向，所以很難設定長期的進場點。針對這個排列，最簡單的操作方法是在股價觸及下側趨勢線而向上反轉的時候買進。


    擴張排列至少需要兩個轉折高點與兩個轉折低點才能確定，所以圖 4.6 的 A 點代表一個可能的進場買點。實際下單買進之前，透過衡量法則計算目標價位。目標價位可以協助你評估這筆交易的風險／報酬關係。就圖
    4.6 的例子，當股票由 A 點向上反彈，進場買進的價位大約是$10^{3/8}$，目標價位爲$14^{1/4}$，


    ### 表 4.5 擴張頂的交易戰術


    | 交易戰術 | 解釋 |

    |---|---|

    | 衡量法則 | 設定排列內的最高價與最低價，計算兩者的距離。由排列最高點或最低點，向上或向下衡量前述的距離，結果就是向上突破或向下突破的目標價位。 |

    | 低點買進 | 一旦辨識擴張頂排列之後，買點設定在股票於低點向上轉折的位置。 |

    | 多頭停損 | 停損點設定在轉折低點下側 $1/8$ 點處，防範趨勢向下反轉。 |

    | 高點放空 | 賣點設定在股票於高點向下轉折的位置。 |

    | 空頭停損 | 停損設定在轉折高點上側 $1/8$ 點處。當股價觸及下側趨勢線而向上轉折，回補空頭部位。如果排列向下突破，在目標價位或任何支撐水準附近回補。
    |

    | 調整停止點 | 一旦價格穿越前一個轉折高點（多頭部位），將停止點調高到前一個轉折低點；一旦價格穿越前一個轉折低點（空頭部位），將停止點調降到前一個轉折高點。
    |

    | 其他 | 如果擴張頂出現部分跌勢，可以考慮做多。一旦向上突破，可以考慮加碼。 |


    潛在報酬率爲 $37\%$。這筆交易的停損點設定在 $A$ 點（$\$ 10$）下側 $1/8$ 點處，大約是 $\$ 9^{7/8}$，所以潛在損失爲 $5\%$。整體而言，這筆交易的風險
    / 報酬關係是 $1:7$，非常理想的比率關係$^{*}$。


    > $^{*}$ 譯按：此處有一個大問題，當價格由 $A$ 點向上反彈，如何判斷這個擴張頂排列已經結束？換言之，當你考慮進場買進的時候，根本不知道排列最高點與最低點究竟在哪裡，自然也不能計算目標價位。就算排列已經結束，上檔目標價位
    $\$ 14^{1/4}$ 代表向上突破之後的目標價位，顯然不適用於 $A$ 點的買進部位。事實上，在 $A$ 點買進，應該是針對橫向走勢進行交易，不是向上突破。


    排列向上突破之後，目標價格達成率為 75%。這意味著價格向上突破的時候，前述買進部位沒有必要急著脫手，可以讓獲利持續擴大。


    當價格觸及下側趨勢線而反彈，進場買進股票。停損設定在最近轉折低點下側（A 點下側 1/8 點處）。


    如果股票不能向上突破，這個部位或許可以掌握價格攀升到上側趨勢線的 20% 漲幅。價格由下側趨勢線向上反彈，該處代表買點；當走勢向上穿越前一個轉折高點，就應該準備獲利了結。價格可能在此向下轉折，或稍作停頓，然後繼續挺進到上側趨勢線。務必調高停止賣點，保障既有的一部分獲利。


    向下突破的目標價位又如何呢？同樣地，由突破點（$10$）向下衡量排列高度（$2^{1}/_{8}$），結果是$7^{7}/_{8}$。換言之，如果價格向下突破，至少應該會跌到$7^{7}/_{8}$。可是，向下突破的目標價位達成率只有
    64%，顯然不太可靠。


    針對擴張頂排列建立空頭部位，進場點可以考慮價格觸及上側趨勢線（圖 4.6 的 B 點）而向下反轉的時機。停損點設定在最近轉折高點（B 點$12^{1}/_{4}$）的上方
    1/8 點處。一旦股價到達 A 點附近（換言之，跌破 B 點之前的轉折低點），就把停損點調降到前一個轉折高點（譯按：B 點之前的轉折高點），或者是擴張頂的頂點*（目前這個例子是
    $11^{1}/_{8}$ 或 $11^{7}/_{8}$）。某些


    > * 譯按：上側與下側趨勢線朝向左方的交會點（朝右方則發散）。


    情況下，股價在距離下側趨勢線很遠的地方就向上回升；另一些情況下，價格在回升或繼續下跌之前，可能出現一段相當長的橫向盤整走勢。向下調整停止點，至少可以保障一部分的既有獲利。


    最後，讓我們考慮部分漲勢或部分跌勢的戰術運用。當價格朝下（朝上）發展，但還沒有靠近下側（上側）趨勢線之前，又朝上（朝下）發展，這種走勢稱爲部分跌勢（漲勢）。一旦發生部分跌勢（部分漲勢），隨後經常立即向上（向下）突破。所以，當你察覺部分跌勢（部分漲勢），可以立即進場建立多頭部位（或空頭部位），突破實際發生的時候，可以考慮加碼。


    ## 交易範例


    周小姐對於股票市場一直很感興趣，但始終沒有足夠的資金參與投資。所以，她經常進行一些紙上模擬交易，夢想有一天能夠實際進場。不久，她的父母在一場車禍中不幸喪生。


    往後一年的日子非常難熬，因爲周小姐與父母親的感情很好，很難忍受這種意外的變化。於是，她養了一條狗，希望彌補一些空虛，但畢竟不一樣了。還好，她的父母都有保險，也有一點儲蓄，完全都由她繼承。繳納遺產稅之後，周小姐突然發現自己實在沒有必要繼續工作。「爲什麼要等到健康狀態惡化之後？我可能與父母親一樣早死？」所以，她在
    29 歲就退休了。


    周小姐盤算著，如果儘量省吃儉用，或許就不需用儲蓄。於是，她繳清房屋與汽車貸款，也付清信用卡欠款，同時決定不再外出用餐。整個生活方式都改變了，但她有一個絕對不願妥協的願望：股票交易。


    在某家經紀商開戶之後，她開始等待最好的機會，最後終於找到圖 4.6 的股票。她很早就察覺這個擴張頂排列，掌握突破之前的進場點。當股票觸及 A 點的兩天之後，她下單買進，成交價格是$10^{1}/_{2}$。然後，她把停損點設定在
    A 點下側 1/8 點處（$9^{7}/_{8}$），潛在損失為 6%。


    周小姐運用衡量公式計算上檔的目標價位為$14^{1}/_{4}$。如果一切都順利的話，這筆交易的報酬率將超過 35%。建立部位之後，她開始等待，但繼續留意行情的發展。當價格攀升到先前的高點（B
    點）附近，走勢陷入停頓。她懷疑股價可能向下反轉，考慮是否應該獲利了結，最後還是決定繼續持有多頭部位。經過幾天，她發現一個旗形排列，期待這是飄揚在旗桿中點的旗形（旗形排列通常是連續型態，發生在既有趨勢的中點）。如果真是如此，旗形突破之後的上檔目標價位為$13^{1}/_{4}$（這段走勢的起點在$10$，走勢中點設定為旗形最低點$11^{1}/_{8}$，由旗形頭部$12^{1}/_{8}$向上衡量：$12^{1}/_{8}+[11^{1}/_{8}–10]=$13^{1}/_{4}$）。


