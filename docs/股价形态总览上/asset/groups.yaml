    # 統計數據


    為了瞭解排列的一般性表現，我在資料庫內搜尋數百個案例，將它們的統計數據編製為表格。請參考表 7.2。相對於其他排列，蹦跳-奔馳底部排列的案例很多，在 2,500
    支股票的日線圖資料中發生 360 次。在這些案例中，55%屬於反轉排列，45%屬於連續排列。


