    ## 表 9.1 處理帶柄杯狀排列的兩種方法


    | 歐尼爾的準則 | 未經過滤的篩選準則 | 過滤的篩選準則：歐尼爾的解釋 |

    | :--- | :--- | :--- |

    | 顯示相對強度 | 無 | 無，沒有相關資料 |

    | 先前的上升趨勢出現顯著大量 | 無 | 構成杯狀的漲勢，呈現顯著大量 |

    | 杯狀發生之前至少發生 30% 的漲勢 | 相同 | 相同 |

    | U 形杯狀 | 相同 | 相同 |

    | 允許沒有柄部的杯狀 | 必須存在柄部 | 必須存在柄部 |

    | 杯狀期間：7~65 星期 | 相同 | 相同 |

    | 杯子深度：12%~33% 或 15%~33%。某些跌幅為 40% 到 50% | 無 | 12%~33% |

    | 柄狀期間：通常至少 1~2 個星期 | 最少 1 星期 | 最少 1 星期 |

    | 柄部價格趨勢朝下 | 無 | 相同 |

    | 柄部成交量趨勢朝下 | 無 | 相同 |

    | 杯柄右側末端位在杯子的上半部 | 挑選柄部看起來位在上半部的案例；16% 位在下半部而靠近中間，仍然挑選 | 相同 |

    | 柄部位在 200 天移動平均之上 | 無 | 柄部最低價在 200 天移動平均之上 |

    | 由高價起算的柄部價格應該下跌 10%~15%，除非是非常大型的杯狀 | 無 | 由杯子右緣高價到柄部最低價的跌幅必須是 15% 或以下 |

    | 大量突破，至少是正常量的 50% 以上 | 無 | 突破量至少是 25 天移動平均的 50% 以上 |

    | 帶柄碟狀的杯子較淺 | 無 | 不另做區別 |

    | 沒有建議 | 杯緣落在大致相同的價位 | 杯緣落在大致相同的價位 |


    附註：中央欄位的未過滤準則績效最理想。所謂「相同」是指左側準則而言。


    由表 9.1 可以發現，我忽略歐尼爾的許多準則。在我收集相關的案例之後，接著運用我對於歐尼爾準則的解釋來進行過濾。這兩種——未過濾與過濾——方法產生兩組績效統計數據。可是，討論統計數據之前，讓我們先看看一些例子。


    前文曾經提到，圖 9.1 不符合歐尼爾的準則。為什麼？杯子的深度為 54%，超過歐尼爾的設定（50%）。另外，柄部的趨勢是朝上，不是朝下。我利用線性迴歸的方法，分析杯狀右緣到突破點之間的價格與成交量型態。排除杯狀右緣與突破日的兩天資料，往往有助於避開不尋常的重大價格走勢。剩餘的資料都採用收盤價計算（關於柄部價格趨勢）。


    圖 9.2 提供一個很好的範例（這是指 6 月份到 11 月份之間的排列）。杯子呈現非常緩和的圓弧狀，向上攀升而稍微穿越先前的高點，然後停頓，出現柄部的回撤整理，成交量型態也呈現下降趨勢。接著，價格夾著大量向上突破。突破之後的第二天，價格稍微下滑，測試杯狀右緣。這屬於短暫的回挫走勢
    (throwback)，但很快又恢復漲勢。在不到兩個月的期間內，股價創$15½的頭部，漲幅為 22%。


    在這個排列的兩側，各有一個失敗的杯狀排列（只顯示部分的走勢）。左側的型態向下突破，右側型態突破之後沒有發生 5%的跟進漲勢。只有 6 月份到 11 月份的排列屬於成功的案例，但突破之後的漲幅也不太可觀。在「統計數據」一節中，我們將發現很多帶柄杯狀排列的漲幅都不太大。


    圖 9.3 顯示週線圖上的帶柄杯狀排列。在搜尋各種價格型態的過程中，我發現週線圖經常是辨識型態的捷徑。當然，我也會觀察日線圖的資料，藉以評估週線型態，尋找一些可能遺漏的排列。


