    稍後的「交易戰術」一節會討論目標價位的衡量方法。頭肩底排列的目標價位達成率為 83%，相當不錯（我認為達成率在 80% 以上就屬於可靠的型態）。


    排列長度是由左肩谷底衡量到右肩谷底，平均為 2½ 個月。這個數據顯然低估，因為沒有包括左肩的下跌走勢與右肩上漲到突破點的過程。某些情況下，右肩完成之後，還要幾個星期才能向上突破。


    在排列發展過程內，大約三分之二案例（62%）的成交量型態呈現下降趨勢。我針對兩肩之間的成交量進行迴歸分析，統計研究支持肉眼觀察的結果：左肩的成交量通常最大，其次是頭部，右肩的成交量顯著萎縮。


    頸線的傾斜方向或兩肩的高度，對於突破之後的漲勢是否構成影響？我發現這些問題的答案與傳統的預期大不相同。對於向上傾斜的頸線（左肩與頭所夾的轉折高點位置，低於頭與右肩所夾的轉折高點），排列的平均漲幅為
