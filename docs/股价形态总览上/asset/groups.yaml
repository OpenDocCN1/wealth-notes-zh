    \ 4 個案例則在重挫之後立即恢復漲勢。\n\n由重大利空消息發生前一天的高點衡量到最終低點，平均跌幅為 37%。最終低點通常也是額外跌勢的低點——股價重挫而向上反彈之後，額外跌勢所出現的最低價位。\n\
