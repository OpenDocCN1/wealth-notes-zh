    C 點）——遠低於杯子高度的中點。


    ### 失敗案例


    如同大多數其他排列一樣，帶柄杯狀排列也有兩種失敗類型。圖 9.5 顯示第一種失敗類型。杯狀排列發生之前的漲勢，起始於 1993 年 12 月中旬的$15½附近，一直持續到杯口左緣的$24³/₈。然後，價格向下反轉，杯底出現巨幅波動的走勢。回升走勢確定之後，價格趨於穩定，緩步攀升到杯口右緣。


    Augat Inc.（電子，NYSE，代碼 AUG）


    ![](img/843a88de0b50d7a36e65238281a4e722_231_0.png)


    圖 9.5 向下突破的帶柄杯狀排列。這個案例可以視為一項警告，如果希望買進，最好等待價格向上突破杯口外緣。這個帶柄杯狀排列演變為雙重頂。


    價格創新高的前一天爆出大量。隔天創新高之後，股價在高檔盤旋三天，然後回挫。柄部大約位在$22½~$24 之間。


    柄期間的成交量趨勢向下傾斜，符合正常的發展。不久，價格跌破柄部低點，稍微回升到柄部下緣，接著又下跌。股票由此展開另一段跌勢，低點發生在 1995 年 1 月底的
    $14\frac{1}{2}$，由杯口右緣衡量的跌幅為 $42\%$。


    觀察圖 9.5 的帶柄杯狀排列，看不出有什麼不尋常的發展。杯口右緣的高度稍微超過左緣；兩邊的高度稍有差異，這屬於正常的現象。某些案例的杯口左緣較高，另一些案例的杯口右緣較高。


    杯狀形成過程中，成交量大約維持平均水準。事實上，你所觀察的是雙重頂空頭型態，不是帶柄杯狀排列。兩個峰位的間距很寬，一個發生在 3 月份，另一個發生在 8 月份。


    帶柄杯狀排列的大部分失敗案例都是向下突破。在我們所觀察的失敗案例中，74 個向下突破，其中只有兩個向上反轉，出現 5%以上的漲幅。


    第二種失敗類型是價格向上突破，但沒有出現 5%或以上的跟進漲勢，然後股價又下跌。請參考圖 9.6。在杯狀形成之前，股價由$33 上漲到$45。杯子的左、右兩緣價位大約相當。柄部本身似乎也形成杯狀排列。9
    月底，價格快速上漲，直接


    ![](img/843a88de0b50d7a36e65238281a4e722_232_0.png)


    ![](img/843a88de0b50d7a36e65238281a4e722_232_1.png)


    圖 9.6 帶柄杯狀排列的 5%失敗案例。價格雖然向上突破，但沒有出現 5%或以上的跟進漲勢，結果又向下反轉。


    穿越杯口右緣，並且繼續走高。可是，這段漲勢沒有維持很久，創$47⁷/₈ 的高價之後，在高檔大約盤旋 3 個星期，接著展開一段急跌走勢。兩個月之後，股價創$37⁵/₈
    的低點。由杯口右緣的突破點向上衡量到最高價$47⁷/₈，漲幅稍低於 5%。所以，這屬於 5% 失敗的案例。在所有向上突破的排列中，只有 30 個案例（相當於
    10%）沒有出現 5%以上的跟進漲勢。就統計數據觀察，只要排列向上突破之後，似乎都會繼續上漲——至少上漲 5%。


    ### 統計數據


    如同前文解釋的，我先用自己的準則挑選帶柄杯狀排列，然後按照我對於歐尼爾準則的解釋，篩除不符合的案例，相關的結果請參考表 9.2。在我所挑選的案例中，只有 9%符合歐尼爾的準則（準則內容請參考表
    9.1）。在這些符合的案例中，只有 62%出現預期的表現。換言之，38%的案例失敗，或是向下突破，或是向上突破之後沒有出現 5%以上的跟進漲勢。成功案例的平均漲幅為
    34%，但最經常發生漲幅只有 15%。由於總共只有 23 個成功案例（樣本實在太小），決定最經常發生漲幅的次數分配未必可靠，但基本上還是符合未經過濾排列的數據（10%~20%）。


    歐尼爾認為，杯狀排列發生之前的漲勢中，某個階段應該出現大量。這個準則只剔除四個案例（三個失敗，一個漲幅為 22%）。可是，納入這四個案例，失敗率將提高。未經過濾的篩選準則並不包含這個條件。


    ## 表 9.2 統計數據或結果：運用歐尼爾準則過濾的帶柄杯狀排列


    | 說明 | 統計數據或結果 |

    |---|---|

    | 排列數量 | 37/391 相當於 9% |

    | 失敗率 | 14/37 相當於 38% |

    | 成功排列的平均漲幅 | 34%，最經常發生漲幅為 15% |

    | 先前上升趨勢內成交量顯著增加的現象是否重要？ | 不重要，只剔除 4 個案例（如果包含在內，績效轉差） |

    | 杯狀長度介於 7~65 星期是否重要？ | 不知道，所有的案例都落在這個區間內 |

    | 杯狀長度與最後漲幅之間是否存在關聯？ | 無。隨機關係 |

    | 杯子深度（12%~33%）是否有助於排列績效？ | 無。有害而侷限績效 |

    | 柄部期間長度（至少 1 星期）是否重要？ | 不知道，期間更短的柄部案例被剔除 |

    | 柄部價格趨勢朝下，對於排列績效是否重要？ | 無。有害績效 |

    | 柄部位在杯子上半部的條件是否重要？ | 是，但篩選過程中，基本上就挑選符合這個條件的對象 |

    | 柄部低點位在 200 天移動平均之上，這個條件是否重要？ | 不，對於績效沒有影響 |

    | 柄部低點距離杯口右線的距離少於 15%，這個條件是否重要？ | 不，對於績效沒有影響 |

    | 突破過程的成交量放大，這個條件對於排列績效是否重要？ | 有，但影響有限 |

    | 杯子深度與最後漲幅之間是否存在關聯？ | 無。隨機關係 |


    杯狀長度對於排列績效是否重要？我所挑選的全部案例，杯狀長度都落在 7~65 星期之內。另外，我希望知道杯子深度與排列績效之間的關聯，於是繪製兩者之間的散佈圖（scatter
    plot，譯按：類似圖 9.8），結果顯示它們不存在統計上顯著的關係。


    對於杯子深度做限制，是否能夠改善績效？設定杯子深度的限制，對於績效都會產生有害影響。把最低深度由 12%調高到 30%，最大深度由 33%調整到 55%（換言之，杯子深度介於
    30%~55%之間），失敗率與平均漲幅都有所改善，前者由 38%降低為 33%，後者由 34%上升為 36%。在我採用的未經過濾準則，沒有針對杯子深度做限制。


    我挑選的所有案例，柄部期間都至少是一個星期。所以，我不知道這個條件是否重要。


    柄部期間的價格與成交量趨勢向下傾斜，這兩個條件對於排列績效都有不利影響。剔除這兩方面的限制，失敗率會降低，平均漲幅會提高。採用過濾準則篩選的排列績效較差，主要原因就是目前這兩個條件。


    柄部低價的位置是否重要？這個問題可以由兩方面來回答。我發現，柄部低點應該保持在杯子的上半部（篩選過程中，基本上就挑選符合這個條件的對象，所以這方面的分析並不客觀），但柄部低點是否必須高於
    200 天價格移動平均，以及柄部低點由杯口右緣下跌的幅度是否應該保持在 15%之內，似乎都沒有關聯。


    突破當時的成交量是否重要？剔除這個條件，對於排列續效產生不利影響，但程度非常有限。


    歐尼爾把相關的排列區分爲帶柄杯狀與帶柄碟狀型態，兩者的差別只在於杯子深度，前一頁已經討論杯子深度與排列續效之間的關係。可是，我希望知道杯子深度與平均漲幅之間是否存在顯著的關聯。在未經篩選準則挑選的案例中，我繪製杯子深度與平均漲幅之間的散佈圖，結果顯示兩者之間只存在隨機關係。對於經過篩選的案例，散佈圖同樣顯示隨機關係，但樣本數量太小而缺乏統計意義。


