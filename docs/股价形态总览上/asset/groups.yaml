    ## 複雜頭肩底排列


    ![](img/843a88de0b50d7a36e65238281a4e722_437_0.png)


    ### 摘要資料


    **外觀**


    多個肩 / 多個頭的頭肩底排列。


    **反轉或整理**


    長期的（超過 6 個月）多頭反轉排列。


    **失敗率**


    6%。


    **平均漲幅**


    37%，最經常發生漲幅為 20%~30%。


    **成交量趨勢**


    下降趨勢。


    **回撤**


    47%。


    **價格目標達成率**


    82%。


    **意外發現**


    - 頭線朝右下方傾斜，績效較理想。

    - 大量突破的績效較理想。


    **參閱排列**


    - （9）帶柄杯狀排列

    - （12）雙重底排列

    - （18）頭肩底排列

    - （22）雙角底排列

    - （34）圓形底排列


    複雜頭肩底排列（complex head-and-shoulders bottom）的辨識困難程度，稍高於常態的頭肩底排列，但相差有限。畢竟來說，如果你知道如何辨識常態的排列，自然就能辨識複雜的型態。如果你觀察常態頭肩底的兩側，發現還有另外的肩部，就屬於多肩的複雜頭肩底型態。更深入探討型態辨識準則之前，或許應該稍微討論這個排列的重要統計數據。


    排列的失敗率只有 6%，非常不錯的績效。在全部 239 個案例中，只有 15 個排列沒有發生預期中的走勢。排列的平均漲幅高達 37%，目標價位的達成率為 82%，這些績效讀數都很高。複雜頭肩底排列屬於值得操作的型態。


    關於這個排列，我有兩個有趣的發現。當頸線朝右下方傾斜，股票的績效表現較好，平均漲幅為 39%（頸線朝右上方傾斜的案例，平均漲幅為 34%）。突破過程出現大量的排列，績效比較理想，平均漲幅為
    39%（小量突破的案例，平均漲幅為 32%）。細節內容請參考「統計數據」一節。


    ## 緣起


    複雜頭肩底排列有兩種不同的基本類型：多肩與多頭。請參考圖 19.1 的例子，這是一個雙肩的型態，總共有兩個左肩，一個頭，兩個右肩。當你瀏覽價格走勢圖，很容易從這份圖形中發現常態的頭肩底排列，介於
    11 月初到 1 月底之間的兩肩與頭部非常明確。可是，如果繼續觀察這個常態排列的兩側，還會發現另一組肩部，另一個左肩發生在 10 月初，另一右肩發生在 2
    月底。以頭為中心，左、右肩相當對稱——不論就價位或時間距離而言。


    ![](img/843a88de0b50d7a36e65238281a4e722_439_0.png)


    **圖 19.1 雙肩的複雜頭肩底排列。請注意水平狀頸線與回撤走勢。這個排列屬於圓形底的一部分。**


    由價格走勢本身來說，這是一個相當典型的複雜頭肩底型態。可是，成交量的情況有些不尋常，因爲右半邊的成交量大於左半邊。


    由另一個角度觀察，圖 19.1 也是圓形底排列（rounding bottom），雖然成交量沒有呈現向下凹的圓弧狀，但整個走勢外觀是平緩的半圓形（利用一條曲線銜接轉折低點，看起來更清楚）。不論是圓形底或複雜頭肩底排列，兩者都屬於多頭反轉排列。


    價格向上突破頸線之後，一度重新回挫到頸線附近，這種走勢經常發生在頭頂底家族，尤其是複雜的型態。雖然在頸線邊緣盤整 1、2 個星期，但隨後的漲勢還是非常俐落，最高曾經觸及$32⁵⁄₈$。


    ![](img/843a88de0b50d7a36e65238281a4e722_440_0.png)

    ![](img/843a88de0b50d7a36e65238281a4e722_440_1.png)


    **圖 19.2 兩個頭的複雜頭頂底排列。左半邊的成交量大於右半邊。**


    圖 19.2 是兩個頭的複雜型態。整個排列的左、右兩邊也相當對稱：頭對應頭，左肩對應右肩。銜接排列轉折高點的頸線，繼續向右延伸，直到收盤價向上穿越為止。價格向上穿越頸線，稱為突破，也是型態完成的時候。


    圖 19.2 的突破發生在 11 月中旬，然後立即回挫，停留在頸線之下大約一、兩個星期。股價回升，向上穿越頸線；可是，不久，價格又短暫跌破頸線，但立即彈升，並且緩步走高。3
    月底，股價創$16\frac{5}{8}$的高價，相對於排列最低點為$9\frac{9}{16}$。


    在這個例子中，排列左半邊的成交量大於右半邊。相對於圖 19.1，圖 19.2 的成交量型態比較標準。


    ## 辨識準則


    是否有一組簡易的準則可供辨識頭肩底排列？有的，請參考表 19.1。如同前文說明的，複雜頭肩底排列有兩種基本類型：多肩與多頭的型態（很少排列同時呈現多頭與多肩的情況）。圖
    19.3 顯示多肩的頭肩底排列案例。「頭」的位置顯著低於兩「肩」，有別於三重底排列（triple bottom）。就目前這個例子而言，我們可以看到一個清楚的常態頭肩底，兩側又各出現一個額外的肩部。整體排列形狀仍然呈現對稱。左側兩肩與右側兩肩的時間距離大致相同。可是，遠邊右肩的價位則顯著高於對應的遠邊左肩。然而，大體上來說，這個案例還是呈現複雜頭肩底排列的典型對稱性質。


    圖 19.3 顯示正常的成交量型態：兩個左肩的成交量稍高於兩個右肩。成交量的整體趨勢向下發展。


    ### 表 19.1 複雜頭肩底排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 形狀 | 多肩或多頭的頭肩底排列（在很罕見的情況下，也可能同時出現多肩與多頭）。頭的價位低於肩部，但差距通常不大。 |

    | 對稱性 | 以頭部為中心，排列呈現明顯的左、右對稱性。不論是肩部的價位，或肩部與頭的時間距離，大約都彼此對應。另外，左、右兩邊的肩部形狀也大致相同，都呈現圓滑或尖銳的結構。
    |

    | 成交量 | 一般來說，左半邊的成交量大於右半邊。整體成交量型態呈現下降趨勢。 |

    | 近乎水平狀的頸線 | 銜接排列中心兩側的轉折高點，這條直線即是頸線。大多數排列的頸線都呈現水平狀或近似水平狀。 |

    | 向上突破 | 收盤價向上穿越頸線，即是向上突破。如果頸線朝右上方傾斜的角度過大，把突破點設定為頭與最右側肩部之間的最高價。 |


    銜接「頭」部兩側最高峰位的直線，稱爲頸線。頸線大多爲水平狀；雖然這是主觀的認定，但我瀏覽整個資料庫的案例，確實有 74% 的排列頸線大體呈現水平狀（包括本章提供的例子）。


    如果頸線向上傾斜的角度很大，不妨考慮把排列最高價視為突破點。利用過度傾斜的頸線衡量突破點，進場時效可能太遲；當收盤價突破頸線的時候，上檔空間或許已經不大，不值得進行操作。


    一旦收盤價穿越頸線，排列即告突破，這也是頭肩底型態正式完成的時刻。向上突破之後，價格經常回挫到頸線附近，甚至跌破頸線之後才回升。請參考圖 19.2，12 月份曾經發生回挫走勢，價格由$11\frac{1}{2}$下跌到$9\frac{7}{16}$，兩天之內幾乎暴跌
    20%。

