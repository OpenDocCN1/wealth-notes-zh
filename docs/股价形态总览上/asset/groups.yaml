    經過幾個星期，他所等待的買進訊號始終沒有出現。最後，股價終於向上突破內杯的杯緣，但小明錯失進場的機會，因爲當他觀察股價走勢圖的時候，已經發生回撤走勢。所以，他決定等待價格重新穿越
    C 點才進場。


    這發生在 5 月 9 日，他女朋友生日的前一天。感受到某種喜兆，他按照當天的收盤價$15¼在紙上記錄買進。隔天，生日聚會，女朋友對於自己的生日禮物顯然不滿意，而且當天的價格還收低。


