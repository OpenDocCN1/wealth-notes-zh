    1 個月。所謂「突破」，是指收盤價穿越到排列最高價之上或最低價之下。


    在我所考慮的 100 個向上突破案例中，最終高點大約發生在突破之後的半年（166 天）。向下突破的最終低點大約發生在突破之後的 4 個月（129 天）。後者的時間較短，這是相


