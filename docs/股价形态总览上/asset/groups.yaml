    # Varity Corp.（機械，NYSE，代碼 VAT）


    ![](img/843a88de0b50d7a36e65238281a4e722_194_0.png)


    經過兩個多月的醞釀之後，1992 年 3 月 27 日（星期五）的週線終於穿越下降趨勢線。收盤價向上突破，BARR 底部排列正式完成。老周是否進場買進？幾個月以來，繼續留意這支股票的發展，每個星期都看著股價走高，他覺得滿肚子的怒火，終於放棄追蹤。


    1994 年 4 月，老周偶然又看到這支股票，發現當時的股價為$50^{1}/8$，由 1991 年低價起算的漲幅超過 370%。如果當初沒有賣掉持股，現在的獲利超過$3,000。


    老周究竟犯了哪些錯誤？這可以由幾方面考量。他沒有等到價格正式突破下降趨勢線，否則買進價格會更低。其次，他沒有及早認賠。買進股票之後，應該設定停損點，當股價向上穿越中間趨勢線之後，停損點應該調整到中間趨勢線的稍下方。若是如此，賣出價位大約是
    $17^{7/8}$，稍低於買進價位 $18^{1/4}$。可是，老周實際上沒有這麼做，他看著股價下跌，讓短線交易套牢而成爲長期投資。


    當老周最後放棄指望的時候，股價已經下跌到最低點附近。事實上，很多投資人都處於相同的境遇，這可以由 1991 年 11 月與 12 月發生的大成交量看出來。初學的投資人總是買在頭部附近，賣在底部附近，這與正確的做法剛好相反。


    可是，這個教訓也帶來一些正面的效益。老周現在都會等待確認突破的訊號，然後才進場建立部位，而且任何部位都會設定停損，藉以侷限損失。這是否意味著老周將因此而成為交易者的典範？當然不是，因爲他現在又面臨一些其他問題，觸犯一些其他錯誤。


    # 蹦跳-奔馳

    頭部反轉排列


    ![](img/843a88de0b50d7a36e65238281a4e722_197_0.png)


    # 摘要資料


    - 外觀：狀似開口朝下的煎鍋，柄部在左邊。柄部構成上升趨勢線，然後進入漲勢加快的鍋底。

    - 反轉或整理：短期的（少於 3 個月），空頭反轉排列。

    - 失敗率：19%。

    - 平均跌幅：24%，最經常發生跌幅 15%。

    - 回挫：39%。

    - 價格目標達成率：88%。

    - 參閱排列：（33）圓形頂排列。


    假定你考慮買進某家公司的股票，如果你能夠確定明天的價格一定比今天低，那不是太棒了嗎？可是，如何能夠知道明天的價格呢？這就是我發現 BARR 頭部排列當時所考慮的問題。我嘗試找到某種可靠的方法，判斷明天的價格高於或低於今天水準？差距是多少？


    我透過各種數學公式，嘗試提高預測的精確性，但效果非常有限。於是，我改用視覺的方法。在股價走勢圖上繪製趨勢線，試圖判斷股價跌破趨勢線的程度。我觀察各種走勢圖與趨勢線，希望找到趨勢線與隨後突破走勢之間的關係。結果，我發現蹦跳-奔馳排列（bump-and-run
    formation，簡稱 BARF）。稍後，我考慮這個排列的名稱問題，投資界或許不認同這個新排列的有效性。所以，我決定採用一個比較生動力的名稱：蹦跳-奔馳反轉（bump-and-run
    reversal）排列，簡稱為 BARR。


    ## 緣起


    研究趨勢線的過程中，我發現趨勢線突破具有一些共通的特質。請參考圖 8.1，這是一個典型的蹦跳-奔馳反轉排列，整體形狀看起來像是一座山。山腳的起點相當平緩，雖然地形稍有起伏，但大體上沿著上升坡道（上升趨勢線）發展。排列起點的成交量放大，但很快又萎縮。山峰本身（蹦跳階段）相當高聳，成交量也很大。價格穿越峰位之後，投資熱潮沒有馬上消退，這反映在頭部的大量上。在山峰的盡頭，價格突然重挫，而且持續下跌。這就是典型的蹦跳-奔馳排列：價格蹦跳向上，然後反轉向下奔馳。這個排列的形狀，可以充分反映買进的動能。最初，排列是沿著上升趨勢線發展，凸顯投資人買進股票的熱切意願。隨著時間過，買方不斷提高叫價，藉以吸引賣方拋出股票，所以價格持續上揚。


    # Fieldcrest Cannon Inc.（紡織，NYSE，代碼 FLD）


    ![](img/843a88de0b50d7a36e65238281a4e722_199_0.png)


    圖 8.1 蹦跳-奔馳頭部反轉排列。前奏階段沿著上升趨勢線發展；蹦跳階段呈現三級跳的走勢；奔馳階段向下崩跌。排列起點與蹦跳階段的起點，成交量通常都會放大，價格經過峰位之後，成交量通常都會逐漸萎縮。跌破趨勢線的過程中，大約有半數案例的成交量會擴大。


    股價上升趨勢吸引其他的動能玩家。當公司宣佈理想的盈餘報告之後，很多投資人紛紛跳上車。這也是蹦跳階段的開始。股價夾著大量快速上漲。急遽的漲勢又吸引更多的交易者，使得股價更進一步走高。所以，蹦跳階段形成一條更陡峭的上升趨勢線。接著，情況開始不對勁了。


    上升動能持續發展，直到供給籌碼超過需求力道爲止。這種情況下，漲勢逐漸鈍化，精明資金的態度轉趨謹慎。投資熱潮退燒，供需之間的戰況開始逆轉。股價出現峰位而向下反轉。一旦察覺股價下跌，精明資金快速奔向出口，更加速下跌的走勢。下降動能開始加速發展，把股價壓到上升趨勢線附近。在這個關卡，股價可能直接跌破上升趨勢線（如圖
    8.1 顯示的情況），但買進意願也可能轉強，使得股價向上反彈而嘗試最後一搏。一般來說，趨勢線上緣的反彈力道通常有限，價格很快又恢復跌勢。


    股價突破趨勢線的過程中，成交量通常會明顯擴大，這股拋售壓力會引起更多投資人的憂慮，又醞釀出更重的跌勢。經過幾個月的持續下跌之後，賣壓終於消退，下檔的買進力道止住跌勢。於是，價格暫時走穩，甚至向上反彈。一旦造成股價向下反轉的原因逐漸被淡忘之後，價格又恢復漲勢，一切又重新來過。


    ## 辨識準則


    表 8.1 顯示這種排列的各階段特質。圖 8.1 的趨勢線是沿著前奏階段的低點繪製而成，最後在 1994 年 5 月份被貫穿。排列最初的成交量放大，前奏階段的趨勢必須朝上發展。上升趨勢線大約向上傾斜
    30 度（實際的角度取決於圖形座標的刻度）。如果趨勢線呈現水平狀或近似水平狀，就不屬於理想的 BARR 排列。趨勢線向上傾斜，反映出投資人渴望買進的程度。可是，這條趨勢線也不能太陡峭。過分陡峭的趨勢線（超過
    60 度以上）沒有辦法保留足夠的空間讓蹦跳階段發展。


    | 特質 | 討論 |

    | :--- | :--- |

    | 上傾的趨勢線 | 排列最初階段，價格沿著上升趨勢線緩步走高。上升趨勢線一定向上傾斜，傾斜的角度大約介於 30~45 度之間（取決於圖形座標刻度）。最好避開趨勢線過分陡峭的排列（超過
    60 度），因為沒有足夠空間可供蹦跳階段發展。 |

    | 前奏階段與高度 | 前奏階段發生在排列初期（整體排列的最初四分之一部分），價格還沒有向上蹦跳之前。前奏階段的價格高度至少應該有$1（最好是 $2 或以上），高度是指每天最高價與對應上升趨勢線之間的垂直距離。前奏階段的長度最少
    1 個月，長度沒有上限。 |

    | 蹦跳階段 | 價格伴隨著大量快速上漲（上升趨勢線的傾斜角度介於 45~60 度之間），通常發生在大利多消息公佈之後（盈餘意外調高、分析家建議買進、銷售量調高或其他利多消息）。走勢最後創峰值而向下反轉，價格退回到
    30 度趨勢線附近。蹦跳階段的高度至少應該是前奏階段的兩倍，此處的高度也是衡量每天最高價與 30 度趨勢線之間的垂直距離。 |

    | 向下奔馳 | 價格退回趨勢線之後，可能反彈形成第二個蹦跳，或沿著趨勢線發展。最後，價格貫穿趨勢線而繼續下跌。 |


    排列的第一部分，稱爲前奏階段，由此進入蹦跳階段。前奏階段的期間長度至少必須是 1 個月，通常是 2、3 個月，但可以更長一些。這個階段的價格擺動幅度至少是$1（譯按：這是針對圖
    8.1 而言，股價大約在$20~$30 之間），這個擺動幅度又稱爲前奏階段的高度（利用整個排列最初四分之一部分的每天價格，衡量每天最高價與 30 度趨勢線之間的垂直距離，取最大的讀數）。


    就圖 8.1 而言，整體排列最初四分之一部分的最高價是 1994 年 1 月 12 日的$25^{5/8}，這個價位對應的趨勢線讀數爲$24^{1/4}，所以前奏階段的高度爲$1^{3/8}。這個高度很重要，因爲我們稍後評估蹦跳階段的最低高度，以及計算目標價位，都需要利用前奏階段的高度。關於前奏階段的高度，比較精確的衡量方法應該是計算趨勢線到每天高價之間的最大距離。對應這個最大距離的高價，未必是期間內的最高價。不論採用哪種方法衡量前奏階段的高度，結果應該不會有太大的差異。


    前奏階段的走勢相當平緩，似乎正在醞釀蹦跳階段的動力。價格雖然稍有起伏，但不會遠離上升趨勢線。如果你把整個排列視爲一座山，前奏階段就像山腳的步道。


    前奏階段的初期，成交量放大，這經常是因為排列開始之前所發生的重大事件。接著，成交量下降，一直到蹦跳階段開始才又突然放大。當時的成交量愈大，股價上漲的推升力道也愈足。請參考圖
    8.1，蹦跳階段開始於 2 月 17 日，伴隨著半年來的最大量。


    蹦跳階段的價格上漲速度加快，由 2 月中旬的低點$26^{1/2}，快漲到 3 月底的$34^{3/8}。這段期間內，成交量始終維持很大，一直到價格由峰位反轉，成交量才逐漸縮小。頭部發展過程中，曾經出現頭肩頂、雙重頂或三重頂的可能性。如果你認定當時的走勢確實是前述的型態，就完全遵照個別型態的意涵處理，不需再考慮蹦跳-奔馳頭部排列。


    蹦跳階段的高度——由該階段最高價衡量到趨勢線之間的距離——至少應該是前奏階段高度的兩倍。目前這個例子中，蹦跳階段的高度是 8 點（34³⁄₈-26³⁄₈），超過前奏階段高度
    1³⁄₈ 點的兩倍。


    兩個階段的高度至少要保持 2：1 的關係，這是我個人任意設定的比率，目的是藉以確定買進熱潮（或動能）已經呈現失控狀態。前奏階段的 30 度趨勢線，在蹦跳階段演變爲斜率更陡峭的趨勢線，顯示動能增加。股票很難長期維持這類陡峭的走勢，價格最後勢必下跌。圖
    8.1 顯示的情況正是如此。價格翻越峰位之後，開始下滑。這段跌勢有時候非常穩定，有時候波動非常劇烈。幾乎在所有的案例中，價格都回到 30 度趨勢線。由這裡開始，走勢可能出現幾種發展。股價可能反彈而出現第二個蹦跳階段，這稱爲兩個蹦跳的
    BARR 或雙重 BARR。BARR 偶爾也可能出現三個或以上的蹦跳，但最後的結果還是相同。價格最後都會跌破趨勢線。


    某些情況下，價格可能沿著趨勢線發展一段期間，然後才向下突破。當然，價格也可能毫不猶豫的直接買穿趨勢線，經過一段回升走勢，接著才展開正式的挫跌。只有極少數的案例，價格由蹦跳峰位下滑之後，還沒有回到趨勢線之前，又開始走高；這類的案例大多發生在週線圖或月線圖中。


    ## 失敗案例


    請參考圖 8.2 的週線圖，左側第一個 BARR 案例中，蹦跳階段初期出現大量，這屬於正常現象。蹦跳階段與前奏階段的高度關係很不錯（比率超過 2：1），顯示投資人買進的意願很高。可是，蹦跳階段的峰位出現之後，價格並沒有回到趨勢線附近，反而持續走高。


    其次考慮中間的 BARR 案例，排列本身的結構很完美，成交量型態也很正常：排列最初、蹦跳階段初期與突破過程都發生大量。可是，向下突破趨勢線之後，只出現 4%
    的跟進跌勢，這屬於 5% 失敗的案例。


    最右側的案例屬於雙重蹦跳-奔馳排列。1994 年 3 月份，價格形成第一個峰位之後，朝趨勢線方向拉回，然後又回升而形成第二個峰位，最後才跌破趨勢線。請注意，第二個峰位的高度通常低於第一個峰位。


    我們經常在週線圖或月線圖上看到相當長期的上升趨勢，如果上升趨勢內沒有出現明顯的價格向上蹦跳，就不能歸類為 BARR。排列初期的上升趨勢線斜率大約是 30 度，然後上漲速度加快，蹦跳階段本身的上升趨勢線斜率大約是
    60 度。


    # Caterpillar（營建／開礦機械，NYSE，代碼 CAT）


    ![](img/843a88de0b50d7a36e65238281a4e722_205_0.png)


    圖 8.2 週線圖的蹦跳-奔馳頭部反轉排列。左側排列之所以失敗，因為價格翻越蹦跳峰值之後，並沒有回到趨勢線，反而直接向上發展。第二個排列的形狀很標準，成交量型態也很好——排列起點、蹦跳起點與突破過程的成交量明顯放大。可是，價格跌破趨勢線之後，只發生
    4%的跟進跌勢。所以，這屬於 5% 失敗的案例。最右側是雙重蹦跳-奔馳反轉排列，價格在 3 月份形成第一個峰值，折返趨勢線之後又反彈形成第二個峰值，然後才跌破趨勢線。


    就圖 8.2 觀察，你或許認爲很多 BARR 案例都會出現最左側排列的失敗情況，但統計數據顯示的結果並非如此。在所有 BARR 頭部排列的案例中，只有 10%
    發生前述的向上突破。其餘 90% 的案例在形成蹦跳峰位之後都跌破趨勢線。在這些向下突破的排列中，10%的案例沒有發生 5%的跟進跌勢；換言之，情況類似於圖
    8.2 的中間排列，屬於 5%失敗案例。合計這兩種情況——向上突破與 5%失敗——BARR 排列的失敗率為 19% ，仍然低於我認爲可靠型態所允許發生的最高失敗率
    20%。


    如果等待收盤價跌破趨勢線，失敗率可以降低到 9%。「等待」可以提升排列的成功率，但多頭部位的獲利會減少（相對於在頭部附近賣出）。稍後的「交易戰術」一節，將討論如何在跌勢真正開始之前，在頭部附近賣出。如此一來，既有多頭部位的獲利不至於減少，新建立空頭部位的獲利潛能也能夠提高。


    ## 統計數據


    表 8.2 顯示蹦跳-奔馳頭部反轉排列的一般性統計數據。大多數案例（531 個，相當於 82%）屬於上升趨勢的反轉排列。排列完成之後，價格通常跌破上升趨勢線，而且出現
    5%的跟進跌勢（這類排列視為成功，比率爲 81%）。成功排列的平均跌幅爲 24%，由突破點向下衡量到最終低點。


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：1991 年~1996 年的 500 支股票 | 650 |

    | 反轉或整理排列 | 531 個反轉，119 個整理 |

    | 失敗率 | 123/650 相當於 19% |

    | 成功排列的平均跌幅 | 24% |

    | 最經常發生跌幅 | 15%~20% |

    | 在成功排列中，符合或超越目標價位者 | 462/527 相當於 88% |

    | 排列平均長度 | 7 個月（213 天） |

    | 圓弧狀蹦跳的發生個數 | 493/650 相當於 76% |

    | 多重蹦跳的發生個數 | 166/650 相當於 26% |

    | 第二個或後續蹦跳峰位較高 | 55/650 相當於 8% |


    附註：80%的案例向下突破，由突破點衡量的平均跌幅爲 24%。


    平均數經常造成誤解（因為少數幾個偏高的離群值就會造成平均數向上扭曲），所以我繪製蹦跳峰位到最後低點之跌幅的次數分配，請參考圖 8.3。如果你打算針對這類排列進行投資，次數分配可以顯示該投資最可能發生的結果。圖
    8.3 顯示的最經常發生跌幅介於 30% 到 40% 之間。


    ![](img/843a88de0b50d7a36e65238281a4e722_207_0.png)


    **圖 8.3 蹦跳-奔馳頭部反轉排列的跌幅次數分配（由蹦跳峰位衡量到最終低點的跌幅）** 大多數案例的跌幅為 30% 與 40%。


    ![](img/843a88de0b50d7a36e65238281a4e722_208_0.png)


    **圖 8.4 蹦跳-奔馳頭部反轉排列的跌幅次數分配（由突破當天最高價衡量到最終低點的跌幅）** 大多數案例的跌幅為 15% 與 20%。


    圖 8.4 也是蹦跳-奔馳頭部反轉排列的跌幅次數分配圖，但跌幅是由突破點衡量到最後低點。所謂「突破點」是指突破當天的高價，因為這個價位最接近趨勢線（譯按：譯者看不岀其中的道理）。圖
    8.4 顯示的最經常發生跌幅介於 15% 到 20% 之間。這個排列的績效很不錯，實際的結果取決於獲利了結的方法。「交易戰術」一節內會解釋如何在蹦跳峰位附近賣出持股，不要把賣點設定在上升趨勢線的突破位置。


    為了提高目標價位的達成率，這個排列是由突破點向下衡量前奏階段高度做為最低目標價位。按照這個定義，目標價位的達成率為 88%（詳細內容請參考「交易戰術」一節）。


    BARR 頭部排列需要花費相當長期間，平均為 7 個月。在所有的案例中，出現單一圓弧狀蹦跳的排列佔 76%。


