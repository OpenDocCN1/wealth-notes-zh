    ## 11 菱形排列


    ![](img/843a88de0b50d7a36e65238281a4e722_266_0.png)


    ![](img/843a88de0b50d7a36e65238281a4e722_266_1.png)


    ### 摘要資料


    ### 菱形頂排列


    - **外觀**：菱形狀，排列發生之前曾經出現延伸性的漲勢。

    - **反轉或整理**：短期的（少於 3 個月）空頭反轉排列。

    - **失敗率**：25%。

    - **平均跌幅**：21%，最經常發生跌幅 20%。

    - **成交量趨勢**：突破之前呈現下降趨勢。

    - **回升**：59%。

    - **價格目標達成率**：79%。

    - **參閱排列**：（20）頭肩頂排列。


    ### 菱形底排列


    - **外觀**：菱形狀，排列發生之前曾經出現延伸性的跌勢。

    - **反轉或整理**：短期到中期的（長達 6 個月）多頭反轉排列。

    - **失敗率**：13%。

    - **平均漲幅**：35%，最經常發生漲幅為 15%。

    - **成交量趨勢**：突破之前呈現下降趨勢。

    - **回挫**：43%。

    - **價格目標達成率**：95%。

    - **參閱排列**：（18）頭肩底排列。


    「摘要資料」顯示菱形頂（diamond tops）與菱形底（diamond bottoms）的一些重要特性。這兩種型態的唯一差別，只在於排列發生之前的趨勢方向。菱形頂發生在延伸性的漲勢之後，菱形底發生在延伸性的跌勢之後。


    這兩個型態的表現也非常類似。兩者都屬於既有價格趨勢的反轉排列，成交量隨著時間經過而縮小。突破當天的成交量放大。


    頭部排列的失敗率為 25%，大約是底部排列的兩倍。我認爲型態的失敗率最好不要超過 20%，所以菱形頂不屬於可靠的型態。


    平均跌幅 21%與平均漲幅 35%大約是反轉型態的正常水準，但底部排列的平均漲幅稍低於一般多頭排列的水準 40%。另外，頭部排列的最經常發生跌幅為 20%，非常接近平均跌幅
    21%，這意味著跌幅偏高的案例很少，所以不會造成平均跌幅向上扭曲。菱形底的最經常發生漲幅為 15%，遠低於平均漲幅 35%，這意味著漲幅偏高的案例不少，使得平均漲幅向上扭曲。


    ### 緣起


    菱形排列的形狀究竟如何呢？圖 11.1 是一個典型的菱形頂排列。股價漲勢起始於 1995 年 2 月中旬，4 月 20 日股價上漲 1% 點，當天的成交量也顯著放大。接著，股價開始呈現持續墊高的峰位與持續下滑的谷底，就如同擴張頂排列一樣。排列初期的成交量隨著時間經過而縮小。突然之間，價格走勢出現相反的型態：由第三個轉折峰位之後，股價轉折高點開始下滑，轉折低點開始墊高；換言之，呈現等腰三角形的排列形狀。可是，成交量還是持續萎縮，雖然縮小的速度不穩定。


    6 月 8 日，價格向下突破菱形頂排列，成交量也高於正常水準。接下來的 2 個星期左右，價格呈現橫向而稍微下滑的走勢，然後向下暴跌，回到 4 月中旬上漲之前的價位。


    這種價格型態稱為菱形頂，代表既有漲勢的頭部反轉排列。圖 11.1 顯示典型的頭部行為：價格回到菱形排列發生之前的水準。當然，不是所有的頭部排列都會呈現這類非常節制


    ![](img/843a88de0b50d7a36e65238281a4e722_269_0.png)


    圖 11.1 菱形頂的範例。請注意，價格很快就回到$20水準。


    的行為；某些反轉排列在吐回既有的漲幅之後，還會繼續下跌。


    圖 11.2 是菱形底排列的例子，排列本身類似於菱形頂，只是型態發生之前的價格走勢屬於下降趨勢。重複強調一次， 菱形頂發生之前，價格處於上升趨勢（圖 11.1）；菱形底發生
    之前，價格處於下降趨勢（圖 11.2）。


    菱形排列過程中，首先出現擴張的價格擺動，轉折高點 持續墊高，轉折低點持續下滑；其次發生收斂的價格擺動，持 續到突破發生爲止。


    排列之內的成交量呈現下降趨勢。突破當時通常會爆出


