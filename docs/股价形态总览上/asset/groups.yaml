    # 辨識準則


    上升擴張排列具有哪些特質？為了考慮這個問題，請詳閱表 2.1 的內容，同時參照圖 2.3，這是一份上升擴張排列週線圖，整體形狀類似於一邊水平狀的喇叭。排列底部呈現水平狀，上側趨勢線朝右上方傾斜。上側趨勢線至少需要觸及兩個轉折高點。所謂的轉折高點，是指圖形上清楚可見的價格峰值，顯著不同於其他高點。下側的水平趨勢線也至少觸及兩個轉折低點。所謂的轉折低點，是指清楚可以辨識的價格谷底。這些觸及點可以協助界定價格排列的邊界。


