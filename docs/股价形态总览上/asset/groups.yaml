    頭肩底排列的目標價位達成率為 82%，我認為 80% 以上的水準屬於可靠排列。


    排列的平均長度為 105 天，這是衡量兩側最遠邊肩部的距離，所以會低估實際的排列長度，因為我的統計數據沒有考慮左肩的下跌波段與右肩上漲到突破點的過程。


    ![](img/843a88de0b50d7a36e65238281a4e722_448_0.png)


    圖 19.5 複雜頭肩底排列的漲幅次數分配，最經常發生漲幅為 20%~30%。


    我計算排列內成交量時間序列的迴歸直線斜率，藉以判斷成交量究竟是呈現上升或下降趨勢。幾乎有三分之二案例（63%）的成交量趨勢呈現下降趨勢。事實上，只要透過肉眼觀察，就很容易發現左肩的成交量通常大於右肩。


    某些分析家認為，頸線傾斜方向與肩部高度將反映排列的強度。我透過統計方法測試這些看法，結果發現頸線向下傾斜的排列強度，經常超過頸線向上傾斜的案例，前者的平均漲幅為
    39%，後者為 34%。兩者之間的差異具有統計上的顯著意義，這意味著前述結果不太可能純屬巧合。


    關於肩部高度，右肩價位較高的排列，突破之後的上漲力道是否比較強勁？沒錯，右肩價位較高排列的平均漲幅為 38%，左肩價位較高的平均漲幅為 36%。雖然兩者之間的差異不具有統計上的顯著意義，但我們認為這是相當合理的現象。如果價格下跌的轉折低點愈來愈高（右肩價位高於左肩），意味著趨勢開始發生變化，逐漸由跌勢過渡為漲勢。投資人察覺這種力量變化，自然傾向於買進股票。


    向上突破之後的漲幅與右肩高度之間，是否存在關聯？沒有證據顯示如此。針對資料庫內的案例，我繪製右肩跌幅與突破漲幅（都表示為百分率）的相關散佈圖（correlation
    scatter chart），預料兩者之間應該存在反方向變動的關係（右肩跌幅愈小，突破漲幅愈大，反之亦然）。結果，散佈圖基本上顯示兩者之間呈現隨機關係。


    複雜頭肩底排列的頸線，是否大多呈現水平狀？沒錯，74% 的案例是如此。當然，何謂「大多呈現水平狀」，其中多少涉及主觀的判斷。我的「大多數」定義為「例外情況不超過
    30%」。相關的結果支持我把這個條件納入辨識準則。


    表 19.3 顯示突破的相關統計數據。大部分排列（97%）向上突破，只有 3% 的案例向下突破。在 232 個向上突破的案例中，只有 8 個排列沒有發生 5%
    以上的跟進漲勢；加上 7 個向下突破案例，失敗的排列總共有 15 個。


    向上突破之後，幾乎半數排列（47%）的價格在 30 天之內回挫到頸線（如果超過 30 天，就視為正常價格波動，不屬於回挫走勢）。完成回挫走勢的平均期間為 12
    天。


