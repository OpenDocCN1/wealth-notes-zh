    附註：跌幅最大的案例發生在年度價格區間下緣，但 BARR 很少發生在此位置。


    向下突破的成交量型態如何呢？相對於突破前一天的成交量，最大成交量發生在突破之後的隔天（164%）。投資人於突破隔天才察覺收盤價正式突破趨勢線，於是拋售股票，成交量暴增。


    向下突破通常都落在年度價格區間的哪個位置？我把最近 12 個月的價格區間分為三等分：上緣、中央與下緣，計算這三個區間內發生的向下突破次數（此处不考慮排列期間不滿
    1 年的案例）。結果，大約 12%的案例發生在年度價格區間下緣，43%在中央，其餘的 46%發生在上緣。這個分配狀況相當合理。上升趨勢線愈陡峭，代表愈強烈的買進熱潮，向下突破的位置愈接近年度價格區間上緣。買進意願愈強勁，股價上漲的動能愈足。隨著價格上漲，供給持續增加，終於超過需求水準，股價出現峰位而開始反轉。下跌過程中，還是有很多搶反彈或低檔承接的買盤。這些買盤會緩和跌勢，甚至造成價格向上反轉。


    發生在前述三個年度價格區間的向下突破，我們分別計算它們的平均跌幅。發生在年度價格區間下緣的突破，平均跌幅為 46%；發生在上緣的突破，平均跌幅只有 30%。這與我的預期相反，跌勢最凶的走勢應該發生在年度高價附近——不是年度低價。


    稍微深入思考，這種現象似乎也頗為合理。BARR 頭部型態屬於動能排列，向上動能驅動價格走高。即使發生趨勢反轉之後，還是有很多投資人低檔買進，期待股價能夠很快回升。


    如果 BARR 頭部排列發生在年度價格區間下緣，這支股票的走勢原本就非常疲軟。雖然某些投資人對於股價漲勢有所期待，但向下突破確認之後，很快就放棄了。利空消息不斷，股價持續下滑。


    就前述的數據顯示，如果你打算放空 BARR 頭部排列的股票，就應該挑選突破發生在年度低價附近的對象。不要誤以為漲得高，跌得重。


    ### 交易戰術


    表 8.4 摘要列示 BARR 頭部排列的相關戰術，考慮何時賣出股票，以及如何衡量向下突破之後的最低目標價位。我們通常都會定期瀏覽股價走勢圖，某些股票會順著上升趨勢線持續發展；然後，漲勢突然加速，成交量擴大，進入蹦跳階段。


    根據定義，對於有效的 BARR 頭部排列，蹦跳階段高度至少是前奏階段高度的兩倍（兩個階段的高度都是由階段最高價衡量到 BARR 趨勢線）。我們另外繪製兩條平行於
    BARR 趨勢線的直線，協助擬定交易決策。第一條稱為警戒線，它與 BARR 趨勢線之間的距離剛好是前奏階段高度。第二條稱為賣出線，它與警戒線之間的距離也是前奏階段高度。


    警戒線代表 BARR 頭部排列可能正在形成當中的訊號。一旦價格正式向上穿越這條直線，開始進行一些基本分析或技術分析，考慮賣出股票的可能性。


    一旦價格向上觸及賣出線，就應該隨時掌握個別公司、相關產業與整體市場的狀況。向上觸及賣出線，並不代表自動賣出，只是意味著 BARR 可能正在形成頭部。價格觸及賣出線，代表動態玩家控制大局。向下奔馳階段開始之前，價格漲勢或許還會進行幾個星期或幾個月，還有充裕的時間考慮賣出。換言之，繼續等待，讓動能玩家有機會更進一步推高股價。


    可是，某些情況下，你可能希望扣動扳機。如果公司、產業或整體市場看起來很危險，或許可以提早獲利了結。即使不能賣在最高點，但獲利了結也不會讓你破產。另外，如果蹦跳階段的漲勢很陡峭，就應該考慮賣出，因為急漲之後經常出現急跌的走勢。


    ### 表 8.4 蹦跳-奔馳頭部反轉排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算前奏階段的高度（定義請參考表 8.1），由突破點向下衡量前述高度，結果就是向下突破之後的最低目標價位。 |

