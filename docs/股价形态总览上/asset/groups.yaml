    向上突破的成功排列，平均花費 8 個月才到達最終高點。所以，我把這個排列歸納為長期型態。可是，我也依照個別案例到達最終高點的時間長度，編製次數分配圖。結果，大部分


    的排列到達最終高點的時間都超過 6 個月（6 個月是區分中期與長期趨勢的門檻）。


    這個排列通常發生在年度價格區間的哪個位置？大部分排列的突破點落在年度價格區間三等份的中央。這是很合理的現象，因為複雜頭肩底通常發生在下降趨勢的末端，但價格需要經過一段漲勢才能到達頸線突破點。對於落在這三個價格區間的排列，各自的平均漲幅都差不多，介於
    34% 到 38% 之間；其中以突破點落在年度價格區間上線的案例，平均漲幅最大。這似乎意味著動能玩家最偏愛年度高價附近的頭肩底排列。


    突破過程的成交量，是另一個值得考慮的統計參數。突破過程發生大成交量，隨後的漲幅是否較高？沒錯，大量突破的平均漲幅為 39% ，小量突破為 32% 。兩者之間的差異具有統計上的顯著意義。


    對於每個案例，我計算突破當天與隨後兩天的平均成交量（因為突破量可能延遲發生），然後比較這個平均值與突破前一天的成交量，如果前者是後者的 125% 以上，歸類為「大量」；如果前者是後者的
    75% 以下，歸類為「小量」。接著，我分別計算大量突破與小量突破的平均漲幅，結果的數據如同前述。


