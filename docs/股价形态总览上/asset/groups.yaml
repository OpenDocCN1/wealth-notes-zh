    實在非常意外！當初，我以為這個排列的行為應該類似於下降楔形（falling wedge），結果並非如此。下降楔形屬於反轉型態，但下降擴張楔形（descending
    broadening wedge）屬於整理型態，完成之後繼續先前的價格趨勢。成交量型態也不同於下降楔形。下降擴張楔形的成交量隨著時間經過而增加，但下降楔形則呈現減少的趨勢。


    觀察資料庫內的個股走勢，我發現這種排列通常發生在上升趨勢的末端。在排列的發展過程中，整體價格趨勢朝下，在幾個月之內構成擴張楔形，然後價格向上突破，又回到排列出現之前的方向：朝上。這是一個典型的趨勢整理連續型態。


    如何衡量這個排列的失敗率呢？因為下降擴張楔形屬於連續型態，如果發生趨勢反轉的走勢，就屬於失敗案例。另外，如果連續型態完成（突破）之後，沒有出現 5%或以上的跟進走勢，也視爲失敗。這兩種情況造成
    37%的失敗率，超過可靠排列所能夠接受的最高水準 20%。


    這種多頭整理排列的平均漲幅高達 46%。最經常發生漲幅爲 20%，另外有高達 40%的案例呈現 50%以上的漲幅！由於這些數據顯著偏高，所以失敗率稍微偏低似乎也可以接受。


    由於這種排列完成之後的上漲動能十足，所以目標價位的達成狀況也非常理想。不同於上升擴張楔形，目前這個型態是由突破點向上衡量排列高度做爲目標價位。下降擴張楔形向上突破之後，80%以上的案例達成目標價位。'
