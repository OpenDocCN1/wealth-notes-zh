    ## 表 23.2 雙角頂排列的一般統計數據


    - **說明**：統計數據

    - **排列數量**：188 個

    - **範圍**：1991 年~1996 年的 500 支股票

    - **類型**：反轉或整理排列（92 個整理，96 個反轉）

    - **失敗率**：30/188，相當於 16%

    - **成功排列的平均跌幅**：21%

    - **最經常發生跌幅**：10%

    - **左角/右角成交量相對於 25 天移動平均的水準**：138%，125%

    - **對於成功排列，到達最終低點的天數**：4.5 個月（134 天）


    發生跌幅只有 10%。圖 23.4 提供雙角頂排列案例的跌幅次數分配圖，顯示沒有經過重大跌幅扭曲的情況。請注意，大約有五分之一的案例（22%），跌幅不超過
    10%；另外五分之一案例（18%），跌幅介於 10% 與 15% 之間。換言之，如果你操作某個雙角頂排列，最可能發生的跌幅應該在 15% 之內——跌幅不超過
    15% 的案例總共佔 40%。當然，如果你的個性比較樂觀，也可以說：「在所有的案例中，總共有 60% 的排列跌幅超過 15%。」持平而論，對於多頭市場的空頭排列來說，這已經是不錯的績效了。


    表 23.2 也顯示雙角頂排列的成交量概況。平均而言，左角的成交量大於右角，兩者都超過 25 天移動平均量。


    ![](img/843a88de0b50d7a36e65238281a4e722_528_0.png)


    **圖 23.4 雙角頂排列的跌幅次數分配** 最經常發生跌幅為 10%，跌幅為 15% 或以下的案例佔 40%。


    對於那些排列完成之後曾經發生 5% 以上跟進跌勢的案例（否則視爲失敗），價格到達最終低點的平均期間爲 134 天（大約 4½個月）。


    表 23.3 顯示某些篩選條件下的排列平均跌幅與失敗率，其中以整體案例的平均跌幅 21% 與失敗率 16% 爲基準。


    雙角線形的最高價彼此不同，績效是否更理想？顯然不如此，雙角線形最高價相同的排列績效，平均優於最高價不同的案例，前者爲 23%，後者爲 21%。


    ### 表 23.3 雙角頂排列的一些統計數據


    | 說明 | 平均跌幅 (%) | 失敗率 (%) |

    | :--- | :---: | :---: |

    | 基準 | 21 | 16 |

    | 雙角線形高點存在差異的排列跌幅 | 21 | |

    | 雙角線形高點不存在差異的排列跌幅 | 23 | |

    | 排列左角/右角/兩角發生大成交量的績效 | 左 21，右 22，兩角 21 | 左 18，右 18 |

    | 排列左角/右角/兩角發生小成交量的績效 | 左 22，右 21，兩角 21 | |

    | 左角大成交量，右角小成交量 | 21 | |

    | 右角大成交量，左角小成交量 | 22 | |

    | 線性迴歸價格趨勢：3 個月上升 | 22 | 20 |

    | 線性迴歸價格趨勢：3 個月下降 | 20 | |

    | 特長線形（平均長度的 3 倍） | 25 | 43 |


    > 附註：特長線形的績效很理想，但失敗率幾乎是原來的 3 倍。


    雙角的成交量型態有什麼特點？左角發生小成交量（成交量小於當時的 25 天移動平均量），績效稍優於左角發生大成交量的案例（平均跌幅分別為 22% 與 21%）。右角的情況剛好相反，右角發生小成交量的排列平均跌幅為
    21%，發生大成交量的平均跌幅為 22%。雙角都發生大成交量，排列的平均跌幅為 21%（雙角都發生小成交量，平均跌幅也是 21%）。左角發生大成交量，右角發生小成交量，排列的平均跌幅為
    21%。反之，左角發生小成交量，右角發生大成交量，排列的平均跌幅為 22%。由於 21% 與 22% 之間的差異實在太小，我甚至懶得檢定這方面的差異是否具有統計上的顯著意義。平均跌幅為
    21% 或 22%，難道會造成操作上的影響嗎？應該不至於。順便提及一點，所謂「大成交量」與「小成交量」，都是比較當時成交量與 25 天期移動平均量。如果成交量大於移動平均，稱為大成交量；反之，如果成交量小於移動平均，稱為小成交量。


    我針對排列發生之前 3 個月的收盤價時間序列進行線性迴歸分析，藉由線性迴歸直線的斜率來判斷排列發生當時的短期價格趨勢。我希望知道排列在哪種情況下——先前 3
    個月處於上升趨勢或下降趨勢——的績效比較理想。結果顯示，發生在上升趨勢的排列平均跌幅為 22%，發生在下降趨勢的排列平均跌幅為 20%。同樣地，這方面的差異也太小，恐怕沒有操作上的意義。


    雙角頂排列呈現「特長線形」，績效顯著優於基準數據，平均跌幅為 25%，但失敗率則大幅提高為 43%。我首先計算排列發生之前 1 年內的向上突兀線形平均長度*，然後挑選線形長度至少是前述平均長度
    3 倍的雙角頂向上突兀線形，這類的案例總共只有 28 個。如果挑選正常長度 2 倍的雙角頂向上突兀線形，排列的平均跌幅為 22%，失敗率為 27%。


    > * 譯按：此处所謂的「線形長度」，請參考第 494 頁的說明。針對每支向上突兀線形，計算該線形最高價與相鄰——之前與之後——線形最高價的差值，將此差值定義為向上突兀線形的長度。


    觀察表 23.3 的數據，你可能會得到一項結論：雙角頂排列的形狀或成交量究竟如何，實際上不會構成重大影響。排列的平均跌幅基本上都介於 20% 到 22% 之間。可是，爲了降低失敗率，或許應該挑選雙角成交量都偏低的型態(失敗率由
    16% 降低爲 6%)。


    ## 交易戰術


    表 23.4 摘要列示雙角頂排列的交易戰術。最經常發生跌幅只有 10%（雖然平均跌幅爲 21%），這個排列究竟是否值得操作？答案絕對是肯定的，問題只在於操作戰術。如果你持有的股票在一段漲勢之後出現雙角頂排列，就應該考慮獲利了結。


    最重要的一點，或許是如何正確辨識有效的雙角頂排列。一旦找到有效的型態之後，其次是觀察週遭的價格行爲。既有的趨勢是否朝上？上升趨勢是否已經持續幾個月？若是如此，雙角頂排列很可能代表頭部反轉的訊號。某些情況下，雙角頂恰好構成向下反轉的峰位；另一些情況下，真正的趨勢反轉可能發生在幾個月之後（換言之，訊號與趨勢反轉之間，存在幾個月的時間落差）。


    如果雙角頂排列發生在下降趨勢中，這意味著趨勢將繼續朝下發展。可是，如果雙角頂發生在延伸性的下降趨勢中，價格繼續下跌的空間或許十分有限，尤其是排列發生在向上折返走勢的末端。因爲向上折返走勢可能代表趨勢已經發生變化；在這種情況下，雙角頂排列完成之後的價格跌勢，只不過是重新測試底部支撐而已。一旦底部測試完成，價格可能正式向上反轉。


    在延伸性下降趨勢的末期，放空股票務必謹慎，尤其是下降趨勢已經告一段落，雙角頂排列發生在向上折返走勢的末端，這種情況顯然不該放空，因爲價格已經不太可能出現重大跌勢。盤勢或許會繼續下跌，但主要的空頭走勢已經過去了。


    「統計數據」一節中曾經提到，如果雙角成交量都低於 25 天移動平均，排列的失敗率顯著下降，但平均跌幅仍然維持在 21%。實際進行交易之前，或許應該考慮這項特性。


    雙角頂排列出現之後，即使隨後的價格走高，或排列完成之後沒有出現 5% 以上的跟進跌勢，雖然都意味著排列已經失敗，但仍然可能是趨勢向下反轉的有效早期警訊。因此，每當你看見雙角頂排列，就必須留意當時的上升趨勢可能在幾個月之內告一段落。


    ### 表 23.4 雙角頂排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 辨識 | 利用表 23.1 列示的準則，在過線圖上謹慎辨識雙角頂排列。 |

    | 評估徵兆 | 尋找長達數個月的價格上升趨勢。雙角頂排列經常發生在這類上升趨勢的末端。如果雙角頂排列發生在長期下降趨勢末端，最好不要進場操作。如果雙角頂發生在下降走勢中，當趨勢變動而價格走高時，必須特別謹慎。價格可能下跌，但跌勢通常很短暫（例如：雙重底排列出現第一個底部之後，反彈走勢末端可能發生雙角頂，然後價格下跌做出第二個底部）。
    |

    | 小成交量 | 如果雙角頂排列的兩支突兀線形成成交量都低於平均水準，失敗率降低到 6%。這個特性值得考慮。 |

    | 趨勢變動 | 雙角頂排列代表趨勢變動的訊號，訊號的領先程度通常短於 2 個月。 |


    ## 交易範例


    你可能認為：「這只不過是紙上談兵而已，實際上如何操作呢？」請考慮圖 23.5 的情況。周小姐發現自己所持有的股票逐漸發展爲複雜頭肩頂排列。遠邊左肩的成交量大於「頭」部，遠邊右肩的成交量更進一步萎縮，完全符合預期。總之，整個結構看起來非常悲觀。當右肩峰值出現雙角頂排列的時候，她知道股價即將邁入新的下降趨勢。


    右角出現之後的第二個星期，周小姐賣出手中持股，獲利非常有限。可是，操作還沒有結束。隔週，她在 $34\frac{1}{4}$ 放空股票。利用傳統方法衡量頭肩頂排列的高度爲
    18 點，她估計下檔目標價位爲 $16$，不是 $12$，前者是以放空價位 $34$ 做爲基準向下衡量，後者的基準則是突破點 $30$（周小姐是在複雜頭肩頂排列完成之前進場放空，當時還不知道突破點的價位）。


    放空價位在 $34$，把目標價位設定在 $16$，似乎有些過分樂觀。雖說如此，當股價開始下跌時，她還是覺得很高興。周小姐回顧週線圖的走勢，希望找當下檔的重要支撐價位；結果，


    **Bassett Furniture Ind. (傢俱, NASDAQ, 代碼 BSET)**


    ![](img/843a88de0b50d7a36e65238281a4e722_534_0.png)


    第一個支撐是 1993 年 10 月份的低點 $24\frac{1}{2}$，其次是 1993 年 6 月份的低點 $23\frac{1}{4}$，兩者都很接近整數價位
    $25$，目前的下跌走勢可能很難穿越這個水準。


    股價觸及 $25$ 的支撐之後，展開橫向盤整；5月底，走勢向上反彈，周小姐在 $27$ 回補空頭部位。在 4 個多月的期間內，每股獲利大約是 $7$。一年之後，周小姐重新拿起股價走勢圖，發現股價確實進一步走低。1994
    年 11 月初，股價曾經創 $20\frac{1}{8}$ 的低價，還是遠高於當初設定的目標價位——不論 $16$ 或 $12$。由另一個角度說，當她回補股票之後，股價一度攀升到
    $30\frac{1}{4}$，較放空價位只有 10% 的差距。


