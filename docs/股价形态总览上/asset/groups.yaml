    | 趨勢變動 | 雙角頂排列代表趨勢變動的訊號，訊號的領先程度通常短於 2 個月。 |


    是重新測試底部支撐而已。一旦底部測試完成，價格可能正式向上反轉。


    在延伸性下降趨勢的末期，放空股票務必謹慎，尤其是下降趨勢已經告一段落，雙角頂排列發生在向上折返走勢的末端，這種情況顯然不該放空，因為價格已經不太可能出現重大跌勢。盤勢或許會繼續下跌，但主要的空頭走勢已經過去了。


    「統計數據」一節中曾經提到，如果雙角成交量都低於 25 天移動平均，排列的失敗率顯著下降，但平均跌幅仍然維持在'
