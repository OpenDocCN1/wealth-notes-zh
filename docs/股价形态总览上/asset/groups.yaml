    43 個。根據前述推論，扣除其他趨勢的案例之後，成交量呈現上升趨勢的案例絕對不會超過 43 個，但正文卻說有 45 個（=4+41）。


    ## 表 14.3 旗形與三角旗形的統計數據：價格上升趨勢


    | 說明 | 旗形 | 三角旗形 |

    | :--- | :--- | :--- |

    | 排列起始於最近 12 個月價格區間的下線、中央或上線 | 下線 7%, 中央 18%, 上線 76% | 下線 7%, 中央 9%, 上線 84% |

    | 價格趨勢持續期間 | 62 天 | 53 天 |

    | 排列發生之前的 平均漲幅 | 19% | 22% |

    | 排列發生之後的 平均漲幅 | 19% | 21% |

    | 排列發生之後的 最經常發生漲幅 | 20% | 15%~20% |

    | 在成功的排列之中， 目標價位達成率 | 63% | 58% |


    旗形與三角旗形通常都落在年度價格區間的哪個位置？大多數旗形都起始於年度高價附近，76%的案例落在年度價格區間的上線（我把最近 12 個月的價格區間劃分為三等份）。三角旗形則有
    84%的案例落在年度價格區間的上線。


    關於價格趨勢的持續期間（由排列發生之前的最近轉折低點，衡量到排列完成之後的最近轉折高點），旗形為 62 天，三角旗形為 53 天。由於旗形與三角旗形通常都飄揚在旗桿中點，假定進場點設定在排列完成位置（向上突破點），如此建立的多頭部位應該可以在一個月內結束（平均而言）。這意味著你可以在很短暫的期間內，獲取名不錯的報酬，然後另外尋找機會。


    為了評估排列發生之前的漲勢陡峭程度，我計算這些漲勢的平均漲幅。旗形與三角旗形發生之前的上升趨勢平均漲幅大約都是 20%，這是由起漲點的最低價，衡量到排列起點的最高價。我把這方面的數據也納入表
    14.3，因為挑選旗形與三角旗形的交易對象，必須非常重視排列發生之前的漲勢陡峭與快速程度。


    同樣地，我也計算排列突破之後的平均漲幅。旗形為 19%，三角旗形為 21%，幾乎完全對應排列發生之前的漲幅。所以，稱呼這些排列是「飄揚在旗桿中央的旗形」，真是實至名歸。


    前幾段討論的都是平均漲幅，所以還需要查核最經常發生漲幅。旗形與三角旗形的最經常發生漲幅都介於 15%到 20% 之間，非常接近平均漲幅。


    關於目標價位，旗形的達成率為 63%，三角旗形的達成率為 58%。我認爲 80%以上才足以信賴。這兩個數據都超過 50%，這意味著半數以上的旗形都會「飄揚在旗桿中央」，也意味著你對於突破之後的漲勢強度必須保留。


    表 14.4 顯示價格下降趨勢內的旗形與三角旗形相關統計數據。當行情趨於下降，這些排列落在年度價格區間的哪個位置呢？不論旗形或三角旗形，它們大多落在年度價格區間的中央，意味著排列發生之前的跌勢起始於年度高價附近，快速下跌到年度價格區間中央，開始形成旗形或三角旗形的連續排列，整理完成之後，又繼續下跌。


    ## 表 14.4 旗形與三角旗形的統計數據：價格下降趨勢


    | 說明 | 旗形 | 三角旗形 |

    | :--- | :--- | :--- |

    | 排列起始於最近 12 個月價格區間的 下緣、中央或上緣 | 下緣 24%，中央 60%， 上緣 17% | 下緣 23%，中央 66%， 上緣 11%
    |

    | 價格趨勢持續期間 | 50 天 | 52 天 |

    | 排列發生之前的 平均跌幅 | 18% | 17% |

    | 排列發生之後的 平均跌幅 | 17% | 17% |

    | 排列發生之後的 最經常發生跌幅 | 15% | 25% |

    | 在成功的排列之中， 目標價位達成率 | 61% | 52% |


    關於價格趨勢的持續期間，旗形為 50 天，三角旗形為 52 天。這是泛指整個價格趨勢由開始到結束的平均期間。因為趨勢的起點與終點經常很難判斷，定義上很困難，所以此處考慮的趨勢是由排列發生之前的最近轉折高點，衡量到排列完成之後的最近轉折低點，必要的情況下，可以再做調整。


    排列發生之前的平均跌幅，旗形為 18%，三角旗形為 17%。這是由下跌趨勢開始的最高價，衡量到排列起點的最低價。至於排列發生之後的平均跌幅，兩種型態的數據都是
    17%。


    大體上來說，這兩種排列都發生在整段跌勢的中點（排列發生之前與之後的跌幅各為 17%），涵蓋期間平均為 50~52 天。短暫的期間內，發生重大的跌勢，這意味著操作機會，細節內容請參考「交易戰術」一節。


    排列結束之後的最經常發生跌幅（由排列結束的最高價，衡量到價格跌勢結束的最低價），旗形為 15%，三角旗形為 25%。三角旗形的讀數雖然很大，但這只是意味著跌幅
    25% 的案例發生次數很多，但跌幅小於 25% 的欄位發生次數也不少，使得平均數向下扭曲。


    在下降趨勢中，旗形與三角旗形完成目標價位的達成率分別為 61%與 52%。我認為可靠排列的最低門檻為 80%，所以這兩個型態顯然不足，尤其是三角旗形。如果你打算在下降趨勢中操作三角旗形，必須特別留意，向下突破之後的走勢通常沒有辦法到達目標價位。


    ## 交易戰術


    表 14.5 顯示旗形與三角旗形的交易戰術，請同時參考圖 14.8。關於排列完成之後的最低目標價位，旗形與三角旗形都採用相同的衡量方法。首先，決定價格趨勢的起點，這通常都是排列發生之前的最近轉折高點（下降趨勢）或最近轉折低點（上升趨勢）。圖
    14.8 顯式的趨勢起點是 A 點（$47½）。其次，決定排列起點的最低價（下降趨勢）或最高價（上升趨勢）。圖 14.8 的排列起點最低價為 B 點（$42¾）。接著，計算前兩個價位的差距（$4¾=47½-42¾）。由排列突破當天的最高價向下橫量前追距離，結果就是向下突破之後的最低目標價位（或由突破當天最低價向上衡量前追距離，結果就是向上突破之後的最低目標價位）。圖
    14.8 的排列突破點最高價為 C 點（$43），由此向下衡量 $4¾，下檔的目標價位為 $38¼；結果，在向下突破之後的 13 個交易日，走勢完成目標價位。


    當你打算操作旗形或三角旗形排列，首先必須確定型態的有效性。關於這方面的查核，請運用表 14.1 的辨識準則。


    **表 14.5 旗形與三角旗形的交易戰術**


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算趨勢起點與排列起點之間的價格差距，排列完成之後應該向上（上升趨勢）或向下（下降趨勢）移動相同的距離。 |

    | 等待突破 | 一旦價格穿越排列的界定趨勢線，進場建立部位。 |


    Murphy Oil Corp.（綜合石油，NYSE，代碼 MUR）


    ![](img/843a88de0b50d7a36e65238281a4e722_355_0.png)


    圖 14.8 旗形與三角旗形的衡量目標價位。估計排列向下突破之後的目標價位。計算先前最近轉折高點（A 點）到排列起點的最低價（B 點）之間的距離。由排列結束的最高價（C
    點）向下衡量該距離，結果就是最低目標價位。


    利用衡量法則計算交易的獲利潛能，然後評估獲利潛能與潛在風險之間的關係。觀察上檔壓力或下檔支撐，計算進場價位與這些關鍵價位之間的距離，藉以衡量空頭部位或多頭部位的潛在風險。然後，比較部位潛在風險與獲利潛能之間的關係，兩者最好維持
    1：4 或以上的比率。


    就圖 14.8 的例子而言，假定在 $43 放空股票，下檔目標價位為 $38¼，獲利潛能為 $4¾（=43-38¼）。萬一價格沒有朝預期方向突破，反而朝上發展，首先可能停頓於
    $44 的壓力區，


    其次是 $45；所以，潛在風險是 1 點(=44−43)或 2 點(=45−43)。風險與報酬之間的比率為 4.75：1，意味著這筆交易值得一試。在 $43
    放空股票，停損設定在第一道壓力的稍上方 $44¹⁄₈。


    一旦價格穿越排列的界定趨勢線，進場建立部位；當走勢接近衡量法則預計的目標價位，就準備獲利了結。可是，由於統計數據顯示很多旗形或三角旗形案例都不能達成目標價位，所以需要有提早出場的心理準備。如果執意等待走勢到達目標價位，很可能轉盈為虧。


    ## 交易範例


    假定目前是 1993 年 11 月底，你考慮操作圖 14.8 的股票。由於這支股票當時處於下降趨勢，而且形成一個旗形排列，你準備在向下突破的過程中放空股票。按照統計數據顯示，下降趨勢的旗形排列只有
    61%能夠完成目標價位，這種程度的績效顯然太差，需要特別留意。


    你追蹤這支股票的走勢，觀察盤中價格的變動，當你發現價格向下穿越排列下側趨勢線，立即撥電話給經紀人，下達放空股票的指令，結果成交價格為 $42，稍高於當天的收盤價
    $41¹⁄₂。


    你回頭觀察過去一年的價格走勢，發現下檔 $40 與 $39 分别都有支撐。你相信——或期待——股價會貫穿第一道支撐，但第二道支撐恐怕很難突破。事實上，第二道支撐非常接近目標價位
    $38¼，此處應該顯露強勁的買盤力道。


    股價下跌到 $40 附近，開始呈現橫向走勢。你查核基本面資料與技術指標，發現一切都沒有問題，所以繼續持有部位。


    最後，價格向下貫穿 $40 的支撐，跌到 $39 附近，但跌勢顯然又停頓。跌破第一道支撐當天的收盤價為 $39，隔天價格走高。你決定在次一天回補空頭部位，因為此處的風險已經超過進一步獲利的潜能。結果，你的買單成交於
    $39，每股獲利大約是 $3。就 2 個星期的時間來說，獲利相當不錯。如果換算為年度報酬率，結果是……。


    # 高位緊密旗形排列


    ![](img/843a88de0b50d7a36e65238281a4e722_359_0.png)


    # 摘要資料


    - **外觀**：股價上漲一倍以上，然後形成幾天到幾個星期的狹幅旗形整理。

    - **反轉或整理**：短期的（長達 3 個月）多頭整理排列。

    - **失敗率**：32%。

    - **等待突破之後的失敗率**：17%。

    - **平均漲幅**：63%，最經常發生漲幅介於 20%到 30%，漲幅超過 50%的案例佔 44%。

    - **成交量趨勢**：下降。

    - **回挫**：47%。


    最近，在研究旗形與三角旗形排列的過程中，我意外發現很多高位緊密旗形排列（high，tight flags）。更讓我覺得意外的是它們的績效。失敗率高達 32%，或許不甚理想，但等到向上突破之後，失敗率下降為
    17%，已經低於可靠型態的最低門檻 20%。所以，只要等待突破，高位緊密旗形屬於操作績效不錯的排列。


    平均漲幅為 63%，這是我見過的最高水準。另外，次數分配的資料顯示，最經常發生漲幅大多落在 20%與 30%之間，而且漲幅超過 90%的案例佔 33%，漲幅超過
    50%的案例佔 44%。兩個月期間內能夠取得 50%的獲利，這類的機會顯然非常值得深究！


    ## 緣起


    圖 15.1 是高位緊密旗形排列的典型例子。不到兩個月的期間內，價格由低點 $14 上漲到旗形高點 $30%。旗形排列本身的成交量型態呈現下降趨勢。經過短暫整理之後，價格向上突破，繼續走高。又經過兩個月，股價創峰值
    $120。


    高位緊密旗形屬於標準的動能型態。如果股價在短期間內出現 100%以上的漲幅，通常都需要稍做整理喘息。這代表投資人進場買進的機會，藉以掌握後續的漲勢。可是，如何正確辨識高位緊密旗形排列呢？

    '
