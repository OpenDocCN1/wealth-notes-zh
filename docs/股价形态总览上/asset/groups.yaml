    接著，我們考慮突破點發生在年度價格區間的哪個位置。


    此處不考慮排列期間不足一年的案例。首先，把最近 12 個月的價格區間劃分為三等分（上線、中央與下線）。其次，以突破當天的低價為準，歸納突破點位在年度價格區間的位置。結果，大部分案例（43%）的突破點位在年度價格區間的中央，只有
    20% 案例的突破點位在上線。


    就 BARR 底部排列的形成過程來看，前奏階段的起點應該在年度高價附近，然後價格沿著下降趨勢線發展，突破之前大約處在年度價格區間的中央。為了檢定這個假設，我比較排列起點（當天高價）與年度價格區間的關係。大約
    82% 案例的起點位在年度價格區間的上線，然後向下發展到年度價格區間的中央。這個結論具有統計上的顯著意義：蹦跳-奔馳排列起始於最近 12 個月的高價區。實際觀察走勢圖，結果確實如此。BARR
    經常由價格創新高的位置開始發展。回檔稍做整理之後，價格嘗試再創新高而失敗。兩個峰位——第一個峰位高於第二個——銜接為一條下降趨勢線，價格沿著下降趨勢線發展為前奏階段，然後突然下挫而進入蹦跳階段。


    突破點位置與隨後的漲勢幅度是否有關聯？我發現突破點位在年度價格區間中央的案例平均漲幅最大（42%），其次是下線（39%），最後才是上線（28%）。


    根據我的推理，突破點位置愈低，突破之後的表現愈理想，理由是：摔得重，彈得高。反之，突破發生在年度價格區間上線的股票，突破之後往往很難上漲。結果似乎相當接近。


    由排列起點開始衡量，蹦跳低點與突破點平均發生多大的跌幅？蹦跳低點距離排列起點的平均跌幅為 28%。突破點距離排列起點的平均跌幅為 17%。


