    ## 交易戰術


    表 18.4 列示頭肩底排列的交易戰術。運用衡量法則估計頸線突破之後的最低目標價位。請參考圖 18.7，頭部也是排列的最低點，計算該價位（$13¹/₈）與頸線（$17¹/₂）之間的垂直距離（$4³/₈）。接著，等待價格向上突破頸線，這發生在
    3 月 28 日。我習慣採用保守的衡量方法，以突破當天的最低價（$15¹/₂）為基準，向上衡量排列距離（$4³/₈），最低目標價位為$19⁷/₈。這個目標價位完成於
    7 月中旬。


    ### 表 18.4 頭肩底排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算頭部谷底最低點與頸線之間的垂直距離，這是排列高度。由頸線突破點向上衡量排列高度，結果就是最低目標價位。如果頸線向右上方傾斜的角度過於陡峭，則由頭與右肩所夾轉折高點向上衡量排列高度。
    |

    | 不要等待確認 | 如果你能夠判斷潛在頭肩底排列，盡早在右肩出現之後買進，因爲絕大部分的潛在排列都會向上突破。可是，你必須確定頭肩底排列的結構已經發生，否則還是等待價格向上突破頸線。
    |

    | 停損 | 在兩肩較低者的下方 1/8 點處設定停損。對於成功的排列，價格通常不會跌破兩肩的較低者。 |

    | 留意回挫 | 如果錯失向上突破的進場機會，可以等待回挫走勢。向上突破之後，大約有半數的案例會發生回挫走勢。一旦發生這種現象，可以進場買進或加碼。 |


    ![](img/843a88de0b50d7a36e65238281a4e722_432_0.png)


    **圖 18.7 頭肩底排列。計算排列最低與頸線之間的垂直距離，由頸線突破點向上衡量排列距離，結果就是最低目標價位。7 月份曾經出現擴張頂排列。**


    如果你能夠提早判斷頭肩底排列正在形成之中，沒有必要等到排列完成或經過確認（換言之，收盤價向上突破頸線），可以儘早進場買進。由於失敗率只有 5%（其中 3%
    屬於 5% 失敗情況，即使你等待排列完成，也不能規避這方面的風險），提早進場的額外風險非常有限，但獲利差額很可觀。當然，重點還是如何正確判定潛在的頭肩底排列。如果沒有把握，還是等待價格向上穿越頸線。


    頭肩底排列完成——向上突破頸線——之後，半數的案例會發生回挫走勢，也可以考慮在回挫走勢完成之後進場。買進價格或許稍高，但獲利的機率也較大。如果當時已經持有股票，也可以考慮在此加碼。


    兩肩具備支撐的功能。請參考圖 18.7，兩肩的較低者（右肩）成爲 10 月底下跌走勢的支撐。


    建立部位之後，停損可以考慮設定在兩肩較低者的下方 $1/8$ 點處。對於成功的頭肩底排列，價格通常不會跌破兩肩的較低者。如果這個停損點與進場點之間的距離太遠，就必須把停損設定在最近支撐的下方
    $1/8$ 點處。如果行情朝有利方向發展，應該調高停損點（或停止點）。


    ### 交易範例


    某些人認爲老包很倒楣，但他有一位賢慧的老婆，還有兩個可愛的小孩。身爲汽車廠的黑手工人，他覺得生活很美滿，沒有什麼好抱怨的。可是，最近工會決定罷工，這對於老包的儲蓄構成嚴格的考驗，只好想辦法增加一些收入。


    自從孩提時代開始，老包就認爲華爾街是一個充滿夢想的地方。當他看到圖 18.7 的頭肩底排列，決定試試自己的手氣。當價格向上穿越頸線的時候，他進場買進，成交價格爲
    $16。


    經過一個星期，情況的發展還算正常。股價緩步走高，但觸及 $16 \frac { 5 } { 8 }$ 的高點之後就向下反轉。股價回挫到頸線附近，直接買穿頸線而繼續下跌。突然之間，部位發生虧損，老包應該認賠賣出，或者繼續持有，等待股價回升？


    他決定等待。股價很快就在$14½見底反彈。不久，股價向上穿越先前的高價$16⅓，而且繼續攀升一段距離，然後出現橫向整理，甚至小幅回檔。老包不太擔心，因為目前已經處於獲利狀態。雖然賺錢不多，但只要有耐心，他相信應該沒有問題。


    進入夏季旅遊旺季之後，航空類股開始出現顯著的漲勢，股價一路上揚，屢創新高。不久，股票在上檔形成擴張頂空頭型態，但老包根本不了解這種排列的意涵，仍然陶醉在股價飆漲的氣氛中。最後，終於在$21⅓撞上鐵板。


    當這支航空股票在 9 月中旬遇到亂流之後，幾乎是一路衝向地面。老包實在難以置信。整個暴跌過程中，老包只能看著獲利化為烏有。他與老婆商量之後，決定繼續持有股票。老包自言自語說著：「股價總有一天會回到原先的高點。然後，我就賣出。」


    股價繼續下跌，部位很快就轉盈為虧。老包還是繼續持有，除非股價回到先前的水準，否則絕對不賣。


    10 月份，情況開始發生變化。股價向上反彈，然後又暴跌到$13⅔的低價，接著又回升。大約一個月之後，股價回到當初的買進價位。


    新一年開始，出現一個下降擴張楔形的排列，股價雖然走低，但蘊含著多頭徵兆。1 月中旬，突然爆出大量，股票終於由谷底回升。成交量繼續放大，推動價格持續走高。


    看著股價走高，老包決定在先前的高價$21^{3/8}$賣出股票，於是打電話給經紀人，預先在該價位設定賣單。2 月底，股票出現一段飆漲行情，價格不只穿越老包設定在$21^{3/8}$的賣單，而且在一個月左右的時間就挺進到$30。


    從此以後，老包不再涉足股票市場。


