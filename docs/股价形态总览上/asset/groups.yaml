    > 附註：大多數成功的擴張頂排列，突破之前出現 4 個交替觸及點。


    字代表交替觸及點的個數。我通常把第 1 個交替觸及點標示在價格進入排列位置的反側。由於擴張頂是發生在上升趨勢的末端，價格是由下側進入排列，所以第 1 個觸及點通常標示在上側。可是，在圖
    4.2 中，價格進入排列之後沒有觸及上側趨勢線，所以我把第 1 個交替觸及點標示在下側。圖 4.3 則是一個比較正常的例子。


    讓我們回到表 4.4，把突破次數表示為百分率格式，如此可以顯示突破可能發生的位置。舉例來說，某個擴張頂排列中，第 1 個觸及點在上側，而且當時已經出現 5
    個交替觸及點（第 5 個觸及點在上側），如果價格直逼下側趨勢線，向下跌破的可能性為 95%*。發生的可能性雖然很高，但並不代表表排列必定向下突破。由於價格已經由上側趨勢線下跌，但還是可能出現部分跌勢而反彈，然後向上突破。


    * 譯按：這種說法很容易造成誤會。表 4.4 的 95% 究竟代表什麼事件的發生機率呢？向下跌破發生在第 6 個觸及點或之前的機率為 95%。正文考慮的事件又是什麼呢？「假定先前
    5 個觸及點都沒有突破，而突破剛好發生在第 6 個觸及點」，請注意，這兩個事件全然不同，後者的發生機率絕對不會是 95%。


    某些技術分析者相信，突破會發生在觸及點數較少的一邊。對於 5 點反轉排列（上側有 3 個觸及點，下側有 2 個觸及點），突破的方向應該朝下。我的資料庫中總共有
    30 個 5 點反轉案例，其中只有 47% 向下突破。


    逆向的 5 點反轉排列又如何呢？這類排列有 2 個轉折高點與 3 個轉折低點。統計數據顯示，這類排列向上突破的案例數量是向下突破的兩倍（68% 對 32%）。可是，我希望強調一點，還有
    36 個案例的觸及點超過 5 個。換言之，不論順向或逆向，5 點反轉會繼續發展，來回觸及對側趨勢線。一旦發生這種情況，就已經不屬於 5 點反轉排列。總之，不論
    5 點反轉或其逆向排列，完全都沒有任何神奇之處。它們都屬於擴張排列，我實在找不出它們有任何特殊的性質。


    ## 交易戰術


    表 4.5 列示擴張頂排列的交易戰術。首先考慮突破之後的目標價位衡量法則。對於大多數排列來說，最低目標價位的衡量方法是計算排列的高度，然後由突破點向上或向下衡量。擴張排列的目標價位也適用這種衡量方法。請參考圖
    4.6，排列高度是排列最高價（$12^{1}/_{8}$）減去最低價（$10$），相當於 $2^{1}/_{8}$。這個例子向上突破，由突破點（也是排列最高價
    $12^{1}/_{8}$）向上衡量排列高度，目標價位是 $14^{1}/_{4}(=12^{1}/_{8}+2^{1}/_{8})$。


