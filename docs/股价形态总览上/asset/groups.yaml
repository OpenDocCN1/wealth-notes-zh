  mdcn: "\n# 股價型態 上\n\n## 總覽\n\nEncyclopedia of Chart Patterns\n\nThomas N. Bulkowski／著\n\
    黃嘉誠／譯\n\n寰宇財金 162\n\n# 股價型態總覽\n\n## Encyclopedia of Chart Patterns\n\n（上冊）\n\n\
    Thomas N. Bulkowski 著\n黃 嘉 斌 · 譯\n\nJOHN WILEY & SONS, INC.\n\n# Encyclopedia\
    \ of Chart Patterns\n\nPublished by John Wiley & Sons, Inc.\n\nAUTHORIZED TRANSLATION\
    \ OF THE EDITION PUBLISHED BY JOHN WILEY & SONS, New York, Chichester, Brisbane,\
    \ Singapore AND Toronto. No part of this book may be reproduced in any form without\
    \ the written permission of John Wiley & Sons Inc.\n\nCopyright ©2000 by Thomas\
    \ N. Bulkowski\nAll Rights Reserved.\n\n# 前言\n\n早在孩提時代，我就認定炒作股票是致富的捷徑。這畢竟是一個公平競爭的場所，一場「某些人贏而另一些人輸」的零和對局（請注意，贏家永遠是經紀人）。致勝只要掌握一個原則：挑選上漲的股票，避開下跌的股票。非常簡單。\n\
    \n由雪城大學工學院畢業，當我從事第一份工作的時候，仍然抱持著相同的看法。每天早上，我打開報紙，挑選一些股票，把相關的決策貼在牆壁上。我的同事鮑伯也利用同一份報紙挑選股票。我的選股策略採用嚴格的基本分析，鮑伯的方法就簡單多了：閉起眼睛，揮舞著手臂，以食指指向報紙，然後張開眼睛，記錄所挑選的股票。\n\
    \n如此經過幾個月之後，我發現自己輸慘了。鮑伯隨意挑選的股票，績效遠遠超過我精選的股票組合。另外，我還發現自己由紙上模擬交易中學習許多東西。\n\n遺傳自父母的猶豫與多疑心態，讓我深入研究\
    \ 20 多家公司，最後才挑選自己最滿意的股票，實際進場買進。我在貨幣市場開戶，當時的時機很棒，存款利率高達 17%。乍看之下，存款利率水準所蘊含的投資風險似乎應該很高，實祭不然。基本放款利率更高達\
    \ 21%。\n\n由於貨幣市場的投資相當成功，我鼓起勇氣，也開立一個經紀商帳戶，把省吃儉用累積的少許資金投入股票市場。同樣地，當時的時機很棒，剛好是一段大多頭行情的起點。我大約在$3買進某支股票，然後看著股價一路上漲到$46½——這是我所擁有的第一支漲幅超過十倍股票。\n\
    \n事實上，一切並非進行得完全順利。我的股票投資組合規模快速成長，但我的就業生涯卻即將出現重大逆轉。我必須承認自己更換工作的頻率稍嫌過高，但最後還是找到一個我稱之為「老家」的地方，值得自己終生投入的工作場所——至少我自認為如此。當我在这家公司工作十年的週年日，收到大老闆的一封信。他感謝我過去十年來對於公司的貢獻，並且期待我將來能夠更成功。六個星期之後，我被裁員了。\n\
    \n我仔細評估當時的情況，決定自己——在年僅 36 歲的時候——已經受不了這一切。報紙上稱呼我們這類的人是「遺失的百萬人口」；換言之，基於各種理由，我們離職之後，沒有意願再進入職場。我們提早退休了。每個人——除了表妹瑪麗安之外——都認為我是神經病。當然，他們的看法完全正確。\n\
    \n長久以來，我對於股票技術分析都一直很感興趣。剛踏入市場的早期年代，我認為那些彎曲扭動的股價線形，只不過是某種神秘巫術的紀錄。可是，主要經紀商都高薪聘用一些技術分析人員，爲什麼？某個偶然的機會裡，我看到一份雜誌《股票與商品技術分析》（*Technical\
    \ Analysis of Stocks and Commodities*）。中午休息的時段，我經常搭電梯到樓下的圖書館，閱讀一些過期雜誌。過去，我雖然也看見自己購買的股票顯現某些價格型態，但從來不認爲它們具有任何意義。當然，這些精心挑選的股票還是經常失敗，於是我對於股價型態開始產生一些敬意。每當我決定採取某項行動的時候，股票的基本經濟面往往非常樂觀，但技術面已經呈現趨勢變動的信號。我所買進的股票可能立即賠錢，或者買得太早而沒有取得合理程度的獲利。\n\
    \n類似情況或許也曾經發生在你身上。對於某支股票，你盡力研究經濟基本面的資料；一旦買進之後，股票可能在一年之內毫無動靜。更糟者，當你進場之後，股價立即暴跌。如果你曉得如何觀察股價走勢圖，答案都蘊含其中。走勢貫穿上升趨勢線，股價呈現頭肩頂排列，相對強弱指數（RSI）處於嚴重超買地帶。總之，各種技術指標都顯示你不應該買進——可是，如果你不願睜開雙眼，就看不到這些訊號。\n\
    \n你並不孤獨；我多年以來也是如此。最後，我對於自己的選股策略實在太失望了，於是決定踏入技術分析的領域。在圖書館裡，我閱讀許多這方面的書籍與雜誌，所得到的結論都大致相同：頭肩型態通常有效。可是，所謂「通常」究竟是什麼意思呢？代表\
    \ 51%或 90%？沒有任何明確的結論。我不願意把辛苦賺來的錢，押在這些模稜兩可的陳述上；身爲工程師，我需要斬金截鐵的事實。所以，我編寫這本書。\n\n\
    本書最後附上一份「股價型態圖例一覽表」（下冊，第 1109頁）。如果你懷疑某支股票的走勢呈現特定股價型態，但不知道確切的名稱，不妨查閱這份「圖例一覽表」。型態名稱之後，列示本書討論該排列的頁數。\n\
    \n本書各章按照型態原文名稱的英文字母順序排列，讓讀者運用上方便于查閱*。關於每章內部的安排，首先提供重要數據的「摘要資料」與概略討論。其次，「緣起」邀請你進一步探索股價型態。「辨識準則」包括一份表格與詳細說明，使你更容易篩選或驗證股價型態。對於某些較簡單的排列，「緣起」與「辨識型態」合併處理。\n\
    \n「失敗案例」討論股價型態的各種失敗狀況與可能性。接著是最重要的「統計數據」；當你遇到某個股價型態，自然希望知道該型態的績效表現，以及其他種值得參考的統計資料。除此之外，你也希望知道特定股價型態的處理方法，這部分內容請參考「交易戰術」。\n\
    \n如果你對於改裝汽車有興趣，或喜歡自己動手整修房子，就瞭解正確工具的重要性。你不希望利用「一字形」螺絲起子扭轉「十字形」的螺絲。雖然還是可以使用，但效果截然不同。可是，某些情況下，你所需要的是鑿子，這或許就不是螺絲起子能夠取代的。挑選適當的工具，瞭解正確的使用方法，結果往往事半功倍。本書的宗旨就是如此，協助你正確判斷股價型態，挑選適當的交易方法。有些股價型態意味著趨勢非常可能反轉，你最好獲利了結或認賠出場。另一些型態沒有明確的績效表現，最好避免介入。\n\
    \n運用價格型態在股票市場賺錢，需要累積一些經驗才能辦到；關於這一點，我恐怕不能提供太大的協助，只能建議你首先從事一些紙上模擬交易。藉由這個管道，你不需實際支付代價，就能尋找適合自己個性的交易風格。評估紙上的模擬交易，你就能瞭解停損單是絕對必要的工具。你必須訓練自己，提升自己對於股價支撐與壓力水準的判斷能力，隨時調整停損，想辦法在頭部附近獲利了結或認賠出場，同時讓部位能夠保持繼續獲利的能力。\n\
    \n你也會發現目標價位衡量法則的重要性，尤其是在波動劇烈的行情中。本書針對各種股價型態所提供的平均獲利數據，往往只代表最佳情節的發展結果，操作上實際能夠取得的通常是「最經常發生漲幅或跌幅」。鑽石或許可以讓你獲得女朋友的芳心，但股價型態的菱形排列（鑽石形），績效通常不可捉摸。總之，除了理論方面的知識之外，還需要仰賴經驗的配合。\n\
    \n祝你好運！交易順利！\n\nThomas N. Bulkowski\n1999 年 12 月\n\n# 謝詞\n\n每個人的一生當中，通常都有幾個重要的轉捩點。幾年前，我魯莽地投稿給《股票與商品技術分析》雜誌（*Technical\
    \ Analysis of Stocks and Commodities*）。該雜誌當時的主編 Thom Hartle 決定刊載我的文章，讓我覺得非常訝異與高興。這個事件引導我踏上截然不同方向的人生旅途。\n\
    \n大約投稿十多篇文章之後，我打電話給 Thom Hartle，提到我打算編寫一本書的構想。他非常熱心把我介紹給 John Wiley & Sons 的資深編輯\
    \ Pamela van Giessen。於是，我寫了一封電子郵件給她，開啟了另一扇人生的大門。\n\n我很難透過文字表達自己對於 Thom Hartle\
    \ 與 Pamela van Giessen 的謝意。當然，在我的寫作過程中，還有很多人提供協助，例如我的弟弟吉姆，他經常幫我整理稿子，支持與鼓勵我。對於這些人，我非常謝謝他們。\n\
    \nThomas N. Bulkowski\n\n# 譯 按\n\n- 1. 譯者把排列（formation）與型態（pattern）視爲同義語，整理型態（consolidation\
    \ pattern）與連續型態（continuation pattern）也視爲同義語。\n\n- 2. 關於時間計算單位，一般書籍或文獻都按照傳統方式界定「年」、「月」、「星期」的意義。換言之，1\
    \ 年代表 365 個行曆天數或大約 252 個交易日；1 個月代表 30 個行曆天數或大約 22 個交易日；1 個星期代表 7 個行曆天數或 5 個交易日。\n\
    \n本書採用非常特殊的定義：1 年代表 12 個交易月份或 365 個交易日；1 個月代表 4 個交易週或 30 個交易日；1 星期代表 7 個交易日。所以，本書所謂的\
    \ 1 年，幾乎是一般的 1.5 年；本書所謂的 3 個月，幾乎是一般的 4 個月。\n\n可是，本書也不完全採用前述的定義。舉例來說，當作者解釋股價走勢圖的時候，月份通常都是指一般的行曆月份（因爲股價走勢圖的橫軸時間單位設定爲行曆月份）。\n\
    \n由於作者使用時間單位，通常都沒有特別說明，很容易造成困擾（舉例來說，作者曾經提到「3 個月以內的趨勢視爲短期趨勢」，這種觀點與傳統見解相同，傳統見解把\
    \ 3 個月定義爲 3 個行曆月份，但我們很難判斷作者究竟是引用傳統觀點或把「3 個月」定義爲 90 個交易日）。因此，碰到這種情況，譯文通常會稍做整理，不直接翻譯原文，儘可能避免模棱兩可的陳述。\n\
    \n- 3. 作者在本書中不斷強調一個觀念：眾數（mode）的參考價值高於平均數（mean）。關於這點，譯者並不贊同；如果讀者有興趣的話，可以翻閱統計教科書。\n\
    \n- 4. 所謂的「5%失敗」，是指價格朝某個方向突破，但還沒有出現 5%的跟進走勢之前，價格又朝相反方向發生顯著的走勢。請注意，根據本書作者的用法，5%失敗是指股價型態失敗，不是指突破失敗。譯者認爲這種用法徒增困擾，因爲「5%失敗」根本就是一種「假突破」，不是嗎？\n\
    \n價格型態大體上可以分爲兩類，第一類具有預期突破方向（例如：頭肩底或雙重頂），第二類沒有明確的突破方向（例如：等腰三角形或矩形排列）。作者認爲第一類價格型態有兩種失敗情況，一是型態本身失敗（例如：頭肩底完成——突破頸線——之前，價格跌破「頭」部谷底；或雙重頂完成之前，價格向上穿越雙重頂的較高峰位）；一是\
    \ 5%失敗情況。第二種價格型態只有 5%失敗情況（定義與前者相同），因爲這種型態沒有預期突破方向，所以型態本身不會失敗。\n\n根據譯者的看法，第一類價格型態也有兩種失敗情況，一是積極的失敗（因爲發生某種行爲而失敗），或型態本身失敗（如同前述）；一是消極的失敗（因爲沒有發生某種行爲而失敗），或「不了了之」的失敗（舉例來說，雙重底既沒有完成——沒有向上突破兩個谷底所夾的峰位水準——價格也沒有跌破雙重底的較低谷底，但走勢持續發展而讓既有的雙重底排列失去意義）。第二類價格型態只有「不了了之」的失敗（例如：等腰三角形排列沒有向上突破，也沒有向下突破，只是漫無目標的穿越三角形頂點；或者，矩形排列沒有向上或向下突破，但隨後的走勢沒有持續觸及矩形的上限或下限，使得既有的矩形排列失去意義）。\n\
    \n至於作者所謂的「5%失敗」，雖然可以定義在第一類價格型態，但沒有必要性，第二種價格型態不能合理界定「5%失敗」的意義。\n\n讓我們考慮頭肩底排列，假定價格向上突破頸線，但幅度不足\
    \ 5%，隨後又向下折返而貫穿頸線，如果價格向下折返的幅度夠大，根據作者的說明，稱為 5%失敗。這個定義顯然有困擾，多大的價格反向走勢才算「夠大」。所謂失敗，應該是指型態失敗而言；唯有當反向價格走勢跌破「頭」部的谷底，才算失敗。由另一個角度說，只要型態沒有失敗，不論價格反向走勢有多大，都稱不上失敗。所以，5%失敗應該定義為：價格向上突破頸線，但幅度不足\
    \ 5%，隨後又向下折返而跌破「頭」部的谷底。請問：「某個曾經發生假突破的失敗頭肩底」與「5%失敗的頭肩底」，兩者之間有什麼差別呢？後者除了曾經發生假突破之外，難道不是一般的失敗頭肩底嗎？\n\
    \n第二類價格型態不會發生積極的失敗；由於這類價格型態不會因為發生某種行爲而失敗，所以 5%失敗根本不能定義。就矩形排列來說，不論價格突破矩形排列的上限或下限，型態都沒有失敗。如果價格先突破上限，但沒有發生\
    \ 5%以上的跟進漲勢，稍後突破下限而繼續走低，我們不能稱此爲 5%失敗的矩形排列，因爲這個排列根本沒有失敗，它成功向下突破，先前的向上突破只能視爲假突破。（當然，如果排列最後成功向上突破——不是向下突破——結論也相同。）即使價格隨後沒有突破下限，結果演變爲「不了了之」的失敗，頂多也只能說：這個失敗的矩形曾經發生向上假突破（請注意，此處的「失敗」不是因爲「\
    \ 5%失敗」而失敗）。\n\n結論，對於第一類價格型態，沒有必要定義 5%失敗，否則只是徒增困擾，因爲 5%失敗只是曾經發生假突破的一般失敗型態。對於第二類價格型態，5%失敗與排列是否失敗完全沒有關聯，只不過代表型態曾經發生假突破，而且該型態可能屬於成功的排列。\n\
