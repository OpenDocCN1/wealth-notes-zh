    \n### 失敗案例\n\n複雜頭肩頂有兩種失敗類型，兩者都很罕見。圖 21.4 顯示第一種類型。我把向下突破定義爲收盤價跌破頸線，如果頸線向下傾斜的角度過大，則定義爲收盤價跌破肩部最深谷底。在圖\
    \ 21.4 中，只有 5 月 8 日的盤中價格一度穿越頸線，但當天價格收在頸線之上。接著，股價持續走高，直接向 上穿越頭肩頂的最高價，潛在型態宣告失敗。\n\
    \n排列本身的結構相當不錯。兩個頭部大約位在相同水準，兩肩的價格也大約相等。左右對稱的程度看起來很好，兩肩距離頭部的距離大約相同。成交量型態也很正常，左肩的量大於右肩。可是，第二個頭部出現之後，下跌過程出現大量，這點有些不尋常。總之，預先沒有任何徵兆顯示這個排列將失敗。\n\
