    如果把排列最高點視為突破點，圖 15.3 屬於 5%失敗案例（因為突破之後沒有出現 5%或以上的跟進漲勢）。反之，如果你把價格向上穿越排列上側趨勢線的位置視為突破點，這個例子屬於成功的排列。如果以後者為基準（換言之，以趨勢線突破為基準），則高位緊密旗形只有
