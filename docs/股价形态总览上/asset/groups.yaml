    5% 失敗情況的比率為 11%，向下突破的比率為 22%，提高一倍。就我個人的觀點來說，失敗率超過 20% 就不被接受。


    關於向上突破與向下突破的平均漲幅與跌幅，首先剔除 104 個向上突破失敗的案例，然後分別計算向上與向下突破的數據，結果平均漲幅為 40% 與平均跌幅為 16%。


    圖 17.3 與 17.4 分別顯示向上突破漲幅與向下突破跌幅的次數分配。向上突破的最經常發生漲幅低於 10%。請參考圖 17.3，漲幅超過 90% 的向上突破案例佔
    15%，漲幅超過 50% 的案例超過三分之一。這些偏高的漲幅會造成平均漲幅向上抻曲。


    圖 17.4 顯示向下突破的情況。請注意，橫軸的刻度單位是 5%。雖然最高欄位發生在 10%，但 5% 欄位的讀數也很高，所以我把最經常發生跌幅視為 5%
    到 10% 之間。


    ![](img/843a88de0b50d7a36e65238281a4e722_410_0.png)


    圖 17.3 吊人錘形向上突破的漲幅次數分配 最經常發生漲幅為 10%。


    ![](img/843a88de0b50d7a36e65238281a4e722_411_0.png)


    圖 17.4 吊人線形向下突破的跌幅次數分配 最經常發生跌幅介於 5% 與 10% 之間。


    成功向上突破的案例，平均花費 78 天到達最終高點。向下突破到達最終低點的平均時間為 41 天，大約是前者的一半。相互對照之下，結果還算合理，因為向上突破漲幅大約是向下突破跌幅的兩倍——價格距離愈長，所花費的時間愈久。


    我把最終高點或低點設定為趨勢顯著變動的轉折點，至少出現 20% 的價格反轉走勢。對於向上突破而言，最終高點之後必須發生 20% 或以上的跌幅。有些情況下，20%
    的價格變動幅度或許太過分，必要時會向下調整。向下突破也採用相同的方法，決定最終低點。


    吊人線形經常發生在年度高價或低價附近呢？不論向上或向下突破，吊人線形最經常發生在年度價格區間的下緣。如果考慮年度價格區間三等份的線形平均績效，我發現向上突破吊人線形發生在年度價格區間上緣，平均漲幅最高（53%）。至於向下突破吊人線形，不論它們發生在年度價格區間三等份的位置，平均跌幅都差不多，其中以上線的讀數稍高（17%）。


    吊人線形發生當時的成交量都高於平均水準。請參考表 17.3，排列發生當天的成交量較正常水準高出 15%（換言之，25 天移動平均成交量的 115%）。線形發生前一天與隔天的成交量也稍微偏高。


    此處把「大成交量」定義為 25 天移動平均成交量的 1.5 倍或以上，把「小成交量」定義為 25 天移動平均成交量的 0.5 倍或以下。


    吊人線形當天出現大成交量，績效是否比較理想？沒有任何證據顯示這種情況。吊人線形當天的成交量是 25 天移動平均成交量的 1.5 倍或以上，向上突破案例的平均漲幅只有
    28%（低於整體平均漲幅 40%）。反之，如果吊人線形當天的成交量是 25 天移動平均成交量的 0.5 倍或以下，向上突破案例的平均漲幅為 48%，顯著高於整體平均漲幅
    40%。至於向下突破，不論當時發生大成交量或小成交量，平均跌幅都大約是 16% 或 15%，約略等於整體平均跌幅。


    成交量與失敗率之間是否存在關聯？為了回答這個問題，我把向上突破案例的成交量劃分為三個等級：大成交量（成交量超過 25 天移動平均的 150%）、小成交量（成交量低於
    25 天移動平均的 50%）與正常成交量（介於大成交量與小成交量之間）。對於小成交量的向上突破，40% 的案例呈現失敗。大成交量向上突破的失敗率則只有 18%。這些數據意味著，你必須特別留意上升趨勢中的小成交量吊人線形，隨後的行情可能繼續上漲，不是向下反轉。


    ## 交易戰術


    經過周詳的考慮之後，我建議不要操作這個排列。當吊人線形發生在上升趨勢中，一般相信它代表頭部反轉的訊號。實際的情況並非如此，大約只有三分之一的吊人線形發生在頭部，其他案例都呈現後續漲勢。


    關於吊人線形的操作，我只能提供一個看法。如果吊人線形當天的開盤價遠低於盤中高價，而且價格收在盤中高價，這意味著股票具有上升動能。在這種情況下，隔天出現更高盤中高價的機會稍大。所以，如果你考慮賣出既有的持股，或許可以等待隔天更高的高價。


    如果你在臨收盤前買進，當時的價格在最高價附近（假設開盤價位在盤中低價附近），或許可以期待明天出現更高的高價。我必須重複強調，雖然隔天出現高價的機會超過一半，但超過的程度很有限，絕對不值得投下重大的賭注。


    *譯按：我們不知道「開盤價遠低於盤中高價」的程度究竟如何，只要不太過分，這個線形應該是：沒有上影線／實體不短／下影線很長的陽線。如果根據正文下一段的說法「開盤價位在盤中低價附近」，這顯然不符合吊人線形的傳統定義——吊人線形的實體長度不應該超過整天價格區間的三分之一。*


    # 頭肩底排列


    ![](img/843a88de0b50d7a36e65238281a4e722_415_0.png)


    ## 摘要資料


    - 外觀：呈現三個谷底的排列，中間谷底的位置較低。

    - 反轉或整理：短期的（長達 3 個月）多頭反轉排列。

    - 失敗率：5%。

    - 平均漲幅：38%，最經常發生漲幅為 20%~30%。

    - 成交量趨勢：下降趨勢；左肩的成交量通常大於右肩。

    - 回撤：52%。

    - 價格目標達成率：83%。

    - 參閱排列：（19）複雜頭肩底排列。


    我覺得頭部比較容易辨識，這或許是因為我花費很多時間研究何時賣出。進場建立部位相對容易，困難的是如何出場。為了掌握理想的賣出時機，我經常忽略對應的買進問題：如何辨識底部反轉排列。頭肩底型態（head-and-shoulders
    pattern）就是這類的排列之一，很容易辨識，而且獲利能力很高。


    「摘要資料」列示這個多頭反轉排列的重要統計數據。如同對應的頭肩頂排列一樣，這個底部排列的失敗率極低，只有 5%。換言之，一旦潛在頭肩底排列形成之後，價格很少向下發展，也很少向上突破之後，沒有出現
    5% 以上的跟進走勢。對於成功向上突破的頭肩底排列，平均漲幅為 38%。


    頭肩底排列的目標價位達成率為 83%，我認為 80% 以上的水準就屬於可靠排列。


    ## 緣起


    頭肩底排列的形狀如何呢？圖 18.1 顯示一個典型的例子。這支股票起漲於 1993 年 11 月，峰位出現在 1994 年 2 月。由這個峰位展開一波跌勢，隨後形成頭肩底排列。首先，下降趨勢在
    3 月底形成一個谷底，這是「左肩」。稍做反彈之後，股價再度下跌，形成一個更低的谷底，這是「頭」。頭部的反彈走勢結束之後，價格又下跌形成另一個較高的谷底，這是「右肩」。整個排列夾著兩個峰位，繪製一條直線銜接這兩個峰位，即是頭肩底排列的頸線（neckline）。


    ![](img/843a88de0b50d7a36e65238281a4e722_417_0.png)


    圖 18.1 頭肩底排列。較低的「頭」夾在「左肩」與「右肩」之間。左肩的成交量通常大於右肩。


    當左肩-頭-右肩出現之後，即是潛在的頭肩底排列；一旦價格向上突破頸線，頭肩底排列即告完成（或經過確認）。在圖 18.1 的例子中，價格確實向上突破頭肩底的頸線，但漲勢沒有持續很久，很快又跌到先前的右肩位置。經過長達
    4 個月的盤整之後，最後才完成另一個頭肩底排列，並且向上突破而展開一段較可觀的漲勢。截至 1995 年 8 月中旬，這支股票的交易價格稍低於 $60。


    對於正常的頭肩底排列，左肩的成交量應該最大，頭部稍微縮小，右肩更小；由頭到右肩之間的漲勢，成交量應該配合擴大，最後又夾著大量突破頸線。


    圖 18.1 的例子中，成交量型態稍微不尋常。由頭部到右肩之間的漲勢過程，成交量沒有增加。向上突破頸線，也看不到顯著的大量。成交量型態或許可以解釋這個頭肩底排列為何缺乏上漲動能。


    圖 18.2 是週線圖的頭肩底排列。我挑選這個例子，藉以說明頭肩底排列的底部反轉型態。底部排列通常發生在延伸性跌勢的末端。一旦型態完成之後，價格向上反轉，並且繼續攀升。


    ![](img/843a88de0b50d7a36e65238281a4e722_418_0.png)


    ![](img/843a88de0b50d7a36e65238281a4e722_418_1.png)


    圖 18.2 週線圖上的頭肩底排列。這隻股票花費數個月的時間才完成頭肩底排列，並且向上突破。成交量呈現典型的結構：左肩最大，其次是頭，右肩的成交量很小。


    頭肩底排列為何會形成呢？這代表一段探底的過程，最低價往往代表市場認同的理想價值。隨著股價下跌到 1994 年 2 月份，愈來愈多的投資人開始逢低承接。雖然股價持續下滑，但成交量還是放大，左肩出現的當週，甚至爆出突厥性大量。在買盤的推動下，價格止跌回升，但漲勢只維持一個星期。隔週，價格再度下滑。同樣地，當價格創新低的「頭」部，成交量又顯著放大。精明資金持續進場逢低承接，相信股價必然向上反彈。股價確實向上發展，右肩停頓過程中，成交量萎縮。


    三個谷底的成交量持續下降。左肩的成交量最大，頭部稍微萎縮，右肩的成交量明顯縮小。唯有當價格由右肩翻升而開始進行突破的過程中，成交量才會再度放大。


    圖 18.2 的突破量似乎沒有顯著放大——取決於突破點的認定位置。8 月底，價格明確向上突破頸線，但成交量在兩個星期之後才顯著放大。


    ## 辨識準則


    表 18.1 列示頭肩底排列的辨識準則。相關的說明，請對照圖 18.3。這個範例並不是發生在延伸性下降趨勢的末端，而屬於短期（3 個月以內）的整理型態。整波段的漲勢起始於
    1994 年 6 月份的另一個頭肩底排列。由 1995 年 3 月中旬到 5 月初之間，股價呈現稍微朝下的橫向走勢，所以目前這個頭肩底也可以視為短期下降趨勢的底部反轉型態，但屬於長期上升趨勢的連續型態。


    ### 表 18.1 頭肩底排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 形狀 | 由三個谷底構成的底部排列，中間谷底的位置最低。類似人體上半身的顛倒形狀：左肩-頭-右肩。三個谷底與所夾兩個轉折高點的形狀必須非常明確。 |

    | 對稱性 | 左肩與右肩必須分別位在「頭」的兩側，兩肩與頭之間的時間距離大約相等，兩肩的價位也大約相同。雖然每個排列的實際形狀各自不同，但基本上必須以頭部為準而左右對稱。
    |

    | 成交量 | 一般來說，左肩或頭的交易量大，右肩的成交量很小。 |

    | 頸線 | 三個谷底夾著兩個轉折高點，繪製一條直線銜接兩個轉折高點，稱為頸線。價格向上突破頸線，代表頭肩底完成的訊號。如果頸線的斜率太陡峭，則採用較高的轉折高點做為突破水準。
    |

    | 向上突破 | 突破方向朝上，價格通常夾著大成交量進行突破，顯示充分的向上動能。小量突破未必代表突破可能失敗。 |


    整個排列呈現三個具有預測意義的谷底：左肩、頭與右肩。左肩與右肩的價位大致相同，它們與頭之間的寬度也大約相當。頭肩排列通常都具備這種左右對稱的性質——不論是頭肩頂、頭肩底或複雜頭肩型態。如果左肩的轉折相當尖銳或圓滑，右肩也應該呈現相同形狀。


    頭與兩肩應該保持合理的價格距離。我特別指出這點，主要是為了區別頭肩底與三重底排列——後者也是由三個谷底構成的底部排列，但三個谷底的價位大約相同。


    ![](img/843a88de0b50d7a36e65238281a4e722_421_0.png)


    圖 18.3 罕見案例：發生在主要上升趨勢中的頭肩底連續排列。


    請參考圖 18.3，左肩突然出現 3 天的跌勢，然後回升而出現轉折高點。頭與右肩之間的漲勢也大約上漲到相同價位的轉折高點，然後下跌形成右肩，右肩與左肩的價位大約相同。這五個轉折點——三個谷底與兩個轉折高點——都非常清楚，形狀明確。這個特性非常重要，尤其是瀏覽走勢圖篩選頭肩排列的時候。


    對稱性是篩選有效頭肩排列的另一個重要準則。以「頭」為基準，排列的左、右兩側應該相互對稱。左肩與右肩的價位大約相同，兩肩與頭之間的時間距離也應該約略相同。每個實際案例的排列結構當然各自不同，但對稱性能夠有效區別頭肩底與任何三個谷底構成的排列。


    成交量也經常能夠協助辨識有效的頭肩底排列。左肩的成交量通常最大，其次是頭部，右肩的成交量最小。所以，就排列整體而言，成交量型態呈現下降趨勢，直到向上突破為止。


    頭肩底排列的三個谷底夾著兩個轉折高點，利用一條直線銜接這兩個峰位，就是所謂的頸線。頸線可能向上或向下傾斜。理想的頭肩底排列，頸線的傾斜角度最好不要太大，但也不能因為頸線陡峭而排除頭肩底型態的可能性（請參考圖
    18.1，其中的頸線就非常陡峭）。


    另外，即使成交量呈現不規則型態，也不能因此而排除頭肩底的可能性。舉例來說，圖 18.1 與 18.3 的兩個例子，頭部的成交量都較大。


    價格向上突破頸線的过程中，通常會發生大量。可是，在成功向上突破的頭肩底排列中，大約有四分之一的案例，突破當天的成交量小於前一天。事實上，大部分的 5% 失敗案例都是夾著大量向上突破，相關資料請參考「失敗案例」一節。總之，突破當天通常——但不必然——發生大成交量。


    ### 失敗案例


    如同大多數其他排列一樣，頭肩底也有兩種失敗類型。第一種失敗類型，是在右肩形成之後，價格沒有向上突破頸線，反而向下跌破頭部的價位。請參考圖 18.4，這個頭肩底發生在延伸性下降趨勢中，這段跌勢起始於
    1994 年 2 月份的峰位 $38\frac{1}{4}$，6 月份的最低價為 $21\frac{1}{4}$（頭肩底的「頭」），跌幅為 45%。當右肩出現時，趨勢似乎即將向上反轉。


    # ASA Holdings (亞薩迦)，NASDAQ，代碼 ASAI


    ![](img/843a88de0b50d7a36e65238281a4e722_423_0.png)


    請注意，在圖 18.4 的例子中，左肩與右肩的形狀幾乎完全相同，價格大約相差 $1，頭部位遠低於兩肩。右肩與頭的時間距離稍長於左肩。大體上來說，這屬於典型的頭肩底排列。


    整個排列過程中，成交量都很小。左肩與頭的成交量大約相同，右肩的成交量反而稍大。當然，我們不能因為成交量呈現不規則型態而剔除頭肩底的可能性，但至少應該特別留意。


    右肩形成之後的上漲走勢，成交量呈現下降趨勢，這段漲勢顯然沒有向上突破頸線，事實上距離還相當遙遠。


    仔細觀察排列的每個構成部分，實在看不出來這個型態之所以失敗的理由。交投或許不夠熱絡，成交量型態或許不規則，但理由畢竟不夠充分。


    圖 18.5 則顯示另一類的失敗案例，也是我所謂的 5% 失敗。頭肩底排列確實向上突破，但沒有出現 5% 或以上的跟進漲勢。三個谷底非常凸顯。左肩與右肩的形狀不同，但兩個轉折高點的形狀非常類似。兩肩的價位差距並不離譜。


    # Airborne Freight (空運，NYSE，代碼 ABF)


