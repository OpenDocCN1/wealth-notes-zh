    在突破趨勢線之前，價格都始終停留在趨勢線之上。只有 9% 的案例曾經向下突破，但沒有出現顯著的跟進跌勢。這屬於 5% 失敗案例。


    大多數 BARR 頭部排列都向下突破：584 個案例向下突破（相當於 90%），只有 1 個水平突破的案例。在向下突破的案例中，大約有三分之一（39%）出現回升走勢。向下突破之後，1
    個月以上才折返到趨勢線的走勢，視為正常價格波動，不屬於回升走勢。回升走勢的平均完成時間（折返趨勢線）為 12 天。


