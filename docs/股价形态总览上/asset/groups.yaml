    假定你考慮買進某家公司的股票，如果你能夠確定明天的價格一定比今天低，那不是太棒了嗎？可是，如何能夠知道明天的價格呢？這就是我發現 BARR 頭部排列當時所考慮的問題。我嘗試找到某種可靠的方法，判斷明天的價格高於或低於今天水準？差距是多少？


    我透過各種數學公式，嘗試提高預測的精確性，但效果非常有限。於是，我改用視覺的方法。在股價走勢圖上繪製趨勢線，試圖判斷股價跌破趨勢線的程度。我觀察各種走勢圖與趨勢線，希望找到趨勢線與隨後突破走勢之間的關係。結果，我發現蹦跳-奔馳排列（bump-and-run
    formation，簡稱 BARF）。稍後，我考慮這個排列的名稱問題，投資界或許不認同這個新排列的有效性。所以，我決定採用一個比較生動力 的名稱：蹦跳-奔馳反轉（bump-and-run
    reversal）排列，簡稱為 BARR。


    # 緣起


