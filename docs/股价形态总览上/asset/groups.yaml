    ## 統計數據


    表 14.2 列示旗形與三角旗形的一般統計數據。在 500 支股票的 5 年期間內，我總共找到 144 個旗形與 106 個三角旗形，數量少於當初的預期。


    除了 23 個例外情況，所有的排列都屬於連續型態；整理結束之後，價格又恢復排列發生之前的趨勢方向。失敗率大体上還算合理：下降與上升趨勢的旗形失敗率分別為 12%
    與 13%，三角旗形的失敗率較高，上升趨勢為 19%，下降趨勢為 34%，後者已經超過可靠型態的最高門檻 20%，儘量避免操作這個型態。


    幾乎所有的旗形（87%）與很多三角旗形（75%）的行為都按照預期發展；換言之，排列完成之後，價格繼續朝排列發生之前的方向繼續發展。


    表 14.2 也顯示旗形與三角旗形發生回升或回挫走勢的頻率。針對這兩種排列進行交易，大可忽略回升或回挫走勢的可能性，因為發生頻率太低。


    旗形與三角旗形的平均長度分別爲 11 天與 10 天，相當短暫。如同「辨識準則」提到的，這兩種排列的涵蓋期間通常介於幾天到 3 個星期之間。


    兩種排列的成交量型態大多呈現下降趨勢，具備這種趨勢的旗形排列佔 78%，三角旗形佔 90%。為了確認這點，我針對排列開始到結束之間的成交量時間序列進行迴歸分析；結果，迴歸直線的斜率確實向下。如同我稍早提到的，如果排列內的成交量呈現放大趨勢，並不足以判定該排列可能失敗。


