    在向下突破的案例中，發生回升走勢的比率大約佔 45%；換言之，價格跌破頸線之後，又重新回升到頸線附近，請參考圖 20.1 與 20.3 的例子。由價格向上反彈，一直到觸及頸線為止，回升走勢的完成期間平均爲
    11 天。


    由頸線突破點起算，平均大約需要 91 天，價格才會到達最終低點。這似乎是本書討論的空頭排列典型情況。當然，某些排列可能代表較長期趨勢的變動，由突破點到最終低點的期間通常介於
    3 個月到 6 個月之間（短、中期的操作意涵）。


    如果觀察前述價格到達最終低點的時間次數分配，結果也顯示頭肩頂排列屬於短期型態。絕大部分的案例（256個或66%）落在3個月之內，83個案例介於3個月到6個月之間，53個案例超過6個月。


    考慮排列發生在最近12個月價格區間的位置，可以感受頭肩頂排列的可能績效。首先，我剔除研究期間起點一年之內結案的案例（因為這些案例涵蓋的年度價格期間不完全處在研究期間之內）。其次，我把每個排列的年度價格區間劃分為三等份。按照突破價位把每個排列歸納到三等份之內——上緣、中央或下緣。結果顯示大部分排列（49%）的突破點位在年度價格區間高點附近，這意味著大部分頭肩頂發生在上升趨勢的末端。


    相對於其他位置，那些在年度價格區間上緣發生突破的排列，績效是否更理想（隨後的跌幅是否更大）？沒有證據顯示如此，不論突破位置發生在年度價格區間的哪個位置，隨後的跌幅都大約相同，介於21%到22%之間。對於其他大多數的空頭排列，發生在年度價格低點附近的型態績效往往最理想。


    表 20.4 顯示頭肩頂排列的成交量統計數據。篩選排列的過程中，我對於成交量型態沒有採取任何假設。可是，針對我所篩選的案例進行迴歸分析，結果顯示明確的趨勢傾向。幾乎三分之二的排列（62%）呈現成交量萎縮的情況。本章提供的許多圖形也清楚顯示這種成交量下降趨勢。


    如果只觀察三個峰位的成交量，最大的成交量通常發生在左肩，其次是「頭」部，右肩的成交量最小。


