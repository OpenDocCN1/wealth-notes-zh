    排列向下突破之後，平均跌幅為 18%，最經常發生跌幅則不足 10%。最經常發生跌幅是採用次數分配衡量，我把所有案例的跌幅歸納為 10 個區間：10%或以下、11%~20%、21%~30%……81%~90%與
    90%或以上。案例發生次數最多的區間，即代表最經常發生跌幅，目前這個排列是 10%或以下。平均跌幅顯然超過最經常發生跌幅，主要是因為有幾個讀數偏大的離群值，還有相當多案例的跌幅介於
    15%到 20%之間。


    關於失敗案例的漲幅，我也採用相同的方法衡量。所謂失敗，是指排列向上突破或向下突破的跟進走勢沒有超過 5%。失敗排列的平均漲幅為 32%，最經常發生漲幅為 20%。在向上突破的案例中，四分之一以上（27%）的漲幅超過
    50%。


    關於目標價位，如果按照一般方式由突破點向下衡量排列高度，結果相當令人失望：成功向下突破的案例中，只有 43% 的案例滿足或超過目標價位。於是，我把排列高度取代為排列的一半高度。換言之，排列最高價減去排列最低價，差值除以
    2；然後，同樣由突破點向下衡量這項距離。結果，有 91%的成功排列得以滿足目標價位。


    排列的平均時間長度幾乎是 3 個月，型態已經足以顯示在週線圖上。另外，我也衡量排列結束到隨後最低價發生的時間距離，結果大約是 3 個月。


    表 2.3 顯示突破相關的統計數據。在所有向下突破的 151 個案例中，只有 13 個突破沒有發生 5%或以上的跟進跌勢（相當於 9%）。另外，在所有向上突破的
    52 個案例中，只有 3 個突破沒有發生 5%或以上的跟進漲勢（相當於 6%）。由這些數據顯示，上升擴張排列只要發生突破，通常都會出現跟進的走勢。投資人顯然應注意這項性質，順勢操作。


