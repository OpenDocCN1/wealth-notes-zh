    與 $22\%$ 之間的差異實在太小，我甚至懶得檢定這方面的差異是否具有統計上的顯著意義。平均跌幅為 $21\%$ 或 $22\%$ ，難道會造成操作上的影響嗎？應該不至於。順便提及一點，所謂「大成向量」與「小成交量」，都是比較當時成交量與
    25 天期移動平均量。如果成交量大於移動平均，稱為大成向量；反之，如果成交量小於移動平均，稱為小成交量。


