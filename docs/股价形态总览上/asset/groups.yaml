    ## 交易戰術


    表 1.5 顯示擴張底的交易戰術。第一個戰術是決定進場交易的獲利潛能。這個衡量法則有助於預測目標價位。把排列最高價減去排列最低價，結果是排列的高度。把排列最高價加上排列高度，結果就是向上突破的目標價位，把排列最低價減去排列高度，結果就是向下突破的目標價位。


    圖 1.5 清楚顯示計算程序（參考第 39 頁）。A 點是排列最高價$14^{1}/_{8}$，B 點是排列最低價$12，排列高度是$2^{1}/_{8}$。由排列高價向上衡量排列高度，向上突破的目標價位是$16¼；由排列低價向下衡量排列高度，向下突破的目標價位是$9^{7}/_{8}$。由圖
    1.5 可以看見，價格向下突破之後，始終沒有接近目標價位。


    | 表 1.5 擴張底的交易戰術 |

    | --- |

    | 交易戰術 | 解釋 |

    | 衡量法則 | 設定排列內的最高價與最低價，計算兩者的距離。由突破點向上或向下衡量前述的距離，結果就是向上突破或向下突破之後的目標價位。 |

    | 低點買進 | 一旦判定擴張底排列之後，買點設定在股票於低點向上轉折的位置。 |

    | 多頭停損 | 停損點設定在轉折低點下側 1/8 點處，防範趨勢向下反轉。 |

    | 高點放空 | 賣點設定在股票於高點向下轉折的位置。 |

    | 空頭停損 | 停損設定在轉折高點上側 1/8 點處。當股價觸及下側趨勢線而向上轉折，回補空頭部位。如果排列向下突破，在目標價位或任何支撐水準附近回補。
    |

    | 調整停止點 | 一旦價格穿越前一個轉折高點（多頭部位），將停止點調高到前一個轉折低點；一旦價格穿越前一個轉折低點（空頭部位），將停止點調降到前一個轉折高點。
    |

    | 其他 | 如果擴張底出現部分漲勢或部分跌勢，前者適合放空，後者適合做多。 |


    對於向下突破的擴張底，價格滿足衡量法則的達成率爲 70%，向上突破更只有 59%。我認爲，可靠價格型態滿足目標價格的達成率至少應該有 80%，前述兩個數據都明顯偏低。


    當你看見某個擴張底排列出現兩個轉折高點與兩個轉折低點，就可以考慮進場交易。價格由下側趨勢線反彈，適合買進股票。當價格向下反轉時，考慮賣出。向下反轉可能發生在部分漲勢之後，也可能觸及上側趨勢線之後才反轉。請注意，反彈走勢也可能演變爲向上突破，所以不要太早賣出而縮減獲利。


    在上上升走勢中，把停損點設定在轉折低點的下側 1/8 點處。萬一股票向下反轉，多頭部位可以侷限損失。當股價朝上側趨勢線發展，一旦股價穿越前一個轉折高點，停止點可以移到前一個轉折低點下側
    1/8 點處。轉折低點可以扮演支撐功能，結束多頭部位之前，應該讓股票有機會在支撐點反彈*。


    向下突破也採用相同的交易戰術。當價格觸及上側趨勢線而開始向下反轉，進場放空股票。停損點設定在排列最高點上側 1/8 點處，然後祈禱股價下跌。如果蒙受幸運之神的眷顧而股票確實朝下發展，把停止點向下調降到前一個轉折高點的上側
    1/8 點處。


    如果擴張底排列出現部分漲勢或部分跌勢，可以考慮採取行動。這是相當可靠的突破訊號。部分漲勢意味著向下突破，正確機率有 67%；部分跌勢意味著向上突破，正確機率有
    80%。不要錯過這類勝算偏高的機會，但必須把停損點設定在最近轉折點的上側或下側 1/8 點處，防範意外情況發生。


    ## 交易範例


    蘇太太自認爲是家裡的智慧主宰。蘇先生是一位水泥工，這兩天正因爲天氣下雨而在家裡休息，她則忙著敲鍵盤，服侍她的電腦主人。蘇太太是一位相當活躍的股票交易者，甚至不害怕建立股票空頭部位，只要放空對象的基本面與技術面都非常弱的話。金融投機的壓力或許很大，但賺錢的機會也很多。


    當她察覺圖 1.5 的擴張底排列，就開始追蹤分析。1991 年 11 月初，股價曾經創$37^{3}_{8}$ 的高價，然後就一路走低。現在是 1993 年
    4 月下旬，股價位在$14$ 附近，她懷疑下檔還有多少空間。沿著排列上緣與下緣分別繪製趨勢線，計算交替觸及點的個數（圖 1.5 標示三個觸及點，A 點是第
    4 個觸及點）。


    由於大多數擴張底排列都在完成四個交替觸及點之後就進行突破，而且當時價格正由排列頭部向下轉折，她猜想股價可能直接向下滑穿下側趨勢線。所以，她在$13^{7}_{8}$
    放空。當然，這是一場賭博，但她自認爲掌握勝算。雖說如此，空頭部位建立之後，她還是立即把停損買單設定在$14^{1}_{4}$（A 點上側的 $1/8$ 點處）。


    兩天之後，股價開始暴跌，在 B 點觸及下側趨勢線。蘇太太非常高興，因爲交易通常不會如此順手。她決定保障既有的獲利，把停止買單調降到最近轉折低點（C 點）上側
    $1/8$ 點處，相當於是$13^{3}_{4}$。然後，等待。


    股價觸及下側趨勢線之後，並沒有如她預期的直接貫穿，而是向上彈升。她決定耐心觀察，看看隨後的走勢。由於停止買單設定在當初放空的價位附近，部位應該不會發生虧損，所以她不覺得有什麼壓力。


    ### Acuson Corp（醫療供應商，NYSE，代碼 ACN）


    ![](img/843a88de0b50d7a36e65238281a4e722_59_0.png)


    圖 1.5 五個交替觸及點的擴張底排列。由於發生部分漲勢，預料向下突破。


    股價在$12^{1}_{8}$ 觸及支撐而止跌，然後向上反彈，結果在出現部分漲勢之後又下滑。反彈峰值出現之後第二天，她相信股票下一次觸及下側趨勢線必定會突破。於是，她在$12^{7}_{8}$加碼放空。蘇太太的判斷不完全正確。股價雖然下跌，但不久之後又向上反彈。她調整停止買單的數量，但價位仍然設定在$13^{\%}$，然後繼續等待。股價緩慢攀升，最後在$13^{1}_{8}$創反彈高點之後下跌。這次的跌勢相當兇猛，在下側趨勢線的支撐區稍做停頓，然後買穿。


    股票跌破 B 點之後，蘇太太把停止點移到 B 點上側的 1/8 點處，相當於$12^{1}_{8}$。然後，利用衡量法則計算下檔的目標價位，結果是$9^{7}/_{8}$。她非常懷疑股價滿足這個目標價位的可能性，所以決定在$10^{1}/_{8}$獲利了結；換言之，出場停止買單設定在整數價位$10的上方1檔處（整數價位可以視爲支撐或壓力）。


    當價格夾著大量暴跌到$10^{3}/_{8}$，她懷疑這是單日反轉的價格型態。可是，這種排列的靠性很低，實在不能判斷股價將反轉或繼續下挫，所以她決定不採取行動，出場點還是設定在原處$10^{1}/_{8}$。


    兩天之後，價格大幅回升，停止點遭到觸發，但成交價格是$12^{1}/_{8}$。這筆交易的獲利不多（大約是9%，持有期間1個多月），但得到一點經驗，銀行戶頭的存款也多了一些。


    * 譯按：關於停損點的調整，此處的說明過份簡略。以圖 1.1 爲例，假定多頭部位建立在第 4 點向上反彈之後，起始停損設定在第 4 點下側 1/8 點處，一旦價格向上穿越第
    3 點，把停止點調高到第 2 點下側 1/8 點處。空頭部位的情況也類似。


    # 擴張排列


    ## 上升直角三角形


    ![](img/843a88de0b50d7a36e65238281a4e722_61_0.png)


    ### 摘要資料


    - 外觀：水平狀底部，高點持續墊高，上側趨勢線向上傾斜。

    - 反轉或整理：短期的（少於 3 個月）空頭反轉排列。

    - 失敗率：34%。

    - 等待突破之後的失敗率：9%。

    - 平均跌幅：18%，最經常發生跌幅大約是 10%。

    - 成交量趨勢：不規則。

    - 回升：72%。

    - 價格目標達成率：43%；採用排列高度的一半，達成率爲 91%。


    這個型態經常讓人誤以爲價格具有上漲的傾向，因爲排列的名稱是上升直角三角形擴張排列（right-angled ascending broadening formations）。然而，它實際上屬於短期空頭反轉排列。這不是什麼特殊的發現，很多書籍都曾經討論上升擴張排列的空頭性質。排列名稱中的「上升」，是指轉折高點持續墊高的現象。這個排列的底部呈現水平狀，但上側趨勢線向外發散，通常向右上方向傾斜。


    「摘要資料」內沒有什麼令人訝異之處。如果在向下突破之後才進場買進，失敗率可以由 34%下降到 9%。等待突破之後才採取行動，通常都會讓失敗率改善，但改善的程度很少如此顯著，這主要是因爲完全排除向上突破的可能性，而且向下突破的失敗案例很少。


    另一個有趣的統計數據是價格向下突破之後，向上回升（pullback）到排列底部的走勢發生頻率。這個數據之所以偏高，一方面是因爲突破走勢拖泥帶水，經常向上反轉。價格向下突破之後，呈現一段起伏頗大的水平狀走勢，然後繼續下跌。突破的貫穿程度經常只有
    10%~20%，很容易恢復，所以回升走勢的發生頻率高達 72%。


    ### 緣起


    上升直角三角形擴張排列：這個名稱蘊含什麼意義？直角意味著這個排列的形狀屬於三角形家族的直角三角形：底部爲水平狀，斜邊（hypotenuse）向右上方向傾斜，由斜邊向底部垂直的線段構成第三邊。第三邊與底部的夾角爲
    90 度，這也是所謂的「直角」。上升是指三角形斜邊將隨著排列發展而上升（對照第 3 章討論的下降直角三角形擴張排列）。擴張排列意味著排列發展過程中，高價持續墊高。請注意，不論哪種擴張型態，排列的價格攪動將隨著時間經過而發散；反之，在三角形排列中，不論上升、下降或等腰三角形，排列的價格攪動將隨著時間經過而收斂（請參考第
    38 章~第 41 章）。


    請參考圖 2.1 的排列結構，其中包括兩個案例。第一個排列的形狀比較不標準，但呈現典型的行爲。這兩個排列的底部都是由水平狀趨勢線銜接轉折低點而構成。向右上方傾斜的斜邊則銜接轉折高點。結果，排列呈現三角形的形狀，價格向外發散，但不要让持續墊高的高點矇騙。這個排列屬於空頭型態：價格通常朝水平狀底部突破。


    ![](img/843a88de0b50d7a36e65238281a4e722_63_0.png)


    圖 2.1 兩個上升直角三角形擴張排列，底部爲水平狀，斜邊向右上方傾斜。價格向下突破。


    上升直角三角形擴張排列為什麼會形成呢？請觀察圖 2.2，股價由 1991 年 12 月中旬開始上漲，成交量也出現 2 個月以來的大量。2 月底的時候，股價在$14
    創新高。接著，股價回檔而在$12¼獲得支撐，並且在此盤整 2 個星期，形成水平狀的趨勢線。


    ![](img/843a88de0b50d7a36e65238281a4e722_64_0.png)


    圖 2.2 回升排列底部的走勢。上升擴張排列經常出現回升走勢。


    水平狀趨勢線發生的原因之一，是此處價位代表市場認同的價值。當股價逼近$12 附近，許多散戶與法人開始買進。投資人希望在他們認爲理想的價位買進，而且賣方繼續殺低願意願也下降。買進力道使得跌勢獲得支撐，最後甚至推高股價。4
    月中旬，價格夾著大量暴漲，價格創新高。隔天的動能不減，盤中價格再創新高，但收盤價拉回。銜接兩個高點的暫時趨勢線朝右上方傾斜，逐漸顯露擴張排列的形狀。


    價格快速下跌，甚至夾著大量。這波跌勢停頓的位置，隔著下側趨勢線還有一段距離。然後，價格又開始回升，並且在 5 月 6 日創新高$15½。這個新高價剛好落在上側趨勢線的延伸線，凸顯這條趨勢線的壓力強度。


    隔天，成交量劇減，但動能還足以讓股價測試高點。測試失敗之後，精明資金開始打道回府，成交量進一步萎縮。隨著價格挫跌，一般散戶也加入賣出行列，成交量上升。不到兩個星期，股價就回到下側趨勢線附近。


    股價嘗試回升，但成交量無法配合放大，最後在相對高檔出現一個多星期的橫向走勢——部分漲勢經常預示著更大的麻煩。6 月 4 日，價格夾著大量回挫到下側趨勢線。股票在此盤整大約一個星期，終於跌破$12¼
    的支撐。


    突破之後，上升擴張排列經常出現回升走勢（pullback），所以最初的跌勢很快就趨於緩和。第一波買穿走勢的跌幅大約有 13%，然後價格回升到排列底部。雖然圖
    2.2 沒有顯示，但這支股票隨後繼續上漲，10 月底開始形成另一個上升擴張排列，底部位在$16½。


    上升擴張排列顯示投資人以交易者嘗試在某特定價位吸納股票，就圖 2.2 的例子來說，這個價位是$12 \frac{1}{4}$。買進力道推升股價，直到漲勢遭逢上檔阻力而被壓回。每波漲勢的獲利了結賣壓發生在愈来愈高的價位，所以上側趨勢線朝右上方傾斜。最後，排列底部的買盤力道瓦解，支撐力道潰散。一旦發生這種情況，股價向下突破而展開跌勢。整個下跌走勢持續發展，直到市場認定該價位又具有投資價值而買進。


    **表 2.1 上升直角三角形擴張排列的辨識特質**


    | 特質 | 討論 |

    | :--- | :--- |

    | 形狀 | 略似喇叭狀，但排列底部為水平狀，上側趨勢線朝右上方傾斜。 |

    | 底部水平支撐線 | 銜接轉折低點的趨勢線呈現水平狀或類似水平狀。至少需要兩個顯著的轉折低點才能銜接一條趨勢線。 |

    | 頭部向上傾斜趨勢線 | 排列的轉折高點持續墊高，銜接為一條向右上方傾斜的趨勢線。至少需要兩個顯著的轉折高點才能銜接一條趨勢線。 |

    | 成交量 | 不規則，缺乏穩定的型態。 |

    | 提前突破 | 非常罕見。只要收盤價貫穿水平趨勢線，通常都是真正的突破。 |

    | 突破前的價格行爲 | 突破之前，價格經常出現長達幾個月的橫向盤整走勢。突破之後，可能回升排列底部附近。 |

    | 向下突破 | 向下突破過程中，通常會夾著大量。 |

    | 支撐與壓力 | 兩條趨勢線的延伸，將繼續發揮支撐與壓力功能。 |

