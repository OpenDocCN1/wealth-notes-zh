    的營運。他拜訪了幾家 JCB 超級市場，看到的情況都非常類似：停車場擠滿車子，營業場所人來人往，顧客手推車上都堆滿商品，收銀櫃檯前面大擺長龍。他與一些顧客閒聊，嘗試瞭解顧客的性質，甚至向卸貨的供應商探聽一些消息。回到辦公室之後，他徹底分析
    JCB 的財務報表，並且研究競爭對手的情況。核對所有的細節之後，他打電話給自己的財務投資主管，指示他在 $10 以下買進 JCB 超級市場的股票。


    擴充計畫的新聞傳開之後，金融市場開始恐慌。當時的經濟情況不太理想，甚至可能出現景氣衰退的狀況，顯然非常不適合擴充業務。JCB 股價跌破$10，湯姆的手下開始採取行動，默默吸進股票，沒有引起任何疑惑。可是，股價還是上漲了。先是回升到$11，然後繼續上漲到$12，最後攀升到$13
