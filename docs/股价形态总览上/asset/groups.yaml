    \ 月中旬完成這個目標價位，但隔週就出現暴跌走勢。\n\n![](img/843a88de0b50d7a36e65238281a4e722_243_0.png)\n\
    \n圖 9.9 衡量法則的兩個例子。計算排列的一半高度，由杯口右緣向上衡量一半高度，結果即是保守的目標價位。操作內杯，比較容易掌握進場價位。1995 年 6\
    \ 月與 7 月之間，出現上升直角三角形擴張頂排列。\n\n比較保守的目標價位，是由杯口右緣向上衡量杯狀一半高度（$4½$），結果是$23½$，完成於 7\
    \ 月初。排列向上突破之後，很快就完成保守的目標價位，不若較高目標價位達成過程中曾經發生巨幅波動走勢。\n\n篩選帶柄杯狀排列，採用表 9.1 的未經過篩選準則。相對於過濾的篩選準則，未經過濾的績效比較理想。\n\
    \n對於一般的排列，我通常建議在收盤價突破之後進場，但目前這個排列向上突破之後發生回挫走勢的機會高達 74%，所以應該等待價格重新折返。換言之，等待價格折返而重新向上穿越杯口右緣，才進場買進。這項技功能夠讓平均漲幅由\
    \ 38% 提高到 39%。\n\n請回頭觀察圖 9.4，暫時假定這是一個有效的帶柄杯狀排列。如果在向上突破之後買進，成交價格可能介於$30¼到$32之間（這是向上穿越杯口右緣之後的價格區間）。回挫走勢發生之前的高價為$34½。\n\
    \n你或許會繼續持有股票，看著到手的獲利又消失。可是，如果你準備等到回挫走勢之後才進場，根本不會買進股票。為什麼？在這種情況下，當 3 月 16 日發生回挫走勢（價格向下跳空），你還保持空手。然後，你等待收盤價重新站上杯口右緣，但這從來沒有發生，所以你根本不會進場。\n\
    \n話說回來，等待回挫走勢也可能讓你錯失一些機會。以圖 9.9 為例，這個排列向上突破之後並沒有發生回挫走勢（請注意，完成在 30 天之後的折返走勢不視爲回挫；另外，目前這份走勢圖是週線圖）。這意味著你根本沒有進場機會。\n\
    \n圖 9.9 的杯狀排列包含一個內杯（inner cup'）。如果你能夠辨識內杯，而且準備操作這個排列，可以考慮買進。內杯是發生在杯狀排列之內的杯狀排列，內杯的杯口左、右外緣必須相隔一段距離，價位大約相等（低於外杯的杯口左緣），當柄部走勢結束而向上穿越內杯的杯口右緣，進場買進，獲利了結的賣點設定在外杯的杯口左緣。就圖\
    \ 9.9 來說，這段操作的獲利為$2，相當於 12%。\n\n一旦進場建立部位之後，最初的停損點設定在柄部低點下方 1/8 點處。柄部低點代表支撐；萬一走勢跌破支撐，這個停損可以讓妳迅速出場。\n\
    \n如果股價上漲，把停損調整到最近支撐下方的 1/8 點處，儘快把停損調整到損益兩平點。萬一股價向下反轉，就可以減少損失。然後，隨著股價走高而繼續向上調整停止賣單。這種設定停止點的技巧，最後會讓多頭部位自動結束——因爲任何漲勢最終都會結束；當股價反轉下跌，一旦觸及停止賣單，你就出場了。\n\
    \n## 交易範例\n\n小明還在唸高中，他不確定自己將來打算從事什麼行業，但至少還有幾年的時間可以慢慢琢磨。在追求女朋友的閒暇空檔中，他總是埋首研究報紙的金融版，或分析電腦螢幕上的股價走勢圖。他對股票交易很有興趣，這可能是遺傳的緣故，他父親任職於某家大型經紀商。\n\
    \n小明雖然沒有參加學校的投資社團，但他的一些朋友則是團員。某天，小明聽到他們談論圖 9.9 的股票。他最初沒有想太多，直到深入觀察才發現其中蹊蹺：帶柄杯狀排列。\n\
    \n他並不認爲這是一個很好的交易機會，而且也沒有錢可供投資。可是，他還是決定在紙上進行交易，看看有什麼收穫。他透過電腦叫出日線圖，打算在價格向上突破內杯的時候買進（圖\
    \ 9.9 的 C 點）。\n\n經過幾個星期，他所等待的買進訊號始終沒有出現。最後，股價終於向上突破內杯的杯緣，但小明錯失進場的機會，因爲當他觀察股價走勢圖的時候，已經發生回撤走勢。所以，他決定等待價格重新穿越\
    \ C 點才進場。\n\n這發生在 5 月 9 日，他女朋友生日的前一天。感受到某種喜兆，他按照當天的收盤價$15¼在紙上記錄買進。隔天，生日聚會，女朋友對於自己的生日禮物顯然不滿意，而且當天的價格還收低。\n\
    \n小明當初把停損點設定在柄部最低點的下方 1/8 點處（$14¾），這個停損始終沒有遭到觸發。兩個星期之後，股價開始上漲。當股價向上穿越外杯的右緣，他把停止點調高到外杯柄部最低點的下方\
    \ 1/8 點處（$17½）。不久，他發現一個問題正在形成當中：上升直角三角形擴張頸排列。小明認定這是一個空頭排列，所以調緊停止點到三角形底部的稍下方$20¼。然後，等待。\n\
    \n他聽到投資社團傳來的一些消息，該公司似乎發生某種不太好的問題。他在電腦螢幕上叫出走勢圖，發現 8 月底的頓挫走勢已經引發他的停止買單。小明拿出計算機，經過一陣敲打，發現每股獲利為$5，報酬率超過\
    \ 30%。\n\n## 迴光返照排列\n\n![](img/843a88de0b50d7a36e65238281a4e722_247_0.png)\n\n\
    ### 摘要資料\n\n- **外觀** 重挫走勢發生之後，價格向上反彈，然後出現下降趨勢。\n- **反轉或整理** 長期的（超過 6 個月）空頭反轉排列。\n\
    - **失敗率** 10%。\n- **事件跌幅** 25%，最經常發生跌幅 20%。\n- **事後跌幅** 15%，最經常發生跌幅介於 5%~25%。\n\
    - **意外發現** \n  - 事件跌幅愈大，反彈幅度也愈大。\n  - 事件跌幅愈大，反彈走勢愈快到達高點。\n\n在股票市場混跡的時間只要夠久，就一定會碰到這種迴光返照\
    \ (dead-cat bounce, 死貓反彈) 的走勢。事實上，這稱不上是什麼價格型態，只是警告股票可能出現暴跌走勢。\n\n事件跌勢 (event decline)\
    \ ——造成迴光返照的下跌走勢——平均幅度為 25%。事件跌勢發生之後，價格向上反彈，形成峰位而向下反轉，然後繼續下跌；反彈之後的第二段跌勢平均幅度為 15%（由事件低點衡量到最後低點）。合併兩段跌勢的平均跌幅為\
    \ 37%。\n\n「摘要資料」顯示一些不尋常的發現。首先，這讓我想起「皮球」：跌得重，彈得高；事件跌幅愈大，反彈幅度也愈大。如果某個利空事件造成股價迅速而大幅下跌，隨後反彈的幅度也愈大，發生的時間更早。重大利空事件造成嚴重損失之後，反彈期間通常很短（很快就到達反彈高點）；利空事件造成的跌勢不大，反彈走勢的幅度也較小，股價到達反彈高點所需要的時間也較久。\n\
    \n### 緣起\n\n何謂迴光返照（或死貓反彈）？這個名稱是形容股票在重大利空事件發生之後的走勢行爲。圖 10.1 就是迴光返照走勢的典型範例。9 月底，精明資金開始脫股股票，價格緩步下滑，而且成交量呈現上升趨勢；在一個星期內，股價由\
    \ $42^{27/16}$ 下跌到 $35^{13/16}$。10 月 9 日，某大型經紀商調降該股票的中期投資等級。跌勢一發不可收拾。兩天之內，股價由高價\
    \ $37^{13/16}$ 下到低價 $26，跌幅超過 30%。\n\n# Andrew Corporation（電話設備，NASDAQ，代碼 ANDW）\n\
    \n![](img/843a88de0b50d7a36e65238281a4e722_249_0.png)\n\n圖 10.1 典型的迴光返照。某主要經紀商降低該股票投資建議等級，股價在\
    \ 3½ 個月內重挫 50%。迴光返照的走勢讓精明投資人有機會出脫股票，在隨後跌勢發生之前及時認賠。10 月中旬與 11 月初發生的兩個峰位構成雙重頂排列，意味著股價將繼續下跌。\n\
    \n隨後一個多星期，股價稍微反彈，上漲到 $32^{13/16}$，引誘沒有經驗的投資人進場撿便宜貨。接著，股價走低，然後又攀升，形成雙重頂排列。由第二個峰位開始，跌勢持續到隔年的\
    \ 1 月中旬，最低點為 $18^{13/16}$。由利空事件發生之前的高點 $42^{27/16}$ 起算，衡量到最終低點 $18^{13/16}$，股價跌幅超過\
    \ 50%。歡迎加入迴光返照俱樂部。\n\n### 辨識準則\n\n迴光返照走勢是否具備一些共通特質？沒錯，請參考表 10.1。在圖 10.2 的案例中，價格於一天之內發生\
    \ 47%的跌勢。這支股票的峰位$28½ 發生在 1997 年 2 月初。由這個時候開始，股價沿著下降趨勢線發展，一直到 4 月底創$15¼ 的低價。接著，股價向上回升，在$21⁷⁄₈出現轉折高點。然後，美國食品藥物管理局拒絕該公司的新藥\
    \ Myotrophin 申請。當這項利空消息傳出之後，股價向下跳空，一天之內就幾乎被腰斬。當天成交量為 840 萬股，大約是平常的 15 倍。隨後 3 天內，股價稍微反彈$2（由事件低點衡量到反彈高點）。反彈走勢結束之後，繼續展開下跌走勢，過程中幾乎沒有再出現顯著的反彈。由反彈高點$13⅓\
    \ 衡量到最終低點$9½，第二波跌勢額外發生 30%的跌幅。\n\n#### 表 10.1 迴光返照排列的辨識特質\n\n| 特質 | 討論 |\n| :---\
    \ | :--- |\n| 跳空缺口 | 價格走勢圖出現向下跳空缺口，當天高價低於前一天低價。 |\n| 崩跌 | 由於重大利空消息，價格向下跳空而崩跌，跌幅通常介於\
    \ 20%~30%之間，甚至出現 70%的暴跌，期間一般為 2、3 天。 |\n| 反彈 | 價格稍微向上反彈。不要被騙，跌勢還沒有結束。 |\n| 下跌\
    \ | 反彈結束之後，展開另一波跌勢。這波下跌走勢比較平緩，但通常會出現另外 5%到 25%的跌幅。 |\n\n# Cephalon Inc.（藥品，NASDAQ，代碼\
    \ CEPH）\n\n![](img/843a88de0b50d7a36e65238281a4e722_251_0.png)\n\n圖 10.2 重大利空事件引發的迴光返照走勢，價格向下跳空，稍微反彈之後，接著又出現一波下降走勢。\n\
    \n圖 10.3 呈現另一個更驚人的案例。在暴跌走勢發生的三天前，某家經紀商提出的研究報告顯示，該公司的營業額與盈餘將繼續成長。或許這份報告造成市場的預期過高，所以當該公司宣佈前一季發生損失之後——不是市場預期的獲利——股價在\
    \ 1 天之內下跌將近 43 點，相當於 63%的跌幅。\n\n股價向下跳空，這是迴光返照的典型走勢。發生某項重大利空消息，市場全然不能接受，賣單傾巢而出。股票開盤向下跳空，成交量擴大數倍。圖\
    \ 10.3 的例子中，跳空缺口當天的成交量為 4,900 萬股，大約是平常水準的 20 倍。\n\n# Oxford Health Plans（醫療服務，NASDAQ，代碼\
    \ OXHP）\n\n![](img/843a88de0b50d7a36e65238281a4e722_252_0.png)\n\n圖 10.3 重大利空事件引發單日\
    \ 43 點（或 62%）的跌勢，但下跌走勢並沒有結束，隨後又下跌 43%。\n\n一般來說，暴跌走勢當天之內就會出現事件低點，然後立即展開反彈。圖 10.3\
    \ 的例子中，事件低點發生在暴跌走勢的隔天，反彈高點出現在隨後一天。\n\n暴跌結束之後，就展開反彈走勢。一般情況下，股價都會出現一定程度的反彈。可是，圖\
    \ 10.3 的反彈非常短暫，只有一天。反彈當天的股價收高，但隔天又恢復跌勢。在不到兩個月的期間內，股票又出現另外 50% 的跌幅（由反彈高點$28^{5/8}$衡量的最低低點$13^{3/4}$）。\n\
    \n哪些事件會造成暴跌走勢呢？通常是個別公司的意外利空消息，包括：盈餘、相同店面銷售量、合併案失敗、財務周轉不靈或法律事件。某些情況下，利空消息的影響層面不只一家公司。前文提到\
    \ Cephalon 的新藥申請失敗後，股價暴跌（圖 10.2），但 Chiron 與 Cephalon 之間就 Myotrophin 新藥簽訂發展與行銷合約，所以股價也受到影響，但程度不若\
    \ Cephalon 嚴重。\n\n一般而言，投資人都不能事先預期這類利空消息。萬一發生情況，只要持有股票，就會發生嚴重損失。所以，問題是：如何侷限損失？請參考「交易戰術」一節，通常都應該在反彈走勢中逃命。\n\
    \n### 失敗案例\n\n並非所有的重大利空消息都演變爲迴光返照走勢。請參考圖 10.4，1997 年 4 月 3 日，該公司宣佈的盈餘數據不如市場預期，而且取消與另一家公司的合併計畫。數家經紀商調降該公司的投資等級。股價由當天高價$17¼\
    \ 下跌到低價$9⅝，幅度爲 44%。如同所有的迴光返照走勢一樣，暴跌之後的第三天，價格向上反彈。可是，這波反彈不屬於逃命；換言之，反彈之後沒有繼續下跌，反而呈現上升趨勢。不到\
    \ 3 個月之內，股價又回到崩跌之前的水準。\n\n# Checkpoint Systems (精密儀器，NYSE，代碼 CKP)\n\n![](img/843a88de0b50d7a36e65238281a4e722_254_0.png)\n\
    \n這支股票爲什麼是例外？爲什麼不呈現「向上反彈而隨後繼續下跌」的走勢呢？重大利空消息公佈之後，隨後發生的事件將主導股價後續行爲——公司數位大股東買進股票。甚至公司本身也參與其中，宣佈買回\
    \ 10% 的股票。這兩個事件，造成股價持續走高。總之，後續事件造成買進動能持續累積，足以推升股價走高。\n\n在 24 個失敗案例中，總共有 20 個案例在股價重挫之後繼續維持下跌走勢，完全沒有出現顯著的反彈。剩餘的\
    \ 4 個失敗案例則類似圖 10.4，股價反彈而繼續走高。\n\n### 統計數據\n\n表 10.2 列示迴光返照的一般統計數據。在 500 支股票的 5\
