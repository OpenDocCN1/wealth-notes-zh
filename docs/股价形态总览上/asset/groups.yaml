    ## 圖 13.7 雙重頂谷底間距與價格跌幅之間的關係

    ![](img/843a88de0b50d7a36e65238281a4e722_327_0.png)


    峰位較接近的排列，績效經常更理想。


    如同稍早的研究一樣，目前這份研究的最大問題是樣本太小。剛開始的時候，編製次數分配表的過程還算順利；可是，當間距天數超過 77 天之後，就發生問題了。舉例來說，間距
    91 天的案例只有 16 個，隨後的 105 天、119 天與 133 天，案例分別為 15 個、8 個與 8 個。雖然最後這四個欄位的樣本數量少於最低標準門檻
    30 個，但先前欄位的資料已經足以顯示圖形曲線的下降趨勢。


    峰位間距較小而績效反而理想，發生這種現象的理由可能是辨識問題。相對於峰位相隔 1 年的雙重頂，投資人比較容易辨識峰位相隔 2、3 個月的排列。換言之，峰位間距較近，比較容易被投資人辨識，針對該排列採取行動的人較多，股價的賣壓較重。


    另外還有一個奇怪的現象，我衡量兩個峰位所夾谷底的深度，然後比較谷底深度與最終跌幅之間的關係，結果發現谷底愈深，突破之後的跌幅愈大，至少在某個深度（18%）之前是如此。圖
    13.8 顯示兩者之間的關係。舉例來說，谷底深度 11%的排列平均跌幅為 15%，谷底深度 18%的排列平均跌幅為 27%。谷底深度 18%已經非常接近篩選案例的典型深度
    20%。


