    # 辨識準則


    迴光返照走勢是否具備一些共通特質？沒錯，請參考表 10.1。在圖 10.2 的案例中，價格於一天之內發生 47%的跌勢。這支股票的峰位$28 ½發生在 1997
    年 2 月初。由這個時候開始，股價沿著下降趨勢線發展，一直到 4 月底創$15 ¼的低價。接著，股價向上回升，在$21 ⁷⁄₈出現轉折高點。然後，美國食品藥物管理局拒絕該公司的新藥
    Myotrophin 申請。當這項利空消息傳出之後，股價向下跳空，一天之內就幾乎被腰斬。當天成交量為 840 萬股，大約是平常的 15 倍。隨後 3 天內，股價稍微反彈$2（由事件低點衡量到反彈高點）。反彈走勢結束之後，繼續展開下跌走勢，過程中幾乎沒有再出現顯著的反彈。由反彈高點$13
    ⅓衡量到最終低點$9 ½，第二波跌勢額外發生 30%的跌幅。


