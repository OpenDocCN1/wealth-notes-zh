    附註：這種排列大多屬於長期多頭走勢的整理型態。


    最經常發生漲幅為 20%，但平均漲幅高達 46%，這意味著漲幅偏高的案例很多。報酬率次數分配可以驗證這個判斷。在向上突破的排列中，大約有 40% 的案例呈現
    50% 以上的漲幅。由於偏高漲幅會拉高平均漲幅，所以我忽略這個漲幅區間，轉而挑選發生次數第二多的區間，結果是 20%。


    關於目標價位，我考慮幾種不同的衡量方法，其中以傳統方法最適用於向上突破。「交易戰術」一節將會詳細解說明標價位的計算過程，這是由突破點向上衡量排列高度（最高價減去最低價）。結果，目標價位達成率為
    81%（只考慮 92 個向上突破的成功案例 58 個）。任何排列的目標價位達成率超過 80%，我就認為是可靠的型態。


    排列的平均長度為 2 1/2 個月，突破之後出現 6 個月或以上的長期走勢。下降擴張楔形是少數具有多頭意涵的長期型態。這意味著：較大的漲勢（平均漲幅 46%），需要花費較長的時間（平均
    6 1/2 個月）。


    在目前這個排列中，成交量隨著時間經過而增加的傾向，超過對應的上升擴張楔形。幾乎每 3 個下降擴張楔形中，就有 2 個（64%）具有這種現象。我針對成交量時間序列進行迴歸分析，結果發現迴歸直線的斜率為正數。


    部分跌勢與部分漲勢，是決定突破時機與可靠性的重要參考條件。排列出現部分跌勢之後，立即向上突破的發生頻率為 76%（請參考圖 6.5 的例子）。


    部分跌勢必須起始於上側趨勢線的觸及點，下跌走勢不得觸及（或靠近）下側趨勢線，然後股價向上反轉而——通常是立即——貫穿上側趨勢線。結果就是向上突破。


    向下突破也經常緊跟在部分漲勢之後。可是，因為向下突破的案例很少（22 個），部分漲勢的案例自然更少（5 個），只有 2 個部分漲勢演變為向下突破。總之，樣本實在太小，沒有辦法提出任何具有意義的結論。

