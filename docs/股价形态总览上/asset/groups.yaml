    當合理的現象，因為向上突破的平均漲幅為 34%，向下突破的平均跌幅為 23%，漲幅距離較大，耗費的時間也應該較久。前進的期間長度，是衡量突破點到最高點或低點的距離，最高點或低點是指顯著的趨勢反轉點。


    如果把先前 12 個月的價格區間劃分為三等份，突破發生在哪個位置呢？大多數向上突破發生在價格區間三等份的上線（94%）。這個數據似乎有些偏高，但還是相當合理。向上突破的位置當然是在排列的上端，自然也應該發生在年度價格區間的上線。同理，向下突破的位置發生在排列的下端，但擴張頂排列本身則發生在上升趨勢的末端（換言之，排列本身大約處在年度價格區間的上半部），所以向下突破最經常發生在年度價格區間的中央（49%）或上線（40%）。


    如果擴張頂向上突破的位置發生在年度價格區間的上線，平均漲幅為 35%；如果突破位置發生在年度價格區間的中央，平均漲幅為 24%。對於向下突破，不論突破點位在年度價格區間的哪個位置，平均跌幅都差不多是
    22%（只有中央位置為 24%）。


    表 4.4 顯示交替觸及點的統計數據。擴張頂排列在成功突破之前，通常會出現幾個交替觸及點？根據次數分配的統計數據顯示，不論向上或向下的突破，大多發生在擴張頂排列出現
    4 個交替觸及點之後。可是，某些案例在突破發生之前，排列出現 6 個或 7 個交替觸及點。


    我如何計算交替觸及點呢？請回頭參考圖 4.2，標示的數


