    圖 16.3 缺口的操作方法。小莉在突破缺口買進股票，幾天之後結束部位，獲利$7,500。接著，她在竭盡缺口演變為迴光返照的過程中，放空股票。


    當天上午價格開高之後，小莉就衡量前一天連續缺口中點到趨勢低點(A 點)之間的距離，結果是 $5\frac{1}{2}$ 點(=$60\frac{1}{4}$
    - $54\frac{3}{4}$ )。由連續缺口中點向上衡量 $5\frac{1}{2}$ 點，上檔目標價位預計是$65\frac{3}{4} $(=$60\frac{1}{4}$
    + $5\frac{1}{2}$ )。於是，小莉把獲利了結的停止賣單設定在$65\frac{1}{2} $的位置。不久，盤中價格就引發這張賣單，部位獲利了結出場。當天的盤中高價為$66，稍高於目標價位，但收盤價為$63\frac{1}{4}$
