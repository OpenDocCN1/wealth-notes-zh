    由於複雜頭肩頂排列非常可靠，一旦認定型態有效之後，就可以及早採取行動。如果持有股票，應該賣出。如果空手，可以考慮放空。對於空頭部位，停損應該設定在上檔壓力區的稍上方，例如：肩部谷底、肩部峰位或頭部峰位。如果價格向上穿越排列的最高價（頭部峰位），頭肩頂排列已經失敗，立即回補空頭部位，因爲價格可能繼續走高。


