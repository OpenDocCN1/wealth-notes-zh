    **圖 14.2** 三角旗形排列，由兩條收斂趨勢線界定，狀似上升楔形，但規模較小。


    ### 辨識準則


    #### 表 14.1 旗形與三角旗形的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 界定排列的趨勢線 | 旗形：排列由兩條平行趨勢線界定。<br>三角旗形：排列由兩條相互收斂的趨勢線界定。<br>兩種排列的發展方向與趨勢方向通常相反：排列發生在上升趨勢中，發展方向朝下；排列發生在下降趨勢中，發展方向朝上。
    |

    | 最長期間 3 個星期 | 旗形與三角旗形屬於短期整理排列，期間通常介於幾 天到 3 個星期（21 個交易日）之間。如果排列期間 超過 3 個星期，失敗的可能性較高，適合歸納為等腰
    三角形、矩形或（上升 / 下降）楔形。 |

    | 陡峭而 快速的走勢 | 這些排列通常都發生在一段快速而陡峭的走勢中點。 所謂「飄揚在旗桿中央的旗形」。如果型態發生之前 不存在快速的漲勢或跌勢，最好視為無效的排列。
    |

    | 成交量呈現 下降趨勢 | 排列過程內，成交量型態通常呈現下降趨勢。 |


    表 14.1 列示旗形與三角旗形的辨識準則。圖 14.3 顯示旗形排列的例子，價格型態由兩條相互平行的趨勢線界定；圖 14.4 顯示三角旗形的例子，界定排列的兩條趨勢線相互收斂。這兩個例子中，排列本身的涵蓋期間都很短（相對於本書介紹的其他排列）。圖
    14.3 的旗形涵蓋 12 個交易日，圖 14.4 的三角旗形只涵蓋 8 個交易日。某些情況下，排列可能更短，甚至只是 3、4 天的整理，看起來就像水平狀的矩形——快速價格走勢中的一個小黑塊。原則上，這兩種排列的期間不應該超過
    3 個星期；當然，這個期間上限是武斷設定的。在我篩選的案例中，只有 16 個排列的期間超過 3 個星期（佔全部案例的 6%），最長的旗形是 32 天，最長的三角旗形爲
    28 天。


    可靠的旗形或三角旗形通常發生在陡峭而快速的趨勢中。趨勢可能朝上或朝下，但價格變動的速度必須夠快，幾天或幾個星期之內就出現重大的走勢。請參考圖 14.3，下降趨勢起始於
    1 月 18 日，旗形排列起始於 2 月 1 日，10 天之內就由 $40^{3} /{ }_{4}$ 下跌到 $30^{1} /_{8}$，約略是 $25
