    價格缺口總共有五種類型，本章準備討論其中四種。我們不打算討論除息缺口（ex-dividend gap），因為這種缺口很罕見，而且也沒有技術上的意義。除息缺口通常出現在公用事業類股或其他支付高股利的股票。在股票的除息日，股價必須向下調整，幅度剛好等於每股支付的股利。所以，在除息日當天，開盤價經常會向下跌空，但這種缺口很可能當天就被填補，根本看不出來曾經存在缺口。


    我所謂的填補缺口，是指價格回到缺口而完全封閉缺口。區域缺口（area gap，又稱爲普通缺口[common gap]與型態缺口[pattern gap]）很容易被填補，大約有
    90%的區域缺口在 1 個星期內被填補。


    關於各種缺口的填補平均期間，請參考「摘要資料」。某些缺口很容易被填補，例如：耗盡缺口（exhaustion gap），它們發生在趨勢的末端，價格反轉之後很容易把缺口填補起來。另一些缺口比較不容易被填補，例如發生在趨勢起點的突發缺口（breakaway
    gap）。連續缺口（continuation gap）則發生在一段走勢的中間。'
