    此處也採用其他價格型態運用的程序（例如：內側日與外側日），如果某支股票提供的案例超過 10 個，我只接受某個比率的案例。舉例來說，假定某支股票在 5 年期間內提供
    100 個案例，就按照時間順序，每 10 個案例挑選 1 個，總共只挑選 10 個案例。由表 17.3 的數據可以發現，向上突破與向下突破的案例數量大約相同，分別為
