    117 個案例中，只有 7 個提前突破，其中 6 個是向上提前突破。


    在 92 個向上突破案例中，34 個失敗，大多數是因為趨勢反轉而失敗。舉例來說，如果價格趨勢朝下而排列向上突破，則歸納為失敗案例，因為排列完成之後沒有按照預期恢復原先的下降趨勢。在
    22 個向下突破案例中，總共有 9 個排列失敗。


