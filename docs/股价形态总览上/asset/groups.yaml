    ![](img/843a88de0b50d7a36e65238281a4e722_153_0.png)


    圖 6.2 下降擴張楔形代表中期下降趨勢的反轉型態。


    在 10 月份之前，整個價格走勢顯然向下發展，然後出現反轉，開始向上攀升。1 月份，價格向上測試過去的高點。1 月底到 2 月初之間，價格創新高。一年之後，價格上漲到
