    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量： | 117 個 |

    | 1991 年 ~1996 年的 500 支股票 | |

    | 反轉或整理排列 | 78 個整理，39 個反轉 |

    | 失敗率 | 43/117 相當於 37% |

    | 成功排列的平均漲幅 | 46% |

    | 最經常發生漲幅 | 20% |

    | 在成功排列中，符合或超越目標價位者 | 47/58 相當於 81% |

    | 排列平均長度 | 2.5 個月（76 天） |

    | 成功向上突破距離最終高點的天數 | 6.5 個月（190 天） |

    | 成交量趨勢 | 成交量擴大的案例佔 64% |

