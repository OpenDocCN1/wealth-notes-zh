    \ 月初。排列向上突破之後，很快就完成保守的目標價位，不若較高目標價位達成過程中曾經發生巨幅波動走勢。\n\n篩選帶柄杯狀排列，採用表 9.1 的未經過篩選準則。相對於過濾的篩選準則，未經過濾的績效比較理想。\n\
    \n對於一般的排列，我通常建議在收盤價突破之後進場，但目前這個排列向上突破之後發生回挫走勢的機會高達 74%，所以應該等待價格重新折返。換言之，等待價格折返而重新向上穿越杯口右緣，才進場買進。這項技功能夠讓平均漲幅由\
