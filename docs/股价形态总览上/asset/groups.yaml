    # 交易範例


    凱莉不是一位單純的家庭主婦。先生把薪水帶回家，她除了負責一般的預算之外，還打點相關的投資。


    她有多年的投資經驗，金融交易已經成爲日常生活的一部分。處理家庭瑣碎工作的閒暇之餘，她經常盯著電腦螢幕，觀察一些統計數據與可能的購併案，而且還可以讓女兒敲著鍵盤玩耍。


    經過多年的努力之後，她把微薄的儲蓄累積爲六位数字的投資組合。整個過程非常不簡單，遭逢許多痛苦的錯誤，但她把這些失敗視爲學習經驗。


    當凱莉看見圖 20.7 的走勢圖，覺得非常有趣。她並不打算放空這支股票，因爲紙上模擬的放空操作績效始終不理想。雖說如此，她還是繼續追蹤這支股票的發展。


    這支股票起源於 1993 年 5 月份，沿著平緩的上升趨勢線發展，一直到 1994 年 1 月底才發生顯著的跌勢。股價跌到$26\frac{1}{2}$才向上反彈，跌幅雖然不足
    3 點，但走勢已經展現疲態。凱莉密切觀察行情的演變，當頭部出現時，她在筆記上記錄頭肩頂排列的可能性。隨後的發展證明她的感覺正確。


    股價由頭部下滑的幅度很大，有些超出凱莉的預期，但很快就向上反彈，右肩峰位的高點大約等於左肩。沿著三個峰位所夾的兩個谷底繪製頸線，她覺得頸線的傾斜角度太陡峭，不適用於衡量目標價位。於是，她採用替代方法，衡量的目標'
  - '[PAGE 477]


    價位為$28^{7/8}$。這個價位似乎也不對勁。接著，她衡量頭部高點到頭部與右肩所夾谷底的距離，由該谷底低點向下衡量前述距離，結果是$21^{7/8}$。這個價位可以回溯到前一年
    7 月份的水準，看起來似乎頗爲合理。


    可是，感覺上還是怪怪的，所以凱莉不打算交易。這個時候，有人按門鈴，她起身應門，讓女兒獨自留在電腦前面。不久，電話鈴響了，她的經紀人打電話過來回報空單。凱莉趕快跑到電腦旁，看見女兒站在椅子上，敲著鍵盤，綻露一臉笑容，帶著些微的惡意。凱莉希望這一切只是自己疑神疑鬼，但顯然不是如此。她已經建立空頭部位，在$31
    放空股票。


    凱莉有些擔心，但稍做研究之後，還是決定保留這個部位。放空的數量只有 100 股，勉強還能夠應付。不久，價格開始下跌，一直到頸線附近才獲得支撐而反彈，當價格向上穿越頭與右肩所夾谷底的低點，凱莉有點在意。接著，出現幾天的橫向盤整。根據凱莉的盤算，如果這波反彈代表另一段漲勢的開始，她準備在$29
    回補。所以，如果股價繼續上漲，這個空頭部位在$29 回補之後還有些微獲利；反之，如果股價下跌，她可以繼續保有空頭部位。


    兩個星期之後，終於有了答案。股價連跌五天，然後又快速反彈，但反彈走勢沒有觸及先前的高點。由於價格波動轉劇，凱莉覺得有些受不了，決定在先前的低點附近回補。結果，她在$22\%$回補空頭部位，股價隨後下跌到$20
    附近。扣掉佣金費用之後，這筆交易獲利 $25\%$。凱莉送給女兒一個特大號的親吻做爲獎賞。'
