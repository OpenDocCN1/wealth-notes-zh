    ## 交易戰術


    表 20.5 顯示頭肩頂排列的交易戰術，圖 20.6 說明目標價位的衡量方法。如果不考慮成交量，圖 20.6 的型態相當不錯。三個峰位都很平滑，整體形狀左右對稱。衡量法則利用排列高度估計目標價位。在「頭」部，計算最高盤中價格與頸線之間的垂直距離（排列高度）。就圖
    20.6 而言，最高盤中價格發生在 9 月 13 日的$51，當天對應的頸線價格為$47 \frac{3}{8}，兩者之間的差距為$3 \frac{5}{8}。


    ## 表 20.5 頭肩頂排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算頭部最高點與頸線之間的垂直距離，這是排列高度。由頸線突破點向下衡量排列高度，結果就是最低目標價位。另一種衡量方法，計算排列最高價減去兩個谷底較高者之盤中低價，此為排列高度。由兩個谷底較高者的盤中高價減去排列高度，結果即是目標價位。這種方法使得目標價位達成率提高到
    69%，而且也不需仰賴頸線或突破點（適用於傾斜角度過大的頸線）。 |

    | 不要等待確認 | 如果你能夠判斷潛在的頭肩頂排列，儘早在右肩出現之後賣出持股或放空，因為 93%的潛在排列都會向下突破。 |

    | 停損 | 對於空頭部位，停損設定在下列兩者的較高位置：兩肩較低者或頸線。 |

    | 留意回升 | 等待回升走勢，藉以建立或加碼空頭部位。採取行動之前，應該等待價格向下反轉，因爲某些回升走勢可能繼續上漲。 |


    一旦價格跌破頸線之後，由頸線突破點向下衡量前述排列高度，結果就是突破之後的最低目標價位。在圖 20.6 的例子中，頸線突破點為$48 \frac{1}{2}$，目標價位為$44
    \frac{7}{8}$。11 月底的下跌走勢完成目標價位。如此衡量的目標價位為最低水準，所以排列完成目標價位之後，可能繼續下跌，就如同圖 20.6 的情況。可是，在我們的研究案例當中，頭肩頂排列的目標價位達成率只有
    63%，顯著低於我認爲可靠型態的最低門檻 80%。


    前逹說明是衡量目標價位的傳統方法。可是，這種方法存在瑕疵。請參考圖 20.7，相對於左肩與「頭」所夾的谷底


    ![](img/843a88de0b50d7a36e65238281a4e722_473_0.png)


    圖 20.6 頭肩頂排列的目標價位。首先計算排列高度；換言之，計算峰位最高點到頸線之間的垂直距離。由頸線突破點向下衡量排列高度，結果就是突破之後的最低目標價位。


    # Brinker International（餐廳，NYSE，代碼 EAT）


    ![](img/843a88de0b50d7a36e65238281a4e722_474_0.png)


    圖 20.7 頸線太過傾斜的頭肩頂排列。由於頸線的傾斜角度過於陡峭，不合採用傳統方法衡量目標價位。此處利用另一種方法計算排列高度：排列最高價減去兩個谷底較高者的低價（A
    點）。由 A 點向下衡量排列高度。這種方法衡量的目標價位達成率為 69%，傳統方法為 63%。


    $31\frac{1}{4}$，「頭」與右肩所夾的谷底太深$27\frac{1}{4}$，使得這兩點銜接的頸線傾斜角度太過於陡峭。在這種情況下，經驗告訴我們，即使價格跌破頸線而完成頭肩頂排列，這個型態恐怕也沒有太大的操作價值。所以，如果採用頸線為準，進場訊號實在太遲，衡量的目標價位可能不夠保守。對於圖
    20.7，排列高度是考慮下列兩點之間的距離：「頭」部最高價的盤中高價，兩個谷底較高者的盤中低價（A 點）。然後由 A 點向下衡量排列高度，結果即是最低目標價位。在這個例子中，「頭」部最高價的盤中高價是$33\frac{1}{2}$，A
    點是$31\frac{1}{4}$，排列高度是$2\frac{3}{4}$。由 A 點向下


    衡量$2\frac{3}{8}$，目標價位是$28\frac{7}{8}$。請參考圖 20.7 標示的「目標價位」，這個目標完成於 4 月中旬。


    這種替代衡量方法有兩個優點。第一，不需仰賴頸線。第二，目標價位達成率較高（相對於傳統方法而言）。


    讓我們回頭討論表 20.5，由於潛在的頭肩頂排列大多能夠完成，所以進場訊號不必要等待價格突破頸線。反之，一旦你確定潛在頭肩頂已經發生（換言之，在右肩形成之後），就可以及早賣出持股或放空股票，藉以侷限損失或擴大利潤。


    價格向下突破之後，偶爾可能反彈而重新向上穿越頸線。遇到這種情況，可以考慮買回或回補股票。在下跌過程中，價格通常都會再度跌破趨勢線，所以不要太早決定回補。價格可能反彈到趨勢線附近，稍做橫向整理或順著頸線發展，最後還是繼續下跌。總之，遇到這種情況，應該參考整個大盤或類股的發展，如果大環境呈現弱勢，價格應該會繼續走低。


    如果你放空股票，停損設定可以參考下列兩者的較高者：頸線或兩個谷底較低者。除此之外，也可以考慮進場點附近的上檔壓力區。


    如果價格回升到頸線附近，考慮加碼空頭部位。可是，最好等待回升走勢已經向下反轉，然後才採取行動。某些情況下，回升走勢可能向上突破頸線而繼續走高。

