    股票夾著相對大量穿越趨勢線，然後停頓一个多月，形成一個下降楔形（falling wedge），也有點像三角旗形（pennant）。接著，價格夾著顯著大量突破下降楔形而創新高。可是，上升趨勢沒有持續發展，反而在$18
    下緣展開半年多的盤整。1996 年 4 月，價格再度向上突破，展開一段爆發性走勢。6 月底的股價為$28¼，由 BARR 底部排列突破點衡量，漲幅為 140%，由底部排列的最低點衡量，漲幅為
    350%。


    # 辨識準則


    表 7.1 列示蹦跳-奔馳底部反轉排列的辨識準則，圖 7.2 說明相關的特性。這個排列的整體形狀很像一個煎鍋。煎鍋的柄部（又稱爲前奏階段）向下傾斜，角度大約介於
    30 度到 45 度之間。沿著柄部的相對高點繪製一條趨勢線，隨後當價格向上突破這條趨勢線，代表排列已經完成的買進機會。


    BARR 底部排列允許前奏階段出現水平狀的趨勢線，顯然不同於 BARR 頸部排列。這種情況很罕見，或許也應該避免。柄部最好還是朝右下方傾斜，這類案例的續效最理想。


    趨勢線形成之後，計算前奏階段的高度。這是衡量柄部（排列最早的四分之一部分）的最寬垂直距離，由趨勢線位置到盤中低價之間的距離。請參考圖 7.2，柄部最寬距離發生在
    6 月 16 日（A 點），當天低價為$17^{5}/_{8}$，當天對應的趨勢線讀數為$20^{3}/_{8}$，所以前奏階段的高度是$2^{3}/_{4}$。關於蹦跳階段與目標價位的最低水準，兩者都運用前奏階段的高度，所以這方面的計算必須謹慎。


    前奏階段結束之後，進入蹦跳階段。價格快速下跌，但未必如同圖 7.2 顯示的程度，並且形成一條新的趨勢線，向下


