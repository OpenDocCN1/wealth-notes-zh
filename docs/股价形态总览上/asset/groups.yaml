    價格通常會朝原先的趨勢方向繼續發展，發生反轉而在短期間內填補缺口的可能性不大。


    關於成交量型態，此處是考慮當時成交量與其 25 天移動平均的相對水準。大體上來說，連續缺口發生當天的成交量都顯著放大（超過平均量的一倍以上），隨後 5 天繼續保持大量。


    把連續缺口擺在當時的價格趨勢上觀察，我衡量缺口在時間上與價格上的發生位置。就時間位置考量，向上跳空缺口平均發生在上升趨勢開始的 48% 位置，向下跳空缺口平均發生在下降趨勢開始的
    58% 位置。換言之，我計算整段價格趨勢涵蓋的天數，以及該趨勢起點到缺口發生當時的天數，然後計算後者是前者的多少百分率。


    就價格位置考量，由趨勢起點衡量到缺口中點的距離——平均而言——佔整段趨勢總距離的 48%（向上跳空）與 50%（向下跳空）。這方面的統計數據支持連續缺口發生在整段趨勢中點的说法。向上跳空缺口發生之後，平均漲幅稍大。請注意，此處是考慮平均值，個別結果當然會有所不同。


    ### 統計數據：竭盡缺口


    表 16.5 顯示竭盡缺口的統計數據。在 100 支股票的 5 年期間內，我找到 159 個竭盡缺口的案例，相對於其他類型的缺口，竭盡缺口相對少見。由缺口發生位置，衡量到趨勢結束為止，向上跳空缺口的平均漲幅為
    6%，向下跳空缺口的平均跌幅為 5%。由於竭盡缺口代表趨勢即將結束的徵兆，這些績效數據偏低顯得合理。另外，最經常發生漲幅為 3%，跌幅為 3%~4%。


    竭盡缺口經常發生在年度價格區間三等份的哪個位置呢？大部分向上跳空缺口發生在年度價格區間上線（77%），向下跌空缺口則最經常發生在年度價格區間的下線（41%）。這符合直覺的預期，因爲上升趨勢的末端應該發生在年度高價附近，下降趨勢的末端應該發生在年度低價附近。我沒有考慮竭盡缺口發生在年度價格區間上線／中央／下線的個別平均績效，因爲讀數非常小。


    填補向上（向下）跳空竭盡缺口的平均期間為 23 天（17 天）。在 1 個星期內被填補的向上（向下）跳空竭盡缺口案例為 58%（72%）。竭盡缺口的填補期間很短，半數以上的缺口在
    1 個星期內被填補，這項事實可以反映出竭盡缺口發生的位置在趨勢末端。


    竭盡缺口發生當時的成交量幾乎是平均水準的三倍，大約在一個星期之後就逐漸恢復正常。


    ## 交易戰術與交易範例


    表 16.6 列示缺口的交易戰術。為了成功操作缺口，進場與出場的手腳必須俐落，務必設定停損，隨時留意行情的發展，斷然採取行動。請參考圖 16.3 的例子，小莉準備針對跳空缺口進行交易。


    小莉知道所有類型的缺口，曾經在紙上磨練相關的操作技巧，直到成功機率很高、一切都成爲例行動作爲止。由於非常強調風險控制，她對於自己的操作系統非常有信心，決定實際進場進行交易。


    她追蹤圖 16.3 的股票已經有一段時間，除了股價走勢之外，對於公司的基本面也非常熟悉。當她發現 5 月 10 日的突


    ### 表 16.6 各種缺口的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 區域缺口 | 這些缺口通常沒有技術意義，不存在操作價值。 |

    | 突破缺口 | 如果趨勢起點的成交量很大，順著趨勢方向進行交易。建立部位之前，按照辨識準則確認缺口的類型。 |

    | 連續缺口 | 連續缺口通常發生在趨勢的中點，可以按照缺口發生位置衡量目標價位。換言之，由趨勢起點衡量到缺口中間，然後由缺口中間向上或向下衡量前述距離，結果就是向上跳空或向下跳空的目标價位。
    |

    | 竭盡缺口 | 如果缺口非常寬或位置發生在趨勢末端，在趨勢反轉之前，結束先前的順勢部位。一旦趨勢反轉之後，可以考慮順著新趨勢方向建立部位（如果趨勢由上升反轉為下降，可以考慮放空股票）。竭盡缺口之後經常發生激烈的趨勢反轉。缺口發生之後，只要價格沒有創新高或新低，隔天就結束部位。
    |

    | 停損 | 把停損設定在缺口反向邊緣外側 1/8 點處。換言之，多頭部位的停損設定在缺口下緣 1/8 點處，空頭部位的停損設定在缺口上緣 1/8 點處。前述的停損策略是把缺口視為短期的支撐
    / 壓力，假定缺口在短期之內不會被填補。 |


    她把停損設定在$57，亦即是缺口下緣 1/8 點處。萬一這個缺口是區域缺口，她可以立即認賠出場。在紙上作業的期間，她知道缺口能夠提供支撐 / 壓力功能，所以她對於自己設定停損的位置很有信心。


    她密切觀察股價的演變。兩天之後，價格又向上跳空。她知道這個缺口如果不是連續缺口，就是竭盡缺口。缺口當天的成交量很大，約略是 25 天平均量的兩倍，暫時還不能判斷缺口的類型。又隔一天，再度出現向上跳空缺口，所以前一個缺口可以確定是連續缺口。


