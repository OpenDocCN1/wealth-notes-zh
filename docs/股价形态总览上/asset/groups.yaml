    以，前述兩個數據顯然都偏低。


    向上突破與向下突破的擴張底排列平均長度非常接近，大約都是 2 個月。由於 2 個月是平均數，實際的長度可以是任何數據。如果你希望強調擴張底的最大特色，或許就是型態的發展時間。價格擺動於高限與低限之間，需要時間來醞釀與進行。


    擴張排列有一種異常現象：部分漲勢或部分跌勢。圖 1.1 就是一個典型的部分跌勢案例：價格由反彈高點向下拉回，正常地朝下發展，但折返低點還沒有創新低之前，價格突然向上反轉，然後向上突破。在所有的案例中，只要發生部分漲勢，67%的案例隨後出現向下突破；只要發生部分跌勢，80%的案例隨後出現向上突破。所以，如果你在擴張底發展過程中看見部分跌勢或部分漲勢，或許可以進場買進或放空，因為隨後發生向上突破或向下突破的機率很高。


    某些人認為，當擴張底向上突破之後（具有多頭意涵），距離最終的高點已經不遠；換言之，主要峰位即將出現，隨後將發生延伸性的跌勢。我曾經檢定這項假設，結果發現這種說法基本上不正確。在所有擴張底向上突破的案例中，大約只有
    48% 在突破之後的 3 個月內出現趨勢反轉（峰位）。我想，在 3 個月的時間之後，已經屬於另一季財務報表的影響範圍，股價下跌應該由其他原因解釋。


    表 1.3 顯示擴張底突破的統計數據。向上突破總共有 45 個案例，向下突破總共有 32 個案例。一旦排列結束之後，實際突破的發生時間大約在 1 個月之後。如同前文解釋的，所謂「突破」，是指收盤價穿越上側或下側趨勢線，或價格沿著趨勢線發展一段期間，收盤價穿越排列高點或低點。排列一旦向上突破，價格峰位大約出現在
    4 個月之後；排列一旦向下突破，價格谷底大約出現在 3 個月之後。


    突破通常發生在年度價格區間的哪個位置？為了回答這個問題，我把年度價格區間分為三等份（下線 / 中央 / 上線），依此考慮每個排列的突破位置。向上突破的突破點位置通常落在中央或下線的部分，意味著整個型態位在價格區間的偏低位置。這是相當合理的現象，因為向上突破的擴張底發生之前，曾經出現一段延伸性的價格跌勢。可是，突破點位在排列本身的上端，大概靠近年度價格區間的中央偏低位置。向下突破的突破點位置通常落在年度價格區間三等份的上緣。


