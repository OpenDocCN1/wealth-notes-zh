    # 失敗案例


    在股票市場求取生存的關鍵之一，就是由錯誤中學習教訓。綜觀所有的失敗案例，就可以察覺其中的趨勢，就如同股價走勢圖一樣。


    在239個複雜頭肩底排列中只有15個失敗案例，但66%的失敗案例屬於連續型態。當然，這項事實不能提供真正的助益，因爲唯有排列完成（突破）之後，我們才知道它是連續或反轉型態。很多失敗案例發生在延伸性跌勢之中；一旦型態失敗之後，當時的價格可能已經非常接近最終低點，最終低點通常距離排列「頭」部（排列最低點）不超過10%。可是，某些失敗排列可能繼續下跌25%或以上，所以還是應該利用停損單侷限損失。


    圖19.4顯示一個典型的失敗案例，這個複雜頭肩底排列沒有把當時的下降趨勢向上反轉。股價在1991年9月份創$106^{3}/_{8}$的峰位，然後開始緩步下滑，但在1992年7月中旬出現反彈高點之後，下跌步調轉快。1993年1月份，股價創$45^{7}/_{8}$的低點，並且在此形成複雜頭肩底排列的雙「頭」部。


    當潛在頭肩底排列形成之後，價格確實向上突破頸線，但只到達$57^{1}/_{8}$。收盤價只停留在頸線之上三天，然後又貫穿頸線。最後，股價在8月份創$40^{5}/_{8}$的低價。


    這個例子幾乎呈現標準的成交量型態。左肩的成交量非常大，雙「頭」位置的成交量顯著萎縮，右肩的成交量更小。唯一比較不正常的地方是突破量太小，這或許也是排列失敗的'
