    ## 辨識準則


    表 6.1 列示排列的辨識特質，圖 6.3 則顯示另一個下降擴張楔形的範例，兩條向下傾斜的趨勢線界定一系列的價格擺動，整個形狀類似一個向下傾斜的喇叭。在排列發展之初，價格擺動的幅度較小，然後愈來愈大。任何一條趨勢線都不呈現水平狀，這是下降擴張楔形不同於其他排列的重要條件。


    排列內有數個轉折高點觸及上側趨勢線，也有數個轉折低點觸及下側趨勢線。每條趨勢線都至少需要兩個顯著的觸及點——兩個轉折高點與兩個轉折低點。


    成交量通常會隨著時間經過而增加，這不同於各種楔形排列，後者的成交量通常都隨著時間經過而萎縮。成交量增加似乎是推動價格向上突破的動力。向上突破過程中，通常會出現大量，但未必一定如此。只要需求超過供給，價格就會上漲。


    ### 表 6.1 下降擴張楔形的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 形狀 | 向下傾斜的喇叭狀，界定價格行爲的兩條趨勢線都向下傾斜。 |

    | 向下傾斜趨勢線 | 兩條趨勢線都向下傾斜，下側趨勢線的陡峭程度超過上側趨勢線。所以，兩條趨勢線隨著時間經過向外擴張。 |

    | 觸及點 | 每條趨勢線都至少需要 2 個觸及點。 |

    | 成交量 | 通常隨著時間經過而增加。可是，成交量型態不屬於必要條件。 |

    | 突破 | 由於這個排列屬於既有趨勢的整理型態，如果既有趨勢朝上，排列突破之後將繼續上升趨勢。如果既有趨勢朝下，排列突破之後也會繼續下降趨勢。 |

    | 部分跌勢 | 價格觸及上側趨勢線，向下折返而沒有觸及或靠近下側趨勢線，然後向上反彈而突破上側趨勢線。 |


    ## Alaska Air Group Inc.（航空運輸，NYSE，代碼 ALK）


    ![](img/843a88de0b50d7a36e65238281a4e722_155_0.png)


    圖 6.3 下降擴張楔形代表上升趨勢的整理型態。排列內的價格走勢雖然朝下，但成交量還是呈現放大的趨勢。部分跌勢意味著向上突破即將發生。


    由於這個排列屬於既有趨勢的整理型態，一旦型態突破之後，價格應該會朝排列發生之前的趨勢方向繼續發展。如同圖 6.3 顯示的，排列發生之前的趨勢朝上，排列突破之後的趨勢繼續朝上。


    可是，這個排列有時候也會是反轉型態，圖 6.2 就是一個例子。我們很難預先判斷這個排列究竟是連續（整理）或反轉型態。不论是整理或反轉型態，這個排列通常都發生在價格漲勢的末端。對於整理型態，通常向上突破，價格繼續走高。對於反轉型態，價格向下突破，然後朝下發展。唯有等待突破之後，才能確定這個排列屬於整理或反轉型態。


    類似如圖 6.3 的部分跌勢，經常意味著價格即將向上突破。這種現象普遍存在於整理或反轉型態，但部分漲勢之後立即出現向下突破的成功率明顯較低。我們稍後會詳細討論這方面的統計數據，但樣本數量實在太少，所以很難就部分漲勢提出任何明確的結論。


    這些排列為何形成呢？任何的價格型態都代表供、需之間的鬥爭。請回頭參考圖 6.3，12 月初的漲勢試圖填補 9 月份的向下跳空缺口，結果沒有成功。買進動力消失，價格緩步走低。


    在重要的價位，成交量經常會擴大，例如：整數價位，或價格折返前一波段漲勢或跌勢的 40%、50% 或 60% 位置。請觀察圖 6.3，由 10 月底到 12
    月中旬，價格由 $13^{3}/{8}$ 上漲到 $18^{7}/{8}$。這個波段的 40% 折返位置，大約在 $16^{3}/{4}$，或 $17$ 的整數價位。在下降擴張楔形排列中，我們發現整個跌勢在
    $17$ 附近稍做停頓。當價格下跌到前述漲勢的 60% 折返位置（大約是 $15^{3}/{4}$），精明資金開始進場。在新年過後的 5 天期間內，買盤力道推升價格走高，但賣方也沒有閉著，最後還是壓回價格，這也是部分跌勢發生的位置。


    部分跌勢結束而價格開始回升的過程中，成交量明顯萎縮，類似暴風雨之前的寧靜。某些排列——包括：上升與下降三角形排列——在突破之前也會有成交量萎縮的現象。當價格向上穿越最近的轉折高點（換言之，排列結束之前的最後一個轉折高點），成交量突然放大。动能玩家掌握局面，價格夾著大量上漲。


    ## 失敗案例


    下降擴張楔形有兩種失敗情況。第一，排列屬於反轉型態；換言之，排列結束之後，價格朝排列之前的相反趨勢方向發展。由於下降擴張楔形通常扮演既有趨勢的整理型態，所以反轉型態視為失敗，圖
    6.2 就是這類的例子。


    圖 6.4 顯示第二種失敗的情況，這個下降擴張楔形屬於整理型態。排列發生之前，價格處於上升趨勢；9 月 3 日也確實向上突破，但突破之後就出現回挫走勢（throwback），重新測試趨勢線（我在圖
    6.4 中繪製上側趨勢線的延伸線，所以這個現象非常清楚）。回挫走勢原本一直停留在趨勢線之上，但 9 月 17 日向下跳空，直接買穿趨勢線。


    ### United Technology（多角化經營企業，NYSE，代碼 UTX）


    ![](img/843a88de0b50d7a36e65238281a4e722_157_0.png)


    圖 6.4 5% 失敗的案例：向上突破之後，沒有出現 5% 或以上的跟進漲勢。


    這種情況是我所謂的 5% 失敗；換言之，排列突破之後，沒有出現 5% 或以上的跟進走勢，價格立即又發生反轉。第一種失敗情況比較常見，5% 失敗則相對罕見。在全部
    117 個案例中，只有 4 個排列（相當於 3%）發生 5% 失敗的情況。這些分析帶給我們什麼啓示呢？採取行動之前，應該等待收盤價突破。一旦突破發生之後，價格通常都會繼續朝突破方向發展。


    ## 統計數據


    下降擴張楔形屬於罕見的型態，在 500 支股票的 5 年期間內，只有 101 支股票出現這種排列，總共有 117 個案例。在這些案例中，66% 屬於當時趨勢的整理型態。表
    6.2 列示這個排列的一般統計數據。


    按照前一節的解釋，反转型態視為失敗，所以失敗率高達 37%。失敗的案例總共有 43 個，包括 39 個反转型態與 4 個失敗的連續型態，後者在突破之後沒有出現
    5% 或以上的跟進走勢。


    排列向上突破的平均漲幅為 46%，數據明顯偏高，但也不令人覺得意外，因為這屬於上升趨勢的連續排列。在多頭行情中，價格趨勢朝上，下降擴張楔形只是反映這項事實而已。可是，整體多頭型態的平均漲幅大約是
    40%，所以這個排列還是屬於表現優異者。


    ### 表 6.2 下降擴張楔形的一般統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量： | 117 個 |

    | 1991 年 ~1996 年的 500 支股票 | |

    | 反轉或整理排列 | 78 個整理，39 個反轉 |

    | 失敗率 | 43/117 相當於 37% |

    | 成功排列的平均漲幅 | 46% |

    | 最經常發生漲幅 | 20% |

    | 在成功排列中，符合或超越目標價位者 | 47/58 相當於 81% |

    | 排列平均長度 | 2.5 個月（76 天） |

    | 成功向上突破距離最終高點的天數 | 6.5 個月（190 天） |

    | 成交量趨勢 | 成交量擴大的案例佔 64% |

    | 部分跌勢緊跟著向上突破 | 35/46 相當於 76% |


    附註：這種排列大多屬於長期多頭走勢的整理型態。


    最經常發生漲幅為 20%，但平均漲幅高達 46%，這意味著漲幅偏高的案例很多。報酬率次數分配可以驗證這個判斷。在向上突破的排列中，大約有 40% 的案例呈現
    50% 以上的漲幅。由於偏高漲幅會拉高平均漲幅，所以我忽略這個漲幅區間，轉而挑選發生次數第二多的區間，結果是 20%。


    關於目標價位，我考慮幾種不同的衡量方法，其中以傳統方法最適用於向上突破。「交易戰術」一節將會詳細解說明標價位的計算過程，這是由突破點向上衡量排列高度（最高價減去最低價）。結果，目標價位達成率為
    81%（只考慮 92 個向上突破的成功案例 58 個）。任何排列的目標價位達成率超過 80%，我就認為是可靠的型態。


    排列的平均長度為 2 1/2 個月，突破之後出現 6 個月或以上的長期走勢。下降擴張楔形是少數具有多頭意涵的長期型態。這意味著：較大的漲勢（平均漲幅 46%），需要花費較長的時間（平均
    6 1/2 個月）。


    在目前這個排列中，成交量隨著時間經過而增加的傾向，超過對應的上升擴張楔形。幾乎每 3 個下降擴張楔形中，就有 2 個（64%）具有這種現象。我針對成交量時間序列進行迴歸分析，結果發現迴歸直線的斜率為正數。


    部分跌勢與部分漲勢，是決定突破時機與可靠性的重要參考條件。排列出現部分跌勢之後，立即向上突破的發生頻率為 76%（請參考圖 6.5 的例子）。


    部分跌勢必須起始於上側趨勢線的觸及點，下跌走勢不得觸及（或靠近）下側趨勢線，然後股價向上反轉而——通常是立即——貫穿上側趨勢線。結果就是向上突破。


    向下突破也經常緊跟在部分漲勢之後。可是，因為向下突破的案例很少（22 個），部分漲勢的案例自然更少（5 個），只有 2 個部分漲勢演變為向下突破。總之，樣本實在太小，沒有辦法提出任何具有意義的結論。

