    部分漲勢（partial rise）是上升擴張楔形的意外發現。所謂「部分漲勢」，是指價格由下側趨勢線向上反彈，在靠近上側趨勢線之前，又開始向下折返。一旦發生部分漲勢，向下突破的可能性為
