    相對於排列發生之前的既有價格趨勢，擴張頂屬於反轉或整理型態？在全部 189 個案例中，100 個排列持續既有的趨勢而屬於整理型態（又稱為連續型態），89 個發生趨勢反轉。當然，排列屬於整理或反轉型態，完全取決於突破的方向。根據定義，擴張頂排列發生之前的既有價格趨勢向上，所以向上突破的排列屬於連續型態，向下突破的排列屬於反轉型態。


    某些分析家認為擴張頂排列在本質上屬於空頭反轉型態，但我找不到任何證據支持這個論點。我寧可把向上突破的擴張頂視為弱勢的多頭型態，或把向下突破的擴張頂視為稍微強勢的空頭型態。


    失敗率不容易決定，因為這種排列沒有向上或向下突破的明顯傾向，所以我採用 5% 的跟進走勢作為判斷基準。所謂「突破」，是指收盤價貫穿到排列最低點之下或穿越到排列最高點之上；突破發生之後，在出現
    5% 以上的跟進走勢之前，如果價格朝突破的相反方向發展，則視為排列失敗。


    我採用這種處理方式，理由很簡單。如果你在向上突破之後買進股票，但隨後沒有發生 5% 以上的跟進漲勢，你一定覺得失望，甚至可能認賠。在前述的定義之下，考慮全部
