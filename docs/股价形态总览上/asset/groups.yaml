    ## 交易戰術


    表 7.5 摘要列示蹦跳-奔馳底部反轉排列的交易戰術。確認排列的型態之後，可以預先計算向上突破的目標價位。首先，衡量前奏階段——排列最初四分之一部分——的高度，這是計算期間內每天低價與下降趨勢線之間的垂直距離，取其中最寬者做為前奏階段的高度。其次，由突破點向上衡量前奏階段高度，結果就是最低目標價位。對於所有向上突破的案例，目標價位的達成率
    90%。


    **表 7.5** 蹦跳-奔馳底部反轉排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算前奏階段的高度，由突破點（為了保守起見，取當天低價為準）向上衡量前述高度，結果就是突破之後的最低目標價位。 |

    | 等待確認 | 等待收盤價穿越下降趨勢線，然後才進場買進。 |

    | 在先前高點賣出 | 在奔馳階段，價格上漲到先前高點附近，只要出現弱勢的表現，就應該考慮賣出。 |

    | 停損 | 在低檔支撐的下方 1/8 點處設定停損。隨著股價走高，向上調整停損。 |


    附註：等待收盤價突破，可以提高投資績效。


    精確衡量目標價位，需要知道突破的確實價位。可是，即使在突破之前，我們也可以計算前奏階段高度佔當時價位的百分率，藉以評估這個排列的獲利能力。如果前述數據太低，就應該另外尋找對象。


    如果某個排列對象的獲利潛能不錯，實際的進場點應該設定在收盤價穿越下降趨勢線的位置。


    除了前述的目標價位之外，還可以考慮另一個獲利了結位置：先前的峰位（換言之，排列的起點）。前文已經討論這一點，BARR 底部排列的奔馳階段經常終止於先前的峰位。你可以在此預先設定獲利了結的停止賣單；如果你擔心過早出場，至少可以考慮結束半數部位。


    關於停損單，就如同任何多頭部位一樣，應該設定在最近支撐點下方 1/8 點處。每當股價克服上檔的壓力區，停損點就應該向上調整，防範股價反轉而損及太多的既有獲利。


