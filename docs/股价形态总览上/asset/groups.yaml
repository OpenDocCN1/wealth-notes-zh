    很多情況下，一段短期趨勢結束之後，整體趨勢還是繼續朝上發展。請回頭參考圖 16.1，1 月中旬發生的短期上升趨勢大約涵蓋兩個星期，這段趨勢結束之後，整個股價走勢還是呈現向上偏頗的趨勢，直到
    5 月中旬為止。就長期趨勢來說，最終低點位在 1 月中旬，最高點位在 5 月中旬。反之，就 1 月中旬發生的短期上升趨勢來說，趨勢高點與低點當然是考慮這段走勢本身的高點與低點。


    向上跳空的連續缺口，大多發生在年度價格區間的上緣；向下跳空缺口，則大多發生在年度價格區間的中央。至於連續缺口發生在年度價格區間的哪個位置，平均績效最理想呢？發生在年度價格區間上緣的向上跳空缺口，平均漲幅最大（11%）。向下跳空缺口不論發生在哪個位置，平均跌幅都差不多，下緣為
    12%，中央為 11%，上緣為 10%。


    幾乎所有的連續缺口都在 1 年之內填補，向上跳空缺口為 87%，向下跳空缺口為 95%。同樣地，由於某些缺口的發生時間距離研究期間結束不滿 1 年，其中部分缺口被視為
    1 年之內沒有被填補（實際上可能在 1 年內被填補，但我沒有繼續追蹤），所以前述數據會有低估的傾向。向上跳空與向下跳空的連續缺口，它們被填補的平均期間長度差距頗大，前者為
    70 天，後者為 43 天。由於我們的研究期間基本上屬於股票大多頭市場，股價下降趨勢比較容易向上反轉，所以向下跳空的連續缺口被填補的平均期間較短。


    連續缺口在 1 個星期內被填補的比率為 11%（向上跳空）或 10%（向下跳空）。這個數據偏低，因為連續缺口發生之後，價格走勢通常會持續發展。

