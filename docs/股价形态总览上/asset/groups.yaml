    # ## 統計數據


    表 22.2 顯示雙角底排列的一般統計數據。這種型態的例子很多，在 500 支股票的 5 年走勢中，案例將近有 300 個。在這些案例當中，整理排列有 160
    個，反轉排列有 136 個。進一步觀察顯示，88%的反轉排列發生在價格下跌趨勢中——換言之，它們代表下降趨勢的底部反轉型態。


    大多數整理排列也發生在下跌修正走勢中，大約有 70% 的案例顯示排列發生當時的價格低於前一個月的水準。可是，稍微長期（超過 3 個月）的趨勢還是朝上。換言之，雙角底排列是發生在中、長期上升趨勢的回檔整理過程，排列完成之後，價格通常繼續朝上發展。


