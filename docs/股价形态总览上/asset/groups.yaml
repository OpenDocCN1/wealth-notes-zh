    在所有的 77 個案例中，擴張底向上突破全部屬於既有趨勢的反轉排列，向下突破則完全是整理排列。前文曾經提到，擴張底排列發生之前，價格處於下降趨勢，所以前述現象非常合理：擴張底向上突破（45
    例）完全是反轉排列，因爲向上突破與原先下降趨勢的發展方向相反；擴張底向下突破（32 例）完全是整理或連續排列，因爲向下突破與原先下降趨勢的發展方向相同。


    排列完成之後的失敗率很低，向上突破爲 2%，向下突破爲 6%。我認爲失敗率之所以偏低的理由如下。擴張底排列的兩條趨勢線相互發散，價格擺動愈來愈大，如果價格朝某個方向突破，當時正夾著最大的動能，所以突破之後不太容易立即改變方向（在
    5% 的跟進走勢發生之前）。換言之，已經發生的突破趨勢傾向於繼續發展。


    擴張底向上突破的平均漲幅為 25%，向下突破的平均跌幅為 27%。這兩個數據都不太尋常：結構完整的一般多頭排列，平均漲幅為 40%；正常的空頭排列，平均跌幅為
    20%。由此觀察，擴張底基本上屬於空頭排列，完成之後的向上漲幅低於平均水準，向下跌幅則超過平均水準。


    向上突破的最經常發生漲幅為 10%，大約屬於平均水準；向下突破的最經常發生跌幅為 15%~20%，超過常態水準。圖 1.4 顯示向上突破與向下突破的次數分配。我稱最高欄位為最經常發生漲幅或跌幅，因為這是發生次數最多的欄位（在所有的樣本排列中，落在該欄位的樣本個數最多）。如果某人針對該排列進行投資，這也是最可能發生的報酬率。


    次數分配的形狀看起來有些奇怪，最經常發生漲幅或跌幅集中在兩個區域：一是由 10% 到 25%，另一是在 35% 以上。這可能是因爲樣本太小的緣故，總共只有
    45 / 32 個案例分配在 10 個欄位中，所以形狀古怪。


    擴張底的目標價位，是由突破點向上或向下衡量排列的高度（詳細內容請參考「交易戰術」一節）。擴張底向上突破之後，只有 59% 的案例達成目標價位；向下突破之後，則有
    70% 的案例達成目標價位。就我個人的看法，如果價格型態足夠可靠，排列完成之後達成目標價格的比率至少應該是 80%；所


    * 譯按：按照推理，一旦發生部分漲勢或部分跌勢，擴張排列就已經結束。

    * 譯按：這種說法存在嚴重的矛盾。在圖 1.2 中，價格在 10 月中旬向上穿越 A 點的水平位置（圖形標示為「突破點」），當時顯然不能判斷向上突破是否發生，因爲我們不知道這波走勢是否會觸及上側趨勢線而折返（換言之，當時的擴張排列還沒有結束，根本不可能判斷突破發生）。事實上，突破應該發生在這波走勢向上貫穿上側趨勢線的位置（這個時候擴張排列才結束）；換言之，貫穿點就是突破點，也是排列結束的位置。反之，在圖
    1.1 中，當部分跌勢發生時，擴張排列已經結束，但突破還沒有發生。稍後，當收盤價向上穿越點 5 的水平位置，就是爲向上突破點。此處的突破點顯然不是上側趨勢線的貫穿點。圖
    1.3 的情況也一樣，6 月份發生部分跌勢，擴張排列已經結束，關於隨後可能發生的突破，位置應該考慮排列高點或低點。總之，關於突破的位置，首先應該考慮排列當時是否已經結束；如果已經結束，突破位置是排列高點或低點；如果突破當時才結束，突破位置是趨勢線貫穿點。

