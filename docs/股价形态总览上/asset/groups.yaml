    # 交易範例


    亨利管理一個小型避險基金，考慮買進圖 21.7 的股票，但還需要等待一些有利的技術訊號。兩個星期之後（1994 年 8 月），價格突破長期下降趨勢線，日線圖上的其他指標也發出買進訊號，所以他進場買進，平均成本是$17¼。


    隨著股價走高，亨利繼續追蹤，定期查核基本面的數據。這段上升走勢並不平穩，10 月份到 12 初之間開始出現一些奇怪的現象。某段期間內，看起來似乎正在形成擴張頂排列，但價格波動非常劇烈，很快就破壞整個型態。'
  - '[PAGE 498]


    股價在$21 與$25 之間數度來回游走，最後向上突破創新高。亨利覺得漲勢即將結束，更謹慎追蹤公司基本面的演變。由於他太專注於公司的營運狀況，沒有察覺價格型態的發展。當他與其他基金經理人閒聊時，彼此交換意見，發現該公司的基本面情況不太理想。


    「這就是股價呈現擴張頂排列的理由，」某位基金經理人指出。亨利皺著眉頭，在腦海裡冥想股價走勢圖，似乎真的是擴張頂排列。


    隔天，亨利叫出股價走勢圖，仔細觀察。他看見不斷墊高的高點與持續下滑的低點（請參考圖 21.7 的放大圖），典型的擴張排列特質。配合基本面的資料，他知道賣出的時機已經不遠，但還沒有到。他希望在上側趨勢線附近賣出。


    2 月初，價格向上測試前一波的高點失敗，回檔整理幾天，又再度向上攻堅，仍然失敗（結果形成兩個右肩）。第二度嘗試的峰位更低，意味著盤勢轉弱，於是亨利立即開始賣出持股。


    就擴張頂排列的角度觀察，由於上升走勢沒有觸及上側趨勢線，這代表部分漲勢。部分漲勢發生之後，擴張頂排列經常向下突破。


    當價格再度拉回到兩個右肩底部附近（B 點），亨利已經完全賣出持股。就在這個時候，他發現擴張頂排列已經演變為複雜頭肩頂型態，頭部的兩側各有兩個肩部。


    面對這個新發展，亨利與同事商量之後，決定放空股票。'
  - '[PAGE 499]


    當價格下跌到長期上升趨勢線附近，他已經持有少量的空頭部位。


    兩天之後，價格開始暴跌。一天之內，股價下跌$5，相當於 20%的跌幅，而且還欲罷不能。不到一個星期，股價直接跌到$16 附近才獲得支撐，跌幅大約是 36%。


    亨利瞭解這種迴光返照的走勢。股價通常在一個星期之內都會向上反彈，然後又繼續下跌。


    沒錯，股價稍微回升（$18^{1}/_{8}），但不是預期中的平滑弧狀反彈。幾天之後，價格又開始下跌，於是亨利立即停止抱怨，密切觀察走勢的後續演變。


    股票在$16 附近打底，呈現水平狀的橫向走勢。亨利認爲，這支股票可能在此築底，準備向上反攻，所以回補一半的空頭部位。


    4 月底，股價突然躍升到$18^{1}/_{2}，他立即回補剩餘的空頭部位。當天晚上，他與朋友在酒吧聊天，覺得心情非常愉快，決定自掏腰包請客。'
