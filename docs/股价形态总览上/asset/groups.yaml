    # Allen Telecom Inc.（電訊設備，NYSE，代碼 ALN）


    ![](img/843a88de0b50d7a36e65238281a4e722_453_0.png)


    圖 19.6 週線圖的複雜頭肩底排列。計算排列「頭」部與頸線之間的距離，由突破點向上衡量，結果就是向上突破之後的最低目標價位。右肩的低點經常能夠提供支撐。


    由於複雜頭肩底排列通常都會向上突破，所以沒有太大的必要等待實際突破。只要察覺這個潛在的複雜型態，就可以考慮買進。當然，重點還是在於如何明確辨識複雜頭肩底的排列。很多情況下，應該先挑選中心的常態頭肩底排列，然後繼續向兩側觀察，看看是否存在額外的肩部。圖
    19.6 的案例就可以由此角度處理。


    如果排列內存在兩個「頭」，結構就不同了。這種情況下，兩個「頭」之間通常相隔不足 1 個月，相當於典型的雙重底排列。另外配合對稱的肩部與水平狀頸線，型態應該很容易辨識。


    只要建立短線操作部位，就應該養成立即設定停損的習慣。就目前的複雜頭肩底排列而言，可以在衆多肩部挑選適當的下檔支撐。如果排列發生在年度低價附近，價格應該不至於跌破「頭」部低點；即使頭肩底排列失敗，價格貫穿「頭」部低點的程度也不應該超過
    10% 左右。探底成功之後，股價應該回升。


    如果排列不是發生在年度價格區間三等份的下線，一旦型態失敗（價格向下突破「頭」部），立即認賠賣出持股，不要無謂的期待股價回升。


    向上突破之後，股價大約有一半的機會（47%）回挫到頸線。一旦回挫走勢止跌回升，考慮買進或加碼。務必等待回挫走勢止跌，否則很可能遭遇圖 19.2 的情況：頸線不能有效緩和跌勢，價格繼續下挫
    1 個星期左右。如果多等待幾天，或許——取決於進場的實際位置——可以避開一些帳面損失。


    ## 交易範例


    如果天氣不錯的話，我偶爾會騎著單車四處逛逛，讓那些汽車駕駛羨慕一番。就是在這種情況下，我認識小惠。當我把自己的謀生之道告訴她之後，她也告訴我，她在一家夜總會擔任歌舞女郎，賺取不錯的小費。我不確定自己是否應該相信她的故事，不過她確實長得不錯（戴著頭盔與太陽眼鏡，誰知道？）。


    總之，小惠告訴我一筆她所進行的交易（參考圖 19.6）。


    1994 年 2 月，當價格由低點 $15$（第二個左肩）向上反彈之後，她由前一年 10 月份的峰位沿著最近轉折高點繪製一條下降趨勢線，當時的反彈走勢似乎正要向上穿越這條趨勢線。正因為如此，她開始注意這支股票。


    小惠知道，價格正式上漲之前，通常都會重新測試底部，所以決心等待。結果，股價再度下跌到 $14$（頭）。然後出現一段橫向走勢，曾經觸及 $14^{3/8}$（第一個右肩）——這也是小惠發現頭肩底排列的時候。


    小惠繪製這個頭肩底排列的頸線，發現這條頸線向上傾斜的角度實在太大，不可能把突破點設定在頸線上。所以，她把（第一個）右肩的最高價視為突破點，並且決定在此買進。


    5 月底，價格觸及小惠設定的買點，成交價格為 $17 \frac { 1 } { 2 }$。詳細觀察走勢圖之後，她發現另外兩個肩部（圖形沒有標示），一在 2
    月初，一在 5 月中旬，兩者的價位大約都在 $16$。所以，整個排列演變為複雜頭肩底型態。


    可是，不論常態或複雜的格式，對於小惠的投資計畫都沒有影響，只是變得有興趣而已。她懷疑是否會再發生兩個肩部。確實如此，7 月底又出現一個折返低點（第二個右肩），剛好對應
    1993 年 12 月中旬的轉折低點（第一個左肩），兩者的價位大約都是 $15 \frac { 3 } { 4 }$。不久，價格開始上漲。8 月中旬，部位已經解套，而且展開複雜頭肩底的向上突破。現在，小惠按照傳統衡量方法估計上檔的目標價位，結果是
    $22^{1 / 8 }$。


    兩個星期之後，走勢就滿足目標價位。由於她不急著用錢，決定繼續持有部位。小惠認為這支股票具有足夠的動能挑戰先前的高點 $29\frac{1}{4}$，所以把長期目標設定在此。只要價格不跌破買進成本，她就準備長期抗戰。


    1994 年底到 1995 年 6 月初，股票在 $21$ 到 $26$ 之間盤整，很難判斷後續的發展。當然，股價可能向下突破這個盤整區域，所以小惠把停止點提高到
    $21$。


    6 月中旬，大約是買進股票的一年之後，股價突然向上飆漲，直奔她設定在 $29$ 的賣點。小惠獲利了結之後，股票繼續攀升，但她需要這筆錢支付房子的頭期款。


    我完全沉迷在這段故事中，沒有注意她已經下車了。小惠表示，她準備回家另外找些新的投資機會。於是，她對我搖搖屁股，然後就走了。


    我由單車上跌下來。


    # 頭肩頂排列


    ![](img/843a88de0b50d7a36e65238281a4e722_457_0.png)


    ## 摘要資料


    - 外觀：呈現三個峰位的排列，中間峰位最高。

    - 反轉或整理：短期的（長達 3 個月）空頭反轉排列。

    - 失敗率：7%。

    - 平均跌幅：23%，最經常發生跌幅為 15%。

    - 成交量趨勢：下降趨勢；左肩的成交量通常最大，然後是頭，右肩的成交量最小。

    - 回升：45%。

    - 價格目標達成率：63%。

    - 意外發現：頸線向下傾斜或右肩低於左肩，跌幅通常較大，但不具有統計上的顯著意義。

    - 參閱排列：（21）複雜頭肩頂排列。


    本書討論的股價型態中，頭肩頂排列（head-and-shoulders top）或許是最著名者。這一方面是因為該排列的可靠性。在我篩選的案例中，93% 的排列向下突破，而且價格繼續走低，操作上不需等待型態完成（價格突破頸線）。就這方面而言，持股者或許可以避開不必要的損失，放空者可以提高獲利潛能。除此之外，頭肩頂排列之所以受到普遍認同，一方面也因為型態容易辨識——三個清楚的峰位，中間的「頭」高於兩「肩」。


    我的研究有兩個意外發現，頸線向下傾斜或右肩價位低於左肩，這兩種情況往往意味著突破之後的跌幅加重。不幸地，前述結論缺乏統計上的顯著意義；換言之，結果可能是（或不是）純屬巧合。雖說如此，這些現象還是很有趣，細節請參考「統計數據」一節。


    ## 緣起


