    50 個案例的平均報酬率，結果應該高於 10%，尤其是較高欄位代表的報酬率很高或發生的次數很多。


    次數分配最高欄位所代表的報酬率，我稱為「最經常發生報酬率」或「最可能發生報酬率」。某些情況下，幾個欄位的发生次數可能彼此很接近，所以最經常發生報酬率變成幾個區間的集合，例如：11~20%與
    31~40%。請注意，如果某個價格型態的最經常發生報酬率是 10%，你操作這個價格型態的報酬率未就一定是 10%。事實上，根據機率理論的大數法'
  - '[PAGE 31]


    則，只要你交易某類價格型態的案例夠多，最後的結果將逼近於該型態的平均報酬率——不是最經常發生報酬率。然而，我個人認為，最經常發生報酬率更能夠讓投資人瞭解特定價格型態的代表性績效或可靠性。


    對於任何特定的價格型態，每當我希望顯示最經常發生或最可能發生的報酬率區間（換言之，每當我希望排除離群值對於平均數造成的扭曲影響），就會採用次數分配。這代表另一種觀點，投資人能夠運用的另一種工具。


    # 運用價格排列進行投資


    我可以把牙醫的鑿齒鑽子給任何人，但未必願意讓他接近我的牙齒。這本書的情況也是如此：提供投資成功的必要工具。本書告訴你哪些價格型態最可靠，哪些應該避開。至於你是否可以運用它們賺錢，則完全取決於你個人的慧根。


    我稱本書為百科全書或總覽，因為這正是我運用本書的方式。每當我擁有或考慮買進的股票呈現某種價格型態，我就會參照本書的對應章節，提醒自己一些重點：型態辨識特質、續效或任何足以運用的資料。然後，我會觀察相同股票在不同時間刻度度上是否呈現類似的型態，我也會觀察相同產業內的其
    他股票是否呈現類似的型態。我會詳細的對照，判斷這些資料 是否能夠運用到當時的情況。另外，我也嘗試由錯誤中學習。


    除此之外，我也針對每天追蹤的 250 支股票進行價格型'
  - '[PAGE 32]


    態的紙上交易（不要緊張，整體瀏覽一次，只需要一小時）。即使我自認為是一個有經驗的投資者（將近 20 年的經驗，要不然應該稱為什麼？），持續性的紙上交易也能夠讓我保持靈敏。這些操作讓扣動扳機的決策——買賣股票——由刻意行爲變成自然反應。不斷檢視價格型態的表現，迫使我對於走勢排列、股票與市場產生一種直覺的感受。


    # 培養投資風格


    你如何培養一種投資風格？這是我最經常遭遇的一個問題，雖然實際的用詞可能更直接一些，例如：你如何投資股票賺錢？第一次碰到這個問題的時候，我不知道如何回答。如果你把某種藍色顯示給四個人，要求他們分別描述這種藍色的性質。其中一個人是色盲，所以你完全不考慮他的說法。某個人說，這是深藍色。另一個人說，這根本不是藍色，而是綠色。最後一個人則認為，這是藍色與綠色的混合。對於每個人來說，藍色就是藍色——只是不願彼此對照答案。


    培養一種交易風格也類似如此。這是一種個人的努力，基本上是由經驗累積而成。我沒有辦法直接把經驗交給你，但可以建議一些方法，讓你取得自己的經驗。


    假定你閱讀本書的某一章，然後買進第一支顯示該章價格型態的股票。這筆交易或許可以成功。對於初學者來說，第一筆交易幾乎總是成功，甚至第二筆或第三筆也是如此。可是，運氣畢竟不可靠（事實上，第一筆交易就可能失敗）。某一次，'
  - '[PAGE 33]


    當你按照價格型態進行投資，結果將失敗。你甚至可能遭逢一連串的失敗。你可能質疑自己的神智，質疑上帝，但你可以確定一點：這種做法無效！


    大多數人購買股票，心態就像購買水果一樣。他們看一看，或聞一聞，然後就買下了。請注意，此處談論的不是價值$1.59 的東西，而是花費數千元取得某家公司的部分所有權。


    如果你曾經擔任某家公司的董事，就瞭解我在說些什麼。你被股東推舉或任命為董事，你與這些股東之間就存在信託關係，也必須承受對應的信託責任。你不只需要深入研究公司管理階層交給你的資料，還必須實地勘查，實際踢一踢輪胎。不要假定管理階層的看法必定正確或具有代表性。多聽、多看、多問，嘗試提供協助，但不要成為麻煩人物（我總是被歸納為麻煩人物）。身為一家公司的股東——公司的頭家——難道就有任何差別嗎？


    最近，我曾經考慮買進某家公司的股票，因為它的股價走勢由等腰三角形向上突破。電腦程式告訴我，這家公司屬於機械產業，專門生產耐火產品。我繼續進行研究，最後發現自己還是全然不知道何謂耐火產品。雖然努力嘗試，但始終不能得到一般潛在投資對象給我的舒適感受。所以，我沒有實際買進這家公司的股票，雖然還是進行紙上交易。這種心態或許可以稱為「彼得林區徵候群」(Peter
    Lynch Syndrome)：對於你不瞭解或不能以一段話清楚解釋的東西，絕對不要投資。不錯的建議。'
  - '[PAGE 34]


    當然，如果你盲目地按照價格型態從事交易，而且結果確實有效，我難道可以宣佈你的做法錯誤嗎？顯然不行。透過這種方法，如果你能夠穩定的賺錢，那麼你已經發展一套適合自己個性的投資風格。


    我的投資風格結合了基本分析、技術分析、情緒分析與資金管理。雖然採用技術分析，這並不表示我完全不理會本益比、股價 / 每股銷售金額比率或其他更深奧的分析數據。除此之外，我的投資還涉及情緒分析。完全空手幾個月之後，突然看見一個非常不錯的投資機會，我決定進場。三天之後，我又產生交易的念頭。為什麼？這顯然不是我應有的交易頻率。我之所以希望交易，究竟為了什麼？因爲我渴望處在行動狀態中？或因爲我希望某個女人知道我的存在？或向她炫耀我的荷包厚度？這正是紙上交易扮演的功能所在。我可以測試新的技巧，但沒有必要實際承擔資本風險。如果紙上交易的模擬足夠真實，我的潛意識就不能察覺紙上交易與實際交易之間的差異，也可以汲取相同的經驗。


    解決情緒問題之後，就必須處理資金管理問題。如何評估合理的獲利程度？如何決定自己能夠承擔的損失？如何設定適當的交易規模？什麼情況下應該加碼？某支股票需要多久才能達到我預期的目標區？是否應該挑選成功機率較小而走勢發動時間較快的對象？


    運用圖形排列進行投資，基本上屬於一種機率的活動。只要嘗試的次數夠多，理論勝算就會變成實際獲利。當然，某些投資還是會失敗，你必須學習如何在虧損失控之前認賠出'
