    決定目標價位之後，你可以評估交易的風險／報酬關係。相對於目標價位，可能的損失有多大？為了獲取可能的報酬，是否值得承擔對應的潛在風險？就圖 3.7 而言，當價格向上突破而建立多頭部位，上檔目標價位在
    $55 1/2，下檔的支撐在何處？為了決定支撐與壓力，可以考慮先前價格走勢的峰值與谷值。


    ### 第 3 章 擴張排列：下降直角三角形 / 79


    ## 表 3.4 下降直角三角形擴張排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算水平趨勢線到理想最低點之間的排列高度。由突破位置向上或向下衡量排列高度，就分別代表向上或向下突破的目標價位。 |

    | 等待確認 | 我們很難預先判斷突破的方向，所以最好等待收盤價穿越上側或下側趨勢線。一旦發生突破，就順著突破方向進行交易。 |

    | 停損 | 一旦突破發生而進場建立順勢部位，停損可以設定在對側趨勢線的外緣。可是，大多數情況下，為了建立更緊密的停損，恐怕必須另外尋找支撐或壓力。如果股價朝預期方向發展，儘快把停損點移到損益兩平位置。
    |

    | 排列之內的交易 | 一旦判定擴張排列，可以考慮在排列之內進行區間操作，當價格觸及下側趨勢線而向上折返，進場買進，當價格觸及上側趨勢線而向下折返，結束多頭部位或反轉爲空頭部位，如此來回操作，但必須防範突破走勢而設定停損。
    |

    | 部分跌勢 | 在排列發展過程中，如果看到部分跌勢開始向上反轉，進場買進。 |


    附註：務必等待收盤價突破，然後順著突破方向進行交易。


    底。我們可以考慮幾個支撐。第一，1995 年 3 月（圖 3.7 沒有顯示）曾經出現一個等腰三角形的密集交易區，三角形頂點在 $ 46 ；第二，在 7 月底到
    10 月底之間（參考圖 3.7），$47 附近曾經發生兩個價格峰位，兩個峰位的壓力被克服之後，功能轉換爲支撐。所以，$46~$47 代表下檔的支撐，停損點可以設定在支撐的稍下方。


    實際的停損可以設定在 $45。如果你準備按照向上突破隔天的收盤價 $50 買進，潛在損失超過 10%。就目標價位 $55 衡量，上檔獲利潛能爲 10%。所以，風險／報酬結構是
    1:1 的關係，似乎不太值得。這種情況下，你可以考慮調緊停損（但停損很可能被正常的價格波動觸發），或者另外尋找風險／報酬關係更棒的機會。請注意，市場沒有規定你必須進行交易。


    表 3.2 的統計數據顯示，如果排列過程出現部分跌勢，隨後有 78% 的機會向上突破。這是相當不錯的勝算。如果你看見部分跌勢（跌勢幅度多深並不重要，只要沒有觸及或靠近下側趨勢線），而且價格開始向上反彈，就進場買進。如果你的運氣不太差，價格很可能向上突破，並且繼續走高。當然，你還是應該設定停損，然後隨著價格攀升而不斷調整停止價位。


    ## 交易範例


    老王非常重視圖形排列，擅長捕捉價格型態的獲利機會。當他看見下降擴張楔形或下降直角三角形擴張排列，經常出現強烈的交易衝動。在圖 3.7 的 C 點（$46^{3/8}），當價格由下側趨勢線向上反彈，他進場買進。


    建立多頭部位之後，他密切觀察後市的發展。第二天，股價走高，但隨後開始下滑。幾天之後，老王看見一個等腰三角形排列逐漸形成。根據他的判斷，等腰三角形通常屬於連續排列，總是朝排列之前的趨勢方向繼續發展，而且排列之前的趨勢方向是朝下。當股價下跌而買穿三角形的下側趨勢線，老王拋掉持股，成交價格是
    $46\frac{1}{2}$。


    老王由電腦螢幕中觀察更新的走勢圖，他知道自己先前的決定非常明智，因爲三角形排列完成也代表部分漲勢開始向下反轉，這通常意味著向下突破即將發生。


    隔天，價格進一步下跌，再度測試擴張排列的下側趨勢線。可是，行情隨後開始反彈。往後幾個星期內，老王非常訝異地看著股價快速攀升，再度觸及排列上側的趨勢線。回顧當初建立的多頭部位，考慮交易佣金之後，發生一些虧損。老王究竟是沉不住氣而賣得太快？或者是太過謹慎？這筆交易的結果應該提供什麼啓示？讀者不妨嘗試尋找自己的答案，如此會讓你成爲更精明的投資人。


    ## 擴張頂排列


    ![](img/843a88de0b50d7a36e65238281a4e722_102_0.png)


    ### 摘要資料


    #### 向上突破


    | 項目 | 說明 |

    | :--- | :--- |

    | 外觀 | 排列發生之前，曾經出現延伸性的漲勢。<br>喇叭狀的型態，高點持續墊高，低點持續下滑。向上突破。 |

    | 反轉或整理 | 短期的（少於 3 個月）多頭整理排列。 |

    | 失敗率 | 4%。 |

    | 平均漲幅 | 34%，最經常發生報酬率介於 10% 到 15% 之間。 |

    | 成交量趨勢 | 不規則，通常隨著價格起伏：價漲量增 / 價跌量縮。 |

    | 價格目標達成率 | 75%。 |

    | 意外發現 | 排列末端出現部分漲勢，向下突破的可能性為 65%；<br>排列末端出現部分跌勢，向上突破的可能性為 86%。 |

    | 其他名稱 | 發散三角形，標準擴張頂，五點反轉。 |

    | 參閱排列 | （1）擴張底排列，（2）上升直角三角形擴張排列，（3）下降直角三角形擴張排列，（5）上升擴張楔形排列，（6）下降擴張楔形排列。 |


    #### 向下突破


    | 項目 | 說明 |

    | :--- | :--- |

    | 外觀 | 排列發生之前，曾經出現延伸性的漲勢。<br>喇叭狀的型態，高點持續墊高，低點持續下滑。向下突破。 |

    | 反轉或整理 | 短期的（少於 3 個月）空頭反轉排列。 |

    | 失敗率 | 4%。 |

    | 平均跌幅 | 23%，最經常發生跌幅介於 10% 與 20% 之間。 |

    | 成交量趨勢 | 不規則，通常隨著價格起伏：價漲量增 / 價跌量縮。 |

    | 價格目標達成率 | 64%。 |

    | 參閱排列 | （1）擴張底排列，（2）上升直角三角形擴張排列，（3）下降直角三角形擴張排列，（5）上升擴張楔形排列，（6）下降擴張楔形排列。 |


    擴張頂（Broadening tops）的行為，非常類似於擴張底。兩者之間最大的差別，在於型態發生之前的價格趨勢。對於頭部型態，中期價格趨勢是朝上；底部型態則是朝下。這項區別相當武斷，只是用來觀察這兩種排列的行為是否存在差異。現在，讓我回答讀者可能的質疑：這兩種排列的行為非常類似，但績效稍有差別。


    擴張頂分為兩種類型：向上突破與向下突破。在「摘要資料」中，兩種類型的失敗率都是 4%。這是相當不錯的讀數。根據我的看法，失敗率在 20% 以下的型態都可以接受。


    向上突破的平均漲幅為 34%，一般結構理想的多頭排列平均漲幅為 40%。擴張頂向下突破的平均跌幅為 23%，一般空頭排列的平均跌幅大約是 20%。


    就目標價位的達成率來說，擴張頂排列的表現優於某些其他型態。每 4 個向上突破的案例中，就有 3 個達成目標價位，達成率為 75%；向下突破的目標價位達成率為
    64%。雖說如此，我認為 80% 以上的達成率才屬於可靠的型態，所以擴張頂排列的目標價位達成率稍嫌不足。


    每當擴張頂排列發生部分漲勢（部分跌勢）——換言之，價格朝上（朝下）發展，但還沒有碰到上側（下側）趨勢線之前就反轉——通常都預示價格將向下突破（向上突破）。凡是出現部分漲勢的擴張頂排列，65%
    的案例向下突破。凡是出現部分跌勢的擴張頂排列，86% 的案例向上突破。


    ## 緣起


    擴張排列具有多種的形式與名稱，包括：擴張頂 / 擴張底、上升 / 下降直角三角形擴張排列、發散三角形 (expanding triangle)、標準擴張頂
    (orthodox broadening top) 與五點反轉 (five-point reversal)。最後三者都是擴張頂排列，後兩者的型態都有 5 個轉折點。


    讓我們透過圖 4.1 說明排列的緣起。這支股票起漲於 1994 年 12 月，在 1995 年 5 月與 6 月之間稍作整理，然後繼續上漲，9 月中旬創高價
    $53\frac{3}{4}$。股票持有人發現整段漲勢的期間與幅度都已經很大，決定賣出股票，於是股價下跌。1995 年 9 月 25 日是典型的賣壓高潮，價格開低走高，成交量暴增，形成單日反轉的底部
    $48\frac{3}{4}$。由 6 月份的波段起漲點衡量，9 月中旬以來的下跌走勢已經回檔 40% 左右，投資人認定股價已經超跌，進場買進股票，推升股價走高。


    ### Beneficial Corp.（金融服務，NYSE，代碼 BNL）


    ![](img/843a88de0b50d7a36e65238281a4e722_105_0.png)


    圖 4.1 雙重頂演變爲擴張排列。1995 年 12 月底，價格向上測試雙重頂失敗，留下單日反轉的線形。在擴張頂排列的低點，呈現積極的買盤與不願殺低的賣盤，排列高點則存在獲利了結的動能玩家。


    10 月 19 日，股價再創新高 $54\frac{1}{2}$。當股價由高點回檔，許多謹慎的投資人擔心雙重頂頭部正在形成，於是拋售股票，造成股價暴跌。當價格向下買穿雙重頂排列兩個頭部所夾的谷底
    $48\frac{1}{4}$，雙重頂排列經過確認而正式完成。


    由 1995 年 6 月份以來，成交量逐漸放大，意味著供給與需求之間的競爭轉趨劇烈。當買盤意願勝過殺低賣壓，跌勢終於獲得支撐，股價開始向上反彈。這個時候，型態分析者可以繪製兩條趨勢線，一條銜接雙重頂兩個頭部，另一條銜接兩個谷底。如果交易者認定雙重頂排列已經誕生，股價正朝上側趨勢線發展，就可以進場買進股票。這支股票似乎完全按照劇本發展，向上攀升，觸及上側趨勢線而拉回，股價再創新高
    $55\frac{1}{2}$。


    波段漲勢最後兩、三天的線形實在太過陡峭，顯然無法持續。頭部的峰位看起來像是單日反轉，價格開高，收盤價位在最低價附近，留下一支很長的線形。可是，成交量不具說服力。當天的成交量雖然超過近一個星期來的平均水準，但全然不能與
    11 月份底部的成交量比擬。總之，股價暴跌，很快觸及下側趨勢線而反彈，創新低價 $43\frac{1}{2}$。一旦價格恢復漲勢，動能玩家上轍推波助瀾，成交量隨著價格漲勢成長。買進力道與上升動能持續推升股價，相當順利地穿越上升趨勢線——這是擴張頂排列的向上突破。


    這個排列內的每個峰位與谷底，都代表買賣雙方的鬥爭。在低點附近，買方相信股票已經超賣，積極進場買進，股價止跌反彈。在頭部附近，獲利了結的賣壓出籠，造成股價下挫。


    某些投資人看著股價向下穿越他們的買點，雖然有些懊惱，但相信股票具有價值，在低檔持續累積股票。這種行爲可以說明股價何以在低點向上反轉，或許也能夠解釋投資人在頭部害怕錯失高點而急於獲利了結的心態。只要股價創較高的高點而向下反轉，賣壓也會擴大，造成股價夾著更大的成交量下挫。這種現象清楚顯示在排列的第二個與第三個峰位。


    圖 4.1 的排列也說明最後突破點的判斷非常困難。每當股價靠近或觸及上側趨勢線 / 下側趨勢線，就代表最後的突破可能即將出現。唯有當股價朝相反方向折返，才意味著突破沒有發生。關於這些行爲，我們將在「交易戰術」一節探討其中的運用可能性。


    ## 辨識準則


    表 4.1 列示擴張頂排列的辨識準則。第一項準則是有關進入排列的價格趨勢。這個價格趨勢也是造成擴張底與擴張頂排列之所以不同的特質。擴張頂發生之前，必須出現延伸性的價格漲勢；底部排列發生之前，則必須出現延伸性的價格跌勢。我是由主觀角度設定這兩個排列的區別準則。


    ### 表 4.1 擴張頂的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 價格趨勢 | 進入排列的中期價格趨勢應該向上。 |

    | 形狀 | 喇叭狀型態，高點持續墊高，低點持續下滑。五點反轉具有 3 個峰值與 2 個谷底。 |

    | 趨勢線 | 價格遵循兩條趨勢線：銜接高點的趨勢線向上，銜接低點的趨勢線向下。 |

    | 觸及點 | 至少需要兩個轉折高點與兩個轉折低點，但轉折高點與轉折低點不一定交替出現。 |

    | 成交量 | 不規則，但通常是價漲量增，價跌量縮。 |

    | 突破 | 突破方向可能朝上或朝下，在明確突破之前，也可能出現長達數個月的橫向走勢。 |


    沿著峰位與谷底繪製的兩條趨勢線，使得排列呈現喇叭狀的型態。高點持續墊高，低點也持續下滑，這是擴張頂排列的特色。趨勢線的傾斜方向，是造成這項排列不同於其他排列的重要因子之一。上側趨勢線必須向右上方傾斜，下側趨勢線必須向右下方傾斜。如果這兩條趨勢線之一呈現水平狀，就屬於上升或下降直角三角形擴張排列。如果兩條趨勢線都朝單一方
    向傾斜，則屬於擴張楔形排列。


    價格型態發展為擴張頂之前，至少必須有兩個轉折高點與兩個轉折低點。轉折點是指價格由漲勢反轉為跌勢或由跌勢反轉為漲勢的關鍵位置。轉折高點是指顯著的價格峰位而言，轉折低點則是指顯著的價格谷底而言。圖
    4.1 顯示 3 個轉折高點觸及上側趨勢線，觸及或靠近下側趨勢線的轉折低點則有 4 個。在排列的形成過程中，轉折高點與轉折低點不一定必須交替出現。


    根據線性迴歸分析顯示，價格漲勢與跌勢之間的成交量趨勢沒有明顯的差異。對於典型的擴張頂排列，通常會有價漲量增 / 價跌量縮的現象。請回頭參考圖 4.1，成交量隨著價格攀升而增加，當價格形成峰位而下跌，成交量也開始下降。可是，我不認為擴張頂排列的成交量型態具有任何重要意義。


    當價格穿越到趨勢線界定的範圍之外，或價格沿著趨勢線出現延伸性的走勢，就視為突破發生。在圖 4.1 中，如果把上側趨勢線向未來延伸，大約與價格走勢交錯在 $58
    附近。價格穿越這個水準而繼續走高。一旦突破發生，我把排列的最高峰位視為實際的突破價位。就圖 4.1 的例子而言，突破價位是 $55\frac{1}{2}$，這也是
    12 月初的價格峰位*。


    讓我們引用圖 4.2 來說明前述的各項準則。整個形狀確實像一個喇叭，價格走勢形成兩條明顯的趨勢線，上側趨勢線向上傾斜，下側趨勢線向下傾斜，兩條趨勢線都至少銜接兩個轉折高點或兩個轉折低點。隨著時間經過，高點持續墊高，低點持續下滑，價格可能靠近、觸及或稍微穿越趨勢線之後才折返，最後則發生突破。


    成交量型態缺乏規則，但大致呈現「價漲量增／價跌量縮」的趨勢。這種現象在圖 4.2 中看得很清楚。舉例來說，11 月中旬的價格夾著大量上漲，回檔過程的成交量明顯縮小。


    這種排列通常會落在最近 12 個月價格區間的哪個位置呢？如同我們所預期的，排列應該落在年度價格區間的上端。


    > ※ 譯按：請參考第 25~26 頁的註腳。作者當然可以把突破價位「定義」在任何位置，但譯者認為這種定義不應該違背股價型態分析的邏輯。突破明明發生在 1996
    年 4 月初的 $58 附近，為什麼要把 1995 年 12 月初的高點 $55 定義為突破價位，這有什麼意義呢？如果收盤價向上穿越 $58 定義為突破發生，為什麼突破價位需要另外定義為
    $55 呢？突破發生的時候，你還能夠在 $55 附近（不論是 1995 年 12 月份的 55½% 或 1996 年 3 月份的 $55½）買進嗎？如果價格穿越
    $58 之後排列才結束，為什麼排列最高價 $55 竟然會低於排列內的其他價位呢？事實上，作者本人的說法也相互矛盾。在第 24 頁倒數第二段提到「如果價格在排列之內貫穿趨勢線，貫穿點就是突破點。」（原文第
    16 頁：If prices pierce the trendline, then the penetration point becomes the breakout
    point.）請注意，假定 1996 年 1 月份的低點沒有觸及或靠近下側趨勢線（發生部分跌勢）。在這種情況下，擴張頂排列已經結束，隨後當價格在 1996
    年 3 月份向上穿越排列最高價 $55½（由於排列已經結束，排列最高價具有明確的定義），可以視為向上突破。


    ### ASA Ltd.（國內投資公司，NYSE，代碼 ASA）


    ![](img/843a88de0b50d7a36e65238281a4e722_110_0.png)


    圖 4.2 擴張頂排列的高點持續墊高，低點持續下滑，兩條趨勢線隨著時間經過而向外發散。


    請注意，擴張頂排列的整體型態通常是水平狀（換言之，以水平線為軸心而上下對稱）。這個排列不同於兩條趨勢線同時向上或向下的上升或下降擴張楔形。擴張排列的上側趨勢線必須向上傾斜，下側趨勢線必須向下傾斜。


    標準擴張頂與五點反轉都代表相同形式的排列，它們只不過是具備 3 個轉折高點與 2 個轉折低點的擴張頂。圖 4.3 就是典型的例子。除了名稱以外，我看不出擴張頂與標準擴張頂
    / 五點反轉之間存在任何差異。


    某些分析家認為，五點反轉具有空頭意涵，通常會向下突破。我的統計數據——雖然只有 30 個案例——並不支持這個論點：16 個案例向上突破，其他爲向下突破。雖然樣本太小而不足以提出任何結論，但相關數據符合一般擴張頂排列傾向於向上突破的現象（53%）。


    ## 失敗案例


    ![](img/843a88de0b50d7a36e65238281a4e722_111_0.png)


    ![](img/843a88de0b50d7a36e65238281a4e722_111_1.png)


    圖 4.3 五點反轉或標準擴張頂。3 個轉折高點與 2 個轉折低點構成 5 點反轉。


    圖 4.3 與 4.4 是擴張排列失敗的兩個例子，因爲價格沒有朝突破方向繼續發展。在圖 4.3 中，價格夾著大量向下突破下側趨勢線，而且前一波漲勢高點靠近而沒有實際觸及上側趨勢線（可以解釋為部分漲勢），所以這似乎顯示有效的突破。然而，價格向突破之後又立即回升，整個過程並且伴隨著大量。這是一個
