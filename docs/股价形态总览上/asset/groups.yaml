    ![](img/843a88de0b50d7a36e65238281a4e722_503_1.png)


    圖 22.1 雙角底排列範例。兩支向下測試底部的突兀長線形，中間隔著一星期，看起來就像公鹿的兩支角，只是方向朝下。


    突兀線形，但價格幾乎收在最高價附近，較前一週收盤價只下跌 1/8 點。這即是潛在的雙角底排列：兩支突兀長線形，中間隔著單調線形，代表趨勢向上反轉的訊號。由雙角底最低點的位置起算，隨後一年半內出現
    100%以上的漲勢。


    ### 辨識準則


    如何辨識雙角底排列呢？表 22.1 列示一些辨識準則。原則上，這些準則只希望在週線圖的底部找到兩支凸顯的長線形。


    表 22.1 雙角底排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 週線圖，向下突起長線形 | 在週線圖上尋找兩支向下的突起長線形，中間隔著另一支線形。兩支突起線形的長度，至少應該類似最近一年內的長線形長度，而且它們的低點應該遠低於中間所夾單週線形的低點。形狀看起來就像公鹿的一對角，但方向朝下。兩支突起線形愈長，績效通常愈理想。
    |

    | 兩個底部價位大致相同 | 雙角低點的價位大致相同，差距通常不應該超過 3/8 點。當然，對於高股價的股票，兩者的差距也可以超過 1 點。 |

    | 清楚明確 | 在下降趨勢中，雙角低點應該遠低於週運線形的低點，尤其是對於排列左側的數支線形而言。雙角底排列通常發生在延伸性跌勢末端，但也可能發生在上升趨勢的修正走勢或橫向整理走勢末端（在這種情況下，相對於排列左側，型態比較不明確）。
    |

    | 線形重疊部分很多 | 構成雙角底排列的兩支長線形，價格重疊部分應該很多。 |

    | 大成交量 | 左角成交量高於平均水準（54% 的案例是如此），右角成交量低於平均水準（52% 的案例是如此）。可是，這只是參考準則而已，個別案例的成交量型態變化很大。
    |


    請參考圖 22.2 的兩個雙角底排列案例。左側的第一個排列，結構非常類似圖 22.1 的例子。這個底部排列發生在一段下降趨勢的末端，該波段跌勢起始於 1991
    年 8 月份的峰位 $25，低點則發生在將近 2 年之後的雙角底排列右角低點 $6\frac{1}{2}$。價格跌勢在此向上反轉。


    ## Tenet Healthcare Corp.（醫療服務，NYSE，代碼 THC）


    ![](img/843a88de0b50d7a36e65238281a4e722_505_0.png)


    圖 22.2 兩個雙角底排列案例。第一個排列發生在下降趨勢，第二個排列發生在上升趨勢。請注意，第二個長管底排列剛好發生在趨勢轉折點上。


    雙角底排列雖然也出現在日線圖上，但週線圖比較容易觀察。對於圖 22.2 的左側例子，兩支向下的突兀長線形非常清楚，中間夾著另一支線形；中間線形的低點，顯著高於兩側突兀線形的低點，這也是排列的辨識準則之一。


    回顧排列發生之前的幾個月，我們看不到任何類似長度的長線形。換言之，這兩支長線形非常突兀，值得投資人留意。


    雙角底的兩支線形低點差距很小，大約是 3/8 點或以內。當然，對於高價股來說，差距金額可以稍微大些，但差距百分率很小。圖 22.2 的左側案例，兩個低點的價格差距只有
    1/4 點。


    左側的例子發生在價格下降趨勢，排列的形狀非常突兀（相對於先前的線形而言），沒有任何向下的離群線形造成干擾。請注意，雙角底排列應該具有「鶴立雞群」的感覺，不應該屬於密集交易區的一部分，代表下降趨勢向上反轉的樞紐點。


    這個排列的兩支線形價格重疊部分很大，線形長度大約相同，左側線形的位置稍高。


    圖 22.2 右側案例說明上升趨勢的雙角底排列狀況。當時，上升趨勢出現 3 個星期的回檔整理，這 3 個星期即構成雙角底排列，形狀相當清楚。


    兩支突兀線形的低價相同（$14\frac{1}{2}$），價格重疊部分很多（左側線形幾乎完全涵蓋右側線形）。讀者或許認為，雙角底的低點並沒有從週遭線形中凸顯出來，尤其是相對於
    12 月初與 6 月底的長管狀排列（pipe formations）。這種說法當然沒錯，但這個排列還是顯示圓滑的底部，沒有參差不齊的外緣。


    圖 22.2 兩個例子的成交量型態都不尋常，右側案例兩支角的成交量都低於平均水準，左側案例的兩支角成交量都高於平均水準。根據我統計的結果顯示，54% 案例的左角成交量高於平均水準，52%
    案例的右角成交量低於平均水準。由於這兩個數據都非常接近 50%，實際的大小關係可能剛好相反，所以我希望過分強調成交量型態。


    ### 失敗案例


    雖然雙角底排利的失敗率很低（11%），還是應該留意失敗的可能性。請參考圖 22.3 的 5% 失敗案例。所謂「5% 失敗」，是指價格最初朝正確方向發展，但沒有出現足夠程度的走勢（跟進漲幅不超過
    5%），就開始朝另一個方向反轉。這兩支向下的突兀線形看起來很不錯，長度足夠，價格重疊部分也很多。這個案例發生在回檔過程中；回檔整理結束之後，價格很可能回升到先前的高點（形成雙重頂排列），甚至再創新高。如果你認為隨後的走勢可能演變爲雙重頂型態，目前這個雙角底排列就不值得操作，因為上檔的空間不夠大。


    Acuson Corp. (醫療用品，NYSE，代碼 ACN)


    ![](img/843a88de0b50d7a36e65238281a4e722_507_0.png)


    圖 22.3 雙角底排列的失敗案例。除了其他徵兆之外，許多類似長度的突兀線形（標示為 L），使得這個排列的有效性值得懷疑。下降三角形排列也顯示價格可能走低。


    另外，你也可能懷疑目前——雙角底排列發生當時——是處在頭肩頂排列的「頭部」下跌過程中。「左肩」已經出現在 1994 年 5 月底，對應的「右肩」可能發生在
    1995 年 4 月或 5 月份。若是如此，你也應該放棄這個機會，因爲「右肩」的高度頂多在 $16 附近。換言之，這是假定目前的雙角底排列將失敗，價格繼續下跌到
    $11~$12 之間（假設頸線爲水平狀），然後反彈形成「右肩」。如果你預期價格將下跌（雙角底排列將失敗），當然沒有買進的道理。


    型態可能失敗的另一個徵兆，是排列線形的長度。如果你回顧稍早的價格走勢，就會發現許多線形甚至超過雙角的長度。這意味著雙角底排列可能沒有特殊意義。


    型態的可見度也不太理想，因爲稍早的價格走勢使得底部排列相當模糊。在正常的小跌走勢中，線形低價應該持續創新低（例如：1995 年 2 月份到 4 月份之間的跌勢）。雙角底排列應該代表加速的跌勢，相對於排列左側的走勢，當時的線形非常突兀。就目前這個例子來說，雙角底與先前線形的低價大約相當，結構並不顯著。整個排列告訴我們，底部似乎正在形成當中，但高點繼續下滑。換言之，當時價格型態看起來是投資人應該謹慎的下降三角形排列。


    總而言之，當時似乎有許多徵兆都顯示這個雙角底排列很可能失敗。可是，由統計的觀點來說，雙角底排列的失敗頻率到底有多高？


    第 22 章 雙角底排列 / 489


    ### 統計數據


    表 22.2 顯示雙角底排列的一般統計數據。這種型態的例子很多，在 500 支股票的 5 年走勢中，案例將近有 300 個。在這些案例當中，整理排列有 160
    個，反轉排列有 136 個。進一步觀察顯示，88%的反轉排列發生在價格下跌趨勢中——換言之，它們代表下降趨勢的底部反轉型態。


    大多數整理排列也發生在下跌修正走勢中，大約有 70% 的案例顯示排列發生當時的價格低於前一個月的水準。可是，稍微長期（超過 3 個月）的趨勢還是朝上。換言之，雙角底排列是發生在中、長期上升趨勢的回檔整理過程，排列完成之後，價格通常繼續朝上發展。


    表 22.2 雙角底排列的一般統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：<br>1991 年~1996 年的 500 支股票 | 296 個 |

    | 反轉或整理排列 | 160 個整理，136 個反轉 |

    | 失敗率 | 34/296 相當於 11% |

    | 成功排列的平均漲幅 | 37% |

    | 最經常發生漲幅 | 20%~30% |

    | 左角 / 右角成交量相對於<br>25 天移動平均的水準 | 146%，116% |

    | 對於成功排列，<br>到達最終高點的天數 | 9 個月（265 天） |


    排列的失敗率爲 11%，遠低於可靠型態的最高門檻 20%。幾乎所有的排列都會按照預期發展，出現 5%以上的漲幅。排列的平均漲幅爲 37%，最經常發生漲幅介於
    20%與 30%之間。


    關於平均漲幅的計算，我把進場點設定爲排列完成之後隔週（換言之，右角的次一支線形）最高價與最低價的平均數。這是假定投資人察覺雙角底排列之後進場，成交價格爲隔週價格區間的中點價位。另外，出場點設定爲價格上升趨勢發生重大變動之前（價格發生
    20%或以上的跌幅之前）的最高價位（最高點）。


    圖 22.4 顯示價格漲幅的次數分配。爲了避免平均數受到少數偏高離群值的扭曲，此處利用次數分配圖顯示該排列最經常發生的漲幅。由圖 22.4 可以發現，最右側欄位很高，漲幅超過
    90%的排列佔所有案例的 11%。除了這個欄位之外，其餘欄位勾畫出鐘鈴狀的曲線。


    我把最經常發生漲幅定義爲發生次數百分率最高的欄位（不考慮最右側欄位）。在圖 22.4 中，發生次數百分率最高的欄位爲 20%與 30%，這也代表最經常發生漲幅。可是，兩側
    10%與 40%欄位的發生次數也很高，所以最經常發生漲幅或許應該界定在 10%~40%之間。當然，實際案例的個別狀況都不同。


    以 25 天移動平均成交量做爲基準，雙角底排列的左角線形成量是 146%，右角線形成量是 116%。這些數據顯示，左角的成交量很大，右角的成交量稍見縮小。實際的統計數據顯示，54%案例的左角線形成量大於平均水準，52%案例的

