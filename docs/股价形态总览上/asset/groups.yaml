    表 13.3 顯示雙重頂突破的相關統計數據。雙重頂排列第二個峰值距離突破點的時間距離平均為 39 天。


    前文已經提到，我們只考慮經過確認的雙重頂排列；換言之，收盤價實際向下突破確認點。所以，此處考慮的 454 個案例都完全向下突破。可是，這些案例之中，有 75
    個排列在向下突破之後沒有發生 5%或以上的跟進跌勢。這類 5%失敗案例並不常見，大約佔總案例的 17%。


    向下突破之後，大約有三分之二的排列（69%）會出現回升走勢（pullbacks），價格重新拉高到突破點附近。這個數據明顯偏高，似乎意味著突破點下檔的空間很有限。這個意涵也得到最經常發生跌幅的支持，讀數只有
    10%到 15%之間。很多情況下，跌幅只是 10%或 15%，所以價格回升到突破點附近，可能繼續走高。基於這個緣故，如果打算針對雙重頂進行操作，最恰當的時間或許是：等待回升走勢，而且價格已經重新向下反轉之後。價格拉回到達突破點的回升走勢完成期間平均爲
    10 天，約略等於其他排列的讀數。


    由突破點衡量到最終低點的平均期間爲 3 個月（83 天）。絕大部分的案例（70%）都在 3 個月內到達最終低點，另外 18% 案例在 6 個月之內到達最終低點。所以，就投資意涵來說，我把雙重頂歸納爲短期排列。


    雙重頂的突破點落在年度價格區間三等份的哪個位置（下緣 / 中央 / 上緣）？半數的案例落在年度價格區間的中央。至於這三個區間的案例平均跌幅，則沒有明顯的差異；換言之，不論突破點落在年度價格區間的哪個位置，跌幅都大致相同。


