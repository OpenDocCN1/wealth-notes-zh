    所謂的提前突破（premature breakout，即是所謂的假突破 [false breakout]），是指收盤價穿越排列的邊界，但穿越之後沒有出現跟進走勢，在型態結束之前又回到排列之內。這種型態的提前突破相當罕見，應該沒有考慮的必要。


    某些上升擴張排列，初期的價格高點持續墊高，下側形成堅實的水平底部，但後期階段卻出現長達幾月的橫向盤整。最後，價格會穿越排列上緣或突破底部趨勢線。一旦突破發生之後——大多是向下突破——通常會出現回升走勢（pullback）。對於向下突破，價格經過一段跌勢之後，可能向上折返到底部趨勢線附近，這段折返走勢稱為向下突破的回升走勢。向上回升的過程中，價格雖然可能繼續上漲，但通常碰到水平趨勢線之後都會再度下挫，然後展開正式的下跌走勢。所以，回升走勢往往是投資人放空股票或加碼空頭部位的良好機會。可是，採取行動之前，最好確定回升走勢已經結束，價格又恢復跌勢。


