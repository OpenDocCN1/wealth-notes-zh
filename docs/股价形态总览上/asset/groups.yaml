    \ $22\\%$ 回補空頭部位，股價隨後下跌到 $20$ 附近。扣掉佣金費用之後，這筆交易獲利 $25\\%$。凱莉送給女兒一個特大號的親吻做爲獎賞。\n\
    \n# 21 複雜頭肩頂排列\n\n![](img/843a88de0b50d7a36e65238281a4e722_479_0.png)\n\n### 摘要資料\n\
    \n- **外觀**：多個肩 / 多個頭的頭肩頂排列。\n- **反轉或整理**：短期（3 個月以內）的空頭反轉排列。\n- **失敗率**：8%。\n-\
    \ **平均跌幅**：27% ，最經常發生跌幅爲 20% 。\n- **成交量趨勢**：下降趨勢。\n- **回升**：64%。\n- **價格目標達成率**：67%。\n\
    - **意外發現**：頭線向下傾斜或左肩價位較高，續效稍微理想。\n- **參閱排列**：（13）雙重頂排列，（20）頭肩頂排列，（23）雙角頂排列，（35）圓形頂排列，（43）三重頂排列。\n\
    \n除了外觀以外，常態頭肩頂與複雜頭肩頂（complex head-and-shoulders tops）之間幾乎沒有差別。只要加上一個頭或幾個肩，常態排列就演變爲複雜型態。兩種排列本身的成交量都呈現下降趨勢。左側肩部的成交量通常大於右側的對應肩部。\n\
    \n複雜頭肩頂的失敗率很低（8%），但稍高於常態頭肩頂（7%）。突破之後的回升走勢發生頻率也稍微提高，大約每三個案例就會發生一次。\n\n平均跌幅爲 27%，在空頭排列內屬於偏高水平。可是，最經常發生跌幅只稍高於均勻分布，介於\
    \ 10%到 30%之間（跌幅單位刻度爲 5%）。\n\n頸線與肩部高度有兩個意外發現。頸線向下傾斜的排列，績效稍優於頸線向上傾斜，前者的平均跌幅爲 27%，後者爲\
    \ 26%。同樣地，最外側左肩高度超過對應的右肩，平均跌幅爲 28%；反之，最外側右肩高度超過對應的左肩，平均跌幅爲 27%。可是，這兩種情況的績效差異都不存在統計上的顯著意義（換言之，可能純屬巧合）。\n\
    \n### 緣起\n\n複雜頭肩頂排列有兩種基本的類型，請分別參考圖 21.1 與 21.2。在圖 21.1 內，頭肩頂排列發生在一個長期多頭行情的末端。這個多頭行情起始於\
    \ 1992 年 11 月的低點$15¼，1995 年 7 月中旬出現$36⁵⁄₈的峰位，10 月中旬向下修正到$28⁵⁄₈，\n\n![](img/843a88de0b50d7a36e65238281a4e722_481_0.png)\n\
    \n![](img/843a88de0b50d7a36e65238281a4e722_481_1.png)\n\n圖 21.1 兩個頭的複雜頭肩頂排列。左肩與第一個頭構成三波段衡量漲勢。兩個「頭」本身呈現雙角頂排列。第二個頭與右肩構成三波段衡量跌勢，雖然有些拖泥帶水。\n\
    \n然後向上反彈而開始形成頭肩頂。反彈走勢完成左肩之後，在$31~$32 呈現橫向盤整，又突然向上展開三波段衡量走勢（measured move；譯按：這段走勢應該由$31\
    \ 到$35¼，對等於左肩出現之前的漲勢距離$28⅝~$33⅛）。這波衡量漲勢距離上檔目標大約差$1 左右，轉折高點即是排列的第一個頭部。\n\n稍微回檔之後，股價又回升到原先高點，做出第二個頭部。價格由第二個頭部下滑，跌勢在左肩底部獲得支撐，向上反彈形成右肩。隨後的跌勢貫穿頸線——銜接兩肩谷底的直線——但很快又拉回到頸線之上。這波回升走勢在$32\
    \ 附近被壓回，然後直接下跌到$28^{37}\\div 8。\n\n針對兩肩之間的成交量時間序列進行迴歸分析，結果顯示成交量確實呈現下降趨勢。這種現象在圖\
    \ 21.1 內雖然不明顯，但大約三分之二的複雜頭肩頂排列都具有這種特質。\n\n圖 21.1 的兩個頭部看起來似乎是雙重頂排列（double tops），實際不然，理由有幾點。首先，兩個峰位的時間距離太接近。對於標準的雙重頂來說，兩個峰位至少必須相隔\
    \ 1 個月（我個人可以接受時間距離較近的兩個頭部）。另外，按照雙重頂的定義，兩個峰位所夾谷底的回檔幅度必須介於 15% 到 20% 之間。目前這個例子中，回檔幅度大約是峰位的\
    \ 5%，差距太大。\n\n除此之外，排列內的兩個峰位也可以看成雙角頂型態（horn top），但目前的主題是複雜頭肩頂。事實上，技術分析經常發生這類現象：由不同的角度觀察某個價格走勢圖，你所看到的型態往往不同。對於圖\
    \ 21.1 的走勢圖，有些人或許看到一組三波段衝量走勢（measured moves；一個漲勢接著另一個跌勢），另一些人或許看見雙角頂，但最後的結論大致相同——都是空頭意涵的排列。\n\
    \n圖 21.2 是另一種類型的複雜頭肩頂排列：一個頭與數個肩，屬於比較常見的類型。這種技術型態會讓初學投資人「撣胸頓足」。假設這位投資人在 10 月份股價起漲之前買進。短短三個月的期間內，股價由低點$13\
    \ 上漲到高點$27^{7}\\div 8，漲幅超過 100%。在股價上漲過程中，這位投資人認為股票交易只不\n\n![](img/843a88de0b50d7a36e65238281a4e722_483_0.png)\n\
    \n圖 21.2 典型的複雜頭肩反轉型態。整個排列相當平緩圓滑，左右各有兩個肩部，只有一個頭部。成交量也呈現正常的下降趨勢。\n\n過是一場簡單的遊戲，頗有「手到擒來」的感覺。\n\
    \n第一個左肩的價格為$27 7/8，然後回檔到$22。這位投資人對於回檔走勢自然感覺懊惱萬分，或許對自己承諾：「只要股價回到原先的高點，我一定賣出。」\n\
    \n1 月初，價格突然暴漲，在$27 1/2形成一個小型峰位。由於漲勢非常兇猛，這位投資人認為，既上漲力道如此犀利，似乎沒有賣出的道理。他的看法沒錯。走勢稍做回檔整理之後，又向上攀升，創$28\
    \ 5/8的高價。一旦頭部完成之後，情況就開始不對勁了。他顯然被一些網路類股的走勢迷惑，誤以為這支股票都可以在一年之內輕鬆上漲到$35 或$40。\n\n\
    價格畫出圓弧狀的頭部，緩步下跌。這波跌勢由第一個右肩下滑，停頓於左側兩肩所夾谷底的稍上方，做出最後一波上攻行情，於$27½形成第二個右肩。截至目前爲止，股票有幾個理想的賣出機會，這位投資人是否能夠掌握機會呢？或許不能，因爲他太樂觀，始終認爲股價能夠突破壓力而創新高，沒有看到潛在的複雜頭肩頂已經隱約成形。\n\
    \n一旦價格跌破頸線，發生正式暴跌之前，這位投資人大約只有兩天的時間可以採取行動。第三天的收盤價爲$23，接近當天的盤中低價。然後，股價很快下跌到低價$15，距離當初的買價只有$2\
    \ 或$3。就在這個時候，他終於放棄了。當然，股票幾乎賣在最低點；一年之後，股價回升到$30 附近。\n\n### 辨識準則\n\n先前提到的初學投資人，如何辨識這種空頭反轉排列呢？表\
    \ 21.1 列示複雜頭肩頂型態的辨識準則。\n\n請參考圖 21.3 的另一個多肩類型複雜頭肩頂。走勢圖的最左端剛完成一個頭肩頂排列，價格向下突破而展開跌勢，在\
    \ 7 月初見底之後，股價回升而開始另一個新的頭肩頂排列：複雜的型態。如果只考慮排列最內側的頭肩頂，其形狀看起來類似圓形頂。價格轉折非常平滑，這是複雜頭肩頂的頭部特質。當然，平坦狀頭部也是多肩類型的常見現象（例如圖\
    \ 21.2）。\n\n# 表 21.1 複雜頭肩頂排列的辨識特質\n\n| 特質 | 討論 |\n| :--- | :--- |\n| 形狀 | 多肩或多頭的頭肩頂排列（在很罕見的情況下，也可能同時出現多肩與多頭）。頭的價位高於肩部，但差距通常不大。\
    \ |\n| 對稱性 | 以頭部為中心，排列呈現明顯的左、右對稱性。不論是肩部的價位，或肩部與頭的時間距離，大約都彼此對應。另外，左、右兩邊的肩部形狀也大致相同，都呈現圓滑或尖銳的結構。\
    \ |\n| 成交量 | 一般來說，左半邊的成交量大於右半邊。整體成交量型態呈現下降趨勢。 |\n| 頸線 | 銜接左側肩部最低谷底與右側肩部最低谷底，這條直線即是頸線。一旦價格向下穿越頸線，代表突破訊號。\
    \ |\n| 向下突破 | 收盤價向下穿越頸線，即是向下突破。如果頸線朝右下方傾斜的角度過大，把最低谷底視為突破點。 |\n\n我們可以將圖 21.3 的排列分爲兩部分，暫時不理会外側的肩部，只考慮常態的頭肩頂型態，這是辨識複雜頭肩頂的最容易方法。首先找到正規的頭肩頂，然後向兩側延伸，納入其他的肩部。在這個例子中，頭部突出於肩部之上，兩側肩部與頭部的距離相等或幾乎相等。左右兩側對應肩部的價位大約相同。所以，複雜頭肩頂的左右對稱程度，更超過正規頭肩頂。\n\
    \n對於常態的頭肩頂排列，某個肩部的價位可能高於另一肩部，或某個肩部與頭部之間的距離可能超過另一個肩部。複雜頭肩頂通常不會如此；換言之，對稱性是更重要的辨識特質。\n\
    \n關於外側的肩部，左右對應肩部的價格應該相等，它們與頭部之間的距離也應該相同。在圖 21.3 中，標示爲「左肩 1」與「右肩 1」的兩個峰值屬於相同排列的肩部，雖然它們與頭部的距離較遠。\n\
    \nBrinker International（餐廳，NYSE，代碼 EAT）\n\n![](img/843a88de0b50d7a36e65238281a4e722_486_0.png)\n\
    \n圖 21.3 形狀更圓滑的複雜頭肩頂排列。「左肩 1」與「右肩 1」之間的排列可以視為內側頭肩頂，這個頭肩頂本身看起來是一個圓形頂。\n\n如果把內側兩個左肩與兩個右肩都視爲頭部的一部分，這個排列則是常態的頭肩頂：左肩\
    \ 1 / 圓形頂（由 5 個轉折高點構成）/ 右肩 1。甚至由這個角度繪製的頸線，也提供顯著的支撐功能，曾經多次受到觸及，最後才在單日 4 點的重挫走勢下跌破。\n\
    \n如果把成交量柱狀圖放大，就可以發現左側的成交量稍微大於右側，至少內側排列是如此（標示為「頸線」的部分）。這屬於複雜頭肩頂排列的典型現象，大約有三分之二的案例是如此。\n\
    \n銜接左右兩側最低谷底的頸線，其代表的意義與常態頭肩頂相同。價格一旦跌破頸線，稱為「向下突破」，通常會發生後續的跌勢。成交量在突破過程通常會放大，甚至持續發生幾天的大成交量，這取決於跌勢的嚴重程度。\n\
    \n### 失敗案例\n\n複雜頭肩頂有兩種失敗類型，兩者都很罕見。圖 21.4 顯示第一種類型。我把向下突破定義爲收盤價跌破頸線，如果頸線向下傾斜的角度過大，則定義爲收盤價跌破肩部最深谷底。在圖\
    \ 21.4 中，只有 5 月 8 日的盤中價格一度穿越頸線，但當天價格收在頸線之上。接著，股價持續走高，直接向 上穿越頭肩頂的最高價，潛在型態宣告失敗。\n\
    \n排列本身的結構相當不錯。兩個頭部大約位在相同水準，兩肩的價格也大約相等。左右對稱的程度看起來很好，兩肩距離頭部的距離大約相同。成交量型態也很正常，左肩的量大於右肩。可是，第二個頭部出現之後，下跌過程出現大量，這點有些不尋常。總之，預先沒有任何徵兆顯示這個排列將失敗。\n\
    \n圖 21.5 顯示另一種失敗類型，這個多肩的複雜型態比較缺乏對稱性，兩側對應肩部與頭部之間的時間距離有些差異。\n\nUAL Corp.（空運，NYSE，代碼\
    \ UAL）\n\n![](img/843a88de0b50d7a36e65238281a4e722_488_0.png)\n\n圖 21.4 不屬於反轉型態的複雜頭肩頂。價格向下穿越頸線之前，先向上穿越排列的頭部。\n\
    \n這個複雜頭肩頂雖然向下突破，但沒有發生持續性的跌勢。11月底，單日之內發生 2 點的跌勢，直接貫穿頸線，但隨後的上身擴張楔形雖然也是空頭排列，向下突破之後卻沒有發生重大跌勢。幾個月之後，股價又創新高。\n\
    \n在這個例子中，價格跌破頸線之後，必須下跌到$49^{5/8} 才滿足 5%的跌幅，但實際的最低價遠高於此。所以，這是一個 5%失敗的案例。\n\n這個排列是否有任何徵兆足以預先顯示失敗的可能性？整個排列的發展過程中，成交量相當平坦，沒有萎縮的現象。\n\
    \n![](img/843a88de0b50d7a36e65238281a4e722_489_0.png)\n\n![](img/843a88de0b50d7a36e65238281a4e722_489_1.png)\n\
    \n圖 21.5 複雜頭肩頂的另一種失敗類型。價格向下穿越頸線之後，沒有發生 5%以上的跟進跌勢。11 月底與 12 月份期間，出現上升擴張楔形排列。\n\n\
    可是，成交量呈現下降趨勢並不是必要條件，我不認為目前這個例子有什麼不尋常之處。總之，我看不出來這個排列爲什麼失敗。進一步研究基本面的情況，或許可以找到一些線索。\n\
    \n### 統計數據\n\n圖 21.4 與 21.5 代表兩種失敗的可能性，但這些現象畢竟不經常發生。請參考表 21.2，在 141 個案例中，總共只有\
    \ 11 個 5% 失敗排列；換言之，成功率有 92%左右。在所有的案例中，\n\n# 表 21.2 複雜頭肩頂排列的一般統計數據\n\n| 說明 | 統計數據\
    \ |\n| --- | --- |\n| 排列數量： | 141 個 |\n| 1991 年~1996 年的 500 支股票 |  |\n| 反轉或整理排列\
    \ | 15 個整理，126 個反轉 |\n| 失敗率 | 11/141 相當於 8% |\n| 成功排列的平均跌幅 | 27% |\n| 最經常發生跌幅\
    \ | 20% |\n| 成功排列中，符合或超越目標價位者 | 87/130 相當於 67% |\n| 排列平均長度 | 3 個月 (83 天) |\n|\
    \ 成交量呈現下降趨勢的成功排列數量 | 89/141 相當於 63% |\n| 頸線向下 / 向上傾斜的平均漲幅 | 27% / 26% |\n| 遠邊左肩\
    \ / 遠邊右肩價位較高的平均漲幅 | 28% / 27% |\n\n附註：相對於常態頭肩頂，複雜頭肩頂的發展需要耗費較長的時間，平均跌幅也較重。\n\n\
    大約九成的排列屬於反轉型態；一旦價格向下突破之後，通常繼續出現 5%以上的跟進跌勢。價格平均跌幅為 27%。\n\n目前這個排列的最經常跌幅有些難以決定。請參考圖\
    \ 21.6 的次數分配，橫軸刻度取 10%為單位，所顯示的最經常發生跌幅為 20%。如果橫軸刻度取 5%為單位，則 10%到 30%欄位\n\n![](img/843a88de0b50d7a36e65238281a4e722_491_0.png)\n\
    \n的發生次數都大約相同。\n\n「交易戰術」一節會詳細討論目標價位的衡量方法，原 則是取排列的高度，由突破點向下衡量，結果就是突破之後 的最低目標價位。複雜頭肩頂的目標價位達成率爲\
    \ 67%，低 於我設定的 80%最低門檻；所以，就操作角度來說，應該謹 慎看待目標價位。\n\n排列完成的時間平均爲 83 天，較常態排列（62 天）稍長。\
    \ 這個結果似乎很合理，因爲發展另一組肩或另一個頭需要耗費 時間。\n\n大約有三分之二排列（63%）的成交量型態呈現下降趨勢。針對排列的成交量時間序列進行迴歸分析，迴歸直線的斜率確實為負數，顯示成交量隨著時間經過而下降。\n\
    \n某些分析師認爲，頸線向下傾斜具有空頭意涵。我發現情況確實如此，但跌幅差距不具有統計上的顯著意義（頸線向下傾斜案例的平均跌幅爲 27%，頸線向上傾斜案例的平均跌幅爲\
    \ 26%）。比較過程中，我分別利用兩側肩部的較深谷底銜接爲頸線。\n\n同理，如果左肩價位較高（就對應的右肩而言），排列具有空頭意涵。同樣地，我的統計研究也支持這種觀點。左肩較高的排列平均跌幅爲\
    \ 28%，右肩較高的平均跌幅爲 27%。這方面的比較，是採用最外側的肩膀爲基準。由於兩種情況的平均跌幅差距很小，很可能不代表任何意義。\n\n表 21.3\
    \ 顯示突破的統計數據。向上突破的案例總共只有 3 個，其餘的 138 個都是向下突破（佔 98%）。向下突破之後，價格沒有出現 5%以上跟進跌勢的排列視爲失敗。這類\
    \ 5%失敗案例共有 8 個（佔 6%）。\n\n回升走勢——價格跌破頸線之後，在 30 天之內重新回升到頸線的走勢——的發生頻率很高，共有 88 個（64%）。這意味著，如果你沒有掌握向下突破的訊號，還可以寄望稍後發生的回升走勢，出脫手中的持股，或在更高價位放空。當然，如果沒有發生回升走勢，那就另外尋找交易對象。不論買進或放空，千萬不要追價，因爲風險\
    \ / 報酬關係已經朝不利方向發展。\n\n# 表 21.3 複雜頭肩頂排列突厥的統計數據\n\n| 說明 | 統計數據 |\n| :--- | :---\
    \ |\n| 向上突厥 | 3/141 或 2% |\n| 向下突厥 | 138/141 或 98% |\n| 向下突厥的 5%失敗案例 | 8/138 相當於\
    \ 6% |\n| 回升 | 88/138 相當於 64% |\n| 完成回升走勢的平均期間 | 10 天 |\n| 對於成功的排列，突厥與最終低點的相隔時間\
    \ | 3.5 個月(110 天) |\n| 突厥點位在最近 12 個月價格區間的下緣、中央或上緣 | 下緣 6%<br>中央 47%<br>上緣 48%\
    \ |\n| 前述突厥位置的平均跌幅 | 下緣 22%<br>中央 28%<br>上緣 26% |\n| 相對於突厥前一天，突厥當天與隨後 5 天的成交量\
    \ | 175%，170%，138%，<br>120%，112%，106% |\n\n附註：絕大部分（98%）的頂排列都向下突厥。\n\n回升走勢拉到頸線的平均期間爲\
    \ 10 天。很多回升走勢完成於突厥之後的幾天內。少數超過 20 天以上的離群值，使得平均期間向上扭曲。\n\n平均而言，排列向下突厥之後，需要花費 3½個月的時間才能到達最終低點。就表\
    \ 21.2 的統計數據顯示，排列的宽度愈大，突厥之後的跌勢愈凶，需要花費較長的時間到達最終低\n"
  mdcn: "\n## 交易範例\n\n  凱莉不是一位單純的家庭主婦。先生把薪水帶回家，她除了負責一般的預算之外，還打點相關的投資。\n\n  她有多年的投資經驗，金融交易已經成爲日常生活的一部分。處理家庭瑣碎工作的閒暇之餘，她經常盯著電腦螢幕，觀察一些統計數據與可能的購併案，而且還可以讓女兒敲著鍵盤玩耍。\n\
    \n  經過多年的努力之後，她把微薄的儲蓄累積爲六位数字的投資組合。整個過程非常不簡單，遭逢許多痛苦的錯誤，但她把這些失敗視爲學習經驗。\n\n  當凱莉看見圖\
    \ 20.7 的走勢圖，覺得非常有趣。她並不打算放空這支股票，因爲紙上模擬的放空操作績效始終不理想。雖說如此，她還是繼續追蹤這支股票的發展。\n\n  這支股票起源於\
    \ 1993 年 5 月份，沿著平緩的上升趨勢線發展，一直到 1994 年 1 月底才發生顯著的跌勢。股價跌到 $26\\frac{1}{2}$ 才向上反彈，跌幅雖然不足\
    \ 3 點，但走勢已經展現疲態。凱莉密切觀察行情的演變，當頭部出現時，她在筆記上記錄頭肩頂排列的可能性。隨後的發展證明她的感覺正確。\n\n  股價由頭部下滑的幅度很大，有些超出凱莉的預期，但很快就向上反彈，右肩峰位的高點大約等於左肩。沿著三個峰位所夾的兩個谷底繪製頸線，她覺得頸線的傾斜角度太陡峭，不適用於衡量目標價位。於是，她採用替代方法，衡量的目標價位為\
    \ $28^{7/8}$。這個價位似乎也不對勁。接著，她衡量頭部高點到頭部與右肩所夾谷底的距離，由該谷底低點向下衡量前述距離，結果是 $21^{7/8}$。這個價位可以回溯到前一年\
    \ 7 月份的水準，看起來似乎頗爲合理。\n\n  可是，感覺上還是怪怪的，所以凱莉不打算交易。這個時候，有人按門鈴，她起身應門，讓女兒獨自留在電腦前面。不久，電話鈴響了，她的經紀人打電話過來回報空單。凱莉趕快跑到電腦旁，看見女兒站在椅子上，敲著鍵盤，綻露一臉笑容，帶著些微的惡意。凱莉希望這一切只是自己疑神疑鬼，但顯然不是如此。她已經建立空頭部位，在\
    \ $31$ 放空股票。\n\n  凱莉有些擔心，但稍做研究之後，還是決定保留這個部位。放空的數量只有 100 股，勉強還能夠應付。不久，價格開始下跌，一直到頸線附近才獲得支撐而反彈，當價格向上穿越頭與右肩所夾谷底的低點，凱莉有點在意。接著，出現幾天的橫向盤整。根據凱莉的盤算，如果這波反彈代表另一段漲勢的開始，她準備在\
    \ $29$ 回補。所以，如果股價繼續上漲，這個空頭部位在 $29$ 回補之後還有些微獲利；反之，如果股價下跌，她可以繼續保有空頭部位。\n\n  兩個星期之後，終於有了答案。股價連跌五天，然後又快速反彈，但反彈走勢沒有觸及先前的高點。由於價格波動轉劇，凱莉覺得有些受不了，決定在先前的低點附近回補。結果，她在\
    \ $22\\%$ 回補空頭部位，股價隨後下跌到 $20$ 附近。扣掉佣金費用之後，這筆交易獲利 $25\\%$。凱莉送給女兒一個特大號的親吻做爲獎賞。\n\
    \n# 21 複雜頭肩頂排列\n\n![](img/843a88de0b50d7a36e65238281a4e722_479_0.png)\n\n### 摘要資料\n\
    \n- **外觀**：多個肩 / 多個頭的頭肩頂排列。\n- **反轉或整理**：短期（3 個月以內）的空頭反轉排列。\n- **失敗率**：8%。\n-\
    \ **平均跌幅**：27% ，最經常發生跌幅爲 20% 。\n- **成交量趨勢**：下降趨勢。\n- **回升**：64%。\n- **價格目標達成率**：67%。\n\
    - **意外發現**：頭線向下傾斜或左肩價位較高，續效稍微理想。\n- **參閱排列**：（13）雙重頂排列，（20）頭肩頂排列，（23）雙角頂排列，（35）圓形頂排列，（43）三重頂排列。\n\
    \n除了外觀以外，常態頭肩頂與複雜頭肩頂（complex head-and-shoulders tops）之間幾乎沒有差別。只要加上一個頭或幾個肩，常態排列就演變爲複雜型態。兩種排列本身的成交量都呈現下降趨勢。左側肩部的成交量通常大於右側的對應肩部。\n\
    \n複雜頭肩頂的失敗率很低（8%），但稍高於常態頭肩頂（7%）。突破之後的回升走勢發生頻率也稍微提高，大約每三個案例就會發生一次。\n\n平均跌幅爲 27%，在空頭排列內屬於偏高水平。可是，最經常發生跌幅只稍高於均勻分布，介於\
    \ 10%到 30%之間（跌幅單位刻度爲 5%）。\n\n頸線與肩部高度有兩個意外發現。頸線向下傾斜的排列，績效稍優於頸線向上傾斜，前者的平均跌幅爲 27%，後者爲\
    \ 26%。同樣地，最外側左肩高度超過對應的右肩，平均跌幅爲 28%；反之，最外側右肩高度超過對應的左肩，平均跌幅爲 27%。可是，這兩種情況的績效差異都不存在統計上的顯著意義（換言之，可能純屬巧合）。\n\
    \n### 緣起\n\n複雜頭肩頂排列有兩種基本的類型，請分別參考圖 21.1 與 21.2。在圖 21.1 內，頭肩頂排列發生在一個長期多頭行情的末端。這個多頭行情起始於\
    \ 1992 年 11 月的低點$15¼，1995 年 7 月中旬出現$36⁵⁄₈的峰位，10 月中旬向下修正到$28⁵⁄₈，\n\n![](img/843a88de0b50d7a36e65238281a4e722_481_0.png)\n\
    \n![](img/843a88de0b50d7a36e65238281a4e722_481_1.png)\n\n圖 21.1 兩個頭的複雜頭肩頂排列。左肩與第一個頭構成三波段衡量漲勢。兩個「頭」本身呈現雙角頂排列。第二個頭與右肩構成三波段衡量跌勢，雖然有些拖泥帶水。\n\
    \n然後向上反彈而開始形成頭肩頂。反彈走勢完成左肩之後，在$31~$32 呈現橫向盤整，又突然向上展開三波段衡量走勢（measured move；譯按：這段走勢應該由$31\
    \ 到$35¼，對等於左肩出現之前的漲勢距離$28⅝~$33⅛）。這波衡量漲勢距離上檔目標大約差$1 左右，轉折高點即是排列的第一個頭部。\n\n稍微回檔之後，股價又回升到原先高點，做出第二個頭部。價格由第二個頭部下滑，跌勢在左肩底部獲得支撐，向上反彈形成右肩。隨後的跌勢貫穿頸線——銜接兩肩谷底的直線——但很快又拉回到頸線之上。這波回升走勢在$32\
    \ 附近被壓回，然後直接下跌到$28^{37}\\div 8。\n\n針對兩肩之間的成交量時間序列進行迴歸分析，結果顯示成交量確實呈現下降趨勢。這種現象在圖\
    \ 21.1 內雖然不明顯，但大約三分之二的複雜頭肩頂排列都具有這種特質。\n\n圖 21.1 的兩個頭部看起來似乎是雙重頂排列（double tops），實際不然，理由有幾點。首先，兩個峰位的時間距離太接近。對於標準的雙重頂來說，兩個峰位至少必須相隔\
    \ 1 個月（我個人可以接受時間距離較近的兩個頭部）。另外，按照雙重頂的定義，兩個峰位所夾谷底的回檔幅度必須介於 15% 到 20% 之間。目前這個例子中，回檔幅度大約是峰位的\
    \ 5%，差距太大。\n\n除此之外，排列內的兩個峰位也可以看成雙角頂型態（horn top），但目前的主題是複雜頭肩頂。事實上，技術分析經常發生這類現象：由不同的角度觀察某個價格走勢圖，你所看到的型態往往不同。對於圖\
    \ 21.1 的走勢圖，有些人或許看到一組三波段衝量走勢（measured moves；一個漲勢接著另一個跌勢），另一些人或許看見雙角頂，但最後的結論大致相同——都是空頭意涵的排列。\n\
    \n圖 21.2 是另一種類型的複雜頭肩頂排列：一個頭與數個肩，屬於比較常見的類型。這種技術型態會讓初學投資人「撣胸頓足」。假設這位投資人在 10 月份股價起漲之前買進。短短三個月的期間內，股價由低點$13\
    \ 上漲到高點$27^{7}\\div 8，漲幅超過 100%。在股價上漲過程中，這位投資人認為股票交易只不\n\n![](img/843a88de0b50d7a36e65238281a4e722_483_0.png)\n\
    \n圖 21.2 典型的複雜頭肩反轉型態。整個排列相當平緩圓滑，左右各有兩個肩部，只有一個頭部。成交量也呈現正常的下降趨勢。\n\n過是一場簡單的遊戲，頗有「手到擒來」的感覺。\n\
    \n第一個左肩的價格為$27 7/8，然後回檔到$22。這位投資人對於回檔走勢自然感覺懊惱萬分，或許對自己承諾：「只要股價回到原先的高點，我一定賣出。」\n\
    \n1 月初，價格突然暴漲，在$27 1/2形成一個小型峰位。由於漲勢非常兇猛，這位投資人認為，既上漲力道如此犀利，似乎沒有賣出的道理。他的看法沒錯。走勢稍做回檔整理之後，又向上攀升，創$28\
    \ 5/8的高價。一旦頭部完成之後，情況就開始不對勁了。他顯然被一些網路類股的走勢迷惑，誤以為這支股票都可以在一年之內輕鬆上漲到$35 或$40。\n\n\
    價格畫出圓弧狀的頭部，緩步下跌。這波跌勢由第一個右肩下滑，停頓於左側兩肩所夾谷底的稍上方，做出最後一波上攻行情，於$27½形成第二個右肩。截至目前爲止，股票有幾個理想的賣出機會，這位投資人是否能夠掌握機會呢？或許不能，因爲他太樂觀，始終認爲股價能夠突破壓力而創新高，沒有看到潛在的複雜頭肩頂已經隱約成形。\n\
    \n一旦價格跌破頸線，發生正式暴跌之前，這位投資人大約只有兩天的時間可以採取行動。第三天的收盤價爲$23，接近當天的盤中低價。然後，股價很快下跌到低價$15，距離當初的買價只有$2\
    \ 或$3。就在這個時候，他終於放棄了。當然，股票幾乎賣在最低點；一年之後，股價回升到$30 附近。\n\n### 辨識準則\n\n先前提到的初學投資人，如何辨識這種空頭反轉排列呢？表\
    \ 21.1 列示複雜頭肩頂型態的辨識準則。\n\n請參考圖 21.3 的另一個多肩類型複雜頭肩頂。走勢圖的最左端剛完成一個頭肩頂排列，價格向下突破而展開跌勢，在\
    \ 7 月初見底之後，股價回升而開始另一個新的頭肩頂排列：複雜的型態。如果只考慮排列最內側的頭肩頂，其形狀看起來類似圓形頂。價格轉折非常平滑，這是複雜頭肩頂的頭部特質。當然，平坦狀頭部也是多肩類型的常見現象（例如圖\
    \ 21.2）。\n\n# 表 21.1 複雜頭肩頂排列的辨識特質\n\n| 特質 | 討論 |\n| :--- | :--- |\n| 形狀 | 多肩或多頭的頭肩頂排列（在很罕見的情況下，也可能同時出現多肩與多頭）。頭的價位高於肩部，但差距通常不大。\
    \ |\n| 對稱性 | 以頭部為中心，排列呈現明顯的左、右對稱性。不論是肩部的價位，或肩部與頭的時間距離，大約都彼此對應。另外，左、右兩邊的肩部形狀也大致相同，都呈現圓滑或尖銳的結構。\
    \ |\n| 成交量 | 一般來說，左半邊的成交量大於右半邊。整體成交量型態呈現下降趨勢。 |\n| 頸線 | 銜接左側肩部最低谷底與右側肩部最低谷底，這條直線即是頸線。一旦價格向下穿越頸線，代表突破訊號。\
    \ |\n| 向下突破 | 收盤價向下穿越頸線，即是向下突破。如果頸線朝右下方傾斜的角度過大，把最低谷底視為突破點。 |\n\n我們可以將圖 21.3 的排列分爲兩部分，暫時不理会外側的肩部，只考慮常態的頭肩頂型態，這是辨識複雜頭肩頂的最容易方法。首先找到正規的頭肩頂，然後向兩側延伸，納入其他的肩部。在這個例子中，頭部突出於肩部之上，兩側肩部與頭部的距離相等或幾乎相等。左右兩側對應肩部的價位大約相同。所以，複雜頭肩頂的左右對稱程度，更超過正規頭肩頂。\n\
    \n對於常態的頭肩頂排列，某個肩部的價位可能高於另一肩部，或某個肩部與頭部之間的距離可能超過另一個肩部。複雜頭肩頂通常不會如此；換言之，對稱性是更重要的辨識特質。\n\
    \n關於外側的肩部，左右對應肩部的價格應該相等，它們與頭部之間的距離也應該相同。在圖 21.3 中，標示爲「左肩 1」與「右肩 1」的兩個峰值屬於相同排列的肩部，雖然它們與頭部的距離較遠。\n\
    \nBrinker International（餐廳，NYSE，代碼 EAT）\n\n![](img/843a88de0b50d7a36e65238281a4e722_486_0.png)\n\
    \n圖 21.3 形狀更圓滑的複雜頭肩頂排列。「左肩 1」與「右肩 1」之間的排列可以視為內側頭肩頂，這個頭肩頂本身看起來是一個圓形頂。\n\n如果把內側兩個左肩與兩個右肩都視爲頭部的一部分，這個排列則是常態的頭肩頂：左肩\
    \ 1 / 圓形頂（由 5 個轉折高點構成）/ 右肩 1。甚至由這個角度繪製的頸線，也提供顯著的支撐功能，曾經多次受到觸及，最後才在單日 4 點的重挫走勢下跌破。\n\
    \n如果把成交量柱狀圖放大，就可以發現左側的成交量稍微大於右側，至少內側排列是如此（標示為「頸線」的部分）。這屬於複雜頭肩頂排列的典型現象，大約有三分之二的案例是如此。\n\
