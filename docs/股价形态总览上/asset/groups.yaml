    reversal）的走勢，但小莉不敢確定。所以，她決定暫時不採取行動，但希望在恰當的時機建立空頭部位。她密切留意盤勢的發展；6 月下旬，當收盤價向下貫穿$61
    的支撐，她進場放空股票，成交價格爲$59。


    隔天，她發現走勢出現一個很大的竭盡缺口，收盤價暴跌到$49，帳面獲利一夜之間就累積爲$10,000。由於這個缺口相當於迴光返照型態起點的重挫走勢，所以小莉調整交易戰術，沒有立即結束部位。她看著股價向上反彈一天，然後又繼續下跌，完全按照迴光返照的劇本演出。不久，整個跌勢逐漸趨緩，她決定不要太貪心，於是回補股票，在$45
    結束空頭部位，兩個星期之內獲利$14,000。


    如果你認爲小莉的運氣很好，在 10 多個工作天內賺取$21,000 的利潤，你的看法或許沒錯。可是，她有能力正確評估投資機會，斷然進場，並且採取必要的防範措施，顯然不完全仰賴運氣，其中也涉及技巧。


    小莉是一位態度嚴肅的投資人，採取任何行動之前，總是儘可能預做周全的準備。她不是在某些書籍中看到價格缺口的介紹，就立即跳入市場。事實上，她曾經深入研究，透過紙上操作的磨練，預先設計一套成功機會很大的交易系統，然後才實際進場。


    ## 吊人線形


    ![](img/843a88de0b50d7a36e65238281a4e722_399_0.png)


    ### 摘要資料


    #### 向上突破


    - 外觀：開盤價與收盤價大致相同，位在最高價附近，曾經出現顯著的盤中低價。（譯按：就陰陽線的角度說，線形實體很小，沒有或幾乎沒有上影線，下影線很長。）

    - 反轉或整理：短期的（少於 3 個月）多頭反轉排列。

    - 失敗率：原本應該向下降破，但有 67%的案例向上突破。5%失敗案例有 11%。

    - 平均漲幅：40%，最經常發生漲幅 10%。


    #### 向下降破


    - 外觀：開盤價與收盤價大致相同，位在最高價附近，曾經出現顯著的盤中低價。（譯按：就陰陽線的角度說，線形實體很小，沒有或幾乎沒有上影線，下影線很長。）

    - 反轉或整理：短期的（少於 3 個月）空頭整理排列。

    - 失敗率：不適用，原本應該向下突破。5%失敗案例有 22%。

    - 平均跌幅：16%，最經常發生跌幅介於 5%與 10%之間。


    吊人排列（hanging man）實際上是取自陰陽線型態。關於這個線形的運作，主要有兩套理論。根據第一套理論的說法，如果價格收在最高價「附近」（不論「附近」的定義如何），隔天有
    80% 的機會看到更高的盤中最高價。請參考本章稍後討論的「統計數據」，我發現這種情況發生的百分率只不過介於 55% 到 57% 之間。這套理論或許比較適用於普通股之外的其他證券。對於普通股的隔夜部位來說，隔天有
    55% 的機會看到更高的盤中最高價，機會稍高於投擲銅板；可是，由於股價趨勢原本就存在向上的偏頗，如果把這一點考慮進去，55% 的機會與純粹的巧合幾乎沒有什麼差別。


    另一套理論的說法如下：在延伸性上升趨勢中，如果某天的開盤價與收盤價非常接近盤中最高價，而且當天的股價曾經顯著下滑，這種吊人線形具有空頭意涵，意味著趨勢將向下反轉。可是，根據「摘要資料」的數據顯示，吊人線形的成功機會大約只有三分之一；換言之，失敗率高達
    67%——相當令人失望。


    如果由更傳統的角度來觀察失敗率，結果好得多。吊人線發生之後，向上突破的案例中，只有 11% 發生 5% 失敗情況；換言之，沒有出現 5% 跟進漲勢之前，價格就向下反轉。反之，向下突破的排列中，發生
    5% 失敗情況的案例佔 22%，超過我認爲可以接受的最高失敗率 20%。


    吊人線形向上突破的平均漲幅爲 40%，非常好，但最經常發生漲幅只有 10%，相對不理想。對於向下突破，平均跌幅爲 16%，最經常跌幅介於 5% 與 10%
    之間。如果你決定操作向下突破的吊人線形，不該預期發生很大的價格走勢。


    ### 緣起與辨識準則


    表 17.1 列示吊人線形的辨識準則。這種線形需要考慮每天的四個價格：開盤、最高、最低與收盤價。開盤價、最高價與收盤價完全相同。這意味著當天長條圖的上端為水平小橫畫，線形結構類似英文字母
    T*。


    盤中最低價必須顯著低於盤中最高價。按照我的解釋，「顯著低於」是指 5%或以上的價差而言。當然，這是任意設定的參數，但必須能夠篩選足夠數量的樣本，使得統計數據具有意義。如果你認為
    5%太大或太小，可以設定其他數據。可是，把 5%更改為 2.5%或 7.5%，結果都不會出現重大差別；即使採用 10%的參數水準，失敗率也只不過由 59%上升為
    75%。不論如何調整，失敗率還是很高，遠超過 20%的高限。


    挑選吊人反轉線形的最後一個準則，是它必須發生在價格上升趨勢中。由於此處所處理的是單一線形，所以我不認為當時的價格趨勢需要很大。換言之，只要當時呈現明顯的漲勢，就已經足夠了。


    請參考圖 17.1，其中標示一些吊人線形。在這份走勢圖中，每天的線形只採用最高價／最低價／收盤價，沒有採用開盤價。可是，凡是以黑點標示的線形，開盤價也等於最高價——真正的吊人線形。


    > * 譯按：根據一般的定義，只要線形實體很小而下影線很長，就稱為吊人線形。可是，根據此處的定義，吊人線形不能存在實體；換言之，必須是下影線很長而沒有上影線的十字線。套用陰陽線的術語，這就是蜻蜓十字線。


    表 17.1


    ### 吊人線形的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 開盤=最高=收盤 | 當天的開盤價、最高價與收盤價必須相同。如果走勢圖採用開盤 / 最高 / 最低 / 收盤等價格，當天的線形類似英文字母 T。 |

    | 顯著較低的最低價 | 盤中最低價必須顯著低於盤中最高價；這意味著兩個價格的差距必須至少 5%。 |

    | 發生在上升趨勢 | 這個線形必須發生在價格上升趨勢中。 |


