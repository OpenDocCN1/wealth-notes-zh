    # 表 11.1  菱形排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 先前趨勢 | 菱形頂發生之前的價格趨勢朝上，菱形底發生之前的價格趨勢朝下。根據定義，菱形排列可以發生在任何位置，不一定在價格走勢圖的頭部或底部。 |

    | 菱形 | 前半部的價格擺動向外擴張（轉折高點持續墊高，轉折低點持續下滑）；後半部的價格擺動向內收斂（轉折高點持續下滑，轉折低點持續墊高）。銜接轉折高點與轉折低點的趨勢線構成菱形狀。菱形不一定需要左右或上下對稱。
    |

    | 成交量趨勢 | 排列發展過程中，成交量呈現下降趨勢。 |

    | 突破量 | 通常大量突破，而且隨後幾天仍然維持大量。 |

    | 支撐與壓力 | 排列發生位置經常代表支撐或壓力。頭部排列的支撐／壓力经常在排列上端，底部排列的支撐／壓力经常在排列下端。支撐與壓力通常能夠持續一年以上。
    |


    圖 11.3 的菱形頂也是一個頭肩頂排列（head-and-shoulder top），左肩／頭部／右肩的位置請參考圖形標示。成交量也是頭肩頂的標準型態，右肩的成交量遠小於左肩與頭部。


    如果你發現某個菱形頂排列也可以解釋為頭肩頂排列，不用擔心，兩者都具有空頭意涵。關於突破之後的目標價位衡量，則挑選兩個可能型態中較保守的水準。


    菱形頂提供的支撐／壓力經常發生在排列頭部的上緣，請參考圖 11.4。價格走勢經過菱形頂排列而向下反轉之後，隨後發生於 1993 年 3 月／4 月的漲勢在此遭受壓力而折返。這個壓力水準持續到一年之後才被貫穿。'
