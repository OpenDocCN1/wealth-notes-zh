    **圖 3.3 兩個下降擴張排列。** 在第一個排列中，價格跌勢曾經在過去的低點支撐觸及下側趨勢線，然後向上反彈。第二個排列中出現部分漲勢，這種走勢經常發生在向下突破之前。另外，價格向下突破之後，反彈走勢在下側趨勢線遭逢壓力；克服這個壓力之後，隨後漲勢又在先前的上側趨勢線遭逢壓力。


