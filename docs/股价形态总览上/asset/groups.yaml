    圖 8.7 BARR 頭部反轉排列。趨勢線、警戒線與賣出線。這個案例有很充裕的時間獲利了結。1991 年底，股票創$17½的低價，1993 年 7 月份出現的跌勢，由賣出點起算下跌
    40%。另外，在 1994 年 7 月份到 9 月份之間，出現雙重頂。


    圖 8.7 顯示 BARR 趨勢線與另外兩條平行趨勢線：警戒線與賣出線。警戒線與 BARR 趨勢線或賣出線之間所夾的距離都是前奏階段高度。這是一份週線圖，BARR
    排列的走勢比較平緩。如果你持有圖 8.7 的股票，而且價格向下觸及賣出線的時候出場，顯然不能賣在最高點。可是，你也因此避開隨後發生的 40%跌勢。這段跌勢也凸顯股票交易的一項特質：獲利很容易，但保有獲利則很困難。


    圖 8.7 也可以用來說明目標價位的衡量法則，這個法則顯示向下突破之後的最低目標價位。在我進行的研究中，每 10 個 BARR 頭部案例就有 9 個滿足目標價位。


    讓我們說明目標價位的計算過程。把排列期間劃分為四等分，計算第一部分最高價到 BARR 趨勢線之間的寬度，這就是前奏階段的高度。（另外也可以計算第一部分每天高價到
    BARR 趨勢線之間的距離，挑選最寬者做為前奏階段的高度。）由突破點（$25^{1/8}$）向下衡量前奏階段高度（$3^{1/2}=21^{1/2}-18$），下檔的目標價位是$21^{5/8}$（$=25^{1/8}-3^{1/2}$），完成於突破當週。


    向下突破之後，隨後的走勢一度向上攀升到趨勢線下緣，稍做測試而無法向上突破。BARR 趨勢線原本代表支撐區，但遭到突破之後就轉換為壓力：價格由下往上逼近趨勢線，經常受阻於這個壓力。事實上，1994
    年 7 月份到 9 月份之間，上升走勢在 BARR 延伸趨勢線附近形成雙重頂排列，結果向下反轉。


    ## 交易範例


    林小姐是一位圖書館管理員。每天下班回家之前，她都會上網查詢股票投資組合的狀況。9 月中旬，她發現自己所持的某支股票可能出現 BARR 頭部排列（請參考圖 8.8）。於是，她大約花了一個鐘頭的時間，在網路上查詢該公司的相關資料，包括：基本財務數據、分析師的建議、內線買賣數量與其他等等。


    她重新檢討當初買進股票的理由。彼得·林區（Peter Lynch）的投資風格對她特別有吸引力：購買你所熟悉的股票。林小姐很喜歡在連鎖雜貨店購物，如果遇到某家真正吸引她的連鎖店，就考慮投資。


    ![](img/843a88de0b50d7a36e65238281a4e722_217_0.png)


    圖 8.8 BARR 頭部反轉排列範例。隨著價格持續上漲，林小姐向上調整買點。最後，當股價向下跌上側第二條賣出線，她賣出股票。


    林小姐列印這支股票的價格走勢圖，仔細研究 BARR 排列。她沿著 7 月份到 9 月份走勢下緣繪製潛在的 BARR 趨勢線，並且把排列期間劃分為四等分，計算前奏階段的高度。然後，分別繪製警戒線與賣出線，三條趨勢線的間隔距離都是前奏階段高度。另外，她也計算向下突破之後的最低目標價位。目前（9
    月中旬）的價位是在賣出線附近（$30），下檔目標價位為$23，跌幅將近 25%。雖然她還是非常喜歡這支股票，但這種程度的跌幅確實令人緊張*。


    雖然股價還沒有向下反轉，但林小姐希望未雨綢繆，觀察過去的走勢，嘗試判斷下檔的支撐價位。第一個支撐區在$23～$24附近，這是7月份股價上漲到警戒線附近的停頓位置，剛好也是先前衡量的目標價位$23。如果股票跌破這個支撐區，接下來比較紮實的支撐區在$20到$22之間。


    上檔的潛在報酬又如何呢？股價可能上漲到哪個價位呢？目前顯然不能把歷史峰值視為壓力區，因為上檔海闊天空，股票幾乎每天都創新高價。因此，林小姐不知道如何設定上檔目標價位，只能隨意猜測一些整數價位$35、$40或$45。漲勢可能在這些價位反轉，甚至目前的$30都可能是最高價。


    經過詳細的分析之後，林小姐決定繼續持有股票。由於股價上漲的動能十足，目前還很難判斷整個漲勢將停止於何處。所以，一切只能看著辦，但她決定暫時把停損點設定在警戒線當時的價位附近（$27½）。


    > * 譯按：讀者可能覺得很奇怪，這個排列在1993年4月份才向下突破（排列完成），如何能夠在1992年9月份計算排列期間的四等分與目標價位。關於第一個問題，當時價格正處在賣出線附近，已經有效向上穿越警戒線（或一般所謂的折返線[return
    line]），意味著潛在的BARR排列可能已經進入蹦跳階段，所以能夠估計前奏階段的高度（換言之，衡量上升趨勢線與折返線之間的垂直距離）。關於目標價位，通常是由價格向下突破BARR趨勢線的位置衡量前奏階段高度。在正文的分析中，雖然當時的價位$30遠在BARR趨勢線之上，距離向下突破還有一段很長的距離，但作者還是按照當時的BARR趨勢線對應價位（大約在$25）向下衡量前奏階段高度（大約是$2），把目標價位設為$23。譯者認為，如此衡量的目標價位顯然毫無意義。


    9月底到10月初之間，股價沿著賣出線向上攀升。10月12日，股價又向上躍升。大約一星期之後，林小姐在既有的賣出線之上，繪製另一條平行賣出線，兩者的間隔距離仍然設定為前奏階段高度。她決定，如果股價向下反轉而跌破下側賣出線，就賣出股票。所以，她把停止賣單往上移到$31。可是，股價持續走高。


    10月19日，股價創$34³/₈的峰位，然後稍微拉回，在$32⁷/₈又向上回升而繼續走高。12月初，林小姐又列印一份走勢圖，並且繪製第三條賣出線，向上傾斜的角度大約是60度。她心中盤算著，整個BARR頭部排列幾乎完全按照劇本演出。


    在11月份與12月份中旬之前，股價基本上都沿著第三條賣出線發展。林小姐懷疑整個漲勢可能接近尾聲，但除非價格真的向下反轉，否則還是不能確定。所以，她決定在第二條賣出線的下側設定獲利了結的停止賣單。


    不久，股價又向上發展。大約在聖誕節之後的幾天，股價創$39⁴/₈的新高。隨後兩個星期內，股價拉回，跌破第三條賣出線，但立即向上反彈測試新高。1月15日，股價再創新高$39⁷/₈，但沒有辦法突破$40的整數價位。


    股價創新高的當天走勢，似乎是單日反轉的線形，但林小姐不能確定。兩個峰位看起來像是雙重頂，但中間的折返谷底顯然不夠深，而且兩個峰位的間距又太接近。雖說如此，整個情況還是讓林小姐感到緊張。


    幾天之後，股價跌破第二條賣出線，而且觸及當初設定的獲利了結停止賣點。是否應該賣出，或者再繼續觀望？她估計到手的獲利已經不錯，決定不要太貪心。1 月 22 日，她在$36¼賣出股票。隔天，價格上漲
    1¼點而收在$38，她有點喪氣。


    林小姐繼續追蹤這支股票的發展；往後兩個星期內，股價緩步攀升。她發現自己很難釋懷，只能勉強到到手的巨額獲利來安慰自己。她是否賣得太早？是否應該繼續持有股票？2
    月 23 日，股價向下穿越她的賣出價位。


    股價下跌到$35 附近獲得支撐，沿著警戒線盤整，接著又繼續下跌。4 月初，股價直接向下貫穿 BARR 趨勢線，兩、三天之後就滿足下檔的最低目標價位$31，而且繼續走低。


    林小姐很快就忘掉這支股票。1994 年 7 月份，在一次偶然的機會裡，她又看到這支股票的走勢圖，發現當時的價位竟然只有$21，距離 1993 年初的峰值幾乎下跌
    50%。


    # 帶柄杯狀排列


    ![](img/843a88de0b50d7a36e65238281a4e722_221_0.png)


    ## 摘要資料


    - **外觀**：狀似右側帶柄而開口向上的咖啡杯。

    - **反轉或整理**：短期的（少於 3 個月）多頭整理排列。

    - **失敗率**：26%。

    - **等待突破的失敗率**：10%。

    - **平均漲幅**：38%, 最經常發生漲幅 10%~20%。

    - **回挫**：74%。

    - **價格目標**：達成率 49%（衡量完整排列高度）或 73%（衡量一半排列高度）。

    - **意外發現**：杯口右緣稍高的績效優於左緣稍高，平均漲幅分別為 40% 與 35%。

    - **參閱排列**：（7）蹦跳-奔馳底部反轉排列，（34）圓形底排列。


    「摘要資料」列示帶柄杯狀排列（cup with handle）的重要統計數據。失敗率為 26%，超過我認為可以接受的水準 20%。可是，如果等到向上突破之後，失敗率降低為
    10%。向上突破的平均漲幅為 38%，相當不錯，但還是低於大多數多頭排列的平均漲幅 40%。最經常發生漲幅為 10%到 20%之間，兩側的分配相當均勻。詳細觀察漲幅分配的資料顯示，39%案例的漲幅低於
    20%，漲幅超過 50%的離群值大約佔 27%的案例。


    每四個向上突破案例，就有三個排列會發生回挫走勢（throwbacks）。這提供一個頗具參考價值的操作方法：在回挫走勢中買進股票。透過這種方法建立多頭部位，平均報酬率也稍微提高。這部分的細節討論，請參考本章「交易戰術」一節。


    目標價位的傳統估計方法，是由突破點向上衡量排列高度。若是如此，這個排列的目標價位達成率只有 49%，主要是因為杯狀高度通常很大。在「交易戰術」一節中，我考慮更改目標價位的估計方法，藉以提高達成率。


    杯口右緣稍高的績效優於左緣稍高，平均漲幅分別為 40%與 35%，兩者之間的差異具有統計上的顯著意義。這方面的詳細討論，請參考「統計數據」一節。


    ## 緣起


    帶柄杯狀排列因為威廉・歐尼爾（William J. O''Neil）在《股票賺錢術》（How to Make Money in Stocks, McGraw-Hill,
    1988）一書的介紹而被普遍接受。他提到一些類似圖 9.1 的例子。這支股票在兩個月內上漲 345%（由杯口右緣開始衡量），是這份研究中表現最佳的案例。不幸地，這份走勢圖並不符合歐尼爾對於帶柄杯狀排列設定的準則。我稍後會解釋歐尼爾的準則，但讓我們先仔細觀察這份走勢圖。股票起漲於
    1995 年 8 月初的$5½，價格穩定攀升，一直到 12 月初向上蹦跳。蹦跳階段的初期，成交量明顯放大。價格漲速加快，但很快創峰值而向下反轉，並且跌破上升趨勢線，完成所謂的蹦跳-奔馳頭部反轉排列。蹦跳階段的峰值發生在
    12 月底的$267₈，跌破趨勢線之後的低點為$12^{3}/_{8}——跌幅為 54%。這波漲勢與跌勢構成杯狀的左緣。隨後兩個月內，股價緩步走高，在 3
    月底向上穿越先前的高點。這波漲勢結束之後，也構成杯狀的右緣。


    ![](img/843a88de0b50d7a36e65238281a4e722_223_0.png)


    **圖 9.1** 蹦跳-奔馳頭部反轉排列演變為帶柄杯狀排列。請注意，向上突破的價位大約在$30，股票在不到兩個月之內漲到$120。杯柄是一個高位緊密旗形排列。


    股價觸及先前的高價，在獲利回吐的賣壓下呈現橫向走勢，大約在兩個星期之後才恢復漲勢。這段橫向走勢稱為杯柄（目前這個例子的杯柄屬於高位緊密旗形排列 [high,
    tight flag formation]）。柄部的成交量型態向下傾斜——初期的成交量較大，隨著時間經過而縮小。當價格向上穿越杯緣，視為突破。突破過程的成交量明顯放大。可是，突破之後的一個星期，價格回挫到柄部上緣，接著又繼續上漲。這波回挫走勢讓原來來不及進場的投資人有機會買進，或者進行加碼。5
    月底，向上突破之後的第 44 天，股價出現最後高點$120。


    ## 辨識準則


    當我根據價格資料歸納各種型態排列，經常忽略一些傳統的篩選準則。我讓型態本身決定其辨識特質。我就是採用這種方法篩選帶柄杯狀排列。篩選研究案例之後，我根據自己對於歐尼爾篩選準則的解釋來整理資料，並比較這些案例的續效。表
    9.1 顯示歐尼爾的篩選準則、我篩選案例的準則，以及我對於歐尼爾準則的解釋。


    歐尼爾挑選適當的帶柄杯狀排列，引進許多準則。他發現，相對強度（relative strength）——某支股票相對於其他股票的續效——很重要，有助於剔除表現不佳的對象。


    我不知道歐尼爾採用哪些股票來計算相對強度，所以我的篩選過程沒有考慮相對強度。如果有的話，符合歐尼爾準則的案例數量必定會減少（我所挑選的案例只有 9% 符合他的條件），對於績效的影響則不清楚。對於符合其篩選準則的股票，我觀察每個帶柄杯狀排列，發現杯狀出現之前的漲勢過程中，某些场合總是發生大成交量。在所有符合歐尼爾準則的案例中，只有一個成功的排列沒有這個現象。


    在上升趨勢中挑選帶柄杯狀排列，這顯然非常重要。所以，我採用歐尼爾的準則：杯狀出現之前的漲幅至少為 30%。


    所有的杯狀都屬於 U 形（剔除 V 形的案例）。另外也剔除無柄的杯狀排列。對於我來說，無柄杯狀就是圓形底，相關的討論請參考第 34 章。


    我由嚴格的角度解釋歐尼爾的杯子深度（跌幅）。歐尼爾把最大深度設定為 50%，這雖然會增加符合準則的案例數量，但失敗率增加，平均報酬率上升。我採用的杯子深度為
    12%~33%，不會顯著影響失敗率與平均報酬率。


    歐尼爾對於柄部設定一些準則。他認為，柄部期間至少應該是 1、2 個星期，但沒有設定最大期限。根據我的觀察，在突破之前，柄部確實可能發生長達數個月的橫向整理。


    我剔除柄部右側末端位在杯子下半部的排列。可是，我所引用的一些例子，柄部也可能剛好超過杯子下半部。剔除柄部右側末端位在杯子下半部的案例，平均報酬率提升 1%
    為 39%。

    '
