    ![](img/843a88de0b50d7a36e65238281a4e722_85_0.png)


    **圖 3.3 兩個下降擴張排列。** 在第一個排列中，價格跌勢曾經在過去的低點支撐觸及下側趨勢線，然後向上反彈。第二個排列中出現部分漲勢，這種走勢經常發生在向下突破之前。另外，價格向下突破之後，反彈走勢在下側趨勢線遭逢壓力；克服這個壓力之後，隨後漲勢又在先前的上側趨勢線遭逢壓力。


    這個支撐，投資人相信跌勢將告一段落而回升。確實如此，價格夾著大量向上跳空，很快就回到先前的高點。


    在先前的高點$35 附近，走勢遭逢法人機構與其他投資人的賣壓，這些供給籌碼阻止股價繼續上漲。價格在高檔盤旋幾天，小跌之後又稍作盤整，然後出現重挫走勢而創新低。


    價格夾著大量下跌，直到觸及下側趨勢線才得到支撐。在超賣情況下，投資人進場買進，再度驅動股價走高。當股價上漲到$35 的先前峰位，此處的供給籌碼顯然在幾個月前已經消耗完畢。股價向上跳空，收盤價直接穿越$35
    的壓力，展開向上突破。


    股價經過一段漲勢之後，很快又形成另一個下降擴張排列。這個排列規模較小，結構更緊密，但具有空頭意涵。9月下旬，股價由底部向上反彈，但不能到達上側趨勢線而拉回，這個部分漲勢顯示價格將向下突破。價格跌破下側趨勢線之後，繼續沿著趨勢線向下發展。


    這兩個排列背後的故事都相同。某特定價位出現供給籌碼，如果這些供給籌碼被消化，價格就向上穿越排列頭部；反之，如果供給籌碼太多，價格就跌破下側趨勢線。所以，這個排列的突破方向不確定。


    ## 辨識準則


    表 3.1 列示下降直角三角形擴張排列的辨識準則。排列的形状類似於上側水平狀的喇叭。價格上漲到特定價位而拉回，構成上側趨勢線；下跌走勢則呈現持續下降的底部，銜接為向下傾斜的下側趨勢線。不論頭部或底部，趨勢線都至少必須由兩個轉折點銜接而成。由於擴張排列需要很長的醞釀時間，所以趨勢線通常都由兩個以上的觸及點構成。


    這個排列缺乏穩定的成交量型態。有些情況類似三角形排列，成交量在排列過程中逐漸萎縮，然後爆量突破。另一些情況下，成交量逐漸放大而展開突破。第一種情況的發生頻率高於第二種，比率分別爲
    53%與 47%。可是，由於兩個數據非常接近，所以成交量型態沒有重要參考價值。


    部分漲勢（參考圖 3.3）或部分跌勢經常可以顯示隨後突破的方向。一旦部分漲勢（或跌勢）發生反轉之後，通常會直接——換言之，不會在排列內繼續發生轉折——向下（或向上突破）。在我們考慮的案例中，部分跌勢發生的頻率高於部分漲勢，比率分別為
    78%與 58%（請參考「統計數據」一節）。


    趨勢線向未來延伸幾個月（甚至幾年），仍然可以扮演往後走勢的支撐或壓力（究竟是支撐或壓力，則取決於價格由哪個方向接近延伸趨勢線；相關案例請參考圖 3.1、3.3
    與 3.7）。


    ### 表 3.1 下降直角三角形擴張排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 形狀 | 稍微下傾的喇叭狀，但排列頭部為水平狀，下側趨勢線朝右下方傾斜。 |

    | 頭部水平壓力線 | 銜接頭部成為水平狀壓力線。至少需要兩個顯著的觸及點（轉折高點）才能銜接一條趨勢線。 |

    | 底部向下傾斜趨勢線 | 持續下滑的底部銜接為一條向下傾斜的趨勢線。至少需要兩個顯著的轉折低點才能銜接一條趨勢線。 |

    | 成交量 | 不規則，缺乏穩定的型態。 |

    | 提前突破 | 非常罕見。收盤價突破趨勢線，通常就是真正的突破。 |

    | 突破 | 價格可能朝上或朝下突破，通常伴隨大量，但成交量很快就恢復正常。 |

    | 部分漲勢或跌勢 | 在明確的排列型態內，價格朝上反彈或朝下拉回，但不能實際觸及上側或下側趨勢線，隨後通常會朝相反方向進行突破。 |

    | 支撐與壓力 | 兩條趨勢線的延伸，偶爾會繼續發揮支撐與壓力功能。 |


    ## 失敗案例


    由於下降擴張排列可能向上或向下突破，所以我們考慮兩種失敗的情況。圖 3.4 的例子在 11 月底出現一波具有預示意義的部分跌勢。部分跌勢結束之後，價格向上彈升，最後貫穿上側趨勢線。當收盤價穿越趨勢線之後，不久就出現向上突破之後的回挫走勢。在正常的情況下，價格在回挫走勢中會重新測試排列的突破位置，或是觸及上側趨勢線，或是重新進入排列，但應該只停留在排列三等份的上緣；測試完畢之後，價格繼續上漲。可是，在目前這個例子中，價格在$45
    被壓回，回挫走勢折返到排列的中央位置。回挫走勢結束之後，價格一度向上彈升，但觸及原先的上側趨勢線之後，就展開持續性下跌。


    如果你在向上突破之後進場，買進價格大約在$44½附近，但突破失敗的低價為$36 7/8。即使你把停損設定在排列最低點的下側，恐怕也只能在$39 出場，損失還是很慘重。可是，在突破確定失敗之後，如果繼續持有股票（不建議這麼做），最後的獲利相當豐厚。圖
    3.4 最右端跌勢的低點發生在 4 月份的$36 7/8（圖形沒有顯示），這個價格實際上也是未來兩年的最低價。1993 年 11 月初，這支股票在$60 附近創峰位。


    ## Pacific Telesis Group（電訊服務，NYSE，代碼 PAC）


    ![](img/843a88de0b50d7a36e65238281a4e722_89_0.png)


    **圖 3.4** 下降擴張排列的失敗案例：向上突破之後沒有出現跟進漲勢。部分跌勢顯示最後的突破方向朝上，但結果演變為假突破，價格最後朝下發展。


    圖 3.5 顯示一段更可怕的過程，因爲其中涉及放空交易。1994 年 10 月 14 日，投資人看到連續兩天的暴跌走勢，很可能按耐不住而在隔天進場放空。如果真的這麼做，甚至稍待幾天，結果都是在最低價附近放空。向下突破之後，價格回升測試突破點。稍作整理，然後一路攀升到排列的上緣。如果你是一位投資新手，空頭部位沒有設定停損，在圖
    3.5 的最右端，部位的虧損可能是$35 減去$24 3/8，後者是 10 月中旬向下突破的最低價。


    ## Healthcare Compare（醫療服務，NASDAQ，代碼 HCCC）


    ![](img/843a88de0b50d7a36e65238281a4e722_90_0.png)


    **圖 3.5** 下降突破的失敗案例：向下突破之後，沒有出現 5%以上的跟進跌勢。價格在低檔稍作整理，最後上漲到$42。這類程度的失敗案例非常罕見，但還是曾經發生，所以務必設定停損。11
    月初發生擴張頂排列。


    圖 3.5 即是我所謂的「5%失敗」類型；換言之，收盤價格朝某個方向突破，但隨後沒有出現 5%或以上的跟進走勢，價格又朝突破的相反方向發展。如果發生這種類型的失敗，結果可能是小賺或大賠，沒有預先設定停損的風險很大。


    圖 3.4 與 3.5 也提供一些正面功能：這類的失敗案例很少見。根據下一節討論的「統計數據」顯示，每 10 個案例當中，有 8 個突破會出現 5%或以上的跟進走勢。可是，剩下的
    2 個案例也足以迫使你採用停損。即使你準備採用心理停損，也必須確定在情況真正惡化之前扣動扳機。


    ## 統計數據


    表 3.2 列示下降擴張排列的一般性統計數據。對於我們截至目前爲止所研究的擴張排列，目前這種最爲罕見。採用兩個資料庫，在長達 3,000 年的日線圖排列中，只找到
    82 個案例。夠罕見吧！


    反轉排列的案例（44 個）較連續排列（38 個）多出 6 個。所謂「反轉排列」是指型態發生之前與之後的趨勢方向相反，所謂的「連續排列」（或整理排列）是指型態發生之前與之後的趨勢方向相同。


    價格朝某個方向突破之後，在反向走勢出現之前，如果沒有發生 5%或以上的跟進走勢，排列視爲失敗。表 3.2 顯示兩個突破方向的失敗率。向上突破失敗率爲 19%，向下突破失敗率只有
    3%。我個人認爲，任何排列的失敗率在於 20%以下，就屬於可靠的型態。所以，這兩個突破方向的排列都很可靠。


    向上突破的平均漲幅爲 27%，但最經常發生漲幅介於 20%與 30%之間。由於最經常發生漲幅是來自漲幅次數分配，但樣本實在太小，結論未必具有統計上的顯著意義，請不要過份重視這些數據。舉例來說，最高的次數是
    7 次，落在 21%~30%的區間，其次是 11%~20%的 5 次。一般來說，發生次數在 30 次或以上，才具有統計上的可靠性。對於其他典型的排列而言，最經常發生漲幅大多落在
    10%到 15%之間，我相信如果目前這種排列的樣本數量夠多，結果大概也差不多是如此。


    ### 表 3.2 下降直角三角形擴張排列的一般統計數據


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量（1991年~1996年的500支股票） | 69 |

    | 排列數量（1996年~1999年的296支股票） | 13 |

    | 反轉或整理排列 | 38個整理，44個反轉 |

    | 向上突破的失敗率 | 9個或19% |

    | 向下突破的失敗率 | 1個或3% |

    | 成功向上突破的平均漲幅 | 27% |

    | 最經常發生漲幅 | 20%~30% |

    | 成功向下突破的平均跌幅 | 19% |

    | 最經常發生跌幅 | 10%~15% |

    | 成功向上突破，符合或超越目標價位者 | 34個或89% |

    | 成功向下突破，符合或超越目標價位者 | 20個或69% |

    | 排列的平均長度 | 3個月（88天） |

    | 向上突破距離最後高點的天數 | 5個月（148天） |

    | 向下突破距離最後低點的天數 | 3個月（86天） |

    | 出現部分漲勢之後的排列成功率 | 7/12 或58% |

    | 出現部分跌勢之後的排列成功率 | 18/23 或78% |


    附註：這種排列向上突破的績效較佳，平均漲幅為27%。


    向下突破的平均跌幅為 19%，非常接近一般空頭排列的平均跌幅 20%。最經常發生跌幅介於 10%到 15%之間。同樣地，請注意樣本數量實在太小，結論未必有任何意義；雖說如此，但
    10%~15%的跌幅則屬於相當典型的數據。


    我們可以運用衡量法則，估計突破之後的目標價位。「交易戰術」一節曾舉例說明目標價位的計算過程，把排列的最高價減去最低價，結果是排列高度，然後由突破位置向上或向下衡量排列高度，結果就是突破之後的目標價位。一般來說，這個目標價位代表最低的目标價位。下降擴張排列向上突破的目標價位達成率為
    89%，向下突破只有 69% 的案例會到達或超過目標價位。我個人認為，目標價位達成率應該超過 80% 才具有可靠性，所以向下突破的數據太低。


    排列的平均時間長度大約是 3 個月（88 天），突破之後需要 3 個月（向下突破）或 5 個月（向上突破）的時間才會到達最後極端價位。向上突破到達最後峰位所需要耗費的時間較長，這點相當合理，因為向上突破平均漲幅（27%）大於向下突破平均跌幅（19%）。換言之，距離愈遠，所需要的時間愈久。


    部分漲勢是指價格由排列下側向上發展，但還沒有到達上側趨勢線之前就向下反轉；一旦發生這種走勢，結果有 58% 的案例向下突破。相對於純粹巧合，這個比率並不算高。可是，如果發生部分跌勢——價格由排列上側向下發展，但還沒有到達下側趨勢線之前就向上反轉——結果有
    78% 的案例向上突破。這個比率就具有策略意義：如果你看見價格跌勢到達下側趨勢線之前就向上反轉，不妨考慮買進。


    表 3.3 列示突破的統計數據。由於這個排列可能向上突破或向下突破，所以需要考慮兩個方向的失敗率。一旦排列向上突破之後，隨後沒有發生 5% 或以上跟進走勢的案例只有
    19%。


    ### 表 3.3 下降直角三角形擴張排列突破的統計數據


