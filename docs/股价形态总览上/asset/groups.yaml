    ### 統計數據


    關於績效評估，很難解釋歐尼爾的篩選準則。最初，我認為自己誤解歐尼爾的意思，旗形長度只要不太長就應該可以了（不超過 5 個星期）。經過查證之後，歐尼爾確實把旗形長度限定在
    3~5 星期之間。其他人顯然也是如此解釋。


    表 15.2 的上半部列示歐尼爾篩選準則各種解釋版本的績效，下半部列示我自己的準則。由上往下，每列準則設定的條件大體上愈來愈嚴格。歐尼爾的第 I 列規定：旗形發生之前曾經在
    2 個月內出現 100%以上的漲幅，但不得超過 120%，旗形本身的長度介於 0~5 個星期，旗形排列向下修正的幅度不超過 20%。


    #### 表 15.3 高位緊密旗形：各種篩選準則的相關統計數據


    | 準則版本 | 漲幅 / 條件 | 績效數據 |

    | :--- | :--- | :--- |

    | 歐尼爾的準則 I | 100~120%漲幅，旗形期間最長 5 星期，旗形向下最大修正 20% | 47% 漲幅；9/38 失敗 (24%) |

    | 歐尼爾的準則 II | 100~120%漲幅，旗形期間最長 5 星期，旗形向下最大修正 20%，等待突破 | 64% 漲幅；0/29 失敗 |

    | 歐尼爾的準則 III | 100~120%漲幅，旗形期間介於 3~5 星期，旗形向下最大修正 20%，等待突破 | 69% 漲幅；0/6 失敗 |

    | 歐尼爾的準則 IV | 100~120%漲幅，旗形期間最長 5 星期，旗形向下最大修正 20%，等待突破，成交量趨勢下降 | 68% 漲幅；0/20 失敗
    |

    | 我的準則 V | 最小漲幅 90%，成交量下降，等待突破 | 65% 漲幅；0/40 失敗 |

    | 我的準則 VI | 最小漲幅 95%，成交量下降，等待突破 | 63% 漲幅；0/36 失敗 |

    | 我的準則 VII | 最小漲幅 100%，成交量下降，等待突破 | 63% 漲幅；0/35 失敗 |

    | 我的準則 VIII | 最小漲幅 105%，成交量下降，等待突破 | 75% 漲幅；0/29 失敗 |

    | 我的準則 IX | 最小漲幅 110%，成交量下降，等待突破 | 84% 漲幅；0/24 失敗 |

    | 我的準則 X | 最小漲幅 115%，成交量下降，等待突破 | 93% 漲幅；0/15 失敗 |


    在我的資料庫內（1991 年~1996 年的 500 支股票），符合前述條件的案例總共有 38 個，其中 9 個失敗，剩餘 29 個排列的平均漲幅為 47%
    *。


    按照上述準則，如果等待價格向上突破（向上穿越旗形排列最高價），則前述 9 個失敗案例將被剔除，平均漲幅提高為 64%（參考表 15.3 第 II 列）。


    如果限定旗形排列的最短期間，平均漲幅可以提高到 69%，但總共只有 6 個符合條件的案例。我不認為這是適當的做法，因為排列績效（平均漲幅）的提高程度有限，但符合條件的案例數量減少太多。如果不限制排列的最短期間，改用成交量呈現下降趨勢的條件，符合條件的排列有
    20 個，其中沒有失敗案例，平均漲幅為 68%。


    我放寬歐尼爾的一些準則，只採用下列條件篩選案例：2 個月內出現 90% 或以上漲幅的走勢，成交量呈現下降趨勢，整理排列向上突破。結果，我找到 40 個排列，沒有任何失敗案例，平均漲幅為
    65%。接下來，我把漲幅條件依此增加 5%，其他條件維持不變，重複統計排列的績效。符合條件的排列數量當然愈來愈少，但始終沒有出現失敗案例。至於平均漲幅的數據方面，除了
    95% 與 100% 兩個情況出現下降之外，提高走勢漲幅條件（由 100% 依此提高到 115%）都造成平均漲幅增加。如果把走勢漲幅提高到 120%或以上，平均漲幅開始下降。


    * 譯按：所謂的「平均漲幅」顯然包括失敗案例在內。


    為了篩選數量較多的案例，應該考慮採用比較寬鬆的條件,只要排列績效不至於因此受到顯著影響。由另一個角度說，在歐尼爾的準則中，我逐次剔除其中的某個條件，結果發現每個條件對於排列績效都有正面影響，但影響程度都不超過
    4%。舉例來說，如果剔除「旗形排列本身的向下修正幅度不得超過 20%」的條件，排列績效（平均漲幅）由 64%下降為 63%。沒錯，這個條件確實有價值，但我們可以歸納下列結論：這個條件造成篩選案例數量大幅減少，卻沒有顯著提高績效。


    在歐尼爾的準則中，如果剔除某個條件，是否會因此而造成排列績效提高呢？這種情況唯有剔除「100%~120%漲幅」的條件。就我的資料庫而言，績效最佳的漲幅區間是介於
    110%與 140%之間。


    這些統計數據究竟有什麼意義呢？我認爲「平均漲幅 65%的 40 個合格案例」（第 V 列）優於「平均漲幅 69%的 6 個合格案例」（第 III 列），因爲前者提供的進場
    / 賺錢機會較多。關於表 15.4 與 15.5，其中的統計數據都採用我的篩選準則。


