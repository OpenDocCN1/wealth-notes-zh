    ### 辨識準則


    所謂「高位緊密旗形」，名稱實在不太恰當，因為排列結構通常全然不像旗形。少數情況下，價格排列確實類似旗形(例如：圖 15.1 的例子)；可是，一般來說，排列初期經常出現短暫的突兀跌勢（持續一、兩天），接著向上反彈，然後呈現下降或水平狀的整理，整理完畢之後，向上突破繼續走高。


    這個排列因為威廉·歐尼爾 (William J. O''Neil) 在《股票賺錢術》(*How to Make Money in Stocks*) 一書的推廣而普遍被接受。歐尼爾提出排列的一些辨識特質，內容請參考表
    15.1。


    #### 表 15.1 歐尼爾：高位緊密旗形的辨識特質


    | 歐尼爾提出的特質 | 討論 |

    | :--- | :--- |

    | 顯著的漲勢 | 持續期間不足 2 個月的漲勢，價格漲幅大約是 100%到 120%之間。 |

    | 旗形排列期間 | 價格橫向盤整，期間大約 3~5 個星期。 |

    | 旗形修正 | 旗形排列內，價格跌幅不得超過 20%。 |


    附註：按照這些篩選準則，平均漲幅為 69%，但總共只有 6 個案例（按照我的準則篩選，總共有 81 個案例，包括 26 個失敗案例）。


    歐尼爾的說明非常清楚，但問題是他所沒有提到的部分。他沒有提到股價呈現倍數上漲之前，應該有一段相當長期的橫向走勢。某些分析師把這點視為必要條件之一，但歐尼爾在他的書中至少提到一個例子，在
    2 個月漲勢邁入旗形整理之前，曾經出現穩定的上升趨勢。這份走勢圖顯示的低價在$26 附近，旗形則出現在$100 左右。


    我認爲這種延伸性的漲勢是必要條件。這意味著觀察重點只是：價格在 2 個月之內上漲一倍，然後出現整理。依此類推，股票可以是：上漲一倍 / 整理（出現高位緊密旗形）/
    又上漲一倍 / 又整理（再度出現高位緊密旗形）。在資料庫內，我找到幾個這類的例子。就我採用的篩選準則來說，其中沒有假定當時處在哪種價格趨勢中（換言之，這種價格型態未必要發生在一段長期而平坦的底部之上）。


    某些分析家認爲，旗形整理階段的成交量型態應該呈現下降趨勢，然後夾著大量向上突破。同樣地，歐尼爾沒有把成交量型態視為必要條件，我的篩選準則也不考慮這點。可是，統計數據顯示，成交量呈現下降趨勢，確實能夠提升排列績效。


    最後，歐尼爾也沒有提到這個排列的操作方法。按照推理，一旦察覺高位緊密旗形排列，就應該買進。不幸地，這個排列的失敗率高達 32%；所以，如果你只是單純買進，恐怕經常失敗。就如同大多數其他排列一樣，最好等待突破之後才進場。


    我如何篩選這些旗形排列呢？我讓電腦尋找价格在兩個月以內曾經出現 100%漲幅的所有案例。然後，利用肉眼實際觀察這些案例，重點是附近的整理區間。如果整理區間位在
    100%漲勢附近，就接受它們為高位緊密旗形。我沒有考慮旗形排列的期間與向下修正的限制（如同表 15.1）。稍後討論的統計數據顯示，排列期間與修正幅度的限制確實可以提升排列的績效，但程度很有限。


    圖 15.1 的例子完全符合歐尼爾的準則，但圖 15.2 的例子則否（如果嚴格套用這些準則的話）。圖 15.2 的股票在 7 月初觸及$5¼的低點（標示為
    L），然後開始走高。9 月初，股價上漲到$10¼，漲幅稍微不足 100%。嚴格來說，95%確實不符合歐尼爾的準則，但已經夠接近了。高位緊密旗形排列本身，涵蓋期間為
    38 天，價格向下修正的幅度為 22%；相對於歐尼爾的準則，時間超過 3 天，幅度超過 2%。讀者或許認為，這些條件已經夠接近了。我把這個例子視為高位緊密旗形，但測試績效的過程中，則認為這個例子不符合歐尼爾的準則。為了運用電腦程式，我必須把一些模糊的字眼轉換為死板的規定。


