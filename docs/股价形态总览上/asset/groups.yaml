    請參考圖 21.3 的另一個多肩類型複雜頭肩頂。走勢圖的最左端剛完成一個頭肩頂排列，價格向下突破而展開跌勢，在 7 月初見底之後，股價回升而開始另一個新的頭肩頂排列：複雜的型態。如果只考慮排列最內側的頭肩頂，其形狀看起來類似圓形頂。價格轉折非常平滑，這是複雜頭肩頂的頭部特質。當然，平坦狀頭部也是多肩類型的常見現象（例如圖
