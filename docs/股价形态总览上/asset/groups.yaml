    ![](img/843a88de0b50d7a36e65238281a4e722_507_0.png)


    圖 22.3 雙角底排列的失敗案例。除了其他徵兆之外，許多類似長度的突兀線形（標示為 L），使得這個排列的有效性值得懷疑。下降三角形排列也顯示價格可能走低。


    另外，你也可能懷疑目前——雙角底排列發生當時——是處在頭肩頂排列的「頭部」下跌過程中。「左肩」已經出現在 1994 年 5 月底，對應的「右肩」可能發生在
    1995 年 4 月或 5 月份。若是如此，你也應該放棄這個機會，因爲「右肩」的高度頂多在 $16 附近。換言之，這是假定目前的雙角底排列將失敗，價格繼續下跌到
    $11~$12 之間（假設頸線爲水平狀），然後反彈形成「右肩」。如果你預期價格將下跌（雙角底排列將失敗），當然沒有買進的道理。


    型態可能失敗的另一個徵兆，是排列線形的長度。如果你回顧稍早的價格走勢，就會發現許多線形甚至超過雙角的長度。這意味著雙角底排列可能沒有特殊意義。


    型態的可見度也不太理想，因爲稍早的價格走勢使得底部排列相當模糊。在正常的小跌走勢中，線形低價應該持續創新低（例如：1995 年 2 月份到 4 月份之間的跌勢）。雙角底排列應該代表加速的跌勢，相對於排列左側的走勢，當時的線形非常突兀。就目前這個例子來說，雙角底與先前線形的低價大約相當，結構並不顯著。整個排列告訴我們，底部似乎正在形成當中，但高點繼續下滑。換言之，當時價格型態看起來是投資人應該謹慎的下降三角形排列。


    總而言之，當時似乎有許多徵兆都顯示這個雙角底排列很可能失敗。可是，由統計的觀點來說，雙角底排列的失敗頻率到底有多高？


