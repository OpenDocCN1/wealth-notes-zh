    最後，漲、跌幅度的性質也對於多頭市場比較有利。一支股票的價格可能上漲 50%或 100%，也可能出現 1,000%的漲勢。上漲幅度沒有限制，但下跌的幅度呢？股票價格頂多下跌
    100%；換言之，股價頂多下跌到 0，不可能出現負數的股價。


    # 平均數與次數分配


    本書經常提到次數分配（frequency distribution），值得在此特別說明。討論次數分配之前，首先解釋平均數（average）的觀念。平均數是某些數據的加總和，除以這些數據的個數。舉例來說，如果你希望衡量五個價格走勢的報酬率（五個樣本讀數），分別為
    30%、40%、50%、60%與 120%，平均報酬率爲 60%；換言之，把五個報酬率加總之後（300%），除以個數（5）。


    這個例子可以說明離群值——數值特別大或特別小的樣本——對於平均數的影響。如果前述報酬率不包括 120%，則平均數就下降爲 45%（180%÷4）。由於一個偏高的數據，使得整體平均數向上跳動，扭曲統計數據的真正代表性。當我們討論多頭排列的時候，這種扭曲現象很重要。假定我們考慮某特定價格型態的平均報酬率，如果一個案例的報酬率爲
    600%，顯然會影響整體平均報酬率。我們不打算剔除離群值（換言之，'
  - '[PAGE 29]


    剔除報酬率特別高與特別低的案例），但採用次數分配。


    「次數分配」聽起來似乎非常神秘，但實際上有其道理。建立次數分配的過程中，首先由樣本的 최고與最低讀數決定次數分配的區間。把讀數區間劃分為 10 等份，因為你希望把所有的樣本讀數歸納到
    10 個欄位（「10」是任意設定而經常採用的數據）。然後，你開始做歸納——把每個樣本讀數歸納到 10 個欄位中的適當位置。完成之後，針對每個欄位，計算樣本的發生個數（次數）；換言之，對於每個欄位，計算該欄位總共
    有幾個樣本讀數。這有一點像「韓信點兵」，不考慮每個士兵是高矮胖瘦，只是數人頭而已。


    讓我們舉一個例子來說明。請觀察表 I.1，假定我正在研究某種價格排列的報酬率，總共有 50 個案例。為了單純起見，假定這 50 個案例的最低報酬為 5%，最高報酬為
    95%。在表 I.1 中，第一個欄位容納報酬率低於 10%的案例，最後一個欄位容納報酬率高於 90%的案例。這個例子沒有顯示所有 50 個案例，只考慮最初
    10 個案例，它們的報酬率分別爲：8%、35%、70%、13%、95%、9%、6%、33%、3%與 63%。所以，8%屬於第 1 欄位、35%屬於第 4 欄位、70%屬於第
    7 欄位、13%屬於第 2 欄位、95%屬於第 10 欄位......，63%屬於第 7 欄位，依此類推，把 50 個報酬率都歸納到適當欄位之後，計算每個欄位內的報酬率發生次數（請參考表
    I.1 最下側一列）。


    由表 I.1 最下側一列的數據可以發現，第一個欄位發生的 次數最多（20 次），這個欄位代表報酬率低於 10%的案例。換 言之，假定你發現某支股票也呈現此處所考慮的相同價格型'
