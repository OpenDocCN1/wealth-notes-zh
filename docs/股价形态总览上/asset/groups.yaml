    | 隨後 5 天的成交量 | 154%，140%，125% |

    | 缺口排列與無缺口排列之間 | 24%與 27% |

    | 的事件跌幅比較 | |

    | 缺口排列與無缺口排列之間 | 18%與 20% |

    | 的反彈漲幅比較 | |


    附註：利空消息當天爆出大量，反彈很快發生，反彈高點很慢出現。


    第一波跌勢雖然很嚴重，股票持有人還是應該在反彈過程中逃命，因為隨後的走勢通常會造成損失進一步擴大。


    表 10.3 顯示迴光返照走勢的額外統計數據。幾乎每個案例發生重大利空消息時，股價下跌過程都會爆出大量。第一波跌勢結束之後，價格開始回升，通常在 3 個星期（19
    天）之內到達反彈高點。


    重大利空消息發生的前一天，股價位於年度價格區間三等分的哪個部分呢？根據次數分配的資料顯示，40%的股票位在年度價格區間的上緣，39%位在中央，20%位在下緣。考慮前述位置的排列平均跌幅，我們發現三者的跌幅大致相當，都介於
    35% 到 37% 之間，不論重大跌勢發生在年度價格區間三等分的哪個位置。


    發生重大跌勢當天的成交量很大（大約是前一天的596%），而且隨後5個交易日仍然維持大量。


    重大跌勢發生當天，如果出現跳空缺口，是否代表某種意義？事件跌幅是否較大？顯然不是如此，呈現缺口的排列平均跌幅為 24%；沒有缺口的排列平均跌幅為 27%。呈現缺口的排列反彈走勢是否比較強勁？反彈漲勢是否較大？答案也是否定的，呈現缺口的排列平均反彈漲幅為
    18%；沒有缺口的排列平均反彈漲幅為 20%。


    ### 交易戰術


    除非你願意放空股票，否則迴光返照沒什麼交易戰術可言(請參考表 10.4)。當重大利空消息發生時，如果你持有股票，不需要急著殺低，想辦法在隨後發生的反彈走勢中尋找賣點。大約有三分之一的案例（36%），股價在第一個星期內出現反彈高點；在兩個星期內到達反彈高點的案例超過一半（56%）。當反彈走勢出現峰值而開始向下反轉，立刻拋掉持股。如果你決定繼續持有股票，通常會發生更嚴重的損失，爲什麼不把這


    些資金轉移到其他潛力較佳的投資對象呢？


    在迴光返照的反彈走勢中，如果你打算針對隨後可能發生的跌勢進行操作，關於空頭部位的獲利潛能，不妨參考圖 10.8 的跌幅次數分配。此處的跌幅是由反彈高點衡量到隨後的最終低點；最可能發生的跌幅介於
    15% 到 25% 之間，具有足夠的獲利潛能建立空頭部位。


    最後，我們希望提出一項警告：務必留意迴光返照排列對於後續價格走勢的影響。除非發生真正嚴重的問題，否則股價不會暴跌，公司方面往往需要花費很長的時間來解決問題。所以，最好忽略
    6 個月之內（甚至長達 1 年）所發生的多頭型態，這些排列很可能失敗，即使成功，報酬率恐怕也不如預期。


    ![](img/843a88de0b50d7a36e65238281a4e722_263_0.png)


    圖 10.8 反彈高點到隨後最終低點之間跌幅的次數分配 如果能夠精確拿捏放空價位，獲利潛能很可觀。


    ### 交易範例


    如果你自認爲瞭解股價發生重挫的理由與其中意涵，可以考慮建立空頭部位。請參考圖 10.9，市場向下調整盈餘預估數據，全年度的展望轉趨悲觀，股價出現 5 點（25%）的暴跌走勢。往後
    4 天之內，每天的價格都收高，一直到第 5 天才收低。陳小姐察覺這波反彈走勢，決定按照反彈第 6 天的收盤價格$15進場建立空頭部位。建立部位之後，她開始等待，發現股價確實按照預期下跌。


