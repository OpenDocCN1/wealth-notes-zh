    目標價位的衡量方法也類似於大多數其他排列。把排列最高價減去最低價，結果是排列高度；由突破價位向上或向下衡量排列高度，結果就是目標價位。


    請參考表 4.2，向上突破的目標價位達成率為 75%，向下突破的達成率只有 64%。我認為，達成率超過 80%，型態的目標價位才具備可靠的參考價值，擴張頂顯然不太符合這個標準。關於目標價位的詳細計算過程，請參考「交易戰術」一節。


