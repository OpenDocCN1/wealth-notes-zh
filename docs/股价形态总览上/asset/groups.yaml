    突破當天成交量是前一 天的 125% 以上，定義爲「大量」，如果該比率小於 75%，則定義爲「小量」。結果，不論是大量突破或小量突破，發生回挫走勢的比率都是
    49%。換言之，沒有證據顯示回挫與突破量之間存在關聯。


    向上突破之後，價格到達最終高點的平均期間為 7 個月（215 天）。可是，按照排列到達最終高點的時間長度編製次數分配圖，結果顯示大部分案例都屬於 3 個月之內的前期排列。所以，我把頭肩底排列歸納為短期型態。


    排列通常發生在年度價格區間的哪個位置呢？大部分頭肩底排列的突破點落在年度價格區間三等份的中央。由於突破點位在排列本身的上端，因此比較不可能發生在年度價格區間三等份的下緣。如果考慮排列落在前述三個位置的平均漲幅，則上緣的平均漲幅最大（44%）；這意味著動能玩家對於這種排列的參與興致最高。


    突破當天的成交量，平均是前一天成交量的 163%，但隨後一個星期的成交量迅速減少。此處所謂的「大量」與「小量」，仍然採用稍早的定義（請參考第 409 頁）。幾乎有四分之三的案例夾著大量向上突破，但仍然有
    26% 的小量突破案例”。請注意，小量突破並不意味著排列隨後可能出現 5% 失敗。在 18 個失敗排列中，小量突破的案例只佔 8 個，相當於 44%。


