    ## 統計數據


    表 19.2 列示複雜頭肩底排列的一般統計數據。在 500 支股票的 5 年資料中，我找到 239 個複雜頭肩底案例。樣本數量或許不多，但對於這種相對罕見的排列而言已經不錯了。在這些排列中，181
    個屬於反轉型態（76%）；換言之，排列完成之後，價格的發展方向與先前的趨勢相反。絕大部分案例屬於下降趨勢的反轉型態。


    排列的失敗率為 6%。幾乎所有的潛在排列都向上突破，而且出現 5% 以上的跟進漲勢。


    向上突破之後，平均漲幅為 37%。可是，最經常發生漲幅介於 20% 與 30% 之間。圖 19.5 是排列漲幅的次數分配圖，漲幅 20% 與 30% 的案例個數顯然最多，遠超過其他漲幅欄位。另外，漲幅超過
    90% 的案例佔 10%，這也是平均漲幅之所以偏高的理由。由於偏高離群值會造成平均數向上扭曲，這是我採用次數分配圖的根本原因。


    關於向上突破之後的最低目標價位，這是計算排列的高度，然後由突破點向上衡量（細節請參考「交易戰術」）。複雜


