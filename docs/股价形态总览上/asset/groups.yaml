    回頭觀察圖 5.1、5.2 與 5.3，我們發現上升擴張楔形具備幾個共通的特性。整體形狀呈現喇叭狀，與擴張排列的情況一樣，只是喇叭的開口朝向右上方：兩條趨勢線都朝右上方傾斜。上側趨勢線的陡峭程度超過下側趨勢線，兩條趨勢線向外擴散。下側趨勢線的斜率也朝上，使得這個排列不同於直角三角形或等腰類型的擴張排列。


