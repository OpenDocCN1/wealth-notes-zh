    ### 表 15.2 高位緊密旗形的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 顯著的漲勢 | 持續期間不足 2 個月的漲勢，漲幅至少 90%。兩個月期間漲幅超過 115%的案例績效最佳。 |

    | 尋找整理排列 | 在既有的上升趨勢中，尋找價格整理的區域。 |

    | 成交量下降趨勢 | 成交量在旗形排列內呈現下降趨勢，這類案例的績效最佳。 |


    附註：就績效來說，我的準則與歐尼爾準則大致相同；就篩選的案例數量來說，我的準則是歐尼爾準則的六倍以上。


    股價在很短期間內上漲一倍。


    按照價格與時間的準則找到適當對象之後，接著尋找附近的整理區域。大部分情況下，整理區域都非常接近。我的篩選準則不考慮整理期間的長度，也不理會排列內價格向下修正的幅度。重點是：非常清楚的整理區域。


    最後一項辨識準則，實際上不是基於辨識目的而設定的條件，只不過是提高績效。旗形排列內的成交量呈現下降趨勢，這類案例的績效比較理想。可是，我不會因為成交量呈現上升趨勢，就剔除某個高位緊密旗形排列——雖然我相信這類案例的績效較差。


