    圖 3.5 即是我所謂的「5%失敗」類型；換言之，收盤價格朝某個方向突破，但隨後沒有出現 5%或以上的跟進走勢，價格又朝突破的相反方向發展。如果發生這種類型的失敗，結果可能是小賺或大賠，沒有預先設定停損的風險很大。


    圖 3.4 與 3.5 也提供一些正面功能：這類的失敗案例很少見。根據下一節討論的「統計數據」顯示，每 10 個案例當中，有 8 個突破會出現 5%或以上的跟進走勢。可是，剩下的
    2 個案例也足以迫使你採用停損。即使你準備採用心理停損，也必須確定在情況真正惡化之前扣動扳機。


    ## 統計數據


    表 3.2 列示下降擴張排列的一般性統計數據。對於我們截至目前爲止所研究的擴張排列，目前這種最爲罕見。採用兩個資料庫，在長達 3,000 年的日線圖排列中，只找到
    82 個案例。夠罕見吧！


    反轉排列的案例（44 個）較連續排列（38 個）多出 6 個。所謂「反轉排列」是指型態發生之前與之後的趨勢方向相反，所謂的「連續排列」（或整理排列）是指型態發生之前與之後的趨勢方向相同。


    價格朝某個方向突破之後，在反向走勢出現之前，如果沒有發生 5%或以上的跟進走勢，排列視爲失敗。表 3.2 顯示兩個突破方向的失敗率。向上突破失敗率爲 19%，向下突破失敗率只有
    3%。我個人認爲，任何排列的失敗率在於 20%以下，就屬於可靠的型態。所以，這兩個突破方向的排列都很可靠。


    向上突破的平均漲幅爲 27%，但最經常發生漲幅介於 20%與 30%之間。由於最經常發生漲幅是來自漲幅次數分配，但樣本實在太小，結論未必具有統計上的顯著意義，請不要過份重視這些數據。舉例來說，最高的次數是
    7 次，落在 21%~30%的區間，其次是 11%~20%的 5 次。一般來說，發生次數在 30 次或以上，才具有統計上的可靠性。對於其他典型的排列而言，最經常發生漲幅大多落在
    10%到 15%之間，我相信如果目前這種排列的樣本數量夠多，結果大概也差不多是如此。


