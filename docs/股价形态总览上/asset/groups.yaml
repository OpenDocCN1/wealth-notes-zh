    突破了。由於大多數下降擴張楔形都向上突破，所以也應該針對向上突破進行交易。可是，這個排列的失敗率高達 37%，還是應該等待收盤價實際突破上側趨勢線，然後才進場買進。


    如果出現部分跌勢，或許可以考慮在實際突破之前進場。當價格由上側趨勢線下跌，密切觀察後續的發展。如果跌勢遇到支撐而向上反彈，可以考慮買進，因為這是部分跌勢，通常代表向上突破即將發生的訊號。把停損買單設定在反彈低點下方
    1/8 點處。


    如果排列非常寬，可以嘗試在排列之內進行區間操作。在下側趨勢線買進／在上側趨勢線賣出，或在上側趨勢線放空／在下側趨勢線回補。由於趨勢線向下傾斜，放空交易比較有利。在建立部位的趨勢線外緣
    1/8 點處設定停損，防範價格出現突破走勢。一旦價格朝有利方向發展，就應該調整停損。多頭部位的停損設定在支撐區下方 1/8 點處，空頭部位的停損設定在壓力區上方
    1/8 點處。


    ### 交易範例


    瑪莉望著電腦螢幕（圖 6.6）而自言自語：「你覺得幸運嗎？免崽子！」她剛看完克林伊斯威特主演的警探片，火氣正旺。


    她決定進行排列之內的區間操作，準備在價格由下側趨勢線反彈之後，進場買進。6 月初，當她看見價格開始顯著回升，於是扣下扳機，成交價格為$43。然後把停損點設定在下


    側趨勢線下方 1/8 點處，相當於$42。如果這筆交易泡湯，頂多虧損 1 點。


    股票完全按照劇本演出，價格持續上漲，很快就到達上側趨勢線。瑪莉等待股價由上側趨勢線回檔，準備賣出股票。可是，這裡發生一點意外，漲勢不只沒有被上側趨勢線壓回，收盤價反而穿越趨勢線，這意味著向上突破。她利用衡量法則計算上檔的目標價位為$49$^{5}/_{8}$，在該處設定獲利了結的賣單。並且把保護性停止單調高到$44，大約在
    4 月中旬折返谷底的下方 1/8 點處。


    看著股價持續上漲，她開始懷疑整個走勢何以完全沒有停頓。結果也只能聳聳肩，把這個問題擱置一旁。當股價在$47$^{3}/_{8}$創新高，她把停止單調高到$45$^{1}/_{4}$，大約是在
    4 月底與 5 月中旬兩個轉折高點的稍下方。


    股價漲勢突然加速，兩天之內就到達她設定的獲利了結賣點$49$^{5}/_{8}$。這筆交易結束之後，每股獲利為$6。隨後幾天，股價拉回整理，讓瑪莉更覺得自己的賣出決策非常明智。


    結果，這筆交易顯然賣得太早，但她並不在意，開始追蹤另一個相當具有潛力的排列。她靠在椅背上，面帶微笑，嘴裡念著一些有關運氣的東西，然後打開錄影機，觀賞另一部克林伊斯威特主演的警探片。


    # 蹺跳-奔馳

    底部反轉排列


    ![](img/843a88de0b50d7a36e65238281a4e722_169_0.png)


    ## 摘要資料


    外觀

    狀似開口朝上的煎鍋，柄部在左邊。柄部構成下降趨勢線，然後進入跌勢加劇的鍋底。


    反轉或整理

    短期的（少於 3 個月）多頭反轉排列。


    失敗率

    19%。


    等待向上突破的失敗率

    9%。


    平均漲幅

    37%，最經常發生漲幅 20%。


    成交量趨勢

    排列起點、蹺跳起點與突破位置的成交量放大。


    回挫

    38%。


    價格目標

    達成率

    92%。


    參閱排列

    （9）帶柄杯狀排列，（34）圓形底排列。


    發現蹦跳-奔馳頭部反轉排列（BARR top）的一年之後，我決定尋找對應的底部型態：蹦跳-奔馳底部反轉排列（bump-and-run reversal bottom，簡稱
    BARR 底部排列）。動機很簡單。很多頭部排列都存在對應的底部型態，例如：雙重頂（double tops）、上升三角形（ascending triangles）與三重頂排列（triple
    tops）。既然如此，那也應該有蹦跳-奔馳底部反轉排列。很奇怪，在此之前，我竟然沒有興起尋找這個排列的念頭。當我在 2,500 年的股價資料中尋找潛在對象時，心中有一種想法：即使找到足夠的樣本，也應該沒有太大的價值。最初，某些型態看起來像是帶柄杯狀排列（
    cup-with-handle formation），有些像是圓形底（rounding bottom）。一直到我把統計數據整理出來之後，最初的想法才發生變化。


    如果等到突破發生，排列的失敗率由 19%下降為 9%。我認為失敗率在 20%以上的排列，都屬於不可靠的型態。成功排列的平均漲幅為 37%，稍低於一般多頭排列的平均漲幅
    40%；可是，最經常發生漲幅為 20%，相當理想。


    BARR 底部排列的目標價位達成率非常高（92%）。我認為，這個數據只要超過 80%，就屬於可靠排列。當然，我們還必須考慮目標價位的衡量方法，這在本章的「交易戰術」一節內討論。


    # 緣起


    何謂蹦跳-奔馳反轉排列呢？如果不考慮其他排列，我或許會把這種型態稱為煎鍋或湯匙排列，因為它的形狀就是如此。然而，這種排列實際上是 BARR 頭部排列的顛倒型態，所以我還是稱呼它爲
    BARR 底部排列。或許「逆狀蹦跳-奔馳反轉排列」（inverted BARR）是更精確的名稱，因爲把它稱爲「底部」排列非常不恰當，表現最佳的 BARR 實際上是位在年度價格區間的中央部分。


    BARR 底部排列何以發生？如同對應的頭部排列一樣，BARR 底部排列是反映動能的演變。請參考圖 7.1 的週線圖。自從 1991 年底以來，這支股票就呈現橫向走勢，股價游走於
    $6½ 到 $11 之間。1993 年 10 月份最後一個星期，前述的情況發生變化，股價向上突破下降通道，當週的收盤價高於前一週，展開一段相當強勁的漲勢，最後在
    1994 年 1 月中旬創週線新高 $14³/₈。接著，股價在高檔出現橫向盤整，成交量雖然還是很 大，但有明顯縮小的趨勢。3 月 25 日的週線又在 $14
    創第二個稍低的峰位。這兩個轉折高點——1 月中旬的 $14³/₈ 與 3 月底的 $14——銜接爲一條向下傾斜的趨勢線。


    成交量縮小，意味著這支股票吸引的人氣下降；最後，買盤力道終於無法支持股票盤整於高檔，股價加速下跌。整個下降過程中，成交量更進一步縮小。年初導致股價創新高的市場動能現在造成副作用。在隨後將近一年的期間內，先前的漲幅不只一筆勾消，1995
    年 2 月中旬更創 1991 年底以來的新低。


    1995 年 3 月中旬爆出大量，這是止跌的訊號，隔週又出現大量，當週收盤價上漲 10%。可是，上升走勢沒有持續多久，隨後又出現 2 個月的橫向盤整。然後，再度發動漲勢，但不屬於三級跳的走勢，而是緩步攀升。8
    月中旬，股價向上測試趨勢線，這時候已經清楚看見圓形狀底部，意味著趨勢向上反轉。


