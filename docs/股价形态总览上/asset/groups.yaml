    # 當日沖銷 / 部位交易 / 買進-持有的投資


    撰寫本書的過程中，我不斷考慮一個問題：價格型態運用上的最佳時間架構究竟是什麼？最適用於當日沖銷？部位交易？或買進-持有的投資？這些問題的答案都是肯定的。圖形排列可以協助當日沖銷者——這些人建立與結束交易部位的時間發生於同一天。許多當日沖銷者透過價格型態判斷支撐與壓力。他們只挑選可靠的價格排列進行短線交易。


    部位交易者的持有期間超過一天，但不會超過幾個月。這種情況下，圖形排列可以用來設定進場點與出場點。我把自己歸類爲部位交易者。如果某筆交易進行得不順利，就立即出場。如果交易進行得很順利，就沒有必要急著出場。當獲利達到最大，或者股票走勢已經告一段落，我就考慮結束部位。如同當日沖銷者一樣，我也嘗試挑選最可靠的價格型態，希望在最短時間內，取得最大的獲利。


    對於買進-持有的投資人，圖形排列也可以提供進場與出場的訊號。我最近買進一家石油服務公司的股票，相信這項投資在兩、三年之內不會有顯著的報酬（結果判斷錯誤：股價在三個星期之內上漲一倍）。按照當初的想法，我估計這支股票的價格在三年之後可以到達
    30 多塊，大概是最低價的六倍。'
