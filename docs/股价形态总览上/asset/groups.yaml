    就這方面而言，複雜頭肩頂的力道勝過對應的常態排列。


    大多數排列的突破位置落在年度價格區間三等份的中央（47%）或上緣（48%），只有 6% 案例落在年度價格區間的低點附近。這個現象很合理，因爲向下突破點雖然位在排列的下端，但排列本身通常位在延伸性價格漲勢的末端，所以就整個年度價格區間而言，突破點經常是在中央或上緣。就前述三個突破位置的平均跌幅而言，落在年度價格區間中央的排列最大（28%），但落在上緣位置的排列平均跌幅也差不多（26%）。


    向下突破之後，通常會保持幾天的大成交量。請參考表 21.3 的數據，突破當天的成交量是前一天水準的 175%，然後逐漸縮小，五天之後就大體上恢復正常狀況。


    ### 交易戰術


    利用衡量法則估計向下突破之後的最低目標價位。請參考表 21.4 的說明與圖 21.7 的例子。首先計算排列的高度，這是取排列最高價（$31 5/8），減去當天對應的頸線價位（$27）。所以，排列高度是
    $4 5/8。由頸線突破價位（$25 3/4），向下衡量排列高度，即是最低目標價位 $21 1/8。這個目標價位完成於 3 月初。


    這是傳統的衡量方法，達成率有 67%，低於我認爲可靠型態應該具備的最低達成率 80%。如果頸線向下傾斜的角度太大，不適合採用傳統衡量方法，因爲除非股票暴跌，否則根本不可能觸及頸線。非常幸運地，複雜頭肩頂排列很少出現陡峭的頸線。可是，萬一碰到這種情況，可以採用肩部最低谷底做為突破價位。仍然按照傳統衡量方法計算排列高度，但由肩部最低谷底向下衡量排列高度。


    關於排列高度，另外有一種比較保守的估計方法：取排列最高價，減去銜接頸線的較高谷底價位。由前述較高谷底價位，向下衡量排列高度，結果就是最低目標價位。如果採用這種衡量方法，複雜頭肩頂排列的目標價位達成率提高爲
    76%，仍然低於我設定的最低標準 80%。


    表 21.5 複雜頭肩頂排列的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 計算頭部最高點與頸線之間的垂直距離，這是排列高度。由頸線突破點向下衡量排列高度，結果就是最低目標價位。如果排列形狀看起來像平坦底部鉤出的一座高山，價格可能回到底部的價位，請參考圖
    21.2 與 21.5。 |

    | 不要等待確認 | 如果你能夠預先判斷複雜頭肩頂排列，儘早在潛在型態出現之後賣出持股或放空，因為潛在排列通常都會向下跌破。如果價格回升到頸線，可以考慮重新建立部位。
    |

    | 停損 | 把銜接頸線的谷底視為上檔壓力水準。空頭部位的停損設定在較高肩部谷底的稍上方。肩部與頭部峰位也是設定停損的理想位置。 |

    | 留意回升 | 等待回升走勢，藉以建立或加碼空頭部位。採取行動之前，應該等待價格向下反轉，因為某些回升走勢可能繼續上漲。 |


    ## Standard Microsystems Corp.（電腦週邊，NASDAQ，代碼 SMSC）


    ![](img/843a88de0b50d7a36e65238281a4e722_496_0.png)


    圖 21.7 複雜頭肩頂排列。衡量最低目標價位的方法：計算排列最高價與頸線之間的距離，由頸線突破點向下衡量該距離，結果就是最低目標價位。12 月份到 2 月份之間，陸續出現擴張頂排列與迴光返照。


    利用圖 21.7 做爲例子來說明，排列最高價是 $31\frac{5}{8}$，銜接頸線的較高谷底價位是 A 點的 $27\frac{1}{2}$（採用當天的盤中低價）。排列高度是
    $4\frac{1}{8}$（$31\frac{5}{8}$−$27\frac{1}{2}$），目標價位是 $23\frac{3}{8}$（$27\frac{1}{2}$−$4\frac{1}{8}$）。這個目標價位完成於
    3 月 2 日的單日重挫走勢。


    如果頭肩頂排列不是發生在延伸性漲勢末端——類似圖 21.1 的情況——排列完成之後，價格可能跌回排列起始當初的低點。在圖 21.1 中，排列開始之前的低價大約是
    $28，這就是排列完成之後的下檔目標。


    某些情況下，突兀狀的頭肩頂型態可能出現於橫向走勢，類似如圖 21.2 與 21.5。型態完成之後，價格經常回到原先的橫向盤整價位。


    由於複雜頭肩頂排列非常可靠，一旦認定型態有效之後，就可以及早採取行動。如果持有股票，應該賣出。如果空手，可以考慮放空。對於空頭部位，停損應該設定在上檔壓力區的稍上方，例如：肩部谷底、肩部峰位或頭部峰位。如果價格向上穿越排列的最高價（頭部峰位），頭肩頂排列已經失敗，立即回補空頭部位，因爲價格可能繼續走高。


    請注意，價格跌破頸線之後，可能回升到頸線之上，重新測試之後才正式下跌（例如圖 21.1 與 21.3 的情況）。這類延伸性或正規的回升走勢，往往是進場建立部位或加碼的機會。


    ### 交易範例


    亨利管理一個小型避險基金，考慮買進圖 21.7 的股票，但還需要等待一些有利的技術訊號。兩個星期之後（1994 年 8 月），價格突破長期下降趨勢線，日線圖上的其他指標也發出買進訊號，所以他進場買進，平均成本是
    $17\frac{1}{4}$。


    隨著股價走高，亨利繼續追蹤，定期查核基本面的數據。這段上升走勢並不平穩，10 月份到 12 月初之間開始出現一些奇怪的現象。某段期間內，看起來似乎正在形成擴張頂排列，但價格波動非常劇烈，很快就破壞整個型態。


    股價在 $21 與 $25 之間數度來回游走，最後向上突破創新高。亨利覺得漲勢即將結束，更謹慎追蹤公司基本面的演變。由於他太專注於公司的營運狀況，沒有察覺價格型態的發展。當他與其他基金經理人閒聊時，彼此交換意見，發現該公司的基本面情況不太理想。


    「這就是股價呈現擴張頂排列的理由，」某位基金經理人指出。亨利皺著眉頭，在腦海裡冥想股價走勢圖，似乎真的是擴張頂排列。


    隔天，亨利叫出股價走勢圖，仔細觀察。他看見不斷墊高的高點與持續下滑的低點（請參考圖 21.7 的放大圖），典型的擴張排列特質。配合基本面的資料，他知道賣出的時機已經不遠，但還沒有到。他希望在上側趨勢線附近賣出。


    2 月初，價格向上測試前一波的高點失敗，回檔整理幾天，又再度向上攻堅，仍然失敗（結果形成兩個右肩）。第二度嘗試的峰位更低，意味著盤勢轉弱，於是亨利立即開始賣出持股。


    就擴張頂排列的角度觀察，由於上升走勢沒有觸及上側趨勢線，這代表部分漲勢。部分漲勢發生之後，擴張頂排列經常向下突破。


    當價格再度拉回到兩個右肩底部附近（B 點），亨利已經完全賣出持股。就在這個時候，他發現擴張頂排列已經演變為複雜頭肩頂型態，頭部的兩側各有兩個肩部。


    面對這個新發展，亨利與同事商量之後，決定放空股票。


    當價格下跌到長期上升趨勢線附近，他已經持有少量的空頭部位。


    兩天之後，價格開始暴跌。一天之內，股價下跌 $5，相當於 20% 的跌幅，而且還欲罷不能。不到一個星期，股價直接跌到 $16 附近才獲得支撐，跌幅大約是 36%。


    亨利瞭解這種迴光返照的走勢。股價通常在一個星期之內都會向上反彈，然後又繼續下跌。


    沒錯，股價稍微回升（$18^{1}/_{8}$），但不是預期中的平滑弧狀反彈。幾天之後，價格又開始下跌，於是亨利立即停止抱怨，密切觀察走勢的後續演變。


    股票在 $16 附近打底，呈現水平狀的橫向走勢。亨利認爲，這支股票可能在此築底，準備向上反攻，所以回補一半的空頭部位。


    4 月底，股價突然躍升到 $18^{1}/_{2}$，他立即回補剩餘的空頭部位。當天晚上，他與朋友在酒吧聊天，覺得心情非常愉快，決定自掏腰包請客。


    ## 雙角底排列


    ![](img/843a88de0b50d7a36e65238281a4e722_501_0.png)


    ### 摘要資料


    - 外觀 週線圖上，兩個突兀狀向下長線形，中間隔著另一支小線形。

    - 反轉或整理 長期（超過 6 個月）的多頭整理排列。

    - 失敗率 11%。

    - 平均漲幅 37%，最經常發生漲幅為 20%~30%。

    - 意外發現 不正常的突兀狀長線形，績效比較理想。

    - 參閱排列 （12）雙重底排列，（30）長管底排列。


    雙角底排列（horn bottoms）發現於我處理雙重底的過程。雙重底的兩個底部距離愈近，績效表現往往愈理想。如果兩個底部只相隔一個星期左右，結果又如何呢？經過測試之後，我發現這類排列的績效很理想，失敗率只有
    11%，遠低於我對於可靠型態設定的最高門檻 20%。


    平均報酬率爲 37%，稍低於一般多頭排列的平均漲幅 40%。如此偏高的漲幅顯然不會發生在一夜之間。按照排列突破之後到達最終高點的時間次數分配圖顯示，大多數雙角底排列屬於長期性質（到達最終高點的時間超過
    6 個月）。


    我檢驗雙角底排列的一些構成條件，藉以提高型態的績效。結果發現，雙角的線形長度超過最近一年內大多數長線形的長度（至少超過一倍），這種雙角底的績效最棒，平均漲幅爲
    43%。


    ### 緣起


    圖 22.1 說明雙角底排列的形狀。1993 年，2 月底出現峰值 50% 之後，價格一路走低，1994 年 3 月與 4 月份形成雙角底排列，低點爲 30%。左角長線形涵蓋的價格區間大約爲
    7，成交量相當大，看起來是單週反轉的線形（結構與單日反轉相同，只是發生在週線圖上），代表趨勢即將發生變化的徵兆。


    隔週，週線價格雖然收低，但遠高於前一週線形的最低價。又隔一週，行情再度測試先前的低點，形成另一支向下的


    ![](img/843a88de0b50d7a36e65238281a4e722_503_0.png)


    ![](img/843a88de0b50d7a36e65238281a4e722_503_1.png)


    圖 22.1 雙角底排列範例。兩支向下測試底部的突兀長線形，中間隔著一星期，看起來就像公鹿的兩支角，只是方向朝下。


    突兀線形，但價格幾乎收在最高價附近，較前一週收盤價只下跌 1/8 點。這即是潛在的雙角底排列：兩支突兀長線形，中間隔著單調線形，代表趨勢向上反轉的訊號。由雙角底最低點的位置起算，隨後一年半內出現
    100%以上的漲勢。


    ### 辨識準則


    如何辨識雙角底排列呢？表 22.1 列示一些辨識準則。原則上，這些準則只希望在週線圖的底部找到兩支凸顯的長線形。


    表 22.1 雙角底排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 週線圖，向下突起長線形 | 在週線圖上尋找兩支向下的突起長線形，中間隔著另一支線形。兩支突起線形的長度，至少應該類似最近一年內的長線形長度，而且它們的低點應該遠低於中間所夾單週線形的低點。形狀看起來就像公鹿的一對角，但方向朝下。兩支突起線形愈長，績效通常愈理想。
    |

    | 兩個底部價位大致相同 | 雙角低點的價位大致相同，差距通常不應該超過 3/8 點。當然，對於高股價的股票，兩者的差距也可以超過 1 點。 |

    | 清楚明確 | 在下降趨勢中，雙角低點應該遠低於週運線形的低點，尤其是對於排列左側的數支線形而言。雙角底排列通常發生在延伸性跌勢末端，但也可能發生在上升趨勢的修正走勢或橫向整理走勢末端（在這種情況下，相對於排列左側，型態比較不明確）。
    |

    | 線形重疊部分很多 | 構成雙角底排列的兩支長線形，價格重疊部分應該很多。 |

    | 大成交量 | 左角成交量高於平均水準（54% 的案例是如此），右角成交量低於平均水準（52% 的案例是如此）。可是，這只是參考準則而已，個別案例的成交量型態變化很大。
    |


    請參考圖 22.2 的兩個雙角底排列案例。左側的第一個排列，結構非常類似圖 22.1 的例子。這個底部排列發生在一段下降趨勢的末端，該波段跌勢起始於 1991
    年 8 月份的峰位 $25，低點則發生在將近 2 年之後的雙角底排列右角低點 $6\frac{1}{2}$。價格跌勢在此向上反轉。


