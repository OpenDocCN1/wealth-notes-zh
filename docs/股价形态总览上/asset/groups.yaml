    股票向下突破之後，應該立即回到排列發生之前的$108 跳躍水準。可是，它向上突破而呈現直線狀漲勢，直接創$127¼的高價。這波漲勢發生在突破的兩個星期內，所創的高價也代表長期峰位——價格由此緩步下跌。1994
    年初，股價曾經觸及$92½，遠低於菱形排列的突破價位$118¾。如果你在 1993 年 4 月份突破當時放空股票，短期之內雖然會套牢，但最後還是獲利——由突破點衡量到
    1 年後最終低點的跌幅爲 22%。


    是否有什麼理由促使股價繼續走高？突破當時的成交量顯然不支持向上走勢。突破當天的成交量雖然是前一天的169%，但圖形中沒有出現顯著大量（譯按：突破量沒有超過


    正常水準)。小量突破的情況雖然罕見，但也不是絕無僅有。小量突破，而且隨後一個星期的成交量持續萎縮，顯示當時的價格漲勢完全缺乏動能。


    觀察圖 11.7 的成交量型態，趨勢向下發展（衡量成交量迴歸直線的斜率）。這是菱形排列的典型現象，顯然不能提供型態失敗的線索。我看不出任何理由足以解釋圖 11.7
    的排列何以不能向下突破。所以，建立部位之前，最好等待實際的突破。


    圖 11.8 是一個菱形底失敗的案例。1992 年 2 月初，股價創$32\frac{1}{4}的高價，然後開始走低。請注意，菱形排列發生的位置剛好是 3
    月底 / 4 月初下降趨勢止跌之處。所以，在菱形排列的發展過程中，我們有理由相信這是一個底部型態，完成之後應該向上突破。可是，5 月中旬，排列向下突破。雖然股價曾經回升到突破點附近，但又反轉下跌，6
    月中旬曾經觸及$10\frac{1}{2}的低價，然後出現五個月的橫向盤整走勢（圖形沒有顯示）。目前（1999 年），股價不到$1。


    菱形排列的低點$16\frac{1}{4}（發生在 5 月初），價位大約對應 4 月初的低點。這兩個谷底看起來構成雙重底排列。左側谷底的成交量大於右側谷底，這是雙重底的正常現象。另外，兩個谷底所夾的峰位（$21\frac{1}{4}）也夠高。所以，整個排列確實是一個潛在的雙重底排列。不幸地，這是一個失敗的雙重底，因爲價格出現第二個谷底之後，沒有向上穿越$21\frac{1}{4}的峰位；換言之，這個雙重底排列沒有完成，也可以說沒有經過確認。請注意，價格沒有向上發展，反而向下突破第二個谷底，當雙重底排列宣告失敗，意味著價格將進一步走低。

