    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 區域缺口 | 這些缺口通常沒有技術意義，不存在操作價值。 |

    | 突破缺口 | 如果趨勢起點的成交量很大，順著趨勢方向進行交易。建立部位之前，按照辨識準則確認缺口的類型。 |

    | 連續缺口 | 連續缺口通常發生在趨勢的中點，可以按照缺口發生位置衡量目標價位。換言之，由趨勢起點衡量到缺口中間，然後由缺口中間向上或向下衡量前述距離，結果就是向上跳空或向下跳空的目标價位。
