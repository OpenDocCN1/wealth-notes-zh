    D 點的吊人線形代表上升趨勢反轉為下降趨勢（雖然具有橫向走勢的意味）。


    當然，我認為 8 月份的案例最典型。不幸地，如同你在圖 17.1 所看到的黑點，吊人線形很少成功，即使發生在上升趨勢也是如此。


    ### 失敗案例


    圖 17.2 顯示吊人線的兩種失敗類型。左側的案例代表第一種失敗。在這種情況下，我認為吊人線隔天應該出現更高的高價。可是，目前這個例子並非如此，價格繼續下跌。吊人線隔天出現更高的高價，機會有
    44%（真正的吊人線）或 57%（T 形線，定義參閱後文），這兩個數據取決於線形是否考慮開盤價。進一步討論請參考「統計數據」一節。


    在右側案例中，當吊人線形出現時，並不代表價格趨勢即將向下反轉。吊人線形當天的高價為 $21\%$，兩天之後的高價為$26½。所以，這個吊人線形顯然不是多頭反轉線形——而是多頭連續線形。


    Roberts Pharmaceutical（藥品，ASE，代碼 RPC）


    ![](img/843a88de0b50d7a36e65238281a4e722_404_0.png)


    圖 17.2 吊人線形的兩種失敗情況。吊人線發生之後，隔天究竟會出現更高的最高價，或者意味著上升趨勢即將向下反轉。


    第二種失敗類型——換言之，不正確的多頭反轉警訊——的發生頻率為 67%。由另一個角度看，當這種線形出現的時候，如果我們預期價格將繼續走高，反而有三分之二的成功機會。由於績效太差，我只能歸納出一個結論：吊人線形不適用於普通股，或者比較適用於其他證券或交易工具。


    由於失敗率高地離譜，我重新檢驗相關的案例。少數情況下，吊人線形發生在峰位之前幾天（類例如圖 17.2 的右邊案例）。大多數吊人線形發生在上升趨勢的中點或起點附近。總之，吊人線形發生之後，上升趨勢沒有發生反轉的傾向，大多繼續走高。


    你可以透過最簡單的辦法把失敗率降低為零：不要操作這個線形（或不要把它視爲有效型態）。


