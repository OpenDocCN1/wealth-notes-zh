    對於兩個蹦跳的案例，第二個蹦跳低點極少穿越第一個低點。我們已經提到，兩個蹦跳的排列非常罕見，只佔所有 BARR 底部排列的 14%。當然，如果走勢完成第一個蹦跳，隨後又由趨勢線附近下挫，萬一你已經持有股票，即使知道兩個蹦跳案例非常稀有，恐怕還是不能得到多大的安慰。


