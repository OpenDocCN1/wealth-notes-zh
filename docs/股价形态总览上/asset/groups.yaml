    # 導論


    吉姆正在困境中掙扎。


    他是 JCB 超級市場的老闆，鎮上的競爭者把他打得落花流水；吉姆的帳冊上佈滿紅字。他決定採取行動：把 JCB 公開上市。他打算運用公開上市籌措的資金，買下競爭對手，同時在鎮上增添幾個店面。


    由於銷貨數量增加，使得吉姆能夠運用議價能力降低進貨成本。他把節省的部分成本轉移給客戶，獲利增加部分又再投資而成立更多的店面。


    吉姆打電話給他的朋友湯姆，告訴他有關業務擴充到全州的計畫。他們聊了一會兒，討論業務擴充的管理策略，彼此交換意見。掛掉電話之後，湯姆決定花一番功夫研究 JCB
    的營運。他拜訪了幾家 JCB 超級市場，看到的情況都非常類似：停車場擠滿車子，營業場所人來人往，顧客手推車上都堆滿商品，收銀櫃檯前面大擺長龍。他與一些顧客閒聊，嘗試瞭解顧客的性質，甚至向卸貨的供應商探聽一些消息。回到辦公室之後，他徹底分析
    JCB 的財務報表，並且研究競爭對手的情況。核對所有的細節之後，他打電話給自己的財務投資主管，指示他在 $10 以下買進 JCB 超級市場的股票。'
  - '[PAGE 22]


    擴充計畫的新聞傳開之後，金融市場開始恐慌。當時的經濟情況不太理想，甚至可能出現景氣衰退的狀況，顯然非常不適合擴充業務。JCB 股價跌破$10，湯姆的手下開始採取行動，默默吸進股票，沒有引起任何疑惑。可是，股價還是上漲了。先是回升到$11，然後繼續上漲到$12，最後攀升到$13
    才開始回檔。


    幾個月之後，經濟景氣仍然沒有起色。股價持續下跌到$9。湯姆打電話向吉姆查詢最近發生的一些新聞之後，又指示手下買進更多的股票。湯姆發現，吸進 JCB 股票的過程非常順利，因爲投資人賣出股票的意願很強，尤其是在年底節稅相關的賣壓中。


    六個星期之後，JCB 公佈銷售業績，結果遠超過預期。股價在幾分鐘之內上漲 15%，當天收盤價爲$10¼。這只不過是開始而已。六個月之後，整體情況顯示美國經濟不可能陷入衰退，每個人對於未來的發展都非常樂觀。JCB
    股票觸及$20。


    幾年之後，股票經過多次分割，假期即將來臨。在 JCB 超級市場的門外，湯姆與一些離去的顧客聊天，發現大家都有相同的抱怨：廣告中的特價品都不見了。湯姆開始深入調查，發現貨物分派管道發生嚴重的問題。JCB
    擴充得太快；每個星期增加一個店面，遠超出公司基本設施能夠應付的範圍。


    湯姆瞭解，這是開始賣出股票的適當時機了。他指示公司的投資部門拋售 JCB 股票，但價格不得低於$28¼。在股價跌破底線之前，大約賣出三分之一的持股。'
  - '[PAGE 23]


    由於當時正處於假期，市場買氣很強，每個人都嘗試買進一些什麼。沒有經驗的投資人，在他們認為便宜的價位大量買進。一些大型經紀商也開始介入，試圖拉高股價，但湯姆瞭解根本的情況。當
    JCB 股價回到先前的高點之後，湯姆拋售剩餘的全部持股。於是，股票掉头反轉。接下來的一個多月中，股價逐漸下跌，速度非常緩慢，完全沒有緊急逃生的氣氛，只有精明資金默默離場所激起的小漣漪。


    不久，假日銷售業績公佈，結果遠低於預期。市場出現一些謠言，包括：貨物分派問題、鋪貨錯誤與資金週轉問題。幾個星期之前還大力拉抬股價的經紀商，現在開始建議客戶賣出。JCB
    股價在一天之內暴跌 39%。


    少數分析師認為，JCB 股價已經超跌，投資人應該可以逢低承接。很多人遵循經紀人的建議而買進股票。結果是天大的錯誤。低檔的買進力道確實短暫推高股價，但新一輪的賣壓又出現。股價每天都下跌一點，就像海浪逐漸蠶食沙灘上的碉堡。兩個月的期間內，股價又下跌
    30%。


    JCB 超級市場宣佈，次一季盈餘可能遠低於市場估計水準。股價又下跌 15%。公司方面嘗試解決貨物分派的問題，但問題相當棘手。他們決定停止擴張，專心提高既有店面的獲利能力。


    兩年之後，湯姆攤開股價走勢圖。長期以來，JCB 股價一路躺平，就像心臟停止跳動一樣。他打電話給吉姆，閒聊 JCB 超級市場的未來展望。吉姆對於網際網路的新零售概念非常有'
  - '[PAGE 24]


    興趣。他很興奮的談論著，办公用品不需要營業場所就可以直接透過網路銷售。當然，其中還是涉及一些風險，因為網路商務仍然處於發展初期，但吉姆認為這個行銷管道的擴展應該非常快速。湯姆頗為認同，所以開始做這方面的研究，然後又買進
    JCB 股票。


    # 投資的足印


    如果你閉起雙眼，默想 JCB 超級市場的股價走勢，應該可以發現三種價格型態：雙重底（double bottom）、雙重頂（double top）與迴光返照（dead-cat
    bounce）。對於有經驗的投資人來說，價格型態並不是毫無意義的鬼畫符；它們代表精明資金的足跡。這些足跡即是精明資金累積財富的途徑。對於某些人——例如：湯姆——他們深入研究，經過周詳的考慮，然後才會在某支股票上建立部位。他們就是創造這些足跡的人。他們就代表設定遊戲規則的精明資金；這場遊戲——任何人都可以參與——稱為「投資」。


    關於交易決策，不論你採用技術分析或基本分析，都應該瞭解市場究竟在想些什麼。換言之，你應該詳細探究這些足印。這些足印可以帶你遠離懸崖，讓你及時出脫某支股票。印下這些足跡的腳，也就是踢醒你而向你許下賺錢承諾的腳。


    本書提供一些工具，讓你審視投資足印，這些足印透露一些玄機：股價走勢的方向、距離與可靠性。這些工具不會讓你發財；很少工具能夠辦到這點。可是，它們是通往財富寶庫'
  - '[PAGE 25]


    的鑰匙——務必善用。


    # 資料庫


    如果你想測試自己對於某個價格排列的認識程度，不妨嘗試告訴電腦如何辨識價格型態。撰寫本書的過程中，我花費很多工夫在這方面。電腦程式協助我發現、分析與挑選 15,000
    多個價格排列。電腦程式不能取代我的雙眼或大腦，而不過是另外一套輔助工具罷了。不妨把電腦程式看成另一雙客觀的眼睛，一位朋友碰碰你的肩膀說：「看看這裡，有一個蹦跳-奔馳反轉（bump-and-run
    reversal）。」


    為了收集本書所需要的統計資料，我挑選 500 支股票做為觀察對象，完全採用日線圖，涵蓋期間都是 5 年（由 1991 年中期到 1996 年中期）。這些股票包括道瓊工業指數的
    30 支成分股，以及各種市值規模的股票。我所挑選的股票排除一些對象：走勢太過於單調（5 年期間的走勢都很平坦）或波動過份劇烈（成交量太小或每天價格區間太大）。


    我通常會剔除價格在$1.00 以下的股票，因為這些公司隨時可能宣佈破產。資料庫內的股票，大多是在紐約證交所（NYSE）、美國證交所（AMEX）或那斯達克（NASDAQ）掛牌交易的美國著名公司。本書每章提供的說明範例，即是這些股票的代表性樣本。


    某些價格排列非常罕見，以至於 2,500 年（500 支股票乘'
  - '[PAGE 26]


    以 5 年）的日線圖資料都不夠運用。這種情況下，我就運用目前使用的資料庫，其中包括另一套 300 支股票的圖形，涵蓋期間剛好銜接前一個資料庫。


    # 1996 年~1996 年期間的股價表現


    正式探討本書的各種價格型態之前，最好回顧這段期間內的整體市場表現。圖 I-1 是 S&P 500 指數的月線圖。由 1991 年中期開始，我們發現市場走勢相當猶豫，這種情況一直拖到
    1992 年 1 月為止。該月份的行情突然向上發展，可能是受到 1 月效應（January effect）的影響；然後，在 5 月份之前，整體趨勢朝下發展。（所謂
    1 月效應，通常是指投資人基於節稅理由而在年底賣出股票，然後在 1 月份再買回。年底的賣壓未必會造成股價下跌，但 1 月份的買進經常造成短暫的推升力量。）1992
    年的年底，1 月效應似乎提早發生，股價在 12 月份向上突破整理而創新高。往後，股票市場基本上處於漲勢，直到 1994 年 3 月份出現暴跌走勢，接下來的五個月連續上漲，然後連續下跌四個月。1995
    年初，股票市場又恢復上升趨勢，而且步調加快。整個趨勢線的斜率非常陡峭，直到 1996 年初才遭遇一些亂流。


    這一切究竟有什麼意義？整體而言——包括這 5 年期間與圖 I-1 沒有涵蓋的另外 2、3 年——股票市場處於大多頭環境內。可是，雖然整體股票市場明顯向上，但某些個股未必如此幸運。有些股票持續下跌，另一些股票先是大漲，然後反轉向'
