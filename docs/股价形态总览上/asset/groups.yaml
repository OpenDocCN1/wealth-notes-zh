    ## 交易戰術


    表 6.4 列示下降擴張楔形的交易戰術簡要。採用衡量法則估計突破之後的最低目標價位。首先，把排列最高價減去最低價，這代表排列高度。當股價向上突破，由突破點向上衡量排列高度，結果就是突破之後的目標價位。


    ### 表 6.4 下降擴張楔形的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 取排列最高價與最低價之間的排列高度，由突破點向上衡量排列高度，結果就是向上突破之後的目標價位。 |

    | 等待確認 | 這種排列的失敗率很高（很多反轉型態），不適合在突破之前猜測突破的方向。等待收盤價突破之後，才進場建立順勢部位。 |

    | 部分跌勢 | 由上側趨勢線開始的部分跌勢向上反轉時，可以考慮買進。部分跌勢之後，經常出現向上突破。 |

    | 區間操作 | 如果排列的振幅很寬，可以考慮在下側趨勢線附近買進，然後在上側趨勢線附近賣出。如果出現部分漲勢而開始下跌，應該結束多頭部位，因為隨後很可能出現向下突破。反之，你也可以在上側趨勢線附近建立空頭部位，當價格觸及下側趨勢線而反彈，回補空頭部位。
    |

    | 停止 | 對於排列之內的區間操作，多頭部位的停損應該設定在下側趨勢線的稍下方，空頭部位的停損應該設定在上側趨勢線的稍上方，防範排列出現突破走勢。當走勢朝有利方向發展，應該調整停損點，可以考慮支撐或壓力水準。
    |


    附註：除非進行區間操作，否則務必等待收盤價突破，然後順著突破方向進行交易。


    圖 6.6 說明衡量法則的計算過程。排列最高價為 $47^{1 / 4}$ 減去排列最低價 $42^{1 / 8}$ ，結果是排列高度（ $5^{1 / 8}$
    ）。把排列高度加上突破當天的最低價（ $44^{1 / 2}$ ），目標價位是 $49^{5 / 8}$ 。把這個價位視為突破之後的最低目標。計算排列高度採用最高價與最低價，代表排列最寬的距離。為了保守起見，我採用突破當天的最低價向上衡量排列高度。


    如果你考慮買進這支股票，最初或許還不能判斷擴張楔形正在形成當中。隨著時間經過，等到有足夠數量的轉折高點與低點，就分別銜接它們，繪製兩條趨勢線。接下來就是等待


