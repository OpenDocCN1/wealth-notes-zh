    | 反彈 | 價格稍微向上反彈。不要被騙，跌勢還沒有結束。 |  |

    | 下跌 | 反彈結束之後，展開另一波跌勢。這波下跌走勢比較平緩，但通常會出現另外 5%到 25%的跌幅。 |  |'
