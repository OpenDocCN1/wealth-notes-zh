    我們可以運用衡量法則，估計突破之後的目標價位。「交易戰術」一節曾舉例說明目標價位的計算過程，把排列的最高價減去最低價，結果是排列高度，然後由突破位置向上或向下衡量排列高度，結果就是突破之後的目標價位。一般來說，這個目標價位代表最低的目标價位。下降擴張排列向上突破的目標價位達成率為
    89%，向下突破只有 69% 的案例會到達或超過目標價位。我個人認為，目標價位達成率應該超過 80% 才具有可靠性，所以向下突破的數據太低。


    排列的平均時間長度大約是 3 個月（88 天），突破之後需要 3 個月（向下突破）或 5 個月（向上突破）的時間才會到達最後極端價位。向上突破到達最後峰位所需要耗費的時間較長，這點相當合理，因為向上突破平均漲幅（27%）大於向下突破平均跌幅（19%）。換言之，距離愈遠，所需要的時間愈久。


    部分漲勢是指價格由排列下側向上發展，但還沒有到達上側趨勢線之前就向下反轉；一旦發生這種走勢，結果有 58% 的案例向下突破。相對於純粹巧合，這個比率並不算高。可是，如果發生部分跌勢——價格由排列上側向下發展，但還沒有到達下側趨勢線之前就向上反轉——結果有
    78% 的案例向上突破。這個比率就具有策略意義：如果你看見價格跌勢到達下側趨勢線之前就向上反轉，不妨考慮買進。


