    56%）。


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 第一峰位成交量較大的案例百分率 | 57% |

    | 成交量呈現下降趨勢的案例百分率 | 256/454 相當於 56% |

    | 相對於突破前一天，突破當天與隨後 5 天的成交量 | 191%，158%，124%，113%，116%，112% |

    | 小量突破，隨後發生回升走勢的百分率 | 65% |

