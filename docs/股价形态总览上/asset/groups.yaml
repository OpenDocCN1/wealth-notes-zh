    30 度到 45 度之間。沿著柄部的相對高點繪製一條趨勢線，隨後當價格向上突破這條趨勢線，代表排列已經完成的買進機會。


    BARR 底部排列允許前奏階段出現水平狀的趨勢線，顯然不同於 BARR 頸部排列。這種情況很罕見，或許也應該避免。柄部最好還是朝右下方傾斜，這類案例的續效最理想。


    趨勢線形成之後，計算前奏階段的高度。這是衡量柄部（排列最早的四分之一部分）的最寬垂直距離，由趨勢線位置到盤中低價之間的距離。請參考圖 7.2，柄部最寬距離發生在
