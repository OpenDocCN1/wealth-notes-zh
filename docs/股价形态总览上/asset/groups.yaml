    處於大多頭行情中，多頭型態的發生頻率較高，失敗的可能性較少，漲勢延伸的期間較長。大環境很理想——漲潮會載浮所有的船隻。


    普通常識告訴我們，空頭排列失敗的機會較高，跌勢比較緩和。空頭型態可能消失；根本不會出現。股票經過一段漲勢之後，你預料會發生空頭反轉，但價格還是繼續走高，只是暫時停頓喘口氣而已。


    統計數據也反映前述的現象。多頭排列——這類價格型態通常出現在下降趨勢之後，意味著行情將向上反轉——的發生頻率高於空頭排列。等腰三角形（symmetrical
