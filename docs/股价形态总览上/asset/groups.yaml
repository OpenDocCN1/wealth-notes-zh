    ## 當日沖銷 / 部位交易 / 買進-持有的投資


    撰寫本書的過程中，我不斷考慮一個問題：價格型態運用上的最佳時間架構究竟是什麼？最適用於當日沖銷？部位交易？或買進-持有的投資？這些問題的答案都是肯定的。圖形排列可以協助當日沖銷者——這些人建立與結束交易部位的時間發生於同一天。許多當日沖銷者透過價格型態判斷支撐與壓力。他們只挑選可靠的價格排列進行短線交易。


    部位交易者的持有期間超過一天，但不會超過幾個月。這種情況下，圖形排列可以用來設定進場點與出場點。我把自己歸類爲部位交易者。如果某筆交易進行得不順利，就立即出場。如果交易進行得很順利，就沒有必要急著出場。當獲利達到最大，或者股票走勢已經告一段落，我就考慮結束部位。如同當日沖銷者一樣，我也嘗試挑選最可靠的價格型態，希望在最短時間內，取得最大的獲利。


    對於買進-持有的投資人，圖形排列也可以提供進場與出場的訊號。我最近買進一家石油服務公司的股票，相信這項投資在兩、三年之內不會有顯著的報酬（結果判斷錯誤：股價在三個星期之內上漲一倍）。按照當初的想法，我估計這支股票的價格在三年之後可以到達
    30 多塊，大概是最低價的六倍。或許稱不上潛力黑馬股，但也不會很溫馴。短期內的发展並不順利，我趁著股價下跌而加碼買進。由於我是基於長期觀點進行投資，所以願意持續低價買進。如果這支股票沒有任何表現，那麼我對於行情趨勢的判斷就發生錯誤，但也可以因此而得到一場教訓。


    ## 交易範例


    我們討論價格型態時，經常引用一些「交易範例」，這些範例都屬於虛構的例子，只有等腰三角形底部的一筆交易爲例外。書中提到這些交易範例，主要是爲了說明我所希望強調的技巧。相關的人物純屬虛構，發生的背景或許有些不尋常，但我希望讀者能夠體會如何增加獲利與侷限損失。


    ## 你是否喜歡這本書……


    如果我花錢買下一本書，當然希望有一些收穫。我經常抱怨自己完全不能由一本書中學習任何東西。另一些書籍提供的資訊非常有意思，但沒有實際的用途，或是因爲內容太深奧或成本太昂貴。


    我希望本書能夠提供真正的價值。讀者很容易查閱相關的資訊，目錄按照英文字母順序列示所有的型態名稱，每章開頭都列示價格型態的摘要資料，相關的建議也清楚顯示在表格中。每種價格型態都透過許多例子說明。可是，如果你嘗試由頭到尾閱讀本書，恐怕會昏昏欲睡——即使你患有最嚴重的失眠症也是如此。所以，不妨把本書看成一本工具書，進行交易之前，參考對應的章節。


    如果本書協助你避開某些交易虧損，給你扣動扳機的勇氣，提高你的交易信心，或讓你的獲利增加，那麼我的目標就達成了。


    ## 擴張底排列


    ![](img/843a88de0b50d7a36e65238281a4e722_38_0.png)


    ### 摘要資料


    #### 向上突破


    - 外觀: 排列發生之前，曾經出現延伸性的跌勢。喇叭狀的型態，高點持續墊高，低點持續創下滑。向上突破。

    - 反轉或整理: 短期的（少於 3 個月）多頭反轉排列。

    - 失敗率: 2%。

    - 平均漲幅: 25%，最經常發生報酬率低於 10%。

    - 成交量趨勢: 不規則，通常隨著價格起伏：價漲量增 / 價跌量縮。

    - 價格目標達成率: 59%。

    - 意外發現: 排列末端出現部分漲勢，向下突破的可能性為 67%；排列末端出現部分跌勢，向上突破的可能性為 80%。

    - 參閱排列: （ 2 ）上升直角三角形擴張排列，（ 3 ）下降直角三角形擴張排列，（ 4 ）擴張頂排列，（ 5 ）上升擴張楔形排列，（ 6 ）下降擴張楔形排列。


    #### 向下突破


    | 特質 | 說明 |

    | :--- | :--- |

    | 外觀 | 排列發生之前，曾經出現延伸性的跌勢。喇叭狀的型態，高點持續墊高，低點持續創下滑。向下突破。 |

    | 反轉或整理 | 短期的（少於 3 個月）空頭整理排列。 |

    | 失敗率 | 6%。 |

    | 平均跌幅 | 27%，最經常發生跌幅介於 15% 與 20% 之間。 |

    | 成交量趨勢 | 不規則，通常隨著價格起伏：價漲量增 / 價跌量縮。 |

    | 價格目標達成率 | 70%。 |

    | 參閱排列 | （2）上升直角三角形擴張排列，（3）下降直角三角形擴張排列，（4）擴張頂排列，（5）上升擴張楔形排列，（6）下降擴張楔形排列。 |


    整理擴張底（broadening bottoms）的統計數據時，我必須重複查證，因為相關的結果不太尋常。在擴張底排列中，向下突破的績效超過向上突破。就整體價格型態而言，多頭排列的平均漲幅大約為
    40%，空頭排列的平均跌幅大約為 20%；可是，擴張底向上突破的平均漲幅只有 25%，擴張底向下突破的平均跌幅卻有 27%。這項資料告訴我們，擴張底雖然可能向上突破，但這種型態基本上屬於空頭排列。如果型態向上突破，價格漲幅低於多頭型態平均水準（25%<40%），如果向下突破，價格跌幅超過空頭型態平均水準（27%>20%）。


    報酬率次數分配所反映的最經常發生報酬率大約符合我們的預期：向上突破的漲幅為 10%，向下突破的跌幅介於 15% 到 20% 之間，後者相對較高。


    型態的失敗率非常低：向上突破為 2%，向下突破為 6%。關於失敗率，只要讀數低於 20%，我認為就可以接受。


    擴張底的發展過程中，如果某次回檔只出現部分跌勢（換言之，該次回檔低點沒有觸及或靠近下側趨勢線），隨後反彈走勢向上突破的發生頻率為 80%；如果某次反彈只出現部分漲勢（換言之，該次回彈高點沒有觸及或靠近上側趨勢線），隨後折返走勢向下突破的發生頻率為
    67%*。


    ### 緣起


    讀者或許希望知道，擴張底與擴張頂（broadening top）之間究竟有什麼差別。就型態本身而言，兩者的結構完全相同，差別在於型態發生之前的走勢。擴張底發生之前，價格出現延伸性下跌趨勢；擴張頂發生之前，價格出現延伸性上漲趨勢。透過這個方法區別這兩種價格型態，雖然有些武斷，但我可以按照價格型態發生在
    12 個月價格區間內的位置來區別擴張底與擴張頂（擴張排列位在價格區間的上半部，視為擴張頂，位於下半部，則視為擴張底）。可是，這種方法也有問題，萬一擴張排列發生在年度價格區間的中央，究竟應該視為擴張頂或擴張底？


    所以，採用擴張排列發生之前的價格趨勢，也不一定能夠有效界定擴張頂與擴張底。如果這個價格趨勢呈現水平狀，或在排列開始之前突然變更方向，我就採用移動平均。換言之，考慮
    90 天期移動平均的趨勢向上或向下。一旦知道排列發生之前的趨勢發展方向，就可以定義擴張頂或擴張底。


    某些人不認為擴張底排列存在，因為他們把所有的擴張排列都歸納爲擴張頂。我決定區分這兩者，因為它們的表現或行爲不同。關於型態分析，讀者也許希望結合兩者的統計數據，或進行自己的研究。


    圖 1.1 是擴張底的範例。這屬於 5 點反轉的排列，因爲總共有 5 個反轉點或轉折點，包括 2 個轉折低點與 3 個轉折高點。5 點反轉的情況相當罕見，在我考慮的
    77 個擴張底排列中只有 5 個。由 8 月底開始，價格出現延伸性跌勢，低點出現在排列開始之前的第 2 天。價格由這個低點向上反彈，然後出現第 1 個反彈高點，我仍然認為整個價格趨勢向下發展而進入擴張底排列。


    ![](img/843a88de0b50d7a36e65238281a4e722_41_0.png)


    圖 1.1 擴張底排列，屬於 5 點反轉的類型，因爲有兩個反轉低點（標示爲 2 與 4）與三個反轉高點（標示爲 1、3 與 5）。


    圖 1.1 的擴張底排列出現部分跌勢。價格由 $26（點 5）向下折返到 $24½，位置遠高於前一波折返走勢的低點（點 4），然後向上反彈而穿越點 1 /
    點 3 / 點 5 的延伸壓力線。大約在一年之後，股票創 $38½ 的高價。


    ### 辨識準則


    表 1.1 列示擴張底的辨識準則。擴張底排列發生之前，價格趨勢向下。在排列開始之前，可能出現短暫的價格上漲走勢，這部分漲勢可以忽略，仍然視為底部排列。這個辨識準則也符合直覺：底部應該發生在價格下降趨勢之後，延伸性價格漲勢的末端顯然不應該發生底部排列。


    排列的形狀很清楚。這讓我想起混沌理論，一系列的小型上下起伏，偶爾發生無限的突兀撬動，造成重大的破壞。在股票市場，價格持續創新高，折返低點也持續創新低。如果繪製一條趨勢線銜接高點，另一條趨勢線銜接低點，排列的形狀類似喇叭型態。


    表 1.1 擴張底的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 價格趨勢 | 進入排列的中期價格趨勢應該向下。 |

    | 形狀 | 喇叭狀型態，高點持續墊高，低點持續下滑。 |

    | 趨勢線 | 價格遵循兩條趨勢線：銜接高點的趨勢線向上，銜接低點的趨勢線向下。 |

    | 觸及點 | 至少需要兩個轉折高點與兩個轉折低點，但轉折高點與轉折低點不一定交替出現（譯按：參考表 1.4 的解釋）。 |

    | 成交量 | 不規則，但通常是價漲量增，價跌量縮。 |

    | 突破 | 突破方向可能朝上或朝下，在明確突破之前，也可能出現長達數個月的橫向走勢。 |


    銜接高點與銜接低點的兩條趨勢線很重要。銜接高點的趨勢線應該朝上傾斜，銜接低點的趨勢線應該朝下傾斜。這兩條趨勢線的方向相互發散，使得擴張底不同於其他排列，例如：直角三角形擴張排列（其中一條趨勢線爲水平狀）或擴張楔形（兩條趨勢線都向上或向下傾斜）。所以，擴張底的兩條趨勢線必須朝不同方向傾斜（上側趨勢線向上傾斜，下側趨勢線向下傾斜）。


    擴張底至少需要兩個轉折高點與兩個轉折低點，如此才能構成有效的排列。換言之，如果轉折高點或轉折低點的個數少於兩個，就不能界定擴張底排列。何謂轉折高點或轉折低點呢？在某個排列內，價格經過一段上漲，然後向下拉回，在上檔形成顯著的反彈峰位，這稱爲轉折高點。轉折低點的定義也非常類似：價格經過一段下跌，然後向上反彈，在下檔形成顯著的折返底部，這稱爲轉折低點。圖
    1.1 顯示五個轉折點，包括三個轉折高點（標示爲奇數）與兩個轉折低點（標示爲偶數）。請注意，轉折高點與低點不需要交替出現（如同圖 1.1 顯示的情況），只要能夠找到兩個峰位與兩個谷底——不管發生的位置如何——就可以了（譯按：請參考表
    1.4 的解釋）。


    成交量的發展沒有什麼特殊之處。我由排列開始到排列結束（不是突破點，後者通常發生在排列結束之後的一個月）進行迴歸分析，發現成交量增加的情況大約只佔 58%（向上突破）或
    59%（向下突破）的案例。所以，擴張底成交量增加的可能性，只稍高於純粹的巧合，不足以歸納出任何明確的結論。


    如果你仔細觀察擴張底排列，就會發現成交量大多配合價格走勢發展。在圖 1.1 中，當價格由峰位 1 下跌到谷底 2，成交量縮小。當價格由谷底 2 上漲到峰位
    3，成交量放大。可是，我們可以確定一點：成交量呈現不規則變動，價漲量增／價跌量縮只是大致上的情況，這個準則經常不成立。當我挑選擴張底排列的時候，完全忽略成交量型態。


    在擴張排列的發展過程中，突破點很難辨識。如果由事後角度觀察，顯然相當容易。我觀察價格穿越上側或下側趨勢線的位置，或價格在排列結束之後出現持續性的走勢。如果價格在排列之內貫穿趨勢線，貫穿點就是突破點。如果價格上漲而沿著上側趨勢線發展，但沒有貫穿趨勢線，則由先前一個轉折高點畫一條水平直線，一旦價格向上貫穿這條水平直線，貫穿點就視為突破點。（譯按：一段明顯的走勢沒有觸及或靠近對應趨勢線，擴張排列就告結束，雖然當時還沒有發生突破。）


    讓我們考慮一個例子。請觀察圖 1.2 的擴張底。在排列出現的前一個月內，價格趨勢明顯朝下發展。兩條趨勢線向外發散，這是擴張底排列的典型結構。轉折高點與轉折低點的數量都不只兩個，符合表
    1.1 的「觸及點」準則。


    ### 交易案例


    #### Standard Microsystems Corp.（電腦與周邊，NASDAQ，代碼 SMSC）


    ![](img/843a88de0b50d7a36e65238281a4e722_45_0.png)


    圖 1.2 當價格上升穿越排列的最高點（A 點），擴張底視為突破。


    突破的位置在哪裡？目前這個例子很容易判斷。如果延伸上側趨勢線，我們發現隨後的價格走勢顯然向上穿越趨勢線，這意味著向上突破確實發生。接下來，讓我們決定突破的位置：由排列內的最高點（A
    點；換言之，最近的轉折高點）繪製一條水平直線，價格向上穿越這條直線的位置就是突破點*。


    圖 1.2 是典型的擴張底排列。向上突破發生在$18，突破之後的最高價爲$23½，由突破點衡量的漲幅爲 23%，幾乎等於擴張底向上突破的平均漲幅 25%。


    #### 失敗案例


    擴張底排列的失敗案例總共只有三個：由好的方面來說，我們不需過份擔心排列失敗的可能性；由壞的方面來說，案例太少而不能提供有效的資訊。圖 1.3 是三個擴張底失敗的案例之一。由
    4 月份到 8 月份之間的價格排列顯示，這似乎是一波暴跌走勢之後的迴光返照型態（dead-cat bounce）。任何股票只要顯現迴光返照的型態，不論排列多麼誘人，我都不建議介入。在隨後的
    6 個月到 1 年期間內，股票逐漸復甦而恢復常態（或解決股價發生暴跌的原因）。


    #### American Brands, Inc.（煙草，NYSE，代碼 AMB）


    ![](img/843a88de0b50d7a36e65238281a4e722_48_0.png)


    圖 1.3 這個擴張底排列發生在迴光返照型態的復甦過程中。當收盤價向下貫穿排列低點，向下突破視為完成。A 點顯示盤中價格向上穿越排列高點，但收盤價並沒有穿越，所以不視為向上突破。這個擴張底排列之所以失敗，因爲價格向下突破之後，並沒有出現
    5% 以上的跟進走勢，就開始向上反轉。


    在排列發生之前的 3 個星期，價格出現迴光返照的巨幅反彈過程。由 6 月份開始，價格在排列頭部出現水平狀盤整，持續到 8 月初轉趨下跌。這段過程內，價格向上穿越排列高點（參考
    A 點）。


    我所謂的突破，是指收盤價突破而言。就圖 1.3 來說，首先發生盤中突破的當天收盤價為 $33^{7} /_{8}$，遠低於排列高點 $34^{1} /_{4}$，所以不視為向上突破。兩天之後，盤中價格再度向上穿越
    A 點，但收盤價還是低於排列高點。


    價格嘗試向上突破而失敗之後，由 7 月中旬開始走軟。8 月底之前，收盤價跌破排列低點；當時，排列低點為 $30^{3} /_{8}$，8 月底的最低收盤價為
    $29^{7} /_{8}$。雖然收盤價向下突破排列低點的程度只有 50 美分，但已經構成有效的向下突破。在向下突破發生之後的一個星期內，價格暴漲到 $33$，然後繼續上升，只是趨勢稍微緩和。


    圖 1.3 是我所謂的 5% 失敗狀況：價格雖然向下突破，但沒有出現 5% 以上的跟進跌勢，就開始向上反轉。同樣的定義也適用於向上突破的失敗狀況：價格雖然向上突破，但沒有出現
    5% 以上的跟進漲勢，就開始向下反轉。


    ### 統計數據


    表 1.2 顯示擴張底向上突破與向下突破的一般統計數據。在我通常採用的 500 支股票 5 年期資料庫中，由於擴張底的案例不多，所以此處也包括我目前使用的
    300 支股票資料庫，期間大約是 3 年，剛好銜接前一個資料庫的時間，沒有重疊的部分。


    請注意，相對於 1991 年 ~ 1996 年的 5 年期間（2,500 年的日線價格資料），1996 年 ~ 1999 年的 3 年期間（900 年的日線價格資料）的擴張底案例較多，前者爲
    35 例，後者爲 42 例。


