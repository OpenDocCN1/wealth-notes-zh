    ### 失敗案例


    雖然雙角底排利的失敗率很低（11%），還是應該留意失敗的可能性。請參考圖 22.3 的 5% 失敗案例。所謂「5% 失敗」，是指價格最初朝正確方向發展，但沒有出現足夠程度的走勢（跟進漲幅不超過
    5%），就開始朝另一個方向反轉。這兩支向下的突兀線形看起來很不錯，長度足夠，價格重疊部分也很多。這個案例發生在回檔過程中；回檔整理結束之後，價格很可能回升到先前的高點（形成雙重頂排列），甚至再創新高。如果你認為隨後的走勢可能演變爲雙重頂型態，目前這個雙角底排列就不值得操作，因為上檔的空間不夠大。


