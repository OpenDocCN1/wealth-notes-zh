    成交量不太尋常，唯一的大量發生在頭部形成之後的向上走勢中。右肩的成交量實在太小。


    右肩形成之後，漲勢相當果斷，尤其是最後向上突破頸線的走勢。可是，向上突破之後，就沿著頸線附近盤整，經過兩個星期之後，價格向下反轉。


    這個排列雖然向上突破，但價格穿越頸線的程度不足 5%。價格必須上漲到$39^{3/8}$，才滿足 5% 的最低門檻，但實際上並沒有。結果就是 5% 失敗的情況：價格向上突破之後，必須出現
    5% 或以上的跟進漲勢，否則就白忙一場。


    我仔細觀察資料庫內的失敗案例，嘗試瞭解排列失敗與成交量偏低之間是否存在關聯。結果，我發現兩者之間沒有顯著的關聯。在 18 個失敗案例中，只有 8 個排列（44%）的突破成交量偏低。可是，我必須承認一點，失敗案例的樣本數量太少（通常至少需要
    30 個樣本才具有統計意義）。


