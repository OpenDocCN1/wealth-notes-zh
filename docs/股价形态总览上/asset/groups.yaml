    # 交易範例


    我們討論價格型態時，經常引用一些「交易範例」，這些範例都屬於虛構的例子，只有等腰三角形底部的一筆交易爲例外。書中提到這些交易範例，主要是爲了說明我所希望強調的技巧。相關的人物純屬虛構，發生的背景或許有些不尋常，但我希望讀者能夠體會如何增加獲利與侷限損失。


    # 你是否喜歡這本書……


    如果我花錢買下一本書，當然希望有一些收穫。我經常抱怨自己完全不能由一本書中學習任何東西。另一些書籍提供的資訊非常有意思，但沒有實際的用途，或是因爲內容太深奧或成本太昂貴。


    我希望本書能夠提供真正的價值。讀者很容易查閱相關的資訊，目錄按照英文字母順序列示所有的型態名稱，每章開頭都列示價格型態的摘要資料，相關的建議也清楚顯示在表格中。每種價格型態都透過許多例子說明。可是，如果你嘗試由'
