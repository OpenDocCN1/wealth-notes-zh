  mdcn: '

    繼續上漲。1993 年 4 月中旬，走勢出現最終高點 $40.26，接著向下反轉。


    當你看見某個潛在雙重底，進行交易之前，最好先查核辨識準則。圖 12.8 的例子中，第一個底部發生之前曾經出現下降趨勢。兩個底部之間的漲勢大約 13%，勉強符合
    10% 的最低門檻。兩個底部的價位大致相同，相隔好幾個月。


    第一底部的成交量很大，第二底部的成交量明顯縮小，這是雙重底的典型現象。排列過程中，由第一底部到第二底部之間，成交量趨勢下降，這也是正常現象。


    第二底部完成之後，就可以透過衡量法則估計向上突破之後的最低目標價位。如果獲利潛力夠大，就值得等待突破。請注意，由於排列的失敗率高達 64%，必須等待收盤價實際向上突破。如果你想知道搶先動手的後果，請參考圖
    12.5。


    收盤價向上穿越確認點，代表突破完成的訊號。確認點只不過是兩個谷底所夾峰位的最高價。請參考圖 12.8，A 點就是確認點，向右延伸的水平直線代表突破點。


    一旦收盤價超過突破點，是否就應該進場買進？未必見得。向上突破之後，大約有三分之二的排列回挫到突破點附近，所以最好還是繼續等待。價格回挫到突破點之後，雖然可能繼續下跌，但反轉回升的可能性較高。總之，你應該等待價格止跌回升，然後才進場買進。話說回來，等待回挫走勢也意味著你將錯過一些機會。


    對於短線交易，適合在目標價位附近獲利了結。雙重底排列的目標價位達成率只有 68%。所以，在目標價位附近，只要出現弱勢的表現，最好立即獲利出場。


    對於中期與長期投資人來說，評估基本面的情況，藉以決定是否應該繼續持有部位。原則上，雙重底排列只適合用來設定進場時效，至於是應該買進或持有，最好由基本面的角度考慮。


    ## 交易範例


    林小姐是一位小學老師。雖然很喜歡和小孩子混在一起，但她更希望透過國際網路從事股票短線交易。


    當她看見圖 12.8 的潛在雙重底排列，就愛上這個交易機會。圓形底的走勢（由 A 點到突破點之間），意味著價格將繼續走高。可是，她克制提早進場的衝動，因為價格並不保證能夠向上穿越確認點。她假裝自己在教學生們進行交易，如果不能以身作則，如何期待學生的表現呢？


    當價格到達兩個谷底所夾的高價，林小姐決定進場買進。實際遞單之前，她打電話向經紀人查詢當時的 TRANSACTION 價格。結果，價格遠高於確認點，所以她決定等待回挫走勢。


    突破的四個星期之後，價格回挫到突破點，但是否會繼續走低呢？林小姐繼續等待，直到她相信股價將回升爲止。這發生在隔天 11 月 27 日，當天低價高於前一天的低價，她覺得可以進場。當然，這是一場賭博，因為兩天的上漲不足以構成趨勢。雖說如此，但她已經不耐煩；不願意繼續等待，不希望空手望著價格回升。所以，她進場買進，成交價格為
    $31^{3/8}$。


    隔天，突然爆出 300 萬股的大成交量，價格跳升 3/4 點。突兀狀的走勢讓她覺得緊張，因為這可能是單日反轉（one-day reversal），但價格收在最高價附近，似乎不可能是單日反轉。可是，林小姐還是立即把停損點設定在最近轉折低點的下方
    1/4 點處，實際停損價位是 $30^{7/8}$。


    次一天，價格下滑，但接下來幾天的走勢都上漲。12 月中旬，漲勢轉趨強勁，很快就達成目標價位。林小姐不確定自己是否應該獲利了結，還在三心兩意的時候，股價已經下跌到上升趨勢線附近（銜接
    1992 年 9 月底、10 月底、12 月初與 12 月底等低點的趨勢線），所以只有繼續等待。


    隨後出現起伏相當大的漲勢。3 月底，股價突然向上躍升，一天之內幾乎上漲 1% 點。對於這支股票來說，1% 點是非常大的走勢，林小姐覺得其中必有蹊蹺。她嚴密追蹤股價的發展，不久就發現這支股票處於蹦跳-奔馳反轉排列（bump-and-run
    reversal）的蹦跳階段。隨著價格持續走高，她繪製 BARR 趨勢線與平行的賣出線。觀察走勢圖，她看見一個很窄的峰位，曉得漲勢即將結束。當股價跌破最近的賣出線，她下單賣出股票，成交價格為
    $38^{7/8}$。


    這筆交易的獲利為 22%，年度化報酬率為 60%。她覺得非常滿意，因為這是在課堂裡講解年度化報酬率的最佳範例。


    # 雙重頂排列


    ![](img/843a88de0b50d7a36e65238281a4e722_313_0.png)


    ### 摘要資料


    - **外觀** 兩個顯著的峰位，相隔一段期間，價位大致相同。

    - **反轉或整理** 短期的（長達 3 個月）空頭反轉排列。

    - **失敗率** 65%。

    - **等待突破之後的失敗率** 17%。

    - **平均跌幅** 20%，最經常發生漲幅為 10%~15%。

    - **成交量趨勢** 突破之前呈現下降趨勢。

    - **回升** 69%。

    - **價格目標達成率** 39%。

    - **意外發現** 兩個峰位間距愈近，所夾谷底愈深，突破成交量愈大，隨後的跌勢也愈嚴重。

    - **參閱排列** （21）複雜頭肩底排列；（23）雙角底排列


    針對雙重頂排列（double tops）所做的研究，出現一些令人意外的結果。失敗率高達 65%，甚至還不如投擲銅板。在雙重頂排列還沒有突破之前，如果盲目賣出股票，後悔的機率頗高。反之，如果等待突破之後才賣出股票，大約有
    83% 的機會屬於明智決策。可是，決策或許正確，但大約有半數案例（47%）的跌幅不超過 15%，將近三分之二的案例（61%）不能達成目標價位。雙重頂排列顯示的績效統計數據實在太差，面對這個公認的空頭反轉排列，賣出股票之前恐怕還要再三考量。


    向下突破之後，價格回升到突破點的發生頻率很高（69%）。如果你打算賣出股票，或許應該等到股價重新回升到突破點附近。


    兩個峰位間距較小的雙重頂，突破之後的平均跌幅反而超過那些峰位拉得較開的排列。兩個峰位的間距不大，投資人比較容易辨識雙重頂，介入操作的意願較高。


    兩個峰位所夾谷底的深度，以及突破之後的跌幅，兩者之間也存在關聯。谷底跌幅愈深的排列，績效愈理想。


    大量突破與小量突破對於排列績效的影響，也存在統計上顯著的差異。詳細來說，排列夾著大量進行突破，隨後跌勢通常較嚴重。深入的討論，請參考「統計數據」一節。


    ### 緣起


    除了頭肩排列之外，雙重頂可能是最通俗的一種型態。初學的投資人看到股價走勢圖出現兩個峰位，經常就判定為雙重頂排列。實際的情況或許沒有那麼單純；真正有效的雙重頂需要一些構成條件。我稍後會詳細討論型態的辨識準則，但首先說明這個排列的形状。


    請參考圖 13.1 的例子。雙重頂排列的最大特色當然是兩個顯著的峰位，它們的價位大致相同，相隔一段時間距離。第一個峰位出現之前，曾經出現一段延伸性上升趨勢，第二個峰位發生之後，價格呈現跌勢。


    兩個峰位所夾谷底的跌幅應有 10% 或 20%，甚至更多。


    **Pacific Scientific (精密儀器, NYSE, 代碼 PSX)**


    ![](img/843a88de0b50d7a36e65238281a4e722_315_0.png)


    這個谷底稱為雙重頂排列的確認點（confirmation point）或確認水準。當價格形成第二個峰位而向下跌破確認點，雙重頂排列才經過確認；換言之，雙重頂排列這個時候才正式完成。


    雙重頂向下突破之後，價格經常會回升到突破點附近（請參考圖 13.1）。回升走勢讓投資人有第二個機會，在正式下跌之前出脫股票。對於態度比較積極的交易者，回升走勢也是建立空頭部位的良機。


    ### 辨識準則


    表 13.1 列示一些雙重頂排列的辨識準則。第一部分說明排列發生之前的整體價格趨勢朝上。雙重頂第一個峰位出現之前的價格走勢，不應該是延伸性下降趨勢的向上折返，而應該呈現類似如圖
    13.2 的階梯狀漲勢。當然，實際的漲勢可能更快速。總之，雙重頂應該是數個月延伸性上升趨勢的頭部反轉排列。


    在圖 13.2 中，波段漲勢起始於 1993 年 10 月份，峰位出現在 1994 年 3 月份。這波漲勢由低點 $25½$ 上漲到高點 $40$。第一個峰位之後出現幾個月的跌勢，然後回升創第二個峰位。第二個峰位的價格為
    $39$，較第一個峰位低 2.5%。


    第二個峰位形成之後，價格穩定下跌，不久就貫穿兩個峰位所夾谷底的確認點。這個時候，排列才正式向下突破而完成所謂的雙重頂型態。請注意，唯有當收盤價向下穿越突破點，雙重頂排列才算正式完成。


    **Trinova Corp. (機械, NYSE, 代碼 TNV)**


    ![](img/843a88de0b50d7a36e65238281a4e722_317_0.png)


    圖 13.2 週線圈的雙重頂排列。第一峰位 $40$ 的起漲點在 $25½$，這波漲勢的期間為五個月。收盤價向下跌破確認點，代表向下突破，也宣告排列正式完成。


    第二個峰位形成之後，價格跌勢可能很快反轉為漲勢。這個漲勢可能形成第三個峰位，也可能繼續上漲。總之，在第二個峰位形成之後，大約有三分之二的案例，價格根本不會向下買穿確認點，反而向上穿越兩個峰位而繼續創新高。稍後的「失敗案例」一節會深入探討這方面的價格行為。


    正常的成交量型態如下。第一個峰位的成交量通常大於第二個峰位，突破過程也會出現大量。整個排列過程中，成交量呈現下降趨勢，請參考圖 13.2。突破量的放大速度，約略等於第一個峰位——成交量雖然擴大，但又不特別大。突破量愈大，隨後的跌勢經常愈嚴重，但夾量突破並不是雙重頂排列的必要條件。


    **表 13.1 雙重頂排列的辨識特質**


    | 特質 | 討論 |

    | --- | --- |

    | 先前的價格上升趨勢 | 排列發生之前，短、中期，（3~6個月）價格趨勢朝上，出現第一個峰位之前，上升趨勢沒有出現更高的峰位。 |

    | 兩個峰位之間的跌勢 | 兩個峰位之間所夾的谷底跌幅至少是10%（由峰位最高價衡量到谷底最低價），某些分析家要求跌幅至少為20%。兩個峰位的間距為1個月或以上（谷底愈深，排列的績效愈理想）。谷底通常呈現圓弧狀，但也有不規則的走勢。
    |

    | 兩個峰位 | 兩個顯著的峰位，價格差距應該維持在3%以內。實際的價位並不重要；總之，兩個峰位的價位看起來應該相同，而且不隸屬於同一波走勢。 |

    | 峰位間距 | 兩個峰位至少相隔幾個星期。如果間距太寬，不妨採用週線圖。 |

    | 第二個峰位之後的跌勢 | 第二個峰位出現之後，在跌勢向下穿越確認點之前，不應該向上穿越第二個峰位的最高價。 |

    | 成交量 | 第一個峰位的成交量通常大於第二個峰位。排列的整體成交量型態呈現下降趨勢。 |

    | 突破量 | 通常夾量突破，但不是必要條件。突破量愈大，隨後的跌勢愈重。 |

    | 確認點 | 確認點是兩個峰位所夾谷底的最低價，藉以確認雙重頂的效力。當收盤價向下穿越確認點，雙重頂即告完成或突破。 |


    雙重頂形成的缘由如何？請參考圖 13.3，這是一個非常典型的例子，完全符合表 13.1 的辨識準則。在雙重頂排列發生之前，波段漲勢起始於 1992 年 10
    月份的 $9^{7/8}$。最初，成交量沒有顯著放大，但隨後則偶爾爆出大量。類似如 3 月份與 4 月份的情況，突兀狀的大量推動價格走高。


    **USF & Corp. (保險 [產物 / 意外] , NYSE，代碼 FG)**


    ![](img/843a88de0b50d7a36e65238281a4e722_319_0.png)


    圖 13.3 標準的雙重頂排列。排列完成之後，價格在三年之內不能向上穿越峰位。第一個峰位出現之前的上升趨勢屬於三波段衡量漲勢。


    許多不幸的投資人或動態玩家在第一個峰位附近買進，期待價格繼續走高。可是，精明的技術分析者則發現真正的價格型態：三波段衡量漲勢 (measured move
    up)。第一隻腳完成於三天之內，然後是幾個星期的修正，接著是創峰位的第二隻腳漲勢。


    三波動衡量走勢結束後，成交量快速萎縮，漲勢停頓。


    價格下滑，形成一個底部，低點為 $15\%$；盤整期間大約持續兩個月，成交量很小。


    第一個峰位的回撤程度就金額而言不大，但幅度還是有 20%。盤整期間內，進行加碼或建立新部位的投資人不 多。那些在第一個峰位附近買進的人，則發誓解套就出場。6月底到7月初之間，價格開始上漲，解套賣壓陸續出場，但另一些投資人則認為價格整理結束而進場，成交量放大。


    7月份，當價格形成第二個峰位而向下反轉，某些投資人正確判斷雙重頂排列正在形成當中。他們在頭部附近獲利了結，賣出持股。另一些大膽的交易者，則放空股票而期待股價下跌。價格確實下滑，但停頓於先前兩個峰位所夾谷底盤整走勢的上緣。


    8月份與9月份之間，價格試圖向上攻堅，但沒有成功而留下第三個峰位。9月底，價格向下跌空而貫穿確認點 $15\%$。向下突破之後，精明資金立即認賠出場，某些投資人則期待超賣而低檔承接，另一些人則順勢放空。


    10月中旬，股票嘗試拉回到突破點，顯然沒有成功。隨後的三年內（直到這份研究結束於1996年爲止），股價始終沒有回到雙重頂的頭部價位。


    ### 失敗案例


    雙重頂排列的失敗情況究竟如何？有什麼值得學習的教訓？請參考圖 13.4，其中顯式雙重頂排列經常發生的失敗情況。兩個峰值的水準、間距與回檔程度都符合表 13.1
    的辨識準則，只有成交量稍有疑問。第一個峰值的成交量很大，但只維持一天而已。第二個底部的成交量更大，而且持續一個星期左右。可是，話說回來，每個雙重頂排列的實際成交量型態都各自不同，前述的現象實不足以判斷最後的結果。


    **Fairchild Corporation A (工業服務，NYSE，代碼 FA)**


    ![](img/843a88de0b50d7a36e65238281a4e722_321_0.png)


    圖 13.4 常見的雙重頂排列失敗案例。第二個峰值出現之後，價格還沒有跌破確認點之前，向上穿越峰值。


    可是，在第二個峰值完成之後，收盤價並沒有向下穿越確認點。就所有的潛在雙重頂案例而言（換言之，沒有經過確認的排列），大約有三分之二（65%）的案例出現圖 13.4
    的失敗情況。價格不只沒有跌破確認點，反而走高。為什麼？


    在多頭行情的大環境之下，頭部反轉排列（包括此處考慮的雙重頂）的績效相對不理想，底部排列的績效則很好，本書的研究分析普遍存在這種現象。關於圖 13.4 提供的教訓：等待收盤價跌破確認點，才適合針對這個排列進行交易。否則的話，很可能太早賣出持股或放空股票。


    如果等到雙重頂經過確認之後，排列成功的可能性上升為 83%。當然，還有 17% 的機會發生 5% 失敗案例。請參考圖 13.5，這是一個 5% 失敗例子：收盤價向下穿越確認點，但沒有發生
    5% 或以上的跟進跌勢。


    ![](img/843a88de0b50d7a36e65238281a4e722_322_0.png)


    圖 13.5 雙重頂排列的 5% 失敗案例。價格跌破確認點，但沒有發生 5% 或以上的跟進跌勢。


    這個頭部排列的起漲點在 1992 年 5 月份，第一個峰位發生在 1993 年 3 月份，整段走勢的漲幅超過 60%。價格回檔一個月左右，然後蓄積動能再度向上攻堅，不久又在
    6 月份創新高，第二個峰位較前一個峰位高出 5/8 點。


    可是，創新高 的喜悦沒有維持多久，價格開始快速下滑，在 $26 獲得支撐之前，跌幅已經累積 20%。這段跌勢曾經向下穿越確認點，但立即向上反轉，夾著相當快速的步調向上挺進，一直到
    $39 附近才出現重大壓力。所以，最後這段漲勢由低點衡量的幅度為 50%。如果你在雙重頂完成的時候——收盤價跌破確認點——賣出股票，將拱手讓出這 50%的漲幅。


    這種失敗類型稱為 5%失敗。收盤價確實向下突破，但隨後沒有出現 5%或以上的跟進跌勢。還好，這類 的失敗情況相對少見；在所有經過確認的雙重頂排列中，大約有
    17%的案例發生 5%失敗。


    ### 統計數據


    表 13.2 列示雙重頂排列的一般統計數據，但沒有道盡完整的內容。在 500 支股票的五年走勢期間內，總共發現 1,280 個潛在雙重頂排列，其中有 826
    個（65%）案例在價格跌破確認點之前 就向上穿越峰位。唯有經過確認之後，才視為雙重頂排列，所以此处不考慮這 826 個案例；換言之，它們不屬於雙重頂。


    在剩下的 454 個案例中，反轉型態佔 75%，連續型態佔 25%。這部分排列的失敗率爲 17%；換言之，75 個案例向下突破之後沒有出現 5%或以上的跟進跌勢。我把失敗率低於
    20% 的型態視爲可靠排列。可是，我希望重複強調一點，此處考慮的雙重頂都經過確認。


    **表 13.2 雙重頂排列的一般統計數據**


    | 說明 | 統計數據 |

    |---|---|

    | 排列數量：1991年～1996年的500支股票 | 454個 |

    | 反轉或整理排列 | 113個整理，341個反轉 |

    | 失敗率 | 75/454相當於17% |

    | 成功排列的平均跌幅 | 20% |

    | 最經常發生跌幅 | 10%~15% |

    | 經過確認的排列中，符合或超越目標價位者 | 177/454相當於39% |

    | 排列平均長度 | 2個月（57天） |

    | 兩個峰位的價格平均差異 | 1% |

    | 兩個峰位之間的走勢平均跌幅 | 15% |

    | 第一峰位價格較高或第二峰位價格較高的百分率 | 56%與44% |


    成功排列的平均跌幅爲 20%，但最經常發生跌幅介於 10% 與 15%之間，請參考圖 13.6 的跌幅次數分配。此處把跌幅百分率劃分爲 10 個欄位（請參考圖
    13.6 的橫軸），然後按照每個案例的實際跌幅，計算每個欄位的發生次數。這份次數分配圖顯示一個顯著的趨勢：幾乎半數案例的跌幅不超過 15%（此處所謂的「跌幅」是由突破點向下衡量到最終低點）。


    ![](img/843a88de0b50d7a36e65238281a4e722_325_0.png)


    問題是：雙重頂完成之後——換言之，經過確認之後——持股者是否應該獲利了結？空手者是否值得建立空頭部位？由突破點起算，如果價格平均只會再下跌 15%，然後就會向上反轉，爲什麼不等待價格回升呢？這些都是合理的問題。如果你在雙重頂經過確認之後才賣出，很可能賣在最終低點附近。


    由最高峰值衡量到最終低點之間的平均跌幅爲 32%。爲什麼不在頭部附近賣出？爲什麼不在排列確認之前，提早獲利了結？如果你真的這麼做，股價很可能在你賣出之後上漲（請記住，每三個潛在雙重頂案例，就有兩個排列根本不會跌破確認點）。當然，一旦賣出之後，如果股價向上反轉，你可以再買回來。


    目標價位的細節問題，請參考稍後討論的「交易戰術」一節，但衡量方法很簡單。首先計算排列的高度，這是把峰位最高價減去確認點最低價。然後由確認點向下衡量排列高度，結果就是向下突破之後的最低目標價位。


    經過確認的雙重頂案例中，只有 39% 的排列會滿足目標價位。這方面的讀數至少應該是 80% 才可靠。所以，雙重頂的平均跌幅不夠深，或許完全不值得進行交易。


    表 13.2 列示雙重頂的一些參考統計數據。由峰位衡量到峰位的排列平均期間長度為 57 天（2 個月）；兩個峰位的平均差價為 1%，由最高峰位衡量的谷底平均跌幅為
    15%。第一峰位的高度通常超過第二峰位，但兩種情況發生的比率相差不多有限，分別為 56%與 44%。


    稍早，當我採用較小刻度進行研究的時候，發現雙重頂峰位相隔的時間長度愈短，績效往往更理想。目前這份研究也顯示相同的現象。


