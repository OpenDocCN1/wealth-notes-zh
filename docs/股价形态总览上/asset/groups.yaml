    當收盤價貫穿下側趨勢線，老王進場放空，成交價格為$39½。他運用雙重頂衡量下檔的目標價位。雙重頂頭部位為$45¼，兩個頭部所夾的谷底為$36¼，雙重頂的排列高度為$9½（＝45¾-36¼），由突破點（$36¼）向下衡量排列高度，下檔目標價位為$26¾（36¼-9½）。他決定把回補的停止買單設定在$27¹/₈，剛好閃過大多數人可能採用的整數價位，然後上床睡覺。


