    圖 17.1 真正的吊人線形。請參考黑點標示的位置，雖然圖形中只顯示最高價、最低價與收盤價（沒有顯示開盤價），但黑點標示位置的當天線形，開盤價也等於最高價。


    舉例來說，當價格在 8 月初創$3 峰位的隔天，開盤價（圖形沒有顯示）、最高價與收盤價都是$3，最低價為$2.81，顯著低於最高價（兩個價格的差距至少 5%，實際上是
    6.3%）。請留意這支線形的上端標示黑點，但先前 4 支線形看起來也是呈現 T 形，但這些線形沒有標示黑點；換言之，這些線形的開盤價或許不等於最高價，要不然最低價與最高價的差距就不足
    5%。總之，這 4 支線形都不是真正的吊人（由於圖形沒有顯示開盤價，所以你必須相信我）。


    當時的價格漲勢起始於$1.88，截至線形出現當天，漲勢完全沒有停頓。這是吊人線形的必要條件之一，反轉線形必須存在某個顯著的趨勢供其反轉。請參考圖 17.1
    的 A 點，多頭反轉的吊人線形出現在下降趨勢中，顯然沒有意義。B 點發生在橫向走勢中，但也顯示上升趨勢的開始（雖然 2 天之後才開始）。C 點的吊人線毫無意義，這或許是最經常發生的類型。D
    點可以視為成功的吊人反轉線形，雖然其中頗有爭議之處。價格連續上漲 3 天，在吊人線形出現之後，反轉為橫向走勢。如果把 D 點到 B 點之間的走勢視為下降趨勢，則
    D 點的吊人線形代表上升趨勢反轉為下降趨勢（雖然具有橫向走勢的意味）。


