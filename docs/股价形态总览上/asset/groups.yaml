    很多排列的成交量型態都呈現下降趨勢（大約佔 74%）。在 21 個失敗案例中，6 個排列（佔 29%）的成交量型態呈現上升趨勢。在成交量呈現上升趨勢的成功排列中，大約半數案例（53%）的漲幅低於平均水準。這些統計數據似乎能夠更進一步支持成交量下降趨勢對於排列績效的助益。


