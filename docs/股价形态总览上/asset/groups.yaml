    # 謝詞


    每個人的一生當中，通常都有幾個重要的轉捩點。幾年前，我魯莽地投稿給《股票與商品技術分析》雜誌（*Technical Analysis of Stocks and
    Commodities*）。該雜誌當時的主編 Thom Hartle 決定刊載我的文章，讓我覺得非常訝異與高興。這個事件引導我踏上截然不同方向的人生旅途。


    大約投稿十多篇文章之後，我打電話給 Thom Hartle，提到我打算編寫一本書的構想。他非常熱心把我介紹給 John Wiley & Sons 的資深編輯
    Pamela van Giessen。於是，我寫了一封電子郵件給她，開啟了另一扇人生的大門。


    我很難透過文字表達自己對於 Thom Hartle 與 Pamela van Giessen 的謝意。當然，在我的寫作過程中，還有很多人提供協助，例如我的弟弟吉姆，他經常幫我整理稿子，支持與鼓勵我。對於這些人，我非常謝謝他們。


    Thomas N. Bulkowski'
