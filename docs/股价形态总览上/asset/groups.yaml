    ## 交易戰術


    表 5.4 列示交易戰術。大多數排列的目標價位，都是由突破點向上或向下衡量排列高度，但目前這個排列把最低盤中價格視為向下突破的目標價位。


    圖 5.6 顯示兩個上升擴張楔形，並且說明目標價位的決定方法。兩個排列的結構都很標準，但第一個案例的轉折高點似乎稍微穿越上側趨勢線。圖形中分別標示這兩個排列的最低價格，它們代表排列向下突破之後的目標價位。第一個排列的目標價位在
    11 月中旬達成，然後價格展開一段向上走勢。第二個排列的目標價位完成於向下突破後不久。


    此處挑選排列低點作為向下突破的目標價格，主要是基於達成率的考量。採用排列低點作為目標價格，達成率為 61%，大約是每 3 個向下突破的案例就有 2 個達成目標價位。我要求目標價位達成率至少是
    80%，61% 顯然不夠理想。請觀察圖 5.6 的第二個排列，突破點與目標價位之間的距離實在太接近了。


    如果計算排列最高點與最低點之間的高度，然後由突破點向下衡量排列高度作為目標價位，達成率只有 27%，距離 80% 更遠。如果由突破點向下衡量排列的一半高度，結果又如何呢？達成率為
    64%，雖然優於 27%，但與 61% 沒有太大的差異。


    這個排列向下突破的發生機會很高，但還是有 20% 的案例出現橫向或向上突破。等待收盤價實際突破之後，可以顯著提高操作上的獲利能力；一旦收盤價向下買穿趨勢線，進場放空股票。當價格接近下檔目標價位，準備回補空頭部位，尤其是在支撐區域附近。


    ### 表 5.4 上升擴張楔形的交易戰術


    | 交易戰術 | 解釋 |

    | :--- | :--- |

    | 衡量法則 | 向下突破的目標價位為排列最低點。不要由突破點向下衡量排列的高度，否則會低估目標價位。 |

    | 等待確認 | 雖然這種排列向下突破的可能性為 80%，但空頭部位最好還是等待收盤價正式突破趨勢線。 |

    | 部分漲勢 | 在排列發展過程中，如果看到部分漲勢開始向下反轉，可以考慮進場放空。部分漲勢發生之後，通常會立即向下突破。 |


    附註：務必等待收盤價突破，然後順著突破方向進行交易。


    ![](img/843a88de0b50d7a36e65238281a4e722_145_0.png)


    ### 圖 5.6 兩個上升擴張楔形的衡量目標價位。兩個峰位檔呈雙重頂排列的兩個頭部。


    上升擴張楔形最可能發生的跌幅只是 10%，但實際的跌幅可能高於這個水準。目標價位也可以用來評估可能的跌幅。可是，支撐區域或許是結末空頭部位的最好位置。在圖
    5.6 的第一個案例中，排列最低點 $36 也是下檔支撐點。8 月初，價格下跌而在此向上反轉，開始形成上升擴張楔形。幾個月之後，價格又在這個位置獲得支撐。請注意，支撐一旦跌破，就轉變為壓力。第二個案例向下突破之後，3
    月份的反彈就是受阻於 $36 壓力。


    如果發現部分漲勢，可以考慮擱置「等待實際突破」的法則。回頭觀察圖 5.6，價格實際突破的前一波漲勢，是否可以視為部分漲勢？不行。根據定義，部分漲勢是：價格觸及下側趨勢線，向上反彈而不能觸及或靠近上側趨勢線，然後又朝下側趨勢線發展。圖
    5.6 的這波漲勢是起始於上側趨勢線，不是下側趨勢線。圖 5.2 提供一個典型的部分漲勢例子。


    如果發現部分漲勢，可以考慮放空股票；在這種情況下，大約有 84% 的案例向下突破。提早進場的時間，獲利應該更豐碩。當股價朝下側趨勢線發展，儘快把停損移到損益兩平點。萬一股價在下側趨勢線附近向上反轉，考慮回補空頭部位。


    ## 交易範例


    老陳在一家大型麵包廠擔任夜班工作。由於晚上工作，白天的時間就可以安排其他活動，例如：睡覺。他偶爾也會研究股價走勢圖，類似如圖 5.6 的例子就會讓早晨的陽光更明媚。


    每天上床之前，老王都會叫出這份股價走勢圖，觀察最近的发展。當第一個擴張楔形出現的時候，他覺得很有意思。接著又出現第二個類似排列，這讓他的睡意全消，開始專心注意：擴張楔形本身並沒有什麼了不得，值得留意的是楔形排列伴隨發生的雙重頂。兩個型態同時出現，更凸顯出空頭意涵，使他願意投入血汗錢進場。


    當收盤價貫穿下側趨勢線，老王進場放空，成交價格為 $39½。他運用雙重頂衡量下檔的目標價位。雙重頂頭部位為 $45¼，兩個頭部所夾的谷底為 $36¼，雙重頂的排列高度為
    $9½（＝45¾-36¼），由突破點（$36¼）向下衡量排列高度，下檔目標價位為 $26¾（36¼-9½）。他決定把回補的停止買單設定在 $27¹/₈，剛好閃過大多數人可能採用的整數價位，然後上床睡覺。


    老王每天都會觀察最新的发展。股價在楔形排列目標價位（$38⁷/₈）附近稍做盤整，然後快速下跌，他對於整個情況非常滿意。3 月份的反彈走勢，稍微妨礙他的睡眠，擔心狂歡晚會已經結束。


    老王繼續持有空頭部位，股價最後還是恢復跌勢。他估計 3 月份的反彈應該屬於修正走勢，這個修正應該發生在整段跌勢的中點位置，所以下檔目標價位很可能是 $22¼，低於當初估計的
    $26¾。可是，他覺得還是不要太貪心，下檔獲利了結的停止買單仍然設定在 $27¹/₈。另外，他把上檔的保護性停止買單調整到 3 月份反彈走勢的高點稍上方 $36^{3/8}$。


    4 月 18 日，老王被一陣電話鈴聲吵醒，他的經紀人表示空頭部位順利在設定價位回補。他打開電腦，檢查戰果，每股獲利 $12。於是，老王面帶微笑，重新回到床上，繼續他的美夢。


    ## 下降擴張楔形排列


    ![](img/843a88de0b50d7a36e65238281a4e722_149_0.png)


    ### 摘要資料


    - **外觀** 價格沿著兩條向下傾斜的趨勢線發展。兩條趨勢線向外發散。

    - **反轉或整理** 長期的（超過 6 個月）多頭整理排列。

    - **失敗率** 37%。

    - **平均漲幅** 46%，最經常發生漲幅為 20%。

    - **成交量趨勢** 通常隨著時間經過而增加。

    - **回挫** 向上突破有 40% 發生回挫走勢。

    - **價格目標達成率** 81%。

    - **意外發現** 排列末端出現部分跌勢，向上突破的可能性為 76%。


    實在非常意外！當初，我以為這個排列的行為應該類似於下降楔形（falling wedge），結果並非如此。下降楔形屬於反轉型態，但下降擴張楔形（descending
    broadening wedge）屬於整理型態，完成之後繼續先前的價格趨勢。成交量型態也不同於下降楔形。下降擴張楔形的成交量隨著時間經過而增加，但下降楔形則呈現減少的趨勢。


    觀察資料庫內的個股走勢，我發現這種排列通常發生在上升趨勢的末端。在排列的發展過程中，整體價格趨勢朝下，在幾個月之內構成擴張楔形，然後價格向上突破，又回到排列出現之前的方向：朝上。這是一個典型的趨勢整理連續型態。


    如何衡量這個排列的失敗率呢？因為下降擴張楔形屬於連續型態，如果發生趨勢反轉的走勢，就屬於失敗案例。另外，如果連續型態完成（突破）之後，沒有出現 5% 或以上的跟進走勢，也視為失敗。這兩種情況造成
    37% 的失敗率，超過可靠排列所能夠接受的最高水準 20%。


    這種多頭整理排列的平均漲幅高達 46%。最經常發生漲幅為 20%，另外有高達 40% 的案例呈現 50% 以上的漲幅！由於這些數據顯著偏高，所以失敗率稍微偏低似乎也可以接受。


    由於這種排列完成之後的上漲動能十足，所以目標價位的達成狀況也非常理想。不同於上升擴張楔形，目前這個型態是由突破點向上衡量排列高度作為目標價位。下降擴張楔形向上突破之後，80%
    以上的案例達成目標價位。


    所有的擴張排列都有一種算不上意外的意外發現：部分跌勢。價格由上側趨勢線下跌，還沒有觸及或靠近下側趨勢線之前就向上反擊；在這種情況下，價格有 76% 的機會直接向上突破。


    ## 緣起


    這種排列的形状如何呢？圖 6.1 提供一個下降擴張楔形的範例。這支股票起漲於 1994 年 6 月，一年之後的 8 月份形成頭部。9 月份期間，股價拉回，呈現上下擺動的重整，隨著時間經過而構成擴張型態。一個月之後，銜接轉折高點與低點的兩條趨勢線，凸顯出可能的楔形排列。


    排列最初的成交量遠低於正常水準。成交量型態雖然不規則，但隨著時間經過，隱約有逐漸放大的傾向。計算成交量迴歸直線的斜率，也確認前述的結論：斜率為正數（向上傾斜），意味著成交量逐漸擴大。


    10 月中旬，價格透過跳空缺口直接向上穿越趨勢線，當時的成交量巨幅放大，而且隨後幾天也是夾著大量繼續上漲。


    仔細觀察圖 6.1，我們發現價格走勢的發展呈現三個階段：第一階段是由 1994 年 6 月到 1995 年 8 月之間的長期多頭行情，然後出現第二階段的 2
    個月期向下整理，接著又向上突破繼續攀升（第三階段）。所以，圖 6.1 的擴張排列代表上升趨勢的重整（連續）型態。整體而言，擴張排列是波段上升走勢的修正。


    ## Cognex（精密儀器，NASDAQ，代碼 CGNX）


    ![](img/843a88de0b50d7a36e65238281a4e722_152_0.png)


    圖 6.1 下降擴張楔形是上升趨勢的整理排列。界定價格行為的兩條趨勢線向下傾斜，而且向外擴張（發散）。成交量通常隨著時間經過而增加。


    不同於圖 6.1，圖 6.2 的下降擴張楔形扮演中期下降趨勢的反轉型態。價格漲勢在 1992 年 5 月出現峰位，然後向下反轉。8 月份期間，價格持續下跌，但擺動幅度擴大。9
    月中旬，下降擴張楔形逐漸成形。


    擴張排列的初期，成交量很低，偶爾會出現大量。9 月份開始，成交量逐漸放大，但型態顯得更不規則。10 月初，在價格向上突破之前的最後一波漲勢中，成交量明顯萎縮。向上突破的過程中，成交量並沒有放大，然後價格持續走高。向上突破代表中期趨勢可能反轉。


