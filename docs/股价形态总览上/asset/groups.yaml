    ## 交易戰術


    表 22.4 列示雙角底排列的交易戰術。這個排列沒有特定的方法衡量目標價位。由於沒有辦法決定目標價位，所以很難預先設定獲利了結的位置，也沒有辦法評估目標價位的達成率。雖說如此，但你只要能夠利用表
    22.1 的準則辨識雙角底排列，就可以考慮買進。


    雙角底排列的最重要特點是：線形應該繼續保持鹿角的突兀形狀（參考表 22.1 的「清楚明確」）。雙角底排列發生之後，隨後的線形應該向上移動，但可以等待 1、2
    個星期的時間。


    排列發生之前的價格趨勢可能朝上或朝下。雙角底型態發生在上升趨勢的末期，通常意味著價格漲勢即將告一段落。價格或許可以繼續走高（持續上漲 10% 左右），然後就停頓。當然，如果雙角底排列發生在下降趨勢的末端，通常意味著趨勢將向上反轉，漲幅或許非常可觀。


    雙角底排列通常都發生在下降趨勢中。可是，如果當時的下降趨勢只是上升趨勢的回檔走勢，我還是把當時的趨勢視為上升趨勢。在這種情況下，如果排列發生在延伸性漲勢之後，雖然價格在型態完成之後可能繼續上漲，但上檔的空間恐怕很有限，最好另外尋找投資目標。


    反之，如果下降趨勢已經持續很長一段期間（幾個月），雙角底排列即使不是最低點，距離真正的低點也應該不遠了。大體上來說，雙角底排列通常都發生在實際反轉點的前、後
    1 個月之內。


    如果雙角底排列發生當時的趨勢朝下，或許應該稍微等待，確定價格已經向上反轉之後才買進。反之，如果雙角底排列發生在上升趨勢中，或許應該立即買進，因爲稍做等待就必須追價買進。


    停損點可以設定在雙角最低價下側$1 處。對於低價股來說，$1 代表可觀的潛在損失；所以，或許應該放棄這類機會。設定偏大的停損，主要是避免正常的價格波動引發停損。某些情況下，雙角底排列出現之後，價格可能重新向下測試低點（跌破雙角底最低點），然後才正式展開漲勢。


    ## 交易範例


    瑪麗看見圖 22.5 的雙角底排列，她認為價格將繼續走高。排列出現之後的隔週，線形最低價顯然遠高於右角的最低價，使得原先的雙角底排列仍然保留突兀的鹿角形狀。


    回顧整個股價走勢圖，她發現長期上升趨勢起漲於 1992 年 10 月份的$8^{5}/_{8}$，整體走勢劃分爲數個波浪，上升浪的涵蓋期間大約是 4、5 個月，修正浪大約是
    3 個月。


    雙角底排列發生當時，剛好處在 5 個月的上升浪中——至少瑪麗認為如此。於是，在右角出現之後的隔週，她在$35 買進股票。她希望雙角底排列代表短期修正走勢的結束，價格將因此而恢復漲勢。同時，停損設定在$30^{7}/_{8}$，相當於雙角底最低價下方
    1/8 點處。雖然瑪麗懷疑這個停損點可能不夠低，但 12% 已經是她所願意承擔的最大損失。


    12 月初，她最擔心的情況發生了。當價格由$33 回拉到$29 的過程中，停損單被引發。又經過 3 個星期，股價在$28^{1}/_{2}觸底反彈。由峰位到谷底之間，整波段跌勢歷經的時間超過預期的
    3 個月。接著，價格展開一段凌厲的漲勢，在$57 創峰位，由谷底衡量的漲幅剛好是 100%。


    ### Watkins Johnson Co.（半導體資本設備，NYSE，代碼 WJ）


    ![](img/843a88de0b50d7a36e65238281a4e722_518_0.png)


    圖 22.5 週線圖上的雙角底排列。瑪麗在回挫走勢中遭到停損出場，結果股價上漲超過 100%。


    瑪麗所遭遇的不幸情況，純粹只是運氣不佳，或因為態度過分保守，停損設定得太緊密而浪費一個絕佳機會？這是我們遲早必須面臨的問題。你知道這個問題的答案嗎*？


    * 譯按：本章始終沒有說明，雙角底排列在什麼情況下才算完成。實際觀察本章的走勢圖，譯者歸納兩種可能的結論。第一，右角之後的線形低價不得跌破雙角最低價，否則視為失敗；右角之後的收盤價高於雙角最高價，排列即算完成。可是，在這種情況下，譯者沒有辦法決定右角之後的「之後」，究竟允許多久的時間，或許不應該超過
    2 週。第二，右角發生之後，只要隔週線形低價還高於雙角低價，排列就算完成。在這種情況下，就不需考慮右角「之後」的時間長短。譯者個人偏愛第一個方法：換言之，右角發生之後，隨後兩週內的某收盤價向上穿越雙角最高價，排列即告完成；排列完成之前，線形低價不得跌破雙角最低價，否則視為失敗。


    ## 雙角頂排列


    ![](img/843a88de0b50d7a36e65238281a4e722_519_0.png)


    ### 摘要資料


    - 外觀：週線圖上，兩個突兀狀向上長線形，中間隔著另一支小線形。

    - 反轉或整理：短期（長達 3 個月）空頭排列。

    - 失敗率：16%。

    - 平均跌幅：21%，最經常發生跌幅為 10%。

    - 意外發現：雙角的成交量都低於 25 天移動平均水準，失敗率降低為 6%。

    - 參閱排列：（13）雙重頂排列，（31）長管頂排列。


    仔細觀察「摘要資料」的數據，讀者或許會興起一個疑問：雙角頂排列（horn tops）難道值得操作嗎？最經常發生跌幅只有 10%，針對這種排列放空股票：恐怕不太適當吧？可是，如果交易的筆數夠多，再加上一些運氣，這類排列的平均跌幅爲
    21%，似乎還是值得考慮。另外，由雙角頂排列完成開始起算，價格到達最終低點的平均期間少於 4½ 個月。所以，在 4½ 個月的期間內取得 21% 的獲利，年度化報酬率相當於
    58%，這個排列還是值得進一步研究。


    這個型態有一個意外發現：雙角的成交量都低於 25 天移動平均，排列的失敗率下降爲 6%，但平均漲幅仍然維持 21%。如果你打算操作雙角頂排列，或許應該記得這個特點。


    ### 緣起


    許多股價型態都存在對應的頭部或底部排列，雙重底與雙重頂就是一個例子。目前這個排列也是如此。第 22 章處理雙角底排列，這一章準備討論對應的雙角頂型態。首先，讓我們說明雙角頂排列的形狀。


    圖 23.1 提供一個典型的雙角頂排列範例。如果你熟悉第 22 章討論的雙角底型態，對於雙角頂的特質應該不覺得陌生。在過線圖上，雙角頂是由兩個峰位構成，中間夾著一支線形，通常發生在上升趨勢的末端。雙角線形的成交量通常較大，但不會顯著大於當時的
    25 天移動平均。右角出現之後，價格應該會朝下發展，甚至出現重大的跌勢。


    #### Advanced Micro Devices, Inc.（半導體，NYSE，代碼 AMD）


    ![](img/843a88de0b50d7a36e65238281a4e722_521_0.png)


    圖 23.1 雙角頂排列範例。雙角頂排列完成之後，股價幾乎腰斬。請注意，這是一份週線圖，雙重頂型態的兩個峰位分別發生在 4 月份與 8 月份。


    在圖 23.1 中，雙角頂排列所處的漲勢起始於 1993 年 6 月中旬的$20^{3/8}$，由這個起點衡量到雙角頂最高價$32^{5/8}$，2 個月內的漲幅高達
    60%。如此陡峭的漲勢很難持續，結果發生雙角頂反轉頭部。配合先前 4 月底的峰位，構成雙重頂的空頭排列。


    雙角頂排列完成之後，價格直接跌到$26，然後回升到排列底部，大體上遵循上升趨勢線的軌跡發展。接著，價格正式貫穿上升趨勢線，展開另一波跌勢。1994 年 1
    月初，價格觸及$16^{2/4}$的低點，由峰位衡量的跌幅幾乎高達 50%。


    #### 辨識準則


    表 23.1 列示雙角頂排列的辨識準則。請參考圖 23.2 的過線圖，我們希望尋找中間夾著小線形的兩支向上突兀長線形。這兩支突兀長線形必須凸顯於週遭的價格行爲（清楚明確），中間所夾線形的高價也必須遠低於雙角線形的高價。回顧最近一年的走勢，雙角頂排列的兩支突兀線形長度，必須明顯超過其他向上突兀線形。在圖
    23.2 中，足以媲美的對手只有 9 月底的向上突兀長線形（至少就圖形顯示的部分而言是如此。）。


    **表 23.1 雙角頂排列的辨識特質**


    | 特質 | 討論 |

    | :--- | :--- |

    | 過線圖，向上 | 在過線圖上尋找兩支向上的突兀長線形，中間隔著另一支線形。兩支突兀線形的長度，至少應該類似最近一年內的長線形長度，而且它們的高點應該遠高於中間所夾單過線形的高點。形狀看起來就像公鹿的一對角。
    |

    | 突兀長線形 | |

    | 兩個峰位價格大致相同 | 雙角高點的價位大致相同，差距通常不應該超過 3/8 點。當然，對於高股價的股票，兩者的差距也可以超過 1 點。不要預期兩個高點的價位完全相同，這類的案例只佔
    20%。 |

    | 清楚明確 | 雙角排列應該非常凸顯，高點遠高於週遭的線形。發生在延伸性上升趨勢末端，這類反轉排列的續效最理想。 |

    | 線形重疊部分很多 | 構成雙角度排列的兩支長線形，價格重疊部分應該很多。 |

    | 小成交量 | 雙角線形的成交量低於平均水準，排列續效反而較理想。 |


    #### Homestake Mining（金銀礦，NYSE，代碼 HM）


    ![](img/843a88de0b50d7a36e65238281a4e722_523_0.png)


    圖 23.2 這個雙角頂排列呈現兩個異常高鋒的峰位，線形長度顯然超過先前的突兀線形。


    雙角最高價之間的差距非常小，通常不超過 3/8 點。某些情況下，前述的差距可能稍大，但通常都發生在高價股。就目前這份研究而言，沒有任何案例的雙角高價差距超過
    1¼點。圖 23.2 例子的價差為 3/8 點。由另一個角度說，雙角高價也很少完全相等，大多會有一些差異。


    雙角線形應該大部分重疊。根據這個準則，兩支長線形的長度應該大約相等，發生的價位也應該約略相同。圖 23.2 的兩支長線形基本上相互重疊。


    最後一點說不上是辨識準則，只是一項參考特質。如果雙角的成交量分別小於 25 天移動平均，排列失敗的可能性大減（失敗率由原來的 16%降低爲 6%）。


    #### 失敗案例


    某個特定案例之所以失敗，可能涉及幾種理由。某些於潛在頭部排列出現之後，價格卻向上突破（與預期方向相反）；另一些排列確實按照預期發展下跌，但還沒有出現足夠的跟進跌勢之前，價格又向上攀升。後者稱爲「5%失敗」，經常發生在雙角頂排列。排列完成之後，在價格重新向上反彈之前，並沒有出現
    5%以上的跟進跌勢。請注意，雙角頂排列的失敗率雖然高達 16%，但還是低於可靠型態的門檻水準 20%。


    不幸地，5%失敗率並不能充分反映整體的操作情況。雙角頂排列的最經常發生跌幅只有 10%，扣除交易成本之後，所剩無幾。不過，這種操作績效也是空頭反轉型態在多頭市場內的平均水準。


    研究失敗的案例，能夠得到什麼啟示呢？總共有 30 個失敗案例，其中的 15 個排列隨後曾經出現重大的跌勢；所謂「隨後」的時間落後程度平均爲 2.7 個月，但個別案例的落後時間大多少於
    2 個月。這是頗值得重視的現象：某個雙角頂排列出現之後，雖然沒有立即發生價格反轉，但趨勢很可能在不久之後產生變化。


    從事股票操作，應該觀察整體情況。請參考圖 23.3 的雙角頂排列案例。大約經過一年的盤跌走勢之後，價格穿越下降趨勢線，開始向上攀升。這就是雙角頂排列發生的背景。


    #### Bandag Inc.（橡膠輪胎，NYSE，代碼 BDG）


    ![](img/843a88de0b50d7a36e65238281a4e722_525_0.png)


    圖 23.3 延伸性跌勢之後的雙角頂排列。雙角頂排列發生在不該發生的地方，最好忽略這類的型態。趨勢轉折點出現長管底排列。


    請注意排列發生當時的背景：經過長期的下降走勢之後，股票通常都會向上反彈，然後稍做回檔重新測試底部支撐。所以，當雙重頂排列出現的時候，很可能意味著股價即將拉回，重新測試底部。雖然沒有顯示在圖
    23.3，股價隨後確實走低；不過，在回檔之前，價格挺在高檔幾個月之久，而且一度上揚到 $63½。最後，股價回檔到 $49¹⁄₈，然後才恢復漲勢。


    面對這個頭部反轉排列，實際採取行動之前，應該特別留意價格貫穿下降趨勢線的意涵：就大方向考慮，股票可能反轉為上升趨勢。如果股票即將上漲，似乎沒有放空股票的道理。雖然雙角頂排列意味著價格將下跌（就短期走勢而言，事實上也是如此，隨後幾個星期內，股價曾經下跌$1
    左右），但是否值得操作？


    如果存在明顯的顧忌或衝突，就不要勉強，應該另外尋找交易對象。抱持著這種心態，你偶爾確實可能錯失賺大錢的機會；可是，如果你準備掌握每個可能的機會，交易資本恐怕很快就會耗盡。


    ### 統計數據


    表 23.2 列示雙角頂排列的一般統計數據。在 500 支股票的 5 年走勢內，我總共找到 188 個案例。就股價型態來說，雙角頂或許屬於相對罕見的安排，但其數量也足以做為可行的操作對象。


    連續型態與反轉型態的案例大約相當，分別為 92 個與 96 個。反轉型態的績效比較理想：雙角頂排列發生在上升趨勢的末端，意味著價格將向下反轉。


    失敗率為 16%，還算不錯；我認為失敗率只要不超過 20%，就屬於可靠的型態。成功排列的平均跌幅為 21%*，但最經常


    *譯按：成功的排列，是指排列完成之後出現 5%以上跟進跌勢的案例。至於何謂「排列完成」，請參考第 498 頁的註腳。

    '
