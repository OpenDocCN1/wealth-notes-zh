    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：<br>1991 年~1996 年的 500 支股票 | 431 個 |

    | 反轉或整理排列 | 25 個整理，406 個反轉 |

    | 失敗率 | 30/431 相當於 7% |

    | 成功排列的平均跌幅 | 23% |

    | 最經常發生跌幅 | 15%~20% |

    | 成功排列中，符合<br>或超越目標價位者 | 254/401 相當於 63% |

    | 排列平均長度 | 2 個月（62 天） |

    | 右肩 / 左肩價位較低的<br>平均跌幅 | 24% / 22%，不具統計顯著意義 |

