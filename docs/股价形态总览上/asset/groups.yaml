    突破分爲三種類型：向上、水平與向下。大多數案例都向上突破（57%）。向下突破的案例有 37%，其餘爲水平突破。如果你想知道水平突破的狀況，請參考圖 3.6。下降擴張排列結束之後（價格沒有繼續觸及上側與下側趨勢線），出現
    6 個月左右的橫向走勢，然後收盤價才向上突破。即使是突破之後，價格仍然在排列上緣附近盤旋 4 個月。一直到 1994 年 7 月，才出現決定性的漲勢，完全脫離排列上側趨勢線的糾纏。


    ![](img/843a88de0b50d7a36e65238281a4e722_95_0.png)


    ![](img/843a88de0b50d7a36e65238281a4e722_95_1.png)


    **圖 3.6** 過綠圖的水平突破案例：排列結束的幾個月之內，價格沒有顯著向上或向下突破。


    向上突破之後的回落（throwbacks），以及向下突破之後的回升（pullbacks），這兩種走勢都相當罕見，發生的比率分别只有 23%與 33%。回升走勢的平均期間長度為
    14 天，稍微超過所有排列的回升走勢長度（10 天~12 天）。如果期間長度超過 30 天，我就不視爲是突破之後的回落或回升走勢，而屬於正常的價格起伏。


    如果把最近 12 個月的價格區間劃爲三等份——上緣、中央與下緣——則向上突破大多發生在上緣（74%）。所以，這意味著下降擴張排列經常發生在上升趨勢的末端。請注意，沒有任何向上突破的案例發生在年度價格區間的下緣。這個現象相當自然，因爲此處是考慮向上突破，突破點一定發生在排列頂部，既然是排列的頂部，當然比較不可能發生在年度價格區間的下緣。


    就向上突破之後的表現來說，突破發生在年度價格區間中央的案例，漲幅通常最大，理由不清楚。就其他的排列而言，發生在年度價格區間上緣的向上突破，表現通常最佳，這可能是順勢交易的普遍心態：一旦價格向上突破年度高價區，技術玩家認爲趨勢將繼續朝上發展，而且上檔海闊天空。至於下降擴張排列，或許因爲型態本身的形狀向下（上側趨勢線爲水平狀，下側趨勢線向下傾斜），使得投資人覺得顧忌，甚至在向上突破之後也是如此。


    向下突破的情況則不同。突破點的位置相當均勻地分配在年度價格區間的下緣與中央。突破點落在上緣的向下突破案例只有 20%，理由與向上突破類似：既然是向下突破，突破點一定發生在排列底部，排列底部自然比較不可能發生在年度價格區間的上緣。由績效角度來說，發生在年度價格區間下緣的向下突破，跌幅通常最大（31%），這個現象似乎頗爲合理，同時也意味著創年度新低的股票才是放空的適當對象，不是股價創年度新高者。


    突破過程的成交量變化非常劇烈，突破當天的成交量平均較前一天放大 43%，往後幾天的成交量快速遞減，突破之後第 5 天的成交量只有突破前一天的 71%。關於這些成交量數據，我是考慮整體下降擴張排列，沒有區別爲向上與向下突破。


    對於突破成功與失敗的案例，成交量型態沒有顯著的差異。不論突破成功與否，大約有四分之三的案例都夾著大量進行突破。所以，如果你看到某個向上突破沒有大量配合，不必因此而特別懷疑突破將失敗。


