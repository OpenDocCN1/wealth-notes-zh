    # 辨識準則


    價格走勢的兩個底部出現在相同價位，這種排列未必就屬於雙重底。關於雙重底排列的辨識準則，請參考表 12.1，同時對照圖 12.2。股價跌勢起始於 1993 年
    10 月中旬的 $56\frac{1}{2}$，第一個底部 $41\frac{1}{2}$ 出現於 1994 年 5 月中旬。整個跌勢在見底之前，沒有出現更低於
    $41\frac{1}{2}$ 的價位。我們之所以設定這個準則，因爲雙重底是挑選整段跌勢中最低的兩個谷底。不要單純為了滿足這個準則，挑選某個低點與附近的另一個低點。在圖
    12.2 中，A 點與 B 點不代表雙重底的兩個谷底，因爲 A 點之前曾經發生更低的谷底。


    **表 12.1 雙重底排列的辨識特質**


    | 特質 | 討論 |

    | :--- | :--- |

    | 先前的價格下降趨勢 | （短期）價格走勢朝下，出現第一個底部之前，下降趨勢沒有出現更低的低點。 |

    | 兩個底部之間的回升 | 兩個底部之間所夾的峰位漲幅至少是 10% 到 20%（由底部最低價衡量到峰位最高價）。兩個谷底的間距愈短，所夾峰位的漲幅通常也較小。回升走勢通常呈現圓弧狀，但也有不規則的走勢。
    |

    | 兩個底部 | 兩個底部的價格差距應該維持在 4% 以內。實際的價位並不重要；總之，兩個底部的價位看起來應該相同。 |

    | 底部間距 | 兩個底部是由兩個顯著的轉折低點構成（分別屬於不同階段的走勢），至少間隔幾個星期（許多專家認為至少需要 1 個月）。最低間距的規定並不重要，底部間距為
    3 個月的排列，平均績效最理想。 |

    | 第二個底部之後的漲勢 | 第二個底部出現之後，在漲勢向上穿越確認點之前，不應該跌破第二個底部的最低價。 |

    | 底部成交量 | 第一個底部的成交量通常大於第二個底部。 |

    | 突破量 | 通常夾著顯著大量突破。 |

    | 確認點 | 確認點是兩個谷底所夾峰位的最高價，藉以確認雙重底的效力。當價格向上穿越確認點，雙重底即告完成或突破。 |


    ![](img/843a88de0b50d7a36e65238281a4e722_295_0.png)


    **圖 12.2 A 點與 B 點不是雙重底的兩個有效底部，因爲 A 點左側還有更低的低點。**


    兩個谷底之間所夾的反彈走勢漲幅至少必須是 10%（由谷底低點衡量到反彈高點）。確認點（confirmation point）是兩個谷底所夾反彈走勢的最高價，突破價位與目標價位的計算都需要運用確認點（細節討論，請參考後文）。圖
    12.2 顯示的反彈走勢是由第二個底部的 $41^{5/32}$ 衡量到先前峰位 $47^{1/2}$，漲幅為 15%，遠超過 10% 的門檻。


    兩個底部的價格差距必須保持在 4% 以內。不論採用的價格刻度如何，兩個底部在走勢圖上看出來的價位應該大略相等。圖 12.2 的兩個底部價位差距在 1% 之內。


    兩個底部相隔的時間距離至少應該有幾個星期，但經常相隔幾個月（例如圖 12.2 的情況）。關於兩個底部之間的最小時間距離，我當初設定的篩選準則為 10 天或以上，但實際上挑選的排列案例都至少為
    15 天。如果期待較強勁的突破漲勢，許多專業分析師採用 1 個月的最低時間距離。我採用較低的標準，藉以檢定前述的看法是否正確。結果，我發現兩個谷底彼此接近的排列，績效經常優於谷底間距較大的案例。我把谷底間距的上限設定為
    1 年（谷底間距最寬的案例為 374 天）。


    我採用的許多辨識準則都相當主觀，而且不同于傳統的定義。根據雙重底的傳統定義，兩個底部的間距至少相隔 1 個月，兩個底部的價位差異不得超過 3%，確認點相對於底部的漲幅至少為
    20%（底部間距較短者，確認點的高度稍低）。兩個底部所夾的走勢應該呈現圓弧狀。


    經過測試之後，我嘗試在自己準則與傳統定義之間尋找最佳的參數值，使得排列的績效最佳。可是，我發現各種參數設定並不會造成績效上的明顯差異，所以統計評估採用比較不嚴格的篩選準則（兩個谷底至少相隔
    10 天 / 兩個谷底的價格差異不超過 4% / 確認點至少上漲 10%）。


    價格還沒有向上穿越確認點之前，潛在的雙重底還不能視爲真正的雙重底。在我編製的統計表格內，只計算經過確認的雙重底排列。爲什麼？由於失敗率偏高：64%。結構看似雙重底，但價格在向上穿越確認點之前卻跌破第二個底部，這類的案例總共有
    980 個。經過確認的雙重底排列總共有 542 個，其中 525 個排列的價格繼續走高。所以，當價格出現第二個底部而向上反轉，這時候買進而期待整個走勢發展爲成功的雙重底排列，機會只有三分之一。換言之，應該等到價格向上穿越確認點。


    雙重底的典型成交量型態如下：第一個底部的成交量通常很大，第二個底部的成交量較小，整體排列之內的成交量呈現下降趨勢。當然，這都不是絕對必要的條件。某些案例中，第二個底部的成交量反而大於第一個底部。


    價格走勢爲何會形成雙重底排列呢？爲了回答這個問題，請參考圖 12.3。股價在 1993 年 4 月中旬創峰位；然後出現橫向走勢，一直到同年 9 月份，突然出現恐慌性賣壓。於是，價格開始下滑，由高點
    $33^{7}/_{8}$ 下跌到 1994 年 6 月底的低點 $20^{1}/_{4}$，九個月之內發生 40% 的跌幅。


    自從 6 月份出現多年以來的低點之後，價格開始回升。在這類的走勢中，價格隨後通常都會重新測試先前的低點。如果測試不成功，價格將繼續向下尋求底部。反之，如果測試成功，意味著底部的支撐非常強勁，通常都會展開一波漲勢。


    ## Central and South West（電力公用事業，NYSE，代碼 CSR）


    ![](img/843a88de0b50d7a36e65238281a4e722_298_0.png)


    **圖 12.3 一旦收盤價向上穿越確認點，排列即告完成。確認點是兩個底部所夾的最高價位。向上突破之後，價格經常回挫到確認點。**


    圖 12.3 的情況正是如此。我們發現，在 B 點重新測試先前 A 點底部的過程中爆出大量，意味著投資人對於測試是否成功的看法相當紛歧。


    價格在 $21 附近盤整將近一星期，結果買穿先前 A 點的支撐。價格向下發展，嘗試在先前 6 月份低點（第一個底部）尋求支撐，成交量再度放大。走勢在此盤整將近兩個星期，然後開始向上發展。


    所以，雙重底只不過是重新測試底部的走勢。投資人在底部買進股票，期待當時的走勢能夠止跌回升。某些情況下，他們的判斷正確，另一些情況則失敗，後者是下一節的主題。


    # 失敗案例


    圖 12.4 顯示一個毫無疑問的雙重底排列。第一個底部出現在延伸性的跌勢之後。兩個底部之間的間距大約爲兩個月，中間所夾的反彈走勢幅度也很大，兩個谷底的價位大約相等。所以，這是一個不錯的潛在雙重底排列，雖然成交量型態比較不正常，第二個底部的成交量大於第一個底部，但這並不重要。第二個底部完成之後，稍做測試就展開穩定的漲勢，直到價格向上貫穿兩個谷底所夾的峰值
    $40^{5/8}$。一旦收盤價向上穿越確認點之後，代表向上突破，雙重底正式完成。


    ![](img/843a88de0b50d7a36e65238281a4e722_299_0.png)


    ![](img/843a88de0b50d7a36e65238281a4e722_299_1.png)


    **圖 12.4 5% 失敗的範例。雙重底排列完成之後，沒有出現 5% 或以上的跟進漲勢。這種失敗案例非常罕見。**


    在這個例子中，排列向上突破之後，價格又回挫到突破點附近。回挫走勢在雙重底排列中經常發生，但很少繼續下跌。1993 年 9 月，這支股票創 $31^{5}/_{8}$
    的低價（圖形沒有顯示），低於 2 月份谷底 $34。


    如果在突破過程中購買這支股票，並且繼續持有，結果將會發生虧損。我稱此為 5% 失敗：排列向上突破之後，沒有發生 5% 或以上的跟進漲勢，然後又向下反轉。還好，5%
    失敗的案例非常罕見；在 542 個經過確認的雙重底排列中，總共只發生 17 個 5% 失敗案例，其他 525 個案例在向上突破之後，至少出現 5% 以上的跟進漲勢。


    圖 12.5 顯示雙重底排列的第二種失敗類型，你可能也見過這類案例。周先生是一位初學的投資者，當圖 12.5 出現第二個底部之後，他核對辨識準則，相信這是潛在的雙重底排列。為了及早掌握進場機會，他決定了第二個底部向上反轉之後就買進，結果成交价位為
    $42^{5}/_{8}$。周先生的想法很單純：既然這應該是一個有效的雙重底，爲什麼要等待確認呢？似乎沒有什麼理由要把買進價位提高到確認點（$46\frac{1}{4}$）。他對於隨後的股價表現很滿意，直到走勢向下反轉爲止。現在，他應該趁著還有獲利而立即出場，或者應該繼續等待？這是讓投資人經常覺得困惑的兩難決策。


    他決定繼續等待。5 月下旬，價格恢復漲勢，但不久又向下反轉。周先生只能無奈看著獲利逐漸消失，甚至轉盈爲虧。最後，當價格加速下跌，他終於決定認賠出場，結果幾乎賣在最低價位。


    ## Air Products and Chemicals Inc.（化工[多角度]，NYSE，代碼 APD）


    ![](img/843a88de0b50d7a36e65238281a4e722_301_0.png)


    **第二種類型的失敗案例。排列還沒有經過確認，價格就跌破底部。周先生想要提早鎖定雙重底排列的買進機會，結果卻發生損失。**


    究竟出了什麼差錯？周先生沒有等待雙重底確認完成的訊號。必須等到收盤價向上穿越確認點之後，才可以順著突破方向建立部位。否則，成功的機會只有三分之一。本章稍後的「交易戰術」會詳細討論操作方面的細節。


    # 統計數據


    表 12.2 的統計數據只考慮已經完成的雙重底排列；換言之，收盤價已經向上穿越確認點（兩個谷底所夾的峰位最高價）。在 500 支股票的五年期間走勢內，總共找到
    542 個經過確認的雙重底案例，其中 372 個（69%）屬於反轉排列。


    **表 12.2 雙重底排列的一般統計數據**


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 排列數量：<br>1991 年~1996 年的 500 支股票 | 542 個 |

    | 反轉或整理排列 | 170 個整理，372 個反轉 |

    | 失敗率 | 17/542 相當於 3% |

    | 成功排列的平均漲幅 | 40% |

    | 最經常發生漲幅 | 20%~30% |

    | 經過確認的排列中，符合或超越目標價者 | 370/542 相當於 68% |

    | 排列平均長度 | 2 個月（70 天） |

    | 兩個底部的價格平均差異 | 2% |

    | 兩個底部之間的走勢平均漲幅 | 19% |

    | 第一底部價位低於第二底部的發生頻率 | 52% |

    | 第一底部價位較低與第二底部價位較低的平均漲幅 | 39%與 39% |


    幾乎所有的案例（97%）一旦突破之後，都繼續朝上發展，其餘案例則沒有發生 5% 的跟進漲勢。這項統計數據顯示，應該在向上突破之後才買進股票——股價通常都會繼續上漲。


    經過確認的排列平均漲幅為 40%，最經常發生漲幅則介於 20% 與 30% 之間。圖 12.6 顯示雙重底排列漲幅的次數分配。


    ![](img/843a88de0b50d7a36e65238281a4e722_303_0.png)


    **圖 12.6 雙重底排列的漲幅次數分配**。最經常發生漲幅介於 20% ~ 30%。


    此處把漲幅百分率劃分為 10 個欄位（請參考圖 12.6 的橫軸），然後按照每個案例的實際漲幅，計算每個欄位的發生次數。我們可以由次數分配圖中看出，少數幾個偏高漲幅使得平均漲幅向上扭曲。請注意，漲幅超過
    90% 的案例數量佔總案例的 13%，漲幅超過 50% 的案例則佔總案例的 38%。


    關於目標價位的衡量方法，細節部分請參考「交易戰術」一節。如同傳統的衡量方法一樣，首先計算排列的高度，然後由突破點向上衡量排列高度，結果就是最低目標價位。這個排列的目標價位達成率為
    68%，讀數低於我認爲可靠型態應有的水準 80%。


    排列的平均長度稍微超過 2 個月（70 天，由底部衡量到底部）。在我的篩選準則中，兩個底部的最短路徑設定為 10 天。雖然我沒有正式設定長度的上限，但很少案例的長度超過
    1 年。我剔除這些異常的案例；所以，排列的實際長度介於 15 天到 374 天之間。


    兩個底部的價位差異平均為 2%，大約是所允許最大差異 4% 的一半。我們列示這項讀數，主要是強調兩個底部的價位大致相等。


    兩個底部所夾反彈走勢的平均漲幅為 19%，篩選案例所設定的最低水準是 10%。確認點就是兩個底部所夾反彈走勢的峰位最高價。我利用這個價位計算排列高度，並且用來確認向上突破。


    所挑選的案例中，兩個底部的價位大約相同，第一底部價位較低的案例稍多（52%），第二底部較低的案例佔 48%。對於這兩類情況，我發現它們的平均漲幅大約相同，都是
    39%。


    兩個底部間距較近的案例，平均漲幅是否超過兩個底部間距較遠者？沒錯。請參考圖 12.7，其中顯示兩個底部間距與該間距案例平均漲幅之間的關係。舉例來說，兩個底部的間距為
    21 天，這類排列的平均漲幅為 42%；底部間距為 119 天，這類排列的平均漲幅為 23%。圖 12.7 的曲線雖然上下起伏頗大，但整體趨勢還是朝下（不太明顯）；換言之，底部間距與排列漲幅之間保持反向變動的關係，間距愈大，漲幅愈小。


    ![](img/843a88de0b50d7a36e65238281a4e722_305_0.png)


    **兩個底部的間距愈小，漲幅是否愈大？這份圖形似乎支持這種論點。**


    表 12.3 顯示雙重底突破的統計數據。第二底部與實際突破之間存在時間延遲，因為價格漲勢需要耗費時間。延遲的平均長度為 43 天。


    **表 12.3 雙重底排列突破的統計數據**


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 第二底部與突破點之間的平均天數 | 43 天 |

    | 向上突破 | 542 個或 100% |

    | 向上突破的 5% 失敗案例 | 17/542 相當於 3% |

    | 回撤 | 366/542 相當於 68% |

    | 完成回撤走勢的平均期間 | 11 天 |

    | 對於成功的排列，突破與最終峰位的相隔時間 | 7 個月 (204 天) |

    | 突破點位在最近 12 個月價格區間的下線、中央或上線 | 下線 28%<br>中央 46%<br>上線 25% |

    | 前述突破位置的平均漲幅 | 下線 42%<br>中央 38%<br>上線 41% |


    由於我只考慮經過確認的排列，所以全部 542 個案例都向上突破。一旦向上突破之後，17 個案例沒有出現 5% 或以上的跟進漲勢。這類 5% 失敗案例非常罕見（請參考圖
    12.4），不值得特別留意。


    向上突破之後，有相當多的案例（68%）回撤到突破點。


    這項統計數據隱含著一項投資策略：等待回撤走勢，當價格重新恢復漲勢才進場買進。「交易戰術」會更深入討論這項策略。


    價格回撤到突破價位的平均時間長度是 11 天，類似其他排列的情況。此處不考慮 30 天以上的回撤走勢，這類長度的走勢都視為正常價格波動。


    向上突破發生之後，需要經過多久時間才會到達最終高點？雖然平均期間是 7 個月（204 天），但必須留意這是一個統計平均數。如果某個排列的漲幅為 10% 或
    15%，到達最終高點的時間應該較短，或許只要 2 個月。


    把最近 12 個月的價格區間劃分為三等份（上緣/中央 /下緣），計算雙重底突破點落在這三個區間內的次數百分率。結果，大部分排列（46%）落在年度價格區間的中央，上緣與下緣的次數大約相等，分別為
    25% 與 28%。另外，落在這三個區間的排列平均漲幅大約相同。前述的結果意味著，大多數雙重底發生在延伸性漲勢之後，一旦價格由年度高價附近回檔，經過一段下降趨勢，然後形成雙重底排列，排列完成之後又恢復漲勢。


    根據推理，排列發生之前的下跌走勢愈嚴重（發生在年度價格區間下線的型態），排列完成之後的上漲走勢愈強勁。情況確實如此，它們的平均漲幅為 42%。由另一個角度說，如果雙重底發生在年度價格區間上緣，意味著當時的上漲動能十足，排列完成之後的漲勢更強勁。這些排列的平均漲幅為
    41%。


    表 12.4 提供雙重底排列的成交量統計數據。第一個底部成交量較大的案例佔 58%，第二個底部成交量較大的案例佔 42%。大約有三分之二的案例（65%），排列過程的成交量呈現下降趨勢。我計算兩個底部之間的成交量迴歸直線斜率，另外也考慮第二底部到突破點之間的成交量，結果整個排列期間內的成交量經常都呈現平均水準；換言之，迴歸直線大體上為水平狀。


    **表 12.4 雙重底排列的成交量統計數據**


    | 說明 | 統計數據 |

    | :--- | :--- |

    | 第一底部成交量較大的案例百分率 | 58% |

    | 成交量呈現下降趨勢的案例百分率 | 351/542 相當於 65% |

    | 相對於突破前一天，突破當天與隨後 5 天的成交量 | 165%，133%，105%，92%，89%，82% |

    | 突破量偏高與偏低，隨後發生回挫走勢的百分率 | 65%與 65% |


    突破過程與隨後幾天的成交量通常會放大，但很快又恢復常態。表 12.4 顯示突破當天與隨後一星期的成交量，我們可以感受成交量下降的速度：突破當天是前一天的 165%，一個星期之後，成交量下降為突破前一天的
    82%。


    突破當時的成交量偏低，隨後是否比較經常發生回挫走勢？沒有這方面的特殊傾向。突破量特別大或特別小的排列，隨後發生回挫走勢的百分率都是 65%。


    # 交易戰術


    表 12.5 列示雙重底的交易戰術。衡量法則計算排列向上突破之後的最低目標價位。請參考圖 12.8。為了計算目標價位，首先計算排列的高度，把排列最高價（A
    點，$31.09）減去排列最低價（第二底部，$27.57），排列高度為 $3.52，由突破點（確認點 $31.09）向上衡量排列高度，最低目標價位為 $34.61（=31.09+3.52）。請參考實際的價格走勢，這個目標價位達成於
    12 月底。達成目標價位之後，價格曾經顯著拉起，然後又...


    **表 12.5 雙重底排列的交易戰術**


    | 交易戰術 | 解釋 |

    | :------- | :---------------------------------------------------------------
    |

    | 衡量法則 | 計算排列最高點與最低點之間的高度，由突破點（亦即是確認點，也是兩個谷底所夾峰位的最高價）向上衡量排列高度，結果就是最低目標價位。 |

    | 等待突破 | 第二個底部完成之後，只有 36% 的案例會向上突破確認點，所以最好等待收盤價突破之後才買進。 |

    | 等待回挫 | 向上突破之後，三分之二的排列會回挫到突破點附近。所以，可以等待回挫走勢結束而價格重新回升。 |


