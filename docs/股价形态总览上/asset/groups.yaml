    # Toll Brothers (住宅營建，NYSE，代碼 TOL)


    ![](img/843a88de0b50d7a36e65238281a4e722_460_0.png)


    圖 20.2 頭肩頂排列。這個例子的成交量符合正常型態：左肩最大，右肩最少。頸線向下傾斜，代表弱勢。


    正如同你所預期的，公司方面宣佈一些利多消息。其他投資人紛紛跟進，股價更進一步走高。當股價上漲超過$10 之後，你決定開始賣出，因為 2 個星期的獲利已經超過
    20%。由於你拋出股票，股價開始小幅回檔。


    發覺到走勢轉弱，你暫停賣出，嚴密觀察後續發展。其他等待低價買進機會的動能玩家，趁著回檔走勢進場。於是，股價再度回升。


    當股價重新攀升到$10 以上，你又開始賣出；由於先前已經出清大部分股票，目前需要拋出的股票數量已經不多。可是，其他動能玩家還是察覺你的出貨動作，股價稍微穿越$11
    就反轉下滑。


    你在回檔過程繼續拋光持股。由於其他玩家也開始出場，把股票轉手給後知後覺的投資人，成交量明顯放大。股票繼續下跌，最後終於跌破$10。由於大部分投資人相信股票已經處於超賣狀態，買盤再度進場，於是股價又上漲。


    你在場外冷眼旁觀，對於已經了結的獲利非常滿意。股價回升到$10\frac{3}{4} 做出右肩。由於缺乏支撐，走勢夾著小量向下反轉。某些熟悉技術分析的投資人，發現整個走勢形成頭肩頂排列，並且察覺其中的空頭意涵，紛紛獲利了結或認賠切場。另一些玩家甚至放空股票，希望低檔回補。


    價格下跌到圖 20.2 標示的「支撐水準」，試圖做最後的掙扎。股票於支撐區盤整一星期左右，呈現最後一波弱勢反彈。由於反彈走勢全然缺乏攻擊動能，很快就向下回挫，終於貫穿頸線。這個時候，成交量又開始放大，股價跌勢轉劇。最後，價格終於回到起漲點$8。


    # 辨識準則


    表 20.1 列示頭肩頂排列的辨識準則。請注意，頭肩頂排列的實際形狀可能千奇百怪，辨識準則畢竟只是「準則」而已。請參考圖 20.3 的例子，其中總共有 4
    個肩部，但只有 1 個「頭」。如果頭肩頂排列不是呈現標準的「一個左肩 / 一個頭 / 一個右肩”，就稱為複雜頭肩頂型態（complex head-and-shoulders
    top pattern)，這部分的細節討論請參考第 21 章。可是，任何複雜的型態，畢竟也只是頭肩頂排列而已。


    頭肩頂排列通常發生在延伸性價格上升趨勢的末端。先前漲勢的涵蓋期間如果不長，頭肩頂排列反轉之後，價格可能只會回到當初的起漲點（參考圖 20.2 的案例）。可是，頭肩頂引發的跌勢，通常代表短期（3
    個月以內）或中期（3 個月到 6 個月之間）的下降趨勢，甚至可能是長期空頭走勢的起點。我們無法事先判斷頭肩頂排列引發的跌勢規模。


    ## 表 20.1 頭肩頂排列的辨識特質


    | 特質 | 討論 |

    | :--- | :--- |

    | 形狀 | 在一段價格上升趨勢之後，形成三個峰位構成的排列，中間峰位的價格最高。類似人體上半身的形狀：頭與兩肩。 |

    | 對稱性 | 左肩與右肩必須分別位在「頭」的兩側，兩肩與頭之間的時間距離大約相等，兩肩的價也大約相同。雖然每個排列的實際形狀各自不同，但基本上必須以頭部為準而左右對稱。
    |

    | 成交量 | 一般來說，左肩的成交量最大，其次是頭，右肩的成交量很小。 |

    | 頸線 | 三個峰位夾著兩個轉折低點，繪製一條直線銜接兩個轉折低點，稱為頸線。頸線通常向上或向下傾斜。當價格向下穿越頸線，通常代表賣出訊號。 |

    | 向下突破 | 價格向下突破頸線之後，可能回升到頸線附近，重新測試頸線的壓力，然後又繼續下跌。 |


    ![](img/843a88de0b50d7a36e65238281a4e722_463_0.png)


    即使是圖 20.3 顯示的古怪排列，還是存在明顯的左右對稱性質。兩個左肩與其個別對應的右肩，大約都發生在相同價位。另外，兩個左肩與「頭」部的時間距離，大體上也與右側情況相互對稱。總之，在整個排列當中，「頭」處在中心位置。所以，「左右對稱」是辨識有效頭肩頂排列的重要參考準則。


    大體上來說，左肩的成交量大於頭部，頭部的成交量又大於右肩。在圖 20.3 中，如果只考慮內側的三個峰位，成交量的型態稍有變化，左肩的成交量小於頭部，但還是大於右肩。


    銜接三個峰位所夾兩個谷底的直線，稱為頸線，請參考圖 20.3。頸線是排列完成的確認點。價格一旦向下穿越頸線之，如果沒有發生回升走勢，通常會快速下跌。


    頭肩頂排列向下突破之後，大約有半數案例會發生回升走勢，價格拉高而重新測試頸線。回升走勢通常不超過 2 個星期，不要被這類的走勢愚弄。回升走勢完成之後，價格會繼續下跌，這往往代表多頭部位出場或空頭部位進場的良好時機。


    # 失敗案例


    ![](img/843a88de0b50d7a36e65238281a4e722_465_0.png)


    圖 20.4 頭肩頂排列。這個排列沒有向下跌破頸線。左右對稱性質與成交量型態都沒有顯示任何失敗的徵兆。


    頭肩頂排列失敗的情況相對罕見，圖 20.4 提供一個案例。這個型態的結構相當完美，「頭」部位在正中央，左肩與右肩位在對稱的兩側，價格大致相同（$29\frac{1}{8}）。左肩的成交量大於頭部，頭部成交量又大於右肩。


    價格為何沒有跌破頸線而反轉先前的上升趨勢呢？我們不知道明確的答案。排列雖然失敗，但我們不能否認型態的完美程度。這個頭肩頂屬於上升趨勢的連續型態。在此之前，曾經出現兩個下降三角形（圖形沒有顯示），兩者都向上突破，也都屬於上升趨勢的連續型態。由事後的角說，這兩個三角形或許足以顯示上漲的力度，似乎意味著隨後的頭肩頂排列也可能失敗——可是，畢竟沒有人預先知道這點。


    頭肩頂排列不經常失敗。類似如圖 20.4 的失敗狀況（換言之，屬於連續型態而沒有向下突破），在所有的 431 個案例中，總共只有 25 個，相當於 6%。


    # 統計數據


    ![](img/843a88de0b50d7a36e65238281a4e722_467_0.png)


    圖 20.5 頭肩頂排列的跌幅次數分配 最經常發生漲幅為 15%, 低於平均跌幅 23%。


    表 20.2 列示頭肩頂排列的一般統計數據。這屬於經常發生的股價型態，在我的資料庫內，總共有 431 個案例，幾乎 (94%) 都屬於上升趨勢的頭部反轉排列。失敗案例有
    30 個 (7%)，包括兩種失敗類型：向上突破，以及向下突破之後沒有出現跟進的 5%跌勢。由上述數據發現，潛在排列大多能夠完成 (向下跌破頸線)，所以操作上沒有必要等待向下突破的確認訊號。操作上的細節，請參考「交易戰術」一節。


