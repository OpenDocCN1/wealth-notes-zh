    # 統計數據


    表 2.2 列示一般性的統計數據。如同本書考慮的其他擴張排列一樣，由於案例數量相對偏低，除了採用 1991 年~1996 年的 5 年期資料之外，另外還納入較近期資料的
    35 個案例。所以，總共的案例有 216 個，數量還是不多。在這些案例中，81 例屬於既有趨勢的連績（整理）排列，但絕大部分的 135 例屬於反轉排列。


    我採用兩種方式計算失敗率。由於上升擴張排列應該向下突破，所以我計算沒有向下突破的案例，結果有 74 個，失敗率相當於 34%。反之，如果等待價格向下突破呢？這稱爲「突破確認」（breakout
    confirmation）。這使得失敗率下降爲 9%，遠低於我認為可靠型態的失敗率門檻 20%。所以，針對這個排列，我建議：採取行動之前，確認向下突破已經發生
    *。


    * 譯按：「失敗」是指向下突破之後沒有出現 5%或以上的跟進跌勢。此處的「確認」是指收盤價實際突破而言，不是利用其他訊號來確認突破。


