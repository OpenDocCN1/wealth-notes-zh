    当然，你还要注意的是，这种风险其实会在不同的市场里边表现是不同的。


    比如说在美国的市场上，这三个因子对股票的收益率有很强的解释力，但一般在A股市场上，价值因子的解释力就相对比较弱。因为中国公司的股价中，价值投资的成分要少一些。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_159_3.png)


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_160_0.png)


    ### 要正确认识运气


    - 在判断投资绩效能力时，大师的判断（此处原文似有OCR错误，推测为“理性”或“客观”判断，但依指令保留原意并修正明显错字“大湿”为“大师”）必不可少。不要轻易相信两三年的“明星”投资经理，不要轻易和还没有穿越过周期、经历过牛熊转换的投资经理人（此处原文似缺失谓语，如“合作”或“相比”，依指令保留原意）。

    - 承认未来的不确定性，把自己的时间花在可知的行业、企业上，而不要轻易将自己的决策建立在对未来大盘的预判，尤其是走势的预判上。

    - 对自己“成功经验”保持警惕，同时也对自己的“失败经验”保持平常之心，要从这些经验中去发现，这些影响是怎么得来的。


