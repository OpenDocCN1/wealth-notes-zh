    这就是我们这个全年的学习地图。在我们进行这个课程的过程中间，不断地有新同学加入，我担心你可能会迷失这个旅程的方向，有了这么一张地图以后，我想你就可以随时随地找到自己的航路。当然你也可以把这张地图分享给你的家人和朋友，让他们跟你一块儿踏上这条寻宝的金融之旅。


