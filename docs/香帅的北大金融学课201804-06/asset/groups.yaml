    # 083 | 有限责任的好处到底是什么？




    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_29_0.png)


    香帅


    你好，欢迎来到香帅的北大金融化学课。


    今天正课的前，我先为大家介绍一下咱们金融领域的大发大事件：昨天上午 8 点 05 分，央行宣布降低存款准备金率 0.5 个百分点，释放增量资金大约 4000
    亿元。为什么要这么做呢？就像我们前课程所提到的，经济运行不确定的加剧，央行需要适度放水、刺激经济。但考虑到目前宏观经济已经下行，且不确定性变大，这次降准虽有预防经济下溜定得过快的考虑，但整体并不急迫，是更倾向于预防经济下溜定得过快的考虑，这些准备会给我们
    12 月的包子课埋了伏笔，过完，好好学习了课程的同学，在看到央行降准新闻时，一定会“站在高处，重新理解新财富”的感觉。


    以后如果有类似的金融事件，我都建议你们去翻一下以前我反复给我们学过的知识，以后我也会挑选其中最重要的为你及时解读。


    相关课程：012 | 央行降准会影响你的钱包吗？


    今天课上有一个有趣的观察：你如果看一下上面一个大的公司名字，基本上全部都是“有限责任公司”，但是你别小看“有限责任”这四个字，要是没有这四个字，全球的股票、股权交易市场，都不可能发展成今天的规模，美国的硅谷、中国的中关村可能也都会不是今天的模样。


    总体上看，有限责任，它是股权投资者的保险，也是企业家精神的源泉。


    # 一、有限责任是股权投资者的保险


    首先，我们来看一下，到底什么是有限责任？举个简单例子，你用花几十万块钱购买了一个有限责任公司的股份，你成了一个股东。你买了股份，你的公司破产了，公司的债权人会不会向你讨债呢？在有限责任的情况下，公司的债权人只能向公司讨债，作为股东，你承担的是有限责任，也就是说，对于你来说，最坏的结果无非就是卖掉股份把钱退给公司。但是，如果一家无限责任的公司，你一个人出资包负责搞倒闭了，你就要用你的个人财产包括你名下的房子、车子、存款来偿还。


    实践和研究都证明，有限责任是公司中高于近亿的一项重要保障，你看它对于投资者来说是一个保险，鼓励它创新项目并去投资，降低了股权投资的成本。如果没有有限责任，我们进行股权投资的后果会发生什么：


    我们来一个大例子。现在有一个科学家，发明了一个使用太阳能的永动机，他后决定成立公司，向外募集股份。甲投资 1000 万成了公司的大股东；另外一个投资者乙则投资公司
    1000 万，成为公司的债权人。现在发生了不幸的事，工厂烧毁以后场上大火，机器、设备、图纸、都被烧成了灰烬，这个时候账上只剩下 500 万的现金，那就是资本不够，要进行破产程序。


    按照破产清偿的顺序，首先我们要偿还债权人的债务，所以乙拿到了剩下的 500 万。那作为 1000 万的，股东是多少钱？另外 500 万该怎么处理呢？如果是无限责任，股东甲就赔了
    500 万，也就是损失了全部的损失也就是他的 1000 万投资；如果是有限责任，股东甲最多赔损失 1000 万，剩下的 500 万就不用赔了。这就是有限责任的意义。


    你试想一下，如果一开始就知道是无有限责任制度的话，甲的投资意愿一定会大打折扣。因为人们总是最担心自己的安全，如果一项投资会威胁到自己的财产的安全受到威胁，人们是不会投资的。


    好，现在我们再进一步地思考这个问题，假设说公司投资 100 万的股权投资，亏得最多，亏 100 万。在有限责任制度下，损失是确定的，但如果是无有限责任制度下，你投资
    100 万的股权投资，可能面临无限的风险，因为你不知道损失是多少。


    这就是为什么购买股票的时候，你必须要考虑有限责任，它保证了你买的股票最多亏损 100%。如果没有有限责任，人们进行股权投资就会极度谨慎，甚至不敢去投资，那整个市场的发展就会受到极大的限制。


    从历史的角度来看，19 世纪，英国在工业革命时期的公司法的变革，确立了有限责任制度。在此之前，股东对于公司的债务承担无限连带责任，这极大地阻碍了资本聚集和企业发展。


    # 二、有限责任是企业家精神的催化剂


    刚刚我们讲过，有限责任是股权投资者的保险。从另一个方面来讲，你会发现，有限责任也是一个企业家精神的催化剂。


    我们都知道，人类的很多创新都是通过商业活动来进行的。创新有两个特点：第一，未来是不确定的；第二，创新者需要风险承受能力。有了有限责任，企业家就可以放心大胆地去创业，失败了也不会背负无尽的债务，这极大地促进了创新和创业精神的蓬勃发展。'
