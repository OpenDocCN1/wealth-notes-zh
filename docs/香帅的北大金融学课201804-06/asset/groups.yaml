    \n# 081 | 古罗马的治理是怎么“外包”出去的？\n\n你好，欢迎来到得到「北大金融学课」。\n\n股票是我们生活中最为常见的金融工具，咱们中国有几十家、成千上万家，很少说价值投资、技术革新，但是，很少有人知道，股份制公司和股票，其实几乎塑造了我们现代全球世界的整个格局。如果读懂了，尤其是世界，是理解宏观金融世界的密码，那么股票则是理解宏观金融世界的部分。内容里面金融的核心概念梳理起来，内部都是围绕股票在股权和公司展开的。\n\
    \n在接下来这三章里，我将带你从公司的本质，股票和公司对于世界的塑造，以及股票所代表的投资者的权利等几个维度来彻底理解这个你生活中最重要的金融工具。\n\n\
    今天我们股权和股票的本质开始。\n\n## 一、古罗马的治理体系的目标：经济利益的一致性\n\n你可能知道，股票是金融工具，股份制公司是一种经济组织形式。但是我们今天要告诉你的是，这种复杂的东西存在表面，股份制的是让不同人的人取得经济利益一致性的安排。而且这种制度安排充当了最重要的社会治理手段。\n\
    \n要理解上面这两点，我们就必须从罗马共和国的例子看起。\n\n俗话说，破坏一个旧世界很容易，但是建设一个新世界很难。对于任何一个早期的政府来讲，最重要的问题是什么呢？就是如何让从众的心变成一致一致，也就俗话说的“治理”问题。大家都知道，暴力只能解决一时的问题，你必须依靠制度安排，然后去创造一种社会秩序，然后取得经济利益的一致，这才能够维持一个社会的长治久安和稳定。\n\
    \n到公元前五、六世纪的时候，罗马共和国已经是一个庞大的国家，疆域达到三百多平方公里，人口有是多少700万，那么在早的历史时期，他们是怎么实现这种国家治理的呢？\n\
    \n在《城邦与奴隶》这本古罗马的经典中，著名的历史学家李维（Livius）描述了罗马统治者通过一个一个的税收制度来实现对庞大共和国的治理和稳定。\n\n具体来说，当时为了更有效地实施国家治理，罗马政府把几乎所有的公共服务都“包”出去，包括军队的给养、公共事务、还有城市街道、城城、剧院的修建维护、捕鱼、放牧、采矿这些工作，还有政府从人头税、土地税的征收。所有的国家治理项目，他们采取自由目标标税，由税收合伙人在这种社会组织来竞标，然后通过这些来完成一系列的国家治理活动。\n\
    \n## 二、税收合伙人制度就是股份制公司的雏形\n\n税收合伙人制度就是我们现代所谓的股份制公司。为什么呢？我们可以从四个特征来看。\n\n- **股本金**\n\
    \  \n  首先，罗马共和国这些公共服务涉及的资金很大，它要求动员的人力、物力都非常多，所以是单人很难完成的。税收合伙人都是以单一的人用是资金入股，而原始的这个公司联络。你看，这全部跟我们今天的公司股集合在一起，完全跟股本金是一样的。\n\
    \n- **永续性与可转让性**\n  \n  其实，金融组织有两个非常重要的特征，一个叫永续性，另一个叫可转让性。因为这种组织要罗马就有承担了大规模的公共服务，有问题和出现的一个组织内部可能会成员离开或者死亡。但是，组织承担的項目和经营不能停。所以，原有成员的权益必须能够被继承或者转让，以保证这个组织的永续性。\n\
    \n  从这里开始，“股份”的概念就产生了，这种股份概念的产生其实是“税收合伙人”这个概念组织在演变过程中被脱壳了。\n\n  你看，首先，可以组织，组织的成员权利和义务就开始按照出资的程度成比例，进行分配，然后契约的方式进行固化。这个股份契约就是被“税收”代表的，就是股份，一被脱壳就税收合伙人的一个基本单位的的所有权。而这种所有权可以进行互换和转让的。购买这个凭证，获得这种权利和义务的人就被称为“股东”。\n\
    \n- **二级市场流动性**\n  \n  这种组织的永续性和转让性，和我们今天股份制公司的股票的概念是一样的。\n\n  股票的概念产生以后，股票的交易就开始慢慢的形成了。到公元前三世纪的时候，这种税收合伙人组织的股份交易已经变得特别常见，当时罗马广泛参加的卡里斯蒂神庙是最大的交易市场。这就相当于我们今天的“股票交易”。\n\
    \n  而在转让的过程中，股份交易的折价和溢价情况经常从发生，股票交易人被发现了，他们可以从股票价格的波动中获利。所以越来越多的罗马公民参与到税收合伙人股东的交易中。古希腊的历史学家波利斯记载，当时几乎每个罗马公民都以某种形式参与了这种政府的租赁。\n\
    \n  那么在这种情形下，一个颇具规模的股票二级市场就已经在罗马形成了。即使它当时的交易本不具备股票市场，那么这个具有流动性的，对于整个社会来讲是有重要性的。这个具有流动性的市场使得税收合伙人力量大。为什么？因为对外来投资者的大变，越来越广，也使他们承接的公共服务范围越来越广。所以税收合伙人组织成为了罗马社会的一个中坚力量。\n\
    \n## 三、税收合伙人制度促成罗马共和国的繁荣\n\n税收合伙人实际上具有现代股份制公司的重要组成部分，永续性，可转让，股东权等等，以及具有流动性、转让性。股票，这一系列的制度安排，对于罗马共和国的存续和繁荣是至关重要的。\n"
  mdcn: "\n在这个分析中，你可以把“国家”替换成“金融机构”，然后把“个人”替换成“企业”。\n\n欢迎你把你的思考放在留言区和我们一块分享，你可以把今天的内容分享给那些经历过90年代“三角债”的朋友或者是长辈，看他们对这个问题有没有新的认识和看法。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_20_0.png)\n\n# 笔记精选\n\nAa\n\n# 079\
    \ 延展话题：为什么我不建议你投资债券？\n\n你好，欢迎来到睿师的大北金融课。\n\n这周我们从债券的角度重新理解了人类社会演进过程中的一些现象。我相信你的金融史大视野已经有了质的飞跃。\n\
    \n在今天的延展话题里，我想跟你讲一个更加实际的问题，也就是更多同学在留言区问的，个人投资者怎么办债券的投资。其实，我想跟你讲的是，从个人投资的角度来说，债券不算是理想的标的。为什么呢？有两个原因。\n\
    \n## 一、债券市场：机构化的金融市场\n\n第一，中国的债券市场是一个高度机构化的，个人缺乏进入的渠道。咱们中国的债券市场，分两个部分，一个叫场内市场，一个叫场外市场。场内市场又叫交易所市场，就是咱们平时接触的上交所、深交所。它对散户（相对机构的）散户参与的可能性比较小，交易所的规则也比较简单，我们可以像买卖股票一样地买卖债券。可惜的是，这个市场上交易的债券只占整个债券市场不到5%的量，剩下的95%的债券都在银行间市场，也就是场外市场交易。\n\
    \n在前面的课程里，我告诉过你，场外市场是不对散户开放的机构间场，像银行这样的大型机构才是主要的玩家。有时候咱们一单买卖都是百亿的规模，根本不是我们散户可以参与的数字。从2017年的数据来看，债券市场，散户的比例不到0.1%，股票的散户比例是42%。这么大的差距就是由债券是一个机构化的场外市场为主的结构导致的。\n\
    \n## 二、为什么债券市场不适合散户投资者？\n\n第二，除了场外市场咱们个人投资者进不去以外，债券本身也不是最适合散户的投资标的。其中最重要的一个问题，就是债券的流动性是比较差的。所谓流动性就是资金随支随取转换变现的能力，流动性差就寓意着你的金融资产出不出去。举个例子，一般来说，你可以理解的是，交易所股票的流动性最好，因为你可以随时找到买家。而债券，它的交易远不如股票频繁。\n\
    \n举个例子，我们经常时常用“换手率”，也就是衡量资产转手的频率来衡量金融资产的流动性。频率越高，就证明这个资产的流动性越好。\n\n今年3月份我们有一家上市公司叫大发发电，今年3月份的股票换手率是6.76%，而同一家公司发行的债券的换手率是0.0042%，差300多倍。这是你在相对活跃的交易场所。\n\
    \n在银行间市场上，今年3月份有300只企业债，换手率都是0。有时候可能是好久没才一单买卖。所以说，如果你持有过债券，你会发现，你想买的时候找不到卖家，想买的时候找不到买家，万一碰到对手市，交易就更加稀缺了。比如说2011年的时候，中国发生过一次国债市无价市，当时整个债券市场一次价，处于一个无价无市的状态。你想想，那时候如果持有债券，想卖房，想换手，小楼价卖房，不要说你的债券买八折，估计直接要卖不出去。所以债券对流动性需求比较高的个人投资者而言，不算最佳选择。\n\
    \n除了流动性差以外，债券投资的逻辑是宏观投资的逻辑，这对个人投资者来说也是相对陌生的领域。在股票中，我们强调的是个价检验，这个价值投资的理念是什么？企业微观数据到细致的把握。对于企业，投资者可以通过研究研发，分析行业，了解竞争对手的种种微观信息来极具性分析。这种微观对冲对咱们个人而言却是容易的，但是债券的逻辑不一样，在上周五的课程里，我跟你讲过，债券的收益率是跟着利率走的，而利率的波动又跟宏观经济环境有很大关系。所以，债券投资考验的是宏观逻辑，需要投资者对宏观经济面有深入的把握。\n\
    \n很多人认为，债券同股票简单，其实债券投资对专业技能的要求要高得多，很多著名的对冲基金，像索罗斯，劳宾逊的老基金，这里要说的桥水基金，他们引以为傲的全球宏观策略就叫债券对冲策略的。所以说，“把握宏观基本面”这件事情是很复杂的，个人投资者缺乏这方面的训练。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_21_0.png)\n\n有的同学不服气，说我其实对宏观经济基本面有很深刻的认识，我建议，不妨给自己做个小测试，每个季度预测一下你的CPI和PPI大概在什么水平。CPI和PPI分别是国际通用的物价和生产的价格的宏观指标，咱们的央行每个月都会公布。除非你能连续做约7次以外，每次预测的误差都在5%以上，否则很难证明你对宏观经济面有很深的认识。\n\
    \n在现实生活中，我们其实可以看到，宏观分析对大多数个人投资者而言，门槛都较高，比较难过。\n\n## 三、个人投资者更好的选择是什么？\n\n听到这里的时候，你可能就会感觉，那债券投资是不是个人投资者最合适的？也是这样的，要想参与债券投资可以买入债券基金，基金管理公司会帮你做宏观分析、做研究。而债券基金也避免了债券本身的流动性。\n\
    \n给你举个例子，比如说有一个叫“光大转债”的基金，它的波动很大。单年振幅达到5%，而换手率也很低，近几年，单季的换手率不足1%，也就是流动性很差。但是有一个债券基金叫“财立方安心固收债券”，它丰富了这一种。在这一年中，这个债券基金的波动率是那个单一债券的一小半，也只是到了2.5%，换手率大概在30%，是单只债券流动性的30倍。所以，你看，通过投资债券基金，你既投资了债券，又避免了债券本身流动性的一些缺点。\n\
    \n在美国市场上，个人投资者都通过基金来投资债券市场。但是，我们中国债券市场的情况比较特殊，我们的债券市场是不小的情况有7万亿左右，主要是中小类金融机构以及为企业融资的信用债规模很大，占到债券债的1/3左右。更重要的是，很多债券发行企业都是国企，地方政府隐性担保。那这种“刚性兑付”的问题，使得债券的信用债信息被低估，债券的收益率并不能够全面反映它在内的风险。\n\
    \n这几年，货币基金强盛崛起就分流了很多的中小投资者，为什么呢？因为债券基金的流动性比货基更好，风险不大，但是收益率却一点也不低。以2017年为例，债券的平均收益率是2%左右，货币基金却是3%，所以咱们投资者会选择货基。这几年债券在市场资产场的份额占了差不多一半，货基只有10%左右。\n\
    \n所以，在目前的管况下，我个人认为，债券对于个人投资者来评不是最理想的标的。\n\n# 今日概要\n\n# ■划重点\n\n- 1. 中国的债券市场是一个机构投资者主导的市场，绝大部分的债券是在银行间市场上进行的；\n\
    - 2. 债券对于散户来评不是特别理想的投资标的。一方面债券的交易流动性非常差。另一方面，债券的收益考投资者的宏观分析能力，对于个人投资者而言，门槛是比较高的；\n\
    - 3. 个人投资者可以通过债券基金参与债券投资。但在中国债券市场存在刚性兑付，收益和风险不匹配的现象，参与价格限制不够，限制了投资者参与债券投资的热情。\n\
    \n# 睿师\n\n今天的课程里，我提到债券，债券市场的流动性比股票市场要低很多。所以你们不能会生出来一个感觉，债券投资不就是一个封闭型的东西，那么我们还是不太考虑一下，我们中国债券市场的规模仍然有70万亿，比股票市场还大。\n\
    \n仍然有70多万亿，比股票市场还大。为什么有那么多的机构投资者还是要在这个市场上交易，购买债券呢？\n\n欢迎你把你的思考放在留言区跟我们一块儿分享，你也可以把今天的内容分享给你那些做债券交易的朋友，看看他们能不能够帮你解答其中的奥秘。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_22_0.png)\n\n# 笔记精选\n\nNicholas 18\n\
    \n# 080 | 本周问答：科斯定理的原意到底是什么？\n\n你好，欢迎来到春帅的大二金融学课。到了本周的问答时间，还是跟平时一样，我挑选了几十个比较具有代表性的问题，来给大家做一个解答。\n\
    \n我们先来看第一个问题，在上周一第二课程中，我出了一个题目，就是精准的个人信用分。它需要大量地非使用你的隐私数据，我猜想说，你对这个行为的想法很多同学在留言中都说，科斯定理认为，数据谁用得好，就应该归谁。\n\
    \n本人赞成这种做法，但是现在隐私泄露造成太多麻烦，希望数据能够被好好利用，但不知道这个如何才能实现？\n\n**春帅**\n\n坦白地说，这是一个暂时并没有完美解决方案的开放性问题。前两天在在美国的参议院举行的听证会上，脸书的创始人扎克伯格在接受关于用户数据使用的询问，很明显，美国的在遭遇和我同样的困惑。目前实实际处理办法，比如说在一些立法制度比较完善的国家，是通过严格和复杂立法来规范平台公司使用数据的方式和界限。一方面要发挥这些数据的功能，但另一方面又要保护个人的隐私，这样的立法往往很复杂，要充分考虑，如果有人违反，处罚会非常地严厉，更重要的是，谁用得好，这个问题本身就是个伪命题。\n\
    \n在现实生活中，谁来判定谁用得好呢？可能会一个疑惑，是不是科斯定理理解了呢？不是的，我们班上有一位同学，‘巨石网’对这个问题理解得非常有位置和深刻。他在留言中提道，‘科斯定理是有任何规定的，就是交易成本为零，是不是任何忽略而忽略用。’呃，形而上学地看是很危险的。‘巨石网’同学这个学的是很有例子，股把巴菲特把你的资产用到越好，难道你的钱就是他的了？显然不是。\n\
    \n那科科斯定理的原意到底是什么呢？科斯定理的原意是说，不影响经济活动的效率，产权的归属不影。如果我们说翻译到数据是这样，就是说如果把交易成本忽略，那么数据归谁使用就不影响数据资源的优化使用。\n\
    \n为什么这么说呢？你看，假设数据属于个人，但是全台公司用得好，那么平台公司就可以购买买个人数据，挖掘数据资源，实现利益最大化。所以，尽管数据属于个人，但不影响全台公司使用数据，也不会影响大家从数据资源中获取最大的经济效益。同时，个人通过出卖数据也会得到好处，以、数据归并不影响数据资源的优化使用。\n\
    \n但是，你不要忘了那个关键的假设，其实这个的科斯定理真正的隐含在于，交易成本为零，这个假设的交实实中存在，交易成本不仅不为零，而且经常非常高，所以交易很难实现。\n\
    \n在数据隐私这个例子中，你会把你的隐私卖给全台公司吗？如果真的话，用什价格卖？卖了以后全台公司不能保证你的信息不被滥用呀？因为这有点担心，即使一些人愿意卖，但总是有很多人不愿意卖，众口难调，最后这样的数据交就根本达不成。所以而多时间，平台公司根本就不向你买，而是直接占有你的数据，你根本就没有机会选择。\n\
    \n你可能会说，直接占用不合理，可是可能怎么办？除非不上网了，这也恰恰说明了现实生活中的交易是很复杂的，没有全其美，往往要么是不做，要么就是霸王硬上弓。\n\
    \n所以，科斯定理的真正含义是说，因为存在交易成本，现实生活中很多交易很难发生，因此清晰的界定产权就显得非常。用这些数据属于平台公司，他们就可以用这些数据来获取经济利益，那\
    \  个人的隐私可能受到伤害。如果这些数据是属于我们个人的，出于隐私保护，我们就不会出卖这些数据，或者索要很高的价格，导致利用数据变得非常困难。\n\n你看，正是因为这么个两难的局面，所以数据隐私和便利性中的结论才会让所有聪明人，包括互联网巨头和各国的监管层都感到这么头大。\n\
    \n**春帅老师，今天讲的，确实颠覆了以前课上讲的“物物交换”的认知。在赫拉利《人类简史》中提到货币人人的“超能力”就是共享故事。当然，‘货币’本身是故事和信仰。法定的背后支撑是国家主权力量，那像欧洲统一推出欧元，是不是会削弱欧洲成员国的\
    \ 主权？**\n\n**春帅**\n\n其实，文中提到的，在过去4000年里，货币一直是“政府”的造物的这里，“政府”可以打一个引号，它不一定是我们 现在国家的政府，它可能是一个酋长，一个村庄里的代表，是一个成权威。这种权威成为货币树立了使用，使得大家相信货币有信用支撑。一旦相信，这个信用就可能持续下去。\n\
    \n比如说，黄金在历史上很长一段时间里充当了货币。但是1970年以后，它已经不定货货币了，但是大家还是相信黄金具有货币的，各国的央行还是大量地增持黄金。遇到天灾人祸，或者可能战争的时候，黄金的价格还是会上涨。\n\
    \n欧元的推出，其实是一个复杂的问题，欧洲多年来追求小孤立，市场分割之症，一直在追寻市场的扩张。那么欧元区就是这种想象的投射。而且，第二点，美国大一统大，是美国贸易政策的重要技术之。欧洲的储备币一直得不到统一，所以才会各国取代美国又不够强大，所以才会有欧元取代德国马克、法国法郎，成为一个更强的货币，那么一种语言，国放弃了自已的货币发行权，当然是让渡了部分的主权。但是，欧元诞生以来一直波折不断，其实说明欧元的设计有问题。这个问题的实实说，就是欧元背后的国家主在博弈。具体地说，就是欧元国的主权的支持其实不够强。\n\
    \n怎么讲呢？欧元区各国让渡了货币发行权，但是没有让渡政权，更没有让渡军事。这说明欧元背后的主主权支撑是很弱的。这也恰恰为什么在看到后是一个很大的隐患。虽然欧元区的经济地位和美国差不多，但是欧元的地位根本就没有办法和美元抗衡。\n\
    \n**现在互联网巨头在各的垂直领域内利用积累的数据能够做到精准投放，是不是意味着身躯就垄断了一部分行业的业务。如果数据继续流动下，算智能越来越精准，整个市围会不断扩大，当信息完全利好了，你能不能抗和互联巨头竞争？小银行又如何与大银行竞争呢？**\n\
    \n**春帅**\n\n这一组的问题，其实特别有代表性。虽然很多问提，但是我觉得他可以看出一个热急，就是有一种对信息技术的误解。很多同学认为，现在的技术能够知道信息完全开放，能够放到就像在里理论传统的业务，其本质就像体育课里说的，互联网的技术确实实是改善了信息的收集和整理。分析，帮助克服了很多信息不对称问题。但是，帮助克服的，这个过程中间，其实产生了很多新问题。\n\
    \n一个最典型的例子是，现在互联网上可以用了很多信息。在举例来说，网站上的事加和评论是可以专门打造的，这是明显地增加信息干扰。那么如果  金融从业者依据这些\
    \  信息，他可能会做法去反向区别这些信。追高一尺，压高一丈，竞争优势的人会在 这个市场中生存，这些优势可以是资本优势、规模优势、技术优势、管理优势等。\n\
    \n改变了信息不对称的方式,改变了竞争的方式,但是不能够消灭信息不对称,更不能够消灭竞争。\n\n**香帅**\n\n限于时间,今天就先简短地说这些。科技金融的内容,我们的课程会有一个专门模块,会跟大家把这个未来的趋势讲得更加清楚。\n\
    \n最后,我想跟大家说两句,就是最近一周的课程比较颠覆大家的认知,我从债务的角度帮你理解和思考了社会的发展,而且课后的思考题都非常地烧脑,好多同学都给出了自己的真知灼见,很多课堂笔记让我也深受启发。\n\
    \n但是,也有的同学表示太难了,自己难以下笔,写不出好的笔记。我觉得其实即使一时回答不出这些问题也不要紧,你可以把你对课程的所思所感写下来,也许在写的过程中就有思路了。更重要的,这是个梳理的过程,你可以在这个梳理的过程中更加清楚这些天学到的知识。\n\
    \n# 第十八周｜课件放送：本周划重点时间到！\n\n你好，欢迎来到香帅的北大金融课。\n\n又到了一周的课件放送时间。每周的今天，我都会给大家“划重点，敲黑板”，把本周的课件用PPT图片的方式给你放到文稿里讲一遍。我们把本周的知识点和重要逻辑串讲一遍。这一周我们给你讲了国家和信用货币理论以及中国的债券市场。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_25_0.png)\n\n## 第一天：货币真的起源于物物交换？\n\n\
    第一天，我给大家介绍了国家信用货币理论的概念。你知道了货币起源于债务而不是物物交换，国家信用为整个社会的债务关系背书，这使得作为债务凭证的货币得以流通和交易。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_25_1.png)\n\n相关课程：076 | 货币真的起源于物物交换？\n\
    \n## 第二天：欠债不一定还钱——债务违约的必要性\n\n第二天我给大家介绍了债务违约的相关内容。在这讲里，你知道了没有违约的债券市场是不能持续的，因为它违背了“风险-收益平衡”的原则，会产生极大的道德风险。在现实生活中，债务重组是解决债务问题常用的一种方法，它也是一种社会成本更低的策略。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_25_2.png)\n\n相关课程：077 | 欠债不一定还钱——债务违约的必要性\n\
    \n## 第三天：债务螺旋——中国王朝更替的金融逻辑\n\n第三天我接着讲了中国古代王朝更替背后的金融逻辑，即债务螺旋。在农耕经济的古代中国，债务网络可以简化为国家和个人之间的债务关系，即税收；和个人与个人之间的债务关系，即民间借贷。一旦有天灾人祸、外敌入侵等外生冲击，这两种债务关系就会迅速恶化，形成杠杆率交替上升的“债务螺旋”，最后以王朝更替而结束。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_25_3.png)\n\n相关课程：078 | 债务螺旋——中国王朝更替的金融逻辑\n\
    \n## 第四天：延展话题：为什么我不建议你投资债券？\n\n第四天我接着给大家介绍了中国债市。债券市场是一个机构主导的市场，95%的债券交易量在散户没法进入的银行间市场发生。债券流动性差，对宏观分析能力要求高提高了散户投资债券市场的门槛，个人投资者如果需要投资债券可以通过购买债券基金进行。\n\
