    # 071 | 你的个人信用，很值钱！


    欢迎来到香帅的北大金融课程。


    本周课程开始之前，先预告一个好消息。我们春节房地产专题课程里公开征集的留言问题，我陆续在整理和回复中，但还有大家关心的很多问题没有回复，比如：


