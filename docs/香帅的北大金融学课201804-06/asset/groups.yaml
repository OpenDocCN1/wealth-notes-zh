    ### 香帅


    我们今天虽然讲的是衍生品交易里面可能会犯的错误，其实你想一想，我们今天讲这些问题，在你们个人的生活中，其实经常可见。比如说你看到了长期趋势，但是没有扛过短期波动这种事情。现在创业公司里面就非常地多，很典型的一个例子就是易到的周航，他看到了共享出行的“诗和远方”，但是没有扛过眼前风投大战的“苟且”。


    我想请你思考一下，在个人的生活中，或者你所在的行业里面，有没有这种长期趋势与短期波动相违背的事情？通过这种分享，你会发现其实金融知识并不局限在金融市场上，而是散落在我们生活的每个角落，如果你的知识内化做得好的话，金融知识完全可以转化成你的人生智慧。


