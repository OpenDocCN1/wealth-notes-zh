    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_15_1.png)\n\n## 076 | 货币真的起源于物物交换？\n\
    \n“你好，欢迎来到香帅的北大金融学课。”\n\n在上一个课模组里，我跟你讲债务关系是人类社会最根本的社会关系，这一期我会和你一起从债务的角度重新认识世界。你会发现使债务关系的演化中产生了货币，甚至奠定了文明的体系，种种我们所臆见的历史变迁，其实背后都是债务关系在起作用。\n\
    \n今天先要给你讲一个非常有哲学高度的金言理论：国家货币信用理论，它的核心论点就是货币起源于债务，作为债务关系的度量单位。货币和信用之间的关系不可分，非常有趣的一点在于什么呢？这个理论其实一直被主流的经济学家教科书所排斥，但是在国家中央银行的实践上不断地被应用。\n\
    \n### 一、货币源于债务\n\n首先我们来看一下，为什么说货币源于债务？在经济学的教科书里，都会给经济学编历史。当斯密为货币起源的论述。在一个村庄里人与人之间进行物物交换，然后货币产生——交易物—货币，所以货币是一种商品，是“市场”的产物。这个故事是如此深入人心，我们很少有人怀疑它的真实性，然而越多的去查阅的人类学的证据告诉我们，在人类社会发展过程中，纯粹的物物交换的世界其实从未存在过。其实在很久以前，亚当·斯密自己也承认，他所谓的村庄是他虚构出来的。\n\
    \n信用货币理论认为，所谓经济系统是庞大的物物交换系统，这么一个系统会因货币的缺乏本来没办法运行的。不管这个货币是以牛、贝壳、盐的存在，在古代的时候是牛、盐、贝壳，后来是黄金。换一个说法，我们认为货币是市场的必要条件，起源于人们在交换中产生的债务关系，而且又成为债务关系后量度的“信用”。而且我们经常见到的货币单位：元、镑、马克，都是某种度量衡量单位，它本质上是对“信用”的度量。\n\
    \n到这里你可能已经明白了，和传统的经济学说“货币源于物物交换，是先当似等价物的商品”不同，信用货币理论认为货币源于债务，它是一个债务的度量单位，衡量的是人们的债务关系。现在很多人类学的考古研究都表明，历史上的人们没有过纯真的物物交换。也就是说，即使在最原始的时代存在着某种货币，可能就是刀币，它可能存在，它可能是盐，也可能是金属货币的形式存在。它的作用就是帮助人们度量和衡量在物物交换中形成的债务关系。\n\
    \n其实，在实在的科学例子中，你可能会对物物交换有个错觉，认为物物交换是一个人拿着一只鸡去换五只鸡，但是现在世界就是这样去交换是不存在的。真实的交换场景是什么样子的呢？\n\
    \n张三从李四那里买了一只鸡，然后他会写一张欠条，然后把这张凭证给李四，承诺未来会给李四和五只鸡同等价值的一种东西。接下来李四拿到张王四那里买一双鞋，就把这个欠条拿给王四了。如此类推下去，在一个村里彼此交换的过程，其实就是个欠条或者凭证流通的过程。那么这个凭证流通的时期是漫长的。渐渐地当人们忘了最开始的主人是谁，这个时候欠条就演变成了具备流通的功能。换一句话说，在这种物物交换的过程中，债务关系是货币的形式被强化，单位货币的价值也就是代表着人们对欠条发行人的信任程度。\n\
    \n这个过程可以发生在一个小村庄，在物物交换体系非常简单的时侯是没有问题的，但是如果在同一个大城市里，当这个交换体系变得非常复杂的时候，这就有问题了。最大的问题就是，一张、两张、三张欠条满足不了我们的要求，这个时候我们必须提供更多的欠条，保证所有的人都能使用这样的货币来进行日常交易，否则按照这样欠条的数量来进行，那就是“通货膨胀”。所以欠条的数量在大城市里不是一张两张，而是几万甚至几十万个。\n\
    \n### 二、国家信用，货币，与债务\n\n这个时候其实又产生另外一个问题，这么多欠条到底能够保证哪些人，尤其是那些我们不认识的人会对这个欠条进行履约呢？这个问题我们可以从人类历史上第一个央行——英格兰银行的成立中找到答案。\n\
    \n在17世纪的时候，英格兰有一个银行团借给了国王120万英镑，就给了这个银行团以兑换英镑的欠条。这些欠条在发行的时候就获得了资本批准的特权，上面盖着女王的印章，任何携带到财政部兑换的居民都有权利可以使用国王的欠条来进行交易。那这个步骤意味着什么？意味着用一张张的欠条去兑换英镑的国债，国债开始流通起来，或者王室的债务被货币化了。这些国王的欠条就是英国的法定货币英镑。这个例子其实告诉我们，人类历史上的第一家央行是建立在债务基础上的，法定货币的发行也是以债务为基础的。\n\
    \n其实直到今天，英国女王的这个120万英镑的欠条也没有还清，因为如果这笔英镑清欠了，英国的整个货币系统会不复存在。其实现在从全球范围来看，这种建立在债券基础上的发行和法定货币体制，已经是美元、欧元、人民币，它们都是用国家的信用做抵押，再发行到市面上。所以在发行的货币都是负债，发行债也意味着是央行的“负债”。\n\
    \n但是这里还有问题，为什么我们会信任一张代表债务的纸呢？其实第三章的课程我告诉过你，纸就是法定货币，它代表了国家信用。今天你可以将这个问题进一步地理解，国家信用背后支撑的共同的是社会成员关系的信任。然后法定货币就充当了全国债务关系和债务认定工具，而国家就充当了我们公民彼此之间债务的信任担保人。\n\
    \n所以从这个意义上讲，不管是一张纸还是其他的物质，黄金、甚至是纸代币，国家同意接受的任何东西都可以成为货币，只要它们能够在国家和国民之间形成关系，可以在意愿交易的人的手里去流通。这是伟大的经济学家马克思在研究货币的过程中得出的结论，他说不管是否用于交换，长期以来，货币一直是“政府”创造的产物。这里的政府可以打个引号，不一定是我们现在的国家，它可能是一个镇长，一个村庄的代表，一个权威。在这个契约时代，借据偿还的时候，文本之间载体来担保物品偿还，能够和合约的描述对应，然后发行同等值的债务凭证，这就是货币真正的起源。\n\
    \n### 今日概要：\n\n- **划重点**\n  - **第一，货币是起源于债务的，它充当债务的度量单位和债务关系的凭证；**\n  - **第二，国家信用为整个社会的债务关系提供背书，那么作为债务凭证的货币因此得以流通和交易；**\n\
    \  - **第三，这是国家信用货币理论，这个理论以往虽然被主流经济学所忽略，但是都得到了人类学事实的很多支持，而且也在现实中超越国家和中央银行的实践中所发现。**\n\
    \n在提出今天的思考题之前我给你简单地介绍一下，就是以亚当·斯密为代表的古典派（国家信用）大概是18世纪末到末期，那个时代正好是英国工业革命兴起，人民运动开始发生的时期，贵族们要求争取更多的民主权利，所以像主权、金融监督这些在当时是非常流行的。而你想在当政发生之后，我再给你给出今天的思考题。今天的课程里我把国家信用货币理论讲给你，这个理论从亚当·斯密发端长期被主流经济学界所忽略，我想借着你学，为什么它长期不受重视，以及它和什么关系？它一开始看上去很有利、有节，而且也能够得到很多主要经济的理论支撑，从长期地得到主流经济学界的排斥和忽视呢？欢迎你把你的思考发在留言区和我们一起分享。\n\
    \n## 077 | 欠债不一定还钱\n### ——债务违约的必要性\n\n你好，欢迎来到睿哲的北大金融课。\n\n如果你问欠债是不是不一定要还钱呢？你会不会感到有点惊讶。这是我们一般人的认知中，欠债还钱是天经地义的事情。但是绝大多数人没有意识到的是，欠债不还（债务违约），也是债务关系相伴而生的。恰恰是债务违约的存在保证了债务市场的正常运行，这就能够维系生死一样的正常新陈代谢，就像动物界的老死病残，另有的新陈代谢才能保持生态的延续。另外，赦免债务，也就是债务重组，是解决复杂危机的重要方法，也是一个让社会成本更低的策略。\n\
    \n### 一、没有违约的债务市场不能存在\n\n下面我们首先来看看为什么债务违约是债务存在的所有必要条件？首先，一个没有违约的市场是从世界上金融的“风险——收益的均衡”上，从理论上来说是对整个风险是不存在的。因为债务的利息包括两个部分，一部分是资金的利息部分，另一部分就是债权人，也是说借给你的个人，承担者被赖账的可能性及违约风险而要求的补偿。这个风险越高，要求的补偿就越多。\n\
    \n所以说如果所有的债券百分之百都确定会得到清偿，也就是完全没有什么违约风险的话，债权人（资本）从持有人中无息地按时、依约，债务人才会增加无限制的低成本的资金，这样一些其他的融资工具和融资方法也就没有什么存在的必要了。金融市场最后会变成一个规模有限的债务市场。那很明显，在现实生活中这是不存在的。\n\
    \n除了违背这个“风险—收益均衡”的原则之外，缺乏违约的债券市场还会产生一个很大的问题，叫做道德风险。\n\n咱们中国的市场上有一个你很熟悉的词语，叫“刚性兑付”（刚兑），说的就是为了避免债务企业的破产，政府会出手买盘，强行将原本应发生的违约事件化解掉，也就是说政府人为地将违约的风险降到零。我们就知道金融的收益率跟违约风险是正相关的，违约风险越低，要求的收益也就越低。现在违约风险被人为的化解了，那么“风险—收益均衡”的价格信号就消失了，就会造成市场的扭曲。\n\
    \n上个世纪90年代的时候，咱们国家有很多有企业破产的次级债，因为它们都有政府兜底，没有破产的压力，所以就是全然不顾自己偿付能力而拼命地借款。而另一方面，这些债券的投资者主要是国内银行，因为有政府兜底，它们也不关心违约风险，就认购了大量根本没有偿付能力的债券，让银行的资产质量变得越来越差。这种情况后来就演变成流弊，导致了银行坏账率超高，整个社会的债务关系非常的恶化，最后政府被迫让金融体系休整关闭，直到2000年以后才重新启用。\n\
    \n### 二、赦免债务（债务重组）是社会成本更低的策略\n\n现在你已经明白了，和自然界的代谢新陈代谢一样，债务违约其实是债券关系存在的必要条件，没有违约的市场就像没有死亡的生物一样，很难想象一个不良的生态。可能现在，在想象，我们是不是应该让那些违约的企业或者违约的国家破产，进行债务清算？我们考虑的这个地方也会更加健康呢？答案是：不一定。在现代世界里，你会发现有很多时候赦免债务或者债务重组，是一个社会成本更低的策略。\n\
    \n比如说欧洲央行对希腊政府的救助就是一个特好的例子。2009年，希腊政府就宣布当年的财政赤字占GDP的比例已经超过了12%，远高欧盟建议3%的上限，面临债务危机，远居欧压位。然后希腊的国债价格开始暴跌，面临着主权债券违约的风险。刚开始的时候和很多市场自由主义的想法一样，欧元区成员国坚决推动希腊削减开支，无条件的威胁希腊必须从经济内部解决来应对经济危机。而且还会引发本国纳税人的不满，所以救助计划就迟迟不能出台，希腊在债务危机里越陷越深。紧接着葡萄牙、西班牙也都爆发出财政问题，接着一个很健康的德国和法国也受到了拖累，一场新的金融危机看上去马上就要在欧洲全面爆发了。\n\
    \n这个时候欧洲央行和欧元区各成员国就开始采取了紧急的救助措施，其中最重要的措施就是把希腊的国债减免了50%，相当于让步希腊政府躲过了1000亿欧元的债务。那为什么减免希腊的国债呢？因为这是希腊欧元区最大的主权债务方。欧元区各主要成员的国家债务，经济依赖度是非常高的，可牵一发而动全身，当时的希腊的债务危机已经影响了国际社会对欧元区的态度。所以如果放任下去，蔓延到希腊一路的神级债务危机也会蔓延，最终所有的损失是巨大的不可估量，所以让希腊赖账是而愿意承担巨额损失是成本相对比较低的一个策略。\n\
    \n我在北大讲“公司金融”的课上，会用一个小例子说明为什么允许债务人欠债不还，可能是一个对双方有利的相较择的改造。比如说一个公司有1亿元的债务，从种种对这个公司价值判断的客观指标来看，能有的价值则5000万元。但是这个公司，债务有50%的概率能够赚1.5个亿。好了，这个时候公司的债权人就有两种选择：第一种选择直接去起诉它，让这个企业破产清算，然后债权人拿到它账上剩下的5000万元；第二种选择就比较复杂一些：债务人争取，比如把原来的一个亿的债务降低到7000万，同时进行债务重组，用更低利率的新债来偿还老债的债务，然后重组经营。\n\
    \n那么哪种方法好？我们进行一个简单的计算后，你就会发现，在第一种方案中债权人手中的最大金额是5000万，在第二种方案中债权人得到的是7000万，也就是50%的概率拿到1.5亿的收入是7500万，然后债务人又拿到剩下的5000万。很显然，第二种方案对债权人进行债务重组是对双方更有利的选择，也就是所谓的帕累托改进。\n\
    \n这当然是简化了的例子，但是在现实世界中，你是能观察到像债务企业、政府、国家中最常见的金融行为。比如这几年中国在地方政府上采取了债务重组的做法，以低息的新债来置换那些高息的旧债，实际上就是允许债务失信重组，将负担转嫁给双方，它们负担反复的。把债权转换成股权。从某种意义上理解，这也是一种变相的债务重组的方法。我想请你结合今天的课程，仔细地思考一下，这种方法的好处和弊端各在哪里？\n\
    \n好了，欢迎你把你的思考放在留言区跟我们一块分享，你也可以把今天的内容分享给你那些在银行业工作过的朋友，看他们对这个问题是不是有更进一步的思考。\n\n\
    谢谢\n\n# 香帅的北大金融学课\n### 站在高处 · 重新理解财富\n\n版权归得到App所有，未经许可不得转载\n\n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_18_0.png)\n\
    \n## 078 | 债务螺旋——中国王朝更替的金融逻辑\n\n你好，欢迎来到帅帅的北大金融学课。\n\n不知道你是否现在已经感受到了，从金融的角度来看社会的演进，它是一个非常有趣的旅程。细节极其复杂，但是逻辑异常简单的。比如如果我们尝试从债务关系的角度来解释中国历史的话，你就会发现王朝的盛衰几乎全都是跟内部债务关系破裂、新的债务关系重建的过程。\n\
    \n我可以用一句话和一个词语给你概括，国家和民间债务关系互相影响恶化的一个“债务螺旋”，是中国王朝更替的金融根源。\n\n### 一、社会债务关系的三角\n\
    \n这个结论可能让你感到很诧异，是你仔细想一下逻辑并不复杂。我们来看一下什么叫“债务螺旋”。尽管社会上的债务关系纷繁复杂，但是按大类分无非是官方、企业、个人三个中间的一个非官方主体。在农业经济的古代中国，这个网络可以简化为国家、个人、个人和他人中间的两类关系。就像我在上一课的讲座课讲过的，国家和大个人，也就是居民中间的债务关系主要体现在各种税收。在这个债务关系中，你可以将政府理解成债权人，居民是债务人。税负越重，居民对国家的负债就越强，也就是杠杆率就越高，而且这个债务的履约成本是很高的，不纳税可能会被送进监狱。\n\
    \n除了国家、个人中间的这种债务关系之外，另一种债务关系就是民间的个个人和个人中间的关系。在传统的中国社会，个人一般在基本准则，所以民间的债务网是“出账生息”，在黄，或者说是天灾人祸的时候。这个时候很明显，债务人会处在绝对的劣势中，所以他要向民间商民借债和非常苛刻的抵押条件。中国的民间借贷一般都是按月计价的，一般所谓的三分子就是每10%，年化利率就能达到36%，而抵押一般也是超强抵押，经常会包括房子、土地，严苛的时候甚至包括妻子、儿女等。\n\
    \n所以这两种债务关系构成了传统中国社会的债务形态，你可以把它理解成一个三角形，它的稳定程度就取决于这个三角边的杠杆率是不是适度。\n\n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_19_0.png)\n\
    \n而从另一个角度来审视中国自古维护的政权合法来看，一个相对健康的社会环境就应该是杠杆率相对低的社会，比如说税负较低，就可以有足够的“富庶于民”，让民间休养生息，能够自谋生计，为扩大再生做储备。你看，历史上的盛世前夜不具备这样的特征。汉明文的文献，唐穆宗的贞观之治，甚至政治史家史论的清朝同治年期间，税负和民间借贷都处于比较低的水平。\n\
    \n而从另一个维度信息，从汉朝以来中国就是一个相对简单的官僚治理结构，管理着庞大而复杂的帝国，所以“国”是历代历史的侧，而“百姓”是需要被统治的。在这种关系中，债权人和债务人都是处于比较对等状态的，杠杆权会变大，社会的张力、状态的摩擦就会变大，而“维稳”的成本就会急速地上升。所以杠杆率是中国社会持续稳定结构运行的一个大必要不充分条件，也是传统中国社会“去金融化”的根源所在。\n\
    \n### 二、明朝是如何被“债务螺旋”击垮的？\n\n但是，所谓的稳态结构其实是不可持久的，因为一旦有外部冲击，比如天灾人祸、入侵之外，这两种债务关系就会迅速恶化，形成一个杠杆率交替上升的“债务螺旋”，而这个稳态结构打破，最后以王朝的更替结束。\n\
    \n以我们最熟悉的明朝为例，明朝虽然延续了300多年，但是从未开始，它的社会一直比较大，不是一个自然均衡的状态，而是靠庞大的集权行政系统强维持来的。那为什么要一个庞大的官僚体系，国家必须去征服一个庞大的，同时因为民间财富被挤压，在春天吃透的年代里会一点自然民变。旱灾、涝灾、虫灾会造成民间杠杆率大幅上升，债务关系恶化。民间债务关系恶化的极端表现就是“民不聊生，揭竿而起”。\n\
    \n那朝廷怎么办呢？民间债务关系的恶化意味着什么？意味着借债成本急骤上升，所以财政支出会出现巨大的缺口。财政支出巨大的缺口以后，朝廷没有其他的办法，只能加赋，提高税率去百姓的杠杆率，从而又导致民间债务关系进一步恶化，更多的民众陷入贫困。你看，这样一来，两种债务关系就互相加强恶化的趋势，杠杆率交替上升，一直到这个稳态的结构被彻底打翻。\n\
    \n到明朝后期的时候时局已经比较困难，到崇祯皇帝上台的时候北方又碰到了大旱，导致了游牧民族生存困难，只能来攻，所以明朝的军费开支就极大。这个冲击击着崇祯皇帝只能够加税，在原有九成的基础上又加丁里，所以民间的杠杆率，平时为了应付军事开支，崇祯皇帝还大规模裁撤“公务员”，全国的赋给当时缩减了1/3。其中有一位“失业的公务员叫李自成，其他包括张献忠、罗汝才、高桂香、姜老素等在这一时期非正式进入民众，卖儿子卖妻子的现象非常普遍，民间的债务关系恶化得厉害。李自成也是这个民间债务关系恶化中的一个环，他借了这个民乱，虽然被敌人告到朝廷，差点被处死，幸好被亲戚救出，然后自给以以后，不负一人之下二把他的债主就给结了，欠债太多。然而他看的满清复仇就投身了起义军，成就了历史上最有名的李自成起义。\n\
    \n起义军一路势如破竹，逼迫朝廷必须加大军费开支，只能进一步压缩底层民众，各种苛政收税，那税负的加重使得民间的债务关系进一步恶化，逼迫更多的“债务”加入了一起起义。两边的杠杆率相互交织，螺旋式上升，直到明明的这个稳态结构不可承受，走向崩溃。这样做也获得北方的游牧民族有机可乘，清军入关，朝更替。\n\
    \n明朝的这个例子其实在中国的历史上一点都不新鲜，历时历史大多是因为这种“债务螺旋”，导致社会的维持成本升高，直到当期的政权不可承受。秦朝的覆灭，隋朝的覆灭、宋金的覆灭，无不是在这个“债务螺旋”下的故事重演。\n\
    \n更有意思的事情是，历史其实总是在不断地重复自己。每次王朝的更替之后，新朝廷一般会行两件大事：第一是大赦，除了赦免犯人的罪行以外，就是废除前朝的一切债务，相当于剪去“杠杆”，用强烈的办法理顺民间的债务关系；第二种是减税，休养生息，去理顺国家和居民中间的债务关系。这两个举措把社会的杠杆率降到历史低位，相当于民间的“双降”。整个社会的杠杆率下降以后，社会会渐渐恢复到原有的稳定结构，经过几十年，发展无自稳息就会逐渐出现，一直到下一个冲击的出现。\n\
    \n### 今日摘要：\n\n- **划重点**\n  - 1. 债务关系、国家、企业和个人中间的债务网络，在农业经济的古代中国，债务网络可以简化为国家和个人中间的债务关系，即税收；还有个人和中间的关系，即民间借贷。\n\
    \  - 2. 国家和民间债务关系互相影响、不断恶化的“债务螺旋”，是中国王朝更替的金融根源。\n  - 3. 中国古代的盛世前夜，税负和民间借贷普遍偏低，民间可以休养生息，社会稳定，但一旦出现天灾人祸，杠杆率升高，“债务螺旋”很容易出现。\n"
