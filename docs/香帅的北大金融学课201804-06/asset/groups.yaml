  mdcn: "\n## 107 | 投资第一步：了解你的风险偏好\n\n你好，欢迎来到老师的北大金融课。\n\n你知道，在金融投资的世界里，最常听说的一句话就是“高风险，高收益”。但是，你发现没有，为什么会有高门槛，高收益呢？在我们今天来解释这个问题之前，我们先来做一个实验。\n\
    \n### 一、一个实验看懂“风险和回报”\n\n现在我给你两个选项：\n\n第一个选项是让你去听一个游戏。你赢了这个游戏就能给你100块钱，输了就什么都没有，那赢球的概率都是50%。\n\
    \n第二个选项就是你不去参加游戏，直接给你50块钱。\n\n这两个选择，你会选哪个？\n\n现在，你可以在心里给出你自己的答案。\n\n这是一个特别有名的心理实验，实验的结果发现，绝大多数人都会选第二种，就是不参加这个游戏，直接拿50块钱走人。\n\
    \n为什么会这样呢？要从理性的角度，我们算一下就知道。这两个选择的期望回报是一样的。你看第一种选择中，你有50%的概率拿100块钱，还有50%的概率拿0元，所以期望回报还是50元，和第二种选择可以拿到的回报50块钱是一样的。\n\
    \n两种选择的区别在哪里呢？一个是确定的50块钱，一个是不确定的50块钱。知道这意味着什么么？意味着将来不确定的回报是不一样的时候，作理性的人类的你不愿意接受不确定性，这就是刚刚我说过的一个词，叫“风险厌恶”（risk\
    \ aversion）。\n\n那么，在什么情况下，我们会愿意去承担风险，面对不确定性呢？简单回答，给我一定的补偿，那要多少呢？就是要够多到让我们愿意放弃那个50块钱的确定收入为止。\n\
    \n比如刚才的选择题，我们换个数字：\n\n第一种选择中，赢了这个游戏有200块钱，输了没钱拿。\n\n第二种选择，还是给你50块钱。\n\n这个时候，很多人就直接转变态度了，会要第一种选择，因为，这个的期望回报是100块钱，换句话说，这个多出来的50块钱的期望回报是吸引我承担风险的补偿，也就是你听到的那个词，叫“风险溢价”（risk\
    \ premium）。\n\n我们现在还可以把这个测试接着做下去，在这个游戏的规则变了，你现在有25%的概率赢了，在这种情况下，你要我给你补偿，才愿意来听这个游戏吗？你的期望回报是200乘以25%等于50。\n\
    \n如果赔率是500比500，玩的人赢了概率低，就要我给补偿才愿意玩。然后你说，我不让你参加这个游戏，期望的回报一定比50多，你不会放弃去赢这50的机会。当概率更低，比如10%，要我给补偿才愿意玩，期望回报是5000乘10%等于500，玩的人赢了概率低，就要我给补偿才愿意玩。\n\
    \n### 二、“高风险、高回报”的金融逻辑\n\n刚刚看这个游戏设计下去，最后的结论就是，当赢球的概率越来越低，你赢球的金额一定要越来越高，这样才能吸引你参加游戏。为什么呢？因为风险越大，必需要有更高的回报来吸引你，否则就没有人参与到高风险的游戏里面去了。\n\
    \n其实你想过这个“高风险、高回报”的逻辑，放到现实市场是不是完全一样。现在有两种股票，一种股票的变化非常小，就是你面临的不确定性比较小，风险比较小。另一种股票比较大，波动就比较\
    \ 大，风险就不能性比较大。它们的回报也一样，你愿意持有哪一种股票呢？你一定不会对那一种波动性不大的股票，不对那一种波动性比较大的股票。你预期它未来的回报率就会高出那一种稳定的股票，你就能会意愿持有了。\n\
    \n这就是为什么风险越高的资产，回报率就必须高，因为如果你没有给它足够高的回报的话，市场上就会出现一些人去买这些稳定的股票，这也是“高风险、高回报”这句话不是空泛的，而是我们基于人类的基本特征——风险厌恶。\n\
    \n爱炒风险的人，可能一不小心就会赔到坑里面，搞得倾家荡产。而有些人呢确定支出很多的人，承担过多的风险，也可能把自己逼到山穷水尽的地步。\n\n前两天有个体同学跟我说感慨说，他一直以来没有想过，这种风险测评评有什么意义，平时就随便乱填填，结果就买了定期的理财产品和当时很炒热的股票。结果面临毕业，有钱钱如流水，理财的钱又取不出来，股票被套又舍不得割肉，这才恍然大悟，为啥填表的时候会问他，“你的钱准备好进多久的？”其实，这就是我一直以来强调的，对的投资决策只能建立在非常匹配的风险承受能力和风险态度之上。\n\
    \n## 今日概要\n\n- 风险越高的资产回报系数必须越高，否则就没有人愿意参加这种高风险的游戏。会导致资产价格下跌，回报率上涨；\n- 大部分人是风险厌恶的，但是也有个人是风险偏好和风险中性的，而不同的人的风险厌恶程度也是不同的。这就导致大家要求的风险溢价也是不一样的。\n\
    - 风险态度会影响投资决策，对的投资决策需要风险能力和风险态度相匹配。\n\n### 春雨\n\n我给你了一张图，里面画了4根线，其中有1根代表极度风险厌恶的人，还有1根代表比较轻微风险厌恶的人，还有1根线代表风险中性的人，最后1根线是代表风险爱好的人。你告诉我，这幅上这4根线，到底哪根对应的是哪一类的人？\n\
    \n同学们不要忘记了，今天还有一套你的风险态度的测试题，希望你能够平心静气，好好地把它完成。你也可以叫上你的朋友和家人，你们一块儿来完成这套试题，看看在你们家庭内部，你们的风险偏好到底会是什么样的。还是说，你们在一个家庭内部，你们的风险偏好会非常地不趋同。\n\
    \n希望把你们的思考和观察放在留言区跟我们一块儿分享。\n\n《春雨的北大金融学课》送出iphone X 大奖！第一部手机已经送出！\n\n我为了感谢大家支持，自费购买了3部iphone\
    \ X 手机，送给支持自己的同学们。\n\n送奖方式：从5月17日（周四）开始30天，每周分享出去的「知识红包」，领取人数最多的那个人，可以拿到我送出的iphone\
    \ X 手机，三周分别给三个人。第一周已经结束，5月24日开始，第二周的分享启动，再次感谢同学们的热情参与。\n\n提示：分享的内容不限于本周课程；领取红包人数不重复计数，同一人领多个红包仅算一人。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_110_0.png)\n\n## 风险容忍度测试\n\n1. 我投资60天后，价格下跌20%，假设所有基本情况不变，你将怎么做？\n\
    \    - a. 为避免更大的担忧，把它卖掉再另选。\n    - b. 什么也不做，静等收回投资。\n    - c. 再买入，这正是投资的好机会，同时也是便宜的投资。\n\
    \n2. 现在换个角度看以上问题。你的投资下跌了20%，但它是资产组合的一部分，用来在三个不同的时间点上达到投资目标。\n    - 2-1. 如果投资目标是5年以后，你怎么做？\n\
    \        - a. 抛出\n        - b. 什么也不做\n        - c. 买入\n    - 2-2. 如果投资目标是15年以后，你怎么做？\n\
    \        - a. 抛出\n        - b. 什么也不做\n        - c. 买入\n    - 2-3. 如果投资目标是30年以后，你怎么做？\n\
    \        - a. 抛出\n        - b. 什么也不做\n        - c. 买入\n\n3. 在你买入退休基金一个月后，其价格上涨了25%，退，基本没有变化。沾沾自喜之后你怎么做？\n\
    \    - a. 抛出并锁定利润\n    - b. 保持卖期权并期待更多收益\n    - c. 更多的买入，因为可能还会上涨\n\n4. 你的投资期限长达15年以上，目的是养老保险，你更愿意怎么做？\n\
    \    - a. 投资于货币市场基金或保证投资合约，放弃主要得的可能性，重点保证本金安全\n    - b. 一半投入债券基金，一半投入股票基金，希望在有些增长的同时，还有固定收入保障\n\
    \    - c. 投资于不断增长的共同基金，其价值在该年度可能会有巨幅波动，但在5年或10年之后有巨额收益的潜力\n\n5. 你刚刚获得一个大奖，但具体哪一个由你来定。\n\
    \    - a. 2000美元现金\n    - b. 50%的机会获得5000美元\n    - c. 20%的机会获得15000美元\n\n6. 有一个很好的投资机会，但是你需要借钱，你会接受贷款吗？\n\
    \    - a. 绝对不会\n    - b. 也许\n    - c. 会的\n\n7. 你所在的公司要把股票卖给职工，公司管理层计划3年后上市，在上市之前，你不出售手投资，也没有任何分红。但上市时你的投资可能会翻10倍。你会投多少钱买股票？\n\
    \    - a. 一点也不买\n    - b. 两个月的工资\n    - c. 四个月的工资\n\n## 风险容忍度评分\n\n按照以下方法将你的答案乘以不同的系数相加，就会得出测试结果。\n\
    \na：1分 b：2分 c：3分\n\n## 评分标准\n\n- 9 - 14分 保守的投资者\n- 15 - 21分 温和的投资者\n- 22 - 27分\
    \ 激进的投资者\n\n## 110 | 本周问答：储蓄和投资的等价关系到底意味着什么？\n\n### 香帅\n\n你好，欢迎来到香帅的北大金融学堂，又到了我们周五的问答时间。\n\
    \n这周的问大家问得都特别精彩，像第二张风险投资的问题几乎没有留存的问号都答对了。第三天还有很多同学根据自己的生活、工作经历举出了各种各样的正态分布的例子，非常有趣。\n\
    \n我整理了一下留言，搜素了一些比较有代表性的难点，今天来一作答。这几个问题包括了：\n\n- 第一，储蓄和投资的等价关系到底意味着什么？\n- 第二，肥尾为什么会对应着大概率的大风险？\n\
    - 第三，为什么价格上涨的日子多也是风险。\n\n**问：** 储蓄和投资是一个概念，或者说储蓄和投资是等价的。老师，这句话中“等价”怎么理解？是同等价值还是数学上说的“关系”还是其他意思？\n\
    \n**香帅：** 说明Ryan同学的思考很深入。储蓄和投资的等价关系是宏观经济学上的一个重要对应关系。所谓等价就是说如果我们的统计计算正确，又没有遗漏或者误差的话，那么这个关系必然成立。\n\
    \n套用到数学上的名词就是，这是一个“恒等式”。为了理解这个恒等关系，大家不妨将一个国家想象成一个家庭，这个家庭一年的收入要么吃光花掉了，要么存起来以后消费。存起来的部分，就储蓄。\n\
    \n对这个问题，国家来看，储存起来一般有两种方式，第一种就是储蓄，修复、买机器，扩大再生产，这个叫固定资产投资，第二种就是买东西存货，买石油、买钢铁或者直接制成成品，这叫存货投资。\n\
    \n你看，不管是哪一种存起来的方法，实质都是投资。所以对于一个国家总体而言，生产出来的东西要么是消费，要么是储蓄。而储蓄必然要以一种投资的形式存在，所以在总量上必然等于投资。\n\
    \n所以前面我们才说，如果我们的计算正确，所有的储蓄最后都会表现为某种形式的投资。要么是固定资产投资，要么是存货投资。说的这里，我想你已经开始明白这个问题了，但是一些比较关键的地方还需要说明一下。比如，政府的消费和投资是不是等同于一个等价关系？\n\
    \n这些问题，宏观基础只要稍微不扎实就会搞混。这里提前给你澄清一下。\n\n第一，政府的消费和投资是不会影响这个恒等关系的。你看，一个经济体无非三个部门：家庭、企业和政府。每个部门都各自收入。政府的收入是税收、收费，等等。但是，是哪种收入，它还是收入。而政府既有消费和储蓄，而它的储蓄也会转化为投资。那储蓄若等于投资这个关系，是家家庭、企业、政府这三个部门加总起来之后，这个关系一定成立，并不是针对单个部门的。这是第一条。\n\
    \n第二，国家的进出口也不会影响这个恒等关系。因为你刚才的分析很简单。考虑进出口，那是为了这个分析显得很严谨，加上进出口以后，依然不会影响这个等价关系。比如我们的中国出口是出口进口了，就相当于我们在国外容易里赚进了钱，这个钱挣了以后是属于我们出口的企业，企业可以用来消费，也可以投资。这样在统计原理上是一样的。\n\
    \n指数的均值，很大程度上是极端值决定的。\n\n你看，这左右两边尽管只占全样本的1%，数量这么少，但是影响是巨大的。这个道理，其实爱看体育比赛的同学一定很明白。体育比赛中，尤其是那些跳水、体操，他们在计算得分的时候都要干什么？都要去掉一个最高分、去掉一个最低分，然后再去加权平均。目的就是要去除掉这种极端值给结果带来的巨大影响。\n\
    \n**问：** 国际实业这个企业赚钱的天数多了，为什么风险还增大了？\n\n**香帅：** 我觉得这个问题，很多同学其实是卡在对偏度的理解上。在课程里面，我说过这几个风险的侧度，都是相对正态分布而言的。而正态分布是一个对称的分布，如果左右不对\
    \ symmetry 了，那就是有偏。\n\n在周三课程的例子里，我们说国际实业的赚钱天数多了，所以很多人会自然地想到很多点就集中在右侧，那应该是右偏，为什么会左偏呢？\n\
    \n这里我要让你稍稍地用一下想象力。假设我们现在有两个队伍，以均值为中心去拔河。右边的这个队人数多一点，一般的情况下，假设这些拔河的人高矮胖瘦都接近的话。那么右边的队伍肯定会占优势，对不对？那就叫右偏了。\n\
    \n但是现在左边的队伍里虽然人数少，但是有好几个大胖子，属于那种力拔山兮气盖世的大胖子。这样他们唰地就把力量的对比改变了。然后绳子就往左移动了，这就是左偏。\n\
    \n再回到国际实业的例子。国际实业虽然赚钱的日子多，但赚的不是那么多。而有几个亏钱的日子亏得超狠，就把这个拔河的方向给改变了。所以尽管它赚钱的日子多，但是会左偏。\n\
    \n**香帅：** 最后想跟大家多啰嗦一句，我不知道是不是自己的偏见。我回顾下来，我觉得我们专栏的同学的留言信息量特别大，也特别地认真。我自己反正是经常会从中汲取营养。\n\
    \n所以有时间的同学，我建议你也可以经常刷刷留言，尤其是那些精选的留言。那里面很多内容都可以视作我们课程的补充。\n\n希望所有的同学都能不断地提出好问题，让我在我们的课程里一一地回答，一起进步。\n\
    \n《香帅的北大金融学课》送出iPhone X大奖！第二部手机找到主人啦！\n\n我为了感谢大家支持，自费购买了3部iPhone X 手机，送给支持自己的同学们。\n\
    \n送奖方式： 从5月17日（周四）开始的3周，每周分享出去的「知识红包」，领取人数最多的那个人，可以拿到我送出的iPhone X 手机，三周分别给三个人。现在已经送出两部手机了，再次感谢同学们的热情参与，31号开始是活动最后一周，大家加油哦～\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_112_0.png)\n\n### 笔记精选\n\n**戚志光**\n\
    听了香帅老师今天讲的两位投资大事的故事，非常认同老师分析的四个要点。另外，我还有一个看法，那就是永远不要仅仅听别人怎么说，而是看她怎么做，并且还要看最后他是什么结果，又为什么会这么做。\n\
    比如说巴菲特作为最成功的投资人，也是格雷厄姆的学生，在所有场合都强调价值投资，而且反复的说投资股指是正确的选择。但你看看他自己的公司，从来不是分散投资，而是集中持有少数公司的股票。\n\
    那巴菲特在骗人吗？我觉得不是。正相反，他给了大多数人中最中肯的建议。对于普通人，巴菲特建议风险低，收益稳定，是最适合的策略；而对于他个人，既有高超的投资技巧，又有强大的风险承受能力，所以他的选择是最适合他本人的投资需求的。\n\
    没有绝对正确的投资策略，只有最合当下的策略。就好像投资和投资，只不过事后看是事后事后的总结一样。\n\n**一小支铅笔**\n老师好！ 你提到的那几个原因其实基本都已经概括的很好了，但还是想感慨两句！\n\
    我觉得你对宏观大方向的判断以及顺应时代真的太关键了！说过祖父的经济时代，我家在新疆在民感受祖国春风吹遍各地城市稍微晚了些，90年代后期父辈在当地开小餐厅很赚钱由于品质很好我们家从中也学了一些小名声很后父亲干脆从宇宙第二大开行实际（当时很流行）全心全意做自己的生意，到2000年出的时候父亲决定把之前的小餐馆做成大酒店，其实在做之前非内心里就已经很厉害了，那时候我们国家正在大兴基础设设施投资，后面的结果\
    \ 因为管制制度跟不上加上非典型冲动在不靠海的大道是最终结果是转红了，还欠了很多钱很小的我感到受到了从上掉到泥坑里的感觉。其实我在做酒店之前有朋友建议过我我们上海买房套房子以后一定会升值\
    \ 父亲我们没点小儿去了也是由折算为母亲了。母亲虽是并不是什么有知识分子但是他们小时候就听 母亲 说：从古到今看他们怎么评说他是资产类或者是看他城市里有多少地主当然就是说他有不动产，那么怎么说\
    \ 地产生当然就是他有多少土地，很朴实的话让我记忆犹新。\n其实后期又改行做别的生意，但都是点个好的不好没赚到什么钱，所以顺逆时代看准大环境真的太重要了，当然人性也很难战胜性了不了一切属于你都很短暂\
    \ 的\n\n国的经济状况，在房地产上果断进行资产配置的 人，就是做对了。\n\n第二，是对投资标的把握非常精准，证券选择正确。这一点，我在直播里曾经给你举过一个例子，在过去十几年，中国表现最好的是医药行业，所以如果你在，中这个选择上选对了的话，收益一定会非常地丰厚。\n\
    \n第三，就是入场和退场的时间把握非常准确，能够比较精准地顺着市场牛熊的转换。\n\n第四，就是能够克服自己在人性上的弱点，在别人贪婪的时候你恐惧，在别人恐惧的时候你要贪婪。\n\
    \n而所有的这四点，都是现代投资学中最重 要的功课，也是投机和投资背后的精髓。\n\n最后，我想告诉你一句很有意思的话。被称为“投机大师”的巴鲁克在临终的时候留下了一句话，说：我在年轻的时候，人们称呼我为投机者，现在称呼我为银行家、慈善家。其实，从始至终，我做的都是相同的事情。\n\
    \n这就告诉我们，无论做什么，做好就好。\n\n## 今日概要\n\n- 1. 投机和投资只是一个语言学上的区别，并没有本质差异。不管是投机还是投资，出发点都是低买高卖，赚取利润，都会利用市场的错误定价赚钱。投资大师可能进行市场投机，而投机大师也不会放弃价值分析；\n\
    - 2. 不管是投资还是投机，成功之处都是一样的，都是因为正确地把握了宏观趋势、投资标的、投资时间，很好地克服了自己的人性弱点。\n\n### 香帅\n\n\
    我想请你观察一下你身边比较成功的人，这些人不一定是在金融决策上很成功，他们可能是投资做得很好，也可能是事业很成功，但是也有可能是家庭很幸福。然后你用我们今天作出正确决策的四条秘诀去分析一下，看他们是不是都是在这几个层面做得比较好。今天你可能总结出其它的成功经验，而关于这点我觉得其实就是你对财富认知的理解上升一层的一个阶梯。\n\
    \n欢迎你把你你的思考和观察放在留言区跟我们一块儿分享，你也可以跟你周围的朋友再探讨一下，成功到底需要什么样的要素。\n\n《香帅的北大金融课》送出iPhone\
