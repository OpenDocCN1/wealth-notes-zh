    ### 今日概要


    ### 划重点


    - 金融资产的核心就是对风险定价，我们可以将风险拆解成系统性风险和个体风险；

    - 个体性风险来源于局部个体，可以用组合的方式抵消掉，所以又被称为可分散风险；

    - 系统性风险又叫不可分散风险，属于整体市场的波动，几乎所有的金融资产都会受到其影响。因为这些风险没有办法依靠增加资产种类进行分散，所以对系统性风险的定价就成了资产定价的核心。


    香帅


    今天我们课程里讲了金融市场的系统性风险和个体风险，然后我其实也给你强调了，就是把一个问题拆解成系统性因素和个体性因素，对于我们对症下药解决问题有重要的作用。我想请你结合今天的课程，回顾一下你的生活经历、工作经历，找出一个事件来说明，这个事件里面，到底什么是系统性因素，什么是个体因素，然后你到底是怎么处理的。我觉得这其实就是一种把金融学框架性的思维很灵活地运用在你生活上的一个方法，这也是一种提高你认知的方法。即使是微观的决策，微观的知识，也可以帮你站在高处，重新理解这个世界，当然也重新理解财富。


