  - '[PAGE 93]


    # 划重点


    +   1. 股指期货一半是天使，可以用来套期保值，降低你的组合风险；

    2. 股指期货的另一半也可能是魔鬼，它可能成为加杠杆的工具，放大你的损失；

    3. 在股灾中，股指期货因为可以加杠杆和做空整个市场，所以可能导致量价齐跌的流动性螺旋。


    香帅


    在今天的课程里，我跟你提到了，从2015年股灾之后，基本上中国的股指期货市场就一直处于奄奄一息的状态，保证金率也提得极高，交易的下单量有很大的限制，另外就是交易的数量要受到非常严格的限制。换句话说，就是中国的股指期货市场现在处于一个被“阉割”的状态。为了防止市场进一步的崩溃和恐慌，暂时性地限制股指期货是有一定的道理。


    但是，在事情过去了这么久之后，还在限制股指期货，是不是有必要呢？现在市场上也出现了一些不同的讨论的声音。结合今天的课程和这两天你对衍生品（金融衍生品）的理解，我想请你站在监管层的立场上，替他们想一想，你认为股指期货市场应该放开，还是应该继续限制下去？


    欢迎你把你的思考放在留言区跟我们一块儿分享，你也可以把今天的内容分享给那些经历过2015年股灾的朋友，看他们对于这个问题到底是怎么想的。


