    在昨天和今天的课程里，我都给你讲了，中小股东的权利在现实生活中经常会被稀释，然后会“被代表”。我们大多数同学都有过炒股的经历。我想请你回忆一下，你参加过股东大会吗？如果你是一个老股民，但是从来没有参加过股东大会，那么我想请你分析一下，是什么原因让你主动地放弃了自己的权利？


