    # ■ 划重点


    +   1. 中国市场的A股和H股中间存在着实际的“同股不同权”，即长期来看A股的价格高于H股，导致A股和H股的投资者获得的收益权是不一样的；

    2. AH股价差长期存在的原因是“有限套利”：其中包括市场分割、交易者结构不同，以及外汇管制等等因素；

