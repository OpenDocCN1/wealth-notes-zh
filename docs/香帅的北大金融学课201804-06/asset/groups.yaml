    # 复盘 | 股与债到底有什么不同？


    你好，欢迎来到老师的大金融微课堂。

    昨天我们以基点为切口，把金融机构这个

    大板块给我们梳理了一次。今天我们要再

    稍微地理清楚和债这两个小模块。


    # 一、投资者视角：股与债


    首先我们来站在一个普通的投资者视角。

    你想投资一个公司的时候，你可以买

    公司股票，也可以买债券。那么在这种两

    种投资中间，你的权利会有什么不同呢？


    第一个不同：债券债权和风险是不一样的。

    不管是股票还是债券，它代表的都是金融

    索取权。也就是说你对这个公司盈利所取

    的权利。不同的是，股票你所拥有的是

    "剩余索取权"，就是公司要扣除所有的

    成本，包括利息，剩下的部分才会给你

    分红。而且这种分红是不具备强制力的。

    所以你为了补偿你，公司要给你股权，你

    可以参与它的经营管理决策，虽然你也

    知道在现实中这种投票权并没有实质性

    的意义。


    那么从另外一个维度看，与股票的"剩余

    索取权"是不一样的，债券具有的是"优先

    追索权"。不管企业经营的好坏，它必须按

    时间点给你带来利息，所以这种收益

    是固定的。而如果企业面临破产的话，

    你的债权比公司的债权的等级，首先要

    清偿。因为你可以确定的回报，所以债券

    的收益率会比较平缓。


    因为有这些特性，所以一般认为，和股

    票相比，债券是风险和收益的结构是比

    较低的。但这也反映了投资者和债权者

    的心态上。当你作为投资者投资的时候，

    就会关心公司经营的稳定性，而债券投

    者更关心公司经营的稳定性。这两种心态

    会反映在股票和债权的博弈上，形成了

    公司的股东、债权人的博弈。我们在后面

    的课程里还要再跟你们。


    但是你也要记住，这个风险和收益的对

    比是针对同一个公司而言的，比如说就

    用股票和债券去做比较，这就没有可

    比性。


    好，这是在投资者的视角来比较股和

    债对你而言有什么不同。


    # 二、融资者视角：股与债


    从融资者的角度看，股和债又会有什么

    不同呢？


    第二个不同：从融资者的角度来说，股

    和债权人的权利是完全不一样的。

    股东和自己是拴在一条船上的妈仔，分

    享的是上行利益，分担的是下行风险。

    而债权人不一样，他跟你不一定是同一条

    船的。他有时候可能像加重的下风。

    所以，融资者可以选择债权融资的资

    的时候，心态是截然不同的。


    一般来说，假设这个融资人，他的手里

    的项目业绩非常地稳定，盈利能力。那么

    他从融资的角度来说，自然不希望有人多

    分自己一瓢羹，所以进行债权融资的愿

    望会更高。反之，一个项目虽然前景很

    好，但是不赔，风险不确定且非常

    大。这个时候，融资者肯定尽量避免被

    追偿的利息压力，也会尽量避免选择权

    融资。


    所以你稍微地关注一下市场上的企业就

    会知道，像中创板企业会去选择债权融资。

    而像小贷行业、高科技这些现金流不

    那么稳定的行业，企业的负债率也是普遍

    比较高的。所以像公用事业这些现金流稳

    定，上分空间也不太大的行业，往往更

    多地使用债权融资。


    刚才我跟你讲的是一些一般性的原则。但

    是还是要你知道，现实世界里永远比那些

    简单的复杂的多。比如现实中希望公司

    和投资者中间也存在着博弈关系。比如

    一个表现公司风险了，要

    破不。现在我们换一个风险高的项目，赢

    了就能起死回生，输了大不了还是破

    产，反正是"有限资产"，股东的个人风险和

    公司资产之间有责任的关联的。在这种

    情况下，公司就会倾向于高风险的投资。

