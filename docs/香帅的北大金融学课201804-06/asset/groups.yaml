    又一次地用行政手段推迟和限制这种非流通股的真正上市流通。中国股民非常熟悉的“大小非”问题就是在这个阶段产生的，而且后来只要一提到大小非解禁，就会引起市场的震荡。引起了市场的震荡之后，监管层又被迫以限制新股发行这种行政手段，来缓解市场的躁动。


    所以正是因为这些行政干预，还有很多历史遗留下来的计划色彩，在经历了近30年的路程之后，我们中国的证券市场仍然没有办法摆脱这种在行政命令和市场力量中间挣扎的宿命。所以这也是为什么我说很难用主流经济学的“教科书模板”来理解我们中国市场，而且即使是这些扭曲，很多时候其实是一种多方利益下权衡博弈的产物，你没有办法用好或者坏来简单评判。只能说了解了这些逻辑，你才能够真正理解和看懂这个市场。


    # ## 今日概要：


    +   - 划重点


    +   1. 在中国从计划经济向市场经济转型的过程中，双轨制是一个常态，股权分置就是中国股票市场上的双轨制；

    2. 2005年以对价为原则的股权分置改革拉开了帷幕，大部分公司对流通股股东进行一定的补偿，从而换取上市流通的权利；

    3. 即使经历了股权分置改革，但是证券市场仍然没有办法逃离在行政命令和市场力量中间挣扎的宿命。


    # 香帅


    到这周为止，我已经给你把中国资本市场发展过程中五个重要的历史都讲清楚了，你需要记得的是：


    +   第一，中国的股份制改革是起步于农村改革；


    +   第二，城市里的股份制改革的起因是为了解决居高不下的失业率问题；


    +   第三，中国证券交易所和证券交易所的启动，是为了重塑国家改革开放形象的需要；


    +   第四，中国证券市场的大发展，是起因于为国有企业解困，替国有企业输血的目的；


    +   第五，股权分置是中国资本市场上的双轨制，股权分置改革是一场被市场倒逼的改革，而且其中也充满了“中国式”的扭曲和妥协。


    了解了这五个关于中国资本市场上的基本事实之后，我想你对于中国资本市场的来龙去脉已经有了非常清晰的认识，既不会再盲目地抱怨，也打消了很多“玫瑰色”的幻想。只有这样理性和客观地认识了中国资本市场之后，你才能够有一个良好的心态踏入这个市场。


    我想给你留一个比较烧脑的思考题。我们每个人都大都听说过很多关于中国市场的怪现状，关于中国市场的很多扭曲，我想请你找到我们中国市场上的一种扭曲，然后结合这三周延展话题的内容，仔细地分析一下这种扭曲背后的历史成因。


    你也可以把这三周的延展话题的内容，一起分享给你身边的股民朋友，帮助他们站在高处，重新理解中国股市。


