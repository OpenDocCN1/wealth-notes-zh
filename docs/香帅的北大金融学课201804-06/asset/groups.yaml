    \  - 如果你是投资新手，我建议分享给那些理财达人，和他们一起探讨金融问题；\n  - 如果你是银行经理，我建议分享给你的客户，维护你业务内外的联系；\n\
    \  - 如果你是投行精英，我建议分享给你的家人朋友，帮他们轻松理解复杂的金融世界。\n\n## —— 学习地图 ——\n\n请对照下面这张“全年限金融藏宝地图”，来看看我们学过了什么，以及接下来学什么。\n\
