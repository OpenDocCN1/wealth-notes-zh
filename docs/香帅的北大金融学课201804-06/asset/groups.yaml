    2. 理解人性\n\n# 加仓丨香帅直播文字版精彩回顾\n\n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_89_0.png)\n\
    \n香帅\n\n我5月16日进行了一场直播，时间持续了一个半小时。由于直播没有回放，所以我为错过直播的同学，准备了这份文字版的精彩回顾。\n\n## 一、站在高处，重新理解财富世界\n\
    \n因为我们今天讲的这个世界其实是整个世界，这颗蓝色的星球已经变成了一个黄金色的星球，金融无处不在。\n\n### 1. 我要给你360°的金融视角—以“得到”为例\n\
    \n如何重新理解财富世界？\n\n比如说“得到”这样一个平台，看上去它只是一个教育平台，知识服务的平台，但是，它的背后其实是无数次的金融集合造成的。这里面金融决策有对的对的，有可能有错的，我给大家分析一下：\n\
    \n比如说很多同学都不一定知道，在创业开始的时候，罗胖卖了自己的房子，投了500万来创业。你看这里就牵涉及到买房和创业的决策。如果那时候罗胖学习到了一些金融学的知识，就会知道卖房是一个错误的决策。\n\
    \n接着，罗胖找到了脱不花和快刀青衣这样的合伙人，组成一个合伙创业公司。为什么叫“得到”这个公司应该采用合伙制呢？因为这是一个以人力资本为主的企业，这也是我们在专栏里讲过的。\n\
    \n再接下来，在这个一个合伙创业公司底下，还要做金融金，所以像鲁信基金等金融”“得到“投了钱。这也是我们在课程里面说的风控、创投的内容。\n\n再接下来，从公司运营的角度，“得到”还要跟投资人保持关系，以及利益分配的处理。另外，还要考虑这样一个以人力资本为主的企业，在招人时要怎么样激励员工，怎么样用股权等方式去吸引和留住激励机制。这些金融决策的内容我也会在后面讲到。\n\
    \n这里金融知识如果学过了，就不会在使用“得到”时，还是单纯觉得罗胖好厉害，说不好听就是，而是会明白：原来他们的所有决策，前前后后的代表者复杂联系在一起的，每一个决策都牵动着背后深刻的逻辑。通过这个例子我想说的是，它带你学会用的就是360°的金融视角，会帮你拿金融思维的“刀子”把现象切开、解剖，然后再重新组合新的内容，内化到你的生活、决策当中去。\n\
    \n### 2. 考卷中隐藏的两个“底层金融逻辑”\n\n1) 在时间的维度上帮你将不确定性转化成确定性\n\n什么叫金融的底层逻辑呢？我们在复盘的时候，进行了一场中期测试，有七八千人参加了这个考试，一共15道题目，但是只有不到100人考了满分。其中错的最多的题是第15题。\n\
    \n如果聘请你做某新兴市场的金融市场建设的总顾问，你觉得需要考虑的是：\n\nA. 降低该金融市场的代理问题\nB. 确保该金融市场的公平公正\nC. 确保股市的投资收益率起码高于无风险利率\n\
    D. 确保金融市场能够支持该地经济发展需要\n\n我给你两分钟思考时间。\n\n（正确答案：ABD）\n\n很多同学都错在哪里呢？选了C：要确保该的投资收益率高于无风险利率。听上去一点毛病也没有，股权投资是股权投资，如果风险投资的收益率比无风险利率还低的话，那么你为什么要投资风险股呢？如果选了C为答案，其实表明他对风险本身的概念还没有搞清楚。风险是一个很抽象的词语，我们换一个很具象的东西来说。\n\
    \n可能会对自己的家庭生活上的债务作出更好的调整。比如说，个人消费到底是不是应该用“贷”？\n\n首先负债是一种罪过，上一代很多人，都觉得一旦有负债的话会很不安，最好买房的时候会把一钱放在柜台上，全部付清。\n\
    \n其次，债务也不能过重，而如果债务过重，主币可能更甚，或者可能会支离破碎。所以，这就是“杠”，杠杆要维持在什么程度上是最优的，你可以根据自己的家庭生活上的感受和你最亲人来适配。\n\
    \n但应厘清的是：整个人类社会是一个债务关系，我觉得懂得了这些，对我们整个的认如是一种颠覆，你会完全全部解构和重塑你的人生关系。\n\n### 3. 课程线索：\n\
    \n过去5个“我们”金融的金融的世界观”，也讲了“金融机构”；金融杠杆里都提到了我们熟知的“银行”，还有现在最流行的“投资银行”，以及在大家一直都在用的“基金”，然后就到了金融工具“债券”、“股票”；还有这两周在讲的衍生品。这一块的内容实际上是比较宏观很抽象的，但是我很高兴自己是观察和讲得好，而且很多同学都提出了特好的问题。\n\
    \n我认为现在的我们的宏观认如已经基本上完成了，在这个基础上，我们应该转入一个更加微观的决策的环节，所以下课就是我在下面的课程要来跟你们讨论的。\n\n在接下来的课程里面，我们进入了两个特别高级的模式：一个叫“投资决策”，这个板块就是我们从投资者的角度去看，在股市上你会碰到一些什么问题，你应该怎么处置，股票的性价比到底是怎么决定的？股份的背景下整条逻辑线是什么样态的？这些基金经理，他们到底是怎么做去长的？哪个基金经理是好的，哪个基金经理是坏的，他们到有没有什么能力？还有就是投资过程中，我们自己会有什么样的错误，这都是我们要在投资决策中来讲述的。\n\
    \n## 二、从宏观认如到微观决策：择时和投股\n\n### 1. 择时有多重要？\n\n刚才在第一部分里面的时候，我跟你讲了咱们中国的股市的事，你可能觉得很难受对吧？如果是2008年1月，如果你进去，现在都会“爆亏”了。但是，如果换一个时间段，不要换得太早，换成2009年，你知道这个数会变化多吗？一样的这个数会从爆亏一半变成了盈利一倍，如果你买进指数，你赚了20倍或30%。不算很大，但如果你在买阶段，买了70%，不算300，ETF的话，大概赚了125%，也就是赚了一倍多。\n\
    \n其实这不就是我们平时说的“来得早不如来得巧吗？2008年进去就爆亏，2009年进去就翻倍。其它这种事在金融学上是有一个非常严格的定义的，它叫做“择时”。择时是金融市场上非常非常重要的一种能力。\n\
    \n另一个择时的例子：很多同学都买过比特币。如果你是去去年底的时候进了比特币的话，现值就多赚了，多了40多。但如果是2017年的1月份，现在已经赚了130%，就是13倍。如果是今年3月份的话，大概是赚了200多。\n\
    \n### 2. 到底怎么择时呢？\n\n研究表明，如果我们在月度上来看的话，11%的基金经理有这种预测能力；但如果我们放在日度上来看的话，就会发现30%的基金经理都有择时能力。\n\
    \n有炒股经验的同学，我觉得你想一下就很有意义了。因为人类确实有短视的，为什么？因为在短期内去投资变得容易，为什么交易变得更加频繁了？因为它们金融学界里非常重大的一个策略，叫做“动量效应”，也叫“聪明的钱”（smart\
    \ money effect）。\n\n这是什么意思呢？大家可以想象一下，美国1999年的时候有一个高科技泡沫，从1996年开始市场就往上冲了，到1997年、1998年的时候，很多人意识到可能这个泡沫。但那个时候聪明的人不应该是撤出了。不应该去做什么，应该是？你还是应该与泡沫俱的。\n\
    \n为什么？这就是市场，市场并不是以你想象的那个形式来运行的，不是要看着看别人怎么反应。市场的规律并不是以你方式运行，而是要看其他人怎么想的，而当时在这个一个市场里，很多人都不撤出来，所以，市场就会朝着更高的方向去走。这就是所谓的与泡沫俱的。实际上也有人利用这种的有策略挣钱了。\n\
    \n我举一个反例，我有一个朋友是一个宏观研究做得非常好的，个人对基本面有把握非常准确的，所以他是做投资前，股市和债券的时候总会提醒的。在零七年年底的时候，他就很准确是预言了今年会进入一个寒冬，这几个月的数据当然表明了今年的经济下滑很厉害，继续在下滑过程中。\n\
    \n但是，他在期货上亏了很多很多钱，为什么呢？就是因为他认为自己是基于判断而完全完全正确的，那么他就开始做空市场，但是那个时候，市场还没有意识道“心”的回事。当大多数人沉没在过多经济的“心”回事里，所以市场还上不去之前还没有意识到寒冬已至的时候，还认为市场会向上的方向去，那么在我期货里面就会死得更快了。\n\
    \n基金企业也是一样的，如果在大家还没有识到寒冬的时候，你率先意识力了，你就会划亏得跑路，这时你的基金一定会失跌，导致投资你会后悔。这是告诉你，基本面的分析和人性的分析，你还要把它们结合起来。\n\
    \n具体怎么来考虑？你要考虑很多方面的因素，一是基本面的因素首先要考虑进去，另外事面上其它人到底是怎么想的，最简单的策略就是根据大盘己的涨跌。\n\n我在第一次直播里面跟大家讲过的动量交易，也就是基本可以知道该买地和，是这里面有一些入门，你到什么地方去和到什么地方是对的，是正确的。我们在课程里面还再细细地和你再讲解。\n\
    \n所以，这就是在我们的微观决策里我再跟你讲的第一点：什么是择时。\n\n### 3. 如何投股？\n\n很多人都在抱怨，说咱们A股市场是一个很烂的市场。大概有一半一下数据，过去十年中差不多有一半的股是亏损的，其中有两百多支股票是赚了的。如果你买了，真的是赚到坑里去了。\n\
    \n那A股市场怎么没有好的公司？不是的，也有上市涨到很好的股票。最好的一支涨上去200倍左右，如果你能够选到这些股票的话，就意味着你有第二个非常重要的能力：选股能力。\n\
    \n怎么通过投资组合，判断你的收益？\n\n我给你介绍一个：收益归因法（performance attribution），这个我在后面的课程里面会详细讲到，这里是提前预订一下，你可以按照这五个步骤来自测：\n\
    \n1. 把你要买的基金、股票的历史收益率全部聚集起来，自己做分析。\n2. 我们采取两个，先进行两步选择；第一步：大资产配置选择——你是买股票还是买债券；第二步：行业选择，你是买房地产行业，还是买医药行业，还是买白酒行业。\n\
    3. 在进行选择后，就该具体地进行证券选择。\n4. 然后在大类资产做一个基准组合，在行业上做一个基准组合，在证券上做一个基准组合。\n5. 最后评价，把你的收益组合减去基准组合，如果是负数，就证明你在决策做不好；如果是正数，就证明在这个决策你有能力。拆解以后，不管是你是赢，你都会对自己或者对你买的基金有一个彻底的了解。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_90_0.png)\n\n经过分析，你就会知道自己的收益，是因为这支基金或者股票选得好，还是因为运气好，买对行业。所以，有的人其实选股能力强，但是输了，就是因为在行业上做了错误选择。\n\
    \n还有人赚了钱，但实际选股能力很差，不过是买对了行业。这个分析方法，最大的帮助就是都帮你根据自己的长板做判断。\n\n比如说你选股选得好，你就可以发挥这个长板，就选那些大的基金公司，去看他们在选择什么行业，然后在这个行业里去选价值股。\n\
    \n或者你对行业看得很准，而且自己本身对这个行业很有研究，但是选股选得一般跟潮，你可以买中盘的行业指数就可以了。\n\n其中，股票要怎么定价，有哪些方法，怎么判断出哪些是被市场低估的，哪些是被市场高估的股票。这些都是做投资决策的课程，我都会在后面给你讲到。\n\
    \n## 三、从宏观认知到微观决策：为什么要理解人性？\n\n前面我们讲了很多金融之术，择时也好、选股也好，好像都停留在技术层面。但是，你要记住，金融是停留在人的市场的，人的贪婪、恐惧永远是这个市场上驱动的力量。\n\
    \n所以我们在课程的“投资者决策”里专门安排了三周时间来讲，在投资过程中会发生哪些错误，到你实际的在投资中会发生。\n\n你可以对你身边的人做个小调查，看看是不是有90%的女生都觉得自己比一般的女生长得漂亮？90%的男生觉得自己的驾驶技术比他人好？\n\
    \n这在金融学上叫“过度自信”。过度自信会容易使我们产生投资的冲动。现在，假设你已将人分成四组：已婚的女性、未婚的女性、已婚的男性、未婚的男性。我们猜测哪一组人是最过度自信的？正确的答案是未婚的男性是最过度自信的，是赔得最多的。作为散戶，已婚的女性赔得是少最多的。所以我一直对我的学生有个告诫，家里的投资大权一定要交给太太。\n\
    \n什么叫过度自信？我母亲在2008年的时候，就是高点了买入了中石油，一年多以后就狂掉20多块钱，我问她为什么不割肉呢？她说都跌了一半了，还能怎么样？这就是过度自信。\n\
    \n她当时说以后给我留着做嫁妆，现在我她都生出来了，这支股票跌了7块钱了……她还在手里还亏着10万。作为一个金融学的学生，我觉得这真是很残酷的一件事儿。这里面又犯了一个“处置效应”的错误。怎么来应对这种处置效应？其实最就是要在投资股票市场前，一定要有止损的概念，投资要有纪律，所谓纪律就是你要懂得止损。\n\
    \n为什么要学习这些错误呢？因为这些错误都是我们人性的一部分，当你了解了以后，你不一定能够完全避免，但是你可以少走一点弯弯道。\n\n这不单是对我们散户，其实对基金经理也是一样单一的，我记得我在基金的那块里面跟大家分享过一篇文章，叫《为什么在投资的世界里，活得久才是王道呢？》，怎么才能在市场上活下来呢？就是理解自己的偏误，少犯错误。\n\
    \n在基金市场上，最好的基金经理往往不是那些一下子冒出来的明星基金经理，而是在市场上活得平、活得很久的个人一“寿者王”，怎么才能在市场上活下来呢？就是理解自己的偏误，少犯错误。\n\
    \n这也是课程设置的层次顺序：从宏观认知，然后到中观判断，最后落到微观决策上。\n\n在做微观决策时，其实也会会不自觉地用到背后的宏观认知体系。\n\n比如判断要不要买房，背后的逻辑就是：买房就是买城市发展的股票。如果我们的城市左右在打70，可能这个城市家还在以7%左右的经济增速在往前发展，那么该不该买，你自己就会想明白。\n\
    \n什么城市是值得买的？背后的逻辑是：大中城市，比如说像北京、上海，人口都在往这些集聚，财政收入各方面的能力也都在往发展，它就像我市场上说的大蓝筹，绩优股一样，而且我在课程里给你挑选城市的八大要素。其实，你自己就会去判断了。\n\
    \n再比如，2017年12月，我就在课程里提醒大家，赶紧退出P2P这样高风险的投资，为什么？一是你知道中国金融变化的路径，它是遵循着一个自上而下的驱动，这是国家战略发展和资金监管层面看来的逻辑，其次是在“数字金融”的课程里，告诉你这些通道业务在互联网技术的嵌合下，会产生巨大的风险。\n\
    \n## 四、关于专科学习和题库计划\n\n当前的金融衍生品是最抽象、最难理解的部分，因此，通过这两周的课程，接下来的学习你就会马上适应了。因为生宝宝的缘故，中间三周的的内容是由北大金融教授讲授的。当然，我来亲自讲授的内容也当然顺顺三周，也就是说，接下来至少还有七个月的课程，我们一起加油。\n\
    \n宣布一个事儿：我要建立一个香帅的金融题库。我会不断邀请金融名人以及金融伙伴一起出题，如果你跟着我学习，就能轻松通过测试。\n\n当然，这套题库不仅是为了测试大家对专科内容的掌握程度，随着题库的完善，它还会成为以后你的金融专业和学业水平背书的有力证明。\n\
    \n当然，在题库建立之后，我也会诚挚地邀请你和金融大牛一起，为我的题库贡献题目。敬请期待。\n\n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_91_0.png)\n\
    \n> 香帅的北大金融学课\n\n《香帅的北大金融学课》送出3部iPhone X 大奖！\n\n我为了感谢大家支持，自费购买了3部 iPhone X 手机，送给支持自己的同学们。\n\
    \n送奖方式：从5月17日开始的3周，每周分享出来的《知识星球》，领取人数最多的那个人，可以拿到我送出的iPhone X 手机，三周分别给三个人。\n\n\
    备注：分享的内容不高于本周课程；领取红包人数不重复计数，同一人领取多个红包仅算一人。\n\n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_91_1.png)\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_91_2.png)\n\n# 笔记精选\n\n## 101 | 股指期货是A股的“妖精”吗?\n\
    \n你好，欢迎来到青衫的北大金融学课。\n\n在上周的课程里，你听到的衍生品是不是像一个个有头有尾的“人物”，充满了创造力和想象力？就像很多人物，比如美联储主席伯南克，诺奖得主保罗·克鲁曼，都说在发现风险管理的工具后，为金融业提供保险和管理的工具，促进了市场的价格发现，而提高了整个市场的效率。\n\
    \n但是，我们平时在新闻媒体里听到的衍生品却像个“坏孩子”。咱们中国常见的衍生品就是期货，你在网上、报纸上，那种关于“期贪大饱吞”、“赌徒自杀”的新闻比比皆是。而且每次在大跌的大跌中，你也会听到那些人说：“股指期货是股市下跌的元凶。”\n\
    \n为什么一个金融工具会有这样迥异的评价呢？我们现在不忙着下结论。这一周，我带你看看衍生品中的“行业巨无霸”之后，它会像什么样子？为什么它会显得出一半是天使，一半是魔鬼的面孔。\n\
    \n## 一、套期保值和杠杆投机\n\n今天我们就从2015年股市中饱受诟病的股指期货开始。\n\n我先给你一个2015年股市中的真实案例，这你可能会对股指期货的优缺点有更深刻的认识。很多人都在说股指期货是，甚至指责它是罪魁祸首。其实大家都不清楚股指期货到底是什么。\n\
    \n以沪深300的股指期货为例，这就是一个金融合约，它以沪深300指数为交易对象，交易对象是指数，它并不是某支股票，按照一个约定的地点来交易，有一个点位，这个点位就是它要进行定标的。现在，我们的股指期货的每一个点位为300元，假设你买一张交易3000点的合约，这个合约的价值就是90万元。\n\
    \n股指期货的交易和现货交易，有两个不同：\n\n第一点，股指期货是可以空仓的，也就是说，如果你做空大盘，但手里又没有股票，你也可以卖空，如果大盘一下跌的话，你就会盈利。\n\
    \n第二点，期货交易的保证金制度，12%的保证金。也就是说你买90万的合约，只要付10.8万元就可以了。这就是为什么杠杆倍数是8.33倍，你可以看到最大杠杆度是8的这个方向，你的收益就会放大到8倍以上了。当然了，要是看错了，你的损失也会放到8倍以上。它是个合约，采取的是我们上周讲过的现金结算制度。如果你第一天它的保证金低于了12%，交易所就会通知你补充保证金，如果你不补，就强行平仓，就是说看着你的钱飞了消失了。\n"
