    ## 第一天：银行→投行→基金：变形的驱动力是什么？


    第一天，我从基金这个模块入手，然后帮你把整个金融机构的这个板块讲了一个。随着全球金融视野的累积，我们已经进入了一个资本的大时代，而基金管理为这个时代最大的，逐渐从投行政务的内部分化出来。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_1.png)


    目前，基金的投资者呈现出一个多元化的趋势。按照投资标的来分，基金可以分为证券投资基金、股权投资基金、证券投资基金又包括公募基金和私募基金。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_2.png)


