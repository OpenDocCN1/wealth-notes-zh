    \ X 手机，三周分别给三个人。今天我要公布第二周的幸运儿：「案猴」同学，你的第二周分享谈论人数是最多的。请你在留言区留下你的联系方式和地址，得到奖品工作人员会尽快联系你，为你寄出这份奖励。\n\
    \n再次感谢同学们的 热情参与，31号开始是活动最后一周，大家加油哦～\n\n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_108_0.png)\n"
