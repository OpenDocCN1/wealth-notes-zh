    # 复盘周｜拿出金融地图，看看接下来学什么


    **香帅**


    直接预告：


    你好，欢迎来到香帅的大金融课程。


    在今天的PPT开讲之前，我想跟大家先问个号，从2017年12月12日上线直播以来，我们的课程已经进行5个月了。很多学员知道，这个过程中，因为我要再次开启下一系列的风波，所以一直没有能够更多地直播间里和你们相见。特别感谢你们一路的扶持和陪伴。


    所以在下周三，也就是5月16号，我们会在“得到”的直播间再一次见面和你们相见，给你们梳理和讲述一个全新的金融逻辑框架。当然，在直播当中，还会给你们准备一些小惊喜，也告诉你们，在接下来的课程里，除了课表上的这些内容，我还准备了哪些新惊喜。


    好了，记得在网上预约，下周三晚上8点，我们不见不散。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_0.png)


    ## 第一天：银行→投行→基金：变形的驱动力是什么？


    第一天，我从基金这个模块入手，然后帮你把整个金融机构的这个板块讲了一个。随着全球金融视野的累积，我们已经进入了一个资本的大时代，而基金管理为这个时代最大的，逐渐从投行政务的内部分化出来。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_1.png)


    目前，基金的投资者呈现出一个多元化的趋势。按照投资标的来分，基金可以分为证券投资基金、股权投资基金、证券投资基金又包括公募基金和私募基金。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_2.png)


    相关复盘：复盘 | 银行→投行→基金：变形的驱动力是什么？


    ## 第二天：股与债到底有什么不同？


    第二天，我又给你讲了股票和债券的区别和联系。股票和债券讲透，本质上就是信贷，代表的是金融的道德本位，也是它的道德权和风险是不一样的，股票代表的是剩余索取权，它一个风险比较大。所以股东更希望公司取得长足的发展。而债权代表的债权风险相对较小的，所以债权人会希望公司稳健地经营。正因为债权和债权有这样大的区别，所以在融资的时候要具体考虑自己项目的现金流和未来的风险，然后选择不同的融资模式。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_3.png)


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_4.png)


    相关复盘：复盘 | 股与债到底有什么不同？


    ## 第三天：关于资管新规的解读，其实你早就学过了


    第三天，我利用前面的知识点帮助你解读了当前大热资管新义的话题，资管新规。首先，我带你回顾了几百我国的资管行业的现状，这个现状可以用我们前面讲到的，投化化的思维结构来解释。在资全面，我们的层现两家机构，然后在资管面，不断加层次，这两者加层次，就是我们国家的资管市场，在短短的几年内快速发展。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_5.png)


    另外，我们国家又有一个分业监管和分业监管的结构，在这个个结构体系中，以监管收益为目标的高杠杆的通道业务又迅速发展。所以造成了近年来，金融市场高风险事件频发局面。监管推出新的资管规的主要，就是针对这种局面，它就是要去通道业务，降低杠杆。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_6.png)


    所以在这个一个大新规下，我要告诉你的就是，任何回报率超高的金融产品，基本上是陷阱。也就是说未来的几年中，金融业也会经历一次大失落的寒冬，我们的居民在进行财富管理的时候要记得捂好自己的钱袋子。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_72_7.png)


    相关复盘：复盘 | 关于资管新规的解读，其实你早就学过了


