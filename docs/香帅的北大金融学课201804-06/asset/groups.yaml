    为了清楚回答这些新问题，我特意邀请了一位嘉宾来讲课。大家可以在4月6日（星期五）看到他的文章《房产税：到底会收多少？》，大家可以在4月16日（星期二）看到他的文章《共有产权房：会改变买房游戏规则吗？》。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_1_0.png)


    上周的时候，我们重点讲了债和债权的关系。今天这篇文章，我们来看看，人和企业之间的关系。为什么个人信用的建立这么难？因为它是一个“信用”，而不是“抵押”。


    这一周，我们要从个人、企业和国家这三个层面来重新认识信用的本质。今天先来第一步，个人的信用是怎么一步步积累起来的。


    “信用就是钱”这个概念在中国，其实还不是特别普遍。很多人会想到“抵押”，比如“房产证”、“汽车”。在西方发达国家，信用体系是建立在“数据”基础上的。


    比如美国，他们有自己的FICO评分体系，从300分到850分，分数越高，信用越好。这个体系就是建立在美国人几十年来的“还款记录”、“负债情况”、“信用历史”等数据基础上的。


    ## 一、为什么说信用就是资产？


    “信用”这个词，英文是credit，来自拉丁语，原意是“信任”（trust）。它包含了三层意思：


    - 1. 信任：相信对方会履行承诺。

    - 2. 时间：这种信任是基于过去的行为，指向未来。

    - 3. 风险：因为有不确定性，所以有风险。


    比如说你借钱给朋友，你信任他会还钱，这是一个基于过去信任的“信用”。如果他不还，你就有损失，这就是“风险”。所以信用是一种“资产”，因为它可以“定价”。


    所以老赖们的网上活动空间被大为地限制。在合作了5个多月之后，就有5300多名老赖还清了债务。这种合作在阿里、腾讯，以及其它的互联网巨头中展开以后，法院的执法成本可以急速下降，使得整个信用体系的执法效率提高。


    这两个趋势意味着年轻人的资产会越来越多地和“信用”相连，因为大多数年轻人需要的是将未来时间的价值转换成今天的消费，转换是不是成功，转换的价格是不是合理，就会取决于社会或者金融机构对于你的承诺的信任程度，也就是你的信用。


    最后要提醒一句，实际上现在在中国的官方也已经拥有了自己的个人信用报告，在“中国人民银行征信中心”的网站进行注册和登录以后，你就可以查到自己的信用报告（http://www.pbccrc.org.cn/
    ）。这个报告的数据主要来自银行体系，在你申请房贷或者其它银行贷款的时候，这个报告的分值是被参考的。


    ### 划重点


    1. 信用就是资产。一个人的信用就是你所说的承诺的估值，信用越高，这个承诺的价值越高；

    2. 个人信用资本化的三大基础是完善的社会法律制度、完整及时的个人信用披露，以及一套科学的信用评价体系；

    3. 传统的中国社会是只有“王的信用”的人治社会，个人征信的信息也一直是分散隔离的，缺乏信用社会的基础设施。我们国家个人信用资本化的两个明显趋势：生活场景不断转换成信用分，违约的惩罚机制成本降低。


