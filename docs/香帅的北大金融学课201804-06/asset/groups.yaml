    # **076 | 货币真的起源于物物交换？**




    “你好，欢迎来到香帅的北大金融学课。”


    在上一个课模组里，我跟你讲债务关系是人类社会最根本的社会关系，这一期我会和你一起从债务的角度重新认识世界。你会发现使债务关系的演化中产生了货币，甚至奠定了文明的体系，种种我们所臆见的历史变迁，其实背后都是债务关系在起作用。


    今天先要给你讲一个非常有哲学高度的金言理论：国家货币信用理论，它的核心论点就是货币起源于债务，作为债务关系的度量单位。货币和信用之间的关系不可分，非常有趣的一点在于什么呢？这个理论其实一直被主流的经济学家教科书所排斥，但是在国家中央银行的实践上不断地被应用。


    # 一、货币源于债务


    首先我们来看一下，为什么说货币源于债务？在经济学的经济学教科书中，都会给经济学编历史 当斯密为货币起源的论述。在一个村庄里人与人之间进行物物交换，然后货币产生——交易物—货币，所以货币是一种商品，是“市场”的产物，这个故事是如此深入人心，我们很少有人怀疑它真实性，然而越接近去趟多的人类学的证据告诉我们，在人类社会发展过程中，纯粹的物物交换的世界其实从未存在过。其实在很久以前，亚当·斯密自己也承认，
    他所谓的村庄是他虚构出来的。


    信用货币理论认为，所谓经济系统是庞大的物物交换系统，这么一个系统会因货币的本来没办法运行的。不管这个货币是以牛、贝壳存在，在古代的时候是牛、盐、贝壳，后来是黄金、换一个说法，我们认为货币是市场的必要条件，起源于人们在交换中产生的债务关系，而且又成为债务关系后量度的“信用”，而且我们的经常见到的货币单位：元、镑、马克都是种中的度量衡量单位，它本质上是对“信用”的度量。


    到这里你可能已经明白了，和传统的经济学说为货币源于物物交换，是“先当似等价物的商品”不同，信用货币理论认为货币源于债务，它是一个债务的度量单位，衡量的是人们的债务关系。现在很多人类学的考古研究都表明，历史上的人们没有过纯真的物物交换，也就是说，即使在最原始的时代存在着某种货币，可能就是刀币，它可能存在，它可能是盐，也可能是金属货币的形式存在。它的作用就是帮助来们度量和衡量在物物交换中形成的债务关系，其实实在在的科学例子中，你可能会对物物交换有个错觉，认为物物交换是一个人拿着一只鸡去换五只鸡，但是现在世界就是这样去交换是不存在的，真实的交换场景是什么样子的呢？


    张三从李四那里买了一只鸡，然后他会写一张欠条， 然后张给张种凭证给李四，承诺未来会给李四和五和鸡同等价值的一种东西，接下来李四拿到张王四买一双鞋，就把这个欠条拿给王四了。如此类推下去，在一个村里里面向彼此交换的过程，其实就是个欠条或者凭证流通的过程，那么这个凭证流通的时远是漫长的。
    渐渐地当人们忘了最开始的主人人是谁，这个时候欠条就演变成了个了流通的功能。换一句话说，在这种物物交换的过程中，债务关系是货币的形式被强化，单位货币的价值也就是代表着人们对欠条发行人的信任程度。


    这个过程可以发生在一个小村庄，在物物交换体系非常简单的时侯是没有问题的，但是如果在同一个大城市里，当这个交换体系变得非常复杂的时候，这就有问题了。 最大的问题就是，一张、两张、三张欠条满足不了我们的要求，这个时候我们必须提供更多的欠条，保证所有人的都能使用这样的货币来进行日常交易，否则的这样欠条的数量来进行，那就是“通货膨胀”。
    所以欠条的数量在大城市里不是一张两张， 而是几万甚至几十万个。


    # 二、国家信用，货币，与债务


    这个时候其实又产生另外一个人问题，这么多欠条到底 能够保证哪些人，尤其是那些我们不认识的人会对这个欠条进行履约呢？这个问题我们从以人类历史上第一个央行英格兰银行的成立中找到答案。


    在17世纪的时候，英格兰有一个银行团借给了国王120万英镑，就给了这个银行团以兑换英镑的欠条。这些欠条在发行的时候就获得了资本批准的特权，上面盖着女王盖的印章，任何携带到财政部兑换的居民都有权利可以使用国王的欠条来进行交易，那这个步骤意味着什么？意味着用一纸张的欠条去兑换英镑的国债，国债开始流通起来，或者王室的债务被货币化了，这些国王的欠条就是英国的法定货币英镑，这个例子其实告诉我们，人类历史上的第一家央行是建立在债务基础上的，法定货币的发行也是以债务为基础的。


    其实直到今天，英国女王的这个120万英镑的欠条也没有清楚，因为如果这笔英镑清欠了，英国的整个货币系统会不复存在了。其实现在从全球范围来看，这种建立在债券基础上的发行和法定货币体制，已经是美元，欧元，人民币，我们它们都是用国家的信用做抵押，再发行到市面上，所以在发行的货币都是负债，
    发行债也意味着是央行的“负债”。


    但是这里还有问题，为什么我们会信任一张代表债务的纸呢？其实第三章的一课程 我告诉过你，纸就是 法定货币它了国家信用， 今天你可以将这个问题进一步地理解，国家信用背后支撑的共同的是社会成员关系的信任，然后法定货币就充当了全国债务关系和债务认定工具，
    而国家就充当了我们公民彼此之间债务的信任担保人。


    所以从这个意义上讲，不管是一张纸还是其他的东面， 黄金、黄金甚至是纸代币，国家同意接受的任何东西都可以成为货币， 只要它们能够在国家和国民之间形成关系，可以在意愿交易的人的手里去流通，
    这是伟大的经济学家马克思在研究货币的过程中得出的结论， 他说不管是否用于交换，12万40年里，货币一直是“政府”创造的产物。这里的政府可以打个引号， 不一定是我们现在的国家，它可能是一个镇长，一个村庄的代表，一个权威值，
    在这个契约时代，借据承偿的时候，文本之间载体来担保物品偿还，能够和合约的描述对应，然后发行同等值的债务凭证，这就是货币真正的起源。


    # 今日概要：


    +   **划重点**

    **第一，货币是起源于债务的，它充当债务的度量单位和债务关系的凭证；**

    **第二，国家信用为整个社会的债务关系提供背书， 那么作为债务凭证的货币因此得以流通和交易；**

    **第三，这是德勒亚国家信用货币理论，这个理论以往虽然被主流经济学所忽略， 但是都得到了人类学事实证明的很多支持， 而且也在现实中超越国家和中央银行的实践中所发现。**




    在提出今天的思考题之前我给你简单地介绍一下，就是可以以亚当·斯密为代表的古典派（国家信用）大概是18世纪末到末期，那个时代正好时英国工业革命兴起，人民运动开始发生的时期，贵族们要求争取更多的民主权利，所以像主权、金融监督这些在当时是非常流行的。
    而你完全想在当政常发生之后，我再给你给出今天的思考题。 今天的课程里我把今天的课程里我给了你讲国家信用货币理论， 这个理论从亚当·斯密发端长期被主流经济学界所忽略，
    我想借着你学今， 为什么它长期不受重视， 以及它和什么关系 它一开始看上去很有利、有节， 而且也能够得到很多人主要经济的理论支撑， 从长期地得到主流经济学界的排斥和忽视呢？
    欢迎你把你的思考发在留言区和我们一起分享。'
