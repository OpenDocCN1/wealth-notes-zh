  md: "\n90天短期国债合约。这个产品推出以后，大受欢迎，一方面它跟外汇期货一样，能够帮助投资者分散风险。另一方面，利率期货交易的是人们关于未来利率的看法，这个合约很快地就成了预测利率走向的风向标。也正因为此，利率期货成为了历史上最成功的期货品种之一，至今为止，各种期限的国债合约差不多要占到整个衍生品交易的一半以上。\n\
    \n从有形的农产品、工业品到货币，再到完全无形的利率，在金融创新的过程中，商品的概念逐渐摆脱了有形商品这个束缚，为下一步的金融深化打下了坚实的基础。\n\n\
    ## 今日概要：\n\n### ▏划重点\n\n- 1. 金融衍生品的基础资产可以对应任何具有波动性的产品，权力、利息、服务，甚至事件，只要有波动，就可以用衍生品来进行风险对冲。这个过程，也是一个金融深化的过程；\n\
    - 2. 在金融深化的过程中，人们对商品的意识经历了两次重大突破。第一次突破中，人们意识到商品不必是有形的。货币期货和利率期货使得商品摆脱了有形的束缚，金融期货开始大行其道。\n\
    \n香帅\n\n其实很多同学对中国的衍生品市场有一点点误解，很多人认为，咱们中国是没有衍生品的，其实不对。你看，像我们的大连、郑州、上海就分别有四个期货交易所，交易着很多不同种类的产品。我想请你去查一下，中国的这些交易所里面，分别有哪些品种的合约在交易，通过这么一个梳理以后，你就会对中国的衍生品市场有一个大概的认知和了解了。\n\
    \n欢迎把你搜索和整理的结果放在留言区，跟我们一块儿分享。你也可以把今天的内容分享给那些对衍生品市场一无所知的朋友，让他们跟你一块儿分享你的获得。\n\n\
    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_77_0.png)\n\n## 笔记精选\n\n提交留言可与专栏作者互动\n\
    \n香帅\n\n你好，欢迎来到香帅的北大金融课。\n\n今天的课程开始之前，要请你帮一个小忙。今天的课是咱们的音频特别版，因为主王的缘故，好天没有与你见面，所以这次的直播再见前，我非常地希望也备足了时间，希望能将这门课背后的金融逻辑讲给你。\n\
    \n当我希望这门课能帮到更多人，所以特别地想请你帮个小忙，把你学到的知识分享给你的朋友们，推送给他们，一起学这门课。说不定这样你能找到一个学友一起进步，这样你的学习效果也会提高。谢谢你！今晚上咱们不见不散。\n\
    \n## 截止在直播间预约\n\n昨天我们课程里讲到在期货发展的过程中，人类对商品的认识发生了两次飞跃。\n\n第一次飞跃就是认识商品不一定是有形的或者是具象的，像汇率、利率这样抽象的、无形的东西也可以归约到商品的范围里。\n\
    \n## 一、期货是如何交割的？\n\n今天我们要讲的是第二次飞跃，商品是可以不必进行交割的。要彻底理解这个问题，我们首先要知道什么是交割。觉得在理解金融衍生品这个过程中间，很多时候障碍得其实来自于这种金融术语的障碍，所谓交割也叫“Settle”，就是我们平时说的“钱货两讫”。\n\
    \n平时说到钱货两讫，大家很清楚是意思原则就是钱货两讫。你付10块钱，拿两个苹果走，这就是现货交割，期货市场其实也是一样的，它只不过是在约定的时间和地点，以约定的数量和价格来付货款两讫。\n\
    \n举个例子，假设你开始炒矿，担心明年棉花价格的上涨你可以跟一个郑州棉花期货所，交一定的保证金买一个明年一月份的棉花期货合约。棉花期货的交割日规定是每个月的第十个交易日。\n\
    \n到了明年1月的第十个交易日，你就要进行交割，什么是交割呢？你要将你的货物打进交易所账户，而对方就要将棉花送去交易所指定的仓库，然后取得一个凭证。\n\n\
    买卖双方的仓口就分别去取货款和棉花，钱货两讫，完成交割。\n\n这里要注意的意思就是在交割完成后，商品的交易就完成了转换期。看上去在商品的所有权，交割从天经地义。不过，除了这样的实物交割，我们生活中还有其他的结算方式。\n\
    \n大学的时候，你是不是在楼下小卖部赊过账，小卖部的阿姨拿一个小本子给每个人记账，月底的时候结算，这其实就是实物钱货两讫也换成了账面上的金额结算。而期货市场也可以类似地现金结算，和实物的交割是不一样的。\n\
    \n现金结算不涉及对所有的转移，而只是在到期日的前一两天对资金进行清算到，其实买了一个期货合约，你的期货合约的价格每天都波动，所以你的账户上的金额也每天波动。\n\
    \n这个时候现货合约就会每天根据你的盘给你进行现金的结算，如果你赚钱了，那么利润会划到账户，亏了的话，交易所就会划转证券的保证金，你想这种交易其实为那些投机者提供了特别好的工具。\n\
    \n因为有一个保证制度的存在，所以可以用少量的资金来撬动杠杆，如果这个市场越有杠杆就有以博大小的，那么也正是因为，在传统的观念中，保证金交易是现货交易的合法交易是赌博的分野。\n\
    \n早期的时候甚至有人认为，“一切不必交割为月的期货交易都是非法的”，所以一直到1982年的时候，现金结算在期货交易中还认为是违法的。\n\n## 二、从交割到现金结算：股指期货的诞生\n\
    \n“必须交割”这个要求，其实就对期货有了限制，有些人一直认为股票很危险。有限而股指交易是合法交易的最终合约。为什么啊？其实在刚才的例子中，我跟你说过，通过棉花的期货合约，你就把棉花价格的未来波动锁定了，你的生产成本也就锁定了。\n\
    \n所以不管棉花的价格未来是涨还是跌，面对的不确定性变成了确定性，这就是风险的冲，这种功能对于很多生产者来说都是非常重要的。\n\n在对商品进行风险对冲的这个过程中，人们就会更多地参与到其中，其实只要涉及到风险，就大多可以视为期货交易，而越是波动大的领域，风险对冲的应用范围就越大，比如金融领域。\n\
    \n同样的道理在金融市场上，那些风险最集中、应用最广泛的产品就是进行风险对冲的必然，什么风险是最大的呢？当然是金融市场的风险，而市场我们知道一般是根据大盘指数来衡量。比如说道琼斯指数，就是美国市场30家代表公司的总体平均值，它也反映了美国股市的总体波动，也就是代表着美国股市的市场风险。\n\
    \n正因为股票指数的代表性，所以它一直是期货界人士的梦想。但是在推出交割这个合约之前，股指期货一直没有办法，因为股指不是一个按一定标准，包含着很多实体股票的组合，它是一个概念，而没有实体，无论是谁，都没有办法对一个概念进行所有的转换。\n\
    \n所以如果要推出股指现货，你必须得有某种方法将期货数据转换成现金进行结算，而这就跟当时的法律发生了冲突。\n\n那么这个限制到了上个世纪的七十年代以后就越来越不明显了，来自现实世界的需求使得“对冲市场风险”变得越来越成为必要。\n\
    \n首先你看，70年代以后，有一个“有风险性”兴起了。伴随着这个理论的兴趣，指数的基金也兴起了，一个是可以通过资产组合来降低风险，但是需要一个对整体市场波动的风险，这种风险只能是重要程度。另外一点就是基础在商业银行评价的时候也会选一个指标为基准，超过指数的部分才算超额收益，才会有分红，所以基金、基金经理们也需要把这个市场风险对冲掉。\n\
    \n我们在前面的课程里说过，60、70年代以后，美国的金融越来越形成一个中心市场，资产管理的越来越多，所以对冲市场风险的需要越来越大。\n\n后来在业界的大力游说下，1982年的监管机构就决定废除必须实物交割的要求，以后所有的金融合约都可以采用现金结算的方式来。这个法令就为股指期货的推出到底铺平了道路。\n\
    \n之后不久，芝加哥商业交易所就推出了标普指数的期货合约，而股指的推出为整个资产管理机构，都是特别重要的一方面是现金的期货，它是帮助投资者从风险转移的工具，但是有办法通过投资组合分散掉的。而股指期货的推出，使得这种不可分散的风险能够得到对冲、被转移。\n\
    \n后来在美国之后，几乎所有成型的金融市场都推出了股指期货，以对冲本国市场上的系统性风险。\n\n不过又有一件事很有意思的事情，我刚才跟你讲过了，股指期货是用于风险对冲的工具，股指是现金和期货合约。它有的时候为投机者提供了更高的杠杆，有时也会引发市场更大的波动。\n\
    \n在美国、日本，还有我们中国，股指期货都会在股市中的下跌中被为妖祸痛讨。\n\n这个话题，在下周我还要给你做更详细地讲。\n\n昨天我跟你讲了货币期货，到今天讲的股指期货，这一系列的金融期货都是在芝加哥开始的。随着期货的金融化过程，金融衍生品也开创了属于自己的时代。像期权（option），互换（swap）各种衍生工具纷纷推出。所以“风险对冲”本身也就成为了一门生意。\n\
    \n其实到这里你可以联想一下我们之前讲过的对冲基金、量化投资、买空、卖空，这些金融工具、金融手段，其实都是为了满足人们对冲风险而诞生的产品。\n\n这也就回到了我们第一课说过的对抗不确定性、对抗风险，从来都是金融最初的动机。\n\
    \n最后我想多跟大家啰嗦一句，其实在金融衍生品这个创新工具的发展过程中间，我有一个特别深的感受，就是认知颠覆和社会需求永远是创新的源泉。\n\n从交易“商品”到交易“合约”，再到交易“不确定性”本身，金融衍生品的发展其实是和人类认知的一次次颠覆联系在一起的，你没有认知上的突破，其实不会有这么多创新。其实这也是为了我们总是强调要不断学习，不断进行认知颠覆的一个重要原因。\n\
    \n其次，你会发现好的创新一定是和时代、市场的需求紧密结合在一起的。在60、70年代的时候，就是因为固定汇率制度和固定利率制度的解体，全球进入了一个金融波动的时代。所以这样才使得风险对冲的衍生工具站上了时代的风口。\n\
    \n其实在我们现实生活中也是一样的，谁抓得住时代的风口，谁就会站在时代的巅峰之上。\n\n## 今日概要：\n\n### ■划重点\n\n- 1. 随着金融市场的进一步发展，期货实物交割的要求被废除。所有的金融期货都可以采用现金结算的方式。在此之后期货的终极合约，股指期货出现，深刻地影响了全球的资管行业；\n\
    - 2. 社会需求和认知颠覆永远是创新的源泉。金融衍生品的发展符合时代风险对冲的需求，也伴随着人类认知的颠覆。\n\n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_79_0.png)\n\
    \n昨天的课程里我给你出了一道题，说要你搜索和整理一下我们国家现在市面上有交易的期货品种。在今天的课程里我给出金融期货作为一种金融创新的产品，有两个特征。第一，一定是符合市场和时代需求的，另外一定是伴随着认知的颠覆。\n\
    \n今天我想请你想一想，我们生活中其实还有哪些东西是符合期货交易逻辑的。然后请你站在期货交易所领导的位置替他们推出新的合约。\n\n好了，欢迎你打开脑洞，把你的所思所想放在留言区，跟我们一块儿分享。你也可以把今天的内容分享给你的朋友，让他们跟你一块儿来开动脑筋，设计新的金融产品。\n\
    \n这里是香帅的北大金融学课，帮你站在高处重新理解财富。今天晚上8点钟，我会在“得到”的直播间里和你相见。\n\n今晚8点，不见不散。\n\n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_79_1.png)\n\
    \n## 新生指南丨我为你准备了这份学习攻略\n\n香帅\n\n你好，热烈欢迎来到香帅的北大金融课。今天有很多新同学加入，我担心跟不上课程节奏，特意为你们准备了这份学习攻略。\n\
    \n你可能是金融小白，也可能是银行经理，无论你对金融专业知识懂多少，在这里，我一定会给你新认知；你可能是只会用余额宝的理财新人，也可能是驰骋金融市场的高手，在这里，我希望你可以和“站在周期，重新理解财富”。\n\
    \n如果你是新同学，一定要看这篇学习攻略，它能帮助你了解课程安排，有效学习，快速进入金融秩序的轨道。如果你是我很熟悉的课程进度，建议你拿出一个之前课程的目录或索引，随时拿出来翻看复习。\n\
    \n## —— 课程每日安排 ——\n\n周一到周三体系课程的讲授；\n\n周四是当周课程的“延展话题”，在延展话题里，我会给你前三天的课程，给你梳理脉络，升级认知，剖析热点或现象；\n\
    \n周五是“本周问答”，如果你对本周知识点有疑惑，我会及时为你解答；\n\n周六，我会帮你用PPT课件的形式，把一周的知识串讲一遍，并复习旧识。我在北大讲课时，经常有学生找我借讲义，所以我会把课件的下载地址放在文稿里。\n\
    \n周日不定期放送加餐，帮你额外“开小灶”。\n\n## —— 学习方法和使用建议 ——\n\n- 1.课程讲的结构是什么？\n  ——课程的设置是由8个大板块，30次学习模块组成，每个模块下面大约有2-4周的内容。每个板块、模块其实都是相对独立又前后联系的，而每一周的内容也具有一定独立性。\n\
    \n- 2.要不要补之前的课？\n  ——因为每周的内容是相对独立，新同学不妨跟着香帅的课程节奏，每天学习，将当期内容新学理解。然后每期课补学，第一周课程开始补，一边吸收新内容，一边学之前的课程，你会发现，其实所有课程穿起来像珠链，分开是一颗颗独立的珍珠。\n\
    \n- 3.学金融为什么要先了解宏观背景？\n  ——我把整个这一年的学习，分为三个阶段，戳此查看\n\n- 4.学给你的学习建议\n  看老同学是怎么学习和使用专栏的\n\
