    况是，拿着现金根本就不是一个万事大吉的事情，很多时候它可能是负的收益率。比如说社会上通货膨胀率很高，物价上涨，你持有现金就意味着什么呢？就是在亏钱，你的收益率就是负的。


    前一阵子我看过一个挺辛酸的故事，有一个孤寡老太太，丈夫当年是万元户，在八十年代的时候那可是有钱人啊，结果丈夫不幸很早过世了，留了一万多块钱给老太太。老太太把它的存在深深的壁橱里二十多年。从当时来看，能够指着这点钱过着很体面的养老生活，结果你看在在一万块钱，也就是一个苹果手机的价格了。


    所以说，正因为储蓄和投资是等价的，只要我们活着在消费，你就没有办法逃避储蓄这个事，你就避免不了储蓄和投资的决策。换句话说，投资这个事就跟吃饭睡觉一样，你是回避不了的，只不过是看我们做的投资决策是好还是坏，是聪明还是消极。


