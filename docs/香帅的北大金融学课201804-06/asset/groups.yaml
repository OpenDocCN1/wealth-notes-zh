    # 121 | 投资组合理论：

    金融学的大爆炸理论


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_138_0.png)


    欢迎来到春笋的北大金融学课。


    今天的课程，我想跟你分享一个非常有意 思的金融理论。这就是1990年的诺贝尔经 济学奖得主马科维茨的投资组合理论 （Portfolio Theory）。


    其实我想很多同学都知道这个投资组合理 论。我在前面的课程里也跟你介绍过，所 谓投资组合，就是投资在很多时候不是单个 的证券上。因为很多证券可以进行风险分 散，所以如果那个组合够大，就可以把单
    个证券的个体性风险全部分散掉，这样就 避免了“把鸡蛋放在一个篮子里”的危 险。


    这种风险分散的概念，我想在很多同学心 中都是深入人心的。但是，让大家最津津 乐道的地方，其实并不是马科维茨的这个 理论最闪亮的地方。


    这个理论之所以被尊称为“金融学的大爆 炸理论”（the big bang of modern finance），是因为它把数学语言引进了金 融，然后创造了一套属于金融学的方法
    论。而这个方法论非常牛，它把金融学放 到了一个量化的框架里面，让金融成为了一 门数据驱动的科学，也成为了社会科学 里面最接近自然科学的一个学科。


    # 一、让抽象概念变得可计算


    可能有的同学还是问，什么叫做创造了一 套金融学的方法论？这种词语“不明觉 厉”。你要是听不懂这个事有多牛的话， 我给你举个例子。


    很多同学都看过《X战警》吧，里面有一个 叫罗根的变种人，他有延缓衰老和极强 的自愈能力，然后他的双手还可以伸出骨 爪。后来他的骨骼无意中被注入了艾德曼 合金，从此骨爪变成了无坚不摧的钢爪。
    变种人罗根变成了超级英雄金刚狼。


    为什么跟你说这个例子呢？马科维茨的理论 之于金融学，就像这份合金注入，把罗 根变成了金刚狼一样。它让金融学从此脱离 了简单的贴统计和价值分析，变成了一 门高度数据化和结构化的学科。


    好了，那么今天我们就来看着，马科维茨理论 究竟在哪个方面对金融学注入了 艾德曼合金？


    你看，首先它把一个抽象的风险概念转化 成了可计算的变量，然后创造了一套风险 收益的一般性分析框架。然后这个框架从 此成为了金融学大厦的基础框架。'
