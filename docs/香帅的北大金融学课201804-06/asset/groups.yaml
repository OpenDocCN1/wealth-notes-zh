    # 第十六周 | 课件放送：本周划重点时间到！


    你好，欢迎来到香帅的北大金融课学，又到了一周的课件放送时间，每周的今天，我都会给你划重点、敲黑板。好了，我们先来把本周的知识点和重要的逻辑串讲一遍。


    这一周，我给你讲了人类最根本和最古老的金融活动——债务活动。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_0_0.png)


    # 第一天：债权：人类最古老的金融行为


    第一天的时候，我给你介绍了债权，我们知道了债是可量化和可货币化的责任，它的演化经历了从隐性的债务关系到具有强制力的显性债务契约，最终到中心化的债务机构这个过程。理解人类的债务活动，就是理解金融市场的核心。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_0_1.png)


    相关课程：066 | 债权：人类最古老的金融行为


    # 第二天：从"债"到"债券"中间经历了什么？


    第二天，我给你介绍了债务合同的高阶版，债券。债券是债务关系的凭证，通过标准化的小额合同，债券有效地降低了债权投资的门槛和融资的交易成本，创造了一个具有流动性的二级市场。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_0_2.png)


    在金融市场后续发展的过程中，这种使不可转让的权利变成可以自由转让的证券的过程，超越了债的范畴，被广泛地应用于其他的金融工具之上。


    相关课程：067 | 从"债"到"债券"中间经历了什么？


    # 第三天："债"的成本怎么计算？


    第三天，我接着给你讲了利率和利息，也就是资金的时间价值。利率的高低是由时间偏好和投资机会两个因素决定的，居民的耐心程度决定了资金的供给，投资机会决定了资金的需求。有的时候，政府也会
    对利率进行干预。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_0_3.png)'
  - "[PAGE 1]\n\n# 071 | 你的个人信用，很值钱！ \n\n吉帅\n\n欢迎来到吉帅的北大金融课程。\n\n本周课程开始之前，先预告一个好消息。我们春节房地产专题课程里公开征集的留言问题，我陆续在整理和回复中，但还有大家关心的很多问题没有回复，比如：\n\
    \n+   1. 房产税究竟何时会出台？对房价的影响有多大？\n2. 公房能购买吗？\n3. 租赁同权、共有产权会不会大幅稀释房权？\n4. 集体建设用地入市对土地财政的影响有多大，能否解决高房价问题？\n\
    \n为了清楚回答这些新问题，我特意邀请了一位嘉宾来讲课。大家可以在4月6日（星期五）看到他的文章《房产税：到底会收多少？》，大家可以在4月16日（星期二）看到他的文章《共有产权房：会改变买房游戏规则吗？》。\n\
    \n![](img/57d1f8e71f5c2d70d3f3441deb3105c7_1_0.png)\n\n上周的时候，我们重点讲了债和债的关系。今天这篇文章，我们来看看，人和企业之间的关系。为什么个人信用的建立这么难？因为它是一个‘信用‘，而不是‘抵押‘。\n\
    \n这一周，我们要从个人、企业和国家这三个层面来重新认识信用的本质。今天先来第一步，个人的信用是怎么一步步积累起来的。\n\n“信用就是钱”这个概念在中国，其实还不是特别普遍。很多人会想到‘抵押‘，比如‘房产证‘、‘汽车‘。在西方发达国家，信用体系是建立在‘数据‘基础上的。\n\
    \n比如美国，他们有自己的FICO评分体系，从300分到850分，分数越高，信用越好。这个体系就是建立在美国人几十年来的‘还款记录‘、‘负债情况‘、‘信用历史‘等数据基础上的。\n\
    \n# 一、为什么说信用就是资产？\n\n“信用”这个词，英文是credit，来自拉丁语，原意是“信任”（trust）。它包含了三层意思：\n\n+   1.\
    \ 信任：相信对方会履行承诺。\n2. 时间：这种信任是基于过去的行为，指向未来。\n3. 风险：因为有不确定性，所以有风险。\n\n比如说你借钱给朋友，你信任他会还钱，这是一个基于过去信任的‘信用‘。如果他不还，你就有损失，这就是‘风险‘。所以信用是一种‘资产‘，因为它可以‘定价‘。"
