    #### 第二天&第三天：金融衍生品带来的两次认知升级


    第二天和第三天其实是连在一块的内容，我告诉你，金融衍生品可以对冲任何具有波动性的产品。其实金融衍生品的发展过程是人类的不确定性的认知不断升级的过程，在这个过程中，我们对商品的认知经历了两次重大突破。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_87_6.png)


    第一次突破，人们意识到，商品不必是有形的。20世纪70年代，布雷顿森林体系崩溃之后，整个全球的货币市场和汇率市场都发生了很大的波动，所以就需要有风险对冲工具的出现，这种社会需求就刺激了货币期货和利率期货的出现。货币期货和利率期货的出现，又使得人们意识到，商品不一定是实物商品，它可以是无形的、抽象的。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_87_7.png)


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_87_8.png)


    第二次突破是股指期货的出现，打破了期货交易必须交割的局面。随着市场的进一步发展，所有的金融资产都采用了现金结算而不是实物交割。在这两次突破过程中，其实我们看不到，好的创新一定是和时代需求和市场探索紧密合在一起，而社会需求和认知颠覆是创新的源泉，这就是这一周整个的内容。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_87_9.png)


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_87_10.png)


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_87_11.png)


    最后我想强调一点，金融衍生品是我们整个这一周的学习过程中你会感觉到最多的一个部分，因为金融品的抽象多、很复杂，而且它的概念又非常多地抽象。一般在生活中，我们大家对衍生品的了解比较少，所以他会感觉，这么抽象的内容学起来很吃力，但就像我在直播里给你说过的，人类的思维总是从具体到抽象有一个上升过程。

