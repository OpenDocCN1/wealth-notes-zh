    ## 二、中小企业融资难的破局之道


    那中小企业融资难这个问题，到底有没有一定的解决办法呢？也是有的。美国和德国在中小企业融资上是做得不错的国家，但是它们采取的是不太一样的路子。


    美国是债券市场主导的企业融资，在前面的课程里我们讲过，美国的垃圾债，也就是高收益债券的市场，曾经为高科技的小企业开了一扇融资的大门，这个市场上的投资者追求高收益，也承担相对高的风险。中国也有类似的中小企业债券市场，但是因为整体比中国债券市场的深度不够，企业的信用债这一块业务没有发展起来，所以这个市场没有起到特别大的作用。


    所以，德国的经验对我们就比较重要了。德国跟我们一样，是以银行为主的金融体系。但是它的银行体系是非常有层次的，大银行对应大企业，中银行对应中型企业，小银行则对应当地的小企业。这种结构就能够很好地解决信息不对称问题。


    举个很有意思的例子，咱们中国的金融体系是以大银行为主的，是一个头重脚轻的结构。但是在90年代的时候，吴晓灵担任行长主管央行期间，她就主张留下了4家地方性的民营银行，其中有一家就叫做泰隆银行。


    我们在北大的一个调研课题中发现，这家银行的中小企业融资业务，尤其是那些民营的中小企业融资业务做得特别好。它们的金额小，几万块、几千块的贷款都做，而且坏账率还很低。那它们到底是怎么做的呢？我们在调研的过程中就发现，其模式：“小米加步枪”的模式。银行不开小超市，去银行里申请贷款，银行不看你的报表，因为小地方小企业的报表，作假的空间非常地大，他们会派一个信贷员到你的店里里面蹲点，记录超市每天的客流量，寻访附近居民的消费趋势，判断你的超市的经营潜力，好几个月以后，很多的讯息都非常清晰地出来了。对于一个数据源都容易，但我们能每天要找这么多群众演员来演戏，这个可能性是很低的。这样下来以后，泰隆银行对于自己当地的贷款客户都有一个非常精准的画像，就筛选出了真正比较踏实、有潜力的企业。


    其实泰隆银行的这个生存之道就印证了德国经验的成功，当地的小银行为当地的中小企业融资，大大地降低了信息和交易成本。这也是我们国家要发展多层次的资本市场的一个重要的目的。


    ## 三、新技术的革命


    除了这种发展多层次的资本市场传统的思路以外，其实有一个趋势是你要注意的，也就是这几年，信息技术对中小企业融资的改变是很大的。比如说京东的京小贷，它就针对自己平台上的商家进行融资，它是根据商家的销售额，消费品的小格，商品的丰富度等指标来发放贷款的。一笔贷款的上限大概是
    200 万，最长期限是 12 个月。由于商家的这些数据都沉淀在京东的平台上，所以可以比较精准地判断这笔贷款的安全性，所以也不需要抵质押品，就直接发放信用贷。阿里系的蚂蚁金服也是同样的思路，利用这些年沉淀的数据，对自己的平台上和相关平台的商家发放信用贷。


    所谓大数据改变金融模式，在这些例子上是很显著的，它的根本逻辑是网上沉淀的数据使得贷款方信息收集和信息整理工作变得高效和便利，信息的成本大大降低。一笔几万块钱的贷款，蚂蚁金服的平均成本大概是
    2.3 元，而同等金额的贷款在传统银行里面的成本大概在 2000 元左右。此外，这种数据失真的可能性很低，所以坏账率也会下降。


    我在蚂蚁金服调研的时候，听了一个案例，就觉得很受震动。当时他们考虑给淘宝商家放贷的时候，就需要一套评价体系来判断哪个商铺最适合放款。在经过多次的数据分析之后，我们发现，传统银行的信贷模型中，很多变量都不适用，一个很“淘宝”的变量居然浮现了出来：“商铺对顾客的回信速度”可以特别地预测坏账率。


    这个结果很出人意料，但是对一个淘宝重度用户来说，这一点都不奇怪。我当时马上就明白过来，用淘宝这么久，每次都及时响应你的问题的店家一般来说质量是比较好的，用户的回头率也肯定是很高的。再仔细想想，这在经济学的逻辑上是完全站得住脚的，网上的店家面临的同质化竞争很厉害，最大的投入就是人力资本的投入。一个店家给你的回应快的话，就意味着他的人力资本投入会特别多，这家企业的质量就是比较好的，所以违约率比较低，是完全可能的。


    现在，各大互联网平台都在争取金融牌照，想着自己平台上的企业做融资业务，像滴滴就发行了一个底层供应链的金融产品，给滴滴的司机发财务。这些方式的思路都是一样的，就是利用互联网上沉淀大数据的能力，将这个市场上的信息不对称降到最低，而信息不对称正是金融行业的最本质特征之一。


    ### 划重点


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_4_0.png)


