    \n# 081 | 古罗马的治理是怎么“外包”出去的？\n\n你好，欢迎来到得到「北大金融学课」。\n\n股票是我们生活中最为常见的金融工具，咱们中国有几十家、成千上万家，很少说价值投资、技术革新，但是，很少有人知道，股份制公司和股票，其实几乎塑造了我们现代全球世界的整个格局。如果读懂了，尤其是世界，是理解宏观金融世界的密码，那么股票则是理解宏观金融世界的部分。内容里面金融的核心概念梳理起来，内部都是围绕股票在股权和公司展开的。\n\
    \n在接下来这三章里，我将带你从公司的本质，股票和公司对于世界的塑造，以及股票所代表的投资者的权利等几个维度来彻底理解这个你生活中最重要的金融工具。\n\n\
    今天我们股权和股票的本质开始。\n\n## 一、古罗马的治理体系的目标：经济利益的一致性\n\n你可能知道，股票是金融工具，股份制公司是一种经济组织形式。但是我们今天要告诉你的是，这种复杂的东西存在表面，股份制的是让不同人的人取得经济利益一致性的安排。而且这种制度安排充当了最重要的社会治理手段。\n\
    \n要理解上面这两点，我们就必须从罗马共和国的例子看起。\n\n俗话说，破坏一个旧世界很容易，但是建设一个新世界很难。对于任何一个早期的政府来讲，最重要的问题是什么呢？就是如何让从众的心变成一致一致，也就俗话说的“治理”问题。大家都知道，暴力只能解决一时的问题，你必须依靠制度安排，然后去创造一种社会秩序，然后取得经济利益的一致，这才能够维持一个社会的长治久安和稳定。\n\
    \n到公元前五、六世纪的时候，罗马共和国已经是一个庞大的国家，疆域达到三百多平方公里，人口有是多少700万，那么在早的历史时期，他们是怎么实现这种国家治理的呢？\n\
    \n在《城邦与奴隶》这本古罗马的经典中，著名的历史学家李维（Livius）描述了罗马统治者通过一个一个的税收制度来实现对庞大共和国的治理和稳定。\n\n具体来说，当时为了更有效地实施国家治理，罗马政府把几乎所有的公共服务都“包”出去，包括军队的给养、公共事务、还有城市街道、城城、剧院的修建维护、捕鱼、放牧、采矿这些工作，还有政府从人头税、土地税的征收。所有的国家治理项目，他们采取自由目标标税，由税收合伙人在这种社会组织来竞标，然后通过这些来完成一系列的国家治理活动。\n\
    \n## 二、税收合伙人制度就是股份制公司的雏形\n\n税收合伙人制度就是我们现代所谓的股份制公司。为什么呢？我们可以从四个特征来看。\n\n- **股本金**\n\
    \  \n  首先，罗马共和国这些公共服务涉及的资金很大，它要求动员的人力、物力都非常多，所以是单人很难完成的。税收合伙人都是以单一的人用是资金入股，而原始的这个公司联络。你看，这全部跟我们今天的公司股集合在一起，完全跟股本金是一样的。\n\
    \n- **永续性与可转让性**\n  \n  其实，金融组织有两个非常重要的特征，一个叫永续性，另一个叫可转让性。因为这种组织要罗马就有承担了大规模的公共服务，有问题和出现的一个组织内部可能会成员离开或者死亡。但是，组织承担的項目和经营不能停。所以，原有成员的权益必须能够被继承或者转让，以保证这个组织的永续性。\n\
    \n  从这里开始，“股份”的概念就产生了，这种股份概念的产生其实是“税收合伙人”这个概念组织在演变过程中被脱壳了。\n\n  你看，首先，可以组织，组织的成员权利和义务就开始按照出资的程度成比例，进行分配，然后契约的方式进行固化。这个股份契约就是被“税收”代表的，就是股份，一被脱壳就税收合伙人的一个基本单位的的所有权。而这种所有权可以进行互换和转让的。购买这个凭证，获得这种权利和义务的人就被称为“股东”。\n\
    \n- **二级市场流动性**\n  \n  这种组织的永续性和转让性，和我们今天股份制公司的股票的概念是一样的。\n\n  股票的概念产生以后，股票的交易就开始慢慢的形成了。到公元前三世纪的时候，这种税收合伙人组织的股份交易已经变得特别常见，当时罗马广泛参加的卡里斯蒂神庙是最大的交易市场。这就相当于我们今天的“股票交易”。\n\
    \n  而在转让的过程中，股份交易的折价和溢价情况经常从发生，股票交易人被发现了，他们可以从股票价格的波动中获利。所以越来越多的罗马公民参与到税收合伙人股东的交易中。古希腊的历史学家波利斯记载，当时几乎每个罗马公民都以某种形式参与了这种政府的租赁。\n\
    \n  那么在这种情形下，一个颇具规模的股票二级市场就已经在罗马形成了。即使它当时的交易本不具备股票市场，那么这个具有流动性的，对于整个社会来讲是有重要性的。这个具有流动性的市场使得税收合伙人力量大。为什么？因为对外来投资者的大变，越来越广，也使他们承接的公共服务范围越来越广。所以税收合伙人组织成为了罗马社会的一个中坚力量。\n\
    \n## 三、税收合伙人制度促成罗马共和国的繁荣\n\n税收合伙人实际上具有现代股份制公司的重要组成部分，永续性，可转让，股东权等等，以及具有流动性、转让性。股票，这一系列的制度安排，对于罗马共和国的存续和繁荣是至关重要的。\n"
