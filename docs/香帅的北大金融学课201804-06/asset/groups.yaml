    \n在入学名额非常紧张的大背景下，租售同权只能使得僧多粥少的局面更加紧张。如果不增加学位资源，让更多的人来抢给定的入学名额，只能使得局面更加混乱，不会从根本上解决问题。倘若损害学区房购买者的利益，政策的阻力也会很大。目前看，大多数试点城市还是积分制，户籍和自有产权住房，还是积分中的大头。\n\
