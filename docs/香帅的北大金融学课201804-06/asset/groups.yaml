    # # 第十八周｜课件放送：本周划重点时间到！


    你好，欢迎来到香帅的北大金融课。


    又到了一周的课件放送时间。每周的今天，我都会给大家“划重点，敲黑板”，把本周的课件用PPT图片的方式给你放到文稿里讲一遍。我们把本周的知识点和重要逻辑串讲一遍。这一周我们给你讲了国家和信用货币理论以及中国的债券市场。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_25_0.png)


    # ## 第一天：货币真的起源于物物交换？


    第一天，我给大家介绍了国家信用货币理论的概念。你知道了货币起源于债务而不是物物交换，国家信用为整个社会的债务关系背书，这使得作为债务凭证的货币得以流通和交易。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_25_1.png)


    相关课程：076 | 货币真的起源于物物交换？


    # ## 第二天：欠债不一定还钱——债务违约的必要性


    第二天我给大家介绍了债务违约的相关内容。在这讲里，你知道了没有违约的债券市场是不能持续的，因为它违背了“风险-收益平衡”的原则，会产生极大的道德风险。在现实生活中，债务重组是解决债务问题常用的一种方法，它也是一种社会成本更低的策略。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_25_2.png)


    相关课程：077 | 欠债不一定还钱——债务违约的必要性


    # ## 第三天：债务螺旋——中国王朝更替的金融逻辑


    第三天我接着讲了中国古代王朝更替背后的金融逻辑，即债务螺旋。在农耕经济的古代中国，债务网络可以简化为国家和个人之间的债务关系，即税收；和个人与个人之间的债务关系，即民间借贷。一旦有天灾人祸、外敌入侵等外生冲击，这两种债务关系就会迅速恶化，形成杠杆率交替上升的“债务螺旋”，最后以王朝更替而结束。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_25_3.png)


    相关课程：078 | 债务螺旋——中国王朝更替的金融逻辑


    # ## 第四天：延展话题：为什么我不建议你投资债券？


    第四天我接着给大家介绍了中国债市。债券市场是一个机构主导的市场，95%的债券交易量在散户没法进入的银行间市场发生。债券流动性差，对宏观分析能力要求高提高了散户投资债券市场的门槛，个人投资者如果需要投资债券可以通过购买债券基金进行。


