    # 一、资管市场现状：“双螺旋”共同作用下的影子银行


    首先我们来看，中国资管市场，这几年有一个飞速的发展，这个飞速发展就可 以用我前面提到的“双螺旋”来解读，也 就是资金监管的双螺旋。


    从2012年开始，中国的资管市场发展的非 常迅猛，到2017年底，资管总规模是117 万亿，比当年的GDP多 了30%不止，和2012相比，资产规模翻了5倍，
    年均增长接近40%，而且资管产品这几年 已经极大地丰富起来，银行理财、信托、 保险、公募、私募，几乎所有的金融机构 都在做资产管理。


    ![](img/57d1f8e71f5c2d70d3f3441deb3105c7_67_0.png)


    这样迅猛的发展势头，就是资金监 管的双螺旋作用的结果。


    我们先来看资金面，多年的快速增长以 后，中国的经济体已经位居全球第二， 和增速相比，现在的钱大呢？就是居民的财富 积累，现在100多万亿的货币规模，就 是居民财富积累的结果。除此之外，在这
    几年资产有60多万亿的居民存款，这 都是大量资本，同时大量资金是资金 来源，这是资金面富余的原因。


    另外我们再来看监管面，监管这 几年发生了两件大事：一件叫放松，一 件叫差异化。


    2012年的春天，我们国家出台了 一个新的《基金法》，松绑管制，加强监 管，成为整个新资管行业的逻辑结构，其中 最重要的就是允许通道机构，比如 允许基金子公司；允许保险、期货
