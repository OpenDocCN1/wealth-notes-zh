    # 107 | 投资第一步：了解你的风险偏好




    你好，欢迎来到老师的北大金融课。


    你知道，在金融投资的世界里，最常听说的 一句话就是“高风险，高收益”。但是 你发现没有，为什么会有高门槛，高收益 呢？在我们今天来解释这个问题之前，我们 先来做一个实验。


    # 一、一个实验看懂“风险和回报”


    现在我给你两个选项：


    第一个选项是让你去听一个游戏。你赢了这 个游戏就能给你100块钱，输了就什么都没 有，那赢球的概率都是50%。


    第二个选项就是你不去参加游戏，直接给你 50块钱。


    这两个选择，你会选哪个？


    现在，你可以在心里给出你自己的答案。


    这是一个特别有名的心理实验，实验的结果 发现，绝大多数人都会选第二种，就是 不参加这个游戏，直接拿50块钱走人。


    为什么会这样呢？要从理性的角度，我们 算一下就知道。这两个选择的期望回报 是一样的。你看第一种选择中，你有 50%的概率拿100块钱，还有50%的概 率拿0元，所以期望回报还是50元，和
    第二种选择可以拿到的回报50块钱 是一样的。


    两种选择的区别在哪里呢？一个是确定 的50块钱，一个是不确定的50块钱。知道 这意味着什么么？意味着将来不确定的 回报是不一样的时候，作理性的人类的 你不愿意接受不确定性，这就是刚刚
    我 说过的 一个 词 ， 叫 “ 风险 厌恶 ” （ risk aversion）。


    那么，在什么情况下，我们会愿意去承担风 险，面对不确定性呢？简单回答，给我一 定的补偿，那要多少呢？就是要够多到 让我们愿意放弃那个50块钱的确定收入为 止。


    比如刚才的选择题，我们换个数字：


    第一种选择中，赢了这个游戏有200块 钱，输了没钱拿。


    第二种选择，还是给你50块钱。


    这个时候，很多人就直接转变态度了，会 要第一种选择，因为，这个的期望回报 是100块钱，换句话说，这个多出来的50 块钱的期望回报是吸引我承担风险的 补偿，也就是你
    听到的那个词 ， 叫“风险溢价”（risk premium）。


    我们现在还可以把这个测试接着做下去， 在这个游戏的规则变了，你现在有25% 的概率赢了，在这种情况下，你要我给你 补偿，才愿意来听这个游戏吗？你 的 期望回报是200乘以25%等于50，
    500 比 500 ， 玩 的 人 赢 了 概 率 低 ， 就 要 我 给 补 偿 才 愿 意 玩 。 然 后 你 说 ， 我 不 让 你 参 加 这 个
    游 戏 ， 期 望 的 回 报 一 定 比 50 0 多 ， 你 不 会 放 弃 去 赢 这 500 的 机 会 。 当 概 率 更 低 ， 比 如 10%
    ， 要 我 给 补 偿 才 愿 意 玩 ， 期 望 回 报 是 50 0 0 乘 10% 等 于 500 ， 玩 的 人 赢 了 概 率 低 ， 就 要 我
    给 补 偿 才 愿 意 玩 。


    # 二、“高风险、高回报”的金融逻辑


    刚刚看这个游戏设计下去，最后的结论 就是，当赢球的概率越来越低，你赢球的 金额一定要越来越高，这样才能吸引你参加 游戏。为什么呢？因为风险越大，必有 须有更高的回报来吸引你，否则就没有人
    参与到高风险的游戏里面去了。


    其实你想过这个“高风险、高回报”的逻 辑，放到联系市场是不是完全一样。现在 有两种股票，一种股票的变化非常小 ， 就 是 你 面 临 的 不 确 定 性 比
    较 小 ， 风 险 比 较 小 。 另 一 种 股 票 比 较 大 ， 波 动 就 比 较 大 ， 风 险 就 不 能 性 比 较 大 。 它 们 的 回
    报 也 一 样 ， 你 愿 意 持 有 哪 一 种 股 票 呢 ？ 你 一 定 会 对 那 一 种 波 动 性 不 大 的 股 票 ， 不 对 了 那 一
    种 波 动 性 比 较 大 的 股 票 。 你 预 期 它 未 来 的 回 报 率 就 会 更 高 出 那 一 种 稳 定 的 股 票 ， 你 就 能 会
    意 愿 持 有 了 。


    这就是为什么风险越高的资产，回报率就 必须高，因为如果你没有给它足够高的 回报的话，市场上就会出现一些人去 买 这 些 稳 定 的 股 票 ， 这 也 是
    “ 高 风 险 、 高 回 报 ” 这 句 话 不 是 空 泛 的 ， 而 是 我 们 基 于 人 类 的 基 本 特 征 — 风 险 厌 恶 。'
