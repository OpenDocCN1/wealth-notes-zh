    # ■ 划重点


    +   1.你要记住，平时我们听到的投资其实是两种意义上的投资，一种是宏观层面的生产性投资，一种是微观层面的金融投资。金融市场实际上是把这两者连接起来；

    2.投资决策主要是要考虑三个方面的问题，像大类资产配置和单个资产的选择是“投什么”的问题。每种资产上配置多少资金是“投多少”的问题，而你入场和退场的时机选择就是“何时投”的问题；

    3.投资是无处不在的，因为储蓄和和 投资是等价的。


