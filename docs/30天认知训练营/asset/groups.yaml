    今天的思考题是：你处于一个多大的集体之中，你觉得你身边的这个集体，是需要变小的吗？为什么？


    明天，我们继续认知训练，明天的话题讨论的是，对于一个成功者，什么最难？我提前揭晓答案：下一个成功最难。'
