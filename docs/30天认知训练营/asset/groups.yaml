    ## 10 怎样配置你的人际关系


    10 怎样配置你的人际关系


    今天，关于你的人际关系组合，我想给你一个新思路。


    我们都知道投资需要配置组合，其实人际关系也需要配置组合。就是说你的人际关系要像资产投资一样，要多元化。在具体阐述人生关系组合配置之前，我先说一说投资的配置组合。


    总是有人说要All in这All in那，现在流行的就是All in比特币。我不是对比特币有意见，而是对这种说法有意见。


    如果你懂一点点金融，不是说书上看到过的那种懂，而是要已经成为肌肉反应的那种懂，那么你就知道，说All in的人要么是个傻子，要么是个骗子。


    如果他不懂任何时候都不应该All in，那么他是傻子；如果他懂还这么喊，那么他是骗子。当然，经常是说All in的，人家实际上第一个All out了，全身而退，留下那些跟着All
    in的人和一堆炮灰。


    ### 秘鲁农民的风险理念


    要瑞德·戴蒙德（Jared Diamond），就是那写过著名《枪、细菌和钢铁：人类社会的命运》的著名作家、人类学家，问过一个问题：


    问：秘鲁农民跟哈佛校产基金经理有什么区别？


    答：秘鲁农民理解投资风险，而且投资目标合理。


    哈佛校产基金经理曾是投资界的明星，近十年则是景淡。他们管理300多亿美元的校产基金，按对冲基金的规矩拿管理费和利润分成，集中投资于低流动性资产。过了20年好日子，然后在2008年金融危机中亏掉1/3，之后完全失去方向，在2009年到今天的大牛市中远远落后。


    - 1. 地块越多，则长期平均产量越低。这是坏消息，说明碎地块不利于产出效率，消耗在来回路上的时间也是种浪费。 2. 地块越多，则每年总收成的变动越小。这是好消息，多元化起作用了。
    3. 只种一块地的挨饿几率最大；如果地块数量在十个左右，则挨饿几率下降到接近于零。 4. 实际上，农民种的地块数量比上面这条算出来的理论值还要多出两三块。


    ### 人际关系多元配置


    刚读完《金融的智慧》（The Wisdom of Finance），作者德赛（Mihir A. Desai）是哈佛大学商学院和法学院双料教授。这本书确实是智慧之书，对不同背景的读者都有用：


    普通人学到一些金融思维；业界人士看到理解金融的新视角；专业人士，则重新找到金融的正能量。过去十年来，金融实在造了太多孽，也蒙受了太多骂名。


    ### 找到你的负贝塔关系


    人际关系组合的多元化还有另一个维度。


    继续套用金融组合理论，人际关系组合中有三种关系资产：


    - 一种是高贝塔的，波动剧烈。这些关系为你锦上添花，也为你雪上加霜，或者鲜花着锦，或者树倒猢狲散。 一种是低贝塔的，无论你的朋友圈如何起伏，他们不与其沉浮，总在那里。
    最后一种是负贝塔的，也就是说，你飞黄腾达时他不在，你身处逆境时他出现。


    腾达时他不在，你身处逆境时他出现。


    黄集伟写过一首歌，《朋友》，藏天朔唱的：


    > "朋友啊朋友，你可曾想起了我？

    > 如果你正享受幸福，请你忘记我；

    > 朋友啊朋友，你可曾记起了我？

    > 如果你正承受不幸，请你告诉我。"


    这里面的我，就是典型的负贝塔关系资产。


    在所有关系和所有资产中，负贝塔关系和负贝塔资产最为可贵。这么说吧，如果你现在有个投资组合，如果能找到与它相对的负贝塔资产，也就是跟组合波动方向相反但预期收益一样的资产，那么，理论上你能做到预期收益不变，而风险降到零。


    这是什么意思呢？假设存在这样理想的资产，在一个理想的世界里面，请注意这都有“理想”这样的限定，你可以借无数倍杠杆，借无数的钱，用无数倍杠杆投入到这样一个组合当中去，因为你的风险是零，但是你可以极大地放大你的平均预期收益。


    所以找到负贝塔资产可以说是投资界的圣杯（Holy Grail）。


    这也是为什么我们要珍视人生中的负贝塔关系。很少人有幸能有这样的负贝塔朋友，但几乎所有人都拥有属于自己的负贝塔关系资产，它就是我们的家人：父母、夫妻、儿女。


    他们使我们有了去冒险的勇气，因为无论前途如何，我们总有可恃的方寸之地。


    高贝塔、低贝塔、负贝塔，在金融世界中，我们希望组合各类资产去获得最高的收益风险比；在现实生活里，我们需要在形形色色的人那里正确地分配时间和精力，以获得最充实的人生。


    我们绝不能忘记问自己：关系资产配置得对不对？有没有在高贝塔关系上过多配置？低贝塔关系配够了吗？是否忽略了负贝塔关系？


    苏格拉底说：未经审视的人生，是不值得过的(The unexamined life is not worth living)。审视什么？在这里获得了全新内涵。


    ## —— 本讲小结 ——


    总结一下，今天我们讲的一个认知是，像配置资产一样多元化地配置你的人际关系。灵感的来源是，哈佛大学商学院和法学院的双料教授德赛的书《金融的智慧》。


    我从中获益良多，也推荐你看看。


    ## —— 今日互动 ——


    今天就不留思考题了，不过我希望，有时间你能闭上眼睛想想，你身边的负贝塔关系是什么，珍惜你身边的负贝塔关系。


    明天，我们继续认知训练，明天的话题有点难度，希望你能跟着我一起去挑战，怎么样从海量信息中寻找聚焦点。

