    # 21 误解进化论：你可能是基因的奴隶


    21 误解进化论：你可能是...


    今天我们讨论一个可能重塑你世界观的问题：自然让人进化，是为了让人变得更好吗？


    你可能误解了进化论。


    # 什么是进化论


    之所以讲这个，首先因为进化论是一部洗髓真经，已经彻底改写了生命科学，正在重塑社会科学。生物学、生理学、心理学、人学、社会学、经济学、政治学，乃至医学，除了数理化之外，绝大多数数学科都可以分成两个阶段，一个是进化论改写之前，一个是进化论改写之后。


    几百年来最大的人类思想成就，无论怎么排，进化论不在第一，也一定在前三。其次，进化论系统改造我们作为个体的认知，特别是更深刻地认识随机性，不理解进化论几乎不能叫现代知识人。最后，普通人大多对进化论有想当然的误解。


    就是说，进化论既重要，对它的误解又多。


    先讲什么是进化论。


    满足以下四个条件，进化 (evolution)，或者说自然选择，就会发生。


    第一，个体繁衍复制的成功率有差别。有的后代多，有的后代少。


    第二，个体的性状（traits）有差别。比如，有的个高，有的腿长，有的力量大，有的免疫系统发达，等等等等。


    第三，繁衍复制成功率与性状的差别有相关性。比如，因为个高，因为腿长，因为力大，个体的后代较多。相关性不需要是100%，极而言之只要没低到零就可以。


    第四，性状可遗传。


    这四点就够了。


    今天的世界如此复杂、精密，人们经常赞叹大自然的鬼斧神工，往往觉得这不可能自然而然发生，但事实上就是它确实不需要设计师，只要上面这四条成立就可以：个体繁衍复制的成功率有差别、个体的性状有差别、性状可遗传、性状差别与繁衍复制成功率的差别有关。


    无论何时何地，只要这四个条件成立，自然选择也就是进化，就会发生。这四条加上30多亿年时间，地球上的生命体就演变成了今天这个样子，其他因素全部都是注脚。


    # 对进化论的四个误解


    进化论讲到这里。现在讲误解。


    第一个误解，物种朝着某个方向进化，变得越来越完美。它的潜台词是，人是进化的目的。


    这是错的。进化没有方向。我之所以还用“进化论”这个词，只是尊重历史而已。


    “进化”这个词的英文是evolution，本意是“演化”，拉丁词源是“展开”的意思。它朝哪个方向走都可以，谈不上进与退。人自以为万物恒长，但这个世界展开成今天这样，并不是为了人类而展开的。


    人类自以为是最成功的物种，但是与不是要看你从哪个角度看。你可以说最成功的物种是蚂蚁，因为它的数量远远多过人类；你也可以说南极磷虾比人类成功，它的总重量超过人类总重量。


    第二个误解，自然选择是弱肉强食。潜台词是道德只是遮羞布，不道德才能当赢家。


    这也是错的。一方面，天地不仁。自然选择不考虑公平、正义和任何物种的内心感受，就好比粮食价格不会考虑我家麦田今年的丰收歉收一样。但另一方面，自然选择并不特别偏爱暴力
    projector 和叛卖，它常常选择和平与合作。


    至于哪种情况管用，它无所谓。自然选择既不是不道德的，也不是道德的，它无关道德，是非道德的。


    第三个误解，进化着眼长期。


    怎么说呢？进化本身是长期的，任何适应性都要经过许多代遗传才能发生。但是，进化又是没有计划的，它没有长期眼光，长期对进化来说无非是无数的短期。所有自然选择都发生在当下，下一歩如何选择，选择什么，听从随机性的安排。


    对这一条，搞金融的人理解比较深。我问过一位朋友，“市场长期你怎么看？”这朋友曾经是索罗斯的交易员，现在自己做对冲基金。他说，“我不看长期，只往前看三个月。”我很惊讶，“更长怎么看？”“简单，我总是滚动往前看三个月，不停刷新。”


    这个道理，恐龙如果地下有知，也会理解得比较深刻。再美好的现实，再靠谱的计划，如果明天陨石撞地球，都没用。地球环境灾变，恐龙灭绝，爬行动物受到重大打击，我们哺乳动物才出了头。


    人不是注定要当老大的，出现这个结果很幸运。


    第四个误解有关适者生存。


    物竞天择，适者生存。绝大多数人听到进化论想起的就是这八个字。它也不是错了，就是不准确，因为进化视角里生存的意义在于完成繁衍复制。繁衍复制的成功率包含两个部分，生存和繁衍复制。


    对于基因来说，无论是人还是其他生物，需要你做的就是完成繁衍的功能，完成繁衍之后，继续活着反而浪费粮食。而人的目的是为了健康地活下去。在完成繁衍之后，人的目的和基因的目的发生了分叉、产生了冲突。因为基因不希望动物过了生育年龄还继续活下去。


    近些年兴起的进化医学就是依托在存活与繁衍这两件事的差别之上。为什么各种慢性病，如糖尿病和心血管病越来越多？粗放的解释就是因为进化直接关心繁衍，只是间接关心我们作为载体的存活率。


    我们作为载体犯了两个错，一是现代人活得太长了；二是进化理下各种机制，有利于我们活到繁衍，不利于我们完成繁衍后活得很长，毕竟我们活着对他没什么用了。


    # 你可能是基因的奴隶


    说到这里，我讲个故事。


    夜色降临，有个富可敌国的人打开册子，翻到一页，上面是一个女孩的信息。如果所有条件合适，他会与她同房。如果对方怀孕，他会给对方一笔巨资，足以生活裕如一辈子，让她产下、养大孩子。


    这册子有多少页。


    他不是皇帝，也没有强迫谁，只是比较有钱。你是不是羡慕他的艳福？


    艳福不是他的追求。


    册子上的女孩们不必美貌，长得周正就行，学历要求就严一些，必须出自名校，因为要保证基因优秀。是否同房也不必看他自己当时是否兴趣盎然，因为首先考虑匹配对方的生理周期。


    你觉得他在享受艳福，在他却只是份工作。他用治学的严谨、经商的实用、系统控制的精确，亲力亲为，因为此事只能自己来：他要留下后代，越多越好。他并不是要靠这些后代继承家业，只要那些后代在茫茫人海中一生二二生三，滚雪球下来，那便可以了。


    把财富转换为开枝散叶，做到如此严谨、精确、系统。只不过，他不是自己的主人，他只是基因的一个好奴隶。


    这位精准繁育大量后代的家父可能听说过一个传说：今天多少亚洲人是成吉思汗的后代，又或者有多少中国人源自上古时的三个超级祖先。他不明白，就算是这样，自然选择的对象不是他，也不是那激发出他无穷努力但没有科学内锚的血统。


    这也正是今天要说的第五个误解，自然选择的终极对象不是个体。


    回到我们开始说的进化论四条件：繁衍差异和性状差异相关，并且，性状可遗传，关键就在性状可遗传上。


    性状之所以可遗传，原因是基因，基因是...


    性状之所以可遗传，原因是基因，基因是自然选择的最终对象。“基因”，Gene，出自希腊语，原意为“生”，指携带有遗传信息的DNA序列，是控制性状的基本遗传单位，通过指导蛋白质的合成来表现所携带的遗传信息，从而控制个体的性状表现。


    表面上，自然选择的是大长腿；说到底，自然选择的是制造出大长腿的那一个或一组基因。


    两万多个基因在我们每个人深处，它们才是真正的复制体。我们不可复制，因为我们只是它们的载体。基因不属于我们，我们是基因的工具。


    从人的角度看，人为天地立心，为自然立法，是宇宙的中心，赋予一切以意义；但从基因的角度看，人不过是其自我复制的载体。自我复制是基因唯一的“目的”，对人类福祉的“关心”仅限于其中有利于基因复制的那一部分，两者利益并不完全重合。


    比如，完成繁衍，则人对于基因不再有价值，衰老、死亡接踵而来。人类渴求长生，基因报之以癌症。天地不仁，以万物为刍狗。


    传宗接代本身没有意义，因为传下去的不是我而是基因，我只是它在这一站的躯壳；立功立德立言本身也没有意义，因为传下去的也不是“我”而是meme，这是进化论学者发明出来，与基因相对的概念，是观念、行为在文化中复制传播的最小单位。我只是meme在这一站的拉拉队。


    这些本身没有意义，作为基因和meme的宿主，我盲目听从它们的指示，服务于它们最大限度复制的目标，对我有何意义？


    这一切要有意义，须是在我知道真相之后，自由选择，或者传宗接代，或者不；或者立功立德立言，或者不。不管怎么样，我们都要脱离对于基因的盲从，我们要找的意义不在血缘传递，也不在身前身后名，而在当下的连续的选择与决定的集合之中。我们决定赋予它们以意义，它们才有意义。


    当然，人被基因寄宿太长太久，各种所思所想所作所为，都有可能是基因给我们下的套，包括我们以为的自主选择。当我们知道所有这些有可能是基因给下套之后，仍然“选择”这些所思所想所作所为，哪怕看起来还是一样，也总算是多了一点自由，就是不知道这一层是不是也是基因下了套。


    这就像电影《盗梦空间》（Inception）里的层层梦境，不知道哪一层是梦境，哪一层是现实。我们没有陀螺来揭示答案，说到底，我们都是庄周梦蝶，各梦各的蝶，在各自的梦里寻找属于自己的意义。


    关于进化论的书很多，我推荐理查·道金斯的《自私的基因》（The Selfish Gene），这本书是关于现代进化论的经典科普，一版再版。


    我以前看的是30周年纪念版，最近看到又要出40周年纪念版。原因也很简单，如果你对进化论有上面所说的层层误解，那么这本书对你就既像大炮又像手术刀，一炮轰掉，层层剖开，重塑你的世界观。


    # ——◆ 本讲小结 ◆——


    总结一下，今天的思维训练，我们讲被误解的进化论。


    对于每个人来说，传宗接代本身没有意义，因为传下去的不是我而是基因，我只是它在这一站的躯壳。作为基因和meme的宿主，我盲目听从它们的指示，服务于他们最大限度复制的目标，对我有何意义？


    道金斯的这本《自私的基因》可能会很大程度颠覆你先有的看法，推荐你也看看。


    # ——◆ 今日思考 ◆——


    今天的思考题是，假设你已经洞察了基因的真相，你已经认识到传宗接代本身，对于你作为个体并没有意义，因为传下去的并不是你。你洞察了所有这些真相之后，你仍然爱孩子，你的爱是从何而来的？


    欢迎你把今天的内容分享给你的朋友。明天，我们会讨论的话题是走出民族主义的悖论。


