    在忠诚与背叛之间，每个人与组织自己找位置，一切都是可能的。但是，一个组织想要基业长青，那么在退出与发声之间，不能过度依赖其中一种纠错机制过长时间，要有意识地把另一种纠错机制挖掘出来。对个人来说，要知道有些事情我们无法真正彻底地退出：这是属于社会公共品的东西，我们就越无法从中退出。这种时候，你只能选择发声。


