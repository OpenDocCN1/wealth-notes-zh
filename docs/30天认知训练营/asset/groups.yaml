    也许你觉得外婆假说是胡扯，就算是也没关系，安吉尔只是用它来讲一个道理，进化心理学认为自己说的那种两性关系已写入了基因，那安吉尔告诉你基因写法不止有一种可能，外婆假说是另一种。


