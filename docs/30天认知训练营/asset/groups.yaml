    # 06 怎样才能达到任何目标


    ![](img/d7abd9c8c7e2e50c2fbef2cec40594e4_12_0.png)


    06 怎样才能达到任何目标


    今天我们进入了一个新模块，在这个模块中，我会给你介绍一些你生活、工作 中用得上的技能和工具。


    作为这个模块的第一天，我来给你讲 怎么简单、靠谱、稳定地解决问题，这个套路叫做四步解题法。


    # 波利亚的四步解题法


    第一步，彻底理解决题


    问题既不能太难也不能太简单。你不要迎难而上，主动去找太难的问题，也不要随便遇安专攻自己会做的问题。为确保真正理解问题，你最好把问题用自己的话换成各种形式反复重新表达。


    无论怎么重新表达，别忘了要指出问题的主题：要求解的是什么？已知什么？要满足哪些条件？


    第二步，形成解决思路


    这一步的关键是获得好思路。你过往解决问题的经验、已经掌握的知识，这些是思路的来源。你要问自己：有没有解决过与当前相关的问题？当时用的办法现在能否适用？要不要做以及做哪些调整？


    如果思路始终不肯降临，你就试试改变这个问题各个组件：已知、未知、条件，逐一替换，直到找到与之相似而你又解决过的问题。


    第三步，执行


    获得思路需要掌握知识、良好习惯、专注、还有运气，执行它就相对简单，主要是耐心。要反复提醒自己：每一步都要检查。


    检查有两种，一种是直觉，直觉是问你自己，这一步是不是一眼看去就是对的？一种是证明，证明是问你自己，能不能严格证明这步是对的？两个都有用，但是是两回事。


    第四步，总结


    绝对不能解决完问题就了事，那就会浪费了巩固知识和提升技巧的机会。你再检查一遍论证过程，尝试用另外的方法解题，寻找更明快简捷的方法；还要问，这次的解法能否用来解决其他问题？


    总结是最好的启发时刻。


    上面的四步解题法来自我今天推荐的《怎样解题：数学思维的新方法》（ How to Solve It: A New Aspect of Mathematical
    Method）。它出自大数学家波利亚（G. Polya）之手。在成名之前，波利亚曾经是中学数学老师，学生当中中有冯·诺伊曼。


    波利亚在数论上有诸多成就，但随着时间流逝，最为人们记住的还是这本书，它面向师生，讲如何解数学题。今天数学界最著名的天才人物陶哲轩，小时候曾经用它来准备奥数比赛。


    这本书不仅适用于天才，也适用于常人，总销量过百万册，有十七种语言版本，是有史以来最畅销的数学书。


    我读后有两大感想，一是如果当年我的数学老师用过这本书，我的数学不会像现在这样渣；二是这套四步解题法是普适的。


    波利亚说适用于中学生也适用于大学生，无所谓，只要是学数学就行。我觉得不止。


    # 解决问题的提问清单


    与四步解题法相对应的，有个完整的提问清单。即使你面对的不是数学题而是人生种种难题，四步解题法及问题清单也极有价值。它适用于无数其他情境，帮助每个人寻找各自问题的解决之道，不论它是什么问题。


    +   1. 在理解问题阶段的问题清单是：


    求解什么未知数？已知什么？条件是什么？条件充不充分？但凡能画图，一定 бла画，把条件分解成各个部分，把问题用自己的话重新讲，反复讲。


    +   2. 在构思解题思路阶段的问题清单是：


    以前有没有见过相似或相关问题？以前用过的方法这次能否适用？不相似的地方是否需要引入辅助假设？条件有没有用足？能不能构造比现在更简单一点点的问题，先解决简单的？如果微调已知数、条件，甚至改变求解的未知数，能否找到解题线索？


    +   3. 在执行解题思路阶段的问题清单是：


    每一步都检查过了吗？能看出来这一步是对的吗？能证明这一步是对的吗？


    波利亚认为，这些问题清单：


    +   必须要是系统、自然、明显、符合常识，防止打断形成思路的过程；

    必须反复问，把它内化成肌肉反应；

    必须要有一般性，不仅适用于眼下的 问题，还能用于所有情境；

    必须从一般性问题逐渐引到具体问题，激活思路，再回到一般性问题上来，如此反复迭代。


    这样才能为练习者指出错思考的方向，同时又留下了足够的努力空间。


    波利亚的四步解题法及提问清单应用了启发式(heurisitics)学习法。启发式学习起源于古希腊科学家阿基米德那句著名的 eureka，意思是“找到了”，传承至今。它不保证完美结果，看重实用性，是发现、解决问题并从中学习的经典方法。


    启发式学习，简单但不容易（ simple but not easy），本身不是秘诀，一看就懂，照方抓药绝对管用，却必须狠苦修炼才能有所成。


    # 达里奥的五步成功路径


    达里奥（ Ray Dalio）的成功靠一个非常相似的策略。他28岁创立桥水资本，今天管理1500多亿美元，是近年最成功的对冲基金之一。我在之后会更新的文章《怎样用逻辑和算法，撬动群体智慧》中会介绍他的许多决策法，你如果有兴趣可以期待一下。


    这里介绍他的五步成功路径，跟波利亚四步解题法异曲同工。


    一般说要成功，则天赋、运气、努力缺一 不可，达里奥说不是这样的。


    他认为成功对天赋的要求不高，是人都能得到；运气不过是托辞；成功只取决于努力，而努力这件事讲道理并不难，在乎每个人的选择，就看你选与不选。达里奥说，要达到目标，只需要五步：


    +   第一，设定目标

    第二，发现通向目标的障碍

    第三，诊断问题所在并制定计划

    第四，列出解决问题的任务清单

    第五，坚决执行任务


    然后这五步反复迭代。


    达里奥强调必须分步执行。设定目标就是设定目标，不要去想能不能完成；诊断问题就是诊断问题，不要去想如何解决。


    以上五步，每一步对能力要求是不同的，一般人不可能都具备。怎么应对自己的无知，要比自己已知多少重要很多。


    管理自己的无知，首先要接受自己有短板，然后要想怎么补短板，能学习就学习，更重要的是要保持开放，寻找比你强的人，从他们那里学习。最后，能否达到目标完全是自己的事情，无论环境如何，承担责任的只有自己，没有任何借口。


    设定目标时，不考虑能否达到，有助于使你设定一个真正想得到但目前有可能不敢去想的高远目标。而这又隐含一个信念：你得相信自己能达成任何目标， mechanistic  设定目标时对如何达成毫无头绪。


    达里奥自己是这么想也是这么做的：只要反复迭代前面的五步努力法，无论多么高远的目标，都会迅猛进入你的射程。


    面对无休无止的前路，如何管理自己？要成功，得有两个我。做决策本身是“我”，这些决策决定能否实现自己的目标；“元我”则一直在看着“ 我”，是设计者、监控者、评估者。


    这个身外之我，最重要的，就是对“我”必须要客观。“元我”思维有助于以客观、抽象'
