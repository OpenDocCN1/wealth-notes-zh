    # 15 怎样做到持续成功


    15怎样做到持续成功


    今天我们讲成功，尤其是下一个成功。

    成功égr难，但下一个成功最难。所以成功者注定失败，无论人还是组织，基业长青是偶然。


    下一个成功最难，因为成功指的就是环境选择了的那些成功者，问题是环境会变，而成功者几乎注定跟不上环境变化，他们向以前的环境过度优化。


    先说环境为什么选择某个成功者？从事后看来，总是因为成功者最好地适应了环境。


    # 格鲁夫的原则 Vs 乔布斯的颠覆


    体会一下20年前 озву顶级商业智慧，来自英特尔传奇总裁格鲁夫。在他的名著《只有偏执狂才能生存》中，他说，想要在那个时代出头，必须做到下面三点：


    +   1. 不要追求差异化，不要想着去造“更好电脑”--通往“更好电脑”的路上，处处都是先烈的用户；

    2. 抢跑，抢跑，抢跑，重要的事情说三遍。先发优势至关重要，利润属于且只属于先发者；

    3. 按大规模生产预估产品可行的最低售价，剩下的事情就是把成本降到与之相符，一句话，血拼成本。


    这是那个时代最适应的商业策略。格鲁夫说，在IT企业从纵向一体化向横向整合的战略拐点发生之后，必须依靠上面三个原则才能制胜商场。


    所谓纵向一体化，就是一家公司生产和提供所有的东西，从硬件到软件到服务，都是自有的；所谓横向整合，就是一家公司只生产自己擅长的东西，而整合交给市场。前者的代表是当时的IBM，后者的代表是英特尔和微软，个人电脑黄金时代的Wintel联盟。


    当时，格鲁夫当然是对的。


    他将这三原则用于分析离开苹果的乔布斯：乔布斯犯下了追求差异化的错误、垂直一体化的错误、高成本的错误。


    “毫无疑问，乔布斯是开创个人电脑行业的:first 天才，然而.....”格鲁夫最后作评。


    然而，格鲁夫很快就不对了。


    这本书出版后的第二年，乔布斯回归破产边缘的苹果。苹果从30亿美元到今天逼向万亿美元市值邽商业史诗就此开始。1997年，乔布斯提出口号：Think different，不同凡想。我就是要差异化。从此开始一个一个地证伪格鲁夫原则。


    格鲁夫说，不要差异化；乔布斯不理睬，think different；格鲁夫说，先发吃肉，后发吃灰；乔布斯不理睬，偏爱进熟到烂的市场，进一个，就颠覆一个。


    商业智慧的保鲜期太短。成功者适应环境，但是环境会变，怎么样变无法预知。


    # 成功的悖论与解答


    无论当时还是现在，不论何时何地，只有全力以赴才有成功的可能，这要求你不留任何余地。GE（通用电气公司）当年的6个西格玛管理原则，和今天人们常说的不留后路的创业者才是好创业者，都指向同一个策略：


    思想上要全力以赴，操作上要不留余地。


    做到这些不保证成功，但所有成功者都必须如此。然而，这同时埋下了未来失败的种子：必须尽可能向环境适应，但环境变化的时候就调整不过来。


    换句话说就更明白：如果用数据训练出来的模型向样本数据过度拟合（over fit），则对样本外数据越不适用，也就是对未来没有预测能力。不尽力适应当前环境就无法成功，但过度适应当前环境就必然在环境变化中失败。


    这就是成功的悖论。


    怎么办？


    第一个办法，能不能摆脱环境制约，不是仅仅适应环境，而是反过来影响甚至主导环境？


    # 拆分组织，让成功长出来


    克里斯腾讯森所说的创新者悖论，其实是前面所说成功者悖论在技术变革这一层面的应用，要点如下：


    +   1. 成功公司需向现有客户优化产品和流程，投入于持续型技术，对扰乱型技术没有兴趣，因为客户没有兴趣。

    2. 即使公司负责人重视扰乱型技术也没有用，因为组织紊资源配置是由流程决定的，而流程总会把资源从扰乱型技术这边拿走，放到持续型技术那边，客户要求组织这样做。

    3. 应客户需求优化流程，持续投入持续型技术，是优秀组织的特征，因其能向现有的价值网络优化。失败和迭代学习则是扰乱型技术的本质。优秀公司不能也不应容忍在持续型技术上的失败，因此也很难以接受在扰乱型技术上的失败。'
