    - 1. 「得到」App内就可以找到部分书目的中文版电子书，或“每天听本书”的解读版。以下书单中做了标识，点击书名下方图片，你就可以看到了。

    - 2. 还有部分书目的中文版，「得到」App的电子书和“每天听本书”解读版正在制作中，我们会在这一篇文章中持续更新并标识，让你第一时间就能看到。也欢迎你继续关注。

    - 3. 其余的书目，多数还只有英文版，我在书单中附上了英文书名，你可以通过亚马逊官网：amazon.com直接搜索，找到纸质书或Kindle版。我在书单中附上了英文书的封面图，方便你在查找中确认。

    - 4. 已有中文版的书，我在书单中附上了中文版的封面图，你可以根据书名查找，在市面上找到。


    欢迎你在阅读这些书目的过程中，有任何新的认知、新的感悟，或者是新的疑惑，都可以在留言区留言，我们一起讨论。


    祝你学习愉快，不断精进。


