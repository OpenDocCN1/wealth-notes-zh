    # 19 如果凡事只说Yes，会发生什么？


    19如果凡事只说Yes，会发...


    今天我们来探讨一种人生态度：只说Yes。什么叫只说Yes呢？就是接受一切。说no显得精明，但阻挡了对话展开。让对方充分表达，我们才有收获的可能。


    我是新闻工作者，工作是采访，跟人说话。采访就是录音，录音就要整理，每次重听录音，都是后悔、反省、立志不再重犯，然后下次再犯的过程。后悔、反省、立志，因为听见自己在对话中总是急于说话，往往是在对方马上就要说到关键的时候，插话，打断，对话于是转向，机会流逝而再不回来。


    我之所以总要插话，打断，换着各种花样向对方说“no，未必，不可得，还另有一种思路”，如此种种，无非是要向对方展示：你说的我都听懂了，我这么理解是不是很深刻，我独立思考，不人云亦云，哪里是你说的我也不盲从，我水平就是这么高。


    好记者都有与我相似的经历和后悔。我看到过一个公认的对话能手在朋友圈公开忏悔。我点了赞，跟她隔空握手。记者不是演员，向对方展示自己不是我们的工作，让对方充分展开才是。


    这不光适用于记者。“你说话的时候学不到任何东西。”我在诺贝尔经济学奖得主希勒（Robert Shiller）的课上听到这话，大悟。自己说得再爽，也没有收获，没有获得新东西，自己这点事自己都清楚。


    让对方充分表达，我们才有收获的可能。


    # 无剧本即兴表演：永远对同伴说yes


    《道德经》讲：上善若水，不争，善处其下，以天下之至柔，驰骋天下之至刚。换句话说，水对一切坚硬高大的东西说yes，然后就赢了。


    对话是对方便来的邀请，你说yes就是接受，说no就是阻碍。多说yes少说no，说no显得精明，但阻挡了对话展开。约翰·斯通（Keith Johnstone）说，说no和说yes各有所获，说no的人获得安全感，因为留在自己熟悉的原地；说yes的人才能开启朝向新世界的历险。说no，就还是你自己而已；说yes，对话者才能合并彼此的经历和想象，共同走向未知。


    说出这番话的约翰·斯通是无剧本即兴表演的创始人。读他写的《即兴表演》（Impro）这本书，我意识到表演对人性的体察需要做到如此深刻细密。


    Impro，是improvisation的简称，就是即兴表演。即兴表演没有剧本也无需排练。演员上台，观众现场点题，随便点什么题，演员就展开对话，表演动作，演上一回。


    表演很难，很多人为了不上台什么都做得出来。无剧本即兴表演就更难，我上去必然呆若木鸡。名作家格拉德威尔（Malcolm Gladwell）在畅销书《眨眼之间》（Blink）里说，与其上台即兴表演，绝大多数人宁愿上刀山下火海。


    约翰·斯通则说，无剧本即兴表演这事又没有那么难，诀窍就在永远对同伴说yes，绝不说no。他说什么，你顺着说，他再顺着你说，如是迭放，必有奇遇。


    # 放下禁锢，灵感自然涌现


    举个例子。


    第一个演员演病人，说腿坏了。第二个演员医医生，说得截肢。病人说不行，太痛。这就变成了尬聊，演不下去了。约翰·斯通叫停，重申禁止说no。


    重新来过。


    病人说腿坏了。医生说得截肢。病人说你上次已经截过了呀。医生说那这次是不是你刚安上的木腿生虫了？那也得截。病人一惊把椅子绊倒，顺势说截也来不及了，已经传染给椅子了。


    这就不再是尬聊，已经有了个有趣故事的种子。


    # 关于讲故事的故事


    最后讲个故事，是个关于讲故事的故事。


    来。约翰·斯通说我有个故事，你负责猜就好，我负责回答是与不是。这简单，对方答应，开始猜。


    “故事里有人吗？”


    “没有。”


    “有大楼吗？”


    “有。”


    “有飞机吗？”


    “没有。”


    “有虫子吗？”


    “有。”


    “虫子角色重要吗？”


    “是。”


    “虫子在地下吗？”


    “不是。”


    “虫子住在大楼里吗？”


    “是。”


    “虫子无害吗？”


    “不。”


    “它们会统治世界吗？”


    “会。”


    “它们是慢慢地统治了世界吗？”


    “不是。”


    “大楼是人以前建造的吗？”


    “是。”


    讲到这里，一个科幻惊悚故事已经露出轮廓。它不是约翰·斯通的故事，而是那个以为自己不会讲故事的女演员的故事。只要不用她承担讲故事的责任，她自己就把故事讲出来了。我们每个人都跟她一样。


    先放下，将来再扛起来。


    # —— 本讲小结 ——


    总结一下，今天我们讲了即兴喜剧背后“只说Yes”的理念。这是一种人生态度，当你接受和拥抱变化的时候，令人惊喜意外的情节自己就能涌现出来。


    听到这里，相信你可能想到了，我们在认知训练的第一天，《什么是查理·芒格的人生开关》中说过，人有一个开关是“讨厌不确定性”，要破解这个开关，就需要我们这里的，面对外界和变化，多说Yes。


    今天认知训练的灵感来源，是无剧本即兴表演的创始人约翰·斯通写的一本书《即兴表演》，推荐你去看看。


    # —— 今日思考 ——


    给你留一个互动：你可以试着和你的朋友一起玩一下“Yes，and”这个游戏，看看你们会碰出什么样的火花。


    如果你有一个内向的朋友，也欢迎你把今天的内容分享给他，相信会对他有所启发。


    明天，我们会进入一个新的模块，一起来讨论几个难题，第一个难题是，忠诚是什么，你应该如何选择忠诚的限度，什么时候应该发声，什么时候应该退出。明天见。


    # 用户留言


    # 20 忠诚的限度：何时退出，何时发声


    20 忠诚的限度：何时退出...


    今天的认知训练探讨的问题是忠诚，忠诚是有极限度的，它跟你以为的不一样。


    # 用脚投票 Vs 用手投票


    讲忠诚，要从衰败讲起。成功的时候，时来天地皆同力，狗屎都是经验，谈忠诚无意义，因为没有考验就没有忠诚。只有当衰败来临，运去英雄不自由，经验都变成狗屎，这时才有忠诚可言。


    谈到衰败，任何公司、机构、组织都可能幸免于衰败，区别在于大多数从衰败走向衰亡，只有极少数能够从衰败重新走出来。


    面对组织衰败，个人有两种选择，第一种是用脚投票，退出。第二种是用手投票，也就是举手，发声，要力挽狂澜，重回正轨。


    看起来只是两个选项，但在名著《退出、呼吁与忠诚：对企业、组织和国家衰退的回应》（ Exit, Voice, and Loyalty ）中，赫希曼（ Albert
    Hirschman ）一一展开两者之间所有可能组合，展示了打通经济学与政治学壁垒的分析框架，使之成为20世纪最有影响力的社科著作之一。


    # 退出与发声的不同组合


    退出与发声，经济选择与政治行动，就这样融为一炉。两者之间有无穷多种组合。替代选择的多寡，转换成本的高低，影响你在退出与发声之间作什么组合。


    大体上有这些：


    第一种是极端情况：退出极为方便，完全没有成本，根本不存在限制。


    # 正确选择忠诚


    终于可以讲到忠诚（ loyalty ）。


    忠诚就是人们在面对组织衰败时的一种特殊反应：他们本可以退出但不马上退出，而是先发声。退出对他们本是现成选择，而发声一是会付出成本，二是需要创新思路，提出有效的重振办法，这哪有那么容易？


    优质服务因为内部发声，对质量下降还有制衡。知道这个，你会明白乡村凋敝的内在动力。


    # 第五，忠诚幻灭带来更大的杀伤力。


    个人忠于集体，往往以退出相威胁，以求改变。而如果他们终于失望退出，则不会沉默安静，而会大张旗鼓，杀伤力更大。无论什么品牌，忠粉退出，总是反戈一击。


    个人的退出、发声与忠诚与集体之间的动力学，赫希曼做了杂技般精巧的梳理，最后，他说，没有确定解。个人选择与集体行为之间的一切都是动态的、交互影响的、因人和组织而异。


    在忠诚与背叛之间，每个人与组织自己找位置，一切都是可能的。但是，一个组织想要基业长青，那么在退出与发声之间，不能过度依赖其中一种纠错机制过长时间，要有意识地把另一种纠错机制挖掘出来。对个人来说，要知道有些事情我们无法真正彻底地退出：这是属于社会公共品的东西，我们就越无法从中退出。这种时候，你只能选择发声。


    最后讲几句赫希曼，忠诚于他有特殊的内涵。他少小流亡，终身漂泊，保有初心而不执着于来路，也没有必达的目标，终身找寻一条中间略偏左的道路：在革命与改良之间，在发展与贫富鸿沟之间。


    结果自然是失败。但失败也没有什么了不起的，因为失败是人生恒常。他的人生没有到达，始终在途。他有属于自己的忠诚。


    # —— 本讲小结 ——


    今天我们讨论了忠诚，在忠诚与背叛之间，每个人与组织自己找位置，一切都是可能的。


    对组织来说，要有意识地发掘退出与发声两种纠错机制；对个人来说，要知道有些事情我们无法真正彻底地退出。


    推荐你读赫希曼的这本书《退出、呼吁与忠诚：对企业、组织和国家衰退的回应》。


