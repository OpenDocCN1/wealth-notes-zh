    # 05 为什么你应该读历史


    05 为什么你应该读历史


    今天我们来讨论一个问题，你已经完成了学业，不再需要考试，每天关心的趋势与未来，你为什么还应该读历史。


    我先给你讲个故事。


    几年前，一位美国最大也最成功的对冲基金掌门人到北京，来看一位熟悉的中国领导人，给他带来一本书，《历史的教训》（The Lessons of History,
    by Will & Ariel Durant）。巧合的是，他们早年在大学里学的都是历史，都没有把历史学研究作为自己的职业，但显然都从历史中学到了很多，保持着终身的兴趣，并在各自的领域里走到巅峰。


    一个郑重送书，一个认真读书，这本书显然对他们俩都触动很深，于是很快出了中文本。你不要以为这本书讲的是什么具体的教训，对现实有何映射。这些都没有，只有阅尽三千年世事沉淀出来的智慧。


    书出自杜兰特夫妇之手。杜兰特早年在中学任教，写书介绍古典哲学思想，一举成功，财务自由。与他的学生阿莉尔成婚，共同生活七十年，环游世界，用一辈子写出《世界文明史》这样十一卷本的世界史巨著，晚年拿到美国公民的至高荣誉，总统自由勋章。


    杜兰特夫妇笔耕终身，完成私家世界史之后，才写《历史的教训》这本小书，可以说是《世界文明史》的长篇散文。笔力自由、丰富和健健，阅尽世事后，态度从容、通达和智慧。这样一对单纯的人，过了单纯的一生，写出来的东西如此通透，只能说真是了不起。


    他们不一定懂进化论，肯定不知道什么叫大数据，经济学没学过，数学就别提了，但达到的思想深度和广度，跟全都精通后写出来一样，说明通向智慧的路不止一条，在顶端相通。


    # 你可以从历史中学到什么？


    第一，一切皆有可能，没有什么必然。


    我曾问过耶鲁历史学教授斯莱德：你们历史学家如此熟知历史，能不能更好地预测未来？


    他说，我们熟知历史，所以知道一切都有可能发生，无法直视的黑暗、意料之外的光明。不过，知道这些只能使我们更好地解释现实，并不能使我们更好地预测未来。未来没有什么会必然发生，因为不知道哪只蝴蝶会怎样扇动翅膀。


    熟知历史，使我们知道人这种动物能干出什么事来，使我们对未来更有想象力。普通人要么不够了解历史，要么遗忘了历史，于是失去了对未来的想象力。


    第二，历史不会重复，但总是押韵。


    这句话出自马克·吐温。现在我总算懂得为什么。


    历史不会重复，因为环境始终在变化，自然界和社会不是个封闭系统，一次超级火山爆发会使地球进入小冰河期，人类命运就得拐个弯。地球也不是个封闭系统，甚至地球也不是封闭系统，小行星会撞地球。恐龙灭绝，才有今天人类出头。


    历史总是押韵，是因为相对于我们所知的人类五千年历史，人性不变。


    所谓人性，说过千千万，一言以蔽之就是人乃动物，也是惟一试图超越自身的动物，但不是每只都有可能，且无论谁也不总是如此。


    多少个人试图超越自身，每个人有多少几率超越自身，无从事先确定。我们只是大体知道，最黑暗处会有光明，极光明处黑暗滋生，仿佛在循环，但也只是事后才能确认。


    第三，人是靠不住的，制度也一样。


    所谓人是靠不住的，不光是说人本来就靠不住，誓言只是说说的，这只是浅层。更深层是单一策略解决不了人生难题，必须要用混合策略。一味的善良并不能造就大同世界。一味的自我牺牲性只会将你作为良币驱逐出市场。圣人不死，大盗不止。


    同样地，一味地榨取掠夺也行而不远。《天龙八部》里的四大恶人没有一个有好下场。你得有时宽容，有时严苛；有时忠诚，有时离心；有时为鹰，有时为鸽。至于各占多少，何时做什么，岳飞说，运用之妙，存乎一心。没有答案，看着办。


    所谓制度是靠不住的，是说制度不能保卫自己，保卫制度还要靠人。而刚刚讲了，人是靠不住的。如果人心离散，士气衰竭，道义受疑，再好的制度也会衰朽，直到筋疲力尽，野心家过来轻轻一推，应声而倒。


    罗马帝国衰亡时，它仍然拥有那时世界上最好的制度。


    第四，养成历史感。


    什么叫历史感呢？如果把历史看作根曲线，横坐标是时间，纵坐标是成就。那么，在绝对值坐标的视角中，会以几乎所有成就发生在最近一百年，也许甚至是最近三十年，哪怕只回溯一二百年，那条曲线就仿佛永远在地上爬行。


    这是绝对值坐标视角看到的历史。但是你得学会从相对的眼光来看。因为真实历史上发生的进步，跟这不同。


    每一个老资格的金融投资者都会告诉你，股价不是最后几天才涨到天上的，就如同不是最后一个慢头才能对付饥饿。


    举一个简单的例子，如果一支股票从1块涨到10块，涨幅很小，而从10块涨到100块，涨幅是巨大的。两者不可同日而语。这就像我们前面说的，在历史的绝对值坐标中，你看过去的历史成就，和近几年的历史成就相比，好像可以忽略不计。但是，如果你把股价还原到对数坐标，也就是相对值坐标中，你会发现，这两天的股价表现是一样的，都涨了10倍。


    在对数坐标系里，历史才会显露出“本来面目”，也就是说在历史上活过、挣扎过、死掉的人们在当时所面临束缚下所取得的成就。


    将自己置身于对数坐标系中，你会想，如果你是历史上的他们，处于他们所处的时空，面对他们所面临的现实，你能不能做出更好的选择？


    这就是历史感。历史感在绝对值坐标系中不存在。


    # 回到过去，衡量历史


    我讲一个我亲身观察到的例子，去年我在耶鲁大学的时候，耶鲁大学的师生发起了个抗议。抗议什么呢？当时耶鲁有一个学院叫卡洪学院，卡洪是19世纪著名的政治家，但他当年曾经为蓄奴制度辩护。所以今天耶鲁师生认为，不应该再用卡洪的名字作为学院的名称。


    最后他们获得了成功，这个学院拿掉了卡洪的名字。我很难说耶鲁大学师生们今天的抗议对还是不对，但是我可以很肯定的说，他们在拿一把“绝对的尺子”看历史。


    现代人看历史可以用两把尺子：第一把叫做“绝对的尺子”。用今天的观点，去度量所以过去的人和过去的事。第二把尺子，是回到过去，回到历史人物做当时那件事情的场景中，去衡量我能不能比他们做得好。


    所谓历史感，就是你要多思想，你不能用后面这把尺子。因为如果你总是用今天的标准，来要求历史上的物和事件，你可能会不断地改写历史，直到历史只剩下今天这一段。那么你就失去了历史感，只剩下现代感。


    我很难评价耶鲁大学师生的行为对不对，但是我想提醒他们，对历史感要多一些尊重。


    最后，给大家念一段《历史的教训》：


    > “我们今天所传承的遗产比此前任何时候都更为丰富。它比古代雅典政治家伯里克利的丰富，因为包含了他以后的希腊文化精华；比达芬奇的丰富，因为包含文艺复兴的其他巨匠；比伏尔泰的丰富，因为包含了全部启蒙运动的结晶。

    如果历史有进步可言，那不是因为我们生下来时比前人更健康，更美好，更聪敏，而是因为我们降生于更厚重的遗产之中，被更高的底座托起，以此前的知识和艺术的全部成为基础，随着它上升。

    所谓历史，就是这遗产的创造和记录，而所谓进步，就是它的拓展、保存、传递和发扬。”'
  - '[PAGE 11]


    所谓进步，就是它的拓展、保存、传承和使用。过往不再只是一连串的灾难记录，历史学家也无须悲叹在人类存在中无从找到意义。”


    只有我们自己能赋予历史以意义，如果幸运，我们偶尔还能超越死亡。


    # ——◆ 本讲小结 ◆——


    总结一下，今天的思维训练，我们讲了我们为什么还应该读历史。灵感来自于杜兰特夫妇的书《历史的教训》，这本书不厚，但很值得一看。


    欢迎你把今天的内容分享给跟你一样，希望从历史中学到新知的朋友。明天，我们会讨论的话题是，你能达成任何目标。听起来很动人，其实成功是有套路的，我们明天见。


