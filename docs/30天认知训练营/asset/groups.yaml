    # 08 怎样向哈佛大师学习谈判智慧


    今天的认知训练，我们讲谈判。


    # 谈判不是谈“立场”


    往大里说，人生一切都要谈判，它发生在朋友之间，故人之之间，亦敌亦友之间。你有一个立场，我有一个立场。从立场角度看，谈判有硬有软。


    所谓“软”，就是我把你当朋友，所以既不想针对人又不想针对事，目的是和谐，为此不惜签下不平等的条约。


    所谓“硬”，就是我把你当对手，目的是胜利，只有让你让步没有我让步，既针对人又针对事，施加能施加的一切压力，必须要在意志的较量中胜出。


    硬软两种策略都很常见，往往导向这些结果：


    +   1. 软遇到硬，就是无原则让步，而无原则让步是个滑坡，它不会停在中间哪里，而会一直滑到底。你无原则让步，不会让对方认为你是个好人，只是给对方发出了“这家伙好欺负”的信号，只好把你吃干抹净。


    2. 硬遇到硬，就是天雷钩地火，最好的结果是僵局，常常是事也坏了人也得罪了，彼此只剩下坚强的意志。


    如果只把谈判理解为双方立场之争，你要什么，我要什么，你要得多，我要得少，最后就只剩下硬或软两种选择，互相施压，谁承受不起压力谁吃亏，势均力敌就一起死扛。谈成了也伤感情，谈不成更伤感情。


    所以哈佛谈判大师罗杰·费希尔（Roger Fisher）说，聚焦于立场的谈判是条死胡同，有另外一种谈判法，更体面，更有原则，也更有效。


    他的《谈判力》（Getting to Yes: Negotiating an Agreement Without Giving In）是他主导下的哈佛谈判项目的第一个成果，基于对谈判完全不同的认知，激活完全不同的操作系统。


    谈判不需要是彼此的压力测试和意志之争，它可以变成双方共同寻求互利的合理协议之旅。但是，面对面变成肩并肩，这事不会自然发生，它来自对谈判的系统重构。


    # 四条哈佛谈判术


    第一，谈判不是立场之争，而是利益之争。


    利益是真正的驱动器，特定立场只是利益的特定表达方式。同一个利益可以有多种表达。立场不一致并不一定是利益不兼容，有可能只是双方在利益表达上的想象力不够，又或者是表达不足。


    充分理解各自利益诉求后，双方不必困死在某个特定的选项上。


    比如说，以色列的关键利益是安全，而不是某块占领的土地，坚守占领只是个立场，围绕这个立场的谈判容易走进死胡同，围绕安全利益的谈判空间则广阔得多。


    更何况，利益还有多重。有核心利益，有重要利益，有一般利益。好比一盘棋，核心利益是将帅，重要利益是车马炮，一般利益是兵卒。


    舍卒保车，弃车保帅，困在立场单一维度上会消灭掉这些精彩取舍。好比把一场战争变成一条前线的堡垒战，每一寸进攻都死伤惨重。


    所以，要与对方充分交流沟通，了解对方的利益诉求，通报自己的利益诉求，洞察这些利益诉求背后的原因、机理和排序，才能打开达成一致的选择空间。


    费希尔说，你需要头脑风暴，一切都可想象，甚至应该邀请对手参加头脑风暴，共同想象。


    第二，对事不对人。


    通常如果遇到有人对你说，我这是对事不对人。你要小心，他肯定会既对事又对人。通常所谓对事不对人，当事人的意思是，我有职责在身，接下来我要对你做的种种事情，都是职责所迫，你可别怪我。It''s
    business, nothing personal.


    可以想象，他接下来对你干的肯定不是什么好事。


    费希尔说的对事不对人是真正的对事不对人。双方不是面对面拔河而是肩并肩，在双方多重利益构成的三维迷宫中，寻找共同接受的选择组合。你们确实真诚地欣赏对方在寻找中付出的各种努力，也能真诚地提供帮助。


    第三，寻找差别。


    谈判是取舍，而取舍首先得有差别。无论什么时候，要寻找与对方的差别，有差别才能达成一致，这是个美妙的悖论。


    差别可以是不同利益。你更重视经济利益，他更重视政治利益；你更重视里子，他更重视面子；你更重视物质收益，他更重视意识形态。凡此种种，都是交易的基础。


    差别也可以是不同看法。如果同一件事情双方都完全确认自己是而对方非，表面上看是死结，其实不是，正因为双方都如此自信，所以都会同意将此事交给独立公正的第三方来仲裁，僵局就打破了。


    差别也可以是不同的时间观。你看重将来，他看重现在，你们的贴现率不同，那就用他的将来交换你的现在吧。


    差别也可以是风险态度不同。同一件事同一个风险，但是你和对方的风险承受力不同，报价也就不同，报价差就是交易机会。


    总之，寻找差别，拿你不重视的东西却对方重视的东西，来交换你重视却对方不重视的东西，对方也是一样逻辑。所有东西双方都同样重视，那就真没的谈了。必须是我之蜜糖，你之砒霜，那才最好。


    第四，不要比拼意志，要寻找客观标准。


    好了，双方利益都彼此完全清楚了，互利的交换都已找到并完成了，但总会有一些地方，双方的利益诉求针锋相对。前面讲了，谈判不全是零和游戏，所以立场式谈判是错的，但谈判也不全是正和游戏，它总是正和游戏与零和游戏的复合体。


    正和游戏的空间全部用尽后，还得面对剩下的零和游戏。它就是分蛋糕，你多分我就少分。怎么办？


    首先，就算是到了这一步，也不要比拼意志。拼意志既低效又不会以和平收场，就是走进死胡同而已。


    其次，绝对对压力让步，只对道理让步。压力有硬有软，多种形式：威逼、利诱、诉诸感情和友谊，或者就是死不让步。


    无论面对什么压力，你的反应都该是同样的：拒绝对压力让步，解释自己一方要求合理性，邀请对方解释其要求的合理性，提出合理划分利益的客观标准，强调自己只对道理让步，绝不对压力让步。


    怎么分，你得讲出个我能认同的道理来，讲感情、讲强弱，我不认。


    费希尔说，这个道理必须依据客观标准。所谓客观，指不是由你和对方主观决定的，它来自社会规范、道德、法律、共识，无论来自哪儿，关键在于它是外在的、已有的、大家共同接受的一些原则。


    虽然叫作客观，但它可不止一个，同样有多种可能：


    +   它可以是先例。先例的说服力极强，可以说整个普通法体系就是建立在先例的力量上面。

    它可以是分配标准，见者有份平均分配是一个标准，按贡献分配是另外一个，按需分配又是一个。

    它也可以是分配程序，比如蛋糕他来分你先选。


    谈判的诀窍是在多种客观标准中找到对你有利的那一个。当然，你也要准备好对方找到对他有利的那一个。在有原则的谈判中，双方合作寻找最适合于当下的那个客观标准。


    总之，不能对压力让步，但对于坚持客观标准要坚决，至于在哪个客观标准上达成一致则可以相对灵活。这才是既有原则又和实的谈判术'
