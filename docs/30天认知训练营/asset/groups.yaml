    ## 07 怎样成为合格的写作者


    ![](img/d7abd9c8c7e2e50c2fbef2cec40594e4_14_0.png)


    昨天我们讲了能帮你达成任何目标的套路，今天的认知训练，我们来讨论一套通用的写作工具。减法式写作加多写加多改，肯定能帮你变合格的写作者。


    ## 减法式写作+多写+多改


    管理学宗师德鲁克说，人获取信息分两种，一种是读者，主要靠阅读获取信息；一种是听者，主要靠倾听获取信息。


    在美国总统中，艾森豪威尔是读者，林登·约翰逊是听者。很少有人同时是读者和听者。读、听无所谓高下，不搞配就行。你得知道自己是读者还是听者，相应自我管理。


    这是讲输入一端。我看另一端，输出，也分两种人，一种是作者，一种是讲者。


    同时精通写与讲的人少而又少。即使天才人物如我们以前讲到的20世纪经济学家、政治学大家阿尔西曼（Albert O. Hirschman），也选择从哈佛逃走，跑往普林斯顿高级研究所。


    因为他写作第一流，讲课却是困难，在普林斯顿不用讲课。前不久有朋友对我说，袁慕你会写。我说，袁慕你能讲。


    中国人重视写作，却很少有可用的中文写作指引。我少年时代读过《文心雕龙》《人间词话》，四个字，美轮美奂，可看完还是不懂怎么作文章。


    我获取的写作营养主要来自英文世界的写作指引，从传统经典的《风格的要素》（The Elements of Style），到《经济学人》杂志的写作规范指南，到畅销小说家斯蒂芬·金（Stephen
    King）的《论写作》（On Writing），再到威廉·赞恩（William Zinsser）的《论会写》（On Writing Well）。


    英语世界的文法家们一脉相承，看法相同：


    - 第一，好文章得清楚、简洁、准确；

    - 第二，要把事情讲清楚，所以要多用动词和名词；要少做形容，所以要克制使用形容词与副词；

    - 第三，能用大白话说清楚的事，不要用术语；

    - 第四，能删掉的都删掉；

    - 第五，写作是手艺活，大量训练最重要，要多写；

    - 第六，修改是写作的真正机密，得多改。下笔千言稿马可待，就算有也是天才的事，你可指望不上。


    中国人如我，第一次读到这些，往往顿悟，醍醐灌顶。中国人的写作传统是加法，具体怎么加就没有指南：文章天成妙手偶得，怎么得的不知道；七宝楼台搭手而就，怎么搭的没看过。运用之妙，在乎一心。这类解妙解到毫巅，对凡人没有用。


    写作不应只是天才的事。天才可遇不可求。你没法把普通人变成天才作家，但把他变成合格的作家则是可能的。


    罗丹说把不需要的那些石头全凿掉，剩下的就是雕塑。英文世界的写作建议亦然，别写没用的东西，别写没必要的东西，别写华而不实的东西，如果写了就全删掉，剩下来就是合格文章。


    它有多好，取决于你想说的内容有多好。


    减法式写作+多写+多改，肯定能将你变成合格作者。


    ## 加法式写作与经典文体


    不过，除了减法，谈写作还是不能不谈加法。夫子说，质胜文则野，文胜质则史，得文质彬彬才好。知道不能怎么写之外，你还得知道怎么写好。


    平克（Steven Pinker）新书《风格的感觉》（The Sense of Style：The Thinking Person''s Guide to
    Writing in the 21st Century）就是本专讲加法的写作书，正面讲怎么写。


    平克是美国认知科学家、语言心理学家，一流作者，拿过普利策奖。他认为传统写作指南过于拘泥，已经过时，志在以认知心理学的最新成果，系统重写写作指引。本书书名《风格的感觉》暗战经典《风格的要素》，而副题为“21世纪思考者的写作指南”，则展露雄心。


    英文与中文有别，但人类认知机理则相通，书中大多数学写作建议也适用于中文写作，有普适性。


    > “将网状的思绪，通过树状的句法，用线性的文字展开。”平克一句道尽写作之难，也打开了写作之门。脑海里千头万绪，心中万马齐腾，如何收拢、驯服，化成缜密严谨、错落有致、有理有力有节的文字？


    平克介绍了一种写法，叫作经典文体（classic style）。经典文体有这么几个特点：


    - 第一，以视觉为中心来组织叙述结构。视觉在这里是个比喻。作者之所以有话要写，是因为他“看到了”读者还没看到的东西，于是引导读者的注意力，一路看过去，“历历在目”。作者为读者打开窗口，并不直接把真相喊出来，而是显现出来，让读者自己发现。

    经典文体不是独白也不是宣言，不是作者情绪的宣泄，也不是单方面宣布宇宙真理。它明白却不直白，不会快步就喊你一二三。早起的鸟儿有虫吃，这是直白文体；早起的鸟儿有虫吃，但迟到的老鼠才吃得上饱饭。这才是经典文体。

    作者写到这里，读者看到这里，隔着时空相视一笑，悠然心会。

