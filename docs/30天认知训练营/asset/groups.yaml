    # 24 社会心理 | 关于女性，男人什么都不懂


    24社会心理 | 关于女性，男...


    今天的思想训练讲女性。男人应该来偷窥一下，了解对你而言最重要的人，不然你什么都不懂。


    # 进化心理学对女性的误解


    > “一切都与性有关，惟独性与性无关，性只关乎权力。”


    美剧《纸牌屋》里，凯文·史派西饰演下木总统，强迫女记者性交易，然后面对镜头发，洋洋得意地说出这段对白，给人留下极深印象。当时不知道史派西是本色演出，今天已知更觉惊悚。


    假戏真做已成往事。史派西过去几十年来性骚扰史曝光，立即被经纪人、电影公司抛弃，所有合约作废，一夜之间孤家寡人，山穷水尽。


    > “站出来运动（come forward）席卷美国。从好莱坞到硅谷，从体育场到国会山，从西岸到东岸，女性站出来指证那些性骚扰犯，绝大多数应声而倒，相继演出道歉——忏悔——治疗三件套。没有用，这场革命激荡历史，扬出沉渣，不放过一个坏人。


    还在竞选总统期间，传出特朗普十余年前跟电视台主持人私下交流猎艳心得。特朗普说，不管什么女人都直接上手，我是名人，就可以这么干。那时，特朗普是纽约房地产商、真人秀《学徒》主角。


    搞不好特朗普看过一些进化心理学的读本。在两性关系上，进化心理学大体上是这么看法的：


    +   第一，男人在性上更放纵；

    第二，女性在性上对稳定关系更感兴趣；

    第三，女性天然地被地位高、有资源的男性吸引；

    第四，男性天然被年轻美丽的女性吸引；

    第五，这些在很久很久以前就写入了人类的基因，过去现在和将来都不会改变。


    特朗普肯定认为这些说法太对了。


    这些总结也是《女性：一部私密地理学》（Woman: An Intimate Geography）一书中树好的靶子。作者安吉尔（Natalie Angier）是普利策奖得主、《纽约时报》科学记者。她在前言里说，这本书由女性写，写女性，写给女性。


    我作为一个男的读这本书，感觉是在“偷窥”。为什么要这么干呢？


    因为女人太重要：男人都有父母儿女，概率上总是一半一半，但伴侣几乎肯定是女人。女人在男人的生态系统中占多数，而男人对于女人的了解水平，正如女人耶哥蔼特在《权力的游戏》中这样告诉男人困惑，“你什么都不懂。”


    # 男权社会与“外婆假说”


    对最重要的人知道得最少，可以从“偷窥”开始改变，你能从中学到什么？


    第一，如果一定要问男性女性谁是第一性，那答案不是男性。


    说谁造谁不科学，但如果一定要说谁造谁的话，不是亚当造夏娃，而是夏娃造亚当。有些物种没有男角，但没有哪个物种没有女角。就人来说，胎儿到第九周分男女，此前默认都按女性身体来造，要到第九周前后，看有没有收到雄激素带来的信息再决定接下来怎么造。


    如果没收到，那就继续按女性身体造下去；只有收到雄激素信息，才在这具身体上刻划出男性的器官。也就是说，默认是制造女性身体，而制造男性身体则需要被激活。


    书中讲到一个例子，当事人以为自己是女人，但没有子宫卵巢，检查发现有Y染色体。这说明从基因角度看本来应该是男人，但其没有被雄激素激活，系统按照稳定程序制造出女性身体。一切真相大白，她获得了自由：做男人还是做女人？自己选。她选择做女人。


    第二，标准版进化心理学刻划的那种男女关系学，说到底也只是一种男性中心看法而已。


    男人��性上更放纵，女性更看重稳定关系，女性天然地被地位高有资源的男性吸引，男性天然地被年轻美丽的女性吸引，这些进化心理学的基本看法，都来自它对两性生育策略的理解：孩子总是要由母亲生育，男性女性的投入差别很大，男的一夜风流，女的怀孕十月。


    所以，男性的占优策略是广种，女性的占优策略是优选。人类从婴儿到成年的周期又特别之长，女性必须特别在意男方是否有意愿有能力共同养育后代。天长日久，这些偏好演化中就写入了基因。


    听起来很有道理是吧？只是它们不一定对。


    安吉尔反问：如果男性天生更放荡，为什么社会严防死守视为大敌的永远首先是女性放荡？


    答案摆在眼前，因为男权社会。


    再说女性普遍倾向于往上嫁，这是事实，但原因是刻在基因里，还 adheres in 不成文的社会现实中？基因怎么刻的谁也看不见，现实就很明白：男人只占总人口的50%，却拥有75%到90%的财富；再看各级领导有多少男性多少女性。


    现实有个明白白的答案，在这个答案前背过身去，去猜猜基因写下的安排，是真不懂得，还是装不懂？


    安吉尔继续讲，在男权固化的社会中，即使聰明能干完全可以独立自强的女性也倾向于往上嫁，正因为她们预见到男人脆弱的自尊心不能接受得媳比方少，为了家庭和睦，她们也只好往上嫁。


    说到底，基因怎么写是我们谁都不知道，基因之外，“外婆假说”同样说得通。


    安吉尔引用“外婆假说”认为，就算养育后代这件事，在占人类历史绝大多数时间的狩猎采集时代，男人的作用相当有限。


    首先，不靠他养活一大家子。狩猎采集社会里，男人的工作是狩猎，结果并不稳定，成功了打打牙祭，不成功就得靠女人采集果实为生。安吉尔引用的研究称女性采集占到了狩猎采集部落绝大多数的卡路里来源。


    其次，养孩子一样主要靠女人相互帮衬，特别是依赖年长有经验的女性，首先是孕妇的母亲，这就是外婆假说的核心：在年长女性的协调下，女人帮助女人，不用依赖男人，既养得下来，还养得大孩子。


    也许你觉得外婆假说是胡扯，就算是也没关系，安吉尔只是用它来讲一个道理，进化心理学认为自己说的那种两性关系已写入了基因，那安吉尔告诉你基因写法不止有一种可能，外婆假说是另一种。


    家庭的组织，婚姻的由来，这些问题都还是谜，安吉尔不是假装知道答案，但她建议谁也别假装知道答案。安吉尔只相信一点，现实中的两性关系不一定是进化注定的，完全可以是来自社会安排。既然是社会安排的，那就是可以变革的。


    可以说，今天站出来指证性骚扰运动席卷美国，正是变革的集中爆发。我祝愿它能走得更远。


    # 警惕环境对性别归类


    安吉尔的宣言，被两个少壮派实验经济学家发现并从侧面印证。在《为什么：日常生活中隐藏动机与未被发现的经济学》（The Why Axis: Hidden Motives
    and the Undiscovered Economics of Everyday Life）一书中，尼兹（Uri Gneezy）和李斯特（John List）发现：


    即使在美国这样的开放社会里，与男性相比而言，女性倾向于回避竞争，而这又往往导向收入偏低，机会偏少，上升空间偏小。这些是事实，他们想知道它是天生的还是受社会影响。


    他们选了两个部族。一个在坦桑尼亚，是极度的男权社会；一个在印度，是顽强ूपी存在的母系社会。前者女性毫无地位，问一个男人有几个孩子，他只算儿子不算女儿。后者不然，家长是女性，遗产给女儿，女儿不出嫁，女婿上门，经济权掌握在女性手中。


