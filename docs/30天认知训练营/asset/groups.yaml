    \n- 1. 因为黄种人、白人、黑人，外表区别一眼睛可见。\n- 2. 因为基于种族的观念深入人心，物以类聚，人以群分；\n- 3. 还因为这些观念太容易被政治动机所劫持：用来给人分类，在政治上总是ISO有有用，非我族类，其心必异。\n\
    \n## 何为种族与种族主义\n\n首先，什么是种族主义？什么是种族？\n\n种族主义主要是有两点：一是人分种族，二是种族之间有优劣。有些种族注定高贵，有些种族注定低贱。高贵种族的智商、道德、守法程度、寿命、社会凝聚力、家庭和谐程度、敬业精神，乃至胸容量全面胜过低等种族。\n\
    \n种族（race）则是个生物学概念。讲种族，要先从物种讲起。\n\n大猩猩是个物种，人也是个物种，全世界今天大约有3000万个物种，物种之间有清楚边界，有个最直观的标准，如果交配能产生后代，后代有繁殖能力，那么就属于一个物种。\n\
    \n在生物学家和人类学家不反对在社会学、经济学、政治学这些学科中继续使用人种、种族概念，因为它对应着社会现实，但是要求在生物学和人类学研究中把这个词去掉。在科学的意义上，种族不存在。\n\
    \n他们推荐用世系（ancestry）来代替种族。两个词的区别在于，追溯世系，讲的总是每个个体的世系、溯源、传承都不同，要尊重并识别这些差异，不要让它们被种族的伪标签遮住。\n\
    \n就这样，科学家把种族主义的梯子给抽掉了。人群与人群的差别，来自环境、历史、社会、文化、政治，而这些都是可以改变的，经常是应该改变的。\n\n卢瑟福这本《我们人类的基因：全人类的历史与未来》很值得一读。他是生物学家，又在《自然》杂志做过十年编辑。这本书是本分子人类学科普，文字极好，概念解释得非常清楚，解了我很多惑。\n\
