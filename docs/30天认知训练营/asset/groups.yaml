    ## 25 基因编辑 | 基因能定制，会有多恐怖？


    今天的思维训练我开个脑洞：如果有你掌握了基因编辑技术，人类可能会因此灭绝吗？今天我就想给你讲基因编辑术。


    什么叫基因编辑术？就是新的技术能够重新编辑基因，能够找到相应的基因进行删除，甚至改写基因，这在以前是不可能想象的事情。


    它来自我今天想推荐的这本书，《创造的裂缝：基因编辑与不可想象的控制进化的力量》（A Crack in Creation: Gene Editing and
    the Unthinkable Power to Control Evolution），作者杜纳德（Jennifer A. Doudna）是美国加州伯克利大学生物化学教授，近年来革命性的基因编辑技术CRISPR-Cas9方法首要发明人。


    ## 制造物种大杀器


    这项研究于2012年8月在《科学》杂志上发表论文，立即被认为获得诺奖只是时间问题。全世界生物科学家就像得到了新玩具的小朋友，刚刚5年过去，就已经发表了无数用这项技术取得的成果。


    - 有人想用它复活猛犸象；

    - 有人用它来治白血病；

    - 有人想在出生之前就治好胎儿的遗传缺陷；

    - 有人想更进一步，制造完美婴儿。


    一个比一个异想天开，却又都已经进入视野。


    我接下来教你用它制作物种大杀器，毁灭物种的武器。你需要懂得这几样东西：


    第一，有一类基因非常“自私”。

    本来说上一代的特定基因各有五成几率传给后代，但有一类基因比较特殊，它不定能为后代带来什么好处，但几乎百分百能传下去。科学家们不知道怎么说它好，称之为“自私”基因。


    ## 如何理解基因编辑术


    它分为两部分，这两部分合起来就是这套基因编辑技术的名字CRISPR-Cas9。


    似基因序列上反复打靶，直到找到脱靶风险最小的选择；


    三是工具主义的，就是改进导航工具增加精度；


    四是打补丁主义的，因为剂量越大则脱靶风险越大，那就控制好剂量等等。


    总之，慢慢来。


    ## 控制进化的力量


    基因编辑技术与读懂基因组天书这两件事并非彼此孤立。读懂天书，基因编辑技术才有地方施其巧，而基因编辑技术也能反过来帮助我们解开天书。它的毁灭潜能与创造力，都在于接下来人们的选择。


    回过头来讲讲刚开始提到的科学家们的狂野计划。


    第一个，复活猛犸象。


    哈佛大学一个团队已经完成对两只猛犸象的完整基因测序。他们把猛犸象的基因组与其现代近亲亚洲象的基因组作穷尽比对，发现共有1668个基因差别，大多与温度习性、皮肤、毛发和脂肪有关——猛犸象生活在冰天雪地，亚洲象生活在南亚。


    他们已经用基因编辑技术将其中16个基因的亚洲象版本替换成了猛犸象版本，理论上可以把所有1668个基因都替换成猛犸象版本，用今天的亚洲象来复活灭绝于数万年前的猛犸象。


    侏罗纪公园不是梦。


    第二个，战胜癌症。


    基因编辑技术在攻克癌症这件事上是辅助角色，现在有两个路径。


    首先是帮助精准确定致癌病变的基因突变。把癌症病变与特定的基因突变挂钩这件事很难，大多数癌症的基因机理现在还是盲人摸象，而基因编辑可以帮助我们摸得更快点。过去靠漫长的实验室试错，现在可以简单得多。


    已经有研究团队编辑出疑似与急性白血病相关的多种基因突变，注射到不同的小白鼠身上，观察哪个得了急性白血病，结果一目了然，精度、速度都提高很多。


    还有就是协助免疫疗法。与传统的化疗、放疗、手术不同，免疫疗法不直接杀灭癌细胞，而是激发我们的免疫系统来打击癌细胞，征用的生力军叫作T细胞。免疫疗法的关键就是让T细胞识别并打击癌细胞，理想的情况是患者得哪种癌症，就针对性地定制T细胞来打击它。


    定制这件事，就轮到基因编辑登场了。用它把普通T细胞用来识别癌细胞的受体敲出，置入针对特定癌症的受体，相当于给T细胞装上了自动对标的巡航导弹。这个方法已经有临床成功的病例。


    杜纳德比较乐观，她认为往前走不用很久，癌症的免疫疗法就有可能进入普通的药房。


    第三个，制造完美婴儿。


    既然有可能用基因编辑来治病，那就一定会有人会想能不能用它来制造完美婴儿。既然有人努力在婴儿的胚胎期就纠正其遗传缺陷，那就一定会有人努力为其置入超级能力属性。


    天赋这件事，过去是自然母亲的安排，现在已经看到普罗米修斯盏火的身影。有人已经在构思这件事的商业前景，但应该不应该做这件事，依然是个至关重要的问题：


    人类应不应该人为地永久性地改变人类自己的基因组？


    只有实践能给出答案。


    ## —— ◆ 本讲小结 ◆ ——


    总结一下，我们今天的思想训练给你介绍了最新的基因编辑技术，相信你对他的原理有所了解。可以想象的是，这门即将成熟的技术会给人类的社会伦理代理很多挑战。


    如果你希望更深入了解基因编辑技术，我给你推荐的这本书杜纳德的这本书《创造的裂缝：基因编辑与不可想象的控制进化的力量》。


    ## —— ◆ 今日思考 ◆ ——


    今天留给你的思考题是，你赞同人类制造完美婴儿吗？为什么？


    欢迎你在留言区写下你的观点和我分享。欢迎你把今天的认知训练，用阅读红包的形式分享给你的朋友，让他跟你一起认知升级。


    我们明天的认知升级是，人类分种族这件事，其实不存在。

