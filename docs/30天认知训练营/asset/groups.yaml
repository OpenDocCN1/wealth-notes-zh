  mdcn: "\n# 26 看见人类 | 种族不存在\n\n26看见人类 | 种族不存在\n\n今天的认知训练，我们来打翻一个认知：种族。现在人们所说的人类“种族”，其实根本不存在。\n\
    \n## 种族不存在\n\n所谓种族（race）不存在，不是指种族主义不存在。种族主义不仅健在，而且在走下坡路几十年后，近来似乎开始走上坡路。种族不存在，指的是不存在生物学意义上的种族。种族是文化、历史和政治的构造，早已有之，至今健在。\n\
    \n你想搞种族主义，我暂时拿你没什么办法，但你不要说这样做有什么科学依据。\n\n因为就是没有科学依据。\n\n在生物学家、人类学家群体中，种族不存在早已是共识。近70年前，联合国教科文组织就发表声明，强调人类属于同一物种，所谓人类的不同种族不是生物学上的事实，只是个迷思（myth）。\n\
    \n- 1. 因为黄种人、白人、黑人，外表区别一眼睛可见。\n- 2. 因为基于种族的观念深入人心，物以类聚，人以群分；\n- 3. 还因为这些观念太容易被政治动机所劫持：用来给人分类，在政治上总是ISO有有用，非我族类，其心必异。\n\
    \n## 何为种族与种族主义\n\n首先，什么是种族主义？什么是种族？\n\n种族主义主要是有两点：一是人分种族，二是种族之间有优劣。有些种族注定高贵，有些种族注定低贱。高贵种族的智商、道德、守法程度、寿命、社会凝聚力、家庭和谐程度、敬业精神，乃至胸容量全面胜过低等种族。\n\
    \n种族（race）则是个生物学概念。讲种族，要先从物种讲起。\n\n大猩猩是个物种，人也是个物种，全世界今天大约有3000万个物种，物种之间有清楚边界，有个最直观的标准，如果交配能产生后代，后代有繁殖能力，那么就属于一个物种。\n\
    \n在生物学家和人类学家不反对在社会学、经济学、政治学这些学科中继续使用人种、种族概念，因为它对应着社会现实，但是要求在生物学和人类学研究中把这个词去掉。在科学的意义上，种族不存在。\n\
    \n他们推荐用世系（ancestry）来代替种族。两个词的区别在于，追溯世系，讲的总是每个个体的世系、溯源、传承都不同，要尊重并识别这些差异，不要让它们被种族的伪标签遮住。\n\
    \n就这样，科学家把种族主义的梯子给抽掉了。人群与人群的差别，来自环境、历史、社会、文化、政治，而这些都是可以改变的，经常是应该改变的。\n\n卢瑟福这本《我们人类的基因：全人类的历史与未来》很值得一读。他是生物学家，又在《自然》杂志做过十年编辑。这本书是本分子人类学科普，文字极好，概念解释得非常清楚，解了我很多惑。\n\
    \n除上面讲的种族不存在之外，还有比如用基因检测确定的最早历史人物是谁？又比如为什么说欧洲人全都是查理曼大帝的后代，而亚洲人全都是成吉思汗的后代？答案出人意料，你自己去读。\n\
    \n## ——◆ 本讲小结 ◆——\n\n我们来总结一下，今天的认知训练我给你讲了个颠覆的观点，我们通常认为人类分种族，其实种族是不存在的。\n\n生物学家和人类学家不反对在社会学、经济学、政治学这些学科中继续使用人种、种族概念，但是要求在生物学和人类学研究中把这个词去掉。在科学的意义上，种族不存在。\n\
    \n## ——◆ 今日思考 ◆——\n\n今天给你留一个思考题：如果越来越多的人都意识到，在科学的意义上说，种族不存在，这会对种族主义造成比较大的打击吗？\n\
    \n欢迎你把今天的内容也荐给朋友，明天我们的认知训练我想给你讲：你可以随机发点疯。\n\n# 27 博弈策略 | 策略性发疯\n\n今天从一个博弈情节讲起，叫“Game\
    \ of chicken”。\n\n## 马路上的“傻夫游戏”\n\n在中国各大城市的马路上，时时刻刻都在上演着这一幕：你在车道上好好的开着，旁边车道上又有车硬要挤进来。你让还是不让？\n\
    \n你当然不想让，但他既然干得出硬挤这事，当然也不想撤回去。让谁谁输。\n\n这就是傻夫游戏。\n\n最好是你不拐弯，对手拐弯，你是英雄，只有光荣，没有损伤；\n\
    \n## 谁比谁更疯狂\n\n博弈论大家、诺贝尔奖得主纳什给你出主意：你抢先把方向盘拆下来，扔出窗外。\n\n傻夫游戏极为常见。\n——公路上别的车坚决要挤进来，你的车坚决不让道，这就是个傻夫游戏。\n\
    \n如果双方不约而同，同时扔掉方向盘，同时扔出来，那就是灾难。眼睁睁看着两车对撞，不死即伤。\n\n## 混合策略：偶尔发点疯\n\n傻夫游戏不仅在国家之间上演，在生活中更是无处不在。但凡狭路相逢勇者胜的时候，就有傻夫游戏的影子，但这个世界并没有因此变成疯子的天下，因为正常人还有一个逃生通道：随机发疯。\n\
    \n大体正常、随机疯狂，这件事博弈论上有一个术语，叫做混合策略。你不能不发疯，那样会被疯子吃死；你不能总发疯，天天对对碰，世界很快毁灭；你得偶尔疯一次。\n\
    \n## 帆船竞赛：必胜的策略\n\n今天一路讲下来，我们更明白，一致性崇拜不仅错在会导向哲学上的悖谬，还在于它不懂得现实中随机的价值：随机发疯是我们免于被疯子统治的唯一办法。\n\
    \n真正的智者拥抱混合策略。正如《了不起的盖茨比》作者菲茨杰拉德所说：“同时保有全然相反的两种观念，还能正常行事，是第一流智慧的标志。”\n\n到了荐书时间。\n\
    \n每个人都需要懂点博弈论。许多现实难题对应于博弈论的经典情境。在生活中识别出这些情境，我们便知道下一步选择的方向。\n\n比如这是零和博弈还是非零和博弈？这是猎鹿博弈还是囚徒博弈？等等。相应地，你知道该选择单一策略还是混合策略，合作还是背叛；决定什么情境下要发信号，什么情境下不能发信号，什么情境下要相信对方的信号？\n\
    \n博弈论的书多得要命，如果你悟性好随便哪本都好，了解博弈论这件事比通过读哪本书来了解它重要得多。我给你的推荐是《策略的艺术：在生意与生活中获得成功的博弈论专家指南》（The\
    \ Art of Strategy: A Game Theorist's Guide to Success in Business and Life）。\n\
    \n两位作者当中，迪克西特（Avinash K. Dixit）是著名经济学家、普林斯顿经济学教授，近年来被认为是诺贝尔奖的强有力竞争者。另一位作者是巴里·纳里巴夫（Barry\
    \ Nalebuff）。读过我的得到专栏《王烁·大学·问》的朋友对他应该很熟，他是耶鲁大学商学院教授，博弈论专家，连续创业者，谈判高手，活学活用博弈论的人精，有兴趣去读专栏里的极简谈判课系列，保证有收获。\n\
    \n当年一翻开这本书，我就看到个案例，恍然大悟。\n\n案例是这样的：帆船赛，风向多变，一船领先，一船紧追。请你给领先者设计一个必胜的策略。\n\n答案是：模仿，无耻的模仿。\n\
    \n无论风往哪个方向吹，无论紧追一方采用什么战术，如何变换，领先者只需要如法炮制，亦步亦趋。这个战术本身好也罢坏也罢，不重要，重要的是双方差距不会缩小。赢多少无所谓，赢就行。\n\
    \n我瞬间明白。当时，我们团队离开原来的平台，在新平台上重新出发，遭遇个苦恼：无论我们做什么，用什么方式做，都毫无悬念地被对方复制过去，原样再现。这个案例揭示了其打法逻辑。\n\
    \n这打法与有几年无论出现什么互联网新业务新技术，腾讯都要照样做一份是一样的：你做什么我做什么，然后用我的某个既有优势压住你。\n\n假如世界上只有两家竞争者，这确实是个有效的策略。\n\
    \n还好不是。\n\n读这本书，你会有许多我这样的开悟时刻。\n\n## ——◆ 本讲小结 ◆——\n\n总结一下，今天我们讲了博弈论中的混合策略，以及它在生活中的延伸应用。前提是你需克服对一致性的崇拜。\n\
    \n每个人都需要懂点博弈论，今天思维训练的灵感来源是《策略的艺术》。\n\n## ——◆ 今日思考 ◆——\n\n今天给你留的思考题是：你在什么情况下曾经策略性地发过疯？\n\
    \n欢迎交流你的体验，在文稿下方留言区留言。\n\n明天我们要讲的，还是博弈论中的内容，我们一起来看看，为什么赢家会选择不报复。\n\n# 28 超级合作\
    \ | 赢家不报复\n\n![](img/d7abd9c8c7e2e50c2fbef2cec40594e4_56_0.png)\n\n28 超级合作 | 赢家不报复\n\
    \n今天我们来谈谈人生赢家们的一种思维方式：选择合作，不选择报复。为什么会这样呢？我先来给你讲一个发生在身边的故事。\n\n## 报复是人类的随机算法\n\n\
    曾经遇到一位众人眼中典型的人生赢家，高考状元出身，上完哈佛商学院，做投资，儿女满堂。我提到当时一宗突破各种限制的激烈商战。他说，有钱人不打架。我说，都打成这样了，你还说不打架。他说，假打，会和谈。千金之子，坐不垂堂。有钱人不打架，因为风险太大。我问，多少钱算有钱。那是几年前，他说，1亿美金起。\n\
    \n事实发展不符合他的预期，那起商战双方都没收住手，无下限打到最后；他也全错，因为最后结果是一家惨败，一家惨胜，两败俱伤。\n\n确实何必。\n\n他说的不\
    \ 是惊天动地的道理，常识叫作和气生财。但是，许多时候，我们就是想让对手付出代价，不惜自己也付出代价，这就导致恶性循环。\n\n霍元甲说，冤冤相报何时了。这道理谁都懂，就是多半做不到。\n\
    \n讲明白什么是报复，要从讲明白什么是合作开始。\n\n想象一个事业，4个伙伴，一起凑钱，共享收益。\n\n第一轮，4个人每人放8块钱到存钱罐里，收益率为50%，平均分配，每个人连本带利拿到12块。\n\
    \n第二轮，有个聪明人发现，没人知道自己出没出钱。他这次没往存钱罐里塞钱，实际出钱的只有3个人，这次还是50%收益，连本带利36块，还是4个人平均分配，每个人拿回9块。出钱的人吃亏，但是没出钱的人赚大了。\n\
    \n第三轮，谁都不是傻子，看总金额不对，知道有人作弊，就是不知道是谁作弊。别人作弊，自己怎么办？理性计算便发现：第一，确实是作弊划算，第二，既然自己能发现，那么大家都能发现有人作弊而且作弊划算，于是大家都会作弊，所以自己也只能作弊，不作弊就是傻子。\n\
    \n于是，这次存钱罐里一块钱也没有，收益率再高，收益也是零，游戏结束。\n\n一个事业从很有希望到无可救药，只需要三轮。这个循环发生过太多次。故事有两种策略。第一种是合作，就是每个人都付出成本，让别人获得收益，同时自己也获益；第二种是作弊，就是不付成本，光拿收益。对每个人来说作弊几乎总是比合作划算，于是蛋糕很快消失，因为没人继续做蛋糕了。\n\
    \n怎么拯救蛋糕？\n\n这时需要报复出场。有人说，往游戏里加入第三种策略，报复。所谓报复，就是宁可自己付代价，也要作弊的人付出更大的代价。\n\n我们对报复这件事很熟悉。复仇既是最古老的人类情感，又是戏剧的永恒主角。对欺骗、背叛，对社会不公，对来自权势的凌辱，谁不曾想过报复？不过，报复对每个人来说似乎都是不理性的，因为其最好结果无非是对对手失去更多，而自己得不到什么。\n\
    \n无数讲道理分子视角功效过，报复成功又如何？大仇得报，接不下来便是无尽空虚。但是，如果从上帝视角看，报复对于全社会来说似乎却是理性的。如果不是有布衣之怒血溅五尺，君王怎么可能偶尔低下高贵的头？\n\
    \n报复是进化给予人类埋下的随机算法，有一定随机性地给个人选择报复，以暴易暴，这些人等于是自费做公益，但社会就维住了底线。仗义每多屠狗辈，社会总在呼唤大侠，大侠的下场总是悲剧。这些看似矛盾的事情，都是环环相扣的。\n\
    \n## 赢家选择不报复\n\n有人做实验验证了这一点。跟前面的凑钱发财游戏相似，在对照组只有合作、作弊两种策略，在实验组另外增加了报复策略：参加者可以选择自己出钱让作弊者亏更多的钱。\n\
    \n实验进行多轮，但每轮相对独立，参加者可以知道上一轮的作弊者是谁，但每过两轮重新洗牌，从头开始。结果发现，对照组中不能报复，所有人很快都选择作弊，游戏结束。但实验组不然，有九成的参加者至少报复过一次，其中有一成报复过十次以上，结果是游戏还能继续，没有因为作弊泛滥而崩塌。\n\
    \n外推开去就是说，因为有报复作弊者的威慑，所以社会还能存在。\n\n话是这样说，在不同社会中报复的作用完全不同。有人在全球不同国家的16个城市做类似实验，其中包括发达经济和发展中经济，也囊括了东西方，结果差异极大。\n\
    \n在美国、英国和瑞士的城市里，如果作弊者被玩家报复，往往汲取教训，停止作弊，选择合作。在这些国家中，对于维持游戏，让大家玩下去，增加总收益，报复是有好处的。\n\
    \n但在另一些国家的城市里，如希腊、俄罗斯，作弊者被玩家报复后，往往选择报复，进入冤冤相报的恶性循环。由于实验的设定是玩家匿名，这些作弊者并不知道谁报复了他，无法针对性地反报复，结果就选择“报复社会”，特地挑那些合作型玩家来报复。\n\
    \n你不让我爽，我就让所有人都不爽。游戏很快崩塌。\n\n作弊者被报复以后是从良还是变本加厉，与其所在社会的法治程度和公民社会发展高度相关。法治到位、民间凝聚力高的社会，作弊者在被报复后从良的比例高，反之则报复社会的比例高。\n\
    \n总结一下，如果要报复作弊者，那么你先得付出成本，但能否创造出公共利益就很难讲。在有的社会是可以的，至于公共利益最后能不能反哺到你，反哺到你多少，那是更遥远的事情；而在有的社会里，报复大概率会引发反报复的恶性循环，迅速导致社会崩塌。\n\
    \n在法治度低和公民社会机制缺失的原子化社会里，你要想当赢家，报复是错误策略。\n\n还好这只是一种情境，还好有另一种情境。在这里，参与者们不再是匿名状态，他们反复博弈，彼此了解，形成了每个人声誉：有人的声誉是总是合作，有人的声誉是总是作弊，有人的声誉是总是报复作弊者，等等。\n\
    \n哈佛大学教授诺瓦克（Martin Nowak）在这种情境中做了多轮实验，结果发现，报复确实有助于维持合作，但因其成本高昂，使得总收益并不高，相反，游戏的赢家们无一例外地是那些从不报复的人。\n\
    \n面对报复与奖励两个选项，他们不报复作弊者，只是远远躲开，转而奖励那些合作者。不要报复作弊，但是要奖励诚信。赢家们是这样一些人，他们在漫长的博弈中，躲开作弊者，与合作者同行，相互激励，在一个诚信依然有用的社会里，抱团取暖，共同抵达，而社会因此受益。\n\
    \n诺瓦克给出建议：要有选择地与他人互动。奖励合作者，与其建立密切关系，传播他的声誉；不与不合作者合作，但也不报复。\n\n从自己做起，从现在做起。诺瓦克在哈佛主持演化动力学实验室，巨著《超级合作者》（SuperCooperators:\
    \ Altruism, Evolution, and Why We Need Each Other to Succeed）把合作产生的各种可能梳理得极为透彻，赢家不报复只不过是其中一章给我带来的启发。这本书不容易读，但只要读下来，收获可想而知。\n\
    \n—— 今日思考 ——\n\n总结一下，今天我们讲了，赢家不报复。给你留一个思考题：既然赢家不报复，为什么进化还在我们的基因中埋下了报复的种子？\n\n\
    明天我们接着认知训练，我要跟你讨论的问题是，经验是否靠得住。也欢迎你今天\n\n# 29 知识经验 | 知识演进时，经验靠不住\n\n29 知识经验 | 知识演进时，...\n\
    \n今天的认知训练给你一个另类视角，人是通过经验去学习的，但是从经验中去学习，这件事本身是靠不住的。\n\n## 维也纳小组与实证主义表达\n\n有一些思想家从来不会成为主流，如果偶而成为主流也不过是转瞬即逝，慢慢沉埋，被人淡忘；但他们也绝不会彻底埋没，肯定会有那么一天，被认为不可想象的事情发生：山无棱，江水竭，冬雷震震，夏雨雪，天地合，他们的价值才重新被发现。\n\
    \n波普尔（Karl Popper）就属于这一行列。他是20世纪初年的大思想家，与领当时思想风气之先的维也纳小组学派亦师亦友，而观点针锋相对。\n\n要讲波普尔，得先简单介绍一下维也纳小组。说起来他们与我颇有渊源，我在北京大学外国哲学研究所求学的时候，导师陈启俨先生师承洪谦先生，而洪谦先生是维也纳小组创始人石里克的弟子。\n\
    \n## 休谟的难题与波普尔的解答\n\n波普尔出场了。他说，你们太自信了。要按你们这个逻辑，就连科学也是不可能的了。不仅要拒斥形而上学，也得拒斥科学。你无法用经验来验证科学理论。\n\
    \n## 经验靠不住，你该怎么办\n\n不过，人总是的来把波普尔的提示置诸脑后。今天的科学界并不按波普尔的方法来鉴定一个东西是不是科学，观察-归纳-证实仍是科学家们自认的科学方法。\n\
    \n在《统计学与真理》一书中，大数学家、统计学家拉奥（C.R. Rao）说：\n\n所有知识最终都是历史学。\n\n所有科学抽象后都是数学。\n\n所有判断的理由都是统计学。\n\
    \n这是科学家又谦卑又骄傲的宣言。\n\n几十年间，波普尔的理论逐渐沉埋，在大众观念场上只留下了一句耳熟能详的那句话，“不可能被证伪的就不是科学。”而思想内涵渐渐遗忘。波普尔本人则从顶尖思想家的位置上一步下滑，淹没在故纸堆中。他曾在伦敦政经学院执教23年，但拿到教授职位过程艰辛。据说他用过的办公室今天变成了厕所，我还请在那里的朋友去实地考察过。\n\
    \n如果不是大投机家索罗斯奉他为精神导师，《黑天鹅》作者塔勒布认他作偶像的话，除了治思想史的专家外，今天谁想得起他？\n\n索罗斯和塔勒布，这些人以承接波普尔思想谱系为荣，他们当然知道从经验中学习是我们唯一的办法，舍此别无他途，但是如果以为经验必能将我们带来离真相最近的地方，就会自动陷入经验的自大，掉入过度拟合于过往经历的陷阱，而越是对过往经历过度拟合，对未来就越没有预测力。\n\
    \n我们早已摆脱了决定论的世界观，懂得世界本质上是不确定的，却又随时可能掉入另一种过度自信，以为自己对不确定性的掌握很确定。\n\n常识认为知识来自盲人摸象，摸得越多我们了解得就越多。波普尔的价值是告诉我们，知识是在黑屋子里追逐黑猫，我们只能知道它不在哪里。\n\
    \n理解波普尔，对无常命运多一份敬畏，在依靠经验时多一点清醒，且用且疑，且疑且用。\n\n## —— 本讲小结 ——\n\n总结一下，今天我给你讲了经验靠不住。而波普尔的思想告诉我们，经验为什么靠不住，在经验靠不住的时候，我们的知识是怎样产生的。\n\
    \n启发我们今天认知训练的是，波普尔的书《科学发现的逻辑》，也推荐你阅读。\n\n## —— 今日思考 ——\n\n留给你的思考题是：今天我们讲了猪和饲养员的故事。那么，猪认为饲养员会爱它，跟我们每个人都相信明天太阳会出来，这两个故事是否相似？不相似或相似在哪里？\n\
    \n## —— 今日彩蛋 ——\n\n明天是《30天认知训练营》的最后一课，我们会在这30天所有精彩的用户留言中抽取50名用户，赠送价值498元一年的“财新通”账号，在明天的文稿中，我们会公布中奖名单。\n\
    \n感谢你的喜爱和积极参与，我们一起认知升级。\n\n用户留言\n提交留言可与专栏作者互动\n\n# 30 阅读思考 | “阅读”反人性，为何还要读\n\n\
    30 阅读思考 | “阅读”反人性...\n\n今天的思维训练讨论的话题是：阅读这件事是反人性的，但同时，你为什么应去做这件反人性的事。\n\n## “阅读”其实是件逆天事\n\
    \n首先要说，读书没什么了不起的。\n\n古今中外，人们都非常重视读书。“阅读是思想最早期之义肢”，这话出自法国哲学家法戈-拉尔若（Anne Fagot-Largeault）。思想必须要附着在什么东西上，要有外部工具辅助，阅读就是最突出的工具。\n\
    \n很深刻，但不对。比阅读更早的思想义肢是语言。\n\n无论古希腊还是春秋战国，最古老的经典都是对话体。在文字和阅读普及之前，思想主要通过对诗和吟唱来表达和传承。《荷马史诗》口口相传数百年才记载下来。事实上，当书写刚开始普及时，苏格拉底非常不满意，他认为思想只有在对话之中才能层层递进到精妙之境，还认为书写将思想外置，败坏了思想者的头脑。他预言人的记忆力会因此下降。\n\
    \n- 小朋友获得阅读能力的过程分为三阶段：\n  - 第一阶段是图像识别，就是把词语当图像来识别。\n  - 第二阶段里的关键是养成“音素意识”，即认识到语音由最小的单位音素构成。\n\
    \  - 第三阶段，大量阅读练习后，人能快速、自动识别词语。大脑在阅读时作大量的并行计算，最终养成专门的阅读神经网络。\n\n## 你为什么还是要阅读？\n\
    \n总之大量、广泛阅读图书并非现代人的必需品。前面讲了三条，读书没什么了不起，不擅长读书很正常，因为人天生就不擅长。如果做专业研究的话，读书没有读论文重要。那么，读书还有什么用？\n\
    我有三个用处：\n"
