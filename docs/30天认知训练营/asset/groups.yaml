    ## 23 新电车难题：用算法来分配社会悲剧


    今天我们要讨论的是一个两难问题，面对社会困境，有没有一个社会能够长期接受的选择。


    先从一个经典的伦理学思想实验，电车难题开始讲起。我把这个问题稍做了一些转化，把它放在了人工智能时代。


    ## 机器人三定律


    人工智能时代已经开始，如何与人工智能共处，或者说在我们还有能力的时候，给人工智能定什么规矩，不再是抽象的哲学问题，也不必上升到谁做主这类终极追问。它变得极为具体，比如下面这个场景：


    行人横穿马路，刹车来不及，如果不转向，会撞死行人；如果转向，乘客会死于翻车。自动驾驶汽车应该作何选择？


    - 第一定律：机器人不得伤害人类，或者因不作为而使人类受到伤害；

    - 第二定律：除非违背第一定律，否则机器人必须服从人类的命令；

    - 第三定律：在不违背第一及第二定律下，机器人必须保护自己。


    ## 你想要什么样的道德算法


    自动驾驶汽车眼前景就要上路了，机器人三定律不够用，怎样给它立个什么规矩？换句话说，你想机器人按什么道德算法来运行？


    首先，你得了解自己到底想要的是什么。我给你推荐个自测工具，道德机器（Moral Machine），它放在麻省理工大学网站上（http://moralmachine.mit.edu）。点进去，你会遇到13种情景，形形色色的人群组合，老的小的男的女的好的坏的胖的瘦的。面对着自动汽车，假设你是乘客，你希望自动汽车牺牲谁拯救谁？


    - 孩子重于老人，胖瘦男女对我完全没差别；

    - 多个人重于一个人，不论是什么人；

    - 人重于动物，遇到撞人还是撞狗，永远选择撞狗；

    - 如果转向不转向都撞到同样多人，那就不要转向；

    - 如果转向的后果是我自己完蛋，那就绝不转向。


    ## 摆脱“新电车难题”的困境


    难道德自动汽车就上不了路吗？这倒绝不会。


    第一个摆脱困境的思路来自人工智能专家。他们认为既然解决不了这个问题，那就消除它。


    谷歌的自动驾驶工程师说，道德算法是假问题。自动汽车能高速处理速度、距离、路况、天气等信息，用激光雷达和各种传感器提前感知，提前计算出最合理方案，使那些难以抉择的危险情景根本就没有机会发生。


    存在满足各种公平正义要求的正解，但实践中则随时随地都在分配，一刻也没有因为不够公平而停止过，问题只在于它是如何分配的。


    这正是卡拉布雷西（Guido Calabresi）名著《悲剧性选择》（Tragic Choices: The conflicts society confronts
    in the allocation of tragically scarce resources）最有洞察力的地方。


    卡拉布雷西与科斯、波斯纳并列法经济三位创始人之一，做耶鲁法学院院长多年，美国法律界的泰斗级人物。这本书的副题是“社会在分配悲剧性稀缺资源时面临的冲突”，专讲社会怎么分配悲剧：怎么确定悲剧总量，以什么方式分配给谁。


    泰坦尼克号撞冰山，谁先上救生船？计划生育，如何分配生育指标？器官移植，谁优先获得器官？以及今天的新问题：自动汽车撞谁不撞谁？等等等等？


    回答这些问题只能是全社会的责任。在《悲剧性选择》中，卡拉布雷斯说，社会分配悲剧有四个策略：市场、政府、抽号、惯例，但没有哪个能长期维持分配的稳定性。


    1. 市场化分配是分散决策，价高者得。


    但是这种机制，不可避免地将已有的财富不平等，延展到当下分配的不平等，并且注定将人们认为不可定价的东西，比如生命，也贴上价签。


    ## ——◆ 本讲小结 ◆——


    今天我们讨论的，是人工智能时代下的新电车难题。


    ## ——◆ 今日思考 ◆——


    今天留一个互动：如果你是乘客，你愿意让人工智能汽车在面对可能的车祸时，替你作出决定吗？你希望他用哪些道德算法来做决定？


    ## 24 社会心理 | 关于女性，男人什么都不懂


