    ## 进化心理学对女性的误解


    > “一切都与性有关，惟独性与性无关，性只关乎权力。”


    美剧《纸牌屋》里，凯文·史派西饰演下木总统，强迫女记者性交易，然后面对镜头发，洋洋得意地说出这段对白，给人留下极深印象。当时不知道史派西是本色演出，今天已知更觉惊悚。


