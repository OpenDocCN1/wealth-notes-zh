    # 14 怎样避免集体无行动


    14 怎样避免集体无行动


    今天我们认知训练讨论的问题是：为什么应该把组织做小。


    这其实是已经有结论的了，但为什么组织应该被做小呢？因为集体没行动。


    人类社会最大一个谜，就是少数永远战胜多数。无论是政治、社会、军事、文化、金融，都是这个结果。


    ## 以少胜多的温泉关之战


    公元前479年，那个时代的第一次世界大战，希腊各城邦 sollic 来犯的波斯大军。统一东方的大王之王薛西斯，要把西方也管起来，派出数十万大军。


    希腊有多少人呢？雅典是最大的城邦，也就能出三四千重装盾甲兵。希腊人全部加起来，也就是万把人作战。结果输的是波斯人。


    波斯第一次入侵希腊，斯巴达国王带300人在温泉关抵御波斯大军，全部阵亡。300人挡几十万人，没挡住不奇怪，奇怪的是岂竟挡了好久。这事如何操作？


    人少好组织。


    每个希腊重装盾甲兵都装备有盾牌、护甲、长枪、短剑。左手持一米长盾，护住正面，头盔、胸甲、护膝分别护住头、胸、腿，右手执枪，短剑备用。这身装备穿上，如果只有一个一个人，那就是活靶子，因为太重，50斤以上，无法活动，而且身体两侧是暴露的。重装盾甲兵必须组方阵。


    典型的希腊方阵，深度8排，宽度不限。盾甲兵密集布阵，左手持盾，右侧靠同袍保护。方阵极为密集，挤到能让人窒息的地步。盾牌合在一起，组成长城，长枪架在肩上，无路可走，只能向前推进。


    这样一个巨型人肉坦克，就是那个时代的超级武器，把面前一切敌人剿倒，砍倒，推倒。


    这么一算，斯巴达300勇士大概正面是近40个人，约20米宽，如果温泉关地形配合，他们居高临下，堵住了要路，波斯人要把这八排人肉坦克攻下来，不容易的。如果是数千希腊盾甲兵对敌，那好比热刀子进黄油，完全是场不公平的战斗。在罗马兴起之前，希腊重装盾甲兵方阵所向无敌，赢得了与其他打法的各路军队的全部重要战争。


    人多是纸老虎，人少才好组织，少数总是战胜多数。


    ## 集体行动的“零贡献难题”


    集体行动之难，横跨政治学与经济学的诺贝尔经济学奖得主奥尔森（ Mancur Olson）讲过：


    > “一个集体，要么成员很少，要么能迫迫其成员，要么有其他特殊安排，才能使其成员采取符合集体利益的行为。否则，以自身利益为重的理性成员不会采取对集体有利的行为。”


    这就是著名的奥尔森“零贡献难题”。翻译一下，个人不做符合集体利益的事，要做的话，要么集体的少数人，要么集体能威逼利诱。


    在名著《集体行动的逻辑》（ The Logic of Collective Action ）中，按规模大小，奥尔森把集体分为三类。


    第一种是特权集体。奥尔森用了“特权”（ privileged）这个词，其实跟特权没关系，就是指集体规模够小，小到其中的个体总会采取符合集体利益的行为。因为哪怕只有一个个人采取行动，承担全部成本，他从行动带来的利益中分享到的那部分已经足够大。


    在特权集体里面，符合集体利益的行为总会发生。比如说，双寡头垄断市场里头，寡头一定会无所不用其极维护其垄断地位。又比如，海上失事，十个人爬上救生船，但船只能载九个人，那么你放心，一定会有个人被扔下去。


    第二种是中等集体。集体规模中等，单个成员的行为对集体利益的影响既不是决定性的，也不是可忽略不计的。个人是否采取符合集体利益的行为，有一定随机性，有可能会，有可能不会。


    第三种是大集体。奥尔森称之为潜在集体（ latent group ），虽然有共同利益，但就是一团散沙，个人对集体利益没有任何看得出的影响，经济学术语称之为“价格接受者”。


    潜在集体里，符合集体利益的集体行动不会发生，除非集体能威逼或利诱。集体行动之所以不发生，不因为共同利益的能见度不够，哪里它就明白白摆在每个成员眼前。比如，人人都讨厌通胀贬值，但通胀来临之时，人人都会上街抢购，火上浇油。


    少数总是战胜多数，因为特权集体总是战胜大集体。帝国总会崩溃，但部落永存，而家庭是每个人永恒的归宿，也是这个道理。中国人说修身齐家治国平天下，希望平滑地从己及人，由小到大，但总是事与愿违，因为别人不会跟随。


    ## 走出“集体无行动”


    奥尔森的书出版于50年前，今天我们懂得更多。他所说的，与因堵困境、搭便车、公地悲剧等概念彼此关联，描述同一类现象：


    每个人理性决策，却无法得到对所有人来说利益最大化的选择。


    在囚徒困境里，面对忠诚还是背叛，每个人的最优选择是叛卖；在搭便车现象里，面对公共品，每个人的最优选择是只占便宜不付成本；在公地悲剧里，面对公共池塘，每个人的最优选择都是竭泽而渔。


    怎样才能走出这个集体无行动的陷阱，我们今天也有了更精微的认识。另一位诺奖得主奥斯特罗姆（ Elinor Ostrom ）毕生精研公地治理，她开出的解药是这样的：


    > “如果公共资源的使用者们能自行制定规则，以确定谁有权、以什么方式使用资源，并有效地匹配成本与收益，自己监督执行，或者是通过那些对使用者们负责的人来监督执行，做到有针对性地惩罚违规者，那么，集体行动的问题就能得到解决。”


    奥斯特罗姆的药方是利害相关者自治。它依托于这样一个现实，同时也是信念：这世界上并不只有理性人一种。总会有另外一些人，他们愿意合作，愿意给集体机会，只要集体给他们机会——如果他人以善意待他，他会回报以善意。


    还会有些人，嫉恶如仇，对那些背叛者、搭便车者、竭泽而渔者，他们自带干粮去惩罚。世界再现实，还是有一点点气在人间的。


    奥斯特罗姆说，关键是识别出来谁是理性自利人，谁是合作者，谁是惩罚者。只要人们对此不是完全没信息，只要关于谁是何种人的判断比随机乱猜更准一点点，那么，这世界就不会完全被理性自利人所统治，公义就还有存身之地。


    帮助我们辨别到底是哪种人的信息来自哪里？奥斯特罗姆说，面对面交流，还有就是各种对于信誉的人际监控机制。路上行人口碑，是其中一种。


    其实，奥斯特罗姆的解药也可以说是奥尔森问题的注脚——很明显，这解药只属于规模较小的集体。正如奥斯特罗姆承认，较大规模的公共资源分配，必须使用分层解决机制。


    《孙子兵法》看法与此相似。孙子说，治众如治寡，分数是也，就是说要分割。奥尔森在《集体行动的逻辑》中也有展开：大集体想要产生集体行动，得采用联邦结构，而联邦结构的每个成员都是小集体，小集体就能行动。


    奥尔森举例子，利益集团如商会之所以能量巨大，是因为商界由一个个细分行业组成，每个细分行业的企业组成专业商会，在对这些行业重要的议题上有强大的游说能力，它在这个小池塘里是唯一的组织力量。相反，与其相对的工会、农会、消费者协会等大集体，想集体行动就难得太多。


    有组织的 小集体总能打赢无组织的 大集体。


    以此推之，虽然中产阶级作为一个整体什么也改变不了，但是校友就有机会改变点什么。

