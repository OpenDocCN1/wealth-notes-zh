    ## 01 什么是查理·芒格的人生开关


    ![](img/d7abd9c8c7e2e50c2fbef2cec40594e4_2_0.png)


    01 什么是查理·芒格的人生...


    今天我们来讲查理·芒格开创的一个思维模型，误判心理学。说的是，人有25种心理倾向，也就是思维定式，会在你不自觉的时候就影响了你的判断。


    我先来给你说说查理·芒格这个人。


    ## "穷查理"和"穷理查"


    芒格是巴菲特的合伙人，巴菲特说他是自己见过的最聪明的家伙。命运把他们俩绑在一起成为终身合作伙伴，但假如命运不是如此安排，芒格一样会获得自己的成功，正如巴菲特也会。


    芒格经历比较简单，出生在内布拉斯加州奥马哈，小时候给巴菲特的祖父老巴菲特的杂货店打过工，参加过二战的尾声，上过加州理工大学，从哈佛法学院荣誉毕业，做了几年律师，然后不干了，专心投资，与巴菲特比肩而立，成为超级投资者。


    ## 查理·芒格的人生开关


    土法有两大特点：


    第一是翻转（invert）。翻转的意思是说，如果你想知道怎么成功，那就先知道怎样就会失败。芒格不学习成功，而学习失败，从各种各样的失败决策中寻求教训，翻转过来获得好决策的线索。


    事，先想想这件事以前的成功率是多少？


    第十四个开关是厌恶损失。人们厌恶确定的损失，甚至不惜去冒巨大的风险来避免它。


    两个围棋世界冠军争霸，一方犯了个小错误，造成亏损，承认亏损，慢慢的话，局势虽不利却还能挽回。他拒绝接受，选择马上拼命，被对方一击即溃。


    阿尔法围棋就不会像他这样。因为这个开关只属于人类，而不属于人工智能。


    第十五个开关是寻求认同。青少年受同伴影响远胜于家庭，成人也一样。


    在认同感的驱使下做出不可设想的事情，比如在集体中普通人能够对他人施以不可想象的暴力。人们在面临困惑和压力时最有动力寻求认同感，所以传销和邪教组织的第一步便是将人隔离。


    ## 对于25个开关的解药


    解药不外乎这些：


    + 第一，随时对照25个开关检查自己的决策。知道就是得到，比茫然憧憬好很多。

    第二，下判断作决定前，最好要有冷静期，避免冲动。

    第三，要算概率，可以使决策更稳妥。

    第四，找出参照系。

    第五，与前后不一这件事和解，自相矛盾没什么了不起的。

    第六，永远直面真相，不管有多么难。


    其实这些解药大多数就是直接针对我们前面说的某些开关的。这里面最重要的环节是：


    你知道这些开关存在，这样你就对自己有了一个监控系统，你因为这些开关而导致错误判断的可能性就会小很多。


    注：

    这也与中国智慧暗合。


    > 《论语》说，夫子有四毋：毋意，毋必，毋固，毋我。就是说夫子四不为，不想当然，不强求，不固执，也不固执于自己。《中庸》也留下了十六字心传：人心惟危，道心惟微，惟精惟一，允执厥中。


    如果能做到，管理我们的25个开关绝对够用。道理就是这些，结果就全在知与行一体。


    附：查理·芒格在书中还写的另外五个开关是


    + 1. 压力。压力有二重性。套用巴甫洛夫对狗的研究，第一，巨大压力会使人崩溃，第二，压力够大的话，所有人都会崩溃。第三，最坚强的人一旦崩溃，恢复是最难。

    最有意思的是第四点，恢复的唯一途径是重新施加巨大压力。

    2. 用进废退。只有练习才能精进，这个人人都知道。但是，有些技能很不常用，要练到精处，只能随时练习，但看起来又没用，因为用到机会很少。

    这些技能就是屠龙技。你一辈子都不一定能遇到一条龙，但现在不练习一遇到怎么办？

    3. 毒品有害。这个没有什么可解释的。

    4. 衰老。没有谁还能年老后继续增长学习新的复杂技能，迟滞岁月磨损的唯一办法是始终保持思考，怀抱欣喜之心学习。

    5. 闲扯淡。人都爱闲扯淡，这个没有什么办法，但你得尽量做到别让闲扯淡的人打扰做正事的人。


    推荐延伸阅读：


    查理·芒格《穷查理宝典》


    查理·芒格关于误判心理学的三次演讲：

    1、1992年2月2日，在加州理工学院教职员俱乐部布雷（Bray）讲座上的演讲；

    2、1994年10月6日，受剑桥行为研究中心邀请，在哈佛大学教职员俱乐部发表的演讲；

    3、1995年4月24日，受剑桥行为研究中心邀请，在波士顿港湾酒店发表的演讲。


    ## —— 本讲小结 ——


    总结一下，我们今天说了查理·芒格的误判心理学。说的是，有一些心理倾向，或者是思维定式，会在你不自觉的时候就影响了你的判断。


    ## —— 思考题 ——


    最后，我给你留一个思考题：

    你对我们今天讲的这20个开关中，哪个的印象最深、或者最有感触呢？你在生活中有没有碰到过什么例子，是体现了这种思维定式的？


    ## 02 什么是思考，怎样更好地思考


    02 什么是思考，怎样更好...


    你好，我是王烁。今天我们来思考一个底层问题：怎样能做到更好地思考。


    我会给你讲三个思想实验，它们是图灵测试、中文屋子和亿年机器人。


    ## 第一个思想实验：图灵测试


    先来讲第一个，图灵测试。


    很多年前，现代计算机之父图灵（Alan Turing）构造出图灵机也就是计算机的基本概念，他知道猩猩也会出错。图灵机本身只是个思想实验，什么是思想实验呢？


    科学家理解世界的方法主要是观察和做实验，而思想实验在现实中也无法实验，就用你的想象去构造的实验。


    ## 第二个思想实验：中文屋子


    会做思想实验的又不止图灵一个，实际上，哲学家倒是思想实验的鼻祖，从柏拉图以来，思想实验就是他们主要的思想工具。


    哲学家塞尔构造了一个精巧的思想实验，同时也是图灵测试的一个变形，叫作中文屋子（Chinese room）。


    ## 第三个思想实验：亿年机器人


    如果你想亲身看到一亿年后的地球，现在能想象的唯一方法就是休眠。你爬进休眠舱，然后在一亿年后醒来。


    可是，问题没这么简单。休眠舱需要经受一亿年考验，要保证能源供给不断，要能够经得起环境灾变，万一受损还得自我修复，数不清的考验它都得能应付，否则你就再也醒不来了。


    机器人在保存你生命的最终目标之下，根据环境变迁，会自己衍生出许多次生目标。这是天大的事：衍生就意味着脱离，脱离于当初的目标。


    不忘初心，何其之难。允许机器有相机决策自主权，那么自主决策的进程一定会超越你的预想范围，这就叫失控。


    ## 两个思想实验，针锋相对


    讲到这里，你应该多明白一点了。这个故事中的机器人就是人类自己。在演化中，基因创造出人来做它们的机器人，以保护它们在人类身体深处漫漫休眠。人是基因为了自己永生而造出来的机器人，但在基因不得不让渡的自主决策空间中，人类演化出了自由意志。


    我们作为人的利益，与“造物主”基因的利益，走上岔路。从基因不得不赋予人类学习能力，授权自主决策的那一天起，基因失控，人类自立，就成为注定的结果。


    一言点醒梦中人。既然人本来是机器，机器何尝不能是人？


    亿年机器人这个思想实验，来自丹尼尔·丹尼特的《直觉泵与其他思维工具》（Intuition Pumps and other tools for thinking）。丹尼特是现代进化论科普大家，也是最具科学家气质的哲学家。在机器智慧与人类智慧的大辩论中，他的看法与提出“中文屋子”的哲学家塞尔针锋相对。


    他认为，不需要什么神秘的大脑特殊机制，运算层层嵌套，足以涌现出与人类相当的智慧，因为人类智慧亦不外乎是。


    在塞尔的中文屋子里，塞尔这个人、纸、笔、对照表，没有一样“理解”中文，但那也没关系，“理解”从所有这些东西构成的整体中涌现出来。


    塞尔和丹尼特，针锋相对，现在没法说哪个看法对。有数据的地方，数据说话；没有数据的地方，故事说话。


    现在没有数据，只能看你喜欢哪个思想实验多一点。我自己是更喜欢丹尼特，强烈推荐《直觉泵与其他思维工具》这本书。


    直觉泵这个词就是丹尼特为思想实验发明的，指在没有证据、数据的地方，我们从公认的直觉开始做思想实验，看它将我们带到何方。丹尼特首创直觉泵这个名词，又恰是从批判塞尔的中文屋子思想实验开始。


    ## —— 本讲小结 ——


    总结一下，我们今天讨论的问题是，思考是怎样涌现的。


    我带你体验了三个经典的思想实验：图灵测试、中文屋子和亿年机器人。


    其中最后一个思想实验，我特别希望你能记住，它来自《直觉泵与其他思维工具》这本书。它也是我们今天思维训练的灵感来源，这本书里面有数十个精巧的思想实验和思维工具。我把这本书推荐给你。


    ## —— 思考题 ——


    今天给你留一个思考题：


    你觉得机器人会获得人脑的智能吗？今天我们讲的两个思想实验，中文屋子和亿年机器人，它们得出的结论是相反的，你更喜欢哪个呢？


    欢迎你在留言区留言，和我分享你的感悟，也欢迎你把今天的内容分享给你的朋友，和他一起讨论。


    下一节课我们会讨论一门学问，它会告诉你如何不被无常的命运所伤害。


