    的工作是财务资源配置，他们的工作跟巴菲特没有本质区别。


    好了，上面所有这些都讲成功者怎样才能继续成功，那对于那些还没有成功的，这些有什么启发？


    如果你想成为下一个成功者，最短的路是做现在的成功者认为毫无意义的事情，做那些他们知道你在做什么但没有兴趣过来抢死你的事。直到有一天，等他们很想来抢死你的时候，晚了，轮到你抢死他们了。


    # 你怎样获得成功


    上面所有这些都是从组织的角度来讲的，那对于个人来说有什么启发？


    三个启发。


    +   1. 永远要对自己向当下环境过度优化保持警惕。


    +   2. 警惕归警惕，做事归做事。你必须在自己选定的方向专心致志，全力以赴，最大限度适应你所选定的那个环境。因为唯有这样，你才有成功的可能。


    别人都不搀二兔，就你三心二意，你想成功是做梦。


    +   3. 如果你幸而成功，你的人力资本会转化为财务资本，然后你用财务资本作多元化投资。人力资本是刚性的，调整起来事倍功半，没有人做得到像自己期望的那样灵活。


