    # 11 怎样从海量信息里寻找焦点


    ![](img/d7abd9c8c7e2e50c2fbef2cec40594e4_22_0.png)


    11 怎样从海量信息里寻找... ↓


    今天的认知训练，我来给你讲一个博弈论中的关键概念，焦点点。它的重要性甚至帮助避免了美苏大战的爆发。


    它的提出者是一位非常有趣的经济学家，经济学家中的经济学家，托马斯·谢林。

    托马斯·谢林是谁呢？


    ## 最聪明的经济学家


    多年以前，托马斯·谢林（Thomas Schelling）要从哈佛大学退休，一所大学赶紧去挖他。这所大学比较死板，大概是自己去挖的人，也得提交4封推荐信。这对谢林来说不是问题。他的4封推荐信都是诺贝尔奖得主写的。


    > “谢林是我见过的最聪明的经济学家。”


    ## 失去联系的约会


    假如，你在天南，朋友在地北，明天是元旦，约好明天在北京见面，但一不知道明天下几点，二没说在北京哪个地方，三你们彼此联系不上，你们俩在北京都没认识的人，等等。总之，你只知道，他也只知道，你们俩要在北京见面，其他一概不知。


    请问：你们明天能见上面吗？几点在那里？


    ## 市场与冷战中的焦点


    听起来像是浪漫故事，其实非常实用。比如选美，环肥燕瘦，让你预测谁会夺得花魁。谁最美哪里有客观标准，怎么预测？


    > “在核军事竞赛的背景下，通过对博弈论的分析，加深了人们对冲突与合作的理解。”


    往对方的情况，才是双方共同的焦点。


    不论与朋友还是与对手打交道，先找焦点，事半功倍。


    谢林的四本书我都读过，《冲突的战略》（ The Strategy of Conflict ）、《军备及其影响》（ Arms and Influence ）、《选择与后果》（
    Choice and Consequence ）、《微观动机与宏观行为》（ Micromotives and Macrobehavior ）。每本都值得深读，题材从自我管理、核威慑、博弈论，到恐怖主义、种族隔离，无所不包，通透一以贯之。


    ## ——本讲小结——


    总结一下，今天我们讲了一个非常有趣的经济学家谢林，和他提出的焦点。中国人认为顶级的智慧叫“析妙理于毫芒”，意思是 在最细微的地方解剖精妙的道理。谢林当得起这句话。


    在刚才我今天提到的四本书里，我尤其推荐最后一本，谢林的《微观动机与宏观行为》，建议你也去看看，体会一下在精微与广大两极之间自由来往的思想。


