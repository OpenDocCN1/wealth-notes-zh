    # 20 忠诚的限度：何时退出，何时发声


    20 忠诚的限度：何时退出...


    今天的认知训练探讨的问题是忠诚，忠诚是有极限度的，它跟你以为的不一样。


    # 用脚投票 Vs 用手投票


    讲忠诚，要从衰败讲起。成功的时候，时来天地皆同力，狗屎都是经验，谈忠诚无意义，因为没有考验就没有忠诚。只有当衰败来临，运去英雄不自由，经验都变成狗屎，这时才有忠诚可言。


    谈到衰败，任何公司、机构、组织都可能幸免于衰败，区别在于大多数从衰败走向衰亡，只有极少数能够从衰败重新走出来。


    面对组织衰败，个人有两种选择，第一种是用脚投票，退出。第二种是用手投票，也就是举手，发声，要力挽狂澜，重回正轨。


    看起来只是两个选项，但在名著《退出、呼吁与忠诚：对企业、组织和国家衰退的回应》（ Exit, Voice, and Loyalty ）中，赫希曼（ Albert
    Hirschman ）一一展开两者之间所有可能组合，展示了打通经济学与政治学壁垒的分析框架，使之成为20世纪最有影响力的社科著作之一。


    # 退出与发声的不同组合


    退出与发声，经济选择与政治行动，就这样融为一炉。两者之间有无穷多种组合。替代选择的多寡，转换成本的高低，影响你在退出与发声之间作什么组合。


    大体上有这些：


    第一种是极端情况：退出极为方便，完全没有成本，根本不存在限制。


    # 正确选择忠诚


    终于可以讲到忠诚（ loyalty ）。


    忠诚就是人们在面对组织衰败时的一种特殊反应：他们本可以退出但不马上退出，而是先发声。退出对他们本是现成选择，而发声一是会付出成本，二是需要创新思路，提出有效的重振办法，这哪有那么容易？'
