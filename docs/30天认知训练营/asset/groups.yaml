    # 发刊词 | 30天，完成一场认知升级


    发刊词 | 30天，完成一场认...


    罗振宇、郝不花告诉我，《30天认知训练营》要明确告诉你能从中获得什么。我一言以蔽之，不惑。四十不惑的不惑。它不是一种特定能力，而是一层认知境界。


    中国人传统上认为四十不惑是成长的重要里程碑，三十而立，四十不惑，需要经历漫漫修练。现在你有机会提前达成。


    # ——◈ 1 ◈——


    这门课里有什么？先说没有什么。


    第一，没有关于某个特定领域的系统专业课程。


    我不是那种被一个专业圈住的人。我是财新传媒总编辑，多年来主管这家中国最好新闻机构的报道，除了新闻我在其他领域都不是专家。


    # ——◈ 2 ◈——


    如果这里没有简单、万能、穷尽某个领域的课程、技能和答案，那有什么？


    这里有一个人成年以后给自己开发的通识教育：驭书作马，信马由缰，辔转于最肥美的牧场，对各种知识都感到好奇，随处擷英，以求不惑。


    # ——◈ 3 ◈——


    不惑二字，谈何容易！


