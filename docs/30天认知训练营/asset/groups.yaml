    托马斯·谢林是谁呢？


    # 最聪明的经济学家


    多年以前，托马斯·谢林（Thomas Schelling）要从哈佛大学退休，一所大学赶紧去挖他。这所大学比较死板，嘎怕是自己去挖的人，也得提交4封推荐信。这对谢林来说不是问题。他的4封推荐信都是诺贝尔奖得主写七的。


