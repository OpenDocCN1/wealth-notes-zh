    # 29 知识经验 | 知识演进时，经验靠不住


    29 知识经验 | 知识演进时，...


    今天的认知训练给你一个另类视角，人是通过经验去学习的，但是从经验中去学习，这件事本身是靠不住的。


    # 维也纳小组与实证主义表达


    有一些思想家从来不会成为主流，如果偶而成为主流也不过是转瞬即逝，慢慢沉埋，被人淡忘；但他们也绝不会彻底埋没，肯定会有那么一天，被认为不可想象的事情发生：山无稜，江水竭，冬雷震震，夏雨雪，天地合，他们的价值才重新被发现。


    波普尔（Karl Popper）就属于这一行列。他是20世纪初年的大思想家，与领当时思想风气之先的维也纳小组学派亦师亦友，而观点针锋相对。


    要讲波普尔，得先简单介绍一下维也纳小组。说起来他们与我颇有渊源，我在北京大学外国哲学研究所求学的时候，导师陈启俨先生师承洪谦先生，而洪谦先生是维也纳小组创始人石里克的弟子。


    # 休谟的难题与波普尔的解答


    波普尔出场了。他说，你们太自信了。要按你们这个逻辑，就连科学也是不可能的了。不仅要拒斥形而上学，也得拒斥科学。你无法用经验来验证科学理论。


    # 经验靠不住，你该怎么办


    不过，人总是的来把波普尔的提示置诸脑后。今天的科学界并不按波普尔的方法来鉴定一个东西是不是科学，观察-归纳-证实仍是科学家们自认的科学方法。'
  - '[PAGE 58]


    在《统计学与真理》一书中，大数学家、统计学家拉奥（C.R. Rao）说：


    所有知识最终都是历史学。


    所有科学抽象后都是数学。


    所有判断的理由都是统计学。


    这是科学家又谦卑又骄傲的宣言。


    几十年间，波普尔的理论逐渐沉埋，在大众观念场上只留下了一句耳熟能详的那句话，“不可能被证伪的就不是科学。”而思想内涵渐渐遗忘。波普尔本人则从顶尖思想家的位置上一步下滑，淹没在故纸堆中。他曾在伦敦政经学院执教23年，但拿到教授职位过程艰辛。据说他用过的办公室今天变成了厕所，我还请在那里的朋友去实地考察过。


    如果不是大投机家索罗斯奉他为精神导师，《黑天鹅》作者塔勒布认他作偶像的话，除了治思想史的专家外，今天谁想得起他？


    索罗斯和塔勒布，这些人以承接波普尔思想谱系为荣，他们当然知道从经验中学习是我们唯一的办法，舍此别无他途，但是如果以为经验必能将我们带来离真相最近的地方，就会自动陷入经验的自大，掉入过度拟合于过往经历的陷阱，而越是对过往经历过度拟合，对未来就越没有预测力。


    我们早已摆脱了决定论的世界观，懂得世界本质上是不确定的，却又随时可能掉入另一种过度自信，以为自己对不确定性的掌握很确定。


    常识认为知识来自盲人摸象，摸得越多我们了解得就越多。波普尔的价值是告诉我们，知识是在黑屋子里追逐黑猫，我们只能知道它不在哪里。


    理解波普尔，对无常命运多一份敬畏，在依靠经验时多一点清醒，且用且疑，且疑且用。


    # —— 本讲小结 ——


    总结一下，今天我给你讲了经验靠不住。而波普尔的思想告诉我们，经验为什么靠不住，在经验靠不住的时候，我们的知识是怎样产生的。


    启发我们今天认知训练的是，波普尔的书《科学发现的逻辑》，也推荐你阅读。


