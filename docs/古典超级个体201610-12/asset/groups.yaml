    # 下周预告：未来5年的职场，长什么样？


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    昨天上线的预热游戏，收到很多好玩的答案：


    有人说自己是奥迪，这是一种稳重有智慧的车；


    有人说是自行车，这样的人一定非常自在，走走停停，内心安静；


    还有很多越野车，他们期待更多的挑战——生命是一场华丽的冒险！


    有人说自己是在安全港的船，一直在建造，不知道要去向哪里。我想也许先走出港口看看再造船，是个好决定。


    其实所有的答案背后，都是同一个答案：自我概念。


    你是如何看待自己的？你是如何期待自己的？


    > 心理学家舒伯认为，你的职业生涯就是：“一个自我概念形成和实现的过程。我们在现实中清晰自我概念，发展和创造自我概念，最终达到个人和社会的双重满意。”


    所以，你对于自己的看法，并不是“感受自己内心”就能成的——否则我们真的就是成功学了一——这个自我概念，其实是“车日路”的相互作用，你的“自我-目标-路径”反复来回打磨出来的，是理想和现实往返互动的结果。


    年少十六岁，你觉得自己年轻，能改变全世界，这时候谁也无法与你辩驳，因为你的路还未展开，目标还没有看到。但是一个到了三四十岁依然平庸、毫无惊喜的人——再强大倔强的内心也无法自我说服了吧。


    所以，目标和路径本身就是我们自我概念的一部分。当你做车日路练习的时候，一定要记得这三点：


    +   你是谁？

    你想要什么？

    以及最重要的，如何到达？


    就如我在发刊词里说的，最重要的东西，总是最常被忘记。我会常提醒大家的。


    职场即道场——我们在其中认识自己，检验自己，也创造自己，成为一个自我和社会都获益的人。


    不着急，未来一年，我们慢慢展开这个讨论。


    接下来一周时间，我们会一起探讨超级个体的大时代背景：


    +   未来5年的职场，长什么样？

    未来职场的定位坐标是什么样的？

    未来职场哪些能力会更加增值？

    未来职场有哪些职业赛道？

    未来哪些职业会越来越火，哪些会逐渐衰亡？


    ——一起看到趋势，掌握技术，提升能力。


    开始之前，还要和大家说说专栏具体的安排：


    # 1. 怎样更新？


    每周一个主题——比如下周，就来聊聊未来5年的职场会是什么样。


    周一到周三：连续3天，每天都会推送音频+图文。


    周四和周五：互动评论，我们会深度讨论前面三天大家非常关注的内容。


    周六：下周的预告。


    周日休息。大家也出去看看世界。


    每天零点更新。


    # 2. 怎么能更好地学习？


    每篇图文我都录制了音频，文字也被整理成更容易查看的笔记，所以最好的方式是听着语音看笔记。


    每篇文章后面都有“每日精进”，留给你做进一步的思考。留言本身也体现了思考过程，我会挑选精彩的思考，互动、答疑和评论。


    用好每篇图文的工具卡：你可以把自己喜欢的工具卡存起来，专门放到一个收藏夹，便于以后回忆。


    更好的方式是把知识转述出去。输出倒逼输入——能说出来的知识才是你的。你可以拿着工具卡把学到的内容对别人讲一遍，甚至写一遍，会有真正的进步。


    下周我们就要正式开始这场修炼啦。


    今天来到《超级个体》的朋友，想邀请你来聊一聊——你可以在下面的问题里，任选一个回答，也可以表达更多的看法：


    +   1. 这一年，你希望这个专栏带给你什么？

    2. 如果让你来策划这个专栏，你会带来什么不一样的玩法或建议？

    3. 什么是你眼中的超级个体？


    我将在留言中选择3名最打动我的朋友免单，就当是我把这个专栏送给你，感谢你的好建议。你看到你认同的答案，也欢迎点赞把它顶上来，这样我也能更了解你的想法。


    留言到下周四（10.27）晚上12点前都算数，下周六（10.29）公布获奖名单，会有工作人员联系获奖的朋友。


    好了就是这样，这一年，共同进化吧：）


    ![](img/b7067422984faf05bb36fe56d6d8faf5_2_0.png)


    思考精选


    Brynn 2 一、我希望这一年，专栏可以让我逐渐从“普通人”向“超级个体”转变，做一个有追求，有点品味，拥有创新思维的人。虽然一切都是未知数，但我会坚持每篇文章都思考并留言，写下感想，即使一年后我没到“超级个体”，怎么也会有一些“超级个体”的思维，从而不断向超级个体迈进！二、1.建议老师多与读者互动，毕竟有互动才有乐趣。2.还可以在每周或每个月做一个小活动（如周末），然后，让读着留言（比如说看看每个人观察周围的优点，有什么可以值得学习的地方等）。3.古典老师一定有很多优秀的学生吧？可以让老师觉得优秀的学生来串课一下，讲一下自己哈哈笑。三、我心目中的超级个体，类似于杰夫老师、罗振宇老师等这一群有想法、又有趣的人。我觉得超级个体不一定要很名气，但是是一定要不断学习、思想不断更新升级的人。但是人也不可以盲目学习，还要学会生活学会“有趣”。
