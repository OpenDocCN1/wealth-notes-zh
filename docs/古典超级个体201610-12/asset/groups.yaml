    在一个机器越来越强的年代，什么样的能力是最厉害的呢？


    能够跟机器协作的人的能力。


    在全世界都只有步兵的时候，一个会骑马的步兵就很厉害。


    而在有枪的年代，一个会用枪的功夫高手是最有机会获胜。


    所以在今天这个时代，最厉害的是懂人性又懂电脑的人——在每一个时代，能用自己的能力跟那个时代最先进的生产力合作的人，都是那个时代的赢家。而在这个时代，真正的赢家就是一个能用高感性能力跟高科技合作的人。


