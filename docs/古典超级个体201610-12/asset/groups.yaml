    # 发刊词 | 52次加速，助你成为“超级个体”


    “我们已经有了关于商业、趋势、政治和财富的内容，为什么我们不做一档关于个人的栏目呢？”


    和罗振宇碰这个专栏定位好几次了，直到这句话突然跳出来，我看到他眼睛里放光。


    ——唉，我们真应该为个体做个专栏。


    很多人认识我，是因为我写的一本书《拆掉思维里的墙》。


    在过去10年里，我大多数的时间都在做职业生涯的咨询、高管的教练、课程研发和授课，在我看来，这都是一件事——帮助他人加速发展。


    > “知识狂躁，这群人。”


    上世纪美国50年代，美国的精英阶层也集体焦虑。心理学家罗洛·梅说：“焦虑是人类面对威胁希望创造自我的正常状态。在这样一个高速发展的时代，焦虑的人才是真正的健康、感觉到时代脉搏的人。”


    这群“超级个体”是这样的人：

    - 科技+人性：能抓住趋势，善于利用科技，也有高感性能力；

    - T型人才：良好的基础素质，在某一个领域有极致的专长；

    - 联盟思维：善于组织、平台密切合作，共同成长；

    - 个人品牌：有自己的个人影响力；

    - 自我实现：有点品位、有点追求。


    每个人，包括我自己，都需要加速升级自己的眼界、心智和能力才能抓住这个趋势。而越是靠前的人，看得越清晰，所以就越发努力。


    1968年墨西哥城奥运会，跳高运动员福斯贝里（RICHARD FOSBURY）第一次在全世界前面施展他的背越式跳高。在那个流行跨越式或者仰卧式的年代，他的动作诡异而奇特，引发阵阵哄笑。随着横杆一次次升高，笑声没有了。在最后一跳成功后，他获得了奥运会金牌——全场起立鼓掌。


    《科学革命的结构》把这种转化称为“范式转换”（paradigm transition）。飞机的发明就是典型的范式转化的结果。


    这就是加速成长的第一个要素，转换模式。


    这是加速成长的第二个要素，学着应用新的工具和技术。


    这是加速成长的第三个要素，也是最重要一个——修内功，提高核心素质。


    正确的模式、工具技术和个人素质，是加速成长的三个要素。最后一个虽然听上去最不酷，其实花时间最长，也最重要。只听不动的人，往往跟别人越来越高，手脚越来越低，变成一只知识痴痴的“长颈鹿”。


    > 曾国藩说：“兵闲拙速，未睹巧之久也”，仅仅是精巧的东西长不了。职业发展是“拙速”，找到一个点，老老实实做事，踏踏实实练习，一年下来就会超过很多人，遇到一个机会，呼啦一下就起来了——成功是长久而持续的积累过程。


    在《超级个体》里，我们准备这么干：


    1. 我们会每周探讨一个加速成长的主题


    我把这52个主题分成这么4大类：

    - 对事的竞争能力

    - 对人的影响力

    - 对组织的领导力

    - 内在发动机制——个人成长


    ![](img/b7067422984faf05bb36fe56d6d8faf5_0_0.png)


    # 热身思考题：你是什么车？


    热身思考：你是一辆什么车…


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。这个专栏我们下周一才正式开始，今天，一起做一个热身思考题吧。


    今天我们要讲一个加速成长的工具，叫做车日路模型。我想先从一个故事开始讲起：


    在一个行业论坛上，我旁边坐着一位先生。在互相寒暄和交换完各自的名片，以及“久仰久仰，厉害厉害”后，他看了看我的名牌，问我生涯规划是干什么的。


    这种情况下，对方其实也只有10秒钟的耐心，你没法和人说 split 技术，我对他说——生涯就是帮你搞明白，你是谁，你想去哪里，以及怎么去。


    见他有点儿不明白，我又继续打比方：“比如说你，如果你自己是一辆车，你会是一辆什么车？”


    你不妨也试试这个小游戏。


    假若在一个周六的早上，你有足够长的时间，准备开始一段向往的旅程，你开着车，走在一段公路上——


    你开着一辆什么车？

    车里还有谁？

    你准备开去哪里？

    你沿途希望经过什么地方？


    如果你有答案的话，试试看自己解读下。


    车意味着你的自我概念（法拉利、奔驰、越野车、卡车、自行车）


    身边坐的人往往是你做决策时很重要的人（家人、朋友、自己一个人）


    准备开往的地方是你这个阶段的目标（热闹的都市、宁静丛林、险峰、广阔的大海、幽静的小镇）


    路径是你希望经过的路径。


    ## ——一个观点——


    这个游戏源于一个模型，叫做车日路模型。上面的答案肯定不足以帮你做个计划，但是可以帮助你更好地理解这个模型。


    一个好的职业发展计划由三个部分组成，目标-自我-路径。


    ## 你是一辆什么车？

    —车·日·路模型—


    ![](img/b7067422984faf05bb36fe56d6d8faf5_1_0.png)


    1. 日是你你要去的地方和目标。你的职业发展目标是什么？长期目标5年是什么？短期目标3年、1年是什么？如果让你排序，最重要的目标是什么？哪些是可以排到后面的？

    2. 路是你你要走的路径。对于如何去最近那个目标，你的路径清晰吗，分成哪几步？如果不清晰，谁会知道？

    3. 车是你自己，你对自己这台车的马力、底盘有信心吗？如果需要提升，提升什么？你的动力来自哪里？你是通过什么持续“加油”的？


    ## ——一个策略——


    一个职业发展的过程就是思考、践行车日路的过程。任何事情都需要2次创造，一次是在脑海里，一次是在现实中。


    自我-目标-路径，三者就构成了一个最简单的思考题。


    很多人从没有想过这些，或者觉得烦就放弃了——他们看到什么就抓什么，看到路口就拐，看到有车就超，最后到了一个谁都不知道的地方，没油了。这种情况肯定迷茫。


    另外一种可能是纠结，你明明是一辆跑车，却莫名其妙驶入了越野路，底盘被挂得哐啷乱响；或者明明要去东边，却莫名其妙拐上了去西边的高速公路，下不来了。心中纠结可想而知。


    还有一种情况是没想好就上路，走一半盘山公路才发现自己马力不够，准备不足，退也退不回去了，这种情况就是焦虑。


    自我-目标-路径三者统一，才能顺利到达自己想去的目标。


    大部分时候，你可能发现这三者没法完美的统一，这个时候有三种策略可以选。


    升级车：在职业发展的初期，职场的头3年，什么都不要想。从目标出发，倒推道路，最后改装汽车，因为这个阶段的主要任务是学习和成长，要从自己身上开始开刃，死磕自己，持续增值。


    刚进入职场的时候，选择一个你喜欢的，比如早进行业5年左右的标杆人物，研究他的发展路程、具备的能力，然后一路学习跟随就好。


    选好路：在职业发展的中期，一般是25-40岁，综合考虑路和日，有些路径虽然不一定直接指向自己的目标，但是如果选好走，就先往前走。宁可一思进，不可一思停，持续升级自己的车和驾驶技术，只要大方向不错，总会开到的。取势、优术、明道。


    在职业中期，最重要的是做好几次台阶和行业的抉择，要做管理还是专业？要留在大公司，还是去小公司，或者甚至自己创业？要留在本行业还是尝试新行业？关键是选择一个让自己持续增值的路径。


    做自己：在职业发展的后期40-55岁左右，你的体力精力都在下降，但是你的资源和智慧都在顶峰。从自身出发，去想去的地方，走最适合自己的路。你的目标不是赚钱或者增值，而应该是发挥自己的天赋、追求更大的社会价值和自我实现。职业对你的意义又会有改变。


    像《论语》说的“从心所欲，不逾矩”。


    ## ——一个总结——


    今天我们讲了一个小工具，叫做“车日路”。也是职业发展里最核心的三个要素：自我-目标-路径。在未来的这一年，我们会越来越强化我们的能力和装备，清晰我们的目标和达成路径，加速奔跑在驶向未来的道路上。


    我们还提到了三种不同的校准策略：升级车、选择路、做自己，在三个不同的阶段。


    ## ——一个思考——


    1. 你是什么车？你要去哪里？你准备如何去？

    2. 你现在处于什么阶段？你会选择3个策略的哪个策略？你是要升级车？还是选好路，还是做自己？


    这是我们开始前的思考题，

    那么，你是一辆什么车？


