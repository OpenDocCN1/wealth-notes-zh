    时光隧道 2 我所认为的超级个体，应该是一个能够不断探索和认识自己的人，一个在实践中寻找方向并勇于尝试的人，一个能够为目标精进并能排除外界干扰的人。这样一个人愿意展开双臂拥抱新世界，对新鲜事物保持好奇心，并在一定程度上预测未来发展的趋势。这样一个人愿意主动学习知识，努力培养学习工作和生活智慧，并在养成新智识的同时影响和带动更多的人探索自我与世界，在他们身边，人们会感受到强大的动力。这就一个人类用未来视角思考问题，不只关注当下的肉体，还有智在未来的思想，他们做事的不是眼前的蝇头私利，而是为将来的成长期努力奋进。超级个体在于强大的自我认同，能够辩证地看待自己的优势和不足；在于强烈目标感，每天专注于重要的事情；在于努力打磨迈向成功的技巧和工具，能发挥资源和平台的优势为每一个目标找到最佳的发展路径。努力打造超级个体，加油加油！
