    ## 碎片化时代，3种能力让你效率升级 7-1


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    7-1 碎片化时代，3种能力...


    ### ——一个观察——


    今天开始之前，先问大家一个问题，每天你在网上花的时间是多少？


    最近，一家英国研究机构对手机软件的使用情况开展了一项社会调查。结果显示，每人每天平均使用手机竟达253次。这就意味着人们每天有2个多小时花在手机上，相当于他们一天清醒时间的1/10。在中国，估计人们使用手机的时间更长，是其2到3倍。


    不信？我们一起来做个实验：打开手机（iPhone），进入设置-电池-查看电池用量，就能看到你在各个应用花的时间。几乎90%的人，最耗电的应用是微信，这毫无悬念。我做了身边10个人的抽样调查，发现他们平均每天使用的时长至少在2.5小时。一方面说自己没时间，另一方面却有2.5小时花在手机上，这就让他们自己有点小震惊和小尴尬了。


    电池用量


    ![](img/b7067422984faf05bb36fe56d6d8faf5_59_0.png)


    ### ——一个概念——


    你还在用工业时代的方式，管理你在互联网时代的时间。


    现在说到时间管理，很多人都会想到时间四象限——重要紧急、重要不紧急等。但在今天这个时代，如果你的微信突然响了，你怎么判断这条信息是重要还是不重要呢？可能是你一个特别重要的客户发过来的，也可能只是一个毫无意义的聊天。


    在这个充满变化的不确定时代，你很难区分和预测什么重要、什么不重要。


    当我们谈时间管理的时候，我们需要先明白一下时间流这个概念。


    - 1. 农业时代的时间流：天人合一，日出而作，日落而息；

    2. 工业时代的时间流：在同一时间同一个地点重复做同一件事；

    3. 互联网时代的时间流：永远在线，随时干扰；信息变多，阅读变浅。


    农业时代：心跳声


    工业时代：马达声


    互联网时代：交响乐


    ### ——一个策略——


    在这样一个时代，我们该需要3种能力：


    ### 1.碎片整合能力


    在美剧《越狱》里，男主角米帅用整整一堵墙，把所有的线索都贴在墙上，男主就在那里看着这些线索，寻找它们之间的联系，往往突然间，“啊”的一声，解开谜题。最后他把所有的信息整合在一起，伪装成一个图画，纹在自己身上，带入了监狱。这就是从碎片到重新整合的一个过程。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_59_1.png)


    现在，我们每天收集到的信息充斥着大脑，乱糟糟的，就像那堵贴满资料的墙，根本没法理清思路。你的大脑是乱的，做事情也一定是凌乱的。你也需要一种整合的能力。


    所谓整合就是找到碎片化信息直接的联系，形成系统框架，并且解决问题的能力。你可以通过头脑风暴发散思维，最后通过脑图、结构化思考整合成方案。思维导图就是一个不错的整合工具。


    ### 2.单线程到多线程能力


    比尔·盖茨有一次到中国出席会议，需要利用这个机会谈很多重要项目的合作。我朋友参与接待，他看到比尔·盖茨租住酒店的一层楼，然后每一个项目的合作方安排进一个房间，比尔·盖茨就这样走进一间房，谈合作，走出来，休息一会再走另一间房，再谈合作。后来有人问为什么要这么安排？一间房轮流进来不好吗？比尔·盖茨说：“因为这些项目在我脑袋里也是放在不同‘房间’的。所以我并不会忙，心也不会乱，只不过时间不够用罢了。”


    计算器与计算机的区别是：


    计算器是单线程，一次只能计算一个，计算下一个要按C清零。


    计算机是多线程，边计算、边听音乐、边下载美剧、边聊微信。


    虽然计算机是多线程，但当前激活的窗口只有一个，我们可以在多个任务中切换，但仍然需要保持专注在手头的这个任务上。


    多任务后台处理，单任务前台专注，就是互联网时代的事件处理的第二项能力。


    你可能没有很多房间，但你是不是可以有很多不同的空间、地点、本子、表格等，来记录和专注不同的任务呢？


    ### 3.放空能力


    在这个时代我们为什么越来越纠结，越来越难以做出决定？


    比如说中午几个同事一块儿吃饭，总是有主间出一个特别尴尬的问题：咱去哪吃？此时要不然是冷场，要不然就是各说各话，商量了30分钟还没决定下来，因为问题让大家都停留在思考的层面，想太多，反而做不出决定。


    下次你可以这么问：“附近都有啥？感觉怎么样？那去哪家吃？”，“就是它！走！”。


    做决定其实是个内在的U型结构：信息-感受-思考-决定。


    只有放松下来，我们才不会卡在头脑里——我们需要放空自己，让信息和感受进来，然后才启动思考程序。


    放空自己，从思考的层面退回到信息和感受的层面。走在路上，去观察树叶、泥土、麻雀，去听鸣叫声、聒噪声，去感受微风、路人的表情、步伐……这就是退回到信息和感受的层面，你这样去做，会感觉到很舒适、放松，很多选择会蹦出来，很多直觉会逐渐出现，很多决定会越来越明晰。


    如果把人比作一台电脑，每个人都需要从单机版电脑进化成一台联网版电脑。这需要三种能力：磁盘碎片扫描、多线程处理能力、内存清理能力。


    ### ——一个总结——


    大部分人之所效率不高，因为他们采用工业化时代的方式在管理互联网时代的时间。


    三个时代有三种不同的时间流：农业时代的心跳，机械时代的马达声以及互联网时代的交响乐。


    互联网时代的特质：永远在线，随时干扰；信息溢出，思考变浅。


    每个人都需要进化出三种能力：碎片整理能力、多线程处理、内存清空能力。


    ### ——今日精进——


    - 1. 评估下自己的三种能力，如果10分是满分，你会为这些能力各打几分？

    2. 在你的生活、工作.Unknown


