    ## 2-4 问答 | 你有没有看清自由的公式？


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    ### 一、这一 次，我们坐下来再一起聊聊“自由”


    说实话，我在看大家评论的时候挺开心的。在关于自由职业态的讨论里，很多自由职业者和围观自由职业者的人现身说法，有过得很好的，也有不那么顺利的，但都是真心实意。聊了一圈以后，大家普遍对于“开茶店、开个小店就能过逍遥人生”的幻想开始动摇，对于自由职业有了更深入的理解——这是挺好的事。


    我们不断地靠近真相，因为让现实的故事拍你的肩膀，总比让现实直接抽你嘴巴好。


    当然我们不是专门做一集黑自由职业者的——我们要聊的是自由职业态。


    我认为，自由职业态也许是这个时代个人和组织最好的站位。平时可修炼，进可以共创，退可以自保，相忘于江湖。


    关于自由，有很多很多的解释，但误解更多——最常见的误解，就是“自由是不受约束，很多空间，自己做选择”。也正是因此，大家才开始羡慕各种自由吧。


    但是想深一层，社会是一个利益共同体，当你做出任何一个选择的时候，一定也会牵动别人的利益——为什么别人给你这个自由呢？


    因为你也需要承担自由背后的责任。


    一个项目给予了你自由做决定的权力，但同时你也需要承担做决定后的责任。之所以给你这个责任，是因为大家认为你有这个能力。


    大家毕业的确有自己选择工作的自由，但是你也需要承担选错了的责任，所以你还是需要点儿能力。


    那些抱怨自己深陷公司不得不超限地工作、没有时间学习的人，其实你要意识到，不是公司不好，而是你并没有谈判的自由，也没有换一个的自由。简单来说，是没有这个能力。


    所以，也许这并不是你喜欢的选择，却是跟你现在能力最匹配的选择。而你现在的能力，都是你过去每天选择如何用你时间的结果。


    换句话说：你的现状，是你过去“自由选择”的结果。


    为了怕你绕进去，我总结下：


    自由=责任=能力=过去的选择


    过去已经没得选，但是现在这一刻是有选择的——你可以选择继续抱怨，也可以选择开始改变，至少三个月以后你会有更多空间。


    只要你的选择是自由的，你总会有自由的。


    你会怎么选？


    ### 二、如何在自己职位上培养“自由职业态”？


    现在的工作是在金融行业从事运营支持（非核心业务部门），实际工作内容包含IT系统开发部分功能的产品经理、数据统计分析、内部移动办公APP产品经理、企业品牌维护、物料制作与设计支持等，比较杂，更多时候做的是项目的跨部门沟通协调运营，具体工作由下属实施。如果目前的工作状态一直持续下去，似乎更难实现“自由职业态”了，仅凭这种所谓的管经理经验，很难支撑职业能力的自由交易。


    很多人工作时间被挤得比较满，也许工作深度运用了你其中一种能力，觉得自己没有时间修炼另外的两部分。


    看看各部分可以怎么修炼：


    - 1. 运营能力其实是可以任何地方修炼的，自我管理、自我律、开始理财、学会基本的法律常识等。

    - 2. 产品能力的修炼可以从交付结果开始。你可能每天做了很多事情，但是并没有能说清楚自己具体做了什么结果。其实哪怕再琐碎的事情，只要被设定下来有这个岗位，就会有交付结果和对策——你做了多少事情，省了多少成本？到底满足了谁的什么需求？如果可以用清晰的方式呈现出来给你的内部客户看，就是封装自己的能力——这个能力其实并不难，有机会看看企业咨询顾问给你们看的项目条目，那就是他们产品能力的包装整合。

    - 3. 媒体能力如果工作不需要，可以考虑先在公司内部做个小分享和转述——这个专栏的内容就有一些不错的可以转述的知识點。其次可以尝试写公众号、简书。不要求火，从练习表达和思考开始。


    ### 三、自由职业态的三种能力


    三种能力：产出产品、自我营销、自运营能力，下面是个好例子。


    我当年毕业的时候选择追随了一位律师，他就是典型的自由职业者，每天在不同的地方见客户，准备诉讼材料，去不同的法院开庭。一直让我佩服的是，他勤奋的程度大大超出了我的想象，而且他为人处世特别让人舒服，经常当完一场官司，对方律师也成了朋友。他完全符合您说文章里说的，产出产品，自我营销，且具备运营能力。


    ### 四、怎样把能力包装成产品？


    自由职业者能把能力包装成产品，那要有些工作本身就包装不成产品。比如我们做房屋结构设计的，要靠建筑师接活进来，然后我们配合建筑师。这样我们基本就很难把自己包装推销出去。那么我是否应该换个能包装成产品的行业呢？房地产辉煌时期已过，日子更难过了，所以也让我思考是否该转行，请古典老师救救我于水火啊。


    当我们说能力包装成产品，并不是说成为一个马上可以销售的独立产品。手机的CPU也是一个产品，但是你不会单独买CPU。


    所谓的包装成产品，是指可交付、有价值、脱离你依然存在的东西。比如说“得到”APP的《超级个体》专栏，就是我的一个产品，这些知识在我脑子里无法交付，但是通过这个专栏，它成为可交付、有价值、脱离我存在的东西。


    最后，拿你说的房屋结构设计来说，好的结构设计本身就能够成为产品——好的结构设计师是能单独接单的，建筑师（内部客户）也愿意与他合作。


    所以不用救你，你本不在水火之中。


    ### 五、自由职业者有哪三个阶段？


    在法国做了7年自由口译者，非常同意“不能只向往自由二字，更要重视职业能力”的说法。


    在刚起步阶段，为了积累口碑扩大客户群，接受较低价格和期限较紧的任务，虽然累，但有助于快速积累经验，并跟客户建立互信关系。


    到了中期，稳步提高价格，通过观察和谈判，逐渐淘汰掉困难、酬劳不高且任务量不稳定的客户，只保留优质客户，既节省了时间，又提高了收入。


    到了成熟期，工作量已远超出自己可承受的范围，就开始根据自己想要追求的生活安排工作，也会更多地优先安排最感兴趣或觉得有挑战性的工作，而不会再把收入的增长作为唯一目标。


    如今因为兴趣使然，逐渐从自由译者转向线上教育，发展近一年来，深感通过快速学习提升相关技能、包装和推销自己以及自我管理能力仍然是关键要素。


    Claire清晰地展现了自由职业者的三个阶段——开始起步阶段，积累口碑和客户群，建立互信关系；中期稳步提高价格，通过观察和谈判，逐渐筛选客户；到了第三阶段开始根据自己的爱好兴趣反过来挑选客户。


    雇佣、自由交易、共创。


    但是到了一个新的在线领域，这个过程可能需要从头来一次，所幸能力可以迁移过来，这个我们过两周会讲到。


    ### 六、自由职业者如何进一步放大自己的能力？


    老师，我是一名独立的墙绘设计师，负责墙面的设计和制作。因为刚刚开始做，只有自己一个人，价格实惠，且质量有保障。现在客户介绍客户，基本上开始稳定每个月都有单子，收入在8000+/月，目前一个人也并不能接很多单子，一个人也做不了很多业务。除了继续把设计绘画的事情做好之外，想成为自由职业态，老师是否有一些建议可以帮助我们规避一些常会遇到的弯路，识别一些会被坑的套路。


    古典


    一个人的营收收入无非三个方向：单价 X 人数 X 重复购买


    - 1. 提高产品能力，提高水平、质量，或者增加附加值，能提高单价。

    - 2. 提高媒体能力，能够让更多人知道你，传播口碑能提升重复购买。

    - 3. 提高运营能力，能够提升自己的效率（降低时间成本）或者让更多的人和你一起干。


    所以通过产品放大的是你的价值、媒体放大的是你的影响面、运营放大的是你的效能。你可以综合一下看看，到底你更适合放大哪一个部分？


    今天是古典陪伴你成长的第 14 天，一起加速，成长为更好的自己。


    ## 2-5 问答 | 组合式工作对于一般人有什么意义？


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    ### 一、组合式工作对于一般人有什么意义？


    福香：组合工作很好！但是对我们全职工作的上班族，有什么实际的指导意义呢？


    孟伟伟：看到留言，发现组合工作法的核心是讲家庭、工作、社会、学习放在同一个层面考量，并不是哪个重要哪个不重要，而是合理地分配时间。


    古典


    区分2个概念：组合式工作法与查尔斯·汉迪的日常安排。


    后者是多年努力后达到的最高境界，对于大部分人来说，指导意义不大。


    对于我们，组合式工作与其说是一个固定的比例，其实更多的是一个思维方式——时间应该被投入到不同的领域里来，让更多意义支撑自己的生命。


    既然是组合，这几项内在是有关系的。


    有薪工作实现自身价值，家庭工作践行家庭价值，义务工作实现社会价值，而学习以上三者的效能，让你跟得上其他的成长。


    仔细想想，很多人的问题正是由于三者的失衡，以致成为努力工作却漠视家庭的工作狂，全心全意投入奉献却把自己过得很糟的过度助人者，完全投入家庭却缺乏与外界接触的人。我们可以通过这个思考使自己的工作生活更平衡。


    不过，前面说过——查尔斯·汉迪的组合式工作的150\100\50\25天的分配方法，是一个传奇，是组合式工作的终极形态。连他自己也坦诚承认，在开始践行的前几年，日子很不好过，不太好坚持。但是当你持续坚持下去，日子就一天天好过起来。


    说实话，羡慕得要死的我，也在罗胖的压迫下，完全木有达到这个组合哈！


    ### 二、什么是义务工作？


    沈晓添：义务工作的部分感觉不是很清楚，可以把休闲的内容放在这个部分里面吗？


    古典


    首先再一次回顾下汉迪发明这个方法的初心——“单一的工作无法支撑人生的全部意义”。在他（以及很多西方人）看来，为社会义务工作显然是人生意义的一部分，西方人受宗教影响，普通社群服务意识很强，延展开来的公民意识也很强——如果你没有这个人生追求，却是没有必要非要给自己放一块，先做好其他的再说。


    回到现实层面的意义——其实现你不妨给自己设计这个模块。我在实践的时候认为义务工作就是“服务别人而不求回报”的时间——介绍两个需要认识的人见面是服务，想起来把衣物捐给需要的人是服务，每天坚持给父母亲一个电话是服务，当然，为陌生人、孩子、公司机构服务也算是服务……


    所有你付出的时候没有想着获取回报的事，基本都算是义务工作。虽然这些事情终究会有好的回报，但积极心理学认为感恩和服务他人本身带来的幸福感远高于这些回报，坚持服务他人的人最幸福。


    所以如果你也没有什么宗教信仰、仪式


    ### 三、会不会太理想化了？


    狮王辛巴：这种方式倒是很新颖，但在平时的的工作中可能经常有外界的打扰，容易_child乱这种方式，拒绝会不礼貌，不拒绝又会被打断，所以单纯地应用和想象这种方法是不是太理想化了呢？


    古典


    我们不是生活在真空，也无法完全按照自己的心意安排时间。


    事实上，其实任何工作都有人来打扰，但是你是不是被打扰到，这是个自我管理问题。


    每个人都经历过这些阶段，一开始学会抗干扰，慢慢地学会巧妙安排，最后有一天你也许可厉害到温柔地拒绝不值得干扰你的人。汉迪虽然用坚持了十多年的努力，达到了最后的理想化阶段。


    我们未来会有机会聊时间效能管理的话题，那时候一起深聊。


    在这个阶段，我给的建议就是——按照整体时间段算，不要期待这期间没有人打扰，但是提高自己抗干扰和被碎片的能力。


    ### 四、在地青年其实是个好出路，但是需要你自带链接


    众多读者：太多人提到自己家里资源很好，想做在地青年，就不一一摘录了。


    古典


    要提醒大家的是——在地青年需要有很好的当地资源，但更重要的是懂得与世界链接。只有畅通地链接世界，你在当地的资源才是有意义的。


    过去农村链接世界的方式是修路，通电话，路边的农家乐火了；然后是离家、打工，在外打工的人富了；今天是上网与参与社群，通过网络把当地资源推出去。很多人提到自己农村做微商卖大枣的隔壁二大妈一年赚几十万，其实实没变，是链接的人从收枣的变成了朋友圈大众。


    ### 五、如果你在你的工作后面增加一个“匠”字，会不会很多事情能更加安心？


    菲：在这个浮躁的社会中，原本一直很羡慕互联网和金融这两个高收入的行业。但今天发现古典老师说，“新工匠”也是一神未来新的职业形态和方式，嗬时才发现自己这个“医匠”的好处。


    其实在看过了医生高强度、高压力、低收入的工作现状时，我有过不下一百萬次的转行念头。每每读到“HR说：我真是不理解那些医生为什么要来医药企业？”的时候，我也是想对这位数HR翻上不下一百萬次的白眼。但今天突然把这句话读懂了，其实医匠就是一个服务业，要死磕自己然后给患者提供最佳的治疗方案，而且我已经在这条路上行走了近10年的努力，这就是我在在此时时代区别于大多数人的优势！何不继续精专下去呢？虽然金钱人人爱，但当有一天你独特的技能绽放出美丽花朵的时候，你既收获了精专、又收获了资产和意义感。


    古典


    很多需要长时间积累的职业，我们称为“法师系”的职业。和游戏里面的法师一样，前期没什么用，越到后面越厉害。这都是典型的匠人职业。


    这些职业在前期往往比较吃亏，那些只关注及时兑现的人心理一乱，估计就做不下去了。但在你的职位上增加一个“匠”字，也许会让你更关注这个职位漫长能技精进的本质。


    ### 六、关于工作的新领悟


    作为一个天天研究工作的人，我总在想到底什么是工作？


    生活是外来的字，中国人把工作叫做“谋生”、“营生”或者叫“生计”。


    这算是一种工作的定义，“谋取生存”稍带着有点正经；“生计”感觉有点儿，生存的计策。


    也有更好的说法——安身立命，在工作和手艺中得以安身，得以安心，在一个个劳动的结晶中，立起自己的命。


    日本的劳动者则非常看重职业中的“精进”。


    职人精神意味着：执着磨砺自己的技术，对自己的技术有自信，不惜时间精力，只接受自己认可的工作和意志。一旦接受工作，便超越利益心，把技术发挥到极致。


    工作对于他们来说，是一种自身的修炼，灵魂安放之处。


    西方资本主义的工作观，则很大程度上来自于新教徒——工作即荣耀，Work as


    于新教徒——工作即荣耀，Work as Wor-ship。


    德国的社会学家马克斯·韦伯 (Max Weber) 出版《新教伦理与资本主义精神》中指出，“商界领袖、资本所有者、有技术的高级工人，甚至经过高技术和商业训练的现代企业的员工，大部分是新教徒”。他进一步指出，新教坚持路德和加尔文的观点——基督徒在其社区的工作是一种呼召
    Calling（天职），这意味着工作的重要性不在于产生财富，而是服务人类给上帝带来荣耀。


    不管是哪一种关于工作边界的诠释，都有共同的内涵：


    投入、精进、敬畏、天人合一。


    我认为，工作就是一个人积聚所有最好的精力和技艺，全情投入到一件事情，并相信其有意义的状态。


    专注工作的人，极致的美。


    所以我非常感谢汉迪在学习、家庭、义务三个后面加上了“工作”两个字——这促使我们思考我们在除了上班以外对其他领域的存在态度。


    在家工作中，我是随随便便的敷衍，或者“交功课”，还是投入、精进和敬畏地做着？


    在学习工作中，我是每天告诉自己“得看一看”，还是投入、精进和敬畏地学习？


    在义务工作中，也许就是随手捐钱捐个衣服，或者为朋友圈的人拉个关系，我是想着“搞搞关系”，还是投入、精进和敬畏地工作？


    每次想想都一身冷汗。


    不过还好在给你们写字的时候，我是投入、精进和敬畏的。


    这一刻，无关好坏，无关点击，无关好评。仅仅是把世界上的知识链接过来，通过我的脑子，传递给需要这些讯息的人。


    虽然关上电脑以后累得要死，但在那些时刻，我们都是深刻又伟大地工作着的。


    今天是古典陪伴你成长的第 15 天，一起加速，成长为更好的自己。


