    # 下周预告：个体崛起时代，你的职业有什么可能？


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    这一周我们谈到了未来职业的新趋势：新的职业坐标系、高感性能力、跨界融合后新职业赛道……


    未来已经来临，只是尚未流行。在后续的讨论和互动中，我们一起聚集起来的点状信息，让这幅图像前所未有的清晰起来。


    +   1. 规划化-技术化-信息化，让原有技术模块强大独立运营

    2. 持续差异化带来马太效应

    3. 依靠中间商、信息差、价格差的业务正在衰落

    4. 能被规范化的基础体力、脑力活动工作正在衰落


    下一周我们会继续探讨：


    +   在这这种职业环境中，最好的职业策略是什么？

    自由职业者是一个好的策略吗？

    什么叫做组合式工作？

    还有哪些正在越来越流行的职业形态？

    你看到了身边有哪些让人觉得是代表趋势的职业形态？


    还有下面这几件事：


    # 一、专栏更新时间调整到早上6:30。


    专栏上线一周，很多人反馈说：为什么一档讲职业发展的节目要在0点更新，听完又激动半天，这样下去怎么发展职业？我们商量了下，调整到每天早上六点半发。早睡早起，为革命干100年。


    如果你是早起党，听完罗胖的微信60秒语音来这里就正好；你也可以在上班路上听，然后中午吃饭的时候转述出去，这让你学得更加深刻。


    习惯晚上阅读的同学也可以晚上来报道，这样也有更多时间在文稿区留下你的思考。


    # 二、上周六邀请大家一起聊的问题——


    +   1. 这一年你对栏目的期待是什么？你希望它带给你些什么？

    2. 如果让你来策划这个栏目，你会带来什么不一样的玩法的建议？

