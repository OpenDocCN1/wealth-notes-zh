    ## 怎么跟领导汇报更有效？ 10-3


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    ## ——一个观察——


    下面是小张年终述职时的一段对话，听听是不是似曾相识：


    领导：小张，今年的业绩怎么样？

    小张：今年的销售额是2亿，第四季度的利润是……

    领导：所以呢？

    小张：啊！……好像还有……

    领导：所以呢？

    小张：去掉各种支出的成本是……

    领导：哦，所以业绩是好还是不好？

    小张：哦，比上个年度有所提升。

    领导：可以啦，我知道了！


    为了回答别人的不耐烦，你丢出来越来越多的信息，却导致更多不耐烦。其中的关键在于——听者想知道的是结论，你给的却是数据、事实。听者希望听到条理清晰的要点，而你给的却是碎片化的零散信息。一万粒沙子也成不了
    一个金字塔。


    ## ——一个概念——


    前面两天我们谈到了结构思考力的“论证类比”、如何“自上而下”地说服他人，今天我们分享一个“自下而上总结归纳”的方式，教你通过收集信息、归类分组和概括总结三个步骤，解决这个问题。


    ## ——一个策略——


    下面，我们说说具体怎么做。


    ### 第一步：收集信息


    这个步骤比较简单，把一年中重要的事情一股脑罗列出来。如果你有做工作日志的习惯，这一步会更简单。


    ### 第二步：归类分组


    分类有两种方法：一种是开放式分类，另一种是封闭式分类。


    - 1. 开放式分类：运用结构思考力的MECE原则，确保把主题分清、分尽


    MECE（Mutually Exclusive Collectively Exhaustive）是麦肯锡提出的一条分类的基本准则，意思是“相互独立，完全穷尽”。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_88_0.png)


    ### 第三步：概括总结


    当归类分组已经完成，就可以把各个要点概括出一个结论。然后，继续向上推论，一步步推到金字塔结构的塔顶，推导出最终的结论。


    ## ——一个总结——


    今天我们学了一个“自下而上总结归纳法”——通过“收集”、“分类”、“概括”这三步，就能把零碎信息整体化。其中，MECE原则和思考模型是在“分类归纳”中经常运用的两类方法。


    ## ——今日精进——


    - 1. 实践：找一张白纸，尝试用这个“自下而上总结归纳”法来整合你的信息，它可以是你的年计划、年总结、一本书或者本文的结构图。

    - 2. 来个小练习：


    比如，假设有人想给你介绍男朋友，你问那个男生怎么样啊？


    对方给你的回答是：


    - 个头高高的

    帅极了

    富有人情味儿

    思考的逻辑性很强

    记忆力也是出类拔萃的

    待人和蔼可亲

    擅长数字方面的计算

    是个非常潇洒的小伙子


    你会怎么说？


    超级个体


    MECE 经典模型


