    # 3-5 问答 | 抱怨的背后，是一次成长的机会


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    ## 1. 每个抱怨都有正面意义


    抱怨不是坏事，抱怨背后是有良好的期待，通过抱怨可以理解自己的需求。


    抱怨之所以是坏事，因为你把满足自己需求的期待放到了别人身上，所以也和成长无缘了。


    比如这位做运营的朋友：


    > 小冰：最近刚抱怨过。我是做运营的，经常会跟用户打交道，有时用户因为其他同事的工作问题投诉，会第一时间找我，我没法解决，就只能把问题向上反映，告知用户需求。但是好像部门领导无动于衷，他们觉得这不是大问题，不着急现在解决，就一直拖，用户这边就一直来“烦”我。这个时候我就有了烦躁抱怨情绪，因为确实感觉自己无能为力。


    想请问老师，在这种情况，我可以有哪些在我能力、权力范围内更优的解决策略吗？是不是“阐述问题严重性”这块的能力欠缺吗？


    坦诚地说，做运营工作就包括了客服，客服就包括了接骂，这是工作的一部分。接纳了这个以后，我想你正好可以提升一种“把问题系统整理，在组织高度指出重要性，并且说服其他同事配合的能力”。


    同样也许下面这位小伙伴的案例更有说服力。


    > Cindy申：曾经看到一句话，“当你的能力不匹配你的野心的时候，就应该去学习”，这几年也一直向这个方向努力。今天古典老师的这一刻更让我认识到，自己对公司系统运行速度缓慢的抱怨，其实是一种焦虑，只是抱怨，而没有想办法解决。这一点我的老板就做得很好了，她收集下面同事的反馈，做表格，把系统的每一项数据量化，并提出建议，层层上报。所以她的百万年薪不是凭空而来的。


    所以每个抱怨背后都蕴藏着行动的可能性。


    > Alice Liu：最近一次抱怨就发生在昨天，我认为学校目前给我的待遇太少，与我的付出不相符。这反映了我经济方面的需求，在资源利用方面的能力还需提升。今天上午与领导沟通，了解领导的要求，我也反映了自己的需求，事情得到较为满意的解决。


    不匹配一抱怨一觉察需求一开始行动一自己成长，或者外界改变一重新匹配。


    找到抱怨背后的积极意义，就是重新匹配的开始。


    ## 2. 做一个会领舞的人


    很多人职业中跟随得非常好，但是不太会领舞。下面两个都是例子：


    > JanusChoi11：在公司内部看不到将来的路。公司对个人的职业要求也是越来越不明显，我曾明确问过老大，现在我们部门的定位和将来的方向是什么，而得到的答案却是连他自己本人也不知道。


    > 『白岛·光崎』是白小姐的家：刚进项目部的时候，感觉自己进步非常快，因为什么都不懂，所以每天都在学习，那时候很忙但是很快乐，这是资源策略的阶段。但是 一年之后，我渐渐把手头的事情都学会之后，就开始心生懒惰，会做的事项还经常拖延，以致于后来马虎对待，新的东西没有想要主动去深入挖掘，就这么过了
    一年半。这一年半开始有很多抱怨，陷入了一种不自知的迷茫，但是最近渐渐觉醒。


    职业领舞，其实也就是自我领导的一种。有三种主要的思路：


    - 1. 懂精评带：从组织发展来说，如果你懂了工作，有没有做到精专？有没有一项比你的同行都要好的技能？如果你做到了精专，能否清晰地评判别人做得好不好？如果能评判别人，能不能带一些人出来？

    - 2. 职业趋势：你所在的行 业和职业正在发生什么趋势？也许单位看不到或者并未执行，但是你应该进入同行同业圈让自己进 步。要领舞组织。

    - 3. 爱好与事业：有没有什么你特别想从事的？可以开启“两栖人”策略，组织和个人体系同时推进，恰当的时候转换。


    下面有个小伙伴给了一个好案例：


    > 张建奇：昨晚看了罗辑思维校园招聘直播的视频。脱不花说她最近招了一个人，因为那人每天将罗胖的60秒语音拓展写成一千字左右的文章，然后坚持了一百天。看上去似乎罗辑思维这么好的公司是零门槛，谁都可以去。


    有800万人听了罗胖语音（跟随），只有他做到了这件事（领跑）。这就是领舞策略。


    ## 3. 现实理想主义


    女士优先，先聊两位女性的案例。


    凯瑞提出2个案例很有趣——职场女性如何进入发展期？


    > 凯瑞carrie：有个朋友小A，在外企做行政工作，收入算一般，业余研修德系芳疗和塔罗牌，师从业内知名大师，小有所成。我一直鼓励她把爱好变现，而她自己也热爱业余爱好，多年来慢慢地用自己的方法推广变现，但是效果一般。这个朋友的现金流并不差，过得温饱有余。她明白发展期和生存期的道理。但是她仍然没有能力突破心里的设限，把爱好脚踏实地地变现。这就是什么道理都懂了，还是过不好这一生。她需要的不是道理，而是突破的方法。


    我的看法是：

    小A的问题不是没有发展期，而是没有找到“德系芳疗”和“塔罗牌”的变现方式，既然有“业内知名大师”，想必行业是有职业发展路径的，只是愿不愿意、能不能成而已。所以一定要区分爱好和职业，如果是爱好，就回去做好职业；如果是未来职业，就积极探索成功需求。


    小B的状况是一—她本身把家庭主妇当成核心事业，工作是一种调和的方式。家庭主妇绝对是伟大的职业，是帮助家庭走过三阶段的重要职位。当然，这个职业也需要大量的学习发展。


    要知道，三阶段只能加速，不可跨越。

    今天是古典陪伴你成长的第22天，一起加速，成长为更好的自己。


