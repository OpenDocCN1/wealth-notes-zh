    # 什么方法能让你瞬间进入状态？ 8-4


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    后台有不少人问我，有没有瞬间能提高一个个人精力状态的方式吗？


    你别说，还真的有，方法就是——设计一个进入状态的“仪式感”。


    仪式感是一种通过执行一系列仪式，迅速聚集思想精力的方式。


    比如日本的“职场女神”——胜间和代，她19岁就创纪录地通过了日本注册会计师考试，2005年被《华尔街日报》评为“全球最值得瞩目的50位女性”。在一次采访中，胜间和代提到当年准备注册会计师考试时，每天都会放一面镜子在写字桌上。从镜子放上去的那一刻起，她就会看见镜子里的自己，然后全心身投入到工作状态。因为一旦懒惰，她看见自己一目了然。


    我的朋友“劈悍一只猫”，好几个月，他常常是晚上11点坐在电脑前，开始琢磨写什么，11:59，准时推送。这个听上去很反直觉，难道不是平时写好放着，需要的时候发吗？其实这是一种仪式感——11点是他的一个触发条件。11点前，潜意识都在后台加工信息，到了11点，大脑会在这一个小时之内高速运转，完成文章。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_73_0.png)


    # 1.设计“一句话动机”


    所有仪式背后都是一个清晰指向的动作或者状态——比如“专注宁静”，比如“连续读书30分钟”。你可以把所有的仪式简化成一句活动动机：


    - 你最希望自己以“什么状态做某事”？

    - 救火队员——“一旦警报响起，最高速度奔向火场”

    - 医生——“一旦打开无影灯，放下一切面对手术”

    - 运动员——“大吼一声，蛮奋地进入对抗”


