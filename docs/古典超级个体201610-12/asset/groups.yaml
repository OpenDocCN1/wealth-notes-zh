    # 鸠猪去看海：什么叫做弱关系（Weak Ties）？


    著名社会学家、斯坦福大学教授 Mark Granovetter，曾长期在上世纪70年代专门研究了在波士顿郊区居住的专业人士、技术人员和经理人员是怎么找到工作的。


    Granovetter找到282人，然后从中随机选取100人做面对面的访问，发现100人中有54人是通过个人关系找到的工作。


