    # 说服中最难的，就是自问自答 10-4


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    各位朋友，我刷了大家的各种说服逻辑和年度总结。


    有说服领导加薪的一—这个占大多数，不知道有没有成功？有说服老公接孩子 的，有说服客户单单的，还有说服对方嫁给他 的……


    大家都逐渐掌握了架构，也逐渐发现了吧 ——说服最难的一点，就是站在对方的角 度，自问自答。


    # 如何贴心地自问自答？


    有人要说服领导让他讲时间管理，他的理由是：


    +   1. 很多员工有需求；

    2. 我讲得不错；

    3. 从外面请人贵。


    这个已经有说服意识啦，大概7分。但是我作为一个管理者，真正关心的是：


    +   1. 真正的成本是大家的时间啊！浪费大家的时间赚得回来吗？

    2. 你讲的东西会不会和我的管理制度有冲突？

    3. 怎么才算有结果啊？


    所以如果你能这么告诉我——


    +   1. 现在遇到效 率的问题是时间管理造成 的。

    2. 两小时的培训能有效地解决一部分问题，提高效益。

    3. 我水平高而且愿意免费。


    现在请教下，领导你有什么还需要我传递 的吗？


    我就爱死你了。


    那么如何更好地提高自问自答的能力呢？我总结应该有3条。


    # 1.搞清楚对方职位的核心指标和站位


    有个故事说国际航班失事，机长要乘客跳伞，结果怎么都说不动。一个空乘说我试试看。过一会回来报告——机长，他们都跳了！


    怎么做到的？


    我对法国人说，在空中跳舞很浪漫，他们跳了；对英国人说下面的法国女生需要你们保护，英国人跳了；对美国人说这是冒险——他们跳了；对日本人说美国人跳了，他们跳了；最后是拿中国人开玩笑的——对中国人说洋人
    都跳了，他们也跳了。


    笑话说的就是要理解每一个人的站位和价值，然后才说服。


    在你向上、跨部门说服的时候，记得搞清楚两个问题—他的核心指标是什么？最近他在为什么发愁？从中间联系你的理由，就简单了。


    # 2.答案准备充分


    这一点，超级个体xixi自我挖掘很深入。


    xixi：我大学毕业后这几年的工作中，其实很少去说服别人。这不是我与世无争，而是因为：


    +   1. 自己缺乏深入思考的能力、很少有好的想法；2. 以前有提出过想法，但经常会被领导否决掉，所以慢慢地我就丧失去说服别人，尤其是说服领导了。


    所以，看到“今日精进”里的练习是说服一个人时，我的第一反应是我没有可以说服的对象……因为我刻意地回避了工作中很多的矛盾点和突破点。


    所以——不是与世无争，而是没有做好争斗的储备。不是不会回答，而是没有做好准备回答。


    同样道理——老师我天生内向不擅长交往怎么办？


    很多时候你不是内向，而是害羞；更精确地说，你还不是害羞，而是准备不够。回家结构思考去。


    # 3.阅历


    那些不会明说的规则、担心和想法，只能通过阅历和反思学到了。常说“养儿方知父母恩”，没有经历过的人也许真的无法理解带孩子的艰难。阅历不一定是直接经历，多听别人谈，多看文学或电影都是体验。


    也常常有不少经历很多依然没什么智慧的人，因为阅历阅历，最关键是“阅”字——反思很重要。


    总之，自问自答是最重要的说服力之一，也是销售、营销、传播、领导力的本质。自问自答是说服中最难的部分。


    # 贴心的、透彻的、穷尽的自问自答


    苏娥漫：像这样从“what、why、how”的大层面去阐述一个问题，会不会让领导觉得你是在战略角度给他们教授怎么去实现目标，这不会会有点……


    绝！对！会！啊！


    所以你不会真的这样开始吧——“各位领导，来，看看这里，为什么我们要做这件事呢？”不会这样吧？


    最后再提醒一次！结论先行。你的标题一定是“加薪能提高20%的效益”这样的结论，Why、What、How是背后的隐藏逻辑。


    瑞尔~宋雪梅：11月感恩节想申请一批费用，用于购买水果回馈客户，我是这样写的：为什么回馈，回馈具体多少金额，如果不回馈会怎样。


    结果老板回复邮件说：我到底几个客户？这些客户是我的重要客户吗？为什么金额是那个数？怎么分配？这几个客户喜欢什么？有孩子吗？为什么选择送水果？怎么送？送家送办公室？现在申请得及吗？……总共发了12个问题来，我一看蒙了。好想拍他！


    这属于给了why没有what和how，有论点但是没有穷尽。MECE缺一半。所以要给结论，要独立，也要穷尽。简单来说——贴心的、透彻的、穷尽的自问自答。


    # 信任就是这样逐渐建立的 ——我自己做管理者的时候，如果大家给我汇报的时候经常自动说What和How，我会知道这个人心ávat可数，慢慢会抽查，最后不过问。如果他完全一问三不知，证明这个人思考深度不够，需要修炼。


    当然，有些领导喜欢刷存在感——那就偶尔露个怯让他改改，让他刷下。这也是结果思维啊。


    # 触类旁通的思考模型


    还有很多超级个体们从中发现了，同样类似的结构在很多其他领域触类旁通——并不是碰巧，而是我们大脑理解事物就是5W2H——这是一个规律。


    Lucky蓝孩：想起以前看到的关于面对面销售的六大问题，发现就是“5W1H”的模式，我的答案仍在不断修订中，仅把问题分享给需要的朋友吧。


    +   （1）Who：你是谁？

    （2）What：你要跟我谈什么？

    （3）Why：我为什么要跟你谈，你谈的事情对我有什么好处？

    （4）How：如何证明你讲的是事实？

    （5）Where：为什么我要在你这个地方买？

    （6）When：为什么我要现在跟你买？


    听早雨：今天老师讲的内容，跟《金字塔原理》里提到一个好故事的典型套路（SCQA）很相似：


    +   （1）背景（situation）：介绍背景，确保说话时，你和其他人在同一个背景里面。

    （2）冲突（complication）：推动故事情节发展，并引发对方脑子里产生下一个疑问。'
  md: '

    用结构思考做清晰有力的年终总结 10-1


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    10-1 用结构化思维做清晰...


    ## —— 一个观察 ——


    就要开始做年终总结了，但是却杂乱无章？我们先看某年终总结。


    2016年我成功举办了两场全国性的市场活动；完成了职业生涯认证班的学业，2017年可以获得证书；儿子考研成功，并帮助他步入学业正轨；学习《结构思考力》获得了“精英学员”称号；获取了社群学习、超级个体等新概念；帮助了600名学生入学；亦兔等平台学习让个人成长思路打开；帮助侄女留学成功，弟妹和父母成功获得了加拿大签证……


    看完这样一个年终总结以后，你有什么感受？


    没错，一个字——“乱”。尽管说了很多年内完成的事情，但听的人完全不知所云，一个也记不得。


    没有要点、杂乱无章的年终总结往往对他人没有任何说服力——人的大脑只能接受“结构化信息”。


    ## —— 一个概念 ——


    何为结构？


    结构可以说是万物之本。在物质世界，大到太阳系是结构，小到颗粒尘埃原子分子也是结构，世界太复杂，我们通过结构来简化世界、认识世界；在思维世界，人们也同样通过结构来认识事物、认识其中的规律。


    何为结构思考力呢？


    结构思考力就是通过结构的方式来系统思考的能力。


    举个例子：如何把200ML的水装入到100ML的杯子呢？


    按照你的经验，可能...


    杯子太小：换大杯子、拿两个杯子、换个像气球一样的杯子……


    水会流动：冻成冰柱、用一个袋子装起来……


    外部环境有引力：放到太空中去、放到无重力的实验室中……


    ![](img/b7067422984faf05bb36fe56d6d8faf5_84_0.png)


    结构思考力的核心理念源于麦肯锡的“金字塔原理”，1973年由麦肯锡国际管理咨询公司的咨询顾问芭芭拉·明托发明，为了更好地阐述写作过程的组织原则，提倡按照读者的阅读习惯来改善写作效果。经过40多年后人的优化、整理和应用，形成一套结构化思考和表达的方式。


    你可以想象一棵向下生长的树。纵向结构上每一组的观点都必须是其下一个层次观点的概括。横向结构上，每组中的各个观点互不重叠且有一定的逻辑顺序。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_84_1.png)


    这个图看上去很像一座金字塔，所以也叫做金字塔原理。


    金字塔形成了一个严谨的逻辑体系。通过这样的方式总结，就可以通过迅速抓住我们要的主旨，帮助听众沿着我们的思路去理解内容，表达和沟通都会清晰高效很多。


    ## —— 一个策略 ——


    结构思考力的四个核心原则：


    ### 原则1：【论】结论先行，先说结果后说过程


    因为从听者的角度来讲，都特别希望在接受信息的时候知道对方总结出的结论是什么、工作结果是什么，而且希望能最先听到。


    不过遗憾的是我们日常的表达习惯正好相反，比如一位多年不见面的老同学，见面结果聊了半个小时，结果前28分钟都回忆当年的校园生活，最后2分钟临走的时候说：“这次来主要想……借……点……钱……”


    ### 原则2：【证】以下证上，下面的数据证明上面的观点


    每个主论点都是下面的论点和数据的概括。每个论点也都被下面的事实所支持。


    我读行业报告时，如果是一份优秀的报告，有时会看看PPT内容，没时间就直接看标题。因为下面的内容是支持主结论，而结论就是PPT标题。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_84_2.png)


    ### 原则3：【类】归类分组


    分组时，你会发现有的关于工作，有的关于家庭，有的关于学习，这时你需要把这些内容进行分类，分类之后，表达会变得更加清晰。


    这些类别最好是彼此不交叉的，比如说工作、学习、家庭生活就挺好。但是如果分为工作、学习、社交，就可能会有交叉。


    ### 原则4：【比】逻辑递进，有一定的逻辑顺序


    有顺序，能让人更容易理解和记忆。常见的逻辑顺序包括时间、重要程度、结构顺序三种。平时表达时，就可以按照这些顺序来说，比如SMART原则。


    综上，运用四个原则修改后的总结应该是：“2016年我的人生多维度平衡发展：工作业绩超额完成，获得学习成长，孩子学业有成、家庭关系融洽。”


    ![](img/b7067422984faf05bb36fe56d6d8faf5_84_3.png)


    有了这样一张结构图以后，你可以在短时间内，把任何一件事说清楚、说全，只是深度会有不同而已。


    比如说你只有一句话时间，那就说结论；有1分钟时间就说第二层；3-5分钟你可以说第三层；30分钟，则可以抓住一个故事展开来说。如果想深入，你可以再往下，再展开来介绍。


    这样一种表达方式，背后隐藏的就是一张金字塔结构图。


    如果你花30秒说不清楚一件事，那么给你30分钟、半天时间，你也未必能说清楚。最重要的是区别，就是你有没有这样一个清晰的结构。


    ## ——一个总结——


    结构思考力是一种强调体系化的思维。


    核心原则可以用四个字概括，即论（结论先行）、证（以下证上）、类（归组分类）、比（逻辑推进）。


    ## ——今日精进——


    如果让你用100字总结你的2016，你会怎么说？记得用结构思考力的方式，在留言区留下你的记录。


    另外，“超级践行者”活动已经收到不少践行的好文章，未来我们会不定期展示出来。现在还在征稿中，如果你在践行，让我知道，好不好 :) 具体活动介绍，看文章9-6。


