    ## “这个工具真好，为什么我没早点遇到” 6-5


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    这俩天收到许多朋友关于实践WOOP的留言，很高兴看到大家的行动。留言区有一片“恍然大悟”之声——为什么我没有早几年遇到？


    我的回答是——如果你不从今天开始用，过几年还会有一个新的工具让你觉得“哇，为什么我没有早几年遇到？”


    其实我们时常遇到能改变我们命运的工具、文字和老师，只是你并没有把你的时间、精力真正投入进去。


    ### 怎样才算是用好WOOP呢？


    其实关键是——


    持续使用，一直用到你不需要一个模板，而是通过大脑就能自动WOOP。比如，WOOP“每天三件事”，就是个很好的练习，持续一个月基本就能变成自动的思考模式了。


    ### 一、每个障碍背后，问自己3个为什么


    > 薄荷红茶：今天看了WOOP模型后，也列出了三件自己的WOOP，在列过的过程中才发现，原来之前自己都是在找借口，因为这些事情并不会因为各种原因而无法去做或推进，只是因为自己本能恐惧和拒绝这种可能出现的障碍，并且从来没有认真想过if…then…这样的Plan
    B或者C。在列完表之后，自己清晰多了，发现很多事都能正常推进了。


    我看到很多人 在“障碍”（Obstacle）一栏写了累、惰性、时间不够……，这些当然都是障碍。那么，你愿不愿意在此基础上，继续追问三个“为什么”，以便发现更深层次的心理动机。


    电影《瘦身男女》中，刘德华和郑秀文饰演了两个努力减肥的超级胖哥、胖妹。


    - 1. 为什么郑秀文饰演的女主那么胖？

    因为她总忍不住吃东西，而且食量超大。

    2. 为什么她总忍不住吃东西？

    因为她失恋了。

    3. 失恋就要不断吃东西吗？

    因为她痛苦、自卑——她的价值是建立在别人认同上面，而进食可以短暂分泌多巴胺，让她感到放松。


    在电影最后，当她意识到什么是真正的价值和爱情时，大团圆了。


    肥胖→暴食→分手→自卑


    随着对于“障碍”这件事情理解的加深，所有的外部障碍都会越来越清晰地指向内在障碍。这些障碍大致有这么几类：


    - 不接纳真相：对于外部情况的变化，对于真实自己的不接纳，导致拖延或负面情绪。

    缺觉察：以前关注不足，根本就没有想过类似的事情。

    缺能力资源：自身某项能力或资源不足，比如高效能、自我管理的的能力，比如社会关系。

    缺乏知识策略：遇到某个情景不知道该如何处理，缺乏知识，需要学习。


    ### 二、怎样让WOOP动起来？


    ### 1. 从小的WOOP开始


    ### 2. WOOP需要不断迭代


