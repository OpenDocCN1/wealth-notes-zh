    > Tony Zuo： “执行意图”，又是一个新的概念。以前总觉得别人好牛，台上唱歌那么好听；领导大厉害了，不看稿子可以讲得那么富有感染力。现在才知道这完全不是临场发挥，而是无数次演练的结果……


    其实不完全对，就像在牛顿发现“地心引力”之前，“地心引力”一直存在，只是没有被大家察觉到一样，执行意图一直也是有的，不过过去你通过动物的本能或者拍脑袋去制定。这些意图往往是：


    - 如果遇到困难，那么，我就放弃算了。

    如果有点累，那么，我就马上休息。

    如果领导质问，那么，我就手足无措。


    所以再强调一次——没有临场发挥这件事，所有的发挥都是刻意思考的结果。你要非常努力，才能看上去毫不费力。


    归根结底，WOOP是一个工具，可以拆开、调整或迭代升级。在这个过程中——我们反复打磨与外界的互动关系，更好地了解自己，也更好地理解客观世界，从而提高判断力，增加成功概率。


