    # 4-2 像顶级跨界高手一样，萃取你的核心能力


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    4-2 能力萃取


    # 超级个体


    ![](img/b7067422984faf05bb36fe56d6d8faf5_34_0.png)


    起我场加速的第26天


    能力萃取是所有跨界者的绝招之一。它的前提是，你真的在跟明白人的笨功夫，让生命中有够可以提炼——做得认真，玩得努力，生活得全力以赴。


    昨天我们说了一个概念：比学习技能更重要，是迁移技能。今天我们单刀直入，谈谈如何找到自己可迁移的技能，并且把它迁移到新的领域去？


    其实，这需要一个重要的技能——“能力萃取”。


    先谈谈看萃取的概念——是一种用溶剂来分离混合物的方式。很多浓缩茶、茶膏就是用萃取的方式做出来的。先做成茶汤，然后用工艺来提取里面的精华。部分合成药也有用到这种萃取方式。


    # —— 一个概念 ——


    什么是能力萃取呢？就是从你过去的成功事件中，提取出来能力精华，然后放到另外一个领域去的能力。


    举个例子，比如说你今天参加了一个朋友聚会，介绍自己时你说：


    > “我篮球打得不错，带团队拿过全市篮球比赛第一名”


    大家都说“哇”，然后呢？以后他们打球也许会叫上你。


    但是如果你这么说呢？


    > “我篮球打得还可以，大四的时候带团队拿过全市篮球比赛第一名，那是我们学校历年来第一次进入前三。其实我的身体素质不算出色，所以我选择做后卫，做后卫就要把中远程投球做到最好。人应该有死磕一个技术到完美的能力，所以我的中远程投还不错；带团队的时候，我还学会了如何让一群牛人通力合作，培养了我的领导力；有一次我们差点出局，我却认为这是一个反败为胜的机会，在中场休息时做了一个演讲，激励了大家。后来我看了一本书，才知道原来这个叫‘逆商’。现在遇到一个新事情，我就会应用这种做事的方式——先看清全局找到自己的站位，然后反复精进让自己一个优势做到最好；再带领一群牛人，让他们相互协作；一旦遇到低谷，我觉得这反而是一个机会，我会让大家逆势而动。”


    你说这个故事说完，以后大家会找你干嘛？至少当他们做管理、带团队、创业时，会想到你。


    我把这个故事讲给我们插画师，讲完我问她：你觉得这个人有什么能力呢？她说这个人好会讲故事啊。对，能力萃取本身就是一种讲故事的能力，是在把自己更好的一面营销出去。


    能力萃取是所有跨界者的绝招之一。在上世纪70年代，管理是个新兴领域，所有管理大师都是原来领域的萃取和跨界者。日本管理大师大前研一以前是核物理博士，他把研究和写论文的能力萃取出来做成了企业管理研究。今天如果你能够从过去的经历中萃取出核心能力，迁移到新领域去，你也有机会成为大师。


    我估计你也看出来了，技能萃取有三步：


    + 1. 讲一件你的确做得不错的事；

    2. 萃取出一个不明觉厉的名词——xx能力，让大家理解这是怎么能力；

    3. 告诉或者暗示大家，它对于你的新领域有什么用。


    # —— 一个策略 ——


    # 1.想想你之前做得很不错的一件事是什么？


    + a.可以从之前的工作里面挖，工作时你有没有做过什么成功的事件——即使是一件小事？


    比如说你帮公司选择电信供应商时，虽然是一件小事，但如果你真的对比了几家报价，还电话过去讨价还价，帮公司省了2000元一年的电话费（说30%的电信费用更有想象力），是不是证明你有“数据分析能力”和一定的“谈判能力”，同时还显示你很有责任心呢？


    + b.可以从爱好里面挖，你有没有把什么爱好、兴趣、小团体做到过极致？——即使是一件小事？星巴克CIO史提苏（Stephen Gillette）同时也是魔兽世界的70级祭司，游戏公会领袖；他每周坚持打6个小时游戏，因为他认为自己从游戏中学到了关于领导和管理核心。


    + c.可以从生活里面挖——你有没有哪一方面特别的出色？


    # 2.给自己的能力封一个对方能听懂的名字：


    日本生涯专家大久保幸夫写的一本书《12个工作的基本》，详细地谈到了他认为的12项基本能力：反应力、亲和力、乐观力、目标发现力、持续学习力、语境理解力、专业建构力、人脉开拓力、委任力、商谈力、传授力、协调力。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_34_1.png)


    # 3.落地到一个新领域


    当你去一个新公司面试，向别人介绍自己的时候，或者你在面临一个其他情景时，回看一下这张能力表，想想今天我还有什么能力可以被萃取和迁移过来的？


    最后，关于技能萃取，到底什么是忽悠，什么是真的萃取？


    # 什么是真的萃取？


    两者的差别在于，你有没有把一件事真的做得不错。这件事中间，你下了聪明的笨功夫，然后你可以把这个能力带到新的领域去。如果你做过，那就叫萃取；如果没做过，那就是忽悠。


    听到这里你也会明白——即使你不喜欢工作，这都不是问题，问题是你有没有拼命地玩，拼命地生活？——如果你连玩都是初级选手，连玩和生活都不努力，你的生命又有什么值得萃取的呢？你面对生活、工作和爱好的态度，就是你面对人生的态度。


    # —— 一个总结 ——


    我们今天找到了能力萃取的三步：


    + 1. 找到一件成就事件

    2. 萃取一个能力名词，最好是不明觉厉的

    3. 落实到一个新的领域去


    能力萃取的前提，是你真的在下聪明的笨功夫，让生命中有精华可以提炼——做得认真，玩得努力，生活得全力以赴。


    # —— 今日精进 ——


    + 1. 你有没有把一件事做到过自己很满意的经历？

    2. 如果让你从这段经历中“萃取”1-2个能力，那是什么能力？

    3. 这些能力对于你当前的工作、挑战和困境有什么支持？


    根据这些思考，把自己一段经历中的能力“萃取”出来，作为自己的能力标签，发到朋友圈，还可配上今天的工具图。


    > “【超级个体】我的能力标签：我曾经……（一段经历），这让我学到……能力/这让我意识到我有……的能力（可迁移能力）。我可以把这些能力运用到……（新领域）去。”


    朋友圈验证法：


    之所以要求是朋友圈，因为这个能力标签必须真实、可信、也符合大家对你的印象——如果你能在朋友圈发出去，证明这句话已经过了这三个要求，也是你自我营销的好方式。


