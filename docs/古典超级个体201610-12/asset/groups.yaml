    # 与“干扰”和平共处的5项原则 7-4


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    # 如何防止计划总是被打乱？


    看到很多超体留言：在时间管理方面，面临的最大问题就是经常被打乱！计划本来“完美无缺”，可是，老板突然交付的任务总不能不做，同事过来沟通总不能不理……


    石头书：最困惑的是任务的不确定性。该怎么面对四面八方而来的不确定任务，现实将计划敲得一地鸡毛。


    阳光：下属和横向部门及合作伙伴与我对接的时间我可以提前安排，或因手头的事情拖延与他们的交流时间，但上司总是想到什么事就会立即把我喊过去落实，大家都明白，上司要求的事特别
    planting急的事，我们总要想办法优先去落实，这就会出现不定时被打断的情景。


    进化心理学说，我们都是“认知上的懒散者”，总是倾向选择思维阻力最小的那条路——大脑太懒能了。我们的瞬... 不自觉地遵循“刺激—反应”的惯性，不假思索地抓住脑海中出现的第一个任务，然后一心一意地做起来。


    比如，打开邮箱就忍不住一封一封回复起来；或者被别人的需求和指令拉走。忙碌一整天，那些更重要、高价值的工作反而没做。碎片化时代很容易制造“虚假的勤奋”。


    对于“时间管理”，大家似乎有一个想当然的理解：时间是可控资源，我要调用时间资源去做事情。但在“永远在线、随时干扰”的碎片化时代，“打扰”也应该是时间的一部分——那么，如何防止计划被打乱？


    你没法防止，不如学习与干扰共处。下面是与干扰共存的5个技巧。


    # 1.做时间记录


    我原来发起“每天三件事”的活动时，常常有人说，就三件事会不会太少？其实你真实记录时间就懂——一天做好3件事非常花时间。正确地评估自己的时间效能很重要，你应该尝试下时间记录法。


    +   - 记录每天每隔1小时做的事情，然后分类（例如：开会、刷朋友圈、工作等），持续一周。

    - 一周以后分析下，你到底多久能做什么事？哪些是重要的干扰源？

    - 逐渐理解自己的效能与外界不确定程度，制定一个包容不确定性的计划。


    # 2.80%法则


    按照80%的时间设计工作量。


    如果你每天工作8小时，那么你有80%（6.4小时）的未被打扰时间，就已经是非常厉害；大部分人的完整时间在60%（4.8小时）以下。


    # 3.主动干扰


    没法抗拒干扰，就主动干扰别人。

    别人约你说“有空吃饭啊”，你说“好”。可是，有一天人家到楼下给你发“下楼”，你也许正准备明天要交的PPT。

    更聪明的做发是，你可以先说，“好！我来看看哪天比较方便，下周二可不可以？”


    在国外，越是好的餐厅越是需要提前预约，提前一两周也是常事，因为食客需要提前准备——这意味着你提前约人去好餐厅吃饭几乎要提前三四周。


    做大会请嘉宾也是一样——人们对一两个月的时间看得很紧，但是对于三个月以后几乎没有什么概念，往往提前三个月，大咖的时间就很容易约到了。


    # 4.创造环境


    时间管理在某种程度上说是反社会的。与其动用自己的注意力，来抗衡整个社会对你的注意力分散的“阴谋”，不如让环境配合你。


    +   - 断网：手机调成静音、飞行或者关机状态；

    - 用10分钟统一关掉各款app的通知功能；

    - 工作时戴上耳机，一方面减少噪音干扰；一方面也是个标志——让别人打扰你有点不好意思；

    - 带着笔记本去会议室、咖啡馆躲上一两小时……


    # 5.管理老板？呵呵


    凯文·凯利在《新经济，新规则》中提到，未来的广告将会免费强制播放，当你不想看广告的话，你得付费去除广告。


    提这个是关于老板打扰的事——老板的干扰有点像广告，这事其实无解——你的断断续续工作，换来的是他的连续工作，你是付费被打断的。


    出路只有2个：如果老板不改，你就提高自己的抗干扰能力；如果老板可调教，你可以训练下他——用相对延缓的方式回复他的碎片化指令（负强化），并对于他整合的需求迅速回答（正强化）。


    玩得开心。

    当然也不是所有老板都不靠谱啊，下面这位老板讲的东西就非常赞，是一个优质留言。


    温晓春：刚入职场时，我很敬重的一位领导跟我说：“你们这些人哪，都是太懒，做的写事，水准都很差！我说的很懒，不是说单纯做事情的懒，而是懒得动脑。

    “我们要像扫描仪一样，随时扫描身边发生的一切，先印在脑子里，然后根据你已有的经验及你的需要去判断是否有用，是否和以往的认知一样，不一样的进行修正。

    “持续地去做，等你要用的时侯就会很快速地从脑子里调取到你要用的资源，就像银行存款一样，你存得越多，就有机会取得越多。”

    十几年过去了，我很感激老领导的教诲。


    还有不少朋友也分享了他们的“实战经验”，都非常好，摘了一条分享出来：


    董少毅：1.手机静音，统一回复。我的手机基本 上都是静音的，我需要工作或者读书时，我会专心工作一段时间之后再去看手机，统一回复微信里的消息（之前用番茄管理法，现在习惯了，也没有再用了）；

    2.合理利用碎片时间。坐车、上洗手间、等电梯等碎片化时间进行阅读；

    3.合理利用并行、串行工作方法；

    4.每天早上到办公室第一事件是罗列今日工作清单，然后从难到易开始工作。'
