    # 你的价值会将被什么界定


    ![](img/b7067422984faf05bb36fe56d6d8faf5_4_0.png)


    ## ——一个问题——


    很多人每年就像打仗一样，做年计划、月目标、周目标、日计划，每天那么多事务忙忙碌碌，为什么一年下来只是赚到了些钱，却并没有增值呢？


    北京就有一个天价过道10平方米，卖到了150万，只是因为它有学区房资格。


    - 第一，有清晰的坐标让你不会迷路；

    第二，一个点的价值往往不是由点本身决定的，而是由坐标系决定的。


    ## ——一个观点——


    职业价值坐标系：行业 X 企业 X 职业

    现在最流行的职业价值坐标系是美国的管理学家施恩的《职业锚》提出的“职业金字塔模型”，即所有的职业都可以被3个坐标所描述——分别是行业、企业和职业。


    ## 旧的职业价值坐标系在松动


    1. 组织寿命变短，员工心理转变

    2. 行业变化很快，没有边界

    3. 人们更关注新的职业坐标


    ## ——一个策略——


    - 第一个，持续放大自己的影响力；

    第二个，持续提高自己的能力；

    第三个，持续宣扬自己讨人喜欢的特色。


    ——这将会是一个全新的个人崛起的时代。


    最后提醒一句，生涯界普遍认为，个人崛起是个未来的趋势，但是个人价值体系远远没有形成一种主流。


    所以在这之前，大部分人可能还是需要在企业里面呆很长一段时间。你一方

    面要保护好自己原来那个坐标系的行业、企业和职业；一方

    面也要做好准备，在风来的时

    候，你站在2楼带着翅膀，纵身一跃就飞起来了。


    ## —— 一个小结 ——


    传统职业体系：行业 X 企业 X 职业； 陆地体系


    个人时代体系：圈子 X 能力 X 特色； 海洋体系


    这两个体系会并存很长时间。


    我们提到了让自己职场增值的3个方法：


    1. 第一个是不断建立弱联系，扩大自己的影响力；

    2. 第二个是找到自己的差异化能力优势；

    3. 第三个是持续放大自己的特色。


    ## —— 每日精进 ——


    1. 你已经知道了职业定位的2个坐标系，今天你的职业身价更多取决于企业体系，还是个人体系？

    2. 从“圈子、能力、个性”三个方面来看，如果要提升自己的身价，你应该先从哪个维度提升自己？


