    古典主义大师，他的风格又是偏浪漫主义的，那么如何区分古典主义和浪漫主义的作品呢？是仅仅从年代和表达的情感看吗？是否还有其他的方法和因素？谢谢！


    刘雪枫


    音乐本身都是充满灵性的艺术，每一个正常的人都可以和它有天生的亲近感，前提是你<|message|> 稍微有点耐心，有那么点安静，有那么点敬畏。舒伯特是很多音乐老饕的最爱，小孩子可以爱他，历经沧桑的老人更是容易被他打动。浪漫主义音乐家的心都是相通的，所以李斯特对舒伯特的改编都是最必要的加法，是没有任何违和感的嫁接，这种现象特别令人感慨和感动。舒伯特血管里天生流淌着浪漫主义的血液，所以他尽管生活在贝多芬的时代，却继承了贝多芬晚期音乐风格，而且更出于自然，更浑然天成，当然了，舒伯特曾经是萨利耶里的学生，他最初受到的教育是严格的古典主义风格，但是他最终成名是靠艺术歌曲、室内乐、钢琴曲以及部分当时还不被认可的交响曲，这一切都推动着浪漫主义走向它的成熟阶段。说舒伯特是浪漫主义大师没有疑义，也可以称之其为古典音乐大师，但古典主义大师是不能成立的。


