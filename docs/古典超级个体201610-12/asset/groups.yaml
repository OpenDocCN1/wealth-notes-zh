    \n5-1 职场清零术\n\n## 超级个体\n\n## 即.职场清零术\n\n![](img/b7067422984faf05bb36fe56d6d8faf5_41_0.png)\n\
    \n一起加速的第32天\n\n其实很多人早就破产了，只是活在还没有破产的组织里，所有权依赖症是我们最大的障碍，而此刻“假装自己一无所知”就是最好的解法。\n\
    \n### —— 一个观察 ——\n\n什么叫做死亡？医学上认为脑死亡才算死亡——瞳孔放大，脑电波消失，对于外界的反应停止……\n\n但如果你把自己的能力和认知当成一个生命，很多人们会发现——很久以来，你对于外界的判断是稳定的，你的反应是固定的，你的爱憎是固定的，你的认知成长已经死了。\n\
    \n> “有些人25岁就死了，但是要到75岁才埋。”\n\n### —— 一个观点 ——\n\n行为心理学有个概念叫做“所有权依赖症”。无论是有形的汽车、房子，还是无形的观点、看法，在“拥有”之后，人们对它们的珍视程度会大大提升。比如一辆开了很久的汽车，当你决定卖掉的一瞬间，我们对它的估价就会上升，不仅仅是因为配置、性能，更多的是开始考虑“这是陪我度过毕业后最艰难的那几年车啊”。\n\
    \n同样在生活中也适用，比如初恋女友特别好看；母校自己可以骂，别人就不能行；老房子就是住着舒服。但是用到变化很快的职场和商业，会让人失去正确判断。\n\n\
    在人类本性中，始终有三大非理性怪癖在作怪：\n\n- 1. 我们总是对已经拥有的东西迷恋到不能自拔；\n- 2. 我们总是把注意力集中到自己会失去什么，而不是得到什么，对于损失有一种强烈的恐惧；\n\
    - 3. 我们经常假定别人看待问题的角度和我们一样。\n\n“所有权依赖症”的商业应用极致就是体验式购物的宜家家私，各种家具不但按照家的样子摆放，而且允许你触碰、坐卧。身处其中，你会自觉不自觉地想象它们放在自己家里的样子，而在体验中投入的时间越多，你的“所有权依赖”意识越强烈，购买的机会大大提升。同样道理——你的物品放到“购物车”，本身就是一个大坑，会提高你的购买欲望。\n\
    \n一个案例：\n\n我的 一位老同学2000年通信工程毕业，去 了华为，做了1年觉得有点苦，就去学 了1年英语，2002年跳槽摩托罗拉。10 年间摩托罗拉、贝尔、朗讯各种\
    \ 合并、收 购，自己也熬到了技术管理岗。2012 年，他开始意识到外企有点问题了——自己收入30万左右多年不涨，其实这就是在降，出差住的待遇也从香格里拉降到汉庭、如家。想跳槽，但是跳到哪里呢？\n\
    \n那时候很多通讯人转型互联网，他也看了看互联网行业，觉得知识更新太快，都是小年轻，而且行业不稳定，还是等待更好的职业跳槽机会吧，正好孩子出生，先稳一稳，这么一想又是5年。\n\
    \n今年公司裁员的消息传出来，自己又被重新推到职场上。但 是真的一比较，发现自己其实缺乏竞争力——以往的所有跳槽，都是基于“名片简历”而非“技能简历”——我原来是XX公司的xx，所以我应该去XX公司做xx。\n\
    \n但是现在外企收缩没位置；创业吧，感觉自己拖家带口受不了这个苦；去民企做管理？很多都不能接受35岁以上的人。他简直不敢相信，自己这种名牌大学，很好的行业，一直勤勤恳恳，而且很早就开始做管理岗的人，竟然在40岁以前会失业。\n\
    \n其实很多人早就破产了，只是活在还没有破产的组织里。\n\n### —— 一个策略 ——\n\n怎么治？\n\n罗胖心法：时常询问自己：“假如今天我们公司已经一无所有，一定去干的事情是什么？然后我就去干那件事情。”\n\
    \n这种心法其实是所有创业者的心法。\n\n英特尔的案例：\n\n英特尔公司曾经是世界上最大的硬盘制造商，从1968年起，它的主要业务和利润都来自于硬盘。1980年，日本公司的硬盘夺军突起。1985年，在连续六个季度的收入下降后，英特尔公司总裁格鲁夫意志气消沉地与董事长摩尔痛苦地讨论这个问题——如果再没有好办法，格鲁夫要下台，而英特尔也会从此一蹶不振了。\n\
    \n格鲁夫突然问摩尔：“摩尔，如果我们下了台，你认为新进来这些家伙会采取什么行动？”\n\n摩尔犹豫了一下，说：“他会完全放弃存储器的生意，也许做处理器。”\n\
    \n格鲁夫目不转睛地盯着摩尔：“既然这样，你我为什么不自己动手？”\n\n结果你也知道——英特尔现在是最大的CPU生产商。\n\n抛弃“所有权依赖症”的最好方式，就是“假装自己一无所知”，“假装自己一无所有”。Stay\
    \ hungry，Stay foolish。\n\n我们也可以尝试给自己的职业做一个“职场清零术”。\n\n- 1. 清零能力，每隔2年重新评估自己的能力\n\
    \n不妨问自己几个问题，然后把答案写下来——\n\n现在你有哪些能力？先不用多想，一股脑地列出来。\n\n它们在招聘市场是处于一个什么样的价位？哪些能力正在升值，哪些正在贬值？\n\
    \n你有哪些潜在的能力，是市场需要、升值空间更大的？\n\n- 2. 清零简历\n\n每年更新一下自己的简历，保持清爽的一页纸，删除不太有价值的能力和资历，然后增加新的。如果这个简历2年没有变化，就要注意了。\n\
    \n- 3. 清零知识，从清理书架开始\n\n无论是实体书，还是电子书，我们要学会定期清理。书架不是已读书目的展示台，而是必读和要看书目的知识库。\n\n\
    - 4. 不断学习，跨界学习\n\n我们都是另外一个学科的初学者，而一种思维方式就是一个世界。比如，学计算机的，不妨读读心理学，让你的程序更懂人心；做医生的，可以读文学名著，让你的治疗更有关怀……\n\
    \n> 查理·芒格曾说：“如果你轻车熟路地走上跨学科的途径，你将永远不想往回走，那就是砍断你的双手。”\n\n### —— 一个总结 ——\n\n很多个体已经破产，只是活在没有死掉的组织里。“所有权依赖症”是我们的最大障碍，而此刻“假装自己一无所知”是最好的解法。\n\
    \n我们提到了职场清零的4个方式：\n\n- 1. 清零能力；\n- 2. 清零简历；\n- 3. 清零知识；\n- 4. 清零领域。\n\n### ——\
    \ ◆ 今日精进 ◆ ——\n\n- 1. 假如今天你的组织倒掉，你会凭借什么找到更好的下一份工作？\n- 2. 假如今天你的行业开始转型，你会凭借什么进入一个新的领域？\n\
    \n这是我们想尝试的新玩法。\n\n每天坚持留言的人，大概在400左右，占人群的3%左右，这非常了不起。\n\n但是既然是修炼，光说不练也不行吧——所以我本周丢出一个小任务，看看有谁多少人会真的行动，记录，并且把结果呈现出来。我估计这个比例又会大幅度降低，只有1%的人会真的去做。只要你去做一次，这个专栏的投资就完全值得了。做得好的，我们一个月以后请他来写文，谈谈自己的实践经验和感受。\n\
    \n这一次的任务：\n\n- 1. 清零一下自己的能力，写下来你的感受和分析。\n- 2. 然后给自己更新一页纸的简历吧。\n\n今天是古典陪伴你成长的第\
