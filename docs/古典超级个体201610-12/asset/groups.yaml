    # 加餐 | 2016即将过去，为什么我没什么长进？ 8-7


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    古典


    超体俩：）


    这周我为你们请到了一位2016年最受欢迎的学习成长类作者之一——剽悍一只猫。


    2016年他做了很多事：采访了100位大神；做了很多场专治嘴笨的演讲；持续一年的写作，成为简书排名第二的作者；写微信公众号，粉丝从0跃升到62万；做单次收费分享，报名人数也突破6万。


    同样是一年，为何剽悍一只猫能做到这么多事情？我有这样的好奇，大家也有这样的疑问，所以我挑了一个最有共性的问题，来请剽悍一只猫回答。


    猫老师，你在这一年写作、演讲、采访牛人、自我提升，时间怎么够用？你是怎么分配的？


    大家好，我是剽悍一只猫，非常感谢古典老师的邀请，让我能在这里跟大家分享一些自我管理心得。


    关于这个问题，我想跟大家分享四个关键词：


    # 一、强势


    我们要明确一点：要想让自己成长起来，我们得多花时间在自己身上。


    对于那些没必要的应酬、邀约，尽量去拒绝，而不是碍于情面就同意义。毕竟，我们的时间就是我们的命，不能随便就被别人消耗，我们得清楚自己要什么以及不要什么，该强势的时候就得强势。


    # 二、效率


    我是典型夜猫子，在晚上脑子非常好使，白天嘛，就很一般般了。所以，我会把一些特别费脑子的事情放到晚上做，其他时间就做别的。


    # 三、任务


    我喜欢把要做的事情记录在手机自带的日程里，这样，我早上起来就知道当天要做什么事。


    # 四、分配


    有很多不一定要自己亲力亲为的事，在自己可承受的范围内，可以花钱请人做，把这个任务“分配”给别人。


    最后，再送大家几句话：

    不要做老好人，在我看来，这三个字是贬义词，什么人该帮，什么人不该帮，你得心里有数。


    古典


