    ## 从一生的角度看生涯 生涯三阶段的三级火箭


    ![](img/b7067422984faf05bb36fe56d6d8faf5_25_0.png)


    ![](img/b7067422984faf05bb36fe56d6d8faf5_25_1.png)


    ## —— 一个问题 ——


    这两天我们都在说职业的底层概念。


    要理解一个概念，有三种很重要的视角：


    一种是显微镜，这个事情的本质是什么？细分细分细分再细分；


    一种是平面镜，真正如实地反映当前现实；


    还有一种就是望远镜——如果站在离地三千公里看这件事情，整个事情的来龙去脉是什么？过去是怎样的？未来又会变成什么样子？


    要理解职业生涯也是一样：


    从显微镜的角度，职业发展就是4个元素来回互动，最好的状态是动态匹配，不匹配找到原因调整就可以。


    从平面镜的角度，你和职业是来回互动的，到底这个阶段谁带谁领谁，你采用跟随还是带领策略，关键在你和现实生活的强弱关系，要懂得因时制宜。


    但是这种互动未免让人有点看不到终局——人职互动终极结果是什么？


    我们今天把镜头调整到望远镜的角度——离地三千公里。一个人的职业生涯从25岁就业到60岁退休，大概有35年，从这么长时间的角度往下看，整个人的职业是怎么一回事？


    ## —— 一个概念 ——


    职业生涯三阶段：


    生涯把职业分成三个阶段，生存期、发展期和事业期。最主要的区别是我们对于职业需求的改变。


    你身边肯定有这样的朋友，不管你和他谈什么，他的第一反应都是——这个东西赚不赚钱？


    其实不是他俗，在生存期，我们对于职业的需求主要是生存手段，目标就是尽快经济独立。一般人的生存期大概3-5年。90后是中国第一批真正意义在小康社会出生的人，很多人不太存在生存问题，直接斜坡起步，进入发展期。


    什么是发展期呢？


    面试的时候，我会习惯性地问对方一个问题，还有什么你希望知道的吗？会有人关心工资、福利、收入、假期，但是有些人就会问你——我们公司未来几年准备做什么？对我们这个团队的要求是什么？我有机会学到……吗？


    这个时候你就知道这个人在发展期了。他关注点不在收入上，而在迅速提升能力和发展上。这个阶段收入只是你的现金流问题，更重要的其实是你的职业资产在增值。如果没完成这个转变，还在下意识重复使用一个能力赚钱，时间一长毫无进步，你基本上废了。


    发展期最重要的特征，是越过收入看增速，越过赚钱赚本钱。


    发展期最后有2种方式结束。一种是主动的——你走到了所在职业的顶峰，外在成就感再也驱动不了你，手头也拿到了足够多的资源，你开始想做点有意思的事。


    一种是被动的，一个人的职业在45岁左右达到高原期，发展放缓，他就会思考，我还有15年时间工作，为什么不做点自己真正想做的？


    乔布斯回到苹果的头几年，当CEO只有1美金的年薪，他继续埋头做iPhone，这是他的事业期。你看日本的一些小店，三代人做了近100年，从一战前就在做寿司，每天都在琢磨怎么把寿司做得再好一点，这也是事业期。很多高管放弃高薪，从事收入和稳定性都差很多的企业教练，也是因为他们觉得助人更有意义，这也都是事业期。


    事业期的特征是找到成功的内在标准。我们会做自己感兴趣的事，用自己喜欢的工作方式，确定自己的成功标准。


    所以事业期的英文叫做 calling，原意是“神的召唤”——想象一下——你用你最擅长的能力，做着你觉得最有意思的事情，获得最想要的价值回报——是不是有天命的感觉呢？


    事业期最大的特征是越过外界评价，回归自我内心。职业变成自我实现的手段。


    你可以把生涯三阶段想象成一个三级火箭。一级火箭帮你加速起飞，脱离大气；二级火箭获得加速度，此时火箭已经可以真空里匀速飞行；三级火箭用来调整方向，瞄准你想去的方向。每个阶段你都必须越过。可以加速但是不能跨越。


    见过很多人在第一、第二阶段就想要直接瞄准梦想方向，但是因为缺少加速度，连地心引力——基本的生存财务压力都逃不开来。


    那么，这三个阶段到底需要多久？


    一般来说，走完生涯三阶段需要20-30年。这一代青年人期待尽快地走完生涯三阶段——很多人的生涯规划是先创业，拿到第一桶金，然后做大做强，35岁退休做自己喜欢的事。


    这当然是最好的情况，但实现的几率很小。能这样玩的人往往不仅只是自己的积累，还有背景原因——如果我们把望远镜再拉长一点。你发现很多三阶段并非在一个人身上的走完，而是在一个家族身上走完。


    郑也夫先生在《吾国教育病理》中分析过曾国藩的家庭，曾家五兄弟，出来一个进士，一个秀才。剩下的兄弟有些一次也不考，有些考一两次就放弃。曾国藩的两个儿子，则一个成了外交家，一个是数学家。毛泽东在长沙读书7年，而他弟弟毛泽民只读了三年，毛泽东的读书费用很大程度上是弟弟挣回来的。


    这些家庭内部完成了生存期、发展期和事业期的分流，一代父母完成生存任务，孩子中一些人发展，一些人尝试自我实现。


    美国的华人第一代移民基本解决的是生存期的问题；第二代移民往往都有高学历，从事计算机、精算这些技术性工作，解决的是发展问题；到了第三代移民，开始有大量的子女做艺术、电影、音乐。王力宏就是伯克利音乐学院的双硕士。


    国内第一批优秀的商人，也是这个线路，第一代务农或做工，穷怕了开始经商进入发展期；但是他们的子女有很大一部分选择去不继承事业，而选择人文、艺术、心理，其实也是从发展期到事业期的一个表现。


    ## —— 一个策略 ——


    我们该怎样知道自己在哪个阶段？可以从两个角度评估：


    - 1. 给自己做个财务评估


    生存期进入发展期的重要指标是经济独立，收入大于支出。


    发展期进入事业期的最好情况是你财务自由，完全不需要因为钱来工作；如果达不到也无所谓，你只需要确保自己喜欢的事的收入，能够满足自己的持续发展需求，这就需要你找到这方面，提前做能力、资源的储备。


    - 2. 评估下自己的职业驱动力


    生存期的核心诉求是收入；


    发展期的核心诉求是外在成功感和能力资源提升；


    事业期核心诉求是内在成功感和意义感；


    你今天早上起床，驱动你上班的到底是什么动力？


    3. 如果财务和心理指标不一致，听财务指标的，财务反映能力，能力提升才是这一切的关键。


    不管你的三阶段走得有多快，但是发展的规律并没有变——可以加速通过，但是不能跨越。


    诗和远方是一定要有的，但是要从理解和接受现实的第一个台阶开始。


    所以，不管今天的你在赚钱谋生，还是在努力链接资源发展，还是在寻求实现自我的价值，你都在自我实现的轨道上。


