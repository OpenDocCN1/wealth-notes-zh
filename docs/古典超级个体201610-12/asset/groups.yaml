    # 你不是没有精力，而是不会管理 8-2


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    ## 8-2 你不是没有精力，而...


    ### —— 一个观察 ——


    你有没有过这样的经历：


    一起开会，开到一半你已经哈欠连天，有的人却神采奕奕？


    到了家里你精疲力竭，却发现同事刚刚更新了一篇文章发到朋友圈？


    为什么有些人好像一直都精力充沛，有些人却持续状态不佳？


    你可能会说他们天生精力充沛，而我天生有慵懒。不过你可能会发现，很多精力比你充沛的人，休息的时间比你还多。


    前苏联的昆虫学家粟比歇夫绝对是一个博学、高产的大牛：生前出版将近70部学术著作；还写回忆录；搜集了13000只跳蚤标本……他的著作《奇特的一生》被许多人推崇为个人管理的经典著作。但是，他并不是彻夜不眠的工作狂，他每天要睡10个小时。


    精力充沛并不一定是天生特能熬的结果，精力充沛是一种自我管理能力。


    ### —— 一个概念 ——


    我们先来看看，普通人是如何管理自己精力的？


    # 直线型管理：


    大部分人管理精力的方式是消耗性的一直工作，累到 grid 罢为之止。


    # 钟摆型管理：


    他们懂得掌握节奏，主动休息。休息被认为是一种高效能的工作方式。


    ### —— 一个策略 ——


    发现你的精力节奏：


    - 1. 60分钟钟摆


    大脑的注意力只能保持45-90分钟，最长不超过120分钟。所以每小时主动休息一次能保证你的精力在高水准，远远比连续2小时然后停止下来休息20分钟好。休息的频率比时长更重要。


    - 2. 一天的钟摆：4个时间段


    0:00-5:00 睡觉休息

    5:00 起床（如果可以）

    6:00 血压升高，心跳加快（起床、锻炼、日计计划）

    7:00-8:00 创造性的工作

    9:00-11:00 精力高涨，完成艰难的工作任务

    12:00 整理、总结

    13:00-14:00 午餐，午睡

    15:00-16:00 体温升高，开始重新投入状态

    17:00 工作效率升高，适合沟通，也最适合运动

    18:00 休息、晚餐

    20:00-21:00 记忆力最高、最适合学习

    22:00-23:00 整理、总结、准备休息


    ### —— 一个总结 ——


    精力充沛的人是能更好地掌握精力节奏、主动休息的人。


    ### —— 今日精进 ——


    - 1. 你是一个直线型的精力消耗者吗？你现在意识到了节奏的重要性，你会对自己的工作、学习安排开始做些小调整？

    - 2. 你有哪些得意的小技巧，可以让自己迅速恢复精力的吗，一起分享下？


