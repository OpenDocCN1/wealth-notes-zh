    ## 说服中最难的，就是自问自答 10-4


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    各位朋友，我刷了大家的各种说服逻辑和年度总结。


    有说服领导加薪的一—这个占大多数，不知道有没有成功？有说服老公接孩子 的，有说服客户单单的，还有说服对方嫁给他 的……


    大家都逐渐掌握了架构，也逐渐发现了吧 ——说服最难的一点，就是站在对方的角 度，自问自答。


    ### 如何贴心地自问自答？


    有人要说服领导让他讲时间管理，他的理由是：


    - 1. 很多员工有需求；

    - 2. 我讲得不错；

    - 3. 从外面请人贵。


    这个已经有说服意识啦，大概7分。但是我作为一个管理者，真正关心的是：


    - 1. 真正的成本是大家的时间啊！浪费大家的时间赚得回来吗？

    - 2. 你讲的东西会不会和我的管理制度有冲突？

    - 3. 怎么才算有结果啊？


    所以如果你能这么告诉我——


    - 1. 现在遇到效率的问题是时间管理造成 的。

    - 2. 两小时的培训能有效地解决一部分问题，提高效益。

    - 3. 我水平高而且愿意免费。


    现在请教下，领导你有什么还需要我传递 的吗？


    我就爱死你了。


    那么如何更好地提高自问自答的能力呢？我总结应该有3条。


    ### 1.搞清楚对方职位的核心指标和站位


    有个故事说国际航班失事，机长要乘客跳伞，结果怎么都说不动。一个空乘说我试试看。过一会回来报告——机长，他们都跳了！


    怎么做到的？


    我对法国人说，在空中跳舞很浪漫，他们跳了；对英国人说下面的法国女生需要你们保护，英国人跳了；对美国人说这是冒险——他们跳了；对日本人说美国人跳了，他们跳了；最后是拿中国人开玩笑的——对中国人说洋人
    都跳了，他们也跳了。


    笑话说的就是要理解每一个人的站位和价值，然后才说服。


    在你向上、跨部门说服的时候，记得搞清楚两个问题—他的核心指标是什么？最近他在为什么发愁？从中间联系你的理由，就简单了。


    ### 2.答案准备充分


    这一点，超级个体xixi自我挖掘很深入。


    xixi：我大学毕业后这几年的工作中，其实很少去说服别人。这不是我与世无争，而是因为：


    - 1. 自己缺乏深入思考的能力、很少有好的想法；2. 以前有提出过想法，但经常会被领导否决掉，所以慢慢地我就丧出去说服别人，尤其是说服领导了。


    所以，看到“今日精进”里的练习是说服一个人时，我的第一反应是我没有可以说服的对象……因为我刻意地回避了工作中很多的矛盾点和突破点。


    所以——不是与世无争，而是没有做好争斗的储备。不是不会回答，而是没有做好准备回答。


    同样道理——老师我天生内向不擅长交往怎么办？


    很多时候你不是内向，而是害羞；更精确地说，你还不是害羞，而是准备不够。回家结构思考去。


    ### 3.阅历


    那些不会明说的规则、担心和想法，只能通过阅历和反思学到了。常说“养儿方知父母恩”，没有经历过的人也许真的无法理解带孩子的艰难。阅历不一定是直接经历，多听别人谈，多看文学或电影都是体验。


    也常常有不少经历很多依然没什么智慧的人，因为阅历阅历，最关键是“阅”字——反思很重要。


    总之，自问自答是最重要的说服力之一，也是销售、营销、传播、领导力的本质。自问自答是说服中最难的部分。


    ### 贴心的、透彻的、穷尽的自问自答


    苏娥漫：像这样从“what、why、how”的大层面去阐述一个问题，会不会让领导觉得你是在战略角度给他们教授怎么去实现目标，这不会会有点……


    绝！对！会！啊！


    所以你不会真的这样开始吧——“各位领导，来，看看这里，为什么我们要做这件事呢？”不会这样吧？


    最后再提醒一次！结论先行。你的标题一定是“加薪能提高20%的效益”这样的结论，Why、What、How是背后的隐藏逻辑。


    瑞尔~宋雪梅：11月感恩节想申请一批费用，用于购买水果回馈客户，我是这样写的：为什么回馈，回馈具体多少金额，如果不回馈会怎样。


    结果老板回复邮件说：我到底几个客户？这些客户是我的重要客户吗？为什么金额是那个数？怎么分配？这几个客户喜欢什么？有孩子吗？为什么选择送水果？怎么送？送家送办公室？现在申请得及吗？……总共发了12个问题来，我一看蒙了。好想拍他！


    这属于给了why没有what和how，有论点但是没有穷尽。MECE缺一半。所以要给结论，要独立，也要穷尽。简单来说——贴心的、透彻的、穷尽的自问自答。


    信任就是这样逐渐建立的 ——我自己做管理者的时候，如果大家给我汇报的时候经常自动说What和How，我会知道这个人心_可数，慢慢会抽查，最后不过问。如果他完全一问三不知，证明这个人思考深度不够，需要修炼。


    当然，有些领导喜欢刷存在感——那就偶尔露个怯让他改改，让他刷下。这也是结果思维啊。


    ### 触类旁通的思考模型


    还有很多超级个体们从中发现了，同样类似的结构在很多其他领域触类旁通——并不是碰巧，而是我们大脑理解事物就是5W2H——这是一个规律。


    Lucky蓝孩：想起以前看到的关于面对面销售的六大问题，发现就是“5W1H”的模式，我的答案仍在不断修订中，仅把问题分享给需要的朋友吧。


    - （1）Who：你是谁？

    - （2）What：你要跟我谈什么？

    - （3）Why：我为什么要跟你谈，你谈的事情对我有什么好处？

    - （4）How：如何证明你讲的是事实？

    - （5）Where：为什么我要在你这个地方买？

    - （6）When：为什么我要现在跟你买？


    听早雨：今天老师讲的内容，跟《金字塔原理》里提到一个好故事的典型套路（SCQA）很相似：


    - （1）背景（situation）：介绍背景，确保说话时，你和其他人在同一个背景里面。

    - （2）冲突（complication）：推动故事情节发展，并引发对方脑子里产生下一个疑问。

