    # 问答|什么是真正的特色和跨界？


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    前三天我们刚了一遍关于未来职业的新地图：海洋体系的新坐标系，新的能力体系，以及新的职业赛道——我们这一代人在面临职业的新大航海世界。


    新一代的职场人也许不会像过去陆地体系一样走楼梯或者电梯——他们会成为蜘蛛侠。从某一个职业入口进入，然后走到楼顶，直接荡到另一个大楼上去。


    不过还是要反复提醒大家的是——大部分对于未来的趋势，其实都是过于乐观的。


    即使未来学大师也是这样——写出《大空漫游2001》的未来学大师克拉克成功预言了卫星通讯，他在2000年发布一个预测时间表，预测2004年会有克隆人诞生，2006年世界上最后一个煤矿关闭，2010年的摄像头会让世界彻底杜绝犯罪——而今天，他的预言并没有变成现实。


    所以，在海水没有漫过之前，务必修炼能力，踏实工作。


    # 事业单位，有可能建立个人价值体系吗？


