    ## 4-1 比学习技能更重要的，是迁移技能


    ![](img/b7067422984faf05bb36fe56d6d8faf5_32_0.png)


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    4-1 比学习技能更重要的...


    ## 超级个体


    比学习技能更重要的是迁移技能


    ![](img/b7067422984faf05bb36fe56d6d8faf5_32_1.png)


    ![](img/b7067422984faf05bb36fe56d6d8faf5_32_2.png)


    一起加加减减的第25天


    我们很容易关注新事物的价值，却常常忽略当前拥有东西的价值——当你需要迁移，你应该从现有价值里拆分出来最有价值的部分，然后带到新的领域里继续增值。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_32_3.png)


    ## ——一个观察——


    这周我们先从一个大家最关心的话题说起——能力，聊聊能力的提升、分类和精进。我们知道能力的修炼是一个漫长过程，但是行业却在飞速地变化，那么这两者如何协调统一呢？会不会辛辛苦苦练了10000小时，却发现这个社会已不需要这项能力了？


    前段时间，一位朋友在后台留言，他们公司因为业务影响，所有的销售都要转型去做在线运营。他已经30岁，如果重新开始一个新的职位，意味着前面多年的销售技能都白练了；但他在公司里职位又比较高，不想去别的公司，怎么做呢？


    这让我想起吴晓波老师说的一个买房的故事：有个人员觉得云南的生活环境很好，把北京的房子卖了去云南定居。后来房价飙升啊，回来发现自己损失了好几百万，非常沮丧。有没有好的方法呢？吴晓波说，其实有这么一招——你可以考虑把北京的房子抵押出去，然后拿到40%的钱也可以在云南买个合适的房子，还可以同时享受北京房价的升值。


    这两个故事听上去关系不大，其实它讲了一个共同的道理：我们很容易关注到新事物的价值，却时常忽略当前拥有东西的价值——当你需要迁移，不管是房子还是工作，你都不需要全部重新来过——你应该从现有价值里拆分出来最有价值的部分，然后带到新的领域里继续增值。


    在不确定的时代，我们的职业需求时常要迁移——一种迁移是空间的，从一个行业到另一个行业；另一种是时间的，从一个时代到另一个时代。


    我自己在教育这个领域，这种迁移的感觉就很深刻——在2002年前后，最火的教学方式是大班教学，那个时候一个班有1000多人，一个笑话一片笑声，讲个故事哭成一片……那个时候核心技能是公共演讲能力。慢慢的市场有更多人进入，核心技能变成了产品研发能力——你必须不断地创新。第三个阶段，大班慢慢变成了小班，这个时候几个老师不够用了，招生能力和老师的运营能力成了重点，这是时间的迁移。


    也有职业需求在空间上的迁移——二线城市和三四线城市，大家买账的点就不同，喜欢的教学方式也不同。


    你看，教育行业是一个不能着急的领域，但它在时间、空间上的迁移，十几年都能换两到三代，更不用说其他快速发展的领域了。每个阶段，都需要运用完全不同的技能和知识，怎么才能不被拍死在沙滩上呢？


    我们都知道10000小时天才理论，在一个领域达到世界级高手，需要10000小时——但是如果一个领域变化很快该怎么呢？同时，你如何解释一些在三四个领域都达到世界级水平的人？难道仅仅是他们学习得快，还是比你勤奋3倍？


    今天给大家讲的这个模型也许会帮你解释以上的疑问。


    ## ——一个概念——


    美国心理学家Mary Jico和Keith Holly曾给学生出了两个难题：


    - 1. 想象你是名医生，面对一位身患胃癌的病人，病情已经到了无法通过手术治疗的阶段，只能接受放射治疗。高强度的射线会破坏人体组织，低强度的射线又对肿瘤起不到治疗作用。你要怎样做才能在不摧毁人体正常组织的情况下，借助放射疗法消灭肿瘤呢？

    - 2. 有一位将军，目标是占领一个国家的中心要塞。有很多条路通往要塞，但是都布满了地雷，虽然一小组分队能安全通过这条路，但是大部队就会引爆地雷，这就意味着全面的直接攻击很难实现，你该如何处理这种情况？


    读完难题一，只有少数几个人觉得好解决，但是难题二，90%的同学思考后都觉得自己也能办到，把军队分成小组，每个小组从不同的道路进行，然后让他们同时进攻要塞。这时大家马上意识到，把军队分成小组与用小剂量的辐射一点点汇聚到肿瘤部位的道理如出一辙。换言之，在一个领域解决问题的能力经过转化可以迁移到另外的领域，因为解决问题的技能是可以迁移的。


    学习新知识固然重要，但是能把自己其他领域的技能迁移到新领域，持续叠加形成的优势，才是牛人在很多领域做到世界第一的秘密。他们用同一种学习能力、归纳能力进入了很多不同的全新领域——一招鲜吃遍天是一个简单的朴素真理。


    那怎么样完成这种转化呢？


    先介绍一个能力三核的概念。做成一件事的一系列知识技能都可以做能力，而能力分成三个部分：知识、技能、才干。


    所谓知识就是这个领域的专业知识、概念、做事情的流程，通过学习记忆而来。比如说我做这个栏目看的书、递嬗的流程就是知识；


    技能是指我们能熟练操作和完成的一系列动作，通过训练而来。比如写作、解决问题、英语、信息搜集、时间管理；


    才干是我们通过大量练习，内化到无意识使用的一些技能、品质和特质，是先天禀赋和后天大量练习的混合，通过大量训练，从技能内化而成。比如说：乐感、幽默感、直觉。


    我和很多投资人有过接触——资深投资人往往需要在一周内了解一个全新的行业，并且做出决策。那么一个投资经理的能力三核是怎样的？


    知识：各行业的知识、熟悉投资流程、了解各种商业模式


    技能：快速学习、数据调查、结构思考、情商、谈判能力


    才干：关键时刻的决策力、一流的洞察力、个人魅力


    当一个投资经理拥有了底层的技能和才干，他完全可以在很短时间关注一个新的领域，快速成为这个领域的高手。


    进一步来说，这些底层的 能力，他除了做投资，能不能从事其他事？完全可以。


    这些能力同时也是做战略分析、企业咨询、写作整合的能力；如果再增加点酌性和组织能力，这就是创业家的能力。牛人们虽然总在各个领域之间迁移，但他们只是重新学习了知识，技能和才干都是同一套。


    理解了能力迁移，你会发现为什么大部分CEO都是由市场总监或销售总监来做， 因为CEO的工作跟销售极类似，做销售你需要向别人销售产品，做CEO你需要向商业伙伴贩卖你的商业概念，向员工销售愿景，向投资人销售商业计划。从本质上来说，领导和销售这两个职位可迁移度很高。互联网公司的CEO很多是产品人，
    因为这两者的能力模型更加接近。


    这种能力迁移到了极致，会是怎样的一种体验？


    比如说王阳明，一位立功立德立言的大圣人。他简直是明朝的BUG，什么牛人遇到他，都会挂掉。看他的传记什么的你都得郁闷——一个人怎么能在哲学、军事和文学上同时有这么高的造诣？其实王阳明也是一位迁移整合高手——明朝正德十三年正月，王阳明在进山剿贼之前，写信给弟子薛侃说：


    “破山中贼易，破心中贼难。区区剪除鼠窃，何足为异。若诸贤扫荡心腹之寇，以收廓清之功，此诚大丈夫不世之伟绩。”


    这段话我帮你用能力模型翻译下：


    “虽然行军打仗和自我修练的专业领域不同，但是人性都是相通的，如果我们将修炼自己心性、克服自己贪念的技能迁移出来，就是破山中贼的方式。在和自己的斗争中学到的技能和才干，也能成为军事成功的技能和才干。”


    所以你只要练一个，就能样样通。


    我们经常说隔行如隔山。其实真正相隔的，只是底层入口售票处，越往上走，运用的能力、才干都越来越接近而且越熟悉。这也是为什么大家说——一切努力都不会白费，都是相通的。这不是鸡汤，当你理解了能力三核，他们说的其实是：只要你曾经在某一个领域努力练习过，你提升的技能和才干都不会白费，可以迁移到未来。


    《法华经》说“功不唐捐”，就是这个意思。


    ## ——一个总结——


    我们提到了每个人的能力中间，都隐藏着可以被回收再造和迁移的技能。这些技能我们称为可迁移能力。


    - 1. 能力是由3个部分构成。知识、技能和才干。隔行如隔山的是知识，技能可以在不同职业领域迁移，而才干可以在生活工作各个方面延伸。

    - 2. 能力可以组合，也可以分拆。分拆出来的技能、才干可以迁移到新的领域继续修炼，所以你并不需要重新开始。


    今天我们先到这里，明天我们一起来实操一下技能迁移的策略——如何把你的能力分拆并且重组到新的领域中去？


    ## ——今日精进——


    - 1. 你有没有做成过这样一件事——多年后回想起来，那件事给你的帮助极大，那期间提升的能力很大程度成就了今天的你？

    - 2. 简单地描述下这件事，然后根据你刚学到的知识、技能和才干模型，分析下你到底从中学到和迁移了哪些技能和才干？


    今天是古典陪伴你成长的第 25 天，一起加速，成为更好的自己。


