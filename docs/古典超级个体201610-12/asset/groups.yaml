    在电脑前控制电路。所以，对于设备的控制要求越来越高，出现了越来越多的客户定制、越来越多的控制电路设计。个人感觉外企的优势越来越小，但不知道原因在哪里？对于直接的硬件制造，中国的成本越来越高，东南亚的人力成本已经低于中国，所以制造业在转移。对于技术来说，越来越多的研发人员是印度人，所以，中国管理人员在外企越来越衰退。


    小龙女560562：近两年来，互联网的冲击很大，对整个行业生态产生了很大的影响。以前开户必须客户本人到公司柜台办理，现在客户可以足不出户，通过电脑、手机办理；以前需要填写客户经理的名字和工号，现在直接扫描一个客户经理专属的二维码就可以了；以前竞争要靠公司规模、门面、积累，现在靠强大的互联网营销能力，很快就能脱颖而出；以前炒股理财要找专家、操盘手，以后可能要靠计算机分析了。同时由于开户手续的简化、便捷化，竞争也更加激烈了。


    木思克的光：复杂的个人寿险、大型项目的保险以及理赔都需要服务跟进，传统模式依然有存续空间，互联网主要提高了营销的效率。


    军机处：身处银行业，感受最深的是竞争的白热化，发展很困难。比如之前未严格监管的时候，P2P平台满天飞，如今也有很多互联网公司出来做一些信贷业务，技术和互联网打破了这层壁垒……大众找银行，一般就两件事：存钱、贷款。利率也越来越市场化，靠这个突破已不太可能。


    海金：我在生物行业，技术正在使人类越来越舒适地进行疾病检测和治疗，互联网则让用户能直接接触到基因检测产品直接下单购买，让医学大数据能实时共享并能手机操控数据分析和结果注释。


    冉启智：技术和互联网对于我们教育行业最大的变化是：改变了很多接受教育的方式，比如在K12这细分领域，以前好的老师，好的教学资源，只有在发达的地方才能享有。现在通过互联网在线教育，北上广深等发达地方的教育资源，在国内其他地方也可以学习到，而且国外的教育资源通过互联网也能学到，但遗憾的是，我们教的方式改变了，但我们育的方式并没有改变。璐名：我是属于高等教育行业的。技术和互联网的影响是学生面临越来越丰富的网络资源和越来越有设计感的互联网移动APP，传统的教学方法VS互联网的大神大牛，其吸引力已经大打折扣，课堂上低头族越来越多，但真正通过先进手段学习和进步的学生并不多，更多的是被碎片化的信息所侵占，这是一个很大的困惑。


    Porter Wang：技术最大的改变是从之前的板卡控制到总站控制。互联网最大的改变是，自动化云端控制，不再需要人盯着机器了。


    ellen09：我是广告行业从业人员。这2年来，互联网对广告公司的冲击非常大，基本上已经将原来的广告业重新划分成2个派系，一个是传统广告公司，一个是数字广告公司。这两年，传统广告公司业务下滑非常快。数字广告公司中，能做好创意的广告公司获得了巨大的成长和业绩。


    沅海寂：我所在的高速公路行业已经慢慢被高科技代替，比如现在用无人机长距离巡查。我觉得现在高速公路的支付方式已经落吾了，一定被线上支付代替，并且资料的整合一定会进入大数据。


    长风：专科切肿瘤的医生正在慢慢地消退。有一种叫达芬奇的手术机器人已经做得比专科医生还要好。汽车生产会逐渐被人工智能替代，特斯拉已经完全是机器人操作了。一般农民种地已经挣不到什么钱了。以色列发明的滴灌技术极大的节省了农业生产的成本。


    酒厄：近两年来技术和互联网对我们这个公司的影响并不是很大，我们是有色金属采冶行业，地势偏远，比较传统和保守。因为技术的进步，账务的自动化，我们这些实质的记账人员将会被淘汰，转而需要的是具有战略意识和风险管控能力，有大局观的财务人员。


