    ## 3-7 加餐 | 知识众筹：6个策略教你自己做自己的师傅


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    本周，我们开始了第二次众筹、《超级个体》的职业健康度调查报告：有效数据479份。


    平均对于企业的满意度是6.1，对于自己工作的满意度是6.0。属于及格线上下。


    绝大部分的人（93%）需要通过提高能力，提高成功度；更多的人（58.6%）的人需要厘清个人需求提高幸福度，看起来来到需要带大家慢慢做自我探索。


    大部分人处于发展期，提高幸福和成功的方式，都是向内看，自身修炼，自身探索。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_30_0.png)


    反映到个体需求中，最重要的工作要素是：学习成长、发展空间、薪酬福利。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_30_1.png)


    大家比较关心的话题有：如何提升成长需要的各种能力、行业职业发展趋势、自我探索的工具、职场具体的案例等。


    根据大家提出的问题，我们丢出来一个话题：“职场上没有人带，该怎么办？”请职场老司机们回答。


    问题一出，留言区出现了上百个老司机，各种精彩。我把这些回答整合出6个大的策略，后面列出针对具体技术的精彩言论。


    用了“清音”朋友的一句话作标题——《做自己的师傅》


    ## 做自己的师傅


    - 1. 别抱怨：没人带很正常，有人带是福分

    - 2. 主动：主动学习、主动做事、有眼力、少说巧做

    - 3. 学习：跟事学（好事坏事都可以学到）、跟人学（同事、领导、客户、对手）

    - 4. 资源：百度、维基、公众号、知乎、行业圈子、论坛、专业书

    - 5. 复盘：事后思考、反复复盘、形成文字、有空转述

    - 6. 人品：互惠原则——你真的值得别人带吗？让自己成为一个值得别人花时间的人。


    下面是具体策略：


    ## 主动的力量


    From 普润茶@凌：


    本人工作20年，10年供应链管理，10年hr管理，以下建议供参考：


    - 1. 主动获得周围人认可：a.多做事（有眼力见）；b.努力把每件小事做到精（让人看到好品质）；c.主动多交流（混熟）；d.有机会拓展副业。以此帮助你建立好的口碑。
    2. 找对关键人物，能够支持你的人（不一定是领导），深度交往。 3. 主动请教，专业上有想法，又有能力体现，态度上要谦卑，积极阳光像太阳。（有前面的事人际基础，贵贱与支持你的人会越来越多）
    4. 8小时内先跟随，8小时外深耕专业想法，当有更有力支持的人或者有表现的机会，一举成名相对容易。


    最后还是强调“主动”，中国社会先是熟人社会，主动想要并有方法坚持，没有不能实现的事。


    ## 成为好员工全攻略


    From 止海：


    如何做事？


    - 1. 少说巧做，领导交代你的每项任务务必在时间成本效果上超出他的期待，甚至给他惊喜，不要以为巧做是要花招，投机取巧。 2. 每件事情务必和直属领导保持主动互动沟通反馈，每个任务要留有记录，买个好点的本子，还有私下关系上多请教上级，比如递个烟，倒个水，送个土特产。


    资源如何积累呢？


    - 1. 你用心记录总结维护每一天的人、事、关系，都可以变成你的资源！我做施工的，老板的施工队都是我的施工队，我感觉是给我开的，哈哈，要大气！ 2. 现在互联网付费时代了，多使用新技术和工具，比如知乎、书、价值社区、效能app等。千万要讲求实效。


    有哪些窍门呢？


    - 1. 每逢开会时务必提前准备好，轮到你，领导让你讲，适当表现，有理念和思路； 2. 多学习和不同人沟通，要有作品拿出手，并记录反思； 3. 在做好本职工作同时多帮领导和同事，还要小恩小惠什么的，毕竟关系最重要嘛；
    4. 进公司务必提前布局，紧跟公司的价值部门和领导，且与自己要匹配； 5. 尽量做到每天第一个来公司，可以计划学习或打扫卫生； 6. 时机成熟时制造与大老板的偶遇，表现自己。


    有哪些坑呢？


    - 1. 刚开始不能和领导抢功劳，让他感觉到你不是他的敌人； 2. 遇到好领导时，有些责任分摊后，还要学着替领导背黑锅； 3. 不要自以为是，自大，不要急，要对自己有耐心，要有能力的积累迭代！有时刹车拐弯不一定达不到目标。


    ## 别人的方式不一定是最好的


    From 蔡琳：


    我那年刚从财务岗位转到人力岗位时，负责薪酬模块，每个月有一项工作是负责完成300多人的薪酬核算。当时是一家创业型的电子商务公司...所以，我觉得，在职场初期，可能需要别人引领，但这种思维不能持续太久，因为别人的方式不一定是最好的。


    ## 互惠原则


    From 绝不放弃：


    在职场上获得资源，基本符合互惠原则，无论是对上级还是同级之间，有所求就要有所付出。如果想快速完成生存期迈到发展期，就要扩大互惠原则，互惠本质就是交换。


    比如你在生存期，你想要什么首先想清楚，因为生存期大要学习工作的相关技能，这些技能是相对容易学习的，主要是操作技能，而不是上学学的学科，不需要很长时间学习架构原理，基本学了就可以去用。互惠很简单，主动问候就是付出，主动开门，主动为别人递东西，这是入职三天可以做到的。主动请别人喝几杯，或者有老业务带着工作的情况下，一定主动做些买饭啊买饮料的事，这都是些小钱，但这是从别人那里获得帮助的必要投入。等能力升级了，你能帮别人做你会而他不会的，这同样需要互惠。


    千万别踩的坑：


    ## 千万别踩的坑：


    短期内别找主动孤立或被孤立的高手，因为你摸不清情况容易陷入不必要的麻烦。


    ## 思维的开阔度


    From A0 李妍 东审43275014：


    - 1. 要转变思维的长度，用你的未来来定位现在。知道自己未来要去哪，那么现在用行动来朝着这个未来目标去，未来目标越明确，现在那些可有可无的纠结就越少。

    - 2. 要拓展思维的宽度，每件事都从你、我、他三个角度去看，慢慢你会发现原来让你不快乐的执念没有那么多了。

    - 3. 要提升你的人生境界，说白了，你是为自己而活，为家庭而活，为家族而活，为团队而活，为公司而活，为行业而活，为社会而活，为世界而活……


    你的世界能容下什么，你就会用什么样的标准来定义自己。


    ## 坐标——描点——连线


    From 童飞：


    我在IT行业，从事芯片设计，刚工作的时候，名义上是有个师傅带的，但他基本上不太愿意说很多话，我基本上只能自己摸索。在做第一个真正意义上的项目时，我完全凌乱了，出现各种问题，进度各种落后。


    ## 方法：


    我注意师傅嘴和同事里说出的只言片语，从中筛选出可能有用的信息，这个过程叫做寻找点坐标；


    定位出了可能有用的信息后，我去网上搜索相关的知识，自己理解后将其应用于项目之中，这样马上就可以判断出来是否有用了，这个过程称为描点；


    当我的经验达到一定程度时，我开始不满足于这些星星点点，我找到了芯片设计的经典教材，从第一页开始看起，看到精彩的地方简直是拍案叫绝呀，以前不懂的、无所谓的和模糊的，全都明白了，一个个线条成型，我的知识体系就建立起来了。


    ## 千万别踩的坑：


    - 1. 有人说：千万别信谁，资深同事讲的没有用，理论也没有用。但是没认真学习经典教材的人更没有发言权。

    - 2. 还有人说：做好自己的事情就好了，这个领域的知识跟我们没关系。可现在行业都松动了，跨界变得越来越频繁，要清醒一点。


    ## 自我学习四句话


    From 去留无迹：


    - 读万卷书：多学理论，切忌纸上谈兵

    - 行万里路：多做实践，切忌轻下判断

    - 阅人无数：多看高人，切忌说多错多

    - 自己去悟：多思多写，切忌人云亦云


    ## 该如何向领导提问？


    From 林夕：


    问前辈问题之前先问百度和知乎，自己先学会搜索，不要做伸手党。解决不了再问他们。


    像古典老师以前说过：你搜集完资料，如果还有问题再去问他，然后向他展示“我想问xxx的问题，搜集得到这些信息，请问您还有什么更好建议吗？”让别人看见你的诚意，明白了你是一个认真的人，也愿意和你做朋友。


    From 好一朵美丽的茉莉花：


    > “在你自己有三个答案之前不要来问我。”

    > “自己没有花1小时时间查资料，不要提问，是一个尊重。”


    今天是古典陪伴你成长的第 24 天，一起加速，成为更好的自己。


