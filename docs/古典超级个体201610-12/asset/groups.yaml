    # 加减乘除4种高效能策略 7-2


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    7-2 四种效率提升策略


    ### —— 一个观察 ——


    昨天我们谈到了3种新时代时间管理的能 力，很多 人说，我最大的时间问题，就是工作量太多，导致要持续加班。今天我们就来谈谈加班的真相。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_61_0.png)


    时间是碎片的，但事情不是碎片的，没办法放到任何一个碎片时间里处理，所以只好不断地往后拖往后拖———直到晚上没有人打扰的时候，时间流恢复成了工业时代，你才能处理问题。这就是很多人加班的真相。


    所以怎么在碎片化时代利用好时间？我们提供了四种策略：加减乘除。


    ### —— 四个策略 ——


    ## 一、加：增加碎片时间价值


    碎片式浪费：


    昨天不是请大家做了一个实验，看自己手机的碎片时间吗？大部分人一整天花在网络、刷微信的碎片时间加起来竟然有2个多小时，这些时间完全够搞定工作了。


    如果按每天节约“碎片式浪费”2小时计算，他的一个月会有60小时，一年会有30天的收益。这些时间足够读完2本书，掌握2门技能。


    之所以发生碎片式浪费，是因为我们本来就不知道用这些碎片时间来干什么，在没有安排的时候，最简单的默认选项就是刷微信。


    如果你知道碎片时间可以用来做什么，就不会频繁刷微信了，最好的方式，就是提前列好一个“碎片时间清单”。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_61_1.png)


    ## 二、减：减少切换成本


    一份报告《被打断的程序员》（Chris Parnin）对来自86位程序员的10000份编程情景记录进行了研究。


    在代码编辑工作被打断后，程序员需要10到15分钟来重新开始。


    在编辑方法时被打断后，程序员只有10%的概率会在一分钟内继续工作。


    程序员可能每天只有2小时的连续时间未被打断。


    15分钟的代价是1个小时。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_61_2.png)


    所以最好的方式，是集中所有的需要切换的动作，尽量一次性解决，降低“切换成本”。


    比如说：


    - 给王经理电话

    - 完成项目报告

    - 给老板签字

    - 去银行手续

    - 给David电话

    - 给老板汇报客户沟通情况

    - 约张强晚饭

    - 给老婆买礼物

    - 去超市买东西

    - ……


    这些事情切换着去处理，时间就被你弄碎了。


    我会列出几个经常遇到的场景：@老板、@外出、@电话，凡是在这些场景下解决的事情我都列在一起，当需要处在这个情境下的时候，我会把所有的事情一次性搞定。比如说需要给客户打电话的时候，我就把所有需要电话解决的事情全部做完。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_61_3.png)


    这样的话你的时间就变成了这样：


    ![](img/b7067422984faf05bb36fe56d6d8faf5_61_4.png)


    ## 三、乘：多线程叠加效率


    《圣经新约》的翻译者詹姆斯·莫法特的书房里有3张桌子：第一张摆着他正在翻译的《圣经》译稿；第二张摆的是他的一篇论文的原稿；第三张摆的是他正在写的一篇侦探小说。


    莫法特的休息方法就是从一张书桌搬到另一张书桌，继续工作。因为工作的性质不同，一种恰好是另一种的休息。这就是多线程的叠加效应。


    “间作套种”是农业上常用的一种科学种田的方法。人们在实践中发现，连续几季都种相同的作物，土壤的肥力就会下降很多，因为同一种作物吸收的是同一类养分，长此以往，地力就会枯竭。


    人的脑力和体力也是这样，如果每隔一段时间就变换不同的工作内容，就会产生新的优势兴奋灶，而原来的兴奋灶则得到抑制，这样人的脑力和体力就可以得到有效地调节和放松。


    具体你可以这样做：


    - 按抽象与形象来分配时间：独立思考分析一段时间后，画脑思维导图；

    - 按研究问题的不同角度：自己思考一阵子后，再找3个人一起碰撞；

    - 按动静交替分配时间：坐着工作，45分钟后站起来休息，甚至Keep一下；

    - 体力与脑力互相交替分配时间：工作之余，打扫卫生洗衣服。


    ## 四、除：主动把任务碎片化


    我写这个专栏，每天写作1500字，录音就需要2个小时；可我还要工作和管理啊，哪里的时间呢？


    我主动碎片化了自己的大项目，所有的事情都分为两个部分：思考和执行，思考和执行有不同的特性。


    比如要写一份活动策划案，很多人会准备2个小时完成这个事儿。但其实我还没想清楚这个策划案该怎么做，所以只能拖着脚子想，双手抱在胸前来回踱步，越想越焦虑——不知道怎么做事就开始刷微博、淘宝，转眼2个小时过去了，但基本没什么产出。


    换一种方法会怎么样？


    早晨起床的时候花5分钟想想这个事儿，中午吃饭的时候和同事聊聊这个策划案，下午上班的时候花5分钟把自己的思路在白纸上整理下，这就是利用碎片时间思考。然后再打开Word把策划案的第一稿写下来。计算一下，其实我们只用了3个5分钟把它想清楚，然后25分钟就搞定，这就是大块时间执行，哪种工作方式效率更高呢？


    碎片化思考、大块时间执行，就是这个碎片化后的分工艺术


    碎片化思考、大块时间执行，就是这个碎片化时代的工作方式。


    ### —— 一个总结 ——


    4种碎片化时代的时间管理方式：


    - 加：提前列出 “碎片时间清单”，增加碎片化价值

    - 减：把同样场景的碎片化任务放在一起处理，减少切换成本

    - 乘：叠加不同类型工作，形成叠加效应

    - 除：主动把大任务拆分成碎片化任务


    ### —— 今日精进 ——


    看完今天的四个策略，你对于安排自己的工作和生活，有什么新的思路吗？结合上周讲过的WOOP，给自己设定一个高效能的计划。


