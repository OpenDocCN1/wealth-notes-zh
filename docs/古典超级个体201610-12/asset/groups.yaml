    ## 2-3 你的职业，还有什么可能？


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    ### 2-3 你的职业，还有什么...


    ## 你的职业 还有什么可能？


    ![](img/b7067422984faf05bb36fe56d6d8faf5_17_0.png)


    ### —— 一个观察 ——


    我们提到了自由职业态、组合式工作这两种常见未来的工作方式。除了这两种，有没有更多的职业形态？今天我们探讨三种越来越流行的新的职业形式和方式，也许在某种形式上对你有所启发。


    ### —— 一个概念 ——


    第一种：在地青年


    跨国公司有一个说法，叫做“全球化思考，本地化行动，”think global make local，职场也是一样。在所有人都涌向大城市的同时，有一股新的力量，年轻人开始思考在都市以外拥有自己的生活舞台，回到当地发展，以“在地生产，全网销售”的方式发展自己的事业。


    我的一个朋友老苗，原来在华为市场部做了10年，遇到点不开心的事，去武夷山放空。一住7天，就迷上了茶。随后一年去得越来越多，最后索性租了个小屋子，住了下来，开始跟当地人学习做茶。做茶其实不容易，一般人也不一定熬得住，但是他自己其乐融融。


    一年下来，他有了自己的品牌，一半的时间在学习做茶，一半时间在全国各地跑，一边学习，一边交朋友，也推广自己的茶叶。


    同样道理，天津美术学院毕业的设计师王成原本在北京做着视觉运营总监的工作，年薪20多万。偶然的一次机会，他听到家乡的年轻人在网上卖麒柜卖得不错，经过几番调研，最终决定回到自己被称为“中国淘宝村”的北贾村老家，做起了互联网家具生意。


    为什么这么多人选择成为在地青年呢？


    - 1. 互联网和物流的发展给了所有二三线城市一个重新崛起的机会，当地特色和互联网+有很多可能性；

    - 2. 随着消费升级，真正特色的、自然的当地优质资源正在变得越来越稀缺；

    - 3. 当地的用人成本很低，生活压力小，独特的生活环境，更加符合人的生活本性。


    这是一种全新的工作机会，也是一种把工作和生活融合的可能。


    你的家乡或者喜欢的地方有没有独特的地理、人文和文化优势？如果有的话，也许在地青年会是一个你转身逆袭的好方式。


    第二种：新工匠


    职人和工匠精神这两个词，最早来源于日本。在日本，那些有特殊技能的人有一个专有的称谓，叫做“人间国宝”。早在1950年日本颁布的《文化财产保护法》中，就明确规定了日本文部省拥有认定及解除认定“人间国宝”的权力和程序，而且每年会给予200万日元的经济支持给被认定的人。


    在中国传统思想中，“道”很重要，而“术”被放到了很不重要的地方；社会地位方面，学而优则仕，手艺人也被放到了社会的底层。这直接导致了中国的匠人精神处在很次要的地位。


    今天随着消费升级和第三产业越来越发达，中国的匠人正在越来越多地涌现出来——服务业不像传统的工业农业需要大面积协作，基本上一个人就搞得过来，同时产量有限。这个时候，优秀的手艺一定会变得越来越值钱——你想想北京好月嫂多少钱就知道了。


    找到一门你独特的手艺，成为一个手艺人也越来越成为一个好的选择。


    一位香水调配师告诉我，她是这样发现自己的天赋的：在高中的时候她们班级在六楼，每当第二节课下课，食堂已经开始做饭的时候，她就总闻出来，今天中午食堂做什么菜，吃什么……同学都不信，但是到了食堂发现就是然。在那个时候，她就意识到，自己鼻子有独特的能力，她需要找个机会展示出来。


    你有没有什么独特的功能、手艺或者停不下来能做到极致的爱好？这会成为一种职业的可能性。


    第三种：社会企业与公益


    越来越多的年轻人选择从事公益。年轻人暂时经济压力小，追寻社会意义感，往往会加入公益机构。国内的很多公益机构往往收入不高，管理不够规范，也许对于你的职业能力提升不大。你可以考虑加入现在比较流行的社会企业（以商业的组织方式完成社会问题的组织），或者在你的企业做有社会效益的事。


    京东最近就新推出一个特别好的做法。天气越来越冷，大家都在翻箱倒柜，把衣服换季，这时候容易产生大量的闲置衣物，想要爱心捐赠吧，却发现并不容易——消毒、邮寄、还要甄别地址的虚实。于是京东在北京和天津组织了旧衣回收的公益活动，你可以一键呼叫京东快递小哥上门取旧衣物，然后他们会把这些衣服交给公益组织，再分发给工友子弟们。完了，你还将获得京东提供的旧衣换新衣券一张。


    这个活动不仅真正帮到了人，也提高了京东的美誉度——消息一出来，网友纷纷自发地帮京东转发，比618大促送服饰打折券还要积极得多。


    你身边有哪些社会问题？有什么是你可以通过公益、社会企业或企业的公益活动解决的呢？这背后也有新的职业机会。


    ### —— 一个策略 ——


    在《驱动力3.0》中，丹尼尔·平克提出来三种现代工作者内在的动力：自主、精专以及意义感。


    我想正好和这三种工作形态有所对应——追求自主的在地青年、追求精专的手艺人，以及追求意义感的社会企业。这三种不同的职业方式，也是超级个体有可能工作的方式。


    ### —— 一个总结 ——


    今天我们聊到了三种越来越流行的未来的职业可能性，这三种职业和以往的通过行业、专业、工作经验定位的方式不同——在地青年通过地理资源定位，手艺人通过自己痴迷的一门领域定位，而公益和社会企业通过身边你自己关心的社会问题定位。


    随着世界的联系越来越多，世界一定会变得越来越多样，今天说的这三种方式也许你并不会去做，但是也让我们知道职业的各种可能性——就像罗素说的：


    > 参差百态，乃人类幸福本源。


    ### —— 今日精进 ——


    - 1. 这三种职业形态，有没有哪一个是让你有所感悟和启发的？

    - 2. 除了这三种，你有没有看到其他的职业可能性？


