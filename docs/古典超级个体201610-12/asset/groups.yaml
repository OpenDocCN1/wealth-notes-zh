    ### ——一个策略——


    ## 工作中的结果思维修炼


    怎样在职业中提高自己的结果思维？


    练习方式很简单——假装自己是一家“外包公司”，是“乙方”，以自由职业态的心态在做事。


    假如有这样一个情况：

    作为行政助理，你的领导请你买3张去南京的火车票，他们要参加明天南京的一个展会。但是你在网上查了所有的车次，发现已经没票了，你会怎么办？


    如果是一枚员工，也许会说：“对不起老大，您说太晚了，现在没票了，我再帮您刷刷，争取搞到哈。”


    但如果你是一家票务公司，承包了这家公司所有的出行任务，而且你就是要挣这个钱呢？你的思维方式会完全不一样。


    你也许会这么说：


    “现在有4个方案，您看看选哪个：

    A: 我用抢票软件继续刷；同时找票贩子加价，大概加价100元一张，下午应该能拿到；

    B: 如果票贩子不行，还有备选方案，去天津倒车。从天津出发的车还有票，可以买到。时间会多4个小时，价格多100元；

    C: 我查了下机票，大概贵600元每人，只需要1个半小时就能到；

    D: 实在不行，包车也可以，直接开过去需要10个小时，价格大概3000元。

    最后，我还打电话问了南京的朋友，他们让我们先把东西邮寄过去，帮我们先布展。这样我们当天早上到就可以了，我又多争取出来半天的时间。”


    同样做一件事，你觉得谁更加有价值？这其实就是不同的站位导致的不同思维方式。


    前面提到过罗伯特·清崎的ESBI系统：雇员-自由职业者-老板-投资者，他们的时间投入回报率不同，因为他们的结果思维也在不同层面。（见7-3文章）


    为什么外包思维很重要？


    在公司和公司之间，借口、过程、思路、想法……都是无法交换的，能交换的只能是结果。把自己当成一家独立的公司，一方面是一个检验自己有没有做出“可交换、可复制的结果”的最好方式，一方面也是锻炼自己的“自由职业态”的绝好机会。


    外包心态是站位，下面3个建议可以让你在职业中更好修炼：


    - 1. 确认结果：很多时候职业人士对于对方交付的只知道动作，不知道结果。要反复确认结果。


    - 2. 多给选项：不要给问答题，要给选择题；不要给单选题，要给多选题。人人们喜欢选择，这本身就是一种价值。


    - 3. 超出预期：尽可能地超过别人的预期一点点。就是这一点点让人永远记得你。


    ## 创业中的结果思维修炼


    现在把你的结果思维提高一个层面，想像一个“第二职业”的案例。


    假如你现在发现自己有一个能力——特别喜欢也擅长手绘，于是你在你的三件事里写“每天画一幅手绘”。但是——你现在知道了，这仅仅是一个行动。我们用结果思维升级一下。


    首先要问自己的是结果第一律：“手绘的结果是什么？”


    如果是开心，那么这是个兴趣，不管画成什么样子，快乐就好。


    但如果是有价值，那么结果必须是“画出一幅完整的手绘作品”。


    然后问自己第二个问题：“谁会需要这个结果？我可交付给谁？他们觉得有什么价值？”这是结果第二律：结果能交换。


    你很快会意识到仅仅是好看、表达点儿自己的碎碎念是没交换价值的（很多人的公众号也是这个问题啊）——除非你本身已经被很多人关注了。手绘的价值是能迅速传递文字无法传递的信息，而且更加形象和美丽。简单说，手绘传递的信息和情感才是可交换的。


    进一步，你发现年轻的女性特别喜欢你的画风，这些人同时也需要关于“心理、个人成长、理财、美妆”等一系列的价值。而你很喜欢心理方面的内容。


    你的结果升级成：“每天坚持画一幅对女性有帮助的、心理相关的手绘。”


    为了超出大家的预期，你在每一幅画下面，还手写了一句非常暖心的话。你向用户征集自己的“暖心小语”，也在卡片上写上他们的名字，互动就建立起来了。


    最后你问自己的问题是结果第三律：“有什么方式能够复制和放大这个结果？”


    刚开始的时候肯定是扫描成图片，发到微博，然后逐渐让喜欢的人养成习惯去微信天天刷。


    如果一旦有了规模，可以和出版社合作，给心理学图书画手绘图解——这样复制的是知识来源问题；可以设计几个固定的人物形象——这样复制的是每天的人物设定问题；还可以联系几个固定的渠道发布——这样复制的是传播途径……


    从“我要画手绘”这件事，到“用视觉传播有价值的信息”的自媒体IP的结果。其实需要的，也是“外包思维”和“结果三定律”的层层深入。


    对于自由职业者、多重身份或者创业者，持续地问这三个问题，让你做事情更有穿透力和价值感：


    - 我做这件事情，结果是什么？


    - 这个结果对谁有价值？他们看到什么东西才觉得可交付？


    - 如何让这个结果易于复制，可持续下去？


    ### ——一个总结——


    这周来来回回，我们就讲了三件事这个工具，以及“结果思维”。


    ### ——今日精进——


    我也希望超级个体这个专栏更有价值——各位请帮我回答下：


    ## 重过程还是重结果？这是一个问题 9-4


    ![](img/b7067422984faf05bb36fe56d6d8faf5_81_0.png)


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备


    我在文章9-1里说，“每天三件事”可能是世界上最简单的自我管理工具。但是，文章发出后，收到特别多关于“三件事”的提问，一方面说明大家的认真；另一方面也说明如果真有追求，世界上也根本就没有“简单”这回事。


    ## 过程还是结果——这是一个问题


    陈宏霖：我们经常听到一句话：“成功不是结果，而是一个过程。”与古典老师所说的结果思维是否矛盾？


    结果并不是和过程对立起来的，没有过程不存在结果。但是没有预先设定的结果——你都不知道“过”了没“过”，哪里有过程？


    一个人的成功不一定是他最后“赚到多少钱”的结果，但一定有“为他人创造了价值”的结果，也一定有“提升了自己能力”的结果。我们是通过结果与外界交换的，不是通过态度、感受和心情。


    过程和结果是一体两面，但是结果思维强调的是结果这一面，因为很少有人思考这一面。


    在我看来，3种场景更加需要谈过程。


    - 1. 心理活动，而非社会活动


    比如说恋爱、思考、体验、旅游、发呆，也许真的不需要什么结果……幸福本身就是一种过程性的情绪。但是所有职业、社交、沟通都需要结果。很多爱情也就是停止在过程美好但是持续产生成不了结果上。


    - 2. 成功以后


    成功以后，结果已经拿到，更加需要重视的是过程。“曾经沧海难为水，除却巫山不是云”的宏大的惆怅和失落，和“只去过香山后海，其他哪里都没去过”的失落，不是同一个层次的。


    - 3. 终极思考


    当我们把时间的尺度放在长长的一生中时，可以说“重要的是过程，而不是结果”，因为人生的结果每个人都一样，就是死亡。


    其实也不然：


    首先，很多人们都有孩子，孩子们有自己的习惯、心智，这都是你留下的结果，你死了依然延续。


    ## 世界上746重复的三件事吗？


    ## 如果没有小确幸，人生只不过是千巴巴的沙漠


    ## 关于“结果思维”，听听其他朋友怎么说


    ![](img/b7067422984faf05bb36fe56d6d8faf5_81_1.png)


    ## 也许，世界上就没有“简单”这回事 9-5


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    > 庄俊桦：我不明白，既然有这么好用简单的 方法——“三件事”，为什么不一开始说出来，而是先讲其他的方法？


    不知道你有没有听说过吃包子的笑话？某人去吃包子，吃到第8个的时候饱了，这时他不禁懊恼：早知道直接吃第8个就好了，干吗还要前边吃7个呢？很显然，这位仁兄没有看到积累的必要性。


    其实，《超级个体》专栏的内容是有其内在联系的。真的想做好“每天三件事”，除了要有本周讲到的具体方法和结果思维之外，你可能还要用到前面讲过的诸多自我管理的工具。


    ## 1.写“三件事”之前，先“清零”


    有人很忙，每天要做的事远远超过三件。还有人特别有追求，不断自我加码，要求自己完成的事不止三件。


    比如，要读书、要背英语；马上年末了，要做年终总结，还想写新年计划；另外，又打算准备圣诞礼物……


    结果，你发现自己一天也就24小时，想做的事太多，结果反倒可能一件也没有做好。这时候，你就需要先“清零”：站到原点，重新理一理你和这些事的关系；在“想做、该做、必须做的事情”中间，找出最重要的“三件”。（见文章5-1）


    ## 2.做“三件事”时，用WOOP和“加减乘除”


    我们说“三件事”的本质是三个目标、三个结果。所以，在具体操作的时候，可以用前边讲到的WOOP去执行。（见文章6-3和6-5）


    首先通过预测目标与实际障碍之间的“心理对比”（见文章6-2），确认这件事是不是可以做。确定之后，再通过“执行意图”（If……Then……）（见文章6-3）制定计划，把每件事做下去。


    比如，你的执行意图可以是：如果（If）到了下午3点，那么（Then）就马上开始做某件事。如果（If）完不成今天的目标，那么（Then）我就给大家发50块钱红包。


    另外，在做“三件事”的时候，你还可以利用时间管理提到的“加减乘除”的技巧。（见文章7-2）


    > Yujie：“三件事”里总有那么一两件，一拖再拖，一直完不成，怎么办？


    如果一个目标连续三天都留在你的“三件事”里面却毫无进展，那么这三件事已经“渗透”了，也就是没完没了地拖延。你就应该停下来，专门研究一下它为什么会渗透。


    一般来说，目标渗透的“罪魁祸首”有三个：不想，不能，不应该。


    - “不想”，是心里没有真正重视；

    “不能”，是你重视了，但能力和资源不够；

    “不应该”，问题不在你，环境不允许你做。


    ## 1.破“不想”


    - 1）静下来想想，不做这件事情会有什么坏处？你是不是可以承受？

    2）告诉自己不需要那么完美，先开始。完成比完美更重要。

    3）还有两种情况：①这事不重要。那么果断删除，短期不去想，等它冒出来的时候再说。②这事真的很重要。那么用“吞青蛙法”。一般来说，早 上精力最充沛，可以安排2个小时做最难的那件事。解决之后，接下来一整天都会很轻松。


    ## 2.破“不能”


    - 1）细分目标，降低难度

    2）找到一个启动点

    3）使用番茄钟


    ## 3.“不允许”的可能性：


    - 1）空间不允许。如果是因为环境太吵，没法做事，那就换个环境。

    2）时间不允许。这属于内因，可以从前面两点去找到具体的原因。

    3）人不允许。如果不断被人打断，那么就直接和他沟通，说清你的诉求。


    问问自己到底是怎么在妨碍，然后根据原因找到解决办法。总的来说，目标渗透并不是一个坏事，它能帮你看清想象中的自己和真实自己的差距。找到差距，合理归因，所有的问题都可以一一解决。


    你发现没有，三件事虽然号称“世界上最简单的自我管理工具”，可是在具体操作层面，却可以融入使用这么多之前讲过 的东西。


    所以——也许世界上根本就没有“简单”这回事。以结果和交付的标准来衡量，每天做好“三件事”，已经足够多了……


    ## —— 今日精进 ——


    - 1. 你在做“三件事”的时候，有没有用到之前讲过的工具？如果有，是什么？

    2. 在使用“三件事”时，有目标渗透的现象吗？自己对照今天讲的内容分析一下，它们是“不想，不能，不应该”中的哪一种呢？


    今天是古典陪伴你成长的第64天，一起加速，成长为更好的自己。


