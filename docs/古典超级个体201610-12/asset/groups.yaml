    # 3-4 问答 | 也许你的努力学习不是饿，而是馋


    ![](img/b7067422984faf05bb36fe56d6d8faf5_27_0.png)


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    # 一、学习的显微镜、平面镜和望远镜


    大家已经开始三周了，不知道有没有发现一个迂回？


    每一篇文章都有自己的主题，但是其实每一周有一个隐藏的大主题，主题背后是一个核心的理念。


    你可以自己在心里回顾一下：


    第一周：


    职业的新价值体系、新能力体系、三种赛道


    讲的是未来职业世界的“大陆和海洋体系”，每个人都需要变成“两栖人”。


    第二周：


    自由职业态、组合式工作、更多可能性


    核心是“自由职业态”，怎么样把自己经营成一家公司，如何组合不同部分，如何创造更多可能性。


    站在这个角度，其实意图就更加清晰，思考更简单有力了。


    文章也需要“三种镜”，逐字读是显微镜，通读然后比对自身是平面镜，跳出来站在三篇之上的通读，是望远镜。


    只有站在这三个角度读，才有可能看到细微之处，也能见到顶层设计。


    所以巴菲特只读公司年报，不读每日股价，他找的就是价值的脉络和走形。


    所以顶级商人看《新闻联播》，不看今日头条。


    所以我建议大家可以在周末的时候，把本周三篇文章连读试试。


    # 二、焦虑性学习和目标性学习


    本周三篇文章主题分别是：


    职业发展四要素、职业发展的2种策略、生涯发展的三个阶段


    那么，你停下来10秒，思考下一本周我们想说的东西是什么呢？


    我们讲的是“现实理想主义”。


    +   1. 为什么不喜欢当前的工作？这些原因在做培训师的时候就不会发生了吗？

    2. 如果培训师能解决这个问题，学习英语真的是成为培训师最好的方法吗？

    3. 必须年度心理学博士才能做培训师吗？有多少杰出培训师是有心理学博士学位的？

    4. 如果要活成自己喜欢的人，现在最需要做的事情只有在下班后才能做这些事情吗？在上班的8小时有没有机会做？


    思考下来的结果，很多人不anqu…发现——现在努力做的事情，和真正的发展关系不大——那不是你的需求，是你的焦虑。


    你现在学的不是你需要学的，而是你最容易学的，或者学得最舒服的。


    你不是饿，是馋。


    目标性学习的思路是：


    +   1. 我想做的事情是什么？如果目标是希望成为某人那样，那么他的成功要素到底是什么？

    2. 我今天学习的东西和达到那个目标有关系吗？

    3. 如果有关系，现在的方式是我当前最好的选择吗？

    4. 那么下一步我该做点什么？


    如果你能回答这四个问题，你就开始真正上道了。


    最后再强调一遍本周的主题：现实的理想主义攻略。


    # 三、知识众筹案例


    我们明天统一回答大家的留言和评论。今天，我们先看看这两天众筹收集的问题。


    前两天做了一个众筹——收集大家的职业问题，后台一下子就爆了……原来你们有这么多问题啊！


    今天大家先一起来探讨的话题是：在公司没有人带，怎么办？


    下面是两个真实的案例：


    panpan_yy：管理咨询行业的一名战略咨询顾问。


    困惑没人带没人教，完全靠内驱力。但是这个职位也需要合伙人给予适当的反馈。和上司沟通，他说这就是这里的文化，在战争中学习战争，关键是项目（战争）也不是每天都有，现在更多的时间是自己看书，做案头研究，写出来的东西也无人反馈。

    现在我能想到的除了离职也无其他解决办法了，古典老师能否提供其他的解决方案？


    李建男：我目前在国内最大的O2O公司之一做产品经理，负责帮助商户优化线上交易效果，提升销售额和美誉度等。

    对于一个起步期的pm来说，这份工作和我个人的愿景契合度很高。工作如果要做好，需要在数据分析和商业营销方面都有非常深的积累，这也正是自己希望的发展方向。但问题是，尽管这份工作要求很高，但周围的同事在这两方面都没有很深的见解。要做好基本要靠自己摸索，但是这样进展会很慢，而且自己对学习的效果也没谱。我希望得到的帮助是，想听听有经验的前辈帮我提提建议：在职业起步期遇到这种问题时，是应该驻扎科室修炼，继续自我的探索；还是尝试和公司申请高级人员来跟随学习，哪种才是积极的解决之道？


