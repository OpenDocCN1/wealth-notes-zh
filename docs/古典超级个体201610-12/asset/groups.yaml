    一起加速的第34天


    其实，断舍离的原理非常简单：“以自己而不是物品”为主题，“以现在而不是过去或者遥远的未来”去思考什么东西最适合自己。


    # —— 一个观察 ——


    前两天我们都在讲理念，从“过去依赖”开始讲起，到“人和物的关系”以及三种错误的心智模式的辨识——今天我们谈谈看如何通过实物物件处理来达到自我修炼。


    # —— 一个策略 ——


    +   1. 明确一个观念，清理的主角不是物品，而是现在的自己

    2. 从“怎么看都是垃圾的东西”开始下手，单点突破

    3. 更好更聪明的舍弃

    4. 最后，通过总量限制和“每次主义”，从源头上防止物品泛滥


    # —— 一个总结 ——


    +   1. 以自己和当时为坐标判断问题；

    2. 从垃圾入手，从小地方开始；

    3. 三种更聪明的舍弃方式，利用网络APP，利用聚会，每天放弃一点点；

    4. 控制人生库存，坚持每次主义，尽量保持零库存。


    # —— 今日精进 ——


    +   1. 今天：尝试空出来30分钟时间，给自己来一个小的清理动作，比如说从你上班的包和桌面开始。

    2. 本周：用1小时时间，清理一下你的桌面、手机APP、电脑桌面或者一个常用的抽屉。

    3. 在下面留言：你会把这套清理术，迁移到自己除词物品以外的哪些方面？比如自我管理、理财、朋友交际、购物理念等？


