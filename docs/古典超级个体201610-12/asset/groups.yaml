    # 这4种方式，像锻炼肌肉一样提升精力 8-3


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    8-3 这4种方式像锻炼肌肉...


    # —— 一个观察 ——


    前些天王健林一天的日程表被曝光了，他4点起床，花1小时健身，全天飞三个地方见人，晚上7点回到自己的办公室。大家都感叹——有钱人都这么努力，我们该怎么办？


    其实这个是普遍现象——我在“做自己”论坛上和方勋老师有过一面之缘，他说自己每天只睡4个小时。以前在新东方，和俞敏洪老师喝酒到深夜，第二天一大早我就见他坐飞机出去讲座了。查理·芒格今年92岁，依然开全天的股东大会，每天早上7：30开早餐会。


    据我的观察，优秀的企业家都是精力充沛的人。这些人充沛的精力不是一天，而是持续十几年这么充沛。显然，这绝不仅仅是主动休息的功劳，他们还懂得如何提高自己的精力储备。


    # —— 一个概念 ——


    不知道你去过健身没有？教练一般会对你说，一定要做到“力竭”才最有效。因为肌肉的纤维被拉断，然后重新生长，会成为更多、更粗的纤维。


    从精力管理的角度来看，精力的“肌肉”也是可以锻炼的。要提高精力，我们必须系统地让自己承受超过一般限度的压力，然后进行充分恢复。


    减少或避免压力，和压力过度得不到恢复一样，都会让精力萎缩。


    《柳叶刀》(The Lancet)上发表的一项研究中，研究人员调查了卧床休息对大约1.6万名患15种不同疾病的病人影响。结果，排除治疗因素后，发现长期卧床并没有对病人产生显著的帮助。相反，往往延迟了病人的恢复，在有些病例中还对病人造成进一步伤害。


    提高自己的精力只有一个方法——长期、主动地突破压力极限，并且用高效率的方式迅速恢复。


    # —— 一个策略 ——


    有4种提高精力的方式：


    - 1. 提升身体能量


    提升体能精力的最好方式是吃、睡、运动，而吃排在第一位。


    少吃多餐，让自己保持在稳定的血糖水平，对思考有积极影响。


    富含碳水化合物的零食或许能在15分钟内集中注意力，开会时放一些在桌上是个好习惯。


    每天喝1.5-2升水（250毫升的杯子6-8杯），能让你变得敏锐。研究表明，当缺水时，人们会易怒、疲倦和难以集中注意力。


    非常忙的时候，坚果是最佳选择。


    持续运动能显著提高精力，但是研究显示，中等强度的有氧运动（可以出一点汗，放松酸痛的肌肉，呼吸比平时更重一点）对于大脑供氧和主动休息有很大的好处，但是强度过高会恰得其反。最好的方式是每天固定的跑步或者散步。


    很多企业大佬都是跑步和运动高手，精力充沛。


    - 2. 提升情绪精力


    盖洛普咨询公司曾经对高效能人士做过一个世界性的调查。发现持续高效能的关键因素之一是在工作中至少有一个好朋友，因为好朋友会互相赞赏与倾听。


    积极的情绪是重要的情绪精力。


    和积极思考、快乐的人待在一起，找到一个欣赏你的圈子，有一项让你放松和快乐的爱好都会让你提升情绪精力。


    - 3. 养成“精力习惯”


    > “如果你每次做某件事之前都需要思考一下，那么你很可能不会长久地坚持去做这件事。”


    提前一天做好决定会让你省下很多思维精力。但是更好的方式是——


    规律化地生活，自动化地执行，这将替你省下许多决策精力。


    奥巴马就经常将日常行为常规化，比如，他一般只穿蓝色和黑色西装，每天早上按照固定的习惯去健身、浏览简报……这样，他不用耗费太多精力就能完成许多事情，可以留出更多的思维精力做决策。其实就是我们谈到的执行意图，只不过通过持续的强化成为了习惯。


    - 4. 提升精神动力


    对于大部分人来说，前三点是量的区别，这一点却是质的区别。


    为了柴米油盐奋斗的人与为了真正激动人心的目标奋斗的人，释放出来的能量是完全不同的。强大的精神能量来自于坚定的价值观和超越眼前、怦然心动的目标。


    金融服务商坎托·菲茨杰拉德（Cantor Fitzgerald）在世贸中心办公。在“9·11”事件中，它纽约办事处的1000名员工有2/3以上的人丧生，公司的计算机系统和大量数据也被破坏。


    几天后，坎托的董事会宣布在接下来的5年里将公司利润的25%送给遇难员工的家人。原本是一盘散沙，的幸存者们被点燃了，他们决定为这个目标而奋斗。


    这样做的结果是惊人的奉献精神和精神力量，员工们开始每天工作12-16小时。2006年，公司完成自己的承诺，为遇难者家属募集了1.8亿美金。


    # —— 一个总结 ——


    精力就像肌肉一样，持续的突破极限、迅速恢复是让精力充沛的唯一方式。


    有4种提高精力的方式：


    - 提高体能精力靠饮食、睡眠与运动；提高情绪精力主要依靠积极的情绪与互动；提高思想精力通过建立“精力习惯”降低损耗；找到精神目标能调动精神力量。


    # —— 今日精进 ——


    - 1. 【我要分享】当学习到了精力提升的4个技巧，扫描一下自己的生活——你自己有哪些损耗精力的坏习惯？

