    ## 6-4 互动讨论｜你的目标，怎么公布才更容易实现


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    本周的一个话题引起很多朋友留言讨论：“我们到底要不要把自己的目标告诉别人？”我摘出了几条代表性的留言，大家先看看他们的观点，然后我再说我的看法。


    狐狸焚丹54940251：罗胖处处声称每天坚持六十秒语音，坚持二十年跨年演讲，都是走的这个套路：先吹牛，自我加压，然后行动。


    清音：把自己的目标说出来，可能导致的一个问题是你的大脑可能会感觉你已经做成了，大脑感受到了某种满足感。当你有了这种满足感以后，再去做这件事的动力就少了。


    朱燕飞：贾平凹曾写过一个和尚传给他成就大事的秘诀：“心系一处，守口如瓶。”


    之所以在文中建议“有了梦想先行动不必忙着公布”，是原因在日常生活中，“公布”这个动作既是许多人梦想的起点，也成了他们梦想的终点。他们宣布梦想时，在大脑跨越现在进入未来的体验里，享受了任务完成的快感——他们沉浸于“梦想”的“嘴炮”里自鸣得意，而忽略了正确评估、实现策略以及持续行动的重要性。


    ### 1. 说什么？


    有兴趣可以看看《TED：不要公开宣布你的个人目标》。


    这个视频里引述的论文（Gollwitzer et al.,2009）中所指的目标，更多是指关于个人身份的目标，“你知道吗？我以后要做一个律师！”“我要成为一个很伟大的人！”这种目标。


    ### 2. 对谁说？


    获得社会认同是人很重要的需求之一，说出目标只是第一步，关键是你说的对象是否能给你正向积极的监督和反馈。


    心理学里有一个皮格马利翁效应（Pygmalion Effect）：艺术家皮格马利翁精心地雕塑了一个美丽可爱的少女，然后自己爱上了她。


    - 1. 世界上最高的红杉树比180英尺高吗？

    2. 你觉得世界上最高的红杉树是多高？


    - 1. 世界上最高的红杉树比1200英尺高吗？

    2. 你觉得世界上最高的红杉树是多高？


    ### 3. 什么时候说？


    行动再说，效果更好：最好的方式还是先行动一段时间，评估这件事情的可行性以后再开始。


    - 1. 说“目标+计划”比直接说“目标”好；

    2. 和对你有积极期待的人说；

    3. 目标，尤其是新目标，一定要行动一段完成评估之后再说。


    社交监督让你加压，社会认同让你减压，调好这个压力值是“是否说”、“何时说”和“对谁说”的关键。


    ### —— 今日精进 ——


    - 1. 你最想实现的目标是什么？

    2. 针对你最想实现的目标，你会在什么时候说什么时候？请在下面留言区留言。


