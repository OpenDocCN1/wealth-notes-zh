    # 王双：什么是真正的跨界？


    圈子思维，我理解是“跨界打劫”，你在自己本行业的圈子专业技能一般，但是放到另外一个圈子却可能是大牛，比如在厨师圈，歌唱得最好；在娱乐圈，书写得最好等。


