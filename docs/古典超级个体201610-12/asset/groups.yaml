    # 用结构思考做清晰有力的年终总结 10-1


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    10-1 用结构化思维做清晰…


    # —— 一个观察 ——


    就要开始做年终总结了，但是却杂乱无章？我们先看结婚明年的年终总结。


    2016年我成功举办了两场全国性的市场活动；完成了职业生涯认证班的学业，2017年可以获得证书；儿子考研成功，并帮助他步入学业正轨；学习《结构思考力》获得了“精英学员”称号；获取了社群学习、超级个体等新概念；帮助了600名学生入学；亦兔等平台学习让个人成长思路打开；帮助侄女留学成功，弟妹和父母成功获得了加拿大签证……


    看完这样一个年终总结以后，你有什么感受？


    没错，一个字——“乱”。尽管说了很多年内完成的事情，但听的人完全不知所云，一个也记不得。


    没有要点、杂乱无章的年终总结往往对他人没有任何说服力——人的大脑只能接受“结构化信息”。


    # —— 一个概念 ——


    何为结构？


    结构可以说是万物之本。在物质世界，大到太阳系是结构，小到颗粒尘埃原子分子也是结构，世界太复杂，我们通过结构来简化世界、认识世界；在思维世界，人们也同样通过结构来认识事物、认识其中的规律。


    何为结构思考力呢？


    结构思考力就是通过结构的方式来系统思考的能力。


    举个例子：如何把200ML的水装入到100ML的杯子呢？


    按照你的经验，可能 prevenzione...


    杯子太小：换大杯子、拿两个杯子、换个像气球一样的杯子……


    水会流动：冻成冰柱、用一个袋子装起来……


    外部环境有引力：放到太空中去、放到无重力的实验室中……


    ![](img/b7067422984faf05bb36fe56d6d8faf5_84_0.png)


    结构思考力的核心理念源于麦肯锡的“金字塔原理”，1973年由麦肯锡国际管理咨询公司的咨询顾问芭芭拉·明托发明，为了更好地阐述写作过程的组织原则，提倡按照读者的阅读习惯来改善写作效果。经过40多年后人的优化、整理和应用，形成一套结构化思考和表达的方式。


    你可以想象一棵向下生长的树。纵向结构上每一组的观点都必须是其下一个层次观点的概括。横向结构上，每组中的各个观点互不重叠且有一定的逻辑顺序。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_84_1.png)


    这个图看二去很像一座金字塔，所以也叫做金字塔原理。


    金字塔形成了一个严谨的逻辑体系。通过这样的方式总结，就可以通过迅速抓住我们要的主旨，帮助听众沿着我们的思路去理解内容，表达和沟通都会清晰高效很多。


    # —— 一个策略 ——


    结构思考力的四个核心原则：


    # 原则1：【论】结论先行，先说结果后说过程


    因为从听者的角度来讲，都特别希望在接受信息的时候知道对方总结出的结论是什么、工作结果是什么，而且希望能最先听到。


    不过遗憾的是我们日常的表达习惯正好相反，比如一位多年不见面的老同学，见面结果聊了半个小时，结果前28分钟都回忆当年的校园生活，最后2分钟临走的时候说：“这次来主要想……借……点……钱……”


    # 原则2：【证】以下证上，下面的数据证明上面的观点


    每个主论点都是下面的论点和数据的概括。每个论点也都被下面的事实所支持。


    我读行业报告时，如果是一份优秀的报告，有时会看看PPT内容，没时间就直接看标题。因为下面的内容是支持主结论，而结论就是PPT标题。


    ![](img/b7067422984faf05bb36fe56d6d8faf5_84_2.png)


    # 原则3：【类】归类分组


    分组时，你会发现有的关于工作，有的关于家庭，有的关于学习，这时你需要把这些内容进行分类，分类之后，表达会变得更加清晰。


    这些类别最好是彼此不交叉的，比如说工作、学习、家庭生活就挺好。但是如果分为工作、学习、社交，就可能会有交叉。


    # 原则4：【比】逻辑递进，有一定的逻辑顺序


    有顺序，能让人更容易理解和记忆。常见的逻辑顺序包括时间、重要程度、结构顺序三种。平时表达时，就可以按照这些顺序来说，比如SMART原则。


    综上，运用四个原则修改后的总结应该是：“2016年我的人生多维度平衡发展：工作业绩超额完成，获得学习成长，孩子学业有成、家庭关系融洽。”


    ![](img/b7067422984faf05bb36fe56d6d8faf5_84_3.png)


    有了这样一张结构图以后，你可以在短时间内，把任何一件事说清楚、说全，只是深度会有不同而已。


    比如说你只有一句话时间，那就说结论；有1分钟时间就说第二层；3-5分钟你可以说第三层；30分钟，则可以抓住一个故事展开来说。如果想深入，你可以再往下，再展开来介绍。


    这样一种表达方式，背后隐藏的就是一张金字塔结构图。


    如果你花30秒说不清楚一件事，那么给你30分钟、半天时间，你也未必能说清楚。最重要的是区别，就是你有没有这样一个清晰的结构。'
