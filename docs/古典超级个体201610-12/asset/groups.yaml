    \n# 超级个体\n\n# 为什么说——梦想会妨碍你成功？\n\n![](img/b7067422984faf05bb36fe56d6d8faf5_49_0.png)\n\
    \n+   1 自我琢磨\n2 跳出困境\n3 心灵平衡\n1 降低行动力\n2 忽略现实障碍\n\n·起源增加速的第39天\n\n梦想就像保释，最好的方式是你自己先充裕三个月，稳定以后才告诉别人，以免流产。\n\
    \n# —— 一个观察 ——\n\n大概在我24岁的时候，偶尔看到一本书的扉页，上面写：\n\n> “告诉我，你狂野而宝贵的一生，准备用来做什么？”\n\n\
    当时我脑子就像被电击了一样，无数悸然心动 vermeiden 的想法在脑子里闪过……\n\n# —— 一个概念 ——\n\n梦想是一种对于自己未来的积极期待，这种期待里蕴含了神奇力量。\n\
    \n生涯咨询师会问客户“5年后你最完美的一天是怎样的”，老师会问孩子“你长大希望成为谁”，试论梦想能让你开始深层的自我探索。咱们专栏开头讲的“车日路”，其实也是一种自我探索。\n\
    \n教练用强力问题提问被困在现实障碍中的人：“假如最后你完美地解决了这个问题，回顾下你是如何做到的？”积极的幻想让你有一种跳出困境看问题的角度。\n\n美国存在主义之父维克多·弗兰克在集中营依靠希望活下来，漂流在海上的\
    \ 人依靠幻想和祈祷生存——乐观的期待和幻想有力量让苦难中的人平静。电影《肖申克的救赎》中，安迪说：“希望是个好东西，也许是最好的一个。”\n\n梦想为什么会有这么多神奇的功能？\n\
    \n心理学研究发现——我们的大脑其实无法分辨什么是幻想，什么是真实。我们会对两者做出同样的反应。\n\n+   不断幻想享用美食的人，现实生活中会降低对美食的期待；\n\
    幻想复仇的人，现实生活中会降低复仇率；\n幻想运动的人，血压会真实地上升；\n每天30分钟的大脑预演训练，等于2小时的真实练习效果……\n\n当你幻想一个积极乐观的结果时，你等于在跨越现实，直接体验到一个最好的未来。现在不是流行VR吗？我们的大脑功能里其实早就有一个VR，功能强大，都进化200多万年了。\n\
    \n本世纪初，以马丁·塞利格曼为代表的积极心理学认为：当人们在“积极的心理预期”下，更有可能走向成功。积极乐观也成为社会的一个主流价值观。当你开始为未来担忧，所有人都会和你说，“开心一点啦，未来会好的”。各种故事也告诉你，“想最好的一面，坚持到底，最后就有神奇的结果”！\n\
    \n不知道你是不是和我一样，乐着乐着心里有点发毛——这么乐观真的没问题吗？\n\n另一名德国心理学家厄廷根 (Gabriele Oettingen) 通过大量的实验与调查，对这项观点提出了质疑，她用20年的实验结果和严密的论证修正了这个观点。她认为“单纯的乐观对于成功也许是一种阻碍”。\n\
    \n厄廷根统计了1933年到2009年这76年时间里的美国总统就职演说，发现总统就职演说中对未来的期望越是乐观，其后任期内的国内GDP就越低，失业率就越高。这么一想，特朗普当总统没准儿还挺合适。\n\
    \n![](img/b7067422984faf05bb36fe56d6d8faf5_49_1.png)\n\n为什么太乐观反而不好？问题就在那个梦想的神奇功能——跨越现在进入未来的体验里。\n\
    \n# 1. 乐观的幻想在我们脑中形成美梦成真的假象，也虚耗了我们的动力。\n\n一个实验显示，幻想过后的人，大脑会以为已经达到了目标——他们精神会愉悦，表情放松，血压也会降低（2-5单位）。人在这种情况下会快乐愉悦，却会更少机会行动，更不愿意承担困难的任务。\n\
    \n为了激发动力，也许有人会建议你把梦想给周围人晒——尤其是在一群热衷于谈“你有什么梦想”的环境里，你会换来一系列的鼓励——这极大地满足了你的被认同感，进一步削弱了你的动力。这就是你在很多成功学场合看到的那样——场内感觉太好了，回去以后没法执行。\n\
    \n为了抵消梦想不执行的失落，你开始确立、宣布下一个梦想——有志之人立长志，无志之人常立志，就是这个道理。\n\n# 2. 乐观的幻想让你专注好的部分，而忽略现实的障碍。\n\
    \n一个太过乐观的人，在面对一件事时，他的意识雷达只搜索关于这件事情能成的所有理由，却对悲观的理由视而不见。美梦把他的认知束缚在梦想里面，而将那些从客观角度分析可能有的问题置之不理。\n\
    \n# —— 一个策略 ——\n\n该怎么办呢？下面是让梦想落地的策略。\n\n+   1. 有了梦想先行动，90天以后再公布，以免从行动中失去动力。\n\n\
    有了梦想，你可以做愿景板自我激励，但\n\n有了梦想，你可以做愿景板自我激励，但是千万不要到处告诉别人，以免社会认同进一步降低你的行动欲望，这让你的梦想更加难以实现。\n\
    \n梦想就像怀孕，最好的方式是你自己先怀着三个月，稳定以后了才告诉别人，以免流产。\n\n# 2. 尽快找到梦想的现实投影——榜样。\n\n有了梦想以后，一定要找到梦想在现实生活的投影——榜样或者标杆人物。在研究标杆人物的时候，如何成功的不重要，更重要的是他克服了哪些障碍？是如何克服的？这会帮你避免梦想的副作用。\n\
    \n# 3. 尽快从梦想中清醒，找到与梦想配套的障碍和行动方案。\n\n梦想是个好东西，但是 Mikhail ...\n梦想是个好东西，但是 Jump? \n\
    梦想是个好东西，但是是一直被夸大它的力量。\n\n今天我给你的提醒是，不要向梦想要求它给不了的东西——除了梦想，你还需要评估、策略和持续的行动。\n\n#\
    \ —— 一个总结 ——\n\n梦想可以让我们做深层的自我探索，跳出困境思考问题，以及获得心灵平静。\n\n仅有梦想会妨碍你真正的成功，因为梦想会降低你的行动力，忽略存在的障碍。\n\
    \n梦想的力量一直被夸大，我们需要学习更多策略，恰当应用梦想的力量。\n\n# —— 今日精进 ——\n\n罗列一下你 “很想做但是没有做成” 的3件事。没有做成的\
    \ honom原因到底是没有行动的欲望，没法克服障碍，还是当时忽略了很多负面的信息？\n\n今天是古典陪伴你成长的第 39 天，一起加速，成长为更好的自己。\n\
    \n![](img/b7067422984faf05bb36fe56d6d8faf5_50_0.png)\n\n关注微信公众号 “得到”\n\n点击屏幕右下角\
    \ “请朋友读”\n\n![](img/b7067422984faf05bb36fe56d6d8faf5_50_1.png)\n\n# 6-2 问自己这3个问题，通过“梦想”可行性检验\n\
    \nHi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。\n\n6-2 心理比对\n\n# 超级个体\n\n![](img/b7067422984faf05bb36fe56d6d8faf5_51_0.png)\n\
    \n积极期待 + 现实编码 = 心理比对\n\n一起强大加成的第40天\n愿上天给我力量，改变可以改变的事；赐予我勇气，接受不可改变的事；给予我智慧，区分两者。\n\
    “心理比对”，就是区分两者者的智慧。\n\n# —— 一个观察 ——\n\n昨天我们提到了梦想的优缺点，也提到了一位挑战积极心理学的德国心理学家加布里埃尔·厄廷根。\n\
    \n其实学术圈也是一个时尚圈啊，你想着法子提出新观点，还得反常识，刷三观，发文章——才是高水平 X 专栏作者。厄廷根找到这么一个切入点，很好地提高了自己的学术地位。\n\
    \n当她的研究做到一定程度，把“积极乐观的心理期待对成功有毒”这个论点坐实了之后，她突然开始思考初心——我做这个研究，是为了让人们有更好的梦想，而不是不要梦想啊，有什么方法可以调和梦想的负面效应呢？\n\
    \n这就是我今天要和你分享的一个工具：心理比对。\n\n# —— 一个概念 ——\n\n加布里埃尔·厄廷根提出一个想法，虽然积极幻想的麻烦是不行动和不考虑障碍，那么直接在梦想以后还加上一个对于障碍的\
    \ souligne，会不会增加行动和成功的概率？也就是说，你在大脑VR看完最好的剧情时，马上开启第二个频道——把现实中最大的障碍放到前面。\n\n她把这个心理技巧叫做“心理比对”，在她的著作《WOOP思维心理学》中详细论述了这个技巧。\n\
    \n她找到德国柏林2所大学的168名女大学生。首先让她们幻想一下自己最大的个人愿望或者最关心的个人问题，然后让她们按照从0-100的排序评估她们实现愿望的可能性大小。每个人都需要写出4个有关实现愿望的积极乐观的词语（比如感到被需要、陪伴彼此的时间更多、感到有人爱着我等等），和4个负面消极的障碍词语（比如害羞、太情绪化、学业繁忙等等）。\n\
    \n然后分为4组：\n“心理比对”组：先幻想2个乐观未来的词汇，然后让思维转化到2个消极现实的词汇；\n“乐观幻想”组：只幻想4个乐观未来的词汇；\n“消极现实”组：只幻想4个消极现实的词汇；\n\
    “逆序比对”组：先幻想2个现实消极的词汇，然后是2个乐观未来的词汇。\n\n仅仅是思考的词汇和顺序不同，结果让人惊讶：\n\n先来看看另外3组，这3组的表现类似——不管预期值高低，她们都行动力不佳，平均在9天以后才开始采取行动。其中“乐观幻想”组的人特有趣——预期值越高的\
    \ 人，反而行动起来越慢，她们也是遇到现实死得最快的一组。\n\n让人惊讶的是“心理比对”组。本来以为这个组所有人都会有很高的成功率和行动速度。事实上这个组中间只有一部分学生觉得有干劲，并且立即开始了行动，而且行动持续时间长，成功率也高——其他人并没有这么做。原因是她们效完心理比对以后，对这件事情本身的评估——本来就觉得不靠谱，于是就不干了。\n\
    \n心理比对之所以起作用，因为通过预演未来回答了一个问题——这个事情我有机会成功吗？如果答案是“是”，这群人投入的时间和行动力比所有组都高。如果不是，这群人投入的干劲则会比一般人还要低。\n\
    \n![](img/b7067422984faf05bb36fe56d6d8faf5_51_1.png)\n\n“心理比对”的真正意义在于让这些人成为一群优雅的“理性乐观派”。\n\
    \n他们并不会看到一个梦想就随便“点火”。如果他们评估完觉得有机会，他们会全力以赴。如果评估完觉得机会不大，他们会迅速放弃，投入到更加可能的项目中去。\n\n\
    > 厄廷根说：“人在追求梦想的时候，力量是最大的。但并不随意的一种，而是过去经历评估过自己行得通的一种。”\n\n这个简单又神奇的“心理比对”能让一个人的心智变得成熟——我们经常被人类说——你做事情没有轻重，不知道好歹，拎不清。“心理比对”能让你学会评估、知道好歹、知道自己几斤几两、不会随便是点火——成为一个理性乐观派。\n\
    \n有一段著名的祈祷词：“愿上天给我力量，改变可以改变的事；赐予我勇气，接受不可改变的事；给予我智慧，区分两者。”\n\n“心理比对”，就是这个聚拢资源在可为之事，快速放下不可为之事的区分的智慧。\n\
    \n> “心理比对”其实解决了2个最常见的问题——第一个是前面提到过的光想不做。第二个就是三分钟热度。三分钟热度的人，就是对于未来有过高预期的乐天派，总觉得这件事也许可以，那件事也许也可以，很少思考趋势、资源、时势。事实上你不是乐观，你是侥幸。12笔者记\n\
    \n理解了心理比对，我们回头看看成功学就会有深刻理解——为什么成功学不靠谱。成功学故事几乎是一个反心理比对：\n\n+   1. 放大了乐观、预期和梦想，短期减压，长期降低了行动力；\n\
    2. 为了突出大师的厉害，放大了个体可能性，弱化消极现实（恰恰是幻想最大的副作用）；\n3. 鼓励人们不顾一切追寻自己的梦想（乐观幻想派死得最快）。\n\n\
    但是从商业模式来说，也能解释为什么成功学模式能成功：还是有很多人从成功学中受益——成功学起作用的一个重要条件就是要人多——只要人多，人群里就会出现一群“本来就有实力，也充分考虑了消极现实”的人，这群人只要增加点儿“纯鸡汤”，就能完成心理比对，信心十足，全心投入，真能成功。\n\
    \n而一个一万人的课，有3个人成功，就足够开下一期3万人。这是一个放大小概率事件、获取大众资源的方式。\n\n你也别说人家黑，股市赚钱、彩票购买，都是这个套路。\
    \ 只是套路了。\n\n# —— 一个策略 ——\n\n你也可以尝试给自己来一个“心理比对”，下次遇到定计划、思考梦想的时候，按照顺序思考这些问题，最好方式是写下来——依次回答下面的问题：\n\
    \n+   你的期待是什么？\n在当前的情况下，这个期待最好的结果是什么？\n在当前的情况下，最大的现实障碍可能是\n"
  mdcn: "\n# 5-5 问答丨知识、关系、管理的断舍离\n\nHi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。\n\n王^_琴：学习内容、渠道太多，似乎每一个都不想放弃，每一个都想学，只是想在学前教育żenia领域精进，都有那么多内容需要断舍离。但是在工作中又发现似乎每个方面都要懂，导致自己什么都想学，可是什么都不精。综合能力和专业精深怎么破？\n\
    \n古典\n\n断舍离不是归纳和整理，有序的杂物依然是杂物，整齐的垃圾还是垃圾。\n\n断舍离也不是去东西，而是通过放弃和限制购买东西，让自己达到人物相宜的“离”的状态。\n\
    \n总之，重点并不是东西。断舍离最重要的是，其实是通过清理物品，理解自己的心智模式，知道自己被什么困住，然后有意识地调整自己生活的方方面面。\n\n知识也是需要清理的。同样可以问自己2个问题：\n\
    \n+   1. 这个信息对我当下的事情需要吗？舒服吗？\n2. 这个信息在多久会有用？\n\n从这两个维度来分析，你会发现：\n\n+   1. 大部分的热点新闻，2周以后会完全过去，未来基本没用。\n\
    2. 每个领域都有很大一部分的系统知识已经过时，并不一定要学完。\n3. 以当前应用场景倒逼学习内容，马上会回馈的是值得使用的。\n4. 核心的通用技能、才干是值得投入和保留的。\n\
    5. 未来的能力（详见第一周的内容，比如《1-2 未来哪些能力会越来越增值？》、《1-3 未来职业世界，只有三种人》）是值得保存的。\n\nJJ：“断舍离”我同样应用到了交往朋友中，我觉得朋友的数量应该是做减法的。就是在刚认识、熟悉的过程中，慢慢淘汰掉一些没有诚意、不愿意付出的人。想请教老师，怎么做既做到最好的“断舍离”，又不会让自己没有朋友？\n\
    \n古典\n\n断舍离强调“需要、适合、舒服”的，朋友也是这样。\n\n我有两个很好的朋友，我们三个老男人定期一聚，美其名曰“纵贯线”。见面5个小时，他们一个会和我们谈摇滚，谈潜水到50米的感觉，另一个会为我们读诗，朗诵莎士比亚。然后喝点酒，尽兴而归。冬天走在路上，那种温暖的理性主义，顶2条毛裤。\n\
    \n这种朋友，其实不需要太多，三五个足够了。\n\n你需要区分的是：挚友、朋友、熟人、商务伙伴。\n\n挚友三五个，价值观一致；\n朋友一二十，趣味相投，能玩到一起去；\n\
    熟人是弱联系，了解彼此背景，知道对方状态，有事情可以互相兑换意见资源；\n商务伙伴则成百上千，为了流通资源。\n所以——你需要不是断舍离，而是分层。\n\n\
    仔细观察之下，你发现组织管理者也许是最需要断舍离的。\n\n## 管理者的断舍离\n\n断：宁愿找2个员工，发3个人的钱；也不想要找3个员工，每个只能干0.8的活。\n\
    \n舍：有没有哪个员工过来找你递辞呈，你心里突然一片释然？那就是你早就应该开掉的员工。\n\n离：职场的最高境界是，你觉得和组织之间非常心平气和，谁也不欠谁，谁也都需要谁。这就是各自相宜的状态。\n\
    \n重要的事情再说一次——\n\n职场清零、断舍离最重要的是不是丢东西，而是对于自己内在的修炼：\n\n+   1. 在清理中理解发现 blev 自己 的心智模式。\n\
    2. 在清理中体验自己的真实感受，理解自己真实的喜好。\n3. 清空，给可能性和人生超链接留出空间。\n\n白鸟集：“断舍离”与“欲望”是什么关系呢？毕竟欲望才是人奋斗的动力啊。是不是只保留当前那个最大的欲望，只关注这个欲望，摒弃其他多余的欲望，而努力前行吗？\n\
    \n古典\n\n让你奋斗的长久动力不应该是欲望，而是自我成就的需求。\n\n需求和欲望的确不容易分清楚，表面上看起来极其相似。最大的区别是：\n需求满足后是深深的平静，而欲望满足后是更大的欲望。一个是饿，一个是馋。\n\
    需求指向内在东西，相对稳定；欲望是外驱的，所以很容易被外界牵引。\n梁冬在他《处处见生机》里提到过蔡志忠老师，不管昨天晚上是喝酒、玩还是通宵，每天准时2点起来开始画画，从未停过。这就是强大的自我实现需求，但绝对不是欲望。\n\
    最后，其实人有点儿欲望没有什么不好，不被带跑就好。\n被带跑也没有什么不好，能回得来就是。\n\n很多人提到了《怦然心动的人生整理魔法》一书，作者在国内讲过课，下面是一个超体的笔记，分享给你们。\n\
    \n丹丹：近藤麻理惠提出的正确的整理方法有五个步骤：1. 想象理想的生活，必须要有明确的想到生活的样子，才可能有转变的方向；2. 选出怦然心动的东西，丢弃不要的东西；3.\
    \ 掌握物品的整体数量，不留多余的物品；4. 固定物品的位置，给每个物品一个“家”；5. 使用后物归原位，养成良好习惯。\n\n今天是古典陪伴你成长的第36天，一起加速，成长为更好的自己。\n\
