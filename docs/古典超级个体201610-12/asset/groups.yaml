    \n所以先说行动步骤。\n\n今天没有贴出具体某个人的问题，因为很多都类似，我整合了一个后台提问的FAQ：\n\n## 1.万一以后用得上呢？\n\n很多东西，以后的确用得上，但是当你用的时候，你需要付出3个成本：\n\
    \n- - 重新找到的成本；\n- - 一直保存的成本；\n\n未来还要用过去的东西，而没法用可能更好的东西，损失的机会成本。\n\n思考这些成本以后，重新看收益，你发现大部分东西都不值得保存到未来。\n\
    \n那么该怎么做？\n\n扩大心量。\n\n## 2.别人的礼物怎么办？\n\n留下心意，送走物品。\n\n## 3.过去的纪念品该怎么办？\n\n每一个纪念品都是过去经历的一个里程碑。\n\
    \n## 4.浪费吗？\n\n其实你算过自己的时间和注意力值多少钱吗？\n\n### —— 空的力量 ——\n\n所以为什么要清零？\n\n- 1. 你是由你过去的资源构成的，但是你并不等于你的资源，你需要新陈代谢。\n\
