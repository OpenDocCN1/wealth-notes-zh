    ## 3-1 什么才算是一个终极适合的职业？


    Hi, 欢迎来到超级个体，为个体崛起的时代做好准备。


    3-1 什么才算是一个终极...


    ### 职业发展模型


    ![](img/b7067422984faf05bb36fe56d6d8faf5_23_0.png)


    —— 一个观察 ——


    每个人或多或少都抱怨过自己的工作，甚至在抱怨到极致的时候，还会想说，我到底是不是适合这份工作？


    今天为大家讲一个关于职业发展的底层概念，叫做职业发展模型。这个模型由美国明尼苏达大学提出，叫“明尼苏达工作适应”。它从一个很清晰的角度，为我们解释清楚什么叫适合自己的工作，如何才能更适合。


    —— 一个模型 ——


    这个理论把职业分成了4个要素：


    - 1. 个人能力：能力、学历、资源……

    - 2. 个人需求：经济、成长、成就感……

    - 3. 职业要求：结果、绩效、指标……

    - 4. 职业回馈：钱、荣誉……


    这四个要素构成了上下两条平行线——如果一个人的能力跟他的职位总是很匹配的话，他的功效比较高、打分好、等级高……这就意味着组织对他很满意，简单来说就是比较“成功”。如果一个人总是很满意组织给予他的回馈，他有成长、收入高、氛围好……他就会比较“幸福”。


    从个人来说，适合你的工作是成功又幸福的。


    对于企业来说，一个适合的职业是这个员工能干好，也是他想干的。


    —— 一个策略 ——


    职业健康度的自我诊断：

    通过职业发展模型可以很好的给自己做一个健康度检测——


    - 1. 在现在的工作中，你最近切需要提升的是自己的成功度，还是幸福度？你是干不好，还是不想干？

    - 2. 如果答案是干不好，那么提升的地方在“企业需求”、“个人能力”的匹配度上——我是不是真的理解组织的需求了？我该如何提高自己的能力？

    - 3. 如果答案是不想干，提升点则在“个人需求”和“职业收益”的匹配度上；我是不是知道自己到底想要什么？职业有时能给你想要的，有时候也没法给你，因为大部分时候公司也不知道你想要什么。如果知道自己想要的，需要什么能力才能获得这个收益？


    职场模型虽然简单，但是它透露出来职业的一个底层逻辑——等价交换。职业是一种通过持续地满足对方需求来自我实现的过程，因为是一个持续的等价交换，所以交换双方最好的状态，就是匹配。


    —— 一个总结 ——


    - 1. 职业发展模型和职业发展4要素：个人能力，个人需求，职业要求和职业回馈。这四者共同构成了一个人的职业满意度，成功度和幸福度，那么你可以通过几个问题，确认自己在哪个部分可以有所提升。

    - 2. 我们提到职业的底层本质，是持续的交换、动态的匹配。


    —— 今日精进 ——


    - 1. 你的职业满意度如何？现在最需要提升的，是4个要素中的哪一个？

    - 2. 你最近一次抱怨是在什么时候？这反映了你什么方面的需求，和什么能力的缺失？


    今天是古典陪你成长的第18天，一起加速，成为更好的自己。


