    \n5-2 你和物品的关系\n\n## 超级个体\n\n你和物品的关系中 观察三种心智模式\n\n![](img/b7067422984faf05bb36fe56d6d8faf5_43_0.png)\n\
    \n一起加速的第33天\n\n如果说拖延症是你不愿面对任务而拖到最后一刻崩溃，那么杂乱的房间，不也是一种空间上的拖延症？——你不愿面对现实，最后杂物把你一点点挤死了。\n\
    \n### ——一个观察——\n\n昨天我们提出“职场清零”的概念。其中有一条是建议大家把看过的书丢掉，很多人表示不理解。所以，今天我们就着这个话题再多讲一次。\n\
    \n不知你意识到没有：我们和物品的关系，往往是我们心智模式的外在投射。\n\n你总是等到要来客人，才会使用高级餐具？这也许是因为在你的潜意识里，你觉得自己配不上它的“高级”。你总是习惯买好多卫生纸囤在家里？也许根本是因为你对未来充满了不安。\n\
    \n> 你发现没有，我们买什么，用什么，丢弃什么，其实都取决于你对待自己和资源的 心智模式。这些买回来的物品，本质上就是你时间空间的容器。 1人笔记\n\n\
    在你占有物品的同时，物品也在占有你。\n\n今天我们要讲一个通过整理东西来观察自己心智模式的技术，这个技术把收拾东西提高到“动禅”的高度。这个话题叫做“断舍离”。\n\
    \n### ——一个概念——\n\n相信很多人都听过“断舍离”。它是由日本“众物管理咨询师”山下英子提出的“概念”。其同名著作长期占据日本、台湾各大畅销书榜单第一名，累计销量突破80万册。《断舍离》引入到中国之后，也引发了广泛传播，并成为“2014年度十大流行语”之一。\n\
    \n“断舍离”是通过收拾物品来了解自己，整理自己内心的混乱，让人生更舒适的行为技术。简单来说：\n\n- 断：就是断绝不需要的东西——少买（断）；\n- 舍：舍弃多余的废物——多扔（舍）；\n\
    - 离：脱离对物品的迷恋——不执迷于物欲（离）。\n\n其中，“断”是入口，“舍”是出口，“离”是最终到达的各得其所的理想状态。\n\n通常人们会把“断舍离”理解为一套关于家庭物品的整理术。但是，我们要提高一个维度——它是一种日常的修练：如何通过收拾东西，观察和修炼自己清零的心智模式。\n\
    \n断舍离和普通的打扫、收拾不同，它的主角不是物品，而是你自己。\n\n你要从当下是否有用的角度，决定一个物品的去留。一个人身所使用的物品，能够反映出自我形象。通过不断地筛选物品的训练，当下的自我形象就会越来越鲜明地呈现自己的眼前。\n\
    \n- 通过整理改变自己的过程有3步：\n  1. 不断审视自己与物品的关系：发现身边所有“不需要、不适合、不舒服”的东西。\n  2. 通过审视，你关注的重心从物品转换为自我。你在对物品的整理中，重新认识、发现和肯定自我。\n\
    \  3. 把物品替换为你自己“需要、适合、舒服”的东西。把真实的自我固化到生活里面去，你的精神面貌也会有所改变。\n\n通过向外整理，引发内在改变。\n\n\
    ### ——一个策略——\n\n我们今天试着用东西来理清一下自己：人们舍不得扔东西的原因大慨可以分为三类：执着过去，逃避现实，担忧未来。\n\n- 1. 执着过去的人\n\
    \  典型的“所有权依恋症”患者。小学课本、10年前的车票、第一次拔的智齿，在他们眼里都充满了回忆，小心翼翼地保留着。\n- 2. 逃避现实的人\n- 3.\
    \ 担忧未来的人\n\n> 如果说拖延症是你不愿意面对任务而拖到最后一刻崩溃，那么杂乱的房间，不是一种空间上的拖延症？——你不愿意面对现实，最后杂物把你一点点挤死了。\n\
