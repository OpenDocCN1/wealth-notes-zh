    ## 也许，世界上就没有“简单”这回事 9-5


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    > 庄俊桦：我不明白，既然有这么好用简单的 方法——“三件事”，为什么不一开始说出来，而是先讲其他的方法？


    不知道你有没有听说过吃包子的笑话？某人去吃包子，吃到第8个的时候饱了，这时他不禁懊恼：早知道直接吃第8个就好了，干吗还要前边吃7个呢？很显然，这位仁兄没有看到积累的必要性。


    其实，《超级个体》专栏的内容是有其内在联系的。真的想做好“每天三件事”，除了要有本周讲到的具体方法和结果思维之外，你可能还要用到前面讲过的诸多自我管理的工具。


    ## 1.写“三件事”之前，先“清零”


    有人很忙，每天要做的事远远超过三件。还有人特别有追求，不断自我加码，要求自己完成的事不止三件。


    比如，要读书、要背英语；马上年末了，要做年终总结，还想写新年计划；另外，又打算准备圣诞礼物……


    结果，你发现自己一天也就24小时，想做的事太多，结果反倒可能一件也没有做好。这时候，你就需要先“清零”：站到原点，重新理一理你和这些事的关系；在“想做、该做、必须做的事情”中间，找出最重要的“三件”。（见文章5-1）


    ## 2.做“三件事”时，用WOOP和“加减乘除”


    我们说“三件事”的本质是三个目标、三个结果。所以，在具体操作的时候，可以用前边讲到的WOOP去执行。（见文章6-3和6-5）


    首先通过预测目标与实际障碍之间的“心理对比”（见文章6-2），确认这件事是不是可以做。确定之后，再通过“执行意图”（If……Then……）（见文章6-3）制定计划，把每件事做下去。


    比如，你的执行意图可以是：如果（If）到了下午3点，那么（Then）就马上开始做某件事。如果（If）完不成今天的目标，那么（Then）我就给大家发50块钱红包。


    另外，在做“三件事”的时候，你还可以利用时间管理提到的“加减乘除”的技巧。（见文章7-2）


    > Yujie：“三件事”里总有那么一两件，一拖再拖，一直完不成，怎么办？


    如果一个目标连续三天都留在你的“三件事”里面却毫无进展，那么这三件事已经“渗透”了，也就是没完没了地拖延。你就应该停下来，专门研究一下它为什么会渗透。


    一般来说，目标渗透的“罪魁祸首”有三个：不想，不能，不应该。


    - “不想”，是心里没有真正重视；

    “不能”，是你重视了，但能力和资源不够；

    “不应该”，问题不在你，环境不允许你做。


    ## 1.破“不想”


    - 1）静下来想想，不做这件事情会有什么坏处？你是不是可以承受？

    2）告诉自己不需要那么完美，先开始。完成比完美更重要。

    3）还有两种情况：①这事不重要。那么果断删除，短期不去想，等它冒出来的时候再说。②这事真的很重要。那么用“吞青蛙法”。一般来说，早 上精力最充沛，可以安排2个小时做最难的那件事。解决之后，接下来一整天都会很轻松。


    ## 2.破“不能”


    - 1）细分目标，降低难度

    2）找到一个启动点

    3）使用番茄钟


    ## 3.“不允许”的可能性：


    - 1）空间不允许。如果是因为环境太吵，没法做事，那就换个环境。

    2）时间不允许。这属于内因，可以从前面两点去找到具体的原因。

    3）人不允许。如果不断被人打断，那么就直接和他沟通，说清你的诉求。


    问问自己到底是怎么在妨碍，然后根据原因找到解决办法。总的来说，目标渗透并不是一个坏事，它能帮你看清想象中的自己和真实自己的差距。找到差距，合理归因，所有的问题都可以一一解决。


    你发现没有，三件事虽然号称“世界上最简单的自我管理工具”，可是在具体操作层面，却可以融入使用这么多之前讲过 的东西。


    所以——也许世界上根本就没有“简单”这回事。以结果和交付的标准来衡量，每天做好“三件事”，已经足够多了……


