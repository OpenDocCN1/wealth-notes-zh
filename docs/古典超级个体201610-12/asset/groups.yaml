    ## 如何说服一个人？自问自答的汇报技术 10-2


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    10-2 如何说服一个人？自…


    ## ——一个观察——


    场景1：公司年终述职报告，你做了30页PPT，一共讲了30分钟，结果台下的人睡了25分钟，还有2个坚决玩手机才挺了下来。


    场景2：我们去看电影，两小时后电影演完，我们从电影院出来后觉得好像刚刚几分钟。


    为什么30分钟的年终总结让大家睡着了，而两小时的电影那么吸引人呢？


    除了明星和视觉效果，真正抓人的是故事和悬念，所有电影在开篇的时候都会给出一个悬念！


    ## ——一个概念——


    有一种方法让我们可以像电影一样，很好地吸引对方并说服对方。这种方法在结构思考力中叫做自上而下疑问回答式搭建金字塔结构。


    ### 第一步：把一个结论作为主题


    主题一定是基于谈话目标的，而且必须是 一个有观点的结论。


    ### 第二步：设想问题，从对方角度出发提问


    - 1. 站在对方角度，换位思考


    人是认知苔藓鬼——我们大脑天然会在新的信息面前不断地提问和怀疑——“为什么会这样？”、“怎样才能这样？”、“为什么你这样说？”。


    - 2. 通过 5W2H 确保问题被全面覆盖


    ### 第三步：提前准备好答案


    ## ——一个总结——


    结构化说服法——自上而下的自问自答。


    其中，这个方法有三个核心的步骤——确定主题、设计问题、找好答案。


    ## ——今日精进——


    今天的精进是练习——在留言区留下你的说服目标和大纲，然后尝试去说服一个人吧！比如说服老板加薪，就是一个不错的尝试，不过记得做好准备。


