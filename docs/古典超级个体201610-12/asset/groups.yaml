    # 超越碎片化时代 7-3


    Hi, 欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    # —— 一个观察 ——


    如果你住在大城市，估计你常常遇到这种情况——马路上挤满了车，都在向前挣，每个人都在焦虑地按着喇叭，看着有点空隙就赶紧变道，变过来变过去，也没有前半身位。这只不过是在缓解自己的焦虑了。


    碎片化的时间就像是一条三车道的马路，路上走的各种车就是要做的事情。好车就是特别重要特别赚钱的事，比如几百万的合作生意；破车就是碎碎的事情，比如打印资料、回电话。不管好车烂车，在碎片化的马路上，谁也快不到哪去。


    那请问你怎么才能畅通无阻地通过这条马路呢？


    # —— 三个策略 ——


    # 1.抵御干扰


    让我们时间变碎片的是各种干扰，那要整合时间就得学会应对干扰，干扰一共分两种：内部干扰和外部干扰。


    +   - 电子静默：主动关掉大部分的手机和桌面推送；

    - 物理隔离：尽可能让自己待在一个不被干扰的空间、时间；

    - 调整期许：不要对方一说话就马上回复或回微信，但是每次回都留出足够时间处理，重要的事情直接电话，培养大家对你的好期待；

    - 学习拒绝：学习沟通技巧，懂得拒绝、协商、中断和管理各种关系。


    # 2.投资时间，获得自由


    ![](img/b7067422984faf05bb36fe56d6d8faf5_63_0.png)


    # 3.为自己设定一个主题


    ![](img/b7067422984faf05bb36fe56d6d8faf5_63_1.png)


    > 乔布斯说，"连点成线"，当你找到一个'
  - '[PAGE 64]


    乔布斯说，“连点成线”，当你找到一个人生主题，一切碎片化的信息就突然变得有意义了。


    如果你身边有太多太多碎片，也许是因为你缺乏一个人生主题。现在开始把看似不相关的东西拼在一起，创造一个你喜欢的人生。


    # —— ◆ 一个总结 ◆ ——


    碎片化时代无可避免，但我们至少还有3个策略。


    第一个策略是拆除干扰。分为内部和外部干扰，内部干扰给大家介绍了念头收纳和3秒禅；外部干扰介绍了电子静默、物理隔离、管理期待和善于拒绝。


    第二个策略是通过持续投资优势和趋势，让自己进入自由职业态，创建系统甚至投资。


    第三个策略是创建一个人生主题，连点成线，吸附碎片化。


    后面这两个话题是我们《超级个体》的讨论重点，会慢慢带大家走，不要着急，慢慢来比较快。


