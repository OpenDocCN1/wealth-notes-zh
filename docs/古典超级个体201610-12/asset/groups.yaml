    # 4-3 乐高式能力结构


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    4-3 乐高式能力结构


    # 超级个体


    # 乐高式能力结构


    ![](img/b7067422984faf05bb36fe56d6d8faf5_36_0.png)


    PS：如果看不懂… 想想小时候你玩乐高的方式…


    - 起刷加速的第27天 未来不确定的职场，最好的能力模型是乐高式能力结构。我们要有一种不变应万变的方式——你的形态是流动的，你的样子永远是最新版的。


    # —— 一个观察 ——


    前面两天我们提到了一个说法，叫做技能可迁移，而不仅仅是学习。我想这很大程度上改变了我们对于能力的看法，大家觉得发现了一个新大陆——那么技能迁移有没有坏处呢？


    绝对有啊！


    你一定听过这个故事：有個小和尚为了学剃头，先拿个冬瓜来练——冬瓜上面有一层绒毛，正好练手。每次 일시小小心翼翼剃完头以后，小和尚都会高兴地长呼一口气，然后把这个刀插在了那个冬瓜上。结果你应该能想到，他学成以后真的去给别人剃头，头剃得不错，最后还是忍不住一刀飞了下去。


    # —— 一个概念 ——


    这其实就是一个负面的技能迁移，其实技能迁移不仅有好处也有坏处啊。在心理学中，它分为两种，一种叫正迁移，一种叫负迁移。


    这个现象最早是被运动专家发现的——羽毛球和网球选手，听上去应该很容易切换吧。其实不是，羽毛球选手转网球，很多时候比初学者更加难。为什么呢？


    其实差异巨大，羽毛球是用手腕发力的，而网球呢？是整个手臂发力，手腕是绷直的。仅仅这一点就让羽毛球和网球互相干扰得非常严重，一个人很难同时学这两种球。


    正向迁移的例子也有。


    再比如说，蝶泳就是蛙泳派生出来的——都是腰部发力，四侧对称。最明显的区别就是蛙泳是用蹬的，而蝶泳是用波浪式的打水。蛙泳水下换手，蝶泳空中移臂。如果能把蛙泳学好，蝶泳比较容易学。


    什么时候会正向迁移，什么时候不会？如果两个技能输入一致，输出一致，就很容易正迁移。如果两个技能输入一致，但是输出不同甚至相反，就会形成负迁移。


    比如说孩子小的时候，很多家长会让他们同时学习汉语拼音和英语，这就是一个巨大的负迁移情境。学英语的那个人很难把汉语拼音学好，因为两个发音是不一样的。


    工作里面也会有这样的例子。比如老师、主持人要当领导的话，讲授技能就会负迁移——他的瞬间反应非常快，下面人一提意见，他可能马上就进行了说服性教育——下面人听了几次就想算了，你比我能说，又是领导，我干啥呢？不说话了。没法倾听的领导不可能好领导啊。


    在生活中间，我们也能看到很多正负迁移的例子。


    姜文的电影《一步之遥》里面有一个场景：他跑到一个大帅家里去献葛优，大帅府正在吃饭，大帅直接把军威迁移到了家里，一片肃杀，吃个饭搞得像开军事会议一样。


    很多领导也是同样的迁移，对老婆孩子都是命令。小孩子根本不吃你这一套，躺地上就哭。领导发现，单位里面那套威逼利诱、胡萝卜大棒在家里都不好使了。这就是典型的负迁移。


    顺便说一句，最后姜文带大帅全家一起做完体操，大帅被逗乐了，哈哈大笑——这也是一个正迁移——巧妙地把大帅的玩耍技能激活，救了自己一命。


    # —— 一个策略 ——


    如何让自己顺利地正迁移和负迁移？


    首先，只有一個扎實的技能才有可能迁移。所以不管正迁移还是负迁移，你都得先把架子搭稳了才能往外搬，否则一搬就散了。简单来说，要做好手头事，好好练功。


    其次，接触陌生目标的时候，先不着急动手，而是清晰思考下这件事情的目标和结果——然后反推一下——这件事情需要用到什么能力？哪些能力可以迁移，而哪些能力是会负迁移的，需要调整？


    最后，尽量避免同时学习太多技能——咳咳——包括我们这个专栏。如果你实在是学习控——尽量避免同时练习太多相近的技能，否则你可能容易互相产生负迁移，什么都没学会。


    我想，未来不确定的职场，最好的能力模型是乐高式能力结构。


    乐高为什么伟大，能够有这么长久不衰的竞争力？因为如果一个能力是固定的，再好玩的玩具，玩一段時間就倦怠了。但是乐高是组合的，你玩厌了，我们可以通过新的方式重新组合起来。不同场合、不同年龄、不同想象力，都能拼出来千百种样子。


    乐高说，上帝创造整个世界只用了170余种元素，而乐高有接近7000种常用模块，这是其它玩具所完成不了的事情。


    今天的职场千变万化，但是我们也有一种以不变应万变的方式，就是技能迁移和重新组合。组合技能的能力，是更加重要的一种能力。


    超级个体是这样一个人。在不同任务里面能拼装成不同的能力；在不同角色中间，也能组合出不同的能力。家里一套、工作一套、现在一套、未来一套，然后隔段时间还增加一点新模块——你的形态是流动的，你的样子永远是最新版的。


    # —— 一个总结 ——


    +   1. 如果两个技能输入一致，输出一致，叫正迁移；如果输入一致，但是输出不同甚至相反，叫负迁移。


    +   2. 能力的三个策略：（1）能力练好了才能迁移；（2）一定要找到新旧能力之间的关系和类比，要清楚哪些能力要迁移，哪些能力不要迁移；（3）尽量避免同时学习太多技能，这会造成技能之间的互相干扰。


    # —— 今日精进 ——


    +   1. 你经历过哪些正迁移或者负迁移的事？

    2. 如果你是一盒乐高积木，你会修练哪三种能力作为你的核心模块？对照下面这个可迁移技能表，试试看拼一个最喜欢的自己。


    今天是古典陪伴你成长的第27天，一起加速，成长为更好的自己。


