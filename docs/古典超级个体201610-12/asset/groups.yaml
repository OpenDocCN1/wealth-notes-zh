    # 未来哪些能力会越来越增值？


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    1-2 未来哪些能力会越来...


    # 职业新生布下

    什么是真正重要的能力


    ![](img/b7067422984faf05bb36fe56d6d8faf5_6_0.png)


    ## —— 一个问题 ——


    在这样一个新的职业世界里面，什么是真正重要的能力呢？


    1997年，国际象棋大师卡斯帕罗夫跟深蓝电脑下了一把，电脑两胜一负三获胜。当时人类世界一片哗然。


    在19年以后的今天，Google的阿尔法狗跟围棋大师李世石下棋，也把人赢了。但这次我们的媒体变得比较轻松，而且还搞得有点乐观的。


    为什么相隔19年，人类社会对于这个事情的态度会有这么大变化呢？


    我们这一代人已经逐渐接受一个事实，就是机器真的已经在很多领域比人强了。


    富士康，在2011年开始“百万机器人计划”，今天70%的工作由机器替代，直接导致数十万人下岗。


    在加州，无人驾驶汽车已经跑了17个月。


    百度在今年9月1号刚刚拿到加州第15张无人驾驶的牌照。


    到今天，你发现司机的王作已经部分被机器所替代了。以前一个出租车司机，他需要有车、会开车、会认路、会收钱，但到今天你发现一个人只要会开车，认路的事情被机器导航所替代，算账的事情被平台做完。


    钛边缘大会中看到的一个机器人，已经可以根据人的表情做出回应。


    心理学领域，一些基础的认知行为疗法已经可以用机器人方式来完成。


    ## —— 一个观点 ——


    机器变得这么厉害，那人该怎么办呢？


    丹尼尔·平克在《全新思维》这本书里，提到一个观点：世界已经从过去的高理性时代，进入一个高感性和高概念的时代，有6种能力是非常稀缺且重要的。分别是：


    设计感、共情能力、讲故事、整合、娱乐感、意义感


    ## 第一、设计感


    设计是“设置一种计谋，让事情得以推进”。也就是说，优秀的设计总是创造出一种新的解决方案，让事情得以顺利进行。


    比如说苹果被认为是全球最有设计感的公司，不是因为它的字体好看颜色好看，而是因为它创造出了一种手指就可以代替键盘的互动方式，解决了一个人机互动的全新问题。60岁老人和两岁宝宝都可以很顺利学会，这种叫做设计感。


    ## 第二、共情能力


    简单来说，就是站在别人角度思考，甚至思考得比别人更深入的能力。


    比如你在网上看到的一些文章，觉得讲出来一些你特别想讲但是讲不出来的东西，那个作者其实就很有共情能力。


    所有伟大的产品经理都有共情能力。比如说微信的张小龙，微信总是做一些我们特别想用、但是没有想到的功能，就是因为一个好的产品经理能够挖掘出你都没有意识到的需求。


    ## 第三、讲故事的能力


    所有著名的畅销书作家、好的导演……都是讲故事的高手；


    商业领袖也要会讲故事，你看乔布斯、雷布斯、马云……就把一个商业讲成了谁都能懂的故事；


    政治领袖对于讲故事更加看重。美国总统选举的时候，身边的班子中一定有3个人，一个是首席经济学家，他负责让总统把经济问题说清楚，说明白，符合逻辑；一个是形象设计师，他负责让总统有一个大家可以理解的符号形象出现；第三个就是撰稿人，他的任务就是给民众不断讲一个又一个故事。而丹尼尔·平克本人就是美国前副总统戈尔的御用撰稿人。


    ## 第四、整合的能力


    行业不断跨界，领域不断变化，最强不是总在从头学习，而是持续整合的人。


    培训界有这一句话：给小白要讲大牛，给大牛要讲跨界。比如混沌学习社的李善友老师，他是从物理学去讲商业；我特别尊敬的吴伯凡老师，他是从生态学的角度去讲商业、讲管理。


    产生一个跨界才会产生心距离，会更好理解现状。彼得·德鲁克每隔3年换一个领域研究；查理·芒格有100个不同领域的模型。


    ## 第五、娱乐感


    简单来说就是一个“让你觉得好玩的能力”。


    玩乐是人类的天性：


    俄罗斯方块其实是一个没有任何目的，既不救公主也不找宝藏的游戏，它唯一的目的就是看你怎么死。但即使这样，人也愿意一直玩下去，因为你享受这个玩的过程。


    今天如果你是做产品的，你的产品会跟人玩，那么你的产品就会有魅力；


    你是一个做创作的，你会跟自己玩，你就会有创意。


    最后一个能力是意义感


    意义感是一个人自我领导和领导他人的能力。


    未来世界变化太多，我们基本上不可能在开始做时就明确知道结果。但是如果你不全力的做，就一点胜出的机会都没有。——这个时刻该怎么办呢？


    领导者会对这个事情本身赋予一个意义。


    当做这个事情的过程都已经值回票价，你可能就不会太过关注结果，但这种状态是最有机会胜出的，所以如果有什么东西能抵御不确定性的话，那么就是确定的意义感。


    微软百科和维基百科的案例：


    微软百科投入了将近一个亿的预算、三千多个专业人士、花了八年时间去编撰，但最后面还是不得不宣布失败；而维基百科只用到了微软不到百分之一的资源，却在这十五年时间发展出来将近1300万条目和250种语言。它靠的是什么？靠的就是“全球所有人共享所有信息”的意义感。


    在一个变化的时代，意义感对我们的驱动更加深远。


    设计感和讲故事——产生影响力；


    共情能力、整合能力和好玩——提高竞争力；


    意义感——自我驱动和领导他人；


    所以当有人将这6种东西整合到一起——通俗说，就是一个人会讲故事、能跨界、理解人心、有品位、既好玩，又活得有点追求——他将是一个极其强大的人。


    未来，高感性能力汇聚的职业会更增值。

