    我在文章9-1里说，“每天三件事”可能是世界上最简单的自我管理工具。但是，文章发出后，收到特别多关于“三件事”的提问，一方面说明大家的认真；另一方面也说明如果真有追求，世界上也根本就没有“简单”这回事。


    ## 过程还是结果——这是一个问题


    陈宏霖：我们经常听到一句话：“成功不是结果，而是一个过程。”与古典老师所说的结果思维是否矛盾？


    结果并不是和过程对立起来的，没有过程不存在结果。但是没有预先设定的结果——你都不知道“过”了没“过”，哪里有过程？


    一个人的成功不一定是他最后“赚到多少钱”的结果，但一定有“为他人创造了价值”的结果，也一定有“提升了自己能力”的结果。我们是通过结果与外界交换的，不是通过态度、感受和心情。


    过程和结果是一体两面，但是结果思维强调的是结果这一面，因为很少有人思考这一面。


    在我看来，3种场景更加需要谈过程。


    - 1. 心理活动，而非社会活动


    比如说恋爱、思考、体验、旅游、发呆，也许真的不需要什么结果……幸福本身就是一种过程性的情绪。但是所有职业、社交、沟通都需要结果。很多爱情也就是停止在过程美好但是持续产生成不了结果上。


    - 2. 成功以后


    成功以后，结果已经拿到，更加需要重视的是过程。“曾经沧海难为水，除却巫山不是云”的宏大的惆怅和失落，和“只去过香山后海，其他哪里都没去过”的失落，不是同一个层次的。


    - 3. 终极思考


    当我们把时间的尺度放在长长的一生中时，可以说“重要的是过程，而不是结果”，因为人生的结果每个人都一样，就是死亡。


    其实也不然：


    首先，很多人们都有孩子，孩子们有自己的习惯、心智，这都是你留下的结果，你死了依然延续。


