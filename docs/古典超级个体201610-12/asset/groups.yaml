    # ——一个观察——


    前两天我们谈到了梦想的局限性，讲到如何通过心理比对制定一个靠谱的计划，今天我们进一步落地——讲述见招拆招的智慧。


    你有没有遇到这种情况？


    在家里想得好好的工作计划，一旦遇到具体的打断，情绪上来，完全麻了。


    想好了要和领导汇报每一个字该怎么说，一旦见到真人，开始紧张，似乎崩溃。


    一个在饱着肚子制定出来的节食计划，在饭桌前完全失效了。


    今天我给大家介绍的这个工具叫做“执行意图”，解决的就是这些问题。


    # ——一个概念——


    执行意图是由彼得·M·戈尔维策（Peter.M.Gollwitzer）提出来的。这个人是谁？就是前面说过的厄廷根背后的男人——她的丈夫。


    执行意图就是你针对某个愿望的明确意图——简单说，就是你“具体要怎么做”。


    +   if……（某个情景、状态）……then（某个反应）

    如果……（某个情景、状态）……那么（某个反应）


    # ——一个策略——


    你也可以试着看，把这三天学到的东西串联起来，就是WOOP思维，即“心理比对”。


    W（愿望，Wish）→O（结果，Outcome）→O（障碍，Obstacle）→P（计划，Plan）。


    ```

    Wish 愿望：傍晚跑步

    Outcome 结果：身体健康

    Obstacle 障碍：下班累得不想跑

    Plan 计划：先跑到楼下住机动防疲劳

    if...then...

    如果我到六点半下班，那我先跑到自己门口，先跑起来出门单步慢更佳有力气骑跑。

    如果我到了家楼下，那我继续跑跑...我...等等

    ```


    > “按照最好的预期，做最坏的准备。”


    # ——一个总结——


    传统的目标设定方法在变化时代不够好用，需要设定“执行意图”——“if……then……”。心理比对加上执行意图，心理学两口子教给我们一个不确定时代的计划'
