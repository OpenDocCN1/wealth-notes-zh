    # 累如何避险的经验：


    在资本安全上；


    在人身安全上。


    可人们为什么普遍倾向于在资本上无视风险的存在呢？总体上来看，就是因为人类普遍没有资产管理的经验，关于资本风险的恐惧，尚未有机会形成“基因记忆”。若是一个小朋友看到桌子上搁着一把枪，他会很好奇地拿起来玩，一点都不会害怕，当然也完全不知道那是可能会致命的东西……可若是在他背后出现一条蛇，哪怕那孩子还没看到那东西究竟是什么，就早已吓得瑟瑟发抖、嗷嗷大哭。为什么会这样？因为我们每个人都有“基因记忆”，有很多恐惧，早已植入基因，无需讲解、无需教授，天然就懂、天然就会、天然就感受得到。


    现在我们再来看看，人类对财富、资本的认识，实在是不多、不久、不够，实在是太少、太短、太不够了！想想看吧，以下都是毫无疑问的事实：


    +   1. 人类对财富的认知其实没多久。你看，人类开始使用货币至今不过几千年而已，在人类的历史长河中，是相当短的一段时间；

    2. 长期以来，人类之中拥有足够财富的人群比例一直是非常非常低的，那比例其实低到甚至可以忽略不计的地步；

    3. 整个人类，除了一个民族（犹太人）之外，迄今为止都会多多少少妖魔化“复利”这个概念——这可是财富领域里最重要的概念（后面根本没有必要跟着一个限定词“之一”）；

    4. 人类社会从未停止过动荡，古今中外都一样，每一次大的动荡本质上都是对财富拥有者的杀戮，于是，关于财富的基因事实上很难持续传承；

    5. 人类真正认识到市场的好处（从真正的知识研究角度，而不是“凭直觉”），不过两三百年而已（中国更惨，上个世纪八十年代才重新开启这方面的认知）；

    6. 人类真正研究经济的运作规律，从亚当·斯密开始计算，迄今也300年不到；

