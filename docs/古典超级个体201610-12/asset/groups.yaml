    # 成长导师｜时间管理，为什么你知道却总做不到？


    Hi，欢迎来到超级个体，在不确定的时代，确定地生活，为个体崛起的时代做好准备。


    古典


    超体说：）


    这周我请到了资深时间管理实践者邹鑫（小强）做我们的成长导师。他是这周主题的联合策劃人，时间管理类畅销书《小强升职记》的作者，也是我的朋友。


    这几天，大家提的大多是与时间管理实践有关的问题。我从中挑了一个有共性的，来请小强老师回答。


    小强老师，您所擅长的是时间管理，我们大多数人也都知道时间管理的重要性，但是真正能够做到的人其实并不多，您觉得根本原因是什么？


    我觉得一共有四个原因：


    ## 1.不够痛苦也没有热情


    我跟朋友一起去吃饭，正在点菜的时候，朋友突然说：我也想学学做饭。当时我第一反应是：肯定没戏。三天后，我问她：“开始学做饭了吗？”她回答：“还没有呢，又要上班、又要照顾家，晚上回来了都7点''ın了，哪有时间啊！"


    “被我猜中！”我心里这么想。你们知道我为什么这么肯定吗？因为做饭这件事对她来说，既不会因为没有自己做饭而感到痛苦，也没有要自己做饭的热情，没有动力的話，再想做的事情也坚持不下来。


    那怎么样的人能真的坚持学做饭呢？


    可能是老在外面吃饭吃出肠胃炎的人，这些人会感觉到外面吃饭不干净所带来的痛苦，所以产生了自己做饭的动力；或者那些特别享受做饭时那种创造感觉的人，她们会对做饭本身充满了热情，也会产生源源不断的动力。


    所以我觉得做好时间管理有个公式：


    好的时间管理=自律×（痛苦+热情）


    ## 2.用不适合自己的方法


    有次我和两个朋友一起喝茶，一位是保险销售，另一位是IT攻城狮，我突发奇想请他们做一个测试：


    首先，我在纸上随意地写着：身体、耳朵、鼻子、左胳膊、右胳膊、眼睛……


    然后，请他们把这些元素用自己的方式组织到一起。


    立刻发现俩人的方法是截然不同，如图所示：


    ![](img/b7067422984faf05bb36fe56d6d8faf5_68_0.png)


    攻城狮用的是树状列表把元素组织在一起，而销售员是用思维导图的方式呈现。


    组织元素方法不同的背后是思维模式的不同，思维模式不同的背后是性格不同。


    按照戴尔嘉的色彩性格分析，攻城狮是蓝色性格，喜欢秩序和条理，天生就接纳列表方式，大家可以注意到大多数的Todo工具都是列表方式，我猜设计这些工具的人大多是攻城狮出身。可是有谁规定了TODOLIST必须要是列表方式呢？


    销售员是红色性格，有热情、喜欢发散，所以一下笔就是思维导图。当我问她为什么不用列表方式的时候，她回答：用那种方式我完全写不出来，就像规定我必须用鸟语说齿一样。所以，大家可以想象一下，一个红色性格的人，看了时间管理的书，试图用各种清单、列表去组织自己的生活，失败的几率有多大？


    ## 3.输入太多


    我们只戴一个表的时候，是很容易知道现在的时间，但是如果我们戴三个表，而且显示时间都不一样，那就开始纠结了——现在到底几点了？


    我们读太多书、看太多资料，也是一样道理——读得越多，行动却有可能减少。这其实是“知道但做不到”的原因之一。


    拿学习时间管理举例，我建议大家看三本书：第一本是《高效能人士七个习惯》，第二本是David Allen的《搞定》，第三本是《小强升职记》，为什么是这三本呢？


    第一本讲时间管理的理念，第二本讲时间管理的方法，第三本讲时间管理的实践，看完后我们就可以开始实践了，然后实践的过程中发现自己需要别的，这时我们再去看不迟。


    ## 4.负面反馈


    ![](img/b7067422984faf05bb36fe56d6d8faf5_68_1.png)


    假设你现在非常渴，独自一人在找东西喝，忽然看到桌子上放了半杯水，你会怎么想、怎么做呢？


    - A 真是太好了，在我口渴的时候，这里还会有半杯水，正好解渴。

    - B 谁放在这儿的？我得问问。

    - C 真倒霉！本来就够渴的了，好容易看到点儿水，还只剩一半了。

    - D 喝完了以后我没准儿会更渴，干脆别喝了。


    选择A的人：对待生活是充满阳光的，总能从好的一面来思考问题。


    选择B的人：对生活有很客观的评价，做事很讲原则。


    选择C的人：习惯用一种悲观的视角去看待挫折。


    选择D的人：容易把注意力放在事情的结果上，而忽略过程。


    每件事情都有好坏两个方面，关键看一个人怎样看待它，我们把知道的事情付诸实践的时候，如果我们总给自己一些负面反馈，比如：


    - 我老是做不好。

    - 我就是有拖延症。

    - 我早说过做不到咯。


    这样的人也可以知道很多，但能做到的很少。


    总之，知道但是做不到是很正常的，知道的都能做到，那才不正常。承认这一点以后，我们再明确自己想做到什么样的事情，然后看看掉入了上面哪个坑里，最后找到方法爬出来。


    想想看，你有没有掉进哪个坑里，准备怎么爬出来？


    周末愉快：）


