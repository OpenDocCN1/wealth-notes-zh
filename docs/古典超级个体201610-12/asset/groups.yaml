    # 4-5 问答｜听说你订了很多专栏看不过来？来看看这条鄙视链


    Hi，欢迎来到超级个体，为个体崛起的时代做好准备。


    # 漂亮的问题


    Rachel：老师说的同时订阅十几个专栏的就不就是我嘛，虽然看不完，但是реса 我没时间再刷朋友圈了。


    葛洪雷：感觉自己虽然很忙，进步不易察觉；但是一直在学习、在思考的感觉很好。您觉得我应该保持这种状态吗？还是应该有所取舍，先暂时搁置一些专栏？


    古典说：


    这个问题要谨慎回答——要不然罗胖能杀了我。


    先贴答案，从生源设计的角度：


    T型组合 > 精专练习一门 > 看精选信息 > 看书 > 刷朋友圈


    你也可以理解为一条“自我成长修炼者的鄙视链”：


    全才鄙视专才，专才鄙视只看不练的，只看不练鄙视七八糟看的，看书的鄙视刷朋友圈的，刷朋友圈的鄙视看直播的？不懂了。


    简单来说，要获取知识和有用的信息，跟众多的公众号相比，订阅专栏已经是我现在能找到的最好方式了，但是这种方式依然有升级的空间——我的建议是给你的知识做一个分类：


    +   1. 提高人生眼界格局的，阶段性找1-2个人就足够了。


    +   2. 开脑洞刷新认知的，持续更新观点，学习新知识。


    +   3. 用来解决身边问题，提高具体能力的，这个看完一定要练习，否则越来越多害人。


    总体时间建议2：3：5，但是我估计大部分人都是5：3：2，因为眼界格局和开脑洞比较爽，而且容易形成社交货币。


    所以，阶段性重点关注就好。以终为始的学习，不要焦虑型学习。


    Lo-俊彦：如果一定要同时学习多个技能呢？是不是一定会不可避免地产生相互干扰？


    古典说：


    如果一定要同时学习很多技能，最好的方式是以场景为目标反过来组合能力。


    举例：


    你需要一年以后在一个国际会议上演讲。这是一个具体应用场景。


    你需要提高的能力可能有：英语口语、演讲能力、研究能力、PPT能力。其中PPT能力可以分包，另外三项需要自己练习。


    顺序应该是：研究能力一条线，英语口语和演讲能力一条线。


    其中研究能力和演讲能力其实会有 Ace 一定的冲突，一个内敛，一个外放；一个保守安静，一个激进张扬，错开可能会更好。演讲能力提高快，而口语相对慢；可以先练演讲，慢慢提高口语。


    看，针对一个场景，很快就知道了所有技能的先后顺序以及冲突。


    但是如果你同时刷四个技能，就废了。


    # 独立的思考


    去留无迹：能力的负迁移，是否可以理解为“失败的条件反射”？当环境改变、对象改变、情景改变……就需要用天人合一的思想重新建立一种“条件反射”来 꼰进行适应？


    古刹青者：怎么能正向迁移你的能力，跟一个人的认知有很大关系。我个人感觉当你认知提高 了，你的乐高模式才能开启。


    古典说：


    乐高式组合，针对的就是当代商业世界的不确定性和生活角色的多样性。


    以前的职业环境像是森林，你只需要带一把刀就好。但今天的职业环境变化多样，你必须带上瑞士军刀，根据不同情景组合你的能力。


    仔细观察，商业界也有“乐高式生存”的存在。比如乐视就是一个典型的乐高式组合企业，很难说清楚它是什么的，但是每一个领域它都有自己的拼图。苹果也是这样的公司——音乐、APP、硬件、软件、周边……每一个领域的产品都是拼图。


    # 美好的故事


    这是一个典型的“乐高式组合”案例：朱燕飞原来是一名播音员，具有“优质语音能力”，组装了“表达能力”变成了记者主持人，若继续增加“内容创作”模块，未来肯定会成为著名主持人或者知识性IP。


    朱燕飞：我曾是一名播音员，我做过的技能正迁移，就是把学习中文表达的技能迁移到英语学习中去。我迁移的是“母语学习方法”的技能，比如你的输入质量（听）决定你的输出质量（说）。


    第二个身份是记者和主持人：


    “721法则”提醒我，听的质量决定发音错误，但无论是中文还是英文，好的语言表达能力，不仅仅包括发音，还包括你说的内容，这涉及到阅读的输入、思考的处理、表达的练习等。


    未来，我做一个内容创作者：


    随着时代的发展，我意识到不能仅仅满足于有声音再创造的配音技能，我需要拓展的是显现“自己作品”的能力，这就需要增加自己的精品阅读量，练习思考能力与写作能力。我找到了一“推手”技能——写作技能，写作是思考后的输出，还遇到你多阅读精品去输入，提高自己的语言归纳和表达能力。我参加了“30天关注蛋长计划”的“写作主题”练习，刚刚过去的一个月，完成了30天不间断写作。


    还有，


    “辩手”老公配“编辑”妻子，一起负迁移。


    我就想起一首歌：“我们是吉祥如意的一家…… ”


    梦晨：负迁移举两个例子，一个是老公，大学时他是学校辩论队的，经常研究辩论技巧，所以每次跟他吵架时，他总是运用辩论技巧，让我觉得跟他难以沟通，而且咄咄心也累。所以我总是劝别人，以后不要找一个辩论对手做爱人。


    一个是自己的，因为做编辑有段时间，老公写的文章和说的话，我总是会挑一下字里行间的错误，老公为此也很郁闷，常说我能不能不要这么较真儿。


    古典的话：


    一定要穿越抱怨，看到正面意义——


    一个强势，一个精细，这么强烈地冲撞了，依然紧密联系你们俩的那个东西，一定十分美丽。


    当你看懂了这种人生的两面性，你能不断看到同一种能力的正负迁移。


    下面是一个教导主任的能力正负迁移——我的母亲是教导主任。


    雷烟大额：负迁移：我母亲在学校里做教导主任，然后每天晚饭的时候就成了“说教时间”，直到有一天处于青春期的我反抗道：不要用每天说教学生的态度来对待我，我需要一个妈妈，不是
    一个教导主任。从那以后母亲再没那种态度对我。


    正迁移：虽然是我母亲，因为做老师很'
