  md: '参加高考，其他大学一律按户籍注册制。考试及格，直接毕业，你就可以昂首挺胸就业了。每年 800万本科大学生，只录取 5 万研究生，那还没人踏折腾了。考研的时候，你就是成年人了，你被踢踹废了，是你的事情，你随意。


