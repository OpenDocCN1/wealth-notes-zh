  md: '所有的职工，日子好的难以想象。普通职工，住的是现在上海的标准六景楼，两室两厅一卫一阳台，干都是三室两厅，四室两厅，一层一户，家里有热水器淋浴。冰箱洗衣机全部是进口品牌，国产的买不到。少数家庭有空调，不是买不起，而是老的电力线路受不了。冰箱里塞满了肉，各色水果塞满冰箱的大溶盆。我们买野生大闸蟹，不是几个几个买，而是一大瓦桶的买，几十个，慢慢吃。


    读书是子弟校，我是转学过去的，很多中学老师是外地大学副教授过来的，因为们企业条件好，大家都愿意来。我的英语老师，物理老师，数学老师，都是985毕业，大学生师出身。这些大学老师还在学校里开过晚上补习班，高中资源超极丰富，我们当时的工人经济条件，远远比现在某个大企业的码农牛多了。房子不要钱，结婚脱发。


    但是，这种企业只能在郊区，而且是与世隔绝的状态下。因为企业太大了，市区装不下，企业大到处行走不出去的程度。走出去也没用，附近的人和你完全是两个世界，你和他们没法沟通。他们羡慕你富裕，我还能说什么呢？企业这么大，这么富，与世隔绝，后来成了巨大后遗症。


    工业时代，信息时代，没有什么百年长青的企业，起起伏伏很正常。到了九十年代中后期，企业倒掉了，我们是重工业，人家都在大下岗，产品卖给谁啊？企业待遇一落千丈，更加可怕的就是，没有出路。


    +   一，技术单一。我们是超级企业，每个人的事情，就像是医院轻轻钉上一个环的前半截，其他不会，再就业就是个苦力，不可能达到原来的待遇。除了职工医德的教训


    +   二，斗志全无。再就业要去几十公里外的地方，没法天天下班回家。我们九十年代，家里都是木地板，淋浴房，出去挤农民工宿舍，怎么可能？大家都不出去，干等死。


    +   三，无人创业。实际上也没办法创业。没多少钱，吃不起苦，干都穷了，也没人消费。不敢出门远创业，怕挨揍。


    +   四，家庭资产彻底贬值。我们的房子是好，但是在一个孤零零的地方，周围全是农田，又是八十年代的老房子，根本卖不掉。很多人提前退休后回市中心了。房子没有外人要，产权也不清楚，要卖掉，也就是个砖头钱。


    这把第二代害苦了，我就是最惨的。小时候过得好日子，一去不复返了，我在市中心日子那个惨啊，等我到了快三十岁才缓过来。


    大家一定要有警惕性，孤零零的郊区，福利再好，也不要犯浑了，那里不适合长期发展，一定要住人多的地方走。


    # 单位里那种明知道不会成功的竞聘，有必要参加吗？


    答：没事就不要参加了。谁上下嘴，最后是领导决定的，你自己跑跑烈勤有什么意义？认了吧。千个十年十五年，领导会给你提一级的。不要急。退休前，还有个“临近关怀奖”。


    # 屌丝要看清楚：


    很多大单位是不讲水平的，只讲人情。


    很多大单位都是天若独断的，在这一直三天地，没有任何势力和我竞争，我就是拍板的。你站一边去，既然不要竞争了，那你写一篇离稿件有什么实际意义呢？只不过看去，不给领导丢人，就行了。论文，呵呵，除了作者和编辑，还有几个人看啊？你认为单位里的老油条会看吗？


    既然找技术不重要了，那就有另外的选拔标准。是什么呢？上面满意。这就复杂了。报纸汇上说的，很多小姑娘给上面的人用了，为什么？还不就是为了满意这两个字？这和你写稿子，有一毛钱关系吗？


