  md: '发言，走过场，也就完事了。


    这怎么能行呢？老子还没发挥呢！你要抓住合适机会，第一时间跳起来。当然，也不是那种神经病的样子，而是章上启下，自然过度。例如，大头头问，现在有谁也说几句，你就第一时间站起来。大家背后都会笑你，”这家伙，纯粹是出风头”。你记住，记你的同事，永远小会不说好话的，别在意。你的任务是，让大头头记住你。


    人是站起来了，说什么呢？简单啊。刚才大头头说什么，你就提高着说，我是xx分行的张小敬，巴拉巴拉，我向各位领导保证，我们坚决贯彻上级意图，保证完成任务，充分体现xx分行年轻人的良好风范。


    大家都知道你在争表现。但是，单位就是鼓励年轻人表现啊！大家都雷打拉几的，这个队伍怎么带？大头头听完之后，他还以为你是人事部安排的积极分子，“刚才，张小敬的发言很好，充满朝气，充满斗志，巴拉巴拉”。说什么不重要，关键是：

    小子，我记得住你了。


    # 人事主任恨上你，怎么办？


    不要紧。关键是大头头知道你。


    绝大部分的985，五年八年不出头，实际上是被人事部的几个副职大妈卡着，就不让你冒出来。他们会选择自己的关系户，使劲推。那你怎么办？与其唯唯诺诺，成为老板狭袋造人，不如放手一搏，大不了，回家卖小馄饨。


    人事部正副职，往往是本单位的老土地。大头头往往不是本单位的老人，而是其他地方调过来的。

    大头头人生地不熟，急于抓工作，又没人，有时候是被迫接了了人本部的推荐安排。但是，人事部和大头头，其实想法不一致。


    大头头的想法是：抓工作，抓业绩，只要是干将，我就要。

    人事部的想法是：我是老土地，今后退休也在这里了，我要安排几个自己人，或者老关系，答谢各方。


    985，你不要怕人事部。得罪他们，他们可能处处给你下套，说你坏话。但是，他们不是你人生发展的决定性因素。最关键的是，大头头给你机会。到時候，大头头给你说句好话，人事部就急了。


    你要想尽办法，得到大头头的关注，做好工作，做出业绩。等你熬到部门副职了，人事部对你就没有－毛钱影响了，你不归他们管了。


    你要是害怕人事部的吓唬，你就完了。你们心目中的候选人，没有任何机会的，时间过得很快，谈对象，结婚，买房装修，考个职称，提个档，扯到2035岁，你就是老板凳了。


    不要怕，必须腾出头。输了也不过是桂圆老油条，无所谓。赢了，就爽大了。


    # 人事部也有软肋


    人事部最喜欢欺负老实人。他们的套路是，985新人刚刚进来，就给他们上套路，做规矩，批评，谈话，教育，把他们吓怂了。等你十年八年后悔悟了，你也错过机会了。


    人事部最怕什么人？刺头。软硬不吃，大不了我和你死磕。我报到你一个把柄，天天去告你。

    有一次，我被人事部逼急，我就弹到人事部一个职的 小错，天天去正职那里告状。正职一开始对我大怒，你他妈的一个脑人，居然敢冒犯我们人事部，不混混了？我也不怕，大不了滚蛋，我非要告。你不解决，我就去系统里告，我告你三年，你有本事开掉我。'
