  md: '体改制的企业，市场能力不足，最喜欢这种包销。


    这样一来，内销市场就缺货了。与此同时，大基建，大出口，农民工有钱了，县城开始繁荣了，特别是春节，相亲集中，日用品消费火爆，保健品，金项链，手机电脑，衣裤铝箱，啥都好卖。那时候，做生意也简单，看到沿海有什么新鲜东西，去批发城进货。服务业，直接拍个照片，马上复制到县城。拿不到授权的，直接仿一个。


    消费火了，生产也就火了。但是，这种好日子，没几年就产能过剩了。因为大家第一年发了财，第二年就翻倍生产，各行各业投入越来越大，设备越来越贵，利润越来越薄，扛不住的企业就挂了。活下来的，全靠低成本时代的积累。例如，自有标准化厂房的企业，一般还活得下去，租厂房的基本挂了。广东大片厂房空置，利润太薄，企业租不起了。


    传统行业，各省已经出现了比较明显的行业集中，排十前的企业包了 50-80%的份额，剩下的几百 家几千家小厂，抢一点点碎单子，勉强苟活。胜负已出，新来的人，要钱没钱，要人没人，本钱也不大，基本没有希望了。


    商业新希望在哪里？新兴行业，特别是面对老百姓的服务业。这个行业发财时比较难，毕竟不是手工活，不是大机器复制。就好像送外卖，上供一次只能送一家。但服务行业也有优点，很难集中。你家的海鲜做得再好，也是附近两三公里的居民来，再远，人就不来了。塑料门窗，铺地板，贴瓷砖，
    通厕所，大保洁，餐饮店，舞蹈班，游泳班，补课班，水电维修等等，很难形成高度集中，至少现在没有出现。


    服务业是个大家都可以赚点钱，但地，赚很多也不可能的行业，一家人几万，全在一起干。如果双方家长身体不错，也愿意出点力气，再加上小夫妻，六个人其可以干了。丈母娘负责带孩子和家务活，小夫妻加公婆，四个人负责经营，再加个表弟或者找个小工，基本就够了，每季度分钱，大家不吃亏。


    建议：不要盯着那些虚头巴脑的大公司了，也别太在文凭凭职称了，全家总动员，发掘一个小本生意，解决全就业。哪怕是卖煎饼果子大碗面，也比绝大部分的外资企业手机厂要好。关键就是这个生意是自己的啊，不会干八年就被开了。台北的夜市小老板，那可是世代相传的富
    人哦。懒就别看 了。看了你也学不会。


    # 如何可以突破年薪百万


    > 莱莱你好，我是男，英语专业八级，口语流利，现在离职找工作，想求稳定点，如何可以突破年薪百万。求莱莱给点建议?!


    答： 整一两班嘴。


    # 二十年后，工人在哪里？


    以我在工厂一线的表现象，现在的民企工人，99%来自于农村地区。自己读书不好，农村没有就业，村口两个小卖部就是全部工商业了。 大家往往是找个家族里还算有点能力的亲戚，去投亲靠友，
    赚生活资。


    家族里混的好的亲戚，很多是在沿海工厂里的小干部，孩子也就在这个厂里工作，有人关照，少受欺负。如果做的合适，三五年后就成为一个熟练的产业工人。


    这三五年时间，他就习惯了工厂生活，不急轻易改变了。因为转做服务业，做小生意，工作节奏，收入计算都不一样，很多人也不愿意承担六个月以上的收入减少和重新适应。


    县城的城镇户口一般年轻人，往往读过大专二本，更喜欢到大城市从事中低端白领，例如小公'
