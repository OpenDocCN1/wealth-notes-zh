  md: '正的目标是，我要找到自己说了算的，拿提成的机会，独立核算的机会。如果机会来了，坚决往前 走。


    # # 30 岁做技术还是做管理？


    这是很多年轻人的困惑，也是普遍情况。大单位里，新大学生一进去多是业务岗位，充实一线。 但是，司政后和上级管理部门也需要补充新人，一般是从业务部门选拔相对不错的好苗子。这时
    候，被选上的人一般是三十岁左右。


    我当年也遇到这个问题了。总的来说，业务方向和管理方向，本身不存在好坏区别，都是有上 升通道的。但个人而言，区别很大。


    当年和我同一批的，在各部委办局，业务岗位转管理岗位的，总体不错，但拔尖很少。司政后 和上级部门，在选人的时候，一般是考虑表现较好的苗子。这个筛选机制确保了，你今后基本上是
    在等以上发展速度。


    当然，任何单位的主力部门还是业务口，行政管理系统是辅助的。40-45 岁时，会遇到一次单 位副总的选拔，这时候，业务部门的人优势非常明显。一般情况下，如果副总四个，业务部门出三
    个是很正常的。


    大单位一把手，如果是本系统产生，绝大多数是业务部门出身，至少有副局以上业务水平。因 为一把手今后必须批报告，没有业务底子，干不下去啊。


    但是，业务岗位也有难点。业务岗位人多，岗位之间互相比较性强。大家都是干这个专业，这 么多年的条线考核，水平怎么样，大家是清楚的。行政岗位，一人一个事情，很难比较。


    最后，如果没混上去，业务岗位远远好干行政岗位。业务岗位是和外部打交道，无论是今后创 业，还是个人交往，还是有点面子的。行政管理，出了大门就没人理了。


    结论：情商高的，人缘好，大家都喜欢你的，考虑管理岗位。偏重于业务专研的，一定留在业 务部门，不要贪图安逸。


    # # 走出围墙的感觉


    从大单位离开后，你会突然间发现，原来习以为常的一切，都变了。大单位最重要是黄金入 云的大楼，黄金地段，最中心的位置，最漂亮的绿化，干净明亮大餐厅，有专职礼仪小姐的会议室，
    铺带地毯的办公室，任何事情只要打个电话，物业公司就来了。


    一夜之间，什么都没了。我在建筑工地，批发市场的小胡同里，像个流浪猫一样的乱转。在五 块块的路边拉面馆里大喊要加辣子啊，专职驾驶员没了，换成了黑车司机给你绕路。小老板哪有什
    么办公室，都是站在店面后的小仓库里和你谈。


    出差要自己花钱了，五星级旅馆就算了，168 还要选便宜的，宾馆早餐 68 元，我呸，家乐饭干 面也不错，最大牌薯多，六块钱管饱。去任何地方，再也没有副总到门口迎接你了，更多的是，"
    不好意思，忙完了再聊，你可以先别转转"。


    就这样，我走完了前三年的艰难。但是，独立核算后，赚的都是我的，再也不会死报了。当年， 我连一百块钱都当个大事请，买个草莓还还要看价格，想想真是可怜。


    # # 年轻人不要怕多干活。技能是自己的，谁也抢不走


