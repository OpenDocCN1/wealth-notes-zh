    他总认为，什么事情都有标准答案，这会把自己带到沟里。人的一生，可能十年二十年才有一次机会，世界已改变了，我们不能用老经验看待新问题，要学会随机应变，见招拆招，倒插门怎么了？不就是个面子吗？你不去想，就没这事了。


