  md: "# 出轨也不能影响孩子前途\n\n我问了邻居家的小学生，她说，就算是在优质小学，到了二年级，高中低成绩也明显分层次了，有的孩子成绩单到七八十分了，有的还是双百分。大部分原因是父母家庭矛盾造成的，没人管了，孩子也就读不下去了。我奉劝男人，出轨了也不要马上离婚，假戏没单人，不能影响孩子前途啊。\n\
    \n# 读幼儿园还是爷爷奶胡带?\n\n我一 开始以为，老人带孩子更加贴心。但是，我经过长期观察认为，正常孩子去幼儿园更好。因为在幼儿园里，孩子们学会了社交能力，小朋友之间的关系，也是很复杂的，勾心斗角，拉帮结派，背后揭发，偷小东西，互相嘲笑，今天跟他好了，明天跟他吵了。现在，幼儿园还搞手艺投票，为了争取多一票，小孩子们的社交能力，明显提高，这些社会的能力，在今后的成长中是很有用的。\n\
    \n# 刺激不刺激？我的心砰砰砰跳\n\n我刚才 乱俗收到某大规模的小学生调查表。父母学历单位年龄，这都是小儿科了。选两个问题，你答一下:\n\n+   一、你家住房的种类:\
    \  \n1.  高层，2.  3 (啥)  \n4.  别墅。\n\n+   二、平时家里还有谁一起住?  \n1.  2, 3 (啥)  \n4.  保姆\n\
    \n# (实话实说)\n\n我是东北某大城市重点高中毕业的。就单单我们一个班的同学，就从东北外流了2亿现金。我算给你听。我们班41个人，36人考上一本，基本说回来的，主要在京沪。5人考二本，留在本地的3个。出去了38个人，全部买房了，价值不说了。他们刚刚工，无非是双方父母出钱。\n\
    \n# 小学班级里的首富\n\n前两天，小侄女和我说：他们班上评出了首富，二富，三富。我差点眉古止。我问怎么回事？她说，首富就是住在最贵小区的小朋友。单价13万。二富是第二贵的小区。班上的小朋友都喜欢到首富家的小区玩。但也必须要她带进去，每次只能去三五个入，她可有面子了。\n\
    \n小孩子是真实的，他们的话不一定正确，还需要引导，但是反映了人性最底层的密码。很多中年人将买二套房，也就是最后一次买房了。富裕后，单纯追求面积的思路，也可以调整一下了。\n\
    \n建议，在够得到的情况下，中年人尽可能考虑高级小区的小三居，小二居，豪宅小区单价高，但保值率也高。我买的一个小区，十年了，还是新的一样漂漂亮亮，外观无损耗。\n\
    \n# 怎么提高孩子成绩？\n\n我见过几个家长，自学了十二年，重新解读了一遍中小学。大家努力。要不然，就是花大钱，找一对一教练。"
