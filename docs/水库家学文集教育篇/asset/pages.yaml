    # 个别热心家长，可耻至极！


    “个别热心家长”是什么人？


    少部分家长有钱有势，为学校做点贡献，是可以的。但是，个别热心家长若是为了讨好老师，讨好校长，在自己出了一点钱后，一转脸，仗着老师的权威，狐假虎威，去逼捐其他经济一般的家长，那是可耻至极了。


    个别热心家长，毫无节操，争先恐后，充当老师对学生逼钱的老子，目的很明确，就是让自家孩子获得竞争优势，一年级要选各种班干部了，大家都懂，老师说了算。你们有心思，可以。但是，不能以牺牲其他孩子的利益。


    希望个别热心家长，把心思用到正道上，多出好主意，少把孩子分成三六九等。美化教室要一万元之多吗？你们想什么，大家都懂。家长应该为孩子们树立正确人格，而不是鸡贼般的投机取巧。你们交了同样的钱，你当了好人，其他家长成了恶人，合理吗？


    好自为之吧！


