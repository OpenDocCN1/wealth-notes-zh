    # ## 读大学是消费，不是赚钱


    实事求是，现在农村乡镇的富裕人家不是二本子家属，而是真正的劳动者，特别是在大城市辛苦岗位打工的劳动者，装修工，育儿嫂，油漆工，快递员等等。所以，读大学是消费，不是赚钱。

    你有钱就去消费吧。改命运运营劳动，不是八儿八儿嘴。夸985去银行总部管管团队（清北）还差不多。不过，就那些打鸡血的菜瓜禽中是不可能考上清北的。


    # ## 绝大部分二本子


    在三十年前应该是中华门长途汽车站劳务市场街角的农民工，现在摇身一变为二本了。


    # ## 现在有个普遍的观点


    富二代读书不如穷二代，我实在无法理解，你的穷爹穷妈为什么会有这种奇怪的想法。。。富人的年轻老婆都是985女，抓考试可来劲了。亲媛是名校留学生，我家庭娃学习成绩全年级遥遥领先。


    # ## 娃娃问我，自己是不是富二代


    我告诉她，是的。你班主任是个穷女人。娃娃开心大了！


    # ## 凡是富人家庭


    有个超级优点，自律性特别强，考试成就是拼自律，自虐。


    # ## 如何提高孩子成绩？


    如果你孩子初二可以考及格初三的卷子，那肯定是年级前十名。提前教育最重要'
