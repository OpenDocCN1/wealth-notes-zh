  md: '谐很多。搬运工，操作工是紧缺型人才，大学生是过剩了，烦死大学生了，一天到晚研究劳动法。三天两头要和你辩论人生规划和国家法律，算了，不招了，你回家吧。很多大学生喜欢研究什么职业发展空间。没有！走吧。


    # 人生的下半场怎么混？37 岁后


    如果你不是带编制，又是办公室没技术的人员，你基本会在 37 岁后遇到职场滚蛋的命运，给小妹妹，小弟弟腾地方。你个老东西，三天两头请假，烦色特了。


    怎么办？赶紧找个副业，可以干到退休的那种。


    我又犯傻了，去指点为男。


    # 千辛万苦当上了领导


    可不是为了天天加班。


    # 没背景，如何在大单位升职？


    大单位升职，两种人比较多，大多数是各方面中上的乖宝宝，少数是我这样的二楞子。乖宝宝是最受欢迎的，分管大牵头一提名，就通过了。我这种二楞子属于“有争议的人”。其实我也不希望成为有争议的人，只不过是到这一步了。


    我这种二楞子一般是哪某个方面有严重不讨人喜处，当了几年乖宝宝，领导把我忘记了。我就忽略了，怎么办？让他记住我。什么事情领导特别黏，到了那个提拔时候，还要反查找领导争取。领导也懊你，我们平时为了争面子，得罪人闹事们的事情多了，闹事们也懊你，关键时刻，加上掩护心，就落井下石了。人事部最好你倒腾，脑个指标给自己人，争议就来了。


    但是我们是靠拼命干活争取的机会，大头头需要这样的人，用的顺手，就要提拔一下，七上八下，有时候通过了，有时候就副下去了，总体而言，不顺利。


    你们尽可能争取做乖宝宝，不要成为我


    # 我适合发展什么第二职业？


    在职精英：关注您两年多了，想问问您天天上班的程序员，适合发展什么第二职业，可以一直干到老？？


    创播门考吗？


    # 赚钱就是解决难题


    前些年，我在河南打市场。夏天，太阳晒得地面都焦黄了，我一天到晚跑各个县城，找啊，谈啊，每天汗水湿透了四五次，皮肤晒得跟个球似的。冬天，冷的感冒发抖，秋裤穿三条，一天到晚都是小馆子的烩面，又难吃又脏。连续三年失败，我是咬着牙坚持下来，最后，打开局面了。


    到了春季发货旺季，我就住在车间里，机器轰鸣，日夜不停，半夜刚刚睡弯，卸货的卡车又把你吵醒。闹所里虽然有余有老眼，我的天哪，车间的一比吊椅，夏天热的心抓急乱，冬天冻的像条狗，吃的就是食堂大锅菜，连续几个月高强度劳动，比农民工还惨。


    要赚钱，哪有那么容易啊？不是再有借什么投机取巧的玩意了。你还是老老实实干点什么吧！我原来那个男助理，早上夹个煎饼果子上班，吃的办公室一般油烟味，下午一到五点就下班。上班


