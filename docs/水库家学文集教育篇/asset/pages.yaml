    # ## 中国年轻人，近视眼太没了


    中国年轻人，现在近视眼多的实在是太离谱了。有些是打游戏，但是大多数是题海战术的结果，你去高中教室看看就知道了。孩子们为了多考个3-5分，把身体搞的没力气，近视眼，焦虑，何苦呢？建议：


    +   1. 除了985大学，其他本科一律注册制，三年就毕业。实用学科，本科三年也够了。混文凭的，就早点混完吧，不要互相耽误了。追求科学，就不要设立门槛了。

    2. 大量缩减研究生博士生。只有全心全意搞科研的人，才值得国家投入。

    3. 严格研究生和博士生的培养，至少发个平岗工资，让他们安心工作。


    这样做，有利于反腐。没人去找教育局了，教育局可以安安心心搞好工作，避免外界干预。什么写个条子，托个关系，都没了，多好啊！


    # ## 当985收入还不如泥瓦匠的时候


    为什么还要苦苦读书？


    因为倒插门需要文凭，谢谢。


    # ## 高考大于天


    对于凤凰男而言，高考是翻身的大机会。倒不是说，985文凭可以月入两万，那是意淫。985文凭最大的利益是：倒插门时代的硬通货。


    河南山东安徽的凤凰男，要是有个正规的985文凭，其他条件就算统统是大路货，苏州杭州南京的女媒99%会同意。


    江南女子，温婉柔软，吴姑脸谱，咱穷爹爷干快钱的西装去就行了。女人，房子，好车，股权，都是你的了，再给你有两套拆迁房，上门直接用。


    大家要教育儿子，没有首付不要紧，好好读书，争取考个985，未来的丈母娘正在苏州给你赚钱买房培养女儿，将来都是你的。


    # ## 刚才看了作家宁南山的一篇文章


    大概意思是对教育和房价不满意，（没说医疗，可能他身体好，没什么体会）；洋洋洒洒近万字。为什么很多人不满意，但就是改不了呢？


    因为你不满意的背后，可能有些人比较满意。


    举例，如果街上到处都是监狱，那用不了几天就会改变，因为大家都不满意，这事得就办好了。但是，一部分人满意，一部分人不满意，这事情就不好办了。'
