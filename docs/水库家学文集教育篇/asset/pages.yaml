  md: '够让企业的技术水平和销售额领票亮的增加，所以给的工资是最高的。但在大环境不像前两年那么好的情况下，他们的成本和收益明显不成比例。企业不想要他们了。


    # 二，中年人的技术可能落伍了


    计算机技术，日新月异。会计审计法律金融，各种新知识，层出不穷。中年人整天忙于日常业务，家庭事务，天天算自己的 KPI 和奖金，没有静下心来好好看课本的心态了。如果业绩做不出来，销售额上不去，连做技术员的本钱，可能也不如
    25 岁的工程师了。


    # 三，中年人的傲慢让人不舒服


    很多中老年白领是 985 出身，以前成绩不错，又是单位寄予厚望的，开始自以为是，强考资格，看不起年轻人，对公司乱提要求，时不时想升职加薪。以前业务忙的时候，只能是哄哄他，现在不忙了，看你就不爽。不开你，开谁呀！


    # 四，劳动法逼得企业开人


    劳动法要求，连续两次签订劳动合同，就算企业之爹了。企业不死他不走。理论上有很多办法，但实际上他不走，企业很为难。你总不能只招聘一个人，天天拿摄像机跟拍他是不是符合岗位要
    求吧？即使不符合，那又怎么样，企业也要培训调岗，这实在是压力太大了。小门小户的企业，养不起你没没啥利润的大神，早走早了，两不伤亡。


    # 五，建议


    +   1、对于劳动者的最大保护，是企业盈利，扩大就业，而不是难以辞退。如果职工走能能不退，会极大的遏制本就就风险重重的中小企业招聘意愿。现在的中小企业，老板都是朝不保夕，哪里管得了职工一辈子啊！


    +   2、机关事业单位国企，每年要留出一定比例专门招聘 45 岁以上老白领。总不能把这事全部 扔给民企吧？


    +   3、劳动法也要根据经济发展情况，灵活应对，该修改就修改，该坚持就坚持，团结一致加油干！


    # 怎么防止性骚扰？


    莱莱好，我是刚刚毕业的小姑娘，想问问有没有职场或者商务上防性骚扰的方法？我虽然跟着家里一块做生意，但也难免碰上一些人，有求于他，个别 人要想粘来点小便宜的。例如语言上轻浮几句，酒会上摸一把之类的。


    答：大家谈谈。


    # 35 岁是个坎


    我周围的人，但凡成功的，在 35 岁左右都有一个明显的特征，优质主力部门的实职副处 长（很多是主持工作，没有处长）。这一步不上去，就我周围人而言，基本都 完火了，进入漫长的平躺期，估计退休前有个安慰奖。


    # 请教各位才华横溢的三本大学生


    莱莱，关注你有一段时间了，想问问你，能给没上过大学的普通妹子说一下，干啥能多赚点钱？辛苦没关系的！


    我今年 26 岁，女，该结婚了，可是我不想我孩子以后跟我一样，苦拉芭拉，我家 是农村的。


