  md: '![](img/706099d9806841701e3c0667964882bb_12_0.png)


    给后来的准备上实验班的同学建议：

    1、英语能在初中前搞定。尽量在初中前搞定。进高一后，北京高中的“模拟联合国”社团。全部英语听、说、及写作；与北师大实验、人大附中、101等高中的国际部学生同台PK，也挺有意思的。

    2、数学尽量不要拼套路了，有时间在高中前，尽量把“初等函数、三角函数、向量、不等式、排列组合、数列、逻辑”学完，即高中理科数学必修一至必修4及部分选修；不学排列组合，高一起始的“集合”部分，没办法做题；不学“不等式”，“函数单调性”又没法学；三角函数及向量部分，是高一一物理力学分析要用。

    3、语文部分。把红楼梦等书全读完后；把《论语》全背完吧，把古诗词全背完吧。

