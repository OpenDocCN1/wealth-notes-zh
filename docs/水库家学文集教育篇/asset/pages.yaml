  md: '其实，现在的二本大学生，在我们那个年代，就是农民工或者县化肥厂工人。扩招了，把他们拎到大学里读了几年高大上的概念，毕业后他们就傻眼了。京沪沪深的高学历，电力局，事业部，招不了几个人，而且都是你懂的路子


