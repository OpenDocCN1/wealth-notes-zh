    # ## 社保的成本研究


    上海很多不規範的企业是按照平均工资 4279 元核算的，缴纳 1899 元社保，无论名义上是谁出，归根结底是企业出钱。现实中，上海大学生第一年大多是 5000-7000
    元，三年后上涨就多了，近万元是比较多。


    元日后，按照实际来追缴，社保成本应该是接近翻倍的。按照一个人增加 2 万元社保成本来算，超过 30 人的企业，你自求多福吧。据我了解，相当多的民企老板，一年的净利润到手，可能也不过是
    50-60 万。第一年，可能还会挣扎一下瞪瞪蹑，第二年估计还不瞪蹑了。


    # ## 社保追查进行时！


    > 《新浪财经已经开始说这个事情了，我也社着胆子说几句）


    2002-2007 年底，中国入世后，因为民众等出口企业的勤奋努力，经济形势一瞬间火爆的无与伦比，触而夺目。几年时间就攀到了全球第二的水平，外汇储备多的发愁，电视上天天鼓励大家换外汇出去旅游。与此同时，当年发生了一个黑砖窑事件，就是几个农村犯罪分子在乡下承包了砖窑，在火车次路盗发残疾人打工不给钱，还非法拘束。


    新闻报道把这几个难得一遇的犯罪分子，巧妙的冠上了黑心老板的帽子，这就转变了矛盾焦点。很多人也因为收入分配差距扩大，立即对民企指责，舆论就升温了。劳动合同法顺势推出，社保征收开始登场了。


    当年，大多数民企的工资也就是 2-3 千元，也就是基数申报。员工实际上也不太关心基数，因为现在交多少退休后领取多少养老金，实际上没有什么计算公式。这个情况就这么延续下来了。


    这几年，工资发了真一样涨，现在一般是五五六千起步了，七八千司空见惯，这等于社保翻倍了。现在上海的社保是最低交 1899 元，如果正常交，接近翻倍。有关部门关心大家，减了
    1%。你们也要感恩。


    2008 年以前，中国经济是非常好非常好，好多民企吹吹牛还能够扛下来。现在的经济形势，你也知道，如果社保翻倍，潜纳金写罚款，很多企业会如何？不言面喻《求生欲望强》。


    我要奉劝各位民企小老板：放弃幻想，回头是岸，多想想老婆孩子，千万不要执迷不悟，依法缴纳是你的唯一出路。给你机会了，不要错过！


    中国经济，稳中向好，稳中有进，形势非常好。农民工与时俱进，大批转岗，是经济发展的必然进步，绝不会发生失业潮。m2 呼啦啦的，铁公鸡放出来，农田水利，高架建造，有的是高新岗位。放心吧，为中国经济加油。


    2020，不见不散。我 intra 环现等你。


