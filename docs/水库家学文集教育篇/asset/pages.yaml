    拼搏必须要有目标。孩子什么都有了，还拼搏什么？你家总不能为了培养孩子的拼搏精神，再回周浦读农民小学，住电梯房吧？但是，如果真把孩子养成 250 了，以后遇到时代大变化了，他们又能怎么办？想这些富二代富三代也蛮可怜
    的，要不给他们成立一个家族信托，雇人来替他们管钱？


