  md: '三是业务普善。有的老翻译，干不动了。发包方会找他咨询，请他把关。谁接的上？老翻译就垄断了这个市场。外面的人根本无力竞争。对于各种单位而言，翻译费很不足道，所以，只求稳，不求性价比。


    # 我想请教一下各位大学生


