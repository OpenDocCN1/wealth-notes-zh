  md: '我有个初步的想法，不知道对不对？大家也可以谈谈。像我这样的家庭，其他不担心，就是怕孩子学坏了。我准备从小引导孩子将来学法律系。据我的观察，法律系的人，几乎没有发财的，但他们很稳当，也几乎没有混成傻B的。


