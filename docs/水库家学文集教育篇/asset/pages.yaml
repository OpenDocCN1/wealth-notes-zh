    # # 好像其他户口都不值钱


    现在，除了京沪，好像其他户口都不值钱了，买个老破小，当婚品给你了！广州易积分入沪，条件也很宽松，要等几年而已。


    # # 上海户口有什么用？


    读书，买房，找对象。还有啥，大家补充。


    # # 上海的户籍会不会放松啊？


    个人观点，10-15 年之内不可能放松，必须要到二线换城市来了，才可能。


    1993-1997 年，本科生有公家单位，就可以落浦东户口。


