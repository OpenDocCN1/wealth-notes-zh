    # 学什么可以赚大钱？


    大家都会的知识，只能吃饭，不能发财。我们年轻时最牛，最牛的技能是英语好，外企上上班，杂美元工资，国外出差。最笨也可以做个贸易员，老板的小姨子和小姐妹你一脸崇拜，死了。家长们拼命的培养孩子英语能力，十几年前开始留学，宁波许多家长卖房，女子去澳大利亚混迹几年。


    现在，英语好已经没人看了，大家都会。你流利一点，我慢慢看也没问题。这么多年的投入打水漂了。外企的工资，已经沦落成了房价增速。


    现在的家长还是 20 年前的思维，流行什么学什么，抹杀个性，不看大方向。数理化，语数外，考普通高中，确实重要，但只是人格健全而已，不能指望赚钱。大家都会，没人花钱请你。读完大学，你就重新思考一个问题，大家都会的语数外知识，大家都有的本科文凭，我也有，接下来怎么突出重围？


