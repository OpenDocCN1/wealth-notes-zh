  md: '划刀子也溜得很。我知道一个主刀医生，原来是文革时候生产队杀猪的小伙子，见血不晕，调到卫生院接班忙。上海大医院的主力大师傅，那个年代被下放割多乡镇卫生院当赤脚医生。言传身教，慢慢养得他的小伙子，也会开刀了，专攻手腿的骨科打钉子。后来调到市中心医院，补了夜大夫，中级职称。


