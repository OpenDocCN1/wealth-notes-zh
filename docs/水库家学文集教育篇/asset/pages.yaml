    这种情况可能需要换行业了。建议换到技术工种，例如鸡农，养猪，挖下水道，劳动最光荣。相对而言，不需要太多的情感交流，情商不高也可以做好。尽可能不要去考那种需要进大单位的专业，现在的普通医学博士，都不能保证进京进三甲，进地市三甲更不多。你可以积极争取。


    # 中国代购在本国 13 万件药品被捕


    新财富杂志.【中国代购在本国 13 万件药品被捕涉案金额 1530 万】日媒 7 月 31 日消息称，一位家住日本的中国籍男子因涉嫌不法持有一定量药品，在当日被警方逮捕。而他囤药的原因，自然是为了做代购。警方透露，目前张浩治已经认罪。“日本的药品安全。中国人有需求，变得很好”，他供述。据交代，他从
    2015 年起便开始从事药品代购，2 年来接受了他在他在中国人约 750 位订单，初步估计，他的总销售额则达到了 2.5 亿日元（约 1530 万元人民币）。（来源：观察者网）


    菜菜：心酸了


    # 二十年来的一场升职记


    我年轻时候，内环线研究所里有个升职明星小李，男生，没有背景，条件很差，升职最快。我们是社科专业单位，他是一个二本大学计算系毕业，进单位后分到后勤处（现在改制叫后勤部，处长改叫部长了）。


    所里是以科研论文作为业务主项，小李属于彻底边缘人物，一天到晚，就个打钻机器，这是我们那个倒，那里挨个倒，忙忙碌碌，特别擅长打印机卡纸。我们为了显示自己高人一等，还经常叫他李工，不是工程师的意思，是工人的意思。


    一年后，我们大跌眼镜了。他评上了一系列的优秀和荣誉，来着；我们也不尴尬，因为我们和他属于两条线，就像医生和电工。三年后，我们还是科员，他已经是科长，七年后，我们还是副科级，他
    29 岁，已经是副处长了，这时候，我们算是傻眼了。


    处长属于单位中层，单位办中层会议，我们被安排去做记录，已经是天大的面子了，他已经是堂堂正正的中层干部了。走廊上遇到，我们还要叫他李处长，实在是尴尬到家了。虽然，小李同学还很谦虚，但是我们是自尊心受到严重暴击。


    说了半天，大家都奇怪，小李升职怎么能就这么快呢？说白了，也搞笑。我们是九十年代后期进单位的，当时上海正在普及电脑上网。这个是很天动地的大变革，他被招进来，也是这个因素。当年，电脑是普通人家里最值钱的大件，大概是
    6~8 千，那时候，内环线一室小房子也不过 10 万左右，上钢新村（世博会区域），一套小户型，也就四万元。


