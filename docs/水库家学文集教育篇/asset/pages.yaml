  md: '学习芭蕾，钢琴，拉丁舞，有一些名贵的老校车，为了赚钱，大呼隆的搞资质培训，或许，他们中的极少数，可能会被大佬看上，成为三西派的小明星，但绝大多数孩子不但没有出路，反而养成了好高骛远，鄙视艰苦劳动，幻想一夜暴富，一夜爆红的恶劣想法。


    高考刷题机制，严重损害了青少年健康。去看看那些所谓的高考工厂，里面的孩子，还有没有不戴小眼镜的？几乎没有。大多数是亚健康状态，目光呆滞，目光无光，一天到晚抱着复习题册刷啊。家长们为了一个不值钱的劣质文凭，赌之若甚，花大价钱折磨孩子的健康。


    一些文人骚客，误导青少年家长，不恰当的赞美考试，赞美刷题，好像体力劳动者就是人生悲剧。其实，他们只是为了自己的卖学区房而已。非常卑劣。


    经济建设，保家卫国，靠的是一大批身体结实，视力正常，精神健康的年轻人，而不是考试刷题工厂走出来的亚健康胖子，高度近视的豆芽菜。


    绝大部分孩子，经过十几年的刷题，把眼睛损坏了，身体刷颓了，也考不上 985，最后还落了一身的臭毛病。这个也不想做，那个也不愿意做，只想在大城市的空调房里打电脑。这群年轻人目前还是幸运的，因为中国经济三十年的高度发展，让他们的父母给孩子门创造了有房有车舒适环境。但是，这种好日子还有五到十年就结束。因为他们的父母老了，干不动了。


    接下来怎么办？那时候，他们也到了三十岁以上，上有老下有小，再出去干苦活是不可能的。于是，一大批闪闪发亮的键盘侠就出现了。今天骂这个，明天骂那个，全世界都欠他的。


    # 穷就是懒


    读个二本，毕业出来找工作，求爷爷告奶奶，一个月几千块，朝九晚五，生怕迟到，生病不敢休着，早上上厕所，也要赶紧签去单位。有意思吗？


    去修队站贴，稍多的做不过来，一个月小几万，想做就做，不想做就去旅游，给女友买个凯迪拉克，给父母送个大红包。白天苦干苦干，晚上烧烤小啤酒，多开心啊！就是累一点，苦一点，二本子不愿意啊。


    有什么办法呢？穷就是懒。


    # 第一次深刻知道装修工来钱


    是 2014 年。我拿了个旧水壶给他说，可以烧水喝。过了几天，我再去，那个旧水壶上全是灰，没人用，屋子里都是矿泉水瓶子，香醋都是十几块的。装修后，有个开宽大条浴，做完之后，我开心好意思，我开车带你们去地铁站吧。他们说不用。记得的，两个人是开始新的
    SLV 的。


    # 装修以最高级的活


    刷墙和贴砖，真的不难，就是累人，工作环境灰大，如果勤快，一个月两万是基本可以得。而且不会失业，现在，有手艺的装修工一般联系多个包工头，比包工头强多，价格谈不拢就算了，这家的不干。包工头主要负责旅客车，画图纸，打点物业保安，负责和客户打架。实际上不干活。


    # 没那本钱的，谁理你啊！


    收入分配，进一步向体力劳动者倾斜，已经是大势所趋了。


    体力劳动者是最辛苦的，他们应该多拿钱。那些在办公室里玩端皮子的二本子，没什么社会价值'
