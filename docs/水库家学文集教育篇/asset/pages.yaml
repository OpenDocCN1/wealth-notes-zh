    她是正牌的本科生，但给我的感觉是，文化程度确实不高，思维很直接。怎么赚钱，怎么买化妆品，没有那么多弯弯绕绕的小心思。在人情世故这一块，全部是家庭给她的，并没有后天学习的痕迹。


