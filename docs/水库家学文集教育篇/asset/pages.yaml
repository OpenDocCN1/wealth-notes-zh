  md: '就是打打电话，吹吹牛，一天到晚悠悠。下了班，啥也不管.


    让他干个什么事噻，他就摆困难。这个不行，那也不行。确实，这些问题我都知道，如果你去解决了，你就是部门经理，甚至是副总。不解决，你抱怨有什么用？年底无人吧.


    老板是怎么提拔年轻人的？就是看你经不经事嘛！这些破事，老板都知道难办，你去办成了，再写个办事过程，老板看几次就有印象了。民企流动性大，过个一两年，你就是部门经理了。光是谈困难，谁不开


    你这么下去，也就是三千块的命！滚.


    # 学会写报告


    我的微博，最后一段都是建议或者结论。为什么？这不是大学老师教的，是我这么多年的工作习惯。我在大单位里混的呼风唤雨，年纪轻轻，就扶着直上，不是没有道理的。我接到任务，第一反应就是，拼了命去解决.


    解决之后，也不能当老实人啊。就写个工作情况报告，一、二、三，我遇到什么，干了什么，搞定了哪些，写的清清楚楚。以后怎么办？结论或建议，说的明明白白。每个领导都需要一些敢打敢冲的二愣子。解决了问题，成绩是领导的。出了事情，我自己背锅。这种干活，你怎么可能默默无闻呢？


    你tmd一天到晚鸡零皮子，上下五千年，你部懂，就是不知道怎么干活。哪个领导不烦你？你还想提拨，还想当市分行的行长，还想去总助办公厅，你脑子抽筋了吧？


    亲爱的朋友，你今后混的好坏，和我没关系。但是，真心希望咱们不要辜负大好年华，你的职业生涯也就有22-35岁，混不到县副行长，到处长，你的职业生涯也就这样了。各行各业，大道相通，要么自己干，要么能干事。只要我在这里顶着，领导放心中下我.


    # 领会上级意图


    混大单位，玄妙得很。大头头永远都不会和你说大白话。因为说活话，出了问题，大头头要担责任，但是，这事情也要解决，否则大头头就会吊。怎么办呢？不成写给你，再交代几句，既要又要，四平八稳的话。你可能就做晚了，照他这么说，啥也不干成功？


    这就考验人了。你有两种办法.


    一是也装糊涂，事事请示。大头头就算看扁你了，没担当的货。以后靠边站吧。


    二是领会上级意图，这事情必须解决，但领导也不能直接告诉你，把他们扒趴下几分就好了。怎么办？自己拍板。干成了，是领导指授得当，干砸了，我自求处分，和别人无关。呵呵，你要是敢这么玩，你不被开掉，就是呼啦啦大了.


    任何单位，内部的管理法则，其实就是人性。只要你忠诚可靠，能力强，一般是有机会的。关系户不顶事，那是没办法，谁不喜欢猛张飞啊？


    # 如何在一群985中脱颖而出？


    大学坐招人，每年都是几十个。三年前后，就是一两百个了。进了单位，人事部就比分到一个犄角旮旯的地方了，谁记得你啊！怎么办哪？


    抓住机会，跳起来。大部分学生仔，都有个衣丧思维的思维，特别是难得一见的大场面，班子成员都来了，真不敢往前凑。就好像本科上大好，最喜欢坐在后面。但是，大场面也不是唱独角戏，台上台下，总有个互动。正常情况，人事部的小王都会提前安排好，第一个谁发言，第二个谁'
