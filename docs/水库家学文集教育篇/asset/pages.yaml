  md: '我说的出来创业，也不是盲目的，一般要提前两年准备，有针对性的论证各种项目可行性，提前结交各路朋友，多跑市场，多研究方案，办公场地，人员组织，资金筹备，找合伙人，都要搞起来了。


    辞职的时间点是，一次重要的提拔机会后。如果你失败了，那么三天后就可以走人了。为什么要等三天？因为这三天，领导可能会和你谈一次话，给你第二选择方案，虽然稍微差一点，但是也是一种提拔重用，例如，给你去美国学习半年，或者到分公司做一个实体部门的负责人。


    条条大路通罗马，不要以为在一个单位或者一个序列里往上走，才是成功，当你具备了较强的个人素质后，你可以选择新的人生，新的创业。


    2，如果是一个商业大家族出来富言二代，父母已经给你打下了 1 个亿的基础。那么我还是建议你在体制内锻炼 2 到 3 年，同时找一个 985 漂亮老婆。在体制内学习统筹安排，规章写作，是最好的途径。结婚前，你就进入家庭企业。这种企业已经积累了比较规范的流程，市场也成熟，商业秘密情况你都知道。你的任务是要花
    3 到 5 年的时间，把这些都练熟了。你在这个年龄，父母还能帮你一把，等他们 70 到 75 岁之后，他们就没有精力来帮助你丁，所以你在体制内待的时间太长，并不有利于你顺利的接班。


    总结：没有巨大财富的孩子，最好体制内一步一步往上走，实在是走不通了，才考虑创业。


    如果是家族企业富二代，体制内学习两三年就行了。在体制内锻炼过几年的年轻人，一般有较强的自制能力，能分辨好坏是非，以后不容易走歪路，不会去吃吗嫖赌。


    加油，年轻的小伙子！


    # 有没有快速积累财富的方法


    财大叔，请教一个问题，有没有快速积累财富，从屌丝一跃到中产阶级的办法啊。（不拼爹，不娶富家女）。谢谢。


    答：喝半斤啤酒，马上就快乐了！


    # 想辞职去贴瓷砖


    贴地板的师傅一天 300，我们办公室坐者一天 100，我就想问，现在辞职出去学习拎灰桶，割灰，贴瓷砖…还来得及么？


    答：体力活比较辛苦，你可以试试看。


    # 做人要留后手


    +   1.  在单位打卡的时候，我布局了塑料桶。

    2.  塑料桶的时候，我布局了房产。

    3.  房产时代，我布局了自媒体。

    4.  自媒体时期，我已经打核了全产业链的房产咨询公司。


    这个世界变化太快，天知道明天会如何？你永远要给自己留一个逃生通道。


    # 为啥就是升不上去？


    我在大单位，勤勤恳恳十多年了，为啥就是升不上去？'
