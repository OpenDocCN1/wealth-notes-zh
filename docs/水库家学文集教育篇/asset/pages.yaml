  md: '的。今后，越来越市场化，肯定是按照需求分钱。


    你要是能够替我做了我不想干的事情，我肯定愿意花钱。大道至简。我不需要奥敬高，不需要二本，不需要钢琴老师，市场最需要的是家政服务员。


    # 小区一个理发师


    如果服务好，夫妻两个日赚两千元是很正常的。除去房租，标准的高收入人群。还不用上下班。你给层丝说，屌丝肯定嫌差，这活太低档了，哪有打工者舒服啊？


    # 那些年，我们曾经鄙视的下人


    剃头匠，估计你不会正眼瞧的。前两天，我居然仔仔细细看去看了一眼。


    他们穿的工作服，都是千元一件的特制短袖羽绒服（黑色长款）。我问他，为什么啊？他说，这是小钱，要有个形象。


    他们不喝自来水，都是矿泉水，一大箱灌在那里。


    他们午餐外卖，都是三十元以上的盒饭。


    上海这里，除了简单吹吹，女性头发稍微搞一下，一两百是起步价，四五百很正常，几乎零成本。一天毛收入三千是打底的，春节前，连轴转，一天一万不是梦。精装修门面房，六个客户理发椅子，都是崭新的皮椅子，一个梳头的小工，几个小助理也不知道开多少钱工资。夫妻两个忙里忙外，三十岁左右。他说孩子读幼儿园花了很高的赞助费。


    他家就住在店铺后面高尚小区里，借房子，车子没看到。


    我估计一年到头，带国家 30-40 万存款是可能的。


    # 海龟求职难，HR 不感兴趣


    海龟和求职，是两个世界。大部分网站招聘，都是为了性价比最高，也就是干的多，给的不多，还要感谢谢老板八辈祖宗。海龟，大部分家宴条件比较好，从小到大都是国际优游的，吃亏耐劳的事情，估计可能性不大。


    大部分公司招聘的初级人员，干活为主，HR 不希望这个人刚刚学会了就辞职。海龟明显不太可能长期干这个，他们想法多啊。于是，HR 和海龟，互相看不上。


    真正的海龟，实际上应该是在外国大公司工作五年，有一定成果。然后通过社交圈，直接找到副总，或者副总联系你。谈好了，HR 办手续。一个海龟要是沦落到被 HR 挑来挑去的程度，那基本没啥头了。


    设身处地想一想，海龟真的比二本强多少吗？也不见得。有什么岗位是二本干不了。非要不知名的美国州立大学来干？现在的互联网大企业，金融大企业，市场重点是三四线，海龟不海龟的，没什么区别。你去矿村里做拉存款，卖理财，海龟个个聪明，还不如去喝个小苹果，扭几下腰呢！


    “大哥，感情牌，走一个。老妹我豁出去了，上白的！”


    # 社会主流人群是在六环外


    在改革开放初期，少量的国际化人才，会外语，吃西餐，那是需要的。大家都不，你会你厉害。但是，这种人才的需求量是很少的，大部分的岗位需求，还是干活卖力气。


    现在，我们幼儿园就开始教英语了，翻译笔，扫描软件，比比皆是，一般性的外语需求，已经'
