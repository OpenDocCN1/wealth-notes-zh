  md: '相当多的农二代，父母打工多年，已经城里买房了，特别是在县市，漂漂亮亮的三居室，生活条件非常优越。运气好的，例如我家几个亲戚，三五年前，买在成都武汉重庆长沙这种大城市，孩子简直是非上天了。农二代中学毕业后，多多少少也读过，大多数文化水平，自认是文化人了。刷题这么多年，小眼镜是摘不掉的。好逸恶劳，不是少数，这样的农二代，绝对不会再去制造业和建筑业，住工人宿舍了。他们宁愿在城市里，拿个三千多的混日子岗位，在家里忽悠父母倒贴，我在考公司，考编啊！


