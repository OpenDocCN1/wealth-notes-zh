    正当防卫原则，实在是太苛刻了。地痞流氓在马路上摸你老婆一把，我劝你还是忍了，可以报警。但不要去找对方。因为他已经摸完，没有继续摸，你冲上去打他，你就故意伤害他人，在公共场合打架了。如果你抄起棍子抢过去，很可能就是在一起拘留。


    坏人无所谓拘留，拘留三次和拘留八次，区别不大。但你是好人啊，单位里要是提你当副科的，你要是打帮被拘留一次，人生就废了。这么多年辛苦的故事白受了。


