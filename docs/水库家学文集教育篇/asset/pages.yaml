  md: '他的论文水平怎么样？正高要考英语的，从来没听他说过英语。


    # 咪蒙的演讲，一般人听不懂


    因为你没有到那个境界，就像白领无法理解股票买卖到底什么是啥套路。全网，连续十年，全日制写自媒体的，大概也就那么几个人，我算一个。


    她是每天一篇，每篇几百万阅读量。一般人根本不知道这是什么概念。我每天都阅读量至少是一千万，这是拉黑了一万多黑粉后的数据。当然，微博的水分比微信多一点点。但是，大差不差吧。


    咪蒙这次演讲的核心意思是，你们别做自媒体了。当然，这不是原话。她说了个圈说的。她说了自媒体的两个难点：


    +   1. 持续出爆款很困难，时间长了，压力方大到崩溃。

    2. 要出爆款是有方法的，巨大的经济投入，采访多少当名人，聘请多少员工，联系七十多个国家的专家等等，幕后工作量大的一吊吊嘴。


    你看到这里，基本就放弃自媒体创业了。照她那个玩法，这是自媒体啊？这是传统杂志社：bbc重新开门营业了！


    咪蒙为什么会这样思考？因为她背了包袋，"全网第一，王者荣耀"。她是什么粉丝都要的。我又不想做马云，你说的那些怎么像全网第一，替我办事？我只想知道，怎么开好一个小店，月入两万不是梦。那你就听听我这个倒插门是怎么玩的？


    +   一，去他妈的全网通

    做自媒体，绝对不要想什么"全网第一，三年暴富"你只要有十万分之一的人喜欢，你就是全网 top3。


    +   二，坚持自己的观点

    首先把骂你的全部拉黑。你的观点，无论多么与众不同，但只要是九年制义务教育体系出来的中文作家，只要是合法的，至少有百分之一的人会认同。这就是你的基本盘。

    你把基本盘里的百分之一拉过来，你就是成功者。


    +   三，我的目标就是月入两万

    你别给我扯什么大数据，老子不感兴趣。我就想做几个小广告，赚点生活费。月入两万，意思是每天六七十元。现在一个中 V 的广告，差不多是八百元。再搞点付费问答，头条新闻，微信咨询。每天小酒喝喝，心里美滋滋。


    红精来了。～大哥，你说的真好，但怎么开干呢？月入两万，怎么花已经想好了，就缺干手了。

    ～靠，你就是个250，月入两万需要个鸟才华啊？你老老实实，先赚一年砖头，这叫开拓市场，寻找基本盘。


    +   一，选个方向

    咪蒙选了个女性情感类，类似于不加 V。你不要走这个路线。这已经是灿烂的烧了。你选个结合自身专业的话题。


    ～老师，我是农民，家里三亩地，种辣椒，你给选个题？"

    ～"你是来骚扰我的吗？"


    其实，各行各业都有感兴趣的人。京沪有很多白领是农民子弟出身，对现在的农村很感兴趣。你就帮帮他们。你这个初中文化，浅太深了，恐怕不行，萨缪尔森，货币中性论就算了。本色出演，天天拿个手机，家长里短，走亲访友，老家长化，四季转换，辣椒的育种到收割，销售，酸甜苦辣，你一道来。保证是爆款。其他的，以此类推。


    +   二，语言朴实

    你看我，倒插门的失业人员；也可以玩互联网，你怕什么？怎么想的，就怎么写，怎么说！不要怕人笑话。穷穷到赚点小钱，合理合法。


