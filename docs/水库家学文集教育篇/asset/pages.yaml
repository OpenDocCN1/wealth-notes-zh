  md: '职高不是普通高中，理论上有考本科的可能性。但实际上，职校生考大学，限制非常多，课程设置也不是为了考大死的，根本没有竞争力。


    如果初升高这个死结不打开，那就是青少年的内捣战。大家一起考复旦附中。只要孩子愿意读，我全家砸钱，请六个家教，非把你挤下去。


    如果高中扩招，或者成立一些民办特色高中，富人家孩子发展艺术体音语言金融法律方向，以后个个自费三本学院，例如什么同济大学生浙江分校。普通人家孩子努力考清华附体系，复旦外语系，上海理化生体系，互不干扰，岂不很好？


    但现在做不到啊。高中直接卡掉一半。你让我孩子去和读书差的孩子一起玩权校，那我真不愿意。倒是钱说，职校的学习风气确实不如普通高中。我也想学好啊，那就大家砸钱吧。


    四，课程设置多元化是市场经济的需求


    大学都扩招了，为什么高中不扩招？你让十五六岁的孩子，自费读个民办高中，不卡比例，又碍谁的事了？王总家孩子不喜欢刷题，不和你竞争清华，读个高中，考个三本全日制本科就行不行？


    五，建议


    高中招生，不卡比例，愿意读就可以。适当发展特色高中，多元化培养人才。


    # 中学课程是有科学意义的


    只不过，学校老师把好经念歪了，把科学变成了刷题，便查了很多收费 app。


    把化学知识变成生活和做菜的小秘密，你马上就是专家了。物理也这样。


    # 请教京沪985在校生或刚毕业


    现在学校里，有没有那种针对在位学生的培训班，收费不高的，面向学生的。例如，政律，书法，跆拳道，插花之类的？谢谢。我有个亲戚家孩子说，学校里很无聊，想搞点业余爱好，但不知道怎么入手？我本来想推卷板棋，但不知道现在还有没有了？


    # 人丑就要多读书？这不是胡扯吗！


    人丑就该多健身，多打扮，缺啥补啥。读书的目的是，看懂世界，顺势而为。一本书接着一本书的读下去，那是乡文化站的看门老头。绝大部分人的父母不能教给孩子什么立身处世的知识，孩子成年后，完全不懂社会的运行规则，自以为甚，头破血流。这时候，年轻人确实需要读几本书，聆听智者的思路，揣摩大师的想法。


    读书是进步的阶梯，但不是让你和高尔基，萨缪尔森这些老家伙硬冲一生。上了楼，老椅子就没用了。你要寻找新的阶梯。在更高层面上，往往没有什么现成的经典书籍。大家都是聪明人，你读过的，我也读过，没什么稀奇的。


    钥匙都是特殊的。人生阅历，读懂人性，个别经验，才是打开财富大门的钥匙。在高一级的层面上，没有什么普世好办法。不要以为“读了论语”就可以当官，“背了盐铁论”就可以发财，没这么简单。读书适可而止就行了，要用读书形成的经济学思维，去积极探索财富世界的奥秘，顺势而为，形成自己的打法。


    普通人往往会陷入两个铁锅。


    一是自以为是。一天到晚嘴炮党，论证这个事情有风险，那个事情指不发财。啥也不敢做，一天到晚，骂别人是贪官奸商。'
