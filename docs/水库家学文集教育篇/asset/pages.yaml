  md: '+   2，好事赶上了八九成，特别是涉及今后晋级调款的好事全赶上了，大有前途。


    +   3，赶上一半的好事，部门副职是你职业生涯的最后归宿。其他的，不要痴心妄想了。


    # 研究生怎么进券商投行基金类部门？


    菜菜你好，本人是普通一本大四女生，今年考上了浙大经济学研究生，然后现如今在备考证监会三门，想在两年内拿下证监会专业阶段的证书～请教下您，在研究生阶段还需做什么准备才能进去券商投行基金类的部门？谢谢！


    投行的工作分为两种，一种是拉单子，一种是做后台。拉单子的收入比较高，但是风险也大，如果是，做后台，那么你的证书越多越好，去考一个律师证书，证券从业资格书证。


    # 耶鲁剑桥等理工科硕士博士毕业


    回京沪工作，年收入大概多少？


    答：如果去高校当老师，单位大概是12万左石，业余时间搞点副业，合计25-30万。搞副业的关键是，会做人，其他不重要。买房，就别想了。


    如果有顶级技术，去bat华为吧，年薪几百万也是可能的，但概率是风毛麟角。


    # 怎么在小私企当笔杆子？


    你按照我下面这个套路去写，每个小点后画，举几个例子，保证是一篇80分以上的材料。


    +   一，高度重视，靠前指挥。摘录引用当前的一些时髦的话，一把手的要求。


