    中共中央办公厅、国务院办公厅：全面取消城区常住人口300万以下城市落户限制，全面放宽城区常住人口300万至500万的大城市落户条件。#落户##大城市全面放开放宽落户#


    全世界，城区高于五百万人口的城市，寥寥无几！你懂的。


