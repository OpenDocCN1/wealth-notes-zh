  md: '发稿。几千元，套出大高。媒体满产。有些小医立壁马跳起来了，你贴发票出来？


    贴你啊？你去医院财务科，看看就知道成了。我曾经在外地自费看个咳嗽，拍片子两次，门口神秘小药店收药，一千多。我第一次痛风，也是在外地，其实痛风没什么治疗办法的，医院给开了一大堆中成药，六百多出门。药品全亏了，忍了几天，好了。


    很多医生家属骂我挡了财路。我也知道写这种事情，不利于自媒体，但我也认了。希望我们的未来更美好。


    # 京沪户口难不难？


    +   1，靠学历和工作能力，拿到上海户口的居住证，每年一万人左右（网上有公示）。全国大概有两个千多个区县，相当于是全省前五名的水平。北京类似。


    +   2，少量高层次人才，直接给户口，这个罕见，你别考虑了。


    +   3，婚后十年落户，很多很多，大街小巷，每个楼都好几户外地媳妇。


    # 广州杭州等强省会户口，能办还是考虑办？


    我现在担心的是，这几个地方的户籍大门，不会永远这么容易。理由：


    一，就业


    西安一年多，落户了120万人口。除了原来就在西安上班的，随迁子女，我估计30-40万新增壮年是有利，主要是大学生。入户口容易了，但较高质量的就业，可能竞争更加激烈了。


    二，入学


    新增人口的入学入托问题，在三五年后会集中出现，相对集中在部分区域，供需矛盾是比较大的。


    三，交通


    大城市的合区城市是不会快速扩大的，人口越来越集的结果是，交通越来越堵塞。到达一定上限后，人口过于密集，并不是优势，反而降低了发展效率。


    四，区域协调发展


    如果省会城市依靠行政资源丰富的优势，持续吸引青年人口，会导致地县市的青年大学生越来越少，缺乏劳动力，楼市萧条，地方财政是难以承受的。


    我倾向于认为，在省城城市人口到达一定上限后，是会收紧的，然后把人口引导到优质地级市。


    # 户籍制度和票证供应的利弊


    五十年代推行的户籍制度和凭票供应，不是什么突发奇想，而是有深刻的实际意义。那时候，经济刚刚平复，物资短缺，首先要保持大家日子过得下去。先计算一下，总需求是多少，然后按照总需求，组织物资供应，每个人五十斤大米，三斤布，半斤油，十个鸡蛋，一棍肉，十五包香烟，然后以此下达生产计划。不够的，我们出口优质农产品，在国际上换一点紧俏物资


    物资有了，如何运输？先要解释建的地方有多少人？这就需要严格的户籍统计，确保不发生过短缺。与此同时，人不能乱跑，物资发放到河南，你跑到广东打工了，那就乱了。所以，出差旅馆，必须要有介绍信。


    户籍制度的起源，实际上是保障最基本生活。但这个办法实在是太简单和太好使了，不管什么事件，只要拿户籍表算一下，就可以确定总需求，于是各种各样的公共服务，就全部按户口发放


