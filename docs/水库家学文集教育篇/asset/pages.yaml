- pgno: 199
  md: '千万不要出什么王炸，"我和某大人物也认识"之 类的。如果你这样搞，暂时没人找你麻烦 了。但是，更大的麻烦就来了。单位这次向县里争取 xx 优惠，听说你方面方面都熟
    悉，这事你也参与一下！你能怎么办？自讨苦吃。


    # 有关系不能自己说出来


    领导（部门经理）是怎么看待下属的？


    任何一个领导，都把手下那几个人，视为自己的绝对管辖范围，不容侵犯。他的潜意 识认为，手下人就应该 是听我的，服我管。我骂你，你也只能忍着，我也不是无缘无故骂
    你。这是大部分领导的正常思维。


    如果下属不服，拐弯抹角的暗示你：老子有后台，比你厉害多了，你少 bb。这个领 导顿时会颜面扫地，他暂时不敢得罪你了，甚至会客气几句。但心里恨上你了。领导就觉
    得：你不是我的下属。我 也不管你了。咱们合作吧。嗯，先试探一下。


    小李啊，最近大家反映你的工作表现很好，我也很高兴。我丈母娘病了，希望到市人民 医院找李教授开刀，顺便办个住院手续。你上次说，你二叔是大人物，要不，你给老哥帮个
    忙？


    皮球踢过来了。你要是真有本事摆平，人家对你肯定是客气三分，你是合作伙伴了，一 切好说。如果你搞不定，找了个巧妙理由推回去。没关系，还有第二次，第三次。


    如果你每一次都办不成，你倒霉了。人事部部门来要求征意见，他肯定把你票成煤球。你不 有关系吗？你自己去解决吧。你在我这里，一不服管，二不帮忙，早就看不顺眼了。


    在大部分单位，不要借口开河，要尊重直接领导。真有关系，也不能自己说 出来。最好让部门经理自己打听出来。这个时候，人家觉得你，懂礼貌，有涵养，今后给你 个顺水人情。


    # 我太保守了，现在各种后悔


    我研究生室友萌萌的，她妹妹，妈妈都出来来北京 了，周围同学东北的不管男生女生，能留京的，不管一 切都要留京发展，户口房子什么都不考虑。我就太保守 了，毕业回济南了，这几年感觉各种后悔


    # 楼市经济，两极分化，大学生往哪里去？


    鹤岗拆迁房还不如装修费用，呼吁直接给大学生优惠 半价房。与此同时，京沪广深还在毫不动 摇的实践中最严重的限购限贷，社保 5 年，上海外 地人还要已婚。楼市已经两极分化了。每年
    800万大学生，毕业后该往哪里去？


    我建议要综合考虑，事业发展机会多，买房首付可 承受，安居乐业奔前途。


    +   一、京沪深，高不可攀


    如果你答不是南京的三羊老总，我劝小伙子暂时别来 了，来了也是受气，你好好努力，搞个副高再来。


    +   二、广杭宁苏厦，一骑绝尘


    3-5 万的市区单价，让人瑟瑟发 抖。家里只有 60 万存款的一般家庭，已经是难 以企及了。


    +   三、老家地级市，经济发展慢


    大部分地级市，没有什么特色产业，高薪岗位极 少，体制内最好。在体制外，外地年轻人很难 发展，马路上开店是富忧参半，不太适合大学生把婚房首付款投进去。'
