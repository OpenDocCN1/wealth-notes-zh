    # 孩子们为什么不想读书了？


    中国人对教育的迷恋，已经像是 DNA 一样，植入内心了。现在居然出现了很多孩子们不想读书，家长也不去操揍一顿的情况。其实，原因很简单。


    我们教育，完全是脱离生产生活实际，完全是为了选拔极少数博士硕士，而捆绑了绝大多数普通孩子。现在的高中 生，五高分，根本叫不出花果树的名字，不知道保险丝怎么换，不知道怎么办鸡蛋，只会一件事情，一推一把鼻子上小眼镜，继续刷题怪愿。


    很多贫困国家的孩子知道，自己能力有限，也当不了工程师了。既然学的东西没用，老师也教不出花样，那就算了。


