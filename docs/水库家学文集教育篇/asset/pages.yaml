    # 群众还是知道冷暖


    SmartBody：还真是！昨天给一个小学生补课，说他以后没学历还有两房套，最少还能娶个老婆！小学说房价还要涨！他说他们班最有钱的人有8套房！


    房价要涨！


    # 老王八念经，不听不听


    世界上学习经验的最好办法就是，自己吃了大亏，刻苦铭心，但是，一个人谁不吃亏呢，获得经验，他的人生也是悲剧了。等他醒悟了，也三四十岁了，没有机会了。


    家长希望孩子不要或少吃苦，就喜欢不停地教育孩子，不停的说，实际上毫无效果。孩子们烦死了。家长们气急败坏，但也无可奈何。


    家长们要因势利导、注意教育方法。具体的事情，你自己琢磨，但是道理是这个道理。对待成年人，对待孩子，都是一样的。千万不要以为，你说过了就可以了。要创造机会，侧面教育。


    # 可喜可贺


    北大研究生去当二三线城市中学老师。


    一方面让农村学子看清糙了文凭的实际价值，另一方面对海淀家长也是一记闷棍。考大学改变命运，也就这样了。那个文科学校，一向喜欢赶时髦，这次厉害了。北大研究生再怎么样。


    至少有个特点是肯定的，考试水平肯定不错。考研也是个高考，能够千军万马杀出来也不容易。把考试技巧代代传下去，也是喜莫大焉。好多孩子，天资聪明，就是考试不行。实际上，考试是有技巧的，就是在时间上碾压同龄人。不用担心老师出题你不会做。


    我不会，你也不会，无所谓。真正的区别是，我会，你不会，或者做错了。这个要命了。高考差一分就是差几百人，点点滴滴不容失误。


    我的考试经验就是，学海无涯苦作舟，拼命刷题，把视力刷到0.2，每天躺六个小时，基本就可以了。再躺下去，生活受影响。三年刚下来，你先死我死，就要有这个横下一条心的决心和勇攀高峰的勇气，我们就可以逆滚内环线老破小了。


