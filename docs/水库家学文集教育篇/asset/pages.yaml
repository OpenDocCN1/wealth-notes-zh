    单位里的老油条，是放软拍硬的典型。如果你是上面看好的人，他们会比较热情；也不会耽误你事情。要不怎么叫老油条？如果你是强出头，那你倒霉了。我们老油条也是嫉妒到极点，但不敢跳。你凭什么跳？打击你。哼，一门心思想往上爬，我早就看你不安全了，小小年纪，就想攀高枝。


