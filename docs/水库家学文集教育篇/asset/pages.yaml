    # 我预感


    除了京沪，其他地方的户口，很快就没什么用了。大家谈谈。


    # 放开户籍的原因


    以前的大城市，北京上海，省会城市，对户口的控制非常严格。因为大城市每增加一个户口，相应的会涉及到，医疗，教育，治安，和公共福利等一系列成本问题，所以，北京上海生二胎要进行十万或几十万的罚款，就是防止大城市人口无序增长。


    最近，几个省会城市，几乎是没什么门槛的一下子招了几十万人，几十万人外地产，难道财政就不担心，新增人口会增加城市财政的负担吗？增加财政支是肯定的，这几十万人的子女，马上会涉及到幼儿园小学卫生防疫等一系列问题，二三十年后又会涉及到这些人的养老金支出。由谁来买单呢？


    你懂，我也懂，这就是，放开户籍的原因。'
