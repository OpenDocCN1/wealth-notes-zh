  md: '不要把难得一见的二十件大变化，当做常志。人类文明最主要是稳定有序，循序渐进，而不是天天搞大规模道套。你想造秦谁？不要以为给你三分颜色，你就敢朝思乱想乱了。陆家嘴八百平米的豪宅你也敢点开来看了，你是不是也也膨胀了？


