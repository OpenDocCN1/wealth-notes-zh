  md: '就是说中学教育吧。出国是不便宜的。绝大部分已婚妇女，不可能在三十几岁就和高收入的老公长期分居，就为了孩子去加拿大读小学。这个你的面。好吧，留在本地读小学。那么，唯一合法的教育局盖章的那些学校了。作家不满意的就是这些学校了。


    这些学校的特点是，收费低，质量不高，下午三点放学，家长没法接孩子。作为补充， 还有少量一年期五万元学费（一年两个学期）的土豪学校。就是没有大量的中间状态的学校，例如一学期八千元，老师很负责，家长负担得起的那种。


    为什么会出现如此情况？因为土地。中小学最基本的，要有一个操场，中小学操场是没有效益的，所以国家是免费划拨。这就彻底卡住了想在中区办学的民校。除非你有办法搞到市中心免费的十亩地。为什么有的民办小学可以搞到土地，我也是小学高级教师，我为什么搞不到市中心十亩地？


    你问我，我问谁啊？


    # 现在的中学竞争已经彻底白刃战了


    倒不是学校要这么做，而是家长牛b。现在的很多家长基本都是大学生，知道如何考试。大部分家长也都通了，给不了丰厚嫁妆和京师婚房，那就给孩子一个985文凭，言传身教，接之以棍，很多家长为了培养孩子，自己又把中学12年的功课重新读了一遍。农村孩子基本出局了。


    # 为什么初二 是 人生转折点？


    很多女孩，考试成绩在初二突然就下来了。男生出现两极分化，一些人在初二开始学会混社会了，一些男生成绩突飞猛进。长期以往，很多人一直把这个情况解释为青春期叛逆，脑子开窍了，女生生病傻了等可笑的原因，我结合自己的体会，说一下原因，请各位家长提前警惕。


    中小学教育分为两个阶段，一个是反复练习阶段，一个是逻辑思维阶段。转折点就是初一下学期，初二上学期。


    小学到初一，基本属于反复练习阶段，女生比较听话细心，成绩相对较好，男生比较粗，但也能捣鼓得。


    初二开始，数学科目一下子转为逻辑思维训练了，特别是几何概念，需要空间想象力，非常抽象。与此同时，化学和物理课程也来了，完全是理工科思维。这时候，很多学生是完全不适应了。女生这时候又面临例假，男生青春期发育，读书很困了，男孩女孩很刺激，一些学生熬了一学期，后面就派不上了。


    理工科讲究的是连续性，不是一下子可以补全的。一转眼到了初三，面临中考的人生大选择。成绩不好的学生，思想压力很大，叛逆行为就出现了。


    建议：利用初一暑假的两个月时间，找家教提前学习初二数理化学，让孩子适应这种思维转化。开学后，这种孩子领先于同班同学，自信心大涨，有利于自我深化。


    # 读书有什么用？


    答：读书非常有用，特别是养成正确的三观。


    读书的目的是摆脱对金钱的欲望，所以，读书对于买房，基本没用。'
