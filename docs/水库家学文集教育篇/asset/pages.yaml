  md: '# 我从来不相信快乐教育


    人生三大苦：读书炼脂磨豆腐。读书的目的就是淘汰别人，抢占资源。985就那几个学校，你有我无，则刀见红。


    快乐教育是骗章子的。高考快乐吗？你舍得取消吗？外地小孩子读书快乐吗？不快乐。


    小孩子要想读书好就一个办法，提前教育（俗称预习），事后家教（俗称复习），天天刷题到深夜（俗称勤奋）。哪一个不是你们搞的花样？我是应试教育的过来人，你好意思昧着良心说假话？


    # 这几句我几十年前的高考警句


    至今记忆犹新，历历在目，刻到骨子里了。我在高考前，就把一本成语字典，一本英汉字典背完了。


    > > 不经一番寒彻骨，怎得梅花扑鼻香。

    > 宝剑锋从磨砺出，梅花香自苦寒来。

    > 衣带渐宽终不悔。为伊消得人憔悴。


    # 高三达到什么水平可以考985？


    数理化掌完大三上学期的专业课。语文，背完一本成语字典，例如碧血丹心照汗青，碧是什么意思？英语，背完一本厚一点的英汉字典。


    这是九十年代的标准，不知道现在怎么样了？

    有没有高中老师说一句？


    # 德国职业教育体系


    非常收到家长欢迎，社会认可。为什么？包分配。因为学生实习阶段就是为了每个企业量身打造的预备员工。学生们也习惯工作环境了，直接入职，顺理成章。我们这里不可能。因为90%的新增就业在民企，民企是为逼，没人感兴趣，我们就想去银行！


    # 要参加老师开的学前班吗？


    答：我小孩子的做法是每个班都交钱，但基本不去上课。这是和老师搞好关系。


    # 问问大家


    我说了几个孩子提前预习，提前教育，父母陪读，你们几个人开始做了？


    # 中小学，分数就是天


    三十年前就这样了。现在还是这样。因为高考还是那个样子。所以，任何影响分数的事情，一律不看不关心。一门心思刷分数。


    有关部门不愿意放弃高考，其他都是浮云。如果二本大学免试入学，每学期考试，及格就毕业，一切都解决了。但是，有关部门不会这样做的。因为他们没什么可以管理的了。我要管理你！'
