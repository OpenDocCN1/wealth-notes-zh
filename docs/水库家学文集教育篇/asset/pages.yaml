  md: '# 隐秘需求的市场巨大


    不加 V 的商业模式，是典型的隐秘需求解决方案。


    商业消费分为明显需求（衣食住行）和秘密需求（不见光的，愿意花大钱的）。我以前对隐秘需求不熟悉，自从写了微博，我发现，这种需求是非常巨大的。


    隐秘需求，最典型的是和性话题有关。实际上，供需双方都是巨大的，只不过没有渠道。但是除了这种需求，还有很多情感类需求，例如如何斗小三，如何控制老公的钱，如何给离婚抢房子埋下伏笔，如何化解各种内心痛苦。这种需求不是什么心里治疗亚生可以解决的，而是需要值得信赖的老江湖能提供。


    不加 V，就是提供了这种商业模式，非常成功。我相信，不加 V 的收入是非常高的。我从来不做情感咨询的人，都可以接到不少这类咨询，如果换成专业搜单的，全国各地的非正常需求是非常非常大的。而这种商业模式的定价权在于提供者，所以，这种需求，非常值得研究。


    ![](img/706099d9806841701e3c0667964882bb_319_0.png)


