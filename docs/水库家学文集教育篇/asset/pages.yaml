  md: "大规模的建设（上新设备），需要大量的大学生。于是，很多外地农村的大学生就进去了，十年后，我们这一批大学生，还在市区里拼死拼活，他们已经是车间主任了。小日子好过啊！我的那些没有踢出来的初中同学告诉我，”现在可受气了，我们正宗的上海弟子，居然被一群外地乡下大学生管着。”\n\
    \n现在，很多中西部县城，也面临一模一样的情况。县中的夹子全都老尸广深了，在出租房里，度日如年。而附近更贫困地区的二本，大量考进本县的正式编制，开始幸福了。上班很近，房子也大，老婆也是免费装的，还倒贴县城房子。走到各镇各村，到处都有熟人，晚上啤酒烧烤，周末打打牌，装神仙啊！心里好想回去啊。\n\
    \n我劝你不要这样想。向上的路，都是难走的。那些去小县城的二本，装逼滴滴，但工资也低，就算业余捣点那个啥，也不是人人有机会的，完全跟不上大城市的涨幅，他们下一代很难走出来了。我父母大厂里的某些二本，现在过得也不怎么样。房子是单位分的，投资晚了十年（以前完全没有意识啊），还是郊区房，现在和我们的差距，越来越大。\n\
    \n# 当律师难啊\n\n（投稿）现在考出资格证，要想当律师也很难。\n\n当律师，首先要找个所蓄记，这个所就要给你交社保1900元，发工资3000元，配有公条件，15~20个月做完实习生涯。成本也是十几万了。不给就是违反劳动法了。现在都是独立核算，人家凭什么要发钱给你？\n\
    \n+   - 一，你提供全天候997劳动\n    加班加点干，至少产出每月一万块钱的价值，人家才算勉强接受。问题是，\n- 1，你是小白啊，啥也不懂，连最新的行业文件也不知道，工作质量可能很差，也没经验，有时候倒帮忙。你干完了，人家还要帮你检查一遍，不如直接自己干了。\n\
    - 2，说这么多事情给你干。大家的业务都不太饱和，不想花钱请你。\n\n+   - 二，接长拉单干\n    你到张叔叔的公司，王阿姨的单位，去合法拉点单子，也不多，一年拉来三十万的顾问费，基本差不多了。拉不到，你来干什么？\n\
    \n+   - 三，你家有什么资源\n    不管什么，你说来听听？你爸妈干什么的？你二叔干啥的？那个单位你熟悉吗？能不能把那个单位的老王请出来？做不到？那你会做什么？\n\
    \n+   - 四，好不容易上岗了\n    自己走在街上，看谁都像要离婚的！能不能请我当代理？便宜！\n\n# 打破职场困境\n\n最好的办法是，不计后果的搅局。局面乱了，机会就会释放出来，各种人就重新排队了。输光了也没关系，你都混成这样了，还怕什么？\n\
    \n# 职场就是江湖\n\n职场学问深，世世代代都有很多经验教训的。但是，往往最后失传了。\n\n一，你混好了"
