    # 古代为什么吹捧读书？


    因为，古代读书是可以升官发财的。以前，一个县每三年可以出 50 个秀才，相当于县一中的。


    湖北省，你现在都啥玩意啊！


    # 我们当年是怎么读书的？


    九十年代的上海普通高中，一个年级考上大专以上的大概二十几个，考上 985 的大概两三个，


    光头中学比比皆是（零录取）。然后，我们那一批 985 就全部逆袭了。


    现在的二本？？都是以前的技校，职高。


