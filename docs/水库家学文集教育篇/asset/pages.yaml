    家已经提前教育了，幼儿园已经学会两年级的题目了，随便掂。老师就把我家孩子作为典型，你看


    菜菜家的小宝宝，一学就会，你家孩子怎么学不会？不是我教的不好，是你家孩子脑子不好。


    # 孩子会不会被穿小鞋？


    菜菜，我在小学班级里和老师争论了两句，以后孩子会不会被穿小鞋？


    换位思考，肯定会。个人永远不要和老师医生争论。他们这些人自以为是膨胀了。垄断分


    营，你没办法的。


    # 小学教育的逻辑


    老师不管你投没学会。老师只管进度。老师讲一次就认为我教过了，也默认为你家孩子都学


    会了。如果你家孩子没学会，那就是你儿子脑子不好，多动症儿童。


    实际上，一节课，大部分孩子是无法当场学会的，之后就是家长补课，好孩子就是自习刷题看


    辅导书，课后刹刀见红了。


    大部分家长很懒惰，不愿意教孩子，有的劣质家长自己也不会。为了求个心里安慰，就把孩子


    扔给补习班。'
