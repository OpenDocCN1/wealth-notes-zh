    # # 杜月笙为什么受到很多人追捧？


    杜月笙不是简单的黑社会，抢劫贩毒啦，而是长三角城市圈需要这么一个最高纠纷调解人。


    旧上海，势力分割，乱七八糟，各国各派，交叉管辖。法租界是大法国系，英租界是英国法系，虹口邨场是第三大法派，城廌厢是大书法系，唐社会是拳头法系，老百姓是美国法系。两个人沿着外滩打一圆圈，涉及到十个法律体系。正统途径是裁判费力，谁也玩不下去了。


    怎么办呢？妥协的结果是，找个实力派作为华人圈的仲裁员，这个仲裁员必须是心里摆讲道理。举个例子，一群小混混去看电影，霸骤了几只麻雀，涨满酬了，电影开始后，把麻雀放出去撞砸了大玻璃。这事情按照法律，没法处理的，至少证据不足。怎么办呢？一个电影院，投资几十万大洋，就这么关门了？那不行！


    杜月笙来了就可以解决。你们几个小混混，以前未缴过，对戏？算了。现在给你们一个任务，守住这个电影院，再有事就砍你的手。也不让你们白干，我寄一百大洋差不多，你们拿好，算是劳务费。'
