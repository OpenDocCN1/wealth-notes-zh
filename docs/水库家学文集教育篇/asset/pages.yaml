    # 快开学了，请孩子们好好读书


    女人有个985文凭，是很好的嫁妆，至少以后可以辅导孩子考试。男人有个985文凭，则敲门就轻松了。现代社会，没几个人工作后会从大学专业。在京都这种消费城市，理工科的用武之地变小了，大量需要的是经济医疗教育建筑。但是，文凭依然有用，至少表明智商还可以。


