  md: '当然，我这么做，也是自毁前途，这种性格，谁见谁怕，以后没人敢用你的。所以，我就是私下和××那顶顶，没和任何人说。人事部也怕了，他也有竞争对手啊。老子混了几十年，好不容易熬到这个位子，被你一个250耽误几年，实在是太亏了。这时候，大家就比激动了。我要是闹开了，我也完了。他是怕你闹开了，他升不上去了。最后，我惨胜。


    # 绝大部分 985


    最后卡在中层副职，也就结束了。


    这么多年过去了，我们那一批，基本上也就卡在中层正副职，再也没办法突破了。冒出来当到系统大头头的，1%左右，单位副职的，5%左右。


    举个例子，小日子其实也不错。每年会进来几个徒弟，用崇拜的目光看着你。小亲戚也会使劲巴结你，早上给你泡茶，中午给你打饭，陪你说话。一天到晚使劲的等你，因为她们很难直达上面，只能寄希望你了。毕竟，你手里也有几个推荐名额，含金量很高。升一级不行，去欧美培训半年，还是争取一下的，以前还配车，现在不稀奇了。


    于话，说最包装，年底考核不好看，也没面子。说不要，也不要，具体事情都有人干，你只要说说话就行了。干了这么多年了，应付考核那点小技巧，也是有心得的。


    出去也有面子。这个长，那个总，大家都叫的好听。我也舒服。家里有点事情，也好办，方方面总有几个熟人，居民类事务，一般都不违反原则，说说也就过去了。


    但是，内心隐隐的痛，时时刻刻折磨着自己。王大头头上长，菜老板赚大了钱，张匠时捅了好几个漂亮女朋友，真是肤白条顺好使啊。再看看自己，一辈子老实卖菜，啥好事也没轮上，心里真是郁闷大了。


    还能怎么办呢？要大钱没有，过线的事情不敢，孩子还小，老婆睁的晚上呼噜响，吹的都是大屁珠。大母鸡还等着我养老，我是一辈子老小干就完了，最后啥也不敢干，嗯，嗯。还有十几年就到站了。退了体，要好好做一次男人。我底，就你这个一辈子瓜娃子的样，也只有去广场舞得个大妈了。


    # “菜总，你怎么又来了？”


    我曾经去河南某县招商。连续去了三年，小老板根本不屑见我。我每次去，都是大包小包带着样品。那个小庄老板，据说每年净利润大几十万，在县城最好的市道，傲气的不得了。店里的小妹也挤兑我，“菜总，怎么又来了？”那一刻，我简直无地自容。


    但我也没办法，为了打开缺口，只能是一次一次去。最后小老板终于同意，稍微做一下，试试着。后来，我的滑板车卖开了，小庄老板也就成为加盟店。年初，腰酬要和盟店聚一聚，那个小庄老板带着当年挤兑我的小三也来了。小妹最后说，“菜总，没想到你们厂的规模这么大，这次算是开眼界了。”


    成功是无声的草履默默出来的。起步阶段，不管自己是不是985，放下身段，接地气。


