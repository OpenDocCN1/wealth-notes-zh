    辽宁人大调研发现：孩子补课费用成普通家庭最大支出


    ![](img/706099d9806841701e3c0667964882bb_113_0.png)


    人民日报客户图8月5日消息，9月8日，记者从辽宁省人大跟踪报告获悉信息。辽宁省人大开展的一项针对中小学教师负担的跟踪调研发现，繁重的补课费用，成为辽宁普通有孩家庭的巨大支出。"补课"已经形成了一种社会风气，极少数不补课者孩子反而成了异类。


    # 清北复读，真有用吗？


    答：若不是搞科研，我认为大多数没用。理由：


    +   1. 人数少，影响力低。清北复读，分散到各个专业，每年不过几十个人，一大半出国改行，真正进入专业工作的人，微乎其微。当然，也有例外，据说五道口的那经类还可以。但是，其他专业，我并不觉得有什么压倒性优势。


    +   2. 进单位后，同龄人防着你。你自带光环，大家抬你怕风头，自觉围堵你。领导对你有不切实际的高期待，往往导致你不堪重负。


    +   3. 清北复读最实用的领域，应该是倒插门。


    +   4. 真正要媳妇，还是看经济条件的，你就算有个985硕士，没房子，京沪也吃不亏的，反而是读书读傻了的反面教材。


    建议：跳开面子，最实际的选择应该是人数多，知名度的专业院校。


    例如，上财西财央财，西政华政中政，北航南航，北邮南邮，华东化工北清化工，各石油大学。或者按照专业分类，例如吉大汽车，西交汽车，同济汽车。码农是华中等。


    这些学校本身也是好学校，这么多年，系统内到处都是，长年累月，形成了一定的知名度，大家普遍印象好。'
