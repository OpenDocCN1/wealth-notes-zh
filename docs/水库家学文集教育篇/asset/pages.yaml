  md: '我仔细看过河北那个打鸡血中学，一个操场站满了学生，看上去几乎都戴小眼镜，考上985还行。如果就搞个二本高职，那就倒退了，这个学历，完全是供大于求。今后，农二代转行去干艰苦工作都难。夏天一头汗，眼镜就模糊了，维修工地是不能去了，一打冲击钻，眼镜上全是灰。


