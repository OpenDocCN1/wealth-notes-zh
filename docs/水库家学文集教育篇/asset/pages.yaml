  md: '馑。成功人士主要是，体力劳动者，高精尖科研人员，资本拥有者。这些人接受了市场经济的残酷考验，获得了成功，找到了自己的定位。


    而那些坐在办公室里算账的250，一过35岁，就是辣鸡龄了。你会什么？打工没力气，拉单子没关系，做生意没本钱，长得还丑。


    不要说什么笑贫不笑娼。你绝对放心，你做不了娼的。没那本钱的，谁理你啊！


    # 不要天天在网上吹水了


    我真心实意的和大家说一下，手工业人，例如医生，装修工，补课老师，真的很赚钱，很赚钱。拉单子比干活赚钱，干活的比卖材料赚钱，卖材料的比生产的赚钱。你自己不要天天在网上吹水了，认认真真去干个什么。


    # 大部分企业很不喜欢二本子


    正常企业，最喜欢的是技校生，高中生，高职勉强接受。一个企业99%的岗位，只要小学文化就行了，认字，加减乘除，写个简单的留言，填就行了。最重要的是，你能够忍受重复劳动，不抱怨，不偷懒要嘴。学历低一点，相对就踏实一点。


    高精尖的手机厂喜欢的人才走，中西部的985，真有没有技术，也聪明，只要给钱，发了疯的干，二本子是不够的。干不下来的。既不够聪明，也不肯干，就是天天想好事，如果你放下身段，深人基层一线，向田间地头，车间工厂的老师傅学习，你还是有钱大佬优势的。但是，二本子的本性就是好吃懒做，怕苦怕累，就想做集团公司战略副总裁。其实，也没什么的。30岁之前，社会还是会给你机会的。但是，超过35岁了，你就是老油条了。人见人烦。


    # 二本子，为什么招人烦？


    因为二本子有个吃错药的想法，要有发展前景。我实在不知道，二本子还有什么发展余地？往上，比不了985，往下，比不了装修队。我不知道你的前途在哪里。


    +   1. 二本子不愿意吃苦。任何苦活，干不了三个月是期就要辞职了。反正老家里县城住三室两厅，老干也是中产。


    +   2. 二本子不愿意重复劳动。总觉得没有前途，浪费生命。


    +   3. 二本子没有技术。本来可以学，但他不愿意学技术。车钳刨，一样也不会。制图做样，嫌累，逛市场，脸皮厚，怕丢人。下基层，怕苦怕累怕脏。


    +   4. 二本子不聪明。骂你生意不清，你学个一两年也可以啊！但是，二本子就是学不会。考个cpa，佛师证，绝大部分不行。


    +   5. 为什么世界上有二本子这个品种呢？扩招的恶果。


    # 我从小很勤奋的


    为什么现在变成了又穷又懒的二本子？路径依赖。


    很多人，从小到大读书很努力，很拼命。可为什么工作了几年后，直接沦落成了啥也不想的懒汉？因为你觉得现在干的一切，毫无意义。


    你有没有发现，你和相当多的大学生，走上了一个相同的路径依赖：读书，求职，心灰意冷，成为老油条。大学瞎混了四年，读不读书，一样就业毕业，也就不想好好读了。大四实习也是随便混


