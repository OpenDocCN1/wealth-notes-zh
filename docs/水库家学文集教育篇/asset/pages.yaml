  md: '一定的挑战期和调整期，最大的受害者，不是钻营钻的农民工，而是二本青年。这些人，文凭不能考研读博，我不能论坛陪陪，甚至连打个都智力不从心。我真的不知道，他们将怎么办？


    这些二本青年，现在能溜混，是因为整体经济比较好，很多公司多找两个业务员，接接电话，跑个腿。一旦调到调整期，他们直接over了。


    但是，我们的教育制度正在批量制造这些二本青年，给他们一个不值钱的文凭，让他们产生太多的幻想了。霸道总裁爱上我。爱你啊个头脑！一那带你那亮闪闪的钛合金穷嘴，上工地也没人爱。


    # 有一半的孩子，没有参加高考


    中国每一个年级的孩子大概是 1500-2000 万。但只有一半的孩子报名参加高考。没高考的是哪些人？主要是底层青年，特别是农村乡镇的孩子。这些底层孩子的生活坏境，纷繁复杂，很难有个良好的环境，能够让他连续十二年反复刷题。明知道考不上
    985，二本也没用，索性不读了。


