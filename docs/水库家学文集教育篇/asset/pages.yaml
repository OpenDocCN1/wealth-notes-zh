    # 谴责针对未成年人的任何违法行为


    首先学习劳动合同法：连续订立二次固定期限劳动合同且劳动者没有本法第三十九条规定的情形续订劳动合同的，必须签订无固定期限劳动合同。


    这个外地老师傅，49岁，如果再续签劳动合同，只要他不出大错，按劳动法，不能辞退了。这个老师傅最大的愿望大概是，在北京工作满十五年，在北京退休，争取享受北京退休待遇。


    +   1. 劳务公司不想背这个包袱，所以不续签了。至于学校说什么其他安排，我只能说呵呵了。不管大家信不信，至少那个老师傅心如杜鹃。

    2. 学校也有苦衷。马上五十多岁的老记了，又是维修工，万一换个灯泡摔一跤，现在的劳动法可厉害了，学校也很难承担责任。所以，学校也不想要了。

    3. 老师傅也傻眼了，一个维修工，快五十岁了，上哪找工作？去工地，没体力了。去国企，人家不要。去私企，国企都不要，私企背的起吗？


    三方都有苦衷。问题是，49岁，也不老啊，在学校这种相对轻松的地方，再干五年也没什么啊。但是，法律摸得大家都尴尬了。


    劳动合同法是2008年出台的，现在十年了，能不能在京郊退休，已经是看得见的事情了。那么多的外地体力活儿工，岁数大了，肯定干不赚钱了，这个成本谁来扛？需要各方专家集思广益。既要保护劳动者，也要考虑企业承受能力。


    讨得紧要严惩违法人员，但更重要的是预防悲剧再次发生。希望劳动法这个问题，进一步得到专家们的重视，尽可能避免出现了学校这种好单位都不要年长的员工。


    # 劳务派遣是个怪胎


    单位用工，自己不怕啊，去找个莫名其妙的劳务公司代为招聘，然后派过来上班，活生生多出一个环节，这都是成本啊！把劳务公司的钱，直接给劳动者不是更好吗？


    这里就涉及到了“解雇难”的问题，按照现在的劳动法，需要解雇一个员工，而员工死活不同意，用单位真的很为难很处理。很多用工单位，老板是文化人，员工散散发疯，老板也处理不了，你放心，没有任何人帮企业的。用工单位迫不得已，就出钱找个顶包的劳务公司，员工要吵架，你去找劳务公司吵。


    劳务公司就不怕吵架吗？呵呵，真的不怕。你去看看劳务公司是个什么人，你就知道他们为什么不怕吵架了。别说吵架，就是再厉害一点，也根本吓不你？


    “再聊个试试？”


    # 世界上没有什么稳定的工作


    稳定，仅仅意味着合法收入不高而已。最稳定的事情是，你的工作有社会需求，这就够了。


    装修队的包工头说，我没有单位，但我的工作最稳定。因为找我装修的人，越来越多，我现在还可以挑一挑。


    数学老师说，我现在无所请单位了，找我补课的都忙不过来。


    出租车司机说，人总是要出行的，我怎么可能失业呢？


    开小店的说，只要你卖日用品，我就有事做了。


    234'
