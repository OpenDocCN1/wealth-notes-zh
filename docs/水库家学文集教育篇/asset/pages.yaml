    # # 互联网彻底终结了小知识分子阶层


    现在，各行各业的文化程度都提高了，用互联网查个常用问题，司空见惯了。


    我们年轻时没有互联网，社会上有大批的小知识分子非常吃香，在农村和工人群体中广受欢迎。他们主要是经常读快报，有的还喜欢剪报，凑成一个本子。四里八乡有什么事情，例如医院在那，肾病专家，打官司怎么打，哪个大学好，一搜人完全不懂，只有靠这些半瓶水的小秀才来解决。


    现在，互联网彻底干掉了小知识分子阶层，只剩下副高和教授了。他们有资格证书，质量至少是不会太差，整个社会的文明程度被大大提高了。现在，喜欢写字的农民工，对劳动合同法的熟悉程度，不亚于半个律师。


    所以，今后的年轻人努力的方向：专业技术人员，或者公务员。


    什么都知道一点的半瓶水，已经彻底淘汰了。


    成为副高，也不容易，希望家长们从小就开始培养，不要打散枪，什么学一年小提琴，一年画画，一年芭蕾舞，这个纯粹是浪费时问。艺术人文社会时改，剥大学里人去学。


    孩子在考大学之前的每一天，都像金子一样宝贵。


    聚焦重点，实现突围。


