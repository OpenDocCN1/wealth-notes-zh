    前两天，遇到一个协和医学院毕业的博士医生，合法收入也就是二十万左右，一天到晚也忙的上火，各种各样的考试也多，还不如当个快乐的包工头。


    # 这种情况怎么填志愿？


    男生，一学分数线，河南地级市，小中产家庭，高考怎么填志愿？


    考重庆，先骗个不要彩礼的漂亮老婆，毕业去苏州落户，父母帮个无脑小寨首村（不加名字），七八十万，解决一切。


