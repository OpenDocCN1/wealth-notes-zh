  md: '今后的赚钱大方向，主要不看文凭了（985 博士除外）。如果你不能为消费党创造价值，单纯一个外地二本研究生物，高度近视，月经不调，穷矮丑丑，就是废材。你刷题好，关我什么事情？你去找题库要工资。关键是你能干什么？拉单子，还是写代码，你总要有个具体技能！


    在欧美，读博士已经是个笑话了。绝没有人因为你是博士，对你高看一眼。因为欧美很多人找不到工作，通过读博士享受一些福利，故意不毕业，就是混日子。今后，我们这里也差不多。


    结论：如果家里没矿，家产无房，你还是学个劳动技术。别读什么野鸡大学，拉闸吧。就算做塑钢门窗，做吊顶，也比二子坚强多了。


    # 就业形勢


    事先和美国工资接轨的有几个岗位：三甲副主任医师，有经验的装修工，大厂码农。


    快速上升的岗位：主要是体检后，洗碗工，小贩贩，搬运工，护士，保姆等。


    失落感最明显的大概是：传统媒体从业者，二本大学生，外贸业务员。


    即将坠崖的行业：主要是禅师（法务），cpa（会计）。这两个行业，只进不出，从业者越来越多，但是业务范围并没有明显扩大。


    幸福感很强的岗位：小地方的正式编制。房价低，人头熟，路路通。


    # 挨个 5 元空调配件花了 870 元


    中国经济网：【太黑了！挨个 5 元空调配件花了 870 元#维修工：市场价就这样】6 月 26 日，山东济南李先生家的空调出了问题，他在网上找来一个维修工。维修工换了一个叫整流桥的部件后向他要了
    870 元。事后李先生在网 上发现这个小部件只值 5 块钱，李先生打电话质问维修工，对方称市场价就这样。


    彩票：这就是服务业。来钱快啊！


    # 为什么服务业这么暴利？


    我去年修个空调，五百元，修个热水器，六百元，也不知道换个什么？反正来一次，就是这个价。工人不考虑材料费的，他们是这样算钱的。


    修空调是比较危险的生意，高空作业多。来回一次，基本是半天。没有五六百，怎感兴趣？一个月 1-2 万打住，生意多的急。开黑车，通下水道，开门锁，拖车，这家真，辅导班作业，每天到手
    500-1000 元，否则不想干。为什么这么暴利？


    一是你自己不想干，或者不会干。但你会计干的生意，例如点点鼠标，卖个淘宝，利润额上不去。只有你不愿意干的，例如苦活累活，价格非常高。例如淘宝店里的打包搬运工。


    二是供应最稀缺。你家孩子愿意去修空调，扛大包吗？大多数人不愿意。ok，就赚你的钱了。不愿？你自己干。


    三是就业太充分了。我们以游客是发愁，这么多人，就业怎么办？现在发愁，来了这么多生意，找不到人怎么办？


    # 为什么我们的就业形势好的发展？


    因为大基建，带动了无数的消费。买了房屋装修啊，带进了几百个上下游企业，生意爆好，兴旺发达。几万，几十万，几十万就花出去了。业主花的贴瓷砖钱，就是别人的工资。中国生意最好的企业之一，肯定有空调厂。那么多房间，空调肯定好卖。如果房子不建了，你看他们还能不能'
