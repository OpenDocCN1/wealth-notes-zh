  md: '寺儿童，小学成绩很差。因为孩子一直跟不上，也不想学习了。


    现在，小学老师根本不管孩子成绩了，低年级基本不留作业，小学高年级的，电脑作业，电脑批改，你爱学不学。高考中考成绩，是家长的事情，老师只管孩子不要在校园内挥刀流血，其他无所谓。所谓的家访，其实就是去看看看孩子家里经济条件和父母情况。


