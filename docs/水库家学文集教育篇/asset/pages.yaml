    > 白日梦沁@蟹冠军得主：我觉得非常滑稽的是前天才还看到空间有脑残粉在说这不是蟹天临的错！！！这只可能怪这个体制！是这个体制的漏洞给了蟹天临钻空子的机会！！是学术风气本来就不良才给了他这个机会！我路吗？？？？？？？体制漏洞和学术风气不良我承认但是您这么洗白是不是有点问题啊？


