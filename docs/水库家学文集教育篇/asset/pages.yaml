  md: '2, 医院不想招聘。上海那么多医科研究生找不到工作,三甲医院天天喊缺医生。为什么?医院就是让你排队呗!不要说什么招聘指标不指标的，那还不是盖个章的事情。医院早就不靠财政拨款了。


