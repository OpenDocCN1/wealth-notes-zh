  md: 'CPA的业务主要是法定业务，企业能不做尽可能不做，没有几个企业自己真愿意搞这个。CPA业务大头是外企，上市公司，三版公司，包括一人公司之类的，每年的总量基本固定，经济降温，业务还在下滑。而CPA是一年比一年多，行情堪忧。而且，CPA很难自己创造新业务。其实，一般中小企业的经营情况，老板娘们清楚，哪里需要什么CPA。只有监管部门强迫做，才被迫去花钱。


    与此同时，律师行业慢慢追上来了。大小企业总有法律需求，经济好，请个法律顾问，经济不好，请律师追债打官司，这一块业务基本不受。个人法律业务突飞猛进，例如，劳动纠纷，婚姻，遗产，房产，一掷千金，出手几万请律师，司空见惯。


    荣媒的小企业，这两年cpa的开支没有，据我了解，去年至今，员工其间遗产，离婚，分享析产，拆迁等请律师的，居然有5个，至少为律师行业贡献了十几万。企业遇到的加班劳动号争议讼1个，法律顾问费五万。


    建议现在的家长，可以考虑让男生读法学专业，女生读法律还可以考公务员。


    # ## 工作五年后，该怎么办？


    某菜，我也是985金融文硕，平时开会，我也是很有见解的，总行专业论文三篇，多次受到表扬。


    但工作五年了，我拉不到大单字，还不如银行职校毕业的中年男和高婚妇女。


    他们专业素质很差，一些最基本的金融概念也搞不清楚，就是靠点拉关系。


    我该怎么办？


    答：找985退学费。再找个离异女拜大姐！


    # ## 工作和专业毫无关系


    我周围有几个外国硕士，欧美五年陈的，现在35岁左右，天天加班，外企年入二十万左右。


    工作和专业毫无关系，只是进门的时候加了点分。结婚生子，买老破小，成啤酒肚或爽脸婆，头发像枯草，节约每一块钱去还贷。


    家里也是工人家庭，没啥花头的。


    # ## 没钱，挂号都困难


    现在街道上小区里打扑克的老头，既厂搞舞的老太，一辈子求稳，哆哆嗦嗦一辈子，现在又如何呢？我这次病倒，真真切切感觉到三甲是什么样了，如果没钱，光有个医保卡，你连挂号都困难。更不要说后续一大堆的开支，仅仅是保够资你也不一定承受得起。


