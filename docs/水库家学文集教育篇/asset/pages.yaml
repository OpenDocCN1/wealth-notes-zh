  md: "# 还能怎么样？批评教育改正\n\n成都某重点中学的食品问题，我看了一眼。上海前不久也发生了一模一样的事情，家长那个激动啊，之后就好像无声无息了，至少我不知道怎么解决的。但是，我用脚指头想想都知道，你在人家那里读书，还能怎么样？批评教育改正。\n\
    \n4月15日\n\n# 上海一中学被指食堂菜... \n\n# 上海一中学被指食堂蔬菜发霉厨务脏乱 官方回应\n\n光明网 发表时间： 发布于 2018-10-20\
    \ 12:01:07  光明网 信源网： 0\n\n10月20日上午，上海市浦东新区市场监管局工作人员表示上海市民中学学校餐饮存在过期食物 有调取监控等情况。\n\
    \n2018年10月19日20时，我局接12351热线转来的举报，反映上海市民办中学学校餐饮普陀校区(晋晖青路109号)食堂存在蔬菜发霉、厨房环境脏乱等食品安全问题。接报后，我局立即会同区公安、卫计委、张江镇政府前往现场调查。\n\
    \n经查，该供饭餐持有有效食品经营许可出，由上海伯乐食品食品科技有限公司承担日常食品配餐，配餐人员19日晚现场检测时发现，该校区食堂配餐箱内的西红柿存在发霉现象，冰箱内存放的半成品加工日期标注为10月20日，但厨余部分鲜品及半成品标注超过保存期限。\n\
    \n针对现场检查发现的问题，我局执法人员立即对该校食堂存在食品安全风险隐患的食品予以封存、未售剩样品食品及配餐冰箱内半成品共计21件并移送检测执行检验，同时责令校方立即停止原分包商供餐，后续供餐方式由校方提出方案报我教育和教育部门核准。经调查，我中心学校对日常餐食安全管理主体责任，进一步强化食品安内部管。\n\
    \n目前我局正在对中心学校校行的食品安全管理以及上海伯乐食品食品科技有限公司经营资质和食品服务配送环节展开进一步深入调查，一旦查实校方及包办商存在违法行为，将依法从严处理处罚;并封上海伯乐食品食品科技有限公司配餐强管理地学校和指定食堂配餐问题开展现场拉查，对其实有分包商供餐的安全隐患发出食品安全警示，防止类似事件发生。同时，结合教育主管部“对全区所有学校食堂开展专项检查，防止类似事件发生。\n\
