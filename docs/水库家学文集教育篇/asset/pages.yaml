    # ## 公司解聘孕期女员工


    蓝鲸财经记者工作平台：#公司解聘孕期女员工#，称其未遵守暂不结婚承诺。(澎湃)


    该公司在上诉状中表示，“应聘的时候她承诺没有男友，几年内不会谈婚论嫁，而现在工作半年就结婚怀孕，有违诚信。”该公司提出，在应聘阶段，公司即发现吴女士的年龄处于婚嫁阶段，为规避“风险”，本没有打算录用，但吴女士保证“选秀朋友都没有，几年内不会谈婚论嫁”，公司这才留用。


    然而，工作才不到半年，吴女士就结婚并且怀孕了，该公司认为，吴女士的行为违反了诚信原则。收到上诉状后，上海二中院的承办法官第一时间联系该公司，针对公司的想法进行了法律释明。


    哀：一声叹息，以后怎么办？


    # ## 小微企业，老板和员工


    并不存在谁强谁弱的问题，很多小老板买不起房子，清洁工家里三四套房子。他们之间只不过是分工不同。


    老板承担风险为主，员工承担劳动为主。通过立法，让老板承担员工的各种福利，暂时是压的下去；长远看，并不利于激活经济。我建议：女性怀孕，社保承担起来，怀孕超过三个月，有关部门接手。


    如果一定要把女性福利塞给小老板承担，最后的结果是，那个企业孕归少，那个企业就占便宜了。这就合理吗？


    # ## 单位人际关系


    为什么有的单位里，人际关系会很复杂？(我说的的少数单位，不要扣顶)


    这个**事情**是**无解**的。大单位里，所有的利益，最后都归结于职务级别。做多少少，肯定是**搞得厉害**。大单位岗位职责分的很细，单纯业务，互相很难比较。好事情归集，没个标准，全部是人定的。**既然**是人**的**，那就有**搞头**了。一般手法是，无限放大你的缺点，忽视你的优点。


    +   1. 你业务能力强，就说你人际关系差，人品不好。

    2. 你一个老实人，就说你工作能力差，工作协调性不好。

    3. 你又老实又能干，说你性格内向，不适合当领导。


    还有年龄，文凭，轮岗经历，上级领导评价，同事评价，反正总有一款适合你，让你无话可说，干瞪眼。'
