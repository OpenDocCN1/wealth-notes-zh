  md: '但当你接近 40 岁时，你的曲线就断崖式结束了。这事将没人会告诉你的，你也不知道。但这是事实。只有 1-2% 的管理人员可以豁免。


    # 进入不同体制的同学们的经历


    我现在四十岁出头了。回顾当年进入不同体制的同学们的经历，感慨万千。


    +   1，进入外企的，现在基本是半死不活了。但是他们房子多，当年工资高，房价低，他们人均 4-5 套三居室。


    +   2，进入公务员的，已经赶上来，绝大部分是中层干部，每年都有几个公示。


    +   3，进入私企的，两极分化，主要是京沪广深。我们那个年代，国家包分配，哪来回哪去，一些穷地方的同学不想回老家，就自己出来找工作。两极分化很严重，穷的实在是穷，年收入一百万还不到，富的已经上市了。


    +   4，进入国企的，基本到了省公司的中层，企业里的实权处级。


    +   5，一开始就自己创业的，大部分是在京沪服务业，汽车修理厂，咨询公司，设计公司，收入不清楚，但几套房子是有的。这些人是精神百倍。


    # 为什么学校不教学生赚钱


    当做保姆的母亲和工地将次铺的父亲发现，本科毕业的儿女收入还不如自己，也不想干了，连洗个碗都嫌麻烦，最好直接叫外卖，父母该是多么的悲伤！


    我一直好奇，为什么学校里不教学生赚钱的技能，就是放任大学生在宿舍里打游戏？这还不如把孩子送到铁庄和木匠那里学手艺呢！


    # 大学生的幻想


    陈一铭老师：有些大学生毕业之后就想着应聘总经理助理、总裁助理、副总裁，然后过渡一下，直接转正，当上 CEO 或着道总裁，然后挥斥方遒，激扬围绕，几张 PPT，几句口号定天下，然后自富我们投怀送抱，登上人生巅峰。

    （主要还都是穷人家的孩子）


    # 想跟小孩子们在一起


    菜菜好：最近真得很没劲，主要是家庭原因，心里有个强烈的愿望，是一直以来的愿望，就是，我想做幼儿园老师，阿姨也可以，这个是从小梦想的。


    现在家里的小朋友都 18 了，一点也不好玩，我还是喜欢幼儿园的孩子，和他们在一起真正的开心，心情愉悦。


    自己是 70 年代的独生子女，孩子 18 岁，老公不萝嗦，自己娘家房子 5 套，工作轻松的，月收入 1 万。但还是没劲，哪能办。。求匿名


    # 以前考个 985 基本可以当中产


    我们年轻时，比现在有一点好，考上 985 基本可以当个中产，现在没这好事了。


    毕业后，还是要的关系，否则也就是个民企采购，私企会计的工作。不用谢。'
