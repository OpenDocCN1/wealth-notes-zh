    # 社保和税务合并


    会造成一个有趣的事情。贵司工资奖金支出，准备报多少？


    如果工资总额少报了，企业所得税上升。


    如果多报了，个税和社保基数上升了。


    总有一款适合你！


    实事求是最适合你。谢谢你一家门。


    # 我直接和医生说


