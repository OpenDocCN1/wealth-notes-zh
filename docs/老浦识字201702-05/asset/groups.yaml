    # 【眺】望见未来


    老师提示：订阅读专栏后，文稿中的象形文字可截可点，放大来看，细细品读。


    在以前的文章中，我们聊到了两个和眼光有关的字——“限”和“望”。


    说明了你身处的位置决定了你的见识，身悬崖下，眼光受到制约。登到高处释目远望，胸襟自然开阔。


    登高望远已经是眼光最高处了，还能看的更远吗？


    # 人世间的千里眼


    我们现在当然可以看得更远了，用望远镜啊。


    有新闻报道说中国参与建造了目前世界上最大的天文望远镜，镜头镜面的直径达到三十米。三十米什么概念，我们手机上的镜头只有几毫米，清晰度已经很好了，三十米，比现在最先进的哈勃望远镜还要清晰10倍，2022年投入使用以后，相信会有更多宇宙的秘密会被人类发现。


    古人和我们一样，想看得更远。神话传说是有千里眼，玉帝的侦察兵，他可以在云端往下看。《西游记》描写孙猴子出生，一道金光直冲天际，玉帝忙差(chāi)千里眼、顺风耳前去查看，回来报告说下界有一石猴出生，眼露神光，先拜天地，再拜四方。


    在远古的现实中，没有望远镜，还能看得更远吗？


    还真有这样的字，古人以为自己能。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_66_1.png)


    眺是目字旁加先兆的“兆”，目字旁表示用眼睛看，兆的原意是龟甲兽骨占卜烧出来的裂纹。龟占、骨占据信是最灵验的占卜方法，我可以跟你聊过，周代的人极重迷信，什么事都要烧块龟甲骨卜一番，甲骨文就是这么诞生的。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_66_2.png)


    “眺”是后造的字，甲骨文、金文都没有，显然用的是“兆”的引申义，加上代表眼睛的“目”，合起来表示望向更远方。成为神一样的千里眼。


    # 改变历史的一次眺望


    1492年，哥伦布的帆船已经在大海中航行了两个多月。疾病、饥饿和茫无尽头的恐惧让船员们的精神接近崩溃。他们以叛乱相威胁，拒绝继续向西航行。哥伦布经过艰苦的谈判，最后商定：3天，再向西航行3天，如果还见不到陆地，就返航。


    3天，水手每天都爬到桅杆最高处向前方眺望。第三天，“陆地！陆地！”，水手大声高呼。


    这是1492年10月12日，这一天后来被定为西班牙的国庆日，而这次眺望，改变了历史。


    大航海时代的来临，证明地球是圆的，新兴的工业文明成为世界的主流。西班牙、葡萄牙、荷兰、英国，最后是美国，都是从海上眺望著世界，成为海上崛起的世界大国。


    # 微观世界的眺望


    这是眺望的“眺”的草书：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_66_3.png)


    很像一个踮起脚尖向远方张望，而两旁的四点又有了很多不确定的感觉。当我们迷茫时，当我们盼望时，我们会登高眺望。


    “舒高凝眺、临风舒啸”。


    但眺来至占卜的原意告诉我们，预见未来不一定要登高，有时候，科技会引领我们进入微观的大千世界。在那里，我们对未来的预见可能更加靠谱。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_66_4.png)'
