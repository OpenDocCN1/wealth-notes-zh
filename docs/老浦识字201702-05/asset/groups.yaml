    # 【自】自己的鼻子 自己的尊严


    老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    ## 自己的“自”原型竟然是鼻子


    采访中国的世界冠军，经常会听到他们自称“自己”。


    “自己做得还不够多，还要继续努力”云云。听起来是一种谦辞。


    其实，这种自称在潜意识里是一种自我中心意识，也表示自我的核心地位。


    为什么？因为自己的“自”甲骨文本文意是鼻子。


    这是自己的“自”，甲骨文就是人鼻子的象形。不仅画出三角形鼻子的外形，还把气息的通道气管，形象地表现了出来。


    鼻子是人脸中心部位，也是最高的部位，在人的潜意识里，鼻子代表人的尊严。


    中国人在谈到，尤其是炫耀自已时，会手指自己的鼻子。而羞辱、否定一个人，会指着他的鼻子痛骂。


    这回你知道世界冠军老自称自己，并非谦辞了吧。


    ## 割掉鼻子就是割掉尊严


    也正因为鼻子代表一个人的尊严，所以割掉鼻子成为上古五刑之一。汉字专门有个字，即鼻字加一竖刀，劓（yì），专指割鼻子。


    秦以前的五刑是：


    - 墨——脸上刺字；

    - 劓（yì）——割掉鼻子；

    - 刖（yuè）——砍脚；

    - 宫——毁坏生殖器；

    - 辟（pi）——杀头。


    小时候听刘兰芳的评书《岳飞传》，里面有一个金国的军师哈迷羞（chí），因为下毒计被宋军割掉了鼻子。


    刘兰芳（nàng）着鼻子模仿哈迷羞（chí）的声音“哎呀我说狼头，为臣有个主意，管保岳云有来无回。”大概因为他没有鼻子，所以出的主意都格外阴狠。


    但在我们听书人的心目中，这个人就是小丑，毫无尊严。


    ## 汉字里各种借了不还


    那为什么现在鼻子的鼻不是这个“自”啊？


    汉字有个使用方法叫假借，对有些抽象概念不好表现，就借用一个相关的字来表达。


    比如成千上万的万，就借用了蝎子的象形字，这一借就不还了。表示蝎子的意思只好另造一字。


    “自”也是这样，鼻子的象形被借用作用第一人称代词，这一借也是不还了。


    后来又借形声字“鼻”，由形声“自”加上声符“弟（bì）”构成。弟（bì）既是声符也是形符，弟（bì）的原意是给（jì）予，暗喻鼻子的呼吸功能。


    说到假借有的字还真是冤。臭


    上面一个表示鼻子的“自”，下面一个“大”字。


    > 《说文解字》：臭，禽走，臭而知其选者，犬也。从大，从自。


    是说的狗嚼着野兽留下来的气味而能够追踪到，实际是用狗鼻子的灵敏度表嗅觉。


    大概野兽的气味比较臭，于是这个字就被臭的臭借调过去，借了不还，只好加个“口”另造了嗅觉的“嗅”。


    ## 好鼻子代表好运气


    说道鼻子的象形“自”，中国人历来认为人的鼻子代表一个人的性格，并且主宰他中年以后的命运。


    汉高祖刘邦就有一个高耸的鼻子，史书记载他“隆准龙颜”，当年富豪吕公就是看好刘邦的面相，把自己的宝贝女儿许配给了这个穷小子，这个女儿就是后来的吕后。


    现代人袁复生了曹操的面容，也有一大鼻子。据说当年相貌，袁有人见了这幅尊容评价：治世之能臣，乱世之奸雄。曹操听后哈哈大笑，扬长而去。


    汉高祖刘邦就有一个高鼻的鼻子，史书记载他 “隆准龙颜”，当年富豪吕公就是看好刘邦的面相，把自己的宝贝女儿许配给了这个穷小子，这个女儿就是后来的吕后。


    现代人有人复原了曹操的面容，也有一个大鼻子。据说说当年相见，高人见了这幅面容评价：治世之能臣，乱世之奸雄。曹操听后哈哈大笑，扬长而去。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_44_0.png)


    ## 好自为之


    在老博看来，自己的“自”是鼻子的形状，是一种隐喻，说明人妻自尊，自尊的人自有格局。


    一代名士张伯驹，把散尽家财收来的国宝无偿献给国家，却在反右、文革中遭受了不公正的冲击，但他却安之若素。原来的宅子早已被别人占据，老两口只好蜗居于一间10平米的小屋内。一无粮票二无户口，只能靠廉价的救济度日。


    故交王世襄（xiāng）曾多次去看望张伯驹。“他除了年龄增长，心情神态和20年前住在李莲英老宅时并无差异。不怨天，不尤人，坦然自若，依然故我。”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_44_1.png)


    看张伯驹先生的照片，他有一个多么挺拔的鼻子。


    自己的“自”原来是鼻子的象形，而鼻子作为脸部的最高峰，代表人的尊严。这就告诉我们，珍惜羽毛，保持尊严，犹如爱护自己的鼻子。没有了鼻子，就是没有了自尊。


    # 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_44_2.png)


    小区有个花园，曲径盘绕。


    家长领孩子上学，经常穿过草地抄近道，大概能省几秒钟。


    而那片林子就被踩的寸草不生。


    我曾经打了个三角堵档住树墙的缺口，分分钟就被人一脚踢开。


    大概这些牵着孩子小手穿过树林的家长根本没有意识到，孩子的公德意识和遵守规则的意识，就在省下的这几秒钟里轰然倒塌了。


    自己带着孩子破坏规则，怎么可能要求孩子长大以后遵章守则。


    有报道，国人带孩子子在俄罗斯皇宫方便小便，一边觉得丢人，一边心疼那孩子。这样溺爱培养出了的孩子，怎么会有公德，怎么会有羞耻感。


    大处不苟且，小处不随便。尊重自己，做好自己，才有可能带好孩子。


    咱们的书法课周课，从本周开始一起练习临帖。


    具体形式，已经发在咱们的学习小组【老博讲字班】中。


    标题配 #书法周课#第一周


