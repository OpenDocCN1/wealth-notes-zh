    # # 问答 | 周末加餐


    周末好，今天的内容是一期问答加餐，我就疑问比较多的地方，为大家做一个解答。


    到底是什么甲骨文、象形文字、金文、楔形文字，它们之间什么关系？


    老浦答：象形文字，是由图画演变而来的文字，出现在大约公元前3000年的古埃及；而楔形文字出现在大约同时期的两河流域（幼发拉底河、底格里斯河），那里的人把木条削成尖，在泥板上刻字，刻出来的笔画像楔子的形状，所以叫楔形文字。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_95_1.png)


    甲骨文是刻在龟甲兽骨上的文字，金文是刻在青铜器上的文字，他们都属于象形文字。


    从时间顺序上来看，大致是甲骨文、金文、篆文、隶书、楷书、行书、草书……也就是咱们识字卡片上呈现出来的顺序。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_95_2.png)


    识字卡片上为什么有的字会空缺？


    老浦答：下面是两张字源演变有空缺的字。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_95_3.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_95_4.png)


    我们对象形文字的探索，受限于出土的龟甲兽骨和古器，有些字的甲骨文或者金文还没有被发现，也没有字形，确定到文字发展后才出现，比如“她”这个字，从甲骨文到金文乃至篆文都没有，全部空缺。


    那“她”是怎么来的呢？我在之后的内容里，会专门讲这个字。


    为什么一个字的甲骨文会有不同写法？


    老浦答：象形文字，其实就是图画，在这个概念出现以前，人们记录一件事，就是很形象地把画图画表现出来，也没有统一的标准，不同人在不同龟甲、兽骨上刻字的时候，会按照自己对这件事的理解去刻画，难免出现差异。这样的字有很多，像《牛》、《豕》、《豕》、【后】的甲骨文或者金文都有不止上一个。如果你有足够浓厚的兴趣，我推荐一个网站给你，叫“象形字典”，里面有很详细的字源演变解释。


    为什么很多字的甲骨文和简化字的结构顺序不一样呢？


    老浦答：在象形文字中，这其实是个比较常见的现象。比如咱们之前讲过的2月17日的《囧》这个字真的很囧）里面，提到了“明”的甲骨文


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_95_5.png)


    ，“明”的“月”明在右边，但是在甲骨文里，“月”却是在左边，所以很多人说是不是搞反了？其实啊，上一个问题里提到“她”的甲骨文会有不同写法，“明”的甲骨文就有两个，


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_95_6.png)


    只是其中之一，另一个写法是


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_95_7.png)


    ，这个才是我们现在简化字“明”的祖先，也是左“日”加右“月”。


    我们讲过了，“囧”的原意是“天囧”，所以


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_95_8.png)


    就是“月亮”加“天囧”，表示夜晚月光从天囧洒进屋里的明亮。


    象形文字，其实就是图画，在文字的概念出现以前，人们记录一件事，就是很形象地把它画成画表现出来，也没有统一的标准，意思表达出来即可，所以出现结构顺序不一样，也是可以理解的。


    浦老师，专栏是不是可以买来送人，怎么样？


    老浦答：微信关注“得到”服务号，回复“老浦识字”，会自动弹出我们专栏的电子版品入购买链接，购买完成后，会得到一个兑换码，把这个兑换码送给别人，它在一个得到，买入咱们专栏的时候直接输入兑换码就可以了。


    今天就到这里吧，还有哪些问题，欢迎你踊跃留言。老浦识字，祝你每天都有恍然一悟，下周见！


