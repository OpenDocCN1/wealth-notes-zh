    # 【考】曾经很可怕


    老浦提示：订阅专栏后，文中的象形文字可截可点，放大来看，细细品读。


    考学当然可怕，考老考，老师的法宝。分分分，学生的命根。学生时代，考试是所有学生的噩梦。


    在远古时代，考是老人们的噩梦。


    ## 甲骨文的考


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_1.png)


    是一个长头发


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_2.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_3.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_4.png)


    的老人


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_5.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_6.png)


    拄拐杖。表示拄杖的衰弱老人。


    为什么长头发代表老人呢？因为古代成年的男人是束发的，而到了老年，头发稀疏，就被散开来，意味着老人已经不必束缚自己了。


    《说文解字》说：考，老也。考就是老，两个字通，都是指老年人的意思。


    ## 金文的 ''考''


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_7.png)


    ## 篆文的 ''考''


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_8.png)


    ## 的 ''考''


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_9.png)


    ，都是长发老人拄拐的造型。


    考和老后来发展出不同的含义。老表示老年，考表示去世的死。《礼记·曲礼》说：生曰父、死曰考。那么古时的母亲呢？叫妣。有些墓碑上会刻 ''先考 ''、''先妣
    ''，就是用的这个含义。


    有学者认为，考字下面的木棍也许有更深含义，那就是远古时期的风俗——棒杀老人。


    广西桂林一处7000年前的古人类遗址，发现了14具头骨，其中4具头骨发现有明显的钝器打击伤痕，表明是被人打死的。经鉴定，年龄都在50岁以上，而其他年轻人的头骨则没有这种现象。


    在石器时代，大多数人都死于二十多岁，50绝对是长寿者。他们为什么会被打死呢？


    学者研究这与远古的生死观念有关。在远古看来，死是重生的机会，灵魂会转世回来新生。所以当老人疾病缠扰的时候，老人乐于赴死，只是担心死的方法不对。


    那什么样的死亡是对的？要流血。也许是古人看到流人血后会晕厥，认为血液是灵魂寄存的所在，所以死的时候要没有流血，灵魂就难以成，不吉。


    这也许是棒杀老人的原因吧。


    这种对血的崇拜一直影响到后世的丧葬制度，人们在死者身上撒上面砂，棺椁内壁涂成红色代表血。


    这是汉字微小的微


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_10.png)


    ，手持梴


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_11.png)


    击打长发老人


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_12.png)


    ，应该就是这种习俗的反映。大概这个时候的木棍已经不棒棍所接受，棒杀老人吃掉骨的地方不要听到动静，所以这个字形出做微小的含义。


    这是甲骨文死亡的死


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_13.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_14.png)


    ，一个人跪坐在一具枯骨的旁边，非常悲伤。为什么是一具骨头而不是尸体呢？


    这表现了对待老人另一个可怕的习俗——抛弃于荒野。


    同样出于灵魂再生的理念，古人认为人的身体被野兽啃食吃掉会转世再生，同时大概出于生产力低下，老人成为儿孙的陷阱，所以自愿让儿子将自己抛弃到荒野岭，生自弃。而被野兽吃剩了的骨头，家属再收回来埋葬。


    战国初期的《墨子·节葬》说：


    > 楚之南有炎人国者，其亲戚死，斩其头而弃之，然后埋其骨，乃成为孝子。


    说：


    > 楚国南部的炎人将死者抛弃，任其腐朽，然后把骨头埋回来，这是孝子的行为。


    但是汉代的一个故事表明人们观念的变化。一个叫原谷的人相帮父亲，把祖父抬回弃于荒野。原谷去干嘛？他回答说：以父母把他带回来是。他父亲在醒悟原谷，然后自己把父亲去掉了，于是回去老态龙飞回来养谷，原谷因此获得孝孙的好名声。这个故事一方面说明抛弃老人习俗的存在，另一方面也反应了人们思想观念的改变。


    其实西藏的天葬，也是这种观念的延续。天葬师会仔细地将骨头敲碎，拌上糌(zān ) 耙喂给老虎秃鹰。我们认为自己的观念觉得难以接受，但他们认为，尸体被禽鸟吃得越干净，亲人转世就越吉利。


    金文的 ''考''


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_15.png)


    将甲骨文


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_16.png)


    字形中的手杖


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_17.png)


    成 ''卜 ''


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_18.png)


    ，表现了孝字的引申义，就是乐师敲击钟磬调试音律。 篆文的 ''考 ''的另一个写法


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_19.png)


    就是手持打击梴棒


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_16.png)


    敲击钟磬


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_96_21.png)


    ，以调试音准。


    《庄子·天地》中说：


    > “金石有声，不考不鸣。”


    说：


    > 由金属或者石头做成的钟磬，不敲击是不会发出声音的。


    苏轼在《石钟山记》中说：


    > “而陋者乃以斧斤考而击之。”


    > “而陋者乃以斧斤考击而求之。”


    说：


    愚蠢的家伙用斧子敲击石壁来考证石钟山特殊声音的存在。


    都是用考敲击的原意。


    隶书的考 **考** 和我们现在熟悉的“考”，字形一样，引申出考察、考试的意思。


    这期的内容可能让你很不舒服，不管怎么说，也不应该棒杀老人啊。这就告诉我们，汉字中隐含了很多远古时期的文化现象，很多习俗我们今天已经完全不了解了。考察汉字的原意，能够让我们的思路更加开阔，认识更加深刻。在这期节目中我们也看到，古人的思想观念也是
    在变化的，原来认为抛之荒野然后埋葬枯骨是孝，后来则是奉养老人为孝，再后来，孝成为孝道，是统治阶级声称的立国之本，走到了另一个极端，这个孝字，我们下期来聊。


    ## 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_97_0.png)


    说到考试，我们这个年龄段的人上学期间经历过一段十分特殊的考试方法，开卷考试。


    > 那时候领袖说：“我主张题目公开，由学生研究、看书去做。……考试可以交头接耳，无非自己不懂，问了别人懂了。懂了就有收获，为什么要死记硬背呢？人家做了，我抄一遍也好。”


    所以考试一律开卷，考试和做作业没什么区别。


    当时很高兴，但代价是啥也没学到。


