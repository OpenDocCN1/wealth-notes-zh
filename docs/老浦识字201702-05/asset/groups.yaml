    \n## 【礼】礼尚往来\n\n老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。\n\n“滚滚长江东逝水，浪花淘尽英雄，是非成败转头空。青山依旧在，几度夕阳红。”\n\
    \n这首《临江仙》是《三国演义》的开头曲，作者是明朝的状元，大才子杨慎。许多人不不知道的是，杨慎这首词填写于流放云南途中。他当时受到两次廷杖，几乎被打死。披枷带锁还能够写出“一壶浊酒喜相逢，古今多少事，都付笑谈中”的旷达，也是令人敬佩。\n\
    \n以后三十多年，杨慎一直没有得到赦免，终老在戍（xù）所。\n\n他落到如此境遇的原因，是因为他领头参与了明朝当时惊天动地的“大礼议事件”。\n\n大礼议事件是围绕“礼”这一封建社会的核心价值展开的，老浦想通过讲述这件事的来龙去脉，解读汉字“礼”字。\n\
    \n甲骨文 *礼* 是一个祭祀的器皿，皿里盛着 *羊* ，是成串的玉石 *玉* ，下面一个有脚架的大鼓 *鼓* ，在这里表示击鼓献玉，敬奉神灵。\n\n>\
    \ 《说文解字》：礼，履也。所以事神致福也。\n\n说白了，礼，是用来敬神致福的仪式。打鼓代表仪式，玉是敬献的贡品。\n\n在上古，只有酋长才有祭祀上帝的权利，所以礼就是特权，是建立在敬奉祖先基础上的秩序。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_86_1.png)\n\n大礼议就是争议宗族、祖先的位次问题。不过因为涉及皇位，问题就格外严重。封建皇权的继承是按照父死子继；父亲死了儿子继承；没儿子，兄终弟及，就是哥哥死了弟弟继承。\n\
    \n明武宗死了，没有儿子，也没有亲兄弟。那怎么办？就找了他最年长的叔叔兴献王的儿子，也就是明武宗的堂兄朱厚熜（cōng）来继承这个皇位。这就是后来的嘉靖皇帝。\n\
    \n但朱厚熜不是皇帝的亲兄弟，按照礼法，就得把他变成亲兄弟。怎么变，好办，让朱厚熜认皇帝爹，也就是明孝宗为亲爹，换句话说，就是把他叔叔的儿子过继给父亲，这不就成亲兄弟了吗。\n\
    \n说干嘛那么麻烦，堂兄弟不也是一家人吗，谁让你没有亲兄弟的。干嘛搞这套虚的。\n\n朱元璋看到只有15岁，意思相当大：我是来当皇帝的，不是来当太子的。停留在郊外，不进。\n\
    \n经过反复协调，最后从大明门进，大明门是故宫的正南门，正阳门和天安门之间，是明清两代的国门，在春天殿即位。（大明门在清代更名为大清门，民国改称中华门，1954年在苏联专家建议下拆除，1976年在原址建设毛主席纪念堂。）\n\
    \n这就是汉字“礼”的另一个核心：仪式。从哪个门进就是仪式，其中暗含礼制的微妙区别。进大明门，国门，那就是堂堂正正即位来了。\n\n当然朱元璋也是个小心眼，他口头上称武宗皇帝为皇兄，好像接受了过继给亲爹的安排，否则按照礼制，他是没资格叫皇兄的。\n\
    \n皇帝屈尽坐稳以后，开始在叫爹的事情上和群臣较劲。朱元璋要叫亲爹，追认亲爹为“皇考兴献帝”。大臣们主张应该尊正统，要以明孝宗为皇考，亲爹也就王改称“皇叔考兴献大王”，说白了就是只能管亲爹叫叔叔。\n\
    \n矛盾在大前门爆发了。嘉靖三年（1524年）七月十二日，明世宗诏谕礼部，许臣于父母上申文，祭告天地、宗庙、社稷，群臣哗然。\n\n正统皇朝刚结束，两百余位朝廷大臣在左顺门前跪请世宗改变国策。根据史料记载，参加此次集体示威的官员共计二百二十余人，中央一共十六部，来示威的就有五个部长。\n\
    \n明世宗在文华殿听新闻门外哭声明，命大监传谕大臣们退朝，但群臣直到中午仍伏地不起。杨慎等人摘门大哭，“声震闹室”。朱元璋意怒，令锦衣卫逮捕为首者八人，下诏狱。此举令其他人更为激动，冲至左顺门前摘门大哭。\n\
    \n朱元璋再下令将五品以下言官小的统统抓起来，四品以上官大的停职待罪。第二天，朱元璋开始了全面反击，明代历史上最大规模的廷杖之就此拉开序幕。当天在左顺门前闹事的大臣全部被脱光了裤子，猛打了一顿屁股。人数总计划到一百四十余人，十六个人被打死。\n\
    \n大才子杨慎作为反面典型，和其他的六个带头者被打了两顿，险些打死。左顺门廷杖后，反对议礼的官员纷纷缄口，为时三年的“大礼议”以朱元璋获胜告终。\n\n礼制的本质是权力。讲究礼法到了极致就是不讲理了。皇帝用暴力压服，打屁股，成为最无礼的结果。\n\
    \n### 礼貌\n\n金文还有一种写法，是在古鼓献玉的基础上，加上了表示酒的“酉”。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_87_0.png)\n\
    \n我们抛弃了封建等级制度的礼法，但人与人之间基于平等的礼貌，还是应该讲究的。\n\n### 识字卡片\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_88_0.png)\n\
