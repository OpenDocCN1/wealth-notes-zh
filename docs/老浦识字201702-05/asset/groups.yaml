    见到一个小孩子，她反映自己的父亲从不肯穿自己给他买的新衣服，新鞋放在柜子里鞋底老化都断了。\n\n平时买个菜要逛四个超市比较，就为省几毛钱。\n\n父亲的行为让自己觉得很丢人。\n\
