    ## 【众】乌合之众


    【众】乌合之众


    老浦提示：订阅专栏后，文稿中的象形文字可载可点，放大来看，细细品读。


    ## 妖言惑众


    甲骨文的众


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_27_1.png)


    是一个日，

    也就是太阳，下面三个人形。

    在古代，三就表示多。


    廉颇为表示自己还未老，在赵国使臣面前吃一斗米饭，十斤肉。赵国使臣回去报告上司。一句话就把廉颇毁了：廉颇还挺能吃，但吃饭的时候，三进三出。


    不是说吃一顿饭上了三次厕所，而是多次上厕所。可能阑尾炎，但干部考核没通过，失去了上阵打仗的机会。


    太阳下很多人就是群众的众。


    三个人表示多，写三个人不就完了吗，为什么还要在上面加个太阳？


    事实上，最早的甲骨文还真的就是三个形，没有日。为什么要加上日？


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_27_2.png)


    先讲个故事。公元前209年，秦二世元年，大雨滂沱，一群900人的新兵正在赶赴今天的北京地区，当时这里是边疆，北方的匈奴经常骑骆驼劫掠。由于大雨耽误了日期，队伍中都传说，按照秦朝法律，迟到者赶到以后全体都会被处死，所以队伍中弥漫着绝望的情绪。


    终于可以扎营做饭了，厨子在收拾刚刚从市集买回来的鱼，突然发现鱼肚子里居然有一块丝帛，上书三个大字：“陈胜王”。


    而在宿营地附近的狐狸，隐隐约约传来狐狸的叫声，好像在叫“大楚兴，陈胜王”。对，我讲的就是陈胜吴广大泽乡起义。


    这则来自《史记》的记载从来没被人怀疑过，秦朝的法律竟然如此严苛，3个逃犯就要统统杀人，造反是必须的啊。


    直到1975年11月，在湖北省孝感地区云梦县出土了大量秦简竹，其中很多是法律条文。其中有用朝廷规定征发徭役的详细规定：


    - 迟到三天到五天，批评；

    - 六天到十天，罚一块盾牌；

    - 超过十天，罚一副盔甲；

    - 因大雨或洪水导致的耽误，可免除此次征发。


    那么陈胜吴广起义时声称“因大雨耽误日期，肯定会被处死”的说法是哪来的呢？


    很明显，和鱼肚子里的丝帛，夜里狐狸的叫声一样，都是陈胜吴广搞的鬼。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_27_3.png)


    这就颠覆了咱们以往的认知。我们一直以为陈胜吴广起义是因为迟到要被处头，反正早晚是死，被迫造反，所谓官逼民反。现在看来不是这么回事。


    这是一场精心策划的阴谋：先造谣说大伙都要被处头，然后装神弄鬼推出假陈胜王，最后制造一个事件爆发造反。


    为什么要这样装神弄鬼啊？


    来看看甲骨文的众，可以解释为太阳下人们集体劳动，也可以理解为人们头顶共同的神。


    太阳就是神，没有神，众人就是一盘散沙。


    在远古要把人群聚集起来，要有个身份，要么是王，要么是巫师，你普通人人我认识你是谁啊。他要么让自己超神，要么让天派来的，跟着他，就不用担心成不了事，老天自有安排。


    出身佣工的陈胜和农民出身的吴广没有背景，要造反没人听怎么办法？那就要自己制造——天意。他要么让自己超神，要么让天派来的，跟着他，就不用担心成不了事，老天自有安排。


    世袭的君王会表明自己是“君权神授”，那些依靠鬼神来制造聚众造反，就一定要拖无鬼神来制造自己起事的合法性。


    黄帝起义的口号是“苍天已死，黄天当立，岁在甲子，天下大吉”。


    元末红巾军韩山童的口号是“天下大乱，弥勒佛下生，明王出世”。信奉的是白莲教。


    太平天国搞的是拜上帝教，天王父天父兄一大堆。


    在我们当代，一句蛊惑人心的口号就能聚集大量信徒的事情层出不穷，最新的是，连通宇宙能量的心灵培训机构，会员上万人，敛财800多万。这种妖言惑众的戏码在中国这片土地上常玩长新鲜。


    这种戏码中的核心就是“众”字上面的“日”。


    ## 众人一且等于盲目


    金文群众的“众”把甲骨文上面的日，演化成成一个横着的“目”。


    这可能是在古代书写过程中写错了，但我觉得这里冥冥之中反映了乌合之众的另一个特征，就是集体的目标。


    乌合之众都有一个蛊惑人心的目标。


    - 陈胜吴广说“王侯将相宁有种乎！”

    - 小成自说“吃他娘，喝他娘，闯王来了不纳粮”。

    - 水泊梁山杏黄旗下不也是大书“替天行道”吗？


    有了这样崇高的目标，乌合之众就有了一种错觉，那就是为了伟大的目标可以不择手段，那些平时老实善良的农民可以瞬间变成杀人魔王。


    > “待到秋来九月八，我花开后百花杀。冲天香阵透长安，满城尽带黄金甲。”


    这是黄巢在高考不及格以后写的诗，真是杀气腾腾。


    的确，哪一次乌合之众的聚集不是老百姓的血光之灾。私盐贩子黄巢起事以后，果然成为杀人魔王。民谚说，黄巢杀人八百万--劫数难逃。《旧唐书》记载他用上千匹巨大的石臼（jiù）捣碎人体，制成肉靡（mí）充作军粮，老百姓皆被吃光，赤地千里。


    明末李自成的军队马喝人血，张献忠更是把四川百姓几乎杀光。太平天国之乱，江南死难人近一亿。


    为什么那些平时老实巴交的百姓会如此残忍嗜杀？


    社会心理学家勒庞在《乌合之众》中告诉我们：


    > 普通人一旦被裹挟进群体，就会变成不用大脑，仅凭脊椎思维，狂热易容、容易轻信的动物。他们很容易做出做刽（guì）子手的行为，很快也很容易遵循就义，既会随意屠杀抢掠，却也同样表现得侠义无私。在这种崇高的目标驱动下，他们丝毫感觉到自己在作恶。


    ## 偶像崇拜


    简化字“众”，无意间完成了乌合之众最显著特征的隐喻，即偶像崇拜。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_28_0.png)


    简化字的“众”是一个大人下面两个小人。这展现了乌合之众最重要的特征：偶像崇拜。


    看过一个纳粹德国著名纪录县导演里斯塔尔拍摄的影片《意志的胜利》，这是一部宣扬纳粹军国主义影片，影片中那森林般举起的手势，步伐如机的纳粹党党，展现出来的群体暴力让人不寒而栗。


    在《意志的胜利》影片开头，希特勒的座机从云端飞来，犹如救世主降临。而下面的民众对于这个战争狂人却是无限崇敬的仰视。


    汉字“众”上面的这个人越大，下面的人就越小。


    我们鄙视乌合之众，但是我们都可能成为乌合之众。


    2016年，我们又熟悉了一个新词：吃瓜群众。在互联网，吃瓜群众已经成为一股可怕的力量。


    我们这期节目通过分析众的三种字体，找到了乌合之众的三种特征：装神弄鬼、鼓惑口号和偶像崇拜。


    端详这个汉字，就是提醒我们，看到这三种特征，就有可能是传销、邪教，起码是乌合之众。


    ## — 识字卡片 —


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_28_1.png)


    亲身经历过一件事，我夜里12点多才到达广州，不料在机场大厅，却在深夜聚集了一大批人，手捧鲜花，高举标语，显然在迎接偶像。


