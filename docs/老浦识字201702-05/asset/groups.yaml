    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_83_0.png)\n\n怎么样？\n\n无羊的敬畏，无我的自爱，既没有道义、正义，也没有仗义，只剩下表示否定的\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_83_1.png)\n\n（yì）加上一点，只能说是\n\n意气用事了。\n\
