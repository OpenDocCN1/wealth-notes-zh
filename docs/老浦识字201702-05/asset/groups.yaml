    ![](img/792d2d18bbe99e723a0a2f17774d50d0_18_1.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_18_2.png)


    野猪性情暴躁，獠牙尖锐，冲劲很大，但一旦丢窝，性情就会变得温和，好吃懒睡，肉食习性。早在商代，人们就使用了这种技术。


    既然绝大多数的小猪要在出生以后两周内行阉割，那么猪宝宝接受传统报代任务就只能给曾经少种猪蛋。而那种强大的生殖能力，正是一个家族最看重的，这就是房子那头公猪的道理。'
