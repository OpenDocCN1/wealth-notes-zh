    # # 【牛】为什么这么牛？


    【牛】为什么这么牛？


    老编辑说：文章专栏内，文章中关于文字的字形字义，可以放大来着，细细品读。


    十二生肖之二是丑牛，不是说牛很丑，是说古24小时分为12个时辰，其中牛时是第1个时辰是子时，晚上11点到凌晨1点，丑时是第二个时辰，凌晨1点到3点。


    牛有4个胃室，牛是吃草的，休息的时候就会休息两个小时，可以反刍在胃里的食物反刍到嘴里再嚼一遍，这种情况就被称为反刍现象。牛是休息的时间，也是牛反刍的时间。这大概是在十二生肖中牛排第二的原因吧。


    牛体型庞大，力大无比，但性情温顺，任劳任怨，吃得是草，奉献的是奶，历来受到人们的喜爱。但问题是，这样温顺的动物，我们在日常口语中，常说某人很“牛”，“牛”是什么意思？


    我们通过解析字形，看能不能解答这个问题。


    # ## 牛字是大师之作


    牛字笔画虽少，却是实实在在的象形字。最早，古人在岩壁上画的牛，是庞大的实体。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_105_1.png)


    但是要用文字表现牛，需要简化。


    毕加索画牛，就是这样的路径。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_105_2.png)


    你可以看到，毕加索是一步步做减法，减掉大块的实体，留下线条，到最后，形简而简。


    但是中国人却发现了另一个更加简化的方法，那就是找到有代表性的局部。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_105_3.png)


    从图中我们可以看到，古人在一个牛头上，只留下最牛的牛角，一个横杠。


    牛耳，至牛的体，一笔带过，


    牛尾。


    # ## 牛是神宝之物


    金文，承续甲骨文的字形，规整圆润，像摆在祭坛上的牺牲。


    牺牲这个词，我们今天通顺做动词，“某某为国牺牲”，指的是为了信仰舍弃生命。但在古代，牺牲是名词，指祭祀用的贡品。


    牛在古代中国人的心目中是具有灵性的动物，可以崇拜，所以，在重大的祭祀仪式上一般都选用牛。


    所以“牺牲”都是牛字旁。具体来说，杀牛为“牺”，牛头为“胙”，牛色纯白的牛，是只有天子才能使用的最高等级的祭品。


    > > 《礼记·曲礼下》记载：

    > “凡祭……天子以牺牛，诸侯以肥牛，大夫以索牛，士以羊、豕。”


    “牺牲”是指整只的牛，“肥牛”即宰长肥壮的牛，“索牛”意思是经过筛选挑选出来的牛。


    被选定为祭品的牛要受到特别的待遇。《史记·老庄申韩列传》云：“祭祀之用养牛之道养，衣以文绣。”


    选用祭祀的牛还要受到人们的尊重，就连国君见到牲牛也要表示敬意。


    牛在农村社会至为重要。为了保护耕牛：

    西周就有“诸毋无故不杀牛”的规定；

    在汉朝，杀牛要连性命；

    在唐朝，牛主人自愿杀牛，判徒刑一年；

    在元朝则杖责一百；


    在宋和明时期，不管这头牛老得老得老得不能动了，还是意外倒地了，都是不能杀的，除非牛自然死亡。


    《水浒传》里描写好汉动不动就二斤牛肉下酒的描写，实际是不存在的。那时候谁能吃得起牛肉啊。


    今天印度神牛的待遇大概和中国古代有过之无不及。印度神牛不仅可以在大街上随便散步，还是受保护对象，到人家客厅溜达。这是宗教信仰使然，同时也反映社会对牛的尊重的反映。


    牛吧。


    # ## 牛是宙斯撩妹的神器


    隶书“牛”将篆文的一对尖角写成，使得字形完全失去动物形象。在中国古代传说中，地上的一物都是神牛下凡做成的，所以“物”是牛字旁。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_105_4.png)


    在希腊罗马神话里，宙斯就特别喜欢把自己变成一只外表俊美、性格温顺的大公牛，到世界各地找人类，和美人儿交配。


    传说有一次宙斯看中了某一个美女，就变作一头公牛引来她。美女们喜欢这只美丽的公牛，她们纷纷抚摸它，毫无防备地给公牛戴上花环，抚摸着牛背。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_105_5.png)'
  - '[PAGE 106]


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_106_0.png)


    宙斯牛蹲伏在他最喜爱的美女欧罗巴脚下，用一种十分爱慕的眼神看着欧罗巴。被迷得神魂颠倒的女孩竟然跨上了公牛的背。宙斯牛从地上一跃而起，劫走了女孩。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_106_1.png)


    宙斯把女孩带到一片未知的大陆，一番浪漫之后，宙斯离去，把女孩留在这片大陆上，并且以这个女孩的名字命名了这个大陆。


    女孩的名字叫欧罗巴，就是今天的欧洲。


    现在你明白了吧，为什么形容一个人厉害，你会情不自禁地脱口而出：牛！


    # 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_106_2.png)


    看网上的视频，西班牙奔牛节，人们在狭窄的街道躲避狂奔的蛮牛，不时有人被牛角挑飞。


    为什么要冒这么大风险去招惹牛呢？


    看过1500多场斗牛表演的海明威说：


    > > “斗牛为男人提供了一次展示智慧、胆识、技巧和意志的机会，胜者被当作英雄受到崇拜，这就是荣誉，而荣誉总是远远超出生命。”


    在追求生命和荣誉之间，男人应该毫不犹豫地选择追求荣誉。


    而追求荣誉的最大乐趣，就是感受到在死亡的控制下产生的对死亡的反抗。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_106_3.png)'
  md: '


    益，牺牲得越多，就越有道德的满足感。


    但是这种类似宗教的牺牲发展到极致，可能就很荒谬。比如二十四孝故事中的第12则“埋儿奉母”：


    晋代一个叫郭巨的，原本家道殷实。父亲死后，他把家产分作两份，给了两个弟弟，独自供养母亲，对母极孝。后家境逐渐贫困，妻子生下一个男孩，郭巨担心养这个孩子，必然影响供养母亲，就和妻子商量：“儿子可以再育，母亲死了不能复活，不如埋掉儿子，节省些粮食供养母亲。”


    当他们挖坑时，在地下二尺处忽见一坛黄金，上书“天赐郭巨，官不得取，民不得夺”。夫妻得到黄金，回家孝敬母亲，并得以兼养孩子。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_99_0.png)


    为了奉养老人竟然要杀死自己的儿子，这不仅荒谬，而且已经反人类了。


    孝道虽然基于亲情，但核心是不平等的封建礼法。


    这就是鲁迅说的礼教吃人。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_99_1.png)


    正常的亲子关系是爱，是双方共同呵护的一颗真心。


    ## 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_99_2.png)


    就在写这篇稿子的时候，正好看到朋友圈转发的一篇文章。


    心理学曾奇峰老师写给儿子的信《见字如面：孩子，我永远都不会跟你谈孝顺父母的事》：


    > “爸爸想告诉你，学习爱和被爱，是人生最重要的功课，有了你之后，爸爸才学会了给予爱。”


    > “爸爸从你那里得到的荣誉和鼓舞，远远地超过其他地方得的。”


    > “我永远都不会跟你谈论孝顺爸爸妈妈的事，因为我觉得，如果在你小时候我们对你很好的话，我们老了你自然会对我们好的。我不想把这样自然而然的亲情，当成伦理道德的压力施加给你。”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_100_0.png)


    ## 【慈行】慈母的心灵感应


    老编提示：订阅本栏后，文稿中的象形文字可能显示不全，放大来看，细细品读。


    昨天是周日，是母亲节，今天的「慈」字，就送给自己每一位母亲，节日：快乐！


    > 慈母手中线，游子身上衣。

    > 临行密密缝，意恐迟迟归。

    > 谁言寸草心，报得三春晖。


    这是唐朝诗人孟郊的《游子吟》，我们小时候都背过。每当读起这首诗，老妈妈在灯下一针针一线线缝补寒衣的温暖情景就会浮现在眼前。


    说到母爱，这大概是最经典的场景了吧。


    今天我们学习汉字，惊奇地发现，原来慈母的爱真的是这缕缕线，联系着母亲和子女的牵挂。


    「慈」母金文的上部是两个并排的幺，幺是表示桑蚕丝线的象形。幺丝很细，但韧性很强。两个幺表示缠绕在一起，是表示织成丝成缆。这一丝缠绕的丝就表示织成，加上心合在一起，表示母亲牵挂儿女的慈爱。


    《说文解字》说：慈，爱也。爱就是爱。


    24孝里的故事不多长，但有两个关于母亲的故事却相当合理。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_100_1.png)


    这是24孝中的一个故事《董永卖身葬父》，说的是一个叫董永的农民，由于没钱埋葬父亲，就把自己的**身**给卖了，当佣人还清债务。有一天，董永在大树下遇见一个美女，美女说自己丈夫死了，现在无家可归，愿意嫁给他相依为命。董永去请问财主，财主答应了，并说如果要100天内能够织出100匹细绢，就可以为自己赎身。美女日夜不停地织布，终于在100天内织出了100匹细绢，成功为董永赎身。


    下面就是「夫妻双双把家还」的场景了，没错，这《天仙配》就是根据这个故事改编的，原故事的结果令人**感**佩，董永**说**认真了七仙女，下界帮助董永**的**是孝行感动了上天，派她帮助董永的，说完自己上天了。所以故事发生的地方才改名作孝感。你跟我来我家呀，我挑水你浇园的日子幸福并没有实现。


    这个故事的孝道我们先不谈，单仙女织布，其实反映了农业社会妇女劳动的辛苦。


    这样的劳动，像丝线般的蚕丝，平凡得几乎令人看不见，但却绵延不绝没有尽头。


    20年前我曾经到陕西农村拍摄农家生活，我们的摄影**组**4点多起来就上路，在院子里等了许多人，最后起来的是**媳妇儿**，开始**生火**做饭。第一个起床的是**老太太**，老太太先去给家里喂的鸡、猪、牛等喂食，拿到门口的地上去。喂食完，拿起扫把扫房，从上扫到下。然后打扫完房间。这时，一家人就陆陆续续起来，劳动的一天就开始了。


    在农村，几乎所有的日用品都是自己解决的，线自己纺，布自己织，农衣自己缝，花**自己**做，一件洗了又洗，洗衣、喂猪喂羊喂驴，农忙的时候和男人一样下田、打场，当然，还有更重要的活儿，带孩子。


    我**记忆中**，**在**那个年代，虽然几个**孙辈**，衣服**破了**，但**母亲**织补是补**不**了的。**而**家里每个人身上厚实的毛衣，都是母亲一针一线织出来的。


    慈爱，就在这一针一线的辛劳当中。


    「慈」篆文的字上部**积**丝成缕的「**慈**」，更加清晰规整，而**慈**由丝线渐渐聚集成缕，引申出草木生生渐多的意思。可真真是「谁言寸草心，报得三春晖」。


    24孝里另一个和母亲有关的故事是「**恝痛**」和「**尝药**」的故事，讲的是儿子给母亲看病的。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_100_2.png)


    孔子的学生**曾参**侍奉母亲极其孝顺。曾参入山打柴，家里来了客人，母亲不知所措，**呼唤**曾参。曾参砍柴送回家中，**却听到母亲在屋内**。曾参说：「有客忽然到来，我**知道**。」


    这就是我们常说的心灵感应吧。**母**行千里还相依，儿行千里，那一根长长的丝线是**剪**不断的。


    最近在朋友圈里看到了一个新知：「量子纠缠」，说两个或者多个粒子在同一个状态纠缠，相互纠缠，相互影响，在空间上可能分割很远。当其中**一**粒被探测发生**变化**，另一粒也会即刻发生**变化**。爱因斯坦称量子纠缠为「鬼魅般的远距离作用」。


    这个实验为母子心灵感应找到了科学依据。


    我想，慈这个汉字中的丝线，就是量子纠缠中那一**缕**的爱心能量吧。母亲的关爱，就这样纠缠着你，无论走多远，**无论**如何**远**离故乡，**甚至阴阳相隔**，都让这慈爱继续缠绕着你。


    这是人间最美好的纠缠，最长不断的线。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_100_3.png)


    小时候感冒发烧，如果是初起，母亲两招就能治好。


    一招是用热毛巾擦拭身体，她会用很烫的毛巾把身体擦红。


    还有一招是刮痧，刮完，病就好了一半。


    那种被母亲照顾的感觉真是刻骨铭心。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_101_0.png)


