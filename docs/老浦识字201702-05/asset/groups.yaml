    ## 威的本质是作秀


    2016年中秋，阿里巴巴突然做了一个震惊全国的决定，有4名安全部员工，因为用技术手段作弊，多刷了124盒月饼而被开除。


    阿里巴巴集团认为，这四位安全员工采用技术手段作弊，对其他员工造成了福利分配的不公平。更重要的是，安全部员工作为平台规则的捍卫者，使用工具作弊，触及了诚信红线。


    有人认个问题大做了吧？罚点钱通报处理一下不就可以了，至于开除吗？


    想起一个故事。


    伍子胥向吴王推荐齐国大牛中孙武，吴王画说：有没有真本事试试他吧。


    就让孙武训练后宫的180名宫妾，让自己最喜爱的两个妃子做队长。


    女人爱美，在君王面前都更要爱，结果训练场上一片混乱，笑成一团。孙武喝止不住，祭出大斧，声称再不服从命令，就军法从事。


    宫女们被镇住了，可是两个妃子还是抽奸耍笑如故，孙武喝令将两个妃子斩首。


    吴王阖间赶紧求情，说这两个人睡不着觉。孙武坚请将军，军命有所不受。


    把两个妃子斩了。


    后来当然顺利了，这180名宫妾终于进入军训，不，是战争状态，令行禁止。


    但这和阿里巴巴是不是有点类似，小题大做了吧，打几板子不子吗？


    孙武说：


    > “将之谋道，贵在威成，威行于众，严行于吏，动三军才能动如一人。”


    说：


    大将军必须耍威，对公众立威，对官吏从严，这样，调动三军就如同调动一个人一样。


    这叫立威。


    ## 大斧子下面为什么是一个女人


    威，甲骨文还没发现，金文


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_2.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_3.png)


    子下面一个女字。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_4.png)


    这个字让我困惑了很久，刑具下有一个女人有什么必然的？


    《说文解字》说：“威，姬也。从女，从戈。”（“从”，表示意义跟“有关。”）


    “姑”在古代是指丈夫的母亲，我们今天叫婆婆。《尔雅·释亲》说：“（妇）称夫之母曰姑。”许慎的意思是说威就是姑，是婆婆，并且是威风尚是婆婆家。


    赞成这种说法的人，《孔雀东南飞》为例。《孔雀东南飞》讲述了一个叫焦仲卿的人，因为母亲不喜欢儿媳，强行把这封恩爱夫妻拆散，结果小两口双双自尽，认为婆婆在当时极有威势。


    这有点弄不通。这首汉乐府作于东汉，而在这字的商周时期，家庭还是典型的男权社会，难以想象为婆婆专门造这样一个字。


    还有人说这是吓唬女人。为什么要吓唬女人啊？


    还有人说这是对女子施刑。


    施行女子有专门的字：伐


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_5.png)


    那是拿大斧子斩首的


    象形，好像没必要专门造个大斧子施行字的。


    到底在女人面前举起一把吓人的大斧子要干嘛？


    ## 威是让人像女人一样顺眼


    回头去看“女”的甲骨文，这个问题就清楚了。


    甲骨文“女”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_6.png)


    是一个双手抱胸的人形，表示顺从安宁。


    比如“妥”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_7.png)


    ，是一只手


    按在女人头顶。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_8.png)


    “妄”


    是女人跪在房子里。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_9.png)


    “妻”


    是一只手抓往女人的头发，这是抢夺民俗的写照。


    总之“女”象征着顺眼。


    行刑大斧子下下一个女人，表示王权的威，令人民像女人一样顺眼。万岁万岁万万岁。


    当然现在女人早就不是懦弱的代名词了，从来也不是。那只是统治者的一厢情愿。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_10.png)


    “威”字我们能够读出三层意思：


    - 第一，“戌（xū）”作为行动巨斧，是一种暴力威慑的象征；

    - 第二，作为仪仗，本质上是作秀，表演给人看；

    - 第三，想让人民都像女人一样顺眼。


    小篆“威”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_11_11.png)


    ，斧刃延长，像一个钢铁的房屋，把象征顺眼的“女”牢牢笼罩其中，进入大一统的威权社会。

