    # 【夫】中国人是因为怕老婆才称妻子为夫人吗？


    【夫】中国人是因为怕老婆才称妻子为夫人吗？


    老浦提示：订阅老栏目，文稿中的象形文字可截可点，放大来看，细细品读。


    # “夫”字就是一个大男人


    朋友给我讲过一个笑话，说一个学汉语的外国人问：


    “中国人是不是因为怕老婆才称自己的妻子为夫人？”


    “什么意思？”


    外国人说：“夫人的夫是字头出去，就是比天还大。夫人的意思是不是比天还大的人？那还不是怕老婆？”


    我那朋友瞠目结舌不知如何应对。


    “夫”字最原始的含义是什么？甲骨文怎么写？


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_69_1.png)


    “夫”的甲骨文是“大”字上加上一横


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_69_2.png)


    “大”是一个成年男人正


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_69_3.png)


    面站立的象形，


    加上一横，


    表示一个男人年龄已经超过15岁，把头发束起来，用一根簪子别住。


    在古代，称一个人“束发”就是表示这个人已经成年，要承担成年男人的责任了。


    大丈夫的原始含义就是指成年人。为什么是丈夫？古代八寸为一尺，十尺为一丈，丈夫是指身高八尺接近一丈的男人，身材伟岸，大丈夫啊。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_69_4.png)


    # 夫人也很尊贵


    那夫人是怎么来的？


    夫人这个词最早出现在战国时期，我们前面谈到，女人尊称自己老公为夫，那么女人自己就是“夫之人”，简称“夫人”。


    既然是尊称，所以夫之人自然也是尊称。汉代列候之妻才能称夫人，汉代以后王公大臣之妻称夫人，唐、宋、明、清各朝还对高官的母亲或妻子加封，称诰命夫人。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_69_5.png)


    现代汉语的夫人大概来源于英文翻译，由于老外女士结婚以后从夫姓，所以在称呼的时候得冠以夫姓，比如希拉里得称克林顿夫人，宋庆龄得称孙夫人，宋美龄得称蒋夫人。


    民国还有个好玩的称呼，称小老婆为夫人，意思你懂的。


    # 成为“夫”的关键是管理自己


    夫字来源于古人头发，清朝以前，中国人一辈子不剪头发，就这么束在头顶，只有两种情况可以散开头发，一是出家，李白诗：人生在世不称意，明朝散发弄扁舟。散发意味着修道成仙。二是老了，头发散开表示可以不受拘束。可见，束头发表示承担责任，表示对自己的管理。


    说到自己的管理，想到了我的一个同学小万，这哥们是我见过学习能力最强，记忆力最好的人之一。上初三的时候，学校为了鼓励大家学习，规定期末考试只要六门功课门门过九十分，就是三好生。


    身为一个门门不及格的混混，小万居然去找年级主任问：“门课我要考过门门九十分，能得三'
  - "[PAGE 70]\n\n友表示承担管理，表示对自己的管理。\n\n说到对自己的管理，想到了我的一个同学小万，这可是在我见过的时候能力最强，记忆力最好的人之一。初初二的时候，学校为了鼓励大家学习，规定期末考试只要六门功课门门过九十分，就是三好学生。\n\
