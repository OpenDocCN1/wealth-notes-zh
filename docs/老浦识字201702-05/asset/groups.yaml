    # 【智】智慧的境界


    【智】智慧的境界


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_89_0.png)


    老编提示：订阅专栏后，文稿中的象形文字可截点开，放大来看，细细品读。


    进入2017年，人们越来越多地谈论人工智能。身为文科生，不知道为什么人们把机器人效用“智能”这样的称呼，因为在我看来，智能可不仅仅是冷冰冰的知识，而是生活者有温度的感悟。


    不过从解字的角度而言，智慧的“智”甲骨文就是认识的“知”。那么这么说，人工智能最大的特点就是海量的知识储备，还真当得起这个智慧的智字。


    不过还是算了，文科生谈论这个话题只能自取其辱。老编还是谈论中国智慧的化身诸葛亮吧，用传说中的诸葛亮，来诠释仁义礼智信的智。


    先声明，这里说的诸葛亮是《三国演义》中民间传说中的诸葛亮，不是易中天反复强调历史上真实的诸葛亮。


    # 智慧的基础是知识


    智的意思就是知识的知。甲骨文里的干


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_89_1.png)


    干，是远古最原始的武器：木槌子。加上一个代表弓箭的矢。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_89_2.png)


    木棍和弓箭中间，有一个代表话的口字，合起来表示谈论打仗的事。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_89_3.png)


    《说文解字》段玉裁注解说：


    > “知，识也。”


    意思是，“知”表示“认识”、“意识”很敏锐。


    “故出于口者疾知也。”


    说由于这人见识广，碰见事情马上可以做出判断，说出口的见解快得很射出去的前一样。


    所以智的第一解释是知识。


    知识从哪里来，从学校里学来。


    所有出名是智者都有种一样的师父。战国时期的孙膑、张仪、孙膑、庞涍，都出于鬼谷子门下。


    张良遇到“纪（yǐ）上老人”黄石公，一部《太公兵法》让他成为帝师。


    诸葛亮有师父吗？先琢磨有人分析，诸葛亮是世家子弟，先祖诸葛亮当过司隶校尉，从小一定受过良好的教养。成年以后，水镜先生司马徽，良方岳父都都给予他良的敦教。


    民间自流传的，说他是张道陵张天师的徒弟，自孙玄的师兄弟。


    智慧的根底是知识。传说中的这些智者，无不于上通天文，下知地理，阴阳术数无所不道，运筹帷幄之中，决胜千里之外。


    比如诸葛亮的东风，就是深谙气象学，料到冬至刮西北风，冬天，会有小阳春的吉象，这几天刮东南风。然后装作样子借东风，成就了火烧战船的杜举。


    至于八卦阵，一堆一堆的石头就能退兵。发明木牛流马，块块木运道运输粮草等，都是基础知识扎实的结果。


    但是真正的智慧，可不仅仅有知识就够了。


    # 智慧是洞悉人性


    金文”，承继甲骨文字形。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_89_4.png)


    有弓折、木棍和口组成。弓箭锋利，木棍朴实，正是人性的两面。


    洞悉人性是极大的智慧。


    首先得洞悉作者的人性。


    诸葛亮躬耕陇亩的荆襄地区是南北方势力的中心地带，势力最大的是北方的曹操、南方的孙权，近在咫尺的是刘表，选择哪家大公子任职呢？'
  - '[PAGE 90]


    的。舌战群儒、骂死王朗，比三英战吕布还精彩。


    舌战群儒，有点像当今的网络安全，上来一顿人身攻击。诸葛亮基本是一招制敌：有本事骂我，也不照照镜子，自己有多怂。


    骂死王朗，是戳到老家伙的痛点，就是一生苟且谄媚，引发老头心脑血管爆裂，阵前猝死。


    最精彩的还是诸葛亮吊孝，亲自前去吊唁被自己气死的周瑜。一篇长长的祭文，有理有据，有情有义，泪崩俱下，感动了所有人，不仅把恨得咬牙切齿的东吴战将打 动，还重新修复了联吴抗曹的大局。


    大智慧，好口才。


    # 智是超强的自我管理


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_90_0.png)


    那就是亏自己，利天下。


    诸葛亮的注册商标就是鞠躬尽瘁，死而后已，他真是累死的。


    司马懿抓了个蜀军的俘虏，问：你们丞相是怎么办公的？小兵说了两点，第一点是吃的很少；第二点是事必躬亲，二十军棍以上的处罚都要亲自审核。


    司马懿于是判断，吃得少，说明胃口不好。事无巨细都管，说明授权不够，早晚累死。


    果然累死了。


    诸葛亮生前曾经公布了自己的财产清单，桑树八百株，薄田十五顷，除了官俸外没有任何灰色收入。事后清查丞相府的资产，果真如此。


    严以律己，是诸葛亮推行法制的基础。也是他最为后人敬仰的品质。


    管理自己的欲望，亏欠自己，最终功成身退，是大智慧。


    老子说：


    > “功成、名遂、身退、天之道。”


    范蠡助越王勾践灭吴，功成身退，携西施泛舟五湖，终成财陶朱公。


    张良功成身退，辟谷修仙养生，终得善终。


    诸葛亮是贤相，也是权相，而权相在历史上通常没有好下场，个中区别，就在于是不是自律。


    民间演绎的诸葛亮虽然不是历史真实，但反映了中国文化对一个智者美好的想象。那就是学富五车，洞悉人性，口吐莲花，严以律己。不仅要有超强的智商，还要有很好的情商、财商。


    这可是人工智能永远达不到的境界。


    # —— 识字卡片 —


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_90_1.png)


    小清干过一件有点智慧的事，我爸经常用这件事吹牛。


    小学一年级刚入学，被老师分派，封了一个班级最小的官：小组长。


    小组长的任务只有一项，收自己这一排同学的作业，交给学习委员，送给老师。


    小清拿着鸡毛当令箭，工作一丝不苟。有一个孩子到时间迟交不交作业，小清在旁边立等，一言不合动手就抢。作业本撕坏了。同学大哭，“赔我作业本。”


    当时不知怎么想的。冲回自己座位，拿上书包，把书箱里所有的书本哗啦一下倒在同学桌上。


    撕吧！


    同学被镇住了，也不敢哭了。


    当时颇为自我以攻为守而得意。现在想来。只是犯浑吧。


