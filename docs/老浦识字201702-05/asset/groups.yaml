    # 【脑】古人心目中的最强大脑什么样


    老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    今天的【脑】字送给隔壁邱Dr. 魏：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_39_1.png)


    我们今天说一个人糊涂，形容他脑袋子进水了。


    但是考察古汉字，脑子的脑洞好像真是进水了。


    脑（zhòu）文是西周晚期的大篆文字，这是我找到的最早的大脑的象形文字，由一个四川的川，下面一个囟（xìn）门的形，组成。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_39_2.png)


    囟门是人头顶的部位，俗称天灵盖。


    在古人心目中，囟门是灵魂出入的地方，是通灵的。和“川”合起来，表示大脑的活动像川流不息的河流。


    这不光是进水了，而且进了大水。


    古人相信灵魂就藏在人脑里，而囟门则是灵魂的出入口。


    这是汉字儿童的象形，大大的脑袋，柔软的身体。你看这个孩子的头顶并没有封口，这是说这孩子的囟门还没有合拢。


    古人认为这个时候的孩子还可以通神，以后囟门长好，人与神灵的通道就断绝了。


    所以古人特别重视头顶上的头发，认为这是灵魂的守护者。


    汉族小孩头顶上的头发是不能剃的，留一个锅盖头。


    彝（yí）族头顶上的头发要编成小辫，这叫天菩萨，不可侵犯。


    满族头顶留辫子的习俗来自萨满教，认为头顶的辫子与天相连。


    灵魂居住在大脑里，一旦离开身体，就是得病，甚至死亡。灵魂出窍、失魂落魄，都是说灵魂需要安守。


    只有极少数异士才能掌控自己的灵魂。


    传说包公额头上有一个月牙印，这就是阴间的通行证。包公白天在人间断案，夜间，他的灵魂到阴间继续审案，明察秋毫。


    道家把灵魂概念发展成为内丹修炼的道法：“炼精化气，炼气化神，炼神还虚，炼虚合道”，这种修炼方法叫“倒转河车”，把丹田炼成的精气顺着脊柱向上导引，到达大脑，然后在大脑中将“气”转化为“神”。


    而这样的修炼，可以做到“三花聚顶”，仿佛头顶开了天窗，一片清凉。


    这样你就可以明白白寿星南极仙翁有那样一个超大的额头吧，那里面可是满满的精气神啊。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_39_6.png)


    这应该算古代东方的最强大脑了吧。


    要这么说，由此我想到，汉字囟门上的川形，会不会不是表示水，而是气。


    甲骨文空气的气是三根波动的线条，如果竖起来，不就是三花聚顶吗。


    哈哈，开玩笑。道教可比汉字晚多了。


    这种说法很玄，在我看来，大部分是人在静坐状态下产生的幻觉。


    不过大脑消耗氧气倒是真的。据科学家研究，大脑消耗的氧气占人体总耗氧量的25%。


    我个人的体会，以前做职业策划人，开一天会，明显感觉大脑缺氧，开车回家会很困。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_40_0.png)


    *《说文解字》*的意思是：脑是头颅里的精髓。“匕（bǐ）”表示人的后脑勺，“巛（chuán）”像人的头发，“囟（xìn）”像人脑的形状。


    脑在古人心目中是人体的精华，《*黄帝内经*》说：


    > “诸髓者皆属于脑”，“脑为髓之海。”


    *《说文解字》*对脑的解释比较抽象，把脑这个会意字解释成了象形字，不大令人信服。


    匕在汉字中是代表女性的符号，比如牝（pìn）鸡司晨的牝，字旁带一个“匕”，代表雌性。牝鸡司晨是说母鸡打鸣，不正常。“匕”代表雌性的汉字还有很多，现在已经不用了。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_40_1.png)


    这就奇怪了，为什么人脑子要加上一个女性符号，是说脑子是女人的好，男人没脑子？


    当然不能这么理解，在古代，女性符号往往代表生殖。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_40_2.png)


    这是之乎者也的“也”，也是代表蛇的“它”字，是女性的符号，大地的地（“也”字加土旁）就是在代表女性的“也”字加上“土”，表示土地生长万物。


    人文始祖女娲不就是人首蛇身的女性吗。


    “匕”这个代表女性的符号出现在脑上，表示大脑对生命力的生殖。


    而古希腊的智慧女神雅典娜，干脆就是从大脑出生的。


    希腊神话故事说，宙斯和大洋女神墨提斯相爱，有神预言，墨提斯生的女儿，会再生一个强于宙斯的儿子，推翻宙斯的统治。宙斯惧怕预言成真，将已经怀孕的墨提斯整个吞入腹中。


    代篆文的“七”强调“脑”是人体的组织器官。简化字脑给囟门加了个盖子，性彻底没有了，倒是多了不少烦恼。


    我们最后来看汉字思想的思，帮助我们更准确理解什么是中国古人心目中的最强大脑。


    思是囟门上加了一个心，心，囟门是通灵所在，而心代表人的感知和情绪，也可以说囟门是神性、理性的，而心则是感性的。


    在古人看来，心是思想重要的组成部分。


    女娲用泥土按照自己的样子捏成人形，粗手大脚，大而化之，注重感性。


    而从新石头部中诞生的雅典娜则更注重理性。


    她们都是古人心目中的最强大脑。


    # 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_41_0.png)


    字源演变：nào 𦣻 𦴓 𦸓 脑 脑 甲骨文 金文 篆书 隶书 楷书

    文字原意：像泡沫一样不停流动的男性器官 《老康识字》「得到」App出品


    我家老爷子九十岁了，耳不聋眼不花，声若洪钟，精神煊（jué）烁（shuò）。


    书法极好，当年铁道兵在朝鲜的烈士纪念碑的碑文，就是他写的，现在还在朝鲜立着。


    他每天写两个多小时书法，还喜欢写古体诗。


    尽管在我看来，他的诗意境平平，但平仄对仗绝对一丝不苟，有时候还会为了押韵或者平仄，把意思改了。


    面对我的质疑，他毫不在意，说我写字，写诗，都是做大脑体操，活动脑子就行。


    他是对的，难怪脑子这么好使。


    其实啊，今天这篇【脑】，原本并不在计划之列。


    我是看了最强大脑里的Dr.魏之后被圈了粉，听说他来讲专栏，甚是欢喜。


    Dr.魏将专栏内容分为五个板块，分别是：智力脑、语言脑、情绪脑、运动脑、创意脑，帮我们认知人的大脑运作规律，尤其是让孩子抢先享用最新和最靠谱的大脑科学研究成果，非常有价值。


    于是我特意写了一篇【脑】的解读，送给Dr.魏，也送给关注孩子大脑开发的你。


    直接点下面，可以去Dr.魏那里坐一坐。


