    # # 【比】别让别人给坑了


    【比】别让人给坑了


    老潘提示：订阅专栏后，文稿中的象形文字可截可点，放大来看，细细品读。


    # ## 比的目的是贬低他


    小时候我们最讨厌谁？没错，别人家孩子。


    这是一种绝望的比较，不论你怎样努力，永远有别人家孩子比你强。


    你语文好，别人家孩子拿了奥数冠军。你学习年级第一，别人家孩子考了钢琴九级。


    甲骨文的比，是两个人肩并肩站在一起，


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_33_1.png)


    原意是并排在一起的状


    态，比肩而立，鳞次栉比，海内存知己天涯若比邻，都是用的比字的原意。


    诸葛亮躬耕陇亩，还是村里一个普通农民的时候，自比管仲、乐（yuè）毅，就是要和这两个历史人物比肩而立。


    汉字用人形造字很有意思：


    两个人并肩站立为比


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_33_2.png)


    换个方向一前一后是从


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_33_3.png)


    一个正向一个反向是化


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_33_4.png)


    三个人在一起就是众


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_33_5.png)


    人与人的关系，从来都是中国文化最关注的问题。


    隶书


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_33_6.png)


    变形较大，将篆文的 “ 人 ” 写


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_33_7.png)


    成 “ 匕 ”（ bǐ ）


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_33_8.png)


    成了。


    两把匕（ bǐ）首了。而字义，引申为比较了。比较是两把匕（ bǐ）首，极其危险。


    # ## 恶毒的比用两个桃子就够了


    据《晏子春秋》记载，晏子在齐国为相，齐国当时有三个勇士，公孙接、田开疆、古冶子，为人相当傲慢。


    有一次，“晏子过而趋，三子者不起。”


    “趋”是一种小步快走的姿态，说身为宰相的晏子遇见三位勇士，很礼貌地低头弯腰而行，而这三家伙居然都无动于衷。


    这种无礼的举动让晏子感到了危机。


    于是晏子就去跟景公说，三个人能力功劳太大，恐怕管束不住，不如除掉他们。


    怕管不住就杀掉，这理由也是够奇葩的，而齐景公居然同意了。


    晏子让人捧来两个大桃子，让三人自己叙述功劳，谁的功劳大，谁就可以吃桃。


    这就是比啊。


    三个有勇无谋的家伙立刻上套了。


    公孙接说，我上山可以打猛虎，入林可以擒野猪，我当然可以吃桃。二话不说拿了一个桃。


    田开疆说，我是三军统帅，打败了那么多敌军，谁的功劳可以和我相提并论？也拿了一个桃。


    古冶子急了：“俺当年下乡杀了袭击国王的大鳖，救了国王一命，岸上的老百姓看着俺顶着巨鳖的出头来的时候，都以为是河神现身。这样的功劳不能吃俩吗？”说着拔出宝剑：“你们是不是该把桃子退出来？”


    退什么退，都吃进肚子里了。


    两人听了很惭愧，竟然拔剑自杀了。


    古冶子没想到会是这样的结果，也拔剑自刎（ wèn）了。


    这就是历史上著名的二桃杀三士的故事。


    对这个历史故事古代文人有多种解读：


    +   - 有称赞晏子智慧的；


    +   - 有感叹三勇士知耻的；


    +   - 有论诛杀功臣的。


    在老潘看来，三勇士是掉进比较的陷阱，被人玩了。


    以能力论，三人各有优势，并没有高下之分；以功劳论，杀猛虎和杀巨鳖其实没什么区别，开疆拓土更是不逊于救国王一命，也没什么高低之分，


