    车战一般要经历四个过程：


    +   * 次——扎营，与对方约定决战日期；

    * 致——单车挑战；

    * 阵——列阵；

    * 战——列阵出击，展开决战。


    在战斗中，不打负伤者；不打头发灰白 者；不打倒地认输者；甚至敌人战车发生 故障，就下车帮助修理好，再打；不以杀 人 为 宗 旨 ，而 以 击 溃 取 胜 ；对
    方 负 臣 走 跑过五十步就不追了。


    五十步笑百步的原意是跑五十步就够了， 何必要跑一百步。


    像奥林匹克吧？


    要不规矩短打呢？也行，就是被人看不 起，胜之不武。


    泓水之战成为贵族车战的绝唱。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_12.png)


    金文“武”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_13.png)


    与甲骨文


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_14.png)


    最大的变化就是代表行 进的“止”上移，成为与“戈”平行的符 号 。


    如果我们让“戈”这种兵器武器代表“千 乘之国”之间的车战，那么我们是不是也可 以 用 脚 的 象 形 “止” 来 代 表 步 兵 作 战 。


    “止”与“戈”的并列，象征着贵族车战 的终结，平民大规模参与的步战成为主 流。'
