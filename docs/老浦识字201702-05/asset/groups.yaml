  mdcn: "\n## 大\n\n大（dà）夫是古代官名。西周以后先秦诸侯国中，在国君之下有卿、大夫、士三级。大夫虽贵，有封地。后世演以大夫指称官阶阶层，乃至整个与官方有联系的知识阶层，是古代的中产阶级。\n\
    \n颜真卿是士大夫阶层的杰出代表，儒学功底深厚，为人刚直。由于性格耿直，多次被贬官。\n\n安史之乱，颜真卿是平原郡守，在河北24郡纷纷失守的情况下，犹如中流砥柱，一直坚守。晚年受到奸相妒恨，故意派他到叛军李希烈军中传达圣旨，最终为叛军杀害。\n\
    \n罗贯中评价：\n\n> “颜鲁公三朝旧臣，忠直刚决，名重海内，人所信服。然以耄（mào）耋（dié）之年，犹不能豫为退身之策，卒至陷于逆贼之手，良足悲矣。”\n\
    \n他赋诗：\n\n> “万古真卿义不磨，冲天豪气世间无。忠贞凛凛名犹在，烈烈轰轰大丈夫。”\n\n所谓字如其人，颜真卿为人光明正大，而他的书法，也是刚直沉郁，代表了中国文化审美的特征：大气。\n\
    \n大，是屹立于天地之中的大的人，是大丈夫磊磊落落大气磅礴的气量。同时，大不是虚荣，不是浮夸，不能为大所累。真正的大，是人的胸怀，就像古人说的：\n\n吞吐大荒，有容乃大。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_32_0.png)\n![](img/792d2d18bbe99e723a0a2f17774d50d0_32_1.png)\n\
    ![](img/792d2d18bbe99e723a0a2f17774d50d0_32_2.png)\n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_0.png)\n\
    \n## 【比】别让别人给坑了\n\n老潘提示：订阅专栏后，文稿中的象形文字可截可点，放大来看，细细品读。\n\n### 比的目的是贬低他\n\n小时候我们最讨厌谁？没错，别人家孩子。\n\
    \n这是一种绝望的比较，不论你怎样努力，永远有别人家孩子比你强。\n\n你语文好，别人家孩子拿了奥数冠军。你学习年级第一，别人家孩子考了钢琴九级。\n\n\
    甲骨文的比，是两个人肩并肩站在一起，\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_1.png)\n\n原意是并排在一起的状态，比肩而立，鳞次栉比，海内存知己天涯若比邻，都是用的比字的原意。\n\
    \n诸葛亮躬耕陇亩，还是村里一个普通农民的时候，自比管仲、乐（yuè）毅，就是要和这两个历史人物比肩而立。\n\n汉字用人形造字很有意思：\n\n- 两个人并肩站立为比\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_2.png)\n\n- 换个方向一前一后是从\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_3.png)\n\
    \n- 一个正向一个反向是化\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_4.png)\n\n- 三个人在一起就是众\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_5.png)\n\n人与人的关系，从来都是中国文化最关注的问题。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_6.png)\n\n隶书变形较大，将篆文的“人”写\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_7.png)\n\
    \n成“匕”（bǐ）\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_33_8.png)\n\n成了。\n\n两把匕（bǐ）首了。而字义，引申为比较了。比较是两把匕（bǐ）首，极其危险。\n\
    \n### 恶毒的比用两个桃子就够了\n\n据《晏子春秋》记载，晏子在齐国为相，齐国当时有三个勇士，公孙接、田开疆、古冶子，为人相当傲慢。\n\n有一次，“晏子过而趋，三子者不起。”\n\
    \n“趋”是一种小步快走的姿态，说身为宰相的晏子遇见三位勇士，很礼貌地低头弯腰而行，而这三家伙居然都无动于衷。\n\n这种无礼的举动让晏子感到了危机。\n\n\
    于是晏子就去跟景公说，三个人能力功劳太大，恐怕管束不住，不如除掉他们。\n\n怕管不住就杀掉，这理由也是够奇葩的，而齐景公居然同意了。\n\n晏子让人捧来两个大桃子，让三人自己叙述功劳，谁的功劳大，谁就可以吃桃。\n\
    \n这就是比啊。\n\n三个有勇无谋的家伙立刻上套了。\n\n公孙接说，我上山可以打猛虎，入林可以擒野猪，我当然可以吃桃。二话不说拿了一个桃。\n\n田开疆说，我是三军统帅，打败了那么多敌军，谁的功劳可以和我相提并论？也拿了一个桃。\n\
    \n古冶子急了：“俺当年下乡杀了袭击国王的大鳖，救了国王一命，岸上的老百姓看着俺顶着巨鳖的出头来的时候，都以为是河神现身。这样的功劳不能吃俩吗？”说着拔出宝剑：“你们是不是该把桃子退出来？”\n\
    \n退什么退，都吃进肚子里了。\n\n两人听了很惭愧，竟然拔剑自杀了。\n\n古冶子没想到会是这样的结果，也拔剑自刎（wèn）了。\n\n这就是历史上著名的二桃杀三士的故事。\n\
    \n对这个历史故事古代文人有多种解读：\n\n- 有称赞晏子智慧的；\n- 有感叹三勇士知耻的；\n- 有论诛杀功臣的。\n\n在老潘看来，三勇士是掉进比较的陷阱，被人玩了。\n\
    \n以能力论，三人各有优势，并没有高下之分；以功劳论，杀猛虎和杀巨鳖其实没什么区别，开疆拓土更是不逊于救国王一命，也没什么高低之分，关键是阴险的晏子就拿了两个桃，于是三个平时很仗义的哥们就此分裂，而知耻的优秀品质被利用，三个人就此丢了性命。\n\
    \n可见这比字真真正正是两把匕首，能要人命。\n\n### 比的后面都有一个纷争女神\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_34_0.png)\n\
    \n这是“比”字书写的多种字体，这些笔画灵动的字体有一个共同的特点，就是左右的“七”要大小形参差，决不能一模一样。\n\n这固然书法艺术上避免呆板，其实也隐含着比较的本质，那就是世界上没有一样的人和事，只要有比较，就会有高低下下，就会有纷争。\n\
    \n无独有偶，东方的桃子可以杀人，西方的苹果也可以杀人。\n\n男人不能随便比，女人比量起来更加不得了，能够血流成河。\n\n希腊神话有一个故事：阿喀琉斯的父母举办盛大婚礼时，邀请了所有的神，单把纷争女神厄里倪俄漏了。\n\
    \n宴会进行时，厄里斯来了，在桌上扔下一只金苹果，上面刻着“给最美丽者”几个字。\n\n女人谁不认为自己是美？\n\n这样马上发生争执。天后赫拉、智慧女神雅典娜、爱神阿佛洛狄忒（tè）3人吵得最凶，争执不下就去找宙斯，宙斯要她们找特洛伊王子帕里斯这个凡人青年评判。\n\
    \n神仙打架，凡人评判。\n\n最后，帕里斯选中了年轻漂亮的爱神，便使她得到了金苹果，因为他觉得，身为王子，权力是可以继承的，智慧他自我感觉还不错，美女嘛，嘿嘿。\n\
    \n后来的事情大家都知道了，帕里斯在爱神的帮助下，勾引了希腊第一美女，斯巴达的王后海伦，从而引发了特洛伊战争。人间血流成河。\n\n其实大家都被纷争女神厄里倪俄玩儿了。\n\
    \n最美的金苹果只有一个，比去，比，只要比，必然纷争。在这点上，东西方的认识高度一致。\n\n### 诸葛亮也怕比\n\n青年诸葛亮在干农业的时候，除了自己管理，比较，还“好为《梁甫吟》”。《梁甫吟》是什么？\n\
    \n> 步出城西门，遥望荡阴里。\n> 里有三坟，累累正相似。\n> 问是谁家冢，田横古治子。\n> 力能排南山，又能绝地纪。\n> 一朝被污言，二桃杀三士。\n\
    > 谁为此谋，相国齐晏子。\n\n哈哈，说的就是二桃杀三士的故事。那么诸葛亮是怎样评价这件事的呢？\n\n> “一朝被污言，二桃杀三士。”\n\n诸葛亮说的是谎话，玩儿屎的。\n\
    \n> “谁为此谋，相国齐晏子。”\n\n谁设计了让人比较的阴谋，国相，国家领导人，坏事是打着国家利益的旗号干，政治从来不是什么高尚的，而是玩弄高尚的。\n\
    \n注意他称晏婴为晏子，子是对男子的尊称，能称之为子的通常是流传千古的大儒：孔子、孟子、老子、庄子、朱子。\n\n晏婴在这里被搞得晏子，暗示此人言行谗（chàn）言，如生与相国，死称晏子。\n\
    \n三个勇士已是三坟荒冢（zhǒng），而这样一个玩人的的人却能称为与圣贤齐名的晏子，难道人心就是这么无耻。\n\n我们从小都在比，比学习成绩，比大学，比名牌，比房子车子，比就是生活，在这无穷的比较中，比这两把匕首处处割裂我们的人格。要知道，都是属于规则制定者在所有比较的背后，如同纷争女神厄里倪俄斯在明暗中有阴谋，所以聪明人都明白，只是自己跟自己比，而绝不落入让人比较的圈套。\n\
    \n比可以，但千万别让人玩儿了。\n\n## 识字卡片\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_34_1.png)\n\
    \n我姐姐是个不可救药的乐观主义者，她儿子初中的时候，学习成绩很差。\n\n差到什么程度？通常和另一个高个子男孩竞争年级第一，倒数的，而且是年级的倒数。\n\
    \n但我姐姐似乎并不着急，由着他玩游戏。\n\n上高中以后这孩子脑洞大开，开始喜欢读书，以后每学期家庭聚会，老姐就吹牛，儿子进步了二十多名，下学期又进步了几十多名。你问她排多少名？还在二百名。\n\
    \n起点低就有这个好处，上升空间大啊。到高三，他已经是班里的学习委员了。现在他像同学，经常娶妻生子工作顺利。像我这辈人，已经娶妻生子工作顺的太少了。\n\n\
    ![](img/792d2d18bbe99e723a0a2f17774d50d0_34_2.png)\n\n## 【车】历史的车轮也有掉的时候\n\n老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。\n\
    \n### 车的发明是打仗用的\n\n《路史》中说，4600年前，黄帝在空桑山发明了车，横木为轩，直木为辕，故号曰轩辕氏。\n\n黄帝是中华文明的始祖，他用有轮子的车，拉开了中华文明的序幕。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_35_0.png)\n![](img/792d2d18bbe99e723a0a2f17774d50d0_35_1.png)\n\
    \n这是甲骨文的车，黄帝发明的车大概就是这个样子吧。有两个轮子，一个车厢。\n\n有轮子的车和火的使用一样，是石器时代人类最重要的发明。这是甲骨文沉重的重，一个人背着沉重的包袱。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_35_2.png)\n\n有了车，人们可以使用畜（chù）力拉车，运力提高了30倍。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_35_3.png)\n\n这个甲骨文写法有一个车厢，单辕，两幅（fú）挽（wǎn）具，显然是两匹马牵引。\n\
    \n这可是最早的豪华战车。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_35_4.png)\n\n考古学家可不承认黄帝造车的传说，人类最早的车发现于古巴比伦。\n\
    \n美国著名人类学家罗伯特·路威曾断言：凡使用轮车的民族，无一不是直接间接从巴比伦学来的。\n\n这是埃及图坦卡蒙墓中出土的古埃及战车，和甲骨文的车字几乎一模一样。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_35_5.png)\n![](img/792d2d18bbe99e723a0a2f17774d50d0_36_0.png)\n\
    \n和古巴比伦、埃及、希腊一样，中国最早的车也是作为战车使用的。\n\n这种写法的甲骨文明显是一辆战车，非常结实。\n\n西方的战车最早是单人驾驭，是统帅的座驾，交战的时候需要下车步战。\n\
    \n好莱坞大片《特洛伊》中阿喀琉斯单车到特洛伊城下挑战就是这样驾车的。他击杀了特洛伊的赫克托耳，并把他的尸体绑在战车上拖回营地。\n\n中国的战车一开始就有一个结实的轿厢，像坦克一样，是作为大规模杀伤性武器直接上阵冲杀的。\n\
    \n战车每车驾2匹或4匹马。君子一言，驷马难追的“驷”，就是指这种战车。\n\n战车每车载甲士3名，按左、中、右排列。\n\n- 左方甲士持弓，主射，是一车之首，称“车左”。\n\
    - 右方甲士执戈，主击刺，并为战车排除障碍之责，称“车右”。\n- 居中的是驾驭战车的御者，随身携带短剑。\n\n车下步兵72人，后勤25人。\n\n只有贵族才有资格乘车征战。\n\
    \n战车打仗是有严格礼仪的，有点类似骑士决斗。\n\n两军摆好阵势，各出一辆战车驰（chí）骋（chéng），为“致师”，然后按照约定进攻或防守。\n\n\
    ![](img/792d2d18bbe99e723a0a2f17774d50d0_36_1.png)\n\n至春秋时期，战车已经成为国家实力的象征，千乘之国、万乘之国，都是以战车的数量表现国家军事力量的规模。\n\
    \n### 车自古以来就是摆摆场的\n\n这是金文的车字，相当气派。车从黄帝发明时起，就是王的座驾，天子的仪仗，身份的标志。\n\n鲁迅先生说：“从前孔子周游列国的时候，所坐的是牛车。”\n\
    \n鲁迅先生这次大概说错了，孔子周游列国以前，曾经做过鲁国大夫，按照礼制他应该御马车。\n\n当初拜访老子，就是：\n\n> “一乘车，两马，一竖子具，适周问礼，盖见老子云。”\n\
    \n说当年孔子驾着两匹马拉的车，带着一个随从，到周的都城，拜访国家图书馆馆长，请教礼的细节。孔子应该是自己当司机，驾驭马车的。\n\n御是周六艺之一，是君子基本的技能，也是身份的表现。\n\
    \n孟尝君的门客冯谖（xuān）弹剑作歌，闹待遇，也是抱怨食无鱼，出无车。\n\n头悬梁锥刺股的苏秦苦读出来游说赵国成功，赵王为苏秦准备的是五百辆新车，黄金千镒（yì，一镒为20或24两），白璧一百双，锦绣千匹，请苏秦代表赵国邀约其他诸侯国加盟。\n\
    \n这些车都是摆谱用的。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_36_2.png)\n\n### 历史的车轮居然掉了\n\
    \n马车的衰落是因为马。\n\n首先是单骑的马取代了笨重的战车，赵武灵王胡服骑射，就是为了适应马鞍上的骑兵。\n\n战车作为贵族礼仪的产物，在《孙子兵法》兵者诡道的实用理念中，退出了历史舞台。\n\
    \n其余韵，倒是在欧洲中世纪骑士风度中得以再现。\n\n其次是缺马。\n\n中原地区是农业区，缺马，西北草原是牧区，最不缺的就是马。\n\n谁有马，谁就有了快速移动的运载工具，就有了战场上的主动权。\n\
    \n汉武帝之所以能够打败匈奴，得益于他的祖父汉文帝和父亲汉景帝大规模地养马。\n\n但汉末战乱，人都快绝绝了，何况马。皇帝的座驾都找不出四匹颜色相同的马，大臣们只好坐牛车。\n\
    \n魏晋时期，士大夫竞以牛车为时尚。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_37_0.png)\n\n“车”字的演变\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_37_1.png)\n\n有趣的是，中国人竟然发明了独轮车。相传独轮车是诸葛亮为了解决蜀道狭窄，运粮艰难而发明的，叫木牛流马。\n\
    \n中原缺马，牛也贵啊。\n\n那么何便宜，人便宜，加上道路差，以人推为动力的独轮车就应运而生了。别看只有一个轮子，载重量惊人。\n\n民间传说，为了试验鲁修建造的赵州桥是否结实，柴荣推独轮车载着五岳名山上了桥，现在桥上还有车辙印。这当然是民间神话，但看了下面这张照片，您就可以体会这独轮车的厉害了。\n\
    \n文本中的历史图片你一定要打开看看，内容丰富，一看就懂。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_37_2.png)\n\
    \n这是轿舆的舆（yú），原\n\n意思是众人抬起的车厢，\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_37_3.png)\n\
    \n这是车厢，在车的专用名词中，舆就指车厢。没有轮子的车就是轿子。\n\n轿子是道路的产物，路难走，又颠屁股，皇帝说把轮子去掉给我抬着走。这就是四只手抬着车厢的舆了。\n\
    \n和现在很多小孩一样，我们小时候也喜\n\n欢坐马路牙子上看汽车。\n\n那时候简单，各级首长坐车就那么几个\n\n牌子，团级坐伏尔加，师级坐华沙，兵团级坐吉姆，领导人坐吉斯，后来坐大\n\
    \n红旗。\n\n我们施工部队的小孩最常见的是北京吉\n\n普，团首长、师首长都坐这车。\n\n当时部队还有两种进口吉普车，苏联的\n\n嘎斯69和英国的英吉普。\n\
    \n英吉普还叫兰特罗娃，很少见的浅绿\n\n色，鼻子扁进去，样子有点奇怪。司机\n\n们都说这车是铝合金的，特别不好修。\n\n我们那时候哪几知道，这是二战退役的\n\
    \n路虎。\n\n上世纪七十年代，我父亲在云南修铁\n\n路，有一次差点掉进山崖，被一棵树挡\n\n住，当时坐的就是这种英吉普。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_38_0.png)\n\
    \n哈哈。\n\n我看见很多朋友对书法颇有兴趣，生发了陪\n\n大家一起写字的念头。\n\n如果你愿意和我一起练习书法，可以去看\n\n我们的学习小组——「老浦识字班」里看\n\
    \n看，那里有一个#小调查#，留下你对学习\n\n书法的期待，入口就在下方。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_38_1.png)\n\
    \n另外，若能和孩子一起进步，善莫大焉。\n\n## 用户留言\n\n- **小小羊** (4楼)\n    老浦老师您好，今天有关“车”的源流讲\n\n\
