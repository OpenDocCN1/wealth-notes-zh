    # 【天】地利人和真的能胜过天时吗


    +   - 【天】地利人和真的能胜过天... - 689 3698... 1


    老浦提示：订阅专栏后，文稿中的象形文字可截可点，放大来看，细细品读。


    # 啥叫天意


    明末崇祯年间，李白成逼近京城。朝廷上下一片慌乱，崇祯皇帝一筹莫展，有一天想出去散散心，碰上了一个测字先生，说那就测个字吧。


    先生说：“客官您想测个什么字啊？”


    崇祯皇帝随手在测字先生桌上写了一个“友”字。


    测字先生问崇祯皇帝：“先生要问何事？”


    “我问社稷。”


    “哎呀，不好！您看，这‘友’字是反字出头，不好。”


    “不对，我说的是‘有无’的‘有’。”


    “先生您这次问何事？”


    “还是问社稷。”


    “也不好。您看，这个‘有’字，上面是大字去掉一半，少一捺，下面是明字去掉一半，没有日光剥月了，大明江山去了一大半啊。”


    “不不不对，不是‘有无’的‘有’，是‘申猴酉鸡’的‘酉’。”崇祯皇帝急了。


    “那这回问什么？”


    “还是问社稷！”


    “完了，完了，”测字先生在纸上写了一个斗大的“酉”字，在上面添了“两点”，下面添了一个“寸”字，是一个“九五至尊”的“尊”字。


    “您看，至尊的皇上，上无头上无脚，大凶。”


    崇祯皇帝在把脖子伸进上吊绳子之前，一定幽怨地看了一眼被李自成大军照的火光映红的天空：这不是朕的过错，全是天意。


    # 老天爷你到底啥意思


    在中国文化里，如果找一个全民都认同的信仰，那大概就是天了。天是一种不可抗拒规律，叫天道。


    天是人间善恶的监督者，天知地知你知我知，老天爷看着呢。


    天还是最终的惩罚者，干了缺德事天打五雷轰。


    所以，揣摩天的意志，找到天时，那就是一件非常神圣的事了。


    天意自古高难问，难问就更得问。


    这就是甲骨文的“天”字，是一个人戴着高高的帽子，站在空旷的山巅，高举双手大声祈祷。


    应该是一个巫师的形象 [图示1] 。


    天，就是他头顶上那片虚空。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_72_1.png)


    怎样才能晓得老天爷的想法呢？占卜。


    3300多年前的商朝是最敬畏鬼神的朝代，所以占卜使用最贵重的材料：牛的肩胛骨和乌龟的腹甲。


    别逗了，这有什么贵重的？


    牛不是一般人可以随便宰杀的，那是最高等级的祭品，只有重大活动才会用牛祭祀，而一头牛才有两块肩胛骨。


    龟在当时水草丰茂的安阳虽然不少，但你要是参观过安阳甲骨文博物馆就会明白，占卜用的龟甲非常巨大，应该是遥远的海边贩运过来的，在当时的交通条件下，珍贵程度可想而知。


    同样从海边运回来的贝壳，是中国最早的货币。


    材料珍贵，可使用量却很大。天气、打仗、打猎、生孩子等等，古人生活的方方面面都要看老天爷的脸色。


    商人占卜，先大声向天声明要问什么事，然后说“”，烧灼裂纹路什么方向算命，什么方向算凶，一次只能问一个问题。


    比如问“能不能打猎啊？”烧一次。


    “哪天好？”烧一次。


    “去哪里好啊？”烧一次。


    “何时出发？”烧一次。


    “用什么方法？”烧一次。


    “带什么人去？”烧一次。


    “天气如何？”烧一次。'
  md: "\n## 【眺】望见未来\n\n老师提示：订阅读专栏后，文稿中的象形文字可截可点，放大来看，细细品读。\n\n在以前的文章中，我们聊到了两个和眼光有关的字——“限”和“望”。\n\
    \n说明了你身处的位置决定了你的见识，身悬崖下，眼光受到制约。登到高处释目远望，胸襟自然开阔。\n\n登高望远已经是眼光最高处了，还能看的更远吗？\n\n\
    ### 人世间的千里眼\n\n我们现在当然可以看得更远了，用望远镜啊。\n\n有新闻报道说中国参与建造了目前世界上最大的天文望远镜，镜头镜面的直径达到三十米。三十米什么概念，我们手机上的镜头只有几毫米，清晰度已经很好了，三十米，比现在最先进的哈勃望远镜还要清晰10倍，2022年投入使用以后，相信会有更多宇宙的秘密会被人类发现。\n\
    \n古人和我们一样，想看得更远。神话传说是有千里眼，玉帝的侦察兵，他可以在云端往下看。《西游记》描写孙猴子出生，一道金光直冲天际，玉帝忙差(chāi)千里眼、顺风耳前去查看，回来报告说下界有一石猴出生，眼露神光，先拜天地，再拜四方。\n\
