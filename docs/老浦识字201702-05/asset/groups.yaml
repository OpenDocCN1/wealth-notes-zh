    \n“也不好。您看，这个‘有’字，上面是大字去掉一半，少一捺，下面是明字去掉一半，没有日光剥月了，大明江山去了一大半啊。”\n\n“不不不对，不是‘有无’的‘有’，是‘申猴酉鸡’的‘酉’。”崇祯皇帝急了。\n\
    \n“那这回问什么？”\n\n“还是问社稷！”\n\n“完了，完了，”测字先生在纸上写了一个斗大的“酉”字，在上面添了“两点”，下面添了一个“寸”字，是一个“九五至尊”的“尊”字。\n\
    \n“您看，至尊的皇上，上无头上无脚，大凶。”\n\n崇祯皇帝在把脖子伸进上吊绳子之前，一定幽怨地看了一眼被李自成大军照的火光映红的天空：这不是朕的过错，全是天意。\n\
    \n### 老天爷你到底啥意思\n\n在中国文化里，如果找一个全民都认同的信仰，那大概就是天了。天是一种不可抗拒规律，叫天道。\n\n天是人间善恶的监督者，天知地知你知我知，老天爷看着呢。\n\
    \n天还是最终的惩罚者，干了缺德事天打五雷轰。\n\n所以，揣摩天的意志，找到天时，那就是一件非常神圣的事了。\n\n天意自古高难问，难问就更得问。\n\n\
    这就是甲骨文的“天”字，是一个人戴着高高的帽子，站在空旷的山巅，高举双手大声祈祷。\n\n应该是一个巫师的形象 [图示1] 。\n\n天，就是他头顶上那片虚空。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_72_1.png)\n\n怎样才能晓得老天爷的想法呢？占卜。\n\n\
    3300多年前的商朝是最敬畏鬼神的朝代，所以占卜使用最贵重的材料：牛的肩胛骨和乌龟的腹甲。\n\n别逗了，这有什么贵重的？\n\n牛不是一般人可以随便宰杀的，那是最高等级的祭品，只有重大活动才会用牛祭祀，而一头牛才有两块肩胛骨。\n\
    \n龟在当时水草丰茂的安阳虽然不少，但你要是参观过安阳甲骨文博物馆就会明白，占卜用的龟甲非常巨大，应该是遥远的海边贩运过来的，在当时的交通条件下，珍贵程度可想而知。\n\
    \n同样从海边运回来的贝壳，是中国最早的货币。\n\n材料珍贵，可使用量却很大。天气、打仗、打猎、生孩子等等，古人生活的方方面面都要看老天爷的脸色。\n\n\
    商人占卜，先大声向天声明要问什么事，然后说“”，烧灼裂纹路什么方向算命，什么方向算凶，一次只能问一个问题。\n\n比如问“能不能打猎啊？”烧一次。\n\n\
    “哪天好？”烧一次。\n\n“去哪里好啊？”烧一次。\n\n“何时出发？”烧一次。\n\n“用什么方法？”烧一次。\n\n“带什么人去？”烧一次。\n\n\
    “天气如何？”烧一次。\n"
  mdcn: "\n## 【眺】望见未来\n\n老师提示：订阅读专栏后，文稿中的象形文字可截可点，放大来看，细细品读。\n\n在以前的文章中，我们聊到了两个和眼光有关的字——“限”和“望”。\n\
    \n说明了你身处的位置决定了你的见识，身悬崖下，眼光受到制约。登到高处释目远望，胸襟自然开阔。\n\n登高望远已经是眼光最高处了，还能看的更远吗？\n\n\
    ### 人世间的千里眼\n\n我们现在当然可以看得更远了，用望远镜啊。\n\n有新闻报道说中国参与建造了目前世界上最大的天文望远镜，镜头镜面的直径达到三十米。三十米什么概念，我们手机上的镜头只有几毫米，清晰度已经很好了，三十米，比现在最先进的哈勃望远镜还要清晰10倍，2022年投入使用以后，相信会有更多宇宙的秘密会被人类发现。\n\
    \n古人和我们一样，想看得更远。神话传说是有千里眼，玉帝的侦察兵，他可以在云端往下看。《西游记》描写孙猴子出生，一道金光直冲天际，玉帝忙差(chāi)千里眼、顺风耳前去查看，回来报告说下界有一石猴出生，眼露神光，先拜天地，再拜四方。\n\
    \n在远古的现实中，没有望远镜，还能看得更远吗？\n\n还真有这样的字，古人以为自己能。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_66_1.png)\n\
    \n“眺”是目字旁加先兆的“兆”，目字旁表示用眼睛看，兆的原意是龟甲兽骨占卜烧出来的裂纹。龟占、骨占据信是最灵验的占卜方法，我可以跟你聊过，周代的人极重迷信，什么事都要烧块龟甲骨卜一番，甲骨文就是这么诞生的。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_66_2.png)\n\n“眺”是后造的字，甲骨文、金文都没有，显然用的是“兆”的引申义，加上代表眼睛的“目”，合起来表示望向更远方。成为神一样的千里眼。\n\
    \n### 改变历史的一次眺望\n\n1492年，哥伦布的帆船已经在大海中航行了两个多月。疾病、饥饿和茫无尽头的恐惧让船员们的精神接近崩溃。他们以叛乱相威胁，拒绝继续向西航行。哥伦布经过艰苦的谈判，最后商定：3天，再向西航行3天，如果还见不到陆地，就返航。\n\
    \n3天，水手每天都爬到桅杆最高处向前方眺望。第三天，“陆地！陆地！”，水手大声高呼。\n\n这是1492年10月12日，这一天后来被定为西班牙的国庆日，而这次眺望，改变了历史。\n\
    \n大航海时代的来临，证明地球是圆的，新兴的工业文明成为世界的主流。西班牙、葡萄牙、荷兰、英国，最后是美国，都是从海上眺望著世界，成为海上崛起的世界大国。\n\
    \n### 微观世界的眺望\n\n这是眺望的“眺”的草书：\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_66_3.png)\n\
    \n很像一个踮起脚尖向远方张望，而两旁的四点又有了很多不确定的感觉。当我们迷茫时，当我们盼望时，我们会登高眺望。\n\n“舒高凝眺、临风舒啸”。\n\n但眺来至占卜的原意告诉我们，预见未来不一定要登高，有时候，科技会引领我们进入微观的大千世界。在那里，我们对未来的预见可能更加靠谱。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_66_4.png)\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_67_0.png)\n\
    \n汉字“兆”的原意，是巫师根据龟甲上的裂纹，来破译上天的意向。当代对密码的破译，不是巫师，而是科学。\n\n二次大战期间，英国人为破译德国密码，发明了计算机，而这个发明，和哥伦布水手桅杆上的跳望一样，又一次改变了世界。\n\
    \n当我们每天拿着手机制屏的时候，是图灵的计算机告诉我们，世界是平的，海内存知己，天涯若比邻，已经是当代的现实。\n\n图灵当年破译的，哪里仅仅是德国的密码，分明是一把打开未来世界的钥匙。\n\
    \n风起于青萍之末，浪成于微澜之间。龟甲骨骨上的细纹，不起眼，却耐人寻味。汉字“眺”告诉我们，望向更远的未来，反而要收回眼光，仔细观察眼前的细节。\n\n\
    我倒觉得我们每个人手里都有的手机，用好了，对于预见未来，更靠谱。\n\n### 识字卡片\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_67_1.png)\n\
    \n**字源演变：**\ntiao\n铁 缺 眇 眺 眺\n甲骨文 金文 篆书 隶书 楷书\n\n**文字原意：**\n就像占卜能预知未来，望向远处\n\n\
    上世纪八十年代读过一本书特别震撼，《第三次浪潮》。\n\n当时托夫勒的预让让我们对未来十分畏惧又充满期待：\n\n- 跨国企业将盛行；\n- 不用朝九晚五上班，电脑发明使SOHO（在家工作）成为可能；\n\
