    爷爷被拐走，葫芦娃很生气，后果很严重：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_9_0.png)


    ## 别人的女人不能抢，会出大事


    汉字金文“怒”：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_9_1.png)


    上边是一个“女”，表示女人；一个“又”，表示手，这是一个“奴”字


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_9_2.png)


    。在古代，女人经常被抢，沦为奴隶。


    下边一个“心”，表示一种心理状态。手抓住了女人，就怒了。古人是什么意思呢？


    有人解释说因为成为奴隶，内心愤怒；还有人解释这是一只成猪手，骚扰了女人，女人怒了。


    要搞清楚这个问题，还要看另外一个汉字——妻子的“妻”。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_9_3.png)


    。在这里又看到了“女”，也看到了“又”——那只野蛮的手。


    不过区别是这只手扯掉了女人的头发，表示对这个女人的控制。女人跨坐的姿势表示征服，而头发上的三个短横，表示荆钗（chai，荆枝做的簪钗），是为人妻的标志。


    ## 怒是可以管理的


    小时候看电影《林则徐》，对林则徐书房里“制怒”的条幅印象很深，第一次了解情绪管理。


    韩信身材高大，穷困潦倒却整天挎一挎宝剑，被流氓欺负：你持一把剑敢杀人吗？有本事杀了我，不敢，从老子胯下钻过去。


    韩信没怒，真俯身钻了过去。


    张良刺秦始皇失手，流落江湖，忽遇一老人，鞋掉到桥下：小子，给我把鞋拾上来。


    张良没怒，老老实实把鞋给老人拾了上来。


    韩信后来成了开国功臣，衣锦还乡，给当年胯下之辱的混混封了个小兵，显示自己的威风；张良得到了老人的秘籍，成为一代帝师。


    他们都是管理愤怒情绪的高人。


    大文豪苏东坡在《留侯论》中说：


    > “古之所谓豪杰之士者，必有过人之节。人情有所不能忍者，匹夫见辱，拔剑而起，挺身而斗，此不足为勇也。天下有大勇者，卒然临之而不惊，无故加之而不怒。此其所挟持者甚大，而其志甚远也。”


    说：


    一个普通人被侮辱，自然会愤怒，跟人玩命，但这根本称不上勇敢。真正勇敢的，猛然遭到打击，不惊，无缘无故的侮辱，不怒，为什么能做到这样？那是因为他心里面目标很大，志向高远，这些小事不会干扰他的情绪。


    说白了，就是心胸广大，自然不怒自威。


    通过汉字怒的解读，我们了解到怒的原始意义是女人被抢的愤怒，也了解了受到压迫后愤怒的爆发，我们更加知道，怒气毁掉了多少英雄，而真正的英雄，是能够管理自己情绪的人。


    不怒自威。


    有一次一个北京电视台的小编导坐我的车前去录影棚，她新买的mini cooper送去修了。


    我们从东边穿过长安街来到石景山，快下车的时候她喊：潘老师您脾气真好，这一路您都没有骂人。


    我吃了一惊，问：为什么要骂人？


    她说：刚才好几个人在你面前乱开，您都让着，我都想骂，在您面前没收。要我早骂一路了。


    我问：你开车都会骂吗？


    她说：开车肯定会骂啊，这路上多乱啊，我开我的朋友都骂。在我的概念里开车就没有不骂的。


    路怒症。


    最后说明一下咱们这个专栏的更新时间：每周一、三、五晚的7点7分。


    之所以没有选择每天更新，是因为每个汉字背后的典故和引申非常多，需要你慢慢消化、细细思考，并结合自身让它落到实处。


    体会汉字背后的奇妙，让知识作用于生活，这是我的初衷。


