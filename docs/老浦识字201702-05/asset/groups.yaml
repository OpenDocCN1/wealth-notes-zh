    大（dà）夫是古代官名。西周以后先秦诸侯国中，在国君之下有卿、大夫、士三级。大夫虽贵，有封地。后世演以大夫指称官阶阶层，乃至整个与官方有联系的知识阶层，是古代的中产阶级。


    颜真卿是士大夫阶层的杰出代表，儒学功底深厚，为人刚直。由于性格耿直，多次被贬官。


    安史之乱，颜真卿是平原郡守，在河北24郡纷纷失守的情况下，犹如中流砥柱，一直坚守。晚年受到奸相妒恨，故意派他到叛军李希烈军中传达圣旨，最终为叛军杀害。


