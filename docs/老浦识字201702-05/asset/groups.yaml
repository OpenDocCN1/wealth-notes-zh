    \n关羽不懂这道理吗？就算不懂道理，难道不怕死吗？\n\n这就要谈到老诸识字独家对仗字的解读：\n\n# ## 义字里面有一个大大的我字\n\n在简化字之前，义字下面都有一个大大的我字。\n\
