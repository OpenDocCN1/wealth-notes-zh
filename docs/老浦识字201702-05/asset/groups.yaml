    ## 【射】射字和矮字真的搞反了？


    老猫提示：订阅专栏后，文稿中的象形文字可截可观，放大来看，细细品读。


    高晓松在他的脱口秀节目《晓说》中说：射击的射和高矮的矮造反了，“射”字是身、寸和子只写寸造反不矮吗，而矮是失（shí）子旁，矢（shǐ）是箭，姿是放弃，矢加委不矮是射箭吗，这两个字造反了。


    他说，小时候上学就发现了这个问题，问了几个老师都说不清。这么明显的错误，大家也没人去纠（jiào）正。


    他可真没碰上老好师。


    ## 射字甲骨文长什么样


    既然说是造字造反了，自然要找甲骨文看看。


    甲骨文的射


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_29_1.png)


    是弓箭的弓


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_29_2.png)


    上搭了一个箭矢（shǐ）


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_29_3.png)


    ，那个弓就是英文大写的B型字，然后在B字中间有一横，表示弯弓搭箭的射箭动作。箭搭在弓上是“射”，箭竖在弓后是引而不发的“引”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_29_4.png)


    ；


    汉字还有一种表现方式，金文，是铸造在青铜器上的。这是和甲骨文同时期的文字，但写法上和甲骨文不同。


    金文


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_29_5.png)


    射保留了甲骨文B加一横的造型，但在那一横后面，也就是箭尾加上手


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_29_6.png)


    的象形。弯弓搭箭的意思就表达得更加清楚了。


    ## 哪里出的错


    那么射字的这个“弓”是怎么变成“身”了呢？


    古汉字不像现在，是没有标准的，每个人手写都有些差异，有的变异会很大，文字学家称之为讹（é）变。“射”字就是讹（é）变比较大的一个字。


    石鼓文是秦晚期的石刻，比较接近秦始皇统一文字的小篆时期，石鼓文上的射字


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_29_7.png)


    和金文一样，还是一个弓箭加上一个代表手的又，但是变形较大，“弓”形已经很接近身体的身了。


    孔子用了用来表示嗅觉，说明他那么就用错了，然后就一直这样错用，居然挤走了正确的嗅字，我们现在一般不说嗅着味就来了。


    这种情况就是语言文字使用中的约定俗成，以前《北京晚报》曾经用过一场争论，读者来信说“恢复疲劳”逻辑上不通嘛，应该是恢复体，恢复健康，怎么能恢复疲劳呢？后来语言学家出来解释，逻辑上是不通，约定俗成，都这么说就这么用了。


    字在使用中会出错，但错并没有在造字阶段。高晓松的错就在于用现在的字形去解释造字时候的字形，就像你不能用孔子后裔的长相推测孔子的长相一样。你看看北大钱教授，可我敢说也不信孔子老子长这样。当然我不敢说钱教授长得怎样，只是说经过这么多代演变，中间变异很大。


    ## 汉字可以很好玩


    但按照现在的字形联想解释出一些人生含义，倒是汉字的另一种玩法。台湾的作家林清玄就很喜欢拆字，他把“茶”解释成草木中人，茶道最高境界就是天人合一。“情”，左边是心，右边是青，这说明，心要清澈才是情。网上还有很多类似的拆字品人的玩法，如：


    - 令：“今”天努力一“点”，明天才有资格指挥别人。

    - 骗：一旦被人看穿，“马”上就会被人看“扁”。

    - 劣：平时“少”出“力”，到头来必然差人一等。

    - 值：站得“亻”，“人”的身份才高。


    好的经典不怕恶搞，好的文字也不怕瞎玩。还是要感谢高晓松，以他的影响力，让更多年轻人关注汉字，进而喜欢汉字，不管从哪儿门进来，你都会发现一个丰富多彩的汉字大千世界，善莫大焉。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_30_0.png)


    我的名字浦湥经常被念错，尤其运动会点录的时候，浦宜、浦演甚至谱仪地乱叫，每年都这样，我都习惯了。


    有一年校运动会我报了跳高，同学邱磊（网名馋人，是旅家，摄影家）非说我不行，他要替我去跳。


    结果我裁判一喊“59号浦湥”，邱磊就一举手，蹦着两条大长腿跨越式过杆，引来一片喝彩。


    可惜最后没拿到名次，否则大喇叭里宣布名次，浦宜，第一名，就更好玩了。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_30_1.png)


