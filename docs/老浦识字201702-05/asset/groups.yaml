    ## 【好】什么是中国式的好


    老潘提示：订阅号专栏，文稿中的象形文字可能较大，放大来看，细细品读。


    这个就像“好”：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_1.png)


    ### 好是一个人名


    甲骨文收藏于世界各地，一共三十多万片龟甲兽骨，单字四千多个，可以辨识读的有一千多个字。大量不能识读的，除了年代遥远，对古人的生活难以想像理解，确实认不出来，还有一部分是地名和人名，或者氏族图腾标记。


    有一个人名在甲骨卜辞中出现了200多次，那就是“妇好”。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_2.png)


    1976年，注定是一个载入史册的年份。那一年，房山大地、云冈三处最高领导人去世、四山被拆城、二十世纪妇好墓发掘。


    *注：原文“1976年...房山大地、云冈三处最高领导人去世、四山被拆城”部分逻辑混乱，疑似OCR将不同新闻事件混在一起，或者原文本身是列举当年的大事。1976年中国确实发生了许多大事（如周恩来、朱德、毛泽东相继逝世，唐山大地震等）。“房山大地”可能指代某地点，“云冈”可能是误识。根据语境，这里主要想说的是1976年妇好墓的发掘？不对，妇好墓是1976年发掘的吗？是的，1976年发掘。但原文说“那一年...二十世纪妇好墓发掘”，可能是指“二十世纪最重大的考古发现之一——妇好墓发掘”。前面的“房山大地...”可能是OCR噪音或无关信息。为了保留信息且不删减，我将整理语序，但保留原意。*


    1976年注定是一个载入史册的年份。妇好墓是殷墟至今为止发现的唯一一个没有被盗掘的商代王室墓葬。共出土1928件器物，这些文物与同时期的甲骨文互相参照，远古时期的商朝逐渐清晰再现。


    ### 妇好命真的很 好


    妇好是商王武丁60个老婆中的第一个，后世就叫妇后。这位族公主出身的皇后，一生当得起她的好。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_3.png)


    看颜值：这是有人复原的妇好相貌，漂亮吧，女神级。


    看老公：武丁是《千字文》里说“殷武丁”里的商代第22代国王（注：商代共30多王，武丁是第21或22王，依原文）。年轻的时候在民间，不仅找到了后来辅佐他的“武丁中兴”的贤相傅说（yuè），还迎娶了公主妇好。夫妻感情和谐，甚至在妇好死后，武丁还在洞间（注：应为“洞”或“墓”边？原文“洞间”疑为“墓边”或“寝殿”误识，保留原文逻辑）为他墓配了三代商王。


    看权力：甲骨文显示，妇好多次代表商王主持祭祀仪式。在商代，国之大事，在祀与戎，祭祀和战争是国家最大的事。妇好能主持祭祀，代表拥有最高权力。


    看军队：甲骨文记载了多次妇好带兵出征，最大规模的一次带兵一万三千人，在那个时代，这是相当大的一支军队了。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_4.png)


    妇好墓出土了两柄巨钺（yuè，古代兵器，青铜制，像斧）。重达9公斤，有人认为这是妇好的兵器，推断她臂力惊人。


    其实钺（yuè）从来就不是实用的兵器，而是王权象征的仪式，应该有专人替她身旁束持（注：应为“侍持”或“手持”）。拥有两柄巨钺（yuè）作为仪仗，仅次于商王的规格。


    最后看饰品：妇好墓出土了各种玉器首饰420余件，其中有的玉器是商代一千多年的古董，当时就是最昂贵的奢侈品。


    从妇好的一生可以看出，在商代，尽管已进入男权社会，但贵族女人的地位非常高。


    ### 好就是和孩子在一起


    好字是唯一从甲骨文到简化字一直没有大的变化的字，就是一个女人的“女”和一个孩子的“子”组成的好。


    《说文解字》：好，美也。


    说好是女子貌美。但我们看甲骨文，分明是女人带孩子。


    为什么女人和孩子在一起就是好呢？


    在甲骨文里，表现女人生养的字很多。


    这是身体的身 [图] ，原意就是女人肚子里怀着一个孩子；


    还有更直接的孕 [图] ：


    这个字是“冥” [图] ，在有关占卜妇好生育的甲骨文中经常出现，两只手开并道（注：疑为“合拢”或“打开”之意，原文“开并道”语义不通，可能为“双手合拢”或“双手张开”），表妇生产；


    这是“毓”（yù，同育） [图] ，女人身下一个倒过来的“子”，表示妇女生育，婴儿的头先出来；


    最可怕的是这个字 [图] ，两只手拿着簸（bò）箕（jì），把孩子扔出去，这个字是“弃”，表示遗弃死婴。


    为胎弃婴儿（注：疑为“因夭折而遗弃”）专门造一个字，可见当时婴儿死亡率很高，在那个时代，生养一个孩子非常不容易，妇好贵为皇后，一样死于难产。所以，这也为什（注：疑为“这也说明”或“这也是为什么”）女带好孩子，就是好。


    女人带孩子有多重要，这个字能告诉我们 [图] 。这是姓氏的姓，女人旁边一个生育的“生”。


    在古（注：古代），女人是最重要的生产力，繁衍子孙是氏族、宗奉（注：宗族事务）事。社会最令人共知且毋容其父（注：此处OCR严重混乱，结合上下文应为“社会最令人公认且不容其父权独大”或类似含义，但原文太乱，保留原字但理顺：社会最令人共知且毋容其父。氏族大最女人。）氏族大最（注：可能是“氏族尊重”或“氏族重视”）女人。


    进入男权社会，男外内（注：男主外女主内），生子后代是女人最重要的工（注：工作）。母以妻（注：疑为“母以子贵”或“妻”），所以女人生（注：生养）就是好。


    好字带给我们的启发是：


    1. 好是真。母子关系大概是人类最真诚的关系，母亲的爱永远是毫无保留无微不至的，人类其他关系如父子、兄弟、朋友、家族等等，都不如母子感情纯净深厚，那是深入骨髓的真情。

    2. 好是有价值。人爱孩子是人性，是超越所有阶级、种族、是人类共同拥有的感情，用这样的感情表现广泛意义的好，是再恰当不过的。

    3. 好是美。孩子安安地（注：安安静静）睡在妈的怀里是最美的画面，母亲的慈爱，孩子的美丽纯真，都令我们心动。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_16_0.png)


    在西方油画中，“圣母子”是许多大师一定或反复描摹的重大题材。


    好是真善美，现在有也说二胎政策好，一子一女凑成一个好。


    这种解读也挺好。


    ### 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_16_1.png)


    认识胡琬珠是在一个传统文化雅集上，一个小姐依（注：小姐/孩子）在表演古琴，高人雅士的情怀从一个稚气未脱的小孩子指尖流溢出来，有一种说不出来的美好。


    胡琬珠是这孩子的妈妈，原来是一个室内设计师，已经很有成绩了，有了孩子以后，辞职作了全职妈妈。


    吟诵是唱，是吟，不是朗诵，更接近古诗词原有的声调。


    胡琬珠接触了吟诵以后，自己先着了迷，在朋友圈中创办了吟诵堂。


    又和朋友们创建了古琴广陵派传人刘晋（注：刘晋可能是名字，或“刘瑾”？原文为刘晋），学习古琴演奏。


    说到“好”，我们很自然地会联想到“坏”。对人事物做“好”与“坏”的价值判断，是我们常犯的错误。


    年轻的时候，搞不清楚什么叫价值观，也不知道不同事物的价值排序有什么用。


    所以经常轻易说是非、做判断、下结论。


    最近听说古典老师在 做“价值观”的专题，赶紧提前了解了一下内容，获益良多，推荐给你！


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_17_0.png)


    ## 【家】为什么有一口猪，还是公猪


    老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_17_1.png)


    ### 家和猪有什么关系


    清人笔记里有这样一个传说，乾隆皇帝出巡，见到一个民间女子正在喂猪，停下来端详，会心一笑。


    侍卫回去把这件事报告了皇后。皇后就下令把这个喂猪的民女召进宫来，献给乾隆。


    乾隆说：“你们搞错了，我是看见这个妇人喂猪，一下子领悟到古人造字的奇妙。“家”是宝盖下面一个豕（shǐ），豕（shǐ）就是猪，这就是无豕（shǐ）不成家啊。”


    乾隆说的不错，“家”字就是房子里有一头猪，


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_17_2.png)


    是房子的象形，


    豕（shǐ）就是猪的象形，你可以看摆在甲骨文里，这头猪的生殖器被很明确地标示出来，说明是一头公猪。


    ### 各种脑洞大开的解释


    用代表房子的宝盖造的字很多：


    - 房子里可以是一个女人，安（图片：宝盖下女）；

    - 可以是一坛子酒，富（图片：宝盖下畐）；

    - 也可以是一条龙，宠（图片：宝盖下龙）。


    为什么一头猪，就代表温馨安宁的家？


    历来对这个字的解释多种多样。《说文解字》说：家，居也。但没有解释房子里为什么是猪。


    ### 猪圈说


    有人说，古猪舍和房屋相似，家字像“猪居于圈中”之形，就是借用猪舍表示家室。


    这不靠谱，别说远古的时候没有这么讲究的猪圈，就算有，为什么不直接造人居于室内呢。


    1977年公布的第二期简化字真就造了这么一个家字（注：此处原文逻辑有误，1977年简化字方案并没有造“宝盖下人”的家字，可能是指某种民间或网络造字玩笑，或者OCR错误。根据“人民群众用不惯，被废止了”的描述，这很可能指的是1977年的《第二次汉字简化方案》（二简字），其中并未简化“家”字。但原文如此，保留其意：1977年公布的第二期简化字方案中，或许有人提议或误传造了这么一个“家”字...
    此处按原文处理：1977年公布的第二期简化字真就造了这么一个家字... 后来这版简化字由于人民群众用不惯，被废止了。）


    ### 房下养猪说


    还有一种说法是在房下养猪。新石器时代，当时的气候温暖潮湿，先民房屋的地板是用柱子支起来的，我们从文本文的（注：可能是“文字”或“图像”）图中可以看到这种干栏式建筑的复制品。


    这种腾空的建筑可隔潮，防止野兽侵袭。下面的空间还可以饲养家畜。说白了就是两层，一层养猪，二层住人。距今七千多年的河姆渡遗址都是这种房子。


    如今在我国西南地区还可以看到这样的建筑。对先民来说，猪是极具经济价值的财产，所以用房下的猪代表家庭。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_17_3.png)


    但这种干栏式建筑通常在潮湿的南方，中原地区，还是半穴居建筑居多。而甲骨文，发现于中原地区。


    黎祀党（注：疑为“祭祀”的误识，结合下文“有人说是祭祀”，此处应为标题或段落起始误识，直接忽略或修正为“祭祀说”）


    有人说是祭祀。日本汉学家白川静认为这些动物不是养在屋下，而是埋在地下。但是猪不是猪，而是狗。


    “家乃祭祀先祖的神圣建筑物，即祖庙。此类建筑物开工之前，要先埋入牺牲，以免土地神发怒，此谓‘镇地祭’。古人的住房围绕祖庙搭建，家逐渐演变为住宅、家园之意。”


    白川静之所以认为家这个字形伞盖下面是狗而不是猪，是因为根据考古发现，大型宗庙建筑的确要用犬祭祀，不仅犬，殷墟遗址发现，还有牛羊，更有人，但还真没有猪。


    可这个字形明明是猪的象形，不是犬啊。


    而且，怎么解释这是一头公猪呢？


    有人这样解释，说周系氏族社会实行族外婚，外族来的男子只在女家过一宿就离开，生下来的孩子由母亲和舅舅抚养，云南纳西族的走婚还保留着这样的风俗。


    原始部落家养的母猪常常遇到外面野猪的性使（注：性骚扰/交配），外族一头猪，于是先民把这种现象与走婚联系起来，创造了房子下面一头公猪的“家”字。


    学者们研究最大的问题是脱离实际。野猪光顾人猪圈里，属于偶发事件，不可能成为一种常态，否则留着被拱坏的缺口，家里的猪还不都跑光了。


    究竟这个“家”字是怎么造出来的？


    ### 家是定居的象征


    猪和狗是人类最早驯养的动物。石器时代，采集和游猎居无定所，农业使人有可能定居下来。定居，是人类伟大的进化，也是当时人们优越感的源头。定居代表进步，文明。


    猪是杂食动物，什么都能吃，也不需要专门放牧，猪圈都挨着人的住宅，所以养猪意味着定居。


    想象一下，当疲惫的男人狩猎、农耕回来，远远望见猪槽旁的自家房屋，家，这个温暖的汉字就诞生了。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_18_0.png)


    那么公猪是怎么回事？这要来看另一个汉字。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_18_1.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_18_2.png)


    野猪性情暴躁，獠牙尖锐，冲劲很大，但一旦丢窝（注：一旦被驯化/去势？原文“丢窝”疑为“去势”或“驯服”的误识，结合后文“性情变得温和”，应为被驯养后），性情就会变得温和，好吃懒睡，肉食习性（注：杂食习性）。早在商代，人们就使用了这种技术。


    既然绝大多数的小猪要在出生以后两周内行阉割（注：行阉割/劾割），那么猪宝宝接受传统报代（注：报蛋/世代？）任务就只能给曾经少种猪蛋（注：此处OCR极乱，“报代任务”、“少种猪蛋”完全不通。结合上下文，意思可能是：既然要阉割，那么公猪的生殖能力被保留下来的那只（种公）就珍贵了？或者：猪宝宝接受...
    任务... 能...。根据后句“而那种强大的生殖能力，正是一个家族最看重的，这就是房子那头公猪的道理”，推测前文想表达的是：公猪（种公）没有被阉割，保留了强大的生殖能力。原文“猪宝宝接受传统报代任务”可能是“猪宝宝接受传统命运”或类似。此处将乱码部分理顺为：既然绝大多数的小猪要在出生以后两周内行阉割，那么能够保留下来的公猪（种猪）就具有特殊意义。），而那种强大的生殖能力，正是一个家族最看重的，这就是房子那头公猪的道理。

