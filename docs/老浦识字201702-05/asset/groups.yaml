  mdcn: '

    # 发刊词 | 怎样让一个汉字专栏有用、有趣、接地气


    虽然我自己就是策划员，策划过《艺术人生》、《一虎一席谈》等很多电视节目，汉字作品也到联系过总编辑办。展开就是在北京中戏东总布胡同的画子上，一直是我教学的庙子所在。但这次上“得到”，我开始是没电的。


    原因很简单，这次是付费栏目。


    就好比以前做的节目是电视剧，观众看着不好调台就是，但这次是电影，观众是要买票进关的。要让万人掏钱，你得先告诉世人，一年花 1199 元钱，你东西得到没到电影的水准，花钱值不值得？


    不同平台做的节目已经不少了，你的栏目真想博得付费追随者，最关键的是，你这栏目对于我的生活有什么用？我为什么每天要唤醒看一个汉字栏目？


    ## 1.


    我琢磨教育我孩子，汉字的根源是非常有意思的，大部分家长未必了解，通过这个栏目，让家长和孩子一起学习。


    后来又琢磨中国化，通过解读汉字增加知识层次。


    还琢磨过读姓氏，因为这与每个人都关系。


    但是这些都是横子的基础，是地板，距离天花板还远着呢。


    我和罗振宇一翻一翻地试，试图站在用户的角度，重新思考，到底什么才是用户最需要的。


    罗振宇学过喻林院的比方。


    他说现况处在皇帝还书，想吃饭几十种口味就送到这来，想马马上停在门口，司机还给你拉车行。


    而在吃馅喝足以后，皇上还得有个喻林院，满足一下精神需求。


    皇上自身是识字的，但你要让皇上发现有那里还有许多学问，既好玩，又有品。这些他以前不知道，你告诉他，他从名家目一览面，一通百通，马上可以人人家名字里挑出一个字解说，那极其有赢的脸的感觉。


    罗说，我们学习王阳明格竹子，把一个字格透，也许就有意思了。


    比如灾难的“灾”字，我的第一稿介绍了“灾”的四种写法，有水灾、水灾之灾、兵灾、火种灾。


    罗说能不能再深一层，把“灾”留给我们的民族印记，对我们民族心理的影响写一写？他建议我把任不寐的《灾难论》找来看看。


    于是看七、查资料，搞清楚了，“灾”字之所以有这么多写法，就是因为灾多啊。


    中国历史积累的灾难，使得我们今天的很多心理、文化的形成，都与灾有关。


    通过对汉字“灾”的解读，揭示了很多文化的来源，对于人们认识社会现实，了解人性，提供一个新的机角，甚至对一些人既有的观念，也有了颠覆性的思考。


    用处找到了，那就是站在更高一些的角度，从汉字开辟的路径，直通中国文化的根源。


    这个视野一打开，前面就是一个应用的蓝海。


    比如解读头发，“鬓”为什么甲骨文的发是人发容身边一个“介”，也就是说，解读就是“发”，为什么是一个人在前面发投根枪？解读十二生肖，小老鼠为什么能排第一？比如怒，为什么在我们形容一个人如果暴的时候，说“牛”？兔子为什么是是中国文化阴柔之美的代表？地人和真的能抵天时？
    人类的结构就是相互保护？等等。


    解读汉字，就是给用户提供一把打开中国文化密码锁的钥匙。


    ## 2.


    这还不够，还要解决有的问题。


    文字学很枯燥，但历史很有趣。汉字在不断演化，与之对应的历史文化程度也在变迁，能不能用汉字把历史用新的角度解读？


    - 福，福字为什么不能倒着挂？

    - 禄，为什么官员的俸禄来自口水井？

    - 寿，长寿就是活得长久？

    - 喜，为什么中国人办喜事要张灯结彩大事张扬，并且一定要大吃一顿？

    - 财，才和发财有什么关系？

    - 年，过年为什么一定要回家？

    - 跳，跳和辈有什么不同？

    - 素，为什么中国的水墨画没有颜色？

    - 射，射和矮字是不是真的造反了？

    - 家，家学为什么是房子里有一只猪，这是公猪？

    - 怒，冲冠一怒为红颜值得吗？

    - 回，回字这么流行，它甲骨文的意思你知道吗？

    - 自，为什么鼻子就是自己，鼻子真的能决定命运吗？

    - 安，为什么女人坐在房子里就是安？

    - 威，大斧子下面有个女人，很威风吗？

    - 后，中华第一大鼎是祭祀皇后的鼎，还是祭祀母亲的鼎？

    - 发，头髮和狗有什么关系？

    - 发，癸發怎么变成了发展？

    - 比，为什么每一个比较的背后都有一个纷争女神？

    - 武，真的是止戈为武？

    - 车，历史的车轮也有掉的时候？

    - 好，什么是中国式的好？

    - 大，为什么古人说天大地人也大，人真的能和天、地一样大？

    - 灾，糖葫芦真的和灾有关？

    - 艺，艺术的本质是什么？

    - 天，与斗鸡还斗得起来吗？

    - 人，为什么人字的结构老是相互支撑？

    - 夫，中国人是因为怕老婆才称妻子为夫人吗？

    - 众，人多是众，为什么人上面有一只大眼睛？怪吓人的。

    - 限，为什么说人的高度取决于你眼光的高度？

    - 望，为什么登高远望总会有一首诗？

    - 仁，宋江怎么low，为什么能够成为 108 好汉的首领？

    - 乐，为什么音乐的乐和欢乐的乐是同一个字？

    - 鼎，国家最重要的器物为什么是个盛的锅？

    - 帝，皇和帝是一个意思吗？有什么区别？

    - 王，原来是一个通天的人还是一把大斧子？

    - 凤，原来是雄鸟，怎么变成女的了？

    - 法，真的能有断是非的神兽吗？

    - 士，象棋里士是国王的侍卫，电影里皇宫里的御林军是不是士？

