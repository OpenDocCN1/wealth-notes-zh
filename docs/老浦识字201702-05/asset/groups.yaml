    # **独立的个体与集体**


    东西方文化对人的认识上有相同，也有相异。这个雕像是古希腊时期的雕像《掷铁饼者》，一个独立的男人的形体。这也是世界文化史上一个经典的雕像，非常的优雅，非常的有力量。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_26_0.png)


    我们再看这一组雕像，这是兵马俑，虽然面孔各异，但是给我们最大的震撼不在于它的个体，而在于这个军队，这个集体。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_26_1.png)


    这两组雕像表现的是东西方在人的着眼点上的不同，西方的着眼点在个体，而东方的着眼点更多的是在集体，在集团。


    # **人字的结构变成互相支撑**


    这是隶书“人”，一撇一捺，它成了“人”字的互相支撑。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_26_2.png)


    其实在古代，与其说是人互相依靠，不如说是人管理人。


    自从商鞅变法以后，人就被编成户籍，被严格地管理了起来，秦国就变成了一个集权社会。在这样一种环境下，人的个性是逐渐地，一步一步地被压抑，被削弱，强调的是王权。


    这种等级制度我们从宰相地位的变迁就可以很直观地能够感受出来。


    在先秦，宰相地位很高，曾仲枚得杏公尊称为“仲父”，范雎也被项羽尊称为“亚父”，“亚”就是第二的意思。在秦朝的朝堂上，朝臣们都是坐着议事的。到了汉朝，三公坐而论道。唐朝，宰相的权力也很大。


    但是到了宋朝，赵匡胤有一次使了个阴招，当时的宰相是范质。有一次赵匡胤跟范质说，奏折上这个字我怎么看不清楚啊？范质说你看一眼。范质就被拉起来，过去指给他看，说完了回事，座位已经被太监撤掉了，从此宰相的地位就从朝堂上消失了。所有的大臣在朝堂上议事都只能站着了。而到了明朝更惨，一言不合扒下衣服就打屁股。你能想象如今开理事会的时候，一言不合董事长扒下一个部门经理的衣服就打屁股？到了清朝，那就是奴才，只能是跪着，这个时候人就已经被贬得很低了。这反映了封建专制制度在一步一步贬低人的独立性。


    与此不同的是，我们看这个雕像，这是很著名的米开朗基罗的《大卫》雕像，气质跟古希腊的雕像很不一样，就是文艺复兴。文艺复兴复兴的是古希腊罗马的精神，实际上是重新肯定了人的价值。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_26_3.png)


    到了后来的启蒙运动，进一步肯定了天赋人权和人的自由。西方能够后来居上，超越东方的其他国家，一个很重要的原因就是它确立了人的价值。


    现在我们已经进入网络时代，个体个性的自由得到空前发挥、解放，这是一个非常好的现象。


    我还是更喜欢甲骨文的这个字形，这是一个独立的人字形，它独立、勤劳、彬彬有礼，人的概念在于生命力，而不应该是四条腿的婴儿期，也不应该是三条腿的衰老期，作为具有生命力、具有独立人格的人，是用两条腿坚实地站立在天地之间的。


    所以，人字的结构不是互相支撑。


