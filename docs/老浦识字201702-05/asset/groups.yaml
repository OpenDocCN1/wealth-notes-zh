    \  04-28 19:33:03\n\n以上留言由 作者 筛选显示\n\n## 【智】智慧的境界\n\n【智】智慧的境界\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_89_0.png)\n\
    \n老编提示：订阅专栏后，文稿中的象形文字可截点开，放大来看，细细品读。\n\n进入2017年，人们越来越多地谈论人工智能。身为文科生，不知道为什么人们把机器人效用“智能”这样的称呼，因为在我看来，智能可不仅仅是冷冰冰的知识，而是生活者有温度的感悟。\n\
    \n不过从解字的角度而言，智慧的“智”甲骨文就是认识的“知”。那么这么说，人工智能最大的特点就是海量的知识储备，还真当得起这个智慧的智字。\n\n不过还是算了，文科生谈论这个话题只能自取其辱。老编还是谈论中国智慧的化身诸葛亮吧，用传说中的诸葛亮，来诠释仁义礼智信的智。\n\
    \n先声明，这里说的诸葛亮是《三国演义》中民间传说中的诸葛亮，不是易中天反复强调历史上真实的诸葛亮。\n\n### 智慧的基础是知识\n\n智的意思就是知识的知。甲骨文里的干\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_89_1.png)\n\n干，是远古最原始的武器：木槌子。加上一个代表弓箭的矢。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_89_2.png)\n\n木棍和弓箭中间，有一个代表话的口字，合起来表示谈论打仗的事。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_89_3.png)\n\n《说文解字》段玉裁注解说：“知，识也。”\n\
    \n意思是，“知”表示“认识”、“意识”很敏锐。“故出于口者疾知也。”说由于这人见识广，碰见事情马上可以做出判断，说出口的见解快得很射出去的前一样。\n\n\
    所以智的第一解释是知识。知识从哪里来，从学校里学来。\n\n所有出名是智者都有种一样的师父。战国时期的孙膑、张仪、孙膑、庞涍，都出于鬼谷子门下。张良遇到“纪（yǐ）上老人”黄石公，一部《太公兵法》让他成为帝师。\n\
    \n诸葛亮有师父吗？先琢磨有人分析，诸葛亮是世家子弟，先祖诸葛亮当过司隶校尉，从小一定受过良好的教养。成年以后，水镜先生司马徽，良方岳父都都给予他良的敦教。民间自流传的，说他是张道陵张天师的徒弟，自孙玄的师兄弟。\n\
    \n智慧的根底是知识。传说中的这些智者，无不于上通天文，下知地理，阴阳术数无所不道，运筹帷幄之中，决胜千里之外。比如诸葛亮的东风，就是深谙气象学，料到冬至刮西北风，冬天，会有小阳春的吉象，这几天刮东南风。然后装作样子借东风，成就了火烧战船的杜举。\n\
    \n至于八卦阵，一堆一堆的石头就能退兵。发明木牛流马，块块木运道运输粮草等，都是基础知识扎实的结果。但是真正的智慧，可不仅仅有知识就够了。\n\n### 智慧是洞悉人性\n\
    \n金文”，承继甲骨文字形。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_89_4.png)\n\n有弓折、木棍和口组成。弓箭锋利，木棍朴实，正是人性的两面。\n\
    \n洞悉人性是极大的智慧。首先得洞悉作者的人性。\n\n诸葛亮躬耕陇亩的荆襄地区是南北方势力的中心地带，势力最大的是北方的曹操、南方的孙权，近在咫尺的是刘表，选择哪家大公子任职呢？\n\
    \n的。舌战群儒、骂死王朗，比三英战吕布还精彩。\n\n舌战群儒，有点像当今的网络安全，上来一顿人身攻击。诸葛亮基本是一招制敌：有本事骂我，也不照照镜子，自己有多怂。\n\
    \n骂死王朗，是戳到老家伙的痛点，就是一生苟且谄媚，引发老头心脑血管爆裂，阵前猝死。\n\n最精彩的还是诸葛亮吊孝，亲自前去吊唁被自己气死的周瑜。一篇长长的祭文，有理有据，有情有义，泪崩俱下，感动了所有人，不仅把恨得咬牙切齿的东吴战将打动，还重新修复了联吴抗曹的大局。\n\
    \n大智慧，好口才。\n\n### 智是超强的自我管理\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_90_0.png)\n\
    \n那就是亏自己，利天下。\n\n诸葛亮的注册商标就是鞠躬尽瘁，死而后已，他真是累死的。\n\n司马懿抓了个蜀军的俘虏，问：你们丞相是怎么办公的？小兵说了两点，第一点是吃的很少；第二点是事必躬亲，二十军棍以上的处罚都要亲自审核。\n\
    \n司马懿于是判断，吃得少，说明胃口不好。事无巨细都管，说明授权不够，早晚累死。果然累死了。\n\n诸葛亮生前曾经公布了自己的财产清单，桑树八百株，薄田十五顷，除了官俸外没有任何灰色收入。事后清查丞相府的资产，果真如此。\n\
    \n严以律己，是诸葛亮推行法制的基础。也是他最为后人敬仰的品质。管理自己的欲望，亏欠自己，最终功成身退，是大智慧。\n\n老子说：“功成、名遂、身退、天之道。”\n\
    \n范蠡助越王勾践灭吴，功成身退，携西施泛舟五湖，终成财陶朱公。张良功成身退，辟谷修仙养生，终得善终。\n\n诸葛亮是贤相，也是权相，而权相在历史上通常没有好下场，个中区别，就在于是不是自律。民间演绎的诸葛亮虽然不是历史真实，但反映了中国文化对一个智者美好的想象。那就是学富五车，洞悉人性，口吐莲花，严以律己。不仅要有超强的智商，还要有很好的情商、财商。\n\
    \n这可是人工智能永远达不到的境界。\n\n### —— 识字卡片 —\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_90_1.png)\n\
    \n小清干过一件有点智慧的事，我爸经常用这件事吹牛。\n\n小学一年级刚入学，被老师分派，封了一个班级最小的官：小组长。小组长的任务只有一项，收自己这一排同学的作业，交给学习委员，送给老师。\n\
    \n小清拿着鸡毛当令箭，工作一丝不苟。有一个孩子到时间迟交不交作业，小清在旁边立等，一言不合动手就抢。作业本撕坏了。同学大哭，“赔我作业本。”\n\n当时不知怎么想的。冲回自己座位，拿上书包，把书箱里所有的书本哗啦一下倒在同学桌上。\n\
    \n撕吧！同学被镇住了，也不敢哭了。\n\n当时颇为自我以攻为守而得意。现在想来。只是犯浑吧。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_90_2.png)\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_91_0.png)\n\n## 【信】没有畏惧 就没有诚信\n\n老浦提示：阅读专栏中，文中形象的文字可成可点，放大看，细细品读。\n\
    \n进入2017年，中国很多地方仍被雾霾笼罩。雾霾成因的各种说法很多，治理雾霾的力度也不可说不大：工厂停工、汽车限行，甚至上街办舞，雾霾却依然笼罩，驱霾依然很艰难。\n\
    \n今天，《老浦识文》试图从汉字的视角，探讨一下雾霾的根源。\n\n这个汉字就是“诚信”的“信”。\n\n信的甲骨文目前还没有被发现，信的金文是 人 口 加\
    \ 多 数，大 多 教 是 表 示 开 口 许 诺 的 人 说 话。\n\n我们都知道空口无凭，古人有“一言九鼎”、“一诺重于马失道”这样的成语，但这些都是伟大人物的名高风节，没法让整个世界张口说话或诚信的，这样的社会从来就没有存过。\n\
    \n那么应解释这个开口就信的字呢？\n\n日本汉学家白川静认为，不能把 当做人的嘴巴来解释，而应是表示用来向天神献的仪之器，也就是巫师使用的神器、圣类祭器。白川静认为所有字都适用这个解释。\n\
    \n老浦认为白川静的观点很有道理，不能一概而论，“器口”是某中理解，还有表示“嘴”的，还有表“臜”的。\n\n在巫师面前发愿，出誓，合作。也就是说，开口立誓，神鬼为证。如若违背，神鬼惩罚，天打五雷轰。\n\
    \n金文还有一种写法，‘単立人’ 变成 亍，‘口’变成‘言’。‘言’的下面是表示巫师器血的‘口’，上面是一个‘辛’。\n\n‘辛’的形意是大刀，在这里表示在神面前说吉语的仪式，千合这类的盟誓是集体的，大规模的，也许是氏族与氏族、国与国之间的盟约。\n\
    \n商周是一个笃信鬼神的朝代，什么事都要占卜，问鬼神。所以在那个时期，盟誓的时间有鬼神作证，人还是有敬畏之心的。\n\n春秋战国时期，国与国的盟约，仍求鬼神作证。这就叫盟约仪式。这种仪式又叫盟誓。\n\
    \n人身盟，是刺破自己的身体，把双方的血同饮下去。献（sha）血之用是动物的血盟誓，双方将牛、猪、鸡、羊等动物的血涂在祭器上，以示永不反悔。\n\n民无信不立。\n\
    \n还说：人而无信，不知其可也。\n\n意思都是：诚信，是你最基本的道德。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_92_0.png)\n\
    \n这是隶书的信，作为秦国最有名的官吏，商鞅为了赢得民众的信任，办了一件惊人之举。\n\n商鞅在咸阳东门立了一根大木头，声称谁要把木头搬到北门，奖励十镒（yì）黄金。没人相信，赏金增加到50镒黄金。\n\
    \n有人大大胆气搬过去了，果然得到50镒黄金。\n\n从此商鞅变法赢得民众信任，这就是历史上有名的“徙木立信”。\n\n问题是，这样的信任，是对个人人品的信任，没有任何保障。不但信誉没有保障，人自己的安慰都没有保障。商鞅最后被车裂。他推行的政策是不是能够继续，完全看后面的人愿意不愿意。可见个人信誉是很脆弱的。\n\
    \n不一定吧，后世儒家的仁义礼智不都是信誉的保证吗？\n\n我们《老浦识字》前面分析过了，在政治利益面前，道德、诚信不堪一击。\n\n说了这么多，诚信和雾霾到底有什么关系？\n\
    \n汉字的“信”，是对天发誓，让天地鬼神监督，保证誓言一旦违背，就会受到惩罚。都相信天，就构成了诚信。\n\n要不相信，不怕天呢？那就歃血盟誓，交换人质，甚至和亲联姻，让你一旦违约就要付出代价，总之有畏惧才有诚信。\n\
    \n制造污染的企业有畏惧吗？他们既不信鬼神，也不怕你环保局，而牺牲环保省下来的钱可是实实在在的。\n\n那怎样才能让他们有畏惧，进而有诚信呢？法律。\n\n\
