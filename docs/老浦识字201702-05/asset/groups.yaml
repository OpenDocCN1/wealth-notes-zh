    # 【我】自我越大 心眼越小


    老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    《三国演义》里有三绝：


    - 义绝关云长

    - 智绝诸葛亮

    - 奸绝曹操


    其实曹操很冤，历史上真实的曹操雄才大略，消灭群雄，统一北方，最终由自己的儿子结束了汉末的战乱。而且文采出众，开辟了建安文学的新风。


    1954年夏，毛泽东在北戴河吟诵曹操《观沧海》一诗后，对身边工作人员说：“曹操是了不起的政治家、军事家，也是个了不起的诗人。”


    但这样一个文武全才，怎么就成了戏剧舞台的白脸奸相呢？


    老浦个人认为，缘于《三国演义》中那句著名的话：


    > 宁教我负天下人，莫教天下人负我。


    他占了一个“我”字。


    ## “我”来自杀伐的兵器


    我，甲骨文像一种有许多利齿的武器，是一把带锯齿的大斧子，是戌（xù）的变形，这是一种用于仪仗的武器，以显示王者的威严。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_46_1.png)


    《说文解字》说：


    > 我，施身自谓也。


    意思是对自己的称谓。用我们今天的话，就是第一人称代词。


    由于“我”来自杀伐的兵器，所以凡自我意识极强的人，都有一定侵略性。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_46_2.png)


    ## 曹操是自我膨胀越过了道德底线


    - **1. 误杀吕伯奢一家**


    吕伯奢是曹操父亲的结义兄弟，曹操逃亡到他家，吕伯奢热心收留，说出去打点酒就回来，骑上驴出去了。曹操这伙人突然听到后面有磨刀霍霍的声音，仔细一听，听见“绑起来杀了”这句话。二话不说，和同伴一起，见人就杀，一连杀了八口人，杀到后面一看，后厨绑着一口猪，正准备宰杀。


    说坏了，杀错人了，赶紧走。


    路上碰见吕伯奢，曹操索性把吕伯奢老人家，自己父亲的结义兄弟也杀了。


    陈宫说刚才我们杀人杀误会，你现在知道了怎么还杀人？“知而故杀，太不义也！”


    曹操说了那句让他遗臭万年的话：“宁教我负天下人，休教天下人负我。”


    - **2. 借粮官人头**


    表现曹操为了自我利益不择手段的还有一个典型示例——借粮官人头。


    曹操17万人每日耗粮粮食浩大，诸郡又连年饥荒干旱，接济不上。


    粮官禀报曹操说：“如今兵多粮少，应当怎么办？”


    曹操回答说：“用小斛（hú）分发军粮，暂且救一时之急吧!”


    各营营怒杀载道，都说是相欺骗了大家。


    曹操于是密召粮官入帐，对他说：“我想问你借一件东西，以息众怒，你可不要吝惜。”


    粮官说：“丞相想借什么东西?”


    曹操说：“我想借你人头用以示众!”


    喊出刀斧手，推出门外一刀斩要。


    然后把粮官人头悬挂在高杆上面，并贴出告示：“粮官故意用小斛（hú）散发军粮，盗窃官粮，擅改军法，斩头示众。”


    于是众怨开始缓解。


    喊出刀斧手，推出门外一千斩罢。


    然后把粮官人头悬挂在标杆上面，并贴出告示："粮官故意用小斛（hú）散发粮米，盗窃官粮，谨按军法，斩头示众。"


    于是众怒开始缓解。


    上面两件事，都有当时不得已的理由。


    曹操不杀吕伯奢，吕伯奢回家发现自己家被灭门，必然追过来报仇，或者报告官府，曹操就跳不掉了。


    曹操不杀粮官，军心会乱，仗打败了，17万人的命重要还是一个粮官的命重要？


    政治家干大事不拘小节，但这样明目张胆为自我利益草菅人命，确实为普通人的道德所不容。


    曹操这种以自我为中心的行为还有很多，所以尽管英雄盖世，仍然成为民众心目中的白脸奸相。


    ## 那么曹操为什么这么坏？


    我要说曹操自卑你会相信吗？


    曹操自卑？一个如此雄才大略的政治家会自卑？


    我们先来看汉字。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_47_0.png)


    你看金色的我 字，承接了甲骨文的字形，而那个偈更加夸张。


    凡是张牙舞爪拼命夺秀的人，通常是虚张声势外强中干。


    内心自卑的人会非常在意别人的评价，并表现为攻击性，就像这个布满锯齿的大斧子"我"。


    - **1. 曹操的自卑首先表现在对自己相貌的不自信。**


    曹操接见匈奴使者，命令僮季珪（guī）代替自己，自己则拿着刀站在旁边。接见完毕，曹操的密探问使者："你觉得魏王如何？"匈奴使者答道："魏王儒雅的风采不同寻常，然而坐在榻旁持刀的那个人，才是真正的英雄啊！"


    曹操之所以这样做，还不是自认为身材相貌矮小丑陋，不足以征服远方的国度。但他能够引起匈奴使者的注意，该该不是老实实站在那儿吧。


    - **2. 曹操自卑还表现在受不了别人比自己强，比自己聪明。**


    按照民间传说，曹操和杨修斗智不止一次了。


    有一次曹操在花园的门上写了一个"活"字，大家都很慌。杨修说门里面一个"活"字是个"阔"字，相觉得门道得开太宽了。


    - **3. 还有一次，曹操在点心盒子上写了"一盒酥"三个字，杨修把盒子里的点心和大家分着吃了，回来对曹操说：你不是写着吗，一人一口酥。**


    - **4. 曹操害怕自己会在梦中杀人，后来果然睡觉的时候跳起来杀了一个侍卫。这其实是曹操内心不安，故意布的疑阵。**


    杨修在曹操装模作样的葬礼上感叹：丞相不在梦中，是在你梦中啊。


    一语点破了曹操的内心。


    # 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_48_0.png)


    ## 字源演变：


    甲骨⽂ 全⽂ 篆书 隶书 楷书


    wō


    ## 文字原意：


    仅仅使⽤的⻅形兵⼟，借指⽤为第⼀⼈代名词


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_48_1.png)


    《⼯语⼈学》”得到”App出品


    有⼀次出国旅⾏，办办卡书展。


    同⾏⼀个⽣⽣⽗⽼年⽼爷，据说是⼀个书院的院⻓，某⼤电视台⼤⼯艺话。


    脾⽓很⼤，⼀说⽆合就骂导游，喝⾷是时该是北京某区⼀霸，没有办不成的事。


    结果办书展的时候，从书包里拿出⼏张折叠的宣纸，展开以后皱皱巴巴，写了“佛法⼀类”。


    字写得怎么样不说，没装裱，连个印章都没有。


    所有⼈都不⼤意思把作品和他在⼀起。


