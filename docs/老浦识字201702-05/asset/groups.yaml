    # 【 武 】止戈为武这说法对吗


    【武】止戈为武这说法对吗


    老潘提示：订阅专栏后，文章中的象形文字可截可点，放大来看，细细品读。


    戳一下试试：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_1.png)


    **武**是上阵打仗，并非止戈为武


    有一天一个外交官朋友微信我，说希望我给他解释一下汉字“武”，他要准备一个发言稿。


    我明白他是想要用“止戈为武”的主题来表明中国人的善意，就跟他说，“止戈为武”并不是汉字的原意，如果要用汉字来构 架一个发言稿，建议用汉字和平的“和”的繁体字——“𠸉（hé）”。


    𠸉（hé）的原意是多人用“口”吹奏排箅 一类的乐器，表示乐器之间相互配合发出的 和谐音律。用相互妥协、相互配合来促进和平，应该组合进。


    外交官朋友很高兴，放弃了“止戈为武”的原构想。


    止戈为武为什么不是汉字造字原意？我们来看看甲骨文。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_2.png)


    上 面 是 一 个


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_3.png)


    ，“戈”是商代的一种


    兵器； 下 面 一 个


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_4.png)


    ，“止”是脚趾的象形，在甲骨文中表 示“行进”。


    比如 “步”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_5.png)


    ，就是两


    个脚趾一前一后，表示走路。


    停止是止的引申义，为了区别，后世又造 了足字旁的“趾”专指脚趾。


    但在造字构件上，“止”通常代表行进， 并没有停止的意思。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_6.png)


    如 “正”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_7.png)


    ，走向象


    征目的地的城邑；


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_8.png)


    “走”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_9.png)


    ，挥舞双臂的


    人形下面一个表示行进的“止”，奔跑的 意思；


    “奔”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_10.png)


    ，挥舞双臂的


    人形下面三个表示行进的“止”，是飞速 跑动的脚，施如转轮，哪此的风火轮大概 得此灵感。


    “戈”和“止”加起来表示“持戈 行”。


    武的甲骨文原意是持戈出征，行军打仗。


    戈是战车上使用的进攻型武器。从商、周 到春秋战国，戈是战车上的主力兵器，装 上把以后三米多长。在高速行进的战车 上，武士手持这种大沉重的兵器撞击对 方。其突出部分叫“援”，援上下皆刃，
    用以横击和钩杀。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_11.png)


    我觉得戈很像欧洲中世纪重装骑士使用的 骑枪，长大，沉重，富有冲击力。需要训 练 有 素 的 技 巧 和 强 壮 的 身 体 ，还 有 严 格 的 礼 仪 。


    # 春秋以前的“武”是“蠢猪式的仁义道德”？


    宋襄公和楚国开战，在泓水北岸列好阵 势。


