    \ 作者 筛选显示\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_69_0.png)\n\n## 【夫】中国人是因为怕老婆才称妻子为夫人吗？\n\
    \n【夫】中国人是因为怕老婆才称妻子为夫人吗？\n\n老浦提示：订阅老栏目，文稿中的象形文字可截可点，放大来看，细细品读。\n\n### “夫”字就是一个大男人\n\
    \n朋友给我讲过一个笑话，说一个学汉语的外国人问：\n\n“中国人是不是因为怕老婆才称自己的妻子为夫人？”\n\n“什么意思？”\n\n外国人说：“夫人的夫是字头出去，就是比天还大。夫人的意思是不是比天还大的人？那还不是怕老婆？”\n\
    \n我那朋友瞠目结舌不知如何应对。\n\n“夫”字最原始的含义是什么？甲骨文怎么写？\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_69_1.png)\n\
    \n“夫”的甲骨文是“大”字上加上一横\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_69_2.png)\n\n\
    “大”是一个成年男人正\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_69_3.png)\n\n面站立的象形，\n\
    \n加上一横，\n\n表示一个男人年龄已经超过15岁，把头发束起来，用一根簪子别住。\n\n在古代，称一个人“束发”就是表示这个人已经成年，要承担成年男人的责任了。\n\
    \n大丈夫的原始含义就是指成年人。为什么是丈夫？古代八寸为一尺，十尺为一丈，丈夫是指身高八尺接近一丈的男人，身材伟岸，大丈夫啊。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_69_4.png)\n\
    \n### 夫人也很尊贵\n\n那夫人是怎么来的？\n\n夫人这个词最早出现在战国时期，我们前面谈到，女人尊称自己老公为夫，那么女人自己就是“夫之人”，简称“夫人”。\n\
    \n既然是尊称，所以夫之人自然也是尊称。汉代列候之妻才能称夫人，汉代以后王公大臣之妻称夫人，唐、宋、明、清各朝还对高官的母亲或妻子加封，称诰命夫人。\n\n\
    ![](img/792d2d18bbe99e723a0a2f17774d50d0_69_5.png)\n\n现代汉语的夫人大概来源于英文翻译，由于老外女士结婚以后从夫姓，所以在称呼的时候得冠以夫姓，比如希拉里得称克林顿夫人，宋庆龄得称孙夫人，宋美龄得称蒋夫人。\n\
    \n民国还有个好玩的称呼，称小老婆为夫人，意思你懂的。\n\n### 成为“夫”的关键是管理自己\n\n夫字来源于古人头发，清朝以前，中国人一辈子不剪头发，就这么束在头顶，只有两种情况可以散开头发，一是出家，李白诗：人生在世不称意，明朝散发弄扁舟。散发意味着修道成仙。二是老了，头发散开表示可以不受拘束。可见，束头发表示承担责任，表示对自己的管理。\n\
    \n说到自己的管理，想到了我的一个同学小万，这哥们是我见过学习能力最强，记忆力最好的人之一。上初三的时候，学校为了鼓励大家学习，规定期末考试只要六门功课门门过九十分，就是三好生。\n\
    \n身为一个门门不及格的混混，小万居然去找年级主任问：“门课我要考过门门九十分，能得三好学生吗？”\n\n年级主任撇着嘴说：“当然可以。”\n\n小万也不知道哪根筋动了，距离考试还有三个月，发奋苦读，竟然五门功课凭借真本领过了九十分。\n\
    \n只有英语，底子太差就放弃了，他就在考英语的时候把试卷递给了窗外英语好的同学帮答，填好再从窗户顺进来。当然也过了九十分。\n\n年级主任不信，把他所有卷子调出来检查，自然查出笔迹不一样。于是，记大过处分。\n\
    \n我们都愤愤不平，毕竟从零基础达到了五门功课过九十，不鼓励就算了，也不应该给这么重的处分吧。\n\n后来小万继续调皮，最终被学校开除。\n\n三十多年过去，我们同学聚在一起喝酒，我重提此事，说老师把小万害了。\n\
    \n老万喝了口酒对我说，不然，其实聪明不聪明，人都差不多，最后决定一个人能不能成事，关键看管理自己的 ability。\n\n这是一个五十多岁老男人用自己的生活总结出来的话。\n\
    \n的确，从小就知道“业精于勤荒于嬉”，但有几个人能管住自己？明明知道该该早睡早起，但躺在床上，你能管住自己刷朋友吗？\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_70_0.png)\n\
    \n### 一个传说引出更多解读\n\n民间传说，乾隆皇帝微服私访，看到一位农夫侧身而过，就问身边的宰相张玉书：“这是何人？”\n\n张玉书道：“皇上，他是个农夫。”\n\
    \n乾隆问道：“农夫的‘夫’字怎么个写法？”\n\n“皇上，‘夫’字就是两横一撇一捺，轿夫之夫、孔夫子之夫、夫妻之匹、匹夫之夫，都是这样写的。”\n\n乾隆皇帝说：“那怎么能一样呢？\n\
    \n- 农夫 是 刨 土 之 人，上 写 ‘土’ 字，下 写 ‘人’ 字；\n- 轿 夫 肩 上 扛 竿，先 写 ‘人’ 字，再 添 两 横；\n- 孔 夫\
    \ 子 上 通 天 文，下 知 地 理，是 ‘天’ 字 出 头；\n- 夫 妻 是 两 个 人，所 以 要 先 写 ‘二’ 字 再 写 ‘人’ 字；\n-\
    \ 匹 夫 是 指 丈 夫，就 应 该 先 写 个 ‘大’ 字，再 加 上 一 横。\n\n所以同是一个夫字，写法大不相同。”\n\n“夫”字各不相同，只有一点一致，那就是作大丈夫，大字上面加一横，管好自己。\n\
    \n这就是咱们今天的全部内容，你管理自己有什么妙招吗？欢迎在留言区跟大家分享你的经验。\n\n如果你身边有可以在“管理自己”方面继续提升的朋友，可以点右下角的红包「请朋友读」，把这期内容分享给他！\
    \ \n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_70_1.png)\n\n说到管理自己，我的体会是要给自己定个小目标。\n\
    \n我在作电视剧后期制作公司经理的时候，意识到文化产业的核心是管理品牌。有一天我坐在公司办公室白日梦，音频总监说以后要从录音改作曲，视频总监说今后要向前期导演发展。\n\
