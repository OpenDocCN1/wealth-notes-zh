    \n以上留言由 作者 筛选显示\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_82_0.png)\n\n# 【义】义气千秋\n\
    \n老谭提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。\n\n关羽长是中国文化中一个极其特殊的文化现象，根据有关部门统计，老北京城有关帝庙116座，连中轴线上正阳门下面都有一座关帝庙，可见无论官府还是民间，对关二爷，都是无限崇敬。\n\
    \n不仅仅在中国，在东南亚地区，日本、新加坡、马来西亚以及菲律宾等国家，甚至美国、英国的华人区域，关公的信仰也都相当盛行。\n\n在旧时上演关公戏班时，有许多规矩：如扮演关羽的演员在演出前10天要斋戒独宿，熏沐净身；出场前要给关公像做做叩头，在后台杀鸡祭拜；\n\
    \n清廷皇宫演戏时，每临关公出场，帝、后、妃都得离座走几步，然后才能坐下观看。\n\n可是平心静气想一想，且不说历史上的关羽只是一员武将，论战功，比他的战神在他前面起码能排几十号；起翦（jiǎn）颇牧，用兵最精。这是《平字文》公认的战国四大名将。\n\
    \n起是秦国名将白起，藺是王翦，也是秦国名将，颇是廉颇，赵国名将，牧是李牧，赵国名将。每个人都有几十万人的开敌敌目。\n\n智者有写《孙子兵法》的孙武，勇者有西楚霸王项羽。\n\
    \n就是三国时期，能打的武将很多人也排在关羽的前进：吕布、典韦、马超、赵云等等，为什么关羽不仅被奉为战神，还是财神、白道里最共同的保护神，伏魔大帝，官方正式称谓：忠义神武灵佑仁勇威显护国保民精诚绥靖翊赞(\
    \ yì) 宣德信圣大帝。\n\n这大概是世界文化中极其独特的现象，一部小说塑造的半真半虚的人物被信仰为真，成为超级偶像，深刻地影响了社会道德。这部小说就是《三国演义》。\n\
    \n在这部小说中，他拥有三绝中的 “义” 绝。（另外两绝是智绝诸葛亮，奸绝曹操）\n\n## 高举道义大旗\n\n义，甲骨文![](img/792d2d18bbe99e723a0a2f17774d50d0_82_1.png)上面是![](img/792d2d18bbe99e723a0a2f17774d50d0_82_2.png)羊的象形，羊是古代祭祀的主要祭品，代表吉祥；\n\
    \n下面是一个![](img/792d2d18bbe99e723a0a2f17774d50d0_82_3.png)“我”字，“我”的原意是有利的、大斧子，是古代仗用的兵器，代表征服。\n\
    \n祭祀的羊与仪仗的大斧子加在一起，表示出征得到神灵庇佑，是正义之战。\n\n我们就用小说中的关公来解释一下 “义” 这个汉字。\n\n义的本意是得到神庇佑的正义，也就是道义。\n\
    \n关羽是出身草莽，却是满满的正义感。他一出场，就是扛着为投军杀贼。什么城，黄巾军。碰上刘备、张飞，意气相投，立意共复汉室，于是桃园结义，成为千古美谈。\n\
    \n终其一生，兴复汉室一直是关羽的事业目标。早年还是一名无名小卒的时候，随从皇帝打猎，见曹操欺君，当场就要上杀了曹操，被刘备拦下。\n\n徐州战败，刘、关、张三人大败。关羽不得已投降，在土山约三事：\n\
    \n1. 汉事不背曹；\n2. 皇嫂汉诏；\n3. 一有刘备的下落，立即辞去。坚决不依他心目中的汉曹操。\n\n## 忠义千秋\n\n这是金文![](img/792d2d18bbe99e723a0a2f17774d50d0_82_4.png)“我”字的写法，羊下面的“我”已基本看不出兵器的形状了。我们把这个字形，来代表我字的另一个重要含义：忠义。\n\
    \n忠义应该是关云长的标签了，关帝庙的标配就是匾额上的四个大字：忠义千秋。\n\n关羽投曹操以后，曹操三日一小宴，五日一大宴，又是送美女，又是送马。斩颜良以后，还被封为汉寿亭侯，荣华富贵手可得。但是一旦听说兄长刘备的消息，马上挂印封金，就是把曹操所有的封赏都原封不动地退回，官印挂在大堂上。千里走单骑，过五关，斩六将。投奔孤身漂泊，成为前途未卜的大哥。\n\
    \n不能不说这份忠义是千古一人。\n\n孟子说：\n\n> “生，亦我所欲也，义，亦我所欲也，二者不可得兼，舍生而取义者也。”\n\n说：\n\n生命与道义相比，可以放弃生命。\n\
    \n关羽在忠义这一条上，真做到了。\n\n## 仗义走江湖\n\n篆文 义\n\n义 承续甲骨文字形，基本和后来的隶书、楷书相同。但篆文有一种异体字\n\n\
    义\n\n很有意思是羊\n\n羊 下面一个 丆\n\n弗，休战，表示休战和，揭示“道义”的另一层含义。\n\n在民间，老百姓最推崇的是关公对朋友的仗义。在战场中，关、关云长和黄忠打成平手，第二天关公用拖刀计正欲斩老黄忠，黄忠却马失前蹄。关公不愿趁现做成宜，放过了黄忠。所以第三天黄忠也射中关羽脑袋接镖报孝。\n\
    \n当然，关羽最受争议的仗义是华容道，放走了曹操。\n\n关羽本来是立下军令状的，放走曹操，自己就要军法从事。\n\n对曹操的情义，关羽是有思想准备的，丞相之恩，已经斩颜良、诛文丑，解白马之围相报。但曹操提出你过五关斩六将，那么说。关羽竟然无言以对，可见他的恩义，拎的很清楚。最终放走了曹操。\n\
    \n> （我们在这里谈的都是《三国演义》中的小说人物，华容道历史上并无此事。）\n\n但你再仗义，这也是你自己和曹操的私谊，几十万大军会战，你有什么资格放掉敌方的统帅，因私废公。\n\
    \n关羽不懂这道理吗？就算不懂道理，难道不怕死吗？\n\n这就要谈到老诸识字独家对仗字的解读：\n\n## 义字里面有一个大大的我字\n\n在简化字之前，义字下面都有一个大大的我字。\n\
    \n《说文解字》说：\n\n> 义，己之威仪也。从我羊。\n\n说：\n\n义字是自己的威仪。\n\n就是我的威仪。\n\n说明义字是自我的，即使是奉献，也是完成自我。\n\
