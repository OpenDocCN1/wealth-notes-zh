    \n# 一个传说引出更多解读\n\n民间传说，乾隆皇帝微服私访，看到一位农夫侧身而过，就问身边的宰相张玉书：“这是何人？”\n\n张玉书道：“皇上，他是个农夫。”\n\
    \n乾隆问道：“农夫的‘夫’字怎么个写法？”\n\n> “皇上，‘夫’字就是两横一撇一捺，轿夫之夫、孔夫子之夫、夫妻之匹、匹夫之夫，都是这样写的。”\n\n\
    乾隆皇帝说：“那怎么能一样呢？\n\n+   * 农夫 是 刨 土 之 人，上 写 ‘土’ 字，下 写 ‘人’ 字；\n* 轿 夫 肩 上 扛 竿，先 写\
    \ ‘人’ 字，再 添 两 横；\n* 孔 夫 子 上 通 天 文，下 知 地 理，是 ‘天’ 字 出 头；\n* 夫 妻 是 两 个 人，所 以 要 先\
    \ 写 ‘二’ 字 再 写 ‘人’ 字；\n* 匹 夫 是 指 丈 夫，就 应 该 先 写 个 ‘大’ 字，再 加 上 一 横。\n\n所以同是一个夫字，写法大不相同。”\n\
    \n“夫”字各不相同，只有一点一致，那就是作大丈夫，大字上面加一横，管好自己。\n\n这就是咱们今天的全部内容，你管理自己有什么妙招吗？欢迎在留言区跟大家分享你的经验。\n\
