    # 【信】没有畏惧 就没有诚信


    老浦提示：阅读专栏中，文中形象的文字可成可点，放大看，细细品读。


    进入2017年，中国很多地方仍被雾霾笼罩。雾霾成因的各种说法很多，治理雾霾的力度也不可说不大：工厂停工、汽车限行，甚至上街办舞，雾霾却依然笼罩，驱霾依然很艰难。


    今天，《老浦识文》试图从汉字的视角，探讨一下雾霾的根源。


    这个汉字就是“诚信”的“信”。


    信的甲骨文目前还没有被发现，信的金文是 人 口 加 多 数，大 多 教 是 表 示 开 口 许 诺 的 人 说 话。


    我们都知道空口无凭，古人有“一言九鼎”、“一诺重于马失道”这样的成语，但这些都是伟大人物的名高风节，没法让整个世界张口说话或诚信的，这样的社会从来就没有存过。


    那么应解释这个开口就信的字呢？


    日本汉学家白川静认为，不能把 当做人的嘴巴来解释，


    而应是表示用来向天神献的仪之器，也就是巫师使用的神器、圣类祭器。


    白川静认为所有字都适用这个解释。


    老浦认为白川静的观点很有道理，不能一概而论，“器口”是某中理解，还有表示“嘴”的，还有表“臜”的。


    在巫师面前发愿，出誓，合作。


    也就是说，开口立誓，神鬼为证。如若违背，神鬼惩罚，天打五雷轰。


    金文还有一种写法


    ‘単立人’ 变成 亍，‘口’变成‘言’。


    ‘言’的下面是表示巫师器血的‘口’，上面是一个‘辛’。


    ‘辛’的形意是大刀，在这里表示在神面前说吉语的仪式，千合这类的盟誓是集体的，大规模的，也许是氏族与氏族、国与国之间的盟约。


    商周是一个笃信鬼神的朝代，什么事都要占卜，问鬼神。所以在那个时期，盟誓的时间有鬼神作证，人还是有敬畏之心的。


    春秋战国时期，国与国的盟约，仍求鬼神作证。这就叫盟约仪式。


    这种仪式又叫盟誓。


    人身盟，是刺破自己的身体，把双方的血同饮下去。


    献（sha）血之用是动物的血盟誓，双方将牛、猪、鸡、羊等动物的血涂在祭器上，以示永不反悔。'
  - '[PAGE 92]


    民无信不立。


    还说：


    人而无信，不知其可也。


    意思都是：


    诚信，是你最基本的道德。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_92_0.png)


    这是隶书的信，作为秦国最有名的官吏，商鞅为了赢得民众的信任，办了一件惊人之举。


    商鞅在咸阳东门立了一根大木头，声称谁要把木头搬到北门，奖励十镒（yì）黄金。


    没人相信，赏金增加到50镒黄金。


    有人大大胆气搬过去了，果然得到50镒黄金。


    从此商鞅变法赢得民众信任，这就是历史上有名的“徙木立信”。


    问题是，这样的信任，是对个人人品的信任，没有任何保障。


    不但信誉没有保障，人自己的安慰都没有保障。


    商鞅最后被车裂。他推行的政策是不是能够继续，完全看后面的人愿意不愿意。


    可见个人信誉是很脆弱的。


    不一定吧，后世儒家的仁义礼智不都是信誉的保证吗？


    我们《老浦识字》前面分析过了，在政治利益面前，道德、诚信不堪一击。


    说了这么多，诚信和雾霾到底有什么关系？


    汉字的“信”，是对天发誓，让天地鬼神监督，保证誓言一旦违背，就会受到惩罚。


    都相信天，就构成了诚信。


    要不相信，不怕天呢？


    那就歃血盟誓，交换人质，甚至和亲联姻，让你一旦违约就要付出代价，总之有畏惧才有诚信。


    制造污染的企业有畏惧吗？他们既不信鬼神，也不怕你环保局，而牺牲环保省下来的钱可是实实在在的。


    那怎样才能让他们有畏惧，进而有诚信呢？


    法律。


    在现代社会，法律就是信字中的那个象征敬畏鬼神的“口”，并且比鬼神要靠谱。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_92_1.png)


    所有不诚信的人都是没有敬畏的人。


    要么敬畏天地良心，要么敬畏法律。没有敬畏，就没有诚信。


    # 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_92_2.png)


    观察一些制造有毒食品的人、骗子、贪官，往住会让你惊讶地发现，他们除了干坏事，一切正常。


