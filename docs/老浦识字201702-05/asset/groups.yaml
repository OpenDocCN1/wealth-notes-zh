    ## 【大】什么是大


    老浦提示：订阅专栏后，文摘中的象形文字可重点，放大来看，细细品读。


    鲲之 大，不知其几千里也：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_31_1.png)


    ### 大 字是个顶天立地的人


    中国人最喜欢大的东西，住大房子、建大广场、用大屏幕手机、尤其是要开大车。国外畅销的车型到中国来一定要加大，否则卖不动。SUV 又费油又不好泊（bó） 车，洗车都
    比小 车贵， 那些死贵 的越野 车 能在平坦的城市道路上一辈子也用不上，但就是卖的好，大，气派。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_31_2.png)


    这个 “大” 字来自二期

    甲骨文，一个正面站立的人形，挺胸昂 首，舒展双臂，稳稳地站立在大地之上。


    在商代，国之大事，在祀与戎。


    能够如此伟岸站立于天地之间的，要么是 一个高大的祭司，要么是一个得胜的将 军。他威风彪彪地岔开双腿，在旅人眼 中，他和天地一样伟岸。


    《说文解字》说：


    > 大，天大地 大 人也 大 ，故 从 大 人形 。


    说：


    天地人都是大的，所以人的形状就是大。


    许慎尽管没见过甲骨文，很多解读有误，但对大字的解读，直追甲骨文原意。


