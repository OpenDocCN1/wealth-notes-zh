    # 【后】到底是司母戊还是后母戊


    老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    中学课本里学过的司母戊大鼎改名了，在国家博物馆的说明牌上，已经改成后母戊。


    这可是国家博物馆的镇馆之宝，重达830公斤，据研究，铸造此鼎需要一千公斤铜，三百人左右同时配合。厚重雄伟，精美绝伦，是青铜器铸造的巅峰之作，国家一级文物，禁止出国展。


    当年河南安阳一个农民发现它的时候，正值抗日战争时期，日本人听说有大鼎出土，派兵搜查了几次都没找到，农民把大鼎埋起来了。


    联系古董商，说收，20万大洋，条件是砸碎偷运出去。


    20万大洋啊，砸吧！夜深人静，农民抡起大锤向国宝砸去。


    当~，一声巨响，大鼎纹丝不动，声音却把农民吓坏了，这动静非把日本鬼子招来。


    垫上棉被，砸。没用。


    锯，锯不动。


    他们终于承认这钱没法挣，又埋了下去，直到抗战胜利挖出来献给国家，轰动一时，蒋介石都去参观。


    1949年国民党想把大鼎运去台湾，结果被丢弃在南京的机场。


    国之重器，有灵啊。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_49_0.png)


    这就是大鼎上的铭文。下面那个跪坐的女人形是母亲的“母”字，旁边那个字是戊戊变法的“戊”字，原意是古代兵器的象形，在这里是商王武丁妻子妇妌（jìng）的庙号。


    > > 上面第一个字，著名学者罗振玉认为：“商祭年日祀又日司也，司即词字。”


    意思是说司是祭祀的意思。郭沫若先生也持此说，他认为“司母戊”即为“祭祀母亲戊”。


    于是，司母戊大鼎的命名一直沿用至今。


    那为啥要改呢？


    有专家认为，司的解读不合理，应该叫后母戊。


    网友笑了：后妇鼎，那后爹鼎也该出来了？


    网友误读了，此处的后不是前后的后，而是王后的后。


    繁体字前后的“後”是双立人旁，表示道路，右边，原意是绳索，下面“久”，表示行走，本意是被绳索拉拽着走在队伍后面。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_49_1.png)


    王后的后就简化字的字形。


    简化字把这两个读音相同意义迥异的字合成一个，害人浅。


    说回后母戊鼎，为什么要改成“后母戊”呢？


    王后的后就是简化字的字形。


    简化字把这两个读音相同意义迥异的字合成一个，害人不说。


    说 回后母戊鼎，为什么要改成“后母戊”呢？


    百度了一下：专家认为鼎内铭文中的“司”字应作“后”字解。


    这些专家认为，商代的字体较自由，可以正写也可反写。


    可以这样写，也可以这样写。


    以“司”和“后”古文字中是同一个字，认为“后”意思上更接近“商王之后”。


    “后”的意义相当于“伟大、了不起、受人尊敬”。


    改为“后母戊”，意思就是：将鼎献给“敬爱的母亲戊”。


    老浦有点不同意见。


    专家说“司”和“后”在古文字里是同一个字，不错。但其实最早的汉字“后”是首领，男女都能用，昈日后的后羿就是一个叫羿的首领。后并不专指王后。


    所以后算是个头衔。


    再来看看司，《说文解字》说：


    > 司，臣司事于外者。


    意思是说在外办事的官吏。


    甲骨文，是祭祀用的树枝形祭器，加上口，这个口形并非口舌之口，日本汉字学家白川静认为这样的口形都是向神祷告的祝咒之器，司的原意就是祭祀（白川静《常用字解》）。


    民间汉学者周清泉在他的《文字考古》中引用了甲骨卜辞，以说明司字的用法：


    “27900：壬子卜：其束司鱼。”这是指用鱼祭祀。

    “19209：惟彗司。”这是指用猪祭祀。

    “27667：侑司母。”这是指祭祀母亲。


    按照这个逻辑，司母戊就是祭祀母亲之器。


    《辞海》中说：


    > “司母戊鼎：商代晚期的青铜器，鼎腹内有铭文‘司母戊’三字（或释‘后母戊’）。是商王为祭祀其母戊而做。”


    学术上的争论可以各执己见，不大可能统一结论，也没必要。至于我个人，尽管真心不喜欢郭沫若，但这次我同意他，念司母戊。


    司母戊还是后母戊，太专业了。和我们没什么关系，但是写字写错了就和我们有点关系了。


    我们刚才说到前后的后和皇后的后，在简化字里一样，但繁体字是两个字。前后的後是双人立旁，皇后的后在古代也是写成这样，和简化字一样。


    毕福釗给潘婷婷题写的“玖球天后”就把“後”字用错了，天后的后写成了繁体前后的後。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_50_0.png)


    当然，“玖”字也错了，这个带玉字旁的“玖”原意是像玉一样的黑色石头，也是九的大写，主要用于记账。


    老毕写四个字错俩，当时成为笑谈。


    中国书画研究院名誉院长赵海青为台湾影后归亚蕾题字“影後”，犯了同样的错误，写成繁体前后的後。


    都是简化字害的，本来想显摆一下哥会写繁体字，结果露了怯。


    这回咱明白了，前後和皇后不是一个字，后母戊也不是後妈鼎。


    —— 识字卡片 ——


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_50_1.png)


    # 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_51_0.png)


    文字原意：

    主持祭祀主持仪式的人，是王或大巫师。是氏族首领


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_51_1.png)


    我辞去公职下海办的小公司，叫得鼎，搞影视节目音频、视频后期。


    影视后期很苦，老得熬夜，挣钱也不多。但能够接触结识很多行业里最优秀的导演、歌手。


    我们接触大腕，也眼看许多当时的小歌手、小演员、小导演成长为今天的、一乌鸡变凤凰的游戏圈上游。


    但是这个过程，是影像一帧一帧抠出来，乐句反复反复做出来，看到人家成功，也看到人家怎样埋头苦干熬成功。


    鼎厚重器，很风光，但铸鼎的过程，很苦逼。


