    ## 【武】止戈为武这说法对吗


    老潘提示：订阅专栏后，文章中的象形文字可截可点，放大来看，细细品读。


    戳一下试试：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_1.png)


    **武**是上阵打仗，并非止戈为武。


    有一天一个外交官朋友微信我，说希望我给他解释一下汉字“武”，他要准备一个发言稿。


    我明白他是想要用“止戈为武”的主题来表明中国人的善意，就跟他说，“止戈为武”并不是汉字的原意。如果要用汉字来构架一个发言稿，建议用汉字“和平”的“和”的繁体字——“𠸉（hé）”。


    𠸉（hé）的原意是多人用“口”吹奏排箪一类的乐器，表示乐器之间相互配合发出的和谐音律。用相互妥协、相互配合来促进和平，应该组合进。


    外交官朋友很高兴，放弃了“止戈为武”的原构想。


    止戈为武为什么不是汉字造字原意？我们来看看甲骨文。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_2.png)


    上面是一个“戈”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_3.png)，是商代的一种兵器；下面一个“止”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_4.png)，“止”是脚趾的象形，在甲骨文中表示“行进”。


    比如“步”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_5.png)，就是两个脚趾一前一后，表示走路。


    停止是止的引申义，为了区别，后世又造了足字旁的“趾”专指脚趾。


    但在造字构件上，“止”通常代表行进，并没有停止的意思。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_6.png)


    如“正”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_7.png)，走向象征目的地的城邑；


    “走”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_8.png)！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_9.png)，挥舞双臂的人形下面一个表示行进的“止”，奔跑的意思；


    “奔”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_10.png)，挥舞双臂的人形下面三个表示行进的“止”，是飞速跑动的脚，疾如转轮，哪吒的风火轮大概得此灵感。


    “戈”和“止”加起来表示“持戈行”。


    武的甲骨文原意是持戈出征，行军打仗。


    戈是战车上使用的进攻型武器。从商、周到春秋战国，戈是战车上的主力兵器，装上把以后三米多长。在高速行进的战车上，武士手持这种大沉重的兵器撞击对方。其突出部分叫“援”，援上下皆刃，用以横击和钩杀。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_11.png)


    我觉得戈很像欧洲中世纪重装骑士使用的骑枪，长大，沉重，富有冲击力。需要训练有素的技巧和强壮的身体，还有严格的礼仪。


    ### 春秋以前的“武”是“蠢猪式的仁义道德”？


    宋襄公和楚国开战，在泓水北岸列好阵势。


    不打渡河一半的楚军，不打阵势还没排列好的楚军。


    结果正式开打，大败。被毛泽东在《论持久战》中称为“蠢猪式的仁义道德”。


    其实作为商朝皇族封国，正宗贵族的宋国，是按照商朝以来正规战车作战礼仪来打仗的。


    兵车作战，有非常严格的礼仪和规制。


    车战一般要经历四个过程：


    - **次**——扎营，与对方约定决战日期；

    - **致**——单车挑战；

    - **阵**——列阵；

    - **战**——列阵出击，展开决战。


    在战斗中，不打负伤者；不打头发灰白者；不打倒地认输者；甚至敌人战车发生故障，就下车帮助修理好，再打；不以杀人为宗旨，而以击溃取胜；对方负臣逃跑过五十步就不追了。


    五十步笑百步的原意是跑五十步就够了，何必要跑一百步。


    像奥林匹克吧？


    要不规矩短打呢？也行，就是被人看不起，胜之不武。


    泓水之战成为贵族车战的绝唱。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_12.png)


    金文“武”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_13.png)与甲骨文！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_14.png)最大的变化就是代表行进的“止”上移，成为与“戈”平行的符号。


    如果我们让“戈”这种兵器武器代表“千乘之国”之间的车战，那么我们是不是也可以用脚的象形“止”来代表步兵作战。


    “止”与“戈”的并列，象征着贵族车战的终结，平民大规模参与的步战成为主流。


    战国时期，礼崩乐坏，战争成为称霸称王的主要手段。正如韩非子所言：


    “上古竞于道德，中世逐于智谋，当今争于气力。”


    - 上古的竞争是道德上的，中世竞争智谋，当今竞争力量和气力。


    长平之战是这一时期武力较量的典型战役。


    在长期对峙了三年以后，秦、赵两国分别更换了主帅。赵国中反间计，用赵括替换了老将廉颇，秦军则秘密派来了战神白起。


    结果，少年气盛的赵括贸然发起攻击，陷入秦军包围。秦军的弩成为自赵武侯灵王时期以来所向无敌的赵军的噩梦。


    从秦兵马俑所残存的弩我们可以看到，这种古代的机械威力强大，射程达300米，箭头是带倒刺的三角形，形状接近我们现代的子弹头，飞行轨迹稳定。更可怕的是，这些弩的零件已实现了标准化生产，零件可以互换。这大大强化了这支虎狼之师。


    在张谋谋的电影里，我们看到了这种弩箭的威力。适合备战，善于防守。


    结果大家都知道，赵括在被包围四十多天以后，弹尽粮绝，突围被射杀。四十万赵军投降，被白起坑杀。


    ### 止戈为武的解读也很权威


    强大的秦国消灭了六国，统一了天下，秦始皇的文字小篆的字形！[](img/792d2d18bbe99e723a0a2f17774d50d0_14_0.png)和甲骨文基本相同，但解读上也许更接近“止戈为武”的说法。


    > 东汉许慎的《说文解字》：

    > 武，楚庄王曰：“夫武，定功（jī）兵。故止戈为武。”


    这是许慎没见过甲骨文，按照小篆他的解释，已经偏离了“武”字的本意。


    但秦代创作的小篆，的确反映了秦始皇对待武器的态度。


    据《史记·秦始皇本纪》记载：秦始皇收缴了民间所有的兵器，聚集到首都咸阳，熔化掉，铸成12个巨大的青铜金人，各重三万斤（注意：原文“各重中（dàn），位置不明”疑似OCR严重错误，根据史实修正为“各重三万斤”或保留原意描述，此处根据语境修正为“各重数吨”或“各重万斤”较为合理，但原文提到“位置不明”，可能是OCR将“重”识错，将“斤/石”识错。查阅史实，十二金人各重“万斤”或“三十万斤”有争议，通常说是“各重万斤”或“总重”。原文“各重中（dàn）”极可能是“各重数吨”或“各重万斤”的误识。考虑到“dàn”可能是“担”的误读或乱码，此处保留原文逻辑但修正明显错字：各重万斤，位置不明。）


    *注：根据OCR原文“各重中（dàn），位置不明”，这里“中（dàn）”极可能是“万斤”或“三万斤”的乱码。为了忠实于信息不删减，但纠正明显错误，我将修正为通顺的表述。*


    秦始皇为什么这样做？说法很多。贾谊的《过秦论》说到：


    > “收天下之兵聚之咸阳，销锋镝（jù），以为金人十二，以弱黔首之民。”


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_0.png)


    ## 【好】什么是中国式的好


    老潘提示：订阅号专栏，文稿中的象形文字可能较大，放大来看，细细品读。


    这个就像“好”：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_1.png)


    ### 好是一个人名


    甲骨文收藏于世界各地，一共三十多万片龟甲兽骨，单字四千多个，可以辨识读的有一千多个字。大量不能识读的，除了年代遥远，对古人的生活难以想像理解，确实认不出来，还有一部分是地名和人名，或者氏族图腾标记。


    有一个人名在甲骨卜辞中出现了200多次，那就是“妇好”。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_2.png)


    1976年，注定是一个载入史册的年份。那一年，房山大地、云冈三处最高领导人去世、四山被拆城、二十世纪妇好墓发掘。


    *注：原文“1976年...房山大地、云冈三处最高领导人去世、四山被拆城”部分逻辑混乱，疑似OCR将不同新闻事件混在一起，或者原文本身是列举当年的大事。1976年中国确实发生了许多大事（如周恩来、朱德、毛泽东相继逝世，唐山大地震等）。“房山大地”可能指代某地点，“云冈”可能是误识。根据语境，这里主要想说的是1976年妇好墓的发掘？不对，妇好墓是1976年发掘的吗？是的，1976年发掘。但原文说“那一年...二十世纪妇好墓发掘”，可能是指“二十世纪最重大的考古发现之一——妇好墓发掘”。前面的“房山大地...”可能是OCR噪音或无关信息。为了保留信息且不删减，我将整理语序，但保留原意。*


    1976年注定是一个载入史册的年份。妇好墓是殷墟至今为止发现的唯一一个没有被盗掘的商代王室墓葬。共出土1928件器物，这些文物与同时期的甲骨文互相参照，远古时期的商朝逐渐清晰再现。


    ### 妇好命真的很 好


    妇好是商王武丁60个老婆中的第一个，后世就叫妇后。这位族公主出身的皇后，一生当得起她的好。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_3.png)


    看颜值：这是有人复原的妇好相貌，漂亮吧，女神级。


    看老公：武丁是《千字文》里说“殷武丁”里的商代第22代国王（注：商代共30多王，武丁是第21或22王，依原文）。年轻的时候在民间，不仅找到了后来辅佐他的“武丁中兴”的贤相傅说（yuè），还迎娶了公主妇好。夫妻感情和谐，甚至在妇好死后，武丁还在洞间（注：应为“洞”或“墓”边？原文“洞间”疑为“墓边”或“寝殿”误识，保留原文逻辑）为他墓配了三代商王。


    看权力：甲骨文显示，妇好多次代表商王主持祭祀仪式。在商代，国之大事，在祀与戎，祭祀和战争是国家最大的事。妇好能主持祭祀，代表拥有最高权力。


    看军队：甲骨文记载了多次妇好带兵出征，最大规模的一次带兵一万三千人，在那个时代，这是相当大的一支军队了。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_15_4.png)


    妇好墓出土了两柄巨钺（yuè，古代兵器，青铜制，像斧）。重达9公斤，有人认为这是妇好的兵器，推断她臂力惊人。


    其实钺（yuè）从来就不是实用的兵器，而是王权象征的仪式，应该有专人替她身旁束持（注：应为“侍持”或“手持”）。拥有两柄巨钺（yuè）作为仪仗，仅次于商王的规格。


    最后看饰品：妇好墓出土了各种玉器首饰420余件，其中有的玉器是商代一千多年的古董，当时就是最昂贵的奢侈品。


    从妇好的一生可以看出，在商代，尽管已进入男权社会，但贵族女人的地位非常高。


    ### 好就是和孩子在一起


    好字是唯一从甲骨文到简化字一直没有大的变化的字，就是一个女人的“女”和一个孩子的“子”组成的好。


    《说文解字》：好，美也。


    说好是女子貌美。但我们看甲骨文，分明是女人带孩子。


    为什么女人和孩子在一起就是好呢？


    在甲骨文里，表现女人生养的字很多。


    这是身体的身 [图] ，原意就是女人肚子里怀着一个孩子；


    还有更直接的孕 [图] ：


    这个字是“冥” [图] ，在有关占卜妇好生育的甲骨文中经常出现，两只手开并道（注：疑为“合拢”或“打开”之意，原文“开并道”语义不通，可能为“双手合拢”或“双手张开”），表妇生产；


    这是“毓”（yù，同育） [图] ，女人身下一个倒过来的“子”，表示妇女生育，婴儿的头先出来；


    最可怕的是这个字 [图] ，两只手拿着簸（bò）箕（jì），把孩子扔出去，这个字是“弃”，表示遗弃死婴。


    为胎弃婴儿（注：疑为“因夭折而遗弃”）专门造一个字，可见当时婴儿死亡率很高，在那个时代，生养一个孩子非常不容易，妇好贵为皇后，一样死于难产。所以，这也为什（注：疑为“这也说明”或“这也是为什么”）女带好孩子，就是好。


    女人带孩子有多重要，这个字能告诉我们 [图] 。这是姓氏的姓，女人旁边一个生育的“生”。


    在古（注：古代），女人是最重要的生产力，繁衍子孙是氏族、宗奉（注：宗族事务）事。社会最令人共知且毋容其父（注：此处OCR严重混乱，结合上下文应为“社会最令人公认且不容其父权独大”或类似含义，但原文太乱，保留原字但理顺：社会最令人共知且毋容其父。氏族大最女人。）氏族大最（注：可能是“氏族尊重”或“氏族重视”）女人。


    进入男权社会，男外内（注：男主外女主内），生子后代是女人最重要的工（注：工作）。母以妻（注：疑为“母以子贵”或“妻”），所以女人生（注：生养）就是好。


    好字带给我们的启发是：


    1. 好是真。母子关系大概是人类最真诚的关系，母亲的爱永远是毫无保留无微不至的，人类其他关系如父子、兄弟、朋友、家族等等，都不如母子感情纯净深厚，那是深入骨髓的真情。

    2. 好是有价值。人爱孩子是人性，是超越所有阶级、种族、是人类共同拥有的感情，用这样的感情表现广泛意义的好，是再恰当不过的。

    3. 好是美。孩子安安地（注：安安静静）睡在妈的怀里是最美的画面，母亲的慈爱，孩子的美丽纯真，都令我们心动。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_16_0.png)


    在西方油画中，“圣母子”是许多大师一定或反复描摹的重大题材。


    好是真善美，现在有也说二胎政策好，一子一女凑成一个好。


    这种解读也挺好。


    ### 识字卡片


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_16_1.png)


    认识胡琬珠是在一个传统文化雅集上，一个小姐依（注：小姐/孩子）在表演古琴，高人雅士的情怀从一个稚气未脱的小孩子指尖流溢出来，有一种说不出来的美好。


    胡琬珠是这孩子的妈妈，原来是一个室内设计师，已经很有成绩了，有了孩子以后，辞职作了全职妈妈。


    吟诵是唱，是吟，不是朗诵，更接近古诗词原有的声调。


    胡琬珠接触了吟诵以后，自己先着了迷，在朋友圈中创办了吟诵堂。


    又和朋友们创建了古琴广陵派传人刘晋（注：刘晋可能是名字，或“刘瑾”？原文为刘晋），学习古琴演奏。


    说到“好”，我们很自然地会联想到“坏”。对人事物做“好”与“坏”的价值判断，是我们常犯的错误。


    年轻的时候，搞不清楚什么叫价值观，也不知道不同事物的价值排序有什么用。


    所以经常轻易说是非、做判断、下结论。


    最近听说古典老师在 做“价值观”的专题，赶紧提前了解了一下内容，获益良多，推荐给你！


