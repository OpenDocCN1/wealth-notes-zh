    # # 【车】历史的车轮也有掉的时候


    老浦提示：订阅专栏后，文稿中的象形文字可戳可点，放大来看，细细品读。


    # ## 车的发明是打仗用的


    《路史》中说，4600年前，黄帝在空桑山发明了车，横木为轩，直木为辕，故号曰轩辕氏。


    黄帝是中华文明的始祖，他用有轮子的车，拉开了中华文明的序幕。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_35_0.png)


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_35_1.png)


    这是甲骨文的车，黄帝发明的车大概就是这个样子吧。有两个轮子，一个车厢。


    有轮子的车和火的使用一样，是石器时代人类最重要的发明。这是甲骨文沉重的重，一个人背着沉重的包袱。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_35_2.png)


    有了车，人们可以使用畜（chù）力拉车，运力提高了30倍。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_35_3.png)


    这个甲骨文写法有一个车厢，单辕，两幅（fú）挽（wǎn）具，显然是两匹马牵引。


    这可是最早的豪华战车。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_35_4.png)


    考古学家可不承认黄帝造车的传说，人类最早的车发现于古巴比伦。


    美国著名人类学家罗伯特·路威曾断言：凡使用轮车的民族，无一不是直接间接从巴比伦学来的。


    这是埃及图坦卡蒙墓中出土的古埃及战车，和甲骨文的车字几乎一模一样。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_35_5.png)'
  - '[PAGE 36]


    这是埃及坦卡蒙墓中出土的古埃及战车，和甲骨文的车字几乎一模一样。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_36_0.png)


    和古巴比伦、埃及、希腊一样，中国最早的车也是作为战车使用的。


    这种写法的甲骨文明显是一辆战车，非常结实。


    西方的战车最早是单人驾驭，是统帅的座驾，交战的时候需要下车步战。


    好莱坞大片《特洛伊》中阿喀琉斯单车到特洛伊城下挑战就是这样驾车的。他击杀了特洛伊的赫克托耳，并把他的尸体绑在战车上拖回营地。


    中国的战车一开始就有一个结实的轿厢，像坦克一样，是作为大规模杀伤性武器直接上阵冲杀的。


    战车每车驾2匹或4匹马。君子一言，驷马难追的“驷”，就是指这种战车。


    战车每车载甲士3名，按左、中、右排列。


    左方甲士持弓，主射，是一车之首，称“车左”。


    右方甲士执戈，主击刺，并为战车排除障碍之责，称“车右”。


    居中的是驾驭战车的御者，随身携带短剑。


    车下步兵72人，后勤25人。


    只有贵族才有资格乘车征战。


    战车打仗是有严格礼仪的，有点类似骑士决斗。


    两军摆好阵势，各出一辆战车驰（chí）骋（chéng），为“致师”，然后按照约定进攻或防守。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_36_1.png)


    至春秋时期，战车已经成为国家实力的象征，千乘之国、万乘之国，都是以战车的数量表现国家军事力量的规模。


    # 车自古以来就是摆摆场的


    这是金文的车字，相当气派。车从黄帝发明时起，就是王的座驾，天子的仪仗，身份的标志。


    鲁迅先生说：“从前孔子周游列国的时候，所坐的是牛车。”


    鲁迅先生这次大概说错了，孔子周游列国以前，曾经做过鲁国大夫，按照礼制他应该御马车。


    当初拜访老子，就是：


    > “一乘车，两马，一竖子具，适周问礼，盖见老子云。”


    说当年孔子驾着两匹马拉的车，带着一个随从，到周的都城，拜访国家图书馆馆长，请教礼的细节。孔子应该是自己当司机，驾驭马车的。


    御是周六艺之一，是君子基本的技能，也是身份的表现。


    孟尝君的门客冯谖（xuān）弹剑作歌，闹待遇，也是抱怨食无鱼，出无车。


    头悬梁锥刺股的苏秦苦读出来游说赵国成功，赵王为苏秦准备的是五百辆新车，黄金千镒（yì，一镒为20或24两），白璧一百双，锦绣千匹，请苏秦代表赵国邀约其他诸侯国加盟。


    这些车都是摆谱用的。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_36_2.png)


    # 历史的车轮居然掉了


    马车的衰落是因为马。


    首先是单骑的马取代了笨重的战车，赵武灵王胡服骑射，就是为了适应马鞍上的骑兵。


    战车作为贵族礼仪的产物，在《孙子兵法》兵者诡道的实用理念中，退出了历史舞台。


    其余韵，倒是在欧洲中世纪骑士风度中得以再现。


    其次是缺马。'
  - '[PAGE 37]


    战车作为贵族礼仪的产物，在《孙子兵法》兵者诡道的实用理念中，退出了历史舞台。其余的，倒是在欧洲中世纪骑士风度中得以再现。


    其次是缺马。


    中原地区是农业区，缺马，西北草原是牧区，最不缺的就是马。


    谁有马，谁就有了快速移动的运载工具，就有了战场上的主动权。


    汉武帝之所以能够打败匈奴，得益于他的祖父汉文帝和父亲汉景帝大规模地养马。


    但汉末战乱，人都快绝绝了，何况马。皇帝的座驾都找不出四匹颜色相同的马，大臣们只好坐牛车。


    魏晋时期，士大夫竞以牛车为时尚。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_37_0.png)


    “车”字的演变


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_37_1.png)


    有趣的是，中国人竟然发明了独轮车。相传独轮车是诸葛亮为了解决蜀道狭窄，运粮艰难而发明的，叫木牛流马。


    中原缺马，牛也贵啊。


    那么何便宜，人便宜，加上道路差，以人推为动力的独轮车就应运而生了。别看只有一个轮子，载重量惊人。


    民间传说，为了试验鲁修建造的赵州桥是否结实，柴荣推独轮车载着五岳名山上了桥，现在桥上还有车辙印。这当然是民间神话，但看了下面这张照片，您就可以体会这独轮车的厉害了。


    文本中的历史图片你一定要打开看看，内容丰富，一看就懂。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_37_2.png)


    这是轿舆的舆（yú），原


    意思是众人抬起的车厢，


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_37_3.png)


    这是车厢，在车的专用名词中，舆就指车厢。没有轮子的车就是轿子。


    轿子是道路的产物，路难走，又颠屁股，皇帝说把轮子去掉给我抬着走。这就是四只手抬着车厢的舆了。'
