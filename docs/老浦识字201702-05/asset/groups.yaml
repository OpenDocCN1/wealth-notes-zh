    \n### 改变历史的一次眺望\n\n1492年，哥伦布的帆船已经在大海中航行了两个多月。疾病、饥饿和茫无尽头的恐惧让船员们的精神接近崩溃。他们以叛乱相威胁，拒绝继续向西航行。哥伦布经过艰苦的谈判，最后商定：3天，再向西航行3天，如果还见不到陆地，就返航。\n\
    \n3天，水手每天都爬到桅杆最高处向前方眺望。第三天，“陆地！陆地！”，水手大声高呼。\n\n这是1492年10月12日，这一天后来被定为西班牙的国庆日，而这次眺望，改变了历史。\n\
