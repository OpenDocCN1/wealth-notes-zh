    ## 威压的结果


    秦一统六国，不仅完成了行政区域的大一统，也结束了百家争鸣的文化盛景。焚书坑儒标志着对言论的全面钳制。


    就汉字而言，笔画匀称却缺乏个性的小篆，取代了庄严肃穆的金文，也取代了装饰性的鸟虫篆、飞扬写意的楚简篆字。


    > 我们总是肯定秦书同文、车同轨的积极意义，但是大一统对于艺术、对于个性的压制是历史的遗憾。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_12_0.png)


    左图是楚地出土的竹简，我们称之为楚简。这是一种完全不同于秦体的书体，也不同于铸造在青铜器上的金文，我们可以称之为大篆的行书体，非常灵动，用这种字体抄写的《老子》，最能表现老子天然随性的思想特征，这种字体在秦小篆以后就消失了。


    右图是战国时期兴起的鸟虫篆，流行于吴楚，常常刻在兵器上看到，说明早在战国时期，人们已经把汉字当做装饰图案使用了。这种方法后来用在印章上，但作为书体，随着秦朝在博览的基础上将其消灭了。


    ## 威的本质是优秀


    秦始皇的仪仗排场也是规模空前。多人的排场，你可以去西安参观秦兵马俑。专家最新的研究成果表明，这个规模宏大的墓葬坑，并非我们传统认知的秦军军阵，而是秦始皇巡视的全套仪仗。


    秦朝官吏百姓叫黔首，意思是戴黑色头巾的人。但是威压之下的黔首真的如统治者想象的，像女人一样柔顺吗？


    司马迁在《史记》中记载了三个人看见这套威风赫赫仪仗的反应：


    - 未来的汉高祖刘邦说：“嗟乎，大丈夫当如此也!”，这是羡慕。

    - 未来的西楚霸王项羽说：“彼可取而代也。”，这是野心。

    - 而未来的开国军师张良干脆准备了一个大铁锤，雇佣一个勇士，在博浪沙奋力一击，可惜只击中副车，这是行刺。


    由此可见，暴力的威压只会换来暴力的反抗。中国历史由治而乱，又由乱而治的循环，很大程度上是这种威压造成的。


    立威就是小题大做，就是吓唬人的秀。但吓唬的不是女人，而是大众，幻想在大斧子的威慑下，人民像女人一样顺服。


    可能吗？


    网上有一段视频，拍摄印度、巴基斯坦边界的降旗仪式。


    为了显示军威，两国士兵恨不得把地跺塌了，动作夸张用力的程度，让我十分担心这些士兵的膝盖会不会一不留神踩折了。


    他们自己一定觉得，这很威风。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_12_1.png)


