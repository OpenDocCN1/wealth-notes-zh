    \n在民间，老百姓最推崇的是关公对朋友的仗义。在战场中，关、关云长和黄忠打成平手，第二天关公用拖刀计正欲斩老黄忠，黄忠却马失前蹄。关公不愿趁现做成宜，放过了黄忠。所以第三天黄忠也射中关羽脑袋接镖报孝。\n\
    \n当然，关羽最受争议的仗义是华容道，放走了曹操。\n\n关羽本来是立下军令状的，放走曹操，自己就要军法从事。\n\n对曹操的情义，关羽是有思想准备的，丞相之恩，已经斩颜良、诛文丑，解白马之围相报。但曹操提出你过五关斩六将，那么说。关羽竟然无言以对，可见他的恩义，拎的很清楚。最终放走了曹操。\n\
