    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_23_0.png)\n\n## 【灾】一个刻进我们基因里的字\n\n\
    老谢充满：订阅专栏后，文稿中的象形文字可读可点，放大来看，细细品读。\n\n截一下试试：\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_23_1.png)\n\
    \n### 糖尿病跟“灾”字有关\n\n你知道糖尿病和灾难有关吗？\n\n中国是糖尿病第一大国，据卫生部门的数据，2014年我国糖尿病患者1.14亿，也就是说，不到10个成年人中，就有一个糖尿病患者。\n\
    \n我父亲安徽人，有一句口头禅，“宁可撑死个人，不能占个益”，决不允许剩饭，拜我父亲教育所赐，我是饭桌上著名的垃圾槽，结果吃出了糖尿病。\n\n吃到饭能 eat\
    \ 出糖尿病？没错。\n\n美国遗传学家尼尔教授在20世纪60年代首次提出“节俭基因”学说。他认为，饥饿让那些吃了上顿没下顿，在营养很差的情况下仍然能够生存的人，进化出“节俭基因”。\n\
    \n中国是世界上灾祸饥荒最多的国家之一，饿了多少年多少代，却在我们这一代突然进入稳定富足的现代社会，滴灌改漫灌了，那还不水漫金山。这回真“撑死个人了”。\n\
    \n“灾”这个汉字，居然已经刻进了中华民族的基因里了。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_23_2.png)\n\
    \n灾难世界各国都有，为什么中国人的基因会刻下节俭基因呢？\n\n### 中国的历史就是一部抗“灾”史\n\n我们看甲骨文就明白了。甲骨文“灾”\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_23_3.png)\n\
    \n字是滔滔洪水的象形，\n\n还有一种写法\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_23_4.png)\n\
    \n是表示大水的“川”淹没了居梁“才”，也是水灾。\n\n中华维族的发祥地在黄河流域，而历史上黄河是一条最捉摸不定的河流，经常泛滥改道。“十年河东十年河西”说的就是黄河泛滥改道。\n\
    \n甲骨文距今3500年前，是商代晚期的文字，商朝500多年历史，前二百多年曾迁移过13次，到殷，也就是今天的安阳，由于地势较高才稳定下来。这样的迁徙多出于躲避洪灾。\n\
    \n而在对抗荒漠的恐惧中，钱才是最让人安心的信仰。\n\n为了活着，诡诈、欺骗是生存的需要，蛮不讲理地活着也是英雄行为。这种注重实用，生存为先的思维方式，任不假称之为“灾民理性”。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_24_0.png)\n\n对武松的崇拜也是因为“灾”。\n\n仔细读一读《水浒》原著，你会发现施耐庵笔下的武松并不是理想的英雄。\n\
    \n就说武松打虎。路过景阳冈，连喝18碗酒，已经醉了，还非要上山，酒保的劝说，官府的文告都不听。\n\n这个，和八、八达岭野生动物园那位女士，和老公吵架，在虎园下车被老虎拖走，有什么区别，都是漠视规则，负气任性。\n\
    \n武松更是为了面子，虚荣心作祟。\n\n为什么都是没有规则意识，那位女士遭到众口一词的指责，而武松却受到崇拜呢？\n\n因为武松拳头硬。\n\n《水浒》脱胎于民间话本，充分反映了民间价值观。这是典型的灾民心态。\n\
    \n在灾年中，大家都是武大郎，官府欺压，邻居算计，富豪还来勾引你老婆。如果有个武松这样的兄弟，谁还敢娶来惹？这就是蛮不讲理地活着。\n\n### “灾”的记忆仍然深刻地影响着我们\n\
    \n简化字的灾是宝盖头下面一个火，宝盖头在汉字的构件中表示房屋。房屋是人工建筑，这颇具象征意义，人类对于自然灾难的抵御能力大大提高。\n\n但是人为的灾难，比如环境污染、全球变暖以及类似SARS这样的病毒传染，仍然威胁着人类的安全。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_24_1.png)\n\n而刻在人类基因里的灾难印记，还深刻地影响着我们的社会和每个人的心理。\n\
    \n我们今天的很多社会现象都是灾的记忆有关的。比如上文说到的缺乏信仰，无原则的崇拜暴力，实用为先，以及我们在老人身上看到的舍不得吃舍不得穿，“宁可撑死个人不能占个盆”对食物的珍惜等等，都是灾难给我们骨子里的不安全感。\n\
    \n我们认识了汉字的灾，就充分意识到，灾难是现实的，也是历史的。\n\n我们不仅要现实中防范灾难，还要认识和克服灾，在我们心里留下的阴影。\n\n### 识字卡片\n\
