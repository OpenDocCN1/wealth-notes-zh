    \n  但是我一直对此并不太服气，因为我们的\n\n  轩辕皇帝，就是以车命名的，今天老浦\n\n  老师的讲解让我悟到了一些轮子专利权\n\n  之处的道理，每个文明都贡献给它的\n\
    \n  文明赔金，西方世界在经历了文艺复兴、宗教改革、思想启蒙后进入了工业\n\n  革命，一跃成为世界发展的领头羊，那\n\n  他们大家要有轮子的专利权谁为已有，\n\
    \n  因为人家有实生力。反观中国，虽然早\n\n  熟，自力更生发明了轮子，发明了战\n\n  车，但由于长期的帝王土法加等级观念，让我们逐渐的将车轮子去掉，变成\n\
    \n  人抬，赤裸裸的返祖。别人依靠车轮\n\n  子飞速崛起，我们去掉车轮子悠然自\n\n  得，最终导致1840后的遍地蝴蝶，没有\n\n  实力经就输不才专利。所以，发展才是\n\
    \n  硬道理，打破等级观念，注入时代引擎\n\n  的发展更是硬道理。但是，从很多现状\n\n  看我们的很多观念依然根深蒂固，老浦\n\n  老师在文末表达的现象几十一年后依然存\n\
