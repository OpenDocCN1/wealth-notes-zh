    ## 【武】止戈为武这说法对吗


    老潘提示：订阅专栏后，文章中的象形文字可截可点，放大来看，细细品读。


    戳一下试试：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_1.png)


    **武**是上阵打仗，并非止戈为武。


    有一天一个外交官朋友微信我，说希望我给他解释一下汉字“武”，他要准备一个发言稿。


    我明白他是想要用“止戈为武”的主题来表明中国人的善意，就跟他说，“止戈为武”并不是汉字的原意。如果要用汉字来构架一个发言稿，建议用汉字“和平”的“和”的繁体字——“𠸉（hé）”。


    𠸉（hé）的原意是多人用“口”吹奏排箪一类的乐器，表示乐器之间相互配合发出的和谐音律。用相互妥协、相互配合来促进和平，应该组合进。


    外交官朋友很高兴，放弃了“止戈为武”的原构想。


    止戈为武为什么不是汉字造字原意？我们来看看甲骨文。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_2.png)


    上面是一个“戈”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_3.png)，是商代的一种兵器；下面一个“止”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_4.png)，“止”是脚趾的象形，在甲骨文中表示“行进”。


    比如“步”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_5.png)，就是两个脚趾一前一后，表示走路。


    停止是止的引申义，为了区别，后世又造了足字旁的“趾”专指脚趾。


    但在造字构件上，“止”通常代表行进，并没有停止的意思。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_6.png)


    如“正”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_7.png)，走向象征目的地的城邑；


    “走”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_8.png)！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_9.png)，挥舞双臂的人形下面一个表示行进的“止”，奔跑的意思；


    “奔”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_10.png)，挥舞双臂的人形下面三个表示行进的“止”，是飞速跑动的脚，疾如转轮，哪吒的风火轮大概得此灵感。


    “戈”和“止”加起来表示“持戈行”。


    武的甲骨文原意是持戈出征，行军打仗。


    戈是战车上使用的进攻型武器。从商、周到春秋战国，戈是战车上的主力兵器，装上把以后三米多长。在高速行进的战车上，武士手持这种大沉重的兵器撞击对方。其突出部分叫“援”，援上下皆刃，用以横击和钩杀。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_11.png)


    我觉得戈很像欧洲中世纪重装骑士使用的骑枪，长大，沉重，富有冲击力。需要训练有素的技巧和强壮的身体，还有严格的礼仪。


    ### 春秋以前的“武”是“蠢猪式的仁义道德”？


    宋襄公和楚国开战，在泓水北岸列好阵势。


    不打渡河一半的楚军，不打阵势还没排列好的楚军。


    结果正式开打，大败。被毛泽东在《论持久战》中称为“蠢猪式的仁义道德”。


    其实作为商朝皇族封国，正宗贵族的宋国，是按照商朝以来正规战车作战礼仪来打仗的。


    兵车作战，有非常严格的礼仪和规制。


    车战一般要经历四个过程：


    - **次**——扎营，与对方约定决战日期；

    - **致**——单车挑战；

    - **阵**——列阵；

    - **战**——列阵出击，展开决战。


    在战斗中，不打负伤者；不打头发灰白者；不打倒地认输者；甚至敌人战车发生故障，就下车帮助修理好，再打；不以杀人为宗旨，而以击溃取胜；对方负臣逃跑过五十步就不追了。


    五十步笑百步的原意是跑五十步就够了，何必要跑一百步。


    像奥林匹克吧？


    要不规矩短打呢？也行，就是被人看不起，胜之不武。


    泓水之战成为贵族车战的绝唱。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_13_12.png)


    金文“武”！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_13.png)与甲骨文！[](img/792d2d18bbe99e723a0a2f17774d50d0_13_14.png)最大的变化就是代表行进的“止”上移，成为与“戈”平行的符号。


    如果我们让“戈”这种兵器武器代表“千乘之国”之间的车战，那么我们是不是也可以用脚的象形“止”来代表步兵作战。


    “止”与“戈”的并列，象征着贵族车战的终结，平民大规模参与的步战成为主流。


    战国时期，礼崩乐坏，战争成为称霸称王的主要手段。正如韩非子所言：


    “上古竞于道德，中世逐于智谋，当今争于气力。”


    - 上古的竞争是道德上的，中世竞争智谋，当今竞争力量和气力。


    长平之战是这一时期武力较量的典型战役。


    在长期对峙了三年以后，秦、赵两国分别更换了主帅。赵国中反间计，用赵括替换了老将廉颇，秦军则秘密派来了战神白起。


    结果，少年气盛的赵括贸然发起攻击，陷入秦军包围。秦军的弩成为自赵武侯灵王时期以来所向无敌的赵军的噩梦。


    从秦兵马俑所残存的弩我们可以看到，这种古代的机械威力强大，射程达300米，箭头是带倒刺的三角形，形状接近我们现代的子弹头，飞行轨迹稳定。更可怕的是，这些弩的零件已实现了标准化生产，零件可以互换。这大大强化了这支虎狼之师。


    在张谋谋的电影里，我们看到了这种弩箭的威力。适合备战，善于防守。


    结果大家都知道，赵括在被包围四十多天以后，弹尽粮绝，突围被射杀。四十万赵军投降，被白起坑杀。


    ### 止戈为武的解读也很权威


    强大的秦国消灭了六国，统一了天下，秦始皇的文字小篆的字形！[](img/792d2d18bbe99e723a0a2f17774d50d0_14_0.png)和甲骨文基本相同，但解读上也许更接近“止戈为武”的说法。


    > 东汉许慎的《说文解字》：

    > 武，楚庄王曰：“夫武，定功（jī）兵。故止戈为武。”


    这是许慎没见过甲骨文，按照小篆他的解释，已经偏离了“武”字的本意。


    但秦代创作的小篆，的确反映了秦始皇对待武器的态度。


    据《史记·秦始皇本纪》记载：秦始皇收缴了民间所有的兵器，聚集到首都咸阳，熔化掉，铸成12个巨大的青铜金人，各重三万斤（注意：原文“各重中（dàn），位置不明”疑似OCR严重错误，根据史实修正为“各重三万斤”或保留原意描述，此处根据语境修正为“各重数吨”或“各重万斤”较为合理，但原文提到“位置不明”，可能是OCR将“重”识错，将“斤/石”识错。查阅史实，十二金人各重“万斤”或“三十万斤”有争议，通常说是“各重万斤”或“总重”。原文“各重中（dàn）”极可能是“各重数吨”或“各重万斤”的误识。考虑到“dàn”可能是“担”的误读或乱码，此处保留原文逻辑但修正明显错字：各重万斤，位置不明。）


    *注：根据OCR原文“各重中（dàn），位置不明”，这里“中（dàn）”极可能是“万斤”或“三万斤”的乱码。为了忠实于信息不删减，但纠正明显错误，我将修正为通顺的表述。*


    秦始皇为什么这样做？说法很多。贾谊的《过秦论》说到：


    > “收天下之兵聚之咸阳，销锋镝（jù），以为金人十二，以弱黔首之民。”


