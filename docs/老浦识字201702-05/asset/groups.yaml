    # 【囧】这个字真的很囧


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_7_0.png)


    老浦提示：订阅专栏后，文章中的象形文字可戳可点，放大来看，细细品读。


    戳一下试试：


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_7_1.png)


    到网上搜索“囧”这个字，立刻弹出来很多关键词，有囧图、囧巴、囧故事、用囧作名字，当然，还有《人在囧途》系列电影，这可是创下票房奇迹的大电影。


    显然，囧这个字是一个网络热词。这大概就是一个表情包，查拉着双眼，撇着嘴，一副倒霉加无辜的样子。


    但是，囧这个字还真是一个古汉字，并且是一个已经死亡的汉字。它被网友发掘出来，赋予了新的含义。


    # 1、


    那他原来的意思是什么呢？


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_7_2.png)


    我们看甲骨文的囧是圆形的，中间有三个弯曲的线条，构成一个有装饰性的螺旋体。


    它原意是房子的天窗。


    # 2、


    商代中原地区居民大量的是半地穴式，就是挖一个很深的大坑，然后在上面盖一个屋顶遮风挡雨。这样的房屋冬暖夏凉，建筑成本很低，很多汉字都是由这种建筑创造出来的。


    比如出入的“出”，


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_7_3.png)


    就


    是迈脚走出洞穴。


    升降的“降”，


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_7_4.png)


    就是两只脚顺着梯子下来。


    这个“囧”字也是这种建筑的产物，大家从图片可以看出，在屋顶的遮盖下，房子是全封闭的，如果生火做饭取暖，烟就很难排出去，这样就需要开个天窗，以便通风，同时为屋子提供照明。“囧”字就是这种天窗的象形。


    任何事物只有对比才能显现出来，屋子里本来很暗，天窗射进来的光线就显得格外明亮，所以“囧”就有明亮的意思。


    我们说床前明月光的“明”，甲骨文就是一个“囧”字加上一个月亮的“月”，表示月光从天窗射进来，格外明亮。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_7_5.png)


    随着社会的进步，人们生活方式的改变，这种半穴居式建筑退出了历史舞台，人们可以建造更舒适方便的土坯房、砖房了，


    窗


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_7_6.png)


    代替了囧，慢慢的，


    这个字就死亡了，躺在厚厚的字典里无人问津，直到被网友重新挖掘出来，赋予了新的意义。


    # 3、


    囧也好，窗也好，都是昏暗房屋的光源，因此在古汉语的意境里，总是与家庭的温暖记忆联系在一起的。


    晚唐诗人李商隐的《夜雨寄北》就描述了在窗前的温暖意象：


    > 君问归期未有期，巴山夜雨涨秋池。何当共剪西窗烛，却话巴山夜雨时。


    这是李商隐在四川写给自己妻子的诗，意思是：


    你问我何时能够回到长安，我也没有准确的回答啊。这个时候我的屋前，大巴山的夜雨已经让池塘涨满了秋水，我独居寂寞的心情你可想而知。什么时候我能够回到家中，在西窗下初夜长谈，蜡烛燃烧得长了，我们就像往常一样共同把它剪掉，那时候我会好好跟你说说当巴山夜雨中灯火昏暗时，是怎样的心情。


    有点过蜡烛经验的朋友一定知道，蜡烛燃烧到一定时候，燃烧过的烛芯越来越长，剪掉以后，会使烛火一下子明亮、稳定下来。


    西窗剪烛，一定有说不完的话，诉不完的情，这是一幅温馨的画面。


    但是悲剧的是，就在李商隐在巴山夜雨中思念妻子，期待重逢的时候，他的妻子王氏已经在夏秋之交的时候因病去世了。


    西窗共剪永远成为梦幻泡影。'
  - '[PAGE 8]


    窗户不仅是家庭温馨的背景，也是天然的图画，画竹名家郑板桥就说：


    我家有茅屋二间，南面种竹。


    秋冬之际，用均薄细白纸糊上窗户。


    风和日暖，一片竹影零乱，就是一幅天然图画。


    我画竹，无所师承。


    我的墨竹都来自于纸窗、粉壁、日光、月影中。


    如此诗情画意的意境，在我们今天用“囧”这个字的时候，意义、意境已经南辕北辙了。


    4、


    # 那你说这叫恶搞吗？


    我看未必。一个时代有一个时代的语言环境，把一个已经死亡的汉字重新激活，成为代表我们情绪的新字，是文字生命力的表现。也体现了象形文字在今天读图时代特有的优势。


    就像2008北京奥运设计的那套依据甲骨文造型的运动项目标志图案，既有中国特色，又很简洁时尚，令人拍案叫绝。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_8_0.png)


    囧，由诗情画意转为尴尬悲惨，还是那么鲜活。


    有一次，初识一个老板，他问我是做什么工作的，我说我搞电视节目策划。


    他就问那你认识王刚吗？我说认识，一起开过几次策划会，也一起作为嘉宾上过节目。


    结果在开会的时候，老板向大家介绍说：这是著名策划人，王刚就是他捧出来的。


    囧，囧，囧。


    不能承认，又不好扫打劫人老板的面子断然否认。


    这是我最囧的时候。后来还是在发言中，把真实情况再说了一遍。


    囧。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_8_1.png)


