    \n## 【人】人字的结构不是相互支撑\n\n【答案】人的结构不是相互支撑\n\n### 人的本质是生命力\n\n古希腊有一个人狮身人面的女妖，名各斯芬克斯。她坐在悬崖上，向过往的行人出一个谜语：什么动物早晨四条腿，中午两条腿，晚上三条腿，腿越多，越无力。猜不出来的人都被女妖吃掉了。\n\
    \n希腊英雄俄狄浦斯路过此地，同样遭到了斯芬克斯的盘问，俄狄浦斯经过思考，大声地说出答案：这是人。\n\n- 人在婴儿时期，就是人生的早晨，柔弱无力，只能用四条腿来爬行；\n\
    - 中午是人的壮年时期，用两条腿行走；\n- 而晚上就是人的暮年，在人的暮年，他要拄着拐棍，这不就是三条腿吗？\n\n腿最多的婴儿时期最无力。\n\n司芬克斯被猜中了谜底，羞愧地撞下山崖死了。\n\
    \n这个神话传说表现了希腊文化里面一个特别重要的课题——人，我们从哪里来，要往哪里去。\n\n在古希腊太阳神庙上，有一行大字，人啊，认识你自己。\n\n甲骨文里的人只有一条腿，是一个人的侧面的形状。这个侧面形状的人弯着腰，仿佛在田间劳动。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_25_1.png)\n\n甲骨文里的“孑”的写法，一个大大的脑袋，柔软的身体，和挥舞着的双臂。这与斯芬克斯谜语道理是一样的，表现的就是小孩子的柔弱，这是人类最萌、最可爱的一个时期，这是早晨。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_25_2.png)\n\n甲骨文里头发考试的“耄”，就是一个长发、弯腰驼背的一个老人的形象，拄着一个拐棍。在古汉字典里，“耄”就是老的意思。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_25_3.png)\n\n我们在甲骨文里居然找到了和斯芬克斯谜语完全相对应的三个汉字，东西方的文化有着多么奇妙的一个暗合。\n\
    \n更重要的暗合实际上是精神上的，在古人的概念里，只有活动的人形它才能称之为“人”，也就是说生命力、活力是第一位的。\n\n> 古希腊人说：生命在于运动。\n\
    > 中国古人说：天行健，君子以自强不息。\n\n来看看小篆的“人”。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_25_4.png)\n"
