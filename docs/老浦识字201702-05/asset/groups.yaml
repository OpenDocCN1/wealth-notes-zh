  md: "\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_0.png)\n\n## 【安】关于房子的梦想\n\n老禛提示：订阅专栏后，文稿中的象形文字可截图点，放大来看，细细品读。\n\
    \n有个段子：想搞工作的十几年，谁都没骗过我，就房产中介没骗过我，他们十九年来一直苦口婆心地骚扰我让我买房，说房价一定会涨，我没听。\n\n如果上天给我一次机会重来，我一定不会挂你电话！\n\
    \n这个段子说出很多人的感受：房价2千的时候嫌贵没买，现在都2万了，还是二环以外的。\n\n房子，是多少人可望不可即的梦想，正像另一个段子说的：如果你一个月挣1万，想在深圳买一套100平的房子，那么没关系，可以先定个能实现的小目标。\n\
    \n——比方说先买个500年。\n\n真是安居才能乐业啊。\n\n在甲骨文那个年代，安居同样是美好的梦想。安居的“安”，就是这样造的字。\n\n### 安居是美好的梦想\n\
    \n“安”在甲骨文是一个房子里加一个安坐的女人。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_1.png)\n\
    \n坐就是安呢？\n\n在商代，部族之间的战争非常频繁，在殷的周边，有狄（dí）、羌（qiāng）、荆楚等部族，打仗是家常便饭，而在战争中如果被俘虏，就会沦为奴隶。\n\
    \n我们以前讲过的“奴”中就涉及到奴隶的奴，\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_2.png)\n\
    \n就是只手抓住一个女人，这人才沦为奴隶了。\n\n这是“妾”，女人头顶上有一把刑刀，这是女奴。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_3.png)\n\
    \n这是“奚”，是只抓手指的奴隶，有个被绑缚的人，这就是战俘了。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_4.png)\n\
    \n这是“及”，一只从后面抓一个人，这是追捕逃跑的奴隶。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_5.png)\n\
    \n这是“囚”，被抓住以后就是这悲惨的下场。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_6.png)\n\
    \n所以，女人能在屋里坐着，是多么安宁的场面。这样的安居实在是太来之不易。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_7.png)\n\
    \n那时候北方的民居是半地穴式的，要先在地上挖个坑，然后在上面搭个房子，中间用一根柱子顶上。汉字“宋”就是表现这种房屋的。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_8.png)\n\
    \n### 安居不易，安稳为先\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_9.png)\n\n这是秦代李斯的字体\n\
    \n来自《诅（jǔ）石颂》，原石已经毁了，这是后人仿写的。李斯的字，笔画粗细均匀，结构四平八稳，显示着秦代在严刑峻法之下规整森严的社会特征。\n\n李斯、商鞅是将秦国由一个边塞野蛮的二流国家变为一个强大的虎狼之国的关键人物。\n\
    \n商鞅变法，把整个秦国变成一个大军营，他首先推行户籍管理，实行什伍连坐，五家为伍，十家为什，要他们相互监视，纠举“奸人”，隐瞒不报者连坐。\n\n告奸者与斩敌者同赏，匿奸者与降敌者同罚，不告奸者腰斩。\n\
    \n这样的居住制度，不仅谈不上安居，还让人自危，开启了民间告密制度的恶劣先例，这样的保甲制度我们在电影《抓壮丁》里还可以看到。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_19_10.png)\n\
    \n商鞅变法和李斯主张焚书坑儒，作为法家人物一度受到推崇，认为他们的铁腕帮助秦国完成了统一大业，在这样的历史大潮之下，个人的福祉（zhǐ）不值一谈。\n\n\
    老嘴认为好的制度首先应该是让老百姓安居乐业的，什伍连坐这样反人性的制度，焚书坑儒这样反文明的逆行，注定会反噬制度制定者本身。\n\n商鞅发现新王要收拾自己，赶紧逃命，但他自己制定的什伍连坐制度让他根本找不到敢收留他的民家或旅店，最终被逮住，惨遭车裂。\n\
    \n李斯则遭到赵高诬陷谋反，惨遭腰斩，成为专制制度的殉葬者。\n\n### 两千年来安居梦\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_20_0.png)\n\
    \n这是明末清初大书法家王铎（duó）的行草“安”字，王铎（duó）的创作功底极深，“一日临帖，一日作书，一日创作作品，一生不辍（chuò）”。\n\n行笔刚毅，元气充盈，很多人对他的书法评价极高，称500年第一人。\n\
    \n日本人甚至推崇他“后王胜前王”，意思是称赞他书法的成就超过王羲之、王献之的前王。\n\n我们从这个行草字体的“安”字可以感受到，甲骨文表示房屋的大屋顶仅为草草的一横勾，“安得广厦千万间，大庇天下寒士俱欢颜。”也一直是老百姓难以企及的梦想。\n\
    \n两千多年的历史，太平盛世加起来也就两三百年，历史上很多次人口损失动辄80%，甚至90%：\n\n> “马刮人头，车后载妇女”：\n> “白骨露于野，千里无鸡鸣，生民百余年，念之断肝肠”。\n\
    \n曹操的诗句是战乱以后动乱的写照。\n\n就拿王朝生活的明末清初而言，从李自成起义到吴三桂灭亡，战乱五十四年。\n\n明末人口为一亿，到清世祖时全国人口只剩下1400多万，锐减了80多，损失人口8000多万。\n\
    \n清朝白莲教起义，损失人口一亿一千万。\n\n太平天国起义损失了2亿人，其中直接死于战争的4000万人。\n\n数字可能有误差，事实是肯定的，那就是在这样的战乱之中，人命如草芥，兵火过处一片废墟，哪有安居可言。\n\
    \n唐朝人张固在《幽闲鼓吹》中记载：\n\n> “白尚书应举，初至京，以诗谒顾况。”\n\n说白居易到京城应举，拿着自己的作品拜名人顾况的门头。\n\n>\
    \ “顾睹其名，熟视白公曰：‘米价方贵，居亦弗易。’”\n\n顾况一看，白居易，京城米贵啊，居住可不易。\n\n乃拔卷，首篇曰：\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_21_0.png)\n\
    \n## 【艺】艺术应该有点敬畏\n\n老蒲提示：订阅专栏后，文章中的象形文字可能太密，放大来看，细细品读。\n\n### 一万小时成就一门技艺\n\n在网上看到一个说法，说是外国人研究的，一个人只要孜孜不倦连续学习一万小时，就能成为任何一个领域的专家。有人算了一下，按每天学习3小时，一年300天计算，要苦读7年。每天2小时，就是10年。\n\
    \n十年寒窗，磨出一门手艺。\n\n在古代市场，经常能够在古玩店的角落里发现堆着一些用过的老砚台，都是古玩商收藏的民间日用的普通砚台，石质一般，不大值钱。特点是个个砚台都磨出了深深的小坑。\n\
    \n那是多少个寒窗，磨掉了多少墨块，写亮了多少只毛笔，才能磨出这样的小坑。\n\n手艺是磨出来的。\n\n但是下苦工耕时间就能成大师吗？显然不行。那成就一个大师的关键在哪里呢？\n\
    \n还是从我们古老的汉字中寻找答案。\n\n### 甲骨文的“艺”是一幅图画\n\n甲骨文的艺是一个跪坐的人形\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_21_1.png)\n\
    \n，手捧一只树苗，表示种植苗木。\n\n艺，本义就是园艺、农艺。表示种植物、培土除草。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_21_2.png)\n\
    \n甲骨文“艺”从跪坐的姿态上看，显然不是表现实在在地种树，而是在举行某种祭祀仪式。\n\n这就是我们说的工匠精神。\n\n一说工匠精神，就会想到德国、日本。其实我们中国传统的工匠精神可以说是登峰造极。\n\
    \n比如越王勾践的宝剑，在地下埋了 2400 多年，出土以后依然锋利无比，它的工艺我们现在都做不出来。\n\n今天我们从汉字“艺”学上，要传承的就是这种精神。\n\
    \n### 中国艺术也有着文艺重传承的特征\n\n“艺”字技术、恭敬的本意，也引申出艺术的含义。\n\n另一路孔夫子统领的贵族范六艺，是礼、乐、射、御、书、数，同样的虔敬，同样的讲究传承。\n\
    \n这六艺是古代君子要掌握的基本技能。这一方面是一种技能，也是艺术。\n\n科举制以后，儒学成为主流，琴棋书画成为士大夫文人雅士的闲趣爱好。但就是这样的情雅致，也还是具备汉字“艺”农业文明的特征，讲敬重、重传承。\n\
    \n比如书法，一万小时，必须是临摹。\n\n![](img/792d2d18bbe99e723a0a2f17774d50d0_22_0.png)\n\n###\
    \ 脱离农业社会影响的现代艺术很任性\n\n简化字艺术的“艺”是草字头下面一个乙。这个简化字很好，它既没有繁复笔画等繁杂因素，也没有横平竖直等传统程式的拘泥，简单直接，朴实无华，是告别了农业社会，进入现代艺术的写照。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_22_1.png)\n\n但是遗憾的是，这个简化字消解了敬意，那种庄重的均衡之美也没有了。当代艺术的任性，最稀缺的就是敬畏，对传统的敬畏，对艺术本身的敬畏。\n\
    \n美国社会学家理查德·桑内特写了一本《匠人》说：\n\n> “匠艺活动涵盖的范围可远达不仅是手工的劳动，它对程度而言、医生和艺术家来说同样适用。哪怕是匠业子女，只要你把它当做一门手艺来做，你在这方面的水平也会得到提高，当一个公民也是如此。”\n\
    \n桑内特把匠人的精神提炼出来，那就是持之以恒的投入和专注。\n\n通过解读汉字艺，我们知道，成就一项事业，敬畏、持久和专注，是成事的基础。\n\n###\
    \ 终于要见面了。\n\n3月9号，也就是本周四晚的8:00，我在得到APP直播，我将拆解姓名中常用的汉字。周三晚上9点半以后就可以预约直播，期待与你交流。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_22_2.png)\n\n老浦东家学渊源，从小就练字。后来捱（láo）下了。\n\
    \n十几年前突然发现练毛笔字，遂决定重拾书法，用毛笔写日记，就这样重新开始练字。\n\n这十几年练字主要是临帖（tì）。个人体会，临帖（tì）虽然是亦步亦趋地活在别人的世界里，但就在那一步一趋中，熟悉了笔意，找到了笔感，这样的笔感几十年也丢不了。\n\
    \n就像戏曲，必须是童子功，科目苦出来，然后才能有扎扎实实的一招一式。\n\n说到艺术的“艺”，音乐是人类最古老和最有魅力的艺术门类之一。隔壁的《雪峰音乐会》是我特别喜欢和欣赏的一个节目，我自己就是雪峰的忠实用户，欢迎你到隔壁去串门，体验一下音乐的魅人。\n\
    \n![](img/792d2d18bbe99e723a0a2f17774d50d0_22_3.png)\n\n### 用户留言\n\n- **陈双平**\n\
    \  已经跟浦老师学习识字一段时间了，不久看到这个“学”字心得不得：正是我想要知道的！一直对汉字感兴趣，每个汉字都从一个故事，一段历史，一个故事。我的方案是，有个目标就是把浦老师的话，全部领会。\n\
    \n- **李天天**\n  借用隔壁吴军老师的一个观点。做事情0到50分，靠的是常识，50到90分靠的是科技，九十以上靠的是艺术。说到你学习自己，我做的事情是想达到艺术的境界，是比较难的。但是我们做事情应该有那种追求艺术的态度，敬畏，执着，不断精进，追求卓越。\n\
