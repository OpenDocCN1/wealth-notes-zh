    坐着的人形。他还是人的意思，不过是死人。对于逝去的亲人，更是事死如事生。


    这反映了仁字的另一层含义，就是孝道。


    孝道是仁的重要组成部分，在儒家的道德体系里，爱人，首先是孝敬长辈。


    宋江还有一个外号就是孝义黑三郎，他的孝敬是很出名的。


