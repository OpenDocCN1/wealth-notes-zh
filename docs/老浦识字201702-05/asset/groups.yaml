    有时候一个事要问二十几个问题。


    然后把占卜的结果，包括是如何应验的，刻在龟板兽骨上，甲骨文就这么诞生了，汉字就这么诞生了。


    # 老天爷你喜欢啥


    人喜欢啥老天爷就喜欢啥。越珍贵越有诚意。


    青铜器珍贵，祭。


    我们今天看到的大型青铜器，没有一件是实用器，都是用于祭祀的。


    玉珍贵。祭。


    殷墟妇好墓里出土玉器755件，很多都是和田玉，从遥远的新疆运过来的。苍璧礼天，加工这么一件玉璧，工匠起码干一年。


    ![](img/792d2d18bbe99e723a0a2f17774d50d0_73_0.png)


    牲畜珍贵。祭。


    安阳殷墟发现了上千个祭坑，里面堆满了牲畜的尸骨。有牛、羊、猪、狗，还有马、狐狸、熊等，还有人。


    人珍贵，那都是劳动力啊。祭。


    甲骨文记载，从盘庚迁殷到帝辛灭亡的273年间，人祭达万人之多。一次祭祀，少则十几人，多则上百人，最多一次祭杀800人。


    我去安阳参观的时候，对他们复原的宫殿遗址印象很深。宫殿地基堆满了尸骨。门口、柱子下面等重要的地方都有专门的人祭。


    老天爷您还喜欢啥？


    大旱。


    为了求老天爷下雨，商王直接把巫师烧死，把老天爷最喜欢的人送给他。甲骨文“烋（jiao三声）”就是火上面一个人交叉两腿的形状，旁边还有点小符号，不知表示火星还是巫师的人油。


    所以当巫师也有风险。


    # 天，老子就是不怕你，你能把我咋地


    祭祀实际是一种权利，代表天意发布施令。当商王和巫师在权力上产生矛盾，斗争就开始了。


    有一个商王叫武乙，决心破除对天的崇拜。


    据说他让人制作了一个革人，称之为“天神”，然后和革人下棋，命人替天神出子。结果“天神不胜”，武乙便将革人斩首，用刑戮对“天神”加以侮辱，谓之射天。


    不服？寡人让你看看天怎么流血！武乙命左右用皮革制作了一个囊袋，里面盛满血，悬吊于空中，他拉满弓，仰天射穿囊血，鲜血迸出，这就是“武乙射天”。


    结果，传说一天，武乙游猎，晌晴白日突然电闪雷鸣，武乙遭暴雷震击而死。估计这个这个结果的传说是巫师说出来的，用以吓唬后人，意思是即便你是商王，也不能和天作对。


    # 啥叫天心地利人和


    这是金文“天”的写法，甲骨文头顶上那一片虚空间在变成了一个实心的黑疙瘩。在甲骨文诞生的同时，一种比甲骨文还要正規的文字也诞生了，它们被铸造在青铜器里，用以记述彝（yi二声）器主人的功德，由于古代把青铜称之为金，所以我们今天把这种文字称之为金文。


    有意思的是，金文在青铜器中的位置不是不容易阅读的边缘上，而是在器皿的里面，中间，冲上。很显然，这些文字不是方便人阅读的，而是写给天看的。


    汉字从诞生的那一刻起，就是与天交流的工具。


