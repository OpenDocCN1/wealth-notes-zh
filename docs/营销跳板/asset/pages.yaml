    这两者的区别在于：便宜的番茄酱是在西红柿还没青的时候便摘下来，在运输过程中慢慢变熟的西红柿制作的。这样的番茄酱颜色会很浅。


    另外，它是由罐头加工场的尾料制作的。这样的调味汁营养一点都不丰富。


    而我们只使用在藤蔓上就完全长熟的西红柿来做番茄酱，在它们的汁水很饱满的情况下才采摘下来。


    这样一来，我们提供的，便是最顶级的口味，而那种味道，只有自然才能给出来


    我们花费在制作这种番茄酱上的时间，是那种买现成酱汁的五倍。但是，品尝之后您就会明白，我们投值得的。'
