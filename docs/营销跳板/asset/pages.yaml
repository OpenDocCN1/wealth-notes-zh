- pgno: 11
  md: '# 4、科学广告的应用


    1908 年，肯尼迪所做的事情难以为人超越。然而，拉斯克尔却找到了一个超越肯尼迪的人，那就是克劳德·霍普金斯。他证明了自己是一个真正的先驱者：他开创了优惠券、免费试用、零风险退款保证、测试，以及其他更多的模式。


    霍普金斯推崇肯尼迪的“纸上推销术”的哲学理念，但肯尼迪是一个只有一种想法的人，然而霍普金斯却有很多不同的想法，代表了一个更高的境界。霍普金斯认为仅仅投放广告并静观其变的方法是徒劳的。他觉得这纯粹是凭猜测所做的工作。他想去测试他所做的任何事情。


    霍普金斯一生虽然只出版了两本书，但这两本都成为了经典之作。他的第一本书是在 1923 年发表的《科学的广告》：这本书当中包含了很多他通过测试技术发现的秘诀。这些秘诀在今天依然行之有效。


    他的第二本书写于 1927 年，是他的自传《我的广告生涯》。很多人将此书看作是至今为止最杰出的广告书籍。所有的顶级市场营销人员都将霍普金斯的第一本书当作他们如何撰写广告文案的圣经被称为世界第一销神之神的杰·亚伯拉罕曾经这样说：“克劳德·霍普金斯是他们所有人中的大师。在他的影响下，我的个人收入很容易地就增加了
    600 万美元之多……并且还在继续增长……”


    霍普金斯为很多美国主要的公司做过广告活动，这些公司在今天依然保持强势的发展势头。像高露洁——棕榄公司，百普素登牙膏公司以及桂格燕麦片公司，固特异轮胎公司等。他为客户创造更多成功的秘密策略之一是“先发制人”的宣传活动。


    事实上，霍普金斯自己从来没有使用过“先发制人”这个词语，但是他确实是这么做的。这个词后来被罗瑟·瑞夫斯使用，现在杰·亚伯拉罕也一直在用。


    通过这种策略，他曾经讲述过怎样在…个行业里做事的故事，并且以此教育他的客户。任何竞争对手都可以讲述相同的'
