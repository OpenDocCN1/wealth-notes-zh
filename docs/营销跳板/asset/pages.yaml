- pgno: 199
  md: '# 如何在广告业赚取财富？


    从没有哪个时候像今天这样，广告众多，利润丰厚。


    如今，值得阅读的广告不计其数，人们已学会欣赏。


    优秀广告从没像今天这样，能如此轻松地取得成功。


    低劣广告从没像今天这样，注定会失败。如今才能成了急需品而经验也是必备之物。


    这绝不是外行人生存浑水摸鱼的时代。


    今天，成功只属于有资格之人。


    正因如此，我们投在文案部的资金高于其他任何部分。


    文案部经理，克劳德.霍普金斯先生，每周的薪资为 1000 美元。


    该薪资创下了广告业历史记录。


    但是，霍普金斯先生为广告商赚取的利润，其广告所涉及的产品种类，比其他任何人都多。


    作为广告业的一名销售人员，他至高无上的地位不可否认。


    从本公司发出的所有文案，都要经过霍普金斯先生的审查。


    霍普金斯先生的团队中，有一些美国最资深的广告人。


    这些人，是我们经过多年观察，跟踪他们所取得的出色成果，而精心挑选出的。'
  merge: -1
  img_proc: true
- pgno: 200
  md: '我们还希望拥有更多的像他们这样的人。


    我们需要那些已取得最好成果的人，不管这意味着我们要支付多高的薪酬。


    文案部不是一项经济负担——不管是对我们还是对我们的客户。


    这些人为老客户带来成功，促进其成长。


    他们用自己的才华，撰写出史无前例的优秀广告。


    对我们来说，用这种方式发展业务。比雇人去寻找新客户更划算。


    # 我们的咨询委员会


    我们的咨询委员会由 16 人组成，个个都是广告大师。


    每个人都有着丰富的经验和经证实的能力。


    霍普金斯先生是委员会领导。


    每个供客户实施的广告方案，都是经过整个委员会商讨而决定的。


    广告方法，文案，媒介，方案都是通过开会讨论而决定的。


    委员会的成员们，在广告业的起伏动荡中，每天都能有新的体会和感悟。


    这样，我们综合所学的所有知识，得到的所有教训，解决新问题。


    这就是成功的必然之道。


    然而，我们承接广告时，收取的是和其他广告公司一样的佣'
  merge: -1
  img_proc: true
- pgno: 201
  md: '金。


    在为有潜力的产品，设计试验广告时，我们常常花费十倍的佣金。


    只有在我们为客户赚取利润，使他们扩大广告投入时，我们才能赚取利润。


    这种出色服务的费用，绝不高干次等人物为您提供的劣质服务。


    想一想，如果该服务能使您的成功翻倍，这意味着什么。


    # 怎样使广告像债权一样安全


    首先，请让我们判断，您的产品是否有更大的潜力。把您的问题交给我们咨询委员会的 16 位成员。


    您可以随意询问他们的意见。


    他们所涉及的广告种类，所用的广告方法，比美国其他的任何团队都多。


    他们提出的意见很可能是对的。


    如果您期望的目标有可能达到，我们会告诉您风险很小的方法。


    如果是报纸广告，我们可以建议试用几家不同的媒介。


    也许，该实验会花费我们十倍的佣金。但是，当我们结束之时，您会明白。


    我们在 6 个城镇所做的广告，可以在 6000 个城镇内做，而且会有相应比例的利润。


    平均法则确定无疑，在您扩大广告时，您投入的资金将是绝对安全的。'
  merge: -1
  img_proc: true
- pgno: 202
  md: '我们希望所有拥有合适产品的人，都不要错过这一服务。


    请想想它的意义。


    您的风险再高，也是微不足道。


    您不会有任何损失。如果我们无法让产品产生利润，就绝不会投入时间和精力。


    如果您在那 6 个城镇中取得成功，那么在您面前的，是为您带来同样成果的整个国家。


    这就是广告业赚取财富的方法。


    不是通过盲目的努力。不是试图亲自学会我们用 35 年才掌握的知识。


    今天的广告业，需要才华出众，经验丰富的专业人才。


    聘请您所知道的最佳人才。不要相信平庸之辈。成功很重要。


    # **致成功人士**


    同时，我们也寻求那些已经成功的顾客。


    那些希望了解我们出色的工作人员能为其提供哪些更好点子的人。


    那些寻求新观点的人。那些希望确保最大程度挖掘自身潜力的人。


    我们对他们的提议是：


    如果您愿意，那就继续维持您目前的合作关系。但请给我们'
  merge: -1
  img_proc: true
- pgno: 203
  md: '几个城镇，或几家众媒介。


    让我们在某些小范围内，让您看到我们的能力。然后让结果决定谁应该成为您的广告代理。


    这是唯一的方法。其他人的说辞可能和我们一样精彩。广告业到处都是劝说新客户的能手。


    但是有一个“法庭”是永不会出错的，那就是“跟踪到的结果”。


    我们把我们的案子交给那个法庭，您呢？


    请剪下这张优惠券—在您还能想起它的时候。把它寄出以索取我们的《安全广告》—该书精彩的展示了我们的广告能力


    然后请您亲自决定，您是否需要我们。


