    互联网为广告和市场营销开辟了一个全新的世界。而且，新一代的企业家随之诞生了，譬如约翰·里斯、科里·柯九 Corey Rudl（2005·年 6 月 2 日去世，享年
    34 岁）、马龙·桑德斯、亚历克斯·曼德希安、亚尼克·西尔弗、吉姆·爱德华兹和许多其他人已经证明了在一个这么短的时间内我们能够做什么。


