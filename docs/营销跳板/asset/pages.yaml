  md: '# 2) “来自树的香皂”


    (字体太模糊所以这份没有翻译)


    来自树的香皂一表现这个主题的后期广告之一，以四色彩印刊登在1928年2月号的《家庭主妇》上。


    这个广告主要是应对他们的竞争对手“象牙香皂”而想出的。当棕榄香皂大获成功之后，象牙香皂发布了一条让当时棕榄香皂的销售经理查尔·皮尔斯(Charles Pearce)很气愤的广告。


    皮尔斯找到霍普金斯和拉斯克尔说：“象牙香皂正在发布一些卑鄙、下流、肮脏的东西，全是无中生有。他们说‘象牙香皂，纯白皂，从未着色。’而我们除了不生产这种白色香皂以外，大多数香皂品种我们都有。显而易见，他们是在暗示我们的香皂染过色。他们还接着说：‘象牙香皂没有动物油脂，’暗示别的香皂，包括我们的，使用了动物油脂。我希望你们搞出一些文案说我们在棕榄香皂中没有使用动物油脂，也没有添加人工色素。”


    当时拉斯克尔说：“皮尔斯先生，你是同我一样聪明的广告主，你知道说‘没有动物油脂，没有色素：是否定句，否定广告没有任何价值。人们想知道你们的产品是什么，而不是你们的产品不是什么。因为你即使是告诉人们你的产品不是什么，人们是不知道它是什么？他们只为要买的东西付钱。”


    皮尔斯说：“这我当然知道，那该由你们考虑，我希望你们在这上面多动些脑筋，我们自己也许也能解决这个问题，但现在我们还没有找着眉目。现在，我已经跟你说过三四遍了，我希望你们能搞出些东西来。”


    后来，霍普金斯和拉斯克尔想出了应对办法，要从棕榈树和橄榄树上着手，因为棕榄香皂获得用作香皂的油脂和色素的油脂是从这两种树上提取的，别人从没有这样说过。于是有了“来自树的香皂”(Soap
    From Trees)这个创意，给他们公司增加了一种新的新闻价值，增加了～一如果与香皂联系起来的话——种精致和令人愉快的天然味道。结果大卖。'
