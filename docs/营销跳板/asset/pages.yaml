    只有在广告中它们才能与那些标准分离，为了吸引他人的注意力而运用那些古怪奇异的东西。


    不妨让一个推销员穿上小丑的衣服，让他用扩音器说话，或者踩着高跷走路。对那些对你的主题缺乏兴趣的娱乐探寻者来说，这样的注意力又有什么用呢？'
