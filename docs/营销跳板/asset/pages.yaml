    # 无需更多厨师


    这些范·坎普的厨房长时间以来都是因其高薪聘请的烹饪大师而得名。•我们有英国、巴黎和意大利的厨师，并且他们每个人都因一些顶级的发明菜式而很有名望。


    如今，那些厨师都被辞退了，厨房也不再使用伽》的食谱来制作美食。取而代之的，是一群科学的厨师。现在，一组经过著名大学训练过的专家，制作厨师从来不会做的美食。


    如今，科学分析代替了凭空猜想。在一个模拟的实验室里，对每一个厨房中的烹饪方法进行试验。我们如今的食谱都是有固定配方的————而使用这种方式的话，有时是经过上千次的试验而得出来的。


    通常情况下，要在一个配方上花费两三年的时间。将原料按照无数个不同的比例混合在一起。但是，对于最重要的口味，配方却是永远不变的。只要遵守信中给出的所有详细的指导说明就可以了。因此，所有范·坎普的产品都是我们做过的最好的食品。


    我们的材料都是经过分析之后挑拣的，从而符合极致的要求。我们使用的蔬菜都是在研究过的土壤上培养生长的—从选择最好的植物的种子开始。


    每样东西都有一个固定的标准，任何厨师都不能更改。例如：我们所有的奶油都是在牧草长得最好的地方制作的。


    但是，这种科学烹饪的主要目标是易于消化。每种食物元素都是严格按照实验室测试过的标准烹饪的。那是非常重要的。然而•，那些主厨的方法是彻底失败的，尤其是用于制作猪肉黄豆罐头的时候。'
