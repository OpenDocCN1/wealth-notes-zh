- pgno: 241
  md: '对你的竞争对手进行调查研究的，你要使自己的销售信与竞争对手的不一样——要有自己的特色。


    +   要研究你的竞争对手在杂志、期刊，或者互联网上刊登的广告。


    联系你的竞争对手，索要宣传册或者其它文字材料。


    购买你竞争对手的产品。


    收集有关你竞争对手的新文章。


    在贸易展览上拜访你的竞争对手。


    # 对整个市场进行调研


    对于那些能够影响人们对你的产品认知的行业、出版物以及其它外界要素，你也要多关注他们的信息。


    提供有关市场或者行业的具体事实和数据，要比产品的一系列优势更加有力量。我见过一家小型地毯清洁公司。在他们将行业调查结果写到销售信中之后的，他们的销售额得到了极大的提升。他们找到、的事实和数据，是有关地毯中的微生物。他们找到了这些微观小虫子的放大图片，并把它们展示给他们的潜在客户。


    他们还找到了由不清洁地毯或者清洁地毯不充分而造成的健康问题的调查结果。所有这些信息、都与他们提供的具体服务没有任何关系。但是，这些数据使他们的潜在客户觉得，脏的地毯真的很恶心，他们会想到，自己走路的时候，那些肮脏的小虫子就在他们的脚下，还有，当他们与自己的宝宝躺在
    地毯上的时候，小虫子会与他们的皮肤亲密接触。这样一来，这些潜在客户就会迫不及待地雇用他们来清洁地毯！


    你可以在当地的图书馆中，上网或者查阅期刊文献，找到可以为**你提供**类似的“弹药”的文章。


    对于任何营销活动而言，调查研究都是关键的第一步。


    要明白，人们购买产品或服务的唯一原因，是他们觉得拥有'
