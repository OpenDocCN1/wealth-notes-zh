    而是他所在的整个行业会共同承受这个骂名。


    # 12. 自尊


    在寻求贸易或保持贸易往来中不要使用寻求或是保持友谊的艺术。这些交友的艺术在商业中没有立足之地。因为你不是在出售个性，而且值的拥有的客户不是在购买良好的交际关系。当你侵犯自尊时，你便侮辱了他们。你只有展示出对自己的尊重，才会获得别人对你的尊重。


    在广告行业当中，任何受尊敬的专家都是拥有罕见造诣的人。


