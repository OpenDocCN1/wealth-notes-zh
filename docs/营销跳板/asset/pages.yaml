  md: '人们不喜欢问题。所以只告诉他们现成的解决方案。太明显的出售欲望会使人们对你保持警惕。好奇心比真相更能煽动人们。讲到一半的故事令人感兴趣，然而，和全盘托出的故事让人感到索然无味。


    人们都渴望自己拥有优势。对于他们来说，得到别人得不到的东西是他们最想得到的东西。吹嘘炫耀不会使人们感到印象深刻。


    当你引用别人的话来证实你的话时，你便在揭发自己所说话语的真实性。明显的偏见会使影响力终止。赞美一篇文章时夹杂一点批评会起到事半功倍的效果。


    一个人的诚实从不会通过明显的自我否定来使人印象深刻。巧妙的广告必须考虑到一千个这样的基本原理。这也是好广告实属罕见的一个原因。


    # 22. 特立独行


    每个特立独行的迹象，从口头上、方式上或者外貌上削减一个人的影响力。这被看做是不正常的。而且，只有正常的事情才能吸引那些正常的人。兴趣和娱乐也常常由此产生。但是，它从来不会


    有说服力，也不会产生敬意。


