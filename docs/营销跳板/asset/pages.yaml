    # 5. 工作的乐趣


    当人们在做他们最喜欢的事情时会做得最出色。将自己的工作看做是一种苦难的人，不管为了自己还是他人，都不会取得很大的成功。


    在招聘人员时，要了解他们的心态。如果你可以的话，就要争取那些一着 T-1 作就像球员拿起球拍一样充满激情的人；争取那些思考着如何取得更多胜利而不是整天想着报酬的人。


    几乎所有的大事都是由不需要钱的人正在做着。他们为了工作的乐趣而做。而且，工作的乐趣是非常棒的。


    许多人拒绝将商业称作是一场游戏。但我们喜欢 rr 商业如游戏”这一描述。当我们的办公室不再像一个运动场，我们将'
