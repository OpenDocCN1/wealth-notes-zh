  md: '# 唯一治疗方案，加强内部神经


    所有重要器官产生的慢性疾病，99％都是由一些内部神经衰弱造成的。对于这样的疾病问题，如果不加强神经力的话，那么就只能缓解，无法治愈。


    几年前，没有人知道这一点。即使是最好的医生，那个时候也只会做这两件事：要么就是给病人开血压药，要么就是治疗有毛病的器官本身。然而，现在的医生们都不这样做了。


    现在，所有好的医生都知道要通过神经治愈疾病，因为每个重要器官的功能都是完全由神经控制的。对整个医学界的研究重点已经变为如何正确地治疗神经。


