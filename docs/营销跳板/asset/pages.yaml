  md: '因此，家庭烘烤的豆子是一道一周只能做一次的食品。它们太难准备—不易消化—以至于你想要享用它们的时候却做不出。


    大部分的人都像喜欢吃肉一样喜欢豆子。有些人喜欢在每次吃肉的时候都吃一些豆子。然而，您自己烹制豆子，不仅费用是我们烘烤豆子的三倍，而且其中的营养物质也没有我们的多。


    (图) 这是范·坎普牌罐头中的一颗豆子。罐头中的每一颗豆子都像它一样，呈酥状，但是毫无破损。甘美的番茄昔被完全烘烤进去，猪肉的风味也被烘烤到里面。这些豆子是经过高达
    245 度的烤箱数小时烘烤的。但是，烤箱是在高压之下的流通蒸汽(过热蒸汽)中加热的。


    它并不是那种干热，所以豆子不会变脆。它也不是那种即将沸腾的热量，因此豆子也不会坏掉。


    这些豆子是很容易消化的—非常容易消化。它们的味坚果—道非常好—像样，呈酥状，并且很完整。并且，与它们一起烘烤的番茄酱会为之增添一种可口的风味。


    一旦您的家人品尝过这些豆就再也无法接受用过去那种方式烘烤的豆子了。


    这些豆子都会以成品的形式提供给您，您可以直接冷着吃，也可以加热十分钟之后再吃，无论是以哪种方式吃，它们的口味都会像刚从烤箱中拿出来一样。


    您可以储存一些这样的罐头—相当于肉食—以备不时之需。您可以用它们来制作沙拉，也可以用它们来炸肉丸子，或者打开罐头直接食用。


    因为我们是为数百万个家庭烘烤这些豆子的，因此我们的价格要比您自己制作便宜得多。并且，我们已经花费了整整 50 年的时间，来学研究如何将它们做到最好。


    当您亲自品尝过之后，您就会几乎把范·坎普牌的罐头当作—啤'
