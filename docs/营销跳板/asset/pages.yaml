    某杂志拥有两百万个家庭的读者。一个页面广告要花费 5,000 美元。要想使广告覆盖到美国的所有家庭一次就需要花费 50,000 美元。一个广告文案作者要告诉刊登广告的人要为每个字支付
    10 美元。要以这样的思想来检查广告页面，并以此来判断什么样的广告才值得为每个字支付 10 美元。


    但问题正好是这样：绝大多数广告商并不知道他们的广告是做什么的。成功的因素有很多，在混合出版物上刊登的广告取得了过度的信任。结果是废话太多，这现象不可能经得住真正的考验。


    所有伟大的广告文案作者都是在学校里直接得到训练。要当心那些没有经过这样训练的人。这需要真正的推销术以满足跟踪测试。而且，一个不得不长时间面对这些测试的人决不会发表废话连篇的广告。


    那些撰写愚蠢的广告、使用奢侈的图片、发表无效的陈词滥调的人从来不会直接地面对一广告问题。如果他们曾经这样做过，


    那么他们将要走 向灭亡。每一个有价值的广告都是一个销售大师付出最大的努力以出售商品。在这一代价昂贵的领域，不努力是愚蠢的。这里没有中间地带。'
