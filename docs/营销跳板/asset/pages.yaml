- pgno: 99
  md: '# 我们的方式


    我们会将自己的烤箱加热到 245 度的高温。


    每个烤箱中会附加一个温度计，从而保证其热度恒定不变。我们会将豆子烘烤 90 分钟。


    那种极好的热度会将每个食物原子都分隔开，从而使得助消化的汁液能够进入到它们里面。如果热度不够的话，是做不到这一点的。


    一定要是工业烹制的豆子，才容易消化。


    我们在流通蒸汽和金属罐中烘烤豆子。


    烘烤出来的豆子，粒粒饱满，并且所有的豆子都一样没有烤成褐色或者烤裂的豆子。


    我们拿将豆子烘烤至酥肽。但由于它们是完整的，所以会像坚果一样。


    我们将豆子、番茄酱和猪肉全部放在一起烘烤，最终混合出来的味道是很可口的。


    我们会随时为您送货上门。


    请您先把罐头、头瓶放在热水中泡 10 分钟—然后打开即可。接下来，您便可以享用到热腾腾的、新鲜的美味了。


    对于这样的一种美味，您的家人在品尝之后，一定会每天都想吃范·坎普牌罐头的。所以请您在家里多储存一些，以备随时享用


    图（上右）'
