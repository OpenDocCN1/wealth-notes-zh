- pgno: 290
  md: '绝对武力是浪费的、粗鲁的、冒犯的。通过纯粹武力得到的东西总是能被一个更加强大的力量带走。


    相反，技术娴熟的推销员则会使用策略取胜。花费更少的力气，并且也许在更少的支持下，他得到了金钱无法得到的东西。这就是广告成功的秘诀。它不是语言，不是图画，不是空间的大小，也不是你看到的任何东西。它是力排众议、融化冷漠、赢得同情、点燃兴趣的微妙的方法。


    大问题最易于依靠金钱。他们每年在大胆的、错误的尝试中浪费数百万美元。而且，为了争取大众的支持，在大问题上犯了最多的错误。在小问题上因为缺乏资金而被迫采取策略。所以绝大多数广告的成功源自这些条件。


    许多广告没有冒任何风险就获得了成功。也有许多人几乎没有拿任何东西可以拿来冒险。这个事实蕴含着丰富的意义。在这一领域，是策略而不是金钱赢得成功。而且，最有可能运用策略的人是那些必须使用策略的人。


    # 35. 错误


    不要想方设法去避免犯错误。否则你将永远不会做出任何新的东西。但是要将被错误减到最少，并且不可莽撞行事。要 在 新的层面上摸索你的道路。


    在商界很少需要“重大决策”。而且，广告行业中从来就不需要“重大决策”。聪明的人在摸索中发现了光亮，而不是突然一下就发现的。


    在欲望和希望、好与恶上，从来没有权威。个人的偏好不可能被猜中，但可以被轻而易举地查明。那些伟大的广告文师从来都不是绝不犯错误的人。他们只是做事很有效率。不管
    对与错，你得到了一个最终的答案，只不过他们是牺牲别人而得到的答案。


    你永远不会听到他们的错误，因为这些错误太小而又太短暂。'
