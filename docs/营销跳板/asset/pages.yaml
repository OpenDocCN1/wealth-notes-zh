- pgno: 240
  md: '+   - 创造品牌意识

    - 刺激需求

    - 教育你的目标市场

    - 让人们给你打电话

    - 让人们获取更多信息

    - 安排预约


    当然，并非所有的内容都是对你的销售信有价值的目标。无论是一封销售信，还是任何类型的广告，都应该请求读者采取某种特定的行动。因此，“建立认知度”的信息，对你的销售信就不是一个好的目标。不仅仅是因为它太模糊了，而且它根本就没有要求顾客采取任何行动。当读者阅读完销售信之后，他应该做些什么事情呢？


    每当你开始撰写销售信的时候，你要记着一个最重要的问题：


    > 你在信中所说的每一句话，使用的每一个词或短语，必须推动读者采取你希望的行动。当你的销售信写完之后，你要看看其中的每个要素，它们 是使顾客离‘你最想要的回应’更接近了，还是更远
    了。


    在读者读完这封销售信之后，你想要让他做些什么呢？


    下面是收集产品信息的一些更好的方法：


    > 如果你的产品在展会上展出，那么，你要听一听来你的摊位上参观的人之间的谈话。听一听他们提出的问题。这些问题，便是你在销售信中应该回答的问题。


    你还可以听一下你的顶级销售人员与潜在客户之间的通话。这样，你对潜在客户的兴趣、关注点、反对意见以及敏感的问题，就会增加真实的感受了。


    要亲自去调查你的顾客，他们对于你的产品到底感觉如何。问一位顾客，你是否能够亲自看他是如何使用你的产品。你自己也要使用产品，并且记录下你自己的感受。


    把你的产品提供给一位典型的潜在客户，看看其使用产品时的反应。'
