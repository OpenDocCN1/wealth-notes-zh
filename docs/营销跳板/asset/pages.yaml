  md: '品，而是一种好处。不仅是他们可以从你的产品中得到的好处，而且也是吸引他们阅读广告其余部分的好处。这便是在神奇的子弹中，先列出好处，后撰写标题的原因，并且，先将文案的结构安排好，才能为你的每一个最好的好处想出小标题来。


    # ### 标题类型


    通常有 8 种类型的标题。


    当你阅读报纸和杂志的时候，请留心不同的类型。注意它们是否出现在你的“垃圾”邮件中。看看你在自己的广告和销售信中是否也能遵循它们的模式。要尝试大量不同的类型。


    根据 8 种标题类型进行分组，尽可能多写一些不同的标题。


    保证能写出好标题的一种方法是：尽你所能多撰写一些不同类型的标题。而做到这一点的最佳方式是：首先从利益清单开始。


    撰写以某种好处为基础的标题是很容易的。你不妨试一下。利用某种好处——任何好处都可以——将其转变为一个标题。然后……只要将那些标题进行一些变化就可以了。可以尝试撰写一些包括多种好处的标题。如果你独创的利益清单中包含
    10 种好处，那么这些理念便可以帮助你很轻易地创造出至少 30 种可能的标题。


    接下来，开始尝试撰写不同类型的标题。从每种类型撰写一个标题开始。如果可以的话，要把所有类型都尝试一遍。例如，像“推荐证明”标题，你需要额外的细节信息（例如，来自满意顾客的真实评价）。但是，对于大部分其它标题而言，像是“问题”、“如何做”、或者“原因”标题，你都能够很轻易地想出很多个来。让你的思维纵横驰骋，看看你能想出什么。结果会让你自己都惊讶的。


    比如泰迪·尼古拉斯建建议，为了一则广告、销售信或者是促销文案，你应该至少撰写出 100 个标题。这个数字听起来或许很吓人。但只是一个建议而已——并非一个严格的标则，你并'
