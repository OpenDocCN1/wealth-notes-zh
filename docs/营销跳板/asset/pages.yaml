  md: '但是，现在，你就要享受自己劳动的果实了。在你撰写销售信的时候，你会一遍又一遍地参考这份清单。它会指引着你，这是你的一个依据。如果你脑海记一直记着自己所做过的调查研究，知道你的潜在客户想要什么；如果你的注意力一直都放在你想要潜在客户做什么事情上；如果你使用了最佳标题；如果你将一大堆最好的子弹要点都用在销售信中—那么，销售信的其余内容几乎也就不言自明了。


