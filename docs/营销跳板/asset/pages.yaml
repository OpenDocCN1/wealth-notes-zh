  md: '在广告行业中要抑制任何的投机行为。把犯错误的机会减到最小。


    在新的事业中一步一个脚印慢慢地前进。除非你的产品被认为配得上成功，否则不要试图出售任何商品。除非你仔细衡量了所有可能的需求，否则不要投资任何行业。除非你的计划在一个小的领，警里第一次尝试就获得了成功，否则就不要进入一个大的领域。


    永远把证明广告是安全的作为目标，以此来避免灾难。在正确的方法下没有任何借口。一个由于轻率而导致明显的失败，可能会永远败坏你的名声。而且，确实应该如此。但是，这更多的是给这一行业带来了赌博的性质。


