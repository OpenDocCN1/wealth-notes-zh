  md: '# 一个美妙的商业故事


    我们曾经在一本书中讲过——我们还请您写信向我们索要的那本——史上最精彩的商业故事之一。这个故事讲述的：翰·威利斯先生是如何在两年内步升入汽车世界的最高位置，大切诺基汽车如何在
    24 个月的时间内，销售 2400 万美元的；一家工厂是如何像魔法一般发展成为拥有 4000 名员工的大企业的——每日最少生产 30 辆汽车汽车的大部分需求是如何集中到这款卓越的汽车上的发现。


    # 发现


    下面是这个故事的概要一足够使您在看完之后想要阅读全文了。


    两年前，约翰·威利斯先生是汽车行业的一名经销商，有一天，他发现了一款非常卓越的汽车——很显然。是一位机械天才的杰作。对于所有周围看到这款汽车的人而言，它都是最简单、最结实、最平稳的跑车。


    这款汽车的名字，就是大切诺基。而它的价格——1250 美元——与汽车本身一样令人惊讶。


    这款汽车的销量传播得非常之快。每卖出一辆汽车就能带来其他 20 个人打电话订购。新老汽车主，都纷纷来交预付款——他们都被大切诺基无与伦比的简单朴所吸引住。但是，这款汽车并没有上市。当威利斯去找制造商的时候，他发现，他们正处在破产的边缘。


    发明这款非凡汽车的天才，面对 1907 年的金融危机，根本就没有经济能力进行生产。


    # 新的开始


    威利斯先生支付了未兑的工资——接管了这个工厂——并设'
