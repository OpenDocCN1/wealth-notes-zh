  md: '# 肾病


    肾脏是血液的过滤器，用来清除血液里的垃圾，而它们大部分的疾病都是由于过度清除过量垃圾而造成的。引起原因有可能是持续发烧，也有可能是感冒，或者一些血液中毒的疾病、酒精中毒等；但最常见的原因就是消化不良。


    由于这种种原因，血液会超载很多杂质，肾脏会阻塞起来。首先带来的影响就是：部分毒物会滞留在血液中，从而导致其它疾病的产生—特别是风湿病。总是处于过度劳累状态的肾脏会逐渐变得虚弱，在某一时刻肾组织便会出现问题，直到一个细胞一个细胞的衰竭在尿液里。然后血液里富含
    的元素—蛋白一便会随之排出。这种情况一旦不引起重视，


