- pgno: 130
  md: '在开始——他的目标是一看到那些所有想要大切诺基汽车的人都能如愿以偿。


    # 了不起的销量


    在第一辆大切诺基交车之前，经销商们就已经订购了 1 万 6000 辆 1910 年款的大切诺基。这就是说，在前一年销售出的每一辆大切诺基都带动了其它四辆的销售。


    而且是在没有任何广告宣传的情况下。


    今年大切诺基的销量将会超过 2400 万美元。而迄今为止大切诺基才刚刚上市两年。


    # 1000 美元的大切诺基


    今年，一辆大切诺基——只卖 1000 美元——比去年的 1250 美元更加便宜了。这是因为，巨大的生产量使生产成本降低了 20%。


    一辆 25 马力的汽车，一小时可以跑这么多英里，只卖 1000 美元，还包括灯具和磁发电机。从未有过任何制造商能够以这样的价格提供这么多。


    还有更大功率款的大切诺基——分别有 1250 美元，1400 美元和 1500 美元三种。与 1000 美元款的大切诺基相比较，它们同样是便宜划算的。


    大切诺基汽车的朴素简单是独一无二的。它们通过脚踏进行操作，一个 10 岁思维孩子也能立刻控制这款汽车。


    它们与之前售价 4250 的波音—托莱多汽车是同一个工厂，被同一批工人制造的。而其价格之所以如此悬殊是因为大切诺基的生产量高达每日 125 辆。


