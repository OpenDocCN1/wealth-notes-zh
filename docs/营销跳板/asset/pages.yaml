  md: '# 3: 舒普医生的“康复药”


    当舒普医生的公司最初找到克劳德-普金斯的时候，他们的生意已经快倒闭。


    霍普金斯发现，主要问题在于他们没有任何药店进行分销，霍普金斯开发制定了一个计划，来吸引当地的药店老板订购产品。


    霍普金斯开发的，就是如今我们在整个互联网上都会看到的“联盟营销计划”


    霍普金斯提供零风险承诺，全额退款的保证，预防舒普医生的康复药无法实现购买者的希望和期待。最重要的是，霍普金斯联系当地的药店老板，请他们签订这种保证计划——当然，输欧医生的公司提供全额的资金支持，这种保证（霍普金斯称之为“担保证明”）出现在霍普金斯专门为药店老板撰写的宣传的背面，从而来吸引他们进行分销。


    由在社区里面工作，每个人都认识的本地药店老板签订的保证，要比由在外地公司签订的保证可信得多，有了本地老板们的支持和帮助，舒普医生的公获得了全国范围内的大力推广——一支由药店老板组成的，绝对诚实的产品销售队伍，而药店老板们他们也从中获得了一种可以进行销售的受欢迎的新产品。


    提供保证的条件同样也很巧妙，为了使保证产品有效果，购买者必须在30天内吃完舒普医生的六瓶康复药。


    30天之后，霍普金斯发现只有2%的购买者要求退款。


    然后，霍普金斯收集药店老板们提供的客户评价，从而让更多的药店参与到这个销售计划中来。为了进一步地吸引他们，霍普金斯还向所有参与的药店老板们承诺，他们拥有本地区的独家销售权：所有想要免费咨询瓶装康复药的人都必须去找那个区域内的药店老板。这样一来，相当于为本地的药品商店做了免费的广告实现了“双赢”。'
