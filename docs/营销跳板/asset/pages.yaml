- pgno: 177
  md: '# 请做这个测试


    看看使用后的牙齿会多么闪亮


    这 10 天的测试不会收取您一分钱。对于数百万人丽言，它已经带来了清洁牙齿的一个新时代。这是为了促使您尝试返种方式。然后让您自己的牙齿为您展示：它对于您和您的牙齿意味着什么。


    # 对抗薄膜


    该物是用来对抗那种会导致大部分牙齿问题的薄膜的。薄膜就是你能感觉到的那种粘性表面。它依附在牙齿上，进入到牙齿裂缝中并留在那里。过去的刷牙方法并无法清理它。因此，不管多么小心，牙齿问题还是会不断地增加。


    实际上，使牙齿变色的是薄膜衣。而以过去的方式刷完的几乎所有牙齿都或多或少地会覆盖上这种薄膜衣。


    薄膜是很难对付的。它会沾上发酵和形成酸性物质的食物。而牙齿不断地保留酸性物质之后，就会导致腐烂。


    成千上万的细菌会在里面繁殖。它们很难对付，是脓漏的主要原因。而那种疫病就面积而言已经令人担忧了。


