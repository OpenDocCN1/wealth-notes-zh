  md: '很多不同的面。所有企业都会面临起起伏伏。因此，一个人无论想实现什么样的愿望，他总能通过特定的事实来证明自己。


    在做广告时，要牢牢记住这些真理。在这里你吸引了数以百万计的人们，犯错误会付出很大的代价。所以千万不要被少部分人的观点左右，也不要坐井观天，在采取重要的行动之前，要反复考虑各种各样的有关前景的观点，在做出决定之前要参考不同的意见。


    变幻莫测的人性与其最精明的猜想不符。在广告业中，几乎所有的错误都是以自我为中心的个人主义导致的。而刚愎自用和心胸狭隘的人也总是犯错误。


    # 19. 交际手段


    商业的车轮像所有人类的齿轮一样需要加润滑油。观念不同，利益冲突，自尊心经常遭到打击。而且，摩擦和冲突阻碍进步。而预防措施就是正确的交际手段。


    不要随心所欲，独断独行。最能服务你的人也是才华出众。


    最有能力的人们最厌恶的就是独裁。不要太固执己见。要知道很多时候其他人的观点被证明比你自己的要好。


    在广告业中，外行人和专家经常各持己见、观点相左。但是，由于思维类型的不同，这种不统一通常只在无关紧要的方面上，并非本质问题。当一个专家辩驳一个无关紧要的观点时，他就犯错了。


    生活就是在各种妥协中继续前进的。没有人时时刻刻都是正确的。而且，辩驳的结果无论是赢是输，都会留下伤痕。碰到这种情况，你只需说一声“谢谢 f”来一笑置之，从而为彼此创造互惠互利的欲望。


    然而，也许有时某个争论会涉及到你的原则问题，会有一个你不能让步的节点。作为自己威望的维护者，所以没有人会故意分享自己的错误。如果你对你的信誉做出让步，如果你一'
