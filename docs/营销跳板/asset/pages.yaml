  md: '# 第二篇 广告文案


    1、必胜吸尘器(Bissell) ……30


    这则广告利用人们圣诞节采购礼物的心里，使用吸引人的标题，引起人们的注意，把必胜的“cyc。”牌地毯吸尘器与圣诞礼物巧妙的结合在一起。让消费者认为，我要买圣诞礼物，那么必胜的吸尘器是最佳的选择。这则广告采用了文案公式：“吸引注意—引起兴趣—给与证明—刺激欲望—促使行动“短短的300多字，就清晰有的表达出了销售的流程。是我们值得效仿的一则非常好的广告。


    2、喜立滋啤酒(Schlitz Beer) ……


    你将看到霍普金斯如何通过系列广告把喜立滋啤酒公司从排S第五，仅仅数月就跃居到第一位的。如今，你也可以按照这个流程和他撰写广告文案的方式来打造自己的品牌。


    首先，第一条广告至今依然在哈佛商学院的营销课程中作为案例研究。以下是系列广告：


    +   1)“50年的完美演绎”


    这则广告霍普金斯没有使用任何空洞的“大肆宣传”之语。他度。这则广告突出了喜立滋啤酒与其他啤酒的不同之处，造喜立滋啤酒的品牌，证明喜立滋啤酒才是最好的啤酒。


    +   2)“家庭饮用啤酒”


    这则广告用“家庭饮用啤酒‘’这个标题，很好的与其他啤就区别开，只有喜立滋啤酒是针对家庭饮用的，这是一种清晰的定位而其他啤酒客户群宽泛，没有焦点。从而显示了喜立滋是安全健康的啤酒。因为家庭的幸福，健康，和快乐对我们每个人都是最重要的。


    +   3)“喜立滋，健康饮品”


    这则广告继续用事实来证明喜立滋啤酒的品质和口味是最好在“家庭饮用啤酒”后，继续强调喜立滋是健康的啤酒。同用数据和对比的手法，加强人们对喜立滋啤酒的印象。这是建立产品品牌一种有效的手段。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '4)“纯度最高”


    这则广告用“纯度最高”作为标题，宣传了喜立滋啤酒的一个独特的卖点。我们知道每个产品都会有多种功能和效果。比如，斯莱斯，保时捷，奔驰，宝马等汽车，虽然用材、技术、做工能大同小异，但每种车都有不同的定位，都有自己的独特卖点，不是什么功能和好处都宣称。什么都是，代表着什么都不是。


    5)“咨询你的医生”


    这则广告继续强调喜立滋啤酒是健康的啤酒。但是它没有再用数据和事实来说为什么健康，而是借用第三者证明一让顾客咨询有权威的人士一医生一看看他们怎么说。这则广告很简短，但有力的再次解除顾客的怀疑。加强喜立滋啤酒确实像前面所做过的广告一样，是真实的。把喜立滋啤啤继续推向高潮……


    6)“天竺少女日历”


