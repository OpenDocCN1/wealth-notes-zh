  md: '不需要完全遵守。你只要开始撰写就可以了。


    请让思想自由地流动。尝试一下这里介绍的方法，你将会想出一种成功的组合。关于这一点，你可以很确信。还有，在你大脑高速运转、写得非常顺手的时候，不要进行编辑。如果你的脑海里出现了某种想法，就把它记下来。无需担心语言、拼写或者语法是否准确。无论如何，先把它记录下来再说。


    一则愚蠢的标题，或许就是一则完美标题的催化剂，可以引发一种不同的想法。如果你担心自己被批评的话，那么你的创造力就会减弱。所以，让你的思维尽情地驰骋，享受过程。之后，再进行编辑。


    一则2到5秒钟的商业广告

    把你的标题看作是一则2到5秒钟的商业广告。对于你的文案的其余部分而言，你的标题便是一则“广告”，它的作用是：吸引你的潜在客户，使他们不由自主地地说，“请告诉我更多内容。”但是你一定要谨记这一点：你只有短短几秒钟的时间把好的东西传达出来，快速地吸引潜在客户继续阅读，从而有希望对你的提议采取具体行动。


    就好像你的潜在客户在高速公路上驾着车，在地平面上看到你远处广告牌上的消息一样。当他慢慢接近和注意到广告牌的时候，你只有几秒钟的机会来传达你的标题信息。


    如果你的标题需要人花费太多时间，那么人们就会彻底放弃阅读。如果你的信息要求人们思考或者分析的话，那你就没有任何吸引到他的希望了。表达一种意义复杂的信息，只会令人们感到困惑。使你的标题物尽其用的唯一方法就是：用最简短的语言、最可能吸引人的方式，表达出你最好的承诺，或者最强大的好处。


    现在要说的是……对于不同的宣传媒介，其对时间的应用是不一样的！对于只占六分之一页面、被其它广告包围了的广告，要想争取到读者的注意力，就必须得马上传达出自己的信息！而对于一则销售信而言，便有更多的时间和页面来呈现一个有力的开头。当然，它同样需要很有效果，只不过是有更多的'
