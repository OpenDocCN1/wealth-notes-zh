    现在，这些同样的轮胎——这些超大型的、无损轮辋的轮胎——已经不需要任何额外的花费了。我们倍增的产量已经削减了生产成本。您只需要指定购买固特异牌的这种无损轮辋轮胎，便可以得到所有这些优势。


    # 轮胎加大了 10%


    ![](img/4ab20ca05f51cd03e7810d6188c67a1f_157_0.png)


    固特异轮胎平均要大 10%——比额定宽度增加了 10%。


    那就意味着多 10%的轮胎—其中多了 10%的空气—也就增加了 10%的承载能力。也就是说，对普通的汽车而言，每个轮胎可以多跑 25%的英里数。


    虽然固特异牌轮胎大了 10%，但是价格却不比任何其它的轮胎高。也就是说，多出来的部分是免费的。


    # 我们为何提供这种轮胎


    正如我们之前所讲的，固特异牌的这种无损轮辋的轮胎，是不需要钩住轮辋的。它的每个底部都由 63 根钢琴钢丝(一种高强度的含碳钢丝)编织而成，因此没有任何东西可以将它们拉下来。


    因为这种我们可以控制的特征：__我们不需要担心轮胎脱落。因此，我们可以在避免任何危险的情况下，加大轮胎的尺寸。'
