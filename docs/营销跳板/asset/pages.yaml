- pgno: 164
  md: '霍普金斯 1909 年被广告公司 “托马斯” 聘用后。这给他带来了为一些大公司做广告活动的机会。其中一个是 B. J. 约翰逊香皂公司 (即今日的高露洁公司)。约翰逊先生让霍普金斯和托马斯广告团队为一款名叫
    “佳凡力克” (Galvanic) 的洗衣香皂创作一个广告活动。然而，在一番认真地研究之后，霍普金斯的结论是：为新客户打气实在是一件很困难、很费力的事，这款产品会非常难卖。


    他说服约翰逊先生把这款产品改造成 “人性化” 的香皂。于是该公司便生产了～款由棕榈油和橄榄油制造的香皂，这样一来，“棕榄” 香皂便诞生了。直到今天，你依然可以发现，这款香皂被陈列在超市的货架上。


    霍普金斯相信，广告活动的置传重点，不是这款香皂可以有效地清洁肌肤，而是使用 “棕榄” 香皂将会使人得到更柔软细腻、洁白无瑕的肌肤，以及增添的 “美丽”。然而，霍普金斯的领导对于他的这个想法却不是很自信。霍普金斯并没有与其进行争论，而是建议在一个小城市里——密歇根的本顿港进行一项科学的、可以统计的、有效的测试。


    在执行这项活动的时候，他们在这个城市里刊登了几个广告来讲述 “棕榄 “ 牌香皂的故事，并详细描述了美的吸引力。此外，他们还在广告中使用了其它推销方式，例如：承诺为每位申请的人提供一块棕榄香皂。这些广告使女性读者们产生了浓厚的兴趣。


    在最初的小范围测试取得成功之后，霍普金斯和他的同事们又创作了整版广告，还附带了一张 10 美分的优惠券。这样做可以使他们能够更加精确地追踪每则广告的效果，因为每张优惠券上都拥有不同的追踪代码。


    广告活动获得了巨大的成功。本顿港地区成千上万的女性都开始使用棕榄香皂。然后，他们在其它城市又进行了同样的测试来确认结果。


    测试结果是一样的。霍普金斯得出的经验就是，从全国范围来说，人性是很相似的。因此，我们的诉求能在本顿港获得成功，也就能在东西海岸的其它地方获得同样的成功。于是他'
  merge: -1
  img_proc: true
- pgno: 165
  md: '们便在全国范围内展开了广告宣传活动。


    在《星期六晚邮报》和《家庭主妇》上刊登了整版的广告。在每则广告中都插入了 10 美分棕榄香皂的优惠券，这使得它在所有的药店中都很受欢迎。


    并且，他们对在每个地区售出的产品数量情况进行了统计，并将这些数据报告给全国的药店老板(注意：美国的药店老板会兼营化妆品、文具、牙膏、漱口剂、香烟等杂货)。在广告团队寄给药店的老板的销售信中，他们指出：优惠券不仅仅适用于消费者，对药店老板也同样适用。这个活动再次取得了巨大的成功，带来了成千上万的订单。


