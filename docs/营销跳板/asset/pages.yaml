  md: '故事，但是他们没有这么做。而且，无论谁首先做到了这一点，都会获得优势。


    霍普金斯在他的书中讲到，当时有很大一部分广告都是以“购买我的产品”或者“进入我的商店”为基本理念完成的。如今很多广告商还在犯相同的错误。


    顾客不会被这样的广告愚弄。他们想知道：“我可以从中得到在霍普金斯给范·坎普食品公司做猪肉黄豆罐头的广告活动中学到了信息的价值。当时，范·坎普的这个产品一直都不是非常成功，但是该产品的制造商依旧相信广告的力量。愿意再冒险投入
    40 万美元，来实行一个比较合理的广告宣传计划。”


    于是，霍普金斯派调查员挨家挨户地去探测情况。当他们将调查结果拿回来之后发现，94%的家庭主妇都是自己烘烤豆子的，只有 6% 的家庭主妇购买各种各样罐装的豆子。当时，一些制造商们依旧花大笔的钱，来争取那
    6% 的人。


    然而，霍普金斯却去找那 94% 的家庭主妇。他列举了做出一碟豆子需要花费 16 个小时的浸泡、煮沸和烘烤的漫长过程。他用图片展示出玻璃瓶中的那些豆子，最顶部的很容易碎，中间的却成了糊状，所有的豆子都是烘烤不足，都很难消化。


    然后他告诉这些家庭主妇们，他们的产品是如何烘烤的——在 245 度高温的蒸汽炉中进行烘烤。他们是如何将豆子烘烤得不碎不破的。他们烘烤出来的豆子，就像坚果一样，呈酥状厂很完整，并且很容易消化。通过这个广告活动，霍普金斯在那个领域中赢得了一定的地位。既为他带来了物质财富，又为他带来了好的声誉。


    而这一切都是因为霍普金斯了解了当时的市场环境，并增强了他呼吁的力量。


