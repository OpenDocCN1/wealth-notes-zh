    假如我们失败了。我们会名誉扫地，损失资金。所以一我 们会尽全力防止这一切发生。


    而我们的行为总还有一点价值。它势必能为您带来新颖的 想法。


    *   *   *


    假如我们成功了，扩大了您广告的影响力。假如我们找到 了一种用同样的费用，获取双倍效果的方法。'
