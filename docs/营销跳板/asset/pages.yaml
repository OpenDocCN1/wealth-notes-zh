  md: '# ## 7. 轮胎广告


    在轮胎市场，最初的广告只是提出一个名字而已。制造商只对轮胎的构造感兴趣，他们只关心生产的工艺细节。他们只讲自己为之骄傲的事情，他们的工艺和流程，他们的工厂规模，以及他们的发展史等。他们自然只会对人谈论这些，看不到顾客的需求，他们很难站在顾客的角度考虑问题。


    在那时，固特异(goodyear)公司正在开发一种叫做直边轮胎的产品，对于霍普金斯来讲，虽然他对轮胎和广告非常感兴趣，但是并不清楚直边轮胎是什么意思。后来，他们给霍普金斯演示了直边轮胎和勾边轮胎的区别，并告诉霍普金斯，这种直边轮胎一方面轮圈不会出来，另一方面无论什么型号，气体置换量都超过
    10%。


    但是，他们并没有告诉实际带来的效果是什么。而广告人必须研究顾客，告诉顾客他们想要知道的事情。对于制造商而言，这是一种新的概念。


    于是，霍普金斯重新给这个直边轮胎起了个名字叫“Ro-Rim-Out 轮胎”——“无损轮辋的轮胎，容量增加 10%。”通过这个诉求，销量迅速增加，固特异轮胎很快成了轮胎市场中的领导品牌。


    没有竞争就没有进步！在竞争对手也开始强调这个优势的时候，霍普金斯逐渐淡化“Ro-Rim-()ut 轮胎”这种提法，转向打造固特异专有品牌。并且引导消费，利用人们的从众心理，让顾客觉得只有使用固特异轮胎才是正确的选择。通过图片和文字大肆突出这点。


    为了加大力度，霍普金斯继续策划出新的诉求点，把防侧滑轮胎叫做“全天候”。鼓励开车的人，无论在什么天气下，都应该使用固特异的“全天候”。


    如果一个名字能讲述一个故事，那它就是有很大的优势，产品名称一般都是要在广告中展示出来的，找到一个适合的产品名称往往是好广告的重要一步。好的名称可以带来事半功倍'
  merge: -1
  img_proc: true
- pgno: 150
  md: '的效果。固特异的。“全天候“这个名字，加上广告的影响，从那时起，固特异真的成了开车人的一种使用习惯。


    霍普金斯乘胜追击，继续为固特异公司出谋划策。那时的经销商很少存货，只有在顾客需要的时候才到固特异分公司买进产品。于是霍普金斯和他的团队们筹划了一次大型报纸广告活动，在报纸上刊登所有有存货的经销商的名字，最低的存货标准是
    250 美元。在短短的数月时间里，就有 3 万多经销商以此为标准购进了固特异轮胎。这场广告活动在很大程度上改变了轮胎经销生意的流程。


    这种在地方广告上宣传经销商名字的做法，对促进他们的存货有着不可低估的作用。没有哪个经销商愿意看到竞争对手的名字。出现在某个大型广告活动中，而自己的名字却不在其中。加入这个方案的人越多，争取其他人加入就越容易。霍普金斯经常通过这种方法帮新产品迅速打开销路。


    霍普金斯给固特异做的广告，也是他最成功的案例之一，是固特异轮胎一路领先往往巨大的成功会让自己觉得无所不能。固特异公司开始要求霍普金斯帮他们做企业形象广告，但霍普金斯拒绝了。他不想做是因为他遵循自己的原则，不会因为有钱赚，就去做一些违背自己准则的事情


    霍普金斯说：“巨大的成功让很多人有了小小吹捧自己的欲望，但吹捧是大家最不想听到的东西。人们喜欢展示自己的厂房，讲话自己是怎样成长起来的，而且还要对方针策略做一点小小的说教。这也许会令他自己开心，但这不是销售。”


    从此之后，虽然霍普金斯失去了这个客户，但他创作的广告继续为固特异带来源源不断的财富。


    下面是霍普金斯帮助固特异公司扭转局势，成为领导品牌的经典广告：


