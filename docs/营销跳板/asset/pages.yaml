  md: '通过轻浮的戏弄你怎么能希望得到一个人的光顾?什么时候广告商才能认识到销售是严肃的交易呢?单独的这些物质能起作用吗?而且，是那些导致思想偏离论点的东西阻止了有效的印象吗?


    # ## 23. 虚荣


    我们不要抱怨虚荣.因为这是一个普遍的性格特征。而且，它增加了生活所需要的辛辣和魅力。同时，它是有利可图的。如果虚荣心不存在了，那么世界上一半的商业往来将会消失。而且，雄心壮志会医虚荣而凋零。


    但是，让我们开设一个有关虚荣的账户。让我们把我们为虚荣支付的金钱准确地记入这个账户。从本质上把它区分开来。不论在个人私事上还是个人业务上，我们都不要自欺欺人。


    尤其在广告行业中。当我们描述我们的建筑物和吹嘘自己的成就时，不要将其运用于销售上。标记那些不必要的图片、浪费的边框，插入的那些话仅仅是为了表面的自尊。测量那些仅仅是为了让广告吸引自己和朋友而使用的空间。把这一切统统记入虚荣账户。


    将其与邮购广告相 LIs。因为在所有打印出来的广告当中，虚荣抵消了虚荣本身，因为其成本和结果可以准确的测量出来。虚荣是我们的一个朋友。如果没有它，广告将会变得更小而且广告商也会越来越少。所以这则信条不是意味着不友好。


    但是，作为～个受信任的顾问，我们必须告诉我们的顾客。不要将虚荣运用到销售术中。维持⋯个单独的账户。如果税金太高，那么就减少一点。


