- pgno: 195
  md: '会上，我们讨论为向我们咨询的顾客提供怎样的建议。而且是免费提供。


    这16人判断哪些产品有潜力，哪些没有。他们在方法、方案和文案上作出决策。


    所以，对于每个问题，我们都会使出所有的能力和经验。


    这就是我们成功的原因。


    但是，这些报酬高的人才不是我们的经济负担，也不是客户的负担。


    和其他广告公司一样，我们的收入也来自佣金。


    这些人才都是通过把小客户发展成大客户，才领取如此高的薪酬。


    他们使广告获利，从而使广告商扩大广告，而低劣的广告人则会至他们于死地。


    对我们来说，留住广告商，并发展他们，比不断寻求新客户要划算得多。


    # 致新的广告商


    如果您的产品有进一步发展潜力，请告诉我们。我们将乐意给出我们的判断。


    如果不可能有结果，我们不会承揽这个任务，我们浪费不起这个时间。


    如果它有前途，我们会告诉您怎样安全地证明它的潜力。


    我们已用这种方法，为数百个客户赚取了巨额财富。


    # 致老的广告商'
