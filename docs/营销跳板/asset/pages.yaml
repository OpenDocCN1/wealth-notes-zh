  md: '能为你做的事情；你允许使用低效率的方法导致事倍功半；你慢慢悠悠地做可以迅速完成的事情；


    当你的竞争对手在使用拖拉机耕种田地的时候，而你却在用牛犁耕地；当有才能的人可以增加你的发展势头时，你却雇佣了平庸之才。你继续担任重要的职位，你必须帮助你的助手。你亲自做一些本来可以用书面信件完成的事情。而且，你以整脚步枪的方式使用印刷物，然而条件却需要一架加农炮。


    浪费钱是一件小事，因为这很容易被代替。但是，时间一旦浪费就会永远失去。而且，在你的全盛时期浪费时间会制约你的整个职业生涯。


    # 33. 谦逊


    应谨记谦逊之美，自负之恶。而吹嘘之人寡助，人类生来抗拒侵略。人们抵制强迫，惧怕过度膨胀。同情伴随着落败者，而大小和力量激起欲望。但是他们都提倡自我满足而使人心寒。


    绝大部分的人感觉与领导没有伙伴关系，而在自己的阶层中苦苦争斗。他们对权势毫无爱慕之意。这种不信任和对霸主的恐惧产生了对大企业的怨恨。助长反抗依然是日益增长的趋势。


    因此，炫耀强大之处，或者表现出要打压对手，抑或显示优势通常都不是明智之举。甚至太大的广告也一次又一次地激起人的愤恨而且，许多广告由于过于自夸，反而赶走了一些有意愿的人。


    真正有权利下命令的人，往往不会刻意表现出命令之态，权利越务则越内敛。成功取决于以下几点确实不假。首先，在政治上，然后是广告方面。


    # 34. 策略


    人类原始的本能是通过武力来达到我们的目的。在广告行业中，这意味着依靠金钱的力量来达成目标，但这样很少能赢。'
