- pgno: 233
  md: '# 第三篇广告核心


    # 1、大师们从未透露过的秘诀


    在这一章，我将揭露全世界顶级广告文案撰稿人都不愿公开的秘诀。可以让你的广告文案和销售信的威力迅速提升3倍——不管你过去是多么的优秀。


    比如：克劳德·霍普金斯、大卫·奥格威、尤金·斯瓦茨、约翰·卡普尔斯、维克多·斯瓦布、埃尔默·惠勒、罗伯特·科利尔、盖瑞·克尔波特、杰·亚伯拉罕、丹·肯尼迪和泰德·尼古拉斯，盖瑞·本茨文加……


    他们创造的非常成功的广告和销售信，都是必须经过这个步骤。而这几个步骤都从来没有这么完整系统的公开过，因为这是他们私下保留的秘密。


    因为你今天订购了《营销跳板》，所以，你才有机会看到。再次恭喜你做了正确的选择。


    让我们开始吧！


    如果你希望自己撰写的销售信和广告文案，让潜在客户非常强烈地想要拥有你的产品，那么，你就必须要做一些调查研究。你需要了解你的目标市场、你的产品，以及你的产品如何解决潜在客户最大的痛苦，或者实现他们最大的愿望。


    你的销售信和措辞用句对于其它的受众和产品是多么有用和成功并不重要。重要的是，你的销售信里面要有能够吸引这件产品的这群受众的东西。而你要通过调查研究才能确定这些东西是什么。'
  merge: -1
  img_proc: true
- pgno: 234
  md: '尽可能地去了解你的受众的一切。要知道为什么这个受众会对你提供的东西感兴趣。


    要对你目标市场的需求感同身受。从一位典型顾客的心态习惯开始。要深入了解他或她的想法。要先深深理解你的潜在客户们的想法和感觉，然后再与他们沟通交流。共同的感受可以消除你和你的潜在客户之间的阻碍，缩短你们之间的距离。共同的感受可以使你们的关系变得很密切。你若能够站在你的读者的视角上，去理解他们，那么你就会更加有优势，也会更有可能吸引潜在客户的注意力和兴趣，然后和他们做生意。


    要彻底地调查查究你的产品或者服务的所有方面。要以不同的方式、并且从独特的视角上来看它。


    要尽可能去了解你的竞争对手们的情况：他们的产品、所提供的东西、他们的优势以及弱势。


    要事先考虑到任何有可能影响潜在客户掏钱买东西的障碍，然后尽可能多想些办法来消除这些障碍。


    当你撰写标题的时候，心里要想象着你主要的潜在客户。先对你产品的受众类型描绘出～个样子，然后在撰写宣传文案的时候，脑海里一直保留着这个样子。在这种策略的帮助下，你撰写出的销售信就可以促使潜在客户在一边阅读的时候，一边想象他自己享受到你所提供的好处的样子。


    在这个阶段，你的注意力完全应该集中在问题上，而不是答案上。在你说服理想的潜在客户从你这里购买之前，你需要了解些什么呢？你无需担心如何找到答案，或者是否能够找到答案，而是应该列出你能够想到的每一个问题，来帮助你将信息表达得更加引人注意。


    +   例如，像这样的问题：

    * 我的理想潜在客户是谁？

    * 他们最大的烦恼是什么？他内心最深的欲望是什么？

    * 最大的挫折又是什么呢？

    * 我最强劲的竞争对手是谁？'
  merge: -1
  img_proc: true
- pgno: 235
  md: '+   *   他们哪里做得好?我们怎样做才会更好?


    +   *   主要的障碍——有资格的潜在客户不购买的原因是什么?


    +   *   这样的问题还有很多。


    请尽可能发挥自己的想象力。如果你可以利用无限的知识;如果你会读心术—什么信息可以帮助你尽可能将产品或者服务多销给有能力购买的顾客呢?请把她们当作问题记录下来。


    或许你可以找到答案，或许找不到。但是，只有当你意识到这个问题的时候，你才能更有机会找到答案。这就是所有有关的第一步。


    请理解这个关键问题……


    是什么让一封销售信变得无法抗拒的?并非用词，并非格式，也并非引人注意的聪明方法—而是你与你的读者之间的联系，以及想法、情感、激情的传达。而要创建这种联系，就要真正地瞭解你的读者—她的需要，她的痛苦，她的梦想。


    当你了解—真正地瞭解—你的读者在想什么，他的感觉是什么，什么能够吸引他—并且，直接为他撰写销售信，传递出他的需要，解决他的烦恼，实现他的梦想的时候—你就会与他建立联系了。这样他将会购买你的产品。


    # 瞄准你的目标


    对于一位见到任何东西都射击的猎人，你会作何想法呢?从来没有目标—只会将枪到处乱指，不断扣动扳机。这样做没有什么意义。这样的猎人是无法将任何晚餐或者战利品带回家的。


    猎人需要一个目标。他要确定、识别、并认真地瞄准它。那才是他想要击中的一—只是目标，再无其它任何东西。


    那才是你必须要做的事情。确定你的目标是谁。然后对准他。那才是你应该用销售信实现的一—只是那个人，再也没有旁'
  merge: -1
  img_proc: true
- pgno: 236
  md: '人。


    你应该调查研究的是：如何确定那个目标，即如何了解你的目标是什么样子的、他的行为如何、感觉如何。你应该调查研究的是：说服你的受众最有效的子弹类型是什么！


    你的目标不能是所有人。甚至也不能是所有女人或者所有男人。它需要非常具体。为什么呢？因为人们都想要感觉自己很特别。他们想要感觉自己是唯一的。


    比如说，你的广告是这样的，“只要您吃东西，您就需要这个！”你或许会认为这是一个非常好的目标。


    “每个人都会吃东西，因此每个人都会需要我的产品。这样我就会被发迹了！"


    但是，有一个问题。大部分人看到这样的标题之后都会这么想，“当然，我是要吃东西。但是，我是特别的。我不像其他人那样。那则广告是为普通人设计的。这是对其他人说的，但不是我。我要找的，是那些只为我准备的东西。”


    请想一想，如果在你的社区里的每一个人都拥有完全相同的汽车，即使它是～辆很好的车，你还会很兴奋地去买一辆吗？恐怕不会那么想了吧。你不想像其他所有人一样。你想要一辆可以体现你的特别的汽车。你想要听到人们说，“哇！真是好车。我希望我也能有一辆那样的车。”如果是每个人都拥有的一样的车的话，人们是不会那样说的。


    而你的销售信就需要为人们做到这一点—使他们感觉到自己的确很特别。


    再说一次，这需要调查研究才能确定。为了清楚地、具体地确定目标，你需要提出和回答什么问题呢？


    这个时候，你或许会说，“但是，我的目标就那么大，就有那么普遍，是每个人都应该吃的东西！”可以。但秘诀是：将大的目标拆分成一个个更小的部分。然后再分别以所有更小的部分为目标。'
