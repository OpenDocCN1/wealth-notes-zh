  md: '不到任何作用。


    一位排名第五的啤酒制造商请霍普金斯接管他们的广告。霍普金斯先去了一所酿酒学校，然后又去参观了他们的啤酒厂。他看到啤酒是在一个平板玻璃室中、在滤过的空气中进行冷却的。他看到啤酒是通过白木浆的过滤器来过滤的。啤酒瓶会用机器冲洗四遍。


    在每次操作使用之后，都会清洁所有的水泵和管道。他们的啤酒厂坐落在密歇根湖的海岸，但是他们却挖 4000 英尺深去获得更加纯净的水源。


    霍普金斯又去到实验室里，观察玻璃瓶中的酵母母细胞。他们告诉他，那种酵母是经过 1200 次试验最终得出的，其味道最佳。而他们啤酒厂中使用的所有酵母，都是用那个母细胞生产的。


    霍普金斯看到这些很震惊。并问他们，“你们为什么从来没有讲过这个故事呢？“他们告诉他，所有的啤酒厂普遍都是使用这些方法。所有的竞争对手都可以说出这些东西来。


    但是，霍普金斯把那些平板玻璃室用图片展示出来，并讲述了那些过滤和过程。仅仅数月的时间，那家啤酒厂就从排名第五跃到了第一名。而这很大程度上是由于霍普金斯为它的纯度和美味提供了非常有说服力的理由。


    另一个例子是，当霍普金斯将“植物酥油”（康托苏特）与“猪油“进行对比销售的时候，进展很缓慢。因此，霍普金斯在芝加哥的一家百货商店中制作了一个世界上最大的蛋糕。而它正是由这种植物酥油制作的。所有的目光都聚集到了这个大蛋糕的身上，一周之内就有
    10 万名女性来看它。于是他便向她们提供一些植物酥油的样品，然后向当天购买这种植物酥油的顾客提供一些额外的赠品。


    这个计划取得了巨大的成功。仅仅在一周之内，这种植物酥油就开始盈利。然后，他在上百个城市中的主要商店里都放置了一个这样的蛋糕，从而使这种产品在全国范围内都大获成功。从这个案例中学习到：一定要尽可能地吸引人们注意自己的'
