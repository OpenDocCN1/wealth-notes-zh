- pgno: 295
  md: '如果他们的利益曾经与你的利益发生过冲突，那么就不要把他们视为盟友。如果你现在的方法能使你的生意有利可图或者可行的话，那么就不要抱怨其替代了以前的方法。


    而且，不要期望他们会在只是设想的前景上投资太多。你的工作就是时刻和消费者在一起。“带来生意并且我们会提供买 卖”，经销商们如是说。


    而且，他们也将会这么做。许多活动已经在获得传播渠道上花费了很多。在袜子经销商中，要激励他们的热情。然而广告业却是一场惨败。如果你采取了其他的一些方法，现在的这些多疑的经销商们会给你最好的热情。


    要把你的所有努力集中在消费者身上。他将会得到他想要的东西。最初的销售也许会失败，但这个计划仍然将会被证明是最经济的。而且，其最好的作用将会是培养了自力更生的能
    力。'
