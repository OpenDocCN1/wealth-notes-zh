  md: '# 17、想象力


    什么是想象力，又要怎样将其运用于商业资产中呢？当然它并非指梦想家的梦想。当一个建筑师设计一个 40 层的建筑物时，他非指梦想家的梦想会提前画出每条线和每个细节的图纸。当一个工程师测量裂缝和断层时，他会首先查明所有不同部分的强度要求。在采取下一步行动之前，他们都会提前看到可能的结果，并且在必要的地方做出记号。


    因为他们知道一点偏差就会付出很大的代价。


    因此，在商界和广告界中，也该是这个道理。没有计划的努力会导致不同的结果。为了实现一个目标，你的每一次努力都应该直指该目标。


    与大多数的行业相比，在广告业中，你史需想象力。但是想象力必须经过培训才能获得。就像在建筑学和工程学中一样，想象力必须是一个熟悉这类工作的人所构思的图纸。这样的人往往能看到最终的结果，因为他过去经常看这样的图纸，并且他熟悉其中的方法。图纸是至关重要的。一个人必须要清楚地知道他所追求的东西，也许这是很多年前就存在于脑海中的。而且，每一次行动必须要符合最终的结果，否则此次行动就是一次浪费。


    在广告


    业中一件困难的但又极其重要的事情就是始终如一地保持一个方向不变，因为曲折的道路很漫长、效率很低。


    # 18 平均水平


    尽可能按照平均法则来判断一切事物。避免孤立的事实。同村的，通过一些极端的天气来判断气候，就像在街上通过一个小时来判断一个人一样片面、不合理。有时候不合适的人选也能做出一些令人满意的事情。危险的人也能做出安全的事来。


    许多人在生意上能取得一次成功，但也有可能再也做不出什么成绩来。相似的原因常常带来相反的结果。所有的人都有'
