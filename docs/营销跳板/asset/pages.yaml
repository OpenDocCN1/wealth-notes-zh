  md: '# 每个人都可以拥有幸运的汽车


    由R. E. 奥兹设计


    有种汽车方方面面都没有任何故障：不会抛锚，不用维修。


    而能拥有这辆汽车的人告诉他的朋友们，他得到了一辆幸运的汽车。


    但是，每位雷奥的购买者都可以拥有一辆这样幸运的汽车。我是这样来确保它的：


    # 我制造的方式


    所谓幸运的汽车，其实就是指经过特别小心谨慎而制造出来的汽车。我已经花费了26年的时间，来学习所有必要的东西。


    我使用的所有钢材都符合标准。每块材料都会检查两次，以确保它符合标准。


    接着，制成的零件也会进行检测。对于每一个零件，我都会要求超过不少于50%的容载量。


    齿轮会使用压碎机来进行检测，从而保证每个齿轮都能承受7万5千磅的重量，


    弹簧由另外一种机器进行检测，从而保证可以承受10万次震动。


    # 额外花费'
