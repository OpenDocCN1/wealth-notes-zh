  md: '# 视觉子弹


    视觉子弹，就是使用需要视力参与的描述来描写好处。颜色，大小，火花。如果读者正在看这种好处，他将会看到什么呢？


    +   “当你从加油站飞驰而过，向其它汽车挥手的时候，请尽力不要笑出来。”


