    不管您是新广告商，还是老广告商，不管您成功与否。从我们的建议中，您能获得如此多的益处，承担的风险却如此小，您有责任采纳它。


    请现在在您放下本书前，致信我们。您只需说：“派个人过来。”我们就能亲自告诉您，那些我们不愿公之于众的事实。


    然后，如果您希望进一步了解情况，我们会邀请您来到我们的办公室，见见我们的咨询委员会。


