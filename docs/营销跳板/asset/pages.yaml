- pgno: 10
  md: '量的。


    想要成功，你需要让你的销售流程就像你坐在你的客户旁边一样。你的网站、销售信、新闻稿，简报，宣传册，或者其他的任何出版物，必须与你的潜在客户的情感因素建立联系，以来说服他或她采取某种行动。


    你的广告不应该是关于“形象”或者“品牌化”，而是用一种独特的语言讲述属于你自己独有的故事，以此来吸引你的潜在客户的需要、需求、欲望、恐惧和虚荣心。


    拉斯克尔与肯尼迪的谈论产生了联系。他多年以来也一直在寻找这个答案：现在肯尼迪已经给了他苦苦追寻的答案。


    因此，肯尼迪被罗德暨托马斯广告公司聘请，并成为当时报酬最高的广告文案撰稿人。他的年薪达到惊人的 52，000 美元。（还有人说不止此数。）


    罗德暨托马斯广告公司成为了广告文案撰稿人的培训基地，拉斯克尔让肯尼迪将他所有的原理和信条编写为一系列的课程，汇编为《广告测试教程》。


    后来，肯尼迪于 1907 年离开罗德暨托马斯广告公司，但在 1911 年以高薪的广告文案自由撰稿人的身份重新回到公司。而且，他的《广告测试教程》在 1912
    年以《广告理由》（Reason Why Advertising）的书名再次出版，并且他在 1914 年编写了他的第二本书——《精编广告》


    约翰·E·肯尼迪的这本《广告理由》一经出版便大受欢迎，如果你仔细想一想，就知道这是一个伟大的一个标题。很明显，你应该给你的客户一个购买你产品的理由。


    然而，即使在今天依然有很多商家没有这么做。他们仅仅告诉他们犯了一个重大的错误，因为他们没有主动解释：“请购买我的产品是因为……”


    你正在犯这些营销错误吗？'
