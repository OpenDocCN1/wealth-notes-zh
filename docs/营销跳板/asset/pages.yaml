  md: '# 9、膨化谷物与桂格燕麦（Quaker Oats）


    我想你可能对“枪中射出来的食品”这个主题不陌生。这个是霍普金斯给桂格燕麦公司做的第一个广告。


    受桂格燕麦公司总裁克劳威尔先生的邀请，霍普金斯到他们的生产工厂观察了他们的生产工艺流程，并且膨化谷物这个产品的发明者安德森教授向他解释这些产品是怎么生产出来的：把大米加热到一定温度后，用木制的强把它们喷射出来，大米就会在冷空气中爆炸。这样就打破了大米坚硬的颗粒，使大米膨胀到正常大小的8倍。


    霍普金斯于是想出了一句广告语：“枪里射出来的食品。”但这个广告一推出遭到当时美国最大的一家食品广告主的碰击，说在所有的笨蛋广告中，这是最愚蠢的一个，用“枪里射出来的食品”打家庭主妇的主意，是弱智的人才会想出的办法。


    但事实证明，这个策略很吸引人，它引起了家庭主妇们的强烈好奇心。而我们知道，好奇心是刺激人们回应的最大动力之一。


    然后，霍普金斯在广告中树立了一个人物形象，就是安德森教授。就像他给汽车做广告那样利用人物形象。霍普金斯说：“只要有可能，我在任何地方都这么做。人物最能打动人心，这是毫无灵魂的企业做不到的。”让一个人出名，就可以让他的产品出名。我们所有人都喜欢研究别人的生活和他们的成功，这个人性。


    这次膨化谷物的广告活动，使“爆米花”和“膨化小麦”成为早餐食品领域里最赚钱的产品，证明了霍普金斯的”枪里射出来的食品”是有史以来最成功的谷类广告活动。


    当然，在媒体的选择上霍普金斯也犯了个错误。起初在报纸上投放这个广告，后来发现看报纸的人群并没有多少购买能力，浪费了一大笔钱。最后，才发现杂志广告才是唯一最佳选择。'
