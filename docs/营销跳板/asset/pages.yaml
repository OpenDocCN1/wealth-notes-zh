  md: '会认为我们不再属于这里。我们寻找那些只盯着目标的工作人员，而不是只看到通往目标的艰难道路的人。而且，我们相信在广告里我们服务的每一位客户都会因为我们觉得这份工作有趣而感到高兴。


    # 6. 个性


    培养自己独特的个性。如果你可以做到，那么在正确的方向上做的与众不同。


    然而，在一定程度上，即使在一个错误的方向上与众不同，也比毫无新意强得多。独一无二的东西才会吸引入的注意力。人云亦云、随波逐流不会有任何进步与发展。


    逆向领导阶层的第一步会使人远离其他人而变得与人不同。因此，在创作广告的过程中，每一篇文章都必须独具特色，以此来获得成功。凸显个性，使其从竞争对手中脱颖而出。去了解购买者最需要的是什么。如果这样的交易值得去做，那么就赋予你的产品可以满足消费者需要的特性。


    基于大众需求的品质，设计---款理想的产品。确保制造商遵循这一设计。不管在图纸还是在产品上都不能偏离这一设计。不同的主张使人难以捉摸；太多的主张便会使人困惑。


    通常情况下，一个极好的特性就够了。为了这一独具特性的单一模式而工作，然后经过一段时间？人们想要的那种具有代表性的东西便会出现。


    # 7. 简单


    在出版物中，尽量使用简单的语言，尤其在广告语中。因为这个世界充满了非常简单的人，所脚要使用所有人都能够理解的常用词汇和短句。要忘掉自我，而不要尝试去彰显你的个人能力以使人印象深刻。不要使用独创的短语，也不要使用精彩的措辞，而是要专注于你所谈论的产品。


    广告文案作者是匿名的，事实上也应如此。他是在为商家'
