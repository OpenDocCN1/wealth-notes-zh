- pgno: 292
  md: '那么它就不是一个安全的投资。


    任何聪明的人，如果没有健全的原则，那么他将迟早会遭遇灾难。信任他的人也将会被引入歧途。他所服务的行业也将会被逐渐削弱。这在广告行业中是极其真实的。缺乏品行这个事实在引人注目的宣传中是不可能被隐藏的。如果将品行隐藏在暗处，那么人们可能会迟迟不予评价。但这并不适用于出版物。


    因此，在选择广告顾问方面要慎重地考虑其品行。对世界来说他们就是你的肖像画家，代表着你的形象。事情一定是这样的，不可能有其他情况。不论你怎样限制他们，他们都不会成为你想要的样子。


    尝试着将他们当作你想要的人，但在语言或是方法上他们是无法隐藏自己的。试问他们是你要向世界展示你形象的人吗？试问他们的商业原则值得尊重吗？如果不是，就不要选择他们。你越是相信他们，他们就越来越会误导你。而且，他们在这个领域，在很大程度上，注定要成为你的镜子。


    # **38. 怀疑论者**


    我们正在面对一个充满怀疑论者的世界。人们害怕他们自己轻易受骗。


    因此，出于自我保护的目的，他们在售货员说的每一句话中寻找漏洞。他们不害怕真实的谎言，甚至于不怕夸张。因为现在的法律会惩罚说谎者。


    在广告中我们必须解除这种怀疑的态度，否则我们不会使人信服。不要使用流畅的概论。在你的要求中要做到具体明确。如果不是故意撒谎，那么就只说真实的话。如此一来，人们会相信它。一定要准确而且要谨慎。


    如果一个声明可能引起疑问，那么就要解释这个疑问直至疑问消失。让真理看起来像真理。人们很容易上当；而且他们知道这一点。但是为了保护他们自己，他们通常怀疑那些不值'
  merge: -1
