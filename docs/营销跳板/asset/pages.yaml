- pgno: 117
  md: '霍普金斯发现人们总是愿意与取得某种杰出成就的人打交道，而不愿与缺少灵魂的大企业打交道。在广告中提及某专家的名字，意味着这个人有独特的能力和声望。即使他在公众可能没有什么名气，与一般刚起步的人没什么区别，但如果一个大公司来包装他，人们就会对他满怀尊敬，他很快就会很有名，接着他的名字就会成为独一无二的有巨大价值的象征。


    让一个人出名要比让一个机构出名容易得多。而且，某个人的名字通常要好过铸在产品上的名字，‘甚至远远好过一个商标。如果你能使产品背后的人高大起来，公众就会认为这个人的产品同样高大。


    霍普金斯开始为汽车赋予一种个性。他知道，如果人们觉得自己被当作一个单独个体来对待的话，便会有认同感。让人们相信某种产品的捷径就是让他相信产品背后的人。因此，他经常请人在广告上签名一要么是公司的领导，要么是汽车的设计师，或者其他
    人等。


    他还利用人们“随大溜儿，追赶潮流”的从众心理。因为人们总是追随潮流和多数人的偏好，因为我们很少自己做决定，因为我们并不清楚事情的真相。但当我们看到多数人选择向一个方向前行的时候，就很容易跟着他们一起走。


    霍普金斯帮助大切诺基汽车利用人们不被“落伍”的欲望，使大切诺基获得了巨大成功'
