- pgno: 238
  md: '最后一句话是否使你感觉不舒服呢？如果你不喜欢以这种咄咄是图的方式思考，那么你可以从潜在客户的角度上来看待这个问题。


    在这里我先暂停一下，来确定～件事情。如果你对下面这个问题无法回答“是”的话，那我也根本就没必要继续说下去了。这个问题是：


    你向顾客提供的价值，对得起他们支付给你的钱吗？如果你的回答为“是”，那么，你是真的、真的、真的相信它——在内心深处？


    如果是这样的话，那么你就更应该为赚取潜在客户的钱而感到内疚了。因为你每次赚他们钱的时候，你提供给他们的是他们想要和需要的东西。他们所得到的价值，已超过他们所花的钱。


    # ## 收集事实和数据


    尽可能多的收集有关你的产品和市场的详细信息。掌握大量的事实，可以使你从中挑选出相关的信息，然后放在你的销售信中。它会使你的销售信清楚、简洁、有趣，以及最重要的一可信。


    如果没有这样的事实，营销人通常都依赖引人注目的短句和浮夸之词。这种销售信或许听起来很不错，看起来也非常专业，但是，它们是不太可能将产品销售出去的，因为其中传达的消息是不可靠的。


    为了帮助你更好地进行调查研究，我建议你先开始收集你能找到的、与产品相关的所有材料：


    +   - 销售脚本


    +   - 宣传册


    +   - 录簿'
