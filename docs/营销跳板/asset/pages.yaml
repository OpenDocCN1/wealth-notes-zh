  md: '这则广告霍普金斯没有使用任何空洞的“大肆宣传”之语。他的主张都是有事实、细节以及故事叙述做支撑的。如果有什么区别的话，那就是霍普金斯的语气平铺直叙，而这也增加了广告的可信度。


    “50年的完美演绎”，这个标题用数字化，传达的信息会让人们觉得这是真实的，被衡量过的东西。但是，后面只使用了完美的演绎，并没有讲明到底是什么经过50年的完美演绎。关键点：因为数字是50年，历时长远，加上没讲清楚具体陈述的对象，从而引起了顾客的疑问和好奇心，到底是什么经过了50年的演绎，诱使顾客继续往下看。


    起始段直接公布答案，是喜力滋啤酒经过了50年。但是顾客还是会产生疑问，这对我们有什么好处？


    接下来，使用故事开始陈述。通常用故事作为起始段是引起兴趣的一种方式。但是，人们可能会想，“谁会想要去听关于啤酒一步一步酿造过程的故事呢？”“然而事实却证明，那些热爱啤酒的人会被这个话题深深的吸引住。”


    他们想要知道，为什么他们应该选择这种啤酒，而不选择任何其它种类的。这位伟大的广告撰稿人克劳德·霍普金斯，现代厂·告之父，便深深理解营销的这种原则，并且继续将这种酿造过程转述成一个充满细节的、激动人心的故事………个充满吸引啤酒爱好者兴趣的故事。


    如今，所有的啤酒厂在销售啤酒的时候，都剽窃了霍普金斯的理念。如果你观看如今电视上的啤酒广告，你就会发现，实际上，它们与普普金斯在将近一个世纪前所撰写的广告是一样的。


    则广告突出了喜力滋啤酒与其他啤酒的不同之处。目的是打造喜力滋啤酒的品牌，证明喜力滋啤酒才是最好的啤酒


