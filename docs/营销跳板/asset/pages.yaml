  md: '说话，而这些商家出售的是商品而不是文体风格。看上去不要竭力追求效果，隐藏你的努力去销售。当你的这种努力过于明显时，便会显得牵强而产生阻力。


    语言要言简意赅，人们不会去听一个推销员漫无边际地夸夸其谈。说话要说到点子上，该停的时候就要停下来。不能重复已说过的话，因为印刷的文字是昂贵的。要使你的第一句话——标题——就能拨动目标读者的心弦。不要将主要观点和次要观点混为一谈，分清孰重孰轻。次要观点总是放在次要的位置。而且，当被引用时，一些微不足道的品质也会暗示一些重要品质的缺失。


    须尊重你要出售的商品。考虑到你请求他所做之事的必要性，不管是对你还是对他。撰写广告时就像那个人正站在你跟前一样：撰写广告时就像你的未来都压在了这个交易上一样。


    如果你的话语被数以百万的人熟知，你的未来确实会因此改变。除非你觉得读者会对这则广告无法抗拒，否则不要实施这则广告，努力使你的广告文案牢不可破，让每一个字都充满真理。世界上没有什么会和赤诚（绝对真诚）一样战无不胜。同时，也没有什么会像缺乏诚心一样令人厌恶。


    # ## 9. 简洁


    返是一个快节奏的世界。然而，我们留恋有趣的东西，并且希望逗留更长的时间。我们喜欢简短的布道，但不喜欢简短的戏剧。我们想要大颗的糖果，但只想要胶囊大小的奎宁（一种药物）。所有这些适用于广告。


    当给一个感兴趣的人讲一个有趣的故事时，简洁则会成为一种错误。还有一种情况是，当一个汽车爱好者准备花费一年的积蓄来购买一辆汽车时，你不能对他这一看似疯狂的举动说太多，因为汽车是他的兴趣所在。


    “理由”作为洛德暨托马斯广告公司的一个文案创意，却招致了大量批评。然而，我们应该看看它的成功之处，这一切都取决于广告。'
