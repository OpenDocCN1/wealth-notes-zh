- pgno: 243
  md: '最后才使用它们。你的潜在客户只关心你的产品将会如何使他受益。因此，当你在传达信息时，你首要要把重点放在利益上，最后再说特征。但是，为了引出那些好处，你需要以特征开始。所以说，特征是首先确定，但最后使用的。


    提出强有力的好处的最好方法，就是先列出每一个你想到的特征。写下你能想到的每一件事。当你使用这个方法的时候，如果你的产品特征可以全部列出来，那就更好了。而如果是一种服务，那么就要尽可能想到与这种服务有关的一切。如果它是一种信息产品，那么就要一页一页地浏览，来找到特定的、高品质的、有价值的内容。这些内容也是特征。


    如果你做了调查研究，那么你手边已经有了大部分材料了。你应该把与你的产品和公司有关的全部可利用的信息都收集在一起。你有宣传册吗?说明书?过去的销售信?图片?客户评价信?反馈表?


    特征本身并不重要，重要的是，特征代表着好处，而潜在客户通过使用你的产品，可以获得这种好处。


    展现特征的方法是：先把它代表的好处讲出来，然后再讲述其特征本身。人们只有在确定 Iii 己想要得到某些好处之后，才会想要了解其本身特点。你可以用完全独立的一页内容列出特征。这样一来，你就不用将它们混在销售信息里了。


    只需要在你的广告中列出那些能够提供强大好处的特征，而没有必要罗列出那些不会带来任何好处的特征。记住，一种特征，它本身对于潜在客户而言是没有任何意义的。但是，在头脑风暴你的特征清单的时候，不要理会这一点。尽管列出你能想到的一切特征。之后你可以编辑和删除它们。记住：不要边写边删。一定要记住这点。


    一些产品的特征可能包括:


    +   - 在制造过程中使用的材料


    +   - 包装或者储存使用的材料


    +   - 成分


    +   - 包装分为大包装盒和独立小包装


    +   - 新鲜，密封，等等


    244'
