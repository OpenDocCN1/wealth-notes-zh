  md: '# 50 年的完美演绎


    每一瓶喜立滋啤酒，都是蕴含着 50 年的历史底蕴


    1848 年，在一个小屋子里，约瑟夫·喜立滋开始酿造啤酒。当时他酿造的啤酒并不如今日的喜立滋啤酒，然而事实却是如此。它是美国人有史以来所酿造的最好的啤酒。


    这家伟大的啤酒厂如今拥有了新的酿造方法。半个世纪的沉淀，教会我们如何做到完美。但是，我们的理念却是 50 年始终如一的，我们的目标也从未改变。喜立滋啤酒始终根据我们所了解到的最好方式进行酿造，从不计较花费。


    我们专门派专家到波西米亚挑选大麦，并且只购买生长得最好的啤酒花。


    提提纯是非常必要的。


    所有的啤酒都要放在平板玻璃房间里在滤过的空气中进行冷却。然后，在装瓶和测量之后，再进行消毒杀菌。


    企业的以为股份持有者负责挑选大麦，并且只购买生长最好的大麦。


    在将啤酒从冷冻室取出之前，我们要把它放在里面数月时间。否则的话，喜立滋啤酒就有可能造成身体的不适感，就像普通啤酒那样。


    我们公司的一位合伙人全程监督酿造的每一个阶段。


    我们这里进行的清洁标准比任何厨房的标准都要高。


    当你购买啤酒的时候，你得到的，往往是适合经销商的啤酒。他所关心的，更多的是他自己的利润，而不是你们消费者们的健康。


