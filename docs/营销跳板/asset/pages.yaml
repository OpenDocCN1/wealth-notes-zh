    - 潜在客户


    你还需要对你的受众提问。


    最后，你需要确定自己销售信的目标是什么。你的目标，或许是由下面的若干目标组合而成的：


    +   - 产生咨询

    - 创造销售额

    - 吸引准顾客

    - 建立认知度'
