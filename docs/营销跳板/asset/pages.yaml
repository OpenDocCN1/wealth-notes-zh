    ![](img/4ab20ca05f51cd03e7810d6188c67a1f_193_0.png)


    我们从事广告业已有 35 年的历史。


    然而，每周，我们都对广告有新的了解。


    看看过去短短的几年里，广告业有了多大的增长。


    看看各种产品，不论大小，现在正赚取多大的利润。


    十年前，所有这些似乎遥不可及。


    曾经尚待发展的领域里，数百家新客户因为我们的发展而成长。


    ![](img/4ab20ca05f51cd03e7810d6188c67a1f_193_1.png)


    我们做过如此多的空前之事，我们逐渐开始意识到，广告使一切皆有可能。


    然而，在今天，没有经验和能力，则不行。


    优秀的广告真是俯拾即是，让外行人无容身之处。


    <u>我们支付给一个广告文案作者的周薪是 1000 美元</u>


    克劳德 C·霍普金斯先生，现在是 我们文案部的经理，其周薪是 1000 美元。


    这是广告业史上最高的薪资。'
  merge: -1
