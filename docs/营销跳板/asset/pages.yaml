- pgno: 291
  md: '而且，没有人会因为这些错误而受伤害。他们不用努力就可以来到聚光灯下，并保存下一个被很好地证明了的事情。


    “没有冒险，就没有收获”是一个赌徒的辩护。“如果多半是冒险，则没有收获”是一个很好的商业格言。在广告行业中，90%的成功者都是从小事开始的，之后便不会再赌。但在商业的墓地中埋葬了很多莽撞的人。


    # **36. 教养**


    在与绝大多数人交往时，我们应该做一个绅士。


    人有很多种类型，有愚蠢的人、爱喧闹的人，还有喜欢蛮力的人。但是，这样的人只占一小部分。而且，他们和剩余的其他人一样都会对有教养的人印象深刻。


    你见过黑色的大标题需要很卖力地吸引别人的注意力吗？奇形怪状的或是不同寻常的背景需要很卖力地吸引别人的注意力吗？太过紧急的展示，明目张胆的并且迫切的要求需要很卖力地吸引别人的注意力吗？你会觉得你并不愿意见到做这些事情的人。


    和在所有的人际关系中一样，广告中也有种礼仪。而且，这种礼仪和所有的规范一样都需要遵循一脉传承的风俗习惯。人们已经习惯了某种字行的长度、某些类型和背景。这些习惯已经由一代又一代的人固定下来以便于阅读。


    当你召开一个听证会以示礼貌时，为什么要摒弃这些标准呢？


    假设你去一个地方，在那里你的广告深入到每个家庭圈子，你会和你的广告一样大声地说话吗？或者你会打扮的奇装异服吗？或者你会重重地敲击别人的家门吗？或者使用他们的俚语？亦或是自吹自擂？果不是这样，那么就让你的广告符合你个人的标准，因为他们代表着你。


    # **37. 品行**


    我们生活的时间越长，我们的观点越广泛，我们就越是依赖我们的品行。任何表面上看起来的成功如果没有品质的话，'
