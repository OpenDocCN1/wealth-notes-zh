- pgno: 152
  md: '# 固特异牌轮胎的故事


    我们已经发明了一款不会损坏轮辋的轮胎——叫做“固特异牌无损轮辋轮胎”。迄今为止，我们已经卖出了 50 多万条这种轮胎。


    今年——以一个平等的价格——64 位主要的汽车制造商已经与我们签订合同，要使用固特异牌元损轮辋轮胎。其巨大需求与一般的模型轮胎相差悬殊。


    为了适应所有规格的轮辋，我们将这种轮胎的尺寸做大了 10%，我们将普通轮胎的英里数增加了 25%——而要价不变。


    数百万人之所以对其趋之若鹜，是因为它能够瞬时为他们节省很多钱。然而，在这些背后，却是 12 年的轮胎制造过程——发明、试验以及无数的测试。


    由于这些特点，我们的轮胎销售额在去年达到了以前的三倍——一跃为 850 万美元。然而，就是这些专利的轮胎，在一年中的大部分时间里，其售价都只比其它规格的轮胎贵
    20%。


    为了您能更好地判断自己对轮胎的需要，请允许我们带您了解一下它们。


    # 首创


    12 年前，汽车轮胎成为一个新的、并且是最困难的问题。


    我们能够拿来作为参考的，就只有从制造自行车轮胎中所学习到的东西。


    那个时候，世界上并没有“可快速拆卸轮辋”这种东西。因此，轮胎制造商们采用了一种模型轮胎，它可以延展到一个上下连在一起的轮辋。直到“可快速拆卸轮辋”，出现——将如今标准规格的轮胎改进为无损轮辋轮胎成为可能——他们才将它们与过去的那种构造结合到一起。最后制造出来的轮胎，如果对其行进部分或者全部放气，它的轮辋就会毁掉。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '这只是我们打算解决的难题之一。而另一个难题是：要找到耐磨胎面的限度。还有一个难题，是将轮胎扎破的危险降至最低。


    在构造、编织和缠绕、规则和硬化方法中，张力成为各种难题。而这一切都要通过调查和试验来解决。


    # 专家帮助


    我们轮胎的结构是多年来人们在橡胶业务中实战经验的结晶。它们都是在实验室、试验和测试部门的帮助下才研究出来的，全部都是经由专业的化学家国内最好的技术学校的工程师们之手的。这些人用其毕生的精力，投入到轮胎难题的解决中。


    # 测试轮胎


    为了证明他们的想法—相互之 1 司进行比较—我们发明了一个轮胎测试机器。


    这个机器一次可以测试四个轮胎。它通过将这些轮胎刺破来测试它们—通过缠绕和拉紧—通过激发各种极端条件。并且用表记录英里数。


    为了选出耐磨胎面，这里测试了四十种不同的方式。大概对 200 种不同的布料进行了比较。并且还测试使用了每一种编织、缠绕和硬化的方法。


    最后得出的结论是最好的。


    所有竞争的轮胎都被我们自己并排用这个相同的机器来进行测试的。


