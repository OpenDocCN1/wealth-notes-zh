- pgno: 288
  md: '# **31. 退換**


    这是一个老式的规则，仍保留了一些法律上的认可。但不幸的是，出售服务和产品的人今天却让买家自己承担风险。


    现代商业不是斗智的战场。它只是提供一种服务，并保证信守承诺。商品在包退包换的原则上进行交易。而且，服务可以像货物一样被回收利用。


    销售诱因是所有隐含的抵押物。而失败的一点是作弊。给予顾客他们期望的，我们从中赚取利润。而且，这是理所当然的事。


    信誉只能来自于一些措施。在你的行业、我的行业以及所有的行业，很少有人能够迅速崛起。我们本能地在那些能够迅速崛起的人当中寻找优秀的服务。


    他们证明他们能够提供这样的服务。这是巨大的吸引力。这证明了许多人在那里感到了独一无二的满意程度。这也证明了顾客会在那里逗留。而且，他们的结论已经成为代言。买家知道他们不需要当心受骗。这不是我们说的，而是顾客们说的，这最终恢复了我们的信誉。而且，令人头疼的问题也已经被解决了。


    # **32. 时间**


    在对时间的评估中，你要将每个办公时间乘以 10。正常情况下，每工作一小时需要一小时的睡眠和一个小时的娱乐活动。


    作六天需要一天时间的休息。在我们拥有力量之前需要经过多年的全面准备。


    因此，如果全盛时期的～小时，作为一种商业资产，你至少要十个小时的生活时间。如此思考时间，你便是一个随意的人。


    你让事情滞后；你浪费了无数的时间来做比你能力强的人'
