  md: '# 2、克劳德·霍普金斯遵循的41则信条


    这是在广告和商业成功的41条黄金法则，成为罗德暨托马斯广告公司整个团队遵循的法则，让罗德暨托马斯广告公司一路领先。


    如果你从来没有读过这些内容，那么你会从阅读中获益匪浅。而且，单单这些信条就值你购买本书的钱。


    下面就是霍普金斯和罗德暨托马斯公司全体员工都遵循的信条：


    # 1. 夸张手法


    那些时常能提出建设性意见的人，往往懂得过犹不及的道理，因而总能拿捏好事情的尺度。但是，也总有一些人跟着感觉走，认为把产品吹得越神乎其神便越好。


    于是乎，广告中充斥着各种描述产品好处的形容词。结果呢？漫天的吹捧反而增加了消费者对于产品的不信任，越使劲想要拉拢消费者，反而越受到消费者的抵触。也许，有些商品在同类产品中确实出类拔萃，以至于给予其再多的褒扬都无法诉尽其好。但是，要想顾客能一下子接受这么多讯息，是相当困难的。尤其处在这个世俗的社会，要想消费者都能相信你的宣传那更是难上加难。


    因而，剑走偏锋采取！腔有的谦逊态度，往往能瞬间引起消费者的注意，从而达到所期望的销售目标。而在广告中进行各种天花舌坠的描述，往往会让消费者产生一种这是因为你销售困难的错觉。


    还记得“摩根＆赖特轮胎，好轮胎”这句广告语，是怎样在诸多对产品进行夸夸其谈的广告中脱颖而出的吗？所以，没有什么广告能比直接说出产品功能的广告更有效了。譬如，你'
