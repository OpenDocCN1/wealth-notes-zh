  md: '# 3、一切从这里开始


    1904 年 5 月的一个晚上，前加拿大皇家骑警约翰·E·肯尼迪给治德暨托马斯广告公司的主管寄去了一张留言条，便条大意是：


    “我现在正在楼下的大厅，我能告诉你们广告是什么。我相信们并不知道，让你们知道广告是什么，对我意义重大，对你们同样意义重大。如果你们想知道，就让门童捎个话来。约翰·E·肯尼迪。”


    当时治德暨托马斯广告公司的主管安布罗斯·托马斯傲慢地忽略了这张留言条。然而，他年轻的合伙人间尔伯特·拉斯克尔却发现了这张便条并想了解更多的信息。


    这是拉斯克尔的回复：“让我们见一见!”


    拉斯克尔见到肯尼迪的第···个晚上，肯尼迪所说的话改变了广告业的整个面貌，即便是在今天依然适用。


    肯尼迪说：“广告就是纸上推销术。”他对广告的定义时到今日也没人比他定义得更好。


    而对于广告、网站、简报、宣传手册、新闻稿、或者是与顾客面对面地沟通，他们之间并没有什么不同。


    而且，想要成功地通过纸质印刷物进行营销，你就必须学习和研究其他人是如何以此为生的，不论是以前还是现在。98%的市场营销人员对如何通过纸质印刷物进行销售几乎是一无所知。


    因此，要向直接营销人员学习。他们是唯一能够证明什么才是有效的人直接营销，就是直接让潜在客户或客户立即产生回应的营销。


    不用销售人员销售产品的方法。这种方法始终是可以被衡'
