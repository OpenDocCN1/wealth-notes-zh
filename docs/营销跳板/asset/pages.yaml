    # 公司的名称和商标不是标题


    一般而言，这是最常见的广告错误之一——当然也是广告商 们所犯的最大错误。翻翻日报或某些杂志，你很快便会发现， 依旧没弄明白怎么回事的广告商还在继续使用他的公司名称作
    为一则广告的标题。


