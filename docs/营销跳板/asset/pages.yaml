  md: '# 序言 一些不为人知的故事


    经常有人问我：“你是从哪里学习到如何撰写有效的销售信的呢？你又是如何发现怎样撰写有效广告的呢？”


    而我对此的答案一直都是相同的。那就是：从阅读克劳德·霍普金斯撰写的《科学的广告+我的广告生涯》开始。


    那么，克劳德·霍普金斯到底是谁呢？


    克劳德·霍普金斯（1866—1932），被公认为有史以来最伟大的广告文案撰稿人，他为众多广告客户工作过，在洛德暨托马斯广告公司工作了17年，其中7年，也就是在第一次世界大战中以及战后，他曾任该公司总裁。


    他出生在美国密歇根州，是一位牧师的儿子。在他9岁的时候，父亲就去世了，从而使这个家庭陷入困境。他只好跟妈妈相依为命，并开始做一些零工来维持家庭的日常开销。他每天在同学们来到学校之前，都要“打开两间教室的门，把火生好，并拂去所有座位上的灰尘”。而在放学之后，他还要打扫教室的地板，并且要在晚餐前将《底特律新闻晚报》分发到每个家庭。


    在霍普金斯10岁的时候，他挨家挨户去兜揽生意、推销书籍、以及采集水果。当时，他们母子俩做的事情之一就是：制作银器亮光膏。他们将它做成块状，包装好，在小霍普金斯放学之后去外面卖这种银器亮光膏。


    当他在人家的门口跟一位家庭主妇只介绍和谈论这十亮光膏的时候，人们的兴趣并不大，通常10个人中只有1个人会买。但是，当他进到人家的厨房中，通过亮光膏清洁一些餐具的时候，90%的情况下都能卖出去。正是这次经历教会了霍普金斯，应该演示和试用产品，用产品自身的效果来说话。


    从那以后，霍普金斯向人们免费提供的试用品恐怕比其他任何人 都要多。他认为，开展一项无样品试用的广告宣传活动，与在马路上推销商品（或者挨家挨户去兜售自己的商品）而不赠'
  merge: -1
  img_proc: true
- pgno: 2
  md: '送样品的效果没什么两样。


    通过不断的销售实践，后来霍普金斯了解到，当别人不要求你提供样品的时候，你非要免费赠送给人家，结果往往会适得其反，还不如不送。因为，这样做会贬低你自己的产品，使受众变得不尊重它。


    因此，除非人们要求，否则洲门绝不要提供免费的样品。我们要将自己的样品免费提供给那些了解我们，并且有足够的兴趣索要的人。


    霍普金斯通常会提供与原产品一样大小的试用装，这种试用的方式并不会贬低他的产品。他会从经销商那里购买包装，支付一定的金额。这样一来人们的心理会产生巨大的不同。要让人们花钱购买曾经免费过的东西是很困难的。但是，要在购买产品、支付订金之后才能试用，这样可能会使人更容易接受。当然了，你的产品必须非常好，否则你就不能这样去做了。


    在霍普金斯 20 岁的时候，他为很多零售商们撰写广告。当时铝制品突然开始流行起来。于是他专门研究厂一下，因为他觉得每个家庭都应该会用到它，但是却很少有家庭拥有这些东西。在很多商家投放邀请女性参加铝制品展览的广告后，并没有带来多少回应，而且花费却很高。


    然而，当霍普金斯试着额外提供一种赠品的时候，很快便得到了人们的回应。相对于广告而言，他在每个访问者身上所节省下来的开支，是赠品价格的 20 倍。后来，他把这个计划提供给各地的铝制品经销商，从而创造了他在广告界的第一次成功。


    霍普金斯在很多领域都使用过这种策略。他刁二再对女性顾客说“任何时光临都可以”，而是设定一个具体的时间，要求大家必须在某个星期、某一天、甚至是某时某刻之前购买。他会在广告中附印一张提示卡，以便女性顾客剪下来，这样的话她就不会忘记了。


    为了保证人们能够注意到他的产品，他经常会提供一些小礼物或者刺激物。这样做可以 reduce 他对每位访客的成本，并以'
  merge: -1
  img_proc: true
- pgno: 3
  md: '最低的费用得到人们快速决定购买的行为。


    后来霍普金斯又发现，在没有提前告知赠品是什么的情况下，效果达到了之前的四倍。相较于小礼物而言，人们的好奇心是更好的吸引要素。


    在他的晚年，这位广告天总结到，在穷困潦倒的环境中长大，对他而言反倒是一种福祉，因为他得到了更多的机会去和普通人交谈。在他当推销员时积累的经验，也为他日后做一名广告撰稿人奠定了基础。


    我们了解的有关使广告产生效果的一切，几乎都是来自于克劳德·霍普金斯。在克劳德·霍普金斯之后，我们学习到的有关广告和直接营销的基本原则，大部分都是按照克劳德·霍普金斯的理念而延伸出来的。


    大卫·奥格威，世界上最著名的广告公司“奥美广告公司”的创建者，就是伟大的霍普金斯的一位学生。


    奥格威说：如果不把《科学的广告》阅读7遍，任何人都不应该去做广告。这本书彻底改变了我的生命历程。”


    因此，一定要听从奥格威的建议，阅读《科学的广告》至少7遍。我有一个特别的观点，就是每年都要阅读一遍这本经典之作。并且还要阅读霍普金斯的自传《我的广告生涯》。


    但是，或许比阅读霍普金斯的著作更加有用的，是研究学习他的是的，要研究他实际撰写的广告。盖瑞·亥尔波特告诉他的儿子，一定要把找到的经典广告抄写下来。


    为什么要这样做呢？


    当你真正抄写一篇优秀的广告文案的时候，其中的词句、整体效果，以及句子的结构，和广告中表达信息的顺序，这些每个细节都会变成你头脑中的一部分。


    霍普金斯说：“撰写杰出的广告和销售信是一件辛苦的工作。不知情的读者若是了解一则广告中所涉及到的工作量的话，一定会很吃惊的。有的时候，它需要数周·的工作。广告看起来'
  merge: -1
  img_proc: true
- pgno: 4
  md: '来是如此简单，而它一定要做得特别简单，从而来吸引到简单的人们。


    但是，在广告的背后，却蕴含着大量的数据、信息、以及数月时间的调查研究。懒惰的人是没有办法在这个领域立住脚的。"每则成功的广告都是经过大量测试，验证后才获得的。虽然，时代再变，但人性永远不会改变。


    霍普金斯的每一则广告都是按照人性的角度来策划和撰写的。他所撰写的每则广告是真正的实践版，是指的我们用心来学习的。


    霍普金斯 的观点是，想要把东西卖出去，必须真正的了解你的消费者想要的是什么。广告人不能每天只是坐在写字楼里和那些富有的高层阶级的人们讨论，而应该深入大众，与老百姓打交道，去了解人性，并从最根本的人性出发，作出朴素的发自善良的
    本质的爱心和理解的诉求。


    我发现现在很多广告都有着极妙的创意和华丽的制作，让人过目难忘。但是并没有为商家作出什么贡献。我是记住了这个广告，但我没有记住这个商品，即使我记住了这个商品，我也没有打算要去买你的商品，虽然你的广告确实很华丽。这难道不是广告界的一个普遍现象？许多创意人员只为了取悦自己，创作出一些漂亮的空架子，殊不知广告根本的作用是为了卖出商品赢得利润，而不是娱乐大众。


    通过5年多的时间，我才把霍普金斯的大部分经典广告收集到了一起。并且通过两年的时间才制成了中文。毕竟这些广告已有100多年的历史，有的文字模糊不清，在我翻译共同努力下，一字一句修正更改，查阅相关资料，才完成了这部全球唯一最完整解读克劳德·霍普金斯经典广告一书。


    如今，大部分的商业人士和广告商们都已经忘记了（或者从来都没有学到过）霍普金斯所发现的和教给我们的大部分内容。实际上，现在所有的广告营销界的大师们都依旧在研究学习克劳德·霍普金斯的经典广告。现在你也有机会领略这位广告鼻祖的风采。祝你成功。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 1、广告之旅


    在你继续往下阅读之前，我想有必要快速给你介绍一下美国广告发展史，这样可以帮助你彻底了解克劳德·霍普金斯。


    正如我们所知道的那样，广告大概在1904年开始走向繁荣，在那时约翰·E·肯尼迪向世界给出了广告的定义：“广告是纸上推销术”。此后，很多人尝试着给广告下定义，但没有一个定义能超过肯尼迪的概括。


    现代广告开始出现要比肯尼迪时期早几年，那时查理德·西尔斯制作了第一个邮购目录（大约在1892年）。这份目录包括数百页的产品介绍，而且每个产品都有自己的销售文案。如今美国西尔斯罗巴克公司依然在茁壮成长。


    在这一时期，广告公司在世界各地开始涌现。他们雇佣和训练的人给我们留下了很多宝贵的财富，如今所有的顶级营销高手都将在这些财富收集在他们的资源库中，并且将他们作为自己的优势使用。


    就在肯尼迪出现在人们的视野中不久，克劳德·霍普金斯随之出现。他给我们留下了一份遗产，我们应该永远感谢他的这一馈赠。他是市场测试、抽样调查，零风险保证和优惠券的先行者，而且还开创了很多其他的东四。


    在上个世纪，还有很多其他的广告人物，包括沃尔特·迪尔·斯科特、麦克斯韦·沙克海姆、哈尔德曼·朱利叶斯、约翰·卡普尔斯等，暂时先列举这四个人。


    然后，在上世纪中期这样的天才比如埃尔默·惠勒、罗伯特·科利尔和其他同时代的人都烙下了属于他们的印记。他们大部分的作品，你都能在这一时期找到。战后，广告大师大卫·奥格威乔乔·卡伯也树了自己的里程碑。还有当今的传奇人物杰·亚伯拉罕、盖瑞·尔波特（2007年4月8日去世）、丹·肯尼迪和泰惠·尼古拉斯，他们不仅使自己成为了亿万富翁，而且还造就了很其他的亿万富翁。'
  merge: -1
