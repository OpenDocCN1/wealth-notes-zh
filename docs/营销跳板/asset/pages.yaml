- pgno: 254
  md: '如果某种独一无二的好处向潜在客户承诺了一些他们非常想要得到、但是 在其它任何地方都得不到的东西，那么这种好处一定会吸引受众们的注意力。


    标题的另外一个重要的功能是：直接定位你最想要争取到的潜在客户群体。当一双眼睛瞥过你的标题的时候，它应该传达出这样的内容：


    “就是您，先生！这是专门为您准备的。”


    “不是您，先生。您不会喜欢这个的。请离开。”


    “女士，您肯定会喜欢这个。它太适合您了。”


    “请留步！如果您不看看这个，那么您会后悔一辈子的。”


    如果你的目标受众是砖匠，而你发表的文章会被整个建筑业阅读到，那么，你就需要指明，你的消息是专门针对砖匠的。这样的话，当一位砖匠瞥到你的广告时，应该就会立刻认识到，这则广告是为他撰写的，并且只为他撰写。


    你的标题应该向潜在客户承诺一种强大的好处。


    那才是你的读者唯一关心的事情。要向他们承诺特定的、独一无二的、强有利的利益，从而激起他们内心最深处的欲望，或者致力于解决他们最痛苦、最焦虑之事。这是每一位潜在顾客都想要的事情：满足愿望，或者解决痛苦。在标题中向他们承诺此内容，他们便会更加留意和愿意接受你呈现的东西。


    这就是在销售过程中，你要先列出特征，接着是好处，然后是标题的原因。


    在你开始撰写标题这个步骤之前，尽可能多地确定一些重要特征和好处是明智之举。这样做之后，会使你拥有一些强大的弹药。好处对于潜在客户有着神奇的吸引力：好处越大越多，吸引力便越强。


    标题，就是要传达出你最强大的好处，就是要通过新的、认真构思过的、快速而又简便的解决方案，来解决令你的潜在客户不安的问题。因为我们都对获得利益感兴趣。所以，你的标题中就应该强调你的目标市场非常想要的、具体的好处。'
