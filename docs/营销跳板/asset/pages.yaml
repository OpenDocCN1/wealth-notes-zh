- pgno: 253
  md: '# 为何标题如此重要？


    如果读者觉得标题看起来很有意思，那么他们就有继续阅读的可能。而那正是你想要他们做的事情。如果你希望读者能够采取得行动，那么，你就一定要使他们阅读你的销售信件。


    要想使你的标题从～开始就能够吸引住受众，那么它就必须要在某种程度上触动潜在客户，立刻激起他们的兴趣。为了向你的潜在客户传递出重要的具体信息，你要使他们将注意力集中在“自身利益”的事情上，这样才能提供有价值的服务。


    你的标题便是吸引那些饥渴的潜在客户阅读你的广告。它把目标受众非常感兴趣的一些东西放在他们面前，这样他们就非常有可能会注意到。


    标题对于潜在客户的吸引力，就像糖果对于孩子的吸引力一样。如果吸引力足够大，那么它就能吸引到大量的读者。而如果标题中的承诺或者提供的东西不够吸引人的话，那么潜在客户也就不会有兴趣看文章里面的内容了。


    > “它们不仅可以吸引读者的注意力，激发他们进一步阅读，并且，它们还能够以一种诱人的方式——向读者透露，接下来的内容将会是什么。”


    “没有什么比一则好标题更加强大。它是一种真正的销售工具——打开销售之门，使销售过程得以开始。”——肯·苏沃，《如何创作赚钱指南，在一年中的业余时间赚取 10
    万美元》一书的作者如是说。


    你要用最有优势或最值得注意的声明或好处来赢得受众的关注。


    你的产品或服务能做哪些人不能做到的事情呢？是什么使你的产品更有价值、更特别或者独一无二？你能提供的最大好处是什么？'
