    高压之下的流通蒸汽常常会把烤箱加热，但是我们却碰不到里面的豆子。


    因此，我们在 245 度的高温下进行烘烤．但是，我们不会将豆子烤碎或者烤爆．


    使用家庭烤箱烘烤出来的豆子是非常难以消化的．人们无法承受它在体内燃烧产生的那种热量。


