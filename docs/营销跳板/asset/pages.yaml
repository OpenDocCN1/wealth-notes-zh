  img_proc: true
- pgno: 228
  md: '# 这是我们给新广告商的建议


    让我们先判断您的产品有无潜力。让我们为您派去一名代理。然后通过他，把您的问题提交给我们的咨询委员会。


    该服务免费，不含任何支出。而我们会充分利用紫的经验和判断力，给出最好的建议。


    不要说，您的业务无法扩大。听听广告业中最专业人士的意见。


    *       *       *


    我们的咨询委员会可能会告诉您不要投放广告，也可能告诉您先做个试验。


    如果他们建议后者，他们会说出原由。他们会告诉您具体试验点和方式。


    他们会提出费用尽可能小的建议，并告诉您数额。然后，由您亲自决定。


    如果您接受他们的建议，我们可能会从文案部选派一位工作人员，去拜访您。他会从消费者的角度评价您的业务。


    他会从您顾客的立场出发，尽力做出最全面的评价。


    有时，没必要这么做。这取决于您的业务。但是，处在卖家立场上的人，很少能完全从买家的立场看待问题。


    没有广告经验的人，很少能挑出其中的重要点。所以，我们经常会派遣经验丰富的人，去审视买家的立场。


    *       *       *


    这个人会向我们在纽约或芝加哥的咨询委员会汇报。然后，委员会对问题展开讨论，直到得出结论。'
  merge: -1
  img_proc: true
- pgno: 229
  md: '他们决定销售计划、方法和广告文案。决定他们需要您给予哪些帮助。


    然后，最适合那一特定产品的人会被指派，去撰写广告。


    如果是只有产品，我们会为您准备跟进系统。这至关重要。


    我们可能会对所需的信函和手册收取一定的费用。但是我们其他所有服务，文案、方案、时间、建议和交通费都由平常的佣金来支付。


    所以，我们在试验广告上的花费，将远远超过收入。因此，您的利益和我们的利益是一致的。如果我们不能为您带来利润？那么我们也无法获利。


    我们的利润仅仅来源于您的扩展。而在我们使广告产生效果之前，您是扩大投入的。


    所以，您尽管放心，我们会尽全力使广告取得成功。


    我们每年用这种方式，为大量的新广告商赚取巨额财富。


    # 这是我们给老广告商的建议


    让我们为您派去一位代理。


    通过他，把您的业务提交给我们的咨询委员会。


    告诉他们您的看法，您目前的广告效果。如果可能的话，说出其中的不足。'
