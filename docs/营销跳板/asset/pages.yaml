    霍普金斯直到他必须了解啤酒制作工艺的整个过程, 如果不对销售的产品信息有一个全面的了解, 是根本不可能将其销售出去的。


    所以他特意到威斯康星洲参观他们的啤酒厂。在哪里他看到了在平板玻璃屋中啤酒从管道里滴下来。他被告知, 这些平板玻璃屋中充满了过滤的空气, 因此啤酒可以在无杂质的玻璃中保持冷却的状态。


    接下来, 他看到装满白木浆的巨大而又昂贵的过滤器, 这种过滤器能够提供高级的过滤流程。制造商解释了如何一天清洗两次水泵和管道已保证啤酒的纯度。此外, 在装啤酒之前,
    每一个瓶子杀菌消毒不止一次或是两次, 而是四次。


    喜立滋啤酒工厂正好坐落在密歇根湖畔, 那时候密歇根还没有被污染, 可以提供清洁的用水。但是, 喜立滋并没有使用密歇根湖里的水, 而是从 4000 英尺的自流井中取水,
