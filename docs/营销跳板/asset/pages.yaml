  md: '与其向顾客喋喋不休地陈述，某产品如何能够在水中漂浮，还不如直接用几个简单的字来进行说明：该产品能在水中漂浮。


    # 2. 好脾气


    在销售货物的过程中，不管是面对面还是其他方式，脾气好是一个基本的要求。从不攻击竞争对手；从不表现得无礼、没有教养；从不抱怨失败。


    做业务要和打高尔夫球一样，永远做一个有教养的绅士、做一个良好的公民。保持高效，并看准你的机遇。使每一次尝试都能做到极致。但要公平对待你的竞争对手，遵守“游戏规则”，（竞争规则）。


    如果你看到一个机会，有时会在对手的帮助下抓住这一机遇。


    要为大师级的手法喝彩。展现一个阳光、开朗的心态。总是做一个能输得起的人。一个从容自如的举止暗示着保留能力。对于轻松的观众来说，面带微笑的人似乎是胜利者。人们购买更多的东西是因为他们喜欢那个推销员而不是思维逻辑使他们购买。


    # 3. 服务


    所有的商业业务都值得花费时间和精力去做，并能经久不衰，这一切都基于优质的服务。


    在原始的商业交往中，一个人种植玉米，另一个人捕猎毛皮。然后他们用以物易物的方式交换彼此的劳动产品。其基本原则是：


    “你为我工作，我为你工作”。而且，这一原则从未改变。当今，有人学习医学、法律、或是广告；有人制造汽车、做衣服或是生产食物。但事实上他们都是在出售服务。


    人们购买的不只是思想、卡车或是衣服，他们实际上购买的是一种特定需求的服务并为其他类型的服务买单。回避这一点的人将会面临失败。一个懂得付出的人终会超越吝于付出的人。'
