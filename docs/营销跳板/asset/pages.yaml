  md: '表着彼此。


    这样做的结果是绝对的信赖。


    试想一下这意味着将拥有平等的信誉来增加产品的销售量。类似的方法也可以实现这一结果。给予你的对手他们应得的。接受你的顾客的观点。阐述顾客感兴趣的问题时，要面面俱到。给予赞美也要给出批评，列举优势时也不忘点明其不足之处。让你的公平型得显而易见。


    人们期望赞美之词。自我批评使他们感到j惊奇。更多的时候要做一个法官而非律师。我们知道有些人会大声惊呼：“什么？让付钱来列举我的商品的缺点！”是的，你会支付的。这不是利他主义，因为这会增加你的赞美之词的分量。而且，那些自以为能够隐藏其不良行为的人充其量就是在愚弄自己罢子。


    # 29. 气氛


    在任何代表高素养的东西周围，都会产生一种充满声望的气氛。有时这种气氛会越来越热烈直到惠顾似乎成为了一种特权。对于个人来说，这种气氛增强了每句话和每个行动的有效性。


    在广告当中，由我们所说的气氛产生的作用被赋予了某一产品。而且，这是其最珍贵的资产。然而，信誉是无形的而且是不稳定的，它很容易被破坏。


    如果一个人没有做到名副其实，那么积累起来的信誉会在一夜之间土崩瓦解。一个人仅仅用一个行为就可能导致积年累月形成的光环黯然失色。而且，一个做广告的人对于他的作品也是如此。数千则广告形成的整个气氛可能会被某个单一的广告改变。


    一个公之于众的毫无价值的想法已经把很多慢慢建立起来的建筑物夷为平地。任何表明你自己缺乏尊重的事情都会使你丧失顾客对你的尊重。'
