    要加上副标题、解释性文本、销售论据、故事；还要加上过渡性的文本，从而将读者从一个段落吸引到下一个段落，从一个章节吸引到下一个章节，从一页内容吸引到下一页内容，直到他们迫不及待地想要订购单为止。


    使用图解的表现方式，从而使你的子弹清单具有多样性。你可以每隔一个子弹文本就更换～下字体、进行加粗，对关键的子弹变换一下颜色。你可以将一组一组的子弹放在图解框中。在一组组子弹的上面和下面变换一下空格的数量。而对于某些子弹文本，无需使用任何图解框。


    全部使用好的。你已经充分研究了你的产品，你的市场，你；竞争对手。每一个重要的特征，你的产品或服务。你把每个特征都转换成了一堆强大的好处。然后，你把前几个重量级的好处创作出不同的标题类型，并测试各种各样的方法将那种好处提供给你的读者。


    最后，在撰写子弹要点的时候也是一样，你创作了一大堆充满力量的子弹，向你的潜在客户展示出很多他们无法抗拒的好处，从而使他们很迫不及待地去填写订购表（或者点击订购按钮）。


    而到现在为止，你的广告或者销售信还没有写一个字呢！这个工作量很大，不是吗？'
