    培养对你引以为生的行业的尊重以及对创立这一行业的人的尊重。决不诋毁你的竞争对手。相反，要向有才干对手学习，并赞扬他们的事迹和功绩。为他们是伙伴而感到骄傲。


    你自己的重要性会因有一个伟大背景而提升。除非你所在的整个行业受到骚扰，否则不要出风头。没有人会怀疑一个与其毫无共同特点的同事。时刻记得曾经扒粪运动是如何让美国商界暗无天日。少数被攻击的企业将会被人们用来代表整个行业。无辜的企业和罪有应得的企业遭受一样的责骂。不要让同样的灾难降临到你所在的充满信心行业。这一原则在广告行业中是完全有效的。


    注意它的奇妙的增长，标记它所发挥出来的能量。考虑一下最有才干的人是如何去尊重这一原则的。想一想有多少重大的事件都是致力于对它的维护。你过去没有使它成为现在的样子。一万个人和你一起工作。而且，每一个诋毁他人的人变成了彼此的敌人。


    用一言一行来维护那无价的威望。为了增加整个行业的威严尽你的一份力量。众所周知，罗马非一日建成。然而，我们也明白它却能在夜之间燃为灰烬。


    # 11. 信任


    在那些有可能会减少人们对它的信任的广告中不要做任何事情，因为信任是我们的无价的财产。'
