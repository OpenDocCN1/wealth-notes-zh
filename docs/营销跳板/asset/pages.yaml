  md: '固。办公室的勤杂工和官员可能是同样地重要。因为你的未来队长应该是由一级一级地成长起来的。成熟的大人物很难轻易得到。你的广告领导者尤为重要。拥有百万人的你的地方取决于他们。但是，令人高兴的是，很容易选到正确的人。—一个错误是不可原谅的。


    每位广告大师在每一个阶段都会留下不可磨灭的印记。你只有去查询这些印记。平庸之才行走在大街上看起来也很像是有才能的人。但是，如果你仅凭第一印象判断一个人，那么这就是你自己的错误。


    在有广泛利害关系的广告行业中，要谨防那些能力未被证实的人。在罗德暨托马斯广告公司，我们所有的技能在经过筛选之后，五十个未被证实的人当中也海会有一个人证明是一个大师。能为你做大事的人已经在其他地方重复地做过这些事情。不要试图由你自己来衡量他们。要向雇佣过他们的人请教。要向你所知道的最伟大的成功者们请教，询问他们的领导者是谁。因为，一定程度上，他们是有保证的人。


    # 15. 自信


    在所有凭技艺取胜的行业当中，你都要充分发挥自信的价值。有时你做得很顺手，有时会很糟糕，这一切都归因于心理态度。


    “不雨则已，雨则倾盆”和“祸不单行”这两句名言简单地表明在人的头脑中厄运孕育着厄运。


    有些人养成了成功的习惯，并且所有的事情都按照他们的想法进行。其他人期待坏运气的降临，每每也如他们所愿。在商业中，我们称其为团队精神。在军队中，我们称其为士气。在任何智力比赛或是军备竞赛当中，它都是非常重要的。


    岁月本身并不能说明一个人的沉淀几何，事实是，许多人曾经那舍我其谁的绝对自信却渐渐地被时间消磨殆尽了。


    在招聘广告人员时要考虑这些因素。不要厌恶由经验产生'
