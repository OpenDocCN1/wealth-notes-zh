  md: '# 您的方式


    您使用家庭烤箱来烘烤豆子。


    最高热量是 200 度。在烘烤菜肴的中间，它的实际热量大概是 100 度。


    要分解豆子的内部纤维，是要求一定高度的热量，而您无法提供这种热量。


    因此您在家烘烤出来的豆子便是一种油腻的食物，很难消化。


    您是通过干热来烘烤豆子的。


    这样烘烤出来的豆子，最上面的都会碎掉，而中间部分的豆子甚至都烤不到一半熟的程度。


    您把豆子的外表皮都烤裂了，以至于烤完之后的豆子是糊状的，而非酥状的。实际上，每颗豆子都应该是完整的。


    之后，您添加了番茄酱。然后它就会成为一种调味品，而不是豆子的一部分。


    您要花费数小时的时间去浸泡、煮沸和烘烤，要消耗大量的燃料。


    这期间的麻烦会让人很讨厌。而最终做出来的食物对您来说却不是特别好。您觉得，一周做一次就足够了。


    但是这并非您的错。您只是缺少专业的设备罢了


    图(上左)'
