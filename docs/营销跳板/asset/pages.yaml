  md: '个结论，就是太大的字并不见得会有很好的回报。”


    “记住，当你把广告的字体放大一倍时，你也把你的版面放大了一倍。这条广告可能仍有利润，但是对结果的跟踪分析表明，你为销售付出了双倍价钱。”


    “图片只应该用来吸引那些能让你获得利润的人，只应该在同样大 4、的版面、但其诉求力超过文字描述时才使用。”


    “改变人们的习惯是非常昂贵的，涉及此类的项目应该慎重考虑。要想把剃须膏卖给俄国的农民，首先就要改变他们蓄须的习惯，成本是巨大的。”


    “产品本身就应该自己最好的推销员。我不是指单纯的产品，还包括产品给人的印象以及它所营造的氛围。由此，派发试用品就具有重要的意义了。无论要花多少钱，总体评估下来，这还是最低廉的销售手段。”


    “只把试用品送给感兴趣的人，只把它们送给那些用某种方式表达了自己兴趣的人，只把它们送给那些对你的宣传有所了解的人。首先要创造一种引起他们的重视、需求和期待的气氛。当人们处在这种情绪中时，你的试用品可以使他们确信你所承诺的产品质量。”


    “通过试用，几乎所有的问题都可以得到解答，而且廉价、迅速、准确。这也是解决问题应有的方式——不是围在一张桌子边争论。要把你的产品交给最终的评价者——你的产品的买主。”


    “一个人要想给别人留下印象，就得想办法从众人中脱颖而出，而且是用一种令人愉悦的方式……我们试图让每一个广告主都有得体的风格。我们让他与众不同，不是在外表上，而是在态度与格调上。我们赋予他一种最适合他所面向的顾客的个性……让一个人出名，就可以让他的产品出名。当我们宣传说，一个产品有了改良的时候，谈论他的改进者会加强效果……有个性的广告也可以像有个性的人一样赢得别人。”


    “任何时候，攻击对手都不是好的广告方式。不要指责别'
