- pgno: 159
  md: '这张图片展示了：固特异牌的无损伤钢轮轮胎过去适合标准轮辋，而现在用于可快速拆分的轮胎了。而在可卸胎器中也使用了相同的原理。


    制作固特异牌轮胎，是用于适应任何种类的轮辋的。我们将这种轮图图示出来，是因为全世界的新型汽车中几乎都是用的这种轮辋。


    注意：这种轮辋是凸起的，从而可以移动一一可以与无损轮辋的轮胎向后钩连在一起。该轮胎是倒圆的棱边，从而使其在任何情况下都不会发生轮辋切损。


    (图 3)


    这张图片展示了普通轮胎一模型轮胎是如何适应这种相同的轮辋的。这里的轮辋凸缘必须要放在里面钩住——从而抓住轮胎上面的挂钩，这些挂钩是非常必要的，有了它们，才能将一般的轮胎于轮辋连接在一起。


    请注意一下，当放气的时候，轮胎是如何面对轮辋凸缘的锐钩的。那便是引起轮辋切损的原因。一个漏气的轮胎通常情况下都会立刻坏掉。


    # # 不需要任何挂钩


    固特异牌的无损伤钢轮轮胎在其底部没有任何的挂钩，因为这些轮胎不需要与轮辋相钩连。原因在于：其轮胎底部有 126 根编织的钢琴钢丝，使其底部不可伸缩。只要您不移动凸缘的话，任何东西都不会使轮胎上的轮辋脱落下来。它非常安全，以至于根本就不需要任何轮胎螺栓——一个都不用。


    当轮胎充了气的时候，这些编织线就会收缩。之后轮胎所承受的 131 磅的压力会平均分配到每英尺的轮辋上。因此，它对于整个轮辋的压力不会太大。


    这便是挂钩并非必要的原因，也是您可以将轮辋凸缘去掉的原'
