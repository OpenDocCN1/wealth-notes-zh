    霍普金斯看到这些后，跟他的经理说：“他这样是卖不出去东西的，这本宣传册没有一个字能打动家庭主妇们来买。让我试试，我会 在 3 天之内交给你一本新的宣传册跟这个做个比较，我会根据我对问题的了解去写。”


