  md: '人的不足之处。最好的媒体是禁止这样做的。攻击绝不是好策略，它自私自利的目的太明显了，显得不公平，不符合竞争精神。如果你讨厌吹毛求疵的人，你自己就要表现得宽厚一些。"


    “展示事物光明、快乐且有吸引力的一面，而不是阴暗、冷漠的一面。展示美丽，而不是平庸，展示健康，而不是病态。不要展示你建议大家去除的皱纹，而要展示还没有出现皱纹的脸。你的顾客对皱纹已经很了解。”


    “采取‘使用前……，使用后……’的比较方式做广告，也是过去的笨办法。这样的广告方式除了展示矛盾，没有更多意义，不要受它们的影响也去展示事物阴暗抑郁的一面。”


    “销售信与广告一样，最重要的是让诉求对象立即行动起来，人生来就是会拖拖拉拉的。他们会延迟事情，而延迟的行为会导致忘记……促使顾客行动起来的方法有很多种，很少有哪种方法可以同时适用于两种产品，但原则是一致的；要趁热打铁，如果你能做到，就要让顾客当时做出决定，并让这个决定迅速得到实施。”'
