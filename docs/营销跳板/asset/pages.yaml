  md: '的一—无论它的辞藻多么华丽，或是提供的利益多么重要。这也正是具体的结果—由其他人或者通过实际测试所获得的实际数据和事实—如此有价值的原因。


    有一家企业，他们的销售代表（很多年前）一年可以赚3万美元。但是，当他们投放一则“年收入3万美元”标题的招聘广告时，没有一个人来应聘。而当他们把标题替换成“年收入1.5万美元”之后，便得到了很多合格的应聘人员。在那个时候，年收入3万美元是一个不可信的数字。而事实结果表明，他们所雇用的每一位销售代表，实际上那年的收入都超过了3万美元。


    你不仅仅要讲述事实，而且还必须做到可信。如果读者根本就不相信你的话，那么它是否属实也就不重要了，不是吗？


    # 承诺有用的信息


    什么内容可以使潜在客户在阅读标题之后想要继续往下看呢？除了满足好奇心之外，潜在客户也会被标题的承诺所吸引—承诺一种报酬。即阅读的报酬……在标题中承诺：读完之后，潜在客户将会学到什么。这样一来，他们才会将额外的时间和精力投入到继续阅读上。


    要向潜在客户提供信息，告诉他们，他们将会有什么。并向他们展示，怎样做到更好。与他们分享内部秘诀，提供一些小提示，有帮助的建议，或者透露一些有价值的、可用的信息。


    通常情况下，在标题中对你的产品所能提供的东西先透露一点点，能够吸引到更多的受众。一定要保证你的文案中会揭露你所承客户。


    # 只与一位读者对话


    人们很容易地就会想象到有~大群受众阅读自己的广告或者销售信。但是，不要那样想。实际上，你的标题每次只被一个人阅读。


