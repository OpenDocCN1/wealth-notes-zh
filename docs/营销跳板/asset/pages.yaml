  md: '# 27. 勤奋


    人的天赋对于成就大人物的作用比人们通常认为的要小。

    事实上，大多数大师尤其在其年轻的时候看起来是毫无前途可言的。（古代希腊的雄辩家）德摩斯梯尼曾是一个口吃者；（法兰西第一帝国皇帝）拿破仑曾是一个隐居者；（美国总统）林肯曾是一位劈木者。


    大部分的伟大人物的传记都是从最底层的成长环境写起。他们唯一可见的区别在于剩余的不利因素。他们的传记所体现出来的主要独特之处是无法抗拒的勤奋。和他们的同伴一样，他们用一天的时间完成了一天工作。然而，不同的是，他们将晚上抽出来当作另外一天。


    我们发现广告行业中亦是如此。天才往往是失败者。才华横溢的作家从未卖出过商品。身怀绝技的人由于过度自信而犯下错误。这一行业的悲剧是其无数的陨落的明星。留下来的的统治者是勤奋工作的人。


    当其他人在阳光下享受他们的短暂时光的时候，他们却在深夜的灯光下辛勤地工作。四十四年之后，我们这样分析：成功的唯一途径就是工作。付出双倍的努力来超越其他人。不管是教训还是经验，要和他们一样学习两次。没有人的大脑可以和在实际销售中取得的双倍经验相媲美。


    # 28. 诚实


    诚实本身不是显而现见的。而且，陌生人之间很难将其呈现出来。因此，那些一心想得到一个廉洁正直的声誉_的人必须积极努力地工作才能实现。


    在销售产品的过程中，保护自己声誉的一个方法就是坦率地面对正反两个方面。


    诚实的人在个人的交往中就是这么做的。“那是你应得的，这是我应得的”他们如是说。而且，他们以相同的方式代'
