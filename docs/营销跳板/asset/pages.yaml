    这种罐头的味道好像坚果——其中的豆子完全是酥状的，番茄酱——完全由成熟的番茄做成——拥有非常好析口感，吃过一瓶范·坎普牌罐头的人，就再也不会想吃其它的豆子了．无数的家庭主妇们都了解这一点。


    我们的主厨在烤豆子方面是没有任何竞争对手的。因此这道美味也使得我们的全部炊事人员为入知晓。


