  md: '# 附：克劳德·霍普金斯的经典名言


    “广告唯一的目的就是销售。它的原则就是推销的原则……这样的话，每个广告问题都应该根据推销员的标准来回答。”


    “优秀的广告人必须要懂得心理学。而且懂得得越多越好。他必须知道某些效应会导致某种反应，并利用这样的知识来提高效果，避免犯错。”


    “我们知道，好奇心是人类最强烈的动机之一……我们知道，价格低廉并不是最强大的吸引力……我们知道，人们主要是根据价格来进行判断的。普通大众不可能个个都是专家。”


    “心理作用是很重要的。拿出5个完全一样的产品，那么五个人中的每一个人可能会从中挑选出一 + 自己满意的。但是，如果你指出其中一个产品有某些特质值得大家注意，那么，这五个人就可能都会选择这一同一件产品。”


    “同一件事用不同的方法去做，收获会大不相同。在商业经验的宝藏中，我们必须找到最有效的方法。”


    “无论你用什么承诺去引起别人的注意，广告都应该讲述一个比较完整的故事。如果你注意这些承诺的实际效果，你会发现有一些诉求点远比别的更有说服力。但在一般情况下，有多个诉求点就会对更大一部分人有吸引力，因此，你就要在针对那部分人的每一个广告中表现所有这些诉求点。”


    “把广告本身当作推销员。让它自己证明自己。将它与其他的推销员进行比较。统计它的成本和收益。不接受‘好的推销员都没有提出’这样的借口。这样，你就不会犯太大的错误。”


    “很多人以为广告创意就是广告的全部。实际上，文字的水平对广告的重要程度与口才对推销术的重要程度是一样的……'
  merge: -1
  img_proc: true
- pgno: 297
  md: '因此，我们必须简短、清楚、有说服力地表达出他自己的观点，正如一位推销员必须要做到的那样。但是，过于精美的文案显然是不利的，就像独特的文风并不一定更吸引人一样。它们分散了读者对主题的关注，他们暴露了鱼钩。所有精心策划过的推销企图，如果暴露于表面，都会引起相应的抵触。


    “广告是多元化的推销术，推销员与一个顾客打交道，而广告则诉求于成千上万的人。一个推销员的失误并不会带来太大的损失，而一个广告失误造成的损失可能是上千倍的。因此，广告要更小心、更精确。”


    “在面对很多广告问题时，有一种很简单又很正确的思考方式。那就是，问问你自己，‘这样做会帮助一位推销员把商品卖出去吗？’‘如果我亲自见到购买者，这样做会帮助我把商品推销出去吗？’”


    “对任何一种产品，人们都不习惯阅读连续性的广告。这会比他们把一篇新闻报道或故事看上两遍的概率还要小。人们只需看一遍广告，就可以决定是否接受广告的诉求，根本不会看第二遍。所以，一旦你抓住了读者，就要把你所有重要的诉求点表现给他看。”


    “在一个广告活动中，我们会发现吸引人的事实，我们会继续保留它们。而对于其它那些不吸引入的事实，我们便会摒弃它们。我们通过标题中突出呈现不同的诉求来找出这些吸引人的事实。我们会发现：有的标题可以吸引很多人产生兴趣，而有的标题却几乎无人问津。于是我们便可以测量出吸引人的事情到底是什么了。”


    “广告与战争很像，会淘汰掉弱者。或者说，它更像象棋游戏。一我们通常都是要去占领他人的地盘，或者夺取他人的生意的。”


    “有的时候，在新的广告活动中，会出现命名的问题，这可能是最重要的问题。正确的名称本身往往就是一条广告，可以叙述一个相当完整的故事……通常情况下，名称是一种开门见山的展示。”


    298'
