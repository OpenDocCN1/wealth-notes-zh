- pgno: 206
  md: '一次报纸宣传的效果在 600 个城镇中可以得以证明，在 6 个城镇也可以证明。


    一则杂志广告的效果可以用 60 个刊物来证实，用 6 个刊物也可以做到


    不需要花费大笔资金，一个人就可以确切地知道广告的未来效果。


    *     *     *


    本书的目的在于提倡安全。


    它适合广告新手，也适合广告老手。


    对于一个广告公司来说，这个观点实在新颖。很明显，它和我们的利益相悖。


    我们的收入部分或全部来自发行商根据您的花费所支付给我们的佣金。


    但是，我们仍然建议您在不确定自己的决定是否正确之前，限制开支。


    我们主动研究并试验各利，宣传，这方面的花费可能是我们佣金的 10 倍。


    但是正确的事情终将流行开来。


    不管广告公司喜不喜欢，广告人们最终都将采取这一策略。


    拿我们来说，我们乐意采用它。我们的技能和知识使我们乐意承担后果。


    *     *     *


    所以，我们渴望告诉新的广告人，怎样做风险会最低。


    在他进一步扩展之前，怎样以绝对准确的方式测量他的可能性。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '怎样在刚刚迈出几步之时，知道那条路是通向财富还是失败。


    * * *


    所以，我们渴望告诉老广告人怎样扩展自己的领域。


    怎样实现最大的可能性，而且不用冒着失去自己已得的风险。


    怎样用同样的资金，赚取更多的利润。


    怎样在做成这几点时，不用承担任何风险或花销；不用动摇他


    的地位，也不用打断他现在的状态。


    * * *


    本书同时也适合那些尝试后以失败告终的人。


    适合那些可能误入歧途的人。那些因为别人的错误，而未能尝到属于自己的甜点的人。


    有一种方法可以证明错误归谁，您还是您的带路人。我们渴望告诉您这种方法。


    我们将为所有这些人，免费提供美国最优秀广告人的建议。


    我们将提供二十八位专家的咨询，他们多年来取得了辉煌的成


    就，也赢得了自己的～席之地。他们才华出众，现在每周的薪资高达 1000 美元。


    在我们决定您的产品还有发展潜力之前，您无需承担任何费用。


    那电就不会有相应的定期付款。不会有风险，除了试验广告所需的小笔开销.


    结果要么是微不足道的损失，要么是大笔的利润。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '如果这些内容吸引了您，我们请求您读完本书要说的所有内容。


    # 可能和不可能


    并不是每个产品都能被成功宣传出去。


    有些东西只有少数人需要。有些产品无法吸引顾客。


    有时，有些交易条件令人望而却步。


    而且，总是会有人性的因素。就连我们中最有经验的人，都无法始终预测到哪些事物即将流行。


    歌剧、戏剧、书籍是这样，商品也是这样。


    ★

    ★

    ★


    您能做的最好事情是，首先把问题交给我们的咨询委员会。在那里，许多资深的广告人将免费告诉您他们的意见。


    然后，如果他们决定支持它，把它交给几千名群众。在几个城镇或几个媒介上进行试验。并且全力以赴。


    如果几千人的消费高出您的支出，那就会有数百万人这样做。


    这毫无疑问。


    这代表的是人性和人类需求的平均水平。在全世界，没有什么比它更确定无疑的了。


    目前，有数千件商品没有做广告，它们还有成功的可能。'
  merge: -1
  img_proc: true
- pgno: 209
  md: '有数千件物品的销售都受到限制，如果得到合理宣传，就有产生巨大财富的潜力。


    有些是如此的畅销，它们的利润将会迅速增加，足以支付广告费用。不需要任何投资。


    还有许多其他商品，目前的广告做得很糟，它们的销量也有翻倍的可能。


    在这些方面获取合适建议的最好方法，是咨询我们的咨询委员会。


    * * *


    过去从来没有今天这么多的商品做广告，也从没有赚取过如此多的利润。今天宣传的产品种类是几年前的50倍。


    看看这些大大小小的产品。这些在10年前看似不可能的产品。


    一个幅员辽阔的国家，即使是最小的个人消费，总计后也可能是一大笔财富。


    这些获利颇丰的广告人中，许多人的成功都要归功于本公司。


    * * *


    广告的总体现酬从来没有今天这么优厚过。对知情人士来说，成功从来没有今天这么容易过。


    一个原因是，现在人们欣赏广告。有许许多多的优秀广告，已逐渐受到人们的尊敬。


    在媒介上花钱刊登“约翰·史密斯销售杂货食品‘’的日子结束了。


    如今的广告引人入胜，充满深意。他们根据人们的需求提供信息。'
  merge: -1
  img_proc: true
- pgno: 210
  md: '如今，人们首先会阅读…本杂志的后置页。对普通女性来说，

    一份报纸最有趣的部分是广告。


    如今，如果您的信息是人们所需要的，就不愁吸引不到读者。


    * * *


    然而，我们才刚刚开始意识到广告的潜力。每一年，每个月，我们完成着前所未有的任务。


    移民热潮被扭转。人们落户于新的区域。新的企业得到了资金支持。新的银行建了起来。


    公众舆论得到控制。新的口味层出不穷。潮流时尚也如雨后春笋。


    各种形式的邮购广告使上千地区之间的交易变得简单便捷。销售成本下降。销售人员也不再是必须之物。


    从某种意义上说，只要是人们需要的东西，没有几个不能通过广告成功售出。


    不过，由于广告无处不在，外行成功的几率微乎其微。


    在如此众多的优秀广告中，蹩脚广告则毫无效果。


    在这一领域，一个人可以影响数百万人。大量的机遇吸引了国内一些最优秀的人才。


    目前，广告业处处都是经验丰富的人、取得过杰出成就的人，训练有素的销售人员。


    面对这样的竞争，经验不足和平庸之才希望渺茫。


    冒险从事广告业的人，如果聪明，就会尽力聘请最好的人才。'
  merge: -1
  img_proc: true
- pgno: 211
  md: '成功太重要，不容许有任何闪失。


    # ## 平均法则


    广告业唯一绝对确定的事，是平均法则。就像人寿保险的计税基准那样，确定无疑。


    没有什么比一个人的生命更无法预料。没有什么比一千个人的生命更加确定。


    平均而言，一千位健康人士的寿命也非常固定，甚至可以拿数十亿美元做赌注。


    广告也是如此。


    一个人喜欢什么，想要什么，并不能作为什么标准。然而，如果通过一定的成本，引领一千个人消费某一数额，那就是必然之事。


    数百万人的做法也会和他们一样。


    ＊ ＊ ＊


    正因为如此，我们才建议现在某报纸上对 6 个城市进行试验。


    从不同的区域选出试验点。'
  merge: -1
  img_proc: true
- pgno: 212
  md: '要证明那一领域的广告效果，可能要花费几千美元。就算我们失败了，也不会损失一切。我们必然会达成一些交易。


    就算您有风险，也是微不足道。


    如果您发现自己的收入比支出多，数千城镇的人们将支付给您同样比例的金额。


    那么，这样说来，不管您的支出是多少，它都像在银行里一样安全。


    *   *   *


    如果是邮购广告，我们建议您使用几种不同的途径。


    其试验的费用将和报纸广告相差无几。


    您最糟会损失一部分成本，因为必然会有一些收益。


    这样，您可以检验自己追踪的每个数据。在某一限定区域内的询盘成本和询盘销售，和在大区域内一摸一样。


    如果您发现有利润，那就考虑一下您面前的这个领域。


    *   *   *


    同样，已经取得成功的广告人能验证挪门的服务对他的意义。


    如果您满足于现有的关系，没有必要去打断。如果您愿意，那就继续使用现有的方法，直到我们真正证明出我们的方法更胜一筹。


    但给我们几个城镇，几个途径。让我们出色的工作人员，在那个限定的区域内，展示他们能为您带来什么效果。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '看看他们能给您提供哪些创意点子。听听他们能发表哪些新颖观点。


    然后，把我们的效果和别的相比较。就让数据来决定谁更能胜任您的广告。


    *    *    *


    记住，您的风险不算什么。在我们的限定区域里，我们损失的可能性并不低于您。


    我们的风险很大。对我们来说，准备一次 6 个城镇的 广告宣传 和 6 千 个城镇的宣传，二者成本一样高。


    客户根据小额的费用支付给我们佣金。我们很可能为 了使胜 过您目前的工作，而花费十倍的佣金。


    您面临着无穷无尽的成功可能。


    假设我们可以向您展示，怎样使您的广告效果翻倍，就 像我们向数百人展示过的那样。


    想想这对您的未来意味着什么。


    *    *    *


    这是做广告的唯一正确途径。


    不根据人的主观进行判断。把问题交给您的潜在客户，让 他们投票。让这几千人来决定，那数百万人会怎样做。


    这样，当您扩大范围时，您对交易就会有绝对的把握。您 的资金就会安全，您的利润就会成为必然。


    这也是资深广告人在我们和其他人之间抉择的唯一方式。 了解您是否充分发掘潜力的唯一途径。


    广告领域处处都是杰出的咨询顾问。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 他们也会像我们这样进行争辩


    他们知道怎样鼓励您，怎样劝阻您。怎样反驳我们的辩论。怎样使自己的观点看似合理。


    只有一种方法可以决定。将该问题交给跟踪效果来决定。交给这个从不出错的“特别法庭”。


    成本很可能不算什么。法庭的判决将是终审判决。该结果可能会为您挖掘出新的机遇。


    * * *


    满足现状的广告人是不明智的。我们已经向很多人证明了这点。


    比如，一位广告人对一美元的单位回复成本很满足。我们把成本降到了 32 美分。每月的回复量为 10 万，就意味着每月可节省 68000 美元。


    一位首席广告人将利润翻两倍，并保持稳定增长后，就满足了。我们的一位工作人员接手一年后，该企业业务增长了 35 倍。


    这些都是些很极端的例子。但是，我们帮忙取得惊人效果的例子有数百个。


    也许您对广告的作用了解得不全面。也许您会惊讶于我们的专家为您带来的效果。


    215'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# 我们支付给广告文案作者的周薪是 1000 美元


    在我们的文案部，我们聘请的都是最有才干的人士，我们对该领域的全面认识可以确保我们做到这点。


    无可争议，我们的广告团队是美国最出色的。


    我们经过多年的努力，观察他们取得的杰出成就，才把他们选拔出来。


    只要出现非常成功的广告，我们就会寻找幕后的那位功臣。


    我们查询他的记录，了解他的才华还取得过哪些成功。或许，我们会观察他一段时间，让他的行为为他自己做证。


    当一个人始终展示出他获取非凡成果的能力时，我们往往会抓住他。不管我们必须要支付多高的薪酬。


    这样，凭着他丰富的经验，他很快就能在广告业中，充分发挥自己的才华。


    经过多年的这种努力，我们已经聚集了现存最优秀的广告文案团队。


    文案部为首的是克劳德·霍普金斯先生，我们的伙伴。


    他的周薪为 1000 美元，是广告业史上最高的。


    但是，霍普金斯先生帮助广告人赚的钱，宣传的产品，比其他任何广告文案作者都多。


    20 年来，数十个最伟大的成功都源自他的广告文案和计划。作为广告业的销售人员，他无可超越的地位至今无可厚非。


    现在，出自本公司的所有文案都要经过他的监督。他为所有人提供点子，制定方案，增加销售力。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '霍普金斯先生的第一个助手是纽约知名的罗伯特・约翰。


    * * *


    文案是广告的灵魂。


    众所周知，一则广告的效果可能是另一则的10倍，而成本却一样。


    对大多数媒介来说，整脚广告文案带来的利润少之又少。


    这就是文案部如此重要的原因。这就斥我们投入大笔资金的原因。


    我们的企业能否取得成功，仅仅取决于我们客户能否成功。他们大部分人开始时的支出很少。我们如今所有的最大客户，起初都只消费几千美元。


    我们必须使这些起初的支出得到回报，否则他们不会扩大投资。我们每赚取一美元，就必为广告者提高收入。


    所以，广告文案对我们双方都很重要。


    * * *


    每年，有数百万美元浪费在文案上，这本是毫无必要。


    这些文案的作者，连广告的基本原理都不知道。他们才疏学浅，经验匮乏。


    这种广告只有放在充满巨大几率的媒介上，才能有效。这只能证明，其中牺牲的代价之大。


    但其中大部分文案都没效果。


    有时，这些广告人会从事文案撰写数年，因为他们的成果无人跟踪。他们从不知道所造成的损失。


    更多情况下，他们会自行埋葬潜力。每年，都会有无数的'
  merge: -1
  img_proc: true
- pgno: 217
  md: '绝佳机遇因为这些最糟糕的文案，而进入广告坟墓。


    有时，我们看到他们这样广泛而罪恶地浪费时，我们总是控制不住自己。


    ※ ※ ※


    平庸之辈面对的机会，辩解的余地，从没有这么少过。如今，成功只属于有资格的人士。


    不要自己承担费用，训练您的员工。不要试图从您的失误中，学到我们用 35 年掌握的知识。


    最优秀的人员随您自由支配。在我们制定的计划里，不管您有无能力，成本都一样低。


    只是，结果会大相径庭。


    广告是战争，战场是努力拼搏来的。那些进入该 “战场”，但却对其不敬的人，往往会被驱逐出去。


    如果您的对手装备的是现代步枪，而你携带的是箭，那就不要进去。


    # # 我们的咨询委员会


    我们在纽约和芝加哥的两个咨询委员会，由 28 人组成，他们都是广告大师。


    每个人都具有丰富的经验，已证实的才干。他们制定的数百个广告宣传，个个身经百战。


    整个委员会迎接着一个又一个重要问题，都是现有或潜在'
  merge: -1
  img_proc: true
- pgno: 218
  md: '客户提出的。每次开会都是由霍普金斯先生或约翰先生主持。


    会上，我们决定在力所能及的范围内，什么可能，什么不 可能。这个建议是免费的。我们邀请您提出自己的问题。


    根据这些专家对您产品和机遇给出的建议，做出综合评价。 告诉他们您想要什么，让他们告诉您，这是否有可能实现。


    或者，说出您目前的方法。问问这些方法能否改善，怎样 改善。该咨询不涉及任何义务。


    记住，您的利益就是我们的利益。如果可以选择，我们不 会参与不可能的任务。


    如果某项试验广告会花费我们好几倍的佣金，我们不会建 议实施，除非我们相信它是值得的。


    另外，我们不会眼看着机会白白溜走，会坚持我们的建议。


    所以，有这么资深人士，再加上创意点子，就算出错，也 会及早发现的。


    * * *


    我们为客户负責的广告，都是由这两个委员会制定。媒介、 方法、计划和文案都通过开会解决。


    我们不依赖任何的个人。


    委员会讨论的问题都具有重要意义。有时在巧妙进行广告 之前，广告人的整个业务要有所变动。委员会会给予改动建议。


    每个人都知道一些别人不知道的事。每个人都做过别人没 做过的事。所以，我们会综合他们所有人的经历。


    对于每个新问题，我们会说出自己接受过的教训。


    委员会会议上提出的有些建议，后来证明价值数万美元。。


    * * *'
  merge: -1
  img_proc: true
- pgno: 219
  md: '在广告业，经验比能力更重要。


    任何经验仅局限于某一领域的人，往往眼界狭隘。


    这 28 人历经各种广告“漩涡”。


    我们做过的测试，试验过的方案，得出的经验，使广告史上所有公司中最多的。


    我们已经做了 36 年。各种成果都已制成表格，供以后参考。接下来的章节中将会有所阐释。


    所以，我们知道什么有效。所以，我们能避免失误。所以，我们靠着经验之财富，带给客户最好的成果。


    所以，我们通常能充分发挥每个广告的潜力。


    对于某一特定领域，某人可能比其他人知道的多。但是，没有


    哪一个人能熟知这 28 人所掌握的全部广告知识。


    我们相信，智慧来自于顾问团队。我们践行并宣传这种信仰。


    广告不允许出现自私自负之人。最优秀的人绝不是从不犯错。所以，在重要关头，我们坚信要集结所有可用的经验，所有的智慧。


    汴就是我们建立咨询委员会的原因。'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 我们如何承担这笔支出


    这样一群高薪酬的工作人员，占用着一大笔支出，真的。


    但是，不管对于我们来说，还是对客户来说，他们每个人都不是一笔开销。事实上，他们是一笔财富。


    我们支付给这些专业人士的每一分钱，都会扩大我们的客户群，从而带来一定利润。


    广告因他们而获利，广告因获利而扩大投放范围。而我们的利润，你们的利润，都来自广告的扩大。


    我们目前几乎所有的最大客户，都是从试验开始的。当时，他们的支出很小。而目前，他们的费用已超过我们的佣金。


    那些客户目前支付给我们大笔费用，这要归功于这些工作人员的能力。


    另外，他们每天都在创造着新的广告，没有他们，就不可能有


    这些广告。他们年复一年地为我们“保护”着广告，否则广告业早被那些才疏学浅之士抹杀了。


    我们承接广告，靠的是通常所说的媒介佣金。而您也知道，那笔佣金大部分或全部由发行商支付给我们。


    我们承接的是有可能和大客户支付同样佣金的小客户口而且，在制定第一次宣传活动时，我们常常会花费好几倍的佣金。


    所以，这项绝佳的服务，给客户带来的费用，和许多传统代理商提供的一般性服务差不多。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '我们是这样考虑该问题的:


    对于我们来说,发展客户比获取客户的支出少。让一个客户的消费增加一百倍,比去寻求一百个新客户的费用低。


    所以,其他大型广告公司花费在寻求客户上的资金,我们拿来投入到文案部和咨询委员会上。


    * * *


    有的广告顾问比我们薪酬最高的文案作者赚的还多。


    但是,他们无法为广告商提供任何服务。


    他们的高报酬来源于通过劝说获取广告的能力。但是,如果没有合适的广告文案,这种生意是不稳定的。通常都无法产生利润。


    一个人可以通过劝说招揽来的生意,另一个人可以劝走。


    我们倾向于选择 3000 美元的客户,然后把它培养成 30 万美元。这样,这个生意就是我们的,因为我们创造了它。


    我们的客户知道,他们的利润,很大程度上,源于我们的能力。他们知道,其他任何地方都没有这种能力。所以,他们当然乐意一直和我们合作。


    * * *


    我们之所以成为美国最大的广告公司,仅仅是因为我们提供的服务能带来利润。


    所以,这笔服务费用,不管对您,还是对我们,都无足轻重。您支付给我们的佣金,和其他一流广告公司的收费,相差无几,据我们所知,用于开销的佣金额也无太大差别。


    然而,大多数广告公司的主要支出在于寻求客户。而我们则是文案部和咨询委员会。'
  merge: -1
  img_proc: true
- pgno: 222
  md: '请您自己判断，主要把费用投在哪里，对您最有利。


    # 成果记录


    我们有一项成果记录，它到目前为止，已花费我们 10 万美元。是一式两份，分别存放在纽约和芝加哥


    正是这份记录，为我们的咨询委员会提供着最有价值的指导。


    我们数百则广告所取得的成果都记录在内。每一份广告，通常都是单独的一篇，用真实的数据展示着自己取得的成果。


    在这里，广告和广告之间，方法与 Method 之间，有着鲜明的对比。所以，数年来，我们已清楚哪些方法，哪些文案的效果最佳。


    没有哪个记录像它一样。现存的事物中，没有什么能像它一样，提供如此确切的指引。


    这份记录通过数十则广告，而不是一则，证明了哪些媒介最有利。


    它告诉我们哪些杂志和报纸的效果最佳。它为我们提供真实而明确的比较，让我们懂得各自的价值。


    它告诉我们关于发行量的实情。告诉我们在哪些地区，一家报纸就可几乎覆盖。它使欺诈无处藏身。


    因此，它能避免您找错报纸，从而避免产生巨大的浪费。'
  merge: -1
  img_proc: true
- pgno: 223
  md: '也避免您支付过高的费用。不过，这份成果记录还揭示着更多的信息。


    假如我们面前有一件针对农民的产品。它就会告诉我们什么风格的广告文案，能在农民身上产生最大效果。


    它展示着我们在许多类似广告上取得的成果，还有确切的方法。它记录着取得成功的方案和经证明失败的方案。它为我们提供销售方法指导。


    所以，我们现在面对每个广告问题时，不再需要做新的实验。


    从众多真实的结果中，我们就已经知道，哪个是最好的决策。


    * * *


    该记录中最令人好奇的是，人的判断力很容易出错。即使我们中最优秀的人，在判断广告文案的销售力时，往往也会出错。


    在没有这份记录之前，有多少次，我们最喜欢的广告，表现却最糟。又有多少次，我们几乎要作废的广告，最后却名列前茅。


    所以，我们不能仅仅依靠人力，不管有多少人，不管他们有多优秀。


    我们一定要用这份真实的成果记录，来指引他们触摸那根能产生回声的“无形心弦”。这就是成功的代价。'
  merge: -1
  img_proc: true
- pgno: 224
  md: "# # 我们的购买部\n\n有一种代理人，声称自己拥有强大的购买能力，并依此招揽生意。\n\n他说，他可以买到最便宜的广告空间。这种说法实在老套。广告商们，不再像过去那样，一想到能节省5%，就会心动。相反，他们在寻找能使效果增加100%的人物。\n\
    \n这种小处节省，大处浪费的做法，实在不是明智之举。不过让我们来回应这种说法。\n\n※ \t ※ \t ※\n\n芝加哥购买部的主管已在本公司工作23年。\n\
    \n23年来，他一直在争取每家报纸的广告空间，然后，在此基础上，他会进一步争取媒体的优惠价。\n\n他为企业争取的空间总是比其他任何人都多。\n\n一直以来，他不断从我们的新客户那里，了解其他广告公司支付的空间费。\n\
    \n您认为，其他经验比他少，生意没他多的人，有可能会以更低的价格买到广告空间吗？\n\n我们在纽约的购买部经理也有着同样丰富的经验。这两个购买部门，经常通过我们的私电报线，相互咨询对方。\n\
    \n※ \t ※ \t ※\n\n后来，会经常突然冒出这种说法，即他们有发行商的支持。好的位置，合作，免费阅读干U物，等等。\n\n我们很乐意做一下比较。"
  merge: -1
  img_proc: true
- pgno: 225
  md: '媒介最喜欢的是投放广告最多，从而在短时间内消费最多的公司。


    媒介会告诉您，那家公司就是洛德暨托马斯。


    1907 年大恐慌时，所有媒介都迫切需要资金，他们要求几乎所有的广告公司用现金支付。


    当时，本公司的每笔账单都是用现金快速支付的。从而享受了


    所有的现金折扣。另外，我们还支付给资金匮乏的媒介，大笔的预付款。


    · 您自己判断，哪种广告公司最可能得到媒介的支持？


    这些论点几乎无可争议。


    而如今，最赚钱的媒介都有固定的收费标准。只要支付速度一样，每个广告公司的费用都一样。


    只有次等媒介，购买力好坏才会产生影响。


    我们购买部能提供出色的服务，是因为我们有成果记录。


    数十个客户的广告的实际阅读率，为我们的购买人员提供了重要的


    事实数据，这是其他任何地方所没有的。


    我们衡量发行量的标准，是实际阅读量，而非报纸自己宣称的


    数量。我们知道，每家报纸会给我们带来什么客户。因此，我们很清楚它们的广告价值。


    我们知道在哪些地方，一家报纸就可覆盖整个区域；哪些'
  merge: -1
  img_proc: true
- pgno: 226
  md: '地方，用两家报纸会太过浪费。


    这不仅仅是低价购买的问题。超过三分之二的刊物收费昂贵。


    另外三分之一中，许多刊物的最低价是其真正价值的 2 倍。


    我们的成果记录，独一无二，为我们的购买人员展示着这些实情。一般来说，用 2 美元完成的事，有了它，1 美元就能完成。


    作为一荡《注重效果的广告公司，我们尽量在购买时不允许出现任何浪费。


    # ## 我们的广告经理部


    小广告公司的另一个论点是，宣传个性化服务。这一说法荒谬之极。


    一个人不可能既是优秀的购买人员，优秀的广告文案作者，又是优秀的顾问。这是个专业化分工的时代。


    我们发现，在筹划个宣传时，综合众多人员的想法是可取的。


    但是，我们还会为您提供一切与个性化服务有关的特色。这就是我们个性化的服务方式。


    ***'
  merge: -1
  img_proc: true
- pgno: 227
  md: '我们在纽约和芝加哥“供养”着一个广告经理部，他们的年薪为48，000美元。


    该部门中的每个人都各自观注视着几个客户的利益。他充当您的


    代表。他是我们公司的广告经理，就像您公司的广告经理一样，如果您有的话。


    他关注着您的广告，留心您的利益，合适您的广告效果。他阅读您所有的信件，并一一回复，始终和您保持着联系。


    他按您的命令行事，担当您在本公司的广告经理。他的话就是您要传达给我们的话。


    这里的每个人都是我们咨询委员会的成员。每个人都和自己最开始负责的客户保持着联系。


    我们为客户选择广告文案作者时，我们也会选择相应的经理给予指导。


    从那一刻起，他将日复一日、时时刻刻地为您服务。您的利益就是他的利益。他还有不断了解信息的优先权。


    他跟踪每一个广告文案、设计、E〖J刷、购买和审查。他根据所享受到得服务和成果，提出批评或表扬。


    然后，一旦出现重大失误，他会把问题提交给咨询委员会。


    * * *


    这是我们能拿回的另一笔支出。


    这个接触客户的人能留住客户。他使每个部门都能达到标准。


    他不仅维护着您的利益，也使得我们的投入有所回报


    228'
