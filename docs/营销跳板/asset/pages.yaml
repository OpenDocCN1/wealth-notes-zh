  md: '# 2、早期开端


    这是一个简短的历史事件，作为克劳德·霍普金斯出场的铺垫。突出强调了在广告史上的几个里程碑。


    1704年，第一份报纸广告出现。这是在波士顿《时事通讯》上刊发的一篇为长岛牡蛎湾一处房产寻找买家的广告。


    1729年，本杰明·富兰克林开始在宾夕法尼亚州出版《费城公报》，其中便包含广告。


    1742年，美国的第一份杂志广告由本杰明·富兰克林刊登在~Oeneral》杂志上。


    1784年，美国第一份成功的日报—宾州信息与每日广告一在费城开始发行。


    1833年，本杰明·戴出版第一份成功的“便士”（penny）报纸一太阳报。


    1837年，发行量达到30，000份，成为当时世界上发行量最大的报纸。


    1843年，沃尔尼·帕露在费城创办了第一家广告公司。


    1868年，弗朗西斯·韦兰·艾耶尔仅仅用250美元创办了N. W. Ayer and Sons广告公司。他的第一批客户包括蒙哥马利一沃德公司、约翰·沃纳梅克百货商场、辛格缝纫机以及旁氏美容霜。


    1873年，第一届广告公司公司大会在纽约举行。


    1877年，J·W·汤普森从威廉·J·卡尔顿手中购买了卡尔特-史密斯广告公司，并为商业业务支付了500美元，同时为办公室家具支付了800美元。'
