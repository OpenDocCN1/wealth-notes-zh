- pgno: 237
  md: '你可以确定这样的目标：


    +   中餐热爱者

    偏爱在家里吃饭的人

    每周在餐厅吃饭至少三次的人

    喜欢自己烹饪的女人

    喜欢吃、但是讨厌烹饪的男人

    只喜欢吃垃圾食品的青少年


    方法就是，要找出一些特别的东西，你可以这样说，“嘿，我了解你。我知道你是独一无二的——是非常特别的。这并不是为每一个人准备的。而只为你一个人。”


    然后，你就可以为每一个小的目标提供个性化的东西了。


    你的市场目标就像在池塘中的鱼一样。只要你找的池塘有很多饥饿的鱼儿，并且使用它们喜爱的饵，你就可以很容易地抓到它们。


    如果鱼儿不是很饿，或者不喜欢你的饵，那么它们是不会上钩的。不要假想自己知道是什么可以吸引潜在客户。要亲自去调查！再说一遍，调查研究成果关键。


    # 问题比答案更强大


    好好想想你自己的产品。然后，列出一个问题清单，帮你自己弄清楚：目前谁在购买你的产品，以及谁应该或者有有能力购买它。列出这些问题，这将有助于你从非常深的层次上理解这些潜在的购买者。


    之所以说问题比答案更有力，是因为：你将问题应用于不同的目标市场，相同的问题就会出现不同的答案。提问题是使你集中注意力、打开思维，从而做出新的选择的一种方式。


    试着与现有的客户和有资格的潜在客户进行交谈。他们是否参与了某些团体或者组织，使你可以加入到他们当中，与他们进行交流呢?只要你做的任何事情能帮助你更好地了解你的目标，你就与他们钱包的距离大进一步。


    238'
