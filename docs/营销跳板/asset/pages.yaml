    # 很多人期待太多


    很多人给我们写信说，如果经销商可以保证一瓶的效果，那么～们就愿意尝试舒普医生的康复药。对于这样的人，我们的回答是：“如果您的病情很严重的话，那么我们不能建议您只服用一次。您可以试用一个月的康复药，如果没有作用，那么我们不收您钱。但是如果您只愿意进行一周的试验，那么它很有可能会让您失望的。”


    那些病人根本就不知道他们自己的病情有多严重。想要将毁掉的健康体魄在一周之内复原，恐怕只有魔法能够做到了，但是这个世界上是没有魔法的。想要治愈，就一定要慢慢来。


    有很多人只服用舒普医生的康复药一瓶之后，没能使他们痊愈便放弃了。他们继续遭受病痛之苦，还认为康复药没有用。这真是一种遗憾。不要试图去证明康复药是不能治愈的，因为它很有可能是唯一能够把病人医治好的治疗方法。请给它一个机会，也给您自己一个机会。


    当舒普医生的康复药将您痊愈的时候，请把它推荐给其他人。对于一位生病的朋友，您的话要比我们自己的更有影响力。请告诉他，您已经研究过此治疗方法，确实可以治愈病痛。


