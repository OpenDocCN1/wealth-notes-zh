    # 标题影响成功


    你的销售信，要么引起注意…要么不会。

    你的销售信，要么对潜在客户进行精准定位…也可能不会。

    你的销售信，要么吸引潜在在客户进一步关注…也可能不会。

    而标题便决定了销售信是否能够做到上述这些。


    你所获得的结果，是与你的标题质量一吸引力和激发兴趣——成正比例的。


    一个好的标题可以很轻易地使你的回应率增加 2 倍或 3 倍——一个非常好的标题效果可能更好！


    想像一下，当你突然之间可以使 2 倍、3 倍、甚至是 10 倍数量的人去阅读你的信息的话，你的银行账户迅猛进账的感觉！（有人曾经只换了一个标题，得到的回应率便增加了
