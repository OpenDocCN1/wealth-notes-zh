  md: '每一次销售或购买、每一个商业联盟都应该仅以服务为基本原则。如果这是错误的，或者说如果这是最高级的，那么人们终究会发现这一点。而且，这样的结论将会恢复你的商业地位。


    # 4. 绝非战争


    据说曾经有人认为商业是场战争。也许曾经确实如此，但现在已经发生了改变。战争意味着敌意、苦难、欺骗和破坏。胜利建立在毁灭之上。


