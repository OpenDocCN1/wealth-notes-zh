- pgno: 15
  md: '现最好方式的四分之一。


    所以，没有人能不通过比较、只根据已知的结论就得出有效的广告来，当然了，一些极少情况除外。当然，其他人也一定会犯下霍普金斯曾经相同的错误。他们一定也常常得出错误的观点。


    而如果不知道效果的话，那会杀了自己和客户的。随着霍普金斯的名气不断上升，无数人带着他们自认为很好的广告项目来找他。而他也根据自己和他人的判断犯过一些大错。产品并不像我们想象中的那样好卖。


    因此，他发现，一定要对某个项目进行限定性的测试，才能有所收获。他将每个测试活动的预支成本设定为 5000 美元，而事实上，大部分的活动都花不了这么多钱。通过这种方法，他发现了在一些城镇中赢得一千位顾客所需要的成本是多少。


    然后，再看那一千位顾客都会买些什么。在扩大范围之前，他总是先了解争取每位顾客的成本是多少，而每位顾客能够带来的销量又是多少。他通过数千位顾客的试验，来反映出数百万顾客的消费心理。他每次都是在很确定的情况下才扩大范围的。


    在其它方面，霍普金斯了解到要改变人们的习惯，是一笔可怕的花费。其中一个是燕麦片的广告活动，另一个是牙膏。他试图吸引更多的人食用燕麦片，但是他却发现，争取新顾客的花费，要远远超过任何可能的回报。他试图让新的顾客养成刷牙的习惯。而就他的计算而言，每次成功转换都要花费
    25 美元。即使转变成成功的人一生都使用牙膏，也很难将自己的成本捞回来。


    因此，他放弃了那种做法。他努力让其他人去转变人们的想法，来接受这种新的习惯。他只是在人们的想法被转变之后，再试图让他们使用他的产品。自从他学到这个经验之后，他投了数百万来做燕麦片和牙膏的广告。但是，他却从来不用一句话、一个字去试图改变人们本身还未接受的习惯。


    这使他成为世界上最伟大的广告撰稿人的原因。这便是'
