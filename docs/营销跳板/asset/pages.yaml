  md: '直在给予和索取二者之间犹豫，那么对你来说是幸运的。因为一般情况下人们都是公平的，在他们的平等观念里，他们所要求的也只是一个“五五”交易的平等行为。


    # 20. 天才


    这个 世界上从来没有广告天才。成功的第一个要素就是去做一个平常的人，拥有一个普通的观点。广告专家一定是多面手，而天才却不是。若想通过自己的方式赢得人道，必须要学会人性化。天才不会是人性化的。


    要注意在任何销售领域中的文化素养高的人。普通人的工作方式超出了他的理解。你一定知道为什么农夫会买一个特定的犁，为什么家庭主妇会喜欢特定的肥皂。当一个要去买车时，他考虑得最多的是什么?给他们提供实际建议的人不会是天
    才，而是普通人。


    生活在“云端”的人更是被排除在外。商业上的成功来自于实实在在的行动，这些行动只是做那些显而易见的事情而已，而这恰恰是梦想家们所忽视的。


    推销术不是一种智力的追求。回忆一下你的同学们，留意下那些聪明的人是怎么堕落的，再注意下那些努力学习、辛勤工作的人们现在都在哪，生活的怎么样。在挑选为你做事的人才的时候，要考虑这个因素。在商业上，最伟大而又最难得的品质就是普通常识。


    # 21. 心理学


    没有心理学作为指导，推销术便是粗鲁的。好的广告必须认识到这些事实：人们是不慌不忙的。


    如果没有激励措施来促使他们采取行动或是下定决心，那么他们通常会延期或者是忘记行动。随波逐流是很自然的。通过跟随你脚步的群众来使民众们印象深刻以影响他们，这种顺从是自然而然的。一个直接的命令比请求更加有效。'
