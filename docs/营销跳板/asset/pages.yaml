  md: '人们至关重要的神经叫做交感神经系统一即内部神经。它们与人的外部神经是完全分离的。它们之间也没有任何的连接。人们根本感觉不到这些内部神经，也无法控制它们的行为。人们一旦对它们注射麻药，生命就会停止。


