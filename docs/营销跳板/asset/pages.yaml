  md: '重要的“开场语”便是你的标题了。标题扮演着一个非常关键的角色……然而，大部分的营销人和生意主们都没有意识到，区区一则标题能够对他们的整个结果带来的巨大影响。他们要么就是根本忘了撰写***则标题，要么就是非常随性地拟***则标题，像后来添加的内容一样。


    因此，一定要保证你的所有广告和销售信都有一则标题。并且，要尽可能地吧标题写得有力量和吸引人。


    标题通常被称为“广告中的广告”。无论文件是一封冗长的销售信，一则微小的分类广告，还是～整本书，这都是真理。标题是一切的王宰好的标题可以产生更多的兴奋、希望和热情。一则标题，可以带来数百万元的生意……或者，可以将一场失败的活动转变成非常成功的活动。


    当你的标题撰写得很成功的时候，你便已经征服了所有营销人面对的最大障碍；你已经吸引了潜在客户的注意。现在，你已叠争取到一些时间来向潜在客户分享你的信息了，从而说服他们采取行动购买。


    从另一方面讲，如果你的标题无法吸引受众，令他们感兴趣的话，那么不仅你的销售会收到阻碍，而且你其余的广告、宣传册、网站或者文案都会彻底失去左右。只要读者看了标题不想继续阅读下去，那么广告正文中的信息也就没有多大意义了。


    # ## 案例研究


    一位市场营销人，曾经在三个月的时间内，针对一款节食产品，在广告中尝试使用4则不同的标题，从而发现标题的价值。正文内容都是完全相同的。只有标题不一样。


    +   1. “节食产品的信突破！”


    +   2. “一场全新的节食革命！”


    +   3. “一位‘德克萨斯州家庭主妇’是如何在32天之内，减掉23.5磅体重的！”


    +   4. “一位绝望的家庭主妇的节食秘诀！”


