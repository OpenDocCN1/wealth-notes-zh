  md: '# 一款真正的 1913 年汽车


    由 R. E. 奥兹设计


    下面是你在一款 1913 年的汽车中应该寻找的东西。汽车缺少了应该拥有的东西。


    # 新特点


    今年的领先汽车具备左侧驾驶功能。它们拥有电子仪表板灯一嵌入式灯一而不是老式的投影灯。


    它们拥有特大号的轮胎 而那种尺寸较小、需要付双倍钱的轮胎已经非常过时了。


    在这些方面，所有的汽车都会跟随领先者的步伐。因此，不要买那种具有最好的制造商抛弃的汽车。


    # 新理念


    如今，人们都想一次购车可以驾驶多年。所以，现在最好的制造商都制造那种驾驶多年还宛如一新的汽车。以及那种维修费比较低的汽车。


    我们最近制造的汽车——雷奥，便体现了这样的汽车要求。


    它由钢材制成，轮胎经由 50 吨的压碎机检验过，弹簧也经由 10 万震动检验过。


    为了保证安全，每个驱动部件都多增加了 50% 的性能。


    我们使用 15 个滚柱轴承，即使它们所需花费是普通滚珠轴的危险我们使用 190 种落锻制品来避免裂缝危险。


    我们使用一种 875 型号的嵌发电机，双倍热度的汽化器，以及无烟的机油系统。'
