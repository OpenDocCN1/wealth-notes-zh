    在这款汽车中，我使用了 190 种落锻制品，来避免所有隐藏的裂缝。而如果使用钢铸件的话，花费便可以减半。


    我使用了 15 个滚柱轴承一其中 11 个是用铬镍钼耐热钢做的，另外 4 个是由高性能的海特做的。普通的滚珠轴承只需要花费五分之一的价钱，但是它们经常会破裂。


    我使用一种 75 美元的磁发电机来避免点火问题。我用热气和热水来双倍加热我的汽化塞，使其可以应付低劣的汽油。


    为了保证安全，我使用 14 英尺的刹车鼓，以及两英尺宽的七叶弹簧。


    # 1000 次测试


    在制造过程中，该汽车的各种零件都是经过上千次的测试和检查的。


    比如说，每个发动机都会测试 48 个小时——20 个小时测。试齿轮组，28 个小时测试底盘。


    定做的零件会反复研磨，直到我们确保其完全准确。


    每个车身都涂有 17 层材料。它的最里面是用真皮来做衬垫的，装满了最好的卷丝。


    电子仪表板灯与仪表板平放在一起。从这样汽车的外表就可以显示出我们认真和谨慎。


