- pgno: 287
  md: '然而，我们却经常看到这样的事情。许多销售大师高调地给予一种产品罕见的声誉。然后其他人在相同的签名下因为轻率的对待而破坏了这种声誉。


    丑闻的能量比赞扬大一百倍。正是如此，一个显示粗俗概念的广告可能会让一千令熠熠生辉的光环暗淡无光。我们必须保护我们努力创造的气氛。


    # 30. 勇气


    勇敢的人那么容易获得成功的一个原因便是懦夫的普遍。大多数反对派只是在虚张声势，这样做反而削弱了进攻。因为缺乏勇气，民众大都依附在救生艇上。而且，随着救生艇漫无边际地漂流。只有那些从下沉的地方奋力搏击或游泳的人才能有希望到达梦寐以求的港口。


    与无能相比，恐惧更能使人墨守成规一成不变。我们所惧怕的事情通常是一些奇谈怪论。胆小的人往往用七年的时间做其他人七个月就做完的事情。因为惧怕风险，他们让竞争对手超越了自ﷻ，然后对自己的保守主义自鸣得意。


    广告的成功是很容易的因为很少有人充满活力地尝试这项工作。


    在许多行业里一个单独的品牌占领了整个庞大的领域为自己所有。


    然而，在世界上，广告的价值作为成功的辅助手段是最佳的广告事实。人们不认识路，因为道路是黑暗的。而且，黑暗孕育着灾难的鬼魂。


    事实是这样的，广告行业只要被正确地经营便会是最没有风险的商业投资。除了广告行业，没有其他拥有同样前景的行业能够使你真切地感受到你的道路。令人遗憾的是没有人去咨询那些行业里的领路人，而那些领路人已经证明他们是值得信赖的了。'
