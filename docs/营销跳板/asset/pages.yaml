    听觉子弹，就是使用声音的描述来描写好处。安静的，喧闹的，低沉的。如果读者正在感受这种利益，他将会听到什么呢？


    +   “你可以听到孩子们‘嘻嘻哈哈’玩耍的声音、鸟儿在林间‘唧唧’歌唱、以及音乐从你旁边的车子中发出来的声音——一直到你将车窗摇上去！只有到那个时候……才能获得一片静寂。”


