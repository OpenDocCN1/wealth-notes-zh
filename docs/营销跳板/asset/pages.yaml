- pgno: 245
  md: "+   - 供应品  \n- 培训程序\n\n再说一次，大部分的潜在客户在确定想要得到你的产品(因为他们对于你提供的产品的好感感到兴奋)之前，是不会关心那些特征的。但这并不意味着特征不重要。\n\
    \n首先，你要熟知产品的每种特征是很重要的，因为这样，你才能够为他们建立一个利益清单。\n\n第二，在你的潜在客户决定想要得到你的产品之后，他们就会了解你的产品的大量特征。这些特征将会证明，他们通过情感做出的购买决定是很合理的。特征可以建立可信性，可以建立信心，可以帮助证明，你的产品所提供的好处的确可以满足潜在客户的强烈需求。\n\
    \n你要努力做到具体。确切的数字、调查结果、研究结论等等。\n\n不要跳过这一步。你知道，如果你建立的基础很弱的话，会发生什么事情，对吗？\n\n# 利益——我能得到什么好处\n\
    \n那又怎样？\n\n谁在乎呢？\n\n我可以得到什么？\n\n我知道，这些问题听起来很自私。但是，他们就是这样的。\n\n这些问题，还有其它类似的问题，会不断地萦绕在你的潜在客户的脑海里。而如果你不能给出一个很好的答案，没有办让他们自己去发现，那么，他们就会对你置之不理。你拿着销售信，不知道是哪里出了问题。\n\
    \n这些问题的答案就是“好处”。“特征”描述的是一件产品的特性。而好处描述的就是人们使用你的产品之后得到的感受、快乐和优势。"
  merge: -1
  img_proc: true
- pgno: 246
  md: '要像你的潜在客户那样去思考。领会他们的感受。从你的潜在客户角度出发，想想(作为一名潜在客户)你最希望得到的好处是什么。而你能够提供那些好处吗？如果可以的话，一定要记得把它用在你的销售信中。


    要重点强调特别的好处—那些其他人没有强调过的好处，并且最好是其他人不能与你相抗衡的事情。


    # 好处，好处，好处


    潜在客户会考虑购买你的产品的唯一原因就是：因为他们希望和期待自己能从中获益—最好在多个方面都能获益。并且，你所提供的好处越重要、越令人印象深刻、越特别，你的广告和营销材料就会更有力、更成功。


    好处，就是潜在客户们寻找的答案。好处就是产品或者服务的。并且，从你价值的角度来看，好处可以帮你把产品销售出去。


    花时间和精力去彻底发现和清楚表达出你的产品或者服务的每一个好处，是非常值得的。毕竟，是好处吸引人们的注意力，好处越令人印象深刻，你就会吸引更多的人关注。人们都会被那些能够


    给他们带来好处的事情所吸引。


    你在最后一个步骤中列出的每一个特征，都要解释，为什么对顾客是一个强有力的优势。那个特征意味着什么呢?通过这个特征，他们将如何受益—他们将会得到什么好处?从潜在客户的观点来看，它最大的好处是什么?它可以帮助人们消除什么痛苦?可以帮助人们实现什么愿望?


    把每个特征都描绘成具有神奇吸引力的好处。


    在神奇的子弹中，你可以罗列出无数的特征和好处。这样就可以很容易的来跟踪。


    根据重要性整理你的清单，从而将注意力放在最有价值的'
  merge: -1
  img_proc: true
- pgno: 247
  md: '概念上。


    对于任何一种特征，都可以对其附加出很多种好处来。这种 “叠加” 的效果是很强大的。并且，当你之后对这些好处进行考虑的时候，你就能很容易增加内容或者编辑文字，因为它们是具体的特征相连接的。


    创建一个完整的利益清单，可以为你带来巨大的优势，并且在撰写销售信的时候，也可以使你的有个特别好的开头。实际上，每种好处都可以被转变成一个标题，进而转变为子弹。


    不仅如此，而且它还会促使你站在潜在客户或客户的角度去考虑你的产品。因为你可以用种与潜在客户有关的方式去描述它。


    好处可以刺激人们的情感，而情感又会推动人们的行为。它们可以使潜在客户很容易地想象到他们可以得到的回报；以及使用产品，然后获得你承诺的结果。在潜客户的想象中，你提供的好处对他们的实际生活越有帮助，他们就越有可能产生兴趣，而购买产品。


