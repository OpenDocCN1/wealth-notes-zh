  md: '# 你的汽车是怎样制造的？


    你的汽车是怎样制造的对你来说当然是一件非常非常重要的事情。它是你花钱之后买了什么的全部问题的关键。并且，一直以来，不同的汽车，其制造也是存在重要区别的。大部分汽车都是够好，有些汽车更好，而只有一两种汽车绝对是最好的。你用自己的钱买到了什么，实际上是由你所购买辆的制造工厂所决定的。不要忘记这一点。


    并且在如今，就像在过去一样，斯图贝克公司一直都是世界卜爵大、最好的汽车制造公司。


    例如，款图贝克—弗兰德勋 “20” 款汽军制造时使用的钢材就是由匹兹堡工厂完全按照我们自己的规格来制造的，并 且我们接收到的每批货物都是经过化学分析，从而来维持我
    们的标准的。我们用自己的强有力的铁锤为每辆斯图贝克一弗 兰德斯 “20” 款汽车锻造出的零件都不少于 226 个。斯图贝克 铸造厂所浇铸出的斯图贝克汽缸都具有一定程度的准确性的，在自由市场上是买不到的。


    我们使用的所有钢材都是经过热处理，并且在必要的地方，都经过斯图贝克火炉以及使用我们自己的秘密方法进行硬化定型的。


    通过所有非凡的打磨操作，将粗锻或铸件打磨为成品，像制作手表一样进行精细地测量，准确就是我们的主旨。并且，在每一点上，我们都要进行非常严格的检查以保证准确。斯图贝克的产品都是通过专门的斯图贝克制造过程而制造出来的，并且其过人之处在于：它们是经过自动化的机器来实现大批量生产的，人工可能会犯错误，而自动化的机器也永远不会。


    斯图贝克汽车完全不是组装汽车。它们全都是在斯图贝克的工厂里面制造的。这对于—使=汽车车主而言意义重大。而它到底意味着什么，有多大的价氪任何有经验的驾驶者都知道。


