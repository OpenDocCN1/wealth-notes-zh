  md: '主题。


    在邮购领域，霍普金斯也尝试了很多种方法。正如所有的邮购目一样，他了解每一种成本和收益。他发现，所有浪费的空间都等十月6提高自己的成本。当使用一张没有用的图片来吸引人们注意力的时候，而那张图片·却占用了三分之一的空间，这就意味着，成本增加了50%。


    这教会了我们要节约空间，无论是用大号字体刊登还是用小号字体的广告，人们都一样乐意阅读。只要是他们关心的东西，即使只有8号字，甚至更小，他们也会阅读。较大的字体并不会带来额外的读者。同样，没有意义的图片
    or 陈列也不会起到任何作用。像对待其它所有事情一样，只有在顾客对广告的主题很感兴趣的时候，才会去阅读。顾客会通过标题来空间这种证明有效的原理，霍普金斯为广告商们节省了上千万美元判断商品或者广告。通过节约的成本。


    而不同的标题，其吸引力却有天壤之别。同一则广告，用某个标题的吸引力是另外一个标题的10倍。所以，要把每一行内容都写得最有吸引力。要像邮购广告商们一样，将所有的广告都写下来，然后进行一个一个对比。并且，永远不会在测试之前，就将某个广告大量投放市场。


    霍普金斯对成千上万个广告进行过测试。他发现，对于某个领域，如果使用某种诉求，那么得到每个回复的成本是14.2美元，而如果换成另外一种诉求的话，每个回复的成本却只有42美分。曾经有一则关于某个主题的广告，霍普金斯作为测试样本，而每让人们填写一张优惠券，其成本就是17美元。而对于同样一个主题，另外一则广告讲述了几乎同样一个故事，每笔回复却只花费了35美分。在几乎每一个领域中，他都发现了某些特定的方法可以使利润最大化。


    霍普金斯成功的主要原因：他从来都不会在一种赌博或者猜想上花费太多钱。在广告大量投放之前，他会比较几十甚至数百个广告，然后挑选出效果最好的广告来。之后，他还会不断地对其它广告进行小范围的测试，从而来发现其它更好的。曾经在某个主题上他测试了56个系列广告，然而，5年之后，他又发现了一种效果更好的方式，其花费成本却只有他曾经发'
