- pgno: 158
  md: '我们增大轮胎的尺寸——并且不收取额外的费用——是为了增强固特异牌轮胎的良好信誉。因为通常的情况是这样的：


    汽车制造商们在确定轮胎尺寸的时候，都会考虑到预期的负荷。负荷，即这些轮胎能够承受的汽车重量，以及平均体重 150 磅的乘客的重量。


    它们提供一种可以承载这个负荷的尺寸的轮胎，几乎不留任何多余的尺寸。轮胎是很昂贵的，如今汽车的成本被计算得很苛刻。


    而您可能会增加一个车篷，或是一个透光玻璃、照明灯、一个备用轮胎或者其它沉重的东西。并且乘客有的时候也会超过 150 磅的平均体重。


    90%的情况下，预期的重量都会被超过数百磅。对于轮胎而言，那是致命的。当您的重量超过 25%的时候，轮胎的英里数就会削减一半。


    最终的结果就是轮胎的爆裂。有的时候，甚至在轮胎几乎是全新 的时候，也会发生爆胎。于是人们自然而然地就会责备轮胎的 质量。


    这便是我们制作超大型固特异牌轮胎的原因。我们允许 10%范 围内的超负荷。而在今年，这增加的尺寸也不会多收取任何费用。 如今，尺寸不足的轮胎售价与我们固特异牌的超大尺寸轮胎是一
    样的。


    # 无损轮辋


    我们已经售出了将近 50 万个固特异牌的这种无损轮辋的轮胎。 我们已经进行了上百次试验—行驶 20 英里之后将其放气，而在所 有这些试验中，从未出现过轮辋切损的情况。


    想想这意味着什么。如果必要的话，您可以将一个漏气轮胎开 回家。


