  md: '“一定要考虑竞争优势。你的竞争-T-都有哪些?他们在价格或质量方面提供的哪些优势与你相当?你拥有哪些优势可以赢过他们?当你赢了他们之后,你又拥有什么可以保持这种领先地位?”


    “没有准备的广告就像被浪费掉的瀑布一样。力量已经在那里,但就是没有什么效用。因此,我们必‘须要集中力量,并把它用在实际有用的方向上。”


    “不要把人们当作一个群体来看待,那样会使你产生一种很模糊的视野。要把他们当作一个个典型的个体—男人或者女人——有可能想要你推销的东西的人来对待……不要说大话,因为所有人都很憎恶这一点。不要试图炫耀或者卖弄什么。你认为一名优秀的推销员面前站着一位有可能购买的消费者，他会如何去做呢?你就可以这样去做。”


    “记住:你对其进行宣传的人都是很自私的,就像我们自己一样。他们并不关心你的利益或你的利润。他们只为自己寻求服务。而在广告中忽略掉这个事实,是很普遍的一个错误,并且也会造成昂贵的代价。”


    “最好的广告不会请求任何人购买……广告完全应该是以服务为基础的。它们应该提供人们想要获取的信息。它们应该列举对使用者的有利条件。或许它们还应该提供一份样品……这样的话,顾客们就可以不花费一分钱,也不需要承担任何风险，来亲自证实广告所言是真是假了。”


    “有些广告看起来似乎是利他的。但是这是基于对人性的了解……人们可能会被哄骗，但是却不会真的进行购买。因此这些广告无异于自娱自乐,或者自欺欺人。”


    “人们可以受诱导,但不会接受你的驱赶。无论他们做什么,都是为了让自己高兴。”


    “邮购广告总是字体很小,通常它采用的字体会比普通印刷品的字体小。这种空间经济学比比皆是。由此,我们得到一'
