  md: '得的东西。


    因为不准确而失败的推销员比因为谎言而失败的推销员要多得多。他们使事实看起来像是虚构的，这仅仅是他们不仔细处理的结果。


    很多广告当被仔细分析时看起来像是既公平又真实，但粗略地读起来却像是捏造的。你要知道信任限定了所有需要信任的语句。


    和盟约几乎一样的言语听起来总像是盟约。但是用词太过流利的健谈者也永远不会受欢迎。在广告中确实如此。


    # 39. 领跑者


    两个相似的产品被同一个人开发出来。其中，一个产品是通过旧的方法生产出来的，另一个产品是由新的方法生产出来的。


    在旧的方法下，这种产品需要十年时间才能达到一定的产量。在新的方法下，生产一个相似的产品用七个月就可以达到同样的产量。旧的方法获得了成功。然而，新的方法被证明是高效的，因为其比旧的方法快了十七倍。


    在许多不同行业中，很多其他的人有时也将会面临同样的觉醒。他们不断的前进并感到满足。但是他们没有用领跑者的标准来评价。也许他们没有竞争者，或者他们拥有的竞争者都是不值得一提的。如果他们所在的行业是赚钱的，那么在某个时刻一个迅速成长的企业便会出现。而且，他的新方法将会揭示意想不到的可能性。


    在一个拥有充满才干的领跑者的行业里，判断一个人的努力程度是轻而易举的。在一个没有领跑者的行业里，反而要谨慎判断一个人的努力程度。可能有很多方法使你可以十倍的速度前进。


    如果其他人找到了这些方法并且使用了他们，那么你将会'
