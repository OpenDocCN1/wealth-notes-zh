    大师们所做的重要的事情超出了人们的随意理解。人们和他们的努力很大程度上是由毫无意义的外在来评价的，直到通过成绩来衡量他们。因此，这驱使我们要不要受制于外表。


    如果我们渴求来自众人的信任或者甚至是希望得到来自那些我们服务的对象的信任，那么做事一定不要只重外表。但是，知道了外表是怎样骗人以后，我们应该武装自己以防范他们。不要让他们影响你的判断。


