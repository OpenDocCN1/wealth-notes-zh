  md: '# ## 6: 汽车广告


    在汽车广告的早期，存在着一种普遍印象就是：大家都觉得其中的利润太高了。而霍普金斯做出的广告，主要目的就是打破那种印象。


    其他都在宣称其价格有多低、利润有多低。而霍普金斯的广告标题则是：“我们的利润只有9%。“他在广告中给出了发动机底盘、车轮、轮胎等等器件的具体成本。对于一辆售价1500美元的实汽车，他在没有提及车身、顶部、或者衬垫物—汽车中最显著的东的情况下，已经列举了其它部件?62美元的花费成本。


    这个广告活动的成功教会了他，要提供准确的数据。当我们宣称最好或者最便宜的时候，人们会淡淡一笑。因为那是最普遍的说法。但是，当我们说出具体数字的时候，它们有可能真或有可能假，而人们一般不会认为一个卓越的企业在撒谎。他们一般都会接受那些数字。


    从那以后，只要有可能，霍普金斯就会列举很多事实数据霍普金斯为很多不同的汽车公司创作过广告活动。


    具有讽刺意味的是，霍普金斯的其中一个广告活动却造成了一家公司的毁灭———米切尔公司—因为他的广告产生了“过量”的汽车需求，而该公司无法制造出足够的汽车来满足这个需求。


    这个广告活动的标题是：“约翰·贝特，效率专家”。广告讲述了这个男人以及他的工作方式。这个广告活动促使销售以惊人的速度增长。为了满足巨量涌进的订单，该公司在质量上偷工减料，以至于生产出了假冒伪劣产品。该汽车被授予了“失败”的称号—一于是那家公司也就倒闭了。这件事情告诉我们的教训就是：过量的需求本身也会带来问题。


    下面是你在霍普金斯的汽车广告中将会看到的一些主题。'
