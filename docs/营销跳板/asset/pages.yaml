  md: '# 致思想开明的女人

    以及她们想要取悦的男人


    下面是有关存天然食物的一些事实和图片。我们人类的食物，在营养方面超过肉类—丰盛、美味而且便宜。但是，对于这道美：乙太多的人都没有品尝过它。


    (图)这是一颗来自于家庭烘烤的、最上面的典型豆子。


    您可以从图中看出，它已经碎掉了。作为一种食物，它被彻底地毁掉了。


    那是由于干热的缘故。但是，最上面豆子的坚硬外皮会使热量无法到达件的豆子中的主要部分里面。位于下面的豆子所获得的热量还不是一半，以致于烘烤之后的它们很难消化。


    因此您总会称它们为不易消化的食物。而那也是它们会在人的身体三发酵，使人打嗝放屁的原因。无论一介中食物的口味多虹：，如果它无法转化为营养物质的话，那么它又有什么价值呢？


    (图）这是一颗来自于家庭烘烤底部的豆子，是被浸泡之后的大块物质中的一颗。用文火炖成块状的豆子，其颗粒物是很难消化的。


    但是，您可能会说，有的时候，你的豆子并不是糊状的。有的时候它们也会出现完整的。而事实上那样更糟糕。因为那样的话，就意味着那些豆子根本就没有被恰当地煮沸过。即使对于胃口最好的人，这样的豆子也会变成一种沉重的负担，大部分人都根本无法使用它们。


    为了完成这道美食，您花费费 16 个小时的时间来将豆子浸泡、煮沸和烘烤。要想吃到这道菜，您必须从前一天就开始准备了。并且它是无法保存的。您必须在烘烤不久之后完成这道菜。'
