  md: '的自负。这种自负指的是习惯性的成功，然而谦虚也许意味着一种恐惧。不管怎么说，都要当心。自作主张、一意孤行则通常是傲慢的无知。


    但是，我们相信一个充满自信的久经沙场考验的富有经验的人能够走向成功。充满智慧又有自知之明的人是我们学习的榜样，我们应该跟随他的脚步。


    # 16. 效率


    所谓效率就是以最少的资金、时间和劳动成本获得最大成果的能力。这种效率极其罕见，拥有这种效率的人不需要惧怕任何的竞争。


    人们在每项事业中几乎所浪费的劳动总比他们付出的劳动多。


    比例通常多达十倍。他们在鸡毛蒜皮的事情上花费了无数的工作时间，这与他们的才干严重不符。他们缺乏工作时间表和日程安排计划。他们就这样浪费了时间。倘若改掉这种浪费时间的恶习，那他不会仅仅是完成他能力范围内一半的工作。


    然而广告行业却很可能滋生这种莫名昭著的低效率。广告业在这种浪费中生存下来充分显示了其奇妙的潜在能力。你会注意到很少会有花昂贵成本的广告展示出巧妙的推销术。很少有广告具备使人信服的说服力，否则广告会使人采取行动或做出决定。


    如果一个周薪 25 美元的推销员亲自尝试与那些广告相似的推销方法，那么他也许会丢掉工作。


    有太多的广告文案作者把所有的人们看做成一个整体，他们说话像撒草种子一样漫无边际。其实他们需要的是明确固定的目标人群、针对不同的个体和典型的潜在客户来创作广告文案。向某人介绍产品时要像你们面对面的交流一样。找寻一切办法去完成推销任务。但又有多少广告能达到这些基本的标准呢？'
