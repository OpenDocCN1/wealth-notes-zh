  md: '被远远的甩在后面。许多广告行业现在被认为还算可以，但当一个领跑者出现的时候，他们看起来将会非常的糟糕。而现在他们只是糟糕而已，仅是过时罢了。而且，有些人知道这一现状。


    # **40. 基本规章**


    在一个现代政府中，第一个不可或缺的要素便是一部宪法。建立公司的第一步是制定公司的章程及其附则。


    在这样的情事中，我们认识到了对基本法律的需求。但是我们却很少将他们运用到日常事务中。我们经常被一时的条件或是冲动所左右。这样做的结果只能使过程变得曲折。


    一个行为往往会阻碍另一个行为。我们必须根据一定的原则和方法作出决定并朝着一个目标不断的前进。在我们证明这些原则和方法是错误的之前我们应该坚持。


    然后，那些代替他们的原则和法则也应该同样地不可轻易变动。而且，每一个细小的行为都应该通过这些原则和法则来衡量。


    否则我们将会偏离原有的轨道。


    每一个情绪或是每一个环境都可能使我们偏离自己的轨道。并且我们将永远不能到达我们的目的地。这适用于广告政策，也适用于广告方法。这一原则一旦被采用，就不应该被改变或者被废除。


    因为很多经过深思熟虑的原因，这一原则应该被很好的保留下来。


    # **41. 自力更生**


    不要过分依赖经销者们来帮助培养你的雄心。公平地对待他们，证明他们的服务是正当的。尽量协调他们与你自己之间的利益关系。他们的友善是重要的。但是不要期望他们会为你而战。


    他们有自己的竞争伙伴要打。'
