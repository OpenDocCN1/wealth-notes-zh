- pgno: 275
  md: '承。被用来影响人们的判断力的恭维与赞美相去甚远。在任何值得成功的企业，一味奉承讨好带来的只有轻视。


    如果你想去领导别人，那么就做的像一个领导者。价值是每次商业交易中的问题所在。为那些和谄媚者一起投资广告行业并作为领导者的人哀叹。如果有必要，做一个合格的农民更好。你遇见的大人物非常明白这一点。


    # 13. 黄金法则


    最伟大的商业准则是黄金法则。但是，人们用了两千年才发现这一点。不顾他人的权利、唯利是图曾经使商业成为一种羞辱。自我主义成为指导精神。顾客通常是像羔羊般温顺的人、工人奴隶和竞争对手的敌人。但是在绝望的山谷中，商业吸取了一个教训。聪明人中的加里，洛维特和麦考密克夫妇都运用了黄金法则。


    如今，竞争对手成为了朋友，董事们是受托者，消费者是监督者，同事是伙伴。请注意不同的方面。商人们现在被看作是社区的建设者。在繁荣昌盛的征途中，他们作为十字军战士，作为社会主义的领导者。也应该注意到更健全的商业结构。注意到它的更大的利润。


    每个章程的第一个条款应该是这条黄金法则。每个商业课程的第一节也应该是这条黄金法则。应该将这条黄金法则贴在每个办公室的墙上以示众人。用这条黄金法则衡量人的一言一行。没有这条，黄金法则而取得的收益必将在其手中枯萎。他们形成一个颤抖的、不稳定的结构。并且他们适时的出现以象征着轻蔑。


    # 14. 挑选人才


    在商业领域，伟大的成功主要归功于挑选人才的技能。实际上，一些其他的行为是如此影响深远，如此的持久稳'
