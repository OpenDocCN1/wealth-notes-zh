- pgno: 194
  md: '但作为广告业的销售人员，霍普金斯先生无可匹敌。


    他为广告商赚取的利润，其文案所涉及的产品种类，比其他任何文案作者都多。


    过去 20 年里取得的最大成功中，有许多要归功于他设计的出色文案和方案。


    而且他的方法很安全。他经验丰富，足以避免任何困难。  他才华出众，足以使潜力转化成利润。


    我们的文案部，以霍普金斯先生为首，个个都是最厉害的人。


    我们不顾需要支付的薪酬高低，仅凭他们的出色表现，而选出了他们。


    我们时时刻刻在到处寻觅那些创下非凡记录的人才。


    在广告业的波涛中，在这所经验的学校里，这些人不断地  提升自己的能力。


    他们每个人都向霍普金斯先生汇报工作。所有的文案都要  经过他的批准。


    # 我们的咨询委员会


    我们的咨询委员会由 16 人组成，他们都是广告大师。


    每个人都有着非凡的才能和丰富的阅历。


    该委员会以霍普金斯先生为首。


    现有客户和潜在客户提出的所有重大问题，都会经过全体  委员会成员的商讨。'
