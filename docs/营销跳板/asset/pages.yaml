- pgno: 242
  md: '有该产品或服务的好处超过他所花的钱。


    如果你想让大量的人购买你的产品，那你就必须知道，你产品中的什么可以吸引他们 “慷慨解囊 ”。你必须知道，他们看重什么。你必须知道，他们与你的产品相关的最深的痛苦和梦想都是什么。你必须知道，他们是如何思考的，以及他们想要看到怎样的销售方式。你需要了解与他们有关语言用词。你需要尽可能地理解一切。


    大多数的企业发布的销售信内容都是，“这就是我们的产品，它有这些功能。难道你不想购买它吗?” 他们将销售信寄给的一群人，可能根本就不是理想的潜在客户。而之后他们还在疑惑，为什么广告没有发挥作用。


    一定要进行调查研究。这是使你能够赚到理想金钱数额最需要了解你的潜在客户的想法：


    了解你的竞争对手；并且建立你自己的独特销售卖点。


    你可以按照客户具体要求，把这些问题修饰一下，或者删除现存的这些问题，把你自己的特色加入到你的行业和公司中。


    对于每一个问题，你都可能给出很多个答案。因此，你可以记录下一些与众不同的、或者比较新颖的答案。


    可以将这些问题和答案保存起来，方便浏览回顾。当与其它要素一起分析的时候，这样做会对你帮助巨大。


    # 特征—先确定，后使用


    每件产品，每种服务，每个生意，都有多种特征。特征，就是的所有细节。特征包括颜色、尺寸、功能、成分、使用材料、服务时长等等。有关你的产品或者服务本身的一切都是种特征。而对于客户和潜在客户们而言，那些特征就意味着利益。


    在调查研究之后，你需要首先把特征找出来。但是，要在'
  merge: -1
