    广告文案作者是唯一的倡导者，他们控制了所有人的耳朵。在每个炉边，不管远与近，人们都在倾听他的逻辑。一个常见的结果是创建一个垄断企业。


    而且，在谢尔曼法案例中，法院已经决定这是备法垄断。但是，除非这些垄断企业为公共利益服务，否则他们是不长期合法的。


    强有力的广告通过一种惊人的方式指引或是误导人们。这样的广告和十亿有能力的军团一起为人类或金钱、贪婪或正义'
