  md: 所以，根本就不需要扭扭捏捏地害羞。也就是說，無論是不是真的覺得不好意思，只要認定自己是「很廣害」的人，整個人的人磁場都會變成那麼。所以，當別人讚美你一「很廣害」時，就真誠地接受讚美吧！這時只需要回一句：「謝謝」就夠了。受讚美時，不需要多餘的質問或辯差。因為不質問、不害羞的人，才是「財源廣進」的人！
