  md: '什麼我到最後還是愛情與金錢兩頭空呢？」所以，無論是紅心、方塊、黑桃或梅花都欣然接受，也就是必須先全盤接受好事和壞事之後，才能感受滿滿的愛與富足。因為所有撲克牌翻到背面，全都是同個樣貌，也就是「愛」和「富足」。無法變富裕的人、得不到愛的人，都是自己先選擇拋棄那些他不愛的牌。這些明白都是有次序、平均地分配給每個人，但這些自己丟掉牌的人，卻總是抱怨上天不公平，怨恨不平地吶喊：「為什麼我的牌特別少」「我的牌總是爛透了」。這些人只會說：「我從來沒得過任何一張紅心！」卻沒意識到，當初是自己放棄得到的機會，如今反而慣世嫉俗地抱怨。這麼做，只會導致自己手上的牌愈來愈少，更離自己想要的人生愈遠


