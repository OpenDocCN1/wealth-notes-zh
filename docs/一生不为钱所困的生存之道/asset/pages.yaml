- pgno: 41
  md: '# 收入與自己認同的自我價值成正比


    對於「有錢」這件事情的安全感，也可以用「自信」一詞來取代。愈有安全感，就愈有自信。愈有自信，不安的情緒就會相對地降低；換句話說，就算沒錢也不會感到驚慌失措。因為就算沒錢，自己依然處於「有」的狀態，仍能受到大家的認同與親近，還是能繼續過著心安理得、高枕無憂的日子。因為我們「有」的是，心中對金錢充裕的「自信」，而不是身外之物的「錢財」。或許很多人會異口同聲地對我說：「不可能，沒錢就一定會失去自信。」一雖然大家嘴上都這麼說，但其實只是因為還不了解，有沒有錢與信。


    第二章 話說回來，「錢」到底是什麼？'
  merge: -1
  img_proc: true
- pgno: 42
  md: '自信是無關的。經過口袋空空卻仍然安心的人，個個都會說：「本來以為自己會失去自信，事實上並沒有呢！」沒有錯！無論是金錢、富足生活、愛情、自由、魅力、或能力，全都如出一轍；會害怕失去這些的人，只是還沒發現，這些東西為我們帶來


    的自信，並不會因為眼前看不到就消失殆盡。


    之所以會害怕，是因為現在「看不到」而已。然而，和空氣一樣「看不見，但依舊存在」的，就是錢（富足）。


    事實上，我們真的「擁有」；所以就算沒錢，跛到橋頭還是會自然直；就算沒有錢，也沒什麼大不了。只要能這麼想，就不會再對錢執著，需要多少錢，錢就會乖乖入袋。就好比空氣，因為我們知道隨時隨地都吸得到，取之不盡用之不竭，所以根本不用擔心有天會把空氣吸光，而刻意停止呼吸。


    其實，我們只是看不到自己有錢，所以根本沒什麼好擔心的。不必'
  merge: -1
  img_proc: true
- pgno: 43
  md: '再有人憂天了，只要意識到自己不管有沒有錢都是自由之身，那自然而然就能過著豐富的日子了。換句話說，每個人都處在能隨心所欲地」呼吸」，也能自由自在地「吐氣」的狀態中。自信的程度，就是當足的程度，也就是收人
    的程度（有了了解錢會再回來的程度）。 相反地，對自己沒信心的人，會擔心沒錢的話，天就會塌下來，所以以一天到晚坐立難安；這就是因為他們認為「不努力 ev 賺不到錢」，因此，總處在十分焦慮的狀態。因為沒安全感，所以才想要有錢。因為沒安全感，所以才會死抓著錢不放。因為沒安全感，所以錢一進來就必須趕快存起來。但是，愈存愈惱。


    # 第二章 語說回來，「錢」到底是什麼？'
