  md: '![](img/a99c77dc5cdbf0805e4d8ba66f7d5233_224_0.png)


    # 臉不紅氣不喘地說自己「很厲害」


    只要提高自己的「存在薪」，大富大貴就會隨之而來。只要能認同自己「很厲害」，就能提高「存在薪」，同時也能晉升為財源廣進的人。

    但要說自己「很厲害」是需要勇氣的。

    很多人光是這麼想，就覺得不好意思。

    大部分的日本人都很害羞，要他們老王賣瓜般自賣自誇，是很不容易的事。

    我們失敗時，會覺得很丟臉；要別人幫忙，也會很不好意思；被拿來與別人作比較時，會感到害羞；更別說連受讚美都要尷尬半天。

    因為我們待人處事時都謙虛有禮，所以才會這麼害羞。

    但是請你仔細想想，這些事其實沒什麼不好意思的。'
  merge: -1
  img_proc: true
- pgno: 225
  md: '就算失敗、嫉妒別人、比不上他人、太優秀⋯⋯這都沒什麼大不了的。這些事在世上比比皆是，不會有人特地因為這樣來取笑你、甚至妥加批判。

    真正覺得不好意的人，其實就是自己而已。

    要我說自己「很厭害」，其實一開始我也覺得非常不好意。但是因為我知道，只要認為自己「很厭害」，就真的會發生「很厭害的事」，所以我就「決定說自己很厭害」了。

    雖然如此，我還是覺得很害羞，還得裝作自己沒什麼了不起。但別人家要是說我「不厭害」或是「沒什麼了不起」，則讓我感到焦慮難安。

    儘管如此，我那時還是不好意說自己「很厭害」，結果就一直厭害與不厭害之間矛盾糾結很久。

    現在回想起那種感覺，我不禁納悶，到到底我們要對別人客氣到什麼


