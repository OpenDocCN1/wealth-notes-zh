  md: '有錢人常常說：「不知道這…路上到底發生了什麼事，當我…問種，就突然變這麼有錢了。」「不知道到底發生了什麼事」就是有錢的「關鍵」。因為「不知道到底發生了什麼事」就是「外力」運作的結果。參加心屋敷會員的每月例行讀書會——Be訓練課程——的學員中，有許多提起勇氣不再努力工作、不再努力上班、不再努力做事的人。但這些人「不知道到底發生了什麼事」，他們明明比以往在上班時，展開更多的旅行、穿更好的衣服、吃更好的大餐、做盡自己喜歡的事，卻「不知道為什麼」比以前更有錢了。像是得到父母贈予的錢財；公司撥給他們超乎想像的退休金；結交非常有錢的朋友；發現不知不覺中存到的一大筆錢，這都是超常識範圍「不知道到底發生了什麼事」的錢財主動找上門。


