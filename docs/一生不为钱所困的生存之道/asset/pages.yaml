  md: '# 前言 成為不用為錢煩惱的人，一起變有錢！


    本書重點在於提供各位「不必再為錢所困的方法」。一提到錢，總會給人航髀、貪婪、沒格調……的刻板印象；不過，人還是對錢趨之若鶩。但即使如此，我們仍然裝作一點也不愛錢的樣子。話說回來，我相信世界上應該沒人不想要錢吧！就像在我每個
    household 都舉辦的心靈成長讀書會——心屋塾 Be 訓練課程中，人氣最高的聚會總是和錢脫離不了關係。 其實人人都愛錢，而且還希望愈多愈好。我在做心理諮商時，有「金錢方面的問題、煩惱」的人也不在少數；我聽到許多心聲都是：「如果有錢就好了」。我也曾為錢痛苦過，所以非常能體曾錢到底多重要。不過託各位的福，我現在已不再需要為錢煩惱了。


    # 前言 成為不用為錢煩惱的人，一起變有錢！'
  merge: -1
  img_proc: true
- pgno: 4
  md: '本書正是我從那段為錢煩惱的過去死裡求生後，試著將所得的智慧，以白紙黑字將「不必再為錢所困的方法」編撰成書。這也是身為心

    理諮商師的我，第一本和錢有關的著作。請千萬別誤會！這不是一本教人怎麼賺大錢的書。


    而且我還要提醒各位，你不曾因為讀了本書就馬上晉升為億萬翁（其實是能做到的，只不過這不是本書的目的，所以我才不這麼說）。如果想過著不用為錢煩惱的人生，這本書絕對就是你的救命寶典！像是「錢不夠用，一天到晚都要為錢傷腦筋」，或「如果有錢，我就可以過更好的日子了」、「為什麼我必須過這種窮苦生活！」，還是「我恨死那些有錢人了」，甚至是「真羨慕那些不用努力就能輕鬆賺大錢的人，老天爺真是太不公平了」等等……


    從此，你可以不再慣世嫉俗、也不必眼紅別人、更不需要為了這些事把自己氣得死去活來；這本書能幫助你變成不必為錢煩惱的人。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '接下來，就讓我們一起探討如何變有錢的學問吧！


    開始前，我必須先提醒大家一件事情。我們到書店常常會看到很多「教我們如何賺大錢」、「理財指南」、或是告訴我們「如何成為億萬富翁」等各式各樣的書，這類的書籍刊物琳琅滿目，不勝枚舉！


    這麼多與錢相關的書籍被出版，就意味著和錢有關的書通常都相當熱銷。這就是告訴我們，有超過成千上萬的人都努力汲取和錢有關的知識。


    如此看來，看過這些書的人都能變得很富有嗎？我想，其中當然有人能變成人人稱羨的億萬富翁。只不過無法成為有錢人的一定占多數，不然這些與錢有關的書籍怎麼會如雨後春筍般持續上市呢！而且就算是有書讀者，也一定有人無法成功地改頭換面。


    為什麼讀了教我們如何變有錢的書後，還是無法變成有錢人呢？


    # 前 言  成為不用為錢煩惱的人，一起變有錢！'
  merge: -1
  img_proc: true
- pgno: 6
  md: '那是因為這些人學到的只是「變有錢的方法」；不管學會再多「變有錢的方法」，仍然無法變成有錢人。

    有錢的方法」，仍然無法變成有錢人。

    之所以會這樣，是因為「方法」錯誤。我們該做的，不是沒沒營營去「變有錢」，而是應該學習金錢的「擁有方式」和「過有錢的日子」。

    錢不夠用的意思，其實就是跟「過著有錢的日子」完全背道而馳！

    我想告訴大家的是如何「過著有錢的日子」，而不是「變有錢的方法」

    式」。也就是「Being」（擁有金錢的方式），而不是「Doing」（賺錢方式）。

    即使學再多賺錢的方法都無法富裕，就是因為金錢的「擁有方式」出了問題。只要修正原來本末倒置的「擁有方式」，就能改變「賺錢方法」

    式」。

    而金錢的「擁有方式」，指的是我們看待事物的「預設立場」。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '首要之務，就是改變以往的「預設立場」（思考準則），這正是本書的宗旨所在。

    人類的大腦，通常會被「預設立場」中的刻板印象所影響。像是有些人凡事都往悲觀的方向鑽牛角尖；有些人則動不動就認為別人想害他；也有人不管做什麼都力求完美；當然，你也會遇到無論發生任何問題，都覺得是自己錯的人，或正向樂觀的開心果，卻或是容易相信別人的人……。

    我並不是說有這些傾向的人就問題。有這些傾向其實沒什麼大不了，

    了，因為每個人的個性與氣質都大不相同。

    我要強調的是，如果因為這些傾向而造成自己覺得日子過得很苦、難以在社會求生、怨天尤人、或是為錢所困的話，那麼，只<|message|>要改變這些想法，簡單單就能讓自己變成輕輕鬆鬆賺大錢的人。

    換句話說，若是這類想法太過頭，不妨踩一下剎車；如果問題出在


    前言 成為不用為錢煩惱的人，一起變有錢！'
