- pgno: 30
  md: 因為這樣，錢都不會主動靠過來！眼前有張千元大鈔，鈔票上並沒有標示「好」或「壞」。其實每張鈔票都長得完全一樣。換句話說，將錢貼上好壞標籤的，都是自己而已。正是因為自作聰明硬把錢分好壞，事情才會變成那麼複雜的。卮此，別再那麼嚴格地用「好」或「壞」來判斷不就行了！不用特地為賺錢找理由了。無論是「應得的錢」還是「不義之財」，反正都趕快進入我的口袋就對了！再說，我們只要把這些錢用在正途上就行了。以迅雷不及掩耳的速度賺錢，再以如流水般的速度把錢花出去（用在正途上）。我認為，趕快建立這套「金流」模式才是上上之策。讓金錢在世界上生生不息地流動。一旦這套金流模式建立起來後，
