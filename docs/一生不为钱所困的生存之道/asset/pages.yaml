  md: '經驗，第一步就是相信這件事。試著相信自己「真的擁有」。只要能做到這一點，「超乎常理」的事，就會發生在現實生活中。於是，藉由這個經驗就能讓自己真的相信這件事；接著，身邊的事都會照著你腦海中的思維來運作。問題就出在順序顛倒了。請先試著相信自己「擁有」。試著改變以往根深柢固的觀念、信念、常識，也就是改變原來的「預設立場」。只要能改變原先的想法，現實生活就會開始產生變化。然後，你就可以開始「看見」你「擁有」的證據。這樣，你才能真的「意識到」自己「擁有」富足。富足指的是什麼呢？富足指的是錢嗎？有些人認為是錢；也有人認為為，即便有錢也稱不上富足。


    # 第四章 到底什麼是該財運亨通的「金錢擁有方式」？'
