  md: '花你努力認真、找到一份好工作、討人歡心前，請先了解：就是自己什麼也不做的前提下，你原本就有資格得到比自己想要的錢還更多的「富足」。唯有你這麼想，錢才會開始流入你手中。一旦你了解這件事之後，無論你花多少錢、或是得到多少錢，都不會心慌——愈花錢還會愈覺得自己依然很有錢。因為自己是值得花這些錢的。而只要自己是被愛的。競爭自己是受大家肯定的。如此一來，金錢也會流動得更順暢。當你能認同自我價值，等於相信自己就算什麼也不做，仍能受到替


