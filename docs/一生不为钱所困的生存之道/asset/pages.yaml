  md: 因為，所有的撲克牌背面全都是相同的圖案。所有人的冇生撲克牌背面，也都同樣寫著「愛」和「富足」。也就說，所有的事情只要挖摟到深處會發現，一切都是用「愛」和「富足」成就出來的。若是說「我只要紅心就好」、「我想要有愈多張方塊愈好」、「我最討厭黑桃了」、「我連一張梅花也不收」，而只想拿自己要的牌，那能得到的牌，就會變得愈來愈少。如果進一步更挑剔地說「我要這顆紅心，但不要那顆紅心」或「我才不要紅心三」之類的話（就等於在說：「我只想得到這個人愛情，不要那個人愛」），就會加快失去撲克牌的速度。也就背而寫著「愛」和「富足」的牌，都會變得愈來愈少。結果明顯就是自己挑三揀四，不要那些撲克牌，還怨天尤人：「為
  merge: -1
