- pgno: 112
  md: 伊索寓言中，有隻吃不到葡萄就說葡萄酸的狐狸。這則故事大意是這樸的：葡萄樹上的葡萄看起來非常甜美，但因為葡萄樹長得太高，以致狐狸摘不到看似近在咫尺的葡萄，便惱羞成怒地說：「反正那麼酸的葡萄我也不想吃！」「我的肚子一點也不餓。」「那麼酸的葡萄，就算送我也不要。」「難吃的葡萄只會讓人吃壞肚子，我才沒那麼傻！」原本光是看到葡萄就快流出口水的狐狸，因為吃不到葡萄只好放棄。為了不讓自己內心受傷，就催眠自己根本不想吃葡萄。也就是催眠自己否定葡萄（||富足）。進而「行放棄葡萄（||富足）。」但是聽到這，不禁讓我納悶，因為葡萄樹下說不定有梯子能爬上去呢！
  merge: -1
