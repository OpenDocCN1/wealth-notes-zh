- pgno: 49
  md: '# 什麼也沒做，就能領到的錢叫「存在薪」


    接續前述話題，收入與自己認同的自我價值成正比。「自己認可的自我價值一愈高，就能得到相對的高收入（\財富量表的測量結果\）。


    也就說，富足程度、安全感、甚至是這些結果表現出的現金，全都會變得多。


    請問，你認為自己值多少錢呢？


    請試著回答下列問題：


    你一天到晚都工作、對社會沒任何貢獻，不但沒一點成果可言，還不斷造成別人麻煩，成天不是休息，就是睡覺。請問這樣的你，每個月能得到多少錢呢？


    第二章 話說回來，「錢」到底是什麼？'
  merge: -1
  img_proc: true
- pgno: 50
  md: '處在這種狀態的人，不是嬰兒就是臥病在床的病人吧！

    如果是這種情形，問題就不該是「這樣的自己有多少價值？」而是「你認為這樣還有價值嗎？」也就是自己所認同的「自我價值」。

    衡量所謂的「價值」，具體指標就是「存在薪」。這就是什麼也

    能做、不會對任何人有貢獻、一無所有的自己應得的「存在價值」。

    沒有任何貢獻、米蟲、只會麻煩他人的自己可以領取的收入，就是

    所謂「存在薪」。

    你覺得這樣的自己，能領到多少錢呢？


    一

    百萬日幣（約台幣三十萬元）？

    每個月二十萬日幣（約台幣六萬元）？

    五萬日幣（約台幣一萬元）？'
  merge: -1
  img_proc: true
- pgno: 51
  md: '我在心屋塾提出這個問題時，有許多人甚至認為，這樣的自己一文不值。這個答案，就是你對自己衡量出來的自我價值。回答零元口幣的人，認為沒有用的自己，價值零元口幣。回答二十萬口幣的人，認為沒有用的自己，價值二十萬口幣。這個答案，就是你認為自己值多少錢，也就是你腦海中認為自己應得的基本薪資。


    「存在薪」（基本薪資）低的人，就是因為覺得自己沒什麼價值（也 就是沒自信），所以，必須不斷努力以提升自我的價值（血汗薪）。想辦法做對他人有貢獻的事；做讓別人認同自己的事；討人歡心；提高工作效率及成果；為他人犧牲奉獻：：：。


    # 第二章 話說回來，「錢」到底是什麼？'
