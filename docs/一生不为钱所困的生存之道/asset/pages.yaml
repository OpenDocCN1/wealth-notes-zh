- pgno: 46
  md: '如果各位將「錢 || 薪資 || 現金」定義成這樣的話，那無論你賺多少錢都不會滿足的。

    因為只有「物質」的心理，是不會感到充實和滿足的。

    請各位回想一下，我們在前面章節中探討過的事情。你真正想要的東西是，內心的安全感與富足，沒錯吧？

    這些或許能用金錢換得，所以我們才想要有錢，對吧？

    因此，我所指的金錢，並不侷限於狹義的現金，而是附加在金錢之

    後，所得到的富足與安全感。

    如同我在前面提過的，我們不會因為有錢就感到安心，而是因為安

    心了，錢才會一直來。也就是說，自己的收入並不是由公司決定，而是

    我們讓自己感到安心，才「讓公司幫自己」決定薪資的。'
