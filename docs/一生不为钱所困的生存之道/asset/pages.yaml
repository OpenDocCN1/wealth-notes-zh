- pgno: 115
  md: '# 第一階段：錢跟空氣一樣；

    能意識到自己「有錢」是很重要的


    要養成財運亨通的「擁有方式」，第一個階段就是，要能意識到自己「有錢」。


    已「有錢」。

    發現自己其實「有錢」，具體說明如下：


    我「擁有」金錢或寬足，就像是擁有取之不盡、用之不竭的空氣一樣。


    無論是誰都能呼吸到空氣，錢也是。


    金錢 || 空氣


    ![](img/a99c77dc5cdbf0805e4d8ba66f7d5233_115_0.png)'
  merge: -1
  img_proc: true
- pgno: 116
  md: '只要能這麼想，金錢或富足就能像空氣一樣，收得心安理得。

    這是讓自己財運亨通的第一步，就是了解金錢或富裕都像空氣般「看不見，但依舊存在」。

    但是要這麼想似乎非常困難。

    我在部落發表「金錢‖空氣」的論點時，有很多人都留言：「完全不知道你在胡說什麼！」

    本書的讀者，一定也有很多人心會浮現許多問號。

    那麼，為什麼我會說金錢‖空氣呢？

    請看看接下來的說明。

    地球上每個人都會呼吸。就算是有人每次呼吸都吸得特別大口，也不

    會只有那人同遭的空氣特別稀薄，或是誰周遭的空氣特別濃厚。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '寬闊的、普遍的、平等的。

    不必為了讓自己飽飽，就獨占空氣；也不用為了能一鼓作氣收到特

    別人口的空氣，而刻意把空氣儲存起來，因為我們所需的空氣就圍繞在身邊，且不停止地流動。

    雖然這些空氣多到不怕被用盡，但是就算我們眼晴睜得再大，也看不見任何空氣，這實在相當神奇！

    既然如此，那我們又如何能確定「擁有」空氣呢？為什麼我們相信這些空氣不會有用完的一天？

    全世界的人，都確信自己「擁有」空氣、也不怕空氣用完。

    相信也是這麼認為的。這就是存在每個人的腦海中的「預設立場」。

    沒相

    人教我們：「請付出努力撷取空氣」、「請珍惜你呼吸到的每口空氣

    氣——…。



