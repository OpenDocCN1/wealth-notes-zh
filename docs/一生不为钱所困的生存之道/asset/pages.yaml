  md: '會遇上加薪的好事，也不可能所有人都因此過著富裕的生活吧？

    我回答他：「會這麼想的人，就是不信任別的人，何必去管別人到底發生什麼事呢？請不要擅自以為『自己』就是這些幸運兒之一。

    你必須更相信自己才行。孤陋寡聞的你，因為自己寥寥可數的所見所聞，就擅自決定『不會改變』，所以才會有這個問題的。對有錢人來說，這些都是理所當然的事！

    因為大家都搞錯金錢的『擁有方式』，所以 asset？沒辦法個個都變成有錢人啊！

    那些不用再為錢煩惱的人，之所以會照我的去做，並不是因為『這樣好象可以賺到大錢，所以才……』。

    他們不過是『試著去相信』這個超乎常理的想法。光是這麼做，就能讓你意識到『自己擁有的富足』，進一歩發現『自己是値得收下這此富足的存在』。'
