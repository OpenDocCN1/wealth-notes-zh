  md: '住著一位名為奈勒斯的小男孩。他手上那條總是形影不離的毛毯，是他從嬰兒時用到現在的；奈勒斯只要握著這條毛毯，就能穩定心神（）。因為這個「預設立場」對你來說，不但是理所當然的真理，也已經變成你的常識，所以，你不曾懷疑過預設立場的對錯。


    但是，如果你不想再為錢所困，或是拒絕再被錢耍得團團轉，那請你至少懷疑一次自己的「預設立場」吧。發生在你身上的「金錢問題」，就是警告你：「『預設立場』有點偏了喔！」的徵兆。


    這時，你必須捨棄這條從孩提時代就不離于的「毛毯」，也就是得顧覆你原有的「預設立場」才行。


