- pgno: 228
  md: '如果發生什麼事，不但別人很容易伸出援手，自己也較容易開口向人請求援助。如果如此一來，互相幫助的循環一下子就擴大了好幾倍。

    之所以無法開口對他人說：「請幫我」，都是因為認為為，受到幫助就一定要求回報。換句話說，有「受之點滴當湧泉以報」想法的的人，就是以為自己不值得接受幫助，所以才用盡力氣報恩。

    如果認同自己「很厲害」的話，就會覺得自己值得大家幫助；就算一直處在只接受眾人幫助的情況 下，也只要以一句「謝謝」就能讓伸出援手的人感到心滿意足。

    說出「謝謝」二字的當下，就是認同自己很厲害的時刻；換句話說，也就是已經意識到自己真 的非常優秀。'
  merge: -1
  img_proc: true
