  md: 然而，「琳瑯滿目的好物」或「富裕的日子」，卻持續出現在你的生活中。我想告訴各位的是，如何意識到生命中「已經擁有許多次美好的事物」（擁有方式），而不是「讓許多次美好事物發生的方法」（賺錢方式）。物一（擁有方式），而不是「讓許多次美好事物發生的方式」（賺錢方式）。沒意識到自己「擁有」的人，或根本不想知道自己已經擁有的人，就算是「再」給他更多金錢財寶、更當裕的生活，他也會堅持有原來的論調：「只有這麼少，根本一點都不夠用」、「我什麼都沒有」……。因此，如果繼續保持現在的金錢「擁有方式」，就算你擁有再多錢、無論去到何處、甚至中樂透、早已過著人人稱羨的生活，現實生活也只會延續你腦海中認為「仍然不足」的日子。
