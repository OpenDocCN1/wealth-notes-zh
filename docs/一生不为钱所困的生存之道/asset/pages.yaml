  md: '隨之而來的，就是與這些壞習慣相呼應的現實。你要選擇哪一種想法，都是你的自由。只要選一種你會喜歡、舒服的方式就行了。但是，如果你想著不必為錢煩惱的日子，選擇有錢人的思考模式來過生活，可能會讓你比較愉快。本書的目的，是幫助各位戒掉壞習慣、修正觀念上的偏差。因此，想戒掉這些壞習慣，現在就可以開始。就算你現在還無法相信這些事，也可以開始嘗試看看！


