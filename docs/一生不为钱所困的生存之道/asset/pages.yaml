- pgno: 170
  md: '# 依喜好作決定，而非「價錢」


    本章將和各位具體探討，能財源廣進的人都有 depressive *?* 只有不斷修練，就能改變自己與金錢相關的「擁有方式」。

    修練，就是不斷地練習，直到將它變成潛意識的習慣為止。接下來，將介紹改變「擁有方式」之前，必須先修練的「招式」。

    請各位先從自己做得到的部分開始著手就好。

    首先要向各位介紹的，就是養成「依喜好作決定，而非價錢」的習慣。嘴上總掛著「錢不夠用」這四個字的人，一輩子都用「金錢標準」來作判斷。購物時，並非依照自己的喜好判斷，而是取決東西貴不貴、便不便宜，值不值得這個價錢。'
  merge: -1
  img_proc: true
- pgno: 171
  md: 我以前也一直是如此，我最愛的就是「俗又大碗」的東西。結果，只是一直累積買回「便宜沒好貨」的怨氣。就是因為自己不斷重複這樣的事，才把自己推向「不知道為什麼錢愈來愈少」、「一直都沒錢」的地獄中而無法自拔。以「金錢標準」度日，只會讓自己無法逃離惶恐與不安的世界，進而失去自由。因為一生都得活在算錢度日的生活中。由於執著錢的多寡，擔心自己遲早把錢用盡，而放任恐懼與不安如影隨形地糾纏自己。嬰從惶恐與不安中解脫並得到自由，只要提起勇氣以「喜好標準」作抉擇就可以；選擇讓自己快樂的結果，拋棄心中的「金錢標準」。像是購物時，試著先無視商品價格，並選擇自己喜歡的物品。
  merge: -1
  img_proc: true
- pgno: 172
  md: 這對以「金錢標準」活到今天的人而言，無疑是一大挑戰。雖然改變需要很大的勇氣，但試一下又何妨？只要能依照這樣嘗試改變，會發現自己的世界正慢慢地產生變化。這是很好的機會，讓你發現自己「真正」想要的東西是什麼。我們雖然都說自己很想要錢，但真正想要的東西，並非代表金錢的那張紙鈔或硬幣；而是當我們有足夠金錢時，就能「自由選擇自己喜歡的東西」。就算沒錢，只要能行使選擇的自由，就不會執著金錢或為錢煩惱了。這麼一來，快樂與富足就接踵而至，非常不可思議吧！
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 以「有錢」的姿態去花錢


    我說：「請別看標價購物」時，就會有很多以悲戚的語調訴苦：「那是有錢人才能做的事。」「有錢的話，誰不想這麼做！我們是連選擇的錢都沒有呢！」各位，這麼想就錯了！事實正好相反。這就像在說：等我學會游泳時，才去海邊玩。這就像在說：等我變瘦了，再穿泳衣。如此就本末倒置了。不要因為沒有錢就輕言辦不到，試著以「自己很有錢的姿態」去試試。把以前用「金錢標準」選擇的物品，試著重新依白己喜好再選一次。


    第五章 發成財源廣進的習慣'
  merge: -1
  img_proc: true
- pgno: 174
  md: 就象不用等减肥成功再穿泳衣，就算用撑的，也要撑進泳衣裡試試。如果以「沒錢」的預設立場作選擇的話，在現實生活中就會看到沒錢的那一面。等你試著用「有錢的前提前行動時，就會意外地發現自己很「富有」。有人告訴我：「我實在很窮。我要真是去買喜歡的東西，恐怕會連這個月的手機通話費都付不出來。」但這位老兄的言下之意，不過代表他「有」繳這個月手機通話費的錢！不但擁有三餐無虞的伙食費、通勤費、手機通話費、跟朋友見面際的娛樂費，甚至連買雜誌的錢都不用擔心。不妨把花錢的優先順序，從「必需品」改成「喜歡的東西」。「喜歡的東西」指的是能「提振精神與活力的事物」。
