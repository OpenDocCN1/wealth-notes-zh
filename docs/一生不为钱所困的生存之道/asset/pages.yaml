- pgno: 222
  md: '換句話說，我最後就是免費讓他們使用「心屋」的招牌、知名度、業績與信譽。

    但 是當我把自己成功打響名號的「戰果」，愈沒限制地借給講師們盡情使用時，這些講師們就更活躍，相對地，「心屋」的知名度也跟著水漲船高起來。

    我就算什麼也沒做、什麼也不做，還會因為他們的努力，讓我的書更暢銷、會員人數也不斷增加、營業額更屢創佳績。

    我從講師們那裡得到的，並不是直接的金錢交易關係，但這些錢像是我繞了一大圈，又跑回來找我。

    所以說，吃虧就是占便宜。

    愈能與他人分享自己的「戰果」、「結果」必會以某種形式回報。'
