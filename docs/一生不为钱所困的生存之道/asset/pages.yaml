    如果這樣仍無法調整心中的預設立場的話，那就試著先往前「看

    看」哪些是改變後會讓自己覺得害怕、討厭、或不習慣的事情就行了。

    而照這個方式調整內心原有的「預設立場」就是本書的目的。我要教各

    位的，正是如何改變「預設立場」。

