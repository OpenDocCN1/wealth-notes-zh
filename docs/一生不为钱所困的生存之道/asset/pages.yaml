- pgno: 227
  md: '情後，之前不好意斯的感覺就一掃而空，現在我已經能落落大方地接受我「很厭害」這件事了。我認為之前會不好意斯的感覺，全是因為自己在為內心的惶恐鬧。明明我很厭害，為何沒人發現呢？怎麼沒人理解到我的優秀呢？為什麼大家都了解我呢？以為不被了解而鬧扭。如果是這樣的話，那就要從一開始先認同自己就了——也是同意自己很厭害。如果能做到這一點，就不會再覺得鬧扭，也不會再覺得不好意斯。如此一來，周遭的人也更容易親近你。


