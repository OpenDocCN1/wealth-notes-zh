  md: '這樣就能改變你對金錢的「預設立場」與「擁有方式」。只要這個想，金錢就會像空氣一樣順暢地流回來。不會沒有錢（∥富足∥），而且人人都不虧匱乏。只是你不接受、不打算接受、不認為自己能接受，而自行決定自己應該沒錢。因為自己從小就是被這麽教育的；因為自己只知道這件事；因為從小就對此深信不疑。愛情也是如此。「看不見，但依舊存在」。就算你以為失去了，但愛其實依然存在。問題就出在，你不願意接受而已。原來金錢∥空氣∥愛情！


