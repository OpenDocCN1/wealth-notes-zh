- pgno: 113
  md: '只要爬上葡萄樹，就可以看到甜美又豐碩的葡萄了。

    但是，由於狐狸惱羞成怒，自己把目光移開葡萄樹，結果沒發現葡萄樹下的梯子。說不定，狐狸若看到梯子，但覺得利用梯子爬上葡萄樹是「狡猾」的行為，所以棄而不用。

    你非常愛錢，心裡也非常渴望能成為富翁。

