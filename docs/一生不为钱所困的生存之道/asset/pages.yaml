- pgno: 216
  md: '孩子們要獨立時，最簡單的一句話就是「臭老媽」。要對母親喊出「臭老媽」這句話是非常有威力的。因為「臭老媽」這幾個字脫口而出的當下，就是否定父母本身與他們的價值觀。如果覺得自己在青春期沒叛逆過的話，那就不試著對母親喊：「臭老媽！」只講一次可能感覺不到什麼威力，繼續喊三聲試試。但是突然鼓起勇氣跑去對母親這麼叫囂，可能會被怒斥「你說什麼麼！」一結果反而是自己被嚇到驚慌失措；為了避免發生這種事，不妨自己先出聲練習。


    人在意他人的眼光，以致任何想做的事都不敢實行，或是覺得自己不被認同，這些都是太在意「父母想法」的證據。其實，我們根本不需要背負這樣的包袱過日子——沒必要非當「乖」'
