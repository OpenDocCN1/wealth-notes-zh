  md: '# 神社任務就是在化緣


    我之所以推薦各位進行神社任務的原因如下：我在二〇一〇年時開始提供免費團體諮商，原因是我的著作非常暢銷，我想回饋社會大眾，所以提供這項免費服務。另外還有一原因是，我想，那些真正有困難的人恐怕也付不出諮商的費用。我以為提供免費諮商，就會有許多真正需要協助的人前來。結果，沒想到就算不用錢，不會來的人還是不會來。即使不用錢，不會來的人仍然不會來。他們一定會找出一沒辦法前來的理由拒絕參與。'
