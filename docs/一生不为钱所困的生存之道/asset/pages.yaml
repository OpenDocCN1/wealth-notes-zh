  md: '![](img/a99c77dc5cdbf0805e4d8ba66f7d5233_215_0.png)


    # 現在就當個叛逆小子


    要讓父母幸福；自己是無罪的，父母的不幸與自己的存在無關。然後，要先認同「媽媽是幸福的」這件事，提高自己的「存在薪」，這樣就能開啟富裕生活的循環了。


