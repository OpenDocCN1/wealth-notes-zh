    不管你信不信，「有」就是有。 因此，就以「有」錢的姿態法行動吧！ 只  要能用這樣的心情去花錢，就能體驗到「有錢」的滋味。 也才能為金錢注入流動的力量。 依喜好而非「價錢」作選擇的習慣，將為人們帶來富足與金錢。


