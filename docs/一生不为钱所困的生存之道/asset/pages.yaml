- pgno: 110
  md: '# 別再吃不到葡萄說葡萄酸了！


    ![](img/a99c77dc5cdbf0805e4d8ba66f7d5233_110_0.png)


    前一章，我們試著找出為何錢來了，而你也不收的理由。本章要探討的是，能收下錢（II 富足～）的人該有的思考模式，也就是財運亨通的「擁有方式」須具備哪些先決條件。


    本書開門見山告訴各位，世界上數不清的理財書籍，都在教各位如何變成有錢人。而為什麼我們就算讀了這些書仍無法成為有錢人，主要是因為就算白花花的銀子送上門，我們也不會伸手收下。


    問題就在我們的盛裝器皿。


    就算有源源不盡的水流（II 賺錢技巧～），不斷注入傾斜的器皿，


    也只會從器皿中不斷流出而已。傾斜的器皿，不管怎麼樣都留不住水'
  merge: -1
  img_proc: true
- pgno: 111
  md: '的。造成器皿一傾斜一的原囚，就出在錯誤的「擁有方式」。所以，光是不断修正「賺錢方式」而非「金錢擁有方式」，無論學到多麼礙的技巧，也留不住金錢的。要改變金錢擁有方式，就要先修正腦海裡的思考方式。把盛水的器皿先擺正，是最基本的原則。接下來，我們針對該擁有怎樣的一「金錢觀」，一起進行更深入的探討吧。

    先從結論來說，想擁有財運亨通的「擁有方式」，得先經過四個階段。只要能按部就班地來，就一定能有足夠的金錢入袋。接下來，要介紹給各位的，都是超越常理的理論（因為有錢人都活在窮人常識外的世界），當你準備好打破以往的框架，請繼續看下去吧！


    # 第四章 到底什麼是讓財運亨通的「金錢擁有方式」？'
