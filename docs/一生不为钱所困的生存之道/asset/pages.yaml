  md: 很多人一看到有錢人，就會下意識變成伊索寓言中那隻「吃不到葡萄說葡萄酸的狐狸」。「能賺到那麼多錢，還不是靠那些見不得人的勾當！」「擁有再多錢，也不能得到真正的幸福！」「那種人的個性，一定很多問題。」「或是「有太多錢，只會招來大家厭惡的眼光」……等。說這些話的人，與伊索寓言中的狐狸有什麼兩樣呢？為了不讓自己傷心，刻意對自己最想要的東西或自己想變成的模樣視而不見。這種態度，就是「擁有方式」的偏差，也就是你一直以來對錢敬而遠之的原因。
