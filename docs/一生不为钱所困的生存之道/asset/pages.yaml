- pgno: 36
  md: '# 到底有哪些東西是你想花錢買的？


    ![](img/a99c77dc5cdbf0805e4d8ba66f7d5233_36_0.png)


    各位都想要有錢吧？我也很愛錢。但是有了錢之後，要拿這此錢做什麼呢？請問各位，是為了買什麼才這麼需要錢呢？


    定是因為有非想得到的東西，才說自己很想要錢吧！


    花了這筆錢，到底是想得到什麼呢？


    出國旅行？

    名牌精品、服飾或包包？

    每天到五星級餐廳或飯店用餐？

    帥氣又拉風的跑車？

    上沙龍或美容院？'
  merge: -1
  img_proc: true
- pgno: 37
  md: '到頂級燒烤店吃到飽？

    原來是這些東西唉！

    那麼，我想再請各位，你想透過這些消費得到的是什麼呢？

    買名牌包或上美容院，最終的目的是到底是什麼？

    如果有錢的話，就能買自己喜歡的東西；也可以上高級餐館享用頂級豪華料理；享受處處被人捧上天的快感；想去哪裡就去哪裡。而且，店員們都會卑躬屈膝地照料我這位貴賓。有錢就可以滿足心裡的種種欲望。所以，你想要的是…？

    安心 的感覺。


    第二章 話說回來，「錢」到底是什麼？'
  merge: -1
  img_proc: true
- pgno: 38
  md: '你真正想要的东西，其实不是钱财本身，而是擁有許多錢之後所帶來的滿足。「有錢」代表能得到「選擇的自由」。也就是從此不必忍耐、想怎樣樣、能實踐想做的事情並樂在其中。得不到想要的東西、只能不斷忍耐……你以後不必再背負那種悲哀、無奈、悔恨的包袱了。這是如此自由、富足的感覺啊！可以自由自在，盡情地想做什麼就做什麼，多麼地令人感到開心！


    如果你平常的日子已經得非常安穩，也覺得「自己是自由」的人，那你根本就不需要再為錢操心了。想有錢想瘋了、如果沒錢就會害怕到坐立難安、腦海裡時時刻刻想的都是錢、腦中不斷計算著金錢、為錢與人斤斤計較、甚至為了錢和人'
  merge: -1
  img_proc: true
- pgno: 39
  md: '發生爭執…。假如有安穩的日子可以過，就不需要像這樣被錢牽著鼻子走。而就算沒錢，也不足於恐懼、煩惱，甚至徹底要得團團轉。畢竟，你擁有貨真價實的自由之身啊！然而，會讓自己覺得「我沒有自由」的原囚，是你先入為主的觀念在潛意識中催眠自己：「我沒有錢」。但是，如果知道「有錢」與「錢會再來」的真理，日子的就可過得自由自在。讓自己這麼想，其實是自己可以作主的。只要像這樣認同自己「有錢」的事實，感受到安全感後，就不會再對錢如此執著。這麼一來，更不可思議的是，自己再也不會為錢煩惱了！而且還會變成金錢磁鐵，讓錢財主動靠過來，捨也捨不住。不過，到那時候，反而又會漸漸失去「想要錢」的心情。


    # 第二章 話說回來，「錢」到底是什麼？'
  merge: -1
  img_proc: true
- pgno: 40
  md: '這簡直就像老天開的玩笑！

    愛錢愛得要死時，卻窮得要命。

    沒想要錢時，偏偏錢又一直來。


    這跟之前提過的「錢用掉了，就會自己再回來」和「有出才會有入」


    似乎沒什麼不同。

    這一切都跟想像中的道理相反，對吧！

    如果到目前為止，你還是像鴨子聽雷一樣聽得霧煞煞也沒關係，

    把這當成是一套理論記下來就好。也是把原來「怎麼可能會有這樣？」

    的心情，轉換成「原來是這樣啊！」的心情，只要「認同」這件事就夠了。'
  merge: -1
