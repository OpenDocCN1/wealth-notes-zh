- pgno: 52
  md: '如果你做不到這些，就沒勇氣收下對方的錢。」「像我這麼沒有用的人，怎麼能領這麼多錢，這實在是太厚顏無恥了……」「因此，只收取和自己付出努力相對應的工資。這就是導致你不努力，就賺不到錢的罪魁禍首。相反地，如果先收下對方的錢，你還會不惜一切，用生命提供一相應的服務」。

    所以，就會很認真、很努力。

    而且，會再更認真、更努力。

    但是，因為自己不認同這些努力的價值，所以不會收下錢。導致，錢不會再來。

    結果，必須不斷地努力。而上，還要更努力。

    然而，因為不認同這些價值……（反覆）。

    所以，永遠遠遠都跳脫不出窮忙的框架。'
