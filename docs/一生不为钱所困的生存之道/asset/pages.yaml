- pgno: 22
  md: '# 與其想怎麼賺錢，不如去想怎麼花錢


    本章節開始前，先向各位公布一項調查結果，這份數據能讓我們更容易了解日本人的金錢觀。


    這是從藤野英人的著作《對投資者來說，比「錢」更重要的事》（星海社新書）得到的資訊。


    各位知道日本人平均一年捐款的金額有多少嗎？


    在日本，平均每位成年人每年捐出去的錢，竟然只有兩千五百日幣（約台幣七百三十四元）！相較下，平均每年每位美國人的捐款是十三萬日幣（約台幣三萬八千一百六十八元）。


    這並不是有超級富豪捐出天文數字才提高整體捐款金額，這項調查'
  merge: -1
  img_proc: true
- pgno: 23
  md: '事先已經排除部分特別有錢的人，完全出一般美國人的捐款金額中計算出來的平均值。在美國，即使是普羅大眾，捐出收入百分之三左右似平是天經地義的事。於此，日本人僅願意拿出收入百分之零點零八而已！教授下來談到哈佛大學畢業生，他們每年都回饋學校高達八百億日幣（約台幣兩百三十二億元）的捐款。東京大學畢業生回饋學校的捐款，僅有這個數字的四十分之一，也就是一年只有二十二到三十億日幣（約台幣六到八億元）而已。我們可以從這些資料得知：日本這個國家的國民是多麼不願意讓自己的錢變少！不想讓自己吃虧。不想看到白花花的鈔子飛走。


    # 第一章 你怎樣看待金錢呢？'
  merge: -1
  img_proc: true
- pgno: 24
  md: '不想用錢幫助別人。

    這似乎正 是日本人的金錢觀。在美國，事業有成的人士通常是樂善好施的，他們會舉辦慈善活動，或主動捐出巨額款項。「有錢人」這個封號，是對社會有貢獻的人才配擁有的代名詞；也就是說，這個封號在美國是具正面意義的。

    另一方面，日本的有錢人也很會捐款助人（說不定是我孤陋寡聞而已），所以，我們對有錢人 都抱持比較負面的刻板印象，認為有錢人為求利益不擇手段的人；坐擁大筆財富的人；可能背地裡進行骯髒勾當的人等。所以，就算這些有錢人捐出巨額款項，也只會被當成「用錢買美名」罷了。

    從這裡我們可以歸納出：美國人與日本人使用金錢時，有不同的'
  merge: -1
  img_proc: true
- pgno: 25
  md: '「預設立場」。

    大多數日本人會鑽牛角尖在，怎麼做才能把錢省下來來的問題，不然就是鎢鉛必較怕自己吃虧；相對地，大多數美國人會想怎麼花錢、錢該用在哪些事上。

    這正是所謂的金錢觀，也就是在「預設立場」成形時，非常重要的事。

    我們該思考的不是如何賺錢，而是要怎麼花錢。

    應該把錢用在對社會有貢獻的事上，還應該為了撫平自己對欠缺金的恐懼，而緊抓著錢不放呢？日本人之所以會下意識地重複緊緊抓住金錢的動作，是因為腦中對於「賺錢並沒有那麼容易」的預設立場始終屹立不搖所致。

    因此，只要去想怎麼花錢就能破除這個魔咒；光是改變這個想


    第一章 你怎麼看待金錢呢？'
