  md: '# 進行神社任務


    ![](img/a99c77dc5cdbf0805e4d8ba66f7d5233_199_0.png)


    神社任務，在心屋熱的學生之間幾乎是像常識般的例行公事。所謂的神社任務，就是到寺廟添香油錢——萬日幣（約台幣三千元）。選擇的寺廟盡可能是人煙稀少、沒名氣的偏鄉小廟（如只到金碧輝煌的大廟宇，也沒關係）。基本上捐獻的金額是一萬日幣；超過當然也很好。這是為了答謝神明，從以前到現在這廟看顧及庇蔭自己的人生，所以，也能以此為參考，決定香油錢的多寡。若是不方便到寺廟的人，奉獻給教會也是相同的意恩。但基本上都是無法期待對方給予回報的地方為佳。


    第五章 錢成財源流進的習慣'
