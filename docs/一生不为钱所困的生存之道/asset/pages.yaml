- pgno: 232
  md: 吃虧就是占便宜，眼前的損失會為日後帶來富裕。 不僅是金錢，空氣、愛情也都是如此。只要有付出就一定會循環回來，這是放眼宇宙不變的共通法則。 總是存不到錢、會被錢搞得團團轉的人，都是因為他們不肯把錢拿出來；而且就算金錢流回來了，他們也不接受。之所以會沒錢，除此之外也沒有其它的原因了。
    適當地運用金錢，讓金錢在這個世界循環、運作。把錢花在喜歡的事物上，讓自己感到幸福。相反地，就算是為了誰而把錢用掉，當他們收到這些錢的同時，也一定能為他們帶來喜悅。
    不需要惜錢如命，不要中止金錢流動。盡情地花錢，沒錢也要花錢。 而且要給人機會「花錢在你身上」，然後還得大方地「接受」。
