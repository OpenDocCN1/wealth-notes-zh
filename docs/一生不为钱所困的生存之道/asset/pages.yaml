- pgno: 33
  md: '# 重·點·整·理


    +   - 覺得錢很髒髒、認為開口閉口都是錢的人很沒格調、或是把賺大錢的人都想成壞人……等，錢是不會靠近這些對金錢懷抱否定態度的人。

    - 多數日本人潛意識裡，都要自己盡可能不花錢，或是為了消弭內心的恐懼，而不斷存錢。

