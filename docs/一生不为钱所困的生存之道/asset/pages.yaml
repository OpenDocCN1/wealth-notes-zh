- pgno: 134
  md: '# 第三階段：不能「只」收下自己想要的東西


    接下來要進入第三階段。在此有件事要特別提醒各位。雖然我要各位收下富足，但不代表收下的一「全是好事」。口袋的開口愈大，可以收到更多的金銀財賄，但也正因為開口很大，所以錢財以外的垃圾、灰塵、雜七雜八的小東西也會一起跟著進來。如果因為不想讓這些雜物一起掙進來，而束緊口袋的話，那就會連你原本想要的金錢都被拒於門外。如果想得到富足生活，就必須先有此覺悟：你能得到的，不只是你想要的東西，就連不想要的東西都得一併收下。想成為財運亨通的人，第三階段就是「不能只收下自己想要的東西」。請跟我一起想像撲克牌上的圖案。'
  merge: -1
  img_proc: true
- pgno: 135
  md: '撲克牌的圖案有紅心、方塊、黑桃和梅花。我們假設：紅心代表愛情；方塊代表金錢；黑桃代表暴力；梅花代表悲傷。拿一副撲克牌徹底洗牌後（如若洗牌洗得不夠徹底，可能會造成花色分配不均），平均分配給每一個人，結果是，每個人收到的花色數目都會非常公平。而這就是我們的人生。換句話說，人活在世上，無論得到紅心、方塊、黑桃或梅花，數量都是相同的。好事、壞事、悲傷的事、快樂的事、痛苦的事、特別風光的事、微作劇的糢事、想到心情就會特別好的事等，全都會發生。就像無論哪張撲克牌，只要翻到背面，全都長得...模一樣。


