    這番話，對當時我來說，猶如晴天霹靂般的震撼。前輩真是一席話點醒夢中人；我提供免費團體諮商，等於是搶走別人「先付出」的機會，也就是剝奪他人變富裕的機會。於是，我決定將免費團體諮商改成「自由付費制」（無論多少錢，想付多少就付多少）的諮商。

    這様無論是多麼窮的人、或是為錢所困的人，都可按照自己的心意付錢，接受諮商。為能讓這些人搭上富貴的循環列車，我給他們付出的機會，將免費'
