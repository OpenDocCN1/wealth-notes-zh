  md: '![](img/a99c77dc5cdbf0805e4d8ba66f7d5233_140_0.png)


    # 第四階段：享受過了就要分享


    第三階段終於告一段落，總算要進入第四階段了。


    享受富裕之後，就要分享。


    得到富足生活後，也要懂得付出。

    如果不願意分享，就沒有下次得到的機會。

    俗話說風水輪流轉，錢財也是。

    無論是金錢、富裕、愛情、空氣、水、能源……所有事物都是來了之後會再去，去了之後還會再回來。

    若是不讓他們持續循環，這些東西就不會再來了。'
  merge: -1
