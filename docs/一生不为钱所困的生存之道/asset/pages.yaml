- pgno: 233
  md: '別一直鑽牛角尖地認為自己「沒有錢」，而是覺意識到自己其實一有錢」。只愛這樣，必定能財源廣進，成為不再為錢煩惱的人。

    你，值得大大方方地收下以金錢為名的富貴。

    因為「你值得」。

    何且你也有資格隨心所欲地揮灑這些錢。就算囚此吃虧，也沒什麼

    大不了的。

    因為這此豐盛是「不虞匱乏」的。

    衷心希望讀過本書的你，成為願意拿出錢的人；成為開啟金錢循環

    的人；並且成為收下滿滿祝禱與富足的人。


    心屋仁之助


    後 記 錢如果不用，其實就是張廢紙罷了'
