  md: '# 如果沒察覺薪資以外的富裕，現金是不會增加的


    「我的薪水才不是我自己決定的！我是領薪水的上班族，薪資多寡都依公司規定，這是公司人事部統一審定出來的標準。」「我打工的時薪是店長決定的，並不是我自己訂的。」「我在簽訂員工僱合約時，這份工作的新資老早就決定好了。」「我是家庭主婦，打從一開始就沒有所謂的薪水可言……」


    大家一聽兒收入其實是自己訂出來的，就七嘴八舌開始議論起來。請各位先冷靜一下。諸問錢Ⅱ薪資嗎？錢，難道僅限於薪資或是打工時薪嗎？


    第二章 話說回來，「錢」到底是什麼？


