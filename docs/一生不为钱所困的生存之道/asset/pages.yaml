- pgno: 76
  md: '# 無法「錢進」的壞習慣是如何養成的？


    你對錢敬而遠之的壞習慣，是從何時開始養成的？為什麼腦海裡的觀念會這樣扭曲？其實，這些症狀大部分的原因，都出在你被教養的方式。任何人都有想法上的偏頗之處，也有各自的壞習慣。俗語說：「一樣米養百種人」，我們可從一個人的身上，看見一百種不同的壞習慣。但基本押，剛出生的嬰兒是不會有想法上的偏差。請問你剛出生時，是個對自我評價很低「——存在薪」很低——的嬰兒嗎？我長這麼大，還沒看過有任何一個小嬰兒天生就非常悲觀；也沒看'
  merge: -1
  img_proc: true
- pgno: 77
  md: '過心靈扭曲或沒自信的嬰兒；更別說我沒看過有受人恩惠，就非得要加倍奉還不小嬰兒。每個人剛出生時都像一張純潔無瑕的白紙；不會有人與生俱來就帶著偏頗的想法或壞習慣。

    金錢觀也是如此。沒有打從娘胎出生就非常吝嗇的嬰兒；也不會有天生浪費的嬰兒；更不會有金錢觀十分消極（或是積極）的嬰兒。若你現在對金錢很容 易沒安全感，個性吝嗇，或是金錢觀消極，這些都是你與生俱來的性格，而是在成長過程中學習的結果。

    有可能是你被養育的過程中，有人這麼教導你，或是你親身經歷了某件事的影響，這些經驗在不知不覺中影響你的金錢觀，也會漸漸地改變你用錢、存錢的方法。


    # 第三章 為什麼錢不會主動來找我？'
