  md: '我之所以這麼說，是因為努力的人「存在薪」都很有緣故。我之前提過，「存在薪」收入。「存在薪」低的人，價值差不了只有血汗薪的一部分而已。我以前還是上班族時，也日復一日努力地為公司打拚。日以繼夜都以百米衝刺般的速度勤奮地工作。因為我以為只要不工作就沒有價值（也就是「存在薪」很低），所以，我工作到要死要活，總算領了相對應的高薪，卻仍覺得「錢不夠用」、「馬上就用完了」。

    會覺得不努力就賺不到錢的人，真的會在停止努力後，就賺不到錢。因為現實生活會隨著你的「預設立場」來運作。一直努力工作、努力、再努力……但人畢竟不是機器，不可能一年三百六十五天、一日二十四小時不眠不休地持續工作。'
