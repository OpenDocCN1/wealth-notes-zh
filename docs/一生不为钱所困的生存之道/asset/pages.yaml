  md: 相反地，我們在上體操課時，老師會要我們做深呼吸等動作，也是因為有「空氣用之不竭」、「不費吹灰之力」、「空氣永遠存在」的「預設立場」。現實就是照著「預設立場」發生在我們的生活裡！雖然看不見，但是依舊「存在」。更是平均地「存在」。也是每個人都「擁有」。永不止息。每個人的「預設立場」和你的「預設立場」都一樣，大家都平等地「擁有」空氣，每個人也都能盡情呼吸，而日需要多少空氣，都一定會分毫不差地流動過來；現實，就如同這個「預設立場」運作。因為我們都了解這套運作模式，所以從不會對此感到擔憂或恐懼。
