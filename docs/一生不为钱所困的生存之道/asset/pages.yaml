    由於我現在已經完全將自己託付給「外力」，所以早就沒訂定所謂的「目標」了。 響如說，寫本書前，我不會設想這本書要賣到幾萬本。 如果我設定這本書要賣十萬本，就會開始進行以賣到十萬本為前提的廣告和宣傳等活動。
    如果目標是賣到一百万的話，宣傳陣仗就會與賣到十萬本的模式全然不同。不但必須先準備超過十萬本的廣告、宣傳費用，還要借助于電視、雜誌、報紙等多不勝數的大衆傳播媒體。


