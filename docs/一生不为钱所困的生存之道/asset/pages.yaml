    說到這裡，不少人會抗議：「我才不會拒絕主動上門的銀子！我的薪水都是公司決定的，我又能怎麼 Password！我怎麼可能阻止錢來找我呢！」或許，薪水真的沒提升。或許，也真的沒照你所預期的幅度增加。'
