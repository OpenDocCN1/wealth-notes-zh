- pgno: 74
  md: '那是因為，你認為自己並不值得收下這些錢。


    自己沒付出什麼、也沒努力到，光天化日下怎麼可能有不請自來的錢！


    收下這筆錢，怎麼說得過去呢！（到底有什麼說不過去的呢？）


    我根本不愜得收下這筆錢。


    就算我收下這筆錢，也無法提供對等的「回報」。


    在前面的章節已經討論過，會為錢煩惱的人，都因為覺得自己的「存在薪」很低。這些人會深信自己沒什麼價值，所以也不配過富足的生活。


    其實，這不過是種壞習慣、也是種想法上的偏差罷了。


    貧窮的人有變貧窮的壞習慣；有錢人也有讓自己變有錢的壞習慣。'
