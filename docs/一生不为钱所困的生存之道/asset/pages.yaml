  md: '那陣子，我剛好有機會與諮商界的前輩——澤谷鑽聊到這件事。那時，前輩跟我分享了一則關於釋迦牟尼化緣的故事。

    化緣一詞，原指和尚托缽，挨家挨戶訥經、求取布施之意。

    澤谷先生說，釋迦牟尼要他的弟子們，特別到貧苦人家門前徘徊，而不要到富裕之家化緣。

    力（

    因為貧窮的人都認為自己很清寒，所以無法再布施給別人（沒有能

