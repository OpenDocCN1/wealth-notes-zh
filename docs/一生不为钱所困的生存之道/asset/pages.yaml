- pgno: 16
  md: '# 錢不會靠近覺得「它很髒」的人


    ![](img/a99c77dc5cdbf0805e4d8ba66f7d5233_16_0.png)


    首先，我在這裡要先點破各位對「錢」的成見，也就是大家心中對錢的「預設立場」。說說你對錢的看法或印象如何？也就是你的「金錢觀」為何？


    讓我們從了解現在自己心中對錢的「預設立場」開始著手！


    請誠實地回答第一個問題：


    你覺得能賺大錢是非常屬事嗎？還是你認為這是骯髒或沒格調的行為？


    你認為不費吹灰之力，就賺進大把鈔票是好事嗎？或者是錯誤的行為呢？'
  merge: -1
  img_proc: true
- pgno: 17
  md: '眼前若出現一位成天遊手好閒卻日進斗金的人，請問你會覺得他是好人還是壞人呢？

    回答「好厝害」與「這是好事」的人，對金錢都抱持肯定的價值觀；相對地，認為賺大錢是「沒品」或「不對」的人，則對金錢抱持負面的印象。

    事實上，選擇否定答案的人占多數！

    不信的話，請再看下列例子：

    天下沒有白吃的午餐，遊手好閒的人怎麼可能賺得到錢！

    一分耕耘一分收穫，每一分錢都是咬緊牙根辛苦工作換來的報酬。

    那些能賺大錢的人，一定都暗地裡進行見不得人的勾當。

    我才不想變成那種人……

    第一章 你怎麼看待金錢呢？'
  merge: -1
  img_proc: true
- pgno: 18
  md: '這些聲音是否常出現在你我身邊呢？然而，諸如此類的答案都是對金錢抱持著負面態度嗎？當然，有些人的答案也可能同時對金錢夾雜著正面與負面的情緒。要區分這些人的金錢觀是否肯定派還是否定派的話，只要再問一個問題，答案就水落石出了。

    在公司裡，你的上司明明沒做什麼，薪水卻領得比你多，你會恨得咬牙切齒嗎？還是你覺得「我將來也要成為這種人，實在太了不起」了！

    怎麼樣？大多數人都不覺得很公平而氣得牙癢癢吧！其實會對這種事心生憤意的人，就是對金錢抱持負面態度的人，因為他們心中「痛恨輕鬆賺大錢的人」（認為這是不對的行為）。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '如果知道這個人對上司不必做什麼就能坐領高薪的看法，就能得知他的金錢觀為何；換句話說，也可以猜出這個人心中的「預設立場」。我的公司是白營的；身為董事長，我很清楚，這些主管們可以不用認真工作就能賺那麼多錢。


    「董事長的工作只是玩玩而已。」


    這位董事長這麼說，很容易造成大家的誤解，其實他想表達的是：


    董事長的工作正是增廣見聞。其實，他是藉由各種不同的遊樂及交際應酬，提升自己的柔軟度，再將這些體驗應用在公司的經營管理上，這就是董事長的工作。


    當董事長待在公司坐鎮時，如果到處關切狀況，只會打擾到那些正在工作的人，甚至造成員工的困擾。因此，董事長才會外出，為公司增廣見聞。


    # 第一章 你怎麼看待金錢呢？'
  merge: -1
  img_proc: true
- pgno: 20
  md: '或許有些員工只看見董事長一天到晚不在公司，就認為董事長「成天不務正業」、「什麼也沒做」、「這麼混也能賺得比忙到昏天暗地的員工還多」、「令人感到十分氣憤」……。

    但是（我相信）了解董事長難為與辛苦的人，還是有大有人在。

    公司的主管們也是這樣。說不定他在你看不到的地方，為公司付出超乎你能想像的貢獻呢！

    然而這裡要探討的，並非主管到底有沒有為公司付出的問題；再說，真相如何根本沒什麼大不了。

    這個問題的重點在於，你對賺大錢的人、輕鬆就能賺錢的人、還有對富翁是抱持什麼樣的價值觀（預設立場）。

    非常痛恨不費吹灰之力就能賺到錢的人。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '賺錢是非常沒格調的行為。錢很辦。受不了那些能賺人錢的人。比起賺錢，這世界上 有更多值得我們 垂視的事。只要努力付出的 人才值得賺大錢。只要你還這麼想，那錢永遠不會主動靠近你！也是說，潛意識中對錢抱持著否定態度的人，是不會變有錢的，因為他們拒絕變有錢。我要表達的是，如果某個家庭的全部成員都討厭吃茄子的話，那這個家中就不會出現茄子。同理可證，錢不會常近討厭它的人。


    # 第一章 你怎麼看待金錢呢？'
