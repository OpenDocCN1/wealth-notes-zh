  md: 欲加之罪，何患無辭？原諒自己吧！請認同自己吧！你光是存在於這個世界上，就非常有價值了；你是非常富足的。就算是以往曾有不被認可的經驗，你也不是不被認同的「存在」或「人」。你並沒有犯下無法取悅父母或是他人的「罪」啊！在第二章討論過「存在薪」，那時就希望各位能認同，並提高自己「存在薪」。進一步意識到，當足和空氣一樣，都是我們與生俱來就「擁有」的，不用刻意排斥或客氣，你要做的只是「收下」就好了。你是個值得收下這一切的人。試著改變「預設立場」，讓自己知道，你原本就是這麼優秀的人。光是這麼做，就能成為值得接受富足的人。當成為值得收下這些富足的人，相對的富裕就會源源不絕地來。改變不是一朝一夕，多給自己一點時間適應也無妨。
