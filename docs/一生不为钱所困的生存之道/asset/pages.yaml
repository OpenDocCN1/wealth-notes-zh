- pgno: 120
  md: '而不见一、「不願接受」、「以為自己沒有」麗了；進一步追究根柢，會發現，這只是因為「沒人告訴他」或與「被教導的觀念截然相反」而已。從來沒有人提出「有一天空氣可能會被我們吸光」的理論。

    也從沒聽過有人認為：「我要吸太多空氣，以後就不夠呼吸了。」

    「周遭的人吸太多了，害我能呼吸的空氣減少了。」

    「等我老了之後，可能就不能吸了。」

    「空氣有一天會被吸完，所以我現在就必須未雨綢繆，為將來儲存足夠的空氣才行。」

