  md: '# 努力賺來的錢叫「血汗薪」


    分耕耘得到的一分收穫，等於用努力換來「血汗薪」。

    「存在薪」低的人，就只能賺「血汗薪」。

    「存在薪」為零的人，則沒底薪（Full Commission）；換句話說，

    全部的薪水都是靠自己雙手努力換得的血汗錢。

    如果覺得自己需要的錢，全得靠血汗薪老老實實存下來，那要存到讓自己放心的數字，恐怕得每天工作到不眠不休。若走到這一步，身體和心靈都將不堪負荷。

    我以前也曾工作到身心俱疲、瀕臨崩潰。不過，就算工作到快撑不住，也會因為自己認同本來就低到谷底，而得不到令自己滿意的評價。'
