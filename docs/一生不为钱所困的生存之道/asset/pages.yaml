  md: '我有朋友在青春期没救逆過，如今仍對父母抱持很深的罪惡感。這些人都有一個共通點——他們都覺得自己的母親非常可憐。我這位朋友同樣覺得他母親非常可憐，他從小就非常痛恨聽到母親的嘆氣聲。

    聽他提起，當清明節回到故鄉時，祖墳都已掃乾淨了，他的母親邊嘆氣邊說：「我已經獨自一人掃完了。」一聽到母親這麽說，他心中充滿愧疚；但明明工作忙得不可開交，到

