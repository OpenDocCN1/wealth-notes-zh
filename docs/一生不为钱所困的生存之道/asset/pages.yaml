  md: '# 別想著如何滿足顧客的需求，而是想該如何滿足自己的需求


    我有很長一段時間，都以迎合顧客的需求為生。放眼望去，無論是在商場或人生的戰場上「提供符合顧客需求、以及顧客真正要的服務就一定能成功」都被視為王道，當然，我以前也是以此為標竿努力。雖然追求這個目標的確為我帶來不錯的成績，但是總有一天會到達極限。
