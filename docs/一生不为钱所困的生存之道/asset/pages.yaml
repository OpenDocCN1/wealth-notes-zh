- pgno: 31
  md: '錢就會源源不絕地飛奔過來。


    聽起來似乎有點不可思議，但這是千真萬確的事實。


    河水一刻也不停息地流動，時時刻刻都有活水往下湧注

    入。


    但是不知從何時開始，因為人們想取走自己想要的部分，於是堵住


    水流，


    建造屬於自己的池塘，因而開啟爭奪水資源的戰爭。


    另一方面，池塘的蓄水也開始腐臭，漸漸地無法滲入地底。


    盡情地花錢吧！把錢用掉！讓錢生生不息！


    千萬別堵住水流。這樣水流才能源源不絕地繼續向下流動。


    愈用錢的話，需要多少錢，就有多少錢會主動地向你招手。


    這就是


