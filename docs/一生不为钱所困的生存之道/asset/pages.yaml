- pgno: 218
  md: '我認為：

    不吃虧 || 中止金錢的循環

    吃虧 || 金錢源源不絕地流動

    因此，吃虧就是「金錢入袋」最快的捷徑。


    我辭掉公司的工作成為諮商師的同時，也從一個上班族轉變成一個經營者。

    經營者和上班族不同，我們必須自己向政府申請所得稅等事宜。

    那時，我為了不想繳那麼多稅給政府（ || 不想吃虧），努力節稅到眼淚快流出來了。

    因為收入只要超過特定門檻就會提高稅率，所以我拚命把營業額壓在門檻之下，甚至到了要做年度總結時，還失心瘋似的亂買不需要的東西 || 那時的我，為了節稅做出很多削足適履的蠢事。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '現在回想一切，當初努力避免稅真是浪費時間和精力的行為。後來，聽到我非常尊敬的齊藤一人先生說，他非常樂於繳稅。他表示，無論如何都想多繳一點稅，因為繳稅是他的最愛。聽到齊藤先生的話後，我決定放棄以前努力不繳稅的壞習慣；而且也想要齊藤先生一樣，能繳多少稅就繳多少稅。就連我們繳的稅金被拿來做什麼也不想知道了。


    現在我認為鑽牛角尖去計較自己的稅會被用在哪裡之類的事，是非常沒有意義的。舉個例子來說，假設我捐一筆錢去救助貧苦的孩子，究竟這筆捐款有沒有被用在這些孩子身上，我們無從追究；再說，這筆捐款就算被用在我不認同的用途上，我也沒辦法改變一切。相反地，我們在自己為會吃虧的事上使用金錢，說不定這筆金錢反而被拿來解救許多需要幫助的人。'
  merge: -1
  img_proc: true
- pgno: 220
  md: 換句話說，我根本就不知道我們付出去的錢會被怎麼用，所以乾脆不要計較那些花出去的錢下落如何，而是能花多少是多少。後來，我們公司聘請的會計師提供我許多節稅的方法。但是我告訴他：「不用再告訴我這些事了。繳愈多稅愈好，我不想節稅。」會計師原本想了許多方法，讓我們公司能省下許多不必要的稅金，因此，他非常懷疑地跟我再三確認：「這些不必要的稅金還是要申報嗎？」過幾天稅單來了，上面的數字果然就像會計師之前提醒我的這麼多，雖然這對我來說，真的多到令人咋舌，但我還是非常愉快地把錢付出了。
  merge: -1
  img_proc: true
- pgno: 221
  md: '結果，你知道發生什麼事嗎？我們公司的營業額勢如做竹地不斷向上成長，即使我們的工作量愈減愈少…… 俗話說：吃虧就是佔便宜；我認為吃虧就是賺錢最快的捷徑。吃虧的故事還沒畫上句點。許多參加心屋塾課程後受我認可的講師，他們會用我的名字開業，從事各式各樣的營業活動。因為是用我的名義去賺錢，所以，跟他們收一點小錢也是無可厚非的。後來，我腦海裡浮現過一個念頭：我跟他們收錢，只不過是拿去繳稅給政府——如果逕這些錢都要計較，豈不是更慚愧！於是，我告訴這些講師：『你們可以自由地使用『心屋』這個招牌去賺錢，不用給我任何回饋了！』


    # 第五章 發成財源廣進的習慣'
