- pgno: 44
  md: '無論有多少錢，都覺得不夠（存起來不用就會消失！錢是如此，愛情也是）。

    由此可知，自信程度和收入是成正比的。自信也是安全感的指標；擁有足夠的安全感，一個人的心胸就會開闊。這一章節要告訴大家結論如下：

    收入 || 自信的程度 || 安全感（心胸開闊）的程度 || 自己認為自己「擁有」的（ || 價值 ）。

    而收入是自己訂出來的結果。'
