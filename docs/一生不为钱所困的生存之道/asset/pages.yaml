  md: '想盡辦法，能不用錢就不用錢。總之，一毛不拔是我當時最大的原則。這都是因為我潛輸自己：「我是個沒錢人」的觀念。錢，是不會主動向這種人招手的。看看自己的一舉…動，就知道自己的預設立場為何。直到有天，當我意識到自己「有錢」、發現這些錢不會變少，就開始不吝嗇地花起錢了。
