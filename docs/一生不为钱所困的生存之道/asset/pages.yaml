- pgno: 78
  md: 有錢人的「有錢人思考模式」也是「學來的」。換句話說，窮人腦袋裡的「窮人思考模式」也同樣是「學來的」。在環境潛移默化下培養出來的錯誤價值觀，就是所謂的壞習慣、或偏差思想。換句話說，這就是潛意識中的「預設立場」。人類的一舉一動，都會先經過大腦的「預設立場」調整角度後，才會付諸實行。就像大腦會告訴你：千萬不能靠做壞事來賺大錢；或是出手賺不到錢；如果不存錢的話，臨時有急用就慘了……。像這些消極的金錢觀，就是影響你行動的「預設立場」。這麼一來，現實生活中的金錢也會配合這種思考模式流動。你會以為，要是沒工作到天昏地暗就賺不到錢；或者，不管怎麼存錢，都會被「不知道何時會發生的意外」搞得坐立難安、失去自由。
