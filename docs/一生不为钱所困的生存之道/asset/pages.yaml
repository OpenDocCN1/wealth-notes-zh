  md: '背負著「罪」、認為自己沒有價值這樣的想法，就不能隨意花錢買自己喜歡的東西；甚至可能認為自己沒賺錢，根本沒資格收到這些錢。因為背負著罪惡感，所以就著好不容易收到下一萬塊，也不敢花在自己身上，只能將這些錢花在別人身上、或拿來補貼家用——把這筆錢用在別人身上，才能讓自己從罪惡感中解脫。到底要把自己逼迫、責怪到什麼地步，才肯放過自己呢？


