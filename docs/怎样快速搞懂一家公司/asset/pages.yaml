  md: '# 【试听】你为什么需要快速搞懂一家公司


    你好，欢迎来到得到课程《怎样快速搞懂一家公司》，我是白洋。


    我做了 9 年行业研究工作，现在是华兴资本旗下华菁证券研究所的首席分析师。前 6 年我主要研究已经上市的互联网公司，最近 3 年主要研究没上市的新经济行业“独角兽”。
    虽然两个市场投资逻辑的侧重点不完全一样，但研究的底层逻辑——对公司价值的分析——是一致的。


    一般而言，作为资深研究员，凭借多年的经验，很多东西信手拈来就能唬唬人。但对于我所研究的互联网行业来说，要面对的全是层出不穷的新行业、新模式，即使是传统的行业，熟悉的公司，也总有新变化、新发展，完全没办法倚老卖老。


    可以说，我研究过上千家公司，但从来没有觉得研究已经做完了。而是随时随地都要保持旺盛的求知欲，因为每家公司都千差万别，都需要你以从零开始的心态去研究。


    所以，怎样快速搞懂一家公司，是我一直以来的诉求，也是我不断摸索、实践、完善的一个框架。对这个问题，我还是比较有发言权的。


    先定义下， 什么叫“搞懂”一家公司？


    你想了解一家公司，在这个时代相对来说是比较容易的，你能获取大量的信息。特别是如果你关注的公司，也是很多人都在关注的，你就能够得到很多的资料、评论、分析。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '没错，这是我们说的“了解”一家公司，但我们这门课说的是“搞懂”，了解只是搞懂的基础。达到了解这个目标很简单，只需要你有基础的学习和记忆能力就好了。但如果你对此还不满足，希望在了解程度上更进一步，那么就可以跟着我们这门课继续学习下去。


    这门课的目标，就是为了让你掌握的不只是“大略货”，它要帮助你建立一套系统的认知框架，在它的基础上逐步培养独立的观点。


    当你熟练掌握了这套框架后，甚至可以条件反射地去使用它。你看一家公司时，不会陷入某个孤立的点，也会对面上的各种分析言论有冷静的判断力。


    举个例子：


    如果你的一个朋友，说一家公司未来的利润规模会达到一个很乐观的数量级，很多人的反应可能是“哎呀，好牛”，而一个训练有素的分析师，会快速地反馈说这不可能。他的理由就是行业多大、企业个体能占多少、有没有定价权、没的话常规利润率水平怎么样。


    拥有一套系统的认知框架，对你分析问题是很有帮助的。但即便你做到了这一点，你也会发现，研究一家公司的过程就像盲人摸象。


    大家都有各自的视角，而没有一个是明确的结论，尤其是对于充满变化的行业，这个时候你可能会对“搞懂一家公司”这个命题产生根本质疑，因为会感觉永远都搞不懂它。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '其实这是你在搞懂一家公司的过程中，到达一个更高境界的标志，你不需要因为这个感到困扰。


    我们说的搞懂一家公司，还包括你知道了，以眼前掌握的信息，有哪些东西是你所不能判断的。或者是即使你做了哪些判断，也知道这个判断是基于什么样的假设。就像你没办法去定格一座正在喷发的火山一样，事情在发展，你不需要马上给出结论。


    所以，搞懂一家公司，还意味着你知道，你目前不能知道的是什么。这样，你能保持开放的心态，对这个公司的理解，也会越来越饱满。


    "快速"是这门课的另一个关键词，之所以要加上这个定语，是因为在这个瞬息万变的时代，已经不大允许你用最细致的办法，慢条斯理地去十年磨一剑了。


    这个时代你不可能每件事情都能提前想到。现实一点的方式是，当你遇到一些新事物、新变化时，快速地搞懂它，然后选择是拥抱它还是远离它。


    比如拼多多：


    这种新颖的模式刚出来时，你可能会说，我一时会会儿看不懂这个模式，再等等看，结果人家销售额屡创新高。


    你觉得有必要加快了解了，但还没等你想清楚，腾讯比你更早地想清楚了，于是腾讯投资了它。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '这时候你不仅要去想清楚拼多多多，还要去搞懂腾讯为什么投资它、能给它带来什么？


    正当你的思路越来越复杂时，人家已经上市了。


    正所谓蓦然回首，已经错过一个时代。如果没有快速作为前提，你的搞懂，价值会大打折扣。


    当然，我相信在你学了这门课、树立了一套成体系的框架后，效率提升是很自然的事。而在这个之外，在效率和深度的取舍上，我也希望你借鉴互联网公司小步快跑的思路，找到一个适合你的位置。


    比如说，咱们的课程结束后，我希望你能让自己对公司的理解，上升到市场前 20% 的水平，同时根据自身需要，有的放矢地调整投入力度。


    公司研究是非常有意思和有价值的-一件事。在研究的过程中，你一定会发现一些别人不知道的事情，它能帮助你比市场更早地获得信息，关注到一些别人没注意到的趋势，甚至做出一些关键判断。


    有句话说得好，“选择比努力更重要”，那些被忽略掉的信息很可能直接影响你的成败。


    不管你是想赚大钱的投资者、找工作的年轻人、跃跃欲试的创业者，还是运筹帷幄的管理者，分析一家公司的本领，对你都很有必要。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '公司研究也可以成为你认识世界的一扇门，它结合了宏观、中观和微观，既能够帮你理性地判断大趋势，也能培养你以小见大的能力。在这个过程中，你看人、看事的眼光都会变得更准。


    接下来我们会进入正式的课程，我将遵循自上而下的框架来设计这堂课的结构。


    +   第一讲，我会来说说研究公司需要的宏观视野；


    +   第二讲到第四讲，我们花三节的时间来学习如何看待公司所在行业的空间、阶段和竞争格局；


    +   第五讲和第六讲，我们具体到公司，探讨商业模式与护城河；


    +   第七讲，我会谈一个公司的管理和人；


    +   第八讲，也就是最后一讲，我会做一个锦囊大礼包，把我能想到的方法论、技巧、心得和原则如数奉上。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# 1.研究公司需要的宏观视野


    第一讲我们先来说看一家公司应该有的宏观视野，这个部分做起来相对比较轻松，但也非常必要。


    你可能会问，我只是想单纯地看一家公司而已，为什么要了解宏观环境呢？

    或者说，在很多场合下，我并没有了解宏观情况，依然能看懂一家公司。


    我的答案是，看清宏观大背景能为你搞懂公司做出铺垫，同时看清这个公司和宏观的密切程度是怎样的，也决定了需要多大程度关注宏观变化。


    首先我们先明确一下，这里说的宏观环境是什么，它其实有两个层面：


    +   - 一个是大的时代背景，你可以把它理解成趋势；

    - 另一个是宏观经济环境，你可以把它理解成周期。


    # 把握长期明确趋势


    先说大的时代背景。知道大的时代背景，能帮助你更好地理解公司的地位和价值。


    比方说，同样是重要的行业巨头，20 世纪初的石油和汽车巨头推动了整个社会的前进，现在的石油和汽车公司只是现有庞大经济机器运转中的一部分。


    我们常说的“风口”，其实很大程度上就是大的时代背景。任何行业本质上都是时代的产物，不可避免地要跟时代的大趋势发生关系。'
  merge: -1
  img_proc: true
- pgno: 8
  md: '再举个例子。


    我以前做二级互联网行业的研究，曾经花了很大精力研究过两个行业，一个是移动互联网，一个是有线网络行业。


    +   • 移动互联网，在它普及的过程中，相关的产业链一股脑儿都在风口的位置。不管是生产智能机的，还是生产手机里的一根天线、一块屏的，或者开发移动应用的，很多优秀的公司都抓住了行业爆发的机遇。那个时候我们推荐相关公司的股票，帮助客户挣了很多很多钱。


    +   • 但反过来，对于有线网络行业，它的单位用户收入怎么算、增值服务怎么算、摊销折旧怎么算……我都非常熟悉，但现实的大趋势是人们越来越少地通过有线网络看电视。市场也很现实，现在没任何人记得我当时的分析是如何深刻，因为长期没有人在这些公司身上赚过钱。


    你可能会想，宏观是这么多复杂因素的组合，相互之间又有各种影响，我连一个小公司都还没搞懂，怎么一上来就去把握大宏观？


    其实，大部分事情如果你把它放大了看，有很多曲折细节，但拉长到一定维度看，就变成了一个相对确定性的趋势。比如比如移动互联网的普及，过程中也遇到了种种问题，但它普及的大趋势却是一直在向前推进的。


    这里面有两个小窍门：


    第一， 是能找到领先指标，判断这件事未来必然会发生。比如说老龄化，中国现在还没有老龄化，但人口的年龄结构摆在那，这是将来必然会发生的一件事。年龄结构就是一个明显的领先指标。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '第二，是从常识的角度出发，大道至简。比如说人们都希望自己生活质量更高，比如资源会自发自回报高的方向流动，比如科技会不断提升效率，顺应这些方向上的事情，在一个长期维度上就会是大趋势。


    刚才我们提到移动互联网的爆发，里面成长出像小米这样的优秀公司。那未来智能机相对饱和了，小米还在什么大趋势上吗？


    是的。我估计你已经想到了，小米现在不只是手机，从充电宝到电视机，从路由器到手环，从扫地机器人到平衡车，它要做的是一系列物美价廉的消费品，那它是不是又靠在消费升级这个更大的趋势上了？


    我会建议你关注长期明显的大趋势，积累对这种大趋势的认识，而不是去关注太碎太小的东西。这些大趋势，有点像前面说到的“大路货”，但我也提醒你不要轻视这种“大路货”。忽略常识，对真正的趋势视而不见，也是人们容易犯的一种错误。


    # 理解公司对宏观经济的敏感度


    刚才讲了大的时代趋势，接下来我要跟你讲的是关注宏观的第二个要点，就是理解公司对于宏观经济的敏感度。


    像房地产、汽车、资源品类的企业，它们都属于周期性行业，对宏观经济特别敏感，会随着宏观经济周期的波动而波动，研究这类公司，宏观经济就显得非常重要。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '而有的公司所在的行业就对宏观经济比较不敏感，我举几个例子你就能明白：


    +   比如我们的 生活必需品， 就像大米， 不管经济好坏， 人们风雨无阻地都要吃饭， 既不大可能因为经济好点就多吃两碗， 也不太会因为经济差点就少吃两碗。


    +   再比如“非主流产品”， 所谓非主流， 是指它们在宏观经济中没地位， 所以反而不受影响， 例如早期的互联网， 完全无视宏观经济的波动而野蛮生长， 因为那时候互联网在实体经济的大盘子里实在是太小了。


    +   还有一类特殊情况， 它本身是非必需品， 却体现出逆周期的特性。在经济学里有一个名词叫“口红效应”， 说的就是因经济萧条而导致口红热卖的现象。那是因为口红是一种比较廉价的奢侈品，在经济不景气的情况下，人们会去购买比较廉价的奢侈品，
    来满足自己的消费欲望。


    判断什么样的公司对宏观敏感也很简单：


    +   如果这家公司提供的是原材料或者是工业品， 并且产品价格在历史上存在周期性的大幅波动， 那么我们认为它是对宏观敏感的。


    +   如果公司提供的产品是消费品， 那你就看它是必需品还是非必需品。前面已经说了像大米那样的必需品是对宏观不敏感的， 所以非必需品， 就是对宏观相对敏感的。


    理解了公司对宏观经济的敏感性， 那么你就明白了在搞懂一家公司的过程里， 宏观分析所值得投入的精力。


    对宏观敏感型的公司， 分析它的基本面， 就要分析宏观经济， 像房地产、汽车、资源品。


    对于宏观不敏感的公司， 你也可以“无视”宏观扰动而直接去了解行业和公司的特性。


    对于中间部分的， 跟宏观有联系却又没有那么密切， 它们受宏观的影响往往是不对称的。如果宏观好， 它们未必好， 因为能不能从竞争者中脱颖而出， 还得看其它因素。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '出，还要看你后续的分析，但如果宏观差，它们多数都会受到波及，所以对于它们的宏观分析，要着重考察大环境的波动可能造成的风险因素。


    整体上，宏观很重要，但并不是让你成为宏观经济学家，毕竟整个宏观经济的分析是一个特别复杂的工程。“不忘初心”还是很有必要的，对于大部分公司，你只需要了解一些颗粒度很粗的宏观背景即可。


    # 本讲小结


    这一讲我们说了研究一家公司需要具备的宏观视野，整体思路是要有大局观。


    两个关键点：


    第一，看明确的时代大趋势，大趋势没那么复杂，它要么有领先指标，要么符合常识；


    第二，根据公司产品的特性，评估公司对宏观经济的敏感度。'
  merge: -1
  img_proc: true
- pgno: 12
  md: "# 2.判断行业发展空间\n\n上一讲我们说了会影响到一家公司的宏观因素有哪些，该怎么去分析，这一讲我们就进入行业层面了。\n\n关于行业的划分，我列了证监会的一个分类标准供你参考：\n\
    \n（1）初级产成品，包括农林牧渔、有色金属、煤炭等资源品，钢铁、化工等初级工业品等；\n（2）工业生产品及过程，包括建筑材料、机械设备、电气新能源、电子、轻工、建筑行业、交通运输、军工等；\n\
    （3）消费品及流通渠道，包括汽车、家用电器、消费电子、食品饮料、纺织服装、商贸零售等；\n（4）服务属性，包括餐饮、旅游、文化传媒、互联网、计算机软件、通信、教育、公用事业等；\n\
    （5）金融行业，包括银行、券商、保险和其他金融机构；\n（6）生物医药，包括医药、医疗器械、医院等；\n（7）房地产可单列一类，因为这的确是一个特殊的、且对经济有重大影响的行业。\n\
    \n投资人喜欢用“赛道”这个术语来描述一个行业，赛道理论很形象，赛道多宽指的是市场规模，赛道多长指的是行业所处的阶段，赛道是平坦还是崎岖指的是行业的竞争格局。\n\
    \n这一讲，我们专门来讲怎么判断行业规模的大小。\n\n在考虑市场规模这个问题前，你需要先问自己一个更起点的问题，就是：\n\n> \n“这个行业提供的是怎样的产品，解决了什么问题”。"
  merge: -1
  img_proc: true
- pgno: 13
  md: '# 一个核心问题定义行业


    “这个行业提供的是怎样的产品，解决了什么问题”，这是我认为最根本的问题，回答它就是回答了市场在哪里，市场是否有痛点。同时，这个问题也是后面我们回答市场规模大小的基础。


    我举个例子：


    比如咖啡行业，如果你把咖啡行业的从业者定义为“卖咖啡的”，它能获取的市场，是有多少人认可其咖啡的口味并愿意接受这个价格。


    但如果是行业大佬星巴克呢？情况就完全不一样了。星巴克所兜售的，其实是以咖啡为载体的社区空间。按星巴克自己的话来说，是打造出一个除了家庭和工作之外的第三空间。


    所以当你对星巴克的定义是提供“第三空间”，它能获取多大的市场，就不再单纯的是看多少人要来喝咖啡，而是解决了多少第三空间的需求。你也就不难理解，为什么在西雅图，最高峰的时候，差不多每
    500 人就有一个星巴克。


    再比如说互联网行业，我们分析一个互联网细分行业的时候，会问自己这么一个问题：


    它是改造传统行业？替代传统行业？还是创造了新产品？


    对这个问题的回答，某种意义上也是对这个行业的定义。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '所谓改造，就是改善原有行业里某个环节的效率，例如节省交易成本，改造产业链、去中介化。


    所谓替代，就是把线下的东西往线上搬，比如新闻资讯应用替代了报纸、互联网电影票替代了传统影院售票，等等。


    原有的行业在互联网的替代作用下，会损失一大部分份额甚至被淘汰掉。替代关系我们喜欢用渗透率 来衡量，比如在 80%看电影的人是通过网络购票的。


    最后一种情况是创造了新的服务或产品，或者发现新的商业模式。


    比如滴滴刚开始的服务，通过 APP 叫出租车，我们可以理解这是对于传统路边叫车、电话叫车的一种替代，但滴滴后来推出的专车服务，该把它定义成对传统租车公司的改造还是替代呢？其实都不是，因为在此之前传统的租车都还称不上是一个行业，专车属于没有被满足的需求，所以把专车定义为一种全新的服务更确切，也能帮助我们更好地预估它的发展空间。


    # 供给驱动看产能，需求驱动看天花板


    在考察行业空间之前，最好再明确一点，那就是这个行业是供给驱动，还是需求驱动的。


    供给还是需求驱动的概念来源于经济学，你可以把它理解成，产业发展的主要动力是来自供给一方，也就是公司，还是需求一方，也就是消费者。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '经济学对经济增长的动力有过一番争论，古典经济学派强调供给，认为是供给要素带动了经济的增长。而凯恩斯经济学派，则提出有供给不一定有需求。


    其实从历史的视角，我们能够找到比较好的解释：古典经济学出现在产业革命快速发展时期，当时物质匮乏、供给严重不足；而凯恩斯的需求理论出现在大萧条发生之后，当时物质过剩，有效需求不足。那么二者的分歧也就不难理解了。


    供给和需求的关系，对我们做行业分析有很大启示，说到底，行业的空间是由需求决定的。但对于大部分新经济行业，供给创造需求的特点就很明显。


    比如苹果创造 iPhone 之前，人们并不觉得自己有这样的需求，用手机打打电话、发发短信就感觉良好，是苹果定义了智能机，后来智能机才成为人们生活中不可缺少的需求。这是典型的供给驱动的例子。


    但比如汽车，行业已经发展到成熟阶段，它的市场取决于有多少人有买车的意愿和支付能力，而不是汽车厂商造了多少量车。


    +   - 供给创造需求的行业，往往体现出特别强的爆发力，一旦挖掘到合适的需求，就看有多少有效供给，行业前景无限；

    - 但需求推动的行业，则要踏踏实实的，根据潜在的需求，来测算行业的天花板。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 构建分析框架，找到关键要素


    定义了行业是做什么的，以及了解它目前是供给驱动还是需求驱动之后，就可以来判断行业空间了。


    行业空间也就是行业规模，最简单的算法就是销量乘以单价。


    你如果能把一个行业拆解成销售有多少，单价是多高，然后两者相乘，就是这个行业的规模。 这个时候如果你能找到权威机构的数字是最方便的，包括行业监管机构，或者有公信力的行业第三方等等。


    不过，不是所有情况下都有一个量和一个价在那儿乖乖地等着我们。有的细分行业往往没有现成的统计数字，特别是当你想判断一下未来几年行业的潜力，历史统计数字的参考价值是有限的。这时候，就需要你来构建一个框架，并找到在这个框架下，判断行业空间的关键要素。


    回到我们前面举的互联网行业的例子，讲了改造、替代、创造三种形式，这三种形式其实就暗示了三种不同的分析行业空间的框架，每一种框架下我们要找的关键要素是不同的。


    +   - 第一种改造型，行业的价值体现在对于原有行业效率的改进。理论上这个行业所创造的价值，不会超过原行业的成本，否则就变得更改越没效率了。所以分析这类行业的空间，原行业成本是一个重要因素；


    +   - 第二种替代型，行业的空间取决于原有行业的规模和新业态可能达到的渗透率；


    +   - 第三种创造型，行业的空间则完全不受原有行业限制，而是取决于它自身解决了什么样的新需求。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '前面我们提到的，行业到底是供给还是需求推动的，也是一个重要角度。不同的驱动因素，决定了你判断的方式、指标都是完全不同的。


    拿近些年火爆的电影市场举例：


    +   - 一开始它是典型的供给创造需求。这里的供给是两个层面，一个是硬件层面的银幕数增加，一个是软件层面的高质量内容增加。二者的叠加造成行业的飞速发展，那时候观察在建影院数、观察大片上线数量，都是测算行业规模的领先指标。


    +   - 而到了今天，虽然仍然会有一些火爆的影片激发市场，但电影市场能成长到多大，归根结底取决于有多少人愿意去看电影、以什么样的频次去电影院。所以你更需要关注的，是观影人群和观影习惯的变化。


    但是有些时候，一个行业的盈利模式，本身还在一个探索的过程中，所以我们对“行业规模”的定义，还需要留足想象的空间，我们找到的那个关键要素，可能是一个领先指标。


    比如前些年开始，人们在移动互联网各类应用上所花费的时间越来越长。


    虽然用户的注意力，具体是怎么变现为经济收益的，当时还在一个探索的过程中，但我们依然可以做出移动互联网行业规模会有明显增长的判断。


    了解行业的空间，和行业增长的驱动要素，是接下来吃透一家公司的基础。 因为不同的行业空间，决定了公司未来能达到的高度。


    # 本讲小结


    这一讲我们说了判断行业空间的方法，首先要弄明白两个问题：


    +   - 第一，这个行业的商业模式，可以通过回答“提供了什么产品，解决了什么问题”来找到答案。


    +   - 第二，它目前是供给驱动还是需求驱动，通常新兴行业供给驱动的情况多一些，而成熟行业更多由需求驱动。'
  merge: -1
  img_proc: true
- pgno: 18
  md: 对这两个问题有了答案之后，我们就可以构建起一个分析行业空间的基本框架，并且找到这个框架里的重要指标。
  merge: -1
  img_proc: true
- pgno: 19
  md: '# ## 3.判断行业所处阶段


    上一讲，我们解决了行业的空间，这一讲我们来说行业所处的阶段。也就是回答：


    你关注的这个行业，在自己发展的路上已经走了多久？


    一般分析行业所处的阶段，产业生命周期理论算是比较经典的方法了，不过我这里有一套更先进、更完整的理论，是结合了传播学和硅谷两个经典的理论，一个是“创新的扩散过程”，另一个是“技术成熟度曲线”，非常好用。


    # ### 两个规律：创新扩散和技术成熟度


    首先来说创新的扩散过程。


    很早的时候，新闻学在研究大众传播时，就发现一个规律，就是任何一个新事物，从不为人知，变成广为人知，它的扩散的速度不是均匀的。一开始比较慢，当接受它的人群规模到了某个临界点，扩散的速度会突然加快，等到了某个水平，又会慢下来。


    其实也不难理解，因为人群通常是正态分布，敢于吃螃蟹的都是少数，处在中间部分的大众群体是最多的，新事物只有触达中间这部分人群，才算真正迎来起飞点，根据正态分布的特点，这个临界点一般会在
    10%～25% 这个范围。也就是说，一个新事物，当被全市场 10%～25%的人接受时，扩散速度会突然加快。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '这个规律同样可以用在产业上，也就是我们可以根据一种产品的市场渗透率，来判断这个行业处在什么发展阶段，判断它未来是会扩张得更快，还是已经过了最快的那个阶段了。


    如果我们画一个坐标图，横坐标是行业发展阶段，依次是引入期、增长期、成熟期、衰退期，纵坐标就是渗透率。我们就能画出一条倒“U”形的曲线，这条曲线我们把它叫做创新扩散曲线。在图中，你也可以看到刚才我说的起飞点在哪个位置。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '![](img/fcc06d5a40106688a3ab4d10e60d81d3_21_0.png)


    +   - 创 新 者：大胆尝试新观念

