  md: "# 怎样快速搞懂一家公司\n\n# 【怎样快速搞懂一家公司】逻辑要点\n\n# 一、宏观背景（第一课）\n\n看透宏观及经济趋势才能帮助公司顺应大环境，同时帮助投资者做出优于平均水准的投资决策。宏观解读通常先宏观再微观，主要话题：\n\
    \n+   1. 公司处于什么样的经济大背景？这背景趋势对公司的发展是机遇还是危机\n\n+   2. 理解公司对于宏观经济的敏感度：\n    - 通过观察公司与经济敏感度判断\n\
    \    - 哪些行业敏感度高公司受宏观影响\n    - 中间地带的公司，其关注宏观下行可能带来的风险\n\n我们再来通过，驾车和赛车的手法来进行宏观，公司知人，并依次展开分析。\n\
    \n# 二、赛道（第二课——第四课）\n\n+   1. 赛道有多宽（行业空间）：\n    - 行业的商业格局是什么，通过追踪“某个行业提供的是什么样的产品，满足了什么市场”来暴露赛道模式\n\
    \    - 行业基本的政策环境、监管状况、竞争结构\n    - 在以上两点的基础上，想象并行业空间的发展，找出关键路径，更有目测的增长曲线\n\n+ \
    \  2. 赛道有多长（行业生命周期）：\n    - 结合“技术成熟曲线”和“创新扩散过程”两个模型，描出行业的一整套生命周期模型\n    - 去判断一个行业究竟走到了哪里，未来还要走多久\n\
    \n3. 赛道中还是起跑线（竞争格局）：\n    - 行业竞争格局，竞争定位和差异化\n    - 行业处于什么样的发展初期，行业高速发展时期还是成熟期\n\
    \    - 细分行业内各家的市场占比及未来可能的“领跑者”，同时关注行业里哪些环节拥有更高的壁垒\n    - 产业链延伸也包含了相关的竞争，判断不同产业链接的盈利情况\n\
    \n赛道分析完成后，要考量的是什么样的车在赛道上。\n\n# 三、赛车（第五课——第六课）\n\n+   1. 公司的商业模式：\n    - 描述公司靠什么收入、衡量增长的核心驱动因素、并且关注公司是否存在持续竞争或壁垒\n\
    \    - 细化的竞争分析，市场的行业最佳和重要的优势，即竞争好手们提供的\n    - 查看同赛道或竞公司，可看对于自己有何用处的启发，商业模式上的变化、策略创新或风险\n\
    \n2. 公司的护城河：\n    - 无形资产      网络效应\n    - 用户转换成本  产品优势成本\n    - 定价规模\n\n最后的赛道是，优质的赛道需要匹配的赛车。\n\
    \n# 四、赛车（第七课）\n\n+   1. 执义的投资手和，初期人的内在品质，广义的财务与经营管理制度，高管团队对于有效的管理层\n    - 要想有充分完整的公开信息，更看他们需要的信息，因风声、察其行、观其果\n\
    \    - 公司发展的路径，是业务战略扩展与纵向协同强化之间的选择"
