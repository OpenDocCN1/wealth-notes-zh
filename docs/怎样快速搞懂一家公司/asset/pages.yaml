- pgno: 56
  md: '这套框架不是一成不变的，正如在宏观那部分说的那样，如果你要搞懂的公司对宏观不敏感，你也可以跳过宏观这个环节。


    框架里给出的具体方法也不是完全固定的，比如判断一个行业所处的位置时，我讲了创新扩散过程和技术成熟度组合的一个 M 形曲线。现实里一个产业的起起落落可能一个
    M 形都不够描述，而是看起来像一个心电图那样的几起几落，这都需要你灵活的发挥。


    搞懂一家公司是件有意思的事情，你能搞清楚公司，不管是做投资、找工作，还是应对客户，或者创业，都很用用。


    希望我的这门课，能帮你打开认识世界的一扇门，再见。'
