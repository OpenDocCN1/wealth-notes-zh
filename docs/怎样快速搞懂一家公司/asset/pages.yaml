- pgno: 22
  md: '比如微博这个产品形态， 2007 年就开始有同类产品上线， 像“饭否”“叽歪”“嘀咕”，但是并没有多少人用，直到后来 2009 年新浪微博才上线，最后在
    2011 年，微博的影响力到达极致。


    不过现实里，我们往往发现有的新事物一开始就来得快，去得也快。


    比如说我们看到身边的共享充电宝、共享健身仓之类，似乎一夜之间就遍布大街小巷，但很快又退出人们的视线，往往看起来还没成熟就进入衰退期了。这样的现象单纯用创新扩散曲线并不能很好地解释了。


    于是，我们针对这种来得快去得快的现象，会用“技术成熟度曲线”来解释，这个理论是由一家叫做 Gartner 的咨询公司提出的，可以很好地描述新技术发展的过程。


    技术的发展往往有这么一个规律，无数公司、资本就像是敏锐的猎手，一旦发现新技术被证明可行，因为害怕错过，会立即跟进。舆论也会添油加醋，形成一拥而上的氛围。 但新技术往往不完美，发展路上会有很多曲折。面对曲折，投机者很容易陆续离场，在舆论的引导下，又会形成一种大家纷纷撤离的现象，甚至会因因此波及到真正的创新者。
    经历了这么一波娇枉过正，新技术的成功和失败都被放大。但是，在缺乏关注、缺乏资源的情况下，真正有竞争力的新技术仍然会缓慢发展。也就是我们常说的，在短期我们往往高估新技术、长期又往往低估它们。


    新技术的发展的这个过程，体现在图形上，就是一条“N”形曲线， 经历一个小高峰后进入低谷，再慢慢走出低谷，这条曲线也就像是技术成熟度曲线。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 技术成熟度曲线图


    ![](img/fcc06d5a40106688a3ab4d10e60d81d3_23_0.png)


    +   - 科技诞生的促动期：新技术萌芽阶段

    - 过高期望的峰值：非理性关注下产品膨胀

    - 泡沫化的谷底期：问题出现，情绪走向矫枉过正的极端

    - 稳步攀升的光明期：有能力的新技术探索出经营模式

    - 实质生产的高峰期：新技术被接受，进入成熟阶段'
