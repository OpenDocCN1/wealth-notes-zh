- pgno: 50
  md: '# 8.方法论和总结


    前面的 7 讲重点在搭框架, 中间也穿插了一些技巧和心得, 最后一讲我干脆做 7 个锦囊, 把我能想到的方法论、技巧、心得和原则如数奉上。


    # 七个锦囊


    第一, 站在前人的肩膀上。


    以前我常常纠结于第三方报告的水平不高、数据太旧, 不过随着经验的积累, 才逐渐发现这些都不是问题。


    回到我们的初衷上, 毕竟我们是要去了解一家公司, 而不是去攻克学术上的难题。所以理论上前人可能已经把这个公司研究透了, 这时候如果能站在别人的肩膀上, 就有很多现成的结论可以借鉴。


    就算你要超越市场的一般认识, 那也一定是建立在对行业基础的认识上的。所以, 按照正常的搜集信息的能力, 我们要了解公司时找到的资料, 应该也是其他人会看到的资料,
    这就是市场共识。


    在刚开始看行业的阶段, 如果连基础都没有具备, 更没有必要一开始就对第三方信息过于苛求。比较好的态度是, 抱着质疑的态度去了解, 当具备能力时再质疑。


    一般而言, 搜索引擎能满足你大部分搜集信息的需求, 不过由于各种原因, 国内搜索的结果不总是能令人满意, 这里有几个小技巧供参考。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   * 首先，你优先要找到的是尽可能详实的信息，而不是碎片化的资料，所以你不妨在搜索引擎里加上“报告”“研究”“分析”，甚至“专题”“案例”之类的字眼，有时候还可以加一个“pdf”。


    +   * 我个人的另一个感觉，就是微信搜索现在越来越好用了，它分别能从聊天记录、收藏、公众号、朋友圈等各个角度去抓取信息。特别是当你在职场有一定人脉积累后，你会发现平时来不及看的朋友圈和群聊里还是隐藏着不少有价值的内容。


    +   * 其实财务分析也是我们搞懂一家公司基本面的最好方式之一，但我之所以没在这门课里过多地提到财务，是因为以现在券商研究和第三方研究覆盖的力度，能够有财务报表的公司，基本都可以找到不下十篇的研究报告，供我们更好地弄懂这家公司。


    # 第二，将你的思考建立在不变的事物上。


    我们应该能感受到，随着社会快速的发展，经济、商业都在以超乎往常的速度和颠覆的姿态出现，几年前站在神坛上的公司，可能很快就会被遗忘甚至成为骗局的代名词。这容易给我们的分析工作造成一个错觉，就是我们总是在追赶这个时代的变化，分析总是慢人一步。


    在这个问题上，我更愿意用亚马逊的创始人贝索斯的哲学来应对。他曾说过，


    我常被问一个问题：“在接下来的 10 年里，会有什么样的变化？”但我很少被问到“在接下来的 10 年里，什么是不变的？”我认为第二个问题比第一个问题更加重要，因为你需要将你的战略建立在不变的事物上。


    我非常认可贝索斯的这个理念，事实上我们过去被灌输了太多这世界变化太快东西，而这个世界上有些重要的东西，不会时时刻刻发生变化。《挪威的森林》这本书里，主人公永泽有个奇怪的读书原则：


    > “对于死后不足三十年的作家，原则上是不屑一顾的”。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '放在商业上，就是说 我们要关注历经时间考验被验证过的思想，而不是快餐式的时髦商业理念。


    过度关注太时髦的东西，你才会总有追赶不上时代的忧虑。


    第三，推己及人的方法能帮我们真正理解一家公司。


    培养分析公司基本面的手感，其实最好从你自己的公司和行业开始，因为很多东西的规律是相通的。


    虽然每个人都有自己熟悉的行业和公司，但很多人对他们并没有深入的洞察。


    建议你从自己的公司，或者自己熟悉的公司分析起，既把整套框架演练出来，又能在自己脑海里建立一个分析的资料库。等到面临新公司需要了解时，看看这家新公司和和脑海里熟悉的公司，有没有什么相通的地方。


    例如一个快递公司和一家白酒公司，看起来是风马牛不相及，但快递公司其实分为顺丰这样直营型的和三通一达这样加盟型的，而加盟型公司又不是全部加盟。哪些节点要亲力亲为地控制，哪些节点可以放开给加盟商并能更好地调动他们的积极性，都有很多的讲究。这些渠道组织形式上的心得，其实和白酒公司怎么铺设渠道，多少直营、多少代理，代理系统里怎么设置激励奖惩措施，怎么防止渠道间窜货等等的核心逻辑是一致的。当理解这些共通点后，相信你就能够迅速建立起对方行业的认知。


    虽然行业之间有相通的道理，但每个行业多少都有属于自己的“专业领域”，特别是一些专业性比较强的行业，像医药行业，你要吃透它还需要一定的专业知识。'
