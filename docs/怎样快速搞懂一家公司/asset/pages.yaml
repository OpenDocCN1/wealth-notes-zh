- pgno: 24
  md: '# “M”形曲线的运用


    现在我们就可以把两个理论结合起来用了。在新技术发展初期，行业会经历曲折，但经过了这个阶段，等到技术成熟，相关产品会慢慢广泛被市场接受，直到市场饱和，再走向衰落。


    在图形上，就体现为“N”形曲线和倒“U”形的曲线的结合，变成一条“M”形的曲线。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '![](img/fcc06d5a40106688a3ab4d10e60d81d3_25_0.png)


    好，现在你已经知道了这条曲线，你可以先找一些已经比较成熟的行业“练练手”，看看它的起起落落，看它每一个阶段是怎么过来的。当然这个分析的难度比较小，因为你面对的是已经有结论的行业，就像游戏里面，已经是个完全显示的高亮地图，而你在用“上帝视角”来俯瞰全局。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '然后，你不妨跳到眼前正在发展过程中的一些行业，这时候你就像身在迷雾中。


    比如互联网保险行业，你会怎么判断它的发展阶段？


    +   首先，你需要结合第二讲里对行业空间的判断，大致确认下行业潜在空间还有多大。


    根据官方数字，互联网保险 2017 年的规模是 1835 亿，而整个保险行业的规模是 3.6 万亿。渗透率是 5%，如果你认为互联网保险未来的渗透率将是 50%，那行业还有
    90%的路没走，如果你认为渗透率极限就是 5%，那行业基本上走到了尽头。


    换句话说，你是在思考互联网保险竟为保险业带来了什么价值，是技术提升带来的精算水平提高？还是费用带来的节约？ 这里，我还是倾向认为，互联网保险会对保险业带来长期巨大的影响。


    +   其次，你需要搜集这个行业发展的里程碑事件，判断它是在上升期、平稳期，还是衰落期。


    互联网保险在过去几年飞速发展，6 年的时间里规模增长了 60 倍。但近两年的发展，却不尽如人意，2017 年甚至出现了 22%的下降。原先选择这条赛道的创业公司，也很久没传出来融资成功的消息了。可以说，互联网保险行业近两年遭遇了低谷。


    综合前两点，我的初步判断是：互联网保险处在长期的萌芽期和短期的低谷期， 也就是在“M”形曲线左半边下降的趋势里。


    +   最后，你要判断它在当前的位置可能还会待多久，是什么因素会导致下一个转折出现。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '当行业处在“M”形曲线的左半边的时候，往往要看关键技术的突破，而处在右半边时，往往要看渗透率的提升，有没有突破临界点。


    当你能更好地找准要分析的公司处在什么样的位置上，你就能更好地预判接下来的走向。这往往是很考验你独立思考能力的时候。


    大多数人都认可的趋势一定正确吗？未必。比如 2014 年的时候，很多人根据自己的使用体验都认为微博已经不行了，但那时候，恰恰是微博开始转向 90 后、转向更有生命力的各个垂直领域的开始，之后它就迎来了新一轮的繁荣。


    # 本讲小结


    这一节我们讲了一套产业的生命周期框架，是结合了创新的扩散过程和技术成熟曲线两个理论。这两个理论很成熟，你可以在充分理解它们的基础上，灵活运用。


    +   新事物先看供给要素，也就是产业的技术是否成熟，在此过程中，产业和资本的追涨杀跌会放大新技术的波动，就构成了技术成熟度曲线；


    +   在技术相对成熟后才过度到需求，需求有爆发的临界点、和趋于稳定的饱和点，就构成了创新扩散曲线。


    两条曲线的组合就是我们给出的产业生命周期框架。当你锚定了一个行业究竟走到了哪里，未来还要走多远的时候，你会更从容地判断它接下来的路要怎么走。'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 4. 搞懂行业竞争格局


    前面我们依次分析了行业空间、行业所处的阶段，算是回答了赛道有多宽，有多长的问题。那么，接下来的问题自然是，赛道平坦吗？或者说，谁能在这条赛道上取得领先？也就是对竞争格局的判断。


    搞懂竞争格局，我们才能明白，眼前行业的这块大蛋糕，到底有多少是属于公司的。


    # 结合行业规模与阶段看竞争格局


    前面谈到的行业空间、阶段，也都和行业的竞争格局息息相关。因为行业规模决定了竞争的激烈程度，行业在不同发展阶段，分析竞争格局的重点也不一样。


    我们先来看行业规模对竞争格局的影响。


    商业有它内在的逻辑，规模巨大的市场，一定会吸引众多的参与者，竞争也会随之激烈。遇到很多竞争对手的时候，至少也说明路走对了；反而没有对手一骑绝尘的时候，虽然有可能是太领先了，但也有可能是这个领域本身蛋糕太小了。


    接下来，我们看行业发展阶段对竞争格局的影响。 主要有两点需要注意：


    +   第一，行业发展不同阶段竞争强度不一样。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '如果行业还处在高速增长期，即使是一些实力一般的玩家，都有可能冲


    市场上分一杯羹；而如果行业增长渐趋稳定，行业产能开始过剩，要比拼


    精细化的运营，低效率的玩家就没有竞争力，多余的产能就会被淘汰。


    +   • 第二，如果行业仍在高速成长，即使领先者拥有可观的份额，依旧是


    比较危险的。因为每年释放出来的空间都很大，领先者随时可能被颠覆。


    比如说某公司在一个市场拥有 50%份额，但市场每年增长一倍，那如果


    个公司没有跟随行业增长，只是维持原样，一年过去份额就会跌去一半。


    这个现象在我们国家当前很突出，因为大量行业都在快速成长。


    # 预见终局和没有终局


    上面说了你要结合行业规模和发展阶段，来分析行业竞争格局。接下来


    你需要知道，竞争格局通常有哪几种常见的“终局”，因为看得到“终局”，


    你更容易知道，你要分析的公司存活的概率有多大、存活下来后发展的


    空间有多大。


    “终局”一般有三种：


    +   • 第一种是，强马太效应导致的一家独大。比如腾讯在社交领域，用


    户这方面所有需求几乎都能被满足，没有太大动力选择第二家的产品。


    互联网投资里常说的一句，“老二非死不可”，说的就是这种格局。


    +   • 第二种是，双寡头或者多寡头的平衡，比如视频行业的格局。最初


    有几十家视频网站，后来像淘汰赛一样，6 进 4，4 进 3，3 进 2。这


    种行业通常有一定的规模效应，领先者有一定优势，但也需要靠不停


    地投入资源来确保地位。


    +   • 第三种是，相对分散百花齐放或者各领风骚数年的行业，比较典型


    的就是内容生产行业，如游戏、影视剧等等。这种行业本身门槛未必


    很高，也通常没有网络效应或是规模效应，甚至规模到了一定程度后，


    管理成本会比收入的增速更快，所以没有办法做到赢家通吃。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '不过，我说的“终局”是加引号的，因为任何市场的终局，往往都是中局，中间的中。商业的战争也没有终点，有时候貌似行业达到了一个平衡，但往往会被高维度的因素影响和改变。


    举个身边都看得到的例子：方便面。


    本来方便面在国内是一个 800 亿规模的巨大市场，但估计谁也没有想到，打败它的敌人竟然是美团外卖和饿了么。煮包面凑合一卜的生活节奏一下子变成了点个外卖，结果方便面的市场很快就陷入萎缩。


    随着时代的变化，一些原本八竿子打不着的人就会变成新的竞争对手。如果时间回到 2010 年，让你描述方便面行业的未来竞争风险，谁又会想到外卖呢？


    所以，竞争格局其实是件很有趣的事情，它永远都在动态变化，你看像互联网这样的新行业，一些风马牛不相及的玩家之间都会发生冲突，尤其是罗胖的“用户时间争夺”这个终极理由一出，互联网里从此没有朋友。2017
    年很多 APP 的用户使用时长都出现了下降，据说《王者荣耀》就背了不少锅，成为很多公司的假想敌，而到了 2018 年，这个锅又甩给了抖音。


    前面我们举了不少例子，总结起来，当你要考察一家公司所处的行业竞争格局的时候，你通常需要从这几个角度去做功课：


    +   - 第一，这个市场的规模决定了能吸引多少竞争者，如果现实的竞争激烈程度与此不符，那竞争者是不是迟早要来，或者说为什么不来；

    - 第二，这个行业已经进展到了什么阶段，是供不应求？还是供过于求？以及行业是否增速太快，会导致现有的竞争格局不稳定；

    - 第三，这个行业本身的特性，将来更可能向垄断、寡头还是充分竞争的平衡状态演变；'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   - 第四，这个行业如果竞争态势已经相对平衡，潜在的打破现有平衡的因素会是什么？


    # 理解产业链博弈


    刚才我们讲了行业竞争格局，但其实广义的竞争，并不局限于处在同一平面的玩家。现代经济高度的产业分工，导致产品的生产过程会包含很多环节，而行业创造的价值，也要在多个产业链环节之间进行分配。所以产业链博弈也是竞争中非常重要的一环。


    我这里之所以用的是博弈，而不是竞争，是因为同类玩家之间的竞争，往往是刺刀见红的肉搏，而产业链之间更多是瓜分价值，目的绝不是为了消灭自己的上下游，所以用博弈这个词更恰当些。


    下面我会讲讲怎么分析产业链博弈。


    一个简单的 方法，我们把上下游的企业都画在一张图上：


    如果某一个环节集中了大量的公司，那通常这个环节竞争激烈、偏同质化，也没有定价权。而如果某个环节对技术、资本或者服务的要求特别高，只有少数几家甚至一家公司能抢占这一环节，那他们所在的环节就特别有议价能力。
    关键看谁有更多的选择，说白了，八个男生追一个女生，那女孩儿还真可能挑花了眼。


    比如大家经常谈到的 产品与渠道，就是产业链博弈的最佳写照。


    +   - 你一定听过“渠道为王”的说法，像苏宁、国美、沃尔玛和家乐福这种大卖场，零售品牌就很依赖他们。


    +   - 淘宝和天猫更不用说，千千万万的卖家那是既爱又恨，最后还不得不投入大笔的广告费来保障销量。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '+   - 最极端的例子要数网页游戏。本来产品和渠道是 7:3 分成，产品拿 7，渠道拿 3。然而后来开发商多了，而用户量却相对有限，僧多粥少，渠道变成了香饽饽，发展到最后，渠道要拿走
    70%～80%。


    产品方的弱势一部分来自门槛低、竞争激烈，但最主要的点还是在于同质化。试想一把雨伞、一包纸巾，这类产品必然依赖渠道的曝光。


    非同质化的产品就不一样，例如内容行业，虽然电视台家大业大，虽然视频网站已经竞争到只剩主流的 3 家，但它们仍逃不脱高昂的内容成本，只得接受优秀内容的价格一涨再涨。内容方也就形成了百花齐放的业态，只要有独特的竞争力，永远不会嫌入行太晚。


    当然，如果能同时兼具产品和渠道，则更有可能打造出更持久的商业模式，比如我们看到美国的几大传媒集团，迪士尼、新闻集团、康卡斯特等等。


    所以，当你要从产业链的角度去考量一家公司的竞争格局的时候，有这几个问题要问自己：


    +   1. 它所处的产业链的每个环节是什么；

    2. 每个环节的拥挤程度如何，进一步看，哪个环节更有议价能力；

    3. 相对拥挤，或者说没有议价能力的产业链环节，提供的产品是否是同质化的。


    # 本讲小结


    分析行业竞争格局：


    首先，结合行业规模和行业发展阶段去看：行业规模越大，竞争往往越激烈；行业供过于求时竞争更激烈；如果行业仍高速发展，即使是领先者也无法掉以轻心。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '**然后**，你要根据行业本身特性去看它未来最可能的“终局”，但也要知道，商业战争没有终点，总会存在新的维度去打破现有平衡的可能性。


    **最后**，产业链博弈也是广义的竞争，渠道为王并非空谈，它反映的是渠道在产业链上更有定价权，打破渠道垄断的关键在于非同质化的产品，而兼具渠道和产品的模式最能持久。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 5.认清公司的商业模式


    前面我们一直在整体地分析一家公司所处的行业，也就是赛道，接下来要考虑的是什么样的车跑在赛道上，也就进入了分析具体的公司环节。


    # 找到驱动公司增长的关键指标


    之前我们分析了公司所处的行业，那整套分析框架，能帮我们勾勒出一个公司理论上能拿到多少蛋糕。接下来，就要分析它是怎样拿到的，以及它具备什么样的能力，来确保成功。


    换句话说，就是分析它的商业模式和可行性。


    不夸张地说，“商业模式”这个词，媒体里讨论的很多，但真正理解的估计很少。而且由于不同行业、不同公司的商业模式千差万别，很难去做一个简单的分类。


    所以，我们不妨回到前面提到的那个最基础问题，“它提供的是怎样的产品，解决了什么问题”，从这个问题出发，然后具体问题具体分析。


    同时，因为公司创造的价值，最终会以数字的形式体现在公司的收入上，所以你可以去尝试把公司的收入公式写出来，这样就更能看清楚它商业模式里核心驱动指标是什么。


    公司的收入，往往是几个指标的相乘，所以，一个公司的成长，也就可以拆解为这几个关键指标的增长。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '通常而言，你可以在公司的财务报表中找到这些关键指标，比如快递公司的财务报表会说包裹数是多少，平均单价是多少，比如电商公司会说交易额是多少，佣金率是多少。


    但如果是非上市公司，或者说有一些财报不大众友好的公司，可能他们报表里会说收入增长了多少，是因为“业务增长所致”这类没用的话。这种情况下也不是完全没有办法，那就需要结合更多第三方的资料，或者根据行业水平来估算、根据上下游客户推算等等方式，来尽可能靠近各项指标的真相。


    对大部分处在增长中的公司来说，是多数指标相对静止，有一个核心驱动指标在带动公司成长。优秀的公司，总是会预估每个指标的天花板，在现有的指标动力衰减之前，去寻找新的增长接力指标。


    一个公司如果发现现有的收入乘法里，每个指标都面临突破的瓶颈，就必须去寻找新业务。你观察好多世界 500 强的公司，经过几十年的成长，业务矩阵已经复杂到难以形容。这个时候你搞懂一家公司，可能需要研究几个不同的行业，然后写出来几个不同的乘法算式，再把它们加起来。


    有加法，也有减法。


    所谓减法，就是反过来，把自己从多元化经营，拉到更聚焦的位置上。通常人性倾向多就是好，所以减法更难能可贵，如果公司认为多元化经营反而带来了效率的下降，就有必要砍掉效率低下的业务，把有限的资源运用到性价比最高的事情上，所以减法并不一定意味着收入的下降。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 同质化竞争下的商业模式观察


    能把公司的收入公式写出来，你也就知道了这家公司最基本的商业模式。但这还不够。


    我们探讨一个比较实际的问题，假设我现在让你来分析一下直播行业，或者共享单车行业里的某家公司。你就会突然发现一个问题：这类公司，怎么判断它能不能在同质化竞争的百团大战中脱颖而出？有好的商业模式就够了吗？显然不是。


    以共享单车为例：


    摩拜单车其实是一款非常具有创造性的好产品，而且有稳定的商业模式，投资人小心翼翼地算了很多遍，模型显示都是可持续发展并且赚钱的。但可惜的是，正因为这个模式太好，资本除了投资摩拜，也流向了其他竞争对手，直接把这个行业的供给放大了
    10 倍，导致最后漫山遍野全是自行车。公司被拖入恶性竞争，被迫投入了远超原计划的车辆，原有的模式也大打折扣，因为各种颜色的自行车太多了。


    摩拜的例子告诉我们，单纯的产品或商业模式的好坏，不体现竞争力的强弱，越好的产品反而会招致越多的竞争。


    所以，客观上必须承认，大部分行业里，同质化的竞争里，靠的是比拼运营、执行、资本和一点点运气。我们没必要把每一个公司的成功，都归结于商业模式上的胜利。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '但你也要看到，看似同质化的竞争里，看似同样的商业模式里，不同公司战略定位可能会有不同，而且会在以后的战略的执行中，放大这种不同，这是我们分析公司不能忽略的一个方面。


    我这么说可能有点儿抽象，举个例子就会清楚很多。


    早年携程一家独大，但却眼睁睁地看着去哪儿在自己眼皮底下成长起来，并且被拖入价格战的泥潭。按理说以携程当年的领先优势，是不应该发生这样的情况的，但问题在于，携程是把在线旅游作为自己的目标市场，但这个市场是一个每年增长
    50% 的快速变化的市场，其实很不稳定，会有很多竞争者。而去哪儿把目标市场定义在一个相对恒定的东西上——资源，航空运力就这么多、酒店总共就这么多，这些不可能以每年
    40% ~ 50% 的增速增长，所以去哪儿一开始就做了国内首家可以在线比较机票和酒店价格的搜索引擎。这个目标市场是恒定的，做到了老大就是老大。去哪儿的后来居上，很大程度上归功于他们一开始就采取了更先进的打法。


    我再举一个更加好懂的例子，网络综艺节目《创造 101》里异军突起的王菊，也是引入“新商业模式”的典型。


    可能你未必熟悉这个节目，但估计你对一般的少女选秀节目还是有一个大致的感觉——一群清纯可爱的小姐姐，比舞蹈、比声乐、比颜值等等。而王菊本身是一个看起来比较成熟、略胖、皮肤比较黑，一些唱跳基本功也相对欠缺的女孩。其实不大符合传统少女选秀的路径，所以她前期几乎每次都站在被淘汰的边缘；但王菊在这种情况下，喊出了对女团重新定义的口号，把竞争的要素拉到了自信、勇气、个性上，突然激发了观众的大量支持。


    也就是说，后发制人的玩家，很可能在商业模式上有了巨大的进化。在看 似提供相同产品下，一个行业里，不同的公司会对自己有不同的定义，这种定义其实也就是我们常说的战略定位。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '想要更好地洞悉一家公司的商业模式，和它对自己的定位，其实你需要做的就是，**在理解一家公司的过程中，不要被行业的领导者的思路带着走**。


    重新思考那个最基础的问题“这家公司提供了什么产品，解决了什么问题”，不要使用现成的答案。尤其是如果这家公司产品是面向消费者的，对产品更加深入的体验也能帮助你回答这个问题。


    # 本讲小结


    这一讲我们进入分析具体公司的环节。


    首先，你需要把公司收入的公式写出来，看清增长的核心驱动因素，并且要关注公司是否在新增业务或减掉业务。


    其次，你要知道，在一个同质化竞争的行业里，单纯的产品好是一个很脆弱的优势，因为竞争对手容易模仿；而看似同质化竞争的公司，可能对自己有不同的定义，商业模式上的进化，能实现后发制人。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '# 6.找到公司的护城河


    上一讲我们说了，在公司的分析框架里，最重要的是看有没有竞争对手不易模仿的要素，这种不易模仿的要素，在巴菲特的框架里，就被称为“护城河”。


    护城河理论非常经典，并且按照它挑选出来的公司，都反复被巴菲特杰出的投资业绩所验证，所以我接下来主要就围绕他强调的四点来展开。它们分别是无形资产、商业模式的网络效应、用户转换成本和产品成本。


    # 巴菲特的经典四要素


    护城河的第一大要素是无形资产。


    无形资产就是无法简单用钱来衡量的东西，最主要是品牌和专利。


    好的品牌能让用户更方便地找到你，最极致的情况就是，一个品牌和一个行业划等号，比如可乐里的可口可乐，剃须刀里的吉列，搜索引擎里的Google。


    品牌不仅降低了公司的营销成本，甚至能帮助公司的产品实现更高的定价。


    专利也是一种护城河，但我建议把它作为一个动态的指标来看，去看一个公司不断创造新专利的能力，它背后体现的是公司持续的创新实力。


    护城河的第二大要素是商业模式的网络效应。


    这里有三种情况：'
  merge: -1
  img_proc: true
- pgno: 40
  md: '第一种就是我们一般说的规模效应，就是规模越大，效率越高。


    比如共享单车，哪一家公司的车子越多，用户用它就越方便，但它是一个单边的模型，也就是说只有靠公司单方面加大投资来形成规模，争取用户。


    第二种情况我们叫做双边经济模型，像出租车、专车领域就是，它有司机的需求，也有乘客的需求，更多的司机会带来更多的乘客，更多的乘客也会带来更多的司机。


    再举个很容易理解的例子：


    比如酒吧这样的社交场合，大家都希望异性能多一些，于是酒吧想了个策略，它对女生收低价来吸引女性顾客，女性顾客增加后男性顾客也会增加，酒吧再对男生收高价，结果双方都实现了社交需求，酒吧也赚到了钱。这种相互促进的双边模式，经济学上就叫双边经济。


    在取得领先后，双边模式往往会比单边模式的竞争壁垒更高一些。


    第三种是网络效应，社交类产品非常典型，用户主动传播，帮助公司接近零成本获取新用户，它已经不只是一个双边模型，而是一个多边的网络模型，用户越多，网络的价值就越大。


    护城池的第三大要素，是用户转换的成本。


    转换成本的高低，决定了先发优势的稳定性有多强。网络效应强的产品自然不必说，例如微信，用户的很多东西都沉淀在上面，绝不会轻易更换。


    还有一些转换成本高的例子，像 office 这样的办公软件，如果要更换其他新产品，需要从头再来学习一遍。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '而像日用快消品，换一个新产品毫不费力，这也是为什么，转换成本越低的品，就越会把精力投入到渠道建设中，来弥补这种不足。


    护城河的第四个要素，是提供这个产品的成本。


    在面临同样的产业环境时，成本领先一直是竞争的有效手段之一。成本领先可能来自于规模效应、可能来自于先进的技术，当然，也可能来自于这家公司精益求精、步步为营的长期建设。


    # 利润率是第五个壁垒


    前面讲了巴菲特经典框架里的护城河，能拥有护城河里的若干要素，是一家公司取得最后成功的关键。那如果这几个所谓的护城河都没有，又该怎么办？


    其实还有一个看起来有点无奈，但又是非常有效的壁垒，那就是利润率。


    有这么一个比喻：


    肥美的草原上一定有无数牧羊人。


    就是说利润丰厚的地方，竞争者一定很多。所以与其让竞争者瓜分市场，领先者还不如主动降低利润率，来获取更大的规模和影响力。


    我们看美团和滴滴竞争的例子：


    滴滴在处于垄断地位后，不仅没有建立起对手不易模仿的护城河，还实现了较高的毛利率。这相当于用高音喇叭向世界宣扬，我独自享有一块水草茂盛之地，可不就招致了美团铁蹄的无情踏入。假如滴滴花更多的钱，把调度做的更好、把地图做的更准、给司机更多的激励，'
  merge: -1
  img_proc: true
- pgno: 42
  md: '不仅在建立更深的护城河，短期的财务报表拿出来，估计也让潜在对手更加企望而却步——潜在对手会想：连唯一的垄断者的财务报表都这么不好看，那又何苦自己再去插一脚。


    # 小米在这一点上看起来就做得更好。


    雷军在小米 6X 发布会上，向所有用户承诺，小米硬件综合净利润率永远不会超过 5%。当时可是小米上市前的关键节点，难道雷军不在意小米的利润和估值，不用对股东负责了吗？恰恰相反，小米在硬件上要的是规模、是用户体验、是护城河，低利润率有助于战略的顺利执行。


    虽然利润率低能形成一定意义上的壁垒，但并不是说公司就一定要为形成护城河而放弃大部分的利润。


    现实里一家利润率低，但有竞争力的公司，往往有一个"后手"，就是靠前端的低利润率模式，有能力带出后端一个赚钱的模式。


    在小米的例子里，硬件可以不超过 5% 的利润率，但小米有广告、有内容分发、会员费等等，这些都有超高的利润率。在硬件的大用户量基础上，小米总体的盈利能力还是很强的。


    当然，我们提到的以上五点，是经典的护城河理论，再加上我的一点理解，护城河的内涵远远不止这些，而且也一直动态发展的过程中。


    特斯拉的创始人马斯克就表达过对护城河不屑一顾的态度，因为在他看来，再深的护城河也挡不住前仆后继的进攻者。唯一的办法就是只能疯狂地创新，不断向前跑。但你仔细想想，特斯拉这种疯狂向前跑的姿态，其实就是在为它构造护城河，而且马斯克非常清醒，护城河是动态的，而不是让你安稳地倚靠的。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '此外，我们分析公司的护城河的时候，也需要考虑资本的要素。资本市场的火爆会加大一个公司塑造护城河的难度。


    在巴菲特的时代，一家公司还有可能进入一个前景巨大的行业，然后凭着它的工匠精神，慢慢成长成一个伟大的公司。但在这个时代，资本已经不允许了，一旦商业模式被验证是可行的，接下来就是在资本的助推下大规模复制。共享单车就是典型的例子。


    # 用财务数据支撑你的判断


    这一讲我们分析一个公司的护城河，切忌不要想当然地主观判断一家公司是否具备这些护城河，财务数据是支撑护城河判断的重要论据。


    +   如果你觉得一家公司的护城河是 品牌，那你要看，跟同类产品相比，这家公司的产品是不是有更高的定价和更低的销售费用；


    如果你认为一家公司有 规模效应，那你要看，它收入的增速是不是快于成本的增速，利润率是不是会随着销量的增加而增加；


    如果一家公司的产品有 多边网络效应，那通常它会有快于行业的客户数增长和边际递减的成本；


    如果你认为 转换成本 是一家公司的壁垒，那就看它是不是有较高的重复购买率和较低的营销费用；


    如果你判断一家公司有 成本优势，那它应该相比竞争对手有更高的毛利率和更低的费用率，你要去验证是不是这样。


    除此之外，更主动运用低利润率获取更大市场份额的玩家值得关注，而在壁垒不清晰的情况下过早追求利润，往往是一个短视的行为。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 本讲小结


    公司的护城河主要体现在无形资产、网络效应、用户转换成本、产品提供成本 等等方面。


    没有护城河时，越好的产品反而会招致越激烈的竞争。


    当大家商业模式雷同 时，利润率也扮演了壁垒的角色。


    # 7.洞察公司的“人”和“制度”


    前面我们已经讲完了怎么看赛道，也就是行业，怎么在赛道上看赛车，也 就是公司在行业中的竞争力。这一讲我们会说跟赛车关系很大的一个要素， 那就是赛车。


    我们去理解赛车，不仅是补充完整我们赛道-赛车-赛手的三段论结构，也 想反过来通过研究赛车，交叉印证，更好地理解公司为什么会出现在这样 的赛道上 和为什么选择了这样的竞争策略。


    我们这里偏向广义的赛车，不仅指公司的管理层，也泛指一个公司的管理 制度。当然，你会发现这在赛车问题的看法上，一二级市场各有侧重。


    +   一般而言，二级市场更看重制度，我们看到很多世界 500 强都已经成为了公众公司，职业经理人靠着制度的约束来操盘。巴菲特投资过华盛顿邮报、布法罗晚报、大都会广播公司等
    一系列媒体寡头。他也曾经说过，喜欢这类公司，是因为它有良好的制度保证产出，即使阿猫阿狗来管理，都能得到不错的结局。


    +   一级市场则很看重人的作用，我们经常听说某个知名投资人和某君吃了一顿饭就决定投资， 尤其是早期阶段的投资，核心团队的境界和能力就显得越重要。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '> 大量的例子表明，在靠人还是靠制度的问题上，新兴的行业和公司，人的作用举足轻重，而成熟的行业和公司，则更有赖于制度。


    所以不难理解：


    +   - 一级市场刚好是新模式、新公司占主流，人的作用就会凸显；

    - 二级市场，企业都是相对走到成熟的阶段才更有可能性上市，自然制度更被看重。


    当然，一个公司更靠人还是更靠制度，并没有绝对意义上的好坏区分，而是在不同阶段下，相对最适合公司战略的选择。


    # 观察管理层言行的三个要点


    风投女王徐新曾经对于她寻找什么样的创始人做过一个总结：


    第一，要有杀手的直觉，能看到人家看不到的东西；第二，学习速度要非常快；第三，要有使命愿景价值观；第四，要内心很强大，永不放弃，要够狠。


    我觉得她说的都很有道理，但我们仅仅是了解一家公司，大部分情况是不具备投资人那样和公司管理团队密切接触的机会的。即使像我这样以研究为谋生手段的人，也不是每次都能一开始就和公司管理层促膝长谈。


    不过好在我们处在一个信息极度丰富的年代，我会着重关注公司管理层在各个场合的发言、媒体报道，来拼出我想要的东西，这里面我会着重关注几个点：


    第一，管理层究竟是怎么对行业的趋势做出反应的。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '我前面几节都在讲如何分析行业趋势，现在刚好能活学活用。你可以结合前面已经建立的对行业和公司的理解框架，然后再看看公司管理层是如何应对的。


    这里面大概有三种情况：


    +   * 最有前途的管理层 都在引领行业，比如在知识付费领域，我至少一半以上的行业认知都来自于罗辑思维这家公司，虽然说现在做知识付费的人多如牛毛，但我们是很容易知道谁是带头大哥；

    * 普通的管理层 至少会时刻跟踪行业的热点并积极应对；

    * 比较弱的管理层，他们的发言和几年前相比经常也没什么太大的长进，对行业的理解甚至和你研究了一阵子的成果也不相上下。


    第二，管理层的基因。


    一个公司的基因，是由管理层的基因所决定的。管理层到底是激进还是沉稳，放眼大局还是关注细节，你都可以从新闻里看出来。


    我建议你可以重点关注一下管理层言行之间的关系，观察他们之前信誓旦旦的说法在之后是得到了贯彻执行还是闭口不谈。


    第三，管理层对风险的预判。


    看管理层洞察到的风险是否领先于市场，如果是，那这个风险往往就不再是风险，而如果管理层对风险的洞察还达不到市场平均水平，那才是最大的风险。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '除此之外，赛手的情况还可以通过股权结构来进行观察。你可以通过36氪、IT桔子之类的网站，再结合企查查、天眼查之类的工具，去了解公司的股权情况。


    一般而言，值得关注的指标包括核心人物持股、重点员工持股、公司的投资人等情况。一个健全的股权结构会为公司的成长保驾护航，但诸如核心团队持股太少、几个联合创始人持股过于平均、员工股权不足、投资人的利益冲突等问题都可能拖累公司的发展。


    最后，关于人。我还有一个观察的小诀窍，你可以去看这个时代高水平的牛人都往哪个行业、哪个公司去跑，那一定是代表了未来的趋势，至少是中短期趋势。


    这个逻辑和“没有美女的行业是没有前途的”有相通之处。毕竟，你只在花几个小时、几天去了解一家公司；而别人，还是比较优秀的别人是赌上自己的前途去押注一家公司。


    # 观察管理制度的两个要点


    前面我们讲了，公司的初创期、商业模式确定后的一段时期内，人的作用都是无限凸显的。而过了这些阶段，一套良好的管理制度，就在赛手这个因素里扮演更重要的作用了。


    能轮到分析管理制度的公司，通常具备了一定的规模和历史。所以很自然，好的管理制度，首要就是要避免或解决组织过大带来的低效。'
  merge: -1
  img_proc: true
- pgno: 48
  md: '说起公司内部的摩擦力，就不能不提名鼎鼎的科斯和他的理论。


    20世纪中期，科斯就指出，公司为什么存在？是因为市场交易有成本，而公司内部组织协调也有成本。如果公司内部组织协调的成本低，那么公司的存在，就节约了市场交易的成本。但反过来，当公司内部组织协调的成本比市场交易成本高时，也就是公司的边界了，因为一旦跨过这个界限，公司反而是没有效率的。所以，从这个角度看，公司的管理制度，决定了一个公司所能到达的最终高度。


    一个公司的管理制度，看起来是比较抽象的概念，也不大容易量化，作为外部的观察者，更像是看着一个黑匣子在运行。


    在有限的信息下，我通常从两个方面去衡量一个公司管理制度的好坏：


    +   - 第一是观察一个公司的企业文化。企业文化是公司管理经验的最好凝练，是一个公司的价值观，估计你时常听到某某公司特别有狼性、某家公司执行力特别强，这些都是侧面衡量公司管理水平的定性标准。


    +   - 第二是跟踪公司的人效比，就是每个员工平均为公司带来了多少的销售额或者业务量，它的变化趋势侧面反映了公司的组织效率。当然，它默认的使用条件是公司的业务没有发生本质变化，否则人效比的指标就会失真。


    # 本讲小结


    赛车是操控赛车驰骋在赛道上的灵魂。狭义的赛车就是指人，初期人的作用是最大的，但广义的赛车还泛指管理制度，后期公司的发展更有赖于高效的管理制度和组织架构。


    这个时代，媒体上有大量公司管理层言行的公开资料，管理层不会无缘无故地公开言论，每一次露面都值得重视，尤其是他们眼里公司所面临的风险和挑战，观其言、察其行、知其底。'
  merge: -1
  img_proc: true
- pgno: 49
  md: 公司发展到最后，是业务规模扩张与组织自我进化之间的赛跑，也就是说公司的管理制度，决定了一个公司所能到达的最终高度。
