    社群是运营起来的，社群是团队运营起来的。我们社群里有很多财富，任何一个群运营好了，一年都能赚一两千万。一个社群上了1000人，运营好一个群就能赚2000万，我说的就是你一个人。我告诉你，这1000人当中你运营起来十几个人，一年就有2000万收入。收入不是别人给你钱，隐形的传播都是钱。


    《增广贤文》里面有一句话叫，富人思来年，穷人思什么？富人思考来年，穷人思眼前。为什么你穷？你只看到现金。为什么有些人很富，他能看到里面隐藏的价值。你们为什么赚不到钱？你们为什么做得这么难？你们捡了芝麻，丢了西瓜，这是你们对我们社群干的活。


    社群要运营起来，要具有主人翁精神。你觉得你就是来运营好社群的，你是为社群做贡献的，你就真能运营好，否则你运营不好。


    流量要到直播间、要到视频里，内部的流量也要运营起来，读书会的每个群的流量要运营起来，老板社群的流量都要运营起来，在运营的过程当中去赚钱。“在运营的过程当中去赚钱”这句话很有意思，这句话你们很多人也听不明白，你只要在运营这些流量，就自然会赚钱。


    ### 2、品牌营销内核的东西就是这个价值观


    我们社群的人很多，所以我们要从整体上去运营我们的价值观，从整体上去传播我们的价值观。内部讲课、读书会讲课，去传播我们的价值观。


    录一个视频，我们要什么样的人，不要什么样的人，或者我们再录一个视频，怎么样做一个美女老板？怎么样做一个企业家？这是我们陈昌文老板社群的价值观。或者开一场直播，我们应该怎么做人？应该怎么做事？应该讲道德素质，讲仁义礼智信。


    录制视频、音频传播到读书会，传播到整个群，并且传播到抖音号，开直播，让相关人士去看。我们现在要干的是讲师团整体传播我们的价值观。我们讲课并非只讲营销+恋爱，还要传播我们的价值观。我以前给大家讲过价值观营销特别重要，认同你价值观的人一定会买单。


    苹果公司就是这样讲的，所有的宗教都是这样讲的，所有的党派都是这样讲的。苹果公司的营销策略是非同凡响，与众不同。乔布斯在的时候，他是这个价值观，当然现在可能有所变化。


    乔布斯的营销，他说非同凡响，与众不同，具有创新精神。苹果手机出来过后，赞同这个价值观的，他自然就去买苹果手机了。他不会考虑苹果公司手机的性价比，他不会去看
    CPU 什么的，不需要看，买就 ok 了。这就是价值观营销，买就 ok 了。


    工匠精神，包括罗永浩、雷军，他要站在一个价值观上去营销。品牌营销内核的东西就是这个价值观。你买就行了，别废话，理解吧？买就行了，别废话。


    ### 3、我们要讲价值，也要讲价值观


    这个必须是价值观传递到位，所以我们要讲价值，也要讲价值观。


    价值，就是我们卖什么，我们读书会的价值，我们陈昌文老板社群的价值，我们书籍的价值。


    价值观，我用我的价值观、陈昌文老板社群的价值观、做人的价值观、儒家思想的价值观做人事，当领导的方法论。


    陈昌文老板社群的价值观，我们的价值观是我们跟什么人接触？什么人我们不接触？你是什么人，才有资格到我们这里来？这也是我们的价值观。把这个讲明白，我们的销量自然会好，也没有人扯皮，喜欢扯皮的不要来。


    我们的恋爱课也有我们的价值观，你认可吗？认可，你就来学，不认可别学。我们讲《论语》这个观点，你认可吗？认可就来，不认可别来。我们讲营销，要怎么样去做营销，认可来，不认可，别来。这是一个很重要的价值观营销。


    我们的讲师团要用价值观去营销，就这个事情，能做还是不能做？错到哪里？整体宣传、读书会宣传、陈昌文老板社群里宣传、外面开直播宣传、做视频宣传。还有，我们陈昌文老板社群里，什么东西不能宣传。这是我们社群的价值观宣传。我们所有讲师都要去干这个事情，整体运营去干这个事情，这样我们的价值观就和社会沟通了，就和粉丝沟通了，就会很少有误会。


    比如说今天我们讲一个儒家思想的价值观，或者说我们讲一个陈昌文老板社群的价值观：不骗人。这肯定是我们很重要的一个价值观。实事求是，无承诺，喜欢我们、愿意报答我们，才给我们红包；不愿意报答我们，不要给我们红包，免得有纠纷，这就是一个很好的价值观。做成视频，每个人都去做一个视频，出一个文案，传到抖音上，别人就知道我们是这样的社群，这个就是价值观营销。以后我们社群也没有那么多扯皮的的了，然后我们社群外面有人在骗人，我们的整体粉丝就会揭发他们。


    ### 4、人会认可价值观，就会收心收魂，这是营销的生存逻辑


    我们群里有一些搞破坏的，是因为我们的价值观没有营销到整体粉丝，没有营销到内部粉丝，也没有营销到外部粉丝，导致别人有空子钻。那么就给他们撒点农药，给整个社群撒农药，读书会撒农药，陈昌文老板社群撒农药，整个粉丝团、所有的粉丝全撒农药，几百人、几千人去撒农药，这就是价值观的铺垫。把这些草都给我拔了，这是整体运营。这样整体性的纠正，然后又传播了我们社群的价值观，它会带来粉丝，也就有了变现。


    价值观的传播会特别的厉害。比如说，你做抖音，你一天做了30个视频，你讲一下价值观，对吧？你不要老是在扯这个婆媳关系、老公老婆，你拍了三个视频，你再扯一个价值观。你说我们陈昌文老板社群的价值观是什么……人们认可价值观，就会收心收魂，他只要认可你的价值观过后，他再看你的每个视频，他都会认为你说的每句话都是对的。这是营销的生存逻辑，这个逻辑是非常厉害的，会厉害的不得了。


    我说古代，我不说现代，我们古代那些抛头颅，洒热血的人打天下，他为什么会去打天下？他就是认可的一个价值观，然后你说啥都是对的。乔布斯也是运用的这一招。


    你们不仅要传播价值，还要传播价值观。你们把这句话听明白了，你们的营销功力会上几个台阶的，这一招全部都是终极手法了，不是上几个台阶的问题。


    价值观就是让粉丝认可你，你只要认可你这个人了，认可了你这个理念过后，你说啥都是对的，比只卖价值有效得多。你们把这一句话听懂了，你们每个人的营销能力都会几倍的增长。撒农药比拔草更重要。这样会为我们社群建立一个防火墙，价值观、道德防火墙、法律防火墙。


    ### 5、人家会求着你来买单，这个叫价值观营销


    这个价值观是要走头条阵的，就是天下的粉丝都知道我们是这样一个社群，那么就不会出现各种各样的幺蛾子。这个价值观视频，几百人、几千人都要去传，我们社群做讲师的所有人都要去传播我们的价值观。


    比如说，今天的价值观文案出来了，所有人都去做一个传到所有的平台，然后粉丝就知道我们是一个什么样的社群。并且，陈昌文老板社群和读书会都要传播，内部的流量一定要运营，当然外部一定也要运营起来。


    打农药，传播价值观。从价值观这个层面去把社群的那些坏蛋、那些坏思想，把它全部给摘掉。并且在这个过程当中，你们还能吸粉丝，还能变现。


    认同你价值观的人，一定会买单——陈昌文内部讲话


    以前我跟一个高人学习过，那个高人告诉我，这个厉害的角色，一般情况下不要跟他成为仇人。这句话你们能听得懂吗？不到万不得已，这个事情就是没有办法了，不到万不得已，不要去惹厉害的，不要去跟他成为仇人。你跟他成为仇人过后，他的精力旺盛，因为没事做，他就会搞破坏。他搞破坏，就跟你搞破坏不一样，因为他有用不完的力量，所以尽量不要去得罪人，尽量不要去惹事，尽量团结人。


    所以说是整体运营，我们要关注整体，而不是只关注几颗杂草，我们是整体去运营传播我们社群的价值观，在这个过程当中你们还有利益，也可以赚到钱。如果是讲课、讲直播，那么传播的范围更广，这样纠正的效率更高，你们的能量就会更大，社群也就会更加的正能量。道德素质比能力更重要，这样整体势能就能运营起来。


    所以我们运营两件事，第一件事情是，自己的身心健康；第二件事是，团队的运营。传播我们社群的价值观，是会吸到粉丝，并且可以变现的。在抖音里传播我们的社群，人家会求着你来买单，这个叫价值观营销，他会求着你买单的。他认可你的价值观过后，他自然想加入陈昌文老板社群。你只运营粉丝就行了，你直播间运营到1000人、2000人，每天都有人求着你买单。以后进入我们社群的人，首先跟价值观正的人学价值观。


    ### 6、一定要用最有价值的东西，去运营陈昌文读书会和老板社群


    我们的所有社群、我们的读书会，那么多群，我们每个老师在里面发的任何一句话必须是有价值的。从我们书上找有价值的话，或者你发的有价值的话，或者是在直播间讲的有价值，或者你的视频有价值。


    **我们只允许给粉丝发有价值的东西，不允许发废话。** 我们发的这一句话出去，必须对粉丝有帮助，你保证你发了这句话是为大家好的，你才发。这个也是对社群的整体运营。


    **我们读书会、社群内部的流量是相当大的，一定要用最有价值的东西去运营，用我们书上有价值的东西去运营这些群。** 讲课要讲好，视频要做好，要往里面传播有价值的视频，一定要有价值，不允许在里面发垃圾信息。这样粉丝每天都会来看，而且会看上瘾。所以你们要去判断哪句话是垃圾信息。


    我们讲师团要通过价值营销，把这些粉丝留在我们这里，并且到直播间，进行整体的价值观传播，这样我们整体的势能会相当的大，流量自然就会非常的大。


    讲师团运营的是整个团队，运营的是整个团队的流量。


    流量有几部分：


    - 一部分是陈昌文老板社群的流量；

    - 一部分是读书会的流量；

    - 一部分是视频来的新流量、直播间来的新流量。


    整体流量的运营和传播，就会让我们的流量扩张，你的收入会更高。


    首先你要非常清楚，你发的每个视频和直播，以及你在群里发的每句话，以及读书会的每一句话、每一个视频必须是有价值的。没有价值的东西就毫无意义，流量是运营不起来的。这个东西有价值过后，大家追着看，如果你不能让读书会的人追到直播间，就证明你是个没价值的人。我们老板社群的人追不到你的直播间，也证明你没有价值。这么多人居然追不到你的直播间，说明你讲的没有用，说明你这个人对大家没有好处。


    结果错了，过程一定错。过程对了，结果就不可能错。你的流量居然没有运营到直播间去，你的传播力太小太弱。你在我们社群做讲师的，无论是读书会讲课，还是内部讲课，你没有传播力，你这个人真的是一无是处。这么多人听你讲课，你居然没有传播力，你想想？你这个人是多么没有价值，这不是搞笑吗？


    如果你在内部讲课人多，你到直播间讲课人少，说明你是负向循环，说明你这个人是有消耗的，你并没有带来价值。如果你在内部讲课人少，在直播间人多，说明你是正向循环，因为他们在帮你传播。


    ### 7、我们是网络合作、网络团队，讲师的本质就是管理者


    整体价值观融入到视频和直播。通过视频、直播讲课，在内部读书会和陈昌文老板社群进行纠正。建立信任自己的团队、信任自己的铁杆，去传播我们整体的价值观。这个价值观是保护每一个人的，保护自己不犯罪，增加自己的势能，这是各位老师要做的。我们社群有基础流量，你们把它运营好，我们的流量大的不得了。内部的基础流量、外部的基础流量，都把它运营好。


    我们为什么要运营社群？我们每个讲师本质上都是带团队的人，你别以为你是一个人，我们是网络合作、网络团队，讲师的本质就是管理者。我们讲课的人本质上都是管理者。你是一个人，但其实你拥有几百个人的合作关系、链接关系。我们在这里的每个人都不是一个人。


    - 你认为你是个企业家，你就是个企业家；

    - 你认为你是个个体户，你就是个个体户；

    - 你认为你只有一个人，你就是一个人。


    你本质上是在管理整个社群，如果你格局大的话，你就是管理的整个社群。如果你的格局够大，你是在管理着我们所有的外部粉丝、内部粉丝，读书会和陈昌文老板社群。你都在管理他们，你影响着他们，他们也会自然会给你带来利润，他们会传播你，就会有利润。


    当你没有格局，你认为那些人跟你没有关系，大家都跟你没关系，你赚的是小钱。所以马云讲了几句话，眼光是天下，你就做天下人的生意；眼光是一个国，你就做一个国的生意；眼光是一个省，你就做一个省的生意；眼光是一个县，你就做一个县的生意；眼光就是你那个家，你就做你那个家的生意。


    本质上是你的格局问题，所以你的收入低，是你的境界问题，是你的格局问题。你这个人两个字评价：不行。理解吧？你觉得你就是一个人，什么都运营不起来。就是两个字评价你，就是你这个人“不行”。


    你听明白了，你真的会很强大。不过放心，你们听不明白，而且你们也坚持不下去。


    ### 8、我们要干的，是价值观的传播，和团队的运营


    立体式、矩阵式做团队。你们的任务是立体式、整体式做团队，做传播，做视频，做直播，做内部传播、外部传播，你们要干这个，要把我们社群的整体价值观传播出去，具有教育意义。以后你让粉丝看视频，他知道我们的风气。价值观要正，错的要改。做视频、做直播去纠正，内部讲课去纠正，读书会讲课去纠正，去传播正确的价值观。


    一切都可以卖，社群的一切都可以卖出，而且这个东西在外面传播是非常厉害的。对于社会来讲，社会上的人将会看到我们的社群是一个正心、正念、正能量的团队，是一个有纪律的团队，是一个好的团队。所以我们的价值观要传播出去，让所有的粉丝都知道我们是正的。


    组织者、管理者，必须是三观正的，非常好的，一心一意想要做好社群的。坏蛋、没有能力的、三心二意的，这样的人不适合。


    我们要干的，是价值观的传播，和团队的运营。我们要运营的是每一个读书会，用对应的价值去运营。我们运营的是整体陈昌文老板社群，和运营你抖音账号的粉丝，整体运营，单子自然就多了。


    团队运营思维，讲师们本质上是在运营我们整体的团队。你们运营的这些思想、这些价值观要形成视频、直播，内部课、外部课，尽可能多的传播给我们的粉丝群体，这叫团队运营。


    你们的价值观正了，你们的粉丝多了，有搞破坏的，你们说让他不要那样干，他自然就不那样干了，他也不会跟你扯。比如说，你的直播间有1000人、2000人，你的粉丝多，支持你的人多，你让他别那么干了，他就不干了，他也不会跟你吵，否则他们从早到晚跟你吵。势能大了，人多了，他在直播间乱说，我们说我们不是这样的，你不要在这里瞎讲，他就不会瞎讲了，他改的会很快。


    要从势能上面去运营社群的价值观。付出了多少，你就该得到多少，付出一定有回报。付出不一定有回报，这是讲给下等人听的，付出一定有回报。你走的每一步路，都算数，你干的每一件事都算数。社群里真正做事的人，他一定会获得他应该获得的东西。


    不会缺钱的。你认为缺钱，你进了陈昌文老板社群，如果你这个老板还是个缺钱思维，我觉得你也没有必要在这里学了，我这些东西你也看不明白。不会缺钱，认真做道德上的事，钱都会来。不要急，该来的都会来，慢慢做，不要那么急，钱是赚不完的。你该赚的钱，自然会到你手上来。


    德本才末，有些人就是道德素质特别好，然后他也在努力干，但是他就是没有钱，他挣不到钱，这样的人是存在的，我们也能够直接否定别人。可是他这个财路没有来，他可能过个两、三年，三、四年，他的财路突然就打开了。他的德行有亏，或者他以前有欠账，对吧？他在还那些欠账。所以时运未到，存在这样的人。运到了过后，财自然就会来了。


    ### 9、形成团队传播，形成价值观的传播，最后形成低成本运营


    我们是要最赚钱，我们是要真理，我们是要走正道，我们是保证在绝对安全的情况下赚钱。安全、稳，比赚钱更重要，钱不会少。


    我们是怎么运营的？运营外部粉丝、内部粉丝、读书会粉丝，我们是讲给美女老板、美女企业家听的，是美女老板和美女企业家这两个关键词。美女老板和美女企业家，定位要狭窄，因为定位一旦广了过后，你讲的再有价值，别人也不听，因为别人觉得这个跟她无关，她就会觉得你讲的是废话。


    所以定位要极其狭窄，就是美女老板、美女企业家，用我们的书籍对着这群人讲。那么定位狭窄过后，你讲的每一句话就是精准输出干货，她就会感觉到是精准输出干货。


    只有定位极其狭窄，才能进行运营，才能进行团队运营。所有人拍摄一个视频、一个段子、一个价值观去传播。我们社群的每个老师本质上是一个运营专家，你赚的是运营的钱。运营的是读书会，运营的是陈昌文老板社群，运营粉丝。你赚的是运营的钱。


    那么这个群是怎么回事？不是说你仅仅卖了一个单子，你还要把这一帮人给运营起来。这一帮人去传播了你，成为你的铁粉，说我们陈昌文老板社群好，陈昌文老板社群有价值。这些人会给你带来新的流量，然后你又有成交了，它就像滚雪球一样，你把内部的粉丝、外部的粉丝都滚起来了，你的单子就会络绎不绝。我们陈昌文读书会、陈昌文老板社群的单子都会络绎不绝。


    形成团队传播，形成价值观的传播，最后形成低成本运营。我们拍视频，讲直播，讲内部、外部课，我们都是为了运营，传播价值观更有效率，更有威慑力、杀伤力的去营销。


    什么叫效率？就是你们现在在群里拔草，这个没有效率。讲内部课、读书会的课，讲老板社群的课，讲外部的直播课，讲视频课，所有人去传播我们的价值观，这样更有效率。


    什么叫威慑力？震慑力和威慑力。比如说我们群里有些人就是要骗人，他跟我们的价值观不符，由于我们的价值观传播给了读书会，传播给了内部讲师群，传播给了所有外围的粉丝，他在外面乱讲，人家粉丝就会批斗他。所以我们要形成我们的视频威慑力和震慑力，这是我们所有讲师要做的工作。这是品牌形象的运营，这个叫品牌形象、价值观传播。


    我们读书会的能量很大，那里面就是一年赚几千万，一个人就可以做到。所以你要听明白我这一套运营逻辑，就是一年带来几千万的收入。读书会的人非常的多，我们不是要他们给我们钱，而是运营他们，社会自然就会给我们钱，让他们去传播我们的价值观，让他们去传播我们书中的知识，让他们去做抖音号，我们自然就赚钱了。


