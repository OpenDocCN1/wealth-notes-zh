    # 写在前面 1


    # 《陈昌文方法之讲师宝典系列丛书》缘起


    这是一个移动互联网时代、视频直播时代、社群经济时代， 也就是说这是个互联网个体经济崛起的时代，人人发声的时代。每一个人都可以是平台上的一个主角、主播、经济个体，利用
    自己的特长去经营粉丝，获得流量，进而变现，这是一个新的 安身立命的生存方式。那么，说话，如何说话，就成了每一个 人必须且急需具备的技能。说话，代表了一种价值观，而通过
    说话达到变现的目的，就需要有超强的营销思维能力，从这个 角度来讲，人人都是讲师。


    +   通过阅读《讲师宝典系列丛书》可以有以下收获：

    1、你可以成为一个圈粉及变现能力超强的王牌主播；

    2、你可以把讲师做为安身立命的终生职业；

    3、依托此系列教程，你可以成为训练讲师的讲师；'
  - '[PAGE 3]


    4、通过陈昌文先生对讲师团队的训练和运营方法，你可以把这套管理经验嫁接到自己的企业里，搭建精英团队；


    5、通过陈昌文先生对“陈昌文老板读书会”和“陈昌文老板社群”自己团队的运营，老板及企业家们可以搬运这种互联网企业的运营思维和模式。


    # 《讲师宝典系列丛书》


    1、以儒家思想《陈昌文解读〈论语〉》为价值观体系的根基；


    2、以《陈昌文方法72大营销系统》为营销方法论；


    3、以指导陈昌文老板社群内部、外部讲师教学为主线。'
  - '[PAGE 4]


    # 写在前面 2


    # 学习《讲帅宝典系列丛书》经营企业的方法


    每个人都想获得财富，并守住财富。但如何做到呢？没几个人真正认真思考过。我们的儒家思想和陈昌文方法，就是解决这个问题的。陈昌文方法解决出单问题、营销方法论的问题。儒家思想解决财富安全问题、安身立命的问题。


    一、粉丝经济时代，要搞清楚干啥，才能快速获取粉丝？我们推出这套《讲帅宝典系列丛书》的目的，你只要学会演讲，你就可以日日不断的营销人。不断的发表观点，就有粉丝。不断的直播，有人听，这些人在某个时候深刻认可你了，就买单了。


    二、不要让所有人满意。我们社群收人的定义，就是只满足老板、企业家、富人，知道投资大脑，投资演讲能力是非常重要的。这些人不差钱、懂道理、明事理，知道跟着我们学'
  - '[PAGE 5]


    习的重要性，就是我们的客户。你不可能让所有人满意，让所有人满意的最终结果就是你没饭吃。我们的选择是，只让老板满意，只让富人、牛人满意，让聪明人满意我们就行了。然后他们加入我们社群，跟我们学习一辈子就行了。彻底认可我们的老板满意就行了。不满意的，听外面的免费课，就行了。这就是我们的策略，被动营销，姜太公钓鱼：只在直中取，不在曲中求。


    三、经营企业，做项目不要怕犯错，比如，你跟着我们学做直播，必须日日直播，日日搞 36 循环系统，不要怕别人嘲笑你，大胆讲出来。差异化营销、品牌化，让别人记住你。你自已本来就要找与众不同、非同凡响的东西，别人才能记住你，这个过程，有人嘲笑你就对了，就怕没人嘲笑你。


    我们都是在别人的讽刺、嘲笑、谩骂、污蔑中成长的。慢慢的，就有人尊重我们了。我们的尊严，是靠我们的业绩来实现的，不怕犯错的人，才会有业绩。怕犯错的人，就跟鸵鸟一样，只会把头埋在沙子里躲避危险。


    四、聚焦到极致，只做一个业务，一个点。我们的业务，就是卖陈昌文读书会、陈昌文老板社群，其他的不干。永远不开辟第二战场，其他地方无论多赚钱，我们都不去。我们学习任正非，只在通信领域干活。我们也只在老板读书会、老板社'
  - '[PAGE 6]


    群这个领域干活。我们不断的培训互联网讲师，主要就是讲儒家思想+陈昌文方法。传统企业想转型互联网，想学网络营销，想做讲师，找我们学习就对了。


    五、跟高手合作。你自己开辟一套理论、一个社群、一套方法论、组织一个团队，无论是网络，还是线下，都会非常难。你最智慧的选择，就是跟着高手合作。我们也算中国有一定影响力的社群，你们可以找我们合作，这是最智慧的路子。跟高手合作，高手的资源都是你的，是相互加持的一个过程。成功是站在巨人的肩膀上，而不是自己成长成巨人。


    六、只做成本极低的项目。商业的成功，不过是比谁的成本低，利润高而已。为什么我们做读书会、老板社群，培训讲师，因为这是贩卖智力，且是你需要的智力。我们社群都准备好了，我们会每个月出一本新书，以智慧+财富+婚恋为核心，你跟着学，跟着讲，跟着读就行了。我们希望大家用这种方式创业，是对你的老婆本的保护。你随便搞其他小生意，亏损，可能都是几十万、几百万。


    七、从一而终，坚持到底。一干就是一辈子。老虎伍兹、乔丹，几乎所有最成功的人，都具备这个品质，不断的在一个点上深挖，在一个行业深入。我们做读书会、老板社群，做讲师，就是一辈子，'
  - '[PAGE 7]


    绝对不换新。有低谷，也会有高潮，一直坚持，就会越来越好。我们见过很多人，习惯性三心二意，这些人，不会有什么前途。只有从一而终的人，才会有前途。


    八、正心术，跟着我们日日学习儒家思想，日日修德，德行好了，财富自然来了。很多人不懂这个道理，比如，你天天讲儒家思想，你自然会发达，因为，以后帮你的人会非常多。这个道理，大家要是明白，在社会上做营销、赚钱，都是水到渠成的。你帮的人多了，社会就会回馈你，只是早晚的问题。为什么你不能赚钱？你帮的人太少了，不是不赚钱，而是积累太少，德行太薄。


    九、人心就是天道。满足人心，靠良心结交人，帮人助，这是我们社群的宗旨。你如果完全认可我们社群的理念，想跟我们一辈子学习社群营销、做讲师，就可以跟着我们一起把儒家思想、陈昌文方法传播给十亿人，希望富人、老板、企业家、牛人加入。


    陈昌文

    2020.10.1'
