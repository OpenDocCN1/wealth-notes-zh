    ## 6、品牌定位必须唯一，且是终生卖点


    做企业、做社群，是做简单的事情，绝不做复杂的事情。大多数人正好相反，他们喜欢做复杂、难懂的事情，他们觉得这样才有成就感，他们觉得这样才有价值，把自己搞得昏天暗地的，结果也不好。殊不知，大家忘了一件事，就是商人的本质、买卖的本质，那就是盈利，赚取利润。在利润的前提下，去解决问题。问题，不是终极目标，利润，才是终极目标。做少、做精、做透、做减法、做聚焦、做唯一性、简单化，都是为了在顾客心里形成唯一标识的差异化品牌。如此方法，不累且有成绩，何乐而不为呢！


    简单、专一、唯一，这种思维模式将让你的行为模式异常简单。当你的行为模式、思维模式都异常简单的时候，你就不会累。当你不累的时候，你的工作效率就会非常高。事情多了，自然杂乱无章、顾此失彼。很多人一上来，什么环节都要做，什么环节的钱都想赚，所有环节都蜻蜓点水，没有一个环节做透彻了，然后又埋怨“我什么都做了，怎么还不赚钱？”岂不知，这就是你不赚钱的原因所在：就是你什么都做了！


    多，不一定“得”，反而会失去更多，就是把老本也赔进去了，自己的时间和精力也搭进去了。你只能选择一个环节中最重要的部分，其它的一律外包或合作。如此，则乾坤朗朗，才能打造出能够攻克客户心智模式的品牌。


    做事，是做更少、极少、唯一的一件事，当你找到这件事，你就容易了。生活与工作，都容易了。简单、唯一、聚焦，可以解决你们的一切问题，可以解决品牌的一切问题。


    只做高端人士、企业家、美女老板社群，不要搞低端势能，低端势能对咱们的品牌没什么好处。我们社群的唯一性，就是我会在群里发言、在读书会讲公开课、在老板社群讲内部课，以及我的书籍体系。所有人，全部卖唯一性，不要乱卖。


    卖点必须唯一。人只应该有一个卖点，我们是卖陈昌文读书会、老板社群的，卖做讲师的，卖传统企业转型的，卖互联网营销的，卖美女老板圈子的，卖儒家思想的，卖陈昌文方法72大营销系统的，卖教你如何谈恋爱的，我们的卖点太多了。这是供你们选择的，而一旦你选择好了，从此过后，你就只有一个卖点了。这个卖点，就是唯一的。但所有的卖点，都统一归到“陈昌文方法”这个品牌上。万变不离其宗，三句话不离本行，这是大家变现的神器。


    人一旦确定了一个卖点，所有的视频、直播、文案、朋友圈，都只讲这个卖点了。当锁定一个卖点过后，人生就是枯燥的了。一切为了这个枯燥的目标服务，不再有其他任何目标。人总是喜欢讲些乱七八糟的东西，总是喜欢讲些哎呀，我啥都懂。当你啥都懂的时候，你的粉丝就迷茫了。你将不具备传播性，大家容易遗忘你，你做的粉丝就毫无意义。所以，你必须有唯一性卖点，而且，你讲的一切，都是为了这个卖点。你话语里重复最多的也是这个卖点，其他卖点最多变成你课程的辅助、杠杆，但他们不是落脚点。


    一旦确定了一个终生卖点，就是一辈子，记住，我希望大家只搞终生卖点。我们社群里有很多终生卖点，当你确定了过后，无论你觉得多么恶心，多么想换，多么喜新厌旧，多么痛苦，你都不应该再换卖点。任何一个终生卖点，都能发财，只是有点恶心。没错，一个卖点坚持一段时间，我们都会觉得恶心，没得讲了，想换，喜新厌旧是灵长类动物的特征。人就是个猴子，坐立不安，在这个意义上，任何人都是渣男渣女，所以才能显得从一而终是多么的难能可贵。


    社会上为什么这么多穷人？就是他们从来不理解要盯着一个卖点从一而终，做到极致，做到精益求精，做到世界第一。理解不了这个事情，一辈子到处张望，到处混，结果时间过去了，什么也没混到。


    我们是做圈子的，读书会圈子、老板社群圈子，如果你领定了“圈子”这个词，从此你就是一辈子做圈子了。犹如，做辣椒酱的，一辈子做辣椒酱，就是老干妈。做辣条的，一直做辣条，就是卫龙辣条。你得一直做一个点，一直锁定一个点，我们做企业家、美女老板圈子，我们就只做这件事，其他的都放弃。不要想着一条龙服务，不要想着什么都要吃掉，让别人也吃一点。


    成功是需要放弃很多的，失败的人力求抓住很多环节，结果什么也没有。成功是放弃的艺术，而贫穷，是贪婪的性格。你想想，你抓了多少？你就知道你有多穷了。只有专注一个卖点，重复下去，你才能成功。


    ## 7、品牌定位的四个唯一


    赚钱就是抓住唯一性原则，卖、卖、卖，不断的搞单子，搞流量，爆破流量，完事。


    如何唯一？首先是品牌的产品定位唯一。


    我们唯一的产品，就是卖智慧圈子，卖陈昌文读书会和老板社群，我们是卖这个的，你要告诉所有铁粉。当我们卖这个产品的时候，我们只能说一个，比如，我们是做高端老板圈子的、美女老板圈子的，都行。但是你必须表述一个产品的唯一性，要是理解不了这个，你的一切工作都将变得非常难。记住，一旦定位了产品，一辈子都别换了。


    第二个唯一性是什么？是品牌的盈利方式唯一，这就是利出一孔。


    你不要整几个盈利方式，我们有些人觉得自己聪明，搞几个盈利方式，结果是什么钱都赚不到。没有唯一性，会让你心思缥缈，定不下心来把事情做好。不要搞几个盈利点，盈利点多了，你的小心思变多了，你就做不好任何一个盈利点。经济学的爸爸是心理学，赚钱的本质是修心而已。修个专一、唯一的道场，钱就来了。贪欲者必然贫穷。


    第三个唯一性是什么？就是品牌的营销渠道、流量渠道。


    我们选择了做抖音，我们永远都在抖音里面捞流量，除非它不存在了，我们又选择下一个流量渠道。只在一个流量渠道里做视频、直播。社会上到处都有钱赚，每个平台都有钱赚，但你不能都去做，这样会累死你。你只能盯着一个流量渠道，把一个流量渠道做透彻，所以，我们社群就是玩抖音矩阵的，在抖音矩阵里不断的发展就行了。所以，一旦你进入我们社群，你心思定下来，搞抖音就完事了。现阶段就是这么回事。


    第四个唯一性，品牌运作只有一种模式。


    我们只有一种模式，就是讲师的模式。我们的一切销售，都是通过讲师在抖音里完成的，所以我们不断的培养更多的优秀讲师，去讲课。我们只发展一种模式，就是讲师讲课，直播、视频赚钱模式。


    人不要想法多，人的想法越单纯、越唯一越好。我们就是传播儒家思想、陈昌文方法论给十亿人的社群组织，干这个就行了。为什么很多人迷茫、心思不定？主要是他们不知道唯一性的重要性，唯一的产品、流量渠道、模式、盈利方式干起来。他们总是在怀疑行不行啊等等莫名其妙的事情，导致自己停步不前。


    ## 8、真正的品牌营销，必须找到唯一的故事、唯一的行为、唯一的事实


    我们要彻底的聚焦到陈昌文读书会的售卖，这个利润高，而且好卖。我们的所有事情，都是为了支撑我们的读书会，以及陈昌文老板社群的售卖。我们只做这件事，其他事情全部外包，全部做减法，所有人都在追求唯一的动作，这样，我们的直播、视频做到极致，书籍讲到极致，我们彻底有价值，通过抖音扩散，以后通过微信短视频扩散，更多的人扩散。我们的流量更大，我们的变现就会更多。


    我们只深挖陈昌文老板社群、陈昌文读书会、我们的内部教程，本质上，这些事情是一件事。要完全集中精力做这个，而且一辈子不变。锁定这个项目，带更多的人做，鼓励所有粉丝做，就是卖读书会。不要找机会，也不要起新项目，所有的事情，都是为陈昌文读书会、内部教程，以及陈昌文老板社群服务、售卖的。做好唯一一件事，做透彻唯一一件事，不断的做减法，做聚焦，在一个环节、一个点上吃饭，其他的外包。


