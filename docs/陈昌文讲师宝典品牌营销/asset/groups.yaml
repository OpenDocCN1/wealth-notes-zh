    如果你不知道你的精准客户是哪个群体，则你很难打造自己的营销系统、个人品牌。


    打造个人品牌的第一招就是精准定位，很多人一辈子没出息，就是定位太多、太乱、太复杂，找不到自己的卖点。一个人要是找到了自己的卖点，什么都好办了。天天卖这个，而且卖一辈子。所以打造个人品牌的第一招，就是定位，你必须定位你这一辈子要干啥，用哪个卖点过生活。能与自己的兴趣结合是最好的，这样，你能长久的干下去。兴趣驱动是持久经营的核心，只为了经济利益，可能没利益了，你就不干了，而有兴趣，你就会一直干。找对了卖点，然后就针对这个卖点、这个行业塑造自己的个人品牌。最终成为这个行业、这个卖点的意见领袖，则主动找你的人以及资源就会很多，你就非常容易做成交了。


    ## 11、个人品牌涵盖的范围越小，越有价值


    个人品牌会非常值钱，但一个人只能打造一个个人品牌，不能打造多个个人品牌，一个人有多个个人品牌，那么他的品牌就不值钱了。如果个人品牌的标签多了，你将会没有品牌，打造不起来自己的品牌。一个人只有一个个人品牌，那么，这个人就会非常值钱，打造个人品牌切记贪心，只做一个垂直细分领域的龙头老大，你的机会就会自动找上门，到处都会有人主动找你买单。


    想要打造自己个人品牌的影响力，最好有一个爆款，也就是你在某个点上，超越了所有人，所有人都认为你在这方面是权威，或者第一，这就是你的江湖地位。人要的其实不是全面发展，而是专精一点，且把这一点做到极致，超越所有人，你就有了影响力，就有了江湖地位。


    打造个人品牌，开始了就不能结束，也就是你选好了一个方向，你就只能发表这个方向专业性的东西，否则，你会把自己弄的糊里糊涂的，也会把客户弄的糊里糊涂的。大家不知道你是干什么的，你就没有商业价值了。


    想要打造个人品牌，你必须成为一个领域的专家，你在这个领域的这个点上说一不二，具有权威性，这是你个人品牌构建的重要一环，然后你还要天天宣传你在这个领域的权威性。你宣传久了，知道你的粉丝越多，这个领域被你卡位过后，其他人就进不来了，直到整个领域与你的个人品牌划等号，你就会取得巨大的成功。


    建立个人品牌的重要元素，就是你是不是某一方面的专家。当你做到垂直细分化第一名的时候，你就会获得巨大的财富、巨大的市场份额，而且会有很多人慕名而来。个人品牌的形成在于不断的重复，坚持在一个领域深耕，最终做成为这个领域的垂直细分第一名，如此，这个领域的所有资源都会向这个第一名靠近。这个第一名就会获得巨大的成功。成为垂直细分化第一名，是建立品牌的关键。


    打造个人品牌，一定要对准受众，你要不断的呼唤你的受众的名字，不断的为你的受众输出文案、视频、直播。个人品牌是针对少数买单客户的，而不是针对多数人的。个人品牌涵盖的范围越小，越有价值，涵盖的范围越大，越难实现商业变现。只做最简单的事情，才能形成品牌。


    打造个人品牌的时候，要考虑你的受众的购买力，如果你的受众粉丝没有购买力，你这个个人品牌就毫无价值，所以，锁定高端客户，是聪明人的做法。要做高价格营销，要做高端客户。高价格、高端客户，才容易形成良好的口碑，形成良好的个人品牌。低端市场，很难形成良好的口碑，就很难有好的个人品牌，这是一个现实问题，不要情绪化。


    要卖高价，只有高价能树立个人品牌，能接触到好的客户。要培养人付高价。人的精力是有限的，应该接触一些高端客户。客户并不怕贵，怕贵的客户我们也懒得搭理，客户怕的是买的不对。只要对，只要爽，客户愿意付高价。个人品牌的作用，就是卖高价，而不是卖低价。低价就不是个人品牌。打造个人品牌为的就是溢价。


    ## 12、打造个人品牌，要有一个品牌文化


    打造个人品牌，要有一个品牌文化，比如我就喜欢讲儒家思想，这就是我们陈昌文读书会和老板社群的品牌文化。有品牌文化的个人品牌会显得非常高大上，也会给你的服务与产品带来溢价。想要搞好自己的个人品牌，一定要宣传一种文化，而我就是宣传儒家思想。有了文化，然后结合自己的业务，就可以打造强有力的个人品牌。我的个人品牌文化是儒家思想，个人品牌项目是陈昌文读书会和老板社群。想要自己的个人品牌传达多远，就让自己宣传的文化传达多远。


    想要做好自己的个人品牌，一定要找到一个历史原型，人类生活中的原型，比如，当代子贡、当代张良、当代诗仙。这样，有了历史文化原型，能让人更容易记住，也更容易传播，且容易商业化，个人品牌附加上历史文化原型会让你的个人品牌如虎添翼。


    # 第六章


    # 教你如何打造个人品牌


    想要打造好自己的个人品牌，要借助巨人的智慧、势能，以及名气，这是最快速的路径，让巨人加持自己。


    打造个人品牌的时候，你一定要不断的说你的个人品牌历史原型的好话，这样，你就壮大了你的历史原型，这样，你的个人品牌也会跟着壮大。你能借到的势能就越大，这是一个双赢的工作。个人品牌一定要有历史原型，因为历史原型本身就有好多粉丝，你的个人品牌跟历史原型对接过后，大家就会迅速认识你，这也是为什么我要宣传儒家思想的原因，因为这个世界上喜欢儒家思想的人很多。我宣传儒家思想，就会蹭到儒家思想的热度，而且这个群体是高质量群体。


    想要打造个人品牌，就要打造很多小细节仪式感，比如你每天早上都带大家学习一点东西，日日必做，这就是仪式感小细节。比如，每天早上带大家读《论语》。比如，你每天都写一篇文章给大家普及一种营销知识，这也是仪式感小细节。你以什么形式讲课，你对客户重视吗？怎么重视的，具体点？这些就是细节仪式感。只有拥有细节仪式感的人，才可能打造出好的个人品牌。打造仪式感是打造个人品牌的核心逻辑，你要让别人记住你，你就要有所不同。仪式感会让人会让人觉得受到了尊重。


    ## 13、个人品牌营销最核心的是你的名字


    个人品牌营销最核心的是你的名字，以及你的服务、产品的名字，一个好记忆的名字，会极大的降低你的个人品牌的营销传播成本。品牌建立的最有效模式是，不断的在客户的脑袋里重复你的品牌名字、品牌故事、品牌形象。


    比如我的个人品牌就是陈昌文，我的服务就是陈昌文读书会和老板社群。我们讲话、演讲、讲故事，最好都要带上陈昌文读书会和老板社群以及陈昌文的名字。这就是最厉害的个人品牌营销模式。


    个人品牌要的是大道至简，也就是别人一看你的名字，就知道你是干啥的，比如陈昌文读书会、陈昌文老板社群，一看，就是读书的，做老板圈子的。如果你的个人品牌名字复杂，则所有人看起来都迷茫，不知道你是干啥的，你这个个人品牌就没有商业价值了。


    想要打造个人品牌，你必须让别人对你的记忆成本降低。


    个人品牌只能用大家熟悉的词语构建，不能用生僻词，否则，大家不知道你表达的是什么意思。名字不能绕口，形象不能是大家没见过的。要大家经常见过，而且经常在他身边出现的东西，这个东西才有熟悉感，个人品牌的记忆成本才会低。


    个人品牌是用来跟消费者沟通的，也就是消费者看了你的个人品牌名字，就知道你是干啥的，他记住了，以后有需要就会来找你。个人品牌跟产品的关系其实不大，当你建立了个人品牌过后，你卖的产品，消费者就买单，你说了就算，你在消费者心中，就成了这方面的权威。


    当今社会，全民经商，你要是不能做到清晰的告诉客户你是干啥的，则你很难有传播，很难有市场。建立个人品牌要求你只用几个字，用非常简短的语言告诉客户，你是干啥的。如果不能用几个字概括清楚你是干啥的，则你做不起来你的个人品牌。


    ## 14、想要打造个人品牌，你要有鲜明的个性


    差异化是形成品牌的核心。没有差异化，就没有品牌。


    想要打造个人品牌，你要有鲜明的个性。你的个性越是与众不同，你的个人品牌就越能传播，越有效益，越有名声。人们不喜欢普通的东西，人们就喜欢区别于大众的东西。做品牌，一定要简单。


    要想打造自己的个人品牌，就要打造自己的符号系统，比如，你的手势特别，你的声音特别。为什么你是品牌，你必须要通过肢体动作，或者语言动作，或者形象体现出来，区别于别人，并且坚持下去，然后，慢慢你就会在人们心中留下一个印象，个人品牌就慢慢形成了。要有差异化，要独特。首先，你的名字、服装、言行举止，是不是能跟大多数人区别出来？如果你跟大家都一样，大家凭什么关注你？凭什么觉得你特别？所以，在不违反道德的情况下，想要打造自己的个人品牌，首先要注重自己的名字、自己的服装搭配、自己的言行举止，是不是区别于大众。


    打造个人品牌，必须有识别力。什么是识别力？就是别人一看到你的东西、你的形象，就觉得你与众不同。这就是为什么很多名人，总是有一点点特色，要么是服装，要么是言辞，要么是头型，总是与众不同，总有识别力。有识别力，才会有个人品牌形象。你必须找到一个点、一个名字、一个包装、一个形象，甚至一套话语体系，不断的重复，重复，再重复。


    要打造个人品牌，你必须有个人形象展现给社会。而且，你必须固定你的个人形象，如果你经常变，你的个人品牌就不会打造起来。如果你不知道干啥，你就去包装你的产品，包装你的个人形象，这样你的个人品牌溢价就会变得更高。拥有一个优秀的形象，是打造个人品牌营销的第一环，你展现的形象必须比普通人优秀。


    一个点定型了，就不能变，十年、二十年不变，变来变去的，就没有品牌。想要搞好个人品牌，就是要重复，重复，重复，还是重复，重复，重复。如此模式，能让人形成条件反射，记住你。重复，重复，重复，一次一次的重复你的名字、你的个人品牌，就会形成记忆，能领略在一个卖点上不断重复的人，就能打造自己的个人品牌。也就是想要做好自己的个人品牌，就是要重复自己的形象，而且长久的坚持下去，最终，就会收获复利效应。


    ## 15、在社交媒体上传播自己的世界观，就是打造个人品牌的过程


    在社交媒体上传播自己的世界观，就是打造个人品牌的过程。所以，没事，你就去写点文章，搞点视频或直播，传播传播你对世界的看法。你的三观有多牛，你的见识有多广，你的智慧有多高，你的世界就有多美好。而分享这些强大的、有价值的东西，就会形成你的个人品牌。


    个人品牌营销，实际上是一种软性营销，也就是你日日不断的打造自己的个人品牌，为市场提供价值。粉丝天天盯着，时间长了，他们要消费这方面的服务或者产品，自然就找你了。软性营销是当今营销的趋势。


    为什么个人品牌营销厉害？因为你每天在社交媒体上发表的文章、视频、直播，就是在跟潜在客户进行商务沟通，沟通好了，客户自然就找你买单了。所以，打造个人品牌的过程，就是时时刻刻跟客户进行商务沟通的过程。


    打造个人品牌，就是打造一套独有的语言系统。人与人之间，是通过不同的语言系统来区分的，讲什么话，就是什么人，就会成就什么样的个人品牌。所以，如果你想打造自己的个人品牌，你就要研究一下，你以后讲什么样的话，什么话不是你应该讲的，乱讲话的人没办法打造自己的个人品牌。


    要有一套自己的话语体系，这套话语体系，要让别人一看见，就知道是你说的，就会想起你。很多大佬、企业家，都用了这个技巧。语不惊人死不休，看到你的话，听到你的话，就能想起你，那么，你的个人品牌就能随着这些话语、语言体系不断的传播。传播的本质，就是让别人帮你传，传得越广，你的个人品牌就越强大。


    想要打造自己的个人品牌，可以建立一句传播口号。你的个人品牌最好能创作一句口号，这个口号要极其简单，朗朗上口。所有的品牌都会有这样一句口号。很多厉害的人会打造自己的传播口号，各种各样的传播口号，比如，我交朋友不省钱，反正都没我有钱。我不喜欢钱，我这个人从来不把钱当回事。这些人，都是打造传播口号的高手，他们把自己传播出去了。


    你必须提出一个非常明确、重要的观点，然后不断的强化它，让市场都知道，这个有价值的观点是你提出来的。这是打造个人品牌重要的一环。每一个名人，都知道用这个技巧。书面正确与传播是两码事，名声就是利益，一个企业家、董事长都明白这个道理。在哲学领域，光环就是权力。


    搞个人品牌营销，实际上是搞个人价值观营销，要让别人接受你的价值观，最好可以打造一些专业的术语，也就是只有你以及你的粉丝能明白的词汇、语言系统。这样，你的粉丝就隶属于你们这个价值观语言系统，你的个人品牌就会更有根基。一个人的个人品牌是由其语言境界决定的，这个人讲什么样的话，基本就是什么样的人，就在打造什么样的个人品牌，所以，你说的每一句话，都在塑造你的价值。


    鲜明的价值观，是打造个人品牌的利剑，越鲜明越好，最怕模棱两可的人，这种人没人相信。鲜明的价值观，有人爱，有人恨，这就对了。打造个人品牌要直白，是什么就说什么。你是卖什么的？你的准客户是谁？如实描述，不要弄的模棱两可的，越直白，个人品牌越有效。


    在打造个人品牌的过程中，你永远要积极向上、乐观豁达。你要通过文章、视频、直播，不断的表现这几点，所有明星都懂这个。无论是卖服务，还是卖产品的，这个积极乐观、向上豁达，都会给你带来好口碑与销量。


    想要打造个人品牌，其实你也不用懂啥，直接开始干，搞文字、视频、音频、图片，先发起来，边发边学，慢慢就进入状态了，就怕你只看不干。干着，干着，商业价值就出来了。


    ## 16、打造个人品牌没有捷径，你要一直在这个领域输出价值，最终才能形成商业化


    如何打造自己的个人品牌？有自己的个人网站、个人社交媒体，不断的展示着自己专业的观点，有自己的私域流量池，也有自己的公域流量池。想要打造个人品牌，你要积极主动的在社交媒体上释放价值，而且要帮助你的粉丝，解决真实的问题。并把这些经验分享出来，有助于更多人，而不是立刻要求回报，也不是只会卖东西。


    想要有一个好的个人品牌，你要极度聚焦，一直在这个领域输出价值，最终才能形成商业化。打造个人品牌最重要的是要持续分享一个方向的内容、知识、价值。必须有计划的日日分享你的知识、见解，这个东西，必须对行业里的人有帮助，对铁粉有帮助，也就是你必须通过社交媒体，让自己成为行业的意见领袖。


    打造一个好的个人品牌需要日日推广，你每天都必须不断的传播你的个人品牌，通过文字、文章，以及视频、直播，不断的传播。你不传播你的个人品牌，你的个人品牌将毫无价值。每一个打造个人品牌的人，都是一个传播者。每天输出一点文字，如果你有功夫，每天搞个视频。如果你再有功夫，每天就搞个直播。注意“每天”两个字，你必须得每天搞，哪天不搞了，你的个人品牌就慢慢消失了。


    要有真正的奉献精神，不断的奉献好的行业知识给社会，在社交媒体上不断的发布，这是打造个人品牌需要的精神。要坚持，一开始选好了就是一辈子。打造个人品牌的最快方式，就是不断的搞系列写作＋系列演讲。选择一个领域，一个自己喜欢的、有商业价值的领域，不断的讲这个领域的知识，形成一个一个的系统，首尾相连，每天一篇，或者一个视频，这是最快的打造个人品牌的方式，则商业机会也随之而来。


