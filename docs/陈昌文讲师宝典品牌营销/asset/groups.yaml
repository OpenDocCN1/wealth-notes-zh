    ### 1、以前的企业是卖产品，现在的企业，首先是卖个人品牌，卖人设


    为什么要在网络平台上打造个人品牌？因为这样可以让你的影响力放大到普通人的几倍、几十倍、几百倍，甚至几万倍。普通人最多能影响、营销数百人，而一个注重打造网络个人品牌形象的人，则很有可能影响、营销几万人，甚至几十万人、几百万人。


    随着人们消费水平的提高，人们越来越喜欢有品牌的人与物。人们对品牌也会越来越挑剔，谁早日打造个人品牌，谁就更早获益。拥有个人品牌的人会比普通人拥有更多的社会机会。无论是社交，还是售卖商品、服务，市场更喜欢那些有个人品牌的人。


    人们买东西，首先是看这个东西的品牌。品牌好的，就买；品牌不好的，不买。连不识字的人，也知道买东西要买品牌的。只要这个人的消费能力允许，他们就希望跟品牌打交道。同样，每个人也希望跟有个人品牌的人接触，这样，他们会感到自豪、舒心。也就是说，个人品牌是你的社交名片，你可以更容易、更精准的交往到对应的朋友、人脉，获得对应的机会。如果你有服务、产品，就可以卖给这些人。


    有个人品牌与没个人品牌差距非常大，人们喜欢跟有个人品牌的人交往、交朋友，也能记住这个人，故而会向这个人买单。人们社交，或购买一个人的服务，都在看这个人的个人品牌。人们喜欢、认可有品牌的人，个人品牌是取信于大众的必要条件。一个没有品牌的人，犹如没有品牌的地摊货，很难有高质量的买家买单。


    如果你在行业内建立了自己的个人品牌，则其他没有建立自己个人品牌的人的客户就会来找你买单。人们总是喜欢找有个人品牌的人买单，这是一种不可抗拒的惯性，犹如你们总是想找专家一样。


    打造个人品牌，是新媒体时代的蓝海战略。只有走在前沿的网红、企业家开始在有意识的打造自己的个人品牌，以后，会有更多的企业老板出来通过各种新媒体平台打造自己的个人品牌，否则，将落伍。社交媒体时代，个人必须媒体化，而想要在社交媒体上出类拔萃，你就必须得有个人品牌。以前的企业是卖产品，现在的企业，首先是卖个人品牌，卖人设。有了这个，才能有流量，然后自动营销产品。如果没有这个思维，在当今时代，你做生意就很难。任何一个高级营销专家，都是打造个人品牌的大师。因为建立了个人品牌过后，你的产品、服务，会自动进行销售，粉丝会抢着买单。


    无论你从事什么行业，你都需要在行业里建立你的个人品牌。这样，你就能区别于其他那些没有个人品牌的人。打造自己的个人品牌是你区分于芸芸大众的好方法。每个人都是一个产品、一个品牌，不管你承认不承认，你都在营销自己，卖自己。既然这样，还不如专心致志的塑造好自己的个人品牌，让自己在卖服务、卖产品、卖自己的过程中，获利更大。打造个人品牌对当事人是有巨大利益的。


    ### 2、个人品牌营销的本质是，你能为客户提供更专业的服务


    为什么要打造个人品牌？因为这会让你看起来更专业，而更专业，你就可以获取更高的利润，可以增加你的影响力。高手都明白，影响力会带来更多的财富。只有专业的人才有机会获得影响力、财富与信任度。


    个人品牌营销的本质是，你能为客户提供更专业的服务，也就是你是这个行业的第一名，你是服务高手。一个行业一般只能打造为数不多的几个个人品牌。聪明的老板会想方设法的抢占行业内的个人品牌，通常来说，人们在一个行业内能记住的老板的个人品牌也就3到5个，多了就记住了。无论你是做服务的，还是做产品的，你都要想办法让自己的个人品牌在你那个行业里变成第一名。如此，你的服务与产品就好卖了。


