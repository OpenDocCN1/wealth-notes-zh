    人一旦确定了一个卖点，所有的视频、直播、文案、朋友圈，都只讲这个卖点了。当锁定一个卖点过后，人生就是枯燥的了。一切为了这个枯燥的目标服务，不再有其他任何目标。人总是喜欢讲些乱七八糟的东西，总是喜欢讲些哎呀，我啥都懂。当你啥都懂的时候，你的粉丝就迷茫了。你将不具备传播性，大家容易遗忘你，你做的粉丝就毫无意义。所以，你必须有唯一性卖点，而且，你讲的一切，都是为了这个卖点。你话语里重复最多的也是这个卖点，其他卖点最多变成你课程的辅助、杠杆，但他们不是落脚点。


    一旦确定了一个终生卖点，就是一辈子，记住，我希望大家只搞终生卖点。我们社群里有很多终生卖点，当你确定了过后，无论你觉得多么恶心，多么想换，多么喜新厌旧，多么痛苦，你都不应该再换卖点。任何一个终生卖点，都能发财，只是有点恶心。没错，一个卖点坚持一段时间，我们都会觉得恶心，没得讲了，想换，喜新厌旧是灵长类动物的特征。人就是个猴子，坐立不安，在这个意义上，任何人都是渣男渣女，所以才能显得从一而终是多么的难能可贵。


    社会上为什么这么多穷人？就是他们从来不理解要盯着一个卖点从一而终，做到极致，做到精益求精，做到世界第一。理解不了这个事情，一辈子到处张望，到处混，结果时间过去了，什么也没混到。


    我们是做圈子的，读书会圈子、老板社群圈子，如果你领定了“圈子”这个词，从此你就是一辈子做圈子了。犹如，做辣椒酱的，一辈子做辣椒酱，就是老干妈。做辣条的，一直做辣条，就是卫龙辣条。你得一直做一个点，一直锁定一个点，我们做企业家、美女老板圈子，我们就只做这件事，其他的都放弃。不要想着一条龙服务，不要想着什么都要吃掉，让别人也吃一点。


    成功是需要放弃很多的，失败的人力求抓住很多环节，结果什么也没有。成功是放弃的艺术，而贫穷，是贪婪的性格。你想想，你抓了多少？你就知道你有多穷了。只有专注一个卖点，重复下去，你才能成功。


    ## 7、品牌定位的四个唯一


    赚钱就是抓住唯一性原则，卖、卖、卖，不断的搞单子，搞流量，爆破流量，完事。


    如何唯一？首先是品牌的产品定位唯一。


    我们唯一的产品，就是卖智慧圈子，卖陈昌文读书会和老板社群，我们是卖这个的，你要告诉所有铁粉。当我们卖这个产品的时候，我们只能说一个，比如，我们是做高端老板圈子的、美女老板圈子的，都行。但是你必须表述一个产品的唯一性，要是理解不了这个，你的一切工作都将变得非常难。记住，一旦定位了产品，一辈子都别换了。


    第二个唯一性是什么？是品牌的盈利方式唯一，这就是利出一孔。


    你不要整几个盈利方式，我们有些人觉得自己聪明，搞几个盈利方式，结果是什么钱都赚不到。没有唯一性，会让你心思缥缈，定不下心来把事情做好。不要搞几个盈利点，盈利点多了，你的小心思变多了，你就做不好任何一个盈利点。经济学的爸爸是心理学，赚钱的本质是修心而已。修个专一、唯一的道场，钱就来了。贪欲者必然贫穷。


    第三个唯一性是什么？就是品牌的营销渠道、流量渠道。


    我们选择了做抖音，我们永远都在抖音里面捞流量，除非它不存在了，我们又选择下一个流量渠道。只在一个流量渠道里做视频、直播。社会上到处都有钱赚，每个平台都有钱赚，但你不能都去做，这样会累死你。你只能盯着一个流量渠道，把一个流量渠道做透彻，所以，我们社群就是玩抖音矩阵的，在抖音矩阵里不断的发展就行了。所以，一旦你进入我们社群，你心思定下来，搞抖音就完事了。现阶段就是这么回事。


    第四个唯一性，品牌运作只有一种模式。


    我们只有一种模式，就是讲师的模式。我们的一切销售，都是通过讲师在抖音里完成的，所以我们不断的培养更多的优秀讲师，去讲课。我们只发展一种模式，就是讲师讲课，直播、视频赚钱模式。


    人不要想法多，人的想法越单纯、越唯一越好。我们就是传播儒家思想、陈昌文方法论给十亿人的社群组织，干这个就行了。为什么很多人迷茫、心思不定？主要是他们不知道唯一性的重要性，唯一的产品、流量渠道、模式、盈利方式干起来。他们总是在怀疑行不行啊等等莫名其妙的事情，导致自己停步不前。


    ## 8、真正的品牌营销，必须找到唯一的故事、唯一的行为、唯一的事实


    我们要彻底的聚焦到陈昌文读书会的售卖，这个利润高，而且好卖。我们的所有事情，都是为了支撑我们的读书会，以及陈昌文老板社群的售卖。我们只做这件事，其他事情全部外包，全部做减法，所有人都在追求唯一的动作，这样，我们的直播、视频做到极致，书籍讲到极致，我们彻底有价值，通过抖音扩散，以后通过微信短视频扩散，更多的人扩散。我们的流量更大，我们的变现就会更多。


    我们只深挖陈昌文老板社群、陈昌文读书会、我们的内部教程，本质上，这些事情是一件事。要完全集中精力做这个，而且一辈子不变。锁定这个项目，带更多的人做，鼓励所有粉丝做，就是卖读书会。不要找机会，也不要起新项目，所有的事情，都是为陈昌文读书会、内部教程，以及陈昌文老板社群服务、售卖的。做好唯一一件事，做透彻唯一一件事，不断的做减法，做聚焦，在一个环节、一个点上吃饭，其他的外包。


    彻底弄好读书会，卖好陈昌文老板社群，教程覆盖所有人，传播给十亿人。儒家思想、陈昌文方法的体现，传播给十亿人，我们就安身立命了。永远不要贪多，要做的极少，而且不变动。


    所有环节，都是为了卖品牌而服务的。


    我们追求的是唯一，是聚焦，是减法，是单点爆破，是对着陈昌文读书会发起冲锋。我们追求的是打造品牌资产，品牌资产不断的变现，而且我们只有一个品牌，陈昌文读书会、陈昌文老板社群、内部教程。


    - 1、我们的书籍，是原创的，是唯一的。

    - 2、我们陈昌文老板社群是我们唯一几大讲师在里面，以及陈昌文本人在里面发言，甚至解答问题的社群。

    - 3、我们经营6年社群了，是唯一365天日日讲课，日日不断的，目的是做成企业家、美女老板学习、交流圈子的终点站。

    - 4、日日讲儒家思想，讲陈昌文方法的社群，日日学习营销，学习做人做事的道理的社群。

    - 5、社群整体活跃度非常高，课程参与度高，几千个老板跟着学习、交流。


    现在社群的根基，就是书籍营销系统、读书会，全部是我们的原创内容。我们只宣传我们的原创内容，这是版权问题，避免任何人说我们盗版。


    社群里有多少人，具体人数，这是唯一的；社群里的YY直播间，有多少人听课，截图出去，这是唯一的；社群里的发言，天天截图传播，这是唯一的。社群里的老师发言、陈昌文先生的发言，说了什么，这是唯一的。


    真正的品牌营销，必须找到唯一的故事、唯一的行为、唯一的事实。一切只连接唯一性，除了这个地方，其它地方没有，然后体现这个地方的价值，这就好销售了，客户不得不买单，因为没有替代品，也没有价格可以比较了。


    这就是与众不同，一定要建立社群的品牌优势，以及矩阵优势、影响力优势。我的微博就是大家的品牌优势，以及影响力优势。各位抖音上的大号，都是我们社群的品牌、影响力优势。


    社群内部成员，直接复制我们的唯一性，营销读书会＋陈昌文老板社群，搞流量、变现就行了。利用社群的影响力、品牌优势，不断的变现，每个人能赚钱、出单，才是大事。赚钱，养家糊口，才是大事，其它皆小事。莫要得虚名而不赚钱啊。曹操说：“莫要务虚名而处实祸。”意思就是人要实在。我的意思，就是大家每天要多出单、变现。


    卖点唯一，帮助企业家、美女女老板提升儒家思想智慧、营销智慧、恋爱智慧，没了。唯一的卖点，才容易让客户记住，才能变现，否则不会变现的。大家一定要按照规律、套路来，换了，单子就少。


    **讲师必须宣传我们社群不可复制的优势，宣传唯一性，这叫做竞争壁垒。** 不会利用不可复制、唯一性、竞争壁垒的人，只会无能狂怒，没什么意义。竞争壁垒、唯一性，才是我们要做的，要宣传的，这是最大的竞争优势。


    **别人能做到的，我们不做。我们只做别人做不到的，这才是我们的竞争优势。** 别人做到的，我们讲，没有任何意义，别人可以复制我们、攻击我们，所以我们只讲别人做不到的。我们的所有营销，都是从别人做不到的地方入手。竞争壁垒、唯一性，这是所有讲师下功夫的地方。如果别人做得到，我们谈起来还有什么优势？说话没什么给力的了。


    我们谈的，就是我们实际上捏出来的服务、证明，都是别人做不到的，你努力也没用的。你要追上我们现在的服务规模，你得努力几年，你还要聪明、有钱，才做得到。不要把我们弄得跟初级选手一样，大家没什么区别，我们宣传还有什么意义呢？


    ## 第六章

    教你如何打造

    个人品牌


    > 在移动互联网时代，一个没有品牌的人，犹如没有品牌的地摊货，很难有高质量的买家买单。企业创始人，一定要学会品牌营销，先把自己营销出去，这个就是企业家个人品牌的打造。

    > ——陈昌文


    ### 1、以前的企业是卖产品，现在的企业，首先是卖个人品牌，卖人设


    为什么要在网络平台上打造个人品牌？因为这样可以让你的影响力放大到普通人的几倍、几十倍、几百倍，甚至几万倍。普通人最多能影响、营销数百人，而一个注重打造网络个人品牌形象的人，则很有可能影响、营销几万人，甚至几十万人、几百万人。


    随着人们消费水平的提高，人们越来越喜欢有品牌的人与物。人们对品牌也会越来越挑剔，谁早日打造个人品牌，谁就更早获益。拥有个人品牌的人会比普通人拥有更多的社会机会。无论是社交，还是售卖商品、服务，市场更喜欢那些有个人品牌的人。


    人们买东西，首先是看这个东西的品牌。品牌好的，就买；品牌不好的，不买。连不识字的人，也知道买东西要买品牌的。只要这个人的消费能力允许，他们就希望跟品牌打交道。同样，每个人也希望跟有个人品牌的人接触，这样，他们会感到自豪、舒心。也就是说，个人品牌是你的社交名片，你可以更容易、更精准的交往到对应的朋友、人脉，获得对应的机会。如果你有服务、产品，就可以卖给这些人。


    有个人品牌与没个人品牌差距非常大，人们喜欢跟有个人品牌的人交往、交朋友，也能记住这个人，故而会向这个人买单。人们社交，或购买一个人的服务，都在看这个人的个人品牌。人们喜欢、认可有品牌的人，个人品牌是取信于大众的必要条件。一个没有品牌的人，犹如没有品牌的地摊货，很难有高质量的买家买单。


    如果你在行业内建立了自己的个人品牌，则其他没有建立自己个人品牌的人的客户就会来找你买单。人们总是喜欢找有个人品牌的人买单，这是一种不可抗拒的惯性，犹如你们总是想找专家一样。


    打造个人品牌，是新媒体时代的蓝海战略。只有走在前沿的网红、企业家开始在有意识的打造自己的个人品牌，以后，会有更多的企业老板出来通过各种新媒体平台打造自己的个人品牌，否则，将落伍。社交媒体时代，个人必须媒体化，而想要在社交媒体上出类拔萃，你就必须得有个人品牌。以前的企业是卖产品，现在的企业，首先是卖个人品牌，卖人设。有了这个，才能有流量，然后自动营销产品。如果没有这个思维，在当今时代，你做生意就很难。任何一个高级营销专家，都是打造个人品牌的大师。因为建立了个人品牌过后，你的产品、服务，会自动进行销售，粉丝会抢着买单。


    无论你从事什么行业，你都需要在行业里建立你的个人品牌。这样，你就能区别于其他那些没有个人品牌的人。打造自己的个人品牌是你区分于芸芸大众的好方法。每个人都是一个产品、一个品牌，不管你承认不承认，你都在营销自己，卖自己。既然这样，还不如专心致志的塑造好自己的个人品牌，让自己在卖服务、卖产品、卖自己的过程中，获利更大。打造个人品牌对当事人是有巨大利益的。


    ### 2、个人品牌营销的本质是，你能为客户提供更专业的服务


    为什么要打造个人品牌？因为这会让你看起来更专业，而更专业，你就可以获取更高的利润，可以增加你的影响力。高手都明白，影响力会带来更多的财富。只有专业的人才有机会获得影响力、财富与信任度。


    个人品牌营销的本质是，你能为客户提供更专业的服务，也就是你是这个行业的第一名，你是服务高手。一个行业一般只能打造为数不多的几个个人品牌。聪明的老板会想方设法的抢占行业内的个人品牌，通常来说，人们在一个行业内能记住的老板的个人品牌也就3到5个，多了就记住了。无论你是做服务的，还是做产品的，你都要想办法让自己的个人品牌在你那个行业里变成第一名。如此，你的服务与产品就好卖了。


    个人品牌就是你有意识的营销客户，让客户对你产生一个印象，你是干啥的，你是这个行业的专家，你在这个行业具有一定的发言权、权威性。这样，这些客户有这方面需求的时候，首先想起的就是具有个人品牌的人。所以，你非常有必要在自媒体平台上打造个人品牌。


    **个人品牌打造好了，就能让你这个人更值钱，你可以卖更高价格的服务、产品，你可以被动吸引到对应的高端人脉。产品有品牌营销，个人也有个人品牌营销。建立自己的个人品牌就是在给自己增值。**
    没有品牌营销思维的人，都会被淘汰，或者说，卖货卖不过有品牌思维的人。有品牌思维的人，卖货能卖得贵，卖得多，卖得快，还能先收钱。


    为什么要打造个人品牌？就是为了把产品服务卖的多，卖的快，卖的贵，客户还非常相信我们。搞品牌营销的目的是让你的货、服务卖得好，卖得贵，所以，有品牌意识的人，天生就必须把产品、服务做到极致。


    打造个人品牌的目的，就是让你区别于普通同行。你是与众不同的，公认的服务好，质量好。就是价格贵点，大家也接受。本质上，没有人知道他应该为一件商品付多少钱，而品牌的作用，就是提高售价，提高利润。所以，你必须打造个人品牌、商品品牌、企业品牌。


    任何一个聪明的企业家，都会打造自己的个人品牌，而不仅仅是打造产品品牌。


    #### 打造个人品牌的好处是什么？


    - 1、可以被动吸粉；

    - 2、可以建立高端人脉；

    - 3、可以社交到更多高端客户，服务价格更高；

    - 4、客户会更信任你，因为你是一个有人设、有品牌的人；

    - 5、你的一言一行，都将变成广告，都将具有传播力。


    有个人品牌的人，比没个人品牌的人更容易被传播，而传播的次数多了，生意自然就好。拥有个人品牌的人，本身就是一个传播渠道，这个传播渠道就是口碑传播。拥有个人品牌的人，本身就会具备话题性，本能的会吸引很多人的自动关注与传播。如此，拥有个人品牌的人，自然具有影响力、渠道力、传播力。任何一个现代社会的老板、企业家，都应该拥有自己强大的个人品牌。如此模式，会让你在互联网时代做企业更轻松。


    个人品牌是一种吸引人脉的玩法，是一种对主动社交、被动社交都有好处的玩法。你有了个人品牌，对应行业的资源、人脉都会靠近你，你出去社交的时候，大家也会给你几分薄面，这样，你的生意、事业，就发展的更顺利些。总之，当今互联网时代，打造自己的个人品牌有百利而无一害。


    ### 3、个人的竞争，也就是个人品牌的竞争，你在别人心中的印象、地位，决定着你的前途


    自媒体时代的到来，每个人都是一个个人品牌，只是很多人还没有把自己的自媒体账号当做自己的个人品牌建立的工具，是在瞎玩，这其实非常浪费。如果有意识的把自己的自媒体账号当成个人品牌建立的工具，则你就比大多数人聪明，你将会在自媒体时代、个人品牌时代获得大量财富。


    当今互联网时代，如果你注重打造自己的个人品牌，你就可能逆袭。因为当今时代，每个人都是一个超级个体，每个人都可能是一个媒体，找到自己一个具有商业价值的特长，只要你的个人品牌对市场有价值，然后日日宣传。


    比如你的文章写得好，你的歌唱得好，你对手相有研究，你对怎么做自媒体有心得，这些都是可以用来打造个人品牌的。长期宣传，大家对你的印象就跟你的特长结合起来了，你也就具有这方面的个人品牌了。


