    文老板社群的价值观是什么……人们认可价值观， 就会收心收魂，他只要认可你的价值观过后，他再看你的每个视频，他都会认为你说的每句话都是对的。这是营销的生存逻辑，这个逻辑是非常厉害的，会厉害的不得了。


