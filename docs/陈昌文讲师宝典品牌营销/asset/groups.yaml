    社群传播的是整体价值观，输出的是整个社群的纪律、价值观。输出价值观和价值是两码事，输出价值观是一个很强大的营销，你可以专门输出价值观，也可以专门输出价值。输出价值，就是我这一块肉好吃，你来吃；输出价值观，你听我的，我说的就是对的。这两者可以结合起来运用，也可以一会讲价值，一会讲价值观。价值观是要排斥别人的，就是要排斥一帮人，你不认同我，就离开。认同我，就来。


    所以很多人买苹果手机，本质上是在为乔布斯致敬，为他的价值观致敬，是这样去营销的。我们要让他们为陈昌文老板社群的价值观来买单，我们要让他们为读书会的价值观买单。为价值观买单和为价值买单是两种人，当然也可能有重合，但是它是两种不同的营销逻辑。


    只传播正确的价值观，我们就能拥有更多的粉丝，更多的铁粉，也可以拥有更多的老师。传播价值观的人，你就去收高级群单于，你都不用收读书会。把读书会的粉丝送给我们其他的老师，让他们去收读书会。传播价值观，你就天天说高级群好了，你是老板，你是企业家，你来高级群，传播价值观就上高级群单于，传播价值就去卖读书会。


    你的人品是你的基础，人品、人格、人格魅力、道德素质都是你的基础。你的粉丝数量是你的基础，你直播间的人是你的基础。这些基础我们都是日久见人心。我们通过直播、视频传播陈昌文老板社群的价值观、企业经营的价值观，其实我们的社群本质上是企业。什么能传播，什么不能传播，是规范整个社群、整个企业的运营。


    讲真话，当然是我们的价值观，我们只允许讲真话，不允许骗人，诈骗是违法的。对粉丝要讲真话，对社群里的人要讲真话。我们走正道，不允许走邪道。心中有他人，我们要将心比心。我希望能力强的、正心正念的人更多，讲师团的人变得更多，道德素质高的更多。


    人有人道，狗有狗道，鸟有鸟道，你走好你的道。只是，对应的人获得对应的收入，不要抱怨。你是一只鸟，你就走你的鸟道，鸟人你就走你的鸟人道；善良的人、好人、为社群做贡献的这些人，他应该到对你的道上去获取对应的收入，这叫天道。


    ## 12、你为什么赚不到钱？我来告诉你，你是假的


