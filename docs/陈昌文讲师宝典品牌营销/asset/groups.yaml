    # ## 5、人家会求着你来买单，这个叫价值观营销


    这个价值观是要走头条阵的，就是天下的粉丝都知道我们是这样一个社群，那么就不会出现各种各样的幺蛾子。这个价值观视频，几百人、几千人都要去传，我们社群做讲师的所有人都要去传播我们的价值观。


    比如说，今天的价值观文案出来了，所有人都去做一个传到所有的平台，然后粉丝就知道我们是一个什么样的社群。并且，陈昌文老板社群和读书会都要传播，内部的流量一定要运营，当然外部一定也要运营起来。


