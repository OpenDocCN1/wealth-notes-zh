    多读《72大营销系统》，您就会越来越优秀。这本书，看一辈子，看一万次都不为过。看懂了，您对营销彻底理解，您自然赚钱多。品牌营销+链接式营销+潜营销，深入执行我说的，听话照做，干起来活来。


    ## 8、关注自己的视频、流量、变现，才是一个成年人应该做的事情


    学员：


    陈老师，您好！我非常感恩能够来到这个群里学习您的智慧，真的是三生有幸！我一直在奋力做视频，但还没有爆粉，我会继续加油！昨晚我在看直播时，看到有一位教育大咖说起您，他非常尊重您。我很激动，跟着您学习，是您的学生，我真的很骄傲，我会加油！感恩您的教诲，对我终生有用。


    陈昌文：


    努力做视频、直播，不断的爆粉，收单子就行了。关注自己的视频、流量、变现，才是一个成年人应该做的事情。


    ## 9、老大，我可以用您的语录，去发文案吗


    学员：


    老大，如果我想要做恋爱相关的项目，可以用您的语录，去发文案吗？我觉得您的语录、音频特别的棒，很有影响力。我现在在矩阵做您的《恋爱宝典》精讲，想问一下，之后您的精讲，会继续开课吗？


    陈昌文：


    可以，不过我不做这个项目。


    会讲，不过时间不定，我也会讲《讲师宝典》，《恋爱宝典》也会讲，有缘分就能听到。我们所有老师，必须要拥有我们的所有书籍，这样可以裂变式营销，拍照，做视频营销。做为讲师，卖读书会，书籍都不全，搞什么搞？


    ## 10、别人天天教，都不去学，或者学不会，属于傲慢无知之徒


    学员：


    尊敬的陈老师：您好！真的好感恩遇见，自从加入社群后，经常聆听您对大家的教诲，提升了自己很多智慧，也开始真正的对人性深处的东西，有了更深的思考和认知，以后会少踩很多坑。知道您的时间大于钻石，怕太多文字消耗您的时间，但综合考虑再三，还是要给您我第一次发自内心臣服和跪拜的老师请示下，因为这是对您，也是对我的尊重！


    我发现，我的粉丝还是1.5万没怎么涨，直播间还是个位数，一场直播下来2小时才给我推流200多人，我开始思考到底问题出在哪里。后来跟一个在抖音工作过的技术老师聊天才知道，原来抖音有很多的规则，双轨制，直播间流量打不开，分享再好，直播间不进人，没有用。而决定流量进入的关键是靠粉丝画像、账号的出身决定了抖爸爸是否推流。才知道抖音白玩了这么久，才知道为啥我直播间没人了。


    所以，现在学习抖音运营，打通直播间的流量入口。老号粉丝画像不对，所以就把它拿来在直播间练手，抖音直播间运营干货知识。能起来一个号，其他的都可以了，等有了运营账号的能力，后期再起个新号做读书会，不知道这样允许不？或者不允许的话，只能在线下把咱们的读书会作为企业文化来送客户、朋友，提升企业和自身的软实力，再偷偷地趴在社群里听您的智慧了，都可以。听您安排！


    陈昌文：


    您属于不会学习的人，也属于非常懒惰的人。群里内部课，天天都有经验丰富、几百万粉丝的、数十个账号、日日赚几千、几万的老师日日下午、晚上分享，您居然学不会？！或者说，您压根就没老老实实学，您这样的人，可悲，入宝山而空手归。别人天天教，都不去学，或者学不会，属于傲慢无知之徒。


    ## 11、只跟智力正常、有未来、有前途的成功者交流


    学员：


    老师，我今天无形中挽救了一条生命。她说在我朋友圈，看到了我们社群的文字和我的直播。突然感觉到咱们社群的伟大。真的是使命感，大爱无疆。我要好好的多学习，帮助更多的人。


    陈昌文：


    对于脆弱的、无能的、有病的、想要自杀的，全部拉黑，不要交流。否则，他们会赖上您，最后会怪您，搞出个社会大新闻，然后您就家破人亡了。只跟智力正常，有未来，有前途的成功者交流。这些人，积极上进，身心健康，智力好，不会惹是生非，能促进社会和谐。


    ## 12、等大家都反应过来，赚钱也就跟他们无关了，我们又到下一个平台了


    学员：


    老大，我的直播三、四个小时的回放，都有五、六万的播放量，感觉抖音这个流量好夸张啊，那么多人看这么长的直播回放！


    陈昌文：


    竭尽全力 的做抖音，红利期很快会结束，不是长久存在的。现在还有很多 人没反应过来，包括我们群里的人。等大家都反应过来，赚钱也就跟他们无关了，我们又到下一个平台了。


    ## 13、把我最近的内部高级群课程，反复听一千次


    学员：


    陈老师好，有幸链接到您，真的是祖上积德了。我每天都在听课，但我知道我是一个不合格的学生。进群4个月了，还没开播，一直在想着把实体的几百万货物清理了，再开播。


    做了二十多年的实体，今年实体难做了，我也太想挤进咱们的高级群学习，想把您的智慧学到千分之一或万分之一，我也知足了。我想通过在群里学习，提升自己的段位。最近把店面关了，只留下工厂给人加工定制，把任务交给家人。接下来向您跪学，麻烦您收下，感恩您。


    陈昌文：


    把我最近的高级群内部课程，反复听一千次。所有人都必须听，反复听，书籍反复背诵。在直播间卖读书会，偶尔卖卖高级群就行了。一天搞几百单是基本收入，但是必须对我的体系、知识、思想，以及营销思维炉火纯青。我们就是直播电商，卖货搞钱。我们的货，就是儒家思想、陈昌文方法、读书会。


    ## 14、每个厉害的角色，都是这样日日不断的讲课，做视频，做起来的


    学员：


    好的，有劳了老大。我很少发言，也是很长时间家里出了很多事。处理线下的几家店铺。另外家人的身体不好，手术住院照料等等俗人俗事。好在都处理好了，现在安安心心的做线上了。今天是开播的第
    5 天，没什么人，但是心念一闪，震动十方。心念调整之后，状态确实好太多了。自己比较笨，趁现在直播间人少，那就听话、照做、执行。好好的修炼内功吧。


    感恩您每天呕心沥血的付出，感恩老大。


    陈昌文：


    每个厉害的角色，都是这样日日不断的讲课，做视频，做起来的。俗人俗事，需要很多钱，赚到更多的钱，用钱解决。


    ## 15、老大，链接式营销做好，真幸福啊


    内部讲师：


    老大，链接式营销做好，真幸福啊，哈哈，今天出了3个高级群，真诚分享就可以了。越分享，人还越舒服，感恩您老大。还有一个正在写入群申请书，在直播间直接下单的9999的链接。直播回放可以赚钱，讲的好直播，挂个小黄车，就自动出单了。


    感恩老大，您的营销思维太强大了。


    陈昌文：


    请所有人认真专研我们的读书会业务、我们的陈昌文老板社群，别偷懒。


    入群自愿申请书、身份证正反面、资产证明都必须要有。收不到人，没关系，但按照规则执行。严格按照链接式营销，收富人，品牌营销，收富人。这样做，直播间1000人，每天赚几万都正常，再做做读书会的单子。


    不要急着赚钱，搞明白我说的链接式营销+品牌营销。另外，我们的书籍，这是厉害的责任背书，也就是没多少人在江湖上混，能出这么书籍。还有我的微博，都是强力背书。


    这些领悟透彻，一天几万块的收入，都是正常的。


    ## 16、结合书本 + 链接式营销、品牌营销，修炼好，出单容易


    学员：


    老大，今天直播间 10 个人，开播 1 小时，立马收了两单。我感觉是因为这一小时结合了老大解读《恋爱宝典》的课去讲 + 链接式营销的原因。感觉特别好。感恩老大。


    陈昌文：


    结合书本 + 链接式营销、品牌营销，修炼好，出单很容易。加油吧，您的成绩，还是太弱了。


    ## 17、感恩您带我安身立命


    学员：


    感恩您带我安身立命！这是我第一个高级群的单子，很开心，比以前一天做几万的业绩还开心！跟上时代，这是我新生的开始！感恩老大。


    陈昌文：


    加油。感恩遇见您。


    ## 18、你们这种人，主要是闲得慌


    学员：


    深夜，辗转反侧，睡不着，不知道该不该发消息，想着陈老师有更深彻的见解。


    - 老大，当心情很差的时候，应该怎么做？

    - 当面临抉择的时候，应该怎么做？

    - 迷茫的时候，应该怎么做？

    - 如何调节自己的心情？控制自己的情绪？

    - 我有的时候特别容易这样。其实我不大敢给陈老师发信息，怕被拉黑，但还是壮着胆子发了。


    陈昌文：


    当您暴富的时候，当您竭尽全力赚钱、工作的时候，您自然就快乐了。你们这种人，主要是闲得慌。


    ## 19、这个东西，是要找大师论证的，而不是胡言乱语


    学员：


    没有几个人真正有智力，大多数人只是以为自己有智力，说的越多，错的越多。越是传播，越是害人害己。做主播，其实是战战兢兢的职业。


    陈昌文：


    严格按照书本来传播，必须有严格的规律、定律、原则。要言之有物，说话要说真正对粉丝有用的话。这个东西，是要找大师论证的，而不是胡言乱语。


    ## 20、《恋爱宝典》的内容确实太牛了


    学员：


    老师，《恋爱宝典》读书会一个。新开播一周时间，直播间 5 个人，4 个小号，居然出了一单，就是读书和讲书。


    《恋爱宝典》的内容确实太牛了。线下的事情处理得7788，接下来全心做读书会项目，为过年的流量做好准备，感恩遇见老师。


    陈昌文：


    加油，日日循环，多直播，多做视频，把粉丝量做起来。每天就是流量、变现，其他的，别想。


    ## 21、先别吹牛，可能您跟大多数无能的人差不多


    学员：


    老大，群里聊天，有没有什么注意事项？还有咱们现在有几款主打产品？我知道的是老板培训、微商、恋爱培训、读书会啥的。还有我想知道，咱们的分钱规则。我会发扬您的精神，除了吃饭睡觉，就是一天
    16 个小时的干活。


    陈昌文：


    先听一个月 YY 课，听明白了再说。先别吹牛。可能您跟大多数无能的人差不多，干几天，就不行了。


    ## 22、标准化所有流程，让员工、客户全面复制，就出单


    学员：


    陈老师，您好，我是老板社群的***。这是我的另一个账号。刚进来走了弯路，现在懂了。今天直播间就一人，还出了一单《恋爱宝典》，感恩您指引方向！用行动，来感恩老师！


    陈昌文：


    出单很容易，讲直播，讲视频就行了，一直讲，就出单了。天天搞 10 个小时。做公司的目的是标准化所有流程，让员工、客户全面复制，就出单。


    ## 23、是讲透彻一本书，不是一个系统


    学员：


    老大，点对点推销《72 大营销系统》，是应该只讲好一个营销系统就好了？还是说讲多个营销系统？


    陈昌文：


    直接直播，或者在视频里，讲透彻这本书。是讲透彻一本书，不是一个系统。不要搞点对点，只搞一对多营销。


    ## 24、要多讲《72 大营销系统》《讲师宝典》，人群不一样


    学员：


    老大，早上好！知道你每天都很忙，我也不好意思打扰你，但我现在有点感想，不吐不快的感觉。我昨天和今天直播，讲的是《论语》《72 大营销系统》，还有《讲师宝典・直播时代》，感觉自己越讲越带劲。直播间也能理直气壮的讲，弱者、怨妇不要来我直播间，不要关注我，我不要。真的就有那种感觉，这些内容不是讲给他们听的，这些东西不应该让他们听到的感觉。越来越理解老大你的思路，和为什么平常在群里说的话了。这种感觉是我原来讲《恋爱宝典》没有的感觉，就是觉得太爽了，所以今天斗胆给您一吐为快！


    陈昌文：


    要多讲《72大营销系统》《讲师宝典》，人群不一样。


    ## 25、对我书籍背诵越多，赚钱就越多


    学员：


    老大，成交文案都在哪儿啊？自己在书上扒吗？我一直在悄悄的学习，还有好多没弄明白，也不敢冒昧的瞎问！怕自己说错话！


    陈昌文：


    复制群里3个大神讲师，复制我书籍里的文案。看我书籍里哪里好的，就背诵。对我的书籍背诵得越多，赚钱就越多。


    ## 26、第一次 3 个小时的直播，出了 4 个读书会


    学员：


    谢谢陈老师，第一次 3 个小时的直播，出了 4 个读书会，感恩陈老师的教诲，我会越来越努力的！


    陈昌文：


    不断的复制优秀老师的视频、直播，多赚钱。我的课，要反复听，我最近的内部高级群出单课，听一千次，一天先弄几百单再说。


    ## 27、我们也只接触高收入、讲道理的人


    学员：


    去年我自己也摸索了一段时间，没摸索出名堂，然后又去做其他事情了。听了群里的分享，和学习了直播间，以及您的课程，越来越有感觉了。我是有这种付费学习意识的，我也经常付费学习。门槛真的太重要了，可以隔绝低层次的人。让有价值的信息，只在少数人里流转。我也定位讲《恋爱宝典》。


    感恩陈老师！


    陈昌文：


    那些不舍得花几千块的人，花了一年又一年的时间，只能是浪费人生。我们也只接触高收入、讲道理的人。我们的善心善念被伤害过了，也就知道该跟谁交往了。


    ## 28、知道了，就去复制，就去赚钱，而不是只是吹牛厉害


    学员：


    我喜欢你说话的风格。骂着让人赚钱，特别“狠”那种。我把你书里面说的话，一段一段的整理好，全部收藏到微信里面，没事就多看。


    陈昌文：


    格物致知，知行合一。知道了，就去复制，就去赚钱，而不是只是吹牛厉害。


    ## 29、不会讲干货，就在我们的书籍里找


    学员：


    老大说，要引发重视。他讲的很多点，威力都很大，只要引发重视，就能很快变现。只要引发听众的重视，他就会买单。


    陈昌文：


    每天早上 15 分钟早会，晚上 15 分钟总结，就在 YY 里进行，日日如此，日日循环。每个人的每句话都必须是绝对刚需、干货。讲口水话、废话的人就是浪费所有人的生命。不会讲干货，就在我们的书籍里找。讲废话，就是废物，就是废人，浪费所有人时间。


    ## 30、老师的书，是我家里最贵重的物品


    学员：


    尊敬的老师，您的书，我收到了。感恩老师，辛苦您了，谢谢您！拿到老师的书，是最开心的。老师的书，是我家里最贵重的物品。


    由于上段时间头晕厉害，断播了一段时间。去年太拼了，经常忙到凌晨三、四点，然后六点爬起来，把身体搞透支了，气血太虚，经常头晕，一直没重视，所以在调理。也谢谢老师经常在群里叫我们锻炼身体，早睡早起，不要把你搞坏了，身体好才能打持久战。听了老师的话，才知道以前的行为真的好蠢。虽然这段时间断播，但是每天坚持学习，坚持看老师您发在群里的精华。现在调理好多了，准备继续干起来，为过年，为以后沉淀。


    陈昌文：


    加油，努力赚钱。做流量，变现。我说了啥，你们要执行，不然把身体搞坏了，划不来。但是你们就是不听啊！持久战，而不是干一阵就over了。


    ## 31、这是我直播出的第一单


    学员：


    这是我直播出的第一单，这个人下单我都不知道，也没有跟我互动过，我都好意外。感恩您，陈老师。在您的书本上，您的文字让我学到很多东西，让我成长了很多。非常幸运链接到您，感恩。


    陈昌文：


    不断的做视频，做直播，收单。跟社群里优秀的人学习出单，学习文案，多赚钱。社群里有很多优秀的老师，不断的复制优秀的老师。


    ## 32、传播、讲课成本要为零，但是质量还非常好


    内部讲师：


    各位，会玩 PPT 的，我们一起发力，打下这场攻坚战。这次将是一场飞跃，物料系统，我们可以直接落地，每天可以分发到各大直播间。这将是一场飞跃。讲课质量的提升，标准化、物料化的提升。


    陈昌文：


    一切都是标准化、模块化、傻瓜化，拿着就能讲，就能分发。传播、讲课成本要为零，但是质量还非常好。

