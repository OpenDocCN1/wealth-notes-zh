    # 第三章 用价值观营销做品牌营销


    直播不是娱乐化，不是逗乐，而是干货释放、价值释放，这样才能吸引到真正的高端客户。儒家思想、《论语》标签的不断打造，是为了过滤低层次的人。正义从来没也没战胜过邪恶，阴阳都是各一半，阴阳平衡，才是真相。

    ——陈昌文


    ## 1、我们真正的品牌营销方法，是宣传儒家思想，宣传陈昌文方法


    用价值观营销做品牌营销，不要以利诱之。价值观就是传统文化，认认真真做好传统文化。我们讲的是三观必须正，如果你的三观不正，我就忽略你了。价值观正是最重要的，每个人都要走正道。


    三观不正的人，别人就不喜欢听你讲话，会心生厌恶，就没人给你付费了。三观正了，配合营销方法，你自然就会越来越强大。三观，是核心。每个人都要正三观，去学习国学、儒家思想，且传播，然后再做营销。我们真正的品牌营销方法，是宣传儒家思想，宣传陈昌文方法。做社群，这个模式才是最厉害的，会得到很多人点赞。


    我们社群，要正三观，正价值观。三观必须正，价值观必须正。


    价值观正了，你才会开心、乐道，钱自然就到了。三观不正，是会倒霉的，也没有前途。三观不正，很多人就会软，就会瘫。三观，就是我们中国的传统文化，有了这个，我们社群才会有前途。我们社群三观不正，干啥都没前途。赚钱的营销手段，就是陈昌文方法，就行了。每天要有一半以上的时间来正三观。


    正三观，就是通过传统文化来正三观。儒家思想，就是用来正我们社群三观的。三观不正，谈赚钱，没什么意义。讲师们讲的，永远都是正三观。三观正了，我们再讨论赚钱的事情。


    想要赚钱，想要长期走下去，一定要三观正。三观不正的人，没什么前途。


    三观正，老老实实做单子，谈业务，搞流量，搞成交，完事了。别耍花花肠子，别自作聪明，别参与黑色产业，别对外输出弄虚作假的信息。就算客户要求，给你钱，也别玩，这是犯法的。


    群里的三观必须正起来。儒家思想，要成为核心思想去讲解。要把每个人教会走正道，然后再配合营销方法，这样，自然就会越做越好。


    人有两种面孔，一种是精致打扮出来的美，加上天生丽质，这是皮肤之美；一种是心慈目善、虔诚、尊重，这种美是能入骨髓。善良，你是善的分享出去，你就会变得很美丽，人就会过得越来越好。要给真实的东西。淫荡的美丽，没什么用。真正的美丽，是善良的美丽。


    修炼的首先是心，学的首先是价值观，是思想。这个搞不懂，在我这里学，啥也学不会，成天舞刀弄枪的，皮毛都摸不着。


    人的慈眉善目，跟人的发心有关系。你虔诚一点，尊师重道一点，老实一点，低下去，你就成为王了。人低为王，地低为海，不要高傲。木秀于林，风必摧之。出头的椽子先烂。


    心里面，要有些爱。有了爱意，才有未来。若是没有爱，你跟我也学不会什么。要爱客户，爱老师，爱万物众生，不要只想赚钱。要赚钱，先爱客户，慈悲他们，帮助他们，他们自然给你钱财，并非龇牙咧嘴的想要钱。


    先想想，如何让自己慈眉善目？


    先想想，如何让自己心地善良？


    先想想，如何有助于这些美女老板？


    然后，再想想做营销、赚钱的事情。否则，你会变得吃相难看，而且丑陋。


    只要你们先学会了搬运我的思想、价值观、文字，你们就能赚钱了。其实，先别谈赚钱，先谈弘道，弘道，就是服务粉丝。粉丝服务好了，人民币就服务我们。我们服务不好美女老板，美女老板的人民币就不服务我们，就是这么一个简简单单的理念。


    我们一直在做德行教育。后来我发现，德行教育也是需要天赋的，也就是说，德行教育比技术教育还难。有些人，人性卑微，没办法教育。我发现，德行，才是一个家庭代际传承最核心的东西。所谓贵族，不过是德行高尚。


    人的大部分问题，首先是态度问题、德行问题，然后才是能力问题。态度、德行出了问题，会导致自己的能力乱用，也做不好任何一个直播、任何一个讲座。我们有的老师，简直每天就是胡言乱语，对儒家思想、陈昌文方法不做讲解，成天在外面东拉西扯，浪费自己的时间，也浪费粉丝的时间，导致没什么收益，认为自己很高明。这样搞下去，会一直不进步。


    价值观正，自然赚钱；价值观不正，做啥都难。三观不正，这个人的前途就会出现严重的问题。三观不正，这个人也没什么希望。所有老师，天天要讲的就是儒家思想的价值观。有些人三观不正，只想赚钱，这些人是极其愚蠢的。人首先是正三观，然后才是赚钱，所以，我们首先要宣传的是儒家思想。你的价值观先跟我们对接了，我们再谈赚钱的事情。价值观不正的人，能拉黑一个是是一个。


    我只要三观正的人，跟我合作，能背诵儒家思想的人跟我合作。对儒家思想不理解的人，全部放弃，不要这些人跟我们有任何合作。所有人，都必须道德素质极高。这样，我们才能吸引到道德素质高的人，跟着我们混。这样我们才好管理，才有发展前途。


    ## 2、陈昌文老板社群、读书会，传播的首先是一种价值观


    陈昌文老板社群、读书会，传播的首先是一种价值观。我们的价值观是儒家思想，是正心正念做人。我们赚钱的模式，是你彻底认可我了，来报答我，就付费，否则，别付费。


    社群传播的是整体价值观营销，输出我们社群的纪律，我们社群的经营逻辑、营销逻辑。用这个来做品牌。


    只要传播的是正确的价值观，我们就能拥有更多的粉丝，我们就能拥有更多的铁粉，我们也能拥有更多的讲师。我们要通过直播、视频，在抖音里不断的传播陈昌文老板社群的价值观、企业经营的价值观。拥有这个价值观过后，我们自然能吸引到很多人。


    读书会，以及陈昌文老板社群，不讲一句废话，都是正能量的话语。这样，就可以在内部孵化出很多铁粉。是整体为社群发声，是整体传播社群的纪律、规章制度、做人做事。社群只吸收企业家、美女老板。这是陈昌文老板社群收的人，是按照这个模式去传播的。


    真正厉害的讲师，根本不用赚钱，价值观传播到位，钱自然就来了。当然，我们也需要做一些品牌营销、潜营销、链接式营销，钱自然会来。


    只要价值观跟我们一样的人，或者赞同我们的人，视频、直播里讲的都是价值观。你的价值观是不是儒家思想的价值观？你赚钱的观念、你婚恋的观念、交朋友社交的观念是什么？是不是赞同我们？赞同的留下，付费跟着我们，不赞同的拉黑。


    直播间、视频里，都可以把书拿出来讲，这个书里的价值观是什么？这个书里的的价值观各位赞同吗？用价值观区分人群，把客户区分出来。你不赞同我的价值观，我就不要你。


    建立读书会品牌，建立陈昌文老板社群品牌，全用价值观营销。提炼我们的核心价值观，比如，尊师重道，孝敬父母，早起早睡，锻炼身体。这个核心价值观，你不赞同，我就不要你。儒家思想的价值观，你不赞同，我也不要你。并非你给我钱，我就要的，而是你必须赞同我的价值观。我们社群的个性是什么样的，这个是我们不断表述的。


    开口闭口，必谈三观，必须谈儒家思想，必须提炼核心观点。用核心观点，不断的袭击粉丝的头脑，价值观就会自动传播，会自动分开人群，自动吸引忠实粉丝。


    价值观这三个字很重要，大家在直播间、视频里多提，在朋友圈也多提，一旦一个人认同你的核心价值观了，买单就水到渠成了，支持你也就水到渠成了。不认同的人也就走了，不必争吵。


    要时时刻刻强调，我们是讲儒家思想的，我们是以儒家思想要求自己的，我们也是以儒家思想要求我们的粉丝、客户的。社群里只讲真话，社群对外部讲的一切，都是社群内部真实发生过的、伟光正的价值观。社群不允许任何人讲假话骗人，也不允许有引诱。


    一个人想要加入我们社群，首先是价值观正。我们并不是带着人赚钱，而是你看懂了就来，看不懂就算了。当然，我们也要讲懂。进入社群，首先是学习儒家思想，其次是学习《陈昌文方法
    72 大营销系统》，我们是为成功企业家、老板，讲儒家思想、《陈昌文方法 72 大营销系统》的。这是我们的定位。


    **不要想着赚人的钱，而要想着，这个人的价值观是不是跟我们相合。我们彻底践行的，就是价值观营销。** 每个讲师，都要日日强调我们社群的价值观，这一定要成为我们的口头禅。社群的六脉神剑要日日讲。每个老师，要日日循环儒家思想，讲给大家听，我们的《恋爱宝典》《陈昌文方法
    1000 问》《72 大营销系统》……要日日循环给所有的粉丝，讲明白，这些书籍内容都归儒家思想管，并且，认可儒家思想的人才有资格来学，不认可儒家思想的别来。建议对我们不理解的，先进入《陈昌文解读〈论语〉》读书会学习。对《陈昌文解读〈论语〉》没有疑问过后，才有资格进入高级群。


    **价值观、三观正，是社群的生命。这个东西正了，赚钱容易；价值观不正，则赚钱也没有意义。**


    社群老师，别奉行明哲保身，看到错误不要怕得罪人。你们看我，为了捍卫价值观，都是直接骂人，让他们滚的。要把这些犯错的人、价值观不正的人，当成反例，日日讲，匡正所有人。不要怕得罪人，怕得犯罪人，对我们社群祸害最大。怕得罪人，我们这口大锅都被砸了。


    我也不想得罪人，我跟你们一样，都明哲保身，行吗？不行的。做人，谁也不想得罪人，但是，为了组织，为了整体，不得不说。谁愿意当被别人讨厌的人啊？但是，这正是儒家思想对我们的要求。我们不做乡愿，我们就是要让这些价值观不对的人、不正的人难受，他们不喜欢我们就算了。我们必须为匡正价值观而努力，而牺牲，而付出代价。我们的价值观，就是儒家思想。


    记住，价值观、儒家思想，也都是我们用来变现的。所有人在社群里，必须为社群做贡献，不愿意为社群做贡献的人，我们也要消灭，这也是我们的价值观。


    讲的是价值观，比如我们是儒家思想的价值观。我们主要是讲营销，以及《恋爱宝典》。我们想要接触到的人，是讲道义的人，讲企业家精神的人，讲自己内部业务创新的人。


    企业家精神、道义精神，是只问耕耘，不问收获，是积极努力的把事情做好，做到极致，该有回报的时候，回报自然 came 了。人首先应该想到自己能干啥，能干干啥，能有多大的市场，能带着多少人发财，能为客户做什么。当我们做好了这些步骤的时候，做到极致的时候，我们的利润自然
    came 了。


