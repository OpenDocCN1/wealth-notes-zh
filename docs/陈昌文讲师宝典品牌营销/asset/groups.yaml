    # 第九章


    ## 链接式营销是品牌营销的重中之重


    ——陈昌文内部讲话


    “陈昌文”这三个字是我们的品牌名。你在外面讲直播、讲书，你必须和陈昌文的文字链接起来，这样你就会卖得更快。因为那些粉丝想链接到陈昌文的文字，想链接到陈昌文的课程，他必须链接到。


    ——陈昌文


    ### 1、链接式营销，就是借品牌的势，也是势能营销


    一切动作都是输出，就是你一定要不断的输出，你永远都在做视频，在做直播，你要做这个动作，其他动作没有意义。粉丝需要的是陪伴，需要一直看到你。他看到你，他自然会买单。他对你很熟悉了，他就会买读书会，他就会买陈昌文老板社群。他会买的，你介绍给他，他就会买，你不用催着他买，他会自然买的。你只要陪着他，一直给他讲，他就会买。你跟他熟悉，对吧，他不熟悉你，他自然不是特别愿意给你付费，他需要熟悉。


    我们做品牌也是为了增加熟悉感，增加信任感。


