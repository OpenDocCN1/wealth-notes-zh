    己的个人品牌越早越好，你一定要尽早去做这件事，越早越有 效益。任何人都应该在互联网时代，通过自媒体模式，打造自 己的个人品牌。这是最便宜，而且做的时间越长越有价值的事情。
    成功者必定注重自己的个人品牌。


