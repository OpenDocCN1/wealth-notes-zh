    这个与粉丝之间是具有链接性的，他就会自动买单。


    你要告诉他有这么回事，你不要只管讲课，那没有用的。你跟他很熟悉了，你又讲了很多《72 大营销系统》，讲了《恋爱宝典》，你说这个是陈昌文写的，他在内部讲公开课，这个信息分享给他，他知道这个信息，他心里面就痒痒，他也想增长智慧，他不缺
    398，他就加入了。然后你说，陈昌文先生每天在老板群会发信息在里面，经常会发一些有价值的文案。


    我们以前出单多的人都是这样的，你进去看文案，这条文案很值钱，这条文案很好。一定要让他去群里看文案，听陈昌文讲课，这个概念比什么都重要。


    赚钱多的人，全部是这样去做的，这个概念比什么都重要。这个概念是很多老师赚钱的秘密，是我们有些老师一天赚几万的秘密，就是这个概念。你说陈昌文会在里面发文字，在高级群里会讲课，上一节课讲了一个什么东西，对自己有哪些启发，他听了，自己就会去付费。因为好东西，大家都想听，都想知道。你知道，他不知道，他就心里不舒服。


    比如说，我发了一段文字，你读给他们听，你在直播间里读给他们听。你说陈老师今天在群里发了一段文字，我觉得这一段有意义，你们听听有没有意义？他自己就会付费了。


    你们一定要把我开始讲的这几段话理解透彻，并且运用，这是我们能出单的核心。这个概念要反复讲，就是你一定要告诉粉丝，每天你要找一段群里我发的文字，你觉得好的，你读给粉丝，你说这一段好，这个很重要，比什么都重要。然后你要告诉他，陈老师在里面讲课，你说听一堂课，听这个对你有什么用？你现身说法。因为我本来就是在通过书籍和内部课、公开课教你们，你们学到了，去分享给直播间的粉丝。一定要讲你学到的。那么，你在外面讲书讲得很好，他自然想要见到这个作者，他自然想进来进一步了解，他不缺那几个小钱，他自然就进来了。这个叫链接，你也是在借我的势，借“陈昌文”这个品牌的势，这也是势能营销。


