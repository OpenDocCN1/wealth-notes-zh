    \n感恩陈老师！\n\n**陈昌文：**\n没事多读读《陈昌文解读《论语》》，以及其它系列书籍，反复阅读，反复实践运用。少踩坑，不踩坑。把生活过好。\n\n\
    ## 34、就是几个简单的理论，细细讲，就能讲一辈子，就能赚大钱\n\n**学员：**\n老师，你昨天说：“讲过的东西也要细细讲。”结果那些人不但没走，还挺爱听的。以后我每天都会认真听课。以前怕她们不听，每天找新内容，可累了。\n\
    \n**陈昌文：**\n这是非常愚蠢的想法。就是几个简单的理论，细细讲，就能讲一辈子，就能赚大钱。是反复细炒冷饭，不是讲新的，是讲我讲过的旧东西、老东西，讲书籍里的老东西。\n\
    \n## 35、我讲营销是一步步给你们讲的，后面会越讲越深入\n\n**学员：**\n老师，您好，我这几天麦坏了，所以停了一天不能播。前天早上 7 点到晚上\
    \ 8 点，连续播了 13 个小时，收单也还可以，但是下播的晚了，下来要处理学员的问题，就没时间去听到您前天晚上现场的讲课。今天我 5 点起来，听了您前天晚上讲的课，让我审视了这段时间讲过来的课程，确实讲的最卖钱的就是这五个理论！\n\
    \n**陈昌文：**\n我讲营销是一步步给你们讲的，后面会越讲越深入。涉及到心理学、环境科学、媒介传播学、行为反射、哲学等多门学科。会非常深入、仔细的帮你们剖析，到底如何才能提升单量，到底如何营销。\n\
    \n什么时候一天能出 1000 单，直播间忠实粉丝到了一万人，你们就算有点明白了。所以，我的课程，要仔细反复听，以后会越讲越细致。每堂课，我都会释放一些非常必要的营销方法、理论。知识密度大。\n\
    \n听我的课程，经常听，还非常辛苦，需要刻苦去想，列出条理。但愿你能克服在学习过程中感到的不适应，以及辛苦，提升自己的头脑智慧。\n\n## 36、极度认真，自然就能赚钱\n\
    \n**学员：**\n三个多月前看到**直播间只有10~20几个人，慢慢的有50多个人，现在都是三位数了，24小时在直播。\n\n**陈昌文：**\n极度认真，自然就能赚钱。那些等待的人，都是傻子，浪费生命。我们就是要出单，要打造内部服务。\n\
    \n## 37、读书会我都买了，感觉能受用终生，传承给孩子\n\n**学员：**\n陈老师，您好，我是**，引路人***。感恩老大思想匡正，最近一直在拍视频学习，准备明天开直播。现在有些疑惑点，请教，看您时间。\n\
    \n1. 我把营销框架梳理了一下，干货满满，自己定位从72营销开启。\n2. 目前前3个疑问：\n   - 目前讲恋爱比较多，现在想垂直。现在文案都是您的和中枢群里的人性方面的，人群定位老板、企业家。我讲营销是不是应该把72大营销系列化？把书本上的拍成真人的解说，还是先抄一些人性爆粉文案？目前讲营销的人比较少。老大也讲的少些，我应该如何做好这个关键词，能给点小建议吗？\n\
    \   - 一个号再结合些《老板三法系列》会不会不聚焦呢？\n   - 本人比较笨，如何提升时间效率呢？\n\n读书会我都买了，感觉能受用终生，传承给孩子，再次感恩。\n\
    \n**陈昌文：**\n一辈子讲透彻一本书，讲透彻5个观点，每天直播10小时，日日循环，您自然就能成神。选择好一个点，不断的聚焦，卖读书会，赚钱就行了。\n\
    \n## 38、每天直播 5 到 10 个小时，日日循环\n\n**学员：**\n老大：我是不怕的，我按照最近测试速度，每天为直播间增加 500 粉丝，这个月底直播间总推\
    \ 13000 人，直播稳推 100 ~ 200 人。怎么精准推介是目前需要考虑的。\n\n**陈昌文：**\n每天直播 5 到 10 个小时，日日循环，直播间就能做起来。爆粉\
    \ + 直播模式。不断的研究直播，就起来了。\n\n## 39、在书籍里找 3 大原理、5 大理论，这是您的招牌菜\n\n**内部讲师：**\n各位老师、老板、企业家，早上好！\n\
    请记住，昨天陈老师讲的重点。总之每天都要开直播，能多开，尽量不要少开！每天短视频量要够，每天要不断的努力，提升主播能力。\n\n我们在陈昌文老师带领下，老板社群的每个人都要有定位，成为金字塔顶端的那个人，让自己的团队壮大！快速掀起席卷抖音风暴！别忘记喽，还有微视频也下发，抢先占先机，一起加油！\n\
    \n**陈昌文：**\n每天要直播 5 到 10 小时，早起早睡，锻炼身体，不要熬夜，否则，不能持久战。保护好嗓子。\n\n在书籍里找 3 大原理、5 大理论，这是您的招牌菜，就讲一辈子，不要换，只重复。不要动，乱动会带来收入下滑，享受不了复利效应。就讲好一本书，一个读书会，我们就能万事大吉。\n\
    \n## 40、刚刚直播 4 个小时，出了 50 单\n\n**学员：**\n最后一个地址六套，辛苦老大。\n\n老大，刚刚直播 4 个小时，出了 50 单。今天才讲出来感觉了，真爽啊，我觉得还有余力，以后应该会更多。\n\
    \n真的是要越讲，才会越厉害的呀。感恩老大，这会儿助理在收地址，待会儿给您交单。\n\n**陈昌文：**\n日出 500 单，才能算勉勉强强，都不能算及格，只能算勉勉强强。社群的出单及格标准，是日出一千单。请所有人反复听我讲的几堂高级群关键课程，听好这个，做好笔记，然后去做到日出几百单。也请其他出单少的人，多听晚上的内部课程、下午的内部课程，所有人都要为春节备战。\n\
    \n## 41、我自己、我自己的家庭，都改变了很多很多\n\n**学员：**\n老师，太佩服你了。跟陈老师学习以后，对于我自己、我自己的家庭，都改变了很多很多。我老公一年到头不着家，我性格比较要强，每遇到事情都硬碰硬，每个月都要吵上一架，就是没事找事的那种。\n\
    \n当他第一次知道我在直播的时候，说回来要摔我的手机，还说这么大了年龄了，好好带孩子，正事不干。我们大吵一架，我说我哪里年龄就大了，才 40 岁。我就用咱们《恋爱宝典》中的方法，去经营自己的婚姻。\n\
    \n现在我直播的时候，我老公会给我点赞，给我刷礼物，还会给我倒水，送过来。他做饭很好吃，以前他做饭，必须我打下手，必须我洗碗。现在家里的一切都不用我来做。每次吃完饭，我要洗碗的时候，他说你去歇着，睡一会儿，我来洗。\n\
    \n我的家庭越来越幸福，这些改变，都要感恩我的引路人老师，感恩陈昌文老师。陈老师，我一辈子跟随您，您就是照亮我人生路上的那盏明灯，再次感恩陈昌文老师！\n\n\
    **陈昌文：**\n加油，努力前进。\n\n## 42、做家庭幸福的女人\n\n**讲师：**\n我也告诉我的学员们，努力。现在我的姐姐、妹妹也都成了我们读书会的学员。我希望他们也有一个幸福的家庭，不要做女强人，一定要跟着老师做强女人。\n\
    \n**陈昌文：**\n做家庭幸福的女人。\n\n## 后记\n\n我们的宴席从未散过，只是这一本书您合上了，或许偶尔还会重温，或者我们将要开启下一本书籍，下一个人生的课题。\n\
    \n感恩有缘人！\n\n感恩陈昌文老板社群里所有的先进个人士！\n\n感恩陈昌文老板读书会的每一位读者！\n\n感恩遇见！\n\n感恩一路陪伴，一路成长！\n\
    \n余生，我们继续……\n\n陈昌文\n"
