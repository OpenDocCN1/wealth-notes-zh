    卖读书会也是同样的道理，一定要告诉粉丝，哪天的公开课，陈老师讲了一个什么概念，我们群里的哪个老师讲了一个什么概念，这个很重要。我们的名气是很大的，不是一点点大，只是你们不会用，而且我们的品牌，它也有一定的势能。我们的品牌陈尤文读书会、陈尤文老板社群，这个存在了6年了，它的势能是相当大的，就是你们不会用。


