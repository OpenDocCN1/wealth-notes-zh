    ## 10、定位个人品牌的卖点、客户的痛点，这就是客户付款的理由


    想要打造自己的个人品牌，首先要确定自己的卖点，然后要确定自己卖给谁，这两个问题搞清楚了，且精准定位了，你的个人品牌自然就跑出来了。搞个人品牌营销，要把自己当产品来经营。你的卖点是什么？你给客户什么实惠？你对市场有哪些技术支持？把这些罗列出来，这就是客户的付款理由。


    也就是你这个个人品牌，跟某一类人相关，而且很重要。然后，你做的个人品牌越响，知道你的人越多，则他们自然就买单了。而如果你做个人品牌，一开始没想明白这个问题，就有可能赔本赚吆喝。


    搞个人品牌一定要非常简单的找到这个人的特征，这个人的擅长点，然后多余的必须要删除，这样传播成本低，容易走红，容易让人记住。所以要做个人品牌，一定要提炼出这个人身上最简单、最擅长的卖点。然后根据这个卖点来策划一个个人品牌。一定要定位清晰，也就是你知道你喜欢什么，擅长什么，什么有市场。如果你打造你的个人品牌不够愉快，你迟早会放弃，所以，个人品牌在考虑商业利益的同时，要兼顾自己的兴趣点。只在自己喜欢的领域、擅长的领域建立自己的个人品牌，这样，你才能玩一辈子。


    打造个人品牌的第一步，编辑好自己的特长，自己有什么成就，自己的专业是什么，这个叫做制定一个框架。打造个人品牌，要有一个具体的头衔，名正言顺。比如你是什么什么创始人，你是什么什么传人。也就是第一步，你必须亮身份，没有客户喜欢跟身份不明的人交易。然后，你以后的故事、服务、文章、视频，都是围绕你的特长，你的专业来打造的。这样，你的个人品牌就会越来越强大，变现能力就会越来越强。


    个人品牌应该建立在客户真正的痛点上，也就是这个痛点非解决不可，而不是可以拖下去、等下去。可以拖下去、等下去的痛点，客户就不付费，你就饿死了。能解决客户的痛中之痛，然后再配合你的营销功力，则你的生意就会风生水起。打造个人品牌前，先找到这个痛中之痛的点，非常关键。人们不关心你是不是要改变世界，人们只会为了自己的切肤之痛而买单，所以，你的服务、产品、个人品牌，必须建立在人们的切肤之痛上。


    打造个人品牌的目的，就是解决客户的痛点，让客户一痛苦就想起你，然后就来给你付费要服务，要产品了。如果领悟不了这个点，这个个人品牌的价值有限，甚至不成立。


    你必须围绕客户的需求来打造自己的个人品牌，也就是你提供的服务、产品，必须是能满足客户需求的，否则，你的个人品牌毫无意义。你告诉客户你是做啥的？客户刚好有这个痛点，你的个人品牌才能做起来。


    如果你不知道你的精准客户是哪个群体，则你很难打造自己的营销系统、个人品牌。


    打造个人品牌的第一招就是精准定位，很多人一辈子没出息，就是定位太多、太乱、太复杂，找不到自己的卖点。一个人要是找到了自己的卖点，什么都好办了。天天卖这个，而且卖一辈子。所以打造个人品牌的第一招，就是定位，你必须定位你这一辈子要干啥，用哪个卖点过生活。能与自己的兴趣结合是最好的，这样，你能长久的干下去。兴趣驱动是持久经营的核心，只为了经济利益，可能没利益了，你就不干了，而有兴趣，你就会一直干。找对了卖点，然后就针对这个卖点、这个行业塑造自己的个人品牌。最终成为这个行业、这个卖点的意见领袖，则主动找你的人以及资源就会很多，你就非常容易做成交了。


    ## 11、个人品牌涵盖的范围越小，越有价值


    个人品牌会非常值钱，但一个人只能打造一个个人品牌，不能打造多个个人品牌，一个人有多个个人品牌，那么他的品牌就不值钱了。如果个人品牌的标签多了，你将会没有品牌，打造不起来自己的品牌。一个人只有一个个人品牌，那么，这个人就会非常值钱，打造个人品牌切记贪心，只做一个垂直细分领域的龙头老大，你的机会就会自动找上门，到处都会有人主动找你买单。


    想要打造自己个人品牌的影响力，最好有一个爆款，也就是你在某个点上，超越了所有人，所有人都认为你在这方面是权威，或者第一，这就是你的江湖地位。人要的其实不是全面发展，而是专精一点，且把这一点做到极致，超越所有人，你就有了影响力，就有了江湖地位。


    打造个人品牌，开始了就不能结束，也就是你选好了一个方向，你就只能发表这个方向专业性的东西，否则，你会把自己弄的糊里糊涂的，也会把客户弄的糊里糊涂的。大家不知道你是干什么的，你就没有商业价值了。


    想要打造个人品牌，你必须成为一个领域的专家，你在这个领域的这个点上说一不二，具有权威性，这是你个人品牌构建的重要一环，然后你还要天天宣传你在这个领域的权威性。你宣传久了，知道你的粉丝越多，这个领域被你卡位过后，其他人就进不来了，直到整个领域与你的个人品牌划等号，你就会取得巨大的成功。


    建立个人品牌的重要元素，就是你是不是某一方面的专家。当你做到垂直细分化第一名的时候，你就会获得巨大的财富、巨大的市场份额，而且会有很多人慕名而来。个人品牌的形成在于不断的重复，坚持在一个领域深耕，最终做成为这个领域的垂直细分第一名，如此，这个领域的所有资源都会向这个第一名靠近。这个第一名就会获得巨大的成功。成为垂直细分化第一名，是建立品牌的关键。


    打造个人品牌，一定要对准受众，你要不断的呼唤你的受众的名字，不断的为你的受众输出文案、视频、直播。个人品牌是针对少数买单客户的，而不是针对多数人的。个人品牌涵盖的范围越小，越有价值，涵盖的范围越大，越难实现商业变现。只做最简单的事情，才能形成品牌。


    打造个人品牌的时候，要考虑你的受众的购买力，如果你的受众粉丝没有购买力，你这个个人品牌就毫无价值，所以，锁定高端客户，是聪明人的做法。要做高价格营销，要做高端客户。高价格、高端客户，才容易形成良好的口碑，形成良好的个人品牌。低端市场，很难形成良好的口碑，就很难有好的个人品牌，这是一个现实问题，不要情绪化。


    要卖高价，只有高价能树立个人品牌，能接触到好的客户。要培养人付高价。人的精力是有限的，应该接触一些高端客户。客户并不怕贵，怕贵的客户我们也懒得搭理，客户怕的是买的不对。只要对，只要爽，客户愿意付高价。个人品牌的作用，就是卖高价，而不是卖低价。低价就不是个人品牌。打造个人品牌为的就是溢价。


    ## 12、打造个人品牌，要有一个品牌文化


    打造个人品牌，要有一个品牌文化，比如我就喜欢讲儒家思想，这就是我们陈昌文读书会和老板社群的品牌文化。有品牌文化的个人品牌会显得非常高大上，也会给你的服务与产品带来溢价。想要搞好自己的个人品牌，一定要宣传一种文化，而我就是宣传儒家思想。有了文化，然后结合自己的业务，就可以打造强有力的个人品牌。我的个人品牌文化是儒家思想，个人品牌项目是陈昌文读书会和老板社群。想要自己的个人品牌传达多远，就让自己宣传的文化传达多远。


    想要做好自己的个人品牌，一定要找到一个历史原型，人类生活中的原型，比如，当代子贡、当代张良、当代诗仙。这样，有了历史文化原型，能让人更容易记住，也更容易传播，且容易商业化，个人品牌附加上历史文化原型会让你的个人品牌如虎添翼。


