    抖音上那么多知识主播、所谓大咖，没几个人能干过我们，知道为什么吗？因为他们一开始，就是一个人在战斗，他们注定不行，而我们要一开始，就是人海战术，就是蚂蚁战术，我们注定胜利。只是，人海战术、蚂蚁战术，需要各位有格局，真爱社群。爱社群，社群自然会有力量反馈于你。


    真正的营销，是几百人、几千人共同发起的蚂蚁战术矩阵营销、人海战术矩阵营销，按照这个方法，做陈昌文读书会、陈昌文老板社群的营销，大家的利润就可观了。


    希望你们不断的修炼、提升自己，好好利用社群的力量加持自己，也让自己的力量加持社群，这样，群体与个人都得到良好的发展。


    ## 4、社群的营销，必须是团队规模化完成的


    营销一定是矩阵完成的，是所有人、所有工具、所有媒介一起完成的。


    > 社群的营销，必须是团队规模化完成的。


    首先，社群里有讲师团，讲师团里面必须都是彻底正能量、人品好、道德好的人在一起，有业绩、相互团结帮助的人。


    其次，这些人，还能帮助更多有能量的人，为社群发展做贡献。讲师团的正能量人士相互监督，为社群出谋划策。


    讲师团人数必须多，也就是数量必须起来，人才才会出来。这些人才出来后，不断的培养，这些人辐射在抖音，以及内部课程、读书会里，不断的正风气。媒体的矩阵，是微博、微信、短视频平台的相互矩阵。所有地方都在宣传陈昌文老板社群、陈昌文读书会，是按照这个结构去做的。


    整个社群讲师在内部、外部讲课，永远都在挖掘人才，永远都在组成正能量的团队，永远都在组成心性够的人的团队。人才多了，自然形成矩阵。


    **营销永远不是一个人完成的，也不是一个媒体完成的，是由所有人共同矩阵完成的。做社群，唯一要干的，就是人才梯队的建设。每一个老师、每一个正能量的人，都在呕心沥血的为社群培养人才，吸收人才，提拔人才，匡正人才。嫉贤妒能、打压人才的一切人，都是社群的敌人，无论这个人业绩多好，表面说的多好。只要这个人嫉贤妒能、打压人才，就是社群的敌人。**


    ## 5、格局影响发展，不让别人过活、生存的后果，就是自己也没什么饭吃


    所有人，都必须跟着做矩阵，做陈昌文老板社群的矩阵，做儒家思想、陈昌文方法的矩阵。全面干货化、系列化的做名气、品牌，跟着做整体社群的名气、品牌，这是所有人的事情。


    我们只服务老板、美女老板、富人，这是我们的基调。但是我们的内容，可以免费给那些没有钱的人学习，我们并不收他们钱，不让他们加入内部。


    所有人都要注册公司，建立官方账号，进行营销，进行素材上传。所有人，都要用自己的身份证注册很多个手机号，电信、联通、移动，各种账号。并且发动自己的亲人注册抖音，然后买十几部手机，不断的上传视频。视频内容，都是陈昌文老板社群的儒家思想
    + 陈昌文方法。通过品牌化、矩阵化，大量的传播。然后，把这些流量导入到微信，进行朋友圈营销。


    视频、品牌、名气，从商业上讲，比直播更重要。一些并没有我们社群内容好的人，他们仅仅是靠矩阵，做出名气、品牌，就在市场上做的不错了。我们社群的内容好，我们要传播给十亿人，我们就要干这件事。必须有矩阵思维，如果想跟我玩一辈子儒家思想、陈昌文方法，玩社群营销，要领悟我说了什么，并且去执行。后面我们还要卖读书会，通过视频、直播卖读书会，流量导入到朋友圈卖读书会，这样，我们的传播会更广，更赚钱。


    要竭尽全力宣传我们的社群，宣传儒家思想，我们这个事情会做得非常大。只要我们为带去的贡献足够大，各位的经济利益诉求都会得到满足。前提是你们真正听话、照做、执行，努力过。


    你们每个人做的流量都会到你们自己的微信，所以我们有些人总是干涉别人做流量，做视频，做直播，这其实是错误的。每个人做好自己的事情，不要去干涉任何人。但是记住，不要收低层次人的钱财，不要与任何人有矛盾。我希望更高级的人跟着我做事，我并不喜欢低级的、小肚鸡肠的人跟着我做事，有什么关系。


    社群做大了，会有各种各样的人。有的人比较坏，人品不好，所以我们要收美女老板、富人、有财富的人，这些人聪明，有能耐，知道感恩，知道什么应该做，什么不应该做。这些人成为我们的合作者，我们才能做得更好。


    社群的发展，是一个强强联合的过程，更多的强者与我们一起做，我们才能做得更好。


    所有人，都要跟着拼命的宣传我们社群，不断的宣传，矩阵宣传，这样我们社群的名声越来越大，品牌越来越响，各位在这个社群里的利益就会越来越多。矩阵宣传其实是一个个体的事情，你们自己做就行。因为你的利润，都在你自己手里，你并非只为社群做了贡献。


    格局问题，我们社群因为有些人没格局，限制了社群的发展。我希望各位的格局要变大，用更大的格局看待我们的合作伙伴、我们的朋友、我们的学员、我们的讲师。让每个人都因为我们社群而获益。


    从道德、法律上防止大家作恶，从自愿申请书上防止大家作恶。其他的，真的无所谓。格局影响发展，不让别人过活、生存的后果，就是自己也没什么饭吃。这本质上是个相辅相成的过程。参与到矩阵营销中的人，更要理解格局的重要性。


    很多人没有发展，就是格局出了问题。格局小的人没流量，没成交，也让人讨厌，让人远离。


    ## 6、我们要做的是群策群力、相互帮助式的营销


    社群的营销，永远是通过矩阵完成的。团队矩阵，就是讲师要多。内部讲师、外部讲师都要多，相互监督，相互肯定，相互影响，相互营销。这种信任度不断的增加，说不清楚就在哪里成交了。


    账号矩阵，账号一定要多，多发内容，扩散影响力，吸引流量到微信，在朋友圈成交。每天矩阵，抖音、微博、朋友圈，全面对接，发内容，发文字，客户在每个地方都能看见你。


    书籍矩阵，多发售读书会，书到了客户家里，客户看书就能永远记住你，想起你。社群矩阵，多个读书会+陈昌文老板社群，全面矩阵，如此，客户永远都在我们的群里。按照如此模式彻底矩阵，客户的精神、时间，都沐浴在我们的营销环境中，自然就被营销了。


    营销永远是大家相互支撑，相互帮助完成的，现在社群的营销是如此的。陈昌文读书会的营销，用品牌营销。读书会，是我在群里，是我的名字，我是群主，这样大家的信任背书更强大，流量变现能力更强。进了读书会，我们会组织讲课，就根据书本来讲，然后筛选有钱的、厉害的企业家、美女老板，进入陈昌文老板社群，有这样一个自然而然的后端营销。


    所有的利润，都尽可能鼓励去领路人那里买单。这是所有人必须要做到的事情，也是社群的宣传导向。我们要做的是，让更多的人，聚焦在抖音上做流量，做变现。我们要做的是群策群力，相互帮助式的营销。


    ## 7、企业做短视频营销的秘密，矩阵式扩散


    只要粉丝量、传播力、影响力、品牌口碑没有爆破，就是错的。这个东西起来了，从账号倒流到微信朋友圈，这个才是对的，其他的都不对。有了外围扩散，才有精准变现。这是一个生态，每个都要为矩阵爆粉而努力。外围爆粉+精准变现，都要做，都要做深、做透彻。用品牌口碑变现，用影响力变现，是我们的终极目的。


    我们永远在指导大家不断的搞流量、变现，永远在搞品牌营销。记住，我们社群是搞品牌口碑营销的。第一，锻炼身体。第二，不断的搞流量、变现。健康与钱，是我们社群的主要任务。


    不断的搞流量，搞变现，日日循环品牌口碑，《陈昌文方法之恋爱宝典》《陈昌文方法 72 大营销系统》《陈昌文解读〈论语〉》《陈昌文方法 1000 问》。日日循环这几本书的读书会，品牌口碑名字，这个是最赚钱的模式，没有之一。谁循环好这个，谁的收入就会突飞猛进。


    得不断的督促大家搞流量，搞变现，不断的在直播间弄口碑品牌，这样循环收单。直播的目的是收单子，是循环口碑品牌。品牌口碑不断的循环，客户自动下单，而在直播间吹牛，一点意义都没有。不断的循环，不断的循环口碑品牌，口碑品牌循环起来，赚钱速度就会极其快。


    我们的重点，是做品牌口碑。陈昌文读书会，要搞到几百万人；陈昌文老板社群，随时随地收单；所有人，都要爆粉+变现。我要干的，就是找到更聪明的方法，带着大家收单子。我要找的是更厉害的品牌营销方法，带着大家打造陈昌文读书会、陈昌文老板社群，不断的收单子。每天带着大家提升收入，收更多的单子，是我的基本任务。


    要想尽办法把收入拉升起来，收入比什么都重要。你必须得有利润，必须得有流量，然后不断的搞品牌营销。注意，是品牌口碑营销，时时刻刻记住，我们是搞品牌影响力的，搞品牌口碑营销的。影响力带来收益，有意义的品牌影响力、品牌营销，带来最大的收益。流量+品牌营销+读书会+陈昌文老板社群的模式。这个带来的收益最大，这种营销模式最具有杀伤力。


    人穷了，思维就穷，就是倒霉的思维。人只有赚钱了，才能平淡看待几十万、几百万，也就是无所谓的感觉。所以，我们必须不断的搞流量，收单子。我每天研究的，就是搞流量，收单子。


    如果连不断的搞流量、收单子都理解不了，这个人的赚钱之路就非常悲惨了。搞品牌营销，搞矩阵流量，这是每个兄弟姐妹分分夺秒要干的。赚钱是分分夺秒的干流量，干视频，几十个卫星账号，一个主账号，采取这个模式，跟着搞社群营销，才能变成神仙。


    自己搞矩阵账号，如果有财力，助理也跟着搞矩阵，最后玩一个主账号直播，朋友圈变现，日日生。把我教给你们的系统，进行组织管理化，最后跟社群合作，赚钱。这个才是最吊炸天的模式。


    赚钱，就是卖读书会，卖社群，卖儒家思想，卖陈昌文方法。没有矩阵流量，怎么会有人听课，有人付费？


    矩阵式扩散系统。


    - 第一，要玩好短视频营销，其实是靠矩阵式扩散的。

    - 第二，也就是你有十个号，甚至几百个号。如此，你的信息就扩散了。

    - 第三，所有短视频平台上最强大的网红，都是靠矩阵式扩散。这是企业做短视频营销的秘密。


    每个老师，都要学会扩散自己的信息。方方面面的去扩散，通过微博、微信、抖音去扩散。矩阵式扩散系统，社群的外部讲师矩阵＋内部讲师矩阵＋读书会矩阵、书籍矩阵，以及抖音账号各种矩阵＋微博矩阵，整个矩阵体系会让我们变得非常强大。


    请各位珍惜，宣传这个矩阵影响力，这是品牌矩阵影响力营销系统，它的强大是你不可想象的。按照这个社群战略蓝图来宣传社群，这对你们出单非常有好处，非常厉害。


    ## 8、势单力薄的营销没有意义，必须全网矩阵


    社群只死磕读书会矩阵＋陈昌文老板社群＋抖音，微博矩阵＋书籍营销系统矩阵。这个矩阵系统下来，是非常有影响力的、有道格的。我们社群的任何人，被封号了，只要他稍微有能力，我们能立刻给他传播开，他不会死掉。


    矩阵力量 + 团队力量，才是真正的力量。而我们社群现阶段，是专业运营品牌影响力的社群，这就是非常夸张的了。所以，现在的变现模式，是矩阵品牌影响力阶段变现。


    社群要生存，要发展，必须是所有人联合起来做流量，做变现。必须是所有人都厉害，都学会了搞抖音视频、音频、直播、流量、变现。


    我们社群的每个讲师，都要利用社群、微博，玩品牌营销、口碑营销、影响力营销。要利用书籍矩阵，以及厉害的讲师玩矩阵营销。文化营销，就是《陈昌文解读〈论语〉》，只要你们日日循环这个，社群就会变得更强悍大。


    势单力薄的营销没有意义，必须全网矩阵。目前，影响力口碑品牌营销矩阵才是最厉害的，还有我的文章矩阵。这就是让你出单赚钱的利器，我个人当然也在帮助大家疯狂营销。


    社群现在变得越来更加强大，是因为有更多优秀的人起来了。我们要培养这些新人，做读书会 + 陈昌文老板社群。我们要搞的永远是品牌营销、品牌影响力营销、口碑营销，所有人按照这个模式做，证明我们的品牌影响力，收单干。


    ## 9、利润是第一生产力，然后矩阵才能组成


    所有人都必须是正能量的人。首先，做社群，就必须是正心正念、有道德素质的人。如果这个社群里有很多坏人，则矩阵就没办法做了，一定会坏事。


    维护社群的纪律、名誉，以及社群的营销、价值，以及价值观的传递，这都需要很多人，需要彻底正的人，去组成团队传播。在传播的过程中，还有利润收入，才是对的。如果在传播的过程中，没有利润，这个生意就不好做。所以，所有的地方，都必须要有利润。


    所有矩阵参与人员，都必须会营销，也就是永远要有定位，比如美女老板、美女企业家，永远要有营销。不产生利润的事情，做不好，也没有未来。讲师团，必须有利润。所有人带的团队，都必须有利润。没有利润，这个矩阵就没有势能，建立不起来。


    所以，利润是第一生产力，然后矩阵才能组成。每个老师，都要有运营社群矩阵的能力。没有这个能力，运营粉丝就很难。每一个人发布的任何一个文案、视频、直播、群里的信息，都必须有价值。有价值观，还有营销信息，这样，铁粉群体才会形成，最终矩阵才会壮大。


    微博、微信、抖音，矩阵式传播。抖音是中心，微信、微博辅助，微博排到最后，这是一个传播法则，也是以后的代理法则、打造企业的法则。


    残酷的战斗是由人多干人少。矩阵的本质就是人多。自己死了，敌人就啃食我们的尸体、精力、灵魂。啃食尸体，在战争中，包括精神、物质、财富，甚至基因。从古至今，都是如此残酷，大自然就是一张餐桌。


    如何获得胜利？如何才能获得更高的收入呢？品牌、管理、营销企业家，矩阵、趋势。


    矩阵、管理、营销，是现代企业家必须学会的模式。


    我只关注近悦远来，后面就是集团矩阵、企业家矩阵，彻底矩阵化、集团化、团队化。


    金钱与矩阵思维，能解决很多问题。我的一切思维，都是矩阵思维，全部采取矩阵思维。其他一切外包。思想、思维决定收入，其他的都是没有意义的。

    '
