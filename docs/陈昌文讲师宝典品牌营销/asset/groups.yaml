    你们做主播，主播是有一种情感链接的，我们卖的就是唯一，就是特殊。我们讲一年的公开课，讲 365 天的内部课，我们是卖圈子的。你够格不够格？


    没有人买你的产品，一定是你的思维方式出了错，一定是你讲直播的方式出了错。视频没有爆，一定是你做视频的方式出了错。直播没有人，一定是你做直播的方式出了错。每天赚不到几万块，一定是你赚钱的方式出了错。一定是你的错。我们错了，所以我们不赚钱；我们对，才赚钱。


    你首先得让粉丝知道你是干啥的，你就是卖读书会的。厚颜无耻地告诉他们，我就是卖读书会的。你不要害羞。咱就是来赚钱的。你觉得我说的对，你就给钱，你不差钱就给钱，咱就是来赚钱的。赚钱不可耻。


    这个粉丝说，哎呀，你不就是想卖读书会嘛。对，我就是来赚钱的，我不赚钱才可耻，赚钱不可耻。我不赚钱我干啥？我不赚钱我去打游戏。我不赚钱我跑这来干啥？对不对？我就是来卖读书会的，我就是厚颜无耻来赚钱的。拿着书，讲书，拿着书见。


    最大的红利是智慧的红利。思维的红利，绝对不是不赚钱。钱多得不得了。没有收入是因为你智商低，思维不行。大家都是两只手、一个脑袋，为什么有些人赚钱？都是拿一个手机做直播，为什么你收入低？


    同样一天直播，有人出了八九十单、一百单，你出了五单，你出了十单，有些人一单都没有。同样一个月，有人赚了四、五十万，赚了一百万，有些人赚了五万，有些人是倒贴。怪谁呢？


    ## 6、凡专精于一艺，必有动人处


    关于干货，粉丝都要听干货。你说我讲的就是干货，你们听好了，我只讲干货。一定要多提产品的名字，不要被粉丝带偏，三句话不离本行。做好潜营销、品牌营销、链接式营销，只讲跟我们产品有关的事情。粉丝提什么问题，都讲我们的产品。这就是干货。


    什么叫干货？我强调这是干货，它就是干货。词语是操控人的头脑的，人的头脑是被词语操控的。人其实对啥东西都不知道，粉丝要什么，你就用什么词语。


    按照我这个营销模式去做，每天做六个小时直播，每天想办法抄袭、复制、爆粉。一切都是抄来的，营销的方式方法、思维模式，都是抄陈昌文的，爆粉也是抄陈昌文的。


    你抄陈昌文的一些文案就能爆粉。一切都是抄袭，不需要动脑的，就是抄袭、收钱，抄袭、收钱，抄袭、收钱。粉丝是抄的，七八十万粉丝都是抄来的，直播间几千人也是抄来的，讲课的方式也是抄来的，就是抄袭，扔出去。你看我们的赚钱方法简单吧，就这么简单，你也学不会，扎心不扎心？都是抄的，你也学不会。


    我们的案例摆在直播间，你也学不会。我们的案例、我们群里的案例，是不是摆在抖音账号上？摆在直播间？你咋不学习呢？


    **凡专精于一艺，必有动人处。** 庖丁解牛，卖油翁，什么意思？就是你要做好直播，你要做好抖音，你所有的精力都要投进来。若要生富贵，须下死功夫。稻盛和夫，他把所有的精力都投入到陶瓷。他创办了京瓷公司，世界五百强。没有捷径可走。


    卖好这个油，他要卖油，卖豆腐，又卖香蕉，又卖苹果，这个公司他练不成。他要卖香蕉，卖苹果，卖梨子，卖馒头，卖烧烤，卖火锅，啥都卖。他这个公司，他这个功夫练不成，他练不成庖丁解牛。


    想要日收入五万、十万，你必须放弃其他的事情，全身心地投入到这件事情上，非把它做好不可，非把视频和直播做好不可。


    你这一辈子就把这件事情做好，其他事情别做。不要炒菜，让保姆去做。要拖地，让保姆去做，其他的事情出个两三千钱，让别人去做。不是这个专精的事情，全部外包。我们不干那个，我们就是开直播，收单；做视频，收单。除非这件事情是万不得已，非要你去做，否则花个几千块钱让其他人去干。


    你的一切精力就是做好抖音，做好直播，做好视频，收单子。不要搞其他的。如果你想有成就，你就把所有精力集中到一点。如果你不想有成就，那无所谓了。


    绝利一源，用师十倍。古代的那些大禅师故意把自己的眼睛刺瞎，就是他弹琴，他把眼睛用烟熏瞎，这眼睛瞎了过后，人对音乐就能够更敏感，听得更专注，他就可以成为一个弹琴的高手。


