    # 不斷盈利能力


    讀者或許會嘲笑這樣的題目，炒股如果不是為了盈利，炒股幹什麼？難道吃饱了撐著不成？但你注意到「盈利」二字前是什麼？是「不斷」。在股票市場偶爾賺點錢不難，只要你運氣好就可以了。難的是「不斷」二字。有多少次你聽到朋友說：「我今年不錯，股票大市跌了二〇％，我只虧一〇％，我戰勝了股市！」真的嗎？任何專業的炒手，唯一該問的問題應該是：我今年掙了多少？有誰聽說服裝店老闆說自己比隔壁店少虧錢而洋洋得意的嗎？但我常聽到炒股的人居然會為了虧錢而自豪！


    其實，這就是炒股艱難的地方。看不見、摸不著的股票讓一般人的判斷力走了樣。要想在股市不斷賺錢，除了知識和經驗之外就是「忍耐」，等待賺錢的時機。問問一般的股民，他們入市資金有多少買了股票？有多少是現金？你會很驚奇地發現，一般股民幾乎把入市資金全部買了股票。不管是牛市還是熊市時，他們都是這樣的。


    這些人有一個共同的想法：「我的錢是用來賺錢的。」讀者們若有機會到賭場看看，就會明白白股民們為什麼會這樣做。賭客們站在賭桌旁，一注都不肯放過，生怕下一手就是自己贏錢的機會。直到輸完才會收手。你要明白一點：股市有時完全無序，你根本不知股票下一步會如何運動。就像你的女朋友生氣時一樣，你不知道她在想什麼？不知道她要幹什麼？這時'
  - '[PAGE 103]


    最佳的方法就是別惹她。同樣的情形發生在股票市場上也是一樣──別碰股票。


    股票大多數時候理性、規律。雖然每檔股票的個性都不一樣，但大同小異，你需要不斷研究、不斷觀察，等經驗累積到一定程度時，就知道如何順勢而行了。等待、忍耐、觀察，只有在股票的運作符合你的入場條件時才入場。唯有如此，你才能够確定入場的獲勝機率大過五○○%。在這基礎上，才有可能不斷盈利。當然，千萬別忘了保本。


    # 賺大錢


    給讀者出一道題：在你面前是兩位炒手的交易記錄。他們去年都翻了一倍，也就是一○○%的報酬率。一位是股市常勝軍，他的交易全部賺錢，有買必賺，雖然每次賺的都不多，但他的交易記錄密密麻麻一大疊，積少成多，他賺了一○○%。另一位似乎運氣不怎麼樣，交易中虧的次數多，賺的次數少。但他虧時虧的錢少，賺時賺的錢多，特別是有檔股票賣出價較買入價升了四倍。算總帳他也賺了一○○%。你如何評價這兩位股票炒手？


    兩人中的一位是運氣很好的新手，另一位可是資深的專業炒手。你現在大抵能夠猜到哪位是哪位？從他們的交易記錄，你體會到什麼了嗎？在現實生活中，專業炒手的記錄幾乎都像上述一樣，他們明白股票買賣不可能每次都正確，那麼爲何要在錯誤的時候付出這麼大的代價？但在他們正確的時候，他們試圖從中得到最大的利潤。可是新手們很少有這麼好的運'
  - '[PAGE 104]


    氣，他們通常把賺錢的股票首先出手，滿足於賺些蠅頭小利，但結果往往是手頭上有一大堆套牢的股票。


    想像你手裡有一萬元，你告訴自己要分散風險，每檔股票只投十分之一，也就是一千元，一年時間下來，五升五跌，五檔股票跌了一〇%，四支升了一〇%，另外一支升了二〇〇%。那麼一年下來，這一萬元變成一萬两千九百元，近三〇〇%的投資報酬率。其中那只升了二〇〇%的股票是成功的決定性因素。


    炒過股的朋友，你碰到過五元的股票升到十五元嗎？這樣的機會多不多？但你抓到過多少？你是不是常常過早離場？讓你過早離場的主要原因有兩個：


    +   一、人好貪小便宜；


    +   二、不夠經驗判斷股票運動是否正常。


    貪小便宜總令人感到愉快，因此每次賣掉賺錢的股票時你都覺得自己是炒股天才，想上餐廳慶賀一番。你總是試圖重複這類愉快的經歷。所以我們看到新手賺錢時通常只賺小錢。


    話說回來，如果你知道五元的股票會升到十五元，你也絕不會提早離場的。問題是你不能確定。這便涉及股票運動是否正常的判定問題。具體的請參考第二章第二節「技術分析的'
  - '[PAGE 105]


    基本知識"中談論股票的正常運動與週期性運動一段。在這裡我要強調的是：只要股票運動正常，就必須按兵不動。炒股高手傑西·李佛摩特別指明，他炒股的祕訣並非是如何思考，而是他在買對股票的時候能按兵不動。


    這是很難的一件事，你要克服脫手獲利的衝動。


    另一點要強調的是：如果你確定股票運動正常，你的勝算很大，這時你應該在這檔股票上適當地加大下注比重。如果致勝機率是六○%，你下一○%的注，但經驗告訴你這次的致勝機率是八○%，你就應加注。從一○%提高到三○%甚至五○%，直覺上你能明白爲什麼應該這樣做。具體如何下注的藝術請參考下面「如何在股市下注？下多少注？」一節。


    # 第二節 如何在股市下注？下多少注？


    敗而不倒，這是做生意的最基本法則。朋友，你將省吃儉用省下的血汗錢投入股市，買了某公司的股票，成爲那家公司的股東，你就是在投資生意。你把錢投資在股票上和投資住家隔壁的小吃店本質上完全相同，差別就在於那家公司的股票公開掛牌上市了，你家隔壁小吃店的股票未曾上市。如果小吃店的老闆請你投資，你會如何思考？你正面臨了「投不投'
