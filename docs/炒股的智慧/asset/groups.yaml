    ## 第二節 技術分析的基本知識


    簡單地說，技術分析就是看圖。


    技術分析探討股票價格、交易量和時間的相互關係，以此判定股票下一步運動的可能方向。技術分析的目的是確定股票的走勢以及走勢的轉變。炒手們根據技術分析提供的信號，買進賣出以賺取差價。


    由於人性相近，在相同的外部條件下，人們通常有相近的反應。這一切都會在圖中表現出來。炒手們可以通過研究過去股價運動的規律來推測未來的走向。技術分析的心理基礎是建立在「人性相近」這一假設之上。這個假設成立，但並不完美。人是極其複雜的，股價變動雖然反映了投資大衆集體思想和行動的結果，但它不可能完全地重複。


    所以說炒股是門藝術，不是科學。但只要這種集體行動的結果有類似的特點，抓住這個特點，炒手們就有可能擁有在股市上超過五○％的獲勝機率。


    還有，技術分析其實在分析「錢」的走向。股票的運動圖像可以說是錢推出來的。英文有句話叫「錢不撒謊！」（Money does not lie.）。股市充滿各種各樣的利益集團，有持股的，有賣空的；某公司還可能正在檯底交易！一般股民根本沒有能力判斷這些不同利益集團散佈的消息是真是假；證券行的股票分析報告也屬於這類消息的一部分。


    大家讀新聞或聽股市名嘴推薦時所以別全信，要留個心眼。但錢不撒謊！股票升一定是買股的多過賣股的，反過來股票一定跌。


    不管別人嘴上說什麼，要仔細觀察錢如何走！名嘴們可以在股價高位忽悠大家買股自己賣，這會在技術圖形上顯現出來。


    ### 常用圖形介紹


    技術分析在華爾街已發展成一個體系，有關技術分析的書常有五、六百頁之厚。就我個人這麼多年的炒股經驗，覺得這些書的內容多在鑽牛角尖，爲了分析而分析。我在這裡將我在實際操作中證明最爲有用的概念寫出來給大家分享。這些圖和分析都很簡單，但我每天都在用，它是我用來判斷股票運動是否正常的指標。


    ### 一、股票的走勢及走勢線


    圖 2-1 是典型的升勢圖，將波浪的低點相連，即成升勢線。在升勢圖中，請注意交易量的變化。在上升階段，交易量增加，下調階段，交易量減少。每個波動的最高點較上個波動為高，最低點也較上一最低點為高。


    圖 2-2 是典型的跌勢圖。將波浪的高點相連，便成跌勢線。在跌勢時，交易量沒有特別之處，但跌波的每個波峰較上一波峰為低，波谷也較上一波谷為低。


    圖 2-3 是無勢圖，你根本就不知道這檔股票的大方向是什麼。交易量也沒有特色。一支無勢的股票通常不適合炒作。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_65_0.png)


    ![](img/af3de47fcb4db801f9d008fb55b44d63_65_1.png)


    心理分析：有人問一位投資專家：

    「股價為什麼會升？」他想了想會兒說：

    「因為買者多過賣者。」現在大家明白了，股票升的原因不是低的本益比，也不是高的紅利或是其他冠冕堂皇的理由，而只是因為買者多過賣者。雖然本益比或紅利都會影響投資者買賣的決定，但它只代表了過去。影響投資者決定的最重要因素是對未來的預期。一支本益比很高的股票，表示這家公司過去沒賺什麼錢，但不表示它未來也不賺錢。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_66_0.png)


    以升勢為例，升勢開始時一定是買主多過賣主，因為在無勢時，買賣的力量基本均衡。一下子多出了買主，在交易量上的表現就是交易增多。隨著股價的升高，第一波買主入了場，這時有人在紙面上開始有收益，他們開始獲利賣股，我們在圖上就看到回檔。這時的賣主總的來說並不多，我們會看到交易量減少。否則這便是不正常的升勢。如果股票確實有吸力，例如成功開發新產品，第二波買主便會進場，重複第一波的過程。


    在圖形上，我們看到一浪高過一浪，股票總是以波浪形上升。


    股票的運動有點像推石球上山，要往上推，你要很大的力，但石球往下滾，用不著很多力氣。在股票跌勢時，買主消失，不大的賣壓就會使股價往下跌。雖然其間有人撿便宜貨，這種下跌時的反彈是靠不住的。在圖形上是一波低過一波，但交易量並不具備什麼特色。


    無勢圖表示市場對這檔股票沒有什麼看法，它在某一區間漫無目標地遊動。買方和賣方的力量基本平衡。


    你認為什麼因素使投資者入市買股票？華爾街會調查過，吸引一般投資者入市買股票最主要的原因就是——股票在升！你明白嗎？一般投資者入市買股票，大部分的原因不是因為股票的本益比低或紅利高，而是因為股票在升！除了股票在升的理由之外，其他因素都是次要的。這就是為什麼股票一旦開始升勢時，它往上一波高過一波，不會馬上停止。想要培養預測股票運動的能力，你就必須牢牢記住這一點。


    你能猜到為何一般投資人賣股票嗎？讀完上一段落，結論應該很明顯。華爾街調查證實了你的猜測：投資人賣股票的最主要原因是因為股票在跌！而不是因為本益比高和其他原因，這就是為何跌勢一開始，不會馬上停止。現在你能體會到為什麼股票升時常常升得離譜，跌時跌到慘不忍賭的原因了吧？記住股民買賣股票的真正原因，耐心地觀察市場，你很快就會發現股票運動有跡可循。


    ### 二、支撐線和阻力線


    圖 2-4 標注了阻力線和支撐線。當股票在一定的區間波動，把最高點相連便成阻力線，把最低點相連便成支撐線。


    從紙面上解釋，股價升到阻力線時會碰到很大的阻力，不容易繼續升上去，也就出現了很多賣主。而股價跌到支撐線時會發現很多買主，股價不容易跌下去。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_68_0.png)


    圖 2-4


    心理分析：走進交易大廳，你有沒有常常聽到「這檔股票跌到十元我就買進」、「這檔股票升到十五元我就賣出」之類的話？答案是肯定的，因爲這也是我常聽到的。為什麼一般的股民會認爲某檔股票跌到十元就值得吃進，而升到十五元就該脫手呢？


    這也源自我們日常生活的經驗。精明的主婦通常知道某種衣服的最低價是什麼。如果衣服以這個價格出售，大家便紛紛搶購。而衣服牌價升到某個價位就乏人問津了。這可以分別稱爲該件衣服的「阻力價」和「支撐價」。


    在股市上，如果參與交易的多數投資者認爲十元是某股票的低價，一旦股價跌到這個價位，就會有很多人買進，股價自然跌不下去。在圖2-4上可以看到支撐線阻力線的道理相同。


    如果一個款式的衣服在十至十五元之間的價格波動，想像一下服裝商是如何做生意的。當衣服的價格在十元的時候，買主認爲衣服的價錢便宜，入場購貨。但賣主會覺得價錢偏低，再低就不賣了。在十五元時，買主覺得價錢高，不願買，雖然賣主想賣更高的價錢，但沒有買主他無計可施。所以在十元時，因買主多過賣主，價格開始上升，但在十五元時，賣主多過買主，價格只有下降。


    或遲或早，有人會對這個價格區間持有不同看法，認爲衣服的價錢太高或太低。無論是位大戶還是一批小服裝商，他們的行動將使買賣力量失去均衡。如果他們的力量夠大的話，將引起一連串的反應。無論是正在買賣的服裝商還是在外觀望的投機商，他們的行動將會改變在十至十五元的交易區間。


    如果新的均勢有利於買主，這將吸引新的買主入場，帶來新的買壓，而賣主期待更高的價錢，他們的惜售將使買壓進一步減輕。結果是使衣服的價錢高出十五元。隨著價錢的進一步升高，賣出的誘惑力愈來愈大，衣服的價錢會在新的均衡區間搖擺。


    這個過程便是阻力價或支撐價的突破。在股票上，我們便有阻力線和支撐線的突破。需要特別指出的是，阻力線一旦被突破便成了新的支撐線，同樣，支撐線一旦被突破便成了新的阻力線。


    讓我們以支撐線為例：在支撐線附近，足夠的買方出現，賣方消失，股價無法跌破該線。幾個來回之後，市場形成这便是「最低價」的概念。突然間，更大的賣壓出現，股價跌破支撐線，這時認為支撐線就代表「最低價」的買主全部虧錢。其中一部分可能停損拋售，另一部分堅持原來的想法，認為股價很快就會反彈。無論如何，原來市場對該股的「底價」概念已被粉碎，市場「背叛」了他們。


    現在假設股價又升回原來的支撐線，你認為原先的投資人會有什麼反應？那些還未「停損」的人會感謝上帝給他們一個全身而退的機會，股價跌破支撐線的那段虧錢的時光令他們寢食難安，現在終於有了不斷甚至小賺的機會，他們會趕快賣掉股票以結束這場惡夢。


    再看看那些停損出場者，他們原以「底價」入場，結果被燙傷。今天股價又回到這個價位，但燙傷的記憶猶新，他們大多不敢在這個價位重新入場。我們看到賣壓增加，買方力量卻減少。所以支撐線一旦跌破便成了新的阻力線。


    阻力線一旦被突破便成支撐線的道理相近，讀者可以自己思考一下其中的緣由機理。


    ### 三、雙肩圖和頭肩圖


    圖 2-5 是典型的雙肩圖，圖 2-6 是典型的頭肩圖。這都是炒股中常見的圖形。


    心理分析：以雙肩圖為例。它的典型特點就是兩個高點。要提醒讀者，這兩個高點的選擇和時間的跨度相關，很明顯，一天的高點和一年的高點是完全不一樣的。但它們的解釋相同。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_71_0.png)


    ![](img/af3de47fcb4db801f9d008fb55b44d63_71_1.png)


    ![](img/af3de47fcb4db801f9d008fb55b44d63_72_0.png)


    ![](img/af3de47fcb4db801f9d008fb55b44d63_72_1.png)


    隨著價錢的升高，買主們開始懷疑價錢是否能超過原來的最高點？賣主也在觀察這個最高點是否還像上次一樣會帶來賣壓，使價格的升勢受到挫折。簡單地說，市場參與者在觀察這次會不會有和上次同樣的經歷。上次價格升到這點引發賣力的逆轉，這次會發生同樣的事情嗎？


    結果只有兩個：穿越上次的最高點和不能穿越上次的最高點。在雙肩圖中，因爲無法穿越上次的最高點，市場對價格的看法產生變化，股民對在這點附近持股感到不自在。在股市中，你會看到股價逐步滑落。但假如買力不減，繼續穿越上次的最高點，我們就回到升勢圖去了。


    頭肩圖的道理和雙肩圖類似。請讀者們自己想像一下在其過程中股民的心態變動過程如何。頭肩圖可以當成雙肩圖的變形。這些圖還可以倒過來看（如圖 2-7、2-8）。


    如果說正雙肩圖給你提供了賣的資訊，那麼倒雙肩圖便給你提供了買的資訊。在這些圖的後面其實是股民們對該股票價格認定的心理變化。你要用心來感受：如果你是股市的一員，你會如何想，你會怎樣做？這樣一來，你慢慢地就會培養出何時入市、何時出場的真覺。


    ### 四、平均線


    平均線的目的主要是用來判定股票走勢。股價運動常常具有跳動的形式，平均線把跳動減緩成較為平坦的曲線。


    計算平均線的方法有許多種，最常用的是取收盤價做為計算平均值的參考。例如你要計算十天的平均值，把過去十天的收盤價格加起來除以十，便得到這十天的平均值。每過一天，分子式加上新一天的股票收盤價，再減去前第十一天的收盤價，分母不變，便得到最新的平均值，把平均值連起來便成為平均線（圖
    2-9）。


    平均線的形狀取決於所選擇的天數。天數越多，平均線的轉折越平緩。我自己習慣用二〇〇天平均線來衡量股票的長期走勢，五〇天平均線衡量中期走勢。我不知如何看五〇天以下的平均線，因為我發現其參考價值不高。股票短期的運動方向我注重股價及交易量。我通常不買股價在二〇〇天平均線下的股票，做短線時例外。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_74_0.png)


    ### 五、其他圖形


    我自己日常留意的技術分析圖形就是上述四種。但這節的主題是技術分析的基本知識，我不得不提一下其他圖形。


    一般的技術分析書都會提到三角、隧道、旗子等的圖形。遺憾的是，我的實踐經驗證明它們沒有什麼實用價值。但是，對我沒有實用價值並不表示對其他人也同樣沒用，我嚴肅地建議讀者自己去找這方面的書學習。我將本書的範圍限制在自己親身證明最有用的知識，並不打算內容包羅萬象，請讀者原諒。


    有電腦軟體的朋友常常會看到MACD、威廉指標%等等電腦計算的買賣指標，流行的有二三十種之多。我學股的第二年曾花了很多學習後才明白這些指標都有「見光死」的特點。也不能說這些指標錯誤，這些指標的發明者通常有輝煌的經歷。想像一下：如果每個人都按照這些指標提供的買賣信號炒股，結果將會是什麼？我自認站在巨人的肩膀之上，結果從巨人肩膀上跌下來，摔慘了！


    我常用的前面三個圖形也不是自己發明的。但我在使用當中體會到它們背後的心理因素，人性不容易改變，所以它們一直有效。希望它們不會因為這本書而同樣「見光死」。當然，我相信不可能，人性哪有那麼容易改變？關於其他圖形背後的大眾心理變化的合理解釋，有待行家高手進一步研究。


