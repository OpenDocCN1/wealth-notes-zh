    險」。個股風險來自股票的不可預測，你不知道哪支個股哪一天會大跌。大市風險在於你不知道什麼時候大市可能也來個大跌。個股大跌的例子天天都有，這裡就不另外舉例了。


    一八八七年十月十九日，美國的道瓊指數一天跌掉二二．六％；被歷史稱為「黑色星期一」若手邊有股票，這一天大概每一個人都逃不掉！這就是大市風險。我們用分倉應對個股風險，用輕倉應對大市風險。


    有了這個共識，討論什麼是股市可以期待的合理報酬就容易了嗎？答案很明顯，報酬一定圍繞著指數轉，指數可以認為是充分分散個股風險，一○○％資金入市後股票的平均報酬。如果你不分散風險，將本金全投一檔股票，那麼誰都不知道明天股價是什麼！也就不存在合理或不合理的報酬，這是賭博，那麼只能祝你好運。


    若你是專業投資管理人，承擔著對投資者負責的責任，隨便將投資者的退休金給賭掉是萬萬不可的！你必須用分倉的方法對付個股的風險。這一分倉，按數理統計原理，你的報酬就只可能圍繞著指數轉轉，不可能離它太遠！美國的指數按統計每年上升大約一○％。那麼我們可以認為在充分分散風險的情況下，投資美國股市的合理報酬率應該是一○％左右。


    必須指出這一○％只是美國的記錄；別的國家可能不一樣！美國的社會相當穩定，經濟成長和通貨膨脹都可以預測。有些國家通貨膨脹每年就一○○％，這些國家的股票指數報酬數字和預期將完全不同。'
  md: "\n如果正確的話，那麼你還在摸索階段。\n\n## 三、體驗風險階段\n\n摸索階段的下一步是體驗風險階段。有時這兩個階段是同時進行的。遺憾的是，體驗風險階段的你常要虧大錢，不虧上一兩次大錢，你不會明白什麼叫風險，你也還不可能畢業。只有在虧錢虧得吃不下、睡不著的時候，你才會真反足炒股為什麼會有些行規。也就是在什麼時候，行規的意思變得很清楚。有了這個經歷，再去讀讀第二章第二節「如何在股市下注？下多少注？」的內容，你就明白白我在說什麼了。\n\
    \n我每次賺了大錢，隨即常常來一次虧大錢，因為每次賺了大錢，都讓我覺得自己「懂」了。這樣的經歷重複了好多次。這或許就如同游泳一樣，那些不幸罹難的都是「自己覺得」會游泳的人。知道自己不會游泳或真正知道怎樣游泳的人通常不會淹死。\n\
    \n如果虧大錢的經歷發生在你的蠻幹階段，我對你深表同情；但如果你確實確實有了幾年的炒股經驗，對研究股票及其運動規律下過苦功，這時虧大錢常常是你大成之前的最後考驗，請千萬不要放棄！那些著名的炒股名家，在他們成「家」之前通常都有一次甚至幾次的破產經歷。其中包括本中提到傑西·李佛摩和伯納德·巴魯克。\n\
    \n在忍無可忍的時候，請再忍一忍。\n\n## 四、久賭必贏階段\n\n回到我的故事。我炒股的最大挫折，就發生在「有靈光在我腦海閃耀」之後。有四年多的時間，股市對我而言成了「沒錢人學到很多經驗」的地方。我不知有多想快快地撈上一筆。有整整兩個星期，我虧掉五萬三千美元。真正的挫折不在於虧掉的數目，而在於這次虧錢完全不應該。按我的規則，我只會虧掉四千美元左右，那是我停損的極限。但我注下得太大，又不肯及時停損。我犯了不該犯的錯誤。我用希望取代了分析。我自以爲懂股票了，其實還不全懂。\n\
    \n隨後一個月，我開始整理自己的思路，總結五年來的經驗及教訓，綜合我這些年來的廣泛閱讀，結果就是這本書所說的一切。有兩年期間，我完全按這本書所說的原理解辦，每年的報酬率都超過一一〇％。但需要特別說明的是：這樣的報酬是在極小的風險下取得。日後是否能持續這樣的報酬，我不知道，但我知道我已定出了可行的炒股計畫，只要按這個計畫做，我久賭必贏。差別只在於贏多贏少，那跟運氣有點關係。\n\
    \n現在我們談炒股的最後階段——久賭必贏階段。\n\n一個可行的計畫，不能憑空想像，它必須有理有据。「理」就是數學的機率，如果你每次下注的贏面超過五〇％，而且你只下本金的小部分，不會爲幾次壞運氣就剃光頭，從長期而言你是勝定了。道理和開賭場一樣。\n\
    \n「據」就在於你知道怎樣找臨界點，在長期的觀察和實踐過程中，你知道這些點是出入場的關鍵點，在這些點操作，你的贏面超出五○％，再加上應用「截短虧損，讓利潤奔跑」的原則，贏時贏大的，虧時虧小的，你的獲勝機率其實遠遠超出了五○％。\n\
    \n到久賭必贏階段，你不應對虧錢和賺錢有任何情緒上的波動。你對停損不再痛苦，你明白這是遊戲的一部分，你對賺錢也不再喜悅，你知道這是必然的結果。你不再將勝負放在心上，你只注重在正確的時間，做正確的事情。你知道利潤會隨之而來。\n\
    \n有些人認為股票的運動是可以預知的，有些人說是不可以預知的。這兩點都不對，股票的正確率從五○％提高到六○％、七○％。就算你能有七○％的正確率，若不遵循「截短虧損，讓利潤奔跑」的原則，到頭來可能還是白忙一場。\n\
    \n已經到這個地步，你不再執著於本益比或紅利之類死的东西，你在用機率考慮問題。股票的大市如何？如果大市好，你買股的獲勝機率增加了。股票的資本比或紅利如何？如果有吸引力的話，你的獲勝機率增加了。這檔股票本身的走勢如何？如果正處在升勢，你買股的獲勝機率增加了。這檔股票的運動用你的經驗判定是否正常？是的的話，你的獲勝機率增加了。還有其他許多考慮的因素，你都試著用機率來評估它們的功用。\n\
    \n你知道股票運動在短期必受大戶的影響。某著名股評人極力推薦某支股，你可以看看這支股票的技術圖形，如果股票剛突破破好的買入臨界點，在此之前有被人暗中囤積的跡象，你可以懷疑該股評人可能和某大戶聯手，想推高股價，但現在只是推高的開始，你買入應還有段升高的路好走，獲勝機率較大。如果這檔股票已暴升了很多，股評人還來這一手，那麼大機率就是在找最後的傻瓜，你在此時買股就沒有什麼贏面。同樣的「好消息」，你已知道怎樣分析與判斷，你不再迷信「權威」。\n\
    \n這時候你已知道你為什麼能賺到錢，你已有一套行動計畫重複賺錢的經歷，你也清楚為什麼會虧錢，你已學會跌時停損，虧錢不再成為心理負擔。因為你知道虧掉的錢很快就能賺回來，到了這個地步，你知道你已能夠以炒股維生了。你會不會就此發大財，那要看運氣。\n\
    \n# 第七章〈抓住大機會〉\n\n講述了這樣的機會及如何抓住它。這樣的機會可遇不可求，結果只有由上帝決定。祝你好運，也希望你祝我好運。\n\n炒股的知識是否到此為止？答案自然是「否」。炒家傑西．李佛摩說他炒股四十年，每天都能從股市學到新東西。華爾街有個說法：「如果你能在股市熬十年，你應該能不斷賺到錢；你如果熬了二十年，你的經驗將極有借鑑的價值；你如果熬了二十年，那麼你退休的時候，一定會是非常富有人。」每個迴圈，炒股人的規則還是那些，但你對這些規則會有更深的體。你會找到更多的例外，你會區分在不同的環境怎樣實施不同的規則。\n\
    \n我粗略地將學股分成蠻幹階段、摸索階段、體驗風險階段和久賭必贏階段。不算我業餘炒股的經驗，這四個階段一共花了我近六年的時間。我研究過很多炒家的傳記，他們的描述各有不同，但經歷極為相似。久賭必贏的階段是學炒股的里程碑。到了這個階段，你就在這行待下去，等待大機會。假如運氣好，被你抓到幾個大機會，你便從炒手升級爲炒家。\n\
    \n你可以就我的描述估計一下自己現在處於什麼階段，還要多久才能業業。你如果有一定的悟性及對人性的認識，克服人性中的弱點不需要花很多時間，因爲你很清楚什麼是需要做到的，你只要盡力照做就可以了。最花時間的是如何學著找臨界點。每個人對風險的承受力都不一樣，找到的臨界點也不一樣。你必須綜合考慮股價、交易量、走勢、新聞、大市、公司盈利、產品等因素。\n\
    \n我希望我能更詳細地解釋怎樣尋找臨界點及應怎樣在臨界點附近操作，但這實在是一門藝術，只可意會，難以言傳。而且沒有放諸四海人都適合的做法。我給你指了方向，你可以就這個方向摸著石頭過河。尋找臨界點沒有捷徑，只有實驗、失敗、再實驗，無數次地循環往復。直到有一天，你能憑直覺抓住臨界點，憑直覺運用本書所講的所有規則，不再懷疑有無違反這、違反那，你就從有招的新手進歩成了無招的高手。\n\
    \n## 第二節回答幾個問題\n\n在結束之前，讓我回答幾個讀者的問題。\n\n- 問：你為何會想寫這本書？\n- 答：一九九八年二月我回老家中國福州。八年沒回去過了，老家變了樣！我親眼目睹了中國的炒股熱。遺憾的是，我見到的股民幾乎全在蠻幹。這時我就想，如果我能將自己的經驗寫出來，會不會受到這些股民的歡迎？我的一些好友及家人也鼓勵我總結這些經驗。\n\
    \n- 問：我讀到很多炒股書都將攤平法當成一套良方，但你極力反對，到底是誰錯？\n- 答：我一直強調，炒股沒有絕對的對或錯，但就這樣，我可以有兩個說法：\n\
    \  - 一、這些書的作者大概自己沒怎麼炒過股。他們可能靠教別人炒股維生，不可能自己靠炒股維生。\n  - 二、他們可能在抄來抄去的時候抄錯了，把基金錯抄成股票。基金雖然是用來買股票的，但通常都是買很多種股票，分散了風險，由此基金基本上跟大市起落。而股市是整個國民經濟的晴雨表，只要國家沒有政治和經濟的動盪，它的大趨勢肯定向上。你如果購買基金，不需要去選什麼進出點，你準備長期持有。在這種情況下適用攤平法。\n\
    \  \n  個別股票的起伏是很大的。你敢向下攤平，那是因為你沒有死過。給我印象很深的是我們交大的前輩校友王安博士。我在讀大學的時候，王安電腦在美國風生水起，大有取代\
    \ IBM 的架式。我們都為有這樣一位學長爲榮。按今天的話說，王安電腦是當年的「績優股」、「強勢股」。曾幾何時，王安電腦已關門大吉！今天王安電腦還在美國掛牌，但此王安已非彼王安，王安招牌被人拿來掛羊頭賣狗肉。你若不幸在王安電腦強勢時入股，下跌時去用攤平法解套，到今天你一定還死得直直的。\n\
    \n- 問：你有沒有自己的電腦指示？像是什麼線穿過什麼線可以買賣等……保證能賺到錢的電腦指示？\n- 答：第一、我沒有。第二、它不存在。第三、如果有的話，我也不告訴你，這麼容易賺錢的方法我會留著自己用。\n\
    \n- 問：你把炒股當成賭博，買股稱爲下注，你能解釋一下炒股和賭錢的區別嗎？\n- 答：任何有輸的可能的行为都是賭。把錢存銀行不是賭，因爲一定有利息。可是炒股就是賭錢，這兩者沒有區別。但如果買股後的持有期很久，而且把風險分散得很開，把它當做基金一樣操作，這時賭的成分就很多了。因爲只要國家穩定，不斷搞建設，經濟總是向前發展的，股票大市長久而言一定上升。美國近六十年統計出來，股票大市平均每年上升近1%，高於銀行存款利息。但如果你想從股市獲得很大的報酬，就必須擔大的風險，風險愈大，賭性愈強。\n\
    \n- 問：你的炒股經驗是基於在美國的經驗，這些經驗適合中國嗎？你是否知道中國的股市被人爲操縱得厲害？\n- 答：我知道中國的股市有人爲操縱的因素，你可以將中國二字換成香港或印度、法國、馬來西亞，你一樣可以將中國換成美國，所有的股市都或多或少地受大戶的操縱。\n\
    \n  如果你的資本額多，你的買賣自然影響股票的價格，別人也會說你在操縱股市。如果你認爲美國人都是善男信女，大家都按本益比的高低買股票，那你就太天真了。這本書的原理適合任何股市，適合期貨市場。很多道理我是在炒期貨中領悟到的。這個世界受到操縱最嚴重的市場是期貨市場，而非股票市場。\n\
    \n  任何股票，都有不少長期持股者。期貨合約有98%都握在短期炒手的手中。普通老百姓放3%的定金買十萬噸黃豆做什麼？吃又吃不完，放也找不到地方放，他們目的完全是「炒作」。將自己炒股失敗歸咎於股市受到操縱，這是失敗者爲自己的失敗找藉口。\n\
    \n- 問：你認為影響股價的最重要因素是什麼？\n- 答：盈利及對未來盈利的預期。買公司的股票，你就成爲公司的股東，你不會長期將錢放在沒有希望的公司，別人也一樣。\n\
    \n- 問：你怎樣看公司做假帳？\n- 答：中國有公司做假帳，美國也有公司做假帳，這是沒辦法的事。你無法判定公司的帳是真是假。在公司做假帳被抓到之前，我們只有認爲這是眞帳。相信我，在公司做假帳被抓住之前，一定有人事先得到消息，只是你我這些小人物的豪在歧裡。這些事先得到消息的人一定會開始拋售手中的股票，這從股票的價格波動及交易量上會顯現出來。你如果按照第三章第二節「注意危險信號」那一段去執行，公司做假帳的事通常不會傷害到你。\n\
    \n- 問：我很想學股但怕虧錢，我能否先在紙上學著交易，等到真正能賺錢後才用真錢入市？\n- 答：想法很好，但在實際中行不通，因爲不把錢投入，你不會經歷恐懼、貪婪、希望等心理過程。你在浪費時間。\n\
    \n## 夾著尾巴炒股\n\n最後，讓我再講個小故事：\n\n一九八一年我在上海交大讀三年級，其中有門課是「電工學」，內容無非是電子信號的傳播、放大等。最後一堂課，老師告訴我們他今天不談電工，今天的題目是「夾著尾巴做人」，我們日後進入社會將會用得著上。\n\
    \n我當時年紀還不滿二十歲，對什麼叫「夾著尾巴做人」並不了解，就聽好玩也沒如何放在心上。大學一畢業眨眼數十年了，電工學的所有內容都已經還給了老師，但唯一記得的就是「夾著尾巴做人」。隨著時間的推移，這幾個字愈顯出其價值。活到今天這年紀，夜深人靜的時候常會這樣想：「如果某有時候我夾了一下尾巴，今天也許就不用擱到要靠炒股維生吧！」\n\
    \n讀者不要以爲我是在說笑，爲了學習炒股付出多少代價，只有自己最清楚。當然，人生禍福相倚。炒股對我來說是福不是禍。而且如果人生能夠重新選擇的話，我還是會選擇以炒股維生。\n\
    \n讀者們從這本書學得到多少炒股的本領我無而得知，但如果能記得「夾著尾巴做人」這一條，就算沒白讀這本書了。將這一點引用到炒股中，我把它作為對讀者的最後忠告——「夾著尾巴炒股！」\n\
    \n孫子曰：「善戰者無赫赫之功，故善者之戰，無奇勝，無智名，無勇功！」這句話意思說會打仗的將軍，不擔大風險，不要小聰明，不逞匹夫之勇。結果是會打仗的將軍往往沒有值得誇耀的戰績。孫子兵法的這一個說法不僅適合軍事戰場，對股票交易有特別意義。\n\
    \n曾國藩或許是這個說法的代表人物；他率領湘軍剿滅了太平天國。我們這裡不探討那場戰爭的本質；只看看一下曾國藩是如何打仗的！\n\n事情發生在一百多年前，記錄很完整。歷史學家幾乎找不到曾國藩打過「大勝仗」的記錄！他用「結硬寨，打呆戰」的方式，集小勝爲大勝，一步一步將太平天國逼上死路。「結硬寨」就是深壕高壘保護自己，盡量先不受損失；「打呆戰」就是小心存僥倖，不投機取巧，有多少實力打多大的戰。在満清成爲以文人而封「武侯」的第一人。曾國藩進士出身，孫子兵法讀到滾瓜爛熟，眞正實踐了「善者之戰，無奇勝，無智名，無勇功。」\n\
    \n戰場上殺敵一萬，自損八千；故善戰者不求殺敵盈野，但求不戰而屈人之兵。股市上想一把賺一○○%，得準備一把虧八○%；故善炒股者不試圖一把豪賭將本金翻倍，試圖在如何虧錢的情況下讓資本不斷增值。善戰者集小勝爲大勝；最後完成戰略目的。善炒股者集小贏爲大贏，最後達成財務自由。殊途同歸！\n\
    \n這些話聽是是自己專職炒股多年，付出慘重學費之後才有的深深體會。借用傑西·李佛摩的話，虧掉幾百萬之後，我想告訴你的：善戰者無赫赫之功！\n\n# 第9章\
    \ 善戰者無赫赫之功\n\n股市的戰是打不完的，所以每個戰役的策略從開始就不應該試圖一戰完功，而是應該遵循「結硬寨，打呆戰」的方式發揮自己的優勢，以最小的可能損失，一步步實現財務自由的策略目標。\n\
    \n那些靠轟轟烈烈大搏殺勝出而出名者後果常常不妙；一場大搏殺取勝自然而然地尋找下一場大搏殺，直至碰到衰運後一無所有；你可以連續五次一○○%的賺，只要一次一○○%虧就一無所有。最好的例子就是我們熟悉的前輩，炒股的天才傑西·李佛摩，他以豪賭名揚天下，但一生破產三次，死時一無所有！\n\
    \n還有不少將軍以赫赫之功名揚天下，成為一代戰神後榮譽退休；因為戰爭竟有打完的時候，對手都消滅了，想繼續打都沒得打。霍去病就靠千里奔襲打得匈奴「亡我祁連山，使我六畜不蕃息。失我爲文山，使我嫁婦無顏色。」立下不朽功績。匈奴最後要嘛投降，要嘛西遷。但股市的戰是打不完的，只要敗一次，可能就前功盡棄；所以華爾街有這樣的說法：「華爾街有勇敢的交易員，華爾街有年老的交易員；華爾街沒有勇敢的老交易員。」\n\
    \n這時可能有股民問，我就是想在股市試試可否追求赫赫之功，不可以嗎？當然，你可以試試。任何人決定做一件事情之前，都應該釐清做這件事情的目的及達成目的的手段。\n\
    \n## 第一節 首先確定自己的策略目標\n\n對大多數新股民而言，入市常常是因為左鄰右舍在股市賺到錢，忍不住也想賺幾個零用錢。這類股民無論是知識還是經驗還不足以給自己制定策略目標，學習是他們的首要任務。如果你自己的股齡小於五年，你通常還處於學習階段。這個階段的策略目標應該是用最小的代價瞭解股市。\n\
    \n過了新股民那個階段，就應該開始為自己進股市的目標定位。不可否認的，部分股民就是想賭一把。這也沒錯！手裡只有三萬元，不僅大事辦不了，就連小事也辦不了！有它多，沒它不少！況且年紀還輕，那就賭賭吧。就像紐約六合彩票的廣告詞：「一塊錢買一個夢！」三萬元翻十倍變成三十萬，再來十倍就是三百萬，初步的財務自由就有了。\n\
    \n股票從三元升到三十元的機會常有，但這種賭法是金融市場的窮人鬧革命，任何股民做這樣賭博行爲之前，請確定賭股的錢是餘錢。\n\n買彩票可能發財，但買彩票的發財方式無法重複；賭股票也有人發財，賭股票發財的方式同樣無法重複；一件不重複的事情沒法學習。\n\
    \n有一種做法介於賭股和專業炒股之間；在美國稱「日交易」。特點就是不僅全力入市，通常還加幾倍槓杆；但持股期間很短，用剪短持股時間來降低風險。我早年炒股也常常日交易。但這種方法只能操作比較小的資金，而且對心理素質要求極高。日交易可稱為「股市偏行」，成功率很低。但做爲一種操作方法它確實存在。\n\
    \n對一般的家庭來說，手頭的钱有其他用途。孩子的學費、房屋的貸款、晚年的退休都要靠它。會進行投資是希望資金能夠增值，所以底線是資金不可以消失不見。如何管理這些資產有一套理論，現代資產配置理論就是研究在不同的風險之下如何分配投資。\n\
    \n如果資產必須保本，那麼只能將錢投資在銀行的儲蓄帳戶，報酬雖然比較低，本金是不會虧損的。存點錢對大家都不容易，所以這個世界的開錢其實大多存在銀行的儲蓄帳戶裡。\n\
    \n若把閒錢投資在股市當中，那麼如何管理就有學問了。將全部身家賭一支股可能快快發財，但也可能快快破產。投資到多檔股票降低了風險，但也降低了快速發財的可能性！顯然地，對報酬的期待影響著資產配置的方法；如果你希望本金每年翻倍，大概只能將本金集中買一檔股票賭一賭；若你滿足每年一〇%的報酬，則可以分散投資到十檔股票，其中一支翻倍，其它打平，你的目標就實現了。哪種方法風險大，哪種目標容易實現，從直覺就可以感受得到。\n\
    \n天下沒有白吃的午餐，你想多賺一分報酬，就要準備多一分風險。\n\n現在問自己：我是有些餘錢想賭一賭還是有老有小想穩當投資？或者主要穩當投資但不怕拿些小錢賭一賭？分清楚自己的情況了，下一步就是選擇投資策略。\n\
    \n我們明白股市的風險是同步的；在股市投資就面對一個很嚴肅的課題：如何對投資風險定位。因為資產的具體配置是由風險定位來決定的。但這又和期待的報酬有關係。\n\
    \n讓我們談什麼是從股市可以期待的合理報酬。\n\n## 第二節 什麼是可期待的合理報酬？\n\n股票這個市場有它本身的特殊性，它的大勢基本上依據經濟的成長運行。這就決定了股票大勢的成長有一定速率，不可能完全脫離經濟成長這個大框架。當股市增長遠遠快過經濟增長之時，有個特別的名詞叫做「泡沫」。\n\
    \n回顧這一百年歷史，經濟不斷增長，新的科技不斷發明，人的壽命也不斷在增長。我們看到的股票大市總體上也在不斷上升。\n\n現在談股票指數。在美國最有代表性的股票指數是史坦普五○○指數（Standard\
    \ and Poor’s 500），它在美國八千支左右的股票中選擇了五百家大公司的股票股價加權平均作為指數。（道瓊指數只有三十家公司，樣本數比較少，）史坦普指數的起伏基本代表了美國股市的波動，我們談股票大勢通常就是指這些指數的波動。中國的股票指數的組成其實一樣。\n\
    \n那麼從這八千檔股票分別選一支、十支和一百支股票做投資組合，這個組合的波動和指數比較會有什麼情形呢？直覺上我們就會有這樣的判斷：一支股票無法預測，十支股票的組合波動應該和指數有點相像，一百支股票的組合波動應該和指數非常相像。這個想像符合了數據統計原理。\n\
    \n控制股市風險其實也只有兩種方法。股市的風險可以大分為「個股風險」和「大市風險」。個股風險來自股票的不可預測，你不知道哪支個股哪一天會大跌。大市風險在於你不知道什麼時候大市可能也來個大跌。個股大跌的例子天天都有，這裡就不另外舉例了。\n\
    \n一八八七年十月十九日，美國的道瓊指數一天跌掉二二．六％；被歷史稱為「黑色星期一」若手邊有股票，這一天大概每一個人都逃不掉！這就是大市風險。我們用分倉應對個股風險，用輕倉應對大市風險。\n\
    \n有了這個共識，討論什麼是股市可以期待的合理報酬就容易了嗎？答案很明顯，報酬一定圍繞著指數轉，指數可以認為是充分分散個股風險，一○○％資金入市後股票的平均報酬。如果你不分散風險，將本金全投一檔股票，那麼誰都不知道明天股價是什麼！也就不存在合理或不合理的報酬，這是賭博，那麼只能祝你好運。\n\
    \n若你是專業投資管理人，承擔著對投資者負責的責任，隨便將投資者的退休金給賭掉是萬萬不可的！你必須用分倉的方法對付個股的風險。這一分倉，按數理統計原理，你的報酬就只可能圍繞著指數轉轉，不可能離它太遠！美國的指數按統計每年上升大約一○％。那麼我們可以認為在充分分散風險的情況下，投資美國股市的合理報酬率應該是一○％左右。\n\
    \n必須指出這一○％只是美國的記錄；別的國家可能不一樣！美國的社會相當穩定，經濟成長和通貨膨脹都可以預測。有些國家通貨膨脹每年就一○○％，這些國家的股票指數報酬數字和預期將完全不同。\n"
  mdcn: "\n如果正確的話，那麼你還在摸索階段。\n\n## 三、體驗風險階段\n\n摸索階段的下一步是體驗風險階段。有時這兩個階段是同時進行的。遺憾的是，體驗風險階段的你常要虧大錢，不虧上一兩次大錢，你不會明白什麼叫風險，你也還不可能畢業。只有在虧錢虧得吃不下、睡不著的時候，你才會真反足炒股為什麼會有些行規。也就是在什麼時候，行規的意思變得很清楚。有了這個經歷，再去讀讀第二章第二節「如何在股市下注？下多少注？」的內容，你就明白白我在說什麼了。\n\
    \n我每次賺了大錢，隨即常常來一次虧大錢，因為每次賺了大錢，都讓我覺得自己「懂」了。這樣的經歷重複了好多次。這或許就如同游泳一樣，那些不幸罹難的都是「自己覺得」會游泳的人。知道自己不會游泳或真正知道怎樣游泳的人通常不會淹死。\n\
    \n如果虧大錢的經歷發生在你的蠻幹階段，我對你深表同情；但如果你確實確實有了幾年的炒股經驗，對研究股票及其運動規律下過苦功，這時虧大錢常常是你大成之前的最後考驗，請千萬不要放棄！那些著名的炒股名家，在他們成「家」之前通常都有一次甚至幾次的破產經歷。其中包括本中提到傑西·李佛摩和伯納德·巴魯克。\n\
    \n在忍無可忍的時候，請再忍一忍。\n\n## 四、久賭必贏階段\n\n回到我的故事。我炒股的最大挫折，就發生在「有靈光在我腦海閃耀」之後。有四年多的時間，股市對我而言成了「沒錢人學到很多經驗」的地方。我不知有多想快快地撈上一筆。有整整兩個星期，我虧掉五萬三千美元。真正的挫折不在於虧掉的數目，而在於這次虧錢完全不應該。按我的規則，我只會虧掉四千美元左右，那是我停損的極限。但我注下得太大，又不肯及時停損。我犯了不該犯的錯誤。我用希望取代了分析。我自以爲懂股票了，其實還不全懂。\n\
    \n隨後一個月，我開始整理自己的思路，總結五年來的經驗及教訓，綜合我這些年來的廣泛閱讀，結果就是這本書所說的一切。有兩年期間，我完全按這本書所說的原理解辦，每年的報酬率都超過一一〇％。但需要特別說明的是：這樣的報酬是在極小的風險下取得。日後是否能持續這樣的報酬，我不知道，但我知道我已定出了可行的炒股計畫，只要按這個計畫做，我久賭必贏。差別只在於贏多贏少，那跟運氣有點關係。\n\
    \n現在我們談炒股的最後階段——久賭必贏階段。\n\n一個可行的計畫，不能憑空想像，它必須有理有据。「理」就是數學的機率，如果你每次下注的贏面超過五〇％，而且你只下本金的小部分，不會爲幾次壞運氣就剃光頭，從長期而言你是勝定了。道理和開賭場一樣。\n\
    \n「據」就在於你知道怎樣找臨界點，在長期的觀察和實踐過程中，你知道這些點是出入場的關鍵點，在這些點操作，你的贏面超出五○％，再加上應用「截短虧損，讓利潤奔跑」的原則，贏時贏大的，虧時虧小的，你的獲勝機率其實遠遠超出了五○％。\n\
    \n到久賭必贏階段，你不應對虧錢和賺錢有任何情緒上的波動。你對停損不再痛苦，你明白這是遊戲的一部分，你對賺錢也不再喜悅，你知道這是必然的結果。你不再將勝負放在心上，你只注重在正確的時間，做正確的事情。你知道利潤會隨之而來。\n\
    \n有些人認為股票的運動是可以預知的，有些人說是不可以預知的。這兩點都不對，股票的正確率從五○％提高到六○％、七○％。就算你能有七○％的正確率，若不遵循「截短虧損，讓利潤奔跑」的原則，到頭來可能還是白忙一場。\n\
    \n已經到這個地步，你不再執著於本益比或紅利之類死的东西，你在用機率考慮問題。股票的大市如何？如果大市好，你買股的獲勝機率增加了。股票的資本比或紅利如何？如果有吸引力的話，你的獲勝機率增加了。這檔股票本身的走勢如何？如果正處在升勢，你買股的獲勝機率增加了。這檔股票的運動用你的經驗判定是否正常？是的的話，你的獲勝機率增加了。還有其他許多考慮的因素，你都試著用機率來評估它們的功用。\n\
    \n你知道股票運動在短期必受大戶的影響。某著名股評人極力推薦某支股，你可以看看這支股票的技術圖形，如果股票剛突破破好的買入臨界點，在此之前有被人暗中囤積的跡象，你可以懷疑該股評人可能和某大戶聯手，想推高股價，但現在只是推高的開始，你買入應還有段升高的路好走，獲勝機率較大。如果這檔股票已暴升了很多，股評人還來這一手，那麼大機率就是在找最後的傻瓜，你在此時買股就沒有什麼贏面。同樣的「好消息」，你已知道怎樣分析與判斷，你不再迷信「權威」。\n\
    \n這時候你已知道你為什麼能賺到錢，你已有一套行動計畫重複賺錢的經歷，你也清楚為什麼會虧錢，你已學會跌時停損，虧錢不再成為心理負擔。因為你知道虧掉的錢很快就能賺回來，到了這個地步，你知道你已能夠以炒股維生了。你會不會就此發大財，那要看運氣。\n\
    \n# 第七章〈抓住大機會〉\n\n講述了這樣的機會及如何抓住它。這樣的機會可遇不可求，結果只有由上帝決定。祝你好運，也希望你祝我好運。\n\n炒股的知識是否到此為止？答案自然是「否」。炒家傑西．李佛摩說他炒股四十年，每天都能從股市學到新東西。華爾街有個說法：「如果你能在股市熬十年，你應該能不斷賺到錢；你如果熬了二十年，你的經驗將極有借鑑的價值；你如果熬了二十年，那麼你退休的時候，一定會是非常富有人。」每個迴圈，炒股人的規則還是那些，但你對這些規則會有更深的體。你會找到更多的例外，你會區分在不同的環境怎樣實施不同的規則。\n\
    \n我粗略地將學股分成蠻幹階段、摸索階段、體驗風險階段和久賭必贏階段。不算我業餘炒股的經驗，這四個階段一共花了我近六年的時間。我研究過很多炒家的傳記，他們的描述各有不同，但經歷極為相似。久賭必贏的階段是學炒股的里程碑。到了這個階段，你就在這行待下去，等待大機會。假如運氣好，被你抓到幾個大機會，你便從炒手升級爲炒家。\n\
    \n你可以就我的描述估計一下自己現在處於什麼階段，還要多久才能業業。你如果有一定的悟性及對人性的認識，克服人性中的弱點不需要花很多時間，因爲你很清楚什麼是需要做到的，你只要盡力照做就可以了。最花時間的是如何學著找臨界點。每個人對風險的承受力都不一樣，找到的臨界點也不一樣。你必須綜合考慮股價、交易量、走勢、新聞、大市、公司盈利、產品等因素。\n\
    \n我希望我能更詳細地解釋怎樣尋找臨界點及應怎樣在臨界點附近操作，但這實在是一門藝術，只可意會，難以言傳。而且沒有放諸四海人都適合的做法。我給你指了方向，你可以就這個方向摸著石頭過河。尋找臨界點沒有捷徑，只有實驗、失敗、再實驗，無數次地循環往復。直到有一天，你能憑直覺抓住臨界點，憑直覺運用本書所講的所有規則，不再懷疑有無違反這、違反那，你就從有招的新手進歩成了無招的高手。\n\
    \n## 第二節回答幾個問題\n\n在結束之前，讓我回答幾個讀者的問題。\n\n- 問：你為何會想寫這本書？\n- 答：一九九八年二月我回老家中國福州。八年沒回去過了，老家變了樣！我親眼目睹了中國的炒股熱。遺憾的是，我見到的股民幾乎全在蠻幹。這時我就想，如果我能將自己的經驗寫出來，會不會受到這些股民的歡迎？我的一些好友及家人也鼓勵我總結這些經驗。\n\
    \n- 問：我讀到很多炒股書都將攤平法當成一套良方，但你極力反對，到底是誰錯？\n- 答：我一直強調，炒股沒有絕對的對或錯，但就這樣，我可以有兩個說法：\n\
    \  - 一、這些書的作者大概自己沒怎麼炒過股。他們可能靠教別人炒股維生，不可能自己靠炒股維生。\n  - 二、他們可能在抄來抄去的時候抄錯了，把基金錯抄成股票。基金雖然是用來買股票的，但通常都是買很多種股票，分散了風險，由此基金基本上跟大市起落。而股市是整個國民經濟的晴雨表，只要國家沒有政治和經濟的動盪，它的大趨勢肯定向上。你如果購買基金，不需要去選什麼進出點，你準備長期持有。在這種情況下適用攤平法。\n\
    \  \n  個別股票的起伏是很大的。你敢向下攤平，那是因為你沒有死過。給我印象很深的是我們交大的前輩校友王安博士。我在讀大學的時候，王安電腦在美國風生水起，大有取代\
    \ IBM 的架式。我們都為有這樣一位學長爲榮。按今天的話說，王安電腦是當年的「績優股」、「強勢股」。曾幾何時，王安電腦已關門大吉！今天王安電腦還在美國掛牌，但此王安已非彼王安，王安招牌被人拿來掛羊頭賣狗肉。你若不幸在王安電腦強勢時入股，下跌時去用攤平法解套，到今天你一定還死得直直的。\n\
    \n- 問：你有沒有自己的電腦指示？像是什麼線穿過什麼線可以買賣等……保證能賺到錢的電腦指示？\n- 答：第一、我沒有。第二、它不存在。第三、如果有的話，我也不告訴你，這麼容易賺錢的方法我會留著自己用。\n\
    \n- 問：你把炒股當成賭博，買股稱爲下注，你能解釋一下炒股和賭錢的區別嗎？\n- 答：任何有輸的可能的行为都是賭。把錢存銀行不是賭，因爲一定有利息。可是炒股就是賭錢，這兩者沒有區別。但如果買股後的持有期很久，而且把風險分散得很開，把它當做基金一樣操作，這時賭的成分就很多了。因爲只要國家穩定，不斷搞建設，經濟總是向前發展的，股票大市長久而言一定上升。美國近六十年統計出來，股票大市平均每年上升近1%，高於銀行存款利息。但如果你想從股市獲得很大的報酬，就必須擔大的風險，風險愈大，賭性愈強。\n\
    \n- 問：你的炒股經驗是基於在美國的經驗，這些經驗適合中國嗎？你是否知道中國的股市被人爲操縱得厲害？\n- 答：我知道中國的股市有人爲操縱的因素，你可以將中國二字換成香港或印度、法國、馬來西亞，你一樣可以將中國換成美國，所有的股市都或多或少地受大戶的操縱。\n\
    \n  如果你的資本額多，你的買賣自然影響股票的價格，別人也會說你在操縱股市。如果你認爲美國人都是善男信女，大家都按本益比的高低買股票，那你就太天真了。這本書的原理適合任何股市，適合期貨市場。很多道理我是在炒期貨中領悟到的。這個世界受到操縱最嚴重的市場是期貨市場，而非股票市場。\n\
    \n  任何股票，都有不少長期持股者。期貨合約有98%都握在短期炒手的手中。普通老百姓放3%的定金買十萬噸黃豆做什麼？吃又吃不完，放也找不到地方放，他們目的完全是「炒作」。將自己炒股失敗歸咎於股市受到操縱，這是失敗者爲自己的失敗找藉口。\n\
    \n- 問：你認為影響股價的最重要因素是什麼？\n- 答：盈利及對未來盈利的預期。買公司的股票，你就成爲公司的股東，你不會長期將錢放在沒有希望的公司，別人也一樣。\n\
    \n- 問：你怎樣看公司做假帳？\n- 答：中國有公司做假帳，美國也有公司做假帳，這是沒辦法的事。你無法判定公司的帳是真是假。在公司做假帳被抓到之前，我們只有認爲這是眞帳。相信我，在公司做假帳被抓住之前，一定有人事先得到消息，只是你我這些小人物的豪在歧裡。這些事先得到消息的人一定會開始拋售手中的股票，這從股票的價格波動及交易量上會顯現出來。你如果按照第三章第二節「注意危險信號」那一段去執行，公司做假帳的事通常不會傷害到你。\n\
    \n- 問：我很想學股但怕虧錢，我能否先在紙上學著交易，等到真正能賺錢後才用真錢入市？\n- 答：想法很好，但在實際中行不通，因爲不把錢投入，你不會經歷恐懼、貪婪、希望等心理過程。你在浪費時間。\n\
    \n## 夾著尾巴炒股\n\n最後，讓我再講個小故事：\n\n一九八一年我在上海交大讀三年級，其中有門課是「電工學」，內容無非是電子信號的傳播、放大等。最後一堂課，老師告訴我們他今天不談電工，今天的題目是「夾著尾巴做人」，我們日後進入社會將會用得著上。\n\
    \n我當時年紀還不滿二十歲，對什麼叫「夾著尾巴做人」並不了解，就聽好玩也沒如何放在心上。大學一畢業眨眼數十年了，電工學的所有內容都已經還給了老師，但唯一記得的就是「夾著尾巴做人」。隨著時間的推移，這幾個字愈顯出其價值。活到今天這年紀，夜深人靜的時候常會這樣想：「如果某有時候我夾了一下尾巴，今天也許就不用擱到要靠炒股維生吧！」\n\
    \n讀者不要以爲我是在說笑，爲了學習炒股付出多少代價，只有自己最清楚。當然，人生禍福相倚。炒股對我來說是福不是禍。而且如果人生能夠重新選擇的話，我還是會選擇以炒股維生。\n\
    \n讀者們從這本書學得到多少炒股的本領我無而得知，但如果能記得「夾著尾巴做人」這一條，就算沒白讀這本書了。將這一點引用到炒股中，我把它作為對讀者的最後忠告——「夾著尾巴炒股！」\n\
    \n孫子曰：「善戰者無赫赫之功，故善者之戰，無奇勝，無智名，無勇功！」這句話意思說會打仗的將軍，不擔大風險，不要小聰明，不逞匹夫之勇。結果是會打仗的將軍往往沒有值得誇耀的戰績。孫子兵法的這一個說法不僅適合軍事戰場，對股票交易有特別意義。\n\
    \n曾國藩或許是這個說法的代表人物；他率領湘軍剿滅了太平天國。我們這裡不探討那場戰爭的本質；只看看一下曾國藩是如何打仗的！\n\n事情發生在一百多年前，記錄很完整。歷史學家幾乎找不到曾國藩打過「大勝仗」的記錄！他用「結硬寨，打呆戰」的方式，集小勝爲大勝，一步一步將太平天國逼上死路。「結硬寨」就是深壕高壘保護自己，盡量先不受損失；「打呆戰」就是小心存僥倖，不投機取巧，有多少實力打多大的戰。在満清成爲以文人而封「武侯」的第一人。曾國藩進士出身，孫子兵法讀到滾瓜爛熟，眞正實踐了「善者之戰，無奇勝，無智名，無勇功。」\n\
    \n戰場上殺敵一萬，自損八千；故善戰者不求殺敵盈野，但求不戰而屈人之兵。股市上想一把賺一○○%，得準備一把虧八○%；故善炒股者不試圖一把豪賭將本金翻倍，試圖在如何虧錢的情況下讓資本不斷增值。善戰者集小勝爲大勝；最後完成戰略目的。善炒股者集小贏爲大贏，最後達成財務自由。殊途同歸！\n\
    \n這些話聽是是自己專職炒股多年，付出慘重學費之後才有的深深體會。借用傑西·李佛摩的話，虧掉幾百萬之後，我想告訴你的：善戰者無赫赫之功！\n\n# 第9章\
    \ 善戰者無赫赫之功\n\n股市的戰是打不完的，所以每個戰役的策略從開始就不應該試圖一戰完功，而是應該遵循「結硬寨，打呆戰」的方式發揮自己的優勢，以最小的可能損失，一步步實現財務自由的策略目標。\n\
    \n那些靠轟轟烈烈大搏殺勝出而出名者後果常常不妙；一場大搏殺取勝自然而然地尋找下一場大搏殺，直至碰到衰運後一無所有；你可以連續五次一○○%的賺，只要一次一○○%虧就一無所有。最好的例子就是我們熟悉的前輩，炒股的天才傑西·李佛摩，他以豪賭名揚天下，但一生破產三次，死時一無所有！\n\
    \n還有不少將軍以赫赫之功名揚天下，成為一代戰神後榮譽退休；因為戰爭竟有打完的時候，對手都消滅了，想繼續打都沒得打。霍去病就靠千里奔襲打得匈奴「亡我祁連山，使我六畜不蕃息。失我爲文山，使我嫁婦無顏色。」立下不朽功績。匈奴最後要嘛投降，要嘛西遷。但股市的戰是打不完的，只要敗一次，可能就前功盡棄；所以華爾街有這樣的說法：「華爾街有勇敢的交易員，華爾街有年老的交易員；華爾街沒有勇敢的老交易員。」\n\
    \n這時可能有股民問，我就是想在股市試試可否追求赫赫之功，不可以嗎？當然，你可以試試。任何人決定做一件事情之前，都應該釐清做這件事情的目的及達成目的的手段。\n\
    \n## 第一節 首先確定自己的策略目標\n\n對大多數新股民而言，入市常常是因為左鄰右舍在股市賺到錢，忍不住也想賺幾個零用錢。這類股民無論是知識還是經驗還不足以給自己制定策略目標，學習是他們的首要任務。如果你自己的股齡小於五年，你通常還處於學習階段。這個階段的策略目標應該是用最小的代價瞭解股市。\n\
    \n過了新股民那個階段，就應該開始為自己進股市的目標定位。不可否認的，部分股民就是想賭一把。這也沒錯！手裡只有三萬元，不僅大事辦不了，就連小事也辦不了！有它多，沒它不少！況且年紀還輕，那就賭賭吧。就像紐約六合彩票的廣告詞：「一塊錢買一個夢！」三萬元翻十倍變成三十萬，再來十倍就是三百萬，初步的財務自由就有了。\n\
    \n股票從三元升到三十元的機會常有，但這種賭法是金融市場的窮人鬧革命，任何股民做這樣賭博行爲之前，請確定賭股的錢是餘錢。\n\n買彩票可能發財，但買彩票的發財方式無法重複；賭股票也有人發財，賭股票發財的方式同樣無法重複；一件不重複的事情沒法學習。\n\
    \n有一種做法介於賭股和專業炒股之間；在美國稱「日交易」。特點就是不僅全力入市，通常還加幾倍槓杆；但持股期間很短，用剪短持股時間來降低風險。我早年炒股也常常日交易。但這種方法只能操作比較小的資金，而且對心理素質要求極高。日交易可稱為「股市偏行」，成功率很低。但做爲一種操作方法它確實存在。\n\
    \n對一般的家庭來說，手頭的钱有其他用途。孩子的學費、房屋的貸款、晚年的退休都要靠它。會進行投資是希望資金能夠增值，所以底線是資金不可以消失不見。如何管理這些資產有一套理論，現代資產配置理論就是研究在不同的風險之下如何分配投資。\n\
    \n如果資產必須保本，那麼只能將錢投資在銀行的儲蓄帳戶，報酬雖然比較低，本金是不會虧損的。存點錢對大家都不容易，所以這個世界的開錢其實大多存在銀行的儲蓄帳戶裡。\n\
    \n若把閒錢投資在股市當中，那麼如何管理就有學問了。將全部身家賭一支股可能快快發財，但也可能快快破產。投資到多檔股票降低了風險，但也降低了快速發財的可能性！顯然地，對報酬的期待影響著資產配置的方法；如果你希望本金每年翻倍，大概只能將本金集中買一檔股票賭一賭；若你滿足每年一〇%的報酬，則可以分散投資到十檔股票，其中一支翻倍，其它打平，你的目標就實現了。哪種方法風險大，哪種目標容易實現，從直覺就可以感受得到。\n\
    \n天下沒有白吃的午餐，你想多賺一分報酬，就要準備多一分風險。\n\n現在問自己：我是有些餘錢想賭一賭還是有老有小想穩當投資？或者主要穩當投資但不怕拿些小錢賭一賭？分清楚自己的情況了，下一步就是選擇投資策略。\n\
    \n我們明白股市的風險是同步的；在股市投資就面對一個很嚴肅的課題：如何對投資風險定位。因為資產的具體配置是由風險定位來決定的。但這又和期待的報酬有關係。\n\
    \n讓我們談什麼是從股市可以期待的合理報酬。\n\n## 第二節 什麼是可期待的合理報酬？\n\n股票這個市場有它本身的特殊性，它的大勢基本上依據經濟的成長運行。這就決定了股票大勢的成長有一定速率，不可能完全脫離經濟成長這個大框架。當股市增長遠遠快過經濟增長之時，有個特別的名詞叫做「泡沫」。\n\
    \n回顧這一百年歷史，經濟不斷增長，新的科技不斷發明，人的壽命也不斷在增長。我們看到的股票大市總體上也在不斷上升。\n\n現在談股票指數。在美國最有代表性的股票指數是史坦普五○○指數（Standard\
    \ and Poor’s 500），它在美國八千支左右的股票中選擇了五百家大公司的股票股價加權平均作為指數。（道瓊指數只有三十家公司，樣本數比較少，）史坦普指數的起伏基本代表了美國股市的波動，我們談股票大勢通常就是指這些指數的波動。中國的股票指數的組成其實一樣。\n\
    \n那麼從這八千檔股票分別選一支、十支和一百支股票做投資組合，這個組合的波動和指數比較會有什麼情形呢？直覺上我們就會有這樣的判斷：一支股票無法預測，十支股票的組合波動應該和指數有點相像，一百支股票的組合波動應該和指數非常相像。這個想像符合了數據統計原理。\n\
    \n控制股市風險其實也只有兩種方法。股市的風險可以大分為「個股風險」和「大市風險」。個股風險來自股票的不可預測，你不知道哪支個股哪一天會大跌。大市風險在於你不知道什麼時候大市可能也來個大跌。個股大跌的例子天天都有，這裡就不另外舉例了。\n\
    \n一八八七年十月十九日，美國的道瓊指數一天跌掉二二．六％；被歷史稱為「黑色星期一」若手邊有股票，這一天大概每一個人都逃不掉！這就是大市風險。我們用分倉應對個股風險，用輕倉應對大市風險。\n\
    \n有了這個共識，討論什麼是股市可以期待的合理報酬就容易了嗎？答案很明顯，報酬一定圍繞著指數轉，指數可以認為是充分分散個股風險，一○○％資金入市後股票的平均報酬。如果你不分散風險，將本金全投一檔股票，那麼誰都不知道明天股價是什麼！也就不存在合理或不合理的報酬，這是賭博，那麼只能祝你好運。\n\
    \n若你是專業投資管理人，承擔著對投資者負責的責任，隨便將投資者的退休金給賭掉是萬萬不可的！你必須用分倉的方法對付個股的風險。這一分倉，按數理統計原理，你的報酬就只可能圍繞著指數轉轉，不可能離它太遠！美國的指數按統計每年上升大約一○％。那麼我們可以認為在充分分散風險的情況下，投資美國股市的合理報酬率應該是一○％左右。\n\
    \n必須指出這一○％只是美國的記錄；別的國家可能不一樣！美國的社會相當穩定，經濟成長和通貨膨脹都可以預測。有些國家通貨膨脹每年就一○○％，這些國家的股票指數報酬數字和預期將完全不同。\n"
