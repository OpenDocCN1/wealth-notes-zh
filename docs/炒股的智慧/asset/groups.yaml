    # 第五章《華爾街的家訓》


    ，英國科學家牛頓（Sir Isaac Newton）說：「我之所以能看得更遠，是因為我站在巨人的肩膀上。」在這一章，讓我們看看炒股這行的前輩們給我們留下了什麼經驗。


    # 第六章《如何爲自己做好心理建設？》


    ，這一章談心理建設。人性中根深蒂固的恐懼、希望、貪婪影響著我們所做的每一個決定，使我們常常做不到自己該做的事。要完全克服人性中的弱點很困難，但我們首先必須知道人性弱點是什麼及正確的做法。


    # 第七章《抓住大機會》


    ，分析大機會的定義及其特點。這一章並非單純地談股票。


    # 第八章《和炒手們聊聊天》


