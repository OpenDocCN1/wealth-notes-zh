    # 炒股的智慧


    總是痛苦的，不然怎麼會稱為「割肉」？隨著時間推移，你經歷了小損成為大損的過程，這中間的焦慮、懷疑、失眠，一次又一次，你就逐漸形成快速停損的心態。開始時定下的停損規就顯得難以執行，慢慢地成為潛意識行動，一旦股票的運動不對，不採取行動就寢食難安。


    這個過程，就是你學股的成長過程。


    炒股需要很多和人性逆向而行的心態，這種心態首先你必須明白它！例如不願停損、喜歡不顧外在條件在股市跳進跳出、好壞小利等等。明白了問題之所在以後，你必須潛意識地訓練自己不犯這些錯誤。就算犯了，告誡自己下次別犯同樣的錯誤。為了做到這些，你要觀察，要反省。


    觀察市場，用你的知識及經驗判斷市場的行動及發展，做到這點的基础當然是你必須有一定的市場知識和經驗。隨著時間的推移，自然地，你會「感覺」到市場下一步的「方向」何在。潛意識中，你會聽到一個聲音：「現在是買進的時候」，或者是「現在是賣出的時候」。這時你開始將這個聲音和你的規則相比較。你若想買進某檔股票，你開始問：這檔股票處在升勢嗎？這家公司有沒有新產品？股票的大市是牛市還是熊市？這檔股票的價格變化和交易量的互動是否正常？


    你問自己心目中「買」的聲音是源自「自以為是」還是客觀的判斷。


    每次犯錯，好好地分析自己為什麼犯錯，違反了什麼規則？人犯了錯，自然的情緒就是尋'
