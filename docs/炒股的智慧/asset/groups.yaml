    # 伯納德·巴魯克 (Bernard Baruch)


    伯納德·巴魯克十九歲入門，二十六歲時「完成學股的初期教育」，三十五歲賺到第一個百萬美元。之後成為多位美國總統的財務顧問，在他的自傳《Baruch My Own
    Story》中，他談到：


    我對所有的炒股規則都抱有懷疑，所以很不願意多談。但就我的親身經歷，以下的幾點或許能幫助你自律：


    - 一、除非你能將炒股當成全職工作，否則別冒險。

    - 二、對任何給你「內幕消息」的人士，無論是理髮師、美容師還是餐館服務生，都要小心。

    - 三、在你買股票之前，找出公司的所有資料，它的管理層、競爭者，它的盈利及增長的可能性。

    - 四、別試著在最低點買股、最高點賣股，這是不可能的，除非你撒謊。

    - 五、學習快速乾淨地停損。別希望自己每次都正確。如果犯了錯，越快停損越好。

    - 六、別買太多股票，最好買幾檔股票，以保證你能夠仔細地觀察它們。

    - 七、定期有計畫地檢查你的投資，看看有什麼新的發展可能改變你的想法。

    - 八、研究稅務情況，在賣股時爭取最大的稅務效益。

    - 九、永遠持有一部分現金，不要將錢全部投入股市。

    - 十、不要嘗試成為萬事通，專心於你瞭解最多的行業。


    # 傑西·李佛摩 (Jesse Livermore)


    如果要列出二十世紀最著名的兩位炒家，絕對是傑西·李佛摩和喬治·索羅斯。一位生活在二十世紀初，另一位生活在二十世紀末。傑西·李佛摩已死了半個多世紀，以他的生平寫的書《股票作手回憶錄》(Reminiscences
    of a Stock Operator) 初版於一九二三年，這幾十年來再版無數次，直到今天仍是每位炒手的必讀之書。以下讓我們欣賞一些傑西·李佛摩的炒股智慧：


    我很早就發現華爾街沒有什麼新東西，也不可能有什麼新東西，因為股票投機歷史悠久，今天在股市發生的一切都在以前發生過，也將在未來不斷地再發生。我進場之前就知道我判斷正確時，我總是會賺到錢。使我犯錯的是我沒有足夠的毅力按計畫做，即只有在先滿足我的入場條件時才入場。對每天都要買賣股票的人來說，他不可能有足夠的理由和知識使他每天的買賣都是理性的。不顧市場情況，每天以感情衝動進進出出，是華爾街很多炒手虧錢的主要原因。他們試著像做其他工作一樣，每天都能拿一筆錢回家。世界上沒有比虧錢更好的老師了。當你學習如何做才不會虧錢時，你就開始學習如何賺錢了。


    賭博和投機的區別在於：前者對市場的波動押注，後者等待市場不可避免的升和跌。在股市賭博是不會成功的。


    大錢不存在於股票的日常小波動，大錢只存在於大勢之內。因此你需要判定大勢的走向。


    在多年的華爾街經驗和幾百萬美元的學費之後，我要告訴你的事是：我賺到大錢的訣竅不在於我如何思考，而在於我能安坐不動，坐著不動！明白嗎？在股票這行，能夠買對了且能安坐不動的人實在少之又少，我發現這是最難學的。忽略大勢，執著於股票的小波動是致命的，沒有人能夠抓到所有的小波動。這行的祕訣就在於牛市時，買進股票，安坐不動，直到你認為牛市接近結束時再脫手。


    我在這行學得很慢，因為我只能從錯誤中學，犯了錯，需要時間去明白犯了錯，需要更多的時間去明白為什麼會犯這個錯。


    我只在升勢的時候買股票，此時我才覺得舒服。我每多進一手都一定比上一手的價格更高。


    記住，股票從來就沒有太高了不能買或太低了不能賣這回事，但進場後，如果第一手沒給你利潤，就別進第二手。


    一個大走勢的起點可能是大戶操縱和金融家玩遊戲，但大勢的持續必有其內在的原因，這內在的力量是不可抗拒的，無論誰如何反對它，反映這內在力量的大走勢一定會從頭走到尾。


    從部分獲利中，我學到的不亞於失敗。學股初期，在牛市中，我總喜歡股票升到一定地步先獲利，等待股票向下回檔時再入場。但真正的牛市，回檔總也等不到。應該賺兩萬元的，我結果只賺到兩千元。華爾街有個說法：你只要獲利就不會變窮。這說法雖然不錯，但應該賺兩萬元的牛市你只獲利兩千元，你也不會變有錢。我現在明白到，就算是傻瓜也有分層次的。


    分析錯誤會比分析勝利更有助幫助。但人們總是傾向忘記他們犯的錯誤，陶醉於勝利的喜悅。犯錯沒關係，重要的是同樣的錯誤不要犯兩次。


    市場走向和你的期待相反時，你希望每天都是最後一天，你的小虧最終成為大虧。市場走向和你的期待相同時，你恐懼明天會轉向，你過早離場。希望使你多虧了錢，恐懼使你少賺了錢。然而希望和恐懼都是人的天性。一位成功的炒手必須時時和人類根深蒂固的天性搏鬥。在充滿希望的時候，他必須恐懼；在恐懼的時候，他必須充滿希望。


    消化一個人的錯誤需要很多時間。人們說任何東西都有一體兩面，但股市只有一面，那就是正確的一面。所有的專業炒手都不在乎賺錢或虧錢，他們在乎在正確的時間做正確的事。因為他們知道利潤會隨之而來。


    一個人必須相信自己才能在這行生存。我從不接受別人的點子或內幕消息。我的經驗告訴我，沒有任何人的點子或內幕消息能比我自己的判斷創造更多利潤。


    我花了整整五年的時間才覺得自己能理智地玩炒股遊戲。


    這是難難且需要恆心的行業。炒手們要嘛全心投入，要嘛很快地從這行消失。


    # 傑克·施瓦格 (Jack Schwager)


    傑克·施瓦格是一位成功的作家。他炒過期貨，不過他的業績並不特別驚人。不過，他以與華爾街成功炒家們的面談為基礎寫成的《金融怪傑》(Market Wizards)
    卻是一本科關於炒股的暢銷書。


    在《金融怪傑》一書中，施瓦格整合了數十位優秀炒家的訪談資料，最終他總結出四十條「市場智慧」。以下是我認為非常值得重視而且沒有和本書重複的重點。標題後的解釋是我自己加註的，請讀過英文原版書的人諒解。


    - 一、確定你對專業投資生涯感興趣：很多人嘴上說對投資股票感興趣，實際上卻不是那麼回事，他們往往一遇到困難就放棄了。想在任何行業一夕致富是不現實的，除非你靠的是權力經商。

    - 二、檢查你買賣的動機：你若只想找刺激，雲霄飛車可能更合適，也更便宜。

    - 三、交易方式必須和個性相符：有些人買了股票就永遠不想賣，有些人持有股票超過三天就手癢，你要瞭解自己的個性。如果交易方法和個性不符，你不可能長久執行。

    - 四、你必須有「勝算」：如果你的每次交易都沒有超出五十%的獲勝機率，那麼無論你如何努力，勝利都可能是短期且不確定的。你可能嚴守自己的規則，也有很好的風險控制方法，但你還是會虧光所有的本錢。試著坦率地問問自己：「我真的有把握嗎？」如果你不能確定，通常這就表示你沒有把握，你的勝算不超過五十%。

    - 五、找一個方法：無論是短期交易還是長期持有，選擇買賣點都是有方法的。什麼方法不重要，重要的是有方法。這個方法必須適合你的個性，並且同時擁有勝算。你可以用技術分析，用基本分析，用道氏理論，隨便什麼都可以，但你一定要有方法。我必須特別提醒：找出這一點方法是痛苦而漫長的，否則這個世界將會塞滿百萬富翁。

    - 六、好的交易方法應該毫不費力：一個好的、適合你個性的交易方法應如行云流水般地毫不費力。時間到時就進，時間到時就出，一切清清楚楚。如果你對每一個步驟都有懷疑，做起來就很勉強，那麼這個方法應該不太正確。

    - 七、風險控制：施瓦格說，與他所面談的所有優秀炒家都認為「風險控制」遠比所有其它都更重要。因爲沒有什麼方法是百分之百穩賺，你必須避免被一場災難淘汰。

    - 八、自律：成功炒手最常提到的兩個字便是「自律」。「你可能聽到這兩個性超過一百萬次，但相信我它極其重要。」可以從兩方面理解這一個詞：第一、要維持有效的風險控制，你必須自律。第二、要實施你的交易方法，你必須自律。你如果有炒股經歷，你就明白要嚴守自己的規則是多麼困難。我常感嘆人爲什麼容易頭腦發熱，這其中也包括我自己。

    - 九、獨立思維和自信：就不多解釋這個字了，它們很重要。

    - 十、虧損是遊戲的一部分：既然沒有什麼方法是百分之百的，你必須在市場證明你錯誤時認錯。你必須明白，在炒股這行小虧損是不可避免的。

    - 十一、耐心：耐心地等待正確的出入場時機，買對了耐心坐等。記得傑西·李佛摩賺大錢的祕訣嗎？耐心是賺大錢的條件之一。「業餘炒手因爲大虧損而破產，專業炒手因獲小利而破產。」請所有的讀者記住這一華爾街的名言。

    - 十二、該出手時就出手：機會來了，不要遲疑，不要太小心謹慎。好機會不是常常有，不要猶豫不決，該出手時就出手。如果你覺得這句話聽到耳朵長繭了，那麼這句話的原文直譯是：「有時，行動比謹慎更重要。」

    - 十三、發現壓力的根源，解除壓力：一旦你發覺自己感到有壓力，表示某一部分分出了問題。就我自己的經驗，常常是因爲被套牢了。這時明智的做法是盡快解脫，直到晚上能睡安穩覺爲止。

    - 十四、尊重自己的直覺：直覺是長久實踐產生的專業感覺，不是瞎猜。好的會計師一看報表就能感覺到什麼地方可能有問題，這就是專業；炒股也一樣，一旦有了幾年的經驗，這些直覺通常很有價值，所以該出手時就出手。

    - 十五、價格的變動不是隨機的，你能戰勝市場：金融「隨機漫步」理論上在學術成立。但在實踐中，優秀炒手們已經證明例外多的是。希望讀者們明白，只要方法對，透過鍥而不捨你終能成功。


    最後，傑克·施瓦格強調：你要爲自己的結果負全部責任。也許你的損失是因爲聽取了「專家」的建議，或是你自己的監控系統出了問題，但責任還是在你自己身上。因爲「聽了或做」的決定還是自己做的。我還未見過任何一位成功的炒手將自己的虧損歸咎於他人。


    在掌握了一定的股票基本知識和炒股經驗之後，要想在股市行長期生存，炒股者最不應該忽視的就是自己的心理建設。人性中根深蒂固的恐懼、貪婪、希望影響著我們所做的每一個決定，使得我們常常做不到知道應該做到的事。


    要完全克服人性弱點很困難，但我們首先必須知道這些弱點以及正確做法。


    # 第 6 章


    ## 如何爲自己做好心理建設？


    想成為炒股專家，真正直接有用的專業知識並不多，但要實際地應用這些知識，卻是嚴酷的挑戰……


    只有在不斷地重複實踐，直到這些應該有的做法成為自然反應，成為直覺，你才有了正確的心態，這時你才真正學會了炒股。


    ### 第一節 阻礙炒股的心理障礙


    這個世界充斥著滿腦子幻想，但從不實踐的人；也有很多埋頭做事，卻從不幻想的人。那些滿懷理想，並且努力實踐實現理想的人少之又少，但是只有這些人才是生活中真正的成功者。他們每天都充滿活力，爲實現理想而努力，不計報酬。因爲工作的樂趣已是最大的報酬，他們把每個失敗和挫折都當成前進路上不可避免的障礙。


    從這一點來說，在股票這一行成功的條件與其他行業毫無區別。


    想成爲一位成功的股票投資人，你必須做到下述三點：


    - 第一、獲得炒股的基本知識。

    - 第二、制定確實可行的炒股計畫。

    - 第三、嚴格按照這個計畫實行。


    到目前為止，你已具備足夠的基本知識來判斷股票的走勢和股市大局，知道應該如何選股，如何決定買入點和賣出點。你已經有足夠的知識架構制定作戰計畫。


    股票的基本知識是死的，要學會它相對容易，制定作戰計畫也並不困難。困難在於如何將這些作戰計畫內化，自然地執行以及在必要時修改這些計畫。


    業餘和專業炒手的區別就在這裡。


    如何規劃作戰方案，決定於個人對風險的承受力，也決定於你預計的持股時間。你如果決定入股後就二十年不動，那自然有一套做法，你可以只選五檔股票，每檔股票投入你資本的二〇%之後就不再理它。二十年是很長的時間，五檔股票中可以有一檔股票翻了十倍，兩檔破產沒有了，兩檔不動，但如果這就是你的計畫就照著做吧。


    對一般中短期的炒手而言，如果你覺得自己對風險的承受力大，可以把雞蛋放入兩到三個籃子裡，而且給比較大的停損程度，例如二五%。如果自己覺得對風險的承受力小，可以選五至十檔股票分散風險，把停損點定在一〇%或更小。這類的選擇因人而異，也沒有哪種正確、哪種錯誤的講法。重要的是你要覺得舒服，覺得自己控制著情況。有些人可能喜歡將所有的資金只投資在同一支股票中，這也沒有問題，但如果因此緊張得睡不著覺，那麼這個方式就不正確了。


    現在我們談談，為什麼一般人總是不能嚴格執行原定計畫。如果我們對自己和對市場都有完美的瞭解，要做到第三點「嚴格按照計畫行事」其實很容易。問題是我們不完全瞭解自己，也不完全瞭解市場，我們只能「盡力而為」。這使得我們總是想盡辦法、找藉口不按規矩做事。因為嚴格執行常常刺激我們最軟弱的部位──「自我」。它包括對虧錢的恐懼、對認錯的抗拒、對不勞而獲的期望，一夕致富的夢想。


    #### 恐懼


    炒股是人類這種動物爭奪生存資源的鬥爭，一切人性都變得赤裸裸。先談談人的情感，人是有情感的，人的情感是心理上對外部條件對自身的受益或損害的反應。這基於我們在生活中的實踐，基於我們的價值觀念。


    我們有恐懼，就如同孩童害怕受到火的傷害，恐懼使孩童不敢再去玩火。這是對身體傷害的恐懼。我們害怕戰爭，因為戰爭摧毀生命和財產。我們從小教導小孩要「聽大人的話」、「聽話」逐漸成爲價值觀念的一部分，我們認為這是「正確」的價值觀。等我們長大後，自己成了大人，我們自然地將「聽大人的話」升格成「聽主管的話」、「聽專家的話」、「聽權威的話」。


    小時候「不聽話」時所受的責罰使我們恐懼日後不聽「上一級」的話會導致的後果。我們恐懼虧錢，小時候我們用金錢交換糖果、交換衣服，我們知道失去金錢就失去交換這些令人愉快物質的媒介。所以我們在股市也不願虧錢，恐懼使我們無法停損。


    恐懼是有傳染性的。聽到戰爭的時候，人人都充滿恐懼，雖然遠離戰場的普通百姓，受到身體傷害的可能性其實很小，但因為大家都恐懼，所以我們也恐懼。在股市上，熊市來了，反向出場。


    股民們開始恐懼，我們也隨其他股民的恐懼而恐懼。事實是當普通股民感到恐懼的時候，熊市通常已接近尾聲。但我們絕沒有膽量在當時逆大衆心理而動，恐懼使我們在應該進場的時候反而出場。


    恐懼有很強的記憶能力。你如果在股市經歷了一個可怕的虧損，你將恐懼同樣的經歷會重新出現。在下一次投資的時候，你的判斷力就會受到這個經歷的影響，任何可能有麻煩的跡象，無論這跡象是多麼小，多麼基於想像，你都将做出離場的決定，以避免再次受到傷害。這就是炒手們常常過早離場的原因。應該獲利五萬元的機會，你可能只得到五千元。上次你有了賺錢股票以虧錢收場的慘痛經歷，你這次要避免同樣的傷痛，什麼走勢、大市、分析等等你都顧不得了。


    一般的人同樣恐懼不隨大流。股市出了熱門股，人人都在追捧，你有能力抵抗誘惑嗎？你對「未隨大流」的恐懼和失去「賺大錢」機會的擔心常常使你在股票的最高點入股。


    #### 貪婪


    貪婪是情緒反應的另一極端，它在股市上的表現就是在最短的時間內賺很多的錢。錢永遠不夠，你曾聽過有人嫌薪水太高、福利太好的嗎？無論得到什麼，得到多少，你總會編出理由證明你應該得到更多。這一方面出自人這種動物對爭生存資源的自然反應，另一方面源自對自己的無知，對外界的無知，這就是所謂的缺乏自知之明。在股票投資上，這種情緒極其有害。


    首先，它會使你失去理性判斷的能力，不管股市的具體環境，你無法讓錢閒著，你勉強入市。沒錯，資金不入市不可能賺錢，但貪婪使你忘記了入市的資金也可能虧掉。不顧外在條件，不斷地在股市跳進跳出是還未能控制情緒的股市新手的典型表現之一。


    貪婪也使你忘記了分散風險。


    「我這注要賭大的！」若是你腦袋裡甜滋滋地想像著這檔股票翻兩倍的景象，卻忽略了股票跌的話該怎麼辦？


    新手的另一種典型表現是在加股的選擇上。你買了三三百股十元的股票，如果升到十五元，你開始在肚子裡頭嘀咕：如果當時我買一千股的話該多好！同時你開始想像股票會升到二十元，你立刻多買了三千股，把你的絕大部分本金都投入到這檔股票上。假設這時股票跌了一元，你一下子從原先的一千五百元利潤變成倒虧一千八百元。這時你失去思考能力，希望開始取代貪婪，你希望這是暫時的回檔，它很快就會回到上升之路，直升至二十元。你可能看到虧損一天天地加大，你每天都睡不好。


    我不是說加股就是不對的，我是說情緒性地加股是不對的，特別在貪婪控制你的情緒之時。你是否被貪婪控制，自己最清楚。我是過來人，我知道那個感覺。不要編故事來掩飾自己的貪婪。


    #### 希望


    話又說回來。如果你原先的計畫就是先用三百股來試市場，你很清楚何時加股，應該加多少，情況不對的時候何時退場，你將不會有焦慮失眠等問題。因為部分的勝利而引發貪婪，情緒化地用貪婪引導行動，它終將引致災難。


    股票不斷爬升，你終於等不及，於是你進場了，希望股票會繼續升。但不幸的是，一旦你進場之後，股票便開始下跌，你的帳面損失一天天增加。很自然地，你希望股價能回升到你入市的價格，讓你全身而退。這種希望是阻止你進行理性思考的障礙之一。


    一旦懷抱了「希望」之後，你每天都在尋找對你有利的資訊，忽略對你不利的資訊。就如同一般人對表揚常記於心，把批評當耳邊風一樣。你每天都希望股票能夠做對你有利的運動，而不是客觀地判斷市場。


    希望，可以被定義成「對某種事物的期待」。成功的投資必須理性判斷今天和未來所發生的事件對股票的可能影響，「希望」在這個判斷過程中不應佔有任何地位。股票的運動絕不以你的希望為轉移，它會走自己的路。


    別忘了你買的股票都是其他人賣給你的。你有一定的期望，至少有相同的人持有相反的期望。沒有理由認爲股市對你特別偏愛。


    每次進的股票開始虧錢，你必須嚴肅地問自己：我原先買這檔股票的理由對嗎？再進一步問自己：如果今天沒有這檔股票，手上有餘錢，我還會買這檔股票嗎？如果答案是肯定的，就沒有賣出的必要；如果不是，那麼你在用希望取代理性判斷。趕快賣股走人吧。這樣做有兩個明顯的結果：一是防止小虧損慢慢累積成致命大虧損；二是你失掉了包袱，容易開始新的市場觀察，尋找下一個機會。


    以上討論了三個影響我們做決定的心理因素，是不是就全部包含在內了呢？當然不是。人的情緒是千變萬化的。我不是研究心理學的，更深一步的研究我們留給心理學家。但我可以這麼說：因爲這三個心理因素影響炒股而犯錯誤的機率達九九％以上。


    瞭解了這些心理因素，我們就有了借鑑的根據，爲什麼我們訂好了計畫，在執行中總是會出差？爲什麼我們會犯那些事後回想起來覺得不可思議的錯誤？這些錯誤若照原定計畫嚴格執行的話完全可以避免。


    摔了跤，我們首先要明白爲什麼摔跤，是踏到香蕉皮還是踩到西瓜皮？接下來我們才知道該採取什麼樣的措施防止未來再摔同樣的跤。


    ### 第二節 心理訓練


    這本書所講的一切規則都是說明如何克服這些影響炒股成功的心理障礙。如果將自己訓練到完全克服這些心理障礙，就不再需要這些規則，它們就可以自然而然、隨心所欲地發自內心。此時，你便從有招的業餘選手進步到無招的炒股高手。但是這條路十分艱苦漫長，你不僅需要戰勝自然——學習炒股的知識，你還得戰勝自己——克服根深蒂固的恐懼、希望和貪婪這些先天性的心理障礙，並且逐漸養成正確心態。


    #### 什麼是正確的心態？


    要成為炒股專家，真正直接有用的專業知識並不多，它比成為一位普通工程師的要求少多了。但要真正地應用這些知識，卻是嚴酷的挑戰。因爲這些知識並沒有嚴格的對錯之分，其對錯因人而異。人做爲有智慧的動物，它的特性之一就是學習的能力。無論是炒股知識還是如何應用這些知識，都可經由學習得到。但你需要具備一定的素質，要有正確的心態。這些素質和心態是一般人或多或少都具備，但具備這些條件並不夠，還需要做到完美。具備這些條件只能讓你有時賺到錢，只有盡力使這些素質達到完美境界，你才會有信心不斷賺到錢。這些正確的心態至少包括以下幾方面：

