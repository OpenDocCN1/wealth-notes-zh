    # 依風險承受力買股，最終達財務自由


    # 新序


    這本書十六年前曾由三聯書店出版，得到不少讀者譽稱為「中國人寫的炒股經典」，我深感榮幸。今次全新版本問世，書中已受時間檢驗的內容基本上保持不變。


    在這十六年間，中國股市從初始到市值排名世界第二，僅列美國之後。這是了不起的進步，中國正以前所未有的速度拓展著經濟版圖，做為股市的參與者、有耐心的股友，同樣收穫了經濟成長的果實。


    就炒股而言，股市沒有新東西。十六年前炒股和今天一樣，十六年後炒股也將和今天一樣。但我希望補充「風險管理」的重要性，因此特別增加了第九章〈善戰者無赫赫之功〉，我想說明的是，股票戰役是打不完的，而且想打隨時可以開打，但打這種戰不應行險鬥狠，試圖畢其功於一役之勝，集小勝為大勝，最後達致財務自由，才是成為股市最終勝利者的智慧之路。


    在此次的新版中，我對於如何預期股市報酬做了簡單的介紹，像是對投資的報酬預期將如何影響資產配置的基礎。舉例來說，有報導提到二○一五年七月，中國有三萬個五百萬人'
  - '[PAGE 13]


    民幣股票戶口被消滅。這是個驚人的數字！如果不是試圖在股市以高風險賭股，這樣的悲劇完全可以避免。在股市，每一分報酬都是以風險做爲代價得來的。


    應讀者要求，我在二〇〇一年設立了「炒股的智慧網」（www.cgbh.com），給讀者們一個鍛練自己、同時和網友互相交流的場所，歡迎讀者們利用。學炒股就像學游泳，無論講了多少大道理，不下水是不行的。游泳是在嘻水的過程中學會，而不是講道理學會的。「炒股的智慧網」就是一個下水的地方。


    這本書鼓勵讀者按風險承受力來制定操作計畫，一個健全可行的具體操作計畫應該包括下列幾方面：


    +   一、進點；


    +   二、停損；


    +   三、賣點；


    +   四、風險（每手應承擔的風險）。


    # 建議：


    不過上述這些要求對大多數讀者來說似乎太高，我在這裡特別提供幾點具體簡明的操作'
  - '[PAGE 14]


    +   一、不管什麼股票，買股前先看看二五〇天的平均線。只買二五〇天均線以上的股票，最好在股價從二五〇天均線之下穿越到二五〇天均線之上時買入；


    +   二、進股後給個五％～八％的止損；


    +   三、只要股價在二五〇天均線之上，坐等！有時可能股價幾年都不回到二五〇天均線之下。一旦股價再回碰到二五〇天均線，賣掉！


    +   四、每手不要下超過本金的一〇％。


    這些做法簡單實用，若股友們願照做，請記住一定要勇往直前，別爲自己找理由。規矩就是規矩，按既定方針進行。股友們當然也可用二〇〇天、一五〇天或三〇〇天均線，中心思想就是牛市時抓中間一段，熊市時避開。請大家記住，你永遠不知道股價會跌多低，你也不知道股價會升多高。賺錢要慢慢來，不要心急！


    謹藉此向編輯盧珊如女士表達謝意；也謝謝讀這本書的您，並祝大家好運！'
