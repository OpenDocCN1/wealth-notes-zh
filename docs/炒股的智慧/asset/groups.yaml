    \n# 新序\n## 依風險承受力買股，最終達財務自由\n\n這本書十六年前曾由三聯書店出版，得到不少讀者譽稱為「中國人寫的炒股經典」，我深感榮幸。今次全新版本問世，書中已受時間檢驗的內容基本上保持不變。\n\
    \n在這十六年間，中國股市從初始到市值排名世界第二，僅列美國之後。這是了不起的進步，中國正以前所未有的速度拓展著經濟版圖，做為股市的參與者、有耐心的股友，同樣收穫了經濟成長的果實。\n\
    \n就炒股而言，股市沒有新東西。十六年前炒股和今天一樣，十六年後炒股也將和今天一樣。但我希望補充「風險管理」的重要性，因此特別增加了第九章〈善戰者無赫赫之功〉，我想說明的是，股票戰役是打不完的，而且想打隨時可以開打，但打這種戰不應行險鬥狠，試圖畢其功於一役之勝，集小勝為大勝，最後達致財務自由，才是成為股市最終勝利者的智慧之路。\n\
    \n在此次的新版中，我對於如何預期股市報酬做了簡單的介紹，像是對投資的報酬預期將如何影響資產配置的基礎。舉例來說，有報導提到二○一五年七月，中國有三萬五千個股票戶口被消滅。這是個驚人的數字！如果不是試圖在股市以高風險賭股，這樣的悲劇完全可以避免。在股市，每一分報酬都是以風險做爲代價得來的。\n\
    \n應讀者要求，我在二〇〇一年設立了「炒股的智慧網」（www.cgbh.com），給讀者們一個鍛練自己、同時和網友互相交流的場所，歡迎讀者們利用。學炒股就像學游泳，無論講了多少大道理，不下水是不行的。游泳是在嘻水的過程中學會，而不是講道理學會的。「炒股的智慧網」就是一個下水的地方。\n\
    \n這本書鼓勵讀者按風險承受力來制定操作計畫，一個健全可行的具體操作計畫應該包括下列幾方面：\n- 一、進點；\n- 二、停損；\n- 三、賣點；\n- 四、風險（每手應承擔的風險）。\n\
    \n**建議：**\n\n不過上述這些要求對大多數讀者來說似乎太高，我在這裡特別提供幾點具體簡明的操作：\n- 一、不管什麼股票，買股前先看看二五〇天的平均線。只買二五〇天均線以上的股票，最好在股價從二五〇天均線之下穿越到二五〇天均線之上時買入；\n\
    - 二、進股後給個五％～八％的止損；\n- 三、只要股價在二五〇天均線之上，坐等！有時可能股價幾年都不回到二五〇天均線之下。一旦股價再回碰到二五〇天均線，賣掉！\n\
    - 四、每手不要下超過本金的一〇％。\n\n這些做法簡單實用，若股友們願照做，請記住一定要勇往直前，別爲自己找理由。規矩就是規矩，按既定方針進行。股友們當然也可用二〇〇天、一五〇天或三〇〇天均線，中心思想就是牛市時抓中間一段，熊市時避開。請大家記住，你永遠不知道股價會跌多低，你也不知道股價會升多高。賺錢要慢慢來，不要心急！\n\
    \n謹藉此向編輯盧珊如女士表達謝意；也謝謝讀這本書的您，並祝大家好運！\n\n# 前言\n## 我是職業投資人\n\n我靠炒股維生。\n\n這是一本寫給有心成為炒股專家的人的書。如果你炒股的目的是業餘消遣的話，這本書並不適合你，因為按照本書所說的去做，你將失去「小賭怡情」的樂趣。\n\
    \n想成為炒股專家，你需要專心致志、廢寢忘食地學習和實踐。這和成為其他行業專家的要求並無兩樣。想要成功，聰明、努力、經驗和運氣缺一不可。運氣往往偏愛最努力的人，而不是最聰明的人。\n\
    \n## 這本書不只談股票\n\n這不是一本股票常識簡介，因為我期待這本書的讀者已具備這方面的基本知識。我還期待讀者有一定的炒股經驗。不把錢押在股市，你就無法體驗到股價升落所帶來的貪婪、恐懼和希望，也就很難明白這本書所提供的炒股規則。\n\
    \n話說回來，雖然這本書是為炒股所寫，我相信書中闡述的原理適合任何行業。成功的人士往往具有很多相似的素質，如果你具有炒股成功所需的素質，在其他行業，我相信你也能獲得成功。所以不曾、也不打算炒股的你如果偶然得到了這本小書，不妨一讀。\n\
    \n## 親身的體驗和觀察\n\n金融是龐大的行業，影響股價波動的因素數之不盡，有關的知識也列之不盡。要寫本炒股的書，如何選材，從什麼角度寫，很不容易決定。我如果也在「著」前加個「編」的話，這一「編」可能會把這本書編到經濟學大辭典那麼厚。我不喜歡太厚本子。這本書寫的都是我的親身體驗和觀察，都是我認為和炒股有最直接關係的知識。我期待讀者每次在炒股中犯了錯誤以後，或多或少地能在這本書中找到犯錯原因，找到不再犯同樣錯誤的答案。最起碼，知道什麼是錯誤的。\n\
    \n犯錯並不可怕，可怕的是不知自己犯了錯，知錯卻不肯認錯就更加不可救藥。無論想在什麼行業成功，你需要有成功的欲望，實現這個欲望的知識及應用這些知識的毅力。我將一步一步地告訴你在炒股中做到這些的方法。\n\
    \n我在美國生活了三十二年，和來自全世界不同種族和文化背景的人打過交道，結識人性共通。我在商學院學的專業是國際金融，研究過世界各地的金融市場，結論是它們的變化規律都一樣。\n\
    \n你學會了炒股的技能，就真正掌握了走遍天下都不怕的一技之長。\n\n這本書沒有任何理論和公式，它是我炒股二十多年來的觀察和經驗之總結。其中最近幾年我專職炒股。這本書裡的每條規則，我都沒少付學費，我希望讀者們能因為讀了這本書而少付些代價。\n\
    \n有些人把炒股當成投資，有些人把炒股當成投機。記得英國銀行家歐內斯特·凱索爾（Sir Ernest Cassel）是這麼說的：「當我年輕時人們稱我是投機客，賺了這些錢後人們稱我是投資專家，之後再敬我是銀行家，今天我被稱為慈善家。但這幾十年來，我從頭到尾做的是同樣的事。」我找到比這更好的解釋「投資」和「投機」的語句。\n\
    \n## 買股容易，賺錢難\n\n在股市偶爾賺點錢很容易，真正的困難在於「如何不斷地從股市賺到錢」，炒股也是一個行業，任何行業之所以能夠成爲行業，是因爲它能夠不斷地提供入行者收入來養家糊口，否則便不可能成爲一行。養豬是一行、種菜是一行、炒股也是一行。炒股這行的特點是入行極其困難。看看你周圍的朋友們，入行容易的行業通常辛苦，報酬也低；而那些入行困難的行業，一旦成功地入了行，你以後的日子往往很好過。炒股就是這樣的行業。\n\
    \n有些人一入股市便掹了幾個錢，他們通常會認為炒股很容易，但我得說這是錯覺。說白了這只是初學者的運氣，這些錢是股市暫時「借」給你的，股市遲早會把錢收回去，不信的話你就等三年看看。只有在你成爲專家之後，才可能不斷地從股市賺到錢並把錢留下來。\n\
    \n這本書將教你如何做到這一點。\n\n對還未入行的人來說，炒股是壓力極大的行業。因為賺錢時，你不知自己為何賺了錢，你不知下次要如何做才能重複賺錢的經歷；虧錢時，你不明白自己為何虧錢，下次要如何做才能防止再次虧錢。我希望你能在這本書中找到解決這些問題的答案。\n\
    \n想在炒股這行成功，其中並無祕訣，和炒股直接相關的知識其實也並不多，否則街角賣茶葉蛋的老太太不可能偶爾也在股市露一手。至今我還未見過賣茶葉蛋的老太太偶爾客串設計衛星導彈。\n\
    \n股票不是上就是下，否則就不動。我想像不出股票還有第四種的運動方式。阻礙一般人在這行成功的不是股票有多麼複雜，而在於人本身有很多缺點。\n\n## 各章重點提要\n\
    \n**第一章〈炒股的挑戰〉**，就是談股市的特性及它對人性的挑戰。\n\n**第二章〈股票分析的基本知識〉**，講一些和炒股最直接相關的知識。讀者應帶著兩個疑問來讀這一章：\n\
    - 一、什麼是影響股價的因素？\n- 二、股票在什麼情況下正常運動？\n\n這一章包括三個部分：基本分析、技術分析及股票的大市。當這三部分的分析都給你正面信號時，就是你在股市勝算最大的時候。\n\
    \n**第三章〈炒股成功的要素〉**，談成功的要素。這一章將告訴你，若想要炒股成功應該做的事以及如何做到，還告訴你應具備何種心理素質，知道方法並不難，難就難在如何完整地去實踐。\n\
    \n**第四章〈何時買股票？何時賣股票？〉**，在這一章你看不到「低點買入要謹慎，高點賣出要果斷」之類的廢話，什麼時候才是低？高到多高才是高？在辦公室空想出來的炒股絕招沒有什麼實用價值。買賣股票的重點在於如何尋找「臨界點」。希望這一章能改變你腦海中關於炒股的思維模式。\n\
    \n**第五章《華爾街的家訓》**，英國科學家牛頓（Sir Isaac Newton）說：「我之所以能看得更遠，是因為我站在巨人的肩膀上。」在這一章，讓我們看看炒股這行的前輩們給我們留下了什麼經驗。\n\
    \n**第六章《如何爲自己做好心理建設？》**，這一章談心理建設。人性中根深蒂固的恐懼、希望、貪婪影響著我們所做的每一個決定，使我們常常做不到自己該做的事。要完全克服人性中的弱點很困難，但我們首先必須知道人性弱點是什麼及正確的做法。\n\
    \n**第七章《抓住大機會》**，分析大機會的定義及其特點。這一章並非單純地談股票。\n\n**第八章《和炒手們聊聊天》**，在這一章我簡述了我的學習歷程。如果人性共通的說法沒錯的話，你的學習之路應該和我相似。希望你在學習投資股票的掙扎過程中因爲有了目標能更平順一些。\n\
    \n**第九章《善戰者無赫赫之功》**是特別全新增加的一章。大家在前面章節學習了如何提高在股市的致勝率，學習了什麼是在股市應有的心態。這一章將告訴大家爲什麼及如何分散風險。如何以預期的報酬調整資產配置。我將告訴大家炒股這一行的最後成功者通常不行險鬥狠、孤注一擲。最終的成功者會不斷累積小勝成為大勝，最終達到財務自由的境界。\n\
    \n在今天，我看到很多人爲金錢不擇手段。而這本又是教人如何賺錢的書，不在附錄加點「金錢的反思」讓我覺得這本書不夠平衡。如果因爲這篇附錄能使讀者對人生有更進一步的認識，我會覺得努力沒有白費。\n\
    最後，謝謝你讀這本書！\n\n# 楔子\n## 三則故事\n\n### 第一則：年輕人的故事\n\n從前，有位鄉下青年，讀了點書，嫌鄉村的生活單調，決定要去城裡闖世界。臨走時他向村長請教，村長給了他三個字的忠告：「不要怕」。並說等他回來時還有另三個字相贈。\n\
    \n三十年後，飽經風霜的青年帶著滿頭白髮決定還是回到鄉村生活。回來時，得知當年的村長已死，心中悵然若失，不知村長另外要贈的三字是什麼。後來村長兒子轉交給他一個信封，說是長者臨死前囁咐交給他的。信裡只有三個字：「不要悔」。\n\
    \n### 第二則：賭博的故事\n\n這是則老故事。中國以前流行賭骨牌。骨牌從一到三十六共有三十六個數字。賭客任押其中的一個數字，莊家開牌只開一個數字。如果被賭客押中的話，一賠三十五。\n\
    \n有位老賭客很久都沒有贏過。有一天，他拿了三十六個賭注入場，告訴莊家說：「我不\n"
  mdcn: "\n# 炒股的智慧\n教你持續、長期、穩定買股，讓錢自然流進來\n陳江挺 著\n\n# 推薦序 1\n## 亂世動盪中，亟需擁有的炒股智慧\n文／阮慕驊\n\
    \n二〇一五年台股跌掉近千點，股民損失慘重，股市是零和游戏，有人賠就有人賺，賺賠只在一念之間、一瞬間！這個道理再簡單不過了，不過讀者們可以思考，如果您常敗軍，可以思考一下，在您做出每個買進與賣出的決策時，自己是不是有錯誤的慣性邏輯，以致造成這樣的結果。\n\
    \n我觀察到，股民十有九輸，真正能從股市套錢出場的，僅是少數人，而這些少數人必有其操作邏輯和法則，大多數人在股市之中充其量只不過是隨勢浮沉，賺賺賠賠而已。\n\
    \n《炒股的智慧》作者陳江挺先生提供了許多股市操作經驗和法則，可為讀者重新思考自身的操作策略並與之對照，江挺兄是股市操作的成功者，若讀者在股海之中抓不到方向，參考成功的經驗法則不失爲好的方法。\n\
    \n我對江挺兄在書中所提的一些股市操作邏輯特別有感，在此提出分享：首先書中明確指出，「炒股不是科學，是藝術」。的確，科學講的是可重複性的規律，但股市永遠沒有一定的規律，所以我特別要警惕股民的是，千萬不要對股票的變化預設立場，因為「股市唯一不變的就是一直在變」。\n\
    \n此外，江挺兄特別提到股票操作要有一定的紀律，例如停利停損、每手本金比例及只買進多頭架構的股票等，這些我都非常認同。股市沒有規律，但股民要守紀律。如果說股市裡有金科玉律，那麼「操作的紀律」就是其一吧！我聽過太多賠錢的故事都是違反了紀律和原則，也看過很多賺錢的例子是遵循紀律和原則。\n\
    \n股市浮沉，要能做到江挺兄書中所言「敗而不倒，追求卓越」必定要有堅毅的人格特質，通常這種膽大心細的人，才能在股市之中賺取大財富。但多數股民是虧了錢就怨天尤人，「性格決定命運」，股市之中要有特殊的人格特質敢於人之所不敢，斷於人之所不斷才是贏家的特質。\n\
    \n依我的經驗而言，股市致勝的邏輯是「要於不疑處有疑」，並且常問「為什麼」股市的變動必有其前兆，但往往被人所忽略，所以股市需處處存疑且時時發問，市場的任何消息和波動都要問為什麼，以及這些現象代表什麼意義，不要過度樂觀也不要過度悲觀，不要預設立場，需要謀定後動，並設想各種可能情況發生之下，手中持股和資金要如何應對。\n\
    \n股票套牢不可怕，可怕的是不知如何應變！賠錢不可怕，可怕的是心灰意冷無力再戰。股市贏家不見得有好的學歷，但多數有豐富的人生經驗和清晰的頭腦，臨危不亂。\n\
    \n二〇一六年的全球股市充滿了變數，各種黑天鵝可能伺機而出，開年股市大跌即是二〇一六年来最差的格局，中國大陸的股匯雙崩、美國的升息、歐日的經濟困局與原物料的崩跌，在在都考驗著股民，尤其台灣面臨政局的大變動，以及產業結構和經濟發展的瓶頸，台股未來的波動和風險應該是極大的。此時此刻，遠流出版了《炒股的智慧》這本書，在新的⼀年開始提供股民思考空間，是讀者的福音。\n\
    \n（本文作者為財經專家）\n\n# 推薦文 2\n## 善炒股者集小贏爲大贏\n文／張智超\n\n我靠炒股維生。\n\n作者陳江挺在本書《炒股的智慧》一開始就直接破題，也許看來輕鬆寫意，但當您將整本書徹頭徹尾讀完一遍後，應該會大嘆一口氣，沒想到炒股維生竟是如此困難啊！\n\
    \n恰好我也是一位以交易維生的操盤手，多年的專業操盤人經驗，讓我一拿到此書時竟無法放下，一口氣全部拜讀完畢，內容實在是太精彩。某些橋段，我如同身歷其境，有時心驚膽戰，有時豁然開朗，最後總是受益良多。\n\
    \n要成爲一位成功的金融操盤人，也就是本書所說的「炒股專家」，除了需要具備股票分析的基本知識，還需要深入了解金融商品價格變動的原因、買賣的時機、應該投入的金額、何時應該停損...。在學會上述知識與原理後，很抱歉，您只是取得了炒股的一張門票，真正的拼搏還未開始。\n\
    \n如同作者提到學股需要經過四個階段：\n- 一、蠻幹階段；\n- 二、摸索階段；\n- 三、體驗風險階段；\n- 四、久賭必贏階段。\n\n爾後還是需要不斷的試煉與學習，投資所需要面臨的挫折與挑戰永不停止，這是一場漫長的自我挑戰。\n\
    \n專業操盤人就像職業的賭客，我們的輸贏取決於兩件事。首先是每次下注的勝率，再來就是下注的金額，這兩件事息息相關：勝率大時，下注金額必須放大；反之，我們必須小心的試單。\n\
    \n金融市場操盤人必須認清一個殘酷的事實：市場沒有交易聖杯，只有完美的交易策略，才可以在市場上持續大賺小賠，累積財富。而勝率取決於兩件事，即標的物本身的價值與進場的時機點。本書作者提出了「臨界點」操作，並建議了移動停利、停損點，這方法可以有效地降低人性的弱點，並進一步限制虧損的幅度，如果讀者能再利用全方位思考提升交易勝率，並且把「資金管理」做好，那提升操盤功力便指日可待了。\n\
    \n本書第九章〈善戰者無赫赫之功〉特別討論了風險管理，我建議每位讀者一定要放慢腳步仔細閱讀此章並細細思量，我個人相當推崇作者的想法，作者提及的「善戰者無赫赫之功」以及曾國藩的事蹟，實在是深得我心，正所謂善戰者集小勝為大勝，善炒股者集小贏為大贏，日進有功，穩定獲利才是正道，炒股之路才能走得穩健長久。\n\
    \n炒股這件事可說是對一個人的最大考驗，在它面前，我們都會原形畢露，不貪婪、不怕，絕對是天方夜譚，每天都要接受新的變化與挑戰，明天跟今天絕對不一樣，隨時都要準備突發狀況。虧損、沮喪、絕望都是家常便飯，但我還是熱愛這樣一個具有豐富挑戰性的事業，引用作者書中所述：「如果人生能夠重新選擇的話，我還會選擇炒股維生。」\n\
    \n很榮幸能向您推薦《炒股的智慧》這本書，反覆閱讀、體會再三後，必定能讓您在炒股這條路上更有方法、更具信心。\n\n（本文作者為富邦證券自營部副總經理）\n\
