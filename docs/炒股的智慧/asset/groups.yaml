    # 第三則：小偷的故事


    從前有個人以偷竊維生。這個小偷的兒子有一天對他說： 「爸爸，我要像你一樣以偷維生，你教我怎麼偷東西吧！ 」小偷看著兒子那副尖嘴猴腮的模樣，好逸惡勞的個性，心想：這個孩子若不學會偷竊，日後或許會餓死，於是他便答應了。


    一天晚上，小偷帶著兒子到了一棟大房子前，在牆上挖個洞爬進大房子。他們找到儲藏'
