    姓放三%的定金買十萬噸黃豆做什麼？吃又吃不完，放也找不到地方放，他們目的完全是「炒作」。將自己炒股失敗歸咎於股市受到操縱，這是失敗者爲自己的失敗找藉口。


    問：你認為影響股價的最重要因素是什麼？


