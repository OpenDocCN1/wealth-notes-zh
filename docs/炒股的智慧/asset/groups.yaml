    票的運動是否正常。停損點應如何定呢？有兩種方法：


    第一、A 為十五元，把停損點定在十四元。第二、B 為十三元，把停損點定在十三元。


    這得看你对風險的承受力。但無論如何，一且股價跌穿 B 點時就必須走人。記得升勢的定義嗎？正常的升勢應該一浪高過一浪，如果股價高過 A 但隨即擊穿 B，表示升勢已被暫時否定。你必須在場外觀望，重新尋找機會。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_130_0.png)


    # 二、阻力線和支撐線的操作（圖 4-2）


    阻力線上的買點及停損點的標示。假設阻力線是十五元，一且股價突破十五元，即可考慮入場。把停損點定在十四、五○元或十四元。永遠記住只能虧小錢。股票一且穿越阻力線，正常運動是繼續上升，如果又跌穿回頭，表示股票運動不正常，早先的穿越是'
  - '[PAGE 131]


    假信號，可能是大戶搗鬼。


    有時股票跌到你的停損點又馬上回頭，這也不要緊，你可以再入場，再入場的點以上一波的高點所示。這類場合常常碰到，但這是唯一正確的做法。虧的錢等於買了保險，防止了虧大錢的可能。


    圖4-3 支撐線的買點及停損點的標示。


    如果股價一碰到支撐線就反彈，你有理由相信此時股價接近谷底。但如果買入的話，你必須在支撐線之下定個停損點。因為股票價格跌穿支撐線，繼續下跌的機率就大過上升的機率。


    # 三、雙肩圖和頭肩圖的操作


