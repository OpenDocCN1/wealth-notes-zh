    圖 4-10 在突破阻力線之前的蓄勁期是三个月，圖 4-11 是半年，你要買圖 4-10 或圖 4-11 其中之一，你會選哪種？答案如果是圖 4-11，你就選擇對了。被套牢是極其不愉快的經歷，晚上睡覺時想到這檔股票都睡不好！很多人撐不住乾脆就割肉認賠殺出算了。蓄勁期愈久，那些被套牢還未割肉的投資者就愈少，它上升時的阻力也就愈小。


    # 形成自己的風格模式


    股票買賣是藝術，不是科學，它沒有固定的模式。我希望讀者讀到這裡時已經能感覺到股價變化過程中投資大眾心理波動的脈絡，能明白大衆爲什麼買股票？爲什麼賣股票？心理過程如何變化？你如何從這個過程中受益？股票價格的短期波動很多是大戶操縱的結果，但大戶不能說想升就讓股票升，他們還是要用「買股票」的方式讓股票升漲，這個尾巴無法掩住。


    找個清靜的地方，細細思考一下臨界點是怎樣形成'
