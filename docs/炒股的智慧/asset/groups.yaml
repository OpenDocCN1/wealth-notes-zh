    想再賭了，但在我收手之前，我一定要贏一次。今天我拿了三十六個賭注入場，從一押到了三十六，我不可能一個數字都押不到，明天我就收手不賭了。 」講完他就去上廁所，途中從他的懷中掉了一個紅布包好的賭注，莊家趁賭客沒注意，偷偷地把這一注收起來，打開一看是十二。


