    # 三、體驗風險階段


    摸索階段的下一步是體驗風險階段。有時這兩個階段是同時進行的。遺憾的是，體驗風險階段的你常要虧大錢，不虧上一兩次大錢，你不會明白什麼叫風險，你也還不可能畢業。只有在虧錢虧得吃不下、睡不著的時候，你才會真反足炒股為什麼會有些行規。也就是在什麼時候，行規的意思變得很清楚。有了這個經歷，再去讀讀第二章第二節「如何在股市下注？下多少注？」的內容，你就明白白我在說什麼了。


    我每次賺了大錢，隨即常常來一次虧大錢，因為每次賺了大錢，都讓我覺得自己「懂」了。這樣的經歷重複了好多次。這或許就如同游泳一樣，那些不幸罹難的都是「自己覺得」會游泳的人。知道自己不會游泳或真正知道怎樣游泳的人通常不會淹死。


    如果虧大錢的經歷發生在你的蠻幹階段，我對你深表同情；但如果你確實確實有了幾年的炒股經驗，對研究股票及其運動規律下過苦功，這時虧大錢常常是你大成之前的最後考驗，請千萬不要放棄！那些著名的炒股名家，在他們成「家」之前通常都有一次甚至幾次的破產經歷。其中包括本中提到傑西·李佛摩和伯納德·巴魯克。


    在忍無可忍的時候，請再忍一忍。'
