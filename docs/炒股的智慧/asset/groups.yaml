    ## 股票的正常運動和週期運動


    ### 一、股票的正常運動


    把握股票走勢最關鍵之處，便是判斷股票是否處於正常運動狀態。我認為下列幾點有助於讀者從概念和操作上體會和掌握股票的正常運動。


    - 股票的走勢及走勢線：在正常的升勢中，每個波浪的最高點應較上個波浪的最高點為高，最低點也應較上個最低點為高。整個股價的運動應該在走勢線之上。在正常的跌勢中，波浪應一浪低過一浪，最高點較上個最高點爲低，最低點也較上個最低點爲低。

    - 支持線和阻力線：一旦阻力線被突破，股票應該繼續上升，雖然可能有回檔，但回檔不應該跌到阻力線之下，否則便是不正常運動。同樣的，一旦支持線被突破，股票應往下跌，否則的話，便是不正常運動。如果股票一跌破支持線便反彈到支持線之上，那可能就是買股的好時機。

    - 雙肩圖和頭肩圖：和上述道理相同，一旦股價穿越突破點，它應該能夠繼續，否則的話便可認爲是不正常運動。

    - 平均線：以二○○天平均線爲例，一個正常的升勢，股價應在二○○天平均線之上；一個正常的跌勢，股價應在平均線之下波動。否則，都可以認爲是不正常運動。


    ### 一、股票的週期性運動


    在華爾街百多年的歷史中，發展出很多理論來描述股票的波動現象。例如：道氏理論(Dow Theory)、艾略特波浪理論(Elliot Wave Theory)等等。這些理論有假設、有論證、讀起來又長乏味，但它們歷久不衰，自有其參考價值。就我個人的體會，這些理論很難在實踐中應用。除非你是只看大勢、手握鉅資的基金管理人。


    隨著自己對股市認識的增加，終於明白這些「玄妙」的理論無非在講經濟週期。任何學過點經濟學的人都明白經濟週期是什麼。以下我將簡單地解釋經濟週期如何在股價上反映出來，這些知識能加深你對股市的認識。


    可以將股票運動大約分成四個時期，分別爲蓄勁期、爬坡期、疲勞期和下坡期。


    - （一）蓄勁期：買賣雙方的力量基本平衡；

    - （二）爬坡期：買壓勝過賣壓；

    - （三）疲勞期：買壓和賣壓又基本持平；

    - （四）下坡期：賣壓強過買壓。


    在任何時期，股票的波動都是波浪形的。每個大波動內包含有很多反向的小波動。平均線將中和這些小波動並且指明大趨勢。我在此必須強調，股市操縱可能改變每天的或短期的波動，但不可能改變大勢。道氏理論特別指出了這一點。


    股票運動的四個時期吻合經濟週期的規律。在上個經濟週期的末期，因爲生產過剩，產品價格跌落，存貨增加，公司的盈利減少，股價下跌。


    蓄勁期便是恢復期，在這段時間，公司將不暢銷的產品淘汰，減少存貨，爲經濟的復甦好做準備。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_80_0.png)


    經濟復甦期在股價上的表現便是爬坡期。隨著盈利的增加，大衆又開始爭相搶購公司的股票，股價節節升高。


    經濟復甦持續到一定階段，又因競爭和市場飽和等原因產生產品過剩的問題，這時股價就進入疲勞期。疲勞期接著就到了下坡期。下坡期到了一定地步又進入蓄勁期。整個週期過程就是經濟週期在股價上的反映。


    有人認為資本主義經濟週期對社會有負面影響，但計畫經濟也有其本身的缺陷。中國現今發展市場經濟，大家近來看到的肉、蛋、柑橘等生產過剩、價格下跌的現象便是經濟週期其中的一環。


    在蓄勁後期，爬坡初期，如果是開始一個真正的爬坡期，應有交易增加量的現象，股價一舉突破阻力線。一旦進入爬坡期，股票開始升勢，股票波動應具有「一波高過一波」的現象。雖然這並不絕對，但整個波動應該在二○○天平均線之上。在這段時間，投資者們必須安坐如山，不要因為股價的短線升跌而被嚇出場，但是要打起十二分精神注意危險信號。


    經過疲勞期，股價跌穿平均線及支撐線，便是離場的時侯了。


    有些小公司持有特別的產品，它不受一般經濟週期的影響，但其股價波動也具有相似的特點。一旦市場接受其產品，銷售及盈利的潛力會反映在投資者的行動上。他們開始標高股價，我們將看到交易量上升。


    這些投資者很多並不是短線炒作者，他們買好股票就放在一邊，使得公司在市面自由交易的股數減少。此時股票用不着很大的交易量就能攀升。這類小公司的股票在上升時其速度常常很快，短時間內可能會升數倍。


    自由市場的機制是自由競爭，很快地你就會在市場發現類似或可替代的產品。在今天的市場環境，一個熱門產品想要永葆熱門幾乎不可能。


    競爭的結果就是銷售及盈利增長的減緩，又重複從暢銷到滯銷的迴圈。這些小公司的股票同樣經歷四個階段，只是這四個階段的起伏比大公司要來得更劇烈。

