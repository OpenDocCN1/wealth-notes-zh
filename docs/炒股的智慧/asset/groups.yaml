    # 馬多夫騙局


    名。只有一二．五％，是不是讓很多股友很失望？有多少人認為進了股市每年不翻上一倍不能稱爲功勞？


    再講個伯納·馬多夫（Bernard Madoff）的故事。幾年前馬多夫因爲詐騙被抓了。這裡不談他的詐騙，這裡講他是如何贏得專家們的信任。伯納·馬多夫是美國納斯達克前主席，他不和普通人大交道，他的投資客戶都是大銀行，大退休金管理機構或豪門巨富。這些人都專家，或有人行家做顧問，想騙這些人不是件容易的事情！


    他靠每年提供一二％的報酬，每個月一％，年年如此，贏得專家信任！所有專家都知道，若一位投資經理有足夠的知識和經驗，每年一二％報酬是可以放在很小的風險之下得到的；不容易，但做得到！沒有人會懷疑納斯達克的主席是否有足夠的知識和經驗！市面上平均年報酬比一二％更高的基金多的是，但他人報酬總是有起有伏，有時也虧錢！伯納·馬多夫特別的地方在無論大市好壞，年年拿個一二％。馬多夫基金最後的規模是六百五十億美元，向專家籌到這麼多錢是多麼地不容易。


    說到這裡，這一章想傳遞的思路應該更清楚了。


    因為股市的戰是打不完的，所以每個戰役的策略從開始就不應該試圖一戰成功，而是應該'
  - '[PAGE 251]


    遵循「結硬寨，打呆戰」的方式發揮自己的優勢，以最小的可能損失，一步步實現財務自由的策略目標。


    在股市，自己的優勢就是入市的勝率，只要你能獲得超過五○○%的勝率，在資產配置上別讓自己一敗而倒，那麼你的資產就會不斷增加。在資本市場，獲利是資產累積最強大的武器，只要你能夠做到，你就會成為最終的勝利者。


    以下再幫不同投資目的的股友理一下思路。


    # 思路清晰，無怨無悔


    如果你是想賭一把的股友：


    有些股民進股市的目的就是賭一把！手邊就那麼點錢，也看不出上班拿份薪水繼續熬有什麼出頭之日，但又不甘平凡，心想不拼一下如何翻身？我對此深有體會，我一開始的時候情況也一樣。


    我自己金融學了不少，書本上投資理論大多學過；但手邊只有幾萬塊錢，按這些理論辦的話每年賺上一○%什麼時候才是財務自由之日？上面提到的我的第一個發財絕招「賣空跨式組合期權」的年預計報酬就超出一○○%，是極高風險的操作。


    我專職炒股的前幾年基本都是高風險操作，恰巧一九九○年代末期是網路剛剛興起的年'
