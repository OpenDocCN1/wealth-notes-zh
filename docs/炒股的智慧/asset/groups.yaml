    資？」和「投資多少錢？」這兩個問題。如果不投資的話就無下述問題，但如果決定投資的話，投資多少錢？這就得費盡思量了一


    # 入市前先自問「我虧得起嗎？」


    一個人無論做什麼投資，思考的第一個問題必須是：我虧得起嗎？你如果有福氣，在某一單位有份待遇優厚的好差事，不用怕被炒魷魚，薪水準時發，連衛生紙都會準時送到手上。那麼恭喜你！你把用不完的鈔票放進股市尋求刺激，勝固可喜，敗亦不足憂，你不必考慮什麼「敗而不倒」之類的廢話。但若很不幸地和我一樣是一位現掙現吃的窮小子，時時擔憂下個月茶錢從哪裡來的不幸人...
    假如你失敗了，就得開始擔心一家老小下一餐從哪裡來？那麼「我虧得起嗎？」這句話是对你來說是十分沉重的。


    我在紐約擔任地產經紀人時，那時的老闆是台灣赴美的早期留學生。他在一九七〇年代末投身地產界，那幾年間風生水起，連《紐約時報》（The New York Times）都專文介紹這位台裔地產新星。但是八〇年代末期美國地產低潮，他不幸地被裁軍了，這期間雖有小虧解套的機會，但大家都知道，一旦人有了一定的地位，要虧錢認輸是多麼困難的一件事。最後他以破產告終，和自己的房子、車子揮手告別，不帶走一片雲彩，今天不知人在何'
  - '[PAGE 107]


    方！他們夫妻二人都是高級知識份子，很有教養，三個孩子也非常聰明懂事，我十分尊敬他們爲人。但他們做生意沒有遵循「適時停損」及「敗而不倒」的原則，承擔超出自己承受力的風險，運氣好時像流星一樣升起，運氣不好便如流星般消失。因爲這家公司倒了，我才決定進商學院進修工商管理碩士學位。我現在還常常想起他們，希望他們生活如意。


    # 提高獲勝機率


    炒股是虧錢容易賺錢難的行業。假設你手上有一萬元資本，虧掉五○%後剩下一千元。但想回到一萬元，必須賺一○○%，五千元要翻一倍才會回到一萬元。任何有基本數學概念的人都知道一○○%的道路要比五○%來得漫長。股票當然更不例外。


    對炒股而言，賭的次數很多。久賭常勝的關鍵之一便是「下好注」。如何下注是藝術，沒有絕對的是非之分。但有門科學叫「機率」，對於如何完善下注的藝術提供了科學的參考。以下用生活的例子而非抽象數學公式引導大家思考。


    我們都知道拋硬幣出現正面和反面的機會各是五○%，也就是有一半的機率出正面，一半的機率出反面。假設你今天和一位朋友賭錢，拋硬幣定勝負，出正面你贏一元，出反面你輸一元，你們各拿一千元的本金來賭。這場賭博的結果很清楚，賭久了，誰也贏不了，誰都不會輸。這是一場公平的遊戲。突然你朋友建議說：從下一手起，出正面你贏九角五分，出'
  - '[PAGE 108]


