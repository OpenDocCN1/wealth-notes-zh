    # 不斷盈利能力


    讀者或許會嘲笑這樣的題目，炒股如果不是為了盈利，炒股幹什麼？難道吃饱了撐著不成？但你注意到「盈利」二字前是什麼？是「不斷」。在股票市場偶爾賺點錢不難，只要你運氣好就可以了。難的是「不斷」二字。有多少次你聽到朋友說：「我今年不錯，股票大市跌了二〇％，我只虧一〇％，我戰勝了股市！」真的嗎？任何專業的炒手，唯一該問的問題應該是：我今年掙了多少？有誰聽說服裝店老闆說自己比隔壁店少虧錢而洋洋得意的嗎？但我常聽到炒股的人居然會為了虧錢而自豪！


    其實，這就是炒股艱難的地方。看不見、摸不著的股票讓一般人的判斷力走了樣。要想在股市不斷賺錢，除了知識和經驗之外就是「忍耐」，等待賺錢的時機。問問一般的股民，他們入市資金有多少買了股票？有多少是現金？你會很驚奇地發現，一般股民幾乎把入市資金全部買了股票。不管是牛市還是熊市時，他們都是這樣的。


    這些人有一個共同的想法：「我的錢是用來賺錢的。」讀者們若有機會到賭場看看，就會明白白股民們為什麼會這樣做。賭客們站在賭桌旁，一注都不肯放過，生怕下一手就是自己贏錢的機會。直到輸完才會收手。你要明白一點：股市有時完全無序，你根本不知股票下一步會如何運動。就像你的女朋友生氣時一樣，你不知道她在想什麼？不知道她要幹什麼？這時最佳的方法就是別惹她。同樣的情形發生在股票市場上也是一樣──別碰股票。


    股票大多數時候理性、規律。雖然每檔股票的個性都不一樣，但大同小異，你需要不斷研究、不斷觀察，等經驗累積到一定程度時，就知道如何順勢而行了。等待、忍耐、觀察，只有在股票的運作符合你的入場條件時才入場。唯有如此，你才能够確定入場的獲勝機率大過五〇％。在這基礎上，才有可能不斷盈利。當然，千萬別忘了保本。


    ## 賺大錢


    給讀者出一道題：在你面前是兩位炒手的交易記錄。他們去年都翻了一倍，也就是一〇〇％的報酬率。一位是股市常勝軍，他的交易全部賺錢，有買必賺，雖然每次賺的都不多，但他的交易記錄密密麻麻一大疊，積少成多，他賺了一〇〇％。另一位似乎運氣不怎麼樣，交易中虧的次數多，賺的次數少。但他虧時虧的錢少，賺時賺的錢多，特別是有檔股票賣出價較買入價升了四倍。算總帳他也賺了一〇〇％。你如何評價這兩位股票炒手？


    兩人中的一位是運氣很好的新手，另一位可是資深的專業炒手。你現在大抵能夠猜到哪位是哪位？從他們的交易記錄，你體會到什麼了嗎？在現實生活中，專業炒手的記錄幾乎都像上述一樣，他們明白股票買賣不可能每次都正確，那麼為何要在錯誤的時候付出這麼大的代價？但在他們正確的時候，他們試圖從中得到最大的利潤。可是新手們很少有這麼好的運氣，他們通常把賺錢的股票首先出手，滿足於賺些蠅頭小利，但結果往往是手頭上有一大堆套牢的股票。


    想像你手裡有一萬元，你告訴自己要分散風險，每檔股票只投十分之一，也就是一千元，一年時間下來，五升五跌，五檔股票跌了一〇％，四支升了一〇％，另外一支升了二〇〇％。那麼一年下來，這一萬元變成一萬兩千九百元，近三〇〇％的投資報酬率。其中那隻升了二〇〇％的股票是成功的決定性因素。


    炒過股的朋友，你碰到過五元的股票升到十五元嗎？這樣的機會多不多？但你抓到過多少？你是不是常常過早離場？讓你過早離場的主要原因有兩個：


    - 一、人好貪小便宜；

    - 二、不夠經驗判斷股票運動是否正常。


    貪小便宜總令人感到愉快，因此每次賣掉賺錢的股票時你都覺得自己是炒股天才，想上餐廳慶賀一番。你總是試圖重複這類愉快的經歷。所以我們看到新手賺錢時通常只賺小錢。


    話說回來，如果你知道五元的股票會升到十五元，你也絕不會提早離場的。問題是你不能確定。這便涉及股票運動是否正常的判定問題。具體的請參考第二章第二節「技術分析的基本知識」中談論股票的正常運動與週期性運動一段。在這裡我要強調的是：只要股票運動正常，就必須按兵不動。炒股高手傑西·李佛摩特別指明，他炒股的祕訣並非是如何思考，而是他在買對股票的時候能按兵不動。


    這是很難的一件事，你要克服脫手獲利的衝動。


    另一點要強調的是：如果你確定股票運動正常，你的勝算很大，這時你應該在這檔股票上適當地加大下注比重。如果致勝機率是六〇％，你下一〇％的注，但經驗告訴你這次的致勝機率是八〇％，你就應加注。從一〇％提高到三〇％甚至五〇％，直覺上你能明白為什麼應該這樣做。具體如何下注的藝術請參考下面「如何在股市下注？下多少注？」一節。


    ## 第二節 如何在股市下注？下多少注？


    敗而不倒，這是做生意的最基本法則。朋友，你將省吃儉用省下的血汗錢投入股市，買了某公司的股票，成為那家公司的股東，你就是在投資生意。你把錢投資在股票上和投資住家隔壁的小吃店本質上完全相同，差別就在於那家公司的股票公開掛牌上市了，你家隔壁小吃店的股票未曾上市。如果小吃店的老闆請你投資，你會如何思考？你正面臨了「投不投資？」和「投資多少錢？」這兩個問題。如果不投資的話就無下述問題，但如果決定投資的話，投資多少錢？這就得費盡思量了。


    ### 入市前先自問「我虧得起嗎？」


    一個人無論做什麼投資，思考的第一個問題必須是：我虧得起嗎？你如果有福氣，在某一單位有份待遇優厚的好差事，不用怕被炒魷魚，薪水準時發，連衛生紙都會準時送到手上。那麼恭喜你！你把用不完的鈔票放進股市尋求刺激，勝固可喜，敗亦不足憂，你不必考慮什麼「敗而不倒」之類的廢話。但若很不幸地和我一樣是一位現掙現吃的窮小子，時時擔憂下個月茶錢從哪裡來的不幸人...
    假如你失敗了，就得開始擔心一家老小下一餐從哪裡來？那麼「我虧得起嗎？」這句話對你是十分沉重的。


    我在紐約擔任地產經紀人時，那時的老闆是台灣赴美的早期留學生。他在一九七〇年代末投身地產界，那幾年間風生水起，連《紐約時報》（The New York Times）都專文介紹這位台裔地產新星。但是八〇年代末期美國地產低潮，他不幸地被裁員了，這期間雖有小虧解套的機會，但大家都知道，一旦人有了一定的地位，要虧錢認輸是多麼困難的一件事。最後他以破產告終，和自己的房子、車子揮手告別，不帶走一片雲彩，今天不知人在何方！他們夫妻二人都是高級知識份子，很有教養，三個孩子也非常聰明懂事，我十分尊敬他們為人。但他們做生意沒有遵循「適時停損」及「敗而不倒」的原則，承擔超出自己承受力的風險，運氣好時像流星一樣升起，運氣不好便如流星般消失。因為這家公司倒了，我才決定進商學院進修工商管理碩士學位。我現在還常常想起他們，希望他們生活如意。


    ### 提高獲勝機率


    炒股是虧錢容易賺錢難的行業。假設你手上有一萬元資本，虧掉五〇％後剩下一萬五千元？不，剩下一萬五千元是賺五〇％，虧掉五〇％後剩下一萬元的一半，即五千元。但想回到一萬元，必須賺一〇〇％，五千元要翻一倍才會回到一萬元。任何有基本數學概念的人都知道一〇〇％的道路要比五〇％來得漫長。股票當然更不例外。


    對炒股而言，賭的次數很多。久賭常勝的關鍵之一便是「下好注」。如何下注是藝術，沒有絕對的是非之分。但有門科學叫「機率」，對於如何完善下注的藝術提供了科學的參考。以下用生活的例子而非抽象數學公式引導大家思考。


    我們都知道拋硬幣出現正面和反面的機會各是五〇％，也就是有一半的機率出正面，一半的機率出反面。假設你今天和一位朋友賭錢，拋硬幣定勝負，出正面你贏一元，出反面你輸一元，你們各拿一千元的本金來賭。這場賭博的結果很清楚，賭久了，誰也贏不了，誰都不會輸。這是一場公平的遊戲。突然你朋友建議說：從下一手起，出正面你贏九角五分，出反面你還是給他一元。你還賭嗎？你當然不賭啦，因為你知道遲早被剃光頭。反過來，朋友建議說出正面你贏一元，出反面你賠九角五分。你會如何想？你一定會大聲吼叫：「好！」因為這時你知道剃他光頭只是遲早的事，你知道你贏定了！


    現在假設這位朋友要提高賭注，每注五百元，出正面你贏五百元，出反面你輸四百七十元。機率沒變，還是一比〇．九五，但賭注變了，從本金的千分之一提高到二分之一。這時你有什麼想法？你還是知道贏的機會大過虧的機會，但你贏定的感覺沒有了。你的本金只夠賭兩回，你的手開始冒汗。如果這一千元是你下個月的吃飯錢，你還敢賭嗎？


    在上面的例子中，你輸贏的機率沒有變化，但下注的金額變了，整個遊戲的本性便發生了變化，你從「贏定了」變成了「沒有贏的把握」。朋友，你炒了幾年股票，覺得自己已經有經驗了，你知道你的經驗有什麼用處嗎？事實上，經驗可以提高每次進場贏錢的機率！


    我曾研究過美國賭場的遊戲，每種遊戲（吃角子老虎機除外）的賭場盈利僅一％至二％之間。也就是在機率上，你每次下注一百美元，只能拿回九十八至九十九美元，和中國買賣股票的手續費差不多。但機率上來說每次下注都輸一點，完全應驗了「久賭必輸」這句話。所以賭場不怕你贏錢，就怕你不來。


    但就我的觀察，一般賭客通常帶兩千元進場，往往不到半小時就剃光頭回家。那時候我覺得賭場真坑人，現在明白這些賭客其實太笨了。就算你不懂技巧亂下注，以通常最低額五美元的標準下注，兩千美元夠耗上兩天，賭場包你吃住，就當作度一次假也不錯。然而這些賭客賺錢的心太急，恨不得立即賺得十萬、八萬的，因此每注下得太大，最終結果也就可想而知。


    現在你應該明白在股市不斷賺錢的祕訣了：透過自己的觀察和研究，不斷累積經驗，將自己每次入場獲勝的機率從五〇％提高到六〇％，甚至七〇％；而且每次進場不要下注太大，應該只是本金的小部分。這樣長期下來，你就能「久賭必贏」。


    數學的道理很容易明白，每次下注應占本金總額的多少，決定於你的經驗及對風險的承受能力，沒有絕對的百分比。你要記住「財不入急門」。我這裡給個建議：新手的話，把本金分成六至八份，每次下其中一份。有了經驗，慢慢地把份數減少。你如果有六〇％的勝算，下注的數額應該比你有八〇％的勝算時更少。至於你如何知道有六〇％的勝算或八〇％的勝算？這就完全決定於自己的經驗。下注的數額和下注的時機也有密切的關係，怎樣選擇下注的時機將在第四章第一節「何時買股票？」另行講述，希望讀者們可以互相參照閱讀。


    ### 抓住正常運動中的股票


    要完美地描述何時股票的運動正常極其困難。股票從來不按固定模式運動，就像你要完美地描述人的性格一樣，你很難做到百分之百。這是一門藝術，不是科學。


    人在什麼時候會生氣？什麼時候會高興？因人而異，但大體上說，受到讚揚時會高興，被指責時會生氣；股票也是一樣，被追捧時會升，被拋售時會跌，期間可能受一定程度的大戶操作而改變升跌的形態，但總體趨勢不會改變。經典的道氏理論特別強調了這一點。股票從來不會恆定不動，它有時活躍，有時安靜，要嘛上升一點，要嘛下跌一點，在一個固定的區間波動，一旦股票開始一個新的走勢，它通常循著一條比較固定的路徑運行。華爾街將這條線稱為「最小阻力線」（line
    of least resistance）。也就是說股票在這條線上行走時所受到的阻力最少。


    如果股票開始上升走勢，例如，正準備從二十元升到五十元。你將會發現走勢開始的前幾天，交易量突然增加，股價開始攀升；幾天以後，升勢停止，開始下跌。這是「正常」的獲利回吐，下跌時的交易量較上升時顯著減少。讀者們，這個下調很正常，屬於正常運動，千萬不要在此時賣掉股票。如果這檔股票具有上衝的潛力，你會發現在幾天內股票又開始活躍，交易量又開始增加，上次「自然調低」所失去的「領土」應在短時間內收復，股票開始衝到新的高度。這次運動將持續一段時間，其間每日通常是收盤價高過開盤價，偶爾收盤價低過開盤價，其差額通常不大；交易量也不會有顯著的變化，通常情況是減少。或遲或早，股票又會開始下跌，這是新一輪的「獲利回吐」。


    這次獲利回吐的股票運動和交易量的特點應該和第一次很相似。上述是股票走升勢時的正常運動。圖3-1顯示出它們應有的特點。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_111_0.png)


    如果讀者覺得還很抽象的話，以下用數字來描述一遍，因為掌握股票正常運動的特點對炒股成功是極其重要的。在股票二十元時，交易量增加，可以是平時的一、兩倍，股價從二十元升到二十一元、二十二元，甚至二十七元。這幾天的交易量較前段時間顯著增加是其特徵。到二十七元時升勢可能停頓，隨之開始下調，股價走勢為二十七→二十六→二十四元。這段時間的交易量應較從二十元升到二十七元時的平均交易量為少，即股票從二十元升到二十七元時買盤大過賣盤，從二十七→二十四元時的賣盤大過買盤。但這如果是正常的升勢，從二十→二十七→二十四這段時間總的買盤大過賣盤。在二十四元徘徊幾天後，股票應重新開始上升，交易量又開始增加，這次上衝應該很快超過二十七元，股價走勢為二十四→二十五→二十六→二十七→三十五元。當股票衝到三十五元時，又開始停頓，隨之下調，重複第一階段的運動。


    這次下調同樣應有交易量減少的特點。


    一支正常運作的股票，每次上衝的強度通常較上一次更為猛烈。以我們這個例子，當股票再次衝破三十五元時，應很容易地直衝到四十五元或五十元，其間並不會感到很大的障礙。回檔是正常的。一位專業炒手絕不能在正常回檔的時候被嚇出場。入場後開始有利潤了，每次回檔都意味著紙上利潤的減少，一般人的第一感覺就是趕快賣掉獲利，這是新手的顯著特點。這也是為何新手很難在股市賺到大錢的原因。


    炒手的任務不僅確認何時股票運動正常，同樣重要的是要能認識股票何時運動不正常。股票這種前進兩步、退後一步的過程可能延續一段時間，有時可能是很長一段時間。這段時間炒手或許會精神鬆懈，這是十分重要的狀況。因為往往可能在你鬆懈下來時，股票運動產生變化。股票緩緩地週期性上升，突然有一天，股票狂漲！從五十元一下子升到五十五元，第二天升到六十二元，這兩天交易量突然大增，但在第二天收盤前的半小時股票從六十元跌回五十八元收盤。第三天開盤一樣強勁，股票一下子升到六十四元，但第四天，股票似乎失去了衝勁，它跌回六十一元（如圖3-2）。


    ### 注意危險信號


    前述例子中，第四天股價跌回到六十一元，這是極其明確的危險信號，它告訴你：小心了，危險！


    ![](img/af3de47fcb4db801f9d008fb55b44d63_113_0.png)


    在股票緩慢的上升過程中，它自然地升，自然地跌，突然某天大起大落，這是在正常上升過程中未曾發生過的事。一旦有不正常現象出現，炒手們必須特別留意。这时的正常做法就是將股票脫手。


    我是這樣理解這一現象的：


    股票運動後面的主要力量是大戶，這些大戶通常是手握鉅資的基金或保險公司等。當這些基金的管理人看好這檔股票，開始吸納它時，你將因此看到交易量上升，股價上升。通常這些基金管理人在吸納股票時，並不希望引起大衆注意，所以這一過程通常是緩慢的，它不會上報紙或電視的頭條。


    一旦這些大戶吸股完畢，你通常會聽到他們開始公開地推薦這些股票，引起大衆的注意。這些大戶們的資訊通常比普通人靈通，他們也會很快看到公司有好消息公布，例如開發成功新產品，盈利比預期的更好等等。等到這些大戶覺得好消息已全部反映在股價之中，他們便開始準備脫手。由於他們手中握有的股票數量通常很大，如果一下子砸進市場，市場根本承受不了，他們手中的股票很大一部分只能在低價出手。為了解決這一問題，他們就要找傻瓜用高價來承接這些股票。找傻瓜的最佳途徑就是令股價暴升，暴升時通常伴隨著好消息，例如：公司任命新董事長了、某證券商強力推薦該股票等等。報紙電視整天都在重複這些消息，引發小股民蜂擁入市。


    想想看，小股民因股價暴升而引發貪念入市時買的股票都是誰賣的？一旦大戶找到足夠的傻瓜，便能全身而退，哪裡還去找大買主把股價繼續推高？


    你現在明白了股票的正常運動及危險信號後面的理由了嗎？我一直強調，炒股是藝術，不是科學。當不正常的信號燈亮起時，是否表示這檔股票就一定要下跌？答案是：「否！」沒有人能以任何時候百分之百地肯定股票明天會變得如何，也許暴升的理由是公司真的發現了長生不老藥！你必須將股票的運動和公司的發展綜合考慮。讓我再重複一次：炒股的基本信條是：在任何時候，你手上持有股票的上升潛力必須大過下跌的可能，否則你就應該賣出。看到危險信號，表示此時你的獲勝機率已經低於五〇％了。


    每位嚴肅的炒手都必須注意危險信號，但問題是在內心深處總有些奇怪的力量使他們在該賣出的時候提不起勇氣這麼做。或許是自己的僥倖心理在作怪。在遲疑的這段時間，他們常看到股票又跌了好多點，這時他們會拍著腦袋，大罵自己傻瓜，同時發誓一旦股票有反彈就走人，他們心中可能想著：「股票跌了這麼多，總該會有個小反彈吧？」但反彈來到時，他們又忘記了自己的誓言，因為在他們眼裡，這時股票運動又開始「正常」起來。通常，這樣的反彈僅是股票在下跌路上的喘息，它很快要繼續走接下來的路。


    人性有很多缺陷。人希望股票會如何運動，認定股票會如何運動，當股票的運動和預想不符合時，就會認為股市錯了，自己沒有錯。但炒友必須牢牢記住：股市從來都沒錯，它總是走自己要走的路，會出錯的只有你自己。你所能做的只有追隨股市。見到危險信號，不要三心二意，不要存有幻想，把股票全部脫手。幾天以後，也許一切又恢復正常，你一樣可以重新入場。如果能這樣做，你將發現你為自己省下了很多焦慮及學費。


    ### 如果火車朝你衝來？


    華爾街流行的說法是這樣的：你在鐵路軌道上漫步，見到火車向你衝來，你應該如何辦？你自然應該閃開一邊，待火車離去後，你隨時還可以重上鐵道繼續漫步。遲疑不決會危及生命，同樣的道理，此事若發生在炒股上就是危急你的炒股生命。


    上述講的是一個正常的股票升勢所具有的特點。時間的跨度通常比較大，從幾個月到幾年都說不定。對一般的投資者，能抓住整個「勢」的六〇％至七〇％就是相當不錯的成績。這也是一般投資者最需掌握的。把時間的跨度縮短，我們就回到了技術分析基本知識的部分，判斷何時股票的運動正常已經包括到了那部分內容，這裡便不再重複。


    正確地感悟股票運動何時正常是最難學，也是炒股成功最關鍵的技巧之一。隨著經驗的增加，你的悟性愈來愈好，對股票運動的判斷力愈來愈強，你就能將每次入場的獲勝機率從五〇％提高到六〇％，甚至七〇％，慢慢地你就成了炒股專家。就我對這行的瞭解及體驗，沒有三年的全職經驗連門都入不了。


    你要準備「熬」！


    ## 第三節 成功投資者的特性


    ### 要有成為投資專家的欲望


    無論做什麼，沒有欲望是不可能成功的。缺少欲望，你會在碰到些小困難時就打退堂鼓。股友們或許會說：「我成功欲望很強烈，我很想在股市發財。」真是這麼回事嗎？


    美國股民超過三千萬名，華爾街曾經對一般股民做過調查，其結果十分驚人：80%的股民入市並非以賺錢為主要目的！原因為：炒股是金錢遊戲，一個紳士們玩的遊戲，股民們入市主要目的是參加這個遊戲。你所有富有朋友都在炒股，你必須成為他們中的一員，這樣在大家的閒談中你也成為「成功人士」的一分子。


