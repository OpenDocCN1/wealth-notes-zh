    # 第一節 何時買股票？


    在前面談了股票的性質與特點、炒股基礎知識和炒股成功的基本要素之後，本章將專門探討最技術性的實戰問題——怎樣買賣股票。


    這個問題我打算從買賣股票依據的基本原則、買入操作的技巧、選擇股票的程式等方面加以闡述。


    # 基本原則


    在我討論「何時買股票？」之前，我要提醒各位讀者，就我多年炒股經驗，選買點的最要點是選擇停損點。也就是在你進場之前，你必須很清楚若股票的運動和預期不合，你必須決定在哪點停損上離場。換句話說，在投資做生意前，不要老是想著要賺多少錢，首先應該清楚自己能夠虧得起多少。有些人以一○％的數量當做停損基數，也就是十元進的股票，以九元做停損點。有些人將停損點定在支撐線稍下。有些人定二○％的停損額。還有其他各種方法。無論什麼方法，都必須有個停損點，這個停損點不應該超出投資額的二○％。請讀者切切牢記，否則一切都是空談。


    買股票的依據主要是三點：「基本分析」、「技術分析」及「大市走向」。有些人買股票'
  - '[PAGE 128]


    只看基本分析，也就是只研究公司的本身價值，不看其他。股神華倫·巴菲特（Warren Buffett）便是代表人物。有些人只看技術分析，認爲市場對該股票的看法全部表現在股價及其交易量的變化之上。大多數的炒手屬於第二類。


    無論哪一種，只要你能做得好，都可以獲得好結果。但對一般的炒手而言，要僅靠基本分析來炒股很困難，因爲你不可能獲得完善的資料來判定公司的價值。你如果是位大基金的管理人，買了某公司的大批股票，你可以派個人到公司坐鎮，瞭解公司的細節。但對一般人來說，這是不可能的。公司的財務報告僅表明了過去的經營情況，並不代表未來的發展。依據華爾街的说法，股票價格反應的是股票半年或更遠的未來的公司前景。


    我自己靠炒股維生，我必須盡量做到每個月都有收入。完全靠基本分析來炒股，我沒有把握能夠做到這一點。所以我的主要參考依據是技術分析。我總是選擇那些我入場時勝算最大的點，而且每次下注都只是我資本的小部分，同時把握「虧錢時虧小錢，賺錢時賺大錢」的原則及及時停損。老實說我差不多就像在開賭場，每次入場時獲勝機率都超過50%，而且我只下小注，所以我久賭必贏。


    在第二章第二節「技術分析的基本知識」中，我介紹了幾個圖。圖中所有的突破點都可以叫做「臨界點」。我總是將買賣控制在臨界點附近。什麼是「臨界點」呢？大家知道水在攝氏一百度變成蒸汽，科學上稱一百度正是水的臨界點。同樣的道理，衣服成本價是家庭主'
  - '[PAGE 129]


    ![](img/af3de47fcb4db801f9d008fb55b44d63_129_0.png)


    圖 4-1


    婦們買衣服的臨界點，在這個價格上買衣服被宰的機會最小。在股票操作上，這些點往往是大眾對股價重新評估的點，也就是在這些點上，你入場的獲勝機率最高。買股票的技巧，全在於如何尋找臨界點。


    # 操作技巧


    以下讓我們分析一下買股票時怎樣具體操作。


    +   1、升勢時的操作（圖4-1）


    假如這是一個正常的升勢，A、B點分別是波峰和波谷。一旦股價超過A點，便是好的買入點。假設A為十五元，B為十三元，則好的買入點是十五、一○元或十五、五○元。因爲你可能判定這是新一波的開始。假如股價升到十六、五○元，你便可將賣出價定在十五、五○元。記住保本。

    如果繼續上升，你便應忘掉入場價，專注於股'
