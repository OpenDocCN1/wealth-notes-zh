  - '[PAGE 156]


    # 第一節 華爾街的投资智慧


    要把所有的華爾街家訓都寫出來，起碼需要兩百頁篇幅，而且其中大部分是「為賦新詞強說愁」。我將親身實踐後證明最重要的規矩整理出來。這些規矩已由我的實際操作證明可以遵循，而且行之有效，希望讀者們能牢牢記住。


    # 停損，停損，停損！


    我不知這該如何強調這兩個字的重要，我也不知還能否解釋這兩個字，這是炒股這一行的最高行為準則。你若覺得自己實在沒辦法以比進價更低的價錢賣出手中的股票，那就趕緊退出這行吧！因為你在炒股這一行沒有任何生存的機會。最後割一次肉，痛一次，你還能剩幾塊錢替兒子買奶粉。


    # 分散風險


    做這行需要賭性，但不能做賭徒。如果你喜歡刺激，手手下大注，夢想快快發財，那麼遲早會翻船說再見，而且速度會比你想像的快更多。就算有十次好運，但第十一次好運不見得還會落在你頭上。'
  - '[PAGE 157]


    記住：你只能承擔計算過的風險，不要把所有雞蛋放在一個籃子裡。把手頭的資本分成五十至十份，在你認為至少有一比三的風險報酬比率時將其中的一份入市，同時牢記停損的最高生存原則，如此長期下來，就算不賺錢都難。新手的錯誤就是太急著賺錢，手手都要豪賭，恨不得明天就成為億萬富翁。中國「財不入急門」的古訓，在炒股進行可說是字字珠璣。


    # 避免買太多種股票


    你最多能記住幾個電話號碼？普通人是十組電話號碼，你呢？


    手頭股票太多時，結果就是注意力分散，失去對單獨股票的感覺。我一直強調，你必須隨時具備股票運動是否正常的感覺，在這個基礎上才有可能有效控制進出場的時機。買一大堆類別不同的股票，恨不得每支掛牌股票都買一些，這是新手的典型錯誤，因爲注意力將因此分散。


    將注意力集中在三至五支最有潛力的股票，隨著經驗的增加，逐漸將留意的股票增加到十至十五支。


    我自己的極限是二十檔股票。你可以試試自己的極限，但無論如何，在任何情況下，都不要超出自己的極限。'
  - '[PAGE 158]


    # 有疑問的時候，離場！


    這是條容易明白但不容易執行的規則。很多時候，你根本就對股票的走勢失去感覺，你不知道它接下來要往上爬還是朝下跌，你也搞不清它處在升勢還是跌勢。此時，你的最佳選擇就是離場！


    離場不是說不炒股了，而是別碰這檔股票。如果手頭有這檔股票，賣掉！手頭沒有，別買！我們已經明白了久賭能贏的技巧在於每次下注，你的獲勝機率必須超過五〇％，只要你的手頭還擁有沒有感覺的股票，表示你還未將賭注從賭桌上撤回來。當你不知這檔股票走勢的時候，你的贏面只剩下五〇％。專業賭徒絕對不會在這時把賭注留在檯面上。


    別讓「專業賭徒」四字嚇壞你，每個生意人其實都是專業賭徒。你在學習成為炒股專家，對自己的要求必須高一些。通常這時後會出現另一個問題，幾乎炒過股的朋友都會有這樣的感覺：「當我擁有某檔股票時，我對它的感覺特別敏感，而且每天算帳，它讓我打起十二分的精神；但如果手中沒有這檔股票，我對它的注意力就不集中了。」我自己也有同樣的問題，我的處理方式就是——只留下一點股票，例如一百股。


    如果虧了，我就將它當成買藥的錢，就當做我買了一帖讓注意力集中的藥。'
  - '[PAGE 159]


    # 忘掉你的入場價


    坦白地講，沒有三、五年的功力，交過厚厚的一大疊學費，要你忘掉入場價是做不到的，但你必須明白這麼做的原因。今天你手中擁有的股票，按你的經驗，明天都應該會升。如果經驗告訴你這檔股票的運動不對了，明天可能會跌，那你還把它留在手中做什麼？這和你在什麼價位買進有什麼關係？我們之所以難以忘記進價，這和人性中喜賺小便宜，絕不願吃小虧的天性有關。如果這檔股票的價位已經比你的進價爲更高，你脫手會很容易，因爲你已賺了便宜。若是更低的話，你必須面對「吃虧」的選擇！


    普通人會找一百個「理由」再賴一會兒。我的朋友，「再賴一會兒」的價錢很高。人很難改變自己的人 性，那就試著忘掉進價吧！這樣你就能專注於正確的時間做正確的事了。


    # 別頻繁交易


    我開始專職炒股時，天天不買或賣上一次就覺得沒完成工作。我那時的想法是這樣的：我以炒股維生，不炒不就没事可做？這可是我的工作啊！結果，我爲此付出了鉅額學費。


    當經驗累積到一定地步，你就會明白股市不是每天都有盈利機會。你覺得不買、不賣就沒事可做，缺少刺激，那麼你的代價就是每次出入場的手續費。'
  - '[PAGE 160]


    # 不要向下攤平


    除了手續費之外，每天買賣都帶來情緒波動，沖散了冷靜觀察股市的注意力。可以這么說，在你留著跟蹤的股票中，說每天都有七〇或八〇％勝算的交易機會是騙人的，好的操作機會不會天天都有。股民之所以頻繁交易是因枯燥無聊，頻繁交易不僅損失手續費，同時也使得交易品質降低。


    犯了錯，不是老老實實地認錯，重新開始，而是抱著僥倖心理，向下攤平，把平均進價降低，滿心希望股票小有反彈就能挽回損失，甚至賺錢。這是常人的想法和做法，但在這卻是破產捷徑，英國歷史最悠久的巴林銀行（Barings
    Bank）就是這樣倒閉的……


    上海石化在美國掛牌上市，一九九七年最高曾達到每股四十五美元。從四十五美元跌到三十五美元，很低了吧？你心裡想，是不是應該再補上兩千股？若是再跌到二十五美元，你打算怎麼辦？還往下攤不攤？結果，上海石化一路跌到每股十美元。做為一名股票投資人，這樣的好戲只要上演一齣，你的財產就全部被套牢。等它升回四十五美元嗎？或許有可能，但這是兩年後或是二十年後才會發生的事，誰也說不准……如果股價永遠回不去呢？這樣被燙傷一次，你將不再有膽繼續炒股。假如幸運地市場給你一個解套機會，你會馬上套現把錢放在米缸裡，心中覺得還是天天摸到錢才會放心。'
  - '[PAGE 161]


    再見了，又一位交了學費、畢不了業的學股人。不要向下攤也可用另一種說法：第一次入場後，紙面上沒有利潤的話不要加碼。紙面有利潤了，表示你第一次入場的判斷正確，那麼可以擴大戰果，適當加注，否則即刻停止損離場，另尋機會。讀者請靜下心來思考一下為什麼，道理其實很簡單。


    也許有人不服氣，我已有十次向下攤平都攤對了，它的確是解套良方。我真要羨慕你，你的運氣比我好多了。但你還未告訴我第十一次、第十五次的結果！你敢保證它們不會是王安電腦嗎？◎


    對炒股老手來講，可以有很多例外。其中之一就是股票在升勢時，任何點都是好的入場點，碰巧你一入場，股票開始正常下調，在下調結束回頭時，你可以考慮再進點股，就算進價比你第一次進價低也沒關係。


    這樣做並不是為了解套，而是你「知道」股票的升勢還在繼續。只有將炒股的武藝煉到「無招」地步的炒手才可以考慮這麼做，沒有三、五年的經驗莫談。新手們謹請記住：不要向下攤平！


    # 別讓利潤變成虧損


    這條規矩是這樣的：你在十一元一股進了一千股，現在股票升到十二元了，你已有兩千元'
  - '[PAGE 162]


    的利潤。這時要定好停損價，價格應在十元之上，例如十・五〇元或十一元，不要讓股票跌回九元時才停損。


    你若炒過股，就會明白當股票從十元升到十二元，卻讓它跌回九元，最後割肉停損，這種感覺是多麼令人懊惱。你會覺得自己太愚蠢！無論何時如果覺得自己很蠢，要想想你一定做錯了什麼！


    把停損點定在十一元，賣掉時算算還賺到錢，這和在九元時不得不割肉的感覺肯定是不一樣的。這還牽涉到炒股的第一要務：保本！


    在任何情況下，盡量保住你的本金。


    有些讀者會問：股價是十二元，把停損點定在十一・九〇元，這樣不就能保證賺得更多，數錢時更開心嗎？


    話是這樣說不錯，但實際上可不能這麼做。股票波動一毛錢的時間有時無須花上兩分鐘，一旦出場了，股票可能一路衝到十五元，你就失去賺大錢的機會了。把停損點定在十・五〇元或十一元，你可以給手上這支股票一〇％左右的喘息空間，因為一支正常上升的股票


