    到設定的出場價時，不要幻想，不要期待，不要講理由，立刻賣掉再說。


    # 別將「股價很低了」當成買的理由，也別將「股價很高了」當成賣的理由！


    我今天手裡還有檔股票，交易符號是BB（現已被除名，不掛牌），是一家開養老院的公司。當時它從十五美元跌到五美元，我覺得股價很低了，花了五千美元進了一千股。現在的牌價是O．二五美元。我的五千美元只剩兩百五十美元。這檔股票我一直沒有停損，當年是「不肯」，今天我用它來提醒自己：「你永遠不知股票會跌到多低！」


    因為人是健忘的。


    我發覺新手們特別喜歡買低價股，來請教我某檔股票是否可買的朋友，他們選的股票大多數是低價股。這低價是指股票從高價跌下來，例如從四十美元跌到二十美元。這樣的想法或許是源自日常生活，衣服從四十美元降價到二十美元，那一定是便宜了。把這樣的習慣引申到股票，自然而然會找「減價股票」來買。但不幸地，若是用選衣服的方法選股票，在炒股這行鐵定失敗。


    股票從四十美元跌到二十美元，通常都有它的內在原因，你憑什麼斷定它不會繼續往下跌呢？英有句話是這麼說的：「別試著接住往下掉的刀子，它會把你的手砸得血淋淋！」（Do
    not catch a falling knife。）所謂炒手，最重要的是跟勢，股票從四十美元跌到二十美元，明顯'
  - '[PAGE 166]


    是跌勢，你不能逆勢而行。當然要是股票從四十美元跌到十美元，現在又從十美元升到二十美元，那就是兩碼事了。


    一位新手在發現他買進的股票升了時會很興奮，但是也會惴惴不安，生怕市場把好不容易借給的利潤又收回去。他成日腦海裡盤旋的就是「股票是不是升到頂了？」「還是別貪了，快賣吧。」


    這裡要提醒讀者的就是：別將「股價很高了」當成賣的理由，你永遠不知股票會升多高。只要股票的升勢正常，別離開這場股票。記住前面提到過的華爾格言：「截短虧損，讓利潤奔跑！」


    # 訂好計畫，按著既定方針執行


    進股時，先認清你的風險和報酬各是什麼。若市場未按你預定的軌道運行時你會如何改變？最好寫下應變的策略。特別對新手而言，入市幾天後，自己都記不起入股時是怎樣想的。


    如果你的停損是一○％，十元進貨，升到十五元，停損點就定在十三‧五○元，沒有其他理由。若股票跌到十三‧五○元就說再見，如果你的原定計畫是十元入股，十五元賣出獲利，那麼股票升到十五元時就堅決賣出，不要猶豫。雖然我強調在運行最好不要預定獲利點，但你如果有這樣的計畫就照做。股票行的方法實際上沒有什麼對或錯，關鍵是你需要找'
  - '[PAGE 167]


    到適合自己風險承受力的方法，而且堅決按照這個方法去做。隨著經驗的增加，你會不斷改變自己的方法，這就如螺旋一樣，轉了一圈，你似乎還在原位，但其實你已經高了一層。方法可以修改，也必須隨著經驗的累積而修改，重要的是在任何時候，都必須有個原則並且依據這項原則來指導你的一切行動。


    新手們最易犯的錯誤之一就是缺少計畫。他們可能覺得這檔股票已經跌到很低，或是某人说這檔股票好就買進，但買進之後如何追蹤就茫無頭緒。什麼情況下停損？什麼情況下獲利？一問三不知。你若也是上述狀況所說的其中一員，勸你趕快學會訂定好自己的計畫。股票學校的學費非常昂貴的。


    # 別愛上任何股票


    有人會愛上某檔股票！原因是對該股票做了很多研究。無論是什麼，一旦熟悉了，慢慢地就會產生感情，這是人性沒辦法！但是在炒股這行，愛上股票極其危險，因為它會斷送你的炒股生命。


    印象深刻的是我的第一部車。


    和大多數一九八〇年代初來美國的人一樣，我是空著手來。在美國沒車不行，在餐館工作了一年，賺得的薪水交完學費後還剩下一點，於是我就買了一台舊車。'
  - '[PAGE 168]


    # 第 5 章 華爾街的家訓


    我的第一部舊車是本田喜美，那是一台車齡長達十年的老爺車，到我手上已經累積了十六萬英里的里程數。任何開過車的駕駛人都知道，十年車齡、十六萬英里車程的老爺車問題多著呢！我是窮學生嘛，修車的事當然只有自己動手囉。在往後的一年裡，我從煞車到化油器都試著自己換了一遍，著實對這部車下了功夫。甚至開長途車程的話，我還會將修車工具和常用零件放在車上。


    雖然這部車後來就因爲在跑不動，兩年後就宣告退休了。但這兩年下來，我愛上了這部車，因爲我對它實在是太熟悉了，儘管多年後談到買車我還是會想起本田。由此也可知，大車廠的入門車常虧本賣，就是因爲他們希望能夠釣到初買車的消费者，希望消費者能一試成主顧，成爲品牌長久愛用者。


    講回股票，你研究公司的產品，分析營收，固定資產，本益比；試用其產品，甚至研究總經裡的人字命盤。一段時間下來，就如同我當年修舊車上了癮，腦袋裡總忘不了它。什麼炒股計畫，什麼停損，統統再見！股票升，應該的；股票跌，暫時的；反正我相信你的產品有前途，公司有未來，明天一定會更好！網略股泡沫大家都記得，例子我就不舉了。公司研究做多了，難免對這家公司產生感情，這是人性！但請明白這是人性的弱點：別昏了頭，忘了保本，忘了停損。


    > 請謹記：別愛上任何股票。'
  - '[PAGE 169]


    # 市場從來不會錯，但你自己的想法常是錯的


    有多少次，你拍著腦袋大叫：「見鬼了，無論從什麼角度分析，這檔股票都沒有理由跌，它很快就會反彈。」我朋友來找我討論股票，他們都會一條條列出他們的分析，最後認定這檔股票升到頂了，那檔股票跌到底了。


    我無法證明其對錯，通常我只建議若想買那就買吧，但若股票又跌了一〇%，即刻脫手。如果你想賣，那就賣吧，反正不賣你也睡不著。


    華爾街很多著名專家，在這一條原則上都翻了跟斗。人一旦出了點名，名聲就重於一切，他們認為股票要升，不升怎麼辦？他們最終結論當然是市場錯了，市場還未體驗到這檔股票的價值。結果就是專家們一個個從寶座上跌下來。這樣的故事非常多。愈聰明的人，愈容易自以爲是。他們在生活中的決定通常能做對決策，或是有些一開始不對勁，但最終證明他們正確。但在炒股這一行，或許最終他們的確正確，但在市場證明其正確之前，他們可能早已剃光頭回家了。


    不要自以爲是，不要有虛榮心，要按照市場給的資訊決定行動計畫，一有不對勁時便即刻認錯，這才是股市的長存之道。


    以下，讀者們可以欣賞一下世界著名炒股大師是如何討論炒股。'
  - '[PAGE 170]


    # 第二節 投資大師論炒股


    關於華倫·巴菲特的自傳或是相關股票投資書籍，市面上已有很多了，我在這裡簡單地介紹他的投資理念。華倫·巴菲特投資的時間累積程度很難模仿，但他的思考模式很有參考價值。想在投資領域中成功，他認為必須具備以下六點特質：


    +   第一、 你要有點貪念，但不能太多。太多的話，貪念就會控制你；但太少的話，你就會失去動力。你必須對投資過程充滿好奇心。


    +   第二、 你必須有耐心。你買了一家公司的股票，應該打算永遠擁有這一股票。你不應隨大流而動。如果對公司的判斷正確而且在適合的價位進場，最終你會看到股票的價值。


    +   第三、 你必須獨立思考。如果你自認不具備足夠的知識做判斷，最好不要做任何判斷。


    +   第四、 你必須有自信。而且你的自信必須來自知識和經驗，而非一時的頭腦發熱。


    +   第五、 不要不懂裝懂，要有自知之明。對自己不懂的東西，要承認自己不懂。


    +   第六、 有彈性。什麼東西都可以買，但不要付出超出其價值的價格。'
  - '[PAGE 171]


    +   華倫·巴菲特列出以下幾點做爲選擇公司的參考：

    一、這家公司做什麼生意很容易理解。

    二、經營這家公司不需要天才，平常人也能經營。

    三、這家公司能提供可以預計的盈利。

    四、經營者擁有公司的股份。

    五、公司不應有太多存貨且貨如輪轉。

    六、公司的固定資產報酬率高。


    +   華倫·巴菲特每年給他的投資者的年度報告都強調兩點：

    一、我們的投資將基於股票的價值而不是股票是否熱門。

    二、我們的管理將盡量使損失降至最低（有別於股價的短期波動）。


    成功投資者的重要素質之一，便是在市場情況不允許時離開市場。


    一九六六年，當華倫·巴菲特認爲「便宜」股票很難找到時，他決定暫離市場。當時他'
  - '[PAGE 172]


    是這樣向投資者们解釋：「我對現今的情況感到失落……但有一點我很清楚，我只能以我熟悉的方式進行投資。這樣做或許會失去一些鉅額而且賺錢容易的盈利機會。但我不能進行我所不熟悉的投資方式，因爲這可能導致鉅額損失。」


    優秀的投資者只有在獲勝機率很大的情況下，才會將資金投入股市。華倫·巴菲特便是其中的佼佼者。


    # 喬治·索羅斯 (George Soros)


    喬治·索羅斯的投資哲學可以概括成以下兩點：


    +   一、不要第一次就入市太深，從少量開始，如果進展順利，再加碼。炒手們必須從一開始就決定承擔多大的風險，這是艱難的判斷，但不要一下子就擔上太大的風險。


    +   二、市場是愚蠢的，你也用不著太聰明。你不需要什麼都懂，但你必須在某一方面懂得比別人多。


    喬治·索羅斯在歐洲推銷證券時，發現德國一些銀行手中持有的其他公司股票市值，居然超過銀行本身的股市總價。他推薦買這些德國銀行股票，因爲這等於銀行付錢請你當這'
  - '[PAGE 173]


    些公司股東。


    「要知道這點，」喬治·索羅斯說，「就是買這些銀行股的充足理由。」喬治·索羅斯建議投資研究愈簡單愈好。他自己從不在經濟研究上花大量的時間，不讀華爾街證券行的研究報告。他的投資主意大多來自於閱讀報紙。他認為技術圖表分析的理論基礎太過薄弱，在實踐中不能帶來恆久的結果。基本分析的理論基礎比較強，但也有其弱點，因爲變動的股票同時改變基本面分析的結論。


    華爾街有一個通行的理論是「充分市場理論」（efficient market theory），股票價格在特定時間充分反映股票價值，它包括公司的內部經營和外部大環境。喬治·索羅斯認為這項理論錯誤。因爲若按此理論，任何人要獲得比大市更高的報酬率根本就不可能。


    喬治·索羅斯用自己的記錄證明這項理論無效，他連續不斷地在市場獲得比大市還高的報酬。他自己提出了「回饋理論」（theory of reflexivity）。簡簡單地說：想法改變了事件，事件的改變又反過來改變想法。例如投機者們認爲美元會升，他們入場買美元，其結果使美元利息降低，刺激了經濟，這給大衆帶來美元應該升得更高的想法。用這個理論來解釋股市的走勢，大家看好某股票，捧出這支股票的結果使股票升高，股價的升高使得更多的人追捧，這就是爲何股票走勢一日開始，不會馬上結束的原因。


    喬治·索羅斯的思路極難模仿。他的自傳及炒股技術專著《金融煉金術》（The Alchemy'
  md: "\n## 第一節 華爾街的投資智慧\n\n要把所有的華爾街家訓都寫出來，起碼需要兩百頁篇幅，而且其中大部分是「為賦新詞強說愁」。我將親身實踐後證明最重要的規矩整理出來。這些規矩已由我的實際操作證明可以遵循，而且行之有效，希望讀者們能牢牢記住。\n\
    \n### 停損，停損，停損！\n\n我不知該如何強調這兩個字的重要，我也不知還能否解釋這兩個字，這是炒股這一行的最高行為準則。你若覺得自己實在沒辦法以比進價更低的價錢賣出手中的股票，那就趕緊退出這行吧！因為你在炒股這一行沒有任何生存的機會。最後割一次肉，痛一次，你還能剩幾塊錢替兒子買奶粉。\n\
    \n### 分散風險\n\n做這行需要賭性，但不能做賭徒。如果你喜歡刺激，手手下大注，夢想快快發財，那麼遲早會翻船說再見，而且速度會比你想像的快更多。就算有十次好運，但第十一次好運不見得還會落在你頭上。\n\
    \n記住：你只能承擔計算過的風險，不要把所有雞蛋放在一個籃子裡。把手頭的資本分成五十至十份，在你認為至少有一比三的風險報酬比率時將其中的一份入市，同時牢記停損的最高生存原則，如此長期下來，就算不賺錢都難。新手的錯誤就是太急著賺錢，手手都要豪賭，恨不得明天就成為億萬富翁。中國「財不入急門」的古訓，在炒股進行可說是字字珠璣。\n\
    \n### 避免買太多種股票\n\n你最多能記住幾個電話號碼？普通人是十組電話號碼，你呢？\n\n手頭股票太多時，結果就是注意力分散，失去對單獨股票的感覺。我一直強調，你必須隨時具備股票運動是否正常的感覺，在這個基礎上才有可能有效控制進出場的時機。買一大堆類別不同的股票，恨不得每支掛牌股票都買一些，這是新手的典型錯誤，因為注意力將因此分散。\n\
    \n將注意力集中在三至五支最有潛力的股票，隨著經驗的增加，逐漸將留意的股票增加到十至十五支。\n\n我自己的極限是二十檔股票。你可以試試自己的極限，但無論如何，在任何情況下，都不要超出自己的極限。\n\
    \n### 有疑問的時候，離場！\n\n這是條容易明白但不容易執行的規則。很多時候，你根本就對股票的走勢失去感覺，你不知道它接下來要往上爬還是朝下跌，你也搞不清它處在升勢還是跌勢。此時，你的最佳選擇就是離場！\n\
    \n離場不是說不炒股了，而是別碰這檔股票。如果手頭有這檔股票，賣掉！手頭沒有，別買！我們已經明白了久賭能贏的技巧在於每次下注，你的獲勝機率必須超過五〇％，只要你的手頭還擁有沒有感覺的股票，表示你還未將賭注從賭桌上撤回來。當你不知這檔股票走勢的時候，你的贏面只剩下五〇％。專業賭徒絕對不會在這時把賭注留在檯面上。\n\
    \n別讓「專業賭徒」四字嚇壞你，每個生意人其實都是專業賭徒。你在學習成為炒股專家，對自己的要求必須高一些。通常這時後會出現另一個問題，幾乎炒過股的朋友都會有這樣的感覺：「當我擁有某檔股票時，我對它的感覺特別敏感，而且每天算帳，它讓我打起十二分的精神；但如果手中沒有這檔股票，我對它的注意力就不集中了。」我自己也有同樣的問題，我的處理方式就是——只留下一點股票，例如一百股。\n\
    \n如果虧了，我就將它當成買藥的錢，就當做我買了一帖讓注意力集中的藥。\n\n### 忘掉你的入場價\n\n坦白地講，沒有三、五年的功力，交過厚厚的一大疊學費，要你忘掉入場價是做不到的，但你必須明白這麼做的原因。今天你手中擁有的股票，按你的經驗，明天都應該會升。如果經驗告訴你這檔股票的運動不對了，明天可能會跌，那你還把它留在手中做什麼？這和你在什麼價位買進有什麼關係？我們之所以難以忘記進價，這和人性中喜賺小便宜，絕不願吃小虧的天性有關。如果這檔股票的價位已經比你的進價更高，你脫手會很容易，因為你已賺了便宜。若是更低的話，你必須面對「吃虧」的選擇！\n\
    \n普通人會找一百個「理由」再賴一會兒。我的朋友，「再賴一會兒」的價錢很高。人很難改變自己的人性，那就試著忘掉進價吧！這樣你就能專注於正確的時間做正確的事了。\n\
    \n### 別頻繁交易\n\n我開始專職炒股時，天天不買或賣上一次就覺得沒完成工作。我那時的想法是這樣的：我以炒股維生，不炒不就没事可做？這可是我的工作啊！結果，我為此付出了鉅額學費。\n\
    \n當經驗累積到一定地步，你就會明白股市不是每天都有盈利機會。你覺得不買、不賣就沒事可做，缺少刺激，那麼你的代價就是每次出入場的手續費。\n\n除了手續費之外，每天買賣都帶來情緒波動，沖散了冷靜觀察股市的注意力。可以這么說，在你留著跟蹤的股票中，說每天都有七〇或八〇％勝算的交易機會是騙人的，好的操作機會不會天天都有。股民之所以頻繁交易是因枯燥無聊，頻繁交易不僅損失手續費，同時也使得交易品質降低。\n\
    \n### 不要向下攤平\n\n犯了錯，不是老老實實地認錯，重新開始，而是抱著僥倖心理，向下攤平，把平均進價降低，滿心希望股票小有反彈就能挽回損失，甚至賺錢。這是常人的想法和做法，但在這卻是破產捷徑，英國歷史最悠久的巴林銀行（Barings\
    \ Bank）就是這樣倒閉的……\n\n上海石化在美國掛牌上市，一九九七年最高曾達到每股四十五美元。從四十五美元跌到三十五美元，很低了吧？你心裡想，是不是應該再補上兩千股？若是再跌到二十五美元，你打算怎麼辦？還往下攤不攤？結果，上海石化一路跌到每股十美元。做為一名股票投資人，這樣的好戲只要上演一齣，你的財產就全部被套牢。等它升回四十五美元嗎？或許有可能，但這是兩年後或是二十年後才會發生的事，誰也說不准……如果股價永遠回不去呢？這樣被燙傷一次，你將不再有膽繼續炒股。假如幸運地市場給你一個解套機會，你會馬上套現把錢放在米缸裡，心中覺得還是天天摸到錢才會放心。\n\
    \n再見了，又一位交了學費、畢不了業的學股人。不要向下攤也可用另一種說法：第一次入場後，紙面上沒有利潤的話不要加碼。紙面有利潤了，表示你第一次入場的判斷正確，那麼可以擴大戰果，適當加注，否則即刻停止損離場，另尋機會。讀者請靜下心來思考一下為什麼，道理其實很簡單。\n\
    \n也許有人不服氣，我已有十次向下攤平都攤對了，它的確是解套良方。我真要羨慕你，你的運氣比我好多了。但你還未告訴我第十一次、第十五次的結果！你敢保證它們不會是王安電腦嗎？\n\
    \n對炒股老手來講，可以有很多例外。其中之一就是股票在升勢時，任何點都是好的入場點，碰巧你一入場，股票開始正常下調，在下調結束回頭時，你可以考慮再進點股，就算進價比你第一次進價低也沒關係。\n\
    \n這樣做並不是為了解套，而是你「知道」股票的升勢還在繼續。只有將炒股的武藝煉到「無招」地步的炒手才可以考慮這麼做，沒有三、五年的經驗莫談。新手們謹請記住：不要向下攤平！\n\
    \n### 別讓利潤變成虧損\n\n這條規矩是這樣的：你在十一元一股進了一千股，現在股票升到十二元了，你已有兩千元\n\n的利潤。這時要定好停損價，價格應在十元之上，例如十·五〇元或十一元，不要讓股票跌回九元時才停損。\n\
    \n你若炒過股，就會明白當股票從十元升到十二元，卻讓它跌回九元，最後割肉停損，這種感覺是多麼令人懊惱。你會覺得自己太愚蠢！無論何時如果覺得自己很蠢，要想想你一定做錯了什麼！\n\
    \n把停損點定在十一元，賣掉時算算還賺到錢，這和在九元時不得不割肉的感覺肯定是不一樣的。這還牽涉到炒股的第一要務：保本！\n\n在任何情況下，盡量保住你的本金。\n\
    \n有些讀者會問：股價是十二元，把停損點定在十一·九〇元，這樣不就能保證賺得更多，數錢時更開心嗎？\n\n話是這樣說不錯，但實際上可不能這麼做。股票波動一毛錢的時間有時無須花上兩分鐘，一旦出場了，股票可能一路衝到十五元，你就失去賺大錢的機會了。把停損點定在十·五〇元或十一元，你可以給手上這支股票一〇％左右的喘息空間，因為一支正常上升的股票不會輕易跌損一〇％。\n\
    \n### 跟著股市走，別跟朋友走！\n\n這條規矩的簡單解釋就是：別跟著朋友買或賣，要按市場情況來買賣。我在交易大廳常常聽到：「你今天進了什麼股票？我想跟著你一起進。」\n\
    \n每次聽完我都覺得好笑，因為它總讓我想起三個盲人如何一起走路。\n\n你們留意一下，三個盲人走路，通常是一人在前探路，隨後一列跟著兩位盲人。第一位盲人在前面走，後面跟的兩位盲人省點勁，第一位盲人選的路是否是最佳路線這就不管了，反正大家都看不見。而三位眼睛好的行人往往是排成一行走，你走你的，我走我的，還可以方便聊天，碰到石頭水溝時大家各自知道如何避開。他們也有一列走的時候，那時他們走的路一定最順暢。\n\
    \n一位真正懂炒股的人通常不願別人跟著買，因為你可以跟我買，但我要賣的時候你不知道，最終結果可能害了你。而且如果賣股票時還要記著通知你，心理負擔多大？萬一虧錢的話怎麼辦？\n\
    \n朋友，下點功夫研究股票的運動規律，學著選擇買點和賣點。想跟著朋友買賣不要緊，據據他是什麼材料。喜歡你跟著他的人通常本身是盲人，盲人才喜歡帶路。\n\n\
    ### 該賣股票時，當機立斷，千萬別遲疑！\n\n我在一九九四年十一月二日的炒股日記上有這樣一句話：「2:30（股票交易符號），股數兩千，進價十七·二五元，升到二十三·五○元，未在二十一·五○元賣出，今跌到十六·二五元，蠢啊蠢！痛啊啊痛！」\n\
    \n這是二十二年前的記錄，我已記不清當時的具體情況，從上面的幾句話，我知道自己曾將賣點定在二十一·五○元，當股票從二十三·五○元跌到二十一·五○元時，不知什麼原因使我遲疑，沒有及時採取行動。在十一月二日時，股票跌到十六·二五元。我從原本八百美元的利潤，最後竟變成倒虧兩千美元，我痛呼蠢啊蠢！\n\
    \n股票波動向來花樣百出，它在跌的時候，總不時來個小反彈，給你一線希望，讓你覺得跌勢已開始轉頭。股票重新下跌，你原來的希望破滅，準備割肉放棄時，它又來個小反彈，重新把你拴住。一開始是小小的損失，但經過幾次來回，就成了大損失。這就是已學會「停損」的股友還會虧大錢的原因。\n\
    \n停損的概念不要只體現在你的本金上，也要包括利潤在內。十元買進一千股，花了一萬元的本，只要升到十五元，手頭上就有一萬五千元了。別把五千元僅當成紙面利潤，不信的話就把股票賣掉，存入銀行，看看多出的五千元是真錢還是假錢。定好了出場價，當股票跌到設定的出場價時，不要幻想，不要期待，不要講理由，立刻賣掉再說。\n\
    \n### 別將「股價很低了」當成買的理由，也別將「股價很高了」當成賣的理由！\n\n我今天手裡還有檔股票，交易符號是BB（現已被除名，不掛牌），是一家開養老院的公司。當時它從十五美元跌到五美元，我覺得股價很低了，花了五千美元進了一千股。現在的牌價是〇·二五美元。我的五千美元只剩兩百五十美元。這檔股票我一直沒有停損，當年是「不肯」，今天我用它來提醒自己：「你永遠不知股票會跌到多低！」\n\
    \n因為人是健忘的。\n\n我發覺新手們特別喜歡買低價股，來請教我某檔股票是否可買的朋友，他們選的股票大多數是低價股。這低價是指股票從高價跌下來，例如從四十美元跌到二十美元。這樣的想法或許是源自日常生活，衣服從四十美元降價到二十美元，那一定是便宜了。把這樣的習慣引申到股票，自然而然會找「減價股票」來買。但不幸地，若是用選衣服的方法選股票，在炒股這行鐵定失敗。\n\
    \n股票從四十美元跌到二十美元，通常都有它的內在原因，你憑什麼斷定它不會繼續往下跌呢？英有句話是這麼說的：「別試著接住往下掉的刀子，它會把你的手砸得血淋淋！」（Do\
    \ not catch a falling knife.）所謂炒手，最重要的是跟勢，股票從四十美元跌到二十美元，明顯是跌勢，你不能逆勢而行。當然要是股票從四十美元跌到十美元，現在又從十美元升到二十美元，那就是兩碼事了。\n\
    \n一位新手在發現他買進的股票升了時會很興奮，但是也會惴惴不安，生怕市場把好不容易借給的利潤又收回去。他成日腦海裡盤旋的就是「股票是不是升到頂了？」「還是別貪了，快賣吧。」\n\
    \n這裡要提醒讀者的就是：別將「股價很高了」當成賣的理由，你永遠不知股票會升多高。只要股票的升勢正常，別離開這場股票。記住前面提到過的華爾格言：「截短虧損，讓利潤奔跑！」\n\
    \n### 訂好計畫，按著既定方針執行\n\n進股時，先認清你的風險和報酬各是什麼。若市場未按你預定的軌道運行時你會如何改變？最好寫下應變的策略。特別對新手而言，入市幾天後，自己都記不起入股時是怎樣想的。\n\
    \n如果你的停損是一○％，十元進貨，升到十五元，停損點就定在十三·五○元，沒有其他理由。若股票跌到十三·五○元就說再見，如果你的原定計畫是十元入股，十五元賣出獲利，那麼股票升到十五元時就堅決賣出，不要猶豫。雖然我強調在運行最好不要預定獲利點，但你如果有這樣的計畫就照做。股票行的方法實際上沒有什麼對或錯，關鍵是你需要找到適合自己風險承受力的方法，而且堅決按照這個方法去做。隨著經驗的增加，你會不斷改變自己的方法，這就如螺旋一樣，轉了一圈，你似乎還在原位，但其實你已經高了一層。方法可以修改，也必須隨著經驗的累積而修改，重要的是在任何時候，都必須有個原則並且依據這項原則來指導你的一切行動。\n\
    \n新手們最易犯的錯誤之一就是缺少計畫。他們可能覺得這檔股票已經跌到很低，或是某人说這檔股票好就買進，但買進之後如何追蹤就茫無頭緒。什麼情況下停損？什麼情況下獲利？一問三不知。你若也是上述狀況所說的其中一員，勸你趕快學會訂定好自己的計畫。股票學校的學費非常昂貴的。\n\
    \n### 別愛上任何股票\n\n有人會愛上某檔股票！原因是對該股票做了很多研究。無論是什麼，一旦熟悉了，慢慢地就會產生感情，這是人性沒辦法！但是在炒股這行，愛上股票極其危險，因為它會斷送你的炒股生命。\n\
    \n印象深刻的是我的第一部車。\n\n和大多數一九八〇年代初來美國的人一樣，我是空著手來。在美國沒車不行，在餐館工作了一年，賺得的薪水交完學費後還剩下一點，於是我就買了一台舊車。\n\
    \n## 第 5 章 華爾街的家訓\n\n我的第一部舊車是本田喜美，那是一台車齡長達十年的老爺車，到我手上已經累積了十六萬英里的里程數。任何開過車的駕駛人都知道，十年車齡、十六萬英里車程的老爺車問題多著呢！我是窮學生嘛，修車的事當然只有自己動手囉。在往後的一年裡，我從煞車到化油器都試著自己換了一遍，著實對這部車下了功夫。甚至開長途車程的話，我還會將修車工具和常用零件放在車上。\n\
    \n雖然這部車後來就因為在跑不動，兩年後就宣告退休了。但這兩年下來，我愛上了這部車，因為我對它實在是太熟悉了，儘管多年後談到買車我還是會想起本田。由此也可知，大車廠的入門車常虧本賣，就是因為他們希望能夠釣到初買車的消費者，希望消費者能一試成主顧，成為品牌長久愛用者。\n\
    \n講回股票，你研究公司的產品，分析營收，固定資產，本益比；試用其產品，甚至研究總經裡的人字命盤。一段時間下來，就如同我當年修舊車上了癮，腦袋裡總忘不了它。什麼炒股計畫，什麼停損，統統再見！股票升，應該的；股票跌，暫時的；反正我相信你的產品有前途，公司有未來，明天一定會更好！網略股泡沫大家都記得，例子我就不舉了。公司研究做多了，難免對這家公司產生感情，這是人性！但請明白這是人性的弱點：別昏了頭，忘了保本，忘了停損。\n\
    \n> 請謹記：別愛上任何股票。\n\n### 市場從來不會錯，但你自己的想法常是錯的\n\n有多少次，你拍著腦袋大叫：「見鬼了，無論從什麼角度分析，這檔股票都沒有理由跌，它很快就會反彈。」我朋友來找我討論股票，他們都會一條條列出他們的分析，最後認定這檔股票升到頂了，那檔股票跌到底了。\n\
    \n我無法證明其對錯，通常我只建議若想買那就買吧，但若股票又跌了一〇%,即刻脫手。如果你想賣，那就賣吧，反正不賣你也睡不著。\n\n華爾街很多著名專家，在這一條原則上都翻了跟斗。人一旦出了點名，名聲就重於一切，他們認為股票要升，不升怎麼辦？他們最終結論當然是市場錯了，市場還未體驗到這檔股票的價值。結果就是專家們一個個從寶座上跌下來。這樣的故事非常多。愈聰明的人，愈容易自以爲是。他們在生活中的決定通常能做對決策，或是有些一開始不對勁，但最終證明他們正確。但在炒股這一行，或許最終他們的確正確，但在市場證明其正確之前，他們可能早已剃光頭回家了。\n\
    \n不要自以爲是，不要有虛榮心，要按照市場給的資訊決定行動計畫，一有不對勁時便即刻認錯，這才是股市的長存之道。\n\n以下，讀者們可以欣賞一下世界著名炒股大師是如何討論炒股。\n\
    \n## 第二節 投資大師論炒股\n\n關於華倫·巴菲特的自傳或是相關股票投資書籍，市面上已有很多了，我在這裡簡單地介紹他的投資理念。華倫·巴菲特投資的時間累積程度很難模仿，但他的思考模式很有參考價值。想在投資領域中成功，他認為必須具備以下六點特質：\n\
    \n- 第一、你要有點貪念，但不能太多。太多的話，貪念就會控制你；但太少的話，你就會失去動力。你必須對投資過程充滿好奇心。\n- 第二、你必須有耐心。你買了一家公司的股票，應該打算永遠擁有這一股票。你不應隨大流而動。如果對公司的判斷正確而且在適合的價位進場，最終你會看到股票的價值。\n\
    - 第三、你必須獨立思考。如果你自認不具備足夠的知識做判斷，最好不要做任何判斷。\n- 第四、你必須有自信。而且你的自信必須來自知識和經驗，而非一時的頭腦發熱。\n\
    - 第五、不要不懂裝懂，要有自知之明。對自己不懂的東西，要承認自己不懂。\n- 第六、有彈性。什麼東西都可以買，但不要付出超出其價值的價格。\n\n- 華倫·巴菲特列出以下幾點做爲選擇公司的參考：\n\
    \  1. 這家公司做什麼生意很容易理解。\n  2. 經營這家公司不需要天才，平常人也能經營。\n  3. 這家公司能提供可以預計的盈利。\n  4. 經營者擁有公司的股份。\n\
    \  5. 公司不應有太多存貨且貨如輪轉。\n  6. 公司的固定資產報酬率高。\n\n- 華倫·巴菲特每年給他的投資者的年度報告都強調兩點：\n  1.\
    \ 我們的投資將基於股票的價值而不是股票是否熱門。\n  2. 我們的管理將盡量使損失降至最低（有別於股價的短期波動）。\n\n成功投資者的重要素質之一，便是在市場情況不允許時離開市場。\n\
    \n一九六六年，當華倫·巴菲特認爲「便宜」股票很難找到時，他決定暫離市場。當時他是這樣向投資者们解釋：「我對現今的情況感到失落……但有一點我很清楚，我只能以我熟悉的方式進行投資。這樣做或許會失去一些鉅額而且賺錢容易的盈利機會。但我不能進行我所不熟悉的投資方式，因爲這可能導致鉅額損失。」\n\
    \n優秀的投資者只有在獲勝機率很大的情況下，才會將資金投入股市。華倫·巴菲特便是其中的佼佼者。\n\n### 喬治·索羅斯 (George Soros)\n\
    \n喬治·索羅斯的投資哲學可以概括成以下兩點：\n\n- 一、不要第一次就入市太深，從少量開始，如果進展順利，再加碼。炒手們必須從一開始就決定承擔多大的風險，這是艱難的判斷，但不要一下子就擔上太大的風險。\n\
    - 二、市場是愚蠢的，你也用不著太聰明。你不需要什麼都懂，但你必須在某一方面懂得比別人多。\n\n喬治·索羅斯在歐洲推銷證券時，發現德國一些銀行手中持有的其他公司股票市值，居然超過銀行本身的股市總價。他推薦買這些德國銀行股票，因爲這等於銀行付錢請你當這些公司股東。\n\
    \n「要知道這點，」喬治·索羅斯說，「就是買這些銀行股的充足理由。」喬治·索羅斯建議投資研究愈簡單愈好。他自己從不在經濟研究上花大量的時間，不讀華爾街證券行的研究報告。他的投資主意大多來自於閱讀報紙。他認為技術圖表分析的理論基礎太過薄弱，在實踐中不能帶來恆久的結果。基本分析的理論基礎比較強，但也有其弱點，因爲變動的股票同時改變基本面分析的結論。\n\
    \n華爾街有一個通行的理論是「充分市場理論」（efficient market theory），股票價格在特定時間充分反映股票價值，它包括公司的內部經營和外部大環境。喬治·索羅斯認為這項理論錯誤。因爲若按此理論，任何人要獲得比大市更高的報酬率根本就不可能。\n\
    \n喬治·索羅斯用自己的記錄證明這項理論無效，他連續不斷地在市場獲得比大市還高的報酬。他自己提出了「回饋理論」（theory of reflexivity）。簡簡單地說：想法改變了事件，事件的改變又反過來改變想法。例如投機者們認爲美元會升，他們入場買美元，其結果使美元利息降低，刺激了經濟，這給大衆帶來美元應該升得更高的想法。用這個理論來解釋股市的走勢，大家看好某股票，捧出這支股票的結果使股票升高，股價的升高使得更多的人追捧，這就是爲何股票走勢一日開始，不會馬上結束的原因。\n\
    \n喬治·索羅斯的思路極難模仿。他的自傳及炒股技術專著《金融煉金術》（The Alchemy\n"
  mdcn: "\n## 第一節 華爾街的投資智慧\n\n要把所有的華爾街家訓都寫出來，起碼需要兩百頁篇幅，而且其中大部分是「為賦新詞強說愁」。我將親身實踐後證明最重要的規矩整理出來。這些規矩已由我的實際操作證明可以遵循，而且行之有效，希望讀者們能牢牢記住。\n\
    \n### 停損，停損，停損！\n\n我不知該如何強調這兩個字的重要，我也不知還能否解釋這兩個字，這是炒股這一行的最高行為準則。你若覺得自己實在沒辦法以比進價更低的價錢賣出手中的股票，那就趕緊退出這行吧！因為你在炒股這一行沒有任何生存的機會。最後割一次肉，痛一次，你還能剩幾塊錢替兒子買奶粉。\n\
    \n### 分散風險\n\n做這行需要賭性，但不能做賭徒。如果你喜歡刺激，手手下大注，夢想快快發財，那麼遲早會翻船說再見，而且速度會比你想像的快更多。就算有十次好運，但第十一次好運不見得還會落在你頭上。\n\
    \n記住：你只能承擔計算過的風險，不要把所有雞蛋放在一個籃子裡。把手頭的資本分成五十至十份，在你認為至少有一比三的風險報酬比率時將其中的一份入市，同時牢記停損的最高生存原則，如此長期下來，就算不賺錢都難。新手的錯誤就是太急著賺錢，手手都要豪賭，恨不得明天就成為億萬富翁。中國「財不入急門」的古訓，在炒股進行可說是字字珠璣。\n\
    \n### 避免買太多種股票\n\n你最多能記住幾個電話號碼？普通人是十組電話號碼，你呢？\n\n手頭股票太多時，結果就是注意力分散，失去對單獨股票的感覺。我一直強調，你必須隨時具備股票運動是否正常的感覺，在這個基礎上才有可能有效控制進出場的時機。買一大堆類別不同的股票，恨不得每支掛牌股票都買一些，這是新手的典型錯誤，因為注意力將因此分散。\n\
    \n將注意力集中在三至五支最有潛力的股票，隨著經驗的增加，逐漸將留意的股票增加到十至十五支。\n\n我自己的極限是二十檔股票。你可以試試自己的極限，但無論如何，在任何情況下，都不要超出自己的極限。\n\
    \n### 有疑問的時候，離場！\n\n這是條容易明白但不容易執行的規則。很多時候，你根本就對股票的走勢失去感覺，你不知道它接下來要往上爬還是朝下跌，你也搞不清它處在升勢還是跌勢。此時，你的最佳選擇就是離場！\n\
    \n離場不是說不炒股了，而是別碰這檔股票。如果手頭有這檔股票，賣掉！手頭沒有，別買！我們已經明白了久賭能贏的技巧在於每次下注，你的獲勝機率必須超過五〇％，只要你的手頭還擁有沒有感覺的股票，表示你還未將賭注從賭桌上撤回來。當你不知這檔股票走勢的時候，你的贏面只剩下五〇％。專業賭徒絕對不會在這時把賭注留在檯面上。\n\
    \n別讓「專業賭徒」四字嚇壞你，每個生意人其實都是專業賭徒。你在學習成為炒股專家，對自己的要求必須高一些。通常這時後會出現另一個問題，幾乎炒過股的朋友都會有這樣的感覺：「當我擁有某檔股票時，我對它的感覺特別敏感，而且每天算帳，它讓我打起十二分的精神；但如果手中沒有這檔股票，我對它的注意力就不集中了。」我自己也有同樣的問題，我的處理方式就是——只留下一點股票，例如一百股。\n\
    \n如果虧了，我就將它當成買藥的錢，就當做我買了一帖讓注意力集中的藥。\n\n### 忘掉你的入場價\n\n坦白地講，沒有三、五年的功力，交過厚厚的一大疊學費，要你忘掉入場價是做不到的，但你必須明白這麼做的原因。今天你手中擁有的股票，按你的經驗，明天都應該會升。如果經驗告訴你這檔股票的運動不對了，明天可能會跌，那你還把它留在手中做什麼？這和你在什麼價位買進有什麼關係？我們之所以難以忘記進價，這和人性中喜賺小便宜，絕不願吃小虧的天性有關。如果這檔股票的價位已經比你的進價更高，你脫手會很容易，因為你已賺了便宜。若是更低的話，你必須面對「吃虧」的選擇！\n\
    \n普通人會找一百個「理由」再賴一會兒。我的朋友，「再賴一會兒」的價錢很高。人很難改變自己的人性，那就試著忘掉進價吧！這樣你就能專注於正確的時間做正確的事了。\n\
    \n### 別頻繁交易\n\n我開始專職炒股時，天天不買或賣上一次就覺得沒完成工作。我那時的想法是這樣的：我以炒股維生，不炒不就没事可做？這可是我的工作啊！結果，我為此付出了鉅額學費。\n\
    \n當經驗累積到一定地步，你就會明白股市不是每天都有盈利機會。你覺得不買、不賣就沒事可做，缺少刺激，那麼你的代價就是每次出入場的手續費。\n\n除了手續費之外，每天買賣都帶來情緒波動，沖散了冷靜觀察股市的注意力。可以這么說，在你留著跟蹤的股票中，說每天都有七〇或八〇％勝算的交易機會是騙人的，好的操作機會不會天天都有。股民之所以頻繁交易是因枯燥無聊，頻繁交易不僅損失手續費，同時也使得交易品質降低。\n\
    \n### 不要向下攤平\n\n犯了錯，不是老老實實地認錯，重新開始，而是抱著僥倖心理，向下攤平，把平均進價降低，滿心希望股票小有反彈就能挽回損失，甚至賺錢。這是常人的想法和做法，但在這卻是破產捷徑，英國歷史最悠久的巴林銀行（Barings\
    \ Bank）就是這樣倒閉的……\n\n上海石化在美國掛牌上市，一九九七年最高曾達到每股四十五美元。從四十五美元跌到三十五美元，很低了吧？你心裡想，是不是應該再補上兩千股？若是再跌到二十五美元，你打算怎麼辦？還往下攤不攤？結果，上海石化一路跌到每股十美元。做為一名股票投資人，這樣的好戲只要上演一齣，你的財產就全部被套牢。等它升回四十五美元嗎？或許有可能，但這是兩年後或是二十年後才會發生的事，誰也說不准……如果股價永遠回不去呢？這樣被燙傷一次，你將不再有膽繼續炒股。假如幸運地市場給你一個解套機會，你會馬上套現把錢放在米缸裡，心中覺得還是天天摸到錢才會放心。\n\
    \n再見了，又一位交了學費、畢不了業的學股人。不要向下攤也可用另一種說法：第一次入場後，紙面上沒有利潤的話不要加碼。紙面有利潤了，表示你第一次入場的判斷正確，那麼可以擴大戰果，適當加注，否則即刻停止損離場，另尋機會。讀者請靜下心來思考一下為什麼，道理其實很簡單。\n\
    \n也許有人不服氣，我已有十次向下攤平都攤對了，它的確是解套良方。我真要羨慕你，你的運氣比我好多了。但你還未告訴我第十一次、第十五次的結果！你敢保證它們不會是王安電腦嗎？\n\
    \n對炒股老手來講，可以有很多例外。其中之一就是股票在升勢時，任何點都是好的入場點，碰巧你一入場，股票開始正常下調，在下調結束回頭時，你可以考慮再進點股，就算進價比你第一次進價低也沒關係。\n\
    \n這樣做並不是為了解套，而是你「知道」股票的升勢還在繼續。只有將炒股的武藝煉到「無招」地步的炒手才可以考慮這麼做，沒有三、五年的經驗莫談。新手們謹請記住：不要向下攤平！\n\
    \n### 別讓利潤變成虧損\n\n這條規矩是這樣的：你在十一元一股進了一千股，現在股票升到十二元了，你已有兩千元\n\n的利潤。這時要定好停損價，價格應在十元之上，例如十·五〇元或十一元，不要讓股票跌回九元時才停損。\n\
    \n你若炒過股，就會明白當股票從十元升到十二元，卻讓它跌回九元，最後割肉停損，這種感覺是多麼令人懊惱。你會覺得自己太愚蠢！無論何時如果覺得自己很蠢，要想想你一定做錯了什麼！\n\
    \n把停損點定在十一元，賣掉時算算還賺到錢，這和在九元時不得不割肉的感覺肯定是不一樣的。這還牽涉到炒股的第一要務：保本！\n\n在任何情況下，盡量保住你的本金。\n\
    \n有些讀者會問：股價是十二元，把停損點定在十一·九〇元，這樣不就能保證賺得更多，數錢時更開心嗎？\n\n話是這樣說不錯，但實際上可不能這麼做。股票波動一毛錢的時間有時無須花上兩分鐘，一旦出場了，股票可能一路衝到十五元，你就失去賺大錢的機會了。把停損點定在十·五〇元或十一元，你可以給手上這支股票一〇％左右的喘息空間，因為一支正常上升的股票不會輕易跌損一〇％。\n\
    \n### 跟著股市走，別跟朋友走！\n\n這條規矩的簡單解釋就是：別跟著朋友買或賣，要按市場情況來買賣。我在交易大廳常常聽到：「你今天進了什麼股票？我想跟著你一起進。」\n\
    \n每次聽完我都覺得好笑，因為它總讓我想起三個盲人如何一起走路。\n\n你們留意一下，三個盲人走路，通常是一人在前探路，隨後一列跟著兩位盲人。第一位盲人在前面走，後面跟的兩位盲人省點勁，第一位盲人選的路是否是最佳路線這就不管了，反正大家都看不見。而三位眼睛好的行人往往是排成一行走，你走你的，我走我的，還可以方便聊天，碰到石頭水溝時大家各自知道如何避開。他們也有一列走的時候，那時他們走的路一定最順暢。\n\
    \n一位真正懂炒股的人通常不願別人跟著買，因為你可以跟我買，但我要賣的時候你不知道，最終結果可能害了你。而且如果賣股票時還要記著通知你，心理負擔多大？萬一虧錢的話怎麼辦？\n\
    \n朋友，下點功夫研究股票的運動規律，學著選擇買點和賣點。想跟著朋友買賣不要緊，據據他是什麼材料。喜歡你跟著他的人通常本身是盲人，盲人才喜歡帶路。\n\n\
    ### 該賣股票時，當機立斷，千萬別遲疑！\n\n我在一九九四年十一月二日的炒股日記上有這樣一句話：「2:30（股票交易符號），股數兩千，進價十七·二五元，升到二十三·五○元，未在二十一·五○元賣出，今跌到十六·二五元，蠢啊蠢！痛啊啊痛！」\n\
    \n這是二十二年前的記錄，我已記不清當時的具體情況，從上面的幾句話，我知道自己曾將賣點定在二十一·五○元，當股票從二十三·五○元跌到二十一·五○元時，不知什麼原因使我遲疑，沒有及時採取行動。在十一月二日時，股票跌到十六·二五元。我從原本八百美元的利潤，最後竟變成倒虧兩千美元，我痛呼蠢啊蠢！\n\
    \n股票波動向來花樣百出，它在跌的時候，總不時來個小反彈，給你一線希望，讓你覺得跌勢已開始轉頭。股票重新下跌，你原來的希望破滅，準備割肉放棄時，它又來個小反彈，重新把你拴住。一開始是小小的損失，但經過幾次來回，就成了大損失。這就是已學會「停損」的股友還會虧大錢的原因。\n\
    \n停損的概念不要只體現在你的本金上，也要包括利潤在內。十元買進一千股，花了一萬元的本，只要升到十五元，手頭上就有一萬五千元了。別把五千元僅當成紙面利潤，不信的話就把股票賣掉，存入銀行，看看多出的五千元是真錢還是假錢。定好了出場價，當股票跌到設定的出場價時，不要幻想，不要期待，不要講理由，立刻賣掉再說。\n\
    \n### 別將「股價很低了」當成買的理由，也別將「股價很高了」當成賣的理由！\n\n我今天手裡還有檔股票，交易符號是BB（現已被除名，不掛牌），是一家開養老院的公司。當時它從十五美元跌到五美元，我覺得股價很低了，花了五千美元進了一千股。現在的牌價是〇·二五美元。我的五千美元只剩兩百五十美元。這檔股票我一直沒有停損，當年是「不肯」，今天我用它來提醒自己：「你永遠不知股票會跌到多低！」\n\
    \n因為人是健忘的。\n\n我發覺新手們特別喜歡買低價股，來請教我某檔股票是否可買的朋友，他們選的股票大多數是低價股。這低價是指股票從高價跌下來，例如從四十美元跌到二十美元。這樣的想法或許是源自日常生活，衣服從四十美元降價到二十美元，那一定是便宜了。把這樣的習慣引申到股票，自然而然會找「減價股票」來買。但不幸地，若是用選衣服的方法選股票，在炒股這行鐵定失敗。\n\
    \n股票從四十美元跌到二十美元，通常都有它的內在原因，你憑什麼斷定它不會繼續往下跌呢？英有句話是這麼說的：「別試著接住往下掉的刀子，它會把你的手砸得血淋淋！」（Do\
    \ not catch a falling knife.）所謂炒手，最重要的是跟勢，股票從四十美元跌到二十美元，明顯是跌勢，你不能逆勢而行。當然要是股票從四十美元跌到十美元，現在又從十美元升到二十美元，那就是兩碼事了。\n\
    \n一位新手在發現他買進的股票升了時會很興奮，但是也會惴惴不安，生怕市場把好不容易借給的利潤又收回去。他成日腦海裡盤旋的就是「股票是不是升到頂了？」「還是別貪了，快賣吧。」\n\
    \n這裡要提醒讀者的就是：別將「股價很高了」當成賣的理由，你永遠不知股票會升多高。只要股票的升勢正常，別離開這場股票。記住前面提到過的華爾格言：「截短虧損，讓利潤奔跑！」\n\
    \n### 訂好計畫，按著既定方針執行\n\n進股時，先認清你的風險和報酬各是什麼。若市場未按你預定的軌道運行時你會如何改變？最好寫下應變的策略。特別對新手而言，入市幾天後，自己都記不起入股時是怎樣想的。\n\
    \n如果你的停損是一○％，十元進貨，升到十五元，停損點就定在十三·五○元，沒有其他理由。若股票跌到十三·五○元就說再見，如果你的原定計畫是十元入股，十五元賣出獲利，那麼股票升到十五元時就堅決賣出，不要猶豫。雖然我強調在運行最好不要預定獲利點，但你如果有這樣的計畫就照做。股票行的方法實際上沒有什麼對或錯，關鍵是你需要找到適合自己風險承受力的方法，而且堅決按照這個方法去做。隨著經驗的增加，你會不斷改變自己的方法，這就如螺旋一樣，轉了一圈，你似乎還在原位，但其實你已經高了一層。方法可以修改，也必須隨著經驗的累積而修改，重要的是在任何時候，都必須有個原則並且依據這項原則來指導你的一切行動。\n\
    \n新手們最易犯的錯誤之一就是缺少計畫。他們可能覺得這檔股票已經跌到很低，或是某人说這檔股票好就買進，但買進之後如何追蹤就茫無頭緒。什麼情況下停損？什麼情況下獲利？一問三不知。你若也是上述狀況所說的其中一員，勸你趕快學會訂定好自己的計畫。股票學校的學費非常昂貴的。\n\
    \n### 別愛上任何股票\n\n有人會愛上某檔股票！原因是對該股票做了很多研究。無論是什麼，一旦熟悉了，慢慢地就會產生感情，這是人性沒辦法！但是在炒股這行，愛上股票極其危險，因為它會斷送你的炒股生命。\n\
    \n印象深刻的是我的第一部車。\n\n和大多數一九八〇年代初來美國的人一樣，我是空著手來。在美國沒車不行，在餐館工作了一年，賺得的薪水交完學費後還剩下一點，於是我就買了一台舊車。\n\
    \n## 第 5 章 華爾街的家訓\n\n我的第一部舊車是本田喜美，那是一台車齡長達十年的老爺車，到我手上已經累積了十六萬英里的里程數。任何開過車的駕駛人都知道，十年車齡、十六萬英里車程的老爺車問題多著呢！我是窮學生嘛，修車的事當然只有自己動手囉。在往後的一年裡，我從煞車到化油器都試著自己換了一遍，著實對這部車下了功夫。甚至開長途車程的話，我還會將修車工具和常用零件放在車上。\n\
    \n雖然這部車後來就因為在跑不動，兩年後就宣告退休了。但這兩年下來，我愛上了這部車，因為我對它實在是太熟悉了，儘管多年後談到買車我還是會想起本田。由此也可知，大車廠的入門車常虧本賣，就是因為他們希望能夠釣到初買車的消費者，希望消費者能一試成主顧，成為品牌長久愛用者。\n\
    \n講回股票，你研究公司的產品，分析營收，固定資產，本益比；試用其產品，甚至研究總經裡的人字命盤。一段時間下來，就如同我當年修舊車上了癮，腦袋裡總忘不了它。什麼炒股計畫，什麼停損，統統再見！股票升，應該的；股票跌，暫時的；反正我相信你的產品有前途，公司有未來，明天一定會更好！網略股泡沫大家都記得，例子我就不舉了。公司研究做多了，難免對這家公司產生感情，這是人性！但請明白這是人性的弱點：別昏了頭，忘了保本，忘了停損。\n\
    \n> 請謹記：別愛上任何股票。\n\n### 市場從來不會錯，但你自己的想法常是錯的\n\n有多少次，你拍著腦袋大叫：「見鬼了，無論從什麼角度分析，這檔股票都沒有理由跌，它很快就會反彈。」我朋友來找我討論股票，他們都會一條條列出他們的分析，最後認定這檔股票升到頂了，那檔股票跌到底了。\n\
    \n我無法證明其對錯，通常我只建議若想買那就買吧，但若股票又跌了一〇%,即刻脫手。如果你想賣，那就賣吧，反正不賣你也睡不著。\n\n華爾街很多著名專家，在這一條原則上都翻了跟斗。人一旦出了點名，名聲就重於一切，他們認為股票要升，不升怎麼辦？他們最終結論當然是市場錯了，市場還未體驗到這檔股票的價值。結果就是專家們一個個從寶座上跌下來。這樣的故事非常多。愈聰明的人，愈容易自以爲是。他們在生活中的決定通常能做對決策，或是有些一開始不對勁，但最終證明他們正確。但在炒股這一行，或許最終他們的確正確，但在市場證明其正確之前，他們可能早已剃光頭回家了。\n\
    \n不要自以爲是，不要有虛榮心，要按照市場給的資訊決定行動計畫，一有不對勁時便即刻認錯，這才是股市的長存之道。\n\n以下，讀者們可以欣賞一下世界著名炒股大師是如何討論炒股。\n\
    \n## 第二節 投資大師論炒股\n\n關於華倫·巴菲特的自傳或是相關股票投資書籍，市面上已有很多了，我在這裡簡單地介紹他的投資理念。華倫·巴菲特投資的時間累積程度很難模仿，但他的思考模式很有參考價值。想在投資領域中成功，他認為必須具備以下六點特質：\n\
    \n- 第一、你要有點貪念，但不能太多。太多的話，貪念就會控制你；但太少的話，你就會失去動力。你必須對投資過程充滿好奇心。\n- 第二、你必須有耐心。你買了一家公司的股票，應該打算永遠擁有這一股票。你不應隨大流而動。如果對公司的判斷正確而且在適合的價位進場，最終你會看到股票的價值。\n\
    - 第三、你必須獨立思考。如果你自認不具備足夠的知識做判斷，最好不要做任何判斷。\n- 第四、你必須有自信。而且你的自信必須來自知識和經驗，而非一時的頭腦發熱。\n\
    - 第五、不要不懂裝懂，要有自知之明。對自己不懂的東西，要承認自己不懂。\n- 第六、有彈性。什麼東西都可以買，但不要付出超出其價值的價格。\n\n- 華倫·巴菲特列出以下幾點做爲選擇公司的參考：\n\
    \  1. 這家公司做什麼生意很容易理解。\n  2. 經營這家公司不需要天才，平常人也能經營。\n  3. 這家公司能提供可以預計的盈利。\n  4. 經營者擁有公司的股份。\n\
    \  5. 公司不應有太多存貨且貨如輪轉。\n  6. 公司的固定資產報酬率高。\n\n- 華倫·巴菲特每年給他的投資者的年度報告都強調兩點：\n  1.\
    \ 我們的投資將基於股票的價值而不是股票是否熱門。\n  2. 我們的管理將盡量使損失降至最低（有別於股價的短期波動）。\n\n成功投資者的重要素質之一，便是在市場情況不允許時離開市場。\n\
    \n一九六六年，當華倫·巴菲特認爲「便宜」股票很難找到時，他決定暫離市場。當時他是這樣向投資者们解釋：「我對現今的情況感到失落……但有一點我很清楚，我只能以我熟悉的方式進行投資。這樣做或許會失去一些鉅額而且賺錢容易的盈利機會。但我不能進行我所不熟悉的投資方式，因爲這可能導致鉅額損失。」\n\
    \n優秀的投資者只有在獲勝機率很大的情況下，才會將資金投入股市。華倫·巴菲特便是其中的佼佼者。\n\n### 喬治·索羅斯 (George Soros)\n\
    \n喬治·索羅斯的投資哲學可以概括成以下兩點：\n\n- 一、不要第一次就入市太深，從少量開始，如果進展順利，再加碼。炒手們必須從一開始就決定承擔多大的風險，這是艱難的判斷，但不要一下子就擔上太大的風險。\n\
    - 二、市場是愚蠢的，你也用不著太聰明。你不需要什麼都懂，但你必須在某一方面懂得比別人多。\n\n喬治·索羅斯在歐洲推銷證券時，發現德國一些銀行手中持有的其他公司股票市值，居然超過銀行本身的股市總價。他推薦買這些德國銀行股票，因爲這等於銀行付錢請你當這些公司股東。\n\
    \n「要知道這點，」喬治·索羅斯說，「就是買這些銀行股的充足理由。」喬治·索羅斯建議投資研究愈簡單愈好。他自己從不在經濟研究上花大量的時間，不讀華爾街證券行的研究報告。他的投資主意大多來自於閱讀報紙。他認為技術圖表分析的理論基礎太過薄弱，在實踐中不能帶來恆久的結果。基本分析的理論基礎比較強，但也有其弱點，因爲變動的股票同時改變基本面分析的結論。\n\
    \n華爾街有一個通行的理論是「充分市場理論」（efficient market theory），股票價格在特定時間充分反映股票價值，它包括公司的內部經營和外部大環境。喬治·索羅斯認為這項理論錯誤。因爲若按此理論，任何人要獲得比大市更高的報酬率根本就不可能。\n\
    \n喬治·索羅斯用自己的記錄證明這項理論無效，他連續不斷地在市場獲得比大市還高的報酬。他自己提出了「回饋理論」（theory of reflexivity）。簡簡單地說：想法改變了事件，事件的改變又反過來改變想法。例如投機者們認爲美元會升，他們入場買美元，其結果使美元利息降低，刺激了經濟，這給大衆帶來美元應該升得更高的想法。用這個理論來解釋股市的走勢，大家看好某股票，捧出這支股票的結果使股票升高，股價的升高使得更多的人追捧，這就是爲何股票走勢一日開始，不會馬上結束的原因。\n\
    \n喬治·索羅斯的思路極難模仿。他的自傳及炒股技術專著《金融煉金術》（The Alchemy\n"
