    # 人云亦云


    認賠殺出。否則，你在這一行生存的機率不大。


    做爲單一投資者，你要決定入場的時間，決定持股的時間，決定出場的時間。而股市就像海洋，它永不停息，沒有始點，沒有終點，每個浪潮的方向都難以捉摸。雖然它有漲潮，有退潮，但漲潮時有後退的波浪，退潮時有前進的波浪。


    > 總歸一句話，股市沒有既定的運行準則。


    要想達到盈利的目的，你必須建立自己的規則。否則，太多的可能會使你無所適從，其結果將會是一場災難。困難的地方在於：你必須建立一套自己的規則，並完全為這些規則負責，這是極大的責任。


    承擔責任是一般人所畏懼的。看看你身邊發生的事件就不難明白。一旦有任何差錯，張三怪李四，李四推王五。而在股市出錯又是如此地容易。


    對那些還不完全瞭解股票運動規律，未能明白在不同情況下應該如何應付的新股民來說，建立自己的規則絕非易事。因爲它必須建立在學識、經驗、自我判斷等因素之上，況且沒有人能立即建立完美的規則，特別在你對該遊戲的特性和對風險的承受力還沒有合理評價時，你必須不斷修改這些規則，承擔執行這些規則的後果。'
  - '[PAGE 47]


    但新股民既然要投入股市，要成為股市大軍的一員，而他們通常不具備制定規則的能力，也沒有承擔後果的心理準備，那他們自然就只能選擇「跟隨領袖」。這些「領袖」可能是隔壁的髮廊設計師，也可能是樓上的裁縫，理由多半是他們「炒過幾年股票」、「曾賺過錢」。這樣，這些新手們就輕易略過決策難題，如果結果是失敗的，他們也有了代罪羔羊，他們會對他人說：「樓上的王裁縫真是差勁，害我賠了一筆！」這就是所謂的「人好跟風」及後果。


    有一天，朋友打電話給我，說他準備賣掉手中的所有股票，我問他：「為什麼？」「昨晚走路摔了一跤，從來都沒這麼倒楣！」我想，它們之間有什麼關係嗎？但我還是說：「想賣就賣吧，反正不賣你也睡不著覺。」


    我明白他為什麼這麼想。因爲我也曾有過類似經驗。一位缺少計畫的投資者，他的輸贏是隨機的。就如同拋硬幣一樣，無論你如何猜測，還是不知道下一次丟出正面還是反面。在股市上，上回賺了錢，他不知道為什麼，也不知下回如何做才能重複賺錢的愉快經歷。虧了錢，他也不明白為什麼虧錢，下次該如何做去防止再次發生虧損的情形。這必然會產生極沉重的心理壓力，這些炒股所帶來的憂慮、期待和恐懼難以用筆墨形容。他覺得自己失去了控制，在股市的海洋中毫無目的地漂流，不知下一站是何處。


    你曾有過類似的經歷嗎？'
  - '[PAGE 48]


    解決這一問題的唯一方法就是——學習，慢慢建立自己對市場的感覺，不要跟風，不要人云亦云，一定要建立自己的規則。而你现在正在看這本書將會教你怎麼做。


    # 因循守舊


    平常上街，出門看到的仍是熟悉的房子，熟悉的街道。就算是改變，例如鋪馬路也是緩慢的。我們去上班，走的通常是熟悉的路，辦公室的模樣相對穩定，工作的性質和內容也相對穩定。


    現在想像一下你去某個地方上班：走的「路」你不熟悉，路邊「房子」也看起來很陌生，更糟糕的是沒人告訴你今天的「辦公室」在什麼地方，找不找得到「辦公室」得自己負責。此時你會有什麼感覺？你一定覺得茫然失措……


    股市就是這樣的地方。它們不會完全地重複自己。去年股票有這樣的漲跌，今年絕不會有同樣的波動。你就像跳進了海洋，失去了方向，覺得自己渺小、孤獨、無助……股市有它特有的規律，有它自己的特點。這些規律和特點都不是完全不變的，它只給你有會相識的感覺，按這些規律和特點來指引你在股市的行動，你能有五〇%以上的把握就不錯了。想想每天都要面對未知和疑問，有多少人能長期承受這樣的煎熬？'
  - '[PAGE 49]


    # 喜好報復


    在賭場，我常看到賭徒們輸了一手，下一手下注就加倍，再輸了，再加倍。希望總有一手能贏，到時連本帶利全回來。這一方面是人性中「輸不起」的心態，另一方面是報復賭場，報復賭場讓他們虧錢。


    從數學上講，這是可行的，只要你有足夠的資金，總有贏一手的機會。所以美國的賭場都有下注最低額和最高額的規定，足夠你最多翻七倍。如果最低下注額是五美元，最高常是五百美元。第一注五美元，第二注十美元，第三注二十美元，第四注四十美元，只要贏一手，就能翻本。我自己就曾這麼賭過，輸得灰頭土臉。你也許不相信連輸七手多麼容易。任何人用這樣的翻倍法賭錢，只是加快「剃光頭」回家的時間。


    在股市中，買進的股票跌了，你就再多買一點，因爲第二次買的價錢較上次爲低，所以平均進價攤低了。這時你的心態和賭場虧錢時一樣。一方面你虧不起，另一方面你在報復股市，報復股市讓你虧錢。同時又希望只要贏一手，就能連本帶利全討回來。因爲平均進價攤低了，只要一點股票的小反彈就能提供你全身而退的機會。


    這樣的心態極其有害。股票跌的時候通常有它跌的理由，常當下跌的股票會愈跌愈低。這樣被套牢，你就愈陷愈深，一直到心裡無法承受的地步。一個致命的大虧損，常常就徹底'
