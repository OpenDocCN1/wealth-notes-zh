    ## 第三節 股票分析之我見


    一般股民唯一會關心的就是股價什麼時候會升，什麼時候會跌。而我們知道股票會升的唯一原因是買者多過賣者，股票會跌的唯一原因是賣者多過買者。股票分析能夠定量出股價什麼時候升跌嗎？答案是不完全能做到！


    想像一下什麼因素會讓股民買股？政治、經濟、心理、環境因素等等都有可能，但這些都無法定量。


    金融分析者發明出一本益比之類的指標試圖將股價的評估量化，但本益比同樣不能指出股價明天會升還是會跌。那麼這些分析理論的目的何在？答案是：這些分析提高了預測股價變動方向的準確度。也就是說可以提高股民入市的勝率。


    ### 我如何看待技術分析？


    我以炒股維生，技術分析是我買進賣出的主要參考。簡單地說，我靠這幾個圖吃飯。但對沒有多少經驗的炒手而言，你也想靠這幾個圖吃飯可能沒有那麼容易。


    記得我在大學讀書時，曾讀到數學家華羅庚談讀書的過程。他說讀書應該從薄到厚，又由厚到薄。他的意思是：一開始時什麼都不懂，書自然很薄，隨著學習時間的增加，你發現該學的愈來愈多，書就變得很厚。到最後讀通了，開始明白重點就是這麼多，書又開始變得很薄。這個學習過程可以推廣到學習任何技能，就算是炒股也不例外。


    今天的電腦科技已發展到在國際象棋上擊敗世界冠軍的地步。因為國際象棋的變化有限，一旦把幾乎所有的變化輸入電腦，它的計算速度之快，人類遠遠不能企及。在機器面前，人就只有投降了。


    一九九七年，美國 IBM 電腦「深藍」（Deep Blue）擊敗俄羅斯的國際象棋世界冠軍蓋瑞·卡斯帕羅夫（Garry Kasparov）曾成為全球頭條新聞。以電腦的計算能力，區區幾個股票走勢圖根本算不了什麼，但電腦迄今還只是炒股的輔助工具！


    想想其中的緣由，你就會明白炒股沒有那麼簡單。


    ### 擲硬幣得出的股票走勢圖


    《華爾街日報》(The Wall Street Journal) 曾登過一則這樣的故事：一位記者靠拋硬幣在十字座標上畫線，硬幣出正面就升一格，反面就降一格，拋了幾十次硬幣後就畫出一條曲線。他把這條曲線交給一位著名技術分析專家研究，告知他這是一檔股票的走勢圖，請教他的意見。這位技術分析家看圖後說這支股票極具上升潛力，一定要知道這檔股票的名稱。記者如實相告，技術分析家聽後勃然大怒，拂袖而去。這位記者便據此寫了一篇報導。


    你讀了這則故事有什麼想法？依我看這位技術分析家犯了個嚴重的錯誤，他沒有問交易量的數據到哪裡去了。


    這章講的幾個圖，看來極其簡單，但我敢講這是由「薄」到「厚」，又由「厚」到「薄」過程的後面一個「薄」。


    你想跳過中間的「厚」，而由「薄」直接到「薄」是辦不到的。若是參考過來人的經驗來得知後面的「薄」是什麼內容，或許可以縮短你經歷「厚」的過程，但是你一定必須經過「厚」的階段。


    不要把技術分析孤立起來看。研究股票的大市，研究公司的經營情況，研究公司的產品，再看股票的走勢圖，特別還要注重交易量的變化，只有在這個基礎上，技術分析才有意義。最重要的是記住停損。


    這些圖是死的，在實際操作中，你會碰到很多例外，只有透過實踐你才知道如何處理這些例外。這些圖之所以重要，是因為它提供了最好的臨界點，在第四章「何時買股票？何時賣股票？」中，我將會詳細介紹。


    ### 我如何看待股票大市？


    炒股高手傑西·李佛摩是這樣強調股票大市的重要性：「炒股的訣竅便是在牛市中全盤投入，在牛市結束或接近結束的時候賣掉你的所有股票。」


    股市就像羊群，單獨股票就像羊群中的羊。當羊群朝某個方向前進時，大多數的羊跟隨著同一方向。股票也一樣，在牛市的時侯，大多數的股票升，熊市的時候，大多數的股票跌。就如同做其他生意一樣，順勢是成功的基本保證。做服裝生意的要賣流行款式，不要進冷門的樣式。炒股的道理也一樣。不管你選了多好的股票，在大市向下的時候，它跌的機會大過升的機會。那麼如何確定股票大市呢？


    要確定大市的走向，最重要的是每天要追蹤股票指數的運動。如美國的道瓊指數，日本的日經指數，香港的恆生指數，上海、深圳的綜合指數等等。


    就我自己的經驗來說，用技術分析的方法來判定大市的走向及走向的變動是最為有效的工具。研究股票指數圖，把它看成一檔股票，看看這檔股票現在是處於什麼運動階段，它運動正常嗎？


    留意每天的交易總量。如果股市交易總量很大，但指數不升，或開盤走高，收盤低收，這就給你危險信號了。


    # 第2章 股票分析的基本知識


    留意一下周圍發生了什麼事：中央銀行是否要調整利率？周邊國家是否有動亂？大市轉變通常有個過程，它比單獨股票轉向要來得慢。大市的轉變可能需要幾天，也可能是幾星期，重要的是，當你感到危險時，你必須採取行動。


    同樣的，你要留意股市跌到底時所提供的信號。當股市跌了很多，跌到大家都失去信心時，你會發現有一天股市狂升，可能升一%或二%，交易量很大，這往往是跌到底的信號，大戶開始入場了。但這還不是進場的最佳時機，被下跌套牢的股民可能乘這個反彈賣股離場。如果在此之後，股票指數突破上一個波浪的最高點，你可以證實跌勢基本結束，是進場的時機。從圖上看這時應該有升勢時所具備的特點。


    股市的運動不斷重複，你要仔細研究過去的規律。拿一份長期的綜合指數走勢圖，研究過去發生的一切，隨著時間的推移，你就能培養出感應到股票大市的感覺。


    判斷大市走向極其重要。我發覺新手（我以前也是一樣）用很多心思研究單獨股票的基本面和技術層面，認為再好的市場也有股票跌，再壞的市場也有股票升，所以忽視大市走向。我要在這裡強調：炒股是機率的游戏，逆大潮流而動，你的獲勝機率就被大打折扣了。


    將大市和單獨股票結合起來考慮，是專業炒手們必須培養的心態。雖然這需要一個長久的學習過程，但你一定要不斷地提醒自己：大市不好時，別買任何股票。


    請記住，當街頭巷尾的民眾都在談論股市如何容易賺錢的時候，大市往往已經到頂或接近到頂。人人都已將資金投入股市，股市繼續升高的推動力就枯竭了。而大家恐懼的時候，那麼該賣的都已經賣了，股票的跌勢也就差不多到頭了。


    判斷股市大市還應注意下列幾點：


    - 一、大的政治環境和經濟環境有什麼變動？今天的企業愈來愈具全球性，其他國家發生的政治經濟危機將會影響本國的市場。一九九七年亞洲發生的經濟危機便是最好的例子。

    - 二、台灣的經濟大勢如何？通貨膨脹的情形如何？匯率有無變動的可能？中央銀行會調整利率嗎？

    - 三、所謂的股市龍頭有什麼表現？在股市到頂之前，你會發現股市的龍頭股在大市到頂前的一段時間開始疲軟。

    - 四、垃圾股有什麼表現？在股市到頂的前一段時間，一些平時沒有人過問的小股票開始變得活躍而且向上升。龍頭股的價格已貴到買不下手的地步，社會上的熱錢便開始湧向三四線股票。

    - 五、每天收盤的時候，有多少支上升的股票？有多少支跌的股票？綜合指數有時會被幾支大股票糊弄。一支在綜合指數佔有大份額的股票偶爾會影響真正的方向。例如某天有四分之一的股票跌，四分之三的股票升，但四分之一的跌股中可能有一支在綜合指數佔大份額的股票，例如香港的匯豐銀行使得綜合指數下跌。在這種情況下，綜合指數不完全反映大市的真實走向。

    - 六、考慮類別股。如金融股、電子股、房地產股等等。雖然大市的綜合指數走升勢，其中某些類別可能在走跌勢。研究大市走向時，應將類別綜合考慮。特別是有時大市的走勢並不明顯，但金融股可能處在升勢，電子股卻走跌勢。炒手們應根據類別股的運動形態來決定具體某支股票的買賣。


    這裡需要特別指出，以上的分析都是預測工具，你試圖預測股票下一步會如何運動。你用基礎分析分析出股票已經很便宜了，下一步就應該往上升；你依此買股。你用技術分析得出股票在跌勢，下一步應該往下走；以此得出該賣的結論。


    在實際操作中，買賣只是作業系統的一個部分，其它包括意外發生之後如何回應等等？


    ### 股市的信條之一便是「順勢而行」，並沒有要求大家「測勢而行」！


    順勢和測勢在思考方法上有本質的區別。你的分析結果是該買股了，但問題是買多少？如何分倉？如何停損？自己總體資產的數額和配置的安排如何等等都必須包括在你的總體考慮之內。


    ## 第四節 什麼是合理的價位？


    我們知道：在某個價位，有人願賣，有人願買，一旦成交，股價就確定了。有些人認為股價合理，也有人認為荒謬；但合理或荒謬的根據是什麼？有這樣的根據存在嗎？股票的價格和價值到底有什麼樣的關係？


    這是個很難回答的問題，這個問題的答案也隨時間的變化而變化。


    首先讓我們看看現代金融理論中最流行的「現金值法」是如何判斷合理股價的。


    ### 現金值


    什麼是現金值？如果假設通貨膨脹一○○%，則今年的一元是一元；明年的一元就僅能買今天的九○元的東西，所以明年一元的現金值是○·九元；同樣的道理，後年的一元能買今天八○八元（○·六×○·九）的東西，它的現金值便是○·八一元。依此類推，十年後的一元的現金值要十個○·九相乘，約等於○·二八七元；即十年後的一元只能買今天價值不到三毛錢的東西。


    假設某股票每年可賺一元，年年如此，而且通貨膨脹也是每年一○%不變，那麼這檔股票每年賺錢的現金值總和便是一個簡單的等比級別的總和：


    ![](img/af3de47fcb4db801f9d008fb55b44d63_90_0.png)


    這個十元就是該股票的現金值。


    當今華爾街通常將股票的現金值當成股票的合理價值。即這檔股票價值十元。若股價在十元以下交易，分析師會說股價低估了；否則便是高估了。


    大家有沒有注意到：要得到股票的現金值需兩個假設。一個是通貨膨脹；另一個是未來盈利。如果有機會看到華爾街證券分析師的報告，通常都會看到這兩個假設，而且按照這兩個假設得到的現金值判斷股票的合理價位。由於假設人人會做，巧妙各有不同，所以不同的分析師對同一股票常常產生完全不同的結論，有人說股價高了，有人說股價低了，各有理由。


    請大家注意：由於沒有人知道未來，所以任何用現金值法得到的結論都是「猜」的結果。或許用「猜」難聽些，用「合理的推測」會讓這些分析師感覺好一點。但也是因為這個缺陷，因為沒有人知道未來！所以分析師對股價的評估都只能作參考；沒有人曉得他的假設對還是不對！你如何知道後年的通貨膨脹的數字？


    ² 此算式爲一等比級數，公式爲 S=a(1-r^n) / (1-r)，此例中 a=1, r=0.9，n=無窮大，其總和數爲10。


    第一章講了個母豬變鳳凰的故事；給大家的印象似乎股價和價值完全沒有關係！例子雖然成立，但在現實中總有變化。現實中人們總是試圖合理評價值，並且用來當做行動的參考，但太離譜的東西不會長久存在。


    德國投資大師安德烈·科斯托蘭尼（Andre Kostolany）形容股價和價值形容的很好：「想像你外出遛狗：狗有時跑在前面，有時跑在後面；你拴狗的繩子也有時長，有時短，但無論如何，狗最終會跑回你身邊。你說是價，狗就是價格。」


    體會一下這個例子，你會明白很多東西。太離譜的股價會出現，但通常不會維持太久。


    有人願買，有人願賣，價格就確定了，這很容易明白和接受。


    更多人在問：價值是什麼？它又如何訂定？憑什麼訂？標準是什麼？一斤豬肉五元，一棟房子五百萬元，它們有使用價值，所以金錢價值也容易接受。那麼股票呢？股票沒有使用價值，它代表了企業的股份，而股份的價值判斷也隨時間變化而改變。代表企業的財富在不同的時代有不同的內容。


    ### 如何估算財產價值？


    我看過一篇文章，內容陳述歐洲遠古人的食物主要是肉食。透過對歐洲遠古人糞便的分析得知，他們食物中肉的成分超過七○%。隨著時間推移，歐洲遠古人膳食中穀物的含量不斷增加，肉食不斷減少；直到近代才相對穩定。


    這篇文章將人類發展分成狩獵社會、農業社會、工業社會和資訊社會。


    讓我們看看這些不同社會的價值觀念如何變化：


    在狩獵社會，土地沒有價值；它無法提供溫飽，無助於生命的延續。財富的表徵是人的狩獵能力：你的力量、奔跑速度、張弓的精確度等等。這個時代對現代人觀念影響最深的大概就是女性還是比較喜歡配個子高力氣大。


    進入農業社會，對價值和財富的判定產生了很大的變化。財富的觀念從狩獵的能力轉移到擁有土地和耕地的技巧。你的勇敢、奔跑的速度不再那麼重要，重要的是你所擁有的土地及這些土地能帶來的收成。


    若是自己不能耕種，也可以請人代勞。無論這些土地用來種植糧食還是放牧，財富都和擁有土地的數量有關。


    請注意：從狩獵社會到農業社會，人們衡量財富和價值的標準已經完全不同。它已從人的高大健壯轉移到土地的擁有。


    進入到工業社會中，這個價值判斷又有了新的尺規。它從土地擁有轉移到製造能力和運輸能力。特別自十九世紀出現內燃機和電動馬達，它使得大規模的機械化生產成爲可能。在很少的土地上，人們建造工廠，生產出驚人數量的產品；這些產品經蒸汽機推動的輪船運往世界各地，創造出驚人數字的財富，這個過程不受季節影響，也和天氣無關。


    機械化生產使得價值的判斷變複雜了。習慣了農業社會思維方式的生意人（或金融分析師）可能會說出這樣的話：「你看看，那間公司的股票價錢完全瘋了！它擁有一間小小的響應不停的工廠；只有那麼一點點土地；不生產麥子，也不可能生產麥子。現在公司的合理價錢是它所擁有的土地年產小麥的五倍，而那間叫什麼工廠的公司價格居然賣到它所擁有土地可能年產小麥的五千倍。人們完全瘋了，這樣的公司的股票居然有人買！」


    生活在兩百年後的我們或許會將上面一段話當成笑話。但是請看看我們周圍，請問誰知道如何合理地評估網路公司？網路公司的評估標準是什麼？什麼樣的股價才是合理的股價？大多數的網路公司既不擁有土地，也沒有工廠，只有幾位目光呆滯的年輕人在辦公室敲著鍵盤。這些公司很多現在不賺錢，在可預見的未來也看不到賺錢的希望。


    現今資訊社會流行的企業評估標準，例如：本利比、現金值、固定資產值等等用來評估工業社會的企業，它取代了農業社會丈量土地的方法；但用它來評估資訊社會的企業可能不太合適。


    最近幾年網路股之所以大起大落，某種程度是因為社會不知道如何評估這些新型企業的價值在金融市場的反應。


    資訊社會的企業應該如何合理評估還有待新理論的出現。也許讀者中會有一位成爲新理論的開創人。但在新的、能爲大衆接受的新評估標準出現之前，可以預見這些企業的股價還會大起大跌。


    我們應該慶幸這些新困惑的出現，因爲它正表示了人類文明又前進了一大步。


    # 第 3 章 炒股成功的要素


    炒友必須牢牢記住：股市從來都沒錯，它總是要走自己要走的路，會出錯的只有你自己。你所能做得只有追隨股市。見到危險信號，不要三心二意，不要存有幻想，把股票全部脫手。幾天以後，也許一切又恢復正常，你一樣可以重新入場。


    透過自己的觀察和研究不斷累積經驗，將每次入場獲勝的機率從五○％提高到六○％，甚至七○％；而且每次進場不要下注太大，應該只是本金的小部分。這樣長期下來你就能久賭必贏。


    任何對炒股有一定認識的人，都明白炒股所需的具體知識少得可憐。影響股票漲跌的因素就是這麼多，真正重要的因素列出來都佔不滿你的手指，甚至不識字的人也可以在股市露一手。股票的引力也廣為人知，如果做得好，前景自然是大大光明。但這樣的行業成功率甚至低過減肥！


    為什麼呢？因為人們常常做不到自己知道該做的事情！


    ### 炒手想的跟你不ㄧ樣


    在進入具體的買賣技巧的探討之前，我希望讀者們能明白在炒股這行成功必須有什麼樣的思考方式。炒股的目的是從股市賺錢，但想賺錢並不表示你就能賺到錢。你必須在正確的時間做正確的事情，賺錢只是結果。因為你在正確的時間做正確的事情，所以你得到了報酬。


    首先必須以「保本」為第一要務，在保本的基础上再考慮怎樣賺錢。保本不是說保就能保得住的，除非你不涉足股市。只要你把資金投入股市，你就有虧本的可能。股票何時運動正


    ## 第一節 炒股成功的基本要訣


    去炒股無非是瞎貓碰到死耗子。


    學股之路艱難且漫長，想要從股票學校畢業，學股人必須有一定的素質。只有具備這些素質，你才可能熬過黑暗時光，否則，成功只是幻想。你如果還不具備成功的投資者具有的特質，希望你從今天開始培養。那特質就是——除了毅力之外，沒有別的要求。


    任何有虧損的行為都可稱爲「投機行爲」。在投機遊戲中，你希望最好的結果，但同時爲可能的失敗做好準備。炒股的行爲便是典型的例子。


    投機本身是門學問。幾何學有幾何原理，投機學也有它固定的投機原理。做爲投機遊戲的參與者，你必須遵循投機原理。以這些原理做指導，鍛鍊遊戲的技巧，隨著時間的推移，你對理論的理解愈來愈深，玩遊戲的技巧愈來愈熟練，如此一來，你便能夠成爲一名專家。


    那麼投機的原理是什麼呢？它的精華可以濃縮成兩句話：


    - 一、敗而不倒；

    - 二、追求卓越。


    這兩句不是我的發明，是我們祖先幾千年流傳下來的做生意的智慧！


    本錢沒了，你就倒了；無論有什麼好機會，沒有本錢的生意人只能是旁觀者。「敗而不倒」這句話的意思很清楚。追求卓越是追求更高的層次；每位生意人都要有「第一桶金」及以後的發揚光大，否則你不會成爲「慈善家」；你要在正確的時候狠狠地撈一把。最終成爲「慈善家」應是每位投機者最終目的，否則你爲何甘冒著高血壓、胃潰瘍的風險炒股？


    我相信敢打算以炒股維生的投資者都有那麼一點背景，不炒股的話你會有其他的方法找的；食不果腹的「貧下中農」有炒股維生這種奇想的人不多。「敗而不倒」和「追求卓越」八個字簡單易記，讀者們請放在心裡慢慢琢磨，保證你每年都有新的體會。


    華爾街對投機原理有許多不同的解釋法。最通行的英文直譯是「資本保存」（Capital preservation）以及「恆久利潤」（Constant profit）。「資本保存」對上「敗而不倒」，「恆久利潤」對上「追求卓越」。爲了解釋方便，「恆久利潤」又常分爲「不斷盈利」和「掙大錢」兩部分。


    以下讓我們更詳細地探討投機原理和它在股票市場的應用。投機原理可以應用到其他所有出現勝負的行為上。以「足球」為例，投機原理要求把球先控制在自己腳下，勝球的首要是不失球或少失球等等。只有球在自己腳下才可能進攻得分，所以別亂把球丟出去；若不失球或少失球自然就有更大的勝算；反之，若是一開場就被對方進了三球，那麼比賽該如何繼續進行下去？


    ### 保本


    炒股是用錢賺錢的行業。一旦你的本金沒有了，你就失業了。無論你明天見到多麼好的機會，手上沒有本金，你只能乾著急。幾乎所有的行家，他們對炒股的首要建議便是——盡量保住本金。而做到保本的辦法只有兩個：


    - 一、快速停損；

    - 二、別一次下注太多。


    炒過股票的朋友都有這樣的經歷：虧小錢時割點肉容易，虧大錢時割肉就十分困難。這是人性的自然反應。在一項投資上虧太多錢的話，對自信心有極大的打擊。如果你有一定的炒股經歷，必然同時擁有賺錢和虧錢的經驗。賺錢時你有什麼感覺？通常你會在內心指責自己為什麼一開始時不多買一些，下次碰到「應該會賺大錢」的機會，你自然就會下大注。


    ### 身體的做法就是分層下注。


    這種想法極其危險！


    在炒股這一行，沒有什麼事情是百分之百正確。如果第一手進貨太多，一旦股票下跌，惡夢就開始了。每天下跌，你會希望這是最後一天；有時小小的反彈，你就把它看成大起的前兆；但很快地這檔股票便可能跌得更低，你的心又往下沉。你將因此失去理性判斷的能力。人性共通，我算是這些經歷的過來人，對此感到深切的心痛。


    股試試，看看股票的運動是否符合你的預想，然後再決定下一步如何做。如果不對，盡快停損。如果一切正常，再進四百股，結果又理想的話，買足一千股。由於股票的運動沒有一定的規矩，若是你不入場就不可能賺到錢，而入場就有可能虧錢，所以承擔多少風險便成爲每位炒手頭痛的事。金融大鱷喬治·索羅斯（George
    Soros）在他的自傳中提到，他對應承擔多大風險最感頭痛。解決這個問題並無任何捷徑，只有靠自己在實踐中摸索對風險的承受力，盡量不要超出這個界限。


    而什麼是你对風險的承受力呢？最簡單的方法就是問自己睡得好嗎？如果你對某檔股票擔憂到睡不著，表示你承擔了太大的風險。賣掉一部分股票，直到你覺得自己睡得好為止。


    把「保本」這個概念牢牢地記在心裡，你在炒股時每次犯錯，你的體會就會深一層，等到時間一久，你就知道該怎樣做了。

