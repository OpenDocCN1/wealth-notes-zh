    人性有很多缺陷。人希望股票會如何運動，認定股票會如何運動，當股票的運動和預想不符合時，就會認為股市錯了，自己沒有錯。但炒友必須牢牢記住：股市從來都沒錯，它總是走自己要走的路，會出錯的只有你自己。你所能做的只有追隨股市。見到危險信號，不要三心二意，不要存有幻想，把股票全部脫手。幾天以後，也許一切又恢復正常，你一樣可以重新入場。如果能這樣做，你將發現你爲自己省下了很多焦慮及學費。


    # 如果火車朝你衝來？


    華爾街流行的說法是這樣的：你在鐵路軌道上漫步，見到火車向你衝來，你應該如何辦？你自然應該閃開一邊，待火車離去後，你隨時還可以重上鐵道繼續漫步。遲疑不決會危及生命，同樣的道理，此事若發生在炒股上就是危急你的炒股生命。


