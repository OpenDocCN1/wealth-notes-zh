    # 形成自己的風格模式


    股票買賣是藝術，不是科學，它沒有固定的模式。我希望讀者讀到這裡時已經能感覺到股價變化過程中投資大眾心理波動的脈絡，能明白大衆爲什麼買股票？爲什麼賣股票？心理過程如何變化？你如何從這個過程中受益？股票價格的短期波動很多是大戶操縱的結果，但大戶不能說想升就讓股票升，他們還是要用「買股票」的方式讓股票升漲，這個尾巴無法掩住。


    找個清靜的地方，細細思考一下臨界點是怎樣形成的。你如果無法找到支撐它的心理脈絡，這個臨界點常常靠不住。走進書店，翻開任何一本「股市必勝」、「炒股祕笈」之類的書，你會看到數不清的「高招」。你按照這些高招炒過股嗎？結果如何？如果炒股居然簡單到「二〇天平均線穿越五〇天平均線是買入好點」的話，哪裡還有人起早摸黑去上班？


    # 尋找臨界點的過程就是學習炒股的过程


    只要你用心，你會不斷發現適合你的個性及風險承受力的臨界點。


    用你自己發現的臨界點，按照自己定好的規則買賣進出，訓練自己的耐性，留意市場提供的危險信號，你就走上了學股的正確道路。你很快就會發現，用這樣的方式炒股，你有了極大的自我滿足感，其所得利潤也較其他方法所得更令你覺得喜悅。因爲你不僅賺了錢，也知道了爲什麼能賺到錢，你將有信心按照同樣方法再次賺到錢。


    最後談點我個人的經驗。股票和人一樣，有其特別個性，有些保守、遲緩，有些急躁、不安分。對某些股票來說，我能很容易描摸出其個性，推斷出其運動軌跡。而有些則和我無緣，其運動模式我如何都猜不透。對這些無緣的股票，每次碰到我都被燙傷；就如同交朋友一樣，有些人第一次見面感覺相見恨晚，無話不談，有些人則話不投機半句多。


    我採用的具體做法是，如果我被某檔股票燙了三次，就盡量不再去碰它。把注意力放在比較適合的股票上。


    # 第二節 何時賣股票？


    何時賣股票的考慮可以分成以下兩部分：


    - 一、剛進股時如何選擇停損點？

    - 二、有利潤後如何選擇合適的賣點獲利？


    就第一部分而言，第四章第一節「何時買股票？」已有論述，這裡主要談第二部分。


    # 選擇賣點


    各位讀者應該記住自己在做生意，就如同做服裝生意一樣，一有合理的利潤就賣出。有些投資專家，他們買股票準備永遠持有，這並沒有錯，運氣好的話，三十年可以翻二十倍。但這間會有很多的起伏，有時候股票會有五〇%的跌幅，這對炒股維生的炒手而言實在難以承受。而且你還要有選長期股的眼光和資訊，對一般人而言，要獲得精確的資訊並不是件容易的事。況且，如果股票五年都不動的話？你要靠什麼過生活？


    上述的投資專家通常管理公共資金維生，每月有薪水可拿。對一般的炒手而言，持股的時間通常是從幾個星期至幾個月不等。這個時間沒有硬性規定，只要股票的運動正常，你不應該賣出。一旦有了一定的一定的炒股經驗後就會明白，很少有股票會在「最小阻力線」上運行一年以上。一個大走勢，頭和尾都是很難抓到的，炒手們應學習如何抓中間的一截，能抓到波幅七○%就算是很好的成績了。


    這樣做能預防股票常有的二○%至四○%的回檔可能為你的整體投資帶來大幅震盪。讓提醒股友：不要試圖尋找股票的最高點，你永遠不知道股票會升多高。就我個人的體會，決定「何時賣股票？」比決定「何時買股票？」更為困難，虧的時候你希望打平，賺時想賺更多，內心不斷掙扎。對剛學炒股的新手來講，常有「不賺不賣」的心態，這是極其要不得的，帶有這樣的心態，失敗的命運差不多就註定了。這就是為何我在前面「何時買股票？」一節中特別強調的——選買點的最重要點是選擇停損點。


    要決定何時賣股票，最簡單的方法就是問自己：我願意此時買進這檔股票嗎？如果答案是否定的，你就可以考慮賣掉這檔股票。在實際操作中，問題其實並沒有這麼簡單，因為無論進場還是出場，都有代價。你不應忽略手續費這筆費用，頻繁進出場的結果就是把利潤都捐獻給政府和證券商了。


    和買股票一樣，賣股票的要點也是「臨界點」。若能夠做到僅在臨界買點入場，臨界賣點出場，入場時牢記停損，並且注意分散風險，成功的機率就能提到最高，你也就真正成為了一個真正的炒手。一位炒股專家了。


