    現在假設這位朋友要提高賭注，每注五百元，出正面你贏五百元，出反面你輸四百七十元。機率沒變，還是一比○．九五，但賭注變了，從本金的千分之一提高到二分之一。這時你有什麼想法？你還是知道贏的機會太過虧的機會，但你贏定的感覺沒有了。你的本金只夠賭兩回，你的手開始冒汗。如果這一千元是你下個月的吃飯錢，你還敢賭嗎？


    在上面的例子中，你輸贏的機率沒有變化，但下注的金額變了，整個遊戲的性质便發生了變化，你從「贏定了」變成了「沒有贏的把握」。朋友，你炒了幾年股票，覺得自己已經有經驗了，你知道你的經驗有什麼用處嗎？事實上，經驗可以提高每次進場贏錢的機率！


    我曾研究過美國賭場的遊戲，每種遊戲（吃角子老虎機除外）的賭場盈利僅一%至二%之間。也就是在機率上，你每次下注一百美元，只能拿回九十八至九十九美元，和中國買賣股票的手續費差不多。但機率上來說每次下注都輸一點，完全應驗了「久賭必輸」這句話。所以賭場不怕你贏錢，就怕你不來。


