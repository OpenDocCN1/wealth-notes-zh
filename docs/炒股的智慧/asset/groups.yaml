    ## 以為了


    大家都知道股價總起落落。當股票以某一價收盤時，有沒有思考過它代表了什麼？


    任何一個股票，都有買賣方和賣方。你買的股票都是某人賣給你的。交易提供了一個交易合約。只要兩位股票參與者在一定的價格上，一位願意買，一位願意賣，他們的交易就完成了。價格就這樣確定。以你的立場來想，無論他們多麼無知、多麼愚蠢，他們在這個價格交易，不是事實上的爭論。你或許認為股票不值這個價格，就是有人以這個價格買了股票。


    如果你有足夠資金，壓制股市所有你意見不合的人，你可以用自己的意願安排股票價格。否則，你的想像、你的判斷、你的分析，都不能移動股價一分一毫。無論你對價值的判斷是基於多麼精準的科學分析，但若股市的大多數參與者不認同你的看法，股價將隨大多數人的意志而波動。


    我能蒙受超出自身承受力的損失。然而發大財的心態入市，少有人能抵擋誘惑；資產上升沒有限度，融資賺取的額外報酬擁有極大的吸引力，讓人不能自已。說贏家通吃根本不可能，只會越來越大！最後很可能在融資槓桿下，連帶加快還給市場。


    這種賺大錢的可能性以及賺大錢後的活方式、榮心權力的幻想，極其危險。這些可能機發生，但在現實中並不容易實現，你需要擁有豐富經驗，絕佳自制力。


    我在這裡要特別指出：在炒股這行，傳統的對錯不存在，或是說無意義。無論你的智商多高，擁有什么學位，多麼德高望重，你在炒股這行並不具備其他領域的重要身分。投資大眾及他們對未來的看法是影響股價的唯一力量。他們用交易證明自己的信念。你的看法可能影響一部分投資人，但在他們用真金白銀認同你的看法之前，你所說的一切一文不值。


    對股市的觀察者而言，每個交易及其對股價的影響提供了未來走勢的資訊。你如果能從這些資訊中找到其中意義，它提供了低買高賣的機會。每位投資人都有他買或賣的理由，無論這個理由在你看來多荒謬。如果大多數投資者抱持類似理由，結果是股票隨著大流而動。你可能說對了，但是你將因為沒跟上大流而虧錢。


    股價就是股價，無論你認為這檔股票值多少錢，無論你認為股價和股值是如何脫節，股價永遠是對的。做為股市的一員，你首先必須是觀察者，透過觀察來感受股價的走向，透過觀察尋找機會。然後成為參與者，投入資金實現這個機會。你常常面對兩個選擇，那就是選擇正確或選擇賺錢，在股市，它們經常不一致。


    不要太固執己見，不要對自己的分析抱持太大的信心。認真觀察股市，苗頭不對時就認賠殺出。否則，你在這一行生存的機率不大。


    ### 人云亦云


    做為單一投資者，你要決定入場的時間，決定持股的時間，決定出場的時間。而股市就像海洋，它永不停息，沒有始點，沒有終點，每個浪潮的方向都難以捉摸。雖然它有漲潮，有退潮，但漲潮時有後退的波浪，退潮時有前進的波浪。


    總歸一句話，股市沒有既定的運行準則。


    要想達到盈利的目的，你必須建立自己的規則。否則，太多的可能性會使你無所適從，其結果將會是一場災難。困難的地方在於：你必須建立一套自己的規則，並完全為這些規則負責，這是極大的責任。


    承擔責任是一般人所畏懼的。看看你身邊發生的事件就不難明白。一旦有任何差錯，張三怪李四，李四推王五。而在股市出錯又是如此地容易。


    對那些還不完全瞭解股票運動規律，未能明白在不同情況下應該如何應付的新股民來說，建立自己的規則絕非易事。因為它必須建立在學識、經驗、自我判斷等因素之上，況且沒有人能立即建立完美的規則，特別在你對該遊戲的特性和對風險的承受力還沒有合理評價時，你必須不斷修改這些規則，承擔執行這些規則的後果。


    但新股民既然要投入股市，要成為股市大軍的一員，而他們通常不具備制定規則的能力，也沒有承擔後果的心理準備，那他們自然就只能選擇「跟隨領袖」。這些「領袖」可能是隔壁的髮廊設計師，也可能是樓上的裁縫，理由多半是他們「炒過幾年股票」、「曾賺過錢」。這樣，這些新手們就輕易略過決策難題，如果結果是失敗的，他們也有了代罪羔羊，他們會對他人說：「樓上的王裁縫真是差勁，害我賠了一筆！」這就是所謂的「人好跟風」及後果。


    有一天，朋友打電話給我，說他準備賣掉手中的所有股票，我問他：「為什麼？」「昨晚走路摔了一跤，從來都沒這麼倒楣！」我想，它們之間有什麼關係嗎？但我還是說：「想賣就賣吧，反正不賣你也睡不著覺。」


    我明白他為什麼這麼想。因為我也曾有過類似經驗。一位缺少計畫的投資者，他的輸贏是隨機的。就如同拋硬幣一樣，無論你如何猜測，還是不知道下一次丟出正面還是反面。在股市上，上回賺了錢，他不知道為什麼，也不知下回如何做才能重複賺錢的愉快經歷。虧了錢，他也不明白為什麼虧錢，下次該如何做去防止再次發生虧損的情形。這必然會產生極沉重的心理壓力，這些炒股所帶來的憂慮、期待和恐懼難以用筆墨形容。他覺得自己失去了控制，在股市的海洋中毫無目的地漂流，不知下一站是何處。


    你曾有過類似的經歷嗎？


    解決這一問題的唯一方法就是——學習，慢慢建立自己對市場的感覺，不要跟風，不要人云亦云，一定要建立自己的規則。而你现在正在看這本書將會教你怎麼做。


    ### 因循守舊


    平常上街，出門看到的仍是熟悉的房子，熟悉的街道。就算是改變，例如鋪馬路也是緩慢的。我們去上班，走的通常是熟悉的路，辦公室的模樣相對穩定，工作的性質和內容也相對穩定。


    現在想像一下你去某個地方上班：走的「路」你不熟悉，路邊「房子」也看起來很陌生，更糟糕的是沒人告訴你今天的「辦公室」在什麼地方，找不找得到「辦公室」得自己負責。此時你會有什麼感覺？你一定覺得茫然失措……


    股市就是這樣的地方。它們不會完全地重複自己。去年股票有這樣的漲跌，今年絕不會有同樣的波動。你就像跳進了海洋，失去了方向，覺得自己渺小、孤獨、無助……股市有它特有的規律，有它自己的特點。這些規律和特點都不是完全不變的，它只給你會有相識的感覺，按這些規律和特點來指引你在股市的行動，你能有五成以上的把握就不錯了。想想每天都要面對未知和疑問，有多少人能長期承受這樣的煎熬？


    ### 喜好報復


    在賭場，我常看到賭徒們輸了一手，下一手下注就加倍，再輸了，再加倍。希望總有一手能贏，到時連本帶利全回來。這一方面是人性中「輸不起」的心態，另一方面是報復賭場，報復賭場讓他們虧錢。


    從數學上講，這是可行的，只要你有足夠的資金，總有贏一手的機會。所以美國的賭場都有下注最低額和最高額的規定，足夠你最多翻七倍。如果最低下注額是五美元，最高常是五百美元。第一注五美元，第二注十美元，第三注二十美元，第四注四十美元，只要贏一手，就能翻本。我自己就曾這麼賭過，輸得灰頭土臉。你也許不相信連輸七手多麼容易。任何人用這樣的翻倍法賭錢，只是加快「剃光頭」回家的時間。


    在股市中，買進的股票跌了，你就再多買一點，因為第二次買的價錢較上次為低，所以平均進價攤低了。這時你的心態和賭場虧錢時一樣。一方面你虧不起，另一方面你在報復股市，報復股市讓你虧錢。同時又希望只要贏一手，就能連本帶利全討回來。因為平均進價攤低了，只要一點股票的小反彈就能提供你全身而退的機會。


    這樣的心態極其有害。股票跌的時候通常有它跌的理由，常當下跌的股票會愈跌愈低。這樣被套牢，你就愈陷愈深，一直到心裡無法承受的地步。一個致命的大虧損，常常就徹底淘汰了一位股民。


    ### 遲疑不決，心懷僥倖


    美國的感恩節也常被稱作「火雞節」。這是為了紀念印第安人用火雞拯救第一批從歐洲抵達北美快飢死的英國人。野火雞在當年很常見，從前北美有一種捕捉火雞的方法：獵手置一籠子於曠野之中，籠門開著，獵人先用玉米鋪成一條路，讓火雞自然而地順著玉米鋪成的路跑進籠子裡。通常籠子裡放的玉米比較多，火雞進籠子後不會馬上跑出來。一旦進入籠子的火雞數量足夠了，獵人就會觸動機關，放下籠門，這下一群火雞就被關進籠子裡。


    以下是一個真實的故事。


    一天，一位獵人早上去查看他的籠子。發現籠子裡有十二隻火雞。在他放下籠門之前，一隻火雞溜出了籠子。「唉呀，我下手慢了一點，且讓我等等看，看那隻火雞會不會自己跑回籠子裡？」


    在他打開籠門等那隻火雞回籠時，又有隻火雞跑了出去。「見鬼，十一隻火雞已經不錯了，我怎麼會讓那隻也跑走呢？現在只要外出的三隻火雞跑一隻回來，我就關門。」


    很快，又有三隻火雞昂然地離開了籠子，接著又是三隻！當籠子裡只剩最後一隻火雞的時候，獵人這下慌了：「要嘛都不要，但如果有一隻回籠，我就關籠子，拎兩隻火雞回家。」最後，這位獵人空手回家……


    親眼看見全過程的佛瑞德·凱利（Fred C. Kelly）將這個故事寫進了《投機心理》（Win You Win or Lose）之中。


    有一定炒股經驗的朋友們讀到這個故事時大都會發出會心微笑，他們對這個心理轉折非常熟悉，只要是炒股的人都會經歷這個過程。你在二十元入場，定好十八元停損的策略，當股票跌到十八元時，你有沒有想過再等再看？也許股票馬上就會反彈了！當股票又跌到十六元時，你會不會拍自己的腦袋說：「真該依照定好的規矩！當跌到十八元時就贖出；如果股票反彈五毛錢我就一定說再見！」


    現在股票跌到十元了，你有什麼打算？你會出現雞皮疙瘩嗎？你會不會發狠告訴自己：「我這次拼了！我現在就是不走，我倒要看看這支股票最低會跌到什麼股價？！」當然，最後的結局很少例外，下場往往是股票學校又多了位交了學費、畢不了業的炒股學生……


    想知道這種情況應該如何辦嗎？耐著性子往下讀！我會一點點地解釋給你聽。


    ## 如何戰勝股市巨人


    以上討論了一些股市特點及人性弱點。坦白地說，除了你自己必勝的信念之外，其他的一切幾乎都反對你在股市成功，就算你的親朋好友，有多少人會鼓勵你靠炒股維生？


    對那些只想在股市賺幾個零用錢的朋友來說，股市在開始時或許很慷慨，隨著時間推移，你就會明白它向你討債時是何等的兇惡。你在和一位巨人搏鬥，蠻幹是不成的。你要學習技巧，永遠不和它正面起衝突。你要瞭解這位巨人，熟悉它的習性，在適當的時機，攻擊它的要害。唯有如此你才有勝利的機會。


    股市這位巨人很笨重，做為獨立投資人的你很靈巧，你一旦發現攻擊無效，就必須逃離現場，並且防備巨人的報復。炒股是很古老的行業，成功的先例非常多，這是不需要天才的行業。最重要的是鍥而不捨的精神和戰勝自己的勇氣。可以這麼說，識不識字和能否在股市成功沒有絕對的關係。當然，懂得識字總有那麼一點優勢。


    下一章我們將談一些炒股的基本知識。


    ## 第 2 章 股票分析的基本知識


    當街頭巷尾的民眾在談論股市如何容易賺錢時，大市往往已經到頂或接近到頂了。人人都已將資金投入股市，股市繼續升高的推動力就枯竭了。而大眾恐懼的時候，則該賣的都已經賣了，股票也差不多已經跌到底部。


    基本分析，主要分析公司的小環境。大環境的變化是聊天的好材料，可以用來炒股的實用性不高，因此研究小環境裡公司的經營情況十分必要。以我的經驗來說，如果只靠走勢圖來判斷，卻不知買的公司到底是做什麼的以及營收如何，會讓我覺得十分心虛。


    你認為讓投資者入市買股票的因素是什麼？華爾街曾調查過，吸引一般投資者入場買股票的最大主因是股票在「升」，而不是股票的本益比低或紅利高！同樣的，投資人會選擇賣股票的主因也是股票在「跌」！


    請記住：當街頭巷尾的民衆在討論股市如何容易賺錢時，大市往往已經到頂或接近到頂了。人人都已將資金投入股市，股市繼續升高的推動力就枯竭了。而大衆恐懼的時候，那麼該賣的都已經賣了，股票也差不多已經跌到底。


    假設這本書的讀者已具備最基本的股票知識，例如什麼是股票、股票是怎樣交易的等等。如果還不具備這樣的知識，建議你先去找本股票常識讀物。這類讀物在任何書店都能找到，在書店占的位置通常都不會太冷僻。


    這些知識是死的，很容易瞭解。以我的觀察，一個人若能專心閱讀的話，約兩個星期就能瞭解大概了。


    在這本書裡，我無意用一百頁的篇幅來介紹到處都有的內容。每位認真的股市參與者都應該有個自己的小圖書館，其中至少包括一本有關股票常識的讀物。在此分析股票升跌及為何升跌的知識，可以粗略地分成以下兩大類：


    - 一、基本分析 (fundamental analysis)

    - 二、技術分析 (technical analysis)


    技術分析是研究股價、時間、交易量之間的相互關係，也就是圖形分析，其他都屬於基本分析的範疇。


    不要將兩種分析完全分開，它們其實是互相關聯的。在技術分析中看到的股價、交易量和時間的互動關係，其實反映了投資者對公司經營的看法。他們用自己的資金為該公司的前景投票。


    和炒股息息相關的另一重要知識是怎樣判定股票的大市，也就是股市的大趨勢如何。要想炒股成功，判定大市的能力必不可少。大市升叫「牛市」，大市跌叫「熊市」。


    ### 第一節 基本分析的基本知識


    基本分析家們相信：長期而言，股票的價格決定於公司的固定資產及其盈利能力。因此，任何影響固定資產及盈利能力的因素都在基本分析的考慮範圍之內。


    這些因素非常之多，我在這裡列出部分的因素並解釋它們對股價的影響。我將它們分成大環境和小環境兩類，大環境指公司外部的因素，小環境指公司內部的因素。另外，還將專門對最可能導致股票價格上漲的三個因素加以分析。


    #### 大環境


    - 一、利率：可以這麼想：社會的熱錢數目是一定的，當利率升高時，將錢存入銀行的吸引力增加，這將使得原先可能進入股市的資金流進銀行。同時，利率的升高使公司的借貸成本增加，結果盈利減少。其淨結果都是股價承受壓力；利率降低時，效果正好相反。

    - 二、稅收：企業稅增加，企業盈利中的稅務支出增加，使得實際盈利減少，股價將會往下調整。

    - 三、匯率：當匯率上調，本國貨幣升值，增加出口困難，營業額降低，其結果對股價的影響主要是負面的。匯率屬國際金融的範疇，它對股價影響的機制極其複雜，通常是國際政治經濟角力的結果。到底匯率的變動如何影響股價，誰也說不清，就這一課題有許多博士論文，更深入的研究就請讀者們自己去找資料來看了。我自己專修國際金融，深知它的複雜性，讀者只要知道匯率也屬影響股價的其中一個因素就夠了。

    - 四、銀根鬆緊：銀根鬆疲，市場熱錢增多，對股票的影響正面。銀根緊縮時正好相反。

    - 五、經濟週期：經濟週期是市場經濟的必然結果。當某種商品短缺，大家一窩蜂地投資生產這類商品，隨後的結果便是生產過剩。當商品短缺時，價格高昂，生產廠家利潤增加，反映在股市便是股價上升。一旦生產過剩，就只得減價銷售，有時甚至虧本套現，這樣盈利自然降低，股票的表現便是下跌。

    - 六、通貨膨脹：通貨膨脹對股價的影響很難估量，通常政府為了控制通貨膨脹會調高利息，對股價的影響主要是負面的。

    - 七、政治環境：大規模的政治動亂必然帶來大規模的經濟混亂。戰爭、政府的頻繁更迭、政局不穩定對股票的影響是負面的。

    - 八、政府產業政策：如果政府鼓勵某些行業，給予扶持，如在稅收上給予減免，融資上給予方便，企業各方面的要求都給予協助，結果自然對股價有正面影響。


    #### 小環境


    - 一、營業收入：一個具有發展潛力的公司，其營業收入必須有快速發展的勢頭。去年賣出一億元的產品，今年兩億元，預計明年四億元。這樣的公司常常提供了股價在短期內翻幾倍的機會。

    - 二、盈利：有些公司做很多生意，但就是不賺錢。公司經營的好壞主要以盈利作為衡量的標準，盈利增加，股價自然上漲。

    - 三、固定資產：固定資產就是公司現有的所有「不動」的資產。如果公司的市場總價是十億元，固定資產是十五億元，你可以認為股價沒有反映公司的價值，股價偏低了。

    - 四、類似公司的情況：大家都生產類似產品，例如電視機，其他公司的績效和這家公司比如何？同類公司常常有類似的經濟週期，股價的波動也類似。

    - 五、品牌的價值：有人估算過，光是「可口可樂」這個名字就價值五百億美元。你打算投資的這家公司有無優秀品牌？這可能對股價有深遠的影響。


    基本分析主要分析公司的小環境，大環境的情況太過複雜，判斷大環境主要用「股票的大市」。美國著名的基金管理專家彼得·林區（Peter Lynch）曾發表看法：「我每年花在經濟大勢上的分析時間不超過十五分鐘。大環境的變化是談天的好材料，用來炒股實用性不大。但是大的政治動亂和經濟震盪當然例外。」


    研究小環境中公司的經營情況是必要的。以我自己的經驗，如果只靠走勢圖來判斷股票走向，不知道賣的公司到底是做什麼的和營收如何，會讓我觉得很心虛。


    研究公司的經營情況必須具備一點會計的常識，要能看懂公司的財務報表。但這裡面的遊戲也很複雜。以銷售收入而言，公司是如何計算銷售收入的呢？有些公司賣貨後收到錢才算收入，有些公司只要發了貨就算收入，更有些公司把訂單全部都計算在內。但是要注意的是，發了貨能否收到錢是個問題，就算是訂單也有可能被取消。


    固定資產怎樣算也有學問。有些老工廠在紙面上還值不少錢，但事實上那些舊機器送人都沒人耍，這樣的公司你說固定資產是多少？按市面上買價減去折舊計算固定資產，得到的數字可能很漂亮，但其實沒多大意義。


    讀者們在研讀財務報表時必須留意這些細節。


    ### 導致股價上漲的三個因素


    雖然引起股價增長的因素很多，但最重要的是盈利及盈利增長。這個理由很明顯，投資者不需要不賺錢的公司耍。讓我們看看下述三個影響股價最重要的因素：


    #### 一、盈利的增长


    本益比是很重要的概念，即「股價÷收益」所得到的數字。


    但我發現新手們常常過於注重本益比，他們把它當成股價是否便宜的衡量標準。這種概念基本上是對的，但是實用性卻不大。舉例來說美國的微軟（Microsoft）公司上市初期，本益比超過一百，就算是今天，它也超過五十。若是數十年前你買了一萬美元微軟的股票，今天就是百萬富翁了。


    一個健康、發展迅速的公司，其盈利必定逐年增長。這個增長的速度愈快愈好。一個公司的盈利若能以每年二五%的速度增長，那麼三年就能將盈利翻一倍。盈利增長的速度必須建立在合理的數字上。去年每股賺了一分錢，今年二分錢，盈利增長了一○○%，但這個數字沒有意義。如果公司的盈利從每股五角升到一元，這個一○○%的盈利增長必定將使投資大眾的眼睛發亮。


    盈利增長的前提是銷售收入的增長。一個公司的銷售收入如果無法增長，盈利增長通常是玩會計遊戲的結果，對於這一點讀者們要特別留意。


    另一個必須留意的是銷售收入增長速度和盈利增長速度的關係。公司的營業額由一億元升到兩億元，一○○%的增長率。但盈利只從五角升到六角，二○%的增長。這時要好好調查一下箇中原因了。是不是同類產品多了競爭者公司只好削價求售？雖然營業額不錯，但本益比卻降低了！如果是這樣的話，這檔股票的升幅也就有限了。


    最使市場注目的是盈利的加速增長。一個每年盈利增長一二五%的公司突然將增長速度提高到四○%，甚至○%，這通常已經鋪好了股價成倍上翻的道路。


    #### 二、新產品


    如果有家公司發明了根治癌症的新藥，你可以想像這家公司的前景。新產品提供了公司快速增長盈利的可能。


    這類例子很多，例如：美國新態（Syntex）公司在1963年發明了口服避孕藥，結果其股價在六個月內翻了五倍。王安電腦因為其新型的文字處理機，在1978年至1980年間，公司股價升了十三倍。速食店的概念成形初期，麥當勞（McDonalds）公司的股價在1967年至1971年的四年期間翻漲了十一倍。


    新產品並不侷限於「實物」，可以是新的生意概念、新的推銷手法、新的管理方式。


    #### 三、公司回購自身股票


    如果公司購回自身股票，這是好消息。公司購回自身股票是對本公司投注任票。一般而言，公司只有在認為股票的股價水準不反映公司價值時才會這麼做。同時，回購股票使流通

