    我們可以把買入的要點歸納一下：


    第一、在買入之前，一定要參照一下股票的走勢圖，因爲它是大衆投資心理的反映。


    第二、在買入之前，先定好停損點，搞清楚你最多願意多少錢。切記照辦。


    第三、選擇臨界點，記住你不可能每次正確，所以入場點的獲勝機率應大過失敗機率。


    第四、最好在升勢或突破阻力線，準備開始升勢的時候買入。


    第五、絕不要在跌勢時入市。'
  - '[PAGE 133]


    第六、不要把「股票已跌了很低了」作為買入的理由，你不知道它還會跌多少！


    第七，不要把「好消息」或「專家推薦」做為買的理由，特別在這些好消息公布之前，股票已升了一大截的情況。


    第八，記住這些要點以及點點辨辦。


    以上我們討論了幾個臨界點，在基礎知識上討論了這些臨界點形成的心理。但是不是臨界點只有這個呢？答案當然是否定的。**學習尋找臨界點的過程其實是學習炒股的過程**，當然這其中還包括學習炒股的正确心態。坦白地說，學習找臨界點的技巧比較容易，培養心態才真正困難。


    # 關鍵：把握臨界點


    為了使讀者對臨界點有更深的認識，讓我們做些更進一步的思考。股市是講究大錢的地方，任何這樣的場所，都一定有大戶在興風作浪，中國的股市是這樣，美國的股市是這樣，全世界任何地方的股市都沒有例外。


    人都知道股價突破阻力線時是好的買入點，大戶也知道。你如果是大戶，你會如何做？你會在低點吸納，再人為地創造出大眾認爲好的買入點，引起大眾的興趣，這時再把股'
  - '[PAGE 134]


    ![](img/af3de47fcb4db801f9d008fb55b44d63_134_0.png)


    票拋掉。這就是常常看到股票突破阻力線後常常回檔的原因。但有一點可以確定，短線操作的資金都是熱錢，它不會長久留在某檔股票上，除非大戶認為該股票的有潛力。




    如圖4+6中的A、B兩點，如果股票突破阻力線，A點便是好的買入點。在稍微回檔後，股票若能突破上回波浪的高點達到B點，那麼B點才是更好的買入點。因為你基本可以確定熱錢已經離場，市場真正看好這檔股票。操作時，你可以分兩段進行。如果你準備買一千股，可以在A點先進二百至三百股，將其餘的部分在B點買入。




    讀者或許會問：爲什麼不將一千股全在B點買入？因爲這樣可以防備有些強勢的股票，根本就不給回檔的機會，一過阻力線便一飛沖天，你如果看好這檔股票，卻失去這樣一飛沖天的機會，心裡會很懊惱。這樣做也符合下注的原則：即對勝利的把握愈'
  - '[PAGE 135]


    ![](img/af3de47fcb4db801f9d008fb55b44d63_135_0.png)


    圖 4-7


    大，下的注就愈大。這裡要再次強調交易量的重要性。如果交易量沒有增加，突破阻力線的現象並沒有太大的意義，請讀者自己思考一下其中的緣由。只有在交易量增加的前提下，突破阻力線才可以認為股票的運動已進入新的階段。


    讓我們再看一個例子，見圖4-7。


    這個例子中，股價跌穿支撐線即刻反彈，A點便是極好的買點。想像一下你是有錢的大戶，握有一批該公司的股票，而且你已得到一定的內幕消息，公司很快有一個好消息會公布，你會如何做？你會首先拋售手中的股票，讓股價跌破支撐線，因為你知道股價一旦跌破支撐線，會引發市場恐慌性拋售，這時你開始大量吸納。


    以我自己的經驗，如果股價跌穿支撐線，交易量大增且股價很快彈回支撐線之上，這是極佳的買入機會。我自己碰到這樣的機會十次中有九次賺錢。'
  - '[PAGE 136]


    大戶們操縱股票其實就是那麼幾招，你只要專心，觀察股票的運動和交易量的變化，想像你是大戶的話會如何調動大衆心理，大戶的花招其實明顯得很。講白了，他們想買進的時候，要嚀靜悄悄地，要嚀想法引起大衆的恐慌性拋售，前者你會看到交易量增加但不明顯，股價慢慢地一步步升高，後者便是搞一些大家公認的好賣點。大戶想賣的時候，要嚀先買進，造成股價狂升，引發股民貪念去搶抬轎子，要嚀就搞一些大眾公認的好買點。由於他們通常手握鉅資，要做到這些並不困難。但他們的動作必定會從股價的變動及交易量的變動中露出尾巴，只要你有足夠的經驗，你就明白怎麼跟著玩。

    你要記住：你買的股票都是別人賣給你的，你賣的股票都被別人買去了。想像你的對手是誰！如果是大戶的話，你炒股大概常虧錢，如果是小股民的話，你大約已贏多過於輸。

    細細揣摸這幾句話，哪一天你發覺自己真正明白了這段話，你就會覺得炒股的路上一一下子寬廣了許多。

    以上我們談了如何選臨界點買進股票，如何定停損點離場。你如果是一位較長期的投資者，不要注重大戶的操縱，他們的操縱只能影響股票的短期波動，不能影響大勢。但就俗語所言：「好的開始是成功的一半。」

    一個正確的入場點會使你少傷很多腦筋。以下我們再來談談如何選股票來買。買股的時機固然重要，但買什麼股票也有擁有同樣的份量。'
  md: "\n股市一炮打響，一飛沖天，他一定是在作白日夢。就算他運氣好，一進場就撈了一筆，這筆錢來得容易，但它只是股市暫時借給他的，他如果不即刻上岸，股市遲早會向他討回去。想從股市不斷地賺到錢，你必須有知識、有經驗，你必須成為專家。\n\
    \n在我炒股的這麼多年中，歷經許多的不眠之夜。我的最高記錄是一天虧掉五萬美元。五萬美元對有錢人來說是小數目，但那時這是我全部資產的一半，相當於當時我妻子兩年的工資，而且其中很多是我在餐館端盤子、洗碟子賺來的血汗錢！我今天還能感受到當時的痛苦和麻木，隨後兩個星期連飯都吃不下了。最痛苦的不是虧錢的數目，錢虧掉不可怕，可怕的是不知道有無本事再賺回來！\n\
    \n我不斷地問自己：這個行業適合我嗎？\n\n我知道大學熬四年能畢業，就算在其他行業當學徒也有出師的時候，但股票大學的畢業典禮在哪裡？像這樣每天工作十小時，不僅今天沒有薪水，也不知道以後會不會有報酬？這樣的子到底要熬多久？我有沒有畢業的可能？我是窮人家的孩子，過的是手停口停的生活，多年省吃儉用的儲蓄一天天減少，這日子有熬出頭的一天嗎？放棄的念頭沒有一天停下來。有時，我還想就算到餐館做服務生，一天也總能掙上幾十塊錢。\n\
    \n相信讀者看到這裡可以想像我當時的絕望。當然，若是我當時真的放棄了，讀者也看不到這本書了。\n\n數十年過去，回首往事，有時自己都爲自己的韌性感到驕傲。我要讀者們分享拿破崙·希爾\
    \ (Napoleon Hill) 在他的不朽名著《思考致富》(*Think and Grow Rich*) 中的一句話：\n\n> 「當財富來到的時候，它將來得如此急、如此快，使人好奇在那艱難的歲月，這些財富都躲到哪裡去了？」\n\
    \n我的生活經驗證明這句話確實無誤。這句話和孟子的名言「天將降大任於人也，必先苦其心志，勞其筋骨，餓其體膚⋯⋯」有著異曲同工之妙。\n\n如果成功來得太容易，它通常不會持久。這個世界有太多的地方能讓頭腦發熱的人摔跤，而且你遠猜不到會在什麼地方摔跤。因爲成功來得太容易，人往往不知福、不惜福，忘了自己是誰！黎明之前總是最黑暗的，你能熬過這段時間，你才能看到光明。\n\
    \n> 請記住：成功的祕訣不外乎是「在忍無可忍的時候，再忍一忍」。\n\n# 要有「與股同鬥，其樂無窮」的氣派\n\n所有成功的投資者對市場及其運作都有極大的興趣，他們喜歡市場所提供的挑戰，有強烈的欲望想戰勝這個市場。\n\
    \n吸引他們在這個市場搏鬥的不是金錢，不是名譽，不是快速致富。金錢只是他們玩股票遊戲成功後的獎品。對一般人而言，他們進市場的目的是爲了賺錢，這一期望使他們在這行成功的機率變得很低。因爲這一期望使他們難以維持冷靜的觀察力，他們沒有耐性等待必然的結果。中國的俗語叫做「豬油蒙了心」。傑西·李佛摩曾指出：「一位成功的炒手必須如一位成功的商人，正確地預見未來的需要，適時進貨，並耐心地等待盈利的時刻。」\n\
    \n# 要甘於做孤獨者\n\n幾乎所有成功的投資者都是孤獨者。他們必須是孤獨者！因爲他們常要做大眾不同的事。無論是低買高賣還是高買更高賣，他們都必須維持獨立思考，為了與眾不同因此做和大眾相反的事非常危險。\n\
    \n他們必須有合理的解釋為何大眾可能不正確，同時預見採用相反思維將引致的後果。這給他們與眾不同時所需的信心。從孩提時代，我們就深知合群從眾的重要性。胡思亂想，奇怪的主意，將使你失去朋友，受到嘲弄。長期以來我們已習慣於「集體思維」。但炒股需要不同的思考方式。如果股市大多數人都看好某股票，他們都已按自己的能力入場，還有誰來買股使得股市繼續升得更高？反之，如果大多數股民不看好股市，他們都已經脫手出場，那麼股市的繼續下跌區間也已不大。你如果隨著大流，那麼你將常常在高點入市，低點出市，最終你將成為一名失敗者。\n\
    \n當然，大多數股民看好大市或大多數股民不看好大市是很難計算，你主要通過研究「股勢」來得到答案。這裡強調的是思考方式。你從小學到的討人喜歡個性，例如：聽話、合群、不標新立異等等都成為炒股成功的障礙。\n\
    \n# 必須具備耐心和自制力\n\n耐心和自制力都是聽起來很簡單但做起來很困難的事。炒股是極其枯燥無味的工作。讀者可能會嘲笑我的說法，他們可能會說：「我炒過股，我覺得極其刺激好玩。」這是因為你把炒股當成消遣，沒有將它當成嚴肅的工作。我是圍棋愛好者，我覺得圍棋很好玩。但是問那些下棋維生的人，他們一定會告訴你終日對著棋盤練習是多麼枯燥單調的一件事。這其中的甘苦都是一樣的。\n\
    \n每天收集資料、判斷行情，將這些資訊與經驗相互參照，並訂好炒股的計畫，偶爾做做或許感覺興奮、有趣，但經年累月地重複同樣的工作就是「苦工」。但若是你不把「苦工」當成習慣，你在這行成功的機會就不大。\n\
    \n因為炒股是如此的單調乏味，新手們就喜歡不顧外在條件地在股市跳進、跳出尋求刺激。但在最後計算成果時，你自然明白想要尋求刺激的代價多麼高昂。你必須培養自己的耐心和自制力，否則難以在這行成功。\n\
    \n看過獅子是怎樣捕獵的嗎？它耐心地等待獵物，只有在時機及取勝機會都適合的時候，它才從草叢中跳出來。成功的炒手具有同樣的特點，他絕不為炒股而炒股，他等待合適的時機，然後採取行動。\n\
    \n等待時機也如種植花草。大家都知道春天是播種的時候，無論你多麼喜歡花，在冬天把種子播入土的結果將會是什麼，這很清楚。你不能太早，也不能太遲，在正確的時間和環境做正確的事才有可能得到預想的效果。不幸的是，對業餘炒手而言，往往不是沒有耐心，也不是不知道危險，他們也知道春天是播種的時機，但問題是他們沒有足夠的知識和經驗判定何時是春天！\n\
    \n這需要漫長且艱難的學習過程，除了熬之外，沒有其他的辦法。當你經歷了足夠的升和跌，你的資金隨升跌起伏，你的希望和恐懼隨升跌而擺動，逐漸地，你的靈感就培養起來了。\n\
    \n# 必須有一套適合自己的炒股模式\n\n炒股高手只有在股票的外在條件（包括基本分析、技術分析及股票大勢）符合自己的作戰計畫時才採取行動。俗話說：「條條道路通羅馬」，這裡的「羅馬」就是累積財富，成為股票遊戲的勝利者，而「道路」就是你自己的方法。\n\
    \n採用什麼道路並不重要，重要的是這條道路必須符合你的個性，你走起來輕鬆而愉快，你有信心能走遠路。在這基礎上你才會對自己的方法有信心，最終不斷完善自己的方法以取得最高效率。\n\
    \n# 必須具有超前的想像力及對未來的判斷\n\n這並不是說優秀的投資者具有一般人未具備的第六感，而是他們有能力自繁雜的資訊中理出頭緒。大多數人注重於今天發生的一切並假設今天發生的一切會不斷延續，但優秀的投資者會看得更遠一步，預想在什麼情況下今天的情形會停滯甚至產生逆轉。他們並不比一般人聰明，但他們獨立思考，不拘泥於成見。當他們看到苗頭改變，立即採取行動，絕不會拖泥帶水。\n\
    \n# 成功的投資者絕不幻想\n\n一旦你把資金投入某檔股票，按原來的預想這檔股票的運動不對，你會怎麼辦？一般人常常想像出各種理由把這一不正常的運動「合理化」。這種為避免割肉痛苦的合理化假設極其致命，這也是許多有一定經驗的炒手最終不得不舉手投降的主要原因。一位成功的投資者絕不讓情感左右自己，有的話程度也很小。無論割肉認錯是多麼痛苦，他們絕不遲疑。他們明白，讓這樣的情況延續只會帶來更大的痛苦和損失。業餘炒手很少問自己一個問題：「假如我今天手邊有錢，還會買這檔股票嗎？」他們就算是問了，也會找成堆的理由來安慰自己：「隔壁老王說這檔股票的下跌只是暫時的」「賣出股票要手續費」等等。總歸一句話，業餘炒手想法設法不去停損。\n\
    \n# 要有應用知識的毅力\n\n怎樣才能減肥？答案其實只有四個字：少吃多動。減肥的知識是如此簡單，減肥應是輕而易舉吧？事實正好相反。美國有個統計，每一百人參加減肥訓練，只有十二個人降低了體重，其中只有兩個人將體重降低持續一年以上，也就是只有二%的成功率。減肥失敗的原因不是因為學習減肥多麼困難，而是因為大多數人缺少每天應用這些知識的毅力。你很想吃一塊蛋糕，但你知道這一塊蛋糕下肚子，運動一整天的效果就泡湯了，你忍得住嗎？你訂好計畫，每天吃什麼、運動多久，可是你堅持了多久呢？\n\
    \n炒股也是一樣，任何對炒股有一定認識的人，都明白炒股所需的具體知識少得可憐。股票只有兩條路可走，不是上就是下，影響股票升落的因素就是這麼多，真正重要的因素列出來占不滿你的手指，甚至不識字的也可以在股市露一手。股票的引誘力也人所周知，你如果做得好，前景大大的光明。\n\
    \n這樣的行業，成功率甚至低過減肥！為什麼？因為人們常常做不到自己該做的事情！\n\n人們都知道誠實是取信於人的不二法門，有多少人做到了？我欣賞王安電腦公司創辦人王安的話：『我可能沒有把我知道的全部告訴妳，但我告訴妳的全部都是真的。』我們都知道「貪」是受騙的根源，有多少人能做到「不貪」？報紙上天天講的騙人和被騙的故事都是如何發生的？我們都知道努力是成功的基石，大家都想成功，有多少人做到了「努力」？或許有人認為每天工作八小時就已很「努力」了，未免太簡單了些。我們都知道應該「當天的事情當天做完」，有多少人做到了？這樣的例子很多很多。這些都是不難做到的事，需要的不過是在行動上應用，但大多數人都失敗了。\n\
    \n一位成功的投資者，他應十分留意怎樣將他的知識應用在炒股中，他不會因為應用這些知識的枯燥而忽略細節。在日常生活中，獲得知識通常並不困難，困難在於用毅力應用這些知識。在炒股問題上，我堅信「知易行難」之說。\n\
    \n# 第 4 章\n\n## 何時買股票？\n## 何時賣股票？\n\n華爾街將炒股訣竅歸納成一句話：「截短虧，讓利潤奔跑！」意思是：「一見股票情況不對，即刻停損，把它縮得越短越好！」一旦有了利潤，就必須讓利潤奔跑，從小利潤跑成大利潤。\n\
    \n# 第一節 何時買股票？\n\n在前面談了股票的性質與特點、炒股基礎知識和炒股成功的基本要素之後，本章將專門探討最技術性的實戰問題——怎樣買賣股票。\n\
    \n這個問題我打算從買賣股票依據的基本原則、買入操作的技巧、選擇股票的程式等方面加以闡述。\n\n## 基本原則\n\n在我討論「何時買股票？」之前，我要提醒各位讀者，就我多年炒股經驗，選買點的最要點是選擇停損點。也就是在你進場之前，你必須很清楚若股票的運動和預期不合，你必須決定在哪點停損上離場。換句話說，在投資做生意前，不要老是想著要賺多少錢，首先應該清楚自己能夠虧得起多少。有些人以一○％的數量當做停損基數，也就是十元進的股票，以九元做停損點。有些人將停損點定在支撐線稍下。有些人定二○％的停損額。還有其他各種方法。無論什麼方法，都必須有個停損點，這個停損點不應該超出投資額的二○％。請讀者切切牢記，否則一切都是空談。\n\
    \n買股票的依據主要是三點：「基本分析」、「技術分析」及「大市走向」。有些人買股票只看基本分析，也就是只研究公司的本身價值，不看其他。股神華倫·巴菲特（Warren\
    \ Buffett）便是代表人物。有些人只看技術分析，認爲市場對該股票的看法全部表現在股價及其交易量的變化之上。大多數的炒手屬於第二類。\n\n無論哪一種，只要你能做得好，都可以獲得好結果。但對一般的炒手而言，要僅靠基本分析來炒股很困難，因爲你不可能獲得完善的資料來判定公司的價值。你如果是位大基金的管理人，買了某公司的大批股票，你可以派個人到公司坐鎮，瞭解公司的細節。但對一般人來說，這是不可能的。公司的財務報告僅表明了過去的經營情況，並不代表未來的發展。依據華爾街的说法，股票價格反應的是股票半年或更遠的未來的公司前景。\n\
    \n我自己靠炒股維生，我必須盡量做到每個月都有收入。完全靠基本分析來炒股，我沒有把握能夠做到這一點。所以我的主要參考依據是技術分析。我總是選擇那些我入場時勝算最大的點，而且每次下注都只是我資本的小部分，同時把握「虧錢時虧小錢，賺錢時賺大錢」的原則及及時停損。老實說我差不多就像在開賭場，每次入場時獲勝機率都超過50%，而且我只下小注，所以我久賭必贏。\n\
    \n在第二章第二節「技術分析的基本知識」中，我介紹了幾個圖。圖中所有的突破點都可以叫做「臨界點」。我總是將買賣控制在臨界點附近。什麼是「臨界點」呢？大家知道水在攝氏一百度變成蒸汽，科學上稱一百度正是水的臨界點。同樣的道理，衣服成本價是家庭主\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_129_0.png)\n\n圖 4-1\n\n婦們買衣服的臨界點，在這個價格上買衣服被宰的機會最小。在股票操作上，這些點往往是大眾對股價重新評估的點，也就是在這些點上，你入場的獲勝機率最高。買股票的技巧，全在於如何尋找臨界點。\n\
    \n## 操作技巧\n\n以下讓我們分析一下買股票時怎樣具體操作。\n\n- 1、升勢時的操作（圖4-1）\n  假如這是一個正常的升勢，A、B點分別是波峰和波谷。一旦股價超過A點，便是好的買入點。假設A為十五元，B為十三元，則好的買入點是十五、一○元或十五、五○元。因爲你可能判定這是新一波的開始。假如股價升到十六、五○元，你便可將賣出價定在十五、五○元。記住保本。\n\
    \  如果繼續上升，你便應忘掉入場價，專注於股票的運動是否正常。停損點應如何定呢？有兩種方法：\n  第一、A 為十五元，把停損點定在十四元。第二、B 為十三元，把停損點定在十三元。\n\
    \  這得看你对風險的承受力。但無論如何，一且股價跌穿 B 點時就必須走人。記得升勢的定義嗎？正常的升勢應該一浪高過一浪，如果股價高過 A 但隨即擊穿 B，表示升勢已被暫時否定。你必須在場外觀望，重新尋找機會。\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_130_0.png)\n\n- 2、阻力線和支撐線的操作（圖 4-2）\n\
    \  阻力線上的買點及停損點的標示。假設阻力線是十五元，一且股價突破十五元，即可考慮入場。把停損點定在十四、五○元或十四元。永遠記住只能虧小錢。股票一且穿越阻力線，正常運動是繼續上升，如果又跌穿回頭，表示股票運動不正常，早先的穿越是假信號，可能是大戶搗鬼。\n\
    \  有時股票跌到你的停損點又馬上回頭，這也不要緊，你可以再入場，再入場的點以上一波的高點所示。這類場合常常碰到，但這是唯一正確的做法。虧的錢等於買了保險，防止了虧大錢的可能。\n\
    \  圖4-3 支撐線的買點及停損點的標示。\n  如果股價一碰到支撐線就反彈，你有理由相信此時股價接近谷底。但如果買入的話，你必須在支撐線之下定個停損點。因爲股票價格跌穿支撐線，繼續下跌的機率就大過上升的機率。\n\
    \n- 3、雙肩圖和頭肩圖的操作\n  這裡只標出正雙肩（圖4-4）和倒頭肩圖（圖4-5）兩種。正雙肩不提供買的機會，它標明賣點何在。\n  倒頭肩圖的操作法和阻力線上的操作法相同。\n\
    \  以上講了三個基本圖形的操作法。道理其實相當簡單。讀者能回到第二章第二節的「綜合看圖」那段，體會可能會更深一些。一般的股票波動就是\n\n![](img/af3de47fcb4db801f9d008fb55b44d63_131_0.png)\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_132_0.png)\n\n![](img/af3de47fcb4db801f9d008fb55b44d63_132_1.png)\n\
    \n圖4-5 倒頭肩\n圖4-4 正雙肩\n\n這幾種圖顛來倒去。頭肩圖中的頭和肩如果平行的話就變成三肩圖。把升勢時的波峰連接，再把波谷連接，你就看到通道。就我自己的經驗，最有用的概念是阻力線和支撐線，理論上它們最容易解釋，在實際中它們也最爲有效。\n\
    \n我們可以把買入的要點歸納一下：\n\n- 第一、在買入之前，一定要參照一下股票的走勢圖，因爲它是大衆投資心理的反映。\n- 第二、在買入之前，先定好停損點，搞清楚你最多願意多少錢。切記照辦。\n\
    - 第三、選擇臨界點，記住你不可能每次正確，所以入場點的獲勝機率應大過失敗機率。\n- 第四、最好在升勢或突破阻力線，準備開始升勢的時候買入。\n- 第五、絕不要在跌勢時入市。\n\
    - 第六、不要把「股票已跌了很低了」作為買入的理由，你不知道它還會跌多少！\n- 第七，不要把「好消息」或「專家推薦」做為買的理由，特別在這些好消息公布之前，股票已升了一大截的情況。\n\
    - 第八，記住這些要點以及點點辨辦。\n\n以上我們討論了幾個臨界點，在基礎知識上討論了這些臨界點形成的心理。但是不是臨界點只有這個呢？答案當然是否定的。**學習尋找臨界點的過程其實是學習炒股的過程**，當然這其中還包括學習炒股的正确心態。坦白地說，學習找臨界點的技巧比較容易，培養心態才真正困難。\n\
    \n## 關鍵：把握臨界點\n\n為了使讀者對臨界點有更深的認識，讓我們做些更進一步的思考。股市是講究大錢的地方，任何這樣的場所，都一定有大戶在興風作浪，中國的股市是這樣，美國的股市是這樣，全世界任何地方的股市都沒有例外。\n\
    \n人都知道股價突破阻力線時是好的買入點，大戶也知道。你如果是大戶，你會如何做？你會在低點吸納，再人為地創造出大眾認爲好的買入點，引起大眾的興趣，這時再把股票拋掉。這就是常常看到股票突破阻力線後常常回檔的原因。但有一點可以確定，短線操作的資金都是熱錢，它不會長久留在某檔股票上，除非大戶認為該股票的有潛力。\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_134_0.png)\n\n如圖4+6中的A、B兩點，如果股票突破阻力線，A點便是好的買入點。在稍微回檔後，股票若能突破上回波浪的高點達到B點，那麼B點才是更好的買入點。因為你基本可以確定熱錢已經離場，市場真正看好這檔股票。操作時，你可以分兩段進行。如果你準備買一千股，可以在A點先進二百至三百股，將其餘的部分在B點買入。\n\
    \n讀者或許會問：爲什麼不將一千股全在B點買入？因爲這樣可以防備有些強勢的股票，根本就不給回檔的機會，一過阻力線便一飛沖天，你如果看好這檔股票，卻失去這樣一飛沖天的機會，心裡會很懊惱。這樣做也符合下注的原則：即對勝利的把握愈\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_135_0.png)\n\n圖 4-7\n\n大，下的注就愈大。這裡要再次強調交易量的重要性。如果交易量沒有增加，突破阻力線的現象並沒有太大的意義，請讀者自己思考一下其中的緣由。只有在交易量增加的前提下，突破阻力線才可以認為股票的運動已進入新的階段。\n\
    \n讓我們再看一個例子，見圖4-7。\n\n這個例子中，股價跌穿支撐線即刻反彈，A點便是極好的買點。想像一下你是有錢的大戶，握有一批該公司的股票，而且你已得到一定的內幕消息，公司很快有一個好消息會公布，你會如何做？你會首先拋售手中的股票，讓股價跌破支撐線，因為你知道股價一旦跌破支撐線，會引發市場恐慌性拋售，這時你開始大量吸納。\n\
    \n以我自己的經驗，如果股價跌穿支撐線，交易量大增且股價很快彈回支撐線之上，這是極佳的買入機會。我自己碰到這樣的機會十次中有九次賺錢。\n\n大戶們操縱股票其實就是那麼幾招，你只要專心，觀察股票的運動和交易量的變化，想像你是大戶的話會如何調動大衆心理，大戶的花招其實明顯得很。講白了，他們想買進的時候，要嚀靜悄悄地，要嚀想法引起大衆的恐慌性拋售，前者你會看到交易量增加但不明顯，股價慢慢地一步步升高，後者便是搞一些大家公認的好賣點。大戶想賣的時候，要嚀先買進，造成股價狂升，引發股民貪念去搶抬轎子，要嚀就搞一些大眾公認的好買點。由於他們通常手握鉅資，要做到這些並不困難。但他們的動作必定會從股價的變動及交易量的變動中露出尾巴，只要你有足夠的經驗，你就明白怎麼跟著玩。\n\
    \n你要記住：你買的股票都是別人賣給你的，你賣的股票都被別人買去了。想像你的對手是誰！如果是大戶的話，你炒股大概常虧錢，如果是小股民的話，你大約已贏多過於輸。\n\
    \n細細揣摸這幾句話，哪一天你發覺自己真正明白了這段話，你就會覺得炒股的路上一一下子寬廣了許多。\n\n以上我們談了如何選臨界點買進股票，如何定停損點離場。你如果是一位較長期的投資者，不要注重大戶的操縱，他們的操縱只能影響股票的短期波動，不能影響大勢。但就俗語所言：「好的開始是成功的一半。」一個正確的入場點會使你少傷很多腦筋。以下我們再來談談如何選股票來買。買股的時機固然重要，但買什麼股票也有擁有同樣的份量。\n"
  mdcn: "\n股市一炮打響，一飛沖天，他一定是在作白日夢。就算他運氣好，一進場就撈了一筆，這筆錢來得容易，但它只是股市暫時借給他的，他如果不即刻上岸，股市遲早會向他討回去。想從股市不斷地賺到錢，你必須有知識、有經驗，你必須成為專家。\n\
    \n在我炒股的這麼多年中，歷經許多的不眠之夜。我的最高記錄是一天虧掉五萬美元。五萬美元對有錢人來說是小數目，但那時這是我全部資產的一半，相當於當時我妻子兩年的工資，而且其中很多是我在餐館端盤子、洗碟子賺來的血汗錢！我今天還能感受到當時的痛苦和麻木，隨後兩個星期連飯都吃不下了。最痛苦的不是虧錢的數目，錢虧掉不可怕，可怕的是不知道有無本事再賺回來！\n\
    \n我不斷地問自己：這個行業適合我嗎？\n\n我知道大學熬四年能畢業，就算在其他行業當學徒也有出師的時候，但股票大學的畢業典禮在哪裡？像這樣每天工作十小時，不僅今天沒有薪水，也不知道以後會不會有報酬？這樣的子到底要熬多久？我有沒有畢業的可能？我是窮人家的孩子，過的是手停口停的生活，多年省吃儉用的儲蓄一天天減少，這日子有熬出頭的一天嗎？放棄的念頭沒有一天停下來。有時，我還想就算到餐館做服務生，一天也總能掙上幾十塊錢。\n\
    \n相信讀者看到這裡可以想像我當時的絕望。當然，若是我當時真的放棄了，讀者也看不到這本書了。\n\n數十年過去，回首往事，有時自己都爲自己的韌性感到驕傲。我要讀者們分享拿破崙·希爾\
    \ (Napoleon Hill) 在他的不朽名著《思考致富》(*Think and Grow Rich*) 中的一句話：\n\n> 「當財富來到的時候，它將來得如此急、如此快，使人好奇在那艱難的歲月，這些財富都躲到哪裡去了？」\n\
    \n我的生活經驗證明這句話確實無誤。這句話和孟子的名言「天將降大任於人也，必先苦其心志，勞其筋骨，餓其體膚⋯⋯」有著異曲同工之妙。\n\n如果成功來得太容易，它通常不會持久。這個世界有太多的地方能讓頭腦發熱的人摔跤，而且你遠猜不到會在什麼地方摔跤。因爲成功來得太容易，人往往不知福、不惜福，忘了自己是誰！黎明之前總是最黑暗的，你能熬過這段時間，你才能看到光明。\n\
    \n> 請記住：成功的祕訣不外乎是「在忍無可忍的時候，再忍一忍」。\n\n# 要有「與股同鬥，其樂無窮」的氣派\n\n所有成功的投資者對市場及其運作都有極大的興趣，他們喜歡市場所提供的挑戰，有強烈的欲望想戰勝這個市場。\n\
    \n吸引他們在這個市場搏鬥的不是金錢，不是名譽，不是快速致富。金錢只是他們玩股票遊戲成功後的獎品。對一般人而言，他們進市場的目的是爲了賺錢，這一期望使他們在這行成功的機率變得很低。因爲這一期望使他們難以維持冷靜的觀察力，他們沒有耐性等待必然的結果。中國的俗語叫做「豬油蒙了心」。傑西·李佛摩曾指出：「一位成功的炒手必須如一位成功的商人，正確地預見未來的需要，適時進貨，並耐心地等待盈利的時刻。」\n\
    \n# 要甘於做孤獨者\n\n幾乎所有成功的投資者都是孤獨者。他們必須是孤獨者！因爲他們常要做大眾不同的事。無論是低買高賣還是高買更高賣，他們都必須維持獨立思考，為了與眾不同因此做和大眾相反的事非常危險。\n\
    \n他們必須有合理的解釋為何大眾可能不正確，同時預見採用相反思維將引致的後果。這給他們與眾不同時所需的信心。從孩提時代，我們就深知合群從眾的重要性。胡思亂想，奇怪的主意，將使你失去朋友，受到嘲弄。長期以來我們已習慣於「集體思維」。但炒股需要不同的思考方式。如果股市大多數人都看好某股票，他們都已按自己的能力入場，還有誰來買股使得股市繼續升得更高？反之，如果大多數股民不看好股市，他們都已經脫手出場，那麼股市的繼續下跌區間也已不大。你如果隨著大流，那麼你將常常在高點入市，低點出市，最終你將成為一名失敗者。\n\
    \n當然，大多數股民看好大市或大多數股民不看好大市是很難計算，你主要通過研究「股勢」來得到答案。這裡強調的是思考方式。你從小學到的討人喜歡個性，例如：聽話、合群、不標新立異等等都成為炒股成功的障礙。\n\
    \n# 必須具備耐心和自制力\n\n耐心和自制力都是聽起來很簡單但做起來很困難的事。炒股是極其枯燥無味的工作。讀者可能會嘲笑我的說法，他們可能會說：「我炒過股，我覺得極其刺激好玩。」這是因為你把炒股當成消遣，沒有將它當成嚴肅的工作。我是圍棋愛好者，我覺得圍棋很好玩。但是問那些下棋維生的人，他們一定會告訴你終日對著棋盤練習是多麼枯燥單調的一件事。這其中的甘苦都是一樣的。\n\
    \n每天收集資料、判斷行情，將這些資訊與經驗相互參照，並訂好炒股的計畫，偶爾做做或許感覺興奮、有趣，但經年累月地重複同樣的工作就是「苦工」。但若是你不把「苦工」當成習慣，你在這行成功的機會就不大。\n\
    \n因為炒股是如此的單調乏味，新手們就喜歡不顧外在條件地在股市跳進、跳出尋求刺激。但在最後計算成果時，你自然明白想要尋求刺激的代價多麼高昂。你必須培養自己的耐心和自制力，否則難以在這行成功。\n\
    \n看過獅子是怎樣捕獵的嗎？它耐心地等待獵物，只有在時機及取勝機會都適合的時候，它才從草叢中跳出來。成功的炒手具有同樣的特點，他絕不為炒股而炒股，他等待合適的時機，然後採取行動。\n\
    \n等待時機也如種植花草。大家都知道春天是播種的時候，無論你多麼喜歡花，在冬天把種子播入土的結果將會是什麼，這很清楚。你不能太早，也不能太遲，在正確的時間和環境做正確的事才有可能得到預想的效果。不幸的是，對業餘炒手而言，往往不是沒有耐心，也不是不知道危險，他們也知道春天是播種的時機，但問題是他們沒有足夠的知識和經驗判定何時是春天！\n\
    \n這需要漫長且艱難的學習過程，除了熬之外，沒有其他的辦法。當你經歷了足夠的升和跌，你的資金隨升跌起伏，你的希望和恐懼隨升跌而擺動，逐漸地，你的靈感就培養起來了。\n\
    \n# 必須有一套適合自己的炒股模式\n\n炒股高手只有在股票的外在條件（包括基本分析、技術分析及股票大勢）符合自己的作戰計畫時才採取行動。俗話說：「條條道路通羅馬」，這裡的「羅馬」就是累積財富，成為股票遊戲的勝利者，而「道路」就是你自己的方法。\n\
    \n採用什麼道路並不重要，重要的是這條道路必須符合你的個性，你走起來輕鬆而愉快，你有信心能走遠路。在這基礎上你才會對自己的方法有信心，最終不斷完善自己的方法以取得最高效率。\n\
    \n# 必須具有超前的想像力及對未來的判斷\n\n這並不是說優秀的投資者具有一般人未具備的第六感，而是他們有能力自繁雜的資訊中理出頭緒。大多數人注重於今天發生的一切並假設今天發生的一切會不斷延續，但優秀的投資者會看得更遠一步，預想在什麼情況下今天的情形會停滯甚至產生逆轉。他們並不比一般人聰明，但他們獨立思考，不拘泥於成見。當他們看到苗頭改變，立即採取行動，絕不會拖泥帶水。\n\
    \n# 成功的投資者絕不幻想\n\n一旦你把資金投入某檔股票，按原來的預想這檔股票的運動不對，你會怎麼辦？一般人常常想像出各種理由把這一不正常的運動「合理化」。這種為避免割肉痛苦的合理化假設極其致命，這也是許多有一定經驗的炒手最終不得不舉手投降的主要原因。一位成功的投資者絕不讓情感左右自己，有的話程度也很小。無論割肉認錯是多麼痛苦，他們絕不遲疑。他們明白，讓這樣的情況延續只會帶來更大的痛苦和損失。業餘炒手很少問自己一個問題：「假如我今天手邊有錢，還會買這檔股票嗎？」他們就算是問了，也會找成堆的理由來安慰自己：「隔壁老王說這檔股票的下跌只是暫時的」「賣出股票要手續費」等等。總歸一句話，業餘炒手想法設法不去停損。\n\
    \n# 要有應用知識的毅力\n\n怎樣才能減肥？答案其實只有四個字：少吃多動。減肥的知識是如此簡單，減肥應是輕而易舉吧？事實正好相反。美國有個統計，每一百人參加減肥訓練，只有十二個人降低了體重，其中只有兩個人將體重降低持續一年以上，也就是只有二%的成功率。減肥失敗的原因不是因為學習減肥多麼困難，而是因為大多數人缺少每天應用這些知識的毅力。你很想吃一塊蛋糕，但你知道這一塊蛋糕下肚子，運動一整天的效果就泡湯了，你忍得住嗎？你訂好計畫，每天吃什麼、運動多久，可是你堅持了多久呢？\n\
    \n炒股也是一樣，任何對炒股有一定認識的人，都明白炒股所需的具體知識少得可憐。股票只有兩條路可走，不是上就是下，影響股票升落的因素就是這麼多，真正重要的因素列出來占不滿你的手指，甚至不識字的也可以在股市露一手。股票的引誘力也人所周知，你如果做得好，前景大大的光明。\n\
    \n這樣的行業，成功率甚至低過減肥！為什麼？因為人們常常做不到自己該做的事情！\n\n人們都知道誠實是取信於人的不二法門，有多少人做到了？我欣賞王安電腦公司創辦人王安的話：『我可能沒有把我知道的全部告訴妳，但我告訴妳的全部都是真的。』我們都知道「貪」是受騙的根源，有多少人能做到「不貪」？報紙上天天講的騙人和被騙的故事都是如何發生的？我們都知道努力是成功的基石，大家都想成功，有多少人做到了「努力」？或許有人認為每天工作八小時就已很「努力」了，未免太簡單了些。我們都知道應該「當天的事情當天做完」，有多少人做到了？這樣的例子很多很多。這些都是不難做到的事，需要的不過是在行動上應用，但大多數人都失敗了。\n\
    \n一位成功的投資者，他應十分留意怎樣將他的知識應用在炒股中，他不會因為應用這些知識的枯燥而忽略細節。在日常生活中，獲得知識通常並不困難，困難在於用毅力應用這些知識。在炒股問題上，我堅信「知易行難」之說。\n\
    \n# 第 4 章\n\n## 何時買股票？\n## 何時賣股票？\n\n華爾街將炒股訣竅歸納成一句話：「截短虧，讓利潤奔跑！」意思是：「一見股票情況不對，即刻停損，把它縮得越短越好！」一旦有了利潤，就必須讓利潤奔跑，從小利潤跑成大利潤。\n\
    \n# 第一節 何時買股票？\n\n在前面談了股票的性質與特點、炒股基礎知識和炒股成功的基本要素之後，本章將專門探討最技術性的實戰問題——怎樣買賣股票。\n\
    \n這個問題我打算從買賣股票依據的基本原則、買入操作的技巧、選擇股票的程式等方面加以闡述。\n\n## 基本原則\n\n在我討論「何時買股票？」之前，我要提醒各位讀者，就我多年炒股經驗，選買點的最要點是選擇停損點。也就是在你進場之前，你必須很清楚若股票的運動和預期不合，你必須決定在哪點停損上離場。換句話說，在投資做生意前，不要老是想著要賺多少錢，首先應該清楚自己能夠虧得起多少。有些人以一○％的數量當做停損基數，也就是十元進的股票，以九元做停損點。有些人將停損點定在支撐線稍下。有些人定二○％的停損額。還有其他各種方法。無論什麼方法，都必須有個停損點，這個停損點不應該超出投資額的二○％。請讀者切切牢記，否則一切都是空談。\n\
    \n買股票的依據主要是三點：「基本分析」、「技術分析」及「大市走向」。有些人買股票只看基本分析，也就是只研究公司的本身價值，不看其他。股神華倫·巴菲特（Warren\
    \ Buffett）便是代表人物。有些人只看技術分析，認爲市場對該股票的看法全部表現在股價及其交易量的變化之上。大多數的炒手屬於第二類。\n\n無論哪一種，只要你能做得好，都可以獲得好結果。但對一般的炒手而言，要僅靠基本分析來炒股很困難，因爲你不可能獲得完善的資料來判定公司的價值。你如果是位大基金的管理人，買了某公司的大批股票，你可以派個人到公司坐鎮，瞭解公司的細節。但對一般人來說，這是不可能的。公司的財務報告僅表明了過去的經營情況，並不代表未來的發展。依據華爾街的说法，股票價格反應的是股票半年或更遠的未來的公司前景。\n\
    \n我自己靠炒股維生，我必須盡量做到每個月都有收入。完全靠基本分析來炒股，我沒有把握能夠做到這一點。所以我的主要參考依據是技術分析。我總是選擇那些我入場時勝算最大的點，而且每次下注都只是我資本的小部分，同時把握「虧錢時虧小錢，賺錢時賺大錢」的原則及及時停損。老實說我差不多就像在開賭場，每次入場時獲勝機率都超過50%，而且我只下小注，所以我久賭必贏。\n\
    \n在第二章第二節「技術分析的基本知識」中，我介紹了幾個圖。圖中所有的突破點都可以叫做「臨界點」。我總是將買賣控制在臨界點附近。什麼是「臨界點」呢？大家知道水在攝氏一百度變成蒸汽，科學上稱一百度正是水的臨界點。同樣的道理，衣服成本價是家庭主\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_129_0.png)\n\n圖 4-1\n\n婦們買衣服的臨界點，在這個價格上買衣服被宰的機會最小。在股票操作上，這些點往往是大眾對股價重新評估的點，也就是在這些點上，你入場的獲勝機率最高。買股票的技巧，全在於如何尋找臨界點。\n\
    \n## 操作技巧\n\n以下讓我們分析一下買股票時怎樣具體操作。\n\n- 1、升勢時的操作（圖4-1）\n  假如這是一個正常的升勢，A、B點分別是波峰和波谷。一旦股價超過A點，便是好的買入點。假設A為十五元，B為十三元，則好的買入點是十五、一○元或十五、五○元。因爲你可能判定這是新一波的開始。假如股價升到十六、五○元，你便可將賣出價定在十五、五○元。記住保本。\n\
    \  如果繼續上升，你便應忘掉入場價，專注於股票的運動是否正常。停損點應如何定呢？有兩種方法：\n  第一、A 為十五元，把停損點定在十四元。第二、B 為十三元，把停損點定在十三元。\n\
    \  這得看你对風險的承受力。但無論如何，一且股價跌穿 B 點時就必須走人。記得升勢的定義嗎？正常的升勢應該一浪高過一浪，如果股價高過 A 但隨即擊穿 B，表示升勢已被暫時否定。你必須在場外觀望，重新尋找機會。\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_130_0.png)\n\n- 2、阻力線和支撐線的操作（圖 4-2）\n\
    \  阻力線上的買點及停損點的標示。假設阻力線是十五元，一且股價突破十五元，即可考慮入場。把停損點定在十四、五○元或十四元。永遠記住只能虧小錢。股票一且穿越阻力線，正常運動是繼續上升，如果又跌穿回頭，表示股票運動不正常，早先的穿越是假信號，可能是大戶搗鬼。\n\
    \  有時股票跌到你的停損點又馬上回頭，這也不要緊，你可以再入場，再入場的點以上一波的高點所示。這類場合常常碰到，但這是唯一正確的做法。虧的錢等於買了保險，防止了虧大錢的可能。\n\
    \  圖4-3 支撐線的買點及停損點的標示。\n  如果股價一碰到支撐線就反彈，你有理由相信此時股價接近谷底。但如果買入的話，你必須在支撐線之下定個停損點。因爲股票價格跌穿支撐線，繼續下跌的機率就大過上升的機率。\n\
    \n- 3、雙肩圖和頭肩圖的操作\n  這裡只標出正雙肩（圖4-4）和倒頭肩圖（圖4-5）兩種。正雙肩不提供買的機會，它標明賣點何在。\n  倒頭肩圖的操作法和阻力線上的操作法相同。\n\
    \  以上講了三個基本圖形的操作法。道理其實相當簡單。讀者能回到第二章第二節的「綜合看圖」那段，體會可能會更深一些。一般的股票波動就是\n\n![](img/af3de47fcb4db801f9d008fb55b44d63_131_0.png)\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_132_0.png)\n\n![](img/af3de47fcb4db801f9d008fb55b44d63_132_1.png)\n\
    \n圖4-5 倒頭肩\n圖4-4 正雙肩\n\n這幾種圖顛來倒去。頭肩圖中的頭和肩如果平行的話就變成三肩圖。把升勢時的波峰連接，再把波谷連接，你就看到通道。就我自己的經驗，最有用的概念是阻力線和支撐線，理論上它們最容易解釋，在實際中它們也最爲有效。\n\
    \n我們可以把買入的要點歸納一下：\n\n- 第一、在買入之前，一定要參照一下股票的走勢圖，因爲它是大衆投資心理的反映。\n- 第二、在買入之前，先定好停損點，搞清楚你最多願意多少錢。切記照辦。\n\
    - 第三、選擇臨界點，記住你不可能每次正確，所以入場點的獲勝機率應大過失敗機率。\n- 第四、最好在升勢或突破阻力線，準備開始升勢的時候買入。\n- 第五、絕不要在跌勢時入市。\n\
    - 第六、不要把「股票已跌了很低了」作為買入的理由，你不知道它還會跌多少！\n- 第七，不要把「好消息」或「專家推薦」做為買的理由，特別在這些好消息公布之前，股票已升了一大截的情況。\n\
    - 第八，記住這些要點以及點點辨辦。\n\n以上我們討論了幾個臨界點，在基礎知識上討論了這些臨界點形成的心理。但是不是臨界點只有這個呢？答案當然是否定的。**學習尋找臨界點的過程其實是學習炒股的過程**，當然這其中還包括學習炒股的正确心態。坦白地說，學習找臨界點的技巧比較容易，培養心態才真正困難。\n\
    \n## 關鍵：把握臨界點\n\n為了使讀者對臨界點有更深的認識，讓我們做些更進一步的思考。股市是講究大錢的地方，任何這樣的場所，都一定有大戶在興風作浪，中國的股市是這樣，美國的股市是這樣，全世界任何地方的股市都沒有例外。\n\
    \n人都知道股價突破阻力線時是好的買入點，大戶也知道。你如果是大戶，你會如何做？你會在低點吸納，再人為地創造出大眾認爲好的買入點，引起大眾的興趣，這時再把股票拋掉。這就是常常看到股票突破阻力線後常常回檔的原因。但有一點可以確定，短線操作的資金都是熱錢，它不會長久留在某檔股票上，除非大戶認為該股票的有潛力。\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_134_0.png)\n\n如圖4+6中的A、B兩點，如果股票突破阻力線，A點便是好的買入點。在稍微回檔後，股票若能突破上回波浪的高點達到B點，那麼B點才是更好的買入點。因為你基本可以確定熱錢已經離場，市場真正看好這檔股票。操作時，你可以分兩段進行。如果你準備買一千股，可以在A點先進二百至三百股，將其餘的部分在B點買入。\n\
    \n讀者或許會問：爲什麼不將一千股全在B點買入？因爲這樣可以防備有些強勢的股票，根本就不給回檔的機會，一過阻力線便一飛沖天，你如果看好這檔股票，卻失去這樣一飛沖天的機會，心裡會很懊惱。這樣做也符合下注的原則：即對勝利的把握愈\n\
    \n![](img/af3de47fcb4db801f9d008fb55b44d63_135_0.png)\n\n圖 4-7\n\n大，下的注就愈大。這裡要再次強調交易量的重要性。如果交易量沒有增加，突破阻力線的現象並沒有太大的意義，請讀者自己思考一下其中的緣由。只有在交易量增加的前提下，突破阻力線才可以認為股票的運動已進入新的階段。\n\
    \n讓我們再看一個例子，見圖4-7。\n\n這個例子中，股價跌穿支撐線即刻反彈，A點便是極好的買點。想像一下你是有錢的大戶，握有一批該公司的股票，而且你已得到一定的內幕消息，公司很快有一個好消息會公布，你會如何做？你會首先拋售手中的股票，讓股價跌破支撐線，因為你知道股價一旦跌破支撐線，會引發市場恐慌性拋售，這時你開始大量吸納。\n\
    \n以我自己的經驗，如果股價跌穿支撐線，交易量大增且股價很快彈回支撐線之上，這是極佳的買入機會。我自己碰到這樣的機會十次中有九次賺錢。\n\n大戶們操縱股票其實就是那麼幾招，你只要專心，觀察股票的運動和交易量的變化，想像你是大戶的話會如何調動大衆心理，大戶的花招其實明顯得很。講白了，他們想買進的時候，要嚀靜悄悄地，要嚀想法引起大衆的恐慌性拋售，前者你會看到交易量增加但不明顯，股價慢慢地一步步升高，後者便是搞一些大家公認的好賣點。大戶想賣的時候，要嚀先買進，造成股價狂升，引發股民貪念去搶抬轎子，要嚀就搞一些大眾公認的好買點。由於他們通常手握鉅資，要做到這些並不困難。但他們的動作必定會從股價的變動及交易量的變動中露出尾巴，只要你有足夠的經驗，你就明白怎麼跟著玩。\n\
    \n你要記住：你買的股票都是別人賣給你的，你賣的股票都被別人買去了。想像你的對手是誰！如果是大戶的話，你炒股大概常虧錢，如果是小股民的話，你大約已贏多過於輸。\n\
    \n細細揣摸這幾句話，哪一天你發覺自己真正明白了這段話，你就會覺得炒股的路上一一下子寬廣了許多。\n\n以上我們談了如何選臨界點買進股票，如何定停損點離場。你如果是一位較長期的投資者，不要注重大戶的操縱，他們的操縱只能影響股票的短期波動，不能影響大勢。但就俗語所言：「好的開始是成功的一半。」一個正確的入場點會使你少傷很多腦筋。以下我們再來談談如何選股票來買。買股的時機固然重要，但買什麼股票也有擁有同樣的份量。\n"
