    # 第1章 炒股的挑戰


    我養過牛，種過地，曾在工廠做過機械工程師，也在報社做過記者，在美國的餐館做過多年跑堂，……在我這麼多的經歷中，沒有一個行業比炒股維生更為艱難。


    股市給人以錢賺錢的機會。對那些胸懷大志者，股市簡直就是一塊福地。然而這個「有經驗的人獲得很多金錢，有金錢的人獲得很多經驗」的地方殺機四伏，想要偶有斬獲雖然不難，要頻頻得手並非易事，而以此維生則更是對自我和人性的挑戰。


    > 如果我要用一句話來解釋為何一般股民敗多勝少，那就是：人性使然！


    說得清楚一點，那就是這些永遠不變的人性——討厭風險、急著發財、自以爲是、趕潮跟風、因循守舊和耿耿報復，這些人性使得股民難以避開股市陷阱。說得簡單些，就是好貪小便宜、吃不得小虧的心態使一般股民幾乎必然地成了輸家。


    ## 第一節 炒股與人性


    俗話說，掙錢只有三個方法：用手，用腦，用錢。


    用手掙的是辛苦錢，用腦掙錢的已算是人上人，真正的掙錢是用錢掙錢。用錢掙錢，聽來多麼吸引人，誰不想用錢掙錢？但用錢掙錢的先決條件是「必須有錢」，其次是你有相關知識可用來錢掙錢。


    股市就提供了這種完美的機會。


    炒股不要求你有很多錢，大有大做，小有小玩。它也不要什麼了不起的學識，非要學謀生的場所。


    我自已的經歷比較複雜。我算是窮苦農家出身，窮人家孩子的生活路，條條都是艱難路！炒股給了窮人家孩子一個相對公平的場所，讓窮人家的孩子可以靠自己的努力謀求發展，在股票市場找到自己的天地，不需要家庭背景。我是中國爲數不多經歷土插隊[註]和洋插隊雙重插隊的人。我養過牛，種過地，曾在工廠做過機械工程師，也在報社做過記者，在美國的餐館做過多年跑堂，也會在大財團擔任投資分析員、銀行的貸款專員。我還拉過人壽保險，也曾是有牌照的地產交易經紀人。在我這麼多的經歷中，沒有一個行業比炒股維生更為艱難。


    **註：** 毛澤東時期中國政府將知識份子下放農村勞動，並稱之爲「土插隊」，後作者至美國餐館跑堂、洗碗，做這些勞力工作，故稱爲「洋插隊」。


    ### 誰能在炒股這一行生存？


    我有十位以上朋友試圖跟我學習專職炒股。他們覺得炒股不必看老闆臉色，不需要定時上下班，不用在辦公室爾虞我詐。想想看，炒股維生或是專職炒股多有吸引力呀！我的那些朋友不是碩士便是博士，智力高超可說是毋庸置疑，可惜的是毫無例外地，他們在這行只生存了幾個月！


    在他們開始學股的初期，我總是將我的所知傾囊相授，因爲這行其實根本沒有祕密，他們可以隨時打電話給我，得到我的幫助。但他們都失敗了，在股票學校交了學費畢不了業。


    我常想這些絕頂聰明的朋友，具有「學什麼會什麼」的天分，但是爲何在這行無法生存呢？


    隨著時間的推移和閱歷的增加，我慢慢感悟到這些聰明人失敗的原因大約有兩個：


    - 炒股的技能太活了

    - 他們太聰明，可以選擇的工作太多。


    炒股是有技術的。二十世紀的美國著名投資專家丹尼爾·朱爾（Daniel Drew）有句名言：「股票市場是有經驗的人獲得很多金錢，有金錢的人獲得很多經驗的地方。」炒股的技術來自於經驗的累積，這一累積過程是艱難且痛苦的，那些懶惰的人，不願動腦的人和只想快速發財的人在這行沒有生存空間。


    和其他行業不同的是，這行的技術不是死的，它靠的是一種「心態」，看不見摸不著的「心態」。


    你只能用心來感悟它。你學習修車，輪胎壞了換輪胎，煞車壞了換煞車，只要熱的時間夠長，你就會成爲修車專家。換輪胎、換煞車都是看得見摸得著的東西，上次是這麼換，下次還一樣。股票可不同了，上次出這個新聞股票升，下次出同樣的新聞股票可能跌。你如何知道股票會升會跌？靠的就是感覺。你必須有「何時股票運動正常，何時股票運動不正常」的感覺。


    可是現實生活中無人能精確地推斷股票的下一步動向。


    無論你研究股票多少年，你唯一可能做到的就是提高預測準確性的機率，但這一點是絕對做不到的；股票雖然只有兩個方向，但它什麼時候？往哪個方向運動？完全無法確定，一般人对任何不確定都充滿恐懼，坦然接受不確定的未來是一種對人性的挑戰。


    ### 人性與經驗


    讓我舉個例子解釋「心態」是什麼東西。廣東有句俗語叫「傻瓜次次不同」，意思是說上當受騙的情形每次都不一樣。我聽過、看過、讀過很多騙人或被騙的故事。騙人的花招往往並不高明，被騙的人也不蠢，但大同小異的故事總是不斷發生。


    我會細細探討過其原因，結果發現上當受騙者往往有一共同的特點：「貪」！想不勞而獲。這個「貪」就是心態。你可以教他很多招式，例如下次碰到什麼情形不要相信等等。


    只要他不改「貪」的心態，他一定會上當受騙，騙子的花招總比他的防招來得多。你要教他「不貪」，你幾時看到過「不貪」的人被騙的？其實「不貪」也是一種心態。


    「貪」是人性，「不貪」是經驗。你不可能叫一個人不貪他就不貪了。他要吃很多虧、上過很多當才會明白，不貪是不再吃虧上當的靈丹妙藥。


    炒股也一樣。你很快就會讀到炒股的最重要原則之一便是——「停損」。但人性是好貪小便宜，不肯吃小虧，只有不斷地因為貪了小便宜卻失去大便宜，不肯吃小虧最終卻吃了大虧，你才能最終學會不貪小便宜，不怕吃小虧。


    可以這麼說，學股的過程就是克服「貪」等與生俱來的人性，養成「不貪」等後天經驗的一連串過程。


    這個學習的過程不像一般人想像得那麼簡單。


    好貪小便宜，不肯吃小虧是心態。不貪小便宜，不怕吃小虧也是心態。要實現這種心態的轉變，你要戰勝自己。戰勝自己可不是件容易的事，這也是聰明人常常學不會炒股的因。他們能夠戰勝自然，但他們往往無法戰勝自己。


    ### 須有破釜沉舟的決心


    我這些受過良好教育的朋友都做了理智的選擇。他們及時放棄了不知明天能不能賺到錢，也不知未來有無可能賺到錢的炒股行業，今天都在有固定收入的行業朝九晚五。他們都是專業人士，他們都在值得尊敬的行業工作。但也是因爲他們有這樣的選擇，也就決定了他們炒股的命運。


    我自己的兩個碩士學位分別在工程和金融領域，這兩個學科的朋友很多。人人都想炒股，但還未看到成功的人出線。所以我只能對這兩大行業的讀者朋友們說：你們可以選擇研究股票維生，也可以選擇教別人如何炒股票維生，想選擇自己炒股維生的話，首先得先三思，你們的選擇太多，所以成功的機會不大。但是你們如果能鐵了心決定戰勝自己，那麼你們遲早能成功。


    我是過來人，這幾年來我一直在華爾街以炒股維生。坦白地說，我之所以能熬過來，實在是因爲不願在洋人的地方看洋老闆的臉色，爲了五斗米折腰。我也不願如一般華僑靠炸雞翅膀維生。


    我熬下來的原因是因爲「沒辦法」。不過回頭想想，真正艱難困苦時期其實很短暫。人有很多缺點，這些缺點的形成有的可說是動物本能，有些是長期生活中培養出來的習價。股市有它自己的特點。在股市中，人的缺點無所遁形。以下讓我們探究一下股市的特點及一般人難以在股市成功的原因。


    ## 第二節 特殊的賭局


    ### 股票充滿誘惑性


    什麼是股票？它代表著上市公司的一份子。


    股票的誕生依賴其所代表的企業資產。但股票一旦出生，脫離了母體，它就有了自己的生命，不再完全依賴母體了。


    一頭母豬現價一百元，把它分成一百份股票出賣，每股應是一元。這是一般小學生都不會算錯的題目，但出現在股市上就會開始走樣了。


    假設將這頭母豬註冊成鳳凰大集團，發行一百股鳳凰大集團的股票，你認為鳳凰大集團的股票每股值多少？如果將這些股票上市，你認為鳳凰大集團的股票會以什麼價錢交易？答案是它既可能以每股一毛錢的價格交易，因為股民會認為母豬會老、會死！但也可能以每股上百元的價位交易，因爲他們也會想像到母豬每半年能生十隻小豬，而小豬長大後又會生小豬，真是財源滾滾，永無止境！


    只耍養這頭母豬的張嫂，也就是鳳凰大集團的張董事長，將鳳凰大集團的公司介紹寫上集團從事的是「飼料購銷、良種培育」之類挑戰性的業務，不要只將集團資產說成一头母豬，另外還要說服股民們相信這頭母豬的生育能力奇強，而張董事長的經營管理能力又非常優秀！如此一來，鳳凰大集團的股票被炒到上千元也不奇怪！到底股價和股票所代表的價值有什麼關係？


    ### 沙丁魚罐頭的故事


    華爾街流傳這樣的故事：兩位炒手交易一罐沙丁魚罐頭，每次交易，一方都以更高的價錢從對方手中買進這罐沙丁魚，不斷交易下來，雙方都賺了少許錢。有一天，其中一位決定打開罐頭看看，瞭解一下爲什麼一罐沙丁魚要賣這麼高的價錢？結果他發現這罐沙丁魚是臭的。他以此指責對方賣假貨。對方回答說：「誰要你打開的？這罐沙丁魚是用來交易的，不是用來吃的！」


    讀者們若有耐心讀完第七章〈抓住大機會〉，就會對股票及股價的特性有更深的瞭解。股票的迷惑性不在於股票的價值，而在於它爲炒股者帶來的幻想。


    ### 你時刻面臨著行動選擇


    股市就像恆久的賭局，它沒有開始，也沒有結束。股票永遠在動，只要有人以比上個交易價格更高的價錢買股票，股票價格就會升一點。相反地，有人願意以更低的價格賣股票，股價就跌一些。上上下下就如同波浪，看不到始，也看不到終。


    到賭場去賭錢，你可以知道何時賭局開始，因為莊家會告訴你該下注了。你也知道賭局何時結束，當全部的牌一翻開，這個賭局就結束了。你很清楚輸多少、贏多少。在股市下注，你直接面對何時進場、何時等待、何時出場的決定。沒有人告訴你進場的時間，也沒有人告訴你離場的時候，所有的決定都要自己做，每個決定都如此艱難，每個決定都沒有規則可循。你不知這一注下去的輸贏，賭注的數額也必須由你決定。


    所有的決定都令人生畏。


    你決定進場了，幸運地你有了利潤，股價升了。你馬上面對一個問題：足夠了嗎？你如何知道股價的波動不會一波高過一波？不幸地，股價跌破你的買價，你也面對一個問題：虧多少錢？更要命的是你不知道它是不是暫時下跌，即將反彈嗎？如果最終有可能得到勝利，為什麼現在要承認失敗？


    在股市這恆久的賭局中，你每時每刻都面對著這些決定。


    更重要的是，在股市上的這些選擇，並不僅僅是腦子一轉，而是必須採取一定的行動才能控制資金的命運。不採取行動，你的賭注永遠都在檯面上。而「行動」二字對懶惰的人來說是多麼令人厭憎的字眼！


    ### 大出所料的損失


    問問你自己喜歡做決定嗎？喜歡獨自爲決定負全部責任嗎？對九九%的人來說，答案是否定的。股市這一恆久的賭局卻要求你每時每刻做理性決定，並且爲決定的結果負責全責！這些就淘汰了一大部分股民，因爲他們沒有辦法長期承擔這樣的心理壓力。


    這一恆久變動的股票市場還有一個致命特點：它能使你虧損較比預期要多得多的錢。如果你什麼都不做，也可能使虧損不斷增加。在賭桌上，每場遊戲你最多失去你下的注。你在下注之前就很清楚你準備失去這個數目。在股市，它把你的下注拿走一些，又給回一些，有時多些，有時少些。你該說如何是好？在過程中，你原先預估最多只虧一百元，但最終可能虧掉五百元。因爲股票這個遊戲沒有終止的時刻，沒有人告訴你遊戲結束了。


    它從不結束，除非股票停盤。


    在賭場裡，每場新的賭局都有新的開始，並且自動結束。基本上，勝負的結果由機率決定。你如果不想輸錢，下一手不下注就可以了。只要你不動，本金就不會減少。


    對坐在賭桌上的賭徒來說，不下注是很困難的。因爲新的賭局就是新的機會。你很少看到賭徒願意錯失新的機會。雖然不入場不容易，出場卻很容易，無論贏或輸，遊戲結束時就自動離場了，你在理智上不需要做任何判斷。


    使股民蒙受超出預期損失的第二個原因，則是吃不得小虧的心理，具體分析見下節：


    ## 第三節 一般股民為何失敗？


    從技術的角度探討一般股民失敗的原因，自然可以歸納出好多條，我這裡僅從人性的角度，用心理分析角度，來看看一般股民為何會宿命般地遭遇失敗的命運？


    ### 炒股不是科學


    炒股有個特別的地方！炒股是藝術，不是科學。科學要求能夠重複，但是股價的變動從不重複，最多只有百分之多少相像！二○○的相像和八○的相像看起來可是兩碼事！


    我自己早年研讀機械工程，剛開始研究股票時自然而然地採取科學方法。浪費很多時間後才明白研究股票採用科學的方法有問題——找不到答案！科學需要能夠重複，不完全重複的東西無法用科學的方法研討。我們從小學習的數學、理化都是科學，我們的思維通常都被科學的思考方法固化了！我們再股市尋找重複，我們認為股市應該重複。


    浪費很長的時間之後才明白，原來股市不完全重複。和股票相關的一些知識，例如：金融分析等等很像科學，一旦試圖應用這些知識之後往往發現難度相當高！很多學校有金融專業，這麼多人靠研究金融或教金融維生，但可有金融學教授靠炒股賺到了錢？理論上，這些金融學教授應該是社會上最富有的一群人，但事實上，這些金融學教授卻僅有少數人能成為股市的成功者。股市的成功者需要金融知識，但金融知識並無法直接在股市轉變成財富。這其中需要轉換成另一種思考模式。


    重新學習一種思考模式，我指的是用哲學和藝術的思考模式，以及應用機率分析，但是要面對股市中的種種不確定並不如想像中容易。


    ### 討厭風險


    紐約有位叫夏普諾（Dr. Shapiro）的心理醫生，他主持兩個著名的實驗。


    **實驗一：**


    參加實驗的人有兩個選擇：選擇一，有七五%的機會可以得到一千美元，但有二五%的機會什麼都得不到；第二，確定可以得到七百美元。


    雖然一再向參加實驗者解釋，從機率上來說，選擇一能得到七百五十美元，可結果還是有八○%的人選擇二。大多數人寧願得到的少一些，也要確保擁有一定的利潤。


    **實驗二：**


    參加實驗的人有兩個選擇：選擇一，有七五％的機會付出一千美元，但有二五％的機會什麼都不付；選擇二，確定付出七百美元。


    結果七五％的人選擇了第一選擇。他們為了搏得二五％什麼都不付的機會，從數字上講多失去了五十美元。


    問問你自己，如果你是參加實驗的一員，你會做什麼樣的選擇？


    股票是一場機率遊戲，無論什麼樣的買賣決定，都沒有 ○○％正確或不正確的答案。


    從以上實驗結果可以得知，人性中避免風險的天性在機率遊戲之中扮演重要的角色。


    因此，股民貪圖眼前小利，買進的股票升了一點，便迫不及待想脫手。這檔股票或許有七五％繼續上升的機會，但為了避免三五％什麼都得不到的可能性，股民寧可少賺些。結果是可能賺五千元利潤的機會，你卻只得到五百元。任何炒過股的人都明白，要用較出場價更高的價位重新入場是多麼困難。股價一天比一天高，你只能當個旁觀者。


    而一旦買進的股票跌了，股民便死皮賴臉地不肯停損，想像出各種各樣的理由說服自己「下跌只是暫時的」。但其實只不過是為了搏得那二五％可能全身而退的機會！結果卻讓小虧慢慢累積成了大虧。


    每次我看到中文「套牢」、「割肉」等英文所沒有的詞彙都要拍案叫絕。發明這些名詞的人真應該得諾貝爾文學獎！這些詞語對那些不肯停損的股民描繪實在太貼切了！假如股票的運動只有上、下兩種走向，所以每次買股的盈虧機會原本各是均等的五〇%的話，對於一般股民來說，由於人性好小便宜、吃不得小虧的心理，使得贏時賺小錢，虧時虧大錢，炒股便成了輸贏機會不均等的一場遊戲了。


    ### 太急着發財


    > 股市沒有擊敗你，是你擊敗了自己。


    我讀過很多投資家的傳記，在他們們成為「專家」之前，往往都有破產的記錄。例如「投機之王」傑西·李弗摩（Jesse Livermore），他便有三次破產的記錄。導致他們破產的心理因素通常只有一個——太急着發財！表現在具體行爲上就是——賭注下得太大！


    我剛開始學股的時候，知道自己什麼都不懂，在炒股上還是比較謹慎的，不敢每手下注太多。一年後覺得自己懂了一點，野心就開始大了一些，每次入市，我開始有個期待：「這支股將改變我的生活方式。」


    讓我解釋一下「改變生活方式」的意思。金錢有個量變到質變的過程。假設你今天手頭多了一萬元，你用錢的標準便會鬆動一些，也許上餐廳多吃兩頓大餐，但你仍將住現在的房子，坐同樣的公車，因爲這一萬元不足以改變你的生活方式。現在假設你手頭多了一百萬元，你可能会買更大的房子，買輛車子及其他以往想要卻沒買的東西。這就是量變到質變的過程。


    野心一旦大了，行動就開始缺少謹慎。首先我每次買股買得太多，其次停損停得太遲。因此遭受了巨大損失。


    因爲這種對改變生活方式的期待，我在市場盡量收集对自己有利的消息，忽略對自己不利的消息。特別是在股價的變化和預期不符合的時候，這樣的欲望更是強烈。


    我常常思考爲何會有這樣的感覺，或許是因爲股票輸贏的不可預測才會導致這樣的心理。如果在賭場，每次下注你都很清楚輸贏是多少？運氣不好，你下的注全沒了，運氣好，你也知道能贏多少，你沒有任何幻想；但在股票市場，你無法預測股票會向某個方向走多遠。股票可能翻一倍，也可能翻十倍。由於這種「賺大錢」的可能，你失去了心理防備。


    帶著「賺大錢」的心理入場，你的注會下得很大。如果不幸開始虧損，要接受「虧很多錢」的現實很困難。隨著一天天增加虧損，你的正常判斷力開始慢慢消失。直到一天你終於無法承受過於巨大的損失，只好斷腕割肉。事情演變至此，你蒙受了一般情況下不會發生的大損失。


    股票市場還有一個很大的陷阱，那就是「融資炒股」。


    融資放大了資金的能量，在順境的時候當然可以增加報酬；但市場不順的時候，融資可

    '
