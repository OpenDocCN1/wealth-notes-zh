    # 第5章


    # 華爾街的家訓


    這幾百年來，炒股這一行的前輩們用他們的經驗寫下一條條的家訓——想在這行生存和成功必須遵循的原則。這些原則百年前適用，百年後也一樣適用，因為人性不會改變。'
  - '[PAGE 155]


    我很早就發現華爾街沒有什麼新東西，也不可能有什麼新東西，因為股票投機歷史悠久，今天在股市發生的一切都在以前發生過，也將在未來不斷地再發生。我進場之前就知道我判斷正確時，我總是會賺到錢。使我犯錯的是我沒有足夠的毅力按照計畫執行……那就是我只在滿足我設定的入場條件時才入場……


    ——傑西·李佛摩


    炒股是老行業。華爾街一百年前流行的是火車股、鋼鐵股，接著流行收音機股、電視機股，今天流行的是電腦股、網路股。每種股票的興起都代表了新的行業和人類文明的進步。


    在這千變萬化的股市歷史萬象中，唯一不變的是股票的運動規律。和百年前甚至更早時期的一輩子一樣，現代人有著同樣的貪婪、恐懼和希望，他們都同樣在虧損時不肯割肉，同樣滿足於小利卻在股票的生市中途退席；當年的股市充滿小道消息，今天的股市還是充滿小道消息；當年有公司做假帳，今天也有公司做假帳。


    華爾街一代新人換舊人，每個人都希望他的存在可以在歷史留下一筆記錄，各種各樣的格言警句如恆河沙粒出現。令我驚奇的是，近半個世紀華爾街已經沒有出現新「家訓」。就算有人提出新規則，但在仔細閱讀過之後發現，只不過是用新文字把老家訓重述而已，內容只是換湯不換藥。'
  md: '

    # 選擇股票的步驟


    在選擇股票之前，你需要首先選擇股票的類別，例如地產股、金融股、電子股等。讓我將這個過程簡化成以下三個步驟：


    第一、什麼是大市的走向？如果大市不好，你最好什麼都別買，安坐不動。我知道對新手而言，讓錢閒著是件極其難受的事，但你必須學習忍耐。就算你看到很吸引人的臨界入場點，也不要輕易有所動作。大環境不適合的時候，你的勝算便降低了。


    第二、哪些類別的股票最具「牛勁」？需要指出，如果兩檔股票的技術圖形相似，例如，同時在充足的交易量之下進入爬坡階段，其中一檔股票屬「牛勁」很足的類別，另一支屬「牛勁」不足的類別，你會發現屬「牛勁」足類別的股票很容易就升了一○○％，而「牛勁」不足類別的股票要很辛苦地才能爬升二○％。


    第三、當你判定股票大市屬於「牛市」，選好「牛勁」最足的類別之後，餘下的工作就是在「牛勁」最足的股類中選擇一兩支「龍頭」股。這些龍頭股可以是該類別的「龍頭老大」，例如香港銀行股中的匯豐銀行；也可以是有特別產品或專利的「特別小弟」。


    如果你做到了以上三個步驟，你就會發現你的資金在勝算最大的時刻投到了勝算最高的股票之中。這時又出現另一個問題，讀者會問：第一、第二點都容易明白，也容易判斷，但第三點如何判斷？在「牛勁」最足的類別股中，如何找出最具有潛力的股票？


    ![](img/af3de47fcb4db801f9d008fb55b44d63_138_0.png)


    ![](img/af3de47fcb4db801f9d008fb55b44d63_138_1.png)


    圖4-8、圖4-9分別代表兩檔股票的走勢圖，這兩檔股票都屬於「牛勁足」的類別股，你現在在選這檔股票，你會選哪支股票？


    假設阻力線的價格一樣是二十元，很多人靠直覺會選圖4-9，因為它從高價跌下來，是「便宜貨」。答案是：錯了，你應該選擇圖4-8的股票。為什麼呢？


    先看圖4-9，很多原先在二十元的阻力線之上入市的股民已被套牢很久，他們終於等到了不虧或稍賺解套的機會，你認為他們現在會怎樣做？他們會趕快跑，快快讓惡夢結束。一般人就是這麼想的，也是這樣做的。再看圖4-8，每位在阻力線之下入市的股民都已有利潤，他們不存在在套牢的問題。你會發現圖4-8股票上升的阻力會比圖4-9要求得小。


    再看下面兩個圖：


    ![](img/af3de47fcb4db801f9d008fb55b44d63_139_0.png)


    ![](img/af3de47fcb4db801f9d008fb55b44d63_139_1.png)


    圖 4-10 在突破阻力線之前的蓄勁期是三个月，圖 4-11 是半年，你要買圖 4-10 或圖 4-11 其中之一，你會選哪種？答案如果是圖 4-11，你就選擇對了。被套牢是極其不愉快的經歷，晚上睡覺時想到這檔股票都睡不好！很多人撐不住乾脆就割肉認賠殺出算了。蓄勁期愈久，那些被套牢還未割肉的投資者就愈少，它上升時的阻力也就愈小。


    # 形成自己的風格模式


    股票買賣是藝術，不是科學，它沒有固定的模式。我希望讀者讀到這裡時已經能感覺到股價變化過程中投資大眾心理波動的脈絡，能明白大衆爲什麼買股票？爲什麼賣股票？心理過程如何變化？你如何從這個過程中受益？股票價格的短期波動很多是大戶操縱的結果，但大戶不能說想升就讓股票升，他們還是要用「買股票」的方式讓股票升漲，這個尾巴無法掩住。


    找個清靜的地方，細細思考一下臨界點是怎樣形成的。你如果無法找到支撐它的心理脈絡，這個臨界點常常靠不住。走進書店，翻開任何一本「股市必勝」、「炒股祕笈」之類的書，你會看到數不清的「高招」。你按照這些高招炒過股嗎？結果如何？如果炒股居然簡單到「二〇天平均線穿越五〇天平均線是買入好點」的話，哪裡還有人起早摸黑去上班？


    # 尋找臨界點的過程就是學習炒股的过程


    只要你用心，你會不斷發現適合你的個性及風險承受力的臨界點。


    用你自己發現的臨界點，按照自己定好的規則買賣進出，訓練自己的耐性，留意市場提供的危險信號，你就走上了學股的正確道路。你很快就會發現，用這樣的方式炒股，你有了極大的自我滿足感，其所得利潤也較其他方法所得更令你覺得喜悅。因爲你不僅賺了錢，也知道了爲什麼能賺到錢，你將有信心按照同樣方法再次賺到錢。


    最後談點我個人的經驗。股票和人一樣，有其特別個性，有些保守、遲緩，有些急躁、不安分。對某些股票來說，我能很容易描摸出其個性，推斷出其運動軌跡。而有些則和我無緣，其運動模式我如何都猜不透。對這些無緣的股票，每次碰到我都被燙傷；就如同交朋友一樣，有些人第一次見面感覺相見恨晚，無話不談，有些人則話不投機半句多。


    我採用的具體做法是，如果我被某檔股票燙了三次，就盡量不再去碰它。把注意力放在比較適合的股票上。


    # 第二節 何時賣股票？


    何時賣股票的考慮可以分成以下兩部分：


    - 一、剛進股時如何選擇停損點？

    - 二、有利潤後如何選擇合適的賣點獲利？


    就第一部分而言，第四章第一節「何時買股票？」已有論述，這裡主要談第二部分。


    # 選擇賣點


    各位讀者應該記住自己在做生意，就如同做服裝生意一樣，一有合理的利潤就賣出。有些投資專家，他們買股票準備永遠持有，這並沒有錯，運氣好的話，三十年可以翻二十倍。但這間會有很多的起伏，有時候股票會有五〇%的跌幅，這對炒股維生的炒手而言實在難以承受。而且你還要有選長期股的眼光和資訊，對一般人而言，要獲得精確的資訊並不是件容易的事。況且，如果股票五年都不動的話？你要靠什麼過生活？


    上述的投資專家通常管理公共資金維生，每月有薪水可拿。對一般的炒手而言，持股的時間通常是從幾個星期至幾個月不等。這個時間沒有硬性規定，只要股票的運動正常，你不應該賣出。一旦有了一定的一定的炒股經驗後就會明白，很少有股票會在「最小阻力線」上運行一年以上。一個大走勢，頭和尾都是很難抓到的，炒手們應學習如何抓中間的一截，能抓到波幅七○%就算是很好的成績了。


    這樣做能預防股票常有的二○%至四○%的回檔可能為你的整體投資帶來大幅震盪。讓提醒股友：不要試圖尋找股票的最高點，你永遠不知道股票會升多高。就我個人的體會，決定「何時賣股票？」比決定「何時買股票？」更為困難，虧的時候你希望打平，賺時想賺更多，內心不斷掙扎。對剛學炒股的新手來講，常有「不賺不賣」的心態，這是極其要不得的，帶有這樣的心態，失敗的命運差不多就註定了。這就是為何我在前面「何時買股票？」一節中特別強調的——選買點的最重要點是選擇停損點。


    要決定何時賣股票，最簡單的方法就是問自己：我願意此時買進這檔股票嗎？如果答案是否定的，你就可以考慮賣掉這檔股票。在實際操作中，問題其實並沒有這麼簡單，因為無論進場還是出場，都有代價。你不應忽略手續費這筆費用，頻繁進出場的結果就是把利潤都捐獻給政府和證券商了。


    和買股票一樣，賣股票的要點也是「臨界點」。若能夠做到僅在臨界買點入場，臨界賣點出場，入場時牢記停損，並且注意分散風險，成功的機率就能提到最高，你也就真正成為了一個真正的炒手。一位炒股專家了。


    # 技術要領


    讓我們複習一下技術分析基礎知識中的幾個賣出臨界點。從這三個圖中，你可以感覺這些賣點是投資大眾對股價重新評估的點。圖4-12、圖4-13 已在第二章第一節「技術分析的基礎知識」詳細解釋。圖4-14的特點是股價穿過平均線，我曾提到


