    經濟復甦期在股價上的表現便是爬坡期。隨著盈利的增加，大衆又開始爭相搶購公司的股票，股價節節升高。


    經濟復甦持續到一定階段，又因競爭和市場飽和等原因產生產品過剩的問題，這時股價就進入疲勞期。疲勞期接著就到了下坡期。下坡期到了一定地步又進入蓄勁期。整個週期過程就是經濟週期在股價上的反映。


    有人認為資本主義經濟週期對社會有負面影響，但計畫經濟也有其本身的缺陷。中國現今發展市場經濟，大家近來看到的肉、蛋、柑橘等生產過剩、價格下跌的現象便是經濟週期其中的一環。


    在蓄勁後期，爬坡初期，如果是開始一個真正的爬坡期，應有交易增加量的現象，股價一舉突破阻力線。一旦進入爬坡期，股票開始升勢，股票波動應'
