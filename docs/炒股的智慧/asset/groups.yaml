    # 前言 我是職業投資人


    我靠炒股維生。


    這是一本寫給有心成為炒股專家的人的書。如果你炒股的目的是業餘消遣的話，這本書並不適合你，因為按照本書所說的去做，你將失去「小賭怡情」的樂趣。


    想成為炒股專家，你需要專心致志、廢寢忘食地學習和實踐。這和成為其他行業專家的要求並無兩樣。想要成功，聰明、努力、經驗和運氣缺一不可。運氣往往偏愛最努力的人，而不是最聰明的人。


    # 這本書不只談股票


    這不是一本股票常識簡介，因為我期待這本書的讀者已具備這方面的基本知識。我還期待讀者有一定的炒股經驗。不把錢押在股市，你就無法體驗到股價升落所帶來的貪婪、恐懼和希望，也就很難明白這本書所提供的炒股規則。


    話說回來，雖然這本書是為炒股所寫，我相信書中闡述的原理適合任何行業。成功的人'
  - '[PAGE 17]


    # 親身的體驗和觀察


    金融是龐大的行業，影響股價波動的因素數之不盡，有關的知識也列之不盡。要寫本炒股的书，如何選材，從什麼角度寫，很不容易決定。我如果也在「著」前加個「編」的話，這一「編」可能會把這本書編到經濟學大辭典那麼厚。我不喜歡太厚本子。這本書寫的都是我的親身體驗和觀察，都是我認為和炒股有最直接關係的知識。我期待讀者每次在炒股中犯


    金購買力的最佳管道。


    股票大市的走向反映了一個國家或地區整體經濟的發展。長期而言，投資股票是保持現金購買力的最佳管道。


    雖然股票業也有大小「鱷魚」，總的來說，這個行業是健康的。


    英雄豪傑都來大展身手。


    有升有跌，由此提供給炒手們賺取差價的機會。由於牽涉的金額數目巨大，自然吸引各路英雄豪傑都來大展身手。


    程中，股東們共同享用成長的果實。但公司經營有好有壞，有盈利有虧損，股價的反應就是有升有跌，由此提供給炒手們賺取差價的機會。由於牽涉的金額數目巨大，自然吸引各路英雄豪傑都來大展身手。


    股票上市是公同把股權的一部分出賣，籌集資金用來擴大生產或其他用途。在公司成長的過程中，股東們共同享用成長的果實。但公司經營有好有壞，有盈利有虧損，股價的反應就是有升有跌，由此提供給炒手們賺取差價的機會。由於牽涉的金額數目巨大，自然吸引各路英雄豪傑都來大展身手。


    必須承認，炒股只能算是金融行業的一個分支。股票上市的目的不是給大家炒股用的。股票上市是公司把股權的一部分出賣，籌集資金用來擴大生產或其他用途。在公司成長的過程中，股東們共同享用成長的果實。但公司經營有好有壞，有盈利有虧損，股價的反應就是有升有跌，由此提供給炒手們賺取差價的機會。由於牽涉的金額數目巨大，自然吸引各路英雄豪傑都來大展身手。


    樣能獲得成功。所以不曾、也不打算炒股的你如果偶然得到了這本小書，不妨一讀。


    士往往具有很多相似的素質，如果你具有炒股成功所需的素質，在其他行業，我相信你也能樣能獲得成功。所以不曾、也不打算炒股的你如果偶然得到了這本小書，不妨一讀。'
  - '[PAGE 18]


    了錯誤以後，或多或少地能在這本書中找到犯錯原因，找到不再犯同樣錯誤的答案。最起碼，知道什麼是錯誤的。


    犯錯並不可怕，可怕的是不知自己犯了錯，知錯卻不肯認錯就更加不可救藥。無論想在什麼行業成功，你需要有成功的欲望，實現這個欲望的知識及應用這些知識的毅力。我將一步一步地告訴你在炒股中做到這些的方法。


    我在美國生活了三十二年，和來自全世界不同種族和文化背景的人打過交道，結識人性共通。我在商學院學的專業是國際金融，研究過世界各地的金融市場，結論是它們的變化規律都一樣。


    你學會了炒股的技能，就真正掌握了走遍天下都不怕的一技之長。


    這本書沒有任何理論和公式，它是我炒股二十多年來的觀察和經驗之總結。其中最近幾年我專職炒股。這本書裡的每條規則，我都沒少付學費，我希望讀者們能因為讀了這本書而少付些代價。


    有些人把炒股當成投資，有些人把炒股當成投機。記得英國銀行家歐內斯特·凱索爾（Sir Ernest Cassel）是這麼說的：「當我年輕時人們稱我是投機客，賺了這些錢後人們稱我是投資專家，之後再敬我是銀行家，今天我被稱為慈善家。但這幾十年來，我從頭到尾做的是同樣的事。」我找到比這更好的解釋「投資」和「投機」的語句。'
