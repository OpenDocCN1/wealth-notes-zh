    # 跟著股市走，別跟朋友走！


    這條規矩的簡單解釋就是：別跟著朋友買或賣，要按市場情況來買賣。我在交易大廳常常聽到：「你今天進了什麼股票？我想跟著你一起進。」


    每次聽完我都覺得好笑，因爲它總讓我想起三個盲人如何一起走路。


    你們留意一下，三個盲人走路，通常是一人在前探路，隨後一列跟著兩位盲人。第一位盲人在前面走，後面跟的兩位盲人省點勁，第一位盲人選的路是否是最佳路線這就不管了，反正大家都看不見。而三位眼睛好的行人往往是排成一行走，你走你的，我走我的，還可以方便聊天，碰到石頭水溝時大家各自知道如何避開。他們也有一列走的時候，那時他們走的路一定最順暢。


    一位真正懂炒股的人通常不願別人跟著買，因爲你可以跟我買，但我要賣的時候你不知道，最終結果可能害了你。而且如果賣股票時還要記著通知你，心理負擔多大？萬一虧錢的話怎麼辦？


    朋友，下點功夫研究股票的運動規律，學著選擇買點和賣點。想跟著朋友買賣不要緊，據據他是什麼材料。喜歡你跟著他的人通常本身是盲人，盲人才喜歡帶路。'
