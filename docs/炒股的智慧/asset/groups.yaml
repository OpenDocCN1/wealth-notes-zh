    # 如何培養正確的心態？


    一位成功的炒手，必須具有正確的心態。你已明白必須建立規則，按照規則執行你的炒股計畫。你知道必須相信自己，要獨立思考，要自我督促，這些都是要努力控制自己並強迫自己去做的東西。只有在實踐中不斷重複，直到這些要求成爲你的自然反應，成爲你的直覺，你才有正確心態，這時你才真正學會了炒股。


