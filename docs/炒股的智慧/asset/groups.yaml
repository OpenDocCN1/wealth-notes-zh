    # 第二節技術分析的基本知識


    簡單地說，技術分析就是看圖。


    技術分析探討股票價格、交易量和時間的相互關係，以此判定股票下一步運動的可能方向。技術分析的目的是確定股票的走勢以及走勢的轉變。炒手們根據技術分析提供的信號，買進賣出以賺取差價。


    由於人性相近，在相同的外部條件下，人們通常有相近的反應。這一切都會在圖中表現出來。炒手們可以通過研究過去股價運動的規律來推測未來的走向。技術分析的心理基礎是建立在「人性相近」這一假設之上。這個假設成立，但並不完美。人是極其複雜的，股價變動雖然反映了投資大衆集體思想和行動的結果，但它不可能完全地重複。'
