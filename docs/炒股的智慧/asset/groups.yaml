    任何一個，都有買賣方和賣方。你買的股票都是某人賣給你的。交易提供了一個交易合。只要兩位股票參與者在定的價格上，一位願，一位願，他們的交易就完成了。價格就這樣確定。以你的想來無論們多麼無知、多麼愚蠢，們在個價交易交易，不實争。你許為股不值個，就是有人以個價買了股票


    你足資金，壓股市所有你意不合的，你可以自己的意安股


    能蒙受超自身承受力的失。然而發大的心入市，少人能抵誘；資上升沒限，融賺的額報酬擁有極的吸引力，讓人不能；說贏家收根本不可能，只會越越大！最後很能在融桿下，連帶加快還給市。


