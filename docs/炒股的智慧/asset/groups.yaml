  - '[PAGE 109]


    五美元的標準下注，兩千美元夠耗上兩天，賭場包你吃住，就當作度一次假也不錯。然而這些賭客賺錢的心太急，恨不得立即賺得十萬、八萬的，因此每注下得太大，最終結果也就可想而知。


    現在你應該明白在股市不斷賺錢的祕訣了：透過自己的觀察和研究，不斷累積經驗，將自己每次入場獲勝的機率從五○％提高到六○％，甚至七○％；而且每次進場不要下注太大，應該只是本金的小部分。這樣長期下來，你就能「久賭必贏」。


    數學的道理很容易明白，每次下注應占本金總額的多少，決定於你的經驗及對風險的承受能力，沒有絕對的百分比。你要記住「財不入急門」。我這裡給個建議：新手的話，把本金分成六至八份，每次下其中一份。有了經驗，慢慢地把份數減少。你如果有六○％的勝算，下注的數額應該比你有八○％的勝算時更少。至於你如何知道有六○％的勝算或八○％的勝算？這就完全決定於自己的經驗。下注的數額和下注的時機也有密切的關係，怎樣選擇下注的時機將在第四章第一節「何時買股票？」另行講述，希望讀者們可以互相參照閱讀。


    # 抓住正常運動中的股票


    要完美地描述何時股票的運動正常極其困難。股票從來不按固定模式運動，就像你要完美地描述人的性格一樣，你很難做到百分之百。這是一門藝術，不是科學。'
  - '[PAGE 110]


    人在什麼時候會生氣？什麼時候會高興？因人而異，但大體上說，受到讚揚時會高興，被指責時會生氣；股票也是一樣，被追捧時會升，被拋售時會跌，期間可能受一定程度的大戶操作而改變升跌的形態，但總體趨勢不會改變。經典的道氏理論特別強調了這一點。股票從來不會恆定不動，它有時活躍，有時安靜，要嘛上升一點，要嘛下跌一點，在一個固定的區間波動，一旦股票開始一個新的走勢，它通常循著一條比較固定的路徑運行。華爾街將這條線稱為「最小阻力線」（line
    of least resistance）。也就是說股票在這條線上行走時所受到的阻力最少。


    如果股票開始上升走勢，例如，正準備從二十元升到五十元。你將會發現走勢開始的前幾天，交易量突然增加，股價開始攀升；幾天以後，升勢停止，開始下跌。這是「正常」的獲利回吐，下跌時的交易量較上升時顯著減少。讀者們，這個下調很正常，屬於正常運動，千萬不要在此時賣掉股票。如果這檔股票具有上衝的潛力，你會發現在幾天內股票又開始活躍，交易量又開始增加，上次「自然調低」所失去的「領土」應在短時間內收復，股票開始衝到新的高度。這次運動將持續一段時間，其間每日通常是收盤價高過開盤價，偶爾收盤價低過開盤價，其差額通常不大；交易量也不會有顯著的變化，通常情況是減少。或遲或早，股票又會開始下跌，這是新一輪的「獲利回吐」。


    這次獲利回吐的股票運動和交易量的特點應該和第一次很相似。上述是股票走升勢時的'
  - '[PAGE 111]


    正常運動。圖3-1顯示出它們應有的特點。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_111_0.png)


    如果讀者覺得還很抽象的話，以下用數字來描述一遍，因爲掌握股票正常運動的特點對炒股成功是極其重要的。在股票二十元時，交易量增加，可以是平時的一、兩倍，股價從二十元升到二十一元、二十二元，甚至二十七元。這幾天的交易量較前段時間顯著增加是其特徵。到二十七元時升勢可能停頓，隨之開始下調，股價走勢爲二十七→二十六→二十四元。這段時間的交易量應較從二十元升到二十七元時的平均交易量爲少，即股票從二十→二十元時買盤大過賣盤，從二十七→二十四元時的賣盤大過買盤。但這如果是正常的升勢，從二十→二十七→二十四這段時間總的買盤大過賣盤。在二十四元徘徊幾天後，股票應重新開始上升，交易量又開始增加，這次上衝應該很快超過二十七元，股價走勢爲二十四→二十五→二十六→二十七→三十五元。當股票衝到三十五元時，又開始停頓，隨之下調，重複第一階段的運動。'
  - '[PAGE 112]


    這次下調同樣應有交易量減少的特點。


    一支正常運作的股票，每次上衝的強度通常較上一次更為猛烈。以我們這個例子，當股票再次衝破三十五元時，應很容易地直衝到四十五元或五十元，其間並不會感到很大的障礙。回檔是正常的。一位專業炒手絕不能在正常回檔的時候被嚇出場。入場後開始有利潤了，每次回檔都意味著紙上利潤的減少，一般人的第一感覺就是趕快賣掉獲利，這是新手的顯著特點。這也是為何新手很難在股市賺到大錢的原因。


    炒手的任務不僅確認何時股票運動正常，同樣重要的是要能認識股票何時運動不正常。股票這種前進兩步、退後一步的過程可能延續一段時間，有時可能是很長一段時間。這段時間炒手或許會精神鬆懈，這是十分重要的狀況。因為往往可能在你鬆懈下來時，股票運動產生變化。股票緩緩地週期性上升，突然有一天，股票狂漲！從五十元一下子升到五十五元，第二天升到六十二元，這兩天交易量突然大增，但在第二天收盤前的半小時股票從六十元跌回五十八元收盤。第三天開盤一樣強勁，股票一下子升到六十四元，但第四天，股票似乎失去了衝勁，它跌回六十一元（如圖3-2）。


    # 注意危險信號


    前述例子中，第四天股價跌回到六十一元，這是極其明確的危險信號，它告訴你：小心'
  - '[PAGE 113]


    ![](img/af3de47fcb4db801f9d008fb55b44d63_113_0.png)


    了，危險！


    在股票緩慢的上升過程中，它自然地升，自然地跌，突然某天大起大落，這是在正常上升過程中爲曾發生過的事。一旦有不正常現象出現，炒手們必須特別留意。这时的正常做法就是將股票脫手。


    我是這樣理解這一現象的：


    股票運動後面的主要力量是大戶，這些大戶通常是手握鉅資的基金或保險公司等。當這些基金的管理人看好這檔股票，開始吸納它時，你將因此看到交易量上升，股價上升。通常這些基金管理人在吸納股票時，並不希望引起大衆注意，所以這一過程通常是緩慢的，它不會上報紙或電視的頭條。


    一旦這些大戶吸股完畢，你通常會聽到他們開始公開地推薦這些股票，引起大衆的注意。這些大戶們的資訊通常比普通人靈通，他們也會很快看到公司有好消息公布，例如開發成功新產品，盈利比預期的'
  - '[PAGE 114]


    更好等等。等到這些大戶覺得好消息已全部反映在股價之中，他們便開始準備脫手。由於他們手中握有的股票數量通常很大，如果一下子砸進市場，市場根本承受不了，他們手中的股票很大一部分只能在低價出手。為了解決這一問題，他們就要找傻瓜用高價來承接這些股票。找傻瓜的最佳途徑就是令股價暴升，暴升時通常伴隨著好消息，例如：公司任命新董事長了、某證券商強力推薦該股票等等。報紙電視整天都在重複這些消息，引發小股民蜂擁入市。


    想想看，小股民因股價暴升而引發貪念入市時買的股票都是誰賣的？一旦大戶找到足夠的傻瓜，便能全身而退，哪裡還去找大買主把股價繼續推高？


    你現在明白了股票的正常運動及危險信號後面的理由了嗎？我一直強調，炒股是藝術，不是科學。當不正常的信號燈亮起時，是否表示這檔股票就一定要下跌？答案是：「否！」沒有人能以任何時候百分之百地肯定股票明天會變得如何，也許暴升的理由是公司真的發現了長生不老藥！你必須將股票的運動和公司的發展綜合考慮。讓我再重複一次：炒股的基本信條是：在任何時候，你手上持有股票的上升潛力必須大過下跌的可能，否則你就應該留在手裡。看到危險信號，表示此時你的獲勝機率已經低於五○%了。


    每位嚴肅的炒手都必須注意危險信號，但問題是在內心深處總有些奇怪的力量使他們在'
