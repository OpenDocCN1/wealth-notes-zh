    # 圖 4-15


    平均線是股價走勢的標誌，一旦股價穿過平均線，你有理由提問：這個走勢會繼續嗎？是不是結束的時候了呢？


    這些賣點都不是死的，隨著經驗的增加，你或許會把圖 4-12 的賣點改成圖 4-15。你把賣點移到第二個波峰附近，如果股價再次穿越阻力線，你就再買入。圖 4-12
    和圖 4-15 的優劣一目了然。這樣你的資金總是在盈利機會最大的時候留在場內。


    我希望股友們明白，這本書講究的是思考方式。臨界賣出點並非只有這幾個。你要在實踐中自己去找臨界賣出點。如同在第四章第一節「何時買股票？」中所言：尋找臨界點的過程便是學習炒股的過程。這裡講的幾個典型臨界點，都可以在實際操作中修正、改動，你要自己用心去體會。中心點就是只有在盈利機會大過虧損機會時才讓資金留在場內。


    以下讓我小結一下何時及如何賣股票：'
  - '[PAGE 145]


    # 一、注意危險信號


    隨著經驗的增加，你會慢慢地產生「這是該賣的時候了」的感覺。不要忽略這樣的直覺，這是經驗。要獲得這樣的經驗，你已付出很多學費。相信自己。


    # 二、保本第一


    任何情況下，股價超出你的入貨點，你應該考慮在你的進價之上定個停損點。賺錢的先決條件便是不虧錢。十元進的股票升到十二元，應把賣點定在十元之上，例如十一元。


    # 三、虧小錢


    把停損點定在一○%或更小，在任何情況下都不要超出二○%。只要條件允許，愈小愈好！條件允許可以這樣理解：五元的股票，一○%只有○·五元，五○元的股票，一○%有五元。對五元的股票，你可以給○·七五元的浮動空間，把停損點定在四·二五元。對五十元的股票，你可以給三元的空間，把停損點定在四十七元。我自己喜歡把停損點定在入市當天的最低點。例如我今天以一·七五元買進股票，今天的最高價是十一元，最低價是十元，我便以十元作為停損點。以我的經驗來說，如果我的入場點選的正確，股票開始上升，它不應該跌回我當天入場的最低點。'
  - '[PAGE 146]


    # 四、遇有暴利，拿了再說


    在股市投資，你有時會碰到圖4-16表示的情況。股價在兩星期內從二十元升到四十元。在這樣的情況下，第一天轉頭（轉頭表示收盤低於開盤）你就可以把股票賣掉。但是期望待好事情會持續長久。這樣的暴升常是股價短期到頂的信號，特別是最後兩天，交易量猛增，公司並沒有特別的好消息。


    ![](img/af3de47fcb4db801f9d008fb55b44d63_146_0.png)


    這是危險信號，它在說：我在吸引最後的傻瓜入場，當最後的傻瓜上鉤之後，我就要回頭了。這種短期狂升但沒有驚人好消息的股票跌起來一樣快。這是大戶吸引傻瓜的常用手法。


    # 五、小心交易量猛增，股價卻不升


    見圖4-17。股價升了一段時間之後，如果你忽然發現股票的交易量很大，股價卻沒有升高。這也是危險信號，它告訴有人趁這個機會出貨。這通常是股票到頂的信號，起碼短期內如此。'
  - '[PAGE 147]


    # 六、用移動停損點賣股票


    見圖 4-18。買入後，如果股票開始正常升勢，它應有一浪高過一浪的特點。你可以將停損點放在每個波浪的浪底，隨著波浪往上翻，你將賣點由 A→B→C→D→E 往上移。這樣就


    ![](img/af3de47fcb4db801f9d008fb55b44d63_147_0.png)


    ![](img/af3de47fcb4db801f9d008fb55b44d63_147_1.png)'
  - '[PAGE 148]


    能保證你不會在升勢時過早離場。同時這樣做很簡單，情緒上的波動很小。你抓不到這個升勢的頭尾，但你能抓住中間的大部分。


    用移動停損來買股票是很有效的方法。這是一般並非專職炒股人的最常用方法。在實際股票運動中，波浪不會如圖這麼規則，但原理就是這樣。它提供了一個原則，遵照這一原則，你不會情緒化地過早離場，導致一個一萬元的賺錢機會只賺到二千元。


    華爾街將炒股的訣竅歸納成一句話：「截短虧損，讓利潤奔跑！」英文叫做「Cut loss short, Let profit run」意思是：一見股票情況不對，即刻停損，把它縮得越短越好！一旦有了利潤，就必須讓利潤奔跑，從小利潤跑成大利潤。


    請再讀一遍「何時買股票？」、「何時賣股票？」這兩節，再體會一下「截短虧損，讓利潤奔跑！」這句話，炒股的訣竅盡在其中。


    # 第三節 定位好方法，持之以恆


    以上介紹了何時買賣股票的技巧及其思考的方式。總結來說，可以順勢交易，可以回檔搶反彈，可以炒高低，也可以跌勢抄底。方法沒有對錯，能夠賺錢的方法就是好方法。但是'
  - '[PAGE 149]


    在實際操作中，你無法所有方法同時運用，你只能選擇一到兩種適合自己的方法。因爲每種方法只能運用在特定市場，例如升勢只好用買入順勢的方法操作，你選擇抄底買低的方法在升勢情況是賺不到錢的。但是你又不知道下一波的市場運動屬於什麼類型的市場，並沒有一招打遍天下無敵手的方法。


    股市曾流行過這樣的說法：「做趨勢的人多數死在震盪裡；做盤整的人多數死在趨勢裡；做短線的人多數死在暴拉＠裡；有方法的人多數死在執行裡；靠主觀的人多數死在感覺裡；沒方法的人多數死在亂做裡。」


    這些說法不嚴謹，但具體地描繪了股市新手在學股過程中碰到的困難。股市走向通常可以大分爲升勢，跌勢和震盪市；它們常常交叉進行。新手可能是在升勢的時候學習了一套方法，一實施就虧錢，因爲股市變跌勢了！他開始修改方法，再實施，又虧錢，因爲這時候是震盪市，再修改，實施時發現適合震盪市的方法還不賺錢！因爲市場又變成升勢了。幾個迴圈下來，一位學股人就被淘汰掉了。


    股價雖然只有升跌兩條路，但有可能走出不同的大小波浪，也有可能橫盤上很長時間不動。這給股票炒手提出了一個很嚴肅的課題：我應該在什麼時候用什麼方法操作？


    因爲「什麼時候」充滿變數，所以「什麼方法」從理論上也同樣充滿變數。這也就是爲什麼炒股賺錢難的原因！很多新手一入場買股就賺了幾個錢，那是因爲正好碰到升勢；市場'
  - '[PAGE 150]


    一轉成跌勢這些賺的錢通常是留不住的！只有具備了足夠的知識和經驗才知道如何應付，才可能將賺的錢留下來。


    那麼應付的方法是什麼呢？回答就是這節的標題：「定位好方法，持之以恆！」


    人本身是千差萬別的；有些急急躁躁，有些悠悠哉哉。沒有好壞，只有個性不同。


    在股市，讓急急躁躁的人做長線很難，實在等不了；讓悠悠哉哉的人炒短線也做不了，對他們而言太過緊張了！


    自己屬於什麼種類自己最清楚！那麼選擇方法的時候就有了依據。個性急，就不要選做長線，可以做短炒；個性悠哉，就別專注短炒，想想如何長線操作。這章節買賣股票操作示意圖沒有標注時間：若用分鐘為一格，就是短炒；用小時為一格，就變成中短炒；用每日為一格，算中長炒；用每週格的話，就是長炒了。圖還是這些，標註不同的時間段，可以滿足不同的操作風格。如果你認為做長線升勢是合適自己的方法，那麼就要持之以恆。你心中明白，這種方法在跌勢和震盪市是賺不到錢的，在出現跌勢和震盪市時就應該減少入市深度或離市；你不試圖猜測下一個走勢是什麼。股市總是迴圈反覆的，長線升勢又出現的時候將全


    ① 暴拉可以指的是「拉高」和「拉低」，所以買空和賣空都有可能踩地雷。'
  - '[PAGE 151]


    力入市。


    很多人試圖預測下一個走勢是什麼，這種嘗試基本上徒勞無功；沒有人知道下一個走勢會是如何！


    或許你很有經驗，預測的正確率可能會提升一些，但長期都維持一○○%不太可能。走勢通常只有走出來後才知道原來過去的是什麼勢，你應該用負面的眼光去看待那些聲稱有這個能力的人。


    若你覺得自己擅長短炒賺差價，記得到獲利點就平倉，別有了點利潤就「讓利潤奔跑」這句話影響你的操作，該賣的時候別遲疑。


    新股民碰到的第一個困難課題就是，到底哪種方法適合自己？不同方法的界定其實很模糊。炒股是藝術，藝術本身就很難用語言明確定義。炒股就是這樣！


    有個說法叫「一萬小時法則」，那就是如果你在某個行業花了一萬個小時，你將成為專家。若你在股市實實在在花上一萬個小時，那麼哪一種方法對你而言應該就不再是問題。尚未達到這個境界之前，就只好慢慢熬。


    還有個非常重要的思考方式需要再解釋，第二章提到了炒股應該「順勢而行」而非「測勢而行」。會買股票就是分析預測股價未來會升才有的動作，賣股票也是分析之後認爲股價未來會跌之後才賣股。這難道不是「測勢而行」？'
  - '[PAGE 152]


    在具體實施時，當然會在預測後才入股；但如果並未預測股價升時就買股，那就是腦殼壞了！那麼為何「停損」呢？因為實際情況和預測不符。所以在實際操作時便是「測勢」入市，若是股價如你預測，你便「順勢」而行，走的愈遠愈好，否則就要停損或止贏出局。


    一旦手中持有股票，原先的預測就應該有個應對計畫，情況變化時如何加碼？加多少碼？情況不對時如何減磅？至出局還是局部減磅？


    坦白說，炒股並不是簡單地升了就買，跌了就賣，炒股是系統工程。在第四節「炒股是系統工程」將會有詳細說明。


    # 第四節 炒股是系統工程


    以上介紹了何時買股票？何時賣股票？我們也介紹如何定位好合適自己的方法並且持之。以恆。這個學習的過程很漫長，可能一個經濟週期都不夠用，還需要第二次反覆驗證才能夠真正明白。


    何時買股票其實只是炒股的一部分，承擔多少風險？如何資產配置？等等都是炒股需要考慮到的議題。以工程建設為例，修築鐵路並非僅是簡單地知道如何將鐵軌鋪上枕木就可'
  - '[PAGE 153]


    行，可能需要修橋過河，要挖洞穿山。修橋會碰到修橋的問題，穿山有穿山的難處，這些都是修鐵路系統工程一部分。


    股票系統工程包括股票上碰上大跌如何辦別？遇上長期的窄幅震盪如何辦別？大市長期低迷如何辦別？如何分散風險？如何配置資產？這一切都需要知識和經驗處理，需要長時間實踐才能得心應手地應付。想從股市不斷賺到錢並留下來，必須讓自己在各方面都成為有經驗的行家，這個系統工程還包括如何升級自己。一開始當然先學習，但一旦超出自己爲自己管錢的層次時就必須考慮大眾理財的各個層面；自己爲自己理財可以當做風險，但通常爲大眾理財則必須尽可能地低風險操作。


    前面強調「敗而不倒」，這是做生意的最高原則，也是炒股的最高原則。所以操作炒股需要爲自己設定底線，那就是不要隨便讓自己被剝光頭。


    無論是什麼時候，只要是輸光了那就結束了……'
