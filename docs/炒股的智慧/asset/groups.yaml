    ## 股市特色与崩盘

    股市，這裡的情況和你們不一樣，我們有自己的特色，政府不會讓股市崩盤。


    有八位自稱為「輕騎兵」的年輕人共開了五百五十億美元的空頭遠期兌現支票。其中一位叫佳欣·木太華（Jassim al-Mutawa）的郵局職員，才二十幾歲，一個人就開了一百四十億美元支票。他的弟弟拉吉·木太華（Najeeb
    al-Mutawa）從不登記開出多少支票，最後發現他的空頭數目達三十四億美元。


    氣球終於在一九八二年脹到頂，刺穿氣球的針頭有三支：第一支，是由於石油價格的下跌，科威特一九八二年的石油收入只有一九八○年的四分之一。第二支，是新的財政部長表明政府不可能繼續支持這病態的股價。第三支，終於在一九八二年八月二十日，一位志忘不安的佳欣·木太華的支票持有人在支票兌現期之前要求付款。雖然這不合習俗，但完全合法。結果不難想像，佳欣根本就沒有這個錢。氣球即刻爆炸，幾天之內，千百位投機客在空頭支票面前舉手投降，股市崩潰。上述「海灣醫學中心」的股價跌了九八％，只剩發行價的六分之一。九月，科威特財政部要求所有這類可疑支票全部清帳，總數達九百億美元，遠超科威特的全部外匯儲備。


    ## 中國的「瘋」故事


    佛羅里達的地產瘋有沒有讓大家想起中國的地產瘋？一九八八年二月我在中國福州時，看到路邊盡是一幢幢空空的大樓，電視報導說中國的现房供應過剩要花十五年才能吸收。我不知道十五年是否太長？就算五年吧！如果這些地產開發商不是用國家資本，有幾位能撑上五年？可惜這些地產商據說大多是用國家資本，虧了算國家的。眞讓我難過！這些可是老百姓的血汗錢。


    更早幾年，我在美國讀到有關中國郵票瘋的報導。一張毛主席和林彪在天安門城樓檢閱紅衛兵的郵票被炒到四千元人民幣。清朝的大龍郵票被炒到上百萬我不奇怪，因爲全世界僅存一枚。而毛主席和林彪檢閱紅衛兵的郵票我自已都用過，那是「文革」期間最常用到的郵票之一，四千元是當年普通職工一年以上的薪水。如果不是期待比你更傻的傻瓜會用比四千元更高的價錢讓你脫套，你還會會買這張郵票嗎？爲什麼不去箱子底下找舊信封，或許你會找到好幾張這樣的郵票。


    與上述故事類似的瘋案每天都有，只是大小程度不同罷了。讀者們或許要問：這類的故事很刺激，也很有趣，吃飽飯後聊大天是好材料，但是和炒股有什麼關係呢？如果你讀到這裡，想像不出這些故事的涵意，你還要多多多培養自己的悟性。但若你聞到了銅腥味，那你在炒股行大有潛力。


    每個故事，都是氣球從吹脹到脹破的過程，時間可能是幾個月，也可能是幾年，但所有的气球都一樣。氣球吹脹的初期，氣球後面一定有一個動人的故事，提供給人們無窮的想像。發財的希望，促使投資大眾開始投入。如果是股票，表現就是成交量增加，股票價格升高。隨著股價的升高，它吸引更多人的注意。有些人忍不住了，將升值股票脫手獲利，另一些股民乘回檔入市。每一個更高的波浪都帶動更多的貪婪心理，吸引更多的股民加入。股票將節節升高，這就形成了所謂的「升勢」。在氣球破碎之前，通常是瘋狂到極點的時候，股票可能在幾天內暴漲一倍甚至更多，股友開始盲目入貨。生怕明天的狂升失去自己的一份。


    第二章 第二節「股票的正常運動」那一小段便描述了全過程。細細品味一下氣球從吹脹到脹破的過程及其間民眾的心理過程，你會對如何炒股會有全新的認識。


    ### 「瘋」的特性


    以下讓我們總結一下「瘋」的特性：


    - 一、可信的想法、概念或產品，能提供快速的增長，帶來鉅額的財富。

    - 二、社會熱錢甚多，或通過某些方式「創造」出熱錢。一旦這些資金集中在某個領域，必定帶來滾雪球效應。

    - 三、這個想法必須具備既簡單又複雜的特性。簡單到普通民眾能覺得是個好主意，但必須複雜到很難用事實證明其對錯。否則氣球吹不起來。

    - 四、有人賺到錢！沒有什麼比輕鬆和快速來錢更能吸引普通民眾的了，它傳染的速度遠超過瘟疫。

    - 五、氣球脹到一定程度，有「專家」背書，這氣球會繼續脹，這些「專家」通常是偶像人物，代表智慧、權威、信賴。民眾相信自己是在模仿成功人士。

    - 六、氣球脹大的時間比常人想像得更久。最初指出氣球會破的人隨著氣球的不斷脹大而被嘲笑。


    給讀者一個作業，把上述的三個故事用「瘋的六大特性」總結一下。


    讓我們分析一下一九九〇年代初期中國的股瘋。


    一九九〇年代初期，中國經歷了第一次股瘋，股票漲了幾十倍。深發展面值一元的股票被炒到八十多元。豫園商場一百元面值的股票，一九九二年五月漲到一萬零五百元。今天回頭看來，我們感嘆股市的神祕莫測，其實它也一樣有跡可循：


    - 一、股票對中國老百姓來說是新概念。

    - 二、社會的熱錢很多，很多人是用國家資本炒股。當時熱錢也沒有什麼宣洩的管道，形成「十億人民九億股」的局面。

    - 三、股票這玩意兒既簡單又複雜。一般老百姓都知道股票，但股票真正是什麼東西？它有什麼規律？知道的人大概就不多了。

    - 四、有人賺到錢。當初剛開始發行股票時，大家都有疑慮。常是官員動員大家「支持祖國的股票事業」。一旦民眾聽到五千元變成五萬元的故事，股市開始沸騰。

    - 五、人人都說股票不會跌，因為國家會支援，中國的國情和他國有別，街頭巷尾的「炒股專家」都認為股票會不斷升。

    - 六、最初認為股市「瘋」了的人被嘲笑為沒膽量、傻瓜。


    幾年前的地產「瘋」也有類似特性，請讀者們自己歸納一下。下一個「瘋」是什麼？誰也不知道。但我可以肯定它一定還具備同樣的特性。


    若從歷史回顧，每一個瘋故事通常都有特別的历史背景，代表了一個特別的历史階段；做為股票炒手，我們不需要在歷史問題上糾纏，但認識是否大時代的能力還是需要的。


    舉個例子：如果你生活在十九三○年代的中國，時代的召喚是打破舊世界，開創新世界。那是個從軍的時代。你若跟隨毛澤東上井冈山，你當對兵了，你有機會成為開國功臣。在股票術語來說就是你買對了原始股。


    你若生活在一九九〇年代的美國，那是網路興起的年代，那是資訊社會興起的年代，你投資網路公司就是加入大時代；成爲其一員，你有可能獲得鉅額的報酬。有些老式的投資人例如華倫·巴菲特堅持不投資不懂的東西，那也是一種選擇，就像大革命時代留在老家種地也是一種選擇；但我們看到的是華倫·巴菲特在股票投資上失去了一些大機會。


    ## 「瘋」故事新編


    讓我編一個「長生不老瘋」的故事。


    二〇五〇年，永生集團趙主席宣布，透過多年研究他們發明了返老還童藥「一靈散」。據研究所的錢教授通過科學鑑定，「一靈散」具有某種什麼素，可以和人體的什麼酸發生反應，去除細胞的什麼基。這個基導致了人體細胞的老化。隨著這種基的不斷減少，細胞將可以愈變愈年輕。


    剛開始老百姓都覺得好笑：「又來了一位賣假藥的！」但很快永生集團又宣布美國的孫博士通過高分子實驗，證實了這個科學過程。同時，趙主席宣布此藥已開始申請美國專利。在公司公佈的資料中，有幾十位服用過「一靈散」的人現身說法：自從服了該藥，他們皺紋減少，皮膚彈性增加，體質明顯變好。以前走路困難的九十老翁，今天已能慢跑，並且有照片為證。栩栩如生廣告鋪天蓋地而來。


    反正藥並不貴，開始有人試試，味道也不錯，公司的業績開始上升。據公司公布的財務資料顯示，「一靈散」的銷售額已每季度五○○○%的速度上升。永生集團的股票開始活躍。


    一年後，永生股票的價格已從每股一元升到八元。這時報紙上登出趙主席和已退休的李副委員長合照的相片，還附有前李副委員長的現身說法：自從服了「一靈散」，體力大增，精力旺盛。持有同樣說法及有照片為證的有著名的周影星、吳大導演、鄭歌唱家、王院士，他們都是人所共知的知名人物。股票在一星期內由八元升到十五元。這時「一靈散」成為大家談論的焦點。炒股票的人不擁有永生股簡直就被認為跟不上潮流。「一靈散」成為送禮佳品。永生股票升到三十元。


    兩個月後趙主席宣布：歐、美、日本已開始考慮給「一靈散」專利，永生集團準備在全世界開設分公司，將「一靈散」這一將造福人類的發明推向全球。永生股票狂升到八十元。雖有報導說趙主席不斷將自己的股票脫手，但他說是為「一靈散」走向全球準備資金。著名的股票評論家古博士在電視上發表看法：永生股票有升值到一千元的潛力，他看好後市。這時人人都爭當永生集團的股東，股價升到兩百元。


    看到永生集團的「一靈散」有如此的吸引力，永進集團宣佈推出「三味膏」。它通過七位生物化學教授多年研究，具有減緩細胞衰老的功能。永進集團股價暴升。永發集團宣布推出能提高效率、增強記憶的「三仙素」。電視裡有林同學爲證。林同學考了三年大學都沒考上，自從用了「三仙素」一考就中，現在正於交通大學就讀。永發集團的股價大漲！


    有一天，食品藥品檢驗局突然宣布「一靈散」的專利暫不批准，需要更多的科學證據。這時永生股票已升到四百元，消息見報當天，股價從四百元跌到三百元！但趙主席隨即宣布：公司已準備提供新的材料給檢驗局，這些材料將準確無誤地證實了「一靈散」的功效。股價從三百元升回三百二十元。


    又過了一個星期，永生集團的黃技術員在報上指出，「一靈散」根本就沒有可靠的實驗資料，那些科學根據只是廣告宣傳。趙主席隨即指控黃技術員是因要求加薪未遂，肆意誣告。但大家心中開始懷疑，永生股票跌到一百五十元。


    又過了三天食品藥品檢驗局正式通知「一靈散」科學證據不足，不允許作爲藥品宣傳出售。永生股票狂跌到十元。永進、永發的股票也都跌到歷史最低點。一星期後，永生股票被停牌，公安局以欺詐罪拘捕趙主席……


    不要以爲同樣的故事不會發生在現實生活中。這個故事的原型脫胎自一九三〇年代上海灘名人黃楚九及他的傑作「艾羅補腦汁」。黃楚九原是默默無名的中醫，他用幾味中藥製造出糖漿，利用當時國人的崇洋媚外心理，請了位洋流氓混掛牌照相，說是艾羅博士的發明，功能補腦提神。幾年之間，靠他一流的推銷手法，居然使「艾羅補腦汁」風行大江南北。他自已也就從窮小子升格為「慈善家」。老一輩的上海人應該都熟悉他的故事。


    做為股票炒手，我們無從追究一靈散的真假，或許是眞的也說不定，重要的是怎樣炒永生集團的股票。當股票從五元﹁十元﹁二十元時，股票的價格和交易量應有什麼樣的特點？當股票從四百元跌到三百元時提供給炒手們什麼信號？請複習一下第三章第二節「抓住正常運動中的股票」那一段。如果你能在二十元入股，三百元時離場，那你已經基本掌握了炒股的藝術。


    如果重複也是教育其一中的話，讓我們重複一下喬治．索羅斯賺錢的祕訣做為這一章的結尾：「經濟史是一部基於假像和謊言的連續劇，經濟史的演繹從不基於真實的劇本，但它鋪平了累積鉅額財富的道路。做法就是認清其假象，投入其中，在假象被大眾認識之前退出遊戲。」


    ## 第 7 章 抓住大機會


    直到有一天，你已知道你為什麼能賺錢，你已有一套行動計畫去重複賺錢的經歷，你也清楚為什麼會虧錢，你已學會跌時停損，虧錢不再成為心理負擔。因為你知道虧掉的錢很快就能賺回來，只要到了這個地步，你就知道你已能以炒股維生了。


    我女兒常問我：「爸爸，你希望我長大後做什麼？」我的回答總是：「你做什麼都可以，只要你自己喜歡。不過，我希望你能有一個不求人的一技之長。」


    「不求人的一技之長」。任何三十五歲以上的人都會對這句話產生強烈的共鳴！求人難啊！就算你屁股上揹著一書包的「士」，求人給份工作也不容易。炒股就不求人；學炒股是很不容易，但想想你辛苦過後有可能學到「不求人的一技之長」，你就能忍人所不能忍。


    有讀者或許有問題：「囉囉唆唆講了這麼多，十幾萬字！我是越看越糊塗。我明白，做到你書中講的一切應該能賺到錢；但若我都做到了，我已成聖人了。我並不想做聖人，可以告訴我：到底如何不做聖人也能從股市賺到錢？能講得簡單點嗎？」


    這問題可真不容易回答！從歷史的角度來看，你需要耐心！計算二十世紀華爾街的平均數，股票平均每年上升一〇％。你若將風險分散，長期投資，你的報酬也大約將是一〇％。若你有筆可以長時間不動的資本，拿去買股票指數股（或基金），你甚至可以期待一〇％的年報酬。不用動大腦，更不用做聖人。當然，一百年前紐約的咖啡一分錢一杯，如今是一塊錢一杯，你的實際購買力增加了多少就見仁見智。


    日交易員盯的是每年三〇〇％、五〇〇％的報酬；基金經理人希望成績能夠超過指數，以低於指數風險取得超過指數報酬的成績。個人炒股希望抓到一匹大黑馬，睡上兩年醒過來成爲千萬富翁。無論你是那種操作者，但目標必須是「在正確的時間，做正確的事情」。雖然不同的目標下正確的時間和事情可能有差異；但總體來說，下面三點是想從股市掙錢所應當做的「正確的事」：


    - 一、掌握時機：你要知道何時入市，何時旁觀；何時獲利，何時停損。

    - 二、金錢管理：你要知道如何分散風險，何時多擔風險。無論如何都要盡力保本。本錢沒了，遊戲就結束了。

    - 三、情緒控制：情緒控制在入市之前很容易；一下注了，情緒控制就難起來。一般的股民是賺錢的股票坐不住，虧錢的股票走不了。你會例外嗎？該割肉時會遲疑嗎？


    「掌握時機，金錢管理，情緒控制。」共十二個字！你背熟後照著做，容易吧？這本書要你做的就只有這些。你根本不需要是聖人。


    花點時間，做點功課。這十二字不複雜！有些毅力和耐心就能做到；作爲追求幸福生活的代價真是微不足道。偷雞還要蝕把米，你若那把米都捨不得，就請打消偷雞的念頭吧。我不知要如何一點米都不蝕就能偷到雞。


    以下看看我是如何學股的。


    ## 第 8 章 和炒手們聊聊天


    ### 第一節 學股的四個階段


    在我學股的過程中，我最希望知道的就是我已經學到什麼地步。當我達到什麼地步的時候，才可以認為已經畢業。當然，畢業並不表示已成爲專家，但起碼它表示我已擁有足夠的知識在這行生存。


    就數學而言，小學的內容從加減開始，中學的內容包括幾何代數。你很清楚你的數學知識已經達到了幾年級的水準。


    學股有沒有這樣的級別之分呢？答案是「有」。


    我就以自己的學股歷程談談學股經過的階段，你可以參照我的描述，估計一下自己現在處於什麼階段。這些階段的劃分並不嚴格，很多時候是互相交錯的。如果人性共通的話，我學股的歷程應該和你十分相似。


    #### 一、變幹階段


    第一階段可以稱為變幹階段。這個階段的特點是自己沒有什麼主意，買時不知為何買股票，賣時也不知為何賣。買賣的決定完全由他人或自己的一時衝動左右。例如某某股評家推薦買這檔股票，他認為這檔股票最少還會升十點等等。賣時也沒有章法，覺得有錢賺就可以賣了，他在這個時期是絕不肯停損的。


    我有位親戚，他從未炒過股票，有一天他聽說我賣了兩支虧錢的股票，立即就指出我的過錯：「虧錢的股票如何能賣？最少要等到升回有錢賺時才可以脫手。虧錢的股票快快賣掉，賺錢的股票不肯賣，要等到跌回虧錢後才賣，你如何可能從股市賺到錢？」這段話大概說出了新股民的心聲。


    讀到這裡，讀者也應該也能明白為何帶有這樣心態的股民不可能在股市不斷賺到錢。


    新股民有兩個顯著的特點：


    - （一）不貪：他們只要有一點利潤就趕快賣股獲利。「我昨天十元價進了五百股，今天升到十一元趕快賣掉，五百塊錢能買不少菜呢。」只要股票的價錢升到他們的買價之上，身上的每根神經都在喊：「賣！賣！賣！」生怕明天跌回來如何辦？他們不貪，滿足於賺小錢。

    - （二）不怕：假如不幸十元一股進的股票跌到九元怎麼辦？答案是：「真倒楣，被套牢了，等到反彈再說。」套牢了不怕，反正我也不急用，等就是了。「虧錢時他們不怕，他們絕不願虧小錢。令人遺憾的是，就我的觀察，80%以上的股民都無法從這個階段畢業。問問你自己有這樣的心態嗎？如果有的話，你學股的道路還很漫長。你還處在原始階段。


    #### 二、摸索階段


    我自己在蠻幹階段大約待了半年，幸運的是，我居然在這一階段賺到了錢，使我對自己的悟性有了極大的信心。或許這就是初始者的好運。這段時間我開始大量閱讀有關炒股的書籍。我知道這樣蠻幹是不對的，我開始試驗「截短虧損，讓利潤奔跑」。


    首先我學習停損，我給自己定個規矩，只要股票從我的買價下跌一元，我就賣掉，以後這樣的損失累積成很大的數目，股票常常一碰我的停損價就反彈，我便幾乎平地不斷停損，小損終於加成大損。我明白了元一的停損不對，我便開始把停損點放大，由一元加到一○%,最後加到二○%。這段時間持續了兩、三年。結果還是不行。舉例說，三十美元的股票，我將停損點定在二十七美元，股票升到三十五美元，我就將停損點定在三十一·五美元。實驗的結果，我買賣的次數少了，但我常常是虧錢時在二十七美元賣股，賺錢時在三十一·五美元出場。這樣虧虧三美元，賺時只有一·五美元，算算總帳，還是虧錢。


    情況並不完全如此。當股價從三十美元跌到二十八美元時，我總是把停損點下移，有時移到二十六美元或二十五美元。我給自己定一○%的停損，在實際中的損失常超出—○%的數目。我知道這樣做不對，但我忍不住。我怕股價一碰到二十七美元就反彈。這樣的事情發生過很多次。當股票升時，我常常沒有困難在進價之上賣股。如三十五美元的股票跌到三十二美元，我不會將三十一·五美元的停損價往下移，因爲我已有一·五美元的利潤。


    最慘的是這段時間，我試過專用基本分析來炒股，研究股票的盈利及公司資產值，研究本益比，你想得到的指標我全試過。結果還是不賺錢。我試過用技術分析來炒股，找最低點，找最高點，結果不斷以「停損」收場。


    停損，停損，停損，我不斷停損，就是看不到盈利。停損把我止损了。我還試過各種電腦的計算指標，如平均線、威廉%、MACD等等，沒有一樣有效。結果總是不斷地在停損。好不容易偶爾賺一次錢，也常因為停損點定得太低，沒賺多少。這段時間我不僅將蠻幹階段幸運賺到的錢全賠了進去，還虧了一部分老本。就是說我不僅白做了三年，還虧了本。


    別忘了，這段時間我是專職炒股，我把讀到的、想像到的各種炒股方式全試過，就是賺不到錢。我也將華爾街的各種各樣的家訓讀到倒背如流的地步，但在現實中它們似乎完全無效。你可以想像我是多麼彷徨。


    我對炒股失去了信心，我決定試試自己在期貨上的運氣。我開始炒賣黃金、白銀、外幣、黃豆、石油、小麥。那些在炒股中學到的規矩似乎也完全無效。期貨的人爲操縱更厲害，我只是虧錢虧得更快。這時我的第一個女兒出生，我感覺身上的責任重大。我真正地開始考慮是不是應該放棄了，該轉行了！如果付不起日後女兒上學的學費，我如何向她交待？花了近四年的時間，什麼也沒有得到，虧了老本，換來一大堆經驗。如果離行另謀他就，這些經驗一錢不值，你可以想像我是多麼不甘心。期貨炒賣是極特殊的行業，它不注重基本面分析，你說日元或黃豆應定什麼價？它極其注重技術分析，其中特別重要的是走勢和阻力線及支撐線的觀念。


    把這些概念放回股票，我突然感覺股票運動其實有跡可循！我突然間覺得有靈光在腦海中閃耀。


    讓我在這裡停一下。因為上述的階段可以稱為「學股的摸索階段」。你如果還處在蟄幹階段，這本書講的一切對你可能太深，你還不如如何明白我在講什麼。你如果正在摸索階段，你會開始明白這本書。


    摸索階段的特點是，你已多多少少明白炒股的行規。你知道要停損，要讓利潤奔跑，但你還不清楚應如何停損。你用一○％或二○％等機械的方法定停損點。有時你能辦到，有時你又想辦法不去停損。讓利潤奔跑時你不知迴應該讓它跑多遠，你不知如何判定獲利點。


    各種各樣炒股的規則有時有效，有時無效，你還不知如何應用它們。


    看到蠻幹的炒手，你知道他們在蠻幹，你知道不能這樣做。你自己有時賺到錢，有時虧了錢，但你還不明白為何虧錢，也不清楚如何賺到錢。你還沒有有系統的買點和賣點，這支股的本益比很低了，那支股的紅利比較高，張證券行推薦這支股，李股評人看好那支股，你還在自己的直覺加上「應該不會錯」的理由買賣股票。這些描述適合你嗎？

    '
