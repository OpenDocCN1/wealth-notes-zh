    # 第 6 章 如何為自己做心理建設？


    找代罪羔羊：如股票大戶操縱、報紙登假新聞、公司做假帳等等。這些其實在股票的運動和交易量上都有跡可循。請清楚地提醒自己：自己，也只有自己，才能對結果負全部的責任！


    犯錯不可怕，可怕的在於不承認自己犯了錯，炒股是這樣，做人何嘗不是如此？


    炒股的正確心態還必須包括「專心」。


    你要專心研究股市的規律，這需要實踐，只看幾本書是不夠的。就如同游泳一樣，無論你讀了多少游泳的書，不下水永遠也學不會。專心地觀察股市，它是公眾參與的行業，股市有跡可循。特別留意自己熟悉的股票，一段時間後，你會發現心裡「買」或「賣」的聲音愈來愈愈精確。


    給自己這樣的信心：只要我全力以赴，專心致志，我什麼都能學會。你對這行瞭解得愈多，從中得到的樂趣也愈多。俗話說：「知識是享受。」股票的知識也不例外。而且這些知識除了精神享受之外，還能提供財務上的收益。專心是在任何行業成功的基本要求。


    股票是極其普通的行業，不需要很大的資本，也沒有很多專業知識。千千萬萬人都在這行打滾，你想做得比他們更好，憑什麼？普通人每天工作八小時，你也工作八小時的話，你也只會是普通人中的一員。想比普通人站得更高，看得更遠，只有靠著八小時以外的努力。


    享受你所做的一切。這或許聽來很奇怪的，但這是事實。你一旦把炒股當成工作，它就變得單調、辛苦。看看你的周圍，有多少人能說享受自己的工作？大多是為五斗米折腰，一天'
  - '[PAGE 197]


    天混日子罷了。你如果每天都告訴自己：「我從炒股中得到很多樂趣」，你的心態就會不一樣。這不是阿 Q精神，只要試試看就知道差別所在了。把工作當成享受，你會更專心。我所見到的人大多數是這樣玩股的，他們把炒股當成業餘消遣，這些人永遠達不到專業的層次。讀了這麼多，不去做的話，什麼厾都沒有。這個世界充斥著滿肚子幻想，但從不實踐的人。也有很多埋頭做事，卻從不幻想的人。那些滿懷理想，又努力用實踐來實現這些理想的人少之又少，而只有這些人才會是生活中真正的成功者。他們每天都充滿活力，爲實現理想而努力，不計報酬，因爲工作的樂趣已是最大的報酬，他們把每個失敗和挫折都當成前進路上不可避兔的障礙。


    從這一點來說，在股票行成功的條件與其他行毫無區別。


    再看看你周圍那些空虛的眼神，那些埋怨「我還沒有碰到機遇」、「我這匹千里馬未遇到伯樂」的「懷才不遇」者，幾乎毫無例外地成日怨天尤人，搬弄是非。這些人要嘛從來就沒有理想，要嘛從未想過努力實現自己理想。所有的理想隨著時間的推移而消失。他們充滿著對自己的不信任和深深的不安全感。


    要成爲哪種人？答案很清楚。從今天開始，從現在開始，給自己定個可行的目標，定個實現這個目標的計畫，堅定不移地按計畫做。只要鍥而不捨，你遲早能達到這個目標。鍥而不捨說起來很容易，教別人怎樣做也很容易，自己執行可就辛苦得很，但它所能獲得的結果'
  - '[PAGE 198]


    將會十分驚人。


    我還要提醒你，在你成功之前，你會碰到很多嘲笑你的人。嘲笑別人很容易，要自己做出一些小成就卻非常困難。我發現那些喜歡嘲諷人的人幾乎沒有例外是生活的失敗者，庸庸碌碌地混日子。對這些人的嘲笑，你必須能一笑置之。


    最後我要告訴你，從有招到無招需要時間，這個時間會比你希望的還要長很多。如果你的悟性不錯，也要費時五至六年。


    我在美國就讀的商學院叫巴魯克商學院（Baruch College）。伯納德·巴魯克是一九三〇年代著名的投資家。從華爾街賺夠錢後成爲羅斯福總統（Franklin
    Roosevelt）的財經顧問。他自傳《Baruch: My Own Story》的前部分講的便是他的華爾街生涯。他父親是位著名醫生。他剛進華爾街，父親給了他十萬美元，那時候可是一筆鉅款。可這十萬美元只撐了三年。他告訴父親已虧光十萬美元時，他正等著父親狂怒。但他父親並沒有生氣，只給了他信任的目光，而且又給了他十萬美元，告訴他這是家裡最後的財產了。


    在第六年的時候，他第一次一筆賺到六萬美元。在自傳中，他說他明白自己從此完成了炒股的初期教育，他不再「妄想」在華爾街生存，而是「知道」能在華爾街生存。他在自傳中充滿著對父親的崇敬。在本書「華爾街的家訓」那一章，我摘錄了他對炒股的十點建議。


    二十世紀初的另一位著名炒家傑西·李佛摩也說，他用了五年時間才學會怎樣理智地玩'
  - '[PAGE 199]


    # 股票遊戲。


    在本書第八章《和炒手們聊聊天》我會詳細地談談自己學股的過程。從什麼都不懂到有信心，不斷地從股市賺到錢，我也用了近六年的時間，那還不算我業餘炒股的經驗及金融碩士的知識背景。所以，你要準備「長期抗戰」。'
  - '[PAGE 200]


    # # 第 7 章


    # ## 抓住大機會


    「瘋」也是人性的特質。如果你能抓到一個這樣的「瘋」，你的生活就能有「量變到質變」的變化。要真正想在炒股中賺到大錢，就必須有能力認識這種「瘋」投入其中，在假象被大眾認識之前退出遊戲。'
  - '[PAGE 201]


    股市不時會發股瘋；股瘋給了一般股民一個升級到「慈善家」的機會！因此，有關投資中的「瘋」的話題自然是難以迴避，本章綜合總結了前面幾章的內容。


    # 第一節 「瘋」的故事


    在你的生涯中，通常會碰到不少大大小小的「瘋」。從一九九〇年代初中國的股「瘋」，更早之前的郵「瘋」，到下面介紹的「瘋」故事，你會發現「瘋」也是人性的特質。如果你能抓到一個這樣的「瘋」，你的生活就能有「量變到質變」的變化。要真正想在炒股中賺到大錢，就必須有能力認識這種「瘋」投入其中，在假象被大眾認識之前退出遊戲。


    # 南海泡沫


    經濟史上最著名的三大瘋案分別是：南海泡沫、荷蘭鬱金香和密西西比狂。任何講經濟史的書都曾詳細描述這三個故事，為了節省篇幅，我在這裡只講南海泡沫的故事。


    十八世紀初，英國人相信一個有極大增長機會的地方，是與南美洲和南太平洋的貿易。一七一年南海公司在英國註冊，它獲得英國政府所給的專營與當時爲西班牙殖民地的南美'
  - '[PAGE 202]


    洲和南太平洋的貿易權。取得這項專營權的條件之一，就是該公司要負責部分的英國國債。但當時的西班牙政府不允許這些殖民地和外國人交易，南海公司僅被允許做奴隸連送的交易，並且每年只准運一艘，利潤還要和西班牙政府分。從一開始，南海公司讓其股票購買者想像的大筆黃金和白銀會從南美洲源源而來的承諾就是騙局。但人們總期待西班牙總有一天會開放貿易，公司就這樣不死不活地撐了幾年，股票也沒有大的起伏。


    這樣不死不活地撐著總不是辦法。到一七七九年，南海公司的董事們重新找上英國政府，建議用南海公司的股票償還給英國國債的持有人，最終建議全英國的國債都用南海公司的股票償還。英國政府一一接受，因爲它樂見國債能用這樣的方法償還。


    要使這樣的運作成功，就必須使南海公司的股票不斷攀升。因爲公司的利潤有限，唯一的道路就是不斷散布西班牙政府會開放貿易的謠言。其間民眾聽說西班牙政府已經同意南海公司在祕魯開闢一塊營運基地等等。黃金白銀從此將從南美滾滾而來的美景佔據了每位股票持有人的想像。


    到一七二〇年九月，南海公司的股票達到每股一千英鎊，在半年之間升了八倍。一夜橫財的故事總是如此吸引人。當時，社會風氣發展到不擁有南海股票就跟不上時代潮流的地步。在最高潮時，南海公司的股票總值是全歐洲（包括英國）現金流通量的五倍！隨著股票的一天天增值，許多人放棄了工作投身股市。還有什麼比賺錢又容易又快速更'
  - '[PAGE 203]


    令人著迷的呢？會婆是沒有止境的。股票上市之後錢得來是如此容易，各種各樣的公司都試著將向大眾推銷他們的股票，其中有專營從西班牙進口翠鳥的，有專營人類頭髮買賣的。一位倫敦的印刷工人登記了一家「正進行有潛力生意」的公司，雖然沒有人明白該公司到底做什麼生意，他還是在六小時之內賣出了兩千英鎊的股票。要知道兩千英鎊在當年是筆鉅款。這位印刷工人當然就從此下落不明了。那些沒能盡早買到南海股票的人民，生怕失去碰到下一個南海公司的機會，紛紛把大把大把的血汗錢投入到這些莫名其妙的公司。


    回頭想想，人們會嘲笑當年的民眾真是瘋了。當年也不是沒有頭腦清醒的人，但他們太早了一步，他們指出這個泡沫會被破碎，但市場用不斷升高證明他們論點的錯誤。開始還有人聽聽他們的警鐘，隨後便嘲笑他們的短視。騙案層出不窮是所有「瘋」到了晚期的特徵之一。陷入瘋狂狀態的民眾是行騙的最好目標，他們失去了最起码的警惕。此時騙局不僅限於小人物，南海公司的董事們一方面大量行賄英國政府官員，另一方面眼紅其他大小騙子把原可用來支撐南海股票的資金吸走，開始指出這些公司的騙局。但結果使民眾也懷疑南海公司是否也是這樣的騙局？


    在一個月內，民眾的感覺發生了一百八十度的轉變，他們開始懷疑西班牙政府是否真會給南海公司想要的交易權。在九月底，股票從月初的一千英鎊跌到一百二十九英鎊。許多投資者破產。那些接受南海公司股票做抵押、貸款給投資人炒股的銀行一聞聞倒閉，英格蘭銀'
  - '[PAGE 204]


    行也難以倖免。


    另外兩宗瘋案也十分有趣，我建議讀者去找來看看。給我印象深刻的是，在荷蘭鬱金香狂的後期，有位客人在主人家看到一顆洋蔥，便將其炒來吃了，後來發現這枚「洋蔥」原來是一種稀有鬱金香的球莖，市值兩幢房子外加一輛馬車。


    # 佛羅里達的「土地瘋」


    佛羅里達州位於美國的東南端靠近古巴的地方。佛羅里達氣候冬季溫暖濕潤。一般來說，來自紐約等酷寒地帶的美國有錢人喜歡在冬季到佛羅里達的棕櫚海灘等地避寒。第一次世界大戰後，這裡已成爲一般民衆的冬天度假勝地。


    佛羅里達提供人們一個輕鬆的環境，提供了在酷寒中勞作的東北部居民一個短暫逃避的場所。而且佛羅里達的土地均價較美國其他地方低得多，它自然地成爲美國人買個冬天度假屋或買塊土地日後定居的理想場所。隨著需求的增加，土地的價格開始慢慢升值。


    從一九二三年至一九二六年，佛羅里達的人口大增，土地的價格升幅更是驚人。如果說土地升值有其堅實的經濟基礎，那麼「瘋狂」就源自「貪」。有個故事：幾年前有人用八百美元在邁阿密海灘買了一塊地，在一九二四年賣了十五萬美元。在附近還有一塊在一八九六年僅僅值二十五美元的土地，在一九二五年年賣了十二．五萬美元。'
  - '[PAGE 205]


    這種一夜橫財的故事最爲人們所津津樂道。


    當時，美國的經濟蓬勃發展，土地的價格也很低。很快地，在邁阿密近海的兩百公里地段，各種建設項目如雨後春筍般矗立。沼澤地的水抽乾了，鋪上新的道路。每個人都在談論土地的供應如何有限，人口增加如何快速，這片陽光地帶的土地如何很快就被搶購一空。


    有限土地的事實帶給人們想像上的危機，今天不買，明天就買不到了！土地的價格節節暴漲，最後遠遠超出眾人的想像力。


    一九二五年，邁阿密市只有七萬五千人口，其中就有兩萬五千名地產經紀人，超過兩千家 的房地產公司。按照這個比例來算，無論老幼，每三位居民就有一位專做房地產買賣。一九二六年某則新聞曾報導，某位地產炒手在一個星期內將本金翻了两倍。賺錢的故事總是傳得飛快。


    人們買土地不再是用來居住、建廠房或其他實用的目的，買土地的唯一目的就是怎樣轉手謀利。當時買土地的訂金是一〇%，土地價格每升一〇%，這些炒手們的利潤便是一〇〇%。


    開往邁阿密的火車、輪船上，擠滿了做發財夢的美國人。隨著邁阿密海灘附近的地價飛漲，附近沼澤地的水被抽乾，一塊塊地投入市場。面對著似乎無窮盡的土地供應，發地產瘋的民眾開始清醒了。'
  - '[PAGE 206]


    但在瘋狂的時刻，特別是某人如何一夜暴富的傳言繪聲繪色地廣為流傳時，人們很難保持頭腦清醒。炒股好手傑西·李佛摩也參加了這一場遊戲，他也認為佛羅里達的土地會繼續升值。別忘了，當年他在金融界的地位就如同今天的金融大鱷喬治·索羅斯一樣。


    銀行通常是保守的，其貸款主要是按借款人的還貸能力而定。但隨著土地價格的不斷升高，銀行也拋棄了這一原原則，他們批准貸款不再看借款人的財務能力而是改為專注土地的價格。銀行不是忘了行規，而是你不做生意，其他銀行搶著做。


    所有的瘋狂都有夢醒的時候。隨著沼澤地一塊又一塊投入市場，新進的資金不夠支撐土地價格的不斷飆升，那些財力不夠雄厚的炒手首先被貸款壓垮投降，銀行只好收回土地到市場拍賣，這些土地又帶給市場新的壓力。轉眼之間，銀行對買地者要求遠遠超過一〇〇%的訂金。人們不再討論只升不跌的佛羅里達地產。當然，新的買主即刻消失，只剩下一間又一間倒閉的銀行。


    我也曾在九八〇年代末期加入售賣佛羅里達地產的行列，當一名房地產經理人。有一天接到電話，有位女士在三十年前花五千美元買了塊地，她想把土地脫手。我告訴她大約能賣七千五百美元。但她說加上利息，她虧大了，不肯賣。差了半個世紀，佛羅里達的地產似乎沒有改變。


    再講個發生在近期的故事。'
  - '[PAGE 207]


