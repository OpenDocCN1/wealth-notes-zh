  md: '对可乐没那么渴望了。


    对于一些可能引起孩子冲动，我们又想加以控制的行为，我们都可以增加对部件事情的客观性的描述，帮助孩子更理性地面对自己的冲动。


    # Dr. 魏的小叮叮


    我要叮叮一下，今天说的三个策略不仅可以帮助孩子，也可以运用到大人身上。当我们感到愤怒，我们可以转换一下视角，想一想要是别人，他们会怎么解决这件事；当我们想放弃计划，我们可以多畅想一下未来，对比一下短期利益和长期利益的权衡；当我们受到诱惑，我们可以重新评价一下对事物的认知，从热情绪中抽离，冷静下来。


    今日得到


    孩子冲动的原因可以从“情绪—认知—行为”链条中找原因，只要教会孩子用策略，充分发挥他们的想象力，让孩子意识到自控力会带来的好处，调节他们的认知，就能够帮助孩子提高自控力。


    # —— 第022期思考题 ——


    今天的思考题是，请你回忆一下，你家孩子最近一次失控是什么时候，你又是怎么办的？结合我今天说的“蝇蛆效应”等方法，分享你的心得体会，期待你的答案。


    第21期金牌家长：柯柏瑞


    上一期的思考题是：小贝一到商场就吵着要买玩具，你有什么妙招。来自家长@柯柏瑞的分享让我记忆深刻，这位宝爸巧妙的把企业中的KPI绩效考核制度，运用到自家孩子身上。


    孩子看电视、买不必要的玩具零食，都需要用“点数”，也就是他们努力学习或做事情赚来的奖励来交换。实行这个制度之后，这位宝爸再观察孩子，发现他们的行为符合一个经济学规律，边际效益，也就是孩子会自动去思考，要不要把辛苦赚来的点数拿去买没那么喜欢的玩具了。


    他最后得出结论，如果我们把选择交给孩子，并且要求孩子为自己做出的选择负责并且承担后果，孩子真的会像大人一样思考。第21期金牌家长，我饰给聪明的宝爸@柯柏瑞。


