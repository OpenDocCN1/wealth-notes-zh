    # 今日问题：带孩子逛博物馆，重点看什么？


    Dr.魏


    你知道吗？5月18日是国际博物馆日。这一天，全世界很多博物馆都会开展各种活动。比如在北京，明天就有97家博物馆会免费对公众开放，以及组织了100多项主题活动，吸引大家去博物馆玩。


    可能你需要上班，不能带孩子出去。没关系，周末也好、放假也好，如果你有空，多带孩子逛逛博物馆，对孩子大有好处。国际博物馆日也许只有一天，但是孩子的博物馆日，全年365天都不嫌多。


    # 逛博物馆学知识是次要的，激发孩子勤思考更重要


    到了博物馆之后，怎么才能让孩子收获最大？


    我很喜欢带孩子去逛博物馆，但在博物馆里经常会看见很多家长，非常努力地想让孩子多学点知识。在我看来他们的做<|start|>法比较低效，只是简单地让孩子背知识点。比如我上次带我女儿去海洋博物馆，看到一位家长，带着跟我女儿差不多大的女孩，走完一个展区就问一次：“刚刚这个鱼叫什么？它产于哪里？它属于什么科目？”


    这样带孩子逛博物馆，是错的。“博物”这个词听起来像是需要在里面学习知识。的确，我们的教育里面也特别强调知识的获得。但是，博物馆更重要的是让孩子学习思维、学习探究精神，保护孩子的xd奇心。


    # —— 宝典查询结果 ——


    # 1.带孩子逛博物馆，重点不是孩子记住多少知识点，而是他观察、思考了多少。


    博物馆的中文“博物”，听起来像是把所有东西聚集在一起。但博物馆的英文——Museum，它的词根是Muse，是古希腊神话里的女神缪斯，她是给予人们灵感和启发的文艺女神。


    # 2.尽量带孩子去能“动”的博物馆


    # Dr.魏的小“叮叮”


    +   1. 你应该多带孩子去博物馆，但是重点要放在引导孩子观察和思考上，而不是记住知识点。\n2. 带着问题逛博物馆。提前查好相关问题，让孩子到博物馆里找答案，也可以在博物馆里看到不同现象时，现场向孩子提问。


    Dr.魏\n行动关键词：逛博物馆\n明天是国际博物馆日，相信不仅仅是你，你的朋友可能也会在明天或周末，带孩子去博物馆。你可以把这篇文章分享给身边的有娃家庭，让每个孩子都可以从博物馆中得到最高效的成长。'
