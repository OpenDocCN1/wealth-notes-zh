  md: '的故事模式。或者你们读完后，你合上书，说：“来，宝宝，你把这个故事讲一遍给我听听好不好？”这就转入了他讲故事的模式。


    # Dr. 魏的小“叮叮”


    最后，我还要叮叮一下如何给孩子选故事书。一方面，要注意故事的多样性，不只是童话故事，你自己的生活经历、周围人的真实故事，包括一些名人的故事，比如航天员、运动员，也都可以讲。孩子听的故事越多样，他的想象力和创造力也越好，因为故事提供了这些思维活动的素材。另一方面要注意高质量。


    2013年，《科学》杂志发表了一项研究，发现读经典文学作品的人比读流行小说的人更能读心，看懂别人的情绪，但，有一个前提条件，就是这些小说得是高质量的经典，是对人物心理和行为描写得细致入微而且真实可信的，如果是粗制滥造的口水小说，那就没什么效果了。


    具体选择哪些高质量的故事，你可以按照我上期节目的4C模型，选择能体现因果关系，有冲突感，而且剧情和角色都多样的故事。你还可以翻到我上周五的问答，从聪明家长们推荐的书单中挑选好故事。


    故事对于孩子很重要，你可以鼓励孩子听故事、读故事、讲故事，这三种方法穿插着使用。你可以鼓励孩子讲故事，这个过程中你可以多问问题，比如细节类的问题和线索类的问题。多鼓励孩子讲故事，慢慢你会看到他的改变的。


    Dr. 魏


    行动关键词：今晚读一次故事


    如果你愿意尝试，可以今天用平淡的语气讲一个故事，明天，换个情感充沛、语调多变的方式讲另一个故事。


    你可以过几天之后，考考你孩子到底对哪个故事的记忆更好。考验的方法就是让他复述一下故事。我特别鼓励家长们带着实验的思维去多观察，多尝试和孩子的互动，我相信你不仅收获的是育儿知识，更是对自己孩子成长的惊喜。


    # 如何鼓励孩子讲故事？


    1个观点：

    听故事、读故事、讲故事，三种方法一起用效果最好。人与人的互动，除了语言，还有非语言沟通，沟通中家长可以多用动作和手势。

    不要苛求孩子讲故事的合理性、真实性，要鼓励孩子说出脑海中的想法。


    特效药：


    +   1. 邀请孩子给故事添加细节

    2. 利用线索帮孩子把思路捡回主线


    Dr. 魏的家庭教育宝典'
