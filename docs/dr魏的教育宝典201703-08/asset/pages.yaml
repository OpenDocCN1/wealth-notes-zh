    # • 用角色扮演的方式阅读 @郑志荣


    我陪孩子阅读时，会加入角色扮演。我龄幼儿读绘本有个共性，喜欢把本书翻来覆去的看，熟练到一定程度，就开始让孩子扮演其中他熟悉的角色，读出该角色的对话。


