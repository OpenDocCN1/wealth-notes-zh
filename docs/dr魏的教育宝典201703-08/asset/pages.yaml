    Dr.魏


    如何减轻练习的负面情绪，@麻麻爸爸 补充了一个很好的方法：运用峰终定律。


    诺贝尔经济学奖得主、美国著名心理学家卡尼曼发现，人们对体验的记忆由两个因素决定：一个是高峰时的感觉，无论是正向的还是负向的；另一个是结束时的感觉。


    # 以下是 @麻麻爸爸 的分享


    孩子这个暑期在学习游泳，游泳对于他来说是一个很大的挑战，因为他很怕水，特别是去年有一次不太愉快的培训经历，令他对水的恐惧到了极点。


    +   1.坚持到底，不轻易放弃。孩子会有非常不愿意去游泳的时候，因为游泳对于他来说不舒适。这时候如果大人顺着他的意放弃了，可能会导致之后有第二次第三次的不想来，因为他的放弃得到了支持。


    +   2.多与教练沟通，教学相辅。这点是非常重要的，无论孩子在学习什么课程，要及时地跟教练沟通。这样做是为了把孩子相关的心理状况向教练反馈。比如孩子最怕做仰泳动作，我就跟教练说，教练会在教仰泳的时候，就更加关注他，帮助他克服这个困难。到现在，他已经能够很轻松地学做仰泳动作了。


    +   3.运用峰终定律。让孩子在训练结束后吃点“甜头”。我们会带一个小糖果、巧克力，在游泳之后给他吃，或者让他游泳结束后跟其他的小伙伴玩一下，有时允许他玩10分钟的手机，给他一个愉快的方式来结束整个训练过程，体验终值，让他对游泳的整个感觉趋于良好。


    Dr.魏

