  md: '带孩子也一样。爸爸带孩子去上钢琴课，回来后你问他："孩子今天课上得怎么样？" 他说："挺好，老师夸他有进步。" 你再问："那今天学会了什么新曲子？老师有没有指出他什么问题？有没有说有什么地方他还要回来再练？"
    爸爸一听傻眼了，因为在他的标准里，把孩子带去了钢琴课，又安全地带回来了，就完成任务了，妈妈问的这些问题，那是老师和孩子自己要操心的事情。


    你还真得体谅爸爸，他不是消极怠工，而是真的觉得事情就这么简单。当然，育儿很多时候没有这么简单，但你也用不着立刻生气，而是要看到，他愿意带孩子去上钢琴课，这个本身就值得表扬。如果你实在要他改进，那也要用肯定的方式来表达。


    比如你可以这么说："你带孩子去上钢琴课真不错，比我带他去更开心。" 然后再说："你跟孩子玩得好，孩子听你的，你下回多问问钢琴老师，咱孩子还有什么地方要注意，有什么地方要回来多练习的？你问肯比我问强。"


    因为男性和女性在夫妻关系中最看重的地方不一样。女性最担心的是男性的感情，他是不是爱我；男性最担心的是女性的眼光，她是不是仰慕我。爸爸最受不了妈妈的批评，因为那是在攻击他的能力。反过来，就好像妻子最爱听的是丈夫的甜言蜜语一样，爸爸最爱听妈妈的表扬。所以，你要用正面的态度来促进他的改变。


    怎么让爸爸喜欢带孩子？你下次只要看到他跟孩子在一起，多表扬他。"看，宝宝和你玩得多开心"；"举高高还是爸爸做得好"；"宝宝好喜欢你给他骑大马"。


    这个我也要强调一下，其实并不是虚伪。要知道，现代爸爸基本都是在传统家庭下长大的，从小他自己的父母大是"男主外，女主内"的，爸爸能更多参与到育儿中来，确实也值得表扬。当然，你表扬之后，也可以乘机提出些适当的改进意见，这个时候，他特别能听得进去。


    # 3. 给爸爸清晰、具体的指令


    有时候爸爸没经验，确实需要你的指导。要注意给他清晰、具体的指令。


    如果是那些爸爸本来有固定的想法的，比如怎么跟孩子玩，你应该像第一条一样，尊重他的玩法。但是如果你对这件事有明确的期望，那你要明确地跟他说。比如你要出门了，要给爸爸交代午饭，得很具体地说："12点的时候吃辅食，刮四分之一个苹果，拌四分之一个蛋黄，然后冲半瓶奶粉，让宝宝躺下来喝，喝完给他一个安慰奶嘴，让他睡觉得。"


    为什么要这么详细呢？是因为我刚才说的，爸爸跟你的标准不一样，你如果只是很模糊地跟他说一下，很可能到最后他完成的样子跟你想象的不一样，你觉得他是在糊弄差事，他还觉得特委屈，两个人的矛盾就这样产生了。而且有些爸爸比较好面子，他不知道该怎么做，也不好意思问，只能自己摸索，你得事先直接告诉他，这样才能更好更快地培养出好爸爸来。


    Dr.魏的小"叮叮"


    最后，我也要小小地叮叮一下。爸爸到底会不会带孩子，能不能带好孩子？这其实在很大程度上是个自我实现的预言，它是一种期待效应，也就是说你放开手让他去带，鼓励他带，他就能带好。如果你不相信他，一直守在孩子的门前不让他碰，那他当然越来越不会带孩子，然后你还更加觉得自己守在门前有道理。


    带孩子，千万不要把爸爸拒之门外，一定要让爸爸更多地带孩子，因为这样孩子才会更聪明，将来学习成绩也会更好。我今天给了你三个原则，第一，尊重爸爸带孩子的方式；第二，给爸爸成长的时间，多肯定，少批评；第三，给爸爸清晰、具体的指令。


    Dr.魏


    今日行动：让爸爸主动变成"超级奶爸"


