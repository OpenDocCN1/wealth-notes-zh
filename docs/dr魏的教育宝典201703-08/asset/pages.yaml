    孩子与孩子玩，或与人打招呼我基本上是不打扰的，静静地听，可有时候，不免会尴尬，因为每个人的观念与想法不一样，尤其对孩子这块儿，为了给他更好的支持，如果我不及
    时地支持，那些叔叔阿姨，都会着急的，我会笑着说他在想呢，还没想好。其实在社交活动上，大人表现也不是那么好，就如我们上次去博物馆的时候，正好赶上有活动，我们在侧面观看，正面的观众是可以伸手进行一个体验的，儿子也想体验，小声说着，我让他大声说出来，他不好意思。最后，当然没体验，踏上我就反思这事，才意识到其实是自己也不好意思，于是回家和儿子总结，当时妈妈可以大声说，“老师，我们也想体验一下”，然后你就伸出小手，老师就拿过来，你就可以体验了，他嗯嗯点头，我们约定下次就这么办。


