    074 | 家长 “扮演” 智力脑...


    Dr. 魏


    # 孩子自控力差怎么办？


    我常常收到五花八门的提问，这里有些问题是很多家长都问过的，你听听，是不是觉得熟悉：我家孩子看到好吃的好玩的，就想要吃要玩，不给就发火；孩子坐不住，学习容易分心；做事情磨蹭，爱拖延…


    一些育儿书上会说，这跟孩子的自律、意志力、规则等等有关。其实，从认知心理学的角度，这些问题都可以归结到同一种能力，就是自控力。


    # 自控力是什么


    自我控制力是面对诱惑和冲动，我们能够有意识地控制自己的情绪、认知和行为的能力，它是一项重要的基础能力。研究表明，自控力对孩子的学业成就有很强的预测性，小时候自控力好的孩子，他们上学后阅读和数学成绩也会很好，这种预测能力比智商对学业成绩的影响还要大。


    不单小孩子有自控力问题，成年人也常有失去自控力的时候。想一想，爸爸们能不能控制自己抽烟、喝酒的冲动？妈妈们能不能控制自己的购物冲动？现在你大概可以理解，自我控制力是多么重要，又是多么困难了。


    # 自我控制看年龄


    对孩子来讲，学会自我控制尤其困难。首先，大脑中负责自我控制的额叶区成熟得比较晚。


    # 1. 降低诱发条件


    # 2. 建立日常生活规律


    # 3. 及时提醒'
