- pgno: 94
  md: '我特别推荐“反事实想象”的想象方法，它的意思是把现实中一个条件或者因素给替换掉，然后想象会发生什么。这个方法可以很好地锻炼创造力。


    比如我在这个节目一开始讲创造力，曾经举过想象力的例子，我问孩子“假如你认识天上的神仙，想要天上下什么就下什么，你希望从天上掉下来什么东西？”女儿说：“还要一个飞毯。”她为什么要飞毯呢？因为我前几天给她讲了阿拉伯飞毯的故事。


    这就是典型的反事实想象，孩子肯定不认识神仙，但她的脑里储存了“神仙会造飞毯”的因果关系，她就能进行这样的假设，开辟新的思考路径，这就是创造力了。


    你可以平时问孩子一些反事实问题，比如说，如果人有三只眼睛会怎么样？如果猫比人聪明会怎么样？这些都是既保留了孩子熟悉的一些信息，比如眼睛、猫，又加入了新奇的信息。


    有时候，这些答案会让你自己都很意外，比如我问我女儿：“如果画纸会说话会怎么样？”她说：“那我就会少发脾气了。”这让我很奇怪，我问她：“为什么？”她说：“我一发脾气，就会乱涂乱画。可是如果画纸会说话的话，它就会说：‘不要画花我的脸！’那我就不敢再乱画了，所以我就只好少发脾气了。”你看！这个因果推导是不是很有创造力？


    # 今日得到


    想象其实非常重要，18个月大的孩子已经可以用想象来解决问题了。怎么激发孩子的想象力呢？可以通过以下三个方法：


    +   1. 对于已经发生的事情，想象事情本来可以有什么不同。 2. 对于将来的事情，想象未来可以有什么不同。 3. 对于当下，鼓励孩子多做象征游戏，想象事情另外的可能性。我最后还特别推荐了反事实想象的方法。


    # 今日行动：与孩子一起玩“假装”游戏


    跟孩子一起玩假装游戏，打开你的脑洞，引导你的孩子开始想象吧！欢迎你把以上几种方法用起来，你也可以想想，在你的朋友中间，有没有谁家的孩子特别鬼马、喜欢异想天开？把我的文章分享给他们，交流心得体会。


    # —— 第003期思考题 ——


    本期思考题


    我今天讲异想天开很重要，对这种想象力我给了一个区分：对过去的推断、对当下的思考和对未来的计划，这听起来很抽象，但其实孩子的大脑里还真就充斥着这些想象，请你思考一下，给出3个对应的孩子异想天开的例子，期待你的答案。


    # 上一期的思考题是：列出2项需要用到科学思维的亲子活动，并说明“为什么”和“怎么用”。


    我收到了很多精彩留言，我看到一些妈妈分享说在日常中，带孩子去菜市场的时候、带孩子下厨的时候其实都可以用到科学思维，让我这个爸爸大开眼界，你也可以到留言区看看是否可以借鉴的。


    来自一位爸爸 @金谷子 的分享让我记忆深刻，他说他和他妻子经常把玩具和实物拿来给女儿做对比，比如把煮熟的鸡蛋和玩具鸡蛋，放在水里，这样玩具鸡蛋是浮着的，煮熟的鸡蛋是沉在水底，他问女儿要吃哪个？


    他惊奇的发现，虽然女儿才一岁多不会说话，但是已经会选择沉在水底的鸡蛋了。他还说由于经常带孩子乘坐地铁，让孩子自己扶车把手，他发现女儿渐渐熟悉了运动的惯性，会随着地铁的停走，自己调节身体方向了。


    善于在生活中带孩子体验科学规律，我在这这边给 @金谷子 第二期金牌家长认证。


