  md: '# 067 | 读者问答：孩子还小，旅行能刺激他的大脑发育吗？


    067 | 读者问答：孩子还小… ↓


    Dr. 魏

    先来介绍一下本期音频的转述师：刘校妤，她是我的好朋友，也是着名的配音演员。前阵子大热的影视剧《琅琊榜》中的谍士素锦，就是由她配音。接下来，刘校妤老师会在每周五当伴你，把文章转述成音频，方便你收听。


    # 下周预告


    # 8.14（周一）：旅行中的记忆力锻炼


    家长从孩子记事儿起，会想带孩子外出旅行，希望帮孩子积攒更多的阅历。但有时候家长问孩子记住了什么，孩子却一问三不知。下周一，我教你一招，让孩子开心旅行，还能锻炼记忆力。


    # 8.16（周二）：认真布置玩具角，增强孩子学习力


    相信你家孩子一定有很多玩具，我在之前有关分享的文章中提到过，家长可以带孩子把玩具按照是否愿意与人分享，分成两类，降低孩子分享的心理成本。除了分享，玩具角的布置也有窍门，下周三我帮你解密。


    # —— 本周问答时间 ——


    +   1. 孩子用哭闹作为要挟，怎么办？

    2. 女儿喜欢说 “我真没用” “爸爸妈妈一点都不喜欢我”，如何引导？

    3. 孩子玩拼图容易分心，是太难了吗？

    4. 孩子画画时过多干预好吗？

    5. 旅行能刺激低龄小朋友大脑发育吗？


    # 1.孩子用哭闹作为要挟，怎么办？


    大人有一句话叫：会哭的孩子有奶吃。想请您帮忙分析一下：三岁多的女儿有事达不到目的，总要依赖哭闹，想让人满足她，我经常是让她哭够了再去找我，抱一下，再讲讲道理安抚或者鼓励一下等。

    今天散步她要赖要抱，不好好走路，歪歪斜斜地摔了，膝盖破皮流血了。我既心疼，也有些情绪，跟她说好：平路抱，上坡和上楼得自己走。可是上楼时，她大哭大叫我没有抱。回家后，我跟她说，等她哭完安静下来再抱抱。

    我知道她很需要我的安慰，但我又不希望她太娇气，太喜欢拿哭大叫来要挟、来当武器达成目的。而我确实很受不了，也很不喜欢她的哭闹。我在矛盾中带着情绪去处理，肯定有很多不安，请您给些建议。


    Dr. 魏

    小五，你好！会哭的孩子有奶吃。其实往往是因为孩子肚子饿，家长没意识到，需要用哭来赢得奶水。如果家长足够敏感，在孩子没大哭之前，就给奶喝，孩子就不用哭了，因为她知道奶总是会有的。

    奶水是孩子的必需品，是合理需求；我们和孩子的冲突点往往是那些我们认为不合理的需求，比如到超市想买玩具、糖果、散步要抱。孩子想要，但我们认为这对他不好，不给他。孩子只能用哭闹来争取。

    如果孩子发现哭闹有效，哭几次，即使只有一次有效，他们就会依赖这个“武器”。在散步里，她为自己争取到“平路抱”，她赢一回；有时候你足够坚定，她哭闹无效，你赢一回。

    但亲子之间不是你输我赢的竞争关系，而应该是共赢的合作关系。怎么做呢？

    首先是接纳孩子的感受，她想抱，可能是觉得抱更舒服，之前一直被抱习惯了，不要贴标签，认为这是娇气、要赖。

    其次，说说你的感受，为什么你觉得不合理。可能是你觉得孩子是大宝宝了，应该自己走路；你觉得孩子太重了，抱起来很累。第二理由孩子会更容易理解些，那你可以从这个角度来说。让孩子同理你的感受，比直接要求她做什么事情，会更容易些。

    最后，达成共识，你再和孩子寻找解决方法。你不必让孩子自己先愁，她说不出来，你再给建议。比如平路抱，上坡和楼梯得自己走。再比如你们可以比赛跑步，让散步更有趣。


    # 2.女儿喜欢说“我真没用”，家长该怎么办？


    4岁的女儿在遇到困难时会说“我真没用”，批评她时会说“爸爸妈妈一点都不喜欢我”。我担心这两句话孩子说久了会成为自我实现预言。

    在比赛失败、学习遇到困难等受挫情况下，会说“我真没用”。在女儿执意不刷牙、不收玩具、不睡午觉时，家长批评她，她就会用到“爸爸妈妈一点都不喜欢我”。面对女儿的这两句反馈，我和孩子妈妈尝试使用多种方法化解。

    我和孩子妈妈对自身行为也进行了回顾。1.对孩子积极行为一贯以鼓励为主。2.批评时不会带有主观评判，绝对不会说类似“笨”、“没用”这类的话。3.没有过分多的期待，只要快乐乐乐，并且不需要她表现得样样都优秀。

    想请教老师，作为家长我们需要做哪些工作，让孩子得以解决这个问题？


    Dr. 魏

    惠冰，你好。女儿时不时说“我真没用”“爸爸妈妈一点都不喜欢我”，让你很担心。你和孩子妈妈做了很多方法来化解，都是很好的方法。

    但孩子有时对自己的语言是处于似懂非懂的状态，比如说，妈妈不给她玩玩具，她可能会学书里或电视上的说法：“我要杀了你”。其实她并不懂这句话的真正含义，我们需要帮助她翻译这句话背后的情绪是什么，把情绪的颗粒度磨得更细。

    当她说，我真没用。不用急着帮她解决问题，或是鼓励她不是的，你很棒。而是接纳，试着翻译她的心声：这次比赛失败了，你觉得很挫败吧？把她的情绪具体化，而不是泛化为自己没用。

    然后给她抱抱，安抚一下，等她情绪稳定些，再讨论如何解决。如果跳过接纳这一环节，而直接给她解决问题的建议，那么她就会觉得自己的感受被否定了，被忽视了。失去了调节这种情绪的机会。


    # 3.孩子玩拼图容易分心，是太难了吗？


    我孩子2岁4个月，不到2岁开始玩拼图，从4块玩到42块，可是最近不爱拼了。我在想是不是难度大了他放弃了，但稍微引导他可以靠自己快速地完成，我们会给他肯定和鼓励。

    但更多的是过程中会跑开玩其它的东西，主动性和持续性相对弱些，虽然够得着，但是不够专注，怎么样对待这个问题呢？


    Dr. 魏

    宝宝能够在你们稍微引导后快速完成拼图，说明这个拼图难度并不是很大。我在文章中说，如果任务太难，宝宝会进入恐惧区；相反，如果任务容易，宝宝会进入无聊区，兴趣就下降了。不妨试试难度更些的拼图。

    不过，也有可能是宝宝暂时对拼图本身的兴趣比较低。我都知道，如果经常吃同一家餐馆，即使餐馆菜系很美味，也会吃腻的：先换一家，过阵子再来，又喜欢吃了。

    玩也是同样的道理，宝宝已经玩拼图4个月了，跟随他的脚步，换换口味吧。


    # 4.孩子画画时，家长干预过多好吗？


    孩子画画的时候，大人不要干预他们比较好？比如我会放养孩子们，让他们随意画，然后问问他们画了啥，一起讨论表扬。孩子奶奶就会指导说这个要怎么画，那边少点啥，颜色不要涂到外去等等。

    我应该像奶奶那样做，还是让孩子自由发展想象力？


    Dr. 魏

    如果孩子画画时很投入，很享受，那么你的做法是非常好的。既让孩子专注'
