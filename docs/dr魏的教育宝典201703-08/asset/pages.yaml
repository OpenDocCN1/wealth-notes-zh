  md: '# 读者问答｜孩子不玩手游，无法融入集体怎么办？


    Dr. 魏


    # 下周预告


    5.29（周一）：孩子怎么过端午节？


    端午节在你的印象中是不是吃粽子、赛龙舟？而孩子的端午节应该有特殊的过法，比如边玩边学，我推荐一个游戏：读古诗。可孩子太小不识字怎么办？其实诗的好处不止是文字，下周一我教你一个方法，和孩子过一个特别的端午节。


    5.31（周三）：到底该不该让孩子在童话故事里长大？


    童话故事该不该经常讲？故事又该怎么挑？下周三，我给你几条实用方法，把最好的故事给孩子。


    # —— 本周问答时间 ——


    +   1. 利用电子产品查资料，这种快速获得知识的方式好不好？

    2. 孩子不玩手游，会不会无法融入集体？

    3. 联想性思维和发散性思维有何不同？

    4. 培养联想性思维的方法适合多大年龄的孩子？

    5. 玩具也能“混搭”玩？


    # 1.来自智力脑｜利用电子产品查资料，这种快速获得知识的方式好不好？


    有个问题想请教，我发现现在小朋友都很会利用电子产品查资料，我们家上四年级的老大大尤其擅长，但是我观察这种快速取rums的信息方式对小孩的个性会产生两个负面影响。


    第一是小孩缺少耐心，希望快速解决，一旦事情不如预期，就很容易陷入烦躁的情绪。第二是容易陷入资讯焦虑，太多讯息会让小孩常常不知道如何决定或是决定变来变去。例如为了要饲养一种甲虫，几乎看遍了所有甲虫的信息，然后一下子想养这个，过一阵子又看了其他资讯就想养另一种，而且常常会陷入不断寻找同类资讯却又烦恼不知道如何决定的焦虑。麻老师抽空给点意见，谢谢。


    Dr. 魏


    @笑笑 你好。你说家里小朋友依赖快速取ld信息，导致缺少耐心，面对大量资讯又容易焦虑，首先感谢你的细心观察。从认知神经科学的角度，我们将这种现象称为“认知超载”，指的是当信息输入过多，阻碍了信息处理和清楚思考的能力，就会发生这种情况。


    想要培养在挫折世界中茁壮成长的孩子，不仅在于让他接触多少信息，还在于教导他们如何配合大脑去思考，把简单的数据转变为知识、洞察力、专业知识和智慧。怎么才能做到呢？首先给孩子足够时间，让他能在洪水猛兽的信息流中停下来思考。


    然后，你必须掌管孩子信息流输入端的“接口”。负责控制孩子得到多少信息、得到怎样的信息、以你说的“甲虫”为例：


    +   1. 你可以让孩子谈谈，他知道的所有跟甲虫有关的信息。你可能会发现，你的孩子其实清楚地认识到，他也在为找这么多信息烦恼，他只是不知道如何处理这么多信息。理解他的现状，是缓解焦虑的第一步。

    2. 接着来你该发挥“接口”的作用了。具体就是带孩子明确，什么信息是重要的，什么不是。你可以一项项跟孩子讨论，哪些甲虫的特征是他最喜欢的，哪些又可以放弃，这时候不要怕麻烦，必须跟孩子达成一致。有过几次这种训练，孩子以后就知道自己的偏好，也知道怎么给自己的事情排优先次序了。

    3. 对信息接口合理的限制，帮助他们减轻压力。如果孩子还是取舍不了，那么跟孩子实际演示一下，很多他找到的信息只是分散了他的注意力，实际上会浪费他的时间，还会损害他对甲虫的喜爱。

    这样跟孩子一起计划，帮助他将他的投入减少到一个可以管理的水平，孩子也就不再那么焦虑了。


