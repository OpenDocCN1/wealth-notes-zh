    # 第17期金牌家长：emily pan


    上期的思考题是请你设计一段亲子对话，帮小贝回忆他的一天。咱们的第17期金牌家长我认证 @emily pan，这位宝妈根据我给的自传体对话三要点，设计了一段精彩的对话，下面我跟你分享一下：


    首先，妈妈先提问带“W”的具体问题，并讨论一下孩子的情绪：宝贝，今天在幼儿园有什么开心的事可以和妈妈分享啊？


    小贝：妈妈，今天我的画被老师表扬了。


    妈妈接着问细节：宝贝画画的时候一定特别努力和用心，妈妈真替你开心！你画的是什么画啊？


    小贝：我画了一只米奇老鼠。


    妈妈最后肯定一下：哦，妈妈知道你最喜欢米奇老鼠了。午睡你睡得好吗？其他小朋友都按时睡午觉了吗？


    小贝：小明没有按时睡，他一直 在床上跳舞。


    妈妈接着引导：老师批评小明了吗？


    小贝：老师把小明叫到外面 哭了一会儿，后来小明回来就安静入睡了。


    妈妈这时候引导小贝评价这个行为：宝贝，咱们午睡的时候，能像小明那样蹦蹦跳跳吗？


    小贝：妈妈，我觉得不可以的，因为其他也要睡觉，会影响别人休息的。


    看到小贝开始有同理心，妈妈开始引入社会规范的概念：对的，宝贝理解很正确哦，幼儿园是公共场合，不是在家里哈，在家里也要看看爷爷奶奶是不是在休息哦。


    # 如何布置玩具角？


    1个观点：

    孩子天生爱游戏，他们在游戏中发展语言、构建知识、练习社会技能等。在儿童时期，游戏活动对大脑发育，以及之后的人类机能发展都会产生积极影响，布置合理的玩具角，要靠家长来发力。


    +   特效药：

    1. 玩具种类要均衡

    2. 根据孩子的特殊情况，做空间区分

    3. 摆放有规律，跟孩子一起研究摆放方式


