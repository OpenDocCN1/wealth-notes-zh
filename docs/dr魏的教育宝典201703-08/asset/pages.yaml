    一直以来，关于男女智力到底有没有差异，学术界吵得不可开交，哈佛大学前校长劳伦斯·萨默斯甚至还因为涉嫌歧视女性被迫辞职。


    但在这个空间智力上，学术界算是达成了一致，还是男性的空间认知要稍微好于女性。不是人类，别的小动物上，也是雄性的空间能力要好于雌性，这么看来，女生路痴似乎是有科学依据的。


    玩笑归玩笑，你可能开始好奇了，这个空间认知到底是什么，为什么想象旋转几个立体图形这么重要？


    当我们在心里想象怎么来旋转这些立方体，我们是在用“心灵的眼睛”去看，去形象化一个物体。


    # 空间认知影响科学、建筑、医学以及艺术多个领域


    这种能力在很久之前就影响我们人类了，我们第一个学会制作石器的老祖先，是先在心中想象出斧头的形状，然后才能做好工具；米开朗基罗看着见一块石头，他能在心中想象，如何才能把它雕刻成大卫；生物学家沃森和克里克发现DNA结构的时候，是靠着二维分子图来想象它的三维模型；建筑师建造摩天大楼，要预计各种力会怎么来影响建筑结构；神经外科医生看着大脑磁共振的平面图片，能判断出肿瘤的具体位置。


    有了空间认知能力，我们在大脑里就可以想象不同的视觉形象，并对这些形象进行操控，比如前面空间旋转的例子中间，靠想象对3D物体进行旋转操作。总之，空间认知能力对我们科学、建筑、医学、艺术等各个领域来说都很重要。


    而且，空间认知跟数学的关系非常紧密。脑科学已经发现，大脑对数量的表征和对空间的表征密不可分，甚至在大脑区域上都有很大的重叠。可以说空间能力是数理能力的重要基础，也是所谓STEM教育的核心之一。STEM
    是 S (science)、T(technology)、E(engineering)、M(math)的缩写。


    虽然空间认知力这么重要，但我们回想在学校、在教育中，我们有阅读和写作教育、数学和科学教育，可是我们很少练习空间认知。而脑科学告诉我们，空间能力是可以靠后天练习来提升的。空间认知的可塑性很强，通过空间认知训练，孩子能发展在这个领域的潜力。


    比如前面提到的空间旋转能力的男女差异，这个差异完全可以用练习来弥补。


    2010年有一项研究，同时训练男孩和女孩的空间能力，给他们做一些图形或者空间旋转的测试题，女孩虽然一开始不如男孩，但是仅仅几周的训练之后，女孩的成绩就赶了上来，男女的空间智力都提升了，他们之间原本的空间能力差异也消失了。


    既然空间智力的训练对男女娃娃都这么有效，你是不是已经有些期待了？接下来我就教你几种有效发展孩子空间认知能力的方法。对，我们从婴幼儿教育就可以下手了。


    # 1.多用空间词汇


    我之前说过数学即沟通，空间认知能力也是一样，也能通过跟孩子沟通、问孩子问题，给激发出来。


    这里的一个关键是输出词汇，词汇是搭建思维城堡的砖块，特别是对空间认知而言。空间认知与空间词汇之间有明确的关系，孩子的空间类词汇掌握得越多，他们的空间认知也越好。


    有一项实验，研究人员先给一组婴儿听有很多空间词汇的句子，比如“我把卡片放在中间的架子里面”，另外一组给婴儿听不含空间词汇的句子，比如“我把卡片放在这里”，最后给孩子们做空间认知测试。


    研究人员发现，听到更多空间词汇的那一组婴儿，他们的空间认知分数都更高，而且过几天再做测试，空间词汇组的孩子还是表现得比较好。孩子暴露在丰富的空间词汇中，他会更关注周围的空间位置信息，他对空间的理解也更深了。想要提升孩子的空间认知，先要孩子认知空间。


    我平时会故意跟女儿强调一些方位词，比如问她：“宝宝，能不能帮我把地上那本书放到桌子上的右边啊？”“能不能帮我把袋子里面的蔬菜，拿到榨锅中间的大瓢里面？”带孩子出门的时候，也会故意引导她注意一下方向：“宝宝你看，超市在家的右边，幼儿园在家的左边。”


    你看，这些问题看起来简单，只是包含了像是“上下”“里外”“左右”这些空间词，但是孩子们靠着这些场景中的词语线索，就能去推理“上”的相反方向是“下”，它们在三维空间里是垂直的这种对应关系，孩子的思维一下子立体了起来。更大一点的孩子，还可以在外出的时候，教他们东南西北的方位。


    # 2.多玩结构类玩具


    我之前看到家长留言，问该不该给孩子买乐高？乐高是一种结构类玩具（construction toys）。孩子可以利用这些玩具搭建各种各样的形状。结构类玩具是少数心理学家进行过深入研究的游戏玩具。


    2016年有脑成像研究发现，只不过是让一群孩子玩5次结构玩具，每次30分钟，12天后研究人员再测孩子们的大脑，发现孩子大脑里记录空间关系的叶颞区更加活跃了，而且孩子们的心理旋转测试也进步了。


    心理学家发现，结构类玩具能够有效培养孩子的精细动作、发散性思维、语言能力和空间认知能力。听书典的聪眀家长都该对前面几种能力很熟悉了，所以，如果你要花钱给孩子买玩具，结构类玩具是一个明智的投资。


    当然了，也不是必须买乐高。善用积木类玩具、橡皮泥类的玩具，都可以让孩子自由组合出各种形状，达到玩结构玩具的目的。


    无论孩子玩哪种玩具，你都可以把前面说的空间词汇加上，和孩子聊天，“你把这块积木倒转过来试试看？”运用空间词汇多沟通，帮助孩子空间认知升级。


    # 3.用“寻宝”小游戏互动


    除了聊天、玩玩具，还可以通过各种游戏来锻炼孩子的空间认知能力。比如我在家里经常跟女儿玩“寻宝”的游戏。首先我会在家里的某个房间藏好一个玩具，比如女儿的玩偶熊。然后我会跟女儿一起，画一幅家里的平面图。不用担心孩子太小，大多数3岁左右的孩子，已经具备学习简单地图的能力了。


    我会引导女儿自己来解释这个平面地图，问她：“这个长方形是什么呀？”女儿说：“是客厅。”“这个长方形右边的小正方形是什么呀？”女儿说：“是厕所。”我接着问：“厕所的对面是什么呀？”她抬头想了想说：“是爸爸妈妈的房间。”孩子解释完一通之后，我再把藏玩具的房间讲出来，让她对照着地图去找。


    随着女儿长大，她关注的地方也越来越细致，我会升级“寻宝”的难度，提高藏宝图的精细程度。我可能会把玩具藏在客厅里的一个角落，然后跟她一起画客厅里更详细的平面图。她会说：“这个长方形是电视，电视左边的圆形是花瓶，花瓶的...'
