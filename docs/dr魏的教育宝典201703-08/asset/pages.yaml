  md: '# 家长分享｜习惯养成篇


    Dr.魏


    我经常在专栏的留言区和学习小组，看到很多宝爸宝妈这样评价自己：“新手上路，牌照全无”，家长们往往觉得自己不够好，生怕耽误了孩子的成长期。


    我想告诉你，在你成为父母的那天起，就踏上了另一条与工作并行的学习道路，不经意间的一个举动、想法，都可能给孩子带来额外的成长和收获。


    接下来，我邀请了两位专栏的金牌家长@阿牛妈妈和@金谷子，看看他们在培养孩子的好习惯这件事情上，有哪些独特的心得和方法？


    ![](img/8dd4b172abeef48fa291369820efe392_139_0.png)


    # | 第001期金牌家长-阿牛妈妈


    # 关于帮助孩子养成好习惯，我分享一些自己的看法


    养成一种习惯确实不是件容易事，尤其对于自律能力较弱的孩子，需要家长有意识的引导，但每个孩子的特点不同，引导方式、方法也不同。


    这就需要平先对孩子进行仔细地观察，然后找出她的特点，寻找沟通途径和引导方式。


    比如早上起来，除了吃饭之外，刷牙、洗脸、大便，这是我要求阿牛出门上学前的三部曲，每天雷打不动，全部完成才能出门，但是大便这件事情她常常是不愿意执行的。


    # （1）立足实际，抓住孩子的个性情况


    针对她平時有较多的知识积累，又有足够的理解力和分析力，所以，我首先和她仔细讨论了不排便的危害，甚至还一起画图来图解这些道理。


    # （2）顺口歌谣来帮忙


    这样的沟通之后，我们约定了简单明了的口令：“一二三跟我念，刷牙洗脸和大便”。由于她很喜欢童谣和押韵的诗词，所以对这个口令很感兴趣。


    有了事前的沟通，加上专用的口令，现在她偶尔不想完成的时候，我就站在卫生间门口大声念：“一二三，跟我念…”，她自己笑一笑，一边接下一句，一边就自己钻进卫生间了。


    虽然这并不是什么很了不起的习惯，但这个小小的习惯养成，让我找到了一条好用的方法。其实对孩子和对我们自己都是一样的，想长久的保持一个好习惯，除了想明白道理之外，有时也需要给自己一个喜欢的入口，一切就顺理成章了。


    在陪伴孩子成长过程中不断摸索，想法不一定成熟，分享出来，希望得到老师和其他家长们的指正。


    # | 家长推荐阅读


    +   《044｜怎样帮助孩子识字？》

    《063｜如何帮助孩子养成好习惯？》


    ![](img/8dd4b172abeef48fa291369820efe392_139_1.png)


    # | 第002期金牌家长-金谷子


    我是金谷子，感谢叨魏，让我成为专栏第2期的金牌家长。接下来，就跟大家分享一下我和宝宝卷卷，关于好习惯养成的一些小窍门。


    我特别喜欢孩子，但对于养孩子，自己确实是个新手，正如Dr.魏在文章里说的，每个孩子都是小天才，我很赞同。他们每天见到的东西，都是新的、令人好奇的，因此特别喜欢用手、用嘴，去碰触。


    # 1.改掉乱吃东西的坏习惯


    # （1）耐心引导，可以用“手势+表情”向孩子传递信息


    我家的小朋友卷卷自从学会走路，就开始“一路”探索。


    首先是碰到东西就咬。我和孩子妈妈看到后，会蹲下来告诉她，“把这个给爸爸妈妈吧，这是什麽东西啊？”，她会把嘴里东西吐出来，放在我们手上，有的是石头，有的是衣服边的线头，还可能是塑料、纸盒，瓜子壳等等。


    见到一次就教育一次，但是光说，她其实听不太懂，我们就想出了用“手势+表情”来表达。比如，模仿她把瓜子壳放在嘴里，然后表现出很痛苦、难受的表情，并用手势摇动，表示“不能吃”。我们会反复给孩子表演，让她逐渐戒掉乱吃东西的习惯。


    # （2）查找根源，寻找替代物


    后来，家里的巧虎玩具和儿童书籍增加了，她也会用嘴去啃。记得有本书，边角都几乎被她啃圆了，虽然啃书不舒服，可她还是要一啃，我就想到“估计孩子要长牙齿了”。我给孩子买了磨牙棒，是橡胶的，这样她就拿着磨牙棒开始咀嚼，终于不吃书了。后来我发现，父母就是孩子的试金石啊。


    # （3）可以利用孩子“模仿”的心理，培养好习惯


    孩子大一些，会开始模仿大人的行为。比如我起床、穿衣服的时候，会舞动手臂、系鞋带，她也会蹲下来，摆弄自己的鞋。


    有一天，我站在洗漱间刷牙，她扶着门框在旁边看着，看着我把奇怪的东西放在嘴巴里，因为她自己也有磨牙棒，她就开始哼哼呀呀～，要她的磨牙棒，然后像我一样放在嘴里摆弄。


    在此之前，我在睡前刷牙的时候，会在孩子面前展现“刷牙”这件事，比如，让她闻闻牙膏的味道，用小手触摸泡沫等等，所以我们顺其自然的给她买了儿童牙刷和牙膏。


    我也会用想象的方式，让孩子坚持刷牙，比如，把牙刷比做动画片里的金箍棒，舞过来、弄过去，然后把牙刷在嘴里刷了几下，就开始漱水（嗽口）等等。


    # 2.乱扔玩具的坏习惯


    # （1）对于小宝宝来讲，“说得多”不如“一起做”


    孩子乱扔玩具，是很多家长经常遇到的头疼事。


    孩子玩过玩具后，要学会收拾，刚开始的时候，大人需要帮忙，引导孩子一起收拾，孩子还小，并没有意识到玩具需要收拾好。


    对于我这样有“洁癖”的人来说，“凌乱”是很烦人的事，怎么办呢？我开始带着孩子一起收拾玩具。


    +   我会拉着她的手说：“卷卷，这不是你的玩具吧”？

    她嘴里哼着回应：“呃”。

    我说：“那你的玩具，就这样放着么”？

    她还是回应：“呃”。

    我说：“我们是不是可以收拾一下呢”？

    她还是回应：“呃”。


    但是经过这样的交流后，她不会主动收拾，也不懂这样说的含义，于是，我就陪着她，把玩具一个一个收起来。


    +   接下来，我会说：“卷卷，那跟爸爸一起收拾吧”。

    她就蹲下来，比我收拾还勤快。

    收拾完了，我说：“卷卷表现很好”。

    她自己也很高兴的鼓掌。


    # （2）在“玩”中培养习惯


    至于收玩具的方式，可以头脑风暴下各种游戏，比如我之前跟大家分享过的，就像玩投篮游戏一样，近距离把玩具丢进玩具篮子。


    通常父母对孩子有很强大的耐心，甚至一直在挑战自己的忍耐极限。但你在磨炼孩子的耐心时，其实也是在锻炼自己。


    今天就分享到这里，感谢叨魏在百忙之中，为我们读者分忧解惑。


