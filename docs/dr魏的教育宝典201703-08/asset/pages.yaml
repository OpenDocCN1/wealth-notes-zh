  md: '# 周末加餐｜直播总结，你可能错过了这12个问题


    Dr.魏


    本周四（5月11日），我在「得到」做了第一次《Dr.魏的家庭教育宝典》的直播，我对留言区的很多问题，做 консистен常加解耦，若很开心/很荣幸。希望在接下来的时间里，我可以和5万照明爸妈一起，陪伴你、给你出谋划策。


    今天，针对一些错过直播的聪明爸妈，我梳理了直播中遇到的12个典型育儿问题。当然，如果你全程看了直播，那我们一起来再做个回顾。


    # 问题1｜孩子发脾气家长怎么办？


    孩子不发脾气才奇怪，小孩子都会发脾气。我给大脑做一个比喻：你将手掌握拳、拇指包裹在掌心，外面是脑皮层，内部就是情绪脑。


    孩子的大脑发育不均衡，会造成的管情绪喊起的那部分，更比管理智的那部分发育得快得多。


    因此，控制情绪的理智脑发展得更慢一点，这很正常。这时候你怪孩子不讲理，就跟怪孩子为什么不能一出生就会自己穿衣、吃饭，走路一样。


    # 问题2｜2岁左右的孩子一直哭闹，该怎么办？


    对付小孩无法控制的哭，要给孩子安全感。抱孩子的时候要全手抱，大一点的时候后可以讲道理，情绪失控时，要帮助孩子分析情绪，用语言描述自己的情绪，理智脑的一部分就是语言，这个步骤很重要。


    # 问题3｜如何增进父亲跟孩子的关 系？


    在孩子小的时候，吃喝拉撒不需要他，怎样增强爸爸对孩子的参与感？爸爸需要怎么做？


    # 1.避免“母亲守门效应”，给爸爸多一点时间


    我们传统观念中，女主内男主外，养孩子是母亲的事情，这是错的。


    # 2.爸爸带娃，要给他自主权


    # 3.请妈妈们给爸爸明确简单的指令，多多鼓励他


    # 问题4｜父母不要停止学习


    孩子的年龄和你身为父母的年龄是一样的，父母在养孩子这件事情上走了弯路，是不可逆的。


    # 问题5｜如何培养孩子的学习兴趣？


    0~6岁的学前时期，是大脑飞速发展的时期，父母给大脑的刺激决定了孩子大脑的发育。我们需要让孩子学习这个阶段需要的东西。比如，你想让孩子弹钢琴，但小孩没有兴趣，你如何让他
    reso ...


    # 问题6｜常言道“严父慈母”，这个说法到底好不好？


    “严父慈母”是传统观念，母亲更加慈爱一些。但是我们不需要分割，你为什么要当严父，如果不严格就不会有规矩，如果不慈爱就不会有温暖，但没有必要把它定格。


    # 问题7｜什么时候学外语最合适？


    研究表明，从小学习外语的小孩，说话是没有口音的。因为我们的大脑是生活环境的塑造，单语环境长大，你的发音就会受限制。单语环境下长大，你的听觉也会被环境塑造。小孩从小就学习多种外语，这是很好的。语言发育处于敏感期，这个敏感期是比较早的。


    # 问题8｜头脑简单、四肢发达，对不对？


    当然不对。这是对运动员的偏见，在育儿上面，恰恰是相反的。你如果运动能力强，你在各项认知能力上都会更发达，我们对小孩大脑的发育，太强调学术能力，不注重其他能力。


