    # 孩子发脾气，我该怎么办？


    情绪脑 | 坚持这三步，搞定...


    Dr.魏


    孩子发脾气，是家长最大的烦恼之一。但因为我是研究人类大脑的，所以每次孩子闹情绪，我一点都不生气，因为我看到的是一次又一次大脑整合的机会。


    不要对孩子要求太苛苛，孩子发脾气因为Ta们还只是个孩子。


    为什么孩子会动不动就哭闹呢？其实是因为他的大脑发育是不均衡的，就是管情绪的那部分要比管理智的那部分发育快得多。我们成年人，也会遇到各种不顺心的事情，但你会用自己的理智来调节，比如你自己心里可能会这么想：“老张不借钱给我，我有些生气，但是他大概也有自己的难处吧。”“比赛输了，我很难过，可谁叫我技不如人呢。”或者你会抑制自己的冲动，“老板这简直就是故意为难我，可我还是忍了County。”


    但孩子不一样，他的理智脑要到20岁以后才完全成熟，情绪脑就发育得比较快，你看你家孩子，很小就会喜怒哀乐，各种基本情绪都有了。所以，当他情绪上来时，他的理智脑管不住，没法跟自己的情绪脑说道理，也就没法抑制一连串的冲动，就容易发怒了。


    所以，我女儿发脾气时，我不会生气，因为我知道那不是她不懂事，而是她大脑还没有发育到那个阶段。这时候你怪孩子不讲道理，就跟怪孩子为什么不能一出生就会自己穿衣吃饭走路一样，其实是你自己不讲道理。


    那么，怎样才能促进孩子的理智脑发育呢？很多家长会大火力训练自己孩子的认知能力，什么记忆啊，逻辑啊，推理啊，认为这些能力跟理智脑相关。但他们却不知道，其实理智脑的发育，也需要情绪脑的支持。


    有一个真实的医学案例，针对的是情绪脑受损的人。这个人不论是对奖励还是惩罚，都没有多大情绪反应，就像一个非常超脱的人。假设他跟你玩抽牌游戏，面前排着两叠纸牌，每一叠纸牌中既有中奖牌也有惩罚牌，你们俩随机抽一张，然后猜一猜，中奖率大的到底是哪一堆牌？让我们猜一下，你跟他抽的话，谁更可能赢下这次猜纸牌的游戏？你可能会觉得理智和情绪没有关系，所以这个情绪脑受伤的人，和你比拼的时候，双方赢的几率是相近的。


    > 《Dr.魏的家庭教育宝典》查询结果

    坚持三步走，让孩子学会描述、思考、反思情绪


    # 1.描述情绪


    每次我女儿发脾气的时候，我就慢慢地跟她说：“你现在的感觉是什么？”“你是生气吗？”“你为什么生气呢？”当孩子回答我的问题的时候，用语言来描述情绪的时候，也就是她对自己情绪进行定义的时候，这时候大脑的思考，和语言的使用，能帮助她理解自己的情绪，有利于安抚她安静下来。


    ![](img/8dd4b172abeef48fa291369820efe392_4_0.png)


    # 2.思考情绪'
