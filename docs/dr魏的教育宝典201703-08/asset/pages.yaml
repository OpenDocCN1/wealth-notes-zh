  md: '# 运动脑｜孩子学走路慢怎么办？


    孩子学走路慢怎么办？


    # —— 5.11直播问题征集 ——


    # 本周大彩蛋：Dr.魏要来得到直播啦！


    时间：5月11日（周四），晚8点


    主讲人：Dr.魏


    观看方式：周四晚8点，通过得到首页进入直播间观看


    问题征集：班级争取代到问答福利。从今天起，我将在文章下方的留言区收集你的难题，转交给Dr.魏，直播当天会选出精彩问题，“面对面”帮你解决


    问题类型：情绪脑｜语言脑｜智力脑｜运动脑｜创意脑


    欢迎各位聪明爸爸妈妈积极留言，贴出你亟待解决的问题！


    Dr.魏 记得我大女儿才七八个月到一岁多的时候，我常带她出去玩，有时候遇到其他父母，他们的宝宝跟我女儿差不多大，看见我女儿在那里爬，或者摇摇晃晃地走路的时候，就总是会问：“你家宝宝多多大啊？”


    我告诉他们之后，他们就会羡慕地说：“啊呀，你家宝宝的运动能力真强！都说七坐八爬，十站周走，可是我孩子一直滞后，九个月才会爬。现在都一周岁加一个月了，还不会走。我真的是担心死了，他是不是运动发育迟缓，发展有问题啊？”说实话，别人这么夸我宝宝，我心里还是很开心的。不过，我接着就如实告诉那些家长：“哎，你不用担心，七坐八爬，十站周走，那是大宝总结的经验之谈，你宝宝没那么快，完全没问题。”


    其实90%的孩子能在5-9个月的时候学会坐，在5-11个月学会爬，在9-16个月学会站，在9-17个月学会走路。所以孩子超过了一岁不会走路很正常，在9-17个月学会走路都是正常的。


    虽然，并没有研究表明宝宝早点坐、爬、站、走的能力跟他后来的智力有关，但是早点发展坐、爬、站、走的能力，还是有好处的。美国儿科协会会指出，如果孩子在1岁之前还没有开始学走路，那么应该在1岁开始的半月内，来学习走路了。


    # 孩子早点学会走路，有助于更早认识世界


    我在前面强调过，大脑的发展是用进废退，如果孩子能早点坐起来、站起来，他就能看到更多的世界，给大脑更多的视觉刺激。早点爬、早点走，不仅能体验到运动的快感，刺激肌肉和运动神经回路的发展，而且那种能指挥自己身体的快感，还能四处探索未知世界的能力，也能极大地鼓舞孩子的自信心，让他变得更独立，给大脑提供更多刺激。


    > 《Dr.魏的家庭教育宝典》的查询结果

    学走路很重要，培养宝宝的平衡能力更重要


    很多家长知道想要孩子做个走、跑、跳样样好的运动宝宝，既要锻炼他的大运动能力，又要锻炼精细运动能力。我今天想特别强调的是，很多家长为了让孩子快点学会走，可会忽视孩子抬头、翻身、坐、爬等这些基础能力的培养。你要知道，宝宝的坐、爬、站、走是一个顺序渐进的过程，早期学会的动作，比如抬头、独立坐和匍行都是后面帮助宝宝顺利站、走的基础。


    也就是说，想要宝宝走得稳，也要看宝宝的坐、爬等基础能力有没有发展。有的家长怕宝宝学会走路比别人晚，宝宝还没有学会好好坐稳，或者还没好好练爬，就急急忙忙想拉着宝宝练走，这是一种拔苗助长。


    # 为什么说宝宝的这些基础运动发展的阶段特别重要？


    我举个宝宝翻身的例子。大部分的宝宝在五个月半之前学会翻身，你会发现你家宝宝变得特别喜欢翻身。他特别喜欢练习这个新学到的技能，几乎宝宝学会翻身之后的10个星期里，他都会反复练习这个技能。


    # 1. 正确做法：摇一摇，培养宝宝平衡能力


    # 2. 需要注意：适度培养，不要用学步车


    为了帮助孩子发展运动能力，不能做什么？'
