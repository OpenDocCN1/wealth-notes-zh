- pgno: 5
  md: '这时候我抓住机会，我再次表示理解：“是的，你记忆捏好的，肯定是收拾了，可能是妈妈重新整理了箱子。爸爸能理解，要是有人误会了爸爸，爸爸的怒怒也会跳出来的。”然后我张牙舞爪地装成一个怪物在吓她，说：“你知道我的怒怒有多厉害吗？她跳出来的时候可吓人了！你猜她是什么颜色的？”


    女儿说：“红色的！”这时候她已经被我逗得哈哈直笑了。我说：“对，我的怒怒也是红色的。”


    女儿继续说：“都是你的错，你要说对不起。”


    我说：“好，如果妈妈回家说是她收拾的，那就是爸爸的错，爸爸一定给你道歉，而且是笑着说。”我再次表示理解之后，孩子就更加平静了。


    # 3.回顾并反思发脾气的过程


    现在可以开始进行第三步了，就是帮她反思整个发脾气的过程。我说：“那我问问你，如果玩具找到了，我们也知道了不是你忘收拾的，我们俩之间的问题解决了么？你会高兴么？”


    她说：“当然解决了，我会高兴的。”我说：“但是，如果你没有发脾气，而且是好好跟爸爸说是别人收拾了你的玩具，爸爸也不会责怪你啊。爸爸一直都讲道理，对不对？”


    我女儿点了点头。


    我说：“所以，生气也不会帮你解决问题，对吧？看你的眼泪都出来了。”


    我抓紧机会进一步地帮她反思一下：“而且你对爸爸发火，爸爸也很難受。你能感受到爸爸的不高兴么？”


    她看着我脸上的表情，我装的“难受”和“严肃”表情，她就点了点头。我知道，在她点头的时候，她已经在学习体会别人的感受了。


    听到这你应该理解了，对付这种暴怒的小孩，有三个步骤：一是表示理解，帮助描述情绪，二是和他们一起分析发怒的原因，三是引导孩子反思整个过程，并指出发怒并不会解决问题，而是沟通解决问题，并引导他们体会他人的感受。


    灵活运用这三步，巧妙引入心理认知疗法


    运用这三步，其实是对孩子进行了一次心灵的按摩，说得专业点，叫做心理认知疗法。心理学发现，人的情绪不是来自于事件本身，而是来自于你对这个事件看法。比如，如果你认为自己被别人误解了，你就会很生气。但如果你认为，这个误解的原因，只是因为大家沟通的时候出现了偏差，有些事情互相没讲清楚，那你就不会那么生气，而会积极地化解误会了。


    在上面的案例中，究竟是什么让孩子不生气了？首先是认知，你改变了孩子对事件的认知，也就改变了他的情绪。当然，有的时候孩子不是因为误解而生气，纯粹就是发脾气，闹情绪，这时候我会选择多等一等，等他的头脑发热劲儿过去了，再和他进行上面这样的对话。


    Dr.魏的小“叮叮”


    教孩子千万别贪心，孩子不是机器人，只要一次设定指令，就能够一辈子管理好自己的情绪。情绪管理是个过程，而你需要做的是，理解孩子的生理发展过程，给他们耐心，并坚持用正确的方法帮他们引导情绪。


    +   1. 要促进孩子的理智脑发育，不仅仅是让他进行记忆、逻辑等这些纯理性的练习，还要借助孩子发脾气的好机会，让他“描述情绪”、“思考情绪”、“反思情绪”。


    +   2. 让孩子理解自己的情绪，分析情绪发生的源头，并且学会反思自己，同时体验他人的感受，只有这样，情绪和理智才能整合得更好。


    听完这期节目以后，欢迎在评论区给我留言，讲讲下次孩子发脾气的时候，你是怎么做的。因为每个孩子都是独特的，希望大家按照上面的步骤，想出你自己的好方法来。


