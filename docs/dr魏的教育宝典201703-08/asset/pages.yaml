    # 你在过度养育吗？


    Dr.魏


    我前一阵子带女儿在公园里玩，她在那里玩滑梯，一个人玩得很开心，我就坐在旁边的凳子上看着。有一个和她年纪差不多的少女孩子，也过来跟她一起玩，结果两个人同时来到滑梯的入口，你看看我，我看看你，都想先玩。


    我觉得挺有意思的，就继续观察，看她们怎么解决这个问题，结果那个少女孩子的妈妈已经先冲过去了，问她们俩：“你们谁先到的？哦，同时到的吧？那你们刚才谁先滑的吧？哦，你先滑的吧？那这次就让她先滑唉！”


    你看，她解决得很公平，对吧，但是其实我心里是有点遗憾的，因为我本来是希望让这两个小朋友自己商量，看能不能自己商量出个办法来，甚至可能都没有这位妈妈提出来的方法公平，但是没关系，这可以锻炼孩子们自己协商解决问题的能力。


    # 过度养育是指家长对孩子的成长干涉过多


    这位妈妈，在我看来，就是犯了个过度养育的错误。就是对于孩子的成长太过投入了，过多地干涉了孩子的生活，这个反而不利於孩子的成长。


    # 典型过度养育的三个表现


    典型的过度养育，它有三个表现，第一是对孩子过度保护，总担心孩子会出事，第二是对孩子过度帮助，总觉得孩子能力不足，第三就是代替孩子做决定，总觉得孩子离了自己就会犯错误。这样的家长，就像直升机一样盘旋在孩子上空，随时准备俯冲下来，解救孩子于水深火热之中，所以有人就给他们取了个形象的绰号，叫“直升机型父母”。


    > 《Dr.魏的家庭教育宝典》的查询结果

    过度养育，伤害孩子


    # 1. 你孩子是不是遇到问题都来找你？


    # 2. 你孩子是不是很容易被困难打败？'
