    Dr. 魏


    这位家长说的是孩子有自闭症症状，建议到专业医院进行评估诊断、寻求有针对性的专业辅导。先给大家简单介绍一下自闭症是什么。它是一种由先天神经系统受损而引起的发展障碍。


    根据美国最权威的精神医学诊断手册 DSM-5，自闭症的生活行为包括：


    +   1. 社会沟通和社會性互動方面有質的缺陷。


    +   2. 狭窄反复固定的行为和兴趣。缺少目光接触、不理人、不怕陌生人、不容易和家人建立亲密关系、缺少模仿学习、无法和小朋友玩、难以体会别人的感受和想法，就像是来自外星球的孩子。


    目前我们对自闭症的原因还没有定论。以前认为是因为父母的教养方式造成的说法是不成立的，更可能是因为脑部多个部位受损所致。


    自闭症虽然无法治愈，但是及早干预，很多行为问题能够得到明显改善。目前国际公认最有效的干预技术是应用行为分析（ABA）。ABA有一系列的技术和原则来帮助自闭症患者学习有意义的行为，减少自残、攻击等不良行为。


    举个例子，一般孩子能够轻易学会的事儿，有自闭症的孩子可能需要反复学习二三次才能掌握。ABA会帮助孩子讲各种概念或将技巧拆解得更细，帮助孩子练习。研究表明，接受长期高频的ABA训练后，有自闭症的孩子各方面的能力都会有显著的提升，基本技能如看、听和模仿，更多的技能如阅读、对话和理解他人的想法等。


