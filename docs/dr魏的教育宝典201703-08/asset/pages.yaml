  md: '# 读者问答｜协调感官能力，激发孩子好奇心


    Dr.魏


    # 下周预告：


    5.22（周一）：利用联想性思维游戏，提升孩子的创造力


    专栏开始的时候，我讲过一期创造力的内容。提到创造力的关键是激发大脑暗能量，同时我给出了一些激发大脑暗能量的方法。创造力的一个关键方面，是联想性思维，那么该如何利用它？下周一，我给你几个实用方法。


    5.24（周三）：宝宝能从电子产品中学到什么？


    市面上，儿童教育类的各种电子、科技产品特别多，有些家长想用电子产品帮助孩子学习。但宝宝真能从这些电子产品中学到那么多东西吗？下周三我为你揭秘。


    # —— 本周问答时间 ——


    Dr.魏与隐隐爸爸们一起解决6个问题


    +   1. 指读要坚持到多大年龄？

    2. 什么是点读笔的正确使用方法？

    3. 孩子只爱听故事、不爱阅读怎么办？

    4. 阅读时如何导读？

    5. 有没有婴儿专属的“博物馆”浏览方式


    # 1.来自语言脑｜指读要坚持到多大年龄？


    指读要坚持到多大年龄？指读时孩子基本是一个字一个字地在看在读。如果随着孩子越长越大，指读会阻碍阅读速度吗？


    尽管可以要求提高手指速度，但是眼睛的速度一定比手快，所以手指文字的速度很大程度上上限制了眼的阅读速度。


    Dr.魏


    这是一个好问题。在阅读早期，孩子需要指读帮忙，养成阅读要看清楚字、从左到右读、不跨行的习惯，随着他们长大，阅读经验丰富，这些习惯养成后，速度上来了，手指跟不上眼睛速度，会影响阅读速度。


    指读时间不是由年龄决定的，而是看孩子具体的情况。他阅读时是否不漏字、跳行，理解到位？他指读速度是否很畅，速度比较快？如果是，那么就可以引导他减少对指读的依赖了。但指读是辅助工具，如果遇到难以理解的文字，或者看外语、阅读有困难，指读有助于孩子理解，也不妨用起来。


    # 2.来自语言脑｜什么是点读笔的正确使用方法？


    你好，很感谢有这一期内容。我家宝宝快二岁了，有几个疑问:1.我们家说的 diversas, but image text: 我们家说的是粤语，但是书本的内容几乎都是普通话的描述，这跟粤语有很大差别。平时我们读书的时候都是用粤语表达的，现在改用普通话，还是继续用粤语直接读出来？


    2.关于外语，我发现网上有种叫点读笔的东西，配合一些国外教材，可以让孩子自己听，这个看上去跟真人指读差不多，都是让孩子一个个字识出区别。但好像欠了点什么，或者请老师指导一下点读笔的正确使用方法。谢谢。


    Dr.魏


    你好，粤语无法和书本上的文字一一对应，培养孩子的字形意识会打折。孩子同时学粤语和普通话是在能力上能够接受的，但具体到识字，是要看这样做要看你们家的培养理念。


    指读也好，使用点读笔也好，都是为了提高孩子的字形意识，锻炼孩子自主阅读的能力。不过，宝宝还小、自控力不足，如果没有大人指导，使用点读笔可能会干扰孩子的自主阅读。


    除了能帮助孩子集中注意力，指读的另外一个好处是爸爸妈妈可以随时跟随孩子的学习情况，给反馈。反之，如果给孩子点读笔然后爸爸妈妈就撒手不管了，那么对孩子的注意力可能起到反作用。


    比如孩子阅读时，一些点读笔会发出强烈的声音、色彩等，这些功能一下就打断了孩子的注意力，影响孩子去理解图书本身的内容。还有一点，点读笔也无法监控孩子读书的进程，孩子可能不按顺序翻书，跨页去找自己觉得有趣的内容而忽视了对故事的理解。


    所以，如果要给孩子使用点读笔，那么在他使用点读笔的初期就要帮孩子形成好的阅读习惯，立下点读笔的使用规定。比如教他按照顺序一页一页翻书、认真阅读而不是去追求好玩的声音效果。


    # 3.来自语言脑｜孩子只爱听故事、不爱阅读怎么办？


    我女儿快4周岁了，亲子阅读从七八个月就开始了，可到现在对识字还不感兴趣，识字量才十来个，只是喜欢听我讲故事，因为家里书比较多，常常很难以重复阅读一本书。是不是这样导致识字量太少，而且我指读也在做，不过是从三岁开始指读的，因为之前怕早识字不好，现在又担心是不是太晚了，有点焦虑加困惑，请老师解答。


    Dr.魏


    对于0-3岁的宝宝，跟爸爸妈妈的亲子共读最能激发他们的阅读热情，妈妈从七八个月就开始亲子阅读，做得很好。孩子在3-8岁间会逐渐掌握自主阅读的能力，怎么做呢？孩子的识字积累越多越能够自主阅读，所以识字是培养孩子自主阅读能力的开端，不需要刻意限制何几岁可以识字，而是随时都可以有这个准备。


    你也不用过于焦虑，现在开始增加词汇量即可，这里的关键是帮孩子转化听力词汇为阅读词汇，你可以督促孩子一本一本书地大声朗读，从练习一些字词的读写规则开始，培养她的识字能力。


    # 4.来自语言脑｜阅读时如何导读？


    从前两期的互动阅读我就想问一个问题，一周岁的小宝宝没办法进行语言交流，那是不是就不需要游览博物馆了呢？在阅读的时候该如何导读呢？


    Dr.魏


    回答你的问题之前，我想提一下Facebook创始人马克·扎克伯格，他有一张跟他儿子的合照我觉得很有启发，是他在给刚出生的女儿读《宝宝的量子物理学》。量子物理学很多成年人未必懂，我相信扎克伯格也并未期待能跟新生儿交流物理，只不过是希望通过让孩子浸泡在这样一个环境中，慢慢培养出兴趣和能力来。'
