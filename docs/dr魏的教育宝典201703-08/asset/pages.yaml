    # 孩子该怎么批评？


    Dr.魏


    今天我们来聊聊“怎么正确地批评孩子”。现在有一种观点，认为中国孩子自信心不够、比较害羞，都是因为我们的教育中间注重批评，表扬孩子表扬得不够，而西方孩子恰恰相反，他们自信开放，就是因为他们教育中间强调的是表扬而不是批评。


    甚至我一个大学老师朋友也跟我举了一个这样的例子，他说：“你没有发现吗？现在很多学生，看上去很聪明的，也很勤奋，可是就是没有个性，唯唯诺诺的，就怕犯错误。我跟他们一聊，发现这些人都是以前被家长、老师批评得太多，没自信了，总觉得自己什么都不行，就想讨好别人。所以我对孩子是不批评的，只要不犯大错误，就让他自由生长。


    要批评孩子的话，那会扼杀孩子的天性的。”我直接当地告诉他：“那你就错了，那些学生之所以有这样的表现，并不是因为他们被批评得太多，而是因为他们的父母、老师，批评的方法不对，如果批评的方法正确的话，孩子是不会感到压抑、挫折的，反而是一个成长的好机会。”


    # 对孩子的品质坚持成长型心智的看法


    其实这就是我上一期提到的成长型心智。上一期我更多地说的是成长型心智能让孩子不怕困难，他会拥抱挑战，从而更快更好地提高智力和能力。今天我要说的是品质。你如果用成长型心智模式来看孩子的品质，那么他也不会怕错误，反而能从错误中学习，锻炼出更好的品质。


    这里的关键，就在于你是把孩子的品质看成是个固定的东西，基本不太变，还是个可以靠你和孩子的努力而改变的东西。中国流行一句话，说“三岁看老”，这就是典型的固定型心智模式。如果你真的相信了这样的说法，那你就等于放弃了自己孩子的未来。事实上，不要说三岁，哪怕是老年人，还是可以通过学习，通过我们的行为模式来塑造大脑。连六十岁都不能看老，何况三岁呢？


    所以，你必须对孩子的品质也有一个成长型心智的看法，就是他今天是这样，并不代表他将来的品质也是这样。他永远都能变得更好，只要你和他一起付出努力去改变。


    > 《Dr.魏的家庭教育宝典》的查询结果

