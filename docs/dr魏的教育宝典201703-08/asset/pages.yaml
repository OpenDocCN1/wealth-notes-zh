  md: '# 语言脑｜怎样帮助孩子识字？


    语言脑｜怎样帮助孩子识字...


    # 家长如何帮助孩子识字？


    Dr.魏


    我讲了《孩子识字太早好不好》那一期之后，有家长留言：“过早识字会不会破坏想象力？”我的回答是：“那是谣言，早识字不会破坏想象力”。之前有新闻提到一个美国妈妈把幼儿园老师告上法庭，因为老师教幼儿认识字母O。这位妈妈觉得这破坏了孩子的想象力。


    这是个错误观念。其实认识字母O，可以把它看成是太阳、苹果。认识字母让我们对“圆圈”的理解增多，而不是减少，我们想象的时候能够用到的素材更多了。


    识字是个量大、时间长的过程，如果用错了方法，把孩子按在椅子上，逼他机械识字，不仅让识字变枯燥，可能还会有效反效果。


    而且，背诵记几个字不是学习语言的真正正的。有...社会语言学...它发现，我们学习语言的时候，包括口语的习惯和识字，不是简单的重复和模仿，而是围绕着“意义”进行学习。


    # 识字要围绕着字的实际意义


    什么叫围绕着“意义”的学习？就是在日常环境中学会用这些字，在什么场景中用、怎么多角度地理解记忆。给孩子创建丰富的文字环境，要让他自然地接触到文字，其实就是围绕着“意义”来学习，也叫对汉字的深度学习。


    孩子识字，面临两大难题。第一难是孩子的语言加工方式还不成熟，对汉字还保留在图像记忆加工上，短期内记得字的大概样子，然后就忘掉了。因为图片式的记忆编码方式不具有长期效力，只有深度理解字的意义才能记得更牢。


    第二难是指汉字的学习要涉及不同语言体系的切换。汉语为什么比英语难学？因为汉字结构是形义体系，听得懂“苹果”不代表写得出“苹果”的汉字，而英语往往是听到发音的同时，就能猜出来怎么拼写。


    # —— 宝典查询结果 ——


    我之前讲过“读写萌发”的概念，孩子的读写能力是自然发展出来的，而不是规定好到了什么时候才凸显出来的。这其实非常合理，孩子跟我们一样，生活在充满文字的世界里。


    日常生活中孩子不断接触到文字，不管是看到文字，比如零食的标签、路牌路标、商店名字，还是听到声音，像是爸爸妈妈给他读绘本，还是电视里的声音。


    看得多、听得多，孩子会在生活中逐步把声音和物品对应起来，把物品和文字对应起来，虽然没有系统地学，但会慢慢熟悉一些字。经验积累得多了，孩子对文字有所了解，逐渐明白，语言、文字符号是有意义的，它可以用来自别的东西。如果好好运用语言、文字，能够帮助到孩子的日常生活，这就叫孩子的非正式的识字体验。


    跟孩子去超市，如果孩子喜欢吃苹果，那么带他去超市苹果区的时候，你可以让他去水果标价牌里找写了“苹果”的牌子，这样帮他把标签上的字和真实的物品对应起来，并且让孩子觉得识字对他的生活是有帮助的。


    早期的非正式识字体验，重点在发展两点，一是语音意识，就是把孩子听到的词汇转化为字面词汇，孩子听到“苹果”，能够跟写的汉字“苹果”对应起来。


    第二点是孩子的字形意识，就是孩子对汉字的形状有所了解，知道“苹果”两个汉字是长什么样子的。有研究发现，这种非正式的识字经验越多，孩子的语言发展和将来的读写发展越好。


    不过你也不用开始焦虑，两三岁的孩子是做不到把声音和文字一一对应的。语言脑需要慢慢积累发展，所以一定要给孩子时间，以他的兴趣和能力为基础，首先培养孩子对符号的兴趣，对阅读书籍的兴趣。


    怎么样帮助孩子识字，我给你3个方法。


    # 1.大原则：运用情景学习的原理，增强识字经验


    这里面的大原则，是运用情景学习的原理，增强识字经验。生活情景中有大量的非正式识字体验，比如回家的路上，你可以让孩子认一认公交路线的站名；出去旅行的时候，你可以让孩子记一记家里地址的汉字、所处的城市的汉字；周末去动物园，就教教孩子认识“老虎”、“猴子”的介绍板。


    ![](img/8dd4b172abeef48fa291369820efe392_85_0.png)


    # 2.培养孩子的字形意识和语音意识


    # 3.鼓励孩子多输出'
