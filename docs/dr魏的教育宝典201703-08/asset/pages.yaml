    # —— 数学能力启蒙急救卡 ——


    我在之前的內容《怎么样帮助孩子识字》中提到“识字要围绕着字的实际意义”。帮助孩子识字有个大原则：运用情景学习原理，增强识字经验。比如回家路上，认一认公交站名、去动物园时认一认指示牌上的“老虎”等，同理，数学能力也可以玩着培养。


