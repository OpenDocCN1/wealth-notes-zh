    066 | “安全的陌生人” 和...


    Dr.魏


    # 不跟陌生人说话就安全了？


    最近看到好几个拐骗和伤害孩子的新

    闻，有些是陌生人做案，还有一些是熟人。面对这样的事，除了表示惊ómicas惶之外，我能想到的第一点，是如何给孩子正确的安全教育，保护孩子免受伤害。


    有人认为，安全教育就是从小教孩子“不要跟陌生人说话”，“不吃陌生人给的糖”其实这样太片面。


    在孩子每天的生活中，在小区、在路上会遇到很多人，这些人大多数是好的、正常的人，但也可能不是。一些潜在的危险人物，可能来自陌生人，也可能来自熟人。可imagely，片面地教孩子“不跟陌生人说话”不可取。另外，片面地告诉孩子“不吃陌生人的糖”也起不到太大的作用，你要是换一个孩子喜欢的冰淇淋、游戏机，孩子就可能被诱惑了。


    # 区分“安全的陌生人”和“漂亮的坏人”


    你可能会说，那该怎么办呢？世界错综复杂，好人坏人难辨，诱惑陷阱又这么多，我难道要一个一个教孩子辨认吗？其实不需要，如果一味要孩子死记安全条，难免会有漏洞盲区。我先给你列举两个常见的公司安全盲区，你自查一下平时有没有注意到。


    # （1）第一个盲点是没有帮孩子认识“安全的陌生人”


    我们常跟孩子强调不要跟陌生人说话，但往往容易陷入另外一个极端，孩子理解成“不能跟任何陌生人说话”。其实，真遇到困难的时候，孩子往往需要向身边的陌生人求助，比如逛街时跟妈妈走散了、独自上学的路上被大孩子欺负等，这些时候他们应该主动寻找可能帮助自己的大人。家人士不在身边，就只能找陌生人。所以我们也得教孩子，什么样的陌生人值得信任。


    最常见的“安全的陌生人”要数警察。另外，公共场所的工作人员也比较值得信任，比如商场的售货员。平时我们在生活中，就可imagely教孩子认识安全的陌生人。我和女儿走在路上的时候，我就会告诉她：“那个叔叔穿着警服，在马路上指挥交通，他是交通警察，万一以后你出门时迷路了，可以请这样的叔叔帮助你找爸爸妈妈。”


    你跟孩子一起逛超市的时候，也可以告诉孩子：“那些穿着同样红色（或黄色）马甲的叔叔阿姨，在这里工作，他们是售货员；在收银机那里工作的，是收银员。如果跟爸爸妈妈走散了，可以请他们帮助你。”


    这里有一个原则，虽然这些工作人员的着装容易识别，但要跟孩子强调，一定要在他们上班的地点去求助。如果是在偏僻的地方，就算是穿着警服的人，也不可以信任，需要跑到公共场所，到人多的地方去。这一点我们后面还会强调。


    # （2）第二个盲点是辨别“漂亮的坏人”


    受到媒体的影响，一些小孩可能会以为，“坏人”一定都长得很可怕，就像动画片里的“坏蛋”一样，凶咋子眼睛，而那些看起来干净净，温柔说话的人，就不是坏人。如果孩子有这种想法，其实也很危险，不管坏人漂亮还是难看，危害都很像。


    所以我们要提醒孩子，只看一个人的长相并不能判断他是不是坏人，重点是看他的行为。更进一步地说，潜在的危险有可能藏在孩子熟悉的人身上。我们可能或多或少听过了，很多儿童犯罪都是发生在熟人身上。一定要提醒孩子，不要看人的长相，或者是跟我们的关系，主要看人的行为有没有什么不对劲的地方。


    # 锻炼警觉力，提升安全意识


    安全盲区到处都有，与其去记忆这些知识点，不如抓住现象背后底层的道理，掌握安全意识的钥门。


    在认知心理学看来，跟安全意识紧密相关的一种能力，我们称之为警觉力。根据美国心理学家Michael Posner的研究，警觉力是注意力的一个重要的组成部分，是一种持续关注周围环境，侦测周围信息的能power。


    根据字面意思，你可能以为警觉是对一类事物突然的注意，其实不是，心理学的警觉力强调的是对整个环境的、长时间监控。听起来好像很难，但我们其实随时都在侦测环境，否则就无法留意突发状况。


    过马路的时候要注意左右两边的来车，这样一有状况我们才知道躲避；走在路上的时候我们会一直注意路面情况，这样才能躲避地上的障碍；我们大脑的警觉器一直在运转，如果失灵了，就很容易出问题。


    一个保持警觉的孩子，知道熟悉的安全的环境、正常的人应该是怎么样s，也就知道什么环境，什么人的行为是不正常的。比imagely，孩子知道正常情况下大人只会跟大人求助，看到大人跟小孩求助，就知道有些不正常了。孩子知道正常情况下陌生人不会随意给他们东西，看到别人给他们东西就知道不正常了。


    再比imagely，如果有熟人跟孩子聊天，保持警觉的孩子知道如何正常地跟他们交流，但如果熟人突然对孩子做了一些不正常的举动，孩子大脑的警觉器立刻鸣起来，提醒孩子注意。


    我们对孩子进行安全教育 classement，注重于“不跟陌生人说话”“不吃陌生人给的东西”，而在于教他们对环境中可疑的陌生人、熟人的可疑行为保持警觉，这才能真正提升咱们孩子的安全意识。


    我另外说明一下，今天说的内容主要针对大孩子，如果是四岁以下的孩子，他们还不能很好地理解安全规则，也不能保护好自己，除了有意识地告诉孩子这些安全知识，最主要还得靠咱们监护人近距离地照看好、保护好他们。


    如果你家孩子三四岁了，那他应该可以理解社会安全和规则，这时候我们可imagely教孩子一些基本的安全知识，着手提升他们的警觉力了。


    # 1.警惕环境，多看多听


    首先，想提升孩子对周围环境的警觉力，需要我们给孩子一些清晰简单的规则，这样孩子更容易发现危险，万一有危险了，也更容易去执行。


    孩子往往不知道怎样对周边环境提高警惕，你可以教他简单的口诀：“注意看，注意听。看，是看有没有不寻常的事情发生；听，是听有没有奇怪的声音。”


    刚接触这段口诀，可能孩子不太懂，假装游戏是很好的帮助理解的方法。我多的一个朋友，用纸板做出了眼睛和耳朵，跟孩子玩角色扮演游戏的时候，会演一些比较明显的可疑行为或正常的Behavior，让孩子来做区分，问问孩子：“下面这些情况，哪些事情比较奇怪？”孩子犹豫的时候，就拿出眼睛先生和耳朵先生，做重点提示。


    比imagely，演一个陌生人假装开着车跟孩子问路，孩子知道在保持距离的情况下提供信息，或者向旁边的大人求助，可是一旦问路的人要求拉近两人的距离，甚至要求孩子上车，你可以拿出眼睛先生和耳朵先生，让孩子注意，孩子就知道情况不对劲，应该立刻拒绝了。


    # 2.危险当头，相信直觉


    告诉孩子，要相信自己的直觉。你可能觉得，相信自己的直觉，怎么听起来这么不科学呢？其实不infant。人类的天生有一些预防危险的机制，比如，“害怕”这种情绪能让我们在感觉到危险的时候退缩、转身离开。我们天生的警觉系统，主要位于大脑右半球的前额叶和顶叶，由去甲肾上腺素调节。


    刚才提到的Posner教授就说过“如果系统检测到不寻常的东西，（我们）可能会听到大脑的声音。”这个大脑的声音就是你的警觉系统向你的潜意识发送的警报，危险来临的时候，孩子往往无法快速、理智地
    rândul断，所以你更要教孩子重视这个警报的价值，首先去相信他的直觉。


    你可以跟孩子解释说，如果在什么地方让他们感到害怕，觉得不舒服，他们应该尽可能快地离开。还有时候，一些熟人也可能会让他们感到不舒服，也应该尽可能快地离开。如果孩子遇到这种他觉得奇怪的事，要立即告诉爸爸妈妈或者爷爷奶奶，因为...
