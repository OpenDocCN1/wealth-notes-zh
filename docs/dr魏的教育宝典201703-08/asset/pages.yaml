    # 1.分享来自聪明家长 @糯米丸子 关于如何批评孩子的优秀留言，看看当她拿到孩子成绩单的时候是怎么做(?


    @糯米丸子 我的方法是给孩子找“亮点”，尽量先忽视他不好的一面，先强调他好的一面。比如：孩子同时拿回成绩，语文95、数学80、英语65。多数妈妈会关注孩子不好的成绩，但是我却反过来的。


    用惊讶的表情说：哇语文居然这么高啊，你怎么做到的呢？孩子本来为自己不好的成绩感到不安，可是当我关注他好的成绩时，他就会放松心情，不好意思地含糊阐述自己怎么做的；然后我又说：很好，说明你在语文上努力了对不对？成绩好呢只是表示过去你努力的一个表象，也许只是恰好考到了你懂的或是你不懂的，但都不代表未来也一定会持续这样对不对？成绩不好的地方恰是发现你问题的地方，那样会给你指引努力的方向对不对？


    而且比起上一次你有进步了，妈妈看到的是你不断进步的步伐，那下次我们可不可以用同样的方式去解决英语的问题呢？我家孩子从小学一年级时数学不及格、不自觉写作业到现在，学会自觉安排学习时间、自由约定自己玩的时间，这让我巨有成就感。


    再比如写字和写作文上，我用夸张的方式给他找亮点，忽略他写得不好的，只问写得好的怎么写的？然后肯定他的努力，肯定他用心就一定会做得越来越好，而我基本上没怎么担心孩子过写字和写作文的问题。面对他错误的问题，帮助他找到他的好的时候，用来比较，很有效哦。


