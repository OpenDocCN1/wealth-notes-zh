  md: '# 056 | 创意脑：孩子学音乐有什么用？


    Dr.魏


    # 孩子学音乐有什么用？


    大家可能都知道，我女儿在学电子琴。她从小就对音乐特别敏感，还没学会走路的时候，就开始跟着音乐扭屁股摇摇鹅。再长大一点儿，她刚学会说话，就爱咿呀呀呀跟着唱儿歌。


    当她说想学电子琴的时候，我想都没想就答应了。除了满足孩子cela的兴趣之外，我还有一个小小的“私心”：学习音乐的好处太多了。


    说起音乐，我们可能通常想到它能陶冶性情，还可以当做表达自我感受的手段。去音乐厅欣赏大师演奏是一种享受，自己弹弹唱唱也自得其乐。


    科学家们则换了角度，去研究音乐与语言、运动、社交情绪等方面的关系。这—研究，还真的有惊人的发现。


    # 学习音乐，好处多多


    # 第一，音乐可以让孩子更容易交到朋友，融入集体


    我们远古的祖先在狩猎、祭祀前，就有一些唱歌跳舞的仪式，将部落的人在精神上联合起来。他们这样做是有道理的。集体音乐与共同目标和同步活动相关，可以引发大脑中化学物质的释放，有助于小团队的联结。


    如果一群互相都不认识的孩子走到一起，那么跟大家一起唱歌会是非常好的“见面礼”。唱歌能让新团队的每一个成员更加舒适，更快地建立亲密关系。你可以想象一下，如果要聊天，一对一互动效果更好，四个同时参与就算上限，这时很可能有人就插不上嘴了。但唱歌不一样，唱歌可以让更大的集体联合起来，跳舞也有类似的效果。


    # 第二，玩乐器，能有效延长孩子学语言的敏感期


    音乐的好处也不止于社交活动。你可能听说过，语言学习有敏感期，随着孩子长大，他们学习模仿语音的能力开始减弱。好消息是，研究表明，玩乐器可以延长这个敏感期。一项跟踪研究发现，让孩子学了3年的吉他或长号之后，他们阅读的词汇量上升了。


    # 1.提供多样的音乐体验


    # 2.模仿唱歌和律动


    # 3.鼓励孩子即兴表达'
