    # 什么是靠谱的智力提升法？


    Dr.魏


    我们生活在一个信息过剩的时代。比如怎么提升宝宝智力？市面上流行着数不清的方法，个个都声称是来自于科学研究，但它们到底靠不靠谱呢？比如说：


    给孕妇补铁能让孩子变得更聪明吗？给宝宝听音乐能提高他的智力吗？用计算机软件训练孩子的注意力，也能提升智力吗？


    我来告诉你，答案是no, no, no，这三个方法都不能有效提升孩子的智力。怎么说有人肯定不服气。“这些方法都是有科学论文发表的，说明是有充满的！”


    学会辨别靠谱科学


    我的回答是：科学论文里面也有很多坑，你要会读论文，才能准确掌握它的意思，不然很容易被人误导，掉到坑里。我来「得到」目的，就是把这些对论文的误读，或者错误观念，给澄清一下，这样才能真正地科学育儿。


    真正的科学态度是什么呢？是要读到论文里科学实验的限制条件，不夸大也不随意扩大，还要看看其他科学家对这篇论文怎么说，是不是有人重复了这个结果，或者有多少反对意见。


    科学界对于怎么有效提升孩子的智力，其实已经有了相当的积累，的确有很多研究者，对智力提升的论文进行了归类和筛选，得出了一些科学界的普遍共识。我在这里可以跟大家分享一下我们参考的数据库中的一个：比如“智力提升数据库”，这个就是收集了所有关于提升智力的靠谱研究，构建了一个极大的数据库。


    什么样的研究才算靠谱，才能够被这个智力提升数据库收进去呢？


    +   1.你得是在正常人群里做的研究，这样才能用到普通人的育儿实践中。


    不靠谱的智力提升方法，比如刻意地训练幼儿的注意力，它的来源就是那些有特殊儿童的研究。比如2005年有一项研究，是用计算机软件来训练有多动症的孩子，发现能有效提升他们的工作记忆。


    这听起来是非常激动人心的发现，因为看似玩玩电脑上的小游戏，就可以帮助提升智力了。但是，很显然，对多动症孩子有效的方法，不见得对你的孩子也有效。事实上，科学家的确没有发现那些计算机软件的注意力训练，可以正正常小孩提升智力。非常简单的道理：你不能把针对一个特殊人群的研究发现，随便用到正常人身上。


    ![](img/8dd4b172abeef48fa291369820efe392_11_0.png)


    +   2.很多科学实验本身不严谨，所以它的结论值得怀疑。


    我举个例子，有个研究是这么做的：把一群孩子招进来，做6个月的训练，然后一测他们的智商，如果提升了。这能说明你的训练有效？其实，即使不做训练，孩子在6个月里本来智力就会往前发展。所以，必须要有一个对照组，这个组的孩子不做你的“训练”。你的有效训练，必须比不做这个训练的孩子智力改变更大，才能说明它有效。这就是所谓的控制组的概念，靠谱的智力提升方法必须有严格的控制的实验才行。


    +   3.你的智力提升效果必须不是临时的效果。


    有些所谓的智力提升方法其实是应试技巧，让你在智商测试时表现好点，但你的智力本身真的提升了吗？没有。隔两天换个方法一测，长得智商又缩回去了，那这训练有啥用？所以这些方法也不靠谱。


    现在我们就可以回到开篇讲的那几个所谓的提升智力的方法了。第一，给孕妇补铁，能提升智力吗？不能，给6个月大的婴儿补铁也沒用。


    第二，听音乐能提升智力？给孕妇，给婴儿儿童听古典音乐，听莫扎特，能提高智力吗？不能。虽然有传说中的“莫扎特效应”，说给胎儿或者宝宝听莫扎特会让他更聪明，但是这个传说的源头是针对成年人的研究，而且其对成年人的效果都非常非常微弱，对宝宝和孕妇更没有效果，所以您可以省点时间和精力了。当然，给宝宝妈妈听点舒缓的音乐，让她们心情放松，倒是可以考虑的，提升智力就拉倒吧。


    第三，用计算机软件来训练孩子的注意力，能提高智力吗？刚才我也已经提到，那只对有多动症的孩子有效，对于大部分正常孩子效果不明显。


    > 《Dr.魏的家庭教育宝典》查询结果

    教你几招有效提升智力的方法


    那么有效的方法是什么呢？其实也有很多。比如给孕妇和新生儿补铁虽然无效，但是补omega-3 脂肪酸和长链多不饱和脂肪酸是有效的，也就是鱼油和深海鱼油。当然，也不是越多越好，补够了就行了。这里面的道理我会在以后专门拿一节详细讲一讲。


    还有给孩子听音乐虽然没什么效果，但是带着节奏给孩子唱童谣是有用的。你看，同样是给小孩东西，听什么东西更重要。读书，亲子阅读，面对面的语言交互，就很重要。还有上幼儿园，尤其是带语言训练的，会有效提高孩子智力。


    今天先说一件基本而又重要的事情，是你可以为孩子做到，又能有效提升智力的，就是给孩子提供一个丰富的环境，可以不断地刺激他的认知能力发展。


    +   1.什么是神经可塑性？


    为什么呢？因为有一系列对育儿很有启发的研究，叫做“神经可塑性”。我尝试着通俗些给你解释下这个理论。它说的是，0-3岁，孩子大脑神经元的连接，叫做“突触”，突触的数目急速增加，到了2岁左右达到峰值，甚至超过了成年人。


    那么后来到底发生了什么事情呢？削减。很少被刺激到的神经元会丢失突触，这叫突触削减 (synaptic pruning)，这个削减非常历害，在整个儿童和青少年期，一共要削减大约40%，而经常被刺激的大脑网络的突触会被加强。我把它叫做“大脑的用进废退”，科学术语就是神经可塑性。因此，刺激，给予大脑的刺激，就是修饰大脑的驱动力。


    你也不要紧张，这个刺激不是说给大脑来一下电击，或者喝点神奇的刺激性的药水。刺激就是孩子看到的东西，比如说动画片，这是对视觉系统的刺激。听到的东西，比如说音乐，这是对听觉系统的刺激。也可以是体育运动，这是对脑部的运动系统的刺激。刺激就是你给孩子什么样的学习机会和经历。


    +   2.给孩子大脑丰富的刺激，提升大脑发育


    所以，如果在孩子成长的过程中，你给他的大脑的刺激不够多，不够丰富，就会影响到他大脑的发育。科学家根据这个原理，就设计出一些干预方法。他们从那些给孩子刺激比较少的家庭里，选了一些妈妈。她们的孩子是三到四岁的样子。


    科学家教这些妈妈什么呢？其实也很简单，就是怎么在家 wyłącz 孩子更多的语言刺激，比如用一只袜子做个玩偶跟孩子玩，用杂志上的图片教孩子如何给东西分类，教给妈妈一些儿歌让她们回家跟孩子一起唱，还教她们可以跟孩子玩的手指游戏，也送给她们一些书、拼图游戏等，让她们带回家给孩子玩。


    听上去是不是很简单？做了11个星期之后，一测智商，这些妈妈的孩子智商提高了7点，而对照组，也就是没有使用这些干预方法的普通家庭的孩子，智商变化就不明显。


    这里要特别说明一下，我前面既提到了智力又提到了智商，那智力和智商的区别是什么呢？智力指广义上人的认知能力，心智水平，这包含了多种方面。而智商是测量智力水平的一系列标准化测试得来的分数，很多智力研究会用智商数据作为指标。


    孩子智力的发展，需要你给他大脑以丰富的刺激。神经可塑的过程就是你提供刺激，培养孩子大脑的过程。这是育儿里面'
