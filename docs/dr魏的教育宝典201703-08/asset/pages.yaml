  md: '# 智力脑 | 培养专注宝宝，家长怎么做？


    智力脑 | 培养专注宝宝，...


    Dr.魏


    在上一期的节目里，我讲了如何设置一个好环境，让孩子能够集中注意力。但是，很显然，要提升孩子的注意力，孩子自发的专注比环境因素重要。


    怎么让孩子自发地专注于当前的事物呢？


    很多家长都为这个感到头疼，大家最常用的方法就是逼，逼着孩子坐在哪里做作业，一坐就是一个小时，不许干其他的事情。但是这样逼出来的，真的能让孩子由内而外地学会专注吗？


    如果孩子真的专注，他那份作业，最多半小时就做完了，为什么他坐在那里一个小时都没有做完呢？


    那是因为他的身体虽然坐在那里，但是注意力早就跳游天外了，心思根本就没放在作业上。


    # 去游戏设计里找原因


    逼是没有用的，专注是逼不出来的。要让孩子真正地专注，还得靠引导，就是经常性地让孩子专注于他当前的小任务，时间长了，他的专注力就练出来了，能够集中注意力的时间也就越来越长了。


    怎么引导呢，你需要想一想：孩子什么时候最专注？关于这个问题，我相信很多家长的答案跟我是一样的：他玩游戏的时候最专注！


    我讲了上一期节目之后，就有家长留言：“Dr.魏，我孩子做什么都不专注，就是玩手机最专注，一拿起手机就打开里面的游戏玩，一玩就不肯放下来，怎么办？”


    的确，孩子都是玩手机时最专注，这个就是我要问你的第二个问题了：为什么他玩游戏时会这么专注？


    这是因为，其实游戏的设计都很有学问，都是符合心理学原理的。如果一个活动，它能够强烈地吸引你的注意力，必须做到三点：


    +   1. 有明确的目标

    2. 难度跟你的能力相匹配

    3. 有及时的反馈


    恰恰游戏就符合这三个吸引原则。满足这三个条件，孩子就会自动进入专注状态，不用你去逼的。这种状态，在心理学上叫“心流”，由米哈里·齐克森提出，英文就是flow，所以也有中国学者把它翻译成“福流”。它是一种让人能够全神贯注在当前任务的状态，是专注力的最高境界。


    我下面就给你用游戏解析一下，这样你就知道小游戏是怎么吸引你的专注力的了。


    《Dr.魏的家庭教育宝典》的查询结果

    吸引专注力三原则


    # 1.明确目标


    游戏都有明确的目标，像愤怒的小鸟，就是要用尽可能少的小鸟，打到尽可能多的猪。俄罗斯方块，就是方块从屏幕上掉下来的时候，尽可能地消掉它们。而且大部分游戏还<|message|>
    目标太大、太远，又在里面设置了小目标，就是给你积分，给你小礼物等。


    # 2.难度要和能力相匹配


    # 3.及时和全面的反馈'
