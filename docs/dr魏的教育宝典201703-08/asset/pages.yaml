    不少妈妈留言说，家里其他人会强迫孩子分享，不知道怎么办。除了前面说的跟家人沟通外，还可以像 @Ah-瑝一样，假借跟孩子说，委婉地表达自己的想法。


    我想的、做的跟Dr.魏说的基本一样。其实慢慢地我发现儿子很懂适当的分享与跟人相处了。我想分享一下之前遇到的关于分享的事。一天我儿子拿着新玩具回奶奶家，在表妹面前嗨瑟一下。表妹也想玩就问询我儿子，但我儿子拒绝了，说还没玩够。


    表妹就向爸爸哭诉，表妹爸爸就再问询我儿子，还是被拒绝了，表妹哭更大声，这时表妹爸爸就跟我儿子说：“你让表妹分享一下啦。”我儿子再次解释说还没玩够。表妹爸爸居然大声说：“这样我就要批评你了！”这就是强迫别人分享，儿子有点委屈走来我旁边。


    我知道并不要求别人理解，所以我就跟我儿子说：“妈妈支持你，你的东西，你有权安排。”声音刚好能让表妹爸爸听见。其实我也有点生气，但我只能引导好我孩子，不能强迫别人认同。


    结果过了一会儿，我儿子就跟表妹分享玩具了，一起玩得很开心！幸好从小我就坚持保护孩子的物权意识，中间会受到不少的质疑和不理解，不过幸好最后孩子变得坚定了，内化了物权意识，也懂得尊重别人的物权。


    至于分享，我自己经常抓到机会就对孩子“催眠一下”，比如引导孩子想象有人分享玩具给他时，他自己的心情，同样反过来别人得到他的分享也会一样。


    又会说将开心的东西分享出去，就会变成更多的开心，都是点到即止。慢慢的，儿子会在分享和物权之间找到平衡，跟很多小朋友都能玩得特别开心。


    # 孩子多大上幼儿园最合适？


    急救包


    1个观点：

    上幼儿园主要让孩子学习两方面内容：规则和同伴交往。上幼儿园没有固定的时间，早一年、晚一年，对孩子影响不大。


    特效药：

    1.如果 hadn 孩子外出活动时间比较多，那么送孩子去幼儿园活动量反而不如你带

    2.幼儿园的主题游戏多，知识学习少

    3.具体去考察幼儿园的活动安排，结合自家孩子的情况和家庭背景，决定入园时间'
