    # 本期思考题


    小贝的爸妈想教小贝数学，但他们只会让小贝背数字，小贝渐渐的不喜欢数学了。他们找你来帮忙，想请你带小贝一天。你能结合今天讲的数学三原则，设计一些活动，既让小贝开心，又让他爱上数学吗？期待你的答案。


