  md: '# 情绪脑｜宝宝怎么社交？家长来引路


    情绪脑｜宝宝怎么社交？家...


    # 我家孩子是不是太害羞了？


    Dr.魏


    你觉得你家宝宝害羞吗？以前他明明是个小天使，见人就笑，逢人就招手，可到了2岁之后，忽然像中邪了一样，见到陌生人也不敢打招呼，喜欢躲一辺，缩在爸爸妈妈身后，别
    人跟他搭话，他也不接话。


    这种害羞的夸张版本是和小组朋友在一起的时候，他也不跟大伙一起玩。比如有个小朋友在玩积木，他都走到人家旁边了，就是不打招呼，而是自己拿起积木，默默地玩了起来。两个人可以各玩各的，几十分钟一句话也不说，直到玩完了两人可能一句话都没有说。如果大人这样表现，我们还以为是常，认为是自顾自的表现。可是作为孩子，这是不是太害羞的性格？


    其实不是。上面说的这两种情况都是正常的。


    # 害羞是个特质，不是缺点


    我们都知道，婴儿有所谓的“陌生人焦虑”，一般到八九个月大的时候，被陌生人抱的时候会哭。原因是什么呢？这是因为孩子的大脑总算发育到一定程度，他的记忆系统成熟了，这表明孩子总算能为记住熟人和陌生人的差别了。但很多孩子到了2岁以后，还会继续经历陌生人焦虑，这种焦虑能持续到孩子四岁，才逐渐消失的。其实，你不用担心，这也是他心理发展的正常过程。


    ![](img/8dd4b172abeef48fa291369820efe392_13_0.png)


    前面说的跟其他小朋友在一起，玩同一类东西，但是两人就是不交流，这种游戏方式叫“平行游戏”。两人像两条平行线一样，去同样的方向，就是不社会。平行游戏是从单独游戏到社交类游戏之间的一個过渡。


    孩子很小的时候，先会玩单独游戏。但是，大孩子会慢慢地开始玩社交类游戏，比如我们熟悉的过家家游戏，就是几个小孩玩角色扮演，你是爸爸，我是妈妈，他是宝宝。这样孩子需要互动才能推进游戏。其中，语言交流是必须的，孩子会说：“我缺一个弯的积木，你能不能给我一个，我们搭个窗户？”。


    而且社交游戏要求孩子们遵守游戏规则，照顾别人的情绪，学会适当让步。所以，社交性游戏对孩子的大脑能力的要求是比较高的，一般2岁的孩子还没有这些能力。因此，在4岁之前，非社交类的游戏是孩子玩得最多的一種游戏形式。这个时候孩子自己玩自己的，并不能说明他害羞，只能说明他正常。


    就算你家孩子比其他同年龄段的孩子更害羞一些，也不用担心。害羞是个特质，不是缺点。你孩子可能只是比较谨慎，或者思考比较多，所以跟别人互动的时候，反应稍微慢一些，但并不代表他就害怕或者不喜欢社交。


    # 父母需要注意三个误区


    我倒是非常担心，有些家长强硬地把害羞的孩子从“后台”推到“前台”，强迫孩子在别人面前表演不害羞。这是 纤维有害的，是典型的拔苗助长。


    # 1.做孩子的代言人


    比如有一次我遇到一个强势的妈妈，我问她女儿：“小朋友，你叫什么名字？”她女儿3岁的样子，看看我，看看妈妈，想说话但是有点害羞。这时候，她妈妈就抢话了：“她叫某某某。”然后又转过头来对孩子说：“叔叔问你话呢？你怎么不回答啊？”我怕妈妈吓着孩子了，就又轻轻问了一句：“你喜欢吃巧克力吗？”小女孩这次又是看看我，再看看妈妈，还是没有开口，但她妈妈又抢话：“她可喜欢吃巧克力了，在家里每天都至少要吃一颗！”然后跟我道歉说：“哎呀，真是不好意思，这孩子太害羞了！
    ”


    我赶紧把这位妈妈拉到一边，悄悄跟她说：“您得让宝宝自己说话啊，给她时间。刚才您一个人把两个人的戏份都抢了，她当然没机会说话了。而且，这次谈话交流的经历，可能变成了一个负面经历，将来她就会更害羞和陌生人交流了。”这个妈妈的例子，就是过度干预的例子。


    # 2.轻率地给孩子贴标签


    还有一种家长要尽力避免的情况，就是轻率地给孩子贴上“害羞”的标签。比如当着小孩的面跟别人说：“抱歉，我这孩子就是太害羞了。”其实，孩子都非常敏感，这样的贴标签式的语言，会让他以为害羞是件很不好的事情，而且他自己出了问题。有时候，孩子干脆就躲在“害羞”的标签下面，觉得自己有理由不去跟别人交往，反正你们大人不是说我害羞么！


    # 3.过度保护孩子


    还有一种害羞出现的情况，来源于平时对孩子行为的过度保护。这种情况是很常见的，特别是各各奶奶外公外婆这些祖辈，往往会过度保护宝宝。总对宝宝说“不要乱跑”“当心”。孩子在路上跑得快一点，他们也会担心摔跤。这会让宝宝以为这个世界很危险，变得不愿意主动探索。有了这样的想法后，孩子就逐渐变得胆小畏缩，对人害羞了。


    总结一下，宝宝没有你想象得那么大方，这不是大问题，有时候这是和他大脑发育和能力发育有关，有时候是孩子心理特质的问题。你千万不要反应过度。当然，你也得避免一些会让孩子过于害羞的言行。你要多关注孩子的感受和需求。当孩子遇到陌生人害羞时，其实是他心理焦虑的时候，你需要给的是微笑和鼓励的眼神，而不是直接包办了他学习社交的机会。


    > 《Dr.魏的家庭教育宝典》查询结果 教方法、给支持，才能有个开朗的娃


    # 如何帮助宝宝克服害羞，培养一个开朗的孩子呢？


    2015年我创办了儿童早期教育机构爱贝睿，陈俐博士是爱贝睿的家长教练之一，也是发展心理学家和美国儿童发展研究协会会员，她就“如何帮助宝宝克服害羞，培养一个开朗的孩子”给了我一些专业建议。下面，我就介绍给你一些具体的方法。


    # 1.教孩子怎么跟人打招呼，怎么加入到别人的圈子里去


    孩子看见别人在玩，想加入，但是又不敢。这时候你的机会来了。首先，你可以先给孩子一个预热的时间，把他带到旁边一起观察，轻声介绍那些人都谁，让他心里有底。时机一成熟，你可以直接建议他怎么去说话：“我能不能和你们一起玩积木”，“我可以跟你们一起运沙子吗”。这就是手把手地教孩子观察他人，并发起互动的方法。


    如果孩子还是过于害羞，不好意思主动去搭话，这时候咱家长就得更加主动一点，你加入到对话里面来，再把孩子引到话题中去。


    比如你看到宝宝很想和其他小朋友说话，但不知道怎么开始。你的高光时刻就来了，你可以引出话题，故意大声点说：“宝宝，你今天穿了小猪佩奇的衣服，太有趣了，你要和朋友们分享吗？”这个时候其他小朋友都注意到自己的孩子了，你孩子无论是说话，还是不说，光做動作展示一下衣服，都可以，他已经加入了其他小孩子中了。等到孩子有点熟悉新环境了，你可以进一步推动孩子们对话的进行，你可以说“我们家宝宝最喜欢小猪佩奇了，宝宝来跟我们讲讲小猪佩奇的故事吧，大家一定也喜欢听。”


    # 2.与其出去找圈子，不如家长主动来组织活动，来培养宝宝的社交能力


    最简单一个方式的就是邀请其他孩子来家里玩。孩子一两岁的时候，还不是很会跟小朋友玩，也不会同时应付很多人，这时一次只邀请一个小朋友到家里就行了，你可以安排一些适合两个孩子一起玩的游戏，家长还可以多加入进来，起示范作用，教孩子们怎么玩。比如说，你可以带着两个孩子一起唱唱童谣，玩玩拍手游戏。'
