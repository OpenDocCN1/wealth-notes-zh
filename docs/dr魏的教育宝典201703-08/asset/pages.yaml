  md: '# 复盘 | 智力部分（1）：

    自测及复习


    Dr. 魏


    我的家庭教育宝典专栏已经上线4个多月了，很多家长一直跟随专栏学习、做笔记，已经进步成为一位位了不起的金牌家长。同时，很多新朋友也在陆续加入咱们专栏的学习队伍。


    接下来，我会在专栏中帮你做第一阶段复盘，希望新读者有的放矢，老读者温故知新。今天，我们将针对“智力脑”部分，进行复盘总结。


    先从自测开始，欢迎答题（不要翻答案）


    # ★ Q1. 朋友家的孩子暄暄对钢琴很有兴趣，放假经常在家弹钢琴，你作为客人到他家串门，看到如此优秀的孩子，会如何夸他呢？


    +   A. 暄暄这孩子真聪明

    B. 暄暄很有艺术天赋，是个天才啊

    C. 暄暄一定经常练习，真是個努力的孩子


    # ｜ 解析：带着你的答案看看这三种表扬方式可能会给孩子带来哪些影响？


    选项A，给孩子暗示：你优秀，是因为你聪明。当孩子想继续获得认可时，就会表现他很“聪明”的样子，被夸聪明的孩子更容易放弃，也更可能读成成绩。


    选项B，夸孩子有天赋也是同理，他会继续表现“天赋”，而忽视后天努力。


    选项C，给孩子一种暗示：我看重的是你的努力和勤奋。这种表扬方式能把孩子的注意力转移到勤奋上来，如果要得到认可，孩子就会更加努力、不轻言放弃


    # ｜ 知识点回顾


    +   1. 表扬孩子的努力，而不是聪明

    多夸后天努力，少夸天赋优势。让孩子懂得聪明不是表扬出来的，而是源于努力。


    +   2. 表扬过程，而不是结果

    表扬孩子成功的过程，不要直接告诉他结果。以计算数学题为例，要引导孩子体会数学运算过程的美，而不是最后的结果。


    +   3. 表扬成长，而不是表现

    想让孩子勇于迎接更高的挑战，要表扬他的进步和成长，而不是分数或表现。以弹钢琴为例，你可以帮孩子分析错误，找到问题所在。


    # ｜ 推荐阅读

    《家长怎么正确夸孩子》


    # ★ Q2. 孩子放假在家，经常在电脑前一坐就是一天，影响视力不说，还妨碍学习和人际交往。身为家长，你特别生气，狠狠地批评了他，你会怎么说？


    +   A. 一放假就玩电脑、吃零食、睡懒觉，一点都不爱学习

    B. 天天就知道玩，长大肯定没出息，别玩了，自己反省去吧

    C. 玩电脑影响视力，近视眼多难受啊，最近天气热，你要不要约小伙伴去游泳


    # ｜ 解析：带着你的答案看看这三种批评方式让孩子接收到哪些信息？


    选项A是典型的借一个事情发泄家长自己的情绪，不仅对孩子没帮助，还会造成孩子的逆反心理。


    选项B强调孩子“没出息”，他的潜意识会影响，认为自己就是“没出息”。


    选项C是正确的批评方式，不仅点出了孩子错在哪，还给了孩子一个改正的建议。


    # ｜ 知识点回顾


    +   1. 告诉孩子他错在哪

    批评的目的是纠正错误，让孩子成长，那么首先你要告诉他错在哪，不要借由一件事发泄情绪，牵扯多件事实批评孩子。


    +   2. 就事论事，不贴标签

    不给孩子随意贴上“笨”“懒”“不听话”这类标签，这种负面标签会给孩子带来不良的心理暗示，千万不要翻旧账，把一次错误无限放大。


    +   3. 告诉孩子如何改正

    首先肯定孩子平时的表现，再指出这一次的不当之处，给予他提升的空间，帮他分析造成错误的原因，帮他想一个解决方案。


    # ｜ 推荐阅读

    《如何正确地批评孩子》


    # ★ Q3. 小明的注意力问题一直让妈妈很头疼，上课乱动、乱跑，幼儿园教授的知识虽然少，但小明却怎么也没有进去，经常被老师批评。如果，让你帮小明妈妈出个主意，你会建议她___？


    +   A. 孩子画画时，坐在他旁边，时不时纠正他“这个太阳花的花不圆，这个草地没上颜色，你注意过草地是什么颜色吗？”

    B. 和孩子一起玩耍时，收起手机，不刷微博、不看视频

    C. 抓住游戏的机会，补充小知识“宝宝你快看，这个滑梯上写着英文s-m-i-l-e，是微笑的意思，记住了吗？”


    # ｜ 解析：带着你的答案看看这三个建议可能造成孩子的哪些习惯？


    小明学到的知识少，可能是因为注意力不集中，没有良好的接收到老师的信息传递，要改善这种情形，就要从日常生活中的小事开始培养。


    选项A和C不利于塑造孩子的专注力，无论是画画还是滑滑梯，都是孩子集中注意力的一种方式，玩也是一种学习，却被家长莫如其来的对话打断了，到最后他可能既没学好也没玩好。


    选项B是培养孩子集中注意力的一个有效方法。孩子最爱模仿大人了，他的行为模式受家长的影响很大，尤其是在陪孩子时，如果你刷微博、看视频，孩子注意到的是“妈妈虽然身体坐下来了，但却在惦记别的事情，那我干嘛要一直跟着呢”。


    # ｜ 知识点回顾


    +   1. 你要少干涉孩子

    家长不合时机的插话，正好打断了孩子的注意力，比如孩子在写作业，家长经常端着苹果冲进来  说“来吃个苹果，边吃边写”。


    +   2. 在你需要孩子专注完成一件事情时，提供给他们做这件事情的合适环境

    用物理的方法，给孩子营造一个没有那么多刺激的微环境，比如事先问孩子有没有想玩的，玩的时候只留下一个玩具，其它的都放到别的屋子或藏起来，没有那么多新鲜的刺激，孩子自然专注了。


    +   3. 给孩子树立一个专注的榜样

    让孩子变专注，首先你要变专注，家长是孩子天然的导师，你的行为模式会影响到孩子，尤其是陪孩子的时候千万别玩手机。


    # ｜ 推荐阅读

    《利用这三招，让孩子集中注意力》


    # ★ Q4. 暄暄妈妈为了锻炼孩子的专注力，让暄暄学钢琴。看到隔壁家的小雨弹了一首好听的钢琴曲，暄暄妈妈特意向老师要了琴谱，对暄暄说：“暄暄，这首曲子特别好听，你来学习下吧”，暄暄表示太难了，妈妈接着说：“太难了？有什么难的，隔壁家跟你同岁的小雨能弹，只要你努力，你也可以”。


    +   A. 暄暄妈妈的做法是对的

    B. 暄暄妈妈的做法是错的


    # ｜ 解析：带着你的思考，看看让孩子挑战太高的难度对不对？


    提高孩子的专注力，可以从游戏设计里找方法。很多游戏的设计很有学问，能够强烈地吸引人的注意力，选项A是错的，这种做法恰恰违背了“难度要跟能相匹配”，逼着孩子去挑战太高的难度，结果往往是孩子在练习中找不到乐趣就感、兴趣慢慢被磨光了。


    # ｜ 知识点回顾'
