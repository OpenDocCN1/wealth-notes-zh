    想要提升孩子的自控力，首先要明白自控力是一种认知过程，我们可以把“情绪控制到认知调节到执行控制”看作一条链条通道，当我们做一件任务的时候，比如我决定下班之后去健身房，但是去健身房的路上闻到路边餐厅的香味。


    这时候会受到干扰，负责底层情绪的边缘系统非常活跃，好在负责高级认知的前额叶一通分析，我想起来还有健身大计，我不能为了眼前的口腹之欲毁了当初の计划。于是我压抑冲动，抬起脚迈向健身房。


    管理“情绪—认知—行为”链条


