    # 下周预告


    7月3日（周一）：玩偶装游戏，做社交小达人


    《头脑特工队》里的BingBong是住在主人公大脑里的奇葩生物，是他想象出来的玩伴。有些孩子也会假想出一个玩伴，是因为他太孤单吗？其实，孩子能有假想朋友，是因为他的社交能力强。下周一我教你用假装游戏，提升孩子的社交能力。


    7月5日（周三）：“爱”分享不如“善”分享


    有一些家长给我留言，问怎样能让孩子学会分享？孩子太自私了，不愿意和别人分享。的确，分享是社会美德，但很多家长教孩子分享的方法是错的。其实，分享不是让孩子把玩具给别人那么简单，下周三我来告诉你分享的正确姿势。


    # —— 本周问答时间 ——


    +   1. 一岁半以下的小宝宝，怎样培养想象力？

    2. 孩子不熊，遇到其他熊孩子怎么办？

    3. 孩子心情不好，不和人打招呼怎么办？

    4. 孩子凡事争第一怎么办？

    5. 为什么孩子要看同一本绘本？


    # 1. 一岁半以下的小宝宝，怎样培养想象力？


    我想起我儿子最近的一件趣事。他20个月，有一次我在做家务，没时间跟他玩，就给了他很多厨房的彩色碗和洗菜盆让他自己在山东玩。他先是自己假装用勺子和这些碗按个喝水，然后又拿了个勺子在里面搅拌，然后把勺子往嘴里送，好像吃饭一样。每个碗或盆都用勺子吃一遍。

    我忙完后，看到他自玩自乐很满足的样子，也加入进来，跟他说：“你在吃饭吗？给小兔子吃点吧。”他居然把勺子伸向毛绒玩具小兔子，假装给它吃饭。然后我说：“要不要喝水呢？”他又拿杯子去喂兔子喝水。真让我惊喜，他自己已经会玩想象游戏了。

    有个问题是，这三个办法似乎是要等宝宝能说话了，有一定思维能力才好操作。对于还不会说话的宝宝或更小的宝宝，怎么引导？有具体的例子吗？


    Dr. 魏


    假装游戏通常要在孩子一岁半以后才能发展出来。对于一岁半以下的小宝宝，还是要引导他们，进行对应于他们当前认知水平的遊戲。孩子会慢慢开始探索物品的不同功能，推车、拨弄勺子、扔球、敲鼓，这些都是在日常生活中，孩子观察大人行为后，做出的模仿。

    家长可以对这些行为加以积极的鼓励。在此基础之上，尝试引导孩子进行大动作模仿。你做出拍肩膀、摸耳朵、拍手等动作，让孩子重复。这些都是在为孩子接下来的游戏发展做准备。


    # 2. 孩子不熊，遇到其他熊孩子怎么办？


    Dr. 魏，你好，姐姐的孩子被教育得很有礼貌，懂规则，知分享。可刚去上幼儿园，孩子就很沮丧，因为他懂规则就不断被占便宜，因为知道分享别人却不知道，所以经常吃不到好吃的，玩不到玩具，他不知道是妈妈不对，还是自己做的不对。

    如果别人很熊，怎么让孩子保持应有的规则意识呢？


    Dr. 魏


    “分享”是什么？分享意味着对他人的关爱，是互相的行为。需要让孩子理解，“分享”不是简单的，并不是一味把自己的东西给别人。3岁左右的小朋友，以自我为中心，难以主动分享，要从轮流开始做起。

    家长要做的，是教会孩子用语言沟通，表达和与小伙伴玩玩具玩的“轮流”需求。如果幼儿园有别的小朋友要玩玩具，可以教你姐姐的孩子这么说：“我先给你玩，等你玩够了给我玩会儿，我们轮流玩好不好？”或者“这个玩具给你了，我就没有玩的了，你可以拿别的玩具和我换吗？”。

    分享并不意味着委屈自己，孩子也可以说，“我还没有玩够，一会儿给你好吗？”如果遇到强硬的熊孩子，要教会孩子明确自己的底线，说“不”。关于教孩子“分享”，你可以关注下周三更详细的内容。


    # 3. 孩子心情不好，不和人打招呼怎么办？


    咨询内容请问叨叨魏，如何引导孩子和认识的人打招呼。我家娃会说话了，我带他出去玩时会碰到很多认识的邻居，我是很爱打招呼的人，所以也顺其自然教他称呼长辈。

    问题来了，有时心情好就叫，甚至还亲别人，但有时心情不好，谁也不理，拿东西交换也不叫，连看也不看。呃时很尴尬，求解。


    Dr. 魏


    刚会说话的孩子，情绪控制和调节能力还不完善。在他心情不好的时候，不和大人打招呼，是这个年龄段的正常现象。不过，这种场面下，尴尬的是我们大人。

    作为妈妈，你可以居中调停，对孩子说：“妈妈知道，托马斯坏了，你还在生气，不想说话。妈妈也很急过。等到下次，你心情恢复了，我再和你喜欢的李叔叔打招呼，好吗？”既接纳了孩子的情绪，又婉转地和邻居说明了情况。


    # 4. 孩子凡事都要争第一，怎么办？


    宝贝四岁半，凡事都想争第一。从幼儿园赛跑，到吃饭刷牙，谁先穿好鞋子。不是第一就不会开心，真的是没办法，请大家帮忙支支招。


    Dr. 魏


    孩子对自己的认识主要来自外界评价，如果总是被与其他孩子比较，孩子会觉得，不是“第一名”就没有价值。家长除了不要比较孩子，还要引导他关注做一件事的目的、过程，而不是结果。

    关注目的，譬如孩子穿鞋要争第一，家长可以说，“穿鞋子是为了保护脚，穿好了鞋我们就可以去外面玩，随意跑跳，不用担心被石头划伤，不需要比较穿得快慢。”

    关注过程，比如赛跑，可以引导孩子去和自己比较。“这次跑得比上次快了一些，我看到你跑的很拼，付出了最大的努力，爸爸为你骄傲。”关键是培养孩子拥有成长型思维，不断挑战自我，具有做事情的内在动力。


    # 5. 为什么孩子要看同一本绘本？


    我家宝宝2岁3个月了，最近有两周的时间，每晚睡觉前陪他看会儿绘本，主要是小熊的生活趣事，他很喜欢小熊。就比如，有一本，是小熊和许多小朋友一起洗澡，身上有好多泡泡时，他就会指着小熊说，好多泡泡啊。

    但看完后，第二天，我不说，他自己好像就不知道了，就这样每天不重复地看了几天，我发现他没有记住这些，然后我就连续几天看一样的，好像他自己才可以说出图中的大致内容，请问Dr.魏，我这样做对吗？


    Dr. 魏


    从你的描述来看，这位小朋友处于阅读萌发期，正在积累看绘本的经验。2岁多的孩子，对于图画故事书的理解是碎片式的，他可以关注图片的细节，但是难以将前后几页因果联系起来，组织成一个故事。

    同一本书，每次观看，他感受到的细节可能完全不同。因为图画书色彩鲜艳，元素多样，小朋友需要集中精力，认真观察，辨别图上的某些特定元素。孩子处于识图阶段，故事理解能力还在发展，何谈复述细节呢？

    家长可以在看书之前，问问孩子，“今天你想要看哪本书呢？”如果孩子愿意重复看一本书，没有问题，这些都增加'
