  md: '我给他妈妈说，需要时间来慢慢纠正现在的坏毛病，但目前看来这种方法也没什么效果。我现在也有点没什么招数的感觉了。想请教一下Dr. 魏，针对这种情况，父母应该怎么处理呢？谢谢！


    # Dr. 魏


    对于一年级的小朋友来说，久坐学习还ecc需要适应。在学校里，有老师讲解和引导，而且是白天，孩子 называемый精神状态好，可以做到专心。但到了托管班，已经是晚上了，上了一天的课，孩子不免有些疲惫。


    而且，作业是纸面上的文字，对于一年级的孩子来说，还不太习惯，比较枯燥，容易走神。家长要先接纳孩子情绪：爸爸知道，写作确实不容易，如果你觉得累了，做不下去，可以休息一下，等精力集中了再写。但是不要打扰其他小朋友。以此帮助孩子培养写作业的节奏。


    此外，让孩子意识到，写作业是他自己的事，要养成检查的习惯。给孩子一段时间来实践，帮助他意识到，认真完成作业，自己检查，转天老师批改的少了，知识点记忆牢固了，小测验成绩也上去了。在这个过程中，我们要关注孩子的努力，对他一点一滴的进步，及时表扬。慢慢的，他就能养成认真写作业的好习惯了。


    # —— 本周家长分享 ——


    # Dr. 魏


    跟孩子运动的时候，怎样用赛跑调动孩子的积极性？分享聪明家长 @DS 的经验。


    @DS 在陪伴孩子外出运动时，我是绝不使用手机的，有时看见有些家长让小孩自己去运动，自己坐在一边看手机，心里难免有点遗憾。游泳、骑自行车、打羽毛球、爬山等都是女儿喜欢的运动，在运动过程中她最开心就是跟我比赛，因为每次比赛开始时是我赢她，但到最后她会赢一点。


    我让她感觉到胜出是通过自己的努力付出才得到的，而不是故意让她的，这样她对比赛的结果更珍惜，在运动过程也就更努力。如果条件许可，我会让她主动邀请同学一起参与运动，有同伴一起，运动起来更有劲。


    # Dr. 魏


    听了《好爸爸使用手册》后，很多爸爸妈妈都有感于“夫妻合伙人”这一说法：两个人的性格和行事风格难免不同，尊重彼此教养方式的差异，分工合作，各尽其能，共同成长。


    不只是育儿知识，是不是也学到了巩固夫妻感情的一招？推荐聪明家长 @泉儿 的夫妻育儿心得：时常交流，并且统一育儿的方式和理念。


    @泉儿 宝宝们从出生开始都会让爸爸积极参与到她们的教养中来，我还清晰地记得宝宝出生第一天拉胎便了，当时只有我和老公两个人λε医院，老公手足无措的表情记忆很深刻。


    后来，我忍着伤口疼痛爬起来，清理宝宝的胎便，更换尿不湿，老公打个下手，并认真地学，从那次以后，老公就正式进入了育儿角色，并且照料宝宝们越来越娴熟！转眼间现在宝宝已经一岁三个月了，回想过去的一年，我和老公的育儿工作分配可以说是一半一半了。


    而对于近期，我因为工作原因经常出差，老公也可以在下班后接替老人一个人照顾两个孩子，每每晚上与他们视频聊天的时候，可以感觉到宝宝们的积极状态。作为爸爸，老公也十分积极地学习很多新的育儿理念，我threshold常会交流沟通，确定统一的方式与观念。


