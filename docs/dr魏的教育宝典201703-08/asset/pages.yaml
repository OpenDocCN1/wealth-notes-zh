  md: '务的难度，他都得最大程度地参与，尽量是两人相互讨论、相互合作的气氛，而不是父母包办的节奏，而且尽量让他多做些，让他挑战自己的能力。两人开开心心地玩的同时，我会不动声色地锻炼他的能力。


    @安安妈 也有类似的焦虑心态，现代社会环境压力变大，家长很容易受外界影响，对孩子产生焦虑情绪。我的总原则是，化焦虑为惊喜，不是看见孩子的问题，而是期待他的成长，化问题为机会。带着这个原则去育儿，会少一些焦虑，多一些欣喜。


    # 4.来自情绪脑 | 协调家人的养育理念


    读了这篇过度养育后，自我检讨了一下，基本上没有过度，但是放到我妈头上，就绝对过度养育了。


    孩子玩个玩具，她要盯着，她不盯着或者是我没看她，摔破了我就要被骂。在外面玩累了，孩子要坐一下，我妈坚决不给坐，说地上脏；孩子新鲜，要拣个东西，马上传被我妈制止，我说不要管那么多，我妈又觉得我们不会带孩子，自己又觉得心力憔悴，我觉得她完全就是过度养育了。


    ![](img/8dd4b172abeef48fa291369820efe392_47_0.png)


    Dr.魏


    @小～月 很多人像你一样留了类似问题 @毛启笛 @小小兔 @周彤 。当我们的育儿理念跟家里人产生冲突，面对家人的顽固很容易心力交瘁、充满无力感。我先举一个自己的例子，比如一些营养方面的知识，我们家老一辈总是authority不听我的，但我说这是某专家说的，他们就愿意听了。


    所以，如何协调家人的育儿理念，特别是老一辈，我首先推荐的是，把我的节目分享给他们听一听。我了解到一些聪明家长每周会开一次家庭会议，全家一起收听我的节目并且交流感想。一个节目全家受益，这是非常好的方法。还有一些人说道理长辈们其实都懂，可就是做不到，这时候就需要你来调整自己的心态和行为为了。


    一个主要原则是抓大放小。给老人放权，一些比较“次要”的照顾孩子的细节，比如老人要给孩子喂饭你就随他们去，给他们一种被信任的感觉。但是，在一些大的原则上要表明立场。比如你在教育孩子的时候，老人不能去护着，给孩子造成家里意见不统一的混乱的感觉。如何协调家里面人的养育理念，跟育儿一样，也是修炼。


    分享聪明家长 @董隽.南京儿医 面对家里老一辈的过度养育，他的经验谈：


    @董隽.南京儿医 在宝宝1岁到2岁半这段时间，可能爷爷奶奶外公外婆承担了更多的养育的工作。而往往他们是过度养育的。这里我的经验是要确立父母在孩子教育中的主导者地位。要让孩子也发觉爷爷奶奶外公外婆也是得听爸爸妈妈的。


    另外，要尽可能自己多挤出时间陪孩子。不要因为工作累，回家就只知道歇着。这样可以及早发现孩子不好的行为，及时纠正。这就像在拔河，你得使出更大的力气来弥补时间上的缺失。


    # 5.情绪脑 | 过度养育的度，该怎么把握


    之前没有发现，一直觉得自己教育孩子还是比较科学的，现在看来还是存在不少问题。我女儿三岁，脾气有点儿急，玩玩具的时候一搞不好就烦躁。


    我会先缓和她的情绪，然后告诉她多尝试几次，并启发她一些解决方法。不过目前来看，她遇到事情第一反应还是比较急。不过我现在还在寻找更合适的方式来引导。是否过度养育还真不是很容易把握的。


    ![](img/8dd4b172abeef48fa291369820efe392_47_1.png)


    Dr.魏


    @若朴 一些家长像你一样，不知道过度养育怎么去界定、过度养育的度该怎么把握。其实这个标准非常简单，第一，以你自己的心态为标准，你的心态要好。


    比如，养孩子的时候你有没有老是焦虑？如果你总是为养孩子的一点点小偏差担惊受怕，那你就是在过度养育了。首先我们的心态要宽松。对孩子有平常心，我知道我不会是完美的父母，我的孩子也不会是完美的孩子，但是我的心态很放松。我也不会因为孩子没有做到我心目中的高标准，而对我自己的内心造成焦虑。


    第二，以孩子为标准。孩子有没有一碰到挫折就来找你。遇到困难很正常，但是孩子有没有愿意去克服困难？孩子有没有觉得他是家里的中心？


    这里的解决方案我再强调一下，针对第一个标准，不要把所有的注意力都放在孩子身上。你要有自己的生活，这样养孩子才会越来越轻松。针对第二个标准，不要替孩子解决所有的问题，特别是替他做他应该做的事情。看到有坑，不要急着保护，可以试着让孩子自己解决问题。


    我最基本的观点：我是女儿的朋友，我只是帮助她。这不等于放任孩子不管，我会偷偷地帮她、关心她。但是我要她知道，她要有自己的自主，我尊重她的自主。


