    语言脑 | 孩子识字太早好不... ↓


    # 今日问题：孩子识字太早好不好？


    Dr.魏


    （彩蛋：结尾有我为你的家庭和孩子精心设计的儿童节礼物，不要错过哦）


    上一次我在世界阅读日的�ော�期节目里，曾经提到过，阅读也要趁早，4岁以前的互动阅读，可以提升孩子的智商。后来就有很多家长在后台留言问：“不是说孩子不能识字太早吗？网上很多文章都说，文字敏感期到6岁才开始，在那之前让孩子认字的，都是拔苗助长。”


    这个说法，是针对一种极端情况的，就是确实有些父母，特别喜欢让孩子早点认字，于是孩子很小时就开始给他们灌输认字，家里贴了很多认字画，一会儿就考他一下：“哎，这个字念什么？”“哎，那个字什么意思？”甚至用威逼利诱的方法，多记住一个字就奖励一个冰淇淋，教好了多遍还记不住就满脸生气，让孩子害怕。


    # 让孩子自然地学会认字，能记得更牢


    这种做法当然不对，因为你这么教他，孩子只是机械地记住了这个字的形状和读音，但是对于这个字真正该怎么用，它在不同的句子里是什么意思，都毫无概念。这样做，确实会拔苗助长，对孩子弊大于利，除了满足父母的虚荣心外没有什么作用。


    但是，如果不是这样极端的情况，如果孩子是自然地学会认字的，是在一种快乐、互动的情况下认识了一个一个的字，那就不完全不同了。这个时候那些字对孩子来说就再也不是孤立的、机械的、没有意义的形状，而是他生活中的一部分，是他看得懂、能感觉得出來的信息。


    > 《Dr.魏的家庭教育宝典》的查询结果

    1.读写萌发：识字能力是逐渐出现的

    2.阅读也有马太效应


    # 一、读写萌发：识字能力是逐渐出现的


    这个关键就在于一个叫“读写萌发”的概念，读写萌发是新西兰科学家玛丽·克莱提出来的。她就是针对一种普遍的误解，比如前面那位家长说的，“6岁才开始文字敏感期”，好像一定要到6岁以后，由大人正式地教他这个字念什么，那个字什么意思，孩子才能学会读写。


    但其实，克莱发现，孩子的读写能力是自然发展出来的，你给他丰富的文字环境，他自然就学会了文字。因为对于孩子来说，他可不像我们大人一样，把文字看成多正式、严肃的东西，如果他是自然地接触文字的，那文字就是他生活环境中很平常的一个东西，他也就跟学会认苹果、认橘子、骑自行车、系鞋带一样，自然地就学会认字了。


    所以，关键不是你孩子几岁开始识字，而是他学会识字的方式是自然的，还是机械的。如果是用机械的方式，就比如像我刚才说的，把文字与环境割裂开来，只管追求孩子能认出多少字的形状和读音，不管这个字在真正的语言环境里怎么用，那确实不好。


    但是，如果你为孩子创建了一个丰富的文字环境，让他经常自然地接触到文字，在一个好玩、互动的过程中，可以说是主动地学会了文字，那你孩子以后就会越来越爱读，越读越会读，他的阅读能力和认知能力就会互相促进，一起飞速增长。


    # 二、阅读也有马太效应


    这就是阅读的马太效应。马太效应是说两极分化，穷人越来越穷，富人越来越富。阅读上的马太效应，是著名认知科学家斯坦诺维奇提出来的。他总结了大量研究，发现小时候喜欢读书的孩子，以后会更喜欢读书，而且读书的能力更强。


    反过来，如果你家宝宝到了上学年龄之后三四年还没有学会好好看阅读，那么以后可能造成长期的阅读障碍和学习问题。所以，阅读的马太效应是说你家宝宝会越读越爱读，越读越会读，但是如果错过了培养他阅读的能力和爱好的时期，他以后可能就会越来越不爱读，越来越不会读。


    为什么会这样呢？斯坦诺维奇认为主要有两个原因：


    +   第一，阅读能力和认知能力是相辅相成的，你家宝宝读得越多，他的理解能力、思考能力就越强，他的这个认知能力越强，他就又更喜欢读、读得更块了。


    +   第二，阅读能力和学习环境是相辅相成的。你家宝宝阅读的本领越大，你就会给他拿更难的书看。他走在街上，看到的招牌、说明不再是天书，都成了他可以理解的有意义的信息了。这样一来，他能够快速处理这些信息，又进一步刺激了大脑的发展，阅读能力变得更强，所以这是一个阅读的正循环。


    举一个我女儿的例子，我女儿被选为学校《爱冒险的卡梅拉》话剧的主角，是因为她背台词的能力比较出众，她背台词厉害是因为她识字早，她能快速地理解和背诵老师给的厚厚的台本，不需要一个字一个字地去学。


    # 三、低年龄段的孩子，怎么选择阅读材料


    # 1. 一岁：大部分是图片的童谣集，以及可以“玩”的书


    # 2. 一岁半：主要是图片的故事书和说明类书'
