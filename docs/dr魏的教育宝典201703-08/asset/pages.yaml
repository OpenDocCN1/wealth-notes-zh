    # 四肢发达，头脑就简单吗？


    Dr.魏


    我是北京体育大学毕业的，我经常开玩笑说，我是教脑科学的体育老师。现在我做的研究也是运动控制的脑部机制，有时候也有人会疑惑地问我：“运动跟脑有什么关系？那不是身体、四肢的事情吗？不是说四肢发达，头脑就简单吗？”


    还有人会认为，孩子怎么样才算瓜好呢？那一定得是识字多、会背唐诗、会口算，才叫聪明，至于运动能力强、协调能力好、能够做出很精巧的动作来，那都跟脑瓜没关系。


    # 运动能力好，跟头脑没关系，是错误观念


    如果你按照这种观念来育儿，你会耽搁孩子发展。为什么呢？因为孩子的运动技能，社交能力，认知和语言是同步发展的，彼此之间相互支持。也就是说，如果你帮助孩子发展运动能力，她不仅仅是会变得更强壮，而且也会变得更善于跟其他小朋友打交道，说话，认知能力也更强。


    > 《Dr.魏的家庭教育宝典》的查询结果

    帮助孩子练习精细动作，掌握三种方法


    你千万不能忽略孩子运动能力的发展。孩子的运动能可以分为粗大动作和精细动作，其中粗大动作是指用手臂、脚或整个身体的运动，比如爬、站、走、跑，这些是用了那些比较大的肌肉。精细动作是指那些用比较小的肌肉，比如手,手腕和手指，做一些比较小的动作，比如抓东西、捡东西等等。粗大动作的重要性，我下回会讲，今天我先来讲一讲精细运动。


    # 精细运动是指身体小肌肉之间的协调


    一般是手指的动作和手眼协调能力等，你别看它只是个小运动，但是小运动能成大脑瓜。大脑认知能力的发展其实是和运动发展紧密联系在一起的，早期运动能力的发展可能对孩子未来认知能力发展产生重大影响。


    发展和神经科学证据表明，当运动能力发展的时候，负责认知，包括负责协调多种信息、决策和时间判断的脑区，包括小脑和基底核区域，也会一起发展，这两种能力在婴儿大脑发育早期同时发展，并且紧密相关。


    # 建立或展现认知能力的大多数活动都涉及到精细运动能力


    比如要孩子掌握阅读能力，首先需要发展精细运动能力来控制眼动，帮助我们更好的追踪文字；要孩子学会画画，首先要发展精细运动能力，帮助孩子手眼协调，他才能画出想画的内容；你要孩子学会说话，首先要发展精细运动能力，比如学会运动舌头来控制声音的产生。所以大多数家长看中的这些认知能力，无论是学习、画画还是语言能力等，都跟孩子早期精细运动能力的发展息息相关。


    当你锻炼孩子的精细动作的时候，也就在给他打造认知能力的基础。孩子每时每刻都在学会解决复杂的问题，因为孩子的身体每时每刻都在成长，所以孩子的每一个运动动作都是不一样的，都需要他们不断学习，调整和适应新的动作。运动发展是一个螺旋上升的过程，孩子在发展运动的过程中发展了相当复杂的认知能力来学习这些动作，新学到的运动技能又替孩子提供了更多的认知挑战。


    所以不同的孩子受到的运动刺激不同，那么他们到了幼儿园的时候，他们的认知能力也有所不同。宝宝小时候的精细能力，可以在一定程度上预测他将来的认知能力。比如一项研究发现，宝宝的精细运动能力能够预测孩子上幼儿园的数学和阅读水平。


    另外的研究发现那些在进入幼儿园前精细运动就更好的宝宝，在进了幼儿园之后，也会表现出更高的社会能力，而且注意力更集中，更理解老师的指示，在学校的任务里能坚持的时间更长。所以我才说，小运动促进大脑瓜，你千万不要小看精细运动，虽然看起来不起眼，但能促进你孩子的大脑发展。


    那么，怎么才能帮助孩子练习精细动作呢？我给你三大类方法，第一个是跟孩子玩精细动作游戏；第二个是让孩子做精细动作任务，第三个是鼓励孩子用精细动作去做创造性活动。我下面就具体来说一说。


    # 1. 跟孩子玩精细动作游戏


    第一类方法，是跟孩子玩精细动作游戏，比如哪怕孩子还小，不到一岁，你也可以跟他拍拍手，拿一件他喜欢的小玩具放在他旁边，比如说安慰奶嘴，让他伸手去够，让他抓住，然后练习把安慰奶嘴自己放到嘴里去。


    对于不到一岁的宝宝，有个重要的原则，叫躺着睡、趴着玩。为什么呢？因为现在大部分家长都知道，小宝宝不能趴着睡，会有窒息的危险。所以，在1岁之前，家长都会让小宝宝躺着睡。这是正确的，但是也带来了一个副作用，就是她趴着的时候太少，所以呢，就没法练习一些运动，比如抬头、爬行、用手撑起身体等等。所以呢，你要让宝宝躺着睡，但是他醒着的时候，你可以把他翻过来，让他趴着玩。


    孩子大一点之后，你就可以跟他玩更难的游戏，比如到了1岁以后，你可以玩填充和倒出来的游戏，就是往一个容器里填满东西，然后再倒出来。我女儿就特别喜欢拿小纸杯，在水龙头下面接水，接完后倒掉，再接，再倒掉。


    当然这个玩法有点浪费水，可以用沙子代替。给她一个塑料杯子，她会不停地抓沙子填到杯子里，倒出来，然后再填，再倒，不亦乐乎。


    还有可以用积木。比如把积木从一个大盒子里拿出来，然后再装回去，当然，你不要指望他装回去还跟拿出来以前一样整齐，关键是让他多练习这样的动作。而且这些小游戏你不用监督他玩，小宝宝一般都非常喜欢这种拿出来、放回去的游戏。既锻炼了他的精细动作，又让他摸索了事物的物理属性，还让他玩得特别开心，一举三得。


    # 2. 让宝宝做一些精细动作的任务


    除了玩之外，还有第二大类方法，就是让孩子做些需要精细动作的任务。在这个阶段孩子的精细运动都是跟孩子的生活紧密相关的，最典型的例子是穿衣和吃饭。


    到两岁以后，可以让孩子自己穿衣服、脱衣服，因为当他解扣子、拉拉链的时候呢，就是在练习他的手指和手、眼的协调。一些家长，早上的时候很忙，没空盯着孩子穿衣服，可能就会直接帮孩子穿衣服。我们家孩子，是家里的老人喜欢帮她穿衣服，结果她自己学会穿衣服的时间就变得有些晚了。


    所以，孩子自己穿衣服、脱衣服肯定没有你给他穿快，但是这个时间你不能省，因为你应该宁愿多花点时间，也要把他的精细动作能力发展出来。你千万不能怕麻烦，结果反而阻碍了宝宝的大脑发展。


    我现在教你怎么样一步步锻炼孩子穿脱衣服的能力，其实很简单：如果孩子能力还没有可以自己穿衣服，可以先用玩来锻炼这个能力，比如让他给娃娃穿衣服，或者更简单的，就是给玩具熊披上标一件衣服。等他的手指比较灵活了之后，你可以再给他真正的衣服，但是不是穿在他身上，而是放在床上，让他先玩拉链啊、扣子啊。等他能够掌握这些技巧了，再让他自己穿衣服、脱衣服。用这样比较循序渐进的方法，就可以避免孩子一下子做不到这样的精细动作，产生太多的挫败感，然后不愿意做了。


    类似的一项技能还有如何让宝宝自己吃饭。到了1岁以后，宝宝就喜欢自己吃饭了，甚至不到1岁就会开始抢妈妈手中的勺子，要自己来。有些妈妈担心，哎呀宝宝自己吃饭，总是个一团糟，饭洒了一地，又浪费食物，又弄脏了衣服，最后还没吃饱，所以她们干脆自己来喂了。


    这不利于孩子精细动作的发展。因为1岁的宝宝，正是发展手、眼协调能力的时候，他无论是用手直接抓起吃的东西往嘴里送，还是握住勺子舀起一勺食物来，摇摇晃晃地往自己嘴里送，这些都是对大脑意义重大的学习机会啊。


    # 3. 鼓励孩子用精细动作去做创造性活动'
