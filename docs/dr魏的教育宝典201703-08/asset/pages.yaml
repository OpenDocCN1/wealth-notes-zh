    # Dr. 魏


    # 熊孩子是天生的吗？


    前段时间有个很火爆的视频，是一个女大学生，因为在餐厅里有一个熊孩子哭闹，似乎是踢了孩子一脚。当时网上的评论很极端化，有的批评女大学生欺凌幼小，但也有不少人拍手叫好，说公共场合搞人的“熊孩子”，就该打。


    我今天不是要讨论这个事件本身谁对谁错，而是要站在父母的角度，给你来讲讲如何避免把自己的孩子培养成那种公共场合的“熊孩子”。具体地说，就是你该怎么教养孩子在公共场合的规则意识，这一方面是为了他人着想，另外一方面也是教孩子用规则意识保护自己。


    # 没有永远的天使，也没有天生的熊孩子


    首先，我要反驳一种流行的错误观点，就是认为孩子还小，还没有规则意识，所以孩子熊就让他们熊，长大了就自然懂规矩、懂礼貌了。但实际上，美国杜克大学一项研究表明，3岁的孩子已经可以明白，承诺和合作的意义了，已经可以发展出合作精神了。


    所以，3岁的孩子就可以开始教他们不要熊了，因为此时他们已经不完全是以自我为中心，而是有社会意识和规则意识了。


    随着年龄的增长，你的孩子会逐渐发展出两种社会规则意识：一种是“社会礼节”，比如礼貌、合作、团队精神，这些社会化技能。但还有一种，是同情心、爱、理解、感恩等等，是基于对他人的、发自内心的真诚的关心。


    要知道，人类是群体系动物，我们天生自带亲社会属性。有很多研究表明，儿童天生就有同情心和团体意识，这些并不完全是父母指导或者后天教育的产物。


    所以你知道了，孩子不是天生的“熊”孩子，孩子的大脑早被安装了“好”孩子的预设装置，只是孩子的成长需要时间，他各 especially capabilities
    成熟是有时间限定的。你孩子的理智脑和情绪脑没有成熟，一定会有控制不住自己，发脾气的时候。不要期待他永远是小天使。


    孩子发脾气的频率，到2岁半才开始减弱，一直等到孩子8岁，他才能真正内化礼貌和规则的重要性。所以，必然会有时候，孩子在公共场合表现得有点“熊”。但是这时候你也不要有太多压力，只要他的表现不是太过分太离谱，那就不说明你是一个糟糕的家长，只不过是你的孩子还小罢了。


    # —— 宝典查询结果 ——


    在摆好心态的前提下，我们还是要尽量教会孩子基础的社会规则意识，下面我就从三个方面来讲一讲。


    # 1.设定期望，提醒行为


    你可以给孩子设定好期望值，提醒他的行为。因为我看到一些所谓“专治熊孩子”的家长，教育孩子的做法要么是长篇大论说教，要么是暴力镇压孩子行为：“你再不听话我就抽你了！”


    但这样做一般都没什么效果。正确的做法是什么呢？其实还是我一直主张的，要帮孩子把抽象的教育转化成具体的行动。指责或者打骂孩子，并不能帮助孩子认识到规则的意义，你真正需要做的是指导他的具体行为，才能培养出孩子在未来几年中的规则意识。


    # 2.在公共场合不要修正行为，直接离开


    # 3.早培养，从点滴基础做起


    Dr. 魏的小“叮咚”


    最后，我要叮咚两句。刚才我一直在讲怎样培养孩子的社会规则意识，但是其实还有最重要的一条，就是身教大于言传。父母是孩子最重要的榜样。你的孩子一直在看着你，想要你孩子不做“熊孩子”，最重要的是你自己不能做“熊”大人。'
