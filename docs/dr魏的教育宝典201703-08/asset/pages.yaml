  md: '说明类的书也一样，一定要”是孩子熟悉或者感兴趣的信息，比如吃的苹果、开的汽车，他都经常看见的，所以就很容易把图片跟文字联系到一起。


    还有，现在的文字虽然不是童谣了，但仍然要注意节奏感，最好是那种朗朗上口的语言，因为孩子对这样的语言更感兴趣，也更记得住。


    # 3.两岁到三岁：多样化的绘本


    孩子两到三岁以后，就要注意给他选的绘本应该是多样化的，比如不同的形状、不同的大小、不同的颜色、不同的图片风格，还有不同的主题等等，这样可以全面刺激他的大脑发育。


    这个时候，宝宝对书这个东西应该已经很熟悉了，知道它是個很好玩的东西，而且如果是一本自己读过很多遍的书，他还会主动拿起来，在里面寻找自己认识的东西和人物。读得多的孩子，到3岁后都可以理解故事情节了，甚至还能按照图画，给别人讲里面的故事。


    当你陪他读书的时候，有个小技巧，就是指读。就是你伸手一个字一个字地指着给孩子读出文字来。我大女儿就是这么学文字的，我从她差不多2岁开始，就给她指读绘本。她那个时候虽然还不识字，但是跟着我的手指，她自己看着字，看着图片，再听听我说的话，自然而然就把文字学会了。


    指读的好处是，强调了孩子的字形意识。因为这时候孩子刚开始识字，先要有“字形意识”，也就是说意识到，字跟字不仅意思不同，形状也不一样，每个字都有对应的发音。有了字形意识，他才开始慢慢发展出区分和记忆不同字的能力。


    Dr.魏的小“叮叮”


    当然，最后我也要叮叮一下，上面这些跟年龄有关的建议，只是根据大部分孩子发展的特点，给你的参考。你应该根据你家孩子阅读和识字能力的实际情况，进行调整。但是总的原则，你听到这里肯定也明白了，就是自然、好玩、互动。


    那么等孩子大一点了，过了三四岁，孩子的识字能力进一步发展，等逐渐掌握阅读技能，逐步就可以自主阅读，也就是自己读书，不需要家长陪读或者帮读了。自主阅读能力是提升孩子的阅读数量和质量的关键，而提升孩子自主阅读能力的
    一个关键，就是提升孩子的识字能力了。


    # 一句话总结


    +   1. 阅读有马太效应，如果你家宝宝小时候阅读能力就强，那他会越读越爱读，越读越会读，但是反过来，就可能阅读能力影响认知能力，也影响他的认知环境，这样他就可能跟同龄宝宝的差距越拉越大。
    2. 阅读要从娃娃抓起。你不用怕孩子识字早有负面作用，只要你不是用机械、割裂的方式灌输孩子认字，而是用互动、好玩的方式让孩子自然地学习认字，那就可以使他更早萌发认字
    的能力，从而培养出更强大的阅读能力。 3. 今天我按年龄分段，讲了一下1-3岁的宝宝，应该选择什么样的阅读材料，才能帮助孩子用这样更好玩、更自然的方法去识字。对于识字已经有一定兴趣的宝宝，可以试试我们开发的一款亲子游戏“吃汉字的
    小刺猬”，帮助你的宝宝更好地识字。


