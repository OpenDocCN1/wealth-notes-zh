  md: '# 智力脑｜电子设备，是洪水猛兽还是育儿助手？


    # 我家宝宝能用电子设备吗？


    Dr.魏


    我们都知道电子设备的坏处，可还是到处都能看到，家长在一边忙着，宝宝自己拿着手机玩得不亦乐乎。其实我在美国的时候，就经常看到家长在一起聊天，孩子在一边拿着手机或者ipad，盯着小屏幕看。


    为什么会这样呢？有一次我在演讲里讲到电子设备的坏处后，就有家长来诉苦了。她说：“Dr.魏，我也知道你说这些电子设备的坏处，可是没它实在不行啊。我跟孩子他爸都这么忙，回家都累得不行了，就想赶紧休息一下，这个时候孩子再黏上来，也就只有给他手机，能让我歇歇了。”


    这个家长说得也很实在。确实，电子设备就像万金油，很能吸引孩子的注意力，无论是你需要让孩子不缠你，还是让孩子安静下来，只要你拿出手机来，就是特别管用的方法。


    在现代社会，让孩子彻底远离电子设备不现实。连你自己是不是都片刻离不开手机？包括带孩子玩，你也会给他拍照，发到朋友圈去晒晒。要吃饭了，拿手机去查哪家餐厅好，甚至连买个玩具，都能用手机支付。手机整天在孩子眼前晃，他肯定好奇，想自己拿来玩玩，你总是藏着躲着也不是办法。


    就连美国儿科学会，也在去年修改了对儿童“荧屏时间”的指导意见，这个“荧屏时间”就是看手机、电脑和电视等各种电子屏幕的时间。他们把“荧屏时间”改得更宽松，而且把儿童使用电子设备的最小年龄，也从两岁放宽到了1岁半。


    电子设备，能不用就不用


    那么，如果你家宝宝超过了一岁半，就可以放心地让他玩手机了吗？那我可要很认真地警告你：当然不是！首先，电子设备伤害宝宝视力。因为小孩子的视觉系统还没有发育完全，对颜色的处理虽然在一岁前就发育得差不多了，但追踪物体、深度视觉等能力，还远远没有成熟。如果这时候你放纵孩子玩各种电子设备，对他们的视觉影响很大。


    ![](img/8dd4b172abeef48fa291369820efe392_9_0.png)


    两岁的孩子，是要通过各种感觉器官，比如听觉、嗅觉、触觉、视觉、味觉等来一步步感知这个世界的。电子设备只有一个平面，孩子跟屏幕的互动很有限。当孩子只能被动接受信息时，他们能“吸收”和“反馈”的东西都十分有限。当他的大脑接受到的刺激不够时，也就不能充分发展，这就是我在前面反复讲过的神经可塑性原理。


    《Dr.魏的家庭教育宝典》查询结果 限定时间、限定场景、提供替代方案


    # 1.限定时间


    # 2.限定场景


    # 3.为电子设备提供替代品'
