    # 真的有照相式记忆吗？


    我之前提到过没有必要让孩子报记忆术培训班，后来有个家长问我：“Dr. 魏，你说记忆术只能帮助记一些单一元素，比如数字，可是我听说一种照相式记忆，有这种记忆能力的人，能记住看到的任何东西，这是真的吗？我还听说有培训班专门培训孩子的照相式记忆，这能相信吗？”


    照相式记忆（ Eidetic memory），是让孩子过目不忘，听起来是提神奇的。研究发现，确实有少数人拥有这种能力，不过这类人非常少，而且在一些极端例子中，这种能力还给过目不忘的人带来生活上的极大困扰。


    # | 记忆的编码、保存和提取


    对认知科学和脑科学来说，记忆是对信息进行编码、保存和提取的过程，这个过程中的任何一环出现问题，都可能造成记忆储存失败。


    # 1.重复越多，记得越牢


    在外显记忆中，含有事实类信息的记忆，比如记忆一些有固定答案的问题，或者背诵表口诀，这些记忆是最难提取的，因为信息之间往往很孤立，跟我们的生活又没有什么关联，没有模式可循。这时候我们可用的记忆方法比较简单粗暴，适当重复、背诵就可以。


    # 2.联结越多，记得越牢


    # 3.越会分块，记得越牢


    通过将杂乱的信息切分为更有意义的组块，我们可以把信息转化为可以快速记忆的内容。比如我要要求你在五秒钟之内快速记忆一连串乱序的英文字母，“USM BAP HDC
    CTV”，怎么能记住这些信息呢？'
