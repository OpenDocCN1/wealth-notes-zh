    Dr.魏


    5.15（周一）：宝宝识字太早好不好？


    有些家长让孩子学识字，会用各种“威胁利诱”的方法，这是错的。应该多跟孩子互动，让他识字的时候，能够自然地联系生活场景，具体怎么做，下周一告诉你。


    5.17（周三）：掌握带孩子逛博物馆的正确姿势


    带孩子逛博物馆，重点应该看什么？我们期待小孩子从博物馆中得到什么？下周三，给你一套家长带孩子逛博物馆的正确姿势。


    # —— 本周问答时间 ——


    +   1. 学步车到底该不该用？

    2. 摇晃宝宝对大脑不好？

    3. 牵手学步对不对？

    4. 孩子更喜欢与怎样的爸妈亲近？

    5. 与孩子长期分离怎么办？


    # 1.来自运动脑｜学步车该不该用？


    学步车是不是那种一个圈圈一样然后孩子坐在里面到处滑动的那种？


    助步车就是老师提及的 activity walker 吧，超市那种迷你推车般的。那么老师建议学走路的时候是完全自己练习不用助步车呢？还是可以使用助步车呢？


    Dr.魏


    每个孩子运动发展的阶段都是不一样的，要顺应孩子的发展规律。


    七坐八爬，十站周走，那是大家总结的经验之谈，宝宝没那么快，完全没问题。有的孩子身体的确没有发育到那个阶段，家长就着急想上大部分孩子的步伐，硬给孩子装上一些辅助装置，比如学步车，其实是拔苗助长，还可能有安全隐患。


    孩子要自己一步步练习坐、爬、站、走，通过不断试错才能习得走路。回到@蒋你的问题，如果孩子喜欢练习爬、站，尽管多让他自己练习。这是头种最自然最适合孩子学步的方式。我在家中，会给家具的边边角角贴上防护贴、防护垫，防止孩子磕碰到。然后，就随孩子自己扶着椅子、桌腿，一步一步学会站了。


    如果你一定要给孩子用学步辅助工具，可以准备学步手推车 activity walker，也就是你说的助步车。不过你一定要使用质量好的产品，不要太轻免得容易推翻，还要记得推车扶手的高度应跟孩子的手臂水平


    # 2.来自运动脑｜摇晃宝宝对大脑不好？


    很多人说摇晃宝宝对大脑不好，所以我想请教一下这个问题到底是好还是不好？


    Dr.魏


    我在文章中说，适当摇晃有助于快速安抚孩子。但是记住，过犹不及。


    我强调了转椅子游戏或者晃动孩子的时候不要太快太猛。因为孩子的大脑像果冻一样脆弱，剧烈的抖动很可能对大脑造成损害。有些父母跟孩子玩的时候过度了，或者情绪失控，突然暴力的摇晃孩子，或者长时间快速摇晃孩子，这都可能对婴儿产生损害，伤害孩子脑部血管和神经纤维，这种症状叫摇晃婴儿综合征SBS。


    美国儿科协会建议，要避免剧烈摇晃婴儿的头部。所以摇晃孩子的时候要轻轻摇，而且摇一下，停一下，速度不要太快。因为宝宝的脖颈比较脆弱，抱着宝宝玩儿的时候，还要保证用手托着他的头和颈部。


    # 3.来自运动脑｜孩子有牵手依赖怎么办？


    老师好，我家孩子刚好在学步期，一岁一个月，拉着大人的一个手指头可以走得很快，在床上他敢自己站起来走，但是在地上走必须有大人牵着，是宝宝比较胆小吗？


    我家孩子大运动发展都在合理时间范围内，四个半月翻身，六个月侧翻爬，七个月手膝爬，九个月基本扶站及扶走。 目前这种情况，我是让一直让他牵大人手走，还是鼓励他自己单独走呢？


    Dr.魏


    @兔宝宝 你好！你的问题非常典型，很多家长留了类似的问题，学步期，我孩子要牵手才走，不牵手不走，该不该继续牵着他走？首先我还是直接回答，不该。我解释不要用学步车时强调了一点，学步车会给孩子虚假的平衡感和虚假的安全感，其实什么学步车、学步带或者妈妈的手都是一样的，这些都会给孩子虚假的安全感和平衡感，只是程度上有不同。要让孩子建立100%的平衡感和安全感，首先要孩子100%掌控自己的身体。


    当孩子能对自己的身体负责时，他会更有安全意识，平衡系统也发展得更好。孩子是强大的学习机器，机油是孩子的各种练习机会。爬行、扶站、迈出第一步，如果这中间妈妈总帮忙牵，就像机油掺了水，孩子无法锻炼出一套适应良好的平衡能力和敏锐的安全意识。


    具体分析一下，@兔宝宝 你家宝宝在床上敢自己站起来走，但在地上走必须由大人牵着，不是说明他胆小，恰恰说明他有安全意识。可能你的心态比较急，看到用手牵孩子能走得飞快，就下意识一直牵着。可孩子是最清楚自己身体状况的人，他知道还没有能力独自迈出结实的一步，所以他选择软软的床或者妈妈的手来降低风险。


    所以一定要顺应孩子生长规律，不是催着孩子快快走，而是在孩子旁边鼓励他，用语言指导他练习独立走。总原则就是啰嗦心要硬，忍住不去帮忙，并做好这个过程会很长的心理准备。


    孩子怕摔？没关系，告诉孩子摔倒很正常。要摔的时候不要慌，用屁股着地，屁股和骨盆比较结实可以保护你。你可以提前跟孩子预演几次摔跤，再安抚他真要摔了爸爸妈妈会帮助你的，给孩子心理打预防针。


    实际上对孩子来说，从扶站过渡到独立行走，意义非常重大。我成人都觉得难以理解的话，想想猩猩花了多久时间才直立行走。


    # 4.来自情绪脑｜爸爸带娃的困惑


    我是一位奶爸，在孩子三四岁时有一时间就和孩子在一起，而且那时小宝还特别粘我，就连晚上睡觉都要和我睡。可孩子现在大点了，每天都躲着他妈！孩子他妈性格比较强势，是不是小孩懂事了就爱躲着强势的一方呢，求老师解答。


    Dr.魏


    首先跟聪明奶爸@迪迪斗握手，有些妈妈留言说爸爸们普遍不懂表达爱，不会跟孩子互动，你已经比很多爸爸做得好了。回到你的问题“是不是小孩懂事了就爱躲着强势的一方呢”，我的回答是，是有可能的。一项研究表明，13个不同的国家的心理学团队形成了一个解释：儿童和青少年可能会更加重视他们认为更有声望的或著有更高的人际关系
    的父亲或母亲。


    用你的例子，如果妈妈比较强势，孩子可能会觉得在家妈妈有较高的声望，那么幼儿中妈妈比起爸爸就更有影响力、话语权，孩子也更容易被妈妈影响。


    当然，这只是其中之一的解释，孩子黏妈妈可能有很多原因。但我特别理解你这种“失宠”的感觉，你可以按照我说 的，趁周末母亲节，让妈妈放假，陪孩子玩儿，独占他一天，“抢”回孩子的注意力。


