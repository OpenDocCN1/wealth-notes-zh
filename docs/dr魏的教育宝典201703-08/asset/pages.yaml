  md: '利于他随时利用反馈来进行调整，那样很快就没有动力再继续了。所以，你的反馈不但要及时和具体，而且不要有太多的负面的反馈。


    # 运用以上这三步，具体怎么玩


    我们今天讲到达到心流，也就是最高专注力的三大步骤，我给了一个玩游戏的例子，我们从孩子喜爱的那些游戏的设置中可以找到达成心流的三个步骤。


    我们知道经常经历心流的人，专注力都强，而且专业技能都很高。因为我刚才说了，你在心流里面就进入正循环了，因为专注，所以能力很快提高，因为能力提高，所以就更加专注。这才是由内而外的，培养孩子专注力的根本方法。


    # 这三个步骤怎么用呢？


    我刚才已经用学钢琴的例子做了说明。现在我再举个最常见的例子，就是让孩子做作业。


    # 1.你要跟孩子目标具体化。


    有些家长就是让孩子往桌子前面一坐，然后就下命令：“给我做作业！”这个命令对于大人很好理解，不就是把作业一个一个地拿出来做吗？但是孩子不一样，他一想：“做作业……做一个手工，画一幅画，或者去跳绳，到底做哪个呢？”你看他坐在那里出神，你觉得他好像是注意力没散了，其实是他自己困惑了，拿不定主意具体要做哪个。


    所以，你需要帮他定目标，你可以说：“今天有什么作业？哦，有手工，有画画，还有跳绳。那你想先做哪个？不知道？那要不先做手工吧。我们来看看，到底要做什么样的手工？”你就可以跟他一起研究一下手工的要求，帮他把这个大任务拆成小任务，你可以说：“哦，要用彩色的纸做一个小动物。那你要做什么小动物呢？小猫？好啊，我们来看看做小猫需要什么？”


    # 2.为孩子挑选适度的目标。


    在这个过程中，你一定要注意，你为他拆解开来的那些小目标，不能太难，也不能太容易。如果孩子已经能自己做好手工小猫了，那你就不用管他了，让他自己去做就好。如果他的能力还不够，那你就只提供适当的帮助，让他刚好能够自己动点脑筋，就正好完成，那他会最有成就感。


    # 3.在孩子做手工的过程中，你也可以适当地提供反馈


    当然，这个反馈不能老是批评，比如有的家长很喜欢批评：“哎呀，你这个猫脸太扁了。”“你看看，这个眼睛画成什么了，这不是猫眼，成狗眼了！”最好的做法是，批评的同时，温和的给孩子具体的建议，“你这个猫脸有点扁了，可以把它重新剪得圆一点吗？”


    最重要的是，孩子做得好的地方，一定不要吝啬你的表扬：“嗯，这个鼻子画得特别像，鼻子是猫的重要特征，跟其他很多小动物都不同。”“哈哈，我觉得你这个猫额头上的‘王’字很有创意，现在你这只猫就像一只老虎嗷！”


    Dr.魏的小“叮叮”


    最后，我要再叮叮一下，就是这三个步骤不光是做作业，其他的事情，比如学游泳、下围棋、读书、听英语，任何你需要孩子学会的任务，都可以用到这三大步骤。我相信你也可以举一反三，用同样的方法，让孩子更专注。


    我也鼓励我们成年人在自己的生活中试一试，我们是不是也经常注意力很难以集中呢？同样的方法也可以适用在你身上，你也可以用来改造你的任务！


    +   1. 想提高孩子的注意力，不能光靠逼他，而得靠引导孩子，让他发自内心地愿意专注在当前的任务上。


    +   2. 三个步骤引导孩子：第一，给他设立明确的目标；第二，难度跟他的能力相匹配；第三，我们作为家长，要及时给孩子反馈，这样就可以让孩子自发地集中注意力，而且水平也会很快提升。


    Dr.魏


    今日行动关键词「带着叮叮魏的建议，玩游戏」


    家长怎样通过自己的行为，引导孩子变专注，最重要的是去实践。听完本期内 容，希望你能做个小回顾，看下自己之前有没有发生过类似情况。


    并尝试一下，让孩子学个小技能，比如写数字“1、2、3”，并及时给他反馈。


    我会在留言区，等着你的感受分享。


