  md: '# 智力脑｜表扬有技巧，如何正确地夸孩子？


    智力脑｜表扬有技巧，如何...


    # 孩子到底该怎么夸？


    Dr.魏


    现在流行表扬孩子，虽然表扬孩子能提高他的自信心，这对孩子的未来很重要，但是表扬也要注重方法。如果表扬错了的话，可能不仅不会帮助孩子成长，而且不会让孩子成为自觉学习的人。


    比如说我女儿，在春节的时候给亲戚背个唐诗，大人就会夸她：“哎呀，你真棒！”我带她出去买东西，结账的时候她把钱的总数先算出来了，售货员就会夸她：“这孩子真聪明！”有朋友到家里来，看到孩子弹电子琴，也会当着她的面对我说：“真不错，你女儿很有音乐天赋啊！”。


    但是这些夸奖，是有负面作用的。


    # 夸孩子，搞清你是在给孩子灌输成长型心智模式，还是固定型心智模式


    当我的孩子被夸奖，其实我是有点尴尬的，因为我很感谢他们的好意，但是又不得不对他们这种表扬的方法。所以，我会把朋友说的不妥的地方，换一个表扬方式，再给孩子讲一次。


    # 区分成长型心智模式和固定型心智模式


    成长型心智模式和固定型心智模式，是斯坦福大学卡罗尔·德韦克教授在她多年的研究基础上提出来的。德韦克教授30年前就开始思考一个问题：为什么同样是遇到挫折，有些孩子能够屡败屡战、不断努力去克服困难，而有些孩子却会轻易放弃，甚至不敢去迎接挑战？


    > 《Dr. 魏的家庭教育宝典》的查询结果：

    成长型心智模式，更能让孩子战胜困难


    # 这两种不同的心智模式带来的后果是什么？


    # 夸孩子聪明与夸孩子努力效果大不同


    # （1）被夸聪明的孩子更容易放弃，被夸努力的孩子更可能坚持下去


    # （2）被夸聪明的孩子比被夸努力的孩子更可能谎报成绩


    # 教你三招夸孩子的心法


    # 1. 表扬努力，而不是聪明'
  merge: -1
  img_proc: true
- pgno: 29
  md: '如果你只表扬孩子聪明，他以后想的就是，怎么才能看上去更聪明？这样并不能让他真的变得更聪明，而只是让他躲避挑战、轻易放弃，甚至把时间都花在表现得更聪明的表面功夫上。


    所以，如果你希望孩子变聪明，就不能表扬他聪明，而是要表扬他努力。这样，孩子才会觉得，我的这个成就，是来自于努力，而努力是他可以控制的。你当然希望他会觉得自己能控制自己的命运，能自主地去学习去取得成就。


    # 2. 表扬过程，而不是结果


    你要表扬孩子成功的过程，不要直接告诉孩子结果。


    比如我给孩子做数学题，有的时候孩子会催着我给结果，其实孩子做得很好全对了，我也不会简单点头说个对，然后打个分数，而是先问孩子：“你是怎么算到这一步的？”等到她把计算过程说出来之后，我会说：“很好，这个方法很不错，还有什么别的方法吗？”孩子就开始想另外一种算法，她会说：“你看我用数学乘法是这样的，可是你上次教我的方法更快。”这种表扬方式，就是不要让孩子过于在乎分数，而是培养他找数学规律的兴趣，并且把他的注意力引导到过程上去。


    为什么要这样表扬呢？就是让孩子感觉到，学习的过程比结果更重要。如果只是简单地告诉孩子结果，比如“你这次一道题都没错”，你老是这么说的话，孩子下次一出错就发脾气，因为他的重点不在体会数学本身的美，而在“不能出错”这件事情了，渐渐地他就害怕出错，开始回避挑战了。所以，下一次孩子遇到挑战时，提醒孩子把重点放在跟挑战搏斗的过程中，这就是在培养他的成长型心智。


    # 3. 表扬成长，而不是表现


    想要孩子勇敢迎接更高的挑战，你要表扬孩子的进步、成长，而不是这一次任务当中的分数或者表现。


    我举一个我女儿弹琴的例子，有时候她弹错了几个音，她自己就会很沮丧，一错就回去重弹那几段，来来回回纠结在错了的那几个音上，每次都弹不到后面。这时候我会先安慰她说：“有时候有错没关系，爸爸都在听着，我先帮你记下来，我们接着弹，爸爸跟你一起，我们先走一遍这个过程，先把错误都揪出来”。


    你作为家长，应该知道孩子的表现，你需要做的是给出及时的反馈，帮助孩子分析错误，找到问题所在。最后我会跟她说：“我们是在错误中学习，你错一次爸爸还挺高兴。上次你在第五个小节的时候没弹好，有点乱，这次爸爸听了，特别漂亮，有进步。这证明我们又找到一个漏洞了，而且我们又把一个漏洞给补上了”。有时候我还跟她击掌相庆这个进步，因为我要让她知道，哪怕遇到挫折困难，但只要努力去解决了，就值得夸奖。


    如果孩子弹得很完美，我也不会简单地说：“你弹的真棒，一个音都没错。”而是说：“你比上次进步很多，上次你有五个地方没弹对，但是这一次你把这些漏洞都填补上了，这个进步很好。”这样就把孩子的注意力转移到进步的过程中了，因为你要告诉孩子你在乎的、关注的，并不是孩子一时的表现，而是帮她建立起从错误中学习和成长的习惯，那才是真正关系到她一生成长的关键。


    Dr.魏的小“叮叮”


    我们生活中可能会遇到一些人，这些人不怕挫折，特别注重提升自己，他们愿意自主、自觉地去学习，这是为什么呢？这是因为他们从小就被培养成长型心智，能从错误中学习，而不是占据固定型心智，早早把挫折归结为自己不够聪明，认为智力无法改变，也就不容易从失败中学习了。


    +   1. 成长型心智和固定型心智，会对孩子的未来产生巨大的影响，成长型心智的孩子乐于迎接挑战、遇到困难也不放弃，而固定型心智的孩子害怕挑战、遇到困难会轻易放弃。


    +   2. 怎么培养孩子的成长型心智呢？你(?)在表扬孩子的时候要注意，表扬努力，而不是天赋；表扬过程，而不是结果；表扬成长，而不是表现。


    Dr.魏


    今天我教会了你关于成长型心智的原理和方法，其实最主要的是怎么夸孩子？


