  md: '# 情绪脑｜家长如何摆脱孩子的时间绑架？


    情绪脑｜家长如何摆脱孩子...


    # 你今天被“绑架”了吗？


    Dr.魏


    我在上一期讲到过过度养育的危害，就是那种对孩子过度保护、过度帮助、代替孩子做决定的“直升机型父母”，会让孩子更焦虑，更脆弱，更不幸福。假如你发现，你孩子遇到问题都来找你，很容易被困难打败，你也是经常感觉为孩子心力交瘁，那你很可能就是在过度养育了。


    当然我也知道，关注孩子是父母的天性，保护、帮助、指导也是我们做父母的职责，但是如果孩子的一举一动都会牵动着你脆弱的神经，他一哭一闹就会让你心惊肉跳，那就是说明你关注得过头了，你其实已经被自己对孩子的关注绑架了。这个时候，你的过度养育对孩子就是弊大于利了。


    # 反其道而行之，注意三个方面


    那么，该怎么办呢？我给你三条建议，就是要注意自己最容易被孩子绑架的三个方面，第一，是孩子的困难，第二，是孩子的情绪，第三，是孩子的生活。


    所以，你要反其道而行之：


    +   1. 不要把他遇到的困难看成是多大的事，让他自己去做决定，去试错，去被困难磨练，那对他有好处，这就是不被他的困难所绑架


    +   2. 不被他的情绪绑架，也就是不要一看见孩子有负面情绪就紧张，就算法难过、失望、沮丧、生气，也不等于就立刻需要你的援助


    +   3. 最重要的是不要被孩子的生活所绑架。孩子和家长各有各的人生，你没办法代替孩子过一辈子。把自己的生活过好，这才是最重要的，并且对孩子也更好。


    > 《Dr.魏的家庭教育宝典》查询结果 从困难、情绪和生活入手，给孩子空间


    # 1. 不被孩子的困难绑架


    你要知道，困难不是孩子的敌人，而是他的朋友。一个孩子呱呱落地的时候，什么都不懂，什么都不会，怎么到了后来就成长为一个大人的呢？还是靠各种尝试、各种挑战，最后才绽放出来的。


    所以，我是用积极的眼光看女儿遇到的困难的。如果困难太大，当然我会帮她，但一般情况下，如果她努力一下就能解决的，我就会在旁边观察。比如说，搭积木，有时候她找不到正确的搭法，向我求助，但是我知道她已经快要做到了，就只差一点点，我就会坚持说：“哎，你再试一试，你现在这个思路是对的，再试一次说不定就成功了。”她没有办法，只好继续再试，结果又试了两下后，成功了！她那个开心啊，脸上那个自豪的表情，假如是靠大人帮忙的话，绝对是看不到的。所以，孩子遇到困难的时候，尽量先让他们自己尝试解决，才能帮助他们建立真正的自信心。如果老是靠大人帮忙然后成功，那他的自信心，就是作弊来的，是虚假又脆弱的。


    # 2. 不被孩子的情绪绑架


    别被孩子的情绪绑架。因为做第一步的最大障碍之一，就是孩子遇到困难后，难过、沮丧和生气。当孩子又委屈又伤心地哭起来，那可真是让我们做父母的心都要碎掉，恨不得做什么都答应，只要能让孩子不伤心。但是，这个时候你要注意，你其实是对孩子的情绪过多关注了，你被过多关注绑架后，对他的情绪发展反而不利。'
