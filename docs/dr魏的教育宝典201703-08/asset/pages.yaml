  md: '# 读者问答｜做他人的军师，你将得到一个智囊团


    Dr. 魏


    今天的问答开始前，想跟大家啰嗦「留言分享」


    我发现很多家长说自己不懂英语不知道怎么办，留言都比较简短，而积极分享学习方法的家长们，留言有条理而且具体。


    我要强调，育儿没有一劳永逸，只有家长也不断学习，你可以通过观察别人，通过各种资源，通过经验的积累，总之只有你自己不断的向上，孩子看到你的努力，才会愿意跟你一起努力，才是一个育儿育己的正向循环。


    很高兴看到我的家庭教育宝典汇聚了一群不吝啬分享知识的聪明父母，我的学习小组「聪妈家长会」近期也开通了，欢迎大家多多参与，希望大家善用资源，分享更多自己的育儿心得，让这个专栏最大化为你所用。


    希望你能成为他人的军师，而他人也将组成你的育儿智囊团。


    下周讲什么？今天给大家做预告。


    4.10（周一）：如何让孩子集中注意力？


    孩子注意力老是不集中，在幼儿园也不能好好听课？自控力差，经常被老师批评？如何让孩子集中注意力，叨叨魏有妙招。


    4.12（周三）：三个步骤，让孩子变成专注宝宝


    提升孩子的注意力？自发的专注比环境因素更重要。让孩子真正地专注，还得靠引导。下周，叨叨魏将帮助你的孩子塑造专注力。


    # 1.来自语言脑｜关键词：爸妈都不会英文，怎么给孩子启蒙？


    Dr. 魏我和孩子爸爸都不会英文，那我们要怎么帮孩子启蒙英文学习呢？


    Dr. 魏


    我收到了很多像@形形妈这样说自己完全不会英语的家长的留言，确实从0到1开始学习外语是一个比较大的挑战，家长有艰难情绪很正常。


    开始今天的读者问答前，我邀请家长们想一下这个问题，如果我们成年人对英语是一个艰难情绪，还怎么去期待几岁的孩子愿意去学习外语呢？


    我分享一个让我很有感触的留言，来自@爱稀饭，供你参考：


    其实要孩子英文好，并不一定需要家长英文也非常好。我有一个朋友给孩子英文启蒙的时候，自己连26个字母都不是很好（她自己的话），她和孩子一起看动画，看绘本，一起学，现在她孩子9岁多，能读原版小说。


    我家姐不到2岁，我跟她开始听读绘本、看动画。她现在9岁多，英文很不错（6岁就可以自主阅读），但我基本上她6岁就不再管她英文，后面基本是自学，直到8岁多才开始系统上在线外教课。有些经验分享给大家，尤其当你英文不好时，对于小孩子英文启蒙：


    +   1. 父母的作用不是教孩子，而是激发孩子对英语的兴趣。父母是教练，而非老师。所以刚开始起步，多用资源，引导兴趣。


    +   2. 磨耳朵最重要，必须先听力输入，甚至不需要孩子懂，重点培养音素意识和语感，语感非常重要。


    +   3. 早期英文阅读，一边中文一边英文都没问题，当孩子明白后慢慢只读英文。这个方法最简单，我就是这样开始的。


    +   4. 启蒙阶段不要纠结于孩子发音错误，只要多听原版，她自己会纠音。


    +   5. 英文初期不要背单词学语法，容易影响孩子兴趣。其实多听多读，孩子看到词不会拼但会读，就跟中文一样。语法不学，他照样会说正确句子。有时说错了，甚至会自己纠正，因为有了语感，说错了感觉不舒服。


    当孩子听力很好的时候，可以开始学习 phonics，培养孩子自主阅读。这时候你能力不够，你就可以找专业的老师教孩子，但需要选择跟你能力一样的。而且这样的英文启蒙，是最有效且花费最少。


    我家姐8岁多前没上过英文班，省得钱我全买了英文书。学前英文兴趣班，充其量是激发孩子英文兴趣，学不到多少东西，一节课内容还不如自己带孩子读一本绘本。当然，如果你实在没时间、没精力但有钱，也可以为他选一个兴趣班，但千万别选那种上来就背单词教语法。就算是上了兴趣班，在家的磨耳朵也不能少。


    父母英文不好的缺点就是在家不能跟孩子互动，我们家对孩子没有英文互动环境，所以我后来选择在线外教，并让她直接学习美国本土原版语文课程 Wonders G2。我发现，有深厚听力基础和阅读基础的孩子，口语提升也会比较快。


    我发现很多说自己不会英语不知道怎么办的家长，留言都比较简短，而积极分享学习方法的家长们，留言往往像@爱稀饭一样，有条理而且具体。


    我要强调，育儿没有一劳永逸，只有家长也不断学习，你可以通过观察别人，通过各种资源，通过经验的积累，总之只有你自己不断的向上，孩子看到你的努力，才会愿意跟你一起努力，才是一个育儿育己的正向循环。


    # 2.来自语言脑｜关键词：家长口语不标准，影响孩子吗？


    Dr. 魏，您好！如果家长的英语口语不够标准，会不会在日常生活的英语交流互动中给了孩子一个错误的，或者不够标准的示范，从而影响了孩子的语音呢？


    Dr. 魏


    家长的口音会影响孩子吗？我看到很多家长也问到这个问题，怕自己英语发音不标准，影响孩子发音。


    首先，家长的主要工作是孩子的英语启蒙，而孩子英语启蒙需要的，就是激发孩子的兴趣。我在《语言脑｜教你三招亲子游戏，玩着学外语》里介绍了拍手拆单词的游戏，就是把一些最基本的单词，用拍节拍的形式大声念出来，甚至是配合一些舞蹈动作，手指足蹈，念唱出来，这个目的就是为了吸引孩子的注意力。


    这里用的都是最简单的词汇，这种打节拍的形式对你的口语要求也不高（对你的表演力却有点要求，开个玩笑哈～），宝宝它都特别喜欢。你不要担心自己会不会影响孩子的口音，咱家长只是孩子英语学习的领路人，英语的修行之路还很漫长，孩子有的是机会纠正他们自己的发音。


    前面的聪明家长@爱稀饭就发现宝宝其实自己会根据原版英语纠音。实在是不会发音，你可以跟孩子一起查单词，听磁带，让孩子做你的学习伙伴，在互学中一起成长。你甚至可以让孩子当你的小老师，问孩子：“这个单词怎么读？”孩子英语学习更有成就感，你也育儿育己了呢。


    我这里分享下聪明家长@tony的例子，给所有对自己的口音有顾虑的家长参考：


