    平时跟孩子说话的时候，我也会注意多用“大小”“轻重”“长短”这类比较词。比如问她：“在我们家谁最矮呀？”她可能会说“荨荨最矮”。类似的“谁最高”“谁最重”都可以问一问。


    孩子回答的时候，我会有意识地加上测量单位，比如爸爸重70“公斤”，妈妈身高165“厘米”。在这些潜移默化中，孩子意识到数字是有意义的，它们可以是用来代表物质的体积、重量这些特质的。


    测量思维可不只是身高体重。很多爸爸妈妈都知道时间范畴的重要，其实测量思维也能锻炼到孩子的时间观念能力。我女儿小的时候，我经常问她时间。比如她在玩玩具，我会指着钟对女儿说：“还有十分钟，就该吃饭了。”这样做，一来强化了孩子对时间的感知力，二来，孩子有个心理上的预期，之后到点时会比较愿意放下玩具，准备吃饭。


    一样的道理，女儿睡觉之前，我会指着钟问问她：“离你睡觉还剩多少分钟啦？”这样既培养了孩子认钟表的能力，又让她觉得自己可以选择什么时候去睡觉。她对时间有把控力，也就更愿意配合去睡觉。


    # | Dr.魏的“小叮叮”


    最后还是再叮叮下，我们的孩子生活在一个充满诱惑的世界，电子产品、游戏、视频，这些都会吸引他们的注意力。但是，数学、科学、阅读这些活动，看似枯燥，却能激发孩子的抽象思维能力，对孩子的成长非常重要。


    怎么样才能把孩子的兴趣吸引到数学上来呢？要靠父母的引导，父母是孩子的第一吸引力。很多妈妈因为自己童年对数学不开心的经验，把数学跟负面情绪联系起来，产生了焦虑感。芝加哥大学的一项研究表明，如果父母对数学感到焦虑的话，这种情绪会传染给孩子，影响他的数学成绩。


    如果父母表现出对数学能力的赞赏，能把数学和生活日常结合，愿意和他们一起来玩数学，把数学做得“营养又好吃”，孩子就会像吃货一样喜欢数学。


    # 今日得到


    让孩子爱上数学很简单，在日常生活中，给孩子三个数学思维套餐：数算思维、几何思维和测量思维。欢迎你把这篇文章推荐给你身边那些同样对数学感兴趣，或者希望提升孩子数学能力的朋友。


    # —— 第008期思考题 ——


    # 本期思考题


    我平时跟孩子说话的时候，会注意用“大小”“轻重”“长短”这类比较词。比如我会问女儿：“在我们家谁最矮呀？”她会说“萱萱最矮”。


    在潜移默化中，孩子意识到数字是有意义的，可以是用来代表物质的体积、重量等特质。


    那么请你简要列出3个，在生活中能即学即用、运用到测量和对比思维的提问句，并简单描述运用场景。


    上期我给你的思考题是：请你结合数学三原则，设计一个带小贝一天的计划书，让他爱上数学。


    第七期的金牌家长，我颁给思考全面的@小小太空猪。她说因为小贝已经觉得数学有些枯燥了，首先可以先唱些数学童谣调动起他对数学的兴趣。制定数学日的计划的时候呢，也让小贝加入进来，一起制定一天的计划，这样小贝学习数学更积极。


    @小小太空猪例举了很多日常可以用到数学活动，比如让孩子一起做饭、认路标。她还补充，最后，还可以跟小贝一起想一想当天做了多少道数学题，复盘一下学到的数学概念。


    # 以下是 @小小太空猪 的完整答案分享


    按照魏老师的三点原则来设计方案，但我觉得在设计方案之前要注意小贝的自信心。他对数学失去了兴趣，但他有一定基础，所以要先肯定他的基础。比如先唱一首数字有关的歌（如
    five little monkey，或者数数歌），调动起他自己已有的数字认知基础，让他感到自信。然后再来制定一天安排。


    第一，与生活结合。和很多留言的家长一样，我也觉得应该让他从生活点滴发现数学。比如与小贝一起制定一天计划。现在是九点，晚上六点你爸爸妈妈会回来，我们来看看中间的时间做什么。


    九点到十点：咱么来制定计划，吃水果，玩你喜欢的积木，还是乐高，还是小汽车？十点到十一点：咱么一起出门，十一点到十二点咱么一起做饭。一起收拾好午睡。当然每一个计划的活动都可以加入数学概念。


    第二，让小贝一起解决问题。比如咱么一起出去买菜准备午饭，需要到多远的地方，如果坐车，要换乘几次？或者让他一起看车次表，几点会有车。如果提前五分钟到车站，需要几点出门。如果步行，可以一边走一边聊天，他爱吃什么，一共要买几样，回来路上一起算，阿姨一共拿了100块钱，还剩多少？让他参与到其中来。


    第三，在制定计划的时候，每个活动都可以加入数学游戏。比如一起做饭，让小贝一起帮忙，用量杯，用食物称，做厨房小帮手的游戏。一起玩积木或乐高就可以做数学游戏，年纪小可以做不同形状颜色分类，年纪大就可以看谁用最少积木或乐高搭的最高。


    下午午睡醒来后，一起去户外，比如我家小姐最喜欢汽车，我们就一起学各种路标的过程，加入数学概念，你来做小警察，这里限速55迈，黑黑色的车开到64迈，你把它拦下来开罚单，要写超速多少？可以多设几个场景。


    根据小贝的年龄和数学基础可以想到的一些更复杂的游戏。最后当然还要在爸爸回来之前回顾总结一下这一天，还有30分钟到六点了，爸爸妈妈要回来了。咱么想想今天一天做了多少“数学题”啊？什么用到了加减法，什么用到了乘除？还要对他进行鼓励表扬一下。


