    现在市面上乌七八糟的记忆训练班特别多，把记忆术的作用夸得天花乱坠，家长们一定要警惕。错误的记忆训练，对孩子的视力，甚至智力都有影响。


    下周我来好好叩叩一下，该不该让孩子学记忆术，以及怎样来科学培养孩子的记忆力。


    # —— 本周问答时间 ——


    +   1. 家庭整洁度，对孩子影响大吗？

    2. 让婴儿游泳，有必要吗？

    3. 宝宝自言自语正常吗？

    4. 孩子排斥上幼儿园怎么办？

    5. 孩子不想让妈妈陪，想和其他家人睡觉，怎么办？


    # 1.家庭整洁度，对孩子影响吗？


    Dr. 魏，首先非常感谢您给我们带来这么多科学有效的育儿经。现在有个问题想请教您，我看到一篇文章是讲家庭环境对孩子的影响的。


