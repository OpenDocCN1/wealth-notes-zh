  md: '# 读者问答 | 哪些游戏可以父子一起玩？


    Dr.魏


    # 你想成为“金牌家长”吗？


    我的家庭教育宝典上线3个月以来，收到近6万名聪明的家长的育儿方法分享。我突然意识到，其实每位用心、认真的爸爸妈妈都是育儿大神，我希望菁智童园的每位爸爸妈妈都能变身“金牌家长”。


    从下周一起，我会在每天内容末尾给出—道与当期内容相关的「思考题」，请在留言区或学习小组“思考题置顶贴”中给出你的解决方案，我会亲自挑选一条最佳问答，给于这位家长“金牌家长”认证，并在下一期结尾贴出。


    期待你成为首位“金牌家长”！


    # 得到“金牌家长”认证，有什么福利？


    +   1. 成为Dr.魏认证的育儿大神，晒出你家的聪明细宝。 2. 获得学习小组一个置顶贴资源位一周，你可以详细描述并提出你的育儿困惑，也可以分享你的育儿小窍门。


    欢迎加入官方微信群：详情请见“聪明细家长会”学习小组置顶帖《喜讯 | 聪明细家长会官方微信群正式建立啦》，第一时间了解专栏各种动态，还能与其他家长实时互动。


    # 下周预告


    # 6.19（周一）：怎样帮助孩子识字？


    过早识字不会破坏孩子的想象力，但是机械的认字可能会出现反效果，导致孩子厌烦识字。学会语言的真正目的，是让孩子学会在日常生活中用字，家长该如何引导？下周一我给你3个实用小窍门。


    # 6.21（周三）：每个宝宝都是小科学家？


    提到科学思维，很多人认为这是大人的专利，其实小宝宝都有这种科学研究的本能，关键是如何开发，下周三，希望在我建议下，你家宝宝也能成为“科学家”。


    # —— 本周问答时间 ——


    +   1. 可以带孩子爬山吗？ 2. 有哪些游戏可以父子一起玩？ 3. 怎么平衡兴趣和枯燥的运动练习？ 4. 孩子入睡困难怎么办？ 5. 如何解决孩子写作作业注意力不集中？


    # 1.来自运动脑 | 可以带孩子爬山吗？


    我家宝宝三岁半，正是特别好动的时候。家里的高低床，宝贝总是爬上爬下，在家也是这房间跑跑那房间跑跑，喜欢骑车、玩水。我计划这个夏天带宝宝去游泳馆学游泳，我自己教。家里还没添宝宝的时候我和老公基本每周末都会爬山，现在也想带宝贝爬山，户外爬山会不会对这个年纪的小宝贝膝盖不好。


    Dr.魏


    孩子喜欢爬楼梯，玩滑梯，这和在平地上走路不同，有垂直高度的变化，能带来不一样的视野。爬山在此基础之上，又增加了呼吸新鲜空气，和自然美景，何乐而不为？


    至于爬山会不会对孩子的膝盖造成损伤，我们要明确，爬山只是游玩，不需要让孩子爬完全程。孩子也有自己的运动节奏。这里停一停，那里看一看，孩子累了抱一抱，或者趴在我们肩头睡一觉，都是有效的休息手段。家长不需要太过担心。


    # 2.来自运动脑 | 有哪些游戏可以父子一起玩？


    我是爸爸这个角色，周末因为家里原因，一般都是我带，我希望老师介绍一些父子间的游戏。


    Dr.魏


    爸爸的体能充沛，可以多带孩子进行室外活动。和孩子玩抛接球游戏，推孩子荡秋千、爬山、放风筝、在大自然中漫步。累了的话，就和宝宝在公园的草坪上仰面躺下，观察云卷云舒，发挥想象，和你的孩子交流各自看到了什么形状。


    此外，介绍自己喜欢的运动给孩子，把你对这项运动的爱感染给他。室内活动的话，可以和孩子在家自制泡泡水，吹泡泡，或者捉迷藏，搭积木，玩拼图、卡牌类游戏，给孩子读故事，甚至可以和孩子一起做饭，把菜谱读给他听，和他一起按照步骤准备食材，烹饪一道大餐。


    # 3.来自运动脑 | 怎么平衡兴趣和枯燥的运动练习？


    我自己本身喜欢打乒乓球，但是又担心请老师上课会引导孩子对重复性的练习产生厌倦情绪。可是掌握好这项运动又需要深厚的基本功底，不知道怎么处理这个矛盾。


    Dr.魏


    我们大人担心，重复性的练习动作很无聊，孩子难以坚持。孩子自己是怎么看的呢？关键在于，他喜不喜欢这项运动。如果孩子喜欢，再苦再累，他都可以坚持下来。如果孩子不喜欢，你怎么逼迫他都没有用。


    在6岁之前，培养孩子的兴趣比训练技能更加重要。建议选择侧重兴趣培养而非侧重技巧培训的老师。也建议这位爸爸打乒乓球的时候，带上孩子，让他见识到乒乓球的有趣之处，培养他的兴趣。


    此外，如果是一群孩子一起上课和练习，也会形成良好的“同辈压力”，喜欢同一项运动的小伙伴们，会成为互相的竞争和追赶目标。带孩子去尝试吧，他的反应会给你惊喜。


    # 4.来自情绪脑 | 孩子入睡困难怎么办？


    女儿马上大班了，有一个苦恼就是晚上睡不着觉，经常要十一点多才睡着，让我无比心烦气躁。


    Dr.魏


    这个年龄的孩子渴望父母的关注，希望和你多相处一会儿。而且对于他们来说，从兴奋的玩耍状态，切换到入睡阶段也有些困难。这需要父母的帮助，培养孩子的良好睡眠习惯，帮助建立一套行为流程，完成入睡状态的准备。


    妈妈可以做个时间规划，画一个时间表，贴在墙上：七点钟吃晚饭，八点钟玩游戏，九点钟洗澡，九点半上床睡觉。快到时间的时候，提醒孩子看时间表，下一步要做什么，帮助她建立睡觉的心理预期。在睡觉前一小时，调暗灯光，不要再玩电子产品。


    睡觉前，妈妈可以在床边和孩子讲个睡前故事，并且和她讨论，明天将要做什么。有了对明天的期待，孩子就会乐于保持安静，慢慢入睡了。行为养成需要家长的坚持，往往需要花费数周的时间，才能帮助孩子养成一个好习惯。


    # 5.来自智力脑 | 如何解决孩子写作作业注意力不集中？


    Dr.魏，今天的文章是让爸爸带孩子。我是一位爸爸，儿子现在已经上小学一年级了。平时我有时间还是经常陪儿子，但现在有些问题我很纠结，娃娃平时上课的时候专注力还不错，但在托管班（我和他妈妈工作都比较忙，觉得老人带小孩问题比较多，就报了托管班）作业质量就比较差（书写差，错误率较高）。


    打听以后，我们发现娃娃在托管班作业时专注力较差，经常出现写写画一会儿的情况，还经常主动调皮，发出声响影响其他小朋友写作业，不尊重托管班老师，在家写作业的时候也是拖沓。我看过他的作业，从本质上讲，不是他不会，但就是马虎。


    我和他妈妈也找他聊过，也说明了认真写作业的重要性，并要求他尊重老师，但效果很不理想。娃娃本生喜欢音乐，创造力还不错，也喜欢了解新鲜事物。他妈妈是急脾气，看到娃娃现在作业质量不高，课堂测验成绩不好，心里是很着急。


    我给他妈妈说，需要时间来慢慢纠正现有的问题 但目前看起来抽调有点难治'
