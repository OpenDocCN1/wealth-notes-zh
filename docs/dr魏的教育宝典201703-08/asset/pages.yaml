    # 今日问题：小宝宝能培养科学思维吗？


    Dr.魏

    我Россий之前...培养孩子的科学思维能力。


    # 每个孩子从小都有科学研究的本能


    伯克利大学心理学系的Alison Gopnik教授，曾经写过一本书，叫《宝宝也是哲学家》。她在这本书里指出，大家经常会以为，孩子不懂得逻辑推理，不理解事情之间
    здание 的因果关系。


    # —— 宝典查询结果 ——


    该怎样保护、培养你家宝宝的科学思维能力呢？之前节目里，我提到带孩子去逛博物馆时，要把重点放在引导他观察、思考上，而不是记住多少知识点。孩子的生活，也可以说是...在博物馆里，原则也是一样的。


    # 1.思维能力比知识重要


    我先来说第一条，你必须得树立一个观念，就是获得科学思维能力，比学到多少知识点更重要。


    # 2.对生活和大自然多观察、多互动


    第二，要观察和思考，生活和大自然比书本更合适。有些家长有个错误的观念，好...孩子通过对生活和大自然的观察和互动，能学到的要比书本中的知识更生动、更深刻，也记得更牢。


    # 3.多问孩子问题，而不是直接给答案


    第三，孩子在观察和思考的过程中，肯定有问题，对于他的问题，你不要急着给答案，而是应该尽量引导他自己去寻找证据、提出假设、验证假设，甚至在他没有...'
