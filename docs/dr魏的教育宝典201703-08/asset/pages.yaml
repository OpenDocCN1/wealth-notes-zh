    # 3.多鼓励孩子跟其他家人和同龄人接触


    西方有一句话叫“养大一个孩子，需要一个村庄”。发动你的亲戚朋友跟他建立紧密的联系，让他的社交生活不缺位。


    # 问题10 | 单亲家庭怎么养孩子？


    父母一方的缺失，养育孩子的压力确实会很大，孩子自己也会很疑惑。比如，没有父亲的孩子，他会对男性的形象造成缺失。


    如果是单亲妈妈，千万不要隐瞒孩子缺位的事方程，孩子迟早会知道的。你对单亲家庭的态度，比单亲家庭的事实更重要。你开朗乐观的态度，也会影响孩子的态度。你需要把这个态度传递给他，“即使爸爸缺位，你也能开心快乐的成长”。


    少了性别角色的学习，你需要借助家族、朋友、媒体上“父亲”的榜样，讲给孩子听，教会他感知什么是父亲，男孩子应该是怎样的。你跟异性交往积极的一面，也要介绍给孩子，不要让孩子拒绝认识异性，要多树立榜样。


    # 问题11 | 早教班该不该上？如何挑选早教班？


    # 1.定义早教班


    这种班分两种，第一，你希望有一个小的社会环境，让孩子一起玩。第二，兴趣班，可能是英语班、游泳班、钢琴班。


    如何选择？要根据师资的比例。如果老师的比例大，相对就好。也要判断环境是否安全，价格是否合适等。


    # 2.不要强迫孩子参加


    如果哪个早教班能够真正激发孩子的兴趣，那就赚到。如果小孩子上了课但是觉得很无聊，那就•不合适，要停止。


    # 问题12 | 如何对待隔代养育？


    那我自己举个例子。我和爱人平时工作都比较忙，是姥姥和姥爷过来帮忙带孩子，承担了孩子的日常照料工作。在这个过程中也会遇到各种矛盾，比如，他们认为孩子做的好时，喜欢说“你真聪明”之类的话。这样小孩会认为他的成长不是来自兴趣、努力，而是因为自己天生聪明，这是
    incorrect的。


    ![](img/8dd4b172abeef48fa291369820efe392_55_0.png)


    1个观点：

    “伪单亲家庭”是指父母一方长期出差在外，无法时刻陪伴孩子的家庭。长期分离会影响孩子身心健康，亲子关系变疏远。


    特效药：

