  md: '# 发刊词｜让你的孩子享受最新脑科学研究成果


    你好，我是Dr.魏。前两天，我听「得到」上的吴伯凡老师说过一句话，他说，世界上的事儿分三类，第一类是不复杂 的，比如生产一台车，第二类是有点复杂的，比如造个火箭，第三类是超级复杂的事情，什么呢？就是养孩子。


    作为两个孩子的爸爸，我太认同这个说法了。生产汽车、制造火箭，我们可以先确认原理，然后画图纸找材料，制造出来就 行了。可以说，只要原理正确图纸无误制造无偏差，汽车就能按照我们的设定上路，火箭就能按照我们的设定升空。而养孩子，天哪，不光没有统一的公式和标准图纸，在孩子成长的过程中，还随时可能出现新的变量。更可怕的是，汽车、火箭造不好可以重来，养孩子，那可是一锤子买卖，不可重来呀！


    所以，和你一样，在孩子呱呱坠地的那一刻，我就意识到了这一点，然后，焦虑就开始了。孩子到底应该怎么养法？为了找到答案，我翻遍了市面上几乎所有的育儿书，可是，这些书里给出的回答却不能让我满意。


    为什么呢？原因就在于…


    +   1 这些书里给出的很多理论或方法大多还基于国外几十年前的研究成果，而在我这个搞脑科学、认知科学的人来看，这些知识早应该被淘汰了。


    +   2. 如果只是一些落后的观点方法也就罢了，一些书上讲的，看上去是某某国外教授、权威育儿专家提出来的，但查下文献就会发现，是一些商家，为了兜售自己的理念，篡改、曲解、恶意夸大原有的科学实验结果。


    比如，一些机构为了销售课程，宣称左脑逻辑、分析、理智，右脑管创造、想象、艺术，所以，左右脑需要分开专项训练。但事实上，这几十年的脑科学研究已经证明，无论是逻辑、分析，还是创造、艺术，都是整个大脑协作的结果；


    再比如，一些商家刻意强调某些能力的培养是有关键期的，说错过了，孩子就输在了起跑线上。事实上，科学家不说“关键期”，而是用“敏感期”这个概念来描述孩子的最有利的发展期。并且，敏感期的时间跨度也比较长，拿语言来说，并不是某些机构吹嘘的2-3岁，而是可以到7岁。


    没办法，当我发现无法从现有的信息中获得帮助，我就只好和我的科学家朋友们一起，支个篷子自己来做了，所以从2015年开始，我们创办了一个基于脑科学、认知科学的儿童早期教育平台——爱贝睿。我们希望把真正科学的、聪明的家庭教育方法带给千家万户。因为，未来的世界不仅仅是我们的孩子的，也是你、你们的孩子的。


    龙应台说过，父母是有“有效期”的。在孩子出生到上学之前的这段时间内，你就是孩子的全部世界，这也是你最能够影响孩子的时候。再往后，同伴、老师、学校渐渐占据了孩子生命的大部分，父母的作用就越来越小了。到那时，你再幡然醒悟，想多给孩子些陪伴与养育，就真的是为时已晚了。纪伯伦不是也说过么，你的儿女，其实不是你的儿女。你们是弓，你们的孩子是从弦上发出的生命的箭矢。


    想想看，真的是这样啊！生命从不倒行，你的孩子，终将离你越来越远。这也是为什么，我们特别注重儿童早期发展的家庭教育问题。


    当然，作为一名科学工作者，我必须承认，科学是有局限性的，科学永远不能揭示全部，真正的科学也需要不断迭代。所以，我能做的是，把最新最靠的大脑、认知、儿童发展的研究成果，翻译成人话讲给你听，给出具体的方法让你能用。在迷茫无助的育儿之路上，让你受益于那些已经被科学点亮的地方。


    而你需要做的，就是做出一个简单的选择。


    选择面 向过去的教养方式，让你父母用上一代人的养育方式去培养你的孩子；或是选择非科学的教养方式，把孩子拱手交给一些所谓的科学育儿机构；当然，作为一个出生在现代世界的人，你也可以选择跟随我，在「得到」上收听这样一个节目，相信科学的力量，相信人类这十几年間在脑科学、认知科学、儿童早期发展领域的重大发现和迭代，相信科学可以更好地帮助你养育孩子，至少让你在育儿的道路上，少吃点后悔药。


