  md: '论：“这里的低音像大象走路，我们慢慢地走，重重地踩脚。”“这一段好欢快轻盈，我们趴起脚尖，伸出胳膊，像小精灵一样旋转。”


    如果你家宝宝在学乐器，也要记得给他留出不按照乐谱，可以自由“玩”乐器的时间。孩子练习乐器是一件枯燥的事，需要不断重复训练，才能让手、眼、脑越来越协调。给孩子“乱弹琴”的机会，相当于给枯燥的练习加一点糖，也是给孩子一个用乐器表达感情的机会。


    当孩子慢慢学会即兴的唱、跳、演，会用音乐和动作来表达感情，他们就变成了音乐的创造者。


    # Dr.魏的小叮叮


    最后我想叮叮一下，给孩子提供多样的音乐很重要。不管是古典乐的还是流行乐的，多种文化的歌谣都可以让孩子接触。不要以为孩子理解不了，只要是好音乐，就会有跨越文化的感染力。


    不过，比这些更重要的是你对音乐的态度。如果你对音乐是一个包容的态度，经常和孩子唱宣布喜欢的歌，带他听你喜欢的乐曲，甚至跟他一起玩乐器，孩子感受到的是你对音乐的爱，他自然也会爱上音乐。


    我看到一个读者留言，说她的孩子很喜欢广场舞音乐，不喜欢名家音乐，问怎么办。我现在先卖个关子，本周三我们来好好聊这个话题。


    # 今日得到


    +   1.孩子天生就爱音乐，不用报班上课，咱们在家也可以给孩子音乐启蒙。这个启蒙对低龄孩子尤其重要，因为他们可能还没有到能学习乐器的年龄。2.生活中随时可以给孩子听音乐，也不要忘了鼓励孩子模仿音乐和舞蹈，最后，给孩子机会用音乐即兴表达。


    # —— 第009期思考题 ——


    # 本期思考题


    给孩子提供多样的音乐很重要。不管是古典乐的还是流行乐的，多种文化的歌谣都可以让孩子接触。只要是好音乐，就会有跨越文化的感染力。


    今天的思考题很简单，总结下你的日常经验就好。


    +   分别推荐一首古典音乐、流行音乐和童谣，并简单说明它们好在那里？适合多大年龄段的孩子听。希望今天的留言区，成为你的私人选曲库。期待你的答案。


    # 008期金牌家长：卷卷圈圈


    上期我给你的思考题是请你简要列出3个，在生活中能即学即用的、运用到测量和对比思维的提问句。我从优秀留言中，选出 @卷卷圈圈 成为咱们第8期的金牌家长。


    她说她对内容中提到的卖菜的游戏印象深刻，回家就跟孩子尝试了卖玩具鱼的游戏，孩子果然乐此不疲。


    玩卖鱼游戏的时候，就可以用到对比思维，问孩子多少钱，卖鱼最贵或最便宜；测量思维，出去逛街的时候可以问孩子袋子哪个轻哪个重；给孩子读绘本的时候问哪个动物的鼻子长，哪个的脖子长；晚上吃饭的时候，问今天谁吃的最快，谁吃的最慢，让孩子排个名。


    @卷卷圈圈 说她是一个潜水粉终于冒泡了，结果一出手就是金牌家长，欢迎其他潜水的家长多多冒泡，说不定下位金牌家长就是你。


    # 以下是来自第8期金牌家长 @卷卷圈圈 的完整答案分享


    潜水粉今天终于有机会冒泡了，我儿子2岁8个月。Dr.魏和女儿玩的卖菜游戏给我留下了很深刻的印象，所以我开始和我儿子尝试。


    我准备了磁铁鱼16条，剪了小纸壳，写好标价1到5元，并给他10个硬币。从一条一条买，到一次买两条三条，引导他像Dr.魏的女儿一样，把硬币放在价格标签上，最后数三条鱼一共多少钱。卖鱼游戏我们玩了两天，互换角色，乐此不疲。接下来加大难度，引入6-10元的东西，给他20个硬币。


    Dr.魏提到的几何思维，我碰巧也给孩子练过。宝宝一岁多时，给他买了几种形状配对盒，他从一开始需要大人帮忙，到完全独立装好五种形状花了几个月时间。那时他对形状有了感性认识。两岁起给他英语启蒙，比如亲子共读、播放绘本音频，绘本Color
    Zoo让宝宝对几何图形有了进一步认识。


    有一天他指着马路的地砖说：“妈妈你看，square，这么多，那边都是circle”，今天他沿着家里圆形垫子画了圈，说：“我画了一个好大的oval, big
    oval.”


    关于第八期思考题，我的答案是：


    +   第一，比轻重。我和宝宝出门玩，带了两个袋子。我：“你提哪个？”宝宝依次拎了拎，说：“我提轻的，你提重的。那个太重了我提不动。”


    +   第二，比长短。我：“（指着动物的绘本）这么多动物里，谁的鼻子最长呀？”宝：“大象的鼻子最长。”我：“谁的脖子最长？”宝：“长颈鹿。”我：“谁的身子最软，还喜欢扭来扭去呢？”宝：“（想了想，一脸坏笑）蛇。”


    +   第三，比价格。还是卖鱼，他卖我买。我：“老板，我买三条鱼，这个这个这个，他们都是多少钱呐？”宝宝：“小丑鱼1块，亲嘴鱼3块，老虎鱼4块。”我：“哪个最贵？”宝宝：“老虎鱼最贵。”


    +   第四，比速度。宝宝吃饭很积极，经过多次提问，现在已经会给大家的吃饭速度排序了。比如，我问：“今天谁吃的最快？”宝宝：“爷爷。爷爷第一名，我第二名，妈妈第三名，奶奶第四名，姐姐第五名，爸爸还没回来吃饭，最后一名。”


