    育儿也是一门科学，是需要学习的。几年 前孩子出生，开始看育儿书，在微博上关注了一些科学育儿大V，读了美国儿科协会育儿指南（应该是比较权威的）。就是要多学，才会认识科学的育儿观点，也才有机会关注到�叮魏的得到专栏，而不是只靠老一辈口口相传的传统育儿习惯。孩子刚3周岁，一切都还来得及。


    今天学习到了，要给孩子多一些刺激，例如多去一些不同的地方走走看看，看动画片（当然要限制时间，能不看就不看）、听音乐也可以多些不同的类型，在家里要多想想怎么给孩子制造不一样的环境（不然家里是最一成不变的），让相同的东西有不同的玩法。多给孩子不同的体验，刺激孩子脑神经。


