  md: '# 智力脑 | 运用三个方法，让孩子比你更聪明


    # 4岁的孩子和加州大学伯克利分校的学生，谁更聪明？


    智力脑 | 运用三个方法，让...


    Dr.魏


    4岁的孩子和加州大学伯克利分校的学生，谁更聪明？


    你大概会说：“当然是伯克利大学的学生啦。美国最好的公立大学出来的学生，那肯定比4岁的孩子聪明。”


    但是，伯克利大学心理学系Alison Gopnik教授的研究表明，在一些需要灵活思维的任务中，小孩子表现得比大学生还要聪明。


    实验非常简单，Gopnik教授招来一批小孩和一批伯克利的大学生。这些人要参加两个实验：一个实验是每个人都要去探索哪一个物体可以点亮哪一台机器。这种配对关系的学习，很简单，孩子和大学生都基本上搞对了。另一个实验不同，不再是一个物体点亮一台机器，而是需要两个特定物体才能点亮一台机器。结果，第二个实验里面，孩子猜对的概率要远远大于大学生。


    这是为什么呢？其实在现实生活中，一般是一把钥匙开一只锁，一个物体驱动一台机器。所以，在第二个实验里，成年会不由自主地引用这些老经验，脑子转不过弯来。这种思维僵化是非常根深蒂固的，实验者已经向大学生展示了这台机器需要两个物体才会亮，但是他们的选择还是被老经验影响，还被一个物体驱动一台机器的思维限制。而孩子不一样，他们非常地接受新的设定，并且使用新的两个物体对应一台机器的规则来完成挑战。


    # 孩子思维灵活，随时准备接纳新信息


    为啥孩子们的思维更灵活？我们成年人不是办事更有效率么？我下面就举一个生活中的例子，来说明一下经验是如何影响我们思维的。


    比如说，你和孩子走在北京的大街上，远远看见一个穿裙子的小孩。问题是，小孩是男孩的概率大，还是是女孩的概率大？你的直觉反应是什么？女孩？你答对了！你同时问你的孩子，他也能答对。为什么呢？因为我们在中国的生活经验告诉我们男孩都穿裤子，女孩一半穿裤子，一半穿裙子。


    好，现在换个场景，有一天你和孩子到苏格兰去旅行，远远地看到一个穿裙子的小孩，还是来猜猜小孩的性别。这个时候，你家孩子更可能回答对，就是这穿裙子的孩子是男孩，而你可能还在犹豫甚至答错。


    为什么呢？因为，你家小孩如果知道在“苏格兰”，“男孩都穿裙子”，他会极快地把这个新的经验利用到男女判别上。而大人可能还会 Announcements被老在中国经验所干扰，所以判断慢很多，也更可能出错。


    认知科学的系列研究发现，孩子在新奇任务中的表现，很可能会比大人聪明，因为他们能根据新的事实，新的情景，灵活地调整自己的判断和估计。


    这和我们平时的观察是一致的：手机上的新功能，智能电器的新玩法，你家小孩学起来，比爷爷奶奶快，甚至比你还要快！你可以想象一下，十年后，你给家里订的第一个家政机器人到了，这个新奇玩意的使用是要花心思的，你觉得，你和你孩子，谁能更快更好地把这个机器人开动起来？


    答案很简单——孩子，可能在新事物面前，孩子学得比你快。其实，这并不是因为他们有多牛，有多少知识的积累，恰恰是你的经验限制了你接受新的信息，而孩子的思维却更加灵活。


    当然，成年人不像孩子一样思维灵活，随时准备接纳新的信息，也是有进化原因的。在人类历史的绝大大部分的时间里，生活环境的变化是很慢的，所以，成年人学到的经验，是非常有价值的，不会轻易地过时。但是，时代已经改变，旧有的经验过时得越来越快，想想我们从BP机到手机的转换，从一般手机到智能手机的转换，迅速掌握这些新工具新视野，在快速变化的如今，变得越来越重要。


    > 《Dr.魏的家庭教育宝典》查询结果：

    保护孩子好奇心的三个建议


    我们怎么让孩子保持这种思维的灵活性和开放性？一大秘诀就是保持孩子的好奇心，保持他的这种接受新事物的行为方式。怎么在育儿中保护孩子的好奇心呢？我有三个建议：


    +   1. 尽量鼓励孩子去探索、去好奇。


    好奇心就是进化安排好的学习机制，促使你的孩子保持学习的秉性，抓住一切机会去获取新的信息。只要不是太危险，你就应该尽量鼓励他们去好奇，去学习。比如，你只是看他在不动地观察小鸡小鸭吃东西，其实有关这些动物行为的各种数据正在迅速涌入他的大脑，他正在学习这个世界的规律。


    千万不能在他观察一朵野花的时候，一把拉起他说：“快走，上美术补习班去。”因为当他观察野花的时候，得到了关于大自然的美感触，说不定比美术课还要呢。


    ![](img/8dd4b172abeef48fa291369820efe392_7_0.png)


    我举这两个例子，就是要强调：孩子好奇的东西很可能是鲜活的、大自然的知识，而不是抽象的课本知识，这个恰恰是在育儿早期最能激发孩子的学习形式。所以你可以带孩子去博物馆、去大自然，甚至去新开的游乐场。这些从生活中来的鲜活刺激，是最容易激发孩子的好奇心的，本质上就是在练习孩子整合新信息的能力。


    +   2. 除了到外面去找新刺激之外，其实你也可以利用家里的熟悉场景和小道具，让孩子探索。


    比如，跟孩子合作搭一艘玩具船，但是搭建玩具船的所有小部件都要孩子自己去找，利用家里现成的小材料，比如一个空盒子做船舱，用一根吸管做桅杆，等到。这就是在鼓励他找到熟悉物品的新特点，这样他就能更容易地意识到，一般的事物其实不只有一个目的，一个用途，而是可以灵活地组成新事物。


    +   3. 对于孩子的探索和观察结果，不要随便作出负面评判。


    比如，孩子在外面玩，忽然兴冲冲地跑回来说：“妈妈，你看我捡到什么？”你一看，唉，不就是一个又脏又破的橡皮筋嘛。但是，这在你孩子的眼里，可是新奇宝贝，他拉一拉橡皮筋竟变长，手一放橡皮筋又缩回去了，他从这上面发现了很多以前他不知道的东西。'
