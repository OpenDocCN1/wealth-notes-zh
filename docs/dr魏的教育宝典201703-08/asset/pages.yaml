    # 3.你是不是经常感觉为孩子心力交瘁？


    第三，就是你自己是不是经常感觉，“不行了，太累了，带个孩子怎么这么累啊？”这很可能并不是因为带孩子本身有多少累，而是你揽过来的事情太多了，很多本来不需要你做的事情，你也抢过来做了。比如孩子在公园里玩，本来像我，一般自己带本书去看，不时地抬头看看我女儿，没出大问题就好，你倒好，两眼紧紧地盯着孩子，就怕磕着了，碰着了，被其他孩子欺负了，或者是玩的方法不正确，手里抓的东西不卫生什么的，那你能不累吗？


    到了家里，你又要烦心他上什么兴趣班，到处上网查哪个家教好，然后幼儿园布置下一个手工作业，你比孩子还紧张，跟他一起做到精益求精，最后孩子都去睡了，你还在那里给加工到半夜。为什么？因为如果他的作业被别人比下去了，你怕打击他的自信心啊！你说你这样带孩子，不心力交瘁才怪呢！


    可是这样带孩子，就过度养育了，对孩子并没有好处。孩子的作业做得不好，比不过别人，是很正常的事情，他需要从小就学会知道，并不是每一场竞赛，他都能赢。输了之后怎么办，是孩子成长必须经历的一课。你这样为他精心搭建保护伞，不仅会让他变得过于脆弱，而且也把你自己累个半死，何必呢？


    所以，如果你经常觉得，唉，带孩子怎么这么累啊，那这可能就是对你的一个警钟了。也许你已经是在做必须范畴以外的事情了，是过度养育了。


    Dr. 魏的小“叮叮”


    当然，我也要说明一下，这三条只是参考依据，具体的诊断要根据你自己的情况而定。因为可能引起这三条表现的原因很多，比如如果你家孩子先天有某些困难，使你抚养起来特别累，或者是你其他教养方式上处理不当，比如总在他失败后严厉批评他，使他特别害怕失败，那就不一定是由于过度养育引起的。所以，这个具体判断，要靠你来掌握。


    +   1. 过度养育对孩子不好，会使孩子将来过度焦虑，从长期来看是弊大于利，而且也让你自己身心疲惫。


    +   2. 我提供了三个诊断参考，第一，你孩子是不是遇到问题都来找你？第二，他是不是很容易被困难打败？第三，你是不是经常感觉为孩子心力交瘁？如果你这三条都符合的话，就很可能是过度养育了，那就请你转换一下心态，松口气，下一期我会给出解决方法。


    Dr. 魏


    今日行动关键词：自我审视


    咱做父母的，在给孩子输出知识和价值观的同时，别忘了自我审视。今天是五一假期的最后一天，给自己留出20分钟，思考下“我日常行为中，哪些属于过度养育”。


    养育是门不能重修的课程，不断调整自己的思考方式，才能更好的养育孩子。


    今天听到隔壁《超级个体》的古典老师聊到一个有趣的话题：讲故事。我曾经叮叮过互动阅读的重要性，说到互动阅读，其实就是把对话引入到阅读中（详见《互动阅读比给孩子“堆书”更有效》）。


    当然，互动阅读中，家长也免不了要绞尽脑汁用各种奇思妙想与孩子聊起来，这就发挥了爸妈的“讲故事”能力。既然讲故事这么重要，那么今天可以到隔壁《超级个体》看一看“为什么说故事思维可以改变世界”？


