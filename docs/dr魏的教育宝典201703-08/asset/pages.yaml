  md: '# 语言脑 | 教你三招亲子游戏，玩着学外语


    语言脑 | 教你三招亲子游戏...


    # 怎样用玩的形式来学外语？


    Dr. 魏


    我在《学外语，晚一点不如早一点》那期节目里讲了，学外语，晚一点不如早一点，背出来不如玩出来。小孩子学习语言有天生优势，如果从小家长就能给他营造一个外语环境，在玩中学，孩子的语言学习一定会事半功倍。


    节目播出后，好多家长就留言问：“Dr. 魏，你讲得很有道理，不过关于这个玩出来，能不能再提供几个方法？”


    当然可以。我在那期着重讲了，玩着学外语的关键在于互动，上‎期是讲如何在日常生活中互动。现在我们正式讲，如何用亲子游戏，来玩出外语能力。我们以前都拿学英语做例子。在这一期里，我就给你讲三类语言学习的游戏，既能让宝宝觉得好玩，又能轻松地学了英语。


    # 做孩子的朋友、老师和学生


    哪三类呢？第一类，是做孩子的朋友，跟孩子一起听歌谣、看动画、读故事；第二类呢，做孩子的老师，带孩子玩节奏感游戏；第三类，是做孩子的学生，让孩子带着你玩英语。这三大类可以衍生出很多小游戏。我把这里面的原理讲一讲，相信你很快就能举一反三。


    《Dr. 魏家庭教育宝典》的查询结果 三种亲子游戏，在玩中学外语


    +   1. 跟孩子一起看动画、读故事


    很多家长在听完我上一期节目后都有个担心，他们留言说：“Dr. 魏，你说的这些方法都很好，可我自己英语很不行啊，该怎么在家forum里给孩子营造外语环境呢？”


    首先，咱们中国家长，不会英文很正常。市面上儿童英语学习类的资源很多，英语基础一般的家长，想要在家创造一个英语的微环境，可以通过跟孩子一起听英语歌谣、看英文原版动画片、读英文故事来进行。


    +   2. 带著孩子玩节奏感游戏


    对于年龄比较小的，没有任何英语基础的宝宝，还是需要多跟家长互动，这时候跟孩子玩一些节奏感强的英语小游戏比较有效。


    +   3. 让孩子带你玩英语


    我给你推荐的最后一类互动亲子游戏，是当孩子英语能力好一点之后，让孩子教你学英语，让他反过来，带着你玩英语。'
