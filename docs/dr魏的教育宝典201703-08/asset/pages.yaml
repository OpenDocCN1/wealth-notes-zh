  md: '# 创意脑 | 巧用三种分类法，培养孩子想象力


    Dr.魏


    # 孩子的“异想天开”有用吗？


    你一定注意到过，你家的宝宝特别喜欢异想天开，比如画一只猫，他会说：“我这只猫如果有超能力，就能把老虎吃掉了”。


    或者经常问你千奇百怪的问题，比如“如果我没出生，世界是什么样子的？”甚至是地上的泥土，孩子也能特别憧憬地抓起来，放到  偷来的叶子里面，告诉你“这是一碗香喷喷的饭！”然后装作拿着筷子，一口一口地吃。孩子都特别喜欢玩这种“如果…会怎么样？”的假想游戏。


    其实，思考“如果…会怎么样？”是在思考这个世界的各种可能性，这是创造力的体现。我们都鼓励孩子异想天开，可你大概还是在疑惑，这些异想天开、胡思乱想，怎么就帮助到孩子了呢？你大概会觉得，重要的是这个现实世界，想象出来的不存在的东西到底有什么用呢？


    # 想象战胜了现实


    传统观点认为，知识与想象，彼此之间是严格区分的，但心理学不这么认为。


    伯克利大学心理学家Alison Gopnik认为，儿童对于现实世界的知识的掌握能力，和对不存在世界的想象力，其实是用的是同一中能力。


    # —— 宝典查询结果 ——


    # 1.对过去的推断，如果本来不这样，会怎么样


    # 2.对当下的思考，如果现在不这样，有什么其他的可能性


    # 3.对未来的计划，如果未来是这样的，会怎么样


    Dr.魏的小“叮叮”


    我特别推荐“反事实想象”的想象方法，'
