  md: '# Dr. 魏的小叮叮


    我最后再叮叮一下，孩子喜欢广场舞音乐很正常，但我们需要注意，不要让孩子的生活只有广场舞音乐，就好像不要让孩子只听莫扎特，也听听柴可夫斯基，而且不要只让他们听，要让他们唱、跳、打节拍，还是那句话，给孩子的音乐体验要丰富、多样化。


    # 今日得到


    单纯听莫扎特音乐不会让宝宝更聪明，重要的还是让宝宝边听音乐边打节拍。大脑天生爱节奏，锻炼节奏感对大脑的多种能力都有帮助，我介绍的节奏小游戏，希望你今天就跟孩子玩起来。


    你身边还有对莫扎特音乐有误解的朋友吗？把我的文章分享给他们，帮助他们找到通往音乐之路的正确方法。


    # —— 大咖做客 ——


    隔壁专栏《西方艺术课》的严伯钧老师来咱专栏做客，他是个物理学学霸，还是个小提琴手，曾经在国外组过室内乐团。说到艺术和音乐，很有发言权，严伯钧老师给咱专栏的家长们带来三个见面礼：


    +   第一，培养小宝宝学乐器的3个小建议

    第二，第10期思考题

    第三，《莫扎特第十一钢琴奏鸣曲》


    # ★ 见面礼一：培养小宝宝学乐器的3个小建议


    1，不要盲目过早地开始学乐器。虽然所有音乐老师都说学乐器要趁早，但他们都是以培养专业演奏家的标准来定义的。


    学乐器前最重要的是培养孩子对音乐的好奇心，最好先在家中制造音乐环境，放放莫扎特、舒伯特或者门德尔松的曲子，如果孩子对音乐有反应，表现出强烈的兴趣，才需要考虑学音乐，否则揠苗助长，容易酿成“孩子逼妈妈学琴”的悲剧。


    2，孩子在学音乐的过程中，需要有人欣赏。孩子学音乐绝不是孩子自己的事，需要家长一起努力。古典音乐有一定的门槛，如果家长不同步提高自己的欣赏水平，孩子在学习过程中得不到正向反馈，会失去学音乐的信心。


    更可怕的是，由于父母的欣赏水平没有跟上，只能用考级比赛等功利、机械的方法来判断孩子的进步，这就成为恶性循环。艺术不是竞技，这样做的结果是，大多数孩子会把学音乐当成一项作业，被逼完成考级后，就再也不碰音乐。


    3，如果决定让孩子学乐器，在经济条件允许的情况下，一定要点找优秀的，科班出身的老师。西方的古典音乐有非常严格的体系，所以不存在高手在民间这回事。选择科班出身、正规音乐学院毕业或者乐团担任演奏员的老师是很保险的。


    把基础打好，少走弯路。碰到不靠谱的野路子老师，会养成很多坏习惯，就算孩子有天赋，日后碰到好的老师，对方通常不愿意收这样的学生，因为改坏习惯远比教一个初学者要难得多。


    # ★ 见面礼二：第010期思考题


    今天的题目是一道实践分析题：首先，请把今天文章结尾的《莫扎特第十一钢琴奏鸣曲》播放给孩子听，并配合音乐，反复教他一些简单的动作，比如拍手、挥手等。其后，再找另外一首节奏感不是很强的曲子，不做任何动作，同样播放给孩子听。隔几个小时后，分别播放这两首曲子，看看孩子的反应。欢迎实践后在留言区告诉我的实践分析。


