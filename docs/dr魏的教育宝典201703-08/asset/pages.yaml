  md: '界未日。


    # 3. 不被孩子的人生绑架


    这是最重要的一条。你要记住，孩子的人生不是你的人生，他不是你人生中唯一重要的东西。当然你可以选择为孩子付出更多，但结果往往会事与愿违。并不是说你投入越多，在孩子身上产出就越多。你投入太多后，孩子一方面受不了你的过度养育，造成巨大心理压力，另一方面，你为孩子连自己的生活都不要了，本
    SWE给孩子树立了错误的榜样。


    斯坦福大学的新生部主任，也是斯坦福的本科教育副教务长 Julie Lythcott-Haims，根据她在斯坦福的经验和思考，写了一本书，叫《怎样培养出一个成年人？》（目前只有英文版，英语基础好的家长可以搜索下
    How to Raise an Adult，买来读一读）。在她看来，现在的大学生虽然年纪已经成年，但是心理还跟孩子一样。她有一个很有趣的观点——就是因为这些学生的父母为孩子付出太多。在孩子看来，成年人的世界太可怕了，全是忙碌、焦虑和疲惫，所以他们不愿意成为成年人。


    Julie 说，为了让你的孩子人生更美好，你首先需要把自己的人生过美好。因为孩子会观察别人，尤其是对他们影响最大的父母，往往成为他们最爱模仿的对象。如果你为了孩子的人生美好，而把自己的人生过得很悲惨，那可能你孩子的人生也不会好到哪里去，因为他只从你这里学到了过悲惨人生的方法。


    所以，千万别把你的人生变成孩子人生的附属品，那样你会整天为孩子焦虑。还记得我上期提到的澳大利亚麦考瑞大学的研究吗？他们发现了有一些指标，能够从4岁孩子身上预测到他将来会不会焦虑。除了过度养育外，还有一个指标就是妈妈自己的焦虑程度。如果你特别容易被孩子的困难、情绪和生活绑架，那你的焦虑，说不定已经影响到孩子了。


    Dr. 魏的小“叮叮”


    最后，我还是要叮叮一下，我反对过度养育，绝不是说我主张对孩子放任自流。我只是说，对孩子的关注要适度，一点不关注，或者该关注的不关注，比如像我前面举的例子，涉及到他的安全或者道德规范，或者他遇到自己没办法独立解决的问题的时候，你还是要关注的。


    但是，现在大部分家长的问题是过度关注，而且往往只是过度关注了孩子表面的安全、健康、情绪、学习这些问题，对于他深层的心理健康、学习习惯、处事能力等反而关注不够。不过，这个就是以后的话题了，我会慢慢地讲如何在这方面帮助你的孩子。


    +   1. 防止过度养育，主要是要防止你被对孩子的关注所绑架，具体地说，是被孩子的困难、情绪和生活所绑架。2. 对孩子的关注是我们的天性，但是我们育儿，不能只靠本能，还要靠科学，所以你必须得使用理性，给予孩子适当范围的帮助、指导就好，不能事事包办，时刻像直升机一样盘旋在孩子上空。


    Dr. 魏


    今日行动关键词：读本好书


    尝试对孩子放手，别再过度干预了。今天的文章中提到一本书《怎样培养出一个成年人》，目前只有英文版，叫做 How to Raise an Adult 英语基础好的家长可以买来读一读。当然，中文的相关书籍，我也给你准备好了——《养育的选择》，作者是爱贝睿专家、美国儿童发展研究协会会员、心理学博士陈忻。


    今天下班回家，试着给孩子多留些空间，也给自己多些个人时间。放轻松，读本好书就是个不错的选择。'
