  md: '# 专题001｜好爸爸攻略


    Dr. 魏


    谈到“家庭”，你最先想到的是不是爸爸、妈妈和孩子？但有部分朋友虽然在父母完整的家庭中长大，却很少在成长中直接感受到父亲的存在和影响。


    这是个大问题：谈到“家庭教育”，“父亲”往往是缺失的。


    其实，从上世纪70年代起，“父亲养育”的概念越来越被多地关注和提出。爸爸带娃不仅能让孩子的沟通交流能力变强，还能让他变更勇敢。父母双方共同养育，能给孩子最完整的家庭教育。


    当然，如果你家孩子爸爸早就参与到孩子的教育中了，那请点击右上角“请朋友读”，给身边朋友送福利。


    # 好爸爸攻略


    # 1. 爸爸是孩子最好的玩伴


    应该发挥自身身体好、爱运动的优势，带孩子多做体育运动。运动影响孩子的时间感知、动作预测以及抽象思维能力的发展。家有小宝宝，可以多玩抛高高、荡秋千、滑滑梯之类的游戏。孩子大一些，可以带他跑步、打球、游泳、户外登山。养成孩子运动习惯的同时，锻炼他的冒险精神。


    # 2. 转变心态，把自己当成育儿合伙人，而不是妈妈的小助手


    多跟孩子妈妈沟通，争取更多自主权，别让妈妈在养孩子的道路上孤军奋战。可以从承担起一部分固定的养娃任务开始，小到给孩子讲睡前故事、大到接送孩子上下学。


    # 3. 给孩子探索空间，鼓励他勇敢尝试


    爸爸带娃能弥补妈妈带娃的过度保护，让孩子愿意迈出尝试的第一步。比如，在孩子骑自行车时，妈妈们会担心，“摔下来怎么办”？爸爸们不会太干涉，还会在旁边喊：“加油，再快点！”这样的爸爸带出来的孩子，胆子更大、运动能力更强。


    # 4. 跟孩子聊天时，多用成人语言


    妈妈倾向用“娃娃语”，比如“吃完饭，我们去睡觉觉”；爸爸则多说成人语言，比如：“快来吃饭，然后去睡觉。”起初孩子可能难以理解，但这个方法鼓励了他们开动脑筋分析、猜测，恰恰多了一个掌握复杂句子和更多词汇的机会，对提高语言能力有帮助。


    # 5. 也许你很忙，但不要因为愧疚，给孩子太多物质补偿，陪伴质量比时间更重要


    多和孩子玩耍，每次陪伴加倍用心，不要掺进其他事情，比如接电话、看手机、回邮件等，要在轻松愉快的互动中拉近距离。


    # 6. 出差频繁也没关系，多跟孩子打电话、聊视频


    担心对孩子的情况了解少、没话说？记得提前求助另一半，了解孩子的近况。给孩子传达这样一个想法：虽然我不在你身边，但你的一切我都关心。


    # 7. 在游戏中关注孩子的需求和反馈，积极倾听孩子的建议


    这种方式下长大的孩子，会表现出更少的攻击性，更受他人欢迎。


    # 8. 定制专属父亲阅读时间，给孩子讲故事、读绘本


    哈佛大学研究显示，孩子跟爸爸读书受益会更多。在阅读过程中，男性更容易引发发散性思维，以及更有想象力的讨论，对孩子的语言发育有帮助。


    # 9. 要用成长型心智养孩子


    表扬孩子，应谨记以下三招：表扬努力，而非聪明；表扬过程，而非结果；表扬成长，而非表现。


    # 10. 爸爸常带娃，越带越会带


    人的大脑发展符合“用进废退”原则，指的是经常使用的脑网络神经元突触会越来越发达，不经常使用的会逐渐退化。在养孩子这件事上，这个原则同样适用，爸爸放心大胆带娃，不仅心态上越来越愿意，能力上也越来越适合做“超级奶爸”。


    # —— 家长智慧圈有话说 ——


    Dr. 魏


    有哪些具体的运动可以让爸爸和孩子一起玩？我挑选了一些聪明爸妈智囊团中的优质方法，分享给大家，你可以带着孩子，挑设有趣的试试看。


    # 爸爸带出的孩子，语言能力发展快 @金哥


    我家娃就是做爸爸的我带得多，因为妈妈怀上了二娃。我家娃不到两岁，说话比一般孩子成熟，用邻居的话评价：“说话不像这个年纪的小孩，像4、5岁的”。比如，跟他说，“别吃那么多葡萄干”，他回答，“其实不多的”；我出门的时候，他除了会说拜拜以外，还会说“爸爸，你开车小心点”，这些话我没有专门教过他，但应该是跟我带娃有关系。


    # 爸妈各有其独特优势，共同养娃更有效 @麻麻爸爸


    有这么一句“男人来自火星、女人来自金星”，爸爸妈妈带娃天生不同，各有各的优势。养娃要摒弃“男主外、女主内”的观念，爸爸带娃有三个层次，第一是金钱投入，第二是时间上的投入，第三是精神上的陪伴，在某些方面成为孩子的榜样，经常和孩子谈谈心、不仅仅是爸爸，更重要的是做朋友。


    # 孩子跟着家长慢跑 @嘟嘟


    家有一个5岁的宝宝，因为我自己有慢跑的习惯，所以从4岁开始，每天吃过晚饭半个小时后，会带着宝宝到小区绿道跑步，孩子会骑着滑板车跟着，他从小就有良好的运动习惯。


    # 组队踢足球、体验打高尔夫等多种运动 @王子墨


    男孩子有运动释放能量的需求，作为家长多陪伴一起玩也是很好的方式。在户外，我会跟随孩子踢球，当然他也会找小伙伴们一起最团结。在团队中有分工、有规则，每个小朋友在运动的同时，也锻炼了自己的责任感。


    担心工作日没时间陪孩子，那就好利用假期。带孩子去游乐园、游泳，或他能者去野外等不同的场所体验。锻炼他全面发展，增强自我感知能力。比如打高尔夫，不仅培养身体的柔韧性和协调性，而且这项运动强度低，降低了身体损伤的可能，但又是一项户外运动，能让孩子充分享受阳光。


    # 一起打非洲鼓 @冯苏宁


    经常和孩子一起打非洲鼓，一边打鼓一边唱歌跳舞。家里有音乐响起来的时候，宝宝会主动跑过去拿手鼓拿来跟着歌曲拍。


    ![](img/8dd4b172abeef48fa291369820efe392_87_0.png)


    # 用玩具吸引孩子注意，引导他爬行 @小阿扁


    对于年龄较小的宝宝，没法进行大幅度运动，可以用玩具吸引他的注意力，放在他面前，孩子会爬过来拿玩具，玩十分钟左右，让他歇歇。


    # 鼓励孩子安全的上下楼梯 @不听话


    我女儿的运动能力，相比周围的小朋友要好一点，他自己比较爱动，比如看到楼梯会去上上下下，在公共场合只要不影响别人、足够安全，我都不会阻止她，并陪在她身边鼓励她。


    # 夏天学游泳，运动又降暑 @夏天2015


    我家宝宝从小就喜欢游泳、玩水。小一点的时候在婴儿游泳馆，现在在家里游，一游就出不来。他爸爸是游泳教练，教别人游泳。在运动这方面我从不担心，因为爸爸各种运动都会，也喜欢每周花时间去做，在这方面言传身教，我家宝宝有氧运动应该很棒。


