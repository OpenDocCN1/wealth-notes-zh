    # 右脑开发真能激发孩子的创造力？


    Dr.魏


    “右脑开发”是现在很流行的一句口号，我去幼儿园接孩子时，经常有人给我塞纸条，上面写着“右脑开发，激发孩子的创造力！”，其他家长也常问我：“Dr.魏，这个右脑开发靠谱吗？”


    我的回答很简单：不靠谱！


    对大脑做左右脑的简单区分，是媒体对1981年诺贝尔奖得主斯佩里（Roger Sperry）的裂脑研究的最大的误读。裂脑人是一类特殊的人，是左右大脑半球之间直接联结被切开的病人。对这些病人的研究，让我们对大脑的机制（特别是左右大脑之间不同的分工）有了很深的了解。


    但是，我们正常人不是裂脑人，我们不能被简单地划分为左脑人或者右脑人。其实大脑的任何活动，都需要左侧和右侧共同协作。创造力，就是一个非常复杂的大脑活动，更需要左脑和右脑的协同工作。


    其实，对左右大脑的粗暴划分，包括右脑开发这样的概念的流行，有两个原因：第一是对左右脑的划分，看似满足了我们对大脑这样复杂器官的理解的需求；第二，它可能为商家提供了一个全新的卖点。因为这样，所以才流行起来。


    宝典查询结果：提高创造力，多玩发散性思维游戏


    好，现在大家知道了右脑开发是不靠谱的。如果我们要真正地提高孩子的创造力，有什么科学方法呢？


    答案也非常简单，就是要激发孩子的大脑“暗能量”。


    # 1.什么是大脑“暗能量”？


    大脑暗能量是什么？它是美国科学家马库斯·雷切尔尔的一个比喻。他发现当我们什么都不做的时候，比如发呆、出神时，大脑好像没有被关闭，仍然有很多脑区还在忙碌着，这些脑区消耗的能量，比开动大脑完成某些任务消耗的能量还要多。所以雷切尔就把它比喻为大脑“暗能量”，就像在宇宙中除了我们能感受到的能量以外，还有更多的“暗能量”弥漫在宇宙的每一个角落。大家注意一下，“暗能量”是一个比喻，它对应的是科学术语，叫做大脑静息网络，大脑静息网络是过去近10年脑科学的重大发现和研究热点。


    大脑暗能量，是创造力的关键。我们经常会觉得灵感很神秘，比如说有些艺术家，他本人都说不清楚他自己的灵感是怎么进发的，这是为什么？这是因为灵感隐藏在大脑暗能量中间，它运行在我们的潜意识之中，所以我们无法察觉，甚至不能够言说。


    # 2.多玩发散性思维游戏


    但是，不能够言说不等于不能被科学家研究。有大量的针对大脑“暗能量”的研究表明，如果你平时注意跟孩子玩一些小游戏，去激发他的大脑暗能量，就能够提升他的创造力。这种游戏非常简单，它完全可以跟我们的生活结合起来。


    今天我集中讲其中最常用的一种，就是发散性思维游戏。发散性思维就需要向孩子提一些问题，这些问题没有标准答案，需要孩子们去开脑洞。在我们传统的教育中，有太多有标准答案的问题。比如说唐朝的建立是多数年？答案是公元618年。那开脑洞的、没有标准答案的问题是什么呢？可以用日常生活中一些常见的物品来给他他们提问。比如说问一个可乐罐，除了装可乐之外，还能有什么其他的用途？一块砖头，除了做建筑以外，还能干什么？一本书，除了传递知识之外，还能干什么？


    这些问题没有标准答案，所以就会激发孩子大脑的“暗能量”，比如说“可乐罐还可以做什么”这种问题，因为没有标准答案，所以孩子会想，可乐罐有什么样特征？可乐罐的形状是一个圆柱体，那么圆柱体可以干什么呢？除了装可乐之外，还可以装水、装奶、装酱油。可乐罐的材料是金属的，那金属除了做成罐子以外，还可以卖钱，可以导电，没准还可以撕开当牙片用呢。


    所以你看，可乐罐原先的特征是多种多样的，它有形状、材料、大小等特征。但是当你没有一个标准答案的时候，孩子们就需要根据它的特征去跟其他的，看似不相关信息，进行匹配、连接，这就是一种开放性思维。


    我经常跟我的女儿玩这类游戏。她都养成了习惯，有时候还会经常反问我，比如说：

    “爸爸，你说筷子除了吃饭，还能干什么呢？”

    我就随便瞎猜了几个：

    “还可以当尺子用，量长度，画直线，还能当小棍子去够物体，比如说什么东西我够不着了，我拿筷子去够一下”

    然后我反问她：

    “你觉得还能做什么呢？”

    她就很得意地对我说：

    “其实它还可以当救生艇用，如果小蚂蚁掉到水里了，你可以绑个筷子去救它！”


    当然，发散性的问题不止这一堆。你可以以我刚才举的例子为出发点，举一反三，比如说我有一个朋友，他曾给活捉了一只蚊子，他就问他6岁的儿子：“我们怎么杀死这只蚊子？有多少种杀法？”

    最后他们俩一共想出了40种杀法，有一些就是孩子想出来的，特别有创意。比如说，把蚊子发射到太空去，太空中没有氧气，蚊子就会窒息死了。还有一种方法时把蚊子放到篮球里面，给篮球打气，这样用高气压把蚊子给压死。


    你看，这些创意是孩子想出来的，为什么呢？因为这孩子平时喜欢听航天故事，所以他知道太空中没有氧气，而且他平时喜欢打篮球，家里有篮球、气筒，他也知道给篮球打气的原理。你看，这些知识其实平时就在孩子的大脑里，等到需要对付一些没有标准答案的问题时，需要进行发散性思维的时候，这些信息就被激活了，也就是我们说的，他的大脑暗能量迸发出来了。


    # 3.发散性思维可以与想象力结合


    你可以问孩子这样的问题：

    “假如你是妖怪，那你要怎么样才能吃到唐僧肉？”

    在这个问题中，你是妖怪，是反事实想象，怎么样才能吃到唐僧肉呢，就需要他的发散性思维。


    再举个例子：

    “假如你认识天上的神仙，你想要天上掉下什么就能掉下来什么，那你希望从天上掉下来什么东西？”

    你看，你认识天上的神仙，这也是反事实想象，那发散性思维呢，就是“到底要从天上掉下来什么东西”，你看这些问题就充分说明了用发散性思维方法来训练“暗能量”是怎么个原理。


    当然，能够激发大脑“暗能量”的游戏有很多，我今天只介绍了发散性思维游戏，其他还有比如联想性思维游戏、反事实想象游戏等等，我会在以后的节目里逐渐介绍。


    Dr.魏的小“叮咛”


    我们经常在生活中碰到所谓脑瓜子比较灵活的人，碰到困难问题的时候，总能想出一般人想不出来的独特的解决方法。我们会羡慕他们，说他们有鬼点子，会创新。但我要强调的是，创造力，其实不是凭空出来的，而是可以后天培养的。


    我今天讲的这些简单的思维训练游戏，就是激发孩子们的大脑暗能量，培养他们的创造力，为未来埋伏笔。我们知道中国的教育制度比较僵化，有很多条条框框，但我相信，通过你对你孩子小时候的这些思维训练，你的孩子未来会善于打破常规，善于创新。'
