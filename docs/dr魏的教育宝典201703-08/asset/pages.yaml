    # 1. 孩子练习写字情绪绪怎么办？


    有个问题请教Dr.魏，孩子3岁9个月。最近幼儿园的老师开始布置简单的抄写作业（比如1、2和a），结果孩子在家各钟情绪绪，要么就乱写，要么就干脆不动笔。我和老师商量暂时不要写作业了，老师也同意了。我想了解一下这样的情况是否正常，有没有什么办法可以激发她自己的兴趣呢？谢谢！


    Dr.魏


    孩子的书写能力是有规律的，根据教育部颁发的《3-6岁儿童学习与发展指南》，规律是这样的：

    3-4岁：喜欢用涂涂画画表达一定的意思。

    4-5岁：1.愿意用图画和符号表达自己的愿望和想法；2.在成人提醒下，写写画画时姿势正确。

    5-6岁：1.愿意用图画和符号表现事物或故事；2.会正确书写自己的名字；3.写画时姿势正确。


    看孩子的反应，现在抄写作业的难度太大了，像数字、字母都是比较精细的符号，对手部动作要求很高，孩子处在恐慌区。需要给他降降难度，进入学习区。


    # 2. 孩子痴迷某个东西，正常吗？


    我家孩子差不多要三周岁了，从一岁多的时候他就非常喜欢看车杆，喜欢在车库门口看那些车杆上下，汽车通过的过程，能足足在那里站几分钟都不走。

    现在玩玩具也很喜欢把玩具（不论什么玩具都能往那个方向去想）扮演成车杆的样子。然后弄上弄下，这种行为是否需要干预呢？


    Dr.魏


    有的孩子喜欢恐龙，有的孩子痴迷挖土机。孩子喜欢看车杆，有点小爱好，很正常的。抓住他的小爱好，可以开发出有意思的小游戏。比如用手臂做车杆，孩子做车，刷了卡才能打开车杆、通过；出来时，收费，才能离开。学习社交技能。


    # 3. 边听音频边做其他事情，影响注意力吗？


    我家孩子从两年前开始听“凯叔西游记”，一下子迷上了就在平板上听。只要在家，除了睡觉，其余时间都在听。玩乐高时候一边玩一边听，吃饭有时也是一边吃一边听，甚至看书的时候一边看其他的绘本一边还要听。

    接触这种电子听故事产品之后，他在家玩乐高依然很专注，我现在就担心他这样同时进行两项活动会分散他注意力，对他注意力有影响。

    最近突然意识到，不知道我的担心是不是多余的，是不是应该改变他的行为。希望您能看到，急需您的回复。


    Dr.魏


    孩子确实比较容易对一件事上瘾，这可以理解。该不该放背景音这件事，由于人工作的记忆容量有限，所以我们只能同时处理非常有限的事情。


    # 4. 孩子处在恐慌区，不愿意游泳怎么办？


    我的家庭矛盾正是需要这期的学习内容。爸爸带女儿玩，女儿常常不愿意一起去，说爸爸总是强迫她，容易发脾气。

    今年假期，6岁的女儿学会了游泳。教练带她时，她天天都想去游，很有激情。跟爸爸一起游后就再也不想去了，问原因后才知道，爸爸要求孩子游的来回太多，孩子在深水区也有一些害怕。爸爸认为孩子只有多游才到锻炼的效果，孩子是畏难情绪需要克服。而我认为这样给孩子造成了恐惧，所以孩子都不再想去游泳。爸爸和妈妈本来带孩子的方法不同，我想问老师这种情况孩子是属于在学习区还是恐慌区？好多妈妈天天跟著你进步，爸爸们也需要让他们跟上节奏，共同学习！


    Dr.魏


    首先要肯定宝爸，愿意花时间陪女儿去游泳。怎么判断孩子是在学习区还是恐慌区呢，看着她是挑战还是逃跑。就好像是面对一头猛虎，武松选择敢斗，因为这是在他可控制的范围内；如果是普通人，恐怕几百米外就逃之夭夭了。女儿“再也不想去”，逃跑了。显然，她觉得这是头不可战胜的“猛虎”。这时候循着她去练，段了兴趣，适得其反。游泳是一项很
    گو有氧运动，我们且光要长远一些，即使不求孩子成为运动员，作為爱好对身心都有益。在确保孩子有兴趣的情况下，再给她提出一些更苛要求，帮助她进入学习区。'
