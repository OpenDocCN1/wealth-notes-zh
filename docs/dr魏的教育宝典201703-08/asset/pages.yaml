    Dr. 魏


    # 下周预告


    7.31（周一）：如何帮助孩子适应枯燥的练习？


    孩子不论是学琴，还是做算术、培养思维能力，都需要练习。但孩子的大脑发育还没有完全成熟，自控力和计划能力会弱一些，这时需要家长出马，用对方法，让孩子减少练习的负面心态。


    8.02（周三）：好习惯真的难以养成吗？


    朋友圈经常有各种打卡活动，比如21天瑜伽计划、21天轻断食等等，那孩子能不能21天养成一个好习惯呢？听起来很诱人，但这并没有科学依据。养成一个习惯要多久，家长需要做什么？下周三，我给你们几个实用方法。


    # ——本周问答时间——


    +   1. 听白噪音来止哭对宝宝有害吗？

    2. 多大的孩子适合玩乐高？

    3. 如何防止欺凌？

    4. 孩子喜欢假装，好不好？

    5. 如何让孩子爱上积木？


    # 1.听白噪音来止哭对宝宝有害吗？


    Dr. 魏，说到小孩哭闹这个问题，我想向您咨询，我家宝宝现在刚2个月，家里月嫂大姐说，孩子哭闹的时候，给孩子听一些白噪音，可以让孩子停止哭闹（说是跟孩子在子宫内听到的声音很像，所以会安静下来）。

    但我看网络上有人说白噪音对婴幼儿是有害的。请问，从科学的角度来讲，给2个月大的宝宝听白噪音来止哭声有效吗？非常期待您的回复，感谢。


    Dr. 魏


    1岁以下的宝宝，哭是用來表达自己需求的主要方式。当宝宝哭闹时，关键是查找哭闹的原因，是饿了、累了、困了、无聊了，还是拉大便了？或者是其他原因。


    宝宝出现这些问题时，我们要给宝宝足够的关注和帮衬，去解决他的问题，而不是用白噪音去掩盖，这样才有助于宝宝的健康成长。


    当然，白噪音如果用的方法正确，也是有一定作用的。白噪音对哄宝宝入睡有效果，像月嫂说的，有些白噪音像宝宝在子宫里听到的声音，熟悉的声音会给宝宝带来安全感。


    在使用白噪音时，需要注意的是：1. 控制音量大小，一般建议在50分贝左右，避免损伤宝宝听力；2. 播放白噪音的机器尽量远离宝宝，不要一直使用；3. 如果宝宝睡眠质量不佳，或没有差到令人抓狂的地步，建议用安抚、唱摇篮曲等来哄睡；4.
    平时尽量不用。

    白噪音会掩盖掉环境中的真实声音，长时间用，可能会影响宝宝分辨环境中真实声音的能力。


    # 2.多大的孩子适合玩乐高？


    请问宝宝多大适合玩乐高？不会玩乐高的家长要从哪里学习，怎么引导孩子玩呢？


    Dr. 魏


    乐高按照单起源件由大到小可分为四个系列：baby、quatro、duplo和标准lego，后者的大小是前者的一半，分别对应于1-18个月、2-3岁、2-6岁和4岁以上的四个年龄段的孩子（内容素材选自维基百科）。


    乐高说明书通常会教你搭特定造型的步骤，跟着说明书搭可以快速入门，各大电商平台都有出售，也可以找到详细说明和对应年龄段，这里我就不过细讲了，不然得跟乐高公司收广告费了。


    玩笑归玩笑，我还是要强调一下，培养空间能力，重点不是去玩乐高，而是乐高属于结构类玩具，孩子可以用这这类结构玩具来搭建各种各样的形状。结构类玩具还有一个特点是它的玩法是开放的，要让孩子和你的想象力来驾驭这些玩具，而不是让玩具说明书的指定玩法来束缚想象力。


    玩这类玩具时，可以把“上、下、左、右、里、外”等空间词汇加上，比如“你把这块积木放到这块板子下面试试？”这样有助于提升孩子的空间认知能力。


    萝卜青菜，各有所爱。其他积木类玩具、橡皮泥也是很好的选择。可以根据孩子的喜好来，不必局限在乐高上。


    # 3.如何防止欺凌？


    Dr. 魏，您好。我可能就有您说入园焦虑，我很害怕孩子在幼儿园遭遇欺凌，或者老师的暴力对待，孩子马上要上幼儿园了，我该怎么防止此类事件发生呢？


    Dr. 魏


    你好，孩子入园有焦虑，咱们大人也有焦虑，这很正常。如何防止孩子在幼儿园遭遇欺凌或老师的暴力，一个简单的答案是选择好幼儿园。


    我的好友，爱贝睿家长教练解慧超老师认为，在选择幼儿园时，如果基本质量可以，不会犯低级错误（如打骂孩子），那么可以再问老师一个问题：两个孩子打架抢玩具，你看到了会怎么做？

    老师回答：“不插手让孩子自己解决”的，筛掉；说：“把孩子分开各自教育打人是不对的，或每个人发一个玩具”，基本可以；最好的回答是：“首先把孩子的肢体冲刺制止下来，帮助他们平静情绪。然后用提问的方式与孩子讨论‘如果你…他会怎么样？你会怎么样？’”这类问题，鼓励孩子思考不同行为的不同结果，支持孩子自己找到最佳解决方案并实施。


    你如果老师懂得这样来解决冲突问题，那去这样的幼儿园就不用怎么担心。


    # 4.孩子喜欢假装，好不好？


    宝宝三岁。在家里经常扮演蛇妈妈、蛇宝宝，大鸡啄啄、小鸡啄啄，大毛毛虫、小毛毛虫，大火车、小火车等等，平时它必须让我这样喊他，不允许喊他的名字，这样的情况到底是好还是不好？


    Dr. 魏


    其实这是孩子在玩假装游戏。假装游戏对孩子的语言、想象力和自控力都有好处。比如，我女儿喜欢看小猪佩奇，有时她就会说自己是猪小妹，我是猪爸爸。我就假装是一个笨笨的“演员”，请教她这个“大导演”，猪爸爸要演什么、说些什么。

    这时候她就不得不ዝ语言把自己的想法表达出来，一开始她按照动画片里的情节来，后来就各种各样地发挥。语言和想象力就这样不经意地得到了锻炼。


    那假装游戏怎么锻炼自控力呢？如果让三岁的孩子立定一分钟，那么他十几秒就站不住了，但是假如你在玩士兵游戏，孩子假装自己是士兵，那么他就会站得更久。因为这时候他不是自己，而是士兵，要服从命令。你喊孩子大毛毛虫、小火车，听起来有些矫情，但是它学不是一件只有你们家里人才知道的小秘密呢？把这想象关系亲密的家人之间享有的特权，放开点，和孩子玩起来，他会很开心的。


    推荐你看看《047 | 分类法，打开孩子想象力的钥匙》这期内容，以便对假装游戏有更加深入的了解（可翻本期内 末尾的推荐阅读查看）。


    # 5.如何让孩子爱上积木？


    一直有个困惑，宝宝三岁半了，我觉得搭积木有利于培养她的空间思维，可是每次搭积木她就是要么只顾高搭，要么搭几个就不愿意搭了。我感觉她好像是缺乏耐心。


    有时候我会陪着她搭，但她总是让我搭，家里的积木好像发挥不了多大作用。怎么才能够让她对搭积木产生兴趣，主动去探索着玩呢？'
