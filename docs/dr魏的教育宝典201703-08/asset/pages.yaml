  md: '# 创意脑｜运用联想性思维游戏，培养创造力


    创意脑｜运用联想性思维...


    # 今日问题：联想性思维游戏怎么玩？


    Dr. 魏


    我在这个专栏开始的时候，讲过一期创造力的节目。在那期节目里，我说过，创造力的关键是要激发大脑暗能量，而且也给出了一些激发大脑暗能量的方法。


    这期节目播出之后，我看到了好多非常有质量的留言，比如说所有留言里得到最多赞的一个，来自用户 @王爽，他说：“一年前，儿子睡前总要讲故事，而他的方式，是临时想到几个关键词，比如湖水、小熊、火车和棒棒糖。而我，要在不到十秒钟的时间里，迅速构建一个故事的架构，然后讲出丰富、包括人物对话。现在，小朋友开始试着自己用两个三个挨不着边的关键词，拼凑故事。各种发散思维和创意，都被碰撞出来了。”


    这样的留言让我拍案叫绝，对我们网友的创造力佩服不已。为什么我推崇这样的创造力游戏呢？因为它完全符合创造力的内在机制。


    # 培养创造力的一个关键能力，是联想性思维


    我们平时经常会觉得创造力很神秘，比如家长经常会发现，孩子会有某些特别有创造力，特别出于自己意料的想法：“哎，他竟然说树叶像潜水艇，我怎么从来没有看出来过？”
    “宝宝竟然会自己把袜子团起来当球踢，没人教过他啊？”


    创造力显得这么神秘，是因为它来自大脑暗能量，它的工作经常游离于意识的控制和觉察之外。但是，并不是说我们觉察不到，控制不了，它就没有规律。像古人说的，“文章不天成，妙手偶得之”，或者西方人在古代把创造力看成是缪斯女神的启发。


    从科学的角度看，那些非常有创意的点子，当然不是从天上掉下来，或者神仙给的，而仍然产生于我们大脑内部。很多时候，它不过是把你已经有的各种信息进行重新组合，其中有些组合特别有新意并且有实际应用价值，它们成为了新的创意。


    # 新创意，指的是人脑对旧知识的几乎随机的重新组合


    加州大学戴维斯分校的西蒙顿教授，在研究了科学家的创意过程后发现，那些所谓的新创意，其实来自于人脑对旧知识进行的几乎随机的重新组合。


    平时，很多奇怪的念头或者组合都是被你的意识压制住的，但是当你的注意系统放~~的时候，这些新奇的组合进入到你的意识当中，就成为创意了。这也是为什么乔布斯也曾说过，“Creativity
    is just connecting things”，创造力是把东西连接起来而已。


    创造力的一个关键能力，是联想性思维，你能把看上去好像一点关系都没有的几样东西放到一起，找到它们的关系。这几样东西相互之间的距离越远，这里面的创新程度就越高。反过来，一个人创造力越高，也会越喜欢进行联想性思维，这种思维能力也越强。甚至有一种创造力的测量方法，叫“远程联想测试”，是专门根据这个原理来设计的。


    它给你三个词，这三个词看起来风马牛不相及，看你能不能找到第四个词，能跟这三个词都联系起来。比如这三个词：“运行-红军-火箭”，什么词跟这三个词都能联系起来呢？是“长征”，因为长征从字面意义上看，是运行的意思，从历史上看，红军长征的故事很有名，然后我国又有一系列火箭叫“长征”，从“长征一号”到现在的“长征十一号”。


    我在北京大学的同事姚翔教授，和他的团队在2016年编制了一套中文的远程联想测试，对初一和初二的学生进行了测试。结果发现在这个测试里表现越好的学生，平均来说，语文、数学的成绩也越好。


    当然，这样的测试，对于宝宝们来说还是太难，因为他们的词汇量和知识量远远不够。但是，你也可以用其他的方法，来激发宝宝的联想性思维。像我一开始举的例子，@王爽跟他的宝宝从几个关键词出发，联想出一个故事，能把这些关键词都串联起来，这是典型的远程联想游戏。


    # —— 宝典查询结果 ——


    我相信你现在已经知道了联想性思维对创造力的重要作用，你可以举一反三，跟孩子把联想性游戏玩起来。如果你觉得宝宝还小，前面举的例子太难，可以先从两个东西之间的联想开始。


    # 1. 先从两样东西之间的联想开始


    比如我女儿三四岁的时候，我常常指着家里东西问她：“电视机和吸尘器，有什么共同点？” 她先说：“都是家里用的东西。” 然后开始开动脑筋：“都要用电，都要花钱买，都是姐姐姐夫用得多，爸爸妈妈基本不用……”
    你看，这最后一个，如果她不说，我自己都想不到。


    当然，不能只拿东西的用途去问孩子，我还会拿生活里的其他一些东西去问她。比如说，我女儿从小对数字敏感，把我们家所有人的生日都记住了，有时候我们走在街上，看到一个门牌号是78号，我问她：“你看这个地址和爸爸有什么共同点？”
    她一般很快能猜出来：“它跟你都是78！你是78年生得，它是78号！”


    # 2. 让孩子往不同的方向去联想


    这是我要说的第二点，你自己跟孩子玩联想性游戏的时候，也要多多发挥创造力，尽量往不同的方向让孩子去联想。刚才我举的两个例子是从物品的用途，还有相同的数字。你还可以从颜色、形状这些角度让孩子联想。


    前面那个孩子说树叶像潜水艇，这是让家长感到惊奇的例子，他从形状上进行联想了。这样的游戏其实我小时候也喜欢玩，看着天空上的白云，想像它是人头或者大象、汽车什么的。现在我也跟女儿玩这种游戏，除了天上的白云之外，还有地上的影子、家里探出来面团等等，都会问她：“哎，你看这个像什么？”


    还有像颜色，一开始的时候拿家里的蜡笔颜色问女儿，“你看这支笔的颜色像什么？” 家里买了菜之后，我会直接问她：“你看今天买回来的菜，青菜跟菠菜除了都能吃之外，还有什么相同点？”


    # 3. 用联想性思维来创造


    除了找共同点之外，还可以玩一些高阶的游戏。我们不是在培养创造力吗？你可以直接把联想性思维用在创造活动中。比如“呸巴画画”，拿一张大白纸，或者两个人一块大白板前，各画一分钟，都不许看对方在画什么。一分钟后，你们再看看对方画的是什么，但不许说语交流，只能默默地你添一笔，我加一划，把它画成一幅整体有机的大家。


    这时候你孩子的大脑被激发起暗能量，在那里琢磨：“我画的是飞机，妈妈画的是树。树跟飞机有什么关系呢？哎，飞机从树上面飞过。” 然后她开始画飞机起飞的场景。这就是找到两个本来不相关的东西之间的联系。


    联想性思维是培养创造力的一个关键能力，你可以跟孩子玩联想性思维游戏，先从简单地找两样东西之间的联系开始、鼓励他往不同的方向去联想、尤其是把联想性思维运用到创造力活动中。


    Dr. 魏


    今日行动关键词：试试“呸巴画画”


    今天我教你用联想性游戏来提升宝宝的创造力，希望你立刻行动，把“呸巴画画”的游戏跟孩子玩起来。你也可以把你的经验或者问题写在评论区里，我会从中选取最有创造力的例子，来和大家分享。


    # 联想性思维游戏怎么玩？


    1个观点：培养创造力的一个关键能力——联想性思维。


    尝试把看似无关的事务放在一起，找出它们的关系。这些事物相互距离越远，创新程度就越高。


    特效药：


    +   1. 先从两样东西之间的联想开始'
