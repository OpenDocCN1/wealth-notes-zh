    Dr.魏


    # 宝宝假想出一个朋友，是不是因为他太孤独？


    动画片《头脑特工队》有个叫Bing Bong的奇怪生物，长着大象的头，熊一样的身子，和项目的尾巴。这个生物在现实世界里并不存在，它住在女主角的头脑里面，是这个小女孩自己想象出来的儿时玩伴。这是儿童游戏的时候，常见的一种现象，叫假想同伴。


    耶鲁大学医学院的Jerome Singer教授做过调查，大概65%的儿童有假想同伴。大部分中国家长可能觉得这简直不可思议，假如你看见自己孩子对着一个看不见的小朋友说话，或者拿着一个棍子跟空气打得不亦乐乎。


    你过去一问，原来他是在跟他想象出来的对手打架，那你可能会担心：“这孩子是不是有毛病了？”甚至你说不定还会自责：“哎呀，看来我太不关心他了，陪他玩的时间太少了，你看他都孤单成什么样了，都自己想象出朋友来玩了！”


    # 假想出朋友来，正说明他社交能力强


    那你就错了。能假想出一个同伴来的宝宝，社会化程度反而更高。美国俄勒冈大学心理学系玛可丽·泰勒教授在2001年出版了一本书，叫《假想同伴及创造出他们的儿童》，介绍了她对假想同伴现象的研究。她发现，有假想同伴的儿童，虽然不比没有假想同伴的儿童更聪明，但却更懂人心，也就是更善于猜测别人的心思、感受和行为。这个，在心理学上有个术语，叫Theory
    of Mind，心理理论。


    我在前几期节目里说过，宝宝都是小小科学家。其实，宝宝也都是小小心理学家，他们会逐渐意识到，别人也跟自己一样，有各种想法，而且能够总结人类心理的规律，这就是孩子的心心理理论能力。


    这个心理理论，大概13-15个月的时候就开始出现了，随着他语言能力的变强，他能更好地理解别人、跟别人互动，他的心心理理论会在3-4岁的时候突飞猛进，到5岁就比较健全了。


    心理学家罗宾·邓巴把这个过程分为心理理论能力的不同度数。第一度是自我意识，意识到自己的心理状态，意识到自己在想什么，比如孩子意识到自己吃冰淇淋就会开心。


    第二度，是知道别人的心理，我觉得别人想怎么样，比如孩子看到妈妈收到礼物很开心，他会开始假设妈妈下次收到一个礼物也会开心。


    第三度，是知道别人知道他人的心理，这就开始复杂了，我觉得他认为你想怎么样。比如说，孩子看见妈妈跟爸爸说话轻声细语，就知道妈妈认为爸爸现在不开心了，所以她不想惹火他。


    这后面还能依次上升，大部分成年人的心理理论能力在四度到六度中间，一般是五度，打个有点绕口的比喻，你可以听听这个句子，“我觉得你在假设张三想要李四相信王二要做出什么什么事。”


    是不是很复杂？宝宝怎么才能发展出这么复杂的心理理论能力呢？把一个物体假装成另一个物体的假装游戏就是一个好方法，在假装游戏里面，孩子不再是说自己的想法，而是要努力去想象，别人在这个情况下会怎么想、怎么说、怎么做，甚至别人去感觉其他人会怎么想，这是锻炼心理理论能力。


    我们前面说的假想同伴也是一种假装游戏。这个假想同伴，不一定是要凭空假想出一个同伴，对着空气说话，也可以是把一样东西想象成一个人，比如说你孩子抱着洋娃娃，让娃娃扮宝宝，她自己扮妈妈，坐在桌前问：“宝宝你要什么？你要牛奶啊，好，妈妈给你牛奶。你不要这个牛奶？为什么？哦哦，这个牛奶是蛀蛀的，你怕喝了这个牛奶蛀蛀会咳。嗯，真是好孩子，给你换那个牛奶。”


    孩子已经能够想象洋娃娃对于蛀蛀的感觉，这已经是第三度的心理理论能力了。所以，你下次看到孩子有假想同伴，就大可不必再担心，而是恭喜自己的宝宝，又有一样新能力升级了。


    # ——宝典查询结果——


    那么怎么培养孩子的心理理论能力？我给你三个建议：第一，从语言开始；第二，跟孩子一起玩假装游戏；第三，让孩子玩角色扮演游戏。


    # 1.从语言开始


    先说第一条，为什么要从语言着手呢？因为高阶心理理论依赖于言语思维的锻炼。大概在18-24个月的时候，你就可以开始锻炼孩子的一度心理理论了。比如说，多教孩子一些描述自己的情绪词语“快乐”和“悲伤”之类的感觉词，以及“想要”、“喜欢”和“需要”这些表达愿望的词。


    孩子到3岁以后，开始发展第二度心理理论，这时候可以教他使用描述别人心理状态的词，如“他知道”、“他想”。你还可以试着用一些三度心理理论的词汇，比如“他假装自己是一头大象”。


    研究也发现，假如母亲在跟孩子说话的时候，经常引导他表达愿望，描述情绪的话，那孩子的心心理理论能力就会更强。我刚才也提到了，孩子语言能力发展的阶段，也是他心理理论能力飞速发展的阶段，所以你一定要抓住这个机会窗口。


    # 2.跟孩子一起玩假装游戏


    第二条，就是我今天一直在谈的假装游戏了。我一直很鼓励孩子进行假装游戏。我看到我女儿在跟自己的假想伙伴说话的时候，不但不会大惊小怪，还经常会加入进去。


    比如说，我会问她：“嗨？这是你的宝宝吗？她叫什么名字啊？那她应该叫我什么呢？她叫姨姨又是什么呢？她喜欢吃什么？​​你觉得她将来长大了会干什么？”


    甚至有时候没事干的时候，我还会问她：“嗨？你的宝宝呢？她今天怎么没来？你猜猜她现在如果在这儿，会干什么？”这就是对她的假想同伴提出的一个假想问题，加倍考验她的想象力。


    # 3.让孩子玩角色扮演游戏


    假装游戏当然不只有假想同伴，还有角色扮演。这就是我要说的第三节。比如说家家，你演爸爸，我演妈妈，他演宝宝，还可以有医生、老师等等。


    我不会觉得过家家是只有小孩子才能玩的游戏，有时候在家里面我会主动跟我女儿玩角色扮演，比如说：“你今天在幼儿园学到了什么，你来演老师，我来演小朋友，你来教我行不行？”


    还有一种角色扮演是孩子们很喜欢的，现在青少年很流行的cosplay，这也是一种角色扮演。最典型的例子是万圣节，孩子们打扮成女巫、精灵、鬼魂，或者超人、蜘蛛侠什么的，到人家家去要糖。


    主人家往往会问一句：“你是什么？”孩子就会说：“我是魔法师！你看！”他一举手里的“魔法棒”：“变！”好像真的能够施展魔法一样。孩子们在路上遇到了，还会互相施魔法，上演出一出蜘蛛侠大战超人的大戏。


    这种互相比赛，甚至可以说打的游戏，在男孩里面尤其普遍。因为我家里的两个都是女儿，所以我刚才举的女孩的例子比较多，但是男孩也一样喜欢假装游戏。


    他们更可能假想的是竞争类的游戏，比如假装打仗，两拨男孩子，内部分成司令、排长、士兵，然后端起玩具枪，借助地形打起来，也是非常好的假装游戏。


    Dr.魏的小“叮咚”


    最后，我也要叮咚一下。你可能还是会担心：“孩子进行太多的假装游戏，会不会自己就当真了啊？”这个是很多家长的普遍担心，一说到假想同伴，你可能会想起那些精神病人，把自己想象出来的人当成是真实存在的。这一点你不用担心，科学家早就观察到，孩子对于什么是真实的，什么是假想出来对真实进行模拟练习的，分得很清楚。'
