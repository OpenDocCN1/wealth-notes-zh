  md: '话，那就更好了，我和她各扮演一个角色，然后我也兼职做旁白。


    有个叫《Go Away, Mr. Wolf》的绘本，讲三只小猪识破大灰狼的诡计，把它赶走的故事，我女儿很喜欢。里面先是Knock, Knock, Knock，大灰狼来敲门，这个就由我来，我一边敲桌子，一边说“Knock,
    Knock, Knock”（伴随敲击），然后我女儿就扮演小猪说：“Who’s that knocking at our little front door？”然后我就扮演大灰狼，arbeitung气地说：“It’s
    a lovely day for a swim. Anybody coming with me？”这种玩法，比你单向地念绘本给她听要好玩多了。


    再比如跟孩子一起看完动画片后，也可以双向输出。根据剧情做一些角色扮演的小游戏，比如演英文小短剧。演什么内容呢？最简单的就是她最喜欢看的动画片。


    比如我前几期提到过，我女儿很喜欢一个叫《头脑特工队》的动画片，有几个片段，她看一次笑一次。比如里面“乐乐”拉着“忧忧”去探索小女孩大脑那段，我就把台词写下来，然后她演“乐乐”，我演“忧忧”，两个人对话，她每次都玩得特别开心。才玩了两三遍，她就不用看台词了，自己背下来了。这样的游戏，孩子喜欢玩，而且越玩越喜欢说英语，越对自己的英语能力有信心。


    # Dr.魏的小“叨叨”


    我反复叨叨的，育儿育己。咱们中国家长，不会英语也很正常嘛，正好利用孩子学英语的机会，把自己的英语也练好，一举两得。


    这样一来，你不仅能提升孩子对英语的自信心，激发她的兴趣，还能让孩子知道，学英语是一个持续的终生过程。这也是我前几期说的“浸入式学习”，你向她学英语，或者跟她一起学，这是最好的互动，对孩子来说，也是最好的英语环境，在应用中自然习得语言。


    +   1. 跟孩子一起用亲子游戏的方式来学英语，既轻松好玩，又最有效，因为孩子最喜欢这样的学习方式。2. 你可以先从最容易的开始，两個人一起学、一起玩，然后你教她，最后可以让她来教你。这样循序渐进，也可以慢慢地建立起她对自己英语能力的信心。她就会越来越喜欢学习英语，这就是一个正循环。


    今天我教你三类跟你家宝宝“玩”外语亲子游戏的方法，听完这期节目以后，欢迎你在评论区给我留言，告诉我你家宝宝学外语的一些体验。我会选取其中最有代表性的一些问题来回答，帮助你解除疑惑。


    Dr.魏


