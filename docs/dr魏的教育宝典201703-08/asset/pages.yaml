  md: '# 069 | 如何通过布置玩具角，锻炼宝宝学习力？


    Dr. 魏


    # 如何通过布置玩具角，锻炼宝宝学习力？


    前两天，一个朋友带孩子来我家玩儿。他的孩子4岁，也是女儿。平时他总跟我吐槽，说孩子在家特别调皮，整天玩，不肯学习。孩子来我家之后，跟我女儿玩过家家，两个人叽叽喳喳玩得特别开心。


    朋友说，“你看，我家孩子就爱玩，从来不学习。”我跟他说：“在我家，孩子可以一边玩一边学习。”这不是开玩笑，我专门给孩子准备了一个可以痛快玩的区域，这个区域有各种玩具和绘本，区域安排也是花心思布置的。今天，我就跟大家聊聊怎么布置家庭玩具角，能锻炼宝宝学习力。


    # 让孩子在游戏中学习


    我们都知道孩子天生爱玩游戏。实际上，所有的哺乳动物出生后不久就会玩游戏，随着大脑的成熟，游戏的复杂度和范围也跟着快速扩展。这些游戏让小动物具备以后生存需要的技能，比如食肉动物爱跟尾巴和追捕游戏。


    人类的孩子呢？他们在游戏中发展语言、构建知识、练习社会技能、发展创造力、促进身体发展。科学家发现，在儿童时期，游戏活动对大脑的发育，对之后的人体机能，都会产生积极的影响。一句话来说，孩子要在玩中学习和成长。


    举个典型的例子，我女儿她们上次玩假装游戏，一个人扮演售货员，另一个人扮演顾客，拿了一堆各式各样的塑料蔬菜和水果来玩购买游戏。一个人问：“这苹果多少钱一个？我买两个。”另一个人回答：“4块钱一个，来，给你”。


    就在这看起来幼稚的游戏里，孩子们表演她们所理解的社会角色，还要学会问价格练习沟通能力，甚至得学会找钱，要用到数学能力。


    既然玩这么重要，在家里，我们怎样给孩子提供合适的玩具和空间环境呢？


    # 1. 玩具准备


    我给孩子准备玩具时会考虑种类均衡，有利于孩子智力、动作、语言、社会情绪、创造力发展的，都准备一些。具体的玩具，可能我买的跟你们买的都差不多，桌游、绘本、积木、娃娃之类。下面这几种，我想特别说明一下。


    我之前说过，心理学家进行过深入研究的玩具不多，建构类玩具是其中之一。像积木、橡皮泥，都是建构类玩具。心理学家发现，建构类玩具能够有效培养孩子的精细动作、发散性思维、语言能力和空间认知能力。如果家里只有一个玩具，我会选积木。


    小黑板是我家的“多功能玩具”，我用黑板跟女儿玩数学游戏。她的数学启蒙，大部分是在黑板上写写画画完成的。同时，孩子也喜欢拿粉笔在小黑板上涂鸦。有时候我们还把它当画板用，把纸夹在上面，孩子用画笔在纸上涂涂抹抹。在涂涂抹抹的过程中，孩子在锻炼她的精细动作，对她的大脑发展很有好处。


    你知道我研究运动控制，也特别重视孩子动作发展。因为我知道，人运动的时候，所需的激活脑区，除了纯粹的和肢体运动有关的脑区之外，还有很多和计划、决策、知觉有关的脑区，因此运动不仅仅锻炼了身体，还锻炼了大脑。


    不过，有时候天气不好没办法出门运动，特别是大冬天的时候，北京的雾霾又严重，怎么办呢？我们在家里玩体感游戏，也可以达到活动的效果。游戏可以识别孩子的运动轨迹，并且做出判断。


    比如孩子玩网球游戏或者跳舞游戏，人的手臂、躯干和下肢的动作都可以被捕捉到，加上音效和紧张的游戏设置，可以让孩子玩得乐此不疲。同时，这些体感游戏有一定的运动量，可以玩出汗来，也算是大冬天和雾霾天里的一点儿体育活动了。


    而孩子学习音乐，除了提升听觉、运动能力，还对语言和社会情绪发展也有帮助。特别是音乐中的节奏感，人类天生爱节奏。孩子小的时候，我在家就放了好几种可以打节奏的玩具：沙锤、摇铃、三角铁之类的，让宝宝自己看着玩。


    # 2. 空间分区


    准备了这么多玩具，也不是全部堆在那里，让孩子任意玩。什么时候放哪些玩具，放在什么地方，也有讲究。


    首先，孩子在家游戏有相对安静的，比如读书、画画、搭积木；也有动静比较大的，比如过家家、跳舞、体感游戏等。把玩这两种游戏的区域分开，在“动区”不要放容易磕碰的柜子、架子等，防止孩子磕伤。在“静区”放上软的地垫，给孩子安定舒适的感觉。


    家里空间小，不太可能把所有玩具都摆出来。另外我们想要孩子集中注意力，也得控制环境里的刺激，不能太多。我们在一段时间内，挑选出一部分合适的玩具给孩子。其他的暂时收起来。摆出来的这些玩具，也要考虑均衡。


    比如，有孩子可以自由表达的开放式玩具，充分发挥孩子创造力，比如积木类玩具。还有目标明确的封闭式玩具，比如桌游。科学家的研究表明，孩子玩不同类型的玩具和游戏，他的参与度更高，也更受益。


    另外，孩子有可能在某一段时间，对特定的主题感兴趣，这时候我们就可以把所有关于这个主题的游戏材料都拿出来，让孩子有机会做主题学习。


    上个月，我女儿一下子对恐龙产生了浓厚的兴趣，问我一堆关于恐龙的问题，哪些恐龙是吃草的？哪些恐龙打架最厉害？将来还有可能出现新的恐龙吗？我把家里关于恐龙的绘本全找出来，还有恐龙画册、塑料小恐龙玩具，我还专门又找了BBC纪录片《恐龙星球》，帮助她“研究”恐龙。


    你家孩子也会在某个时间突然对某个主题的东西感兴趣，这其实是给他们探索的好时机。


    # 3. 玩具摆放


    放在外面的玩具，如何摆放也很重要。教育学家的研究发现，如果孩子的玩具、材料都摆放得井然有序，孩子能够学会更多认知技能。但要按照什么规则摆呢？怎样分类呢？


    比如，从大的方面来看，《吃汉字的刺猬》可以放在桌游类，也可以跟绘本一起放在语言类。从小的方面来看，各种小玩具可以按照形状分，也可以按照颜色分，按照功能分。其实，怎样分都可以，把任务交给孩子就行，因为主要是他们在用这些玩具。


    我给女儿准备了书架、玩具架和玩具分类框，跟她商量怎样放给本和玩具，提醒她，在书架和玩具架的格子上贴标签，这样方便找。她还不会写字的时候，就用画来表示。这样，孩子收拾玩具的时候，就自然地锻炼了分类思维。


    我还教女儿一个重要的安全技能：在书架和玩具架上，把大的、重的东西摆在下层，轻的、小的东西摆在上层，这样架子更稳。顺便给她讲讲这背后的物理学原理，孩子挺快就懂了。


    # Dr. 魏的小叮叮


    我特别想提醒大家的是，你偶尔可以给孩子准备一个独处的小空间，让他可以“躲起来”，这个是有利于儿童发展的。在这个小空间里，孩子一个人待着，觉得舒适、有安全感。你可以给孩子准备一个玩具帐篷，在里面放了小毯子和靠垫，给孩子当秘密基地。


    也可以不用特意这样，家里剩冰箱用剩下来的纸箱，你可以跟孩子一起，把它做成一个小房子；我还见过有人利用餐桌下面的空间，把一块特别大的布铺在餐桌上，四周垂下来，一直垂到地面，孩子可以钻进去，独处上一段时间。


    # 今日得到


    孩子喜欢玩，但是在让他们尽情玩的前提下，家长可以植入一些“学”的小心机，比如，家里玩具角的布置特别重要。玩具角的布置可以让孩子在玩中学习。'
