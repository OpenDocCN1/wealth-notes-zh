  md: '# 4.姐姐就得让着妹妹吗？


    我家小孩快四岁了，常常有一个比她小一点的小妹妹来我家玩。所以现在很多时候女家长告诉她的是，“你是姐姐要让妹妹”。我对“让”这种想法非常反感，但是有时候又没有好的处理方法，小妹妹性格是得不到就一直哭闹，这个我该怎么办？


    Dr.魏


    孩子是很容易言语色的，小妹妹知道只要她哭闹，大家就会妥协，让姐姐让着她，那她就越来越容易把哭闹作为达到自己需求的利器。这其实现对小妹妹是不好的，容易把孩子养成熟手党，也就是我在文中提到的索取者。


    而对于你家孩子，如果只是一味让她分享，她也会很委屈：“妹妹永远不可能比我大，那我是不是得一直让着她呢？”


    当冲突发生时，你可以帮女儿说一下，捍卫她的物权。但更重要的是做其他大人的工作，比如聊天时“不经意”地说，最近看了Dr.魏关于分享的文章，有一些感想一起交流交流。让他们意识到，其实你们这样做反而是害了小妹妹。


    # 5.孩子不好意思拒绝别人怎么办？


    这种“孩子需不需要分享”的事情，我们碰到的越来越多。我一般选择询问孩子的意思，如果他不愿意，不会强迫。但是有时候他会不好意思，明明不愿意，却没说“不”，主动分享玩具，心里又不高兴，有些孩子又不主动把玩具还回来，他又不好意思主动去要，一直闷闷不乐。


    这种情况请问魏老师该如何处理？在他分享的时候就让他考虑清楚？但往往分享就是那一瞬间，我也来不及提醒。这种情况碰到好多次了。


    Dr.魏


    孩子不愿意分享，但是没有学会说“不”的能力，导致“被分享”之后情绪不佳。你可以找个机会，比如故意向他借一下他最喜爱的玩具，你发现孩子有些不愿意，就温柔地告诉他：“如果你不想，你有权跟妈妈说不。这个玩具是属于你的，你能决定分享还是不分享。”


    同样的，你可以有意无意地在孩子面前表演一下你是怎么样合理拒绝别人的，比如爸爸要跟你借书，你当着孩子的面说：“不好意思哦，这本书我还要读，现在不能借给你。”让孩子在耳濡目染中学会说“不”。


    最后，就是结合7月5日的今日行动方法，提前让孩子把家里玩具分类，分为我不愿意分享出去的，和我愿意分享出去的，以后需要分享的时候，教孩子说：“这个玩具我还要玩，不过我有另外一个类似的玩具，可以给你玩。”然后把愿意分享组的玩具给别的小朋友。


    # 6.大人善解孩意，对孩子语言表达能力不好？


    成年人游戏能很快、甚至超前Get到孩子的意图（哪怕他们表达并不清楚），如何避免孩子过于依赖成年人这种“善解人意”的情况（因为他将面对的是同龄人，不一定有那么善解他心意的人，他需要自己做出努力去沟通、表达），作为成年玩伴我们该注意些什么？


    Dr.魏


    在前面的文章《专题001｜好爸爸攻略》（今天文章末尾为你准备了相关文章推荐）中，我提到爸爸多陪孩子玩，孩子的语言能力会更好。原因是爸爸接触孩子相对妈妈来说比较少，会用他们不熟悉的语言。


    所以，如果不那么“善解孩意”一些，的确提高孩子的语言能力。那是不是说妈妈得假装听不懂孩子呢？得分情况。如果家里人都是很善解孩意的，那不如鼓励孩子表达完整一些；如果身边很少人懂孩子说什么，妈妈作为翻译官，就不要再给娃加难度了。所有人都不懂你的世界，想想都可怕。


    # 7.去幼儿园早点好，还是晚点好？


    Dr.魏，最近有一个问题困扰我：儿子上个月满三周岁了，一直都是我带着他，我也有时间教育他（自从听了老师的课后，基本上都会尝试落实老师教的方法）。

    比如通过玩小刺猬识字盒子，他现在认识二三十个字；还会说一些英语；也认识十以内的数字；我也会带他玩各种游戏。

    现在纠结下半年要不要送他去幼儿园。第一，他在幼儿园只是老师集中照看，担心太早固定小孩子在教室，运动时间少。三个老师配一班，几十个小孩，不可能会照顾到。

    第二，担心小孩太早去幼儿园，上个几年都废了以后戾气上学。如果不送去又担心会错过社交学习方。所以想问一下Dr.魏，像我家这种情况，你建议他是早点去幼儿园还是晚点再去好呢？谢谢！


    Dr.魏


    每一个选择都是要付出成本的，这就要看收益是否大于成本。第一，如果你平时经常带孩子出去活动，那么幼儿园活动量恐怕不如你带；这个可以通过晚上或周末来补充。第二，幼儿园的活动安排需要你去具体考察。现在幼儿园还是以主题游戏为主，知识性学习比较少，跟小学不一样，不必担心会戾气。


    在幼儿园能够学什么，我请教了爱贝睿家长教师陈淑老师，她说主要是学习两点：规则和同伴交往。首先是规则。幼儿园的时间是分成一个一个时间段的，每个时间段老师安排了不同活动，孩子要逐渐了解这个规则，才会听从老师的指挥。养成遵守规则的习惯，以后上小学，适应会快一些。


    第二个是同伴交往，他不光是学习怎么和别的小朋友一起玩，友好相处；更重要的是，学习当和别人发生冲突的时候，怎么处理。这对他们处理人际关系也是很有帮助的。


    孩子现在三岁多，如果已经有一定自理能力，比如会自己吃饭、喝水、大小便，基本能穿衣服，那么去幼儿园，没问题。但是如果妈妈想多陪孩子一些，而你的时间也允许，晚一年，也不会说错了孩子社交的“敏感期”，你来决定。


