  md: '# 语言脑｜互动阅读比给孩子“堆书”更有效


    语言脑｜互动阅读比给孩子...


    Dr.魏


    这个星期天是世界阅读日，我们就来讲讲和宝宝一起阅读。这个事情，绝对不是和孩子一起消遣的小爱好，对我来说，简直是培养聪明的宝宝的最重要的穷门之一。


    我是一个很爱阅读的人，每天有了空余时间就喜欢拿一本书来看。在我看来，阅读是世界上最美好的事情之一。大家可能看见我在电视上侃侃而谈，或者看见我在大学课堂或公共演讲上高谈阔论，但是，所有这些表面现象，就是基于我常年阅读积累的知识。


    而且，无论是吸取自己感兴趣的知识，还是跟着小说情节牵肠挂肚，对我来说都是莫大的享受。我见过的聪明人，我说的不仅是那些事业有成的，更包括那些有思想有见解的人，没有一个人不热爱阅读。而且这些聪明人，绝大多数都是从小就喜欢阅读。


    不过，等我有了孩子之后，我才发现，还有一样比阅读更美好的事情，就是和孩子一起阅读。很多家长也知道让孩子阅读的重要性，家里也买了一堆书，可是孩子好像就是不喜欢读，逼他读的话他就会讨厌阅读了，这该怎么办呢？


    # 家长的引导很重要，试试互动阅读吧


    如果家长引导孩子阅读的方法不正确，会让结果事与愿违，不仅没能培养孩子读书的习惯，还白白浪费了提升孩子的好机会。


    > 《Dr. 魏的家庭教育宝典》的查询结果

    互动阅读，能提升孩子智力


    # 互动阅读比给孩子“堆书”更有效


    为什么我这么说呢？因为以前大家有一个误解，就是只要在家里放上书，孩子就会自动喜欢上看书，就会变得阅读能力更强。可是，科学研究却发现，如果只是给孩子书，其实帮助不大，关键在于你跟他是不是进行互动的阅读。


    比如在2003年，香港中文大学的研究者对幼儿园里的小朋友做了个实验，把86个小朋友分为3组，一组互动阅读，一组不互动阅读，还有一组是控制组，就是没有接受任何实验干预的一组，结果就发现只有互动阅读，孩子的阅读能力才能得到最大的提升。


    还记得我有一期节目讲《靠谱的智力提升方法》，里面提到的智力提升数据库吗？里面也提到这个方法，并收集了8个互动阅读的研究。分析发现，互动阅读能提升孩子的智商达到6个点。


    # 互动阅读有哪些优势


    为什么呢？因为互动阅读能让孩子更多地练习语言，比如你会问孩子问题，也为孩子解答疑问，而且让孩子根据他的能力来决定阅读速度，根据他的兴趣来决定读哪儿不读哪儿，所以它能更快地促进孩子的语言能力发展。


    这样一来，互动阅读本身虽然并不是直接提升了孩子的智力，但是能让孩子在智商测试中表现更好。不过，一旦孩子的语言发展水平随着年龄进一步提高，互动阅读对智商的影响就越来越小了，所以，过了4岁以后，互动阅读对于智商就没有什么提升作用了。


    就像上次我讲外语学习的时候说的，“晚一点不如早一点，背出来不如玩出来。”学外语是这样，学母语也是这样。互动阅读也是我提倡的浸入式的语言学习，因为这时候给孩子的不仅仅是书上的知识，还有你读出来的语言的语音语调，还有他看到的图书上的图片和文字的视觉信息，他还能沉浸到书中文字传达的巨大的想象空间中。这就是一个浸入式的体验。


    比如，同样一个童话故事，看动画片时孩子是被动地接受视频信息，而看书的时候，文字传达的内容，让孩子大脑想象出故事的场景，更别提他还学习了文字本身的读音和字形等信息，给他的识字打下了坚实基础。孩子不仅仅是在读书，而且是在感受你们
    defenses 的亲子关系，这里有双方的情绪，你给他的关心和安全感，你给他的感动和惊喜。


    这个时候，从孩子的角度看 来，就更像是你用书作为道具，和孩子玩的一个游戏，所以孩子当然会喜欢。当他觉得阅读本身就是一个快乐的过程之后，他以后读书就更主动，阅读体验也更好。


    所以，你光知道要阅读是不够的，还要知道让孩子怎么阅读。尤其是对于4岁以下的孩子，要用正确的互动阅读方法，这能让他更喜欢阅读，而且还能提升他的智商表现。


    ![](img/8dd4b172abeef48fa291369820efe392_30_0.png)


    # 具体应该怎么跟孩子互动阅读呢？


    要注意三个关键的地方：第一，问孩子问题；第二，跟着孩子的兴趣走；第三，把阅读变成游戏。下面我就具体讲一讲。


    # 1. 问孩子问题


    首先，互动阅读，意思就是不只是把书上的字一个一个地读出来，更重要的是你跟他在 mollie过程 ???? 对话。一开始的时候，孩子还小，可能只能被动地跟着你走，这个时候，就需要你多问问题，来开启这个互动。


    这个问题可以是启发孩子，帮他把书里的东西跟生活里的东西联系起来。比如说，如果你家里养猫的话，你读到绘本里有一只猫的时候，就可以指着书上画的猫问孩子：“哈，你看，这只猫是长这样的！它和我们家的咪咪长得像吗？”孩子回答了之后，你还可以再问：“你觉得它们谁长得好看？你更喜欢它还是咪咪呢？”生活中的信息，孩子总是记得比较牢的，也比较感兴趣，所以你把书里的东西跟生活联系起来之后，这本书对他来说就变得鲜活起来了，他也就会更理解这本书了。


    当然，比刚刚三个问题更好的方式，是问开放式问题，就是没有固定答案的问题。比如说，我在跟我女儿读《三只小猪》的故事的时候，我会问她：“你看，这三只小猪用不同的方法造房子，你觉得下面要是狼来了的话，会怎么样？”或者，“这三只小猪，你想做哪一只？为什么呢？”


    当然，问这些问题不一定是为了讲道理，有时候纯粹就是好玩，比如我会问她：“哎呀，这第三只小猪造的房子太牢固了， 来，我们代替大灰狼想想办法，你要是大灰狼的话，怎么样才能吃到三只小猪呢？”这样的开放式问题一下子就把她的脑洞给打开了，她就会开始兴高采烈地代入到故事里，想象怎么去当大灰狼了。


    # 2. 跟着孩子的兴趣走


    当然，互动阅读，不能只是你引导孩子，更重要的是鼓励孩子来主导这个阅读的过程，这就是互动阅读的第二要点，跟着孩子的兴趣走。比如，要鼓励孩子问问题，他有问题，只要是跟阅读有关的，一定要回答。


    有时候我也遇到过这种情景，就是和女儿在一起亲子阅读的时候，时间比较紧，回答了问题就读不完书了，但是我也不会说：“哎，不要问这么多问题，我们先把书记完再说。”我会耐心地先回答她的问题，再继续读书。


    甚至有时候我会放下书，跟着孩子的兴趣开始发挥。比如读动物书的时候，她会问：“为什么熊猫是‘活化石’呢？”我回答了之后，她又会再问：“那为什么像熊猫那样的其他动物都灭绝了呢？”你肯定也有这种经验，就是小孩子的问题是一环套一环，永远回答不完。我家里正好有一本关于熊猫的书，于是就拿过来跟她一起看那本书了，不然的话，我也不
    会强迫她一定要先把这本动物书读完，而是先回答她的问题再说。


    包括对于书的内容，我也是跟着孩子的兴趣走。有些书是我女儿比较喜欢的，但是她只喜欢书的一部分。比如还是动物册本 书，她常常会拿过来跟我说：“爸爸，我们来读熊猫这一页吧。”我跟她读完后，翻过去是老虎、大象，她也喜欢，但是到了猩猩、河马，她又不喜欢了，要跳过去直接看后面的鲸鱼和海豚。我也都是听她的，并不是说：“哦，这都是有用的知识啊，你要当场...”'
