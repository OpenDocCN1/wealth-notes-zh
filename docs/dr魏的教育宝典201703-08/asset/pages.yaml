    Dr. 魏


    阅读，绝不是家长和孩子一起消遣的小爱好，它是培养聪 Ophthalmic 宝宝的重要窍门。


    我见过的聪明人，不光指那些事业有成的，更包括那些有思想、有见解的人，没有一个不热爱阅读。而且这些聪明人，绝大多数从小就喜欢阅读；阅读能促进孩子识字能力的发展，将文字融入到具体的內容中，孩子记忆更深刻。


    # | 培养阅读小达人攻略


    # 1.转换心态，培养阅读兴趣比学知识更重要


    你要意识到，在孩子小的时候，最重要的是让孩子对阅读产生兴趣，而不是从阅读中立刻学到多少知识。孩子主动的、有兴趣的阅读，比枯燥的、强迫的机械阅读更持久，也更有价值。


    # 2.不要给孩子堆书，要陪孩子一起阅读


    在家里摆满书，孩子不会自动喜欢看书。科学研究发现，只是给孩子堆书，对他阅读能力的提升不大，陪伴、互动才是关键。要把阅读融入到孩子跟父母的日常互动里。比如，一起看绘本、给孩子讲睡前故事、年纪大一些可以分角色朗读。


    # 3.阅读没有严格的年龄阶段限制


    # 4.别用奖励的方式“鼓励”孩子


    # 5.陪孩子阅读时，多问他与生活相关的问题


    # 6.用开放式问题来沟通，助孩子勤思考


    # 7.让孩子爱上阅读，要跟着他的兴趣走


    # 8.利用读书场景，把阅读变成游戏


    # 9.多读诗，利用它的音乐性，从简单的诗句开始


    # 10.无论是电子游戏还是阅读，要把握度，千万别过量


    # 11.选择关键，有一些挑战性的刚刚好


