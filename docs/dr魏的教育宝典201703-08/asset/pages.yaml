    B. 小明妈妈做得不对，孩子的玩具，应该自己做主


    # ｜解析：孩子不爱分享，是不是太自私了


    分享是社会美德，但很多家长教孩子分享的方法是错的。一味付出，不懂得保护自己的利益，这不是真正的分享。家长要从小培养孩子的物权意识，对一件物品的所有权有认识，物权意识强的孩子，对物品更有安全感，更爱分享。家长不要强迫或者代替孩子做决定，因此小明妈妈做得不对。


    # ｜知识点回顾


    +   1. 学会分享，要让孩子学会理解别人的情绪

    2. 物权意识要尽早培养，多强调“我的”“你的”

    3. 给孩子说“不”的勇气


    # ｜推荐阅读


    《巧用三个方法，让孩子学会分享》


