    057 | 听莫扎特音乐的孩子...


    # Dr. 魏


    # 听音乐，选莫扎特还是“广场舞”？


    # （今天有大咖做客，别错过）


    前阵子我收到一条留言，来自一位宝妈 @刘慧：“我家宝宝一岁了，对世界名曲类型的音乐没啥反应，却很喜欢‘小苹果’类型的比较激烈的音乐，一听到就兴奋得手舞足蹈蹦跶。我担心这类音乐会影响她的情绪发展。到底该不该给她听广场舞音乐呢”？


    你可能会说，当然不要让孩子听广场舞音乐了，世界名曲才对宝宝有好处。很多爸爸妈妈都知道莫扎特效应，就是1993年一项试验发现，给一群大学生听莫扎特钢琴奏鸣曲K.448，他们在认知测试中表现得更好。


    这项试验一出，莫扎特音乐就被神化了。父母认为从小让娃听莫扎特音乐，孩子就能变聪明，从胎教起就听莫扎特。居然还有新闻说奶牛听了莫扎特的音乐，产奶量都提升了。


    一般一件事情被吹捧成这个样子，你就该警惕了。研究发现，单独给孩子听莫扎特、古典乐，或者是任何音乐，都达不到宣传的那种让孩子变聪明的效果。


    # 莫扎特效应的秘密，在于节奏


    你可能会问了，Dr.魏，上期节目不是你说学习音乐好处多多的吗？其实，想提高孩子智力，音乐训练确实是一个靠谱的方法。不过，莫扎特效应的秘密，不在于莫扎特音乐本身，而在于它的节奏。


    # 大脑天生爱节奏


    一般人听音乐，我们可能欣赏它的旋律优美，音色动人。脑科学家欣赏音乐，除了它的音色音调，更会关注它的节奏。大量研究表明，节奏跟大脑认知有着非常密切的关系。


    你回想一下，有没有曾经听到一段陌生的音乐，却感觉自己可以预测出它的下一段节奏？你再想一下，尽管全世界的音乐类型不同，但它们似乎都 Pud 有共同点。我们可能听不懂印尼话，但是听到陌生的宝莱坞的音乐，我们本能地觉得这个旋律熟悉。


    音乐似乎有跨越历史文化的相似性和普遍性，不管在那种文化哪个时代，我们都能预测它的规律。


    科学家们去年发表了一篇共识性的文章，特别指出，没有任何音乐训练的人也能用“可预测的音乐节奏”制作歌曲，就好像我们人人都是音乐家、作曲家一样。这群科学家还把来自世界各地的数百种音乐全部分析了一遍，发现全世界音乐中，确实包含了18个普遍的规律，其中跟节奏有关的规律就占了三分之一。


    这些科学家就推测，节奏感就像是进化给我们大脑安装的硬盘一样，是大脑中存在的一些非常底层 的连接，这些连接是不同文化的人群都公有的，不受后天因素的影响。跟着节奏打节拍，是大脑的一个特殊
    的特征，很多动物，包括我们的近亲猩猩都无法做到。


    这下你知道为什么你家宝宝这么喜欢广场舞音乐了。广场舞音乐的一个典型特征是节奏感特别强，“动次打次”，宝宝一听就觉得熟悉，天生就很喜欢。其实，科学家发现，莫扎特的K.448的一大特点，也是比较有节奏感。既然我们大脑偏爱节奏，我们该怎么利用节奏来帮助孩子发展呢？


    # 1. 用节奏玩音乐


    我前面说光听音乐无法让孩子变聪明，先别急着把家里的音乐唱片丢掉，研究发现，如果让孩子听着音乐的同时打着节拍，每天只要20分钟，足以影响孩子的记忆、语言、注意力等认知能力。


    打节拍，这个看似普通的活动有着它神奇的一面，它需要大脑的听觉中枢、运动中枢和额叶（智力核心脑区之一）三者的信息传递和综合才能完成。孩子听到音乐打节拍的时候，他需要协调听到的声音，准
    地感知节拍的时间点，然后协调他的身体运动打节拍，这是一项高级技能。


    我们的大脑中可能有这样的硬件条件，而我们的近亲猩猩们就没有这个能力，即使我们拼命地训练它们，它们基本上都学不会。但是我们的孩子好像生来就喜欢打拍子！


    我们可以在家就训练孩子打节拍了，听音乐的时候、唱歌的时候，都鼓励孩子对应着节奏拍手或者跳跳舞。我其实不常给孩子唱歌，除了哼唱摇篮曲以外，“小兔子乖乖”和“小燕子”我是反复唱，专门用来给孩子催眠的。但是，我喜欢给孩子打节拍玩儿，无论是有音乐响起的时候，还是和宝宝一起拍手。


    反过来，也可以让孩子把节奏转化成音乐，比如你先打出一个节拍，或者创造一个场景，让孩子就着这个节拍唱歌、跳舞或者玩乐器。这种跟音乐的相互作用，能够鼓励他们用新的、不同的方式去思考音乐。


    我喜欢和孩子玩“下雨了”的游戏，就是我让孩子根据我说的话，来拍手、跳舞或者自由弹琴，我说：“现在想象，叽叽咕咕，开始下雨了。”孩子开始表现出一些简单、缓慢的节拍，然后我说：“雨越来越大了，变成暴雨了。”孩子可能蹦蹦跳得更快了，敲鼓敲得更急了，或者弹琴弹得更快了。当孩子拍手、跳舞或者弹奏的时候，这些节奏和速度发生剧烈的变化，有助于锻炼他们的注意力和协调能力。


    # 2. 用节奏玩语言


    大脑爱节奏的一个解释是节奏有规律，能帮助记忆。人的工作记忆（一种特殊的短期记忆）是有限的，大多数情况下只能同时处理四个元素，或者叫信息块。这么小的记忆容量，当面对一首超过三分钟的新歌，我们是怎么记忆的呢？靠节奏感。


    大脑把一个个节拍分类，编排成有重复规律的小组，这样就能够压缩信息，来适应我们有限的记忆容量。我们可以轻松记住一首歌的旋律，却常常记不住歌词。


    比如“一闪一闪亮晶晶，满天都是小星星。”一看有十几个字了，仔细听节拍你会发现这两节都是“咚咚~咚咚~咚咚咚咚”的结构，孩子真正需要记的只有“咚咚”和“咚”两种节拍和规律，大大降低了需要我们记忆的负担。


    良好的工作记忆和节奏感，是语言发展的必要因素。我前面说，节奏感是人类大脑特殊的功能，聪明的猩猩也没有这个能力。不过，最近的研究发现，一些语言能力好的鹦鹉和记忆力好的大象，也发展出了跟随音乐打节拍的能力。这其中的关键，就是节奏跟语言的密切关系。


    在大脑中，处理节奏的能力与准确地处理语言音节的能力是相对应的。听到别人说话的时候，我们的大脑再将听到的声音整理成单词、短语和句子。美 国 西北大学听觉神经实验
    室的研究人员测量了儿童大脑活动之后，发现孩子们节奏感和听觉工作记忆越好，他们的阅读和识字能力也越强。


    所以，如果你想改善孩子的读写能力，结合音乐训练是一个很好的方法。我之前讲诵诗的时候，说过诗跟音乐和节奏的关系，我说要充分利用诗的音乐性和里面的节奏感，道 理是一样的。唱童谣的时候、读诗的时候，我们都可以让孩子配合着打节拍。


    孩子还不太懂得节拍规律的时候，你可以给孩子多听几种节奏、韵律不同的童谣，你示范着打出节拍，让孩子去模仿。你可以慢慢让节奏变化得更复杂，让孩子集中注意力，模仿着你打节拍。这样，他们的听觉工作记忆会得到锻炼。


    要是你也不懂节拍，可以用设备随机播放不同节奏的童谣，让孩子跟着童谣打节拍，等孩子越来越会玩这个游戏了，你还可以增加难度，比如放旋律更复杂的童谣。


    除了打节拍，我推荐让孩子学一些乐器，比如打击乐就非常强调对节奏感的把握。有 一群研究者发现，学龄 前玩打击乐好的孩子，他们之后的语言能力会更高。


    小岁的宝宝可以配合着童谣、歌曲，玩些沙锤、摇铃、三角铁；大岁的宝宝可以学学非洲鼓、架子鼓，当然也不只是打击乐，任何乐器都可以锻炼到节奏感，重点是挑一个孩子感兴趣的乐器。


