    在跟孩子见面的时间里，不要因为陪孩子时间少对就给他们太多的物质补偿，让亲情变味。多和孩子玩，你要在轻松愉快地互动中拉近彼此的距离。


    # 2.出门在外时尽可能跟孩子电话、视频沟通


