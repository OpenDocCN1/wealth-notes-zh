  md: '# 060｜先做个测试，再帮你提升空间认知


    060｜先做个测试，再帮你...


    Dr.魏


    开始今天的话题之前，我想先请你做一道题。


    下面是两张立方体的图片，请你判断一下，它们的形状是不同，还是相同的？或者说只是摆放的角度不同？你可以在大脑中想象一下，从各个角度旋转右边的方块，能不能成功得出左边的方块。


    ![](img/8dd4b172abeef48fa291369820efe392_128_0.png)


    答案是不能，这两个图案不同。


    我给你的是一个经典的心理空间旋转测试，科学家用它来测量人的空间认知能力。很多研究发现，男性在这个测试中普遍表现得要好些。


    # 空间认知影响科学、建筑、医学以及艺术多个领域


    这种能力在很久之前就影响我们人类了，我们第一个学会制作石器的老祖先，是先在心中想象出斧头的形状，然后才能做成工具；米开朗基罗看着一块石头，他能在心中想象，如何才能把它雕刻成大卫；生物学家沃森和克里克发现DNA结构的时候，是靠着二维分子图来想象它的三维模型；建筑师建造摩天大楼，要预测各种力会怎么来影响建筑结构；神经外科医生看着大脑磁共振的平面图片，能判断出肿瘤的具体位置。


    # 1.多用空间词汇


    我之前说过数学即沟通，空间认知能力也是一样，也能通过跟孩子沟通、问孩子问题，给激发出来。


    # 2.多玩建构类玩具


    我之前看到家长留言，问该不该给孩子买乐高？乐高是一种建构类玩具（construction toys）。孩子可以利用这些玩具搭建各种各样的形状。建构类玩具是少数的心理学家进行过深入研究的游戏玩具。


    # 3.用“寻宝”小游戏互动


    除了聊天、玩玩具，还可以通过各种游戏来锻炼孩子的空间认知能力。比如我在家里经常跟女儿玩“寻宝”的游戏。首先我会在家里的某个房间藏好一个玩具，比如女儿的玩具熊。然后我会跟女儿一起，画一画家里里的平面图。不用担心孩子还太小，大多数3岁左右的孩子，已经具备学习简单地图的能力了。'
