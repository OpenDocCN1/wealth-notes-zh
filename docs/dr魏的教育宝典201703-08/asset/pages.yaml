  md: '# 053 | 智力脑：培养数学能力要从小开始？


    053 | 智力脑：培养数学能力要从小开始… ↓


    Dr. 魏


    什么时候开始培养宝宝的数学能力？

    我女儿跟同龄孩子相比，算术能力应该算是比较突出的。比如一般的2位数乘法她可以心算出来。虽然我没有要求她背乘法口诀，但是她通过自己的运算，都能给出正确答案。


    不是因为她天生智力有多高，而是因为我从她小时候开始就注意引导她对数学的兴趣，启蒙她对数字的敏感度。这些启发她的 小窍门最后都派上了用场。


    有朋友跟我说：“数学这种东西太抽象了，你看我孩子连数都数不好，怎么教呀？”也有朋友说，“有必要绐小宝宝的数学能力吗？上了小学再学就好了。”


    还有有必要。数学跟吃一样，宝宝天生会吃，其实宝宝天生也会数学。只要引导得当，宝宝就会像爱吃一样爱数学。


    我用接下来几期的智力脑的内容，把启蒙女儿数学力的“私房菜谱”一一讲给你听。


    # 孩子天生就是数学家


    孩子天生有数感，也就是数学直觉，他不需要学习抽象符号，比如数字是多少、数字的含义，也能对数量有粗略的估计能力。在2013年，美国的心理学家就研究了这个现象。他们找来了48个6个月大的小宝宝，看他们能不能分辨两堆物体的数量，结果发现，宝宝6个月的时候，就能分辨哪堆物体数量多了。


    孩子这种天生的对数字的估算能力，也叫模糊计算能力，能一眼看出两堆物体哪边多，一眼看出不同东西的大概比例，还有对于比较小的数，我们撒一眼就能看出是多 少。比如如果左边有4颗樱桃，你一眼能看出
    来。当然，在右边放10个以上的樱桃，你恐怕就不能一眼看出来了。


    与模糊计算相对应的是精确计算能力，精确运算是需要后天花时间学习、练习的，比如虽然你看不出来右边有多少颗樱桃，但是你学过数数之后，就能精确地数出来有多少颗。


    孩子早期的这种模糊计算能力，给他们提供了一个很好的数学基础，帮助他们后天精确计算能力的发展。所以，孩子天生有数学潜力，学数学本身不需要区分年龄，跟学习第二语言一样，可以基于孩子的兴趣程度和已经掌握的技能来定，只要孩子准备好了，就可以尽早启蒙了。


    你可能会问，“数学这么抽象，提起数学就想起各种符号和公式，自己头脑都有些晕，怎么启蒙宝宝学习呢”，给宝宝的数学应该像一道美味的佳肴，有营养又好吃。营养是指数学有用，好用；好吃是指数学好学，有趣。


    下面我给你分享三个“私房配方”。这三个配方很重要，我们之后会提到各种数学思维，都离不开这三个配方的联合运用。就像我们离不开的油盐酱醋，用好这三个配方，你也能给孩子做出好吃的数学佳肴。


    # 1.数学即生活


    伽利略说，数学是读懂宇宙的字母。确实，数字不仅是抽象的符号，而是我们理解和把握生活的语言。仔细想想，我们都是数学家，面对到日常生活中 的奶粉尿布到绘本，大到投资理财、买车买房、宝宝上幼儿园上小学，哪个背后没有数字？


    给宝宝最重要的启蒙，是让他们了解数学的重要性，数学是服务于我们的生活，跟我们的日常息息相关的。


    我没有把女儿送去上数学补习班，就是注意在生活中锻炼她的数学能力。比起让孩子背公式，生活总有机会让孩子发挥数学才能。


    # 2.数学即解决问题的能力


    # 3.数学即沟通'
