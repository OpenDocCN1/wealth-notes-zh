    Dr.魏


    下周讲什么，今天做预告


    4.24（周一）：怎么正确的批评孩子？

    中国孩子普遍自尊心很强、害羞，因为我们的教育中注重批评。西方孩子恰恰相反，他们自信开放，这也和他们接受的教育方式有关。那么下周，听我聊聊批评孩子的正确姿势。


    4.26（周三）：运动不仅增强体质，对大脑也有益？

    四肢发达，头脑就一定简单吗？这是个误区。运动能力强，协调能力好，与大脑息息相关，下周三，我给你一个方法，让孩子的四肢和大脑同时升级。


    # 智力脑｜表扬孩子的努力和当今“看分数”的现实冲突吗？


    Dr.魏：您好，适时地表扬孩子的努力，而不是天赋（聪明）；关注孩子的学习过程，而不是结果；表扬孩子的成长（进步），而不是表象（分数）。我很认同您的观点，且教育自己的孩子和学生时，也是这么做的。但现在社会主流潮流还是关注结果，比如，升学看分数；学校考核老师看分数；上级领导部门对学校的考核也是看数据分析、成果展览，在这种大环境下，我们又该如何独善其身呢？


    Dr.魏


    这是一个很现实的问题。现在社会强调结果导向，但是，分数如何提高？对孩子说“我不管，你给我考一个高分回来！”效果显差人意。孩子不知道自己问题出在哪里，你无法对症下药。

    这时候你就需要观察他学习的过程，发现他学习的不足之处。这不就是关注过程吗？孩子说，“我荫我怎么都不会进步”，这时候你会跟他回顾之前因为努力而进步的经历。这不就是关注努力吗？孩子说，“我什么事都做不好没自信”，这时候你会告诉他你已经比上次做得好了。这不就是关注进步吗？培养孩子的成长型思维，不就是在帮孩子更好地实现目标，应对生活的挑战么？'
