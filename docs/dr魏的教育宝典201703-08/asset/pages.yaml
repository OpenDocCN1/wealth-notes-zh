    # —— 刻意练习急救卡 ——


    一万小时并不靠谱，刻意练习是正道，家长需要根据孩子的学习状态，帮助孩子调整难度、安排练习时长，孩子会逐渐减少对练习的负面情绪。


    # 如何减轻练习的负面情绪？


