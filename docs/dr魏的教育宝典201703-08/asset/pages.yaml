    @尚晓日把专注力三原则用在给孩子学跳绳的例子中，是聪明家长。希望家长们也多多举一反三，能够把我说过的原理融会贯通到生活的方方面面。我也会介绍更多实用的育儿技巧。关于专注力，之后我会找一些小游戏或者小故事送给大家，作为家长和孩子共同培养专注力的彩蛋。


    +   2. 来自@Apple的思维脑图分享


