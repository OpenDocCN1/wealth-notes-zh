    我看到留言区有家长说孩子拼图一错就放弃；搭积木一倒就哭；学舞蹈不肯练新动作等，其实，孩子有畏难情绪，是普遍现象。我们大人也一样，也喜欢待在舒适区里，不喜欢走到一个陌生的领域。


    # 善于使用跳一跳，够得着的“最近发展区”


    “最近发展区” 是相对于“舒适区” 的一个概念。在舒适区里，孩子做什么事情都比较熟悉，游刃有余；而在“最近发展区”里，要学习助的任务或知识要难一点，孩子一开始没办法独立完成，如果没人帮忙，他可能就有畏难情绪，不去尝试了。


