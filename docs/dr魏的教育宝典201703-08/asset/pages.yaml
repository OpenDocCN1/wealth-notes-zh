    # 3.来自创意脑 | 联想性思维和发散性思维有何不同？


    感谢Dr.魏的这些好点子。宝宝在进行创造的时候真的很可爱也很神奇，他们总是能让我们大吃一惊。我家宝宝有时吃饭的时候会用拿着筷子做出飞的动作，然后告诉我说是指甲，还会搭成三角，然后跟着说是三角形，这些都是他平时自己观察学习的。刚才在读文章的时候，孩子刚好在旁边听英文儿歌，我随口问了“那个蜘蛛像什么”（动画里的），他想也没想就说“妈妈蜘蛛”，原因是蜘蛛头上戴了个蝴蝶结。


    想想问问Dr.魏，联想性思维和之前讲的发散性思维模式很像，两者是不是就是同一种思维模式？


    Dr.魏


    发散性思维是从一个点发散开想问题，从而产生多种答案，而不是一种常规的答案。除了可乐罐除了喝还有什么用途，再举一个最近的例子：端午节一家决定去北京旅游，除了跟团，你可以围绕北京让孩子想想还能怎么玩儿。


    比如北京有很多博物馆，可以来一次博物馆游；有胡同可以来一次胡同游；北京还有烤鸭可以来一次美食之旅，这就是对旅游的一次创新思维。


    联想性思维是从点与点之间找联系。比如用两个不同的词语造句，找不相干的事情之间的关系。比如你家宝宝，把蜘蛛和妈妈联系到一起，因为蜘蛛头上戴了个蝴蝶结，这是很有创意的联想思维。


    所以，发散性思维和联想性思维是不同的思维模式，但都有利于培养孩子创造力！


