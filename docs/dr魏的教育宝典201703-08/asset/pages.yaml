- pgno: 12
  md: '激，培养孩子大脑的过程。这是育儿里面可以说是很重要科学原理之一，它不仅决定你孩子的智力，也决定你孩子在情绪、运动等等各方面如何发展，你会在后面的内容里逐渐听到如何在这些不同的方面，用正确的刺激来帮助孩子的大脑发育。


    # Dr. 魏的小 “叨叨”


    所以在养育孩子过程中，你更需要了解科学的儿童发展规律，正确的科学育儿方法，这样才能知道孩子什么能力要早培养，什么阶段要提供什么刺激，削减哪些，留下哪些，因为这些都是后天养育可以塑造的。


    而我要做的，就是不断地把那些晦涩难懂的最新科学研究，翻译成你能明白的知识，你能操作的方法，我就是你的私家育儿顾问。我要特别强调一下，现代科学之所以科学，是因为它是可证伪的，也就是说它不是绝对正确，而是不断迭代更新的。我的家庭教育宝典也是一样，我提供的知识也是不断迭代、更新的。


    今后的内容中，我会及时补充和更正提过的科学研究成果，这才是靠谱的科学育儿态度。


    +   1. 育儿要讲科学，但讲科学也需要正确的姿势。有人会拿科学的名义来忽悠你，故意夸大、歪曲科学研究的结果，为他自己赚钱。\n2. 我来「得到」的初衷，就是做你的科学育儿顾问，帮助你正本清源，推荐给你最靠谱的科学育儿方法。


