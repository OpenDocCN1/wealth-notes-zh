  md: '# 073｜读者问答：孩子该不该上早教班？


    073｜读者问答：孩子该不…


    Dr.魏


    下周我将集中解决孩子的自控力问题


    孩子看到好吃的、好玩的，就要吃要玩；孩子坐不住，学习容易分心；孩子做事情绪отвор，爱拖延…这些现象都跟自控力有关。


    提升自控力需要有效的抑制、控制和规划能力，下周，我将系统来自控力的认知过程，以及该如何帮孩子提升自控力。


    # ——► 本周问答时间 ◄——


    +   1. 宝宝说话晚怎么办？

    2. 宝宝喜欢打人，如何纠正？

    3. 孩子有些口吃怎么办？

    4. 有必要参加早教课程吗？

    5. 有必要学习珠心算吗？


    # 1.宝宝说话晚怎么办？


    Dr.魏，你好，我是一名1岁9个月男宝的妈妈，我家宝宝10个月的时候会叫爸爸妈妈，后来工作就交给我奶奶带了，结果现在一句话也不会讲，连爸爸妈妈也不叫了。


    最近孩子回我身边一个月了，还是不会叫爸爸妈妈，这种情况正常吗？对付说话晚的宝宝可有妙招？


    Dr.魏


    首先，建议你先和奶奶了解一下，宝宝跟她在一起的期间，语言表现如何。是不是因为和你们离开久了，生疏，不愿意表达。其次，语言能力可以分为两种：理解和表达。


    宝宝现在没有表达的迹象，那他在理解方面有困难吗？比如让他拿手上的某个玩具，他能做得到；如果他想要尿尿或者去某个地方，会不会用手指指，或者拉着你们去。假如有理解能力，那问题不大。如果理解能力有障碍，那么建议咨询医生。检查是否有听力或语言发育迟缓问题。


    # 2.宝宝喜欢打人，如何纠正？


    你好，Dr.魏，我家宝宝17个月了，最近有点暴力倾向，老喜欢打人，刚开始没当回事，后来发现他只要遇到不顺从的情况就要举起手示威的意思，有时候直接就一把拍在对方脸上。


    有次出门玩，也不知道对方怎么对他了，直接一巴掌拍在别人脑袋上，当时我的处理方式很简单粗暴，直接抓住他的手就打了他一下，并且凶了他，当然他也哭了。


    我该怎么帮助他改变这样的情况，或者说帮他理解一件事情的对与错？


    Dr.魏


    很多宝宝到了1岁半就开始出现自我意识，有自己的想法，但语言能力和社交能力不足，往往只会用大喊大叫或大打出手来解决问题。很多妈妈把这种现象叫“Terrible
    2”，也就是“可怕的两岁”，这是正常的。


    如果宝宝一不如意就想打人，可以蹲下来，握住他的手，确保他不会打到人，又不会弄疼他。冷静地告诉他，打人不对。同时跟他解释为什么不让他做某件事，比如不能砸插座，因为插座像老虎，被电会很疼。然后带他去玩其他玩具。唯一防断更微信：699250


    宝宝和小朋友发生冲突，一巴掌拍在别人脑袋上，你也可以用类似的解决方式。如果只是打他的话，他不知道自己做错在哪里，无从改进。更糟糕的是，你口头上说不可以打人，行为上却做了示范：打人可以解决问题，爸爸妈妈就是这么做的。


    # 3.孩子有些口吃怎么办？


    Dr.魏，您好，孩子有些口吃，我该如何正确引导？宝宝快满2岁了。有一天，我们发现她说话开始有点口吃。刚开始遇到了比较急的事情，开始重复一个字好久说不出话。慢慢开始不愿意叫奶奶爷爷。


    我们告诉她说话不要急慢慢来，想清楚再说。我们没有刻意矫正她，等待她把想说的话说清楚。我们担心指责她反而使她更不愿意说话了。


    但是最近几周发现情况越来越严重，她开始不愿意讲话，一个字在嘴边好久说不出来。原本像个小话痨的孩子，变得不愿意说话了。如何正确地引导孩子改善她的这个问题？


    Dr.魏


    口吃通常发生在2-5岁，但长大后真正成为口吃的只占很小的比例。根据美国的调查研究，口吃的发生率大概占总人口的5%，男性大概是女性的3倍。


    宝宝学说话，刚开始是一个字一个字往外蹦；口吃通常出现在从说单个字到说句子的过程中。句子比单个字复杂，说起来就需要停一停，想一想。


    另外，当宝宝说话速度变快时，也容易出现口吃。这种口吃是正常的，你不必担心，等宝宝语言能力发展起来，就会逐渐消失。


    所以，当宝宝出现正常的口吃时，注意耐心听完他说话，不要刻意提醒“慢慢来，想好了再说”。同时，你和宝宝说话时，放慢速度，给他充足的时间了解和吸收你传递的信息。


    那么什么时候应该注意呢？看看宝宝是否出现下面的异常信号：


    +   （1）说话不流畅，出现6个月后仍然没有变好；

    （2）说话时有眨眼、耸肩、嘟头、拍手和踏脚等肢体动作；

    （3）意识到自己有口吃问题，每次说话会紧张，甚至逃避说话。


    如果孩子出现以上信号，你需要带宝宝去咨询医生，给他选择合适的干预方式。


    # 4.有必要参加早教课程吗


    早教课程真的有必要参加吗？近期在和同事、朋友交流的时候发现身边同龄的父母都在带宝宝参加各�早教班，有的5个月就开始了，忽然就觉得自己有点内疚，于是开始了解各类的早教班，发现早教水平参差不齐，也不知道该不该去？


    不知道怎样选择好的早教班，担心选不好反而给宝宝造成压力。不去又会让宝宝输在起跑线，很纠结，希望您给予指导。


    Dr.魏


    家长@xxx也提了类似问题，我重点回答一下。早教问题不能一概而论，要考虑的因素很多，比如，早教班的老师是否有经验、有水平？根据孩子年龄来看，师资是否恰当？环境是否有保障？对于小宝宝来说，还要考虑距离。


    最后，也肯定要考虑到费用、性价比，毕竟现在早教班动不动张卡就几万元，平均一节课下来，怎么也得200元左右。


    当然了，好的早教班，确实能在一部分时间和培养方式上帮助新手父母，同时，也能给孩子提供一个小小的社交环境，对孩子的能力提升也有一定帮助。


    但我想说的是，作为父母，你千万不要把“宝”押在别人身上。早教班再好，也代替不了你给孩子的培养和影响。你和孩子的语言交流，你小时候给他爱抚，你和他一起做游戏，一起读书小人书、一起堆沙子、一起跑过林荫路，这些都是他最重要早教。


    当然，如果你能多知道一些靠谱的、科学的育儿知识，并在陪伴他的时候应用上，那就更完美了。


    # 5.有必要学习珠心算吗？


    你好，魏教授，宝宝快六岁了，还有一年上小学，想让她学习珠心算。实在网上查了资料，好坏基本参半，请问魏教授，有没有科学方面的数据可以说明学习珠心算的好坏？另外，如果没有是否可以给些建议？'
