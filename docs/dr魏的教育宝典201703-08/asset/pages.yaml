  md: '# 读者问答｜播放背景音影响注意力吗？


    Dr.魏


    本周结尾有来自聪明妈妈@Apple 的脑图分享。希望你动动手指，点击右下角的“请朋友读”，邀请更多聪明人加入《Dr.魏的家庭教育宝典》智囊团。


    # 下周讲什么，今天做预告


    4.17（周一）：想让孩子变聪明，那就别舍他聪明

    现在很流行夸孩子，虽然会提高他的自信心，但是夸的过度会适得其反。怎么夸孩子，如何掌握度？下周一，我在这里帮你解读。


    4.19（周三）：世界读书日临近，教你如何互动阅读

    很多家长听说阅读是好事，就给孩子买了一大堆书籍家里，只知道提供书籍，却不会指导孩子阅读。一项研究表明，只在家提供书籍是不会提升孩子智力的，真正能提高孩子智力的，是爸爸妈妈和孩子的亲子互动阅读。下周三，听听我的“亲子阅读心法”。


    # 1.来自智力脑｜播放背景音算不算干扰注意力？


    Dr.魏，我有个疑问，很多妈妈为了让孩子浸泡在英语环境或者古文环境里，经常在孩子玩玩具或者去公园玩的时候放一些背景乐，比如粉红小猪，又或者是英语儿歌、三字经、唐诗之类的，这样做是对的还是不对的？

    这会影响孩子的专注力吗？或者，还是让孩子浸泡在英语环境里，玩的时候顺便培养了语感呢？我一直对这种做法很纠结。


    Dr.魏


    回答这个问题前，我首先回答另一些家长问到的类似的问题：孩子在专心做一件事情的时候，给他放点英文儿歌当背景音，能不能顺便培养孩子的语感？

    实际上，由于人工作的记容量有限，所以我们只能同时处理非常有限的事情。如果孩子在处理一些对认知资源要求比较高的任务时，比如在专心写一道数学题的时候，播放英语儿歌，那么对孩子来说，这种时候的英语学习其实是低效的，因为他没有办法投入更多的认知资源去学英语了。如果孩子在做一些低认知资源的事情，比如走路、跑步的时候，这种时候就可以适当听一些英文音频，不过也要特别注意安全。

    @阳妈 问孩子在玩玩具的时候放背景乐是不是能够顺便培养语感，这个就要具体看孩子玩的是哪种游戏了。看这种游戏对孩子的认知资源要求高不高，如果孩子在玩比较复杂的、特别需要动脑动手voc游戏，其实放英语儿歌不但没有什么用，而且还可能打扰到孩子。如果孩子是在荡秋千等，就可以放背景乐。

    当然，如果真希望培养好孩子的英文语感，还得多花一点时间，专门空出一段时久给孩子听英文资料，而且就像我在上期语言脑里反复强调的，别忘了你也要加入进来，跟孩子互动着学英文最有效。


    # 2.来自智力脑｜如何适当给孩子反馈


    记得我小的时候，写作业时头总是特别低。母亲看到后，担心我的眼睛，总会提醒我头抬高。但是次数太频繁，反而打断了我正在专注的作业上。如今我也有了孩子，请问Dr.魏，要如何适当地提醒孩子而不又打扰他的专注？谢谢！


    Dr.魏


    很多家长问到这个问题，孩子在专注的过程中，该怎么样做，既不打断他的注意力，又能好好教育到他。这个也要分情况来看，首先打断孩子次数太多确实不好，所以如果孩子是在专心游戏，在保证安全的情况下，先别急着教育孩子，玩也是学，就放手让孩子玩吧！

    如果孩子是在专心学一项知识或技能，当孩子做错了，那确实是需要用一些适当的提醒来指导孩子。这里的重点是爸爸妈妈要示范给孩子什么是对的、什么是错的，我用培养专注宝宝的三个步骤来回答你的问题。

    @Christy CHEN 小时候写作业的时候，母亲频繁提醒头抬高，反而打扰到了专注。这是家长在反馈问题的时候，没有关注到孩子的自主性，让孩子自己发现问题。

    那怎样让孩子自己发现问题呢？如果你现在要教自己孩子正确的写字姿势了，那么当孩子在写字的时候，你先不要立刻去打断他，而是在一旁把孩子的写字姿态拍下来给他看，他就会意识到原来自己写字的时候是这个样子的。然后你再展示什么是正确的写字姿势，让孩子模仿，孩子就能看出问题来，原来是因为自己写字的时候头太低了。我们的目的是要孩子知道，怎么样是对的，怎么样是不对的。


    # 3.来自智力脑｜专注力和注意力一样吗？


    Dr.魏，我想请教一下专注力和注意力是一样的吗？有差别吗？


    Dr.魏


    注意力不是全是专注力，注意力是一个广义的心理学概念，而专注力则特指人们选择性地专注某些信息，同时忽略其他信息的控制能力。我们常说的注意力不集中，其实是专注力不足，忽略周围信息的能力不足的意思。

    其实注意力还包括警觉力和转移注意力的能力。警觉力就是对周围环境的侦测能力，比如孩子能不能注意到身边可能ker的危险，比如注意到路边的坑，这就是警觉力。

    注意力的转移就是孩子从一件事情切换到另一件事情的速度，比如给孩子讲故事的时候，已经讲到第二页了，孩子的意识还停留在第一页，这就是注意力的转移能力还不太好的意思。注意力是一个很大的话题，以后有机会我会再补充讲。


    # 4.来自智力脑｜专注的时候，讲了话像没听见一样


    吃饭前或者睡觉前，儿子在自己玩，我们想让他去洗手或者洗漱，叫他几遍他都不回答，专注做自己的事情，就像听不见一样。但是，当我说，我有好吃的点心，他又听见了便过来问点心在哪。

    我想问老师的是，他不回答时，他是真听不见吗？是不是就再叫他了，让他继续玩吗？用食物吸引他的注意力可取吗？


    Dr.魏


    我看到留言区一些家长说孩子玩玩具或者做事情的时候，就变得仿佛听不到别人的声音了一样，显得不太理别人了。

    其实能够专心长时间做一件事， 都是专注力不错的表现，说明孩子可以排解一些外界信息，专注于手头的事情。

    但跟孩子的学习、生活有关的注意力，不仅要看专注力，还要保持警觉力等。

    如果叫孩子几遍他不回答，这可能说明孩子过于专注，而警觉心不够，没有留意其他的东西，这在家长看来，就像孩子听不见他说话一样。

    不过@布歌 家孩子情况不太一样，叫洗手的时候不理人，当你说有好吃的，孩子又注意到了，这说明孩子的警觉能力没问题，主要问题出在动机上。也就是说孩子对洗手或者洗漱的动机不够强烈，对食物的动机比较强烈。

    这个时候确实可以用好吃的吸引孩子的注意力，或者你可以走近一点，走到孩子身边，拉着他的手，看着他的眼睛说，“到吃饭的时间了，去洗手吃饭吧！”这样就是让孩子直接面对你的请求的方法。


    # 5.来自智力脑｜兴趣问题


    我孩子六岁了，今年该上一年级了。画画时的专注力很好。老师教简单的拼音写字，她不喜欢写，就自己画画，这该怎么办呢！


    Dr.魏


    @原·印象的这个问题，不仅是针对小孩，我们成年人也是如此，对自己喜欢做的事情专注，对自己不感兴趣的事情就不够专注。只是我们成年人有更好的控制能力，知道有些不感兴趣但重要的事情，我们还是要去处理。

    但在控制能力还发育不成熟的小孩身上，我们可以怎么做呢？就是提升孩子对这件事情的兴趣。想提升孩子对不喜欢...'
