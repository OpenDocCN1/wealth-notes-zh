    # 有没有必要让孩子去学记忆术吗？


    经常有人问我该怎样培养孩子的记忆力，前两天看到一个问题让我印象很深刻。一位读者留言：“Dr.魏，我听说学习记忆术，能促使右脑开发，就能快速记忆能力，一首古诗能顺背能倒背，2个小时就能完一学期的单词，6小时锻炼出10倍记忆力。我觉得特别动心，不知道靠谱不靠谱，能不能送孩子去？”


    记忆术对手帮助记忆某些信息有一定作用，但是对学习和工作的功效是有限的，不要把它神化。如果有人告诉你，有个办法可以让你快速致富，你肯定会警惕，会不会是传销。现在，有人告诉你有个超级记忆术，可以让你几天就变成学霸，你信吗？


    # | 理解力才是更重要的学习力


    我看到太多乌七八糟的记忆训练班，不但把记忆术的作用夸得天花乱坠，还往往扯上右脑潜能开发。他们说右脑记忆是左脑的一百万倍，我们平时教育用的是左脑的逻辑思维，而对右脑的图像思维开发却很少，使用记忆术，就能开发右脑图像思维。


