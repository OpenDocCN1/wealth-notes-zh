  md: '# 语言脑｜孩子学外语，多大最合适？


    语言脑｜孩子学外语，多大...


    # 孩子学外语，多大最合适，怎样最有效？


    Dr.魏


    学习外语的重要性，大家都知道。但是如何学习外语，这里有很多学问。经常就会有家长问我：“Dr.魏，什么时候才能让孩子学外语啊？太早让孩子学外语，会不会让他混淆两种语言，最后中文说不好，外语也学不好？”


    还有的家长，让孩子学外语的方法，就是直接送去外语班，甚至让孩子学习什么记忆术，疯狂背单词。这个，真的让我为孩子感到痛心，语言学习怎么能靠强行记忆和背单词呢？


    “晚”一点不如“早”一点，“背”出来不如“玩”出来


    关于孩子的语言学习，我特意询问了爱贝睿的家长教练，来自香港教育大学的发展心理学家，王贞琳博士，她给予了我许多专业建议，同时，在去年年底的爱贝睿睿明养育大会中，也对此进行了专业的分享。所以今天，我想来正本清源两个事情：孩子学外语，“晚”一点不如“早”一点，“背”出来不如“玩”出来。


    《Dr.魏的家庭教育宝典》查询结果 语言的网状表征区、神经可塑性、浸入式学习


    +   1. “晚”一点不如“早”一点


    为什么我说学外语“晚”一点不如“早”一点呢？因为孩子在小时候学习语言的能力最强。你想象，你小时候上过“中文兴趣班”吗？背过中文单词吗？但你最后中文不是说得一样流利吗？孩子只要生活在一个自然健康的环境中，日常有亲人的陪伴，跟他说话、互动，就能自然而然、毫不费力地学会语言。


    （1）语言的习得，要从生活中自然地学语言


    这叫语言的习得，就是从生活中自然地学语言。孩子能够习得的语言，可不只有母语，他们能够同时学会两种甚至更多的语言。你可能会担心，孩子太早学外语，会不会打乱他的中文学习？我説，不会。


    因为你家宝宝学的不仅仅是语言，而是包括语言在内的一整套与环境互动的方式。换句话说，他很自然地就能明白，该在什么样的情境下使用什么语言。如果你在家里爷爷奶奶、外公外婆说的是方言的话，你大概也早就发现了，你家宝宝很自然地会对老人说方言，但是
    '''' 抬头看见你来了，立刻就转换成普通话。


    （2）外语可以早学，不存在不同语言之间相互干扰的问题


    中英文的区别也是一样的。我曾经带女儿去外国朋友家玩，她跟外国小朋友就说英语，虽然她会说的不多，但是也会用她有限的那些词汇说：“car, car, I want
    car”，就是说想要玩那个汽车玩具，两个人用英语交流，玩得很不起乐乎。后来到吃饭的点了，我对他们用英语说：“Let’s go eat。”就是说我们去吃饭吧，结果她立刻用中文对我说：“爸
    爸，我还要再玩一会儿。”


    所以你看，孩子在中文和英文之间切换非常快，他们才不会混淆呢。你尽可以放心，外语可以早学习，不存在不同语言之间相互干扰的问题。


    这在脑科学上也有证据，比如说如果小孩子从小同时学习双语的话，两种语言在他大脑里的表征区是网状交织在一起的，像马赛克一样。但假如像我们，成年后才学习第二外语的，中文科和外语的表征区就是分开的，泾渭分明，是有清晰的边界的两块。


    比如经常不用英文。我如果离开美国很久了，我中文和英文的语言边缘就开始模糊了，中文表征区就会侵蚀英文表征区，那表现在外面，就是我的英语能力退化了。


    可如果是一个从小学英语的双语宝宝，他英语表征区恰恰跟中文，在大脑层面上来说，是混在一起的，两种语言可以在区域中间来回自如地跳转，互相不会干扰，那英语当然也学得更牢了。所以第二外语尽早学习，家长不必担心不同语言相互干扰的问题。


    （3）越早说外语，外语越地道


    越早学习外语，小孩的外语越地道，口音也会标准些。我在前几期节目里讲过的“神经可塑性”的概念，对语言的学习而言，就是说宝宝语言的习得是被她的环境所塑造的，环境每天都给了她大量语言类刺激，她大脑的语言中枢被这些刺激所塑造。


    全世界各个地方的小孩，在很小的时候，都可以分辨出各种口音的细微差别，但是如果她接受的语言刺激单一的话，比如只有中文的话，长大以后她就可能不能很好地分清楚外语中的一些细微的发音的差别。很多研究表明两岁之后的孩子会慢慢丧失辨别母语里没有的那些音的能力。


    举一个熟悉的例子，我是湖南人，大家都嘲笑湖南人Ne和Le分不清楚，就是“湖南”和“弗兰”是分不清楚，这就是因为我们从小听的湖南话里就没有Ne和Le这个区别。但是，如果尽早刺激孩子对Ne和Le的辨识能力，湖南孩子也能毫不费力的区分开来。


    好，现在你就知道了，为什么学习语言要趁早：第一是越早学不同语言越不容易相互干扰，第二是越早学习语言的神经可塑性越强。


    +   2. “背”出来不如“玩”出来


    （1）利用浸入式学习法


    你不需要等孩子掌握了母语后才开始学外语，而是越早让孩子暴露在双语环境里越好，这叫浸入式学习，就是让孩子泡到外语环境的坨子里，像学母语一样自然而然地吸收外语。这就比长大以后再用背单词、记语法的方法有效得多。


    这也是我来强调的第二点，就是外语学习“背”出来不如“玩”出来。这里的“玩”指的是家长和宝宝之间丰富的互动，玩出来的外语能力就是在生活中来学外语，在面对面交流中，孩子不仅仅是记住一个个单词，而且能自然地掌握大量其他的信息，比如这个单词的用法，以及用这个单词的语境是什么。


    有科学家研究就发现，婴儿学习语言最有效的方式就是真人面对面地交流。同样的话，用录像放出来，婴儿起来的效果就没那么好。所以，让孩子学英语的最好方法，不是让孩子一个人背单词，或者给他放英语儿歌，看英语动画片，而是你要多和孩子用英语聊天、游戏。在这些孩子熟悉的场景里，他更容易理解物体的意义，也就更容易习得语言。


    ![](img/8dd4b172abeef48fa291369820efe392_17_0.png)


    （2）“玩”着学外语，互动很重要


    那你该怎么跟孩子“玩”着学外语呢？这个“玩”的关键，其实就是你跟他的互动。来看看我是怎样教女儿学会草莓“strawberry”这个词的。


    很简单，就是我拿着草莓给她吃的时候，会指着草莓对她说：“eat a strawberry”，意思是“吃个草莓”。哎，你是不是觉得这个情景看起来特别简单啊？但是，这里面的信息量是非常非常丰富的。我用手指着草莓，孩子就明白“strawberry”''是我现在指着的这个东西，她的注意力被手指引导过来了，开始集中精神观察眼前的这个物体；然后我会做出咬一口的动作，边说“eat
    a strawberry”表示我要吃这只草莓，而且她已经掌握eat这个词了，所以知道是eat是“吃”的意思；我咬草莓的时候还笑咪咪看着她，这是一个表示鼓励的表情。


    这时候她就能猜出，这个红彤形、香喷喷的圆果子叫做strawberry；而且通过观察我的动作表情，她知道strawberry这种东西是可以吃的，eat是动词“吃”的意思；她还会学会理解我深层的意图，多吃strawberry爸爸会开心，爸爸鼓励我吃strawberry。


    为什么这一系列互动对语言学习这么重要呢？因为人和人面对面交流的时候，信息'
