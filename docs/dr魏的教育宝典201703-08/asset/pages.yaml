  md: '# 复盘 | 阶段自测与总结（二）


    Dr.魏


    我会陆续在专栏中帮你做第一阶段自测与复盘，希望新读者有的放矢，老读者温故知新。上周的智力部分自测你答对几道？


    记得针对答错的部分及时复习，更要在实践中查漏补缺（错过上期测试的朋友，可在本期文末推荐阅读中补课）。


    本期内容，我们将针对“培养孩子情绪”的部分，进行复盘总结。


    同学们先从自测开始，欢迎答题（不要翻答案）


    # ★ Q1.爸爸带5岁的小雨在西餐厅吃饭，稍没留神，小雨离开餐桌跑去玩，不小心撞到服务员，服务员手中的餐食洒了一地。小雨知道自己闯了祸，不停地大哭起来，如果你是小雨爸爸，你会__？


    +   A.暴力镇压，“你再不听话，我揍你了啊”

    B.跟工作人员道歉后，直接带小雨离开餐厅

    C.当场跟他摆事实、讲道理，“餐厅是供大家就餐的，不是玩耍要乱跑的，你这样会影响到身边吃饭的人。如果呀专心吃饭，同样不想被别人打扰，对不对？而且乱跑会给工作人员带来麻烦，下次不许这样了，否则爸爸会惩罚你，再也不带你吃饭了。”


    # │ 解析：对于这种公共场合的“熊”孩子，到底应该怎么做


    选项A，指责或打骂孩子，不能真正让孩子意识到规则的意义，是错误的方式。


    选项C，当场跟孩子长篇大论讲道理，他根本听不进去，因为这时他只会觉得尴尬，甚至惊恐，导致接下来的场面会继续失控，因此C是错的。


    选项B是正确的做法，如果场面已经很尴尬了，最好带着孩子离开，留在现场，会增加冲突。原地惩罚孩子，他会加重哭闹，家长更心烦生气。教育孩子，要找个安静的角落，心平气和再沟通。


    # │ 知识点回顾


    +   1.提前设定好期望值，并提醒他的行为

    2.在公共场合不要修正行为，直接离开

    3.早培养，从点滴基础做起


    # │ 推荐阅读


    《坚持这三步，搞定发脾气的娃》

    《三招搞定公共场合的“熊”孩子》


    # ★ Q2.暧暧跟着妈妈去朋友家串门，朋友见暧暧长得很乖巧，忍不住搭话：“小朋友，你叫什么名字呀？”暧暧看着妈妈，又看看朋友，沉默了几秒，躲在妈妈身后不说话。如果你是暧暧妈妈，你会__？


    +   A.帮女儿做示范，并直接告诉朋友：“她叫暧暧”

    B.跟朋友道歉，然后说：“阿姨问你话，你怎么不回答呀，忘了妈妈怎么教你的吗？抱歉，她比较害羞，她叫暧暧，5岁了”

    C.先耐心等孩子一会，如果暧暧还不说

    话，再蹲下身来引导她


    # │ 解析：害羞是特质，不是缺点，小孩子有陌生人焦虑是正常的


    选项A和B是错的，选项A属于把孩子从“后台”推到“前台”，是典型的拔苗助长。


    选项B中的回答，家长介入过多，孩子自然没机会说话，轻易给孩子贴上“害羞”的标签，这是过度干预的典型表现。引导孩子多说话，要耐心给他时间，因此选项C正确。


    # │ 知识点回顾


    +   1.害羞是一个特质，不是缺点，小孩子都会有陌生人焦虑，这是因为他的大脑还没有发育成熟，是心理发展的正常过程。

    2.父母需要注意三个误区：第一，做孩子的代言人；第二，轻率地给孩子贴标签；第三，过度保护。


    # ★ Q3.小明、小雨和婷婷在小区楼下的公园玩耍，公园有滑梯，小朋友们都会排队玩。这时，三个孩子同时来到滑梯入口，你看看我，我看看你，都想先玩。这三位小朋友的家长用了不同的处理方法，你觉得谁的处理方法对孩子更好？


    +   A.小明妈妈跑过去，跟小明说：“小明，你比小雨和婷婷大一点，你让让她们，你最后玩吧”

    B.小雨妈妈走过去，跟小朋友们说“你们谁先到的呀？哦，同时到的，那你们刚才谁先滑的？那这次就让另一个先滑吧”

    C.婷婷妈妈并没有过去，她选择让孩子自己处理整件事情


    # │ 解析：有些家长养娃轻松些，有些却更累？也许是过度保护在作怪


