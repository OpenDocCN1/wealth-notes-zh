    # 今日问题：听故事、读故事、讲故事，哪种效果好？


    Dr.魏


    上期节目我强调了故事对小朋友的好处，我说了大脑天生爱故事，故事对孩子的记忆、情绪、思维能力都大有帮助。具体到实际操作，我们一般有三种方法来利用故事：第一是让孩子听故事；第二是跟着故事书读故事；第三，鼓励孩子自己讲故事。


    听故事、读故事、讲故事，这三种方法一起用，效果最好。


    # 听故事、读故事、讲故事，齐头并进


    这三种方法各有各的好处。美国东田纳西州立大学曾经做过一项研究，给两组3至5岁的宝宝听故事，一组宝宝听大人给他们说故事，叫storytelling；另一组宝宝也听一样的故事，不过是大人拿着书照着内容读，叫reading。


    最后，研究人员让两组宝宝把故事复述一遍，看看哪组宝宝表现得更好。结果发现，听大人讲故事的这组宝宝，对故事的理解力更强，可是听大人读故事的这组宝宝，表现出更高的语言复杂度，他们能够运用更高级的词汇和手法，来描述这个故事。


    对识字不多的宝宝，多给他讲故事，让他对故事内容产生兴趣。孩子识字多了，可以开始照着故事书给他读故事，锻炼他的语言复杂性。


    # ——宝典查询结果——


    # 如何鼓励孩子讲故事？


    # 第一，邀请孩子给故事添加细节


    # 第二，利用线索帮孩子把思路拎回主线'
