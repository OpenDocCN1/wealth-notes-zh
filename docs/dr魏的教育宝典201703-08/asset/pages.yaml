    # 5.来自智力脑｜有没有婴儿专属的“博物馆”浏览方式


    逛博物馆不是为了学知识，而是为了让孩子对其他领域感兴趣，以及启发孩子的思维。又一次刷新自己的观点。那么，有必要带婴儿去逛博物馆吗？


    很多人可能会认为婴儿太小，看了也不懂，但我不这样认为，我觉得婴儿还是懂的，我带5个月的女儿出门，她对外的车水马龙就会东看看西看看，脑袋转得特别快。想请教一下叨叨魏，有没有婴儿专属浏览方式？


    Dr.魏


    孩子5个月，正处于学习协调各种感官能力的时期，比如视觉、听觉和触觉。这个时期可以带着孩子参加一些户外的活动，比如动物园、公园甚至是博物馆，不是为了真的让孩子看懂什么东西，而是激发孩子对新鲜事物的兴趣。宝宝在博物馆，看到那么多新鲜事物很兴奋，其实她是在学习适应未来生活中的各种变化。


    带小小孩去博物馆确实有需要特别注意的地方，5个月以上的宝宝慢慢发展出各种活动能力，比如精细运动能力，意味着过去她只能看，现在她可以用手摆弄，仔细研究了。如果你是带家里的宝宝，注意带他们去那种能够动手操作，参与的展览。有一些专门针对小孩的展览，互动性很强，有能够让孩子触摸，甚至动手操作的装置，这是符合孩子认知发展特点的，推荐你带孩子去这一类的博物馆。


    分享另外一位我们精选留言的老熟人，聪明家长@王子墨的3点博物馆带孩攻略，引用一句让我觉得有共鸣的话：“我们应该让孩子觉得参观博物馆是一件放松、愉悦的事情，而不是通关游戏般的完成任务。”


    @王子墨带孩子看展览，不是将孩子带到博物馆就可以了，这一体验需要我们更多的准备及合理的引导及安排。


    # 1.预习。这里的预习，是说简单了解要去的博物馆及展品类别。方法很简单，前往之前登录一下博物馆的官方网站，花10分钟来浏览，不仅可以了解最基本的开放时间及票务情况，有时可以惊喜地了解到某个特别活动会进行，临时展览的情况，及博物馆的珍藏品推荐，博物馆内是否有餐饮休息处等等信息。对此信息的了解，可以让你更合理地安排参观时间。


    # 2.了解孩子不同的年龄阶段对事物的感知方法是不相同的。按照自然生长规律，每个年龄阶段的孩子都有自己不同的发展及兴趣点。那么对馆藏的感触也是不一样的，孩子们在不同年龄阶段，在同一作品前，他们所感兴趣的内容可能完全不同，所看到的内容也会有所不同。


    去博物馆的目的对于孩子来讲，打开他的认知大门，比如：艺术是没有标准答案的，我经常和朋友探讨，如果一幅画有苹果的画，让我看到的只是一个苹果，那这个作品可能真的没让我感动，让我觉得无趣。


    而如果这幅画让我看到的不只是一个苹果，还可以去幻想这个苹果的味道、长出这个苹果的果树、摘下苹果的那个 人、苹果上还带有的阳光的气息、咬下一口的水分等。这是一种更立体、更多元化的体验。所以不同年龄段的孩子，因所感兴趣点不同，会将作品中的不同点作为他们跟作品的共鸣点。家长要能够按照孩子的年龄更好地去引导。


    # 3.学会放弃。带孩子参观时，我们要轻装上阵，合理参观。很多时候我们进到一个博物馆，就有一种强烈的使命感，就是想要把整个博物馆都看遍，或是要把所有的珍品都看完，觉得不然就不值这门票，或是觉得来一次没看到哪件珍品就太过于遗憾。之前我带孩子去故宫的时候，经常看到一些游客，急匆匆地看着导览图，跑到一个厅，拍了张照片，继续赶路，估计珍品是都拍到了，但是没有一件被他欣赏了。


    不欣赏也罢，但是带着孩子可千万不要这样做！我们应该让孩子觉得参观博物馆是一件放松、愉悦的事情，而不是通关游戏般的完成任务。参观中最好不要带过多的随身物品，大型博物馆一般都设有存衣处。看展览很累人，走走停停，还要阅读及欣赏，我建议带孩子参观展览，最好不要超过两个小时，如果你和孩子都希望在博物馆里度过更长的时间，可以先去咖啡处休息一下，给眼睛和大脑都换一下篇章，然后可以再继续看一点。


    总之，一味地去追求珍品是意义不大的，因为大部分时候，我们根本不知道它为什么是件珍品。在一次参观中，也许一件不起眼的作品抓住了孩子的心，那为什么不留下多享受一下呢？任何的学习，都有其“准备阶段”。


    学习的表现形式有多种多样，但它的准备阶段，却有着一些共同特点：悉心观察，放飞孩子；强烈好奇，让孩子能扎进去沉浸探索，并看似顺便的“触类旁通”。人类社会发展至今，看起来已经满满当当，生活里啥都不缺。但如果你有好奇的心灵，一定会发现，还有许许多多的留白，等着我们呢。这是明天准备带孩子去科技馆，结合之前带孩子到各大博物馆的一些体验。谢谢Dr.魏恰逢其时的分享，明天正好派上用场。


    # 博物馆攻略


    1个观点：学习的表现形式多种多样，但它的准备阶段，却存在共同特点。

    第一，悉心观察；第二，强烈好奇。

    分享来自一位聪眀家长的博物馆攻略。


    特效药：


    +   1. 预习：浏览博物馆官网，合理安排时间

    2. 抓住不同年龄段孩子的事物感知方法

    3. 学会放弃，不要草草把每个展品都看完


    Dr.魏的家庭教育宝典'
