    这是个比较难的问题，我从优秀留言中，选出了 @Liu 成为咱们第6期的金牌家长。


    @Liu 分享了他们家宝宝在国外托儿所里学到的理念，其实也是我上期文章说的：如果孩子不先学会“什么是我的”，她领会不到什么是真正的“分享”。@Liu 说尊重孩子的物权意识，从学会询问开始，也就是用孩子的东西之前，先问她“我可以吗？”
