    语言脑 | 童话故事怎么挑？


    # 今日问题：该不该让孩子在童话故事里长大？


    Dr.魏


    上周我在隔壁薛兆丰老师的经济学专栏里，看到很有意思的一个问题：到底该不该让孩子在童话故事里长大？我来说说自己的看法：


    现在这个时代，知识爆炸，你可能也会经常一想到孩子的未来，就心里一阵阵地焦虑：要学的东酉太多了，英语、数学、科学、编程，肯定得学，钢琴、美术、舞蹈或者足球，也一定得练，其他的东西呢，就放一放吧。


    # 大脑天生爱故事


    很多人喜欢读书，但主要是读非虚构类书，因为觉得那才是浓缩的智慧，人生的道理在里面讲得一清二楚。哪象虚构的小说，或者故事性的人物传记、历史记载，看了半天，道理还得自己来悟，太没有效率了。有些家长觉得应该尽量减少给孩子讲童话故事，让他们早点接触真实的世界。


