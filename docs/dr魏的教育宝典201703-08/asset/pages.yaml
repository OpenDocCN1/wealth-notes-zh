  md: '# 智力脑｜利用这三招让孩子集中注意力


    智力脑｜利用这三招让孩…


    # 孩子注意力不集中，怎么办？


    Dr.魏

    经常有家长来问我：“Dr.魏，我家孩子注意力老是不集中，在幼儿园里不好好听课，在教室里走来走去，被老师批评好多次了。孩子在家里也是，不要说让他看书、读绘本、写作业，就是玩玩具，也经常是玩一会儿就去一边了，他是不是有多动症啊？"

    孩子注意力不集中是正常现象，需要家长多多引导。


    # 孩子注意力不集中，是正常现象


    不要焦虑，更不要急着怀疑孩子有毛病。孩子注意力不集中是正常现象。你想想，假设有这么一个三四岁的孩子，在教室里一坐就是一小时都不动弹，回家做作业，一口气做了半小时都不开小差，那你是应该放心开心呢，还是该担心他有什么和其年龄不匹配的毛病呢？


    为什么孩子注意力差？这还是跟孩子大脑发育的规律有关。大脑中间到底哪些区域在管注意力呢？主要是大脑的额叶区和一些相关脑区，比如顶叶、小脑。额叶区就是我们头后面那个脑区，它管的事情非常多，包括执行控制和冲动抑制等等。


    《Dr.魏家庭教育宝典》查询结果

    辛记2个标准和3个建议


    # 1.你要少干拢孩子


    我经常看见有些家长，对孩子过度关注，恨不得每时每刻都要指导孩子，你要这么做，你要那么做。比如说，孩子在纸上随便画画，你坐在旁边，一边看着一边着急，“哎呀，这个太阳画得也太不圆了，都扁了，你要注意圆的长宽跟宽度要一样长！”“你这个草地怎么没涂色呢？你注意这草地是什么颜色吧？”你看这样的家长，虽然他口口声声要孩子注意这个注意那个，其实孩子自己在集中注意力，他倒在旁边各种干预，其实是破坏了孩子的注意。


    # 2.在你需要孩子专注完成一件事情的时候，提供给他们做这件事情的一个合适的环境。


    这是因为，孩子的注意力容易受到内源性刺激和外源性刺激影响，孩子对外源性刺激，比如说环境的刺激，这方面抑制能力很糟糕。所以想要孩子集中注意力，我们可以用物理的方法，给孩子营造一个没有这么多刺激的微环境。其实很简单，就是你把他的房间收拾好。比如事先问孩子有没有什么想玩的，那就只留下这个玩具，其他玩具都要么拿出去，要么收拾在橱柜里。这样他没有那么多新鲜刺激，就自然能集中注意力只玩这个了。如果他房间里到处都是好玩的，到处都是吸引他注意力的东西，那他其实就跟走进了大观园一样，注意力当然就到处漂移了。


    # 3.给孩子树立一个专注的榜样


    Dr.魏的小“叮叮”

    这也是我一直倡导的理念，就是育儿育己。你通过教养孩子，自己也变得越来越专注了，那不是一举两得吗？所以，下次你要孩子做作业的时候，就别玩手机了，拿一本书在他旁边坐下来，聚精会神地看书吧。


    +   1. 如果你的孩子看起来不像成人一样，注意力那么集中，没关系，孩子大脑发育需要一个过程。\n2. 怎么培养孩子的注意力呢？我给了三个方法专门对付注意力集中问题，第一，少干拢孩子；第二，排除孩子环境里的干拢因素；第三，你自己要做一个好榜样，也要做一个专注的人。\n3.
    孩子的注意力容易受到内源性刺激和外源性刺激影响，这三个方法都是减少外源性刺激，来防止注意力被干拢的例子。你要让孩子真正的专注，还得靠他由内而外地去改变他的注意模式。


    Dr.魏

    今日行动关键词「反思、实践」

    今天讲的这三点注意力提升的方法，更多的是需要家长控制自己的行为，给孩子创造一个无干扰的环境。\n听完节目后，你可以反思下，自己和家人在日常生活中有没有打扰过孩子？\n那么，今天你可以尝试一下，下班归家后不在孩子面前刷微博、看视频。也可是看看留言中别人家的烦都有哪些，给自己提个醒。最后，记得及时收听下期，也就是本周三的更新，我会着重讲如何指导孩子自发的去专注。周三见。


