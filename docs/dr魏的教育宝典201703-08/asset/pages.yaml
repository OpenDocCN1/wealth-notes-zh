  md: '的，并不是说：“哦，这都是有用的知识啊，你要掌握全面的动物知识。”


    每隔一段时间，我都会带我女儿去书店去买书，这时候我一般都要征询她自己的意见，看看她自己想读什么样的书。因为请你记住，在孩子小的时候，最重要的不是他从书里面直接学到多少东西，而是他对书产生兴趣。那么，当他自己有兴趣的时候，你就一定要注意保护和尊重。


    # 3. 把阅读变成游戏


    孩子对阅读怎样才最容易产生兴趣呢？除了书本身好玩之外，你还可以利用读书这个场景，跟孩子玩游戏。这就是我今天要讲的第三点。比如说，刚才我提到动物绘本，第一页里有各种动物的图画，我先一眼看到里面有大熊猫，然后就跟女儿说：“哇，你看，世界上这么多动物！来，我们来比赛，看谁先找到大熊猫！”然后我装作到处找不到，结果她一会儿就找到了，一下子指给我看，欢呼雀跃地说：“我赢了！”这个不仅能让她乐上一会儿，而且还让她对书里的内容更感兴趣，比如有时候她就会说：“那我们就先来看大熊猫吧。”


    包括书里的故事，我也跟她玩猜情节的游戏，比如说：“哇，大灰狼把第二只小猪的房子也推倒了，我们来猜猜看，这两只小猪该怎么办呢？看谁猜得对。”我女儿会猜：“它们会跑到第三只小猪那里去！”我说：“嗯，我猜它们会投降，跑出来说：狼大爷，你太厉害了，我们就给你吃了吧。”女儿听了哈哈大笑，我翻过书来一看，就装作惊奇的样子说：“啊，你猜得对，它们果然是跑到第三只小猪那里去了，你猜对了！”这时候我女儿就特别高兴。这样一来，她就会觉得，自己理解故事的能力还挺强的，以后就会更喜欢读书了。


    Dr. 魏的小“叮叮”


    这就是关于互动阅读的三个方法，主要是激发孩子的兴趣。最后，我还是要再叮叮一下前面说过的，在孩子小的时候，最重要的是让孩子对阅读产生兴趣，而不是从阅读中立刻就能学到多少知识。互动式阅读为什么好？就是因为它把阅读嵌入到宝宝跟父母的日常互动里去了。


    你应该让孩子觉得，阅读是日常生活的一部分，而且是比较好玩的一部分，而不能把阅读当成是个特殊的任务。比如你跟他说：“来，宝宝读完这本书，给你奖励一个冰淇淋！”那他就会想：“看来读书是个苦差事，妈妈都得用冰淇淋来补偿我了。”


    同样的，如果孩子自己正玩得高兴，比如叠纸飞机，你不要觉得那个技术含量低，就去打断他说，“玩那个东西有什么意思！宝宝，来跟妈妈读书吧！”这个也会让他觉得，读书是个很严肃、正经的事情，跟叠飞机这种好玩的事情是对立的。


    总之，就是不要有太功利的目标。因为我是个享受阅读的人，我自己知道，阅读其实是一件非常美好的事情。我和孩子一起念书，更看重的是跟她的情感互动，是和她一起度过的美好时光。我相信，这样的情感互动和美好时光，也让她会慢慢地觉得，阅读是件很有意思的事情，让他们知道书里面有很多好玩的东西，有好多问题的答案。


    至于学知识和认字，如果以后她自己喜欢上阅读了，你还用发愁吗？对我家女儿来说，爸爸给她读书，应该是她最享受的事情了，每天都缠着我给她读。别看她才6岁，但是她已经认识了很多汉字，可以自己读一些复杂点的书籍了。我可以很骄傲地说，在阅读上，我为她打下很好的基础，这些的背后，就是这几年我和她一起度过的互动阅读所有的快乐时光。


    +   1. 阅读最好的方法是互动阅读。


    +   2. 教你三个技巧：第一，问孩子问题，第二，跟着孩子的兴趣走，第三，把阅读变成游戏，不仅能让孩子喜欢上阅读，而且能提高他的智商。


