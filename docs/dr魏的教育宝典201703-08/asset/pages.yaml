    最后我也要叮叮一下，不要忘记表扬你的孩子。在这个年龄段，很难让孩子们理解分享的概念，所以我们要特别用表扬来加强分享这个行为。但是，表扬是有技巧的。


    有一项研究，研究人员让孩子接受不同类型的表扬。对于一组孩子，他们只是表扬分享的行为：“你把你们的一些弹珠给那些可怜的孩子，这是一件很好的有益的事情。”对于另外一组孩子，他们赞扬了孩子行动背后的品质：“我就知道你是那种喜欢帮助别人的的人。你真是一个非常好的人。”


    研究者发现，几个星期后，当孩子面对更多的机会去给予和分享时，性格被表扬的孩子比行动被表扬的孩子，分享得更多。因为表扬他们的性格，会让他们把分享内化成性格的一部分，孩子想的是：我是一个好人。


    在这里你是不是想起我之前说过的，对于孩子学习，不表扬聪明，而表扬努力；反过来，对于孩子一些道德品质，不表扬行为，而是表扬品质。


    # 今日得到


    +   1. 分享是一种利人又利己的行为，而不是毫无利己专门利人，善于分享的人知道怎么在获利和付出之间保持平衡。 2. 正确地引导孩子分享，要学习理解他人的情绪，培养物权意识。
    3. 如果孩子不愿意，不要强迫，保护孩子说不的权利。 4. 如果孩子愿意分享，及时表扬他们。记住，表扬的时候，多夸他们的品质。


