    Dr.魏


    # 带孩子出去玩没用？


    这两个月放暑假，我感觉自己比平时更忙。孩子不上幼儿园，我有空就带她到处逛逛。我们去郊外公园，去看了国家自传体记忆博物馆的展览，还回我的老家小住几天。


    有朋友开玩笑地建议我：别带着孩子出去了，就在家吃吃玩玩吧，去哪儿都没用。我问他为什么。他说：带孩子去了一趟白山，回来问孩子记住什么了，孩子说什么是都记不得。


    其实这还真不怪孩子，是爸爸妈妈不会聊天。今天我来讲讲，如何跟孩子聊天，带孩子出门游玩之后记得牢，收获多。


    # 三四岁的孩子，就“记事儿”了


    孩子记事，一般是说孩子能回忆个人信息或个人所经历的生活事记，这叫自传体记忆。有研究者提出，自传体记忆在3-4岁左右开始发展。孩子一开始记住的事情，都比较具体，他们可能会说“那天我穿着红色裙子去的公园”。你回忆一下，自己最早的记忆在什么时候？平均也差不多是三四岁。


    # 1.趁着新鲜跟孩子聊天


    跟孩子讨论过去发生的事，时机很重要。最好是一个事件发生之后没多久，比如旅游当天的晚上，出去玩完回家的路上，回忆越新鲜，孩子记得越多。为什么我要强调出去玩之后聊，是因为发展自传体记忆应该尽量以新奇的事件为主题，而不是日常总是重复的事。


    # 2.问题要具体


    多问一些“W”问题，就是英语里以字母W开头的词：Who、What、Where、When、Why等。问问孩子都有哪些人，有什么东西，在哪里，在什么时间，发生了什么事，以及为什么会发生这件事。如果孩子记不清楚，你可以提示一下——前提是你跟孩子有共同的经历，你们是一起出去玩的。


