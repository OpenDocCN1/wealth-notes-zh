  md: '# 运动脑｜如何培养孩子的运动能力？


    运动脑｜如何培养孩子的运...


    # 不当运动员，就不用注意运动能力的培养？


    Dr.魏


    我在《四肢发达，头脑就简单吗》那期节目里曾开玩笑说，“我是教科书的体育老师”。我这个体育老师，还有个职业病，就是特别喜欢跟其他家长叨运动的重要性。


    但是很多家长就会跟我说：“我们家孩子将来又不打算做运动员，跑跑跳跳孩子又不是不会，难道还要练吗？钢琴、围棋，这些才真正重要啊。”实在被我叨烦了的，就会来一句：“哎呀，我也知道运动的重要性，明年我就是给孩子报个足球班！”


    这种想法还是有些功利的，运动能力不仅仅是指体育运动，比如游泳有多快、足球会不会过人，也是指人身体所解释的任何移动。小到抓一个东西，大到翻身、走路、跑跑跳跳，这些控制身体的运动能力，对儿童也是极为重要的。


    # 什么是粗大运动？


    运动能力，其实和认知能力息息相关。因为人运动的时候，所需要激活的脑区，在很大程度上，和进行认知活动的脑区是重合的，所以从小孩子的运动能力，就可以预测到他将来的认知能力。我今天主要来来说说粗大运动，指的是要用对手臂、脚或整个身体等大肌肉群的运动。


    # 粗大运动能让大脑高速运转，对认知能力影响大


    粗大运动有很多好处，其中一项是它涉及的运动量较大，所以它能增加孩子的心肺功能，给大脑提供更多的血液和氧气，使大脑运转起来更高效，孩子的体力和精神也会更充沛。


    在2016年6月份，英国埃克塞特大学发布了一份报告，总结了这方面的很多研究，指出体育运动能提升大脑能力和学习成绩。他们认为，用来做运动的时间，绝对不是浪费，哪怕就是从成绩的角度来说，也是值得的。


    粗大运动在小时候的一点小区别，在将来也会造成大影响。比如澳大利亚科廷技术大学的科学家，测量了从4个月到4岁大的小宝宝的运动能力，再看他们6年后进了小学的表现，就发现当初粗大运动能力比较强的小宝宝，后来的工作记忆，就是一种短期记忆，还有信息处理速度都更好。


    反过来，东苏兰大学在2013年的一项研究也发现，在小学入学的时候，那些运动能力比较差的孩子，在后面三年里，阅读和数学能力也比其他孩子更差。而且我还要强调一点的是，这个没有男孩和女孩的差异，无论男女，都是运动能力强的小宝宝将来有更好的认知能力。


    # ——▶ 宝典查询结果 ◀——


    我一直强调说，四肢发达，头脑更发达。下面我就分别依据0到4岁不同的年龄段，给你推荐一些方法，来锻炼你家宝宝的粗大运动能力。


    # 半岁前的宝宝：边玩边唱


    半岁前的孩子，主要是你主导孩子的运动，在帮孩子做运动的时候，有一个注意点，就是一定要记得同时给孩子哼哼儿歌、童谣。


    边跟孩子做运动，边唱歌，这样既发展了孩子的运动控制，又发展了他的节奏感。有研究表明，身体运动，特别是前庭觉的刺激，在孩子的音乐节奏感知中起着重要的作用。


    哼儿歌能刺激孩子大脑，所以下次跟孩子做动作的时候，记得拍手，拍打身体，哼唱儿歌，这些运动都可以提升婴儿大脑的协调性。


    你可以把宝宝放在妈妈的膝盖上或者球上，上下或者左右摇晃，一边做一边唱一些有节奏感的童谣，注意要支持宝宝的脆弱部位，婴儿的肌肉还很不发达。你还可以跟孩子做“升降机游戏”，就是紧握宝宝的腰部，慢慢举起到微微高过头部，随着抬高发出音调上扬的声音，然后随着音调下降，再慢慢把他放低。


    # 一岁以前：躺着睡、趴着玩


    不到一岁的宝宝，有个简单的原则，叫躺着睡、趴着玩。为什么呢？因为现在大部分家长都知道，小宝宝不能趴着睡，会有窒息的危险。


    在一岁之前，家长会让小宝宝躺着睡，这是对的。但是也带来了个副作用，就是他趴着的时候太少。所以，就没法练习一些粗大运动，比如抬头、爬行、用手撑起身体等等。你要让宝宝躺着睡，但是他醒着的时候，你可以把他翻过来，让他趴着玩。


    # 一岁到一岁半：推拉玩具


    宝宝在满周岁前后，正是学习走路的时候，可以玩推拉玩具，就是孩子可以把它拉过来、推过去的那种玩具。


    注意学步车不属于推拉玩具，不要用。


    不要用学步车，那个坏处大于好处。有的推拉玩具有比较牢固的手柄，可以让孩子平衡倚住，但主要不是为了让孩子靠着它走，而是在孩子已经能比较好的站着的时候，体验拉东西、推东西的感觉，锻炼他的平衡能力和手脚的肌肉。


    如果你孩子走路已经比较好了，还可以拖着一个推拉玩具，比如带轮子的狗狗小熊玩具，蹦蹦跳跳地去走路，他也会特别喜欢。


    ![](img/8dd4b172abeef48fa291369820efe392_75_0.png)


    # 一岁半以后：球类、跑跳


    宝宝到了一岁半以后，手臂一般就发展出了足够的协调能力，可以玩球了。你可以拿一个比较软，但是可以滚动的球，比如海绵球，从地上向他抛过去，让他抓住，再从地面把它滚着<|start|>回来。你也可以用弹性比较好的球，给宝宝示范一下，把球扔下去，球又弹起来了。你接住，再扔，然后让宝宝来尝试。


    这些，都能锻炼他的手眼协调和敏捷程度。这种游戏可以一直玩到宝宝3岁，尤其是等他到2岁以后，就不仅是用手，还可以用脚把球踢回来了。


    宝宝会走路后，就会尝试着跑和跳了。这个在我们成年人看来好像是水到渠成的事情，但是对于宝宝来说，其实没那么容易，所以，你也要帮助宝宝训练他的跑跳。


