  md: '一次规则，孩子更有可能去抑制他们的冲动，不拿盒子里的礼物。如果他们只是让孩子思考几秒钟，不给孩子任何提醒，就没有这样的效果。


    # Dr. 魏的小叩叩


    我今天介绍了帮助孩子提升自控力的方法，有些爸爸妈妈可能觉得，孩子还小，所以做什么事情都依着他们。


    2013年的一项针对学龄前儿童的研究发现，那些容易忽视孩子的不良行为，或者面对孩子的要求有求必应的父母，也叫宽容型的父母，他们的孩子自控力更容易出问题。


    还有很多研究发现，这种宽容教养下的孩子，长大后更容易出现社交方面的问题。这之间的原因很好猜测，如果从小就没人要求孩子控制自己的行为，他们长大也很难学会自我克制。


    不过，也有研究发现，如果父母过于权威，一味地要求孩子服从他们，孩子也会缺乏自律能力。可见，教养孩子中的度的把握，是值得我们父母去终身学习的。


    # 今日得到


    宝宝的理智脑还没发育完全，父母要承担起宝宝理智脑的功能。


    首先，在外部环境上降低冲动的诱发条件，注意，冲动是无法压制的，只能转移。第二，建立起规律的日常生活习惯，并且提前强调规则，比起具体物体，宝宝对抽象概念更有自控力。最后，宝宝的成长需要规则而不是纵容，不要怕叮叮，反复去提醒他们。


    # —— 第021期思考题 ——


    今天的思考题是，小贝一到商场，看到好玩的玩具就想要，哭闹着一定要买，你有什么妙招解决这个问题呢？期待你的答案。有效的自我控制还需要抑制控制和规划能力，这两种能力的发展对于3-7岁的孩子尤为重要，下期我会详细讲给你听。


    # 第20期金牌家长：朴涵


    上期的思考题是请你举一个运用记忆联结策略的例子，咱俩第20期的金牌家长我颁给@朴涵。这位宝妈说，她无意中对她们家15个月的宝宝，用过很多次联结策略。比如说针对“花”这个主题，帮宝宝建立一个立体的对于“花”的概念。


    在小区看花的时候，她会告诉宝宝花的名称；看见小蜜蜂，就把“蜜蜂取蜜”跟宝宝读过的绘本做联结；起风了就抱着宝宝，模仿花在风中摇摆的样子，顺便提醒孩子观察自然风的物理现象；最后，跟宝宝一起给花播种，告诉他种子和花的生物知识。


    有了这些多角度的联结，宝宝对花的理解当然更加深刻了。


