  md: '呢？因为人和人面对面交流的时候，信息的传递量最大。孩子不但学会一个词表层的含义，还能领会到更多深层的意义。


    比如这个例子里，除了英文，孩子还能学到草莓的质地、色泽、香味，以及名词strawberry和动词eat之间的区别，甚至还学会察言观色，读懂别人表情和表情下面隐藏的信息，这就远比你在纸上写一个strawberry
    或者给孩子看strawberry 的照片要丰富得多。这就是语言习得的一大优势，如果你只是让孩子背单词，怎么可能达到面对面交流那么丰富的信息量呢？


    你要知道，有的时候孩子外语学习出现困难，不是因为他真的语言能力不好，而是家长教错了方法。小孩的脑不擅长抽象学习，所以硬逼他从字面上去记忆，去背单词，是没有必要的。但是通过和孩子互动的这种“玩”的方式，就是具象的学习，这是符合孩子大脑生长规律的，那就算是面对大量信息，孩子一样能吸收得更快一点，记得更牢一点。


    所以我才要说，学外语，“背”出来不如“玩”出来。父母的陪伴和互动对孩子的语言习得很重要，既提高了孩子的学习兴趣，又帮孩子加深了语言理解力。


    # （ 3 ） “ 玩 ” 着 学 外 语 ， 切 记 要 辺 “ 玩 ” 辺 学


    “玩”着学语言还有一个特点，就是要在日常中边“玩”边学。因为最容易掌握的语言就是日常生活中大量重复的语言。我给一个在日常活动中“玩”外语的方法。


    比如宝宝刚开始学英语的时候，你可以利用那些反复出现的日常活动，如吃饭、上厕所、睡觉、起床，来跟宝宝说英语。孩子需要在大量重复的场景中习得语言规律，比如一样的意思，你换不同的描述、不同的语法反复说。这些活动本身就是孩子熟悉的，又是反复出现的，所以他很容易理解，也很容易就记住了。


    就比如说吃东西，这是孩子生活中的头等大事，除了刚才我举的例子，“let’s go eat”， “eat a strawberry”之外，我还会换着花样用其他说法跟女儿说，比如
    “Do you want to eat?” 这是问她，你要吃饭吗？ “It’s time to eat。” 到吃饭的时候了。包括还有反过来的否定用法，比如她从地上捡起个东西就往嘴里送，我就要赶紧拉住她的手说：“don’t
    eat this!” 不要吃这个！


    你看，这里有祈使句，有描述句，有疑问句，还有否定句，这么多不同的情况下，你反复用eat这个词，她很自然就会不但记住这个词，而且明白这个词的那些相关场景。这才是真正地习得一门语言，这门外语就跟孩子的生活融为一体了。


    所以，在日常活动中启蒙外语是我最推荐的方式。我相信你在日常生活中能找到大量重复的单词，比如天气、数字、孩子经常玩的游戏、喜欢的动物、卡通形象，用这些跟孩子接触得最多的、最感兴趣的日常词汇，变着花样教给孩子。


    Dr.魏的小“叮叮”


    最后，我在这里也是还要叮叮一下，孩子学外语，最重要的原则还是要以激发孩子学习兴趣为出发点。语言的习得，得靠潜移默化，要润物细无声地学，发展孩子对外语的爱好和信心。


    这里面特别要求我们家长多花精力陪孩子，孩子的语言学习，家长不能偷懒，不是把孩子扔到培训班，或者放到英语学习机面前就没事了，家长要注意在生活中，多陪孩子“玩”，多跟孩子用英语互动。


    注意，育儿就是育己，这样也锻炼了父母的语言和沟通能力。同时，你还能和他一起享受这段亲子共度的时间。培养孩子的双语能力还能通过亲子游戏和绘本等，这些精彩内容后面几期我会一一介绍给你。


    # 小结


    +   1. 孩子学外语不怕早，你不用担心学了英语，他中文就说不好了。学外语，“早”比“晚”好。当然，也不是像某些人说的，孩子过了两岁、三岁就学不好外语了，而是不管你的孩子多大，现在开始学外语就合适。


    +   2. 学的时候要注意，最重要是有真人互动，借助日常生活，把孩子的外语能力，轻轻松松地“玩”出来。


    今天我教你一些跟你家宝宝“玩”英语的方法，听完这一期节目以后，欢迎你在评论区给我留言，告诉我你家宝宝学语言的一些体验。我会选取其中最有代表性的一些问题来回答，帮助你解除疑虑。


    Dr.魏


    点击右下角的“请朋友读”，把本期文章分享给还没有意识到孩子学语言问题的朋友，给他们提个醒，学外语并不是要等到学校教育才开始，其实，早一点学更有效。


