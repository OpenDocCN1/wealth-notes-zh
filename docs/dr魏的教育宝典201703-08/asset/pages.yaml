  md: '# 读者问答｜如何让胆小的孩子更勇敢？


    Dr.魏


    4月2日是国际自闭症日，我在用户留言中看到有些孩子有自闭症倾向，或者是自闭症患者。那么借着今天的读者问答，给这样家庭的父母一些小建议。


    并且，这篇文章会作为试读放出来，不仅仅希望能帮助到你，也希望所有的订阅用户，能把这份建议传递给身边需要帮助的家庭和孩子。


    # 下周讲什么？今天给大家做预告。


    4.03（周一）：学外语，“晚”一点不如“早”一点？


    太早学外语会不会让孩子混淆两_SWITCH？导致中文说不好，外语也学不好？到底孩子多大大学外语最合适？我给你个建议，晚一点不如早一点。


    4.05（周三）：家长引导亲子游戏，边玩边学外语


    孩子学语言有天生优势，如果家长从小就能给孩子营造一个外语环境，语言学习事半功倍。那么怎样用玩的形式来学外语？下周三，听我给你助攻。


    # 1.来自智力脑｜关键词：提升低龄宝宝智力？从一个眼神做起


    Dr.魏，您好。收听您的课程很有收获。结合您讲的“数码产品”和“神经刺激”两节课，能否这样理解，我家宝宝目前2岁，虽然看不同的动画片也会刺激孩子脑神经，但是应该尽量避免孩子看数码产品。可以从，户外活动、玩沙子、玩水、看花草树木、旅游，去科技馆、博物馆来刺激他，对吗？


    Dr.魏


    孩子，特别是3岁以下的宝宝，主要是通过多感官来学习。这就是为什么越小的宝宝越喜欢动嘴和动手。


    数码产品的刺激大多是2D的，而真实世界是3D的。你带孩子去海边，和他玩水，你说凉凉的，孩子可以摸；你说水哗啦啦地响，孩子可以听；你说沙子软软的，孩子可以捏；你说沙子可以堆城堡，孩子可以做。而看电子产品，特别是3岁以下的孩子，往往单向地被输入。大人是轻松了，孩子的吸收却是有极限的。


    所以美国儿科学会建议，和孩子看视频节目，最好是跟他们一起看，并且讨论节目的内容。提升3岁以下宝宝的智力，你可以从一个眼神做起。八九个月大的宝宝看着你，你看着宝宝逗他笑。突然窗外传来一阵鸟叫声，你转过头去看，宝宝也侧过头去看，你和宝宝的眼神共同放在同一个东西上。


    这时候，你就可以帮助孩子给眼前的事物命名：这是小鸟，它在歌唱呢。孩子就把小鸟这个词和眼前的东西联系起来，提高了语言能力。日常生活中，你要抓住孩子正在关注的眼神，帮助他认识苹果、椅子、挖掘机，以及绘本上的恐龙。而这种眼神交流，也是孩子学习对话的重要基础，有助于提高孩子的社交能力。


    # 2.来自智力脑｜孩子从小玩到大，很难坐下来学习怎么办？


    我的孩子6岁了，在之前的教育理念里面，我一直不刻意地让她学一些书上的知识，想让她通过玩来学习，把一些知识渗透在玩的过程中，但是随着年龄的增长，我发现他做什么事好像都静不下心来。现在到了幼升小的阶段，他好像有点太贪玩了，有一些必须学的知识他总是坐不住来学，我是不是做错了？


    Dr.魏


    从原来的玩到现在需要坐下来学习，状态发生了变化，这可能是他不适应的原因。我们可以借鉴游戏来帮助孩子学习。


    通常游戏有三个要素：明确的目标（升级打boss），难度和能力匹配（努力一点点就可以过关），得到即时反馈（过关获得勋章）。你可以给孩子设定一个明确的目标，比如坐下来学10分钟，定好闹钟，闹钟响就起来；选择的材料不要太难，让孩子跳一跳就能够得着；学完之后，给孩子反馈，哪些做得好，哪里还需要改进。如何提高孩子的专注力，我会专门再讲。


    # 3.来自情绪脑｜孩子社交遭拒绝怎么办？


    叨叨魏老师，您好，听了您的课程觉得您说的很有道理，我平时就是对女儿不太强势，总 concord 鼓励她自己和人交流。我女儿4岁了，在公园玩沙时没有带玩具，我就鼓励她自己去问其他玩沙的家庭能否让她加入一起分享玩具来玩沙，她就做到了。但是经常会遇到一些情况，有的孩子不愿意一起玩，或者直接说难听的话，比如说我不想和你玩，我不喜欢你之类的话，你哪哪做得不对我不和你玩，这个时候我女儿表情上就会羞愤，您说遇到这种情况我该怎么做呢？


    Dr.魏


    鼓励孩子和别人交流，你已经做到了。学会如何应对被拒绝，是孩子社交生活中的下一课。我们不可能事事如意，被拒绝也是很正常的事情。而对于4岁多的孩子来说，他们还不懂什么叫“委婉”，说话比较直接。


    这里我给你两点建议。1.在事情发生时，观察女儿的反应。


    如果女儿还比较冷静，那么不妨再等等，看她是否能够自己应付；如果女儿情绪比较激动，那么先带她到旁边，安抚一下。还记得之前文章里提到的情绪调节三个步骤吗？描述情绪、分析情绪和反思情绪。现在女儿内心是什么情绪小人最激动？为什么？怎么办？


    在分析情绪时，你的主要工作是帮助孩子做翻译，翻译其他小朋友的话。比如，小朋友说，“我不想和你玩”，可能只是暂时不想跟女儿玩，因为玩得正开心，不想被干扰，那么就可以询问能否等一下再玩；小朋友说，“不喜欢你”，不是不喜欢女儿这个人，而是
    u 不喜欢她 的某些行为，那么就可以给她翻译出来。影响我们情绪的往往不是事件本身，而是我们对于事件的解读。接着，鼓励女儿去询问、验证你们的分析，在尝试中更新迭代社交能力。


    2.在家里的时候，你可以跟女儿进行情景模拟。在安全 的环境中，探索和学习各种应对被拒绝的方法。供你参考。


    # 4.来自情绪脑｜如何让胆小的孩子更勇敢？


    叨叨魏，我是个奶爸，我孩子有两岁半了，我发现他比较胆小，尤其是见到陌生人和在陌生环境里的时候，显得很胆小。我家买了一个滑梯，别的小朋友玩得很开心，但是他就是不敢玩，眼看着他快上滑梯了，最终还是放弃了，不知道这种情况正常吗？如何更好地培养，让他跨越这种胆小的心理呢？谢谢。


    Dr.魏


    买了滑梯邀请小朋友来家里玩，好办法！每个孩子的风险意识都不一样，有的胆比较大，有的谨守些、慢热些。你有一点做得很好，就是让其他小朋友来家里玩。一方面家里对孩子来说熟悉，更加有安全感；另一方面，孩子能够观察其他小朋友，降低自己的恐惧感。


    我再给你两点建议。1.关注孩子努力的过程，而非结果。这有助于培养孩子的成长心智，更加愿意面对挑战（我会在后面的文章里展开讲这个概念）。他快上滑梯了，这就是一种进步。发现这一点并及时分享给孩子，会让他更加有自信！你不妨进一步拆解孩子的进步：踏上了滑梯、走到了中间、坐在了最高处、尝试滑下来……这样，你每次都能够看到孩子的进步，而非对孩子不敢滑滑梯的担忧。


    2.给孩子一个“同伴”。比如他喜欢的玩具小车、毛绒小熊，他可以把滑梯当成山坡，让小车滑下来；或者帮助小熊滑滑梯。帮助孩子从关注自己害怕，变成关注如何帮助“同伴”玩，在这个过程中熟悉滑梯，降低对高处的恐惧。供你参考。


