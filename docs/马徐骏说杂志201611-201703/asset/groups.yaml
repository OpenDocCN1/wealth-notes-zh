    \n---\n\n# 中国电影的世界野心\n\n本文音频及文稿参考《时代周刊》2月6日刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_54_0.png)\n\
    \n## 知识清单\n\n### 中国电影内地市场的繁荣\n\n2015年，中国电影院平均每天新增22块电影银幕。同年，中国电影票房收入相比2014年增长将近50%。\n\
    \n刚刚结束的2017年春节档电影市场，1月27日到2月2日的7天时间里，国内票房约为33.7亿元，同比增长11.37%，观影人次约8828万人，同比增长了6.38%。在未来几年，中国很可能超越北美成为全球第一大电影票房市场。\n\
    \n### 中国是好莱坞电影的救星？\n\n美国国内的中产阶级消费在持续萎缩，与相比，中国中产阶级在日积月强大，好莱坞期待借中国这个海外市场弥补美国国内市场的缩水。\n\
    \n同样，好莱坞在西方市场失败的影片，也能在中国市场的收入来弥补。去年上映的根据同名网游改编的《魔兽》，斥资1亿6000万美元制作，在美国上映首周仅获得2500万美元的票房收入。而这部电影却获得中国游戏玩家的大汗，在中国上映头五天就斩获了1亿2560万美元的票房。\n\
    \n### 中国电影票房已影响到好莱坞电影制作\n\n在中国市场的大制作电影中，中国是必须考虑进去的元素。这已经为好莱坞电影制作流程和创作的一部分。主要体现在两个方面，一个是不能得罪中国观众，另一个是学会中国观众的痒痒。\n\
    \n**讨好中国观众**\n\n**不能得罪中国观众**\n\n好莱坞电影这么多年，俄罗斯依然是头号反派，不涉及中国。因为想要中国人的钱，就得让中国观众开心，这个就是典型的不敢得罪中国观众。\n\
