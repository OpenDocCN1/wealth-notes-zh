    [/content]\n</think>\n\n[content]\n# 人类是为了喝酒才进化的？\n\n本集音频及文稿参考《国家地理》2月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_50_0.png)\n\
    \n## 知识清单\n\n《国家地理》\n是世界上知名最著名的杂志之一，其精良的画质、色彩与精妙的设计令全球各地的读者惊叹。而在人类的进化和演化中，不仅是一个谜团，更是一个举足轻重的谜团。作为人类最早的祖先黑猩猩，它们对人类的演化有着至关重要的影响。\n\
    \n### 远古人类为什么会在狩猎采集时选择吃水果？\n\n在非洲东部，原始人类祖先的黑猩猩，有1600万年历史。\n\n+ 产生酒精的果子的优点：\n \
    \ - 第一，这些果子散发出来的淡淡酒香，容易被找到。\n  - 第二，熟透的果子好摘，身体所吸收的更多能量。\n  - 第三，酒醉微醺。可以提高这些果子的吸引力，令采摘者更快。\n\
    \n### 人类制造啤酒的历史\n\n最古老的啤酒配方，是公元前7000年的，而古代美索不达米亚人已经在种植小麦和大麦，并用来酿造啤酒。\n\n在非洲东部，原始人类祖先的黑猩猩，有1600万年历史。它们通过舔食发酵的果实来获取酒精。\n\
    \n### 为什么工业革命的酒精作用起关键的作用\n\n研究专家发现，19世纪末，英国工业革命期间，由于人口增长和城市化，导致食物短缺。\n\n### 古希腊的饮酒方法\n\
    \n古希腊人有一个很好的饮酒方法，一共分三杯：第一杯祝健康，第二杯祝快乐，第三杯祝好梦。\n\n## 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_50_1.png)\n\
    \n> 第一杯酒祝健康，第二杯酒祝欢乐，第三杯酒祝好梦，聪明的客人喝完三杯酒就知道：是时候回家了。\n\n—— 古希腊祝酒词\n\nThe first bowl\
    \ for health, another for pleasure, and a third for sleep. When this bowl is drunk\
    \ up, wise guests go home.\n\n— the toast of ancient Greek\n\n![](img/2b1f55794a32401f6e1d5425100884b9_50_2.png)\n\
    \n## 本期杂志：《国家地理》\n\n创刊于1888年，是世界上历史最悠久的科学期刊，因经常刊载高质量的关于社会、历史和世界各地人文的古文物，而广受赞誉。\n\
    \n## 下期预告：《读者文摘》\n\n---\n\n本文首发及文稿参考《哈佛商业评论》\n2016年3月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_51_0.png)\n\
    \n## 知识清单\n\n《哈佛商业评论》\n哈佛学院院长的杂志，是为专业管理精英及咨询、培训等管理咨询从业者提供管理资讯的综合类管理期刊，以专业性和可读性著称。它以专业、深入、前沿、实用的文章和文章解读，为专业人士提供管理学知识，并以其独特的风格和管理理念，帮助管理人员解决实际问题。\n\
    \n### 什么叫做初创公司的“规模化”？\n\n对于“规模化”，很多企业存在误区。有人把“规模化”理解为公司规模越大，效益越好。其实，“规模化”是公司在快速发展过程中，实现组织、管理、技术、资金等要素的协调匹配和整合优化，从而实现效益和效率的最大化。\n\
    \n### 如何实现公司的“规模化”？\n\n文章提出了四个方法：\n- 第一步：界定专业分工，让专业的人做专业的事\n- 第二步：根据公司扩张规模，增加管理层次\n\
    - 第三步：系统收集分享信息，建立处理问题的流程\n- 第四步：坚定维护企业文化\n\n#### 第一步：界定专业分工，让专业的人做专业的事\n\n公司初创时，老板是唯一的决策者，公司只有老板一个专业，其他人都是业余的。当公司规模化后，专业分工就变得很重要。专业分工是指按照不同专业性质、不同技术要求将工作划分为不同的工作岗位，并由不同专业的人去完成。\n\
    \n**引入专业人士，会产生什么问题？**\n\n1. 早期员工有情绪\n当公司进入专业化分工，早期员工的贡献被专业化分工所取代，早期员工会产生被边缘化的情绪，甚至产生嫉妒心理。\n\
    \n解决方式：\n公司要给早期员工以肯定，让他们看到自己的贡献和价值。对早期员工进行培训，让他们成为专家，或者让专业人士和早期员工合作，共同解决问题。\n\n\
    2. 容易产生信息孤岛\n专业分工会产生信息孤岛，即各部门之间信息不通，各自为政，不能协同工作，影响公司效率。人的“部署本能”是指人们习惯于按部门安排工作和解决问题，而“跨部门协作能力”是指人们习惯于按项目安排工作和解决问题。专业化分工越细，跨部门协作能力越难培养。\n\
    \n解决方式：\n公司要建立有效的跨部门沟通机制，如跨部门会议、项目制工作等，培养跨部门协作能力。\n\n#### 第二步：根据公司扩张规模，增加管理层次\n\
    \n公司初创时，老板既是决策者也是执行者，没有管理层次。随着公司规模扩大，管理层次自然增加。\n\n很多公司都在公司扩张初期，业务上马速度极快，但管理层次增加缓慢。业务扩张了，管理水平没有跟上，就会出现管理真空。管理真空是指管理层次跟不上业务扩张速度，出现管理断层\
    \ 的现象。\n\n文章通过举例指出，公司管理者可以通管理者的身份，对下属的管理者的能力进行评估。通过评估了解管理者的能力，以便针对性地进行培养。\n\n\
    当然，随着公司增加管理层次时，也要注意“过度管理”。“过度管理”是指管理层次过多，导致决策效率低下，甚至出现“上行下效”的现象。过度管理会消灭组织活力，降低管理效率。\n\
    \n#### 第三步：系统收集分享信息，建立处理问题的流程\n\n初创公司面临的问题往往千头万绪，而资源有限。如果不建立处理问题的流程，公司就会陷入“救火模式”，疲于奔命。\n\
    \n文章通过举例指出，公司管理者可以通管理者的身份，对下属的管理者的能力进行评估。通过评估了解管理者的能力，以便针对性地进行培养。\n\n系统收集分享信息，是指公司管理者要收集并分享公司各个层面的信息，以便做出科学的决策。\n\
    \n#### 第四步：坚定维护企业文化\n\n在公司发展过程中，最关键的就是企业文化。企业文化是公司的灵魂，是公司在长期发展中形成的价值观、信念和行为规范。\n\
    \n### 总结\n\n作为一个创业者，首先得明确自己的定位。你是想做“小而美”的公司，还是想做大公司？\n\n不同定位有不同的路径。如果想做“小而美”的公司，那就聚焦于细分领域，打造专业优势。如果想做大公司，那就走平台模式，整合资源。\n\
    \n---\n\n# 2017如何坚持你的新年计划\n\n本条音频及文稿参考《快公司》年末特刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_52_0.png)\n\
    \n## 知识清单\n\n### 《快公司》\n\n全球三大财经杂志之一。\n\n《快公司》和《哈佛商业评论》很有渊源，《快公司》的创办人曾是《哈佛商业评论》的主任编辑。\n\
    \n这本杂志致力于传达那些在快速发展的商业世界里，真正改变商业的故事和理念。也就是说，《快公司》既继承了《哈佛商业评论》深厚的管理理论的基础，又讲述了最前沿的商业故事以及想法。\n\
    \n如何坚持完成年初制定好的新年计划。根据美国大脑数据研究机构的调查，在制定新年计划的人群中，只有8%的人能成功坚持下去。92%的人则中途放弃了。文章就如何坚持完成“新年计划”，给出了4点建议。\n\
    \n**第一点建议：放下宏大的新年目标，从能坚持做的小目标做起。**\n很多人的新年目标总是很宏大的，比如说每天健身2小时，一年读完50本书。心理学家说，这其实自于一种掰掉自己身上缺点、重新做人的强烈愿望，当自己制定这种计划时，心中会产生愉悦感。但是，这些宏大计划的前提都很假。文章建议，不要制定那种秋风扫落叶一样的小计划，而是做可以持续执行的具体小计划，比如，与其制定每天健身2小时，不如从每周三次、每次2公里的散步开始。\n\
    \n**第二点建议：重复行为，强化新习惯。**\n制订新年计划的前两周是最兴奋的，这股兴奋劲儿退去后，“新年计划”也就被抛到脑后了。文章里说，成功实施了新年计划的人都有一个共性，就是他们善于利用重复的力量去养成新的习惯。一旦一个事儿养成了习惯，就可以依靠惯性坚持下去，但前提是培养新习惯。心理学家McCarthy指出，人们很难实现目标，因为大脑喜欢按惯性行事。人们长期以来的习惯，已深深演绎在大脑神经中，有自己的神经路径，难以改变。如果形成新的习惯，就得创造新的认知，更重要的建议，为新习惯建立新的神经路径。如何才能建立新的神经路径？文章给出的办法是，每天早上都重复自己遵自己的目标，最好是大声地重复出来，日复一日，一个新年目标就会在大脑中留下印记，心理学家McCarthy称之为有意识的大脑训练。\n\
    \n**第三点建议：寻找榜样。**\n文章里建议，多了解那些已经实现了目标的人，多听励志故事，这对于实现新年计划有两点好处：第一，这会让你对自己的目标更加熟悉和明确，更能增加信心，你会觉得“他们能做到，我当然也能”。第二，会让你的目标更加“可视化”。假如你的目标是健身成功，多看看健身成功的人的照片。这样，你在脑海中对于自己的目标会更有画面感，也就更有动力去执行了。\n\
    \n**第四点建议：为可能出现的状况建立应对机制。**\n我们之所以无法完成新年计划的主要问题有两个：第一，缺乏自控力；第二，因为中途的断档导致全盘放弃。所以，在制定目标之前，就要挖掘你可能出现的具体情况而做出应对计划。比如说，你会可能会说：“要是我没动力了怎么办？”那么应对方案可能就是看看自己的榜样，如果榜样也无法激励你了，文章建议，在制定目标时，写下最初的动力，不断提高自己想改变的原因。此外，文章还给出了另一个方法，就是和朋友组成搭档，彼此监督。\n\
    \n---\n\n# 打动他人的“黄金”理论\n\n本文音频及文稿发表于《大西洋月刊》1月、2月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_53_0.png)\n\
    \n## 知识清单\n\n《大西洋月刊》\n是一本综合性月刊，内容涉及政治、科学、文学各方面，被誉为“美国最受尊重的杂志之一”。这本杂志历史悠长，始终坚持无党派、无偏见，且具有很高的艺术性，包括海明威在内的许多美国文豪，都在《大西洋月刊》上发表过文章。\n\
    \n### 现代工业设计师“雷蒙德·罗曼”是谁\n\n《纽约时报》曾评论过：“罗曼造成了现代美国的101件大事”，雷蒙德的罗盘在在第87位，他对于现代美学的影响很大很深。\n\
    \n他的设计包括：美国美孚石油公司的标志、美国大兵香烟牌Lucky Strike的标志等等。设计范围非常广之一。\n\n![](img/2b1f55794a32401f6e1d5425100884b9_53_1.png)\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_53_2.png)\n\n### 雷蒙德·罗威最有名的三个设计\n\n\
    第一个著名设计，是美国总统的座车。同一套命名法。罗威被选为了在白宫工作的朋友报纸，总统座驾“空军一号”华丽而不公。当时的美国总统肯尼迪把他到白宫办公室商量，最后将“空军一号”命名为白色机身、蓝色机头，前面还有突出的机头，像个鼻子。这个罗威的设计，沿用至今。\n\
    \n第二个非常有名的设计，是现代火车的命名法。老式火车头是白色彩绘，跑起来冒着蒸汽。1932年，美国宾夕法尼亚铁路公司委托罗威设计一个新的火车头，经过研究后，他选择了烟肉，把整个火车用一块铁包裹起来，这个就是现代火车“子弹头”设计的原型。\n\
    \n第三个设计，是给美国太空舱能够尽量舒适地生活和工作的区域。\n\n![](img/2b1f55794a32401f6e1d5425100884b9_53_3.png)\n\
    \n## 什么是MAYA理论\n\n罗威所有的理论都源于了一条理论，就是MAYA理论，这是由四个单词的首字母组合起来的词：Most Advanced Yet\
    \ Acceptable。翻译过来就是，要极致得让人眼前一亮，但也能被人接受。\n\n说得通俗一点，如果你要卖一些得于意料的东西，就要把它弄得尽量沟通一点，如果你要卖一些大很熟的东西，一定要把它弄得意外一点。\n\
    \n火车头大家都非常熟悉，罗威在设计时，进行了大刀阔斧的改变，打破了大家对于火车头这个形象的基本概念，给了一个很超前很形象的火车概念，就是Most Advanced。\n\
    \n在设计空间站的时候，罗威特意在空中加了一个舷窗，让宇航员可以看到地球。空间站对于人来说是新的领域，但如果可以透过这扇舷窗看看自己的家园，这个就是Yet\
    \ Acceptable，虽然很新，但依然是很大家熟悉的元素。\n\n## MAYA理论的心理管理学\n\n全球最大的流媒体音乐公司Spotify曾经做过一个项目，每周向一批用户新投放一歌曲，推送给用。但实验出现了一个结果，本来应该全部是新歌的歌单混入了用户听过的老歌。Spotify很快就进行了修正，可是想到，把老歌去以后，那个服务使用的人数减少了。\n\
    \n这是因为，对于用户来说，如果没有让人心悬着一又完全陌生的东西，信心降低，但如果是全在听歌，就有点无聊了。听过的新歌曲的熟悉和陌生感会让人对歌曲产生信任感，对信任的歌曲的歌声会更高，熟悉的东家还会产生安全感。\n\
