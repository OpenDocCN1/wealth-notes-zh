    # 谷歌对网络暴力的技术性反击


    本文源自《连线》（英国版）11月刊


    ![](img/2b1f55794a32401f6e1d5425100884b9_5_0.png)


    # 知识清单


    # 网络巨魔（Internet Troll）


    指在网络世界中，用侮辱性语言挑起骂战，并从中获得莫名快感的的人。


    Troll是一种源于北欧神话的怪物，体型巨大，头脑简单，暴力嗜血。在暴雪公司的大型网游《魔兽世界》中，“巨魔族”的英文即为Troll。


    # 拼图组织（Jigsaw）


    原谷歌的智库，今年2月改名为“拼图”，Jigsaw的一种词义就是指拼图，也可以用来表示“错综复杂”的形式。


    拼图组织（Jigsaw）即将推出一个“人工智能对话系统”，利用算法和机器学习能力，自动识别网络上的侮辱性言论和骚扰。比关键字过滤准确，也比人工识别要快得多。


    # 登月级别计划（Moonshot）


    在谷歌内部，把所有听起来疯狂、夸张、需要花费大量时间和精力来实现的计划，都称之为“登月级别计划”。例如：谷歌眼镜、无人驾驶汽车、模块化手机等。


    # 不作恶（Don’t be evil）


    谷歌公司非正式的公司口号，全文是“完美的搜索引擎，不作恶”，1999年提出，沿用至今。


    # 本期金句


    ![](img/2b1f55794a32401f6e1d5425100884b9_5_1.png)


    > 谷歌正试图保护网上的弱势群体，但行善比“不作恶”要困难得多。


    ——《连线》


    > Google is on a mission to protect the internet’s most vulnerable, but doing
    good is harder than “Don’t be evil”.


    ——WRED


    您好，欢迎来到“乌鸦说读杂志”。


    今天给您分享来自美国《连线》杂志的一篇报道。咱们之前讲过的《哈佛商业评论》、《经济学人》、《快公司》，都是领域前沿、个性鲜明的相对刊物，而《连线》杂志也是美国人相对比较熟悉的。这是一本科技类的杂志，被誉为“极客的圣经”。它关注的是科学技术应用于未来和人类生活的各个方面，并对文化、经济和政治产生影响。


    这本杂志经常会影响到一些我们耳熟能详的概念和名词，比如“长尾效应”、“众包”的概念，都是《连线》杂志首先提出来的。


    今天说的虽然不是本期的封面文，却是一篇内容很棒的专题报道，说的是谷歌公司在酝酿的，一个对抗网络审查和暴力的计划，很值得一讲。


    文章里说，现在社交网络越来越发达，在万丈光芒下，总会有黑暗的影子存在，如今在欧美网络上，类似Facebook、推特这样的网站以及论坛上，有一种被称为“网络巨魔”的人，英文叫Internet
    Troll，这种“网络巨魔”指的是，跟自己想不同的观点，实施网络暴力。主要是骂搞、侮辱，极端的，甚至会进行人身威胁。


    比如说，美国有一个女脱口秀主持人叫Leslie Jones，是个黑人，她的头像被一些种族主义者，在网上给她做了一个黑猩猩的图片，还在她脸上P了很多黑白液体，就是很有侮辱性的那种，你懂的。


    还有更极端的，比如一些专栏作家，因为自己发表的政治言论，而在社交网络上受到了极端分子的攻击，有扬言要一根根拔掉其头发的，有威胁要掠夺其器官的，更夸张的，还有说要暴人家只有一岁的女儿的。最后这些专栏作家不得不关闭了自己的所有社交网络账号，彻底离开了虚拟的网络世界。


    文章的论点是，你作为“网络暴力”的受害者，好像像是进了一个广场，广场上有5万人，就你像进现在，在你。你光会着全世界对你都有敌意，那你首先肯定是闷骚，甚至你可能就觉得自己的生命都受到威胁了，你要保命，你得逃跑。


    这不仅会造成非常大的心理伤害，而且会导致这些人从此有心理阴影，发东西之前先自我审查，这个不敢说，那个不敢讲，要么干脆就不再在网络上表达发表自己的观点了。


    其实这种“网络暴力”现象，我们中国人并不陌生，只是在我们这儿对这些“网上暴力”分子，不叫“网络巨魔”，有别的称呼，比如“键盘侠”之类的。


    这些年来，类似Facebook、YouTube这些社交媒体和网站，对这种网络暴力的主要手段，都是让用户体验出侮辱性的言论，进行举报，再由他们的员工进行处理，而这些处理问题的员工，也都是外包到像菲律宾这样的“第三世界国家”，一个是因为他们讲英语，还有就是因为人比较便宜。


    但这样的处理方式，首先人力成本很高，而效率又非常低下；其次，对于处理这些侮辱性言论的员工来说，整天看着这些负能量的东西，他们的身心也会受伤害。


    所以作者认为，这种方式对大规模的网络暴力，基本没什么用。


    而最近谷歌一个叫“拼图”的团队，英文叫Jigsaw，即将要推出一个新项目叫做“人工智能对话系统”。这个项目主要是利用技术和机器学习能力，来自动识别网络上的侮辱性言论和骚扰。这个项目一旦做出来，按照他们自己工程师的话说，会比关键字过滤要快得多。同时，又比人工手动处理要快得多。这样就能够非常好地解决“网络巨魔”问题。'
  - '[PAGE 6]


    ![](img/2b1f55794a32401f6e1d5425100884b9_6_0.png)


    这个叫“拼图”的团队，前身是谷歌的一个智库，成立于2010年。今年2月份才改名叫“拼图”。那个机构谷歌之前都做过些什么事儿呢？他们在网络安全方面做的确是做过一些事情的，就比如说在谷歌的Chrome浏览器里做一个插件，你如果在浏览一些有危险的网站，对方要输入你的谷歌账号和密码，这个插件就会跳出来提醒你，让你小心。


    还有比如极端组织“伊斯兰国”，在网上招募志愿者，号召人来加入他们，智库就做了程序，来反制“伊斯兰国”的这种网络攻势。比如说通过你搜索的关键词看到你有这种极端言论的倾向，它就会把你导入到另外一个页面的页面上，让你看到的是反“伊斯兰国”的言论和视频。据其内部实行下来的效果看，成功率高达70%。


    而这个所谓的——人工智能对话系统——其实只是一个“拼图”团队，野心勃勃的项目的一部分。他们最终是要利用Google 强大的硬件设备和优秀的工程师，做一个Moonshot级别的项目。


    Moonshot 也就是登月，在谷歌内部把所有疯狂甚至听起来很夸张，会花费大量时间和精力的计划，叫做“登月级别”项目。比如谷歌眼镜、无人驾驶、模块化手机之类的，都是“登月级”的项目，并拼图“登月级项目”的最终目的是，在十年之内，结束网上的审查制度。


    ![](img/2b1f55794a32401f6e1d5425100884b9_6_1.png)


    他们的想法是，运用人工智能来解决人与人的问题，让人们在互联网上可以更加和谐相处。不但要把互联网技术的潜力往前推进，同时要弥补在整个世界演进过程中，出现的最糟糕的那些东西，比如说像监控、极端的言论，还有审查。


    按照作者的说法，“拼图”这个团队，就是谷歌里一个类似于“正义联盟”这样的组织。“正义联盟”就是漫画里面那些超级英雄，像超人、蝙蝠侠，他们组成的“维护世界和平”、“助强扶弱”的这么一个组织。


    我们都知道谷歌公司有一句著名的口号，叫不 作 恶 ， “Don’t be evil”。“拼图”组织启动的这项计划，也说明谷歌公司已经不仅仅满足于他们原来说的“不作恶”了，他们想要做好事。


    ![](img/2b1f55794a32401f6e1d5425100884b9_6_2.png)


    谷歌说，一个人工智能对话的程序，其实是受到了一个游戏公司启发。就是知名的多人网络游戏《英雄联盟》的制作公司，他们从2012年开始，尝试着在网上，对玩家之间的言论进行监控。如果他们对玩家在游戏的时候，有人聊天用了侮辱性的词汇，那么他们就会对这样的玩家进行警告，然后92%被警告的玩家，之后都没有再使用这样的言论。就是说，玩家被警告后会收敛和注意自己的言行。


    这个计划的实施，主要是依靠“算法”和“机器学习”，也就是Machine Learning, “机器学习”，是目录世界上公认的“四大技术趋势”之一，文章里很简单地解释了一下它的原理，就是让程序先标记，什么样的东西是属于“骚扰性”或者“误导性”的言论，然后机器不断学习之后，最终能够很准确地分辨出来。


    好意思，你要让机器图分辨什么是猫，给它海量的猫的图案，让它认识猫的特征是什么样的，一段时间之后它熟悉了，就能在众多的图片里面辨认出猫了，就是这么个原理。


    那这种方式对于应对网络暴力是不是有效呢？按照文章作者亲身体验，貌似还挺有效的。人工智能对话的程序有个0-100的打分机制，来确定用户的言论，是不是侮辱性的言论，一句话的侮辱越高，分数就越高。比如说你输入：怎么样，混球？63分。程序显示：你是个混球，你有63分。程序显示96分，判定为侮辱性言论，识别率还是挺高的。而且谷歌打算把这项技术，做一个开源，就是任何人都可以应用这样的模型，然后进行开发。以后效率和准确度还会提高。


    但是目前对这个项目的担忧也是挺多的，有业内人士指出，因为“拼图”其实是谷歌的一个盈利机构，那么怎么保证言论制定的公平性，而且对于反审查的这种做发有没有可能变成一种新的审查制度呢？


    即便是在网上遭受过“网络言语暴力”的那些人，当他们听到这个项目的时候，其实还是很愉快的，很多人说，人们还是需要能够自由表达的空间，因为在这种算法下，你的回嘴也算是危险性言论，一样是要被删除的。有人就说了，如果在网上连“川普是个傻瓜”这样的话都不能说了，那网络还有什么意思啊！


    好了，今天跟你分享的是谷歌的“拼图”组织，配部的应对“网络暴力”的计划，也是谷歌内部“登月级”的项目。Moonshot 也就是登月，如果您以后在聊到很长远而且比较难实现的项目时，就可以
    称 它 为 “ 登 月 级 别 ” 的 项 目，Moonshot, 简洁又精准。


