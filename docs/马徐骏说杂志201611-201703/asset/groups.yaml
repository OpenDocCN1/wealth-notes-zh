    《财富》、《华尔街日报》、《商业周

    刊》三大刊物加起来还多。


    这篇文章主要讲述的是人类对狼群的观

    察。


    狼和人有相似之处，二者都是群居动物，

    有清晰的社会结构，并且都追求拥有社会

    地位。


    狼在人类社会中的评价很高，代表强悍又

    智慧的生物，有些民族还有“狼崇拜”情

    结。


    在美国印第安人中，有一种符号叫“狼

    迹”，这种符号由两只狼的脚印构成，象

    征着“方向”和“领导能力”。而中国内

    蒙古草原上的游牧民族，把狼视为他们

    的“兽祖”。


    “头狼”是整个狼群的领导者，“头

    狼”在狼群里的地位，就相当于人类组织

    机构里领袖的角色。人们在提到“头

    狼”时，往往想到的都是“征服”、“野

    性”、“侵略”这样的描述。


    Alpha Male

    Male 是雄性的意思，Alpha 就是指狼群

    里的头狼。Alpha Male 在英文里代表着

    “雄性领导者”和“群体领袖”。


    本文的作者、资深狼类研究者麦金泰尔认

    为，将头狼和“侵略”、“野性”这种印

    象联系起来，是一个非常大的错误。

    的确整个族群的头狼，在对外作战时，的

    确非常强悍，但头狼对狼群内部的管理，

    既不是强势的姿态也不是征服的态度，甚

    至不带侵略性。

    头狼的这种特点，符合进化的规律。狼群

    协作精神的本质，是为了更好地生存。

    头狼身上，存在有两个有趣的特质。

    首先，头狼在狼群中扮演的，并不是一个

    强硬的控制器角色，相反，它是一个

    宽厚仁慈的家长。

    文章举例说，头狼带领狼群捕猎成功后，

    它退到旁边，等其它狼都吃饱了，自己才

    开始吃。

    而头狼面对自己的狼群时，不像它对外展

    现的那样，带着强烈的攻击性和侵略性，

    它把其他的狼视为自己的兄弟、后代。

    头狼这种对狼群的管理方式，在群居动物

    里是很独特的。

    其次，头狼并不是整个狼群实际事务的管

    理者，实际管理者“另有其狼”。

    生物学家们过去认为，头狼是狼群中“说

    一不二”的大头目，现在却发现，狼群中

    的管理分两条线，头狼管的是所有雄狼，

    主要承担的是征战、保护族群这样的任

    务。

    而狼群的内部事务，由“雌头狼”管理，

    它决定诸如什么时候迁移、什么时候休

    息、什么时候打猎。“雌头狼”的性格，

    奠定了整个狼群的基调。

    也就是说，头狼是狼群的精英领袖，雌头

    狼才是狼群内部主持大局的总管家。


