    这种心态直接反映在了政治风向向上，2016年6月的偶尔民调显示，10个成员国中，相比前一年，只剩下51%的民众支持欧盟，支持率在法国下降了17个百分点，在德国下降了8个百分点。去年6月，英国经过公投成为第一个离开欧盟的国家。


