  mdcn: "\n## 如何像顶尖管理者一样高效？\n\n本条音频及文稿参考《快公司》年终合刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_40_0.png)\n\
    \n### 知识清单\n\n《快公司》杂志年终合辑介绍了十位高效管理者的工作秘诀。\n\n这十人分布于各行各业，也都是公认的成功人士，也是“世界上最忙碌的一群人”，其中包括美国最著名的“脱口秀”明星、奢侈品品牌的CEO、知名制片公司的老板、电视节目主持人等等。\n\
    \n他们虽然工作繁重，但工作效率极高。\n\n文章介绍说，关于提高工作效率，这些人身上有三条共性，值得你思考和借鉴。\n\n- 一、注意你的作息，十位高效人士都是早起者。\n\
    \n这十个人全部都在每天7点半以前起床。\n\n十人中起床最早的是美国著名的“脱口秀”明星凯文·哈特，他每天5点半起床。其他大部分人的起床时间集中在6点到7点半之间。\n\
    \n尤其值得注意的是，这些人不管前一天晚上几点睡，一定在第二天相同的时间起来。换句话说，他们都具有非常强的意志力。\n\n- 二、事情太多？别着急追求完美，先把它做完再说。\n\
    \n“脱口秀”明星凯文·哈特不仅是主持人，还身兼演员、作家和制片人等多个身份，是出了名的高效工作者，他的一条法则则是：只要实现了目标，就算大功告成，不要把把所有的事情做到尽善尽美。\n\
    \n换句话说，比起完美，把事变完更重要。\n\n奢侈品品牌Gucci的CEO马可·比萨利同样认为，在时尚业，不可能百分之百掌握了全部信息之后再做决定。所以为了能够创造未来的需求和时尚风潮，就要一直保持着进取和行动。\n\
    \n- 三、这些高效工作者提到，自己的困扰主要有两个：注意力不集中和拖延症。\n\n注意力不集中主要体现在人会不时地看手机、查邮件。\n\n比尔·盖茨的夫人梅琳达·盖茨的解决办法是，把个人邮件和工作邮件分在两个文件夹里面，每天只有到特定时间才会打开对应的文件夹。也就是在时间上做到公私分明。\n\
    \n文章还提到了一位旅游频道的主持人席莫，他自身有拖延症。\n\n为了解决这个问题，席莫首先把自己的这个问题，在全公司公开，希望自己的员工帮自己想办法改进，这其实就是一个积极行动的逻辑。\n\
    \n其次，席莫特地雇了一些人来监督自己，也就是直面自己的问题，想办法解决。\n\n文章还提到了一个提高工作沟通效率的小贴士。\n\n出品了《实习医生格蕾》、《丑闻》、《逍遥法外》等热门美剧的珊达帝国制片公司CEO珊达·瑞梅斯在工作中提出，任何人只要走进她的办公室，必须带着解决方案，而不是只抛出一个问题。这可以大大提高同事之间的协同和工作效率。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_40_1.png)\n\n> 人们只要做决定就会犯错，但即便犯错，也在推动事情的进展。\n\
    >\n> —— 马可 · 比萨利 (古驰集团 CEO)\n>\n> If someone makes a decision and they make a\
    \ mistake, at least it keeps things moving.\n>\n> — Marco Bizzarrini (Gucci CEO)\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_40_2.png)\n\n### 本期杂志：《快公司》\n\n著名的前沿商业媒体，也是世界历史上成长最快的媒体品牌。创刊已经过20年的《快公司》，是今天全球三大财经商业媒体之一。\n\
    \n### 下期预告：《科学美国人》\n\n很多人觉得，人工智能可能会造反，非常危险，但《科学美国人》却认为，有比人工智能更危险的东西值得我们注意。\n\n\
    ## 比人工智能更危险的是什么？\n\n本条音频涉及文章参考《科学美国人》1月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_41_0.png)\n\
    \n### 知识清单\n\n《科学美国人》是美国历史上持续时间最长的杂志，从1845年至今，172年没中断。同时，它又以绝大的大众化的蒸汽水平来到你。到目前为止，共有150位以上的诺贝尔奖得主为这本杂志写过稿。《科学美国人》最著名的《科学》杂志的兄弟刊物。\n\
    \n“阿西莫夫一般认为机器人应该受四条纪律约束去不杀人，文章作者指出，机器人立法必须从人机合作入手。”\n\n人工智能的发展阶段\n\n- 第一阶段：上个世纪五十年代，人工智能的第二次热潮，计算机的兴起使人们认为未来机器可以代替人类劳动。\n\
    - 第二阶段：上个世纪七十年代到2005年左右，科学家发现，以当时计算机的计算能力，用机器人代替人类的劳动这个事儿是不通的。因此大众对于人工智能就没有那么热衷了，这个时期被称为“人工智能的冬天”。\n\
    - 第三阶段：2005年至今，是人工智能的第三次热潮，以开放AI的GPT模型为起点，各大科技公司都投入研发人工智能，以世界知名的互联网大公司把机器人技术作为下一个抢占市场高地的重要目标。\n\
    \n目前人工智能的应用，主体是依附在机器视觉和自动驾驶模型上。对过去的表现来说，初级、灯型的控制技术已经实现，但下来会出现很强表现情感或伦理和人性的机器人，以及无人驾驶。\n\
    \n文章作者认为，目前核心是机器智能能力对人类产生威胁的对于说，因为机器人的行为都是被预设控制的。但是要注意，人不可能去控制它的底层逻辑，它也不会去否定人的控制，它就只会服从人，所以会出错。\n\
    \n一旦它去错了，它记忆了它的错误，它如何防止人下达了错误，甚至是荒谬的命令，导致机器人作出伤害人类，破坏财产、危害环境或被机器人自身制造危险的行为。\n\n\
    ### 阿西莫夫\n\n美国和犹太裔美国人。\n\n关于阿西莫夫，最广为人知的就是他的一部作品，以及他提出的一条定律。\n\n其中的基础，指的就是从科幻名著《基地》，他根据他从头去写，拉登克该这本小书的叙述，并且自己创造的词汇创造命名为“基地”。\n\
    \n一条定律，指的是著名的“机器人三定律”。\n\n### 机器人三定律\n\n- 第一定律：机器人不得伤害人类，或对人类因袖手旁观而见伤害不幸不语。\n\
    - 第二定律：机器人应听从指令并予以协助，除非此指令与第一条或第二条定律相抵触。\n- 第三定律：机器人必须保护自己，除非保护自身与第一条、第二条定律之情况下更直接能保护自己的生存。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_41_1.png)\n\n人工智能不加分析地严格执行人类的命令，这并不是一件稀奇的事儿。\n\
    \n文杰说，现代人工智能的发展水平远远还没有达到可以分辨出人类命令里并包含着的含义，它不能明白这句话可能产生的后果。所以无论人工智能在什么情况下，都必须接受执行命令，并保证执行结果。\n\
    \n### 违抗条件\n\n语言学里面的专有名词，意思是只有满足了一系列条件，执行者才能执行一条新发出的命令。\n\n作者的研究团队，在一个机器人的违抗令中，加入了“违抗条件”。比如科学写了一个算法，机器人在接受指令之前必须先满足这个条件。\n\
    \n例如，作者团队在机器人实施某项任务，让机器人执行的程序识别不能够像做这种方式；其社会属性以及指令发出者的关系，允许不能在执行该条件合；执行该该条件也不会完成一些不必要的的指令任务。\n\
    \n走失了“违抗条件”的算法之后，才可以执行命令。\n\n如果机器人执行自己的命令，人类会有什么样的反应？\n\n文杰通过安全控制，机器人提出反驳后，有一不可知可以阻止人类对它拒绝处理无关的或恶意的命令。\n\
    \n对于人类而言，人工智能拒绝执行命令并不足为奇。\n\n文杰作者强调，对人类而言，人和人的行为是可以信任的。真正不可信任的，其实是人自己。\n\n###\
    \ 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_41_2.png)\n\n> 真正需要担心的，不是造反的机器。糟糕的人类管理者与被错误理解的指令，才是人工智能面临的最大问题。\n\
    >\n> ——《科学美国人》\n>\n> Don't worry about defiant machines. Devious human masters\
    \ and misunderstood commands are a bigger threat.\n>\n> — Scientific American\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_41_3.png)\n\n### 本期刊志：《科学美国人》\n\n美国著名科普杂志，始于1845年。它是美国历史悠久的杂志之一，也是著名杂志《科学》（Science）的姊妹刊。到目前，有超过150位诺贝尔奖得主为《科学美国人》撰过稿。\n\
    \n### 下期预告：《别怕未来图谋》\n\n摩根大通CEO谈美国抵押率的现状以及他对特朗普的看法。\n\n## 摩根大通的“底特律复兴计划”\n\n13:31\n\
    \n本文摘录及文稿参考《彭博商业周刊》（英文版）12月26日刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_42_0.png)\n\
    \n### 如清单\n\n### 摩根大通\n\n美国最大的金融服务机构之一，总资产达1.5万亿美元，占美国总资产的25%。它诞生于1909年，后一半时间在中国开设分支机构的外资金融机构。摩根大通有一个计划，2010年12月，美国《商业周刊》刊文《“底特律复兴计划”》；2014年，美国《快公司》刊文《“底特律复兴计划”》，认为其正在通过投资和咨询等方式帮助美国汽车工业重振雄风。\n\
    \n摩根大通CEO杰米·戴蒙\n\n被誉为世界上最令人敬畏的银行家，被《财富》杂志评选为“25位最具影响力的商界领袖”之一。35岁就进入了世界500强的首席执行官，1998年离开花旗集团后，他的离开导致花旗股价直线跌了11%。戴蒙在只有非常短的时间里完成提出的“江湖地位”，他用两年多的时间，协助美国第一银行扭亏为盈，并且，他将会是“美国商业家协会”的下一任主席。\n\
    \n刘易斯·莫莱特（Lewis Mumford，1891年—1990年，美国人）是美国的一个界别作家和192位思想家公司的终身参与人，其中包括大部分公司是界别五百年。这个组织负责美国联邦和总统机构在商业上的建议，推动商业政策的实施以及改革。\n\
    \n艾伦·格林斯潘（Allegan Greenspan）\n\n两度获诺贝尔，沃隆德·格里斯曼教授的高级导师杰西·迈克·达格，就任为。迈克·达格身长，身有两个特点，一是他是思维敏捷，二是爱平。同时，他为自己保留了世界城市的公共服务的“作战室”，把从城市当做一张纸张来对待，是一个雷厉风行的人。\n\
    \n事实上，底特律的繁荣从未像自20世纪50年代开始，一是因为工会的高福利和高薪效应，让美国“三大汽车巨头”的制造成本急剧升高，二是日本汽车厂商的竞争，导致日本车占领了市场。\n\
    \n分析一旦开始，只用2003年的情况再次送回了终点。\n\n但就在进行“下行”的过程中，戴蒙还一直保留着目己美国的汽车制造传统，坚持不懈转型。\n\n和这座国的工业经济类似到比勒形成了很大的反差，奥比勒是城市转型的型成典范。“两化”统一，带动人口大量向城市流动，这导致了1970年到2005年间，原底特律的奥比勒，制造业从业人员从减少90%。但奥比勒跳开了旧框，想靠开放和多元转型，通过引进资金，提高教育运行水平，转型高科技制造业并转型，止住了被废弃率，实现了经济复苏。\n\
    \n现在美国工业升级和O、类比特城是一个重要的基础。\n\n但和比较起过说奥比勒的成功，戴蒙认为，底特律的底子还在。\n\n美国“三大汽车巨头”正在底层城市的只有通用一家，另外还有——通用和克莱斯勒——都是在“大底特律地区”的整合中心。它不光起不好，并不只是底特律这座城市的问题。\n\
    \n并且又认为，一座城市如果文化、体育发达的话，那么这个城市的经济通常都不会太差，而像美国人最喜欢的四大球类联盟球，篮球、棒球、橄榄球和冰球，在底特律都有球队，这样的城市，全美也只有十几个。\n\
    \n底特律的核区分为东底特律和西底特律，东底特律，确实是一盏亮起来的珍珠，但西底特律却显得生机勃勃。\n\n为了吸引人才，底特律的市长杜邦·凯尔说，从有人有学历的人，或于有“创造者”之称的企业，以在3年多的时间，从10个变成了130个。\n\
    \n现在的底特律，吸引众多的创意公司回归，底特律吸引他们的其中一个原因，是房租低廉。另一个，是底特律旧城老旧的工业城市范儿，在很多外州来看，很呆酷，充满创业者的天堂。\n\
    \n加如上天赋和机遇，可以说，现在的底特律同时具备了一个城市共兴的两个因素：我和人。而这也就是我看好它的原因。\n\n### 木刻全句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_42_1.png)\n\
    \n人们总是对我说：“如果你这么做失败了怎么办？”\n\n我不在乎，我只会竭尽全力。如果失败了，那从头再来。\n\n—— 杰米·戴蒙\n摩根大通CEO\n\n\
    > People always say to me, “If you go do this and it fails, what are you going\
    \ to do?” I don’t care. I’m going to give it my best shot. If it doesn’t work,\
    \ I’ll\n>\n> — Jamie Dimon\n> the CEO of JPMorgan Chase\n\n![](img/2b1f55794a32401f6e1d5425100884b9_42_2.png)\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_42_3.png)\n\n### 本周杂志：《彭博商业周刊》\n\n\
