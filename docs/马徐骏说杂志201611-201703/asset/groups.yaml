    — Peter Thiel\n\n## 本期杂志：《彭博商业周刊》\n\n全球著名商业杂志，其前身是1929年创刊的《商业周刊》，2009年出售给彭博社正式更名为《彭博商业周刊》。《彭博商业周刊》是全球发行量最大的商业杂志之一。\n\
    \n## 下期预告：《读者文摘》\n\n美国老牌杂志《读者文摘》（Reader’s Digest）的作者近距离观察了美国黄石公园的狼群是如何做狼群领袖的，这番观察颠覆了人们对狼的固有印象。\n\
    \n## 成为“头狼”一样的管理者\n\n本条音频及文稿参考《读者文摘》2016年年度合刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_34_0.png)\n\
    \n### 知识清单\n\n美国《读者文摘》是一本家庭月刊，1922年创刊，是世界上最畅销的杂志之一。\n\n根据美国市场研究机构的调查，在美国家庭年收入超过10万美元的中产阶级家庭群体中，《读者文摘》的读者数量，比《财富》、《华尔街日报》、《商业周刊》三大刊物加起来还多。\n\
    \n这篇文章主要讲述的是人类对狼群的观察。\n\n狼和人有相似之处，二者都是群居动物，有清晰的社会结构，并且都追求拥有社会地位。\n\n狼在人类社会中的评价很高，代表强悍又智慧的生物，有些民族还有“狼崇拜”情结。\n\
    \n在美国印第安人中，有一种符号叫“狼迹”，这种符号由两只狼的脚印构成，象征着“方向”和“领导能力”。而中国内蒙古草原上的游牧民族，把狼视为他们的“兽祖”。\n\
    \n“头狼”是整个狼群的领导者，“头狼”在狼群里的地位，就相当于人类组织机构里领袖的角色。人们在提到“头狼”时，往往想到的都是“征服”、“野性”、“侵略”这样的描述。\n\
    \nAlpha Male\nMale 是雄性的意思，Alpha 就是指狼群里的头狼。Alpha Male 在英文里代表着“雄性领导者”和“群体领袖”。\n\n\
    本文的作者、资深狼类研究者麦金泰尔认为，将头狼和“侵略”、“野性”这种印象联系起来，是一个非常大的错误。\n的确整个族群的头狼，在对外作战时，的确非常强悍，但头狼对狼群内部的管理，既不是强势的姿态也不是征服的态度，甚至不带侵略性。\n\
    头狼的这种特点，符合进化的规律。狼群协作精神的本质，是为了更好地生存。\n头狼身上，存在有两个有趣的特质。\n\n首先，头狼在狼群中扮演的，并不是一个强硬的控制器角色，相反，它是一个宽厚仁慈的家长。\n\
    文章举例说，头狼带领狼群捕猎成功后，它退到旁边，等其它狼都吃饱了，自己才开始吃。\n而头狼面对自己的狼群时，不像它对外展现的那样，带着强烈的攻击性和侵略性，它把其他的狼视为自己的兄弟、后代。\n\
    头狼这种对狼群的管理方式，在群居动物里是很独特的。\n\n其次，头狼并不是整个狼群实际事务的管理者，实际管理者“另有其狼”。\n生物学家们过去认为，头狼是狼群中“说一不二”的大头目，现在却发现，狼群中的管理分两条线，头狼管的是所有雄狼，主要承担的是征战、保护族群这样的任务。\n\
    而狼群的内部事务，由“雌头狼”管理，它决定诸如什么时候迁移、什么时候休息、什么时候打猎。“雌头狼”的性格，奠定了整个狼群的基调。\n也就是说，头狼是狼群的精英领袖，雌头狼才是狼群内部主持大局的总管家。\n\
    \n## 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_34_1.png)\n\n强大固然让人印象深刻，善良却更加打动人心。\n\
    ——《读者文摘》\n\nStrength impresses us, but kindness is what we remember best.\n— Reader's\
    \ Digest\n\n![](img/2b1f55794a32401f6e1d5425100884b9_34_2.png)\n\n本期杂志：《读者文摘》\n\
    \n1922年创刊于美国。因题材广泛，文章风格简洁易懂，富含价值和趣味，广受好评，是当前世界上最畅销的杂志之一。\n\n下期预告：《新闻周刊》\n\n有“法国特朗普”之称的法国极右翼女政治家玛丽娜·勒庞，会带领法国走上“脱欧之路”吗？\n"
  mdcn: "\n## 特朗普是本世纪最糟糕总统？\n\n本篇音频及文稿参考《纽约客》12月5日刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_29_0.png)\n\
    \n### 知识清单\n\n《纽约客》是一份来自美国的知识、文艺类的综合杂志，涵盖新闻报道、文艺评论、散文、漫画、诗歌、小说，以及纽约文化生活动态等内容。\n\
    \n《纽约客》上大量的内容是关于纽约当地文化生活和报道。由于其杂志高质量的写作和严谨的编辑作风，拥有众多纽约以外的读者，享有世界声誉。\n\n文章的作者Amy\
    \ Davidson是《纽约客》的资深编辑，在国家安全问题、国际报道以及一些专题报道上功力深厚。她认为，特朗普可能是“本世纪最糟的一任美国总统”。\n\n\
    Amy Davidson指出了特朗普的两个问题：任人唯亲和公私不分。\n\n- 1、任人唯亲\n  特朗普在总统权力过渡期里，炒掉了指派给他主导政权交接工作的官员，并把自己的儿子、女儿、女婿，带入了总统权力交接团队。\n\
    \  不光任亲信，他的倾向和启用和自己亲近的人，特朗普任命的幕僚和总统，多为种族主义者或极端保守派。\n  比如，特朗普即将任命的美国司法部长Jeff Sessions就是标准的“种族主义者”，他对美国3K党持欣赏态度，而3K党是美国种族歧视的代表性组织。\n\
    \  特朗普即将任命的白宫“首席策略师”是位反伊斯兰分子，即将任命的中央情报局局长则一度号称要“处决斯诺登”。\n\n- 2、公私不分\n  作者指出，总统应该同自己生意上的利益划清界限，至少不能亲自做生意，否则容易以权谋私。\n\
    \  但目前看起来，特朗普并不愿意放下生意。\n\n## 卡斯特罗的“革命之路”\n\n本条音频及文稿参考《时代周刊》12月12日刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_30_0.png)\n\
    \n### 知识清单\n\n《时代周刊》认为，古巴前领导人菲德尔·卡斯特罗可能是人类历史上最能代表“革命者”这个概念的人。大胡子是他最鲜明的标志，他的时钟曾说：只有在自我实现了革命使命的时候，才会刮胡子。直到90岁去世，卡斯特罗也没有刮标志性的胡子。\n\
    \n有人认为，在卡斯特罗2008年交出权力之后，古巴仍然在延续着他的革命道路，这也证明了卡斯特罗的成功。\n\n但文章指出，很难说卡斯特罗的革命还能继续保持下去，甚至在很多年前，从某种意义上说，卡斯特罗在古巴的革命就已经宣告失败了。\n\
    \n卡斯特罗的革命道路可以分为三个阶段：\n\n- 第一阶段，走上革命之路，成功颠覆旧政权，跟美国闹翻；\n- 第二阶段，1960-1970年代，也是他在古巴最辉煌的十年；\n\
    - 第三阶段，自己衰落，直到卡斯特罗退出世界政治舞台。\n\n文章指出，世界上大多数的革命都是由中产阶级领导的，古巴革命是个例外。卡斯特罗出生在一个中产富裕家庭，19岁时进入古巴哈瓦那大学读书，开始接触到左翼组织。\n\
    \n1953年，卡斯特罗弟弟劳尔·卡斯特罗，以及格拉瓦一起组织了“古巴革命军”，跟当时统治古巴的巴蒂斯塔政府对抗。\n\n1959年，他们推翻了巴蒂斯塔政府，建立了革命政府。\n\
    \n取得政权后，卡斯特罗出访的第一个国家就是美国。\n\n古巴跟美国闹翻，主要出于两个原因：\n\n- 一是民心底层，古巴人对于美国干涉古巴内政很厌恶憎恶。\n\
    - 二是因为卡斯特罗政权在古巴没收了一大批美国财产，同时清理旧政府，很多旧政府的官员、普通古巴人因此逃往美国，而美国收养了这些人，这导致了卡斯特罗的不满。\n\
    \n这些原因最终让古巴和美国关系走向破裂。\n\n### 古巴“猪湾登陆”事件\n\n1961年，在美国政府的支持下，1400名由古巴流亡者组成的反叛组织了一支部队，在古巴一个名叫“猪湾”的地方登陆。\n\
    \n古巴军队最终取得了胜利，参与“猪湾登陆”的1400名人中，100多名流亡分子被击毙，1200人左右被俘。击退“猪湾登陆”提升了卡斯特罗在古巴的声望。\n\
    \n### 古巴导弹危机\n\n1962年，苏联在古巴布下用来发射核弹头的弹道导弹，这导致美苏关系进一步紧张，核战争一触即发。最终，苏联将导弹撤出了古巴。\n\
    \n1960-1970年代，是卡斯特罗的黄金生涯，他的第二个时期，也是他最辉煌的十年。由于在苏联的经济援助下，基本实现了温饱，并且还实行了全民免费医疗和免费教育。卡斯特罗的声望在这段时间达到了顶点。\n\
    \n但《时代周刊》认为，医疗与教育免费，并不代表当时的古巴的医疗境况是好的。因为当时有“冷战”大背景，来自苏联的援助，卡斯特罗才有底气实行免费的医疗和教育。\n\
    \n而美国当时对古巴实行经济制裁，这也掩盖了卡斯特罗时代失败的经济政策，因为他可以把美国，作为本国经济不振的替罪羊。\n\n1980年代，古巴革命开始走下坡路。\n\
    \n- 一是经济停滞，古巴最主要的经济命脉——蔗糖出口，不足以维持整个古巴的运转。\n- 二是人才外流，1980年代，有125000左右的古巴人逃到了美国的佛罗里达，这些人有很大一部分受过高等教育。苏联垮台，古巴也在经济上失去了最大的援助。\n\
    \n由于身体原因，2008年，卡斯特罗将权力交给了弟弟劳尔·卡斯特罗。劳尔·卡斯特罗掌权后，改变了许多卡斯特罗原本奉行的政策。比如允许美国游客来古巴大量消费，并且在2015年恢复了同美州的邦交。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_31_0.png)\n\n### 知识清单\n\n《财富》杂志由《时代周刊》的创办者亨利·卢斯创办，至今已经有将近90年的历史。杂志主要经营指导问题的研究，被称为“职业经理人的指导手册”。\n\
    \n《财富》杂志1954年推出“全球五百强企业排名”，之后成为了在金融界、商界关注的焦点，它是一本在金融界和商界非常有影响力的杂志。\n\n《财富》杂志推出的这份“年度商业人物榜单”的独特之处而在于，这份榜单并不是根据财富的多少和或者公司排名，榜单评估的是公司领导者或CEO有没有深刻地影响整个商业社会的能力，能否制定大胆和富有远见的战略，以及他们是否交出了一份令人满意的成绩单。\n\
    \n《财富》2016年年度商业人物排名的前三名分别是：\n\n- 第一名，Facebook总裁扎克伯格；\n- 第二名，亚马逊CEO杰夫·贝索斯；\n- 第三名，美国美容产品连锁店Ulta\
    \ Beauty CEO玛拉·司伦。\n\n另外，谷歌的母公司Alphabet的CEO拉里·佩奇排在第四，苹果公司CEO蒂姆·库克排在第十一位。\n\n此外，还有四位中国商业人物上榜，马云排在第十位，王健林排在第六十位，马化腾排在第十八位，而中国排名最高的商业人物，是“滴滴出行”的创始人兼CEO程维，排在第八位。\n\
    \nFacebook在扎克伯格的带领下，已经拥有18亿用户，16000名员工，市值高达3500亿美金。在过去的四十年里，公司利润涨了整整五倍，而Facebook的股价在两年之内翻了一番。文章的分析认为，扎克伯格的成功，与他三种能力分开：远见、坚韧和商业布局能力。\n\
    \n- 1、远见\n  从哈佛寝室来做Facebook，并在短时间内做到全球这个行业的第二位，没有远见肯定办不到。扎克伯格的远见不止于此，他计划在未来十年里，让全球一半还没有使用互联网的人入口，他能用无人机来布置一个空中的全球网络，以实现自己的计划。\n\
    \n- 2、坚韧\n  扎克伯格虽然被认为是擅长写代码的神童，但他一直非常刻苦，扎克伯格在Facebook聚集了一群人才，通过不停探讨来测试自己的想法。\n\
    \  作为一个全球顶尖公司的创始人兼CEO，他对自己的要求始终非常高。正是这种坚韧不拔，帮助他在商业上一直精进。\n\n- 3、商业布局能力\n  扎克伯格只要认准了一个投资领域，就会大胆坚持，不惜斥巨资收购。\n\
    \  比如，Facebook在2012年花10亿美金收购了Instagram，2012年Instagram的营收有望达到25亿美金。2014年Facebook又以190亿美金天价收购了WhatsApp，这个产品如今已经帮Facebook在一些新兴领域，取得了非常有力的战略领先地位。\n\
    \n文章认为，耐心总会是有回报的，哪怕是一家匆忙成长的年轻公司。\n\n榜单上排名第五的是微软CEO纳德拉。2014年纳德拉接替鲍尔默成为微软CEO，此前他已经在微软整整工作了24年。\n\
    \n纳德拉接手微软的时候，微软已经到了生死存亡的关头，陷入了“增长危机”。\n\n2010年，苹果公司在乔布斯的带领之下，抢走了微软“世界上最有价值公司”的头衔，这个节点也成为微软首次面临核心业务下滑的转折点。\n\
    \n纳德拉为了带领微软走出困境，做的最重要的一件事，就是改变微软的核心业务。\n\n之前的微软专注于个人计算机（PC）领域，纳德拉将微软的核心业务转为专注于企业和云计算。\n\
    \n## 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_31_1.png)\n\n> 灵感通常不会自己来找你，你之所以会有灵感，是因为你一直在思考这件事，并且还跟很多人讨论了很久。\n\
    > ——马克·扎克伯格\n\nIdeas typically do not just come to you. They happen because you've\
    \ been talking about something or thinking about something and talking to a lot\
    \ of people about it for a long period of time.\n—Mark Zuckerberg\n\n## 本期杂志：《财富》\n\
    \n这是一本已经有近90年历史的老牌商业杂志，内容主要聚焦于经济及商业领域。《财富》杂志的宗旨是“做成一本对经理人的指导手册”。\n\n## 下期预告：《哈佛商业评论》\n\
    \n有钱就能做慈善吗？慈善究竟应该怎么做，才能最有效地帮助到那些需要帮助的人？\n\n## 有钱就能做慈善吗？\n\n本条音频及文稿参考《哈佛商业评论》12月刊\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_32_0.png)\n\n### 知识清单\n\n英语里，“慈善家”一词对应的是“Philanthropist”，这个词来源于希腊语。原意是对“人类的热爱之情”。慈善家指的是那些期望通过自己的付出，让人类社会变得更好的人。\n\
    \n文章认为，挣钱是困难的，把钱用正确的方式捐赠出去，比挣钱更困难。也就是做慈善、做慈善家，靠钱未必就能实现。\n\n文章提出了一个观点，就是如果“做慈善”只是靠不停捐款，并且认为钱撒出去就能改变世界的话，那人类文明可能早就\n\
    不存在了。\n\n慈善并不是捐钱这么简单，传统的慈善方式造成的后果，可能会适得其反带来破坏作用，因此“捐钱”这种慈善方式在一些地方，反而遭到了被帮助对象的抵制。\n\
    \n现有的慈善捐赠主要有三种途径：直接捐款、投资创业公司、捐钱给慈善组织。\n\n- 1、直接捐款\n  effects往往较差，Facebook的创始人扎克伯格曾为美国新泽西州纽瓦克市的公立学校捐赠了1亿美元，意图在5年内扭转公立学校颓败的状况，但最终没能成功。\n\
    \n- 2、投资创业公司\n  这需要很好的判断力，没有投资经验，很难判断项目是否能成功。\n\n- 3、捐款给慈善组织\n  这条看似最快捷可行的道路，也有问题，就是慈善活动不一定能够达成发起时的初衷，不一定能够真正帮助到那些需要帮助的对象。\n\
    \n2014年的一份对于贫困问题的调查研究显示，慈善组织这种为贫困国家捐款资金物资的方式，其实是造成这些国家始终处于贫困状态的重要原因。\n\n当资金和免费物资源源不断地从发达国家输送过来的时候，这个受资助的地区最后必然发展不起来，这主要是因为：\n\
    \n- 1、这些输送使得当地人对免费捐赠更有依赖性。\n- 2、受资助的国家和地区可能再也无法建立起自己的农业和工业，甚至当地原来比较成功的产业也会受到影响，无力参与国际市场的竞争。\n\
    \n文章认为，对于这些贫困地区和国家来说，不应只是给予他们免费的物资和金钱，更要帮助他们建立可持续的贸易和工业体系。这才是积极做慈善的方式，也是贫困地区和国家最需要的。\n\
    \n文章认为，对于资金有限，无法像比尔·盖茨那样支配海量资金成立慈善基金会的现代慈善家，可以尝试“罗宾汉法则”，这个法则取自一本名为《智慧行善的罗宾汉法则》的书。\n\
    \n“罗宾汉法则”\n简单来说，就是使用成本效益分析法来做慈善。具体来说，就是先建立一个最终的目标，比如3年内要把某个贫困地区失学儿童的数量减少一半，接下来，将这个大目标拆分成各个可操作的小目标，一个个落实执行。然后设立节点，每到一个节点进行结果分析，看小目标是否实现。也就是说，做慈善就如同赚钱一样，也需要讲究方法和步骤。\n\
    \n## 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_32_1.png)\n\n> 别人免费送的是鞋是能让我们穿一段时间，但比起免费的鞋，我们更想要一个能自己造鞋的工厂。\n\
    > ——《哈佛商业评论》\n\nThe free shoes sure were nice for a while, but we'd really like\
    \ to build our own shoe factory instead.\n— Harvard Business Review\n\n本期杂志：《哈佛商业评论》\n\
    \n创刊于1922年，“哈佛商学院”标志性杂志，致力于给全世界管理专业人士，提供缜密的管理见解和最有用的管理案例。\n\n下期货预告：《彭博商业周刊》\n\
    Paypal 创始人、硅谷“教父级”创业导师、畅销书《从0到1》的作者彼得·蒂尔会如何寻找下一个像扎克伯格一样的商业天才？\n\n## 彼得·蒂尔寻找下一个扎克伯格\n\
    \n本条音频及文稿参考《彭博商业周刊》（英文版）12月5日记\n\n![](img/2b1f55794a32401f6e1d5425100884b9_33_0.png)\n\
    \n### 知识清单\n\n《彭博商业周刊》原名为《商业周刊》，杂志创刊于1929年，是世界顶尖商业杂志之一。2009年，美国彭博资讯公司收购了《商业周刊》，将杂志改名为《彭博商业周刊》。\n\
    \n彼得·蒂尔 硅谷“教父级”创业导师和投资人，PayPal创始人，Facebook的首个外部投资者，著有畅销书《从0到1》。彼得·蒂尔鼓励有想法的年轻人，不要念大学，抓紧时间出来创业。并为此提供资金支持，创立了“1517基金会”。\n\
    \n1517基金会 “1517”指的是公元1517年。这一年，著名的宗教改革家马丁·路德发表了《九十五条论纲》，反对教会出售赎罪券敛财的行为，揭开了欧洲宗教改革的序幕。\n\
    \n彼得·蒂尔认为，申请为高等教育学位的追求非常盲目，大学颁发的学位证书，同16世纪教会卖的“赎罪券”一样，是一种投机手段，对于年轻人并没有帮助。彼得·蒂尔希望这个基金会像马丁·路德一样，向他认为无用的大学学位证书宣战，寻找真正厉害的年轻创业者。\n\
    \n“1517基金会”有2000万美金的体量，迄今为止，已经为30个项目的创业者，发放了550万美金的资助。 此外，这个基金还发出了60笔约1000美金的小额赠款，作为搜寻创业项目的人才的成本。\
    \ 目前基金会投出的项目包括智能手机、3D打印以及疾病治疗等。\n\n“1517基金会”也不完全排斥有学历的大学生态。 基金会的两个管理者经常来大学同大学生们进行接触，搜寻好的创意和项目。但是“1517基金会”的管理者们还是坚持，正规学历教育就是桎梏，他们正在做的，其实是解开大学生戴的手铐，让他们做一些真正对科技进步有贡献的事。\n\
    \n自从Facebook大获成功以来，许多投资机构和企业都希望能自己找到像彼得·蒂尔一样的少年天才，他们的思路，是希望自己一抓一个准。而彼得·蒂尔的思路是广撒网。他认为失败很正常，哪怕90%的创业项目最后都会失败，他也愿意承受这种风险。跟有想法和创意的年轻人保持良好的关系，构建一个联盟一样的组织才是重要的。\n\
    \n文章给出的数据显示，2009年到2015年间，2000名融资额超过2000万美金的创业者，其中94人，也就是4%的人没有大学文凭。 猎头公司的数据也显示，大多数公司都希望招聘名校的毕业生。有个“猎头”指出，每个你看到的“扎克伯格”背后，都有1000名甚至更多的失败者，只是你从来没有听到过他们而已。\n\
    \n彼得·蒂尔思维方法很独特。他认为，大部分人相信的真相往往没有价值，只有发现大部分都不相信的真相，才能创造价值。 当年在和埃隆·马斯克打对台时，为了结束恶性竞争实现共同获益，他主动提出将自己创办的电子支付公司PayPal同埃隆·马斯克的同类型公司X.com合并。\n\
    \n彼得·蒂尔还成功预测了2000年互联网泡沫的破灭，从而顺利躲过了股灾。在这次美国总统大选中，硅谷“一边倒”地支持希拉里的情况下，彼得·蒂尔支持了特朗普，并成为其在旧金山的竞选代表，笑到了最后。\n\
    \n彼得·蒂尔最被人津津乐道的投资案例，是2004年作为首个外部投资者，投给了Facebook 50万美金，获得了当时Facebook 7%的股份，现在这笔投资的价值已经涨了2000倍不止。\
    \ 而当年彼得·蒂尔投资扎克伯格，是因为扎克伯格见他的时候穿着非常随便。彼得·蒂尔认为，如果一个人穿正装去见投资人，是为了讨好别人，他反而会投资穿着随便的人。\n\
    \n彼得·蒂尔不只是一个创业导师和投资人，还是一个国际象棋高手，在全美的国际象棋排名中位列前十。下棋需要深入的思考和布局，这也是彼得·蒂尔在商业上展现出来的能力。\n\
    \n## 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_33_1.png)\n\n> “最‘反主流’的行动不是抵制潮流，而是在潮流里不丢失自己的独立思考。\n\
    > ——Paypal创始人、硅谷‘教父级’投资人 彼得·蒂尔\n\nOur most anti-mainstream action is not to resist\
    \ the trend, but need not to be lost in the torrent of his own independent thinking.\n\
    — Peter Thiel\n\n## 本期杂志：《彭博商业周刊》\n\n全球著名商业杂志，其前身是1929年创刊的《商业周刊》，2009年出售给彭博社正式更名为《彭博商业周刊》。《彭博商业周刊》是全球发行量最大的商业杂志之一。\n\
    \n## 下期预告：《读者文摘》\n\n美国老牌杂志《读者文摘》（Reader’s Digest）的作者近距离观察了美国黄石公园的狼群是如何做狼群领袖的，这番观察颠覆了人们对狼的固有印象。\n\
    \n## 成为“头狼”一样的管理者\n\n本条音频及文稿参考《读者文摘》2016年年度合刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_34_0.png)\n\
    \n### 知识清单\n\n美国《读者文摘》是一本家庭月刊，1922年创刊，是世界上最畅销的杂志之一。\n\n根据美国市场研究机构的调查，在美国家庭年收入超过10万美元的中产阶级家庭群体中，《读者文摘》的读者数量，比《财富》、《华尔街日报》、《商业周刊》三大刊物加起来还多。\n\
    \n这篇文章主要讲述的是人类对狼群的观察。\n\n狼和人有相似之处，二者都是群居动物，有清晰的社会结构，并且都追求拥有社会地位。\n\n狼在人类社会中的评价很高，代表强悍又智慧的生物，有些民族还有“狼崇拜”情结。\n\
    \n在美国印第安人中，有一种符号叫“狼迹”，这种符号由两只狼的脚印构成，象征着“方向”和“领导能力”。而中国内蒙古草原上的游牧民族，把狼视为他们的“兽祖”。\n\
    \n“头狼”是整个狼群的领导者，“头狼”在狼群里的地位，就相当于人类组织机构里领袖的角色。人们在提到“头狼”时，往往想到的都是“征服”、“野性”、“侵略”这样的描述。\n\
    \nAlpha Male\nMale 是雄性的意思，Alpha 就是指狼群里的头狼。Alpha Male 在英文里代表着“雄性领导者”和“群体领袖”。\n\n\
    本文的作者、资深狼类研究者麦金泰尔认为，将头狼和“侵略”、“野性”这种印象联系起来，是一个非常大的错误。\n的确整个族群的头狼，在对外作战时，的确非常强悍，但头狼对狼群内部的管理，既不是强势的姿态也不是征服的态度，甚至不带侵略性。\n\
    头狼的这种特点，符合进化的规律。狼群协作精神的本质，是为了更好地生存。\n头狼身上，存在有两个有趣的特质。\n\n首先，头狼在狼群中扮演的，并不是一个强硬的控制器角色，相反，它是一个宽厚仁慈的家长。\n\
    文章举例说，头狼带领狼群捕猎成功后，它退到旁边，等其它狼都吃饱了，自己才开始吃。\n而头狼面对自己的狼群时，不像它对外展现的那样，带着强烈的攻击性和侵略性，它把其他的狼视为自己的兄弟、后代。\n\
    头狼这种对狼群的管理方式，在群居动物里是很独特的。\n\n其次，头狼并不是整个狼群实际事务的管理者，实际管理者“另有其狼”。\n生物学家们过去认为，头狼是狼群中“说一不二”的大头目，现在却发现，狼群中的管理分两条线，头狼管的是所有雄狼，主要承担的是征战、保护族群这样的任务。\n\
    而狼群的内部事务，由“雌头狼”管理，它决定诸如什么时候迁移、什么时候休息、什么时候打猎。“雌头狼”的性格，奠定了整个狼群的基调。\n也就是说，头狼是狼群的精英领袖，雌头狼才是狼群内部主持大局的总管家。\n\
