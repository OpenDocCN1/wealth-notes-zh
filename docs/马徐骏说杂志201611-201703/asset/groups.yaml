  md: "\n# 变革性的商业模式\n\n本文源自《哈佛商业评论》10月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_0_0.png)\n\
    \n## 今日金句\n\n新技术只是促使行业转型的因素，真正令行业转型的，是把新技术和市场需求结合在一起的商业模式。\n\n## 知识清单\n\n什么是商业模式？——一个公司创造和获取价值的方式就是商业模式。\n\
    \n你无法保证创新的成功，但你可以使你的商业模式与新兴技术紧密结合。二者结合得越紧密，你就越可能改变整个行业，从而脱颖而出。\n\n新商业模式需要具备的六大关键要素\n\
    \n### 关键要素一、定制化程度更高的产品或服务\n\n（A more personalized product or service）\n\n很多新商业模式提供的产品或服务，与传统的商业模式相比，更能满足顾客个人当下的需求。采用了变革性商业模式的公司经常利用技术和有竞争力的价格来实现这一点。\n\
    \n### 关键要素二、闭环流程\n\n（A closed-loop process）\n\n很多模式用闭环替代了产品“制造——使用——丢弃”这样的线性消耗流程，使产品可以循环使用。这个转变降低了资源的总成本。\n\
    \n### 关键要素三、资产共享\n\n（Asset sharing）\n\n一些创新之所以能成功，是因为他们实现了最大的资产共享。比如 Airbnb 就使房屋主人可以和旅客分享他们的住宅，Uber\
    \ 就使车主跟别人分享自己的车。有时资产共享也可以通过供应链实现。这种共享主要通过双边在线平台，为双方解锁了价值：我通过出租闲置的房间赚钱，你得到了一个价格更低、也许环境更好的住处。\n\
    \n资产共享也降低了很多行业的门槛，因为进入者不需要拥有共享的资产，只需要充当中介即可。\n\n# 影响美国大选的“性骚扰”案\n\n![](img/2b1f55794a32401f6e1d5425100884b9_1_0.png)\n\
    \n## 今日金句\n\n“仲裁条款”为美国公司节省了大量的金钱、时间和人力，但却损害了普通人的利益，是美国法律中经常被指责的存在。\n\n## 知识清单\n\
    \n格雷琴·卡尔森（Gretchen Carlson）前“福克斯新闻频道”（Fox News）资深女主持；1989 年当选“美国小姐”；主持福克斯新闻的王牌节目《真实的故事》长达\
    \ 11 年；2016 年 7 月，格雷琴对“福克斯新闻频道”的 CEO 罗杰·艾尔斯提出指控，称“自己因为拒绝了艾尔斯的要求，以及抱怨艾尔斯严重的性骚扰，职业生涯被终结”。\n\
    \n2006 年，美国女性上法庭打“性骚扰”官司，平均得到的赔偿金将近 22 万美金，但如果“性骚扰”事件用仲裁来解决，大概平均只能得到 3 万美元的赔偿金。\n\
    \n据美国公平就业委员会（EEOC）2016 年的调查显示，至少有 25% 的女性表示她们在工作场所遭受过“性骚扰”，但真正会对簿公堂的，极少。女性会顾虑在单位里面很难立足，受人白眼，甚至有女性害怕因为控告，给自己带来更多的“性骚扰”。\n\
    \n美国“性骚扰”案很少上法庭，最核心的原因是——仲裁条款。\n\n仲裁条款，是指当事人在合同中订立的，将今后可能因为该合同所发生的争议，提交仲裁的条款。\n\
    \n“仲裁条款”无处不在，不仅存在于格雷琴·卡尔森数百万美元级别的雇佣合同中，普通民众的雇佣合同、银行开户的协议，甚至在收费电视频道的协议中，都有“仲裁条款”的存在。\n\
    \n“仲裁条款”规定，有纠纷的双方通过仲裁公司来解决矛盾，而这些仲裁公司有时候仅仅是靠雇请退休的法官来判决案件。\n\n![](img/2b1f55794a32401f6e1d5425100884b9_1_1.png)\n\
    \n## 知识加餐\n\n福克斯新闻台 9 月 6 日表示，已经就前女主播格雷琴·卡尔森（Gretchen Carlson）指控前 CEO 罗杰·艾尔斯“性骚扰”案达成和解，并为此致歉。据报道，双方和解金额为\
    \ 2000 万美元。根据《纽约时报》的报道，罗杰·艾尔斯已经在 7 月 21 日宣布离职，他可能将拿到 4000 万美金（约合人民币 2.6 亿元）的补偿金。\n\
    \n美国政治里有一个表达叫做“October Surprise”（十月惊奇），指的是在 11 月大选投票之前，两党都会特意（而且是利己地）安排好时间爆出新闻，提供能改变投票者想法、影响民意调查的证据，而此时不管证据是否真实，对方都不太有时间机会去挽回局面。\n\
    \n希拉里是民主党总统候选人，川普是共和党总统候选人，福克斯新闻频道是共和党的传播阵地。结合二人“仲裁条款”上的立场，此时爆出对共和党不利的“福克斯丑闻”，难免让人认为，其中别有深意。\n\
    \n本期杂志：《时代周刊》\n\n创刊于 1923 年，是美国三大时事周刊之一。它因“为高端忙碌人士，提供高效而深入的新闻报道”而著名。\n\n# 希拉里是美国“最好的希望”？\n\
    \n本文源自《经济学人》11 月 5 日刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_2_0.png)\n\n\
    ## 今日金句\n\n经济环境的改变，以及曾经被珍视的传统的衰落（例如家庭、教会、工会等），都导致了美国工薪阶层的一种恐惧，那就是他们以及他们的孩子，会无法适应这个变化的世界。\n\
    \n本次美国大选的核心问题只有一个：种族问题。\n\n## 知识清单\n\n希拉里的支持者，主要来源于非白人群体、受过高等教育的人群，以及美国的 Y 世代群体。\n\
    \nY 世代（Y Generation）也称为千禧世代（Millennials），是指出生于 1980 年到 2000 年之间的人。在美国，约有 7600\
    \ 万人是 Y 世代。\n\n一般认为，川普的支持者主要来自中下层的工人阶级。在中下层工人那里，川普的支持率确实碾压希拉里，但实际上，这部分人只占川普支持者的\
    \ 1/3，绝大多数支持川普的人，是家庭年收入 4~6 万美元的人，他们属于美国的中产阶级。绝大部分支持川普的人，不但不生活在美国贫困线的上下，甚至还有不少来自比较富裕的家庭。\n\
    \n## Closer\n\n支持率 单位：百分比\n\n![](img/2b1f55794a32401f6e1d5425100884b9_2_1.png)\n\
    \nSources：Huffington Post；The Economist\n\n川普身上有一个极其鲜明的标签——他是自 1960 年的乔治·华莱士之后，美国总统候选人里，种族歧视最严重的一个。\n\
    \n支持川普的人，大多是对美国历史上“第一位黑人总统”奥巴马怀有敌意的白人，他们在川普的支持者里能占到 60% 的比例。\n\n## Turning up\n\
    \n美国总统大选的投票率中各民族所占的百分比\n\n![](img/2b1f55794a32401f6e1d5425100884b9_2_2.png)\n\n\
    Source：United States Elections Project\n\n希拉里是美国“最好的希望”，不因为她在处理国内外政治问题上有经验，最重要的是，是因为希拉里是一个渐进主义者，她不相信激情澎湃的大革命后，所有问题就能在一夜之间都解决掉。她相信的是，只有一点一点的变化，才能最终达成目标。\n\
    \n本期杂志：《经济学人》\n\n1843 年创刊于英国，是世界上最著名的政经类杂志，被视为西方精英必读读物。\n\n下期预告：《快公司》\n\n![](img/2b1f55794a32401f6e1d5425100884b9_2_3.png)\n\
    \n特斯拉的电动车颠覆了汽车行业，使它成为行业的领跑者。《快公司》的文章告诉我们，特斯拉是如何利用自己独特的销售模式，帮助特斯拉走入了汽车行业的“快车道”。\n\
    \n# 特斯拉如何切入销售快车道？\n\n本文源自《快公司》\n\n![](img/2b1f55794a32401f6e1d5425100884b9_3_0.png)\n\
    \n你好，欢迎来到《马斯克说杂志》。\n\n今天，我为您从 Fast Company 也就是《快公司》杂志里面选了一篇跟特斯拉有关的文章。\n\n咱们先来简单介绍一下《快公司》，这是一本商业杂志，主要是告诉读者，如何在全球商业模式中获得领先，就是在竞争中怎么样才能胜出，所以它会关注那些高速成长的新兴企业。既像特斯拉这个领域，就是快道的信息，在快车道上，也是近几年商业领域绕不开的一个话题。\n\
    \n首先，特斯拉在电动车行业里做出的革新，我们很多人都知道，但这篇文章叫《特斯拉的快车道》，它讲的并不是特斯拉造车的方式，它要告诉你的，是特斯拉在汽车销售上也要刮开新风的，有自己的一套直营模式。英语的“Fast\
    \ Lane”是快车道的气息，在快节奏上你可以知道油门通过其他车，对上这个词指忙碌而刺激的生活，在这里是个极好的双关语。特斯拉在汽车销售上，比其他行业更彻底，面临的挑战就更多了，也真的够刺激的。\n\
    \n文章的主笔是 Fast Company 的资深编辑 JJ.McConvey，下面我们就分享下这篇文章里提到的，特斯拉在汽车销售领域有些什么独到之处。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_3_1.png)\n\n文章讲了两个问题：\n\n- 第一，特斯拉的营销模式到底是什么，以及跟美国传统的卖车方式有什么区别；\n\
    - 第二，特斯拉的这种方式在美国又遭遇了什么问题。\n\n咱们先来说第一个问题，特斯拉的营销模式到底是什么。\n\n美国一般传统的卖车方法是采用代理的方式，就是汽车制造商把车造好了之后，先卖给各个区域的代理商，再由这些代理商把汽车卖给消费者。特斯拉模式就不一样，它采取的是一种直售的模式，就是线上订购与线下的直营体验店相结合，这种方式，越过了经销商的网络。\n\
    \n特斯拉美国销售副总裁 Ganesh 认为，这种方式是非常重要的，因为只有这种方式才能保证销售模式的完整性，把特斯拉的使命与价值完全地传达到终端客户手中，而且在整个服务过程中每一个环节都不会打折。\n\
    \n特斯拉目前采取了 5 种展示和销售的方式，咱们一个一个来说。\n\n1. 体验店\n\n   进店体验店你既可以试驾也可以购买，同时店里还提供充电、维修这样的服务。\n\
    \n2. 展示厅\n\n   这个跟体验店差不多，只是在这种展示厅里面，你是不能直接买车的，如果问价格，你就会转到网站或者找销售。\n\n3. 直营店面\n\
    \n   在这种店里可以进行真的购买，前提是特斯拉要美国的当地的这个，有销售许可才可以。你听了前两个也许会觉得：差不多嘛，为什么要区分两种模式？这个咱们要到第二部分再讲。\n\
    \n4. 游击店\n\n   什么意思？就是我们打“游击战”的那个“游击”，英文叫 Pop-up shops。Pop-up 就是突出出现的意思，这种形式主要在美国消费者眼里不太常见，比如说在北京上海这样的大城市，在人流密集的\
    \ CBD、或者商场，突然有个集装箱过来，里面既没有车也没有销售人员，给你介绍，这种在商业区快闪店，设置的店箱来销售品牌的模式叫做“游击店”。\n\n5.\
    \ 网站\n\n   其网站才是特斯拉的销售核心，作为消费者可以在线预约试驾或者进行购买，这种方式添加销售的方式就是特斯拉的直营模式。\n\n那么这种直营模式在美国反响如何呢？答案是非常好！受到了美国顾客的青睐，文章中也说，在\
    \ 2015 年埃德曼（著名营销咨询公司）的调查中，75% 的受访者都支持特斯拉的这种体验很好，因为（消费者）既可以看到了解特斯拉的生产过程，同时价格也很透明，不用担心体验。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_3_2.png)\n\n中国有句老话叫“木秀于林，风必摧之”。这一路从\
    \ fast lane 快车道上走来，高速成长的特斯拉也的确树敌不少。那么这场对于汽车产业未来的争夺，到底谁胜谁负呢？我们作为消费者，只能等待时间来证明了。\n\
    \n## 知识清单\n\n特斯拉电动车的直营模式，越过了经销商网络，保证了销售体验的完整性。\n\n美国传统的销售方式依然采取代理方式，即汽车制造商把车卖给各个区域的代理商，这些代理商再去销售这些汽车。\n\
    \n特斯拉的销售方式：\n\n- 体验店 (Showrooms)\n- 展示厅 (Galleries)\n- 游击店 (Pop-up shops)\n- 网站\
    \ (Website)\n- 直销店面 (Department stores)\n\n目前特斯拉直营模式的问题主要来自两个方面：\n\n1. 第一，美国本土的法律问题\n\
    2. 第二，来自于经销商和竞争对手的追赶与阻击\n\n目前美国的汽车制造商反而被分销模式所拖累，这在全球市场也是别无二家的。\n\n特斯拉现在需要做的，是找到更广的渠道合作，把产品展示给更多的顾客，来打动消费者。\n\
    \n## 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_4_0.png)\n\n特斯拉不仅开创了电动车制造业的先河，更颠覆了美国汽车的销售模式，木秀于林，特斯拉一路也树敌不少。\n\
    \n——《快公司》\n\nTesla isn’t just making groundbreaking electric vehicles. It’s expending\
    \ the way cars are sold across the country. And it’s making a few enemies along\
    \ the way.\n\n— Fast Company\n\n![](img/2b1f55794a32401f6e1d5425100884b9_4_1.png)\n\
    \n## 本期杂志：《快公司》\n\n著名的前沿商业媒体，也是世界历史上成长最快的媒体品牌。创刊 18 年的《快公司》，已经成长为全球三大财经商业媒体之一。\n\
    \n## 下期预告：《连线》\n\n针对网络暴力，谷歌发动反击，实施反制计划，这能改变现状吗？\n\n# 谷歌对网络暴力的技术性反击\n\n本文源自《连线》（英国版）11\
    \ 月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_5_0.png)\n\n## 知识清单\n\n### 网络巨魔（Internet\
    \ Troll）\n\n指在网络世界中，用侮辱性语言挑起骂战，并从中获得莫名快感的人。\n\nTroll 是一种源于北欧神话的怪物，体型巨大，头脑简单，暴力嗜血。在暴雪公司的大型网游《魔兽世界》中，“巨魔族”的英文即为\
    \ Troll。\n\n### 拼图组织（Jigsaw）\n\n原谷歌的智库，今年 2 月改名为“拼图”，Jigsaw 的一种词义就是指拼图，也可以用来表示“错综复杂”的形式。\n\
    \n拼图组织（Jigsaw）即将推出一个“人工智能对话系统”，利用算法和机器学习能力，自动识别网络上的侮辱性言论和骚扰。比关键字过滤准确，也比人工识别要快得多。\n\
    \n### 登月级别计划（Moonshot）\n\n在谷歌内部，把所有听起来疯狂、夸张、需要花费大量时间和精力来实现的计划，都称之为“登月级别计划”。例如：谷歌眼镜、无人驾驶汽车、模块化手机等。\n\
    \n### 不作恶（Don’t be evil）\n\n谷歌公司非正式的公司口号，全文是“完美的搜索引擎，不作恶”，1999 年提出，沿用至今。\n\n##\
    \ 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_5_1.png)\n\n> 谷歌正试图保护网上的弱势群体，但行善比“不作恶”要困难得多。\n\
    \n——《连线》\n\n> Google is on a mission to protect the internet’s most vulnerable,\
    \ but doing good is harder than “Don’t be evil”.\n\n——WIRED\n\n您好，欢迎来到“乌鸦说读杂志”。\n\
    \n今天给您分享来自美国《连线》杂志的一篇报道。咱们之前讲过的《哈佛商业评论》、《经济学人》、《快公司》，都是领域前沿、个性鲜明的相对刊物，而《连线》杂志也是美国人相对比较熟悉的。这是一本科技类的杂志，被誉为“极客的圣经”。它关注的是科学技术应用于未来和人类生活的各个方面，并对文化、经济和政治产生影响。\n\
    \n这本杂志经常会影响到一些我们耳熟能详的概念和名词，比如“长尾效应”、“众包”的概念，都是《连线》杂志首先提出来的。\n\n今天说的虽然不是本期的封面文，却是一篇内容很棒的专题报道，说的是谷歌公司在酝酿的，一个对抗网络审查和暴力的计划，很值得一讲。\n\
    \n文章里说，现在社交网络越来越发达，在万丈光芒下，总会有黑暗的影子存在，如今在欧美网络上，类似 Facebook、推特这样的网站以及论坛上，有一种被称为“网络巨魔”的人，英文叫\
    \ Internet Troll，这种“网络巨魔”指的是，跟自己想不同的观点，实施网络暴力。主要是骂搞、侮辱，极端的，甚至会进行人身威胁。\n\n比如说，美国有一个女脱口秀主持人叫\
    \ Leslie Jones，是个黑人，她的头像被一些种族主义者，在网上给她做了一个黑猩猩的图片，还在她脸上 P 了很多黑白液体，就是很有侮辱性的那种，你懂的。\n\
    \n还有更极端的，比如一些专栏作家，因为自己发表的政治言论，而在社交网络上受到了极端分子的攻击，有扬言要一根根拔掉其头发的，有威胁要掠夺其器官的，更夸张的，还有说要暴人家只有一岁的女儿的。最后这些专栏作家不得不关闭了自己的所有社交网络账号，彻底离开了虚拟的网络世界。\n\
    \n文章的论点是，你作为“网络暴力”的受害者，好像像是进了一个广场，广场上有 5 万人，就你像进现在，在你。你光会着全世界对你都有敌意，那你首先肯定是闷骚，甚至你可能就觉得自己的生命都受到威胁了，你要保命，你得逃跑。\n\
    \n这不仅会造成非常大的心理伤害，而且会导致这些人从此有心理阴影，发东西之前先自我审查，这个不敢说，那个不敢讲，要么干脆就不再在网络上表达发表自己的观点了。\n\
    \n其实这种“网络暴力”现象，我们中国人并不陌生，只是在我们这儿对这些“网上暴力”分子，不叫“网络巨魔”，有别的称呼，比如“键盘侠”之类的。\n\n这些年来，类似\
    \ Facebook、YouTube 这些社交媒体和网站，对这种网络暴力的主要手段，都是让用户体验出侮辱性的言论，进行举报，再由他们的员工进行处理，而这些处理问题的员工，也都是外包到像菲律宾这样的“第三世界国家”，一个是因为他们讲英语，还有就是因为人比较便宜。\n\
    \n但这样的处理方式，首先人力成本很高，而效率又非常低下；其次，对于处理这些侮辱性言论的员工来说，整天看着这些负能量的东西，他们的身心也会受伤害。\n\n\
    所以作者认为，这种方式对大规模的网络暴力，基本没什么用。\n\n而最近谷歌一个叫“拼图”的团队，英文叫 Jigsaw，即将要推出一个新项目叫做“人工智能对话系统”。这个项目主要是利用技术和机器学习能力，来自动识别网络上的侮辱性言论和骚扰。这个项目一旦做出来，按照他们自己工程师的话说，会比关键字过滤要快得多。同时，又比人工手动处理要快得多。这样就能够非常好地解决“网络巨魔”问题。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_6_0.png)\n\n这个叫“拼图”的团队，前身是谷歌的一个智库，成立于\
    \ 2010 年。今年 2 月份才改名叫“拼图”。那个机构谷歌之前都做过些什么事儿呢？他们在网络安全方面做的确是做过一些事情的，就比如说在谷歌的 Chrome\
    \ 浏览器里做一个插件，你如果在浏览一些有危险的网站，对方要输入你的谷歌账号和密码，这个插件就会跳出来提醒你，让你小心。\n\n还有比如极端组织“伊斯兰国”，在网上招募志愿者，号召人来加入他们，智库就做了程序，来反制“伊斯兰国”的这种网络攻势。比如说通过你搜索的关键词看到你有这种极端言论的倾向，它就会把你导入到另外一个页面的页面上，让你看到的是反“伊斯兰国”的言论和视频。据其内部实行下来的效果看，成功率高达\
    \ 70%。\n\n而这个所谓的——人工智能对话系统——其实只是一个“拼图”团队，野心勃勃的项目的一部分。他们最终是要利用 Google 强大的硬件设备和优秀的工程师，做一个\
    \ Moonshot 级别的项目。\n\nMoonshot 也就是登月，在谷歌内部把所有疯狂甚至听起来很夸张，会花费大量时间和精力的计划，叫做“登月级别”项目。比如谷歌眼镜、无人驾驶、模块化手机之类的，都是“登月级”的项目，并拼图“登月级项目”的最终目的是，在十年之内，结束网上的审查制度。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_6_1.png)\n\n他们的想法是，运用人工智能来解决人与人的问题，让人们在互联网上可以更加和谐相处。不但要把互联网技术的潜力往前推进，同时要弥补在整个世界演进过程中，出现的最糟糕的那些东西，比如说像监控、极端的言论，还有审查。\n\
    \n按照作者的说法，“拼图”这个团队，就是谷歌里一个类似于“正义联盟”这样的组织。“正义联盟”就是漫画里面那些超级英雄，像超人、蝙蝠侠，他们组成的“维护世界和平”、“助强扶弱”的这么一个组织。\n\
    \n我们都知道谷歌公司有一句著名的口号，叫 不 作 恶 ， “Don’t be evil”。“拼图”组织启动的这项计划，也说明谷歌公司已经不仅仅满足于他们原来说的“不作恶”了，他们想要做好事。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_6_2.png)\n\n谷歌说，一个人工智能对话的程序，其实是受到了一个游戏公司启发。就是知名的多人网络游戏《英雄联盟》的制作公司，他们从\
    \ 2012 年开始，尝试着在网上，对玩家之间的言论进行监控。如果他们对玩家在游戏的时候，有人聊天用了侮辱性的词汇，那么他们就会对这样的玩家进行警告，然后\
    \ 92% 被警告的玩家，之后都没有再使用这样的言论。就是说，玩家被警告后会收敛和注意自己的言行。\n\n这个计划的实施，主要是依靠“算法”和“机器学习”，也就是\
    \ Machine Learning, “机器学习”，是目录世界上公认的“四大技术趋势”之一，文章里很简单地解释了一下它的原理，就是让程序先标记，什么样的东西是属于“骚扰性”或者“误导性”的言论，然后机器不断学习之后，最终能够很准确地分辨出来。\n\
    \n好意思，你要让机器图分辨什么是猫，给它海量的猫的图案，让它认识猫的特征是什么样的，一段时间之后它熟悉了，就能在众多的图片里面辨认出猫了，就是这么个原理。\n\
    \n那这种方式对于应对网络暴力是不是有效呢？按照文章作者亲身体验，貌似还挺有效的。人工智能对话的程序有个 0-100 的打分机制，来确定用户的言论，是不是侮辱性的言论，一句话的侮辱越高，分数就越高。比如说你输入：怎么样，混球？63\
    \ 分。程序显示：你是个混球，你有 63 分。程序显示 96 分，判定为侮辱性言论，识别率还是挺高的。而且谷歌打算把这项技术，做一个开源，就是任何人都可以应用这样的模型，然后进行开发。以后效率和准确度还会提高。\n\
    \n但是目前对这个项目的担忧也是挺多的，有业内人士指出，因为“拼图”其实是谷歌的一个盈利机构，那么怎么保证言论制定的公平性，而且对于反审查的这种做发有没有可能变成一种新的审查制度呢？\n\
    \n即便是在网上遭受过“网络言语暴力”的那些人，当他们听到这个项目的时候，其实还是很愉快的，很多人说，人们还是需要能够自由表达的空间，因为在这种算法下，你的回嘴也算是危险性言论，一样是要被删除的。有人就说了，如果在网上连“川普是个傻瓜”这样的话都不能说了，那网络还有什么意思啊！\n\
    \n好了，今天跟你分享的是谷歌的“拼图”组织，配部的应对“网络暴力”的计划，也是谷歌内部“登月级”的项目。Moonshot 也就是登月，如果您以后在聊到很长远而且比较难实现的项目时，就可以\
    \ 称 它 为 “ 登 月 级 别 ” 的 项 目，Moonshot, 简洁又精准。\n\n## 本期杂志：《连线》\n\n美国《连线》（Wired）杂志是一份科技类月刊，创刊于\
    \ 1993 年，被誉为“极客的圣经”。\n\n## 下期预告：《经济学人》\n"
  mdcn: "\n# 变革性的商业模式\n\n本文源自《哈佛商业评论》10月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_0_0.png)\n\
    \n## 今日金句\n\n新技术只是促使行业转型的因素，真正令行业转型的，是把新技术和市场需求结合在一起的商业模式。\n\n## 知识清单\n\n什么是商业模式？——一个公司创造和获取价值的方式就是商业模式。\n\
    \n你无法保证创新的成功，但你可以使你的商业模式与新兴技术紧密结合。二者结合得越紧密，你就越可能改变整个行业，从而脱颖而出。\n\n新商业模式需要具备的六大关键要素\n\
    \n### 关键要素一、定制化程度更高的产品或服务\n\n（A more personalized product or service）\n\n很多新商业模式提供的产品或服务，与传统的商业模式相比，更能满足顾客个人当下的需求。采用了变革性商业模式的公司经常利用技术和有竞争力的价格来实现这一点。\n\
    \n### 关键要素二、闭环流程\n\n（A closed-loop process）\n\n很多模式用闭环替代了产品“制造——使用——丢弃”这样的线性消耗流程，使产品可以循环使用。这个转变降低了资源的总成本。\n\
    \n### 关键要素三、资产共享\n\n（Asset sharing）\n\n一些创新之所以能成功，是因为他们实现了最大的资产共享。比如 Airbnb 就使房屋主人可以和旅客分享他们的住宅，Uber\
    \ 就使车主跟别人分享自己的车。有时资产共享也可以通过供应链实现。这种共享主要通过双边在线平台，为双方解锁了价值：我通过出租闲置的房间赚钱，你得到了一个价格更低、也许环境更好的住处。\n\
    \n资产共享也降低了很多行业的门槛，因为进入者不需要拥有共享的资产，只需要充当中介即可。\n\n# 影响美国大选的“性骚扰”案\n\n![](img/2b1f55794a32401f6e1d5425100884b9_1_0.png)\n\
    \n## 今日金句\n\n“仲裁条款”为美国公司节省了大量的金钱、时间和人力，但却损害了普通人的利益，是美国法律中经常被指责的存在。\n\n## 知识清单\n\
    \n格雷琴·卡尔森（Gretchen Carlson）前“福克斯新闻频道”（Fox News）资深女主持；1989 年当选“美国小姐”；主持福克斯新闻的王牌节目《真实的故事》长达\
    \ 11 年；2016 年 7 月，格雷琴对“福克斯新闻频道”的 CEO 罗杰·艾尔斯提出指控，称“自己因为拒绝了艾尔斯的要求，以及抱怨艾尔斯严重的性骚扰，职业生涯被终结”。\n\
    \n2006 年，美国女性上法庭打“性骚扰”官司，平均得到的赔偿金将近 22 万美金，但如果“性骚扰”事件用仲裁来解决，大概平均只能得到 3 万美元的赔偿金。\n\
    \n据美国公平就业委员会（EEOC）2016 年的调查显示，至少有 25% 的女性表示她们在工作场所遭受过“性骚扰”，但真正会对簿公堂的，极少。女性会顾虑在单位里面很难立足，受人白眼，甚至有女性害怕因为控告，给自己带来更多的“性骚扰”。\n\
    \n美国“性骚扰”案很少上法庭，最核心的原因是——仲裁条款。\n\n仲裁条款，是指当事人在合同中订立的，将今后可能因为该合同所发生的争议，提交仲裁的条款。\n\
    \n“仲裁条款”无处不在，不仅存在于格雷琴·卡尔森数百万美元级别的雇佣合同中，普通民众的雇佣合同、银行开户的协议，甚至在收费电视频道的协议中，都有“仲裁条款”的存在。\n\
    \n“仲裁条款”规定，有纠纷的双方通过仲裁公司来解决矛盾，而这些仲裁公司有时候仅仅是靠雇请退休的法官来判决案件。\n\n![](img/2b1f55794a32401f6e1d5425100884b9_1_1.png)\n\
    \n## 知识加餐\n\n福克斯新闻台 9 月 6 日表示，已经就前女主播格雷琴·卡尔森（Gretchen Carlson）指控前 CEO 罗杰·艾尔斯“性骚扰”案达成和解，并为此致歉。据报道，双方和解金额为\
    \ 2000 万美元。根据《纽约时报》的报道，罗杰·艾尔斯已经在 7 月 21 日宣布离职，他可能将拿到 4000 万美金（约合人民币 2.6 亿元）的补偿金。\n\
    \n美国政治里有一个表达叫做“October Surprise”（十月惊奇），指的是在 11 月大选投票之前，两党都会特意（而且是利己地）安排好时间爆出新闻，提供能改变投票者想法、影响民意调查的证据，而此时不管证据是否真实，对方都不太有时间机会去挽回局面。\n\
    \n希拉里是民主党总统候选人，川普是共和党总统候选人，福克斯新闻频道是共和党的传播阵地。结合二人“仲裁条款”上的立场，此时爆出对共和党不利的“福克斯丑闻”，难免让人认为，其中别有深意。\n\
    \n本期杂志：《时代周刊》\n\n创刊于 1923 年，是美国三大时事周刊之一。它因“为高端忙碌人士，提供高效而深入的新闻报道”而著名。\n\n# 希拉里是美国“最好的希望”？\n\
    \n本文源自《经济学人》11 月 5 日刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_2_0.png)\n\n\
    ## 今日金句\n\n经济环境的改变，以及曾经被珍视的传统的衰落（例如家庭、教会、工会等），都导致了美国工薪阶层的一种恐惧，那就是他们以及他们的孩子，会无法适应这个变化的世界。\n\
    \n本次美国大选的核心问题只有一个：种族问题。\n\n## 知识清单\n\n希拉里的支持者，主要来源于非白人群体、受过高等教育的人群，以及美国的 Y 世代群体。\n\
    \nY 世代（Y Generation）也称为千禧世代（Millennials），是指出生于 1980 年到 2000 年之间的人。在美国，约有 7600\
    \ 万人是 Y 世代。\n\n一般认为，川普的支持者主要来自中下层的工人阶级。在中下层工人那里，川普的支持率确实碾压希拉里，但实际上，这部分人只占川普支持者的\
    \ 1/3，绝大多数支持川普的人，是家庭年收入 4~6 万美元的人，他们属于美国的中产阶级。绝大部分支持川普的人，不但不生活在美国贫困线的上下，甚至还有不少来自比较富裕的家庭。\n\
    \n## Closer\n\n支持率 单位：百分比\n\n![](img/2b1f55794a32401f6e1d5425100884b9_2_1.png)\n\
    \nSources：Huffington Post；The Economist\n\n川普身上有一个极其鲜明的标签——他是自 1960 年的乔治·华莱士之后，美国总统候选人里，种族歧视最严重的一个。\n\
    \n支持川普的人，大多是对美国历史上“第一位黑人总统”奥巴马怀有敌意的白人，他们在川普的支持者里能占到 60% 的比例。\n\n## Turning up\n\
    \n美国总统大选的投票率中各民族所占的百分比\n\n![](img/2b1f55794a32401f6e1d5425100884b9_2_2.png)\n\n\
    Source：United States Elections Project\n\n希拉里是美国“最好的希望”，不因为她在处理国内外政治问题上有经验，最重要的是，是因为希拉里是一个渐进主义者，她不相信激情澎湃的大革命后，所有问题就能在一夜之间都解决掉。她相信的是，只有一点一点的变化，才能最终达成目标。\n\
    \n本期杂志：《经济学人》\n\n1843 年创刊于英国，是世界上最著名的政经类杂志，被视为西方精英必读读物。\n\n下期预告：《快公司》\n\n![](img/2b1f55794a32401f6e1d5425100884b9_2_3.png)\n\
    \n特斯拉的电动车颠覆了汽车行业，使它成为行业的领跑者。《快公司》的文章告诉我们，特斯拉是如何利用自己独特的销售模式，帮助特斯拉走入了汽车行业的“快车道”。\n\
    \n# 特斯拉如何切入销售快车道？\n\n本文源自《快公司》\n\n![](img/2b1f55794a32401f6e1d5425100884b9_3_0.png)\n\
    \n你好，欢迎来到《马斯克说杂志》。\n\n今天，我为您从 Fast Company 也就是《快公司》杂志里面选了一篇跟特斯拉有关的文章。\n\n咱们先来简单介绍一下《快公司》，这是一本商业杂志，主要是告诉读者，如何在全球商业模式中获得领先，就是在竞争中怎么样才能胜出，所以它会关注那些高速成长的新兴企业。既像特斯拉这个领域，就是快道的信息，在快车道上，也是近几年商业领域绕不开的一个话题。\n\
    \n首先，特斯拉在电动车行业里做出的革新，我们很多人都知道，但这篇文章叫《特斯拉的快车道》，它讲的并不是特斯拉造车的方式，它要告诉你的，是特斯拉在汽车销售上也要刮开新风的，有自己的一套直营模式。英语的“Fast\
    \ Lane”是快车道的气息，在快节奏上你可以知道油门通过其他车，对上这个词指忙碌而刺激的生活，在这里是个极好的双关语。特斯拉在汽车销售上，比其他行业更彻底，面临的挑战就更多了，也真的够刺激的。\n\
    \n文章的主笔是 Fast Company 的资深编辑 JJ.McConvey，下面我们就分享下这篇文章里提到的，特斯拉在汽车销售领域有些什么独到之处。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_3_1.png)\n\n文章讲了两个问题：\n\n- 第一，特斯拉的营销模式到底是什么，以及跟美国传统的卖车方式有什么区别；\n\
    - 第二，特斯拉的这种方式在美国又遭遇了什么问题。\n\n咱们先来说第一个问题，特斯拉的营销模式到底是什么。\n\n美国一般传统的卖车方法是采用代理的方式，就是汽车制造商把车造好了之后，先卖给各个区域的代理商，再由这些代理商把汽车卖给消费者。特斯拉模式就不一样，它采取的是一种直售的模式，就是线上订购与线下的直营体验店相结合，这种方式，越过了经销商的网络。\n\
    \n特斯拉美国销售副总裁 Ganesh 认为，这种方式是非常重要的，因为只有这种方式才能保证销售模式的完整性，把特斯拉的使命与价值完全地传达到终端客户手中，而且在整个服务过程中每一个环节都不会打折。\n\
    \n特斯拉目前采取了 5 种展示和销售的方式，咱们一个一个来说。\n\n1. 体验店\n\n   进店体验店你既可以试驾也可以购买，同时店里还提供充电、维修这样的服务。\n\
    \n2. 展示厅\n\n   这个跟体验店差不多，只是在这种展示厅里面，你是不能直接买车的，如果问价格，你就会转到网站或者找销售。\n\n3. 直营店面\n\
    \n   在这种店里可以进行真的购买，前提是特斯拉要美国的当地的这个，有销售许可才可以。你听了前两个也许会觉得：差不多嘛，为什么要区分两种模式？这个咱们要到第二部分再讲。\n\
    \n4. 游击店\n\n   什么意思？就是我们打“游击战”的那个“游击”，英文叫 Pop-up shops。Pop-up 就是突出出现的意思，这种形式主要在美国消费者眼里不太常见，比如说在北京上海这样的大城市，在人流密集的\
    \ CBD、或者商场，突然有个集装箱过来，里面既没有车也没有销售人员，给你介绍，这种在商业区快闪店，设置的店箱来销售品牌的模式叫做“游击店”。\n\n5.\
    \ 网站\n\n   其网站才是特斯拉的销售核心，作为消费者可以在线预约试驾或者进行购买，这种方式添加销售的方式就是特斯拉的直营模式。\n\n那么这种直营模式在美国反响如何呢？答案是非常好！受到了美国顾客的青睐，文章中也说，在\
    \ 2015 年埃德曼（著名营销咨询公司）的调查中，75% 的受访者都支持特斯拉的这种体验很好，因为（消费者）既可以看到了解特斯拉的生产过程，同时价格也很透明，不用担心体验。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_3_2.png)\n\n中国有句老话叫“木秀于林，风必摧之”。这一路从\
    \ fast lane 快车道上走来，高速成长的特斯拉也的确树敌不少。那么这场对于汽车产业未来的争夺，到底谁胜谁负呢？我们作为消费者，只能等待时间来证明了。\n\
    \n## 知识清单\n\n特斯拉电动车的直营模式，越过了经销商网络，保证了销售体验的完整性。\n\n美国传统的销售方式依然采取代理方式，即汽车制造商把车卖给各个区域的代理商，这些代理商再去销售这些汽车。\n\
    \n特斯拉的销售方式：\n\n- 体验店 (Showrooms)\n- 展示厅 (Galleries)\n- 游击店 (Pop-up shops)\n- 网站\
    \ (Website)\n- 直销店面 (Department stores)\n\n目前特斯拉直营模式的问题主要来自两个方面：\n\n1. 第一，美国本土的法律问题\n\
    2. 第二，来自于经销商和竞争对手的追赶与阻击\n\n目前美国的汽车制造商反而被分销模式所拖累，这在全球市场也是别无二家的。\n\n特斯拉现在需要做的，是找到更广的渠道合作，把产品展示给更多的顾客，来打动消费者。\n\
    \n## 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_4_0.png)\n\n特斯拉不仅开创了电动车制造业的先河，更颠覆了美国汽车的销售模式，木秀于林，特斯拉一路也树敌不少。\n\
    \n——《快公司》\n\nTesla isn’t just making groundbreaking electric vehicles. It’s expending\
    \ the way cars are sold across the country. And it’s making a few enemies along\
    \ the way.\n\n— Fast Company\n\n![](img/2b1f55794a32401f6e1d5425100884b9_4_1.png)\n\
    \n## 本期杂志：《快公司》\n\n著名的前沿商业媒体，也是世界历史上成长最快的媒体品牌。创刊 18 年的《快公司》，已经成长为全球三大财经商业媒体之一。\n\
    \n## 下期预告：《连线》\n\n针对网络暴力，谷歌发动反击，实施反制计划，这能改变现状吗？\n\n# 谷歌对网络暴力的技术性反击\n\n本文源自《连线》（英国版）11\
    \ 月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_5_0.png)\n\n## 知识清单\n\n### 网络巨魔（Internet\
    \ Troll）\n\n指在网络世界中，用侮辱性语言挑起骂战，并从中获得莫名快感的人。\n\nTroll 是一种源于北欧神话的怪物，体型巨大，头脑简单，暴力嗜血。在暴雪公司的大型网游《魔兽世界》中，“巨魔族”的英文即为\
    \ Troll。\n\n### 拼图组织（Jigsaw）\n\n原谷歌的智库，今年 2 月改名为“拼图”，Jigsaw 的一种词义就是指拼图，也可以用来表示“错综复杂”的形式。\n\
    \n拼图组织（Jigsaw）即将推出一个“人工智能对话系统”，利用算法和机器学习能力，自动识别网络上的侮辱性言论和骚扰。比关键字过滤准确，也比人工识别要快得多。\n\
    \n### 登月级别计划（Moonshot）\n\n在谷歌内部，把所有听起来疯狂、夸张、需要花费大量时间和精力来实现的计划，都称之为“登月级别计划”。例如：谷歌眼镜、无人驾驶汽车、模块化手机等。\n\
    \n### 不作恶（Don’t be evil）\n\n谷歌公司非正式的公司口号，全文是“完美的搜索引擎，不作恶”，1999 年提出，沿用至今。\n\n##\
    \ 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_5_1.png)\n\n> 谷歌正试图保护网上的弱势群体，但行善比“不作恶”要困难得多。\n\
    \n——《连线》\n\n> Google is on a mission to protect the internet’s most vulnerable,\
    \ but doing good is harder than “Don’t be evil”.\n\n——WIRED\n\n您好，欢迎来到“乌鸦说读杂志”。\n\
    \n今天给您分享来自美国《连线》杂志的一篇报道。咱们之前讲过的《哈佛商业评论》、《经济学人》、《快公司》，都是领域前沿、个性鲜明的相对刊物，而《连线》杂志也是美国人相对比较熟悉的。这是一本科技类的杂志，被誉为“极客的圣经”。它关注的是科学技术应用于未来和人类生活的各个方面，并对文化、经济和政治产生影响。\n\
    \n这本杂志经常会影响到一些我们耳熟能详的概念和名词，比如“长尾效应”、“众包”的概念，都是《连线》杂志首先提出来的。\n\n今天说的虽然不是本期的封面文，却是一篇内容很棒的专题报道，说的是谷歌公司在酝酿的，一个对抗网络审查和暴力的计划，很值得一讲。\n\
    \n文章里说，现在社交网络越来越发达，在万丈光芒下，总会有黑暗的影子存在，如今在欧美网络上，类似 Facebook、推特这样的网站以及论坛上，有一种被称为“网络巨魔”的人，英文叫\
    \ Internet Troll，这种“网络巨魔”指的是，跟自己想不同的观点，实施网络暴力。主要是骂搞、侮辱，极端的，甚至会进行人身威胁。\n\n比如说，美国有一个女脱口秀主持人叫\
    \ Leslie Jones，是个黑人，她的头像被一些种族主义者，在网上给她做了一个黑猩猩的图片，还在她脸上 P 了很多黑白液体，就是很有侮辱性的那种，你懂的。\n\
    \n还有更极端的，比如一些专栏作家，因为自己发表的政治言论，而在社交网络上受到了极端分子的攻击，有扬言要一根根拔掉其头发的，有威胁要掠夺其器官的，更夸张的，还有说要暴人家只有一岁的女儿的。最后这些专栏作家不得不关闭了自己的所有社交网络账号，彻底离开了虚拟的网络世界。\n\
    \n文章的论点是，你作为“网络暴力”的受害者，好像像是进了一个广场，广场上有 5 万人，就你像进现在，在你。你光会着全世界对你都有敌意，那你首先肯定是闷骚，甚至你可能就觉得自己的生命都受到威胁了，你要保命，你得逃跑。\n\
    \n这不仅会造成非常大的心理伤害，而且会导致这些人从此有心理阴影，发东西之前先自我审查，这个不敢说，那个不敢讲，要么干脆就不再在网络上表达发表自己的观点了。\n\
    \n其实这种“网络暴力”现象，我们中国人并不陌生，只是在我们这儿对这些“网上暴力”分子，不叫“网络巨魔”，有别的称呼，比如“键盘侠”之类的。\n\n这些年来，类似\
    \ Facebook、YouTube 这些社交媒体和网站，对这种网络暴力的主要手段，都是让用户体验出侮辱性的言论，进行举报，再由他们的员工进行处理，而这些处理问题的员工，也都是外包到像菲律宾这样的“第三世界国家”，一个是因为他们讲英语，还有就是因为人比较便宜。\n\
    \n但这样的处理方式，首先人力成本很高，而效率又非常低下；其次，对于处理这些侮辱性言论的员工来说，整天看着这些负能量的东西，他们的身心也会受伤害。\n\n\
    所以作者认为，这种方式对大规模的网络暴力，基本没什么用。\n\n而最近谷歌一个叫“拼图”的团队，英文叫 Jigsaw，即将要推出一个新项目叫做“人工智能对话系统”。这个项目主要是利用技术和机器学习能力，来自动识别网络上的侮辱性言论和骚扰。这个项目一旦做出来，按照他们自己工程师的话说，会比关键字过滤要快得多。同时，又比人工手动处理要快得多。这样就能够非常好地解决“网络巨魔”问题。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_6_0.png)\n\n这个叫“拼图”的团队，前身是谷歌的一个智库，成立于\
    \ 2010 年。今年 2 月份才改名叫“拼图”。那个机构谷歌之前都做过些什么事儿呢？他们在网络安全方面做的确是做过一些事情的，就比如说在谷歌的 Chrome\
    \ 浏览器里做一个插件，你如果在浏览一些有危险的网站，对方要输入你的谷歌账号和密码，这个插件就会跳出来提醒你，让你小心。\n\n还有比如极端组织“伊斯兰国”，在网上招募志愿者，号召人来加入他们，智库就做了程序，来反制“伊斯兰国”的这种网络攻势。比如说通过你搜索的关键词看到你有这种极端言论的倾向，它就会把你导入到另外一个页面的页面上，让你看到的是反“伊斯兰国”的言论和视频。据其内部实行下来的效果看，成功率高达\
    \ 70%。\n\n而这个所谓的——人工智能对话系统——其实只是一个“拼图”团队，野心勃勃的项目的一部分。他们最终是要利用 Google 强大的硬件设备和优秀的工程师，做一个\
    \ Moonshot 级别的项目。\n\nMoonshot 也就是登月，在谷歌内部把所有疯狂甚至听起来很夸张，会花费大量时间和精力的计划，叫做“登月级别”项目。比如谷歌眼镜、无人驾驶、模块化手机之类的，都是“登月级”的项目，并拼图“登月级项目”的最终目的是，在十年之内，结束网上的审查制度。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_6_1.png)\n\n他们的想法是，运用人工智能来解决人与人的问题，让人们在互联网上可以更加和谐相处。不但要把互联网技术的潜力往前推进，同时要弥补在整个世界演进过程中，出现的最糟糕的那些东西，比如说像监控、极端的言论，还有审查。\n\
    \n按照作者的说法，“拼图”这个团队，就是谷歌里一个类似于“正义联盟”这样的组织。“正义联盟”就是漫画里面那些超级英雄，像超人、蝙蝠侠，他们组成的“维护世界和平”、“助强扶弱”的这么一个组织。\n\
    \n我们都知道谷歌公司有一句著名的口号，叫 不 作 恶 ， “Don’t be evil”。“拼图”组织启动的这项计划，也说明谷歌公司已经不仅仅满足于他们原来说的“不作恶”了，他们想要做好事。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_6_2.png)\n\n谷歌说，一个人工智能对话的程序，其实是受到了一个游戏公司启发。就是知名的多人网络游戏《英雄联盟》的制作公司，他们从\
    \ 2012 年开始，尝试着在网上，对玩家之间的言论进行监控。如果他们对玩家在游戏的时候，有人聊天用了侮辱性的词汇，那么他们就会对这样的玩家进行警告，然后\
    \ 92% 被警告的玩家，之后都没有再使用这样的言论。就是说，玩家被警告后会收敛和注意自己的言行。\n\n这个计划的实施，主要是依靠“算法”和“机器学习”，也就是\
    \ Machine Learning, “机器学习”，是目录世界上公认的“四大技术趋势”之一，文章里很简单地解释了一下它的原理，就是让程序先标记，什么样的东西是属于“骚扰性”或者“误导性”的言论，然后机器不断学习之后，最终能够很准确地分辨出来。\n\
    \n好意思，你要让机器图分辨什么是猫，给它海量的猫的图案，让它认识猫的特征是什么样的，一段时间之后它熟悉了，就能在众多的图片里面辨认出猫了，就是这么个原理。\n\
    \n那这种方式对于应对网络暴力是不是有效呢？按照文章作者亲身体验，貌似还挺有效的。人工智能对话的程序有个 0-100 的打分机制，来确定用户的言论，是不是侮辱性的言论，一句话的侮辱越高，分数就越高。比如说你输入：怎么样，混球？63\
    \ 分。程序显示：你是个混球，你有 63 分。程序显示 96 分，判定为侮辱性言论，识别率还是挺高的。而且谷歌打算把这项技术，做一个开源，就是任何人都可以应用这样的模型，然后进行开发。以后效率和准确度还会提高。\n\
    \n但是目前对这个项目的担忧也是挺多的，有业内人士指出，因为“拼图”其实是谷歌的一个盈利机构，那么怎么保证言论制定的公平性，而且对于反审查的这种做发有没有可能变成一种新的审查制度呢？\n\
    \n即便是在网上遭受过“网络言语暴力”的那些人，当他们听到这个项目的时候，其实还是很愉快的，很多人说，人们还是需要能够自由表达的空间，因为在这种算法下，你的回嘴也算是危险性言论，一样是要被删除的。有人就说了，如果在网上连“川普是个傻瓜”这样的话都不能说了，那网络还有什么意思啊！\n\
    \n好了，今天跟你分享的是谷歌的“拼图”组织，配部的应对“网络暴力”的计划，也是谷歌内部“登月级”的项目。Moonshot 也就是登月，如果您以后在聊到很长远而且比较难实现的项目时，就可以\
    \ 称 它 为 “ 登 月 级 别 ” 的 项 目，Moonshot, 简洁又精准。\n\n## 本期杂志：《连线》\n\n美国《连线》（Wired）杂志是一份科技类月刊，创刊于\
    \ 1993 年，被誉为“极客的圣经”。\n\n## 下期预告：《经济学人》\n"
