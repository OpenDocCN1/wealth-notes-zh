    \ Company\n\n您好，欢迎来到“马徐骏说杂志”。\n\n今天给您带来的内容，是来自于最近一期《快公司》杂志的封面文章，讲的是通用汽车的新 CEO\
    \ 在上任后，作出一系列改革，带领通用这家老牌汽车制造商走出困境的报道。\n\n在我们印象里，美国汽车业这几年是惨透了，其中的代表就是通用汽车，已经到了崩溃的边缘，但现在最新的数据显示，通用汽车公司实现了惊天大逆转，那它是怎么做到的呢？\n\
    \n文章先讲了一个对比，在今年的摩根大通的汽车行业大会上面，有一个很戏剧化的场面，通用公司的 CEO 上台演讲，说虽然通用汽车面临了很多的问题和挑战，也有很多的竞争对手，但是通用汽车仍然是汽车行业里面最强大也最有发展的企业。就在通用的\
    \ CEO 信心满满地发表这个演讲的时候，台下的听众却都在玩手机，基本上没什么人在好好听。\n\n你想，一个人在台上演讲，又是身份地位比较高的，怎么说也是一个大公司的高层，先不说人家讲的是不是精辟，下面听众的这种反应是不是显得不太尊重了？但这种不尊重的行为，还真就是现在美国人对通用汽车公司的态度。对于这样一家传统汽车制造企业和通用的新任\
    \ CEO，大众抱着一种怀疑和不信任的态度。\n\n通用虽然是美国传统的三大汽车制造巨头，但是随着美国汽车制造业的不景气，就连底特律，这个美国汽车制造业的大本营，都已经整个城市宣布破产了。而通用公司的确是辉煌不再，经历了破产，然后得靠政府出资救活。在美国普通老百姓的眼中，这家公司的形象就是官僚主义、经营不善——基本处在完蛋的边缘了。\n\
    \n而说起通用公司的官僚主义，在美国算是臭名昭著了。原文里特别提到两个词：在通用公司内部有两个特有的术语，通用公司的缩写是两个英文字母 GM，General\
    \ Motors，然后就由 GM 衍生出两个词：GM nod——通用点头，和 GM salute——通用敬礼。\n\n听着挺有礼貌，但这两可都不是什么好词。通用点头，指的是在开会的时候，大家都点头同意的事，实际上会议结束了之后，就当没这回事儿，啥也不干。\n\
    \n而另外一个，GM Salute——通用敬礼，Salute 这个词在英文里是某人敬礼的意思，但在通用公司里面，它可不是尊敬谁、跟谁打招呼的意思，它是专指推卸责任、指责他人，也就是咱们中国人俗称的“甩锅”——“这黑锅我不背，这责任我也不担”。像敬礼挥挥手一样，把问题都丢给别人去承担，这个词儿就是这个意思。\n\
    \n所以，这两词加起来就是“官僚主义作风”，而这个，确实是我们对那些传统大公司的印象。\n\n雪上加霜的是，通用公司 2013 年年底上任的这个新 CEO，还是个女性。在汽车制造业这样一个传统的被男性把持的行业里面，居然让一个女人来做公司的领袖人物，那显然造成的结果就是对通用公司的担忧和不信任。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_18_0.png)\n\n反映到实际层面，就是数字。自从这个新的 CEO\
    \ Mary Barra 上任以来，通用公司的估值下降了 1/4，而股票市场的价格，通用公司也从原来的每股 39 美元，跌到了每股 32 美元。甚至，就连这次《快公司》的杂志封面上，说到这个女\
    \ CEO Mary 的时候，也是列出了很多非常有争议的词，比如“Unlikely”不太可能，“Embattled”四面楚歌等。这就说明，大家对通用公司和这位新\
    \ CEO，依然持一种不看好和不太信任的态度。\n\n但是，文章说了，这种怀疑的态度，无论是针对通用公司的，还是这位女 CEO 的，有没有可能只是一种偏见呢？\n\
    \n要知道在 Mary Barra 2013 年上任的时候，面对的是一个大烂摊子，整个公司财务困难，欠了一屁股债，经营不善，公司人心涣散，而且大众评价也不好。\n\
    \n但从 2013 年到 2016 年的这三年里，其实通用公司不仅账目上已经有了 200 亿美元的现金流，还把借政府的欠款还掉了一大半，而且在过去连续的几个季度的财报里面，通用公司都是盈利的。可以说，在这位女\
    \ CEO 的执掌下，通用公司已经起死回生，而且做得越来越好了，那么在过去的三年里面，Mary 到底做了什么事，达到了这么神奇的效果呢？\n\n她一共就做了两件事：一个是稳定现金流，另一个是组建人才团队。\n\
    \n其实这两件事儿也是有先例可循的，就是现在被封神的乔布斯，在 1997 年重新回到苹果公司的时候，也是面临着一个烂摊子，跟玛丽面对的困境几乎是一样的。而乔布斯就是先稳定住现金流，也就是说得先有钱把公司运营下去，才能考虑之后的事儿。\n\
    \n第二件事，乔布斯大胆地使用人才，把合适的人放到正确的位置上去，打造一个有战斗力的团队和良好的企业文化。虽然现在大家都常对乔布斯背后重口喷，说是靠着一系列的创新，像音乐播放器\
    \ iPod 和之后的 iPhone，把整个苹果公司重新带回了一条稳定的运行轨道。但要讲道理，如果不是先做了稳定现金流和组建人才团队这两件事，苹果公司也不会之后有创新的源泉和基础，这点其实是很多人都忽略的。\n\
    \n而在 Mary 执掌通用汽车之后，既稳定好公司的现金流，又对团队的建设进行了大刀向内的改革，就包括换了新的总裁、换了新的产品发展主管，以及财务总监。所以公司的经营才明显有了起色。\n\
    \n通用汽车的这口气儿算是喘上来了，那接下来？Mary 还有更大的目标和野心。她不但在继续建设通用汽车的资产组合，还主动内部打破了自己公司的核心业务，这个真得有壮士断腕的根气。\n\
    \nMary Barra 在公司未来的版图上，一共通过五件事进行了布局。\n\n- 1. 搭住了一个平台\n\n我们之前在《特斯拉的快车道》那篇文章里面讨论过，特斯拉造车的方式跟美国传统的汽车制造商是不一样的。美国的传统三大巨头，都是跟分销商之间买卖关系是松散的，所以是通过分销商销售中没有一个紧密的连接，中间隔了一层。而通用公司在这方面是有先见之明的，它有一个系统叫\
    \ OnStar，其实对中国来说也不是什么陌生的东西，一个系统叫做“全五星”，它的英文就叫 OnStar。这个系统可以确保通用汽车可以直接迅速地触达车主，而且是人工来为你服务的，不是机械的。我们常说那些大的互联网公司的优势是平台化，但在这方面，其实通用是有自己的平台根基在的。\n\
    \n- 2. 寻找合作伙伴\n\n美国最有名的出行公司是 Uber，就像我们的滴滴出行一样。排名次名的公司，Lyft，它相当于我们以前的快的公司。Lyft\
    \ 跟 Uber 的竞争其实是旗鼓相当的，也是 Lyft 在英国的竞争对手。今年早上的时候，通用公司向 Lyft 公司投入 5 亿美元，投资的目的是为了能够有一个学习借鉴的渠道，是在共享出行行业做得好的公司，是能够迅速掌握主动权。说白了，通用是想学习观察用户对出行交通工具的使用习惯。\n\
    \n- 3. 通用汽车推出了一个汽车共享的服务，叫做 Maven\n\nMaven 这个英文词里面是专家、内行的意思。这个词的模式是有点像我们在中国的摩拜单车，也就是这个车放在这了，谁扫码就能够用。那么这一个就是通用公司进入这种共享服务的一个策略，万一当共享的那个\
    \ Lyft 公司出现问题或者被竞争对手收购了，那么这个叫 Maven 的汽车共享就是他们的又一张可以打出的牌，至少在于这个领域通用不会被拒之门外、赶下牌桌。\n\
    \n- 4. 新产品的推出\n\n在明年的年底的时候，通用公司会推出一款全新的电动品牌汽车叫做 Bolt，这个词汇是闪电的意思，单名字上就让我好像是通用公司要用闪电的速度绝地叫板，跟现在最火的电动车品牌特斯拉叫板。因为这款车通用的电池，无论是在价格还是续航里程上，跟特斯拉要差一点。能开两百英里，售价是\
    \ 3 万美元。这个跟特斯拉新车的续航比，是没有太多的，价格上比特斯拉要便宜 5000 美金。反正我本人感觉这个产品的推出，是想要截胡特斯拉的意思。\n\n\
    - 5. 在新科技方面，积极主动地寻求突破\n\n通用公司在前年收购了家在无人驾驶方面比较先头的公司，叫 Cruise。这家公司的英文名是“巡航”的意思，而且收购之后的\
    \ Cruise 公司跟着通用，在 6 月份的时候实行了一次无人驾驶。而且这次试驾是在美国旧金山这样一个山地城市，交通高峰的时候进行的，所以这个压力比在空旷的地方随便让车开是要大得多的。结果，这个无人驾驶的测试非常成功。\n\
    \n前面说了五条通用公司的新战略布局，最重要的应该是最后一条，也就是对于无人驾驶技术的探索。\n\n## 你也遭遇“职场倦怠”了吗？\n\n本条音频及文稿参考《哈佛商业评论》11\
    \ 月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_20_0.png)\n\n## 知识清单\n\n“职场倦怠”指的是长时期处在压力环境下工作，并由此产生了情感、态度和行为上的衰竭状态。\n\
    \n造成“职场倦怠”的三大原因分别是：行业大环境的改变、重复的工作、团队中的人际冲突。\n\n“职场倦怠”的典型症状有三种：疲惫、去人格化和无力感。\n\n\
    对抗“职场倦怠”的三种方法：\n\n一、改变视角\n通过审视自己的状况，理辨“职场倦怠”产生的原因到底是什么。评估现状，找出问题，然后对症下药。\n\n二、减压\n\
    你需要关注那些虽然很有价值，但仍然会引发不健康压力的活动和关系。关于你做什么、做多少，你需要让同事、客户，甚至是家人调整他们的预期。\n与此同时，你要建立关于合作的规则。你可能因此遭到阻力，但你必须要知道，这些改变将提升你的长期生产力，保护你的健康。\n\
    \n三、建立积极的人际关系\n“职场倦怠”最好的解药是寻求积极的人际关系。\n多和人交流、请教一些建议，并从他们的经历中汲取能量和对你有用的东西。\n与此同时，主动地为人提供帮助建议，也能特别有效地打破恶性循环。\n\
    能量的来源主要有四个，分别是——身体、情感、思想和精神。通过形成特定的习惯，以上每个来源都能为我们系统性地并且及时地补充能量。\n\n你是否正一步步陷入“能量危机”？请在符合自己实际情况的陈述前打钩。\n\
    \n- 1. 身体\n    - □ 我无法保证每晚至少睡 7-8 小时，醒来时常常疲劳。\n    - □ 我经常不吃早餐，要么就是对付着吃些没太多营养的东西。\n\
    \    - □ 我运动量不足（充足的运动是指每周至少 3 次循环系统的训练、1 次力量训练）。\n    - □ 在一天的工作中，我没有定时休息的习惯，因此能量得不到真正的补充；我要么根本不吃午餐，要么经常在办公桌前吃。\n\
    \n- 2. 思想\n    - □ 我很难集中精力开始善始善终地做好一件事，总是容易为杂事而分心，特别是被电子邮件干扰。\n    - □ 我每天把大量的时间用来应付迫在眉睫的危机和需求，而不是专注于具有长远价值、蕴藏巨大优势的活动。\n\
    \    - □ 我拿不出充足的时间进行内省、战略构想和创造性思维。\n    - □ 我晚间和周末都要工作，几乎没有哪个假期可以不需要收发电子邮件。\n\n\
    - 3. 情感\n    - □ 我发现，自己在工作时总是脾气暴躁、缺少耐心、焦虑不安，尤其是碰到棘手任务的时候。\n    - □ 我没有足够的时间来陪家人和至爱亲朋，就算我在他们身边时，也是人在心不在。\n\
    \    - □ 我没有多少时间来自我享受我喜欢的活动。\n    - □ 我很少有空对他人表示赞赏，也不会享受成功带来的喜悦。\n\n- 4. 精神\n\
    \    - □ 我没有为自己最擅长和最喜爱的工作付出足够的时间。\n    - □ 对于某些事务，虽然实际上说它们是我生活中最重要的部分，但实际上我为它们分配的时间和精力少之又少。\n\
    \    - □ 我的工作决策常常受到外部需求的影响，而不是决定于内心强烈而明确的目的性。\n    - □ 我没有投入足够的时间和精力，对他人或这个世界施加积极的影响。\n\
    \n你的总体能量如何？算出打钩的总数：\n0~3 分：能量管理技能卓越\n4~7 分：能量管理技能合理\n8~10 分：能量管理技能存在严重缺陷\n11~16\
    \ 分：完全陷入能量管理危机\n\n你需要在哪些方面加强努力？不妨算出——身体、思想、情感、精神——四大类分别打钩的数量。\n分数指南：\n0 分——能量管理技能卓越\n\
    1 分——能量管理技能优秀\n2 分——能量管理技能存在严重缺陷\n3 分——能量管理技能较差\n4 分——完全陷入能量危机\n\n## 本期金句\n\n\
    ![](img/2b1f55794a32401f6e1d5425100884b9_20_1.png)\n\n做一名优秀的专业人士并不意味着要当仆人。你不应该习惯夜里\
    \ 11 点回邮件。\n——《哈佛商业评论》\n\nBeing a good service professional doesn't mean you have\
    \ to be a server. You shouldn't be e-mailing at 11 at night on a regular basis.\n\
    — HARVARD BUSINESS REVIEW\n\n![](img/2b1f55794a32401f6e1d5425100884b9_20_2.png)\n\
    \n您好，欢迎来到“马徐骏说杂志”。\n\n今天我来跟您讲讲《哈佛商业评论》的一篇文章，说的是“职场倦怠”的问题。\n\n《哈佛商业评论》作为管理类顶尖杂志，对于管理这个大概念下面的小分类也是关注的。管理是人与人、财、物和信息的综合艺术，但是人的管理，还是人，就好像数字里没有\
    \ 1，后面再多的 0，也没用。\n"
