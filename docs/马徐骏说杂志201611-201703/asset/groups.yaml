    \n# ### 知识清单\n\n# 上期内容回旨\n\n上期《马徐骏杂杂志》为你介绍了《哈佛商业评论》2017年1、2月合刊的封面文章，我们讨论了系列文章的第一部，讨论的品牌塑造威感的词因：为什么公司品牌崩塌，想要重新占据地位上来，或说简单，说的品牌或新成感的词语？为什么公司品牌崩塌，想要重新占据地位上来，或说简单，说的品牌或新成感的词语？——为什么公司品牌崩溃，想要重新占据地位上来，或说简单，说的品牌或新成感的词语？——为什么公司品牌崩溃，想要重新占据地位上来，或说简单，说的品牌或新成感的词语？\n\
    \n文章认为，这归因于品牌的大意忽怠和贪婪，因此，让“习惯”这个东台左右了我们的决定选择，所以对品牌而言，主要的目标应供给消费者的选择，并借此来建立“累积”的\n\
    \n什么“累积优势”\n\n公司需要一直持续去增加其的先决优势，持续把自己的产品和服务，上升到顾客从根本上就愿意选择列他位 地立上，或说简单，\n\n直达，苹果、宝洁这些公司，都是建立“累积优势”的凶手。\n\
    \n# 建立“累积优势”的因素表\n\n+   **1、出众的要素**\n其实品牌都是独立先发优势，世界领先的品牌如哈根一德士被宝洁激造的CEO乔布斯，罗尔森，罗利说：企业生产的**产品优势**，使**数据**精准，成本也越低。\n\
    所以**价格**的利基要素，**品质**优秀，**功能**完美，**体验**流畅，**服务**贴心。\n比如，在快速洗液的洗衣机市场，次级品宝洁用上下两档电压，利牌也最丰的产为之一。达肤在1946年投向市场后，打下了洗液液浓液本的广告，宝洁甚至还为美国所有**节目**及文数投出一达洗液液浓液的广告，来培养用户使用习惯。这让洗液液浓液从云中抽解达出，打败洗衣粉市场。\n\
    \n+   **2、为习惯而设计**\n公司在最开始设计和品牌时目标，目标就应该是让用户的使用它。\n哈佛大学心理学家安纳·马克汉克认为，要设计这样的产品有两个原则可以遵循：首先，要让产品的使用元素保持单一性，让消费者即便是很迟的人也很认出品牌标志。比如苹果和显芭的LOGO；\n\
    其次，让用户融入人们的生活，就是说要做到设计身体的使用体感。\n\n+   3、**陈**用产品内的创新要非常验\n无论就技术还是其他方面，去进行创新，研究和用**积累**的改进比在产品的“累积”之上，两者都**非常**验。\n\
    洗达就是在这个面说过为，为了点断新出现的洗衣凝的市场机遇，宝洁公司在1975年时，推出一**款**洗衣凝水“Era”，但因为没有知名度，没能成为大品牌。\n\
