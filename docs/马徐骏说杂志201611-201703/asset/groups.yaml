    \n再**比**如**，让**老**板**发**现**你**较**长**的**地**方**，对**你**以**往**以**待**，经**型**用**你**——这**就**是**培**养**他**的**使**用**习**惯**，以**此**增**加**老**板**对**你**的**肯**定**和**好**感**，让**他**对**你**的**优**点**，够**容**易**不**费**力**地**回**忆**起**来**。\n\
