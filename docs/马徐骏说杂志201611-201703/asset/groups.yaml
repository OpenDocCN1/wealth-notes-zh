    \n## 通用汽车的阻击战\n\n本条音频及文稿参考《快公司》11 月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_17_0.png)\n\
    \n## 知识清单\n\n通用汽车（GM）近些年也是麻烦不断。作为曾经备受赞誉的行业巨头，可以说是在美国最负盛名的公司，但现在已辉煌不再。经历了破产、政府救助，以及导致了\
    \ 139 人死亡的点火开关设计缺陷风波之后，通用的形象已经完全变成了“经营不善”、“官僚主义”。\n\n通用以“官僚主义”而闻名。文章给出了两个通用公司内部的专有名词：\n\
    \n- 第一个是“通用点头”（GM nod），专指会议上表示同意，但实际却什么都不做；\n- 第二个是“通用敬礼”（GM salute），专指推卸责任，只会指责他人。\n\
    \n玛丽·巴拉（Mary Barra）着手进行了和 Steve Jobs（史蒂夫·乔布斯）1997 年回归苹果之后一样的两个举措：\n- 第一个举措是稳定现金流，从而获取资金投入创新；\n\
    - 第二个举措是组建合适的团队，打造正确的企业文化。\n这两个举措不论对传统公司还是初创公司，甚至是个人，都有很强的借鉴意义。\n\n通用在短期内迅速构建了一个“投资组合”，这个组合由五部分构成。可以说，正是这个组合为通用提供了未来在汽车\
    \ industry 赢取成功的必要要素。\n\n### 一、平台\n\n大多数人认为无线连接技术只有硅谷企业才能实现，但是在汽车行业，通用的 OnStar\
    \ 系统提供了远程解锁及数据访问服务，这是其他的竞争对手无法提供的。\n\n### 二、合作伙伴\n\n今年 1 月 4 日，通用宣布向打车应用 Lyft\
    \ 投资 5 亿美元，Lyft 是美国第二大出行共享服务的公司。这个交易为 GM 提供了一个落脚点去测试和学习，以便在共享出行风头正盛的时候，迅速掌握主动权。\n\
    \n### 三、初创公司\n\n在向 Lyft 投资的消息公布后的第 11 天，通用宣布推出专有汽车共享服务 Maven。Maven 旨在挖掘“个人移动”的另外一种未来：用共享代替个人所有。\n\
    Maven 提供给用户一个 APP，可以用来预定、解锁和开启车辆。\n此外，Maven 也为另一种可能性奠定了基础，那就是通用将打造和经营自己的无人驾驶车队。\n\
    所以，Maven 是通用的一方试验田，也是进入市场的一个支点，一旦 Lyft 出现问题或被竞争对手收购，Maven 作为一个备用品牌就可以上场。\n\n###\
    \ 四、汽车\n\nBarra 认为今年年底将售的新型全电动车 Bolt 将是一款里程碑式的产品。\n早在 2013 年，Barra 就与当时的 CEO Daniel\
    \ Akerson 发起 Bolt 项目，目标就是开发一款全电动车——价格实惠，实用性强，保证里程至少 200 英里，售价仅为 3 万美元。\n这个规格远超福特和日产等竞争对手。虽然价格和续航里程上，Bolt\
    \ 与特斯拉备受期待的 Model 3 相近，但它推出时间显然早于特斯拉。\n\n### 五、技术\n\n通用在今年采取了像 Google 和 Uber 那种更为激进的、一步到位的投资策略，收购了拥有领先无人驾驶技术的\
    \ Cruise 公司。现在，双方正在紧密合作，以实现更大规模的愿景：数百万客户，大多数是年轻人和城市居民，使用 Bolt 电动汽车实现共享出行。通用和 Cruise\
    \ 今年 6 月份进行了试驾，使用新款 Bolt 电动汽车和 Cruise 的技术，最后取得了成功。\n\n## 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_17_1.png)\n\
    \n硅谷科技公司与通用汽车，它们也许更像是一个关于未来的谜题，后者的解答部分——前者给出的灵感，后者给出的是传统汽车企业的专业知识——二者融合到一起，产生了令人无法想象的变革还有创新成果。\n\
