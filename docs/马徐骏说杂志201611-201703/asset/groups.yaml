    # 如何“加速”提升学习效率


    本条音频及文稿参考《连线》2月刊


    ![](img/2b1f55794a32401f6e1d5425100884b9_56_0.png)


    # 知识清单


    《连线》杂志 被誉为“极客的圣经”。《失控》一书的作者、著名作家凯文·凯利，是这本杂志的创始主编。人们熟知的“长尾理论”，也是《连线》最早提出的。这本杂志服务于关注并对科技有浓厚兴趣的人，希望通过报道，引领一种时髦、有范的生活方式。杂志编辑认为，“科技终将对人类生活的方方面面，产生改变。”


    # 提升学习效率的加速技术


    简单来说，就是学习视频或音频课程时，快进它的播放速度，这种方法可以将学习速度提升30%以上。 但这并不是简单地调速听节目，也需要快速搭配。 目前播客软件中，最常用的是1.5倍速，这个速度在国外播客软件中有一个专有名词，叫做Smart
    Speed，翻译成中文，就是“智慧速度”。


    # “略读”技巧


    读书时，不断根据内容来调整自己的阅读速度，遇到熟悉、可以看懂的内容就快读，遇到不好懂的内容，就放慢速度反复读，直到读懂为止。英语考试的阅读板块中也有快速阅读，培养的都是迅速定位重要信息的能力。
    用“加速”技术快速听音频，其实就是听音频时的“略读”。 适当调控速度不影响理解 美国北卡罗来纳大学和田佛罗里达大学的两位学者在研究中发现，人们在用1.5倍速的速度听科学节目时，理解的内容，和在原始速度下听是相同的。所以调快速度不用担心会有理解上的问题。


    # 加速技巧具体应该怎么做


    文章引用了舒适区和学习区的概念，作者说，如果你听的内容在你的舒适区内，也就是听起来没有难度，那么就可以加速听，加速到1.5倍速、2倍速甚至3倍速。但如果听的内容在你的学习区内，也就是听起来有难度的话，就需要用正常速度听，有必要的话，还可以反复多听几遍。也就是说，根据理解程度，选择听内容的速度。
    对得到用户来说，如果订阅了好几个专栏都想听，但时间不够，就可以先用高倍速整体过一遍，遇到感兴趣的地方，再慢下来，如果没有听不懂的地方，听完了也就吸收了整体的知识。


    # 如何通过提升关注度来增强学习效果


    麦吉尔大学心理学教授和神经学家Daniel Levitin在《音乐感知的科学：用理性解释感性》一书中，提到了如何提升关注度来增强学习效果。 丹尼尔教授指出，在长时间的高强度工作或学习中，短暂的休息可以大大增强效率。其中，最有效的休息方式，就是做和之前学习内容完全无关的事情。比如，你已经听了30分钟1.5倍速的课程，接下来可以休息5分钟，去冲杯咖啡，和别人聊聊天。再回到工作、学习里时，又会是元气满满的了。


