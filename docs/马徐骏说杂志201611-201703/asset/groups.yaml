  mdcn: "\n而互联网这种交流工具的出现，加速了“新国家主义”的蔓延速度。Facebook 和推特，可以很容易地让人们绕过主流媒体的过滤，直接跟自己持共同观点的人进行交流和对话，甚至组织起示威抗议。\n\
    \n所以，经济增速放缓造成对全球化的怀疑，移民和各种小圈子对传统优势群体的挑战，以及互联网的推波助澜，是如今“新国家主义”浪潮席卷全球的原因。\n\n那有没有什么办法来对抗“新国家主义”的蔓延呢？文章里说了两个办法。\n\
    \n第一，既然“新国家主义”者可以利用社交媒体、网络的力量，那自由主义者也可以使用网络。意思就是，让支持全球化的人在网上尽量发声，宣传自己的主张。\n\n\
    第二，是要相信教育和年轻人的力量。前面说过，受过高等教育的人对全球化是更支持的，而在许多国家，受过高等教育、即大学毕业生的比例是在不断增加的。比如英国在二战后，大约只有\
    \ 5% 的人上过大学，而现在的英国，40% 的人都接受过高等教育。高素质的人越多，理性的声音就越容易传播。\n\n目前在西方国家有投票权的人中，60 岁以及\
    \ 60 岁以上的人是这种“国家主义”的主要赞成者。在他们此前的人生中，从来没有生活在这样一个无论是文化还是经济都高速发展的时代。一切都在以一种前所未有的速度前进。在老人们看来，看起来有点承受不住了。而像前面提到过的，无论是英国的独立党，还是法国的右翼党派，基本上都没什么年轻人参与，在其他国家基本上也是这个情况，“新国家主义”受到的是年纪大的人的青睐。\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_16_0.png)\n\n但好的情况是，年轻人并没有觉得目前的状况是一个非常糟糕的现象。比如说，尽管整个法国的总人口中，只有\
    \ 37% 的人觉得全球化是一种好的力量，但是在法国 18 到 24 岁的年轻人中，赞成全球化的比例却高达 77%。\n\n“新国家主义者”希望通过关闭边境、拒绝移民来闭门锁国，同时把社会变成过去他们熟悉的样子。可等到年轻人成长起来之后，整个世界的未来应该会再次变成全球化和世界大同的样子。\n\
    \n文章最后说了一句很棒的话，我选为了今天的金句：那些蛊惑人心的政客，只要他们的政策无法带来繁荣，就会立刻受到人民的抛弃。\n\n而现在，全世界各国越来越多样的人口组成，其实也是更倾向于多元化的。“国家主义”也是一股潮流，只是任何的潮流会兴起，也必定会消退。\n\
