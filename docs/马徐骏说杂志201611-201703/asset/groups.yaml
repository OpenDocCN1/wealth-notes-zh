    # 川普时代，这个世界会好吗？


    本文源自《经济学人》11月12日刊


    ![](img/2b1f55794a32401f6e1d5425100884b9_7_0.png)


    # 知识清单


    川普的当选，极大地鼓舞了西方国家的保守派和极右翼势力，标志着整个西方世界要右转了。


    法国右翼势力的代表人物——玛丽莲·勒庞——已经取得了一下届法国总统的候选资格。一旦勒庞当选，会让法国像英国一样进行“脱欧公投”，一旦成功，就标志着欧盟的分崩离析。


    非传统政治家出身的人也可以当一个好总统，如美国第40任总统里根，就是非常优秀的右翼政治家，被人称为“伟大的沟通者”，他是美国总统中唯一一位演员出身的人。


    非法移民在美国的数量是1100多万，如果按照川普说的，把这些人数全部赶离美国，整个美国的劳动力会减少5%，美国显然不可能支付代价。


    即便川普不支持真正的非非法移民，但他造成了种族间的信任甚至是仇视，已经是无可避免的事实。


    美国的核发射密码被写在一张叫做“饼干”(biscuit)的卡上，没有任何宪法方式的约束来约束统御的一定程度上去发射核弹，川普可以仅凭个人意愿，发射美国2000枚战略核导弹中的部分，甚至是全部。


    # 今日金句


    ![](img/2b1f55794a32401f6e1d5425100884b9_7_1.png)


    > > 在英国脱欧和川普当选之后，任何事情都有可能发生。在我们眼前，是一个正在分崩离析的世界。


    ——阿罗德（法国驻美大使）


    > > After Brexit and this election, everything is now possible. A world is collapsing
    before our eyes.


    ——Gerard Araud


    ![](img/2b1f55794a32401f6e1d5425100884b9_7_2.png)


    您好，欢迎来到“马徐徐说杂志”。


    今天给您带来的是11月12日的《经济学人》杂志的封面文章，叫《川普时代》。


    我们上周讲的《经济学人》，说《希拉里是美国最好的希望》之后，有朋友反映说，我讲的《经济学人》是有点倾向性，偏结论化。这里我要解释一下，不是我本人有倾向性和情绪化，而是《经济学人》这本杂志就是一个本倾向性很强的杂志，支持自由贸易、支持全球化，对保守主义和右翼思想很感冒，所以《经济学人》的编辑们自然是对川普嗤之以鼻，推荐希拉里。他们的文章肯定会些情绪化。


    拿本期的杂志举例，其实这期的《经济学人》杂志也是有一讲就全世界媒体活动的特别报道的，也就是Special Report。整个向来是《经济学人》的重磅内容，一年才十多篇，但这期的杂志封面上压根就没有这组特别报道存在。主要是翻过里面去，都只不过有这个特别报道。整个封面都关注了川普当选，而整本杂志里关于川普的内容有整整1篇文章，由讲该期的特别报道多达5篇文章，《经济学人》的编辑们有多不爽可想而知了。所以说，《经济学人》是一本观点很鲜明的刊物，我只是在尽量还原编辑们的意思。


    这次关于川普的当选，《经济学人》主要说了这么两个问题，一是川普的当选对全世界产生的影响是什么；另一个问题就是，川普当选后会不会是一个好总统。


    ![](img/2b1f55794a32401f6e1d5425100884b9_7_3.png)


    咱先来说第一个问题，川普的当选对世界造成的影响是什么。


    《经济学人》说，美国在6月全民“公投脱欧”，标志着美国的保守势力上台，而川普的胜利给欧洲和法国的极右翼政治势力也注入了一针强心剂。现在美国也是保守势力抬头的时候，甚至好多右派的主张，已经跟“新纳粹主义”相差不远了。法国右翼势力的代表人物，叫玛丽莲·勒庞，她是极右翼代表人物，跟川普一样，也都是保守主义，国家主义者，被誉为“法国最危险的女人”，她已经为川普当选，非常喜欢特朗普，而且她已经取得了一下届法国总统的候选资格，一旦勒庞当选了，会让法国像英国一样来一次脱欧公投，如果搞成他的话，那基本上，欧盟也就不复存在了。


    说白丁，川普的当选，极大地鼓舞了西方国家的保守派和极右翼势力，标志着整个西方世界要右转了。


    那第二个问题是，川普上台之后，会不会成为一个好总统呢？《经济学人》说，如果川普入主白宫之后，变得务实，同时更加宽容大度的话，那么他做一个好总统也是没有可能的，因为在他之前这个事儿是有先例的。原来也有一个共和党的总统候选人，上台时也不被看好，但最后得到一致认可，他就是美国第40任总统里根。


    里根是一个非常优秀的右翼政治家，被人称为“伟大的沟通者”，他也是非传统的政客出身，以前是一个演员，也是美国总统中唯一一位演员出身的人。


    如果川普能够最终像里根一样，出色圆满，甚至是超出预期地完成美国总统的工作的话，那么没有什么比这个更令人开心了的，但是，《经济学人》对于他能否成为一位优秀的、系统表里深人的怀疑，他们说了三个方面的理由，首先是他的政策，其次，是川普的性格因素，就是他的脾气，第三个，就是他的执政能力，或者说他应对政治事务的手腕儿。


    ![](img/2b1f55794a32401f6e1d5425100884b9_7_4.png)'
  - '[PAGE 8]


    先来说政策方面，川普在竞选时的这些政策如果真的全部实施的话，会有什么样的后果呢？


    如果他决定废除奥巴马的全民医保，那么他首先要面对2000万享受了这个医保美国人，这些人怎么办？如果他像他竞选的时候，宣称要把所有的非法移民都赶出去，那要知道，非法移民在美国的数量是1100多万人，如果这些人全部离开美国，那整个美国的劳动力就要减少整整5%，美国付不付得起这个代价？即便他不会真的像宣称的那样，驱逐非法移民，但是，川普造成的种族之间的这种不信任甚至是仇视，已经是无可避免的事实了。


    而他说，要给进口产品全面加税，这个会 导致的直接后果就是，让美国的穷人的日子变得更加凄凌，因为这样他们就享受不到来自全球化带来的便宜品的好处，生活成本会激增。而保守主义的政策不能带来更多的工作岗位，这也是一个很大的疑
    问，那么本来就己很脆弱的全球经济，可能会进入大规模的衰退。


    # **Importer-in-chief**


    ![](img/2b1f55794a32401f6e1d5425100884b9_8_0.png)


    Source: US Census Bureau; US Bureau of Economic Analysis


    第二个大问题，《经济学人》表示很担忧 的就是川普这个人的脾气。在整个竞选的 过程中，他表现出了极度的自恋，然后又 很敏感，又缺乏自控力，容易被对手激 怒。但是，你要知道，你成为一个全球最大、最有实力国家的总统，你每天都会面临来自于国内外的各种各样的羞辱。


    咱就不说美国那么多“脱口号”，天天就是拿政治人物，特别是总统出来开涮，就是咱中国人，也没少拿美国的这些总统出来讲段子。如果川普上台之后，来自于国会 的不同意见，来自于媒体的各种狂轰滥
    炸，作为总统，至少得有这种心胸和勇 气，就是忍他们，有这反应，那要么是 说服他们，因为这是工作职员的一部分。美国总统总是要把国家的利益放在自己的自尊心之前的。而川普，他控制不住自己的脾气，那就像他之前干的那样，跟人
    对骂、起媒体，这活儿还真怎么干？


    还有一个更严重的问题，来自于川普实际 的行政能力，他是否具备担任美国总统需要的政治素质。我们前面讲到的里根，他 也不是政治家出身，他是怎么解决这个问题的呢？他找代理人，就是把事情委托给能力的人做。川普可以效仿里根，但问题是，川普的整班子，包办选东西出来亮相，很大程度上是依靠他的家里人，就是漂亮女儿、老婆给他加分，但他显然没有强大的人，有行政能力的班底，来支撑他的日常工作。在竞选的时候，川普说因为他是个出色的商人，所以具备很好的协商和谈判的能力。川普说这在政治上面是非常有用的，但是《经济学人》指出，你如果上商业谈判上失败了，那或者不在这几座摩天大楼换个地方造好了，要不在这儿建高尔夫球场，换个城市一样建。但是在政治上，如果你跟某一个大国谈判失败了，你是没有什么其他的可能，另起炉灶的。


    ![](img/2b1f55794a32401f6e1d5425100884b9_8_1.png)


    而文章里，还提处了一个非常令人担忧的 问题，就是当川普登上了美国总统这个职位之后，他就掌握了美国核弹的按 钮。只要他愿意，拿着一这张，被称为 为“饼干”的卡片，上面写着美国的核弹发射密码，他就可以凭自己的意愿，随地发射美国两千颗战略核弹中的一部分，甚至是全部。那你可能会说，这个事儿难道是他想发射就能发射的吗？答案是，还真是！


    按照《经济学人》的文章里面的说法，没有 任何宪法上面的限制，不允许他这么做，也就是说这个事儿真的是他想干就干了。哪怕是他所有的幕僚和班底全都反对，但只要他下令发射，这些核弹就必须得打出去。从他做出决策，到上百万人丧命，只需要10分钟都不到的时间，这就是一个开头没有回头箭的事儿。尽管川普在竞选的时候说过，对于核弹这个东西，他会非常谨慎使用。但就像前面说的，川普确实是一个，比较容易情绪激动，且自控力很差的人，也不太愿意接受别人的意见。如果有一天他真的一意孤行，怎么办？


    所以，《经济学人》的观点非常鲜明，川普如果不改自己的做派和脾气，非但当不了一个好总统，甚至可能会对全球的政治经济和军事产生可怕的结果。


    而文章里面引用了一句法国驻华大使的话，他说当选了之后的任务。他说，在 英国脱欧和川普当选之后，任何事情都有可能发生，在我们眼前的，是一个正在分崩离析的世界。


