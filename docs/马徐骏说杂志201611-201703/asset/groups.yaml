    \n  本期杂志：《哈佛商业评论》\n  创刊于1922年，“哈佛商学院”标志性杂志，致力于给全世界的管理专业人士，提供缜密的管理见解和最实用的管理案例。\n\
    \n  下期预告：《连线》\n  如何利用“加速”技术，增强学习力，将学习速度增强30%以上。\n\n## 如何“加速”提升学习效率\n\n  本条音频及文稿参考《连线》2月刊\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_56_0.png)\n\n### 知识清单\n\n  《连线》杂志 被誉为“极客的圣经”。《失控》一书的作者、著名作家凯文·凯利，是这本杂志的创始主编。人们熟知的“长尾理论”，也是《连线》最早提出的。这本杂志服务于关注并对科技有浓厚兴趣的人，希望通过报道，引领一种时髦、有范的生活方式。杂志编辑认为，“科技终将对人类生活的方方面面，产生改变。”\n\
    \n### 提升学习效率的加速技术\n\n  简单来说，就是学习视频或音频课程时，快进它的播放速度，这种方法可以将学习速度提升30%以上。 但这并不是简单地调速听节目，也需要快速搭配。\
    \ 目前播客软件中，最常用的是1.5倍速，这个速度在国外播客软件中有一个专有名词，叫做Smart Speed，翻译成中文，就是“智慧速度”。\n\n###\
    \ “略读”技巧\n\n  读书时，不断根据内容来调整自己的阅读速度，遇到熟悉、可以看懂的内容就快读，遇到不好懂的内容，就放慢速度反复读，直到读懂为止。英语考试的阅读板块中也有快速阅读，培养的都是迅速定位重要信息的能力。\
    \ 用“加速”技术快速听音频，其实就是听音频时的“略读”。 适当调控速度不影响理解 美国北卡罗来纳大学和佛罗里达大学的两位学者在研究中发现，人们在用1.5倍速的速度听科学节目时，理解的内容，和在原始速度下听是相同的。所以调快速度不用担心会有理解上的问题。\n\
    \n### 加速技巧具体应该怎么做\n\n  文章引用了舒适区和学习区的概念，作者说，如果你听的内容在你的舒适区内，也就是听起来没有难度，那么就可以加速听，加速到1.5倍速、2倍速甚至3倍速。但如果听的内容在你的学习区内，也就是听起来有难度的话，就需要用正常速度听，有必要的话，还可以反复多听几遍。也就是说，根据理解程度，选择听内容的速度。\
    \ 对得到用户来说，如果订阅了好几个专栏都想听，但时间不够，就可以先用高倍速整体过一遍，遇到感兴趣的地方，再慢下来，如果没有听不懂的地方，听完了也就吸收了整体的知识。\n\
    \n### 如何通过提升关注度来增强学习效果\n\n  麦吉尔大学心理学教授和神经学家Daniel Levitin在《音乐感知的科学：用理性解释感性》一书中，提到了如何提升关注度来增强学习效果。\
    \ 丹尼尔教授指出，在长时间的高强度工作或学习中，短暂的休息可以大大增强效率。其中，最有效的休息方式，就是做和之前学习内容完全无关的事情。比如，你已经听了30分钟1.5倍速的课程，接下来可以休息5分钟，去冲杯咖啡，和别人聊聊天。再回到工作、学习里时，又会是元气满满的了。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_56_1.png)\n\n  > 加速的前提，是不要让自己失控。\
    \ ——《连线》\n  >\n  > If we’re going to speed up, we should make sure that we don’t\
    \ lose control. — Wired\n\n### 本期杂志：《连线》\n\n  美国《连线》（Wired）杂志是一份科技类月刊，创刊于1993年，被誉为“极客的圣经”。\n\
    \n### 下期预告：《科学美国人》\n\n  为什么运动并不能帮助人减肥？人的能量消耗和体育锻炼到底有怎样的关系？\n\n## 运动到底能不能减肥\n\n\
    \  本篇音频及文摘参考《科学美国人》2月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_57_0.png)\n\
    \n### 知识清单\n\n  《科学美国人》\n  美国历史非常悠久的科普杂志，1845年创刊至今，已经有150多位诺贝尔奖获得者在上面发表过文章，如爱因斯坦、沃森、DNA双螺旋结构的发现者克里克等。\n\
    \n  《科学美国人》与另外一本非常著名的科学类刊物《自然》的差异在于，《自然》采用同行评审的方式审稿件，而《科学美国人》则邀请一众专栏作者、大家发表科学理论和科学新发现。总体来说，《科学美国人》是一本更加大众化的科学杂志。\n\
    \n  人的每日能量消耗是固定的\n\n  这篇文章指出，和很多人想的不同，运动其实并不能减肥。因为人类是一个每天消耗大量能量的物种，任何人每天消耗的能量大致是差不多的。\n\
    \n  人的每日能量消耗是固定的：实验一\n\n  哈扎人生活在非洲的坦桑尼亚，是世界上最适应以狩猎、采集为生的族群。他们每天的生活非常辛苦，女人们需要天不亮就出门采野果，或者用木棒在地里挖野土豆。男人们则要走几里地，用自制的弓箭狩猎。猎物稀缺时，就只能砍下40英尺高的树木，挖树下的野蜂蜜吃。哈扎部落的孩子也必须要肩负重担，比如去水源地取水，干刮泥。\n\
    \n  直到傍晚，人们才回到部落，围坐在篝火旁，分享一天的收获、照顾孩子。他们被认为是世界上最接近于古人类学家赫马克·庞兹，为了找到能量与运动的关系，用科学的测量量，检测了哈扎人的能量消耗。\n\
    \n  结果出乎意料，尽管他们每天做着艰苦的体力劳动，但哈扎人的数据与享受现代生活方式普通城市居民没有什么分别。坐班男哈扎男人每天摄入并消耗2600卡路里，哈扎女人每天摄入是1900卡路里，这也和美国或欧洲的成人一样。\n\
    \n  人的每日能量消耗是固定的：实验二\n\n  2008年，芝加哥大学的雅拉大学的研究人员比较了生活在非洲游牧民族和尼日利亚的农村妇女，以及世界各地的98位样本。发现，享受着现代生活便利的城市人和发展中国家天需要从事重体力劳动的农民消耗的能量也是一样的。\n\
    \n  为了研究个体差异，研究者又进一步实验，要求300多名受试者戴上仅比小米手小的计步器，来测试他们每天的运动量和能量的相互关系。这些接受测试者，包括非常活跃、运动量很大的人，也包括中度活跃的一般人，以及每天进行少量运动或不运动的人群。\n\
    \n  结果发现，平均下来，每天坐在沙发上看电视的人比活动量是运动量的人相比，能量消耗的差异并不明显，运动量更大的人只是比很多人多消耗了200卡路里，也就是一杯牛奶的热量。\n\
    \n  这些试验证明，运动和能量消耗之间并没有直接关系。\n\n  身体如何在能耗相同的情况下，做更多活动\n\n  文章说，对于这个问题，科学家也无法回答。而且，即使是这样，无论是否试图，身体都会通过某些强度来消耗一定的能量，保持每天保持能量水平以及卡路里消耗的一致。\n\
    \n  有一种解释是，活动更多的人，可能在更微小的方面改变了自已的方式，从而节省能量。比如经常看屏幕，或者站着，或者他们的睡眠更简单。但是哈扎人还示说，就算这些行为可能有的影响，但也不足以解释人们每日能量消耗的稳定。\n\
    \n  还有一种可能，就是运动比较多的人，体内会自动减少一些器官进行的能量消耗，比如肾管和脑部的活动进行了节能，减少细菌和器官的清理工作给额外的运动提供能量。\n\
    \n  文章举例，过量的运动会使免疫系统的消灭活动，也会减少胰腺激素、黄体化等分泌。在实验室动物的研究中，增加日常运动量对动物的能量消耗并没有增加作用，但减了度的排泄周期，减慢了组织修复速度，极端的情况还会导致一些动物吃掉幼崽，因为孕育下一代需要大量能量，为了节省能量，就本能给砍掉，这都都是身体能量储备起来威胁生命活动。这两种现象，并不能真正解释为什么人的能量消耗始终处于同一水平线上。\n\
    \n  运动并不能减肥\n\n  美国芝加哥大学医学院的研究人员发现，运动并不能减肥。他们对有关肥胖与运动的研究做进行了整理和研究，发现，运动是保持体量的好方法，但不能减肥。大多数人都低估了运动所需的能量，而忽略了食物对热量的控制，减少一公斤脂肪需燃烧8000卡路里，相当于跑130公里消耗的能蛋。这显然是不是正常人可以到的。\n\
    \n  而且大部分人运动之后都有补偿心理，一些看起来不大的能量补充，不经意间就会把额外运动消耗的卡路里。\n\n  运动不消耗能量，但不意味着不需锻炼\n\n\
    \  文章指出，运动对于提高心功能和免疫系统功能有很大作用，还可以增强大脑功能，帮助人们更敏捷地变老。\n\n  总结：用锻炼配合节食\n\n  人类能量消耗基本守恒的研究只是说明，锻炼不是控制体重的好方法，特别是对于那些要减肥的人来说。\n\
    \n  文章指出，减肥的关键并不在于运动，人体在状态性，会保证人体每天消耗的能量基本固定，并不会因为运动而大量耗能。\n\n  对于想要减肥的人来说，要把节食和运动作为两种不同的工具。运动用来保持健康和活力，注意配合食用来控制体重，所以最好的减肥办法是，用锻炼配合节食。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_57_1.png)\n\n  在减肥中，要把运动和饮食当做不同的工具，用运动保持健康活力，用饮食来控制体重。\n\
    \n  It is different to think of diet and exercise as different tools with different\
    \ strengths. Exercise to stay healthy and vital; focus on diet to look after your\
    \ weight.\n\n  —— Scientific American\n\n![](img/2b1f55794a32401f6e1d5425100884b9_57_2.png)\n\
    \n### 本期杂志：《科学美国人》\n\n  美国的一本科普杂志，始于1845年8月28日。它是美国历史最悠久的杂志之一，也是著名杂志《科学》(Science)的姊妹刊。到目前，共有150多位诺贝尔奖得主为《科学美国人》撰稿过。\n\
    \n### 下期预告：《快公司》\n\n  每个人都有各种各样的计划，怎样应对这些计划被意外打乱？如何做调整？《快公司》邀请了200名领先管理者和商界精英和你分享经验。\n\
    \n## 96位全球顶尖领袖的经营智慧\n\n  本篇音频及文稿参考《快公司》2月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_58_0.png)\n\
    \n### 内容简介\n\n  - 1. 企业或组织应该如何保持核心竞争力？\n  - 2. Uber是怎样保持行动力的？为什么开展一项利润不高的业务？\n\
    \  - 3. 奢侈品品牌Ralph Lauren 为什么每天设计成数以百计的？并不都会大卖的产品？\n  - 4. 企业和组织如何自我迭代，升级更新？\n\
    \n### 知识清单\n\n  《快公司》\n  全球三大财经商业媒体之一，也是美国最具影响力的商业杂志之一。主编Alan Weber秉持着“世界和商业正在彼此改变，我们怎么能置身事外”的理念，创办了《快公司》杂志。杂志致力于传达那些在快速发展的商业世界里，真正实现改变的故事和理念。\n\
    \n### 世界顶尖领袖的经验和教训\n\n  本期《快公司》杂志邀请了超过200名各行业的领军人物，他们过去有哪些教训和经验进行了讨论，并刊录了其中96位发言者的访谈精华。他们的思考主要体现在三个方面：一、如何保持核心竞争力；二、怎么保持行动力；三、不断自我迭代和升级。\n\
    \n  第一点，保持核心竞争力\n\n  文章指出，关键在竞争中保持和巩固自己的优势，最关键的是，就是做好自己的那部分。做产品的，就主张质量。做服务的，就以客户体验为根本。\n\
    \n  日本生活用品零售商Mujii（无印良品）的美国总裁，在解释无印良品的企业使命时说，“我们的产品，永远是功能性和质量最重要，所以我们产品在全世界都是一样的，就是以产品取胜。”这个就是做产品的坚持把质量做好。\n\
    \n  而说到客户体验，美国眼镜电商Warby Parker的客服质量很高。如果他们的服务人员在陪客户聊天中，发现客户有哪一方面信息缺失，比如客户提到了指甲王，他们就会马上派一个了解指甲王的客服跟客户聊天。客户要是喜欢哈利·波特，他们会直接邮寄哈利·波特的经典围巾、新出的书，只为让客户开心。\n\
    \n  在96位高管的观念里，不管他们的发展方向有多不同，营销方式有多创新，但有一个根本的大前提，就是先巩固好自己的核心产品和服务。\n\n  第二点，如何保持行动力\n\
    \n  Uber早期提供的服务和“黑车”差不多，只服务少数人，主要匹配那些开豪华车的司机和需要豪车的人，而且时间上还很有限，只能是非高峰时段。这个业务范围很窄。但即使这样，Uber仍然获得了很高的利润。他们随后推出了一个新服务——Uber\
    \ X，最大的特点就是价格便宜。但对Uber来说，意味着利润减少了。\n\n  Uber解释地：“我们要是做做，别人就会做。为了抢占这个市场，保护我们的行业地位，我们必须做做。”\n\
    \n  中国的腾讯曾推出的QQ软件风靡神州大地，腾讯随后也推出了微信，相当于自己跟自己竞争。但如果不做微信，腾讯未必有现在的影响力。\n\n  另一个例子，美国奢侈品牌Ralph\
    \ Lauren的副总兼CEO说：“我们每天都会生产设计出数以百计的产品，你说得全卖么？当然不会。但是在这个过程中我们就知道，哪些方法是有效的，哪些是没用的。接下来我们就可以改进那些没用的方法，保留那些有效的，我们必须行动。”他还举了一个例子，是著名电影导演伍迪·艾伦的一句话：“一条鲨鱼要想活着，就必须不停地往前游，否则就会死掉。”\n\
    \n  开始行动才有更多可能，不要害怕失败，勇敢地去尝试。这个就是保持行动力的秘诀。\n\n  第三点，不断自我升级，保持优势\n\n  无论是商业上一直保持良好业绩的常青树公司，还是那些上升势头很猛的创业公司。他们都不仅创造了一个好的开始，而且还能维持好的势头。\n\
    \n  打江山难，守江山更难。Uber就是通过不断升级服务版本，使价格更低、服务更好，让自己不断膨胀整个行业。\n\n  Ralph Lauren的副总兼CEO，为了能有新的创意，抓紧一切机会去交流，寻求灵感，甚至包括服装零售店里的店员。\n\
    \n### 总结\n\n  不但是公司，每个普通人也一样。先审视一下自己最擅长什么，不断发掘，找到核心竞争力，不断尝试各种可能性，找到对路的发展方向之后，咬紧牙关，不停升级迭代。那些别人眼中的成功者，也都是遵循这样的逻辑，经营自己的人生。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_58_1.png)\n\n  > 一条鲨鱼要想活着，就必须不停地往前游，否则就会死掉。\n\
    \  >\n  > ——伍迪·艾伦\n  > 美国知名导演\n\n  A shark has to keep moving forward or it dies.\n\
    \  — American director Woody Allen\n\n![](img/2b1f55794a32401f6e1d5425100884b9_58_2.png)\n\
    \n### 本期杂志：《快公司》\n\n  著名的前沿商业媒体，也是世界历史上成长最长的媒体品牌。创刊已经超过20年的《快公司》，是全球三大财经商业媒体之一。\n\
    \n### 未来预告：《新闻周刊》\n\n  特朗普上台前，曾批判华盛顿的说客集团，将美国政治搞得乌烟瘴气。如今特朗普已就政，这些说客集团怎么样了？\n"
  mdcn: "\n## 信任提升敬业度，这科学吗？\n\n  本篇音频及文稿参考《哈佛商业评论》1月、2月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_55_0.png)\n\
    \n### 知识清单\n\n  《哈佛商业评论》\n\n  哈佛商学院的标志性杂志。致力于给全世界的专业人士提供缜密的管理见解和最好的管理案例。\n\n \
    \ 信任的力量\n\n  如果一个老板信任自己的员工，愿意把重要工作交给他处理，不仅可以使这个人获得更多展示自己的机会。同时，他因为感受到老板的信任，也会更有干劲，工作更卖力更紧，比别人更容易做出成绩。这种双向的正循环，就是信任的力量。\n\
    \n  什么是催产素\n\n  催产素并非女性专利，男女均可分泌催产素。它减少对老年人脑内肾上腺素释放及激素的水平，从而降低血压。当心情压抑或者有强烈归属感时，心脏会分泌催产素，使体内组织的供氧量大量增加，压力得到纾缓。\n\
    \n  信任背后的科学道理\n\n  文章的作者保罗·扎克，是美国克莱蒙特研究大学的行为神经学、心理学及管理学教授，同时也是经济心理学研究中心创始人兼负责人。经过多年的研究，他发现，信任与一种叫做催产素的人体激素，有着密切的关系。\n\
    \n  作者做了一个实验，让一个人给陌生人汇款，无论谁少，对方都会得到3倍于汇出数目的钱数，对于收汇款者，可以选择把这多钱分给汇者一部分，也可以自己全部留下。是否决定汇钱，就代表着汇款者是选择信用人，还是与收汇款者分享收到的钱，则取决于收款者是决定分享或被信任的人，在汇款者和收款者做出决定前后，研究团队抽取了这些人的血液进催产素的激素水平。\n\
    \n  研究发现，收款者收到的钱越多，也就表示他被信任的程度越高，大脑分泌的催产素的数量也就越多，而越高水平的催产素分泌，也使得收款者更愿意分享自己收到的钱。\n\
    \n  也就是说，一个人被信任的程度越高，这个人也就更愿意去信任别人，做出对彼此都更好的行为。这就是信任产生力量背后的科学道理。\n\n  高信任度公司的表现为优\n\
    \n  员工对组织的信任度极为重要，作者团队在2016年通过调查研究做了一项调查。他们在全美范围内收集了1095名各企业代表的数据。这些数据比较了对企业高度信任的员工与对企业不那么信任的员工。\n\
    \n  数据显示，对企业高度信任的员工，要比对企业没那么信任的员工工作得高16%，工作效率高出50%，请假少13%。高信任度公司的各种数据表现都极其优异。\n\
    \n  在团队中创造出高信任氛围的八种方法\n\n  - 1、对员工优秀的表现给予认可\n\n    员工优秀表现得到认可，可以是公开认可，可以是私下认可，对员工的信任度都有着巨大的影响。要在公开场合，把员工做出的事项影响，进行表彰。这不仅可以提升员工对组织的信任，还可以让其他人起到榜样作用。\n\
    \n  - 2、对员工施加适当的挑战压力\n\n    适当的压力也可以促进人体分泌和提高信任度的激素水平，所以管理者来说，可以给下属员工布置挑战性任务，让团队一起解决，还可以让团队形成紧密的关系网。\n\
    \n  - 3、给员工更多的自主性\n\n    如果员工感受到自己对工作内容可以进行选择，可以用自己舒服的方式工作，拥有更多自主权，感受到的被信任感将会更强。但这并不表示管理者容许怠忽、降低期望。给员工更多自主性的目的，在于让员工自己承担责任，对工作更有清晰的认识，并担起责任，努力用于实现目标，提高公司效率。\n\
    \n  - 4、帮助员工全面成长\n\n    高信任度的公司，不仅关注员工的工作能力，也关注员工的个人成长。管理者不仅帮助员工明确工作目标，让员工自主选择工作方式，还会关注员工个人的职业发展，并给出有效建议。同时，为员工成长，提供更多资源支持，这对于留住人才及提高员工的信任度都有着巨大的帮助。\n\
    \n  - 5、适当示弱\n\n    对管理者而言，可以适当示弱，这会激发员工的责任感，同时对公司管理者更深度的信任，并且对管理者产生更大的信任。开源软件公司Red\
    \ Hat的CEO Jim Whitehurst说：“我发现，承认自己不会的东西，能产生超乎寻常的好效果，这帮助我建立良好信任。”\n\n  总结\n\n\
    \  这些方法不仅适用于团队管理，而且可以在两性、家庭生活和伙伴间都可以使用。比如，对自己的伴侣或朋友，如果你知道他表现优秀，要鼓励朋友表现一下，能增加彼此的好感度，提升彼此之间的信任。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_55_1.png)\n\n  领导的首要职责是去定义真实，表示感谢是最后一职责。在二者之间，领导最重要的角色就是做一个服务者。\n\
    \  ——《哈佛商业评论》\n  The first responsibility of a leader is to define reality. The\
    \ last is to say thank you.\n  In between the two, the leader must become a servant.\n\
    \  Harvard Business Review\n\n![](img/2b1f55794a32401f6e1d5425100884b9_55_2.png)\n\
    \n  本期杂志：《哈佛商业评论》\n  创刊于1922年，“哈佛商学院”标志性杂志，致力于给全世界的管理专业人士，提供缜密的管理见解和最实用的管理案例。\n\
    \n  下期预告：《连线》\n  如何利用“加速”技术，增强学习力，将学习速度增强30%以上。\n\n## 如何“加速”提升学习效率\n\n  本条音频及文稿参考《连线》2月刊\n\
    \n![](img/2b1f55794a32401f6e1d5425100884b9_56_0.png)\n\n### 知识清单\n\n  《连线》杂志 被誉为“极客的圣经”。《失控》一书的作者、著名作家凯文·凯利，是这本杂志的创始主编。人们熟知的“长尾理论”，也是《连线》最早提出的。这本杂志服务于关注并对科技有浓厚兴趣的人，希望通过报道，引领一种时髦、有范的生活方式。杂志编辑认为，“科技终将对人类生活的方方面面，产生改变。”\n\
    \n### 提升学习效率的加速技术\n\n  简单来说，就是学习视频或音频课程时，快进它的播放速度，这种方法可以将学习速度提升30%以上。 但这并不是简单地调速听节目，也需要快速搭配。\
    \ 目前播客软件中，最常用的是1.5倍速，这个速度在国外播客软件中有一个专有名词，叫做Smart Speed，翻译成中文，就是“智慧速度”。\n\n###\
    \ “略读”技巧\n\n  读书时，不断根据内容来调整自己的阅读速度，遇到熟悉、可以看懂的内容就快读，遇到不好懂的内容，就放慢速度反复读，直到读懂为止。英语考试的阅读板块中也有快速阅读，培养的都是迅速定位重要信息的能力。\
    \ 用“加速”技术快速听音频，其实就是听音频时的“略读”。 适当调控速度不影响理解 美国北卡罗来纳大学和佛罗里达大学的两位学者在研究中发现，人们在用1.5倍速的速度听科学节目时，理解的内容，和在原始速度下听是相同的。所以调快速度不用担心会有理解上的问题。\n\
    \n### 加速技巧具体应该怎么做\n\n  文章引用了舒适区和学习区的概念，作者说，如果你听的内容在你的舒适区内，也就是听起来没有难度，那么就可以加速听，加速到1.5倍速、2倍速甚至3倍速。但如果听的内容在你的学习区内，也就是听起来有难度的话，就需要用正常速度听，有必要的话，还可以反复多听几遍。也就是说，根据理解程度，选择听内容的速度。\
    \ 对得到用户来说，如果订阅了好几个专栏都想听，但时间不够，就可以先用高倍速整体过一遍，遇到感兴趣的地方，再慢下来，如果没有听不懂的地方，听完了也就吸收了整体的知识。\n\
    \n### 如何通过提升关注度来增强学习效果\n\n  麦吉尔大学心理学教授和神经学家Daniel Levitin在《音乐感知的科学：用理性解释感性》一书中，提到了如何提升关注度来增强学习效果。\
    \ 丹尼尔教授指出，在长时间的高强度工作或学习中，短暂的休息可以大大增强效率。其中，最有效的休息方式，就是做和之前学习内容完全无关的事情。比如，你已经听了30分钟1.5倍速的课程，接下来可以休息5分钟，去冲杯咖啡，和别人聊聊天。再回到工作、学习里时，又会是元气满满的了。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_56_1.png)\n\n  > 加速的前提，是不要让自己失控。\
    \ ——《连线》\n  >\n  > If we’re going to speed up, we should make sure that we don’t\
    \ lose control. — Wired\n\n### 本期杂志：《连线》\n\n  美国《连线》（Wired）杂志是一份科技类月刊，创刊于1993年，被誉为“极客的圣经”。\n\
    \n### 下期预告：《科学美国人》\n\n  为什么运动并不能帮助人减肥？人的能量消耗和体育锻炼到底有怎样的关系？\n\n## 运动到底能不能减肥\n\n\
    \  本篇音频及文摘参考《科学美国人》2月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_57_0.png)\n\
    \n### 知识清单\n\n  《科学美国人》\n  美国历史非常悠久的科普杂志，1845年创刊至今，已经有150多位诺贝尔奖获得者在上面发表过文章，如爱因斯坦、沃森、DNA双螺旋结构的发现者克里克等。\n\
    \n  《科学美国人》与另外一本非常著名的科学类刊物《自然》的差异在于，《自然》采用同行评审的方式审稿件，而《科学美国人》则邀请一众专栏作者、大家发表科学理论和科学新发现。总体来说，《科学美国人》是一本更加大众化的科学杂志。\n\
    \n  人的每日能量消耗是固定的\n\n  这篇文章指出，和很多人想的不同，运动其实并不能减肥。因为人类是一个每天消耗大量能量的物种，任何人每天消耗的能量大致是差不多的。\n\
    \n  人的每日能量消耗是固定的：实验一\n\n  哈扎人生活在非洲的坦桑尼亚，是世界上最适应以狩猎、采集为生的族群。他们每天的生活非常辛苦，女人们需要天不亮就出门采野果，或者用木棒在地里挖野土豆。男人们则要走几里地，用自制的弓箭狩猎。猎物稀缺时，就只能砍下40英尺高的树木，挖树下的野蜂蜜吃。哈扎部落的孩子也必须要肩负重担，比如去水源地取水，干刮泥。\n\
    \n  直到傍晚，人们才回到部落，围坐在篝火旁，分享一天的收获、照顾孩子。他们被认为是世界上最接近于古人类学家赫马克·庞兹，为了找到能量与运动的关系，用科学的测量量，检测了哈扎人的能量消耗。\n\
    \n  结果出乎意料，尽管他们每天做着艰苦的体力劳动，但哈扎人的数据与享受现代生活方式普通城市居民没有什么分别。坐班男哈扎男人每天摄入并消耗2600卡路里，哈扎女人每天摄入是1900卡路里，这也和美国或欧洲的成人一样。\n\
    \n  人的每日能量消耗是固定的：实验二\n\n  2008年，芝加哥大学的雅拉大学的研究人员比较了生活在非洲游牧民族和尼日利亚的农村妇女，以及世界各地的98位样本。发现，享受着现代生活便利的城市人和发展中国家天需要从事重体力劳动的农民消耗的能量也是一样的。\n\
    \n  为了研究个体差异，研究者又进一步实验，要求300多名受试者戴上仅比小米手小的计步器，来测试他们每天的运动量和能量的相互关系。这些接受测试者，包括非常活跃、运动量很大的人，也包括中度活跃的一般人，以及每天进行少量运动或不运动的人群。\n\
    \n  结果发现，平均下来，每天坐在沙发上看电视的人比活动量是运动量的人相比，能量消耗的差异并不明显，运动量更大的人只是比很多人多消耗了200卡路里，也就是一杯牛奶的热量。\n\
    \n  这些试验证明，运动和能量消耗之间并没有直接关系。\n\n  身体如何在能耗相同的情况下，做更多活动\n\n  文章说，对于这个问题，科学家也无法回答。而且，即使是这样，无论是否试图，身体都会通过某些强度来消耗一定的能量，保持每天保持能量水平以及卡路里消耗的一致。\n\
    \n  有一种解释是，活动更多的人，可能在更微小的方面改变了自已的方式，从而节省能量。比如经常看屏幕，或者站着，或者他们的睡眠更简单。但是哈扎人还示说，就算这些行为可能有的影响，但也不足以解释人们每日能量消耗的稳定。\n\
    \n  还有一种可能，就是运动比较多的人，体内会自动减少一些器官进行的能量消耗，比如肾管和脑部的活动进行了节能，减少细菌和器官的清理工作给额外的运动提供能量。\n\
    \n  文章举例，过量的运动会使免疫系统的消灭活动，也会减少胰腺激素、黄体化等分泌。在实验室动物的研究中，增加日常运动量对动物的能量消耗并没有增加作用，但减了度的排泄周期，减慢了组织修复速度，极端的情况还会导致一些动物吃掉幼崽，因为孕育下一代需要大量能量，为了节省能量，就本能给砍掉，这都都是身体能量储备起来威胁生命活动。这两种现象，并不能真正解释为什么人的能量消耗始终处于同一水平线上。\n\
    \n  运动并不能减肥\n\n  美国芝加哥大学医学院的研究人员发现，运动并不能减肥。他们对有关肥胖与运动的研究做进行了整理和研究，发现，运动是保持体量的好方法，但不能减肥。大多数人都低估了运动所需的能量，而忽略了食物对热量的控制，减少一公斤脂肪需燃烧8000卡路里，相当于跑130公里消耗的能蛋。这显然是不是正常人可以到的。\n\
    \n  而且大部分人运动之后都有补偿心理，一些看起来不大的能量补充，不经意间就会把额外运动消耗的卡路里。\n\n  运动不消耗能量，但不意味着不需锻炼\n\n\
    \  文章指出，运动对于提高心功能和免疫系统功能有很大作用，还可以增强大脑功能，帮助人们更敏捷地变老。\n\n  总结：用锻炼配合节食\n\n  人类能量消耗基本守恒的研究只是说明，锻炼不是控制体重的好方法，特别是对于那些要减肥的人来说。\n\
    \n  文章指出，减肥的关键并不在于运动，人体在状态性，会保证人体每天消耗的能量基本固定，并不会因为运动而大量耗能。\n\n  对于想要减肥的人来说，要把节食和运动作为两种不同的工具。运动用来保持健康和活力，注意配合食用来控制体重，所以最好的减肥办法是，用锻炼配合节食。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_57_1.png)\n\n  在减肥中，要把运动和饮食当做不同的工具，用运动保持健康活力，用饮食来控制体重。\n\
    \n  It is different to think of diet and exercise as different tools with different\
    \ strengths. Exercise to stay healthy and vital; focus on diet to look after your\
    \ weight.\n\n  —— Scientific American\n\n![](img/2b1f55794a32401f6e1d5425100884b9_57_2.png)\n\
    \n### 本期杂志：《科学美国人》\n\n  美国的一本科普杂志，始于1845年8月28日。它是美国历史最悠久的杂志之一，也是著名杂志《科学》(Science)的姊妹刊。到目前，共有150多位诺贝尔奖得主为《科学美国人》撰稿过。\n\
    \n### 下期预告：《快公司》\n\n  每个人都有各种各样的计划，怎样应对这些计划被意外打乱？如何做调整？《快公司》邀请了200名领先管理者和商界精英和你分享经验。\n\
    \n## 96位全球顶尖领袖的经营智慧\n\n  本篇音频及文稿参考《快公司》2月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_58_0.png)\n\
    \n### 内容简介\n\n  - 1. 企业或组织应该如何保持核心竞争力？\n  - 2. Uber是怎样保持行动力的？为什么开展一项利润不高的业务？\n\
    \  - 3. 奢侈品品牌Ralph Lauren 为什么每天设计成数以百计的？并不都会大卖的产品？\n  - 4. 企业和组织如何自我迭代，升级更新？\n\
    \n### 知识清单\n\n  《快公司》\n  全球三大财经商业媒体之一，也是美国最具影响力的商业杂志之一。主编Alan Weber秉持着“世界和商业正在彼此改变，我们怎么能置身事外”的理念，创办了《快公司》杂志。杂志致力于传达那些在快速发展的商业世界里，真正实现改变的故事和理念。\n\
    \n### 世界顶尖领袖的经验和教训\n\n  本期《快公司》杂志邀请了超过200名各行业的领军人物，他们过去有哪些教训和经验进行了讨论，并刊录了其中96位发言者的访谈精华。他们的思考主要体现在三个方面：一、如何保持核心竞争力；二、怎么保持行动力；三、不断自我迭代和升级。\n\
    \n  第一点，保持核心竞争力\n\n  文章指出，关键在竞争中保持和巩固自己的优势，最关键的是，就是做好自己的那部分。做产品的，就主张质量。做服务的，就以客户体验为根本。\n\
    \n  日本生活用品零售商Mujii（无印良品）的美国总裁，在解释无印良品的企业使命时说，“我们的产品，永远是功能性和质量最重要，所以我们产品在全世界都是一样的，就是以产品取胜。”这个就是做产品的坚持把质量做好。\n\
    \n  而说到客户体验，美国眼镜电商Warby Parker的客服质量很高。如果他们的服务人员在陪客户聊天中，发现客户有哪一方面信息缺失，比如客户提到了指甲王，他们就会马上派一个了解指甲王的客服跟客户聊天。客户要是喜欢哈利·波特，他们会直接邮寄哈利·波特的经典围巾、新出的书，只为让客户开心。\n\
    \n  在96位高管的观念里，不管他们的发展方向有多不同，营销方式有多创新，但有一个根本的大前提，就是先巩固好自己的核心产品和服务。\n\n  第二点，如何保持行动力\n\
    \n  Uber早期提供的服务和“黑车”差不多，只服务少数人，主要匹配那些开豪华车的司机和需要豪车的人，而且时间上还很有限，只能是非高峰时段。这个业务范围很窄。但即使这样，Uber仍然获得了很高的利润。他们随后推出了一个新服务——Uber\
    \ X，最大的特点就是价格便宜。但对Uber来说，意味着利润减少了。\n\n  Uber解释地：“我们要是做做，别人就会做。为了抢占这个市场，保护我们的行业地位，我们必须做做。”\n\
    \n  中国的腾讯曾推出的QQ软件风靡神州大地，腾讯随后也推出了微信，相当于自己跟自己竞争。但如果不做微信，腾讯未必有现在的影响力。\n\n  另一个例子，美国奢侈品牌Ralph\
    \ Lauren的副总兼CEO说：“我们每天都会生产设计出数以百计的产品，你说得全卖么？当然不会。但是在这个过程中我们就知道，哪些方法是有效的，哪些是没用的。接下来我们就可以改进那些没用的方法，保留那些有效的，我们必须行动。”他还举了一个例子，是著名电影导演伍迪·艾伦的一句话：“一条鲨鱼要想活着，就必须不停地往前游，否则就会死掉。”\n\
    \n  开始行动才有更多可能，不要害怕失败，勇敢地去尝试。这个就是保持行动力的秘诀。\n\n  第三点，不断自我升级，保持优势\n\n  无论是商业上一直保持良好业绩的常青树公司，还是那些上升势头很猛的创业公司。他们都不仅创造了一个好的开始，而且还能维持好的势头。\n\
    \n  打江山难，守江山更难。Uber就是通过不断升级服务版本，使价格更低、服务更好，让自己不断膨胀整个行业。\n\n  Ralph Lauren的副总兼CEO，为了能有新的创意，抓紧一切机会去交流，寻求灵感，甚至包括服装零售店里的店员。\n\
    \n### 总结\n\n  不但是公司，每个普通人也一样。先审视一下自己最擅长什么，不断发掘，找到核心竞争力，不断尝试各种可能性，找到对路的发展方向之后，咬紧牙关，不停升级迭代。那些别人眼中的成功者，也都是遵循这样的逻辑，经营自己的人生。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_58_1.png)\n\n  > 一条鲨鱼要想活着，就必须不停地往前游，否则就会死掉。\n\
