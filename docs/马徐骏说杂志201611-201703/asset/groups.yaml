    \n### 本期杂志：《连线》\n\n美国《连线》（Wired）杂志是一份科技类月刊，创刊于1993年，被誉为“极客的圣经”。\n\n### 下期预告：《哈佛商业评论》\n\
    \n如果你遇到一个“坏”老板，那该如何与他相处？《哈佛商业评论》给你支招，告诉你如何改善与“不良”上司的关系。\n\n## 如何与“坏老板”相处？\n\n\
    本条音频及文稿参考《哈佛商业评论》12月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_27_0.png)\n\n\
    ### 知识清单\n\n《哈佛商业评论》杂志，创刊于1922年，是“哈佛商学院”的标志性刊物，致力于给全世界的专业人士提供缜密的管理见解和最好的管理案例。\n\
    \n“哈佛商学院”作为世界顶尖的学术机构，在描述自独特的教学法，最著名的就是案例分析。\n\n教授往往通过一些具体的案例，深入浅出地把抽象、枯燥的概念讲析出来。《哈佛商业评论》的文章，也秉承了这个特点。\n\
    \n文章引用了盖洛普公司的一项研究——《全球工作状况调查》。盖洛普公司由乔治·盖洛普博士于1930年代创立，是一家全球知名的、进行民意测验和商业调查的咨询公司，盖洛普提供的数据专业、权威。\n\
    \n研究结果表明，有半数的美围职员在职业生涯中，有过为了逃离老板而辞职的情况。这个数字在欧洲、亚洲或非洲等地甚至更多，这也说明上司不合引发员工辞职，是一个世界性的问题。\n\
    \n研究还显示，“员工敬业度”与上下级关系的好坏，有非常大的关系。\n\n全情投入到工作中的员工，有77%的人，在描述他们与上级关系时，会使用积极词汇，比如“我的上级很关注我的优点。”\n\
    \n而认为自己不那么投入工作的员工，以及认为自己完全没投入工作的员工，分别只有23%和4%的人，会使用积极的词汇来描述自己和上级的关系。\n\n这个研究表明，一个能提高“员工敬业度”的工作环境，是企业成功的关键因素之一。如果员工处理不好自己跟老板的关系，将对企业的成长和发展产生非常大的影响。\n\
    \n而根据盖洛普的研究，在全世界的所有员工当中，只有13%能够被归类为积极工作，可以促进企业获得成功的人。\n\n《哈佛商业评论》这篇文章的作者，是一位资深的企业管理教练，他提出了五点可以改善员工和老板关系的建议：\n\
    \n- 1、提高同理心\n即换位思考，主动体会老板的难处。\n作者认为，我们应该关注的不是老板做了什么，而是老板为什么会这样做。“同理心”可以通过锻炼提高，如果能够持续练习，你会对他人情绪的感知度变得更加敏锐。\n\
    \n- 2、内观和自我审视\n即审视自身的问题，采取措施。文章建议，可以观察老板关系不错的同事，从他们身上吸取建议和经验。必要的时候，向他们求助。也可以在团建和小组讨论的时候，直接听取意见，甚至可以直接询问老板的意见。\n\
    \n- 3、单刀直入\n如果在换位思考和自我反省之后，问题依然没有得到解决，就可以采取“单刀直入”的方法，即开诚布公地跟老板探讨你们碰到的问题，寻找解决方法。\n\
    对此，文章提出两项建议：\n一、尽量找一个安静又容易专心的地方探讨，比如邀请老板吃茶。\n二、要让老板明白，这是在讨论工作，而不是私人恩怨。\n\n- 4、向上反映\n\
    如果开诚布公的谈话依然无用，且身边的同事也有同样的困惑。那么可以考虑直接对公司的HR或老板的老板反映问题，证明老板的行为对于整个团队或公司是有害的。\n但这点需要特别小心，没有确凿的证据不建议使用。\n\
    \n- 5、另谋高就\n如果前4点努力都宣告无效，一些人会选择采取避险策略，少跟老板接触。\n但文章指出，绝不可能没有底线地跟老板相处，与其这样，还不如另谋高就。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_27_1.png)\n\n> 大多数“坏老板”都不是天生的坏人，他们只是有缺点的好人。\n\
    ——《哈佛商业评论》\nMost bad bosses are not inherently bad people; they're good people\
    \ with weaknesses.\n—— Harvard Business Review\n\n![](img/2b1f55794a32401f6e1d5425100884b9_27_2.png)\n\
    \n### 本期杂志：《哈佛商业评论》\n\n创刊于1922年，“哈佛商学院”标志性杂志，致力于给全世界的管理专业人士，提供缜密的管理见解和最有用的管理案例。\n\
    \n### 下期预告：《大西洋月刊》\n\n在美国人眼中，奥巴马是否是一个好总统？中国人民的老朋友、美国前国务卿基辛格，如何看待今天的中美关系？\n\n##\
    \ 奥巴马是不是一位好总统？\n\n本篇音频及文稿参考《大西洋月刊》12月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_28_0.png)\n\
    \n### 知识清单\n\n《大西洋月刊》是一本综合性刊物，内容涉及政治、科学、文艺等方向，被誉为“美国最受尊敬的杂志之一”。这本杂志历史悠久，始终坚持无党派、无偏见，且文章具有很高的艺术性，包括海明威在内的很多重大文章，都在《大西洋月刊》上发表过文章。\n\
    \n#### “幼儿园测试”\n\n文章的作者认为，当一位美国总统，与当一位幼儿园老师在很多方面有相似之处，也就是说，他们都要有在工作结束之后，把手头事务处理干净、平稳交接的能力。而对于这种能力的评测，被作者称之为“幼儿园测试”。\n\
    \n文章指出，能在卸任时不留下大问题、通过“幼儿园测试”的总统，其实并不多。\n\n第36任美国总统林顿·约翰逊离任时，留下了“越战”问题；第37任总统尼克松留下了“水门事件”的丑闻；而吉米·卡特总统和小布什总统都留下了经济不振的窘境。\n\
    \n文章的作者认为，奥巴马在这个问题上就做得很好，他通过了“幼儿园测试”，卸任时没有留下大问题。这相当于给继任的特朗普留了两份大礼：时间和自主权。\n\n\
    1. 时间。即特朗普可以快速开展工作，不用先花大量时间处理前任总统遗留的工作尾巴。\n2. 自主权。即特朗普不用受到奥巴马施政纲领的影响，能够按照自己的设想治国理政。\n\
    \n作者认为，作为总统，奥巴马一共做好了五件事：\n\n### 一、复苏美国经济\n\n奥巴马接任总统时，美国的经济状况不容乐观，经过其八年努力，美国经济已经开始再现活力。并且奥巴马还解决了全球化、贫富差距和税制改革等一系列问题。特朗普接棒奥巴马时，无需为经济太过担心。\n\
    \n### 二、解决国内安全问题\n\n奥巴马就任总统期间，美国的犯罪率达到了自1970年代以来的历史最低点。\n\n重要的是，奥巴马是在全球恐怖活动升级的大背景下，做到的这一点，非常不容易。\n\
    \n### 三、推动医疗改革\n\n在奥巴马的“医疗改革方案”提出之前，美国的医疗保健状况非常糟糕：普通人减少或不买医保，同时医保价格持续升高，形成死循环。\n\
    \n奥巴马的医改出台后，不参加保险的人数降低了近二个百分点，医疗费用的上涨速度也放缓了。可以说，奥巴马为美国的整个医疗系统争取到了非常宝贵的改革时间。\n\n\
    ### 四、重视环境问题\n\n相比较起美国人普遍对环境危机的冷漠态度，文章作者认为，奥巴马在任期内达成《巴黎协定》——美国将共同与未来世界的环境保护——是重要的政绩。\n\
    \n### 五、采取了灵活的外交政策\n\n作者认为，奥巴马更好地处理了美国同伊朗之间的关系，使两国之间因为核武器等问题剑拔弩张的氛围，得到缓解，避免了武力冲突。\n\
    \n作者认为，能够把一场大的危机，化解为相对可控的问题，就是一场胜利。\n\n当然，奥巴马也遗留了问题：\n\n1. 在叙利亚和伊拉克的IS恐怖组织的问题上，奥巴马的处理并不妥当。但作者认为，他至少坚决没让这些局部的地区冲突，升级成美国需要进行军事干预的状况。\n\
    2. 相比于上世纪的越南战争，这对于美国还不算是太大的危机。\n\n2. 奥巴马没有实现自己所许的“变革”。\n\n奥巴马赢得选举是打着“变革”的旗号，他曾承诺要改变华盛顿当时的政治状况，但并没有做到。直到奥巴马任期结束，大家也没有明显地感受到所谓的“变革”，这也是很多人对奥巴马表示失望的原因。\n\
    \n文章作者认为，很多人对于总统所谓的“功绩”，往往有一种不切实际的想象，比如，认为总统就要赢得一场战争、取得巨大的外交胜利或者完成一次轰轰烈烈的改革。\n\
    \n但作者强调，这些人忽略了一点，就是一个总统可以干的坏事，要远多于他能做的事。他们坐在白宫里，身边遍布地雷线，稍微不当心就可能触雷，引发一场巨大的灾难。\n\
    \n“柯立芝繁荣”，是指“一战”之后美国经济的高速增长时期，这段时间正是美国第30任总统柯立芝的任期，因而被称为“柯立芝繁荣”。\n\n小说《了不起的盖茨比》就是以这个时代为背景。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_28_1.png)\n\n> 把危机，变成一个相对可控的问题，这本身就是一场巨大的胜利，这种转换，需要用智慧才能做到。\n\
    \n——《大西洋月刊》\n\nTurning a crisis into a problem is a big accomplishment. This asks\
    \ for wisdom.\n\n— The Atlantic\n\n![](img/2b1f55794a32401f6e1d5425100884b9_28_2.png)\n\
    \n本期杂志：《大西洋月刊》\n\n1857年创刊，美国“最受尊敬的杂志之一”，同时也是“美国国家杂志奖”的常客。\n\n下期预告：《纽约客》\n\n对于特朗普这位纽约郊区“富二代”当选为美国总统，纽约人自己是怎么看的？\n"
  mdcn: "\n## 数字时代，国家如何生存？\n\n本条自摘要及文稿参见《外交事务》11、12月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_25_0.png)\n\
    \n### 知识清单\n\n美国《外交事务》杂志是一本关于国际事务的专业性非常强的刊物，内容主要涉及美国的外交政策和国际事务。从1922年创刊到现在，已近100年。这本杂志的特色是，没有倾向性，允许观点和看法自由表达。\n\
    \n本文的作者安玛丽·斯劳特（Anne-Marie Slaughter）是一位国际问题专家，曾任美国普林斯顿大学公共与国际事务学院院长以及美国国务院的政策规划司司长。斯劳特当时的顶头上司，就是这次参加美国总统竞选失败的、美国前国务卿希拉里·克林顿。\n\
    \n普通人为什么要了解国际事务？首先，美国目前是世界上最大的经济体，在这个全球化一体化的时代，了解美国的精英对未来的看法，无论是对中国的经济环境，还是对个人就业、创业，都有很大作用。\n\
    \n更重要的是，作者斯劳特提出的观点，并不只针对国家，对于机构、组织甚至是个人，都有指导意义。\n\n作者要表达的，是旧世界秩序跟新世界秩序之间的冲突，以及如何做到从旧秩序向新秩序的平坦过渡。这是每一个生存在“数字时代”的人都要面对的趋势和变化。\n\
    \n20世纪旧国家形态和21世纪新国家形态的区别：\n\n20世纪盛行的“棋局论”认为，摊开世界地图，你可以看到用经纬线分国的地表，世界就如同同一个大棋盘。每个国家都是这个棋盘上的棋子。这种视角被称为“棋局论”。直到今天，“棋局论”仍然是绝大多数外交专家坚持的视角。\n\
    \n20世纪旧国家形态：1648年，《威斯特法伦和约》在西欧国家中确立了“民族国家”起源，这使得地理划分、采用“棋局论”观点来看待的国家形态，被称为20世纪旧国家形态。\n\
    \n21世纪新国家形态：建立在传统的20世纪国家形态的基础上，但由“数字时代”造就出来的国家形态，就是21世纪新国家形态。它有着与旧国家形态完全不同的运行逻辑。\n\
    \n作者认为，今后世界上的国家，将不再以意识形态划分，而只分为两类：开放的国家、封闭的国家。\n\n20世纪旧“棋局论”，是一个封闭系统。\n\n在这个系统里只有两种选择：一种是维持现状，另外一种是不断折腾，最后灭亡。而作者斯劳特认为，在21世纪，网络连接的存在，可以帮助旧有国际格局和体制实现升级，变为一个开放系统。这个开放系统，可以不断吸纳新东西进入系统内部，保持一种生长状态，以此摆脱那种能升和下降的状态，实现更新进化。\n\
    \n这种新的，能够注入开放系统的力量，就是这个时代的个人和组织每个个体可以发挥的力量。用好普通人和小个体的力量，可以让21世纪的国家繁荣稳定。\n\n21世纪的“新国家形态”要建立在三个基础上：开放的社会，开放的政府和开放的国际关系。\n\
    \n开放的社会，就是要保障普通人的自由，给予他们安全感。\n\n开放的政府，指的是信息透明。虽然对政府来说，的确有保密的需要，但有些信息的公开透明，可能带来更大的效果。作者认为，2001年美军“9·11”恐怖袭击事件中，如果政府能够提前公开某些信息，将有可能避免其更巨大的灾难。\n\
    \n开放的国际关系体系中，稳定完整繁荣比孤立自给自足更有益。作者认为，正是美国在二战之后实施“马歇尔计划”，促成了战后世界的稳定和繁荣，以及“欧洲一体化”。\n\
    \n开放的社会，开放的政府和开放的国际关系，都强调：压制庞大的体制，鼓励小个体的发展。\n\n作者认为，这个时代需要的并不是一个完全模型的平台，而是许多独立运行的中小型规模平台，可以快速分享和连接，这才是最有活力的状态。\n\
    \n作者认为，现在很多公司和平台太大了，容易导致这样一些怪圈：控制不了怪圈的种种怪行为作祟。并坦言，这些过于集中的大平台，总有一天会因为自身的质量而垮台。\n\
    \n那种求大求全、阶层明晰的“大组织结构”已经过时了。这是一个不能忽视个人和小型组织的力量年代。\n\n在这个时代，组织需要做的，是将组织架构压平，尽量把原来那种“自上而下”的连接，变成点与点之间的连接，以激励个人焕发活力。而国家需要做的，就是让自己变得“波粒二象性”。\n\
    \n物理知识告诉我们，光子有“波粒二象性”，它既是波也是粒子。\n\n所谓国家的“波粒二象性”是指，作为“波”国家要是整体的概念，在国际事务中扮演一个国家政府应该扮演的角色；同时，它又能包含很多粒子，也就是国家内的个体，并鼓励粒子连接，让每个粒子自由释放活力。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_25_1.png)\n\n> 庞大的建筑和帝国，终究会被它自身的重量压垮，轰然倒塌。\n\
    \n——《外交事务》\n\nBuildings and empires really do topple under their own weight.\n\
    \n— Foreign Affairs\n\n本期杂志：《外交事务》\n\n1922年创刊，全球关于国际关系和国际事务最著名的杂志之一。\n\n下期预告：《连线》\n\
    \nFaceboook功能将不再局限于社交娱乐，它会启动安全检查（Safety Check）。在遭遇自然灾害或危险事件的关键时刻，安全检查机制会如何运作，它又会对人们的生活产生哪些影响？\n\
    \n## Facebook 可以救命吗？\n\n本条音频及文稿参考《连线》12月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_26_0.png)\n\
    \n### 知识清单\n\n《连线》杂志的英文名是“Wired”，它是一本美国的科技大刊。这本杂志坚定地认为：“科技终将让人类生活的各个方面产生改变”。\n\
    \n今天这篇文章，原标题是“Could Facebook Save Your Life?” 翻译过来，就是“Facebook 真的能救命吗？” 主要介绍了\
    \ Facebook 推出的两项应对灾难的服务，一个是“平安信使”（Safety Check），另一个是“脸书直播”（Facebook Live）。\n\n\
    - Facebook“平安信使”的功能主要包括：\n  1. 当用户身处受灾或危险区域时，Facebook 会发给用户一条推送，询问你是否安全。\n  2.\
    \ 推送上有绿色和白色两个按钮。绿色按钮代表“我很安全”，白色按钮代表“我不在这个地方”。点击绿色按钮时，用户 Facebook 上的所有朋友都会被提醒你是安全的。\n\
    \  3. 用户也会得到一个所有在受灾区域的朋友名单。\n\n今年6月发生的“美国奥兰多枪击事件”，是 Facebook“平安信使”服务首次在美国本土启用。\n\
    \n当晚，在枪击案酒吧附近所有的 Facebook 用户，都收到了一个弹出的推送，上面写道：“你还好吗？现在你正处于奥兰多枪击案发生地的附近，告诉你的朋友，你很安全。”\n\
    \n“平安信使”服务的灵感始于5年前。2011年“东日本大地震”发生时，Facebook 推出了“留言板”服务，用户可以在网络留言板上留下信息，让朋友了解自己的情况。Facebook\
    \ 工程师在此基础上做出了改良，最终推出了“平安信使”服务。\n\n- “平安信使”服务有三个优点：\n  1. 定制化和个性化。不但可以推送自己的情况报平安，还能看到自己关心的人是否安全。\n\
    \  2. 协同和组织的作用。通过平台互相协作，以采取及时的组织和救援措施。在奥兰多枪击事件中，人们通过 Facebook，实现了献血、寻找失踪人士等救援行动。\n\
    \  3. 信息传递速度快。还在奥兰多枪击事件中，Facebook 发布推送的时间，比警察官方宣布的时间早了11分钟。\n\n“脸书直播”服务的优点是：\n\
    \n应对灾难和紧急事件时，通过直播，可以让专业的救助人士迅速掌握全局情况，来优化救援救助资源，还可以让观众了解现场的危急性，远离事发地。\n\n无论是“平安信使”还是“脸书直播”，都存有自己的问题。\n\
    \n“平安信使”的主要问题有两个：\n\n一是服务的局限性。个体发出的信息太碎，没有办法做到持续，也没办法保障权威性。\n\n二是“平安信使”存在区别对待不同国家的情况。2015年11月，黎嫩埃及特、法国巴黎、伊拉克巴格达，都发生了恐怖袭击事件。但\
    \ Facebook 只在巴黎启动了“平安信使”服务，有人话满其在“西方歧视”，区别对待不同国家的用户。\n\n“脸书直播”的问题也有两个：\n\n一是内容未经处理。一般电视画面里看到的图像要经过事前筛选，直接看到凶手或灾难后血淋淋的现场，会对观众造成很大的心理冲击。\n\
    \n二是直播容易带来“信息的雪崩”，让公众产生一种错觉，即灾难远比实际看到的要严重。这可能夸大实际情况，造成误解。\n\nFacebook 也在针对这些问题进行改良。现下的“平安信使”服务不再根据人为判断发布警示，而是通过算法发布。\n\
    \n首先，算法会采集第三方的信息源，如采集新闻和来自政府部门的旁证以及辅助材料，以加快信息的流转。\n\n接下来，在 Facebook 上，如果在该地区讨论灾难事件话题的人数达到一定数量，算法就会启动“平安信使”服务。\n\
    \nFacebook 推出的这两个服务，还存在一个问题——灾难发生时，如果网络和手机线路遭到破坏，服务的保障就无从谈起了。\n\n对此，Facebook 的解决方法就是，使用无人机的机队把整个世界用互联网串联起来。\n\
    \n但目前看来，Facebook 无人机的试验并不顺利，还遭遇了重大事故。\n\n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_26_1.png)\n\
    \n> 如果你认为什么事都必须完全准备好之后才能开始，那这件事情可能永远都不会开始了。\n\n——马克·扎克伯格\n\n> If you believe that\
    \ something must be fully perfect just to get started, a lot of the time you'll\
    \ never get started.\n\n— Mark Zuckerberg\n\n![](img/2b1f55794a32401f6e1d5425100884b9_26_2.png)\n\
    \n### 本期杂志：《连线》\n\n美国《连线》（Wired）杂志是一份科技类月刊，创刊于1993年，被誉为“极客的圣经”。\n\n### 下期预告：《哈佛商业评论》\n\
    \n如果你遇到一个“坏”老板，那该如何与他相处？《哈佛商业评论》给你支招，告诉你如何改善与“不良”上司的关系。\n\n## 如何与“坏老板”相处？\n\n\
    本条音频及文稿参考《哈佛商业评论》12月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_27_0.png)\n\n\
    ### 知识清单\n\n《哈佛商业评论》杂志，创刊于1922年，是“哈佛商学院”的标志性刊物，致力于给全世界的专业人士提供缜密的管理见解和最好的管理案例。\n\
    \n“哈佛商学院”作为世界顶尖的学术机构，在描述自独特的教学法，最著名的就是案例分析。\n\n教授往往通过一些具体的案例，深入浅出地把抽象、枯燥的概念讲析出来。《哈佛商业评论》的文章，也秉承了这个特点。\n\
    \n文章引用了盖洛普公司的一项研究——《全球工作状况调查》。盖洛普公司由乔治·盖洛普博士于1930年代创立，是一家全球知名的、进行民意测验和商业调查的咨询公司，盖洛普提供的数据专业、权威。\n\
    \n研究结果表明，有半数的美围职员在职业生涯中，有过为了逃离老板而辞职的情况。这个数字在欧洲、亚洲或非洲等地甚至更多，这也说明上司不合引发员工辞职，是一个世界性的问题。\n\
    \n研究还显示，“员工敬业度”与上下级关系的好坏，有非常大的关系。\n\n全情投入到工作中的员工，有77%的人，在描述他们与上级关系时，会使用积极词汇，比如“我的上级很关注我的优点。”\n\
    \n而认为自己不那么投入工作的员工，以及认为自己完全没投入工作的员工，分别只有23%和4%的人，会使用积极的词汇来描述自己和上级的关系。\n\n这个研究表明，一个能提高“员工敬业度”的工作环境，是企业成功的关键因素之一。如果员工处理不好自己跟老板的关系，将对企业的成长和发展产生非常大的影响。\n\
    \n而根据盖洛普的研究，在全世界的所有员工当中，只有13%能够被归类为积极工作，可以促进企业获得成功的人。\n\n《哈佛商业评论》这篇文章的作者，是一位资深的企业管理教练，他提出了五点可以改善员工和老板关系的建议：\n\
    \n- 1、提高同理心\n即换位思考，主动体会老板的难处。\n作者认为，我们应该关注的不是老板做了什么，而是老板为什么会这样做。“同理心”可以通过锻炼提高，如果能够持续练习，你会对他人情绪的感知度变得更加敏锐。\n\
    \n- 2、内观和自我审视\n即审视自身的问题，采取措施。文章建议，可以观察老板关系不错的同事，从他们身上吸取建议和经验。必要的时候，向他们求助。也可以在团建和小组讨论的时候，直接听取意见，甚至可以直接询问老板的意见。\n\
    \n- 3、单刀直入\n如果在换位思考和自我反省之后，问题依然没有得到解决，就可以采取“单刀直入”的方法，即开诚布公地跟老板探讨你们碰到的问题，寻找解决方法。\n\
    对此，文章提出两项建议：\n一、尽量找一个安静又容易专心的地方探讨，比如邀请老板吃茶。\n二、要让老板明白，这是在讨论工作，而不是私人恩怨。\n\n- 4、向上反映\n\
    如果开诚布公的谈话依然无用，且身边的同事也有同样的困惑。那么可以考虑直接对公司的HR或老板的老板反映问题，证明老板的行为对于整个团队或公司是有害的。\n但这点需要特别小心，没有确凿的证据不建议使用。\n\
    \n- 5、另谋高就\n如果前4点努力都宣告无效，一些人会选择采取避险策略，少跟老板接触。\n但文章指出，绝不可能没有底线地跟老板相处，与其这样，还不如另谋高就。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_27_1.png)\n\n> 大多数“坏老板”都不是天生的坏人，他们只是有缺点的好人。\n\
    ——《哈佛商业评论》\nMost bad bosses are not inherently bad people; they're good people\
    \ with weaknesses.\n—— Harvard Business Review\n\n![](img/2b1f55794a32401f6e1d5425100884b9_27_2.png)\n\
    \n### 本期杂志：《哈佛商业评论》\n\n创刊于1922年，“哈佛商学院”标志性杂志，致力于给全世界的管理专业人士，提供缜密的管理见解和最有用的管理案例。\n\
    \n### 下期预告：《大西洋月刊》\n\n在美国人眼中，奥巴马是否是一个好总统？中国人民的老朋友、美国前国务卿基辛格，如何看待今天的中美关系？\n\n##\
    \ 奥巴马是不是一位好总统？\n\n本篇音频及文稿参考《大西洋月刊》12月刊\n\n![](img/2b1f55794a32401f6e1d5425100884b9_28_0.png)\n\
    \n### 知识清单\n\n《大西洋月刊》是一本综合性刊物，内容涉及政治、科学、文艺等方向，被誉为“美国最受尊敬的杂志之一”。这本杂志历史悠久，始终坚持无党派、无偏见，且文章具有很高的艺术性，包括海明威在内的很多重大文章，都在《大西洋月刊》上发表过文章。\n\
    \n#### “幼儿园测试”\n\n文章的作者认为，当一位美国总统，与当一位幼儿园老师在很多方面有相似之处，也就是说，他们都要有在工作结束之后，把手头事务处理干净、平稳交接的能力。而对于这种能力的评测，被作者称之为“幼儿园测试”。\n\
    \n文章指出，能在卸任时不留下大问题、通过“幼儿园测试”的总统，其实并不多。\n\n第36任美国总统林顿·约翰逊离任时，留下了“越战”问题；第37任总统尼克松留下了“水门事件”的丑闻；而吉米·卡特总统和小布什总统都留下了经济不振的窘境。\n\
    \n文章的作者认为，奥巴马在这个问题上就做得很好，他通过了“幼儿园测试”，卸任时没有留下大问题。这相当于给继任的特朗普留了两份大礼：时间和自主权。\n\n\
    1. 时间。即特朗普可以快速开展工作，不用先花大量时间处理前任总统遗留的工作尾巴。\n2. 自主权。即特朗普不用受到奥巴马施政纲领的影响，能够按照自己的设想治国理政。\n\
    \n作者认为，作为总统，奥巴马一共做好了五件事：\n\n### 一、复苏美国经济\n\n奥巴马接任总统时，美国的经济状况不容乐观，经过其八年努力，美国经济已经开始再现活力。并且奥巴马还解决了全球化、贫富差距和税制改革等一系列问题。特朗普接棒奥巴马时，无需为经济太过担心。\n\
    \n### 二、解决国内安全问题\n\n奥巴马就任总统期间，美国的犯罪率达到了自1970年代以来的历史最低点。\n\n重要的是，奥巴马是在全球恐怖活动升级的大背景下，做到的这一点，非常不容易。\n\
    \n### 三、推动医疗改革\n\n在奥巴马的“医疗改革方案”提出之前，美国的医疗保健状况非常糟糕：普通人减少或不买医保，同时医保价格持续升高，形成死循环。\n\
    \n奥巴马的医改出台后，不参加保险的人数降低了近二个百分点，医疗费用的上涨速度也放缓了。可以说，奥巴马为美国的整个医疗系统争取到了非常宝贵的改革时间。\n\n\
    ### 四、重视环境问题\n\n相比较起美国人普遍对环境危机的冷漠态度，文章作者认为，奥巴马在任期内达成《巴黎协定》——美国将共同与未来世界的环境保护——是重要的政绩。\n\
    \n### 五、采取了灵活的外交政策\n\n作者认为，奥巴马更好地处理了美国同伊朗之间的关系，使两国之间因为核武器等问题剑拔弩张的氛围，得到缓解，避免了武力冲突。\n\
    \n作者认为，能够把一场大的危机，化解为相对可控的问题，就是一场胜利。\n\n当然，奥巴马也遗留了问题：\n\n1. 在叙利亚和伊拉克的IS恐怖组织的问题上，奥巴马的处理并不妥当。但作者认为，他至少坚决没让这些局部的地区冲突，升级成美国需要进行军事干预的状况。\n\
    2. 相比于上世纪的越南战争，这对于美国还不算是太大的危机。\n\n2. 奥巴马没有实现自己所许的“变革”。\n\n奥巴马赢得选举是打着“变革”的旗号，他曾承诺要改变华盛顿当时的政治状况，但并没有做到。直到奥巴马任期结束，大家也没有明显地感受到所谓的“变革”，这也是很多人对奥巴马表示失望的原因。\n\
    \n文章作者认为，很多人对于总统所谓的“功绩”，往往有一种不切实际的想象，比如，认为总统就要赢得一场战争、取得巨大的外交胜利或者完成一次轰轰烈烈的改革。\n\
    \n但作者强调，这些人忽略了一点，就是一个总统可以干的坏事，要远多于他能做的事。他们坐在白宫里，身边遍布地雷线，稍微不当心就可能触雷，引发一场巨大的灾难。\n\
    \n“柯立芝繁荣”，是指“一战”之后美国经济的高速增长时期，这段时间正是美国第30任总统柯立芝的任期，因而被称为“柯立芝繁荣”。\n\n小说《了不起的盖茨比》就是以这个时代为背景。\n\
    \n### 本期金句\n\n![](img/2b1f55794a32401f6e1d5425100884b9_28_1.png)\n\n> 把危机，变成一个相对可控的问题，这本身就是一场巨大的胜利，这种转换，需要用智慧才能做到。\n\
    \n——《大西洋月刊》\n\nTurning a crisis into a problem is a big accomplishment. This asks\
    \ for wisdom.\n\n— The Atlantic\n\n![](img/2b1f55794a32401f6e1d5425100884b9_28_2.png)\n\
    \n本期杂志：《大西洋月刊》\n\n1857年创刊，美国“最受尊敬的杂志之一”，同时也是“美国国家杂志奖”的常客。\n\n下期预告：《纽约客》\n\n对于特朗普这位纽约郊区“富二代”当选为美国总统，纽约人自己是怎么看的？\n"
