    # # 排全球前三的CEO在担心什么


    本文源自《哈佛商业评论》11月刊


    ![](img/2b1f55794a32401f6e1d5425100884b9_12_0.png)


    # ## 知识清单


    上榜的100名CEO来自22个国家和地区，公司分布在19个国家和地区。其中16家公司，它们的总部，在其CEO的出生国家之外。


    100名CEO中，24位有MBA的学位、24名有工科学位，30名CEO连续三年上榜。


    他们成为CEO的平均年龄是44岁，并且在此之前，工作了长达17年的时间。


    与去年的榜单一样，中国内地也仅有一位企业家上榜，那就是腾讯公司的创始人、董事长兼CEO马化腾，他的排名甚至也和去年一样，都是第45名。


    今天这个时期对CEO们来说也非常有挑战性。全世界的经济增长都在放缓，政治动荡也降低了各个地区对长远发展计划的尝试。


    企业高管有时会频繁更换。在2015年，全球的CEO离职率高达17%，而其中超过1/5都是被辞退的。


    女性CEO特别少，100人里只有两名女性入选。文章表示，这并不是因为作为高管，女性的表现不如男性。主要是因为，在全球范围里，女性CEO本人人数就少，这次参评的公司一共886家，这些公司里只有28位CEO是女性，占所有候选人的3%。


    现如今，年轻人的态度已经改变了。他们不会长期固定在同一个职位上，而是像蜜蜂采蜜一样，从一份工作跳到另外一份工作。


    人们从一个机遇跳到另一个机遇，他们创建一个公司，然后再把这公司卖出去。打造长期的品牌，现在已经是一种正在“消退的艺术”了。


    # ## 本期金句


    ![](img/2b1f55794a32401f6e1d5425100884b9_12_1.png)


    > > 人们因为失败接受的惩罚太多，而为成功承担的风险太少。

    >

    > ——WPP集团CEO苏诺天


    > > People are penalized too much for failure, and they are not prepared to take
    risks to succeed.

    >

    > — Martin Sorrell


    ![](img/2b1f55794a32401f6e1d5425100884b9_12_2.png)


    您好，欢迎来到“马徐骏说杂志”。


    今天我给您分享的是《哈佛商业评论》最新出炉的，“世界百佳CEO”评选榜单以及上榜前五位CEO访谈的精华总结。


    就快到年底了，《哈佛商业评论》对于全球商业上的一些变化和趋势，是有着自己的思考和见解的，他们最近的焦点，是关注“商业上长期主义与短期主义之间的冲突”，这是什么意思呢？就是在全世界的经济增长长期受阻的大背景下，有好多企业的股东，很多是“激进主义者”。


    所谓“激进主义者”，也就是更关注短期收益的人，像是很关注股票是不是上涨啊？财报是不是好看啊？有着这种思路的人，就叫做做“激进主义者”，而现在这些人掌握了话语权，已经成为了对商业领袖和职业经理人的评判者。因此在短期之内如果CEO做不出特别瞩目的成绩，就很有可能会被更替换。


    这篇报道还给出了具体的数据，2015年的时候，全球的CEO离职率已经达到了惊人的17%，而在这17%里面，又有1/5，是直接被迫辞退的。就是说，如果你干不好，没有达到公司的预期，那就走人吧！这也造成了现在的职业经理人，他们更加关注，公司在短期之内的表现是不是亮眼，而不是关注公司的长期发展有没有问题。因为短期的成绩才是跟他们手里的饭碗能不能端得稳，有直接关系。


    这种关注公司短期之内强劲表现的行为就叫做“短期主义”。但是《哈佛商业评论》这本杂志，是不太赞成这种做法的，他们更加赞赏的是“长期主义”。


    就比如说《哈佛商业评论》这份“全球百佳CEO”的榜单里，这些上榜的CEO，给股东创造了2000%的回报率。在这些人成为顶尖管理者之前，基本上有17年左右的工作经验，所以，他们当上CEO的平均年龄是44岁。


    ![](img/2b1f55794a32401f6e1d5425100884b9_12_3.png)


    而这份榜单的评选，自从2010年启动以来，一直到现在，采取的评比方式都是收集客观的数据，而不是看大众观点左右。就比如说，公众舆论不是太看好这个CEO？对这位CEO的媒体报道是不是多？这样的因素不会对上榜有影响。因为《哈佛商业评论》的编辑们认为，只有拿数据说话，出来的结果才是真实可靠的。其实这份榜单最早考虑的数据，就是CEO为公司创造的利润。'
  - '[PAGE 13]


    但从去年起，在这个榜单的时候，上面的环境以及CEO治理的表现在也作为衡量标准。


    而且今年的评选，又对去年的算法做了一个升级。所以可以说今年这个排名，是前所未有的权威和可靠的。


    咱们先说一下，这份榜单统计数据的一些事实。在这个100个上榜的CEO里面，其中有24个人有MBA，也就是工商管理硕士学位的，差不多就是1/5了，还有24个人，他们是拥有工科专业的。100个CEO里面，有30个人，就是接近1/3，是连续三年都在这个榜单上面，这就是我们之前说的，《哈佛商业评论》这个榜单的特点。要么是处于长期表现，不是短期表现，更是关于于评选标准的问题，造成了这份榜单，跟我们一般看到的商业人物的评选，真的不太一样。


    我总结了这次榜单里的两个特点，首先就是，大家熟悉的名字其实是很少的。其次是有性CEO上榜的人非常少。但这不是因为性别歧视，而是有客观原因的，咱一下下讲。


    先说第一个特点，就是榜单上大家耳熟能详的名字不多。


    一说起世界知名的CEO，一般人脑子里面有几个名字肯定是躲不掉的，比如说像苹果的CEO蒂姆·库克（Tim Cook）、硅谷“钢铁侠”埃隆·马斯克（Elon Musk）、谷歌的前CEO拉里·佩奇（Larry
    Page）及他的继任者、去年上任的孟某思CEO。但是这些如雷贯耳的名字，在这份100人的榜单里面，是完全没有出现的。大家相对熟悉一点的，比如Adidas的CEO排第4，星巴克的CEO排第14，雅诗兰黛集团的CEO排到第27。但估计您连他们是谁也叫不出来吧？


    这个也是我们刚才说过的，这份榜单的评选机制，不会受大众舆论的影响，不是说你的报道多，现在关注的人很多，就会上榜。他们考评一个CEO的标准，是以十几年甚至是几十年作为考量的。


    当然了，这份榜单上确实是有我们比较熟悉的数字的，比如说上面说的CEO马克施恩在这份榜单上面排到了第45名。这个名字，跟他去年在这份榜单上面的位置是一模一样的，他去年也是排45。李嘉诚排97，也挤进了“全球百佳CEO”的行列。


    榜单的第二个特点是，女性CEO特别少，100个人里，只有两名女性入选。但是，文章说，这个并不是因为作为高管的女性的表现不如男性。主要是因为，在全球范围内，女性CEO的人数本来就少。


    这次获评的公司一共是886家，这些公司里面有28位CEO是女性，占所有候选人的3%，但是文章里说，其实女性在选公司里的表现，是优于男性的，甚至有一个接受了采访的CEO直说，“我也不怕得罪人，其实女性在公司的表现的更好，情商也更高”。


    那你要问了，既然女性表现很出色，为什么CEO的评选结果里，女性那么少？是不是性别歧视？这真是，主要的原因，文章里说，是因为女性是要生孩子。特别是现在，北欧一些福利好的国家，你一生孩子就要被强制休产假，但我们知道在职场里，你休一年半载，公司在前沿，你却原地踏步，这对于一个人职业生涯的影响那是非常大的。这才是女性在顶尖CEO里人数不多的根本原因。


    在这份榜单之后，《哈佛商业评论》还对今年榜单排名前七名三的CEO进行了访谈。这三个人，分别是，诺和诺德的CEO索文森（Reuben Grensen）、WPP集团的CEO劳伦特（Martin
    Sorrell）和Inditex集团CEO伊思拉（Pablo Isla），这些公司名可能不是那么耳熟，但他们其实各自所处的行业和领域，都是很顶尖的。


    诺和诺德是世界领先的生物制药公司；WPP集团，是世界知名的美某公司的母公司；而Inditex集团是欧洲的，世界知名的服装品牌Zara，就是它旗下的子子公司。你看，虽然这些上榜公司的名字对大众来说有点陌生，但他们做的产品可是全世界知名的，三位就是整个大集团和公司的掌舵人，所以他们的江湖地位是非常高的。


    在这个访谈里面，他们谈到的两个问题很有意思。


    第一个就是，这些CEO的年龄都比较大，那他们是怎么处理跟年轻职员的关系的？换句话说就是，现在的年轻人已经慢慢步入职场了，在国外的这些年轻人，被称为“千禧一代”，这个概念年之前，也就是出生于1980年到2000年的这批人，在这些CEO的眼中，这些人是不是比较难管呢？


    CEO的回答还是比较感触的。他们说，曾经那种——进入一个行业，然后在这个行业里头苦干、建立声望、做长期打算和准备的这种观念——已经不再流行了。如今的年轻人，喜欢从一个机遇跳到另一个机遇，他们喜欢立公司，是想打算是打一个长期牌，已经成为一个不再主流的行为。文章里的原文称之为“消退艺术”。


    而另一个问题是，世界上地位这么高，这么厉害的CEO们，有什么事情是他们最担心的？或者，就像文章标题说的，是什么样的因素会让这些最优秀的职业经理人，夜不能寐，在晚上睡不着？


    他们都回答了，目前他们所承受的压力要更多来自于那些比较激进的投资者，就是前面说的关注短期利益的股东。公司在短之内，交不出非常漂亮的数据，或者说慢的话，CEO是很有可能会面临被解雇的风险的，哪怕你过去创造了很好的成绩。


    比如说，文章访谈的诺和诺德制药的CEO索文森，他在“百佳CEO”里排名第一，但是今年8月公司的股价跌了20%，9月1号公司董事会，索文森会在10月退休。这个可比他原定的退休时间提早了整整两年。


    而索文森在接受采访的时候，也说了一番肺腑之言。他说，我和团队的努力，很可能是要在十五年甚至二十年之后，才会见分晓的，就只可能到那个时候，大家才能够知道我们是不是做出了一个正确的决定。


    他想表达的意思，说白了，就是《哈佛商业评论》这本杂志在关注的，商业上长期主义与短期主义之间的冲突。


    # 本期杂志：《哈佛商业评论》


    创刊于1922年，是“哈佛商学院”的标志性杂志。建立之初，它就以“改进管理实践”为自已的使命。现在，《哈佛商业评论》已经成为先进管理理论的发源地，致力于给全世界的专业土士提供精密的管理见解和最好的管理实践。


