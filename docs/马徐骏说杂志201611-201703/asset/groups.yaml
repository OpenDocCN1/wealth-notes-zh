    \nInstagram是一款照片社交应用，2012年时，被Facebook用7.15亿美元现金加股票的方式收购。\n\n2016年5月，为了增进自身竞争力，Instagram将原先的以旧相机为Logo的标识，换成了对立的圆环为Logo的标识。\n\
