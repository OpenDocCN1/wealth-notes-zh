  - 特别放送 | 科幻小说中的物理学
- - '##'
  - 问题一：在小说《三体》里，人类在22世纪掌握了可控核聚变。请问万老师，在2018年，挡在人类和可控核聚变之间的最大障碍是什么？是真的有无法突破的理论难题，还是设备工艺无法达到？还是说，其实没有科学障碍，人类只是缺少利益驱动去完成它？
- - '##'
  - 问题二：在罗伯特·泰耶的科幻小说《计算中的上帝》里。他描写了两种和人很相似的外星人造访地球的故事。这两种外星人告诉人类，整个宇宙的生物身体结构都是非常相似的，大家都是由
    DNA 和氨基酸构成。遍寻宇宙里的生物，也不会有其他形式的生命存在。
- - '##'
  - 问题三：在很多科幻小说里，都描写了“机器人类觉醒”的情节。在《精英日课》的第一季里，万老师介绍了丹尼尔·丹内特的思想：人的意识和机器意识没有本质区别。
- - '##'
  - 问题四：在特德·姜的科幻小说《你一生的故事》里，他描写了光的“折射现象”。如果不涉及量子理论，光的折射可以用费马定理解释：光总是走最快到达的路。
