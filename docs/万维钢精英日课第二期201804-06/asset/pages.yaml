  md: '# 日课133 | 《超越曲棍球杆的战略》1:什么是战略思维


    ![](img/a2c55447bc97d25d1622d2d734d5541b_40_0.png)


    日课133 | 《超越曲棍球杆...


    今天开始咱们说一本2018年2月出版的新书，叫《超越曲棍球杆的战略》(Strategy Beyond the Hockey Stick: People, Probabilities,
    and Big Moves to Beat the Odds)。这本书的三位作者是麦肯锡战略实战部的三个学者，克里斯·布拉德利（Chris Bradley），马丁·希尔特（Martin
    Hirt）和斯文·斯米特（Sven Smit）。这是一本讲商业战略的书，但是我认为其中的道理对每个人都有价值。而且通过这本书，我们还能加深一点对真实世界的了解。


    我想先辩析几个概念。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_40_1.png)


    # 1.战略、战术和攻略


    我们经常听说“战略”“战术”和“攻略”这三个词，它们都是什么意思呢？


    以我之见，所谓战略，就是你决定做*什么*。战略是选择一个方向。


    战术就要低一级了，战术是方向已经确定了的情况下，你琢磨*怎么*做。老板说了必须拿下这个订单，那怎么做呢？你可以想各种主意，事儿应该谁办，话应该怎么说，设计一个什么场景，使用各种计谋，这些都是战术。


    攻略就更低了，攻略是照着别人的经验把这事做下来。攻略这个词最早来自电子游戏，到哪一关怎么过，找哪个NPC拿什么东西，遇到哪个boss怎么打，别人的把步骤都说好了，你照着做就行。


    生活中跟绝大多数人有关系的，都是攻略。比如什么某地自驾游攻略、考研政治攻略。我护照快到期了，如果我要去芝加哥领事馆换发护照，怎么预约、下了飞机怎么坐地铁，网上都有详细的攻略。


    我们一般教育系统训练出来的所谓好学生，很大程度上都是说他善于掌握攻略。别人告诉你怎么做，你学会记住，然后你把事做好，你就是一个靠谱的人——你是一个很好的……执行者。


    想要进入战术层面，你得能活学活用随机应变，甚至发挥创造性才行。战术是一种艺术，会战术的是高级人才。


    而战略则是统治者的学问。在你自己看来，战略是对命运的主动选择。在你手下的人看来，战略也是利益分配。


    战略的本质是取舍。你只有这么多资源，几个部门都找你要钱，那你怎么分呢？难说道看看谁道德高尚给谁吗？


    战略思维的出发点，就是你得根据公司未来发展的方向决定利益分配。说白了，所谓公司战略，就是把钱投到最有前途的方向上去。


    比如说，现在我们的产品在中国市场卖得很好，利润在5%左右。有人调研说中东市场的需求非常大，如果我们到中东开一家分公司，利润能达到50%。但是中东有很多不确定性，政策法规、安全形势、原材料供应我们都没把握。那这事儿干还是不干呢？这就是战略。


    底层学习攻略，中层研究战术，高层选择战略。


    # 2.真实公司的战略


    CEO的最重要任务不是公司日常管理，而是战略。那按理说，一个专注于战略的CEO，应该多方搜集情报，对当前市场有深入了解，还要有一定的预测能力，对吧？你平时就要多跟各界大佬、政府官员接触，多搞外交，对吧？


    但是麦肯锡这几位学者告诉我们，大多数CEO不是这么工作的。一般的公司，主要 لري靠惯性运行。


    所有公司都有所谓“战略会议”。提前一两个月发通知，各部门经理要做出未来一年的发展计划。我以前搞科研也是这样，研发组通过战略会议决定课题。政府更是这样，很多很多项目让你审批。说白了，所谓战略会议，就是各部门向总公司争取资源的会议。


    所以这个会就一定会开成选美大会。每个发言者都说自己的部门对公司至关重要。我们这么一个计划，需要你加大投入，一开始是要花钱，但是一旦做成就能给公司带来很高的收入。


    他们描述的前景就好像是个曲棍球杆。先往下一小节，然后长时间的一往直前地上升。今天给我一个机会，明年还你一个奇迹。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_40_2.png)


    拉斯维加斯的一个连锁赌场的大老板，也聘请了麦肯锡做管理咨询。他就跟麦肯锡的人说，我走到哪个赌场，哪个赌场的经理都跟我说一大堆好话——就像领导人到地方视察一样（这句话是我加的）——我是真的希望能有一个经理告诉我，他管的这个赌场出现了严重的困难，他不知道应该怎么办，让我想想法帮他解决……但是我一个都没看到，每个人都跟我说很好。这到底是怎么回事呢？


    麦肯锡这三位作者给的答案是，你可能面对不了真相。英文有一句话叫“you can''t handle the truth!”


    ![](img/a2c55447bc97d25d1622d2d734d5541b_40_3.png)


    有个电影叫《杜丝先生》（Tootsie）。女主角有很多追求者，她说，这些男人都太虚伪了，见了我整天说好话，其实他们抱着什么目的，难道我还不明白吗？我真的希望能有一个男人跟我说一些真话！


    男主角听到这句话，心想有道理啊！她整天听的都是虚伪的赞美，那我跟她说真话的话，肯定能引起她的注意，夺得她的芳心！他就跟女主角说了几句实话——结果他收到的是一记耳光。


    咱们专栏讲过雷·达里奥的《原则》，说要“激进面对现实”，可是何其容易！


    所以 CEO 就好像袁世凯看《顺天时报》一样，从下属那里听到的都是好消息，一天到晚“历害了，我的公司！”。根据麦肯锡的调查，80%的企业管理者都认为自家的产品领先于竞争对手——而实际上，平均只有8%的消费者认为你家的产品比竞争对手好。


    柯达公司从上世纪80年代就已经在考虑数码相机技术，但是它只是把数码技术用到胶卷，冲洗照片还是要用胶卷。胶卷，才是真正让柯达赚钱的产品。而这么多年，柯达公司的管理层，就没有一次坐在一一起，严肃地讨论一下这个问题：如果将来有一天大家都不用胶卷了，我们公司应该怎么办？


    咱们今天想起来这简直是不可思议。你要没当过大公司CEO，你就不知道惯性有多大。


    三位作者说，这种只听内部人怎么说，或者最多再盯着几个直接的竞争对手看的思维模式，叫做“内部视野”。


    内部视野带给你的只有惯性。就算有一个真正的好战略计划，你也不敢用。CEO 最常见的做法是和稀泥。既然各个部门都要钱，那就干脆都给一点，这样能让公司像'
  merge: -1
  img_proc: true
- pgno: 41
  md: '钱，那就不脆都给一点，这样能让公司像去年一样运营下去。我们去年营收多少，今年多少，据此就可以算算明年会是多少……


    结果你将会被别的公司给“颠覆式创新”。所以战略都有“社会”的一面。考虑到各种认知偏差，有人的地方，就没有真相。


    那应该怎么办呢？


    # 3.外部视野


    麦肯锡这三个作者没有让我们学习达里奥的《原则》那种激进的做法，他们给的建议是“外部视野”。


    简单地说，就是你的战略选择，应该主要考虑市场上其它公司、甚至其它行业的公司都在干什么，而不是考虑自己公司去年干了什么。


    举个例子，我们专栏以前好像讲过，现在再讲一遍。丹尼尔·卡尼曼在《思考，快与慢》里说过这个思想。卡尼曼当年要跟一帮人合作编写一本心理学教材，他们就估计大概要用多长时间能编好。有人说，根据我们现在的速度，大概需要一年半到两年半的时间就能完成。卡尼曼也觉得差不多，但是他多问了一句，说谁知道别人编这么一本教材都用了多长时间？结果发现别人一般都用了七年到十年的时间，而且有40%的编写组居然从来都没有完成。


    结果卡尼曼他们组用了八年时间才做完那本教材。


    CEO 应该往外看。往外看，你才能更了解自己。


    往外看，你就会发现外面真实的世界绝对不是一个稳态的运行。用和稀泥的方法让公司顺着惯性稳态运行，可能就是你所能犯的最大战略错误。


    麦肯锡过去几年最重要的一份报告，它的研究结论就是说，如果一个公司想要成功，它最应该做的就是把资源迅速投入到一个快速增长的领域中去，而不是均分资源让公司稳态运行。关于这一点咱后面再说。


    # | 由此得到


    战略的关键是选择做什么。做什么不能以自己过去为参考，也不能以公司内部人的意见为参考，而应该是往外看。


    # | 我的评论


    为什么战略这么难呢？因为你没法刻意练习。


    刻意练习需要大量的重复训练、需要获得及时的反馈、需要在一个个的小失败中成长。可是一半人做战略决策的机会很少，一个决策对不对常常过好几年才知道，决策都很重要、一失败就是大失败。


    很多人一生之中的重大决策，一大半都是在三十岁以前。报考哪个学校、学哪个专业、到哪个公司工作、跟谁结婚。做这些决策的时候你没经验。等你吃了几次亏有经验了，你可能决策的机会已经不多了。


    刻意练习能让你变得很熟练，几乎是自动就能做好一个技术动作。而战略，却恰恰要三思而后行。


    很多人 在淘宝买个小东西都能货比三家，面对人生重大战略选择却是异常草率。就拿大学选专业来说，很多人觉得“喜欢”这个专业，就选了这个专业，或者听说“二十一世纪是生物的世纪”，就选择了生物专业。可是学这个专业的人一天到晚都干什么、他们的毕业去向都是哪儿、他们的工资水平都是怎么样，很少有人仔细研究。


    在这方面商学院的做法还是值得钦佩的。你看著名商学院的网站，都会列举详细数字，哪一年的毕业班百分之多少去华尔街，百分之多少去咨询公司，百分之多少去别的行业，他们拿到第一个
    offer 的工资都是什么水平。这些数据能明白告诉你，花这么多学费、付出这么多时间，能让你能得到什么。这才是决策。


    复习一下：基础比率

    决策科学中有一个很重要的概念，叫做基础比率（base rate）。所谓基础比率，就是以前的人，做同样的事，做到的平均水平。而且卡尼曼知道，预测未来最好的参考指标，就是基础比率。

    推荐阅读：日课180 | 《决断》解读4：用别人预测自己'
