  md: '# 日课167 | 真实世界和魔法世界的区别


    日课167 | 真实世界和魔法… ↓


    今天咱们说个轻松的话题。我最近偶然读了一点玄幻小说，有点入迷。我读的时候就忍不住想，这种讲修仙、比拼法术的世界，到底有没有可行性呢？


    我并不是说物理定律不允许。咱们所处的这个世界的物理定律恐怕是不允许法术，但是我们专栏讲过《穿越平行宇宙》那本节，从数学角度来说，只要是符合数学逻辑的世界观，都有可能在某个平行宇宙里实现。我们完全可以想象存在一个真实的魔法世界，其中有修仙和法术。


    所以我想把玄幻小说当做思想实验，咱们能不能借助小说的一般设定，从纯逻辑的角度，分析一下魔法世界的可行性。


    # 1.稀缺和成本


    魔法世界跟我们这个世界有什么本质的区别呢？


    可能你首先会想到法术。法术确实厉害。有了法术你可以变成各种东西来，你可以快速移动甚至飞行，你还可以对外输出巨大的伤害……法术，似乎只受到作者想象力的限制。而我们这个真实世界就不行了，最起码因为能量守恒，你不能无中生有地变东西出来。


    但是从写小说的角度来设想，如果你想让小说有起码的剧情，法术就不能是为所欲为的。如果会法术的人都要哈哈哈、想干什么就能做到什么，那他还玩什么呢？这就没有剧情了。所以世界上必须有一些东西是哪怕会法术的人也想要、而又不能轻易得到的。


    这个性质叫“稀缺”。魔法世界里也得有稀缺。《西游记》里的神仙们日子过得好像什么都不缺，可是也得定期吃一些蟠桃、人参果之类能增寿的东西。谁控制稀缺资源，谁就掌握权力。玉母娘娘控制了蟠桃，定期召开蟠桃大会给各路神仙延长寿命，这是最安全的权力。当然唐僧肉也是稀缺的东西。


    有稀缺就有经济学。乔治·梅森大学的一个研究生和一个来访问的助理教授专门写了一篇论文，讨论《哈利波特》世界的经济学 [1]。他们注意到，法术的确可以无中生有地变出东西来——但是，其中不包括食物。


    在《哈利波特与死亡圣器》中有⼀小段，赫敏告诉荣恩：“你妈妈不能凭空变出食物来，没人能变。食物是‘Gamp 元素转换定律’的五个例外的第一个……” [2] 所以会法术也得通过常规手段找饭吃，法师也得为生计发愁。这就是为什么有些法师的经济状况不好，像荣恩家还得自己种菜。


    那篇论文还把《哈利波特》的剧情跟“边际效应递减”、“机会成本”和“激励”这些经济学概念联系起来，法师们过的日子本质上也是柴米油盐。


    然而《卫报》的经济学专栏作家梅根·麦克阿德（Megan McArdle），却对《哈利波特》里的经济学设定提出了批评 [3]，认为J·K·罗琳缺少大局观。她的关键批评是《哈利波特》里的魔法没有成本。


    难道施法是不需要成本的吗？哈利·波特想要出个大招，他只要观想自己的内心就行——这是不是太儿戏了？


    如果法术可以无限制使用，那就一点都不宝贵。《西游记》里孙悟空的毫毛好像不要钱一样、想变什么变什么，你读的时候有没有过疑问：为什么孙悟空不多变一点？


    现代网络游戏里的法术都有成本，你得消耗法力值。战斗中法力值用完了你就没有招了。要想快速恢复法力值就得喝药，而这个药也是稀缺资源，得花钱买。


    那如此说来，法术，跟真实世界里的技术，似乎什么本质区别。手够厉害，但资源是有限的。私人飞机很方便，但一般人用不起。魔法世界里的法术也不能随便用。据此我们可以总结一个定律——


    玄幻小说第一定律：要想有剧情，法术系统就必须符合基本的经济学。


    那么难道说玄幻小说其实就是披着魔法外衣的现代故事吗？也不是。


    # 2.修仙和平等


    以我之见，魔法世界和我们这个世界有个最根本的区别，是关于人的。我们这个世界中人和平人之间比较平等，而魔法世界里人和平人之间是极度不平等的。


    我们这里的有钱人没啥了不起。巴菲特再有钱也是跟穷人一样喝可乐。我们看着比尔·盖茨老成什么样了，就知道现在所谓抗衰老的医学根本就不靠谱。豪车和名牌包主要就是起到炫耀的作用，并没有什么实质性的功能。


    但是魔法世界可就不一样了，厉害的人是真厉害。《西游记》里的蟠桃和人参果不需要宣传统什么虚无缥缈的营养价值，是真能增加寿命。仙草不是用来赏鉴的，是真能增加法力。宝物不是用来当文物等着升值的，是真能用来斗法。


    我们这个世界里花20万元买的包并不能比20元的包多装东西。玄幻小说里有一种设定叫“储物法器”。它可能就是你手上戴的一个戒指，这个戒指能缩放空间，你可以把全部家当都放在里面
    [4]。


    这样的世界，会有什么样的生存法则？我们这个世界里一门心思赚钱的人不多，因为大家都知道钱多了其实没啥用，最值得要的都是花钱买不到的。也没有多少人追逐权力，因为权力是个零和博弈，能博弈到的人非常有限。也没有多少人把锻炼当做毕生追求，因为人体的机能是有极限的。


    一句话，我们这个世界里人的上限太低。


    但是如果你穿越到魔法世界里，你唯一值得做的事情就是不停地升级！你有几乎无限的升级空间，高级别和低级别有巨大的差异。魔法世界必定是一个人人忙着修仙的世界。


    但是在这样的世界里，人和人之间恐怕不会有什么高水平地合作。


    出于经济学的限制，神仙在飞升之前仍然需要吃饭，他们会需要凡人供养衣食住行，但除此之外可能就不需要什么了。神仙为了争取稀缺资源难免要打wania，打wania就得拉帮结派，就得讲政治，但这仍然是低水平地合作。


    关键在于，如果不同等级神仙的法力相差实在太大，那么神仙跟神仙之间、更不用说神仙跟凡人之间，就根本谈不上什么深入合作。修仙毕竟是个个人的事儿，修练出来的一切效用，都落实在个人身上。


    所以这是一个人与人之间有绝对等级差异、不需要深度合作的世界。其实这样的社会规则在我们这个真实世界里就有——这就是黑猩猩的规则。


    我们专栏以前说过黑猩猩的政治状况。社会地位主要靠个人打斗，但是因为可以打群架，所以也有联盟，也讲政治。


    黑猩猩之间，唯独没有复杂的分工和合作。


    玄幻小说里也都是这样。人类社会中也有这样的，有些原始宗教地区，基本就是僧侣和农奴，哪里有什么复杂的社会结构。我们玩网络游戏也是这样，打怪升级很过瘾，但是除了工会组织打群架之外，整个社会是简单的。


    简单社会里没有太多爱恨情仇。这就又引出了一个定律——


    玄幻小说第二定律：要想让剧情复杂，就必须保持一定的平等。


    这个世界里的法师最好对凡人有一定地依赖性，否则凡人就不是凡人了，是动物。


    # 3.身处低处的世界


    我们这个世界没有法术和法师，但是凡人之间可以展开深度的分工合作。深度分工合作可以带来技术进步。我们的技术进步不是依托在具体的人身上，而是在所有人之外，建立各种“系统”。


    魔法世界是人升级，我们这个世界是技术升级。


    爱迪生在该死的年龄就死了，但是他的技术的技术可以一直流传，在世界各地迅速形成规模。修仙是每个人都得从头修练一遍，升级人费时费力——技术地传播就不'
