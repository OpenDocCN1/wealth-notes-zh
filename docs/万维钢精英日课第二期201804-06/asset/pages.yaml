- pgno: 45
  md: '![](img/a2c55447bc97d25d1622d2d734d5541b_45_0.png)


    但我觉得最可怕的是，人们根本就不真正在乎有没有用。


    最近一个新闻热点是鸿茅药酒。这酒里放了很多中药，但是专业医生都猜测这酒根本没用 —— 搞不好还有毒。可问题就在于，从来没有人严肃验证过药酒有什么用，人们就愿意花很多钱去买药酒来喝，而且是长期买长期喝。


    你跟说人喝药酒没用，他很可能会认知失调 —— 他会说肯定有用，只不过好处是潜移默化的，也许“现代科学测不出来”。


    所以多数人根本用不上什么战略选择，人们靠的是信仰。


    现在一提中医大家都比较敏感了，但是像花费时间金钱逼着孩子参加各种课外班的行为，难道跟喝鸿茅药酒有本质区别吗？


    ![](img/a2c55447bc97d25d1622d2d734d5541b_45_1.png)


    # 5.课外活动


    我正好也有两个小孩。到底应该让孩子参加什么课外活动呢？我建议使用三个标准。


    第一是确实有好处。一个是数学，一个是阅读，我明确知道，有大量的研究能证明这两项练习是绝对有好处的。把时间花在这两个方面绝对不是浪费。其他文体活动我不知道。


    第二是如果孩子在某一方面有天赋，那就应该专业培养，不要埋没天赋。特别文体项目最好都是从小训练。那什么叫有天赋呢？按美国大学录取来说，喜欢弹钢琴、或者认为自己弹得很好都没用，必须在正规比赛中取得耀眼的名次才算数。


    第三个标准是如果孩子确实喜欢这个运动，那就应该让他参加，让他享受快乐的童年。


    说到这里我想起以前在《纽约时报》看过的一篇文章，作者是一个父亲。他儿子非常喜欢打篮球，练得很刻苦。孩子打篮球家长也很辛苦，各场比赛都要跟着。孩子对篮球充满希望，但是可能天赋一般，有时候能打上主力，但恐怕不是球星的料。


    但是这位父亲还是义无反顾地支持孩子打。有一&oacute;打完比赛回家的路上，要开很长时间的车，父子两个是身心俱疲。


    这时候孩子突然说，我不想打篮球了。


    然后这位父亲当场就同意不打了。


    这位父亲值得赞赏。他不在乎什么沉没成本，他没有说我们已经付出这么多你怎么不打了。他的孩子可能不是球星的料，但是孩子喜欢打篮球他全力支持 —— 孩子决定不打了，他也支持。


    这位父亲没有认知失调。他的第一个决定是爱心，第二个决定是战略。


