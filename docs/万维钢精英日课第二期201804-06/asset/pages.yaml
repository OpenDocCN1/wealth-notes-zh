  md: '# 答读者问 | 格局和后劲


    答读者问 | 格局和后劲


    # 来自日课：童年是一种风险解决方案


    作为幼儿园老师的我，有一点困惑：六岁之前的孩子处于混乱阶段，在给予足够的自由的同时，如何把握孩子的秩序与规则感的建立？


    我是一个即将成为父亲的人，我对我未来的孩子的教育底线就是6个月之前我完全顺着他，但是6个月之后要给他树立规则意识，一个人如果连基本的规则意识都没有，未来连和陌生人合作都不行，那还怎么谈学习谈工作呢？这是不是也是教会他独立呢？


    万维钢


    这位即将成为父亲的朋友，你说的到底是6岁还是6个月。6个月的小孩怎么可能理解你那些规则。


    不过话说回来，3岁大的孩子就已经非常有规则意识了，并不需要强迫灌输。高普尼克2016年在华尔街日报有一篇专栏文章 [1]，专门讨论过这个问题。这个思想的要点在于规则并不是违反儿童本性的东西，儿童本性就是要求周围的人做事符合一定的社会规范。实验中如果有谁做事做的是违反了规则，孩子还会抗议。


    所以培养孩子的规则意识不能、也无需像训练小动物那样靠条件反射。孔子说“唯女子与小人难养也”，尼采说到女人那里去别忘了带上鞭子，这些说法都是历史上的错误认识。


    既然幼儿已经具备一定的心智理论，他们就完全可以理解最基本的是对错。在理解的基础之上，大人和孩子、老师和学生们共同商定一些规则，再共同执行，这是最好的办法。事实上我儿子上学就是这样，学年开始的时候老师领着孩子们通过政治协商的方式确定班级规则。


    当然，执行规则的时候一定要有反馈，做错了给警告和惩罚，做对了给奖励，最好做得像是全体孩子的共同决定。老师和家长应该被孩子尊重，而不是害怕。


    坐标深圳，实验小学的孩子，传说一年级入学就平均识字1000左右。不识字的压力很大，孩子跟不上，因为老师默认大家都会了，阅读也少。英语也是，如果完全不学，跟上进度也不容易。而且，孩子自尊自信也受打击。这个怎么破？


    万维钢


    我专门给你画了一张图，请看下面这两条曲线——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_71_0.png)


    A 和 B 就好像是两个孩子，横坐标是时间，纵坐标是学习水平。刚上学的时候 B 似乎远远落后于 A。B 的学习速度很慢，而 A 一上来就是高速前进。但是 B
    的后劲足，速度越来越快；可是 A 的后劲不行，越来越慢。到某一时刻 B 终于超过了 A，而而且从此一发不可收。


    那你说如果 B 一开始就像 A 一样快，后期再变成加速的曲线，岂不是更好吗？答案是哪里有那么好的事儿，B 的学习模式就决定了他一开始必须是很慢的。


    当然这两条曲线不是科学数据的拟合，只是我画的一个说明。曲线形状和具体数值都不重要，这个道理是有有些成长模式并不匀速进行的。


    你想要的是 B 曲线。


    我们接下来几讲将详细介绍儿童大脑的发育过程，要点是6岁之前的大脑并不适合背汉字，主要任务应该是玩和学习周围的人和东西。但是到6岁以后，大脑的模式就变了，更适合学习汉字和数学。所以早学等于是指苗助长，不符合客观规律。当然你要强制教，孩子也能学会，但是你的代价是浪费了宝贵的学习该学的东西的机会，如果因此影响了大脑发育，将来孩子的格局和后劲就可能不足。


    我听说有个父亲一心要培养女儿成为篮球运动员，很小的时候就每天凌晨起来练投篮，长大了投篮居然很准，但是送到专业体校人根本不要她。因为她没有发育好个子。孩子小的时候很 多睡眠才能长高一个才能正常发育，每天那么早起来练投篮结果把身体给练废了。更何况篮球是个对抗项目，不是静止的投篮比赛！


    所以现在这些学校和家长让孩子搞学龄前识字的军备竞赛，是无知的表现，就相当于体校招生不看身体条件看投篮。如果他们弄个核磁共振成像，根据大脑发育水平招生，效果会好得多。


    那世界已经这么不合理，作为家长应该怎么办呢？答案是豁视。你要知道小学生学的这些知识点根本就不叫事儿。小时侯把大脑养好，将来一发力很容易就能赶上来。不要相信老师说的什么打基础之类的話，一年级能有什么基础？


    五年级以前的小学生，如果因为智商特别高而成绩好，平常该玩玩，那他确实是亏害。如果是因为家长逼得紧而成绩好，这样的小孩上限很低。中国家长的所谓辅导，也就能对付一个小学和初中水平，到高中辅导不了了，孩子怎么办？


    顺便说一句，为了确保大脑发育，小孩的睡眠时间必须给够，小学生最好每天睡十个小时。


    # 来自：十个育儿迷思


    万老师，我的孩子在考试时告诉同学题目，被按舞弊处罚了（全校通报，本次成绩0分），他说虽然知道告诉他不对，但同学问你，你又会怎么好意思不告诉呢？（是学校组织的一次竞赛，向他的是一个班的同学，也许他以为告诉了能考更高分，可以为班级整体争光呢）我就想请教你，当极端规则和道德发生冲突时，我们该如何引导教育孩子呢？谢谢


    万维钢


    孩子到了展现年龄会非常重视自己在同学中的社会地位，他对来自同学的友情和仰慕的需求，会超过对老师和家长的肯定的需求。可以借机跟孩子来一番道德讨论，比如说这么做虽然成全了朋友，但是伤害了别的班的同学，这违道应该做吗？但除此之外没必要看得太严重。


    2018年3月份台湾的一篇正式新闻说，科学研究，生小孩会使母亲短命11年，一听就觉得不靠谱，那以每每个妈妈生了十几个孩子的就不早死了，但活到七八十岁的还不是很多。请问万老师这种听起来很扯淡的研究，背后却打着科学研究的旗号，靠不住谱我是连问都觉得心虚，只是想听听万老师对这个消息有什么看法吗？


    万维钢


    Google 和英文是你的朋友。去年《时代周刊》就有一篇文章 [2] 专门综述了相关的统计研究。生孩子到底是减少还是增加女性的寿命，取决于调查的地点和时间。波兰1886到2002年的统计说，女性每生一个孩子，平均减少95个星期的寿命—不是11年，是两年多。原因可能是怀孕期间容易得糖尿病等疾病。


    然而2016年发表的一个研究则说，生孩子反而有利于长寿，而且生两到四个孩子比只生一个孩子更有利于女性健康。还有对1749到1912年美国阿米什人（Amish-American）的研究结论是每多生一个孩子，女性寿命就会延长一点。寿命延长的机制不清楚，有可能跟分泌催产素有关。


    还有研究说，有孩子的夫妇——哪怕孩子是领养的，他们因为各种原因导致的死亡危险，都只是没有孩子的人的1/4。


    所以结论是现在还没有一个明确的科学说法，生孩子到底能不能影响女性寿命，也许跟医疗条件、产后恢复的传统习惯都有关——但每生一个就短命11年肯定是错的。'
