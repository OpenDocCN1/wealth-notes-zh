    他爱妈妈，但是他更爱真理。他能看出来这个东西更像鸟，他不会盲目听妈妈的话。安全型孩子的学习模式非常健康。


    回避型孩子会怎么做呢？面对第一个问题，他有同样大的可能性听妈妈的或者听陌生人的。妈妈在他心目中并没有更大的权威。那可想而知，面对第二个问题他就更不相信妈妈了。


