    \n第二个性质是为了让血管铺满整个身体，每次分叉的时候，支线的长度要越来越短 —— 干线的长度是支线长度的√2倍，这也是数学优化的结果。\n\n根据前面这两个性质，特别考虑毛细血管，再考虑到血液总量应该和体重成正比，整个标度率就可以推导出来了。具体的计算细节韦斯特没有在书里写吗他们也不用管，因为韦斯特还有一个更直观的解释。\n\
