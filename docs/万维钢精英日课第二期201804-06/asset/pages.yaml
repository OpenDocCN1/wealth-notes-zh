  md: '# 日课165 | 《为什么》6：到底应该怪谁？


    日课165 | 《为什么》6:到底·


    今天咱们继续说朱迪亚·珀尔的《为什么：因果关系的新科学》。今天要说这个内容可能没有什么实用价值，但是有利于打磨大脑。我们来做一点思辨。


    # 1.非典型杀人案件


    请你考虑这么一个剧情——


    老王和老李素来有仇。有一天，老王决定杀死老李。他带了一把枪埋伏在老李家楼下。老李从楼里出来，老王走上前去，直接开枪！可是老王这一枪没打中，老李摇头就跑，老王在后面追赶。老李跑到一个地方，正好头顶上有人在阳台上搬运钢琴，非常倒霉地一失手，钢琴掉下楼来。


    钢琴正好砸在老李身上，把老李给砸死了。


    好。老王有明确的杀人意愿，但是他的子弹并没有打中老李。可老王要是不开枪，老李就不会到处乱跑，也就不会被钢琴砸死。


    那请问，老王应该按杀人罪论处吗？


    珀尔这本书的核心思想框架，就是通过因果关系，来回答我们在第一讲提出的三种问题：观测、干预、想象。特别是后面这两种问题，只有你承认有因果关系，你才能够回答得出来。


    我们已经讲了因果关系图的意义，讲了为什么要控制变量，讲了在因果关系图中传递信念的贝叶斯方法。有了因果关系图以后，回答第二和第三类问题的具体操作的一些技术细节，对非专业人士意义不大，我们就不讲了。我们还是关注书中的一些思想性的东西。


    像老王杀老李这个问题，其实是一个“反事实”问题。我们认为要是不是老王开枪，老李不会死：这就是反事实分析。老王肯定有责任，可是另一方面，要是钢琴不掉下来，老李也不会被钢琴砸死，那钢琴的主人有没有责任？这个责任应该怎么论呢？


    像这样的事儿每个人都有一些感性的“体会”——似乎老王不应该按杀人罪论处——问题在于怎么上升到理性定论。理性的办法，是用反事实分析来计算概率。


    # 2.But-for 判据


    事实上，反事实分析，可以被视为是因果关系的一个定义。我们还是得从苏格兰哲学家大卫·休谟说起。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_128_0.png)


    按中国的纪年，休谟出生于康熙五十年（1711），卒于乾隆四十一年（1776）。我不知道在此期间大清朝生产出来了什么文化财富，咱也不论西方的科技进步，单论人家一个哲学家休谟的思想，是一直照耀到现代社会。


    乾隆四年（1739），休谟提出一个关于因果关系的定义。他所谓的原因果关系只不过就是时间上先后发生的两件事，我们*在感觉中*觉得它们之间有联系而已。用今天的语言来说，休谟认为因果关系是人脑的一种错觉，因果其实就是相关性。


    但是到了乾隆十三年（1748），休谟改主意了。休谟所谓因果就是如果不是第一件事情发生了，第二件事情就不会发生。


    这两个定义对应到后来的人对因果的两种态度，形成了两个派别，这两个派别都把休谟奉为祖师爷。


    按理说第二个定义明显比第一个定义更有力。每天天亮*之前*，总会有公鸡打鸣，那根据第一个定义，难道说公鸡打鸣导致了天亮吗？第二个定义就能避免这种尴尬：就算天下的公鸡都不打鸣，天还会亮，所以公鸡打鸣不是天亮的缘故。


    可是第一个定义纯粹用事实说话，更有科学味道，所以一直到上世纪七十年代都是学界的主流。而现在因果革命的一大成果，就是让第二个定义成为主流。


    第二个定义的本质就是反事实分析。要不是 A 发生，B 就不会发生。这个“要不是”，对应的英文是“but for”——这个 but-for 原则，恰恰是现在在法律上判定
    A 要不要为 B 负责的重要依据。


    比如说，嫌疑人开枪，受害者头部中枪立即可死亡，那么开枪这个行为就是一个 but-for。要不是你开枪，他就不会死，所以这件事你得负责。


    这个道理说着简单，实际并不简单。


    # 3.必要概率和充分概率


    珀尔很喜欢用反事实分析较真儿。这个 but-for 的责任可以是间歇的。珀尔说，考虑下面这个情况，请问应该怎么判——


    小王在一家歌舞厅工作。小王违反安全条例，用家具挡住了歌舞厅的一个安全出口的门。结果歌舞厅发生大火，一个人因为安全出口被挡住了而跑不出去，被烧死了。


    小王是没有纵火，但是小王有重大责任。那怎么量化小王的责任呢？珀尔说你得计算一个反事实的概率。


    假设 X=1 表示门被阻挡，X=0 表示门没有被阻挡；Y=1 表示人被烧死，Y=0 表示人没有被烧死。那么珀尔说，你要计算 P(Y(X=0)=0 | X=1,
    Y=1)


    这个表达式的意思是在已知 X=1，Y=1 的情况下，求如果 X=0 的话，Y=0 的概率。翻译成人话，就是“现在我们知道门被挡住的情况下死了人，请问如果门没有被挡住，人不死的概率”。


    再说白了，就是要不是小王挡了门，还会死人吗？这当然就是一个 but-for。但是前面那句“已知…… ”很重要，它告诫了我 们这个问题的重要性。


    珀尔把这个概率称之为“必要概率”。小王挡门，是烧死人的必要条件。这个必要概率越大，小王的责任就越大。珀尔估计，如果按照 but-for 标准，美国刑事犯罪是否定罪的必要概率应该在99%以上。


    但是珀尔说，只考虑必要概率是不够的。


    比如说，有人在房间里划火柴把房子给烧了。显然划火柴是一个 but-for，这个动作的必要概率很高，应该处罚这个人。可另一方面，房间里要是没有氧气的话，划火柴也不足以点着房子吗？所以氧气也是一个
    but-for，氧气的必要概率也很高。你怎么区分划火柴的人和氧气的责任呢？


    为此，珀尔说我们还要考虑“充分概率”。所谓充分概率就是做这个动作是否足以导致这样的结果。划火柴的充分概率很高，但是氧气的充分概率很低。毕竟每个房子里都有氧气，而氧气自己并没有导致别的房子着火。


    咱们回到开头老王杀老李的案子中。设定 X=1 表示老王开枪，X=0 表示不开枪；Y=1 表示老李被钢琴砸死，Y=0 表示老李没被钢琴砸死。那么充分概率的严格定义就是
    P(Y(X=1)=1 | X=0,Y=0)


    意思是已知如果 X=0 则 Y=0，求如果 X=1 的话，Y=1 的概率。翻译成人话，就是“我们知道老王要是不开枪的话老李不会被钢琴砸死，那么请问老王开枪的情况下，老李有多大可能性被钢琴砸死？”


    没人能想到有个钢琴会掉下来，所以这个充分概率很低。据此，我们认为老王只应该“试图杀人”、而不应该按照杀人罪论处。换一个场景，如果是老王在高楼顶上追杀老李，导致老李坠楼身亡，那老王的充分概率就会很高。


    在划火柴和氧气的案子中，划火柴的必要概率和充分概率都很高，氧气的必要概率高、充分概率低——所以划火柴这个动作要承担责任，而氧气不应承担责任。


    而在小王用家具挡了安全出口的门这个案子中，既然有个安全出口，就说明这里防火很重要，火灾并不是钢琴从天而降那种小概率事件。小王这个做法的必要概率和充分概率都不低，小王要承担很大责任。'
