  md: '# 日课158 | 一个对收入差距增大的物理学解释


    日课158 | 一个对收入差距...


    很多人工作是为了赚钱，物理学家搞物理则几乎都是出于兴趣。而如果你对物理学感兴趣，你就对很多东西都感兴趣……也包括赚钱。


    当然我的意思不是说物理学家稼磨自己怎么赚钱，这个兴趣是研究全社会的人都是怎么赚钱的。传统上赚钱的事儿都是经济学家研究，但是有时候物理学的方法也能帮上忙。我们今天就说一个用物理学方法解释收入差距增大这个现象的新研究。


    人和人有收入差距，这个一般人都能接受，毕竟绝对的平均是不存在的，适当的收入差距还能刺激人们努力工作。但现在的问题是这个世界不但有收入差距，而且收入差距越涨越大。那这是为什么呢？


    以前普遍的解释是富人是通过投资、用钱赚钱，这是一个正反馈的过程。但我今天要说的这个研究则说明，哪怕没有股票之类的投资手段，所有人都靠做实业赚钱，局面上也会是收入差距越来越大。这个研究就是物理学家做的。


    # 1.财富来自流动


    阿德里安·贝扬（Adrian Bejan）是杜克大学工程物理系的教授，他是个“非典型”的物理学家，他的研究五花八门 [1]。


    贝扬赖以成名的,,工作，是他总结了一个适用于不同领域的热力学定律，叫“构造定律（Constructal Law）” [2]。


    这个定律的大概意思是说，对于任何一个存在某种“流动”的系统，比如说河流的脉络，它的长期演化趋势必定是要慢慢调整结构，让这个流动越来越容易。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_83_0.png)


    植物的叶脉、哺乳动物的血管，都具有这种特点。我们前面讲《规模》那本书的时候说过，这其实具有分形的特点，但贝扬的关注点不是分形的结构，而是流动的顺畅性。


    构造定律是贝扬二十多年前就提出来的，现在已经被人们接受，今年还刚得了一个工程力学的大奖。好，现在贝扬把构造定律的思想给用到了财富上。贝扬2017年有一篇论文
    [3]，用构造定律解释了为什么收入差距越来越大。


    财富是从哪来的呢？贝扬的洞见是财富正比于东西的流动。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_83_1.png)


    ![](img/a2c55447bc97d25d1622d2d734d5541b_83_2.png)


    这张图上有三条曲线，从上到下，分别表现了1971年以后世界人均能源消耗、单位GDP能源消耗、和总能源消耗。


    # 2 流量的分叉


    想象你运送一批货物。货物的重量是 M，你运送的距离是 L，那么你要花费的汽油钱，应该正比于 ML。前面我们说了财富正比于能量消耗，所以我们基本上可以说，你做这个工作的收入，正比于
    ML。


    > （严格地说货物重量越大，能源效率也越高，用大车运送十倍的货物比用小车运送一倍的货物省钱，所以收入应该正比于 M^(1-α)L，其中 α 代表能源利用效率，但这个细节并不重要。）


    ![](img/a2c55447bc97d25d1622d2d734d5541b_83_3.png)


    纵坐标这个 β_(1/2) 代表需要底层人数的比例。比如 β = 0.8，那就是说占总人数 80% 的人，拥有全部财富的一半 —— 然后再剩下那 20% 的人分享另一半。β
    越高，收入差距就越大。


    所以经济越发达收入差距就越大，哈哈就早马克思讨厌的经济分工了啊更多层每一层分'
