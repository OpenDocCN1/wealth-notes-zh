  md: '# 日课140 | 孤岛生产的天才


    日课140 | 孤岛生产的天才


    今天咱们说一个有点不寻常的关于创新的观点：“孤岛”中为什么能产生天才。


    我们专栏经常说一句话，创造就是“想法的连接”。这个话不是我拍脑袋想出来的，乔布斯就说过类似的话。乔布斯说，苹果产品是人文艺术与技术的结合。中国工业界也有一句话叫“综合即创造”。你从各家买零部件，从各个方面获得灵感，自己组装一个手机，哪怕它的国产化率没有达到100%，你也可以说这是中国创造。只要能满足新的市场需求，它就是创新。


    既然如此，创新就是交流出来的。那肯定是大城市有利于创新。我刚刚讲过韦斯特的《规模》这本书，其中讲到城市里人的交流水平 —— 比如说互相打电话的次数 —— 是跟人口数的1.15次方成正比。然后一个城市产生的发明专利数，也跟人口的1.15次方成正比。城市规模变大，它的创新能力就会超线性地增加。


    这一切都没问题，但是今天我要说的恰恰是一个相反的观点。


    有时候不交流反而容易出现革命性的创新。


    5月10日这一期《纽约书评》上有一篇物理学家弗里曼·戴森（Freeman Dyson）给《规模》这本书写的书评 [1]。戴森是最佩服的物理学家和书评人，咱们专栏多次讲过他。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_56_0.png)


    戴森对《规模》这本书可以说是al不怎么满意。一个原因是韦斯特的理论不够强。书里用了很多数据分析，总结了各种标度率，但是缺少简单漂亮的理论。当然关于生物体的标度率韦斯特使用了分形理论，但戴森觉得这些工作还不够彻底。


    戴森更不满意的还是书中的结论。韦斯特使用城市标度率预测，未来城市应该越来越大，创新越来越快。戴森不喜欢这个预测，尤其不喜欢韦斯特把它包装成了一个“统一理论”。


    可能是因为这个原因，戴森还说了一些气话。说这本书一个十岁小孩都能看懂，说韦斯特写到生命和熵的时候居然连热力学第二定律也会允许生命越来越复杂这个现象都说不清楚，他是不是不知道啊……而在我看来事实
    healthy只是书中第一章的一小段，跟主题无关，韦斯特根本没必要细说。


    但不论如何，戴森提出一个相反的观点。这个观点非常重要。


    咱们得先理解一个生物学概念，叫“基因漂变（genetic drift）”。这个概念早就有，但真正把它完善、让人普遍接受，是在1968年，归功于日本生物学家木村资生。


    戴森说基因漂变是可以和达尔文的自然选择相并列的一个演化机制。


    我们知道生物一代传一代，有各种随机的基因突变。自然选择是说哪些基因突变能适应环境，就保留下来，不适应就淘汰，是环境来决定演化。


    而基因漂变则是说，对某些基因突变，环境没什么意见，那就怎么变都可以。比如一个人长得高一点，不能说他更适应环境，也不能说不适应 —— 就是一个特色而已。如果是一些高个子正好住在一个村里，互相通婚，那这个村一代一代下去，就会成为一个高个村，高个突变就被保留下来了。


    特别是，如果人们住得很分散，不同的村落之间缺少交流，那就可能会出现有些村是高个村，有些村是矮个村，每个村子都有自己的特色。这种情况跟自然选择没有关系，纯粹就是基因的随机传播、分叉、造成多样性
    —— 这就是基因漂变。


    基因漂变的速度跟族群的人数有关。如果聚集在一起互相通婚的人很多，出现什么特殊基因就很容易被淘汰，基因漂变就不明显。如果人口比较少，比如只有这一个村，那出现什么罕见基因就更容易保留下来，基因漂变就很强。


    我打个比方。这就好比说过去交通不便，各个村镇都比较孤立的时候，简直是每个村镇都有自己的特色方言 —— 这是独自演化的结果，这就是基因漂变。等到交通便利了人与人充分交流，很多小方言就没人说了。


    基因漂变的速度，跟人口的平方根的倒数成正比。也就是说，一个一万人的小镇的漂变速度是有有一百万人口的城市的十倍。


    身高、智商，各种遗传特征，都可以漂变。


    好，现在假设我们有一百万人，考虑两种发展路线。


    如果让这一百万人住在同一个大城市里，他们就会充分交流、互相影响，结果就是大家的文化习俗、身高长相都差不多。那么就不太容易出现特别特殊的人。


    但是如果让这一百万人分散居住在一百个小镇里，各自小镇独自发展，互相之间不交流，就会出现快速的基因漂变。若干年后，有的小镇的人身高特别高，有的小镇的人身高特别矮，有的小镇的人特别笨，也有一些小镇的人特别聪明。


    平均而言，这一百个小镇的人可能不会比那个大城市的人更聪明 —— 但是由于多样性强，其中就会有几个小镇，里面的人特别特别聪明。


    而戴森说，欧洲历史恰恰就是这个小镇模式！从公元前1000年到公元1800年这将近3000年中，整个欧洲和中东地区都是由小村镇一样的存在组成的，没有什么特别大的城市。而其中某些小村镇，产生了各种天才
    ——


    +   * 公元前800年耶路撒冷人发明了一种宗教；

    * 公元前500年雅典发明了戏剧，发明了哲学，起源了科学；

    * 公元1300年威尼斯发明了现代商业；

    * 公元1600年佛罗伦萨发明了现代科学；

    * 公元1750年曼彻斯特发明了现代工业。


    所有这些地方，在产生发明的时候，都只是几万人小镇。而且这些小镇里还存在着族群隔离和社会阶层隔离。这些伟大发明不是由住在大城市里的一大群人通过社交网络做出来的，而是小镇青年创造出来的。


    所以戴森说的这是一种孤岛式的创新。


    戴森还畅想了一下未来，说未来的人真的会像韦斯特说的那样，大家都住大城市吗？也不一定。可能将来人类殖民外星，就有一些人会选择一个遥远的星球去居住，他们在那里形成自己独特的人文化。还有可能出现转基因的婴儿，他们长大了恐怕不会跟主流人群通婚，也许形成自己的群落。基因漂变式的创新，将会继续进行。


    # 由此得到


    戴森借助基因漂变的观念，提出另一种创新模式：不是来自交流，而是来自少数天才不受打扰的独自发展 —— 而这个模式，似乎更符合古代欧洲的情况。


    # 我的评论


    我觉得这里面首先有一个“度”的问题。耶路撒冷、雅典、威尼斯、佛罗伦萨和曼彻斯特，戴森称它们叫“小镇”，韦斯特完全可以管它们叫“大城市”。这些本来都是历史上的名城，很多都是文交交流的中心。


    但是戴森和韦斯特的根本区别在于，韦斯特的理论重点强调了城市和城市的共同点 —— 只要人口差不多，那各种能力就差不多；而戴森则强调了不同村镇的个性差别 ——
    在基因漂变的作用下，各个村镇经常不一样。


    可能历史上有很多村镇的人口数跟前面那几个名城差不多、甚至更多，但是未能做出这些伟大的发明。


    归根结底，这里displaystyle有一个根本的矛盾，值得每一个创新者注意 ——


    你要 在多大程度上保留和发展自己的个性'
