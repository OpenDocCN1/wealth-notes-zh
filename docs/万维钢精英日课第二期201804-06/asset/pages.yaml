  md: '# 日课130 | 《规模》6:公司的宿命


    日课130 | 《规模》6:公司...


    今天咱们把赫斯特的《规模》这本书讲完。今天这最后 一讲，咱们说说公司。


    尺度分析这个方法最厉害的地方就在于，它只是抓住一个非常简单的数学关系，就能确定生物体、城市和公司的命运。你就发现不同生物体虽然各自有各自的特点，但是大体上都符合同样的标度率。韦斯特甚至说，标度率决定了城市80%到90%的可测算的特点
    —— 也就是说，什么文化、历史、政府的政策，最多只能决定百分之十几。


    规模决定了生物体的能量汲取能力、力量和寿命。规模决定了城市的产出、基础设施和发展前景。规模，也能决定公司的宿命。


    在讲公司之前，我想先借这个机会，把韦斯特这本书的理论总结成一个统一的框架。不管是生物体、城市还是公司，你这个系统总有一定的规模，总要汲取一些能量，总要消耗一些能量，我们可以把对应的关系总结成一张表——


    | | | | |


    想要让系统能够发展壮大，汲取的能量必须大于消耗的能量。这本书研究的全内部内容，就是汲取的能量和规模之间的关系。这个关系可以用一个标度率来表示——


    # 汲取的能量 ∝ 规模^k


    对生物体来说，k=3/4。这是一个次线性关系，说明生物的能量汲取能力跟不上体重的增长，所以长到一定程度就不能继续长了，只能停止长大、成熟、然后衰老。


    对城市来说，k=1.15。这是一个超线性关系，说明城市创造财富的能力超过人口的增长速度，所以原则上城市可以一直发展壮大。只要有人口供应，只要地球资源够用，城市永远不会老。更好的是，城市基础设施的标度率是k=0.85，说明城市不但可以一直长大，而且还越来越环保。


    那公司的标度率是什么呢？


    下面这张图，就是28853家美国上市公司的 情况。横坐标是各公司雇员的人数，纵 坐标，从上到下按顺时针方向，分别是净 收入、总利润、销售额和总资产。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_30_0.png)


    我们看这些数据非常杂乱无章。韦斯特说 这是因为相对于生物和城市来说，公司没有经过亿万年的进化也没有经过数百年的演变，年纪都很短，没有机会形成特别稳定的结构。不过研究者可以把规模相近的公司取个平均值，就得到图中那些白色的圆点，这些点还是非常整齐的。


    结果根据这些数据，公司这几个项目的标度率分别显示在图上。我们特别要注意的就是“销售额”这一项，这一项目相当于公司从外界汲取能量的能力，至关重要。


    销售额，正比于雇员人数的0.98次方。这差不多就是k=1，也就是线性关系。


    后来有一位北京师范大学的学者，叫张江，加入了圣达菲研究所的这项研究。张江分析了中国上市公司的 数据，跟美国对比，性质比较接近。下图中左边两个是美国公司的销售额和销售成本，右边两个是中国公司的销售额和销售成本——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_30_1.png)


    美国公司的销售额和销售成本差不多都正好正比于公司雇员人数，中国公司的销售额和销售成本差不多正比于雇员人数的0.8次方。单从这组数据来看，中国公司的效率有点问题，雇员人数增多的同时业绩并没有按比例增加，有点人浮于事的意思，这么发展是不可持续的。


    不过在韦斯特看来，这两张图说明，中美两国的公司业绩差不多都是正比于公司雇员人数。考虑到公司数据实在是杂乱，我们也姑且可以这么理解。


    所以对公司来说，似乎是k=1的线性关系。这说明公司是处在城市那样的无限制发展和生物体那样有限发展之间。没有什么是明确的力量推动公司越来越大，也没有什么明确的限制要求公司有固定的寿命。公司的标度率，正好处在发展的边缘。


    我们再考察几个大公司的发展史，这个局面更明显——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_30_2.png)


    这是一张半对数坐标图。小公司一开始可能增长很快，但最终都变成近似的直线，增长率固定下来。


    这种增速比城市是慢了 Reg很多，但是从理论上来说，这其实还是指数增长。但这种增长非常危险。


    大公司的销售额和成本都跟雇员人数成正比，这是一个危险的关系，因为你经不起折腾。这其实是一个勉强维持的局面。韦斯特打了个比方，说这就像一位老人，身  [截断]  致命危险。大公司随着市场波动，
    非常脆弱，一旦发生什么财务状况，就可能倒闭。'
