  md: "，你就得到了 $N$ 个小东西，然后\n\n```\n$N = r^D$\n```\n\n那么这个 $D$，就是维度。正方形，$D=2$，说明是2维的；立方体，$D=3$，是3维的。那么反过来，取个对数，我们也可以说\n\
    \n```\n$D = \\frac{\\log N}{\\log r}$\n```\n\n这就是计算任何图形的维度的公式。那咱们来算算前面那个科赫曲线的维度是多少。注意，这不是一条平常的曲线，这是一条想象中的、细节无限可分的曲线。\n\
    \n![](img/a2c55447bc97d25d1622d2d734d5541b_17_0.png)\n\n按照最基本长度的1/3为一段分段，横向分3段的话，这条曲线的长度是4段，相当于上图巾第二条曲线。按照1/9的长度分段9段，曲线的长度是16段，以此类推。也\
    \ Μέ说是，$r=3$，则 $N=4$；$r=9$，则 $N=16$，……注意 $r$ 和 $N$ 的变化是这么一直以乘方形式变，而取对数再做除法，所有的乘方就都被消除了，所以维度永远都是\n\
    \n```\n$D = \\frac{\\log N}{\\log r} = \\frac{\\log 4}{\\log 3} = \\frac{\\log\
    \ 16}{\\log 9} = ... = 1.26$\n```\n\n这就是分形特殊的数学性质！一般的线都是1维的。科赫曲线明明是一条线，但因为它是一条特殊的、中间有无限细节的线，它居然不是1维，而是1.26维！\n\
    \n这个结果就是说，分形，可以增加维度 —— 出现了分数维，所以才叫“分”形。\n\n好，那我们再看一个更特殊的情况。把科赫曲线中那三个三角形的夹角无限地缩小，以至于变成中间突出的一条线段，这么一直分形下去是什么结果呢？是下面第四个图的样子\
