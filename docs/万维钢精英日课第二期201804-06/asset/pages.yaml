  md: '# 答读者问|“成长思维模式”和“坚毅力”


    答读者问|“成长思维模式”...


    # 来自日课：满怀知识的小市民


    有写大家一生没出过家乡，却有世上最深邃的思想，比如康德。难道思想的加深不一定需要环境的熏陶吗。那思想的深度到底和什么有关呢？


    万维钢


    人非生而知之，所有思想家都是环境的产物。但不一定思想家就必周游世界。我们说过，读书是获取知识效率最高的做法，康德用的正是这个办法。康德受过很好的教育，他在大学里教很多门不同的课程。康德是没有走遍欧洲，但康德是当时欧洲文明的产物。事实上，康德的思想恰恰是把英国的经验主义哲学和德国的理性主义结合起来。他把传统的哲学给科学化、数学化、公理化，他之所以能这么做——甚至能想到做这些——恰恰是因为当时学术界走到了这一步。康德不是从天上掉下来的。


    所以我们看思想家都是扎堆出现的，牛顿同时期有莱布尼茨和胡克，达尔文同时期有华莱士，孔子同时期有诸子百家，等等。外部技术手段，比如有没有条件精确观测、有没有条件让一个人环游世界考察动植物、有没有条件让一些人不论从事生产，专门讲学，决定了思想演化的硬条件，思想家只不过顺应潮流而已。


    所以一个人不知道现在世界上是怎么回事儿，不知道自己领域的思想到了哪一步，闭门造车，那是绝对不行的。所以我们看一些民间科学家，一开口就知道他肯定不行，因为他连这个领域现在到了哪里都不知道。任何人写论文都得从领域当前状况开始说起。比如我知道某著名大学某位教授，号称要研究“意识科学”，可是他连物理学里的“暗物质”是什么意思都不知道就敢用“暗物质”解释意志，他写个论文连现在国际主流哲学界对意识研究到了什么程度都没有评论，那你基本就可以断定这人是胡闹。


    但是从另一方面说，也有很多人学者对领域内的情况了如指掌，说起名人八卦来滔滔不绝，可自他自己写的文章里没有独特的洞见，这也不行。那独特的洞见从哪里来呢？从圈外来。比如得到有个“六神磊磊读唐诗”，其中有个道理就说的很有意思，当时前人都在写宫廷绮的诗，后来有些诗人开始写山山水水、老百姓的情感了，这是从圈外引入新鲜空气，才开创了唐诗的大时代。再比如我以前搞的等离子体物理学，圈内基本理论已经不新鲜了，就有人引入圈外的混沌理论、反馈回路理论，不一定成功，但是很新颖。


    你得对这个圈子有一定的了解，才能说得上话。如果这个圈子已经没有活力了，你得从圈外拿进来新东西，才是真正的大家。


    我觉得思想的“深度”是个不好定义的东 西，广度和新颖度可能更重要。说白了，思想就好像是生物的演化，广度就是它的基因传承，新颖度就是它的基因变异。


    康德以前的哲学没有搞科学化，康德正好赶上了这一波努力。可以说康德既在传统哲学圈子的前沿，也在当时新哲学圈子的核心。而对塔勒布来说，康德的哲学结论是真正的道德应该对每个人都同样地好，这已经脱离实际了，纯粹是数学式推导的产品——塔勒布对此不以为然。对我们来说，康德的哲学是宝贵的学问，但是不一定适合指导日常生活的。


    作为普通群众怎样不被这些“知识白痴”发表的文章和书籍所误导？


    万维钢


    首先，你得识别什么是“主流”。《纽约时报》、《经济学人》、哈佛大学，这些机构和其中的人，代表一个无形的主流。是，众所周知《纽约时报》是有偏见的，但是，它至少绝对不会刊登《货币战争》这种阴谋论。主流不会犯特别低级的错误。


    识别了主流，你就能自动免疫绝大多数不靠谱的说法。你立即就能知道什么微信朋友圈发的那些健康指南，小报上发的饮食禁忌，全是胡说八道。主流媒体如果说一件什么事，肯定有足够的根据，比如它要引用一项权威的研究才行。


    当然，中国的主流媒体、主流学术机构是什么，甚至中国到底有没有主流，这都不是我敢下结论的。


    再进一步，主流之上，还有各种各样的争议。主流媒体上也有各个派别在吵来吵去。塔勒布对平克的批评就是这种主流之上的争议。平克犯的错误跟《货币战争》是不同层次的错误。


    到这一步怎么判断对错呢？这就不能靠等级标签判断了，得自己理解和分 析。如果根本看不懂别人的理论，那你自然就没有办法评论别人的理论，就算是告诉你哪个对，你也不一定相信。


    其实在我看来“主流”已经基本代表了当前能给你的最好的行动建议。听主流的就吃不了大亏。主流以上的争论主要要是观念上的，对行动的指导意义有限。比如以前科学家认为盐吃太多了对健康有害，现在有的新研究说多吃点没关系——你说知道不知道这个又能怎么样呢？有害也是很小的害处。平克说错了，我们最多犯一个观念上对*人类*过分乐观或者善观的错误，可能对行动完全没影响；《货币战争》说错了，很多人投资黄金都赔钱了。


    而如果你一旦对主流之上的争论感兴趣，那就说明你想严肃对待知识，那你就应该下硬功夫读很多很多书，提高自己的思维水平。


    文中说，塔勒布对同行评议很不以为然，认为这个很不靠谱，最靠谱的是利益相关、客户评议。但在现实生活中，客户评议也是相当不可靠，甚至比同行评议有过之而无不及。例如手机业，卖的最好的往往不是质量最好的，或者性价比最高的，而是产品过去的，营销做得最成功的。比如oppo。因为大多数客户并不是很懂产品和服务，而且即使懂行，也不可能同时买10款不同品牌的手  机用半年的时间分析比较来选出最优的，他们大多数会被广告和产品的市场
    覆盖率（所谓的口碑）左右。再比如奥斯卡奖也是同行评议，如果客户评议，看销售排行榜就可以了，但现实是销量大 的不一定是最好的电影，而且可能是部烂片。当然塔勒布也视同行评议也不是没道理，那么我的问题是：什么样的评
    议制度相对比较科学公正？有没有人比较系统地研究过这个问题？


    万维钢


    非常赞同你的说法。以前人们说什么是“专 业人士”呢？就是他们对自己干的活儿很讲 究，以至于并不仅仅看市场的评价，他们更关心同行的观点。比如医生，他有一种职业荣誉感，哪里患者根本不懂，他从医生的角度，也要把手术做得漂漂亮亮。也
    就是说，对专业人士来说，同行评议是比市场评议更高级的标准。


    塔勒布说的终极评价标准是时间、波动性和脆弱。能历经时 间、仍然存活下来的，才是真东西。可 是对这些本来就是要流行一时的东西来说，长时间考验并没有太大意义。


    也许没有绝对好的评议制度。比如说“赤脚医生”的治疗方法，在同行评议来 说根本就上不了台面，但是在国家特别困难的时期，可能就起到了很好的作用。


    那到底什么评议标准好呢？我认为这取决于你想干什么。你想赚钱，就是市场评 议。你想追求最先进最高级，那就是同行评议。你想实用、有效，那就是时间评议。我们看到，这些好东西之间也是有矛盾的。


    万老师，强烈想听您分析中美贸易战您怎么看？哪一边会赢呢？为什么呢？


    万维钢


    首先我强烈推荐施展老师在得到对中美贸易战、包括中美两国的经济基本状况的解释，这是我所听过所有说法中最有道理的。我并没有不同于施展老师的看法，但是的确有很多读者问我有什么看法，所以我想借此机会帮助咱们读者理清几个误解'
