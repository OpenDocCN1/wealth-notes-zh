  md: '# 日课164｜《为什么》5：

    六个判断力层级


    日课164｜《为什么》5:六个... ↓


    今天咱们继续说朱迪亚·珀尔的《为什么：因果关系的新科学》。我们要讲一个特别基本的问题，和一个特别新的解法。这个解法可以说是这本书的一个魅力所在，是科学的进步。


    问题很简单。你怎么知道一个东西到底是不是真有效呢？


    # 1.老百姓的层次


    我们在日常生活中经常面对这个问题。比如现在有一种卖得很贵的保健品，号称用的材料都是货真价实的，里面有各种珍贵的药材，对身体有好处，那你怎么知道它是不是真有效呢？这一问题，就能把人按见识短长拉开很多档次。


    最底层的判断力是既然这个东西“贵”，那就肯定有效。材料贵、材料是真的就有 offences 吗？有个笑话叫“珍珠翡翠白玉汤”，说这个汤是用珍珠、翡翠和白玉这些最贵的东西熬出来的——也就是白开水，它对身体没有任何作用。其实现代制药业用的都是普通的材料，就好像做软件一样边际成本很低。药物有没有效在于配方是否科学，不在于材料贵不贵。


    有人往白酒里加金箔，喝酒就是喝黄金，但你要知道它不能把你的身体变成黄金的。然而这种认知就能在中国刷掉很多人。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_126_0.png)


    “贵”可以让你觉得有效，最多相当于“理论上应该有效”——可是真正有没有效，得看实践。


    第二层判断力，是有个熟人吃了这个保健品有效，所以我认为它有效。这一条又刷掉了很多人。


    一个例子能证明有效吗？可能熟人那几天偶然身体不好，本来不吃也能恢复，吃保健品和恢复完全是巧合。你起码知道大多数人吃了这个保健品有没有效——及，这个保健品有没有害。


    第三层判断力是对人群的研究。假设二十年后中国人民的文化水平普遍提高，这个保健品集团为了跟上人民日益增长的智商，委托内蒙古大学出了一个报告，说吃了这个保健品的人群的身体状况，平均而言，比没吃的人群好。那这个报告能说明这个保健品有效吗？


    还是不能。保健品卖得挺贵，吃这个保健品的一般都是有点钱的人。这些人的医疗保障、生活环境、饮食结构各方面都比穷人要好，他们的身体状况本来就*应该*更好。你怎么能知道是吃了保健品的人身体好呢，还是身体好的人更容易买保健品吃呢？


    这些都是老百姓水平的判断力。那科学家会怎么做呢？


    # 2.混杂偏误


    上一讲说的贝叶斯方法适合每次遇到一个新证据的情况，今天我们说科学家使用的大规模统计研究。咱们先捡一捡。说 X 对 Y 有效，就是要建立从 X 到 Y 的一个因果关系：X→Y。


    事情的复杂之处在于，往往会有一个其他因素，Z，既影响了 X 也影响了 Y。因果关系图就如 Al 反面这样——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_126_1.png)


    比如说，X 代表每天锻炼身体，Y 是身体健康，Z 是年龄。我们希望证明锻炼身体能促进身体健康，但是你得考虑年龄因素。年轻人更爱锻炼身体，年轻人的身体也更健康。那当你观察到爱锻炼身体的人更健康这个现象，你就不知道到底是
    X 导致了 Y，还是因为 Z 同时影响了 X 和 Y。


    统计学上管 Z 叫“干扰因素（confounding factor）”，也叫潜在变量。不考虑 Z 就贸然说锻炼对身体有好处，那你就犯了“混杂偏误”，也叫“混淆偏倚”，英文是
    confounding bias。Z，混淆了 X→Y 的因果关系。


    但是你很容易就能去除 Z 的混杂。比如如果年龄是个干扰因素，那我们就可以只考察同一个年龄段的人，看看其中锻炼和不锻炼的人的健康区别。如果同样为50岁，锻炼的人比不锻炼的人身体好，那就说明在年龄之外，锻炼真可能有好处。


    在统计学上这叫“控制变量”——我们控制了年龄因素，“controlling for Z”，再看 X 和 Y 之间有没有关系。


    而年龄之外还可能有别的因素。比如时间也是个因素，工作清闲的人有更多时间锻炼，同时工作清闲的人身体状况也可能更好，所以你还得控制“工作清闲”这个变量。


    前面说保健品的时候提到的经济条件可能影响健康，而且经济条件好的人的确更爱锻炼，所以我们必须控制经济条件这个变量。


    根据我的主观标准，判断力的第四层，就是如此这般、你想到一个因素就控制一个因素……这已经是科学方法。大量学术研究都是这么做的，控制了各种可能因素之后，给你一个结论：X
    跟 Y 之间有这么一个推测性的关系。


    这个方法的问题在于你永远都无法穷尽所有可能的干扰因素，也许就是有一些变量是你没想到的、或者来不及控制的！所以你还是不敢说 X 跟 Y 有因果关系！


    # 3.随机实验


    第五层判断力是随机实验。随机实验的创始人是英国统计学家罗纳德·费舍尔（Ronald Fisher）。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_126_2.png)


    大约是1923年，费舍尔在研究肥料对农作物生长的影响。他可没像某些保健品那样，说这个肥料货真价实的都是好材料就一定是好肥料。


    费舍尔老老实实做实验。弄两块实验田，一块用1号肥料一块用2号肥料，看看到那块田的庄稼长得好，这行不行呢？


    问题在于世界上根本没有完全相同的两块田。有些土地的灌溉比较好，有的地方虫害少，不同土地的酸碱度也不一样，所有这些都是干扰因素，你得想办法控制。


    费舍尔意识到，不管怎么控制，他都无法排除所有的潜在干扰因素。


    最后费舍尔想了一个办法。他说我干脆来个*随机*实验。他找了很多块土地，把土地随机地分成两组，一组用1号肥料，另外一组用2号肥料。


    大规模随机分组的好处就在于，因为没有使用任何主观分类标准，那么不管你有什么干扰因素，这个干扰因素在两个组里的强度应该是大致相同的。只要实验的样本量足够大，随机分成的两组之间就不会有本质的差异。


    这是一个天才的设想，能够排 除一切干扰因 素！不但如此，费舍尔还能用统计方法估算 随机实验得出结 论的不确定性到 有多大。比如说你可以 用“P值”代表不确定性，我们专栏前面有一篇《P<0.05：科学家的隐藏动机》专门讲过。


    随机实验现在是临床医学的黄金标准。凡是有新药出来，美国 FDA 都会要求做大规模的随机实验。你不拉出来溜溜，又怎么能...'
