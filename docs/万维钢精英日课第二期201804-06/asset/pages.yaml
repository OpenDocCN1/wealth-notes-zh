  md: '# 特别放发送 | 就这样变成大人


    特别放发送 | 就这样变成大人


    万维钢


    各位好！今天我帮你把刚刚解读过的《囤丁与育儿》这本书梳理了一下，做成了一张问题清单。咱们之前说过，这不是一本育儿指南，它用最新的科学研究成果，让我们重新理解了“童年”和“成长”。你现在就可以去查看，或者转发给和你一样认真对待自己、也认真对待孩子的朋友。祝你们每天都有收获。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_85_0.png)


    书名：《囤丁与木匠》（ The Gardener and the Carpenter: What the New Science of Child Development
    Tells Us About the Relationship Between Parents and Children）


    作者：加州大学伯克利分校的发展心理学 家艾莉森·高普尼克（ Alison Gopnik）


    出版日期：2016年（暂无中文版）


    # | 童年到底是什么？


    动物界的普遍规律是未成年期越漫长的物种，智力水平越发达。


    漫长的童年是人类的竞争优势，让人类在 这段期间学习应对不确定性的风险。


    人类的童年和青春期都越来越长，这个回报也是巨大的——人类一代比一代强，早 就不是一般的灵长类了。


    童年，是一种风险解决方案。


    # | “早当家”是好事吗？


    人类要应对复杂多变的 环境，最好 的办法 是：自己也变复杂。


    学习一项技能需要专注，而变复杂需要在 各个方向探索。探索期间，只能靠父母。


    所以父母的任务就是提供一个环境让孩子 探索。让他们可以无责地随便折腾，变 复杂，以期适 应未来多变的环境。


    所以养育的重点不是掌握某一方面的技 能，而是让他学会面对未来的不确定性。


    “早当家”就不是好事儿。


    # | 童年时代，小孩应该干什么？家长呢？


    小孩应该干的：探索和学习。


    家长不是给孩子定制、制定或者指定发展 路线。提供资源保障，让孩子充分探索。


    是让孩子面对这个充满不确定性的世界， 具备抗击打能力、自我发展能力和创新能 力。


    截止回顾：童年是一种风险解决方案


    # | 六岁以下的孩子到底应该学什么？


    学习有三个渠道：自己摸索和试错、模 仿、听讲。


    孩子的模仿非常高级。他不是什么动作都 模仿，只有你这个动作能够达到一定的目 的，他才会模仿你。通过模仿，孩子能了 解事物之间的因果关系。


    关键：孩子模仿的对象，必须得是人。


    更关键：最好是关系亲近、跟他相似的 人。你跟孩子关系越好，他越愿意模仿 你。


    # | 为什么孩子不听你的话？


    孩子听不听你的话，首先取决于你们之间 的关系。


    对于接收信息，孩子非常挑人——不是什 么人跟他说什么东西他都信。


    孩子和家长的关系可以分为三种：安全 型、回避型、焦虑型。


    安全型的孩子听家长的。他跟家长关系 好，他相信家长的话；但是家长和真理不 一致的时候，他更相信真理。安全型孩子 的学习模式非常健康。


    回避型的孩子，有可能听家长的，但是家 长在他心里没有权威，一旦遇到冲突，他 不相信家长。


    焦虑型的孩子，永远都相信家长。他不顾 客观事实……搞不好长大了会变成妈宝 男。


    截止回顾：真关系和假教育


    # | 为什么孩子要打闹？


    打闹，是一种社交演练。它是孩子在学习 社交互动。


    # | 玩具对孩子有什么用？


