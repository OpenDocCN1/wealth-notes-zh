  md: '# 日课126 | 《规模》3:寿命的定数


    日课126 | 《规模》3:寿命...


    今天咱们继续说韦斯特《规模》这本书。

    经过上一讲的理论准备，现在我们就可以用生物体的基本标度率来推导出两个关键性质。一个是生长，一个是衰老。


    这两个问题似乎应该牵扯一堆生物学知识，但是决定性作用的其实是数学。


    我们有一个坏消息：不管科技怎么进步，人的寿命都几乎不可能显著延长。而你不需要特别复杂的指导就能理解这一点。


    今天所有的理论推演基本上只需要一个预备知识，就是我们上一讲的结论——


    # 新陈代谢率 α 体重^(3/4)


    # 1.生长


    你想过一个问题没有，为什么所有动物都是长到一定程度就不长了呢？小孩开始长得很快，成年以后就不再长高了，最多也就是胖点。韦斯特说，这完全可以用数学解释。


    生物获取的能量中，一部分被用于长得更高更大，一部分则是用来维护已有的身体。不同动物的体重千差万别，但是单个细胞的大小都差不多。生成一个新细胞和维护一个旧细胞要花费的能量是固定的。所谓体重大小，无非就是细胞个数的多少。


    所有细胞都需要维护，所以你在维护方面要花费的能量是跟你现有的细胞个数成正比——那也就是跟体重成正比。


    但我们知道，新陈代谢带来的总能量，也就是新陈代谢率，是跟体重的3/4次方成正比。正如上一讲说的，随着体重越来越大，你吸收进来的能量，虽然也在越来越快，但是他跟不上体重增长的速度。说白了。就是等着吃能量的细胞越来越多，供应的能量越来越跟不上了。


    那么早晚就会有一个时间，不管你吸收进来多少能量，会全都被用在系统维护上。那时候你就没有多余的能量去进一步增长，生长就停止了。


    上面这个过程可以用一个简单的数学模型描写。计算结果跟动物生长的实际情况非常吻合！下面是天竺鼠和母鸡的理论生长曲线和实际情况的对比——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_18_0.png)


    ![](img/a2c55447bc97d25d1622d2d734d5541b_18_1.png)


    刚出生的小动物几乎所有的能量都用在生长上了，等到它越长大，维护消耗就越高，留给生长的能量就越少，最后就是全部能量都用来维护身体，生长就进入了平台期。


    韦斯特还考虑了两个特殊情况。


    一个是肿瘤。因为肿瘤是寄生在身体上的组织，它的新陈代谢能力并不完全是由自身重量决定的，所以肿瘤能吸收更多的能量，它会长得更大。


    另一个是树。为什么树能越长越高？因为树长大之后，它外围的树干和树皮会变成枯枝，其中细胞已经死掉不再需要再维护了，但是枯枝也能给树提供支撑力量。等于说树是占了免费枯枝的便宜。


    不过标度率只能算出来不同动物生长的共性。韦斯特谈讲，为什么有些动物就能长得特别大，有些人就能长得特别高。动物个体之间的差异是怎么决定的呢？如果按照韦斯特的思路走，我理解，应该是遗传基因决定了一个生物*最初*的能量获取能力，而这个能力，又决定了它成年以后的身材大小。


    # 2.疾病可以避免，但是衰老....


    现在“抗衰老”是个热点，有不少科学家在搞研究，希望能大幅度地延长人的寿命，而很多人对此都非常乐见，特别是一些富豪在资助这种研究。既然科技简直到无所不能，延长寿命应该也能吧？


    可是我们冷静地研究一下数据，虽然过去这么多年来医学越来越发达，但是人的寿命其实从都没有得到大幅度的延长。


    过去的人均预期寿命低，并不是因为人不能长寿，而是因为过去婴儿死亡率特别高。如果排除掉夭折的婴儿，那即使是在古代，人也能活到挺大岁数。


    对一个生活在1845年的人来说，如果他已经活到25岁了，那他的预期寿命就会是62岁，这个的确不如今天——这是因为有些疾病当年治不了。但是如果这个人幸运地躲过了各种疾病，已经活到了80岁的话，他的预期寿命将是85岁。那今天什么情况？如果一个人已经活到80岁，今天的医学可以平均让他活到89岁。他只比1845年那个人多活四年而已。


    如果1845年有个百岁老人，那他预期还能再活一年零十个月。而今天的一个百岁老人，预期也只能再活两年零三个月。


    人类的寿命上限，从未真的得到过提高。


    韦斯特认为，人的最高寿命上线应该是125岁。医学再怎么进步，125岁也是一个不可逾越的界限。咱们来看一张图——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_18_2.png)


    这张图说的是各种年龄段的人死亡的主导因素。年轻人 ANSI 和中年人死亡，是因为遗传和各种意外疾病；60、70岁的人死是因为心血管之类的老年疾病；80多岁的人死是因为骨质疏松之类导致身体脆弱再遭遇跌倒之类的意外事件；而再往后，到90岁100岁的那个时候，人死，就不是因为什么具体的疾病或事件了，而是因为整个身体机能的衰竭。


    换句话说，哏怕我们把所有的病都给解决了，人还是得死。再看下这张表——


    | 死因分类 | 如果某种疾病得到彻底治愈，预期寿命的预计延长量 |

    |---|---|

    | 心血管类：所有心血管疾病 | 6.73 |

    | 癌症：恶性肿瘤，包括淋巴瘤和骨髓瘤纤维瘤、艾滋病等 | 3.36 |

    | 呼吸系统疾病 | 0.97 |

    | 意外事故及“副作用”（医院导致引起的死亡） | 0.92 |

    | 消化系统疾病 | 0.46 |

    | 传染病和寄生虫病 | 0.45 |

    | 帕金森引起的死亡 | 0.4 |


    比如说，如果所有心血管疾病都能治愈，人的预期寿命能够延长6.73年。如果医学特别发达，干脆把癌症都给彻底解决了、或者说干脆就没有癌症了，人的平均寿命只能多增加3.36年而已。


    为什么呢？因为死于癌症的大部分都是已经比较老的人。就算是不得癌症，他也老了。


    让人死亡的终极力量不是病，而是衰老。


    而衰老，是可以用数学算出来的。


    # 3.寿命的公式


    衰老的根本原因是细胞受到损伤。损伤有各种情况，这里我特别强调一点，就是在终端毛细血管和细胞之间的磨损。


    血液供给到细胞的过程中有一个粘滞阻力，会对毛细血管产生生物物理上的磨损。只要血液在流动，就有这个磨损——就好像轮胎一样，只要你开车就有磨损。


    可惜人体不是汽车。汽车轮胎磨损厉害了可以换轮胎，最起码向盘还是好的。而对人体来说，因为毛细血管遍布到全身每个角落，损伤是发生在全身的每一个地方。不是一个零件坏了，是身体所有零件都磨损了，是各项机能全面下降。


    下面这张图是人的几项身体机能随年龄的变化——'
