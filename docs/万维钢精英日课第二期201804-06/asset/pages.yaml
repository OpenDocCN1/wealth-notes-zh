    好，道理讲明白了，现在咱们考虑两个应用。


    # 2.为什么要造大船


    以前的人造船只是胡乱摸索，一直 zuo 一个英国工程师叫布鲁内尔（ Brunel），考虑了尺度分析，才意识到应该尽可能地造大船。


    布鲁内尔是这么想的。船的载货能力是体积决定的，跟船的尺寸的立方成正比。但是船在水面上受到水的拖曳力，则是跟船底的面积成正比。这也就是说，船要克服的航行阻力，是跟船的载重量的2/3次方成正比——如果你能把载重量扩大到10倍，你需要的动力只要是原来的4.6倍就可以了。


    船越大，每一吨载重量需要的动力就越低。这是再基本Directories? 这是最基本的规模经济！这就是为什么现在货轮和油轮都是尽可能地往大了造，越大越好。简单的尺度分析，就能告诉你这个道理。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_15_1.png)


    当然大船的工程力学跟小船很不一样，一开始人们并不如?怎么样造大船。后来人们发现，船在水里的运动特征，是由所谓“弗劳德数（ Fr）”决定。把公式写出来，


    ```

    Fr = U² / gL

    ```


    其中 U 是船速，g 是重力加速度，L 是特征长度。这个公式有啥用呢？有了它，你就可以在水槽里研究大船。你可以先做一个模型，而公式告诉你，你模拟的船速，应该跟模型尺寸的平方根，也就是1/2次方成正比。也就是说，你要模拟一条700英尺长、航速是20节的船，那你只需要做一个10英尺长，航速是2.5节的模型，就可以做实验研究了。风洞实验就是这个原理。这还是尺度分析。


    # 3.剂量和体重


    如果你家有小孩，你会注意到小孩吃的药，说说明书上给的剂量，都是由体重来决定的。如果你仔细看，你会发现建议的剂量往往是跟体重成正比。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_15_2.png)


    韦斯特不是医生，但是韦斯特告诉我们，所有这些煞有其事的剂量指导，都是错的。药物剂量根本就不应该跟体重成正比。


    韦斯特是这么考虑的。药物剂量应该由新陈代谢决定，而如果你考虑到生物体的能量网络传播，新陈代谢是跟生物的面积而不是体积成正比。也就是说，药物剂量应该跟体重的2/3次方成正比。


    那韦斯特说的有道理吗？比生物学家可是道理多了。


    我们知道 LSD 是一种致幻剂，算是一种毒品。1962年，有人想研究 LSD 对大象的影响。他们要给大象注射 LSD，但是不知道该给多少剂量。


    当时已知，猫使用 LSD 的安全剂量是0.1毫克，而猫体重是1公斤。大象的体重是3000公斤，研究者认为剂量应该跟体重成正比，就决定给大象注射300毫克 LSD。结果只过了一个多小时，大象就死了。


    这个研究居然发表在了顶级期刊《科学》（ Science）上。在韦斯特看来这是一个非常愚蠢的错误。使用 k=2/3 的标度率，大象的安全剂量应该是21毫克！


    所以我就想，给儿童用的那些药的剂量表，该有多么不靠谱。好在医学是个不精确的学科，感冒药到底应该吃多少，其实差几毫升也没什么大关系。k=2/3 的剂量指导只是韦斯特的一个推测，现在还没有更准确的理论——而我们看到，这个理论已经比生物学家心目中那个简单正比关系强太多了。


    你是不是感觉见识了数学的厉害。小学生学数学，各种场景稍微变一下，公式还是那个公式，这就是数学应用题。那什么叫物理呢？物理是在一个完全不同的领域，场景已经变化很大了，但是你还能看出它背后有一个相同的数学规律。这个发现内在数学机制的洞见，就是物理学。


    从四百年前伽利略的一个洞见开始，标度率可以用在建筑物上，可以用在船上，可以用在人体上。然后你把奥运会成绩拿过来一画图，跟伽利略的洞见严丝合缝。


    这就是为什么物理学家总是这么牛气。你感觉整个世界的规律简直是尽在掌握。这也是为什么，物理学能吸引这么多人愿意为它献出青春和终身。


