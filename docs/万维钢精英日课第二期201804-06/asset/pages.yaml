  md: '# 答读者问24 | 美国名校录取到底要看什么因素？


    为什么牛津、剑桥愿意招这么多中国学生，而HYPMS不愿意？牛津、剑桥也是像美国私立名校那样主要靠校友捐赠来支持的吗？


    我之前和一个出生在美国的华裔朋友聊哈佛限制招聘华裔，和华人家长们反对亚裔细分的事。她本科毕业于佐治亚理工学院，博士毕业于牛津。她认为华裔家长们“fight
    the wrong game”。


    美国顶尖私立名校不愿意招华裔是因为华裔学生毕业后的成就相对入学比例来说太低。而这背后的原因是美国社会没有为华裔的成功提供足够支持。家长们应该在这里fight，而不是去fight录取率。


    吴军老师能不能谈谈你的看法？


    # 吴军


    这个问题问得非常好！它其实包括了两个问题。第一个问题是为什么美国前五的名校（哈佛、耶鲁、普林斯顿、MIT和斯坦福）招收中国学生人数特别少，相比之下牛津和剑桥似乎对中国学生就友好很多。造成这个结果的因素主要有三条：


    +   1. 牛津和剑桥每年招收的本科生人数很多，两校加起来一年能有10000人左右，而美国上游五校每年加起来才7000人。因此，牛津、剑桥虽然从名气上讲和美国的五校在同一档次，但是录取要容易得多。


    +   2. 当然，即使考虑到招生总人数，美国HYPMS五校招收的中国学生比例还是太低了，因为这五校留给外国学生的人数本来就不多。英国的人口只有6000万，而美国是3个多亿，因此单靠英国的生源填满10000人，是无法保证质量的，于是它就要在欧洲和中国大量招收。


    而美国顶级私立大学那点名额，本国学生自己还不够分的，留给外国人的并不多。


    再加上拿中国护照，但是有绿卡，在美国上寄宿学校中国学生也有一些被录取的，但是他们在统计时被计算为美国学生，这就让真正来自海外的学生比例显得更低了。


    +   3. 和美国私立名校的招生方式有关。英国的牛津和剑桥虽然也要面试，考察学术以外的素质，但是学习成绩对录取的作用非常大。


    相反，在美国，学习成绩（特别是考试成绩），只是录取时要考量的诸多因素之一，很多其他因素也会起非常大的作用，甚至是决定性的作用。关于这一点，我在后面的内容里会介绍。


    至于牛津和剑桥的经费，主要还是靠英国政府的支持，它们收的学费不高，校友和富豪的捐赠相比美国的大学也不多。


    对第二个问题的回答其实和前一个问题的第三个因素有关。就是美国名校录取到底要看什么因素。


    在很多中国人看来，学校是学习的地方，学习成绩当然是最重要的因素。申请美国的顶级私立学校，学习成绩好不够。但是，学习成绩好的学生太多了，以至于最后靠一两分钟来判定哪个学生该被录取，哪个不能录取似乎也有一些问题。


    因此，站在校方的角度，在扣除了对弱势群体的照顾，剩下来的录取名额就要用于招收那些今后能够成才的学生。注意，是今后能够成才的学生，不是今天成绩最好的学生。这两件事有相关性，但是不能划等号。你所提到的华裔学生毕业后的成就相对入学比例来说太低，确实是美国名校不太愿意招收华裔学生的重要原因。


    以哈佛为例，它在历史上每年招收的亚裔学生，大约占到了总人数的20%~22%，这几年来上升到24%，但是在美国各行各业里，亚裔显然还没有占到精英人士的20%。


    相比之下，犹太人虽然也是少数族裔，但是他们在精英中的占比不低于在名牌大学中学生的占比。亚裔之所以没有能在精英中占到录取学生的比例，和他们不愿意付出有关。


    在美国，从政这件事对提高整个族裔的地位非常重要，但是要想在政界混出头，需要20年甚至更长时间的努力，在这20年间，没有什么经济利益可以获得，完全是在为同胞们做贡献，这种事情，过分精明但缺乏见识的亚裔是不愿意做的。


    美国名牌大学不愿意招收亚裔的另一个原因是亚裔总体来讲不愿意回馈母校，不愿意捐钱。善款对美国私立大学非常重要，这一在我《大学之路》中已经讲了，我以后在专栏中还会讲到。


    总之，亚裔要想在美国大学的录取中被公平地对待，一方面要不断要求权利，另一方面要愿意为学校、为社会做贡献。同样，我也希望在中国上了最好大学的读者朋友，能够多为母校，多为社会做点贡献。


    吴军老师，现在互联网技术这么发达，我在慕课网这样的平台付费听公开课，与精英大学里同样的课，应该可以拉近差距，或者主要差距在哟？


    # 吴军


    慕课和其 他公开课的平台是一个非常好的帮助大家接受精英教育的地方。但是，根据我的观察，不论学习的手段多么进步，新的技术让学习变得多么容易，想学的人还是会学，不想学的人还是不学。慕课对于那些想通过自己努力不断往上走的人非常有效，但是对于那些不想花费时间和精力，只想收获成功的人，没有半点帮助。


    在历史上，不断有新的技术手段让获取知识变得容易，比如过去有电视教育、教学软件，等等。但是，世界上依然同时具有对知识如饥似渴的人，以及懒得学习的人。


    对于后者，任何好的技术手段都解决不了问题。更可悲的是，各种方便学习的 技术手段，不仅不能缩小大家在学识上的差距，反而把这个差距给拉大了。


    因此，我认为普通人和精英最大的差距在于学习 的意愿，而不是条件或者手段。'
