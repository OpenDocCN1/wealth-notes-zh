  md: '# 日课169 | 《为什么》 8:AI的自由意志（完结篇）


    今天咱们把朱迪亚·珀尔的《为什么：因果关系的科学》这本书讲完。我们使用了各种科学方法研究因果关系，但是说到一万，因果关系是一种主观的观点。也许在最底层的原理上，因果是一种幻觉。


    但是因果是一个非常有用的幻觉。那么今天我们就把因果这个幻觉和人的另一个幻觉联系在一起。


    那就是自由意志。


    # 1.幻觉和幻觉


    什么叫自由意志呢？简单地说就是你有没有选择权。比如现在我建议你，在一分钟之内，摸一下自己的鼻子。


    人生在世有许多行动是不得已而为之，但是关于现在要不要摸鼻子这件事，你完全可以自主选择，没有任何人能左右你的决定。你可能一开始想摸，但是故意要跟我作对，所以不摸——然后你还可以突然决定摸，让我完全想不到。你摸、或者不摸，都在自己的一念之间。


    仔细体会一下这个决定。你显然，拥有，自由意志。


    可是从另一个角度来说，你显然没有自由意志。


    人无非就是一堆原子，而原子都受到物理定律的支配。人身上并没有什么能超越物理定律的东西，人的一切行动，都符合物理定律的预期。


    如果不考虑量子力学效应，那么在牛顿那个机械世界，物理定律已经事先决定了你的一切。整个宇宙的演化一环套一环分毫不差，你摸鼻子还是不摸鼻子，这个动作早在宇宙创生的时候就已经定下来了。


    考虑到量子力学效应，机械宇宙的决定性就没了，这个宇宙里有一些天然的随机性。现在没有任何证据表明大脑思维过程里有量子力学效应。如果有的话，你的一些决定就是完全随机的，是物理定律也预测不了的——但是你也控制不了。量子力学的随机性不受任何力量控制，摸还是不摸鼻子这件事仍然不是“你”说了算的，你还是没有自由意志。


    神经科学家打开人的大脑，里面一切行为都是电信号，你的决定无非就是对各种输入信息的反应，是生物学上的机械化过程。人，只是一台机器。


    所以不管你有自由意志的感觉多么强烈，这种感觉都是幻觉。


    不过现在也有很多人，包括珀尔本人在内，认为实际上没有自由意志和感觉上有着自由意志这两件事并不算矛盾。它们是在不同层面上的事儿。在脑神经科学的层面上人没有自由意志，但是在“认知”这个层面上面，我们可以说人的确有自由意志。


    自由意志，是一种感觉特别真实的幻觉。


    其实因果关系也是这样的。我们说吸烟→肺癌，但是我们知道烟草没有自由意志。在物理定律的作用下，烟草产生了焦油，焦油接触人的肺，肺产生病变……所有这一切都是自然现象，归根结底是人观察生活总结的规律。


    从纯逻辑角度说，经验就只是经验。也许在未来的下一秒整个宇宙的物理定律就都变了，逻辑并不能完全否认这种可能性。我们说有因果关系，我们说发现了什么机制，其实都是对世界做一个强烈的假设而已。


    不谈因果只看数字，就是被动接受信息、不作任何假设。我们谈论因果关系、谈论一件事情的“解释”，就是对世界做出了一些主观的假设，然后根据这些假设去做出预判。这更是积极主动的姿态。因果关系可以说是大脑的一种思维快捷方式。


    因果可能是一个幻觉，但是它作为思维快捷方式很有用。那自由意志，也是一种有用的幻觉吗？自然选择为什么要让大脑产生拥有自由意志的幻觉呢？


    这个问题，事关要不要让 AI 也有自由意志的幻觉。


    # 2.交流的需要


    自由意志的感觉到底有何用呢？珀尔的看法是它首先有利于交流。


    有自由意志，才谈得上有“动机”，而动机提供了对行为的解释。比如恋爱中的一对男女，女孩问男孩你为什么要送花呢？男孩说这是为了向你表达我的感情——女孩一听很明白。男孩如果说这是我的脑神经系统对你的信号的一系列综合反应的结果，女孩未必能听明白。


    我有自由意志，在众多的选项中我先选择了这个动机，然后才谈得上据此去做理性的说辞。价值观总是在方法论之前，你总要先知道自己想要什么，再用理性研究怎么做。然后你还可以使用反事实分析，说我当时如果克制了那个愿望，也许现在会有更好的结果。


    珀尔还特意举了一个踢足球的例子。阿根廷队比赛结束之后，教练跟梅西说，当时那个情况你不应该把球传递给德玛利亚，你应该给阿圭罗。这句话就已经假定了梅西有自由意志。教练和梅西都明白这么做是为了赢球，赢球的动机不变，现在只是要做个小调整，为了获得更好的进攻机会。短短一句话背后有太多心照不宣的默认动机。


    可是如果假定梅西没有自由意志，你要表达这么一个意思就非常困难。教练需要调动梅西的整个软件系统，把当时场上的情况、以及所有类似的情况的优先级赋值都调整一遍。教练会感到很麻烦，梅西会感到很茫然。


    所以珀尔说，从交流的效率考虑，如果将来要搞一支机器人足球队，这些机器人最好有自由意志的幻觉。自由意志会让他们的表现更好。


    更重要的是人跟 AI 的交流。就算是 AI 可以使用一种特别复杂的机器语言互相对话、不需要有自由意志，但是人需要啊。当一个人跟 AI 说话的时候，他还是假定
    AI 有自由意志。AI 需要自由意志的幻觉才能理解人的意图。


    # 3.怎样才算有自由意志


    对人来说，自由意志的好处不仅仅是交流。时刻提醒一下自己有自由意志，可以让我们做出更好的选择。


    比如说有个烟民，抽烟已经形成习惯了。如果他在毫无意识的情况下，从口袋里掏出烟就抽，那我们可以说他在这件事上没有表现出自由意志。他是抽烟的机器，他是烟瘾的奴隶。


    但是如果这个人把烟拿出来之后，突然停顿了一下，*意识到*自己现在有个“想抽烟”的动机，他就开启了自由意志。


    他马上就可以反思这个动机！他可以想到，如果我现在不抽烟，改成吃个苹果，会不会有更好的结果呢？


    珀尔据此提出了一个标准。如果一个 AI 知道自己当前的动机是要做 X=x0，同时它能评估一下，说如果换一个选择，做 X=x1，结果会不会更好，那么我们就可以认为这个
    AI 有自由意志。


    自由意志 = 意识到自己的动机 + 考虑不一 样的行动


    人在行事过程中如果能表现出自由意志，他就能够独立自主、他就能自己控制自己，他就值得尊敬。AI 如果有自由意志，它就可以算得上是“强AI”。珀尔说，目前还没有任何一个
    AI 程序有这样的功能。


    好，那怎么才能让 AI 有自由意志呢？它需要具备三个特点。


    # 第一，它需要一个关于世界的因果模型。


    比如你家有个机器人。有天晚上你正在睡觉的时候，这个机器人想要打扫房间，它拿着吸尘器就开始吸尘，把你给吵醒了。你就跟它说：“下次不要吵醒我！”


    这个机器人需要有个因果模型才能理解你这句话。它得知道吸尘会导致噪音，噪音会吵醒你，吵醒你会让你不高兴。


    它还得会干预分析和反事实分析。它得知道虽然你说了这句话，但是白天它还是可以吸尘。它得知道晚上你要是هُ不在家，它可以吸尘。它得知道如果这个吸尘器是绝'
  merge: -1
  img_proc: true
- pgno: 139
  md: '可以吸尘。它得知道如果这个吸尘器是绝对静音的，你就算在睡觉它也可以吸尘。只有因果模型才能帮它做出这些灵活的处置。


    # 第二，它需要把自己也当成环境的一部分，考虑自己跟环境的因果互动。


    一个有意思的论断是机器人永远都无法100%预测自己的行为。为什么呢？因为你要精确预测自己的行为，就得把自己的程序跑一遍——可是你本来就已经在跑自己的程序啊！你不可能开一个子进程，这个子进程里又包括了全部的你——你不能自己嵌套自己！否则就是无限循环。


    所以 AI 需要一个关于自己的因果关系模型。他对自己的行为特点、对自己的动机可能会产生什么结果有一个基本的蓝图，这样它才能把自己和环境综合考虑。


    # 第三，它还需要一个记忆系统。他得知道自己以前的那些动机都导致了什么样的后果，这样他才能从错误中学习，他才能对自己的行动负责。


    这是一个宏伟蓝图！过去三十年間，学术界爆发了一场因果革命。我们介绍了有关因果关系的科学。对于观察、干预和想象这三种因果问题，也都有了办法。我们的讲解重点强调了珀尔的功劳，但是珀尔在书中介绍了很多科学家的贡献。现在珀尔的学生们正在致力于把因果分析算法化，让
    AI 能够根据因果关系模型自动去回答三种问题。


    一个有自由意志的 AI，算不算就有了意识呢？算不算就“活了”呢？我总觉得还不算。但是珀尔对强 AI 非常乐观。现在如果只论因果关系，至少底层的理论都已经有了。


    至此《为什么》这本书就给你讲完了。我们绝大多数人并不打算研究人工智能。但是我们可以把 AI 当做一面镜子：现在你应该对自己，有了更深的认识。


    （全书完）


