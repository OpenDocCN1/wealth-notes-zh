  md: '# 日课128 | 《规模》4: 为什么城市越大越好


    日课128 | 《规模》4: 为什...


    今天咱俩继续说韦斯特的《规模》这本书。这本书的主题是讲一个数学的硬道理：尺度决定了一个组织的最关键限制。


    比如我们上周讲了生物体的尺度分析，就是体重几乎决定了一切，包括寿命——而一个生物物种有多聪明、多么爱锻炼，都只能起到微调的作用。


    今天我们要把这个分析方法使用在城市上。城市，也是规模几乎决定一切。大城市和小城市很不一样。


    前面我们讲到，生物体有两个关键的标度率：能耗和体重的3/4次方成正比，而力量和体重的2/3次方成正比。这两个都是次线性关系，也就是说，生物体重越重，它的单位能耗和单位力量都会越小。


    对养猪吃肉来说这是一个好消息，这意味着猪越大，就越省粮食！可是如果你想让这个动物干活，这不是一个好消息，因为动物越大，它的相对力量反而更小，最后可能根本都撑不住自己的身体了。说白了就是如果养猪吃肉，猪越大越好；但如果养马拉货，那养一匹肥马，还不如养两匹瘦马。次线性关系就是这样的——并不总是越大越好。


    # 1. 城市的标度率


    我们直观地感觉大城市和小城市很不一样，比如大城市更拥挤、创新能力更强、可是污染和犯罪也更严重。小城市是宁静的，生活节奏缓慢，好象很舒服——但是创新能力似平不行，好的工作机会太少，以至于年轻人还是愿意往大城市跑。那到底为什么呢？难道是因为城市管理水平的问题吗？其实是尺度问题。


    大城市之所以有大城市的各种特点，就是因为大城市足够......大。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_26_0.png)


    人口越多，加油站就越多——但是加油站的增长比人口慢。这四个对数图基本上表 现了同一比例关系：加油站数，和人口数的0.85次方成正比。


    这是一个"次线性"关系，意味着城市规模越大，人口越多，人均所需要的加油站数就越少。这使我们想起了生物的新陈代谢率，我们记得，代谢率是和生物体重的3/4次方成正比。生物的"3/4"是来自自管的分形结构，那城市的这个"0.85"，又是怎么来的呢？


    还不仅仅是加油站。更多的研究表明，城市的道路总长度、水电和煤气管道总长度，也和人口的0.85次方成正比。总而言之，我们可以说——


    # 城市基础设施 ∝ 人口⁰·⁸⁵


    这是一个好消息，意味着大城市比小城市更节省基础设施！而更好的消息是，城市的产出和规模是个超线性关系。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_26_1.png)


    ![](img/a2c55447bc97d25d1622d2d734d5541b_26_2.png)


    它们也表现为相当整齐的标度率，但是这个幂率可就不是0.85了，而是1.15——


    # 城市产出 ∝ 人口¹·¹⁵


    这意味着城市产出的增长比城市规模的扩张快。


    城市人口规模扩大100倍，基础设施只需要扩大50倍，而城市的产出，却扩大了200倍。


    所以说城市越大越好。如果让物理学家当总理，他的战略肯定是尽可能地发展大城市。让农民进城、让城市变大，是提升经济最快也是最环保的办法。


    # 2. 人与人的连接


    韦斯特在书中对城市的两个标度率只给了泛泛的解释。简单地说就是城市产出是由社交网络决定的，而城市的基础设施则是另一个网络，这两个网络都具有近似分形的结构，两个网络互相制约，形成了两个标度率。'
