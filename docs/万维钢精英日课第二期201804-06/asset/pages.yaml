  md: "# 日课154 | 你在潮流的位置\n\n日课154 | 你在潮流的位置\n\n现在有个流行概念叫“信息过载”。如果你对流行概念没有信息过载，你肯定知道这个词的意思是说面对互联网时代海量的信息，人们有一种恐慌感。你可能还说过关于信息过载的解决方案，比如说使用某种过滤信息的机制，比如看信任的人推荐的信息。\n\
    \n我的信息没过载。互联网信息并没有让我恐慌，我只恨信息太少。我认为“信息过载”是个不需要解决的伪问题。\n\n我妻子有时候会给我造成信息过载。比如我们一起做家务活，她喜欢指指挥我。有时候我正在切菜，她又给我分配倒垃圾的任务，我说你能不能一次只给我一个任务！这种情况是真正的信息过载。向一个决策系统同时输入太多信息，它就会无所适从。战斗机飞行员有时候会信息过载，他不能同时处理太多的紧急信号。\n\
    \n pero要说知识类的信息，对世界上某个领域的认识，那所谓信息过载只是人的认知初级阶段的表面症状而已。\n\n以前印刷术刚刚在欧洲普及，市面上一下子出现了大量廉价的书籍，就有学者担心信息过载——当然那时候不一定是这个名词。学者心想，这么多书可以读，一天到晚都读不完，人可怎么办呢？\n\
    \n# There's No Such Thing.\n\n![](img/a2c55447bc97d25d1622d2d734d5541b_97_0.png)\n\
    \n# As Too Many Books...\n\n而现在我们正在适应互联网。《李翔知识内参》去年有一篇文章叫《皮尤报告：谁会害怕信息过载？》，其中就提到现在感觉信息过载的人已经比十年年前少了，而且还是以受教育程度低的人和老年人居多。大部分年轻人并不因为信息多而恐慌，反而是拥有的信息接触路径越多越从容。\n\
    \n可问题是，明明有这么多书没有读，有这么多文章看不过来，怎么还能不恐慌呢？答案是如果感到恐慌，那是因为你看的还不够多。\n\n比如说，在“国产电影电视剧”这个领域，我相信任何人都会有信息过载的感受。我国每年生产无数影视作品，可是我国观众翻来覆去找不到几个好看的。当然现在影视剧的水准确实不高，但是别忘了，八十年代电视机刚刚普及的时候，可是不管什么节目都能让全家老少关了灯一起看。\n\
    \n这是因为现在我们看的太多了。再比如说足球，世界五大联赛再加上中超都是值得看的，天天看也看不过来，可是并没有哪个球迷因为没看全而感到恐慌。还有好莱坞电影和美剧，一开始就好像打开了一扇大门一样看着什么都是好东西，真是有些信息过载的感觉，现在也都淡定了。三十年前的留学生有个词叫“文化冲击”，说中国人刚到美国会觉得什么都不一样，感到不适应——现在这个词已经没人用了，中国有些地方比美国还像美国。\n\
    \n不管是什么领域，看多了，就不恐慌了。绝大多数内容，你不看都知道它大概能给你带来什么——通常是并不能带来什么。\n\n那在读书和学术研究这些领域，也能达到“我看的太多了”这种境界吗？其实并不难。你要更致力于学问，你很容易就能达到这样的境界。我来给你分解一下这个路线图。\n\
    \n我们专栏以前讲过，信息就是意外，而喜欢 = 熟悉 + 意外。到底是过载、喜欢还是饥渴，取决于你遭遇了多少意外。这条路一共有四个阶段。\n\n# 第一阶段是信息过载。\n\
    \n比如现在有个研究生，学习成绩非常好，基础知识很扎实，但是从来没做过研究。有 - 一天他终于拿起一篇真正的论文，发现看不懂。他去参加一个学术会议，发现这么多报告都是他从来没听说过的，与会者这么多人他几乎都不认识。他感受到了信息过载，心中充满恐慌。\n\
    \n# 第二阶段是发现联系。\n\n# 第三阶段是把握潮流。\n\n# 第四阶段是等待惊喜。"
