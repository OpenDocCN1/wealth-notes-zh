  md: '# 答读者问 | 侯宝林听梅兰芳讲京剧


    答读者问 | 侯宝林听梅兰芳...


    # 来自日课: 贝叶斯的方法


    信念和证据，到底谁是因，谁是果呢？因为有了这个证据，不断强化或改变我的信念。这也不可以说证据是因，信念是果吗？


    万维钢


    这个问题很有意思。假设现在有一种药，患者服用之后有的人病好了有的人病没好，我们要通过治愈率判断药效。在这件事情上，肯定这个药是因，治愈率是果。治愈率并不能影响这个药本身。我们说的“假设
    → 证据”这个因果关系，其实说的是“药 → 治愈率”。


    药本身不变，变的是我们对药的观点。比如小明同学观察了治愈率，使用贝叶斯公式更新了对这个药的看法，那么的确存在一个“治愈率 → 小明的观点”这个因果关系，但这是另外一个因果关系，小明的观点
    ≠ 药。


    我们在文章中（包括珀尔在书中）说的这个“假设 → 证据”中的“假设”容易引起歧义。我们研究的目始终是药本身，这个缘故是不变的，它不受证据或者观点的影响。观点只是在不断逼近这个缘故。贝叶斯公式针对的因果关系其实是“药
    → 治愈率”。


    # 来自日课: 六个判断力层级


    为什么说B是一个碰撞结构，阻挡了信息，不需要控制变哗呢？为何控制了一些因素反而会带来干扰呢？能不能举一个具体例子吗？


    万维钢


    我先来说明一下为什么碰撞结构中间节点不应该做控制变量，这个例子来自珀尔书中。我们假设演员的名气一方面取决于演技，一方面取决于美貌。画成因果关系图，就是： 演技
    → 名气 ← 美貌


    这就是一个“碰撞结构”，两个箭头同时指向了名气。在一般的因果关系图上看到这样的结构，如果图上演技和美貌之间再没有别的连接了，那么这两个相对的箭头，就说明演技和美貌是相互独立的两个变量，我们没有假设它们有相关性。


    也许自然界中有个什么规律，长得好看的人普遍演技也好，也许没有，也许是相反的规律，你可以做数据分析去研究。那么如果你想做个数据分析，看着演技和美貌之间有没有相关性，是否应该对“名气”这个变量做控制呢？你不应该。


    如果你要控制“名气”，这就意味着你是研究“在一定的名气之下”，演技和美貌的关系。比如我们只考察名气大的明星。已知这个明星的名气非常大，那么如果他的演技不怎么样，你猜他长得怎么样？他肯定拥有超凡的美貌！因为你已经假设了名气来自演技和美貌，演技差还名气大，只可能是特别美貌。同样道理，如果这个明星长得不怎么样，他的演技就肯定是很好的。


    本来，对所有人来说，演技和美貌之间也许并没有什么关系。但是因为你控制了名气这个变量，演技和美貌有了个负相关！


    控制变量的目的就是为了防止相关性的传递，而碰撞结构已经自动阻止了相关性传递，所以只要这个路径中有碰撞结构，就不应该再控制其中的变量。


    咱們再举个例子。你想研究“吸烟（X）”和“肺癌（Y）”之间的关系，其中你考虑了“遵守社会规范（A）”、“开车系安全带（B）”、“重视个人健康和安全（C）”这三个变量。这些变量的因果关系图是下面这样——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_135_0.png)


    其中 B 处，是否系安全带，就是一个碰撞结构。从X开始有个左箭头（X←），所以这是后门路径。但是因为 B 处的碰撞结构，这张因果图不需要控制变量。


    如果你强行考察“不系安全带”的人，你也许会发现一些不怎么吸烟却得了肺癌的人 —— 而这个结论绝对不代表吸烟和肺癌的一般关系，因为这些可能是不重视自己的健康但是非常遵守社会规范的人。


    对老百姓来说，是不是有答案比答案是否正确的更重要？比如像一种保健品、一种药酒是否有效这样的问题，感觉、经验、权威都不可靠，普通人怎么判断呢？


    万维钢


    普通人不可能自己去做实验，也不可能人人都去研读学术论文。但是如果社会上很多人都知道用什么方法才能得出靠谱的结论，形成一个科学的价值观，整个局面就会很不一样。


    比如一般人去超市买菜的时候并不会特别在意是不是有什么东西涨价了，也不容易看出来这家卖的是不是比别家贵。但是总有一些对价格很敏感的人会注意到。他们不但自己注意，而且还会大声说出来。他们要是发现哪个商品过期了还在卖，甚至能给捅到媒体上去。


    这些人就是“吹哨人”。如果公众有科学素养和正确的价值观，当有人吹哨的时候就能做出正确的反应。


    公众需要可靠的信息渠道。如果一个社会的公众认为一切都不靠谱，什么媒体、什么专家说的都不可信，那么这个社会就有问题，说明社会一盘散沙。合理的局面，是公众相信，科学方法得出的结论是最可信的，专家的意见是科学的，主流媒体的话不是随便说的。公众有这样的价值观，才是成熟的社会啊。


    # 来自日课: 到底应该怪谁？


    按照这样的逻辑推理，以后就不需要辩护律师和法官这样的角色了吗？AI就能够机械地<|start|>定了？


