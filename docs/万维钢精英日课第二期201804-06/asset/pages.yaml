  md: '# 日课127 | 意识上传者最后的问题


    日课127 | 意识上传者最后...


    昨天讲托斯�特的《规模》，我们认识到，想要通过身体改造的方法大幅度延长寿命，应该是不太可能的。衰老是全身所有地方的全面衰老，就算是主要器官替换了，别的地方还是在衰老。就算把胰子以下的身躯全换了，因为大脑也是肉长的，大脑还是衰老了。


    那么就有几位读者，比如“yanyu”，提出，用上传意识这个方法实现永生，到底靠不靠谱。这个问题不是科幻畅想，现在有科学家在专科研究把大脑意识上传的方法，有专门的研究项目、甚至还有创业公司在做这件事。


    有个俄罗斯超级富豪叫德米特里·伊茨科夫（Dmitry Itskov），非常相信未来30年之内就能解决意识上传的问题。他专门投资赞助了这方面的研究项目，准备未来上传自己的意识。他请到了非常高秤的脑神经科学家在做这件事[1]。


    人的意识再神秘，也只不过就是一堆信息而已，身体只不过是这堆信息的一个载体。那既然是信息，就一定有办法让它换个载体。身体老化了，把意识上传到计算机上，甚至于脆上传到便于维护的人形机器人上，这不就永生了吗？


    人脑跟我们用的计算机其实非常不一样，记忆和思想都是以神经元连接的方式存储的 —— 也可以说，都是*长*在肉上的。精确复制每个神经元是不太可能的，任务量实在太大，现在科学家的思路，是复制神经元之间的网络连接，这个镶嵌结构。


    在复制人脑神经连接之前，科学家先要能够复制更简单的脑结构 —— 比如说，一只苍蝇的大脑神经元连接。这个大约定已经可以做现了。现有的技术复制一只苍蝇的大脑大约需要花两年时间。这么慢的速度要复制人脑肯定不行，但这毕竟是一个很好的开始。


    但是有人提出，大脑是个动态的过程，脑神经元每时每刻都在发生变化，有的还是很剧烈的变化，所以光复制神经元连接还不行，还得能复制神经元的活动才行。这方面也有进展，毕竟现在科学家已经能够实时观测大脑神经元的大规模集体活动。


    但即使你能够精确读取神经元的所有连接结构和活动，也未必能实现准确复制。我们设想，换一个存储的地方，毕竟跟原来的大脑有所区别，那你总要舍弃一些信息，保留有用的信息。可是你怎么知道什么信息有用什么信息可以舍弃呢？归根结底是我们现在对意识是怎么产生的几乎一无所知！


    所以我认为意识上传是一个非常非常难的目标，涉及到科学原理和技术实现，我完全不相信30年能解决。


    但这些都不是我今天想说的重点。我想说的是，就算真的能完美上传意识，你还是有一些根本的问题。


    咱们干脆假设一下，50年后，上传意识的技术已经完美实现。有家公司就专门提供上传意识的商业服务。那时候的你大概七八十岁，是个亿万富翁，完全有能力购买这项服务。


    三年前，你的妻子就把意识上传到一个仿生机器人的身体中了。这个新身体是根据她年轻时候的形象打造的，整个上传非常完美，你现在等于跟年轻时的妻子生活在一起。一开始你对这个技术比较怀疑，所以你迟迟没有上传。


    但是三年下来，你觉得这个年轻版的妻子没什么问题。她记得你们二人所有共同的记忆，你们相处得还是那么默契，她等于是不缝地重新嵌入了自己的生活。当然区别也是有的，那就是现在妻子的精力比以前好多了，重新开始喜欢年轻人的东西，每天都充满活力。你们一起出门，别人都以为她是你女儿。


    与此同时，妻子对你老迈的身体越来越不满，她强烈要求你赶紧上传意识。她甚至已经定制了一个年轻版的你的身体。结果80岁生日这天，你决定也上传意识。


    接受意识扫描的时候，你躺在手术台上，被全身麻醉。你感到有点不安，但你知道一觉醒来之后你就会重返年轻。你看着医生们忙着准备仪器，心中充满期待。在昏迷之前，你好像听见一个医生的电话响了。


    ......


    再次醒来的时候，你迷迷糊糊，听到有个好像特别遥远的声音说道：“你醒了！欢迎回来！意识上传非常成功，恭喜您开始新的人生！”


    哈！成功了！你非常高兴，迫不及待地抬起手来，想感受一下自己的新身体。


    一开始你的手好像有点不听使唤，你觉得这很正常，毕竟新的身体需要适应。你终于把手抬起来了......可是你看到的却是一只老人的手 —— 那是你自己的手。


    不对啊！我怎么还在这个身体里？不是说意识上传成功了吗？


    就在这时，你听见一阵脚步声向你走来。一个年轻的声音 —— 那好像是年轻时的你的声音 —— 说，“让我看一眼我的老身体！哈哈，还从来没用第三人称的视角看过！”


    你刚要喊出来，就听见一个声音说道，“那边怎么回事？小王你赶紧处理一下！......啊 您先等一下再看吧，我的工作人员要把尸体稍微处理一下。”


    你看到小王医生手忙脚乱地向你走过来，手里拿着一个注射针头。小王医生，好像就是你昏迷之前出去接电话的医生。


    你突然明白这是怎么回事了。


    你妻子上传意识的时候，医院告诉你们，一旦意识被上传到新的身体上，原来的身体就没有用了。你还特意给那个身体买了一个墓，“下葬”的时候你还有点伤感 —— 尽管你妻子并不觉得有什么不好。你妻子把你这个老身体的墓也安排好了。


    你突然想到，既然是扫描复制，就好像把计算机的信息上传到另一台计算机上一样 —— 那原来的计算机上应该还保留了这份信息啊！这不等于两个你了吗？难道他们每上传一份意识，就要主动*杀死*原来的身体吗？


    意识上传是成功了，但是小王医生因为接电话，忘了在扫描信息之后把你杀死！所以现在有两个你。


    你的妻子其实已经死了。三年来跟你生活在一起的，其实是她的一个复制品。如果你也死了，那就是两个*机器人*继承了你们的财富，他们会替你们享受生活和你们子孙的爱戴。在外人看来，这和你们两个换了新身体没有任何可观测的区别......


    小王已经给你注射完毕。在完全失去意识之前，你想到了最后一个问题 ——


    拥有我的全部意识，难道就是我吗？


    这个故事不是危言耸听。我们要严肃面对上传意识，就得面对这个问题。有一种观点 [2] 认为这并不是什么新问题，因为所谓“自我”，可能本来就是一个虚幻的概念。


    此时此刻的你，和五岁时候的你，难道真的是同一个人吗？组成你的原子已经几乎全都换了很多遍了，你现在的所思所想跟当年完全不同，你甚至都没有保留多少当年的记忆！你们之间不过是一个连续的变化而已。那将来上传意识，那个生活在机器人体内的你，跟现在的你，不也是相当于连续的变化吗？


    你完全可以认为五岁时的你不是你，而机器人体内的你就是你。佛学说“无我”，你又何必在乎哪个是真正的你呢？


    这么想固然可以，可是我们看到，如果意识可以复制，那就完全可以复制出来很多个你，甚至可以跟“原本的你”共存 —— 而这就意味着，上传意识并不能解决怕死的问题。


    是，你的意识被复制了。可是原本的那个你，还是得死。


    我以前读过一个科幻小说，说未来有一种瞬间移动装置，可以在这里扫描一个人的全身，把信息用光速送到另一个装置，在那里重新合成这个人。那个科幻小说的设定不会出现两个人共存的问题，因为某种...'
