  md: '高尔顿意识到，根本就没有什么是特殊力量。


    他考察英国男子身高和手臂之间的关系，发现身高特别高的人，手臂也很长——但是他们的手臂并不是最长的。这就好像最聪明的父亲没有生出最聪明的儿子一样。手臂相对于身高，也出现了回归平庸。


    那咱们想想，父亲跟儿子之间也许有因果关系，身高跟手臂之间似乎不太可能有因果关系啊。


    更进一步，父亲相对于儿子，也有一個回归平庸！如果你先看儿子身高，那些最高的儿子，他们的父亲的身高也不是最高的。显然儿子身高并不能决定父亲的身高，这个关系肯定不是因果关系！


    高尔顿把这种关系叫“相关”。这就是“相关性”这个概念的起源。高尔顿是第一个意识到“相关不是因果”的人。


    儿子出生的时候父亲已经成年了，儿子身高总不可能影响父亲的身高，所以绝对不可能有什么神秘力量，决定了从儿子到父亲的回归平庸。


    今天我们管这个现象叫“回归平均（regression toward the mean）”。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_114_0.png)


    # 3.回归平均


    丹尼尔·卡尼曼在《思考，快与慢》里，对回归平均有个很好的解释。想要理解回归平均，你得理解下面这两个公式——


    成功 = 天赋 + 运气


    大成功 = 多一点点天赋 + 很多好运气


    你得承认运气的作用。


    具体到身高来说，我们的身高有一部分是直接继承了父母的基因，还有一部分是遗传基因的排列组合、跟环境的相互作用影响到基因表达，这些过程中发生的一些运气。


    高个父亲不但有好基因，而且有好运气。基因可以遗传，可是运气不能遗传。好运气总是非常罕见的，所以大概率下，儿子不会有那么好的运气——所以儿子的身高就不如父亲。


    这就好比说如果父亲的财富很大一部分是来自买彩票中了大奖，我们容易理解，儿子将来不会像父亲一样有钱。比如中国有一句 transmit。


    # 4.回归平均种种


    我给你举几个例子。一个电影大获成功，于是就出了续集。可是续集的票房往往不如第一部高，这是什么呢？很多人就说续集没有好看的，都是为了赚钱狗尾续貂！


    # 5.Reason 和 Cause


    说到这儿我想辨析两个英文单词，“reason”和“cause”。这两个词的意思差不多都是原因，但是你细品的话，它们有重大区别。


    所谓 reason，是说对这件事的解释。比如你问我某个电影的续集为什么票房不高，我说这是回归平均，这个事儿有一个解释。


    而 cause，则是导致这件事的另一件事。你现在为什么感到有点饿，因为你没吃早饭。Cause 就是“因果关系”里面那个“因”，我们这里统一翻译成“缘故”。


    # —— 谚语 ——


    我觉得有几句中国谚语，好象说的都是回归平均的事儿——

    他当年是神童，现在混然回归平均矣。

    眼见他起高楼，眼见他宴宾客，眼见他回归平均。

    出来混，迟早要回归平均。

    黄秋生：当影帝三年回归平均。

    球队连败之后终于赢了一场：谁家过年还不回归平均一次。

    绣疚过后是回归平均。

    花无百日不回归平均。

    不在乎天长地久，只在乎回归平均之前。

    ……最是人间留不住，朱颜和花都得回归平均。

    你还想起哪些话，其实说的是“回归平均”？快来留言区分享一下吧：）'
