  md: '# 日课137 | 《超越曲棍球杆的战略》3:命运配方


    今天咱们继续说《超越曲棍球杆的战略》这本书。上周我们讲了好的战略要往外看，好战略要能在利润分布图上给你一个好位置。今天我们要讲的是这本书最重要的内容，是麦肯锡这几位研究者的一个关键研究成果：一个好战略的配方。


    而在我看来，这个配方并不仅仅适合公司战略。我们可以从中获得一点关于命运的启发。


    我们在预告里说过这本书的一个特色是它带有一点科学的味道。这个味道，来自于研究者使用了量化分析的方法。


    # 1.战略要量化


    讲公司战略的书实在太多了，比如十几年前就有本非常著名的书，叫《从优秀到卓越》（Good to Great），等等。每本书都有一套战略学，还可能有各种流派，每个流派都能找到大量的成功案例。你还可以看各路名流演讲，马云昨天晚上又说了什么、杰克·韦尔奇和乔布斯当年是怎么说的，你还可以读他们的传记……这些都可能让你学到几招。


    你不用担心会的招少，问题可能在于现在招太多了。


    仔细想想的话，大师们说的都挺含糊。这个也重要、那个也重要，那到底哪个更重要呢？在实际操作中我怎么设定优先级呢？你说创新重要、领导力重要、人才重要，市场也很重要，那就等于说这些都不重要。有时候道理越多好像还越不容易做好这一生。


    而且他们说的有些东西也不管用。比如韦尔奇，说选对领导人对公司非常重要。他把领导人分成五等，说一定要选第五级的人才行。结果韦尔奇大张旗鼓地选了一个接班人，这个接班人领导通用电气16年间，公司表现可以说是ologien。…


    再比如你考察那些流行战略书中列举的作为榜样的公司，在书出版10年之后，这些公司中只有一半，表现超过了市场平均水平。那些战略家自己都没准确判断那些公司的战略最好使。


    而麦肯锡这三位并不出名的研究者，使用了一个新方法来研究战略。他们考察了2393家大公司15年的数据，看着它们到底做了什么，到底是哪些因素影响了它们在利润分布曲线图上的变动。


    研究者先人为选取了40个参数，然后用数据分析证明，其中有10个参数是真正重要的。他们用这10个参数建立了一个数学模型。有了这个模型，研究者再把这些公司10年前的数
    据拿过来，假装不知道后来的情况，用这个模型根据当年的表现来做“预测”，看看比如说哪些公司能从平庸区跃进到明星区，再跟真实表现对比，结果发现这个模型的准确率达到了86%。


    86%这个结果在我看来没啥稀奇。因为你这个模型的 参数本来就是用这些数据“喂”出来的，它算出来的结果当然应该符合这些数据。想要证明模型真厉害，你得能预测未来10年公司的表现才行。


    但是不论如何，这可能是有史以来第一个把“战略”给量化到这个程度的研究，所以特别值得我们重视。


    # 2.10个指标


    现在我们就说说研究者发现的这10个参数。


    这些参数的一个特点是它们都不是公司的绝对数值——比如你年产值是多少美元——而是跟市场上别的公司比较的相对关系。可能你觉得你投入很大，可是如果竞争对手投入比你还大，那你还是不行。


    战略分析关心的是相对位置。大多数参数都用“前百分之几”这个说法表述，意思就是说你在公司排名表上的位置是什么。


    还有一个特点是要想让一个参数对你的战略好处，你在这一项的排名必须超过一定的门槛。过了这个门槛，这个因素就对你就是一项助力，没到门槛，你在这一项就不得分。


    所以对战略制定者来说，这10个参数其实就是10项必须想办法达到的硬指标。


    这些指标总共分为三类。


    第一类叫“资质”，也就是你们公司当前的情况如何。资质总共有3个指标——


    +   1）公司规模，也就是年产值。门槛是前1/5：你得是Top 20%的大公司，这项指标对你才有用。小公司很容易短期做一个高利润率，但是要想持续不断地赚大钱，公司规模非常重要。


    +   2）负债率。负债率越低越好，只有当你负债比较低，你才能方便融资去做大动作。负债率的门槛是40%——这个意思不是说负债率本身要低于40，而是说在市场上所有公司按照负债率从低到高的排名表上，要处在前40%的位置。


    +   3）投资额。你已经投入发展的资金，要占到行业前50%。


    第二类指标叫“趋势”，意思是外部环境，也就是你身处何地，总共有2个方面——


    +   1）行业。身处一个正在上升的行业是至关重要的。前面我们说选对了行业，你的位置就选对了50%。这个模型关心的是战略曲线上的*移动*，行业没有50%那么重要，但它也是10个指标中最重要一个。门槛是，你这个行业，在过去10年内，在行业利润分布曲线上至少上升了1/5的排名。


    +   2）地点。说白了就是你在哪個国家做生意。如果是在中国，那就加分，因为中国是个快速增长的地方。门槛是你所在市场的名义GDP增长率要排在前40%。


    第三类指标是你的动作，也就是你下一步准备怎么做，总共有5个方面——


    +   1）循序渐进的并购。你应该在10年之内连续并购别 的公司，每次花费不能超过公司总市值 的30%，而多次并购加起来，应该要超过公司总市值的30%。

    2）动态的资源分配。门槛是10年内，你要把公司资源的50%重新分配——裁撤一些部门，建立一些新部门。

    3）资本花费。你战略计划中准备烧的钱，得排在整个行业的前20%才行。

    4）提高生产率。说白了就是降低成本、花同样的钱能够做出更多的事儿。你的生产率要排名到前30%才行。

    5）产品创新。所谓新产品受欢迎，硬指标是你规划的这个产品的毛利率要排名到行业的前30%。


    我们再强调一下，这10项指标并不是研究者人为设计的结果。他们总共考察了40个变量，数据分析的结果是大部分变量都不重要，就只有这10最重要。然后你把这10项指标摆出来一看，正好可以分成三类。


    而至于其他的因素，比如CEO的领导力重不重要？公司人才构成本重不重要？要么就是已经体现在了这10个指标之中，要不就是不太重要。


    怎么用这10个指标计算公司未来的情况，剩下的都是数学细节，这本书里没有讲。但是现在已经非常清楚，好战略的标准就是尽可能地在这10个方面达标。


    # 3.决定命运的三种要素


    麦肯锡这项研究说的都是公司战略，可我觉得似乎可以跟个人战略做类比。当然人不是公司，并不是专门以挣钱为目的……但如果你想研究挣钱的战略，可以考虑一下这个类比。


    比如研究中说的这三个类别——资质，就相当于是你这个人现在怎么样；趋势，就相当于你住在哪里、从事什么职业；动作，就是你计划要干什么，也可以说是你的努力。


    个人的命运难道不也是资质、趋势和动作这三种要素决定的吗？但是如果没有量化研究，我就不知道哪个重要，哪个不重要。


    比如有首歌叫《爱拼才会赢》，说“三分天注定、七分靠打拼”，那意思就是说资质和趋势只占30%，70%是靠你的努力，对吧？


    可是还有一句话叫“一命二运三风水，四积阴德五读书”，我细细品味一下其中的“命”和“运”，'
