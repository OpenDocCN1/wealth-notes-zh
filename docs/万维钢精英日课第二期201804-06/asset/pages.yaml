  md: '# 日课138 | 《超越曲棍球杆的战略》4:为什么大公司抓不住大趋势


    今天咱们继续说《超越曲棍球杆的战略》这本书。上<|message|> 讲提出了一个量化的战略模型，这个模型的10项指标中，最重要的一项就是你这个公司所处的行业。对个人也是一样，选择什么职业、能不能抓住机会改变职业，大概是你最重要的决定。


    麦肯锡的资料库中，有117个公司曾经从利润分配曲线的中间位置跃迁到了顶层位置——这117个公司中的85个，是因为行业的发展而跃迁的，是搭了行业的顺风车。数据库中还有201个公司是从中间层跌落到了底层，而它们之所以会跌落，其中157个是被自己所在的行业给拖累了。


    所以选对行业实在是太重要了。


    初创的小公司肯定要选一个最有活力的行业进入。但是如果是一个很大的老牌公司，在自己行业里已经奋斗多年，是一个既得利益者，你让它转型就非常困难了。


    我们经常说一句叫做“船小好调头”，那大船为什么就不好调头？今天我们重点讲讲这个问题。


    从大船的视角去看，一个新行业的兴起大概有四个阶段。


    # 1.早期的神话


    上世纪80年代未我还在上小学的时候，哈尔滨覆盖率最高的报纸是《哈尔滨广播电视报》。整个哈尔滨的人都读这份报纸，我每周的一个任务就是去买《电视报》。这并不是因为这个报纸里的文章有多好看，而是因为上面有电视节目表。


    到90年代，我注意到周围很多人买报纸是为了看了上面刊登的上市公司股价。在没有互联网的年代，想知道电视节目和股价，报纸是最好的渠道。


    现在想起来，当时的我实在太不敏感了。如果我足够敏感，我就应该注意到人们买报纸主要不是为了看记者们写的新 闻，而是把报纸当做获得专业信息的渠道——我应该想到这是媒体业的危险信号。


    然而早在1964年，就有一个叫马歇尔·麦克卢汉（Marshall McLuhan）的媒体理论家注意到了。他说现在人们看报纸主要看的是分类广告和股市价格——这对报纸业可不是什么好事儿。


    # 2.改变已经发生


    在第二个阶段，趋势已经清 楚了，人们已经知道新玩法肯定要做大——但是旧的玩法还能挣钱。在这个阶段，传统公司仍然傲慢，并不表 慕什么新行业。


    # 3.不可避免的转变


    到第三阶段，新模式已经被证明是更好的，传统公司理性的选择是必须转型。这就要求公司采用激进的方法，把资源投入到新的方向上去。


    # 4.适应新模式


    到第四阶段，旧模式已经不行了。那些没 有转型的公司，比如柯达，想转型已经来 不及，直接退出是唯一的办法。'
