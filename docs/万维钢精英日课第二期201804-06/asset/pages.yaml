  md: '# 答读者问 | 回归平均、马太效应和赌徒谬误


    答读者问 | 回归平均、马太效.. ↓


    # 来自日课: 洞见因果的三种思维


    以前看过很多文章说男人喜欢直接给结果，女人喜欢说因后果也就是过程……我们会不会就会被我们的因果思维“蒙蔽”而看不到事实的真相呢？……我们在寻求事物背后因果自问“为什么”之时，又怎么能够确认自己是否于真的理性，还是只是大脑模块的作用，使得一个因果关系串连起来而已呢？


    万维钢


    学者研究因果关系是为了更好地理解世界和做出预测，而葛娃这样的普通人的因果思维，则更多的是指向人的动机。这个思维认为动机比结果重要。只要动机是好的，失败了叫虽败犹荣，犯错误叫无心之过，个人就不必接受太多指责。


    # 来自日课: 总有一种力量让我们回归平均


    你以前解读过《成功与运气》这本书，书中描写刚开始一点好运气发展到后 umani会成为通吃，那么这些会适用回归平均这个发现吗？如果回归平均是一个无法避免的客观规律，那么人是不是可以让这个回归的周期拉长些？


    万维钢


    回归平均和马太效应是两个相反的规律，都在起作用。对发了一大笔财的人来说，现在就看你受哪个的影响更大。


    # 来自日课: 到底有没有因果关系


    所谓客观的衡量标准是什么呢？是数学吗？是大多数人的主观达成共识的结果吗？


    万维钢


    所谓客观就是不依赖你的感知而存在的东西。比如你在后院埋下一个箱子，里面有十根金条。二十年以后你的记忆有点模糊了，有时侯你半夜醒来，甚至怀疑自己是不是真的曾经拥有过十根金条，你怀疑那可能是一个梦。于是你到后院挖出箱子，结果里面真有十根金条。


    # 来自日课: 一个对收入差距增大的物理学解释


    我凭我粗浅的经济学知识对这个研究表示不以为然。首先我认为财富是交换带来的，这已经是经济学领域的共识，跟运输的关系并没有那么大。第二，现在经济学家已经开始对这种完全从模型出发的“黑板经济学”有反思了，甚至有学者(Deirdre
    McCloskey)对多个诺奖获得者进行批判。薛兆丰老师在专栏中多次从多角度讨论了现在基于数学模型的经济学的缺点，如过分简单、静态、缺乏指导性等。比如这个模型给出的结论说没说怎么应用:
    如何增加每层的K值呢？更关键的是谁来增加呢？'
