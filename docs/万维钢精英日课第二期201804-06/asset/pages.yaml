  md: '这是一个非常出乎意料的结论。但是贝叶斯公式不是什么黑箱操作的魔法，你还可以用来下面这张图参详一下。假设有3000名40岁的女性，根据前面说的各项数据，其中只有4人真有乳腺癌，而被正确检测为阳性的只有三人。另一方面，被检测仪器误诊为阳性的，却有360人。所以在所有阳性诊断之中，只有不到1%的人真有乳腺癌。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_125_0.png)


    出现这种情况的根本原因就在于乳腺癌的患者比例很小，而检测仪器又很不准确。几乎每一本讲贝叶斯方法的书都会使用一个这样的例子，你想明白一个就想明白了所有的。


    请注意，如果这位女性本身携带容易得乳腺癌的基因，那么我们一开始选用的 P(D) 就不是 1/700 了，而应该是 1/20。用这个数计算，最后的 P(D|T)
    = 1/3，这就非常不一样了。


    这是一个关键问题。一开始，你到底凭什么选择 P(D) 的数值呢？


    那是你的主观判断。


    # 3.信念的传播


    咱们再看一眼贝叶斯公式——


    ```

    P(A|B) = P(B|A)/P(B) × P(A)

    ```


    右边乘法的第一项 P(B|A)/P(B) 有时候被称为“似然比”。那么贝叶斯公式可以写成


    ```

    P(假设|证据) = 似然比 × P(假设)

    ```


    你可以把它理解成“观念更新”的公式。P(假设) 是你的老观念，新证据发生之后，你的新观念是 P(假设|证据)。新观念等于老观念乘以似然比。


    你的观点，随着事实，发生了改变。


    那我们设想一下，如果每个人的阅历和想法不同，一开始的观点不一样，那么哪怕是面对同样的证据，人们更新之后ierter

    的观点，也还是不一样的！所以贝叶斯方法本质上是个主观的判断方法：同样的证据，它允许你有不同的判断！


    +   1. 提出一个理论假设；

    2. 做实验验证；

    3. 如果实验结果符合理论，这个理论就暂时站得住脚，如果不符合，理论就被证伪了。


    这是非黑即白的剧情，理论要么就继续保留，要么就彻底抛弃。


    而贝叶斯方法则是先给理论假设设定一个可信度。新证据并不直接证实或者证伪理论，只是调整可信度的大小，做一个动态的判断。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_125_1.png)


    # 【贝叶斯方法】


    +   1. 先评估一下自己的信念，设定 P(信念)；

    2. 等待新证据；

    3. 证据出来以后，用贝叶斯公式更新自己的信念，计算 P(信念|证据)；

    4. 继续等待新证据……


    # 划重点


    ![](img/a2c55447bc97d25d1622d2d734d5541b_125_2.png)


    注释

    [1] 我们专栏以前讲《意会》的时候有一期叫《获得“洞见”的内功》，系统介绍过这些推理方法。'
