  md: '坦半岛之后，反而是原来生活在地洞里苟延残喘的哺乳动物称王称霸。而且更要命的是，一种生物越是能够在原来的环境里称王称霸，它的性状可能就越适应了那种生存环境，一旦环境变迁，生存出现危机的首先就是它们。


    所以，想要自己的物种和文明万古长青，人类要做的不是主动去筛选符合一时一地生存的特定基因和性状，反而是应该尽可能地保留所有可以保留的基因变异和性状，为未来可能的环境变化做好准备。对于人类而言，这种变化可能是星际远航，是人脑联网，是超级细菌，是核战争，是超新星爆发……总而言之，可能比地球环境曾经出现的灾难更加难以预测。


    而更完美的是，人类文明的进步恰恰给这种操作提供了可能性。因为农业发展，我们不再需要在野外追逐猎物，我这样的高度近视患者也活了下来；因为疫苗和抗生素的使用，黑死病和天花这样的死亡骑士不再肆虐人类；因为辅助生育和新生儿护理技术的发展，许多原本根本无法出生、活不到成年的孩子也都活了下来。所有这一切，不光反映了人类文明和道德的进步，不光浸透着人文主义的光辉，而且即使从生物学上，也为人类的生存尽可能保留了基因层面的火种。我还要再次强调一下，基因没有“好”“坏”之分，在不同的生存环境里，任何一种基因突变都有可能大放光彩。


