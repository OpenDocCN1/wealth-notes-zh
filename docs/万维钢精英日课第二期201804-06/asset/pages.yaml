  md: '个球员的助攻和射门次数、跑动距离、盘带次数、抢截成功率、铲球、解围等等。

    但系统并不是简单地把这些数据加起来，它要看每个动作值多少钱。


    我理解统计学家弄了一个类似于因果模型的東西，要精确计算各种动作对得失球的贡献。比如说，形成射门之前一般都会有很多传球，队友有各种配合，那哪种配合对最后的射门最有帮助呢？


    一个计算结果是1次成功的传中，价值等于10次普通传球。那如果一个球员的传中特别准，他就算不怎么进球，价值也很高。

    这才是比较科学的评估。你光说我在场很拼命不行，你干的这些活儿得对得失球有切实贡献才行。


    用这个模型算，得分最高的大都是后卫和守门员，有时候只有一个前锋和一个中场球员进入前十名。2008/09赛季C罗在英超曼联踢球，他也参加了这个评比，但是都没有进入前二十名。


    也就是说，从对球队胜负影响的效率来说，价值最大的恐怕不是前锋，而是后卫和守门员。观众只注意到进球，殊不知防守队员化解掉对方的进球也同样重要！每一次回追堵截、每一次大脚解围，都是实打实的功劳。


    前锋之所以得分低，是因为前锋浪费了太多机会。全队努力、好不容易把球送到你脚下让你射门，结果你一脚浪射踢飞了……


    那逆天的梅西和C罗，难道他们的价值被高估了吗？


    # 3.真正的C罗


    咱們來看看C罗到底有什么样的价值。


    下面这张图是2014/15赛季皇家马德里队参加欧洲冠军联赛12场比赛的一个统计。对C罗、本泽马和贝尔，图中每个黑点代表一次射门地点，每个圆圈代表一次进球。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_147_0.png)


    12场比赛里C罗一共进了7个球（不包括3个点球），本泽马6球，贝尔2球。C罗进球数最多……可是C罗的射门次数也是最多的。进球效率最高的是本泽马。


    如果队友无条件地信任你，让你任何时候想射门就射门，那你理所应当进 connective 球。C罗的进球数似乎还有点亏了这么多的射门机会。C罗有多达35次禁区外的远射，一次都没进。


    事实上，如果你考虑更多的数据，C罗的进球效率真不算特别高。下面这张图还是来自538网站。这是对比866个球员的统计，横坐标代表平均每场射门次数，纵坐标代表这些射门中进球占的比例。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_147_1.png)


    我们看到总趋势是进球效率越高的球员，射门次数也越多 —— 这体现了队友对高水平射手的信任。但是我们看到，C罗在代表平均水平的红线以下 —— 他的射门效率有点配不上他的射门次数。反倒
    是图上的梅西，不但进球多，而且效率高。


    所以C罗绝对应该感谢皇马的队友。


    但是我们也不能说C罗就被高估了。森普特认为，C罗的价值不仅仅是进球，更在于他制造威胁的能力特别强。下面这张图表现的是形成有效射门之前的15秒钟，球的来源 ——
    也就是说，是谁在什么地方把球传给射门的人。图上的每一个小方块代表一次这样的威胁传球。颜色越深，就说明从那个区域发动的 有效传球越多。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_147_2.png)


    角球区和球门前都是传出威胁球最常见的地方，不足为奇。图中最引人注意的，是左前场那一片黑色区域 —— 这是皇马的关键进攻发起区。那个区域属于C罗和马塞洛。


    C罗不仅仅自己射门，他还是关键进攻的发起者！皇马的打法，最简单来说，就是想方设法把球接到左路，由C罗或者马塞洛把球送到禁区前的有效射门区，然后在那里形成射门。12场欧冠联赛中C罗不但有7个进球，而且还有4个助攻。


    # | 由此得到


    对足球这样特别讲配合的运动来说，明星和团队的相互作用并不容易分析。但是借助数据，我们仍然可以得出以下这些结论：


    +   1. 梅西和C罗在当今足球界鹤立鸡群，可以说是bug级的存在。


    +   2. 但是再厉害的球星也需要队友的支持，事实上上关注度比较低的防守球员对球队的贡献可能更大。


    +   3. C罗进球多，很大程度上是因为他在队友支持下射门的次数就特别多 —— 考虑到进球效率，C罗比梅西更应该感谢队友。


    +   4. 但是我们也绝不能低估巨星：C罗的作用不仅仅是自己进球，更是直接策划有威胁的进攻。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_147_3.png)


    所以到底什么是明星？如果这个项目的合作度比较低，那明星完全可以单干，自己就能做出漂亮成绩。但如果合作度比较高，那明星就必须在团队的支持之下才能有所表现。现在足球是个合作度很高的项目，而真正的明星，除了自己直接拿分之外，还要给团队里其他人提供支持，成为领袖。


    没错，C罗总能deliver。下一讲咱们说梅西。从梅西跟球队的关系，我们可以得到另一个教训。


