  md: '# 日课132 | 美国的 中年人


    日课132 | 美国的 中年人


    最近中美两国发生了一系列的贸易纠纷，特别是中兴公司被美国商务部制裁，引起我们的很多思考。从国家竞争的角度，美国是中国对手，我们肯定要自立自强。从另一方面来说，我看这些事件也给崛起中的中国人提了一个醒。


    美国，是不是还有很多值得我们学习的地方。


    我今天没有什么长篇大论，我想说一个小侧面：美国社会的成熟度。


    中国游客如果到美国短期旅游观光一下，看着美国破败的基础设施，再想想中国漂亮的城市建设和高铁，难免会有一 种自得的情绪。但如果你生活比较长的一段时间跟老百姓打交道，甚至哪怕你还在中国，但是你注意到一些细节，你可能会有不一样的感受。


    比如前几天美国西南航空公司的一架波音737客机发生的重大事故。飞机起飞不久，左侧发动机就爆炸了。机长很好地控制了飞机，用一个发动机又飞了40多分钟，迫降，结果只有一名乘客死亡，七人受
    IPC 。事后乘客纷纷对机长表示了感谢，说她有“钢铁般的神经”。


    我想说的是这件事儿的一个细节。这个机长叫塔米·舒尔茨（Tammie Jo Shults），她是一位56岁的女性。舒尔茨曾经在空军服役多年，飞的是F/A-18战斗机，而在参军之前，她大学本科学的是生物学和综合农业。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_34_0.png)


    舒尔茨能在关键时刻镇定自若，也许是因为她经历过很多事情。她有不同领域的综合经验，她有能力处理复杂问题。


    像这样的人物在美国可以说是车载斗量。再比如2009年，全美航空的一架空客A320客机，也是起飞后不久就发生事故，而且是两个发动机都着火报废，飞机在完全失去动力的情况下，居然奇迹般地在纽约哈德森河的河面上迫降成功，机上155人无一伤亡。而这个飞机的机长叫萨伦伯格，当时是57岁。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_34_1.png)


    萨伦伯格之所以能迫降成功 — 甚至他之所以能*想到*在河面上下降 — 很可能是因为他早年飞过水上飞机。萨伦伯格也在空军服役多年，专门负责调查飞行事故。而加入空军之前，他拥有科学、心理学和行政学的学士和硕士学位。因为这事故出名了以后，萨伦伯格又成了电视节目的安全嘉宾、演讲家和畅销书作家。


    美国有很多这样经验极其丰富的高水平中年人，而且他们都在第一线工作。


    像这种充满个人英雄主义特色的离奇事迹，似乎发生在美国比较多。当然一个很重要的客观原因是中国的飞机都比较新，本身就不容易出事故。


    但是不可忽视的另一方面是，中国的人也都比较新。我以前搞物理的时候就有个突出的感受。在美国做个报告，你会发现下面听讲的一大片都是中年人。回中国做个报告，听众几乎全是年轻人。当然这说明中国的未来充满希望，但是这也说明中国的现代化进程还比较……嫩。


    以我接触的经验来看，美国中年人的水平非常高。他们不但很能接受新事物，而且玩的比年轻人还好 — 而且他们本身就是新事物的创造者。他们才是科学研究和各大公司技术研发的主力。当我看到一个年轻人
    and 一个美国中年人一起讨论问题的时候，我更多的是看到年轻人向中年人请教。但是在中国，恐怕更多的是工作都是年轻人做。


    大概十年前，有个退休的知名物理学家，已经很老了，而且还得了帕金森综合征，他不愿意在家呆着，每天都到我们物理系上班。物理系给了他一间办公室，但是仅此而已。他没有经费也没有学生，更没有助手，颤巍巍行动非常不便。我的办公室跟他很近，我看大家都很尊敬他，但是也没什么人主动找他，毕业各人都在忙自己的项目。


    有一天，老头找到我，说看到我贴在楼道墙上的海报很感兴趣。我们就讨论了一下，他说他有些想法。很快他又来找我，他推导了好几页的公式，而且还整齐地排版打印成了书面的形式！后来我们几个人合作了一篇论文。老人家现在已经去世了，他一直到死，都是
    一线物理学家。


    有这样的人到老都要在第一线做事，你想想这是一个什么样的社会。


    而且美国人心目中的“中年”很多时候是相当于中国人说的“老年”。 六十多岁别人根本不当你老，该干啥干啥。


    我妻子以前在 IBM 公司工作。 有一次我们去她的一个同事家做客，这是一个六十多岁的工程师 — 他一直都是工程师。聊天聊到读书，我说 Kindle 是个很好的阅读工具，结果这位工程师和他的妻子都还没用过
    Kindle。我心想看来你们真是有点老了，还把我的 Kindle 拿给他们看。


    但是聊到专业技术的时候，我感觉他一点都不老。他是研究打印机的，给我讲了几个技术细节、一些研发的故事，我也没记住。但我记得非常清楚的是，他讲到他们搞的一种打印机，打印出来的纸张往外排的速度之快，相当于一个人全速奔跑都跟不上。他讲到这时候眼睛就好像有光一样。


    像这种几乎成了精的老工程师，中国能有多少。而且这位工程师的妻子也挺厉害。按中国标准她应该算是一位家庭主妇，但是我聊天中就发现她谈吐不凡，结果是个非常爱读书的人，基本上各种事儿都知道。


    我家有个邻居，五十来岁了，还在搞技术发明，正在跟中国合作，准备创业开公司。我还认识一个人，本来是个中学老师，中年被查出癌症不得停止工作。结果癌症治好之后再次进入职场，重新学习，这回不当老师了，居然成了一个大公司的部门经理。我儿子以前在幼儿园的一个小朋友的家长，也是个工程师，但是居然对物理学很感兴趣，问过我一些特别专业的问题，还把物理新闻发给我看，我还跟他有过一次关于全球变暖的辩论。我刚到美国的时候上物理课，《量子力学》，班上有两位老人，下课后还问我作业题。我就问他们你们也是学生吗？他们说不是，我们是来旁听的
    — 我们想学习量子力学。


    所以美国是真没有“中年油腻”这个说法。


    美国的人口出生率大约是2.0，比中国大城市的人口出生率还要高一点，但我的突出感受是，美国是一个由中年人运行的社会。这样的社会做事比较靠谱，老百姓情绪就比较理性。


    有一次我坐公共汽车，正好坐前排就跟司机聊了几句。司机问我是不是中国人，我说是啊。司机说，听说中国人抢走了很多美国的工作。结果他刚说完这句话，还没等到我回话，旁边一位中年女性马上就说，“那是美国自己的原因。”


    我想这样的老百姓大概不会搞什么抵制中国货的运动。我这么多年来几乎就没见过美国人在公开场合情绪失控。


    去年我儿子要上三年级了，我一看学校网站上的老师介绍，我儿子老师以前的专业居然是体育、我当时心里有点不满足。'
