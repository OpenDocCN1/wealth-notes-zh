  md: '# 特别放送 | 王立铭答：须知参差多态，乃是幸福本源


    特别放送 | 王立铭答：须知...


    万维钢


    你好！昨天我回答了《生命科学50讲》王立铭老师关于“智慧演化”的问题，同时也向王老师提了一个关于“基因演化”的问题，今天我就跟你分享王老师对这个问题精彩回复。我的问题具体是这样的：


    生物进化的机制是用自然选择淘汰不好的基因突变，留下好的基因。自然界一直都是基因好的个体拥有更大的生存权和生育权。人类进入文明时代，特别是工业革命以后，个人权利和基本医疗条件都大大改善，平等待念深入人心，几乎每个人都有同样的生存权和生育权。身体天生比较弱、甚至有遗传疾病的人，也有几乎同样的机会留下后代，传递基因。请问王老师，自然选择机制到了这个时候，对人类是否还有有效？你是否担心，长此以往，人类的基因会整体变差呢？


    以下是王立铭老师的回复：


    万老师提出了一个非常有趣、也非常重要的问题：在文明时代，人类是不是停止进化了；如果是的话，那人类会不会因此变弱、变差。实际上，我也经常从朋友那里收到类似的疑虑甚至是担忧。借此机会，我正好来系统阐述一下我的观点。


    这一类疑虑的基础可以归结为三个递进的问题：


    # 第一，在没有自然选择压力的时候，生物是不是停止进化了？


    # 第二，有没有“好”基因和“坏”基因？


    # 第三，在文明时代，残酷的自然选择似乎在减轻甚至消失，那么人类的基因库是在变“差”么？


    请注意，这第三个问题之所以能出现，前提是前两个问题的回答是肯定的。道理很简单，如果没有自然选择生物就停止了进化，如果确实存在好基因和坏基因，那么在文明时代中，既然坏基因可以得以保留，人类的基因库显然就会变差。


    我来分别回答这三个问题：


    # 第一，在没有自然选择压力的时候，生物是不是停止进化了？


    首先，根据严格的生物学定义，不管有没有自然选择，人类都没有停止进化，也永远不可能停止进化。


    进化这个词翻译自英文 evolution，更加中性和准确的翻译其实是“演化”，这件事本身其实没有什么进步或者是积极的感情色彩。在现代生物学的语境里，演化指的是在一个生物群体当中，随着时间推移，特定基因类型的出现频率发生了变化。这种变化可能是由于自然选择带来的：比如说如果给一群细菌施加抗生素处理，那么很快，抗药基因的出现频率就会急剧上升。但是这种变化也可以和自然选择完全无关。中性突变、遗传漂变、非随机的交配都可能会带来特定基因类型出现频率的变化。


    也就可以说，不管自然选择在不在那里，生物演化一直都在发生，即使在人类进入文明时代之后。


    比如说，在大多数哺乳动物当中，只有需要消化乳汁的幼崽才生产大量的乳糖酶。但有证据显示，在人类进入农业社会之后，先后出现过至少五次乳糖酶基因的突变，让相当一批人在成年之后也具备消化牛奶的能力。可想而知，这些基因突变在农业社会中是有巨大的生存优势的，因此在过去的几千年内迅速在人类中扩散开来。这是一个人类社会中自然选择驱动演化的案例。


    相反的例子也有。在人类开始吃更容易咀嚼的熟食之后，作为第三磨牙的所谓“智齿”就失去了重要性。换句话说，支持智齿存在的选择压力消失了。结果到今天，有相当一部分现代人——这里包括40%的亚洲人——压根就不会长智齿。在这个案例里，没有自然选择的力量，人体的特性（其实也就是产生这些性状的基因）仍然在发生演化。


    所以你看，即使在现代人当中，演化仍然在发生。在很多时候我们意识不到它们的存在，可能仅仅是因为进化的时间尺度太过漫长，动辄以万年甚至百万年计，我们现代人感觉不到而已。我可以很有把握地说，10万年后的人类，甚至是1万年后的人类，肯定和今天的人类很不一样。


    而在更宏大的时空尺度内，还有大量的随机事件会影响人类的演化。举一个诡谲比较大的例子：如果有一天人类殖民火星，那么第一批定居者的基因分布将会在很大程度上决定未来火星人类的基因库。在未来火星文明的生物演化史上，这件事当然无比重大，但是它和自然选择毫无关系，纯粹是一次小规模人群迁移带来的后果。


    所以简单来说，不管有没有自然选择，人类的演化正在发生、从未停止。


    接下来我们再来看第二个问题。


    # 第二、有没有“好”基因和“坏”基因的区分？


    一个直截了当的回答是，“没有”。


    你已经知道，演化本身没有方向性，没有目标，没有好恶之分，更不带有什么进步和积极的感情色彩。在自然选择的过程里，谁能活下来，谁能产生后代，谁就是胜利者。


    所以，今天仍然在地球上繁盛的生物，在此时此刻当然全都是胜利者。


    从我们人类的视角来看，可能会觉得他们不一样：孔雀的羽毛非常美丽，癞蛤蟆的皮肤丑陋无比；翱翔天空的雄鹰很矫健威武，那些视觉功能退化的穴居生物非常悲惨。但是它们的生物性状和这些性状背后的遗传物质，都是为了更好地生存繁衍。

    它们才不在乎在人类看来是美丽还是丑陋，是矫健还是虚弱。


    反过来，人类那些自以为豪的优良特性，比如光滑的皮肤，硕大的腮袋，女性隆起的乳房，男人密密麻麻的胡须，在别的物种看来可能也是一样的不可思议和丑陋。而我们也一样，根本不在乎它们怎么看我们。


    更重要的问题在于，地球的自然环境处在永不停歇的变化当中。因为自然选择的标尺总是变化无常，这一时刻的胜利者很有可能在下一刻就衰然倒地。这样一来，在当下我们人类主观认定“好”“坏”，在更广袤的时空尺度下大概率是站不住脚的。


    比如说，导致镰刀形贫血症的基因突变在今天被理所当然地认为是一个坏东西，因为它会让人患病甚至死亡。但是在疟疾肆虐的热带雨林，同样的一个基因突变给我们的祖先带来的是极其珍贵对抗疟疾的抵抗力。你能说这个基因突变是好还是坏呢？同样的，在现代社会里让我们更容易罹患糖尿病的所谓“节俭基因”、让男性更容易早衰和罹患癌症的基因，曾经可能帮助了我们的祖先在饥荒的时候更能忍耐，在打猎的时候奔跑更快。以此类推，在今天人类看来“坏”的基因，谁又能说在未来世界里不会大放光彩呢？


    所以，总之一句话，不管何时何地，基因都没有所谓“好”“坏”之分。


    有了上面两个问题做铺垫，我们就更容易看清第三个问题的症结所在了：


    # 第三、在文明时代，残酷的自然选择似乎在减轻甚至消失，那么人类的基因库是在变“差”么？


    当然不是！在我看来，恰恰是因为现代文明，因为人类利用科学技术——特别是规模农业、疫苗和抗生素的推广——在很大程度上让我们摆脱了残酷的生存竞争，人类的基因库才有了可以变得更好的奢侈。


    为什么这么说呢？


    请注意我刚才说到的一句话：自然选择的标尺总是变化无常。在40亿年的生命史上，地球环境的变化可能比翻书还快。所有你能想到的自然环境参数：气温、湿度、大气氧含量、海水酸碱度、岩石的化学成分、食物、天敌……都在反复不断地沐海桑田。曾经的地球被厌氧生物统治，但在山崩地裂般的氧化事件之后，氧气毒死了几乎地球上所有生物；曾经的地球被恐龙家族统治，但是在小行星撞击中卡坦巴岛之后，反而是原来生活在地洞里苟延残喘的啮齿动物称了霸。而目前更...'
