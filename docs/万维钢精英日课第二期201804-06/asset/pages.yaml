  md: '# 日课161 | 《为什么》3: 到底有没有因果关系


    日课161 | 《为什么》3:到底。 ↓


    今天咱们继续说朱迪亚·珀尔的《为什么: 因果关系的新科学》。前两讲已经做了大量的铺垫，今天我们终于可以回答这个问题了: “科学的世界里到底有没有因果关系”。


    这是一个大反转的故事。咱们先从哲学开始说。


    # 1.哲学


    不知道你注意过没有，物理定律里根本就不包括因果关系。比如你拿个气压计测量大气压，物理定律说你的气压计读数 B 和大气压 P 之间有一个正比关系 ——


    ```

    B = kP

    ```


    但是这个定律里根本没说 “谁导致了谁”。是气压导致了气压计的读数吗？可是上面的方程完全可以改写成 P = B/k，只看方程，你完全可以说是气压计的读数导致了大气压的大小。物理定律只是描述一个规律，并不在乎因果。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_116_0.png)


    # 2.皮尔逊的尴尬


    皮尔逊做了大量的调查研究，发现了各种相关性。他注意到，有些相关性很有意义，有些相关性就没什么意义，他称之为 “伪相关 (spurious correlation)”。


    请注意！你只要这么一解释，就用到了因果关系！


    # 3.因果模型


    假设咱们要研究一个死刑。总共有五个变量 ——


    +   1. 法庭是否判决死刑

    2. 队长是否下令开枪

    3. 士兵 A 是否开枪

    4. 士兵 B 是否开枪

    5 犯人是否死亡


    这五个变量的值都是 1 或者是 0，1 表示肯定，0 表示否定。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_116_1.png)


    图中每个箭头代表一个因果关系，从缘故指向结果。这张图能够让你回答我们第一Def说说的全部三类问题。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '能告诉你这些，但是因果关系可以告诉你。


    可是这个因果关系图是从哪来的呢？人死亡的原因可以有很多，也许犯人自己会病死，也许会被别的犯人打死，而且犯人还可能越狱……这些情况你为什么不考虑呢？你这张简单的因果关系图，还是没有彻底回答“犯人为什么死了”这个问题。


    好。逻辑上无法科学定义因果关系，实际操作上因果关系又这么有用，那我们到底该拿因果关系怎么办呢？


    所以有些事儿看似简单，但是细思极恐。而有些人的思想，可以拨云见日。


    # 4.拨云见日


    第一个使用因果模型图搞研究的，是美国统计学家休厄尔·赖特（Sewall Wright）。1920年，赖特发表了一篇有关天竺鼠的毛色遗传的论文。他假设有三种因素可能影响毛色，分别是发展（d）、遗传（h）和环境（e），他把这三种因素画成了因果关系图——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_117_0.png)


    然后赖特根据自己的实验结果，用解方程的方法算出了三种因素的相对大小。他把天竺鼠的毛色问题给解决了。


    这绝对是开创性的工作。赖特不但第一次使用了因果模型，而且还提出了一个洞见。


    赖特说，我这个因果模型并不是客观的。你不可能通过数据分析、用机械化的流程得到这张图。因果图之所以这么画，图中之所以考虑了这些关系而没考虑别的关 系，这<|message|>是你自己主观的选择——是你用自己的知识、阅历和判断画出来的。


    也就是说，因果关系，其实是你的主观假设。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_117_1.png)


    数据是客观的，而人的观点是主观的。相关性是客观的，因果是主观的。


    有了这个洞见，我们解决问题 的步骤就是下面这样的——


    第一步，根据你自己的见识，画一张主观的因果模型图。模型里有些因果关系是概率性的，A 发生并不一定会让 B 发生，只要 A 对 B 有影响就行。


    第二步，使用实验和数据分析，确定图中每个因果关系的强弱大小。这样你就有一个完整的因果模型。


    第三步，使用因果模型，你就可以回答“观察、干预、想象”那三种问题了。


    如果 AI 拥有这样的模型，它就等于获得了智能。珀尔称之为“小图灵问题”，相当于计算机通过了一个小的图灵测试：他掌握了因果思维。


    你注意到没有，我们自始至终没有彻底回答“到底什么是因果关系”，我们也没有真正解决“为什么”的问题！


    在我看来，因果分析这个思想的最高妙之处就在于，你无需确定真正 的因果关系，却无需回答“为什么”。


    真实世界里任何事情都是错综复杂的，你根本就无法列举影响一个结果的所有可能缘故。你必须做出各种取舍，你只能把你认为最重要的缘故画在图上。图画完了，你并没有科学地、彻底地、逻辑完备地回答“为什么”，你只是说，根据你的猜
    测，应该是因 为这几个缘故。


    而事实上也不需要回答“为什么”。我们在生活中的实际应用，对改变世界真正有用的，其实就是回答“观察、干预、想象”这三种问题！


    所以因果分析的最终目的不是查明因果关系，而是回答三种问题。这三个问题比因果关系更基本——因果关系只是我们回答问题的手段。


    没有这个手段，只靠数据分析，你回答不了第二和第三种问题。当然，有了这个手段，如果你的因果模型不准确，你给的答案也会不准确——你可能会漏掉一个特别重要的因果关系，你可能忽略了黑天鹅事件。但是这不要紧！预测未来的事儿本来就是谁也保证不了100%准确。


    哲学家的世界观谁也反驳不了，但我们这里不解决世界观问题，我们解决方法论问题就可以了。


    最后，请注意，虽然模型是主观的，但是因果分析仍然具有客观的性质。如果两个人的假设相同，他们画的因果关系图就是一样的，那么因为接下来的数学方法是客观的，这两个人对未来的预测，必定是100%相同。


    我建议你花点时间琢磨一下这个道理，这 里边有哲学。主观和客观，非常有意思。按理说这个世界应该是完全客观的存在，科学家一直在试图客观地认识世界。可 是我们不管是给东西分类也好，提出因果关系也好，做预测也好——


    只要你心念一动，你就必然是主观的。


