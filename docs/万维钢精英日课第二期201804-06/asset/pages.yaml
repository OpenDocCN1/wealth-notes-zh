  md: '# 答读者问 | 为什么中国足球不行？


    答读者问 | 为什么中国足球... ↓


    本周我们收到很多很多关于中国足球的提问，所以我想用这期问答专门说说中国足球。


    足球并不是一项神秘的活动。中国足球为什么不行，也不是一个未解之谜。老百姓有各种开玩笑式的议论，比如说“中国人种不适合踢足球”，当然都是盲人摸象。但是只要你抓住正确的大局观，答案是明摆着的。


    这个正确的大局观就是现代足球只有一种正确打法，那就是欧洲大陆足球的打法。


    我最早听说这个论断是在2009年出版的《足球经济学》（Soccernomics）这本书里，那时候中国足球人还在苦苦探索中国足球到底应该学谁。现在过去了将近十年，欧洲足球越来越强，巴西和阿根廷都在没落之中，已经可以说这个论断受了历史的考验。


    《足球经济学》这本书的说法是，以西班牙为代表的西欧国家，已经发现了足球的秘密。革命从上世纪七十年代开始，到2000年就已经完成了。'
