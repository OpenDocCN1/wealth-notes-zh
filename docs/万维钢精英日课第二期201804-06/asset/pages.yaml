  md: '# 答读者问 | 大尺度规律和个体差异


    答读者问 | 大尺度规律和个...


    # 来自日课：物理学祖师爷的洞见


    哥斯拉横截面的支撑强度为什么不能天生就很强、足以支撑它长得那么大呢？


    万维钢


    因为我们假定哥斯拉是一个喝着地球上的水、呼吸着地球上的空气、吃着地球上的食物长大的地球上的生物。只要符合这个设定，组成哥斯拉身体的东西，就跟组成每个动物身体的东西没有本质区别，都是钙、碳水化合物和脂肪而已。材料的成分一样，材料的强度就是一样的。


    事实上地球所有生物都是亲戚，大家没有本质的区别。


    如果哥斯拉是钢筋铁骨，那另当别论。但是，生物学家和化学家有足够的证据说，钢筋铁骨还真不能组成生命。这是如果要想组成生命就必须得用到有机的分子，而只有碳和水，它们的化学性质足够好，才允许你组成有机分子。


    # 来自日课：身体里的分形


    药物剂量通新陈代谢与面积成正比，也就是体积的2/3次方，而第125次课中又说生物的基础代谢与体重3/4次方成正比，到底哪个更准确呢？


    万维钢


    这个是我没说清楚。药物是跟新陈代谢一样，通过运输管道到达各个细胞。但是药物发生作用，是通过向细胞膜渗透这个过程发生的，这样药效是跟细胞膜的面积成正比，也就等同于跟体积和体重2/3次方成正比。弗斯特也没有仔细讲，我理解药物起多大作用和身体单位时间内需要多少能量毕竟不同。


    # 来自日课：寿命的定数


    根据中国国家统计局数据，2015年全国男性平均预期寿命73.64岁，女性79.43岁。而男性体重显然是高于女性的。是不是可以理解为体重对寿命的影响还有其它因素大呢？


    一直认为心跳是个定数，今天才知道具体跳多少下。按每分钟70下心跳计算，只能活69岁，这不是太少了点？


    “新陈代谢率越低，寿命越长”和“生命在于运动，人体是个脆弱系统”这两者是不是有点矛盾呢？


    万维钢


    我们必须区分大尺度的硬规律和同一个尺度之下的个体差别。《规模》这本书说的各种标度率，是只考虑一个最关键的因素，忽略各种细节的影响，得出的结论。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_24_0.png)


    你的第一反应应该是赞叹！这么多不同的哺乳动物和鸟类，居然相当齐地排成一条直线！这就是标度率的伟大胜利。


    但是另一方面，我们也注意到这条直线不是完美的，有些动物并不完全在直线上，有出入。考虑到这是对数坐标，有些出入还挺大的。比如大象的代谢率，就比标度率的理论预测值大概整整高出了1倍。


    10^N


