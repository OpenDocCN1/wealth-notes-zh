  md: '数值，可是“年龄”这一项只有714个人的数据。为此我们还得把剩下一百多个人的年龄数据给补上，就用所有乘客年龄的中位数来代替。这种事情在实际操作中非常常见，对付对付先用上再说。


    好，现在生成模型，也是整个机器学习的核心理部分，只要以下这么短短几行代码 ——


    ```

    target = train[''Survived''].values

    # Preprocess

    encoded_sex = preprocessing.LabelEncoder()

    # Convert into numbers

    train.Sex = encoded_sex.fit_transform(train.Sex)

    features_one = train[[''Pclass'', ''Sex'', ''Age'', ''Fare'']].values

    # Fit the first decision tree: my_tree_one

    my_tree_one = tree.DecisionTreeClassifier()

    my_tree_one = my_tree_one.fit(features_one, target)

    ```


    基本上就是你告诉程序要预测的目标是乘客是否存活，影响目标的四个因素是舱位、性别、年龄和船票价格，你选取的机器学习模型是“决策树”。


    最后生成的这个“my_tree_one”，就是预测模型。大功告成！


    我们先看看这个模型的性质 ——


    ```

    # Look at the importance and score of the included features

    print(my_tree_one.feature_importances_)

    [ 0.12315342  0.31274009  0.22675108  0.3373554 ]

    ```


    结果显示四项指标在统计上的重要程度分别是：船票花费占33.7%，性别占31.3%，年龄占23%，舱位占12.3%。注意这只是一个综合的统计性质，模型内部非常复杂，并不是对这几个数据做怎么加权平均。反正我们现在知道，船票花费是个比性别更重要的存活因素。


    好，现在看看这个模型的预测准确度。利用现有的训练数据，做一次操作 ——


    ```

    print(my_tree_one.score(features_one, target))

    0.977553310887

    ```


    模型的预测准确率高达97%。这是一个非常好的成绩，但是可以理解，因为毕竟你的模型就是用这组数据训练出来的。


    对模型的真正考验是使用刚才说的那个“测试”数据。测试数据里只有11项指标，不包含存活信息。我们要把这个 test 数据拿过来，用刚才训练好的模型直接预测这些我们完全没接触过的乘客的存活情况！DataCamp
    网站会帮你评分，具体步骤我就写了，直接告诉你结果。结果是，我们这个模型用于测试数据的准确度仍然高达97%！


    你想想吧。我们只知道泰坦尼克号上半数旅客的存活信息，我们根据这些信息做了一个预测模型，然后就能用这个模型，以97%的准确度，预测另一半旅客中每个人是否活了下来！


    回顾一遍，整个步骤是这样的 ——


    +   1. 把所有数据分成两组，一组用于训练，一组用于检验；

    2. 数据都是数组，其中包括你想要预测的目标信息（是否存活），以及可能影响这个目标的各种信息；

    3. 选择几个你认为最可能影响目标的信息（舱位、性别、年龄、票价）；

    4. 选择一个机器学习算法（“决策树”）；

    5. 把目标和可能影响目标的几个信息作为数组变量输入算法，训练得到一个预测模型；

    6. 把预测模型用于检验数据，看看这个模型的准确度。


    现在你已经完成了一次人工智能编程。


    # 3. 洞见


    学会了这个方法，使用现成的工具，只要有足够好的数据，你立即就可以搞几个人工智能应用。比如一个信用卡公司有十万个用户的详细数据，包括年龄、收入、以往的购买记录、信用得分、还款记录等等，那你就可以预测其中每一个人下个月按时还款的可能性。


    不过我们今天的主要目的还是体会现在所谓“人工智能”到底是怎么回事儿。它仅仅一个统计模型而已。从这个实操例子中我们得出两个洞见。


    第一个洞见是，每个模型都会带来岐视。


    泰坦尼克模型中对生死影响最重要的变量是船票价格。船票越贵，你存活的可能性就越高。假设你是一个卖保险的，现在既然你知道买了高票价的人存活率高，将来他们不太可能找你理赔，那你为了多卖几分保险，是不是可以少收一点他们的保险费？


    这就是区别定价，这就是价格歧视。你并不是歧视穷人也不是更爱富人，只不过为了多赚点钱，你就会多收穷人的保险费，少收富人的保险费，你完全是理性的 —— 可是，请问这合理吗？这道德吗？


    第二个洞见是人工智能真的不智能。


    说白了我们今天做的就是四项指标去预测一项指标而已。你完全可以想到还有很多别的因素对在泰坦尼克号上存活很重要，但是我们根本没考虑。


    比如说，当时放救生艇的时候，船长的命令是“让女人和孩子上救生艇”，但是两侧放救生艇的人对命令的理解不一样。一个人的理解是*优先*让妇女儿童上，如果周围的妇女儿童都上了救生艇还有空位，那就让男的上。另一个人的理解则是*只*让妇女儿童上救生艇，妇女儿童上完恰怕还有空位，也不让男性上，就直接把救生艇放下去。


    那如此说来，一个男人能不能存活，跟他当时距离哪个救生艇近很有关系！但是我们根本就没有这项数据。


    还有，在船即将沉没的一刻还站在船头的人，如果你选择往远处猛跳，你就有可能存活下来；如果你不跳，沉船造成的旋涡就会你拖下水，你就很可能遇难。所以最后最后一刻的跳法也决定了生死，但是这个跳法也没包括在模型里面。


    模型对泰坦尼克上发生了什么一无所知，它根本不理解自己在干什么，本质上它的一切预测都是猜的 —— 所谓机器学习，只不过是增加它猜对的概率而已。


    但是我们居然就做到了97%的准确率。人工智能界有个专门的形容词，叫“unreasonably effective”，不合理地准确。如此粗糙的模型，它居然就能做到这么准确！


    你可能对此非常感慨！但是当你的手机准确识别了你的声音的时候，当 AlphaGo 赢了柯洁的时候，你也有过这样的感慨。它们的算法更复杂，但是本质原理都是一样的。


    破解迷信战胜恐惧最好的办法就是亲自做一遍，现在你至少知道你可以做到。


    现有人类人工智能就是用统计方法增加猜测的准确度。人工智能就是机器学习。机器学习就是统计模型。“人工智能”应该叫“人工不智能”。


    参考文献

    [1] https://www.kaggle.com/startupscsi/titanic-data-science-solutions


    # 划重点


    人工智能界有个专门的形容词，叫“unreasonably effective”，不合理地准确。现有人类人工智能就是用统计方法增加猜测的准确度。人工智能就是机器学习。机器学习就是统计模型。“人工智能”应该叫“人工不智能”。'
