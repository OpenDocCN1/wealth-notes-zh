  md: '用大多了。至于说“学习”这个动作本身，那是你自己的事儿。


    # 11. 学得快就是聪明，学得慢就是笨？


    在心理学家看来，学习的快慢，并不是一种“特性”，而是与“情境”相关的。有些人学这个快，学那个慢；有的人学这个慢，学那个快——你并不能从一个人学习某个特定东西的快慢来判断他的能力。


    # 12. 搜索引擎可以代替系统性学习？


    搜索引擎不能取代系统性的学习，有两个深层的原因：


    一个是有一些知识是分层的，你必须先理解了底层的，才能理解上面一层。一元二次方程求根公式也许上网查了就能用，但是更高級的东西，查到公式也未必会用。


    那我知道并且理解一元二次方程这个概念行不行，为什么非得背下来具体的公式呢？这里面还有一个模式识别问题。熟练使用，或者有创造性的发挥，一个主要技能就是模式识别。


    比如下棋，表面上看棋盘上的局面可以千变万化，但是在高手看来，不过就是若干个套路的灵活运用。如果你事先非常熟悉这些套路，那么对手一动，你就知道他的意思。如果只知道有套路，但是记不住套路，那就很难看出。


    还有一点，也是关键的一点：搜索引擎只能被动回答问题，但不能“主动”给你提示。你至少得先知道该问什么，才能用上搜索引擎。而对于高级的问题来说，可能外行根本不知道现在有没有什么信息是缺少的，也问不出什么好问题。


