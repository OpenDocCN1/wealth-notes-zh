  md: '# 日课172 | 明星和精英团队


    日课172 | 明星和精英团队


    今天咱们继续世界杯小专题，我们来研究一下球星和球队之间的关系。是球星造就了球队呢，还是球队捧红了球星？


    其实每一个精英团队都有这个问题。明星很耀眼，身价也特别贵，那市场有没有可能高估了明星的价值。如果球队的支持比球星本人重要，那么我们就要重新考虑，到底值不值得花那么大的价钱买球星。


    当今足坛下真正的超级巨星只有两个，一个是C罗，一个是梅西。世界杯开赛两轮以来，C罗在葡萄牙队的作用显然是核心中的核心，包办了4个进球。


    我看福克斯电视台的解说员一提C罗就爱说一句，"he delivers." Deliver的意思差不多是"交付" —— C罗总能按时按点、保质保量地给你交付成果。你要是明星，在别人指望你的时候得
    deliver。


