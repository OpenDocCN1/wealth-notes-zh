  md: '# 日课预告｜新书《人工不智能》:计算机没有改变社会


    ![](img/a2c55447bc97d25d1622d2d734d5541b_89_0.png)


    日课预告｜新书《人工不智能》.


    下周我们要说一本4月27日刚刚出版的新书，《人工不智能：计算机如何误解世界》，作者是人工智能专家、数据记者和纽约大学助理教授梅瑞狄斯·布鲁萨德（Meredith
    Broussard）。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_89_1.png)


    ![](img/a2c55447bc97d25d1622d2d734d5541b_89_2.png)


    你已经听过太多有关“人工智能”的话题了，什么“人工智能将会改变世界”“人工智能将让大多数人失业”“人工智能的时代已经到来”等等等等。有些好消息说得太多，就容易让人产生不切实际的希望。不切实际的希望太强，就容易变成迷思。


    事实上，我们专栏从去年就开始说，《未来简史》担心的那种未来离我们还非常遥远，现在所谓人工智能还没有那么厉害，人类已经反应过来了，可以预见的近期内不会有什么人工智能导致的大失业。


    我们有过一篇文章叫《我们对人工智能可能有点想多了》，其中就提到，现在是美国历史上失业率*低*的时期。很多原本以为会被人工智能取代的工作，其实根本取代不了。我还给一本叫《不会被机器替代的人：智能时代的生存策略》的书写过序言，我说我们可能低估了*人的*智能。


    我们这次要说的这本书，则是想让你进一步冷静一下。一般公众不但低估了人的智能，而且高估了人工智能。电视剧《西部世界》里面那样的机器人，跟现在高科技公司正在研发的那种人工智能，完全是两码事。我们在《生命
    3.0》那本书里看到的关于未来人工智能的种种设想，也都只是物理学家纯理论的设想。现在真实的人工智能其实应该叫“人工不智能”。Alpha Go 下赢了围棋这种事情，其实没什么大不了的。


    这也罢了，更严重的是，因为人们过分依赖计算机算法，反而带来了一系列社会问题。


    我们需要正确认识人工智能。这本书的作者梅瑞狄斯·布鲁萨德毕业于哈佛大学计算机系，拥有计算机和数学的学位，自己创造过好几个人工智能系统，在 MIT 媒体实验室工作过……而且她是一位女性。九十年代初，布鲁萨德从哈佛计算机系毕业的时候，传说只有六个女生拿到了计算机的学位
    – 而她只见过包括自己在内的三个，另外三个只是“传说”。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_89_3.png)


    布鲁萨德现在是纽约大学助理教授，同时她还是一个记者。而她这个记者是一种非常新型的记者，叫“数据记者”。数据记者的工作不是整天采访什么“大数据科学家”，而是自己直接从数据中挖掘故事。布鲁萨德做的事情，是自己编写一个个人工智能专家系统，让这个系统替她从各种数据库中发现规律，她从中获得洞见，写成报道。


    布鲁萨德是一个“用数据发现真相”的人。


    比如最近微博上有很多网友反映，说提供旅行预订服务的 App“携程”，会故意给自己的用户更高的报价、推荐很差的旅馆，以此不当牟利。一个普通记者听说这件事，会采访几个携程的用户，然后采访携程公司，用几个醒目的故事完成一篇报道。而一个数据记者，则会用科学的方法测试和搜集一系列携程的使用数据，用技术手段分析携程的推荐和定价算法，找到一般规律，再把分析结果用可视化的数据呈献给读者。通常这样的工作需要一个团队合作完成。


    数据记者，需要很强的技术水平和研究能力。考虑到“大数据”现在是个特别值钱的能力，而记者的工资又不高，我敢说中国很可能还没有真正的数据记者。但是社会需要数据记者。


    以前那种听说一个个案，写篇煽情报道，呼吁社会关注的新闻形式，很快就要过时了。如果某个医生对病人性骚扰，你要做的不仅仅是报道这个医生和这家医院。你应该深入调查全国所有的医院，设法搞到所有有关性骚扰投诉的数据，分析这些数据，写成一份全面的报告，这样才能让整个社会重视这件事，促进社会进步。


    记者这个职业的本质，就是要推动社会进步。为此，记者的工作方式是让那些“有决定权”的人，对自己的决定负责。


    布鲁萨德这个数据记者，最关心的是让那些已经在取代人类做决定的“算法”负责。她发现人们过于相信算法。算法都是人写的，人会犯错，算法就会犯错。


    布鲁萨德说她写这本书是为了给读者“赋能”――这正好也是我们“得到”在做的事情。我们希望读者通过这本书了解现行的 人工智能、机器学习、大数据都是怎么回事，了解计算机的本质是什么，从而对计算机和人工智能这些大词儿没有畏惧心理。


    现在的人非常爱说什么是“计算机改变了世界”，特别乔布斯，动不动就“这个产品再一次改变了世界……“


    布鲁萨德将会告诉你，其实计算机没有改变什么。社会还是这个社会，计算机并没有解决我们的社会问题。


    明天，我们从教育系统开始讲。


