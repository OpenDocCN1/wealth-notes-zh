- pgno: 8
  md: '给员工的人均带薪假和和保险福利是小公司的2.5倍。大企业给员工的人均退休金待遇是小公司的3.9倍。


    所以如果你打算做一个员工，应该首选进大企业。大企业员工连政治待遇都更好。美国大企业对员工成立工会更宽容，雇佣了更大比例的女性，也雇佣了更多的少数族裔。


    以前有人说美国大部分新的工作是小公司创造的，小公司解决就业的主力——现在这个说法已经被质疑了。有经济学家重新测算，从1976年到1982年，美国小公司制造的新工作数量只占所有新工作总数量的56%，同时小公司消灭的工作机会还很多，综合考虑，创造新就业岗位的主力还是大企业。


    还有，人们不是通常认为小公司创新能力更强吗？毕竟硅谷有大量小公司创业神话，什么几个高中生一夜暴富。但这里面可能有个“易得性偏误”，硅谷故事只不过更耀眼而已。真正创新的主力还是大企业。有经济学家做了计算，大企业投入在研发中的费用总额高于小公司的研发费用总额。而且，请注意，大企业的研发*效率*也更高——也就是每投入一美元研发，大企业获得的创新成果要比小公司高。


    那你说像乔布斯、比尔·盖茨这些人，不都是小公司创新的榜样吗？是，但是别忘了，他们当时之所以能创业成功，是站在了巨人的肩膀之上。乔布斯靠的是大公司建立的生态环境，比尔·盖茨指望的是IBM的订单。而且之所以现在人们把他俩当榜样，恰恰是因为他们的公司做……大了。


    两位作者认为，美国人之所以特别担心大企业，是因为美国建国之初就特别强调平等。美国人相信权力应该属于人民，而人民要想拥有可靠的权力，就必须拥有大致同等的财富才行。如果财富都集中在大企业手里，人民何谈权力呢？


    但事实更像是大企业给人民带来了财富。美国最富的地区，恰恰是大企业主导的。越是富有的地区，小公司和个体户反而越少。这个道理很简单，这是因为大企业创造财富的力量更强，自己留的利润率更低，给员工的工资、给社会交的税都更高。这就等于说大企业的财富分配更公平。


    我看这本书的观点，跟我以前读过的一本书叫《反节俭》（Against Thrift）对大企业观点是一致的。《反节俭》是经济历史学家詹姆斯·利文斯顿（James
    Livingston）的著作，他考察过去一百年多以来美国经济增长史，认为美国大企业对市场没有什么破坏作用。美国政府和美国大企业犯的错误，对经济的影响是微不足道的。利文斯顿也认为大企业其实是在刺激经济增长，是在促进创新，而且在这两个方面做得都比小公司好。


    但是这本书和我们专栏讲过的泰勒·科文的《自满阶级》一书很不一样，科文的默认观点是小公司带来创新和新工作，大企业阻碍创新。但是科文那本书的主题不是大企业，我理解他下的调研功夫可能没有这么大。


    最后，《大就是美》的两个作者说，如果我们强行限制大企业的发展，那就限制了美国的竞争优势。


    下面说说我的评论。


    # 3.特殊时期的特殊想法


    我有一个想法，中国70后到90后的这一拨人，很可能是赶上了一个历史特殊时期。我们这个时代最出风头的是互联网行业，而互联网行业里有非常多的小公司创业成功的故事。这个行业确实不需要很多人，几十个人弄个公司就能估值到上亿美金。


    “创业”，是这个时代最流行的词汇。但是你想过没有，咱们父辈那一代人，他们那时候可没有“创业”这个流行语。当然中国以前不是市场经济，但是在美国以前也没有创业的风潮。上一代美国人的理想生活就是在大企业工作，像通用电气、通用汽车、IBM这些公司就是美国人心目中的英雄公司。


    也许那才是“正常”的局面。


    互联网是个全新的技术，大公司反应慢，只有新技术才能给小创业公司机会。如果技术发展的潮流和市场方向已经确定了，那么同样投入研发，最厉害的肯定是大企业。大企业的技术积累、专利壁垒、人才的囤积，是小公司根本比不了的。


    我们是赶上了互联网——确切说信息技术这个新技术带来的一系列的新机会。如果过了信息技术这一波，下一个像互联网这种，门槛又低、赚钱又快的新技术是什么呢？可能没有了。未来的创新恐怕还是大企业为主导。当然现在的创新也是大企业主导，只不过互联网公司的曝光度更高而已。


    事实上现在互联网的整合也几乎完成了，就是几家公司独大，人工智能新概念也真不是高中生能在车库里玩的东西。那么我们可以设想，我们子女那一代，他们将来面临的情况恐怕是一抬头全是大企业，自己根本就没有创业机会。“创业”，是个特殊的历史时期的时代特色。


    那长此以往将会是什么局面？我大胆推测一下，大约有两种可能。


    一种可能是过一段时间之后又出现新的突破性的技术。那时候的聪明人在人工智能的帮助下，个人就拥有强大的研发能力，于是又是一波小公司创业神话。'
