  md: '# 日课135 | 体育真能锻炼品格吗？


    今天咱说一个可能会颠覆你的观念的研究。我先告诉你结论：让孩子练体育，对性格养成似乎可能没有影响，对孩子的未来没有可证的好处。而以我之见，这个结论似乎恐极。


    现在家长都会给孩子报各种文体训练班，什么体操、滑冰、钢琴、美术等等。美国因为大学录取会考虑课外活动，发展专长有战略考虑。中国没有这个说法，家长们的目地很单纯，就是培养意志品质，陶冶情操，让孩子成为一个全面的人才。


    这无疑是非常好的做法，有这样的家长何愁中国没有高级人才，还担心什么国产芯片。但是我也注意到一个现象。很多家长本人，小时候也花了好多时间苦练钢琴，可是他们现在都不玩了
    —— 钢琴似乎并没有改善他们的生活 —— 然后再他们逼着孩子练钢琴。


    那我就有一个问题，练这些东西到底有没有好处呢？有些家长把所有业余时间都用来陪伴孩子参加课外活动，那你付出这么多时间和金钱到底值不值得呢？


    我们专栏这两天正在讲战略，战略取舍得先往外看。我正好得知一项新研究，考察高中生练体育到底能不能锻炼品格。这是一篇2017年10月发表的论文[1]，研究者是杨百翰大学和奥克拉荷马大学的两个经济学家。


    这里说的体育不是学校规定的体育课，而是学生在课外参加的各种比较正规的训练，比如说加入篮球队。美国高中生练体育的非常多，56%的学生都参加了某种训练。


    # 1.科学问题


    我们一般的想法，练体育显然有好处。首先你的身体会更好，然后你的精神也会更好，你会更有耐心，你会养成好习惯，你会更善于团队合作，你会积极进取充满竞争意识，你还可能获得领导力……体育训练怎么可能没好处呢？


    但是别忘了练体育也可能有坏处。把时间花在体育上，你的学习时间就会被占用。你要是练得特别投入，就可能会受伤。你整天跟不学习就爱体育的孩子混，他们可能会影响你。


    而且如果不练体育，把时间花在别的地方，可能也能获得这些好处啊。


    所以体育到底有多大作用，不能光听体育老师怎么说。


    研究者首先提出一个科学标准：你说体育有好处，那这个好处必须能够体现出来才行。比如说，体育能让你身体更好吗？能让你学习成绩更好吗？能让你毕业以后的工资更高吗？如果对这些硬指标都没影响，那你说练体育能锻炼品格，你就说服不了我。


    这个研究的厉害之处在于，它使用了三个长期跟踪所得来的数据库。这种数据库是随机选择一大批孩子，在他们小的时候就调查，你的家庭情况怎么样，你学习成绩如何，你每周参加几次体育训练等等。得到数据先不用，先放着。一直跟踪这些孩子，不管他们去了哪里上高中上大学、去了哪里工作，每隔几年就找到他们再调查一遍，这样连续跟踪几十年，甚至要跟踪他们整整一生。


    这是几代研究者接力完成的调查。那你说为什么不直接采访一些老人，看他们的一生都是怎么过的？因为人的记忆根本不可靠。这种长期跟踪的数据才准确。据我所知咱们中国可能还没有这方面的研究，但是美国做了大量的积累。几十年前科学家等于是给今天的科学家铺好了路。


    # 2.相关和因果


    研究结果是这样的。如果你单纯看统计，那么高中时代经常参加体育训练的这些人，的确更有可能上大学，而且毕业以后收入也更高。平均而言，练体育的男生未来工资水平比不练体育的男生高15%，女生则是高12%。


    而且高中练体育的孩子长大以后的确更愿意去健身。练体育的女生成年以后身体更不容易发胖，但是男生没有这个减肥效应，有的反而更胖 —— 这可能是因为练体育的男生消耗大吃得也多
    —— 但不管如何，高中练体育的男生长大以后也更愿意经常健身锻炼。


    那么如此说来，结论不就是练体育有好处吗？且慢。请注意，这只是一种“相关性”。众所周知相关性不等于因果性。


    比如以前有个结论说喝红酒对身体有好处，因为你去考察那些经常喝红酒的人和那些不喝红酒的人，你发现喝红酒的人更健康。


    但问题是这也许并不是红酒的作用。能天天喝红酒的人肯定经济状况比较 AND 经济条件好的人本来身体就好。也许不是红酒*导致*他身体健康，而是经济条件好导致他既身体健康、又喝红酒。这就是说红酒和健康之间有个正的相关性，但不一定有因果关系。


    那么怎么确定体育和各种好处之间的因果关系呢？


    # 3.结论


    研究者把影响学生练体育的因素分成了两种。


    一种是“可观测因素”，包括经济条件、种族、平时学习成绩、父母的教育程度等等。另一种是“不可观测因素”，也就是各种所谓“品格”。


    这些可观测因素显然会影响孩子练体育。比如经济状况，肯定是家里能出得起时间和金钱，孩子才会去练体育。父母受教育程度高、至少父母比较靠谱，真的愿意照顾孩子，孩子才可能去练体育。而这样家庭生出来的孩子，智商也差不了。


    但是这些因素同时也影响了孩子未来的教育程度、收入、乃至身体健康。靠谱的家庭，靠谱的孩子，就会有靠谱的人生，可能这一切都跟体育没关系！


    所以科学的研究，你得考察那些同样满足这些可观测条件的孩子，其中有人选择练体育，有人选择不练体育 —— 看看这两种人有什么区别。


    研究者使用计量经济学的分析方法，得出结论是，如果排除可观测因素，那么练体育和不练体育的孩子，他们长大以后不管是教育程度也好、收入也好、健康程度也好，都没有什么区别。


    说白了，就是体育并没有*导致*更好的生活。这里面没有因果关系。


    其中只有一项指标是例外，那就是男生如果高中阶段经常练体育，那么这个行为，的确能*导致*他长大以后也会经常锻炼。但是对女生就全没有这个效果，女生高中练不练体育和将来是不是经常健身都是由外的硬条件决定的，二者之间没有因果关系。而且更进一步，虽然高中练体育能让男生更爱锻炼，但是并不能让他减肥。


    鉴于所有体育效应都是强烈地和可观测因素相关联，不可观测因素的影响很小，科学结论就是不能在体育和未来的好生活之间建立因果关系。


    你练，或者不练，你还是你。


    # 4.无用之功


    我看这篇论文感觉触目惊心。我认为这篇论文应该上各大新闻媒体的头条。


    这个研究就等于说，每天为孩子累死累活的这些家长，绝大多数是在做无用功。


    如果体育是这样的，那文艺呢？弹钢琴真的能带来艺术气质吗？小提琴真的能激发创造力吗？绘画真的能培养审美吗？把你的数据给我看看。可能不干这些干别的，也能获得这些素质
    —— 也可能就算干了这些也没获得什么素质。


    大妈跳广场舞和老头打太极拳，对身体真的有好处吗？到底是跳舞打拳使得他们身体好，还是本来就身体好的人才出来跳舞打拳？


    没有严肃的研究，你就不能*真*地知道*。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_44_0.png)'
