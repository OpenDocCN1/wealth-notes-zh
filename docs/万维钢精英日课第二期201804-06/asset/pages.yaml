  md: '# 日课159 | 《为什么》1: 洞见因果的三种思维


    日课159 | 《为什么》1:洞见因果..


    今天咱们开始说一本三月份刚刚出版的新书，《为什么：因果关系的新科学》(The Book of Why: The New Science of Cause and
    Effect)。这本书的作者是一位传奇人物，81岁的计算机科学家和哲学家朱迪亚·珀尔(Judea Pearl)。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_111_0.png)


    过去不到三十年的时间里，珀尔领导了一场统计学家和计算机科学家参与的“因果革命”，我们现在终于能看清楚了“因果关系”。研究方法非常数学化，但珀尔这本书是写给“聪明的外行”，我们只要理解思想就行。我相信这本书可以让你变得更聪明。你下点功夫琢磨这本书里的谶缪，就能掌握一个高级的思维套路。


    # 1.为什么要问为什么


    这本书研究的是“为什么”。每个人都会问“为什么”，那为什么要这么兴师动众地研究“为什么”呢？我给你举几个例子。


    有一种新药卖得很贵，调查发现几个月以来，吃了这个药的患者的恢复程度的确比没吃这个药的患者要好。那你能说这个药有效吗？也许有钱人的身体素质和医疗条件就是更好呢？


    公司上了一个新广告，销售量果然大增，你说这个广告做得好。然而一个经理说，现在正好是夏天，我们这个产品本来就适合夏天用。那到底是因为广告还是因为季节？


    有个公司录取的员工大部分都是男的。一位女权主义者说这个公司歧视女性，她有道理吗？


    你对现在的工作很不满，想要换个公司，你应该换吗？到底是你现在公司不行，还是你自己的处事能力不行？


    所有这些问题，归根结底，就是为什么。为什么结果是这样的，我们想知道这件事儿的*缘故*。回答为什么，就是要找到一个因果关系：A导致B。用数学符号表示，就是A→B。找到因果关系，才算理解这个事儿是怎么回事儿，才知道应该采取什么行动改变这个事儿。


    简单的世界里通常一个缘故导致一个结果。但是在复杂世界里你常常很难判断一件事情发生的缘故。可能这件事无缘无故就发生了，可能是几件事共同导致它发生，可能你觉得最有可能的那个缘故，恰恰跟它没关系。


    # 2.相关就够了吗？


    我们专栏的读者大概早就听说过一句话，叫“相关不是因果”。现在基于大数据和机器学习的AI技术兴起，很多人还爱说一句活，叫“相关就够了”。


    比如说，大数据分析告诉我们，当飓风侵袭某个地区的时候，那里的沃尔玛商店卖的一种草莓馅饼干的销量就会大增。这是什么呢？没人知道。但是有这个信息就够了，你看天气预报说要来飓风，你就多给草莓馅饼干备货，你何必问这个为什么呢？


    早在一百年以前，就有统计学家相信，科学的世界里根本没有什么因果。不要问为什么，所有知识都是相关性的，人的一切行为都是基于经验的！咱们专栏的好几个读者也曾经提出过这个想法，我们后面还会仔细论述这个想法，但是我现在要说就是这个想法错了。


    比如说你可能每天开车，我敢打赌你从来没有把车开到用完最后一滴油的时候。我们都是看着快没了就赶紧加油。


    好，那我问你，你凭什么相信是开车必须得用汽油呢？根本就没有多少数据支持“没有汽油就开不动车”这个假设。


    答案是因为你理解汽油和开车之间的因果关系。你不需要开到没有油的经验，你的大数据分析根本就看不出来汽车没油走不了——因果关系是比大数据更基本的东西。珀尔有句名言：“数据是极度愚蠢的。”


    ![](img/a2c55447bc97d25d1622d2d734d5541b_111_1.png)


    我们前面刚刚讲完《人工不智能》这本书，我们知道现在所谓的AI，本质上就是机器学习。珀尔是机器学习技术的开山鼻祖之一，但他也是这种AI最激烈的批评者。珀尔要做的，是让计算机学会因果关系，让AI真正理解它在干什么。这条路非常非常难，这是一条革命之路。


    为此我们要建立所谓“因果模型”。但在此之前，我们先研究一下因果思维到底是怎么回事。


    珀尔把因果思维一共分为三个等级。先别管AI，咱们先看看人类的思维到了什么程度。


    # 3.三级因果思维


    第一级思维叫“观察”，是通过数据分析做出预测。


    你的生活经验表明下雨会把衣服淋湿，所以下次下雨你最好打伞，这就是观察思维。观察是寻找变量之间的相关性，观察就是积累经验。


    现在所有实用AI技术都是基于这个第一级思维。AlphaGo下围棋，并不是它理解这步棋有什么用，它只不过知道走这步赢棋的概率会更大。


    比如你开个便利店，有卖牙膏和牙线。观察思维问的问题是，如果一个顾客买牙膏的话，他有多大的概率同时也买牙线呢？如果你学过概率论，你知道这个问题的数学表达式是这样的——


    ```

    P(牙线 | 牙膏)

    ```


    请原谅我还是写了一个数学公式，这不是故弄玄虚，等一会儿我们要跟另一个公式对比。这个公式的意思就是假设已经买了牙膏，求买牙线的概率是多少。这个知识对你很有用，你可以判断要不要把牙线和牙膏放一起，它们应该按什么比例进货。


    所有动物都有观察思维的能力。观察思维已经能解决很多问题，但是远远不够。


    第二级思维叫“干预”，是预判一个行动的结果。


    干预，是说如果我现在把牙膏的价格给提高一倍，对牙线的销量会有什么影响？


    这不是以住的数据所能告诉你的。是，以前可能发生过牙膏价格是现在一倍的情况，但是你不能用以前那个经验预测现在这个行动的结果。因为以前牙膏价格高，是因为别的缘故。可能当时牙膏紧缺才卖得贵。


    现在我们说的是，不管别人家牙膏卖多少钱，你*单方面*采取行动，*刻意地*干预牙膏价格，对牙线的销量有什么影响。这种事儿从来都没发生过。


    想知道结果，最好的办法是做实验。互联网公司一直都在做各种“A/B测试”，看看哪个标题能吸引更多点击，什么颜色的网页能让用户停留时间更长，都是用分组测试的方法。测试是主动的干预。


    从概率角度来说，我们要研究的就是不是前面说的那个P(牙线 | 牙膏)，而是


    ```

    P(牙线 | do(牙膏))

    ```


    其中这个do是一个数学算符，它的意思就是做一个干预动作。'
