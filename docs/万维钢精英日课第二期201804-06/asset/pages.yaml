  md: '# 特别放送 | 通往品格之路


    特别放送 | 通往品格之路


    万维钢


    今天的主题，我借用了咱们专栏一位老朋友、也是我最喜欢作家之一、戴维·布鲁克斯的一本书的名字：《通往品格之路》。提到品格，你会想到勤奋、谦虚、刻苦、宽容......等等，但今天为你总结的，是更高标准的“品格”——精英的品格。你仍然还能从今天的内容中看到关于勤奋、谦虚、刻苦、宽容等等这些词，但是咱们日课，给它们赋予了一个更高的标准，或者更深刻的内涵。我希望你能通过看文章的方式重温一次，因为品格就是一种精英素质，只有想做大事的人、想跟别人不一样的人才用得上它，而你正好就是这样的人。精英日课，祝你每天都有收获。


    # ◆ 谦卑


    ◆ 谦卑，是一种美德。而且还不是一般的美德。以我的阅读经验来看，“谦卑”在英文世界被越抬越高，已经到了精英人士最值得拥有的美德中排名第一的位置。


    社会科学作家梅丽莎·达尔（Melissa Dahl）在Aeon上的一篇文章 [1]，她也讲了“自我关怀”，但是她把“自我关怀”中的那个“朋友”，用“别人”代替。


    “别人”，是个更中性的词。这样一替换，就等于是看待自己就好像看待别人一样。如果按这么理解，那“自我关怀”也许更应该叫“自我不关怀”。事实是你跟别人没有这么本质的区别。你犯过愚蠢的错误，别
    人也犯过愚蠢的错误，每个人都差不多。


    真正的谦卑不是故作姿态，其实是理性的思考的必然。我们专栏以前有篇文章叫《不特殊论者》，其实说的就是这个意思。如果你真的理解科学知识，你会注意到地球在宇宙中、生命在自然界、人在生物界、你在人群中，都不特殊。


    你当然很重要，但是别人也重要。有这样的谦卑态度，人的情绪就会特别稳定，就不会进退失据。达尔引用了一项研究 [2]，说通过回忆自己在高中时候的尴尬时刻——并且意识到每个人都有这样的时刻——然后一笑了之，能够培养这种谦卑意识。


    ◆ 怎样才是一个好的指挥官？威林克首先想到的是“谦卑”。威林克回到本土负责整个西海岸海豹突击队的训练，他故意超高难度的环境和任务压迫部队，一直把所有队伍都压垮为止——其中一项重点考察就是看各个小队的指挥官怎么反应，不行的就淘汰。


    威林克发现，最后被淘汰的指挥官，几乎没有人是因为军事技术或者体能不行，而都是领导力不行。其中最缺少的一个素质，就是谦卑。


    这里“谦卑”对应的英文是 humility 和 humble，并不是说对领导毕恭毕敬的意思，而是你这个人听得进去别人的话，有开放的头脑，能时刻学习。


    训练任务是故意让所有队伍都失败。有谦卑素质的指挥官回来，首先先责任归于自己。是我没控制好，我输了，咱们能不能复盘一下，看看我哪个地方做的不对。然后你给他指出不足，他马上记在笔记本上。


    而对比之下，做慢自大的指挥官回来先指责别人，反正自己没错，他好像什么都知道——其实他连诚实的自我评估都做不到。


    那么威林克是怎么自我评估的呢？这个方法我在别的地方也看到过，非常值得借鉴——那就是你要以一个第三人称的视角，旁观自己。


    你正在做这件事，但是你能够时不时的跳出自己的身体，去观察你自己：我是不是生气了？我是不是太情绪用事了？我是不是反应过度了？


    这个其实就有点像咱们中国人说的“当局者迷旁观者清”，这等于于是自己给自己提供即时反馈。做到这一点非常困难，这要求你在即使投入全部身心的情况下，仍然能在心里保持一个冷静的声音，给自己提个醒。我看这大概就是“谦卑”的最高境界。


    ◆ 宇宙学视角的一个重要意义就是让我们谦卑一点。


    泰森说，比如你观察小孩。小孩总是把身边身上一小事儿当成天大的事儿。玩具坏了，他就哭闹。膝盖擦破一点皮，他就大喊大叫。他们以为自己是世界的中心，因为他们经验太少，不知道世界上存比这些大得多的事儿。


    那我们作为大人，是不是也有同样幼稚的想法呢？我们是不是也会不自觉地认为世界应该绕着自己转呢？别人跟你信仰不同，你就要打击；别人跟你政治观点不一样，你就要控制。如果你有点宇宙学视角，你可能会觉得人跟人的区别不但不是坏事，反而还值得珍视。


    探索宇宙可能会给我们带来一些实际的物质好处，也可能纯粹是因为有趣。但是泰森说，探索宇宙还有一个功能，就是让我们保持把目光放远的态度。


    如果你只看自己这一亩三分地，你慢慢总会认为世界就应该绕着你转，你一定会变得无知和自大。愿意外探索，实在是在事关谦卑的美德。


    # ◆ 自律


    ◆ 我们这个时代以自由挥洒的个性为荣。《非诚勿扰》的男女嘉宾做自我介绍的时候，经常说“我是一个吃货”。我想他们的意思是“我是 一个真诚的人，真诚地面对生活，想吃就吃。”


    敢于大胆说出自己的追求，的确是可爱的个性！但是最好别过度。喜欢美食和贪吃是两码事。有个词也许比“吃货”更能显个性——“自律”。


    我们可以提出一个概念，叫做“满足感管理”。


    有满足感管理想认识的人，不让自己轻易满足，讲究适可而止。就餐这东西再好吃，也不要吃得满足为止，最好吃到意犹未尽就停止。这样做不是为了保持体形，而是是为了让满足感的阈值保持在一个比较低的水平。


    因为我们知道，一旦放纵满足感，就可能一次比一次不容易满足。因为他的满足感阈值越来越高，他越来越不容易被满足！一个永不满足、永远都在追求各种低层次享乐的人，心情怎么可能愉快呢？


    ◆ 威林克在海豹突击队服役二十年，参与过伊拉克战争，回来以后负责西海岸所有海豹突击队队员的训练，退役以后跟人合开了一家咨询公司，专门向商界传授军队 的领导力和管理经验。


    威林克的正常习惯是每天早上4:45起床做事。他早早就退役了，但是保留了特种部队的纪律，还能连续做了76个俯卧撑。威林克说早起能让他获得一种在心理上战胜了敌人
    的感觉。


    他总觉得世界上的某个地方有个敌人，一手拿着冲锋枪一手拿着手榴弹，等着跟他交锋。他已经不在军队，将来不会再上战场了，但是他总觉得有一天还会面对敌人。每天早上
    一睡醒，他就问自己，我现在做什么，才能为那个时刻做好准备？然后他就起来了。


    威林克这个精神，感染了很多人。现 在Twitter上就有人组成了一个“4:45起床俱乐部”（Twitter标签是 #0445club）！


    早起也是自律的体现。威林克的座右铭是“自律 = 自由”——你为了获得真正的自由，就非得给自己设定一些限制。所谓“真正的自由”，也就是财务自由、时间自由、免于疾病和贫困的自由，为了达到这样的目标你必须自律才行。


    如果你是个特别自律的人，每天面对各种限制，有各种固定流程，你每时每刻都*知道*自己*应该*干什么，你反而获得了一种自主的感觉。


    # ◆ 坚持


    ◆ 面对各种挫折和困难永不放弃，能长期坚持下来，是成功者必备的素质。长期的坚持不是来自体能和意志力，而是来自乐观的精神，来自我们给自己讲的故事。故事都是虚构的，但是故事提供了工作和人生的意义。


    给自己讲个好故事，找到工作和生活的意义，保持乐观的精神，这是能坚持下来的前提条件。然后你再把大目标分解为各种小任务，把每个任务都游戏化，随机奖励自己，获得掌控感，用一个个小胜利慢慢积累进步，让自己沉浸其中。'
