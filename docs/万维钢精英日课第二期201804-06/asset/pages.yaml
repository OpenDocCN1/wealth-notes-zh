  md: '# 日课134 | 《超越曲棍球战略》2:真实世界的战略格局


    今天咱们继续说《超越曲棍球杆的战略》这本书。上一讲我们说到，战略决策要“往外看”，要考虑市场上其他公司、其他行业都是什么情况。一旦睁开眼睛看世界，你就会迫切地感受到战略选择是多么重要。


    咱们先来看一张图——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_42_0.png)


    这张图是2010到2015年智能手机的几大品牌的利润分布。以2015年为例，这一年的智能手机行业的总利润，是怎么分配的呢？


    苹果拿走了92%，三星拿走了14%。只有这两个家手机公司是真正盈利的。苹果和三星的利润就已经超过100%了，这是怎么回事呢？这是因为剩下的那些手机公司里面，有些公司不但不盈利，而且是在赔钱。


    我刚刚查到2017年的最新数据 [1]，苹果的利润占有率略有下降，拿了79%；三星拿到18%，然后中国的华为进步很大，以前都是不盈利，现在拿了6%。剩下的那些公司还是不挣钱。


    中国手机三大品牌，华为、小米和OPPO在全世界范围内的市场占有率也是很高的，三家加起来超过了20% —— 但是真正盈利的，只有一个华为。小米和OPPO或者挣的钱非常少，或者还在赔钱。


    我们看满大街的手机品牌，感觉这好象是一个百花齐放各显身手的行业。而实际上，智能手机行业，是一个贫富极度不均、甚至可以说胜者通吃的世界。只有苹果、三星和华为三家公司在瓜分利润，其他品牌都是勉强维持，有的甚至可以说纯粹就是在烧投资人的钱。


    这个局面并不仅仅限于手机行业。


    这本书的三位作者都是麦肯锡的人，麦肯锡有很多好的企业数据。衡量公司的指标有很多，作者选择了一个最根本的标准：利润。作者计算，麦肯锡数据库里最大的2393家公司，从2010年到2014年，总共有93亿美金的总利润，相当于总投资的9.9%。但是考虑到投资者要求的利息大概是8%，那么扣除利息之后的利润
    —— 叫“经济利润”，是所有2393个大公司的总和只有18亿美元。


    而这18亿美元还不是均匀分布。我们看看这张图——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_42_1.png)


    图中把所有公司按盈利多少分成五组，最左边一组是赔钱的，最右边一组是盈利的，中间三组都是勉强维持。整个曲线呈“幂律”分布 —— 中间非常平稳，两头极其陡峭，靠近粋点的那些公司的利润是指数上升。


    这是一个多数公司平庸，少数公司走极端 的局面。从图中我们可以看出几个特点。


    第一，头部公司拿走了90%的利润。麦肯锡这份统计里利润最高的公司有苹果、微软、中国电信、三星和沃尔玛等等，正如在手机领域挣钱的其实只有苹果跟三星。


    第二，平庸公司的利润非常低。位于曲线中部的那些公司，平均利润率只有2%。


    这说明什么呢？说明市场非常有效。我们专栏前面讲《不充分均衡》这本书的时候讲过一个概念叫“有效市场”。最极端的有效市场，就是你不管干什么话都是一样的，投入都等于产出，把钱投给任何一个公司都等于把钱存在银行里，所有公司的实际利润都是零。我们看看处在曲线中部的这些平庸公司，只拿到一个2%的利润率，市场对它们来说就是有效的。


    也就是说，这些平庸公司只是维持运营。把产品卖掉获得一些收入，然后扣除运营成本、给员工发完工资、给高管发完奖金、给投资者发完利息，剩下的就没有什么了。是，这些公司养活了很多
    人，服务了社会，但是它们仅仅是这些人吃饭的地方，它们并不真的增长财富。人们辛辛苦苦工作，只不过是维持生活。


    所以对绝大多数公司来说，哪有什么曲棍球杆一样的增长。多数情况是今年投了钱，项目过两年就无人过问了，谁会期望奇迹发生。


    第三，曲线还可能会越来越陡峭。对大多数公司来说市场是有效的，可是对头部公司来说市场是无效的。它们不用薄利就能多销，它们的竞争对手 —— 严格地说根本就不能叫“对手”，只能叫“同行”
    —— 薄利也不能多销。这些公司或者拥有独一无二的核心技术，或者拥有不可模仿的品牌，或者拥有特殊关系的地位，它们的优势将来还可能还会进一步增大。


    你看看这张图，心中一定会有很多感慨。我觉得最重要一个感慨就是；到底什么叫战略。


    所谓战略，就是你在这张图上是一个什么位置。所谓好的战略，就是我怎么才能在这张图上往右侧移动一下。我能不能从平庸公司变成挣钱公司。


    而这种移动的可能性并不是很大。这本书里没说，但是我查了一下作者发表在《麦肯锡季刊》上的原始报告 [2]，找到下面这张图 ——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_42_2.png)


    如果你是一个位于曲线中部这三个区间的公司，你能上 升到头部的概率只有8%。还有14%的可能性会从中间掉入到尾部去。剩下78%的平庸公司，都是惰性一年一年地维持。


    难道那些平庸公司的员工就不努力工作吗？他们跟别人一样努力，也许还要更努力。他们只不过没有占接到好的战略地位。


    中国有句话叫“一将无能累死三军”，就是这个意思。作为战略负责人，你要做的就是把企业带到曲线上好位置上去，让大家跟着你能赚到钱。


    那好战略怎么选呢？根据这个报告，可能最重要的是先选对行业。咱们看看不同行业的利润分布图 ——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_42_3.png)


    软件业的利润排第一，硬件和存储设备行业排第二，接下来是烟草业，然后是非洲洲通讯业、互联网业等等，这些行业是真正盈利的。反过来来说，像电力、建筑材料、石油这些传统行业，至少从麦肯锡这个报告来说，是赔钱的。


    三位作者说，想要盈利，选对了行业，你就选对了50%。在一个平庸的行业做领先的位置，你还不如在一个领先的行业做一个一般的公司。


    那你可能说，公司哪能随随便便改变行业，我们应该只和本行业的公司比。但是作者说，你要知道，资本是不考虑行业的。哪个行业利润高，资本就会去哪个行业。这大概就是为什么现在一说风险投资就是跟计算
    机和互联网有关。


    更实际的战略操作咱们下次再说，今天主要还是说这个“外部视野”的观念。麦肯锡'
