  md: '# 日课125 | 《规模》2:身体里的分形


    日课125 | 《规模》2:身体...


    今天咱们继续说韦斯特的《规模》这本书。这一讲的难度有点大，我们要了解有关生物体的尺度分析。这是韦斯特本人非常得意的一个成果，而理解了这个成果，你就能继续理解生物的生长和衰老，乃至于后面要讲的公司和城市的规模问题。


    据说数学家安德鲁·怀尔斯（ Andrew Wiles）在证明了费马大定理之后，跟人说如果他要去一个荒岛住几天，他可以什么都不带，只带上自己那份证明——因为费马大定理的证明里面包含了很多现代数学的漂亮思想，适合经常拿出来赏玩。我们今天要说的韦斯特的成果，也有点这个意思。你要是理解了，没事儿琢磨琢磨，是一种精神享受。


    但是一个通俗专栏不可能把其中所有生物学和数学的细节在一期节目里讲清楚，我们只能大概地了解一下其中的逻辑。我们默认你是外行，但你是一个“聪明的”外行，这样你就好像球迷看球一样，也能够略一点门道。


    而且我们还有一项高级任务。有个特别流行的数学概念叫“分形”——而今天，我们要学习怎么量化计算分形的“维度”。


    # 1.生物学的神秘数字，“4”


    生物学里有个概念叫“基础代谢率”，意思是维持一个生命体所需的最Serious最低能量消耗。比如果说一个人，他一天除了吃饭什么都不做，把能量消耗降到最低，那么他要维持生命，需要摄入的食物热量，大概是2000卡路里，这里是人的基础代谢率。这个能耗相当低，也就相当于一个90瓦的灯泡。


    生物学家考察了不同大小的各种生物，发现它们的基础代谢率基本上只和体重有关。第一个把这件事做系统研究的是生理学家马克思·克莱博（ Max kleiber），他在1932年发了一篇论文，发现生物的基础代谢率，和体重的3/4次方成正比。


    后人又陆续调查了各种生物的基础代谢率，从最小的单细胞生物和细菌，到最大的大象和鲸鱼，身体大小跨越27个数量级——也就是说其中最大的生物的体重是最小生物的10^27倍——结果，它们都满足这个k=3/4的标度率。


    下面这张图，是其中一部分结果——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_16_0.png)


    我们看在对数坐标图上，各种动物大致排成一条直线。这条直线的斜率是3/4：基础代谢率正比于体重的3/4次方。


    大象体重是老鼠的一万倍，而大象的基础代谢率只有老鼠的一千倍。说白了，就是体重轻的动物吃很多东西但是不长肉；体重重的动物，它单位体重的能耗，反而更低。


    后来生物学家又发现了好几个类似的标度率，比如说——


    +   * 脑容量跟体重的3/4次方成正比——体重越重，脑子越大，但是体重长得比脑子快；

    * 心率跟体重的 -1/4次方成正比——体重越重，心率越慢；

    * 寿命跟体重的1/4次方成正比——体重越重，寿命越高……


    等等。总而言之就是什么都是体重决定的（幸好智商不完全*是体重决定的），你只要告诉科学家这种动物的典型体重是多少，韦斯特就能告诉你它的生长速度、寿命、各种速度大概是多少。


    所以你要幻想一个什么怪兽不能随便宜幻想。冥冥之中，生物界有这么一些定数。


    但是问题来了。3/4也好，1/4也好，这些数字都是怎么来的呢？为什么分母都有一个“4”呢？多年以来，生物学家只是通过统计方法得知有这些标度率，但是没有人知道为什么会是这样。


    结果是物理学家韦斯特出手，跟两个生物学家合作，把这个问题解决了。


    其实前面说的各种指标互相之间都有联系，所以你只要能解释其中一个4，你就解释了所有的4。那这一个4是从哪来的呢？


    我们上一讲中用到了很多k=2/3的标度率，其中那个3是怎么来的很清楚——因为空间是3维的、体积是长度的立方，对吧？那生物体的标度率既然有个4，是不是说，生物体之中，有什么东西是4维的呢？


    不错，3维空间中，也会有4维的东西！这就是分形。


    # 2.分形的维度


    作为科学爱好者，你肯定早就听说过“分形”了。简单地说，分形结构，就是你把这个东西的局部放大，发现它和它的整体很相似，再找个局部再放大，又跟刚才很相似，可以这么一直下去，也就是“自相似”。像海岸线、树枝、树叶都具有分形的特点。下面是一片叶子——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_16_1.png)


    从中选择一个局部（红框）放大，也像是一片叶子。再来看一个抽象但是严格的分形——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_16_2.png)


    这条想象中的曲线任何一部分都是一样的形状，不管你怎么放大都可以。这个曲线叫做“科赫曲线（ Koch curve）”，它的生成方法下面这样的——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_16_3.png)


    先取一条直线，把它三等分，然后在中间的线段向外突出一个三角形。然后再对新的每一条边做这个操作，以此类推，以至于无穷。


    好，这就是最基本的分形概念。现在我们要做的是测量分形的“维度”。为此，咱们先看看“正常”形状的维度是怎么算的。


    看下面这个示意圖。把一条线段2等分，你就得到两条线段。把一个正方形的边2等分，你就得到4个正方形。把一个立方体的边2等分，你就得到8个立方体。其中4和8，分别是2的2次方和2的3次方。——这个“2次”和“3次”，就是正方形和立方体的“维度”。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_16_4.png)


    现在咱们把这个概念推广一下。以此类推，如果你把一个东西的边，分成r等分，你就得到了N个小东西，然后'
