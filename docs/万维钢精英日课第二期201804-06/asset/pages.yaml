    最终的判决决定恐怕不能交给AI。现在的经验是陪审团更愿意听人的意见，而不是听AI的。但是AI可以提供参考意见，方便法官和律师。更重要的是像自动驾驶汽车这种需要在路上随时做决定的系统，机械化的方法有利于AI做出有利于自己的道德判断。


    我们无法想象一个AI说了算的世界。让人做决定，有个好处是能随时反应社会规范的变化，甚至能通过一个判决去改变社会规范。


    像自由恋爱，一百多年前中国的可能是不允许的。我们设想，当时有一对青年男女因为自由恋爱而私奔，AI会根据法律条文判定二人有罪。但是辩护律师思想很新潮，谏慨陈词，说自由恋爱无罪！因为跟现有的法律条文不符，官司一直打到了最高法院，最后大法官表决，自由恋爱的确无罪！中国就能因为这一个案件而进步……当然，这种事情在美国历史上发生过，在中国历史上没发生过。


