  md: '# 日课156 | 《人工不智能》5:软件开发的六个经验


    日课156 | 《人工不智能》5...


    今天咱们把布鲁萨德的《人工不智能》这本书给讲完。这本书的主题就是反对技术沙文主义，破除人们对计算机技术的迷信。


    前面我们讲了人工智能技术的种种缺陷。

    最后我们结合布鲁萨德本人的经历，把“软件开发”，也给来个去神秘化。


    这年头如果你说你是个建筑工人专门负责砌墙，人家就会觉得你很一般。如果你说你是个程序员专门开发软件，人们就对你肃然起敬。那砌墙和写程序到底有什么本质区别呢？


    今天我们一提软件开发，总觉得这是高科技、充满创新精神、动不动就一夜暴富。

    可是你要知道，计算机这种东西上世纪50年代就已经有了，现代人已经跟计算机生活了很多年，软件开发根本就不是什么新行业。


    而即便如此，这个行业还是不靠谱。比如你参加一个会议，好像每个人做报告之前永远都得花十分钟调试设备，才能用会场投影仪把自己的 PPT 正确显示出来。你平时用电脑也就看个电影，可还是得整天搁升级之类的系统维护。


    所以软件开发是个特殊的行业。布鲁萨德分享了自己的经验，我把这些经验总结成六条。如果用一句话概括这些经验，那就是软件开发不是生产线流水线那种标准化的操作，它更像是一门匠人式的手艺。


    # 1.创业大巴


    布鲁萨德参加过一次创业大赛，叫“创业大巴（Startup Bus）。比赛过程是各团队坐上主办者提供的大巴，在三天的时间内，从美国各地前往同一个地点。车一边开你们一边编程，最后看哪个团队的产品好，可以得到金钱奖励。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_103_0.png)


    ![](img/a2c55447bc97d25d1622d2d734d5541b_103_1.png)


    像这种创业大赛都号称要孵化真正的公司，而事实上大家心里都明白，根本就没有哪个项目最后真的推向了市场，人们只是假装运作一个公司。


    什么项目可得奖呢？首先它不能太大，得在三天内能做完可行。其 cikk... 再者，你这个项目最好跟当前的技术热点有点联系，比如有人说我们要做一个虚拟现实的舞会应用，评委肯定赞成一当然，前提是你得能在三天之内做出此来。


    # 2.人工 + 智能


    后来布鲁萨德真的开发了一个能用的软件系统，叫 Bailiwick。这个系统能通过自动的数据分析，帮记者寻找新闻线索。布鲁萨德关注的领域是美国政治竞选的经费使用。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_103_2.png)


    # 3.实操的成本


    正所谓不当家不知柴米贵，布鲁萨德拉起人马开发自己的软件，感觉做事真是不容易啊。她本来想弄一个有色人种组成的纯女性团队，结果发现优秀人才实在不好找也...'
