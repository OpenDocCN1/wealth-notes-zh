  md: '作对比的研究非常之多，有人综合分析了141项这样的研究，结论是两点 ——


    +   1. 独生子女有优势：他们对成就的野心更大、自尊心更强、跟家长的关系更好；


    +   2. 在成熟度、合作精神、自控力、感情稳定度、社交参与度、外向度和受欢迎程度方面，独生子女跟其他孩子没有任何区别。


    这些研究大都是美国的数据，那中国独生子女有问题吗？也没有。科学家专门研究了中国独生子女，结论是，在性格方面，“不存在独生子女效应”。


    可能人们猜测有独生子女效应是因为觉得独生子女没有伙伴 —— 但是别忘了，孩子在学校里能获得充分的同辈社交机会。


    # 7) 父母离婚会毁掉孩子一生


    幸福的婚姻是相似的，不幸的婚姻中绝大多数是为了孩子而维持。育儿专家说离婚对孩子影响特别不好，甚至可能毁了孩子一生，这对不对呢？


    请注意，美国一半的孩子都在十八岁以前经历过父母离婚的剧情。这些孩子没有被毁掉。


    科学家综合分析了67项有关离婚对孩子影响的研究，结论是的确有影响，但是影响并不大。父母离婚对孩子的心理和行为的影响是比较小的，对孩子学习成绩的影响就更小了。而且考虑到贫困家庭更容易离婚，排除贫困因素，离婚对孩子学习成绩的影响就更加小。


    更进一步，离婚家庭的孩子之所以有一定的心理问题，也许不是因为离婚动作本身，而是因为父母经常争吵。那假设父母已经经常争吵了，离婚好还是不离婚好呢？答案是这样的家庭离不离婚对孩子的影响非常小，但总体而言，离婚比不离好
    —— 孩子宁可只跟一位家长生活，也不愿意整天看打仗。


    离婚技巧也是一个问题。科学家相信，如果离婚之前好好跟孩子谈谈，孩子将会更容易面对。


    # 8) 打孩子


    在说这个迷思之前咱们先说另一个迷思：美国人打孩子吗？咱們中国很多人认为美国家长打孩子是违法行为，美国人不打孩子。其实不是这样的。


    法律规定是虐待孩子不行，而日常打孩子，只要孩子不受伤，是合法的。美国人民依法享有选举、言论自由、持枪和打孩子的权利。69%的美国人认为打孩子是合理的教育手段。90%的美国儿童家长曾经在过去一年内体罚过孩子，而且平均每个月一次。有一些家长甚至还打过婴儿。


    那打孩子有效吗？得分长期和短期。


    短期内制止孩子的一个错误行为，科学的研究表明，打，比单纯讲理有效。但是如果你是想让孩子吸取教训，从此一生中都不这么做，追求长期疗效，那么科学结论是打孩子没有好处。


    而且如果打多了还有坏处，会伤害亲子关系，对孩子性格有危害。但是如果打的比较轻微或者中等，有没有坏处，现在研究还有争议。


    # 9) 性格跟出生顺序


    文艺作品里通常是老大稳重勤勉，中间的孩子懒情，最小的孩子外向而又积极……真实情况是出生顺序对性格的影响非常小。这里没有细说，但是科学家也承认有一 —— 微弱的
    —— 影响。


    # 10) 不应该给孩子物质奖励


    如果你想鼓励孩子某一个行为，比如说倒垃圾、好好学习、整理房间，是否可以使用金钱或者别的东西物质奖励呢？如果大家都是理性人，经济学规律应该起作用，物质鼓励似乎是可行的。


    这本书的说法，跟我以前了解的有出入。这本书认为物质鼓励可行。这个理由是初期孩子可能因为物质鼓励而这么做，但是他慢慢会养成习惯，然后你即使撤销这个鼓励，他还会继续这么做。


    我以前听说这招对鼓励幼儿学习独立大小便很有效，但是对高中生倒垃圾无效 —— 因为高中生有思想，他认为靠倒垃圾挣父母的零钱直是耻辱。


    所以这里姑且存疑，这个问题太复杂，应该具体情况具体分析。


    通过这十个迷思的解读，你是否有一 种感觉 —— 孩子是一种非常经得起折腾的东西。让他哭也好、吃糖也好、哪怕你离婚也好，你基本上折腾不坏他们。并不是我故意挑选了这样的迷思，书中其他四十个迷思破解了也能减少你的焦虑感。我理解这显然是进化的设定。现代人的生活比过去稳定多了，过去的孩子受那么多苦都没问题，又怎么可能被你用合法手段搞毁一生。


    当然这些研究同时也告诉我们，你想把孩子给养好了折腾，也很难很难。所以基本上父母没有那么容易干预孩子的成长。


    还是那句话：你是什么人，比你对孩子做什么，重要得多。做人难，但是做家长没那么难。不要整天战战兢兢做蝴蝶得咯的样子，这不是伴君如伴虎的事儿。


    万维钢


