  md: '也实在是贵，最后团队是三男两女。


    布鲁萨德的第三条经验是你没有办法估计项目完成时间。


    砌墙这个活的好处是工作速度是固定的，人手增加一倍完成时间就能缩短一半一但是软件开发不行。任何软件都是*新的*软件，特别是如果你要的是以前没有实现过的功能，那也就是每个人都是第一次做。没人能预期中间会有什么困难，没人能估计需要多长时间做完。


    第四条经验是一个人犯的错误，全团队都受影响。


    软件开发是一环套一环，有很多全局性的东西，不能隔离分工。布鲁萨德在程序里犯了一个错误，又没做好版本控制，结果把所有人的工作都耽误了。


    第五条经验叫 “MVP（Minimum Viable Product）”，也就是最低可行产品。


    软件产品，你不需要把什么东西都搞得非常成熟了再推向市场。你应该先做一个最低可行的产品，只有最基本的功能，勉强能用，只要能给人展示，也就行了。


    你要做的是先把这个最低可行产品投掷出去再说。只要能吸引到一部分消费者或者投资人，你就有钱搞进一步开发，逐渐完善这个软件。房子住进去人了不能总改，但是软件可以慢慢升级。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_104_0.png)


    你不是非得造好一辆汽车才交付用户。你可以先给用户造个滑板先用着，然后慢慢升级到自行车、摩托车，最后才是汽车。这样你有充分的资金支持，允许逐步提高水平。


    布鲁萨德的第六条经验是人工成本其实是用了一般人想象不到的地方。


    软件开发中，60%的开发费用和70%的人工都用在了日常的软件维护上，而不是最初写的那些代码。


    以前我听说过一句话叫 “哪怕一个程序只有三行代码，它将来也会需要维护。”


    ![](img/a2c55447bc97d25d1622d2d734d5541b_104_1.png)


    哪怕你说这个软件已经做成了，不需要新功能了，你还是得花钱找人维护它。计算机硬件会升级、操作系统会升级，你的软件就必须得跟着升级，这还不算用户随时的新错误。有些软件之所以好好的就被公司给下线了，就是因为维护成本太高。


    作为一个调查记者和大学教授，布鲁萨德并没有开发过什么特别大的软件和人工智能系统。也许咱们读者就有更好的经验，欢迎你在留言区分享！


    但是我们从布鲁萨德的这些经验中也能看出软件行业的一些特点。并不是所有软件都能达到什么 “颠覆式创新”，甚至很多软件根本就没市场——但 Ch 有一点你得承认：每个软件都是新的。程序员是个永远都在做新东西的职业。他们真不是砌墙，他们就好像搞艺术创作一样，讲究手艺。


