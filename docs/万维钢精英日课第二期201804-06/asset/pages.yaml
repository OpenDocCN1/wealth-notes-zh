  md: '# 日课146 | 《andy与木匠》

    5:专注力的竞赛


    日课146 | 《园丁与木匠》5:专...


    今天咱们继续说高普尼克的《园丁与木匠》。上周我们讲了六岁以前幼儿的成长，这一讲的主题是从六岁上学到青春期之前，孩子大脑发育和学习方式的变化。


    人人都知道上学重要，但是对儿童脑发育的知识，一般人了解的太少了。这可能也是因为这些知识才刚刚研究出来。


    你知道人的一生中，大脑最理智、最平静是什么时候吗？你肯定想不到，答案是八岁。


    六岁以后，青春期以前，是一个非常特殊的时期。六岁以前儿童的大脑特点是混乱，而进入青春期之后，大脑会再次变得混乱，甚至疯狂。两者中间的这段时间，大脑非常平静。


    这段时间很适合学习。


    # 1.学习模式的转换


    我们前面讲了，六岁以前幼儿的主要任务是探索，现在我们把这种学习模式称为“发现式学习（Discovery Learning）”。通过模仿、听讲和玩，孩子们尽可能地探索周围的世界，不设限制。幼儿最需要学习的是这个世界上的东西都是怎样运行的，周围的人都在想什么。


    六岁以后，发现式学习仍然在继续，而且达到更高的水平。


    比如说关于东西，儿童在这个时期不但知道体积和重量，而且有了“密度”的概念。而关于人，儿童的一个重要认知，是开始理解死亡。你要问四岁的小孩子死亡是怎么回事，他可能以为人死了就是从一个地方去了另外一个地方。但是六岁以后的孩子就有一点知道死亡是什么了。


    他们开始理解一些复杂的情绪，比如为什么有时候人会又高兴又难过。如果不同的人告诉他一些矛盾的说法，他不会困惑，而是自己做出判断。与此同时，玩，还是那么重要。


    但是这时候孩子有了一种全新的学习模式，高普尼克称之为“掌控式学习（Mastery Learning）”。


    掌控式学习就是要熟练掌握专项技能。掌控式学习要刻意练习，要练到不用想就能使出来、快速高效的自动化程度。汉字的读写、加减乘除的计算，都是掌控式学习。


    发现式学习是探索，掌控式学习是收获。这两种模式的次序很重要，因为这是大脑的成长机制所决定的。


    六岁以前的幼儿随时能被任何东西吸引注意力，他自己判断哪个有意思就学哪个。而六岁时的大脑前额叶皮质开始要求更大的控制权，它将逐步接管整个大脑的其他部分，这意味着注意力变得可控，小学生能够专注地学习某一个知识。


    六岁以前的大脑可塑性是最高的，六岁以后大脑就开始不容易改变了。幼儿大脑灵活多变，现在的大脑开始有效率了。高普尼克认为儿童大脑的创造力，从这一刻开始是下降了。


    从内部硬件角度，以前的很多神经连接现在消失了，就像是一棵树被修剪了一样。剩下的那些经常使用的神经连接会加强！如果我们把神经连接想象成电线，现在有些重点线路的外面被包上了一层皮，就好像是电线外面的塑料皮——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_75_0.png)


    ![](img/a2c55447bc97d25d1622d2d734d5541b_75_1.png)


    这层皮叫“髓鞘质（myelin）”，有点像是香肠，是一节一节的。髓鞘质的作用也像是电线的塑料皮一样，保护神经连接不漏电，能让信号更强更准确。


    如果你以前听说过刻意练习的理论，你会立即明白这意味着什么：这意味着技能的专业化。经常使用的神经连接被固化，这个技能如同像肌肉一样长在了你的大脑里。


    幼儿的大脑看见街头牌匾上的字也许可以为那是一幅画，能产生各种有趣的联想——而固化的大脑看见字就只想到字的抽象信息。从实用角度看当然是巨大的进步，识字已经自动化了——但是在一位心情不好的哲学家看来，曾经纯真的双眼，现在戴上了一副标准化的有色眼镜！


    这个转变简直就相当于孙悟空前往南瞻部洲学艺，亚当夏娃离开伊甸园。你欢呼也好伤感也好，该来的就这么来了。


    # 2.学徒制


    其实六岁已经不小了。以前孩子到了六岁就得干活，一般是跟着父母、或者出去找个师父当学徒。


    我们听德云社的八卦，知道学徒很不好干。一开始都是做杂活，慢慢磨练了性子才能给师父打个下手，一旦犯错师父非打即骂。可以从刻意练习的角度，打骂都应该叫反馈，犯错都应该叫试错，正所谓打是骂是爱，挨打多了就学会了。以前到九岁，孩子就已经是一个有价值的劳动力了。


    当然现代教育体系不是这样的。学徒制的好处是手把手教你玩真的，是实实在在地学习一项专业技能，你完全知道你在干什么。可是当让你孩子背英文字母表的时候，他并不知道这是要干什么。


    现在的孩子只在文体项目上能体验一点学徒制的影子。你上场打球动作不对、弹琴弹错了，教练肯定会给反馈，特别是你会参加真正的比赛和表演。


    可一般的科目，像数学、语文，就不是学徒制了。学写生字和背诵乘法口诀只是为了考试，老师并不带领学生从事帮人写信或者算账之类的课生业务。


    高普尼克开个脑洞。如果学棒球也像现在学生学数学语文这么学，你猜是一种什么样情景？十二岁以前全都是棒球理论学习，考试考的是棒球的规则和历史文化。在这漫长的学习中你对棒球的术语、棒球界的名人事迹倒背如流，但是你从没摸过真的棒球。到了中学你才开始有球训练，到大学你才开始锤配合作……一直等到研究生二年级，你才第一次上场比赛。


    有这么训练棒球运动员的吗？可是我们现在训练科学家就是这个方法。过关斩将好不容易考上研究生才算当上了学徒，结果老板一看除了考试啥也不会。


    当然这其中也有很多无奈。今天的科学实在太难了，高中生进物理实验室也帮不了什么大忙。


    离开了学徒制，今天的孩子在课堂上学的很多东西是不自然的。孩子不知道为什么要学这些东西，他们在很长的时间里根本用不上这些知识。


    所以他们要想学得好，必须投入极大的专注力。


    # 3.专注力竞赛


    本来六岁以后大脑的发育就会变得更加专注，已经为学习专业技能做好了准备，搞一些要求专注力的活动没问题。但是现在学校对专注力的要求已经超过了自然水平，小学生要调用的专注力已经比大多数成年人在工作中的专注力还高。


    可孩子是多种多样的，有些小孩子天生没有那么强的专注力。


    如果你职业选择是猎人，那你根本不需要很强的专注力，你反而应该避免过度专注，得时刻对周围环境保持机警。但是学校教育可不培养猎人，学校要求孩子必须能把专注力放在老师讲的东西上。


    你甚至可以说，现在的学校很大程度上是专注力的竞赛。哪个孩子专注力强，他学习成绩就好。


    结果猎人式的人才在学校里就成了落分分子，甚至成了病人！有研究表明美国政府把标准化考试推行到哪个地区，哪个地区的儿童多动症诊断率就显著提高。'
