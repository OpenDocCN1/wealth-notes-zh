    # —— ◆ 疑问篇 ◆ ——


    # 13. 该选择什么领域学习和下功夫？


    这个策略大概是这样的 ——


    第一，每个个人应该选择自己喜爱\的专业去学。你得觉得干这事儿特别有意思，生活才能幸福。


    第二，为了获得更好的社会适应性，最好有一点跨界的知识。现在最适合文科生的就业领域就是把自由技艺和新技术结合起来。同样道理，就算一个人以技术为生，也应该学点批判性思维，最起码掌握一些表达能力。


    第三，想要取得很高的成就，你得至少在一个领域有比一般人高很多的水平才行。


    一个办法，是你在一个领域取得比如说前5%的水准。比如你是top 5%的程序员，那这个技能就是你的决定性技能。


    另一个办法，是在两个领域同时达到前25%，只要你能把两个东西结合起来，你就是顶尖人才。


    不管是哪个办法，你都要在一两个领域内成为高手才行。一个在四个领域都是普通水平的人，就没有多大意思了。


    所以你必须非常专注地在某一个、最多两个领域长期苦练。在你专注的这一两个领域，你在乎的不是自己的*绝对*水平够不够用，而是你*相对*于同行来说，是个什么位置。那么这就是永无止境的功夫，不存少花功夫多办事事儿。而对于辅助的领域，则是够用就行。


    # 14. 该学文科还是学理科？


    首先取决于你喜欢什么。其次你要考虑到数学和物理这些东西涉及到人脑的所谓“流体智力”，说白了就是要求你的计算速度特别快——而“流体智力”在二三十岁左右开始就要走下坡路了。所以学数学、物理就跟学踢足球一样，必须从小就下功夫，别等到30岁了才想起来学——并不是没有成功的例子，但比较罕见，而且肯定比从小就学费力。


    反过来説，历史、政治、文学、哲学这些东西，比较讲究知识的沉淀，更多的是依靠大脑的“晶体智力”。晶体智力不容易随年龄退化，稍晚一点再学也来得及。


    # 15. 到底什么知识最有用？


    从学以致用这个角度来说，我们对“知识”大概有两种态度。


    第一种态度是把知识当做一本使用手册。你想象全部的知识都写在这本手册里，而这个手册上写的都是“遇到情况 A，我们应该怎么怎么做”、“遇到情况 B，我们应该怎么怎么做”这样一条一条的明确指导。学习这本手册是一定得有很好的记忆力，记住多少条*有可能*用到多少条。而且就算记住了这两条，如果在生活中根本就没遇到情况
    A 和情况 B，那还是等于白学。


    第二种态度，是根本不在乎一招一式的用法，而致力于构建一个知识体系。你学习一个知识并不是为了有朝一日用到它，而是为了*理解*这个世界到底是怎么回事儿。


    我认为这第二种态度，才是高手的态度。


    你很难抱着实用的目的学习广泛的知识——到底哪个知识有用，应该在各个领域投入多少时间最划算，这种优化问题根本无解。通才的目的本来就是为了对付复杂问题和不确定的局面。


    也许“什么什么知识到底有什么用”，这个问题就错了。如果哪个知识都可能有用，那你最应该关心的其实你对什么感兴趣。真正的斜杠青年追求的不是简历上多几个斜杠，而应该是培养广泛的兴趣，把知识本身当成回报。


