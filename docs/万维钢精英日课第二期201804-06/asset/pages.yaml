    可是如果比较高端人才，那中国仍然不乐观。中国学有余力的高中生，如果想参加有组织的 fo


    到大学，中美两国的差距就太大了。美国大学教育格局更好、更联系实际，而且连难度都比中国高。有人说中国学生基础好，丘成桐说我怎么没看到。哈佛数学系里中国留学生的数学基础不如美国学生。现在中国有很多小留学生在美国学习，他们并没有表现出超过美国学生的水平，可以说是相当令人失望。


