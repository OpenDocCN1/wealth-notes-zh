  md: '# 答读者问 | 好奇心被严重高估了


    # 来自日课：为什么城市越大越好


    在互联网那么发达的情况下，连接很大的部分都可以通过互联网满足，那么城市化的收益和代价，会不会因为互联网的存在，而趋向于均衡呢？互联网影响下的城市标度率是什么样的？该如何量化推动呢？


    万维钢


    一个有意思的现象是互联网普及以来，各路牛人、各个行业的优秀公司往一起扎堆的现象反而更明显了。比如说硅谷，在过去这十年房价接连上升，道路交通越来越拥挤，而就是这样，人才还在往那里赶。


    这是因为互联网并没有方便到彻底让人远程工作的程度。以前人们以为远程工作可能成为主流，现在看来根本不是这么回事儿。哪怕是纯脑力劳动，哪怕是理论物理学家推公式，都得有个共同的办公场所。


    面对面的交流是不可能被取代的，摄像头再方便也没有几个人坐下来聊天效果好。一方面是有些细微的肢体语言只有面对面才好使。我想还有一方面是固定的办公场所会强迫人们交流、会制造偶然的相遇和思想碰撞。这和有事儿才连线完全不同。


    # 来自日课：城市快节奏的数学


    北上广深是大城市，生活节奏快，但是成都、重庆、长沙等也是人口众多的大城市，只是GDP小一点，这些城市的人都比较悠闲，就像文章中的小城市的人。那么，城市大小和人们是否过得悠闲，到底哪个是因，哪个是果呢？


    万维钢


    韦斯特说标度率能解释一个国家的城市80%到90%的定量性质，剩下的则是各个城市自己的个性和文化。而对不同国家的两个城市，比如美国纽约和日本名古屋，就不适合做横向的比较。


    # 来自日课：公司的宿命


    为什么说销售额跟雇员人数成正比就是危险，是缺乏弹性的呢？


    万维钢


    不仅仅是销售额，是销售额和销售的成本都正比于雇员人数。这种情况就说明公司是在一个边缘运行：多一个人就多一份收入，但是也多一份成本。这就等于说你没有富余量，你是一个养活很多很多员工吃饭的地方，你不是一个迅速积累财富的地方。那么一旦市场风向改变东西卖不出去，你没有足够的资金“过冬”，更谈不上需要付出更多资源的转型了。


    # 来自日课：科学家的核心价值观


    > “科学是一个反常识的、永远在革命的、不以实用为目的的东西，是纯粹精神上的追求，是人类想要知道这个世界的底层逻辑，是想破解世界的源代码。”这个句子的主语换成“哲学”是不是也行得通？哲学，是不是科学的另一件外衣？


    万维钢


    换成“哲学”不行。因为哲学不能告诉我们世界的底层逻辑。'
