  md: '# 日课155 | 《人工智能》4:一道烧脑的“歧视”题


    日课155 | 《人工智能》4...


    今天咱们继续说布鲁萨德的《人工智能》。我们要讲一个小道理和一个大道理。


    大道理很容易理解，但是这个小道理比较烧脑，相当于一道数学题，而且是2016年才被人想明白，还专门发表了学术论文。你并不需要任何高级数学知识，我会帮你从直观上理解这个道理。我建议你把这道题当做一个头脑体操，把玩一下其中的乐趣。


    很少有什么数学思想跟实际生活有这么独特的关系。这个事儿咱们得从美国的司法制度说起。


    # 1.法官用的算法


    中国的犯人，理论上来说，不管是什么人，同样的罪行就意味着同样的刑期。在监狱里如果表现好，同样的表现等于同样的减刑。惩罚力度，跟你是什么人，没关系。


    但是在美国，法官判决的时候，会看犯人“是个什么人”。同样的罪行，如果是惯犯，判决就会比较重；而如果这个人平时表现良好，就可能得到轻判。


    这个指导思想是看犯人将来再次犯罪的可能性大小。如果法官认为这个人不会再次犯罪，他就会给轻判，而且很容易批准假释。而如果法官判断这个人将来很可能再次犯罪，那就会从重从严判刑，假释减刑什么的也别想了，就在监狱里待着省得出
    去危害社会。


    那怎么知道一个人是什么人呢？以前都是靠法官的主观判断，肯定是不太靠谱。所以现在是用算法来判断。有个私人公司叫 NorthPointe，开发了一个算法，叫 COMPAS，专门用来判断一个犯人再次犯罪的可能性大小。


    COMPAS 算法会考察一个犯人的100多项指标，然后给他打一个分。从1分到10分，分数越高，代表将再次犯罪的概率就越高。


    这就比法官个人的判断强多了，毕竟哪个法官也不可能同时考虑这么多项指标。算法是冰冷的，但算法也是客观冷静的，对吧？


    # 2.一道数学题


    # 3.这里清烧脑


    ![](img/a2c55447bc97d25d1622d2d734d5541b_101_0.png)


    +   * COMPAS 算法并不考虑犯人的种族。

    * 同样的预测分数下，黑人和白人的*实际*再犯罪率是一样高的。

    * 但是没有再犯罪的犯人中，黑人被算法打高分的可能性比白人大得多。'
