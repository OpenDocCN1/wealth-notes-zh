  md: '# 日课预告 | 《超越曲棍球杆的战略》：假装大领导，谈谈大战略


    日课预告 | 《超越曲棍球杆...


    下周我们要讲讲“战略”。这是一个特别常见、被人滥用、但实际上相当刺激的词。我们要说的不是那种四平八稳的、不得罪人的、例行公事的“工作安排”，而是真正的大战略。


    想象你是一个大公司的 CEO。每隔一段时间，你们公司就要开所谓的“战略会议”。各部门经理会起草本部门的未来工作计划 — 称之为“战略设想” — 做成 PPT，在会议上轮番向你轰炸。


    这些 PPT 做的都无懈可击。经理们陈述了自己部门过去的业绩，说明了这些业绩对公司的重要性，展望了未来。你感觉这是一个团结的大会、胜利的大会。


    而你内心知道，其实说白了，是都在为自己的部门争取公司的资源。


    没有哪个经理会说，根据我的判断，鉴于当前市场形势，我们部门应该被裁撤。人人都在向你要钱。为此，人人都是报喜不报忧。人人提出的计划，都是今年你给我我们一大笔钱，将来我们还你一个奇迹。


    他们描绘的图景，就好像是一根曲棍球球杆 ——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_38_0.png)


    曲棍球杆的形状是先稍微往下走一点，然后直线往上走。今年、最多再加上明年，我们是花钱，但接下来我们就是大举赚钱！今天的投入，都是为了明天的辉煌！


    ......你要信了，你就不配当这个 CEO。你非常明白，每一个战略计划都有风险，最可能的情况是今年把钱花下去，明年这件事儿就无人过问了。


    但是你能怎么办呢？事实是大多数 CEO 会谁都不得罪，给每个部门都分一点资源，让公司明年像今年一样运转。等到 CEO 向董事会汇报明年计划的时候，他的计划书......也是一根曲棍球杆。


    当然你未必是 CEO，也未必是部门的经理。但我们每个人都面临这种战略问题，人生中总有大大小小的选择。


    比如说，家长可能面临一个要不要让孩子学花样滑冰的战略决策。花样滑冰训练很费钱，而且家长还要投入大量的时间接送和陪伴。一个声音告诉你，现在大量的投入都是值得的，因为花样滑冰可以陶冶情操，磨炼性格，培养审美，将来在孩子身上你会看到巨大的回报！而且孩子还有可能成为职业运动员呢。


    这不也是曲棍球杆曲线吗？


    我们专栏多次说过，哪怕整天口口声声特别懂战略的人，自己其实也没做过几次战略决策。所以称“所罗门悖论”，就是给别人出主意头头是道，轮到自己的战略选择，自己却搞不好。那当你面对这种战略选择的局面的时候，到底应该怎么办呢？


    下周我们将借助一本2018年2月刚刚出版的新书来谈谈这个战略问题。这本书叫《超越曲棍球杆的战略》（Strategy Beyond the Hockey Stick:
    People, Probabilities, and Big Moves to Beat the Odds），作者是麦肯锡战略实践部门的三个学者：Chris
    Bradley, Sven Smit, and Martin Hirt。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_38_1.png)


    我们知道麦肯锡是个管理咨询公司，而事实上这本书说的全是公司战略，而且提出的战略指标都是特别具体的公司经营指标。但是我认为这本书对所有人都有借鉴意义，因为它讲的这个战略方法，非常具有实践价值。


    在我看来，这本书最大的特色就是它不“和稀泥”，它直截了当地告诉你什么是对，什么是错。这本书告诉你的战略选择，是大胆的，是高投入的，是冒险的，是得罪人的......但也是正确的。


    麦肯锡有强大的企业数据，所以这本书的一个特点就是不像商学院 MBA 班那样靠案例说话，而是靠数据说话，试图发现决策的共性，找到一般的规律。


    管理学并不是真正的科学 —— 但这本书，试图加上一点科学的味道。


    明天晚上10:43，咱们假装都是英明神武杀俘果断的大领导，一起切磋一下战略问题。'
