  md: '面对自己的时候却总是缺乏智慧？这种不智慧的基因为什么没被淘汰掉？


    万维钢


    智慧的本质是克服感情的冲动，冷静下来，换个视角，多考虑考虑再做决定。人脑是个多元政体，本来是谁的声音大听谁的，都是感情决定，而智慧，恰恰就是要克服感情。


    感情本来就是最有效的快速决策手段，相当于思维快捷方式。看见猛兽害怕是基本感情，没有这个感情的人才应该被淘汰。所以感情丰富其实是进化优势。


    那为什么现在又开始讲智慧了呢？因为我们人类现在生活在一个复杂的社会，经常面对各种冲突的感情，原来的快捷方式已经不好使了。我们现在不仅仅是靠基因、更是靠文化做决策。


    那将来，不智慧的人会被淘汰吗？也不一定。进化的淘汰机制得跟生育挂钩才行，可现在的大趋势却是特别智慧的人好像更不爱生育，不智慧的人反而很爱生育。


    我是一个初三孩子的父亲，孩子成绩一直不错，但是在从二年级下半学期开始，孩子迷上了刷手机，做作业时手机放在旁边，过不了五分钟就要打开手机看一看；背书专注时间过不了五分钟就精力分散。为了让他提高成绩我们这样办法、那样办法都想了，也都做了，但是成绩不但没起色，反而在下降，连孩子自己对自己也没有了信心。想请问万老师，我们的方法是不是错了？还有两个多月，孩子即将要初三毕业，我们怎么办？


    万维钢


    注意力不能长时间集中是非常严重的问题，如果想让孩子将来取得优秀成绩现在应该采取果断措施。我有一个该说的答案和一个不该说的答案。


    该说的答案是这涉及到意志力，而研究表明意志力是可以慢慢训练提高的。您应该让孩子充分理解集中注意力的 importance —— 这很可能比智商都重要 ——
    然后说服他，克制自己看手机的冲动。当然训练是逐步的，可以从5分钟看一次先提高到15分钟看一次、写完作业看一次、完成一项重要任务看一次。我们不能像要求大人一样要求小孩，如果一个初中生能坚持半个小时集中精力做好一件事，我看就挺不错了。关键是真的在学习、不能心里想着手机。


    不该说的答案，是我觉得我应该告诉你现在美国家长遇到这个情况是怎么做的。美国家长会给孩子吃一种克服儿童多动症的药，最流行的是 Adderall. 我们专栏第一季至少两次提到过这个药。这种药能让人长时间集中注意力。这是一个处方药，但是现在据说有一半以上的美国大学生通过地下渠道在吃，很多中学生的家长给孩子吃
    —— 而其中大多数孩子可能根本就没有什么是“儿童多动症”。这个药按理说应该算兴奋剂，肯定有副作用，而我不知道副作用严重到什么程度。没有任何专栏作家会建议读者吃这个药，我也不会给我的孩子吃。我想说的是，现在人们对集中注意力这件事，已经重视到了这个程度。


    咱们读者有没有遇到过类似的问题，有没有行之有效的方法？请在留言区分享。


    截此复习：所罗门悖论


    # 来自日课：小公司的神话和大企业的坏话


    大小企业共存的时候，或许总体上大企业的创新更多，但小企业消失之后，大企业的创新动力和自我革命精神从哪里来呢？


    万维钢


    有很多领域没有小企业参与，比如航空航天、核电，大企业也很创新动力。甚至像 AT&T 垄断美国电话业务的时候，根本就没有竞争者，AT&T 也在不断创新，它的贝尔实验室反而是最厉害的创新机构。


    但是有创新动力不一定有革命精神。如果这个创新是改进型的，是为了让我原有的业务更好，我肯定很愿意创新。但是如果这个创新是革命性的，是想让我原有的业务做不下去，那作为大企业，我会打压这个创新。


    所以，问题就在于，将来还会不会有革命性的创新。'
