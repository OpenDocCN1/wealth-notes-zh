    \ —— 对哺乳动物来说是血管、对植物来说是叶脉、等等 —— 是个分形结构。\n\n具体细节就不讲了，我大致总结一下韦斯特和合作者的思路。首先，不管是多大的哺乳动物，它的血管都必须满足以下这三个条件\
    \ ——\n\n第一，血管要填充身体内的每个地方。这是因为每个细胞都需要氧气和血液。从心脏出来是很粗的主动脉，到终端，则是遍布全身的毛细血管。\n\n第二，不管是多大的动物，终端毛细血管的尺寸都几乎是一样大的。这是因为不同生物体的细胞是差不多同样大的。这就好比说城市不管多大、你家住的楼不管多高，进入你家的网终终端的插座，都是一样大的。\n\
