    # 来自日课：当我们谈信仰时我们谈些什么


    我不能理解信教是批判地信？也就是信那些能让我活得更好的（如戒烟戒酒），不信那些有损健康的（如生病时就拜菩萨）？


    信某种意识形态，和信教，真的不一样吗？


    自律属于宗教信仰吗？


    万维钢


    塔勒布重点说的是现在这些所谓信教的人是一种什么状态，以及宗教事实上是起到了什么作用。我们借助这三个问题，来说说到底什么是“宗教”。


    如果我相信每天半夜吃夜宵会发胖，所以我就坚决不吃夜宵，这个是自律，但不是宗教。有很多人喜欢小狗，到了胜过喜欢人的程度，那么网上可能有人嘲讽说他们是“爱狗教”，这也是不对的，爱狗也不是宗教。


    宗教，是能给人提供一揽子综合的世界观和解决方案的东西。比如说基督教，对世界是怎么起源的、人类是怎么来的、我们人生在世应该做些什么、我们的未来会怎样，都给出了完整的解释和说明，这才是宗教。你接受宗教，就是接受这一整套解释和说明。一个真正的教徒是没有任何困惑的，他任何时候都
    processes 世界是怎么回事儿、自己该干什么。


    # 来自日课：“遍历性”和“尾部风险”


    在浴缸里淹死也是属于“发生的概率很小，但是对应的后果很严重。”为什么在浴缸里泡澡不属于尾部风险呢？要如何判断它是不是黑天鹅？


    万维钢


    “尾部风险”这个词，塔勒布本人也不喜欢。人们用这个词代表那些发生在分布曲线末端（代表风险很小）的风险，塔勒布这里的语境则特别要求尾部风险一定要危害大到足以毁灭的程度（比如账户清零、或者丧失生命）的风险。


