  md: '# 答读者问 | 创造力能刻意练习吗？


    答读者问 | 创造力能刻意练习...


    我是一名高三老师，我带的学生都是各个好学校不要，最后被收录到我们学校来的，这些孩子专注力差，对于这样的大孩子该怎么培养他们的专注力？


    # 万维钢


    我理解您作为老师肯定希望能有一个特别好的办法，把你的学生培养成优秀的人才，让他们度过完美的一生。但是以我有限的知识，世界上绝大多数事情没有万全之策。


    简单地説就是如果你、学校和学生三方的执行力都很强，你可以用一个快速有效的方法在短期内提高学生的注意力水平和考试分数，但是这个方法并没有长期的效果。


    这个方法就是军事化训练。我们专栏前面有一期叫《纪律的悖论》，其中介绍了美国几个学校试驗的教学方法，精髓就是军事化训练。你需要严格的纪律，你需要可見的学习进度，你需要赏罚分明的考核指标，你需要灌输式的教学和死记硬背的学习。


    万老师，刻意练习为的是让一个动作的相关神经元形成下意识的联动关系，而创造力恰恰是非模块思维的自由联想，两者看似是相矛盾的，那创造力有没有可能被刻意练习呢？


    # 万维钢


    创造力不能刻意练习。刻意练习要求明确的对错结果、重复的训练和即时的反馈，这些都不是创造力。


    +   * 写书评

    * 用书中人物和词汇做个填字谜（网上有专用软件）

    * 根据书中情节设计一个桌面游戏（我儿子用了超过一周的时间做了一个 której游戱，有人物有钱有枪有动植物资源）

    * 按书中情节拍一个短片

    * 设计书皮

    * 给这本书拍个电视广告

    * 给书中人物做黏土模型

    * 对这本书提十个重要问题

    * 假装自己是书中人物，描写自己，让读者猜猜你是谁


