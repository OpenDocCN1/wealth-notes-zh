  md: '# 日课142 | 《囡丁与木匠》2：真关系和假教育


    日课142 | 《囡丁与木匠》2...


    今天咱们继续说艾莉森·高普尼克的《囡丁与木匠》。我们来讨论六岁以前的幼儿是如何学习的，高普尼克 Ê 本人在这个领域亲自参与了很多研究。理解了今天的理论，你整个幼教会有  一个本质的改变。


    以我之见，中式育儿的一个错误，是用训练大孩子的方法教小孩子。可能在某些家长心目中, 所谓幼教就是让孩子在五岁的时候掌握教学大纲中七岁应该掌握的技能。


    比如我最不能理解的一个活动就是背唐诗。一方面是连“鸿鹄之志”这种初中文化都没有的人能当北大校长，一方面是全民让刚会说话的两岁小孩背唐诗，这不荒唐吗？


    两岁小孩理解不了为什么有话不好好说，非得说“锄穷千里目更上一层楼”。其实很多家长也不懂唐诗，他们也不打算让孩子理解 -- 他们只是想让孩子*会背*而已。他们选择了这个项目，也许是因为背唐诗有表演的性质，也许因为他们实在不知道还有别的幼教选项。


    六岁以下的幼儿到底应该学什么呢？为什么你让他学的他不学呢？为什么他不听你的话呢？


    孩子最想知道的是这个世界上 的东西都是怎么工作的, 这个世界上的 人都是怎么回事儿。而他们的学习效率, 取决于你和孩子的关系好不好。


    不要问孩子为什么不听你的话, 要问你配不配让孩子听话。


    # 1.三个学习渠道


    高普尼克说，学习有三个渠道。


    第一个渠道是自己摸索和试错。所有动物都会这种学习方法。这个东西能不能吃, 那个东西怎么用, 都是小动物一出生就在大自然中摸索出来的技能。一做做错了再来一次,
    所有的乌都不 会白吃。


    第二个渠道是模仿。看看别人怎么做的, 自己模仿一下, 这个只有高等动物 -- 包括大猩猩和某些聪明的鸟类 -- 才会。人类儿童非常善于模仿，咱们下面再说。


    第三个渠道是听讲, 这个只有人类会。


    我们今天重点说模仿和听讲。你一定要注意，儿童既不是录像机也不是录音机，他们非常积极主动。


    # 2.不是什么都模仿


    人类孩子善于模仿，连刚出生的婴儿都会模仿大人的表情。而且孩子的模仿非常高级。他不是什么动作都模仿, 只有你这个动作能够达到一定的目的, 他才会模仿你。通过模仿,
    孩子能了解事物之间的因果关系。


    有个实验是这样的。 一个平台的中间有个玩具小汽车, 两端分别有个障碍物。小汽车如果撞在左边的障碍物上，小汽车就会发光；撞右边的就没有反应。实验人员就当着孩子的面操作这个小汽车,
    有时候往左边撞有时 候往右边撞。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_64_0.png)


    结果哪怕是两岁的小孩, 当你把小汽车交给他的时候, 他都会专门撞左边那个障碍物, 好让车灯亮。他不是模仿你所有的动作, 他只模仿你成功的动作。


    还有个实验。实验人员把自己的手绑起来, 走到一个电灯开关前面, 用头去撞那个开关, 把灯点亮。 一个18个月大的孩子看到这种情, 他也想去开灯, 但他不会用头撞,
    而是用手。孩子知道那个实验者之所以用头, 是因为他的手不能动!


    而在另一个场景中, 实验者的手是自由的, 但是故意不用手, 用头把开关给撞开。结果这时候孩子的模仿就不用手了, 也是用头! 这是因为孩子一看你有手不用, 他能分析出来,
    也许用头有什么特别的意义。


    所以人类儿童的模仿是把动物界的模仿行为给提升到了一个全新的高度。他能够识别一件事情的目的性, 能做复杂的推理, 知道哪些是多余动作, 甚至还有仪式感, 知道哪些多余动作有意义。


    但是这里面有个关键。孩子模仿的对象, 必须得是人。


    还是前面那个撞小汽车的实验, 如果没有实验人员, 而是弄成一个小汽车自动运行的短片, 那个孩子就不会模仿。哪怕你是让一个机器人去做, 孩子也不会模仿。孩子只模仿真正的人。


    而且最好是关系亲近、跟他相似的人。两个实验人员在一个美国小孩前面做动作, 一个说英语一个说法语, 孩子会模仿说英语的那个人的动作。


    所以你跟孩子关系越好, 他越愿意模仿你 -- 但是你刻意的动作尚未有效果。孩子随时都在观察你, 他不只是模仿你想让他模仿的事情。


    你是孩子的榜样。


    # 3.为什么你的孩子不听你的话


    现代人教育小孩最常用的办法还是对话。对话，也是少数几个能真正影响孩子一生的、家长的干预方法。你可能已经知道, 美国中产阶级 家长因为跟孩子说话多, 孩子词汇量会比贫穷家庭的孩子多很多,
    而这是一重要差别。孩子为什么总爱问问题？以前有的育儿专家说可能他是想吸引你的注意力 -- 而科学家的说法是小孩问问题是因为他想对这个世界有更深入更广的了解。


    我们希望能传达给孩子一些知识, 但是孩子非常挑人 -- 不是什么人跟他说什么东西他都信。


    心理学家很早以来就把小孩跟大人的关系分成三类。我们以前在讲普林斯顿的《欢迎度》那本书的时候说过这种分类。要知道你是属于哪一类, 最简单的办法是做个幼儿园送测。假设你是一个妈妈,
    早上把孩子送到幼儿园, 下班再接回来 --


    “安全型”的孩子, 你送他到幼儿园、离开他的时候, 他会对你依依不舍。他不想让你走, 但是你走了也就走了。你去接他的时候, 他看到你来会非常高兴。


    “回避型”的孩子, 你走他无所谓, 你来了他也没表现出有多高兴。


    但是有心理学家后来做过测试, 发现回避型孩子每次离开家长和见到家长的时候, 心跳都在剧烈加速! 孩子实际上有强烈情绪变化, 但是因为他跟家长关系很疏远, 他克制了自己的感情。


    “焦虑型”的孩子, 离开妈妈的时候简直是难舍难分、强烈哭闹, 然后再见到妈妈也哭闹, 根本没法哄, 就好像极度地需要爱一样。


    有统计表明这三种孩子长大以后的情感生活也受影响。想想如果恋爱对象也有这三种类型, 是什么样的剧情。当然统计归统计, 也有很多人长大以后战胜了自己的性格缺陷。


    而孩子是哪种类型, 取决于家长。事实上有的孩子可以跟这个人是一种类型, 跟那个人是另一种类型。


    对于这三种孩子, 家长想要通过对话来教孩子一些东西的时候, 他们的接受程度非常不一样。


    比如咱们拿四岁小孩做个实验。实验中拿一个孩子从没见过的东西给他看, 比如说是一张软盘。妈妈跟孩子说, 这东西叫“存储器”, 而一个陌生人说, 这东西叫“软盘”。你猜孩子会听谁的?


    安全型的孩子听妈妈的。他跟妈妈关系好, 他相信妈妈的话。


    但在另外一个测试中, 有个玩具, 既像是一只鸟, 又像是一条鱼, 总体更像是一只鸟。那你说这个东西到底是鸟还是鱼呢？妈妈说这是鱼, 陌生人说这是鸟 -- 安全型孩子在这个情况下,
    会选择听陌生人的。'
