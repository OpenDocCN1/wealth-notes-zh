  md: '# 变化一


    ![](img/a2c55447bc97d25d1622d2d734d5541b_19_0.png)


    从图上看，肾功能早在10岁左右就已经达到了巅峰，其他几项机能达到巅峰是在20岁左右。然后巅峰水平也就能够保持到35岁左右，从此就是下坡路。过了40岁，各项机能就以同样的速度在下降。


    为什么会是同样的速度？因为衰老。因为毛细血管的损伤是全面的。


    据此我们就可以估算一下寿命。


    首先，损伤是因为新陈代谢在毛细血管里传输能量导致的磨损，所以损伤率是跟新陈代谢率成正比。既然新陈代谢率跟体重的3/4次方成正比，那么损伤率也是跟体重的3/4次方成正比。


    下一步，我们假设一个生物体全身细胞损伤到一定比例，它就要死亡，这就是寿命上限。不管这个比例是多少，它都跟体重成正比。


    那么据此，


    ```

    寿命 = 损伤细胞总数上限 / 损伤率 ∝ 体重 / 体重^(3/4) ∝ 体重^(1/4)

    ```


    这就是为什么生物的寿命是跟体重的1/4次方成正比。


    # 4.延长寿命的两个方法


    新陈代谢率越低，寿命就越长。新陈代谢率是正比于体重的3/4次方，但它还受到别的影响因素。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_19_1.png)


    但是我看这个效应不算大。关键在于，要想通过降温长寿，你得长时间地处在寒冷之中才行，大冬天躲在温暖的室内可不算——可是寒冷可能会带来别的健康问题！


    第二办法就是少吃一点，直接减少新陈代谢。以前人们对老鼠做过很多实验，吃少的老鼠的确寿命更长。韦斯特赞同这个看法。


    参考资料 [1] https://joshmitteldorf.scienceblog.com/2013/02/25/cold-temperature-and-life-span-its-not-about-the-rate-of-living/'
