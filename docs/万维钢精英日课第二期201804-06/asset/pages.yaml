  md: '# 日课147｜《 Χì 丁与木匠》6:青春的较量


    日课147｜《 囿丁与木匠》6...


    今天咱们把高普尼克的《囿丁与木匠》这本书讲完。最后一讲的主题是青春期的大脑。


    “青春”中国文化里绝对是个好词，代表朝气蓬勃积极向上的东西，我们总说“美好的青春”，什么“红火的青春”。但是在美国，一提“青春期的少年”，那基本等同于麻烦制造者。如果在纽约街头看到几个十几岁的少年结伴向你走来，你有理由为自己的安全担心。


    我猜这可能是因为中国文化非常强调自控能力，少年相对比较低调。美国青少年的江湖暗流涌动，有吸毒的、有校园霸凌的、有堕胎的，学习好的老实孩子一般不是主流。但是在这些表面之下，其实青春期的問題哪里都有，咱们每个人也都遇到过或者将来会遇到。


    一个被视为希望之星的天才少年，为什么在大学里突然沉迷网络游戏不学习了呢？一个系统学习过生理知识、平时特别文静的女高中生，为什么突然怀孕了？而且那个男生还不是她喜欢的类型？


    青春期少年经常会犯一些愚蠢低级的错误。想要理解这一点，我们需要脑科学。


    # 1.混乱,又见混乱


    中学老师经常感到很无奈，仿佛是突然之间，学生们对老师讲的内容都不感兴趣了。幼儿园的孩子对一切事物都充满好奇，小学生把老师的话当成金科玉律，可是到了青春期，仿佛课堂上的东西再新颖也无法吸引学生。他们不再迷信老师，对家长也是叛逆，他们的心思好像根本不在学业上。


    所以就有老师向高普尼克抱怨这个情况，说你不是脑科学专家吗，你说说为什么青春期少年对什么都不感兴趣呢？高普尼克说不是啊，你看他们对“谁喜欢谁”这个问题，感兴趣吗？老师说那倒了！这帮学生一天到晚就是研究同学的八卦。


    人到了青春期，大脑会发生一个重大改变。我们前面讲了幼儿大脑的可塑性非常高，所以灵活性多变又充满了混乱。上学以后，从小学到青春期之前这段时间，孩子的大脑是非常平静的。可是在到了青春期，大脑再次变得活跃，可塑性再次提高，混乱又回来了。所以青春期的大脑，有点像是幼儿的大脑。


    这种改变是在为离开家庭做准备。


    青春期之前的孩子，他的生活是以家长为核心，他最关心的是和家长的关系。青春期开始之后，他最在意的是和同伴之间的关系。自己在老师眼中是个什么位置，对他来说已经不重要了
    —— 他更关心自己在同学中的位置，他想得到来自同学的尊敬。


    幼儿时期的打闹，现在变成了复杂的社交演绎。谁跟谁是朋友，谁跟谁是盟友，分工、谈判、妥协、利益分配、建立游戏规则，这些高级的东西都出来了。


    青春期少年有个地 下文化。他们私下交流会说一些只有他们知道的词汇、只有他们懂的典故，他们关注的东西家长根本理解不了。你要不信可以尝试一下“快手”之类的东西，你可能无法理解为什么有人会对这种东西感兴趣。这个文化在一代又一代的少年之间传承，还不断地创新。青春期少年是否掌握这个文化，对于他的受欢迎度十分重要。


    为了赢得地位，青春期少年会去做一些冒险的、匪夷所思的事情。我们以前讲《欢迎度》那本书的时候说过这个情况，青春少年最尊敬的不是学习最好的孩子，而是敢想敢干、有反叛精神的少年。


    青春期少年其实也是在探索，但是他们这种探索和以前的探索不一样。以前都是在家长的庇护之下探索，做一些游戏性的操作。青春期少年的探索则是直接面对真实世界，他要追求独立。他交往对象的对象都是同龄人，这是给即将到来的成人社交做演练。


    活跃的内心遇到陌生的场景，青春少年难免会做出一些出格的行为。脑神经科学家提出了一个非常有意思的理论。


    # 2.两个系统


    我们知道丹尼尔·卡尼曼在《思考，快与慢》这本书里提出一个学说，把大脑分为两个系统，系统1负责快速直觉思维，系统2负责缓慢的理性思维。其实这个系统1和系统2只是一种概念上的划分，并不是说大脑里面真的是有一个组织结构是系统1，另一些组织结构是系统2。


    那么我们也可以用另一个视角，把青春期的心理分成两个系统 —— 一个是“动力系统”，一个是“控制系统”。用汽车作比喻，动力系统就好像是油门，控制系统就好像是方向盘和刹车。


    动力系统的作用是通过调动情绪，让人充满各种做事的动机。青春期少年迫切希望实现自己的各个目标、满足各种渴望、体验各种感觉。


    从脑科学角度来讲，动力系统跟大脑中负责奖励的区域有关。说白了，就是大脑非常想要获得奖励。奖励可能是爱情或者荣耀，但青春期少年最想要的奖励，是来自同辈伙伴的尊敬。比如研究者做了一个模拟赛车实验，一个少年开车本来开得好好的，但是一旦当他知道有其他的少年正在看他开车，他就会去做一些更冒险的动作
    —— 因为他想要赢得尊敬。与此同时，功能性核磁共振扫描显示，他大脑中负责奖励的区域被激活了。


    动力系统在整个青春期间都非常活跃。只有当青春期过去之后它才会静下来。


    科学家提出一个洞见。青春期少年之所以会去做一些不负责、冒险的事情，并不是因为他低估了危险 —— 而是因为他高估了奖励。或者说，他对奖励的体验比成年强得太多！


    比如你想想，初恋的感觉是不是特别美好。一直到成年，每个人都觉得初恋特别美好，其实现初恋可能并没有那么美好，只是那时候你是青春期，你对奖励的感觉特别强烈而已。


    我当年上的都是重点中学，同学都比较老实没什么人早恋，但踢足球给我带来的奖励感觉特别强烈。初中有一次我们班四比零赢了别的班，我作为守门员表现出色高接低挡做出几个値得慢动作重播的精彩扑救。同学等赞不说，比赛结束后场边有几个不认识的人都向我致意，我好像成了球星的感觉。第二场比赛开始之前，对方的守门员居然专门跑过来跟我握手！结果后来我野心膨胀喜欢阴险出去了不该去的球。


    从进化角度看动力系统完全合理。有这个系统的激励，你才愿意离开温暖的家庭环境，去面对社会上的风险。但是问题就在于，你需要控制这个动力才行，这就是咱们说的第二个系统，也就是控制系统。


    控制系统由大脑的前额叶皮质主导。我们上一讲说了，随着大脑慢慢发育，前额叶皮质开始慢慢接管大脑的其他部分，它能掌控情绪，也控制动机。


    控制系统相当于刹车和方向盘，它克制冲动，引导我们做出科学的决策。它鼓励我们建立一个长期的目标，推迟享乐。同样也正是这个系统，主导了我们上一讲说的掌控式学习。


    但是控制系统的掌控能力并不是一下子就有的，而是慢慢成长起来的。它从青春期之前、刚刚上学的时候就已经存在，一直到期成年以后后还在成长。


    所谓“谁的青春不迷茫”，就是动力系统和控制系统这两股力量的较量。


    # 3.火候


    最理想的局面是两个系统达成平衡。本来也容易平衡，但近年来出现了一个情况，孩子们的青春期都在提前。


    为什么青春期会提前，目前还没有明确的结论。有人从能量角度，认为现在的孩子营养摄入过剩，而运动却不像以前那么多了，营养在体内没有被消耗掉，就被用于加快身体发育。还有人认为是环境中的各种激素太多了，甚至还有人说是各种人造光源对人的身体产生了影响……


    总而言之，青春扑面而来。动力系统已经变得活跃，控制系统却还没有准备好，结果就是青春期的少年更容易冲动冒险。要解决这个问题，就得提升控制系统。'
