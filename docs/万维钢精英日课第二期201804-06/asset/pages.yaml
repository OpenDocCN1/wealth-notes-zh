  md: '# 答读者问 | 因为“不讲理”，世界才有趣


    # 来自日课：命运配方


    量化让我感到恐惧而兴奋：恐惧是觉得这个世界模式化了就没意思了，比如玩游戏吧，我弄个程序帮我算，这样我总能赢（找到最优解），但是这样就丧失游戏的乐趣了。兴奋是因为：那我不是可以主宰一切，成为神吗？请问万老师对这个问题怎么看？


    万维钢


    量化分析、大数据、机器学习、包括人工智能这些现在流行的概念，本质上都是从以往的经验中获得知识。以我粗浅的见识，可以把它们分成两类。


    第一类是机器的经验已经穷尽了所有的可能性。比如人工智能围棋程序 AlphaGo 的升级版，AlphaGo Zero，根本不看人类棋谱，自己跟自己对弈几百万盘，从中总结不受人类历史影响的围棋规律，那么理论上，它就等于把这个游戏给彻底解决了，什么招它都研究过，以后真的是没有悬念也没有惊喜了。


    但是围棋毕竟是个简单的游戏 —— 至少规则非常简单，生活中的真实问题没有办法做到这种穷尽。所以大部分量化分析都是像我们这次说的麦肯锡总结公司战略经验一样，属于第二类
    ——


    也就是机器被输入的信息，都是人类历史上已经发生过的经验。这种分析的本质缺陷是结果严重依赖输入信息。如果一个人工智能程序来到1970年的中国，它发现大街上的人们都穿着款式和颜色非常简单的衣服，那你要让他预测八十年代中国人穿什么样样的衣服，它预测出来的结果也只能是这样的
    ——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_59_0.png)


    这是因为数据只是在老老实实地总结经验，它并不理解人心在想什么，它并不真知道人喜欢什么。当然，如果你给他输入的数据包括四五十年代中国人穿什么衣服、和中国文化相近的日本人穿什么衣服，它就能猜测中国人喜欢什么衣服，就能提供更准确的预测。


    但即使如此，它还是无法预测2050年中国人穿什么衣服 —— 因为连中国人自己都不知道自己到那时候会喜欢什么衣服。


    所以数据分析是一个笨拙的办法。当然它比人的直觉、比个人的有限经验都强得多，而且在语音识别等类的应用上表现非常好，但是仅此而已，本质仍然是机械化的。它远不是神。


    我以前搞物理的时候有一次开会，遇到一个做神经网络的人。美国有个托卡马克实验装置叫 DIII-D，这个人就把它每一次实验的数据都拿过来，训练了一个神经网络模型。他完全不懂得物理学，但是每次试验都可以看做输入十几个参数，输出一些物理量，他可以把实验当做数据游戏。他的模型训练得非常好，能极其准确地预测实验结果。


    我一看有这种模型那我们还搞什么方程、还做什么实验啊？但我马上想到，他这个模型只对 DIII-D 有用，换个装置就不好使了 —— 甚至如果把 DIII-D 做个什么改动、或者实验参数超出以往的极限，它还是不好使。它只是对以往经验的总结。我就跟这个人说了这个意思，我说你这模型对物理学家没啥用。


    但是他有个非常好的反驳。他说我这个模型好使，本身就提供了一个信息：说明 DIII-D 这个装置是“可预测的” —— 换句话说，这个装置是讲理的。世界上有很多东西，比如说股市，就不能用模型搞这么精确的预测
    —— 因为股市近乎随机，根本不讲理。


    今天我想起这件事情来，也许正因为有很多不讲理的东西，这个世界才有意思。


    # 来自日课：为什么大公司抓不住大趋势


    在一个公司或者一个人一件事发展到最顺遂的时候，不能不去查探隐藏的危机。柯达、摩托罗拉、诺基亚等一个个倒下去的巨头，都是因为放不下既得利益，嘲怡有危机意识也不会真正做到提前部署，下断腕之决心。那么，如何对抗既得利益的牵绊呢？有什么更好的方法么？


    万维钢


    我没有什么实际经验，但是我知道温和和激进的办法，其中温和的办法是上策。


    温和的办法就是使用“说服力”、“影响力”去说服领导层。一般人常犯的错误是晓之以理，说这个新东西的潜alk有多大，我们应该准备转型。但是新生事物刚出来的时候往往都/swallow?，你往往找不到特别有力的证据，尤其是根本没有多少数据能证明它的潜能。正如斯科特·亚当斯所说，你应该动之以情。


    希思兄弟十年前有本书叫《瞬变》（Switch），专门讲了怎么在公司内部引导变革。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_59_1.png)


    人们以为公司变革的决策顺序应该是“分析 - 思考 - 改变”，但希思兄弟说，要说服人，正确的办法是“看到 - 感受 - 改变”。设计一些情境，让高层亲身感受一下新东西的体验，是最有利的。


    如果能用说服的方法达成一致，公司上下就非常团结，到时候办事也最顺利。


    如果说服太难，还有一个中策是先秘密组建一个改革小分队。希思兄弟也举了这方面的例子，小分队私下先搞着，每周在固定的会议室会议，但一切都要对外保密，小分队还得特别团结，还得时刻考虑反对者会怎么对待他们
    —— 就好像搞政洽阴谋集团一样。等到小分队搞出了名堂，再正面对抗。


    如果这也不行，那就只能用下策，也就是政治手段了。《独裁者手册》里面讲了很多手段，比如一个办法是扩充董事会人数，把自己的人安插进去。收购别的企业就是一个好办法，方便安排新人进董事会。


    这些搞法会带来公司内部矛盾，但也是没有办法的办法。正如有人说过，新思想成为主流往往并不是因为旧人接受了新思想，而是因为旧人都死了……


    ![](img/a2c55447bc97d25d1622d2d734d5541b_59_2.png)


    # 来自日课：创业不是科学


    万老师，说道创业，大家经常提到激情，认为激情也是成功的必要要素之一，创业的激情从何而来，有没有科学的分析，是天生的？是对某一件事情的极大兴趣还是出于对金钱的追求？激情对于创业成功到底有多大的影响？


    万维钢


    激情和创业的关系是个有争议的话题。很多人认为创业需要激情。成功的创业者经常说自己是因为激情燃烧，已经烧到不创业很难受，才去创业。对此我们完全可以理解，因为创业首先是个高风险的事情，很可能他投入很多最后什么都得不到，而且创业初期几乎可是是没有什么回报的，没有激情的人不可能坚持下去。


    这就好像没有爱情的人不会结婚一样。


    同时，我们还知道，如果创业者表现得充满激情，他会更容易获得风险投资。我们'
