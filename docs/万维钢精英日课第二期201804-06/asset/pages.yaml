  md: '# 日课153 | 提建议和权力感


    日课153 | 提建议和权力感


    近年来中文社交网络上一直有一个热点文化话题：年轻人越来越感到受不了长辈们对自己生活的评价和指导。


    比如说你过年跟亲戚聚会，一年好不容易见一次，亲戚们对你问寒问暖。大姨问你什么时候结婚吧？你说半年前跟对象分手了，目前还是单身，没有结婚计划。大姨说这可不行你都这么大年级了，我帮你介绍一个！二叔问你现在在干什么工作啊？你说在一个创业公司搞机器学习。二叔说这也不是个正经工作啊，赶紧考公务员吧。


    你就觉得特别烦。这帮人根本不了解你的生活和思想，他们为什么以为他们有资格给你提建议呢？


    一般对这个现象的分析，都是认为这是一个认知问题。大姨和二叔的认知水平跟你不在一个频道，他们错就错在用自己的认知衡量别人的生活。


    今天我想说的是另一个分析角度。给人提人家不恰当的建议，并不仅仅发生在亲戚之间，也不仅仅是认知水平“低”的人给认知水平“高”的人提。事实是每个人都喜欢给人提建议，提建议是一种心理需求。


    年轻女性普遍都有这种经验，身边有很多男性莫名其妙地主动给你提建议。在女权精神比较敏感的女性看来，这个问题相当严重。女性们甚至专门发明了一个词来命名这个现象，叫“mansplaining”，大意翻译成“男人说教”：男人喜欢给年轻女性讲解一些事情，来彰显自己有水平。


    美国女作家丽贝卡·索尔尼（Rebecca Solnit），专门就此写过一篇长文[1]。有一次索尔尼和她的一位女性朋友被邀请参加一个除了她们两个之外都是老男人的聚会。索尔尼待了一会儿觉得这个聚会很无聊就想早点离开，但是有个看起来很重要的人物不让她们走，非要跟她深聊聊。


    这位老男人问索尔尼，听说你在写书？索尔尼说))[


    +   1. 应别人要求，给对方提出建议；

    2. 主动给别人提出建议；

    3. 一次无关建议的对话。


    然后让三组人各自评估，你在这件事情上获得了多大的权力感和支配感。结果第二组的感觉比第三组强，而第一组，也就是应人要求给建议的这个组，权力感和支配感最强。


    # | 由此得到


    人们提建议并不仅仅是为了对方好，也是为了让自己获得权力感。


    最后，请允许我……提出三点建议。


    第一，如果你有个事儿想要得到别人的指导，而这个人又有时间的话，你应该大胆向他提出要求。他一定会乐于给你建议——这个秘密就是提建议的人自己也会感觉很好。


    第二，作为一个智者，下次当你想给别人提建议的时候，应该先问问自己，到底真的是为了对方好，还是为了让自己的感觉更好。


    第三，鉴于提建议这个行为如此敏感，真诚的建议者一定要确保给对方充分的尊重。也许最理想的方式，是想象自己是个谋士，对方是你的主公，你提出上中下三个选项，让对方选——把权力感留给对方。


    谢谢你听我说建议。


    参考文献

    [1] Rebecca Solnit, Men Explain Things to Me, Guerrilla, August 20, 2012.

    [2] Olivia Goldhill, Psychologists have identified a very good reason why unsolicited
    advice is so annoying, QUARTZ, May 21, 2018.


    万维钢


    # 划重点


    人们提建议并不仅仅是为了对方好，也是为了让自己获得权力感。三个关于建议的建议：1.大胆请别人给你建议。2.给别人提建议，先问自己：是为了对方好，还是让自己感觉好。3.真诚的建议者要把自己当谋士，把选择权留给对方。


