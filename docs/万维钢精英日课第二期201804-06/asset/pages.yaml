  md: '# 日课160 | 《为什么》2:总有一种力量让我们回归平均


    今天咱们继续说朱迪亚·珀尔的《为什么：因果关系的新科学》这本书。因果关系到底是不是一种原始的、应该被现代科学抛弃的思维呢？


    这是一个跌宕起伏的故事。以前所有人都认为因果是天经地义的东西。但是在一百多年前，统计学家们搞了一次革命，从此认为科学知识里根本就没有什么因果......


    为了理解这件事情，我们今天要讲一个非常经典的统计学概念，它在生活中有各种应用，但是至今仍然有很多体面人因为不懂这个概念而犯错误。


    这个概念叫做“回归平均”。你想必已经听说过......但今天我们要讲一个更高的角度。


    这一切还得从举世罕见的聪明人、学术多面手、人类学家、著名的种族主义者、发明家、统计学的祖师爷、在精算日课和熊逸书院多次出场的、达尔文的表弟、弗朗西斯·高尔顿先生讲起。


    # 1.高尔顿的困惑


    1877年，高尔顿在英国皇家科学院做了一个演示报告。皇家科学院的报告传统真是让人心驰神往啊。听众都是各方面的牛人，正装出席，报告人不用什么 PPT，而是面向观众，就好像变魔术一样一边演示实验一边侃侃而谈，说的都是对大自然的最新揭秘。


    高尔顿这次演示的东西，被后世称为“高尔顿板”。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_113_0.png)


    高尔顿板现在还有卖的。它是一个平板，下部有很多垂直的槽，槽上面是一些排列成三角形的 gratuite 小格挡。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_113_1.png)


    ![](img/a2c55447bc97d25d1622d2d734d5541b_113_2.png)


    让一个小球从最上方掉下去，它会经过各个隔挡的阻碍，最终落到一个竖槽里。每个小球在进入竖槽之前的运动都是随机的，但是当你放了很多很多小球之后，它们就会在竖槽上呈现一个明显有规律的分布：一条钟形曲线。


    这当然就是正态分布。高尔顿板演示的是人的遗传。比如身高和智商，可能受多个遗传因素的影响——就好像高尔顿板上的那些隔挡——这些因素综合起来一起作用，结果就一定是正态分布。事实上人的身高和智商的确就是正态分布。你可以想象上面图中横坐标代表身高，纵坐标代表每个身高值上的人数。正态分布就是说，身高特别高和特别矮的人都很少。


    正态分布不是新闻。高尔顿这个报告的真正剧情还在后面。高尔顿说如果我在竖槽下面再放上一些隔挡，然后隔挡下面再放上第二排竖槽，就如同下面图右半边那样，你说会是什么样的情景？


    ![](img/a2c55447bc97d25d1622d2d734d5541b_113_3.png)


    这就模拟了两代人的身高。第一排，也就是竖槽 A，代表第一代人的身高分布，我们知道是正态分布。那么第一代人再遗传一次，到达竖槽 B，会是什么分布？


    不论是理论推导还是实验演示，第二排竖槽里的小球都呈现一个更宽广的正态分布。我们在《标准差和人生哲学》这期讲过“标准差”的概念，竖槽 B 的标准差更大。就如同下面这样——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_113_4.png)


    这意味着每一代人身高的标准差会越来越大，也就是身高特别高和特别矮的人应该一代代越来越多了才对。


    可是真实世界根本就不是这样的。真实世界里一代代人的身高标准差都是一样的哟！


    我再换个说法你就更明白了。假设现在有一批身高特别高的人，他们处在第一代正态分布曲线的右侧边缘地带。如果他们生的孩子是在他们的身高基础上进一步随机演化的，其中应该有一半的身高高父亲高。如此说来，第二代身高的边界，应该比第一代更高才对。


    但是这并没有发生。真实世界里牛人的第二代并没有一半的机会比牛人强——二代好像普遍比一代弱。高尔顿考察了605个英国名大幅，发现这些名人的儿子们，普遍不如名人自己有名。


    这个规律好像还无处不在。比如姚明特别高，他的妻子也非常高，我们可以想象姚明的女儿肯定也会很高——但是根据高尔顿发现的规律，姚明女儿的身高将不会像姚明那么高。最可能的结果，是她会稍微矮一点。


    高尔顿把这个现象叫做“回归平均”。一代出类拔萃，占据了正态分布曲线边缘的位置；二代则普遍没有接着开疆拓土，甚至连一代的优势都没保住，反而都往曲线的中间“回归”。


    高尔顿不得不把高尔顿板做了一个改进，把一些竖槽变成斜槽，才能体现这个“回归”——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_113_5.png)


    可这斜槽代表什么呢？难道说冥冥之中有一种力量让我们回归平均吗？


    # 2.高尔顿的解释


    有些问题值得思考十二年。一直到1889年，高尔顿才把这个事儿想明白。


    高尔顿意识到，根本就没有什么是特殊力量'
