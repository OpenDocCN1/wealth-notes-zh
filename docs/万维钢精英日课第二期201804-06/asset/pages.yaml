  md: '还有一种可能，就是泰勒·科文讲的创新停滞。当然所谓的停滞不一定是完全停滞，可能大方向确定了，但是小的改进还可以一直搞。那么在这种情况下，大企业将 Rib会越来越重要，个人创业将越来越没有机会。


    但这并不意味着大企业将会一手遮天压迫人民。


    政府会不断地加强对大企业的约束，甚至直接插手运营。人民会对大企业提出更严格的要求。市场将会变得越来越“有序”。考虑到市场的作用好就在无序上，如果市场不再有意义，经济活动可能会变成确定性占主导...


    那么最终的结果，就有可能是，社会主义。


