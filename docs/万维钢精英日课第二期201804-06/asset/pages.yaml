  md: '# 特别放送丨塔勒布的哲学、道德和生意经


    万维钢


    塔勒布的新书《利益攸关》2月底刚刚出版，咱们上周就已经讲完了，恭喜你，你几乎比美国读者也更快地读到了这本书。今天我来帮你复习总结一下，希望能对你更深刻理解这本书有所帮助。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_22_0.png)


    书名：《利益攸关》（Skin in the Game）


    作者：纳西姆·尼古拉斯·塔勒布（Nassim Nicholas Taleb）。塔勒布是我們非常熟悉的作者，他以前写过《随机漫步的傻瓜》、《黑天鹅》、和《反脆弱》三本书，讲的都是在这个充满不确定性的现代社会里，我们应该怎么面对风险。这本新书和前面三本书一脉相承。塔勒布的说法是他这四本书，每一本都是前一本的一根肋骨变成的。


    出版日期：2018年2月20日


    # 用“利益攸关”的眼光看世界


    +   1.风险


    《汉谟拉比法典》的核心思想，就是交易双方要对称地承担交易的风险。欧洲贵族得上战场，打仗得冲在最前面，死亡率得比过百姓高。贵族的本义，就是用承担风险换取显赫的地位。你要做一件事情，你就得承担这个事的后果。


    +   2.交往


    一般跟人打交道有两个规则，一个叫“黄金法则”，一个叫“白银法则”。黄金法则是说，你想让别人怎么对待你，你就怎么去对待别人。塔勒布的观点是现代社会应该更多地使用白银法则。白银法则就是孔子所说的“己所不欲勿施于人”——你要是不想让别人这么对你，你就不要这么对别人。


    +   3.道德


    塔勒布给道德加上了一个尺度的维度。他认为道德是内外有别的，是分圈层的，能共同承担风险的人属于一个圈层。说白了，就是谁离我近，我对谁好。塔勒布政治理念的核心思想就是去中心化，本地事物由本地人决定。


    +   4.自由


    雇员在公司有利益攸关，所以有忠诚度。公司替雇员遮挡了风险，雇员获得稳定，代价是不自由。想要自由，你就得独自面对风险。所以说“Freedom is Not Free”，自由不是白给的。自由，意味着独自面对风险。风险，决定了你的气质。


    # 用“利益攸关”的眼光看名人


    +   1.罗伯特·鲁宾（Robert Rubin）


    作为克林顿时期的美国商务部长，他退休之后曾经给花旗银行当过十年的顾问，十年里，鲁宾总共收到了1亿2千万美元的顾问费。2008年金融危机，花旗银行也没躲过，但结果是花旗银行也没承担什么大责任，金融危机最后是纳税人买单。鲁宾，没有
    skin in the game。这个官僚系统的根本问题，就在于做决策的人不是承担决策后果的人。'
