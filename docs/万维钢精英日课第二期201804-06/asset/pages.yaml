  md: '# 日课170 | 老球迷怎样科学投注


    日课170 | 老球迷怎样科学投注。


    这几天赶上世界杯，咱来个小专题，讲一讲关于足球的经济学、数学、心理学和技战术里面的学问。今天第一讲还是从我们最爱讲的话题开始讲，那就是概率。


    这届世界杯打到小组赛第一轮结束，一个热点话题是感觉冷门挺多的——这个其实不是本届世界杯的新现象，事实是每一届世界杯都有很多冷门，特别是小组赛第一轮。我倒是觉得本届世界杯的一个新象是中国球迷中玩博彩的变多了。


    咱们说说博彩的数学。


    足球博彩玩法很多，我们研究最直观的一种。前几天德国对墨西哥，我查了一下博彩公司给的赔率，德国胜是1.45，墨西哥胜是8，双方打平是4.75。这就是所谓“欧洲规则”，赔率的意思是，你下注一块钱赌德国队赢，德国队要是真赢了，博彩公司就退给你1.45元，也就是你净赚0.45元。而如果是墨西哥队赢了或者双方打平，你这1块钱就没有了。


    规则很简单。那博彩公司给的赔率是怎么定的呢？博彩公司是不是特别希望比赛爆冷呢？有没有什么科学的投注方法呢？


    # 1.博彩的系统思维


    我首先要清楚，赌徒的思维和赌场的思维是很不一样的。赌徒总希望赢一把大的，最好有个戏剧性的结果、让他赢一大笔钱走人。赌场想的是怎么长期地、稳定地赚钱，赌场不喜欢大波动。赌徒靠的是运气，赌场靠的是系统。


    比如你去赌场，不管是玩什么项目，如果你每次把玩的都比较小，但是总去总玩，赌场非常欢迎你。但是如果你一进赌场就说，把你们老板找来，我要玩一把大的，你们赌场值多少钱我就押多少钱——赌场是绝对不会跟你玩的。赌场会给你设一个赌注的上限——开玩笑，我踏踏实实就能赚钱，干嘛冒险输光的风险？


    据我所知，美国赌场的设定毛利率大约是5%。也就是说假设每个赌徒每天拿一百块钱到赌场玩，可能有的人赢了一千块钱高高兴兴回家，有的人把一百块钱输光，有的人不输不赢——平均下来，赌场只赢你5元。这5%赢的不显山不露水不拉仇恨，但是概率站我们这边，稳稳当当平均下来都是赢，这才是合法生意，而且是好生意。


    回到足球博彩，合法的博彩公司也不需要靠冷门赚钱。博彩公司的最大利益所在，就是让赔率尽可能地符合胜负平的真实概率。


    2017年有本书叫《足球数学》（Soccermatics: Mathematical Adventures in the Beautiful Game），作者是瑞典一个大学的应用数学教授，大卫·森普特（David
    Sumpter）。森普特本人喜欢足球而且喜欢研究足球，他在书中详细分析了博彩公司的赔率设定。


    比如巴西对冰岛，假设我们认为巴西获胜的概率是70%，而博彩公司给的赔率是1赔2。那你投入一块钱，有70%的可能性这1块钱会变成2块钱，有30%的可能性这1块钱就没有了，所以这1块钱投注的数学期望是2×0.7=1.4元，预期挣0.4元，那你当然应该买巴西赢。可这样一来，如果巴西队真的按照70%的概率赢，博彩公司就不就赔了档？博彩公司必须降低这个赔率。


    反过来，如果博彩公司给的赔率是1.2，那你投入1块钱的数学期望就只有0.84元，这种情况下你就不买这个赔率了。或者说，就算是你不在乎概率，别如果是别的博彩公司也可能会给一个更高的赔率吸引你。所以博彩公司会提高这个赔率。


    高了就要调低，低了就要调高，一直地要调到赔率正好反映了概率为止。这时候，赔率×概率≈1。


    一般来说，博彩公司会首先做大量的研究，比如考虑两个队过往的比赛记录、近期的表现、球员的情况等，计算一个尽可能准确的概率，并且根据概率定下赔率。开盘之后，博彩公司还会结合实时的购买数据，You
    还讲应该哦 lol. Wait. 开盘之后，博彩公司还会结合实时的购买数据，随机调整赔率。


    所以赔率一方面反映了博彩公司自己的专业研究，另一方面也反映了押注球迷的观点。事实上考虑到群体...


    所以我们只要看看博彩公司开出的赔率，就知道，根据各方面信息的反馈，当前最合理的判断，这场比赛胜负平的概率分别是多多少：概率=1/赔率。


    比如前面说的德国对墨西哥这场比赛，德国队胜、负、平，博彩公司给的赔率是1.45、8、4.75，这就意味着博彩公司和当前市场认为德国队胜负平的概率分别是1/1.45=0.69、1/8=0.125和1/4.75=0.21。然后把这三个概率加起来，1/1.45+1/8+1/4.75=1.025。几乎就等于1。多出来的0.025是博彩公司的利润！也就是说，在这场博彩中，博彩公司想要的利润率是2.5%，可以说是相当厚道了。这大概是因为世界杯比赛投注的人多，这个钱赚得容易，同行的竞争把利润率压低。按森普特的说法，英超联赛中博彩公司要求的利润率在5%到6%左右，也还算可以。


    开博彩就好像开赌场一样。可能预测不准确，这把多赚了点，那把还赔了钱，但是博彩公司并不在乎一场比赛的盈亏。只要使用这个方法，它就可以长期地、稳定地赚钱。


    那根据这个原理，我们应该怎么科学投注呢？


    # 2.科学投注


    直觉上、也是绝大多数球迷使用的投注方法，是你觉得哪种情况出现的可能性最大，就买哪种情况。你认为德国能赢墨西哥，也不过赔率是多少，就买德国胜墨西哥。这个方法不科学。


    事实是你并不*真的*相信德国能赢墨西哥。你相信的其实是德国赢墨西哥的*概率比较高*。比如说，你认为德国有60%的可能性赢墨西哥，有25%的可能性打平，还有15%的可能性输。


    我们再看博彩公司给的赔率，胜、平、负是1.45、4.75、8。好，现在按照你自己的概率算，投入一块钱买德国胜，你的数学期望是1.45×0.6=0.87。买平，数学期望是4.75×0.25=1.1875；买德国队输，数学期望是8×0.15=1.2。数学期望最高的是买德国队输！


    虽然你认为比赛最可能的结果是德国队赢，但是你应该买德国队输！因为只有每次都坚持这样按照数学期望的最高值买，你才有可能以系统的方式从博彩中赚钱！


    这个关键就在于，博彩公司给德国队输这个结果的开价超出了你的预期。


    这才叫科学投注。但是这里面有个问题。


    你凭什么相信自己的概率判断比博彩公司算的更准呢？要知道博彩公司为了继续稳定地赚钱，是在追赶全给最准的概率。


    # 3.博彩公司有多厉害


    答案是你根本就不应该相信自己的判断！森普特对比统计了博彩公司对英超联赛整个赛季的各场比赛开出的赔率，和比赛的实际结果，得到下面这张图一一


    ![](img/a2c55447bc97d25d1622d2d734d5541b_140_0.png)


    图中横坐标是博彩公司预测主队获胜的概率，纵坐标是主队获胜的实际概率。博彩公司的预测的确经常不准确，但是你要注意，其中没有系统误差！这意味着博彩公司从未系统性地高估或者低估，实际比赛结果是在预测值的周围变动。


    博彩公司并不神，但你找不到它的漏洞。森普特试图在图中圈出的地方讨论一下心理...剩下内容延续。'
