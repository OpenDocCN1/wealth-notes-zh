  md: '遍，升级人费时费力——技术的传播就不一样了，基本上等于随便复制。


    法力随着法师的死亡或者飞升而消失，技术进步却可以一直积累下去。


    从技术积累和传播的动力学上考虑，我敢说凡人世界理所应当比魔法世界的进步速度快。起步也许会很慢，但是一旦发动起来就是日新月异，就是法师们跟不上的。


    所以我们看像《权力的游戏》这种比较复杂的玄幻小说，都是设定一个“低魔”的世界。权力在凡人手里，凡人是历史舞台的主角，法师们的地位都很低，魔法只能起到点缀的作用。


    黑猩猩的政治其实没啥意思。魔法什么的乍看很神奇，司空见惯了也就跟普通技术没区别。归根结底，可能规则最复杂、剧情最有意思的，还是我们这个真实的人类世界。如果我们这里哪个地方真的出现了法术，弄成了以法师为核心的奴隶社会，那我们就应该去那里闹革命：法师不消失，社会就没法进步！


    上限低带来平等，平等带来合作，合作带来群体演化速度加快。


    如此说来，即便将来真有赫拉利说的那种基因改造出来的“神人”，我们这些凡人也不用妄自菲薄。我们玩的规则比神人复杂得多。就算是将来 AI 再厉害，它们也不会把人类当蚂蚁看。


    当然，如果你喜欢不断升级的感觉，我们这个世界的缺点就在于太过平等……有些人过了三十岁就觉得没什么事儿可干了。有些人一出生就拥有财富和权力……然后一直到死也只拥有这些。人的进步有个很低的上限。


    但是你可以修炼思想啊！据我观察，人和人的思想差异可以持续加大，几乎无上限，而且思想资源不稀缺，使用无成本。有了思想，你可以随时幻想任何魔法世界。


    当然了……思想在绝大多数情况下没用，而且的确不如法术好看。


