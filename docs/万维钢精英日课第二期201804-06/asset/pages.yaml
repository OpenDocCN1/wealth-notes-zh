  md: '# 日课150 |《人工不智能》

    1:工程问题和社会问题


    日课150 |《人工不智能》1:工..


    今天开始我们解说一本4月27号出版的新书《人工不智能：计算机如何误解世界》（Artificial Unintelligence：How Computers
    Misunderstand the World），作者是纽约大学助理教授梅婧弥斯·布鲁萨德（Meredith Broussard），她同时还是一名数据记者。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_90_0.png)


    ![](img/a2c55447bc97d25d1622d2d734d5541b_90_1.png)


    现在有一种情绪被布鲁萨德称为“技术沙文主义”，认为一切社会问题都可以用技术解决，特别是可以用计算机技术解决。布鲁萨德这本书就是专门跟技术沙文主义反应调。布鲁萨德认为，包括人工智能在内的所谓新技术，其实并没有解决真正-то社会问题。


    今天这一讲咱们先说一个“简单”例子。假设你任职于某个贫困地区的教育局，你负责给本地所有中小学发放课本，那么你如何确保学生们都能得到课本呢？你肯定会认为这是一个简单的问题，中国最穷的地方也没发生过学生上课没有教材的事儿。


    # 1.教材的问题


    几年前布鲁萨德的儿子上小学，一家人住在宾夕法尼亚州。儿子要准备全州统一的标准化学考试，布鲁萨德就研究了一番考试的内容。布鲁萨德发现，这个考试其实可以破解的
    — 答案其实都在课本里！你只要把课本的内容参透了，通过考试就非常简单。反过来说如果你不看课本，哪怕知识面再广，也很难在考试上有所好的表现。


