  md: '# 日课171 | 一半是技艺，一半是运气


    日课171 | 一半是技艺，一半。 ↓


    德国输给墨西哥，巴西被瑞士逼平，哥伦比亚开场三分种就送给日本队一个点球+自罚一人的大礼包，荷兰和意大利早在预选赛就被淘汰。


    记者管这叫冷门，科学家管这叫测量误差。我们还是来讲讲科学家的眼光。


    为什么在足球比赛中强队会输给弱队？如果单看一两场比赛，你甚至会觉得这里面有阴谋：是不是博彩集团掏手了？事实是足球是一种非常不可控的比赛。也正因为比赛非常不可控，博彩集团很难在国际大赛中插手。如果你抛开情绪，像科学家一样冷静地分析比赛，把足球比赛当成测ag量两支球队水平的实验的话......你会发现这种实验的误差实在太大了。


    # 1.足球与随机性


    2013年，一个行为经济学家和一个统计学家出了本用大数据分析足球的书，叫《数字游戏》（The Numbers Game），其中提到一个非常能说明问题的统计事实。比如说一场比赛看上去强弱比较分明的比赛，赛前球迷看好强队，那么比赛结果，强队真取胜的可能有多大呢？


    答案是平均而言，强队获胜的概率只有50%。考虑到足球比赛有打平的可能，这个概率的确实完全随机强——但仍然是非常低的。以弱胜强在足球界是非常容易发生的事情，根本不需要用阴谋论解释。


    这两位教授量化估计，影响足球比赛结果的，一半靠技艺，一半靠运气。为什么足球比赛有这么大的随机性呢？有微观和宏观两方面的原因[1]。


    微观上的原因是足球这个项目的进球太少。足球的球场太大、球门太小、守门员的手太长、禁区里后卫的腿太多。一支球队哪怕是面对比自己弱的对手，九十分钟内也只有大约十几次射门机会，整场比赛下来双方总共只有两三个进球。这就好像一场伤似的面试，只问了两个问题，怎么能准确判断这人行不行呢？人说怀才就像怀孕，时间长了别人肯定能看出——足球比赛不是一个给你充分机会怀孕的项目。


    宏观上的原因，则是现代足球是个充分竞争和充分交流的项目。非洲有天才没钱，非洲的天才可以到欧洲踢球。冰岛队战平阿根廷之后很多人说冰岛队是业余球员组成的，其实冰岛队大部分都是职业球员，效力于德国、英格兰和丹麦的职业联赛[2]。事实是最好的球员几乎都在欧洲踢球，不太好的球员也是欧洲教练和欧洲教练培养出来的。充分竞争和充分交流的结果是足球圈的整体水平都很高，技战术没有秘密。


    我看有些伪球迷说的非常不靠谱。有人说弄一批死刑犯纯一年足球，打不进世界杯就枪毙——这是以为只要有所谓“拼搏精神”就能踢好球，殊不知拼搏精神根本不稀缺，现代足球根本不是关于拼搏精神的项目。还有人说“高考加一门足球”——我国高考非常重视数学，请问中国现在有几个世界级的数学家？


    以我之见，竞技水平行不行，关键在于你在不在那个充分竞争、充分交流的圈子里。圈外的边远地区基本没戏，圈内各国的水平差不了太多。


    低竞争水平的项目可能比智慧比技术，而越高是高竞争水平的项目，因为大家水平都很高，运气因素就非常重要了。


    好。那就算运气很重要，但技战术水平也还是很重要啊，不可否认强队的水准就是高——那现在的冷门是不是也太多了一些呢？


    其实一点都不多。冷门注定要发生。


    # 2.强队的体现


    咱们就以德国对墨西哥这场比赛为例。博彩公司开出的赔率，德国队胜是1.45，墨西哥队胜是8，两队打平是4.75。对应的概率分别是0.69、0.125和0.21。


    墨西哥队有12.5%的可能性取胜，这不叫奇迹：目睹一个概率是12.5%的事件发生是很平常的事情。如果12.5%就算爆冷，那小组赛第一轮16场比赛都不爆冷的概率是(1-12.5%)^16
    = 11.8%，也就是说，有高达88.2%的可能性，这16场比赛中至少出现一次墨西哥胜德国的事件。“众多可能的小概率事件中至少发生一个”，这是大概率事件。


    事实上，强队不但不能保证在单场比赛中获胜，而且就算踢上很多场，也未必一定比弱队表现好。咱们说一个稍微有点难的例子。假设现在是 NBA 篮球决赛，七局四胜。比赛双方一强一弱，单场获胜概率分别是55%和45%。那么请问，这个强队最终赢得冠军的概率有多大？


    55%对45%这个优势似乎已经挺大了，七局四胜的一个重要目的就是为了避免偶然性，让强队久经考验脱颖而出。但即使如此，这个强队最终夺冠的概率也只有60%[3]。


    这还不算。我在大卫·森普特的《足球数学》里看到他对英超联赛做过一个研究。他设定每个队的平均丢球数不变，强队还是强队弱队还是弱队，然后随机模拟每场比赛的比分。我们知道英超一共有20支球队，每个队每赛季要打38场比赛，那这么漫长的联赛是否足以确保强队夺冠呢？


    研究设定中实力最强的是曼联。森普特总共模拟了一万次英超联赛，曼联队只在其中26.3%的模拟中取得了冠军。这么长的联赛也不能保证最强者脱颖而出！我不知道莱斯特城在这模拟中有多大夺冠概率，这支由一群身价不高的球员组成的小球队在2016年居然超越众多豪门获得英超冠军。


    这就是足球。单场很可能爆冷门、杯赛冠军可以爆冷门，连联赛冠军都可能是冷门。


    那如此看来，足球这个项目是不是太不公平了呢？


    # 3.运气和公平


    想要让足球比赛结果更公平，办法非常简单——只要把球门加大就可以了。大幅增加每场比赛的进球数，强队就更容易体现实力。


    但足球界的理性选择是不应该这么做。


    足球不是高考，足球界最想要的不是每场结果都公平，而是每场能吸引多少观众。有悬念才有观众，有随机性才有悬念。


    这其实是所有比赛项目的共同课题。篮球和美式足球每场得分都比足球大很多，按理说随机性应该更低。《数字游戏》那本书中的统计，赛前预测的强队，在 NBA 和 NFL
    中取胜的概率都是70%。但考虑到比赛没有平局，这个随机性其实也不小。


    这其中一个重要原因是 NBA 和 NFL 都采取了限制强队实力的措施，比如说工资帽和给弱队选秀优先权的制度。联盟不希望队伍之间强弱太分明。如果强队稳赢弱队，比赛失去悬念，联盟就会失去观众！


    也许恰恰是因为足球天生的随机性就更大，足球联赛里一般没有限制强弱的措施。欧洲联赛中有些超级豪门俱乐部，他们花最多的钱买了最好的球星。而他们之所以能稳稳当当地做豪门，恰恰是因为他们有可能会输给非豪门！


    所以随机性并不是一个 bug，它是一个 feature。乒乓球从每局21分改成11分，排球从有发球权才能得分改成每球得分，都是在增加比赛随机性。观众喜欢公平，但观众也喜欢意外。公平
    + 随机 = 熟悉 + 意外。


    随机性是给穷人的礼物。你是富人靠科技，但是你也得允许穷人靠变异——这个项目才能长久地玩下去。


    # 由此得到


    +   1. 因为进球少，足球比赛本质上就有很大的随机性。

    2. 这个随机性使得强队即便在漫长的联赛中久经考验，也不一定能脱颖而出。

    3. 而这正是竞技体育的魅力所在。比分高的项目还想得别的办法增加随机性。


    一半靠技艺，一半靠运气，生活中这该这样的事情恐怕不只是体育。不过话说回来，技艺也很重要。下周我们就说说技艺。我们会讲到为什么C罗和梅西是逆天的存在——以及为什么他们并不容易率领自己的球队逆天。'
