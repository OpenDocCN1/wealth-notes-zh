- pgno: 123
  md: '经济学家玩模型，并不是为了直接用哪个模型指导经济运行。模型的作用在于获得洞见。Ariel Rubinstein 说得好，我们最好把经济学当寓言故事看。比较优势理论出自非常简单的模型，现实中的国家大都搞些贸易保护，但你不能说那个模型没用。


    实际治理经济的操作是艺术不是科学，没有一定之规。但是多了解一些模型，多获得一些洞见，就好像熟读历史案例、成语典故和寓言故事一样，对开拓思路有好处，而且能提醒我们不要犯别人犯过的错误。这就比单凭一种理念莽撞行事强得多。


    我们这一讲述的模型也是对真实经济行为的大大简化，但是它也得出了一个洞见，那就是哪怕没有钱生钱的马太效应，只要经济结构越来越深入，其中各人的收入差距就必然会增大。没有模型的推导，这句话就不能随便说。


    而且这个模型还提出了 k 值和 n 值这两个观察角度，对人有所启发。模型里的 k 值代表经济的“深耕”程度，以前电话线只接到小区的公共电话亭，现在深入到了每家每户，这就是
    k 值的增加。这个道理是经济就如同河水，总要越来越深入到每个角落，是个客观趋势，不是“谁”增加。


    这就已经很好了。至于说怎么调整贫富差距，那需要政府做动作，比如税收 —— 但这个模型里没有政府。这个模型的使命仅仅是探讨收入差距产生的机制。不过政府也可以从这个模型里获得启发，比如说减少
    k 值能让收入更平等。


    其实那些得了诺贝尔奖的理论也是这样，肯定不能直接用，而且也许连机制都错了，但是学术上有新意，大家一看有启发，也就算有价值。


    那为什么要用运输、而不用交换来代表创造财富呢？经济学家的共识是交换和分工是市场机制，能大大刺激财富创造。但是交换这个动作本身并不创造财富 —— 是劳动和知识创造财富
    [1]。我在山西有个煤矿 你在北京有两套房，咱俩在纸面上就可以完成交换，但是没有创造财富。自给自足的原始社会里没有交换，但是创造了财富。


    交换可以测量被交换的财富，你可以说交换等于 GDP，但是我们不能用 GDP 研究 GDP，我们需要更底层的机制。人的劳动有脑力和体力劳动，再加上受到资本的影响，不好量化分析
    —— 而运输是个更容易用来建模的量。这当然是非常粗糙的模型，但是它得出了洞见。


    搞研究就得敢于做这种大刀阔斧的简化。简单模型常常比复杂模型更能说明问题。爱因斯坦说什么东西都要尽可能简单，只要不过分简单就行。


    参考文献

    [1] 比如 http://www.digital economist.org/wth_4020.html 和这里 https://www.youtube.com/watch?v=661TPEvCCTU


