  md: '# 日课144 | 《园丁与木匠》3:当孩子玩的时候孩子在学什么


    日课144 | 《园丁与木匠》3:...


    今天咱们继续讲高普尼克的《园丁与木匠》，今天的主题是“玩”。六岁以下儿童的主要任务不是学习而是玩。而我们中国家长对玩，情绪复杂。


    有些家长认为玩是不必要的，是意志力薄弱的表现，甚至可能还是一种堕落，正所谓“骄户耽猎令人心发狂”。有些家长把玩设计成是一种休息或者奖励，比如有个说法叫“学习要认真地学习，玩要尽情地玩”，把玩当做充电和调节情绪的方法。


    这两种观点都是把孩子的玩和成年人旅游看电影打麻将唱卡拉OK那种给混淆了。孩子的玩，是必不可少的成长环节 —— 玩不仅能促进学习，而且是最重要的学习方式。


    可是话要这么说，似乎就有个矛盾。玩，肯定就没有 Suisse 什么目的，就不是“刻意”的，可是学习刻意练习啊？如果说玩能让人变得更聪明，那让孩子直接刻意练习、去做一些数学题之类，直接锻炼大脑不是更好吗？孩子为什么非得玩呢？


    关于玩的研究以前非常少，直到最近心理学学家才算有了一定认识。高普尼克本人和她的学生，就做了大量玩的实验。我非常喜欢高普尼克对玩的理解，可以说她已经有一个相当说得过去的“统一理论”。


    孩子的玩一共有三种：跟别的孩子玩、玩玩具、和假装。


    # 1.跟别的孩子玩


    这种玩法是人跟人玩，可以叫“打闹”。比如几个小孩在一起打闹、互相追逐嬉戏。


    打闹有点像打仗，孩子们就好像在演练各种攻防技术一样。但跟真实打仗又很不一样，我们专栏以前讲过《头脑里的大家》这本书的时候说过，打闹都是用特别夸张的动作，表示这是开玩笑不是真打。高普尼克还说，打闹都是双方向流进行，我打你一下，你也打我一下，大家都有演练机会。


    但打闹不是训练。打闹的好处在于学习社交互动。


    # 2.玩玩具


    哲学家卡尔·波普尔有句话说，作为科学家，如果你看到有数据不符合你的理论，你应该对这样的数据特别感兴趣。我们专栏讲过“信息就是意外”的道理，所谓探索，就是要寻找各种意外。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_68_0.png)


    # 3.对大脑的影响


    那你说就算要培养狐狸，我多报几个兴趣班，效率不是更高吗？不行。玩跟上课最大的区别在于它是一种主动的探索，是亲自面对真正的意外。吹拉弹唱才艺学习，这些都是按照老师要求做事，这不是玩。我们关心不是学会了多少技能，而是将来能不能应对新的环境。玩，是让孩子摸爬滚打一身伤痕换一份体会。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_68_1.png)


    # 4.假装出来的可能性


    很多动物都会打闹和玩玩具，但是只有人类的孩子会假装。'
