  md: '# 特别放<|reserved_special_token_1305|> | 关于学习的 15个真相


    特别放送 | 关于学习的15个...


    万维钢


    这几天是高考的日子，今天我碰巧为你准备了一个学习专题。可能对于考生来说，“学习”*就是这段时间*被讨论最多的事，但是对于咱们日课读者来说，“学习”一定是值得用*一生时间*来关注和探索的事。


    这个专题分方法篇、认知篇、误区篇和疑问篇，我希望能从以上4个维度，汇总截止到目前为止，人类对于“学习”这件事情的最新研究。当然，如果这些研究被更新了，我也会第一时间告诉你。这次我建议你看文稿来学习，这样你还可以通过点击相关文章的链接，获得更深度的理解。


    # —— 方法篇 ——


    # 1.间隙学习


    我们学习各种技能，有时候会遇到一个短暂的“平台期”。学习知识并不是越快越好。复杂的技能需要时间间隔。


    人脑的记忆原理，是“提取记忆”这个动作能够加强原有的记忆。所以有点间隔，暂时“忘记”一下，过不久再“回忆”一下，是效率最高的学习方式。


    现在心理学认为人有两种“工作记忆”。“短期工作记忆”相当于计算机内存，是完成一项具体工作的时候大脑随时使用的记忆。“长期工作记忆”相当于硬盘，是我们平时的知识储备。


    所谓学习，就是把进入到大脑的短期工作记忆的内容强化吸收，写进长期工作记忆之中的过程。所谓创新，就是把长期工作记忆中的相关内容调出来，放在短期工作记忆里跟新信息形成配合的过程。


    # 2.随机学习：


    随机排序学习法比有规律训练更有效。比如说小孩学写字不要一个字写十遍，最好几个字穿插着写。再比如做数学题不要同一个题型反复练，最好混合起来练每次都不一样的解题策略。


    再推进一步：不但学习内容应该随机安排，学习的地方，学习时候的环境，最好也能随机化。也就是说这堂课你在课桌上坐着学，下堂课最好在游泳池里泡着学，然后再下堂课可以考虑在床上躺着学……这种多样性的环境能对大脑产生各种刺激，特别有助于加深记忆。


    # 3.间隔+随机：


    这周学了一点就放下，下周接着学得先提取一下前面的记忆，这样多次提取，记忆就加深了很多。交叉着在同一时期内学习几门课程，比学完一门再学另一门的效果好得多。


    读书也是这样。我们应该随时都有好几本书在读。一本书拿过来读上一章就放下，明天换另一本书读，然后过几天再回到这本书接着读。这样每次读的时候都要先提取一下上一次的记忆，最后能记住的东西是最多的。


    # 4.分块学习：


    就是学习套路。把知识拆解成各种不同的“块”，通过各种重复训练，这些“块”就会以脑神经元连接的方式“长”在你的大脑之中。一一这里我们说的“长”可不是比喻，而是切切实实地，你的大脑里出现了这么一个硬件组织。


    脑子里长了这个“块”，就好像一台计算机里安装了一个子程序一样。将来要用到这个套路的时候你就根本不用有意识地现场琢磨怎么办，系统直接调用子程序，你可能完全无意识的就把招数使出来了。这才叫流利。


    # 5.刻意练习：


    你已经知道这个方法了，我再重复它的几个特点：


    +   * 只在“学习区”练习

    * 把训练内容分为有针对性的小块，对每一个小块进行重复练习，直到把这个套路“长”在大脑之中

    * 练习中要随时获得有效的反馈 —— 考试就是很好的反馈

    * 练习时注意力必须高度集中 —— 所以刻意练习不好玩


    刻意练习的一个关键，就是要脱离舒适区，只在压力状态下做事。成长来自打击，技艺来自争斗。尝试、失败，再尝试、再失败，直到掌握为止，我们要的就是这样“有成效的失败”。


    # 6.贝叶斯学习法：


    一个15个月大的婴儿学习事物因果关系的速度，会比年龄比他大的孩子更快 —— 这是因为婴儿大脑的可塑性更强！之前掌握的信息越弱，你改变自己看法的可能性就越大。这就是为什么小孩学东西比大人快。不断地猜测、试探、调整猜测，观点随着着事物发生改变。就是婴儿的学习方法，这就是贝叶斯方法。


