    日课131 | 科学家的核心价...


    现在有谁不是科学家的崇拜者呢？世人公认科学是第一伟大的力量，科学家的社会形象特别好，他们有时候会受到明星一样的热爱。


    有时候人们把科学家当体育明星，就好像球迷谈论梅西昨天晚上的进球一样吹嘘科学家的手术倜傥，仿佛与有荣焉。有时候我们把科学家的事迹当文艺八卦，像流行美剧《生活大爆炸》那样，认为这一群有点怪异但是又很可爱的人。科学可以是一个很酷的姿态，可以是一种范儿。


    绝大多数科学家做梦都没想过能有这样的关注吧。“如果不... ... ...看着科学家的話，你就错过了最有价值的东西。


    这本《思维简史》（The Upright Thinkers），讲的是人类历史上最古老而又最冒险的科学家的冒险故事。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_32_0.png)


    而你要想从他们身上学到真东西，读这本书最好的视角就不能是把自己当“粉丝”。你应该想象自己是他们的一员。


    这本书的作者伦纳德·蒙洛迪诺（Leonard Mlodinow）是成功的科学作家，但他也是一个真正的物理学家——他不是报道科学家的记者，他是科学家的同事。


    # 1.脱离日常生活，才有科学


    > “科学是人们对生产生活的观察和总结，科学知识对实践有指导意义。”


    请问你觉得这句话有没有道理。


    答案是这句话完全是错的。如果你相信这句话，你就是亚里士多德的学生——而你要知道，科学从伽利略那个时代开始，就已经不是这个意思了。


    # 2.科学家的内心挣扎


    我以前就是个物理学家，做过十多年的研究工作。我的一个重大体会会是做研究和学知识是两个完全不同的事儿。再难的物理教科书也是对真实物理研究的大大简化。有很多东西一旦跟你说破了，你接受了，完全可以很轻松地照着去做——但如果没有人告诉你，你要自己想出来来就难了。有时候你还要克服心理障碍。'
