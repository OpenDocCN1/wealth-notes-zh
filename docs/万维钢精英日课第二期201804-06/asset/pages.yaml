  md: '# 日课141 |《园丁与木匠》1:童年是一种风险解决方案


    日课141 |《园丁与木匠》1:...


    今天开始我们来讲一本有关怎么当家长的书，叫《园丁与木匠》（The Gardener and the Carpenter: What the New Science
    of Child Development Tells Us About the Relationship Between Parents and Children），作者是是加州大学伯克利分校的发展心理学家艾莉森·高普尼克（Alison
    Gopnik）。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_62_0.png)


    我们不是要讲什么育儿指南。高普尼克这本书带给我们的是 pav一种高级的知识和观念。我们要理解到底什么是“童年”，儿童到底是怎么学习的，这样才能得到成长的心法。


    你对孩子做什么操作，并不重要。重要的是你是个什么人，你跟孩子是个什么关系。


    今天咱们先说“童年”。童年时代，小孩到底应该干什么呢？


    # 1."家长"不是动词


    几十年前世界各地都是每家好几个孩子，能饱饱穿暖快乐长大就不错了，做家长没有什么育儿的焦虑感。中国家长大概是从八十年代开始对孩子精雕细刻，美国中产阶级则更早一点。


    Parent（家长）这个词，在美国从七十年代开始，普遍具有了动词的形式，可以写成 parenting —— 意思是作为家长对孩子的操作。


    你的 parenting 技能怎么样呢？育儿已经成了一门学问，有很多老一辈闻所未闻的讲究。


    比如说，小孩晚上睡觉，是应该跟家长在同一个房间甚至在同一张床上睡 —— 育儿术语叫 co-sleeping —— 还是自己单独睡一个房间？


    有些育儿专家会告诉你，一定是让孩子自己独立睡。很多美国家庭是孩子一出生就自己一个房间。但现在也有一些育儿专家说这样会影响孩子的性格，还是应该一起睡，给孩子更多关爱。两派专家都能说出一套一套的理论，简直是你只要做错了就等于是对孩子的犯罪。


    # 2.越来越长的童年


    以前说“穷人的孩子早当家”是一种美德，而现在的人三十岁了还整天“我们男孩子你们女孩子”，这是不是人的退化呢？


    # 3.风险策略'
  merge: -1
  img_proc: true
- pgno: 63
  md: '那如此说来，“早当家”就不是好事儿，孩子不能当鸡鸭鹅养，养育的重点不是掌握某一方面的技能，而是让他学会面对未来的不确定性。


    特别是幼儿，会多少个汉字，能不能算二十以内加减法，根本不重要。


    # 4.混乱的价值


    前几讲咱们先讲六岁以下的学龄前儿童的家教，之后再讲上学以后怎么办。六岁以下的儿童，他们的特点是混乱。


    家里有一个小孩就已经很乱了，像我家有两个孩子，孩子的小朋友有时候还来玩，简直就跟战场一样。但是高普尼克说，童年真正的价值就在于混乱。


    混乱是一种演化策略，有利于孩子发展各种个性，以备将来适应各种环境。有的孩子性格比较稳重，能专注做一件事，适合稳定的环境。可如果环境复杂多变，孩子最好就要有爱冒险的精神，能机警地意识到周围的变化。


    那难道说有什么环境就生产什么性格的孩子吗？不是。人类策略是各种孩子始终都有、各种性格都保留，让他们自己去闯荡不同的环境。


    由此来说，因为未来环境不可预测，孩子将来幸福不幸福、成功不成功就不是你所能决定的——得看他的特性跟他将来遇到的环境是否匹配。我们专栏第一季讲过“兰花和蒲公英”的概念，有的孩子像兰花特别挑环境，有的孩子像蒲公英走哪都能活。你决定不了你的孩子是什么，通常一家几个孩子都各有各的特点。


    孩子的运气是孩子自己的事情，家长所能做的是提供多方探索、体验不同环境的条件。我们爱孩子是无条件的，不论他是蒲公英还是兰花，安静还是外向，爱冒险还是胆小，我们都尽量提供探索资源。


    # |由此得到


    家长对孩子是一种关系，而不是一种工作。漫长的未成年期是人类的竞争优势，人类面对复杂多变的环境采取了先探索后收获的策略。童年时代的主要作用是探索和学习。童年，是一种风险解决方案。


    所以我们面对的第一个矛盾是探索和收获，对应到亲子关系上，就是依赖和独立。处理这个矛盾，家长要做的是提供资源保障，让孩子充分探索。


    家长不能确保孩子将来一定成功，不能确保孩子一定聪明，也不能确保孩子一定幸福。家长要做的不是给孩子定制、制定或者指定发展路线。家长能做的，是让孩子面对这个充满不确定性的世界，具备抗打击能力、自我发展能力和创新能力。


    这里所谓的探索，除了学习还有创新。所谓的提供资源保障，除了物质的还有更重要的是亲子关系上的。而事实上亲子关系对孩子学习有重大影响，咱们下一讲再说。


    # 划重点


    家长对孩子是一种关系，而不是一种工作。漫长的未成年期是人类的竞争优势，人类面对复杂多变的环境采取了先探索后收获的策略。童年时代的主要作用是探索和学习。童年，是一种风险解决方案。


