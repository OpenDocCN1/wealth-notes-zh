  md: '# 日课149 | 暗物质用“不存在”证明了自己的存在


    日课149 | 暗物质用“不存在”...


    今天我向你汇报一个新出来的物理学重大发现。这是一个关于“暗物质”的消息。这个发现还没有被百分之一百证实，但是我敢说，它的智识意义，比去年的“引力波”和几年前的“上帝粒子”更刺激。


    引力波和“上帝粒子”——其实应该叫“希格斯色子”，“上帝粒子”这个说法是记者的煽情——当然是重大发现，但是它们都是物理学家早就已经做出了预言，然后才发现的。它们不是惊喜，它们只不过证明了广义相对论和标准模型这两个理论是正确的。


    但是一个多月以前爆出的这个关于暗物质的发现，则是一次真正的意外。这可不是某个观测结果的数值跟理论预测稍有偏差那种微调性质的意外，这是美剧演着演着突然死了好几个主角的那种大意外。


    这是一个物理学家做梦都没想到意外发现。


    我们专栏第一季讲尼尔·泰森的《给忙碌者的天体物理学》的时候，专门有一期叫《暗物质的陪伴》，我建议你先重读一下那期文章。今天是续集。


    # | 前情提要


    暗物质是一种摸不着看不见、除了引力之外几乎不与其他相互作用的......物理学家在理论上设想的，物质。物理学家计算，这个宇宙中暗物质的总数量应该是已知物质的六倍。


    我们从未直接探测到暗物质，只是宇宙中有些现象，必须用暗物质来解释。我们没有暗物质存在的直接证据，但是我们有间接证据。


    最关键的间接证据，就是星系团外围的星系绕着星系团旋转的速度，和星系外围的恒星绕着星系旋转的速度，都远远超出了预期。


    我们打过一个比方，这就好比你抓住一根绳子的一端，在另一端拴上一个小球，让绳子以你的手为中心旋转。旋转速度越快，你手的拉力就必须越大。地球绕着太阳转，恒星绕着星系转，星系绕着星系团转，也是一样的道理：旋转速度越快，需要“拉住”它们的引力也必须越大。


    而引力是由质量提供的。天文学家数一数星系内部的可见物质，发现他们提供的引力根本支持不了外围恒星那么大的旋转速度。所以唯一的解释就是星系内部还有一些别的物质——比可见物质多得多的物质——在提供这个引力。


    物理学家排除了各种可能性：黑洞、流浪行星、星际气体......，现在我们相信，星系团和星系内部必然存在着大量的“暗物质”。


    根据这个假设，一个典型的星系团就应该是下面这个样子——


    ![](img/a2c55447bc97d25d1622d2d734d5541b_81_0.png)


    星系团被一团浓浓的暗物质包围。


    > “此前天文学家们陆续考察了别的星系团，结果每个星系团都有这个现象。”


    # | 新发现


    现在这个新发现就是，前面那句话，错了。


    严格地说星系团还是没问题，这个新发现 [1] 是关于星系的。三月29日，包括双子座北天文台、W·M·凯克天文台、哈勃太空望远镜和世界上其他几个天文台联合在《自然》杂志发表一篇论文
    [2]，说有一个编号为 NGC1052-DF2 的星系，它的内部，没有暗物质！


    ![](img/a2c55447bc97d25d1622d2d734d5541b_81_1.png)


    这个星系距离我们非常非常远，在6500万光年之外。而且它属于一种非常特殊的星系类别，叫“超稀疏星系（Ultra diffuse galaxy）”。超稀疏星系内部的恒星非常稀疏，单位空间里恒星的数量只大约相当于我们这个银河系的1%。超稀疏星系这个种类是直到2015年才被天文学家正式发现，结果马上就发现这种星系在宇宙中还很常见。对暗物质来说超稀疏星系并不特殊，天文学家研究过的其他超稀疏星系里都有暗物质，有些超稀疏星系内部，被认为几乎全都是暗物质。


    可是这个 NGC1052-DF2，却非常、非常不一样。天文学家测量了这个星系外围恒星的运动速度，发现它们正好就是星系内部那些可见物质的引力所能提供的速度，根本不需要暗物质。


    那你可能会说，这个星系离我们这么远，是不是里面还有别的东西，天文学家没看清楚？不会是这个原因。请注意，如果星系内部还有别的东西，引力就应该更强，外围恒星旋转的速度就应该更快——那只能说明*有*暗物质。天文学家观测到的结果是外围恒星的速度比有暗物质情况下要*慢*。


    当然，超乎寻常的论断需要超乎寻常的证据。而事实上，天文学家并不是看到一个观测结果就大喊大叫，这个结果是几个天文台加上哈勃望远镜互相交叉验证之后，才敢发表出来的。


    这是目前为止天文学家找到的唯一一个没有暗物质的星系。


    这个结果一出来就引发了大讨论 [3]。学术论文经过审稿程序再发表一般需要好几个月的时间，物理学家喜欢用不审稿的预印本服务器先把论文贴出来再说。不过这一此次更急，是直接在
    Twitter 上表态。我们现在能说的是有几个物理学家对这个结果表示质疑。


    凡是颠覆式的发现，一定会引发质疑。也许这个发现最终会被证伪，但也许过不了多久天文学家就会发现别的没有暗物质的星系。科学史的经验，是一旦发现一个，很快就能发现很多个。


    那么假设 NGC1052-DF2 内部真的没有暗物质，这事儿可就大了。


    # | 用“不存在”证明的存在


    如果 NGC1052-DF2 星系内部不存在暗物质，那么现在我们就可以确切地说，暗物质这种东西，的确存在。


    这个道理是这样的。我们以前的观测，是在每一个星系、每一个星系团内部，都有暗物质。那么人们就提出一个质疑，说也许根本不存在什么暗物质，是你的理论计算需要修改。毕竟我们从来没有直接探测到暗物质，我们只不过是发现外围恒星旋转速度太快，推测内部有暗物质来提供更大的引力。而我们计算引力和旋转速度的关系，用的是现有的引力理论——也就是广义相对论。那么的确就存在一种逻辑上的可能性，广义相对论有问题，而暗物质并不存在。


    绝大多数物理学家非常相信广义相对论，毕竟像引力波这样的观测结果已经证明广义相对论是一个很好的理论。另一方面，宇宙大爆炸理论也需要暗物质。我们需要暗物质的引力去帮着平衡宇宙膨胀。但是仍然有一些物理学家，就在试图提出修改版的引力理论，能在满足其他所有观测结果的情况下不要暗物质。


    说白了，就是这里有一个效应，你说这个效应是某个东西导致的，那我也可以说不存在什么东西，是物理定律要求必须有这个效应。


    如果暗物质在每个星系都存在，我完全可以说它并不存在，这只不过是星系的一个物理性质而已！


    现在好了！NGC1052-DF2 这个星系里就不在暗物质！这就说明其他所有那些星系，之所有会有旋转速度快吧这样的性质，不是<|message|>物理定律导致s的，而是那些星系的个性。


    暗物质可以出现也可以不出现，所以它一定是一种真实的东西，而不是幻觉。'
