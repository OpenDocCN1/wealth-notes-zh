  md: '定是一种真实的东西，而不是幻觉。暗物质就好像一个平时总是循规蹈矩的人，有一天终于表现出了她的个性，使我们终于相信她是个活生生的人。


    我觉得这件事不仅仅是个重要的物理学发现，而且在智识上也很有意思。一件东西如果无处不在、永远存在，那我们就完全可以说它不存在。


    比如以前物理学家相信空间中弥漫着一种叫“以太”的物质，是光的载体，它无处不在、永远存在。结果后来证明以太并不存在。这个世界并不需要以太，物理定律已经解释一切。


    还有，很多 人相信上帝的力量无处不在、永远存在，宇宙中任何事情都体现了上帝的意志——那好，我们就可以问，“上帝”，跟“物理定律”，有什么区别呢？物理定律永远都好使。只有在某一时间某一地点，上帝决定罢工不干活了，任由那里的事情发生一次混乱，我们才能相信，上帝不是物理定律，上帝有个性，上帝真实存在。


    其实“爱”也是这样。如果你从小到大都生活在周围亲友的爱之中，你可能根本感觉不到爱的存在，你以为这个世界就是这样优待每个人的……直到有一天，有个人突然不爱你了，你才意识到“爱”的存在。


    NGC1052-DF2 这个星系为什么没有暗物质，物理学家现在连最基本的猜测都没有。此前的 stereotypical 理论是连星系的诞生都必须要有暗物质参与才行。现在我们还在慢慢接受和体会这个震惊的发现。


    虽然还是没有直接的观测证据，但我们现在更加相信，暗物质真实存在。


