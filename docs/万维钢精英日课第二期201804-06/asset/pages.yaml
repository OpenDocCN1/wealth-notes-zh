    # —— 误区篇 ——


    # 10.好学校能提高学习成绩？


    学校的最主要作用是提供了一个社区环境。学校对学习的作用是安排学习内容、监督学习进度、考核学习水平、交流学习心得。学校对社交的作用可能比学习的作用大多了。至于说“学习”这个动作本身，那'
