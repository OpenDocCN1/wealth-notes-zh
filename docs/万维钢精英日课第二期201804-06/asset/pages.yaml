    # 来自日课：所罗门悖论


    所罗门悖论，感觉就像是旁观者清。但按照塔勒布的说法，旁观者应该没有利益攸关，做不出更好的决定才对呀？格罗斯曼和塔勒布会不会打起来？


    万维钢


    请注意，格罗斯曼说的是要*假装*自己是个旁观者——他可说遇事去问一个真正的旁观者的意见。最了解自己的人肯定是自己，承担后果的也是自己，所以决定权必须掌握在自己手里，这就是利益攸关。假装是个旁观者只不过是个思考问题的策略。'
