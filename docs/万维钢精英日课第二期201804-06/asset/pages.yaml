  md: '# 日课129｜《规模》5:城市快节奏的数学


    日课129｜《规模》5:城市...


    今天咱们继续讲韦斯特的《规模》，主题是接着说城市。大城市的生活常常能够给人们一些复杂的情感。特别是如果一个人小时候曾经体验过农村或者小城市的宁静生活，长大工作在大城市，对城市就可能有一种五味杂陈、甚至是又爱又恨的矛盾心理。


    一方面，大城市的确是好工作的机会多、各种好吃好玩的东西也多，新鲜事物层出不穷。另一方面，大城市里人和人的交往好像有点淡漠，有时候感觉都市就像是个钢筋水泥的丛林一样。特别是，越大城市，好像工作和生活节奏越快，好像什么事情还没有来得及看清楚就清楚，就已经过去了。


    所有这些感慨，其实都是对数学的感慨。


    # 1.大城市的步行速度


    几年前，美国某小城有一场大学橄榄球比赛。美国大学体育搞得特别专业，像这样的比赛一般都是全城谈论的焦点。当天正好赶上大雪，交通非常不便，比赛就被取消了。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_28_0.png)


