  md: '# 日课151 |《人工不智能》

    2:教你写一个人工智能程序


    日课151 |《人工不智能》2:教..


    咱俩继续说布鲁萨德的《人工不智能》这本书。我们想通过这本书消除你对人工智能技术的恐惧感，为此，咱俩今天要一起写一个真正的人工智能程序。


    注意我们可不是打着方闹着玩，我们要用真实的数据和真实的算法，做一个真实的人工智能项目。这个项目还有意思一一我们要用人工智能，预测，泰坦尼克号上每一位乘客的生死。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_92_0.png)


    # 1.一点理论准备


    像电视剧《西部世界》里那样的真人一样的人工智能，叫做“广义人工智能”，这种技术在可以预见的未来都不存在。现在大家用的都是“狭义人工智能”，而狭义人工智能的本质就是人们常说的“机器学习”。


    而所谓“机器学习”，也不是说机器有思想，它学会了一项技能。机器学习就是用一组数据建立一个统计模型，这个统计模型能对新的数据做出预言。输入数据越么精确，模型做出的预言就越准确，就好像是它在不断地“学习”一样。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_92_1.png)


    布鲁萨德在这本书中用的例子是用机器学习的方法判断泰坦尼克号上哪些乘客会存活，哪些乘客会遇难。这个例子不是她原创的，Kaggle 网站上有现成的教程 [1]，包括所有代码。你可以在自己的计算机上重复杂整个过程，你可能需要安装
    Python 语言和几个库函数包，但你总共只要写几十行的代码，把整个项目研究明白大概需要一个晚上的时间。


    # 2.实操


    我们将使用 Python 编程语言。我在专栏第一季说过，如果你想学编程，Python 是最直观最漂亮最简单的编程语言。


    ```

    train_url = "http://s3.amazonaws.com/assets.datacamp.com/course/Kaggle/train.csv"

    train = pd.read_csv(train_url)

    test_url = "http://s3.amazonaws.com/assets.datacamp.com/course/Kaggle/test.csv"

    ```


    +   * 乘客编号

    * 乘客是否存活

    * 乘客姓名

    * 舱位是头等舱、二等舱还是三等舱

    * 乘客的性别

    * 年龄

    * 在泰坦尼克号上有没有兄弟姐妹或者配偶

    * 在泰坦尼克号上有没有父母或者子女

    * 乘客的船票号码

    * 买的船票价格

    * 在船上住的房间编号

    * 在英国哪个口岸上的船。


