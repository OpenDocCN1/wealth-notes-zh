  md: '# 日课163 | 《为什么》4：贝叶斯的方法


    日课163 | 《为什么》4:贝叶.. ↓


    今天咱们继续说朱迪亚·珀尔的《为什么：因果关系的新科学》这本书。我们要讲一个特别常用、特别重要、也特别值得深思的思想：贝叶斯方法。


    这个名字咱们得到的读者已经听到很多次了，今天给你听听我们这个版本。如果你对“贝叶斯”这个词还无感，建议你先听一听罗辑思维第182期《我们到底该信谁？》，其中有罗胖讲的贝叶斯。


    用一句话概括贝叶斯思想，就是“观点随事实发生改变”。


    科学的世界里没有“坚定不移”这一说。咱们听卓克老师的《科学思维课》特别爱说一句话：“知识这东西就得经常地核实和订正”。这个道理很简单，你有一个什么信念，当有关这个信念的新事实进来之后，你就得修正这个信念。


    那怎么修正呢？坚定不移不对，听风就是雨也不对——科学地修正，就是贝叶斯方法。


    为了透彻理解这个方法，咱们能不能下一 点功夫，稍微用一点数学。数学本身很简单，就是对概率的加减乘除。把这个方法透了我想信你会有很大的满足感。当然你也可以跳过数学，那样你就只能收获一点哲学。


    贝叶斯方法有点像破案。福尔摩斯爱说自己用的是演绎法，其实不准确。破案是归纳法[1]。演绎法是按照规则推导一件事情的结果，归纳法是从结果追溯缘故。你是从一具尸体出发，推测是谁杀了她。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_124_0.png)


    贝叶斯方法的本质，就是从结果推测缘故。你怀疑凶手是老王，但是你没有任何证据，所以你的怀疑度比较低。有 system 一天终于从老王家搜出了凶器，这个证据会使你对老王的怀疑加重，你要更新对老王的怀疑。这就是观点随事实发生改变。


    而这首先是个哲学问题。


    # 1.信仰是一种概率


    俗人一说信仰都是坚定不移的，而哲学家会有不同的意见。


    1748年，苏格兰哲学家大卫·休谟写了一篇文章叫《论奇迹》。说像死人复活这种明显违反自然常识的事儿，只有几个目击者说看见了，这个证据是不是有点太弱了？休谟说的其实就是即疑复活，当然他不敢直接点名。


    休谟说的没毛病。平常的事儿我们容易接受，奇迹则需要更强的证据。卡尔·萨根说过一句话，“超乎寻常的论断需要超乎寻常的证据。”


    ![](img/a2c55447bc97d25d1622d2d734d5541b_124_1.png)


    那怎么量化证据和论断的联系呢？解决这个问题的是今天这一讲的主角，托马斯·贝叶斯。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_124_2.png)


    贝叶斯提出，什么叫“信”、什么叫“不信”呢？贝叶斯说，你对某个假设的相信程度，应该用一个概率来表示——P(假设)。


    P = 1 就是绝对相信，P = 0 就是绝对不信，P = 15% 就是有一点信。咱们先把信仰给量化。


    有了新的证据我们要更新这个概率，变成——P(假设|证据)


    这个叫条件概率。一般来说，P(A|B) 的意思是“在 B 事件是真的条件下，A 事件的概率”。咱们举个例子，A 表示下雨，B 表示带伞。一般来说这个地方不常下雨，所以
    P(A) = 0.1。但是今天你注意到爱看天气预报的老张上班带了伞，那你就可以推断，今天下雨的概率应该增加——在“老张带伞”这个条件下的下雨概率，就是 P(A|B)。


    注意如果我们画个因果关系，缘故 → 结果，在这里就是“下雨 → 带伞”，A → B，和“老王是凶手 → 在老王家找到凶器”，它们都相当于“假设 → 证据”。


    现在我们想算的是 P(假设|证据)，是从结果倒推缘故，这叫“逆概率”，这个不好算。一般都是从缘故推结果容易算。比如说你看见一个小孩向窗户扔球，你可以估计窗户被打破的概率有多大，这是“正向概率”。但如果你看到窗户碎了，想要推测窗户是怎么碎的，那就非常困难了。


    所以咱们要算的是一个逆概率，这要怎么算呢？这就是贝叶斯的方法。


    # 2.贝叶斯公式


    为了计算 P(A|B)，我们考虑这么一个问题：A 和 B 都发生的概率有多大？


    这道题有两个算法。一个办法是先算出 B 发生的概率有多大，是 P(B)；再算 B 发生的情况下，A 也发生的概率有多大，是 P(A|B)，那么 A、B 都发生的概率，就是把这两个数相乘，结果是
    P(A|B)×P(B)。同样道理，先考虑 A 发生再考虑 A 发生的条件下 B 也发生，结果是 P(B|A)×P(A)。这两个算法的结果一定相等，P(A|B)×P(B)
    = P(B|A)×P(A)，于是


    ```

    P(A|B) = P(B|A)/P(B) × P(A)

    ```


    这就是贝叶斯公式。之所以要这么算，就是因为常常是 P(A)，P(B) 和 P(B|A) 都容易知道，而这个逆概率 P(A|B) 只能用这个公式间接知道。


    现在咱们来算一个具体的应用。有一位40岁的女性去做乳腺癌的检查，检查结果是阳性。那请问，这位女性真的得了乳腺癌的概率有多大。


    我们用D表示她得了乳腺癌，T表示测试结果为阳性，这个因果关系是乳腺癌导致阳性，D → T。我们要计算 P(D|T)。根据贝叶斯公式，我们需要 P(D)，P(T)
    和 P(T|D)。


    在有新证据之前，P(D) 就是一般相同年龄段女性得乳腺癌的概率，统计表明是1/700。


    P(T|D) 是如果这个人真有乳腺癌，她的监测结果为阳性的可能性。这是由于检测仪器的敏感度决定的，答案是73%，仪器并不怎么准确。


    P(T) 是随便找个人，给她检测出阳性的可能性是多大。这个我们没有直接的数据，要拆成这个人有乳腺癌(D)和没有乳腺癌(~D)两种情况，其中 P(~D) =
    1-P(D) = 699/700。刚才说了有乳腺癌、检测为阳性的概率是73%。而没有乳腺癌的人还可能会被误诊成阳性，已知这个误诊率是 P(T|~D) = 12%。于是


    P(T) = P(T|D)×P(D) + P(T|~D)×P(~D) = 12.1%。


    把这些数字带入公式，我们最终得到 P(D|T) = 1/116。也就是说，哪怕这位女性被检测出来是乳腺癌阳性，她真得乳腺癌概率也只有不到1%。


    这是一个非常出乎意料的结论。但...'
