  md: '理偏误，人对损失的害怕超过了对获得的喜爱。而他没有考虑到“遍历性”的问题。塔勒布认为这个道理是如果存在赔光的可能，数学期望就没意义。所谓损失厌恶，其实是人们本能地反感这种赌博游戏，这是一种防微杜渐、矫枉过正、勿以恶小而为之的态度，这不叫非理性。


    # 用“利益攸关”的眼光看自己


    +   1. 别人对我应该怎么做。


    如果你没有利益攸关，你不要给别人提建议。你要向谁推荐哪个股票，首先你自己得买这个股票。如果别人要给你提建议，首先他自己得相信这个建议，最好他还得这么做过。他得用信用背书。


    +   2. 我对自己应该怎么做。


    原则是好好学习不要被淘汰。塔勒布不认可“寓教于乐”，他说为了满足好奇心、为了快乐而学习，不如因为痛苦而学习。


    系统终归会自动淘汰那些不好好学的人。系统总要演化。如果太脆弱，系统就崩溃了谁也好不了。如果稍微好一点，系统会慢慢淘汰那些不行的部分。


    所以真正的学习都是用淘汰的方式进行的。进化要想有效，不行的基因就必须得被淘汰。


    +   3. 我对世界应该怎么做。


    首先就是白银规则。但是如果你还想做得更好一点，想要追求荣誉的话，还有比 skin in the game 更高的一个境界，叫“soul in the game”，灵魂攸关。所谓灵魂攸关，是本来这个游戏里没有你的利益，但是你把它当成自己的利益。


    比如说工匠精神。很多工匠完成一个作品并不仅仅是为了挣钱，他觉得只要是我的作品，就必须得是个好东西。有工匠精神的人认为投机取巧是可耻的，他们比不卖假货、认真负责更高级。


    +   4. 一个延伸的相处法则


    # 怎样科学地和人相处？


    | 黄金法则 | 我想让别人怎么对待我，我就怎么对待别人。 |

    | 白银法则 | 我不想让别人怎么对待我，我就不要怎么对待别人。 |

    | 铂金法则 | 别人想怎么样，我就怎么对待他们。 |

    | 黄铜法则 | 别人怎么对我，我就怎么对别人。 |

    | 锌法则 | 奖励别人的时候，别人想怎么样我就怎么对待他们；惩罚别人的时候，别人不想怎么样我就怎么对待他们。 |

    | 铁法则 | 我想怎么对待别人就怎么对待别人 ——当然，要确保是在别人这么对我之前。 |

    | 锡法则 | 对上级，我用黄金法则；对其他人，我用铁法则。 |

    | 亲属法则 | 对亲属，我用黄金法则；对其他人，我用铁法则。 |

    | 互惠法则 | 首先对人使用黄金法则，然后根据他们的反应，使用黄铜法则。如果这次对方不跟我互惠，下次我就不跟他合作。 |

    | 一报还一报法则 | 首先对人使用黄金法则，然后根据他们的反应，使用黄铜法则。如果这次对方不跟我互惠，下次我…可以原谅他，再次寻求合作。 |


    那到底哪个法则好呢？首先你得看这是一个什么样的博弈。如果是零和博弈，比如说体育比赛，我要想赢你就必须得输，或者是双输博弈，比如核战争，那最适合的就是铁法则和锡法则：先发制人不客气。


    但生活中大部分博弈都不是这样的，完全可以寻求双赢。比如我们跟亲友之间，甚至跟社会上陌生人之间，都可以搞些互惠的合作。在这种情况下，博弈论已经做过无数次推演和计算机模拟，最好的办法就是“一报还一报法则”。这个原则差不多是这样的
    ——


