  md: '# 日课124 | 《规模》1:物理学祖师爷的洞见


    日课124 | 《规模》1:物理...


    今天开始咱们来说一本新书，叫《规模：关于增长创新可持续的普遍规律和生物体、城市、经济、公司的生命节奏》（Scale: The Universal Laws
    of Growth, Innovation, Sustainability, and the Pace of Life in Organisms, Cities,
    Economies, and Companies），作者是英国物理学家杰弗里·韦斯特（Geoffrey West）。这本书是去年出版的，现在中文版也快出来了。中信前沿出版社把译稿先给了我了，所以我们将看到中文的插图。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_14_0.png)


    从标题你就能看出来，这是一本跨界的书。这本书妙就妙在，虽然跨了这么多领域，但是背后有一个一致的，甚至可以说是简单的、底层原理。这个底层原理可以用一个简单数学公式表示，而知道怎么应用这个原理，则是物理学家的功夫。


    全书最根本的思想，就是世间万事万物，通常都不能按照简单的线性比例放大。


    最早提出这个思想的，正是现代物理学的祖师爷，伽利略。早在1638年，伽利略出了一本书叫《关于两门新科学的对话》，其中就讨论了尺度问题。


    比如这有一棵树，你可能会问一个自然的问题，这棵树能不能按比例越长越高、越长越粗，以至于无限呢？


    伽利略不需要知道树的化学成分都是什么，也不需要了解关于树怎么生长的生物学，他就可以告诉你，这是行不的。


    你只要学过简单的几何学，就知道树的体积和重量，是跟树的尺寸的立方成正比。而由于同样的材料只能支撑同样的压强，所以树的支撑力量，是由树的横截面积决定的，这跟树的尺寸的平方成正比。


    好，如果你把树高度扩大十倍，那么它的体积和重量将会扩大到原来的一千倍，而它的力量只会变成原来的一百倍。也就是说，它要用一百倍的力量去承载一千倍的重量，它的负担更重了。这么一直长下去，早晚有一个时候，树将会承担不了它自身的重量。


    所以你不能按相同比例放大。一般特别重的生物，腿就必须得不成比例地特别粗才行。伽利略早在四百年前就想明白了这个道理，但是直到今天这个道理也没有普及开来。


    比如我们看电影《哥斯拉》，哥斯拉是一只很大很大的怪兽，它一只脚的高度就超过了一个大楼。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_14_1.png)


    因为韦斯特用尺度分析研究生物体已经出名了，《哥斯拉》美国版电影上映的时候，有记者就问韦斯特，你能不能ро测一下哥斯拉的移动速度应该是多少——韦斯特说，别的都不用算了，首先这么大动物就不应该存在，因为它会被自己的体重压垮！


    尺度分析是个看似很简单的武器，我们精英日课专栏以前都讲过。但是韦斯特的研究和他这本书，则把这个武器给用到了极致，可以说是大杀四方。为了理解这一切，咱们把数学给说清楚。


    # 1.数学


    当年霍金写《时间简史》的时候，出版商跟他说，你书里每出现一个数学公式，都会让销量减少一半。结果现在不出现公式已经成了英文世界通俗科学写作的一个约定俗成的规矩。


    可是这本书不用公式不行啊。韦斯特的做法是不直接给公式，但是他用语言去描述公式——结果反而还不容易说清楚。所以咱们干脆反其道而行之，先来看个公式。你不需要勇气就能看懂下面这个公式，连初中生都能看懂——


    ```

    Y = c X^k

    ```


    Y等于c乘以X的k次方。其中c是一个不重要的常数，这个公式是说，Y和X的k次方成正比。物理学家有时候会把这个说法写成更简洁的形式——


    ```

    Y ∝ X^k

    ```


    这就是贯穿全书的公式，物理学家把它称之为“标度率”。其中这个作为幂率的k，决定了整个系统的性质。


    如果k=1，那就是线性关系，你可以按照简单比例放大，X增大一倍，Y也增大一倍。如果k>1，就叫做“超线性”关系，英文叫 superlinear；如果k<1，就叫“次线性”关系，英文叫
    sublinear。


    这基本上就是你在这本书里需要的全部数学。


    举个例子。面积是跟长度的平方成正比，体积是跟长度的立方成正比，那么你就可以推算出来，面积是跟重量的2/3次方成正比。而对生物体来说，我们又知道，它的重量是跟体积成正比，而力量是跟面积成正比，对吧？也就是说，一个生物体的力量，是和他体重的2/3次方成正比。k=2/3。


    而这是可以验证的！化学家利兹克（M. H. Lietzke），就用1956年奥运会举重比赛的成绩，验证了伽利略当年提出的这个尺度关系。


    我们知道举重比赛是按照体重分级。利兹克把每个级别的金牌成绩和运动员的体重放在一起，画了一张图。这张图，是用对数坐标来画的。


    为了理解这张图，咱们还是回到刚才那个公式。对公式两边取个对数，就是


    ```

    log Y = log c + k log X

    ```


    这意味着在对数坐标图上，Y和X的关系曲线应该是一条直线，而这个直线的斜率就是k。这正是利兹克看到的！


    ![](img/a2c55447bc97d25d1622d2d734d5541b_14_2.png)


    咱们看这张图，体重和成绩的对数关系正好就是一个近似的直线。利兹克算出来这个直线的斜率是0.675，而理论值2/3=0.667，非常，非常接近。奥运会举重比赛的成绩几乎完美地符合力量正比于体重的2/3次方这个定律。


    因为这个定律中的k=2/3是小于1的，所以相对于体重的增长，力量的增长速度是比较慢的。这就意味着越小的东西反而看起来越有力量。


    蚂蚁非常小，但是它可以背起来比它自身体重很多的东西。小昆虫小蜜蜂的活动频率远远高于人类。伽利略当时就说了，一个小狗能背起来三只跟它同样重量的小狗，但是—匹马，就不能背起来—匹跟它同样重量的马。


    作为孩子家长我对此深有体会。大人已经很累了，孩子们仍然在不知疲倦地跑来跑去。这并不是说我们应该向孩子学习什么“积极向上的精神”……根本原因在于小孩体重轻，他们的相对力量更强。


