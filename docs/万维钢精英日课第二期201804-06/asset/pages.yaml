  md: '# 答读者问 | 技术和经济学


    答读者问 | 技术和经济学


    # 来自日课: 工程问题和社会问题


    布鲁萨德认为技术没有真正解决社会问题，是因为人的数据不正确。那么当技术不需要人类参与的时候，不就可以一劳永逸地解决这个问题了吗？这难道不是技术发展的源动力吗？


    现在线上购物录入的数据可以造假，录入数据的是人，有的人不录入，有的人录假的。当写程序的也是人，那录入数据的人和写程序的人相互博弈，是不是能够推动技术的完善和发展呢？


    万维钢


    如果现有的技术和人不匹配，解决方法肯定是要么提高技术水平，让技术变得更简单易用更可靠；要么提高人的素质，或者让另一些人制衡这些人。我们无法接受的局面是如何看着这些问题就在那里没人管呢？


    事实是有某些问题就是没人管。还记得我们当初讲《未来简史》的时候，其中提到一份报告，论证将来的什么样的工作会被人工智能取代。那份报告对人工智能技术非常乐观，认为很多工作、特别是像医生和律师这样的高级工作都会被人工智能取代。但就是这份报告认为，“考古学家”这个职业，不会很快被人工智能取代。


    为什么呢？并不是因为考古学太难 —— 有很多比考古学还难的职业都会被取代 —— 而是因为考古学是个没有什么利润的行业。从事考古研究的人很少，他们不费钱 ——
    人工智能公司不值得为这个行业专门研发一套系统。


    在线购物的数据对买卖双方都很重要，涉及到真金白银，相关公司乐意投入人手让数据更真实。但是学校分发教科书这个事儿，毕业只是校长日常工作中很小很小的一部分，根本不值得专门研发一套更高级的系统。有钱还不如多买几本教科书，毕业在中国人不用高科技也能实现人手一本教材。


    这个道理是一个技术要想惠及社会每一个角落，它必须得变得非常非常*通用*才可以，*定制*的成本太高。如果有个拥有通用智能的机器人，他可以自学各种人的操作，那当然所有这些问题都能解决。可那实在是太难太难了。


    从科幻角度，当然不管是什么问题我们都能想象一种技术来解决它。从现实角度，该说技术必须得谈成本和经济学。


    # 来自日课: 教你写一个人工智能程序


    如果人工智能是彻底的经验主义，那么人工智能在未来有可能有自我创新知识吗？经验主义有可能产生创新吗？


    万维钢


    创新有好多种，有一种创新叫“暴力破解”。比如爱迪生发明电灯，他不知道灯芯应该用什么材料做，做了实验测试了好几种材料，这个测试的过程就是暴力破解。每一次测试结果不行，别人说你的实验又失败了，爱迪生说我这不叫失败，我这叫积累数据
    —— 现在我多了一个知识，我知道这种材料不好使。


    这是一种用蛮力、在一个固定的范围内不断尝试的过程。最后爱迪生终于找到一种材料能做灯芯，那你能说这不是创新吗？这样的创新，就特别适合让人工智能去做。


    Alpha Go 跟人类对战的时候，职业棋手一看它用了很多人类不曾用过的下法，心中赞叹 Alpha Go 把围棋技术往前推动了一大步，是宗师级别的创新。但事实上
    Alpha Go 做的的事情和爱迪生测试灯芯材料没有本质区别。围棋棋盘就只有这么大，程序无非是在绝大部分都是失败的经验中积累成功经验。


    爱迪生有句名言说1%的灵感加上99%的汗水。Alpha Go 这个项目中1%的灵感属于人类给它的设定，计算机承担的是那99%的汗水。爱迪生生产的是电灯，Alpha
    Go 生产的是新颖的围棋走法，但他们都是主要依靠汗水。


    我猜测，未来人类最应该做的是那种“跳出盒子 (think out of the box)”式的创新。别人都像人工智能一样在这个固定的范围里寻找答案，你却从一个看似不相干的领域找到了答案。比如别人开餐馆都在研究怎么让饭菜更好吃，你却在“文化溯源”方面下功夫，用一个新特色吸引顾客，这是换一个维度的玩法。


    试想如果我在下一盘围棋的过程中，突然提出一个临时动议，说咱们能不能把规则改一下，给每个人三次机会，让自己的一个棋子在棋盘上移动一格？如果我对面是人类职业高手，他肯定能比我更快速适应这个新规则
    —— 而如果我对面是 Alpha Go，它将无所适从。


    ![](img/a2c55447bc97d25d1622d2d734d5541b_99_0.png)


    # 来自日课: 自动驾驶能有多难？


    如果划出一条自动驾驶汽车专用车道，直接优化导致自动驾驶汽车遭遇意外的因素，是不是就行了呢？


    在那个倒下或者被压扁的标记牌上，在不同的几个位置上分别安装上能够发射信号的装置。那汽车不就能很方便地识别出这是一个标志牌吗？我们难道不能发挥汽车的优势，用汽车特有的方法让他实现最终相同的目的？


    万维钢


    这些在技术上都是可行的。事实上早在2000年左右，人工智能技术还没真正起步的时候，就有德国的公司打算用这样的方式实现一定程度的自动驾驶。当时的方案是在高速公路上铺设特殊的指引装置。


    当然最终并没有这么做。因为这其实是个经济学问题，如果我们并不是要不惜一切代价实现自动驾驶。


    火车需要专用的铁路，人们就铺设了铁路，那是因为这个技术一旦用上好处实在太大了。自动驾驶并不是非有不可的技术，绝大多数人并不在乎自己开车。如果路上根本就没有几辆车有自动驾驶功能，专门为此建设基础设施就是不值得的。如果必须依赖特殊的基础设施才能上路，那就不上了路。


    其实电动汽车也面临类似的问题，好在人们可以在自己家充电，只要充一次电能足够长里程，就不用依赖外面的充电桩。而电动车多了以后，充电桩也值得建设。这是一个相互促进的正反馈循环。


    可是自动驾驶如果依赖基础设施，却很可能不是互相促进，而是互相等待。


    万老师什么时候也能向我们介绍一下，有关“慕课”、“可汗学院”作为代表的互联网技术在教育上的“无能”的研究。因为在教育领域，目前国家、企业、学校对网上教育都投入了大量的资源，但这些投入、网
    上课程，到底能产生多大效果？网上教学能不能取代现实的课堂教学？这个技术的局限是什么？


    万维钢


    美国现在是非常严肃认真地对待在线教育。有很多大学已经把一些正式的课程给放到了线上。也就是说还是正规录取来的学生，还是正式的学分，只不过你不用去教室了，自己在宿舍里用在线的方式上课。还有些高中也允许学生选修一门在线课程。像这样的课程非常正规，同样有作业、有学习小组的线下讨论、有考试，有答疑。唯一区别就是以前坐在教室里听讲，现在改成了看视频。


    这种在线教育的效果很不错。2014年麻省理工学院把一门物理课改成了在线课程，结果学生们的学习效果跟传统教学一样好 [1]。2015年的一个综合分析报道 [2]
    说，在线课程的效果有好有坏，总体上可能还比传统教学更...'
