    # 来自日课：美国的中年人


    请问万老师，美国人一生会换多个行业是因为国家处于某个发展阶段呢，还是因为福利好所以可以没有顾虑地“随心所欲”呢？


    ![](img/a2c55447bc97d25d1622d2d734d5541b_49_0.png)


    肯定不是福利好的原因，事实上美国很多老人工作是因为退休金没存够，不得不工作。


    我觉得国家发展阶段的原因更重要。中国二三十年以前大部分工作都是体力劳动，确实是不适合老人，特别是女性50岁甚至45岁就退休了。而我们现在看中国退休以后还返聘的，大多是教授和教师这些知识型的工作。所以这里面肯定有社会惯性、以及中国现在能给中年人提供的工作岗位还不够多的原因。


    中美之间由于种种原因，中国中老年这一代的综合素质是比不过美国。请问万老师，在未来中美年轻一代差距还有这么大吗？


    ![](img/a2c55447bc97d25d1622d2d734d5541b_49_1.png)


