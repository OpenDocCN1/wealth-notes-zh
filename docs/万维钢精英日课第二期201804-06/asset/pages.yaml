    旧模式已经不行了, 想转型已经来不及了, 直接退出是唯一的做法。\n\n10.好战略应该走极端。战略不是做动作, 而是做“大动作”, CEO们通常都低估了到底什么叫“大”。市场竞争就是这样,\
