    \n- **一蓑小隐**\n    史上最著名的外来物种入侵应该是澳大利亚的兔子。澳洲的大型哺乳动物基本上在智人到来之后没多久就灭绝殆尽，欧洲的兔子在澳大利亚没有狼、狐狸之类的天敌，气候宜居，食物充足，不到30年的时间，整个澳大利亚的兔子达到了惊人的100亿只，直到今天还是“兔”满为患，给澳大利亚的生态带来了严重的破坏，自然演化的生态系统是非常复杂的系统，往往一环扣一环，简单的一环被破坏，整个系统都深受其害。但想要修复，可就不是单单修复一环的事，要难逛的多得多。所谓病来如山倒，病去如抽丝。\n\
    \n- **孔维玮**\n    1. 链与循环的概念可以通过食物链的理解来构建。应该说，对于孩子最容易理解的就是线性概念，一件事触发另一件事，但链与循环概念的建立让我们知道一件事可以触发多个后续事件，而且彼此环环相扣。\n\
    \    2. 互联网和物联网已经被大家所熟知，但人类对于自然的研究，特别是基于生物链的研究还应该更深人。这种低功率、自平衡、具有一定稳定性的生态网是不是也值得我们依构建信息网络时来借鉴，例如，共享单车在一个地方出现缺失或大量闲置，是否也可以通过构建各类循环网络得以深入分析，增强借还网络的完善性。\n\
    \n- **徐来**\n    今天，是博物学陪伴你的第 144 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n\n## 宇宙·空间 | 人类最远到过哪儿？\n\
    \n世界好大，奇妙的事情每天都有，我们一起 去发现吧！\n\n你有没有想过，人类到达的最远的地方是哪里呢？之前，我在这个专栏里跟你讲过“复活节岛”的故事，这个地方很容易找到，现在有人类居住的地方，最不容易找到的就是复活节岛，因为这里周围的陆地都很远。\n\
    \n除了复活节岛，南极的酷地也算一个很难到达的地方，但是这里也有人到达过。如果不限于地球的话，人类到达的最远的地方应该是月球，美国人曾经6次成功登月并返回，有12个人在月球上留下过自己的脚印--这是人类靠自己的力量到达的最远的地方。\n\
    \n但如果你想把人造物体也算到进去的话，那么人类已经抵达过一个你遥不可及想象的地方--那就是，太阳系 边缘。代替人类去到那里的，就是“旅行者1号”飞行器。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_107_0.png)\n\n## 在太阳系里“玩弹弓”\n\n“旅行者1号”真是一个很很神气的飞船。另外另一艘叫作“旅行者2号”的飞船后面发射，科学家发射它们的目的，只是为了抓住一次170多年一遇的机会。\n\
    \n这个机会是一种被称为“引力弹弓效应”的东西有关。引力弹弓效应，又叫引力加速。其实，你已经听说过，地球对周围的东 西都会产生很大的力，其他的星球飞行到它周围的东\
    \ 西也会产生这样的引力效应。一般飞船，如果在飞得靠近某个行星的时候，恰好地利用这个效应，就可以改变飞行的方向，超过了。在超过的时候，他伸出 手来，拉了你一把。这个时候，你就会出现\
    \ 一个加速的效果。有时候，你可以利用对方的力把你打 能量来拐弯儿。引力 弹弓的原来跟这个几乎是一 的--唯一的区别是，引力弹弓用的是引力而不是谁伸了手。\n\
    \n引力弹弓的好处是，加速的能量是从行星那里偷来的，所以等于先空赚了能量，好处是，远飞得很快了才能用这个引力弹弓，永远就不能一行了。 如果没要专门消耗能量“飞过去”，那就不划算了。\n\
    \n几乎发射所有远距离的飞船都要用引力弹弓，要根据目的地和发射时候的行星来计 划。过去哪些行星是好算的，哪些是不划算的。但是在70年代的时候，科学家通过认真观察，太阳系的大几大行星排成十字形成一个特殊的排列一-不是按顺序十字形或者一字形，而是说，在这种排列条件下，可以利用大多数恒星，让地球发射的探测器用消耗很多能量，就能路过好几个行星。\
    \ 这不仅节省了探测行星的好机会， 且有几个行星的位置合适，还可以提供加速的能量。\n\n这样一来，科学家在地球上发射的探测器， 用比较少的燃料就可以用尽可能多地去探测那些太阳系里，人类从来没有任何观察到过的行星了。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_107_1.png)\n\n## 后发到 而先至的旅行者\n\n为了赶上那\
    \ 一次170年一遇的好排列，美国航空航天局的科学家们在1977年一这一 年前，他们的爸爸或妈妈都没在出生。就在那一年，他们分别发射了两个几乎完 全一样的旅行者号。8月底发射的是旅行者2号，40年前，也就是1977年的9月\
    \ 5日，发射的是旅行者1号。\n\n咦，你会觉得奇怪吧？为什么说先说2号后说1 号呢？\n\n因为发射顺序就是这样的，“旅行者2号” 要比“旅行者1号”早发射几天。我这么说，你大概就会奇了，难道号\
    \ 表示的不是它们发射的先后顺序吗？\n\n诶，如果你真的这样想，还真就猜错了，序号确实说的不是发射的顺序，而是项目规划的先后。实际上，这两颗探测器，执行的任务略有不同。“旅行者1号”从地球上起飞之后，会利用行星\
    \ 的引力弹弓效应，飞出去， 到达土星，并且对它们进行近距离的观 察，然后，它会飞向土星的大卫星土卫六。 我是在“距离太阳系 最像地球的卫星”专栏里介绍过土卫六，科学家对它充满了好奇，所以仔细对土\
    \ 卫六，再往后，“旅行者1号”就不在 管其他的行星或者卫星了，而是按接着太阳系的边缘，头也不回地一路冲过去。\n\n“旅行者2号”一开始的路线也是差不多\
    \ 的， 会先经过 木星 和土星。不过，它不会去关注土星的卫星，而是朝着天王 星继续 出发， 在对问天王 星之后，再冲向外星系的边 缘，所以，我们现在看到的\
    \ 天王星 和 海王星 的照片，都是“旅行者2号”传回来的。\n\n有意思的是，虽然“旅行者1号”要比“旅行者 2号”晚几天发射，但是因为任务不同， 所以它们的行进速度更加\
    \ “旅行者2号”快 一些。\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_107_2.png)\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_107_3.png)\n\
    \n## 突破太阳系的边界\n\n你刚才 看张君 德描写的 “快一些”，因为 它们飞行的距离 特别特别得远，所以，虽然速度上上 有一点点差别，但是累计起来\
    \ 差别也会大。 当“旅行者2号”抵达 第一个 重要 目标 行星的 时候，“旅行者1号”已经 离开 木星 多年了。\n\n科学家们 通过 发现， 在这 个位置\
    \ 上，出现 了一些 不同 寻常的 现象。 因为 在此 之前， 科学 家们 通过 计算 后 预言， 在 太阳系 的 边 界 上， 某 些 特 殊的 物 质\
    \ 粒 子， 会 这 个 范 围 的 飞 进 来 。 而 现在 “旅 行 者 1 号 ” 上 携 带 的 设 备 显 示 ， 在 这 个 深 空 探 测 到\
    \ 了 这 个 范 围 。 从 这 个 意 思 上 说 ， “旅 行 者 1 号 ” 很 可 能 已 经 飞 出 了 太 阳 系 ， 进 入 了 太 阳 系\
    \ 外 更 为 广 阔 的 宇 宙 空 间 。\n\n当然，也有一些科学家对这个结果产生了怀疑。为了确认这一点，科学家们又经历了一段时间的争吵和数据分析。最后，在2013年，美国航空航天局终于确认，“旅行者1号”已经飞出了太阳系。它不但是飞得最远的人造物体，也是第一个进入太阳系外的人造物体。\n\
    \n接下来，“旅行者1号”上的电池还会维持它工作8年，在这8年里，它会继续把自己看到的东西传输回地球。那么，“旅行者1号”还会碰到什么呢？这个没有人能猜得到。\n\
    \n不过，到了2025年之后，我们就会和它永远地失去联系。它将带着一块金唱片继续前进。\n\n## 博物学家养成记\n\n金唱片里记录了一些图像和声音。其中有55个人用55种不同的语言和方言表达的问候，其中包括“各位都好吧？我们都很想念你们，有空请到这儿来玩。”或者“太空中的朋友，你们好，吃了吗，有空来玩。”此外，还收录了一些地球上的声音，是不是很有意思呢？\n\
    \n我在今天的文章末尾，给你准备了一个彩蛋，是金唱片里的一段声音，快去听一听吧，然后在留言区告诉我，你都听到了什么？\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_108_0.png)\n\
    \n### 卫星-宇宙 | 谁是太阳系里最像地球的行星？\n\n- 1. 旅行者1号是所有人造物物体当中走得最远的一个，科学家们普遍认为，它已经飞出了太阳系，进入了太阳系外的星际空间；\n\
    - 2. 旅行者1号和旅行者2号是美国航空航天局在1977年发射的，当时发射的目的是为了利用行星间特殊的位置关系，更好地使用引力弹弓效应。这样的位置关系每170多年才会出现一次；\n\
    - 3. 旅行者1号上携带了一张金唱片，里面收录了一些来自地球的影像和声音，期待有一天在浩瀚的宇宙里被外星人捕获，实现一次星际交流。\n\n旅行者1号：美国国家航空航天局研制的一艘无人外太阳系空间探测器。它是有史以来距离地球最远的人造飞行器，也是第一个离开太阳系的人造飞行器。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_108_1.png)\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_108_2.png)\n\
    \n**众人都谈听的自然科学课**\n\n**徐来**\n\n今天，是博物学陪伴你的第146天，恭喜你，又收集了一个新知识！下期我们继续研究。\n\n##\
    \ 宇宙·卫星 | 月亮是如何诞生的？\n\n世界好好，奇妙的事情每天都有，我们一起去发现吧！\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_109_0.png)\n\
    \n夜晚的天空里，月亮是最亮的一个。实际上月亮是天空中所有能看得到东西里面，第二亮的，那第一亮的第一什么是完全不一样的。太阳自己发发光发热。我们地球之所以会有生命，会有我们现在看到的这一切，几乎完全是靠太阳给我的。而月亮虽然很亮，但是它本身并不发光，只是反射太阳光，因为月亮和我们比较近，所以即使它只是反射太阳光，也很容易被站在地球上的我们看到。\n\
    \n### 月亮有什么特别之处\n\n你说没有，地球周围为什么会有个月亮呢？听我这样说，你是不是觉得没有啥好笑，这有什么可有什么的，月亮就是月亮，从一开始就在那里，有什么好问什么的！\n\
    \n不过，这个“为什么”可不止我一个人，其实很多大学者都在问这个问题：地球周围为什么会有个月亮？或者换一种问的方法就是月亮在历上是怎么来的？这是一个非常非常有意思的问题，因为月亮真是太不正常了。\n\
    \n不寻常在哪儿呢？它大，非常非常大的大，在宇宙里就算不了什么了。因为宇宙里特别大的东西太多了。就像我们的太阳系来说吧，地球不大，对咱们人类来说，地球是很大的，太大了。但是和太阳系里最大的星星木星大。火星是地球的1300多倍，地球大了可不是一个星点儿。可木星就是很大的。太阳也是很大的星球，太阳系最大的太阳系最大，站在太阳系的边缘看着太阳，那么大的一个星球，也成了黑色幕布上的一个小白点儿。所以，你看，“大”并不稀奇。可月亮的大，是说它本身在不大中，而是说它相对于地球而言，实在是太大了。\n\
    \n有多大呢？咱们跟其他星球比一下，太阳星星很多行星都像地球一样，有卫星。卫星呢？我之前在《火星就是没有重力吗？》这篇文章里解释过。卫星就是围绕一颗行星轨道做圆周运行的天体，所以，月亮就是地球的卫星。\n\
    \n太阳系里有些行星的卫星非常大，比如木星土星的卫星很多都比卫星大，但是人围绕的行星本身就不大。我刚才也说了，木星的大小是地球的1300多倍，虽然它们的卫星很大，却能轻易带得动。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_109_1.png)\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_109_2.png)\n\
    \n地球的情况就不太一样，虽然月球还是比地球小很多，但是两者之间的差别，远不如其他行星那么悬殊，地球的体积只是月球的49倍多，而地球的重力却大得实在很难吃的。为什么说呢？这就好比你的爸爸妈妈，他们都是在二十多岁时生下你，当了爸爸妈妈，是不是不太可能在你这个年纪就当上爸爸妈妈，对吧。\n\
    \n所以，天文学家一直都觉得，这事有点小那点儿，这个卫星算个大个头儿，这么大的卫星是怎么来的，也就弄清了，为什么地球的卫星这么大，很现。\n\n### 关于月球起源的猜想\n\
    \n这个问题最著名的答案是达尔文提的。达尔文提了，不过不是那个进化论的达尔文，而是他儿子乔治达尔文。这个达尔文是天文学家，也很厉害，曾经组织过皇家天文学协会的会刊。他对月亮的起源，提出了一个学说，他认为其实月球本来是地球的一部分，地球一直在快速自转，所以就想把它想象成一个大饼，在原珠转。转转转，越转越快，然后把那个肥又大大的肚子，“哼”一下给甩了出去。甩出去的肚子就变成了月亮，肚子里不是全去了一块儿吗？所以就变成了现在的太平洋。\n\
    \n这个说法可真够有想象力的，以后大家也就减肥了，就站在转丹田肚子就行了……\n\n虽然这个观点是很厉害得科学家提出来的，但是大家讨论了一下，发现有很多问题。月球到地球的距离是木星半年的20倍，月亮怎么能是一块儿出现呢？所以，这个也没人肯了。\n\
    \n还有人提出了第二种看法，认为，月球也不知道是从哪儿来的，反正就是在宇宙到处乱跑，有一天，路过地球的旁边，被地球引力拉着，不是就留了下来。这个说法真的太扯了，刚刚咱们已经说了，相对于地球这个大小来说，拥有一颗月球这么大的卫星本来就有点儿不太寻常，因为太吃力了。在这种情况下，你想还帮助到一个卫星？这是不太可能的。\n\
    \n### 公认的解释－“大碰撞”\n\n现在大家比较接受的一个观点是，月亮起源于“早期宇宙车碰撞”。这个说法认为，在很早很早的之前，那时候地球刚出现没多久，月亮还没有出现。地球围绕太阳公转的轨道上，还有另外一颗行星，这颗星球也已经不在外了，很星光。天文学家还是给它起了个名字，叫“忒伊亚”，为什么叫“忒伊亚”呢？因为希腊神海中月亮女神的“妈妈”就叫“忒伊亚”，这个叫“忒伊亚”的星球很大，比月亮大得多，但是却比地球小很多，大概只有地球的一半身，体量也只有地球的40分之一。\n\
    \n本来，两颗星球都好好地绕着太阳转，可两转着，两颗星球就靠得越来越近，直到最后的一声一响，撞到了一起，这可不是个事儿了，“忒伊亚”撞地球，产生了一大团岩浆，被抛到太空中，形成了很多，产生的巨大热能使许多多岩浆被影响，“忒伊亚”的一部分碰撞造成了月球，而且部分则飞了出去，并且逐渐形成了月亮。\n\
    \n这个“早期宇宙车”的说法背后，是经过了复杂数学计算的。而且计算的结果能跟地球和月亮之间运转关系的一些细节对应上，包括我们最开始的问号，地球为什么能带动这么大的月亮？在“早期宇宙车”的研究中，也找到了一套可以解释这个现象的数学算法。\n\
    \n其实，“宇宙车”这个说法也有漏洞。不过，其他的说法比起来，它的漏洞要少一些，所以，现在天文学家们对月亮起源的看法，基本上就是这个样子。\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_109_3.png)\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_109_4.png)\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_110_0.png)\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_110_1.png)\n\n### 博物学家养成记\n\n今天是农历的七月十五，是月圆的日子。和爸爸妈妈一起走到室外，抬头看一看这颗太阳系里独一无二的大个子卫星吧。\n\
    \n- 1. 太阳系里最大的行星是木星，木星的体积是地球的1300多倍。\n- 2. 关于月球的起源有很多种说法，有人认为月球是被地球甩出去的，甩掉的部分变成了太平洋；还有人认为月球是被地球半路拦截的。\n\
    - 3. 现在大部分天文学家相信，月球是地球和另一颗行星激烈碰撞的结果。\n\n> **宇宙·环绕 | 失重就是没有重力吗？**\n\n**月球起源**：目前居于主导地位的是巨大撞击假说——月球是地球和另一颗行星激烈碰撞的结果。然而，这一问题仍在继续研究中，还可能发生变化。\n\
