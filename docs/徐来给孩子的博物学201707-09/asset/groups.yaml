    \n## 数字编号与神话故事\n\n在西方的星空系统里，一般是按照字母表来给新发现的星星命名，但字母的数量也是有限的。但随着观测手段的不断发展，天文学家能看到的星星越来越多，而且是成千上万地发现。没\
    \ 法子，字母表都不够用了。怎么办？干脆，直接 上编号，数字嘛，想编多少编多少。而且不同的机构都可能给一颗星星编号，不同的观测者、不同的观测结果上编 订 号，同一\
    \ 颗星星，在不同的 表上，编号也会不同。所以，同一 颗星星，也会有很多名字，比如著名的织女星，因为它的 位置在天津四 等座，所以 在传统的西方星座里叫天津四，也有\
    \ 人叫它3，但是在不同的 表 当中它又 可以被称为：TYC 3105-2070-1，或者 HIP 01262，或者 SAO 67174，又 是HD 172167。\n\
    \n尤其是后面的 一些数字名称，即使对天文学家来说，如果 不是专门研究星 表的人，也会对 这些名字很陌生。\n\n对这些星星来说，除了那些 很早就被人类观察到的，其他很多行星是不会被授予名字的，它们只能拥有一个或者几个数字代\
    \ 号。但对太阳系内的 星星来说，就“幸运”多了，它们可以被授予名字。\n\n一说到太阳系内的行星，你肯定首先想到 名 为太阳的恒星。太阳，从分类来说，太阳系统其他所有东西加\
    \ 起来，都不到 太阳的 一个 零头。但是，太阳的行星也很大，其中的大部分行星，入夜以后能用肉眼观察到。\n\n这些恒星、行星、卫星，就算数来说，在太阳系里依然是\
    \ 少数派，太阳系里 占大头的，是一类叫 小行星 的天体。这些小行星不 太容易 被观察到，最早的时候，小行星是用神话里的人物来命名的，一开始希腊神话，后来希腊神话\
    \ 不够用了，就扩大到其他文明的 神话。但是，小行星的数量实在是太大了，于是，天文学家（IAU）专门 命名 小行星的名字。\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_144_1.png)\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_144_2.png)\n\n## 小行星的命名规则\n\n这样 一来，如果有人发现了一\
    \ 颗小行星，首先要追踪这颗小 行星 的运行轨迹，确认自己发现的小行星是前人没有发现的。确认了 这一点，并且得到国际天文界的认可之后，他就有权为这颗小行星命名\
    \ 了。这个命名，必须在10年内完成。\n\n他首先要拟定一个 名字，然后 写报告给小行星命名 的专门委员会，解释 自己为什么要给这颗小行星 这样的名字，\
    \ 如果 他提供 的 理由是 合乎常理的， 命名委员会 的成员就会 集体投票。 如果所有的 委员 都 投 了赞成 票， 那么 这个 名字就 是通 过 了。委员会每个月都会向天文学者们\
    \ 通报当月新命名的小行星。这些名字 也会被天文学界接受 到 使用。任何人都可以 通过 这个 名字查询到它 所 代表 的 那颗星 星。\n\n当然，不是所有的\
    \ 名字 都会 被 接受，比如有 些 名字 被认为是跟 商业 的关 系 太 密切，就会被 拒绝，据说， 有人曾 想过 命名一颗“比尔·盖茨星”， 就 没 有\
    \ 成功。\n\n我 14岁 的 一天 就 发 现， 想 给 自 己 发 现 的 小行星命 名 为“八零后 星”，但 是 由 于 外国专家 们 无法 理 解“八\
    \ 零 后”到 底 是 啥 意思，所 以 他 反 复 提 示 了几次，都 没 能通过。\n\n现在，已经有 接近 30万 颗小行 星 被赋予 了 永 久 名\
    \ 字，但 幸 运 的 是， 只有 一 万 大 千 多颗……看来给小 行星 起 名 字 这 件 事 情，还 真的是 任重而 道远。\n\n## 彗星命名最容易\n\
    \n太阳系 里除了 恒星、行星、卫星和 小行星 之外， 还有一类天体，它们也可以被授 予名字，那就是彗星。彗星的名字，也是由那个 专门 为 行星 命名 的委员会\
    \ 来 确认的。\n\n不过，给彗星 起 名 要比给小行星起名字 容 易得 多。因 为在 太阳 系 内，彗星 的 数量 相对 比 少，自 然，人类 只 确认\
    \ 了 一 千多颗 彗星，所以，这些彗星基 本上 都是 由 发 现者 的 名 字 或者 他们 的 名 字 来 命 名的，对 命 名 委员 会 来说，基 本\
    \ 上 只 需要 确 认 一下 就可 以 了。\n\n## 博物学家养成记\n\n如果你 想给一颗 恒星起 自己 喜欢 的 名字，最好的 办 法，就是 成为\
