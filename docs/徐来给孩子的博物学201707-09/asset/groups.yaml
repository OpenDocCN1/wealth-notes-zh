    ## 岩矿·地球｜红宝石不是红色的宝石吗？


    世界好大、奇妙的事情每天都有，我们一起去发现吧！


    不知道你对宝石是不是有点疑惑。宝石，通常是指一物非常美、美丽的矿物质，这些矿物，乍一看起来非常普通的石头，但是经过打磨抛光，就会露出它们华丽闪耀的一面。有些宝石是透明的，有些是不透明的。它们在自然中有非常鲜艳的颜色，在这些宝石里，颜色最鲜艳、又最大家喜爱的一色，就是红宝石。


    在所有红宝石中，最有名的一颗，就是大名鼎鼎的“黑王子红宝石”。这个黑王子可是一个普通的名符实这个名的人物。黑王子是一个名符实的人物。黑王子子爱德华，黑王子爱德华是英国历史上最有名的一位王子。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_65_0.png)


    ### 黑王子和宝石


    黑王子之所以那么有名，不是因为他长得帅，也不是因为他权力大，而是因为会打仗。当时，英国和法国这两个国家正在打仗，你知道就知道了，黑王子和他的军队，从法国一直打到英国内部，然后英国又反攻到了法国。英国有很多有兵的统帅，最厉害的就是黑王子爱德华了，他可以在法国大地上横冲直撞，全欧洲人都知道黑王子的大名了。


    黑王子这么厉害，难免会被其他的国王欣赏，所以，就有另一个国家的国王想和他结亲。这个国家就是西班牙国王，西班牙就在法国的隔壁，但这是我们现在知道的西班牙，不是一回儿儿，在那个时候，西班牙被分成了好几个小国，我说的，是其中有一个王国叫卡斯蒂利亚，国王叫做佩德罗。这个佩德罗，有点小野心，很想把周围的几个小国都打服，然后把他并到西班牙就成一个大帝国了。他出发出兵，有一次，把旁边一个小小的国家给消灭了，就那个国王手中抢到一块巨大的红宝石。


    可是，好景不长，没过多久，佩德罗自己的卡斯蒂利亚就乱了，有人起兵造他的反，造反的人，就有另一个国家的国王想伺机夺位。这下，佩德罗就自身难保了，赶紧想办法，怎么样能打败那些造反的，保住自己的王位。他一愁就想到了正在讨英国的英国统帅黑王子爱德华了。他赶紧派使者，去找爱德华，给他信，他说道爱德华，只要你帮我多少钱，我送多少礼物，这其中就包含那颗很大很大的红宝石。


    果然，黑王子一出手，马上起就了结果。在英国军队的帮助下，佩德罗取得了胜利。而黑王子则得到了那颗红宝石，黑王子红宝石因此得名。


    ### 黑王子红宝石救了亨利五世？


    后来，这颗红宝石一直保存在英国国王的手中。每个英国国王都非常喜欢这块宝石。又过了几百年，当年的英国国王亨利五世甚至把它镶嵌在了自己的头盔上。


    这个亨利五世也是一个非常了不起的人物。黑王子爱德华厉害不当常：亨利五世比他还厉害。这位国王不当常学习的时候，很是顽劣无德，总是和一帮地位低下的人混在一起。他心父亲亨利四世一直对此发愁，担心他没有王子的样子，造反没有能力等等。但谁都没想到，这位亨利五世玩玩玩玩，带兵打仗也是这点都不含糊，还没有上国军队，就带将军打平了北方叛军法兰西。当上国王后，更是直接带兵出征法国，取得了一系列的胜利。他甚至被认为英国历史上，军事能力最强的一位国王，著名的大文豪莎士比亚，还专门为他写了一部很有名话剧。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_65_1.png)


    亨利五世到达军事成就的巅峰时，是因为打了一场著名的阿金寨的战役，这场战役发生在英国北部一个叫阿金库尔的地方，大家都听说过这场阿金库尔之战，当时，亨利五世统率英国军队，进犯法国，不过，很快就来到了德意，为英只好调头返回，准备去先进的英国，准备再打过来，不过，退到阿金库尔这个地方的时候，被法国的当时赶上了，这有两个点不好打的，因为当时赶上了亨利五世身边的只有几百个弓箭手。


    就在那场战役中，黑王子红宝石又发挥了巨大的作用。在战场上，亨利五世带兵指挥，带兵士兵混乱，有弓箭手正在上打，带着长矛冲上去，有个著名的故事说，这一带正好射中了亨利五世头盔上的蓝宝石红宝石，然而一颗一都没有松动，蓝宝石红宝石救了亨利五世一命，不管怎样就是假，亨利五世确实活了下来，还在敌军身边奋命，最后他几乎几百弓箭手却打败了4万人的军队，以损失400人的代价，消灭了近12000名法军。赢得了欧洲历史上最著名的一次以少胜多的战役。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_65_2.png)


    如今，黑王子红宝石仍然保存在英国国王手中，它被镶嵌在英王戴的一顶王冠中——帝国土冠的中央，虽然它的下面，像座基一样，它下方还有巨大的钻石“库利南二号”，但一场强烈的黑王子红宝石依然是这顶王冠上最显眼的（下图）。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_65_3.png)


    ### 黑王子“红宝石”不是红宝石


    令人尴尬的是，随着人们对宝石的研究越来越多，矿物学家们发现了：黑王子红宝石并不真的是红宝石（下文）。


    来越多，矿物学家们发现了：黑王子红宝石其实并不是一块真正的红宝石。


    我们平时说的红宝石，通常矿物学说的是一种特定的红色的宝石。但矿物学家们却不这样看，因为很多不同种类的矿物都会呈现红色的透明状，所以，他们对红宝石还得更精确的定义。他们认为，红宝石是一种特定的含有铝元素的矿物。是的，就是拿来做饭的那个铝。这种真正的红宝石，因为很容易出现裂隙，所以不可能有块大个。现在已知的最大的高品质红宝石只有23克拉，而黑王子的红宝石比它大了整整7倍。后来，经过鉴定，发现它其实是一块尖晶石。所以，准确来说，黑王子红宝石只是一块红色的宝石，但不是“红宝石”当然，它是世界上最有名的红色的宝石了！


    ### ——博物学家养成记——


    虽然红色的宝石不一定是红宝石，但红宝石基本都是各种红色的。那你能不能猜一猜，红宝石里的东西决定了它的颜色呢？欢迎在留言区分享给我。


    - 1. 不是所有红色的宝石都叫红宝石，红宝石是一种特定的含有铝元素的矿物。

    - 2. 世界上著名的黑王子红宝石，虽然名字叫红宝石，但它其实是一块尖晶石。

    - 3. 现在已知的最大的高品质红宝石只有23克拉。


    化学/科学史｜蓝色到底有多少?


    黑王红宝石：英王爱德华三世之子黑王子从佩德罗手中得到的一块珍贵宝石，所以命名为“黑王子红宝石”。但它不是红宝石，而是一颗红色尖晶石。


