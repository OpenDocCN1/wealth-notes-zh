    # ◆ 博物学家养成记 ◆


    如今，46片爱因斯坦的大脑切片，永久陈列在美国费城的马特博物馆，这是现在唯一—处普通公众能够亲眼看到爱因斯坦大脑的地方。如果有机会的话，你也去看一看吧。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_120_1.png)


    +   1. 人类大脑的脑细胞主要分成神经元和胶质细胞两类；

    2. 神经元细胞是人类感知和思维的基础，胶质细胞则主要起到支撑和连接的作用，也负责一部分生理活动；

