    \n**徐来**\n\n今天，是博物学陪伴你的第 164 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n\n# 问答 | 眼镜蛇的脖子为什么是扁平的？\n\
    \n你好，我是徐来，又到了每周回答大家问题的时候了。这周，我又收到了很多用户提出的问题，有些是针对生活中碰到的一些问题的，有些是针对于生活中一些细节的。看得出来，大家平时在关注生活和思考问题。\n\
    \n我们来看看本期的五个问题吧。\n\n> **我段智博小朋友问一下：眼镜蛇的脖子为什么是扁的呢？**\n\n其实，眼镜蛇的脖子并不是一直都是扁的。眼镜蛇的脖子只有一种情况下，会变成扁平的，那就是它竖起的上半身。你看网上再最近，再最近这眼镜蛇攻击人的时候，就会竖起上半身，警告对方，不要到身边了，再靠近我就要攻击你了。把脖子变扁，也是为了让自己的上半身看起来大一些，体型大一些，也是为了吓唬对方的。还记得上周六讲“竖毛肌”的时候我提到的吗？动物毛发竖起来，看起来大一圈，道理其实是一样的。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_141_0.png)\n\n**为什么人自己就就自己不会觉得痒？**\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_141_1.png)\n\n你提了一个非常非常有意思的问题，有意思到什么程度呢？有意思到科学家都不知道为什么，准确说是，不知道这个效应发生的机制。你在触摸自己的时候，为什么会不觉得痒？这是一个非常经典的神经生物学的区分的。\n\
    \n只要我们移动自己的身体，我们的小脑就会对身体的运动做出精确地预测，然后发出一个信号来削弱脑干——脑干负责管理身体感觉的某个部分对信号，这部分正是处理瘙痒感觉的地方。结果就是我们无法痒自己。这就是这个机制为什么会发生？科学家们始终无法搞清楚。这个效应证明，我们对自己和他人的区别，是存在一种神经生物学上的区分的。\n\
    \n**为什么自己平时所讲的声音和录制下来的声音感觉有一些不一样呢？**\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_141_2.png)\n\
    \n这里面涉及到两个原因。\n\n一方面声音传导的介质不同。我们听自己的声音，有很大一部分是通过骨传导的，而听自己录制下来的声音，是完全通过空气来传导的。介质不同，听到的效果会大不一样。\n\
    \n另一方面，我们平时听自己说话的声音，是和周围的环境混合着环境的混响效果混合在一起的结果，而录音的时候，因为没有录音设备、录音方法等等条件的差异，都会带来一些失真。这也会让我们的声音听起来不太一样。\n\
    \n**我听说，有的山的地底在水里，那么假如算上山的高度，有没有比珠峰更高的山呢？**\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_141_3.png)\n\
    \n我们一般说山的高度，是海拔高度，也就是从海平面到山顶的高度，说“珠峰”是世界上最高的山，有8848米，这个说法是它的海拔高度。\n\n但是，山的高度还有另外一种计算，就是从山的山脚到山顶的高度，按照这个算法来说的话，世界上最高的山是夏威夷的莫阿纳凯火山，它的海拔高度仅有4207米，但是在海面以下还有10203米，把这个算上，是远远超过珠穆朗玛峰的。\n\
    \n所以，你问题里说的“山的地底在水里”，应该就是这个意思吧。\n\n**水在太空中会蒸发吗？如果不会，那为什么不会蒸发，如果会，那它去了哪里？如果水在太空中，那水蒸气去了什么空间？**\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_141_4.png)\n\n好长的一串问题，一个一个来解答。\n\n\
    水在太空中当然会蒸发掉，实际上，如果不在地球上表面有一个厚重的大气层，地球上的水都会全部蒸发，消失在宇宙当中。水蒸发之后，变成了水蒸气。\n\n注意，水蒸气的“气”字没有三点水，它是气态的水。我们说冬天哈气的时候看到的水，水气的“汽”是有三点水的，它是液态的水，是小水滴。\n\
    \n水蒸气是空气的组成部分，在不同的地区和高低，空气中水蒸气的含量会有所不同。在靠近地面的位置上，水蒸气在空气中的平均含量，按照体积算占1.3%左右。\n\n\
    所以我们说太空中没有空气，是因为它本身所涉及的是地球大气层中的混合气体。它主要由氧气，氮气和其他气体组成的，水蒸气是其他气体之一。太空当然也会有这种混合气体，只有数量极其稀少的氢气原子。\n\
    \n如果你往一杯水拿到太空中，只要时间够长，那太空中水蒸气就去了哪里？水蒸气，你也可以说这个很小水分子的太空有空气，但是很难。这些水分子就会在太空中扩散掉，就回到原来状态了。\n\
