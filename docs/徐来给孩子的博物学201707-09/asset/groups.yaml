    王珂


    关于月球的起源还有一种假说，就是同源说。月球起源的同源说坚信月球与地球是姐妹或兄弟关系，月球与地球在太阳系云凝聚过程中同时“出生”，或者说在星云的区域同时形成了地球和月球。主张这一假说的科学家认为，在原始太阳系云内，温度和化学成分分取决于与太阳的距离。太阳系的各个行星是在星云中不同的区域，由不同化学成分分
    星云物质凝聚、吸积而形成的。月球与地球在太阳系云中相距较近，形成过程相似，属于同时形成的“兄弟”。对于地球与月球成分上的差异，他们解释说，形成行星时，开始是凝聚、吸积并形成以铁为主要成分的行星核，金属核进一步增长之后，星云中残留的非金属属物质才凝聚，月球就是地球形成后剩下的残余物质所组成的。同源说力图合理解释地球与月球成分差异和月球
    的核、幔与壳的组成，但其模式与太阳系云的凝聚过程和地月系的运动特征不尽相符。因此，这一假说也不尽人意。


