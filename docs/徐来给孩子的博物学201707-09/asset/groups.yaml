    \n- **徐来**\n    今天，是博物学陪伴你的第 144 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n\n## 宇宙·空间 | 人类最远到过哪儿？\n\
    \n世界好大，奇妙的事情每天都有，我们一起 去发现吧！\n\n你有没有想过，人类到达的最远的地方是哪里呢？之前，我在这个专栏里跟你讲过“复活节岛”的故事，这个地方很容易找到，现在有人类居住的地方，最不容易找到的就是复活节岛，因为这里周围的陆地都很远。\n\
    \n除了复活节岛，南极的酷地也算一个很难到达的地方，但是这里也有人到达过。如果不限于地球的话，人类到达的最远的地方应该是月球，美国人曾经6次成功登月并返回，有12个人在月球上留下过自己的脚印--这是人类靠自己的力量到达的最远的地方。\n\
    \n但如果你想把人造物体也算到进去的话，那么人类已经抵达过一个你遥不可及想象的地方--那就是，太阳系 边缘。代替人类去到那里的，就是“旅行者1号”飞行器。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_107_0.png)\n\n## 在太阳系里“玩弹弓”\n\n“旅行者1号”真是一个很很神气的飞船。另外另一艘叫作“旅行者2号”的飞船后面发射，科学家发射它们的目的，只是为了抓住一次170多年一遇的机会。\n\
    \n这个机会是一种被称为“引力弹弓效应”的东西有关。引力弹弓效应，又叫引力加速。其实，你已经听说过，地球对周围的东 西都会产生很大的力，其他的星球飞行到它周围的东\
    \ 西也会产生这样的引力效应。一般飞船，如果在飞得靠近某个行星的时候，恰好地利用这个效应，就可以改变飞行的方向，超过了。在超过的时候，他伸出 手来，拉了你一把。这个时候，你就会出现\
    \ 一个加速的效果。有时候，你可以利用对方的力把你打 能量来拐弯儿。引力 弹弓的原来跟这个几乎是一 的--唯一的区别是，引力弹弓用的是引力而不是谁伸了手。\n\
    \n引力弹弓的好处是，加速的能量是从行星那里偷来的，所以等于先空赚了能量，好处是，远飞得很快了才能用这个引力弹弓，永远就不能一行了。 如果没要专门消耗能量“飞过去”，那就不划算了。\n\
    \n几乎发射所有远距离的飞船都要用引力弹弓，要根据目的地和发射时候的行星来计 划。过去哪些行星是好算的，哪些是不划算的。但是在70年代的时候，科学家通过认真观察，太阳系的大几大行星排成十字形成一个特殊的排列一-不是按顺序十字形或者一字形，而是说，在这种排列条件下，可以利用大多数恒星，让地球发射的探测器用消耗很多能量，就能路过好几个行星。\
    \ 这不仅节省了探测行星的好机会， 且有几个行星的位置合适，还可以提供加速的能量。\n\n这样一来，科学家在地球上发射的探测器， 用比较少的燃料就可以用尽可能多地去探测那些太阳系里，人类从来没有任何观察到过的行星了。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_107_1.png)\n\n## 后发到 而先至的旅行者\n\n为了赶上那\
    \ 一次170年一遇的好排列，美国航空航天局的科学家们在1977年一这一 年前，他们的爸爸或妈妈都没在出生。就在那一年，他们分别发射了两个几乎完 全一样的旅行者号。8月底发射的是旅行者2号，40年前，也就是1977年的9月\
    \ 5日，发射的是旅行者1号。\n\n咦，你会觉得奇怪吧？为什么说先说2号后说1 号呢？\n\n因为发射顺序就是这样的，“旅行者2号” 要比“旅行者1号”早发射几天。我这么说，你大概就会奇了，难道号\
    \ 表示的不是它们发射的先后顺序吗？\n\n诶，如果你真的这样想，还真就猜错了，序号确实说的不是发射的顺序，而是项目规划的先后。实际上，这两颗探测器，执行的任务略有不同。“旅行者1号”从地球上起飞之后，会利用行星\
    \ 的引力弹弓效应，飞出去， 到达土星，并且对它们进行近距离的观 察，然后，它会飞向土星的大卫星土卫六。 我是在“距离太阳系 最像地球的卫星”专栏里介绍过土卫六，科学家对它充满了好奇，所以仔细对土\
    \ 卫六，再往后，“旅行者1号”就不在 管其他的行星或者卫星了，而是按接着太阳系的边缘，头也不回地一路冲过去。\n\n“旅行者2号”一开始的路线也是差不多\
    \ 的， 会先经过 木星 和土星。不过，它不会去关注土星的卫星，而是朝着天王 星继续 出发， 在对问天王 星之后，再冲向外星系的边 缘，所以，我们现在看到的\
    \ 天王星 和 海王星 的照片，都是“旅行者2号”传回来的。\n\n有意思的是，虽然“旅行者1号”要比“旅行者 2号”晚几天发射，但是因为任务不同， 所以它们的行进速度更加\
    \ “旅行者2号”快 一些。\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_107_2.png)\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_107_3.png)\n\
    \n## 突破太阳系的边界\n\n你刚才 看张君 德描写的 “快一些”，因为 它们飞行的距离 特别特别得远，所以，虽然速度上上 有一点点差别，但是累计起来\
    \ 差别也会大。 当“旅行者2号”抵达 第一个 重要 目标 行星的 时候，“旅行者1号”已经 离开 木星 多年了。\n\n科学家们 通过 发现， 在这 个位置\
    \ 上，出现 了一些 不同 寻常的 现象。 因为 在此 之前， 科学 家们 通过 计算 后 预言， 在 太阳系 的 边 界 上， 某 些 特 殊的 物 质\
    \ 粒 子， 会 这 个 范 围 的 飞 进 来 。 而 现在 “旅 行 者 1 号 ” 上 携 带 的 设 备 显 示 ， 在 这 个 深 空 探 测 到\
    \ 了 这 个 范 围 。 从 这 个 意 思 上 说 ， “旅 行 者 1 号 ” 很 可 能 已 经 飞 出 了 太 阳 系 ， 进 入 了 太 阳 系\
    \ 外 更 为 广 阔 的 宇 宙 空 间 。\n\n当然，也有一些科学家对这个结果产生了怀疑。为了确认这一点，科学家们又经历了一段时间的争吵和数据分析。最后，在2013年，美国航空航天局终于确认，“旅行者1号”已经飞出了太阳系。它不但是飞得最远的人造物体，也是第一个进入太阳系外的人造物体。\n\
    \n接下来，“旅行者1号”上的电池还会维持它工作8年，在这8年里，它会继续把自己看到的东西传输回地球。那么，“旅行者1号”还会碰到什么呢？这个没有人能猜得到。\n\
    \n不过，到了2025年之后，我们就会和它永远地失去联系。它将带着一块金唱片继续前进。\n\n## 博物学家养成记\n\n金唱片里记录了一些图像和声音。其中有55个人用55种不同的语言和方言表达的问候，其中包括“各位都好吧？我们都很想念你们，有空请到这儿来玩。”或者“太空中的朋友，你们好，吃了吗，有空来玩。”此外，还收录了一些地球上的声音，是不是很有意思呢？\n\
    \n我在今天的文章末尾，给你准备了一个彩蛋，是金唱片里的一段声音，快去听一听吧，然后在留言区告诉我，你都听到了什么？\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_108_0.png)\n\
    \n### 卫星-宇宙 | 谁是太阳系里最像地球的行星？\n\n- 1. 旅行者1号是所有人造物物体当中走得最远的一个，科学家们普遍认为，它已经飞出了太阳系，进入了太阳系外的星际空间；\n\
    - 2. 旅行者1号和旅行者2号是美国航空航天局在1977年发射的，当时发射的目的是为了利用行星间特殊的位置关系，更好地使用引力弹弓效应。这样的位置关系每170多年才会出现一次；\n\
    - 3. 旅行者1号上携带了一张金唱片，里面收录了一些来自地球的影像和声音，期待有一天在浩瀚的宇宙里被外星人捕获，实现一次星际交流。\n\n旅行者1号：美国国家航空航天局研制的一艘无人外太阳系空间探测器。它是有史以来距离地球最远的人造飞行器，也是第一个离开太阳系的人造飞行器。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_108_1.png)\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_108_2.png)\n\
