    # 小天体·宇宙 | 小行星会毁灭地球吗？


    世界之大，奇妙的事情每天都有，真是太好发现了啊！


    +   小天体·宇宙 | 小行星会....


    咱们之前讲过很多小行星的事儿。我讲过“哈根达斯”碎片掉落到地球上，烧得“滋滋”响；我讲过哈雷彗星最后一次大爆炸的景象……今天，我还想再讲小行星的事儿，那事儿可精彩了，不过咱们还是得先讲个背景。


    # 12年后撞击地球的小行星


    现在我要跟你说的这颗小行星，名字就有点吓人，叫“毁神星”。这个名字来源于古代北欧神话，一个掌管黑暗和破坏的神。这听起来够“恐怖”了吧？


    科学家也是最近这几年才发现这颗小行星的。那颗小行星是在2004年3月由美国科罗拉多州博尔德的天文台发现这颗小行星的。经过连续观测，科学家们用了两年多的时间计算出了它的运行轨道。


    那么，要怎么算出小行星的轨迹呢？首先你得确定它是小行星，而不是地球。然后，你得计算它的轨道，看它是否有可能与地球相撞。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_61_0.png)


    当天文学家们看到这条运行轨道之后，有些人就开始紧张了，因为这颗小行星的轨道有可能与地球相撞。


    两颗天体的轨道是有交叉的，就有可能会撞到一块儿去。所以，看到这个情况，天文学家们忍不住去推算了一下，这颗小行星和地球到底能相差多远。结果一算，还真不是个好兆头。


    那在2004年的12月28日，这颗小行星被发现在距离地球约3840万公里，比月球还远。美国宇航局的科学家们预测，这颗小行星将在2029年4月13日非常接近地球，但不会相撞。


    # 一场虚惊


    这下子可炸锅了，因为这颗星既不是小行星，也没在月球上，肯定是个大发现。


    不过，你别担心。虽然科学家计算出这颗小行星与地球相撞的概率很高，但概率依然很小。


    既然危险系数这么高，天文学家们就决定要跟踪这颗小行星，看看它到底会不会撞地球。


    听到了，你终于松了一大口气吧。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_61_1.png)


    # 在危险来临之前做准备


    尽管这样，还是有很多科学家在认真思考这个问题：如果小行星真的撞了地球，咱们该怎么办呢？


    大多数应对办法，都跟小行星的撞击有关。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_61_2.png)


    # 博学学家养成记


    你想看看，如果你是科学家，你会有什么办法来应对一颗即将撞击地球的小行星呢？


    +   1. 2004年，人类发现了一颗小行星，并计算出它在2029年抵达地球，这颗行星叫“毁神星”。这个名字来源于古代埃及神话里的死亡之神。

    2. 科学家们经过反复测量认为，人类其实不需要担心小行星撞击地球，因为它与地球相撞的概率很小。

    3. 光速会形成压力。我们平时感觉不到，是因为空气帮我们抵挡了一部分光压。'
