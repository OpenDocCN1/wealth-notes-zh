    # ## 端化学·植物 | 夏天真的会消失吗？


    世界那么大、奇妙的事情每天都有，我们一起去发现吧！


    ![](img/6b15154e19a3f50ea9a116007c7b687c_12_0.png)


    咱们中国，大部分地区都处于温带这个区域，四季非常分明。春夏秋冬，每个季节的界限都很明显，哪怕只是每个月分开，你要是离开了这个区域，情况就会发生明显的变化。比如你往北走，会往东北，从东北、俄罗斯一直到遥远的西伯利亚地区，那么那个地方冬天的温度，都靠近地区冬天的温度就会更低，会冷到结冰，大风就会越来越热。你要是往南边的大陆，乃更南边的东南亚、南亚等地区旅游过，那一定对那边的炎热天气印象太深刻


    我超喜欢京城的这种四季分明的态的，这四个季节当中，也是各有各的妙处。那么，这四个季节当中，你最喜欢哪一个呢？我看，你最喜好的也许也是夏天。很多人都喜欢夏季，夏天可以穿大凉爽的衣服，可以吃好吃的冷饮，也可以多多的来水里的玩耍。对了，夏天还可以玩水、当然，最重要的是，夏天可以吹空调


    可是你想过没有，如果有一天，夏天突然消失了，会是什么样的一个世界呢？你会不会发疯，夏天好的，是会发空调吗？


    # ### 什么是仙女木事件？


