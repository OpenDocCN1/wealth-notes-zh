    设想一下这样的情景：在某个国家里，有一种野生动物，因为各种原因，已经很久没有在该国出现过了。大家突然觉得这是一件非常遗憾的事情，是突然有一天，这种野生动物又重新回到了这个国家，那么人们会是一种怎样的感受呢？是高兴？还是害怕？


    今天我们要说的，就是关于野生动物消失又回来的故事。故事的主人公叫布鲁诺，它是一只棕熊。


    ### 重新回到德国的棕熊


    你能分得清棕熊和黑熊吗？棕熊和黑熊还这两头，它们的大小差不多，可是从毛的颜色和特征上区别一下。前肢长得很尖，黑熊呢，无论是亚洲的黑熊还是美洲的，体形都要小很多。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_148_0.png)


    现在欧洲的中心地带几乎完全看不到棕熊了。它们退到了欧洲的北部和东部。那些地方还保留着比较原始的山脉。勤劳的科学家和动物保护组织做了许多努力，希望让棕熊回归到它们原本分布过的地方。


    他们试图让从欧洲少数还留着棕熊的地方带回来一对棕熊夫妇，把它们带到了意大利。果然，这对棕熊夫妻不负众望，生下了一个孩子。这个孩子是雄性，叫JJ。


    JJ长大后，JJ们就离开了，去冒险了，JJ开始它自己的事业。它首先往北，来到了奥地利。在这里，它娶了一个叫鲁贝塔的，并且生下一个可爱的女宝宝。


    随后，布鲁诺又往西走，进入了德国。在那里，布鲁诺受到了前所未有的欢迎，德国人简直觉得布鲁诺就是天选之熊，因为从1835年-迄今，德国就没有出现过棕熊，整整170年，德国人不能高兴吗？不仅如此，你看，熊是食肉动物，是要捕食那些小型动物……


    反正，布鲁诺的到来轰动了整个德国，所有人都把它的故事放在报纸上报道，有人给它们画了画，有人为它建了网站，收集了关于它的各种信息，同时，还有很多人以它的形象为基础制作了许多玩具，大小孩子们都很喜欢。


    ### “熊孩子”到处惹事儿


    就在这个时候，有些动物学家，出来给凉快了一下，说大家别高兴了，这个棕熊看着很有礼貌，但实际上是有很脾气的，确实棕熊长得很憨的样子上，风头又很猛，大家都喜欢，可是大家因为不太能见到它，大家都有新鲜感，要是你整天对着他，肯定会觉得无趣的。


    动物学家的警告，话音还没有落呢，布鲁诺就开始拉事儿了。首先，它正四处闲逛找东西吃，但它所在的达特洛区域，可是欧洲人口密度最大的地区之一，一旦出山林就是牧场或者村庄，可能因为太好吃了吧，布鲁诺实在不听话，虽然没去牧场，但它没有意识到那里是别人家，就跑到一户人家的院子里去了。


    ## 医学|人类|黑色水泵的秘密


    世界大好，奇妙的事情每天都有，我们一起去发现吧！


    在很多城市里，特别是有那些历史悠久的名城，大街小巷上都耸立着形态各异的名人雕像、纪念碑等建筑，来纪念那些发生在该地的一些伟大事情。


    这个纪念碑，它是1859年，伦敦的一个医生，叫约翰·斯诺（John Snow）发现的。


    当时，伦敦的霍乱非常严重。霍乱是一种肠道疾病，通过饮水传播。


    约翰·斯诺当时怀疑霍乱是通过水源传播的。


    他收集了大量数据，绘制了一张霍乱死亡率的地图。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_149_0.png)


    约翰·斯诺指出，霍乱的传染源是水泵。


    他建议政府拆除水泵，并改善供水系统。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_149_1.png)


    他不仅是一个医生，还是一个优秀的科学家。


    约翰·斯诺是流行病学之父。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_149_2.png)


    约翰·斯诺的研究为现代流行病学奠定了基础。


    他的贡献改变了公共卫生观念。


    的过程，再离开人体，污染水源，好等着被另一个人喝进肚子里去，感染更多的病人。在自然环境中，看起来很干净的水，一样会受到这些病原体的污染，就好像当年伦敦市民喝下宽街水泵里的水一样。


    ### 博物学家养成记


    饮水安全是非常重要的事情。即便在城市当中，也不应该直接喝生水，而是要喝经过过滤的纯净水，或者烧开过的水。


    ### 推荐阅读，一键回看：


    - 医学·动物 | “法庭审判”与“恐怖瘟疫”有什么关系？

    - 生理学·植物 | 柠檬如何打败世界上最强的舰队？


    - 安全饮水是一件非常重要的事情。如果喝没有烧开过的水，或者未经充分过滤的水，就有可能被水中看不见的微生物感染而得病；

    - 1854年伦敦爆发了奇怪的瘟疫，病原就是霍乱孤菌，也就是我们常说的霍乱。霍乱的传播受污染的水源有关；

    - 约翰·斯诺医生统计病例人数，绘制了一张瘟疫发病地图。通过地图他发现，瘟疫有规律可循，病患都和当地的水泵有关；

    - 斯诺医生关闭了水泵，结果瘟疫就逐渐消失了，事后他们发现，水泵之下的水源受到了污染；

    - 伦敦苏荷区的宽齿街和列克星敦街的交界处的黑色水泵，成为这次事件的一个特殊纪念碑。2016年的时候，这个水泵已经被拆除。


    > 伦敦瘟疫：1854年伦敦爆发了奇怪的瘟疫，约翰·斯诺医生统计病例人数，绘制了一张瘟疫发病地图。通过地图他发现，病源来自一个被污染的水井。


