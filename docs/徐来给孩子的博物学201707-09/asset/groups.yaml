    接下来，科学家又去检查了潮间带上浣熊的食物的情况。结果，他们惊讶地发现，只用了一个月的时间，这里的生物得到了极大的恢复。有些原本已经被浣熊吃得几乎要绝迹的螃蟹，只用了1个月，就又出现了大量（大量出现）。


    但是，我不知道你注意到没有。这里的浣熊已经有上百年没有听过狗叫了。别说是这些浣熊，就是它们的多爷（爷爷的爷爷/祖先），乃至它们爷爷的爷爷，都没有听过狗叫。那它们是怎么知道狗叫意味着着（意味着）危险呢？


    这实际上跟演化环境有关。每一种动物都是经历了漫长的演化，才变成现在模样的。在漫长的演化过程中，所有危险的样子乃至危险的信号，都在我们身上留下了记号。比如说，危险很快就留下来我们的（让我们记住），让我们记住它的形状或者声音，慢慢地记住危险信号就会留在我们的记忆力（记忆）中。所以，我们的祖先呢，就有一些容易危险（对危险敏感/容易对危险产生反应），他们因为害怕某样（某种东西）而放弃一些机会或者死活（生死关头），但他们对危险处（危险处境）没有恐惧（有恐惧），那么我们伤害到（被危险伤害到）它们的几率就会大大降低，那么他们生存下来的几率就会变大。时间长了，我们自然容易出现这样的本能了。


