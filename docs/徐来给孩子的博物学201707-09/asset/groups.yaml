    ## 其他天体·宇宙｜神秘：外星人的“哇！”信号


    世界之大，奇妙的事情每天都发生

    我们一起发现吧！


    你一定能听到更多关于外星人的说法，也一定在很多文艺作品里看过地外生态人的身影。不管大家有没有幻想过，在想象中外星人一定是友善的。


    你听说了有关宇宙飞船的事情没有，也许你觉得那只是小孩子的幻觉，可你仔细听，那是真的！


    ### 什么“哇”信号？


    这个“哇”信号，是1977年8月15日，由美国俄亥俄州立大学的大耳朵射电望远镜探测到的。它的频率很特别，是1420兆赫，正好在宇宙里氢原子能吸收和发出的频率上。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_75_0.png)


    信号持续了72秒，强度比周围背景强很多。天文学家们立即对这种“哇！”信号进行了分析。


    后来，杰瑞·庞斯（Jerry Pons）研究了这份数据，并且指出这些信号很可能来自宇宙深处的某个恒星系统。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_75_1.png)


    ### “哇！”信号到底说了啥？


    其实，科学家对这份数据的解读非常有限。它被推测可能是某种数学编码，或者是自然天体的物理现象，至今并没有确切的答案。


    虽然这份信号没有明确指向地球，但它的确让科学家认识到，宇宙中可能存在其他文明或自然智慧现象。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_75_2.png)


    ### 无法解读的信号


    信号在持续72秒之后就不再出现。虽然科学家多次尝试重新检测，但都没有结果，成了无法破解的神秘信号。


    至今，“哇！”信号究竟是外星人的信息，还是宇宙天然的电磁现象，仍是个谜。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_75_3.png)


    ![](img/6b15154e19a3f50ea9a116007c7b687c_76_0.png)


    ### —▶ 博物学家养成记 ◀—


    今天正好是发现“哇！信号”的四十周年，如果现在由你来给外星人设计一段信息，那么你会在信息里放上哪些东西呢？在留言区跟大家分享你的想法吧！


    - 1. “哇！信号”（wow! signal）可能是人类已知的，与外星人关系最密切的东西；

    - 2. “哇！信号”是美国俄亥俄州立大学的一台射电望远镜接收到的。当时发现信号的工作人员很兴奋，在记录信号的纸上写下了一个“哇！”字，这个信号因此得名；

    - 3. 科学家们并没有从“哇！信号”中读取到有用的信息，但通过排除法，以及综合考虑它被捕捉时的情况，很多人坚信，它有极大可能是外星人发来的。


