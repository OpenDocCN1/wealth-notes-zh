    - 1. 坏血病会导致患者的免疫系统衰退。

    - 2. 免疫系统是人类对付外来病菌入侵的主要力量。

    - 3. 维生素C可以增强免疫力，柑橘类的水果，尤其是柠檬里都富含维生索C；

    - 4. 维生素C对热很敏感，加热会破坏它的结构，失去它的价值；


