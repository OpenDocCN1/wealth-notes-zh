    \n但是我可以告诉你，很多年以后，圣捷尔吉会为了这个判断懊恼不已。\n\n# 宇宙学·恒星｜谁给星星起的名字？\n\n世界好大，奇妙的事情每天都有，我们一起去发现吧！\n\
