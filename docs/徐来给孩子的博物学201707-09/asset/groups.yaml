    世界好大，奇妙的事情每天都 有，我们一起 去发现吧！


    宇宙 环绕 | 太阳系外有智慧...


    # 徐来


    我们生活的地方，被叫做地球。你应该 已经读过地球仪看过地球的样 子了吧，它的上面，有陆地，有海洋。地球北部 是被 地区包间着 一片大海，南部则是被大海 包围着的一片陆地。


    跟地球在一起的，还有月亮。地球 和月亮一起构成了一个单元，叫 做月系。地月系 绕着太阳转，太阳很 大很大，一个 太阳系 就要大 了。不过，太阳系外面 还有更
    大的东西，那就叫银河系，太阳系 是很银河系中 的一小部分。银河系真的 大到无法想象，其中像太阳这样 的恒星有 许多许多颗，如果你每秒数 1颗恒星，想 把银河系中
    的恒星全部数完 也要花上好几年的 时间。


    但 还没有完，银河系 外面还有 更大的 东西，里面有无数 个银河系，要想 把这些 银河系数 完，那 个恒星 同样要花上好几 年。


    现在问题 来了，如果 每一颗 恒星都 挂着几颗像 地球一 样的 行星，宇宙中 有 多少 像地球这样 的 行星呢？这些 星球上 面，会不会有 外星人呢？


    ![](img/6b15154e19a3f50ea9a116007c7b687c_103_0.png)


    # 开普勒做了什么重要工作？


    要 回答这个问题，就要 从 头说起 了。


    很早以前，人们认为，地球 是 宇宙的 中心，也就是所谓的“地心说”。这个 其实 是很好 理解的，因为 大家站在地球上，看 到的是 太阳东升西落，天上的 星星
    绕着 地球不 断地转 啊转的，因此 理所当然 地认为，地球 是一切的中心。


    后来，有些 科学家 慢慢意识到情况 没 有这么 简单，地球 好像并不是 宇宙的 中心，太阳 也不是绕着 地球转 的，反而是 地球在 绕着 太阳转。所 以，从地球
    中心 到“地心说”，再到以 太阳为中心 的“日心说”，成 为人类对 宇宙认 识的一个 重要的转 折点。你 或许 听说过一个 名字 叫哥白尼。哥白 尼 是一位波兰
    天文学 家，也被认 为是 主张“日心 说”的一个 关键 人物。


    不过，虽然哥白尼 提出了“日心说”，但他 并没有搞清楚 几个 关键 问题，所 以，他的 理论 还没 有太 大的 说服力。后来， 另外 有一位很厉害 的天文
    学家，叫开普勒， 他的 数学 特别好，想 办法把哥白尼 遗漏 的 几个 问 题补上了。通过他 的努 力，人类 终于 接 受了，地球 是 围绕 太阳转的 一颗
    行 星。


    更重要的 是， 他 利用 此前 天文 学家 留下 的众多 观测 数据，解 决了 非常 重要的 问 题，那就是， 行星 到底是 怎么 在 轨道上 运动 的？后来的
    天文 学家 们称 作 的这 些 重要 发现 为“开普勒 定律”， 后来 开普勒 还在行 星 研 究 方面 的 突出 贡献，所 以 科学家们 还用 他 的 名字
    来称呼 一 个 望远 镜。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_103_1.png)


    # 开普勒望远镜


    望远 镜？望远 镜 有什 么 了不起 的，为什 么 要用天文 学家 的名 字来称呼 一台 望远 镜 呢？因为 那是 那台 望远 镜 太 牛 了， 它 的 工作
    在 太空 中， 它 没有 办法 拿 在手 里，也没 办法 架 在 阳台 上， 甚至 很 多 望远 镜 放 在 地 面 上用 的。 它 是一 台 太空 望远
    镜 就 是一 地 就 面。 它 就是 人造 卫星 或者 宇 宙 空间站 一 样， 是 沿 着 轨 道绕 地球不 停 地 飞 的。


    这台 望远 镜 是美国 的 航空 航天 局 在 2009 年 发射 的，它 当 今 的。它 很 大， 大概 有一 吨 重。 有 意思 的是， 跟 人 类发
    射的 很 多 天 空 不一 样， 开普 勒 望远 镜 并 不是 绕 地球 转 的， 而是 绕 着 太阳 转， 准确 地 说， 开 普勒 绕着 太 阳 公 转
    的 轨道， 就是 地球 的 轨道， 而 且，它 也用 要 不多 于 一 年的 时间， 才 能 绕 太阳 一 圈。 只不 过， 它 跟 地球 保 着 一定的
    距离。


    开 普勒 望远 镜 不 但 运行的 方式 很特 殊，它 的工 作也 很特 殊。它 是为 了 寻找 行 星 而 发 射 的——正 因 如此 为什 么 要 用
    开 普勒 的 名 字 来给 它 命名。


    行 星 和 恒 星 不一 样， 它 们不 会发 光， 那 么 开 普勒 望远 镜 如 何 巡 逻 的 行 星呢？ 虽 然 行 星 不 发 光，但 是 它 们
    环绕 恒星 而 发 光。 而且， 行 星 在 运 行的 时候， 常常 会 转 到 它的 恒星 和地球 之 间。 这样 一 来， 那 颗 恒 星的 光会 被地球
    微 微弱 遮挡一 下， 开 普勒 望远 镜的 工作， 就 是 寻找 太 阳 中 过 去 被 遮 的 恒星。 然后， 通过 两次 遮 挡 的 时间 间隔， 来
    计算 到 遮 挡 的 那颗 行 星 到底有 多 大， 是 怎么 运行 的。


    通过 这 个 方法， 科学 家 希 望 能 够 找 到 太阳系 之外 的 地球， 在 那样 的 星球 上 面， 很 有 可能 就 居住 着 和我们 类似 的
    智 慧生物。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_103_2.png)


    # 太阳系之外的 地球存在吗？


    好 了， 终 于 说到 我最关心 的问 题 了： 宇 宙 中 真的 存在 外星人 吗？


    关于 这 个 问 题， 答 案是 肯 定的， 宇 宙 实在 是 太 大 了，什 么 样的 可能 性 都 可能 发生， 所 以 在 外 星 人的 情 况 是非
    常 非 常 大 的。 实际上， 开 普勒 望远 镜 的 工作 之一， 就是 寻找 那些 可能 存在 着 生命 的 行 星。


    科 学家 就 是 按照 地球 的 样 子 去 找的： 那 样 是离 太阳 的 恒星 不能太 近， 太 近 了 的 话， 行 星表面 会 变得 非 常 非 常
    热， 水 分 都 会 发 蒸发， 生 物质在 液态 的 行 星 表面 存 在， 也 有 可能 太 远 也 会 变得 非常 非常 冷， 水 都冻成 了 冰，
    没 办 法 成 为 生命 的 依 靠。 既 不 冷也不 热 的 区域， 科 学家 给 它叫“宜居 带”， 就是 适 合 生 物 居住 的 地区。 虽然 理论上
    来 说， 任何 位置 都 可能 出 现 生 命， 但 科 学家 们 相信， 宜居 带 出现 生命 的 可能 性 更高 一些。


    经过 几年 的努 力， 开 普勒 望远 镜 已经 找 到 了 非 常多 的 宜居 带 行 星。 接下 来，它一 定 会 继续 发现 许多 类似 的行 星。


    那 么， 从 前 目 今 人 类 的 能 力 来 看， 这 样的 想法 根 本 就是 多余的。 因 为 宇宙 实 在 是 太 大了， 虽 然 我 们能 够
    看到 无 数 的 行 星 但是 无法 真 的 看到 它们， 但 是 开 普勒 望远 镜 能够 看到 它 们 和 那些 行 星 之 间的 路程。 实际 上，
    以 人 类 目 前 制造 的 飞 得 最 快 的 飞 船， 想 去到 最近 的 行 星， 可能 也要 花 上 几 万、 甚至 十几 万 年！


