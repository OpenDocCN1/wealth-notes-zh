    ## 浣熊破坏了生态平衡


    今天要说的这一群浣熊，不是在美国的，而是生活在加拿大，也不是生活在大陆上，而是生活在海岛中。这是在北美的西海岸，在美国和加拿大两个岛之间，有一个属于加拿大的群岛，叫温哥华群岛（OCR“加拿大群岛”可能指温哥华群岛，暂保留“加拿大群岛”或修正为“温哥华群岛”，此处保留“加拿大群岛”以保守）。这个海岛群岛，每个岛同岛同之间的距离不远，所以，大海阻挡了各个岛上的动物相互干扰，起到了一定的隔离作用。在其中的一个岛上，生活着很多海鸟。这些海鸟岛上的这些岛上，大海在中间相隔，岛同鸟群是无忧无虑的。为什么？因为，浣熊本身是捕食者，它们食物当中有一小部分是捕捉到的。但是它们身形比较小，大鸟在岛上，它们自己会成为比较大的动物，比如浣熊，海豹、企鹅、美洲狮等，甚至是猎物，本质，这些岛上原本狼、熊这些小型猎食者。不过，在百多（百多年前），一些人类的大规模繁衍行为（猎杀行为），已经把许多岛上的大型食肉动物都给杀死了。山中无老虎，这些浣熊自然就成了大王来啦。


