    ## 被写在基因里的恐惧


    因为天敌叫声的存在，浣熊竟然吓得连找东西吃的都不敢了。要知道，在这个过程中，并没有任何一只浣熊真的看到狗的长声（真身/身影）。它们只是听到了科学家播放的狗叫声而已。


