    面条经过油炸，脂肪含量非常高。所以，即使你觉得方便面非常好吃，也不能多吃。


    # —◆ 博物学家养成记 ◆—


    现在的方便面包装上都印着营养成分表，它可以让你知道，这些事物为你提供了多少营养，找一包方便面，翻到包装背面的营养成分表看一看吧，看看一包方便面，究竟为我们提供了哪些营养呢？记得在留言区分享给我。


    +   1. 面条在汉朝的时候出现，到了唐宋时期，已经非常流行。


    +   2. 发明方便面的人是日本的安藤百福，他是通过油炸让面饼脱水，通过高温熬制，让汤汁浓缩的方法制作出来的。


    +   3. 我们一直认为方便面含有大量防腐剂。实际情况是，方便面的含水量很低或者含盐量高，所以，无论是面身还是汤料，本身都不需要额外添加防腐剂。


    问答丨用发霉的馒头做酱，健康吗？


    方便面：为了避免吃面排长队的状况，日本的安藤百福，通过油炸让面饼脱水，通过高温熬制，让汤汁浓缩的方法制作出了方便面。


