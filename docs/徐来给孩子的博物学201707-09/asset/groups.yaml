    天天洗会伤害到皮肤吗？


    ![](img/6b15154e19a3f50ea9a116007c7b687c_69_2.png)


    徐来


    我觉得这个问题听起来有点像是“天天吃面包会发胖吗”，吃面包会不会发胖的关键并不在于吃没吃，而在于怎么吃。洗脸也一样。咱们洗澡的主要目的是洗掉身上的灰尘，还有皮肤自身分泌的油脂。清洁不彻底的话，身上容易油腻腻的，甚至长菌。但是，如果清洁过度，皮肤就容易干燥、紧绷、发痒，甚至患上湿疹、皮炎等疾病。


    洗的时候，发挥主要清洁作用的是香皂、沐浴露里的去污成分，也就是表面活性剂。水流冲淡和摩擦的作用则会小一些。而强烈的清洁成分、热水、揉搓时间过长或者洗得太频繁任何一个因素都可能导致皮肤表面的油脂被清洗得太多，也就是清洁过度。长期如此皮肤就会“受伤”。


    如果你喜欢天天洗脸的话，我给你四点建议：


    - 第一，要用温和的沐浴产品，或者不要每次洗澡都用沐浴产品；

    - 第二，要用温水洗澡，而不是热水；

    - 第三，洗澡尽量选择淋浴，而且时间不能太长；

    - 第四，尽量少揉搓。洗完之后要涂上润体乳，给皮肤保湿。


    海水是越来越咸，还是越来越淡？


    ![](img/6b15154e19a3f50ea9a116007c7b687c_69_3.png)


    徐来


    这个问题有点儿意思，但是，答案可能会让你失望。海水的咸淡啊，实际上主要是由海水里含钠盐、钾盐这些盐的浓度决定的。我们可以把它的大致变化等同于海平面。其实，即使在同一个时间里，不同的海域盐度也是不一样的，整体上处于动态变化中。这里面牵扯到很多因素，比如洋流的变化、降水和蒸腾的变化等等，我就不展开了。


    而在历史上，海水有时候会变咸，有时候又会变淡，也受到很多因素的影响。所以，很难一概而论。但是，如果你单独就目前海水的情况，那么考虑到海水升温以及海平面的变化，平均而言，海水正在变淡。


    为什么手指甲长得比脚指甲快的？


    ![](img/6b15154e19a3f50ea9a116007c7b687c_69_4.png)


    徐来


    回答这个问题之前，得先跟你道个歉。为什么呢？因为刚看到这个问题时，我的第一反应是，你们不可能有个假设题，因为我认为，人们之所以感觉手指甲长得比脚指甲快，只是一种错觉，因为我们更容易观察手指的变化，所以，更容易发现手指甲的变化。


    但是，带着这个问题查了一下相关论文后，才发现这个问题其实是挺有意思的。在一项日本人的研究表明，指甲在2.46毫米和6个月了。平均而言，手指甲更多是每个月长3.47毫米，而脚指甲只有1.62毫米。


    好，接下来的问题是，为什么会有这种差别呢？答案很简单，科学家也未知。虽然科学家已经找到了一些理论支持，比如，因为手指使用的比较频繁，手部的磨损速度比较快，所以手指甲要长得快一点，不用频繁去修剪。这个理论看似可信，但是没找到确切的证据。所以，到目前为止，科学家还没有明白，为什么手指甲长得比脚趾甲快。这个问题还要继续探究。


    不过，这个问题也提醒朋友们一点，就是遇到任何问题，都不要想当然，先去查证。


    如果一个人用时光机回到在仇人刚出生的时候，杀掉这个仇人，那他还会不会让这个仇人来杀死他？为什么要回到过去杀这个仇人呢？这就成了一个悖论。


    首先说明一下，现在的物理学并没有找到可以成立的时间旅行机制。也就是说，现阶段看来，时间旅行是不可行的。


    这个问题的答案很简单，你所说的“确实又存在”是不成立的，这个悖论很可能并不存在。大部分科学家在讨论这类问题时，都倾向于用某种方法来避免这个悖论的出现。比如依据平行宇宙理论，人去到未来时，实际上进入的是一个平行宇宙，他只能对这个平行宇宙中发生的事进行改变，但不会对原来那个宇宙产生任何影响；或者根据“诺维科夫自洽性原则”，你可以回到过去，但是你不能改变历史。也就是说，我们的世界是已经被确定过的最终结局。


    当然，霍金也提出过一个理论：他认为根本不存在宏观尺度上的时间旅行。


    所以，你提出的困惑，可能根本就是一种假想，是不会发生的。


