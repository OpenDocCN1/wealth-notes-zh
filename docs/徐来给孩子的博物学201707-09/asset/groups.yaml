    \n今天是博物学院找我的第121天\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_62_0.png)\n\n人人都该听的自然科学课\n\
    \n这实际上是两个问题，首先要说明的是，为什么用数码产品在光线不足的情况下拍摄，会出现很多噪点。\n\n无论是数码相机还是手机，都是通过图像传感器来捕捉图像的黑暗环境下，传感器所接收到的光信号弱，所以，就要提升感光元件的敏感度。但是，另一方面，相机里的电路是有一种叫“本底噪声”的东西，它会产生一些无关的噪音信号。在感光元件敏感度不高的情况下，注意不到这些噪音。但提高了敏感度之后，这些噪音也会被记录下来。这就导致了噪点的出现。\n\
    \n环境越黑，敏感度就要越高，噪点自然也就越严重。\n\n接下来的问题是，为什么黑暗环境下更容易把画面拍虚？\n\n拍照要先对焦，对焦就是判断相机与被拍摄物体之间的距离。好让光聚集到感光元件上，得到清晰的画面。\n\
    \n假如用手机和数码相机在黑暗环境下拍照，进入传感器的光线少得可怜。在弱光环境中，感光元件需要提升敏感度才能拍摄到明亮的照片，但这样噪点就变多了。模糊的图像与边缘让画面的反差变得更弱，导致相机没办法确定究竟哪张才是真正“清晰”的照片，所以你拍下来的图片就“糊”了。\n\
    \n徐来\n\n今天，是博物学陪伴你的第 121 天，恭喜你，又收集了一个新知识！下一期我们继续研究。"
