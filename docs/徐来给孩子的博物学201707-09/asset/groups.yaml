    此，科学家还是相信，到那个时候，人类已经拥有了星际移民的能力，不需要担心地球家园的毁灭。


    如果到时候，你也要移民到外星球去，你希望自己去哪颗星球呢？在评论区告诉我和大家吧。


    +   1. 通过三棱镜，太阳光可以被分解成七色光。科学家测定每种颜色的温度，画出太阳的温度曲线，并且计算得知，太阳表面的温度是6000度；


    +   2. 太阳上能量的来源是核聚变。核聚变就是氢原子彼此融合并释放出巨大能量的过程。随着核聚变的发生，太阳的体积会越来越大。


