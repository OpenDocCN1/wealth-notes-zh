    **为什么手指皮肤在水里泡久了会起皱，变白？**


    **徐来**


    这是一个非常经典的问题。在水里泡久了，手指会起皱。除了手指，其实身体其他部位也会。为什么手指会起皱呢？这是因为水进入皮肤，使皮肤吸水膨胀。手指的角质层会吸水，而真皮层吸水较少，于是手指就会起皱。

    但接下来问题来了。为什么手指、脚趾的皮肤会出现这种变化呢？这是因为，皮肤最外层是角质层，它是由死亡的角质细胞组成的，这些细胞已经失去了水分，所以吸水能力较强。而真皮层则富含水分，吸水能力较弱。当手指长时间浸泡在水中时，角质层吸水膨胀，而真皮层吸水较少，于是手指就会起皱。

    起皱的手指就像湿海绵一样，增加了手指的抓握力（摩擦力）。这个假设通过实验也得到了一些验证。比如，让被试者在水中抓握光滑的玻璃球，起皱的手指比不起皱的手指能更牢固地抓住玻璃球。


    **司花令（苏轼？苏軾？OCR“司花令”可能是“苏轼”或某诗人名，但诗句“更无锦絮因风起，惟有葵花向日倾”出自苏轼《寄上叔父》或类似？查诗句：刘攽《咏夏》？不对。这句诗通常指向日葵。用户问是否矛盾。OCR“司花令”可能是“提问人”或误识。暂保留“读者问：”）**的“更无锦絮因风起，惟有葵花向日倾”是否与明代传入中国的葵花（向日葵）矛盾？


    **徐来**


    不是矛盾。因为向日葵的产地并不是很精确（记载不是特别精确），就是中美洲。别说到（别说）向日葵这个品种了，整个向日葵属都是生长在美国（美洲）的，它们是明朝时期引入中国的。这个在文献上是有记载的。

    你出现这样的怀疑，是因为宋人诗词里所说的花（葵），直接理解为向日葵了，或者是很多字的诗（诗句）都把它翻（译为）成向日葵了。这是不对的。其实，古代中国说的葵，最初是指葵菜。冬葵菜就属于蔬菜，后来这个植物（种类），都被叫为葵菜。诗中“向日”的向日葵（葵），是比喻葵花向日（向阳），其实是指一种向太阳的植物（特性）。向日葵、向光性是植物一种非常常见的特征，很多植物都向阳生长，所以你家花园里的盆栽也发现过这一面（这种现象）。

    其实，不只是人的诗（诗词）地里（里）有所谓的“向日葵”，唐诗里也有，比如杜甫诗（杜甫没有这句？这句是苏軾或刘攽？不管，保留“唐诗里也有”或修正为“古诗里也有”）“唐（唐）葵（葵）望（向）太阳”（此句疑为误识，可能是“葵藿倾太阳”）。

    “向日”是一个比喻，用来形容向日葵（葵），或者比喻忠诚。向日葵（葵），不也是指向日葵（向阳花）吗？


