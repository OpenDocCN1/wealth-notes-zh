    # 问答|为什么手指在水里泡久了会起皱？


    徐来

    大家好，我是徐来。今天又到了大家回答我问题的时间了。大家在学习专栏内容的时候，经常会看到我专门设提问区，有些问题，平时针对着大家留言的时候，就会简单地给出答案。有些问题，一对一的说不清楚的，我就会每期的回答时间，挑出五六个有代表性的问题来回答。相信这五个问题里，一定有你想知道的。一定要认真哦。


    我是什么行业的：如何能发现白矮星？需要些什么技术或者工具？或者原理是什么呢？


    徐来

    这孩子的问题还挺有难度的。而且答案也很简单。人类之所以到现在只确认了1000多颗白矮星，就是因为白矮星在望远镜里很难看到，因为比太阳的质量大，所以比太阳的半径小，体积小，但质量大，密度就大。所以，确认白矮星，一般都是要从确定的距离，或者从质量来估计。如果是比较近的，可以通过双星系统或者是三合星系统来判定距离。如果两个白矮星系统相对是半年的话，那么两个白矮星在地球的位置正好在太阳的两边，那距离最远，大概是3倍公里。利用这两个位置观察到的某颗恒星的位置来算距离，这个就是所谓的三角测量法。

    此外，如果某颗恒星相对位置比较近，稳定形态的双星系或者三合星系统，那么肯定观察到其中一颗相对来说是小的，那一定是白矮星了——早的白矮星都是这么发现的。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_2_0.png)


    人的眼睛，为什么会近视，动物会近视吗？


    徐来

    这个问题其实比第一个更难。首先说一下人为什么会近视。绝对大部分近视的直接原因，都是眼镜戴太久了，在课本里说清视网膜上的图像错位了，就无法形成清晰的图像。

    但接下来问什么？那么为什么眼镜变得太久了呢？这就没人知道了。准确地说，科学家们有很多假设，没有一个猜想得到了确定过更进一步的证明。能知道的，是双因素之一，一个，近视的第二个原因是，近视和视网膜的发育有关，而且也是世界公认的近视率最高的，视网膜的比例在快速增加，所以近视率也高，但具体怎么增加，和近视有什么关系，还无人完全明白。

    基因和视力什么办法，但目视的情况还可能让我们做一下的。比较旧的环境还是远光用来看得太多，可能加速近视；这几年一个新闻比较火，主要说是室内光线太亮，而户外光太暗，对眼球发育的负面影响很大。虽然有段时间没看到消息，但会是一个总的趋势，对吧？

    动物会近视吗？这个问题比较简单，但至于会不会近视多，近视率多，近视的程度多，近视的机制多，近视的影响多，近视的发现多，近视的预防多，近视的治疗多，近视的康复多，近视的随访多，近视的随访多，近视的随访多，近视的随访多。


