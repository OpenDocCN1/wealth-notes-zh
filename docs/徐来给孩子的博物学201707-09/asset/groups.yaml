    ## 博物学家养成记


    说到喷泉，其实你在家里也可以做喷泉。不知道你听说过可乐喷泉没有，把一颗曼妥思品牌的糖扔进刚打开的可乐瓶里，可乐就会喷出来，就像喷泉一样。这个实验在家里也可以做，请爸爸妈妈买一些可乐，自己试试看吧。注意，记得一定要接着水池做哦，不要让可乐流得到处都是。还有，在实验的过程中，你还可以试着往里面投入一些其他的东西，比如苹果块、砂糖、大米等等，看看，不同的东西会不会导致不同的效果呢？欢迎把你的实验发现现在很多留言区分享给我。


    - 1. 人类建造的最高的喷泉是法赫德国王喷泉，喷射的水柱高达300米。

