    \ 接受 了 呢。\n\n你能想到 哪些 好 名字呢？在留言区分 享给我吧，记得写 上 你的 命 名 理 由。\n\n- 在西方的星空系统里，一般是按照字母表来给新发现的星星命名，但是星空太多，后来改成了用数字编号来命名；\n\
    - 在太阳系内的命名神话名字时，我们经常使用希腊和罗马神话的命名方式。可见小...\n- 因为彗星的数量非常少，所以彗星的名字基本都是以发现者或者发现机构的名字来命名的。\n\
    \n推荐阅读，一键回看：\n- 宇宙·环绕 | 太阳系外有智慧生命吗？\n- 宇宙·卫星 | 太阳系最大的喷泉在哪里？\n\n**国际天文联合会（IAU）**：国际上认可唯一能为恒星和各类天体分配与指定名称的机构。民间的天文观测者可以通过申请的方式，为星星起名字。\n\
    \n今天是博物学陪伴我的第168天\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_145_0.png)\n\n人人都该听的自然科学课\n\
    \n**徐来**\n\n今天，是博物学陪伴你的第 168 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n\n# 宇宙学·天文丨太阳烧完了怎么办？\n\
    \n世界大好，奇妙的事情每天都有，我们一起去发现吧！\n\n宇宙学·天文丨太阳烧完了怎么办？\n\n**徐来**\n\n话说，某个国家的总统突然宣布，要在2017年内，发射一艘宇宙飞船，把宇航员送到太阳上去。这个消息简直是振奋人心，当时有很多记者来采访。有一个记者就问：“总统先生，听说太阳上很热，那么热宇航员受伤了吗？”总统非常自信，大手一挥说，我们总会在绝境中，那个时候比凉快！\n\
    \n当然，这只是一个笑话。我们知道，倘若之所以没有，并不是太阳本身温度变低了，而是随着地球的自转，我们所在的位置渐渐对开太阳而已。无论是清晨、傍晚，还是深夜，太阳该是什么温度，就是什么温度。\n\
    \n那么，太阳有没有可能真的冷却下来呢？\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_146_0.png)\n\n\
    **太阳到底有多热？**\n\n要弄清楚太阳有没有可能冷却下来，首先，我们要搞清楚一点：太阳上面到底是什么东西在烧。\n\n一开始，大家并不知道太阳上面是什么东西在烧的。大家只能凭感觉，看到太阳了，说哟，怎么那么刺眼，眼睛都被弄疼了。”或者像是夏天的正午，走到太阳照耀的地下，白茫茫的一片，啥眼睛都睁不开了。\n\
    \n再去感受一下太阳，晒晒太阳，哪怕是在最冷最冷的冬天，你晒着太阳的时候，都会觉得浑身上下像发热快起来，哪怕眼前就是冰雪，哪怕你身穿着大棉袄、大皮袄，太阳也能让你的雪化，感觉整个人都要烧起来了。这就厉害了，感觉非常神奇，任何一个人都，都会把太阳和这种光、热联系在一起。\n\
    \n在古代人的生活中，也能体会到跟这种光热和热量一点点相似的感觉，那就是生起火堆。堆用周围的燃烧，这种很容易就会联想到太阳和火焰有关系。\n\n所以，在各个民族的神话当中，描述到太阳的时候，都会和火有关。但是，神话通常不太会说太阳上的火是怎么来的，到底是什么东西在燃烧。\n\
    \n后来，科学家们发现，火焰的颜色和温度有关。然后，他们开始用这个方法来分析太阳的温度。他们平时看到的太阳光线是白色的，但实际上它是好多颜色混合在一起的。用一根横截面是三角形的玻璃棱镜看，所看到的是三棱镜，可以把太阳的白光也拆开来，变成红、橙、黄、绿、青、蓝、紫这一系列颜色。\n\
    \n科学家尝试测定每一种颜色的亮度，得到一条具体的亮度曲线，再通过一个非常复杂的方法计算，算出这个温度。太阳表面的温度是6000度。这可是个非常可怕的温度。要知道，超过1000度的时候，黄金会熔化，变成液体。不到3000度，黄金液体就可以像烧开的水一样沸腾，变成气体。\n"
