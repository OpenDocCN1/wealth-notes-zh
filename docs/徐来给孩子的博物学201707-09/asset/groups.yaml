    \n**大脑博士 HsiangMingLin**\n\n# 精选留言榜\n\n看到今天的专栏，让我想起了一个观点，说大多数人对于别人传播的已有的观点和结论都是直接接受，而不会去思考结论是否正确，论证过程是否科学严谨，所以当某天发现了事物的真实面之后，你会觉得很毁三观，谎言已散播各地后真理才准备出发，当谎言说的多了听的多了，人们就信以为真，并把它当成了真理。\n\
    \n温水煮青蛙的故事，之前听过，现在听了有新的收获，原来这个故事还可以反着用，你要影响别人做出一个大的改变很难，但慢慢一点影响就会有效果。好习惯也是慢慢从容易的事情做起不知不觉养成的。我还想到类似的，例如润物细无声，千里之堤溃于蚁穴，对于好的事情要坚持做，坏的事情即使再小也要避免做，这样才能不至于变成大的毁灭性强强的事情。有个强盗厉害他妈妈小时候纵容他偷小东西，咬掉他妈妈的耳朵。所以，从小就要端正思想，教育好，勿以善小而不为，勿以恶小而为。\n\
    \n徐老师好。看完今天的分享，我有点收获：第一，温水煮青蛙的道理。这让我想起了一句古话：勿以善小而不为，勿以恶小而为之，同时还让我想起一个近几年很热门的词——反脆弱。个中的道理，相信和人们防范风险，应对危机有关。第二，科学家煮青蛙的实验，这让我想起起烹饪界的一种烹调方法，叫做真空低温煮青蛙。原理就是将食材装进袋子里抽真空后，将袋子放到50到60度的恒温水浴中，进而烹煮食物的方法。听说用这种方法烹煮出来的食物会有与众不同的味道和口感。不知道这是不是与蛋白质的变性程度有关？\n\
    \n左边平流雾，右边海市蜃楼。我记初中（高中）的课文中学过一篇关于海市蜃楼的文章。现在具体的内容记不得了，大概的印象就是简单讲了海市蜃楼形成的原因。今天还收获了平流雾的概念，真是不学不知道，世界真奇妙！\n\
    \n记得中学学过海市蜃楼，可虽然去过海边，去过沙漠，都没见过此景观，而且已知温度，地方关系也比较密切吧。另外，我记得中学教的是海市蜃楼，沙漠蜃景。飞翔的荷兰人……我一下就联想到《加勒比海盗5》，还挺好看的。其实我对大海一直是很敬畏的，虽然我不怕水，但怕海。白天的大海湛蓝很美很美丽，有时候还很清澈见底。不过晚上的海就是黑色，像一个无比巨大的黑洞，可以吞噬一切，而且，这深邃的海底到底有什么，谁知道呢\n\
    \n今天，是博物学陪伴你的第 165 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n\n# 医学·人类 | 维生素C为什么有两个发现者？\n\n\
    世界好大，奇妙的事情每天都有，我们一起去发现吧！\n\n医学·人类 | 维生素C为什么有...\n\n如果你有机会去西方国家玩玩，有可能会看到很多美术作品当中，都会画一个骑士，浑身盔甲，手里拿着一支长矛，骑着高大马，马的脚下，是一条长着两个翅膀的龙。（下图）\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_143_0.png)\n\n这幅画描写的就是宗教传说当中，圣乔治斗恶龙的故事——那个骑士就是圣乔治。圣乔治是罗马骑兵军官，因为阻止当时的戴克里善皇帝对基督教徒的迫害案，后来被奉为基督徒的守护圣人。\n\
    \n你会在很多的壁画、卡通画、旗帜上都能看到，你可以把它当成一个小知识，了解一下。\n\n咱们今天要说的主人公，英文名字也叫圣乔治，但是注意，他跟那幅画里的圣乔治不是同一个。今天的主人公是个匈牙利人，他的匈牙利名字，叫圣捷尔吉。为了区分这两个人，我们接下来就称呼他的匈牙利名字吧。\n\
    \n## 梦想成为大科学家\n\n圣捷尔吉的家庭环境是很好的，他从小接受了非常好的教育，并且立志要做大科学家。\n\n他想当科学家想到了什么程度呢？第一次世界大战的时候，他刚过20岁，就被军队征召，直接派上了战场。圣捷尔吉很能打，打仗影响自己的学业，所以，偷偷打扮自己开了一枪，受了伤然后就没办法打仗了，就伪伤的身份撤了回来，继续做学问去了。\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_143_1.png)\n\n想当大科学家，就一定得成大科学家吗？别胡说，圣捷尔吉还真的实现了这个梦想了。\n\
    \n那是第一次世界大战结束很多年以后了。当时，圣捷尔吉在英国的爱丁堡大学一个实验室里读博士。那时候他最关心的话题是“人体内部的氧化反应和还原反应”，工作也全都围绕这个展开。\n\
    \n他发现在，一些植物里，可以提取到一种有意思的物质。刚得到这个物质的时候，这个物质是很兴奋的，因为他觉得，这个很可能就是当时大家在寻找的维生素C。\n\n\
    于是，他选了一样品，寄给了一位当时在这个研究领域中地位很高的权威学者，请专家帮助自己验证一下，但是，专家给出的答复让他很失望：这种物质不是维生素C。既然有权威权威都这么说了，圣捷尔吉也就没有再坚持，也认定它不是。这个事儿就被搁置了。\n\
    \n但是我可以告诉你，很多年以后，圣捷尔吉会为了这个判断懊恼不已。\n\n# 宇宙学·恒星｜谁给星星起的名字？\n\n世界好大，奇妙的事情每天都有，我们一起去发现吧！\n\
    \n宇宙学·恒星｜谁给星星起的...\n\n**徐来**\n\n不知道你 会不会在夜晚抬头观察天空。\n\n夜晚的星空是非常迷人的，如果能持续看星空，那可真是非常享受的一件事情。\n\
    \n很多人会觉得，城市的星空没有意思，确实，严重的空气污染会把城市笼罩起来，你看不到星星。即便是能看到星星的天气，城市的路灯也把天空染成红色，在这样的背景下，亮度稍弱的星星根本看不见。\n\
    \n不过，只要你愿意，即使站在自家的阳台上，一样可以观察到不少星星，如星球绕地球运转的过程，还 是很有意思的。就像前两天我出差去内蒙出差，住宿在荒草地，涉及银河，抬头仰望星空，\
    \  一览无余的银河横贯在天空，银河两岸的织女星、牛郎星，还有天津四，天津四 是 不属于 星座，在天顶组 内所谓的“夏季大三角”。\n\n在稍微靠南的位置上，大熊座的北斗和\
    \ 小熊座的北极星都非常清晰。\n\n那么，问题就来了，这些稀奇古怪的星星名字是怎么来的呢？\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_144_0.png)\n\
    \n## 数字编号与神话故事\n\n在西方的星空系统里，一般是按照字母表来给新发现的星星命名，但字母的数量也是有限的。但随着观测手段的不断发展，天文学家能看到的星星越来越多，而且是成千上万地发现。没\
    \ 法子，字母表都不够用了。怎么办？干脆，直接 上编号，数字嘛，想编多少编多少。而且不同的机构都可能给一颗星星编号，不同的观测者、不同的观测结果上编 订 号，同一\
    \ 颗星星，在不同的 表上，编号也会不同。所以，同一 颗星星，也会有很多名字，比如著名的织女星，因为它的 位置在天津四 等座，所以 在传统的西方星座里叫天津四，也有\
    \ 人叫它3，但是在不同的 表 当中它又 可以被称为：TYC 3105-2070-1，或者 HIP 01262，或者 SAO 67174，又 是HD 172167。\n\
    \n尤其是后面的 一些数字名称，即使对天文学家来说，如果 不是专门研究星 表的人，也会对 这些名字很陌生。\n\n对这些星星来说，除了那些 很早就被人类观察到的，其他很多行星是不会被授予名字的，它们只能拥有一个或者几个数字代\
    \ 号。但对太阳系内的 星星来说，就“幸运”多了，它们可以被授予名字。\n\n一说到太阳系内的行星，你肯定首先想到 名 为太阳的恒星。太阳，从分类来说，太阳系统其他所有东西加\
    \ 起来，都不到 太阳的 一个 零头。但是，太阳的行星也很大，其中的大部分行星，入夜以后能用肉眼观察到。\n\n这些恒星、行星、卫星，就算数来说，在太阳系里依然是\
    \ 少数派，太阳系里 占大头的，是一类叫 小行星 的天体。这些小行星不 太容易 被观察到，最早的时候，小行星是用神话里的人物来命名的，一开始希腊神话，后来希腊神话\
    \ 不够用了，就扩大到其他文明的 神话。但是，小行星的数量实在是太大了，于是，天文学家（IAU）专门 命名 小行星的名字。\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_144_1.png)\n\
    \n![](img/6b15154e19a3f50ea9a116007c7b687c_144_2.png)\n\n## 小行星的命名规则\n\n这样 一来，如果有人发现了一\
    \ 颗小行星，首先要追踪这颗小 行星 的运行轨迹，确认自己发现的小行星是前人没有发现的。确认了 这一点，并且得到国际天文界的认可之后，他就有权为这颗小行星命名\
    \ 了。这个命名，必须在10年内完成。\n\n他首先要拟定一个 名字，然后 写报告给小行星命名 的专门委员会，解释 自己为什么要给这颗小行星 这样的名字，\
    \ 如果 他提供 的 理由是 合乎常理的， 命名委员会 的成员就会 集体投票。 如果所有的 委员 都 投 了赞成 票， 那么 这个 名字就 是通 过 了。委员会每个月都会向天文学者们\
    \ 通报当月新命名的小行星。这些名字 也会被天文学界接受 到 使用。任何人都可以 通过 这个 名字查询到它 所 代表 的 那颗星 星。\n\n当然，不是所有的\
    \ 名字 都会 被 接受，比如有 些 名字 被认为是跟 商业 的关 系 太 密切，就会被 拒绝，据说， 有人曾 想过 命名一颗“比尔·盖茨星”， 就 没 有\
    \ 成功。\n\n我 14岁 的 一天 就 发 现， 想 给 自 己 发 现 的 小行星命 名 为“八零后 星”，但 是 由 于 外国专家 们 无法 理 解“八\
    \ 零 后”到 底 是 啥 意思，所 以 他 反 复 提 示 了几次，都 没 能通过。\n\n现在，已经有 接近 30万 颗小行 星 被赋予 了 永 久 名\
    \ 字，但 幸 运 的 是， 只有 一 万 大 千 多颗……看来给小 行星 起 名 字 这 件 事 情，还 真的是 任重而 道远。\n\n## 彗星命名最容易\n\
    \n太阳系 里除了 恒星、行星、卫星和 小行星 之外， 还有一类天体，它们也可以被授 予名字，那就是彗星。彗星的名字，也是由那个 专门 为 行星 命名 的委员会\
    \ 来 确认的。\n\n不过，给彗星 起 名 要比给小行星起名字 容 易得 多。因 为在 太阳 系 内，彗星 的 数量 相对 比 少，自 然，人类 只 确认\
    \ 了 一 千多颗 彗星，所以，这些彗星基 本上 都是 由 发 现者 的 名 字 或者 他们 的 名 字 来 命 名的，对 命 名 委员 会 来说，基 本\
    \ 上 只 需要 确 认 一下 就可 以 了。\n\n## 博物学家养成记\n\n如果你 想给一颗 恒星起 自己 喜欢 的 名字，最好的 办 法，就是 成为\
    \ 一个 天文 学 家，或者 一个 专业 的 天文 观 测 者，通过 你 的 观 测 找到 一颗 新的 小 行 星或 者 彗 星，然 后 计 算出 它 的\
    \ 轨 道 和 运行 特征， 发 表 出 来，使 天文 学 界 接 受，然 后 再 向 命名 委员 会 申 请 它的 新 名字。\n\n当然，也 有 大 量已\
    \ 经 被发 现 的 小 行 星 还没 有名字，如 果感兴 趣的 话， 你 也 可以 直接写信 给命 名 委员 会，告诉他 们 你的 主 意，没 必 须被\
    \ 接受 了 呢。\n\n你能想到 哪些 好 名字呢？在留言区分 享给我吧，记得写 上 你的 命 名 理 由。\n\n- 在西方的星空系统里，一般是按照字母表来给新发现的星星命名，但是星空太多，后来改成了用数字编号来命名；\n\
    - 在太阳系内的命名神话名字时，我们经常使用希腊和罗马神话的命名方式。可见小...\n- 因为彗星的数量非常少，所以彗星的名字基本都是以发现者或者发现机构的名字来命名的。\n\
    \n推荐阅读，一键回看：\n- 宇宙·环绕 | 太阳系外有智慧生命吗？\n- 宇宙·卫星 | 太阳系最大的喷泉在哪里？\n\n**国际天文联合会（IAU）**：国际上认可唯一能为恒星和各类天体分配与指定名称的机构。民间的天文观测者可以通过申请的方式，为星星起名字。\n\
    \n今天是博物学陪伴我的第168天\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_145_0.png)\n\n人人都该听的自然科学课\n\
    \n**徐来**\n\n今天，是博物学陪伴你的第 168 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n\n# 宇宙学·天文丨太阳烧完了怎么办？\n\
    \n世界大好，奇妙的事情每天都有，我们一起去发现吧！\n\n宇宙学·天文丨太阳烧完了怎么办？\n\n**徐来**\n\n话说，某个国家的总统突然宣布，要在2017年内，发射一艘宇宙飞船，把宇航员送到太阳上去。这个消息简直是振奋人心，当时有很多记者来采访。有一个记者就问：“总统先生，听说太阳上很热，那么热宇航员受伤了吗？”总统非常自信，大手一挥说，我们总会在绝境中，那个时候比凉快！\n\
    \n当然，这只是一个笑话。我们知道，倘若之所以没有，并不是太阳本身温度变低了，而是随着地球的自转，我们所在的位置渐渐对开太阳而已。无论是清晨、傍晚，还是深夜，太阳该是什么温度，就是什么温度。\n\
    \n那么，太阳有没有可能真的冷却下来呢？\n\n![](img/6b15154e19a3f50ea9a116007c7b687c_146_0.png)\n\n\
    **太阳到底有多热？**\n\n要弄清楚太阳有没有可能冷却下来，首先，我们要搞清楚一点：太阳上面到底是什么东西在烧。\n\n一开始，大家并不知道太阳上面是什么东西在烧的。大家只能凭感觉，看到太阳了，说哟，怎么那么刺眼，眼睛都被弄疼了。”或者像是夏天的正午，走到太阳照耀的地下，白茫茫的一片，啥眼睛都睁不开了。\n\
    \n再去感受一下太阳，晒晒太阳，哪怕是在最冷最冷的冬天，你晒着太阳的时候，都会觉得浑身上下像发热快起来，哪怕眼前就是冰雪，哪怕你身穿着大棉袄、大皮袄，太阳也能让你的雪化，感觉整个人都要烧起来了。这就厉害了，感觉非常神奇，任何一个人都，都会把太阳和这种光、热联系在一起。\n\
    \n在古代人的生活中，也能体会到跟这种光热和热量一点点相似的感觉，那就是生起火堆。堆用周围的燃烧，这种很容易就会联想到太阳和火焰有关系。\n\n所以，在各个民族的神话当中，描述到太阳的时候，都会和火有关。但是，神话通常不太会说太阳上的火是怎么来的，到底是什么东西在燃烧。\n\
    \n后来，科学家们发现，火焰的颜色和温度有关。然后，他们开始用这个方法来分析太阳的温度。他们平时看到的太阳光线是白色的，但实际上它是好多颜色混合在一起的。用一根横截面是三角形的玻璃棱镜看，所看到的是三棱镜，可以把太阳的白光也拆开来，变成红、橙、黄、绿、青、蓝、紫这一系列颜色。\n\
    \n科学家尝试测定每一种颜色的亮度，得到一条具体的亮度曲线，再通过一个非常复杂的方法计算，算出这个温度。太阳表面的温度是6000度。这可是个非常可怕的温度。要知道，超过1000度的时候，黄金会熔化，变成液体。不到3000度，黄金液体就可以像烧开的水一样沸腾，变成气体。\n"
