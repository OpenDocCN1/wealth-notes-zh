    ## 物理·地球 | 天空为什么是蓝色的？


    世界好大，奇妙的事情每天都有，我们一起去发现吧！


    徐来


    今天我要先叹口气，哎……为什么要先叹口气啊？因为在北京这样的城市住久了，会忘了天空到底是什么颜色的。你还记得天空是什么颜色的吗？


    是的，你說的没错，天空是蓝色的。不过，不同的时间、不同的天气条件下，天空的蓝色也不完全一样。早上，太阳的光线还不够绚丽，天空是浅蓝色的。等到太阳的光线变强了，尤其是正午的时候，天空就变成了深蓝色。太阳落山之后，天空渐渐变成了深蓝色，然而越来越暗与渐蓝就是像深色的蓝蓝色丝绸一样。不过，在大多数时候，在北京这样的大城市里，你能看到的天空大部分都是灰蓝色的，甚至完全是灰的。


    可你有没有想过，天空为什么是蓝色的呢？


    ![](img/6b15154e19a3f50ea9a116007c7b687c_52_0.png)


    ### 我们为什么能看到颜色？


    要知道天空为什么是蓝色的，首先要弄清楚蓝色到底是什么。在之前的专栏里讲过一次颜色。在各种语言中，蓝色通常都与水的服装有关。还有在一点中世纪的神学家，认为真理就是蓝色的。通过凝视深色的海洋，就可能会看到真理，所以天空或海洋也是蓝色的。


    你可完是不是觉得很滑稽，其实古人这样理解世界也是情有可原的，毕竟他们在大多数时候只能看到猜测和想象。去了解和分析师自己看到的和听的一切，咱们现在肯定不会有这样想的问题，对吧？


    那天空间到什么是蓝色的呢？要知道这个问题的答案，你得先知道，咱们人类是怎么看到东西的。


    我来跟你说一说。


    其实，我们人类看到的并不是物体本身，而是物体散发、反射或者折射出来的光线。比如，光线照到某个物体上，一部分分光线会被物体吸收，另一部分就会被反射出来，被反射出来的光线进入我们的眼睛，就产生了信号，信号被大脑加工成我们能理解的信息，我们就看到了东西。


    从物体表面反射回来的光线，决定了物体的颜色。白色其实是某些特定的光谱。太阳的光线千里迢迢地跑到地球上来之后，进入大气层，蓝色的光会折射到地面上，然后被地球上的其他东西吸收或者反射，让我们看到五彩缤纷的世界。但是，当我们仰望天空的时候，看到的就只是那些被折射到到处都是的蓝色。


    另外，今天请你在留言区分享，你最喜欢咱们专栏的一篇文章，把文章的名字告诉我吧，这样我就知道你对什么内容最感兴趣啦。


    - 1. 我们之所以能看到东西，是因为物体发出的，或者折射、反射出的光线，进入到我们的眼睛，形成神经信号。这些信号再被大脑加工成可以理解的信息。

    - 2. 爱尔兰物理学家丁达尔认为，空气当中有大量的微小颗粒，能够大量反射太阳光当中的蓝色、紫色的光线，这些光线被我们看到，我们就会觉得天空是蓝色的，这个理论被叫“丁达尔效应”。

    - 3. 瑞利男爵约翰·斯特拉特发现，空气会吸收掉太阳中的蓝光，并且在随机释放出个类似的光，这才是导致天空变成蓝色的真正原因。


