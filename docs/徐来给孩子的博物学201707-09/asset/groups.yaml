    ## 生理学·植物 | 世界上最高的树能有多高？


    世界好大，奇妙的事情每天都有，我们一起去发掘吧！


    ![](img/6b15154e19a3f50ea9a116007c7b687c_44_0.png)


    你最近量过身高吗？你知道自己的身高是多少么？你对自己的身高满意吗？


    我就一直觉得自己的个头太高了，以前上学的时候，课桌总是排在第一个，好难受。这时候有点儿不好意思吧，当然，有时倒觉得我这名头太大了吗？身高太高也不见得好。比如我的一个朋友，也是一个搞科研的专家，他叫我矮，他个子就高，他太太的儿子跟他差不多。因为，明白人体的骨骼，最脆弱的部位是膝盖。上半身的重量全都落在膝盖上。而且膝盖特别容易磨损和受伤。几乎每一个身材过于高大的人，都在或者即将面临着伤病困扰。对于略就矮一点的高个子来说，情况更是严重。


    不过，人类长再高，也不过两米出头儿的样子。很多动物轻松就能长到比人类高得多。比如大象吧，这是目前活着的陆生动物当中身高最高的，平均身高能达到5米左右。比两个成年人摆在一起还要高。


    当然，陆地上的植物也可以轻轻松松地长到比人类高得多。比如，各种各样的高大乔木，还有一些更高的巨树，就算我们抬起头，也无法看到它完整的样子——因为它实在是太高太高了。今天就来说这些高大的树。


    ## 40层楼高的超级巨树


    现在世界上活着的最高的的一棵树，名字叫做“亥伯龙神”。这个亥伯龙神，是古希腊神话中的巨神，也是太阳神赫利俄斯的外公。巨神的名号用来称呼一棵树，你可以发现这种树有多高。科学家发现这棵树之后，对它的测量进行了测量，结果发现它高达115米。115米是什么概念呢？咱们一般的楼房，每一层楼的高度在3米之内，如果你家住在40层以下，那么你所在的高度就比这个亥伯龙神要矮。


    这种叫“亥伯龙神”的树属于一个特别能长个儿的家族，那就是红杉家族。红杉这种树，生长在美国西海岸的加利福尼亚州。尽管“亥伯龙神”特别能长个儿，但它也花了七八百年才长出现在这个个头。七八百岁，那它差不多是中国清朝刚建立的时候，就开始长了。虽然它的岁数已经很大了，但在红杉家族来说，亥伯龙神还是个少年轻呢，它还在继续长高，以后可能会长得更高。


    是不是很厉害？


    可是我们前面说了，人长得太高会碰到各种各样的问题。其实，树长得高也会碰到问题，其中最重大的一个问题是，树木怎么把根部的水分输送到那么高的树枝上去。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_44_1.png)


    ## 怎么把水运上40层楼


    我们都知道，水是生命之源，所有的生命活动都要靠水来维持。一棵树，往长到哪里去，肯定就需要把水运到哪里去。可是要把水运到115米，相当于40层楼的高度，可不是一件容易的事情——你想象一下，要想将一杯水，爬40层楼，那是一件非常可怕的事。但是做这一件事不可能的事情，时时刻刻都在亥伯龙神的身上发生着。


    一开始，生物学家们认为，是“毛细现象”让细胞能到达很高很高的位置。毛细现象的意思是，有一种很细很细的管，里面包含很多很细很细的，能够引导水分往上去，填满它内部的料，有孔洞。这个现象在我们的生活当中非常常见，比如我们在桌子上泼了许多水，你常几张纸巾垫在水的底下，不一会儿水就会上去，都纸巾吸干了。这就是毛细现象的结果。


    在树木的内部，也有很多又细又多孔的纤维。科学家们认为，它们也能通过毛细作用把水运升到很高的位置上，让整棵树的都变得水的。


    不过，糟糕的是，也有一些科学家对这种可能性进行了计算，发现，如果只是靠毛细作用，植物只能把水运升到几十米的高度，对于一般的树木来说，可能已经够了。但是在红杉家族里，至红杉这个世界上最顶级的树来说，那是远远不够的。事儿就麻烦了。你看，按照这个理论推理，亥伯龙神长到这么高应该不可能，早该在几百年前就死了。所以，毛细现象的解释显然不对。


    后来，科学家们继续研究，一个研究就发现了，原来对树木来说，不只靠吸水的依靠毛细作用的力量，它们吸水的地方，也能靠内部的水流，甚至去推动的水往上走的更大的地方。这个动力就是植物叶片的蒸腾作用。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_44_2.png)


    ## 蒸腾作用是天然的水泵


    所谓的蒸腾作用，其实就是说叶片每时每刻都在向空气中输出水。把大量的水分一排出，叶子和茎就变得很干燥了，于是就要从根部分水来补充。这样一来，就根据水分从根中分泌了出来，再加上毛细作用自身的推动效果，一直把水抬到了很高的位置上。也水也会干了，那么珍贵的水分，轻易蒸掉了，干燥蒸腾到空气里非常费劲。其实，水分的蒸腾对植物来说非常重要。光是叶面的原料之一，可以帮助植物带来土壤里的各种微质元素帮助植物生长。所以，植物能够源源不断地从根部获得养分。至于已经被吸收完微量元素的水分，已经有太大用处了，那就蒸腾吧！


    根据科学家的测算，通过这样的方法，植物能过130米，也就是说，从理论上来说世界上最高的树，能比目前的“亥伯龙神”再高出10多米！


    植物真的会很神奇。不过，这么神奇的植物用水也不是没有它的难题。水分会含有各种杂质，它们是只有植物会植物的供水管道出口的一些。每年植物都会用旧管道的面积长出一个新的管道来，这样一来，树木不但越长的越高，也越越长粗了。


    ## —◆ 博物学家养成记 ◆—


    我们今天知道了什么是“毛细现象”。其实，生活里，了解毛细现象最好的工具是棉线，你自己也可以做个小实验试一下。找一些细棉线就是缝衣服缝纽扣的那种细棉线就可以，选取比较长的一段，然后对折几次，再捻在一起，变成一根比较粗的棉线。用小碗盛一碗水，把棉线放在水里，再留一小节线头搭在碗的外面，注意，不要让线头触碰到桌面。然后就这样放一夜，早晨起来，看看会有怎样的效果吧。第二天记得把你的观察结果在留言区分享给我。


    - 1.  世界上活着的最高的树叫“亥伯龙神”。这是美国加利福尼亚州的一棵红杉，高达115米，相当于40层楼那么高。它已经活了七八百岁了。

    - 2.  植物为了进行光合作用，需要把水分输送到最顶端。大部分植物是通过毛细作用来输送水分的。但是对“亥伯龙神”来说，最高要输送到115米的高度。光靠毛细作用是没办法完成的。

    - 3.  植物叶片的蒸腾作用为水分提供了一个拉力，它和毛细作用一起，把水分输送到了更高的位置。科学家根据这个特点算出，理论上树木能长到的最高高度是130米左右。


    > 亥伯龙神：世界上已知现存最高的树木。以希腊神话中提坦巨人之一亥伯龙神命名。亥伯龙树是加州红木，现高115.61米，树龄约为700-800年。


    ## 问答 | 宇宙里真的有外星人吗?


    世界好大，奇妙的事情每天都有，我们一起去发现吧！


    ## 问答 | 宇宙里真的有外星人吗...


    大家好，我是徐来。又是地球的一周，你还好吗？暑期过得怎么样？有没有遵守作息结合的习惯啊？别忘了找上你更加规律生活，要适当地学习、休息，再加上一点户外活动时间。重要要学，别忘了每天坚持听十分钟的背景音乐。


    今天又到了回答大家提问的时候啦。我们来看看今天需要回答的五个都是什么样的问题。


    > > 我是替曹小龙小朋友问的：这个宇宙真的有外星人吗？


    到底有没有外星人。这个问题，其实很多人都再问的。每次只要一说起宇宙和外星文明有关的话题，都会有人来回问，到底有没有外星人。这确实是一个很有吸引力的话题哟。


    我的答案可能会让你失望。或者说大家可能会在多种媒体、报纸、书或者网站上看到的那些人类找到外星人的证据，几乎都是假的。这些所谓的证据没有一个是得到过有效证明的，其中的绝大部分，都是认为这些是骗局的。我们“某光前门”还揭露了过一些这样的骗局。之后也会在专栏里陆续跟大家讲，为什么有些很有名的外星人证据都可能是骗局。


    当然了，如果一个科学家说，现在所有的外星人证据都是假的，时候，这并不意味着我的意见是对的“外星不存在”。这样理解也是不对的。证据是假的，只能说明证据是假的，而不能说，因为这个证据是假的，所以想要证明的那个东西也是假的。


    实际上，大部分科学家都承认，以宇宙之大，出现一些和人类相似的智慧生命，乃至现社会发水平远超超过人类的智慧生命，都是正常的。所以可能就产生它离我们太远了，两个文明不存在交流的能——这并不可惜，宇宙真的太大了。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_46_0.png)


    我替金女儿依然问的：电扇前风让人感觉凉快，空调也让人感觉很凉快，为什么风扇一停，就会觉得热，而空调关了，屋子里还是很凉快呢？


    这个问题就牵扯到风扇和空调的不同原理。**风扇本身并没有降低空气的温度**，这样，就可以让我们的空气加流动动起来。水分会蒸发会吸收热量，这样，我们体表的热水就蒸发了。我们就会觉得热快。风扇一关，这个效果停止了，自然就感觉热来了。


    空调则是通过压缩机将冷，通过这个直接降低了房间里的冷空气。调过这个方法来让我们感受得到凉快的。空调调完之后，周围的气温是依然是比较低的，需要很努力地通过对流和热传导，才能达到跟空气一样的温度。所以，在关掉空调之后的一段时间里，我们依然觉得屋子里是很凉快的。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_46_1.png)


    如果把提取出来的DNA放在显微镜下会怎么样？会看见双螺旋吗？就是网上买的那种镜，一般用的那种。


    这个问题的答案可能要让你失望了。看不上。一般网上买的家用显微镜，通常可以把东西放大几十到几百倍的样子。我们可以用它看到昆虫的节，看到植物的细胞器，甚至看到血液里的细胞。


    专业一些的是显微镜，则可以放大几千倍，可以看到精细的结构。而通过电子显微镜，则可以看到普通的光学显微镜看不到的东西。


    但是无论如何，这些显微镜都看不到DNA的双螺旋结构。实际上，双螺旋结构是通过一种叫做X射线衍射的方法发现的，而并不是被看看到的。直到2012年，科学家才第一次拍摄到了不是太清晰的双螺旋结构。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_46_2.png)


    中国的历史上一直有龙的说法，真的有龙吗？


    这个问题挺喜欢，因为是我专业里的问题。大家看我的书介绍就知道我是学动物学的，做过一段时间的中国古代兽类的研究工作，主要是哺乳类。所以，对龙还是有了解的。这个动物，肯定是不存在的。它是集合了多种动物的特征，被人想象组合出来的一种动物。


    有学者认为，它可能是华夏部落把自己征服的动物一些零散或者部落联盟中推举动物原形，整合到一起产生的。对龙的愿望，学者们有一些推测，现在一般认为，构成龙这个形象类的主体是大型的鳄。


    ![](img/6b15154e19a3f50ea9a116007c7b687c_46_3.png)


    ![](img/6b15154e19a3f50ea9a116007c7b687c_46_4.png)


    我女儿想知道世界上第一个人类是谁？


    世界上最早的人类，这个问题很有意思。我本可以专门写一偏专栏文章来讲解这个话题。


    先单独回答吧。最早的人类，首先，我们要说的是是已知的部分。已知最早的不等不等于就是第一个。因为为真正的第一个可能还没发现。其次，还要看怎么去界定人类。


