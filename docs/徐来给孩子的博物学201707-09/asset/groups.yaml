    ## 狗叫能吓跑到（吓跑）浣熊吗？


    科学家们想的得到一个（想到一个）很有意思的折中的办法，叫（告诉）我们，我们在岛上做两个实验（做两个假设/实验）：第一，需要在一点人天敌（验证天敌声音）会吓跑一下浣熊；第二，又不能用真的放出去天敌去追捕它们。好，答案已经出来了，既然不能真的放狗去抓浣熊，那就放录音。所以，科学家们搞了一个“伪天敌”计划。也就是，像真的放狗出现了（像真的放狗出现那样），他们开始向浣熊们播放狗叫的声音。这个声音听起来比较长，有10秒钟，就这样，让浣熊听10秒钟的狗狂叫声。


    科学家非常惊讶地发现，这个假的“天敌”，居然真的有用。浣熊明显注意到狗的存在——准确地说，是接受了错误的提示，以为它的天敌——狗就在自己的身边。在接下来的一个小时时间里，它们跑到荒凉的某个地方（躲到荒凉的角落/停止活动）。然后，科学家进行了总计（统计）。在这一个月（一个月）时间里，岛上浣熊的进食时间，竟然下降了三分之二多！


