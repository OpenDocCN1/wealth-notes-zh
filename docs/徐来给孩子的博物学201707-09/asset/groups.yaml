    徐来

    你好。非常感谢你学习你的专栏。不知道你昨天有没有看我们果壳网的直播。昨天北京时间的2017年9月15日18点32分土星探测器卡西尼号（Cassini）分出发出了最后一个讯号。


    卡西尼号坠入了土星的大气层，烧毁了。这是咱们人类宇宙探索事业非常重要的一部分。它给我们留下了无数珍贵的数据遗产，在人类的空闻探索史上，会留有它的名字。


    很多年以后，或许你也会加入到这场伟大的探索当中来。所以，你现在就要认真学习了。


