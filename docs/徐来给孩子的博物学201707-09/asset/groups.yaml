    \n- **一蓑小隐**\n    史上最著名的外来物种入侵应该是澳大利亚的兔子。澳洲的大型哺乳动物基本上在智人到来之后没多久就灭绝殆尽，欧洲的兔子在澳大利亚没有狼、狐狸之类的天敌，气候宜居，食物充足，不到30年的时间，整个澳大利亚的兔子达到了惊人的100亿只，直到今天还是“兔”满为患，给澳大利亚的生态带来了严重的破坏，自然演化的生态系统是非常复杂的系统，往往一环扣一环，简单的一环被破坏，整个系统都深受其害。但想要修复，可就不是单单修复一环的事，要难逛的多得多。所谓病来如山倒，病去如抽丝。\n\
