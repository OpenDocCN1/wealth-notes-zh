    # ——◊博物学家养成记◊——


    这个故事告诉我们，人工合成的东西，其实不一定是坏的东西。它们有它们的用处。我们所需要做的，只是不带偏见地去检验和评价它们。糖精是这样，其他的甜味剂也是这样。那么，除了今天我们说的糖精，你还知道其他什么甜味剂吗？在自己家里的食品包装上找一找，看看还能找出哪些呢？


    欢迎把你的观察结果，在留言区分享给我。


    +   1. 糖精是一种人工合成的甜味剂，它的安全性问题在美国引起了很大的争议。


    +   2. 糖精致癌的说法是错误的。2000年，美国国会撤销了对糖精的所有禁令。


    +   3. 虽然糖精变成了一种允许被使用的食品添加剂，但由于甜味剂的种类越来越多，现在糖精的使用已经比较罕见。


