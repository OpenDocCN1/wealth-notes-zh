  md: "# 第 10 章 Python 量化交易策略的编写\n\n在编辑股票策略页面，可以看到股票策略的 Python 代码。一个股票量化交易策略首先是导入聚宽函数库，具体代码如下：\n\
    \n```\nimport jqdata\n```\n\n接下来就是编写 4 个 Python 函数，分别是初始化函数（initialize）、开盘前运行函数（before_market_open）、开盘时运行函数（market_open）、收盘后运行函数（after_market_close）。\n\
    \n# 10.1.1 初始化函数\n\n初始化函数（initialize）的代码如下：\n\n```\ndef initialize(context):\n\
    \    # 设定沪深 300 作为基准\n    set_benchmark('000300.XSHG')\n    # 开启动态复权模式(真实价格)\n\
    \    set_option('use_real_price', True)\n    # 输出内容到日志 log.info()\n    log.info('初始函数开始运行且全局只运行一次')\n\
    \    ### 股票相关设定 ###\n    # 股票类每笔交易时的手续费是：买入时佣金万分之三，卖出时佣金万分之三加千分之一印花税，每笔交易佣金最低扣\
    \ 5 块钱\n    set_order_cost(OrderCost(close_tax=0.001, open_commission=0.0003,\
    \ close_commission=0.0003, min_commission=5), type='stock')\n    ## 运行函数（reference_security\
    \ 为运行时间的参考标的；传入的标的只做种类区分，因此传入'000300.XSHG'或'510300.XSHG'是一样的）\n    # 开盘前运行\n \
    \   run_daily(before_market_open, time='before_open', reference_security='000300.XSHG')\n\
    \    # 开盘时运行\n    run_daily(market_open, time='open', reference_security='000300.XSHG')\n\
    \    # 收盘后运行\n    run_daily(after_market_close, time='after_close', reference_security='000300.XSHG')\n\
    ```\n\ninitialize(context)，即初始化函数，在整个回测模拟或实盘中最开始执行一次，用于初始化全局变量。参数 context 是 Context\
    \ 对象，用来存放有当前账户或股票的持仓信息。\n\nset_benchmark('000300.XSHG')，是指设定沪深 300 作为基准。\n\nset_option('use_real_price',\
    \ True)，是指开启动态复权模式(真实价格)。复权就是对股价和成交量进行权息修复，股票的实际价值没有变，只是数量与价格变化了而已。例如，原来 20 元的股票，十送十之后为\
    \ 10 元，但实际还是相当于 20 元。从 K 线图上看这个价位似乎很低，但很可能就是一个历史高位。复权的作用是为了让股价连续，消除价格、指标的走势<|start|>变。"
