    # 16.1 MA 均线量化交易策略实战案例


    MA 指标是反映价格运行趋势的重要指标，其运行趋势一旦形成，将在一段时间内保持，趋势运行所形成的高点或低点又分别具有阻挡或支撑作用，因此均线指标所在的点位往往是十分重要的支撑位或阻力位，这就提供了买进或卖出的有利时机，均线系统的价值也正在于此。下面利用
    MA 均线指标来编写一个量化交易策略，实现当价格高于 5 日均线平均价格 1.1 时买入，当价格低于 5 日平均价格 0.9 时卖出。


