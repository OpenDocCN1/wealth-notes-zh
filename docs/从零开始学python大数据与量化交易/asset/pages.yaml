    # 13.5 量价指标函数


    量价指标是将市场中公众对股票追涨的热情进行量化。股市若形成一波多头行情，必须要有相应的活跃程度，也就是必须要有一定成交量，而这些成交量又必须要有散户公众大量参与；否则，没有散户帮助庄家接下股价上涨过程中的解套盘及获利盘，大多数庄家是不可能顺利拉高股价的。而且股价拉高后没有散户接盘，主力也
    就无法兑现炒作利润，它的炒作也就毫无意义了。


