    ```\n\n# 10.5 日志 log\n\n日志可以用来记录应用程序的状态、错误和信息消息，也经常作为调试程序的工具。下面讲解如何设定 log 级别及最常用的\
    \ log.info。\n\n# 10.5.1 设定 log 的级别\n\n设定 log 级别语法格式如下：\n\n```\nlog.set_level(name,\
    \ level)\n```\n\n设置不同种类的 log 的级别，低于这个级别的 log 不会输出。所有 log 的默认级别是 debug。\n\n各项参数意义如下。\n\
    \nname: 字符串，但 log 种类只有 3 种，分别是 order、history、strategy。order 表示调用 order 系列 API\
