  md: "# 从零开始学 Python 大数据与量化交易\n\n# 10.1 股票量化交易策略的组成\n\n在浏览器的地址栏中输入 https://www.joinquant.com，然后按\
    \ Enter 键，就进入聚宽 JoinQuant 量化交易平台的首页页面。在菜单栏中选择 “我的策略” → “我的策略” 命令，然后单击 “新建策略” 按钮，弹出下拉菜单，如图\
    \ 10.1 所示。\n\n![](img/261a0e647c121c3aa8af17bcacd0d7ae_222_0.png)\n\n# 图 10.1\
    \ “新建策略” 下拉菜单\n\n在下拉菜单中，选择 “股票策略” 命令，进入编辑股票策略页面，如图 10.2 所示。\n\n![](img/261a0e647c121c3aa8af17bcacd0d7ae_222_1.png)\n\
