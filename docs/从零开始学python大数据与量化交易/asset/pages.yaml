  md: "# 10.6.5 Context 对象\n\namount: 截至当前时刻的成交额。\nposition: 截至当前时刻的持仓量，只适用于期货 tick\
    \ 对象。\na1_v ~ a5_v: 卖一量到卖五量，对于期货，只有卖一量。\na1_p ~ a5_p: 卖一价到卖五价，对于期货，只有卖一量。\nb1_v\
    \ ~ b5_v: 买一量到买五量，对于期货，只有买一量。\nb1_p ~ b5_p: 买一价到买五价，对于期货，只有买一价。\n\nContext 对象，即量化交易策略回测对象，其常用属性如下。\n\
    \nsubportfolios: 当前单个操作仓位的资金和标的信息。\n\nportfolio: 账户信息，即 subportfolios 的汇总信息。\n\
    \ncurrent_dt: 当前单位时间的开始时间。如果是按天回测，那么开始时间是 hour = 9，minute = 30，second = microsecond\
    \ = 0；如果是按分钟回测，那么开始时间是 second = microsecond = 0。\n\nprevious_date: 前一个交易日。\n\n\
    universe: 查询 set_universe()设定的股票池，如[\"000001.XSHE\",\"600000.XSHG\"]。\n\nrun_params:\
    \ 表示此次运行的参数，有以下属性。\n\nstart_date: 回测/模拟开始日期。\n\nend_date: 回测/模拟结束日期。\n\ntype:\
    \ 运行方式。如果其值是 simple_backtest，表示回测是通过单击“编译运行”按钮运行；如果其值是 full_backtest，表示回测是通过单击“运行回测”按钮运行；如果其值是\
    \ sim_trade，表示模拟交易。\n\nfrequency: 运行频率，只能是 day、minute 或 tick。\n\n为了让从其他平台迁移过来的程序员更顺手地使用系统，对此对象也做了和\
    \ g 一样的处理。\n\n+   (1) 可以添加自己的变量，每次进程关闭时持久保存，进程重启时恢复。\n\n+   (2) 以“__”开头的变量不会被持久保存。\n\
    \n+   (3) 如果添加的变量与系统冲突，将覆盖系统变量，如果想恢复系统变量，就要删除自己的变量，示例代码如下：\n\n```\ndef handle_data(context,\
    \ data):\n    # 执行下面的语句之后，context.portfolio 的整数 1 将被覆盖并持久保存\n    context.portfolio\
