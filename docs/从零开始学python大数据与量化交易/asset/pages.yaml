    print("a & b 的值为: ",c)

    c = a | b       # 61 = 0011 1101

    print("a | b 的值为: ",c)

    c = a ^ b       # 49 = 0011 0001

    print("a ^ b 的值为: ",c)

    c = ~a          # -61 = 1100 0011

    print("~a 的值为: ",c)

    c = a << 2      # 240 = 1111 0000

    print("a << 2 的值为: ",c)

    c = a >> 2      # 15 = 0000 1111

    print("a >> 2 的值为: ",c)

    ```


