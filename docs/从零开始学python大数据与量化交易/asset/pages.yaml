  md: '# 4.4.4 集合的方法


    集合的方法是一种常用的数学方法，以集合为基础确定数学概念和处理数学问题的方法，有些方法适合所有集合，即不可变的集合和可变的集合；但有些方法只适合可变的集合。


    适合所有集合的方法名称及功能说明如表 4.6 所示。


    # 表 4.6 适合所有集合的方法名称及功能说明


    | 方法名称 | 功能说明 |

    |---|---|

    | a.issubset(b) | 如果 a 是 b 的子集，则返回 True；否则返回 False |

    | a.issuperset(b) | 如果 a 是 b 的超集，则返回 True；否则返回 False |

    | a.intersection(b) | 返回 a 和 b 的交集 |

    | a.union(b) | 返回 a 和 b 的并集 |

    | a.difference(b) | 返回一个新集合，该集合是集合 a 去除 b 元素部分后的 |

    | a.symmetric_difference(b) | 返回一个新集合，该集合是 a 或 b 的成员，但不是 a 和 b 共有的成员 |

    | a.copy() | 返回一个浅副本 |


    只适合可变的集合的方法名称及功能说明如表 4.7 所示。


    # 表 4.7 只适合可变的集合的方法名称及功能说明


    | 方法名称 | 功能说明 |

    |---|---|

    | a.add() | 在集合里添加新的对象 |

    | a.clear() | 清空集合里的所有对象 |

    | a.pop() | 删除 a 中的第一元素，并返回，为空时报错 |

    | a.remove(obj) | 在 a 中删除 obj 这个元素，没找到时报错 |

    | a.discard(obj) | 在 a 中删除 obj 这个元素，没找到时什么都不做，返回 None |

    | a.update(b) | 用 b 中的元素修改 a，此时 a 包含 a 或 b 的成员。相当于合并 |

    | a.intersection_update(b) | 用 a 和 b 的交集更新 a 集合 |

    | a.difference_update(b) | 从 a 中移除和 b 一样的元素 |

    | a.symmetric_difference(b) | 将 a 修改成 a 和 b 的对称差分 |


    集合的方法示例如下。


    单击“开始”菜单，打开 Python 3.6.5 Shell 软件，然后在菜单栏中选择 File→New File 命令，创建一个 Python 文件，并命名为
    Python4-17.py，然后输入以下代码：


    ```

    thisset = set(("Google","Runoob","Taobao"))

    ```'
