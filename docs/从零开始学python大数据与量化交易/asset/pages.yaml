- pgno: 326
  md: '# 14.5.1 Alpha（阿尔法）


    投资中面临着系统性风险（Beta）和非系统性风险（Alpha），Alpha 是投资者获得与市场波动无关的回报。比如，投资者获得了 15%的回报，其基准获得了
    10%的回报，那么 Alpha 或者价值增值的一部分就是 5%。


    Alpha 的计算公式为：


    ```

    Alpha = Rₚ − [R_f + βₚ(R_m − R_f)]

    ```


    式中：

    Rₚ——策略年化收益率；

    Rₘ——基准年化收益率；

    R_f——无风险利率（默认为 0.04）；

    βₚ——策略 beta 值。


    在回测详情页面中，单击左侧列表框中的 Alpha，就可以看到 MACD 指标量化策略的 Alpha 信息，如图 14.17 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_326_0.png)


    > 提醒 如果 Alpha>0，策略相对于风险获得了超额收益；Alpha=0，策略相对于风险获得了适当收益；Alpha<0，策略相对于风险获得了较少收益。


    # 14.5.2 Beta（贝塔）


    Beta 表示投资的系统性风险，反映了策略对大盘变化的敏感性。例如，一个策略'
