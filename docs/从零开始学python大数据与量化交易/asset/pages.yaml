  md: "# 第 13 章 Python 量化择时的技术指标函数\n\n鬼道线指标 GDX 是一种用技术手段和经验判断来决定买卖股票的方法。该公式对趋势线做了平滑和修正处理，更精确地反映了股价运行规律。\n\
