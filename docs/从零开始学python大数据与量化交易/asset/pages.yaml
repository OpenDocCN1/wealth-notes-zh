    为图像添加图题示例如下。


    成功登录聚宽 JoinQuant 量化交易平台后，在菜单栏中选择“我的策略”→“投资研究”命令，打开“投资研究”页面。双击 matplotlib 文件夹，然后单击“新建”按钮，在弹出的下拉菜单中单击
    Python3，新建一个 Python3 文件，并命名为“为图像添加图题”，然后输入以下代码：


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    x = np.arange(1,25)

    y = 6 * x + 11

    fig, ax = plt.subplots()

    ax.plot(x, x**2, label="y = x**2")

