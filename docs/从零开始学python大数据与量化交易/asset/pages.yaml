- pgno: 160
  md: '# 7.1 初识 Numpy 包


    Numpy 代表 Numeric Python，是一个由多维数组对象和用于处理数组的例程集合组成的包。


    Numeric，即 Numpy 的前身，是由 Jim Hugunin 开发的。他也开发了另一个包 Numarray，从而拥有一些额外的功能。2005 年，Travis
    Oliphant 通过将 Numarray 的功能集成到 Numeric 包中来创建 Numpy 包。


    Numpy 通常与 Scipy（Scientific Python）和 Matplotlib（绘图库）一起使用。这种组合广泛应用于替代 Matlab（Matlab
    是一个流行的技术计算平台）。但是，Python 作为 Matlab 的替代方案，现在被视为一种更加现代和完整的编程语言。


    另外，Numpy 是开源的，这是它的一个额外的优势。


    # 7.2 ndarray 数组基础


    Pyhton 中用列表保存一组值，可将列表当成数组使用。此外，Python 有 array 模块，但它不支持多维数组，无论是列表还是 array 模块，都没有科学运算函数，不适合做矩阵等科学计算。因此，Numpy
    没有使用 Python 本身的数组机制，而是提供了 ndarray 数组对象，该对象不但能方便地存取数组，而且拥有丰富的数组计算函数，如向量的加法、减法、乘法等。


    使用 ndarray 数组，首先需要导入 Numpy 函数包。可以直接导入 Numpy 函数包，也可以在导入 Numpy 函数包时指定导入库的别名，代码如下：


    ```

    import numpy      #直接导入 Numpy 函数包

    import numpy as np    #导入 Numpy 函数包并指定导入包的别名

    ```


    # 7.2.1 创建 Numpy 数组


    创建 Numpy 数组是进行数组计算的先决条件，可以通过 array()函数定义数组实例对象，其参数为 Python 的序列对象（如列表）。如果想定义多维数组，则传递多层嵌套的序列，代码如下：


    ```

    Numpy1 = np.array([[10,-8,10.5],[-4,6.0,9.6]])

    ```


