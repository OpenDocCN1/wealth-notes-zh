  md: '# 前 言


    说起量化交易，你的脑海里是否会浮现这样一幅画面：一间采用高科技搭建起来的交易室，上百台计算机显示屏飞速跑着各种数学模型，投资交易以微秒计的速度高深莫测地计算着？诚然，在普通投资者眼里，量化交易可能意味着复杂模型、高频交易、专业程序，且仿佛离我们很远。这些固然是量化交易的特征，但其实离我们并不遥远，事实上，我们每天都不自觉地在使用着量化。比如当你用某个或某些条件去判断是否要买卖某只股票或者如何买卖时，就是量化思维的一种表现。


    量化投资在海外的发展已有 30 多年的历史，其投资业绩稳定，市场规模和份额不断扩大，得到了越来越多投资者的认可，并且量化对冲基金已经成为资管行业的翘楚。国内的量化交易起步较晚，量化交易在证券市场占比还不足
    5%。随着科技的进步，中国的量化交易市场正在快速发展。


    当前，我国的量化交易主要应用在商品期货上。随着股指期货的上市，期货市场和证券市场实现了真正意义上的互动，投资者不仅可以在期货市场上进行交易，同时还可以在期货与股票之间进行套利交易。利用量化交易对股指期货进行操作将会是投资者（尤其是机构投资者）一个重要的发展方向。


    # 本书特点


    | 特 点 | 说 明 |

    |---|---|

    | 16 章实战精讲 | 本书体系完善，由浅入深地对 Python 大数据与量化交易进行了 16 章专题精讲，其内容涵盖了量化交易的基础知识、聚宽 JoinQuant
    量化交易平台、Python 开发环境及配置、Python 的基本语法及流程控制、Python 的特征数据类型、Python 的内置函数与自定义用户函数、Python
    的面向对象编程、数据分析的 Numpy 包、数据分析的 Pandas 包、数据可视化的 Matplotlib 包、Python 量化交易策略的编写、Python
    获取数据函数、Python 基本面量化选股、Python 量化择时的技术指标函数、Python 量化交易策略的回测技巧、Python 量化交易策略的因子分析技巧、Python
    量化交易策略的实战案例等 |

    | 108 个知识点 | 本书结合 Python 大数据与量化交易的实战应用，讲解了 108 个应用技巧，其内容涵盖了格式化字符串的输出、Input（）函数、算术运算符、赋值运算符、位运算符、关系运算符、嵌套
    If 语句、while 循环、 |'
