- pgno: 52
  md: '# 2.1 初识 Python 语言


    Python 是一个有条理的、强大的面向对象的程序设计语言。虽然运行速度比不上 Java、C++，更比不上传说中的速度之王 C 语言。但完成同一个任务，C
    语言要写 1000 行代码，Java 只需要写 100 行代码，而 Python 可能只要 20 行代码。


    # 2.1.1 Python 的历史由来


    Python 的创始人是 Guido van Rossum（吉多·范·罗苏姆）。1989 年圣诞节期间，在阿姆斯特丹，Guido 为了打发圣诞节的无趣，决心开发一个新的脚本解释程序，作为
    ABC 语言的一种继承。之所以选中 Python（“大蟒蛇”的意思）作为该编程语言的名字，是因为他是一个叫 Monty Python 的喜剧团体的爱好者。


    ABC 是由 Guido 参加设计的一种教学语言。就 Guido 本人看来，ABC 这种语言非常优美和强大，是专门为非专业程序员设计的。但是 ABC 语言并没有成功，究其原因，Guido
    认为是其非开放造成的。Guido 决心在 Python 中避免这一错误。同时，他还想实现在 ABC 中闪现过但未曾实现的东西。


    就这样，Python 在 Guido 手中诞生了。可以说，Python 是从 ABC 发展起来，主要受到了 Modula-3（另一种相当优美且强大的语言，为小型团体所设计的）的影响。并且结合了
    Unix Shell 和 C 的习惯。


    Python 已经成为最受欢迎的程序设计语言之一。2011 年 1 月，它被 TIOBE 编程语言排行榜评为 2010 年度语言。自从 2004 年以后，Python
    的使用率呈线性增长。


    由于 Python 语言的简洁性、易读性以及可扩展性，在国外用 Python 做科学计算的研究机构日益增多，一些知名大学已经采用 Python 来教授程序设计课程，如卡耐基·梅隆大学的编程基础、麻省理工学院的计算机科学及编程导论就使用
    Python 语言讲授。众多开源的科学计算软件包都提供了 Python 的调用接口，如著名的计算机视觉库 OpenCV、三维可视化库 VTK、医学图像处理库
    ITK。而 Python 专用的科学计算扩展库就更多了，如 3 个十分经典的科学计算扩展库——NumPy、SciPy 和 Matplotlib，它们分别为
    Python 提供了快速数组处理、数值运算以及绘图功能。因此 Python 语言及其众多的扩展库所构成的开发环境十分适合工程技术、科研人员处理实验数据、制作图表，甚至开发科学计算应用程序。


