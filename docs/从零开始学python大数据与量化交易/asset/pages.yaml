    # 11.3  查询一个交易日股票财务数据的 get_fundamentals()函数


    get_fundamentals()函数可以查询一只股票或多只股票的财务数据，其语法格式如下：


    ```

    get_fundamentals(query_object, date=None, statDate=None)

    ```


    # 11.3.1  各项参数的意义


    get_fundamentals()函数共有 3 项，各项参数意义如下。


    +   1. query_object

    参数 query_object 是一个 sqlalchemy.orm.query.Query 对象，可以通过全局的 query 函数获取 Query 对象。


    +   2. date

    参数 date 是查询日期，可以是一个字符串(格式类似 "2018-4-24")或者 datetime.date/datetime.datetime 对象。可以是
    None，使用默认日期，这个默认日期在回测和研究模块上有点差别。

    回测模块：默认值会随着回测日期变化而变化，等于 context.current_dt 的前一天(实际生活中只能看到前一天的财报和市值数据，所以要用前一天)。

    研究模块：使用平台财务数据的最新日期，一般是昨天。

    需要注意的是，如果传入的 date 不是交易日，则使用这个日期之前的最近一个交易日。'
