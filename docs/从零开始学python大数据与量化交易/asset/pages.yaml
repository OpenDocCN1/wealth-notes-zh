    # 10.2.3 设置滑点函数


    设置滑点函数的语法格式如下：


    ```

    set_slippage(object)

    ```


    设定滑点，回测或模拟时有效。当投资者下单后，真实的成交价格与下单时预期的价格总会有一定偏差，因此投资者加入了滑点模式可以更好地模拟真实市场的表现。需要注意的是，当前只支持固定滑点。


    当投资者使用固定滑点时，投资者下单的多少并不会影响最后的成交价格，只需要指定一个价差。当投资者下达一个买单指令时，成交的价格等于当时（执行 order 函数所在的单位时间）的平均价格加上价差的一半；当投资者下达一个卖出指令时，卖出的价格等于当时的平均价格减去价差的一半。价差可以设定为一个固定值或者按照百分比设定。'
