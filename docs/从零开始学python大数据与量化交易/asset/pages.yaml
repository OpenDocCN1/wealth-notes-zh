    # 5.2.2 随机数函数


    随机数可以用于数学、游戏、安全等领域中，还经常被嵌入算法中，用以提高算法效率，并提高程序的安全性。随机数函数的名称及功能说明如表 5.2 所示。


    # 表 5.2 随机数函数的名称及功能说明


    | 函数名称 | 功能说明 |

    |---|---|

    | choice(seq) | 从序列的元素中随机挑选一个元素 |

    | randrange ([start, ] stop [, step]) | 从指定范围内，按指定基数递增的集合中获取一个随机数，基数默认为 1 |

    | random() | 随机生成下一个实数，它在[0, 1)范围内 |

    | round(x [, n]) | 返回浮点数 x 的四舍五入值，如给出 n 值，则代表舍入小数点后的位数 |'
