  md: '（1）易于学习。Python 有相对较少的关键字，结构简单，和一个明确定义的语法，学习起来更加简单。


    （2）易于阅读。Python 代码定义得更清晰。


    （3）易于维护。Python 的成功在于它的源代码是相当容易维护的。


    （4）一个广泛的标准库。Python 的最大优势之一是丰富的库，跨平台的，在 UNIX、Windows 和 Macintosh 中兼容很好。


    （5）互动模式。互动模式的支持，可以从终端输入执行代码并获得结果的语言，互动的测试和调试代码片段。


    （6）可移植。基于其开放源代码的特性，Python 已经被移植（也就是使其工作）到许多平台。


    （7）可扩展。如果需要一段运行很快的关键代码，或者想要编写一些不愿开放的算法，可以使用 C 或 C++完成那部分程序，然后从你的 Python 程序中调用。


    （8）数据库。Python 提供所有主要的商业数据库的接口。


    （9）GUI 编程。Python 支持 GUI 可以创建和移植到许多系统调用。


    （10）可嵌入。你可以将 Python 嵌入 C/C++程序，让你的程序的用户获得“脚本化”的能力。


    # 2.1.3 Python 的应用


    Python 的应用很广泛，主要应用在以下几个方面。


    （1）系统编程。Python 可提供 API（Application Programming Interface，应用程序编程接口），能方便进行系统维护和管理，Linux
    下标志性语言之一，是很多系统管理员理想的编程工具。


    （2）图形处理。Python 有 PIL、Tkinter 等图形库支持，能方便进行图形处理。


    （3）数学处理。NumPy 扩展提供大量与许多标准数学库的接口。


    （4）文本处理。Python 提供的 re 模块能支持正则表达式，还提供 SGML、XML 分析模块，许多程序员利用 Python 进行 XML 程序的开发。


    （5）数据库编程。程序员可通过遵循 Python DB-API（数据库应用程序编程接口）规范的模块与 Microsoft SQL Server、Oracle、Sybase、DB2、MySQL、SQLite
    等数据库通信。Python 自带一个 Gadfly 模块，提供了一个完整的 SQL 环境。


    （6）网络编程。Python 提供丰富的模块支持 Sockets 编程，能方便、快速地开发分布式应用程序。很多大规模软件开发计划如 Zope、Mnet、BitTorrent、Google
    都在广泛地使用它。


    （7）Web 编程。Python 可作为 Web 应用程序的开发语言，支持最新的 XML 技术。'
