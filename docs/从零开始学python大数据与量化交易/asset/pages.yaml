    # 定义股票池列表

    security_list1 = ''000001.XSHE''

    # 计算并输出 security_list1 的 CCI 值

    CCI1 = CCI(security_list1, check_date=''2018-08-01'', N=14)

    print("平安银行的顺势指标 CCI 的值：",CCI1[security_list1])

