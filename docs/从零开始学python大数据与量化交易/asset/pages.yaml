    # 7.2.6 Numpy 数组复制


    Numpy 数组复制分两种，分别是浅复制和深复制。


    浅复制通过数组变量的复制完成，只复制数组的引用，这样对浅复制数组中的元素进行修改时，原数组中对应的元素也会被修改。


    深复制使用数组对象的 copy 方法完成，是对储存内存进行复制。这样对深复制数组中的元素进行修改时，原数组中对应的元素不会改变。


    Numpy 数组复制示例如下。


    成功登录 JoinQuant（聚宽）量化交易平台后，在菜单栏中选择“我的策略”→“投资研究”命令，打开“投资研究”页面。然后单击“新建”按钮，在弹出的下拉菜单中单击
    Python3 命令，就创建一个 Python3 文件，并命名为“Numpy 数组复制”。


    在单元格中输入代码如下：


    ```

    import numpy as np

    numpy1 = np.array([8,6,5.2])

    numpy2 = numpy1

    print("浅复制数组中的数据：",numpy2)

    numpy2[1] = -18.6    #修改浅复制数组中的数据

    print("修改浅复制数组中的数据后：",numpy2)

    print("原数组 numpy1 中的数据也被修改了：",numpy1)

    print()

    numpy3 = np.zeros(3)

    numpy4 = numpy3.copy()

    print("深复制数组中的数据：",numpy4)

    numpy4[1] = -18.6    #修改深复制数组中的数据

    ```'
