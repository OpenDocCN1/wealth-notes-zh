  md: "# 从零开始学 Python 大数据与量化交易\n\n# 3.7 Python 的代码格式\n\nPython 是一门新兴的编程语言，在格式上与其他传统编程语言虽然相差不大，但也有不同之处，特别是代码缩进。下面具体讲解\
    \ Python 的代码格式。\n\n# 3.7.1 代码缩进\n\nPython 最具特色的就是使用缩进来表示代码块，不需要使用大括号{}。缩进的空格数是可变的，但是同一个代码块的语句必须包含相同的缩进空格数。示例如下：\n\
    \n```\nif True:\n    print (\"正确\")\nelse:\n    print (\"错误\")\n```\n\n以下代码最后一行语句缩进数的空格数不一致，会导致运行错误：\n\
