    # 8.3.2 数据的查看


    下面利用 get_price() 函数获得股票数据，得到的数据是 DataFrame 对象。


    get_price() 函数的语法格式如下：


    ```

    get_price(security, start_date=None, end_date=None, frequency=''daily'', fields=None,
    skip_paused=False, fq=''pre'', count=None)

    ```


    get_price() 函数可以按天或者按分钟获取一只或者多只股票的行情数据，各项参数意义如下。


    security: 一只股票代码或者一只股票代码的 list。


    start_date: 开始时间，与参数 count 二选一，不可同时使用。需要注意的是，如果参数 count 和参数 start_date 都没有设置，则
    start_date 生效值是 2015-01-01。如果取分钟数据时，时间可以精确到分钟，如传入 datetime.datetime(2015, 1, 1,
    10, 0, 0) 或者 ''2015-01-01 10:00:00''。


    > 提醒 当取分钟数据时，如果只传入日期，则日内时间是当日的 00:00:00。当取天数据时，则传入的日内时间会被忽略。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 从零开始学 Python 大数据与量化交易


    end_date：结束时间，默认是 2015-12-31，包含此日期。需要注意的是，当取分钟数据时，如果 end_date 只有日期，则日内时间等同于 00:00:00，所以返回的数据是不包括
    end_date 这一天的。


    frequency：单位时间长度，几天或者几分钟，默认为 daily，即表示 1 天。现在支持"Xd""Xm""daily"（表示 1 天）"minute"（表示
    1 分钟），X 是一个正整数，分别表示 X 天和 X 分钟。需要注意的是，当 X > 1 时，fields 只支持["open""close""high""low"
    "volume""money"]这几个标准字段。


    Fields：字符串 list，选择要获取的行情数据字段，默认是 None（表示["open"、"close"、"high"、"low"、"volume"、"money"]这几个标准字段）。参数
    Fields 支持 SecurityUnitData 里面的所有基本属性，包含：["open", "close", "low", "high", "volume",
    "money", "factor", "high_limit", "low_limit", "avg", "pre_close", "paused" ]。


    skip_paused：是否跳过不交易日期（包括停牌、未上市或者退市后的日期，如果不跳过，停牌时会使用停牌前的数据填充。上市前或者退市后数据都为 nan。需要注意的是，该参数默认为
    False，即不跳过不交易日期。如果该参数是 True 时，只能取一只股票的信息。


    fq：复权选项。参数值设为 “pre”，表示前复权，为默认设置；参数值设为 None，表示不复权，返回实际价格；参数值设为 “post”，表示后复权。


    count：与 start_date 二选一，不可同时使用。参数 count 表示数量，返回的结果集的行数，即表示获取 end_date 之前几个 frequency
    的数据。


