  md: '# 9.7 设置字体格式


    在上述例子中，我们会发现 x 轴、y 轴及标题标签都比较小，下面就来讲解如何利用代码实现字体格式的设置。


    设置字体格式示例如下。


    成功登录聚宽 JoinQuant 量化交易平台后，在菜单栏中选择“我的策略”→“投资研究”命令，打开“投资研究”页面。双击 matplotlib 文件夹，然后单击“新建”按钮，在弹出的下拉菜单中单击
    Python3，新建一个 Python3 文件，并命名为“设置字体格式”，然后输入以下代码：


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    # 更新 matplotlib 的布局参数

    matplotlib.rcParams.update({''font.size'': 18, ''font.family'': ''serif''})

    x = np.arange(1,25)

    y = 6*x + 11

    fig, ax = plt.subplots()

    ax.plot(x, x**2, label=r''$y = \alpha^2$'')

    ax.plot(x, x**3, label=r''$y = \alpha^3$'')

    ax.legend(loc=2) # 左上角

    ax.set_xlabel(r''$\alpha$'')

    ax.set_ylabel(r''$y$'')

    ax.set_title(''设置字体格式'')

    ```


    在这里，利用 matplotlib.rcParams.update()更新了字体的大小及字体类型。


    在 LaTeX 中经常用反斜杠符号，如用\alpha 来产生符号 α。但是反斜杠在 Python 中已经有别的含义（转义码字符）。为了避免 Python 和
    LaTeX 代码混淆，采用“原始”字符串。原始字符串带有前缀“r”，如 r"\alpha"或者 r''\alpha'' 而不是 "\alpha" 或''\alpha''。


    单击工具栏中的 运行 按钮，运行结果如图 9.9 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_212_0.png)


    图 9.9 设置字体格式示例的运行结果'
