    # 15.3.4 换手分析


    换手分析，即换手率分析。因子的换手率是在不同的时间周期下，观察因子各分位中个股的进出情况。例如，某因子第一分位持有的股票数量为 30 只，一天后有一只发生变动，换手率为：1÷30×100%
    = 3.33%。


    因子分位数换手率的价值体现在两个方面：分别是因子稳定性的体现和衡量交易成本，如图 15.13 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_343_1.png)


    图 15.13 因子换手率分析的价值


    +   1. 因子稳定性的体现

    换手率低的因子，因子值在时间序列层面的持续性更好。


    +   2. 衡量交易成本

    在实际的交易过程中，假设要维护投资组合的因子表现恒定，对于高换手率因子，则需要进行更多的交易，交易中的税费和滑点也会吞噬掉部分利润。


    从单击左侧的“换手分析”，可以看到 1 天换手率和 5 天换手率，如图 15.14 所示。'
