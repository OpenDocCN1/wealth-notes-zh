- pgno: 327
  md: '# 第 14 章 Python 量化交易策略的回测技巧


    的 Beta 为 1.5，则大盘涨 1% 的时候，策略可能涨 1.5%，反之亦然；如果一个策略的 Beta 为 -1.5，说明大盘涨 1% 的时候，策略可能跌
    1.5%，反之亦然。


    Beta 的计算公式如下：


    Beta=βₚ = Cov(Dₚ, Dₘ) / Var(Dₘ)


    式中：


    +   Dₚ——策略每日收益；


    +   Dₘ——基准每日收益；


    +   Cov(Dₚ,Dₘ)——策略每日收益与基准每日收益的协方差；


    +   Var(Dₘ)——基准每日收益的方差。


    当 Beta<0，投资组合和基准的走向通常反方向，如空头头寸类。如果 Beta=0，投资组合和基准的走向没有相关性，如固定收益类。0<Beta<1，投资组合和基准的走向相同，但是比基准的移动幅度更小。如果
    Beta=1，投资组合和基准的走向相同，并且和基准的移动幅度贴近。如果 Beta>1，投资组合和基准的走向相同，但是比基准的移动幅度更大。


    在回测详情页面中，单击左侧列表框中的 Beta，就可以看到 MACD 指标量化策略的 Beta 信息，如图 14.18 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_327_0.png)


    图 14.18 MACD 指标量化策略的 Beta 信息


