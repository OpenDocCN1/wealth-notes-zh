  md: "# 4.1 列表\n\n列表是 Python 程序设计中最常用的数据类型。列表是一个可变序列，序列中的每个元素都分配一个数字，即它的位置或索引。第一个索引是\
    \ 0，第二个索引是 1，以此类推。\n\n# 4.1.1 列表的创建\n\n在 Python 语言中，是用中括号（[]）来解析列表的。列表中的元素可以是数学、字符串、列表、元组等。创建一个列表，只要把逗号分隔的不同数据项使用中括号括起来即可，具体如下：\n\
    \n```\nlist1 = [\"苹果\",\"香蕉\", 2007, 2016, 2018]\nlist2 = [1, 2, 3, 4, 5]\nlist3\
    \ = [\"x\",\"y\",\"z\"]\n```\n\n# 4.1.2 3 种方法访问列表中的值\n\n可以使用下标索引来访问列表中的值，也可以使用中括号的形式截取字符，还可以利用\
    \ for 循环语句来遍历列表中的值。\n\n利用 3 种方法访问列表中的值示例如下。\n\n单击 “开始” 菜单，打开 Python 3.6.5 Shell\
    \ 软件，然后在菜单栏中选择 File→New File 命令，创建一个 Python 文件，并命名为 Python4-1.py，然后输入以下代码：\n\n\
    ```\nlist1 = [\"苹果\",\"香蕉\", 2007, 2016, 2018]\nprint(\"使用下标索引来访问列表中的值:\")\nprint(\"\
    列表中的第一个值，list1[0]:\", list1[0])\nprint(\"列表中的第三个值，list1[2]:\", list1[2])\nprint()\n\
    print(\"使用中括号的形式截取字符:\")\nprint(\"列表中的第三和第四个值，list1[2:4]:\", list1[2:4])\nprint()\n\
    print(\"利用 for 循环语句来遍历列表中的值:\")\nfor i in list1:\n    print(i)\n```\n\n在菜单栏中选择\
    \ Run→Run Module 命令或按键盘上的 F5 键，就可以运行程序代码，结果如图 4.1 所示。"
