    \ break 语句可以提前结束内层循环。\n\n需要注意的是，如何从 for 或 while 循环中终止，任何对应的循环 else 块将不再执行。\n\n\
    break 语句示例如下。\n\n单击 “开始” 菜单，打开 Python 3.6.5 Shell 软件，然后在菜单栏中选择 File→New File 命令，创建一个\
