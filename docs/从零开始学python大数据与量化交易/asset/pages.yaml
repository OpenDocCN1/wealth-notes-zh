  md: '# 9.10 绘制柱状图


    使用 hist()函数可以绘制柱状图，下面举例讲解。


    成功登录聚宽 JoinQuant 量化交易平台后，在菜单栏中选择 “我的策略” → “投资研究” 命令，打开 “投资研究” 页面。双击 matplotlib
    文件夹，然后单击 “新建” 按钮，在弹出的下拉菜单中单击 Python3，新建一个 Python3 文件，并命名为 “绘制柱状图”，然后输入以下代码：


    ```

    import matplotlib.pyplot as plt

    matplotlib.rcParams.update({''font.size'': 12, ''font.family'': ''serif''})

    n = np.random.randn(100000)

    fig, axes = plt.subplots(1, 2, figsize=(12,4))

    axes[0].hist(n)

    axes[0].set_title("柱状图")

    axes[0].set_xlim((min(n), max(n)))

    axes[1].hist(n, cumulative=True, bins=50)

    axes[1].set_title("累积详细柱状图")

    axes[1].set_xlim((min(n), max(n)))

    ```


    hist()函数参数中，参数 n 表示柱子的值；参数 cumulative 表示是否累积，如果参数值为 True，则累积，否则不累积；参数 bins 表示柱子的宽度。


    单击工具栏中的 N运行 按钮，运行结果如图 9.12 所示。


