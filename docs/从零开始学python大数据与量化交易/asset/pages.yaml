  md: '# 13.2.1 MACD 指标函数


    MACD 指标，即平滑异同平均线。在 Python 量化交易策略中，平滑异同平均线 MACD 的语法格式如下：


    ```

    MACD(security_list, check_date, SHORT = 12, LONG = 26, MID = 9)

    ```


    各参数意义如下。


    security_list: 股票列表，可以是一只股票，也可是多只股票。


    check_date: 要查询数据的日期。


    SHORT: 统计的天数 SHORT。


    LONG: 统计的天数 LONG。


    MID: 统计的天数 MID。


    返回 DIF、DEA 和 MACD 的值，返回类型为字典(dict): 键(key)为股票代码，值(value)为数据。


    平滑异同平均线 MACD 用法具体如下。


    +   （1）DIFF、DEA 均为正，DIFF 向上突破 DEA，买入信号。 （2）DIFF、DEA 均为负，DIFF 向下跌破 DEA，卖出信号。 （3）DEA
    线与 K 线发生背离，是行情反转信号。 （4）分析 MACD 柱状线，由红变绿(正变负)，卖出信号；由绿变红，买入信号。


    > 提醒 DIFF 线是指收盘价短期、长期指数平滑移动平均线间的差；DEA 线是指 DIFF 线的 M 日指数平滑移动平均线；MACD 线是指 DIFF 线与
    DEA 线的差，用彩色柱状线表示。


    MACD 指标函数示例如下。


    成功登录聚宽 JoinQuant 量化交易平台后，在菜单栏中选择“我的策略”→“投资研究”命令，打开“投资研究”页面。单击“新建”按钮，弹出下拉菜单，然后单击“文件夹”命令，就会新建一个文件夹，然后命名为“量化择时”。


    再单击“新建”按钮，在弹出的下拉菜单中单击 Python3 命令，新建一个 Python3 文件，并命名为“MACD 指标函数”，然后输入以下代码：


    ```

    #导入 technical_analysis 库

    from jqllib.technical_analysis import *

    # 定义股票池列表

    security_list1 = ''002797.XSHE''

    # 计算并输出 security_list1 的 MACD 值

    macd_diff, macd_dea, macd_macd = MACD(security_list1,check_date=''2018-08-01'',
    SHORT = 12, LONG = 26, MID = 9)

    ```'
