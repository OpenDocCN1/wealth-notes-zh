  md: '# 从零开始学 Python 大数据与量化交易


    # 3. statDate


    参数 statDate 是一个字符串，表示财报统计的季度或者年份，有两种格式，具体如下。


    季度：格式是年 + "q" + 季度序号，如"2018q1"、"2017q4"。


    年份：格式就是年份的数字，如"2017"、"2018"。


    > 提醒 date 和 statDate 参数只能传入一个。传入 date 时，查询指定日期 date 收盘后所能看到的最近的数据；传入 statDate
    时，查询 statDate 指定的季度或者年份的财务数据。当两个参数都没有传入时，相当于使用 date 参数，即使用默认日期。


    get_fundamentals () 函数的返回值是一个 pandas.DataFrame，每一行对应数据库返回的每一行，列索引是你查询的所有字段。


    需要注意的是，为了防止返回数据量过大，每次最多返回 10000 行。另外，当相关股票上市前、退市后，财务数据返回各字段为空。


    # 11.3.2  get_fundamentals () 函数的应用实例


    下面显示平安银行（000001）2018 年 4 月 12 日的财务数据信息。创建一个 Python3 文件，然后输入以下代码：


    ```

    import pandas as pd

