  md: "# 6.4.1 变量作用域\n\n变量的作用域决定了在哪一部分程序可以访问哪个特定的变量名称。Python 的变量作用域共有 4 种，分别是局部作用域（Local）、闭包函数外的函数中（Enclosing）、全局作用域（Global）、内建作用域（Built-in）。\n\
    \n在 Python 程序设计中，变量以局部作用域（Local）、闭包函数外的函数中（Enclosing）、全局作用域（Global）、内建作用域（Built-in）的规则查找，即在局部找不到，便会去局部外的局部找（如闭包），再找不到就会去全局找，再者去内建中找，具体代码如下：\n\
    \n```\nx = int(2.9)  # 内建作用域\ng_count = 0  # 全局作用域\ndef outer():\n    o_count\
    \ = 1  # 闭包函数外的函数中\n    def inner():\n        i_count = 2  # 局部作用域\n```\n\n在 Python\
    \ 程序设计中，只有模块（module）、类（class）以及函数（def、lambda）才会引入新的作用域，其他的代码块（如 if/elif/else/、for/while\
    \ 等）是不会引入新的作用域的，也就是说，这些语句内定义的变量，外部也可以访问。\n\n单击“开始”菜单，打开 Python 3.6.5 Shell 软件，然后在菜单栏中选择\
    \ File→New File 命令，创建一个 Python 文件，并命名为 Python6-6.py，然后输入以下代码：\n\n```\nif True:\n\
    \    msg1=\"我是 if 语句中的变量，外部是可以访问的！\"\nelse:\n    msg2=\"我也是一个代码块变量\"\nprint(msg1)\
    \    #可以 lưỡng接调用 if 语句中的变量\n```\n\n由于 if 语句的条件成立，因此 msg1 已指向“我是 if 语句中的变量！”，又因这个变量已存在，所以可以直接利用\
    \ print()函数输出。需要注意的是，由于 if 语句的条件成立，就不会运行 else 中的语句，因此 msg2 没有指向“我也是一个代码块变量”，所以不能利用\
    \ print()函数输出 msg2 变量。\n\n在菜单栏中选择 Run→Run Module 命令或按键盘上的 F5 键，就可以看到运行程序代码，结果如图\
    \ 6.15 所示。\n\n需要注意的是，如果是自定义函数中的变量，由于是局部变量，所以外部不能访问。单击“开始”菜单，打开 Python 3.6.5 Shell\
    \ 软件，然后选\n\n![](img/261a0e647c121c3aa8af17bcacd0d7ae_154_0.png)\n\n# 图 6.15 if\
    \ 语句中的变量示例的运行结果"
