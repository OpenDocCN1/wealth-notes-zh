    3. dependencies

    dependencies 是用来设置依赖的基础因子名称。


    在因子分析中，可以使用的基础因子很多，如价量因子、财务数据因子、行业因子、概念因子、指数因子、资金流因子，如图 15.1 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_335_0.png)


