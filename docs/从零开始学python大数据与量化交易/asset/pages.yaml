    # 12.2.7 销售毛利率选股


    销售毛利率是毛利占销售净值的百分比，通常称为毛利率。毛利是销售净收入与产品成本的差，其计算公式如下：


    销售毛利率 = (销售净收入 - 产品成本) ÷ 销售净收入 × 100%


    销售毛利率是上市公司的重要经营指标，能反映公司产品的竞争力和获利潜力。它反映了企业产品销售的初始获利能力，是企业净利润的起点，没有足够高的毛利率便不能形成较大的盈利。


    与同行业比较，如果公司的毛利率显著高于同业水平，说明公司产品附加值高，产品定价高，或与同行比较公司存在成本上的优势，有竞争力。


    与历史比较，如果公司的毛利率显著提高，则可能是公司所在行业处于复苏时期，产品价格大幅上升。在这种情况下，投资者需考虑这种价格的上升是否能持续，公司将来的盈利能力是否有保证；相反，如果公司毛利率显著降低，则可能是公司所在行业竞争激烈，毛利率下降往往伴随着价格战的爆发或成本的失控，这种情况预示产品盈利能力的下降。'
