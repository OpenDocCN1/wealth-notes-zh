  md: '# 3.1 Python 的基本数据类型


    Python 的数据类型只有 6 个类别，分别是数值、字符串、列表、元组、集合、字典。相对于 C 语言来讲，Python 的数据类型很少，但 Python
    该有的功能一个也不少。即使 C 语言的代表作——链表和二叉树，Python 同样可以轻松应对。下面先来讲解 Python 的基本数据类型，即数值和字符串。


    # 3.1.1 数值类型


    Python 支持 3 种不同的数值类型，分别是整型（int）、浮点型（floating point real values）、复数（complex numbers），如图
    3.1 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_72_0.png)


    +   1. 整型（int）

    整型（int），通常称为整数，是正整数或负整数，不带小数点。Python3 整型是没有大小限制的，可以当作长整型（Long）类型使用，所以 Python3
    没有 Python2 的长整型（Long）类型。需要注意的是，可以使用十六进制和八进制来代表整数。


    +   2. 浮点型（floating point real values）

    浮点型由整数部分与小数部分组成，浮点型也可以使用科学计数法表示（2.5E+02 = 2.5×10² = 250）。


    +   3. 复数（complex numbers）

    复数由实数部分和虚数部分构成，可以用 a+ bj 或者 complex（a, b）表示，复数的实部 a 和虚部 b 都是浮点型。


    Python 的数值类型如表 3.1 所示。


    # 表 3.1 Python 的数值类型


    | int   | float   | complex |

    |-------|---------|---------|

    | 60    | 0.3     | 3.14j   |

    | -100  | -11.8   | -25j    |

    | 0o60  | 2.5E+2  | 3+4j    |'
