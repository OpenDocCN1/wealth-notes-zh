- pgno: 208
  md: '# 9.4.1 subplot()的各参数意义


    nrows 参数：subplot 的行数。


    ncols 参数：subplot 的列数。


    plotNum 参数：指定的区域。


    subplot 将整个绘图区域等分为 nrows 行×ncols 列个子区域，然后按照从左到右、从上到下的顺序对每个子区域进行编号，左上的子区域的编号为 1。


    如果 nrows、ncols 和 plotNum 这 3 个数都小于 10，则可以把它们缩写为一个整数，如 subplot(323)和 subplot(3,2,3)是相同的。


    subplot 在 plotNum 指定的区域中创建一个轴对象。如果新创建的轴和之前创建的轴重叠，则之前的轴将被删除。


    # 9.4.2 subplot()的示例


    成功登录聚宽 JoinQuant 量化交易平台后，在菜单栏中选择“我的策略”→“投资研究”命令，打开“投资研究”页面。双击 matplotlib 文件夹，然后单击“新建”按钮，在弹出的下拉菜单中单击
    Python3，新建一个 Python3 文件，并命名为“在同一图中绘制不同的图形”，然后输入以下代码：


    ```

    import numpy as np

    import matplotlib.pyplot as plt

    # 计算正弦和余弦曲线上的点 x 和 y 的坐标

    x = np.arange(0, 3 * np.pi, 0.1)

    y_sin = np.sin(x)

    y_cos = np.cos(x)

    y_tan = np.tan(x)

    # 建立 subplot 网格，高为 2、宽为 2

    # 激活第一个 subplot

    plt.subplot(2, 2, 1)

    # 绘制第一个图形

    plt.plot(x, y_sin,''ob'')

    plt.title(''正弦曲线'')

    # 将第二个 subplot 激活，并绘制第二个图形

    plt.subplot(2, 2, 2)

    plt.plot(x, y_cos,''*m'')

    plt.title(''余弦曲线'')

    # 将第三个 subplot 激活，并绘制第三个图形

    plt.subplot(223)

    plt.plot(x, y_tan,'':r'')

    plt.title(''正切曲线'')

    # 展示图像

    plt.show()

    ```'
