  md: '# 内容简介


    本 fájl 首先讲解量化交易的基础知识，如量化交易的优势、应用、注意事项、历史、量化交易平台等；然后讲解量化交易开发语言 Python，即讲解 Python
    语言的开发环境、基本语法及流程控制、特征数据类 型、内置函数与自定义用户函数、面向对象编程；接着讲解大数据分析和可视化的 3 个包，分 别是 Numpy 包、Pandas
    包、Matplotlib 包；然后讲解量化交易策略的编写、获取数据函数、基本面量化选股、量化择时的技术指标函数、回测技巧、因子分析技巧；最后讲解 Python
    量化交易策略的实战案例。


    在讲解过程中既考虑读者的学习习惯，又通过具体实例剖析讲解 Python 大数据与量化交易过程中的热点问题、关键问题及种种难题。


    本书适用于各种不同的投资者，如新老股民、中小散户、股票操盘手、基金操盘手和专业股票评论人士以及经济财经类专业大学生，更适用于那些有志于在这个充满风险、充满寂寞的征程上默默前行的征战者阅读。


