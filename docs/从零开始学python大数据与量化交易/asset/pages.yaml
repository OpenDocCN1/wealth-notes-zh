  md: '# 从零开始学 Python 大数据与量化交易


    # 11.1 获取股票数据的 history()函数


    history()函数可以查看一只股票或多只股票历史行情数据，其语法格式如下：


    ```

    history(count, unit=''1d'', field=''avg'', security_list=None, df=True, skip_paused=False,
    fq=''pre'')

    ```


    需要注意的是，在获取天数据时，不包括当天的 数据，即使是在收盘后。


    关于停牌：因为获取了多只股票的数据，可能有的股票停牌有的没有，为了保持时间轴的一致性，默认没有跳过停牌的日期，停牌时使用停牌前的数据填充。


    # 11.1.1 各项参数的意义


    history()函数共有 7 项，各项参数意义如下。


    +   1. count

    参数 count 表示数量，即返回结果集的行数。


    +   2. unit

    参数 unit 表示单位时间长度，几天或者几分钟，即只支持 Xd 和 Xm，其中 X 是一个正整数。

    “Xd” 表示具体几天，如 10d，表示单位时间长度为 10 天。

    “Xm” 表示具体几分钟，如 10m，表示单位时间长度为 10 分钟。

    需要注意的是，当 X > 1 时，fields 只支持["open"、"close"、"high"、"low"、"volume"、"money"]这几个标准字段。

    其中： open 表示时间段股票的开始时价格。 close 表示时间段股票的结束时价格。 high 表示时间段股票的最高价格。 low 表示时间段股票的最低价格。
    volume 表示时间段股票的成交量。 money 表示时间段股票的成交金额。


    +   3. field

    参数 field，表示获取的数据类型，支持 SecurityUnitData 里面的所有基本属性，包括 ["open"、"close", "low", "high",
    "volume", "money", "factor", "high_limit", "low_limit", "avg", "pre_close", "paused"]。

    前面 6 个字段的意义同参数 unit，这里不再多说。下面看一下其他字段的意义。 factor: 前复权因子。 high_limit: 涨停价。'
  merge: -1
  img_proc: true
- pgno: 245
  md: 'low_limit: 跌停价。

    avg: 这段时间的平均价，等于 money/volume。

    pre_close: 前一个单位时间结束时的价格，按天则是前一天的收盘价，按分钟则是前一分钟的结束价。

    paused: 布尔值，用来判断股票是否停牌。需要注意的是，停牌时 open/close/low/high/pre_close 依然有值，都等于停牌前的收盘价；而
    volume=money=0。


    # 4. security_list


    参数 security_list 用来获取数据的股票列表。如果其值为 None，表示查询 context.universe 中所有股票的数据。context.universe
    需要使用 set_universe 进行设定，形如: set_universe([''000001.XSHE'', ''600000.XSHG''])。


    # 5. df


    参数 df 的值若是 True，则返回 pandas.DataFrame；否则返回一个 dict。参数 df 的默认值为 True。


    # 6. skip_paused


    参数 skip_paused 用来设置是否跳过不交易日期（包括停牌、未上市或者退市后的日期）。如果不跳过，停牌时会使用停牌前的数据填充。上市前或者退市后数据都为
    nan。需要注意的是，该参数的默认值为 False，即不跳过不交易日期。


    # 7. fq


    参数 fq 是复权选项。参数值设为"pre"，表示前复权，为默认设置；参数值设为 None，表示不复权，返回实际价格；参数值设为"pos"，表示后复权。


    # 11.1.2 history()函数的应用实例


    下面利用 history()函数显示中国宝安（000009）最后 5 个交易日每天的收盘价信息，代码如下：


    ```

    import pandas as pd

    dataframe1 = history(5, unit=''1d'', field=''close'', security_list=''000009.XSHE'',
    df=True, skip_paused=False, fq=''pre'')

    dataframe1

