    \nlevel: 字符串，必须是 debug、info、warning、error 中的一个。级别顺序是 debug < info < warning <\
    \ error。各级别的语法格式如下：\n\n```\nlog.error(content)\nlog.warn(content)\nlog.info(content)\n\
    log.debug(content)\n```\n\n设定 log 级别的实例代码如下：\n\n```\n# 过滤掉 order 系列 API 产生的比 error\
    \ 级别低的 log\nlog.set_level('order', 'error')\n```"
