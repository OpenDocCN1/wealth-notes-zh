- pgno: 238
  md: "# 从零开始学 Python 大数据与量化交易\n\n在模拟盘中，如果中途进程中断，会使用 pickle.dumps 序列化所有的 g 下面的变量内容，保存到磁盘中，再启动时模拟盘就不会有任何数据影响。如果没有用\
    \ g 声明，会出现模拟盘重启后，变量数据丢失的问题。\n\n如果不想 g 中的某个变量被序列化，可以让变量以 “__” 开头，这样这个变量在序列化时就会被忽略。\n\
    \n全局对象 g 的示例代码如下：\n\n```\ndef initialize(context):\n    g.security = \"000001.XSHE\"\
    \n    g.count = 1\n    g.flag = 0\ndef process_initialize(context):\n    # 保存不能被序列化的对象，进程每次重启都初始化\n\
    \    g.__q = query(valuation)\ndef handle_data(context, data):\n    log.info(g.security)\n\
    \    log.info(g.count)\n    log.info(g.flag)\n```\n\n# 10.6.3 Trade 对象\n\nTrade\
    \ 对象用于记录订单的一次交易。但需要注意的是，一个订单可能分多次交易。Trade 对象的常用属性如下。\n\n+   time: 交易时间。\n\n+ \
    \  amount: 交易数量。\n\n+   price: 交易价格。\n\n+   trade_id: 交易记录 id。\n\n+   order_id:\
    \ 对应的订单 id。\n\n# 10.6.4 tick 对象\n\ntick 中的信息是在 tick 事件发生时盘面的一个快照。tick 对象的常用属性如下。\n\
    \n+   code: 标的的代码。\n\n+   datetime: tick 发生的时间。\n\n+   current: 最新价。\n\n+   high:\
    \ 最高价。\n\n+   low: 最低价。\n\n+   volume: 截至当前时刻的成交量。"
