  md: '# 第 6 章


    # Python 的面向对象

    编程基础


    面向对象程序设计可以看作一种在程序中包含各种独立而又互相调用的对象的思想，这与传统的程序设计思想刚好相反：传统的程序设计主张将程序看作一系列函数的集合，或者直接就是一系列对计算机下达的指令。面向对象程序设计中的每一个对象都应该能够接收数据、处理数据并将数据传达给其他对象，因此它们都可以被看作一个小型的“机器”，即对象。面向对象程序设计推广了程序的灵活性和可维护性，并且在大型项目设计中广为应用。


    本章主要内容包括:


    +   ✓ 面向对象概念

    ✓ 类定义与类对象

    ✓ 类的继承

    ✓ 自定义模块并调用


    +   ✓ import 语句

    ✓ 标准模块

    ✓ 包'
