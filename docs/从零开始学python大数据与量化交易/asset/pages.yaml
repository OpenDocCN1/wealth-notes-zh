    # 14.5.5 Information Ratio（信息比率）


    Information Ratio 是用来衡量单位超额风险带来的超额收益。信息比率越大，说明该策略单位跟踪误差所获得的超额收益越高。因此，信息比率较大的策略其表现要优于信息比率较低的基准。合理的投资目标应该是
    yacht  s 在承担适度风险下，尽可能追求高信息比率。


    Information Ratio 的计算公式为：


    Information Ratio = (R_p - R_m) / σ_t


    式中：


    R_p——策略年化收益率；


    R_m——基准年化收益率；


    σ_t——策略与基准每日收益差值的年化标准差。


    在回测详情页面中，单击左侧列表框中的 Information Ratio，就可以看到 MACD 指标量化策略的 Information Ratio 信息，如图
    14.21 所示。


