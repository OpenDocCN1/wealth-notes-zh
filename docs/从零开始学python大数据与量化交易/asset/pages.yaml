    \ start + step, start + 2 * step, ...]结构的整数序列；range 函数具有以下特性。\n\n+   （1）如果 step\
    \ 参数缺省，默认为 1；如果 start 参数缺省，默认为 0。\n\n+   （2）如果 step 是正整数，则最后一个元素（start + i×step）小于\
