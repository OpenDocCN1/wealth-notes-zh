  md: '# 1.7.5 量化交易策略的风险控制


    单击“风险控制”选项卡，并开启风险控制，如图 1.38 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_39_0.png)


    图 1.38 风险控制


    先看止盈止损指标，各指标意义如下。


    个股止损：当个股亏损超过止损线时，则清仓止损。


    个股止盈：当个股盈利超过止盈线时，则清仓止盈。


    持仓价值止损：当量化交易策略持仓价值总亏损超过设定的止损线时，则清仓止损。


    持仓价值止盈：当量化交易策略持仓价值总盈利超过设定的止赢线时，则清仓止盈。


    策略最大亏损：当量化交易策略总亏损超过设定的止损线时，则策略清仓止损，并停止交易。


    策略最大盈利：当量化交易策略总盈利超过设定的止盈线时，则策略清仓止盈，并停止交易。


    大盘信号止损：大盘信号止损有两种方法，分别是根据均线止损和根据跌幅止损。根据均线止损，是指当大盘 N 日均线与昨日收盘价构成“死叉”时，则清仓止损。根据跌幅止损，是指当大盘
    N 日内跌幅超过止损线，则清仓止损。


    在这里设置“策略最大亏损”为 10%，“策略最大盈利”为 50%，如图 1.39 所示。


