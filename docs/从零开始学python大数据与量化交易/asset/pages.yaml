  md: '# 第 3 章


    # Python 的基本语法及

    流程控制


    Python 语言的基本语法和流程控制，与当前其他流行语言 C、C++、Java 等有较多相似之处，但也有一些差别。Python 语言有两大流程控制结构，分别是选择结构和循环结构。选择结构通过
    if 语句来实现，循环结构可以通过 while 循环来实现，也可以通过 for 循环来实现。本章首先讲解 Python 的基本数据类型；然后讲解变量和运算符；接着讲解选择结构、循环结构及其他语句；最后讲解
    Python 的代码格式。'
