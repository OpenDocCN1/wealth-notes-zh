  md: '# 1.3 量化交易的应用


    量化交易技术包括多种具体方法，在投资品种选择、投资时机选择、算法交易、各种套利交易、资产配置等领域得到广泛应用，如图 1.3 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_18_0.png)


    图 1.3 量化交易的应用


    # 1.3.1 投资品种选择


    同样是投资金融市场，有的投资者可以盈利数倍，而有的投资者却会出现亏损，造成这种结果的原因虽然很多，但最主要的原因还在于个人的投资品种选择水平。


    我国沪深股市发展至今，已有 3000 多只股票，经过 20 多年的风风雨雨，投资者已日益成熟，从早期个股的普涨普跌发展到现在，已经彻底告别了齐涨齐跌时代。从近几年的行情来看，每次上涨行情中，涨升的个股所占比例不过
    1/2 左右，而走势超过大盘的个股更是稀少。很多投资者即使判断对了大势，却由于选股的偏差，仍然无法获利，可见选股对投资者的重要性。


    量化选择投资品种，就是利用量化的方法判断某上市公司是否适合买进。根据某个量化的方法，如果某上市公司满足该量化方法的条件，就把该股票放到自选股中；如果不满足该量化方法的条件，就不加入自选股或从自选股中删除。


    # 1.3.2 投资时机选择


    量化选择投资时机是指采用量化的方式判断买点和卖点。如果判断行情是上涨行情，即牛市，则可以买进后持有；如果判断行情是下跌行情，则要果断卖出空仓；如果判断行情是震荡行情，则可以进行高抛低吸，灵活操作。'
