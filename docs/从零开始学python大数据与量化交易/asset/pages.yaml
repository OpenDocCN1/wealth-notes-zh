  md: '# 13.4.3 XS 指标函数


    XS 指标即薛斯通道线。在 Python 量化交易策略中，薛斯通道线 XS 的语法格式如下：


    ```

    XS(security_list, check_date, timeperiod = 13)

    ```


    各参数意义与 MACD 指标相同，这里不再多说。


    返回 SUP、SDN、LUP、LDN 的值，返回类型也与 MACD 指标相同，这里不再多说。


    在薛斯通道中，股价实际上是被短期小通道包容着在长期大通道中上下运行，基本买卖策略是当短期小通道接近长期大通道时，预示着趋势的近期反转。在上沿接近时趋势向下反转，可捕捉短期卖点。在下沿接近时趋势向上反转，可捕捉短期买点。研究这个方法可以在每一波行情中成功地逃顶捉底，寻求最大限度的盈利。薛斯通道线
    XS 的用法具体如下。


    +   （1）长期大通道是反映该股票的长期趋势状态，趋势有一定惯性，延伸时间较长，反映股票大周期，可以反映股票整体趋势，适于中长线投资。


    +   （2）短期小通道反映该股票的短期走势状态，包容股票的涨跌起伏，有效地滤除股票走势中的频繁振动，但保留了股票价格在大通道内的上下波动，反映股票小周期，适于中短线炒作。


    +   （3）长期大通道向上，即大趋势总体向上，此时短期小通道触及（或接近）长期大通道底部时，即买压增大，有反弹的可能。而短期小通道触及长期大通道顶部，即卖压增大，形态出现回调或盘整，有向长期大通道靠近的趋势。如果
    K 线走势与短期小通道走势也吻合得很好，那么更为有效。


    +   （4）长期大通道向上，而短期小通道触及长期大通道顶，此时该股为强力拉长阶段，可适当观望，待短期转平转头向下时，为较好出货点，但穿透区为风险区，应注意反转信号，随时出货。


    +   （5）长期大通道向下，即大趋势向下，此时短期小通道或价触顶，卖压增加，有再次下跌趋势。而触底形态即买增大，有缓跌调整或止跌要求，同时价格运动将趋向近长期大通道上沿。回调宜慎重对待，待确认反转后方可买入。


    +   （6）长期大通道向下，而短期小通道向下穿透长期大通道线，此时多为暴跌过程，有反弹要求，但下跌过程会持续，不宜立即建仓，应慎重，待长期大通道走平且有向上趋势，短期小通道回头向上穿回时，是较好的低位建仓机会。


    +   （7）当长期大通道横向走平时，为盘整行情，价格沿道上下震荡，此时为调整、建仓、洗盘阶段，预示着一轮行情的出现，短线炒家可逢高抛出、逢低买入。以短期小通道强力上穿长期大通道，且长期大通道转向，表明强劲上涨行情开始。若以短期小通道向下透过长期大通道，且长期大通道向下转向，表明下跌将持续。'
