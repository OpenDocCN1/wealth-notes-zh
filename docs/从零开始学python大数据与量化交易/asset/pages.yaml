  md: '# 从零开始学 Python 大数据与量化交易


    # 3.2 变量及赋值


    变量是指在程序执行过程中其值可以变化的量，系统为程序中的每个变量分配一个存储单元。变量名实质上就是计算机内存单元的命名。因此，借助变量名就可以访问内存中的数据了。


    # 3.2.1 变量命名规则


    变量有一个名称，给变量命名时，应遵循以下规则。


    +   （1）名称只能由字母、数字和下画线组成。


    +   （2）名称的第一个字符可以是字母或下画线，但不能是数字。


    +   （3）名称对大小写敏感。


    +   （4）名称不能与 Python 中的关键字相同。


    关键字，即保留字。Python 的标准库提供了一个 keyword 模块，可以输出当前版本的所有关键字。


    保留字示例如下。


    单击“开始”菜单，打开 Python 3.6.5 Shell 软件，然后输入以下代码：


    ```

    import keyword

    ```


    按 Enter 键，这样就导入 keyword 模块，即关键字模块。keyword 模块中有两个成员，即 iskeyword()函数和 kwlist 列表。其中
    kwlist 中包含了所有的关键字，而 iskeyword()函数则用来查看某一个字符串是否是关键字。


    接着输入以下代码：


    ```

    keyword.kwlist

    ```


    然后按 Enter 键，就可以看到所有关键字，如图 3.9 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_78_0.png)


    # 图 3.9 查看 Python 的关键字'
