  md: '# 13.4.1 BOLL 指标函数


    BOLL 指标即布林通道线指标。在 Python 量化交易策略中，布林通道线 BOLL 的语法格式如下：


    ```

    Bollinger_Bands(security_list, check_date, timeperiod=20, nbdevup=2, nbdevdn=2)

    ```


    其中，security_list 和 check_date 参数与 MACD 指标相同，这里不再多说。


    参数 timeperiod、nbdevup 和 nbdevdn 表示统计的天数 timeperiod、nbdevup 和 nbdevdn。


    返回上轨线 UB、中轨线 MB、下轨线 LB 的值，返回类型也与 MACD 指标相同，这里不再多说。


    布林通道线 BOLL 用法如下。


    +   (1) 股价上升穿越布林线上限时，回档概率大。\n(2) 股价下跌穿越布林线下限时，反弹概率大。\n(3) 布林通道线震动波带变窄时，表示变盘在即。


    BOLL 指标函数示例如下。


    双击“量化择时”文件夹，单击“新建”按钮，在弹出的下拉菜单中选择 Python3 命令，新建一个 Python3 文件，并命名为“BOLL 指标函数”，然后输入以下代码：


    ```

    #导入 technical_analysis 库

    from jqllib.technical_analysis import *

    # 定义股票池列表

    security_list1 = ''000001.XSHE''

    # 计算并输出 security_list1 的 BOLL 值

    upperband, middleband, lowerband = Bollinger_Bands(security_list1, check_date=''2018-08-01'',
    timeperiod=20, nbdevup=2, nbdevdn=2)

    print("平安银行的布林通道线 BOLL 的上轨线 UB 值: ",upperband[security_list1])

    print("平安银行的布林通道线 BOLL 的中轨线 MB 值: ",middleband[security_list1])

    print("平安银行的布林通道线 BOLL 的下轨线 LB 值: ",lowerband[security_list1])

    ```


