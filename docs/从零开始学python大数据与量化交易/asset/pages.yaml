  md: "# 从零开始学 Python 大数据与量化交易\n\n很多类都倾向于将对象创建为有初始状态的。因此，类可能会定义一个名为 __init__() 的特殊方法（构造方法），具体代码如下：\n\
    \n```\ndef __init__(self):\n    self.data = []\n```\n\n如果类定义了 __init__() 方法，那么类的实例化操作会自动调用\
    \ __init__() 方法。当然，__init__() 方法可以有参数，参数通过 __init__() 传递到类的实例化操作上。\n\n类的构造方法示例如下。\n\
    \n单击“开始”菜单，打开 Python 3.6.5 Shell 软件，然后在菜单栏中选择 File→New File 命令，创建一个 Python 文件，并命名为\
    \ Python 6-2.py，然后输入以下代码：\n\n```\nclass Complex:\n    # 定义类的特殊方法，即构造方法\n    def\
    \ __init__(self, realpart, imagpart):\n        self.r = realpart\n        self.i\
    \ = imagpart\n    # 定义类的方法\n    def prt(self):\n        print(\"self 代表的是类的实例，代表当前对象的地址:\"\
    ,self)\n        print(\"self.class 指向类:\",self.__class__)\nx = Complex(11.2, 36)\
    \    # 实例化类\nprint(x.r, x.i)\nx.prt()\n```\n\n需要注意的是，类中定义了构造方法，该方法在类的实例化操作中会自动调用，因此参数通过\
    \ __init__() 传递到类的实例化操作上。\n\n类的方法与普通函数只有一个区别，即它们必须有一个额外的第一个参数名称，按照惯例它的名称是 self。self\
