- pgno: 268
  md: '# 12.1 初识量化选股


    量化选股是利用数量化的方法选择股票组合，期望该股票组合能够获得超越基准收益率的投资行为。量化选股总的来说可分为两类，分别是基本面选股和技术面选股。


    但在实际股票投资中，往往是利用基本面选出要操作的股票，放入自选股中，然后根据技术面来确定交易的时机，即根据技术判断来确定何时买入、何时加仓、何时减仓、何时全部卖出。


    基本面选股，又称为财务因子选股。基本面选股可以进一步分为 4 类，分别是成长类因子选股、规模类因子选股、价值类因子选股和质量类因子选股，如图 12.1 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_268_0.png)


    # 12.2 成长类因子选股


    在 Python 量化选股中，成长类因子有 7 个，分别是营业收入同比增长率、营业收入环比增长率、净利润同比增长率、净利润环比增长率、营业利润率、销售净利润和销售毛利率。


    # 12.2.1 营业收入同比增长率选股


    营业收入是指在一定时期内，企业销售商品或提供劳务所获得的货币收入，如商业企业的商品销售收入、生产加工企业的产品销售收入、饮食业的饮食品销售收入、服务业的服务收入、仓储企业的仓储收入、运输企业的运费收入、代办运输收入等。营业收入的计算公式如下：


    营业收入=主营业务收入+其他业务收入

    或

    营业收入=产品销售量（或服务量）×产品单价（或服务单价）'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 第 12 章 Python 基本面量化选股


    主副产品（或不同等级产品）的销售收入应全部计入营业收入；所提供的不同类型服务收入也应计入营业收入。


    营业收入同比增长率是指企业在一定期间内取得的营业收入与其上年同期营业收入增长的百分比，以反映企业在此期间内营业收入的增长或下降等情况。营业收入同比增长率计算公式如下：


    营业收入同比增长率＝（当期营业收入－上期营业收入）÷ 上期营业收入 × 100%


    当期营业收入按使用者的需要可以是月度、季度或年度，也可以是会计年度起始日至会计报表截止日期，如 2017 年 1 月 1 日至 2017 年 9 月 30
    日等，另外，也可以是分析者采用的年化数据，如 2017 年 10 月 1 日至 2018 年 9 月 30 日。


    上期营业收入是指与当期营业收入相对应的上一个年度此期间的营业收入。


    营业收入同比增长率越大，说明企业当期获得的营业收入相对去年同期增长越大，对企业盈利有正面影响；而营业收入同比增长率为负时，则表明企业营业收入出现下降，应引起企业管理者或投资者的注意。


    连续地观察营业收入同比增长率的历史趋势，可以反映出企业的营业收入在不同的会计期间其增长变化的情况，给后期的预测带来一定的帮助。


    > 提醒 由于很多企业处于不同的行业，其业务的经营带有很强的季节性。因此，简单按月或季度去比较营业收入并不客观，而营业收入同比增长率有效地剔除了这种季节性比较明显的企业按月或按季对比带来的偏颇，给企业营业收入的分析带来客观性。


    营业收入同比增长率选股示例如下。


