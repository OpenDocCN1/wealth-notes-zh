- pgno: 19
  md: '# 1.3.3 算法交易


    算法交易是指通过设计算法，利用计算机程序发出交易指令的方法。在交易中，程序可以决定的范围包括交易时间的选择、交易的价格，甚至包括最后需要成交的资产数量。


    # 1. 算法交易的类型


    算法交易可以分为 3 类，分别是被动型算法交易、主动型算法交易和综合型算法交易，如图 1.4 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_19_0.png)


    图 1.4 算法交易的类型


    # 1）被动型算法交易


    被动型算法交易，又称为结构型算法交易，该交易算法只是利用历史数据估计交易模型的关键参数，不会根据市场的状况主动选择交易时机和交易数量，而是按照一个既定的交易方针进行交易。该策略的核心是减少滑价（目标价与实际成交均价的差）。被动型算法交易最成熟，使用也最为广泛，如在国际市场上使用最多的成交加权平均价格（VWAP）、时间加权平均价格（TWAP）等都属于被动型算法交易。


    # 2）主动型算法交易


    主动型算法交易，也称机会型算法交易，该交易算法根据市场状况作出实时的决策，判断是否交易、交易的数量、交易的价格等。主动型交易算法除了努力减少滑价以外，还把关注的重点逐渐转向了价格趋势预测上。


    # 3）综合型算法交易


    综合型算法交易是前两者的结合。这类算法常见的方式是先把交易指令拆开，分布到若干个时间段，每个时间段内具体如何交易由主动型交易算法进行判断。两者相结合可达到单纯一种算法无法达到的效果。


    # 2. 算法交易的交易策略


    算法交易的交易策略有 3 种，分别是降低交易费用、套利和做市，如图 1.5 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_19_1.png)


    图 1.5 算法交易的交易策略'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 从零开始学 Python 大数据与量化交易


    1）降低交易费用


    大单指令通常被拆分为若干个小单指令渐次进入市场。这个策略的成功程度可以通过比较同一时期的平均购买价格与成交量加权平均价来衡量。


    2）套利


    典型的套利策略通常包含 3～4 个金融资产，如根据外汇市场利率平价理论，国内债券的价格、以外币标价的债券价格、汇率现货及汇率远期合约价格之间将产生一定的关联，如果市场价格与该理论隐含的价格偏差较大，且超过其交易成本，则可以用四笔交易来确保无风险利润。股指期货的期限套利也可以用算法交易来完成。


    3）做市


    做市包括在当前市场价格之上挂一个限价卖单或在当前市场价格之下挂一个限价买单，以便从买卖差价中获利。


    此外，还有更复杂的策略，如“基准点”算法被交易员用来模拟指数收益，而“嗅探器”算法被用来发现最动荡或最不稳定的市场。任何类型的模式识别或者预测模型都能用来启动算法交易。


    # 1.3.4 各种套利交易


    套利交易，是指利用相关市场或相关电子合同之间的价差变化，在相关市场或相关电子合同上进行与交易方向相反的交易，以期望价差发生变化而获利的交易行为。套利交易模式主要分为四大类型，分别为股指期货套利、商品期货套利、统计套利和期权套利，如图
    1.6 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_20_0.png)


    # 1. 股指期货套利


    股指期货套利，是指利用股指期货市场存在的不合理价格，同时参与股指期货与股票现货市场交易，或者同时进行不同期限、不同（但相近）类别股票指数合约交易，以赚取差价的行为。股指期货套利主要分为两种，即期现套利和跨期套利。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 2. 商品期货套利


    与股指期货对冲相似，商品期货同样存在套利策略，在买入或卖出某种期货合约的同时，卖出或买入相关的另一种合约，并在某个时间点同时将两种合约平仓。


    在交易形式上它与套期保值有些相似，但套期保值是在现货市场买入（或卖出）实货，同时在期货市场上卖出（或买入）期货合约；而套利却只在期货市场上买卖合约，并不涉及现货交易。商品期货套利主要分为
    4 种，即期现套利、跨期套利、跨市场套利和跨品种套利。


    # 3. 统计套利


    统计套利有别于无风险套利，它是利用证券价格的历史统计规律进行套利的，是一种风险套利，其风险在于这种历史统计规律在未来一段时间内是否继续存在。


    统计对冲的主要思路是先找出相关性最好的若干对投资品种（股票或者期货等），再找出每一对投资品种的长期均衡关系（协整关系），当某一对品种的价差（协整方程的残差）偏离到一定程度时开始建仓——买进被相对低估的品种、卖空被相对高估的品种，等到价差回归均衡时获利了结即可。


    # 4. 期权套利


    期权（Option）又称选择权，是在期货的基础上产生的一种衍生性金融工具。从其本质上讲，期权实质上是在金融领域将权利和义务分开进行定价，使得权利的受让人在规定时间内对于是否进行交易行使其权利，而义务方必须履行。


    在期权交易时，购买期权的一方称为买方，而出售期权的一方则称为卖方；买方即权利的受让人，而卖方则是必须履行买方行使权利的义务人。


    期权的优点在于收益无限的同时风险损失有限，因此在很多时候，利用期权来取代期货进行做空、套利交易，会比单纯利用期货套利具有更小的风险和更高的收益率。


    # 1.3.5 资产配置


    资产配置（Asset Allocation）是指根据投资需求将投资资金在不同资产类别之间进行分配，通常是将资产在低风险、低收益证券与高风险、高收益证券之间进行分配。


    量化交易管理将传统投资组合理论与量化分析技术相结合，极大地丰富了资产配置的内涵，形成了现代资产配置理论的基本框架。它突破了传统积极型投资和指数型投资的局限，将投资方法建立在对各种资产类股票公开数据的统计分析基础上，通过比较不同资产类的统计特征，建立数学模型，进而确定组合资产的配置目标和分配比例。


    当今，全世界有超过万亿美元的资产全部或部分以量化分析为基础进行资产配置。资产配置包括两大类，分别是战略资产配置和战术资产配置；还包括三大层次，分别是全球资产配置、大类资产配置和行业风格资产配置。'
  merge: -1
  img_proc: true
