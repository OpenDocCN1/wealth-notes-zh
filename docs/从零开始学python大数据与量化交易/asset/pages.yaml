    # 5.3.5 匿名函数


    匿名就是不再使用 def 语句这样标准的形式定义一个函数。在 Python 中，使用 lambda 来创建匿名函数。匿名函数需要注意以下几点。


    +   （1）lambda 只是一个表达式，函数体比 def 简单很多。

    （2）lambda 的主体是一个表达式，而不是一个代码块，仅仅能在 lambda 表达式中封装有限的逻辑。

    （3）lambda 函数拥有自己的命名空间，且不能访问自己参数列表之外或全局命名空间里的参数。

    （4）虽然 lambda 函数看起来只能写一行，却不等同于 C 或 C++ 的内联函数，后者的目的是调用小函数时不占用栈内存，从而增加运行效率。


    lambda 函数的语法只包含一个语句，具体如下：


    ```

    lambda [arg1 [,arg2,...,argn]]:expression

    ```


    匿名函数示例如下。


    单击“开始”菜单，打开 Python 3.6.5 Shell 软件，然后在菜单栏中选择 File→New File 命令，创建一个 Python 文件，并命名为
    Python5-12.py，然后输入以下代码：


    ```

    mylamb = lambda arg1, arg2, arg3 : arg1 + arg2 - arg3

    # 调用匿名函数 mylamb

    print("调用匿名函数，并返回运算值 :", mylamb(30, 90,66))

    ```


    在菜单栏中选择 Run→Run Module 命令或按键盘上的 F5 键，就可以运行程序代码，结果如图 5.15 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_140_1.png)'
