  md: '# 1.5 量化交易的注意事项


    量化交易的注意事项有 6 项，具体如下。


    （1）没有任何一个交易系统既能在趋势中获利又能够在震荡走势中获利，只有在恰当的时间使用了适合的交易系统才会获取最大收益。


    （2）任何交易系统都是人设置的，所以不同的人，由于对技术分析的理解、解读、使用不同，设置出的交易系统也是完全不一样的。因此，只有适合自己交易风格的交易系统才是最有效的。


    （3）把人为的主观分析编制成理性的计算机程序，需要舍去很多以往交易中的经验，而这些宝贵经验往往是无法通过计算机语言所能描绘的。


    （4）时间周期不同，如 5 分钟、30 分钟、60 分钟、日线、周线、月线，交易系统给出的交易信号可能会完全不同，投资者应当根据交易品种的特性选择不同的时间周期，并且应当严格按照交易系统选择的时间周期交易。


    （5）参数调整是决定交易系统成败的关键，因为没有任何一组参数适合所有交易品种。要根据交易品种特性不断地磨合、测试，找到适合该交易品种的参数，并且还要在今后交易过程中根据市场变化不断加以修正。


    （6）量化交易系统体现了交易者的交易思路和交易风格，但它只是交易的辅助手段，人才是交易的主体，不能本末倒置。只有将交易系统、风险管理、资金管理相Q相互结合，才能发挥其最大功效。


    # 1.6 量化交易的发展过程


    量化交易的发展过程可以分为两部分，分别是国外量化交易的发展过程和国内量化交易的发展过程。


    # 1.6.1 国外量化交易的发展过程


    国外量化交易的发展可分为 3 个阶段，具体如下。


    第一阶段（1971—1977 年）。1971 年，世界第一只被动量化基金由巴克利国际投资管理公司发行。1977 年世界上第一只主动量化基金也是由巴克利发行，发行规模达到
    70 亿美元，算是美国量化投资的开端。


    第二阶段（1977—1995 年）。这段时间，量化投资在海外发展较为缓慢，但随着信息技术和计算机技术方面取得巨大进步，量化投资迎来了高速发展的时代。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 从零开始学 Python 大数据与量化交易


    第三阶段（1995 年至今）。从 1995 年至今，量化投资技术逐渐趋于成熟，在目前全部的投资中，量化投资大约占比 50%，指数类投资全部采用定量技术，主动投资中
    20%～30%采用定量技术。


    # 1.6.2 国内量化交易的发展过程


    与海外市场量化交易的蓬勃发展相比，量化基金在国内尚处于起步阶段。2004 年 8 月光大保德信量化核心基金是国内第一只量化基金。在随后的近 5 年时间里，量化基金的发行一度长期处于空窗期。从
    2009 年开始，量化基金以每年 4～5 只的发行速度缓慢前行。2014—2015 年的牛市阶段，促使了量化基金正式进入投资者的视野。自 2015 年起，量化基金市场规模迅速扩张，数量及管理规模均快速增长，以公募量化基金为例，已经超过
    1000 亿元规模。


    量化私募基金的发展则更加迅速。截至 2017 年 12 月底，中国证券投资基金业协会已备案私募基金管理人 22446 家，同比增长 28.76%，已备案私募基金
    66418 只，同比增长 42.82%，管理基金规模达 11.1 万亿元，同比增长约 41%。


    与此同时，国内证券研究所的金融工程研究如雨后春笋般兴起，并纷纷推出自行研究的数量化股票投资模型，按照一定的选股标准，如 Beta 值、市值、每股收益、市盈率等，以及市场的动态特征对市场行为和投资进行量化，帮助投资者实现证券投资组合管理，为未来数量化投资的进一步发展奠定了基础。


    # 1.7 量化交易的平台


    现在市面上比较流行的量化平台，如聚宽 JoinQuant、优矿 Uqer、米筐 Ricequant，大体上提供类似的服务，但在细节上又有所不同。量化平台的服务本质在于通过封装好的回测函数和金融数据库，帮助用户快捷地实现策略编程和回测。本书是以聚宽
    JoinQuant 量化交易平台为例，来讲解量化交易。


    聚宽 JoinQuant 致力于打造高效、易用的量化交易平台，并且希望降低量化交易的门槛，让更多人有机会参与进来。聚宽 JoinQuant 坚信“人人皆为宽客”，即任何人只要对量化交易感兴趣，就可以成为一名宽客。


    # 1.7.1 聚宽 JoinQuant 量化交易平台的功能


    聚宽 JoinQuant 量化交易平台有 4 项强大功能，分别是高质量数据、强大的研究平台、顶级回测体验和顶尖模拟交易，如图 1.7 所示。'
