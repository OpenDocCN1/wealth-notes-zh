  md: '# 13.3.6 CCI 指标函数


    CCI 指标，即顺势指标。在 Python 量化交易策略中，顺势指标 CCI 的语法格式如下：


    ```

    CCI(security_list, check_date, N=14)

    ```


    其中，security_list 和 check_date 参数与 MACD 指标相同，这里不再多说。参数 N 表示统计的天数 N。


    返回 CCI 的值，返回类型也与 MACD 指标相同，这里不再多说。


    顺势指标 CCI 用法如下。


    +   （1）CCI 为正值时，视为多头市场；为负值时，视为空头市场。\n（2）常态行情时，CCI 波动于±100 之间；强势行情，CCI 会超出±100。\n（3）CCI>100
    时，买进，直到 CCI<100 时，卖出。\n（4）CCI<-100 时，先卖出，直到 CCI>-100 时，再买进。


