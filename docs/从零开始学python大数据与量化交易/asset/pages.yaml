  md: '# 3.1.2 字符串类型


    字符串是 Python 编程语言中最常用的数据类型，可以使用单引号 (‘) 或双引号 ( ") 来创建字符串。需要注意的是，Python 不支持单字符类型，单字符在
    Python 中也是作为一个字符串使用。


