  md: '# 第 1 章


    # 量化交易快速入门


    量化交易在海外的发展已有 30 多年，其投资交易业绩稳定，市场规模和份额不断扩大，得到了越来越多投资者的认可，甚至有超越非量化投资之势。本章首先讲解量化交易的基础知识；然后讲解量化交易的优势、应用、注意事项、历史及与人工交易的区别；最后讲解量化交易的平台和量化交易的潜在风险及应对策略。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_13_0.png)'
