  md: '# 第11章 Python量化交易策略的获取数据函数


    code：股票的代码。


    pe_ratio：股票的市盈率（PE，TTM），即动态市盈率。动态市盈率是指每股市价为每股收益的倍数，反映投资人对每元净利润所愿支付的价格，用来估计股票的投资报酬和风险。


    turnover_ratio：股票的换手率。换手率是指在一定时间内市场中股票转手买卖的频率，是反映股票流通性强弱的指标之一。


    pb_ratio：股票的市净率(PB)。市净率是指每股股价与每股净资产的比例。


    ps_ratio：股票的市销率。市销率是指股票价格与每股销售收入之比，市销率越小，通常被认为投资价值越高。


    pcf_ratio：股票的市现率。市现率是指每股市价为每股现金净流量的倍数。


    capitalization：是股票的总股本(万股)。总股本是指上市公司已发行的普通股股份总数（包含 A 股、B 股和 H 股的总股本）。


    market_cap：股票的总市值(亿元)。总市值是指在某特定的时间内，交易所挂牌交易全部证券（以总股本计）按当时价格计算的证券总值。


    circulating_cap：股票的流通股本(万股)。流通股本是指上市公司已发行的境内上市流通、以人民币兑换的股份总数（A 股市场的流通股本）。


    circulating_market_cap：股票的流通市值(亿元)。流通市值是指在某特定时间内当时可交易的流通股股数乘以当时股价得出的流通股票总价值。


    day：指查询股票财务数据的具体日期。


    pe_ratio_1yr：股票的市盈率(PE)。以上一年度每股盈利计算的静态市盈率。


    除了利用表格显示财务数据信息外，还可以利用 Print 函数输出指定的财务数据字段信息。创建一个 Python3 文件，然后输入代码如下：


    ```

    import pandas as pd

    myq = query( valuation).filter( valuation.code == ''000001.XSHE'')

    dataframe1 = get_fundamentals(myq, ''2018-4-12'')

    print("平安银行（000001）2018年4月12日的动态市盈率：",dataframe1[''pe_ratio''][0])

    print("平安银行（000001）2018年4月12日的换手率：",dataframe1[''turnover_ratio''][0])

    print("平安银行（000001）2018年4月12日的市销率：",dataframe1[''ps_ratio''][0])

    ```


