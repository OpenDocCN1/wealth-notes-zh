    # 12.2.5 营业利润率选股


    营业利润率是指经营所得的营业利润占销货净额的百分比，或占投入资本额的百分比，其计算公式如下：


    营业利润率=营业利润 ÷ 全部业务收入 × 100%


    营业利润率越高，说明企业商品销售额提供的营业利润越多，企业的盈利能力越强；反之，此比率越低，说明企业盈利能力越弱。


