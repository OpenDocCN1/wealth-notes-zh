  md: '# 从零开始学 Python 大数据与量化交易


    # 1.7.4 量化交易策略的买卖条件


    选出满足条件的股票后，接下来就要设置在什么条件下可以买进这些股票，在什么条件下要卖出这些股票。


    买卖条件下有两个模型，分别是轮动模型和择时模型。


    # 1. 轮动模型


    老股民都知道，在进行投资选择时是会有自己的投资偏好的。有些投资者比较偏好成长股，有时候又会比较偏好价值股。可能在某些阶段比较偏好小盘股，在另外的时期又比较偏好大盘股。市场风格就是由于投资者的这种不同的交易行为产生的。所以如果能够在投资中紧跟市场风格变化行动，就会比一直持有的效果要好得多。


    单击“买卖条件”选项卡，就可以看到“轮动模型”和“择时模型”。先选中“轮动模型”单选按钮，这样就可以设置轮动模型，如图 1.34 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_36_0.png)


    # 图 1.34 轮动模型


    调仓周期：量化交易策略多少个交易日更新一次股票池，这里设置为“1”，即每一个交易日更新一次股票池。


    最大持仓股票数量：量化交易策略最多持有的股票数量，这里设置为“5”，即最多同时持有 5 只股票。


    买入方式：量化交易策略的买入方式有 4 种，分别是等权重买入、按固定数量、按总市值比例、按流通市值比例，下面来看各种买入方式的意义。


    +   （1）等权重买入，是指每次买入一定金额的股票。买入金额=（持仓成本+可用资金）÷最大持股数。


    +   （2）按固定数量，是指每次买入固定数量的股票。


    +   （3）按总市值比例，是指根据股票的总市值大小，按比例买入股票。所占比例=股票 A 总市值÷（股票 A 总市值+股票 B 总市值+股票 C 总市值+……）。'
