    # 15.3.3 IC 分析


    IC（Information Coefficient）代表了预测值和实现值之间的相关性，通常用以评价预测能力。取值在-1~1之间，值越大表示预测能力越好。


    IC 的计算一般有两种方法：分别是 normal IC 和 rank IC。normal IC 是因子载荷与因子收益之间的相关系数。rank IC 是因子载荷的排序值与收益的排序值之间的相关系数。JoinQuant（聚宽）量化交易平台计算的是
    rank IC。


    由于单日 IC 的波动较大，这里还提供了 IC 的月度移动平均线作为参考，即 22 日移动平均线。


    单击左侧的“IC 分析”，就可以看到 1 天 IC 和 5 天 IC，如图 15.11 所示。


