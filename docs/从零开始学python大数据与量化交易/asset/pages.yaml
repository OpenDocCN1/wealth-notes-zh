  md: '# 第 13 章


    # Python 量化择时的技术

    指标函数


    技术指标通过对原始数据（开盘价、收盘价、最低价、最高价、成交量、成交金额、成交笔数）的处理，来反映出市场的某一方面深层的内涵，这些内涵是很 ★ 通过原始数据直接看出来的。技术指标能客观地反映某些既成过去的事
    实，将某些市场的数据形象化、直观化，将某些分析理论数量化和精细化。正因为技术指标可以提供具体量化条件，所 以可以实现量化买卖，这也是在量化交易中技术指标应用最
    为广泛的原因。本章首先讲解量化择时的基础知识；然后讲 解趋向指标函数、反趋向指标函数、压力支撑指标函数、量 价指标函数的应用。'
