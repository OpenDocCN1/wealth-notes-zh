- pgno: 288
  md: '# 从零开始学 Python 大数据与量化交易


    # 13.1 初识量化择时


    量化择时是指利用数量化的方法，通过各种技术分析的量化分析，找到自选股中股票的买点和卖点。在各种技术分析中，技术指标是非常重要的量化分析手段，也是最常用的量化分析工具。


    目前，应用于股市的技术指标有几百种，按照不同的计算原理和反映状况，可大致分为 4 类，分别是趋势指标、反趋势指标、压力支撑指标、量价指标，如图 13.1 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_288_0.png)


    图 13.1 技术指标的类型


    # 1. 趋向指标


    趋向指标是识别和追踪有趋势的图形类指标，其特点是不试图猜顶和测底，如均线指标、MACD 指标等。


    # 2. 反趋势指标


    反趋势指标又称振荡指标，是识别和追踪趋势运行转折点的图形类指标，其特点是具有强烈的捕顶和捉底的意图，对市场转折点较敏感，如随机指标 KDJ、强弱指标 RSI
    等。


    # 3. 压力支撑指标


    压力支撑指标又称通道指标，是通过顶部轨道线和底部轨道线，试图捕捉行情的顶部和底部的图形类指标，其特点是具有明显的压力线，也有明显的支撑线，如 BOLL 指标、XS
    指标。


    # 4. 量价指标


    量价指标就是通过成交量变动来分析捕捉价格未来走势的图形类指标，其特点是以“成交量是市场元气”为依据，揭示成交量与价格涨跌关系，如 OBV 指标、VOL 指标等。


    # 13.2 趋向指标函数


    趋向指标是投资者最容易在市场中获利的方法，也是股票、期货、外汇市场中最为著名的格言“让利润充分增长，限制损失”的真实反映。'
