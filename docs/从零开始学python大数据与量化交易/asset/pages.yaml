  md: '# 5.2.4 字符串函数


    字符串函数的名称及功能说明如表 5.4 所示。


    # 表 5.4 字符串函数的名称及功能说明


    | 函数名称 | 功能说明 |

    |---|---|

    | capitalize() | 将字符串的第一个字符转换为大写 |

    | center(width, fillchar) | 返回一个指定的宽度 width 居中的字符串，fillchar 为填充的字符，默认为空格 |

    | count(str, beg=0, end=len(string)) | 返回 str 在 string 里面出现的次数，如果 beg 或者 end 指定则返回指定范围内
    str 出现的次数 |

    | expandtabs(tabsize=8) | 把字符串 string 中的 tab 符号转换为空格，tab 符号默认的空格数是 8 |

    | find(str, beg=0 end=len(string)) | 检测 str 是否包含在字符串中，如果指定范围 beg 和 end，则检查是否包含在指定范围内，如果包含则返回开始的索引值；否则返回-1
    |

    | index(str, beg=0, end=len(string)) | 跟 find() 方法一样，只不过如果 str 不在字符串中会报一个异常 |

    | isalnum() | 如果字符串至少有一个字符并且所有字符都是字母或数字，则返回 True；否则返回 False |

    | isalpha() | 如果字符串至少有一个字符并且所有字符都是字母，则返回 True；否则返回 False |

    | isdigit() | 如果字符串只包含数字，则返回 True；否则返回 False |

    | isspace() | 如果字符串中只包含空白，则返回 True；否则返回 False |

    | islower() | 如果字符串中包含至少一个区分大小写的字符，并且所有这些(区分大小写的)字符都是小写，则返回 True；否则返回 False |

    | isupper() | 如果字符串中包含至少一个区分大小写的字符，并且所有这些(区分大小写的)字符都是大写，则返回 True；否则返回 False |

    | join(seq) | 以指定字符串作为分隔符，将 seq 中所有的元素(的字符串表示)合并为一个新的字符串 |

    | len(string) | 返回字符串长度 |

    | ljust(width[, fillchar]) | 返回一个原字符串左对齐，并使用 fillchar 填充至长度 width 的新字符串，fillchar
    默认为空格 |

    | rjust(width, [, fillchar]) | 返回一个原字符串右对齐，并使用 fillchar(默认空格)填充至长度 width 的新字符串
    |

    | lstrip() | 删除字符串左边的空格或指定字符 |

    | rstrip() | 删除字符串末尾的空格 |'
