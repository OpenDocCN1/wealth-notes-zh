- pgno: 254
  md: '# 从零开始学 Python 大数据与量化交易


    下面解释一下各财务数据的意义。


    statDate: 表示财报统计的季度的最后一天，如 2016-03-31、2016-06-30。


    code: 股票代码。


    basic_eps: 基本每股收益（元）。基本每股收益的理论算法：归属于普通股股东的当期净利润/(当期实际发行在外的普通股加权平均数=∑(发行在外普通股股数×发行在外月份数)/12)。


    cash_equivalents: 货币资金（元）。货币资金是指在企业生产经营过程中处于货币形态的那部分资金，按其形态和用途不同，可分为库存现金、银行存款和其他货币资金。它是企业中最活跃的资金，流动性强，是企业的重要支付手段和流通手段，因而是流动资产的审查重点。货币资金又称为货币资产，是指在企业生产经营过程中处于货币形态的资产，是指可以立即投入流通，用以购买商品或劳务或用以偿还债务的交换媒介物。


    goods_sale_and_service_render_cash: 销售商品、提供劳务收到的现金（元）。反映企业本期销售商品、提供劳务收到的现金，以及前期销售商品、提供劳务本期收到的现金（包括销售收入和应向购买者收取的增值税销项税额）和本期预收的款项，减去本期销售本期退回的商品和前期销售本期退回的商品支付的现金。企业销售材料和代购代销业务收到的现金，也在本项目反映。


    > 提醒 income 表示利润数据；balance 表示资产负债数据；cash_flow 表示现金流数据。


    # 11.4 查询股票财务数据的 get_fundamentals_continuously()函数


    get_fundamentals()函数只能查询某一交易日的股票财务数据信息，如果要查询多个交易日的股票财务数据信息，就要使用 get_fundamentals_continuously()函数，其语法格式如下：


    ```

    get_fundamentals_continuously(query_object,end_date=None,count=None)

    ```


    各项参数意义如下。


    query_object: 一个 sqlalchemy.orm.query.Query 对象，可以通过全局的 query 函数获取 Query 对象。


    end_date: 与 get_fundamentals()函数中 date 意义相同，即查询日期。


    count: 获取 end_date 前 count 个日期的数据。


    get_fundamentals_continuously()函数的返回值是 pandas.Panel。


    > 提醒 出于性能方面考虑，返回总条数不超过 10000 条的限制。也就是说，查询的股票数量 count 要小于 10000；否则，返回的数据会不完整。'
  merge: -1
