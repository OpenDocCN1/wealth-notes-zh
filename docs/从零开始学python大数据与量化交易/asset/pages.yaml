    # 3.2.2 变量的赋值


    每个变量在使用前都必须赋值，变量赋值以后该变量才会被创建。在 Python 中，变量就是变量，它没有类型，通常所说的“类型”是变量所指的内存中对象的类型。


    等号（=）用来给变量赋值。等号（=）运算符左边是一个变量名，等号（=）运算符右边是存储在变量中的值，例如：


    ```

    counter = 5      # 整型变量

    miles   = 803.320  # 浮点型变量

    name    = "runoob"  # 字符串

    ```


    另外，Python 允许同时为多个变量赋值。例如：


    ```

    a = b = c = 30

    ```


    上述代码表示，创建一个整型对象，赋值为 30，3 个变量被分配到相同的内存空间。'
