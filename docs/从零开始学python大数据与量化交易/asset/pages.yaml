    \ '1d', ['close'],df=False)\n    # 取得过去 ma_n1 天的平均价格\n    ma_n1 = close_data['close'][-n1:].mean()\n\
    \    # 取得过去 ma_n2 天的平均价格\n    ma_n2 = close_data['close'][-n2:].mean()\n    #\
    \ 取得过去 ma_n3 天的平均价格\n    ma_n3 = close_data['close'][-n3:].mean()\n    # 取得上一时间点价格\n\
    \    current_price = close_data['close'][-1]\n    #获得 BOLL 指标的上轨值、中轨值和下轨值\n  \
    \  upperband, middleband, lowerband = Bollinger_Bands(security, check_date=context.current_dt,\
    \ timeperiod=20, nbdevup=2, nbdevdn=2)\n    # 取得当前的现金\n    cash = context.portfolio.available_cash\n\
    \    # 如果上一时间点价格高出中轨值，则全仓买入\n    if ma_n1 > ma_n2 and ma_n2> ma_n3 and current_price\
    \ > middleband:\n        # 记录这次买入\n        log.info(\"收盘价站上 BOLL 指标中轨，买入 %s\"\
    \ %(security))\n```"
