    卖出欲买进股票：是否卖出欲买入的股票，卖出可能会再次买入同一只标的，造成亏损手续费。


    # 2. 择时模型


    择时交易是指利用某种方法来判断大势的走势情况，是上涨还是下跌抑或是盘整。如果判断是上涨，则以买入持有为主；如果判断是下跌，则果断卖出清仓；如果判断是震荡，则进行高抛低吸，这样可以获得远远超越简单买入持有策略的收益率，所以择时交易是收益率最高的一种交易方式。


    提醒：由于大盘趋势和宏观经济、微观企业、国家政策及国际形势等密切相关，想要准确判断大盘走势具有相当的难度。


    接下来设置“择时模型”。选中“择时模型”单选按钮，就可以看到设置择时模型。择时模型分为“买入条件”和“卖出条件”，先来看看一下“买入条件”设置，如图 1.36
    所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_37_1.png)


    # 图 1.36 择时模型'
