    class DerivedClassName(BaseClassName1):\n    <statement-1>\n    ...\n    <statement-N>\n\
    ```\n\n需要注意圆括号中基类的顺序，若是基类中有相同的方法名，而在子类使用时未指定，Python 从左至右搜索，即方法在子类中未找到时，从左到右查找基类中是否包含方法。另外，基类必须与派生类定义在一个作用域内。\n\
