    # 表 1.1 量化交易与人工交易的对比


    | 比较的要素 | 量化交易 | 人工交易 |

    |---|---|---|

    | 纪律性 | 忠实地执行设计者的思路，不存在主观情绪的影响，总之纪律严明 | 主观情绪化，恐惧、贪婪、赌气等人性弱点，导致交易变形，总之纪律性较差 |

    | 精力 | 只要计算机正常，电源正常，不知 道疲倦 | 总得睡觉、吃饭、离开计算 机；长时间在计算机前盯盘 有碍身体健康 |

    | 效率性 | 理论上，从判断到下单瞬间完成； 突发行情可以捕捉到 | 从决定到执行需要几个步 骤，至少 30 秒；这样突发 行情难以捕捉或捕捉的时机 不好
    |

    | 系统性 | 严格按照既定的一套或多套操作方 法交易，可能判断系统优劣，并进 行改进 | 随意性较大，很难评估优劣 对错，对订单的处理 “艺术 性” 更强
    |

    | 可控制性 | 风险、胜率、回测率等可以根据历 史数据来检测。在实际使用中根据 设定的参数，风险是明确的。只要 系统严谨，失控的可能性很小 | 风险不太明确，有失控的
    可能 |

    | 可复制性 | 盈利模式可以无限复制，“一劳永 逸”。在时间上可以复制过往的成 功；空间上，可以在无数个账户上 复制成功 | 经验的形成需要足够的交易 次数，并且要求交易员具备
    超常的心理素质，其过往的 盈利能力才可以复制。另 外，一个交易员人工可操作 的账户有限，所以空间上复 制盈利能力更差 |'
