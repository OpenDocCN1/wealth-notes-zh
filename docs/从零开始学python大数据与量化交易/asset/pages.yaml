- pgno: 14
  md: '# 从零开始学 Python 大数据与量化交易


    # 1.1 初识量化交易


    要进行量化交易，首先就要知道量化交易的定义，还要知道量化交易与算法交易、黑匣子交易、程序化交易、技术分析的区别与联系。下面进行详细讲解。


    # 1.1.1 量化交易的定义


    量化交易是指借助现代统计学和数学的方法，利用计算机技术进行交易的证券投资方式。量化交易从庞大的历史数据（大数据）中海选出能带来超额收益的多种“大概率”事件，以制定策略，用数量模型验证及固化这些规律和策略，然后严格执行已固化的策略来指导投资，以求获得可以持续的、稳定且高于平均收益的超额回报。


    传统的投资交易方法主要有两种，分别是基本面分析和技术面分析。而量化投资交易主要依靠数据和模型来寻找投资交易标的和投资交易策略。


    量化投资交易中模型和人的关系，好比病人和医生的关系。在医生治病的方法中，有中医和西医。中医是望、闻、问、切，最后判断出结果，医治效果在很大程度上取决于医生的经验，定性程度大一些。西医则是先要病人去拍片子、化验等，这些都要依托医学仪器，最后得出结论，对症下药。


    医生治疗的是病人的疾病，而投资者要治疗的是金融市场的疾病。金融市场的疾病就是错误的定价和估值，没病或病得比较轻，市场是有效的或弱有效的；病得越重市场越无效。


    投资者用资金投资于低估的证券，直到把它的价格抬升到合理的价格水平。但是，传统的投资交易方法和量化投资交易的方法在具体做法上有些不同，这些不同如同中医和西医的差异。传统的投资交易方法更像中医，更多地依靠经验判断病因在哪里；量化投资交易方法更像西医，依靠模型判断，模型对于量化投资者的作用就像
    CT 机对于医生的作用。在每一天的投资交易运作之前，投资者会先用模型对整个金融市场进行一次全面的检查和扫描，然后根据检查和扫描结果作出投资交易决策。


    # 1.1.2 量化交易与算法交易


    在当前的投资界，您听到“算法交易”（Algorithmic Trading）的次数，可能会比听到“量化交易”的次数更多。确实，在大多数情况下，这两种称谓基本上可以互替使用，因为目前最流行的量化交易策略，基本上都属于“算法交易”的范畴。


    不过，量化交易和算法交易还是有所区别的。因为算法交易通常意味着高度自动化的交易发现和交易执行，因此算法交易往往也称为“自动交易”（Automated'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Trading），或者是更形象化的“黑匣子交易”（Black-box Trading）。


    人们在说“算法交易”的时候，往往并不仅仅泛指所有高度自动化的量化交易策略，而是专指那些持有期很短、交易相当频繁的交易策略，甚至专指那些以降低交易成本为目的的交易策略。


    所以，本书所讲的量化交易范围更广些，不仅包括算法交易，而且也包括自动化程度和交易频率不太高的一些其他交易策略。


    # 1.1.3 量化交易与黑匣子交易


    前面已经说过，“黑匣子交易” 是人们对算法交易的一种形象化说法，所以量化交易与黑匣子交易的关系，就和量化交易与算法交易的关系差不多。


    不过，当人们说黑匣子交易时，更加突出的是一个“黑”字，也就是这些交易策略的神秘性。


    所以，像 ETF（交易所交易基金）套利、现期套利等一些经典的套利策略，人们似乎觉得它们不够“黑”，一般不会称之为黑匣子。


    # 1.1.4 量化交易与程序化交易


    单从字面上来讲，程序化交易是指所有高度自动化的量化交易策略，包括算法交易。在大多数情况下，人们也确实是这么用这个名称的。不过，纽约交易所对程序交易有专门的定义，指的是同时涉及
    15 个及以上的证券、总交易额至少为 100 万美元的电子交易。这类交易很大一部分都是套利，因此当人们说程序化交易时，往往特指套利交易策略。


    # 1.1.5 量化交易与技术分析


    投资者很容易把量化交易和技术分析联系在一起，确实，技术分析中会使用很多的量化指标，量化交易中也会用到一些技术指标。而且，相当一部分的量化交易策略和技术分析一样，几乎都是依赖于对价格、成交额等交易信息的分析。不过，量化交易与技术分析还是有所区别的。


    首先，一些技术分析方法很难被量化。例如，图形分析是技术分析的一个重要部分，可是图形很难被量化定义，如波浪，这些技术分析手段就无法被应用在量化交易中。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 从零开始学 Python 大数据与量化交易


    其次，量化交易并不仅限于技术分析所涉及的交易信息。基本面的信息数据，如收入、利润、购并等，以及利率、通胀等宏观基本面信息，都可能被量化交易策略所参考。


    因此，量化交易和技术分析的关系可概括为：二者既有相互重叠的地方，也有相互独立的地方。


    # 1.2 量化交易的优势


    量化交易的优势主要表现在 4 个方面，即严格的纪律性、完备的系统性、妥善运用套利的思想、靠概率取胜，如图 1.1 所示。


    ![](img/261a0e647c121c3aa8af17bcacd0d7ae_16_0.png)


    图 1.1 量化交易的优势


    # 1.2.1 严格的纪律性


    量化交易有着严格的纪律性，这样就可以克服人性的弱点，如贪婪、恐惧、侥幸心理，也可以克服认知偏差。一个优秀的投资交易方法应该是一个“透明的盒子”，所以投资者的每一个决策都应该是合理有据，特别是有大数据支持。


    例如，如果有人问你，某年某月某一天，你为什么购买某只股票的话，你就可以打开量化交易系统，系统会显示出当时被选择的这只股票与其他股票相比在成长面上、估值上、资金上、技术上、买卖时机上的综合评价情况，而且这个评价是非常全面的，比普通投资者“拍脑袋”或者简单看某一个指标买卖更具有说服力。


    # 1.2.2 完备的系统性


    完备的系统性具体表现为“三多”，分别是多层次、多角度和大数据处理，如图 1.2 所示。'
