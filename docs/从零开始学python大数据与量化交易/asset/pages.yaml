  md: '![](img/261a0e647c121c3aa8af17bcacd0d7ae_25_0.png)


    # 图1.7 聚宽 JoinQuant 量化交易平台的功能


    # 1. 高质量数据


    对于个人或者是中小机构，收集、处理、维护大量历史数据的成本比较高，而且数据实时更新并反复清洗。所以，能够提供全面、高精度的各种市场数据，是量化平台最基本和最关键的需求。


    聚宽 JoinQuant 量化交易平台的数据基于 2005 年至今完整的 Level-2 数据、上市公司财务数据，包含完整的停牌、复权等信息，盘后及时更新。


