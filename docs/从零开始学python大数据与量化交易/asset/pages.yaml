  md: '![](img/261a0e647c121c3aa8af17bcacd0d7ae_17_0.png)


    # 图1.2 完备的系统性


    # 1. 多层次


    完备的系统性首先表现在多层次，包括在大类资产配置、行业选择、精选个股 3 个层次上都有模型。


    # 2. 多角度


    完备的系统性其次表现在多角度，量化交易的核心投资思想包括宏观周期、市场结构、估值、成长、盈利质量、分析师盈利预测、市场情绪等多个角度。


    # 3. 大数据处理


    完备的系统性的另一个表现就是大数据处理，即海量数据处理。人脑处理信息的能力是有限的，当一个资本市场只有几十只股票时，这对定性投资基金经理是有优势的，他可以深刻分析这几十家公司。但在一个很大的资本市场，比如有成千上万只股票的时候，量化交易的强大的信息处理能力能反映它的优势，能捕捉更多的投资机会，拓展更大的投资空间。


    # 1.2.3 妥善运用套利的思想


    量化交易正是在寻找估值洼地，通过全面、系统性的扫描捕捉错误定价、错误估值带来的机会。


    定性投资大部分时间在琢磨哪一个企业是有前景的企业，哪只股票是可以翻倍的股票；与定性投资不同，量化交易大部分精力花在分析哪里是估值洼地，哪一个品种被低估了，从而买入低估的，卖出高估的。


    # 1.2.4 靠概率取胜


    靠概率取胜表现在以下两个方面。


    +   - （1）定量投资不断地从历史中挖掘有望在未来重复的历史规律，并且加以利用。\n- （2）在股票实际操作过程中，运用概率分析，提高买卖成功的概率和仓位控制能力。'
