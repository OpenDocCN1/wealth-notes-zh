  md: '# 大样本性质

    （asymptotic/large sample properties）


    +   - 一致性是对估计量的基本要求

    +   - 在假设1-假设4成立的前提下，OLS参数估计值是一致估计量。


    plim[β̂_j (n)] = β_j


    plim[β̂_j (n)] - β_j = Cov(x,u) / Var(x)'
  merge: -1
