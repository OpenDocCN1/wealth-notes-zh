- pgno: 489
  md: '$y = \beta_0 + \beta_1 x_1 + \beta_2 x_2 + \beta_3 x_k + u$


    $H_0: \ Var(u|x_1,x_2,x_3) = \sigma^2$


    $\hat{u}^2 = \delta_0 + \delta_1 x_1 + \delta_2 x_2 + \delta_3 x_3 + \delta_4
    x_1^2 + \delta_5 x_2^2 + \delta_6 x_3^2$


    $+ \delta_7 x_1 x_2 + \delta_8 x_1 x_3 + \delta_9 x_2 x_3 + v$


    $\hat{u}^2 = \delta_0 + \delta_1 \hat{y} + \delta_2 \hat{y}^2 + v$


    $H_0: \ \delta_1 = \delta_2 = 0$


    White Test: $F = \frac{R_{\hat{u}^2}^2 / k}{(1 - R_{\hat{u}^2}^2)/(n - k - 1)}
    \xrightarrow{asy.} F_{2, n-3}$


    $LM = n R_{\hat{u}^2}^2 \xrightarrow{asy.} \chi_2^2$'
  merge: -1
  img_proc: true
