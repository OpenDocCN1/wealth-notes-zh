- pgno: 188
  md: '+   - 如何得到模型参数估计（即样本回归函数），尽可能“好”地识别总体回归函数，以反映数据的变动规律？

    +   - “好” →拟合误差越小越好

    +     $$\min_{\hat{\beta}_0,\hat{\beta}_1}(e_i)=\min_{\hat{\beta}_0,\hat{\beta}_1}\sum_{i=1}^{n}\left[y_i-\left(\hat{\beta}_0+\hat{\beta}_1x_i\right)\right]$$

    +     $$\min_{\hat{\beta}_0,\hat{\beta}_1}|e_i|=\min_{\hat{\beta}_0,\hat{\beta}_1}\sum_{i=1}^{n}\left|y_i-\left(\hat{\beta}_0+\hat{\beta}_1x_i\right)\right|$$'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 一、最小二乘原理


    +   估计参数 $\hat{y}_i = \hat{\beta}_0 + \hat{\beta}_1 x_i$ 应使残差平方和最小，即


    $\min \sum_{i=1}^{n} e_i^2 = \min \sum_{i=1}^{n} (y_i - \hat{y}_i)^2$


    $= \min_{\hat{\beta}_0,\hat{\beta}_1} \sum_{i=1}^{n} \left[ y_i - (\hat{\beta}_0
    + \hat{\beta}_1 x_i) \right]^2$'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 为什么取二次型？


    +   - 从经济含义上看：

    +     - 体现偏差大小的最小化

    +     - 非线性惩罚（对偏差大小递增的惩罚）


    +   - 从数学处理上看：

    +     - 优化过程较为简单直观（线性估计量）


    ![](img/27e6f65397bb7fd3eced98a716a58f50_190_0.png)'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 满足必要条件（正规方程组）


    $$\frac{\partial Q}{\partial \hat{\beta}_0}=-2\sum\left(y_i-(\hat{\beta}_0+\hat{\beta}_1x_i)\right)=0$$


    $$\frac{\partial Q}{\partial \hat{\beta}_1}=-2\sum\left(y_i-(\hat{\beta}_0+\hat{\beta}_1x_i)\right)x_i=0$$


    # 整理后


    $$n\hat{\beta}_0+\hat{\beta}_1\sum x_i=\sum y_i$$


    $$\hat{\beta}_0\sum x_i+\hat{\beta}_1\sum x_i^2=\sum x_i y_i$$


    ![](img/27e6f65397bb7fd3eced98a716a58f50_191_0.png)'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 得出回归模型参数估计值


    $\hat{\beta}_0 = \bar{y} - \hat{\beta}_1 \bar{x} = \frac{\sum x_i^2 \sum y_i -
    \sum x_i \sum x_i y_i}{n \sum x_i^2 - (\sum x_i)^2}$


    (代入第二个正规方程)


    $\hat{\beta}_1 = \frac{n \sum x_i y_i - \sum x_i \sum y_i}{n \sum x_i^2 - (\sum
    x_i)^2} = \frac{\sum (x_i - \bar{x})(y_i - \bar{y})}{\sum (x_i - \bar{x})^2}$


    $= \frac{\sum \dot{x}_i \dot{y}_i}{\sum \dot{x}_i^2} = \frac{\sum \dot{x}_i y_i}{\sum
    \dot{x}_i^2} = \frac{\sum x_i \dot{y}_i}{\sum \dot{x}_i^2}$'
  merge: -1
  img_proc: true
