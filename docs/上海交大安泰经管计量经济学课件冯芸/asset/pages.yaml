  md: '# F分布


    ■ **定理：** 随机样本 $X_1，X_2，……，X_m$ 来自均值为 $\mu_X$，方差为 $\sigma_X^2$ 的正态总体，随机样本 $Y_1，Y_2，……，Y_n$
