- pgno: 246
  md: "# OLS的统计性质：一阶矩\n\n+   - 线性：参数估计量 $\\hat{\\beta}_j$ 是 $y_i$ 的线性函数\n+   \n+ \
    \    $$\\hat{\\beta}_j = \\frac{\\sum \\hat{r}_{ji} y_i}{\\sum \\hat{r}_{ji}^2}$$\n\
    \n+   - 无偏性\n+   \n+     $$E(\\hat{\\beta}_j \\mid \\mathbf{X}) = \\beta_j, \\\
    quad j = 0, \\cdots, k$$\n+   \n+     $$E(\\hat{\\beta}_j) = \\beta_j, \\quad\
    \ j = 0, \\cdots, k$$"
  merge: -1
  img_proc: true
- pgno: 247
  md: '# OLS的统计性质：二阶矩


    +   - **MLR.5** 同方差性


    $$Var(u\mid X_1,X_2,\cdots,X_k)=\sigma^2$$


    $$Var(\hat{\beta}_j\mid X)=\frac{\sigma^2}{\sum_i\hat r_{ji}^2}=\frac{\sigma^2}{(1-R_j^2)SST_j}$$'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# OLS估计量的抽样方差（估计精度）


    +   - 估计量的条件方差依赖于三个因素

    +     - σ²

    +     - SST_j 取决于解释变量样本数据的变动

    +     - R_j² 取决于解释变量之间的共线性强度（完全的共线性会出现什么情况？）


    Var(\hat{β}_j | X) = \frac{σ²}{\sum \hat{r}_{ji}²} = \frac{σ²}{(1 - R_j²) SST_j}'
  merge: -1
  img_proc: true
- pgno: 249
  md: '![](img/27e6f65397bb7fd3eced98a716a58f50_249_0.png)


    \[\operatorname{Var}(\hat{\beta}_1\mid X)=\frac{\sigma^2}{(1-R_1^2)SST_1}\]


    \[\frac{\sigma^2}{SST_1}\]


    横轴：\(R_1^2\)，范围为 0 到 1。'
  merge: -1
  img_proc: true
- pgno: 250
  md: "# 多重共线性程度的判断\n\n+   - 方差膨胀因子VIF\n+   \n+     $VIF = \\frac{1}{(1 - R_1^2)}$\n\
    +   \n+     $Var(\\hat{\\beta}_1 | X) = \\frac{\\sigma^2}{SST_1} VIF$\n\n+   -\
    \ 如果一个变量的VIF超过10，就认为该变量是高度共线性的。"
  merge: -1
  img_proc: true
