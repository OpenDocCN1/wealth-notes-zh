- pgno: 269
  md: '# $t$ 检验的决策规则


    | 检验类型 | $H_0$：原假设 | $H_1$：备择假设 | 拒绝原假设 |

    |---|---|---|---|

    | 双侧检验 | $\beta=b$ | $\beta\ne b$ | $|t|>t_{\alpha/2,df}$ |

    | 右侧检验 | $\beta=b$ | $\beta>b$ | $t>t_{\alpha,df}$ |

    | 左侧检验 | $\beta=b$ | $\beta<b$ | $t<t_{\alpha,df}$ |'
  merge: -1
