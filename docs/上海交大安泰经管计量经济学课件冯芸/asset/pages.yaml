  md: '# 为什么需要控制其它自变量？


    +   - 一个例子：打火机个数与患病概率

    +     - 家庭拥有的打火机的数量与家庭中身患癌症的人数之间是否存在因果关系？'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/27e6f65397bb7fd3eced98a716a58f50_219_0.png)'
  merge: -1
