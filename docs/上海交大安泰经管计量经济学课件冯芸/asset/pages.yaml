- pgno: 194
  md: '# 另一种估计思路：矩法估计（method of moments）


    E(u) = 0 ⇒ E(y − β₀ − β₁x) = 0


    ⇒ (1/n) Σᵢ₌₁ⁿ (yᵢ − β̂₀ − β̂₁xᵢ) = 0


    E(ux) = 0 ⇒ E[(y − β₀ − β₁x)x] = 0


    ⇒ (1/n) Σᵢ₌₁ⁿ (yᵢ − β̂₀ − β̂₁xᵢ)xᵢ = 0'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 二、样本回归线的性质


    +   - 参数估计值依赖于随机样本，具有随机性

    +   - 通过 x 和 y 的样本均值，即 \(\bar{y}=\hat{\beta}_0+\hat{\beta}_1\bar{x}\)

    +   - 估计的 y 的均值等于实测的 y 的均值，即 \(\bar{y}=\hat{\bar{y}}\)

    +   - 残差 \(e_i\) 的均值为零，即 \(\sum e_i=0\)

    +   - 残差 \(e_i\) 和 \(x_i\) 不相关，即 \(\sum e_i x_i=0\)

    +   - 残差 \(e_i\) 和 y 的预测值不相关，即 \(\sum(e_i-\bar{e})(\hat{y}_i-\bar{\hat{y}})=0\)'
  merge: -1
  img_proc: true
