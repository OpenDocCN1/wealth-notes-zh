    +   - 解释变量线性

    +     $E(y|x)=f(x)=\beta_0+\beta_1 \frac{1}{x}$

    +   - “线性”回归指

    +     $E(y|x)=f(x)=\beta_0+\beta_1^2 x$


    对参数而言线性'
