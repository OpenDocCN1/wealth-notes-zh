  md: '# # 多项式函数模型


    +   - **例子：总成本函数**

    +     - 线性成本函数 $y_i=\beta_0+\beta_1x_i$：边际成本不变

    +     - 三次型 $y_i=\beta_0+\beta_1x_i+\beta_2x_i^2+\beta_3x_i^3$：边际成本递增


    ![](img/27e6f65397bb7fd3eced98a716a58f50_362_0.png)


    ![](img/27e6f65397bb7fd3eced98a716a58f50_362_1.png)'
  merge: -1
  img_proc: true
- pgno: 363
  md: 'dy/dx > 0，且当产量达到一定规模后，边际成本递增 d²y/dx² > 0。


    MC = β₁ + 2β₂xᵢ + 3β₃xᵢ²，即 3β₃(xᵢ + β₂/(3β₃))² + β₁ - β₂²/(3β₃)，为保证


    MC > 0，且有正的极小值，因此 d²(MC)/dx² = 6β₃ > 0，对参数有以下约束：


    +   （1）β₃ > 0


    +   （2）极小值点 x* = -β₂/(3β₃) > 0，因此，β₂ < 0。


    +   （3）极小值点 y* = β₁ - β₂²/(3β₃) > 0，即 3β₁β₃ > β₂²，且 β₁ > 0。


    +   （4）xᵢ = 0 时，总成本 yᵢ = β₀ > 0。'
  merge: -1
  img_proc: true
