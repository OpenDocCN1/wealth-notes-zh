- pgno: 370
  md: '# 包含多余变量的影响


    # OLS 参数估计量无偏


    $\hat{\alpha}_1=\hat{\beta}_1-\hat{\alpha}_2\hat{\gamma}_1$


    $E(\hat{\alpha}_1\mid\cdot)=\beta_1-\alpha_2\hat{\gamma}_1=\beta_1$


    $\frac{\sum \hat{\nu}_i^2}{n-3}$ 是 $\sigma_\varepsilon^2$ 的无偏估计


    $Var(\hat{\alpha}_1)=\frac{\sigma^2}{(1-R_1^2)SST_1}\ge Var(\hat{\beta}_1)=\frac{\sigma^2}{SST_1}$，只要
    $R_1^2\ne0$，多余变量模型 OLS 参数估计总体方差大于真实模型中 OLS 参数估计的总体方差。'
  merge: -1
  img_proc: true
- pgno: 371
  md: '# 四、模型设定检验


    +   - 嵌套模型选择：诊断多余变量或遗漏变量


    $$y_i=\beta_0+\beta_1x_{1i}+\beta_2x_{2i}+\beta_3x_{3i}+u_i$$


    $$\frac{(R^2_{ur}-R^2_r)/q}{(1-R^2_{ur})/(n-k-1)}\sim F(q,n-k-1)$$


    $R^2_{ur}$：无约束方程的拟合优度　$R^2_r$：约束方程的拟合优度


    $q$：参数约束条件的个数


    $H_0$：无约束模型与有约束模型无差异（即无约束模型存在多余变量问题）


    $H_1$：无约束模型优于有约束模型（即有约束模型存在遗漏变量问题）'
  merge: -1
  img_proc: true
- pgno: 372
  md: "# RESET检验\n\n检验模型： y = β₀ + β₁x₁ + ⋯ + βₖxₖ + u 是否遗漏重要的非线性关系\n\n备选模型： y = β₀\
    \ + β₁x₁ + ⋯ + βₖxₖ + δ₁ŷ² + δ₂ŷ³ + u\n\n对应的假设检验\n\nH₀ : δ₁ = δ₂ = 0\n\nF = (R²新\
    \ − R²旧) / 新引入的回归元的个数\n    (1 − R²新) / (n − 新模型中的参数个数)"
  merge: -1
  img_proc: true
