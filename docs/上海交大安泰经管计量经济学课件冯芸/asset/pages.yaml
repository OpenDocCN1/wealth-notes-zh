- pgno: 212
  md: '```

    $$\frac{\partial(\sum e_i^2)}{\partial(\hat{\beta}_0)}=0 \qquad \frac{\partial(\sum
    e_i^2)}{\partial(\hat{\beta}_1)}=0 \qquad \frac{\partial(\sum e_i^2)}{\partial(\hat{\beta}_2)}=0$$

    ```


    ```

    $$\left\{\begin{aligned}\sum y_i&=\sum(\hat{\beta}_0+\hat{\beta}_1x_{1i}+\hat{\beta}_2x_{2i})\\\sum
    y_i x_{1i}&=\sum x_{1i}(\hat{\beta}_0+\hat{\beta}_1x_{1i}+\hat{\beta}_2x_{2i})\\\sum
    y_i x_{2i}&=\sum x_{2i}(\hat{\beta}_0+\hat{\beta}_1x_{1i}+\hat{\beta}_2x_{2i})\end{aligned}\right.$$

    ```


    ```

    $$\bar{y}=\hat{\beta}_0+\hat{\beta}_1\bar{x}_1+\hat{\beta}_2\bar{x}_2$$


    $$\sum e_i\cdot1=0$$


    $$\sum e_i x_{1i}=0$$


    $$\sum e_i x_{2i}=0$$

    ```


