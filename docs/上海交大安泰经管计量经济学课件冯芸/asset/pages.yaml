- pgno: 268
  md: 'H₀ : βⱼ = 0 ⇔ 参数不显著(异于零)


    H₁ : βⱼ ≠ 0 ⇔ 参数显著(异于零)


    构造统计量 t = (β̂ⱼ - βⱼ) / √(σ̂² / Σ r̂ⱼi²) = (β̂ⱼ - βⱼ) / √V̂(β̂ⱼ) ~ t(n - k - 1)


    进行双侧检验，即判断 |t| 是否大于 t_{α/2}'
