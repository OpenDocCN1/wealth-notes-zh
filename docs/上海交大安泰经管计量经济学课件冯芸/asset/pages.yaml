- pgno: 4
  md: '+   - **事件**：随机试验的可能结果组成的集合，它是样本空间的一个子集。

    +   - 如果两个事件不能同时发生，则两个事件称为**互斥的**。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '+   - 如果一个事件的发生与另一事件的发生可能性相同，则两个事件称为*等可能性*的。

    +   - 如果可穷举试验的所有可能结果，事件称为*穷举事件*。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '+   - 随机变量：取值由试验结果决定的变量

    +   - 概率的古典定义（随机试验的*n*个基本结果互斥且等可能发生）：


    P(A) = 属于事件A的基本结果的个数 / 所有基本结果总数'
  merge: -1
  img_proc: true
- pgno: 7
  md: 概率的频率定义：如果在n次试验或n个观察值中，m次属于事件A，假定n足够大，那么事件A的概率P(A)就简单地等于m/n（即频率）
  merge: -1
