- pgno: 419
  md: '# 作者关心的问题是什么？


    +   - 背景：外商投资企业在中国经济中占据重要位置；中外合资是主要的组织形式。

    +   - 什么因素决定FDI项目中外国股权比例的高低？


    ![](img/27e6f65397bb7fd3eced98a716a58f50_419_0.png)'
  merge: -1
  img_proc: true
- pgno: 420
  md: '# 已有文献如何看待这个问题？


    +   - 外国投资企业的角度：

    +     - 强调外企本身的因素，包括行业特征、企业特有资产和技术。

    +     - 基本的研究框架是产业组织理论'
  merge: -1
  img_proc: true
- pgno: 421
  md: '+   - 东道主国家的因素

    +     - **FDI政策对FDI流入的影响：** 没有得到一致性的结论。此外，他们的重点并没有放在**FDI**项目的股权结构。

    +     - **东道主国家的政治风险：** 同样也会影响当地企业'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# 作者提出的新视角是什么？


    +   - 从当地合作企业的角度：当地合作企业在与外企谈判中的讨价还价能力决定了外商投资企业股权结构的高低

    +   - 那么什么决定了讨价还价能力？其中一个重要因素是当地企业所处的制度环境'
  merge: -1
  img_proc: true
- pgno: 423
  md: '+   - 如何检验该命题？

    +   - 需要寻找制度环境存在差异的样本。'
  merge: -1
  img_proc: true
- pgno: 424
  md: "# 江苏和浙江：两种不同制度环境\n\n+   • 两省对私营企业采取了两种不同的政策模式：\n+   \n+     – 江苏：支持乡镇企业发展，适度限制私营企业的发展\n\
    +   \n+     – 浙江：对私营企业采取更加放任自由的政策\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_424_0.png)"
  merge: -1
  img_proc: true
- pgno: 425
  md: '# 理论假说


    +   • 对私营企业施加法律和金融上的约束以使乡镇企业受益的做法可能会迫使私营企业以别的方式来寻求法律保护和金融资源，其中包括与外企联盟。这可能会导致私营企业在与外企共同建立合资企业时做出更多的股权让步。


    ![](img/27e6f65397bb7fd3eced98a716a58f50_425_0.png)'
  merge: -1
  img_proc: true
- pgno: 426
  md: '# 假说一和假说二


    +   - 不同政策待遇的企业外国股权比例存在差异

    +     - 私营企业参与的合资企业比乡镇企业参与的合资企业，其外国股权比例更高。

    +     - 对资金有更大需求的企业比更小需求的企业，其外国股权比例更高'
  merge: -1
  img_proc: true
- pgno: 427
  md: '# 假说三和假说四


    +   - 由于浙江省对待不同企业的政策差异小于江苏省，在浙江省所观察到的假说一和假说二所描述的效果会弱于江苏省。

    +   - 浙江省实力相对江苏省更强的私营企业，会吸引当地的乡镇企业更多地与之合作，而不是与外资企业合作，从整体上减少外国股权比例。'
  merge: -1
  img_proc: true
