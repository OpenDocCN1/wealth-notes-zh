- pgno: 176
  md: '# E(u | x) = 0意味着什么？


    再利用重期望律（*Iterative Law of Expecation*，以下简称ILE）


    E(u) = E_x [ E(u | x) ] = 0


    Cov(u, x) = E(u x)

    = E_x [ E(u x | x) ] = E_x [ x · E(u | x) ] = 0'
  merge: -1
  img_proc: true
- pgno: 177
  md: '+   - 如果随机误差项的条件期望为零，那么随机误差项的无条件期望也为零。

    +   - 随机误差项与解释变量之间不（线性）相关的结论。

    +   - y的变动由两部分组成：

    +     - 系统的或确定的部分 $E(y|x)$

    +     - 非系统的或随机的部分 $u$'
  merge: -1
  img_proc: true
