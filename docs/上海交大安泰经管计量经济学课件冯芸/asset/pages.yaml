  md: "# χ²检验的决策规则\n\n| 检验类型 | H₀: 原假设 | H₁: 备择假设 | 拒绝原假设 |\n|---|---|---|---|\n|\
    \ 右侧检验 | σₓ² = σ₀² | σₓ² > σ₀² | (n-1)S² / σ₀² > χ²ₐ,(n-1) |\n| 左侧检验 | σₓ² = σ₀²\
    \ | σₓ² < σ₀² | (n-1)S² / σ₀² < χ²₁₋ₐ,(n-1) |\n| 双侧检验 | σₓ² = σ₀² | σₓ² ≠ σ₀²\
    \ | (n-1)S² / σ₀² > χ²ₐ/₂,(n-1) \n(n-1)S² / σ₀² < χ²₍₁₋ₐ/₂₎,(n-1) |"
  merge: -1
