  md: '# 进一步的问题：如何获知异方差形式


    +   - 可行广义最小二乘（Feasible Generalized Least Squares）


    估计 $h_i \to \hat{h}_i$


    $y = \beta_0 + \beta_1 x_1 + \beta_2 x_2 + \cdots + \beta_k x_k + u$


    $Var(u \mid x_1, x_2, \cdots, x_k) = \sigma^2 \exp\left(\delta_0 + \delta_1 x_1
    + \delta_2 x_2 + \cdots + \delta_k x_k\right)$'
