- pgno: 242
  md: '# 五、OLS估计量的统计性质


    +   - OLS估计方法得到的样本回归线是否是总体回归线的一个好的估计量？

    +   - 回答上述问题，需要了解参数估计量的抽样分析，因此需要对随机误差项等进行一系列的假定。


    ![](img/27e6f65397bb7fd3eced98a716a58f50_242_0.png)'
  merge: -1
  img_proc: true
- pgno: 243
  md: '# 横截面回归的经典假定

    （Gauss-Markov假定）


    +   - **MLR.1** 模型对参数而言是线性的。

    +     $y_i = \beta_0 + \beta_1 x_{1i} + \beta_2 x_{2i} + \cdots + \beta_k x_{ki}
    + u_i$

    +     $i = 1, \cdots, n$


    +   - **MLR.2** $n$次观测 $\{(y_i,\ x_{i1},\ \cdots,\ x_{ik}), i=1,\cdots,n\}$ 为随机样本（第
    $i$ 次观测和第 $j$ 次观测来自于独立同分布的总体）'
  merge: -1
  img_proc: true
- pgno: 244
  md: '# 横截面回归的经典假定

    （Gauss-Markov假定）


    +   - MLR.3 扰动项的条件期望为零 $E(u|x_1, ..., x_k)=0$（$E(u)=0$, $COV(u, x_j)=0$），称为外生解释变量


    +   - MLR.4 解释变量之间不存在完全的线性相关关系（模型的可识别条件）'
  merge: -1
  img_proc: true
- pgno: 245
  md: <!-- no content -->
