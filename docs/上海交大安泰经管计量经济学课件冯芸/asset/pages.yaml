  md: '# Logit模型估计值的解释


    概率的计算


    $\hat{L}_i = \ln(\frac{\hat{p}_i}{1 - \hat{p}_i}) = \hat{\beta}_0 + \hat{\beta}_1
    x_i$


    $\hat{p}_i = \frac{e^{\hat{\beta}_0 + \hat{\beta}_1 x_i}}{1 + e^{\hat{\beta}_0
    + \hat{\beta}_1 x_i}}$'
  merge: -1
