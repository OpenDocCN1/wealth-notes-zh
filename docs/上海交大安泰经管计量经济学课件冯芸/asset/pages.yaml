- pgno: 292
  md: 'H₀: 模型线性关系不显著 ⇔ H₀: β₁ = ⋯ = βₖ = 0


    SSE = Σ(ŷᵢ - ȳ)² ~ χ²(k)


    SSR = Σ(yᵢ - ŷᵢ)² ~ χ²(n - k - 1)


    F = (SSE / k) / (SSR / (n - k - 1)) ~ F(k, n - k - 1)


    显著性水平 α 的拒绝域是 F > Fₐ(k, n - k - 1)'
  merge: -1
  img_proc: true
