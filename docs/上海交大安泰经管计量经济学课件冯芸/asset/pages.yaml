    +   - 如何度量这种模型的拟合优度？'
  merge: -1
  img_proc: true
- pgno: 438
  md: '# （一）线性概率模型（LPM）


    $y_i = \beta_0 + \beta_1 x_i + u_i$


    $x_i$：家庭的收入


    $y_i = \begin{cases} 1: \text{如果该家庭拥有住宅} \\ 0: \text{其它} \end{cases}$


    $E(y_i \mid x_i) = \beta_0 + \beta_1 x_i$'
  merge: -1
  img_proc: true
- pgno: 439
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 440
  md: '$$E(y_i\mid x_i)=1\cdot p_i+0\cdot(1-p_i)=p_i$$


    $$E(y_i\mid x_i)=\beta_0+\beta_1x_i=p_i$$


    约束条件　$0\leq E(y_i\mid x_i)=\beta_0+\beta_1x_i\leq1$'
  merge: -1
  img_proc: true
- pgno: 441
  md: "# LPM的估计问题：$u_i$非正态性\n\n+   - 随机误差项的非正态性，$u_i$服从贝努利分布\n+   \n+     当$y_i=1$时，概率$p_i$，$u_i=1-\\\
    beta_0-\\beta_1x_i=1-p_i$\n+   \n+     当$y_i=0$时，概率$1-p_i$，$u_i=-\\beta_0-\\beta_1x_i=-p_i$\n\
    \n+   - 但OLS估计仍是无偏，此外，在大样本中，可沿用正态假定下的OLS方法。"
  merge: -1
  img_proc: true
- pgno: 442
  md: '# LPM的估计问题：$u_i$异方差


    +   - 随机误差项的异方差性

    +   - **OLS估计**仍是无偏，但不是有效的（即不具有最小方差性质）。


    $$E(u_i\mid x_i)=(1-p_i)(-\beta_0-\beta_1x_i)+p_i(1-\beta_0-\beta_1x_i)=0$$


    $$\operatorname{Var}(u_i\mid x_i)=(\beta_0+\beta_1x_i)(1-\beta_0-\beta_1x_i)=p_i(1-p_i)$$'
  merge: -1
  img_proc: true
- pgno: 443
  md: '# LPM的估计问题：预测值约束


