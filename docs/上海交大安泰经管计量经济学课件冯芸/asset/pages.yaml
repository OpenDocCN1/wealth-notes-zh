- pgno: 262
  md: '# 渐近正态性


    $$\hat{\beta}_j=\frac{\sum \hat r_{ji}y_i}{\sum \hat r_{ji}^{2}}$$，在 MLRI~MLR5
    假定下，应用中心极限定理，


    +   - $\sqrt{n}(\hat{\beta}_j-\beta_j)\xrightarrow{a}N(0,\sigma^2/a_j^2)$，其中 $a_j^2=\operatorname{plim}\left(\frac{1}{n}\sum_{i=1}^{n}\hat
    r_{ji}^{2}\right)$

    +   - $\operatorname{plim}\hat{\sigma}^{2}=\sigma^{2}$

    +   - 对于 $j=1,\cdots,k$，$\frac{\hat{\beta}_j-\beta_j}{\operatorname{se}(\hat{\beta}_j)}=\frac{\hat{\beta}_j-\beta_j}{\sqrt{\hat{\sigma}^{2}/\sum_{i=1}^{n}\hat
    r_{ji}^{2}}}\xrightarrow{a}N(0,1)$，$t(n-k-1)\xrightarrow{a}N(0,1)$'
  merge: -1
  img_proc: true
