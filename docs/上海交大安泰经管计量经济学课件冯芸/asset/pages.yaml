- pgno: 70
  md: '# F检验的决策规则


    | 检验类型 | H₀: 原假设 | H₁: 备择假设 | 拒绝原假设 |

    |---|---|---|---|

    | 右侧检验 | σ₁² = σ₂² | σ₁² > σ₂² | S₁²/S₂² > F_{α, n₁-1, n₂-1} |

    | 左侧检验 | σ₁² = σ₂² | σ₁² < σ₂² | S₁²/S₂² < F_{1-α, n₁-1, n₂-1} |

    | 双侧检验 | σ₁² = σ₂² | σ₁² ≠ σ₂² | S₁²/S₂² > F_{α/2, n₁-1, n₂-1}

    S₁²/S₂² < F_{(1-α/2), n₁-1, n₂-1} |'
