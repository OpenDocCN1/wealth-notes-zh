- pgno: 369
  md: '# 包含多余变量的影响


    一个例子：


    正确模型      y = β₀ + β₁x₁ + ε


    多余变量模型  y = α₀ + α₁x₁ + α₂x₂ + ν


    应有 α₂ = 0， α₁ = β₁， ν = ε


    辅助回归模型  x₂ = γ₀ + γ₁x₁ + e


    事实上，ν 和 ε 都满足 MLR3（严格外生解释变量）'
  merge: -1
