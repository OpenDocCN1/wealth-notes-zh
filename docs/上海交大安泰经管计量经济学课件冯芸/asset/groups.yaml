  - '[PAGE 497]


    # 如何补救？


    +   - 修正OLS估计量的方差公式

    +     - 利用正确的公式计算普通最小二乘估计值的方差（怀特异方差校正）


    +   - 寻找新的估计方法

    +     - 加权最小二乘法WLS：对取自较小（大）方差总体的观察值以更大（小）的权重。'
  - '[PAGE 498]


    # 对原模型进行变换


    $y_i = \beta_0 + \beta_1 x_i + u_i$


    假定已知 $\sigma_i^2 = Var(u_i \mid x_i) = \sigma^2 h(x_i)$


    $\frac{y_i}{\sqrt{h_i}} = \beta_0 \frac{1}{\sqrt{h_i}} + \beta_1 \frac{x_i}{\sqrt{h_i}}
    + \frac{u_i}{\sqrt{h_i}}$


    $u_i^* = \frac{u_i}{\sqrt{h_i}}$


    $Var(u_i^* \mid \cdot) = Var\left(\frac{u_i}{\sqrt{h_i}} \mid \cdot\right) = \frac{Var(u_i)}{h_i}
    = \sigma^2$'
  - '[PAGE 499]


    # 对原模型进行变换（续）


    $y_i^* = \frac{y_i}{\sqrt{h_i}},\; x_{0i}^* = \frac{1}{\sqrt{h_i}},\; x_{1i}^*
    = \frac{x_i}{\sqrt{h_i}},\; u_i^* = \frac{u_i}{\sqrt{h_i}}$


    $y_i^* = \beta_0 x_{0i}^* + \beta_1 x_{1i}^* + u_i^*$'
  - '[PAGE 500]


    对变换后的模型 运用OLS法，即

    \[ \min_{\hat{\beta}_0,\hat{\beta}_1} \sum (u_i^*)^2 = \min_{\hat{\beta}_0,\hat{\beta}_1}
    \sum (y_i^* - \beta_0 x_{0i}^* - \beta_1 x_{1i}^*)^2 \]

    \[ = \min_{\hat{\beta}_0,\hat{\beta}_1} \sum \frac{1}{h_i} (y_i - \beta_0 - \beta_1
    x_i)^2 \]

    \[ = \min_{\hat{\beta}_0,\hat{\beta}_1} \sum \frac{1}{h_i} u_i^2 \]

    权系数 $w_i = \frac{1}{h_i}$'
