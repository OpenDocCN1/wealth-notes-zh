    # 三、从一元到多元


    $y_i = \hat{\beta}_0 + \hat{\beta}_1 x_{1i} + \hat{\beta}_2 x_{2i} + e_i$


    $\min_{\hat{\beta}_0,\hat{\beta}_1,\hat{\beta}_2} \sum e_i^2$


    $= \min_{\hat{\beta}_0,\hat{\beta}_1,\hat{\beta}_2} \sum \left(y_i - \hat{\beta}_0
    - \hat{\beta}_1 x_{1i} - \hat{\beta}_2 x_{2i}\right)^2$'
  - '[PAGE 212]


    ```

    $$\frac{\partial(\sum e_i^2)}{\partial(\hat{\beta}_0)}=0 \qquad \frac{\partial(\sum
    e_i^2)}{\partial(\hat{\beta}_1)}=0 \qquad \frac{\partial(\sum e_i^2)}{\partial(\hat{\beta}_2)}=0$$

    ```


    ```

    $$\left\{\begin{aligned}\sum y_i&=\sum(\hat{\beta}_0+\hat{\beta}_1x_{1i}+\hat{\beta}_2x_{2i})\\\sum
    y_i x_{1i}&=\sum x_{1i}(\hat{\beta}_0+\hat{\beta}_1x_{1i}+\hat{\beta}_2x_{2i})\\\sum
    y_i x_{2i}&=\sum x_{2i}(\hat{\beta}_0+\hat{\beta}_1x_{1i}+\hat{\beta}_2x_{2i})\end{aligned}\right.$$

    ```


    ```

    $$\bar{y}=\hat{\beta}_0+\hat{\beta}_1\bar{x}_1+\hat{\beta}_2\bar{x}_2$$


    $$\sum e_i\cdot1=0$$


    $$\sum e_i x_{1i}=0$$


    $$\sum e_i x_{2i}=0$$

    ```


    ![](img/27e6f65397bb7fd3eced98a716a58f50_212_0.png)'
  - '[PAGE 213]


    $$\hat{\beta}_0=\bar{y}-\hat{\beta}_1\bar{x}_1-\hat{\beta}_2\bar{x}_2$$


    $$\hat{\beta}_1=\frac{\sum \dot{y}_i\dot{x}_{1i}\sum \dot{x}_{2i}^{2}-\sum \dot{y}_i\dot{x}_{2i}\sum
    \dot{x}_{1i}\dot{x}_{2i}}{\sum \dot{x}_{1i}^{2}\sum \dot{x}_{2i}^{2}-\left(\sum
    \dot{x}_{1i}\dot{x}_{2i}\right)^2}$$


    $$\hat{\beta}_2=\frac{\sum \dot{y}_i\dot{x}_{2i}\sum \dot{x}_{1i}^{2}-\sum \dot{y}_i\dot{x}_{1i}\sum
    \dot{x}_{1i}\dot{x}_{2i}}{\sum \dot{x}_{1i}^{2}\sum \dot{x}_{2i}^{2}-\left(\sum
    \dot{x}_{1i}\dot{x}_{2i}\right)^2}$$'
  - '[PAGE 214]


    β̂₁ 或 β̂_{y1.2} = [∑ ẏ_i ẋ_{1i} ∑ ẋ_{2i}² - ∑ ẏ_i ẋ_{2i} ∑ ẋ_{1i} ẋ_{2i}]
    / [∑ ẋ_{1i}² ∑ ẋ_{2i}² - (∑ ẋ_{1i} ẋ_{2i})²] = [∑ ẏ_i ẋ_{1i} / ∑ ẋ_{1i}²
    - ∑ ẏ_i ẋ_{2i} / ∑ ẋ_{2i}² ∑ ẋ_{1i} ẋ_{2i} / ∑ ẋ_{1i}²] / [1 - (∑ ẋ_{1i}
    ẋ_{2i})² / (∑ ẋ_{1i}² ∑ ẋ_{2i}²)]

    = [y 对 x₁ 回归估计值 - y 对 x₂ 回归估计值 × x₂ 对 x₁ 回归估计值] / (1 - r₁₂²)

    = [r_{y1} S_y / S₁ - r_{y2} S_y / S₂ r₁₂ S₂ / S₁] / (1 - r₁₂²)

    = (r_{y1} - r_{y2} r₁₂) / (1 - r₁₂²) 或者 = [β̂_{y1} - β̂_{y2} β̂_{21}] / (1 - r₁₂²)

    (1 - r₁₂²) S₁ / S_y


