  md: "\n- 假设测算出来的边际消费倾向为0.8，上一年度的GDP达到80,000亿，离充分就业下的潜在GDP还差2%，即差1,632亿，政府购买支出需要增加多少实现充分就业下的产量水平？\n\
    \n```\nΔG = ΔY / 财政支出乘数 = 1632 / 1/(1−0.8) = 326.4\n```\n\n## 个人决策\n\n– 读研还是找工作：多接受一年的教育可以增加多少收入（即教育的回报，Mroz,\
    \ 1987; Blackburn and Neumark, 1992; Card, 1995）\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_103_0.png)\n\
    \n- 要回答以上问题都要对各种经济变量的相互作用关系进行具体的测算，这正是计量经济学要解决的主要问题。\n- 对经济变量之间关系的测算，还可以完成对经济理论或假说的检验\n\
    \n- 要回答以上问题都要对各种经济变量的相互作用关系进行具体的测算，这正是计量经济学要解决的主要问题。\n- 对经济变量之间关系的测算，还可以完成对经济理论或假说的检验\n\
    \n## 案例一\n\n## 什么样的股权结构更有利于公司业绩的改进？\n\n- 公司金融：股权结构与公司绩效\n\n- Shleifer和Vishny（1986）：股权集中型优于股权分散型\n\
    \  - 股价上涨带来的财富使控股股东和中小股东的利益趋于一致\n\n- La Porta（1999）：股权分散型优于股权集中型\n  - 控股股东的利益和外部小股东的利益常常不一致。\n\
    \n- Note: Andrei Shleifer、Rafael La Porta、Robert W. Vishny、Florencio Lopez de\
    \ Silanes\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_107_0.png)\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_107_1.png)\n\
    \n## 案例二\n\n什么样的金融体系更有利于促\n进经济增长？\n\n- 发展经济学：金融结构与经济增长\n  - 银行业内部结构\n    - 银行业越集中越好（防止过度竞争）\n\
    \    - 银行业越集中越不好（垄断）\n  - 金融市场的融资结构\n    - 股市融资好（银行天生谨慎倾向性）\n    - 银行融资好（股市投资者过于分散）\n\
    \    - FLI学派（互补）\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_109_0.png)\n\n##\
    \ 案例三\n\n## 上市公司政治关系的经济后果\n\n- 两个相对立的假说\n  - 显著收益：更低的实际所得税率、贷款融资便利性、政策性补贴\n  -\
    \ 政策性负担：过多的行政干预造成员工冗余、市场定价扭曲、不合理的负债水平、承担更多的社会目标\n\n## 案例四\n\n## 上市公司融资约束与系统风险\n\
    \n- 两个相对立的假说\n  - 融资约束→减少投资→减少系统性风险\n  - 融资约束→选择资产抵押→抵押贬值（流动性风险）+信贷收缩→增加系统性风险\n\
    \n## 案例五\n\n## 经济形势会影响人们进入劳动市场的决定吗？\n\n14-15秋\n\n第一章\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_114_0.png)\n\
    \n- 两个相对立的假说\n  - 受挫一工人假说（Discouraged-Worker Hypothesis）：当经济形势恶化时，许多失业工人放弃寻找工作的愿望并退出劳动力市场。\n\
    \  - 增加一工人假说（Added-Worker Hypothesis）：当经济形势恶化时，许多非劳动力人口可能会由于养家的人失去工作而决定进入劳动力市场\n\
    \n- 计量经济学有助于在积极意义上驱散公众对经济学学科（数量的或非数量的）不良印象：这门学科犹如一个空箱子，即使有打开它的钥匙，对其空洞的内容，任何十位经济学家都会作出十一种解释。（Adrian\
    \ C. Darnell, J. Lynne Evans, 1990）\n\n## 计量经济学的的重要性\n\n- Econometrics一词最早由挪威经济学家R.\
    \ Frish于1926年模仿biometrics提出。\n- 一般认为，1930年12月29日世界计量经济学会的成立和由她创办的学术刊物《Econometrica》于1933年的正式出版，标志着计量经济学作为一门独立的学科的诞生\n\
    \n- 计量经济学在经济学学科中的重要性\n  - 克莱因（R. Klein）：“计量经济学已经在经济学学科中居于最重要的地位”；“在大多数大学和学院中，计量经济学的讲授已经成为经济学课程表中最有权威的一部分”。\n\
    \  - 萨缪尔森（P. Samuelson）：“第二次世界大战后的经济学是计量经济学的时代”\n\n• 1969-2012年共有71位经济学家获奖，直接因为对计量经济学的创立和发展作出贡献而获奖者达13人，居经济学各分支学科之首。因为在研究中应用计量经济学方法而获奖者占获奖总数的三分之二。\n\
    \n![](img/27e6f65397bb7fd3eced98a716a58f50_119_0.png)\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_119_1.png)\n\
    \n- • 计量经济学在国外教育体系中的地位\n  – 美国的经济学本科教育：二年级经济学专业的学生首先必修计量经济学（包括概率统计）\n  – 美国的博士生教育：计量经济学作为第一年标准化课程，要上一年。综合性考试（又称资格考试）考三门，这是在美国读博士的第一关。\n\
    \n- 计量经济学在国内教育体系中的地位\n  - 1998年教育部高等学校经济学学科教学指导委员会将计量经济学首次列入经济类专业核心课程。\n  - 国内著名学府经济学院（和/或）管理学院，都在本科生和研究生中开设了计量经济学课程，其中有不少院校把它作为学位课或必修课。\n\
    \n## 主要内容\n\n- 为什么需要计量经济学\n- 计量分析的一般过程\n- 课程定位与计划安排\n\n## 二、计量分析的一般过程\n\n- 计量经济学(Econometrics)，意即\
    \ “经济测量”。\n\n## 七个步骤\n\n- 根据经济理论或假说建立数理模型\n- 变量度量和数据收集\n- 建立计量模型\n- 估计参数\n- 模型的准确性\n\
    - 假设检验（检验理论）\n- 模型应用（结构分析、经济预测、政策评价）\n\n## 第一步：建立数理模型\n\ny = f(x)\n\n数理模型\n\n\
    ## 第二步：变量度量和数据收集\n\n- 失业率（Unemployment Rate, UNR）度量经济形势\n- 劳动力参与率（Labor Force\
    \ Participation Rate, LFPR）度量劳动力的参与\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_126_0.png)\n\
    \n## 关于数据\n\n- 三种常见的统计数据类型\n  - 横截面数据：给定时点上的随机抽样\n  - 时间序列数据：同一观测对象在不同时点上的观测样本\n\
