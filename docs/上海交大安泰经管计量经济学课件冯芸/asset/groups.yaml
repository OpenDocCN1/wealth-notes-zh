    ## 理论假说


    对私营企业施加法律和金融上的约束以使乡镇企业受益的做法可能会迫使私营企业以别的方式来寻求法律保护和金融资源，其中包括与外企联盟。这可能会导致私营企业在与外企共同建立合资企业时做出更多的股权让步。


    ![](img/27e6f65397bb7fd3eced98a716a58f50_425_0.png)


    ## 假说一和假说二


    - 不同政策待遇的企业外国股权比例存在差异

    - 私营企业参与的合资企业比乡镇企业参与的合资企业，其外国股权比例更高。

    - 对资金有更大需求的企业比更小需求的企业，其外国股权比例更高


    ## 假说三和假说四


    - 由于浙江省对待不同企业的政策差异小于江苏省，在浙江省所观察到的假说一和假说二所描述的效果会弱于江苏省。

    - 浙江省实力相对江苏省更强的私营企业，会吸引当地的乡镇企业更多地与之合作，而不是与外资企业合作，从整体上减少外国股权比例。


