    \n  $\\bar{X} = \\frac{1}{n} \\sum_{i=1}^{n} X_i$\n\n  $X^* = \\frac{1}{n+1} \\\
    sum_{i=1}^{n} X_i \\qquad E(X^*) = \\frac{n}{n+1} \\mu_X$\n"
  mdcn: "\n## 相关系数：两个随机变量的线性关系\n\n$$\\rho_{XY}=\\frac{\\operatorname{Cov}(X,Y)}{\\\
