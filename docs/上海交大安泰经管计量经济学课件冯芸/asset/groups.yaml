    \ + D_t − P_{t−1}) / P_{t−1}\n\nr_mt 是市场收益率（S&P 500 指数）\n\nβ₁ 是系统性风险度量指标\n\n数据收集：1986\
    \ 年 1 月至 1990 年 12 月的月度收益率数据\n\n以 Lincoln National Insurance Corporation 为例\n\n\
    | 变量 | 系数 | 标准误 | t统计量 | 概率 |\n|---|---:|---:|---:|---:|\n| C | -0.002137 | 0.009078\
    \ | -0.235388 | 0.8147 |\n| MARKET | 0.973233 | 0.172523 | 5.641188 | 0.0000 |\n\
    \n因变量: LINCOLN  \n方法: 最小二乘  \n日期: 09/10/11   时间: 13:33  \n样本: 1 60  \n包含观测数: 60\n\
    \n| 统计量 | 数值 | 统计量 | 数值 |\n|---|---:|---|---:|\n| R-squared | 0.354286 | Mean\
    \ dependent var | 0.005075 |\n| Adjusted R-squared | 0.343153 | S.D. dependent\
    \ var | 0.085901 |\n| S.E. of regression | 0.069619 | Akaike info criterion |\
    \ -2.458790 |\n| Sum squared resid | 0.281116 | Schwarz criterion | -2.388978\
    \ |\n| Log likelihood | 75.76369 | Hannan-Quinn criter. | -2.431483 |\n| F-statistic\
    \ | 31.82300 | Durbin-Watson stat | 2.458020 |\n| Prob(F-statistic) | 0.000001\
    \ | | |\n\n## 三、从一元到多元\n\n$y_i = \\hat{\\beta}_0 + \\hat{\\beta}_1 x_{1i} + \\\
    hat{\\beta}_2 x_{2i} + e_i$\n\n$\\min_{\\hat{\\beta}_0,\\hat{\\beta}_1,\\hat{\\\
    beta}_2} \\sum e_i^2$\n\n$= \\min_{\\hat{\\beta}_0,\\hat{\\beta}_1,\\hat{\\beta}_2}\
    \ \\sum \\left(y_i - \\hat{\\beta}_0 - \\hat{\\beta}_1 x_{1i} - \\hat{\\beta}_2\
    \ x_{2i}\\right)^2$\n\n```\n$$\\frac{\\partial(\\sum e_i^2)}{\\partial(\\hat{\\\
    beta}_0)}=0 \\qquad \\frac{\\partial(\\sum e_i^2)}{\\partial(\\hat{\\beta}_1)}=0\
    \ \\qquad \\frac{\\partial(\\sum e_i^2)}{\\partial(\\hat{\\beta}_2)}=0$$\n```\n\
    \n```\n$$\\left\\{\\begin{aligned}\\sum y_i&=\\sum(\\hat{\\beta}_0+\\hat{\\beta}_1x_{1i}+\\\
    hat{\\beta}_2x_{2i})\\\\\\sum y_i x_{1i}&=\\sum x_{1i}(\\hat{\\beta}_0+\\hat{\\\
    beta}_1x_{1i}+\\hat{\\beta}_2x_{2i})\\\\\\sum y_i x_{2i}&=\\sum x_{2i}(\\hat{\\\
    beta}_0+\\hat{\\beta}_1x_{1i}+\\hat{\\beta}_2x_{2i})\\end{aligned}\\right.$$\n\
    ```\n\n```\n$$\\bar{y}=\\hat{\\beta}_0+\\hat{\\beta}_1\\bar{x}_1+\\hat{\\beta}_2\\\
    bar{x}_2$$\n\n$$\\sum e_i\\cdot1=0$$\n\n$$\\sum e_i x_{1i}=0$$\n\n$$\\sum e_i\
    \ x_{2i}=0$$\n```\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_212_0.png)\n\n$$\\\
    hat{\\beta}_0=\\bar{y}-\\hat{\\beta}_1\\bar{x}_1-\\hat{\\beta}_2\\bar{x}_2$$\n\
    \n$$\\hat{\\beta}_1=\\frac{\\sum \\dot{y}_i\\dot{x}_{1i}\\sum \\dot{x}_{2i}^{2}-\\\
    sum \\dot{y}_i\\dot{x}_{2i}\\sum \\dot{x}_{1i}\\dot{x}_{2i}}{\\sum \\dot{x}_{1i}^{2}\\\
    sum \\dot{x}_{2i}^{2}-\\left(\\sum \\dot{x}_{1i}\\dot{x}_{2i}\\right)^2}$$\n\n\
    $$\\hat{\\beta}_2=\\frac{\\sum \\dot{y}_i\\dot{x}_{2i}\\sum \\dot{x}_{1i}^{2}-\\\
    sum \\dot{y}_i\\dot{x}_{1i}\\sum \\dot{x}_{1i}\\dot{x}_{2i}}{\\sum \\dot{x}_{1i}^{2}\\\
    sum \\dot{x}_{2i}^{2}-\\left(\\sum \\dot{x}_{1i}\\dot{x}_{2i}\\right)^2}$$\n\n\
    β̂₁ 或 β̂_{y1.2} = [∑ ẏ_i ẋ_{1i} ∑ ẋ_{2i}² - ∑ ẏ_i ẋ_{2i} ∑ ẋ_{1i} ẋ_{2i}]\
    \ / [∑ ẋ_{1i}² ∑ ẋ_{2i}² - (∑ ẋ_{1i} ẋ_{2i})²] = [∑ ẏ_i ẋ_{1i} / ∑ ẋ_{1i}²\
    \ - ∑ ẏ_i ẋ_{2i} / ∑ ẋ_{2i}² ∑ ẋ_{1i} ẋ_{2i} / ∑ ẋ_{1i}²] / [1 - (∑ ẋ_{1i}\
    \ ẋ_{2i})² / (∑ ẋ_{1i}² ∑ ẋ_{2i}²)]\n= [y 对 x₁ 回归估计值 - y 对 x₂ 回归估计值 × x₂ 对\
    \ x₁ 回归估计值] / (1 - r₁₂²)\n= [r_{y1} S_y / S₁ - r_{y2} S_y / S₂ r₁₂ S₂ / S₁] /\
    \ (1 - r₁₂²)\n= (r_{y1} - r_{y2} r₁₂) / (1 - r₁₂²) 或者 = [β̂_{y1} - β̂_{y2} β̂_{21}]\
    \ / (1 - r₁₂²)\n(1 - r₁₂²) S₁ / S_y\n\n《计量经济学》第三章\n\n"
