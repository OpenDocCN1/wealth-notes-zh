  - '[PAGE 232]


    # 样本均值的抽样分布或概率分布


    若 $y_1，y_2，……，y_n$ 是来自于均值为 $\mu$，方差为 $\sigma^2$ 的正态总体的一组随机样本，则样本均值（总体均值的估计量）也服从正态分布。


    $$\bar{y}\sim N\left(\mu,\frac{\sigma^2}{n}\right)$$'
  - '[PAGE 233]


