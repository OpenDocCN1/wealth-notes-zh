    \n## 第二部分 横截面数据模型\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_162_0.png)\n\n###\
    \ 第二部分主要章节\n\n- 线性回归的基本思想\n- 线性回归模型的统计推断\n- 模型的选择\n- 包含虚拟变量的回归模型\n- 异方差\n- 内生性\n\
    \n1. 理论或假设的陈述。\n2. 变量/度量和数据收集。\n3. 根据经济理论或假设建立数理模型。\n\n   进行图形观察。\n\n   $y = \\\
    beta_0 + \\beta_1 x$\n\n4. 建立计量模型。\n\n   计量模型：随机方程。\n\n   $y = \\beta_0 + \\beta_1\
    \ x + u$\n\n5. 参数估计。\n6. 模型选择。\n7. 假设检验。\n8. 模型应用。\n\n- 第二章 线性回归分析的基本思想\n- 第五章\
    \ 包含虚拟变量的回归模型\n- 第六章 异方差\n- 第七章 内生性\n- 第四章 模型选择\n- 《计量经济学》第二章\n- 13-14秋\n\n##\
    \ 第二章 线性回归分析的基本思想\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_165_0.png)\n\n###\
    \ 主要内容\n\n- 回归分析的含义\n- 总体回归函数\n- 随机误差项的含义\n- 线性回归的含义\n- 样本回归函数\n\n### ① 理论或假说的陈述\n\
    \n### ② 变量度量和数据收集\n\n### ③ 根据经济理论或假说建立数量模型\n\n进行图形观察\n\n数学模型：确定性函数\n\n$y = \\\
    beta_0 + \\beta_1 x$\n\n计量模型：随机方程\n\n经典计量模型：线性回归模型\n\n### ④ 建立计量模型\n\n$y = \\\
    beta_0 + \\beta_1 x + u$\n\n线性函数的优越性\n\ny 和 x 并非一对一确定关系，而是通过随机误差项联系的函数形式。\n\n\
    ### ⑤ 参数估计\n\n- OLS\n- ML\n- GMM\n\n模型是靠谱吗？还有其它因素需要考虑吗？\n\n### ⑥ 假设检验\n\n### ⑦\
    \ 模型选择\n\n估计量的统计分布；估计质量\n\n### ⑧ 模型应用\n\n不同类型数据\n\n- 截面数据模型\n- 时间序列模型\n- 混合数据模型\n\
    - 虚拟自变量模型\n- 虚拟响应变量模型\n- MLR\n- TS\n- PD\n- 多重共线性\n- 异方差\n- 内生性\n- 随机效应\n- 固定效应\n\
    - 时间趋势\n- 季节性\n- 弱相依性\n- 高度持久性\n- 误差项相关\n\n### 一、回归分析的含义\n\n- 回归分析是用来研究一个变量（被解释变量或应变量）与另一个或多个变量（解释变量或自变量）之间的（因果）关系\n\
    \n- 为什么给定收入水平（x），仍会观察到不同的y？\n- x并非唯一影响y的因素\n- “其他因素”的数学处理：$y=f(x)+u$\n- 但x是重要的具有系统性影响的因素\n\
    - 数学处理：对条件均值建模\n\n  $E(u \\mid x)=0$\n\n  $E(y \\mid x)=f(x)$\n\n- y围绕它的条件均值上下波动\n\
    \n  $y = E(y \\mid x) + u$\n\n每周消费支出\n\n每周收入\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_171_0.png)\n\
    \n### 二、总体回归函数\n\n$y = E(y \\mid x) + u$\n\n$E(y \\mid x) = f(x)$\n\n- $f(x)$称为总体回归函数\n\
    \n典型地 $f(x) = \\beta_0 + \\beta_1 x$\n\n- 此时的$f(x)$称为线性回归函数\n- $\\beta_0$、$\\\
    beta_1$：待估参数或回归系数\n  - $\\beta_0$又称为截距项\n  - $\\beta_1$又称为斜率项\n\n### 三、随机误差项 $u$\
    \ 的含义\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_174_0.png)\n\n- 在解释变量中被忽略的因素的影响\n\
    - 变量观测值的观测误差的影响\n- 其他随机因素的影响\n\n### $E(u \\mid x) = 0$ 意味着什么？\n\n再利用重期望律（*Iterative\
    \ Law of Expectation*，以下简称ILE）\n\n$E(u) = E_x [ E(u \\mid x) ] = 0$\n\n$Cov(u,\
    \ x) = E(u x) = E_x [ E(u x \\mid x) ] = E_x [ x \\cdot E(u \\mid x) ] = 0$\n\n\
    - 如果随机误差项的条件期望为零，那么随机误差项的无条件期望也为零。\n- 随机误差项与解释变量之间不（线性）相关的结论。\n- y的变动由两部分组成：\n\
    \  - 系统的或确定的部分 $E(y \\mid x)$\n  - 非系统的或随机的部分 $u$\n\n### 四、线性回归的含义\n\n- 参数线性\n\
    \n  $E(y \\mid x) = f(x) = \\beta_0 + \\beta_1 x^2$\n\n- 解释变量线性\n\n  $E(y \\mid\
    \ x) = f(x) = \\beta_0 + \\beta_1 \\frac{1}{x}$\n\n- “线性”回归指\n\n  $E(y \\mid x)\
    \ = f(x) = \\beta_0 + \\beta_1^2 x$\n\n  对参数而言线性\n\n- 回归分析关键在于对 $f(x)$，即被解释变量条件期望函数\
    \ $E(y \\mid x)$（又称为总体回归函数）的识别上来。\n- 即利用有限的样本数据信息尽可能准确地认识总体参数，称为统计推断过程\n\n###\
    \ 样本回归函数（SRF）：$\\hat{y}_i = \\hat{\\beta}_0 + \\hat{\\beta}_1 x_i$\n\n残差项：$\\\
    hat{u}_i = e_i = y_i - \\hat{y}_i$\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_180_0.png)\n\
    \n### 样本的随机性\n\n| y | x | y | x |\n|---|---|---|---|\n| 70 | 80 | 55 | 80 |\n\
    | 65 | 100 | 88 | 100 |\n| 90 | 120 | 90 | 120 |\n| 95 | 140 | 80 | 140 |\n| 110\
    \ | 160 | 118 | 160 |\n| 115 | 180 | 120 | 180 |\n| 120 | 200 | 145 | 200 |\n\
    | 140 | 220 | 135 | 220 |\n| 155 | 240 | 145 | 240 |\n| 150 | 260 | 175 | 260\
    \ |\n\n### 参数估计值的随机性\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_182_0.png)\n\n\
    ### 小结\n\n- 回归分析\n  - 从经济含义来看就是要寻找主要因果关系，因此它既承认真实世界的多向因果关系，又将重点置于主要矛盾。\n  - 从数学处理来看就是要对条件均值建模。\n\
    \  - 条件均值模型的选择中最为经典的是线性函数，称为线性回归模型，是指对参数而言线性。\n- 回归分析\n  - 回归分析关键在于对 $f(x)$（又称为总体回归函数）的识别，需要利用统计推断的方法\n\
    - 接下来的第三章介绍统计推断的具体技术手段\n\n## 第三章 线性回归模型的统计推断\n\n### 主要内容\n\n- 最小二乘原理\n- 样本回归线的性质\n\
