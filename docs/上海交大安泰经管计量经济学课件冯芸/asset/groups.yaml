    个 β₀ 和 β₁, 分别记为 β̂_ols,0 和 β̂_ols,1, 并分别计算它们的样本均值和样本方差。


    +   2） 利用加权最小二乘法估计上述模型参数, 并且循环 10000 次, 得到 10000 个 β₀ 和 β₁ 的估计值, 分别记为 β̂_wls,0
