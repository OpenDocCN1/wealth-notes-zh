    ## 概率论与统计学基础


    ## 主要内容


    - 概率和概率分布

    - 概率分布的特征

    - 一些重要的概率分布

    - 统计推断：参数估计与假设检验


    ## （一）概率和概率分布


    - *随机试验*：至少有两个可能结果，但不确定哪一个结果会出现的过程。

    - 例如抛硬币（正反两面）、掷骰子（六面体）、从一副纸牌（54张）中抽取一张


    - **事件**：随机试验的可能结果组成的集合，它是样本空间的一个子集。

    - 如果两个事件不能同时发生，则两个事件称为**互斥的**。


    - 如果一个事件的发生与另一事件的发生可能性相同，则两个事件称为*等可能性*的。

    - 如果可穷举试验的所有可能结果，事件称为*穷举事件*。


    - 随机变量：取值由试验结果决定的变量

    - 概率的古典定义（随机试验的*n*个基本结果互斥且等可能发生）：


    P(A) = 属于事件A的基本结果的个数 / 所有基本结果总数


    概率的频率定义：如果在n次试验或n个观察值中，m次属于事件A，假定n足够大，那么事件A的概率P(A)就简单地等于m/n（即频率）


    ## 考试分数的频率分布图


    ![](img/27e6f65397bb7fd3eced98a716a58f50_9_0.png)


    ## GDP的频数分布图（直方图或经验分布图）


    ![](img/27e6f65397bb7fd3eced98a716a58f50_10_0.png)


    | 统计项 | 数值 |

    |---|---:|

    | Series | GDP |

    | Sample | 1 214 |

    | Observations | 187 |

    | Mean | 3.71e+11 |

    | Median | 2.41e+10 |

    | Maximum | 1.50e+13 |

    | Minimum | 35804372 |

    | Std. Dev. | 1.37e+12 |

    | Skewness | 7.799004 |

    | Kurtosis | 75.73821 |

    | Jarque-Bera | 43120.22 |

    | Probability | 0.000000 |


    ![](img/27e6f65397bb7fd3eced98a716a58f50_12_0.png)


    ## 概率的性质


    - 0 ≤ P(A) ≤1


    - 若事件A，B，C，......为互斥事件，则事件和的概率等于事件概率之和


    - 若事件A，B，C，......为互斥事件，且为一完备事件组，则事件和的概率为1


    - 如果事件 A，B，C，……不是互斥事件，则 P(A+B)=P(A)+P(B)-P(AB)

    - **条件概率**：在事件 B 发生条件下，事件 A 发生的概率


    $P(A\mid B)=\frac{P(AB)}{P(B)}$


    - **概率分布或概率密度函数：** 随机变量的可能值以及与之相对应的概率值。

    - 离散型随机变量的概率密度函数


    ```

    f(X) = { P(X = x_i), 当 i = 1,2,3,⋯,n

    0, 当 X ≠ x_i }

    ```


    | 抛两枚硬币正面朝上的次数X | f(X) |

    |---|---|

    | 0 | 1/4 |

    | 1 | 1/2 |

    | 2 | 1/4 |

    | 总计 | 1 |


    ## 连续型随机变量的概率密度函数


    ![](img/27e6f65397bb7fd3eced98a716a58f50_18_0.png)


    ## 累积分布函数


    $$F(X)=P(X\leq x)$$


    ## 涉及多个随机变量


    - 联合概率密度函数


    f(X,Y) = P(X = x, Y = y)


    ## 双变量的频数分布


    | 收益（Y）\\等级（X） | 1（Bbb） | 2（Bb） | 3（B） | 总计 |

    |---|---:|---:|---:|---:|

    | 8.5 | 13 | 5 | 0 | 18 |

    | 11.5 | 2 | 14 | 2 | 18 |

    | 17.5 | 0 | 1 | 13 | 14 |

    | 合计 | 15 | 20 | 15 | 50 |


    ## 联合概率和无条件概率


    | 收益（Y）\\等级（X） | 1（Bbb） | 2（Bb） | 3（B） | 总计 |

    |---|---:|---:|---:|---:|

    | 8.5 | 0.26（=13/50） | 0.10 | 0.00 | 0.36 |

    | 11.5 | 0.04 | 0.28 | 0.04 | 0.36 |

    | 17.5 | 0.00 | 0.02 | 0.26 | 0.28 |

    | 合计 | 0.30 | 0.40 | 0.30 | 1.00 |


    ## ■ **非条件边缘概率密度函数**


    $f(X),\ f(Y)$


    $f(X)=\int_Y f(X,Y)\,dY$


    | X（债券等级） | f(x) | Y（债券收益%） | f(Y) |

    |---|---:|---:|---:|

    | 1 | 0.30 | 8.5 | 0.36 |

    | 2 | 0.40 | 11.5 | 0.36 |

    | 3 | 0.30 | 17.5 | 0.28 |

    | 总计 | 1.00 | 总计 | 1.00 |


    ## 条件边缘概率密度函数


    f(Y|X) = P(Y = y | X = x) = f(X,Y) / f(X)


    f(X|Y) = P(X = x | Y = y) = f(X,Y) / f(Y)


    ## 条件概率 $f(Y|X)$


    |  | 等级（X） | 1\n(Bbb) | 2\n(Bb) | 3\n(B) | 总计 |

    |---|---|---|---|---|---|

    | 收益（Y） |  |  |  |  |  |

    | 8.5 | 13/15=0.867 | 5/20=0.25 | 0/15=0 | 18 |

    | 11.5 | 2/15=0.133 | 14=0.70 | 2/15=0.133 | 18 |

    | 17.5 | 0/15=0 | 1=0.05 | 13=0.867 | 14 |

    | 合计 | 15 | 20 | 15 | 50 |


    - **统计独立性**：如果两个随机变量的联合概率等于两个边缘概率之积，称这两个变量具有统计独立性。

    - 前例中的债券等级与债券收益是独立随机变量吗？


    ## （二）概率分布的特征


    - 概率密度的矩

    - 期待：随机变量的密度中心


    E(X) = Σₓ X f(X)


    E(X) = ∫ x f(x) dx


    n阶原点矩: ∫ xⁿ f(x) dx


    ## 期望值的性质


    - 常数的期望值为本身： $E(b)=b$


    - 随机变量的和的期望值等于随机变量期望值的和： $E(X+Y)=E(X)+E(Y)$


    - $E(X/Y) \neq E(X)/E(Y)$； $E(XY) \neq E(X)E(Y)$； $E(X^2) \neq [E(X)]^2$


    - $E(aX+b)=aE(X)+b$


    - **多元概率分布的期望值:**


    $$E[XY]=\sum_x\sum_y xyf(XY)$$


    - **条件期望:**


    $$E[X\mid Y=y]=\sum_x xf(X\mid Y=y)$$


    $$E[Y\mid X=x]=\sum_y yf(Y\mid X=x)$$


    - ■ 方差：随机变量的分散程度


    $Var(X) = \sigma_X^2 = E(X - \mu_X)^2$


    $n$阶中心矩: $\int (x - \mu)^n f(x) dx$


    ## 方差的性质


    - $\operatorname{Var}(X\pm Y)=\operatorname{Var}(X)+\operatorname{Var}(Y)\pm 2\operatorname{Cov}(X,Y)$

    - $\operatorname{Var}(aX+b)=a^2\operatorname{Var}(X)$

    - $\operatorname{Var}(X)=E(X^2)-[E(X)]^2$


    条件方差:


    Var[Y | X] = E{[Y − E(Y | X)] | X}²


    ## 协方差：两个随机变量的共同变动


    $$\operatorname{Cov}(X,Y)=E(X-\mu_X)(Y-\mu_Y)$$

    $$=E(XY)-\mu_X\mu_Y$$

    '
