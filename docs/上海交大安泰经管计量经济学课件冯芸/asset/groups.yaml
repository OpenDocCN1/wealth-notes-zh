    \n- 个股近期价格上涨幅度越大，投资者卖出可能性越大\n- 投资者资金规模越小，近期价格上涨对投资者卖出行为影响越大，且影响时间越长\n- 个股价格的下跌对卖出倾向影响并不显著\n\
