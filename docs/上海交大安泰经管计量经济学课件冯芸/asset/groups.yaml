    \ 样本均值的抽样分布或概率分布\n\n- 若 $X_1，X_2，……，X_n$ 是来自于均值为 $\\mu$，方差为 $\\sigma^2$ 的正态总体的一个随机样本，则样本均值也服从正态分布\n\
    \n$$\\bar{X} \\sim N\\left(\\mu, \\frac{\\sigma^2}{n}\\right)$$\n\n- 中心极限定理：若\
    \ $X_1, X_2, ......, X_n$ 是来自于均值为 $\\mu$, 方差为 $\\sigma^2$ 的任一总体的随机样本，随着样本容量无限增大，则其样本均值趋于正态分布，其均值为\
    \ $\\mu$, 方差为 $\\sigma^2/n$\n\n### χ²分布\n\n- 定理：标准正态变量的平方服从自由度为1的χ²分布\n- 定理：若\
    \ $Z_1，Z_2，……，Z_k$ 是k个独立的标准正态变量，则它们的平方和服从自由度为k的χ²分布\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_50_0.png)\n\
    \n图 4-7 χ² 变量的密度函数\n\nf(χ²)\n概率密度\nχ²\nk=2\nk=5\nk=10\n\n- 定理：随机样本来自方差为 $\\sigma^2$\
    \ 的正态总体，样本容量为 $n$，样本方差为 $S^2$，可以证明\n\n$$(n-1)\\frac{S^2}{\\sigma^2} \\sim \\chi^2(n-1)$$\n\
    \n### t分布*\n\n$$\\bar{X} \\sim N\\left(\\mu, \\frac{\\sigma^2}{n}\\right)$$\n\n\
    $$\\frac{\\bar{X} - \\mu}{\\sigma / \\sqrt{n}} \\sim N(0,1)$$\n\n$$\\frac{\\bar{X}\
    \ - \\mu}{S / \\sqrt{n}} \\sim t(n-1)$$\n\nk=120（正态）\nk=20\nk=5\n0\nt\n\n图 4-6\
    \ 不同自由度下的 t 分布\n\n### F分布\n\n- **定理：** 随机样本 $X_1，X_2，……，X_m$ 来自均值为 $\\mu_X$，方差为\
    \ $\\sigma_X^2$ 的正态总体，随机样本 $Y_1，Y_2，……，Y_n$ 来自均值为 $\\mu_Y$，方差为 $\\sigma_Y^2$ 的正态总体，且两个样本相互独立。如果\
    \ $\\sigma_X^2=\\sigma_Y^2$，则\n\n$$\\frac{S_X^2}{S_Y^2}\\sim F(m-1,n-1)$$\n\n\
    ![](img/27e6f65397bb7fd3eced98a716a58f50_55_0.png)\n\n图 4-8 不同自由度下的 F 分布\n\n###\
    \ t分布、F分布、χ²分布与正态分布的关系\n\n- 若自由度充分大（至少为30），则t分布近似标准正态分布\n- 若 $n\\to\\infty$，$mF_{m,n}\\\
    sim\\chi^2(m)$\n- 若 $Z\\sim N(0,1)$ 和 $\\chi^2(m)$ 相互独立，则\n\n$$\\frac{Z}{\\sqrt{\\\
    chi^2/m}}\\sim t(m)$$\n\n- 自由度为 *k* 的 *t* 分布的平方服从自由度为（1，*k*）的 *F* 分布\n\n$$t_k^2\
    \ \\sim F_{1,k}$$\n\n- 若自由度 *k* 充分大，则 $\\chi^2(k)$ 分布近似标准正态分布\n\n$$Z=\\sqrt{2\\\
    chi^2}-\\sqrt{2k-1}\\sim N(0,1)$$\n\n## （四）统计推断：参数估计与假设检验\n\n- 统计推断的实质是从样本值归纳出总体值的过程\n\
    - 统计推断的两个重要方面：参数估计和假设检验\n\n### 统计推断：参数估计\n\n- NYSE共有3000只股票，从中随机抽取28只。假定市盈率服从正态分布，如何估计均值？\n\
    - 点估计\n\n$$\\bar{X}=\\frac{1}{28}\\sum_{i=1}^{28}X_i$$\n\n$$\\bar{X}=23.25,\\\
    quad S=9.49$$\n\n$$\\bar{X}\\sim N\\left(\\mu_X,\\frac{\\sigma^2}{n}\\right)$$\n\
    \n### 统计推断：假设检验\n\n$$H_0: \\mu_X = 20$$\n\n$$\\bar{X}\\sim N\\left(\\mu_X, \\\
    frac{\\sigma^2}{n}\\right)$$\n\n$$\\frac{\\bar{X}-\\mu_X}{S/\\sqrt{n}}\\sim t(n-1)$$\n\
    \n$$P\\left(-2.052\\leq\\frac{\\bar{X}-\\mu_X}{S/\\sqrt{n}}\\leq2.052\\right)=0.95$$\n\
    \n$$P(16.32\\leq\\bar{X}\\leq23.68)=0.95$$\n\n- 对于任一给定样本，不能同时做到犯这两种错误的概率最小\n-\
    \ 犯第一类错误的概率给定的情况下，减少犯第二类错误的概率，即给定 $\\alpha$，使检验的功效最大。\n\n### 区间估计\n\n$$\\bar{X}\
    \ \\sim N\\left(\\mu_X,\\frac{\\sigma^2}{n}\\right)$$\n\n$$\\frac{\\bar{X}-\\\
    mu_X}{S/\\sqrt{n}}\\sim t(n-1)$$\n\n$$P\\left(-2.052\\leq\\frac{\\bar{X}-\\mu_X}{S/\\\
    sqrt{n}}\\leq2.052\\right)=0.95$$\n\n$$P(19.57\\leq\\mu_X\\leq26.93)=0.95$$\n\n\
    - $19.57 \\leq \\mu_X \\leq 26.93$ 称为置信区间，\n- $1-\\alpha=0.95$ 称为置信系数，$\\alpha$\
    \ 称为显著性水平，或犯第一类错误的概率。\n\n### 置信区间法\n\n$$19.57 \\leq \\mu_X \\leq 26.93$$\n\n-\
    \ 接受区域\n- 拒绝区域\n- 临界值\n\n### 点估计量的性质\n\n- 线性：估计量是样本观察值的线性函数\n- 无偏性：$E(\\bar{X})\
    \ = \\mu_X$\n- 有效性：方差最小的估计量\n- 最优线性无偏估计量：估计量是线性的和无偏的，并且在所有线性无偏估计量中方差最小\n- 一致性：如果随着样本容量的逐渐增大，该估计量接近参数的真实值，称为一致估计量\n\
    \n  $\\bar{X} = \\frac{1}{n} \\sum_{i=1}^{n} X_i$\n\n  $X^* = \\frac{1}{n+1} \\\
    sum_{i=1}^{n} X_i \\qquad E(X^*) = \\frac{n}{n+1} \\mu_X$\n\n"
