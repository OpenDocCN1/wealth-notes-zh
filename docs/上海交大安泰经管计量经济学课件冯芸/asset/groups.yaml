    ![](img/27e6f65397bb7fd3eced98a716a58f50_233_0.png)'
  - '[PAGE 234]


    +   - 有时有偏估计量方差更小。兼顾无偏性和小方差的指标是估计量的均方误(Mean Squared Error, MSE)


    MSE(β̂) = E(β̂ − β)² = Var(β̂) + [E(β̂) − β]²'
  - '[PAGE 235]


    # 一致性：


    记 β̂(n) 是基于样本容量为 n 的一组样本 y₁,…,yₙ 得到的参数估计值，可以看作是 n 的函数。随着 n → ∞，对于任意小的正数 ε，均有 limₙ→∞
    P(|β̂(n) - β| ≥ ε) = 0，即 β̂(n) 的概率极限是 β，称 β̂(n) 是总体参数 β 的一致估计量，记作 plim[β̂(n)]
    = β。'
