    sigma}^2 = \\dfrac{\\sum \\hat{u}_i^2}{n - k - 1}$ 是 $\\sigma^2$ 的无偏估计量\n- 回归标准误（Standard\
    \ Error of Regression）$\\sqrt{\\dfrac{\\sum \\hat{u}_i^2}{n - k - 1}}$：真实观测值 $y$\
    \ 偏离估计的回归函数的样本标准差\n\n## 大样本性质\n（asymptotic/large sample properties）\n\n- 一致性是对估计量的基本要求\n\
    - 在假设1-假设4成立的前提下，OLS参数估计值是一致估计量。\n\nplim[β̂_j (n)] = β_j\n\nplim[β̂_j (n)] - β_j\
    \ = Cov(x,u) / Var(x)\n\n## 渐近正态性\n\n$$\\hat{\\beta}_j=\\frac{\\sum \\hat r_{ji}y_i}{\\\
