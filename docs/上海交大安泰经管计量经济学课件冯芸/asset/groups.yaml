    \ 17.30043 |\n| F统计量 | 2.766532 | Durbin-Watson 统计量 | 2.104990 |\n| Prob(F-statistic)\
    \ | 0.097768 | | |\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_197_0.png)\n\n\
    ### SALARY vs. ROE\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_198_0.png)\n\n\
