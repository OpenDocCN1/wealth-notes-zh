    +   \n+     $$\\hat{\\beta}_j = \\frac{\\sum \\hat{r}_{ji} y_i}{\\sum \\hat{r}_{ji}^2}$$\n\
    \n+   - 无偏性\n+   \n+     $$E(\\hat{\\beta}_j \\mid \\mathbf{X}) = \\beta_j, \\\
