    \ (1-p_i)$\n\n## 综合案例之三\n\n- 何基报，鲁直，什么影响着投资者选择卖出或继续持有？管理科学学报，2006年第6期\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_458_0.png)\n\
    \n## 作者关心的问题是什么？\n\n- 什么因素影响投资者选择卖出或继续持有？\n\n- 文章的特点\n  - 对投资者按资金规模进行了分类，影响投资决策的因素对不同类型投资者具有不同的影响方向和方向。\n\
