    \  - 系统的或确定的部分 $E(y \\mid x)$\n  - 非系统的或随机的部分 $u$\n\n### 四、线性回归的含义\n\n- 参数线性\n\
    \n  $E(y \\mid x) = f(x) = \\beta_0 + \\beta_1 x^2$\n\n- 解释变量线性\n\n  $E(y \\mid\
    \ x) = f(x) = \\beta_0 + \\beta_1 \\frac{1}{x}$\n\n- “线性”回归指\n\n  $E(y \\mid x)\
    \ = f(x) = \\beta_0 + \\beta_1^2 x$\n\n  对参数而言线性\n\n- 回归分析关键在于对 $f(x)$，即被解释变量条件期望函数\
    \ $E(y \\mid x)$（又称为总体回归函数）的识别上来。\n- 即利用有限的样本数据信息尽可能准确地认识总体参数，称为统计推断过程\n\n###\
    \ 样本回归函数（SRF）：$\\hat{y}_i = \\hat{\\beta}_0 + \\hat{\\beta}_1 x_i$\n\n残差项：$\\\
    hat{u}_i = e_i = y_i - \\hat{y}_i$\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_180_0.png)\n\
    \n### 样本的随机性\n\n| y | x | y | x |\n|---|---|---|---|\n| 70 | 80 | 55 | 80 |\n\
    | 65 | 100 | 88 | 100 |\n| 90 | 120 | 90 | 120 |\n| 95 | 140 | 80 | 140 |\n| 110\
    \ | 160 | 118 | 160 |\n| 115 | 180 | 120 | 180 |\n| 120 | 200 | 145 | 200 |\n\
    | 140 | 220 | 135 | 220 |\n| 155 | 240 | 145 | 240 |\n| 150 | 260 | 175 | 260\
    \ |\n\n### 参数估计值的随机性\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_182_0.png)\n\n\
    ### 小结\n\n- 回归分析\n  - 从经济含义来看就是要寻找主要因果关系，因此它既承认真实世界的多向因果关系，又将重点置于主要矛盾。\n  - 从数学处理来看就是要对条件均值建模。\n\
    \  - 条件均值模型的选择中最为经典的是线性函数，称为线性回归模型，是指对参数而言线性。\n- 回归分析\n  - 回归分析关键在于对 $f(x)$（又称为总体回归函数）的识别，需要利用统计推断的方法\n\
    - 接下来的第三章介绍统计推断的具体技术手段\n\n## 第三章 线性回归模型的统计推断\n\n### 主要内容\n\n- 最小二乘原理\n- 样本回归线的性质\n\
    - 从一元到多元\n- 参数估计量的评价准则\n- 经典假定下OLS估计量的统计性质\n- 回归参数的显著性检验和置信区间\n- 拟合优度和方程显著性检验\n\
    \n### ①理论或假设的陈述。\n\n### ②变量度量和数据收集。\n\n度量方法的多样性；数据质量。\n\n### ③根据经济理论或假设建立数理模型。\n\
    \n不同类型数据。\n\n理论或假设本身可能没有提供确切的函数形式。\n\n进行图形观察。\n\n数理模型：确定性函数\n\n$y = \\beta_0 +\
    \ \\beta_1 x$\n\n线性函数的优越性。\n\n### ④建立计量模型。\n\n计量模型：随机方程。\n\n$y = \\beta_0 + \\\
    beta_1 x + u$\n\ny 和 x 并非一对一确定函数关系。\n\n不同的函数形式。\n\n经典计量模型：线性回归模型。\n\n如何利用有限样本数据推断总体参数？\n\
    \n### ⑤参数估计。\n\nOLS、ML、GMM。\n\n模型是否合适？还有其它因素需要考虑吗？\n\n### ⑥假设检验。\n\n估计量的统计分布；估计质量。\n\
    \n### ⑦模型选择。\n\n### ⑧模型应用。\n\n- 截面数据模型\n- 时间序列模型\n- 混合数据模型\n- 虚拟自变量模型\n- 虚拟响应变量模型\n\
    - MLR\n- TS\n- PD\n- 多重共线性\n- 异方差\n- 内生性\n- 随机效应\n- 固定效应\n- 时间趋势\n- 季节性\n- 弱相关性\n\
    - 高度持久\n- 误差项相关\n\n第三章 统计推断\n\n《计量经济学》第三章\n\n"
