    ## 主要内容\n\n- 什么是“好”模型？\n- 导致模型失效的可能之一：函数形式的选择\n  - 对数vs.线性：双对数模型；半对数模型\n  - 双曲函数模型\n\
    \  - 多项式函数模型\n\n## 主要内容\n\n- 导致模型失效的可能之二：解释变量的选择\n  - 遗漏变量\n  - 多余变量\n- 模型设定检验\n\
    \  - 嵌套模型选择\n  - 非嵌套模型选择\n\n①理论或假设的陈述。\n\n②变量度量和数据收集。\n\n变量方法的多样性；数据质量。\n\n③根据经济理论或假设建立理论模型。\n\
    \n进行图形观察。\n\ny = β₀ + β₁x\n\n数理模型；确定性函数\n\n线性函数的优越性。\n\n理论或假设本身可能没有提供确切的函数形式。\n\
    \n④建立计量模型。\n\n计量模型：随机方程。\n\ny = β₀ + β₁x + μ\n\n经典计量模型：线性回归模型。\n\ny 和 x 并非一对一确定函数关系。不同的函数形式。\n\
    \n⑤参数估计。\n\n如何利用有限样本数据推断总体参数？\n\nOLS、ML、GMM\n\n模型是够合适？还有其它因素需要考虑吗？\n\n⑦模型选择。\n\
    \n⑧假设检验。\n\n估计量的统计分布；估计质量。\n\n第四章 模型选择\n\n⑨模型应用。\n\n《计量经济学》第四章\n\n不同类型数据。\n\n\
    截面数据模型\n\n时间序列模型\n\n混合数据模型\n\n虚拟自变量模型\n\n虚拟应变量模型\n\nMLR\n\nTS\n\nPD\n\n多重共线性\n\
    \n异方差\n\n内生性\n\n随机效应\n\n固定效应\n\n时间趋势\n\n季节性\n\n弱相关性\n\n"
