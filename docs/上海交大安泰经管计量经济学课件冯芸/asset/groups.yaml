    \n$$f(x) = \\frac{1}{\\sigma\\sqrt{2\\pi}} \\exp\\left\\{-\\frac{1}{2}\\left(\\\
    frac{x-\\mu}{\\sigma}\\right)^2\\right\\}$$\n\n- 标准正态分布\n\n$$Z \\sim N(0,1)$$\n\
    \n- 定理：多个正态分布随机变量的线性组合仍服从正态分布\n\n![](img/27e6f65397bb7fd3eced98a716a58f50_45_0.png)\n\
