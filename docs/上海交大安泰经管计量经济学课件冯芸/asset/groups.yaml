    \ MLR.6 随机误差项 *u* 服从均值为零，（同）方差为 *σ²* 的正态分布\n\n$$u_i \\mid X \\sim N(0, \\sigma^2)$$\n\
    \n$$\\hat{\\beta}_j \\mid X \\sim N\\left(\\beta_j, Var\\left(\\hat{\\beta}_j\
