    遗漏变量模型：$y = \\alpha_0 + \\alpha_1 x_1 + v$\n\n辅助回归模型：$x_2 = \\gamma_0 + \\gamma_1\
    \ x_1 + e$\n\n事实上，遗漏变量模型不满足 MLR3（严格外生解释变量）。\n\nOLS 参数估计量有偏：\n\n$$\\hat{\\alpha}_1\
    \ = \\hat{\\beta}_1 + \\hat{\\beta}_2 \\hat{\\gamma}_1$$\n\n$$E(\\hat{\\alpha}_1\
    \ \\mid \\cdot) = \\beta_1 + \\beta_2 \\hat{\\gamma}_1 \\neq \\beta_1，当 \\beta_2\
    \ \\neq 0 且 \\hat{\\gamma}_1 \\neq 0 时$$\n\n$$E(\\hat{\\alpha}_0 \\mid \\cdot)\
    \ = \\beta_0 + \\beta_2 \\hat{\\gamma}_0 \\neq \\beta_0，当 \\beta_2 \\neq 0 且 \\\
    hat{\\gamma}_0 \\neq 0 时$$\n\n$$\\frac{\\sum \\hat{v}_i^2}{n-2} 是 \\sigma_u^2\
    \ 的有偏估计$$\n\n$$\\widehat{Var}(\\hat{\\alpha}_1) 是 Var(\\hat{\\beta}_1) 的有偏估计（上偏估计）$$\n\
    \n- OLS 还不是一致估计量。\n\n### 包含多余变量的影响\n\n一个例子：\n\n正确模型：$y = \\beta_0 + \\beta_1x_1\
    \ + \\varepsilon$\n\n多余变量模型：$y = \\alpha_0 + \\alpha_1x_1 + \\alpha_2x_2 + \\\
    nu$\n\n应有 $\\alpha_2 = 0$，$\\alpha_1 = \\beta_1$，$\\nu = \\varepsilon$\n\n辅助回归模型：$x_2\
    \ = \\gamma_0 + \\gamma_1x_1 + e$\n\n事实上，$\\nu$ 和 $\\varepsilon$ 都满足 MLR3（严格外生解释变量）。\n\
    \nOLS 参数估计量无偏：\n\n$$\\hat{\\alpha}_1 = \\hat{\\beta}_1 - \\hat{\\alpha}_2 \\hat{\\\
    gamma}_1$$\n\n$$E(\\hat{\\alpha}_1 \\mid \\cdot) = \\beta_1 - \\alpha_2 \\hat{\\\
    gamma}_1 = \\beta_1$$\n\n$$\\frac{\\sum \\hat{\\nu}_i^2}{n-3} 是 \\sigma_\\varepsilon^2\
    \ 的无偏估计$$\n\n$$Var(\\hat{\\alpha}_1) = \\frac{\\sigma^2}{(1-R_1^2)SST_1} \\ge\
    \ Var(\\hat{\\beta}_1) = \\frac{\\sigma^2}{SST_1}，只要 R_1^2 \\ne 0，多余变量模型 OLS 参数估计总体方差大于真实模型中\
    \ OLS 参数估计的总体方差。$$\n\n## 四、模型设定检验\n\n- 嵌套模型选择：诊断多余变量或遗漏变量\n\n$$y_i = \\beta_0\
    \ + \\beta_1 x_{1i} + \\beta_2 x_{2i} + \\beta_3 x_{3i} + u_i$$\n\n$$\\frac{(R^2_{ur}-R^2_r)/q}{(1-R^2_{ur})/(n-k-1)}\
    \ \\sim F(q, n-k-1)$$\n\n$R^2_{ur}$：无约束方程的拟合优度　$R^2_r$：约束方程的拟合优度\n\n$q$：参数约束条件的个数\n\
    \n$H_0$：无约束模型与有约束模型无差异（即无约束模型存在多余变量问题）\n\n$H_1$：无约束模型优于有约束模型（即有约束模型存在遗漏变量问题）\n\
    \n### RESET 检验\n\n检验模型：$y = \\beta_0 + \\beta_1x_1 + \\cdots + \\beta_kx_k + u$\
    \ 是否遗漏重要的非线性关系\n\n备选模型：$y = \\beta_0 + \\beta_1x_1 + \\cdots + \\beta_kx_k + \\\
    delta_1\\hat{y}^2 + \\delta_2\\hat{y}^3 + u$\n\n对应的假设检验：\n\n$H_0: \\delta_1 =\
    \ \\delta_2 = 0$\n\n$$F = \\frac{(R^2_{\\text{新}} - R^2_{\\text{旧}}) / \\text{新引入的回归元的个数}}{(1\
    \ - R^2_{\\text{新}}) / (n - \\text{新模型中的参数个数})}$$\n\n$$price_i = \\beta_0 + \\\
    beta_1 lotsize_i + \\beta_2 sqrft_i + \\beta_3 bdrms_i + u_i$$\n\n### 如何改进？\n\n\
    **Ramsey RESET Test**\n\n方程：EQ01\n\n设定：PRICE LOTSIZE SQRFT BDRMS C\n\n被省略变量：拟合值幂次从\
    \ 2 到 3\n\n|  | Value | df | Probability |\n|---|---:|---:|---:|\n| F-statistic\
