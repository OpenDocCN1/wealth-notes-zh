  - '[PAGE 341]


    # 对数线性模型（或双对数模型，又称为不变弹性模型）


    $$y=\alpha x^{\beta_1}$$


    $$\ln y_i=\ln\alpha+\beta_1\ln x_i$$


    $$y_i^*=\beta_0+\beta_1x_i^*$$


    $$y_i^*=\ln y_i，\quad x_i^*=\ln x_i，\quad \beta_0=\ln\alpha$$'
