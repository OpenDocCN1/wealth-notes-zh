    \ y_i$$\n\n$$\\hat{\\beta}_0\\sum x_i+\\hat{\\beta}_1\\sum x_i^2=\\sum x_i y_i$$\n\
    \n![](img/27e6f65397bb7fd3eced98a716a58f50_191_0.png)\n\n### 得出回归模型参数估计值\n\n$\\\
    hat{\\beta}_0 = \\bar{y} - \\hat{\\beta}_1 \\bar{x} = \\frac{\\sum x_i^2 \\sum\
    \ y_i - \\sum x_i \\sum x_i y_i}{n \\sum x_i^2 - (\\sum x_i)^2}$\n\n（代入第二个正规方程）\n\
    \n$\\hat{\\beta}_1 = \\frac{n \\sum x_i y_i - \\sum x_i \\sum y_i}{n \\sum x_i^2\
    \ - (\\sum x_i)^2} = \\frac{\\sum (x_i - \\bar{x})(y_i - \\bar{y})}{\\sum (x_i\
    \ - \\bar{x})^2}$\n\n$= \\frac{\\sum \\dot{x}_i \\dot{y}_i}{\\sum \\dot{x}_i^2}\
    \ = \\frac{\\sum \\dot{x}_i y_i}{\\sum \\dot{x}_i^2} = \\frac{\\sum x_i \\dot{y}_i}{\\\
    sum \\dot{x}_i^2}$\n\n### 另一种估计思路：矩法估计（method of moments）\n\n$$E(u) = 0 \\Rightarrow\
    \ E(y - \\beta_0 - \\beta_1 x) = 0 \\Rightarrow \\frac{1}{n}\\sum_{i=1}^{n}(y_i\
    \ - \\hat{\\beta}_0 - \\hat{\\beta}_1 x_i) = 0$$\n\n$$E(ux) = 0 \\Rightarrow E[(y\
    \ - \\beta_0 - \\beta_1 x)x] = 0 \\Rightarrow \\frac{1}{n}\\sum_{i=1}^{n}(y_i\
    \ - \\hat{\\beta}_0 - \\hat{\\beta}_1 x_i)x_i = 0$$\n\n## 二、样本回归线的性质\n\n- 参数估计值依赖于随机样本，具有随机性\n\
    - 通过 x 和 y 的样本均值，即 \\(\\bar{y}=\\hat{\\beta}_0+\\hat{\\beta}_1\\bar{x}\\)\n- 估计的\
    \ y 的均值等于实测的 y 的均值，即 \\(\\bar{y}=\\hat{\\bar{y}}\\)\n- 残差 \\(e_i\\) 的均值为零，即 \\\
    (\\sum e_i=0\\)\n- 残差 \\(e_i\\) 和 \\(x_i\\) 不相关，即 \\(\\sum e_i x_i=0\\)\n- 残差\
    \ \\(e_i\\) 和 y 的预测值不相关，即 \\(\\sum(e_i-\\bar{e})(\\hat{y}_i-\\bar{\\hat{y}})=0\\\
    )\n\n## CEO的薪酬和企业净资产回报率\n\n因变量：SALARY\n方法：最小二乘\n日期：03/15/10  时间：16:25\n样本：1 209\n\
