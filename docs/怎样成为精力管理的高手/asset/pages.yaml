  md: '# # 6. 控制情绪，缓解焦虑


    前面第4章，我们从F字开头的单词里，就是前庭功能，我们认识了腺体、运动和健康焦虑这几个方面去讨论了如何改善情绪。


    你记住了吗？大脑就像装了一红红灯的汽车的汽车，为了摆脱危险了。这一章，我会带你讲全面全的深入了解。


    你可能又会觉得，情绪这个东西都是外界的刺激所导致的，你自己已经没有控制权。我看到你的书，完全没办法。


    但你要需要完全去，并且不断地练习，就好像体能是建立在肌肉不断收缩舒张，肌肉系统的记忆上一样，情绪并不是训练，而是通过合适的训练逐渐地如地控制自己的情绪。


    # ## 关于情绪的三条规律


    关于情绪有三条重要的规律，这可不是我忽悠你，这得是有心理学界研究的发现，哪三条呢？


    +   第一，人的脑子在一个时段只能主要存在一种情绪；


    第二，相比正面情绪来说，人脑更容易产生负面情绪；


    第三，人可以通过自己的训练来调节情绪。


    # ### 第一，人的脑子在一个时段只能存在一种主要的情绪


    我打一个比天来讲，大家可以想象一台收音机收音机，有频率不同的波段，它可以说收音机，单腿行，单腿行，单腿行，甚至到全频调，但一次只能放一个频道。


    当然也可能跟你说，真的在电视上还是过了《人类简史》这本书，还有吗，可能你同时看的，这3种情绪会冲突，但是基本上只存在两种情绪的时候你也不会出戏。


    你可以想一想，如果来自家庭的负面情绪，背后是不是情绪性沟通，至不然后你破坏它，你该不想吧。


    # ### 第二条规律：负面情绪比正面的情绪深入，人脑容易产生负面的情绪。


    这是为什么呢？就是进化论的选择，因为人的任务，在过去的过程中，人们的第一任务和重要的任务，是避下来。而不是活跃开心。活命是重要。


    要活下去，就是需要我们的的大脑有一个保护机制，就是去防范我们在不确定因素产生负的情绪和担心，对‘我死’‘我伤’更敏感。


    所以我们在大部分的时候焦虑和紧张是会产生一些紧张、焦虑、忧虑的心情，甚至是莫名其妙的生产焦虑和忧虑。这是正常的。


    但是我们后面了一点，我们可以通过训练来控制自己的情绪。


    打个比方说，我们一个手手里都大着这个电话，我们说的运动，你可以学会的快一点的感觉。


    美国有个著名的心理学家，叫杰巴德·弗里德曼博士，他写书对正面情绪和负面情绪的调情做了大量研究，才最终获得积极心理学博士，才最终获得积极情绪的正确解释。


    所以，你要保证自己每天的正面情绪在四成二至三以上。也应该如此，你就要主动地去切换情绪的频道。


    但遗憾的是，绝大部分人都没有掌握过这个方法。下面借负面情绪，怎么通过这个的训练来切换自己的情绪的频道。


    # ### 如何激发正面情绪


    我教给大家的第一个方法是做，是 自己正面的 （Priming）. 它可以帮助激活和产生正面的情绪，让身体感觉快乐，感恩，兴奋，坚定。接下来我告诉你详情，并且我带着你做一遍。


    我启动自己正面的著名的人，是教练Tony Robbins,他是美国的著名作家，每个人都认识，并且是畅销书《谁动了我的奶酪》，《教练，我的钱》。都是这个教练的方法。


    它非常有助于创造正面的身体、你可以想象一下。如果在5年前上学上你，你想出去散步，你那前十分钟是不是会很难得起来？


    但是如果你在家里做了好多事，你出来的时候也会觉得不太灵光，启动感觉的时候，启动感觉好的热身。当启动好了热身，出门的感觉跟出门的感觉都特别不一样，你可能都轻松地对立。


    热启动练习了包括五个部分：


    +   1. 呼吸的练习；

    2. 感受你的心跳；

    3. 回忆你感恩的事；

    4. 想一想你得感恩和庆祝的事；

    5. 想一想你的三个目标。


    完整的练习需要15分钟的时间，为了方便的完成，我们在这里的最后准备了完整的练习音频。可以过去一边听。


    我自己每天练习这个练习，可以提醒自己感恩的情绪，感恩的情绪，庆祝的事情，和我的目标保持一致。


    这些是我们最想要正面的情绪。当正面的情绪被激活出来，就好像身体热身了一样。更容易抵抗焦虑。


    你不要小看这个小小的练习，心理学家们做了不少的研究。发现我们在情绪上有个影响，能够帮我们认识到判断产生的影响。


    比如加拿大多伦多的研究者做了一个小实验，他们让志愿者随机选择两个组的人。让他们的脑子只能‘啊’，而唯一的差别是一组人的前提是，自己一周里的情绪。


    最后学生们从电梯里出来被要求向同一组陌生人的进行友好交流。结果专门做训练的学生对别人好很多。就是说，这意味着，知道自己的身体健康状态，会让我们对别人的看法。


    热启动练习里就会让自己回到自己的状态，这是一个非常重要的因素。因为正面的感觉让我们能够变得更快，也会变得更好。


    现在你学会了如何激发自己的正面情绪，掌握了情绪的训练器。接下来，我们就说说我们常见的负面情绪，因为我们了解负面情绪，我们才能够意识到去减少它。


    # ### 如何应对焦虑情绪


    对于很多人来说，焦虑和抑郁是最常见的两种负面情绪。


    其实我们每个生的人在不同阶段经历过焦虑或抑郁的困扰。


    我先来说一说焦虑。


    焦虑的特征是老是让我们担心的担心或者害怕，是处于对焦虑和不确定性的正常反应。


    它的好处是帮助我们更好地外界觉察，但坏处是会影响我们的注意力。


    但是如果持续焦虑或扩展或出现急性焦虑症状，以真实的或想象的躯体心理心理症状、坐立不安。你不知道你在担心什么。


    有时候还伴有很多精神活动的运动。比如说手抖、出汗、心跳、心悸，或不确定，或运动性不安。这种焦虑在医学上可能是焦虑症，一定要去治疗。


    如果你一段时间都处于焦虑的状态，有一些方法可以缓解。比如放松训练和正念，这里我推荐的是一个放松呼吸的练习法。


    它主要是让你专注与呼吸，把这个注意力锚定在呼吸上。通过吸气，呼气让自己头脑更冷静，注意更集中。


    为了让你更好的练习，我在课程的最后也做了专门的练习音频，你可以一边听。


    需要注意是，默数和呼吸练习，如你第一次练法，刚开始的时候可能会不自然，但这是没有关系的。你需要坚持一段时间，慢慢地就会适应。


    一旦掌握了这个方法，你可以在生活种随时随地使用，随时随地来调整自己的状态。


    第二个缓解焦虑情绪的方法上，我推荐Mental noting，这个练习被我们称之为注意力训练练习。


    如果你自己经常焦虑，或者焦虑在脑子里目标着，可以试试通过给自己的注意力方式去解决焦虑。


    怎么呢？你可以对自己说，‘这个感觉就是焦虑’。焦虑的时候我心跳会加速，手臂出汗。


    如果你现在让上记住认知焦虑的感觉。即使不能立刻去解决它，可以从那个焦虑的背景跳出来去冷静地旁观它。


    第三方法就是把焦虑的事写下来并且列出相对应的方案。


    为什么写下来能减轻我们的焦虑呢？因为焦虑的感觉非常有个特点。


    +   - 一是没有规律，就是日常说的牛马，让我们注意力非常分散；


    - 另外一个原因是我们无法不解决它，觉得危险，但就是需要方案，无法真正去行动。


    那么把恐惧的事写下来就会把注意力转移给文字。把恐惧的事写出来。写出恐惧的方向，不写出来，也能解决问题的方向性出一小步，也会轻松地解决焦虑，就会轻快。


    # ### 如何预防抑郁症


    职场中常见的负面情绪除了焦虑，还有抑郁。


    和焦虑不一样，抑郁主要的情绪是低落、悲伤，感到无能力。也有体力、严重的可能会影响食欲，甚至自杀的想法。


    其实我们大部分人遇到失意或挫折的时候，都会有些低落的情绪，但时间不长，两周上就会好。抑郁的状态如果持续超过两周，在临床上就会被称为抑郁症。


    应该如何预防和抑郁症呢？我给你讲两个小技巧：


    +   - 第一条是感恩的心；


    - 第二条是运动。


    其实抑郁一个很重要的原因是感受不到快乐，而感受到快乐最最简单的方法是培养感恩的心态。


    我举一个例子，同样公司发我一万块钱。如果我感受到的，这真是老板太公司了，太心多厉害，选择离职，真要太多钱，太贪心。


    另外一个人觉得赚了这么多，多感激，太开心了。有时候得到幸福，一个人感觉到很幸福。一个人心得特别，其实都是因为感受的心态。


    另外喜欢研究、研究发现，运动对于抑郁症的防治，有非常好的效果。


    二五公里、运动对于抑郁症的效果不亚于临床上常用的抑郁药物。


    所以不管有没有抑郁，不喜欢了。抑郁积极地运动起来。还记得吗。我教你前面提到过的小技巧运动、感恩和阅读。


