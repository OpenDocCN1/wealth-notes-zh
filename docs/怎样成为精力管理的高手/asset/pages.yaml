  md: '# 8. 给你一张行动清单


    这是课程的最后一课，在结束之前，我想再花一些时间和你一起回顾一下我们讲过的内容。


    同时，我想帮你把课程这些理念讲到自己的生活中，帮助你创造出一个生活的仪式。


    我们这门课，如果你只想记住一条东西的话，我希望是记住精力管理的这个学科名词。从下往上分别是体能、情绪、注意和意识层面。


    我们花了好多时间的讲体能是如何改善的，包括怎么通过适当的饮食、高质量的睡眠、适当的运动，以及预防和慢性疾病来改变我们的体能。


    我们也讲了怎么去激发我们的正面情绪，以及当负面情绪发生的时候，我们怎么积极主动切换。


    最后，我们介绍了怎么找到自己目标和生活意义，以及如何专注目标上。


    最后一讲，我想分享你一张精力的清单和行动清单，这基本上是一张行动表。这里面讲了很多的动作，是把之前的理论都变成了具体落地的一些动作。


    因为长期的坚持，就变成了你自己的习惯，每天不需要思考就会去做。


    我会讲得很仔细，你可以参照我的清单来做直接分享，当然你也可以把它当做一个模板，落地一些调整，最后再形成适合你自己的精力管理行动清单。


    # 我的晨间七件事


    早上起床以后，我会固定做七件事，这会让自己精力充沛，心情满满地出门。


    第一件事，我躺一会儿，会在床上做一些简单的活动，包括双手双膝、梳头发、会做腿的拉伸。


    这个过程其实是帮助热身，可以让人体先动起来。


    我在做这些事的时候，我会用脑子回忆一下昨晚会什么样的梦，因为在做梦的时候，我们的潜意识其实是在工作的。


    这个过程会有一些想法、信念、在潜识里被表达出来，自己也会梦见的，其实也是在发现自己的潜意识。


    第二件事，我起床以后会一分钟把被子叠好，床整理好。


    我知道很多人既不爱叠被子，也不整理床。为什么我还要花一分钟两分来做这件事呢？对我来说有两个好处。


    +   * 第一，给我的心理形成了一个暗示：我马上就起床了，我可以起床工作、行动。


    +   * 第二，我每天会很整洁地工作和生活。


    第三件事，我会喝一杯温水，大概有600毫升左右，相当于一整瓶矿泉水。


    一大杯水量能够激活我的身体，同时补充水分，让我的头脑达到清醒的状态。


    因为睡眠以后，已经有七八个小时没有喝水了，身体其实是处于一个缺水的状态，所以这个时候，补充大量的水分会很滋润身体的身体。


