  md: "# 7. 高效使用你的精力\n\n在前面的几节中，我跟你讲了精力 的金字塔模型：需要 了解和储备。包括每天的关键，睡眠，运动，饮食和情绪。\n\n这一节，我跟你\
    \ 讲金字塔上面两层：注意力和意义，这两层都是关乎如何使用的。\n\n打一个比方，说，旺盛的精力好比是给加速用的汽车，光有了车还不够，还需要回答两个问题：\n\
    \n+   1.  要怎么开？\n    2.  意义和目的是要去哪的问题，而意义回答的就是那么 的问题。\n\n你可能听说了，有一位很有才华的音乐家为了\
    \ 很多年， 获得了很多的粉丝，但是最后都变得更加抑郁，得了抑郁症。\n\n如何回答这个问题呢？这就是如何 使用自己的精力，让精力的产生和使用形成一个正循环，让精力变得充沛。\n\
    \n# 注意力在哪儿，精力就 流向哪儿\n\n要想让你的精力产生大量的产出，最关键的 是你现在能 聚焦在某件重要的事情上。\n\n> 美国心理学家 阿尔伯特·\
    \ 艾利斯（ Albert Ellis）就讲过这样一句话： 精力流向哪里，成就流向哪里。\n\n+   1.  第一类是事务性、反应性的输出。比如你每天花\
    \ 2 个小时在 微信群里回复消息，花 2 个小时回复邮件。这些都是事务性的输出，虽然你感觉你做了很多事，但并没有产生什么价值。而 第二类是系统性、创造性的\
    \ 输出。比如你可以做出一个产品，或者 写一本书。这一类的输出，你 可能会觉得很难，但 它往往具有更高的价值。\n\n你的产出，其实分两个大类。一个是 消耗型，一个是创造型。\n\
    \n+   1.  消耗型输出： 比如处理各种琐碎的事务，回复消息，参加会议。这些 输出 虽然重要，但并不 容易产生长期的价值。它们会消耗你的精力，而你 往往不会感到太大的成就感。\n\
    \    2.  创造型输出： 比如 你设计一个产品， 写一本书，解决一个 问题。这类 输出 需要消耗大量的精力， 但它往往具有长期的价值，也 会给你 带来\
    \ 很强的成就感。\n\n所以如果想 要有精力的产出， 一个关键 点就是把精力聚焦在 创造型 输出上。\n\n你要知道，大脑 是天生 喜欢 聚焦的。我们要做的就是在\
