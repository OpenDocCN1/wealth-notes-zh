    # 三角形收斂型態


    一般來講，收斂三角形就是股價到了某種程度，不論是上漲或是下跌，力道即將衰竭，卻沒有立刻歸零，而剩餘的力量造成了橫盤整理。橫盤整理的時候，它上上下下好像是在一個長方型箱子裡震盪，其實那是一種錯覺。


    照理說，一道力量正在衰減中，它的震盪幅度應該愈來愈小才對。相信稍微受過一點科學訓練，或者看過類似測量儀器的朋友們應該不難想像，就是上下震盪的幅度愈來愈小、愈來愈小……最後幾乎成為水平線，也就是俗稱的「躺平」。一個人的心電圖若到了躺平階段，就很難再起死回生了。唯一不同的是，人的壽命有限，反觀股票市場則是一個追尋漲跌循環的地方（也許有人會說，心電圖躺平以後，經過下一輪的投胎，他又恢復了呼吸跟心跳
    —— 對了，這種想法就是人類生命輪迴轉世的重要理論之一）。


    # 型態1 向上噴出


    網路資料很多，有耐心的話可以慢慢看，我只請大家注意一個重點：在整理完畢之後，如果是長方形或正方形整理，股價可以突破箱子的頂部往上繼續走，就稱之為「突破箱型頂」。同樣概念，股價在震盪的時候逐漸形成一個收斂三角形往右邊逐漸收斂，等到快要收斂完畢，震盪幅度會減低，然後呢？很多人的直接反應就是教科書上寫的「向上突'
