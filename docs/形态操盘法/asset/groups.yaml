    ## 圖看得多，自然熟能生巧


    本文的重點是：右肩爆大量對於個股而言，是一項非常重要的惡性出貨徵兆，且暗示以後將展開一段跌勢。


    由於近年來大盤較少見到三尊頭，所以右肩爆量的現象不常見，目前重視的是一個頭的尖頭反轉（詳見圖15）或是雙尊頭爆量下跌（詳見圖16），甚至在上漲的時候沿路出貨，到了頭部反而量縮（詳見圖17）。


    遇到這些情況怎麼辦？別擔心！請各位從現在開始盡量觀看大量的個股線路圖，也就是觀察大量的右肩出貨的案例，精進自己的功力，就能達到熟能生巧的進階境界。


    什麼叫做熟能生巧？這牽扯到認知的問題。如果個股只要看右肩出量就會展開跌勢，你不會覺得太簡單了？它基本的道理很簡單，但是市場會想辦法騙你。用什麼樣的方法騙？就是透過「變形」。關於右肩變形的情況，需要從大量的圖形中慢慢了解。這功夫是小火煎中藥，絕不可用大火猛燒。畢竟，境界是慢慢提升，過分著急也沒有用。


