    不要摸頭猜底，本是件好事，上面我也充分說明了底部跟頭部不是不能夠去碰，而是要認真地去碰、嚴肅地做研究，並且運用科學方法去思考、用科學方法去實踐，不要用一些泛泛且俗氣的錯誤知識妄加論斷頭部與底部。好比結婚一樣，不是叫你不能談戀愛，而是要你慎選戀愛對象。


    這道理乍聽下很簡單，但在我從事教學工作十幾年後，2012年我突然發現很嚴重的qin情。當我告訴同學「這件事情不是不能做，而是要好好地去做、認真地去做」時，他們都會在大腦裡自動將後半句完全斬斷切掉，只聽到前半句。顯然同學會認為，我在用一種非常獨斷的態度，嚴厲禁止他們做那件事，雖然我後面又補充了一句：「不是隨隨便便去做！」但在某些同學的大腦裡竟然產生不了作用，真是讓我血壓衝高到差點爆血管（我真的太脆弱了）！'
