    ## 1-1 第一招


    ## 先把頸線設好

    再上路


    這篇我要來談型態學的「頭部」，先跟各位說明什麼是「三尊頭」。


    頭部有很多種，有「尖頭反轉」（只有一個頭）、「M頭」（兩個頭，有人暱稱為麥當勞）、「三尊頭」、「複合頭」。為什麼要從三尊頭說起，而不先談尖頭反轉？因為一般而言，三尊頭比較普遍，一個頭的尖頭反轉不是那麼常見。因此，如果從三尊頭開始講解，各位會學得比較多、比較快一點。


    「頭」的意思，就是股價無力上攻以後糾纏在一起，進度遲緩、拖時間、在等死。


    圖1是一個成熟的三尊頭。在此，我要講一個非常重要的觀點：任何型態學要等它完成以後，才能夠確定是何種型態，如果還在半途進行當中，有人能夠預測它現在進行的是什麼型態，這種行為叫做「摸頭」。也就是說，在一件事還沒做完之前，就大膽預測將來會怎樣或現在已經變得如何


    如此的預測方式，除了膽子要大，還得具備卓越的學識，以及持續的勇氣跟毅力，才能順利做完一個型態。


    ## 圖 1 頭部型態之三尊頭


    ![](img/3f1b0329c287cb4066ec12fb356db1ed_11_0.png)


    ## 股市脫離不了人性


    不過，多數成名的偉大操盤手都反對摸頭猜底。因為世界上能夠具備這類操作功力的人寥寥無幾，即使是絕頂高手也沒辦法在每一天、每一周、每一個月，或是每一年，都對當下進行的型態提出準確的預測（許多絕頂高手都承認自己無


    法「連續預測型態正確」）。既然高手都這樣講了，新手該不該把預測型態當成主流操作法，就看個人的造化了。


    為什麼型態的預測會這麼困難呢？因為股市的型態非常可能在最後一秒鐘才更換趨勢，也就是前一秒還在上漲，下

    一秒就狠狠掉下來變成頭部。這樣的經驗，在人類是很陌生的。一般人在日常生活中，會主動記取他能夠預測的經驗，

    並在有意無意或者不知不覺間，把無法預測的事情給排除掉。例如中午吃下的剩菜，如果一直放在飯桌上沒收拾，放

    到明天就壞掉了，若是夏天就壞得更快 —— 這就是一種預測成功的經驗。又例如，有個人的老婆懷孕，經過超音波檢查是男孩，那麼，幾乎不太可能在懷胎十月後要生產的那天，男孩變成女孩！


    儘管型態是漸近式發展，但冥冥中似乎有張藍圖，讓萬事萬物都遵循著上帝的規畫去進行，以便完成它的型態。這麼說來，型態的發展好像在完成一種上帝交付的「使命」，

    如果能事先學習如何規畫藍圖，甚至知道藍圖設計了什麼東西，我們就能掌握型態了。這樣的想法對不對呢？有沒有什麼遺漏的地方呢？


    依照上帝規畫的藍圖發展去進行，此種想法基本上沒有錯，問題出在「股市型態的結構，其組成之謎到現在都沒有完全解開」，它不像萬有引力那樣，在400年前就被牛頓發現。股市中有太多太多的問題，都是現代科學所無法解開，

    且箇中最重要的關鍵，在於市場價格的走勢，除了跟一般的物理科學有關係外，跟人類的心靈意識也有絕對直接的關係。如同丟到半空中的石頭，飛到一半，突然有了自覺的意識，發現自己是塊石頭，就運用石頭內部原子裡的能量，想要提早落地，或者直接飛到外太空去。這樣的拋物線方式，就不是我們以前那種數學計算方式能夠一手掌握。


    ## 多空攻防的重要趨勢線


    現在，正式開始說明股價上漲的情況，請回過頭看圖1。


    漲勢從A點開始，攻到C點。如果股價暫時缺乏繼續上漲的力道，可能會有比較小的拉回或比較大的拉回，如D點就是比較大的拉回。假設在D點暫時停止下跌，或者說在D點暫時得到了支撐，股價便有重新上漲的力道。不過，這股力道若無法突破前波高點C點太多，就會發生E點的情況（E點跟C點的高度差不多）。此時，繼續上漲的動力暫時又失去，於是又掉下來到F點。


    在完美的頭部模型中，F點的位置是跟D點差不多的。此時在F點得到了暫時支撐的力量，股價再度恢復上漲動力，於是從F點攻到G點。這個G點的位置如果按照標準模型來講，應該是跟前面兩波的高點C跟E差不多，之後股價第三度在高空失去上升動力，從G點往下墜落……


    ## 天底下沒有完美的頸線位置


    我先打一個岔，討論一條輔助線。


    這條輔助線叫做「頸線」，頸線怎麼畫呢？就是連接前面兩個低點D跟F。兩點能夠決定一條直線，但要把這條直線畫成水平，所以有人是過D點做水平線，有人是過F點做水平線，於是頸線就有兩種位置。至於哪條頸線才是正確？答案沒有一定，或說很難決定。為了慎重起見，我通常會比較D點跟F點的高度，以較低的那個點為基準再畫水平線。在圖1，我是假設D點跟F點幾乎完美地接近，所以這條頸線可以同時通過D點跟F點。附帶一提，頸線畫出來後，頸線跟線段AC相交的那個點，我標註為B點。


    頸線有什麼功能？如果BCDEFG將來成為了頭部（目前還不確定喔），就可以用頸線決定多頭最後防守的關卡（H點）。換句話說，在G點往下跌的過程中，可能得到某種意外的支撐或是非意外的支撐，讓股價重新又上揚，如果這次上漲超過前面三個高點C、E、G，表示要做頭部的可能性就暫時沒有。反之，如果從G點往下墜落的力量跌破了H點（頸線是水平的，所以H點會跟D點或F點差不多），我們就有把握說這個頭部，也就是三尊頭差不多做完了。


    因此，「決定頸線的位置」非常重要。如果頸線位置決定得好，就能提早收到警報，提示這個頭部已經完成、股價正在下跌，並跌破了我們所設的頸線關卡（我會把停損或出

    場點放在頸線關卡）。不過，如果頸線定得比較差，可能會得到落後的下跌訊號，等到停損或停利時，就會損失更多金錢。


    這裡又衍生出「頸線定得好不好」的問題：並不是把頸線調得比較高就叫定得好，也不是把頸線調得比較低，就叫做定得差。頸線定得好不好，跟高度的位置沒有一定關係，這點千萬要記住。頸線如果定得較高，當它被跌破時，固然可以早點得到警報把部位賣出，殊不知，這也可能是假跌破，也就是市場在騙我們，那我們的部位就會被洗掉了。什麼叫「被洗掉」？表示你的錢被市場的一個假動作給騙走了。因此，把頸線調高可能會賣到比較好的高價，但被洗掉的機會也相對增加。反之，如果把頸線的位置調到較低，雖然出場時價格較低，少賺或虧損較多，但因為頸線位置低，也同時意味「盤勢既然跌到這麼低賤的位置，那這個跌勢也比較能確認，不太像是假動作」。如此一來，我們賣的價格雖然不好，卻可以賣得心安——不擔心部位被洗掉（部位就是你之前擁有的股票或是期貨契約）。


    頸線的設定固然重要，但要設得符合每個人的期待，機率幾乎等於零，所以我並不把頸線的設置方法當成很重要。如果堅持要把頸線設得完美（意思是說，跌破頸線等於100%確定頭部成型），我認為這樣的想法單獨在技術分析的型態學中不太可能實現。其實，型態學頸線的關卡設定，只能夠


    幫助我們逼近股市真相，也就是探知市場最後死守的關鍵在哪裡，但這個死守的最後防線只能夠接近，不能夠事先完全得知。


    因此，不論怎麼規畫頸線，得到的位置只是我們的某種計畫（低等一點就變成了想像，糟糕一點就成了妄想），而不是上帝事先規畫好的關鍵位置。


    舉例來說，一個人生了癌症，不論儀器先進到什麼程度，都很難講說我們觀察到的癌症第零期正是他剛剛發病的那一天。通常是癌細胞到了某種程度，才能夠被儀器觀察到。就以21世紀的水準來看，再怎樣精密的儀器或觀測都會晚好幾步，無法100%精密抓到細胞不正常分裂的那一秒病原開端。同樣道理，頸線的位置只是人類試圖逼近市場的真相而已，至於市場到底是從哪個點、哪個位置開始衰敗？無法事先得知，也無法用繪製型態的幾何方式得到衰敗之始。


    ## 揪出買賣點，仍需搭配其他工具


    如果真的想賣得非常精準，既然頸線無法幫這個忙，是否還有其他方法？在我的系統中，由於我年長之後就很少使用單一系統在操盤，都是同時使用兩種以上的科目，換句話說，除了型態，我還會用到像是平均線、K線，甚至季節或籌碼分析等工具，幫忙尋找更接近精準的買賣點。


    完美主義的操作者，一定要革除掉自己潛意識中那種吹


    毛求疵、不符現實的盲目執著；必須先承認我們自身的智慧有限，無法像神一樣盡善盡美，因而無法買賣在非常非常精確的位置。既然一條頸線沒有辦法達到理想，那就用其他參考資料或輔助系統來尋找更好的操作位置。但這個操作位置只是人為的計畫，也不是正確的答案。好比我們永遠無法在2015年3月之前得知當年高點是10014。如果你計算的高點是10089，落差雖有75點，但我相信有很多人會把你當成神一樣崇拜。


    在股市操作中，基本上方向對了，就已經很難很難，更不要講說方向對、位置也一樣抓得準確，這是不可能的任務。如果你還是覺得可能，表示你好萊塢電影看太多，或者是神話聽多了。你追求完美的決心值得稱讚，但是你誇大自己此生的極限能力，必定會在市場中遭到挫敗。


    頸線位置的決定雖是重頭戲，這關鍵卻落在「右肩」。在時間表上來講，它發生比較晚，也是多空雙方最後要決戰的時刻。對於部位很大的人來講，右肩只是戰場的一部分，但如果你的資金超級大，那很可能在左肩時就已經開始部署出貨計畫。關於這一點，後面會提到。


    ## 1-2 第二招


    ## 只要是頭部，

    賣在左肩或右肩都對


    股價上攻到一段時期後，暫時接不上力，會發生所謂的「整理」現象。什麼叫做股價整理呢？就是股價走不出一個大方向，困在一個小區域，頂多是上上下下地跳動，無法順利展開大開大闔的趨勢。換句話說，股價黏在那邊，像一團糯米飯，我管它叫做「盤頭」。


    嚴格講起來，三尊頭原來的意思是有三個頭，也就是有三個飯糰，但現在比較流行的說法是：第一個飯糰叫做左肩，第二個飯糰叫做頭，第三個飯糰叫做右肩。左肩就是第一個頭，右肩就是第三個頭。


    有人可能會問：「股價整理時，一定會成為三尊頭的型態嗎？」這個問題如果反過去想的話就是「所有的整理型態都將會成為三個糯米糰。」看到這裡，各位應該會感覺不對勁，因為如果是這樣的話，股市大大小小的波浪就不會那麼複雜了。所以在股市中，整理的型態可能是一個糯米糰（尖頭反轉），也可能是兩個糯米糰（M頭），也可能是三個糯


    米糠（三尊頭）。總之，「型態的飄忽不定」是主要特徵。

    如同地球有很多 Nub 每個人都長得不一樣。同樣道理，整理的型態也有許多種，很難知道將來共有幾個飯糰，而且飯糰有大有小，小飯糰很容易疏忽，造成我們的誤判。


    ## 初嚐市場獲利的甜頭


    我以前剛開始學型態學，只懂得平均線跟型態，其他像是K線，只會最簡單的K線，量的解讀更是只有基本認識。那段時間，卻是我精力最旺盛的時候，我跟股市新手一樣，喜歡把複雜的股市想像得很簡單，天真以為市場走勢只有兩種，一種是整理，另一種就是不整理，繼續往前走，或是往下掉。


    我認為這個想法太棒了！如同人走路一樣，要不就走，要不就不走，不囉嗦。甚至，我還得到一個自以為很棒的操作法：只要發現股價要整理，我會找機會或趕快把手上股票賣掉，等待整理完畢；如果整理結束之後往上攻，我就再把股票買回來；如果整理完後往下跌，我就可以回家睡覺或做放空的動作
    —— 在這麼棒的想法指引下，我的功課就是「愈早發現要整理愈好」。因此，我的盤算很簡單，一旦發現股市要做左肩，就趁左肩即將結束或從C點快速彎下來的時候，趕快把股票賣掉。我還自己設定了一條規則，發現CD波段即將結束，也就是左肩的拉回快要結束時，可以做一次


    搶反彈的買進動作，只要這個整理段不是尖頭反轉，將來勢必往上拉第二次，也就是圖1的DE波段……


    這個思維邏輯，的確讓我在20年前的台股市場打了不少勝仗，因為當時台股的人氣還旺，整理型態都做得滿標準，套句現代術語來講，就是那種時代的案例「很經典」。既然比較標準，也就比較好做，才讓經驗尚淺的我感到有種輝煌的成就感！


    上面我所講的作法對不對呢？待會兒再講。現在要講的是：股價在上攻一段以後，會因為接力不繼而產生裹足不前的現象。然而，這個裹足不前的現象，到底是三尊頭的左肩，還是本身就是尖頭反轉的那個頭？又或者，它可能是雙頭型態的左邊那個頭？……我不知道。


    ## 頸線還沒跌破前，不要亂猜是頭部


    對股市新手而言，最好先培養一點點基本的看盤能力，就是在它股價黏成一團的時候，去感受一下它是否在盤左肩？不過，這個方法已經落入預測法的範圍。


    型態學也有所謂的機械法與預測法，如果你使用的是預測法，表示功力高，當然有資格在型態還沒做完前就預先出手。意思是說，你能夠提早看出這個整理段不但會失敗而成頭部，而且還會變成三尊頭。在如此連環預測正確的牽引之下，你將從心底湧現一股強大的英雄氣概，認為這裡就是大


    顯神功的所在！於是，你會趁著在做左肩時，盡量在第一個高點C的附近，賣出持股；錢多一點的話，還可在C點做第一次放空，放空之後它會掉到D點，左肩就跑出來了，然後股價再度上攻拉到E點做頭，你再做第二次放空，然後它再跌到F點，F點附近應該有一條頸線通過，做最後的拉高動作，這就是市場俗稱的「邪惡的第五波」（詳見圖1線段FG）。


    G是右肩最高點，你做第三次放空，同時悠哉地等它掉下來破頸線——這樣子的操作方式，就是利用型態學做預測，屬於預測法，而且在左肩成型前就開始預測，簡直是「神人」等級，太厲害了，厲害到大家無法想像的地步！如果這神人在每個整理段都準確預測，他就是500年來第一人（雖然我看過的操盤手不多，但是我送給他的匾額一定會這樣寫）。


    其實，型態學也可以做機械法，怎麼做？很簡單，就是等它右肩做完以後跌破頸線之際，再來賣股票或是放空。


    從左肩等到右肩，有時過程一做就是好幾個月，要等很久。什麼叫等很久？就是在BCDEFGH的時候，我們都不知道它在幹什麼，只知道它在整理，至於整理會成功還是失敗？我們只能謙虛地自稱：不知道。


    在這種謙卑的態度之下，我們很卑微地過生活，在橫向整理的這段狗臉的歲月中，別人問我現在大盤是不是在盤頭？

