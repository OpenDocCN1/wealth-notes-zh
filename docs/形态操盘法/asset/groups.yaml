    # 巴菲特的價值投資法


    此外，勸大家不要摸頭猜底還有另一層涵義。在巴菲特操作法中，對於市場的態度就是不去摸頭猜底，可以說，巴菲特拒絕測預市場的走勢。散戶買股票，無非是希望能夠買在市場的低點，也就是接近底部或等於底部的地方買進股票，反觀巴菲特強調的是，別管市場現在在哪裡，也不要知道這支股票現在是不是在底部或頭部，重要的是，這一支股票的股價現在合不合理？


    「合不合理」正是巴菲特精湛的研究功夫之所在了！這也是學習巴菲特操作法的人要學習的功課。仔細研究這家公司的真實價值所在，再來判斷它的股票股價現在是否合理，只要落入股價合理的範圍區（意思是具有真實的投資價值，股價將來將有更大的上漲空間），巴菲特就說我們可以買進了。總之，巴菲特不太理會市場，更不會去摸頭猜底。'
