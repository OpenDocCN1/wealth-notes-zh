    ## 右肩變形之後

    仍然是右肩


    主力大戶如果有很多貨要出，而且也準備在這個整理段出貨的話，原則上會分批出，也就是左肩、中間的頭，以及右肩，都能看到出貨的影子。但是，因為大部分人還存著一點觀望心態，希望這個盤勢能不能多拉高一點，加上大部分大戶倉庫裡的股票還真的不少，基本上不可能把全部股票給出光，所以他們有選擇的權利，選擇在「最後的那個關鍵點」出最多的貨──以上是右肩爆量出貨的背景來源。


    ## 留意從多頭夢裡清醒的主力大戶


    大戶的心態可分為兩種：一種是用預測法，事先猜測這個整理段會成為頭部，因此在橫向整理之際，每一個位置、每一天在以虛虛實實的方法掩蓋出貨；另一種是大戶本身沒有算計到這個整理段會成為頭部，或許還在看多，甚至跟散戶一樣陶醉在多頭夢幻的氣氛，橫盤整理時不僅不出貨，反而進貨。但如果這個大戶是優秀的操作者，當進貨進到某個時

    間點發現不對勁，非常可能會「倒貨」了（詳見圖12）！


    總結來說，知道這邊是頭部的大戶，對右肩爆大量的貢獻會較少些，反觀一路走來沒有算計到這個整理段是頭部的大戶，在最後關頭感覺多頭無以為繼時，就會猛然把自己所有的貨一口氣全倒出來，對右肩爆量的貢獻很大了。


    在技術分析的型態學中，「右肩爆大量」是個直接且乾脆的觀察目標，對實際操作很有用。此處也要話分兩頭，一是講大盤，也就是加權指數。加權指數在2012年之後，完整的


