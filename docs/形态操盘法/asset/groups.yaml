    重點在轉折發生的時候！如果向上噴出，我就用新資金買'
  - '[PAGE 150]


    進新的部位；如果是下跌，手上若還有舊部位，我會先減碼舊部位，再做一些放空的動作（舊部位可能賠掉的是震盪段的上下差距，但是透過放空，我則希望賺到比較有整段利潤的豐厚報酬）。


    最後強調的是：如果能夠在震盪時，事先看出會上漲或下跌固然很好，但需要很高度的實力，一般人望塵莫及。最務實的作法是，準備好一筆新資金，等待轉折之後突破或是下跌，再建立新的多單部位或空單部位（空單部位不一定是要股票，衍生性金融商品、投機股或地雷股也行）。


    # 猜測太多，速度會變慢


    當我把自身的\}\)操作法則整理出來後，就跟一般操作者一樣，開創自己的操盤人生。過了多年，這種等待轉折點的方法我覺得還不錯，不但自己用，也傳授給學生。


