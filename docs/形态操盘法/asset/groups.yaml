    # 不能認知是因為被蒙蔽


    如此說起來，認知是不是一種意見不同的問題呢？


    我這樣回答好了：不論是意見不同，還是什麼不同，我們都可以廣泛地通稱為「認知不同」，因為：


    +   （1）認知，有所謂「對錯」的問題。

    （2）認知，有所謂的「境界高低」的問題。

    （3）認知，有所謂的「大格局與小格局，也就是時間長短周期不同」的問題。


    這三個條件，第一條最需要特別強調。在認知不同的爭辯中，絕多數可以做是非對錯的分辨，有時候是一方對，有時候是一方錯；有時候是兩個都對，但有時候是兩個都錯。


    如果兩個都對，對的一方沒有感覺到另外一方的對，他的這個對也就大扣分！


    也有人認為，認知問題並無是非對錯，只是每個人個性的反應，也就是不論怎麼講，「總認為自己沒有錯」！這種狂妄自大的心理，正是造成多數因認知不同而溝通失敗的幕後-nil手。


    發生在三尊頭頭部的認知問題，很多人把它當成是天賦能力不足。我思考許久，最近才得到比較新的看法。股民對於三尊頭之類的型態學認知出了差錯，固然跟天分有關，但更深的病源，恐怕是出在「被蒙蔽」。被什麼蒙蔽？被成見所蒙蔽、被外面亂七八糟的錯誤知識所蒙蔽，於是形成一股厚'
