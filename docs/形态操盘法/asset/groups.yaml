    所謂「看歷史說故事」，就是回顧歷史，再稍微做點反省。如果反省的深度更深，你會有許多話要講，那 REGULATE你這位說書先生多說點話，好讓台下聽眾更了解你的思想。在說故事的過程中，聽眾應該知道你對於歷史了解到了什麼樣的程度。如果心得愈多，你可能講得非常精彩，至於講得對不對，就有待你的老師來做客觀評斷。因此，求學過程中有沒有老師非常重要。沒有老師的人，很難檢查到自己思想的對錯，於是他的操作與學習，都在不確定的狀況下搖搖晃晃，甚至在頻頻摔大跤的情況下艱困地進行，到最後可能終歸於失敗。


