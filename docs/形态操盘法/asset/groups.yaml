    確認的底部買更多的貨、買進更多的股票跟期指合約！這就是金字塔型加強法：前面買錯了沒關係，後面攤平，終於有一天等到真正的底部。此時，就要咬緊牙關，投注更大筆的金錢在最後那個底部。


    如果你問我「他們為什麼有這樣的信心覺得那是最後的底部？」我只能說，他們的實力夠。至於每個人的實力的界定，又是另外一個故事，不是本文的重點。


