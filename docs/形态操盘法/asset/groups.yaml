    〈學員分享〉我的「型態學」學習之旅 陳志清 216


    ## 形式是外表，心態是內涵


    型態學這個東西，是一門學問，博大精深的智慧，等待讀者們去學習。


    我給翻開本書的讀者一個建議：不要太急著想直接獲取戰勝股市的捷徑，不要一下子就想抄小路。如果你是這樣的心態而又無法捨棄，那麼，本書恰恰就是你所需要的，因為我會反覆告訴你「型態學真正的意義在哪裡」——
    我會不斷地重複重點，目的是為了糾正長期以來大家對於型態學的錯誤認知。


    有三件事，是我寫書的主要目的：


    +   (1) 市面大多數講型態學的書，幾乎都是錯誤。原因是，從一開始國外對於型態學的經典著作，內容就不太對勁，然後一代傳一代、一本抄一本，許許多多錯誤的觀念就這樣被流傳下來，加上股市操作者大多虛有其表、名不符實，且智慧不足而無法從正確的角度看型態，所以造成今天普遍誤解的慘況。寫這本書，是想糾正這種歪風，至於能夠糾正多少，除了你我的努力之外，還要看天意。

    (2) 一般操作者喜歡用預測法的方式看待型態學，也就是


    是當股價線路圖一映入眼簾的時候，就希望立刻知道什麼型態。其實，如果你真的跟神一樣無論何時都能看出當下是什麼型態，就可以直接下單。市面上的型態學大致分為兩個陣營──多與空：如果多方的型態，就作多；如果被歸為空方的型態，就作空。說實在，能夠做到這樣子的高手，天下根本沒有！絕多數狀況，是等待型態「成熟」，而不是「隨時隨地」都可以一眼看出它是什麼型態。


    (3)在等待型態成熟的過程中，重要的是「心理狀態的變化」，這是書中強調的重點之一。一般討論型態學的書，多使用預測法的觀點，總想未卜先知、總想在任何時候能一眼看穿它在搞什麼把戲。這種把操作者神話的吹噓、拍馬屁的歪風，會把型態學帶入死胡同，也把等待型態成熟的那段過程所需要的心理素質一筆抹殺掉！真是很大的罪過。


    以下我跟各位講一些心裡話。


    我教股市課程是從2000年開始，迄今已經17年。在這幾年，我深刻感到讀者的思想變化（我們的同學大多是散戶，所以比較能夠知道這些股市素人的想法吧）。大致説來，股票市場正瀰漫一股不正常的風氣，就是盲目抬高技術分析的地位，卻不注重技術分析背後的心法──忽略心理因素。


    忽略心理因素，也就忽略個人的人格素養。


    型態學這門深奧的學問中，技術跟心理必須放在一起思考。有時候你可以不管心理因素而直接觀察型態圖形，但那只是暫時、一種小格局的心理，只要時間一拉長，所有事情都會變成大格局，所有技術也將牽扯到個人的心理狀況，沒辦法逃避！在時間的洪流中，我們本來就是活在這個壯麗巨大的宇宙，所以必須要把自己的觀點放大，而不是拚命鑽研細縫、拚命逃避心理修煉，盲目追求外表型式的技術。


    這些年，讀者的變化是慢慢朝向網路發展，他們誤認為知識是一種資訊，而資訊就應該是像網路時代那樣子，都是免費的 —— 這種貶低知識、把智慧看成廉價資訊的荒謬學風，導致大家對於學問的探索就趨向於形式的追求，也就是只注重外表，而不注重內涵。偏偏型態學這門學問又是從外表的圖形下手，這樣就更容易引起誤會了。就好像一個女子長得可愛，一看到她的時候就會被外表所吸引，反而忽略掉她真實的內涵。型態學就是這樣子在長時間內，被大眾所誤會了。


    在書的內文，我用了許多力氣及時間闡述以上的觀點，然而，一個人的生命終究是有限，這本書雖然寫完了，但回首兩年前的寫作歷程，卻引發了我許多的感慨。有些時光不能夠回頭，過去就過去了，也就是說，一個作者能夠在書上留下來的東西，最好是一種思想上的省悟。這同時是我寫書的一貫初衷，希望各位能夠先達到思想上的境界，再去談股市


    賺錢。如果本末倒置，那就不是我所希望的了。


    早些年的時候，我想到的是生命有限，人生有許多更重要的事情要做；到了近幾年，我更深切感覺到一般人能夠專注於思想學習的時間也有限，所以我常勸別人，包括我的朋友和學生：「你們的生命可能會比我更久，但是學習的時間在世俗的壓迫中，會變得比我更少，要懂得把握當下，能夠學就學吧……重要的是，有那個誠意、有那個心平氣和的時間讓自己真正學點東西。」


    本書就是為上述所講的諸多目的而誕生。


    總而言之，型態學是一種圖形，也是觀察圖形後所產生的辨別與融貫。看圖的是人，除了圖形的表相外，重要的是「人」，「人」才是真正的主角；而人是用心理去觀察型態——這個心理不是當下的直接感受，而是經過正確的教育訓練得來。至於什麼是正確的教育訓練呢？那就先從你手上的這本書看起吧！


    王力群


