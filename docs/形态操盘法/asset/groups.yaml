    ## 1-7 第七招


    ## 賺不到錢的原因：

    認知不同


    「認知」這門學問到處都有，為什麼要在三尊頭這個主題下特別談呢？因為一個頭（尖頭反轉）和兩個頭（M頭）的圖形比較單純，牽扯到的認知問題比較少。然而，認知問題變得複雜的地方，通常是發生在圖形被「扭曲」之後，例如三尊頭等情況。


    ## 認知的定義


    先解釋什麼叫「認知」。

    對於新讀者及一般新手來講，「認知」這門學問恐怕很陌生。為什麼？因為這門學科其實非常新，大概在19世紀以後才日漸興起。人類過去3000年的歷史當中，注意到認知問題的學者非常地少。第一個有大批文章敘述認知問題，正是英國哲學家培根，可惜之後的哲學家，就沒有集中火力針對這個問題做有系統的廣泛敘述，多數是走向專門的心理學領域，忽略了認知問題是個普遍的民眾問題（它是一個國民問題，不是學術性的專門議題）。


    有一對情侶經過多年戀愛終於結婚，婚後卻處得不好，常常吵架，於是展開溝通，才發現雙方對於「婚姻」及「愛情」的認知不一樣。婚前，雙方認為愛情就是愛過來愛過去；婚後，在外面上班的老公突然認為婚姻只是一種責任，定期把錢拿回家，把老婆跟孩子安撫好就行，不必再有你儂我儂、愛來愛去等親密小動作。然而，女方卻不這樣想，做太太的可能還想回到婚前的卿卿我我，這就是俗稱的「雙方認知不同」。發生這種狀況時，雙方可以做溝通，不過通常很困難，因為每個人的認知所含的成分不一樣，有人的認知包含理智的成分多一些，但絕多數人的認知裡，包含了相當巨大的感情成分。


    有人認為林志玲很漂亮，也有人不以為然。我想起多年前，聽到人家講林青霞並沒有長得很漂亮時，不禁愣了一下，再回想林青霞小姐年輕時長得樣子……想了很久之後，才勉強找到一個答案，林青霞除了具有女人的美貌之外，另具有男人的英氣，這股英氣有時候會讓人覺得她有點中性化（難怪她反串過賈寶玉）。也許就是這樣一點英雄氣概不該發生在一個美女身上，才讓某些人覺得她還不夠「美麗」吧！類似這種情況，也是認知問題。你說她漂亮，我說她不漂亮，雙方的認知有差距，常常搞得不歡而散。


    ## 不能認知是因為被蒙蔽


    如此說起來，認知是不是一種意見不同的問題呢？


    我這樣回答好了：不論是意見不同，還是什麼不同，我們都可以廣泛地通稱為「認知不同」，因為：


    - （1）認知，有所謂「對錯」的問題。

    - （2）認知，有所謂的「境界高低」的問題。

    - （3）認知，有所謂的「大格局與小格局，也就是時間長短周期不同」的問題。


    這三個條件，第一條最需要特別強調。在認知不同的爭辯中，絕多數可以做是非對錯的分辨，有時候是一方對，有時候是一方錯；有時候是兩個都對，但有時候是兩個都錯。


    如果兩個都對，對的一方沒有感覺到另外一方的對，他的這個對也就大扣分！


    也有人認為，認知問題並無是非對錯，只是每個人個性的反應，也就是不論怎麼講，「總認為自己沒有錯」！這種狂妄自大的心理，正是造成多數因認知不同而溝通失敗的幕後黑手。


    發生在三尊頭頭部的認知問題，很多人把它當成是天賦能力不足。我思考許久，最近才得到比較新的看法。股民對於三尊頭之類的型態學認知出了差錯，固然跟天分有關，但更深的病源，恐怕是出在「被蒙蔽」。被什麼蒙蔽？被成見所蒙蔽、被外面亂七八糟的錯誤知識所蒙蔽，於是形成一股厚的污垢覆蓋在本能知覺上，使我們的本能無法順暢發揮出來。


    什麼是本能？譬如你張開眼睛看，就會看到現在你眼前的東西，就是一種知覺的本能。同樣道理，當股價日線圖攤開在我們的面前，假如你學過一點點的型態學，應該都可以大概講出來在過往的歷史線路圖中，哪裏地方是頭部、哪些地方是底部、哪些地方是整理段
    —— 這樣的認知，難度並不高。


    今天的問題究竟出在哪裡？原來，隨著中華民國太平歲月的時日增長，股民對於型態的認知愈來愈低落！這個原因，正如我前面講的，可能是出在外面的錯誤知識過多，股民在接觸正確的知識前已經被太多錯誤成見污染，導致真心自性被蒙蔽，認知能力也就一天比一天薄弱了。


    ## 盲目追逐消息，往往成為莊家的抬轎人


    之前我提過，如果是標準的三尊頭，那麼，在右肩爆大量時就要特別小心，因為可能是惡性出貨的徵兆。說法很簡單，問題是「為什麼很多人臨陣上戰場的時候，無法把這條知識發揮地淋漓盡致？」除了一些其他的客觀因素，最主要的原因是：他無法辨別型態的「變形」！


    什麼是變形？就是在眾人矚目的眼光中，每個人都期待市場走出標準的形狀，此時，整個市場受到「過度」的關注，這股龐大的世俗力量就會直接刺激股價的走勢，使股價產生扭曲，產生了「變形的右肩」（詳見圖18）。


    「變形的右肩」是一個非常麻煩的東西，本來右肩是有形狀的，只要一變了形，它就走了樣、走了山。凡是醜陋的型態、極度扭曲的型態，或是稍微扭曲的型態，以現代一般人的能力，是愈來愈難看得出來。我把這原因歸咎於「其他訊息的遮擋」，以致於人們戴著有色眼鏡，看不清真正的型態學發展。意思是說，即使是很標準的三尊頭，都會產生有些人看不出來的問題，更何況是變形！


    以平均線為例，如果畫面上除了股價線路圖外，只有一條平均線放在那裡，經過我實際測驗的結果，10個人會有3個人看不到那條平均線；看得見的7個人中，又有5個人在真正實戰時，對於那條平均線也看不到。多麼令人吃驚的現象！


    回憶我早年的操盤歲月，也發生過實戰時忽略掉某個重要訊號的情況。不過，那是因為太緊張導致暫時看不見，而且這種現象也不是那麼難纏。反觀現在股民發生的問題，恐怕比我當時要嚴重10倍以上，因為就算是在平常不是在實戰，他們也無法看到那條平均線。究竟，他們把注意力放到哪裡去了？非常普遍的答案是：注意力都放在市場滿天飛舞的新聞消息去了。


    說實在，他們並不是沒看到，而是沒有放進心坎裡，因為心裡早被其他東西占滿。什麼東西呢？他想要知道的東西、他想要讓他容許它進來的東西、他想要但得不到，於是先敞開空間等著那個東西進來……如此一來，其他東西的生存空間就被打壓。


    如此先入為主，或只憑私人好惡感情取捨的行為動作，就造成認知出了差錯。


    ## 為什麼學不好型態學？


    在這篇文章，我設定型態學是焦點，其他先暫時放在一邊。也就是說，本文的重點是假設各位真心想學型態學，而不是在讀到某頁時，發現對我所講的東西感到很陌生，於是打退堂鼓，把型態學扔在一邊，然後說型態學這東西我不喜歡、它是垃圾，不懂也沒有關係。如果有這種態度，當然就另當別論，自然不在討論的範圍之內。


    ## 我的意思非常簡單，就是希望本書的讀者要學會型態學。


    如果學不會的話，你可以打自己二十大板，或者把自己餓個三天三夜，以表示求道的決心。唯有立定志向之後，我才可以幫各位分析下去，檢視大家為什麼對於型態學的認知如此陌生，導致經常出錯。


    如果你覺得達文西畫的蒙娜麗莎不怎麼樣，那是你的認知問題，而這個認知並不代表你會被槍斃。但在股市中，如果這東西明明就是一個頭，你卻看不出來，又以技術分析者自居，結果緊緊抱著股票不放，到最後賠了大錢，甚至想跳樓，要怪誰呢？怪自己不懂技術分析嗎？怪自己不懂型態學嗎？是的！你必須斬釘截鐵地告訴自己「型態學沒學好，所以我該死！」（請你別衝動跳樓，重新再尋找資金開始吧）要以這樣的態度勉勵自己，本書才對各位有價值，否則一切都是個屁！


    ## 問問自己5個問題


    真心求道的好學生，一定會常常檢討自己：為什麼老師看得出來，而我看不出來？如果我是老師，就會提醒你做以下的反省思考：


    - （1）看不出来的原因，是不是因為你不喜歡型態學，可能心中已經暗中愛上了别的學科（例如基本分析）？

    - （2）是不是因為你覺得自己對型態學沒有天賦，所以過於自卑，以致於該看出来的沒看出来？

    - （3）是不是認為你自己已經很厲害了……你開了一家貿易公司，是個大老闆，結果到了這個地方，老師竟然說你的型態學不行，讓你感到很不服氣。愈不服，你就愈看不出來？

    - （4）你覺得這個地方不太像是個頭部，結果老師說這是頭部，還叫你回家反省、閉門思過，你覺得老師在羞辱你。你認為看不出來不是自己的錯，而是這個東西根本就不是一個頭！

    - （5）是不是你的潛意識中認為型態學不重要？冥冥之中似乎有一股拉回的力量，阻止你進一步去認識型態學？


    上述問題，都是身為老師的我，在課堂上提醒同學思考的方向。思考是一步一步，或是多管齊下的，其目的就是要挖掘潛意識，找出自己「為什麼不能」的病根。


    也有許多人從這些的思考中，發現自己真的很不喜歡型態學，或是說跟型態學沒有緣分，這樣的話，你是不是心中已經有了定見，說是要往基本分析去發展呢？如果是的話，請想想：基本分析是不是比較適合你？你是否覺得基本分析比較簡單，才改走這條路？我請你再思考一下。


    凡事更換跑道，都得要仔細思考：之所以更換跑道，是不是因為我們認為新的跑道難度較低，於是把新的跑道給瞧扁了——這是一種不尊重的態度，我不太鼓勵這種心態。


    「對於圖形感到陌生」是我一直研究的課題之一。達文西的「蒙娜麗莎」畫得很好，你卻覺得畫得不好，為什麼你會跟著名鑑賞家的看法不一樣？就我個人的鑑賞觀點而言，我也覺得蒙娜麗莎的奧祕之處實在非常難講，所以我懷疑這幅畫的好處是否真的被多數人所了解。我認為，大家認為蒙娜麗莎的價值這麼高，恐怕只是附隨潮流而已。因此，評論家認為蒙娜麗莎好，我會抱持懷疑的態度。不過，達文西的「最後的晚餐」畫得好不好？如果你覺得畫得不好，我就不太贊成，因為我覺得這幅畫他畫得是「明顯地好」。


    在這裡，得到了一個初步的結論：有時候你的認知不同，確實是你的見識不凡，跟多數庸俗之人不一樣，所以你會覺得自己被孤立了。但有很多狀況，確實是你的看法出了問題，怪不得別人，只能夠怪自己。


    ## 三尊頭的認知問題，偏「藝術」範疇


    把話講回來，達文西的畫跟三尊頭又有什麼關係？其實，它們都是屬於「圖形」的一種。如果有人對圖形不敏感，就可以合理懷疑他對藝術繪畫的欣賞也出了問題。假使這樣的話，這個人是不是對於不在數學嚴密法則下控制的線條比較沒感覺，對於可以在數學嚴密控制之下的法則卻很有感。有這類特徵的人，大部分都是理工科的忠實信徒。


    很多在思想上過分一板一眼的人，都無法接受藝術的線條，因為他們認為那是一種「亂形」。什麼是「亂」？就是超出數學法則之外，無法用人類理性控制，胡亂留下行徑的線條。許多世界名畫，尤其是現代抽象畫，在理工科的人眼中就是如此。所以我常說，理工科跟人文科之間存在著重大的鴻溝，從藝術繪畫欣賞上即可見端倪。


    你交給五歲小孩一盒彩色筆，叫他在空白的紙上畫畫。這小孩拿了彩色筆亂畫一通後，我們看了老半天，可能才看得出他畫的是一條狗 —— 儘管跟真實的狗差非常多，我們還是看得出來。但如果兩歲幼兒，那畫出來的狗可能就真的看不出來了！


    有些時候，人類的心智在只是扮演「過程」的角色，透過過程的運作（或扭曲，我們稱之為「媒介」），小孩才得以把腦海中呈現的畫面，繪製成線條（請注意這個動作）。在股市操作中，就投機的個股而言，如果主力真的有心操作這支股票，就會千方百計把股價儘量調整成他想要走的樣子，但在這其中會遇到許多阻礙，於是股價就產生了變形！不過，對於一個優秀的市場主力來講，不論它怎麼變形，只要在他的能力範圍之內，都會想辦法把它拉回正軌，這就是作莊的操盤手厲害之處。


    我們身為不是莊家的操作者，不需要有製造圖形的能力，也就是不需要具有繪畫的能力，因為我們不需要是畫家，只要有鑑賞能力就好了。所以我說，具有鑑賞能力是一件比較簡單的事情（跟畫家比起來確實是簡單）。


    ## 認知，是一種逆向的還原


    這樣說起來，繪圖欣賞似乎是一種「還原」的過程。當我們看到一張繪畫作品，首先看到色彩及線條，進一步再看到畫布上光影的變化，然後再反推回去，經由這些色彩光線的線條回溯到繪者當時的心情，也就是繪者的「心」。因為我們最後抵達的目標是個抽象的東西，叫做心靈，而不是找到一個由數字組合而成的數學公式，所以理工科的朋友們在這裡就感到很挫折。只要我們尋找的東西是無形無相的東西，理工科的人就會難以捉摸，因為他們精於計算的天賦就下不了手，可說是英雄無用武之地。


    依照這個道理，我們看到股價圖形時，也要倒推回去，從這些扭曲的圖形反推回去，嘗試了解這個地方原本是什麼東西？……如果你在一團混亂中看出來這裡是右肩，又看到巨大的成交量，這樣就太棒了，因為你找到了股價轉折的關鍵。
    不過，股價圖形為何會扭曲？是因為有人在搞鬼、有人在耍心機、有人在跟散戶鬥智、有人在玩弄散戶的心靈……這些都是「心」的遊戲。一牽扯到「心」，理工科的人就不在行了。


    近十年來的國民教育，坦白講，都是以理工科掛帥，人文通識科目都居於被冷落的地位。或者可以說，很多學生對於理工科的數學推理過程分明的背景可以接受，對難以捉摸的人文背景普遍無法接受。之所以難以捉摸，還牽扯到一個問題，就是它的時間周期及大中小格局。


    以平均線來講，平均線的長中短周期條理分明，如果是5分鐘平均線，就叫短期平均線，格局較小；如果是10年線及20年線，格局就大，時間周期也較長。型態學就不是這麼一回事，型態學的邊界取捨是操作者自己決定，你說它的型態大，大到什麼程度呢？邊界在哪裡？都沒有一定準則，主要靠自由心證，也就是操作者自己去界定那個邊界。由於沒有設定範圍大小，很多理工科學生就無從下手，因為他們長久以來，都習慣在一個被別人限定的框框裡工作與思考，一旦把框框拿掉，反而變得不會思考。


    於是可以了解，如果給理工科學生一塊空白畫布，希望他們畫出一些最原始的設計及色彩與線條，是辦不到的——人文與科技之間的一個重大差別，就在這裡。人文設計注重的是無形，理工科的硬體製造重視有形，長久以來，我們這個世界都過分注重有形的東西（如你現在手上的手機、電腦），而忽視無形的東西（如人類的感情與認知，例如文學與繪畫、哲學與心理學）。無形無相，對於理工科的人來講，代表無跡可尋，這下就麻煩了，難怪他們會感到挫折。


    在數學解題的過程，回想一下老師怎麼出題？老師會先把答案給打散，然後希望同學用逆向過程尋找答案。這個逆向的過程，往往也是由嚴格的數學推理建造而成。雖然有些推理實在是有點奇技淫巧（過分講究解題的技巧），但仍不失為推理的精神。反觀今天在股市看到一個變形的頭部，或是在畫廊裡看到一幅抽象畫，我們都很難把它還原探究它原來的那個「答案」。就繪畫而言，一張畫的答案，可能是畫家心中那一股熱忱、充沛的情感；就股市而言，把一個變形的右肩還原回去，可能就是主力大戶他們當時想幹什麼的那股原始動機
    —— 那時他們想做出貨動作，又不想讓散戶知道，於是就把右肩變型。這一變，散戶就看不出來了！


    ## 散戶兩大致命死穴


    在股市，尤其是個股，右肩爆量出貨是件很嚴重的事情。這個法則看起來似乎很簡單，如果每個人都知道，豈不是股市的把戲就被人識破了嗎？放心，市場自有對策來對付，那就是把右肩搞個變形（變態），讓大家看不出來，這樣子，錢就不是人人都能賺得到了。


    什麼是變形呢？變形是一種認知的問題。什麼是認知？認知出問題要怎麼解決呢？這就是本篇文章提出來的重點，也是長久以來被多數傳播媒體所完全忽略的。


    依照我粗淺的研究，我認為散戶認知出問題是發生在兩個方面：


    （1）缺乏想像力：缺乏想像力的意思是，他只會做數學計算，無法想像一個東西或是一件事情 —— 如果在有心人故意的操作下，它會走出什麼樣的型態……這種型態，在理工科學中叫做「亂數」，但在人文領域中，不是亂數，而是人類的心靈活動，儘管不一定是走正當軌道的心靈活動，卻可以稱為是一種心術、一種權謀。在股市中，鬥兵法、鬥智鬥力、陰謀詭計，比比皆是。


    （2）缺乏同理心：因為股市中大部分主力都是在耍心機、注重「心的力量」，而一般操作者被理工科的教育撫養長大，喪失對心靈認知的能力，碰到詭計多端、善於耍詐的主力時，就變得無法應付。從某個角度來講，理工科的人好像很無奈、很值得同情，但從另個角度來看，市場中你強我弱，如果自己不努力改善問題，墮入敵人奸計而不自知，就不能夠全怪敵人，得怪自己的識人不明，或是識「心」不明了。


