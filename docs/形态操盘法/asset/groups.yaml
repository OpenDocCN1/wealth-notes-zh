    但是可以合併為一個大M頭，因為它有左右兩個高點，且高度差不多，符合雙尊頭模型（詳見圖22）。


    或許有人問，什麼叫做「尷尬情勢」？那是主力大戶在觀察台灣當下的人心走向以及人氣凝聚的程度，還有內部崩壞的真相並沒有完全曝光在大眾眼前，情勢還猶有可為，於是主力大戶才有往上拉解套波的能力。其實，主力大戶的能力是有
    Soccer，但要考慮成本，在那個年代往上再拉一次的成本，也許沒有像現在這麼高（現在的人氣比較渙散，成本相對提高）。


    早些年的台股市場還能看到兩個尖頭並排在一起，且兩個尖頭都分別有尖頭反轉特徵，但是第二個尖頭卻成為第一個尖頭的解套波，所以套牢的慘劇就變得沒有那麼慘，因為第二個尖頭幫第一個尖頭解套。雖然大部分的人在解套時仍然沒走，有點警覺性的主力大戶都在第二個尖頭跑掉了。


    後來台灣的走勢並沒有帶給大家多少振奮，前總統馬英九上台後，經濟似乎有小小振奮一下，就是2009年的那波大漲，可惜馬英九及幕僚對於台灣經濟只有勤快研究而沒有深入了解，台灣經濟的病根就一直壞在那裡，未見明顯起色，只靠國際經濟施捨的活水生存下去。在這種不優秀的狀況下，終於在2015年看到了台股歷史上罕見的邪惡的尖頭反轉（最高點10014）。嚴格講起來，這個絕頂孤峰只在高檔停留一天而已（2015年4月28日），真是名副其實的唯我獨尊（詳見圖23）啊！


