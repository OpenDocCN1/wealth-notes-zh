    ## 找出自己的投資紀律


    經過3411底部事件，我慢慢了解，不論是自己還是別人，我都必須長期地觀察。我不是真的了解我自己，因為我還在改變中。宇宙萬物時時刻刻都在改變，人也不例外，我更不例外。


    以前我有個錯誤的觀念，認為我是不變的，意思是說，我可以控制得了自己。經過這個事件，才明白萬事萬物都在改變，我也不例外。所以，持續地關注自己、反省自己，是無比地重要。雖然過去我有做，但做得還不夠，不夠徹底。於是，「反省」成了我日常的工作。


    3411底部事件給我的影響，造成我日後操盤工作許多重大的改革，其中最重要的一項，就是「建立監督機制」，以及一個更完整的操作系統。如某種機械法，強迫我不可以違背我過去揭櫫的信念，必要時，要把我的信念變成嚴刑峻法，用鐵跟血的精神強迫自己去實踐。


    ## 「我不了解的人」可能是一個地獄


    對自己的要求我慢慢去做，對別人的要求呢？


    經過3411底部事件，我了解到必須把自己置於嚴刑峻法的戒律下，才有可能會變得更有出息、犯更少的錯……但是對於別人呢？我如何讓我關愛的人、對我很重要的人也減少犯錯？


    多年之後，我才學到一些更深入觀察別人、了解別人的方法。因為別人也不停地在變化，即使我密切的觀察，還是有可能出錯。出錯的可能性高到什麼程度？是不是我只要持續關注，就永遠不會再犯錯？答案不是。但是我總有一個錯覺：「只要我謹慎，即使發生不好的後果，我也做了心理準備，所以我是可以收拾殘局的」。結果在2001年後許多年，我又遭遇導致幾件事，才讓我了解有些事情即使是心理準備再多也不夠，它都會帶給我意料不到、更深層且廣闊的衝擊。從負面的角度來講，有點失望、有點沮喪，因為挫敗超過我的預期，但從另個角度來講，超出預期的挫敗，使我的成長速度更快，也更加茁壯。


    這就是人生。如果沒有意外的人生全在掌控之中，我們永遠不會進步。即使有，那種進步也是在我們的意料之中。凡屬意料之中必有其限度，跨出去的步伐就很有限了。


    ## 我的「型態學」

    ### 學習之旅


    陳志清


    在王力群老師所教授的基礎操盤系統中，主要是以平均線（短、中線系統各有不同的均線參數）為骨幹，並以「型態學」為中線操盤的主要「輔助」指標；以K線為短線操盤的主要「輔助」指標。偏短線系統的《王力群K線操盤法》已於2016年出版；而本書介紹給大家的是偏中線系統的《王力群型態操盤法》。


    回想15年前（2002年4月）我拜入王老師的門下學習操盤系統，當時大盤指數正在高檔震盪（最高點6484），為了讓學生避開初跌段的損失，他先教授「頭部」的型態學；接下來為了使學生避開主跌段的損失，他再指導「下跌段腰部」的型態學；第四季跌到3000多點時（最低點3845），王老師所傳授的「底部」型態學，更讓所有人在實戰中有了深刻的體會。


    以型態學來說，王老師常提醒我們：高檔震盪時，要把焦點集中在「右肩」；橫盤震盪時，要把焦點集中在震盪區間被突（跌）破的K線；所有的震盪段，除了技術之外，都必須配合使用心法，用自己的內心去感受市場的多空氣氛。


    開班授課數年之後，王老師發現許多同學對於型態的辨識力不足，其資質無法體會「預測式型態學」的精髓，便以「機械式型態學」為教授型態學的入門操盤法，讓更多同學對型態學的境界能夠達到相當的水平。


    記得在一堂「台股歷年行情解析」的課程中，初學型態學的我曾經向老師請教一個問題：「在型態成熟的關鍵點，多空雙方要怎麼樣出招，才算是破了對方的局？」現在回想起來，自覺問了一個不是初學者該問的問題，王老師也訓示我：「要有自知之明，不要好高騖遠。先用機械法練功，等實戰經驗夠了，對於預測式型態學自然就慢慢會有感覺。」


    在入門的「機械式型態學」，王老師點出重點：「以機械法的無心境界，當突（跌）破型態關卡的訊號出現，它對於操作者只是一個操作的機會，操作者切勿執著於本身對多空的成見。」「形態在構築的時候，要把念頭淨空，不要存著太多的主見；要等待關鍵轉折點來敲我的門，而不是一天到晚去尋找關鍵點。」


    在進階的「預測式型態學」，王老師點出重點：「不要用型態學去定義型態學（不存在成見），而是要以心理分析去烘托型態學」、「股市的參與者是人，人心是會改變的，因而產生的型態是活的，不是死板的教條；人心的改變會影響型態的發展。」


