    就可以預測成功 —— 這種想法經過我20多年的市場觀察，看到太多操作者都是被這種想法給害死了！往後，希望任何一位讀者不要成為其中之一才好。


    賣在愈左邊，愈可能是高手，預測法就愈屬害；賣在右邊，愈是新手或傻瓜，卻是明哲自保的方法，但古板保守又費體力，不能自由揮灑，常被人嫌動作慢，動作也就愈機械。


    無論是機械法或預測法，我們都先假設這個整理段是頭部，而不是上攻過程半途中的腰部（詳見圖2），如此一


