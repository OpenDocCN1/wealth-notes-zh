    最後，本文點出一個型態學的大問題：股市型態是變化的而不是固定，那麼，它是怎樣變化？要怎樣才跟得上型態變化發展的腳步？……這是一個哲學史上的超級大問題，下一篇再講。'
  - '[PAGE 29]


    # 1-3 第三招


    # 以人文的心理分析

    解讀型態


    所謂的「解讀」，就是觀察目前的股價線路圖之後，再依據現有畫面上的數據資料，經過分析，寫下自己的看法。如果有結論，就把結論寫清楚，沒有結論，就坦白承認自己的分析沒有結果，很可能市場本身也沒有一定的方向。總之，分析一個市場的趨勢走向，不論用的是技術分析或基本分析，都要經過思考。不過，有個很重要的問題出現了：一般人並不懂得思考的方法。


    # 任何分析，人文解讀放第一


    一般人看待三尊頭的時候，尤其是受過理工科教育的同學，都會犯一種「牛頓毒」的錯誤。什麼是牛頓毒？就是我們從高中到大學所受的理工科教育，包括數學、物理，化學之類的硬科學，其理論系統都先導出一個數學公式，再經由公式去發現或證明某種自然界的現象。久而久之，由於升學'
  - '[PAGE 30]


    主義猖狂的緣故，我們都養成了一種習慣：只要把公式弄熟、解題技巧提高、考到高分，就是一個理工科的優秀學生，未來搞不好還能成為優秀的科學家呢！這種觀念，在我念高中時非常盛行。一直等到近30年以後，才漸漸了解：科學除了用數學公式計算外，還有「人文解讀」。


    後來，我的一貫主張就是：股市中做任何分析，都要把人文解讀列為第一或第二順位考量。除非你是做純粹的機械法（基本分析也有機械法），否則就會面臨到「分析盤勢」的問題。


    什麼是「分析」？如果是純粹機械法，操作者本人可以跟傻瓜一樣，只要等待股價的變化觸動到系統，然後發出訊號的警告聲，再動作就可以了。過程中，操作者不需要任何思考，只要服從機械系統，聽訊號辦事就是一個好學生。但如果是基本分析派，又用到很少的機械法；或者，操作者是技術分析派，使用的是預測法，那麼，他用到的機械成分就會相當稀少，或是他刻意減低自己操作的機械成分，此時，大量的思考分析就會出現。這也是我們為何常看到有些長篇大論的趨勢報告，裡面盡充滿了想像力
    —— 很可能是作者經過大量思考而寫成的ய心血結晶。


    # 把人與人之間的關係放進去考量


    「人文解讀」又是什麼？這裡的解讀，是說當你看到一件'
  - '[PAGE 31]


    事情，依據你的知識去思考、想像它過去、現在、未來所發生的一些重要情況， 然後再整理出來，得到某種結論。舉例來說，有個人體重突然大幅增加，我們可能就會想到很多情況，可能最近暴飲暴食才變肥，或是心情不好暴飲暴食而變肥……為什麼他會心情不好呢？這個可能就是病根。類似這樣的思考模式，一步一步逼近問題核心，就是一種解讀。解讀的深度愈深，得到的答案結論愈可靠，只是表面上的解讀，就會淪為傳聲筒，徒然複製與散播從別人那裡得到的訊息而已。


    一般人在做解讀的當下，很少動用到人文的角度思考全貌，例如，我們要孝順父母，但是為什麼要孝順父母？在中國古代的儒家典籍中，理由講了很多，大多數的人長大後卻都忘記了。他們腦海裡孝順父母的觀念，逐漸變成了一種社會習俗，或者一種強制性的規範，好像不孝順父母就不是屬於這個國家社會的人，這樣子就被孤立了。由於不願意被孤立，所以也學著像別人那樣對父母好。表面看來好像是孝順，其實心裡的誠意已經大大減低，這就是缺乏人文深度的行為。


    從上述可知，所謂人文解讀，就是把人與人之間的關係放進去考量，這個「人」不只是個人，也很可能是廣大的群眾，甚至整個國家、整個地球全部的人民。但是一般人，尤其是理工科出身的同學，因為在升學主義的壓力下，常常與'
  - '[PAGE 32]


    考試卷上的題目做搏鬥，久而久之，就變成一種只會跟沒生命的東西打交道的人類。我說的這些話，似乎有點不順耳，事實確是如此。很多理工科的同學，可能在處理人與人之間的關係時，才會用到人文思考，然而，處理其他問題卻容易淪落物化的算計。物化，就是把對象看成沒有生命的個體，就像把石頭丟到半空中，計算它的拋物線（計算拋物線用到的
    是數學公式，不是人類的心靈）。


    # 最接近股市真相的模型


    那麼，我們不禁要問，市場的股價走勢，如果不是按照上帝事先繪製好的藍圖走，又是遵循怎麼樣的方式走呢？或者說，它根本就沒有一種固定的方式？我的答案是：各位暫時不必去思考那個最終極的答案，因為最終極的答案，連目前最高明的科學家或哲學家都無法解釋地盡善盡美。


    在股市中的人，只要把股市想像成這樣子就行（以下是我的建議）。我是依據16世紀後某些哲學家的看法，把股市解釋成上帝事先規定好許多自然的法則，再依據這些自然的法則，創造出宇宙最原始的一個模型。或者，不要說是創造，而是用這些自然法則「組合」成一個宇宙最原始的模型，然後上帝就用力一推（我把這個叫做第一推動力），整個宇宙就順著這股推力，動者恆動。就這樣，依照力的傳遞而發展下去，就成為大家今天看到的宇宙。'
  - '[PAGE 33]


    在第一推動力發生過後，原則上，上帝依據祂當時制定的自然法則管理這個宇宙，換句話說，管理宇宙的是上帝創造的自然法則，而非上帝本人；雖然上帝可以代表這些自然法則，但如果我們把上帝想像成一種人類形體的話，上帝只是間接統治，而不是直接統治。因此，直接統治我們這個世界以及股市的是自然法則，而不是上帝跟國王一樣親力親為——
    希望大家能夠明白我的意思。


    這個模型，是目前我認為最接近股市真相的模型。最近幾年，我研究股市有大部分的時間，都在比較各個理論的優劣，同時思考哪種模型最接近股市真相。


    # 屬於哲學思考的一環


    人文思考，就是一種追根究柢的思考，也是一種哲學性的思考。哲學思考是去思考可以看見的東西背後，有沒有一種看不見的道理。


    一件事情，或者一件東西，只要我們一直往下深入思考，一直問「為什麼」，遲早會接觸到問題的根本核心：這個東西或事情到底與我有什麼關係？為什麼我要如此不斷探索下去？這種打破砂鍋問到底的精神，難道不是跟人類本身有關係？難道我們去研究拋在空中的石頭的拋物線，或者是研究環繞地球的人造衛星的運動軌道，只是想對石頭有交待？或是對發射衛星的太空總署有交待？……問到最後，恐怕都會'
  - '[PAGE 34]


    # 回到人類自己本身的這個問題上，這就是人文解讀。


    可惜的是，現代科學的興起，我們把思考分得太細，於是希臘人最先稱為「思考」的東西，現在我們就叫做「哲學思考」了，這樣稱呼好像是一種分工，現在聽起來卻似乎有點貶低的味道。本來思考就含有哲學跟科學的成分，後來經過文藝復興及科學革命，再加上工業革命，思考的種類與領域愈來愈多，於是我們把最原始的思考就叫哲學思考，後來再降級稱為人文思考。因此，人文思考的本身，就是哲學思考，也就是關於人類自己本身的思考。現在全球各大學的博士學位，英文還是用PhD（Doctor
    of Philosophy），其中的Philosophy就是哲學，這一點迄今仍舊沒有改變。


    # 股市是活的，要靈活一點


    再回到三尊頭，以人文解讀的角度去看三尊頭才是正軌。


    前面提過，很多人把三尊頭這類型態學，誤以為是上帝預先畫好的藍圖。打個比方說吧！大家都知道房子要座北朝南才好，大門當然要朝著南邊，但你看看有多少房子的大門不是朝向南邊？如果不是朝南的房子，在風水設計時，就要在別的地方加強，房子才會住得舒服。又例如，房子最好不要西曬，尤其是主臥室。但你看看有多少房子的主臥室在夏天時像蒸爐般？怎麼辦？是不是被西曬的臥室就不該存在這個'
  - '[PAGE 35]


    地球上？是不是不合理的东西就不可能存在這世界上？答案是：凡存在皆合理。因此，建築師在面對被西曬的房屋，會在西曬的那一面做好防曬措施，如沿著牆壁培養綠色植物，擋住夏天午後強烈的日曬，或者在牆壁裡做好隔熱，這就是一種「補強」。

    由此可知，很多不好的事情依然會存在這個世界。「不能被西曬」只是從某一種舒適的程度而言，通常人類只要身體強壯一點，夏天還是可以忍耐西曬的烈日，所以，設計出被西曬的房屋並非不合理，而是
    Insufficient 之比較高的標準。如果換成原始人，皮粗肉厚的，也許就能忍耐。重要的是，西曬的烈日並不是直接的致命殺手，人類可以培養出強韌生命力，給他忍過去！


    # 提高分析能力的六個練習


    一般理工科同學對於型態學，就是誤以為股市的股價會照著上帝事先規定好的最高理想進行，殊不知，在這個俗世中有太多事並非按照最高理想去走。請注意：最高理想是自然法則，但人類能夠忍受的最低限度也是一種自然法則。於是，市場中的股價就變化萬千了！因為在最高理想與最低限度之間，有一段很大很大的彈性空間，能讓人類自由發揮，或是說讓人類去忍耐這個限度。

    雖然股市必須符合上帝所規定的自然法則運動，不過，'
  - '[PAGE 36]


    # 王力群 型態操盤法


    它畢竟是全體股民眾多心靈合力打造出來的產物，所以說它是俗世的產物也不為過。不過，在這層俗世的外衣包裝下，卻蘊藏著一顆包含萬物真理的心靈，姑且稱之為「股市真理」。這個股市真理，若用機械法去對待，做久了以後，操作者就可能變成機器人（就是會變笨）。所以，這裡談的人文解讀是針對非機械法的操作者而言。


    股市是變化的，不是死的。股市變化的法則，是依據上帝最初制定的自然法則而來，希望理工科學生能夠了解。我們常在其他技術分析的書上，看到一條似是而非的法則——「頭部爆大量就是主力出貨的訊號」，這樣的敘述對不對呢？我先直接了當地講答案：主力要在哪個地方出貨，是他家的事，不是非得要遵照上帝制定的最高理想進行。


    三尊頭有所謂的左肩、頭及右肩，試問，他們所說的頭部爆大量，到底是在左肩？還是在中間的那個頭？還是在右肩？......這些問題在一般書上說得都不夠明白，我的答案是：它在頭部的任何一個位置出貨都可以，甚至在跌破頸線以後才大量出貨也可以！


    所謂的人文解讀，就是依據你的分析實力。這個分析實力，要落實在你對於股價千變萬化的走勢，是否能提出一套合理且實用的解釋。所謂合理，就是說你的分析是接近股市真相；所謂實用，就是說你的分析結果可以用來賺錢。


    我們做一些實際的練習吧！'
  - '[PAGE 37]


    第一個問題：如果是左肩爆大量，你要如何解讀？


    第二個問題：如果是中間那個頭爆大量，你要如何解讀？


    第三個問題：如果是右肩爆大量，你要如何解讀？


    第四個問題：如果是跌破頸線以後才爆大量，你要如何解讀？


    第五個問題：如果頭部都沒有量，而是在下跌了一段不算短的時間之後才爆大量，你要如何解讀？


    第六個問題：如果在頭部沒有爆大量，跌下來以後也一路都沒有量，你要如何解讀？


    這些問題，都可能在股市中發生，請不要看到這麼多變化多端的狀況，就感到心慌意亂、手足無措，表示你不懂股市的變化就是「存在即是合理」，事情發生了，一定有它的道理。


    我們並不是要去檢視這個現象是否一定合乎最高理想的標準，而是要去思考，是什麼樣的力量，使它偏離了最高理想的標準，暫時偏離上帝的旨意去進行它以為是的活動。這些偏離上帝旨意的股市運動，絕大部分將來都會被歸為是短線的躁動，就長久而言，它一定會比較符合大趨勢。愈大的趨勢，就愈接近上帝原來的旨意，但不一定是符合現在俗世所期望的最高幸福舒適度。換句話說，股市的進行並非是已經事先規畫一定要朝向人類的終極幸福去進行。'
  - '[PAGE 38]


    股市的方向是否符合人類幸福的標準，端看人類的努力、而非上帝的旨意。如果人類肯努力、肯變得更有智慧，上帝一定會讓股市上漲，這就是符合自然法則的因果關係——肯努力耕耘，就會有好報。


    以上六個問題，就是訓練各位朝向人文解讀的方向邁進，希望大家在思考的過程中，分析能力能逐漸進步。技術分析的「分析」兩字，就是思考的力量提升，不要辜負了自己。


    至於六個問題的答案，等大家思考過了以後，再往後面閱讀吧！'
