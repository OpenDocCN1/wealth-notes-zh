    # 誤解2 以為按圖索驥就能賺錢


    有人以為，只要經過一般學習階段，就能像建築系學生那樣拿到盒子裡的藍圖。這些所謂的祕笈也沒什麼了不起，就好像建築系裡教的專門知識一樣，關鍵在於我想不想去念，而不是我有沒有能力考得上建築系。多數人沒去念建築系是因為志顧性向的關係，不過，有人不曉得去向贏家學習股市祕笈，放著錢不去賺，又是怎麼一回事？……那是因為他們民智未開，只知道利用自己的工作賺錢，不曉得利用股市賺錢，沒有學習股市專門知識，也就不會去找贏家老師學祕笈了。只有聰明的投資人走在時代尖端，懂得除了本業之外，'
  - '[PAGE 25]


    還有一種副業能增加收入，那個「副業」就是股市操作。


