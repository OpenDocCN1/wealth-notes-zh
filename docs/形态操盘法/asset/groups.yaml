    # 壓力線的

    畫法與運用


    有人問：「頭部是怎麼形成的？」


    由於股市的潛在動能逐漸衰竭，沒有多餘的力氣繼續往上攻，剩下一些殘餘力氣。而這點殘餘的力氣，只能夠提供股價停留在原地，不要跌下來就好，至於進一步向上漲價，就沒有多餘的能耐。


    當這種動能逐漸衰退的現象還沒有被人發覺，市場仍然在追買，就是俗稱的「追高」。那時候大家不曉得這裡是高點，於是買歸買，買完後股價卻無法進一步上攻，只好在一個區塊裡打轉，該區塊就叫「震盪區域」，有人取名為「震盪箱」，意思是股價困在這個箱子裡裹足不前。時間久了以後，就會看到股價漸漸往右邊拖，形成團塊，未來假設真的力道接不上而掉下來，這個團塊即稱為「頭」。


    # 壓力線：暫時阻止股價繼續上升


    一旦頭部形成，就有投資人說自己被套牢了，如果頭部的'
  - '[PAGE 117]


    成交量很大，表示被套牢的金額很大。如果融資餘額在頭部時達到新高水準，依照過往台股慣例，融資餘額大部分是散戶在使用，可以得知：頭部的融資餘額愈高，被套牢的散戶就愈多。被套牢之後，這些部分稱為「籌碼」，並形成一股「壓力」——意思是將來遇到反彈或回升，碰到這裡時，上攻姿態會有所阻礙，或者直接把你打下去，打落凡塵。


    以頭部來講，壓力帶主要集中在三個地方：


    +   （1）頭部最高點的那一塊區域，可能只有一天，可能有兩、三天。


    +   （2）頸線所在的位置。


    +   （3）這塊頭部裡面成交量最大的那幾天。


    這三塊區域都是壓力帶。或許，有人嫌帶狀區域稍微廣泛了點，因此在技術分析中，很多人就把壓力帶簡化為「壓力線」，也就是把一塊平面區域縮減為一條線，一條線就只有一個價格，看起來比較簡單分明。如此一來，頭部的主要三條壓力線分別是：（1）頭部最高點；（2）頸線；（3）成交量最大的當日最高點或最低點（如果當日是長黑，則有人取其中間為壓力線）（詳見圖28）。


    # 壓力線關卡的存在並非永恆


    頭部做完以後，股價跌破頸線往下跌，跌了一段時間會有反彈，這時候，我們不知道它到底是正式回升還是反彈，為'
  - '[PAGE 118]


    了方便起見，暫時都把這些上漲叫做反彈。如果反彈失敗，將來會繼續破底往下，反彈的高點就又變成了一條壓力線。反彈的時間夠久的話，可能會成為一個橫盤震盪整理波，此時，這個橫盤整理波也可以畫出一個震盪箱（詳見圖29）。震盪箱的高點是壓力線，也是反彈的高點；震盪箱的下緣也是壓力線，就是這一波橫盤整理的底線。於是，每個反彈整理段大概有兩條壓力線，一個是震盪箱的上緣，另一個是震盪箱的下緣。


