    三尊頭比較少見，右肩爆大量這種情形就算學到，也只是放在心裡當備用知識（詳見圖13）。為什麼加權指數的三尊頭逐漸減少？或許是跟一般操作者愈做愈短有關係，但這不是本文討論的範圍。


    二是講個股，右肩爆大量對於個股的操作來講很重要，建議大家要做大量的練習。藉由練習（觀看個股股價線路圖右肩爆量出貨的圖形案例），才能體會什麼是右肩爆量出貨。


    擁有知識是一回事，能夠把知識付諸實行又是另一回事，


