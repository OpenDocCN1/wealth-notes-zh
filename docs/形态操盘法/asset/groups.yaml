    有贏家都有錢到你無法想像的程度。大富翁也不一定都是贏家，箇中更有許多敗家子，在股市中慢慢就把財產給花光了——這類的思考並不難，只要肯用點心、花點腦筋想想，就會明白這些身分之間的因果關係。


    此外，有些投資者的身分會牽扯到股市的專業知識，例如外資，常常被列入三大法人之一，是必須關注的對象。外資是不是贏家？我拋出個答案：外資確實是贏家，可是其操作手法及背景觀念，往往不是一般散戶能夠了解，因此追蹤外資動向時，得到的資料還得經過思辨，才能消化為有用的結論，否則只是盲從而已！


    跟著洋人操作可以，「如何跟法？」卻是大有學問，一般人很難學得會，就算學會也很難執行。怎麼說？因為外資在台灣股票市場的操作比較偏向長線，但各位每天緊盯三大法人進出表時，會不知不覺把外資操作看成是短線。外資在短線確實是有操作，但整體目標仍以中長線為主。所以，從外資累積的股市投資金額來看，外資確實對台灣一直很有信心，畢竟其投資在台灣的總體金額持續增加中。不過，這些錢都是熱錢，對台灣的正規經濟發展未必有正面效應。


    # 期貨市場的老大為外資


    接下來，我要講外資在期貨市場的操作。


    外資在期貨市場的操作主要以中長線為主，短線的成分'
  - '[PAGE 60]


    比較少（詳見圖8），採用的方法是一種大資金操作法。大資金操作法的特徵，就是錢非常非常地多，融資管道也非常非常地多，除了自己有錢外，更可以向別人借得更多的錢，


    # 圖 8 外資在期貨的操作以中長線為主，短線成分較少


    ![](img/3f1b0329c287cb4066ec12fb356db1ed_60_0.png)'
  - '[PAGE 61]


    這就是外資在期貨市場呼風喚雨的優越條件，一般人可學不來。


    因此，在台股指數期貨市場中，外資確實是贏家，但有個麻煩，由於外資在期貨市場採用的是大資金操作法，跟散戶的小資金操作法幾乎背道而馳，新手或散戶幾乎沒辦法跟從外資的期貨單。


    # 大股東不一定是贏家


    其次談到大股東。


    大股東因為持有的股份較多，可能跟公司高層有某種連緊或默契，大家也就很自然地把這些人歸類為消息靈通人士。有的大股東本身就是公司高層，那更沒有話說了。


    通常在做個股時，如果把整理段爆量從賣方來解讀，大家一致會認為這個賣方一定是大股東在供應籌碼。就這個觀念來看，大股東在個股操作中占了極重要的地位。如果發生在大盤呢？由於大盤是所有上市公司的大小股東合作出來的成果，大盤的爆量就解讀為大股東也出了好多的貨。


    由於個股較容易操控，大股東在個股當中的表現，往往具有決定個股的命運。尤其投機股，大股東的出貨就愈要小心。如果不是投機股，大股東的出貨很可能是某種策略上的更換，有時也不能夠代表他一定是惡性換手。


    另一方面，大盤（加權指數當中）的大部分上市公司的 大'
  - '[PAGE 62]


    股東力量加起來，當然足夠有撼動大盤趨勢的能力，但事實上不一定。因為撼動的往往是大盤的短線趨勢，長期而言，大股東倒貨的動作並不能改變長期趨勢。所以，若有機會問問一些大股東的投資祕訣，他們會告訴你「長期投資時要順勢而為，千萬不可逆勢而為」，其中的逆勢而為就暗指「他們能夠更改現有的這個趨勢」。


    愈是投機股，大股東的出貨與進貨占其重要的成分就愈高；愈不是投機股，大股東的重要性就會降下來，因為市場上的資金管道愈來愈多，不只是大股東有錢，陸陸續續引進的外資大法人也很有錢，大股東的實力占全體市場比例就會被稀釋掉。總之，大股東不一定是贏家，贏家也不一定是大股東。但是，大股東在個股中的動向確實是值得密切注意，尤其在投機股身上最為靈驗。


    至於主力，有所謂公司派主力，就是大股東，也有所謂市場派主力，即市場獵人，他們從某些管道蒐集資金，然後針對可以炒作的個股下手，過去我們通稱的主力，或多或少、有意無意就是指這些人。後來，民國九○年代引進外資之後，主力的定義愈來愈廣，可以說，只要有相當資金實力的人，都可稱之為主力。


    在短期或中期的趨勢上，不論是個股或是期指，主力的力量都不可以小覷，當然他們也會錯，只是錯了以後，曉得迅速更正，各位千萬要注意。'
  - '[PAGE 63]


    # 「英雄所見略同」效應


    到底，贏家是什麼樣的東西呢？我們常說「英雄所見略同」，這句話表現在加權指數上滿準確的，但在個股方面，有些交易來往的雙方不見得是什麼贏家，只是兩派人馬互相廝殺而已，格局稱不上有什麼高調。


    我們講的贏家是少數的，這些人散布在各個階層當中，外資裡面有贏家、大戶裡面也有贏家、大股東裡面也有贏家、散戶裡面也有贏家……只是到了最後決勝的關鍵時刻，都會發生「英雄所見略同」效應，股價才會在向上突破或向下突破時，表現出強而有力的一致性發展，此時此刻，才感覺到贏家團結的力量。


    不過，這其中又有許多股地方勢力或外來勢力來搭順風車，我們暫且管不到這麼多。一般來說，在突破趨勢發生時，力量愈大，我們就認為這股贏家的力量糾正許多不同意見人士的看法，也匯集了其他山頭勢力與地方派系的資金實力（詳見圖9），大家共同來完成這個突破。這也是我們這幾篇文章一直討論「成交量很大」的原因。因為大量就代表異常，異常就代表一種明顯的訊號。


    # 聚焦在轉折，而非轉折之後


    在關鍵即將發生之際，或者已經發生的時候，盤勢會發生'
  - '[PAGE 64]


    明顯變化。不管這個訊號是上是下，無非在提醒我們：趨勢即將發生轉折，要多做準備。至於這股力量到底是向上或向下？給各位衷心的建議：焦點應該集中在關鍵轉折，而不是一下子就把眼光跳脫到關鍵轉折之後的趨勢，那樣就有點好高騖遠了。這種好高騖遠會把你帶進預測的陷阱，忽視眼前的正在發生的事情。


    兩軍將要決戰時刻，必須觀察敵我雙方的軍事部署，而不是直接預測這場仗打完了後哪一方會贏、哪一方會輸。我


    # 圖 9 分歧經過整合後，成交量會變大且走勢強勁


    ![](img/3f1b0329c287cb4066ec12fb356db1ed_64_0.png)'
  - '[PAGE 65]


    不知道你去猜想這個要做什麼，是準備要戰後分功？還是先做好勝者為王的打算，所以先去打造皇冠與龍袍？總之，我的主張是「爆大量」只是一種訊號，參與的人因為不全都是主力（即使是主力也可能會犯錯），因此他們這一個大量出貨，可能只是一種暫時性動作，如果以後錯了，就會自動把它調整回來；反觀散戶並不會，他們對於趨勢方向的觀念往往被心中的成見及妄想所決定，並非客觀地衡量當下的現實後才洞悉明白。


    # 爆量只是訊號，不是確認趨勢


    最後再一次強調：整理段進行時，我們充其量只是大概區別現在路走了多久，如果走不久，就可能在左邊的位置。有時會感覺到走了一半，有時走了遠一點，我們就擔心這邊可能是右邊的位置。其實，右邊也沒什麼可怕，如果整理成功還是會上去，如果失敗就下去，右邊就變成右肩。或許你會問，整理段成功後的右邊叫做什麼？答案是「沒有」，我們還沒有給它取名字。


    總之，叫它左肩或右肩都只是猜測，我們可以順著這個猜測去做事，但是不能被這個猜測綁死。從這個道理往下推過去，整理段在進行的時候，任何一個地方爆大量，都只是一種明顯嚴格的「訊號」而已，並不是表明未來方向真正要往哪裡走。'
  - '[PAGE 66]


    # 中間頭部的爆大量，往往是發生在第一次整理完畢後的上升攻。很多主力認為，經過第一次洗盤的考驗之後，大家賣出來的貨會比較真心誠意一點，也就是說，經過左肩的洗禮之後，大家的想法會比較成熟，因此很多人會爭先恐後地在整理段中間的位置賣出（詳見圖10。所謂的中間只是一種大概的感覺，因為盤勢正在進行中，也許將來這個中間並不是在中間，而是在左邊也不一定）。


    假設在中間的頭部爆完大量之後，成交量就迅速掉下來，


    # 圖 10 經過左肩的洗禮，大家的想法會比較成熟


    ![](img/3f1b0329c287cb4066ec12fb356db1ed_66_0.png)'
  - '[PAGE 67]


    那麼，這個盤勢就不太好（詳見圖11），表示觀望的人變多了。如果感覺一般群眾還是很熱情，這個觀望的人應該就不是散戶，而是有-striped 點實力主力，此時這種量縮就要往負面去解讀。


    如果主力堅持原來的想法，認為這個整理段將來不會再漲上去，那麼他還沒有出完的貨就可能會放在右肩出貨——這是下篇文章要講的重點。


    # 圖 11 中間頭部爆完量後成交量迅速下滑，代表盤勢不妙


    ![](img/3f1b0329c287cb4066ec12fb356db1ed_67_0.png)'
  - '[PAGE 68]


    # 1-6 第六招


    # 右肩變形之後

    仍然是右肩


    主力大戶如果有很多貨要出，而且也準備在這個整理段出貨的話，原則上會分批出，也就是左肩、中間的頭，以及右肩，都能看到出貨的影子。但是，因為大部分人還存著一點觀望心態，希望這個盤勢能不能多拉高一點，加上大部分大戶倉庫裡的股票還真的不少，基本上不可能把全部股票給出光，所以他們有選擇的權利，選擇在「最後的那個關鍵點」出最多的貨──以上是右肩爆量出貨的背景來源。


    # 留意從多頭夢裡清醒的主力大戶


    大戶的心態可分為兩種：一種是用預測法，事先猜測這個整理段會成為頭部，因此在橫向整理之際，每一個位置、每一天在以虛虛實實的方法掩蓋出貨；另一種是大戶本身沒有算計到這個整理段會成為頭部，或許還在看多，甚至跟散戶一樣陶醉在多頭夢幻的氣氛，橫盤整理時不僅不出貨，反而進貨。但如果這個大戶是優秀的操作者，當進貨進到某個時'
  - '[PAGE 69]


    間點發現不對勁，非常可能會「倒貨」了（詳見圖12）！


    總結來說，知道這邊是頭部的大戶，對右肩爆大量的貢獻會較少些，反觀一路走來沒有算計到這個整理段是頭部的大戶，在最後關頭感覺多頭無以為繼時，就會猛然把自己所有的貨一口氣全倒出來，對右肩爆量的貢獻很大了。


    在技術分析的型態學中，「右肩爆大量」是個直接且乾脆的觀察目標，對實際操作很有用。此處也要話分兩頭，一是講大盤，也就是加權指數。加權指數在2012年之後，完整的


    # 圖 12 右肩爆大量對個股來說，是惡性出貨的徵兆


    ![](img/3f1b0329c287cb4066ec12fb356db1ed_69_0.png)'
  - '[PAGE 70]


    三尊頭比較少見，右肩爆大量這種情形就算學到，也只是放在心裡當備用知識（詳見圖13）。為什麼加權指數的三尊頭逐漸減少？或許是跟一般操作者愈做愈短有關係，但這不是本文討論的範圍。


    二是講個股，右肩爆大量對於個股的操作來講很重要，建議大家要做大量的練習。藉由練習（觀看個股股價線路圖右肩爆量出貨的圖形案例），才能體會什麼是右肩爆量出貨。


    擁有知識是一回事，能夠把知識付諸實行又是另一回事，


    # 圖 13 近來較少看到大盤出現右肩爆大量


    ![](img/3f1b0329c287cb4066ec12fb356db1ed_70_0.png)'
  - '[PAGE 71]


    唯有經過大量的練習，才能說我們真的接受了那個知識。我們散戶有個嚴重的認知謬誤，就是誤以為「知道」跟「做到」是同一件事……我以後還會再講。


    # 型態學的基礎：心理學


    一路談下來，我分析過左肩、頭，以及右肩爆量出貨的情況，試問：


    +   （1）如果把那一根爆大量的成交量移到跌破頸線之後，又該怎麼解釋？

    （2）如果整個頭部都沒有量，而是在下跌很久之後才爆大量，又該怎麼解釋？

    （3）如果在頭部沒有量，跌下來以後也沒有量，又該怎麼解釋？


    以上正是在第三招〈以人文的心理分析解讀型態〉所提出來的第四、第五、第六道問題。


    我說過，量爆在哪裡並不一定，只是按照心理學的習慣跟發展，主力大戶可能賣在右肩 —— 這句話說到這裡應該就結束，奇怪的是，這句話到現在卻變成「右肩爆量以後，下跌的『概率』比較大！」顯然現代人學習技術分析，不太去研究技術分析背後的心理因素，而是統計右肩爆大量後下跌的概率有多少。'
  - '[PAGE 72]


    如同有人觀察兩性婚姻，不去思考夫妻是出自什麼原因才走到離婚地步，卻直接統計「有了外遇後就離婚」的機率高多高。儘管就某方面來說，該統計數據是有用的，讓我們了解外遇在離婚中佔了多少重要性，但這種統計做久了，就會慢慢發生後遺症
    —— 統計者早已不去思考為何會有外遇？外遇為什麼會發生？為什麼婚姻的法律型式不能夠保障沒有外遇？……統計做久之後，逐漸喪失人文的思考能力，這是新手散戶遇到最嚴重的問題。


    # 心理學造就99%股市行情


    前面幾篇文章，我的解說過程都使用了一些心理分析，告訴大家如果這裡有一群人叫做主力或是大戶，他們是用怎樣的心態看待這個整理段，又是用怎樣的心態在左肩或者是右肩出貨，因為在每個位置出貨的心理狀況都不一樣……


    我不是要大家死背這些心理狀態，而是要提醒：如果我們真的非常尊重主力，那是否應該對他們的動態做番深入的心理研究？之所以使用「心理」兩字，是因為有許多操作者喪失了心理分析的能力，在做自以為是的分析時，只像科學家般觀察對方的行動路徑，然後就想依照某種幾何或數學公式推測下一步落腳處，這就是我常講的「中了理工科的毒」，不知變通！


    股市是一個心理戰，藏著大量的心理分析，技術部分只是'
  - '[PAGE 73]


    第二順位（《交易，創造自己的聖杯》作者薩普博士認為，交易有99%都是心理分析，也就是心性的修練；一般新手認為的技術分析只占1%都不到！）。而這種心理分析，發生在別人身上的比較少，發生在自己操作者的身上比較多——跟以往理工科學生受到的訓練完全相反！


    理工科的教育是說天地萬物宇宙的奧祕都在萬物自己身上。舉例來說，一滴雨水從天上落下，它的行動路線會跟水滴形狀、質量及水跟空氣的磨擦係數有關，跟路上行人卻毫無關係。在如此觀念的訓練之下，操作者會慢慢變成計算的機器，無法分析人類的心靈，不論是別人的心，還是自己。因為在學校教育中長久與心靈隔絕，也就漸漸失去我們的心。所以進入股市，我認為有項功課必須排行第一順位，就是喚醒我們的心理分析能力。


    既然量可能爆在任何地方，依照我上一段的建議，各位應該去稍微了解一下主力出貨的心態與動機。在整個整理段的行進過程之後，是一個完整的故事，或者是一個無頭無尾的故事，不論你怎麼看，都是一段故事。如果你不能夠自圓其說，就要蒙著眼睛在跌破頸線以後賣出。如此一來，你就變成一個機器，而且還有一個更大的後遺症：你根本不知道為什麼要這樣做，只是在遵守一種你不知道的規則。這就是長久以來，技術分析（尤其是機械法）為人詬病的地方，因為操作者本人並不了解技術分析背後的意義。'
  - '[PAGE 74]


