    ## 尖頭過後，就知道誰在裸泳


    接下來要談「尖頭反轉」。


    顧名思義，它只有一個頭——上去沒待多久，然後就下來了。如果待得比較久，依照過去常見的狀況，可能會形成


    ## 圖 21 在L1、L2、L3三個下跌段中，包含兩個整理波（腰部）


    ![](img/3f1b0329c287cb4066ec12fb356db1ed_101_0.png)


    「圓型頂」或「平頭頂」。圓型頂的意思，是它的頭部長得圓圓地；平頭頂的意義也很簡單，如同一個擁有國字臉的人，他的頭頂是平平。但這兩種頭部，不論是大盤或個股都較少見。尤其是在大盤，圓型頂跟平頭頂這兩種型態，近20年都沒看過。


    可是台股自從2000年之來，出現只有一個頭部的孤絕型態機率逐漸提高，原因到目前為止仍不是很清楚。根據我的看法，之所以會發生愈來愈多尖頭反轉，跟「台灣的基本面變差」有關係。


    因為從1998年之後，也就是前總統李登輝執政末期到前總統陳水扁執政的8年，差不多12年當中，台灣的基本面走的是一个比較明顯的下滑趨勢。直到前總統馬英九上台，一度有死灰復燃跡象，但後來這股回春力道卻很快消逝。


    既然台灣內部的

    基本面正在變差，為什麼現在（2015年10月）的加權指數還在8000點之上呢？那是有國際基本面的加持，例如美國本身的經濟還在往上走，中國大陸新經濟實體又逐漸增強，兩個有錢大國對於台灣的幫助當然不少，幫台灣撐起了半片天。如果不是有國際勢力支持，台灣基本面轉差的事實會變得更明顯。


    儘管大家已經在怨聲載道，但路上還沒有看到白領階級變成乞丐，或是買不起房子的人在忠孝東路搭帳棚住的蕭條慘狀，顯見台灣的狀況算是還可以。不過，這種「尚可」的局面，並不能讓股票市場的股價趨勢變得很強力、漲勢變凶猛，頂多只是讓它的底部逐漸墊高而已。一旦底部墊高了，創新高就變得比較簡單了。所以各位在近兩年不難發現一個奇怪現象，就是台股在創新高後，通常都會有一波立刻拉回下跌的趨勢，搞的每個波浪不分大小，似乎都要搞尖頭反轉一樣，對於做短線的人而言，是一件很不好的事，因為它讓整個型態變得很複雜。


    ## 盡量用肉眼做技術分析


    尖頭的定義很難，就印象所及，我看過的股票書幾乎沒談到用最嚴格的數學方式去定義什麼叫做「尖頭」。我個人的方法是用肉眼看，建議有心要進步的同學也要鍛鍊你的肉眼，使它具備基本的常識水準，這樣就已經算是非常厲害了，因為一般人的肉眼在觀看較為抽象的圖形時，就不會與常識發生任何的聯想。


    尖頭反轉就只有一個頭，而且是方圓多少里之內，沒有第二個頭能跟它比高度，我把它叫做「孤峰」。這個孤峰的名稱，是我幫尖頭反轉做的一個小小的改良。我認為，傳統的尖頭稱呼會造成混淆，只要頭部是尖的，大家就覺得它好可怕，因為尖頭往往跟反轉連在一起使用。殊不知，「尖頭反轉」大都用來形容反轉以後殺得天昏地暗，讓大家沒有右肩可以逃。


    之所以為頭，就是因為是最高點，可能會用最高的股價套牢最多的人。一個比較標準的完整頭部，應該是三尊頭，也就是包含左右兩個肩膀的頭部，右肩是拿來幹什麼用的呢？就是拿來當成逃命用，右肩才常因此會爆大量。如果沒有了右肩，直接像溜滑梯一樣滑下去，那還得了！這就是孤峰聳立，套牢一堆人在尖尖的絕頂上，而且方圓百里內不會有救兵，也就是近期不會有反彈波來幫忙解套。想想看，這種情況是多麼悲慘啊！


    就是因為尖頭反轉給人的印象很可怕，所以我才認為光是用「尖」這個形容詞，並不足以形容它令人恐懼的程度，改成「孤絕的獨聳高峰」才能比較傳神表達那種蒼涼絕境。


    從孤峰望下去，左邊沒有左肩、右邊沒有右肩。左邊沒有左肩的意思是：沒有一個提前的訊號告訴你頭部即將形成；右邊沒有右肩的意思是：股價就這樣下去了，而且沒有救生網，所以不會有反彈解套，這樣一來就要老命了。


    ## 看懂主力出貨手法


    如此險惡的型態，為什麼發生頻率愈來愈高？雖然我前面提過，是因為台灣內部的基本面變差，但問題是：「市場主力怎麼會放任這種情況發生呢？」


    說實在，主力大戶（包括外資在內）手頭有非常多的股

    票，如果頭部做得太小，上去後很快就下來，之後又沒有像樣的反彈，這樣子的跌勢對於大戶而言，在狹小的頭部能夠賣掉的股票有限。


    一般來說，他們都是利用頭部的震盪才能夠逐漸出清大量持股，若是尖頭反彈，頭部小、下跌快，他們就很難出貨了——這種想法完全正確，不過，外資在面對「台灣內部基本面逐漸轉差」的大趨勢，就算錢再多，也很難力挽狂瀾。於是，山不轉路轉、路不轉人轉，主力大戶在近幾年（2014～2015年）已經有點改變原來的作法，他們在第一個頭部（單頭）出現後就盡力拉解套波（變雙頭）——這種作法是從民國九〇年代延續至今，直到前總統馬英九任職末期，才因國內基本面確實轉差的因素太明顯了，舊有操盤手法不太適用，所以退而求其次。


    以下我稍稍為各位講解一下。


    ## 2000年的雙大尖頭


    在台股以往的歷史中，如果股價突然遭到意外的沉重賣壓而被打成尖頭，而且確實下跌的速度增快，下跌的時間也延長，這樣子不但可以看到一個尖頂，也會看到一個長長的尖錐體。


    2000年的最高點10393，正是一個尖頭反轉案例。由於股價待在高檔尖頂的時間太短，法人大戶來不及出貨，尤其是外資，叫他們在這麼短的時間內把持股獲利了結實在很困難。怎麼辦呢？就在下跌的一段時間後，「斟酌情勢」後再拉一波解套波。那個解套波就是從頸線8250點（2000年3月16日）出發往上拉，然後再拉到10256點（2000年4月6日）。


    所以我常說，10393點跟10256點是2000年的兩個大尖頭，


