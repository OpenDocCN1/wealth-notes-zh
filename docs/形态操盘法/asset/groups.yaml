    在股市，尤其是個股，右肩爆量出貨是件很嚴重的事情。這個法則看起來似乎很簡單，如果每個人都知道，豈不是股市的把戲就被人識破了嗎？放心，市場自有對策來對付，那就是把右肩搞個變形（變態），讓大家看不出來，這樣子，錢就不是人人都能賺得到了。'
