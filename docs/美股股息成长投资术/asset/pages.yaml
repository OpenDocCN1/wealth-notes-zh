- pgno: 248
  md: '假使你有分析企業本質的能力，也評估了企業價值，但投資策略設計得再精妙，也敵不過最大的敵人，也就是你自己。即使你的分析品質再高，但若是受到媒體、朋友或價格變化影響，而輕易地放棄原本的想法，那麼將實現了永久資本利損。


    做對的事，市場並不會立即以獎勵作為回報。因此，回到一開始的問題：「會不會賺了股息、卻賠了價差呢？」答案是：很可能會。


    即使你接受了我在本章提到的3點解決方法，包含專注企業本質、注重企業價值與耐心（時間），你還是可能犯錯。有時你做了所有該做的，也以理性的計畫按部就班，但事情總是不會完全按照設想的方向發展。


    因此，我想分享另一個投資理念——學習放手。放手，有時是一種智慧。你既要學習如何當一個贏家，也要學習如何當一個輸家。以前我在做短線期貨、選擇權或短線股票交易時，同樣會制定一套合理的交易系統，而這系統明確地規範我所有的行為。所有交易就如機械般的執行，不因前一次交易的盈虧，而決定這一筆單該如何執行。


    在長期投資當中，雖然有點不同，但我認為僅有出手頻率的差別，相同之處都是有勇氣地確切執行投資系統。


    對於長期投資，我坦然的面對我會評估失誤，也會看走眼的現實，而我'
  merge: -1
  img_proc: true
- pgno: 249
  md: '也知道不可能每一筆交易都完美無缺，我接受這樣的「不完美」；因此在下一次做投資決策時，我也能毫無畏懼的執行當下我識別到的機會，不受前一次投資經驗的影響。加上我始終保持良好的分散性，正面我贏，反面我小輸，因此我很樂意用一點損失來驗證我的分析結果。


    我想強調的是，有能力分析是一回事，而持續有勇氣執行正確決定，又是另一種更稀缺的特質。


    國外的長期投資者，通常會注意「Payback」（還本率），也就是透過股息發放，大約多久能夠還本。隨著自己的心態調整，這時問題的核心反而會在於：必須先相信長期投資的信念，然後確信自己有第2層思考能力，以及持續做出正確決策的信心，並接受決策不是完美的。一旦有穩固的信心，那麼股息就是「附加」幫助還本，而不會去想「會不會賠價差？」


    這絕對需要時間累積與練習，你無法看出现在做的努力，在未來會以什麼方式串聯起來。但我相信，當你10年後回顧的時候，會發現過去無數的小點滴，最終以某種形式連了起來；你會感謝10年前的自己做了這麼多。'
