  md: '![](img/dfd1504d95bd8956cc82c7d5cbadb262_221_0.png)


    # 善用股息再投入

    讓總收入大幅成長


    建立股息成長投資（DGI）組合後，每季會收到股息（少部分為月配），假如持有的企業家數愈來愈多，因為配息的月份錯開，甚至可能每個月都會有現金收入。


    假設一如預期，每年股息可能在某一季度或某兩季宣布成長，這也是DGI希望建構的每年成長的現金流。無論是否退休，假如投資人還不需要完全仰賴現金流來維持支出，那麼都應當考慮股息再投入計畫（Dividend
    Reinvestment Plan，DRIP）。其中，DRIP對資產累積階段的族群更是重要，因為仍在職，並沒有立即使用現金流的需求。


    當企業獲利成長、宣布股息成長，投資人收到更多股息後，可透過DRIP累積持有股數，不需投入新資金，也能產生雪球滾動效應（詳見圖1）。


    我們來試算有無執行DRIP所能領到的股息差異。假設投入1萬美元，殖利'
