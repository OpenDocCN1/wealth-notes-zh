  md: '價不會回跌到90美元呢？到時，你會不會又覺得自己很聰明，在100美元的時候就被迫讓出股票了？這邏輯好像不太對，你不是堅定的股息成長投資者嗎？按理說價格的波動不會是你再意的，你在意的是企業本質。


