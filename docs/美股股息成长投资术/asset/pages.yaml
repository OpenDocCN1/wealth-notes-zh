- pgno: 430
  md: '此外，我很少開券商軟體，也不喜歡將時間花在交易上面，這種方式要時時刻刻關注價格變化，嚴重違反我要的簡單與被動原則。


    # 方式3〉靠近結算時，賣出價內賣權


    沒錯，是「賣權」！在本篇這邊首次出現，後續章節會獨立介紹賣權。


    我最傾向使用的方式是上述第1種——轉倉，然而，有時轉倉的合約或者權利金非常不理想，導致轉倉的效果不彰，這時，我便會放棄轉倉。此時還有一個方式提供最後的機會，雖然不完美，但還可以接受。使用情況在於，賣出賣權（Sell
    Put）的履約價扣除收取的權利金之後，接到股票的成本，仍然在合理價或之下的價格。


    使用價內的原因在於，我很希望用此價格取回1張股票，雖然成本較高，但仍是理想價格。而如果結算在賣權的履約價之上，還可以收取額外的現金流。雖然本來的股票仍然遭到讓出，但多了賣出卖權，至少有機會接回股票，或者收取現金流，而不是只能等待結算一途。


    但最好在距離結算前1週～2週再使用，原因在於時間假如太長，變數變大，若結算價格低於賣權履約價、又低於原有的賣出買權履約價，那麼到結算之後，原本的持股仍在，還又多接了1張股票，但這情況並非是原本的計畫。最佳的情況是結算價格低於賣權履約價，但「高」於買權履約價。'
  merge: -1
  img_proc: true
- pgno: 431
  md: '![](img/dfd1504d95bd8956cc82c7d5cbadb262_431_0.png)


    如表5範例，假設當初取得阿撒丹尼爾斯米德蘭農業（美股代號ADM）的成本為35美元，在8月18日時股價已漲至45美元，而8月25日到期的賣出買權合約履約價為42美元，評估結算時要跌回42美元的機會不高，且事前計算合理價格假設為48美元。


    也就是說，賣出價內賣權履約價46美元，因為賣權履約價高於現股價格，因此為價內，結算時只會有2種情況：


    +   1. 股價高於46美元：沒接到股票，每股收取權利金1.15美元。


    +   2. 股價低於46美元且高於42美元：原本的股票讓出（因為高於一開始的賣權履約價42美元），但8月18日追加的賣出賣權反而接到1張股票，成'
