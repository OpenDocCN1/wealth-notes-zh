  md: '![](img/dfd1504d95bd8956cc82c7d5cbadb262_12_0.png)


    # ## 速度與方向


    我向來喜歡不直接給答案，有時會用問題來回答提問者的問題。例如，你住台中，想到墾丁吃海鮮和看海，開車時速每小時100公里，中間吃個飯、喝個咖啡、加個油，估計要40分鐘；路程全長假設250公里，堵車20分鐘，不走3號國道，而走1號國道（北），請問需要多少時間？


    許多朋友立刻埋頭計算，說需要3個半小時，我說不對，再把問題重複一次，可能來回2～3次，終於有人領悟回答，應該要走國道（南）吧，不然跑到基隆去了！


    是的，方向錯誤，加速只有離目標更遠！不管是做整體的財務規畫或投資管理，多年來來的經驗告訴我，方向比速度重要。


    江湖僅是湖，就已有三教九流的人物，令人目不轉睛；股市如海，投資管理的學派各有其強調的投資理念以及操作技巧，究竟何者才是你所需要的呢？'
  merge: -1
  img_proc: true
- pgno: 13
  md: '這本書在我看來，最有價值的部分，是指出了一個不容易出錯的方向：想到墜丁看海，不管是1號國道、3號國道、省道或羊腸小道，只要往南的方向走，你一定可以達到目的地，只是時間早一點、晚一點的差別而已。


    如果你是初次接觸投資的朋友，分不清自己應該選擇主動式投資管理，既要選擇進出的時機，又要分析個別股票，還是應利用指數股票型基金（ETF）被動式管理來操作，那麼遠日Gucci的前言和第1篇，則是精彩的一闕。如果不能說服你成為主動式投資者，那麼這本書絕對不適合你——不必感到難為情，反而要恭喜你，因為這是一個重要方向的抉擇。


    如果，你已經很清楚自己想住主動式投資管理的方向學習或靠近，我認為這本書有其精彩之處。因為這猶如美宵恆經典歌曲中的《再回首》，人生若不經幾番挫折、困頓，很難感受到那歌詞中「再回首，才知道平平淡淡從容容才是真」的滋味。


    遠日Gucci從期權如此波動之大、獲利或虧損都驚人的操作模式，轉換到指數型的資產配置，再到股息成長投資術，這個轉折與之間的摸索，其調整和定位值得許多投資人參考。因為事關方向，更重要的是這個股息成長投資術，方向出錯的機率小，而成功的機會大，為什麼？讓書中的內容來告訴你。


    有一本書，投資理念如其書名《Dividends Don''t Lie》（股息不會欺騙'
