  md: '酬率。利用量化方式預估未來，其準確率遠遠比不上深入研究企業後所做的完整判斷。


    關於其他細部篩選的衡量標準，如果使用者有興趣，請自行上我的部落格檢視。此外，我不建議各位讀者直接拿這份清單，做輕率的決策，因為你還是必須回到企業的本質，維持一貫勤勉的研究，同時把量化數據，作為確認的步驟。


