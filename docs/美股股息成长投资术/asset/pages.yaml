- pgno: 344
  md: '# 3. Key Ratios（重要財務比率）


    回到網頁上方，點選「Key Ratios」後，「Financials」（財務）欄目為財報當中較重要的數據摘要，時間長達10年。這區塊的每個數據都很重要，因此我會全部查看，而下方還有「Profitability」（獲利率）、「Growth」（成長性）、「Cash
    Flow」（現金流）、「Financial Health」（財務健康）及「Efficiency Ratios」（經營效率比）5個標籤頁，其中，我常看的是「Profitability」、「Cash
    Flow」與「Financial Health」。分別介紹如下：


    ![](img/dfd1504d95bd8956cc82c7d5cbadb262_344_0.png)


    Financials（財務）：例如在第4篇介紹撰寫企業分析的量化分析重點項目（詳見4-1），當中的長期基本面數據，這裡都可以快速看到數據。例如，「絕對數字類」包括營收、EPS等，我會看第1年與第10年，知道整體趨勢為何，再計算年化成長率。至於毛利率、營業利益率等「比率類」，則會看穩定性（能成長更好），然後計算10年平均估值。'
  merge: -1
  img_proc: true
- pgno: 345
  md: '要特別說明，假如「Free Cash Flow」（自由現金流）為負數，我會查看是否「連續2年為負」，如果僅有1年為負，可確認是否因為整體產業環境所致或者是一次性支出（例如罰款），雖暫時無須緊張，但至少要知道原因。若連續2年為負，則該提高警覺，更需要找出原因後，評估企業的競爭優勢是否完好無缺。自由現金流非常重要，不僅反映企業真實透過營運獲取的金流，也同時影響未來股息成長的潛力。


    ![](img/dfd1504d95bd8956cc82c7d5cbadb262_345_0.png)


    ②Profitability（獲利能力）：在「Profitability」這區塊，聚焦在跟企業獲利有關的比率，主要能從中詳細看到營收結構（可清楚看出各項利潤、成本、費用等項目占營收比率），以及ROE（股東權益報酬率）的變化。'
