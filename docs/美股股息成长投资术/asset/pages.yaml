  md: '# 56


    # Simply Safe Dividends》

    簡潔財務圖表一目了然


    前面所介紹的網站為完全免費或部分功能需要付費，而本文所介紹的是付費網站「Simply Safe Dividends」（www.simplysafedividends.com）。這個網站主要分為兩個區塊：其一是提供簡潔的財務數據圖表、其二是提供投資組合管理的功能。


    # 財務數據圖表》資訊清楚易懂，能即時掌握公司狀況


    Step1 在首頁輸入股票代號後按下Enter鍵，進入個股頁面，系統會有企業概述與簡單分析，也會有①「Company Analysis」（企業分析）。使用者可以看到3個數字，分別為②「Safety」（股息安全度）、③「Growth」（股息成長率）、④「Yield」（殖利率）的評分，意義如下：


    +   1. Safety（股息安全度）


    數值介於0～100。評估分數是依照自由現金流成長率、當前股息配'
  merge: -1
  img_proc: true
- pgno: 384
  md: '發率、財務健康、ROIC（資本投入回報率）趨勢與產業循環等指標綜合而成。81～100分：非常安全，砍股息的可能性非常低；61～80分：安全，砍股息的可能性不高；41～60分：普通，砍股息的可能性一般；21～40分：不安全，砍股息的可能性很高；0～20分：非常不安全，砍股息的可能性極高。


    # 2. Growth（股息成長率）


    數值範圍0～100。假如數值為55，表示預估股息成長率高於55%的企業。評估依據為股息配發率、未來營收與EPS的成長性、穩定產生自由現金流能力、以及負債狀況等。


    # 3. Yield（殖利率）


    數值範圍0～100，表示該企業當前殖利率在所有企業中的位置，例如：數值55代表公司殖利率高於5%的企業。


