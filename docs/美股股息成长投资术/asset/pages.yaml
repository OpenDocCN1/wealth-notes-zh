    # Portfolio Tracker雲端試算表》

    輕鬆管理投資組合


    「Two investing」部落格 的2位版主Johny與Scott本身也是DGI（股息成長投資者），根據網站上的介紹，2位版主是醫學院同學，現職皆為醫師，主要專注於2種投資策略，一是透過股息成長投資策略，管理長期資產，另一個則是選擇權交易。他們以Google
    Spreadsheet（Google提供的雲端試算表功能），做了一個功能非常完善且免費的投資組合追蹤工具「Dividend Stock Portfolio
    Tracker」，我認為非常適合DGI使用，幾乎涵蓋了所有DGI注重的功能。


    # 搭配Google雲端試算表，下載投資組合追蹤工具


    Step 1 進入「Two investing」部落格（www.toinvesting.com/2013/08/investing-spreadsheets/），點選「Dividend
    Stock Portfolio Spreadsheet on Google Sheets」，可以看到作者詳細介紹如何使用這個試算表工具。'
