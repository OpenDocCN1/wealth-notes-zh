  md: '# ## 資本益比企業可提供較高報酬

    ### S&P 500指數vs.最低、最高本益比族群累積總報酬


    ![](img/dfd1504d95bd8956cc82c7d5cbadb262_235_0.png)


    註：資料統計期間為 1975.12～2010.12    資料來源：Brondes Investment Partners


    5.2%，相差10.1個百分點。


    至於何謂「高估」？我提供我的做法，我是採取多種指標混合，如10年平均本益比或席勒本益比（Shiller CAPE）。


    1. 10年平均本益比達40倍：當10年平均本益比高達40倍時，我就定義為高估。特別注意，我不建議使用單一年度的本益比，因為很可能會受到會計準則中的某些一次性作帳影響，而做出誤判；或者該企業正處於短期'
  merge: -1
  img_proc: true
- pgno: 236
  md: '的產業循環或碰上暫時性的災難。


    此時，你必須了解企業是否對此有解決方案，假如認同企業改善的做法，那麼你必須有耐心地給它一段時間。因為能夠戰勝逆風的企業，才更能夠在時間長廊中存活，而不是站在風口的順勢企業。


    **2.股息折價模型超過40%：**使用「股息折價模型（DDM）」計算出的合理價，超過40%定義為高估。


    實際上，如何定義高估的標準因人而異，但你必須在持有與高估之間取得平衡，既不會輕易地讓出企業，喪失未來成長的現金流與長期資本利得，又不會錯失高估價格時重新配置資源的機會。


    # ## 7因素輔助投資人思考賣出時機


    除了以上2個觸發點外，你還需要同時考慮下列因素：


    **1.部位變得過大：**例如單一企業投資組合超過最高容忍值，如8%、10%，這個最高容忍值會依據投資組合的企業家數而調整。


    **2.企業發生質變或基本面嚴重改變：**這一點是影響決策中最重要的一塊基石。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '3.企業被購併或購併其他企業：雖然你不能決定企業的購併案，但是身為股東與投資組合的CEO，你可以評估企業的決策是否能夠為未來挹注成長動能。


    雖然購併經常是強強聯手，或者補足該企業未來想要發展的領域，然而無論是購併方或被購併方，你都要重新評估這項購併對其未來的發展性。因為購併需要長時間的磨合，包括資源整合與文化衝擊，不一定能產生原先預期的結果。


    舉例來說，美國電話電報公司（AT&T，美股代號T）在2016年10月宣布以1,087億美元（含負債）購併時代華納（Time Warner，美股代號TWX），取得多個頻道與華納兄弟影業。


    除了以股交換，流通股數將增加11億股（61億股變爲72億股）外，AT&T將新增負債400億美元，增加利息支出16億美元。增加的股數，等於稀釋掉原有股東的實際價值，減少約15%。


    根據AT&T估計，購併時代華納並整合完畢之後，第1年便能挹注獲利10億美元，約EPS 0.11美元。除了檢視以上數據外，還須考慮AT&T跨足媒體與影視業，是否能為其帶來新的成長機會，而你是否認同AT&T的策略？抑或者你更認同另外一家大型電信商威訊（Verizon
    Communications，美股代號VZ）2015年購併AOL（American Online）與2017年購併網路巨頭'
