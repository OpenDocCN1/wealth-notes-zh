- pgno: 148
  md: '發能力，能夠「持續」產出新專利的企業才具備此護城河。因為智慧財產向來是兵家必爭之處，一旦有利可圖，其他競爭者會不斷地透過訴訟方式來突破防護。


    而擁有持續創造專利能力的企業也不少，舉凡從製藥的輝瑞（Pfizer，美股代號PFE）、艾伯維藥品（AbbVie，美股代號ABBV，2013年由亞培大藥廠分割出去），到榮登23年北美專利王、每年能產出超過7,500項專利的IBM（International
    Business Machines，美股代號IBM），還有生產化學材料的3M（美股代號MMM），乃至於通訊晶片領導商高通（Qualcomm，美股代號QCOM），這些企業除了握有大量的專利外，每年都會再投入大量資金用於新專利的研發。


    即使某些專利因年限到期而失效，或遭競爭者透過法律途徑撤除，這些企業也能藉由長久以來累積的優良能力，保持長久的智慧財產優勢。


    # 3. 特許行業


    特許行業指的是透過政府嚴格審核，或透過法令許可才可經營的產業，以美國3大債券信評機構為代表。


    長久以來，美國信評產業始終維持三雄割據，包括標準普爾（Standard & Poor''s）、穆迪投資者服務公司（Moody''s Investors Service）、惠譽國際信用評等公司（Fitch
    Ratings）。要想通過繁複的法令成為第4家信評公'
