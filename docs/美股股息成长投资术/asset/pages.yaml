  md: '慢慢的你會發現，當研究的分量夠多時，許多不適合你的企業，你就會像戴了一副分析眼鏡，自然而然地繞過它們。初次研究個別企業相當耗費時間，假如能戴上這副眼鏡，就能夠將寶貴的時間，專注於研究適合自己的企業上。


    一開始，你會覺得對許多產業都非常陌生，然而你並不需要擅長每個領域。能力圈的大小不是重點，而是要從你的能力圈內尋找自己能夠充分理解的企業與其營運模式；有些領域門檻較高，但也不用心急，隨著分析能力的提升，跨界也會慢慢有所提高。


    # 投資美股，必需消費是最佳入門產業


    假如是初入美國股市的人，我最推薦從必需消費產業入門，其次為工業與健康照護。在S&P 500股息貴族指數成分股中，必需消費產業就占据了1/4的份額，其變動緩慢的特性，是孕育成熟與穩健產業的搖籃。


    再者，投資是生活體驗的延伸，從日常生活去感受一家企業，較容易產生聯繫感，而這份聯繫感，除了能幫助投資人在研究的過程中更為順利外，遇上市場波動時，因為對這家企業夠理解，也較容易產生信念。


    當然，要了解美股，首先其衝與不可避免的就是閱讀英文，假如要尋求中文資料，那幾乎是處處受阻。雖然近年國內已有媒體積極翻譯國外文'
