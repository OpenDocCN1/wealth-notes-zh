  md: '因此，投資人若想擁有理想的長期總報酬，在建立投資組合時，除了重視殖利率，更要關注所選擇的企業是否有股息成長（獲利成長）的能力。


    當然，本益比的變動也是影響長期總報酬的因素之一，只是這部分是投資人無法掌握的。不過，股息成長的原始驅動力是來自於獲利成長，即使本益比不變，也能夠帶動股價上揚，進而提升資本利得。假如市場給予的本益比提高，又能讓資本利得進一步增加。


    然而，儘管股息占有很重要的地位，投資人在看待長期總報酬率時，也不能只是著眼當下、單一年度的股息；更應該回歸企業本質，選擇具有成長性的高品質企業，以獲取長期成長的股息收入。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# 25

    布局股息成長股

    擁抱高報酬、低波動


    我喜歡數字，也是數據控，一切證據我都要數字來告訴我事實。在我學習股息成長投資（DGI）的過程中，從研究機構與資產管理公司蒐集到的大量圖表與數據資料，發現了許多股息成長企業的優勢。既然「股息」與「股息成長」是構成投資總報酬的重要部分，我們可以再從歷史的統計，來看看幾個問題：


    +   1.投資配發股息與不配發股息的企業，誰的報酬率較好？


    +   2.股息成長企業，是否能為投資人創造比大盤更好的報酬？


    +   3.若一併考慮風險（波動程度、獲利風險比），配發股息的企業也有優勢嗎？


    +   4.高股息配發率的企業，能提供較佳的報酬嗎？'
  merge: -1
  img_proc: true
- pgno: 85
  md: '雖然我提過，選擇投資策略時，不需要刻意與大盤比較，但是研究機構在評判投資策略的績效時，不免會把指數當作比較基準。事實上，你也會發現，長期投資股息成長企業，報酬率並不遜於指數。


    # 重點1》配發股息的企業財務體質較健全


    先來看研究機構Ned Davis Research曾經做過的統計。自1972年～2010年底的15個牛市（多頭市場）與14個熊市（空頭市場），投資配發股息的企業，無論是在牛市或是熊市，報酬率都略優於不配發股息的企業，也勝過S&P
    500指數（詳見圖1）。


    在熊市中，雖然配發股息的企業也呈現負報酬，但是負報酬幅度約只有不配發股息企業的一半。其原因在於，連續多年發放股息的企業，大多是成長穩健且財務體質較佳的企業，因此雖無法自免於整體大環境不佳的影響，然而因企業的競爭優勢沒有喪失、獲利減少的情況也更為緩和，甚至逆勢成長，如2008年的麥當勞（McDonald''s
    Corporation，美股代號MCD）、嬌生（Johnson & Johnson，美股代號NJ）與沃爾瑪（Wal-Mart Stores，美股代號WMT）等，在2008年～2009年間，獲利逆勢上揚。


    # 重點2》股息連續成長的「股息貴族」報酬率較佳


    進一步來看，股息成長、股息持平、不配發股息、股息減少這4類公'
