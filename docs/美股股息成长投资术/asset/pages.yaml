    # ### 迪士尼力拼轉型，2019年起推出自製串流平台


    迪士尼2017年8月宣布，自2019年起，將撤出目前在Netflix平台上的迪士尼影視頻道，並且自製自有串流服務（即迪士尼自製網路影音平台）；至於旗下漫威娛樂（Marvel
    Entertainment）和盧卡斯影業（Lucas）的影音作品，迪士尼尚未決定會不會在Netflix平台與自有串流服'
  merge: -1
