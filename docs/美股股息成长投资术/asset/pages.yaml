    # 從專屬投資者網站尋找企業相關報告


    在看完企業年報的Business Overview後，我不會立刻往下閱讀。因為在不完全了解一家企業或產業時，面對大量數字，其實容易找不到重點，更遑論感受企業的優勢，也難往其未來延伸。因此，我習慣直接看企業的其他相關報告（通常是PDF）。只要上網搜尋關鍵字美股名稱（或美股代號），並加上「Investor
    Relations」（投資者關係），都能找到該企業的專屬投資者網站。


    進入專屬投資者網站後，找到「Presentation」（報告），裡面通常會有大量的股東會議報告、投資銀行報告、研討會報告等。既然是報告，表示是在會議中播放的討論內容，因此含有大量圖表，藉由圖表呈現，能更容易找到重點。例如，你會了解到每個產業重要的KPI（Key
    Performance Indicators，關鍵績效指標），例如不動產投資信託（REITs）會呈現租房率、零售業會看售價是否上升或者同店銷售成長率、MLP（Master
    Limited Partnership，業主有限合夥）則會注重營業現金流、製藥產業則會注重新藥開發進程等。


    此外，報告中也不免會提到該企業的優勢處，以及重要計畫與產業趨勢，這些都是單獨看財報時，投資人無法立即掌握的部分；或者有些年報'
