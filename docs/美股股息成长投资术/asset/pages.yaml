  md: '# ### 23


    # 執行股息成長投資策略

    先養成3大觀念


    股息成長投資（DGI）並非隨意買進股票就能定期收到股息那麼簡單，儘管可能老調重彈，在此我仍想繼續提出幾個極其重要的觀念：


    # **觀念1》找股息成長企業，避免落入殖利率陷阱**


    或許你已經聽過「價值陷阱（Value Trap）」，意思是說，只看到陡降的價格便見獵心喜，卻沒有深入研究價格下跌的主因，究竟是來自於短期的利空但企業體質不變，或是企業的競爭優勢已遭到永久侵蝕。因此，不明事理的按下購買按鈕，將讓自己暴露於風險之中而不自知。


    短期利空消息的影響可能會被人性的行為偏差所擴大，此時就是買進超跌好企業的時機。然而有時候，投資人僅是對某家企業略有耳聞，或是曾經深入研究過該企業卻沒有持續追蹤，但當價格陡降至看似吸引人的價格錨點，便容易忽視重新檢視企業本質的重要性，乃至於在價格仍遠在企業'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# ## 第 二 篇 認識股息成長 奠定成功基石


    內在價值之上的時候，就質然的質進看似跌幅很大的企業，跌入所謂的價值陷阱。


    「殖利率陷阱」也是類似道理。嚴格來說，殖利率只是投資一家高品質企業所能獲得的副產品，企業本質才是因，殖利率只是果，不該反以高殖利率為優先選擇。這就如同在債券市場之中，企業給予較高的利率方能夠吸引投資人買單，背後當然是某種程度的風險暗示，除了企業本身可能暗藏的風險外，高配息這件事也不容易長期為繼，即使能夠持續配息，也很难有股息的成長空間。


    DGI追求的是穩健的現金流成長，投資期限一定是以長期作為規畫；既然你希望投資組合的屬性為長期、持續、穩健的被動收入，那麼選擇企業的時候，就要以宏觀的視野作為考量。你總不希望收入忽高忽低，甚至收到高股息之後，隔年就戛然而止，這簡直嚴重偏離了持續而穩健的投資組合訴求。


    更理想的方式，是找尋兼具股息與獲利成長的企業，因為股息能夠持續成長的企業，非常可能意味著其營收與獲利同時成長，也代表著投資人不只每季收到的股息會增加，所擁有的資產價值亦會成長。


    因此，不要將自己的思維侷限在當前的殖利率數字，而該一併考慮企業未來；就像價值投資，既要考慮當前價值，也必須對未來發展進行評估。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 觀念2》重視系統化投資策略，別跟股票談戀愛


    無論你多麼喜愛一家企業，它的產品擁有穩定的市占率、公司內部維持優秀的管理風格、股息成長趨勢長期且持續……但別忘了，再好的企業都可能有凋零的一天，僅有少數的企業能夠陪伴你度過整個投資生涯。


    記住你當初評估該家企業的結果，並且定期（1年至少1次）檢視企業的經營方向與評估未來可能的狀況，時時確保它仍符合當初的條件。假如只是一廂情願的深愛著它，只會被蒙蔽雙眼，進而對企業質變的事實視而不見，甚至為其找藉口。


    一旦察覺到企業的質變，更是該老老實實檢視企業的時刻，思考這是短期逆境遇上市場恐慌？還是長期優勢開始瓦解？


    每家企業都有艱難的時刻，能在逆境中轉型的企業，更是長期投資的絕佳選項，因此DG投資人應仰賴一套輪廓清晰且簡單的系統，來幫助自己增加長期投資報酬。


    簡單來說，人類以心理為基礎做出的決定是脆弱的，但系統化的投資策略不會。這邊指的系統化，並非像是IBM超級電腦華生（Watson）這樣的人工智慧（AI），必須寫出複雜的Machine
    Learning（機器學習，指訓練機器根據數據進行分析並學會預測）或者Deep Learning（深度學習，為機'
  merge: -1
  img_proc: true
- pgno: 76
  md: '器學習的一種，電腦自行從巨量數據找出規則）。所謂的投資系統化，是在投資時，簡單遵循幾條規則，以避免心理因素過於擾動。


    當一樣的數據同時攤開在2位投資人面前時，這2人會做出全然不同的決定，甚至同一個人在这1分鐘與下1分鐘也會做出不同決策。即使是身經百戰的投資人，也會受到情緒影響，讓投資決策過程複雜化，進而對財富造成巨大傷害。因此，採用簡單的系統化準則，最大優勢就在於它能夠移除我們的情緒行為，避免傷害的產生。


    # 觀念3》以長遠的視野投資，不要參與短線投資


    著名避險基金機構Baupost Group創辦人，同時也是經典書籍《安全邊際》作者賽思·卡拉曼（ Seth Klarman ）曾說：「投資人唯一能安身之地就是長期導向的投資。」這段話其實貫串了前述2個觀念：


    1.DGI需要的不是短暫的高殖利率，關注的是企業的實質與營運。


    2.投資人應當遵循系統化投資策略，因為短期的價格總是隨機漫步，參雜著過多大眾非理性的情緒，無法如實反映企業真實價值；然而將時間拉長來看，價格終能回歸企業應有價值。沒有一種策略能總是擊敗市場，即使是大師也不能年年做到，DGI也不例外。有些時候，報酬就是會落後於市場。'
  merge: -1
  img_proc: true
- pgno: 77
  md: '被譽為「價值投資之父」的葛拉漢（Benjamin Graham）也說過：「對於短線投資，市場只是一部投票機；然而長期投資中，它更像一台體重計。」


    短線投資就像投票機器，每天、每月、每季，乃至每分鐘，主要受到群衆的「情緒」所驅使；想要事前猜出大衆情緒的變化，幾乎完全不可能！當然，這場難預測的遊戲，你並不需要參與。


    記住DGI投資策略的準則，只要企業沒有下砍股息、長期競爭優勢沒有喪失，價格也沒有過分被高估，那麼即使投資組合的帳面價值減少，下個月、下一季，投資人同樣會收到持平或成長的股息現金流；而股價下滑所帶來的加碼買進良機，更可視為長期投資人展現紀律與長期等待的回報。


    因此，真正重要的不是短期報酬，而是「有沒有達成投資目標」；如同DGI需要的不是追求絕對報酬的數字，而是源源不絕的現金流、持續成長的被動收入。


    當你投資於高品質企業時，所能做的，除了每年檢視企業沒有偏離航道外，你能做的最好的一件事就是——別做任何事！'
