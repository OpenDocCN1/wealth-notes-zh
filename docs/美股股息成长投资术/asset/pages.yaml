  md: '的，因為需要搭配長期量化數據。既要同時借鏡過去，考慮其當前困境，還要放眼未來是否有改善計畫或新的購併案等，必須全方位考量才能有清楚的輪廓。


    本章的重點將著重在3-1提到初步了解一家企業當中的第2點～第4點，也就是企業本質的質化分析。質化分析的結果，我認爲其重要性凌駕在任何數字之上，因為企業的本質才是競爭力的基礎。質化分析結果也是投資人在面臨股價波動時，據以判斷能否堅持持有的關鍵要素。少了這一要素，投資人除了可能會輕易在便宜價賣出高品質企業外，也可能在企業變差時卻渾然不知。因此，在查看量化數據之前，絕對必須先通過質化分析的考驗。


    我使用的方式並非原創，而是參照《尋找投資護城河》一書中所提的4種護城河作為大框架，再自己額外延伸幾個小框架。而我在研究一家企業時，至少會從中找出一種護城河，然後再考慮其護城河狹窄或寬廣。書中一開始便提到，管理階層宛如騎師，企業正如馬匹一般。而馬匹比騎師的角色重要。簡而言之，有些產業的基本結構，就是比許多產業來得優良；即使管理者的能力一般，還是能夠長年保持豐厚的利潤。


    正如撲克牌賽局，一個只拿到「一對（One Pair）」的職業高手，面對拿到「同花順（Straight Flush）」的業餘玩家，儘管職業高手牌藝精湛，也很難發揮其卓越能力。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '管理能力卓越的CEO，或許能透過一些精明的商業策略，挽救企業從危機中脫困，並在短期間內得到成效，但難保不會被競爭者複製。因此維持護城河的重點，在於其事業具有結構性優勢，不容易被對手模仿，且比較不受管理卓越度影響。


    《尋找投資護城河》也提到，最容易被誤認的護城河為「優異的商品」、「龐大市占率」、「優秀管理者」與「卓越執行力」，但真正的護城河應為：「無形資產」、「顧客的高轉換成本」、「網路效應」、「成本優勢」。以下將根據我的理解，逐一解釋這幾種護城河，並佐以我認為擁有該項護城河的企業作為範例。


    當然，這部分也是科學與藝術成分各半的項目。每個人對於各項企業能力的解讀各不相同，而分析與批判能力為最重要的人格特質，對與錯沒有絕對，只要能夠說服自己且邏輯合理，並能夠反映出投資組合的長期成果，都是好的分析結論。


    # 護城河1》無形資產


    「無形資產」包含3個項目：品牌價值、智慧財產與特許行業：


    # 1.品牌價值


    首先是「品牌價值」，光從字面就夠讓人誤認了，例如聽起來很有名、'
