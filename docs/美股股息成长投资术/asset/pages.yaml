- pgno: 428
  md: '尚未突破履約價之前，你預估價格越過關鍵點時，有可能拉出大波漲幅。既然會出現大波漲幅，就表示原本的賣出買權（Sell Call）履約價極有可能被突破，且超過很大的幅度。


    而因為你已經有Sell Call這個鍋蓋，蓋住了最大獲利潛能，因此股價大漲讓你覺得「少賺」，而使你感到痛苦難耐。此時，你買進深度價內Delta值＞0.9（意即股價與選擇權的波動極為貼近）的1口買進買權來替代1張現股的價值，意思就是股票上漲的部分，會與權利金幾乎相等，因此能夠亦步亦趨地參與股票價格上漲。


    理論上，想法沒有錯，但這個過程會有相當多變數，右頁表4做了2種腳本以及可能引發的多種情況。


    這部分用文字難以完全清楚解釋，然而假如熟悉選擇權的你就會看懂，無論是走哪一套劇本，都會讓整個過程變得非常複雜且難以掌握。


    為了參與持續上漲，你必須額外付出許多精力，並且要時時面對多種複雜情況。最後也許持續上漲並帶給你獲利，但也可能讓你白忙一場，甚至遭受額外的虧損。起因都在於，你無法忍受「少賺」的折磨。


    因此，這個方式看似美好，但實務上，必須非常小心地呵護，或許你善於此道，或者樂此不疲，但你仍必須確定你有能力應付各種狀況。'
  merge: -1
  img_proc: true
- pgno: 429
  md: '# 透過買進買權參與上漲，可能遭遇多種變數

    ——2種買進買權（BC）模擬腳本


    | 腳本1 | 行為 | 場景判斷 | 最終結果 |

    | :--- | :--- | :--- | :--- |

    | 步驟 1 | 買進深度價內買權（BC） | 價格持續明顯上漲 | 參與全額上漲價差，但須扣除BC成本 |

    | 步驟 2 | 賣出持股，保留BC部位 | 漲勢趨緩而非大漲 | 實現股票資本利得，BC部位扣除權利金支出，可能虧損、可能獲利 |

    | 步驟 3 | 加寬買權（SC） | 停止大漲，甚至出現反轉跡象 | 增加SC保護BC的時間價值流失，組合成買權多頭價差。此時看法轉為緩漲，而非起始的大漲
    |

    | 情況 1 | 持續持有BC+SC | 保持緩漲 | 扣除BC付出的權利金，加回SC收取的權利金，可能為獲利 |

    | 情況 2 | 持續持有BC+SC | 反轉下跌至BC履約價之下 | 跌幅超過BC+SC付出的權利金總和，終至大幅虧損 |

    | 情況 3 | 持續持有BC+SC | 反轉下跌但保持BC履約價之上 | 結算後重新接到1張股票，選擇權的部分可能損益兩平或小虧 |


    | 腳本2 | 行為 | 場景判斷 | 最終結果 |

    | :--- | :--- | :--- | :--- |

    | 步驟 1 | 買進深度價內買權（BC） | 價格持續明顯上漲 | 參與全額上漲價差，但須扣除BC成本 |

    | 步驟 2 | 保留持股，結束BC部位 | 漲勢趨緩而非大漲 | 原有股票還在，但BC部位扣除權利金支出，可能虧損可能獲利 |

    | 情況 1 | 持股與原有掩護性買權還在 | 再度大漲 | 股票還是讓出了，但中間過程白忙一場 |

    | 情況 2 | 持股與原有掩護性買權還在 | 盤整，價格沒有超過履約價 | 股票還在，但中間過程白忙一場 |'
  merge: -1
