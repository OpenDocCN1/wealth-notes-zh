- pgno: 197
  md: '![](img/dfd1504d95bd8956cc82c7d5cbadb262_197_0.png)


    # 確立自我風格 建構最適切資產組合


    至此，已談論了質化分析（詳見3-2）、量化分析（詳見3-3）、全球行業分類標準（GICS）產業大框架規畫（詳見3-4）、以及該以多少企業家數組成股息成長投資（DGI）組合（詳見3-5）。接下來即將面臨的問題是，該從什麼企業開始著手？


    的確，我在剛開始建構資產組合時，腦子仍是一片混沌。這時，總得有個切入點來開始這趟投資旅程。因此，我列出了4種思考方向：


    # 方向1】從生活經驗找熟悉的藍籌股


    美國企業的產業結構發展均衡，且受全球化影響，你我的生活其實早已充斥美國企業所生產的產品或服務。我相信當中不乏許多你相當熟悉的生活用品，例如你入住飯店的空調是Honeywell（美股代號HON）的產品、公司電梯是聯合科技（United
    Technologies，美股代號UTX）的Otis品牌，'
  merge: -1
  img_proc: true
