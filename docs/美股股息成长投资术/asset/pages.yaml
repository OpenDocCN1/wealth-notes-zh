  md: '綜合前述質化與量化的分析，可確定CAH符合我的投資風格。人口老化與醫療支出上升是不可逆的趨勢，只要醫療處方簽不斷開出、醫療產品持續有需求，CAH這樣的通路商就有存在的必要，且CAH身爲寡占產業的龍頭，其護城河優勢在短時間內看不到被動搖的跡象。因此，接下來就是進行未來預估與價值評估。


    # ## 未來預估》觀察獲利數據，判斷公司成長力道


    # ### 1.預估未來獲利年化成長率


    從CAH年報中可以看到，官方預估未來幾年的獲利成長率爲10%～15%，爲避免預估過於樂觀，我不打算完全採用。


    前文提到，面臨削價競爭壓力與學名藥成長趨緩的趨勢，CAH也持續透過垂直整合購併與結盟其他企業來增加收益，以減緩藥品價格緊張所帶來的衝擊。例如2010年購併Kinray（獨立藥店中盤商）、Yong
    Yu（中國永裕新興醫療，醫療藥品器材銷售商）；2013年購併AssuraMed（居家照護產品商）；2015年購併Cordis（心臟與心血管醫療器材製造商）、Harvard
    Drug（學名藥銷售商）；另外，還有2014年與CVS的合作聯盟等等。


    晨星分析師預估，CAH未來5年EPS年化成長率12.7%，Yahoo!分析師則預估爲9.37%。綜觀以上想法，我認爲較合理的預估數字是8.5%～'
