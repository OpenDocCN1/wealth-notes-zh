    投資個股，原本就必須面對集中與分散的課題；即使分散，也必須在良好分散與採樣分散中做決定，這一點也不容易。因為人的時間、精力、能力都有限，一定要有此認知。


    研究論文〈Equity Portfolio Diversification：How Many Stocks are Enough ? Evidence from
    Five Developed Markets〉（〈投資組合分散性：持有多少企業才足夠？來自於已開發市場的論證〉）作者Vitali Alexeev提出，若資金規模為2萬5,000美元（約新台幣75萬元），則可以分散至15檔，每檔約1,667美元（約新台幣5萬元）（詳见表1）；'
