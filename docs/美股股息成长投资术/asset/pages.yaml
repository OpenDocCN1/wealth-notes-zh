  md: '例如，使用ETF做資產配置時，通常會採取股市與債市的搭配，常見的有2種做法：


    # 1.簡約式風格


    以2檔全球型ETF完成股債配置，如VT+BND，投資範圍簡單敘述如下：


    +   ①VT：全球型股票市場，全名為先鋒全世界股市指數ETF（Vanguard Total World Stock ETF），追蹤指數是富時全球市場指數（FTSE
    Global All Cap Index），約可獲得全球股市的平均報酬。


    +   ②BND：全球型債券市場，全名為先鋒總體市場債券ETF（Vanguard Total Bond Market ETF），追蹤指數是巴克萊美國整體債券市場浮動調整指數（Barclays
    U.S. Aggregate Float Adjusted Index），這個指數的投資標的主要包括美國公債、投資等級公司債、美元計價國際債券等。


