- pgno: 231
  md: '因此，我們可以從產業著手，例如挑選民生消費產業、電信、公用事業等變動較為緩慢的藍籌企業；或許可依照產業特性與把握度，自行斟酌將自動DRIP與手動DRIP混合使用。


    綜合以上所述，DRIP的目的是要善用被動產生的收入，也就是由投資組合自動產生的現金流，不需再挹注新資金便能持續運轉，享受著股息成長與股數成長的加乘效果。'
