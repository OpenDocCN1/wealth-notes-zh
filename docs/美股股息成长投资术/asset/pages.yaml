    # # F.A.S.T. Graphs〉 圖表化呈現企業價值評估


    本篇要介紹的網站是「F.A.S.T. Graphs」（www.fastgraphs.com），它有兩大功能：一是「FAST Graphs」的價值評估圖表、二是「FUN
    Graphs」的財務數據圖表。前者是我用這個網站的主因，它是用「相對比較法」與「EPS成長率預估法」來評估企業的合理價格，可以作為使用者在評估企業價格時的輔助；後者是將使用者選擇的財務指標，呈現在同一張圖表上，以方便比較。因為網站的資料是以圖表呈現，所以我會用它來檢視觀察名單或投資組合中的個股，其當前價格與預估EPS成長率的落差。


    # ## 功能1〉FAST Graphs價值評估圖表


    此項圖表功能提供了2種類型的價值評估方式：


    # ### 類型1〉相對比較法：評估企業合理股價


    使用者可以選擇的評價基礎分為3大類：EPS（每股盈餘）、Cash'
  merge: -1
  img_proc: true
- pgno: 393
  md: 'Flow（現金流），以及Intrnsic Value（內涵價值）。而內涵價值中的「EBITDA」（扣除利息、稅項、折舊和攤銷前的盈餘）與「EBIT」（扣除利息、稅項前的盈餘）都不是實際獲利數字，因此，如果要以此種評價基礎，必須非常清楚這樣的盈餘數字會不會讓估價結果有美化之嫌。


    # 1. Earnings Correlations（以EPS相關數據評價）


    這個部分又也能選不同形式的EPS觀察，其中，「Adjusted（Operating）Earning」（以下簡稱為「調整EPS」），也就是所謂的「Non-GAAP
    EPS」，是我最常用的選項，因為它排除了一次性與不連續性的會計準則項目。用它來呈現本益比，可以比較忠實反映企業的價值位階。


    其實，直接使用GAAP（一般公認會計原則）的EPS當然也可以，只要使用者清楚兩類EPS的差別即可。「Basic Earnings」（基本EPS）只包含在外流通的普通股。為了謹慎起見，較常使用的是「Diluted
    Earnings」（稀釋EPS），因為它包含了可轉債與給員工的期權，都隱含可能變為股票的項目。總之，Earnings Correlations的評價方式適合大多數的企業。


    # 2. Cash Flow Correlations（以現金流相關數據評價）


    現金流較不易受到會計科目的影響，能夠如實反映企業的業務收入，因此，有部分產業更適合用現金流來評估價值，例如：REITs（主要投資不動產）、MLP（主要投資能源業）。這兩種產業必須配發90%以上的獲利給股東，因此，現金流的成長性與穩定性更為重要，也正因为如此，使用'
  merge: -1
  img_proc: true
- pgno: 394
  md: '者評價這類產業時，用的不是本益比，而是價格相對於現金流的倍數，比方說選項中的「Operating Cash Flow」（營業現金流）與「Free Cash
    Flow」（自由現金流）。因為REITs和MLP都是投資於資本密集的產業，經常需要增資來發行新股，導致在外流通的股數不斷成長，同時也稀釋了EPS，所以不適合用EPS來評價。


    我們以W.W.Grainger（固安捷公司，美股代號GWW）為例，我選擇的是⓪「Adjusted（Operating）Earnings」（調整EPS），右側圖表就會顯示以調整EPS所計算出的本益比變化。橘線的預設值為美國市場長期平均本益比（15倍），因此，圖中的③「橘線」，就代表GWW當年度調整EPS乘以15倍後的股價位置。


    ![](img/dfd1504d95bd8956cc82c7d5cbadb262_394_0.png)'
  merge: -1
  img_proc: true
- pgno: 395
  md: '不過，假如企業的成長率超過15%時，橘線的倍數會換成與成長率相同的數字（例如：當EPS預估成長率達20%，橘線的倍數就會改用20倍）。它的概念就是，股價應該與EPS的成長率有高度相關。理論上是沒有錯，但是，有時股價會偏離成長率。而15倍是市場長期的平均值，也是一個合理的係數，可以將它視為評價企業時的大框架。


    不過，每家企業的長期本益比不一定貼近15倍，因此，我們可以再觀察圖中的③「藍線」，這是以該企業的歷史平均本益比所計算出的股價位置，也可以稱為Normalize
    PE。圖中所顯示，GWW的15年平均本益比為④「19.2倍」，而且藍線與橘線之間始終維持一定的距離，表示市場給予這家企業的本益比，大致高於市場的整體平均值。


    綜合觀察，GWW目前股價位置（圖中的⑤「黑線」）的本益比是14.6倍，略低於市場的平均值15倍，同時也低於藍線，也就是企業15年歷史平均值19.2倍，因此，投資人可以知道，該企業目前的股價略低於合理價。


    # 類型2》EPS成長率預估法：推測企業未來股價報酬


    以上是根據歷史資料取得股價相對位置的大致概念，但是，投資人更在意的是未來，此時就可以運用預估法來推測。而FAST Graphs提供的圖表，是假設以目前的價格買進，而且EPS按照預估成長率向上增長，使用者就可以查看未來3年或5年內，當股價落在不同的本益比時，年化報酬率大'
  merge: -1
