    # 把握3原則

    避免賺股息、賠價差


    關於股息，投資人常有一個疑問：「會不會賺了股息、卻賠了價差呢？」我認為這個問題應該改成：「如果我只看殖利率，而非企業競爭力時，會不會賺了股息、卻賠了價差呢？」


    答案是：很可能會。但請注意，我將問題的重點，放在「如果我只看殖利率」之上。


    的確，許多投資人面對收益型商品（包含股票、高收益債、公司債或特別股）時，都容易陷入殖利率陷阱。殖利率只是一個結果，是一家企業獲利之餘，撥發部分盈餘嘉惠股東，剩餘資金則投注在能為企業產生最大效益的項目。


    因此，如果希望股息是在健康的企業財務體質下配發，且不希望一年有、一年沒有，或者一下配多、一下減少，那麼企業的本質，或者該說是'
  merge: -1
  img_proc: true
- pgno: 245
  md: '競爭優勢，必須能夠維持一段時間。


    要達到這一點，則必須謹記這一點：殖利率只是選擇高品質企業後，連帶的「結果」，而非起因。


    # 原則1】專注尋找股息連續成長的高品質企業


    而股息連續成長數十年的企業，就是找尋高品質企業很好的開始。但是許多投資人往往只被眼前的殖利率所吸引，但其實對於企業的本質並不夠了解。


    事實上，擁有股票等於持有企業的一小部分，且透過股票投資一家企業、成為其股東，無論是持有1股，還是擁有35%股權，沒有太大不同，差別只在於控制權的多寡。


    「股息成長投資（DGI）=高品質企業+長期價值投資+股息持續成長+企業未來獲利成長」，以上關於DGI的定義，已經解決單純受到殖利率誘因而買進股票，但對企業本質其實不了解的弱點。


    我並不想刻意與價值投資扯上關係，只是DGI自然地會以這種形式運行。想像一下，你想建構永續流淌的現金流，自然而然地就會以企業本質為基石，既考慮當前，也考慮未來。一旦目標是著眼涓涓不息的現金流，'
  merge: -1
  img_proc: true
- pgno: 246
  md: '那麼時間維度也會轉變為長期。


    # 原則2》企業品質再高，仍不宜以高估價格買進


    投資並非「買高、賣更高」的價差遊戲，會在意合理的購買價格，是因為高度溢價的價格會顯著影響長期報酬。而高度溢價的價格，猶如在樂觀繁榮時期的誘惑，讓人很難不沾惹那些在當世代被吹捧為最偉大與最吸引人的傳奇，如「FANNGs」（Facebook（臉書）、Amazon（亞馬遜）、Netflix、NVIDIA（輝達）、Google）。


    當市場處在牛市時期，這小部分的個股簇擁著牛市前進，投資人容易變得輕忽風險，過分將眼前所見投射到未來。回溯歷史，每個世代都曾出現這類企業，代表著當下最偉大的商業模式與最棒的競爭優勢，而被誤認為這就是未來的模樣。例如美股1960年代的「漂亮50」（Nifty
    Fifty，當時受追捧的50檔成長股）與1990年代的科技股，哪個不是新奇產業，且都建構在健康的財務基本面上呢？


    或許當中不乏偉大的企業，然而環境常往非預期的方向改變，高利潤會吸引高度競爭，加上公認的「好」公司，價格往往會被高估；一旦發現企業其實沒想像得好，最終價格都會回歸正常水平。


    我並非要指出動能投資或者成長投資有什麼問題，而是指出當這類股票'
