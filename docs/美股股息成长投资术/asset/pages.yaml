  md: "# 了解各種內外在因素  找出你覺得有樂趣的投資方式\n\n> 如果在錯誤的道路上，就算你奔跑也沒用！  \n～華倫．巴菲特（Warren Buffett）\n\
    \n偶爾會有人找我幫他們的投資新書寫序，我通常都是婉拒，但上星期追日Gucci用臉書（Facebook）發私訊，請我幫他的新書寫序，我原本有點猶豫，但在看過他一些自我介紹的資料及新書部分內容後，我毅然決定要幫他寫這本新書序言。\n\
    \n為什麼呢？因為我看了書的內容後，發現這本書跟其他的投資書籍不一樣，追日Gucci光解釋投資心理方面，以及為何他會選擇股息成長投資（DGI）的理由就占了許多篇幅。\n\
    \n書中並詳細比較了主動式投資與被動式投資的差異性，而且他也不斷強調，他不認為世上有一體適用於所有人的投資策略，因此鼓勵大家依照"
