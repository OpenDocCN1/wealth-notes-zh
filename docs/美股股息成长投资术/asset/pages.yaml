  md: '型，像是剷減低毛利的商品，導致營收與EPS降低，其後卻逐步提高營業利率與毛利率，這就代表轉型對公司是有利的。因為與其空有高營收卻獲利不振，倒不如讓企業變得更為輕盈，將生產重心放在高利潤比率商品，投資人都可以從每季的財報數據確認改善狀況。


