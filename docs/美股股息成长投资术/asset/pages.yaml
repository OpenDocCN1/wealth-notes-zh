  md: '到了8月1日時，現股價格跌至54.34美元，相較初始合約56美元低了3%左右。此時你的盤算是轉倉到2個月後的合約52美元，因為在52美元接到股票，相較於56美元差了4美元。而此範例在轉倉過程中的權利金變化為減少1.1美元，帳戶內的淨收權利金變為負數0.15美元（0.95美元-1.75美元+0.65美元）。對應轉倉至52美元的盤算，4美元價差，仍有3.85美元（4美元-0.15美元）的可能獲利（詳见表1）。


