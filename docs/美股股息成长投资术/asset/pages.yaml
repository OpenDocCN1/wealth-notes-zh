  md: '已能再自行探索，延伸出其他的小框架。建議在分析企業時，必須試著找出至少1～2項護城河。我只是提出我的看法，看法雖有萬千種，但重在思考過程，需要不斷修正，慢慢提升決策品質。


    有些企業的優勢不是那麼顯而易見，然而假如是高品質企業，你一定可以從中挖掘出明顯的護城河，無論是從過去與當下得到啟發，或者依據未來趨勢、人口結構、消費習慣等線索得到指引。


