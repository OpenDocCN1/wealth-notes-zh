  md: '業，因此應該把「股息成長率」也考慮進來。假設股息每年成長，DDM股息折現公式為（$V_0$為目前合理股價（現值）、$D_0$為初始配售、$D_n$為第n年後的股息、g為股息成長率、k為折現率）：


    ```

    $$ \begin{align*} & D_n = D_{n-1}(1+g)^n \\ & V_0 = \frac{D_0(1+g)}{1+k} + \frac{D_0(1+g)^2}{(1+k)^2}
    + \frac{D_0(1+g)^3}{(1+k)^3} + \cdots \\ & \quad = \frac{D_0(1+g)}{k-g} = \frac{D_1}{k-g}
    \end{align*} $$

    ```


    一樣使用前文的例子，差別只在於多了「股息成長率」。假設目前的初始配息是1元，往後股息每年成長7%，預期報酬率10%，那麼推算目前合理股價時，同樣把未來每年股息的現值相加起來。


    1年後の1元股息現値 $= 1 \times (1+0.07)/(1+10\%) = 1.07/1.1 = 0.973$


    2年後の1元股息現値 $= 1 \times (1+0.07)^2/(1+10\%)^2 = 1.1449/1.21 = 0.946$


    3年後の1元股息現値 $= 1 \times (1+0.07)^3/(1+10\%)^3 = 1.225/1.33 = 0.92$


    …'
