  md: '# ## 前言


    # # 主動態投資非易事


    5年前，當我在獨大（獨孤求敗，部落格「選擇搖搖錢樹」版主）那邊開始我的正規學習投資之路後，我的投資方式漸漸改變，也修正掉許多錯誤的習慣，更重要的是克服了所有投資方式都必須面對的敵人——不理性的自己，慢慢地也對自己的長期財務目標有了清晰的輪廓。


    還記得在一開始的2年，我每天都像唐三藏一般，不斷地在同事與朋友的耳邊嘮叨：「你應該提早為退休問題做準備，早10年投資，可以省掉30年的光陰與省下大量的資金投入」、「你應該多存點錢、拉高儲蓄率，分辨需要與想要，即使是穩定的報酬3%～4%，都好過消資膨脹行為」等。


    很遺憾的，大概是我口條太差，成功度化的人寥寥可數，大概就1～2位。實際上，我的朋友圈的收入，大多已是受薪階級的前5%～10%，曾對理財展示出興趣的幾個朋友，往往幾經思考之後，就因為各種困難，甚至我認爲他們是特意搬出許多困難，來避免改變或嘗試新事物。這讓我想起馬雲（中國阿里巴巴集團創辦人）的一席話：「晚上想想千條路，早上起'
  merge: -1
  img_proc: true
- pgno: 21
  md: '來走原路。」


    的確，我發現，好奇心與行動力，是我幸運擁有的幾樣特質；我認為很多時候特質來自於上天的恩賜，不一定會隨著年齡增長而擁有。


    說個親身經驗：幾年前，一位大學同學帶著老婆來找我尋求投資建議，我做了20～30頁的簡報，向他們介紹被動式的ETF（指數股票型基金）資產配置。這已是我認為波動相對較小，且能夠穩健取得市場平均報酬最好的方式。事後，他告訴我，他老婆覺得這個風險太大。


    對！你沒看錯，他老婆說ETF資產配置，風險太大！我著實身心得挫……


    # 對年輕投資人而言，長期風險比短期波動更值得憂心


    的確，跟ETF相比，也許債券或收益型商品表面上看起來比較穩定，然而除非買的是公債，波動才會小一點，也比較沒有違約風險。


    只是，投資不就是為了長遠生活做預備嗎？在年輕時期，過分地規避短期風險或波動，傷害的是長期的資產報酬，讓資產成長速度過慢，反而危害老年生活。


    因此，長期風險遠比短期波動更值得憂心，而且一旦晚年面臨長期風'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 前言


    險，早已喪失年輕時最大的本錢——時間。


    再回頭看看我那位大學同學的朋友圈與同事圈，長期以來，都是收入既高又穩定的階層，因此他認為舒服的日子能夠一直這樣過下去；且隨著收入提高，他也選擇大幅提高支出。


    假如認為有錢就等於很會花錢，或是花很多錢，來滿足他人對於富人應有的期待形象，這是個人的選擇，也沒有什麼不對。沒有人能干涉他人消費的方式，我也對此不感興趣。誰說一定要提早投資？一定要讓複利雪球效應發酵？一定要會量入為出、聰明花錢，分辨需要與想要呢？


    我慢慢學習同理心，站在他們的立場去理解他們的想法；我發現，每個人當下其實都在做其認為「最符合利益的事」，因此我現在的想法就是「無為」，不再想方法地催促朋友們積極理財。雖然現在只要談到理財話題，我仍是不厭其煩地搬出同一套說法：「高薪與高儲蓄率才是比投資方法更重要的東西！即使是高薪，也要小心避免消費隨著收入擴張。」因為高薪不等於很會理財，有錢人也不等於很會花錢，更不需要讓自己必須表現得「符合社會期待」。


    同樣的，這樣無為的想法也延伸到我對於本書的中心思想。我不吹報報酬，也不為股息成長投資（DGI）擦脂抹粉，而是以中立的觀點，闡述我的投資方式。假如可以，我主觀的認為，95%的人應該考慮被動式ETF資'
  merge: -1
  img_proc: true
- pgno: 23
  md: '產配置；因為主動式投資，除了要具備與群眾不同的思考能力，正確判斷的機率還要比錯誤判斷的機率高一些。當你判斷正確，卻與他人看法不同時，仍要堅持看法，這更是難上加難。


    過去大量接觸人羣的經驗，讓我發現，儘管我有充足的熱情且毫不保留的傳授，但是效果微乎其微。我花了好一段時間，才放下這個「理想」念頭。其實，不是每個人都擅長於某個領域，又或者说，其實只是「不適合」。試想，你所知的領域翹楚，或者自己身邊卓越的朋友，比例是不是很小？


    套用到投資領域，同樣如此。在我長年接觸人羣的樣本下，僅有1%～2%的人可以真正認同我的想法，然後發展出適合自己的方式。除了外在條件，如外語能力、資本大小、收入狀況之外，更多時候，影響成果的是特質。很殘酷的是，特質這種無形資產，通常來自於上天的恩賜，難以靠鍛鍊而獲得。


    我引述暢銷書《成功者的8個特質》作者理查·聖約翰（Richard St. John）所歸納出的8個成功者特質：熱情、工作、精通、專注、衝勁、服務、點子、堅持。別说要同時具備8個特質，光是其中1項都十分不容易！


    我希望本書能達到一個目標——識別出自己適合什麼投資方式？以及什麼投資方式超出了自己的能力圈？'
