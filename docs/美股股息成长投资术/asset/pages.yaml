  md: '但無論選擇哪一種投資方法，都會面臨不同程度與形式的心態考驗；假如對於信仰不夠堅貞，或者根本選擇了不合心意的信仰，那就猶如穿著一雙不合腳的鞋，無法陪你走到投資旅程的終點。


