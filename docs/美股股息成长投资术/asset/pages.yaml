    # 重點3》配發股息企業波動較低、夏普值較高


    很多人喜歡比較不同投資工具的報酬率，也喜歡比較自己與他人的報酬率；但是在評量整體報酬時，往往會忽略重要的「風險」。因此除了看報酬，也必須一併觀察風險相關指標，包括波動程度（年化標準差）與獲利風險比。


    從表4可以看到，截至2017年10月31日，近10年S&P 500股息貴族指數的年化標準差為14.06%，略低於S&P 500指數的15.15%，顯示S&P
    500股息貴族指數的波動程度比較小。


    # 不配發股息企業報酬率較低，且波動程度相對較高


    再看到獲利風險比，這項指標又稱為「夏普值（Sharpe Ratio）」或「風險調整係數」，也就是每冒一分風險，能夠得到多少回報。S&P 500股息貴族指數的獲利風險比為0.77，較S&P
    500指數的0.5高出54%，可見S&P 500股息貴族指數不僅波動更低，且每承擔一分風險可獲得的回報也高出許多。


