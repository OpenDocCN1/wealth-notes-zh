  md: '# 親手撰寫企業分析報告

    增加解讀深度與廣度


    第4篇將統整第3篇提及的大部分概念，實際執行一輪質化分析、量化分析，以及到目前為止尚未提到的價值評估。


    分析與思考是沒有止境的過程，每當看到他人對於產業分析透徹，對於未來獲利的預估之嚴謹，都讓我感到折服；這也是為什麼我提到必須不斷閱讀，因為透過他人的研究，往往會不經意地獲得大量啟發。


    我從2015年開始撰寫企業分析文章，便是要求自己要與知識不斷互動。透過吸收與理解再轉述成文字，這是與「閱讀」完全不同的概念，如此才能真正將知識與腦部產生連結。


    假如只有觀察與閱讀，卻沒有實踐，會達不到你想要的效果。撰寫企業分析文章時，須從質化分析開始，再進入量化分析，我認為至少應包含以下3大面向：'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# 面向1》質化分析


    # 1.企業總覽


    主要是對企業的基本認識，包含總部位置、發展歷史、企業規模、主要商品與服務，同時也涵蓋各主要事業群占整體營收比重與獲利狀況。


    其次也要了解銷售地域的獲利占比，這點很重要，因為當事業群與地域有適度分散時，整體表現較不易受到單一商品或區域影響。


    完成企業總覽之後，你也會確立對該企業的第一印象，在此階段，其實已能大致識別出這家企業是否在你的能力圈範圍之內？是否符合你的投資風格？


    # 2.商業模式分析


    商業模式分析也可能會發現促使你投資該企業的理由，主要有2類：第1類是你看到的競爭優勢，第2類是該企業符合外在環境或者趨勢。


    比方說，中產階級人數竄升，將帶動城鎮化與都市建築。假如你研究的企業是智能建築、電梯、空調與安全控制的企業，那麼便能夠以此趨勢作為發展平台。


    又或者如物聯網（Internet of Things，IOT）革命，既然大數據、雲端運'
  merge: -1
  img_proc: true
- pgno: 254
  md: '算已是進行式，而接續的工業4.0與物聯網也箭在弦上，那麼勢必不能缺少網路設備，包含網路集線器（Hub）、無線網路設備、資料中心與安全防護等。如此，這類企業便could與當前趨勢有著緊密的发展關係。


