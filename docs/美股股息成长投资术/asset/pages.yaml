  md: '試想，今天採購一套資訊系統，假如該供應商能夠同時提供依附在此系統下的其他應用，或許整個配套採購下來會比單獨找不同供應商購買的價格還高，但對業主而言，系統之間的相容性與穩定性更為重要，加上單一供應商就能處理維護與諮詢服務，且對方在該領域的專業資源也很充分；這時價格不會是最重要的考量，系統整合才是決策關鍵。


