  md: '資有3大理由：


    # 理由1】被動式投資不見得能滿足個人需求


    目前「被動式投資」是指被動追蹤指數的工具，例如指數型基金或ETF，是透過完全複製、採樣複製或由基金發行公司的智慧複製等技術，以追蹤特定市場指數表現的商品。


    如道富標準普爾500指數（SPDR S&P 500 ETF，SPY），是追蹤S&P 500（標準普爾500）指數；先鋒基金公司發行的先鋒美國整體股市ETF（Vanguard
    Total Stock Market ETF，VTI）則是追蹤CRSP美國市場指數（CRSP US Total Market Index，詳見註1）。


    至於主動式投資方式，尤以主動式基金飽受抨擊，數年來，許多研究紛紛提出90%的主動式基金無法擊敗大盤。


    爭論主動式或被動式投資孰優孰劣毫無意義，我想我們更應該思考，把「非ETF投資」定義為主動式投資，真的沒有問題嗎？難道只要是個別投資人自行選股、自行搭配不同資產，或者有分析團隊進行選擇，就稱之為主


    註1：CRSP 全名為 Center for Research in Security Prices，屬於美國芝加哥大學的證券價格研究中心，為研究股價、提供股票資料庫、編製指數的專業機構。'
