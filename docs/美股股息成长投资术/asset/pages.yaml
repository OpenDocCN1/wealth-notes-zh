- pgno: 376
  md: '# 運用5大工作表，強化投資管理效率


    雲端試算表預設工作表頁面為「Start Here」，提醒使用者必須先登入 Google帳號，並於①「檔案」功能表→②「建立副本」，才能建立一份相 同格式的試算表副本，並且儲存到自己的雲端空間以進行後續的編輯。


    ![](img/dfd1504d95bd8956cc82c7d5cbadb262_376_0.png)


    以下僅介紹5張主要工作表的功能：「Portfolio」（投資組 合）、「Summary」（摘要）、「DivCalendar」（股息月曆）、 「DivPayoutCalc」（股息計算）、「Transactions」（交易紀錄）。


    # 工作表1）Portfolio（投資組合）


    切換到①「Portfolio」工作表，其顯示使用者的投資組合總覽資料，初始 顯示的是預設的範本，使用者須在②橘色儲存格內填入你自己購買的美股 名單，包含「Company
    Name」（公司名稱）及「Symbol」（代號）、 所屬GICS（全球行業分類標準）產業類別。③綠色儲存格的部分則是已經'
  merge: -1
  img_proc: true
- pgno: 377
  md: '# 美股股息成長投資術


    設定好公式的內容，不需要修改。之後當你在「Transactions」工作表填入買賣紀錄後，就會同步記錄到「Portfolio」工作表當中。


    投資組合總覽的欄位包含相當多資訊，包括Shares（持有股數）、Market Value（當前市值）、Market Weight（個股占投資組合比重）、Cost
    Basis（成本）、Unrealized Gain/Loss（未實現損益）、Realized Gain/Loss（已實現損益）、年化報酬率（XIRR）、Annual
    Dividend（年度股息）、Dividend Yield（殖利率）、YOC（成本殖利率）等。只要你願意動她的輸入買進、賣出、股息等交易紀錄，這張試算表便能清楚計算出你的投資組合內容。


    另外，如果想要一併記錄你目前還有多少欲投資的現金部位，可在「Cash」旁的儲存格填入金額。


    ![](img/dfd1504d95bd8956cc82c7d5cbadb262_377_0.png)'
  merge: -1
  img_proc: true
