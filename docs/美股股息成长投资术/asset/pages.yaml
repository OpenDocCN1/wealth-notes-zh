  md: '# 活用股息折價模型

    算出股票合理價


    價值評估（Valuation）是質化分析與量化分析都做完了，絕對不可或缺的一環。本章將介紹如何運用股息折價模型（DDM）來評估企業合理價。


    DDM是現金流折價模型（DCF）的延伸版，何謂DCF？簡單來說，一家企業的內在價值，約等於該企業長時間獲利的總和。適合使用DCF估價的企業，主要是不常配發股息，或股息經常不連續成長的企業；若是股息連續成長的企業，則較適合用DDM來估價，也就是預估企業未來所能配發的股息，並回推未來股息在目前值多少錢，進而估算該企業目前的合理價。


    # 加總未來每年股息現值，即為企業合理價


    為什麼要回推未來股息在目前值多少錢？因為錢是有時間價值的，今天保留1元，放到1年後才使用，這1元在1年的時間裡，可能產生1%、5%或10%的報酬，因此今天的1元，會比5年後或10年後的1元更值錢。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '如果1年可產生10%的報酬率，1年後\(\$ 1\$\)元，在目前的價值（以下稱現值）就必須以10%回推，也就是約\(0.909\)元（\(1/(1+10\%)\)），這10%就稱為折扣率、折價率，或是預期報酬率。現值的計算公式為（\(D_n\)為每年股息、\(k\)為折扣率）：


    ```

    \[

    \begin{gathered}

    n年後股息的現值 = \frac{D_n}{(1 + k)^n}

    \end{gathered}

    \]

    ```


    如果是10年後的1元，以每年10%的折扣率回推，價值就只等於現在的0.386元（詳见表1）；換句話說，現在的0.386元，以每年10%的複利推算（亦即有10%的年報酬率），10年之後約有1元的價值。


    DDM就是用這種時間價值的概念，將未來每一年能從企業拿到的股息，以預期報酬率回推至現值，再將每一年的現值加總，就可以算出企業現在的合理股價。


    假設每年股息相同，DDM股息折現公式為（\(V_0\)為目前合理股價（現值）、\(D_n\)為第n年後的股息、k為折扣率）：


    ```

    \[

    \begin{gathered}

    V_0 = \frac{D_1}{1 + k} + \frac{D_2}{(1 + k)^2} + \frac{D_3}{(1 + k)^3} + \cdots
    + \frac{D_n}{(1 + k)^n}

    \end{gathered}

    \]

    ```


    我們來試算，假設A企業每年都固定配發股息1元，那麼未來每一年的1元，現值分別如下：'
