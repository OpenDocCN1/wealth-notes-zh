    # 股息再投入，讓雪球以加倍速度滾動


    讓我們再回到1萬7,200美元這個數字上，為了主動取得這樣的年收入，必須夙夜匪懈，在昏暗街燈下返家，在疲憢中睡去；但別忘了每年還需要支付稅負、生活必需支出等費用。不僅收入要高於這個數字，還必須相當有紀律地儲蓄與財務規畫才能取得。


    相較之下，透過DG]產生現金流，美妙之處在於不需要額外付出新的資本，就能在下一次的股息成長中，得到更多的現金流。


    要是還不滿足，那麼可以透過「股息再投入」來增加雪球成長的速度。假設我將上一年度獲得的股息1萬美元全部再投入，以殖利率3.5%計算，今年度結束後，將能再多取得350美元的股息。將350美元加上原本增加的股息600美元，總計是950美元，因此，今年度結束後，我的股息現金流會從1萬元成長至1萬950美元。


    同樣的思考，如果是一開始投入全新資本的投資人，需要約2萬7,200美元（約折合新台幣81萬6,000元），1年後才可取得約950美元的股息。可見，時間愈長、累積可獲得的股息愈多，股息成長所帶來的複利優勢愈'
