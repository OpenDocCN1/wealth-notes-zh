  md: '間。因為不可能在一段短時間內，所有想納入組合的企業都剛好處於或低於合理價，假如又遇上明顯的牛市時期，則要花上更長的時間。因此，一定是每個月慢慢買，並保留加碼空間。買進過程倒也不需要心急，與其付出過高成本，冒了更大風險，影響長期報酬，不如耐心等待，細心評估合理價格。


    自行組成投資組合的好處之一，便是可以自行選擇在企業價格被低估時購入。儘管整體市場指數高漲，仍可能有少數好公司會落入合理價之下，此時，評分系統便派上用場，你可以事前擬定計畫。以下分別以30歲年輕人與退休族為例：


    # 範例1》30歲年輕人，初始投入5萬美元、每年新投入1萬美元


