  md: '至於第4點，須評估公司有何競爭優勢。我使用的是帕特·多爾西（Pat Dorsey）所著《尋找投資護城河》一書中的分類，包括無形資產、轉換成本、網路效應、成本優勢、規模優勢等。我每次在做企業質化分析時，一定要從中找出至少1項優勢（詳見3-2）。


    找出優勢這件事，既需要理性的科學，也需要感性的藝術，更並非單純仰賴人性直覺而輕易推演至未來。這部分，除了深入研究之後產生的信任感與掌握度，還必須仰賴生活體驗做出一些想像；也就是以目前認知的資訊為基礎，往未來推演，推測當前的企業優勢能否再持續下一個10年。確定競爭優勢之後，才能進入第5點——將企業遇到的目前困境，定義為短暫或永久。


    評估企業優勢和判斷企業困境這2個重點，正呼應本書第1篇談到的「第2層思考力」（詳見1-4），投資不是輕易相信其他人傳輸給你的訊息，更多時候，若這類陳述與我們的既有看法特別吻合，反而更加需要警惕。


    有網友曾問我，美國連鎖零售商Target應該會被網購巨擘亞馬遜（Amazon）打趴吧？這個問題，便是典型的「相信直覺」；然而直覺在投資當中，完全不是一項有利的人類基因。


    我覺得更好的思考方式是，亞馬遜可能對零售業造成威脅，但是有些零售業是否能挾帶原有的優勢再進化？假如是，那麼目前價格與價值之間，'
