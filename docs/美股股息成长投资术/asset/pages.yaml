    # 掌握3大元素 搿懂DGI致勝策略


    第1篇談了許多我對投資的理解，也是我認為投資之中最重要的概念；至於方法，反而是其次才要關注的。我目前所采用的是「股息成長投資（DGI）」策略，DGI是Dividend
    Growth Investing（或Investor）的縮寫，在美國是一種普遍的投資方式。


    簡單的说，DGI就是由「價值投資＋股息成長」的企業，提供持續而穩定的現金流，並收割長期投資之後的資本利得。逐項拆解DGI策略，主要有3個元素：價值投資、持續而穩健的現金流、長期資本利得。


    # 元素1》價值投資


    DGI與價值投資結上緣，原因有2：


    +   1. 股息連續成長的企業大多是成熟產業，既有歷經景氣循環的底蘊，又'
  merge: -1
  img_proc: true
- pgno: 61
  md: '能保持獲利成長。


    2. 投資人追求的是穩健的現金流成長，投資期限一定是以長期（10年以上）作為規畫。


    既然希望投資組合的屬性為長期、持續、穩健的被動收入，那麼選擇企業時，勢必會考慮其當前價值，並以合理價之下或折扣價買進；如此一來，既提供錯誤容忍空間，也為長期報酬取得較佳立足點，投資人自然也不會去追求當前熱門股或成長股。


    # ### 元素2》持續而穩健的現金流


    許多投資人常常陷入高殖利率的陷阱，但過高的殖利率難以長期為繼，也可能陷入價值陷阱之中，因為企業的實質競爭力也許正在流失當中。


    因此，殖利率不是選擇標的主因或誘因，不該倒果為因，它只是你評估一家高品質企業之後的副產品。


    既然DGI的目的是持續而穩健的現金流，因此，了解想投資企業的競爭優勢、護城河、營運模式等質化分析至關重要。你不會希望一家企業除了股息不穩定之外，連競爭優勢都喪失了，也就是既失了股息，還面臨資本利損。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# ## 第 2 篇 認識股息成長 奠定成功基石


    # ### 元素3》長期資本利得


    股息能夠連續成長，通常也代表著企業的獲利增長，難有企業能長時間不斷配發成長股息，但企業獲利卻是「不」成長的。因此，只要企業仍運行良好，沒有發生質變，股價也沒有被極度高估，那麼
    DGI 不需要有實現資本利得的固定計畫（或依照獲利百分比來實現資本利得）。


    然而，仍有可能在很長一段時間（10年、20年）之後，因各種需要必須賣出持股；除了支應生活所需，也有可能是兒女結婚或幫兒女置產，或者各種大筆意外支出。但總歸來說，這類支出是長期一段時間後才會發生，不是短期會用到的；短期支出必須靠工作、保險與充足的緊急預備金來支付（若是屆齡退休者，仍可建構股息成長投資組合，只是須以成長率較低的高殖利率企業為主，相關介紹詳見
    2-8）。


    再者，股息成長背後的驅動力是企業獲利持續成長，當獲利成長時，即使本益比不變，合理預期價格也會隨之上漲，投資人可以同时收割長期資本利得。


    # ## 穩定創造現金流是股息成長投資的最大優勢


    現金是企業的命脈，年度每股稅後盈餘（EPS）小於 0，企業還是能夠生存下去，但很難在没有現金的情況下支撐太久。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '對個人也是一樣，只要收入大於支出，日子就能繼續過下去；但若沒有現金流入，即使持有的資產（如房子、土地、珠寶等）很多，如果不把這些資產變現，那麼擁有再多資產，也無法達成經濟獨立。


    反觀，假如持有的資產產生現金流的能力很強，能夠涓涓不息地提供現金，讓你足以支應生活所需，自然心理壓力就小，更容易幫助你挺過市場波動時期。因為你的收入並不仰賴於資產市價的變動，這就呼應了
    1-1 談到的 DGI 第 1 個特點「投資心情穩定」。


    假如需要仰賴價格變化才能提升資產總值，只要資產價格不動，就不會產生資本利得；而當資產價格下跌之際，若又需要現金支應生活時，投資人就必須被迫賣掉資產，此時資產總值減少的幅度也愈大，因為必須賣掉更多股數。


    反觀，現金流收入的投资方式，專注的是企業品質，並建構在「股數」的基礎之上，從持有股數和估計股息配發金額，即可預估每個月（或每年）的被動收入有多少。


    想要達到某個金額的月收入或年收入，能夠清楚計算需要準備多少資本；對於「需要準備多少退休金」這個問題，也不會覺得難以評估——你問 10 個人認為自己需要準備多少退休金，會得到
    10 個答案，而且多半是聽來的，或者是自己的想像金額，很少人會根據實際需求做出明確的預估及'
  merge: -1
  img_proc: true
- pgno: 64
  md: '規畫。


    此外，當挹注新的資金時，因為股數變多了，自然能夠立即獲得收入增加的反饋；因此，我能夠以生活所需的支出金額反推所需的資金總量，且不需要賣出資產，就能獲得被動現金流。


    DGI這樣的投資方式，以創造現金流為目的，擺脫了短線與價差思維，因此能夠讓投資人安定身心，把全部精力專注在工作表現中，這絕對比尋找迅速提升績效的投資方法還要重要得多。'
