    重要財務比率非看不可


    接下來，我將介紹一些自己常使用的網站與工具，包含免費、付費與自行開發3大類。礙於篇幅，這些網站我只會做大區塊的重點介紹，無法鉅細靡遺說明網站功能，還是需要你親自使用後，再慢慢去探索。而我與這些付費網站或功能，都沒有合作與對價關係，也不要詢問我網站相關事宜，因為這類付費功能都提供試用服務。


    # 近5年資訊可免費查詢


    我最常使用的資訊網站晨星（Morningstar），雖然內容大多是以文字與數據呈現，但資料很齊全，整理的方式也很簡潔。網站上大多數是免費資源，但以財報數據而言，只有近5年是免費。另外有1/4的資訊是付費的，包括10年財報資料、分析報告、合理價與護城河寬度等。


