- pgno: 214
  md: '例如，「非必需消費產業」之下，又分為「汽車與汽車零部件」、「耐用消費品與服裝」、「消費者服務」、「媒體」、「零售業」等行業群，其中的零售業又可分為「經銷商」、「網路與直接行銷零售業」、「多元化零售」、「專營零售」等4種行業；而「專營零售」可再分為「服裝零售」、「專賣店」等子行業（詳见表2）。


    假如你已經持有蓋璞（GAP，美股代號GPS），而GAP是屬於「服裝零售」子行業，所以當你想想增加非必需消費產業的配置時，就可以從其他子行業（如專賣店）或更上層的其他行業（如經銷商）、行業群（如消費者服務）尋找標的。


    又或者「能源」產業中的「石油、天然氣與消費用燃料」行業，分為「綜合性石油與天然氣企業」、「石油與天然氣探勘與生產」、「石油與天然氣煉製及營銷」、「石油與天然氣儲存及運輸」與「煤與消費用燃料」等子行業，當你已持有埃克森美孚石油（Exxon
    Mobil，美股代號XOM），因為它是屬於「綜合性石油與天然氣企業」子行業，那麼要尋覓能源業時，或許可以從其他子行業如運輸與儲藏、或煤與消費用燃料著手，因為它們雖然同屬能源業，但產業特性差異卻很大。


