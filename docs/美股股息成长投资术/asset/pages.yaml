- pgno: 336
  md: '先不計全球，有2歲～14歲子女的家庭，光是北美即有2,500萬戶（截至2016年底）；再參考臉書（Facebook）上，喜歡迪士尼與皮克斯動畫的受眾有6,500萬人，看起來迪士尼的自有串流服務想要達到365萬訂戶，似乎不是太難。


