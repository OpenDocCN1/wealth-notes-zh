  md: '# 投資股息成長企業

    成本殖利率將愈來愈高


    「成本殖利率」（Yield On Cost）簡稱「YOC」，也有另一個說法

    「YOI（Yield On Investment）」。不管是Cost或Investment，指的都是初

    次購買價格或平均成本，公式為「成本殖利率＝目前股息／初次購買價格

    （即平均成本）」。


    因為台股當中罕有長期股息維持年年成長的企業，因此也鮮少聽到這個

    名詞。在長期投資中，成本經常是固定的，或者說不常變動，因此股息連

    續成長的話，自然會讓YOC變得愈來愈高。也就是說，相對於一開始付出

    的資本，隨著股息連續成長，過了一段時間之後，從這筆資本所獲得的回

    收率，每年會逐步攀升。


    在此也導正一個觀念，計算成本殖利率時，分母的「初次購買價格（平

    均成本）」，只有在購買新股數且價格不同時才會變動。我曾看過有些人

    在談YOC相關概念時，會把平均成本不斷地減掉每年收到的股息，我想這'
  merge: -1
  img_proc: true
- pgno: 110
  md: '會讓YOC在檢視回報率時大幅失真。雖然收到股息之後，成本的確降低了，但仍不宜直接減去，成為新的成本；成本只有在平均成本變動時，才可以修改。


    打個比方，假設定存 100 萬元，第 1 年收息 1 萬元，年利率 1%。請問可以在第 2 年計算年利率時，用 99 萬元（100 萬元－利息 1 萬元）當作分母，然後說第
    2 年的年利率是「1 萬元／99 萬元 = 1.01%」嗎？顯然是不適當的。


    # YOC可呈現當初投入資本與目前股息的回報率


    YOC的概念很簡單，就是回頭檢視若干年前的一筆資本，一段長時間之後，以當前增長的股息，與成本相除之下的比率。


    我以5家股息皆已連續成長超過40年的企業來演示，經歷1990年～2015年連續25年股息成長，YOC的變化過程。因為分子逐年上升，5家企業的YOC都會達到很高的水準，並非我特別挑選，分別是寶僑（P&G，美股代號PG）、沃爾瑪（Wal-Mart
    Stores，美股代號WMT）、可口可樂（Coca-Cola，美股代號KO）、嬌生（Johnson & Johnson，美股代號JNJ）、麥當勞（McDonald''s
    Corporation，美股代號MCD）。


