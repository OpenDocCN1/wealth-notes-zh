- pgno: 281
  md: '事實上，你是有辦法預估的。例如，先調出過去2年生產量的數據、大致了解每年的報廢數量有多少、固定機台保養或維修時數會影響多少產能，然後考量每年約有多少非預期的系統或機台問題所導致的產能損失；接下來，你會考慮現階段是否有其他改善案件在進行，例如自動化搬運系統更新、搬運軌道調整等；再者，考量明年是否有重要系統更新，或者新世代製程轉換，對機台產能有多少影響等。請如此類，相信你心中還會萌生更多影響產能的可能因素。


    在工作與生活上出現的預估情況，相信你我都不陌生，然而預估並非要求精準，而是重在事前計畫，一旦有了計畫，才不會在毫無準備的情況下，去面對不確定的未來。


    # 方式3》參考其他專業機構的預估


    雖然我自有估價方式，但也會參考其他平台提供的資訊，來與自己的估價做比較，包含晨星、S&P Capital IQ與Value Line等。我與這些平台沒有任何對價關係，也沒有推薦之意，請讀者根據自身需要，再決定使用這些平台與否。


    以我使用多年的晨星為例，晨星使用的是DCF估價方式，我至今仍會參考其分析文章以及合理價格，原因有2：


    +   1.閱讀晨星多年，我認為晨星的文章質量不錯，一直對我有所幫助。有'
