  md: '實體股票。


    然而，市場就是有能力見縫插針，找到你的破口之處。當風平浪靜對你而言是常態之後，一段時間的美酒佳餚，已讓你漸失謹慎意識。過度放大的槓桿，在突發時期，一次吞噬之前的所有戰果。


    # ### 長短線策略雖可同時運行，但投資系統切勿混淆


    即使可以轉換為股票，然而張數過高，一來，若你並非透徹地研究過該企業而持有過高比重的股票，此時任何波動都會讓你承受不了，事前有計畫地持有股票與被迫持有股票，在心理與資產管理上是截然不同的概念；二來，轉換為股票的過程，可能因為張數過多導致爆倉，你會被要求補繳保證金（Margin
    Call）。


    我並非反對使用選擇權來交易價差，工具本身為中性，沒有好壞之分。因此，資產組合之中，並非只能存在一種方式，投資人可聰明地融合多樣性，以符合自身需要。


    數年前，與我的啟蒙師父獨大學習時，他便告訴我，長線與短線是可以完全同時存在運行的。當時的我覺得有些震撼，難道不會混淆與思緒打結嗎？漸漸地，我明白問題不在於帳戶有幾個分類、或是投資方式同時採用幾種，關鍵在於清楚而有紀律地執行不同獨立的資產類型，而不該讓各種'
