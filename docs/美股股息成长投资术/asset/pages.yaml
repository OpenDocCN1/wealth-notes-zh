    我主要的投資方式，是選擇股息成長的個別企業，然而我清楚知道，自己建構與管理投資組合，必須仰賴衆多外在條件與內在人特質才可達成。因此，只要有朋友尋求建議，我推薦的一律都是與指數化投資及長期投資相關的書籍，如：《漫步華爾街》、威廉・伯恩斯坦（William
    Bernstein）的《投資金律》與《智慧型資產配置》、綠角的《綠角教你前進美國券商》與關又上的《你沒學到的巴菲特：股神默默在做的事》等。


