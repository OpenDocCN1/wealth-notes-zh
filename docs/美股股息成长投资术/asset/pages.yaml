    # ## 功能2》FUN Graphs財務數據圖表


    這個功能類似於GuruFocus.com網站中互動式圖表（Interactive Chart）的功能，但是，有2個比較大的差異：


    +   1.FUN Graphs將數據區分為4種類型，分別是每股為單位的數據、比率類、百分比類、百萬金額類。這麼做的好處是，以同類型數據放在同張圖表上，比較容易做比較，而缺點是比較不具彈性，因為使用者可能會想拿EPS（每股為單位的數據）和ROE（百分比類）一起看，但是，FUN
    Graphs圖表就無法滿足這個需求。


    +   2. 每項數據會計算CAGR (Compound Annual Growth Rate，年複合成長率)，尤其在查看長期數據時，很有參考價值，這是Gurufocus.com網站所沒有的數據。


