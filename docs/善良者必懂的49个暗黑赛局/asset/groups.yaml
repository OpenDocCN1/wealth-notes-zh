    ## 08

    雙方都有立場時，你該怎麼做…


    常挑戰未來將成為自己議會同僚的人，而後歷經多次敗選。在那些被我挑戰的人當中，也有在政治界評價相當高的政治人物。當時我還天真地幻想：「他們都是優秀又傑出的人才，想必會寬容地對待我吧！我並沒有被他們討厭。」但其實完全不是如此。


    那些人並沒有卸下對我的仇恨。更令我訝異的是，在諸多前輩那，他們都這麼對我說：「那些政治人物也是人啊。不，正因為他們是政治人物，才無法容忍反抗自己的傢伙，就是這樣而已。」


    你最好清楚這一點：根本沒有人會認為「挑起爭端的人真了不起」，而能夠欣然接受對方。


    「爭執之後，而讓友情加溫」，只會在偶像劇或漫畫世界裡存在。如同文謅語「富人不好吵架」一般，成功者只會選擇「耗費時間、運用智慧及不戰而勝」的方式。不讓對方察覺被自己擺了一道，更要善用他的力量，將你自己想要的東西化為囊中之物；不與對方正面交鋒、避免激得滿身是血又招來怨恨，沉穩而確實地接近目標，才是上上之策。


