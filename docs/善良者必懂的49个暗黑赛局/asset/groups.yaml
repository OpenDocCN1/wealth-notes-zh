    ## 10 滿腔怒火時，把壓力最小化的紓解方式是......


    ### 管理怒氣第一招：探尋對方動機


    要是你心中充斥無法消散的怒火時，該如何是好呢？「管理怒氣」的方法因人而異，而我的做法是——先探尋對方動機。如前篇章所述，反射性的行動（也就是過快的反應）經常不是很妥當。首先，我會仔細思考一個問題：「為什麼對方會做出那樣的事來激怒自己？」在思考時，自己便能冷靜下來，只要明白對方動機，自然能找出合適的對策。

    一旦對方讓自己不愉快了，探尋其動機最為重要，這樣的思維訓練，在許多情況下都相當受用。簡單來說，看穿對方情緒，是讓人生精彩的最關鍵祕訣。用大腦

    之處引爆情緒炸彈。嘗試過許多次，這是讓壓力化為最小的憤怒處理方式。

