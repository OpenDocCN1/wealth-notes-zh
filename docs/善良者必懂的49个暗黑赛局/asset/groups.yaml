    讓對方說出「明白了」或做出「瞭解」的表情，你也無法控制其他人的情緒。就算只有「萬一」，萬一對方能夠理解你那麼0.01%，你就應該當做意外收穫。換句話說，你很可能有「0.9999」的機率會被對方仇視，再沒有比「多管閒事」更危險的行為了。


