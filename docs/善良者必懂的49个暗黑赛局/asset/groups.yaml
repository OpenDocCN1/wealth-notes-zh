    成為政治人物後，我便和許多稱為「日本最高智庫」的霞關夥伴一同工作。由於一直身在執政黨，因此有機會和中樞行政官員共同探討經濟和財政政策。他們製作的文書資料豐富完整，在政治上的造詣精深自不必多言，但我也窺見他們在藝術和文學領域中的驚人才華，實在太令人震撼了。在美國占有領導地位的頂尖智庫公司「蘭德研究所」（RAND）中，有二十九名諾貝爾得獎者，是日本全國獲獎人數的近兩倍之多；在和我同層樓工作的
    人中，也有好幾位諾貝爾獎得主。我曾經單手拿著漢堡或可樂，在咖啡廳裡和他們暢談他們的研究成果，或將成果投入國家政策進行的工作，深深覺得這些人都是貨真價實的頂尖人才。


    歷經經濟、財政工作的洗禮後，我以專責金融領域的政務官身分進入政府，以設立「日本版主權基金」為目標，促成議員聯盟，也讓自民黨的國家戰略本部成立了相關檢討機關。透過這層關係，我得以和許多國家基金會高層、舉世聞名的避險基金（Hedge
    Fund）及私募股權基金（Private Equity Fund）的持有者，有多次與會研議的機會。那些人士能夠操作以「兆」為單位的鉅款，擁有豐富情报資源和分析能力，更是非比尋常。我在進入東京大學為提升全校學生實力、作育下一世代領導者，而成立的「東大高階管理計畫」（The
    University of Tokyo Executive Management Program）後，更學習包含宇宙科學、醫療、經濟、哲學、宗教和藝術等最高層級的知識，打破不同領域的藩籬，一面感受知識的積累、一面相互討論，由此鍛鍊一身跨學科的議題設定能力。在哈佛大學、耶魯大學擔任研究員時，我更獲得許多和世界頂尖大學各領域專才接觸的機會。諾貝爾得獎者、普立茲新聞獲獎人，甚至許多國家元首或前任元首等，我是何等榮幸，能和他們交換意見。此外，我也受到國內外許多國際會議的邀請，從學者到經營者，親眼見到許多擁有偉大成就的人物，受到莫大刺激。


    ⑪「霞關」是日本東京都千代區的地名，許多日本中央部會與政府機關的辦公地點均分佈於此。⑫主權基金又稱「主權財富基金」（Sovereign wealth fund
    - 簡稱 SWF），是由一些主權國家政府所建立及擁有，用於長期投資的金融資產或基金，主要來源是國家財政盈餘、外匯儲備及出口盈餘。


    ## 第三章 兵不厭詐，用「人性心理」讓對手為你抬轎！


    ### 人愈聰明，愈無法理解他人心情


    透過這些經驗，我能夠自信斷言：世界上聰明的人多得數不清。雖然聰明有其價值，但並非絕對的價值。真正的睿智與出類拔萃的人生最高價值，並非單純的思維能力，也不限於記憶力和發想力。想要成就大事，無論你是經營者、學者、政治人物、行政官員，都必須具備「看穿對手的能力」。擁有這項能力的人，就是最有智慧的人；只要擁有它，你的人生便將如虎添翼。


    這個世界上，充滿許多少趣的點子與想法，重要的是如何將它們付諸實行，給予世人衝擊。然而，無論再怎麼聰明，一個人終究成就不了大事。沒有走入人群、認真地鼓勵他們、思考規畫、甚至加以實行，那些點子和想法也終究只會淪為空想。為了將它們付諸實現，我們需要的是「理解對方心情的能力」，這正是聰明人最缺之的。說得更貼切一些：越是聰明的人，越沒有這項能力。仔細想想確實如此。聰明的人有自信、非常自戀，光靠自己的發想就敢魯莽行事，所以才會被稱為天才。但是，為了往前邁進、實現天才一般的理想，就得將自己的情緒擱置一旁，理解對方的心情。為了影響對手，你一定要知道對手的心情，所謂「知道」就是「清楚、瞭解」的意思。雖然我已經提出許多關於「面對自我」的論點，但在這裡我們必須換個角度思考，因為人生就是這樣，看似簡單、卻複雜得要命。想要實現本書的目標，看穿對手心情的能力最是不可或缺。為了不激怒他人、不與其對戰，更向對方借力使力、進而擊倒對方，你就一定要有理解對方心情的能力。我見過許多菁英分子，因為不瞭解他人情緒、無法善用自身能力而受到挫折，中途就消失不見了。就算擁有再敏銳的分析力，如果你想要給世人留下印象，就必須先理解有力人士的心情、融入其中，再進一步影響他們。無論何時，和人際關係相關的行動，都是從考慮對方情緒開始，只要這麼做，


