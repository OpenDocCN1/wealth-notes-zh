    Jobs）曾對自家員工說過：「如果你能成為海盜，為何要加入海軍？」（Why join the navy if you can be a pirate?）如他這句經典名言，美國矽谷的眾多企業家，大多有反抗權力和法條規章的想法，近來也有許多知名企業家登高疾呼：「矽谷應該脫離美國，成為獨立行政區！」而成爲熱門的話題。然而，這些想和權力保持距離的企業家，也隨著企業成長而碰上許多和規章、稅制相關的阻礙，包含Google、Facebook等知名企業，也開始支付巨額遊說款項。根據美國非營利消費者權益保護組織「消費者看門狗」（Consumer
