    # 危機或轉機？看你用什麼心態來面對


    現在開始，世界將會發生許多前所未見的巨大變化，而這些變化，同時將會帶來許多「以下犯上」的契機。在缺乏變化的時代，人們的職位時常固定而少有變動，使得勝利組與失敗組的位置也難以動搖；這不僅無法給予挑戰者機會，容易導致不公平的局面，更難有「以下犯上」的可能。然而，從今而後，這些固定的位置，將有機會重新洗牌，從零開始。


    事實上，在英國《經濟學人》雜誌所推出的《經濟學人權威預測：二〇五〇》趨勢巨流《（天下雜誌出版）中便提及：「自一九五六年至一九八一年間，平均每年都有二十四家企業擠進《財富》雜誌公布的『世界五百大企業』排行榜中，但一九八二年起至二〇〇六年間，平均每年卻增加到四十家之多。」


    然而從另一方面看，轉機和危機的到訪或許是一體兩面。要把變動當做轉機或危機，端看你怎麼思考。依判斷方式不同，它可能是危機，也可能是轉機。在你稍微嚐到成功滋味時，這個世界同時也在發生巨大變化，你的位置即將被人奪走了，此時你的心念如何轉動，會影響接下來的選項。好不容易累積到現在才站穩的位置，將要被
    人奪走，你認為這是危機或轉機呢？你能把它當做歸零的契機，以截然不同的視野，創造下一個全新位置嗎？既然變化總是接踵而至，無論你截至目前有多少成就，勸你還是別太守成。要是不懂得適應變化，老是死守自己的位置，那麼要不了多久，你便會陷入危機。當中。面對無法避免的變化，你不該抗拒，而是要借力使力；不該拘泥於現在的位置，而是要有「變化一刻也不停歇」的自覺。它會轉變成危機或轉機，就在你如何看待這樣的變化。最重要的，要比任何人都早察覺變化的徵兆。如果能在變化還是「點」時先察覺，就能在它成為兩點、連成一線時，率先抓住未來的趨勢。可是
    在那個時候，也有許多人會察覺到那條線，因此你更該在變化還是一點時就可以掌握，成為最快行動的那個人。


