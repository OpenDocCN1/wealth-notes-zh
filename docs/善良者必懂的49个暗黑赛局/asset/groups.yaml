    縱使別人……縱使別人……縱使別人……縱使別人實際周遭人們並沒有你想像地那麼在意，而且那些人對你的面子問題，也沒有那麼深刻的感受。被對方破壞了信用和實績，固然跟利益可能直接相關，但若不是那樣的情況，你就不需要如此在意。

