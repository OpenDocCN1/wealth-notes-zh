    ## 善良者必懂的 49 個暗黑賽局


    > 《孫子兵法·謀攻篇》

    知彼知己，百戰不殆；不知彼而知己，一勝一負；不知己，不知彼，每戰必殆。


    藉由這樣的做法，雙方便能避免對彼此過度解讀。一旦落入過度解讀的迴圈，即使對方的舉動無心並毫無惡意，也很容易被過度理解成「惡意的行為」。那麼惡化的關係會變得更惡劣，最後便可能發生衝突。當和討厭的人關係愈加險惡，你雖然不用勉強自己和對方親密對談，也應該和對方溝通、避免關係繼續惡化。最差的情況，至少就先見個面吧。即便不必勉強自己說這些什麼，你也該讓對方看著自己並無敵意的神情和姿態。我瞭解你「連他臉都不想看到」的心情，但是連臉都不肯看上一眼，就深陷過度解讀的開端了。


    ## 第二章 11 個戰略技巧，縱橫戰場輕而易舉


    ### 14

    好心不該被吃定，

    懂得適時逃跑才是上策


    值得迎戰的對象都有一些利用價值，也就是「透過交往就能讓你得到什麼」的那些人，就只管選擇他們吧。要發怒，你也該慎選對象。就算你被「無論如何接觸只會換來損失，對自己沒有絲毫意義」的對象給挑釁了，也不該加以理會。要是被糾纏，「不顧一切地逃走」也是選項之一。提到壓根不必理會的人，首先可以聯想到的是那種在網路上匿名（有時也有用真名）發表文章的人。他們不懂得尊重別人，更以攻擊性言論糾纏其他網友，幾乎毫無常識可言。在我擔任議員時，這樣的人尤其多，即使是現在，社群網站上也有許多這種死纏爛打的人。他們的理由雖然有千百種，但基本上，這類人都善於運用時間和精力，簡直太可惜了！那些時間明明能更有效地運用啊。唉！我竟不由自主地多管閒事了。有些人感性處事，也有
    些人懷著意圖待人。就是有人喜歡纏著我們、要我們做出回應，在社群網站上追求受人矚目的快感，針對我們的言行舉止，極盡挑剔之能事，認為這樣就是取得了勝利。


    曾經，我為了那些人過於不講理、惹人厭的無禮言論和令人髮指的行為而大為光火，和他們攪和成一團。但卻是大錯特錯！從中獲取的經驗，讓我有了決定：應該徹底將那些人列為拒絕往來戶，或是從那些不懷好意的人身邊逃開。


    和這類人交手，你幾乎得不到好處。要是你做出回應，那樣的態度也在網路上被披露，無論你的反駁多麼合乎邏輯，也會給人幼稚無聊的印象；就算是顯露一點點情緒，也是你氣量狹小的表現。


    對方因為引出你的情緒而自鳴得意，要是想抓住你的小辮子，就會用許多方式讓你失去理智，也更堅持他的謬論，使情勢演變得幼稚不堪。因此，即使你耗費時間和對方糾纏，也不會有任何好處，只是喪失時間和聲望罷了。


    曾經，有個如名部落客特別喜歡挑釁我，我也把他當一回事，讓朋友十分擔心地對我說：「你不必反應那麼大吧？」但對方實在胡言亂語，又對我有誹謗中傷之嫌，在跟律師討論過後，律師這麼告訴我：「田村先生，你這樣反駁他、把事情擴大，可就正中他的下懷了。雖然說忽視他，會讓你覺得不爽快；但相反地，要是你只為了痛快回應而有所行動，那可就是嚴重的策略性損失了。」律師還對我說：「太過糾纏田村先生的人，或許他本人並沒有發覺，但很可能是喜歡你的。有時那樣的人為了展現對你的好感，卻因不善於表達而淪為攻擊。要是你回擊了，恐怕會遭受對方情緒化糾纏，甚至對你展開更激烈的攻擊。因此，為了讓對方早點忘記、放棄對你的糾纏，就別跟他打交道了。」


    雖然我自己沒碰過，但聽說常有人會在電車上或路邊騷擾旁人。可能是日本景氣有些低落，又或許根本原因是「人口減少」，使日本蔓延著苦悶封閉的氛圍，讓某些人的精神狀態多少變得怪異，或個性變得暴躁易怒。他們對未來感到不安、變得自暴自棄，要是你只為了正義感或使命感，試圖挑戰他們、對他們說教，其實相當危險。被這種人纏上，一點好處都沒有。只要你能理解這有多浪費時間和精力，自己就會從這些人身邊一溜煙地逃走了。


