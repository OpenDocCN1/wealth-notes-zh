    不過即使受了傷，若你能在傷口還濕的時候，就先得到這樣的經驗，我想那也不算壞事。上了年紀再犯相同錯誤，是不可挽救的致命傷；但在年輕時，還能以「幼稚魯莽、血氣方剛」為由被原諒，進一步化為經驗值，這就是「和笨蛋交戰」的意義。


    無論是為了「某一會來到的勝負時刻」而備戰，或是實際感受「和笨蛋交戰的徒然」，你最好都要和笨蛋交戰一次，才能真正明白。


    有些書籍也會強調「不和笨蛋交戰、華麗轉身離去」的論點，卻容易陷入自相矛盾的窮境。我希望你明白：人生並不是非黑即白、翻兩瞪眼的二元論。人生在世，並非動輒「非此即彼」，「保有彈性」才是正解。你不僅應該清楚不與對方交戰的重要性，也要瞭解偶爾交戰的意義。在傷口還不深時，希望你能不顧一切、試著和笨蛋交戰看看。如此或許能換來爽快的心情，但也一定會浪費大量精力和時間，將你逼到絕境，讓你從悔恨中學會一生難忘的道理。總有一天，你會碰上「和值得交戰對手交戰」的機會，就把它當做是作戰前的暖身運動吧！


