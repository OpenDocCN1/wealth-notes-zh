  - "[PAGE 7]\n\n# 推薦序 懂得「轉化」，敵人就能成為貴人\n\n# 推薦序 懂得「轉化」，敵人就能成為貴人\n\n暢銷書《我不是教你叛逆，而是要你勇敢》作者\
    \ 鄭匡宇\n田村耕太朗的《善良者必懂的49個暗黑賽局》，是一本非常常有意思的書，尤其在這個敵人往往「不知從何處冒出來」的網路時代，更可以提供許多遭受攻擊和批評的人，一些心理建設及聰明的應對方法。\n\
    我很訝異地發現，作為政治家的田村先生，其將多年經驗歸納出來的建議，竟然與我曾經出版過的《就是愛被罵：史上最強被罵應對心理學》中的思維和做法不謀而合。諸如強調讓敵人變貴人的方法、做自己的立命安身方式、不和敵人交戰而是向自己挑戰……等，都是我不斷拿來自我提醒的重要心態。\n\
    根據多年在職場和生活 :\n    中打滾的經驗，我發現所謂的敵人，真的都是因為「你"
  - '[PAGE 8]


    把對方當敵人，別人才會成為敵人。當你根本沒有「敵人」這個觀念時，很多現實生活中的問題，以及內在的負面情緒，都能夠迎刃而解。舉個實際例子。在我的臉書上，許多粉絲和朋友都曾經很困惑地問我：「匡宇，為什麼作為自己粉絲頁和個人頁面的管理員，你從來不刪除批評謾罵和一些鄉民的酸言酸語呢？某些話語除了是對你在做的事情不夠了解外，很多言論甚至是毫無根據的亂罵，你卻總能雲淡風輕地笑著面對、四兩撥千斤，這到底是如何做到的呢？」殊不知，這真是因為我沒有「敵人」觀念，並且懂得「轉化」的結果。我刻意放任某些人批評我，是因為：聽到不同的聲音，使我能夠發現自身不足之處，為向上提升做準備，並且懂得謙卑。在我看來，每個人都有發表自己意見的權利，雖然有些人的口氣和態度不好，但「認為別人都該禮貌和氣地對待我們」，本身就是一個會讓自己活得不開心的妄'
  - '[PAGE 9]


    # 推薦序 懂得「轉化」，敵人就能成為貴人


    想。當別人提到你的做法不對、想法有錯時，先別急著自我保護、不予理會或加以反擊，而是仔細審視對方的話語中是否有值得參考的意見。說不定他們真的點出你看不到的盲點，當我們加以吸收及採用後，就能獲得更大的成功。

    正確地應對批評謾罵，可以彰顯我的宏觀大度，為個人品牌形象加分。因為我永遠都很有禮貌、很正向地回應某些人的批評謾罵和酸言酸語，於是真的有許多讀者私下來信，佩戴我一直能保持如此正向的態度。但他們不知道的是，這整個過程，其實也是我刻意「利用」來打造個人品牌與形象的方法。如果別人攻擊我，我就攻擊回去，別人酸言酸語過來，我也氣急敗壞地揪揪回去，那就只是兩人之間的戰爭；當我懂得善用這些攻擊話語，不只能提高自己的位階，提供宏觀的視野，並且能像作者、田村一樣，著書立言，發揮更大的影響力。這豈不是舉多得的超級「好康」嗎？

    對方過分的言語，會造成他的自我毀滅，因為群眾的眼睛，比你想像中來得雪'
  - '[PAGE 10]


    # 善良者必懂的 49 個暗黑賽局


    亮。

    現在是一個網路時代，當一個人的言語實在太過分，而被攻擊方卻一直「溫良恭儉讓」時，周遭看到情況的人很可能被激發出內心的正義感，不必你出手，他們便對採取不公不義手段的人進行「肉搜」，讓那些攻擊者無所遁形、不得安寧，最後默默消失。而且根據我的經驗，那些會攻擊你的人，很少有足夠的恆心及毅力「伴你一生持續攻擊」，通常都是兼差和臨時起意的成分居多。

    你當下為了他們的話讚讚嘻歡，甚至放棄既定的方向，結果一事無成，豈不是太可惜了嗎？跟那些在你成功時不會和你分享喜悅，在你失敗時盡力嘲笑你的人繼續用」即可。

    門，真的是不智之舉。直接加以忽略，或者用我上面提到的兩個方法來「加以利用」即可。

    面對與他人的紛爭，請別再用過去傳統的「敵人」觀念應對。田村耕太郎在本書中提供了許多實際有效的做法，一定能讓你化敵人為貴人，讓自己過一個更好的<|message|>'
  - '[PAGE 11]


    # 前言 別為了爭一時的勝負，選擇和笨蛋戰到底


    # 前言

    別為了爭一時的勝負，選擇和笨蛋戰到底


    透過本書，我想傳達給讀者的訊息和「別浪費有限資源」的經營戰略十分類。似。無論時間、精力及時機點等，都是有限的資產，它們都是為了盡情讚頌僅有一

    次的人生而存在。和未經世事、單純、率直，而可說是愚昧不堪的夥伴無謂交戰，使自己費心耗

    神，都是無法產生積極成果的行為。我希望你們都別再耗費時間和精力的在這些事情

    上，而要讓僅有一次的珍貴人生，變得更加耀眼光彩。

    換言之，本書是一本「反戰之書」。我有自信這麽說：全世界知名的《孫子兵法》，便是—本超越兩千五百年、堪稱現代真實社會版的反戰之書。該書最有名的

    一段話是：「百戰百勝，非善之善者也；不戰而屈人之兵，善之善者也。」一意思'
  - '[PAGE 12]


    # 善良者必懂的 49 個暗黑賽局


    是：「百戰百勝並非最卓越的戰術；不和敵軍動上一兵一卒，而能降伏對方，才是最高明的。」我將其論調更添上新意：「不僅要避免交戰，更要借力使力，利用其力量來達成自己的目的。」《孫子兵法》之所以至今仍受到全世界經營者歡迎，正是因為其中透露了「別浪費有限資源」的訊息，可謂極重要的經營戰略。提到「笨蛋」，他們或多或少都有一些特徵吧？簡單來說，他們行事輕率、老是扯你後腿。在會議上，老是針對你的發言找碴；明明同屬一個工作團隊，卻明顯對你有敵意、絲毫沒有與你合作的意願；明明你的意見才是正確的，他們卻賣弄權限、想要予以破壞……。每當遇到這種情況，你是否曾「因悔恨而無法專注工作」的經驗？是否因此耿耿於懷，想著：「為什麼他老是對我這麼嚴苛？」是否氣得怒火攻心，就算回到家了，還是感到慄恨不平？然而，即使那是一種錯誤，我也希望你別再想著要「以牙還牙」了。事實上，這樣的想法才是最危險的！'
  - '[PAGE 13]


    # 前言 別為了爭一時的勝負，選擇和笨蛋戰到底


    曾於二〇一三年風靡一時的流行語「加倍奉還」①、日籍棒球選手松坂大輔在進入職棒後說的「Revenge」（復仇、雪恥）都曾造成話題②，這些語彙深獲支持，都是受到日本獨有「復仇文化」根深蒂固的影響。話雖如此，我畢竟是個貨真價實的日本人，對於這樣的詞彙，還是很
    HRESULT。


    不過，我同時也認為喜歡這類詞彙的日本還真危險啊。氣惱、憤怒、甚至加倍奉還，都是無謂而消極的情緒反應。一味拘泥於已經結束的事情上，更有可能陷入惡性循環。


    笨蛋們所不能容許他人擁有的「責任感」或「正義感」，就某程度而言的確立意良善，但還是太過天真了。


    ①《半澤直樹》是日本TBS電視台於二〇一三年播出的電視連續劇，主角為銀行員半澤直樹，劇中有所謂「倍增返還」。


    ②松坂大輔外號「平成怪物」，一九九九年加入職棒西武獅隊。在同年四月二十一日賽事中，他對上千葉羅德海洋隊的投手黑木知宏而飲恨敗北，賽後即對外宣稱「我會雪恥的」，四月二十七日便如言贏回勝利。當時這句話在日本社會造成十足話題，更獲選為該年度「新語與流行語大賞」之一。'
  - '[PAGE 14]


    責任感或正義感背後，隱含著在電視節目和教育中「懲惡揚善」的概念。他們信奉著：「最後水戶黃門或大岡越前將會前來搭救，壞人都會被收拾乾淨！」然而可惜的是，懲惡揚善並不常見。一切無關好壞，這就是人生，只是現實世界的狀況罷了。


    「壞人總能得道」，這似乎和平真理、善惡並無關聯。就是我所知，至少成功的人追求的並不是「善惡」，而是「真理」。若想擁有美麗人生，能夠判斷善惡固然很好，但絕不能拘泥在善惡之上│說得更白話一點，不能拘泥在懲惡揚善之上。


    我們應該追求的是真理，而真理的其中之一便是：千萬别期待你的人生能夠懲惡揚善。


    你執著於悔恨過去，犧牲自己的未來嗎？抑或為了成功，全神貫注在真理之上呢？比起耿耿往昔，明明讓它雲淡風輕，會使你受的傷害輕一些，你卻為了要除去悔恨，而將更多的時間和精力浪費在過往。很遺憾的是，在這懶的「妓妓社會」裡，筮蛋屢見不鮮。在職場爬升的過程

    中，有能力的傑出人才很可能被許多筮蛋扯後腿、搞破壞。無論在政治圈或商業'
  - '[PAGE 15]


    # 前言 別為了爭一時的勝負，選擇和筏蛋戰到底


    界，這樣的事總是層出不窮。這是因為——筏蛋都會支持筏蛋。如此這般，在握有權力的『工作夥伴』中，其實筏蛋為數不少。也就是說：筏蛋是相當難纏的敵人。讓這樣的敵人增加，絕對無法紓解負面情緒，我不希望你將僅有一BBQ次的寶貴人生，浪擲在這種事情上。在日本社會裡，輿論往往無法冷靜地擴散，而總會落入人身攻擊的巢臼。那麽

    失去的便是時間和精力，使事情無法有效進展。成功者不迎無謂之戰，他們主動選擇迎戰的時刻及對手。我們可以這麼說：正因他們深知與筏蛋交戰有多麽浪費時間，才能够順利得勝。

    希望你這麽想：理當交戰的對象，應該是為人際關係發愁、煩惱及氣憤難當的自己；避免精神耗弱的第一大重點，就是「更加關注自己」。③《水戶黃門》是日本民間故事，也是日本電視史上最長壽的時代劇之一。其主角水戶黃門本名德川光國，長年周遊日本各地，讓惡人洗心革面，堪稱「日本版包青天」。因他曾任黃門官，故人稱「水戶黃門」。④大岡忠相是日本江戶時代中的名奉行（知名法官）之一。由於他身為「越前守」，在時代劇中的官職形象深植人心，因此以「大岡越前」之名廣為人知。'
