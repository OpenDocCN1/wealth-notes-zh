    透過這些經驗，我能夠自信斷言：世界上聰明的人多得數不清。雖然聰明有其價值，但並非絕對的價值。真正的睿智與出類拔萃的人生最高價值，並非單純的思維能力，也不限於記憶力和發想力。想要成就大事，無論你是經營者、學者、政治人物、行政官員，都必須具備「看穿對手的能力」。擁有這項能力的人，就是最有智慧的人；只要擁有它，你的人生便將如虎添翼。


    這個世界上，充滿許多少趣的點子與想法，重要的是如何將它們付諸實行，給予世人衝擊。然而，無論再怎麼聰明，一個人終究成就不了大事。沒有走入人群、認真地鼓勵他們、思考規畫、甚至加以實行，那些點子和想法也終究只會淪為空想。為了將它們付諸實現，我們需要的是「理解對方心情的能力」，這正是聰明人最缺之的。說得更貼切一些：越是聰明的人，越沒有這項能力。仔細想想確實如此。聰明的人有自信、非常自戀，光靠自己的發想就敢魯莽行事，所以才會被稱為天才。但是，為了往前邁進、實現天才一般的理想，就得將自己的情緒擱置一旁，理解對方的心情。為了影響對手，你一定要知道對手的心情，所謂「知道」就是「清楚、瞭解」的意思。雖然我已經提出許多關於「面對自我」的論點，但在這裡我們必須換個角度思考，因為人生就是這樣，看似簡單、卻複雜得要命。想要實現本書的目標，看穿對手心情的能力最是不可或缺。為了不激怒他人、不與其對戰，更向對方借力使力、進而擊倒對方，你就一定要有理解對方心情的能力。我見過許多菁英分子，因為不瞭解他人情緒、無法善用自身能力而受到挫折，中途就消失不見了。就算擁有再敏銳的分析力，如果你想要給世人留下印象，就必須先理解有力人士的心情、融入其中，再進一步影響他們。無論何時，和人際關係相關的行動，都是從考慮對方情緒開始，只要這麼做，


