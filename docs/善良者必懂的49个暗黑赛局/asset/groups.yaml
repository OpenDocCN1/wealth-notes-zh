    本書寫到這裡，我一再要你「面對自己」、「專注在真正想做、也應該做的事情上」，但或許還是有讀者找不到自己想要埋首追求的事物。我想對這樣的人說：與其尋找想做的事情，倒不如全心全意為眼前的事物拚搏。比起那些想著「再也沒有比找到自己想做的事情更幸運」的人，其實正在尋找夢想的人反而意外地少。即使他們真的找到了，是否能力實踐也是個問題；我認為那些找到真心想做的事情、也有能力達成目標的人，實在太幸運了。日本以花式滑冰技驚世界，淺田真央選手經常說：「我能和滑冰相遇，真是太好了」，但知道自己喜歡滑冰、而又能持之以恆練習的人，卻是少數中的少數。曾在冬季奧運勇奪金牌的羽生結弦選手，也曾經表示：「日本東北只有一個滑冰場，


