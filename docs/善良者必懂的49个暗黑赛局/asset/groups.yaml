    deemed 氣氛，的手段出類拔萃，頂尖得烙猿至極。他善於創造出「我一定得幫助他」的氛圍，實在太厲害了！我常想，他究竟在哪裡學到這些方法？真的打從心裡佩服他。在從政時代，我也曾在助選時碰過類似場面。當時我助選的，是一位從未敗選過的政界前輩。他來到地方拜票，那時候，無論是那位前輩或他的太太，都用一臉快要落淚的表情說：「這麼下去……我們鐵定會輸的……」同時逐一和演講會場的支持者握手致意。握了手的支持者，眼眶也噙著淚水，臉上似平寫著：「好！我一定會幫你們」的訊息。無論媒體或黨內民調，那位前輩的支持率都是壓倒性地高，但正因如此，他更是刻意對競選團隊表示：「優勢報導會讓你們鬆懈，這非常危險！」「選戰才打到一半，這跟結果完全無關。扣除投票日前投下的選票⑩，就不會有其他人投票給我了！」如此掙命地營造危機感、綏緊團隊成員神經，同時用幾乎要掉淚的表情，巴著支持者不放。每當這位總是打勝仗的前輩吶喊：「請幫助我！」「只差一步了！」支持者就會變得比前輩本人還要認真，連我這個助選員都感受得到。即使在壓倒性勝利的報導中，也要給支持者灌輸危機感，這樣的演技實在逼真得入木三分。

