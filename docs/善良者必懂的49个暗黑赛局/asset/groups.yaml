    ⑪ 雷蒙德·庫茨魏爾（Ray Kurzweil）是美國作家、發明家和未來學家，現任Google工程總監。


    # 善良者必懂的 49 個暗黑賽局


    繁重業務的朋友，在生命走到一半時，就必須迎接死亡，在那瞬間他究竟領悟到什麼？只要想起這件事，我就能感受他們的悔恨；曾幾何時，只要閉上眼睛，曾跟我熱切對談的身影，就會一一浮現在我眼前。這並不是別人的事。說不定到了哪一天，疾病或意外會發生在我或我重要的人身上。我根本還不想走到人生終點，為了不走向死亡甚至什麼都願意做；而為了讓自己有動機，確認人生的意義和重要目標，我總是預想自己終有一天會面臨死亡。在死亡的那一瞬間，自己會想些什麼？能夠帶走什麼？死後又會如何？只要思考這些事，就能明白最重要的是什麼了。預想自己的死亡，就特別能夠感受到在人生中，有哪些事物最需要珍惜。反倒是那些不明白人生有限的人，錯認了「反正時間還很多」，也根本就不懂得生命的可貴。

    只要想想那些英年早逝的人，在生命終點的瞬間感受，我就覺得想做的事，現在就該去做。而為了做那些事，無論誰說了什麼話，都能想著：「那干我屁事？」。同時明白在漫漫人生中，那些無聊的心思和自尊，其實一點意義都沒有。


    # 終章 不要小看自己，你就能成為「賽局」裡最強的操盤人！


    # 常保身心健康，是善用人生的第一要素


    接下來，我要具體說明「為了發揮人生極大值，我是怎麼做的？」首先，善用人生的第一要素：常保身心健康。只要能夠保持身心健康，就能讓時間和能量的運用，都達到最高效率。我總是注重運動、營養攝取和心靈充電，進行完備的整頓和安排。

    年輕時，我曾為了擁有完美體態及增加肌肉量而大量訓練，但那樣的身體在死亡火化成灰後，並無法帶到另一個世界去。因此，我不再過度拘泥於身體這個工具，而開始重視身體條件，以發揮更卓越的效益。

    我不再專注把肌肉鍛鍊得多大，而是注重維持肌力和肌肉量，同時重視伸展、延伸身體的可動領域，因此也變得不容易受傷。伸展肌肉不僅給我精神上的鍛鍊，也給我放鬆的機會，如此適度讓身體感到疲勞，就能獲得深層而高品質的睡眠。

    用餐也一樣，我均衡地攝取當季食材，堅持質重於量。無論蔬菜、魚或肉類都減少攝取量，而將選擇的品項增加；仔細咀嚼、增加飽足感，不僅能降低腸胃負擔，也能改善腦部血液的回流情況。

    這些身體條件，對延長壽命也有幫助。健康而有活力地活動，就能延展我們的「健康壽命」。勝海舟有一句名言說：「想要成大事，就得長壽才行。一成就能一 番大事業必須晝夜費時，因此唯有長壽之人，才能取得最後勝利。他還說：「富貴命裡排，各自等時來」，意思是「只要健康、長壽、持續勤奮努力，美好的結果自然會來報到」。常保健康而長壽的體魄，就能讓這僅此一次的人生，發揮最大價值，不但要活得長，更要活得精彩！

    除此之外，你也要懂得珍惜家人與朋友

    此外，你也應該珍惜生命中的核心人物——家人和朋友，他們在你人生中，都佔有重要的一席之地。再怎麼忙碌的人，只要減少時間和精力的無謂浪費，都能抽出一點時間來和重要的人相處。只是在我擔任政治人物時，那時候除了忙、還是忙，雖然工作充實，卻也感受到無法珍視家人和朋友的遺憾。如今能夠擁有充沛時間，不僅能用於工作、也能和家人及朋友相處，人生因此變得更加豐富而多彩。我限制自己每天使用電腦、智慧型手機和平板電腦的時間，盡可能透過紙本印刷物，而不從螢幕獲取情報和知識。數位資訊雖然迅速便捷，但光靠它並不能充分量化，甚至包含氣味和髒汙等複合式情報，也和文字同時進入感官，而更容易吸收。化為自己的養分。閱讀報紙、書籍等紙本時，我能夠感覺紙張的觸感、厚度、重。需要專注精神的時候，我也不使用智慧型手機、電腦和平板電腦等電子產品。同時，我實踐早睡早起的生活型態。與其在負面情緒容易滋生的夜晚思考，不如早點睡覺，隔日以清爽舒暢的心情迎接早晨，更能擁有積極正面的精神狀態，來面對生活的一切。要是你瞭解人生僅只一次，更是時間有限、資源稀少，自然不需要藉助這些訓練，來讓自己更有力量；但是這些強化身體的方法的確能給予你最好的協助，讓你的寶貴人生發揮最完美的價值。⑩勝海舟是日本幕府末期的開明政治人物，擔任江戶幕府的海軍負責人。在遇坂本龍馬行刺時，勝海舟說服了他，使他成為自己的門生。


