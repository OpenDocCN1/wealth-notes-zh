    \ 我向來抱持「過去的事就讓它過去」的平民論調，因此也很難接受他們這樣的態 度。我曾受到黨部指派，前往拜訪地方上頗有成就的自民黨員。但有些人不接 受邀約、不跟我見面，更有人說：「下次選舉別說助選，我絕對會扯你後腿！」當\
    \ 時的自民黨比現在更有威望，地方勢力比黨部更大，因此有些人根本不聽黨部的\n\n話。我所在的選區，當時也瀰漫著這樣的氣氛。因此，我決定從「小小的贊同」開始累積。一下要人家與你和睦相處，根本不可能，那就像從「能夠走進對方家玄關」開始。而要走進現任國會議員家中的玄關，就得設法讓他的家人說服他。一開始，我只站在玄關處談話，接下來再談談能夠炒熱氣氛的共通話題，最後打聲招呼後離去。我跟對方是同鄉，因此彼此都有共同認識的人，而他也是熟知地方課題、為了解決問題而奮鬥的議員，所以話題縱對多得數不清。接著，讓對方願意和自己談談他公司和組織的狀況。倘若能夠用這種方式，共同一些時光，便有機會互相理解，讓時間消弭彼此的對立。就像這樣，從小小的贊同開始累積。若能花些時間來淡化惡劣的情緒，便能為彼此構築穩固的關係，而不再像臨時抱佛腳一樣，老是事到燃眉，才倉皇張羅了。\n\
    \n## 第五章 攏絡對手之前，你要先學會包裝自己\n\n# 迅速改善關係的方法\n\n再舉一個更具技巧性的做法，那就是「期望值管理」。首先，預設自己可能會與對方決裂，在對自己有利的條件下，投出一個「壞球」。由於雙方是從敵對關係出發，因此最原本就難以達成共識；接著，在不激怒對方的前提下，和對方決裂，之後再由你讓步。\n\
    \n如果我在本文開頭介紹的「從小小的贊同開始累積」是「從下對上」的（bottom-up）關係改善，那這裡所說的，就比較接近「由上對下」（top-down）的做\
    \ 점유법。\n\n最初由你投出壞球，目的是降低對方「達成共識」的期望值。要是對方要求高得令你難以接受，你就改變期望值。接著，因為你的讓步，就能夠提高彼此改善關係的期望值。而後，再營造出一種「因為你已經讓步，對方也不得不讓步」的氛圍，要是在此達成共識，敵方便能成為你的了。\n\
    \n究竟要向對方投出怎樣程度的壞球？這其中的拿捏實在不容易。有時也可能因\n\n## 善良者必懂的 49 個暗黑賽局\n\n雙方決裂的程度過重，讓彼此關係就此走向終點。即使你們在雙方決裂後仍然持續溝通，但到底該讓步到什麼程度，對方才會跟著讓步？要看穿這一點，其實也有相當難度。要是最初你投出的是否是壞球，卻飛到一半的高\
    \  度就落下，因而被對方猜透心思，那麼關係也可能更惡化。不過，善用期望值管理的優勢在於：只要能夠順利優化彼此的關係，那麼比起從下對上的方式，有可能更快地改善彼此關係。期望值管理成功與否，並不能單單仰賴你的努力，也要對方期待彼此關係往好的方向進展，才能夠發揮效果。要是對方根本就沒有心改善，這個方式就無用武之地。要改善你和敵方的關係，關鍵是要認真地在對方身上多花點時間，因此「增加共處時光」，就是這個方法的基本質。即使處事笨拙、不足夠圓滑，重點在真誠地和對方擁有「面對面相處」的時間。時間不僅是珍貴的資產，更是改善彼此關係的良藥。無論面對任何事，唯有勤奮耕耘才是貨真價實的人生法則。\n\
    \n## 第五章 摧絡對手之前，你要先學會包裝自己\n\n> 善戰者，能為不可勝，不能使敵之必可勝。故曰：勝可知，而不可為。\n《孫子兵法·形篇》\n\n\
    ## 40\n七成技術，三成熱情；\n打動動搖聽眾的表達力\n\n許多人缺乏自信，也不僅長表達自我主張。相對地，要是要提到「自我主張意識強烈的國民」，一般都會想到美國人或印度人。然而他們並不是與生俱來就知道如何表達，而是在接受教育時，就接受過表達自我主張的訓練。我實際走訪位於東京都江戶川區的印度小學，每天早上都會有孩子在全校師生前發表演說，主題可以是自己最近發生的事情，或所有人都知道的新聞事件。\n\
    \n幼齡孩子的專注力原本就難以持久，因此要他們發表一段，讓所有人都聽到最後一的演講，簡直難如登天。這所學校每天讓孩子反覆練習，不僅能讓他們從其\n\n他同學身上得到知識，更能由老師從旁給予提點，如此就可以逐步成長。在歐美國\n\
    \n## 第五章 攏絡對手之前，你要先學會包裝自己\n\n家的教育體系中，也有許許多讓孩子在眾人面前演說的機會。孩子就這樣，逐漸習慣表達自我主張。要在他人面前伶俐地傳達自己的想法，實在需要相當的訓練，即使心裡緊張，也不能忘記想說的話。\
    \ 不但得有條不紊、正確無誤地傳達，更要帶有語言張力，讓人容易聽得明白。我們都需要這樣的訓練，而最好的方法，就是在短時間內利用「TED⑨」或「Youtube⑩」點聽大量的演講內容。請先試著做一段這樣的演說—首先，利用輕鬆的笑話舒緩自己和聽眾的緊張感、抓住他們的注意力，再做一個簡單明瞭的結論；接著，條理分明、風趣詼諧且充滿親和力地，將箇中理由與根據傳達給聽眾。\n\
    \n⑨ TED是「Technology」（科技）、「Entertainment」（娛樂）和「Design」（設計）三個單字的縮寫，是美國成立於一九八四年的一家私有非營利機構。該機構的活動項目眾多，其中一項是TED演講（TED\
    \ Talks），一開始由前述三種領域的專業人士發表演講，後來也逐漸出現其他話題，由機構邀請該領域的菁英分子進行精彩演說。二〇〇六年起，TED演講的影片，陸續被上傳到網路上，引\n\
    \n⑩ YouTube是美國的影音分享網站，能讓使用者上傳、觀看及分享各類影片。\n\n此時，最重要就是你的「認真程度」。和會議手冊完全相同的架構、做得精采的簡報檔，都有可能讓你的認真度下降，和那些東西比起來，你應該將焦點擺在「想要傳達的概念和理出」上。技術層面的東西，只要展現出七〇％就可以。了。即使講話不流暢、簡報檔跳頁、數字有些誤植，都比不上「熱情」這把關鍵的鑰匙」「無論如何都要傳達給你！」「好想讓你明白！」「我是躍躍欲試！」「以一二〇％到一五〇％的認真程度，呈現這些心情。反過來說，要是你沒有投入一二〇％以上的精力，是無法打動人心的。人類雖然會被數字、圖表說服，但再聆聽的人，還是和電腦截然不同，這我早就說過很多次了。人的情感容易受到支配，也因為如此，你才需要設法動搖聽眾的情感。為了左右聽眾，準備就相形重要了，請反覆多次練習發表簡報。即使已經是相當精彩的簡報，也還有更精彩可能。練習多次以後，你就能清楚地表達理念，再將自己訓練到「不必看資料也能解說」的境界。接下來，你要做的就只剩下展現認真和傳達熱情了。\n\
    \n## 第五章 攬絡對手之前，你要先學會包裝自己\n\n> 善用兵者，屈人之兵而非戰也，攻人之城而非攻也，破人之國而非久也。\n《孫子兵法．謀攻篇》\n\n\
    想要不練習就以熱情矇混過關？這是不行的。儘管熱情很重要，但是沒有練習，那就是個空有軀殼、沒有靈魂的簡報了。我也總是抱著緊繃的情緒來練習簡報。那份緊張感，正攸關著簡報能否開門見山、緊扣人心，接著再用彷彿要將緊張感瞬間解放的熱忱，呈現接下來的內容。沒有練習、沒有準備，就沒有那樣的緊張感和熱情——因為凡事豫則立，不豫則廢！\n"
