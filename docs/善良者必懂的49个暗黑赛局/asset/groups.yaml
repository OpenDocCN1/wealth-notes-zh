    不符期待的人事安排，正是你储备能量的好跳板


    ### 控制期望的艺术


    在職場上有想做的工作，卻被上司指派去做了完全不想做的工作；明想在大都市努力，卻被迫調派到小鄉鎮——身處組織中，我們總會碰上各式各樣不合情理的事，其中最讓人感到折磨的，就是人事異動。你必須明白一件事：這個世界上原本就存在「不得不已的人事異動」。公司很難按照當事人期待來調動人事，因為要探聽過所有人的想法才做安排，根本不可能。況且究竟該怎麼做，才是對當事人最適當的安排？無論對被安排的人或主導安排的人來說，都沒有真正完美的答案。


    一個缺乏人生或職場經驗的人，也沒有能力判斷「自己期待的人事調動」，將來能產生怎樣的意義；而透過人事下達的命令，意義也將隨著時間改變。要讓調職的壓力降到最小，首先就是要「控制期望值」。你不需要完全捨棄希望或期待，而是不要有過多盼望，並預設最壞情況，那麼大多少事情就能在最好和最壞間取得平衡；而當你被告知非預期的人事調動時，也就不會太驚訝。因此面對包含人事安排、待遇等問題時，最重要的就是要控制期望值。和控制期望值一樣重要的，是「無論走到什麼地方、擔任什麼職務，都要獲得和成長」，這能讓人事負責人看見你和他的協調感。當他認為「喔！這傢伙說不定值得鍛鍊一番」，或許你就有機會調派到想去的單位；或是認為「不如給他一點苦頭嚐嚐吧」，讓你前往能夠成長的艱苦環境。


    「我只去想去的單位，其他都不想要」、「反正我這種人什麼都不能如願」——要是你這樣鬧脾氣，或是表現出絕望的模樣，只會讓人事心想：「你這傢伙真難搞！」而不再給你任何成長的機會。在不符合期待的人事安排中發現樂趣、尋找機會成長，再等待下個能夠發揮長才的機會，才是正確態度。如我所說，沒有太多做人經驗的人，幾乎都只是追隨時代潮流或過去的晉升模式。業務部門也好、國際部門也罷，有些人能趁早找到自己的擅長之處，進一步尋求更好表現，或許他們無法立法即被調派到想任職的單位，但在就職前面的試或就職後的訓練，就先做好申請調職準備，使得未來有機會實現期待的安全排。

    此外，年紀較輕的員工，若想在公司申請調職，有兩個前提：

    - 自己認為具有優勢的長才，必須優秀得能讓「多年來，看過無數人才的人事主管」認同。

    - 能夠站在公司角度，有條不紊地說明「若被調派到該單位，能夠發揮多少即戰力」、「能否為公司帶來實質利益」，避免被認為只是任性。

    做了這麼多，還行不通嗎？或許是公司並不同你的強項，他們不懂得欣賞你；或許是公司對你的優勢有更多期待，打算長遠且有前瞻性地給你更多鍛鍊。是


    哪一個呢？無論哪種情況，請記得都別意志消沉，只要在崗位上做好眼前的事。你真想做的事，還不在自己的「目標雷達地圖」上，但若能在公司指派給你的崗位上持續努力，你也許會意外的愛上這份工作，或是發...意志消沉，是你人生最大的浪費。那不僅耗費你大量時間，也會讓你無法活出...自己的人生。所謂「理想的人事安排」，只不過是你有限人生經驗中的擅自想像，你連是否...點擺在目標與成長上，在被賦予的環境中，全力衝刺才對。放眼周遭，淨是些不合理的事。但無論在人世間或在公司裡，原本就不可能有


    > 善戰者，求之於勢，不責於人，故能擇人而任勢。

    《孫子兵法．虛實篇》


    你想像的公平，環境只得由你自己來創造。只要積極主動、努力不懈地創造出「讓人事主管改變心意的成績」，就對了；如果真心想做腦中所描繪的事，也可以考慮自己從頭開始組成團隊。只是，和「自己從頭開始規劃」相較，「在目前的團隊中做出成績，進而改變整個環境」，其實更加輕鬆愉快。

    即使人事安排不如自己想像，在你沮喪離開團隊、表達不滿之前，都應該在這一個團隊中奮力一搏，努力完成任務，並展現實際成果，同時善用機會持續成長。只要是能做到這樣，一條更加寬廣美好的康莊大道，就能在你眼前展現了。


    沒意義的會議，是社會人士生活中最大的時間浪費。正在閱讀本書的你，或許經常在各類場合，有過「這場會議也太浪費時間了」的想法。最典型的例子，就是日本國會。儘管開了會，但透過雙方討論，卻幾乎沒有建設性成果。


    不過，當然這些會議，也不是毫無意義。如果某條法案的審議會發生重大事件，或事故，就會有許多對輿論相當敏感的政治人物介入。在這些政治人物中，也許多認真追求國家利益的在野黨及執政黨優秀議員，有時也會因他們的積極作為，改變


    ### 29

    避免無意義的會議，最好的方法是將資訊透明化傳遞給相關人員


    變法案或預算的分內容。 然而，如同現今的「自民公明連立政權」一樣，若參議、眾議兩院擁有穩定過半的席次，法案在國會提出後，由於已在執政黨內部審議通過，因此基本上均已經過充分討論，執政黨贊成人數已有基本盤。那麼在國會的審議過程中，無論贊成或反對法案內容，基本上結果都不會改變。

    換句話說，日本國會不過是「即使已經得出結論，只為了」將事先耗費時間討論的內容留下證據。而進行的會議」罷了，而議員也有龐大的時間成本耗費在上頭。順帶一提，日本在議員身上注的國庫資金，平均每人高達四億日圓。無論是誰，都會覺得這樣浪費至極吧？

    對於無論在執政黨或政府內審議，都無法參與規畫的在野黨而言，唯一值得被注意的場合，便是在國會委員會及大會中的「政府執政黨質詢」。因此，儘管對他們而言，沒有比國會審議更重要的場合，卻往往不顧國家利益，流於質詢執政黨和內閣閣員的酬聞，或淨是對自己的選區喊話。對認真的執政黨議員和內閣閣員來說，根本難以忍受這樣的時間浪費。如果對現任國會議員、尤其是執政黨議員進行匿名調查，我相信回答「這在浪費時間」的人數，絕對占壓倒性多數。

    在我是執政黨議員時，也曾經擔任過委員會委員和理事等職務，因此真的非常討厭國會的會議，我總是想把那時候的時間給要回來。明明已經有結論，卻為了在野黨的酬聞質詢、選區訴求耗在那裡，我們到底錯過多少能夠回饋國庫的政策，失去多少前往海外視察的時間。

    由於執政黨和在野黨議員，都必須浪費這些時間來成為幹部，因此必須聽從幹部命令而加入委員會的新人及主力議員，可就痛苦了。日本國會進行議事有其法定人數規定，參、眾兩院必須有全體議員的三分之一以上人員出席，各常設委員會則必須有過半以上人員出席，如未達法定人數，議事就無法進行。為了這個規定，與會人士必須一直坐在椅子上，聽著、那些對國庫無益、對政治人物生涯也毫無幫助的討論。其實讓國會議員忙碌的罪魁禍首，就是這些時間。

    更悲慘的是內閣閣員。從星期一到星期五，整天行程都被參、眾兩院綁住，非


    得回答各式各樣的問題不可。他們為了不發生失誤而琢磨答辯方式，即使是委員會以外的時間，也耗費大量時間，從清晨到深夜，整日繁忙。日本中央政府高層人士的寶貴時間，就這樣流逝，演變為官僚主導的局面。在野黨質詢執政黨時，最拿手的經典句子就是：「大臣啊！您並不是由政黨主導，而是官僚主導了政策走向，您領導能力並不夠喔！」這類語帶諷刺的質詢，都徹底剝奪了大臣在中央政府中，發揮領導權、思考政策的時間和精力。

    政治新聞即使報導了「本法案耗時七十小時審議通過」，但這七十小時中，經常包含許多和法案無關的質詢，或老是重複著像「你聽過之前的審議嗎？」這類相同且重複性高的內容。其實審議時間的長短，並沒有多大意義。

    言歸正傳，讓我們回到「根除沒意義會議」的這個話題上。會議有許多形式，大都是「只為了讓資訊傳達給所有人、單純讓參加者聆聽」的會議、「證明所有人


    都同意的會議，以及「員工相互討論、收集意見的會議等。 在此我將特別探討最後一種類型的會議（關於前述兩種會議，由於不可光靠個人力量阻擋，我將在本文最後說明應對方式）。

    目前我擔任美國某上市企業的戰略顧問，關於這樣的會議問題，我有許多經驗能分享。該企業雖是上市公司，卻是創立僅六年的風險企業①，因此無論創業者


    差，因此他們並不輕易同時約束所有人的時間。如此，不舉行沒有意義的會議，首要祕訣便是將資訊毫無保留地傳達給相關人員。由於會議目的是向與會者收集資訊，因此若能先確實且勤快地將資訊傳達給執行長和周邊人士，就能達到「即使把那傢伙叫來，也聽不到更多了」的境界。此外，面對執行長和周邊人士的問題，也要盡可能迅速且禮貌地回答。針對自己負責業務進行決斷的人員，也應該在正確掌握的範圍內提供解答，使對方沒有任何疑慮。

    要是自己可能被邀請與會，我會詳加詢問對方「他要在會議上詢問我的事項」，並在當下確實回答他的問題。假如這麼做，他還是不能瞭解，我就先向對方說「麻煩您再明確地提問一次」，如此再次盡可能確實地回答。

    養成這樣的習慣，就能在事前充分收集大量資料、免去無意義的往返，使所有人都能一同思考具有創造性的解決策略。這不僅能節省時間，對商務人士而言，更是一種成長的機會。

    總之，我的結論是：請勤快地讓想開會的主管拿到相關資料。接著頻繁地溝

    通、預測主管有疑慮的部分，再將自己的分析結果和答案傳達給他—讓想開會的人覺得「那就不必開會了」，就是最重要關鍵。現在身處理想的環境，「但只要自己的組織裡，有喜歡開會的人，就算給他資料，他還是想開會」—會這樣認為的人，應該還是存在吧？像國會一樣，認為「花時間開會原本就是工作本分」的人，他們都非要開會不可，可，那可真有如地獄一般痛苦。遇到這類情況，與其和對方爭吵而被討厭，不如找出讓他能接受的理由，暫時離開辦公室。「因為我得去確認上次那個合約的內容，所以這一兩天必須出差，無法參與。」—如此拒絕參與沒有意義的會議。或許在你身邊也有認為「那個會議浪費人生」的同事、前輩或後輩，你可以和那些人相互討論，阻止會議召開，製造讓與會者認為「少了這麼多人，那會議就開不成」的局面，也不失為一個好方法。倘若如此還是必須開會，就只能轉變你的態度，讓那個場合變得有意義。在我擔任議員時，有時我會謊稱「這些是會議資料」，將想看的書籍縮小影印攜入，或是為了提升語文能力，將英文報紙的複印本夾帶入場。若能在大型會議中隱身在角


    > 兵貴勝，不貴久。

    《孫子兵法·作戰篇》


    落，就假裝自己參與其中，用平板電腦或筆電來做一些能提升自我實力的事情，這也是有效的做法。抑或乾脆以積極果敢、大方有禮的態度提出建設性意見，藉此提高自己的存在感，這些意見能讓會議朝有創意的方向前進。無論如何，面對無法避免的會議，就轉變心境，用來鍛鍊自己吧！


    你是經常使用亞馬遜（Amazon）書評的人嗎？要是我告訴你：美國亞馬遜網站上的書評幾乎都以真名刊登，你一定很訝異吧？事實上，當我身邊熟識的日本人知道這件事，都相當震撼。此外，美國的餐廳評價，也都以真名發表。但在日本，即使是帶有餐廳評價資訊的知名美食網站，也很少見到以真名發表的評論。儘管在日本，有許多少以真名針對書籍及餐廳撰寫評論的部落客，也有相關網站。但較大的論壇仍是以匿名居多。說到底，在美國只需要不以真名發表評論，無論誰都不會當做一回事。若以匿名


    原形畢露，你能得到更多信任


    ![](img/7e2d548d55d1d0fe7692422afaf7558c_157_0.png)


    不傷人又能表達自己的意見，增加彼此討論空間的方法……


    發表評論，那麼被當成本人或競爭對手所寫的文章，也無可厚非。以真名撰寫書評，無論針對餐廳或書籍，都能讓自己產生一份責任感和緊張感，因為都是揭露自己想的想法來評價，會有一種原形畢露的感覺。

    日本人無論發表什麼評論，在網路論壇上都匿名，因此只要寫了看似有內容的評論，其他使用者就只能當作參考。當然，也有許多即使匿名撰寫也能公平公正、以深度分析為基礎的評論，絲毫不輸給美國論壇。但我想，若他們要寫這樣的內容，不如一開始就以真名發表，反而能獲得更多信任。只是，比起那些，流於情緒化及層次低落的評論，卻是比較多。

    儘管日本還是個大而寬廣的國家，但人和人之間的關係緊密，因此一直無法習慣公正的評論，也無法承受人身攻擊一般的討論。因此，接受他人批評的器量過於狹小，便形成這般「無法以真名發表嚴厲評論」的文化。


    ### 理性表達意見的技巧


    日本人並不善於「和他人議論卻不流於人身攻擊」，這是因為從學生教育開始，就沒養成這樣的習慣。最典型的例子，便是政治人物之間的討論。國會如此，在我參與錄影的政論節目中，也時常有這類「由談話轉為人身攻擊」的情況。即使我和前輩、同事展開具有建設性的談話，對方卻對我說：「喂！我這麼照顧你，你卻是這種態度？」「欸，你要是否敢對我有意見，以後我就不管你了！」如果不是全體社會習慣成熟的討論，很難達到這樣的目標。在美國的商學院或法學院討論中，人們認為「若不能說出和他人相對的意見，就沒有存在的意義」，因此從學生時代開始，無論對象是誰，大家都必須學習在不流於人身攻擊的前提下，任性隨意地和對方討論。我在美國紐約證券交易所的上市企業擔任戰略顧問時，每當和公司幹部討論，無論對方是社長或副社長，要是不表達反對意見，就有種「幫不上忙」的感覺。我想，這是因為從求學階段到進入職場，我都是這樣和人討論的緣故。

    在這家企業中，高層面對各種不同意見，也讓員工恣意發表談話。這些對他們而言，都是「做出正確判斷」的要素，因此才會雇用各種員工。而另一方面，日本除了部分風險企業外，多數公司，很少有機會讓員工陳述與主管或高層相反的意見。

    見。

    只是，海外公司並非像一般人所想，「全都會清楚表達好或不好」，歐美人士面對公開的批評，也不是所有人都能寬大的胸懷接受，最低限度的規則和禮儀仍然有必要。

    比方說，先陳述讚揚之處和要改善的部分，再說明理由，同時慎選遣詞用字；

    無論贊成或反對，當和某人討論時，都不能忘記基本的禮儀和尊重。

    美國透過教育，讓孩子學習如何和人討論，才能成就質量兼具的討論成果，日本或許也該面臨這種「必須從教育根源改變」的時代了。學習不傷害對方而說出自己的意見，從小學時就可以開始訓練。根據我的記憶，在日本教育現場並沒有表達自己意見的機會，問了最近的學長，也沒有很大變化。

    '
