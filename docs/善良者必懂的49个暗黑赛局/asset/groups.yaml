    \n極為深刻。布朗妮將自己在安寧病房中所見所聞記錄下來，整理成《病人死前的五大遺憾》（Top five regrets of the dying）①一書出版，而其中第一項遺憾便是：「我希望我有勇氣過自己真正想要的生活，而不是別人希望我過的生活。」當我讀到這段文字時，深深感嘆「人生好難，無論到哪裡都一樣」。當我們認識為人生活點還很遠時，要我們思考「究竟為了什麼而活」其實很困難，因為我們總可以說：「那種事到時再想就好了！」然而在自己瀕臨死亡邊緣，在僅存生命裡悟出「人生本來就輕如鴻毛」這個道理，就會忍不住反覆思量：「我到底為什麼活到現在呢？我應該繼續活著嗎？」這樣的遺憾實在值得我們反思自省。別人不並不會如你所想地追隨你。無論藝人、運動選手或政治人物，在事業達到人生巔峰時，或許有人會一天到晚尾隨在後，但也並非如同跟蹤狂一般窮追不捨；更何況你又不靠人氣吃飯，別人並不會如你想像地那麼關注你。\n\
    \n⑦ 台灣譯名為《你遇見的，都是貴人》，時報出版。\n\n善良者必懂的 49 個暗黑賽局\n\n再加上，他人的目光通常都是建立在不充分的資訊上，這樣的判斷不僅偏頗，也轉瞬即逝。它可能會往往好的方向誤解，也可能正好相反，往壞的方面發展。一旦你失去了外界關注，包含過去曾有的評價、後援及友好關係，都將轉而淡薄。你會改變，對方也會改變，整個世界都在變。備受期待的政黨，可能因為沒有明確政策而名譽掃地；另一方面，被嗤棄許久的政黨明顯沒有改變，卻能等到支持度大增的時代來臨；擁有超高人氣的政治明星，也會突然窮途潰倒，這些故事我們都時有所聞。一味追求瞬息萬變的事物，並沒有多大意義。與其被那些事情左右，不如專注在自己的目標上。\n\
    \n現在你在意「別人怎麼看我」，要是從長遠人生來看，不過都是過眼雲煙，被那樣雞毛蒜皮的小事牽動情緒，只是浪費你的時間和精力，無疑更是葬送自己的人生。做你人生的主角，讓自己能隨心所欲地過活，不是很好嗎？\n\
    \n## 第五章 攏絡對手之前，你要先學會包裝自己\n\n> 善戰者，致人而不致於人。\n《孫子兵法·虛實篇》\n\n善良者必懂的 49 個暗黑賽局\n\n\
    ### 37\n想要別人喜歡你？\n你得先專心做好眼前的事\n\n人總希望能討人喜歡，其實更期待受人仰慕。我完全同意這個說法，但必須是在冷靜透徹地體認「我們無法控制他人心情」這句話後，才能有這樣的結論。面對任何事情，我們都該「將精神和力量投注在自己能夠掌握的地方」，這是我一貫的主張。為了掌握不了的問題而煩惱或擔憂，甚至感到焦慮，對於解決問題並沒有幫助。況且你也根本無法控制別人的情緒，不管家人、朋友、戀人或員工，都是如此。\n\
    為了想要討人喜歡而自亂陣腳，無法過專屬自己的人生，對我而言，就是一種時間的浪費。儘管受人歡迎、被人景仰很重要，但要...\n\n## 第五章 牽繫對手之前，你要先學會包裝自己\n\
    \n在從政時，我就有過一段不幸的時光。選舉前，我做的所有事都以「受到選民愛戴」為最高指導原則。為了討人喜愛，而煞費苦心，包含言行舉止、服裝儀容到選區活動，無不絞盡腦汁、費盡思量。在那段日子裡，我竟然將「討別人歡心」放在自己的\
    \ 人生之前，認為信念沒有那麼重要。就某種意義而言，政治人物也必須「靠人氣吃飯」，但業績、收入並不見得會因人氣而有改變。直到某天我才發現：對我來說，最需要人氣的時候，只有在幾年舉辦一次的選舉時，但在選舉時間之外，卻是應該專心做好政治人物的\
    \ 工作。\n人很敏感，當你透露出「好希望被你喜歡」的訊息時，人們便會心存警戒、抓 住你的弱點，並且不會那麼輕易地喜歡你；當你懷著「想被當權者或公司員工仰慕」的心情來待人接物時，便會讓人感受不到你的領導實力，他們也不會追隨你。\n\
