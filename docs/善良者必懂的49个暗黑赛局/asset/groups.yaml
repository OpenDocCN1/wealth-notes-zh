    因此原本是兩大黨交鋒的國會選舉，最近總演變成「某一方向獲全勝」的局面。而「勝負」這件事，只要求它扯上關係，人通常都會擁有一生難忘的執念。即使再怎麼獲勝，依然忘不了和自己交過手的敵人，於是對方心生厭惡和憎恨——這些都與我前面說的不謀而合。我所得到的教訓是一絕對不要和失敗組扯上關係。當勝利組候選人打從心底憎恨你，那他就百分之百會排擠你、不給你好臉色看，要是發生太多這類不好的事，自己是另當別論，但你可別因意氣用事或想展現正義感，而和失敗組產生關聯。即使有人讓你感到棘手，都應該積極和勝利組建立關係。人生在世，信念、情懷固然重要，但成為社會人士後，為了那些多愁善感的事孤注一擲，你將會損


    遽產生變化，而發生和預測截然不同的情況。這在政治界經常發生，商業界自然也是不勝枚舉。

    在這時，你應該先預測「哪一邊是勝利組、哪一邊是失敗組」，即使和勝利組攀上關係，也要確實觀察局勢變化。只是，即使你判斷出局勢會改變，也不該輕易見風轉舵。基本上，一旦涉及某陣營，就該徹底效忠、全力戰鬥；如果認為局勢已經改變，而輕率地改變立場，將會被對方看輕，你也將失去自己的夥伴。

    隨時掌握情勢，做好應變準備

    然而，你也應該充分掌握勝敗結果，做好完善準備——這是我在自民黨內多次參與權力鬥爭有的經驗。我的政治大前輩青木幹雄老師，總是能夠立即看出哪一個陣營能夠獲勝，並且冷靜掌握局勢變化，不只準備了計畫A，同時也預想了計畫B和C。

    即使你發現局勢變化和當初預設的相反，而自己正好就在失敗陣營中，也千萬


