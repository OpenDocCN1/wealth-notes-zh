    不過，你可千萬別被那樣的話騙了。在多數情況下，前輩說那些話只是為了展現自己的寬容大度，但實際上幾乎沒有人喜歡狂妄自大的人。大部分的人都喜歡乖順聽話的性格，若你在職場上有下屬，想必就能感同身受了。

