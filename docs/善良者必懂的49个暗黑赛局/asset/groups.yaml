    ## 善良者必懂的 49 個暗黑賽局


    ### 過度自信


    在本文所說的「自信」有許多意涵：「認為自己是對的」的自信；「能夠駁倒對方」的自信；「在權力鬥爭中能贏過對方」的自信；「成果能勝過對方」的自信。有毫無根據的自信，也有建立在實績上、有跡可循的自信。我認為每個人都應該保有自信，儘管那份精神和朝氣可能只是裝出來的；但一個真正有自信的人，在想要反駁他人時，並不會令對方感到屈辱。在我擔任金融廳政務官、自民黨財務部會的副會長及國會的財金融委員會理事時，有許多機會和金融界的各方人士交換意見。在金融界的實力派分子中，有許多人是從學生時代就接受英美教育，才能來到這個領域。即使猶鈍如我，也能察覺到許多人在骨子裡，其實都瞧不起政治人物和官僚。他們心裡想著「官僚也就這樣，身為一個政治人物，居然對經濟與金融都一無所知！」而在意見交換的場合，還能自信滿滿地教導對方，關於國會和執政黨的法案及政策。當那些傲慢自大的自信家在駁斥他人時，我常想：這樣的究竟在想些什麼


    ⑧ 自民黨的全名是「自由民主黨」，日本政黨之一。⑦ 金融廳是日本內閣府的外局，約相當於台灣的金融管會。主要負責制定金融政策，同時監督、管理金融相關事務，藉以維持金融系統穩定，並確保存款人、被保險人及投資人的權益。


    說壞事值得肯定，只是像「正義終將得勝」等天真的想法，也不該受到肯定。無論在哪裡，人們都嚮往超級英雄現身的虛擬世界，其實背後真正的意義是：現實世界中並沒有這般大快人心
    的存在。況且，每個人的正義都不同，要完美地將正義化為數字並不可能。我們應該明白一件事：人生其實毫無道理可言。說到底，「道理」根本是人類擅自幻想出來的東西，你所認知的世界並不存在。雖然我


    們並不確定神佛是否存在，但合乎常理的正義之樞，並非都能為我們敲下。若能接受這個世界的荒謬無理、清楚自己無法隨心所欲地行事，同時有「為正


    義而死」的決心，那倒無所謂；但要是你沒有那樣的決心，我奉勸你最好別將善惡


    奉為最高指導原則，輕率地主張這個世界應該要有正義。為了正義感而和他人無謂交戰，那可真是大錯特錯！你問我為什麼？因為對方獲勝的機率，可是相當高的。


    呢？是想要影響我們？想要藉小看我們而感到爽快？還是在暗示著：「我可是在教你，你，給我聽仔細了」，把我們當自己的部下看待呢？我一直都記得，好幾個曾經一同共事的前輩，他們嘴上雖然沒說什麼，臉上卻是「給那些傢伙一點教訓好了」的表情。覺得自己比別人聰明又知識淵博的人，很明顯地經常產生反效果。他們或許腦袋很聰明，然而在待人接物上卻笨得可以。此外，自信家也會變得愈來愈懶得防備。他們曾有過不少懷著自信而成功達陣的經驗，因而疏於面對接下來的挑戰。因為滿懷自信，對未來的想法也容易變得天真。這不僅會讓對方不愉快，更會看輕對方未來的做法，進而對自己的能
    力更加過度自信，形成一個惡性循環。正因為你擁有自信，你更應該謙虛以對，抱著危機感來待人接物。無論身在何處、面對怎麼的事，道理都相同。


    ## 第一章 4種容易被「黑」的狀態，你得避免交鋒！


    ### 責任感重


    「責任感」也是一種正義感，但背後的理由並不是為自己伸張正義，而是為團體奉獻己力。比起自私任性的正義，段數還是高了一些。因為對團隊中的人事、業績和戰略都懷有責任感，才和他人對戰，若有這樣的人存在，對團體而言或許還能稱為奇蹟。為了團隊挺身而出、與團隊中的敗類對抗，這樣的人通常相當少見。


    然而，他們的行為方式可是大有問題。不管怎樣的理由，我認為你就是不該挑戰那些「你認為是敗類」的做法。無論你是為了貫徹自己的信念，或是維護所屬的組織，當你用敗類的角度看事情，就如同和他們打了交道。敗類可不會那麼替組織全體著想，因為他們根本就是敗類而已！


    要是有責任感，為了團體更不能挑起爭端，你應該取悅對方，誘使他對團體產生向心力。如同我先前說的，在這個「媳婦社會」裡，有能力而本該晉升的人，經常會被許多敗類勾搭上，途中又被扯後腿、從工作崗位上一把換下。由於敗類通常攀附權勢，因此他們擁有向權力中樞傳達訊息的能力。與這樣的人為敵、惹毛他


    ## 自尊心強


    們，對團體來說，一點好處都沒有。「為了組織全體著想而誘使他人上鉤」，是相當高級的戰術。若能成功是好，但如果做不到，也千萬別和對方作對或激怒對方，造成你無法掌控的局面。


    「自尊心」這種東西，在多數情況下只是牽絆。對成功懷有信心的人，也能說是「對自己工作本質」，抱著自尊心。自尊心強的人，多半只是「想被別人肯定」罷了。當他們感覺被別人輕視時，有時會感到憤怒、不悅——就是這種類型的人。


    的確，自己的工作被重要的人瞧不起、給予負面評價很不好，但若你對「進行高品質工作」抱持著自尊心，並和「想要怠惰的自己」抗衡而持續工作，對方就不會小看你。就算對方真的小看你了，只要別跟那樣的人一塊工作就好了。自尊心受損、面子掛不住，那又如何？那種東西就隨它去吧。


    ## 第一章 4種容易被「黑」的狀態，你得避免交鋒！


    ### 多管閒事


    「多管閒事」也算是某種正義感，一種想要糾正旁人的心情。這類型的人不只喜歡介入、調停別人的爭執，更喜歡對人說教。我也曾經想要親切地糾正那些笨蛋，但遺憾的是，要糾正這類已然上了年紀的人，簡直不可能。無論如何巧妙反駁，要讓這樣的笨蛋改變想法簡直難上加難。要是被你駁斥了，他們對你只會憎惡，搞不好接下來就用報復手段報復你。在那之前，就算大家都覺得他的論點被你漂亮地推翻了，笨蛋卻可能完全沒有自覺，只會覺得「我被你找碴了」、「我被你用了歪理給拐騙上當了」，認為自己是個受害者，而開始仇視你。喜歡多管閒事的人，大多是個性單純的好好先生、好好小姐。就某種程度來說，因為他們充滿自信、覺得自己有能力解決問題，才會介入別人的閒事。不過在這個世界上，能夠控制自己的人意外地少。我的座右銘是：「只把時間和精力，專注在自己能控制的事情上。」無論你能說服對方到什麼程度，就算是你能


    > 知彼知己，勝乃不殆；知天知地，勝乃可全。

    > 《孫子兵法·地形篇》


    讓對方說出「明白了」或做出「瞭解」的表情，你也無法控制其他人的情緒。就算只有「萬一」，萬一對方能夠理解你那麼0.01%，你就應該當做意外收穫。換句話說，你很可能有「0.9999」的機率會被對方仇視，再沒有比「多管閒事」更危險的行為了。


    ## 第一章 4種容易被「黑」的狀態，你得避免交鋒！


    無論在政治圈或商業界，讓旁人覺得容易失敗的人，其實都有共通點，這也是我本身的情況。


    首先，成功人士的共同特徵是「不會輕易迷失自我」；相對地，失敗的人則總有「看不清自己」的問題。而讓自己迷失的根源，正是「無謂的自尊」。爬上高處而自尊心強的人，都懷著驕傲的心態看待事物，因此才會看不見自己。


    照理來說，「洞悉自我、期待自己達到更高境界」，應該是正確的目標設定。


    即使是在前往成功的路上，只要能看清「真實自我」及「自己和目標的差距」，就


    ### 看不清自己的人，必然會失敗


    ![](img/7e2d548d55d1d0fe7692422afaf7558c_31_0.png)


    得意忘形！

    不要有了成績就自以為是


    能持續邁向成功。


