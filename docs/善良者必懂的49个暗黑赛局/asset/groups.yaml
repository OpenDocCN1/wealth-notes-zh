    ## 第二章 11 個戰略技巧，縱橫戰場輕而易舉


    在本书中，我要阐述「华丽地避免无谓之战」的论点。生气了，不和笨蛋正面交锋，而是善用笨蛋的力量来撃倒笨蛋，将情势转为有利於自己的局面，加倍地予以奉还——这就是我想说的。然而，在这漫长、只有一次的宝贵人生中，有时你也会碰到无法华丽回避战局的时候，总有那么一刻，你必须堂堂正正和对方一较高下，非分出个胜负不可。「避免和笨蛋交手」很重要，应當迎战的那些「有迎战意义」的对手。然而一味地回避，却可能让你在紧要关头忘了如何战，所以你最好记住：有时你也需要和人对战。情况且，人是一种没嚐到苦果，就无法刻骨铭心的动物。「和笨蛋交戰」這回


    ### 15

    無法迴避戰局的話，就奮力一擲吧！


    事，要是你在一開始就迴避，長大後就無法感受到「這真是毫無意義，當時應該盡可能閃躲」的體悟了。


    和笨蛋交戰，無論在表面如何占上風、讓對方感到丟臉，其實都會給予對方強烈的反擊動機，讓你吃不完兜著走，結果你陷入了「雖獲得爽快，卻無法達成重要目標」的局面，那可是說不完的遺憾。


    不過即使受了傷，若你能在傷口還濕的時候，就先得到這樣的經驗，我想那也不算壞事。上了年紀再犯相同錯誤，是不可挽救的致命傷；但在年輕時，還能以「幼稚魯莽、血氣方剛」為由被原諒，進一步化為經驗值，這就是「和笨蛋交戰」的意義。


    無論是為了「某一會來到的勝負時刻」而備戰，或是實際感受「和笨蛋交戰的徒然」，你最好都要和笨蛋交戰一次，才能真正明白。


    有些書籍也會強調「不和笨蛋交戰、華麗轉身離去」的論點，卻容易陷入自相矛盾的窮境。我希望你明白：人生並不是非黑即白、翻兩瞪眼的二元論。人生在世，並非動輒「非此即彼」，「保有彈性」才是正解。你不僅應該清楚不與對方交戰的重要性，也要瞭解偶爾交戰的意義。在傷口還不深時，希望你能不顧一切、試著和笨蛋交戰看看。如此或許能換來爽快的心情，但也一定會浪費大量精力和時間，將你逼到絕境，讓你從悔恨中學會一生難忘的道理。總有一天，你會碰上「和值得交戰對手交戰」的機會，就把它當做是作戰前的暖身運動吧！


