    Banking），其中更棒的，就是從事『企業併購』了。『他們的實際成續也不錯，一個都進入了這樣的公司。回國後，雖然我遲了很久才開始找工作，但當時也完全不覺得辛苦，很順利就被知名企業錄取了。如同前面所述，我選擇進入在曰本堪稱「企業併購領頭羊」


