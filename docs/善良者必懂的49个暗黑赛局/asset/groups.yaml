    ## 31

    沒有權力也能做事的生存之道，該怎麼實踐？


    ### 對商業來說，政治權力不可或缺


    在美國，「說客」這樣的工作多如雨後春筍。據說在美國，如果要說動國會議員，說客就是最大的窗口。約有三到四成引退或敗選的議員，都在美國華盛頓特區的「K街」擔任說客。這些人在成為說客後，比議員時代更自由並擁有聲望。為何這份工作會如此威名顯赫？簡中緣由便是商人士對權力的渴望。史蒂夫·賈伯斯（Steve
    Jobs）曾對自家員工說過：「如果你能成為海盜，為何要加入海軍？」（Why join the navy if you can be a pirate?）如他這句經典名言，美國矽谷的眾多企業家，大多有反抗權力和法條規章的想法，近來也有許多知名企業家登高疾呼：「矽谷應該脫離美國，成為獨立行政區！」而成爲熱門的話題。然而，這些想和權力保持距離的企業家，也隨著企業成長而碰上許多和規章、稅制相關的阻礙，包含Google、Facebook等知名企業，也開始支付巨額遊說款項。根據美國非營利消費者權益保護組織「消費者看門狗」（Consumer
    Watchdog）的調查資料顯示，二○一三年Google花費的遊說費用為一千四百一十萬美元，Facebook則是六百四十萬美元。每當美國議會針對這些企業服務端運用大數據的調查資料顯示...（Big
    data）等規章進行討論時，都發現他們耗費了相當資金在遊說上頭，其金額龐大得令人瞠目結舌。


    ② 說客（lobbyist）是指那些出入國會大樓，不斷登門拜訪議員辦公室的人們。他們的活動範圍不僅限於國會，更受他人聘用，針對某項政策或法條相關決策者，進行書面或口頭交流，使政策能夠有利益其雇主。


    23 「K街」（K Street）位於華盛頓市中心，這裡座落著許多職業遊說集團、諮詢公司、公關公司和政府事務辦事處，被視為美國總統、國會和法院之外的「第四大權力」。


    24 「大數據」另稱「巨量資料」、「海量資料」或「大資料」，是指資料量規模龐大，無法藉由人工擷取、處理或整理為人類所能解讀及利用的資訊。本文意指大量的客戶資料。


    而自民黨在重新取得執政權後，各界的陳情也紛至沓來。連被認為和權力無緣的風險資本⓪、投資基金等業界組織，如今也都組成協會，積極地與公部門、政治人物進行互動。因為，那些有權改變規章、稅制的政治權力者，對商業界有多重要，自然就不必多說了。無論是多少優質的模範企業，一旦不懂如何和權力打交道，收益就將因稅制或規章的變更，在一瞬間灰飛煙滅。雖然這只是「政治和商業權力掛鉤」的極端案例，接下來就讓我們來思考一下，公司內部權力和工作之間的關係。


    提升自我價值，權力自然向你靠攏

    常言道：一般日本組織即使沒有優秀的領導者，也無傷大雅。當然，也有像軟銀（Soft Bank）及優衣庫（UNIQLO）等這類公司，因經營者個性鮮明強烈，整個企業的命運都掌握在他們的領導中。在這種明顯「領導者主導一切」的公司，由於容易看見權力核心，便不易發生核心以外的權力鬥爭；而另一方面，以協調型經營團隊為主的組織，卻很可能在協調開始時，就產生權力鬥爭。將「協調」換個說法，那就是「政治」。協調互有差異的利害關係，就是政治在運作的事。因此，在選擇「協調型經營團隊」的過程中，便很有可能發生角力。在透過數字理解工作成效、決定員工去留的組織裡，人們忙著工作，政治角力、權力鬥爭等事情一點都不重要；但在不以數字，而以協調決定一切的組織，在協調過程中，便會發生許多權力鬥爭。由於基層員工太優秀，讓高層能夠安心而有閒暇專心地投入權力爭奪戰。儘管如此，一個組織之所以不致衰敗，其關鍵因素都是基層員工的優秀和勤奮，但這樣認真的人依然會被捲入權力鬥爭中。如前文所述，我目前在美國上市風險企業擔任戰略顧問，公司內部的人，並不玩爭權奪利的遊戲。最重要原因是：企業急速成長，所有人都非常忙碌。專注在權力鬥爭上需要耗費大量時間和精力，但在風險公司裡，根本沒有那樣的時間。無論基層或高層，有太多人因為沒有產值而離開公司，不僅高層主管忙於工作，無能也將導致企業凋零，因此他們根本沒時間，用爭權奪利來決定人員去留。

    在全球化和科技革新急速發展的現代社會，日本大企業也身處嚴峻的競爭，雖然不會發生權力鬥爭，但而今有餘力這麼做的組織，也不在少數。

    然而，我並不是要完全否定「權力」這個東西。當我們面對某些情況，仍然需要權力的加持，你並不需要刻意勉強自己違逆或疏遠它，但是是完全依賴權力而受其左右，風險及代價就太高了。你必須鍛鍊，讓自己進化到「即使沒有權力也能做事」的境界。當你能夠完成別人做不到的工作時，權力反而會朝你靠攏。


    25 風險資本（Venture Capital）是一種承擔高風險、謀求高回報的資本形態，它以私募方式募集資金，並以公司等組織形式設立，專門投資未上市的新興中小型企業，尤以新興高科技企業為主。


    > 軍無輜重則亡，無糧食則亡，無委積則亡。

    《孫子兵法．軍爭篇》


    有人說：不捲入權力鬥爭、能夠淡然處事的人最強，但我卻不這麼認為。雖然裝做「不沾鍋」也無妨，但我勸你最好別真的像隱士一樣遠離權力鬥爭。雖然也有些由不沾鍋組成的高風險企業，其成長速度穩固而強健，然而在人口逐漸減少，也代表著市場大餅縮水的日本，基本上，這些公司並無法急速成長。因【不沾鍋】雖輕鬆，卻什麼事都做不了此在風險企業中，這樣的公司並不多見。那麼，不就幾乎所有組織團體中，都必須上演權力鬥爭？要是組織的進步存在限制，內部鬥爭就會變得激烈，在互相爭奪縮水大餅的過程中，再沒有比爭權奪利更慘的了。


    「不沾鍋」雖輕鬆，卻什麼事都做不了


    32 不想沾鍋，那你得借重「組織的力量」，才有機會成大事


    善用權力，到達你最有利的位置


    人類的優異之處在於「組織力」。歷史上許多紀錄都說明，人類雖然無法以個體力量對付猛獸或與自然災害抗衡，但都懂得利用團體的力量及智慧獲取勝利。擁有足以構成組織的智慧，再將智慧和力量凝聚在組織中——這是人類的強大之處，即使在現今社會也是如此。雖然社會上並不是沒有「即使不打著公司招牌，也能活躍」的人才，但多數人


    事實上，過去是「天真率直政治人物」的我，也曾親眼目睹許多政治權力鬥爭下的蠢動，那些人拍馬屁、信口開河，我實在非常討厭他們，因而想要成為明哲保身的不沾鍋。然而，我卻因為這樣，完全無法工作，而開始參與權力鬥爭。結果，我確實感受到一個道理：為了實現真正想做的事情，還是有必須策動整個組織，因為手中要有權力，就什麼事都做不成了。即使有些天才光靠自己也能發揮才能，程度好得驚人，但大部分情況下，一個人的成就還是相當有限。


    都利用公司招牌來發揮自己的實力。就某種程度來說，雖然不被捲入組織的權力鬥爭，也能展現實力，但即使一直避開權力鬥爭，建立了和實力相當的地位，一旦站上工作舞台，要是不借重組織力量，其實也拿不出成果。一味迴避權力鬥爭，卻到了相當年紀才初次捲入，那才真的危險。到頭來，要是你想迴避那些權力爭奪戰，就必須擁有旁人無可取代的實力，並構築牢不可破的地位。無論什麼樣的人握有權力，只要能夠持續展現成績，讓別人認為「這個組織需要那樣伙的能力」，那麼即使你成了不沾鍋也無所謂，但多數的工作場合卻不是這樣。在多數情況下，組織即使少了你也完全不受影響，因為替代你的人也能做得好。一個天才創造的實績，有時可以被幾個普通人組成的團隊所取代。此外，即使擁有無可取代的實力，隨著物換星移，人們對實力的評價也可能改變，那樣的力量也將隨之削減。你應該伴裝自己是個不沾鍋、持續提升實力，私下則獲取權力鬥爭的資訊，關注最新情況；接著，時常掙磨「要...


