    \n## 第五章 攏絡對手之前，你要先學會包裝自己\n\n從給對方小小的贊同開始\n\n你是否有過這樣的經驗？因為害怕被某人討厭，言行舉止全都變得綁手綁腳，也經常觀察別人臉色、莫名地暗操心——現代人的壓力來源，就在於此。此時刻，雖然你不需要特地做讓人討厭的事，但也應該這樣想：「就算被討厭也沒辦法，因為那是他自己的情緒！」人只要有覺悟，壓力就會隨之消散，行動力也會增加；他人的情緒，你既無法控制，也\
