    微乎微乎，至於無形；神乎神乎，至於無聲。故能為敵之司

    《孫子兵法·虛實篇》


    # 第二章 11個戰略技巧，縱橫戰場輕而易舉


    分享一個我從前輩那裡聽到的絕妙建議吧。雖然我無法想像，但根據這位前輩所言，他原本是個「急驚風」。不僅富有正義感、能量充沛，尤其對當權者更是經常語帶挑釁。他經常說：「我沒什麼好失去的，所以啥都不怕啦！」他不僅實踐了「扶強扶弱」的理念，更有其他前輩這麼描述他：「就像是從依義電影中走出來的人物。」因此他對後輩的提攜，更是不遺餘力到令政界人士無法置信的地步。他照顧了許多多的後輩，包含我這個晚輩在內。更值得大書特書的是，他絕對不將那些協助當做自己的功勞。我曾經有幸和他一起工作，而這位前輩也是對外宣稱：那些功績都是我的。


    ## 11

    學會自我抽離，就能控制情緒


    # 善良者必懂的 49 個暗黑賽局


    前輩認清了「其實這個世界，並沒有如同倚義電影般的事情會發生」，他用的技巧就是「靈魂出竅」，也就是當自己生氣時，就脫離自己肉體、從上方看著自己，將意念集中在自己身上。當你突然像靈魂出竅一般將自己抽離，從上方端詳著「有對方、也有自己，雙方正要衝突」的畫面時，就能如同利用
    3D 視角般，讓時間暫時停止。

    於是，你將第一次體驗到「回歸自我」的感受。你瞬間看清「這下糟糕了」，會被對方討厭」、「眼下似乎要開戰了」的事實。從上方看著自己，便得以冷靜下來。

    一旦怒火攻心，便將自己抽離、從上方有如 3D 動畫般客觀地審視自己。要練習就這樣的技巧雖然耗時，不過只要練成了，就非常有效。時時刻刻練習，一切就會變自然了。

    而且，練成這個技能有不少好處，不只能用於「防止無謂之戰」，在需要「一決勝負」的時機，也能使用。

    比方說，在進行重要簡報時，你可以想像自己就是那個「坐在自己面前的聽


    # 第二章 11個戰略技巧，縱橫戰場輕而易舉


    > 勝可為也。敵雖眾，可使無鬥。 《孫子兵法．虛實篇》


    眾」，站在聽眾的立場聆聽自己，就能讓簡報變得順利。如此一來，你不僅完全不

    會緊張，也能一面理解重點、一面將熱情灌注其中，同時掌握整個演說場面，呈現

    一場完美的簡報。和重要的友人或交往對象一決勝負時，只要使出一「靈魂出竅」的

    技巧，就能冷靜地站在對方立場上觀察自己，進而控制自己的情緒。

    想要達到這種境界雖然需要一些練習，但這可是能夠讓你「釋放壓力、讚頌人

    生」的最佳武器，我真的非常推薦！有些人擁有「第三隻眼」，也就是一「看見自

    己」的第三隻眼，那麼也請你睜開第三隻眼，好好地察覺自己吧！


    ## 12

    別輕易劃分敵我關係，他其實沒有這麼討人厭


    要掌握人際關係，我希望你先瞭解一件事情，那就是｜不要有「敵人」這樣的想像。「把某人當做假想敵」，只在從事運動時適用；在現實社會中，你最好還是別輕易樹立敵人，這是千古不變的真理。
    我現在也是這樣，生活中有「敵人」這種東西。雖然全部的人都不是夥伴，生活也存在著競爭對手，但他們並不是我的「敵人」。你只要能將競爭對手也當做夥伴就行了。所謂「敵人」，是從「排斥」的想法建立起來的對象。說到底，不過就是自己心胸狹窄罷了，其實跟他們作對完全沒有好處。受旁人依賴、建立屬於自己的小圈圈，而喜愛爭奪勢力範圍的人，通常都為了增強圈子的向心力，而刻意樹立敵


    # 第二章 11個戰略技巧，縱橫戰場輕而易舉


    人。儘管這的確有必要，但身處瞬息萬變的時代，和「深化固定的交際關係」比起來，「無論是誰都能良好地應對」，反而是較佳的選項。

    比起固定而封閉的交際關係，不如與所有人都建立開闊的社交圈。雖然這有

    能被說是「見風轉舵」或「八面玲瓏」，但說就讓他們說吧。我認為這麽做能夠打

    造更加確實的人際網絡，所以請把它當做一件光榮的事情。

    樹立敵人或心裡覺得有難搞的對象，多半都是因為缺乏人生經驗，才會對別人

    產生有如偏見一般的刻板印象。只要人生經驗豐富，對人的好惡便會改變，對人也

    能有更深一層的理解；對周遭旁人的寬容程度，也將和經驗有同等比例的成長。

    即使對方難搞到讓你覺得他是敵人，但只要立刻試著和對方打交道，你將意外的

    地發現：其實他也沒有那麼討人厭。追根究柢來說，在想要讚頌僅有一次的寶貴人

    生時，你並沒有理由要積極討厭任何人。當然，你不需要勉強自己喜歡誰，但刻意

    厭惡他人、樹立敵手，也不是必要的。


    > 見勝不過眾人之所知，非善之善者也；戰勝而天下曰善，非善之善者也。

    《孫子兵法·形篇》


    # 第二章 11個戰略技巧，縱橫戰場輕而易舉


    假設，你有一個「為了達成目的，無論如何都想和他成為夥伴」的對象，但他就是不願意和你相處，該怎麼做好？終極的做法就是找出對方，和他商量「被人生討厭時的應對措施」，這個方法最有效。也就是說，將「對方對自己的厭惡」，當做是「他人對自己的厭惡」，向對方請教該如何應對。這可是相當高段的戰術！要是有探討你、刻意不理你、對你做出無理要求，或是排擠你，就試著去跟那個笨蛋商量「有人刻意不理我、排擠我、對我做出無理要求，要或...」，這樣就...了。這個做法非常有效。對方一方面會心頭一緊、一方面又會設身處地回答你。在那之後，他很有可能會下意識為了滿足那個答案的期待，進而修正對你的態度。你


    ## 13 被無視了怎麼辦？應該優先避免關係的惡化


    最好不要露出任何「這是在說你」的訊息，而是抱著誠意去找對方談心。就算是一個性陰沉的笨蛋，也一定會想：「這是在說我嗎？」事實上，這個技巧來自我的親身經歷，給我建議的，是某位頗具分量的政治人物。我不能過於描述細節，不過對當時的我來說，這個戰術確實奏效了。我非常小心地不讓它露餡，這真是我被逼到走投無路，才不得不使出的最後手段。想讓難搞的對手不再討厭自己，卻無法用一般方法度過難關時，我就會建議你這麼做。重點在於：在情況變得惡劣前，你都應該想辦法跟對方溝通。最糟糕的情況是你太害怕對方，即使到了必須對談的時刻，仍然不願和對方溝通。現今的日關係，便是最典型的例子，再沒有比「在最糟時期拒絕對談」還要糟糕的情況了。若在非常時刻不進行對話，雙方便會互相以「最壞的腳本」為前提，做先入為主的準備。無論人際關係或國家關係，只要彼此開始以「最壞的腳本」為前提，情勢很可能變得更嚴峻。前陣子，日本首相安倍晉三為了修補中、日兩國關係，派遣自民黨副總裁高村正彥等人，以特使身分出使中國。當時透過中國世襲幹部「太子黨」的人脈，開啟進行對談，這個安排相當值得肯定。即使是二〇一四年三月的烏克蘭危機，美俄關係緊張，兩國高層人士的溝通仍然緊緊相扣。俄羅斯總統普丁和美國總統歐巴馬在政治立場上，雖然明顯沒有共識，但仍舊持續進行了較平時更為密切的對談。此外同年六月，雙方在出席二次世界大戰歐陸戰場諾曼第登陸
    (Invasion of Normandy) 七十週年紀念典禮後，也針對烏克蘭情勢進行了簡短的私人會晤。即他們表面上談論的內容沒有什麼變化，卻透過語調、神色進行了充分溝通。對方究竟有多認真？有多少意願讓步？還是完全沒有意願？就結果而論，雖是普丁嗅出了歐巴馬的消極而採取行動，但幸虧並沒有演變成因溝通不足，而造成過度解讀的「惡性循環」，也沒有發生令世人恐懼的最壞衝突。未來的雙方情勢雖然無法預測，但正因為發生了這些危機，不只是歐巴馬，包含歐美諸國都透露各種管道和俄羅斯持續溝通。
    ⑩ 太子黨是中國帝制時期產生的特有政治名詞，現今專指和統治階層有親緣關係，進而獲取重要職位的人。常用於政治評論文章中，因此一般認為含有貶意。

    '
