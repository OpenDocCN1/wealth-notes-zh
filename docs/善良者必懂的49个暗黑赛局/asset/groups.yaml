    # 第二章 11 個戰略技巧，縱橫戰場輕而易舉


    在本书中，我要阐述「华丽地避免无谓之战」的论点。生气了，不和笨蛋正面交锋，而是善用笨蛋的力量来撃倒笨蛋，将情势转为有利於自己的局面，加倍地予以奉还——这就是我想说的。然而，在这漫长、只有一次的宝贵人生中，有时你也会碰到无法华丽回避战局的时候，总有那么一刻，你必须堂堂正正和对方一较高下，非分出个胜负不可。「避免和笨蛋交手」很重要，应當迎战的那些「有迎战意义」的对手。然而一味地回避，却可能让你在紧要关头忘了如何战阙，所以你最好记住：有时你也需要和人对战。情况且，人是一种没嚐到苦果，就无法刻骨铭心的动物。「和笨蛋交戰」這回


