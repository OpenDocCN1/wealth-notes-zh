    得意淡然，失意泰然


    我最尊敬的是家人，但除了家人，最讓我敬重、想要學習的，還是政治圈的大前輩們。值得敬重的前輩為數眾多，但名列我心中第一的，是那位被稱為「參議院自民黨領袖」的重量級議員——青木幹雄先生。其實當時我曾因為許多事，而對他十分反感；但在離開政治界後回首過往，讓我最感謝的，就是青木先生了。特別讓我印象深刻的，就是他曾經說過：「對任何事都不要有太大的情緒反應，時時淡然以對，才能迎向勝利。」對我而言，青木幹雄先生在許多方面都是我的前輩，因此我尊稱他為「青木老師」。他是一位處事淡然的人。當時我年屆三十餘歲，是個精力旺盛的新社議員，青木老師雖然德高望重，但我卻對他總是面無表情、不回應媒體的態度不甚苟同。然而現在，我卻認定為他的「淡定自若、漫不經心」，正是最強大的武器。青木老師即使離開政治界，也沒有絲毫戀棧，我相信他的力量泉源，就是那份「淡然」—得意淡然，失意泰然。日日夜夜在鬥爭權力的政治圈生存，有好事發生，自然也有壞事多磨。發生了好事沉著以對；相反地，遇上了衝擊，也能冷靜坦然。正因如此，他才能夠有「不失去自我」的宏大氣度。當時我常被媒體吹捧、也會上綜藝節目或政論節目參加錄影，對青木老師的作為風，相當不以為然。他曾經告訴我：「因為媒體、錄影那些東西而備受矚目，其實跟政治一點都無關，搞不好哪天你還會被媒體利用，狠狠地絆你一跤。」儘管青木老師是那麼知名的人物，卻不接受媒體專訪，無論有多少麥克風擠上前來，他也絲毫不予理睬、揚長而去；甚至面對恭敬有禮的對談，也不做何回應。我認為他的那份「安定感」，就是長期擁有力量的祕訣。青木老師身為政治人物卻不高調，完全不上媒體、也不過奢華的生活；他現如何在喝的酒跟擔任祕書時期完


