    # 善良者必懂的 49 個暗黑賽局


    要使用它以花式滑冰、冰壺和冰上曲棍球和世界競爭！練習那些運動不僅曠日費時，而且當時全國各地也陸續停止花式滑冰的訓練；擁有實力、也有贊助者，但要時，是沒能發揮實力，再怎麼喜歡花式滑冰，也難以持續。許多選手在訪談時，總是一再強調「我打從心底喜歡滑冰」，但我想他們要以那樣的程度繼續練習，可能會相當痛苦，也可能變得討厭滑冰。看見像這些運動選手一樣，找到「自己想做的事」的人，或許你會羨慕，但喜歡棒球、足球、花式滑冰等運動，同時也成為頂尖選手的人，總有一天也將面臨無法持續的局面；儘管他們找到想做的事，能做的時間卻相當有限。比如說可能因為受傷、年齡或成績，而不得就此引退，無法仰賴這些夢想繼續生活。此外，清楚自己想做什麼事的人，當夢想被奪走時，所受的打擊更是巨大。這時，他們就會像還搞不清楚自己想要什麼的人一樣煩惱——不，應該是更加煩惱「接下來要做什麼」吧。正因如此，我認為「意圖尋找夢想」，實在浪費時間和精力；比起尋找夢想，更重要的是必須傾注全力在眼前的事物上。念書也好、工作也罷，你都該試著投身於目前的事情；而哭著要糖吃、什麼事都不願意盡力，無論對時間或精力，都是最大的浪費。

    我說過許多次，從浩瀚宇宙來看，所謂「僅此一次的人生」，是彷如奇蹟一般的存在，因此你非得珍惜手中的時間和精力不可。

    當你老想著「我本來沒有那個打算……」，或是持續尋找夢想，但一日回過神來，才發現人生的寶貴光陰已經虛度一空，這不是很可惜嗎？

    與其擁有這樣的遺憾，不如認為「擁有人生即是一大幸福」，如此心存感激還來得更好。當我愈是和生物學家、宇宙物理學家會面探討，愈能重新認識這個世界｜大爆炸推動了太陽系的誕生，太陽系中又誕生了適合生物居住的地球，地球又孕育了生命，接著我們又能以人類之姿存活至今｜於是我徹底明白了，人類身處於宇宙之中，是件多麼寶貴的事。

    沒有人一生都值得羨慕。我見過許多「成功人士」，其中不乏有錢也過得相當不幸的人，從出生以來便活在鎂光燈底下，無法擁有自己的人生；為了喜歡的事任性妄為地追求，最後家道中落而淒清孤寂等。


    沒有人能夠得手一切，又永遠擁有。人生原本就是高低起伏，正因那些高山和低谷，生活才有歡欣雀躍，同時又必須隨時敦促自己。超過了山谷，我們才能成長，進一步增加人生的厚度。能夠和自己有如至寶一般的人生相遇，你只能竭盡全力地發揮它的極大值；同時能夠誕生在這世上心懷感激，努力為眼前事物盡力而為，從此開拓出屬於你的康莊大道。過去我雖是無可奈何地離開政治界，但回首自己曾有的悔恨，並和過去的自己和解，而後感謝生命給我的考驗，才一心一意地拚命奮鬥至今。在這過程中，我遇見許多少重要的人，也獲得了在政治界想都沒想過、仿佛教寶物一般的機會。或許事情並不一定能如預期般發展，但只要持續為人生拚搏，比起預測未來，將有更多意想不到的好事會發生。在眼前的事物上竭力賣命，或許會有甚麼新的發展。況且原本認為不喜歡、不適合的事物，你也能哪天突然發現自己其實很喜歡，或是逐漸愛上也說不定。你現在做的事，都是由自己接連判斷及決定累積的結果，現在的工作如此，學校的課業亦是如此。那麽，或許你是下意識選擇了自己所愛，眼前的事物也許正是


    # 終章 不要小看自己，你就能成為「蟻局」裡最強的操縱人！


    > 以近待遠，以佚待勞，以飽待飢，此治力者也。

    《孫子兵法．軍爭篇》


    你心中的所屬。與其尋找自己想做什麼，不如傾注心力鑽研現在做的，我想這會是更高段的人生哲學。

    人生會如何發展？沒有人知道。在二〇一四年奧斯卡金像獎的九部入圍影片中，有六部都是根據真實故事改編。真實事件遠比小說更不可思議，儘管人類擁有無限的想像力，但人生為我們預備的，卻遠遠超過了想像。你能和現在的工作相遇，是多麼難能可貴的緣分，別自甘墮落、更別灰心喪志，請懷著感激之情，卯足全力活下去！


    # 結語

    別執著於小戰，你該在大戰中獲勝


    儘管令人感到遺憾，但日本從現在起，面臨嚴峻時代的最大問題，就是「人口減少」。日本會開始接受外國人口嗎？或是「貫徹」純血主義」，選擇通常在衰敗的道略？無論哪一種應對方式，日本都不再是那個「國人歌頌的愜意日本」了。科技進步、氣候變化，加諸東亞在地緣政治上的不穩定因素，我們的人生都將無法再像過去一般舒適愉快。為了傳達自己預見的世界觀，同時盡可能讓各位能勇於面對此後的將來，並且防患未然，我寫下了這本書。無論生在哪個時代，人生都是上天賜予的寶物。科學持續解開各種謎團，告訴我們生命在這浩瀚宇宙中誕生的機率極其稀少，而其中僅僅人類能夠意識到生命的寶貴、成為有智慧的生物。雖然我無法判斷這樣的能力是好是壞，但這機率簡單直是


    # 結語 別執著於小戰，你該在大戰中獲勝


    微乎其微。在寶貴人生中，能夠有所獲得的我們，又是何等幸運。因此，希望你能有計畫地準備、有意識地運用人生——我如此衷心地盼望著。別將可貴的人生浪擲在無聊的對戰上。每當「加倍奉還」、「我會復仇的」等這類詞彙開始流行，儘管有點多管閒事，我都忍不住希望大家別和那樣的人打交道。那一些在日劇裡被稱為「顏藝」⑧的演員表情，雖是一種表演藝術，但在一般社會中，那樣過度反應的人多半成了大事。為了那樣瑣碎的小事，而讓心情反覆不定，反而會讓我們因累積壓力而生病。情緒反覆無常會令人感到厭倦，那樣的人缺乏意志力、毫無安全感，也難以使對方信服，全都是些沒好處的壞事。為了盡情讚頌人生，你需要淡然的生活態度。雖是雲淡風輕，卻也以不同角度來看待世界的本質。希望你能善用尖酸刻薄的想法，策略性地生存下去。大腦是你全身上下唯一「愈用愈靈光」的器官，其他器官都會因長久使用而疲軟老化，容易成為疾病的肇因。別做坦率、單純而正直的人，要尖酸、刻薄又辛辣！可千萬別想以牙還牙，當你被擱了一道，更要讓那個人心情愉悅，為了自己而將他擊倒｜這才是真正的加倍奉還。別為小戰而情緒反覆，你該在大戰中獲勝，以淡然並具有策略性的態度生存。若能讚頌自己的人生，也就是思考生命的最後一瞬，現在你所經歷的好事、壞事，全都只是人生的過程片段｜「得意淡然，失意泰然」方為上策。只有擁有「讚頌人生、發揮極大值」的生命觀點，你就一定能夠拋棄那無聊至極的自尊心。你應該思考「如何能有自主性地度過人生難關」。為了人生而參考他人評價雖然有其意義，但被那些評價和自尊心要得團團轉，可就本末倒置了。在找到想做的事情之前，先在眼前的事物上確實努力、展現成果。因為現在你在眼前的事物，很有可能蘊含自己下意識選擇的「夢想」。若能熱中於此，就能看見許多不同的可能；比起兀自煩惱、硬要拿出拚勁，倒不如完全投身其中。而最重要的是，你必須瞭解：人生原本就是荒謬而毫無道理。與其說是「毫無道理」，不如說是「這世界本來就不會如你所願」。從今而後，過去未曾發生過的變動，可能會急遽產生，變得更加令人匪夷所思。只是，要是一開始認為某事荒謬，你也別大動肝火。在荒謬中仍能展現成果的人，很有可能都是在我們看不見之處勤奮、淡然地持續努力，因而累積驚人的成績。讓情緒輕易受他人影響實在沒有絲毫好處，比起這些雞毛蒜皮的小事，難道你不該平穩情緒、處事淡然，盡可能不輕易動怒且不隨意和榮蛋交戰，同時盡情發揮生命價值，好像珍惜如同一寶物一般的人生嗎？這僅是我淺見，若能將這份心思傳達一丁點給你，便是我莫大的快樂。最後，沒有生命中許多貴人，就沒有這本書誕生，儘管書中仍有一些我自己都還無法實踐的事，我仍要向許多人致上誠摯謝意｜包含儘管造成他們很多困擾，依然包容我、守護且養育我成長的家人，以及本書中提及的貴人，還有雖沒能在書中提及、卻教導我許多人生命道理的朋友，真的非常感謝你們！


