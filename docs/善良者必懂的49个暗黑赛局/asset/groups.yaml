    ### 看清「沉沒成本」，避免傷害擴大


    所謂「沉沒成本」，簡單來說就是「覆水難收」的概念。在許多組織或團體中，普遍都有不夠理解沉沒成本的問題。舉個例子來說，某個已經投資一百億元的技術，雖然投資時間點正確，但後來該業界發生技術變革，使得原本投資重金的技術，已經不再需要了。儘管如此，公司卻因為「投入了一百億元太可惜」，而在早已過時的無用技術上，持續投入資金。就好像這樣，很多企業實在不善於揮別已成往事的過去。站在商業角度上，一百億元造成的傷口，應該立即止血才是。一味地糾結在過


    ## 第一章 4 種容易被「黑」的狀態，你得避免交鋒！


    去、不停追加資金，導致更深的缺口，簡直是愚蠢至極的行為。你不應該執著過去、損耗未來！


    我也曾經因時代劇中，「孩子為了雙親莫名被殺，一心想著復仇而活到今天」的故事情節，而大受感動。如此美談佳話，是所有人共同的回憶。但如果換個角度想，或許被殺的雙親並不希望孩子將寶貴人生浪費在復仇上。與其期待他們藉由不知是否能獲勝的決鬥，來消除恨意，父母其實更盼望孩子獲得成功，不是嗎？


    負面的執念，將使自己變得更加負面。這不僅完全無法為你和身邊的人帶來快樂，更會因為滿懷憎恨、一心想著加倍奉還，而浪費大量時間和精力。即使報復成...功了，對方又反而將你一軍，結果可能造成更加倍的痛苦。生活中難免會發生小爭執，最重要是「不要在意」。就算你反擊對方，對方也只會恨你，造成再次的復仇，這可能會讓你喪失更多機會。


    ### 考慮「時間價值」，別對他人過於執著


    無論做什麼事，請隨時將意識聚焦在自己的「時間價值」上。如果有一個小時，就該想想「我能用這段時間做些什麼？」有時間煩惱人際關係而焦躁不安，不如用那些時間去讀英文、提升商業技能，或是和親好友共度美好時光。為養精蓄銳而放鬆心情、專注在興趣上，反而更有意義。


    人生雖然長，但要是不懂得善用時間，那麼人生可就短到不能再短了。對他人過於執著的人，並沒有考慮時間成本的重要性，也就是根本忽略了自己的時間價值，才會虛度光陰。


    如果你能想著：「好好運用時間，能夠產生多少價值？」我想你就會明白「把時間花在和敗類交手上」，有多少浪費生命了。沉溺在憤怒當中、忙著和他人較勁、多管他人閒事……都是絲毫不明白時間價值的最佳寫照。人生中最重要的資源，就是「時間」。有了時間，「價值」才得以應運而生。


