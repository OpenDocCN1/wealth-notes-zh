    ### 05

    不打無謂之仗，能不戰而勝的才是贏家


    現今廣受全世界領導者歡迎的《孫子兵法》，是一部「不打無謂之仗」的集大成作品，其中有一條用兵法則：「若有敵方十倍戰力，應將其四面包圍；若有五倍戰力，就集中力量予以攻擊。」「在戰場上，若你握有對方的五倍戰力，起初好戰並無傷大雅，避免毫無勝算的戰役、創造壓倒性勝利的情勢，便能不戰而勝。」


    這種戰術的實踐，其實我們在動物世界裡也能窺知一二。在牠們的世界裡，似乎只有強者才能生存，然而這卻是大錯特錯！事實上，「能夠適應環境的動物」，才能真正生存。在相同物種當中，並非體型龐大的好戰者才能夠活下來。動物的智能否豈然不如人類，但或許比人類更有智慧。曾有一場使用蟾蜍進行的生存實驗，其結果相當令人玩味。比起個性好戰的蟾


    ## 第二章 11 個戰略技巧，縱橫戰場輕而易舉


    蜍，膽怯而逃避戰鬥的蟾蜍，反而生存率較高。避免魯莽輕率的戰爭、充分保存體力、維護身體健康，這樣的蟾蜍得以生存，可以緊緊抓住和雌性接觸的機會，因而能夠留下更多後代。


    在爭奪勢力範圍或異性的戰場上，樂於戰鬥而不謹慎的生物，容易因好戰而使身體困乏。經常在戰場上受傷，更容易受到其他不帶傷、或較年輕的個體挑戰。此外，像黑猩猩這類高等生物的群體，也和人類世界相同，若有單一個體被認為礙眼，便有可能遭受集體暴力而被殺害。


    在被認為激進分子較多的歐美國家，過於好戰的人都難以有良好聲譽。儘管好萊塢電影中，總在各行各業中活躍的主角和對手、上司發生激烈衝突，但這些都是因為在現實生活中相當罕見，才會成為電影和連續劇的情節。過度以自我為中心、過於情緒化的人，在商場上都容易被貼上「不成熟」的標籤。


    身在這場稱為「人生」的生存遊戲中，避免貿然戰爭的人能夠擁有較好的發展。如此生存之道，無論在動物世界或人類世界中，都恰好不謀而合。


