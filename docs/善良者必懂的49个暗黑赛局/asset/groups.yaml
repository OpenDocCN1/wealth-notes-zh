    會而努力奮鬥」的偉大情操。堅持意念、舒緩壓力，便能以自己的步調，讓局勢變得更加如你所願。與其吵著要那些吃不到的糖、浪費時間和精力、甚至徒增壓力，都不如專注埋首於眼前的事物。就算是只有那麼一點點，也請你將時間和精力投注在自己和周遭人身上，讓一切都變得更愉快！


