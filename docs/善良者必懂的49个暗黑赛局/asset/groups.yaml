    # 明白人生有限，才懂得生命可貴


    為了有效運用有限人生，我是這麼做的：充分理解人生的有限，同時明白人生的稀少性⑫。有不少人篤信宗教的人，認為「人生並非只有一次」。也許真的有輪迴轉世，但那不僅感受不夠真實，即使能轉世，現在你我活著的人生僅有一次，卻也是不爭的事實。

    現在的人生，是祖先將生命延續至今的重要資產。我們的祖先是經過種種自然災害、戰爭和疾病考驗，才能將「生命接力棒」交到子孫手中。

    更宏觀地看，在這存在了一百七十三億年的浩瀚宇宙中，竟有像地球這般無論氣溫或重力等因素，都適合生物生存的環境；即使生物能夠奇蹟生存，更要耗費數十億年光陰，才能讓「擁有人生意識的人類」，費盡千辛萬苦生存至今，這更是如同奇蹟般不可思議。

    而我們，就存在這彷如奇蹟的命運機緣中。拜醫療等科學技術發達所賜，從今而後人類將變得更長壽，但無論如何都有走到生命盡頭的那一天。（我一向尊崇的未來學家）雷蒙德·庫茨魏爾曾說：「人類可能永生不死」，但誰知道呢？

    我有這些朋友和認識的人，明白還很年輕，卻因疾病或意外而喪失了性命，果然人生根本毫無道理可言。他們明明那麼認真、勤快地為他人活著，卻比我們早一步離開了。「為什麼那樣真誠老實的人先走了，老是不講理的自私老頭卻還活蹦亂跳？」想來就讓人感到悲痛不已。

    那個懷抱著「要成為日本和世界橋樑」的崇高目標，即使病魔纏身仍不倖處理


