  md: '# # 22 | 家族：传统大家庭究竟谁说了算？


    如果你看过小说或者影视剧《白鹿原》，应该能体会到家族在传统社会有多重要。


    在古代中国，举凡不乡下，行政权力只到县一级。在基层社会，由系入联人家的组织，就是一个个家族。家族，另一个是士绅。《白鹿原》里，白嘉轩是白鹿原的乡长约。陈忠实是乡绅，维系的是血缘关系；朱先生是读书人，代表士绅，维系道德关系。


    这一讲我先来说一说家族。它是渗透到社会毛细血管的基本单位，决定了每个人最底层的身份认同和文化认同。


    # ## 家族的稳定


    先问你一个问题：在你家里，谁说了算？我想，每个人的答案，一定不一样。有一个说法，过去的，如的小家底重商。不一定就是老公，也未必是老婆，而是谁的辈分大，谁说了算！在在在古代中国的家族里面，答案一定是：辈分高的代长了家。


    现代的小家庭以夫妻关系为主轴，传统的大家庭以父子关系为主轴。一个大家庭，世代住在一共一个宅子中。在同一个祠堂、私塾里共读，有自己的形貌、公家的账、私契和旧田。好多大家族住在同一个大院里，在经济圈不太大，据说，唐宋时期江
    州有一个姓王家的人家，号称“天下第一 门”，每餐开饭，一人不到，全族等候， 连家禽的鸡，也要等所有的狗到齐之后才 开始用餐。


    规模如此大、纪律如家森严的家族，最有权威的自然是谁当上最老的长老了。中国是一个农耕社会，什么时候播种、收割、 天上出现了什么、天上下了什么雨，全 看祖辈辈辈口口相传，积累下来的老经验。最有经验的人自然是最年长的长老了。


    而且，农耕文明，长期定居，产生了稳定的宗法制度，家族成员的关系非常牢固。一个家族里最有经验的人长期在里头，自然而然会成为家族里最有权威、最有权势的人。已金小说《家人》里面的老高太爷就是这样一个个“不三的老长。


    儒家的伦理讲“上善孝为先”。孝顺是 对长辈权威的绝对尊重，是中国人的第一 美德。儒家家庭伦理当中贯穿一个核心 原则，就是对家势高的人，不管是父亲、兄长都要绝对服从。


    那么家族内部大家要服从的对象一定是男性吗？其实不一定。有女权主义者向我们 评问：中国古代女性，我们女性问她们一 个问题《红楼梦》里面的贾母，最最高 威望的人物是谁？当然是贾母。贾政那是
    自己儿子，当然也要一起敬个，子女只 能跪着下头。因为贾母辈分最高，她是 家族最尊贵的人物象征，不管这个人形象 的肉身是男性还是女性。


    # ## 家族的发展


    一个家族除了需要稳定，肯定还想要延伸、发展。家族绵延最重要的当然后就是 继承人，所以中国人特别重视生儿子， 保证血脉延续。家族的发展就扩大自己的 势力，在家族格局中，大范围的圈子可以像滚雪一样一层层扩展出去。家族的扩展
    也一样，就是把自己做大。 有三种方式：嫡亲、拟血和地缘。


    先说第一个嫡亲，就是通婚。家族之间通 过儿女婚姻关系，跟其他家族建立亲缘关系。传统的中国婚姻，不许自由恋爱，由父母 包办。男女婚姻大当与的变婚无关，是一种家族网络的外围布局。


    所以古人结婚讲究门当户对。什么才叫门 当户对？你可能以为的有钱有权地位显 赫。不一定。毛耀先生有一个很精到的 看法，他认为，中国没有阶级，只有阶层。他的意思是说，宋代以后，虽然阶层一再
    固化，但是各个社会阶层都有自己独特的 文化品位，这就叫成流品。社会，可以 说是按能门当户对分阶层古代的，


    士族，文人女士大夫身穿长衫、举文 墨，整天手之子，眼全都在大田里干活的 农民在文化气质上当然格格不入。所以 鲁迅会说《红楼梦》里的焦大不会爱上 林妹妹。所谓的门当户对，不只是给对方
    跟自己是不是处于同一个阶层，更 看能否 气相投，有共同的文化流品。


    家族扩张的第二种方式，是跟其他家族建立拟血缘关系。你想想，为什么中国的男人称母亲家亲戚就叫舅舅、舅父，而女子之间一旦有点关系就拜把子叫姐妹？当然， 还有的人会拜干爹、干妈。今天，这可能都
    是个人行为，但放在古代，多半是为了 家族扩大势力，把两个不相干的家庭，组成一个拟血缘共同体。


    不过，婚姻、拟血缘关系的扩张毕竟有 限，你不可能把邻国同乡一并打包尽。 所 以，还需要进一步扩展，就要靠第三个 方式：乡缘关系。


    你要知道，在差序格局社会里，乡缘与 血缘是两个不同的层级，家乡和乡缘，乡 缘是血缘关系的扩大层。家乡一乡，乡 缘是家的扩大圈。你一定记得我在中国西 封建制度的时候，讲过“家国天下”，这个概
    念。家族是一个以同一个血缘关系共同体 为基础，后来社会流动性增加了，外姓 人 加人了，于是共同体就仅仅局限在同一 地方，是“家国天下”的家族，不仅包括 的家族，也包括你的家乡。


    中国人讲究籍贯就是在这个原因。老 百姓的祖先早就离开了老家好几代也没 再考回家乡了，但你的籍贯也是你的老 家。周恩来总理出生在江苏淮安，但他 是籍天津人，因为家乡是天津。我
    是绍兴人！因为家乡是我祖父迁居 中国人的乡乡籍贯意识，轻易并非到。一旦同一个地方的人在异地他乡碰到一起，就会像见到家人一样亲近。第一分钟会说老乡，第二分钟说老乡，第三分钟
    立马会结乡缘共同体。


    中国官场中有一种乡党政治，同一个 地方出身的官员结为乡族，争辩延城中大官 作为乡族政治，相互提携，谋取利益，同 时的诋毁和互相揭短。在中国官场里面， 乡党的内聚力，要远远超过纯粹的利关系
    问题。


    你想想，什么唐太学唐伯虎大儒怪 意？某类像是近代，是唐太学唐伯虎 大 太 大 儒怪 意，而唐代的统治者属于军 集团，所以唐太宗不可能对魏征有些 气 唐 代
    初 年 太 宗 唐 太 学 不 能 大 理 于 下 游，还 有 地 方 的 官 在 黄 河 中 游 或 西 区 的 地 方，同一在黄河中 游 地 区， 同
    的 乡 缘 意 识， 形 成 了 官 场 上 阵 营 分 明 的 对 立。


    身份认同和文化认同，首先要回答的问题就是，你是从哪里来？说的就是家族和家乡。只有知道从从哪里来，你才 会明白：我是谁？将到哪里去？


    # ## 今日得到


    家族是古代社会基本单位。一个家族想要发展，就要不断扩展自己的范围，从血源延伸到缘续，再到地缘。古代中国人就生活在这样“以家族为中心、层层外推的关系 网络之中。


    # ## 今日思考


    这种关系网络就像一张巨大的蜘蛛网，每个人都困在其中，虽然有安全感，得到了家族的庇护，同时也失去了个人的自由。


    这到了近世，散落的年轻人一个愿望，就是希望冲破这个网，从家庭和家乡走出，到城市去寻找个人。空间，你来了大都市以后，每个人真的能摆脱血缘和地缘的网络吗？


    +   - 1. 家族是渗透到社会毛细血管的基本单位，决定了每个人最底层的身份认同和文化认同。

    - 2. 家族扩张的方式，就是把自己做大，主要有三个方式：嫡亲、拟血缘和地缘。'
