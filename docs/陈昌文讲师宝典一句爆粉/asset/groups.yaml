    有食物，在正确的路上有饭吃，你才会真正的快乐。而且，走对路了，一定有饭吃，如果道上没饭吃，就说明你走错了。有钱，有变现，就有道。没钱，没变现，就无道。做起来不快乐。你的一切目的，都是赚钱、变现，只有这样，你才会快乐。如果你的利润下滑，即便是你的抖音粉丝多，每天都直播，你也很难快乐。


