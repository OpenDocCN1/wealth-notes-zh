    ## 第八章 陈昌文读书会 公开课•做一个真人


    > 全都是真的，咱不玩虚的，这个就是道。真了就是道，真说真干。

    >

    > ——陈昌文


    ### ●人生的一个重要课题就是要隔离坏人


    今天晚上我主要给大家讲一些道的东西，这个道是怎么牵引我们去赚钱的？还有就是我是怎么样去驾驭社群的？


    我们社群也不小，读书会有一万人，我们陈昌文老板社群差不多也有一万人。只是你们看到我有一个3000人的这个群，其实我做了很多个群，那么这个团队是怎么样去驾驭的？


    首先呢，我的道场不要垃圾人，我希望你们也做到，你们的道场也不要垃圾人。我其实蛮温柔的，但是我觉得错了，我想你们的人生当中也因为你们的软弱和温柔，让那些坏人伤害了你们，是不是？你们的人生当中也因为你们的软弱和纵容，导致那些坏人去伤害你们。


    比如说有人找你们借钱啦，比如说你的对象伤害你啦，比如说你管理团队这些人他不听话，错的他还去做。这些人都要把他踢了。有人骗你，我们都把他踢了。


    如果你聪明的话，你就能听到我现在讲的东西，依然非常的重要。我也在成长。以前我纵容了很多人，以后我再也不会纵容人。纵容别人，看似善良，实际上你在害自己，也在害别人。


    以前我们的团队小，我们影响的人少，所以我们觉得纵容别人只害自己。但现在我们的团队很大了，你看现在来听课的有两千多人，对吧？那如果我们再纵容坏人，其实是害人害己。所以说随着我们影响力越大、团队越大，自己的地位越高，我们更要要把坏人赶走。人生的一个重要课题就是要隔离坏人。


    ### ●人在这个社会上最重要的事情就是只关注富人，你就会成为富人


    不管你有没有在我们的高级群，或者是你做你自己的生意，我希望你们都去玩抖音。为什么我希望你们都去玩抖音，有没有人知道？我上一次公开课也讲过，因为现在抖音是最大的流量平台，是最赚钱的，所以如果你还不懂，你一定要去玩，至于你做什么生意，那是你自己的事情。


    那么我的生意就是陈昌文老板社群和这个读书会，我只带着我的高级群的人在做这个生意。我们认为这个生意蛮有前途的，所以我们一直在做这个生意。所以我也希望你们去玩抖音，有缘，跟着我玩，没缘，你自己去玩你自己的。


    当然我只服务年纯利润过一百万的企业家、美女老板，我只服务非常有钱的人，那我也希望你们也养成这个习惯，只服务非常有钱的人。


    我告诉你，这是我经商很多年，可以说我前面这三十几年的人生总结。我服务过没钱的，服务过稍微有一点钱的，服务过非常有钱的人，所以最终我的结论是只服务非常有钱的人。


    只要这个人没有钱，我一定把他拉黑，不跟他说话，不服务他，不给他讲课。因为钱代表一个人的素质，所以我只要发现你没钱，素质低、智商低，我就建议管理员把你踢了，我不跟你纠缠。只要我发现你不对，我就不跟你纠缠。所以人在这个社会上最重要的事情就是只关注富人，你就会成为富人，不要去关注负面的人物。人最宝贵的是你的精力。


    其实儒家思想《论语》当中，孔子收弟子，他也收了很多王公贵族，像季氏的子孙跟着孔子学习，孔子要的是自行束脩以上，现在大家买一块肉很便宜，但在孔子那个时代，生产力是很弱的，要吃到十条肉干是很难的。十条肉干能送人，这个是一大笔财富，可不是小钱。如果你们有记忆的话，那么在我们国家二三十年、三四十年前、五十年前，牛肉都没得吃。我告诉你，除非那个牛老死了，病死了，或者摔死了。偷牛都是犯法的。吃牛，打死牛，你都会非常的惨。就是在国家刚开始的时候，这个大家应该有耳闻吧。


    那么在我们小时候，比如说我那个年代，七八岁、十岁，我家是农村的，一周能吃一回肉。就算你这个家庭过得非常好的了。有这个记忆吗？


    有些人说，孔子收的这个肉干是很便宜的，我告诉你，错了，这是很贵的学费。在两千年以前能交得起十条肉干，是很贵的。所以孔子他讲的是帝王术，也是讲给贵人听的。


    所以我们有一句话叫做，得天下英才而育之。


    那么我们做老板的，我们的合伙人、我们的客户和我们的员工，必须是英才，而不是蠢材。蠢材没有教育的价值，没有交往的价值。


    ### ●种善因，就是你赚钱的原因，就是你人生变好的原因


    今天主题，讲一些道与术的结合。那么我的道呢，就是儒释道，多讲一些儒家思想。我是研究佛学、道家思想和儒家思想的，研究了很多年。


    大家现在再做一个动作，打开微博，搜索“陈昌文”，我会讲我微博上的一些东西，虽然写的很短，你不知道什么意思，但我要给你讲，这个很重要。


    我今天11点39分发了一条微博，叫恶有恶报。大家去给这条微博做一下转赞评。


    我这个微博，恶有恶报，这一句话转赞评，有多少人做了这个动作？虽然我们这里有两千人，但是去行动的还是非常少。没有行动力也是你人生失败的原因，理解吧？这一句话也特别的重要。道呢，就是老生常谈，行动力。我在给你讲课，我是要付出时间、精力的，我还要备课。但是我让你给我转赞助一下，你都不愿意，理解吧？


    那么同样我让你去玩抖音，拍视频，做直播，你也不愿意的，因为你没有行动力，你认为这件事情只对别人有好处，对你没有好处。


    我带的人很多了啊，几千人，甚至上万人，我带了这么大的一个团队，为什么成功的人少？为什么大部分人都失败？因为他没有行动力。


    所以我们这个书的编辑讲了一句话，她讲了一个故事，在我们高级群里都有她的录音。她讲的唯一的一次内部课，她讲了一个很重要的点，就是小时候她爸爸每年要给这个家庭开年终总结会，这个年终总结是：今年你都干成了啥？不是我计划要做什么，我想要干什么，不讲我的梦想，不讲我的计划，不讲我想要干什么，而是讲我今年做成了什么，就是行动，这也是一个人能成功的核心。


    就是我做成了什么，而不是我想要干什么。所以我们每天要总结，我今天干成了什么。比如说现在抖音流量大，最赚钱。我今天拍了几个视频，我今天开了几个小时直播，我今天跟几个粉丝互动了。这个是一个个人成功的核心。


    我讲的都很朴实，也很简单。我希望你们听到就去做，我告诉你，我的课是直接落地的，你听了就能干。做了什么？而不是我想要干什么。这是一个人成功的核心。


    恶有恶报，善有善报，不是不报，时候未到。万法皆空，因果不空。


    一个人得病就是因为他种了病因。有人骂你，也是因为你种了别人骂你的因。所以有人骂我，或者说我得病了，我从来不难过，虽然痛苦，但我从来不难过，因为我知道这是我自已种出来的。


    所以接下来这一句话就很有意思了，如果你赚不到钱，你收入低，人家收入高，那也是他自己种的因。所以高手都是时刻刻划种善因，这个也是道。如果你家徒四壁，或者你今年生意下滑，那么有的人的生意在上升，也是因为他种的是善因。


    我最喜欢讲的一句话是什么？


    我最喜欢讲的一句话是，改变一个人的念头，改变自已的念头，这个是最大的种福报的东西。这个念头你不是很善的？这个念头是善的，那你整个人情绪，你的基因序列都会改变，人的整个健康状态、整个循环系统都会改变。就是改变你这个念头。


    那么，你憎恨别人的时候，你会发现你自己的五脏六腑不舒服；你助人为乐的时候，你帮了一个人的时候，你整个人状态就会很舒服。


    ### ●商业的根本是利他，本质上是你 在不断的去帮人


    如果你只是想坑人钱财，比如说你去做直播，做抖音，你只是想去坑人钱财，你不会开心的。而且你的面相不好，五脏六腑不舒服，粉丝看着你的脸不开心，他就不会给你钱，你就赚不到钱。因为你只是想要别人的钱，所以你什么都没有，人家都会远离你。


    那么如果你是真心真意想帮别人，人家都会来听你说话。你不卖他东西他都抢着买，因为他知道你这个东西是真的好。


    所以我讲课有一个原则，就是我不管你听不听得懂，不管你高不高兴，我就是要竭尽全力的去传播我知道的最的东西给你。你听到就赚，你耐心的听，它肯定是你最好的东西。


    你听我的课，我要做到的就是，在你这一生当中，你不会再听到第二个人对你这么好。你碰到我陈昌文，听我讲课，听我的发心，我要教你的，在你这一生当中，我要做到的是，不让其他人超过我，就是我要对你发自内心的好。去教真正对你人生有帮助的，对你赚钱有帮助的，对你恋爱有帮助的，这是我的发愿。


    所以当我这样做的时候，你自然就跟着我了。那么这也是为什么这个读书会会在短时间内做到上万人，我这个社群运营六年，那可以说影响到几十万、上百万人，就是这个原因。种善因，就是你赚钱的原因，就是你的人生变好的原因。


    所以其实很多人说，今年有这个疫情，生意难做。不是生意难做，是你的心不好，这一句话有点扎心。不是生意难做，是你的心不好。我觉得我的生意就蛮好的，而且越来越好，对不对？跟随我的人也越来越多，不是生意难做。当然这个里面还有一个核心就是一定要有团队，一定要有强大的团队。没有团队，你一个人也是搞不好的，要有平台，要有团队。


    我们陈昌文老板社群为什么能做这么大，能做这么好，那是因为一直我们很注重选拔人才，提拔人才，有团队。


    那么我当然希望我们读书会里的这个讲师团队，变得更强 大，更智慧，更善良，更正直。我们陈昌文老板社群的这个团 队更善良，更正直。


    ### 强大的团队是你成功的原因


    强大的团队是你成功的原因。


    有两个办法，第一个是你自己有非常强大的带领人的能力，你自己可以做到几十个人的团队、几百个人的团队；第二个就是没有这个能力，你就加入一个强大的团队。选团队怎么选？他的带头人一定是正心正念的，所以我们也只跟正心正念的人去交往。


    各位，首先我给大家讲一下，我并不是让你们加入我的团队，我不需要，因为我的团队已经很大了，已经很厉害了。我只是在分享我的经验，你学到了可以去做你的生意，你从我这里学到的任何东西，你去做你自己的生意。


    如果你是正心正念，看得起我的，我们审核你的收入，你是不是富人？你是不是特别厉害？你也可以跟着我玩，就是这个意思。没有说你非要跟着我混，不用，你在这里就是听课，我这个公开课就是做公益，虽然收了有些人一点小钱，一杯水钱，但是我就是来做公益的。想跟我玩，咱就审核。想自己玩，都蛮好。


    我的微博你们看到了，这只是我的一个账号，有一千多万粉丝。那么在抖音上还有很多人传播陈昌文方法、陈昌文老板社群，我们的粉丝加起来，你们觉得有多少？


    几千万，那是随便给你说一说说的。说这个就是让各位老板知道，我不是空口白牙，在这里说，是真有经验，是真的比你们有些人有一点小小的经验。所以我说的你谦虚的学，虽然你可能做不到这个程度，但是你也会学到一点东西。


    真正厉害的人是只做事的人，就是他每天从早到晚都在做事，并且把这件事情做好，这个东西给他带去收入，这个就是厉害的人。各位一定要记住这一句话，君子务本，本立而道生。


    ### **●君子务本，本立而道生**


    **君子务本，本立而道生。这也是儒家思想。那么不厉害的人，他是不务本的。**不厉害的人，他在干嘛？他在生气。他在跟那些无关的人搞事情，他在看八卦，这是不厉害的人。社会下层的人，都是干这个的。如果你想成为社会上上层的人，你就只需要记住这一句话，叫君子务本，本立而道生。


    我不是给你们讲道嘛，我先给你讲这个道是怎么生起来的，道就是本立道生。什么叫本？本就是你本来应该干啥。本就是你的正事是什么，份内事是什么，那么份外的事情你就不要搭理了。本立道生，就是说这件事情跟你无关，你最好别做。


    **我的本是什么？我的本就是做好读书会，做好陈昌文老板社群，传播好儒家思想、陈昌文方法。** 那么至于你要跟我吵架，跟我同事，跟我搞情绪化，我是不搭理你的。而且我也劝所有人都不要去搭理那些没事找事的人。有些人很坏，他天天把你拖入那些跟你的“本”没有关系的事情。然后你没有定力，你天天被那些人拖入那些跟你的本没有关系的人和事当中，你的人生就完蛋了。


