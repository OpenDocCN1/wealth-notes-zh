    ## 3、为什么要做一个讲书人


    讲书人，就是围绕书籍卖读书会，没有其他目的。


    - 1、始终拿着书讲；

    - 2、说书里好的内容、厉害的观点；

    - 3、进读书会交流；

    - 4、定位高端圈子。


    我们社群的书籍都是精华中的精华，任何一本书，讲透彻，讲好，都能带来可观的利润。我们要做的，就是讲好一本书，做好一个讲书人，给大家讲书。大家不是没时间看书吗？我们就把这个书通过视频、音频、直播讲给大家听，这就是学习，让大家跟着一起学习这本书。


    通过讲书建立读书会，因为你在讲书，他们看到了书，听到了里面的观点，要么是学儒家思想，要么是学营销，要么是学恋爱，要么是学当老板，要么是学当讲师，有个主题，他知道你就是讲这个的，还有一本书，还有一个读书会，他自然会加入。所以，通过讲书人这个角色定位，通过讲书这个结构的视频、直播、音频，天生就具有营销力。


    比如，我就叫做讲书人陈昌文。你叫张山，你就说我是讲书人张山，我今天给大家讲一本书《陈昌文方法72大营销系统》，然后，就可以开始讲一个视频，或者一个直播。讲这个书籍里的营销系统是如何应用的，这样的讲课方式都是干货，而且吸引的都是精准粉丝。


    把自己定位成一个讲书人，专门讲一本书、一门学问，就名正言顺了。取一个好的标题，讲好一个视频内容，在书中抓取一个有用的段落、观点，这样讲，名正言顺，又很自然，单子自然会变多。


    讲书，一定可以做得很精彩。我们的视频、直播，要做得精彩、简单、白痴化，又销量高。采取能复制给家里人、朋友、同事、老公、老婆的手法，来做这个简单的营销。唯独简单才能传播。赚钱要傻瓜式操作，还能批量操作最好。做讲书人账号、视频、直播，注意要简单，可以批量复制才是对的。复杂，不能复制的思维全部是错误的。无论个人做的再好，都是错误的。你能复制给你家里的人，每个人都能赚钱，才是对的。所以，讲书模式，讲书人这个模式是最犀利的。也就是这个模式，你呕心沥血干好了过后，你周围的人能复制出单。


    所有我们的图文号、视频、音频、直播都是讲书的。我们定位就是讲书，通过这本书，讲透彻一门学问，比如，恋爱、营销、《论语》、老板、讲师。定位自己是讲书人，很多事情将变得极其简单，甚至可以上团队作战。


    拿着《陈昌文方法之讲师宝典系列》，就知道自己如何做讲师，如何做视频，如何做直播，如何做讲书人。对讲师有人格、道德，以及业务素养等基本功的要求。教人如何做讲师，如何修德、修能，而不是只想着赚钱。德行为先，我们社群全部是用儒家思想为先，一切只讲真话，不骗人，不说半句假话，不诈骗，只收香火钱，只收无偿赠送费用。这套书，就是教育大家如何做讲师，做讲书人的。讲书人，要把书讲到极致，以后有这样一个新职业，就是讲好一本书，征服天下粉丝。


