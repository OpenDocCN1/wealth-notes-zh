    读书会，就是要只做一本书的读书会，反复做一本书，反复讲一本书。讲好一本书，其他书籍自然销售，也就是在其他读书会自然销售。每个讲师都要研究做好陈昌文读书会，比如，《陈昌文方法之72大营销系统》读书会，《陈昌文解读《论语》》读书会，《陈昌文方法之恋爱宝典》读书会……研究一本书，做一本书的读书会，顺手卖卖陈昌文老板社群，就卖出去了。这是一件事。


