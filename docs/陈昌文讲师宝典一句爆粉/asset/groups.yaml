    ## 4、要学会站在巨人的肩膀上，复制巨人的成果，而不是自己成长成巨人


    为什么讲这个复制营销系统，因为这是赚钱最快的路子，也是关键点。大家不要以为自己聪明，而是要学会直接拿到社群的核心成果。谁的直播做得好，谁的视频爆粉了，直接复制、改编、优化。谁有结果，直接全面复制其语言系统、赚钱思维能力。找到社群的书籍、社群的文案，所有爆粉的文案，人心、人性的文案、故事，全部找出来，直接复制，营销读书会
    + 陈昌文老板社群就行了。


    谁日收入高，复制谁。谁直播间粉丝多，复制谁。天天想的就是复制。


