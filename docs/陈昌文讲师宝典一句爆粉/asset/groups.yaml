    **你有了复制牛人的思维、复制一个主题的思维，你的流量就精准了，你就开始赚钱了。**比如，你卖书，就直接复制书里的内容，不断的讲。比如你卖社群，就直接复制社群里的内容不断的讲，这样来的最精准的流量，来的最铁杆的粉丝。他自然会成交的。只讲一个主题，在一个主题里不断的复制，这就是完全精准流量思维。


