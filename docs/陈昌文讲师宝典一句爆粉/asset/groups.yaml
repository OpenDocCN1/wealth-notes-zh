    # 1、读书会+陈昌文老板社群，是一个整体


    为什么要做读书会?


    +   1、读书会可以循环收单，不断的重复卖。


    +   2、读书会，拿着书，带着大家读书，使铁粉群体形成。


    +   3、读书会增加信任感。


    +   4、服务好了，价值到位，他们自然会升级到高级群里来。


    +   5、我们的书籍全部是原创，这就是唯一性。


    +   6、所有人简单化、白痴化复制即可，思考成本最低。


    所有人，必须宣传社群的唯一性，不可复制性，避免有人用我们社群的东西搞破坏。唯一性营销是最厉害的、最具杀伤力的营销。


    在我们社群，不缺内容，大家要做的，只是复制+变现即可，复制搞流量，然后变现就行了。我们社群是整体分工合作的。社群内部多位老师讲课，我也会客串讲课，无论是读书会，还是高级群，我都会客串讲课，这是唯一的，千万大V讲课，'
  - '[PAGE 227]


    创始人免费公开课，这有一个好处，给大家增加唯一卖点。


    做读书会，做陈昌文老板社群，都是讲唯一性。讲儒家思想、陈昌文方法，都是讲唯一性。不断的搞唯一性营销系统。唯一，别人就没办法复制，也能快速传播影响力、品牌。我们社群是靠影响力、品牌打天下的。我们本身就是一个非常厉害的品牌、非常厉害的影响力。我们的影响力是矩阵影响力，是微博+抖音的矩阵影响力。我们社群，搞的是影响力营销、品牌营销、唯一性营销、矩阵营销。


    我们的一切推销模式、营销模式、影响力打造模式，就是通过书籍完成的。这是我们社群6年来的核心精华、根基。这种介绍模式，这个书籍、读书会，自然就销售出去了。书籍营销系统搞好了，什么都搞好了。读书会、陈昌文老板社群，销量会爆炸式增长。


    读书会，是战略发展，也是核心发展。这个会吸引大量的人数，迅速扩大社群影响力。但是也要做过滤营销系统，只收企业家、美女老板、富人，这个是铁粉圈子。收到了富人，他脑子清楚，天天带着他照本宣科读书，他自然知道我们社群难能可贵，自然加入到我们陈昌文老板社群里来。只要不断的经营读书会，不断的带着人读书、学习、应用，你们都会变成神。'
