    老大，一个人不赚钱，是德行不够，还是行动不够呀？真想把几个月前状态给我回来。以前是怕骂，现在是想我骂。骂醒了就长记性！


    陈昌文：


    社群里有人从下午 5 点直播到晚上 12 点，每天涨几万直播粉丝，当然我不希望你们这么累。别人一天几十单、上百单的出，就是这么简单。复制优秀的主播、视频，就行了。去做吧。区分我们社群里有些人是假优秀，不是真优秀。


    ## 39、别有压力，别跟烂人烂事搅到一起


    学员：


    老大，打扰你了，我发现我现在记忆力下降很厉害，应该有一段时间了，可能是由于我上高中的时候，学习方法不当，加上营养跟不上。经常只要休息不好，头就痛，出社会工作以后，调节过来了许多，头不再痛了，但是感觉这几年记忆力下降很厉害。东西放在哪，放一段时间，就忘记了。昨天去公园看会儿书，就把手机差点丢了。我现在坚持早睡早起，除非特殊情况干扰。老大，我想问还有没有什么方法让我记忆力提高点！谢谢老大的指点！


    陈昌文：


    早起早睡，锻炼身体，尊师重道，孝敬父母，别有压力，别跟烂人烂事搅到一起，您的记忆力就会恢复。


    ## 40、一个主题定下来，千年不变


    学员：


    最近做了将近一个月直播，始终在徘徊讲哪个。老大，现在我想好了，我还是讲营销吧，毕竟这个用了是可以赚钱的，也是我们社群的核心资产。实际一点，不乱动了。


    陈昌文：


    讲营销，就讲好营销。这个《陈昌文方法 72 大营销系统》反复讲，结合儒家思想反复讲。社群有个小姑娘，不到一万粉丝，一个月几万块的收入，预计后续收入会暴增。才干了一个多月，就是盯着《72
    大营销系统》+《陈昌文解读《论语》》，这个框架一直弄，全是精准粉丝。


    一个主题定下来，千年不变，用读书会 + 陈昌文老板社群变现就行了。日曰循环，收单子完事，想多了，浪费时间。


    ## 41、您想怎么弄，就怎么弄


    学员：


    老师，我是半年前加入社群的一名定驻在海外的，通过**加入的学生。是这样的，通过在我们老板社群才半年多的学习，已经在各方面，不管是家族事业，还是我个人事业上的收入、生活，都发生了翻倍的改变。


    最近像退休了似的。我感到很幸运，才20多岁就实现了我想要的生活方式和生活状态。在这个社会虽然我很渺小，但是我最近很闲。成长过程中我感觉自己越来越要有一个社会责任，不是非要有收入才想投资什么做什么，而是最近感觉总想为这个社会做点什么。然后我想了想，网络时代，国际上中国也在崛起，国内的抖音啊什么的由于国际IP阻断，不能通过网络输出价值，所以我在国外创建了自己的YOUTUBE账户，想让更多进不去中国国内网络、居住在海外的华侨以及懂中文的人，和外国人，认识我们社群的文化。想让更多外国人知道我们中国国内有这么一个老板社群。


    我并不是以招讲师为目的获取利益，也不想去读书会获取薄利什么的，只是想时空时间，单纯的想为您做什么，想为了这个社群做点什么，想为社会需要帮助的人做点什么。这样想法，因此，运营方式只想把群里我们己经有的固定知识复制-改编-优化一下，上传到我的YOUTUBE频道上。然后想在下方的简介里说明标记下，我们社群的网址。


    虽然是小小的行为，但是，我觉得我应该首先争取您的同意之后，再去实行，是正确的态度。因为这个关系到社群的国际形象，和您个人的形象。因为大家看到我的YOUTUBE频道，肯定会有人通过下方社群网络地址去直接找到我们社群。


    我个人有自己的事业，所以只是想输出知识，不想涉及与人接触沟通的行为。老师，希望您给个建议或希望您百忙之中给个答复，我可不可以这样做！可不可以建立一个油管频道去输出我们社群的知识和价值。


    陈昌文：


    可以，在外面弄就行了。您想怎么弄，就怎么弄。


    ## 42、只有人对了，社群才会正规发展


    学员：


    感恩老大能这样做，我刚进社群就发现这个问题了，也关注了一些前辈老师。慢慢发现有些讲师自以为是，完全就是没有素质，但是我不敢说，也从不在群里乱发言，有些不懂的我
    就自己去熟悉，有段时间还有些后悔了。后来有次老大大发脾气了，我觉得脾气发的好，不然真的是乌烟瘴气的，严师出高徒，以后定会展心受教。


    陈昌文：


    社群里面有严重的错误，必须一个个的改回来，全面正能量，全面讲道德素质。所有老师注意，所有讲师团的人彻底注意这个问题，不要污名化、流氓化，伤风败俗，还有被国家搞净网行动的风险，不准讲pua，不准用下流词汇。


    社群讲师很辛苦，特别辛苦，所有人都知道，我还天天批评。但我不得不批评，不能所有人都做好人。请所有人，所有讲师理解。每个人，都需要一个敬畏的人，需要一个不断批评您、挑刺的人。你们不愿意做这个挑刺、批评人的人，好，我来做吧。虽然我知道很多人不爽，不过，我就是要做这个，我不得不做。我慢慢理解了地藏王菩萨了。我得支持所有人赚钱，得真正的帮助大家走正道。我得罪你们，也得得罪你们，没办法。


    建立这个社群要极度聪明，特别是用人，这人用不对，一切都是错的。只有人对了，社群才会正规发展，而且还必须杀伐果断，不行的不能耽误时间，否则，社群就会被污化。黑势力越强大，则白色势力就越小，弄的最后不可收拾。也就是只要有错，就得立刻改正，否则，就会被别有用心的人弄的非常坏。


    社群彻底正能量，不允许有任何负能量。所有的语言、名字，一切正能量，不允许伤风败俗，不允许有伤风化，注意社会对我们的道德评价。大家不要给自己脑袋上套流氓术语，这会引起社会低俗化误会。会被社会、国家认定为伤风败俗，有伤风化，要出事的。所有老师、学员，全部高雅，正能量营销。


    要点名批评任何犯错的老师，任何错误，都要点名批评，我会做好带头作用。避免小错误变成大错误，变得不可收拾。有错误，直接指出，立刻改正，不能不管，变成大错。所有老师，都要点名批评，要经常在课堂上，以及直播间，承认自己的错误，这样，我们社群的所有老师，进步就快了。


    自我批评，求老师，求老大批评，应该是社群的风气。善于检讨、反思，才能真正成长。平台发展到如今，我们必须全面正能量，不断的纠错，这是我们活下去的根本。全面迅速提升自己的纠错能力、纠错速度。


    ## 后记


    我们的宴席从未散过，只是这一本书您合上了，或许偶尔还会重温，或者我们将要开启下一本书籍，下一个人生重要的课题。


    - 感恩有缘人！

    - 感恩**陈昌文老板社群**里所有的先进人士！

    - 感恩**陈昌文老板读书会**的每一位读者！

    - 感恩遇见！

    - 感恩一路陪伴，一路成长！

    - 余生，我们继续……


    陈昌文

