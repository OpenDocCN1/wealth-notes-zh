    只要会复制、阅读、朗读，讲解爆款文案，就有利润，而且利润会非常高。流量是抄袭过来的，变现也是复制直播，抄袭过来的，所有动作一定是无脑、简单的，大道至简，理解不了这个，难。拼命复制出单的人，做视频，就是复制；做直播，也是复制。大面积复制，这样我们捞粉丝、变现速度都快。


    书籍就是我们的教科书，这样，我们的思考成本为零。一切采取复制我们的书籍，则轻松多了。就是要复制成短视频、直播，做流量，收单子，这样所有人都轻松。我们有了读书会，有了书籍，营销非常轻松。势能引导到书籍、读书会里，引导到产品上，出单是非常容易的事情。


    我们的任务，就是日日循环我们书籍里的内容。我们的任务，就是把我课上讲的分享出去，做成视频、直播。我们的任务，就是宣传书籍里的东西，宣传我课上讲的，然后收单就行了。做品牌营销、链接式营销，收单子。每天直播
