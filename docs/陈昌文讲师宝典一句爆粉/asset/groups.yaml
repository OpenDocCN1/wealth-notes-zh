    # 2、我们社群的书籍，

    每一套都是一个方面的教程


    我们社群的书籍，每一套都是一个方面的教程。比如，还没出版的《一个社群人的自白》，这就是社群运营的领导者书籍，也就是通过这套书，我们可以教会整个企业家、老板阶层的所有人，学会社群运营。也就是整个互联网界、抖音界、微商、企业家、老板，所有创业者，都要向我们学习社群运营，模仿我们，跟着我们学习。这套书，就代表着我们是行业标杆。'
  - '[PAGE 24]


