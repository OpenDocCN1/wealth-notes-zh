    ### 后记


    ## 第一章 书籍营销系统爆粉


    > 陈昌文解读国学系列、陈昌文方法系列书籍，是我们做成数千人社群的精华理论。

    >

    > ——陈昌文


    ### 1、陈昌文方法系列书籍，是我们做成数千人社群的精华理论


    陈昌文方法系列书籍是陈昌文老板社群的内部教材，是我们做成数千人社群的精华理论，是经营数万粉丝互联网项目的核心理论。书籍营销系统，可以说是我们的教程营销，这是陈昌文老板社群的教程。陈昌文老板社群做到几千人，就是靠这些书籍里的理论。


    我们为什么要有书籍？有信任感。


    我们为什么要有读书会？进一步筛选陈昌文老板社群的精准流量。


    有书籍与没书籍区别很大，书籍营销系统可以极大的扩散影响力，可以极大的做到很多忠实粉丝。


    读书会营销系统、书籍营销系统，跟着做起来，这个可以反复营销，而且粉丝会成为深度粉丝。又可以开直播，公益传播儒家思想、陈昌文方法，以及我们的读书会。然后深度粉丝又可以进入陈昌文老板社群。


    我们社群陆陆续续会出版很多书籍，这些书籍有什么用？


    - 1、现成的课件，拿着去讲课；

    - 2、现成的文案、素材，拿着去做视频，收单子；

    - 3、现成的爆粉语录，里面有些观点百分百能爆粉，找出来；

    - 4、讲书人的内容军火库，文案内容、圈粉、直播，拿来做视频，做谈资，做读书会。


    永远循环读书会变现+陈昌文老板社群变现，抱着书讲视频，直播，直接卖读书会收单子就行了。抱着书讲直播，讲视频，卖陈昌文老板社群。


    什么最值钱？我们陈昌文老板社群的品牌最值钱。


    书籍就是帮大家做营销的，做陈昌文老板社群的营销的。


    后面深度认可我们的企业家、老板，可以付费加入我们的陈昌文老板社群。也就是以前，我们讲内容是换不成钱的，除非客户买了社群的单子，我们才换成了钱。现在，我们讲书籍内容，直接讲内容，你讲的每一句话，都会直接换成钱财。然后，这个书籍的读书会出去了，他是你的粉丝，并且在你的微信里、朋友圈里，在你的视频、直播、微博里，他买社群的单子的可能性就增加了。


    也就是在营销书籍读书会的时候，百分百是把社群也营销了。而且，卖读书会就是塑造社群价值。只是买的人，被我们锁客了而已。他成了尝试性付费的用户，付了一笔小钱。付费粉丝就有了价值，这些人迟早被勾引到高级群里来。这是勾引式营销。


    什么是勾引式营销？抖音、微博、朋友圈，可以拍视频、图文、图片、文案，直接分享陈昌文方法书籍里面的应用。拍视频，讲案例，讲故事。这叫勾引式营销。天夫搞勾引式营销，犹如钓鱼一样，有这么个鱼饵。所有营销，全部是勾引式、吸引式营销。我勾引不到客户买单，吸引不到客户买单，是我无能，是我没有价值。所以，价值是勾引式营销的核心，而不是叫你去骗人。所有营销，必须是合法、合规、合理，不要违法乱纪。


    书籍营销，才是最有力杀伤力的营销，是品牌营销和价值营销。系列书籍读书会，就是品牌化，国学系列+陈昌文方法系列。各位拿着书，在里面找精华，备课，备好课程后就可以讲了。课程肯定是要讲到位，视频、课程、直播都到位，这样卖起来读书会+陈昌文老板社群，就更多了。只要别人进了我们读书会，阅读了我们的书籍，还会不断的传播。免费教外部铁粉，呕心沥血教内部人跟着我们做，这个策略更厉害，让别人抄袭我们就行了。鼓励粉丝去讲我们的书籍，圈粉做自己的项目。


    我们的核心理论，就是我们的书籍，按照这个模式来做我们的商业。我们的一切理论，都是我们的书籍。


    大家要在我们的书籍上找到真知灼见，依托书籍讲真正有意义的话，这样，就能吸引到真正的粉丝。要彻底的讲真话，讲有用的话，单子自然会变多。我的任务就是想尽办法，竭尽全力帮助大家做读书会赚钱。其实，是要不断的找书籍里的经典句子。我讲的好观点，用链接式营销、品牌营销收单，这样是最凶猛的。


    我们的书籍，就是我们社群的教程。我们讲的一切，都源自于我们的教程。每个老师、每个粉丝、每个人，都必须宣布我们的教程，就是我们的书籍。我们在抖音里讲直播，讲视频，都是源自于我们的书籍。书籍做为我们的内部教程，大家可以照本宣科的拍视频，直播，搞朋友圈。在书籍上学到一招，就复制一招，用一招，一句句的用。一招一招的比划。


    我们有了教程，讲直播的时候，读一段，然后延伸自己的故事、粉丝的问题，就行了。这样大家不用备课了，直接按照目录搬运讲解就行了。有教程，什么都可以很好的讲了。有了教程，讲起来就方便，也有根源。就怕没教程，在直播间里瞎讲；就怕没教程，说口水话，而且，说废话，还说些名人案例，被告侵权。


    书籍是用来承载我们社群的理论的。当然，我们的目的是卖出去更多的读书会。卖读书会的过程是通过分享式营销，分享书中的内容。我们讲课，做直播，做视频，做微博，做朋友圈，可以对粉丝说这是我们的教程，请你直接翻到多少页，告诉粉丝，这段话是什么意思？这个营销系统是什么意思？怎么运用？请大家做笔记，做解释。比如，聚焦系统，然后拍视频、照片、直播，讲这个聚焦系统有什么用，照着读就行。在卖的过程中，我们也学到更多的营销思维、玩法，而且是实践性的玩法。然后我们帮助了别人，还赚钱了，还有可能卖出去社群。这就变成拿在手里
    的活动营销了。这就会促进大家的关系、亲密度进一步提升。


    一切按照教程讲，一切有迹可循。教程上面一章章的，正好非常有章法，有结构。讲起来也有干货，而且品牌营销陈昌文读书会，顺手就卖掉了。我们一定卖陈昌文老板社群，一定卖陈昌文读书会，混合卖，都是根据我们的教程来讲。


    团队体系，专门建设代理团队、客户体系，专门发展客户，但是都是根据我们的教程来培训客户体系，培训代理团队体系。一切依托教程，讲直播，视频，做朋友圈。


    我们的书箱，永远都是赠送模式，不是销售模式，我们永远不卖书，而是卖背后的读书会、陈昌文老板社群。拿着书讲，这是我们的内部资料。凡是卖我们内部资料的都是违法犯罪，我们只允许免费赠送内部资料。我们只卖读书会，不卖书。


    注意：我们的书箱永远是免费赠送的模式，必须写免责声明。

