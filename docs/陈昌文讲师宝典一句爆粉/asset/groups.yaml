    我们做读书会，也是为了筛选美女老板、富人、企业家、高端人士。我们教会大家的就是儒家思想、陈昌文方法系列知识、智慧。我们做读书会的目的，就是锁定一本书，不断的讲。这个读书会里的人，都学习这本书里的各大系统、言语，学以致用，去实践。


