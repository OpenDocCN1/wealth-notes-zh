    当然我只服务年纯利润过一百万的企业家、美女老板，我只服务非常有钱的人，那我也希望你们也养成这个习惯，只服务非常有钱的人。


    我告诉你，这是我经商很多年，可以说我前面这三十几年的人生总结。我服务过没钱的，服务过稍微有一点钱的，服务过非常有钱的人，所以最终我的结论是只服务非常有钱的人。


    只要这个人没有钱，我一定把他拉黑，不跟他说话，不服务他，不给他讲课。因为钱代表一个人的素质，所以我只要发现你没钱，素质低、智商低，我就建议管理员把你踢了，我不跟你纠缠。只要我发现你不对，我就不跟你纠缠。所以人在这个社会上最重要的事情就是只关注富人，你就会成为富人，不要去关注负面的人物。人最宝贵的是你的精力。


    其实儒家思想《论语》当中，孔子收弟子，他也收了很多王公贵族，像季氏的子孙跟着孔子学习，孔子要的是自行束脩以上，现在大家买一块肉很便宜，但在孔子那个时代，生产力是很弱的，要吃到十条肉干是很难的。十条肉干能送人，这个是一大笔财富，可不是小钱。如果你们有记忆的话，那么在我'
