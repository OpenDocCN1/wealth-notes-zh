    ## 第七章 公开课 公开赚钱的秘密


    以我的经验来讲，粉丝就是钱，流量就是钱。有了粉丝，有了流量，卖产品就能变现，就可以赚钱。


    > ——陈昌文


    ### 1、公开课，我讲什么


    公开课，是读书会，以及陈昌文老板社群的免费福利。公开课是讲给老板听的，内容是：


    - 我是如何谈恋爱的？

    - 我是如何做粉丝的？

    - 我是如何利用社群赚钱的？

    - 我是如何做品牌营销的？

    - 我是如何做流量、变现的？

    - 如何迅速做抖音账号变现？

    - 什么样的变现逻辑是正确的？

    - 什么样的流量逻辑是正确的？

    - 我是如何跟人合作的？

    - 为什么有很多人跟着我打天下？

    - 我如何对待跟着我的团队成员？

    - 我的管理团队经验是怎样的？

    - 我管理团队的失败经验是怎样的？

    - 我用人错误的后果是如何的？

    - 人应该做到杀伐果断吗？

    - 如何提升自己的格局？

    - 我的投资经验是怎样的？

    - 我觉得人生最重要的是什么？

    - 我觉得人生应该如何度过？


    公开课，就是我对人生的成长经验、创业经验、赚钱经验、做老板的经验、恋爱经验、管理团队的经验、互联网营销的经验、品牌营销的经验、做自媒体、做社群的经验。公开课的本质，就是我自己的故事、自己的经验、自己的人生，分享给读书会的会员。也就是我的一些案例，也就是我的真实人生经验，介绍给大家，大家自己拿着去借鉴和提升。


    我为什么可以做到几千人、几万人的社群？这也是我的经验。


    读书会数万人，是如何聚集起来的？这也是经验。


    希望能帮助到读书会的人，也希望能帮助到陈昌文老板社群的人变现，这就是我的讲课内容，以及目的。


    讲公开课，我的目的是讲品牌影响力、个人影响力、故事、社群故事、社群结构、做人。最重要的是做人，做人真了，有真正的人帮助你，你就成功了。


    我讲公开课的唯一目的，提升大家的赚钱能力、营销能力、直播、视频能力，利用抖音赚钱的能力，我不会讲其他的事情。


    公开课讲的是自己熟悉的东西，自己不熟悉的东西，我们**不**讲。**熟悉，才能讲好，讲好非常重要，当然内容也非常重要**。我讲我个人的故事、文字、书籍、文章、课程，这是我的经历、我的实战，目的是为了让大
    家赚到更多的钱。**成年人的世界，就是帮助大家赚钱，自己赚钱，其他的，都是虚伪**。


    我必须呕心沥血的为粉丝服务，我必须真正的付出价值，我必须讲好公开课，我必须把我最重要的、最有意义的东西告诉粉丝，让粉丝提升智慧，提升赚钱能力，提升营销能力。


    我得想办法提升大家的智慧，我得想办法让大家学会做主播，学会直播、视频，而且是非常简单的圈粉，而且是非常简单的做直播，收单子。我得简化大家的赚钱步骤、后顾之忧，什么都给大家提供好。这样，大家才能进步，我得创造价值。


    公开课一开，就一直围绕公开课循环讲课。主要讲真实的故事和经验，我们书籍的故事、编辑的故事、社群的故事、社群营销的故事、社群的历史故事、赚钱的故事。


    故事讲细节，就是如何做起来的？如何赚钱的？价值观+赚钱，一起讲，不能只讲赚钱，还必须讲价值观，也就是我们坚持什么样的价值观，就一定能赚钱。儒家思想、正能量，就能赚钱。


    大家最关心的就是怎么能赚钱，传统企业怎么能转型。首先，以我的经验来讲，粉丝就是钱，流量就是钱。有了粉丝，有了流量，卖产品就能变现，就可以赚钱。所以，我做读书会就能赚钱，做陈昌文老板社群就能赚钱。


    我建议老板们，一定要盯着抖音，不断的做粉丝。如何做粉丝？可以利用我们书籍里的东西，直接抄袭，讲课、图文，也行。做成视频、直播，粉丝做到十几万、几十万，就可以变现了。至于你怎么变现？可以做自己的产品，也可以做知识付费，也可以跟我们合作。


    人最重要的是跟什么人打交道。我会告诉你，你必须跟高智力、有财富的人打交道。比如我，我就只跟企业家、美女老板打交道，跟富人打交道，这样不吃亏。就连讲免费公开课，我也不想跟低层次负能量的人打交道，因为他们不仅仅什么都不懂，还只会喷。你免费帮助他、教他，他也会喷。


