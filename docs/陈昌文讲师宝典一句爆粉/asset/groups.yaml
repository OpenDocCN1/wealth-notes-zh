    赚钱的人，只是听话、照做、执行。不太用动脑，开始动脑的人都不赚钱。包括我们社群里的讲师、同学、看起来独立自主的人、很聪明的人，都不怎么赚钱。就是他们根本做不好复制的工作，复制不好赚钱的人的朋友圈、抖音。他们不复制的原因是，他们有自我愚蠢的意识。他们觉得他们聪明，他们想要另辟蹊径。于是，他们寸步难行。而聪明人只搞笨办法、老办法、蠢办法，只走老路，不走新路。看到别人这个模式能爆粉，就直接弄了，看到这个模式能赚钱，就直接弄。学得一样，复制得一样，就赚钱了。


    最白痴、最有杀伤力的赚钱模式，就是复制。这句话能爆，我就复制一下。朋友圈广告、图片、聊天，如何聊能出单，我就复制一下，完事了。如果你做抖音、做朋友圈，绞尽脑汁，很费劲，证明你狂妄无比。赚钱是一件轻松愉快、不动脑的事情。什么时候，你开始感到困难了，就证明你根本听不懂人话。这就是难者不会，会则不难。


    工作的本质也是只干顺水推舟的事情，只干锦上添花的事情。不要搞起死回生的工作，而只做治未病的工作。起死回生费力太大了。治未病，只是说，天凉了穿衣服这么简单。我们做抖音也是如此，不要搞个什么特立独行的事情。陈昌文老板社群里，有几个人做得很好，他们就是只复制，直接变现就行了。


