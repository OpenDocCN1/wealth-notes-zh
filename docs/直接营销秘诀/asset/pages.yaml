- pgno: 86
  md: '但是要明确，谁撰写了一个网站的内容，谁就是该网站**真正的主人**——就像报纸或杂志的真正主人是主编一样——而不是发行商，或者母公司。


    史蒂芬·斯皮尔伯格是电影的真正主人——不是制片人，不是电影制片厂，也不是投资商。史蒂芬·斯皮尔伯格的电影非常精彩，非常成功。现在，在他执导的几乎所有电影中，他担任制片人兼所有人，也不再需要投资商（因为他非常有钱）。这里，我主要想说的是：**统治和拥有互联网的，是“内容的创作者”**。


    大型的广告公司都是由广告文案作者建立起来的——比如，大卫·奥格美和李奥·贝纳。这些人都是富有创造力的天才。他们是内容人才。他们知道如何创作让人们留在脑中，挥之不去的信息。那是他们的**天赋**。他们用自已创作让人们留在脑中，挥之不去的信息的能力，成就了数十亿美元的广告公司。


    **关键是**，你需要掌握不断向网站添加内容的能力。


    # 网站设计的具体目标


    如果你需要自己的网站完成许多任务——那么你需要能够灵活地、迅速地以低成本，**创立更多的网站，每一个都有自己独特的任务**。


    这对于你在互联网上**取得成功**至关重要。


    以下是网站的可能目标：


    +   1) 树立品牌和形象。呈现专业水准。（说明书式的网站）'
