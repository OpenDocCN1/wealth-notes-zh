  md: '# 49、你的“小金库”！


    亲爱的岛友：


    衷心的感谢你！


    没有你的支持，没有每一位岛友的支持，合赢岛可能现在还 不存在！你是合赢岛的客户及朋友，也是合赢岛的力量源泉……肯定的说，你是合赢岛的商业资产！


    那么，你最有价值的商业资产是什么呢？


    是你的库存？设备？资金？不动产？特殊的生产工艺？专利或商标？员工？


    我想，你已经猜到答案了——是你的客户。


