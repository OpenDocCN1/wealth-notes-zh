  img_proc: true
- pgno: 142
  md: '在直接营销中，约 70%的销量是通过**两步或多步营销**完成的，而 30%是通过一步营销完成的。两步或多步营销就是，首先获取潜在客户，然后通过在宝贵的免费信息中夹着销售信息，对其进行跟踪。


    **一步营销**指用销售广告立即吸引你的潜在客户，让他们直接购买。


    我认为，你对第一次访客的唯一目标应该是，说服访客去填写注册表，索取免费的书籍或其他珍贵的免费礼物。你的第一个目标是建立潜在客户数据。


    这是典型的直接营销模式：首先建立客户数据，以便拥有合格的潜在客户——你的准顾客，然后再向其销售产品。


    你现在看到我的个人网站 www.lijingchi.com，是采用多步营销策略。这个流程就是我在“李炳池直接营销导图”中讲到的：吸引——培养——首销——再销——深化。


    我没有要求你必须注册才能获得我的营销通讯，而是直接让你免费学习，如果你觉得我的营销通讯内容价值高，那么你就会自然填写注册表，输入你的邮箱地址，或者扫描我的微信二维码。


    然后，我通过公众微信号：LBC333 经常给你发送一些经典的有价值的营销讯息，目的就是和你继续培养信任的关系。不像两步营销，当你成为我的客户数据库里一员，马上就销售产品给你。


    但是，其他优秀的营销者比较喜欢两用的获取潜在客户的网站——一个推广产品和让访客填写注册表获得免费礼物的网站。'
