- pgno: 75
  md: '这是制定价格很笨的方法。


    正确答案是：“你应该收取你的客户愿意支付的价格。”


    你的客户愿意支付的价格完全取决于他们对他们正在接受的东西的估计价值。


    如果你在当地的一个咖啡馆碰到王羲之，你上前介绍自己，然后问这位东晋时期最伟大的书法家是否会在一张纸上写上几行字，如果他确实照你的意思做了的话，那么写了他字的卫生纸值多少钱呢？


    对于王羲之而言，在卫生纸上面写一些字是很容易的事情，只花了他几秒钟时间。卫生纸本身的成本不到 1 分钱。但是这张纸巾现在可能是 10 万元，或更高的价值。为什么？因为有些人将愿意为此付出数十万元...因为他们知道这确实物超所值。


    我也可以在餐巾纸上面写一些字。它们可能看起来差不多，也许看起来比王羲之写的还要好。不过，我没有运气找到任何一个可以购买我的涂鸦作品。我的餐巾纸和王羲之的餐巾纸的区别是在买方的头脑里的。


    为什么女人喜欢 Gucci 的手提包？难道比其它品牌的好几十倍吗？我自己觉得 Gucci 的手提包并不值那个钱。


    其他牌子的手提包更耐用，更好看，至少我看来是那样的。Gucci 手提包一直坚持的事情，我估计，是其惊人的高价。但是，许多女士喜欢 Gucci 这样的手提包，因为女人的包包是身份的象征。很多女性希望人们知道，他们（或他们的丈夫或男友）花了很多钱买了这种手提包。'
