  md: '# **5、直接营销是一门透视人性的学科**


    亲爱的朋友：


    **如果你有**兴趣了解人类心理，和人们为什么喜欢做他们感兴趣的事，你一定会喜欢直接营销...因为直接营销是学习和了解人的基本心理。


    当我写销售信时，一定要把我自己放在读者的位置上，对于直接营销我喜欢这一点。


    有个古老的谚语说：你只有穿着一个人的鞋走过了一英里，才能够了解这个人（只有设身处地，才能理解他人的境遇）。


    成为一个成功的直接营销文案撰稿人，我必须是一位心理学家。我必须是了解是什么导致人们采取行动。我必须知道可预测的人类行为模式。我必须进入我的读者心理，给我的读者们令人为信服的理由，那样他们会拨打我的电话号码或拿出他们的支票簿，开出一张支票，然后用心地把它寄给我们不认识的甚至从未听说过的人。


    甚至更新奇的是，他们在我已经设置好的网页订购栏上填写他们的信息并**按下按钮**，将款打到一个谁也不认识谁的网络中去。


    靠通过邮件或者微信卖东西而获得订单是一项艰巨的任务。


    但这是可行的，而且是确实可行的。如果你学习直接营销法则，这些法则是固定的、不变的。不管是过去还是现在都是相同的。而且将来也一样。这些营销法则将永远不会改变，因为人性是永远不会改变的。


    我的意思是人类基本的愿望、梦想、恐惧和动机将永远不会改变。在 5000 年前他们就是相同的。而且从今天起 100 年以后，它们也将是相同的。'
  merge: -1
