  md: '以做余额宝呢，可以日进斗金呢？免费真的是要做的事，你不要觉得免费的东西就一定是骗人的。


    **越是免费的产品**，用户选择的成本低，用户抛弃的成本也特别低。我花1万块钱买一个冰箱，这个冰箱不好用，我也不好退货。在互联网上，用户用你的东西，鼠标一点，就跑掉了。


    **越是免费的东西**，有时候反而要把用户体验放在第一位，你要想办法把它做到极致，甚至做到比收费的做得好。你想想，你如果能把一个东西做得比收费的还好，体验还好，又免费，你哪怕是一个小企业，一样可以所向披靡。”


    我认为周鸿祎对“免费”分享得非常透彻！


    但是，有一些客户问我：“李炳池，免费这个词会不会失去效果，因为越来越多的人开始用这个词，而且顾客也越来越精明。”


    我的回答是：“其实人们在做促销的时候，还没有充分利用免费这个词。很多人都在利用免费赠品做广告，但仅仅吆喝免费，是无法让你脱颖而出的。你需要更多优势，比如你的产品的独特好处，或者独特卖点，或杀伤力的销售文案等。”


    如果你有了上面的优势并且配以免费赠品，那么收到的反应率会比用同样的文案却没有强调免费赠送这一点高出很多。


    祝你成功！


