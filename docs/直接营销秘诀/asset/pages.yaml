- pgno: 135
  md: '高尔夫球手的信息。具体的来说，你是在寻找**不为人知的秘密**来提高他的球技。


    这里有一个技巧，问问你自己：


    +   - 究竟什么才可使普通高尔夫球手兴奋？

    - 他最在意的是什么？

    - 什么才能吸引他？


    如果你打高尔夫，你就会知道答案了。普通高尔夫球手最梦寐以求的是能够<u>打出又远又直的发球</u>。他想要体验那种击出极远却又极准的球来使他的同伴自惭形秽的感觉。


    因此，你就知道在书中找什么了。对笑话书、小说、以及图册，你可以随意扔掉。你在寻找能帮助普通高尔夫球手**发出远球的信息**，当看到相关的章节时就好好读一读。


    不要让自己感到困惑，或被难住了。如果作者还没讲清楚，继续前进。不断学习。跳过无聊且不相关的部分。**记大量的笔记**。记笔记最快的方法就是用你的智能手机把重要的内容拍下来就行。这样，之后你可以重新整理一下自己的笔记。


    当然，如果你习惯手写，你可以拿上你喜爱的笔记本来记录。


    **工欲善其事，必先利其器**。不断记与发球相关的笔记。尤其要记下常识性知识，尤其是——像大多数人数不知道的独特信息。


    经过一个多小时的阅读之后，关于发球，你就比 90%的高尔夫球手都懂得多了。三个小时之后，你将学到足够多的“**高尔夫术语**”，你是以坐下和**梁文冲**，或者你的英文好的话可以和泰格·伍兹聊天了。'
