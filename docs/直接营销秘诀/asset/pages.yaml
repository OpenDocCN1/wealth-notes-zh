  md: '# # 36、你想让回应率增加 19 倍吗？


    亲爱的朋友：


    **想像**一下，当你突然之间可以使 2 倍、3 倍、甚至是 10 倍数量的人去阅读你的信息，你的银行账户**迅猛膨胀**的时候，是什么样的感觉？（有人曾经只换了一个标题，得到的回应率便增加了
    19 倍！）


    要想成功，没有什么比**标题**更加重要了，因为，标题是你所有营销材料成功的第一步。


    **你的销售信，要么引起注意…要么不会。**

    **你的销售信，要么对潜在客户进行精准定位 …也可能不会。**

    **你的销售信，要么吸引潜在客户进一步关注…也可能不会。**


    而标题便决定了销售信是否能够做到上述这些。


    你所获得的结果，是与你的标题质量——吸引力和激发兴趣——成正比例的。


    一个好的标题可以很轻易地使你的回应率增加 2 倍或 3 倍——一个非常好的标题效果可能更好！


    关于标题的力量，大卫·奥格威曾经说过：'
  merge: -1
  img_proc: true
- pgno: 186
  md: '“一般说来，阅读标题的人数是阅读广告正文内容人数的 5 倍。因此，除非你的标题能够将产品销售出去，否则的话，你 90% 的钱都等于是浪费掉了。”


    著名的文案撰稿人，《如何撰写好广告》一书的作者，维克多·斯瓦布曾经说过：


    “一些失败广告中的内文是很有说服力的，但是却没有提炼出一个好的标题。因此，虽然主体文案很精彩，但根本没有人去阅读。”


    另一位广告大师，《测试广告的方法》一书的作者，约翰·卡普尔用下面这段话总结了标题的重要性：


    “……我会 在标题上花很多个小时——如果必要的话，会花很多天。当我写出一个好的标题之后，我就知道，我的任务差不多就完成了。如果必要的话，撰写文案通常只需很短的时间就能完成。如果标题真的能够‘吸引住人’，那么该广告就是一则好的广告。”


    还有直复营销导师，泰德·尼古拉斯总结道：


    “数百次的试验结果表明：一则好标题的作用可能是一则普通标题的 17 倍，而二者的主体内容是完全一样的！”


    作为一名<mark>市场营销人</mark>，你所能获得的最有价值的技能，就是创作能够吸引人的标题。


    下面是在你撰写标题的时候，需要<mark>掌握和注意</mark>的事：


    这种技能，一旦掌握，便可以随时随地使用，从而吸引更多的潜在客户、'
  merge: -1
  img_proc: true
- pgno: 187
  md: '提高你的销售额、改善你的现金流、以及增加你的利润！


    **1. 要进行对话式写作。**


    了解人们是如何讲话的，以及在你有意无意捏出“专业范”的时候，你自己是如何讲的。努力将这种讲话的方式融入到你的广告文案写作中去——尤其是要利用到你的标题中。它听起来越像是一场真实的谈话，你的读者能够感受到的参与度就会越高。


    **2. 要按照顾客的思路与之交流。**


    这个著名的 建议来自于 20 世纪 30 年代的广告文案写作传奇人物——罗伯特·科利尔，它也是你在开始撰写文案的时候应该记住的最重要的一件事。我有一个原则：你必须和
    读者的想法进行一次内心谈话。要从读者关注的地方开始，而不要一味地介绍你自己想说的。而罗伯特特的这个建议把我的原则更加具体化了。


    **3. 要记住这五个词语——发自肺腑的，感人的，互动的，栩栩如生的，同情的这五个词语可以当作提示小条，帮你创作出有效的标题来。**


    下面一个一个分开来讲：


    “**发自肺腑的**”的意思是：你要发自真心——发五脏六腑。一个发自肺腑的标题是很实用的，也是可以立即见效的。


    “**感人的**”的意思是，你的标题要能冲击到读者的情感。


    “**互动的**”意思是，它听起来像是有人在讲话一样。你的读者可以“听到”你在说这个标题，因为你使用的语言就是谈话式的。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '“栩栩如生”的意思是，读者能够想象到你标题中所说的是什么样子。


    “同情的”的意思是，读者能够感觉到，你是可以理解和体会他们的感受的。


    # 4. 要把真实情况与大肆宣传处理得恰到好处。


    畏首畏尾的标题对你没有任何好处，但是吹嘘得太过分的标题也同样无法令人相信。要尽你所能宣传自己的产品，但是也要在你的文案中提供相应的证据。


    # 5. 要理解你的标题的终极目标就是：吸引读者接着阅读文案的下一行内容。


    不要在标题中就把你接下来要讲的全部内容都总结出来。要用一些策略来激发人们的好奇心和欲望。要让他们产生了解更多的渴望！


    # 6. 不要自作聪明。


    大部分时候，自作聪明会导致你无法提供一个吸引人的承诺，无法使读者采取你希望的行动。要忍住各种诱惑：通常情况下，简单明了的标题要比那些自作聪明的标题有效的多。


    # 7. 不要让人觉得无聊。


    记住：你最终追求的结果是让人们采取购买行动。采取行动，是要先产生行动的意向的。而行动意向是由情感激起的。情感，要由刺激产生。你所撰写的标题，要能刺激人们，而千万不能让人只产生想要打招呼的感觉。'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 8.不要假设你的潜在客户在了解你所知道的东西。


    人是很容易就忘记自己在提供产品、服务或者信息的时候所投入的所有时间和精力，也会很容易忘记自己所使用的营销领域中的那些知识和专业技巧。要在你的脑海中将时钟拨回去，回到你还一无所知的时候。你的标题，并不是为那些成熟有经验的人所写的，而是为那些需要了解更多的“初学者”所写的。


    # 9. 不要把重点放在讲述你的过程上。


    还记得我在公众微信（LBC333）中提到的泰诺例子吗？


    消费者关心强生公司推出泰诺（美国强生公司在 20 世纪 70 年代末生产的新型感冒药）花费了多少钱吗？没有！


    难道他们关心强生公司是一家大公司，甚至是很出名的吗？没有！


    消费者只想知道：“这个产品是否会让我头痛消失，并治好我的头痛？”


    人们对于种子是如何采集、培养、储存或者运输的根本不感兴趣。他们感兴趣的，是家门能出现一片更加嫩绿的草坪。他们看重的，是最终的结果。


    因此，不要把重点放在讲述过程上；要着重地告诉潜在客户，他们最终将会得到什么。


    # 10.不要只是为了引起人们的好奇心。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '如果你希望潜在客户在读完你的销售文案之后，脑海里充满准备购买的情感，或者采取其它一些关键的行动，那么，你就需要做得更好。最开始产生的好奇心并无法促使人们最终采取行动。产生好奇很好，但更重要的，是要产生购买的欲望。以及刺激他们采取购买行动的方法。


    大部分的营销人都没有意识到，区区一则标题能够对他们的整个结果带来的巨大影响。他们要么就是根本忘了撰写一则标题，要么就是非常随意地拟一则标题，像后来添加的内容一样。


    祝你撰写出吸引人的强力标题！


    真诚的，


    **P.S.** 一定要保证你的所有广告和销售信都有一则标题。并且，要尽可能地把握题写得有力量和吸引人。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 37、赠品


    亲爱的朋友：


    使用**赠品**是增加产品附加值的重要策略之一。


    我在销售产品时，测试过使用不同的赠品。最终发现，真正能够增加产品价值的赠品是*与产品相关的、但却令人意想不到的礼物*。


    我希望你认真地思考下我刚才所说的话——*赠品是令人意想不到的*。


    尤其是对那些不经常看到销售信、或者普通消费者而言，他们看到赠品之后，通常都会觉得很惊喜。


    比如说，你正在销售一个减肥的产品——教大家如何在 30 天内减掉 15 公斤的减肥课程，你在销售信上告诉大家，你会指引着大家去完成这件非常伟大的事情：在一个月的时间内，减掉
    15 公斤的体重。


    在销售信的底部，她们可以注意到，你向她们提供了一个赠品。是一本精美的减肥日记本，用它可以记录她们自己的减肥和进步过程。如果人们今天订购的话，就可以免费得到这个减肥日记本。这个日记本本身价值是
    120 元的，而你要免费送给她们。


    这个减肥日记本就是一个令人意想不到的赠品：**既与你提供的主要产品有关系，又很有价值**。这样一来，你所提供产品的价值就增加了。这就是一个好的赠品。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '我曾犯过这样的错误：在自己的单页销售信中提供的赠品与销售的产品并没有什么关系，这样的话，根本无法增加产品的价值。（除非你的赠品是人们熟悉的超值产品。我见过一个广告是：买房子送奔驰；买别墅送飞机。）


    要把赠品看作是“额外的一度”。什么意思呢？就是说：要在标准气压下把水烧开，需要 100 度。在你烧到 99 度的时候，水是烧不开的。


    当潜在客户在阅读你的销售信的时候，就相当于水烧到 99 度的情况。你需要找到一种方式来获得那额外的一度，从而把水烧开——即，达成这笔销售。


    而你的赠品，就相当于那“额外的一度”，可以把犹豫的潜在客户转变为真正的客户。


    真诚的，


    P.S.还有一种增加顾客感知价值的策略，就是在顾客下单之后，再额外附加一个你并没有告诉他还有的赠品。当客户收到产品后，他会感到很惊喜！永远要记得想办法创造感动，让客户永远相信你，追随你！'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# ## 38、利润阶梯式增加公式


    亲爱的朋友：


    **我分享一个营销秘诀给你。**


    我认为，它是最容易被低估、最未被充分利用的网上赚钱秘诀之一。


    最顶尖的线下广告撰稿人和直接营销人都已经掌握了这种秘诀。而最初知道和应用这种秘诀的少数网络营销人都赚了大钱。


    这个秘诀可以让你的广告文案对你的销售和利润充分发挥作用，并且它可以极大地帮助你将销售漏斗中的每一位新客户的价值增至数倍。它理解起来非常简单……


    **产品阶梯式提升+优秀的广告文案=利润阶梯式增加**


    如果你在第一眼看到这个公式的时候，就觉得它很合理，那么，财富已经在向你招手了。


    真的！


    实际上，我有一个做高端生意的朋友，他正好就是非常完美地利用了这种“利润阶梯式增加”公式。


    我认为，区别就在于广告文案的质量，以及这门生意所建立的强大的“产品阶梯式提升”机制。


    我所谓的“产品阶梯式提升”指的是什么呢？'
  merge: -1
  img_proc: true
- pgno: 194
  md: '它比你想象中的要简单得多了……


    “产品阶梯式提升”，就是产品一系列的逐步上升，为潜在客户提供更多 的价值，更高价的产品。


    在这个例子中，潜在客户首先被要求购买一个便宜的产品——比如，小 包装产品。


    然后，几乎是立刻销售给他另一种稍微贵的产品。这样不断进行下去， 他会顺着阶梯一步步往上走！通过一系列的电子邮件、销售信，向上销 售——再强调一遍，所有都要以广告文案为推动力——潜在客户从购买
    最初的廉价产品被引导至最终购买售价上万元的昂贵产品。


    因为市场的发展趋势就是越来越“细分化”，所以我的朋友提供一系列的 产品，从而得以满足他所有的潜在客户的需求。


    比如说——假设而言——他提供的是有关健康生活的不同方面的课程。 无论是减肥，还是健身、情绪管理等等——每个课程都专门研究这些领 域中的一种。


    在潜在客户的“产品阶梯”之旅的每一个阶段，他们之间的联系、信任和 价值认知都会得到加强——从而使潜在客户从心理上做好准备，来购买 更高价的产品。


    所以，现在你应该理解“产品阶梯式提升”是什么了吧。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# “产品阶梯式提升”


    # （当与优秀的广告文案相结合的时候）


    # 可以带来更多利润的原因


    每当有人从你这里购买一些东西之后，他就有可能从你这里购买其它的东西。（当然了，这是在你很真诚、产品质量很好的前提下。）


    这也意味着——只要能够用自己的产品不断地满足潜客户的需求和欲望，他们就会很自然地从你这里购买更多的东西。


    而你需要做的，就是与可靠的广告文案相结合——提供一系列更先进、更高级的产品——从而促使客户不断攀登那个阶梯。


    发展“产品阶梯”并没有那么难。如果你与你的市场和你的客户是同步的，那么就很容易开发出使客户感兴趣、对客户有价值的一系列产品。


    真正的秘诀是：要编写强有力的、高效的广告文案，从而推动每一位新的客户在你的“产品阶梯”上不断地往上爬。


    真诚的，


    P.S. 在你营销过程的每一个阶段——尽可能使用最引人注目的信息内容——撰写出最好的广告文案。否则的话，你就把钱白白浪费掉了。'
  merge: -1
  img_proc: true
