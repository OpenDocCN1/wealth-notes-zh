  md: '但实际上，你不可能对碰到的每样东西都非常有兴趣购买。


    如果我努力向你销售一些东西，你会选择拒绝。然而……


    # 如果我能够吸引你的注意力的话……


    如果我所提供的东西正好可以满足你内心深处的渴望……或者，能够帮助你解决长久以来困扰你的一个复杂的问题……


    # 如果我描述的这项交易里，你根本不需要承担任何的风险，反而能够获得很多东西……


    如果我完全体谅你的拒绝，理解你的疑虑和不安，并真诚地回答你的每一个问题……


    # 如果我能够清楚地向你展示，你应该怎样尽可能快速、以最轻松的方式变得更加富有、更加快乐、更加健康……


    而且，如果你信任我的话，并确信你的风险极小，而回报令你非常兴奋的话……


    那么，你的**抵抗性心理便会减弱了**。尤其是在我清楚地表明，你如果试过之后不满意，可以改变想法的时候，你或许就会选择一试。你或许自己就会决定要看一下，我讲述半天的东西到底是什么。


    这就是**诱惑**。


    实际上，大部分的广告都这样说，“嗨，既然我已经热情的招待了你，那么何不去购买我的产品呢？”这些广告往往包装得很炫，夸大其词，自吹自擂，希望顾客们可以拜倒在其脚下，并且自己去寻找产品。（然而很多失败的生意主们却都很震惊——震惊地发现，无论他们广告中宣传的产品是多么的好，人们却没有去寻找他的产品。）'
