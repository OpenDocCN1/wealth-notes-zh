- pgno: 28
  md: '不，你希望人们现在就采取行动，下订单，或留下他们的个人信息。我们做广告，只为一个原因：赚钱！就这样。


    你知道，为何今日大多数的广告效果都如此糟？因为今天，广告业中的大多数人压根儿不知道，什么能让人们购买。信不信由你，是真的。他们喜欢矫揉造作，油腔滑调，白白浪费掉客户几万，几十万，甚至上百万的钱。


    大多数广告人（以及他们的公司）不知道如何激发人们的想象，让他们打开自己的钱包进行消费。


    这就是为什么我要在本期营销通讯里揭开那些愚蠢的废话和昂贵的神秘面纱。这么多好心的商人，却因受到严重误导而正在抓耳挠腮，苦思冥想，为何他们的跋涉马——他们不堪入目的广告、介绍手册、销售信、电子邮件和网站——无法赢得比赛。


    因为他们并不了解人们购买产品的真正动机是什么。


    下面是“人们购买产品的17个动机”，对照下，你用到了哪个呢？


    # 1. 恐惧


    人们之所以购买你的东西，是因为他们害怕衰老，害怕发生意外，害怕落伍。他们害怕脱离这个世界。他们害怕死亡。他们害怕生病，害怕去地狱，害怕孤独。他们害怕破产，或者害怕没有钱。他们害怕竞争对手获得权力。他们害怕生活没有意义。他们害怕失败。


    他们担心他们的孩子不会做任何事。他们担心他们的孩子被人轻视。恐惧有各种形状，大小和型态。恐惧是一种强大使人们购买产品的动力。


    # 2. 渴望被认可'
  merge: -1
  img_proc: true
- pgno: 29
  md: '人们之所以购买，因为他们想要荣誉和威望。他们想要得到人们的认可。他们希望与众不同。他们想成为一个非世俗性的人，著名的人。他们想要有很高的声誉。


    # 3.贪婪


    几乎每个人都想要更多的钱。无论是多么富有的人，他们总是想要更多的钱。即使是亿万富翁也想要更多，并不是因为他们需要它，只是因为他们想要越来越多的钱。


    他们希望有比其他的亿万富翁更多的钱。巴菲特并没有停止努力赚更多的钱，即使他是世界上第二个最富有的人。比尔盖茨仍然需要更多的钱，因为他想保留最富有的头衔。


    对于伊梅尔达马斯克而言，一万双鞋是不够的。她总是需要更多的鞋。


    # 4.爱


    爱是一种强大的购买动力。父母对子女的爱，男女之间的爱，晚辈对长辈的爱等等。史玉柱的脑白金系列为什么能够推广成功？因为利用了子女对长辈的爱。人们为什么会给自己的孩子买保险呢？那是因为人们希望他们的孩子受到保护，是他们对孩子的关心和爱。


    # 5.自我完善


    人们总是希望提高自己。他们到健身房锻炼是为了有个好身材。他们参加研讨会，是为了学到一些新东西，以帮助他们获得成功。“如何”类图书是销量最好的书。每天都会有很多人加入我的公众微信（微信号：LBC333），是因为他们想提升自己，想找到能够解决问题的方法，想获得更棒的直接营销资讯！


    # 6.想要赢'
  merge: -1
  img_proc: true
- pgno: 30
  md: '大多数人都有着强大的竞争本能。人们竭尽全力要赢比赛，不管是在体育，还是在业务，在爱情和生活方面都一样。没有人愿意被称为“失败者”。


    人们希望自己是最好的。他们要得到比赛的胜利，或者他们只是想知道他们是令人满意的，这就是他们拼命的最好理由。


    当然，这还不够的，李娜成为了我们中国最好的网球球员，但是她现在在希望成为有史以来世界上最优秀的球员。难道她之所以这样想是因为她想赢得更多的声誉或更多的钱吗？是否获奖就让她感到优于其他人呢？


    我不这么认为。我想她是给自己树立了一个目标，然后只是想要实现这个目标。她是个完美主义者。她觉得自己可以做得更好。


    获胜的欲望会导致人们购买最好的设备，得到最好的老师，买关于这个问题的最好的书籍和视频讲座等。我们希望我们的孩子获胜。我们希望我们的球队获胜。我们大多数人的好胜心促进了体育行业的发展，以及我们经济的繁荣。


    # 7. 享受


    人们都希望过得舒服点。他们希望有一个舒适的床，舒适的椅子，一部舒适的汽车，舒适的鞋，舒适的衣服。人们希望拥有按摩浴缸。我们希望生活过得完美，即使是最轻微缺陷也是不允许的，因为只是为了使自己更舒适。我们要住更大的房间，等等。．．．．．人们似乎是在追求永无止境的舒适。


    # 8. 懒惰


    当然了，人们希望改善自己，他们也想获胜，他们更希望赚更多的钱。但只有在它很容易实现的情况下他们才会去做。


    ![](img/bad3db5bad4a507329ce36e284ce9980_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '**人是懒惰的。**人们希望不工作就能得到想要的结果。“30 天内不用节食或运动就能减掉 10 斤。只要吃这种药就可以了。”这是基本的宣传内容。


    # 9. 追求美好的经历


    人们想要美好的经历，他们想要记住一生美好的回忆。他们想要旅行的经历，教育的经历，家人出游，度假，烧烤，美味的食品，和好看的电影等等的经历。他们希望拥有激动人心的经历，放松的体验，社会经历，和娱乐经历。人们希望与亲人分享经历。旅行和娱乐行业是所有关于开发和销售难忘的经历的行业。


    # 10. 性


    人们想要更多的性，**更好的性生活。**人们想要自己更有吸引力和更加性感。在广告中，性也是无处不在，电影和娱乐行业也是这样，有时是公开的，有时暗示的。“性”这个词的吸引力是巨大的。


    # 11. 渴望关系


    人们希望交朋友。人们希望去约会。人们**希望浪漫**。人们希望结婚。人们希望与他人有关系。


    人们希望自己是一个团体的一部分。**社交网站**是互联网上最流行的。人们希望改善与子女和配偶的关系。当关系破裂时，他们会很痛苦。当与某人建立友谊的时候，是令人激动的时刻。大多数人不想独自生活在这个世界上。


    # 12. 愤怒


