  md: '但是现在，你只要将你的销售说辞都**转录到纸上**就可以了。


    是的，现在，你必须要考虑到，你的顾客并没有坐在你的面前。你无法和他进行眼神交流，你也无法看到他的穿戴怎么样，并且你无法向他提出计划好的问题。因此，你只要做到，使你的最佳销售说辞能够吸引到最普通的顾客群体就可以了。


    假设你正在与一位普通买者进行交谈——那么，你就要解释一下，如何满足普通人的需要，如何去处理最普遍的疑虑或异议。当你把销售信写完之后，记得要有一个段落，向读者解释清楚该如何订购。其中要附上你的联系电话号码，接听之后需要告知的信息，你是银行直接付款，还是货到付款等等。


