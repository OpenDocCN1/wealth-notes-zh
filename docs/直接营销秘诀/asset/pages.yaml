    110。


    你必须找到一个方法，主动和她搭讪，谈话中不带恶意，不需要女性承担任何风险。


    如果你能够和她说上话，下一步很可能是，不要请她出去吃饭，这样，进展太快。下一步，如果谈话进展顺利，你可能要问她是否愿意去星巴克喝杯咖啡。


    所以，你必须开始一段轻松对话，创造某种融合的气氛，然后再把关系发展到下一步——可能就是星巴克的那杯咖啡。


