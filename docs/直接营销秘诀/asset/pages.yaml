- pgno: 73
  md: '当然，他们之所以站在你面前的原因是，他们是在这条街的尽头以比原 价少 10%到 20%的价格无法获得同样的东西。他们知道你这里的 东西是最好的。他们想与你做生意。但他们是在欺骗你。他们正试图吓唬你
    来降低你的价格。


    如果人们真的只关心价格，人人都驾驶最便宜的车，穿着廉价的衣服， 喝最便宜的葡萄酒，并在最便宜的房子居住。你想一想，事实是，大多数 人不想要最便宜的东西。


    你想用最便宜的外科医生为你动手术？你想乘坐聘用了最便宜的飞行员 的飞机吗？还是你想要最便宜的律师处理你重要的案件呢？你想 雇佣最便宜的老师教你的孩子吗？你想住在最便宜的旅馆，看最便宜的
    电视？你希望在你的家摆放最便宜的家具？或者铺最便宜的地毯？你想 让你的房子刷最便宜的油漆？你想用最便宜的屋顶？你真的想要最 便宜的发型？


    人们想要高质量。人们想要优质的服务。人们希望方便和卓越的客户体 验。大多数人都明白，他们必须支付这些东西的额外的钱。他们还希望 同那些与他们做生意的人建立信任关系。


    但在与你的竞争对手的价格竞赛时这里还有另一个问题存在。


    如果你继续降价，很快你将没有足够的利润来提供客户要求和期望的服 务。你会发现你不得不开始走捷径，消减你的成本，否则你会倒闭。不 久，你的客户将开始发觉你的劣质服务并且离开。


    陷入与竞争对手之间的降价比赛是最可靠的破产道路之一。你的客户不 会欣赏你的低价格，但会怪你劣质服务，劣质服务，你没有任何办法， 因为你的价格太低了。'
