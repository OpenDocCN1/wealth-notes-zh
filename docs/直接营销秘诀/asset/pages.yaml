  md: '# 43、让顾客立即采取行动的小秘诀！


    亲爱的朋友：


    当你想要的一些东西，而**数量有限**的时候，它的价值就会**突飞猛涨**。


    事实就是如此——将一些东西限量销售，就会使其认知价值大大增加，从而使得大量的人开始抢购。


    无论多少人使用过这种策略了，它也“**永远不会**”失效。


    如果你能够找到一种方法，可以限制销售你所创造的每一样东西，那么，你就能比网络上99%的人创造更多的销售，并且比他们卖得都快。


    小米手机的促销就是一个非常棒的案例！


    虽然这种做法有一定的难度，因为你需要有能够不断销售的产品，有一定量的客户数据，但是你可以想出很多特别的东西，利用这种策略来销售。


    没有哪句话比“销售的东西数量有限”这句话，能够使人们的动作更快的了。尤其是当他们从以前的经历中了解，你所说的都是真的之后，他们就会急着购买。因为，当这些限量产品销售完之后，就真的再也没有了。


    如果你要利用这种策略，记得加上一个具体的数字。比如：限量销售500件。或者使用一个具体的时间。比如：北京时间晚上12：00之后，这种特价促销活动就结束了，该产品“将会从网站上下架”。'
