- pgno: 128
  md: '事实上，开创一个事业并不需要很多资金。你在这里学的一些基本的秘密将不止是弥补你没有办公室，没有职员以及资金的不足。


    **让我们开始吧。**


    下面将讲到的一些方法已经受到一些精明的营销人的青睐……尽管，以我的经验来看，这对大多数人来说都是一个惊人的启示。而且很容易做到。（提示：在你读完所有的步骤之前不要做任何决定。在你了解了所有步骤之前，任何的想法都会酿成大错。）


    **第一步，你不需要先确定要销售的产品是什么。不用。这是后话。你首先需要：**


    # ## 产品受众


    忽略这一步是很多新手犯的一个最大的错误。他们会这样说：“嘿，每个人都喜欢我的巧克力软糖。我应该开始销售它们，然后赚大钱。”


    这是逆向思维。常见，但有些落伍。


    现在忘掉任何实际的产品。你要做的第一件事就是**确认一群<mark>人</mark>**，他们拥有强烈的激情，并且舍得把钱投资到自己的爱好中去。


    试着去想象一个…对**自己的爱好饥渴上瘾，并有很强购买力的群体**。


    **<u>让我为你分解这幅画面。</u>**


    **饥渴**：他们不满足现在所拥有的。


    **群体**：一大群人。不要为一小撮人浪费时间。'
  merge: -1
  img_proc: true
- pgno: 129
  md: '上瘾：他们的爱好并非可有可无。他们对自己的爱好充满渴望。购买力强：他们肯定会买你的产品。


    了解这种渴望指数对做任何生意都关键。我的解释是：处于渴望指数最顶端的是上瘾者，他会为自己喜欢的东西付出一切。他沉浸在⾃⼰的渴望中，想尽一切办法来满足⾃⼰。


    你见过刚被诊断出患有心脏病的人吗？你觉得他会不会为找出治疗方法⽽⼼事重重？考虑一下人们最迫切的需求吧。肥胖的人拼命想减肥。破产的人想要更多的钱。秃顶的人想要头发。伤心的人想要快乐。


    处于渴望指数最底端的是无所谓的消费者。可口可乐、百事可乐、冰红茶、⾃来水……对他们来说都一样。要想把产品销售给对其毫不感兴趣的人就是徒劳。追逐小的或者购买⼒低的细分市场就是浪费时间。因此，现在以及以后都考虑那些具有以下特征的潜在客户吧！


    +   1. 有激情。

    2. 特定人群。

    3. 有购买⼒。


    我们不会把巧克力软糖销售给任何人。是的，有很多巧克力软糖迷，但是为此开零售店是有风险的做法。而且我们不是要试着把滑雪板卖给滑雪者。制造东西的成本以及遇到的一些令人头疼的问题会令人⽆法忍受，根本就不⽤考虑这个。


    但这并不是说你不能卖东西给这些热情的群体。只是我们要变得聪明一些了。进军任何狂热的市场最有效的办法不是销售诸如巧克力软糖或者滑雪板之类的东西。⽽是提供……独特的信息。'
  merge: -1
  img_proc: true
- pgno: 130
  md: '比如，如果你拥有现今最美味的巧克力【配制秘方】，它由瑞典科学家花费一亿美元悄悄研制而成，据说可以完全迷住巧克力迷，那会怎样？你觉得可以销售它吗？


    或者，如果你有【内部信息】，有一个尚未被发现的滑雪天堂，有一条秘密通道通往雪花遍地的山坡，有一个豪华的小屋，聚集着许多漂亮的女孩…有了这张秘密地图，你可以在打盹的空档就能到达这个地方。另外，你可以在那个滑雪天堂狂欢整整一个星期，花费不到
    1000 元。你觉得一个滑雪爱好者会为这个信息付款吗？


    你说你没有特别的信息？不要担心。我将向你展示怎样很快发现同样有趣的东西。耐心点。


    因为，你首先要【搞清楚】第二步：


    # 要想真正成功，必须……销售你喜欢的东西


    如果你不喜欢滑雪，或者巧克力软糖，那么让你的潜在客户相信你了解他们的渴望及激情的路上，你将走得很艰难。


    **你喜欢做什么？** 什么会激发你的行动力？你喜欢读书，或者插花，或者登山运动，亦或者喜欢照看孩子们？**列一张表，** 一张包含所有你喜欢的东西的表。具体些。不要写“观看体育运动”。哪项运动？职业网球？女子排球？汽车拉力赛？


    【成功的关键】——使财富变得如此美好——就是全身心投入到你真正喜爱的东西中。如果你讨厌猫，却选择了教养猫的人怎样讲猫语的事业，那么即使你赚大了钱，你也会过得很不开心。


    现在你处于一个有利的位置。你不执着于任何想法，任何产品，任何未来。现在你是自己【命运的主人】。【你可以选择自己的路。】'
