    在今早的时候，我看到星巴克门前有一长队的人**等**着去购买 35 元一杯的咖啡，但没有多少人排队买临街的咖啡。我碰巧也喜欢临街那家的咖啡，但显然只有我。大多数人想要星巴克的。


    星巴克咖啡是真的要比临街的那家好吗？（我喜欢星巴克，而临街那家的咖啡也很棒！）我承认星巴克咖啡是好的，但我认为绝对没有比临街的好到 200% 以上。我想，也许顶多好
    10%。人们大多数在星巴克的另一个原因是，它能带给人们**一种体验**。星巴克销售的不只是咖啡。一些人认为，星巴克卖的是一种**生活方式**。


