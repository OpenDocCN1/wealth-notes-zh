- pgno: 119
  md: '但是，愿景不是钱或者一个销售目标。你对你可能达到的高度，以及你能为他人带来什么，必须有一个明确的看法，你必须知道怎样去达到这些目标。这需要从你相信你的愿景将会帮助别人，而不是为自己赚钱开始。


    第三，专注。一旦你将目的地地址输入GPS，你会仔细听导航语音，跟着它的指示走，对吧？愿景也是这样。一旦你有了一个愿景，一个你坚信不疑的愿景，你就会发现不经意间你已经开始高度专注于你的目标的价值了。


    你开始从客户角度为你的产品或服务创造价值，并且想办法去提升它的价值。你将留心每一步，确保每个人都能像你一样理解它的价值。


    第四，投入。一旦你有了清晰的愿景，并且专注于它给别人带来的价值，你将会完全地投入。你绝对不想轻易放弃。


    试试这个：在你大脑中看到自己实现愿景享受成果的画面。想像一下，你不去实现你的愿景又会是结果什么样。在接下来的30天里，你每天早上都要在大脑中看到这个画面。你将发现你的潜意识将接管这一任务，你会清楚地认识到你每天要采取的具体行动。


    第五，行为准则。还记得前面提到的GPS吗？当然，你将根据它的指示一步步走向你的目的地——但是你不能忽视红绿灯，也不能忽视路上的行人，对吧？每个读过《龟兔赛跑》的故事的小孩都知道，如果你遵守路上的规则，你将更快更轻松地到达目的地。


    全身心地投入为他人服务的工作中，就意味着你所做的一切都是在追求卓越。你的整个目标就是帮助别人，使他们的生活更好——如果在这过程中，你失去了正直，你将无法做到这一点。遵守行为准则，让你的目标显示出它的价值。'
