- pgno: 153
  md: '在美国有一家公司通过**一套视频**售出了很多的艺术品：他们这套视频售价 15 美元，在视频里讲述了关于艺术品的一些知识，当客户看到这些内容后就会对他们的艺术品产生兴趣，而直接订购。同时，他们订购艺术品可以退还视频套装，得到全额退款。


    不要盲目地以为，有了传统的宣传小册子就有了一切，因为其他人也都在这样做！


    真诚的，


    # P.S. 让我们一起来总结下避免犯这 10 个错误的指导方案：


    +   在宣传册开头或标题的位置使用一种特别的叙述，引起潜在客户 的兴趣。


    +   为不同的市场环境设计人们最可能接受的宣传册——比如，面对比较“冷淡”的潜在客户或者已经很了解你们的人，可以使用邮件或者亲 手发宣传单等等。


    +   使用你的客户都能够看得懂的语言，来列出你的产品或者服务的优 点。


    +   如果可能的话，为每一种目标市场设计一种完全不同的宣传册。


    +   一定要保证宣传册印刷得清楚、干净、整齐、漂亮。'
