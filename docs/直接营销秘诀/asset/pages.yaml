- pgno: 181
  md: '阅读完销售信之后，他应该做些什么事情呢？


    每当你开始撰写销售信的时候，你要记着一个最重要的问题：你在信中**所说的每一句话，使用的每一个词或短语，必须推动读者采取你希望的行动**。当你的销售信写完之后，你要看看其中的每个要素，它们
    是使顾客离‘你最想要的回应’更近了，还是更远了。


    在读者读完这封销售信之后，你想要让他做些什么呢？


    # 收集产品信息的一些更好的方法


    **如果你的产品在展会上展出，那么，你要听一听来你的摊位上参观的人之间的谈话**。听一听他们提出的问题。这些问题，便是你在销售信中应当回答的问题。


    你还可以听一下你的**优秀销售员与潜在客户之间的通话**。这样，你对潜在客户的**兴趣、关注点、反对意见以及敏感**的问题，就会有更加真实 的感受了。


    要**亲自去调查**你的客户，他们对你的产品到底感觉如何。询问一位客户，你**是否能够亲自看他是如何使用你的产品的**。


    你自己也要使用产品，并且**记录下你自己的感受**。


    把你的产品提供给一位典型的潜在客户，看看其使用产品时的反应。


    **对你的竞争对手进行调查 研究**。


    你要使自己的销售信与竞争对手的不一样——**要有自己的特色**。'
