- pgno: 96
  md: '互联网就像是个巨大的名片夹。在这个名片夹的世界里，你必须很容易被找到。所以，你的综合网站是专为那些专门找你的人设计的。


    每个公司都需要一个综合网站。这个网站的目的是展现你和你公司的专业形象。


    当人们想了解你和你的公司时，他们首先会去网上查找你的网站。如果你没有网站，或者你的网站设计得不好，给人印象不深，人们会觉得你的公司不是真的。


    在许多情况下，人们会根据你网站的外观和感觉，去评判你。你的综合网站能够使你的小生意，看起来像世界最大的公司一样强大。


    那么，一个综合网站应该包含什么内容呢？


    这要看你处于什么行业。但是大部分的综合网站，都包含以下基本要素：


    +   1)  简单明了地介绍“你是做什么的”


    对一个综合网站来说，要做到这点可能很困难——如果你的企业涉及许多不同的业务，更是如此。


    回到谷歌的例子。谷歌涉及许多不同的业务。但是我们想到的主要业务是搜索引擎。关于你和你的公司，你希望你的客户和潜在客户知道哪一件事呢？


    如果一张保险杠贴纸无法容纳你的业务，那么作为一个企业，那就麻烦了。我希望人们打开我的网站，就明白我是“揭露最真实，最赚钱的营销秘诀”的人。'
  merge: -1
  img_proc: true
- pgno: 97
  md: '其实现在，我除了做营销咨询外，我还做许多其他的工作。但是，大部分人知道我是位直接营销咨询师……因为多年来，我的营销策略和点子，已帮助了 1700 多家中小企业，使他们的利润增加了
    30%-500%。


    如果你无法用简短的词描述你的业务，说明你的营销有问题。你对业务的描述必须像保险杠贴上的文字一样简洁。


    你不希望你的网站访客们，到处搜寻，试图弄清你是做什么的。


    # 2) 你的凭证和记录


    一旦你的访客明白你销售的主要产品或服务，你就需要介绍你的产品或服务已经为顾客带来了什么。我的网站上，人们查看李炳池到底是谁时？首段写着：“在短短的 5 年内，李炳池帮助了
    1700 多家中小企业，创造了 27 亿的销售额！。”


    这段话旨在，给那些正在寻找直接营销文案写作和咨询的人，留下深刻印象。还有在网站中包含“案例分享”，也能加强你的宣传。


    # 3) 推荐信


    仅仅声称你有某某记录是不够的。你还必须证明其真实性。你可以使用客户的证词和推荐信。如果你的推荐信来自某个专家和权威人士，那就太好了。加入音频和视频形式的“推荐信”，也会很有效。要确保推荐信的内容正是关于你所销售的产品的。不要过多地谈论你，而要说你的主要产品或服务已经为客户带来的成果。推荐信内容越详细具体，越好。


    # 4) 销售的产品或服务'
  merge: -1
  img_proc: true
- pgno: 98
  md: '你销售的物品需要涵盖**高低价位**。如果你是名顾问，你不仅在销售咨询服务，还要出售你的**相对便宜的书籍和专题报道**。


    这些出版物（你所著的）不仅将帮助你定位为你所在领域的专家，而且这些低价的物品将帮你**更快捷地发现你的买主**——那些真正对你出售的主要产品或服务感兴趣的人，也就是你的准顾客。你的综合网站就像一个商店。店内的产品应该聚焦在某个类别里。你不能期待在杂货店，买到一辆汽车。


    # 5) 联系的多种方式


    我很惊讶，在很多网站上，很难找到联系真人的方式。大部分的网站没告诉我，这个公司或地点背后的人是谁。他们联系的唯一方式是用邮件。人们不想和网站做生意。他们想和人做生意。


    不要把你的网站当做一种逃避客户和潜在客户的方式。要让人**容易找到**。在每一个页面上，加入你所有的、任何一个实体企业都应该有的基本联系信息。包括电话号码、邮件地址，和实际通讯地址。也许，你的访客想到的第一个问题是：“你是真的吗？”你需要看起来，表现得，而且事实上是真的。当然，如果你只是展示形象，而不销售任何产品，那么你可以不留你的联系方式。


    # 6) “关于”版块


    “关于”页面或版块往往包含领导人的介绍，公司使命宣言等。领导和主要员工的照片能帮助传达这样一个信息，即这是个有真人的公司。你的顾客想和真人、真公司做生意，而不是“虚拟作”企业。'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 7)  常见问题与解答（FAQ）版块


    一旦你的访客对你的产品或服务感兴趣，他会开始研究你能为他做什么。他会**提出问题**。你知道这些问题是什么，因为你一直在回答这些来自客户和潜在客户的问题。把这些**问题放到
    FAQ 版块**。你的潜在客户能**轻松自在地研究你的公司**，看看你能为他做什么，而不用承受来自销售人员的销售压力。


    FAQ 版块还能节省你和你员工的时间。最后，你只需要跟最合格的潜在客户交流，他们在决定给你打电话之前，很可能已经认真查看了你的网站和 FAQ 版块。


    FAQ 的营销力量经常被低估。企业和网站设计者们常常把 FAQ 版块当做补充。但是，这可能是你**最有效的销售版块**。


    # 8)  文章版块


    该版块应该<u>**定期更新**</u>——如果可行的话，每天一次。它不仅将帮助加强<u>**你在你所处领域的专家地位**</u>，还能给你的访客一个<u>**定期回来访问你网站**</u>的理由。更重要的是，文章在<u>**搜索引擎中排名会靠前**</u>。


    人们在网上时，他们寻找的是关于某一**具体话题**的信息。搜索引擎会把这些人引导到文章上，因为这正是人们重视的——人们寻找的正是准确的可靠信息。如果你的网站上包含关于某人所搜索的主题的文章，你的网站（或者网站上的这些网页）很可能在搜索结果列表中排名靠前，这能免费为你的网站创造浏览量。


    # 9)  选购你产品的便捷方式'
  merge: -1
  img_proc: true
- pgno: 100
  md: '确保你的网站**随时准备**做生意。要有购买商品的购物车和商家账户。确保你宣传的每个产品旁，都有一个“**在此订购**”的链接或按钮，能直接把你的顾客带到**订购表**处。使人们能**很轻易进行订购**。不要向你的顾客提出不必要的问题。把订购表做得尽量**容易填写**。人们会因为程序复杂而懊恼，从而放弃填写订购表，撇开购物车。


    # 10） 关于你产品和服务的详细信息


    你的主要产品或产品清单应该**很容易被找到**。把你的主页当做作杂志或报纸上整版的陈列式广告。你的广告可能主要宣传一种产品。**记住**，你需要把你的主要广告做得简单。但是，你的其他产品也应该**能够轻易找到**。比如，你可能有个目录式的页面，上面展示着产品的缩略图，旁边有简短的文字描述，可以链接到一个带有完整的产品描述的大页面。


    # 11） 价格和“如何收费”


    你的潜在客户希望知道**你的产品或服务是多少钱**。然而，这恰恰是许多网站上最难找到的一条信息。如果我无法轻松发现产品或服务的价格，就会假定它一定很贵。


    每当我发现唯一的价格信息，是一张我必须填写才能要求公司给我发送一份报价单时，就会失去兴趣。我何时能收到？今天晚些时候？明天？下周的某个时间？


    人们上网时为了**立刻找到某东西**。他们想立刻找到所有信息。不要隐藏你的收费。要**坦率、直接、明确**。价格和你的收费标准是访客希望知道的最重要的信息之一。


    # 12） 提供珍贵免费礼品的注册表'
  merge: -1
  img_proc: true
- pgno: 101
  md: '你网站上的每一个页面都要有一张\underline{显眼的注册表}，因为网络营销的\textbf{成功密钥}是获取访客的姓名和邮箱地址——可能还有其他联系信息。你应该提供某种免费的有价值的礼品，\underline{激励你的访客}去填写注册表——可能是一份免费电子书，或免费订阅你公司的电子报。你的免费礼品应该和\underline{你销售的产品和服务完全一致}。这是你建立客户列表的方式。


    注册表对于我的互联网营销策略至关重要，我所有网站上的每一页都有一份——\textbf{注册邮箱，或者是加我的微信：LBC333}。这是因为我的互联网营销策略的出发点是获取网站访客的邮箱地址和微信帐号，以便通过\underline{营销通讯、微信}，\underline{当然还有促销活动}，进行跟进。在以后的营销通讯中，我会详细讲解这个非常重要的方面。


    如果你要发行电子杂志或电子报，你可以聘请一位绘图设计师，来进行基本的版面设计。然后，你只需把文章粘贴进去即可。你的网站也一样。


    尤其是你想让自己的综合网站呈现出\underline{专业形象}，但别让网站设计师太过艺术化。\textbf{记住：简单、干净、专业才是较好的选择。}


    顺便说一句，你可以在 www.zhubajie.com 找到很多网站设计者。如果你想要更高级别的，你还可以到 www.eLance.com 上找到许多出色的网站设计师。你会发现这些设计师中有许多是来自发展中国家——比如印度、东欧、俄罗斯和亚洲各国。


    下面是国外一些综合网站的经典例子：


