    # 10、销售信中最重要的起始段


    亲爱的朋友：


    在整个销售信中，除了标题外，首行（起始段）是最重要的一行。有时我将花费几个小时，甚至几天去思考最重要的开始。


    如果我有一个好的开始，其余的内容往往很容易写。看起来是自动完成。如果你有一个正确恰当的开始句，那么下面的每一句话都会是那么的流利通畅。


    如果其余的内容让你很难写的话，你应该知道你的第一句就已经写错了。事实上，如果你的信很难写，即使写出来也会让读者很难理解。或许你应该停止写作，返回到开始。


