  md: '# 一个传奇故事


    美国金融家杰·古尔德（Jay Gould）有一个传奇故事。有一次，他的牧师在祷告后，问他如何投资自己的3万美元。古尔德告诉他，“买密苏里州太平洋那支股票，一定要保密”。


    过了一段时间，那支股票真的涨了，但并没有一直保持这个势头，最后崩盘了。他的牧师坚持了太久，几乎输光了一切。当他告诉古尔德这个消息时，古尔德立马为他的损失开了张支票。牧师坦言尽管古尔德让他保密，但他还是向大部分会众透露了消息。


    古尔德告诉他“哦，我早就猜到了，并且我跟进他们的股票”。


    这种推荐节省了与客户建立信任的所有步骤——这些步骤可能需要几年，甚至上百万美元才能完成。一个简单的推荐可以立竿见影，并且有很好的效果。


    真诚的，


    # “每天都在思考如何做事更省力”


    P.S.尽管开拓市场花费了一部分，并且这部分投资所带来的回报是丰厚的，要比盲目的做广告所获得的回报大得多。当你推荐人的客户蜂拥而来时，你一定会获利并且持续获利——回报滚滚而来。记得加我的公众号：LBC333，会有更精彩的秘诀给你！'
