  img_proc: true
- pgno: 104
  md: '在所有的石头中，钻石并不是真正稀有的。但 DeBeers（戴比尔思）想出了如何创建一个近乎垄断的钻石生意。戴比尔斯创造出钻石，不仅是稀有珍贵，更是男人对女人表达爱的一种方式。“钻石恒久远，一颗永流传。”


    因此，与竞争者相比，价格不是根本的问题，而是产品在人们头脑中的位置。


    在你开始对产品和服务营销之前，你必须明确你的“定位”。


    Gucci 不是在卖鞋子和手包，而是在出售形象和地位。DeBeer 卖的不是清纯的闪亮的石头，而是在出售“证明他爱我”。


    # 找出你的定位


    是什么让你的业务与众不同，你的产品，还是你的服务？是什么让你的产品与其它产品不一样？是什么使你不同于你的竞争对手？


    我们都一直在强调“独特的销售主张”这一词汇。但是，我发现很少有企业可以在 50 字内告诉我，为什么要选择你的产品而不选择其他的产 品。


    所有这一切都需要去思考。


    也许使你不同的是，你是本地的经销商。或者，也许你是不同的，因为你 是外国进口的。也许你的优势是，你是小的，或者你是大的。也许你 的好处就是，你的员工很有“经验”，或你的工作人员年轻和充满活力。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '我的定位就是**直接营销**，直接能够得到客户回应的营销，不是品牌形象类的营销。我的广告语是：“**揭露最真实，最赚钱的营销秘诀！**”，你会发现我的“营销通讯”或者我的“公众微信（微信号：LBC333）”所公布的内容，都是最直接，最真实，最能帮助赚到钱的方法和策略。


    当然，无论做哪类营销，首先必须有很好的定位，必须与竞争对手不同，而且符合市场需求。如果我定位做成品牌营销会和很多国内其他老师竞争，结果将是毫无希望的。因为它就像是试图和可口可乐竞争可乐饮料的市场一样。


    是的，其他公司都是这么做的。百事公司做了几十亿美元的广告。当然，百事可乐是绝不会超过可口可乐的。百事公司将永远是**可乐饮料的老三**，至少在我们的有生之年是这样，而这不是坏事。


    百事可乐与可口可乐之间的不同也是存在的。百事从来没有说和可口可乐一样。百事可乐是“不甜腻，”有一个“更清洁，更爽口”的感觉，“选择70民众品尝测试的结果得出，”以及一个属于“**年轻一代**”的产品，是该公司的口号。


    但我们大多数人并没有数十亿美元去和可口可乐竞争。


    因此，我们**需要做不同的事情**，我们要做一些其他大型集团未完成的事情。


    因此你必须想出，或者做出与你的竞争对手不同的事情来，这样才能为你带来客户。当然了，你的定位必须符合市场需求，适宜于销售，必须与众不同。没有人会随便买一款手机，他们会选择要哪种类型的。


    真诚的，'
