- pgno: 107
  md: '2. 如果你能够亲自去接近一位顾客，那么，你便掌握了在同一时间向其它上千名顾客销售的关键。还有……


    3. 将销售效果倍增的方法是：“旧酒装新瓶”，只需将证明过的销售方法转化为书面广告就可以了。


    广告只是印出来的使“销售效果倍增”的销售术。你对站在你面前的人使用的销售说辞，与将要在广告中使用的面对大量的人的说辞几乎是相同的。


    一位杰出的销售员，每次都只能接待一位顾客，这样一来，由于时间的限制，他每天能够完成的销售额也就有限了。但是，一则好的广告却可以一周七天、每天24小时进行工作，这样一来，在一天之中将产品卖出的数量就比亲自接待一年的顾客数量还要多！


    而这个技巧是这样的：


    首先，用录音笔或手机（现在手机上的录音系统也很棒！）将你的销售说辞录下来。无论是你，还是其他任何人，只要是生意中最棒的销售员，就要将他们在实际销售过程中使用的销售方法和说辞录下来。无论是通过电话、还是在工作间，或是在午餐销售时都可以。


    你很可能要将销售说辞录上好几遍。因为在最开始录的时候，你会有一种高度“在讲台上”的意识，知道录音机在录，所以自己会显得有些不自然。而在最开始几次结结巴巴之后，你便会忘记正在录音这个事情，完全掌控自己的销售说辞。这样一来，录下来的东西就会非常棒。


    接下来，你要做的是将录音内容转录一下。让人将其逐字地打印成文，认真地编辑，将那些嗯啊啊啊和结巴不清的地方、不相关的聊天（例如，'
