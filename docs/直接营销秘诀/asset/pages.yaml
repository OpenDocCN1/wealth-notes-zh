- pgno: 71
  md: '# 13、避免大减价的陷阱


    亲爱的朋友：


    我看到有很多公司都陷入了这样一个怪圈，他们总是试着将价格降得比他们的竞争者还低。


    你会经常看到这样的广告，说：“最优惠的价格”或者是“价格保证全国最低，假如发现其他地方比我们的便宜，请您告诉我，经我们确认，我们将返回现金给您”。这是一种巨大的营销错误。


    **_绝对不要_**讨论哪家公司——你或者是你的竞争者——拥有最低的价格。


    绝对不要陷入价格战争当中。


    事实上，在决定某人是否和你做生意的因素中，价格是**_最不重要的因素_**。你所期望的顾客主要是对**_质量_**和**_价值_**而不是**_价格_**感兴趣。所以不要考虑你能在降价上花多大力气，而要思考如何能为你的顾客提供不断提升的价值。


    **_研究表明_**，在价格降低1%，公司平均利润就会降低8%。这意味着降价10%的话，80%的利润就会丢掉。这个数字取决于你所处的行业，但问题是，即使是最小的降价，往往会给你带来经济损失。


    如果你的利润率为20%，10%的降价意味着你刚刚失去了一半的利润。但是，大多数企业经营的利润不到20%，因为他们总是在与他们的竞争对手不断的打价格战。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '现在，让我们看看你的价格提高10%会发生什么。那样的话，如果你原来的利润率为20%，现在它就是30%。你通过提高10%的价格增加了50%的收入，这些你的客户和顾客是不会注意到这些的。


    每个在读这份<font color="#05d943">营销通讯</font>的人都应当马上提高产品价格的10%。这是<font color="#51f407">最快、最简单</font>的提高你的赢利能力的方法。


    有了这个价格10%的上涨，如果你失去了三分之一的客户，你会一样有利可图的。最有可能的情况是，你不会失去任何的客户。事实上，在六个月内将你的价格再提高10%，看看你是否失去了某些客户。如果你有一个运行良好的企业，提供优质的产品，服务和价值，你就会越来越好。


    所以，现在你连一个新客户也不用增加就在<font color="#44d7e8">6个月内将你的利润翻了一番</font>。


    # 人们究竟想要从你那里得到什么？


    绝对不要让你与客户的谈话集中在价格问题上面。你也不想和那些折扣寻找者和价格兜售者做生意的。这些人带来的麻烦总是大于他们的价值。他们会拖累你的。你几乎肯定会因为向这些客户提供服务而失去你的利润。


    如果有人对你说，“我能在这条街的另一头得到同样的东西，价格比你这里的要少10%到20%，”你的回答应该是，“哦，那你可以去他们那里买？”'
