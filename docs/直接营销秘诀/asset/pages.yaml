- pgno: 122
  md: '伟大的销售员**知道的更多。**他知道，**人们持怀疑态度是非常正常的**。并且，人们都很忙。还有，他们完全不关心你想要的是什么。他们都沉浸在自己的生活和需要中。


    但是，当有人为他们解释产品的情况，告诉他们`不用承担任何风险`，并且在他们内心最深处、最自私的欲望已经被`挑逗出来`的时候，他们就会被说服。


