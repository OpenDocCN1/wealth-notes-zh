  md: '# 23、透露销售信通用模板


    亲爱的朋友：


    你读到的这份“营销通讯”绝对是“有效的”。它是我撰写销售信常用的模板，也是世界级大师们惯用的方式。


    该模板看起来比较简单，但它很实用。而且，你也可以将其运用于其它的广告中。


    如果你真的急于写一封销售信，那么你现在就可以用这个模板写一封不错的销售信。


    以下便是模板：


    1、上标：


    在首页顶部写上简短、精炼的“上标”标题，首先先卖个关子，像：


    “两千万满意的客户已经知道的，你还不知道？”


    或者：“最重要的是，你可以免费得到它！”


    或者：“隐藏的机密文件，揭露了在营销中缺失的重要一环！”


    2、主标题：


    这里填写的是你号召你的目标受众。如果可以，尽量使其个性化一点。至少，表明你的受众是谁，你想从他们那里得到什么：


    “在你读完这则信息之前，千万不要考虑在北京买房子！”'
