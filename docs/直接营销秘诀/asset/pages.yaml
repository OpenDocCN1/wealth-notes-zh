    # 47、文案“TMD”太重要了——成功写作的真正秘诀！


    亲爱的朋友：


    如今，文案“TMD”太重要了！


    你的微信，电子邮件，竞价广告，网页等等...反正一切与互联网有关系的内容，都需要文案来体现。顾客需要透过你的文案才能了解到，你到底在做什么？


