- pgno: 55
  md: '# 9、直接营销中最重要的词


    亲爱的朋友：


    直接营销不是猜测。也不是搞创造，搞发明，发现新的尖端产品，或者涉足别人从未涉足的新领域。


    直接营销是一门科学，是通过反复试验和从错误中发展起来的。我们知道的大部分都来自于我们过去的成功和失败。在直接营销中被证明正确的方法，都不是假设和猜测出来的。是通过：


    # “测试”


    谁会想到长信比短信会更有效？通过不断的测试得到的结果。当然，长信也不是任何时候都有用。我们怎么知道的？通过测试的结果。


    我们知道调查有用，抽奖比赛有用，会员制有用（根据情况而定）…都是因为测试。


    在我们测试不同的价格之前，我们怎么能知道定价多少？我们怎么可能知道不同的组合激励措施将会产生大量的订单？我们的潜在客户是更喜欢使用信用卡获得免费飞行里程，还是“现金返还奖励”？我们不测试就不会知道。


    我们有一些理论依据，我们可以做出有一定道理的猜测。但是只有一种方法能检验我们的猜测是否正确：测试。没有测试结果，没有数据，我们就是在盲目行事。即使是最专业的营销专家，也不得不在测试前低头。


    56'
  merge: -1
  img_proc: true
- pgno: 56
  md: '通常，一封私人化的信件将比非私人化的一开头就是“亲爱的朋友”的信产生更大的回应，但并不总是如此。


    直接测试也证明了其他结果。但是结果会因为不同的列表，不同的邮件或者不同的提议而可能不同。测试不同的标题。测试不同的格式。测试各种报价和订单组合。测试颜色和字体。测试参数和原因。最重要的测试是测试列表和列表分类测试。


    每发一次邮件，你都应该抓住机会测试一些什么。从统计上说，你的每个测试只需要大约有50个合适的回应就足够。如果你期待有2%的回复，就需要有2500个测试样本。


    测试样本越多，统计数据的效果越好。但是即使是小的测试，通常就能获得答案。


    在这个行业12年了，我依然会对测试的结果感到惊讶！


    永远不要假设任何东西。当你仔细想想，直接营销确实是不会给你带来什么经济上的灾难，因为你得不到测试结果就不会投入大量的资金。如果测试是直接营销中最重要的词，那么“假设”是最危险的词。假设将导致经济灾难。


    祝您测试成功！


    真诚的，


    测试的信奉者！'
  merge: -1
