- pgno: 50
  md: '# 向客户“加值”时的指令


    想让客户接受“**加值销售**”，**指令非常重要**。你的指令可以是，当客户在买单时，你给他的一个小建议。如：“先生，只需再加一元钱，就可以换成大杯的！”


    你要**斟酌好你的“指令”，尽量让你的这个指令可以让你的员工都可以使用，越简单越好**，这样，即使最低级别的员工也能很有效地使用起来。


    现在，你有了一个让人很满意的指令，这个指令做得很成功，把它列入你的营销计划中去。


    **怎样才能测量和控制这个指令呢？怎样才能知道这个指令能有效地工作呢？**你可以对定期来购物的消费者进行测试，查看员工“加值”的销售记录，并把这些数据制成表格。当你发现人均“加值”销售量下降时，就要做调整。直到销量上升为止。


    这些简单的建议性的“指令”具有**神奇功效**，这会让你惊叹不已！现在，让我们来看看另一种方式——向上销售。


    # 运用“向上销售”，利润不请自来


    “**向上销售**”，指的是向客户提供更贵，更高级的产品与服务。很多人都认为，向上销售就是劝服顾客购买同一产品或者服务的高级版本，或者是附加版本。


    向上销售的关键，就是“**价值商数**”。价值商数=感知利益/价格。当价格保持不变，感知利益上升，价值也会上升。“向上销售”的目的就在于，试着将感知利益的增加量，大于价格的增加量，这样的结果就是，价值商数增高了，那么，这就是一个成功的“向上销售”。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '让我给你举一些例子，假设你的客户来到你的家居店，准备买一个 5000 元的浴缸。作为一个有经验的向上销售员，你应该向他推荐一款 8000 元的浴缸，你要向他解释这
    8000 元浴缸的所有附加价值。


    比如说，这个款式有什么样的不同好处，而且还有一个更好的付款方式（每个月只需支付 80 元，你就可以拥有...），除此之外，还加送一系列附加的免费赠品（如果你买
    5000 元款式的话，这些赠品还需要额外购买）等等。


    要尽量对你的产品附加价值，直到你的顾客无法抵抗这样一个诱惑为止。


    # 成套产品的向上销售


    如果你有一个定价更高的成套产品或者服务（我希望你会有），为什么不向你的客户展示你的成套产品呢？以下是一些简单的成套包装产品例子：


    +   1. 更换机油，推荐整个引擎检查服务；


    +   2. 购买我的某本书籍，可以推荐我的全集；


    +   3. 单次美容护理，推荐季度或年度套餐；


    +   4. 买电脑桌，推荐办公套装；


    +   5. 假期游玩，推荐高级酒店+休闲活动


    以上的方法是提供一个价格更高的套餐，而且套餐中的内容却是顾客们平常都会消费的，并且这些套餐还要有相当诱人的折扣价。


    你的向上销售策略也要提前计划好，设计好向上销售指令，激励你的销售员卖出更多的产品。除此之外，你还要让你的这个促销方案看起来非常诱人，并且有新颖性，不然的话，你的向上销售计划有可能会失败。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 其他一些向上销售的方法


    除了销售人员亲自销售产品之外，还有很多其他的方法。其中的一种小技巧，就是当你的网站访问者点击了“订购”的链接时，弹出一个向上销售的网页，在网页上放一封简短的销售信，顾客凭这封销售信，就有资格购买你正在销售产品套餐的高级版本，或者附加版本。


    如果你是使用线下直接邮寄的话，你可以把向上销售的套餐表格放在一个小信封里，把小信封附在销售信的里面，这样既有神秘感，又可以区分主次套餐。


    一旦你的潜在客户从你这买了产品，就把他们添加到你的客户数据库里，每隔一段时间就可以向他们发送一些向上销售的套餐项目。


    比如说，假设一个客户从你这买了一款手机，一个星期后，你就可以发信息告诉他：“我们公司新推出了和你上周手机相配套的高度重视个性化的外壳...”第二个星期，可以推荐给他一个手机的储电器等等。


    # 高效交叉销售的魅力与艺术


    交叉销售和向上销售很相近，但它们之间却又不同。交叉销售是指让消费者花费更多的钱来购买已经买过产品以外的其他类型的互补产品。一般来说，交叉销售是建立在你和客户已经建立起了良好的关系，客户从你这购买了多次的产品与服务，然后展开的交易。


    交叉销售，也是后端销售的一种。


    要想建立你的交叉销售系统，你應該要开始建立“交叉销售清单”。


    如果我是卖洗发水的，我的交叉销售清单可能会包含：


    +   1. 护发素'
  merge: -1
  img_proc: true
- pgno: 53
  md: '+   2. 营养焗油膏


    +   3. 保湿啫喱，等等。


    如果我是卖营销课程的，**交叉型销售清单**可能会包含：


    +   1. 广告文案写作课程


    +   2. 直接营销课程


    +   3. 销售信写作课程，等等。


    如果我是一家害虫控制中心，交叉清单可能会包含：


    +   1. 树木修剪服务


    +   2. 草坪护养服务


    +   3. 景观美化服务，等等。


    如果你没有其他**附属的产品**，怎么办？


    一个常见的问题，一些只卖单品或服务的企业主，并没有后端的产品。


    如果你也属于这种的话，那么你可以**代理其他人的产品**，或者是和其他有提供一系列产品或者服务的公司**一起合作**。如果你的客户忠实于你，并且信任你的话，他们想要某些产品或服务首先也会找你来购买或咨询。


    你和客户之间的关系是**非常珍贵的**，并且有价值的。这种价值就是“**客户资产**”，这就像和你家里的资产一样重要。


    # 向下销售——鲜为人知的心理把戏'
  merge: -1
