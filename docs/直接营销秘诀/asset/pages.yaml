  md: '+   6.  在宣传册印刷之前，请人先检查一遍，看没有任何拼写错误和语法问题。


    +   7.  确保潜在客户或客户需要了解的每一个细节都已经包括在内。


    +   8.  记得要号召人们采取具体的行动。


    +   9.  邀请他人来填写订单表进行测试，确保客户能够很容易地填写。


    +   10. 根据不同的情况，尽可能多尝试不同类型的宣传册。


    # 28、关于 PPC 广告的一个重要错误


    亲爱的朋友：


    昨天，我和一位在外贸行业做得非常成功的朋友聊天，问他的网站是如何推广的，最好的推广方式是什么？


    **猜一猜**，你知道答案是什么吗？是的，最快，最直接有效的推广方式是 PPC 点击付费广告。对于全球市场来讲，谷歌推广排第一，在国内百度推广领先。


    但是，现在<u>关键词的价格越来越高</u>，为了降低你的潜在客户的流失率，除了你的广告文案写得好外，还有一个最重要的因素要注意，那就是：


    不要把你的广告点击者带到你的<u>综合网站</u>的主页上。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '这至关重要。


    我发现，如今依然有太多的网站再犯这个错误。


    你要把他们带到一个和你的 PPC 广告话题完全相关（甚至不能有一点偏差）的着陆页面上。


    确保把搜索者所输入的关键词，包含在你的 PPC 广告的标题中，也要包含在着陆页的标题中或者重点段落上。


    搜索者所输入的关键词、你的 PPC 广告以及你的着陆页所描述的应该是同一个话题。


    当某个搜索者在搜索引擎中输入你的关键词时，标题中带有那些关键词的广告就会出现，搜索者的反应将会是：“太好了。这好像就是我在找的。”


    然后，搜索者点击你的标题，查看你的网站。你要想成功，你的着陆页必须是你 PPC 广告的延续，标题中要有同样的关键词。


    如果你把搜索者带到你的综合网站的主页，他就会感到困惑，因为那个主页上可能有各种各样其他商品、宣传和链接。这会使搜索者产生困惑，感到失望。


    要保持简单一致。


    # 人们在互联网上的行为模式


    156'
