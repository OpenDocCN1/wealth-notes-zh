    逻辑思维会告诉他们，这个人很丑，或者没有理想的身材，或者只是一个收入微薄的看门人，然而，当他们发现自己完全无视这些逻辑，而被这个人强大的自信所吸引的时候，连他们自己都觉得惊讶。


