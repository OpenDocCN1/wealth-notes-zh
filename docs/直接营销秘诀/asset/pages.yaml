  md: '对于一名接触高尔夫时间不长的爱好者来说，在正确的指导下，经过一段在练习场和实地下场的练习，突破一百杆并不是很困难的的事情。但是如果想要更上一层楼，突破九十杆并且稳定下来的话，则不是很容易的事情。


    高尔夫球手平均水平看来绝不能称之为专家。他可能通过订阅高尔夫球杂志，甚至是定期观看高尔夫球频道来学习怎么打高尔夫球。


    但是，你知道吗？对那些高尔夫球潜规则他一个都不知道。他不知道什么时候该使用封闭站姿还是开放站姿。不知道计划，观察，评估，运用合理的战术和策略，最大程度的减少杆数。都没人写一本关于高尔夫新手的书来提高他的球技。


    嘿，你可能就是那个人。这没关系。因为，你要知道，把高尔夫专家和“笨蛋”区别开来的是……信息


    那信息在哪里呢？你猜对了。在杂志上，网上和图书馆。在这些地方你可以找到关于高尔夫的部分，你可以通过快速阅读每一则信息，每一本书的方法了解相关内容。


    稍等。你还不知道怎样快速阅读？没关系。我曾花了 2000 元学会了如何在几分钟内以平常方法快速阅读每一本书的捷径。我现在要把这个小秘诀数给你。别紧张。这一点都不难。


    就拿高尔夫球来说吧：有很多关于这方面的书。你可以从任何地方开始。但是要作好笔记，因为你终究是要读完每一本书的。选一摆书放在桌子上。


    坐下来：打开第一本书。先只读目录、标题。现在因为你已经选择了你感兴趣的专题，你应该了解书中的每一项内容。我们在寻找能帮助普通'
