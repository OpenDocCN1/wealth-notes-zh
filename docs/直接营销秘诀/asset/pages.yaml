  md: '# 32、案例分享：喜立滋啤酒“50年的完美演绎”广告


    亲爱的朋友：


    喜立滋啤酒的案例已经家喻户晓，许多人也因为这个案例而受益。也许你已经听说过这个故事 N 遍，但并没有多少人真正见过其广告的真面目。


    在那个时候，喜立滋啤酒在啤酒品牌中排第 5 位，并且正深陷泥潭。直到他们聘请了霍普金斯后，才帮其完全转变。


    在那时，每一个啤酒制造商都宣称他们的品牌是“最纯的”。但是消费者想：“谁在乎呢。”直到霍普金斯通过他魔术般的方式最终解释了“纯”的真正意义所在。


    # 深入市场调查


    霍普金斯知道他必须了解啤酒制作工艺的整个过程，如果不 对产品有一个全面的了解，是根本不可能将其销售出去的。


    所以他特意到威斯康星州参观他们的啤酒厂。在那里他看到了在平板玻璃屋中啤酒从管道里滴下来。他被告知，这些平板玻璃屋中充满过滤过的空气，因此啤酒可以在无杂质的环境中保持冷却的状态。


    接下来，他看到装满白水浆的巨大而又昂贵的过滤器，这种过滤器能够 提供高级的过滤流程。制造商解释了如何一天清洗两次水泵和管道以保 证啤酒的纯度。此外，在装啤酒之前，每一个瓶子杀菌消毒不止一次或'
  merge: -1
  img_proc: true
- pgno: 167
  md: '是两次，而是四次。


    喜立滋啤酒工厂正好座落在密歇根湖畔，那时候密歇根湖还没有被污染，可以提供清洁的用水。但是，喜立滋并没有使用密歇根湖里的水，而是从 4000 英尺深的自流井中取水，以尽可能的保证他们所使用的是最清洁，最纯净的水。


    而且，在这次参观的最后，霍普金斯被带到一个实验室里，在那里喜立滋啤酒厂厂长韦兰先生向他是展示了酵母细胞，是花了 1200 次实验来达到所需的健康味道。所有的啤酒都是由这种原始的酵母细胞生产出来的。


    # 方案制定


    霍普金斯非常吃惊并询问公司，“为什么不把所有的这一切告诉他们 的顾客？”，他们这样回答：“因为所有的啤酒制造商都是这么做的。”


    然而，霍普金斯却说：“是的，没有人来讲述这个故事。”


    霍普金斯的广告宣传使喜立滋啤酒的市场份額从排名第五跃到第二  的位置。而这一过程仅仅用了数月的时间。


    霍普金斯说：“我走出去把这件事告诉全世界。我没有说只有我们  这样做，我也没有说别的啤酒厂不是这样做的，但在此之前，没有一家 啤酒厂把它说出来。在那条广告之后，别的啤酒厂也不想再出来说了，
    因为那会让人觉得他们想模仿喜立滋。”


    现在，你也许依然认为远在上个世纪之初的事情不可能在今天行之有 效。那么，你可以再想一想。'
