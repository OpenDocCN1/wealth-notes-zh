- pgno: 103
  md: '# **18、定位第一，广告第二**


    亲爱的朋友：


    在你进行市场营销前，“定位”是最重要的首要因素。


    因为，一份提案不仅仅包含价格和条款。


    有时候，如果你要价太低，人们就不会重视你提供的服务。如果一位医疗按摩师正常收费是 20 元/小时，你会欣赏他的低价格，但是你肯定会拒绝他为你服务。


    你会想：他的价格这么低，技术、卫生或服务肯定不好。


    另一方面，如果他一小时收你 300 元，你可能会接受他的服务，因为他的价格高是由于他做得好，你肯定希望最好的医疗师为你服务。


    Gucci （古奇）的包包真的值那个价吗？Gucci 牌子的产品真的就比那些在价格上只有他 1/3 的其他牌子的产品好吗？


    我看不见得！


    Gucci 的市场吸引力就在于产品的超高价格。显然，这就是人们购买 Gucci 的一个原因。Gucci 的标签在对着他们的朋友大叫：“看我！看我买这东西花了多少钱。我必定很有钱，以至于为了这包包我在所不惜。”


    这些人想要的是一种身份！这是 Gucci 品牌的营销定位。'
