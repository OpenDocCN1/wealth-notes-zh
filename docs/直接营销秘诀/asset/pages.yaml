  md: '愤怒可以是一个非常强大的动力。人们把钱花给追债的人，是因为他们对欠自己钱的人愤怒。雇佣律师起诉别人，是因为他们感到愤怒。钓鱼岛是我们中国领土的一部分，却被日本占领者，作为一个中国公民，我们都很愤怒。这当然是有理由愤怒的。愤怒使人们想要反击和斗争，甚至是战争。


    # 13. 渴望改变


    人们想要自己的生活更美好，就会做出改变。


    竞选职位是为了改变，并不只是希望得到承认。人们锻炼身体是为了健康而做的改变。人们出书和写文章为的是改变。人们自愿做出改变，这种渴望可以是一个强大的动力。


    # 14. 渴望生命的价值


    人们希望知道活着为了什么。宗教组织依赖于这种动机而促使其机构的繁荣。大多数人相信上帝。大多数人都不愿相信他们的生命是一个意外。人们购买圣经，宗教手册，和哲学书籍都是为了找到生命的意义。他们加入了一个社团也是由于同样的原因。


    每年为了找到人生价值的那些人的花费多达数十亿元。


    # 15. 渴望权力


    人们想告诉别人应该做什么。他们想成为负责的人。他们想要得到权力。他们希望能像神一样。他们想得到权力去做好事。有的想得到权力去做坏事。


    中央领导人的选举将决定谁来对人民负责。尤其是美国总统大选，花费数十亿美元为赢得选举，获得权力。人们开始创业，部分是因为想当老板。人们希望能掌控自己的生活，和管理其他人的生活。'
