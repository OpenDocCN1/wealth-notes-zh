  md: '想到有人对理财很感兴趣，正好又有一个专门做牙齿种植的医师，一个老客户。我为两家公司建立了跨领域推荐，他们都从中获得了巨大收益。


    如果这一切对一个推荐人来说太过美好，那就对了，事实确是如此。当你突然拥有一大笔现金时，他或她还坐在坐着没事干。在那样的位置将会很好，不是吗？所以一旦你可以创造这种关系并能从中获益，就出去寻找可以让你为他们推荐的企业吧，让他们采纳你的建议不会很难。


    # 竞争者之间的推荐


    另一件事就是，当与有直接竞争关系的企业合作时，听到这句话你可能觉得不可能，我知道这听起来完全违反直觉的，但听我把话说完。事实上有一个方案，可以让企业为竞争者推荐却依然能获利。


    比如，你是一家平板电脑制造商。索尼生产各种价位的平板电脑，但你的比索尼最便宜的还要便宜很多——尽管它缺少特色。索尼有庞大的广告资源，每 1000 个销售机会，就会销售
    10 台，但他们的机会再大也会有 990 人因为价格放弃购买。这 990 人因为对平板电脑的宣传感兴趣而来到店里看看…他们没有直接购买。


    你可以去找索尼平板电脑的销售商并坦白告诉他们：“我已经做了调查，你们把 10000 元花在不购买索尼产品的 990 名额客身上。如果我提供一个既可以挽回 10000
    元的损失又可以赚一万元的方式怎么样？”建议就是当他们无法卖出自己的平板电脑时，可以卖你的。如果他们不想那样做，可以建议他们给你引荐顾客，这对他们来说意味着什么呢？共享你所销售的每个平板电脑所获的利益。'
