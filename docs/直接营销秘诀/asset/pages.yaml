  md: '所以，只有“免费”才能吸引到更多的客户关注我。


    古往今来一直都是这样，即使在今天也是。我觉得10年以后依旧会是。


    谈到免费，首先我们看看周鸿祎是如何说的，然后我会再告诉你其中的利害关系。


    以下摘自他的演讲内容：


    “我想讲讲免费，免费是互联网的精神。免费是特别有意思的东西，在今天的中国，我们很缺乏信任。在日常生活中免费越来越成为一种行销手段，甚至有的时候大家会觉得它是一种欺骗手段。


    举个例子说，你走到一个饭馆，这个饭馆说只要点够一桌菜就送你一瓶啤酒。你好，我不要那些菜了，能不能送我免费的啤酒，老板一定把你轰出去，免费是有条件的。互联网的免费不是这样的。


    再比如说，你们小区突然来了一帮白大褂的人号称义诊，免费看病。我相信有经验的人脑子里就会响报警器，肯定要给你卖药，免费背后是有目的的。


    我们每个人对免费有先天的恐惧感，我们不相信世界上有免费的午餐。


    在现实生活中，哪怕送一瓶水，你服务的用户越多，你的边际成本是上升的。哪怕这个水就是免费罐装的，它还有一个瓶子的费用，还有物流的费用。这就在说在现实生活中，一般情况下免费服务、免费产品难以为继，只可能成为一种营销手段。免费试吃、免费试餐都是阶段性的。'
