- pgno: 149
  md: '你会在展览会上分发自己的宣传册吗？如果会的话，那么这本宣传册本身就应该包括有价值的、非销售性的信息，使得潜在客户想要留档保存。


    你会把宣传册寄给潜在客户吗？如果会的话，那么你宣传册的最后一页，最好附上一张可以撕下的优惠券，或者要求顾客登录你的网站订购或者留下相关信息。


    根据宣传册最终的目的不同，其中的内容也需要随之改变。


    如果你是在向并不了解你的人销售一种优质的**服务**，你就要在宣传册中强调自己超过竞争对手们的优势；如果某些潜在客户既不了解你，也没有意识到他们自己需要你的服务，那么，你就要花费更多的篇章来向他们解释，你的服务可以为他们带来什么。


    # 错误 3：忽略了读者最关心的问题“产品能为他们做什么？”


    太多的宣传册都是一味地强调“我，我，我”或者“我们，我们，我们”，而并没有与读者建立什么联系。


    这样的宣传册会令潜在客户很难接受，他们在进行浏览时，随时都有可能产生“**跟我有什么关系**”的反应，然后放弃阅读。


    为了避免潜在客户产生这样的反应，你的宣传重点应该转变为“购买者能够从中得到什么好处”，而非一味地阐述你的公司、你的产品或者服务的特点是什么。


    举例来说，假设你是一位担保经纪人，不是说你担保的种类都有哪些，而是帮助人们买到他们梦寐以求的房子——一般情况下，这对他们更有诱惑力。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '不要只是向客户展示你的资格证书，而要向他们解释，为何你的证书与众不同，比如：“我有 22 年的从业经验，以及广泛的银行人脉，即使你的问题很棘手，我也能帮你达成满意的交易。”


    使用你的客户能够听得懂的语言，向他们列举你曾经帮其他人卖过或者做过什么，千万不要使用你自己的专业术语。


    对于一些玩不转电脑的人而言，“我们会耐心地教你学会使用软件”比“我们专门从事‘视窗’操作系统应用，以及 RDBS”更容易引起他们的直接回应。


    # 错误 4：宣传册中试图包括太多内容。


    如果你的业务范围很广，或者你服务于多个市场，那么，试图在宣传册中覆盖到所有事、所有人的做法，通常会降低宣传册的效果。要么你就创造一种通用的理念，对各种各样的服务都适用，要么你就创造出多种营销材料。


    如果你是一名形象顾问，而你既可以帮助客户打造出其最完美的形象，又可以帮助其他的形象顾问来发展业务，那么，你最好将这两种营销计划分开。


    # 错误 5：宣传册的外观形象粗制滥造。


    相当数量的人都是自己设计制作宣传册，导致它的文字间距大小不均、纸张沾上墨水或者印刷字体不正。事实上，无论是你自己来做，还是交给印刷厂，都应该保证专业排版、折叠对齐、图片清晰、色彩搭配合理。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '# 错误 6：语法和拼写不规范。


    如果你并不能 100%地确定，什么时候应该使用“它是”，什么时候应该使用“它的”的话（这是我看过的宣传册中最普通的错误），或者，如果你总是习惯于说“在他的和我之间”（不正确）这样的话，那么，你就应该请一位非常专业的人来帮你检查宣传文案。


    # 错误 7：排版错误、自相矛盾以及遗漏内容。


    在提供你的电话号码时遗漏一个数字——或者完全忘记注明电话号码，那么，你投资宣传册的回报会大大降低。


    同样的，如果你在宣传册的某一页上列出的优先服务价格是 50 元，而在订单表上标明的价格却是 55 元。或者，你在某个地方自称是“房地产集团之北京”的财务主管，而却在后面某个地方又称自己为“北京房产集团”，那么，你的信誉就会荡然无存。


    对于我来说，当我比较着急，或者假定“之前的版本正确无误，那么下一个版本自然也就没任何问题”的时候，就会很容易出错。


    有一次，我发出了一篇 4 月份的营销通讯，而它的签署日期却还是 3 月份的！还有一次，我在看一篇已经印好的稿子时才发现，我的电脑文档里竟然省略了所有的连字符——我最后一次检查的时候明明都在的。哎哟！


    在定稿之前，一定要留出足够的时间来进行全面地、严格地检查。如果你只是检查了一次就确保内容是全面、连贯、准确的话，那么很有可能会出现大问题。'
  merge: -1
  img_proc: true
- pgno: 152
  md: '**错误8：忘记号召大家采取行动。**


    如果宣传册只是传达“我们是谁，我们做什么”这样的信息，那么是不会产生太多效果的。而如果你在结束的部分告诉读者做一些事情——例如，“现在打电话，便可以免费获得李炳池2013年全年的《营销通讯》”或者“发邮件到ask@libingchi.com，便可以免费获得最新电影票一张！”，那么，你得到的回应就会大大提高。


    **错误9：订购表格使潜在客户感到困惑。**


    无论你觉得自己撰写的说明手册是多么地清晰易懂，总有人会误解你的意思，或者完全忽略掉那些白纸黑字、非常清楚的说明。


    测试客户是否真的会按照要求详细填写所需产品颜色或收获日期的唯一方法，就是让设计订购表格之外的人去填写它们。要通过多次调整各个条款在页面上的位置，或者对比较重要的说明文字加黑加粗，从而来避免人们可能产生的种种疑惑。


    记住，不能自己盲目假设——要找他人测试一下！


    **错误10：忽视宣传册的多种形式——选择多种形式的宣传册，会很方便潜在客户阅读，甚至费用更加低廉。**


    一份传统的折叠页宣传小册子也许并非是展现你自己的最佳形式。对于使用高科技产品的潜在客户而言，能够在自己的电脑上看到你的宣传内容，可能会更加吸引他们。对于高价格的服务，可以录制一张介绍你们公司的CD，让客户们边听边了解你们。'
  merge: -1
