  md: '# 4、我不得不说的3条直接营销铁律


    亲爱的朋友：


    经常有人问我：“如果我和客户保持联系的话，我的客户就会对我产生兴趣，他们会花时间看我的博客，电子邮件，感谢信，接受我的免费礼物，节日贺卡等等。”


    我的答案是：“不！不只是你要保持联系就可以的，你要带给他们新的东西，他们感兴趣的东西。”人们只有不断学习到新的东西才不会对你失去兴趣。


    # 铁律一：必须保持联系，并提供给客户感兴趣的东西


    经常保持定期的联系对营销来说是非常必要的。


    你看看耐克是否停止投放广告了，虽然做的广告不能产生直接回应，但他们有上亿的广告费用来宣传，让客户不断的记住它，这也是一种联系的方式。想想我们这个月是否看到了耐克公司的广告？耐克公司的广告每天都在冲级我们的大脑。


    所以，所有大的消费品牌，可口可乐，麦当劳，红牛都在不停的做广告。凉茶加多宝就采用了这种方式，在大型媒体上会经常看到他们的广告。


    如果你加了我的公众微信（微信号：LBC333），你会看到，我几乎每天都会公布最有价值的营销资讯，这样我会即时的跟你保持联系。


    专业销售人员都知道，你必须看到广告不下20次后，才可以在你的大脑留下印象。我们知道，打造出一个进入人们脑海的定位是很难的一件事情。麦当劳知道一旦它的广告停播一分钟，来餐馆的人数就会减少。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '如果麦当劳停止了一年的广告，如果汉堡王像麦当劳一样的疯狂打广告的话，麦当劳将失去其很大的市场份额，这样的市场份额就会被汉堡王占去。


    这很难想像，但如果它停止广告的话，麦当劳必定会成为人们头脑中消失的品牌。实际上，市场上存在着一大堆比麦当劳好的食品。不过，麦当劳是一个营销机器。不断的重点冲击人们的大脑，这是有效的市场营销策略的关键。


    不要以为客户收到过你的电子邮件，或者从你那购买过一次产品，他们就会知道你是谁？


    > 你的营销必须始终与客户保持联系，而且要很有趣，以吸引和保持你的客户的注意。


    # 铁律2：如果营销有效的话，就要持续做下去，并且扩大投入


    对于所有的营销你要测试并且跟踪你的结果。


    你要测试的内容有：客户的来源，列表，广告媒体，标题，报价，赠品，广告文案，以及包装等等。


    所以，这是很关键的。


    当你找到了有效的营销方式，你要一遍又一遍的继续做下去。


    我很惊讶，有很 多人只发送一次邮件就停止了，即使这次邮件是很成功的。如果说你的特别报告，你的消费者保护指南，你的通讯，你的直邮信件，或者你的直接回复广告能很有效的工作的话，那就继续好好的做下去吧！'
  merge: -1
  img_proc: true
- pgno: 23
  md: '有一次，我见到一位情绪低落的客户，他的客户回应率是百分之十。他预期的回应率是百分之八十或百分之百。他无法相信百分之九十的人没有回应他的信。


    我问他：“你发送邮件投入了多少费用？”


    答：“**约为1200元**。"”


    我问：“邮件带来了多少生意呢？”


    答：“让我想想。嗯，差不多 15000 元。”


    我对他说：“天哪！这是一个**非常成功**的案例。给那些没有回应的客户再次发送相同的邮件，只是需要在邮件上用红色字体注明：第二次通知。”


    他按照我的指示去做了，结果就有 **10000** 元的新业务进来了。


    我告诉他，你把**购买过的客户过滤出来**，再继续发第三次，第四次邮件，看看会发生什么。


    然后，我建议他改变邮件的内容，**增加新的标题，使邮件看起来不同**，然后再次发出去。结果又带来了 **15,000** 元的新业务。


    如果你找到了有效的方式，请继续做下去，直到它停止工作为止。


    **与此同时**，其他的信息和测试方法也需要采用。不久你就将有一个**完整的信件库**，可以给你的其他客户和潜在客户发送邮件了。


    另一方面，如果你的营销策略不能正常工作的话，也就是如果他不能立即带来新的业务的话，请**立即停止**，并尝试其他的方法。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '不要相信那些告诉你一定要持续做广告的人，这样是得不到任何回应的。也不要相信那些告诉你通常广告需要投放很长时间才会有效的人。你不是耐克，可口可乐，也不是加多宝。


    这是大品牌公司的做法。但是和我没有足够的钱来进行大范围的广告投放，不要希望有一天，你的广告会起作用。你的广告必须马上奏效。


    如果你的广告，你的直接邮件，或你的网络营销活动不能马上带来业务的话，不要再做你正在做的事情了，立即停止。


    你要更改你的策略，你的提案，改变你的方法。尝试其他的内容。或者找到一个直接营销专家来帮助你分析你错在什么地方。


    # **定律 3：如果你尝试过，但行不通的话，说明你的做法是错误的**


    我经常听到有人说：“发邮件不起作用了，”或“网络营销不适合我的业务，”或“在黄页做广告不起作用。”


    如果说这些方法不起作用的话，那么这意味着只是你做得还不对。


    不要告诉我直接邮件不起作用了。它正为我工作着，否则我也不会看到我的邮箱里面有那么多的邮件。


    如果网络营销不起作用，如果电视广告没有作用，如果广播广告没有作用，如果报纸没有作用，如果黄页没有作用，那么人们就会停止使用这些媒体。所有这些媒体和运作方法都将不复存在。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '说它们没有作用就像是说因为飞机失事，飞机就不能再起作用一样。这就像说高尔夫球场不行了，因为我无法把球打到我想要去的地方一样。


    所有这些营销媒介和方法是非常的有力的工具。但是你必须正确的使用工具。你必须学会如何使用这些工具。你必须学会什么工具应该做什么，选择你的合适的工具。


    请你千万不要告诉我，这些工具不起作用。很明显，他们是有效的。如何正确地使用这些工具，是你学习的任务。


    没错，如果你对这三条规律不够重视的话，损失的是你自己！


    祝你每天进步！


