  md: '互联网有一个特点，上面的所有产品和服务都是虚拟、数字化的，有可能你的研发成本是固定的，大家可以免费下载、免费访问。这时候你会发现，比如说你做了一个东西，花了1万块钱，如果有1万个人用，推到每个人身上的成本是1块钱。如果有1亿人用呢？你会发现你推到每个人身上的成本几乎可以**忽略不计**。


    但是，有了1个亿的用户之后，无论是做增值服务，还是做广告，每个人有一个UP值，相当于每个用户因为这种商业模式给你贡献的收入，它会超过每个人分摊的成本。这就使得互联网上免费的模式不仅可行，而且可持续，甚至有可能建立新的商业模式。


    所以免费在互联网上并不是骗局，而且很多互联网公司巨大的成功都是建立在免费的基础上。因为一旦你推出免费的产品，它的品质甚至还要超过那些收费产品的时候，它给用户带来体验上的冲击是巨大的。它就是一种最有利的广告，它超过所有的广告和行销手段。


    我举几个例子。大家都知道马云是个神人，他最早搞电子商务的时候，最早淘宝宣布免费开店，他的对手开店是要收费的。在易贝上的卖家都觉得很不开，就是有没有用户也愿意把店在淘宝上复制一家。所有卖家都到淘宝上去，有了卖家就有了买家。


    在最开始免费的时候，马云未必想清楚了怎么赚钱。由于各种原因，他在三年之后宣布说继续免费，永远免费。最后当中国所有的B2C商家都到淘宝上开店了，出了什么问题了？你搜一个卫生纸都出来1万个结果。免费开店没问题，你如果想搜卫生纸排在前面，有的人就要交增值服务费等。淘宝今天也成为中国最赚钱的互联网公司之一，这就是免费建立的商业模式。


    大家都用微信。前段时间有**很多人**吵吵说微信是不是要收费。我就跟这


