- pgno: 79
  md: '# ## 14、警惕！人们在网站上犯的最大错误


    亲爱的朋友：


    **我不知道你的网站是什么样子。但我看到很多很多网站都犯了一个最大的错误！**


    人们犯的最大错误是在设计网站时，心里没有一个具体的目标。人们希望他们的网站做很多事。希望他们的网站能做所有的事。


    他们希望自己的网站能建立品牌和形象。他们希望自己的网站能销售产品和服务。他们希望自己的网站能找到并吸引客户。他们希望自己的网站能提供信息。他们希望自己的网站能娱乐大家。


    那么，你最后做出的是一个 “大杂烩” 网站。在互联网上的大部分网站上，我想不出应该做什么。我不知道应该买什么，甚至不知道该企业在卖什么。


    # ### 给你的访客一个停留的理由


    **记住，人们花在一个网页上的平均时间是 5 秒。而且这可能是多的。** 所以，你只有不到 5 秒钟的时间，去吸引访客的眼球，给你的访客一个停留的理由，做某事的理由——不管是填写你的注册表，购买某物，阅读某物，观看某视频，收听某音频，还是联系你。


    一个网页（而且整个网站）应该旨在让你的访客做唯一一件事。你的网站应该只有唯一一个目的。'
  merge: -1
  img_proc: true
- pgno: 80
  md: '你访问优酷或者 YouTube 时，知道要做什么——观看你感兴趣的视频。我访问时，喜欢观看古典音乐视频。而访问 YouTube 时会查询国外某些营销专家的信息。（港澳台可正常登录。国内禁止访问，需要通过一些方法才可以浏览。）


    你打开百度或谷歌主页时，你要做的事**立竿见影**——输入你的搜索词，找到自己在网上寻找的东西。我喜欢举谷歌的例子，因为它是全球最大的搜索引擎。


    # 让你的网站简单，传达一件事


    看看谷歌的主页。**简单而清新。没有花哨的图表**——只有页面中间的那个搜索框——附近还有几个超链接文本，以便让你使用谷歌的其他服务，如果你有兴趣的话。


    但是，当你访问它的主页时，**谷歌主要想让你使用它的搜索引擎**。谷歌整个的数十亿美元来源于人们对其搜索引擎的使用。谷歌的业务还涉及其他许多方面——包括谷歌
    AdWords、AdSense、谷歌地图、谷歌地球、免费邮件服务、谷歌新闻。还有其他各种服务。谷歌还收购了 **YouTube**。


    但是，谷歌知道，自己的业务是建立在人们使用其搜索引擎的基础上的。它提供的其他服务都来源于此——因为搜索引擎是人们寻找并浏览网页的方式。


    在那个**超级简单**的主页背后，谷歌的业务非常复杂，而且涉及多个方面。但是，谷歌懂得向世界呈现简单的威力——让世界在访问谷歌主页时，只做一件事的威力。


    把谷歌的简单和雅虎的多元化对比一下。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '雅虎曾经是第一大搜索引擎。但是，谷歌超越了雅虎，成为搜索引擎的老大，而现在把雅虎远远地甩在了后面。


    把雅虎的主页和谷歌的比较一下。


    打开雅虎的主页时，你真的不确定应该做什么。它杂乱无章。上面几乎什么都有。


    现在看来，雅虎的结果似乎一点也不坏。它曾经主要以搜索引擎而著称。后来在这场营销战争中，输给了谷歌。如今，雅虎仍然是全球第二大搜索引擎，还不错。现在大部分人认为雅虎是一个门户网站。


    这是一个你可以找到任何东西的地方。你可以看新闻。你可以购物。你可以找对象。你可以观看视频。你在互联网上能做的事，在雅虎上都能做。雅虎已经演变成一种主要的媒体资产。而作为媒体资产，它正做得非常好——通过销售广告，赚取丰厚的利润。


    2013年1月18日雅虎的市值为 236.8 亿美元。而谷歌市值达到 2315.0 亿，是雅虎的近 10 倍。


    但是，别为雅虎哭泣。我在写这句话时，刚刚查了排名。雅虎的访问量仍然高出世界上的其他网站。


    但从盈利情况来看，谷歌处于一个领先的水平。


    所以，在搜索引擎的战斗中，雅虎败给了谷歌。但它仍是互联网上的第一大门户网站。它已经成为一个样样精通的网站——满含新闻、信息、娱乐和能做的事——游戏、相亲、聊天室、分类广告。只要你能说出来的，在雅虎上都能找到。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '雅虎通过重新树立品牌，生存了下来，并得以繁荣。


    **但是我认为，雅虎之所以在这方面取得成功，是因为它是首批综合门户网站之一。现在，他们靠广告收入和资金来保持这一模式的运转。但是，对于现在要创业的人来说，这不是个好的经营模式。很可能对你说，不是个好的经营模式。**


    如果你的<mark>焦点非常窄</mark>——像谷歌一样，而不是像雅虎一样很综合，你会在互联网上做得更好。


    **拿淘宝来说。**


    大家都知道淘宝是你参加线上网购的地方。雅虎也有网购，但很少有人知道。当人们想到上网购物时，他们不会想到雅虎，而会想到淘宝。


    为什么？


    因为淘宝以唯一的一件事著称——**网上购物**。


    谷歌明白，也许比网站上的任何公司都明白，**简单、坚持自己使命和品牌的。**


    在互联网营销中，<mark>“通往乐园的门很窄”</mark>。你的使命和营销<mark>越像激光一样越集中，你会做得越好</mark>。


