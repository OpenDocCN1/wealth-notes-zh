  md: '# 46、移动互联时代，你为什么必须

    学习撰写文案


    亲爱的朋友：


    **是时候了，是时候该重视文案写作了！**


    不管你是企业老板，还是自媒体的，或者你是专业文案撰稿人，如今你更应该花时间来学习撰写你的文案、尤其是你的销售型文案。


    为什么呢？


    **因为···如果你自己会写文案，那么能够让你的收入增加 2 倍，10 倍甚至 100 倍··.**


    微信的快速发展，传统生意的线上转型，所有媒体，杂志，报纸，电子邮件，微信，以及网上的生意都要靠文案（文字，图片，声音，视频）来传播。


    而文案的好与坏，强与弱，都深深的影响到你的收益。（不要忘记，你花费的时间、精力和成本是一样的。）


    下面是你为什么必须学习文案撰写的 12 大理由。


    **1、学习撰写文案，你就有能力成功销售任何产品或服务。**你可以销售自己的产品或服务。或者销售其他人的产品或服务。'
