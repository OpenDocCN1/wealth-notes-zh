    如果你想要跟某人要钱……或者争取他们的投票……或者想请某人与<u>你结婚</u>……那么，你就必须去<u>迎合他们自私的欲望</u>！


    你必须成为一个`真正的销售员`。


    真诚的,


    **P. S.** 事实上，大部分的人都不知道怎样才能创作出好的广告。所以，很庆幸，如果你最终了解了其中的秘诀，那么，你就可以在大公司里立足了。就让世上的其他蠢人都还遵循他们的愚蠢方式吧。你很快就要忙着数你赚到的钱了。'
