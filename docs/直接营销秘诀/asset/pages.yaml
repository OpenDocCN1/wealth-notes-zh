  md: '如果你正准备重新定位**你在客户心目中的位置**，那么在今天提高你产品的 10% 的价格，然后在六个月内又提高 20%。然后看看会发生什么。如果有太多的客户开始离开你，并且你难以再找到新的客户了，你就会知道你调整的价格有点太高或太快了。


    汽油价格的连续上涨，但我没有看到汽车在道路上的数目有明显的下降。当然，一旦涨到了某个限度的话人们可能会减少驾车的。


