  md: '阻止一件坏事的发生总是比让好事发生具有**更强大**的动力。


    我想赚更多的钱，并不是为了买更多的东西，而主要是防止危机或破产。


    权力的欲望更像是恐惧的子集。人们愤怒，是因为他们无法控制。似乎身材矮小的人（例如，希特勒，斯大林，拿破仑），比身材高大的人（乔治华盛顿，托马斯杰斐逊）对控制的力量更感兴趣。


    人们想要权力，生气是因为他们觉得不安全——这是恐惧动机的变化。


    如果你的潜在的客户没有回应的话，你可以暗示，或者提示你的读者，可能发生的所有坏的事情，这样你的销售信将起到很好的督促效果。如果你收到法院的一封信，你很可能会立即打开它。


    人们担心是因为他们怕打官司，怕变老，或者恐惧死亡，恐惧失败，恐惧孤独，害怕生病，敬畏神，害怕下地狱，害怕被抛在后面或被抛弃，害怕被解雇，害怕跟不上攀比，害怕任何超额的生活费用，还有为孩子的担心，害怕不被了解，以及对其他人的恐惧，恐惧走在大街上，这是普遍的生活中的恐惧。


    新闻媒体几乎都是报道恐惧，但恐惧的报道人人都爱看，因为新闻机构懂得销售恐惧。


    我们很少听到正面的新闻报道。我们听到的是有关灾害，犯罪，战争，台风和疾病的报道。人们做某些事情的主要原因是因为他们想阻止坏的事情发生。


