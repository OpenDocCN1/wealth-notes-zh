  md: '些人讲你们太不了解腾讯了，腾讯是一家互联网公司，用互联网的游戏规则看，为什么要颠覆运营商，把运营商收费的短信和彩信给免费了。


    大家为什么喜欢用微信?就是因为它把体验做得比短信好，又免费。只要有你有流量，你有WIFI就不需要掏短信的钱，发一张照片也不需要为彩信付5毛钱或者1块钱。它迅速地把运营商从通信这个层面干掉了。


    但是，它的商业模式，大家都觉得说你们这帮骗子，一定是先免费把我们干死，然后再收费。这是用传统的眼光看互联网，这是错的。互联网上谁要敢收费，后面还有我们一堆人等着免费呢。


    互联网上免费的商业模式，我今天跟大家讲，是让你把你的价值链进行延长，你在别人收费的地方免费了，你就要想办法创造出新的价值来收费。大家听明白了吗？


    微信回收你的通信费，你们每天用微信，对腾讯来说是巨大的用户群。但是，它只要在微信里给大家推广游戏，让大家都打打飞机，在里面给你推荐商品，它能轻松地挣到比中国移动每年收的短信费还要高的钱。


    这是对传统互联网的颠覆和破坏，破坏了传统的商业模式，同时又建立新的价值体系。


    当年360刚做的时候，我们是不懂安全的一帮人。有的时候我感觉互联网的人跟我有一点像，就像一个蛮牛冲进了瓷器店，或者说乱拳打死老师傅。我们不懂安全的游戏规则，我们冲进来觉得安全这个东西每个人都需要，那么多的木马、病毒、欺诈网站，大家还花钱交保护费，这肯定不对，应该免费干。


    当时我们也是在探索。你说我当时就高瞻远瞩地想清楚了以后的商业模式吗？很多成功的企业家在成功之后会给大家做这样的宣讲，你就会觉'
