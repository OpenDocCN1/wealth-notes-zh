  md: '在信中列个好处清单即可：“以下便是你可以获得的”。我将这些句子称之为“子弹”，除了句子的威力外（强大的好处），因为每个句子左边都有一个“●”图标，像弹孔一样，所以我把它叫做子弹。


    根据你的需要，你可以使用多边形，三角形等，没有固定规则。通常我会用“●”将其分开，如：


    +   ● 如何透过揭露的广告文案来提高你的销售额和营销效果。（通过给出的一个个数据，你可以逐步了解全部的营销法则以及“应该怎样做”的各个步骤，就像在一门昂贵的课程中“手把手”教你一样。）


    +   ● 如何正确使用“先发制人”的宣传活动。（我们都知道“先发制人”的营销理念，但缺少了让效果达到极致的按钮。在这里你可以学到。）


    +   ● 如何撰写有威力的“子弹”，让客户兴奋，马上采取行动！（见我的高价书籍《营销跳板》312页，有详细的讲解。）


    # 7、提议：


    告诉读者你的提议，他们可以得到什么，以及你的保证，赠品等。要慷慨，说到做到：如果他不满意可以全额退款。


    # 8、达成交易：


    再次强调你的产品主要好处。提醒读者产品数量有限，或者低价促销期限。要求客户马上采取行动。


    订购很简单。只要你打电话给我办公室的丽娜即可。电话是......


    # 9、代码跟踪：'
