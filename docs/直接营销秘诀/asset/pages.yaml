  md: '去找物业或者直接搜索水管工查找。


    你对杂而不精的勤杂工不感兴趣。你想要一位专家，一位行家，来为你解决管道问题。


    所以，如果某人在寻找雅马哈，就向他出售雅马哈。不要把他带到有多种选择的网站或者陆页上。你只会让你的访客困惑和沮丧。


    你可以在之后介绍别的选择——在你卖给他还想要的产品后。


    # 线下世界也不例外。


    如果某人走进你的五金店，他是在寻找某样具体的东西。也许他需要一把锤子。给他他要的锤子。不要只说“进我的店里看看。锤子在里面的某个地方。”


    不要这样，直接带他到放锤子的区域。问他是否在寻找某一具体类型的锤子。


    一旦他拿到锤子满意后，你再给他介绍其它产品。但是，首先要给他锤子。互联网营销原理也一样。


    先向你的搜索者展示他正在寻找的东西。然后，完成这件事后，你就可以开始向他销售其它东西了。


