- pgno: 173
  md: '# 33、撰写起始段的“万能”公式


    亲爱的朋友：


    如果你读过我在 3 月 18 号分享的**营销通讯《销售信中最重要的起始段》**一期的话，那么，只要你细心，你会发现一个非常容易撰写起始段的技巧，或者说是一个“万能”公式。


    你知道，在标题之后，文章最重要的部分就是起始段。


    在第一段，你要为之后文章中要说的每一件事情做好准备。假设你的标题已经让顾客“站在门口”了。那么接下来，你的起始段所承担的角色，就是让潜在客户们“坐下来”，并开始他人生命中最精彩的一段旅程。


    而要做到这点最容易的一个技巧——是我自己经常使用的——就是：“如果……那么”这种句式的引用。


    这很简单。下面举例说明：


    “如果像我这样一个普通智商的人，穿着短裤坐在沙发上轻轻敲动电脑键盘就可以赚取 10 万元，我敢打赌你也可以。”


    “如果你一直梦想着有一种非常容易、却又非常有效的节食方式，即使你不断犯规，也能自动产生作用……那么，这将是你读到的最令人兴奋的信件。”


    “如果你想买一辆新款的保时捷，却只想支付别人必须支付的一半的价'
