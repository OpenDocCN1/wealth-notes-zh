- pgno: 36
  md: '# 7、如何制定让客户无法抗拒的提案


    亲爱的朋友：


    **想不想知道**关于人们是如何购买产品或服务的一些**小秘密**呢？也许，这听起来非常奇怪：人们买的不是“东西”，买的是“机会”！


    这千真万确。人们不会买汽车，不会买办公室设备，也不会买电子产品，甚至也不买主意和点子。人们会买机会，像是一些特价产品，产品附送的礼品，还有一些简便的支付方式。


    当你把这些机会都捆绑在一起，作为一种产品或者服务来卖的时候，这就叫做“**提案**”。这样的销售方式，意在制定一种**让客户无法抗拒的提案**。


    你的挑战在于，怎样做出一个产品或者服务，使顾客**情不自禁**地对自己说，“如果我今天不买这个产品，我就错失了这个机会，我就是个大笨蛋！”


    # 回应率的风险/回报


    在你学会怎样去制定一个**让人无法抗拒的提案**之前，你首先要明白，人们为什么要对你的产品有所回应，这很重要。一旦你了解了这个原则，创造一个让客户说“是”的产品或服务是一件非常简单的事情。


    顾客在购买你的产品之前，心里会有一段与自己的“**风险－回报**”式的对话。“这个产品，真的值得我花这个钱购买吗？有多大风险？带来的'
  merge: -1
  img_proc: true
- pgno: 37
  md: '好处超过我为此冒的风险吗？" 如果回答 "是"，那么客户就会买了。如果不是，他们便不会买。


    # 人们对产品反应的两大因素：


    +   1.你从产品中得到的感知价值（你得到的）；


    +   2.这次交易中你所承担的风险（你付出的）；


    实际上，你也可以用这样的关系来表达...


    回应率=感知价值/风险


    如果感知价值上升，风险保持不变，那么你的回应率就会上升。如果风险上升，而你的感知价值不变，那么你的回应率就会下降。


    但是，假设你的感知价值上升，你的风险下降，那么你的回应率呢？当然会像火箭一样上升了！


    这就是我和你说的，当你在制定提案的时候，要做的事情。


    要做到增加你的感知价值，降低风险，我们就必须知道，"感知价值"和 "风险" 这两个元素中，都包含了什么？


    # 感知价值和风险


    其实，在前面的内容中，我已经提到，感知价值就是你从提案中得到的东西，而风险就是为了得到这些好处，你所要付出的东西。秘诀就在于，增加你的感知价值，降低你的风险，这样一来，你就可以创造一个神奇的提案。


    让我们来看看一些能增加你的提案的价值，降低风险的几个元素。'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# 提高感知价值的元素


    +   增加免费的礼品。


    +   买一赠一。


    +   把多种产品捆绑在一起，以一个相对较低的价格（比每个产品的零售价要低）。


    +   解释说明为什么你的产品或服务，比其他竞争对手的产品或服务更优越的具体好处，和新颖独特卖点是什么。


    +   解释你的产品很耐用，并为此做出证据（可以使用多长时间）。


    +   具体描述，当用了这个产品之后所得到的详细的好处。


    # 降低风险的元素：


    +   提供最有力的保证。


    +   提供给免费的或者低价的续期保证。


    +   提供免费试用。


    +   提供低价，大众都支付得起的付款方式。


    +   提供一个按效果付费的方式。


    +   先用后付款。


    +   售后跟踪服务。


    +   快速，高额的投资高回报率。


    +   用事实证明来证明产品或服务的使用效果。


    +   请其他的人来证明使用效果。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '在你的提案里结合以上这些元素，会**立即增加**顾客对你产品或服务的回应率。使用越多的元素来增加你的产品的好处，降低产品的风险，那么你就会获得越高的回应率了。


    # 价值是建立在感知上


    你会注意到在**提高感知价值**的几个元素中，第4，5，6条中都会有“**解释**”“**说明**”这些词语，为什么呢？因为价值是建立在潜在客户的感知上。塑造价值**最快**的方式就是，详细地介绍你的这个产品或服务是多么的有价值。可以这样向客户解释说明：


    +   1. 产品制作是有最**专业权威**的人士来操作的。


    +   2. 产品的质量达到了最高标准。


    +   3. 产品制作过程**一丝不苟**。


    等等...


    你也可以通过描述客户使用产品之后，获得了一系列“**特别的效果**”，如此来增加你的产品价值。“特别的效果”，我是指对人们具有相当大的，很有诱惑力的好处。这些特别的好处指的是：


    +   1. 更加漂亮


    +   2. 更受欢迎


    +   3. 更加富有


    +   4. 更有幽默感


    +   5. 不再需要工作


    +   6. 更加有魅力


    40'
  merge: -1
