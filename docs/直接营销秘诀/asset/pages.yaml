- pgno: 148
  md: '到自己需要你的特定服务时，再与我联系。如果他们觉得你的宣传册水平一流的话，还有可能将其推荐给**自己的同事、朋友和亲人**！


    利用下面提供的内容作为指导，你就可以拣弃那些你认为不好的宣传册，重新撰写一份。


    # 错误 1：在宣传册的封面或者标题的位置撰写公司名称——这纯属一种资源浪费。


    虽然几乎每个公司都会将自己的名称用大号字明显地标出来，但是，这种做法根本就无法吸引人们的注意。与其这样白费力气，还不如想一句能够完全吸引你的目标受众的话，用它来刺激他们继续阅读。


    一位网络营销顾问是这样写宣传册标题的，“**被电脑搞糊涂了？** ”如果我是她的潜在客户的话，看到这样的标题，我会在心里回答，“是的！”，并继续阅读宣传册里的内容。


    同样的，我还看到过这样一则标题，“**请允许我处理您家里的垃圾！** ”这则标题的配图是一辆来自于一家垃圾清理公司的垃圾倾倒车。


    还有，与其撰写一则 “XXX 公司，一家成立于 1985 年的公司” 这种以自我为中心的标题，还不如写 “何必拿自己与客户的友好关系冒险呢？”


    # 错误 2：对宣传册的预期效果不明确。


    很多公司撰写一本宣传册只是因为他们觉得自己应该这样做，而却不先考虑他们投放宣传册的营销环境。这样一来，宣传册的效果就会大大减低。'
