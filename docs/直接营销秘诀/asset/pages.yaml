  md: '# 24、如何在一周内创造出可销售的产品（上）


    亲爱的朋友：


    如果你已经有自己的产品在销售，你可能不想再读这份营销通讯了。但是，如果我是你，我不会这么做。因为这里讲的方法即使是最精明的企业家也会从中受益。


    我参加和合办过数十场的培训课程。这些课程大部分都相当贵，仅是一个席位，费用就高达3万元，有的甚至25万元。


    最初，我很惊讶地发现经常会有人拿出所有积蓄，或者借钱，或者推迟上大学的时间去参加这样的课程——以及高无业务或者产品的人。当其他的参加者想办法增加自己企业的利润时，这些没有产品的新手正在寻找————一个神奇的成功方法！


    现在我一点都不感到惊讶了。学习营销专家的营销秘诀是一个聪明的投资——这些秘诀在任何时候都有股魔力，不管你在做什么。你可以用这些方法销售产品，销售点子……甚至是销售自己，不管是面试工作还是求婚都可以。它是赢得朋友，影响他人，以及赢得精彩人生的关键。


    但我猜你最主要的愿望是赚钱。金钱可以解决由没钱引发的很多问题。除非你有望继承一大笔财产或者中彩票，否则……你就需要去销售一些东西。我想你可能没有本钱去买麦当劳的经销权。'
  merge: -1
