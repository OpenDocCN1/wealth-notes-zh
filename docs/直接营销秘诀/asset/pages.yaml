  md: '我们如何看待和感觉我们自己、我们的产品或生意，这个世界会不断地反映出来。并且，无论你做什么，它都会在您的脑海中设立一个价值。这个价值设立得高，这个世界就会反映出来。相反，这个价值设立得低，这个世界也会反映出来。


