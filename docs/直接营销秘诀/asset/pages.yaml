    # 3、成功营销的 5 个阶段


    亲爱的朋友：


    让我们来谈谈真正的营销吧！


    真正的营销是可追踪和衡量的，对于每一分钱都是可测量的。


    作为一个真正的营销人员，你必须非常精确的了解，产生一个订单你花费了多少钱。由于它的可测量性，我们必须能得到直接回应。它不能借助想象而取得，也不能借助那些大公司所使用的品牌推广的方法。


    例如，耐克的广告只要求我们记住它的商标。耐克公司完全不知道它的每一个广告能产生多少销售，因为大家没办法去直接回应耐克的广告，当然耐克也没有要求回应。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '耐克要的是我们能记住他们公司的名字，以及那个“飞驰”的标志。


    此类型的广告理所当然地适用于耐克， 可口可乐和麦当劳这样的世界 级 大 公 司 ， 因 为 这 些 公 司 拥 有 数 十 亿 元 的 广 告 预 算 。


    这些公司的产品全球销售——他们同样拥有庞大的渠道和组织。如果你 走进一家商场或超市，耐克、可口可乐的产品到处都是。想象一下广告 对他们所起的作用。


    可是你和我现在没有数十亿的广告预算，你和我必须谨慎对待我们的营 销费用。你和我没有足够的钱或时间象耐克、可口可乐那样去建立品牌 知名度。


    +   - 我们的营销必须像使用激光的“外科医生”一样那么准确。

    - 我们必须锁定那些最有可能购买我们产品的顾客。

    - 我们必须知道带来一个顾客需要花费的每一分钱。

    - 我们必须准确地了解我们带来的顾客的终生平均价值。

    - 我们必须有一套适当的系统来跟踪和测量我们的市场营销。


    我不想浪费一分钱在笼统的蓝图或公共关系上，因为我不知道在实际的 销售中，我所花费的将带来什么。


    下面是你需要跟踪的几个数字：


    +   - 能获取到准顾客的数目；

    - 每一条线索所花费的成本；

    - 在每笔花费中，什么广告资源带来最多的准顾客？以及什么资源和 广告产生的客户最有价值？'
  merge: -1
  img_proc: true
- pgno: 13
  md: '你必须虚诚地把所有这些数字输入电脑数据库，以便你能跟踪每一个月的发展情况。


    如果你想看到改善，就开始测量你想改善的靶。在公司张贴栏上，用积分板的样式显著地贴上你所跟踪的数字。你的员工一定会对这些数字给予密切的关注。他们也会进一步正确地认识公司的奋斗目标。你的雇员比你更不愿意再飞行于大雾中了，他们想因为你而成功。


    但是如果他们连什么是成功都不知道的话，他们是不可能干出一番事业的。


    当所有人都知道了公司（老板）正在关注、跟踪的数字时，所有一切将会得到改善。


    但是，你必须全面考虑成功营销中的五个阶段：


    # 第一阶段：吸引准顾客


    我和你一样，不想把钱和时间浪费在没有必要的顾客身上，只想把钱花在那些正在寻找你的产品或服务的准顾客身上。


    关键是，不要把牛排卖给那些不饿或不喜欢牛排的人。把注意力集中在那些已经饿了和热爱牛排的人身上。找出谁热爱牛排的其中一个方法是提供一份免费的牛排。


    比如，我在西贝筱面村的体验：'
  merge: -1
  img_proc: true
- pgno: 14
  md: '我第一次去西贝是由于他们提供了免费的五谷杂粮月饼。我喜欢吃粗粮，所以被吸引到了那里。


    只要你是西贝第一次用餐，他们会推荐你免费办卡，而且还直接送你10元，充到你的卡里，你下次消费可以冲减。重要的是每次用餐后，他们都会给你优惠券，与其他饭店不同的是，它不是纸质优惠券，而是把优惠券转换成熟金，直接存到你的卡里。而且，每次去消费都会给你返利，这种感觉让人很愉悦。


    我经常会收到西贝发来的优惠券，特别活动，新品上架的短信。如果我的生日到了，他们会提前发来短信祝贺，同时给我一个比平时更优惠的用餐机会，这是非常吸引人的。


    无论如何，西贝莜面村是我最喜欢的饭馆之一，有免费五谷杂粮的食物时我也去去品尝。


    这个策略对西贝来说有几方面的好处。


    首先，在一定时间内免费提供某种食品，可以吸引喜欢西贝的顾客。当然，西贝不太可能提供免费的大餐。故此西贝不会有大的损失。


    西贝其实也很清楚，只要我进店，我就会消费其它各种各样的东西，我自己也会要酒、其它菜等，最后我的账单肯定会超过100块。并且，我还会带朋友一起来吃，结果是西贝不会因为免费食品而有任何损失。


    如果你不喜欢吃西北菜和杂粮，你不会对一份免费的杂粮食物留下印象。为了健康，我建议大家还是要多吃点杂粮好。


    第二，西贝为他们的客户做了一件有意义的事情。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '因为免费的杂粮食品，不仅让我对他们的印象很好，而且为了健康，也加深了我应该经常吃粗粮的习惯。


    无论何时去西贝，我都会想起那些美妙的体验。


    随着我去西贝的次数越来越多，西贝从我身上赚到的钱也越来越多。


    提供一些免费的东西对目标顾客来说，是一个巨大的诱惑。比如，你登录我的网站 www.lijiangchi.com，我的价值连城的营销通讯你就可以免费学习。


    在互联网上，你总能看到免费的专题报告和免费发放的书籍，这些都是很好的免费产品。大多数人都在互联网上寻找他们感兴趣的话题、产品或服务，然后购买。


    一本关于 XX 的免费指南，一本关于 XX 的免费报告，或一本关于 XX 的免费书籍等。在互联网上，这些都是一种非常高效的吸引准顾客的方法。


    要做到这一点，你可以在网页上加上吸引准顾客的标语广告，或者使用精准的百度或者谷歌广告关键词。有了关键词，你就可以为你所写的相关广告竞价排名。


    当关键词或关键句子被键入，你的广告就会弹出，出现在与你的出价匹配的位置。你的出价要是前十名之内，你的广告就会马上出现。


    你也可以提供免费的主题报告、消费者指南、书、样品，以及服务，这些广告可以刊登在黄页、报纸、分类广告或者通过直邮等。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '重点是要提供一些有价值的免费礼物对潜在顾客来说是很好的诱饵。


    这在互联网上提供诱饵是特别有效的，然后他们不得不寻找你正在出售的具体产品或服务。这使得互联网成为最好的媒介原因之一。


    一旦你**钩住了你的潜在顾客**，成了你的准顾客，相关的培养，筛选，整理，分类工作就可以开始了。这时进入了...


    # ## 第二阶段：顾客培养


    培养潜在顾客的方法是，**持续不断**地免费提供你所知道的他们感兴趣的有价值的信息。


    记住，人们喜欢通过诚信的方式接受教导和熟悉他们感兴趣的话题。


    他们不喜欢被推销。当推销开始，这些潜在客户就开始有抵触情绪。


    无论你销售的是什么产品，你都应该精通于它。


    你的顾客已经对你的产品或服务有了兴趣，所以你要**坚持 “喂养”**给他一些直接的、实效的、有趣的和有价值的信息。


    喂养更多用你以**钩住他的“饵”**。即使理智上他也知道你的目的是销售，他也会视你为可靠信息的来源，他开始变得**信任你了**。


    假如你卖酒，你可以邮寄美酒月刊以及品酒会的请柬。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '如果你是一家美容院，就应寄送一些月报，介绍个人护理保养的知识，还有美容瘦身等最新消息。


    如果你是一位整形外科医生，就寄送所有有关整形手术的案例。


    潜在顾客就像一根绳子，你必须温柔地拉着它登上山。决不要去推动一根绳子。一位顾客，就像一根脆弱的细丝，只能拉，轻轻地拉。让他放松他的防卫，慢慢进入你的设计中。


    你的顾客还没有从你那买东西，仅仅是因为他还没准备好。但他是有兴趣的，他喜欢从你那得到消息。你的任务就是确保当他准备好购买时，首先想到的是你，而不是别人。


    如果他感觉从你那已经收到非常有价值的免费信息，那么就有80%的几率他是从你那购买，而非从你的竞争对手那里。这样的好事就发生在他准备好之时——可不是一时冲动！


    而如果你进行推动，你将破坏你的可信度以及你辛苦培育起来的关系。


    谨记，你要成为一个受欢迎的客人，而不是一只骚扰别人的讨厌鬼。


    # 第三阶段：首次销售


    完成销售是所有生意的目标。只有生意做成了，你才能获得一切。这就是胜利。


    我不会在这讨论成交的所有技巧，因为你如果在营销上做对了事，你就不需要任何成交技巧。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '当顾客准备买时，你的顾客自然而然就会做出购买决定，而且他是从你那购买，因为你已经赢得了他的信任。这是免费、有价值信息的自动营销（营销通讯，电子邮件，微信），乃至于免费服务所带来的。通过这些，你保证了你的名字经常出现在你的顾客面前。


    你会发现，我通过我的网站和公众微信（微信号：LBC333）不断提供我的价值连城的营销通讯，目的就是要建立你对我的信任，让你相信我是一位真正贡献价值的人，而不是一位不断向你推销产品的人。


    只要按照这种方式去做，你就能确保顾客与你进行交易变得比与别人交易来得更容易。


    加上一点，相比那些陌生人来说，人们更情愿和认识的人做生意。


    # 第四阶段：再次销售


    那些第二次购买产品的客户，相比第一次购买的客户来说，他们有 3~5 倍的可能性会继续从你那购买。


    只购买一次产品的客户还不能算是忠实客户，他们还在试水呐。


    我总是去推荐别人尝试一下某些东西——例如一个饭馆什么的。


    但是如果这个饭馆不够好，我就很难说服那个不愉快的人再次光顾了。


    获得再销售取决于两个因素：


    他们再次需要此产品或服务吗？'
  merge: -1
