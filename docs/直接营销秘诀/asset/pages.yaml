  md: '# 17、详解“综合型网站”


    亲爱的朋友：


    在你阅读“警惕！人们在网站上犯的最大错误”这一期之后，你可能得出结论，认为我是综合网站的排斥者。


    不，我不是——也不是瑞士军刀的诋毁者。


    瑞士军刀具有很棒的用途。你的综合网站也是。


    事实上，如果你仅仅拥有一个网站，那就是它——你的综合网站。


    对的，这就是网站设计师可能为你创建的网站——那个我刚刚在上期通讯中说过多坏话的家伙。这就是出现在你的名片上的网站。这就是你为那些希望深入了解你和你的企业的人，发送私人联系方式时所发送的网站。这很可能就是你在给顾客、朋友和私人联系发送电子邮件时，出现在签名栏的那个网站。


    当人们在寻找你或你的企业，以便找到你的联系方式时，他们会偶然进入你的综合网站——而不是单独的销售网站或销售信。


    当他们在搜索引擎中，输入你或你的公司名称时，出现在列表中的应该是你的综合网站。那是你的在线说明书。


    你的综合网站主要针对的是那些已经了解你或稍微知道你的人。如果人们把你或你公司的名字输入搜索引擎中，说明他们需要迅速找到你。'
