- pgno: 33
  md: '对**权力的欲望**是每一场战争的根源。对权力的迷恋，导致了整个人类的巨大苦难：希特勒，斯大林，波尔布特，和无数的独裁者。


    对**权力的渴望**是最强大的人类动机之一。


    # 16. 生活必须品


    人们需要食物，水，肥皂，衣服，电力，煤气，运输，理发，电话等等。电脑和互联网现在也属于现代生活的必需品了。企业需要纸，复印机，办公桌椅，传真机，电话和电脑。“**不能没有它**”确实是一个强有力的购买理由。


    # 17. 上瘾


    人们沉迷于毒品，酒精，烟草，咖啡因，赌博，色情，性活动和速食。一些**上瘾**是生理上的，另外一些是心理上的。


    **但是**，无论何种原因，其效果是相同的。一个始终存在的冲动在促使人们得到更多。这就是毒贩子，烟草和酒精、色情行业的公司。还有色情贩子，赌场，以及速食和垃圾食品公司等都在这样做，他们的经营规模巨大。


    # 使人们购买产品的最主要的原因


    使人们购买产品有 17 种动机。但是，几乎所有这些都可以归纳为一个动机——**恐惧**。 恐惧是促成一切的强大动力。


    *人们非常担心自己生活的地方。*


    人们寻找爱情，或者是为了结束对孤独的恐惧？'
