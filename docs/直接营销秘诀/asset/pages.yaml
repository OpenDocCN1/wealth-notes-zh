- pgno: 64
  md: '一旦你确定此人正准备想买一辆汽车，你的销售工作就可以开始了。你可以展示你的车为什么卖得这么好的原因和案例。但是如果你的读者不想买车，已经有了新车，或者这么多年以来都没有想过要买辆新车，你的理由和证据将无法施展。对于这个人，无论你的销售技能如何熟练都是毫无意义的。


    写信给一个从来没有听说这个问题的预期顾客，来买这个产品几乎是不可能的。


    比如，可能有一种疾病已经威胁到100万人的生命。而且你为这种疾病已经准备好精确的解药。但是可能成为你客户的人，他从来没有听说过这种疾病，如果这种病不是新闻关注的焦点，那么你将永远不可能卖掉你的解药。


    销售信起到的效果是因为他们准确地出现在正确的时间————当读者正在考虑买这个产品，正从你或你竞争者那里买某些类似的产品时。


    现在的问题不是你的读者是否会买，而是将从谁那儿买。


    如果你的销售信刚好出现在这个恰当的时间，如果你的销售信为读者从你这儿买带来方便，如果你为你的产品提供了一些不错的实例，如果价格是合适的，你就会得到这个很好的机会来销售你的产品。


    因此，为了成功，你需要的方法是找相关的、合适的线索——想要你正在销售的东西的那些人。


    我一直强调，你一定要成为狂热的客户数据建立者。'
