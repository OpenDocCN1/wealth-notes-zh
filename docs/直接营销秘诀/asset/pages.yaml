  md: 'P. P. S. 如果本通讯对你有帮助，请在下面评论框下留下你的建言。如果你还未加我的公众微信，请微信搜索 LBC333，或扫描二维码。下期营销通讯更精彩，请继续关注。


    # 26、透露我的商业模式


    亲爱的朋友：


    我曾给一位做保健品的客户策划过一个`销售型网站`，其中带有`自动播放`的`音频信息`。音频信息比较长——23分钟。它就像一个讲座。


    之所以这么做，因为我希望吸引首次访客的`注意力`，并且让潜在客户通过这节录音增加信任度。只要有人登陆这个页面，音频信息就会自动播放。


    `音频信息`和`销售`信一样，可长可短。长度取决于它的目的以及你要说的内容的多少。如果你说的内容很有趣，它可以很长。


    你是否需要把音频信息设置成自动播放，取决于你`网站的目的`。


    但是，如果每次登陆你的综合业务网站，或者你希望顾客能经常回访的网站，音频信息都会自动播放，就会令人反感。


    如果你经营的是一个每天都会`更新`的网站，或者一个门户网站，你肯定不希望有一个自动播放的音频信息或视频。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '自动播放的音频更适合于那些从未向你购买过产品的人——也就是说，适合于寻找潜在客户的销售信息的单页网站，或者是专门销售单一产品的网站。


    我发现，在这种网站上，**音频通常能使销量大增**。


    但是，我也见过，音频产生负面作用。我想是因为，那个音频没有吸引力，或者人们不喜欢那个声音。所以，并不是说，音频一定会增加回应。你要对着陆页面和销售信进行测试，把有音频和没音频进行对比，以确保效果。


    营销中最重要的概念是“测试”。


    就像在直邮中一样，销售信息的单页网站也应该只卖一种产品。为什么只卖一种产品？你可以阅读我的营销通讯之“警惕！人们在网站上犯的最大错误”了解详情。


    另外，在我的单页网站上，还有许多隐藏页面——不在索引里的页面，你看不到的页面。我发送的有些邮件，将把读者直接引到产品的销售页上。而大部分的邮件会宣传隐藏页面上的新文章——该页面只能通过邮件里的链接进入。


    尽管文章是隐藏着的（只有那些收到我邮件链接的人，才能看到），但是，该文章和网站连接着。所以，文章的读者可以看到该文章的索引。他们可以点击索引中的标签，然后阅读销售信。


    在文章的最后，我还会鼓励读者去阅读销售信，上面有这样一个链接：如果你真的希望通过直接营销，促使企业利润成指数式增长，现在就点击这里！'
  merge: -1
  img_proc: true
- pgno: 141
  md: '我是在用这些文章，让我的读者能够回访我的销售网站。这就是我从邮件列表中，创造“回头访客”的方式。许多阅读这篇文章的人都会点击文章中的售信链接，阅读我的销售信。


    # 两用网站——获取顾客，同时销售产品


    有些获取潜在客户的网站试图在同一网站上，既销售产品，又获取客户数据。


    我比较倾向于让网站只做一件事——获取潜在客户。当然，针对不同的产品我也使用过两用网站。对于那些从未从我这里购买任何东西或填写过注册表的人，我的目标是让他们填写注册表，这样我能够把他们加入我的列表中，并且把潜在客户纳入到跟踪和培养计划中。


    事实上，访客填写完“注册”表后，就会立即看到我的销售信。


    这是一个顺序和时机的问题。第一目标：把访客加入到列表中……因为我知道，如果我在列表中加入某人，我将有许多向潜在在客户出售产品的机会。


    但是，如果我没能使访客填写注册表，索取免费书籍或者信息，那么我知道，我几乎将永远失去那个人。我不会再有第二次向他销售产品的机会。


    让人们对你提供的免费礼物说“是”，比让他们购买某产品，容易得多。'
