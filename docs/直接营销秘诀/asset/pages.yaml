- pgno: 126
  md: '对你的广告进行代码跟踪：如果你投放广告的媒介使用了多种方式，比如，在互联网上不同的网站平台，或者报纸杂志上等，那么你可以在广告上编上“代码”，这样一旦顾客打电话或者下订单，你可以立即判断他们是来自于哪个广告。


    最简单的办法：在电话号码后面写上部门编号（400-888-8888，部门：001）：或者使用不同的电话号码；或者，使用不同的名字：“刘XX”是你在6月份投放的杂志广告中使用的名字。“李XX”是3月份的报纸广告中使用的名字，等。


    # 10、附言（P.S.）：_____________


    在你的签名后面，一定要写上“附言”。


    附言吸引读者的注意力，通常比正文内容页吸引的读者都多。因此，用附言强调你的主要事项，进行简单直接描述。


    可以提醒读者你提供的商品的时间限制，订购方式等。也可以重述你的赠品，或者重申一下请读者拨打的电话号码，或者你的零风险保证等。


    最好的方法：列举几个精彩的真实客户评价。让他们对你的产品进行赞许，吹捧。


    真诚的，


    **P. S.** 以上就是我通常用的**销售信模板**。有些粗略，但是这是**绝大多数的销售信都会遵循的基本形式**。它确实很简单，但很有效。你可以试试看！对了，不要忘记加我们的公众微信：**LBC333**，有更精彩的内容哦！'
