    来越激烈的时代，体验是赢得用户的唯一招数。**


    我刚才讲了免费的商业模式，大家以后要想能不能免费呢?免费能不能带来海量用户的倍增?当向用户免费的时候，你千万不要下一个简单的结论说，让那个孙子赔光吧。*你要想懂互联网的免费干掉了很多庞大的企业。*


    **微信干掉电信运营商不到三年，**当年支付宝免手续费，使得你们很多人成了支付宝的用户。在当时有多少人想到今天支付宝聚集大量的资金可'
