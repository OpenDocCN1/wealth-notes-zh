- pgno: 66
  md: '# 12、如何知道客户到底想要什么


    亲爱的朋友：


    如果你不知道你的读者*正在寻找*什么，你就没有机会写一封成功的销售信。你将在黑暗中往洞里投石头。在你写销售信之前，你要...


    # 了解你的读者想要什么


    他最大的恐惧是什么？他在生什么气？他日常生活中最大的挫折是什么？在生活中他的第一问题是什么？这个问题来源于什么？


    有许多方法可以做到这一点。你正在写信给少数人，还是 100 万人？


    如果你正在写信给 100 万人，你将不得不做许多有*教育性的调查*。你需要写信给一个已经买过类似于你销售的产品的人。如果你正在销售健身器材，你需要找一帮已经买过健身器材的人。


    但是如果你正在写信给少数人，你应该在你写信之前*找一些人谈话*。认真地仔细地听他们说什么，不要打断他们，不要试图销售给他们什么东西，仅仅是听。


    # 倾听是最强有力的销售工具


    通过询问他们一些问題，来知道他们想要的、需要的及他们的问题是什么。然后仔细地听他们的回答。当可能成为你客户的人回答你的问题时，你要重新叙述他提到的问题是什么，并问他你理解的是否正确。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '这样不仅会让你像激光一样聚焦于这个可能成为你客户的人想要的东西上，而且你将会展示给你的潜在客户你是真心的帮助他。这会让他们觉得你是非常可靠的，而且会鼓励他和你继续谈话——这是一个好的销售员真正想要的。一个好的销售员不是一个Talker，而是一个好的倾听者。


    如果你不能和你的潜在客户面对面地交谈，你必须找到其它的方法，尽可能地解决你正在写信给这些人的相关问题。他们正在做哪种生意？他们的客户是谁？他们可能出现的最大的问题是什么？


    # # 调查


    我喜欢去调查，这是个伟大的方式，它可以帮你找到“优质”的线索。


    我通过邮寄或者发送电子邮件调查。而且我找人进行调查。我在互联网上用横幅广告与人们联系进行调查。通过调查你会知道你未来的客户他们想要的是什么。然后你就可以准确地定制你信的内容，来解决他们的想要、需要、问题、挫折、恐惧和忧虑。


    # ## 人们喜欢对某些事情发表意见


    如果他们相信调查是真实的，不是一些市场上骗人的诡计，他们就喜欢填写调查表。大多数人都觉得没人听他们讲。许多人正生活在“绝望”中，他们希望有一个机会来表达自己的意见。他们希望有一个机会来发泄。


    如果你说你你将你的调查结果要交给某些关键的决策者——也许国务院或者国家主席比较好（举例）。不仅你的未来客户得到了发泄，而且你的调查也会有一个机会受到某种影响，实际上这是很重要的。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '调查的结果取决于你问的问题种类。但是一份要递交给一些重要人物的调查，会大大提高人们填写调查表的兴趣。


    提供激励措施给所有参与的人是一个好主意。我通常承诺会免费送给所有参与人一份最终的调查报告。这个通常就能够激励他们，许多人很高兴能帮助你做调查。不管你是否提供了激励，让他们有一个机会发表他们的意见，已经足够让他们有兴趣来协助你做调查。


    你的调查看起来或听起来的正式的，很重要的，就像一个民意调查。你的问题是很重要的，问题必须是明智的、聚焦的，切中要点。他们必须是想要回答问题的人。


    如果使用得话，调查技术是一个非常强有力的“潜在”工具。


    # 另一个强有力的工具


    另一个强有力 的工具是你可以使用百度推广或谷歌竞价（关键词广告）。


    如果使用得当，关键词广告是最强 有力的营销工具之一。它是一个可以帮助 你发展高质量的线索，甚至能立即带来客户。在国内比起谷歌 我更喜欢百度，因为谷歌退到香港后，网络很不稳定。而在，全球范围内，谷歌依然是排第一位的。我是
    如何使用关键字广告的，请继续 关注我的营销通讯。


    在精心挑选的网站做横幅广告（你提供 一些免费的东西，以获取你的潜在客户填写一份调查，或者留下 他们的名字和电子邮件地址）也可能是 一个很有效的获取潜在客户名单的方法。'
  merge: -1
  img_proc: true
- pgno: 69
  md: '撰写有效的互联网横幅广告，和通过使用横幅广告设计一个有效的**领先战略**，对于它本身来说是一门科学，很值得一些对营销感兴趣的人学习。（在我的营销通讯里会涉及到。）


    # 设法了解你的潜在客户想要什么


    我想要你从这份通讯中学到这点，即你必须在你的写一封有效的销售信之前，设法了解你的潜在客户想要什么，否则你的销售信就是失败的。做到这点有许多种方法，包括：


    +   - 面对面地谈话


    +   - 调查、投票和问卷


    +   - 搜集最近买了类似产品或服务的人的清单


    +   - 百度关键词广告（或者谷歌）


    +   - 在网站上做与你产品相关的横幅广告


    +   - 和其他店面的工作人员，做某些调查工作（实际上是你的潜在客户告诉他们想要什么）


    +   - 黄页、其他类别的业务清单服务，包括线上和线下


    +   - 分类广告


    +   - 广告行业的出版物


    +   - 转介绍系统（我会进一步在**营销通讯**里讨论，请继续关注。）


    +   - 相关领域的目录搜索'
