- pgno: 197
  md: '你永远无法通过争论改变他的想法。唯一可能的方式……陈述事实，让他自己好好考虑考虑。


    +   我们都想拥有我们没有的或无法拥有的东西。我们都在某种程度上对现状不满。这山望见那山高。这就是为什么人们要买最好的车子，房子，找最好的配偶。


    +   我们也想保住别人试图从我们手中拿走的东西……即使我们以前不怎么喜欢它。这就是为什么在广告中运用“拿走”策略。只需要用简单简单的一段话来说明“这可能并不适合你。不是每个人都能得到它的……”常常能激发顾客证明他可以拥有它。）


    +   我们都想让自己感到是特别的。我们就是特别的……只是别人太固执，认识到这一点罢了。因此，给你的顾客一个称赞欢呼的理由。帮助他想象一下，当自己的邻居、朋友发现他买的东西如此划……或者一个稀缺的产品……一款“内部特别优惠的产品”时嫉妒的咕哝声。


    +   没有一个人得到了他感觉应得的尊重。没有人听他们的，没有人在乎他们在想什么。那就是为什么你在在乎，你倾听，你给予他应有的尊重。你可以看到别人拒绝遵守。你是他最好的朋友。让你的潜在客户感受到他在购买了你的产品或服务之后将得到的新的尊重。拥有了你的产品就意味着他现在拥有了更好的信息……更好的设备……认识了更有影响力的人物……有了能在对的时间做对的事的秘密。


    +   大多数人在生活中没有有趣的事可做……或者也见不到有趣的人……或者开心的玩或者去冒险。帮助他们创造更好的生活，他们将成群结队地奔向你。


    +   大多数人从来没有赢得过任何东西。给你的顾客一个机会,让他们感'
