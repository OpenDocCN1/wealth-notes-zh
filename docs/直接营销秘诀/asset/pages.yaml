- pgno: 131
  md: '因此，你可以选择一条带给你激情的一条路。这种激情会在你的写作中，在你每天的热情中，在你和别人打交道中展现出来。事实上，你越有激情，就越会激情四射。它会在你的眼里闪烁，在每次你去工作的时候，你的心都会唱歌。


    读完前两步之后，我们要进入第三步了：


    # 专注于与充满渴望的人群（饥饿的人群）分享激情


    现在是时候忙起来了。打开你的电脑，进入各大论坛，QQ 群，百度知道，邮件平台发送商，数据库营销商家等等。在这里，你可以了解到一切关于消费人群的信息。你首先要做的就是找出和有你共同爱好的人群。这样做是为了排除人数太少而不好应对的群体。


    举例……比如，当你看到一辆崭新的六十年代的福特野马活顶轿车，你动心吗？在杂志上你会发现寻求经典汽车的信息。以经典汽车及其他种类的汽车为主要内容的《汽车族》杂志有将近
    35 万人的稳定读者群。


    然而，不要想着卖东西给喜欢收集毛线球的人。这些人对他们的爱好很狂热，但是人数太少了。


    你的列表中还有什么？记住，你是在寻找人数多，充满激情，购买力大的群体。


    高尔夫怎么样？对喽。


    中国有近 400 家球场，居亚洲第二位，世界第五位。另据《亚洲高尔夫月刊》斯宾塞·罗宾逊透露：中国目前有 30 万高尔夫人口，其中包括在华的外籍人士，但球场经营者和一些相关人员认为中国的高尔夫人口实际数目会更多。'
