- pgno: 228
  md: '在这期的营销通讯中，我将告诉你成功写作的真正秘诀...


    事实上：很多文案，尤其是在互联网上，都很差。而且乏味至极。而让顾客感到乏味，是你做的最糟糕的事情。


    所有的文案都有大幅度提高的空间。当你提高了你的文案质量，所有的好事都会随之而来。


    比如：你的想法能够被顾客更容易地，更好地理解。你的说服力也会大大增强，因而，你对他人的影响力也会更大。提高你的文案质量的另一个重要的好处就是，你的销售信息能够带来更多的回馈。因此，你将获得更多的收入和利润。


    实际上，成功写作的真正秘诀可以概括为两个字：修改！


    我从未见过哪个文案撰稿人或作家，不反复修改就能取得真正的成功。当然，其中也包括我。


    对于我撰写的任何文案，我都打过很多草稿。我所有的广告，销售信，书籍，文章，包括现在写的这个，都是改写了数次的结果。有的时候，我要改写5、6次甚至13次左右，才能达到我满意的结果。


    我收到很多读者的评论，是说我的文案内容非常清晰，简洁，读起来很轻松。当你阅读我的作品的时候，你会发现它很简洁、直接。但是，请相信我，对于一个特定的文案，我越努力的去写，我得到的积极的反馈就越多。


    以下是我发现和学到的，能够帮助你不断提高写作能力的13个技巧：'
  merge: -1
  img_proc: true
- pgno: 229
  md: "1.首先你要调整好你的情绪状态，**要心情愉悦，精神饱满**。 （这个时候你才能发挥你的优势，会灵光乍现。）\n\n2.开始下笔时，**整理你的思路、想法以及想要的结果等，先列出一个大纲**。\n\
    \n3.在撰写正文之前，**最好先写出强有力的标题及副标题**。 （如果确实无法有好的突破，想不出更好的标题，那就继续写正文，有时候好的标题就会出现在正文中，你只需提炼出即可。）\n\
    \n4.尽可能地快写出你的第一个草稿，不要担心文案质量好不好。（只要按照你大脑里出现的画面，尽情的去写，不要停顿，不要管它语法是否正确，尽量的去写...)\
    \ \n\n5.一定要留出充足的文案撰写的时间，提前安排好撰写文案的工作。（如果你时间宽裕，没有截止日期，可以用一周或两周的时间进行编辑，改写。）\n\n\
    6. 在改写时，第一步是删除所有不必要的文字。包括大多数形容词以及副词。 （让你的文案尽可能简洁。但是理想的状态是，要保证文案完整地包含你所有的信息。）\n\
    \n7.起始段（开头）要强有力。结尾也要有力。（改写你的第一个句子以及最后一段。它们很重要。对于任何文案一个非常好的结尾方法就是简短，却令人兴奋的总结。）\n\
    \n8. 每一段表达一个观点或者想法即可。不要像大多数撰稿人一样，在一个段落里写了两种、三种，甚至更多的观点或想法。（也有例外：在标题中，你可以写多达三个相关的观点或好处。）"
  merge: -1
  img_proc: true
- pgno: 230
  md: '**9. 不要忘记，你一定要在正文中作出振奋人心的承诺。然后用事实来证明它们。（具体的流程步骤见“李炳池销售信号图”http://libingchi.com/detial.php?id=OTQ）**


    **10. 尽量口语化，不要使用过多的专业术语，要让顾客能够很容易的明白和理解你所表达的。（多使用行为动词，每句话能够让顾客产生画面感。）**


    **11. 每句话不要过长，要简短，使用短句——75% 的句子应该不超过 20 个字。（如果一句话表达的字数太多，那么就用逗号“，”或者顿号“、”隔开。否则读起来会很吃力。）**


    **12. 使用短的段落，一段最好保持在 5 行以下，最多不要超过 7 行。（段落长短要有变化。如果段落的长度都一样，会让读者感到乏味。可以偶尔只有一句话的短段落。）**


    **13. 当你的文案写好后，不要急着发布，可以搁置一天或者数天，然后再修改。（跳出当时的情境中，让你的大脑休息。当你再次阅读它的时候，你会发现很多需要改善的地方。）**


    当你在撰写文案的时候，运用以上 13 条技巧，你一定会提升你的文案写作功力，不仅你开心，你的读者也会很开心。


    祝你成功！


    真诚的，'
