  md: '# 21、成为营销天才的核心


    亲爱的朋友：


    当你希望你做的一切，不仅对你，也对你周围所有的人都有帮助的时候，你将会对生活充满激情。激情是成为营销天才的核心。


    # 激情的 5 个方面


    激情看起来似乎是有些人拥有，而有些人没有的无形特质。事实上，激情有5个组成部分。如果你缺少其中的一个，你就不会感受到生活的意义与刺激。因此，我们花点时间去探讨一下激情的5个方面，问问你自己：你现在的生活里有这5个方面吗？


    首先，精力。是的，以充沛的精力去迎接新的一天。从某些角度说是一种生理现象。你必须照顾好身体，吃好、睡好，并且锻炼，保持健康，强壮。


    但这期不是健康通讯。我这里说的精力是一种心理现象。如果你做的一切都是为了保持体形，你依旧是在浪费时间。因为你在一些不重要的事情上消耗了你的精力。精力来自正确的自我价值观，来自对你以及你的企业每天能为他人带来的价值的正确认识。记住：要想别人尊敬你，你首先得尊敬你自己。


    第二，愿景。如果你不输入目的地的地址的话，你车里的GPS定位系统就不会为你做任何定位。对事业的愿景就和这个地址的作用一样：如果你不知道你的长期目标是什么，你就不要期待会有任何成就。'
