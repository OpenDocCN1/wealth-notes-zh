  md: '得他如何高瞻远瞩，运筹帷幄。这种神人不是我们这种屌丝能学习的。实话说，当时我们也不清楚。当时就觉得免费可能是比较容易吸引用户的点。


    有的时候你跟用户讲技术好，用户听不懂。你跟用户讲东西好，用户不试用的话怎么知道你的东西好?我们就决定了永久免费，终身免费。


    今天对很多人来说，如果你要拥抱互联网，我希望大家重新思考一下，**你是不是真正的将用户至上写成了企业的标语，你真心地想用户是什么**。哪怕现在还不向你付钱的人，你哪怕给他做一点有利的事情，不一定把你的核心价值免费掉。


