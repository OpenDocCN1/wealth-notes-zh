  md: '所以，我<u>再次强调</u>，你应该收取多少费用这个问题的答案就是：<u>人们愿意给你出多少钱</u>。你除此以外你是不能多收取一分钱的。如果你收取的费用比人们愿意支付的要少的话你是自己在损失钱。


    <u>记住</u>，你不是搞慈善事业的。你是一个生意人。<u>你做生意是为了赚取利润</u>。因此，你的问题不应该是：“我应该收取多少钱？”


    真正的问题是：<u>“如何才能知道人们愿意支付多少钱？”</u>

    简短的回答是：<u>“不断测试”</u>。在进行直接营销时我们一直在进行价格测试。


    我们经常会发现，较高的价格，实际上会产生<u>较高的回应率</u>，或回应率没有改变。


    很多时候你的价格的提高，实际上<u>提高了你的客户对你的看法</u>。你必须提高你的价格，因为你的产品的需求上出现了供不应求的局面。你产品的需求量很大，因为你的产品是最好的。


    <u>提高你的价格</u>，往往可以帮助重新定位你在客户<u>头脑中的位置</u>。我们不再是廉价低端服务。我们必须收取高的价格，因为我们对于每一个细节都投入大量的热情。我们是追求完美主义者。


    亚洲最大的<u>雷克萨斯</u>4S 旗舰店，坐落在温州，整个规模配置等每一个细节都无不透露出<u>雷克萨斯</u>对卓越品质和打造完美服务的不懈追求。


    <u>当然</u>，你必须准备好去兑现这一承诺。如果雷克萨斯汽车在路上经常出现故障的话他们将陷入麻烦。'
