  md: '在你读完那一堆书之后，你将拍下很多照片或者积累厚厚一摞不错的笔记，都是从关于这个话题的最好的书中精选出来的。恭喜你。你已经是专家了。


    *要成为高尔夫专家，你不必打一手好球。*


    专家之所以被当做专家，是因为他们的**知识储备丰厚**。而不是因为他们确实技巧高超。


    此外，当你看了几乎所有有关高尔夫球的书。这样，你就会发现一个小秘密——即，大多数书籍写的都很糟糕，传递不了多少读者需要的信息。


    事实是，一个人不是因为他知道自己知道的就成为了“专家”的。他成为专家是因为他将自己知道的写进了书中。\[\<span style="background-color:
    #ffff00;\>挖——专家。\</span\> 写下来即可。


    最后一步：


    # 快速填补市场上被人忽略的地方


