- pgno: 42
  md: '举个例子，你可以这样介绍产品或服务的价格，“这个珍贵系统的价格仅仅是你每天在星巴克喝一杯咖啡的钱！”或者这样说，“你可以用一辆奇瑞的价格买一套属于你自己的别墅！”


    然后，你就进一步解释，然后证明月付的付款方式是如此简便，因为你每月只用付一辆奇瑞汽车的钱，你就能拥有一栋别墅！


    降低你的产品或服务的价格的再深入一步就是，


    +   1. 按比例折扣


    2. 批量折扣


    3. 季节折扣


    4. 限时回报折扣


    5. 制造商的折扣


    # 保证


    你的保证是降低提案风险的秘密武器，你应该总是提供尽你所能提供的最大的保证，不要担心你的保证会过头，因为解释权在你这方。


    其实，在市场上所做的保证大部分人们都不会来要求。如果你能提供最夸张的保证，你就能越获得绝大多数消费者的青睐。大部分客户都不会做的事情：


    +   1. 产品坏了送回来。


    2. 不满意产品，退货。


    3. 挫败时，抱怨。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '为什么？这是人类的天性，不想去吵架，搞破坏。大多数的人都很积极兴奋，不想起冲突。


    # 保修


    保修，就像保险一样，如果出现问题的 times 就能提供保障。想一下，有多少人是连续多年交保险，但是这么多年过去，却没有向保险提出索赔的？数据显示，其实很少有人真的会提出索赔，当然，这保修其实和保险是一样的。


    所以，像保证一样，为什么不是一个强有力的保修计划呢？


    比如说，一个高级浴缸通常会有 7 年的保修期，而且通常人们使用的年限也是 7 年左右，那你为什么不提供一个“终身保修”的承诺呢？


    如果你只说 7 年保修的话，买你产品的人就会很少，但是如果你提供一个“终身保修”的承诺，无形中，你就给你的产品增加了隐形的价值！


    “终身保修”呀，顾客对你产品的质量都啧啧称赞，你还愁销售不出去吗？


    其实，你只要提供一个感知上的强烈的保证和保修，并提供一个电话号码和地址——以防万一出现问题时急用，就完成了保修部分所要做的事情。其实，很多人不会用的，研究表示，电话号码和地址只会在顾客购买产品的前
    3 个月会有用。


    # 按效果付费


    如果你真的想要让你的提案的风险降低到零，那你可以考虑给顾客提供一个“按效果付费”的提案。按效果付费，指的是，你同意你的客户在体验过你的产品或者服务后，根据是否有效果才付费。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '这是最无风险的提案了，因为这就相当于向你的客户免费提供你的产品或服务。如果你的产品或服务没有带给客户想要的效果时，你就拿不到钱。


    如果你和你的客户达成了这样的协议的话，那你就必须得提高产品或者服务的价格，因为卖方和产品提供者承担了所有的风险，所以得到的回报就需要多一点。


    # 让你的提案看起来可信


    一些市场开发商做的最差的错误就是，制定出的提案太花哨，以至于让人看起来，觉得不真实。因为，消费者总是相信，一分钱，一分货，天上不会掉馅饼。


    让人信服的方法，就是去证明！


    有很多种方法，可以建立信任感，但是最好的方法就是，提供客户见证和实际案例。人们总是相信其他和你没有利益瓜葛的人的证词。


    把图片和见证结合起来，效果会很不错。如果是真实客户的视频的话，那就更有说服力了。这就是为什么广告片中，总是会有见证的缘故。


    实际案例是很好的方式，可以证明你的产品或服务真的非常有效果，一个实际案例需要描述...


    +   1. 解释问题或情况。


    +   2. 提供解决方案或怎样解决问题。


    +   3. 解决方案的效果。


    实际案例需要展示一些数据，图表，使用前照片，使用后照片等等，提供一些证据十足的证词，来证明你的产品真的非常有效。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# ## 说出原因


    **最后**，如果你制定出了一个特别优惠的提案，你也要向客户**解释**，为什么会有这么优惠的提案。即使是一个很牵强的理由，也要说。


    一般的理由可以是：


    +   1. 由于失误定了太多的货，现在我们要清理这些货。


    +   2. 我的老板不在，所以他也不清楚我卖你这个价。（注意：这是一个很烂的理由，但是人们非常喜欢。）


    +   3. 年末了，如果我们不卖出去这些货物的话，要付很多的税，本次活动只延迟到 12 月 31 号。


    +   4. 我有特别渠道，可以买到很便宜的货。


    +   5. 我们检查了库存，发现有一批货，有一些轻微的瑕疵，我们的会计说，没办法，不得不降价处理了。（请注意，甚至我也被这样的把戏骗过。）


    无论是什么原因，说吧！人们**想要知道**！


    # ## 给顾客灌输“产品稀缺”的信息，让他们立即行动


    一个提案，如果没有一个刺激的因素促使顾客购买，很快，这个提案就死了。其实，**99%** 的人都是感性的，除非一个提案够吸引人，否则他们不会行动。你必须要给出足够**好的理由**，说服他们立即下订单。


    其中一个最好的刺激因素，就是灌输**产品稀缺**的信息，在人们害怕担心得不到这么划算的产品，或者服务的这种心理上下功夫，你会发现很有意思。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '两种流行方法：


    +   1. 限时


    +   2. 限量


    # 告诉他们要做什么


    人们总是需要你**手把手地牵着他们**，并详细具体地告诉他们去做什么。我想，对你的潜在顾客**循循善诱**，你对此在内行不过了把？


    你想要顾客去...


    +   1. 当天就拜访你的小店


    +   **2. 记下你的电话号码**


    +   3. 点击“订购”按钮


    +   **4. 登记后在一天之内给你发邮件**


    **注意：** 每个提议里面，都要有行为动词，即使你以为是客户理所当然应该去做的事情，还是需要你告诉他怎么做。


    然后，你还需要告诉他们，如果**立即采取行动**的话，会有什么结果。比如说，“立即订购，即获...免费赠品！”


    开始做最好的提案吧，**祝你赚更多的钱**！


    真诚的，


    制定无法抗拒提案的实践者'
