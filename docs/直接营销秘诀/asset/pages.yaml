- pgno: 174
  md: '格（合法购买）……那么，我在这里要与你的信息，一定会令你非常震惊和兴奋的。”


    “如果你想要让网球发球速度达到每小时超过 177 公里，并且准确率像导弹一样……那么，这将是一条你能阅读到的、最能改变你生活的消息。”


    即使是非常老练的撰稿人，在试图撰写打动人的起始段时，也经常会产生错误。而我上面提到的这个技巧，就可以使人轻松完成这个工作。


    还有一个技巧是：简单地陈述你自己的情况。


    这听起来太直截了当了，但它的魅力就在于它的**简单**：


    “我是李炳池老师，我刚刚完成一本书，是教大家如何即刻提升转化率。这是我所发现……”。


    “世界上一共有十四个人发现了免费进入大学生篮球超级联赛现场的简单、合法、毫不麻烦的方法，而我便是其中之一。如果你想成为第十五个人的话，你应该这样做……”。


    “我刚刚参加完一个世界级的直接营销研讨会。我有一些关于最新如何增加利润的方法。现在你可以……”。


    我想，你应该明白我要表达的观点了吧。


    真诚的，'
