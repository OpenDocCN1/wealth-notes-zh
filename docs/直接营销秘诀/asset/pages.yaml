    # # 35、如何让你的销售信可信：收集事实和数据


    亲爱的朋友：


    顾客购买你的产品，首先要让顾客相信你所说的。


    你一定要收集有关你的产品和市场的**详细信息**。尽可能多的掌握大量的事实，从中挑选出相关的信息，然后放在你的销售信中。它会使你的销售信清楚、简洁、有趣，以及最重要的是——**可信**！


    大部分营销人通常都依赖于引人注目的短句和爆炸式的浮夸之词。这种销售信或许听起来很不错，看起来也非常专业，但是，它们是不太能将产品销售出去的，因为其中传达的消息是不可靠的。


    为了帮助你更好地进行调查研究发现，我建议你先开始**收集**你能找到的、与产品相关的所有材料：


    +   * ◆ 之前的广告

    * ◆ 销售脚本'
