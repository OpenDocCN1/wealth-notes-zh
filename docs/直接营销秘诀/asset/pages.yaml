  md: '最重要的是，第一次和你做生意的时候，他们满意吗？


    如果你的客户从你那再次购买，意味着你的客户很满意第一次的交易。


    你现在就**有机会**把这位客户变成忠实客户了，从他那你可以赚到更多的钱。


    # 第五阶段：深化关系


    **众所周知，**开发一个新客户的成本是维护一个老客户的六倍。除了努力去开发新客户，你应该付出同等的努力去维护你的老客户。


    但大多数的生意人投资更多的金钱和精力去寻找更多的新客户，而不是用来确保他们的老客户开心。


    你的**大块收入**来源于你 20%的客户。这就是著名的 80/20 营销法则。80/20 法则指你 80%的收益来自于 20%最有价值的客户。


    事实上，此法则适用于几乎所有的人类行为：


    +   * 80%的财富为 20%的人所创造。

    * 80%的佣金为 20%的销售员所赚得。

    * 你收入的 80%产生于你工作的 20%。


    我认为 80/20 法则也许应该改名为 **80/10 法则**了。


    如果你仔细地分析一下，你会发现你 90% 的收益很可能就是来自于你 10%的客户。'
