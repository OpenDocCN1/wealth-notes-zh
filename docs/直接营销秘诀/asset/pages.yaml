  md: '我强烈提倡建立许多不同的网站，每一个都有不同的任务。


    # 你需要掌握不断向网站添加内容的能力


    人们会输入关于他们感兴趣的话题的关键词和关键短语。人们使用搜索引擎寻找信息——有价值的信息、最新的信息。


    你可以看到，**我的网站很简单**，李炳池网站 [www.libingchi.com](http://www.libingchi.com) 主题就是揭露最真实，最赚钱的营销秘诀！整个首页内容就是让访客访问我的营销通讯，只要寻找最直接有效的营销讯息，就上我的网站。


    如果报纸每天刊登同样的文章，你就会不再阅读它。你也就不会再订阅了。你的网站也一样。


    你\*不能依赖\*网站设计师。你必须依靠自己的大脑。你必须\*自己负责自己的网站\*。你必须能完全控制自己的网站……因为你的网站必须是不断变化着的“进行中的作品”。它必须像一个活生生的、呼吸着的、不断成长的生物，反映着网站拥有者的人格和激情。


    如果你不是位作家，也不是“\*创造型人才\*”，你能聘请某人为你撰写内容吗？


    当然可以。许多成功的企业正是这么做的。沃尔玛的 CEO 没有时间，也没有兴趣，去关心沃尔玛的网站。沃尔玛的 CEO 花时间去建网页也不是明智之举。'
