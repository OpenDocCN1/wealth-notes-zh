    *你需要了解与他们有关的语言用词。你需要尽可能地了。*


    大多数的销售信内容都是，“这就是我们的产品。它有这些功能。**难道你不想要购买它吗？**"他们发邮件或讲销售信展示给一群人，那些人可能根本不是理想的潜在客户。而之后他们还在疑惑，为什么广告没有发挥作用。


    一定要进行调查。这是使你能够赚到理想金额数字最需要的做事项。


    **了解你的潜在客户的想法；**'
