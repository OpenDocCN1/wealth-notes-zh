  md: '“要喝杯咖啡吗？这样的闲话）、以及你重复过的地方都删去。并将你说得比较费劲的句子捋顺，例如：“它就像是，嗯，就像是，我的意思是说，让我这样来讲吧……”。


    把所有顾客说的话都删去，除非顾客在提问题，那么，便可以利用顾客的问题来消除一些其他顾客可能会有的疑虑，例如：“但是这也太贵了吧？这是一个很普遍的问题，而我们的答案是……”


    然后，将每一个句子按照逻辑顺序排列整理在一起。通常情况下，在进行面对面销售的时候，你可以随时进行快速地改变，无需完全按照之前总结好的最佳顺序进行销售，那是你创造完美销售辞辞的锻炼机会。


    “您一定会非常想要得到这件产品，因为……”


    “这件产品将可以为您做……”


    “大部分人都一下买两件产品，因为……”


    第三步，也是最后一个步骤，即：要使你的完美销售看起来就像是……封销售信。


    你可以这样开始：


    “亲爱的李先生，然后介绍一下你自己（“我的名字是王XX”），接着就要切入你的主题了。（“请问，您是否需要一种完美的小器械呢？”）


    不要担心你封销售信的长度。我写的销售信的长度平均都要有 8 页纸那么多。曾经，我还帮助过一位培训师写过一封长达 23 页的销售信。在我的营销通讯中我将会提供给你一些小秘诀，告诉你如何保证所写的销售信能够让人阅读。'
