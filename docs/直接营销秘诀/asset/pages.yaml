- pgno: 74
  md: '你将永远不会因为出价低而赢得顾客，因为**总有人愿意以** **更加低的价格工作**。有的律师服务一小时只需要 50 元。但是，你会请这名律师吗？


    很有可能结果是，这每小时 50 元的律师的花费要比你聘请最好的每小时 1000 元的律师的花费还要多？这很可能是**你所关心的**问题。


    **只有一个原因**，人们会花钱雇佣价格是 500 元甚至是 1000 元每小时的律师，因为**他们相信**他是最棒的。他们认为他们是值得的。


    他们认为，每小时 500 元的律师价格实际上**更优惠**，比每小时 50 元的律师**更有价值**。他们认为，每小时 500 元的律师最终会给他们节省很多钱，或者减少他们在牢狱中待的时间。


    **因此你必须拒绝陷入与客户的讨价还价之中**。而需要专注于你所能提供给客户的好处。专注于你所提供的价值，而不是一味的降价。


    当然，**你必须物超所值**。


    # 你需要收多高的费用？


    **大多数企业**解决这一问题的方法是：计算出他们提供服务或产品的成本是多少，然后再增加成本的 15%或 20%的费用。


    如果他们找到一种更加便宜的提供同样服务的方式后，他们将价格降至符合上述标准的最高的生产成本。


    其他公司看一看他们的竞争对手的收费是多少，然后收取同样的费用。在某些领域的价格时 “**工业标准**”是一个你会听到很多次的词语。'
  merge: -1
