- pgno: 156
  md: '想想人们在互联网上的行为方式。


    他们不断打开关闭着一个又一个的网站，急切地搜寻着**需要的信息**。如果你的信息不是超级清楚，如果你的访客无法立即明白“**对，这就是我正在寻找的**”，他们就会去其他的网站上。


    你最多有 **3秒钟** 时间，在互联网上传达你的主要信息，告诉你的访客，_你有解决他们问题的方案_。


    **绝不要**为你的第一次访客呈现一大堆选择和选项。为他提供一个解决问题的明确方案。


    他通过关键字搜索，已经明确告诉你他在找什么。


    他的关键字搜索把他带到了你的广告上。他点击了你的广告，现在在你的着陆页上。现在，你已经走了一半路。


    你的任务只是**呈现出他寻找的东西**。


    _如果他在寻找摩托车，不要给他自行车。_


    不要给他汽车。不要试图为他提供其它东西。


    **给他要的** 摩托车。


    如果某人在谷歌中输入“雅马哈摩托车”，不要把那个人带到销售各种摩托车的网站上。把他带到专门销售雅马哈摩托车的网页上。


    **记住**，人们希望从专家那里购买东西。如果你在寻找一位水管工，你会


