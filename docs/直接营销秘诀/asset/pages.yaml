- pgno: 40
  md: '+   7. 更有权力

    8. 更健康

    9. 备受爱戴

    10. 避免痛苦

    11. 避免愧疚


    现在用你的产品的特征来描述，使用过你产品或服务，会有种神的“特别的效果”。这样做，你就给产品塑造了无形的价值。


    # 怎样降低你产品的风险


    为了降低产品的风险，你必须想清楚，顾客在考虑要不要购买产品时会思考的几个问题：


    +   1. 这个产品值这个钱吗？（价格）

    2. 如果我不喜欢这产品的话可以退货吗？（保证）

    3. 如果这个产品出现问题我能得到帮助吗？（保修）、

    4. 这个产品真的有用吗？（效果）


    当你在制作你的提案时，一定要考虑好这些问题，让我们现在详细解释：


    # 价格


    要价的问题有点难，因为这关乎到人们是否会去买单的问题，如果你要价越接近免费（或者看起来比较像免费），那么你暴露给潜在客户的风险就会越来越少，自然，你的产品回应率会越来越高。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '难怪世界上最强有力的词语就是“免费”。因为这几乎将风险降低到了“0”——没有风险，为什么不试试看呢？即使你从中得不到任何好处，也没有风险，不是吗？


    但是，你总不能真的免费出售你的产品或者服务吧...至少不是一直免费下去吧？所以，你可以这样做：


    +   1. 免费样品

    2. **免费试用**

    3. 免费信息

    4. **免费下载**


    这些就降低了顾客的风险，你也可以通过以下方式，给出一个看起来很低的价钱...


    +   1. 提供月付的付款方式（和全额付款相比较）

    2. **延期付款**

    3. 延期付款不需缴纳利息

    4. **租用或者租后再买的方式**

    5. 提供回购协议

    6. **提供转售权利**

    7. 价格末尾数字为 0.97 元或者 0.99 元


    你也能通过你自己的方式来奖励顾客对于价格的感知，可以拿相同价位的两个物品进行比较。'
  merge: -1
