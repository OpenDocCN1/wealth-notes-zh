  md: '**P.S.** 在你绞尽脑汁，无从下手的时候，不要忘记使用“**如果……**那么**”这种句试，它可以帮你扭转局势。更多撰写起始段的方法，请查看营销通讯“[**销售信中最重要的起始段**](http://销售信中最重要的起始段)”


    # ## 34、瞄准你的目标


    亲爱的朋友：


    “逐二兔，不得一兔”，你是否犯过这样的错误呢？


    对于一位见到任何东西都射击的猎人，你会作何想法呢？从来没有目标——只会将枪到处乱指，不断扣动扳机。这样的猎人是无法将战利品带回家的。


    猎人需要一个目标。他要确定、识别、并认真地瞄准他想要击中的目标，再无其它任何东西。


    这才是你必须要做的事情。确定你的目标准顾客是谁。然后对准他。你应该用销售信实现的——只是那个人，而不是其他人。


    你应该调查研究的是：如何确定目标，即如何了解你的准顾客是什么样子的、他的行为如何、感觉如何。说服你的受众最有效的子弹类型是什么！'
  merge: -1
  img_proc: true
- pgno: 176
  md: '你的目标不能是所有人。甚至也不能是所有女人或者所有男人。它需要非常具体。为什么呢？因为人们都想要感觉自己很特别。他们想要感觉自己是的唯一的。


    比如说，你的广告是这样的，“只要您吃东西，您就需要这个！”你或许会认为这是一个非常好的目标。“每个人都会吃东西，因此每个人都会需要我的产品。这样我就会发财了！”


    但是，有一个问题。大部分人看到这样的标题之后都会这么想，“当然，我是要吃东西。但是，我是特别的。我可不像其他人那样。那则广告是为普通人设计的。这是对其他人生说的，但不是我。我要找的，是那些只为我准备的东西。”


    请想一想，如果在你的社区里的每一个人都拥有完全相同的汽车，即使它是一辆很好的车，你还会很兴奋地去买一辆吗？恐怕不会那么想了吧。


    你不想像其他所有人一样。你想要一辆可以体现你的特别的汽车。你想要听到人们说，“哇！真是好车。我希望我也能有一辆那样的车。”如果是每个人都拥有的一样的车的话，人们是不会那样说的。


    而你的销售信就需要为人们做到这一点——使他们感觉到自己很特别。


    再说一次，这需要调查研究才能确定。为了清楚地、具体地确定目标，你需要提出和回答什么问题呢？


    这个时候，你或许会说，“但是，我的目标就有那么大，就有那么普遍，是每个人都应该吃的东西！”不是不可以，但秘诀是：将大的目标拆分成一个个更小的部分。然后再分别以更小的部分为目标。'
  merge: -1
  img_proc: true
- pgno: 177
  md: '你可以确定这样的目标：


    +   * ◆ 中餐热爱者

    * ◆ 偏爱在家里吃饭的人

    * ◆ 每周在餐厅吃饭至少三次的人

    * ◆ 喜欢自己烹饪的女人

    * ◆ 喜欢吃、但是讨厌烹饪的男人

    * ◆ 只喜欢吃垃圾食品的青少年


    方法就是，要找出一些特别的东西，你可以这样说，“嘿，我了解你。我知道你是独一无二的——是非常特别的。这并不是为每一个 人准备的。而只为你一个人。”


    然后，你就可以为每一个小的目标提供个性化的东西了。


    你的市场目标就像在池塘中的鱼一样。只要你找的池塘有很多饥饿的鱼儿，并且使用它们喜爱的饵，你就可以很容易地抓到它们。


    如果鱼儿不是很饿，或者不喜欢你的饵，那么它们是不会上钩的。


    不要假想自己知道是什么可以吸引准顾客。要亲自去调查！


    再说一遍，调查研究是关键。


    真诚的，'
