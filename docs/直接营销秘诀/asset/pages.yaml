- pgno: 70
  md: '等等...


    所有这些都是在帮助你在写销售信之前，首先掌握你**潜在客户的想法**。你可能想使用更多的工具。秘诀在于选择合适的工具，并有效地使用它。如果你需要把钉子钉入木头，不要使用螺丝刀。要使用正确的工具。


    为了有效地销售和营销，你必须成为一个侦探，一个**私人侦探**。你必须做很多跑腿活儿。你必须是福尔摩斯。编制、筛选，和组织你的潜在客户的信息是任何成功营销战略的基石。


    有效的**直接营销秘诀**是找到获取你潜在客户信息的方法，让读者作为目标。


    你必须利用**一切可用的工具**找到你的潜在客户是谁，以及他们想要什么。你必须组织这一信息并把它放在一个数据库。然后，你必须使用此信息，以帮助你的潜在客户解决他们的问题。


    真诚的，


    一位在营销领域不断探索的人


