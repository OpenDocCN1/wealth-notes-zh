  md: '后端没有或获得很少的收益。这些取决于你的企业和所讨好的客户，这是一种非常**有利可图的策略**。


    你可能不希望推荐人从这样的关系中获得巨大的收益———甚至可能超过你。在谈判中，要运用彼此**心理**上的情感把这种情况均衡下。对推荐人来说，这不仅是他们增强与客户关系，而且不需要大量投入就可以获得新收益的方式，也是增加其市场价值的方式。


    推荐人可以通过~~市场测试~~来了解他们可以从拥有的客户身上获得多少收益。如果他们发现这种策略很成功，他们会与其他企业建立同样的合作关系。如果是另一种情况，市场测试证明这种合作不成功，这个推荐人也不会损失什么，你承担着损失和所花费的精力。


    另外，他们有你向客户提供的产品或服务的品质**书面保证**。这样，推荐人的风险很低很低。


    *从你的角度来说，风险会稍微大一些*。但是与其它的投入方式相比，你的投入相对较少，而且你的信心很可能**迅速提高**，因为你获得了他们的支持，你可以从他们价值数百万元的宣传和长期向客户提供的优质服务中获利，这样的投资回报不过是共享收益。


    这就是为什么在*前端给推荐人最大收益是*值得的，只要考虑下能够利用推荐人先前的投资是多么宝贵的机会就可以了。


    # 跨领域推荐


    当然，某些职业并不能为推荐人提供直接的金钱利益，但这种关系可以让彼此都获益——~~即跨领域推荐~~。我曾经给一家理财公司做咨询，我们'
