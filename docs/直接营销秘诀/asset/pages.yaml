  md: '我发现，汽车经销商**不能抑制他们的大**来挖掘各种令人惊讶的**盈利  策略**。汽车商每月花数万元在广告宣传上，但最终只有 **5%**的顾客来他们店里，其中
    **95%**不是来消费的，**20%**到 **30%**的购买者会到别的地方购买。


    为什么不告诉他们，“我知道你想买一辆 A 车，但我卖 B 车。实际上，我和 A 车公司关系很好，在这儿购买 A 车，我们可以给你最优惠的价格，你不用再去别的地方。如果你从我这儿买，你将会省
    $10000$ 元”。


    如果汽车经销商建立一个**这样的程序**，可以想象一下他们的销量。他们不仅能卖自己的车也可以卖其他销售商的车，当他们无法卖出自己的车时，还可以有一个**后援**。在各种周全考虑后，没有一个顾客会对这样的优惠不动心甚至离开。


    # 其他推荐


    **同样的策略在销售其他专业服务方面也同样有效**。我有一个朋友，他每年通过提供推荐获得的收入达 200 万元。他去银行，并说服他们，要想与客户建立信任就要实现客户和他们自己的最佳利益。一旦信任建立，银行就可以销售这些客户的保险产品和其他金融产品去资助这些信托基金。当然，客户也将从这种投资的安全性和收益中获利。


    那么银行就有很大的动力来支持这些代理人，甚至会组织、提供资金、举办讲座培训客户如何建立信托基金。每次讲座都会有数百人出席，仅仅通过这种推荐关系，银行一次次建立起信任，代理人也建立了四千人
    的客户群。'
