  md: "# 20、增加潜在客户的杠杆策略\n\n亲爱的朋友：\n\n无论从事哪个领域，你的市场定位、产品或服务是什么，从本质上讲就是要**寻找潜在客户**。每个商人都是如此。\n\
    \n多年来，一些中小企业在营销和宣传方面投资了数百万，甚至上千万元。**努力寻找潜在客户，转换成客户，并且赢得客户的忠诚度。**而寻找潜在客户的成本是巨大的。\n\
    \n现在想象一下，如果你能够在吸引新客户方面节省一些时间、精力和费用，**找其他人或组织来帮你做这件事**怎么样呢？如果他们可以做得更快、费用更低、更有效率，你是不是很想这么做呢？那么，请往下看，因为我将告诉你...\
    \ \n\n# 如何做这件事\n\n你会发现，有些企业已经花费了数百万建立了良好的企业形象，他们有**一批满意忠实的客户**——实际上只要你开口，这些客户也可以成为你的。而且你可以光明正大的获得这些客户，而不是狡猾的偷挖其他企业的客户；你还可以和那个企业合作——获得他们的**支持**。\n\
    \n简单来说，就像 A 公司同意 B 公司向他们的客户推荐产品，A 公司甚至通过宣传来鼓励他们的客户购买 B 公司的产品。\n\n也许你之前并没有太注意，但事实上，你在日常生活中会遇到无数这样的例子。在信用卡清单上，你总会看到什么？有关其他产品或服务的广"
  merge: -1
  img_proc: true
- pgno: 112
  md: '告。当你买足球比赛的门票时，在票的背面你会看到有关运动器械、啤酒、或其他足球迷喜爱的产品广告。当你在快餐店点汉堡时，他们会推荐你买一杯苏打水。


    你会很惊讶，<u>一个推荐如何迅速让更多的客户、现金流进入你的企业</u>。我自身可以证明这一点，因为我已经做很多次这种推荐了，并且收获颇丰。我也目睹了同样的事情发生在我的客户身上。


    # 建立推荐关系的五个阶段


    +   第一， <u>列出在商业环境中已经与客户建立良好关系的企业</u>，这些企业所销售的产品或服务与你<mark>不构成竞争</mark>。同时，有相关联或互补关系。


    +   第二， 跟清单上与你不构成竞争的企业联系，询问他们是否愿意把你介绍给他们的客户。最重要的是你要让他们<u>了解你的产品或服务</u>——好像他们是潜在客户——给他们提供客户见证以证明你企业的优秀。一定要强调，你们之间完全不会形成竞争。


    +   第三， 一定要确保推荐人明白<u>你不会让他们做任何事情，或有任何资金的投入</u>。你自己会准备好所有的营销材料，并遵从他们的指示：你能保证他们不受到损害，当然，你要保证你所销售的东西，不会因为你的加入而让客户对他们印象不好的风险。


    +   第四， 努力让推荐人<mark>觉得有价值</mark>。由于他们的推荐，要把一定比例的销售利润分配给推荐人；或者<u>把他们介绍给你的客户</u>。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '第五，准备好接受质疑————人们不太能相信太过美好的交易。一定要让他们明白，合营会让双方的利益都能增加，都不会有任何损失。事实上，他们对这种合营是没有经验的，因为现在太多商人对合作有顾虑。他们之前很可能从来没有过这样的想法，所以要仔细跟他们讲清楚你的计划和由于合营会获得大量额外利润。


    # ### 如何赢得信任


    推荐人并不是一一———个你需要说服的，你还要说服推荐人现有的客户。因为这些客户与你所说的企业有长期的关系，他们相信企业所说的话。但是推荐人还要建议他们采取新的行动—————在任何情况下，这都是艰难的一步。


    为了确保你能赢得客户的信任，要考虑提供更长时间的保证，或多增加一些赠品。这样，你和你的推荐人才会赢。你才会克服购买者首次拒绝购买的自然心态，推荐人也会因为给客户提供更好的待遇而形象更好。


    当然，与潜在推荐人磋商支付情况是没有特定规则的。在与推荐人分享收益前，要求推荐人支付营销成本和一定的投资也是很正常的。这通常是比较容易的投资，因为这种营销投入是微不足道的—————尤其是与其它所带来的回报相比。不管怎样，双方平等分享营销投入和收益是可能的。


    # ### 分配收益


    分配收益的方式也可以改变，取决于你想要怎样的合营关系。在前端你可以选择放弃收益，因为你期望从推荐人所带给你的客户那里获得更多的后续业务。在这种情况下，你可以让推荐人拥有前端所有的收益，在


    114'
