- pgno: 243
  md: '# 如何辨别你选择的利基市场是否正确呢？


    下面的几个问题将帮助你区分有利可图的“好”市场，以及白白浪费钱的“坏”市场。


    请你回答以下10个问题，如果你的答案大多数是“否”，那么请你立即（不要犹豫）离开这个市场，不要再浪费你的钱。你需要去寻找新的目标市场。


    +   • 能够通过邮件的方式给顾客发信息吗？


    +   • 有可以刊登该利基市场广告的行业杂志吗？


    +   • 有没有什么会议或展会可以展示你的产品或服务？


    +   • 在你的实力范围内，你的产品或服务能否到达利基市场？市场潜力巨大还是有限？


    +   • 利基市场中的顾客有钱吗？愿意消费吗？还是舍不得花一分钱？


    +   • 通过协会、俱乐部，或组织能够接触到该利基市场上的目标群体吗？这样你就可以利用社交方面的营销。


    +   • 可以再次交易（带来回头客），还是只是一次性交易？


    +   • 该利基市场正在增长，还是在衰退，或者静止状态？有没有变化的可能？


    +   • 该利基市场上有竞争对手吗？如果有，你是否有进入的空间？'
  merge: -1
  img_proc: true
