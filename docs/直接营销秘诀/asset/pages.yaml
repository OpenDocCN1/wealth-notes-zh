    千美元到 5 万美元。并且，人们会不断地支付那些高价。


    杰·亚伯拉罕之所以能够成功，第一个因素就是对于自己以及所教授内容的绝对自信。实际上，杰·亚伯拉罕只是利用了一套基本的策略，其中很多内容早在他出生前就已经被人们使用过了。


    而他也正是那么做的，并获得了一些惊人的成功——将很多徘徊在倒闭边缘的企业转变为价值数百万美元的公司。


