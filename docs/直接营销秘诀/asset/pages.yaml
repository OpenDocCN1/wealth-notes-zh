- pgno: 212
  md: '当你加大字号的时候，你就可以引起更多人的关注。这就和你说话的时候自信满满而不是低声细语一个道理。


    还有，我把提供赠品的文案字号加大、加粗后，销售都会上升——比之前的销售额上升高达 2.5 倍。而我的那个文案和之前用的内容是完全一样的。


    # 设置标题颜色增加销售


    小技巧：红色标题的魔力——通常主标题使用亮红色，字号加大，加粗同样可以帮助你提升销售。


    一种例外，如果红色的标题与文案的背景颜色有冲突，影响阅读效果，就可以不用红色，用黑色或者蓝色。


    然而，正文一般应该为黑色字体（宋体，颜色用黑色）。我还没有见过其他颜色字体的文案能够比黑色字体有销售力。


    试试以上方法吧。结果一定会让你高兴的。


