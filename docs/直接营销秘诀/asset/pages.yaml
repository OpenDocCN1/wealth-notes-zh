  md: '# **42、一种促进销售的简单方法**


    亲爱的朋友：


    只要你细心，认真，有很多种方法都可以促进销售。


    成功在于细节！关键是你使用了哪种方法？知道哪种有效，哪种无效，这才是最重要的。


    下面是一种最快捷、最简单、最轻松的促进销售的方法。


    如果你要在广告中、销售信中、微信中、或者网页上添加你的销售信息，来增加销售额，你只要按以下方法操作就可以达到目的。非常简单……


    # **把字号加大、加粗——尤其是标题**


    你要做的第一件事就是把你的标题、副标题、小标题的尺寸。把尺寸加大 2 倍、3 倍，甚至 5 倍。


    注意：标题和副标题、小标题的字号大小要协调好，主次分明。


    如果文案正文字体小于 9 号，请增大到 11 号或者 12 号。


    小技巧：正文字体不宜超过 12 号。经测试，我发现正文字体最大只能用这么大。然而，根据我的经验来看，标题、副标题，或者小标题就没有实际的限制了。'
