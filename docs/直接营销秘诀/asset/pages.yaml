    在短短的几个小时里，想想你已经完成了的事情。你已经将证明过的优秀销售说辞改装了一下，已经将其改造为书面语言，并且可以按照你自己的意愿将它寄给众多潜在客户，或者通过网上来发布，这样就像是你将自己克隆了十万遍一样，24小时持续可以销售了。


    或许你不想在信中直接完成销售——如果是这样的话，那么，你可以在销售信的结束部分邀请顾客给你打电话或者发邮件。在信中提供你的联系电话或者邮箱，并告诉大家，什么时候打电话合适，以及打电话找谁。或者，告诉顾客，你会在每天或者周五下午两点左右给他们打电话，或者发邮件。


