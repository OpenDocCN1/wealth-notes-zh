    # 19、懒人撰写销售信捷径


    亲爱的朋友：


    我很骄傲地承认，我是从盖瑞·艾尔波特那里学来的这种技巧。盖瑞是一位营销天才，而如果你想要学习最好的点子的话，一定要确保从最顶尖的人那里学习。


    这个主意相当简单，解释起来也非常容易：


    +   1. 将一位没受过什么教育的优秀销售员培养成为一名顶级广告文案撰稿人，要比将一位文学博士培养成为一名销售员容易得多。销售能力永远强于撰稿能力。'
