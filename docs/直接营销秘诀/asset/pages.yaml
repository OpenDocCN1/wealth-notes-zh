- pgno: 124
  md: '或者：“你想学习怎样使你的网站“霸道”的赚钱吗？”


    # 3、称呼：____________


    如果可以，尽量使其个性化。比如：“亲爱的XXX（名字）”。或者，用“亲爱的朋友”即可。除非你肯定顾客能看懂你的笑话，否则不要太矫揉造作。


    # 4、首段（起始段）：____________


    告诉我你是谁，为什么写信给我。如：


    我是李炳池。我被众多企业老板称为直接营销大师，实际上…


    或者： 我新写了一本书，阐述了如何将大麦町犬训练好，以便你可以不给它上链子就可以遛狗。我得知您有一只大麦町犬，因此您一定懂得我的这个承诺有多不可思议……


    我常用的15种起始段的撰写方法，见“营销通讯”之《销售信中最重要

    的起始段》。


    # 5、讲故事：____________


    现在开始讲述你的故事：我称之为“一切尽在于此”部分。在这里你要真诚地讲述你的产品。以及一些证明，案例等，一定要具体，用事实说话，请清楚。


    # 6、子弹：____________


    告诉读者你的产品是什么……然后一一列举该产品的优点。'
