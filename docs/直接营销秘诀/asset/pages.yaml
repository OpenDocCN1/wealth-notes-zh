  md: '# 31、警告：不要让 30% 的客户拉你的后腿！


    亲爱的朋友：


    你应该知道“80/20 法则”。我在[营销通讯之《成功营销的 5 个阶段》](#)中提到过，因为它是一个非常重要的概念，所以，我想更详细的来解释下。


    在营销中 80/20 法则是：


    +   - 80% 的销售额来自 20% 的客户。

    - 80% 的佣金由 20% 的销售人员赚取的。

    - 80% 的财富由 20% 的人产生的。

    - 80% 的销售额由 20% 的企业产生的。

    - 80% 的收入由 20% 的活动产生的。

    - 80% 的收入产生于 20% 的客户。

    - 80% 的捐款是有 20% 的捐助者贡献的。


    其原因显而易见。如果你观察人类的行为，你会立即发现，大约 20% 的人是拉车的，他们做了 80% 的工作和创造了 80% 的财富。其他的人都坐着车，希望别人会一起拉他们。


    绝大多数的人没有勇气和魄力来开创自己的事业。多数人宁愿在别人的车上凑热闹，满足于早 9 晚 5 的工作，拿着对方每月支付的有规律的薪水，尽可能做得少去赚钱。'
  merge: -1
  img_proc: true
- pgno: 164
  md: '在慈善募捐中的规则也是一样的，大约占 20%的人是贡献者，剩下的人是接受者。实际上，

    “80/20 法则”更像是“90/10”法则。如果我们仔细分析，对人口更精细细分的话，你将会看到只有 10%是真正的生产者和给予者，是真正马车的车夫。


    **30%是你拉的一些污物的自重，60%的是坐车的，10%的人拉 90% 人。**


    很多企业的第一个错误就是很少注意带给你 90%收入的 10%的客户——而是太多的关注剩下的对你来说根本是无利可图的人们，很可能他们在浪费你的钱。


    倾向于你的最好的客户是理所当然的，“我们不必担心这些客户，因为他们已经喜欢我们了”，这是一个工作上的思维过程。对于这些客户我们却变得很懒惰，因为我们知道这些客户是有利可图的。


    然后我们投入更多的精力和资源，去尽力使我们失去的客户能够盈利。我们继续打电话、发邮件联系这些人，继续劝说，贿赂，希望将来有一天他们会对我们所做的感兴趣。


    一个灾难性的错误啊！增加你收益的最快的、最简单的办法之一就是立即摆脱你 30% 的自重，浪费你钱的这些人(客户和员工)。不论你做什么绝不是有利可图的，摆脱他们，至少让你的车拉着比较轻松一点。


    你的下一步是给你的 10%或者 20%的客户提供更多的温暖和呵护。不论是什么，让这些赚钱的客户喜欢你。


    如果他们喜欢奶酪，继续为他们提供越来越大的奶酪。不要以为“他们这个月已经有了奶酪，所以没有必要再提供。”保持喂养你的 10%的赚钱客户，你知道他们喜欢。而且对于你和你的企业来说把他们当作是你'
  merge: -1
  img_proc: true
- pgno: 165
  md: '的**亲爱的、忠诚的**朋友——因为没有他们你不能生存和繁荣。


    那为什么我们大多数人都如此痴迷试图战胜那 30% 的人群？我们花了很多的钱和精力试图让这些“迷失的羔羊”和“游牧者”回头。


    现实是，<u>你永远不可能把达便车的变成车夫。而且你永远也不会把自重变成乘客，更不可能变成车夫了</u>。因为<u>遗传基因奠定了后天</u>，你最好立即摆脱自重。


    **事实上**，摆脱大部分乘客你会过得更好，这些人对你来说也没有太多的好处，留几个看上去有潜力成为车夫的选手，然后对你的 20%的最好的客户和顾客投入 80%的努力。


    当然你需要更多的客户，你需要那些进入你的 **营销漏斗** 的顶部的客户。但是你必须知道只有 20%（或更少）的新客户对你的企业是有价值的。


    你能清楚的看到如何理解这一原则的影响力，<u>甚至改变你的营销方法，甚至改变你的商业模式吗？</u>


    心中有了这一原则，你的工作不是改变你的自重和乘客成为车夫，而是要 <u>开发系统能立即识别你的车夫们</u>，因此你的重点是<u>把注意力放在快速识别、培养和收获稻谷上</u>，而把糠搅掉，你将大大增加你的<u>盈利能力</u>。


    真诚的，


    **P.S** .你给那些购买过你的产品多次的客户发邮件 、进行营销，所产生的效果比那些仅购买过一次产品的客户效果至少要 <u>强三倍</u>。


    166'
  merge: -1
  img_proc: true
