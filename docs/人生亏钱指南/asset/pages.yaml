- pgno: 201
  md: '但是算无可算，最重要的他没告诉我们，这个起号方法，需要等需要坚持，也有可能是无期的等待和无期的坚持。


    我们按照他说的步骤 1:1 进行了复刻，开始有了起色。


    但是不久，我们发现我们只能小爆，没法像他们那样单场大爆，我们去找到他，


