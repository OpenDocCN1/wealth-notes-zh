    或者碰到房主真的急售，动则数百万的交易稍微省一点就能抵得上普通人多年的收入，真不能在这里面省功夫。


    5. 另外18年跟朋友合伙开过友客，青岛这边的连锁便利店，20年直接关掉不干了。投了60多，回来20多。


    19年入股朋友开饭店，没怎么亏，小几万应该，20年撤。


    我现在的状态应该是我目前的最低谷了，但是这几年不顺也使我沉稳多了，还好还没有绝望，小项目一直没有断，小收入也一直没有停，勉强维持得住小团队，交的起房贷养得起家，富余是够呛了。所以还需要继续测试寻找适合我的可以长期耕耘的事业。我相信即使未来还有疫情，我也会爆发的！'
