  md: '10. 高在线只是迎合平台做数据，但并不一定能赚到钱，直播不要要求高在线。


    11. 内容产生兴趣，兴趣产生交易，交易产生复购，扩大流量，流量层层筛选，视为内容直播玩法


    12. 评论区大部分问题，应该由循环话术解决，其余场控解决。


    # 创业总结：


    +   1. 营销漏斗，短板决定高度。


    +   2. 店播模式：长在线、轮播 every、高转化、产品垂直，垂直，再垂直。


    +   3. 算法淘汰账号，认知淘汰团队。


    +   4. 不要说不能玩套路，商业从来不存在没有套路。


    +   5. 选择赛道上，做一个早期跟随者，而不是去做先行的炮灰者，除非供应链极其牛逼。


    +   6. 进入聚焦领域的圈子很重要，能少走很多弯路。


    +   7. 每个死掉的团队，都不一定比你笨，别人也不是傻子。


    +   8. 直播赛道，跟能力匹配相辅相成，一个赛道不行，真的不代表你不行，可能是匹配上除了问题。


    +   9. 一鱼多吃看着很爽，实际上可能什么都捞不到。


    +   10. 自然流，强主播，老板横行天下，弱主播，老板天桥睡穿。'
