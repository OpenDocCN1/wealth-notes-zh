    +   2. 缺乏敬畏之心和学习之心。通常来说，任何事都有两面，而市场只有一面，那就是正确的一面。而当时的我觉得，市场是我赚钱的工具，特别是期权，杠杠一开，美元自然来。事实证明，缺乏对市场的尊重和敬畏。


