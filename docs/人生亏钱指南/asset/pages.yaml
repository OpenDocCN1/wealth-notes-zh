    # 2. 一定要勇敢的去争取自己应得的权益。


    派出所，劳动仲裁委员会，法院等等总有一个地方能帮到你。首先你得自己自救，然后朋友才能帮你。


    # 3. 做任何事情之前一定要讲清楚，没签合同不干活，没交定金不干活！


    如果没交定金，没签合同，没讲清楚，你一旦开工做事情了，事后再来算账，怪不得老板不认账，不要让别人有白嫖的机会。


    4. 一般遇到拖欠工资的去劳动仲裁委员会,(要填写仲裁申请单，以及准备相关资料和证据) 如果仲裁不了，就去工作当地区人民法院进行起诉，(要写民事起诉状，这个不会写，可以找律师。)


