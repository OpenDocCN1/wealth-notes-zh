  md: '# @Robin 李


    坑： 合伙开公司因财务不透明终散伙


    详： N 年前与朋友 A，与一广州跨境物流公司老板 B，三人合伙在深圳注册开一家分公司，注册前签好协议，我与朋友 A 在深圳实际业务运营（每月给自己开工资），广州老板
    B 在广州提供渠道、客服、财务等等保障，三人各出 N 万资金，分别占股份 3/3/4；


    半年业务运营起来，但财务一直不透明（客户有账期，且整个业务流程涉及国外费用，财务出账有时候 2-3 个月）我与朋友 A 也接触不到对应资源，无法判断实际成本，每次我们算账都有利润，然老板
    B 那边都是刚好不亏，一年时间能看清一个老板人品和格局，最终我与朋友 A 选择离开，拿回了投资部分，亏损了一年的时光~


