  md: '投资百万的三个店面就这样全部被割肉了，我们夫妻二人分文没有，又背负了了20几万的债务，都说实体店做开门做生意，只要认真做，努力做，就一定会有收入的实则不然，要看你所选择的是哪一个行业，看你是否擅长，是否适合。


    我们建材行业投资比较大，一个品牌店的投入多则七八十万，少则也要二三十万，每个月还要支付设计费，人工费，库房费用，还有昂贵的房租费，几年时间投入刚刚回本，又要面临着店铺装修，因为建材行业更新是比较快的，


    而且品牌店厂家对店面升级要求也很高，所以不是有装饰公司渠道或流水较大的店面。也绝对是比较难生存。


    这八年的时间，我觉得我亏的不仅仅是钱，而是时间成本，这半年时间，不管是我做自己现在比较喜欢的演讲，还是做培训或者是做教育，都会拿到相应的结果，


    反倒是建材这个领域，没有交到一个真正的朋友，大家都是以利益挂钩，而且最重要的建材的圈层普遍，文化素质比较低，不爱学习，知足常乐，所以导致自己八年也没有太大的进步，这是最亏的八年


