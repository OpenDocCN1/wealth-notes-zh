    # 【3个月亏了男朋友卖房子的50w一直播，人生除死无大事】


    我是第一批在玩短视频和直播的运营，也是腾讯特约的主播培训讲师，也陪跑了一些品牌账号，


    甚至在创业前，我在一家比较知名的公司担任新媒体负责人。


    综上，在直播方面，我自认为作为一个老操盘手，我能对短视频和直播有着比较正确的认知，于是毅然决然辞职去创业，从一开始的成功到失败，我做出了很多选择。


    这也是我第一次分享，全程写了很多细节的地方，希望大家对短视频和直播创业这个板块有正确的评估和认知，就我的坟，能帮到想做和即将做短视频直播创业的小伙伴。


    背景：在公司做新媒体风生水起，预想创业出人头地。我是去年4月份出来创业的，从个人到成立工作室再到男朋友卖房开了个小公司，1年半的时间，最终结果以亏损失败结束。


    有人说：你应该要稳扎稳打，不应该让你男朋友卖房子。


    我一直都知道要资金和现金流尽量少的去创业，以及不应该卖房去创业。这些，在我辞职出来创业前，我都树立和建立了诸如此类的认知。


    因此，当我信誓旦旦、磨刀霍霍的从个人开始，做快手化妆品直播，第一个号第一场直播，就出了24单，单天盈利3000多。'
