    第一次是创业亏钱。


    2011 年在一个二本师范类学校毕业，八月份注册了教育咨询公司，开始教培行业创业。


    本身是老师，有教学能力，最开始租了一间民宅二楼做教室，通过免费自习室引流，招到了自己第一批学员。当时自己主要做一对一，一节课 200 块，一个半小时。


    玩命干了两年多，学费收入将近 20 万左右，但是期间跟在校老师合作做小班课，由于学员人数不稳定，老师课时费高，每节课不但没有盈利，还总会赔个 100 多。


    当时的想法是，坚持坚持借着在校老师的招牌，总会把班课做起来。结果没能及时止损，亏了不少。


    2014 年左右（时间节点记得不太准确，无大碍），靠着一些积累，教学场地从民宅搬到了门市。当时面积 140 平左右，一楼，房租一年 7 万。也招聘了第一位员工，一个同学介绍的课程顾问。


    招生方式主要还是免费自习+门店的自然流量（在学校门前），课程主打一对一，主要收入依然是自己的课时费。


    因为自身教学能力比较强，深得家长信任，开始在一对一上逐渐扩科，招聘了一些兼职老师。但由于学费较低，扣除教师课时费+顾问的提成，每节课盈利非常少，在扣除掉场地费用，其实盈利很少。'
