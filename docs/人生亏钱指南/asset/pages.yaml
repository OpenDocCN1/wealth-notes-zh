    4 个月反复不断地想也不断的复盘，有了一些总结，希望生财的小伙伴们看了之后，能给你带来启发。


    # 短视频直播业务总结：


    +   1. 起号方法有利有弊，创业团队想亏钱去玩不太熟悉的起号方法，最好老板自己亲自去做去研究，了解是否适合自己的品，结论不要听运营和外人的。


    +   2. 视频过不了 500，从模仿开始，直播过了不了 1000，从模仿开始。


    +   3. 拆解一个直播间、分析模式是重点，从玩法背后拆解套路，再融合、应用到自身，这个才是拆解直播间的根本目的。


    +   4. 违背平台规则，是做不起来的，照着平台规则，也是做不起来的。


    +   5. 新号为什么容易做起来，因为你跟新手做对比。


    +   6. 每个账号有 GMV、利润天花板，做矩阵是最 好降低风险的方式；但矩阵玩法也有可能成为压死骆驼的最后一根稻草。


    +   7. 对于精准流量直播间，每多播一分钟，就意味着增加成交的机会。


    +   8. 你以为你缺的是话术脚本，实际上是推流脚本。


    +   9. 没有流量就没有测款，没有测款就没有爆款。'
