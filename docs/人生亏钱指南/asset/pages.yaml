    但是结合所产品退货率，和人工其他的费用支出，我们这 2 个月多，毫不夸张的说，每天都在亏。


    最后我才知道，这种起号方法只有大爆，才能赚钱；假如不大爆，那就是亏损状态需要继续熬，熬到出人头地的那一天。但，我们的现金流已经支撑不住了。


    最终，疫情封城、主播违规、熟人运营散漫等一系列原因，我意识到熬不动了，真正压死骆驼稻草的，竟然是主播违规导致我们用心的一个账号直接封号。


    于是解散了团队，还赔了个 3 个月的办公场地费用将近 5w。


