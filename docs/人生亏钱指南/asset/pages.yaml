  md: '# @黄浩在观察


    看到自己搞不明白的来钱途径，参与前一定要做好风险防控！今天就说说我一个朋友受到疫情连锁影响，结果信用卡借贷暴雷亏了7、8万的事情，希望能给大家引以为鉴。


    从2015年开始，我一个工作不错有着良好工资流水的朋友，被身边同事怂恿办了多家银行的大额信用卡。


    这同事不知道哪搜来的路子，把这些信用卡一起“借”给所谓的熟人，每个月可以分到信用卡额度5%的利息。


    他当时想拉我入伙，我觉得这利息收入没由来，而且把卡借给别人也不放心，就没借。我还好心提醒他，这中间的猫腻不明不白，最好趁早把卡拿回来。


    中途他听了我的劝告拿过一次卡回来，但对方把卡的额度刷死了还没完。他去催还款，谁知道不仅没催回来，把卡全又送回去了，还倒贴了自己的借呗又借了一笔钱出去。


    我当时立马感觉这非常不对劲了，催他赶紧把借呗的钱要回来，其次就是卡也要回来，不要让对方继续刷卡套现，再慢慢地迫对方还款。现在知道了这就是所谓的连环贷。


    运气还算好的是，在疫情爆发前把卡拿回来了，但是款没还完，对方只答应每月还最低还款的方式慢慢还。结果一直还钱到全国都停航班了，才勉强还完一张卡。


    然后对方从此了无音讯，没还完的钱有七八万，我朋友只好自己默默填坑。'
