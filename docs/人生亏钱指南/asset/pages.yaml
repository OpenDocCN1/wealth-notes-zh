    因此，现在我深信，道理不需要知道太多，活出一个算一个。


    +   3. 不要轻易碰高风险杠杆。对于年轻人来说，杠杆是个好东西，比如贷款买房，短视频杠杆，这些杠杆能够把个人财富扩大多倍。同样，期权也是如此。但是相比较房贷和其他红利杠杆，期权的风险一点也不低。


