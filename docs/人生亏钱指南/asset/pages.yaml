- pgno: 166
  md: '这时候纸鸢来了，传说是抖音最大的服务商个十百千弄得。大公司有搞头，不会跑路。虽然之前认识的头部地推服务商都建议不要做。但是因为利润还是毅然决然的签了服务商。


    亏钱宝典“不听老人言”。


    签了之后任务来了，不能跟其他项目一起做，没问题，租写字楼搞个分公司。要做B端商户入驻没资源。没问题，7000+底薪挖其他公司的业务员。新的城市不熟悉，没关系招人，人事财务业务员。底薪加提成加奖金加社保。搞起。


    最大的问题来了，又没钱了。咋办？


    没问题找“朋友”借高利贷呗。月息1毛5的利息走起。就这样，第一个月算上拿到的佣金亏损2W。一想这必须放开了做啊，大胆搞。因为大多开支都在房租设备人员这些上面。


    继续干。好了。截止9月到现在佣金一毛没看到，所有还在做的服务商一起呆到北京维权。然并卵。20W没有了。


    其实第一个月6月份的结算都拖了半个月时间，在这个时候就出现了问题，而且九月份的时候改了一大堆规则，比如拉新距离等等，应该保守运营的。但是因为利润在那里放着所以自我安慰问题不大。还帮忙找理由来安慰自己。


    到昨天，分道扬镳跟合作的同事分开了他继续干地推这个行业，又找了个人合作。我就彻底告别这个行业了。


    当然最大的原因不是因为这次项目亏损。而是没有监督。这个才是合伙做事情亏钱宝典第一名。'
