- pgno: 236
  md: '第一次创业就踏上了一个巨大的风口，是幸运，也是梃不幸（为什么说是不幸，最后会详细跟各位剖析）


    13 年秋季学期，我们午休的学生一下子增长到 330 人，晚辅的学生也有将近 100 人。


    由于我和老婆是认真的人，工作能力不说有多强，至少在我们那个三线城市是吊打 95% 的存在，


    所以从 13 年秋季学期，一直到 15 年秋季学期，每个学期托管人数以 4、50 人的速度在增加，在 15 年秋季学期达到了午休学生接近 500 人的顶峰。


    由于 13 年发生了一些事情，我们没有继续做周末的辅导，但是生日会，游园会和游学这些慢慢在尝试做，而学生都很喜欢我们做的这些活动。


    14 年秋冬之交，我们接触了一个作文的加盟品牌，于是开始接触更多教育商业化的东西。


    于是我们开始做作文项目，一年的时间从 0 做到 300 多人的规模，游学项目也做得风生水起，最多一次用了 8 台大巴接送学生，但是跟老狐狸的矛盾也开始慢慢爆发了。


    跟老狐狸的矛盾体现在这几方面：


    +   1. 老狐狸是个生意人，不懂培训行业运营，但是老喜欢插手，由于我们当时午托学生太多，所以我们提出拒收一些学生的要求，但是老狐狸坚持“应收尽收”（反正不用他管），'
  merge: -1
  img_proc: true
- pgno: 237
  md: '但是做过教练和企业管理的都知道，往往一个刺头，就会导致破坏一个组织的氛围，更别说好几个极具破坏力的刺头在一起，所以我们很多时候立的规矩，我和老婆能执行，但是员工执行不了，


    虽然相比同行，我们做得还可以，但是跟我们自己的标准相比，差很远，


    所以我们会对员工提出高要求，而由于刺头的存在，达不到要求自然就会懈怠，不满的情绪也会滋长。


    而老狐狸不仅没有疏导这种情绪，还一直在泼我们脏水，说我们要求高。


    2. 无论是作文项目还是游学项目，其实都有非常好的前景和盈利模式，而且势头非常好，但是老狐狸看不上（更多是因为不懂，怕我们做大了架空他），而且影响到托管的运营，


    当然这也是在商业运营中的一个大坑——托管和培训项目看似一样，但是一个本质完全不同，对人员的要求也完全不一样，


    而我们本着最大限度利用资源的想法，让托管老师负责招生（本来这个没错，但是让托管老师跟教练老师走得太紧，对整个团队氛围的建设非常不好，而且教练老师也做一些托管，特别是晚辅的事情，严重消耗他们的精力——不是说不能做，但是要给足激励，


    但老狐狸在，激励不可能给足），开始大家干劲足做得还不错，但是老狐狸在后面煽风点火，加上我们自己社会技能不足，到后面整个团队出现了解怠，本来一片大好的形势顿时停滞了。


    3. 还有对员工要求的分歧。'
  merge: -1
  img_proc: true
- pgno: 238
  md: '当然这个跟什么学生都收脱不了干系。从一开始，我们的流程就很不错，而且每天送完学生回学校后，都会让员工填表和开会，总结当天的请况，所以我们的质量一直把控得很好。


    但是随着人数越来越多，难搞的学生也越来越多，而且我们很多的精力也用在教培方面，


    所以一些员工管住不学生，而针对此类员工，老狐狸和我们出现了比较大的分歧，诚然此类员工责任心没问题，但是管取不了这些学生就是管取不了，要么不收这些学生，要么我们自己来管，要么就辞之任之。


    所以最好到了矛盾不可调和的地步。


    接下来就到了展示我露操作的时机：


    16 年初，刚好我爸一个物业租给一个幼儿园，幼儿园刚好到期，而我堂弟想接，于是顺利成章就退出出来，老狐狸和我就以成本价高一点的价格接过来，当然主要是老狐狸在压价，但我自己也没有留心眼。


    而到了 16 年暑假，实在闹得不可开交，要分家了。


    从内心来看，虽然自己也知道那是个很好的退出时机，但是毕竟在自己最能拼的时候把很多时间、精力Tamb心血花在这上面，而由于矛盾，一时气不过来，就打算把老狐狸的股份接过来。


    由于 13-15 年超赚了 0.1 个小目标（主要是其他项目的收益和 14-15 年大牛市的股票收益），钱来得太容易了，而且对自己没有一个客观的认识，所以出发点就是想快点接下来，快点把这个项目继续做好，'
  merge: -1
  img_proc: true
- pgno: 239
  md: '然后老狐狸就看准我们这个心理，于是开了一个高价，最后30万的入股成本，我150万买过来，加上分红和他的工资，他在这个项目净赚了180-200W。（为什么会这么傻，其中一个原因是读书读傻了，按照所谓的市盈率、市销率来算，但殊不知这种一次性定价玩的是心理和预期，而不是公式和掉书袋）


    而我和老婆，最能拼最能打的几年就这样为别人做嫁衣了。


    现在想起来，真的就是无知且不自知。如果是现在的我，我就直接摆烂，要么就成本价给我，要么就你自己来搞，按照当时的势头，搞一个学期他就自动投降了，因为学生他根本搞不定。但是世界没有如果……


    而我150W买回来的是个烂摊子，因为托管开始走下坡路，而由于企业到了一个转型期，又没有找到好的转型之路，自己又瞎尝试，那几年不仅没有赚钱，还倒亏了几百万（运营是盈利的，但架不住自己瞎搞墙）而且差点踩大坑。


    16-18年是我人生的最低谷。幸亏18年撞了南墙，捡起自己最擅长的应试，从而团队“瘦身”，随后咸鱼翻身，


    20年遭遇疫情，21年“双减”骤然而至，但是这两年随便一年的利润都比跟老狐狸合作的时候最高一年的利润都要高。而18-21年也很幸运地又赚了0.1个小目标（主要是房子和股票）


    事后看，我们做托管那几年正是教育行业飞速发展的几年，而16-18也正是自媒体大爆发的几年，'
  merge: -1
  img_proc: true
- pgno: 240
  md: '如果那个时候有现在的觉悟，遇上生财有术，也许我们的学习能力，经历和经验能让我们在自媒体平台每年变现大几十万一年。但还是那句话，世界没有如果……再加一句，人生的每一步都算数


    当然现在的我应该感谢老狐狸，有些亏 30 多岁吃，要比 50 多岁再来吃要好得多，而且有了这些经历，我已经从一个书呆子彻底蜕变成一个懂得人情世故的人，也更能客观地认识自己，并对这个世界有了更深刻和清晰的认识。


    最后总结从这段经历收获的几点：


    +   1. 要找准自己的优势和定位，精耕细作，积累复利——如果当时主攻初中高中学科辅导，以我和老婆的能力，“双减” 对我们根本不会有任何影响，而且会活得很滋润。


    +   2. 来钱容易但天花板低且没有复利的项目，只适合赚一波就走——托管就是如此，当大家都觉得托管好做的时候，就开始打价格战，然后最后大杀器来了，学校重新做回托管。


    +   3. 搭档一定得三观一致，合作前要谈好退出条件，先小人后君子。


    +   4. 远离给你带来负面情绪和影响的人——18 年底，当我开始远离那些给我和老婆带来负面情绪和影响的人，我们就开始彻底转运了。


    +   5. 不要停止学习，不要停止成长——之所以踩这个大坑，很重要一点就是自己放缓了成长的步伐，认知驾驭不了自己的财富。'
