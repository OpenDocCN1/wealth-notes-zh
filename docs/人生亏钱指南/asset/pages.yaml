    # 经验：


    +   1. 无论是价值投资还是纯技术流，对于小散来说，首要看的还是外部环境，外部环境决定估值模型，决定走势薰转。绝不可偏听偏信。对于小散来说，基金定投是一个不错的贯穿牛熊的选择。


    +   2. 每个人的风险偏好，资金量不同，同样操作可能有的人赚钱有的人亏钱。

