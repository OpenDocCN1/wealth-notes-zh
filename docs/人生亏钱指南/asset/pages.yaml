  md: '虽然我自己的主业还是在打工，但是对于投资行为一直很感兴趣，我也很佩服各位创业的朋友，现在的确是最好的时代，大家都在分享信息和经验。


    其他亏欠的投资主要都在股票基金里，大家都一样没办法赚到认知以外的钱，我自己也在不断学习投资知识，希望以后能赚的稳一点。


    # @Summer


    我的个人经历比较丰富，很多经历不适合说，前后搞过的项目也比较多，07年上大学就开始副业了。前期也一直比较顺利，也体会过择金如土年纪轻春风得意。


    不顺也就最近这疫情几年，梳理下我的亏钱经验。


    +   1. 17年在自己啥都不懂，没干过实体店不懂酒店行业，只是觉得青岛旺季到处订不上房，手上又有闲钱，就投了300多加盟开了个连锁酒店，选址在海边，真的海景房，自己比较满意。


    现实比较打脸，位置太偏除了除了 ota 订单根本没有客源。一般酒店行业 2.5-3.5 年回本，我 3 年才回来一半，当时还想着幸亏签了 10 年，本钱能挣回来就行，慢就慢点吧。


    然后，接着就碰到疫情了，坚持了 2 年，又把前 3 年挣回来的本又亏回去了。 。 。


    于 22 年初转让卖掉了，还好我铁定了要丢掉止损，不然今年又要亏几十万。


    所以赚不到认知以外的钱是正确的，不懂行冒进必定是会交学费的，有时候命不好的时候学费还是比较沉重的。'
  merge: -1
