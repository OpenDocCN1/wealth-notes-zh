  md: '# 四、实体项目篇


    亏钱原因：


    +   1. 库存积压：囤货囤多了，库存积压，卖不出去，货砸在自己手里。

    2. 加盟踩坑：没有经过仔细的调研，被华丽的宣传给忽悠了，加盟了一些坑爹的品牌，付了几万元的加盟费，但是产品不好卖不动，或是品牌方管理不行，加盟商之间乱价、竞争激烈；或是自己的选址不行，门店人流少；或是钱凑了但是证件办不下来。

    3. 实体前期投入高：实体创业，场地租金、装修费用、进货投入、员工工资...都是还没赚钱之前就得重金投入，没做好市场调研、选址、成本计算，就很难赚到钱。而且很多环节都是要签长期合同的，即使亏损了也不能马上结束，仍需支付各种费用。盈利不成，支出不断，最终血亏

