  md: '后来觉得这么一直亏钱不是个办法，就开始找一些赚块钱的办法，例如做熟悉的阿里巴巴团队服饰批发。结果因为做这个批发，又收了一个小服装厂。后来因为有了厂子，又要不断的招人……


