    经验：


    # 【你配站多少钱背后？】


    人对金钱的掌控能力是有段位的区别的。


    有的人哪怕身无分文，但能把很多的钱用到极致，顺利钱生钱。


    有的人即使身价不菲，也能做到做什么，亏什么。（别怪环境，还是自己太菜）


    对大多数人来说：


    +   1. 连掌控好自己的时间都够呛，更不用说搭团队、管理好好几个人的时间


    +   2. 对如何运用金钱的杠杆来赚钱，一无所知


    所以，对普通人来说：


    +   1. 既然自己的时间都把控不好，就先别想着撬动人力杠杆，搭建团队去创造价值。先自己上，把自己玩明白了，再想搭团队的事情。


    +   2. 既然管钱、用钱来赚钱的能力很差，那就尽量少做固定成本高的生意'
