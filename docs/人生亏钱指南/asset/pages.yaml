- pgno: 200
  md: '我感觉我掌握到化妆品这个类目拍短视频的流量密码，


    因此我开始不断去复制账号去做矩阵号，把化妆品的内容结构，不断翻拍、换衣服翻拍、内容结构调换顺序拍，制作成一个个看上去吸睛的短视频，


    最好的短视频有 1000w 播放量，正常情况下也是 20-30w 播放量。之前在公司的时候，就有捱多矩阵号的经验，因此依靠这些经验，我收获到了第一桶金。


    更因为这第一桶金，我成立了小工作室，开始批量做账号，找兼职主播来播，这个时候也是赚的。但是也是因为进行矩阵，人工成本开始变得多了起来，但我们算了一下，也还是可以支撑。


    因此作为一个操盘手，我开始在想，这个项目我们可能需要新增一些别的项目来增加营收，于是​​在这个时候，我和我的男朋友做出了一个重要的但是也是亏损的一个决定。


    我的男朋友也是个操盘手，他一直很想把握住这个直播的封口，因此，他做出了一个很疯狂的决定，他决定卖房来继续扩大直播规模，增加新的项目增加营收。


    在我看来，人不能卖房创业；在我男朋友看来，做生意都是先投入才有回报。


    最终，我们各退一步，产生了统一的意见，计算好每个月的最大支出，拿 50w 去做 3 个月，赌一把。


    因此我们开始在抖音上做日不落直播间，在开播前，我们已经在圈子里问了很多做了很多功课，这是风险最小的起号方法，甚至有个朋友，充当我们的免费顾问，给我们解答了很多问题。'
