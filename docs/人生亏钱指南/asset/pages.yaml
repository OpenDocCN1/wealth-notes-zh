  md: '# @安可


    如果我知道合作做生意会亏那么多钱，我就不会合作了。


    2021 年 8 月-2022 年 1 月


    跟朋友 5 个人一起合办了一家公司场地租金 3w、200 平方，公摊 45%也就是实际 110 平方。


    把我原来的办公室设备（电脑和直播设备）和押金 3w 块都放到一起，并上了 5w 块的货，总共亏损 20w。


    我是一直做广告投放和直播方面的工作，合伙 5 个人中 2 个也是做这个工作的，其中 2 个是没有经验的，我们开展了 5 个项目，这也是失败的原因、项目开展太多，没有能维持赚钱的，我其中一人带两个项目，其中一个能赚钱有利润，其中一个不能，我负担着整个团队
    5 个人的工资，并请了另外 4 个人。


    4 个人需要工资，场地需要租金，5 个股东如果项目不赚钱需要生活，所以没坚持了多少个月，就其中一个股东退出，押金钱也回不来了，剩下的设备要搬走，物业以没有租满为由，也没办法搬走。


    最后一个朋友出了押金把东西搬到同栋办公楼的楼珊上，我们才得以顺利散伙。


    这个经历告诉我可以接受投资，但是不要跟不熟的朋友一起合伙做生意，因为他们的能力你不了解，项目你也无法承担太多，毕竞你是请人可以挑能力好的，但是合伙不一样，你挑合伙人也要看他的能力，一旦一起合作，你很难清退，要谈好进入机制和退出机制。'
