  md: '人的欲望是无止境的，前几年做过国内虚拟币项目，期间看到太多人赚到钱小钱就疯狂投入，甚至变卖家产来投资。


    结果最后项目方跑路，虽然我止住了自己的欲望，赚了十几万就离场，但里面大部分人都血本无归。你盯着的是诱人的利息，而操盘手盯着的是你的本金。


    做项目一定要清楚赚钱的底层逻辑，你赚的是谁的钱？项目方盈利来源在哪里？


    # @志威


    参与一个 NFT 项目导致亏损。


    一开始了解到这个项目的时候，觉得和以前某个不成功的项目类似，因此决定不参与这个项目。


    后来过了 2 个月，慢慢发现很多朋友都在参与，也有很多 KOL 和自己敬佩的人也在参与，并且都赚到了不菲的收益。


    自己慢慢就怀疑自己最初的判断了，感觉错过了很多。了解到现在项目只需要 3 天就能回本后面就是纯赚的时候，终于忍不住入场了。


    结果入场第二天就发生大变局，购买的 NFT 价格急剧下降，收益率也下降得很厉害。


    仅仅隔了 1 天就是天上地下的区别，过了 1 个星期决定割肉离场了。


    总结亏损的原因，一个是自己太 FOMO 了，另一个是一句经典的话，当你不知道韭菜是谁的时候，你就是那个韭菜。'
