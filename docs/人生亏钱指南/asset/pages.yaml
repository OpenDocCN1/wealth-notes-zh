    由于求学经历一直很顺利，也因为08年金融风暴公司的一些列骚操作，加上无休止的加班（忙季的时候每晚凌晨2,3点下班，现在大厂的996在我看来根本不算什么），


    让原本对公司充满期待的我感受到巨大落差，加上家里在我们当地有一定根基，所以10年中做出了一个我迄今最后悔的决定——从广州回到三线城市的家乡。


    回到家乡后，进入证券公司工作，一个偶然的机会，发现了一个蓝海市场——中小学课外培训，


    刚好我家在最好的小学旁边有个房子，于是11年7月老婆辞职，就在那里搞起来小作坊培训班。


    由于有亲戚朋友的支持，暑假招了第一批种子客户20人，之后的秋季招了3,40人，对于几乎没有成本的我们而言，秋季学期一开每个月就有差不多2W的收入，非常不错。


    到了11月，原本学生都在学校午休的，也许是政策原因，也许是学校场地不够，学校就把五六年级在学校午休的学生“赶”了出来，'
