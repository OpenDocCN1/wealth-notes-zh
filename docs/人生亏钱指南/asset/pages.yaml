  md: '之后我觉得靠自己拉新有上限，最简单的扩大经营的方式是啥呢？没错招兼职。


    所以在网上办了个个体户执照。开始招兼职干。


    就这样铺了5-6个点位，兼职最高一天拉新188单。去除点位成本兼职工资以及物料成本一个兼职一单可以帮我们赚5块左右。


    这一算账惊呆了。


    这时候正好了解了地推这个行业，所以开始做渠道，去放单。于是是行业小白，所以接不了高单价项目。所以开始只是让兼职去做单。后面经营了一两个月，开始线上放单。


    亏钱重点来了！


    由于不了解这个行业，不知道哪些靠谱。所以亏了很多钱，比如跑路的。平台规则吃数据的。等等。而且因为在线上放单需要有人一天到晚在线上做客服。我们就边做客服，边去全国跑服务商，争取接高单价项目。


    就为了.一单5毛的差价，跑几百公里。慢慢的出现问题了。由于管理问题，线下点位物料丢失严重，人员流失，点位不出量。等等问题越来越多。后面一想，干脆全部做线上算了。本地以及运营才能做几个点位。


    所以放弃线下团队，全力做线上。就这样，稳定收益来源没了。而且出去跑，开支增加很多。天天吃饱喝酒会所KTV。嗯，钱没了。但是稳定的服务商渠道出来了。


    这个时候又开始想做服务商了，做渠道有啥前途对吧。'
