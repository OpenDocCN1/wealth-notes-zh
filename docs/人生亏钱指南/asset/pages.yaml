- pgno: 244
  md: '2. 19年跟合伙人重金押注票务市场，招了一批技术开发了个系统，然后加起来花了500多w签了些景点的独家票，准备20年大干一场。还是疫情的原因，整个市场都死翘翘的，一丝波澜都没有。


    签的票还好说，当时谈的就是可以延期，钱黄不了疫情过后继续干，就是压着资金，有些景区关系到比较好说这些还先退回来了些部分。


    主要亏的是公司人工，尤其是十来号人的技术部，我们一直等着疫情过去，觉得疫情不会一直在社会都不会安定，


    于是坚持了大半年，除了自己离职的公司没有辞退一个人，虽然降了些工资，最后公司确实没钱了，才开始该放的放了，算账人工亏100多万。


    当时我们大多同行都早已放人解散公司了，我们还在守着不忍放弃，最后就得为错误的决策买单。


    3. 20年底，一个朋友，比我还惨，跟我借100w周转，我资金也紧张只借了50，说次年国庆还。认识好几年也很熟，对两口子人品也比较放心。


    但是去年并没有还，今年应该也还不上了，疫情对他业务影响比我还大。但是去年还跟我打招呼说了，今年到现在还没给我打招呼。虽然我到现在也没有提，虽然我也困难了，只是我愈好对他们意见越来越大了。


    救急不救穷。借钱的真的是大爷，你帮助他被他当成是应该的就更难受了。所以名言有名言的道理：你借钱给一个朋友时，就是给自己找来一个敌人。


    4. 当初买房时太粗心，也处在比较有钱的阶段，看好一个小区然后随便看了几套就定下来了，前后花了一个来星期。'
