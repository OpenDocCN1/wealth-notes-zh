- pgno: 110
  md: '一定要选对合伙人并定期公开财务信息。


    与朋友一起合伙做招商，忽略了财务，赚钱变为赔钱。


    # @云蚁


    最近的一次亏钱项目地推拉新。


    这个生财出过航海，了解的朋友都知道 这玩意儿完全不存在亏钱的情况。那么我是如何凭实力亏钱的呢？坐好发车了。


    刚接触地推拉新是因为我当时在橙心优选上班。到后期，工作内容变成拉新了，每天 30 个新用户。当时，拉新一个奖励是 12 元。用户扫码一分钱可以买一提纸巾或者是洗衣液之类的，超级划算。


    所以拉新完全没有问题，香的很。最高的时候一天光拉新奖励都能赚到 1600+ 一个月比工资高太多了。所以辞职全职拉新。而这就是踩坑第一步。


    之后找了个同事一起干。他拉新的方式是菜鸟摆点拉新，我是骑着电瓶车扫商铺，都还可以。而他摆点忙不过来，就一起干了。


    之后我觉得靠自己拉新有上限，最简单的扩大经营的方式是啥呢？没错招兼职。所以在网上办了个个体户执照。开始招兼职干。


    就这样铺了 5-6 个点位，兼职最高一天拉新 188 单。去除点位成本兼职工资以及物料成本一个兼职一单可以帮我们赚 5 块左右。


    这一算账惊呆了。'
  merge: -1
  img_proc: true
- pgno: 111
  md: '这时候正好了解了地推这个行业，所以开始做渠道，去放单。由于是行业小白，所以接不了高单价项目。所以开始只是让兼职去做单。后面经营了一两‐个月，开始线上放单。


    亏钱重点来了！


    由于不了解这个行业，不知道哪些靠谱。所以亏了很多钱，比如跑路的。平台规则吃数据的。等等。而且因为在线上放单需要有一人一天到晚在线上做客服。我们就边做客服，边去全国跑服务商，争取接高单价项目。


    就为了1单5毛的差价，跑几百公里。慢慢的出现问题了。由于管理问题，线下点位物料丢失严重，人员流失，点位不出量。等等问题越来越多。后面一想，干脆全部做线上算了。本地以及运营才能做几个点位。


    所以放弃线下团队，全力做线上。这样，稳定收益来源没了。而且出去跑，开支增加很多。天天吃喝喊酒会所KTV。嗯，钱没了。但是稳定的服务商渠道出来了。


    这个时候又开始想做服务商了，做渠道有啥前途对吧。


    这时候钛鸥来了，传说是抖音最大的服务商个十百千弄得。大公司有搞头，不会跑路。虽然之前认识的头部地推服务商都建议不要做。但是因为利润还是毅然决然的签了服务商。


    亏钱宝典“不听老人言”。'
