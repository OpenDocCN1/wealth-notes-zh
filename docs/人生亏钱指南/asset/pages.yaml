    +   3. 不要辜负信任。跟朋友相处，放下助人情节，自己觉得对方需要的并不一定是对)_{方真正需要的。


    +   4. 在商言商，跟朋友合作也一定要考虑到双方的合理利益。在信任的基础上构建和谐的共识合作机制。把朋友搞的多多的，敌人搞的少少的。


