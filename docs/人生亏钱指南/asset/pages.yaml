    的股票，放到现在，还剩 40 美元左右。


    结合我个人股票和期权投机的经历，具体的坑有：


    +   1. 不打无准备之仗。我买卖没有计划，随机性非常强，也就是说，受情绪控制，毫无预案，感觉不好就交易，毫无章法。如果再来一次，我会把自己的交易规则写下来，然后倒背如
