    +   4. 新出现的事物，往往代表的是一种新势力，它们对保守的人是不友好的，保守的人往往用抗拒的心态去对待它们，这是错过新势力新机会的大可能。


    +   5. 那些兼容性很强，吸收能力很强的人，真的很让人敬畏，他们不让自己有思维的边界，他们的世界是开放的，所以他们总能看到新的机会和把控新的趋势，而一味保护自己，维护自己的人，思想上往往有很坚硬的外壳，会很好的抵挡新生事物发展潮流的冲击，也完美的错过新生事物带来的利益和好处。'
