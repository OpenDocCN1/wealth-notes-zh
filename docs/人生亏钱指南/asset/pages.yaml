- pgno: 242
  md: '发起人说如果有人信得过他，他还是按照一开始的约定“运营一年后100%退回股份”，


    但是当时大部分股东都不相信发起人，选择了30%当场收购股份。


    而我选择相信发起人，一年后我拿回了全部投资额2w。真的全凭运气没亏。


    第二次投资是参与火锅连锁店，2017年我和好友一共凑了100w（我15w，朋友85w），我们是属于不直接参与经营，但是每个月经营数据都要对我们披露。


    那个门店总投资额500w，头一年火锅店还有利润，经营的不错，预计两三年可以回本，结果2019年开始店门口修地铁（这很影响闹店生意），好几个月营业额不太好，好不容易熬到了冬天（吃火锅的旺季），


    结果疫情来了……到2020年直接扛不住发起人们快速把门转租了，我朋友把我的15w原路退回给我，据说后面转租的钱又投资搞别的生意去了。火锅店这个项目算是黄了，但是我又一次因为运气好没亏钱。


    总结以上两个小项目经验：


    在投资之前一定要充分了解市场，


    还有真的要做一门生意的话一定要做好充分调研和自己的风险承受能力评估，


    比如客栈这种生意，最大的影响就是政策，还有旅游业的淡季和旺季，还有餐饮行业，谁能想到疫情来了呢。


    最后就是找靠谱的合作伙伴比什么都重要。


    信息大爆炸的时代，真假消息满天飞，提高自己的认知总结经验教训才是根本。'
