- pgno: 241
  md: '# @Cherry''s 酱


    这题我也有一些经验分享，不亏欠是运气，亏钱全靠实力这句话一点没错哈哈哈！


    选说一说我凭运气没亏但是项目黄了的几个小项目：众筹大理客栈、加盟火锅店。


    众筹这么复古的词那是 2014 年的流行产物了不知道现在还有没有，


    当时我投了 2w 进去，算是第一批募集资金的股东之一，后来发起人又募集了第二轮，总共募集到 200w 左右，众筹的股东们好几十个人，


    最多的有投 10w 的，有两三个人，最少的投 5k 的，不超过十个，大部分都是跟我差不多投 2w 的。


    众筹规则里有一条：客栈运营一年后不想继续的股东可以原价退回股份。


    就这样发起人一边装修客栈一边筹钱，客栈经过两年时间差不多可以营业了，那时候大理正是客栈爆发期，很多人跑到大理搞客栈，但是赚钱的并不多。


    客栈开始运营后很多问题就爆发出来：'
