    +   4. 警惕你的房东！这条是发生在我一个朋友身上的真实案例，她们做烧烤店里的生意足够用火爆来形容。房东看到眼红 想要插一手。提出免除租金，自己也可以店里帮忙，条件是利润的
    30%。因为租房合同的漏洞，无奈，朋友关店换地方。


