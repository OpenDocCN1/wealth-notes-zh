- pgno: 245
  md: '后来搬进來住以及跟中介后续的接触才知道，同房型比我入手的便宜2，30万的比比皆是，甚至在我买完一个月中介成交了个比我大20平的户型房主急售最后比我房子都便宜了10多万，前后差价60多w。


