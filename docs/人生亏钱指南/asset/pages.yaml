  md: '2018 年底到 2019 年 10 月，我和三个朋友背靠一家 20 万用户的集团公司做实体零食饮品赛道创业，当时衡量自我实力的时候，认为背后有靠山，自家这三年给集团做了几千万上亿营业额，重新做小生意应该没问题。


