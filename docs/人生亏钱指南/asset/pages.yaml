- pgno: 235
  md: '由于地利的优势，我们那波“捡”了 2,30 个学生，开辟了另外一个收入渠道。到了 12 年的春季学期，中午托管学生已经到了 5,60 人了。


    这种迅猛的势头，引来了老狐狸的注意。老狐狸是我爸的手下，代我爸公司管着物业的事。


    刚好他那里有一个 1000 平左右，但是绝对出租不了的物业（也是我爸公司的物业）。


    于是老狐狸建议，可以把那个地方利用起来，而刚好我在证券公司待得不爽（一个眼高手低的书呆子在三线城市，基本不可能待得爽），所以一拍即合，合伙搞一个托管。持股比例是
    4:4:2——老狐狸 4，我 4，我堂弟 2（开始做小作坊的时候，是我老婆和堂弟老婆一起做，里面的故事也可以写一篇小作文，这里按下不表）。


    签订协议那天我还清晰记得是 2012 年 8 月 28 日。


    而我半个月之前就辞职了，开启了全职创业的不归路。


    之后就分头行事，那个场地开始装修，午休的床和吃饭桌子也开始做。


    当然这些事老狐狸负责。而我们就继续负责运营我们的小作坊，12 年的秋季学期，午托学生已经达到 80 多人，晚辅和周末班的学生也有 4,50 人。


    到了 13 年的春季学期，午托学生正式超过 100 人。


    也正是在那个学期，我们知道从 13 年秋季学期开始，学校正式退出午休业务，也就是说所有学生如果中午不回家，只能上校外托管。'
