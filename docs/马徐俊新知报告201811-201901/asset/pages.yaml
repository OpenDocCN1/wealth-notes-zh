    +   1. Quibi在短视频领域迅速冒头，有两大原因：能撬动好莱坞与硅谷资源的两位创始人、极度"精品化"的内容。

    2. 对于好莱坞大导演来说，拍摄10分钟一集的短片，是一种全新的挑战，但是限制有时反而会激发创意，或许Quibi能为电影叙事找到新的语法。

    3. 好莱坞巨头之所以愿意与Quibi合作，也是希望拧成一股绳，应对谷歌、亚马逊、Facebook、Snapchat这些科技巨头的入侵。


