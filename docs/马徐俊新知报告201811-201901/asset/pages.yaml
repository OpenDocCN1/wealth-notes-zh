    什么意思呢？这么说吧，在此之前的基因检测，主要是寻找某一个特定的基因。比如，桑德拉- -纤维症这种病变是由某一个基因引起的，那么在筛选检测的时候，只要选择不携带这个基因的胚胎就成立。唐氏综合症往往是-
