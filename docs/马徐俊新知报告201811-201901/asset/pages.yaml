    # 下期预告：


    明天将给你带来的议题是#为什么说世界上并不存在化石石#


    如果有一种动物生存了上千万年，直到现在还保留了原始祖先的特征，我们会把这种动物称为“活化石”。比较熟悉的活化石有熊猫、中华鲟、蟑螂、鳄鱼等等。但是，最近一期的《鸮鹗鸮》杂志刊登了一篇叫做《“活化石”其实根本就不存在》的文章，根据鲀鱼的例子告诉我们，这个世界上下上根本没有活化石，而颠倒了活化石的概念，也颠覆了人类以自我为中心看待物种演化的思维惯性。'
