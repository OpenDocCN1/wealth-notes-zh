    \n+   三种最主要的机器学习方式  \n为什么要加强人工智能的伦理监管？\n\n人工智能在过去几年一直是全球讨论的热门话题，有看好的，有唱衰的，但对这个问题，恐怕没有人比人工智能领域的顶级从业者更有发言权了。科技媒体网站VentureBeat最近采访了四位科技界大咖，预测了2019年人工智能的发展趋势。\n\
