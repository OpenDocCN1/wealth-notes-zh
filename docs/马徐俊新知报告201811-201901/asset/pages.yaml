  md: '《哈利·波特与幻想时代》（*Harry Potter and the Age of Illusion*）的教育学课程。这门课的目的，是从社会、文化和教育环境的角度，分析《哈利·波特》广受青少年追捧的原因，以及它对21世纪教育体制的影响。


