    1.科学家研究发现，动物是有自我意识的。一个拥有自我意识的物种，是否应该享受跟人类一样的法律权利和公平待遇，这是目前全世界司法界共同面临的一个挑战。

    2.动物法律权利风向的变化，跟我们对动物的认知突破有直接关系。

    3.随着人类社会的不断进步，法律将界定人和其他物种，甚至非生物智能之间的关系。


