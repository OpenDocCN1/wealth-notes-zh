  md: '就推出了“候鸟计划”，允许老年员工季节性地工作和休假。全球办公家具巨头Steelcase也为老年员工提供了一个可以阶段性实施的退休方案，总体上减少了他们的工作强度。


    其次，是重新设计工作环境，做到对老年员工更友好。尤其是在一些需要体力劳动的工作环境，比如工厂等等，这种重新设计就很有必要。宝马和尼桑这两家汽车企业这方面就做得很出色。他们改建了生产线，优化了部分操作工具，让年纪大的员工可以不受体力条件的制约，完成更复杂的工序。此外，他们还把工人的座椅都换成了美发店用的那种旋转椅，让他们坐得更舒服。


    最后，就是将新老员工混合搭配。企业要想优化自己的劳动力资源，关键就在于新老配合，让年轻员工和老年员工在工作中搭配，彼此取长补短。这种合作，既能让年轻员工发挥出在精力和速度上的优势，又能让老年员工发挥出在智慧和经验上的长处。这种合作，将赋予企业更大的增长潜能。


    # ｜ 总结


    很多人对老龄化社会的到来持悲观态度，毕竟“老”这个字，带给人的大多都是衰败、迟缓、守旧等负面的联想。但是，老龄化研究专家保罗·欧文告诉我们，未来的老龄化社会其实充满了各种新的可能性。无论作为消费者还是企业员工，老年人都
    有无法比拟的优势。这些优势，需要被看见。老龄化，也将成为带动全球经济持续增长的新引擎。


    文章中有一句话特别有意思，我特意挑出来作为金句。


    原文是这么说的：Gray is the new black.


    所谓gray，就是指老年人的白头发，而black，自然就是指年轻人的黑头发。Gray is the new black，这句话的意思很好理解，却不太好翻译，我们姑且可以这么理解：老龄化不是危机，恰恰相反，老龄化，
    是新的生机。


    我觉得连续两期，咱们从不同大利看待相同问题的角度和得出的结论，可以更全面 的对一个问题的不同侧面加深理解，这也是咱们专栏希望带给你的，更多样的视 角，更多层的维度，因为本来复杂问题之所以复杂，就是因为它并没有一个简单唯一的解释。


