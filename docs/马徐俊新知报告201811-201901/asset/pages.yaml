    # 今日报告：人口老龄化是新的经济引擎吗？


    老龄化不是危机，恰恰相反，老龄化，是新。


    > ——《哈佛商业评论》


    马徐俊


    很多国家都在恐惧人口老化的问题，担心它会拖慢经济发展速度，增加社会负担。可是，我们是否可以问一问：人口老化带来的，只有坏处吗？


    今天的议题分为两个部分：


    为什么老龄化是新的经济增长引擎？


    老龄化一定意味着劳动力短缺吗？


    我们昨天刚刚谈过人口老化的问题，介绍了日本的一些应对举措，今天我们要重新看一下人口老化，对这个问题其实很重要——到2050年，全球60岁以上老年人口将会超过20亿，这是一个全球化的问题。


    很多国家都担心，人口老化拖慢经济发展速度，增加社会负担，应该想尽办法减少它的影响。可是，我们是否可以问一问：关于老龄化的，只有坏处吗？


    《哈佛商业评论》最近刊发，提出了一个完全不同的观点：老龄化社会，其实存在着想象不到的新机遇——这篇文章的作者是美籍加拿大的经济学学者——米尔顿罗伊是老龄化研究中心的主席，南加州大学的学者保罗·凯文（Paul
    Irving），他可以说专门研究老化的问题的权威。


    欧文在《哈佛商业评论》网站上连续发表了两篇文章，就是为了一起告诉我们一件事：关于老化的，你的想法错了。


    欧文说，如今的老年人和过去不同的是什么。当人口老龄化，老年人在整个社会中的多数，针对老年人需求的新消费市场将会出现，大量商机将由此而生。


    同时，老龄化并不意味着劳动力短缺，新一代老人往往更健康、平均寿命更长，有着更强的工作能力，老年员工将为企业带来不可估量的劳动力资源。因此，老龄化不会阻碍经济发展的速度，相反，它将成为推动全球经济的新引擎，我们必须主动抓住这个大趋势。


    ![](img/01c844c3686d1491ff37a19dd231c857_30_0.png)


    | 为什么说人口老龄化是新的经济增长引擎？


    之所以说人口老龄化是新的经济增长引擎，原因其实很简单：老年人手里有钱，但是有巨大的消费欲望。


    你要抛弃对老年人群体的那种刻板印象，觉得他们一辈子辛辛苦苦，到老了换来的钱一分都舍不得花。除了买大件保险之外，全部都给子女了。未来的老年人可不是这样，未来的老年人，有钱、敢花。


    欧文列了一组统计数据，可能会颠覆你的认知：从全球范围内来看，社会的少数财富是由谁掌握的呢？答案是：60岁以上的老年人掌握；不仅如此，以美国为例，美国60岁以上的老年人掌握着全美70%的可支配收入，可以说，老年人有着巨大的消费能力。'
