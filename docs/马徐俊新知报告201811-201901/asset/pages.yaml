  md: '里，美国900个行业里，有2/3都出现了劳动力的缩减，今年对英国的调查，也发现了相同的情况，这正好跟高科技公司的崛起时间相吻合，凭借着网络效应和硬件设施的普及，高科技公司不需要那么多的人力，就能获得比从前的垄断企业，大得多的收益，而它们还在用算法和人工智能持续扩大这种优势，并且拼命想办法避免，政府和监管部门要制定，适应这个时代的反垄断法规，和税收系统，要让大型科技大公司的巨额收益和社会责任相匹配。甚至我们专栏之前讲过的UBI，也就是“全民基本收入”这样的分配办法，《经济学人》认为也是值得考虑的新社会契约。


