  md: "# 122报告｜升职后的“三要”“三不要”\n\n122报告 | 升职后的“三要”... \n↓\n\n# **今日报告：升职后的“三要”“三不要”**\n\
    \n同事对你的看法固然重要，但最重要的，还是老板对你的看法。\n\n——《哈佛商业评论》\n\n# **马徐骏**\n\n升职当然是好事，但升职之后，人际关系会发生很大的变化。要费些格外用心，才能顺利适应这段换届期。今天的内容非常实用，我将带你看《哈佛商业评论》对升职后的六个建议。\n\
    \n今天的议题分为两部分：\n\n+   * 升职后，应该做哪三件事？\n* 升职后，不建议做哪三件事？\n\n我今天要来讲讲“升迁”这件事。升职之后，你要处理自己对自己的看法，也要处理自己与他人的关系。比如，升职后，可能因觉得自己配不上这个职位，或多或少有焦虑“冒名顶替综合症”的症状。\n\
    \n同时，你还有很多关系要重新梳理：比如说，过去的上级成为了你的同事，你要怎么做，才能让他们觉得有劣资格和他们平起平坐，打进去给个上下级关系。\n\n再比如说，过去的同事成为了你的下属，如何才能让他们信服你、跟随你？\n\
    \n《哈佛商业评论》最近发表了一篇文章，给出了清晰的指导。文章的标题叫《如何在升迁后证明自己》（How to Prove Yourself After a\
    \ Promotion），作者丽贝卡·奈特（Rebecca Knight）是一个自由撰稿人，主题为《纽约时报》《金融时报》等刊物供稿。奈特在文章中引用了顾问公司Genesis\
    \ Advisers的CEO麦克·瓦金斯的观点。瓦金斯认为，升职之后，最重要的是要从根本上让人们重新看待你，为了实现这个目的，你得遵守“三要”“三不要”原则。\n\
    \n![](img/01c844c3686d1491ff37a19dd231c857_14_0.png)\n\n# 1 升职之后，应该做哪三件事？\n\n\
    简单来讲，升职之后，从言语，到和同事的相处，到对整个环境的观察，你要做三件事。\n\n第一，一开始就要谨言慎行。\n\n升职之后，心里都是有股劲儿，想要有一番作为的。你因为对这个，你可能特别渴望分享你对一些事情的看法，像是团队应该如何运作，公司应该更关注哪些方面等等。\n\
    \n但是，瓦金斯说，在最初，一定要谨言慎行，也就是，保持低调。高调入场不会为你带来任何好处，这反倒会引出你的新上司在团队成员中的角色意识，然后再决定何时，以怎样的方式表现自己。"
