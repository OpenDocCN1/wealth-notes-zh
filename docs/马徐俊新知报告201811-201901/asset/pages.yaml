    # | 从电动飞机到飞行汽车


    这事儿，在咱们专栏的085号报告《电动飞机离我们还有多远？》中就曾详细详细讲过，具体的细节我就不赘述了。简单来说，就是挪威制定了一个计划，预计到2040年，挪威国内所有的短途航线，全部使用电动机。


    《新科学家》说，全球的航空公司都在热火朝天地进行电动飞机的研发，不管是老牌的空客、波音，还是全世界各地的创业公司，都加入了这场大战，这充分显示了电动飞机的光明前景，毕竟电动飞机的优点非常突出，环保就不说了，它还
    对场地要求低、运营成本低、噪声还小，非常适合短途飞行。


    更重要的是，《新科学家》认为，在未来，当电动飞机技术足够成熟，它很可能就变成了个人飞行器，也就是我们说的，飞行汽车。


    虽然目前飞行汽车还停留在概念的阶段，但《新科学家》说，它到来的速度，很可能超过你的想象。谷歌自动驾驶之父特伦，就专门创建了一家公司来研发飞行汽车，还和新西兰达成了试飞协议。


    像Uber、空中客车旗下的公司A3、德国公司Volocopter，都在紧锣密鼓地研发飞行汽车。而欧盟、美国的FAA，也都在制定相关的管制要求。所以说，从产品到管理规则，飞行汽车的明天，都已经在路上了。


    # | 总结


    关于绿色飞行，你只要记住4个词，就可以说是半个内人了：第一个是FRA——自由航线空域，航班可以自己规划路线，美国和欧洲都 已经开始尝试了；第二个是波音777X，这款飞机的机翼长达72米，是全世界效率最高的双发动机客机。


    第三个词是生物燃料，国际材料试验协会制定标准，允许飞机在飞行中使用不超过50%的生物燃料，而最新的技术研发趋势，是有可能直接从空气里回收二氧化碳，再转化成燃料；最后一个词就是挪威的“2040计划”，这是电动飞机普及的一个重要标志和里程碑。


    正如文章中说的那样，人类对于飞行的痴迷正在摧毁气候，但令人兴奋的新技术正在逐步修复这个问题。


    这句话也被我选为今天的全句：


    > > Our flying addiction is ruining the climate. But exciting new tech is on the
    way to fix that.


    在这4种绿色飞行技术中，你最看好哪种？


