  md: '(Computer Science and Artificial Intelligence Laboratory)的机械工程师约翰·伦纳德(John
    Leonard)提出，汽车出现紧急情况能停在路边，飞行汽车出现紧急情况要停哪呢？一旦出问题，就是人命关天啊。就算是特伦在接受采访时，被问到是否会让人坐飞行汽车时，他的回答都是他10岁的儿子想坐，但他不让。


    还有社会协调系统与民众接纳度问题，假如飞行汽车真的得到普及。空中会有成千上万的飞行汽车来回穿梭，传统的人力协调系统将不再适用，怎么设计一个基于人工智能的，能够让空中交通顺畅运转的空中管理系统，这也是一个重大的挑战。民众是否能接受也是个问题，现在抬头看天，还是无垠的天空，如果变成了汽车漫天飞，人们会不会感到厌烦，转而进行抵制呢？这也不好说。


    总之，飞行汽车的好处不少，问题也不少。但正如特伦在接受《连线》杂志采访时所说：“新事物在刚出现时看起来都很笨拙，喧闹，错误不断。但它们终将会变成主流”。


    这句话也被我选为今天的金句：


    > When new things emerge they''re clunky, they''re noisy, they break. But eventually
    they dominate.


    # | 总结


    关于下一个25年的交通工具的发展趋势，《连线》杂志告诉我们，也许在天上，而不是地上。我们可以由此预期，在几年后，也许世界讨论的就不是无人驾驶是否可行，而是飞行汽车了。有可能，未来你在出行的时候，打车软件里就多了一个选项——请问你是要空中出行，还是地面出行？你还要记住一个人名——塞巴斯蒂安·特伦，至少记住个性，特伦。以后别人再和你讨论自动驾驶啊，如果还是一遍一遍地聊马斯克，你就可以说：“马斯克还是个毛头小子呢，自动驾驶的鼻祖是特伦，人家都开始研究飞行汽车了”。


    你愿意尝试坐飞行汽车出行么？你看好这项技术吗？


    欢迎你留言写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。


    # 📋 划重点


    ![](img/01c844c3686d1491ff37a19dd231c857_3_0.png)


    今日得到：

    1.飞行汽车是汽车产业圈暗暗涌动的大趋势，Uber、美国航空公司空中客车、中国的吉利汽车等许多公司都已经开始投入飞行出租车的研发领域。

    2.谷歌的自动驾驶之父塞巴斯蒂安·特伦计划在5年内推出飞行汽车，他的终极目标是，建立一个空中出租车系统，让人们像使用Uber一样使用空中叫车服务。

    3.飞行汽车主要面临三大问题：技术问题、安全性问题、社会接纳问题，但是，特伦认为，它终将成为主流。


