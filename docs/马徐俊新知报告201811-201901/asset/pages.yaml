    # 划重点


    今日得到：

    1.在欧美发达国家，每年有50%的粮食被浪费。

    2.大部分食物被扔掉的主要原因，是品相不好。

    3.很多食物在超过保质期满后都不影响食用，也不会对人体造成伤害。

    4.粮食危机背后真正的原因，不是“僧多粥少”，而是分配不均的问题。

    5.浪费食物造成了自然资源的巨大损失，而食物释放的甲烷，会加剧全球变暖，引发严重的环境问题。


