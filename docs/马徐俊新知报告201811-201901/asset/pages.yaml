    # 今日报告：如何变得更快乐？


    我们  都会困于某些东西，但我们可以选择究竟要困于什么。


    > ——撒普《魔鬼经济学》


    我们都知道，北欧国家的快乐指数一直特别高。但是，这仅仅是因为北欧国家都很富裕、社会福利特别好吗？


    今天的议题分为两个部分：


    为什么说，有钱也不一定快乐？


    北欧人的两个快乐秘诀


    究竟怎样才能活得更快乐？是变得更有钱吗？是拥有更多高质量的人际关系吗？还是对自己的生活有更多的掌控感呢？播客 Freakonomics Radio《魔鬼经济学》为此做了一期节目，叫《How
    To Be Happy?》，专门探讨了全世界幸福指数最高的北欧国家，还邀请了经济学家、作家和记者们一起来探讨，北欧人的快乐秘诀究竟是什么？


    通过今天的内容，会改变你对北欧的固有印象，颠覆你的快乐认知。你可能会说，快乐并不是因为达到了某种条件才产生的情绪和感觉，实际上，快乐是一种选择。


    # 丨为什么说，有钱也不一定快乐？


    你可能也听说过，联合国每年都会发布一份《世界幸福报告》，在这份报告里，北欧国家的快乐指数，基本都排在榜首，而且常年霸榜。很多人都觉得，北欧人快乐指数这么高，主要是因为北欧国家都很富裕，社会福利好，事实上，真是这样吗？


    哥伦比亚大学的经济学家杰夫·萨克斯是这份《世界幸福报告》的撰写者之一，萨克斯原来在联合国担任丰富调查的特别顾问，他担任过南美、非洲、东欧许多国家的经济顾问，对于什么是让人感受到快乐这个问题，萨克斯很有研究。


    在接受Freakonomics Radio采访的时候，萨克斯提出了一个概念，叫做 GNH（Gross National Happiness），也就是“国民快乐指数”，它更多衡量一个国家的老百姓是否觉得快乐，GNH是比GDP（国民生产总值）更好的标准。


    萨克斯从2015年到2017年的《世界幸福报告》为例：前几年的，美国的GDP排在世界第一，但国民的幸福指数排在第18位，比新加坡还低5名；同时，我们知道阿拉伯联合酋长国非常富有，但在报告里排名第20位，比美国还低。


    从这份报告来看，财富和收入水平并不是快乐决定性条件，所以，北欧人民的幸福指数高，就是因为北欧社会的福利好，这个看法自然也是不对的。


    ![](img/01c844c3686d1491ff37a19dd231c857_117_0.png)


    而且，我们往往只看到了北欧社会的高福利，却忽略了北欧人民为之付出的代价，比如极高的税收、较难的社会阶力，还有一项特别值得注意的事——北欧的自杀率，一点也不低。


    先来说税收吧。我们都知道，高福利需要税收来支撑，而财富可不会凭空变出来，它是从钱袋里来的，所以，北欧老百姓要承担很高的税收。'
