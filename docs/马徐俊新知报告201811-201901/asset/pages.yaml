    # 总结


    我们今天讲了闪电式扩张的核心三原则，分别是：乱是对，暴力快速地解决问题，的方法是才好方法，只关注当下，放下长远构想。


    其实这三点都围绕着一个点在讲，就是，唯快不破，要的就是速度。


    读完最大的感受是，做一个创业公司，其实最重要的是往前冲，别想太多。做产品时，千万别一下子做出完美产品，招人时，也别指望直接招个有企业级管理经验的人，以后也要用上。先把当下的人和事管好了，才是最重要的；而一个快速往前冲的公司来说，混乱反而是对的。


    就像比尔·盖茨在《闪式扩张》这本书里写的序言那样：


    > Whether your business has ten employees or ten thousand, Blizscaling is the
    essential playbook for winning in a world where speed is the only competitive
    advantage that matters.


    这句话的意思是：无论你的企业有10名员工还是1万名员工，闪电式扩张都是取得胜利的必由之路。在这个世界里，速度是唯一重要的竞争优势。


    这句话也被我选为了今天的金句。


