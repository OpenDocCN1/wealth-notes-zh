    # # | 什么是智商预测技术？


    开头我们讲到，智商预测是通过基因检测来实现的。基因检测其实并不是什么新技术，多年以来，它一直就是试管婴儿技术的一部分，它能让医生- -来，并帮助科学家找出不携带某些基因的胚胎，来消除某些遗传病。


