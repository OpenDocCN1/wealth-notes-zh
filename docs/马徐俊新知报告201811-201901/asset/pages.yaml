    然而，这种情况的应用范围是- -的。比如说，这种技术心脏病或抑郁症就找不了。为什么呢？因为心脏病或抑郁症这些疾病的状况，不是单一基因的影响，而受数百个基因的共同影响。以往的基因检测没办法搞定这么复杂的基因体征。也就是说，你还不确定来哪些胚胎将来患心脏病或抑郁症的风险高。


