    马修·麦克德莫特


    2018年最棒的50个发明，让我们重新思考了“可能性”这件事。


    今天的议题分为两个部分：


    +   - 最棒的5个创意发明

    - 代表未来科技应用方向的3个创新


    每年年底，《时代周刊》都会推出一个很有意思的榜单，专门选出一年里最棒的发明。去年的这份榜单，我曾经在上一季的专刊里读过，获得了很酷的这份榜单。


    最近，2018年的榜单新鲜出炉，这份榜单混合了《时代周刊》编辑部的投票、世界各地主流媒体记者的意见，以及网络公开评选的结果，一共评出了50个年度最佳发明（best
    inventions）。


