    \ | 家族办公室为什么兴起？\n\n对于家族办公室的兴起，《经济学人》的洞见很深：它和社会财富分配的急剧变化有直接的关系。\n\n其实，家族办公室并不是新事物，它诞生于19世纪后期的美国。当时美国石油大王洛克菲勒家族发现，钱多到根本花不完。比如，洛克菲勒家族在1900年代初的资产就高达10亿美元，这在当时是极其惊人的数字。\n\
