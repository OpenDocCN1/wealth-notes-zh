  md: "# # 156报告|顶级富豪的“家族办公室”如何冲击金融市场\n\n\n\n> 今日报告：顶级富豪的“家族办公室”如何冲击金融市场\n\n亿万富豪们自己组建的“家族办公室”，正在跻身世界级金融巨头的行列。\n\
    \n——《经济学人》\n\n徐维煜\n\n全球顶尖富豪阶层中，正在兴起一种新的资产管理模式——“家族办公室”。这本会是富豪们的私事，为什么《经济学人》却说，它们会对全球金融带来巨大的风险呢？\n\
    \n今天的议题分为两个部分：\n\n+   1. 家族办公室为什么兴起？\n2. 家族办公室如何冲击金融市场？\n\n世界上最有钱的人，都怎么管理自己的财富呢？你可能会想，不就是各种常见的理财机构嘛，比如说银行、基金公司等等。但是，最新一期《经济学人》封面文章却说，其实在全球顶尖富豪阶层中，正在兴起一种新的资产管理模式——家族办公室（family\
    \ office）。简单来讲，就是富豪们会雇佣一个小型的团队来打理他们的财产，通过这种方式，把钱牢牢把控在自己手中。\n\n你可能会觉得，富豪们怎么管自己的钱，这不是人家的私事吗？跟我们有什么关系呢？是的，家族办公室之所以值得关注，是因为它们已经成为国际金融市场一股不可忽视的力量。\n\
    \n当前，全球亿万亿富豪们控制的资产加起来将近9万亿美元，其中大约4万亿美元都交给了家族办公室，这个数字甚至超过了全球对冲基金管理的资产总额，在重大决策上，它们甚至能和世界级的大银行匹敌。\n\
    \n正是由于公司规模太大，《经济学人》对家族办公室的态度表示担忧，认为它们可能会损害金融系统的稳定性，因为它完全私人所有，缺乏外界的监督，这种不透明性，会给金融市场带来潜在的冲击。\n\
    \n此外，家族办公室比普通投资者更有能力获得交易的内幕信息、提前了解税收政策的风向等等，这会造成更严重的信息不对称，降低市场的有效性。\n\n所以，《经济学人》认为，对于家族办公室的崛起，我们应该保持审慎的观看。\n\
    \n```\n``` \nBillionaires' in-house investment teams are joining the ranks of\
