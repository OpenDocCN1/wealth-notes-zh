    > **今日得到：**


    1. 社交媒体的 高速发展推动了建筑的“网红化”热潮。


    2. 建筑“网红化”有三个好处：为线下零售业注入了新的活力、把小众艺术推向大众、催生了网红建筑咨询行业。


    3. 建筑“网红化”带来的问题是：给当地居民的日常生活中造成困扰；诱发了建没物设计思路的高度重复和施工质量的倒退。


