  md: '易中，有三家都是中国企业，分别是滴滴，美团-大众点评和今日头条。刚才讲过，以创业文化文明的美国来说，想获得本国投资人的青眼就不容易，现在看来，海外的公司发展的更强劲，竞争力更强，吸引走了大批资本，美国的年轻人想要拿到海外的投资进行创业，就难了。


    最后一个原因就是现有平台的依赖，难以突破行业壁垒。现在创业项目多数是科技项目，而这些科技项目依赖的系统和平台，不是苹果的ios就是谷歌的安卓。对于一个创业者来说，能做成一个比较火的应用都不容易，想成长为像苹果和谷歌这种巨头平台，几乎是不可能的了。


    这就像是是一个厨子，在家规模超级大的餐厅工作，你做的菜再好吃，也就是一盘菜。一盘菜，做的再好吃，可能点它的人多，厨师会有不错的收入，但一盘菜，怎么可能取代一个饭店呢？


    # | 总结


    就像文章里说的，缺乏个人储蓄，来自海外的竞争和对现有平台的过度依赖，让千禧一代的创业之路越走越难。


    A lack of personal savings, competition from abroad, and over-reliance on exsited
    platforms make it harder for Millennials to thrive as entrepreneurs.


    这句话，也被我选为了今天的金句。


    你看，说到这，千禧一代看起来是挺惨，内忧外患一起来。往里看，读书吧，学费贵，毕业工资还不高，没房没车没钱。往外看，海外的创业公司一个比一个厉害，吸引走了大批投资者。即便是想做点科技项目，对现有平台的过度依赖，想成为下一个苹果或者安卓，也几乎是天方夜谭。


    那是不是说，千禧一代就放弃了创业了呢？也不能完全这么说。《大西洋月刊》说，千禧一代采用了一种曲线救国的方法来创业。


    经济学家约瑟夫·熊彼特曾经做过预测，说创新将会逐渐转移到大公司的内部。这个预言正在实现。越来越多的年轻人，选择进入大公司，在大公司内部进行创业尝试，很多人觉得，自己不用像老一辈创业人一样在车库里创建公司，还担心自己的温饱问题。进入大公司，不仅资源充足，还有生活保障，何乐不为呢？


    你认为，要创业，是自己出来单干好，还是留在大公司内部进行小规模尝试更好？


    欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。


    # 划重点


    +   今日得到：


    1.只有22%的千禧一代有创业的打算，大多数人认为，在公司里慢慢往上爬更容易取得成功。


    2.30岁以下的创业者比例一直在下降，已经下降到近25年来的最低水平了。


    3.阻碍千禧一代创业的原因主要有三个：经济压力过大，海外竞争日益激烈、行业壁垒越来越难突破。


    4.千禧一代里，有63%的人连500美金的机动资金都拿不出来。


