    明天将给你带来的是#建筑“网红化”的利与弊#


    由于自拍文化的兴起，很多建筑在设计之初，就把能否成为“网红建筑”作为首要的考虑因素。然而，建筑“网红化”这股热潮，是一把双刃剑，它既为零售业注入了新的活力，也对当地居民的生活造成了干扰，还在一定程度上，引发了建筑设计和质量的倒退。


