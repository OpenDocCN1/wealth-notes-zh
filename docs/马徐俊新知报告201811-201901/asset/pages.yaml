  md: '# 135报告 | 人体到底有多少个细胞？


    了解细胞，就是了解生命。


    ——《新科学家》


    马徐骏


    > “人类细胞图谱计划”，听上去是一个让你很远的概念，但是，今天的内容会让你知道，这项技术的发展前景，与你未来的生命健康息息相关。


    今天的议题分为三个部分：


    +   * 什么是人类细胞图谱计划？

    * 2018年的成绩单

    * 人类细胞图谱计划的未来


    有这么一个 问题，困扰了生物学家超过 150 年的时间。从来没有人回答得上来。这个问题说起来非常简单——人体到底有多少个细胞？


    在过去， 这一直是一个无解的谜题，所以，生物学家圈子 的人，专门给它取了个 小外号，叫“肮脏的小秘密”（dirty little secrets）。


    你可能会想，这个问题不是故意刁难 人吗？知道你， 人体有多少个细胞，为什么就关 系到现实？实际上，意义 太大了， 只要我们能知道自己身体里有多少个细胞，并且了
    解每一个细胞的情况，就可以知道，以后我们哪 里毛病了，就可以确切地诊断出到底是哪个 细胞出了 问题，这样一来，以细胞为单位 的“精准医疗”，就有了实现的可能。


    毫无疑问，这将会是 医疗史上一次重大的 变革。


    而最新一期《新科学家》杂志的封面文 章就告诉我们， 这个谜题，正在慢慢找到答案， 而解开谜题的突破口，就是一个 叫做“人类细胞图谱计划”（Human Cell
    Atlas）的新技术。


    我们在上一季 卓越星曾经讲过，人类细胞 图谱计划 曾入选《科学》  家》杂 志“2017年新兴技术”排行榜。就在 去年，这个计划正式公布了首批细胞30 项项目，扎卡伯格的夫人希拉里·陈也是
    这个计划 的倡导者之一。


    在今天的内容里， 我将会给你们带来详细 汇报，时隔一年，  “人体有多少个细胞”这 个问题有没有找到答案？人类细胞图谱计划 发展到了什么阶段？ 通往精准医疗的路
    上，我们还有多长的路要走。


    ![](img/01c844c3686d1491ff37a19dd231c857_41_0.png)


    # ｜ 什么是人类细胞图谱计划？


    《科学美国人》曾经说过，人类细胞图谱 计划是 人类基因组计划的升级。看到这两 个术语，你可能有些晕了，没关系，我一 个 一个给你解释清楚。


    先来说什么是 人类基因组计划，简单 来，它是一项对人类基因的探索工程。经 过30多年的努力，科学家们已经弄清楚了 人类究竟有多少个基因。 这些基因分别是 什么，而又分别  给出了
    人类的基因图谱， 这是一个非常了不起的世界 界科研成果， 所以 它还有一个称号，叫做 “生命科学的 登月计划”。


    但是，  想了解  人的奥秘，光  了解基因还 不够， 因为绝大多数细胞所包含的基因基 本相同， 虽然数量  都是四万多个， 只是  不同的细胞的  基因，
    表达不一 样。 这 就 引 发  了一个 更  深入 的 问 题——在每个独立的细胞水里， 到底哪些基因被 活 跃了？活 跃的水平  怎么样？ 这些细胞里，
    人类基因组计划是无法  回答不了 的。


    而  人类细胞图谱计划就可以  回答这些 问题，它相当于 把 “人类基因 组计划” 又向 前推进了一步，这项技术 的研究目标，就是 要弄清每一个  细胞  的
    位  置、构 成、 功能、基因表达、每一个细胞其它细胞互动 的方式等等。


    也 就是说， 这个计划不但是要解  答 “人 体里有多少个 细胞”  这个 谜 题， 还 要 360 度 无死 角 地 把  每一个  细 胞 都 研究 透，不
    消 说， 这必 然 是一 项 规模  浩大 的  全球  科 研 工 程。


    人类细胞图谱计划 吸引到 了 超 过1000名科 学家参与研究，  他们分别来自 55个国家的 584  个研究机构，  这些  科学 家从事的研  究领
    域也  很广 阔，从医学、物理学、细胞 学、基因组学，到大数  据领 域都包含  在 内，  可以说  是集 合 了全世界 最顶 尖 的科 研 力量。


    那么，既然  有这么多  科学家  投入研  究，  以一 年，人类细胞图谱计划都取得 了 哪 些成 绩呢？


    # ｜ 2018年的成绩单


    在 说 成 绩 之 前，  我 们 先 来  说说 这项 研  究最初 的 目 标。总 体 言，  人类细胞图谱计 划 设想这  三件 事，  第 一，绘  制  出精确
    的 人 类细胞图谱；  第  二，找  出 给 每个 细胞 的基 因 表达，比如  基 因的 活 跃 程 度、变化程 度， 这可以 帮 助研 究者 了 解
    人类  细胞的 造 作机制；  第三，找出 人  体 内隐藏的新细胞。


    而  回 顾整 个  2018 年，  可以 说， 人类 细胞  图谱  计划  在这  三个 目 标上，都取 得 了令 人欣 喜的 成 绩。


    我 们 先 来说 第  一 个 目 标 — —绘 制 精 准 的人  体细胞  图谱。  简单  来 说就是，  科学  家 们 在  尝  试给 你身体里
    的  每一 类 细胞都  做 出 来  的  位  置。 比  如说， 它 是  我 们  身 体 的  某 个部  位，  有什么 特性 和  功 能，怎  么
    运  转， 这  就 像  导  航，在 你的  身体  里 构 建 了 一 个 细胞  的  导  航仪。


    当  然，  因为  人  体细  胞分 成了 很多  个  类别， 科  学家们  先 是  挑  选了 两 类  细胞  作 为 试 点， 分别  是
    人 体发  育细胞，人 体免疫  细胞。它 们的 研  究 工 作，都 在  2018  年取 得 了 重 大的 进展。


    我 先  来解释一下  什么  叫  做 “发  育  细  胞”。  它 指的 是  在 生 长 发  育过 程 中  的细  胞， 比 如说  小  孩子  的
    细  胞。  这 个 很 好  理  解，  不过，值得 注 意 的是， 处 在  发 育  中的  细胞  里，  也 有  是 发  育 细  胞。


    科 学  家们  对 发育 中 的  人  体  组  织 细  胞， 比  如 说 肝  脏、 皮 肤、 肾  和  胎  盘 的  细  胞  进  行  了
    基  因 表 达 ， 到  2018  年  为止，  已 经 成 功 了  超 过  25万  个 发  育  细  胞的  数  据  指  纹  库
    ， 收  集  了 大  量 数  据 。  这些  数  据  会 告 诉  我 们，  每  个  发  育  细  胞  里 包  含 的  基  因  是
    怎  么  运  作 的 ， 比 如  哪  些 基  因  会  开  关 ， 哪  些 基  因 会 关 闭 ， 它  们 在  发  育 过 程 中
    又 如 何 相 互  作  用。


    掌握  了  这 些 数  据 和  知 识 ， 对 于  我 们  的  生  命  健  康 来 说 ， 有  着 非  常 重 大 的  意  义 。
    要  知 道 ， 很  多 遗 传 病  的  发 源 ，  大 多  是  在  人 体  发  育 阶 段 ，  大 约 三  分  之 一 的 神  经
    系  统 疾 病 ， 包 括 自 闭 症 、 精 神 分 裂 症 和  智 力 障 碍  等 疾  病 ， 都 是 这 样 ； 比 如  简 单  生  长  得  太  快
    的 发  炎 症 一 次  心 肌  梗  死 ，  早  产 儿  常  见  的  死  亡  原 因  —— 肺  部  发  育  不  全 。 听
    不  出 学  名 字 都 能  想  到 ，  这 些 疾 病 的 根 源 ，  都  在  细  胞  的  发  育 阶 段 。


    而  一 旦 绘  制  出 了  人 体 的  发  育  细  胞  图  谱 ，  我  们  就  能  在  细  胞  的  发  育  阶 段
    找  出  疾  病 的  根 源 ， 早  早 探 索  预 防 问 题 ，  及 时  扼 杀 在  萌 芽  的  对 性  的  危  险 方 向
    。 这 就 意 味 着 将 来  在  细  胞  中 ， 对  于  人 类 的  生 命  健 康 来 说 ， 是 一 个  巨 大  的 福 音 。


    科  学  家  挑  选  的 另 一 类  细  胞  对 象 ，  是  人 体 免  疫 细  胞 。  目  前 ， 这  种  细  胞  的  图  谱  还
    没  有  完  全 绘  制  出 来 ，  官  方  只  公 布  了  这  个  图  谱  的  大 型 数  据 集 ， 总 共 包  含
    了  近  5.3  万  个 免  疫 细  胞 的  数  据 ，  这  也 是  目  前  全 球  同 类  中  最 大 的  数  据  集
    。


