    异常性。举个例子，比如像人类的平均智商是85-115之间，而- -这个检测发现出哪- - 些胚胎智商可能会比平均水平低25%以上，那- - 母在的时候就可以避免选择这些胚胎。


    听到这，聪明的你该立马- - 应该想到另一种可能性：既然- - 检查出低智商的胚胎，同样样，- - 检查出- - 智商的胚胎，是吗？没错。虽GP 公司解释，他们会筛查某些-
