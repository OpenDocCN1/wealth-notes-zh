  md: '# 人生修行二字：平衡！


    有小伙伴问，上山研究差不多了的话，如何下山？


    这个涉及到人生观问题，所以写文章很少涉及此处，因为每个人一生想要什么没法写，写了就是给人洗脑搞“修行”，都是扰乱与绑架人们的道德是非观，比如 xx 形式做人是对的！


    道德嘛，是世间最基本的谎略…


    所以“具体要什么”这事没法聊，但“怎么要”还是可以聊聊的，大家一起修行，仅供参考。


    首先，上山是论道，下山才是修行，大多数人都搞反了。


    无论儒释道，上山都像是研究数学本源公式，下山是对付各种数学题。数学题解答方法千千万，但其实本质都一样，因为本源公式一样的。


    人生快乐度和解题水平成正比，而纵观地球解题高手主要三家，儒释道。


    还是那句话，看儒释道要有“科学人生”的观念，而不是“迷信”，这三家都是无神论的专业攻击有神论的“信仰”，通过科学思想帮助人提升思想力用的，但凡搞崇拜的都有点傻乎乎的。


    这就像是要研究资本论，而不是崇拜某主义…


    正常来说，一个人的人生观是“缺啥补啥”，这个可以参考马斯洛那个心理模型，从低级需求到高级需求分别是：


    生理需求。也就是吃喝拉撒睡，解决活着基本问题。基本解决了，获得了“生”，那就要开始研究“存”，也就是生活。


    安全需求。稳定和谐有秩序，这样人就不焦虑不恐慌。但事实上任何一个“搞发展”的国度，都不会满足小动物这个需求（而且要相反），焦虑和恐慌才是发展动力…大家可以对照一下日常生活所见所闻…


    归属需求。有房有车有存款有资产，感觉活到死也能稳稳当当的了，就开始有闲心找归属，家庭、朋友、爱。大圈子和小圈子。


    尊重需求。有圈子就要搞装 x，大家互相比一比，通过攀比获得存在感与快乐，会搞出很多标准。'
