  md: '何谓隐藏？就是为了达到“你不吞噬我，而我要吞噬你”的基础手段。


    吞噬，这种根本性的生命延续手段，使得“单细胞”有两个特性：手段+目标。


    +   1、天生的根本能力就是隐藏，这是最初级的伪装谋略。 2、在吞噬上无止境，想让自己变得“更大”，大无止境。


    换成人来讲：


    +   1、撒谎是天性； 2、欲望无止境。


    这时候我们再去看“多细胞的合作”（组织、社会）形态，就有了两个特性：


    1、“合作”就是“不互食”，且集合成强大掠食者而“食外”，这种关系需要通过单细胞的伪装隐藏来达到。


    换成人类社会这个多细胞形态来讲，文化、文明、思想等各种社会交互活动，本源都是建立在伪装隐藏的基础上。


    举个接地气的例子，比如家庭分裂的根本原因，是“伪装不共振”，古话“不是一家人不进一家门”。


    2、而“合作”一定是有终点的，“分裂”是个必然！终点就是“合作方”互食，这是由于单细胞的第2个特性决定的，过程表现的重要环节，就是产生了“精英阶层”。


    切换到人类社会的层面，就是社会交互关系中，没有所谓明确的朋友和敌人，大家只不过都是被伪装的本能推动，披着隐藏的外衣，在各种“多细胞掠食者组织”之间穿梭而已。


    所以，一是动物除了直系血缘，理论上讲没有一个“真正的朋友”；二是任何“掠食者”（集体组织）的生命都是有上限的！


    好了，这时候我们将视野放大，与生存结构形态中的“道德仁义礼”进行衔接，就会发现：


    每一个道德仁义礼，都会形成反面，失道、不德、不仁、不义、不礼！'
