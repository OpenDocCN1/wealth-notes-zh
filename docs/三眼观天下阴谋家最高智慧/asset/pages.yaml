    道德经就是个利器，这把利器放在市集上，被世人玩出花，有的给它喷漆（搞复杂），有的给它弄个刀鞘（搞歪了），但当您走过市集突然看到此利器，应该有伯乐在太行山遇到千里马的感觉，大声痛哭：


    > “哥们，那些人让你天天拉车，给你祸害成这样…你不是干这活的啊！”


    然后脱下麻衣给千里马批上，牵回家好好喂养。


    # 道怎么来的？


    有小伙伴在星球问，现代人物质丰富、信息畅通，而古人物质匮乏、所有书籍加起来 50mbU 盘就够装了，为何古人思想力那么强？


    回答是：因为现代人吃的太饱！


    或者讲：心浮气躁臭美滥嘴瑟…


    简称“作死”！


    这人的智慧都是“作”没的，越喜欢“作”的人，就越活在假象里，万一哪天外界剧烈变化，没有了“金字塔铁门”保护，结果就是“作死”了…


    求真务实为何是个传统美德？不是它有多么“好”，那都是包装，而是因为它很实用。


    这人饱暖会去思淫欲，而不是思考生死存亡。'
