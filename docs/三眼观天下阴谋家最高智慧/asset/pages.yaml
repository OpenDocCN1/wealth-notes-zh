  md: '这里顺便提一嘴谋略，谋略就是<|message|> 管原来是否平衡，谋略就是想办法让其失衡，从而获得一个谋划结果。


    失衡都是因为漏洞，做人是弥补漏洞（顺道，正看道德经），搞谋略就是攻击漏洞（失道，反看道德经）。


    所以下山这事，高级一点看佛家，中级看道家，低级看儒家（有了前两者加持，儒家就变成儒术了）！


    比如老子讲：善为士者不武。善战者不怒。善胜敌者不与。善用人者为之下。是谓不争之德。是谓用人之力。是谓配天之极。


    这就是在讲述一种平衡。平衡好了就是“善”，结果就是顺带的。至于一个人是否去武、是否去战等，老子不管，各取所需。


    当然，您也可以故意让人失道，使其好武、扛怒、争上等…让人失道就要攻击人的漏洞，道德经里讲的利害、人心运转、事物的相生相克等，充满漏洞…阴险得很！这就是谋略运用了，回头再聊。


    这人活一辈子就像一场游戏，最大的最根本的游戏一定是精神世界的，因为人存在的根本在于意识，社会交互活动中的物与资源也要围着人转。


    我们每天起心动念，其实都是为了玩好游戏，获取精神的平衡。把平衡研究好了，外物都是顺带的。


    人想改运，不是脖子挂符咒，门厅养风水鱼等能办到的，人会获取平衡，自然运气就来了，时间久了顺带的东西就越来越多，不想要都不行…'
