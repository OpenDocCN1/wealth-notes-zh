  md: '![](img/4874a246e4516bbd020adecffb3865a9_104_0.png)


    好了，把“单细胞”换成人，道理等同，对于社会来说，人之个体相当于单细胞，而一方社会相当于一个多细胞“强大掠食者”。


    每一个人都要寄生于组织下，组织有大有小，但其构成逻辑一样。都需要有主脑、心腹、耳目、爪牙（自古作为谋略基本框架），这就是最基本的组织结构，这是一个最基本的“领导班子”，由一个独立意识主导（主脑），加上心、耳、目、爪来实现整体组织的分工协调运作。


    东方叫谋略，西方叫管理，本质一样，都是为了形成组织并生存延续。


    那么好了，作为生物个体，最优的生存方式是什么？成为主脑！次级的生存方式，按照距离主脑的距离依次排列。两个单细胞组成一个多细胞，也会有主脑和依附之分，譬如家庭；复杂组织亦是如此。


    那么，成为主脑的最核心能力是什么？


    答：同一性！


    无论是东方谋略，还是西方的管理，最核要就是如何做到“同一性”！


    如果说这世界有财富，那么终极的财富形式，就是有多少个个体生物依附于你的“同一性”，无论是搞宗教的、搞政治的、还是搞文化思想的、搞商业的，各行各业、不同维度的竞争，都围绕“同一性”。


    所以中国古人提出个词“大同”，作为终极使命，大同就是全世界无所不同！思考一下这个理想有多大吧，这个词代表着中华文化的站位高度。'
