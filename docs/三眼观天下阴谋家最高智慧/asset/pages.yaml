  md: '佛家，讲究“爱万物”，通过慈悲怜啊成就万物，这也是一种谋略，慈悲不是目的，而是方法，是获得更高追求的高级方法而已，同样被“精神建设”强加好坏。


    所以，是非好坏都是给智商低的人看的，给予选择就是给智商低的定义规则，以便于设定“边界”搞“养殖”，可以参阅思想观的前三篇。


    捕捞鱼儿并不能强攻，而是布网设定边界与选择。


    这人如果跳不出道德与是非，跳不出好坏，就跳不出“空间”，就跳不出前后左右，就跳不出“渔网”，就什么都看不清。


    身在山中而不知庐山真面目。


