  md: '到其他掠食者身上来博取能量。而这些又需要精英去牵头推动，最后用物质利益满足缓和人与人的关系，以维系暂时的生命存续。总而言之，就是用更庞大的成本来推动掠食者生存延续，成本越来越大，直到崩溃！


