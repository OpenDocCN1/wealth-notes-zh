  md: '在权力上人们会联系武力、财力、地位等，这些都只是结果表象而已，而且认知越低级，越会向武力上联系，智商提高点的，开始觉得权力是个智慧，但模模糊糊。


    这样思考的话，曹操和刘邦的逻辑，至死也想不明白…


    # 2、法的层面：


    在法家看来，权力是从上至下的一种势，连起来叫权势；简单白话讲，有位置，再加上会办事，这就是权力。


    # 而主导操控权势的工具，就是赏罚，没有赏罚就没有权势。


    法家将赏罚称作国之利器，韩非子对老子很有研究，边领悟边写日记，讲一个他日记本里的故事，三眼给大白话改编下更容易理解：


    一个君王和臣子，臣子很坏，对君王说，老大你以后负责赏，大家就都喜欢你，恶事让我来做，我负责罚，替你挨骂，老大一听这个好，我就喜欢做傻白甜。


    结果是臣民们都去讨这个臣子，因为大家都惧怕他，久而久之，君王的权力就被架空了，因为失去了权势。


    这故事是个典型的“利用其威风而消灭其威风”的谋略。


    所以韩非子讲“邦之利器不可示人”，也就是赏罚这个利器千万不要给别人。


    法家的东西影响着这片土地，更影响着小动物的习性，每个小动物不自觉地都会玩赏罚，公交车车长都会利用手中的小权力玩赏罚，更不用说天然就有权势的地界了，比如医院、学校、以及各个雇门口。


    # 通过赏大概率不会让人获得地位，所以大家都玩罚，这个东西总结成一句话：


    # 合法（ Bert 位）的祸害他人（以罚做势）的能力。


    所以每每看到各种贪  W  新闻，还有什么医患关系等，都很好笑，都是瞎扯淡瞎评论，新闻都是挠痒痒，用表象看表象，深层次没法解决，公众号：知识天机阁，只能“补漏”，补了漏洞又会出现新漏洞，所以也不用解决，这是地球人类的普遍问题，很正常也很自然，能明白这一点认知提升一大截。


    好了，到了法的层面看权力够吗？不够！'
