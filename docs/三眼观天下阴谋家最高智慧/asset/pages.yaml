  md: '绝大多数人接受的都是“技工教育”，接受的都是“应用性”教育，这种“切块”式的思维，有着很强的实用性，而且重视逻辑，所以一是很容易理解，二是能够“填满”人们的大脑，感觉上沉甸甸的很充实，所以受到很多“高智商”的喜爱。


