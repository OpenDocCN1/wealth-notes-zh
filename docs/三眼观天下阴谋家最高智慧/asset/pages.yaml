  md: '# 阴谋家的最高境界（五）生存与伪装的五大维度！


    这一篇 2 万字，也没法标红加粗了，按道理可以拆解成十几篇，甚至几十篇，但是拆碎了就失去完整结构了，所以放在一篇。


    此篇所追求的结果，就是看完之后，再抬头观瞧外界与人，结构上基本就是透明的了！


    分上下两篇：


    上篇是《生存》，讲的是外界生存环境的结构，此时“道德仁义礼”就是集体交互的五个形态维度——相当于“象限”；


    下篇是《伪装》，讲的是个体在外界生存结构中如何找到“寄生”，这时候“道德仁义礼”就变成“五种生存伪装的技术维度”——相当于“坐标”。


    文章标题很难起，但还是归到道德经系列吧，因为是从老子“道德仁义礼”的框架讲起。但老子的东西很干，相当于“基础公式”，要解读公式就要找“例题”，整篇文章相当于“用”。所以文章内容其实是以《素书》和《阴符经》为主要内容，是从道家谍略角度来讲述，但是无论如何讲述，最终还是要回到道德经的系统之中。


    所以看本文会觉得涉及道德经的篇幅很少，觉得不是道德经系列而乱起名字，这里提前说明一下。


    在正文之前，先铺垫个东西：盲人摸象！非常有必要！


    # 盲人摸象


    在思想交流与获取的过程中，刺激人如何思考要远远比直接给内容重要得多！


    人如果会思考，即可无师自通；不会思考，1 万个老师教授 1 万本书，最后也教不出什么所以然。


    三眼讲东西思路比较奇葩，显得冰冷赤裸不近人情，有一些小伙伴难以接受，比如“伪装”二字会颠覆很多人对于人性的美好想象。能不能温柔的讲？能！但是事倍功半，且无聊没意义也没意思。逻辑是这样的：


    事物的存在犹如一头大象，谁也不可能把“整个大象”一步说到位，来个 360° 无死角立体呈现，人只要思想一动必有“占位”，也就是角度，相当于“摸象”的起始点。而阐述过程要通过比喻来代入，这在古代叫“象比”。'
