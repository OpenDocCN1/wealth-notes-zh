  md: '# 您的认知维度在哪？很简单地就能测出来！


    问：三眼先生，最近在结构和规则上有些糊涂了。结构是不是说：相同的元素以不同的方式结合就产生了不同的结构，结构侧重点在结合方式。规则是结构的表现形式。


    答：是，但可能有些人还是很迷糊。


    简单一句话就是：人观察事物形态的方法（思想）。


    举个简单的例子：一个简单的四边形，它会呈现出什么样子？


    为了找到这个四边形的“真相”，就需要人动用“结构”的力量。


    ![](img/4874a246e4516bbd020adecffb3865a9_193_0.png)


    # 低级一点的：用情绪去“解构”四边形。


    这是 90% 人的“方法”。


    此时四边形是很“硬”的，给人的一种方正的感觉，根据大小又可以给人宏大和狭小的感觉。


    # 根据人的情绪运转决定了四边形呈现什么形态。


    漏洞在哪？


    在于：人们想看见四边形是什么样子，它就是什么样子。'
