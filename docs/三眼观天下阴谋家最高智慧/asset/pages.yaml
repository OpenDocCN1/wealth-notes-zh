    此时东西方有两个根本区分：虽然都是为了个体利益与整体利益的“同一性”，但东西方走了两个维度的路线。


    西方-管理与制度（机器人玩逻辑）；东方-H鞋与认同（灵魂玩心）。两个加一起，你懂的这真的是高水平！


    在这两种不同路线，“教育”出来的人区分也很明显，在个体上，前者的成功标准是“阶层与成就”，后者的成功标准是“中庸”。


    这时候读者就会有疑问了：不可能人人都“中庸”啊，而且时下“阶层逆袭”渴望好像更多，这种路线靠谱吗？


