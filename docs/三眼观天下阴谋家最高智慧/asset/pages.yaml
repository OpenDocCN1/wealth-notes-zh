    他们区别他们的，咱们就是吸收他们的好东西，拿过来用即可。


    人类社会比喻成一个公司，佛家就像是董事会，主要任务是带队伍搞精神建设，道家就像是营销部，无论你是啥队伍，最后都要“出业绩”，要出业绩就要玩变化、讲变数。


    董事会与营销部没有孰优孰劣之分，只是各自分工不一样，但都是“重要部门”，“技术原理”上都一样，玩的都是：


    “人心，机也！”


    这东西才是個技术活，但越是技术活越不能加入义务教育必修课，你懂的！


    事物的变化在于机，人心的变化就是万物变化的核心！


    要抓到“机”，唯有提升“对抗孤独”的能力才行呀！'
