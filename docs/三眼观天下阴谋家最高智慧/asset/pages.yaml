  md: '（把人搞成圆的很“社会”）；


    另一个是归根到佛道本源思想，其实主要是道家思想，意为“正中”，也就是道家讲的那个平衡，凡事都要“守中”，也就是“道”，偏离了就是失道。这就很哲学化了，有形态分析在里面，已经超越条条框框的规范（让人变通）。


    # 上山是悟道，下山就是“道”的具体运用，也就是玩平衡。


    佛家玩平衡在于宇宙万物，它是把所有生灵都圈进来，通过因果缘等理论，形成一个万物平衡，人要在此间找寻平衡之处，积攒业力，然后打怪升级玩涅槃…因为过于伟大，一般来说凡人生活用不上，刨食更用不上，当成思想研究可以；


    道家玩平衡就开始入世了，跟刨食与生活关系很大，用三眼语境讲就是“获取结构的平衡”，家庭、事业、圈子、社会等等四处都是失衡的，都需要平衡。人活着就是不断地寻找平衡。


    # 如果能让大家都平衡，自然身处中心位置，财富名利情感皆为顺带，这个平衡用到做人上可以参考“寄生”那篇。


    比如经济的运行一定是失衡的，导致钱流倾斜，时间久了就会有力量推动重新获取平衡（新政策、新模式），但形式一定是生出新的不平衡来均衡之前的不平衡，经济发展就是在“左右摇摆”中前进。


    投资心法盯着这件事就可以了，这就是所谓宏观，外面有个风吹草动了，就知道又是一场新的不均衡开始了…这人看事物一定要有一个“心法”，有心法事情就很容易做简化，搞思想建设后能开心落地，就是于此。


    比如观人和处理人与人的关系，知道完美的“平衡人”是什么样子，自然就能清楚判断别人哪里失衡了，关系哪里失衡了，如何去平衡。


    道家思想没那么“伟大”，只是纯粹的去做平衡（忘我），而不是有什么“光荣目标”，玩的就是个形态。


    +   佛，玩自己；

    道，玩别人（外界）。


    所以个人觉得道家思想对于生活最受用，充实美好生活，当然也要因人而异。'
