  md: '人道既要以天道为根本，方以圆为基不失其道，方是在圆的基础上打出方孔而已；但反过来在人类社会之中，天道又要被人道利用，圆又要围着方。所以自古顶尖谋士叫做天官，道家是重天道的，以母性的圆规为本，用这个圆规就是用阴。


