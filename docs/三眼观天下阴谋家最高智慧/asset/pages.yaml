  md: '这是注定的，是动物本性、人的漏洞所推动而注定形成的结果。而且，越是朝着正向去做，就越会朝着反向发展，同样遵从“阴阳相生”！


    # 老子：上德不德是以有德。下德不失德是以无德。


    越想要成德，就越得不到！


    比如前文讲“仁”那一段，主脑的“仁治”一定会产生“不仁”的一面，所以仁只能用于“维系形态、节省成本”，而绝不可能让掠食者“长生不老”。


    讲到这里，想必大家就会越来越明白，道家“混乱才是常态”的逻辑了。因为在伪装与吞噬的驱动下，任何“人造事物”都会形成阴阳两面，不断地相生变换。因为“人造事物”自打一出生，它的结果早已写在“玩隐藏”这个基因里。


    我们所面对的外界生态，就是一个道-失道、德-不德、仁-不仁、义-不义、礼-不礼，这样一个阴阳变化的生态。


    那么好了，作为个体求生存，如何畅游在“阴阳变化”里呢？


    # 尺度与刻度


    这里有一个至关重要的观念转变：不要把道德仁义礼当做规范、规则等等，更加幼稚的观念是当成品德、仁爱、义气、礼节等，想必三眼的读者应该没有这么幼稚的。


    而是要把道德仁义礼当成“刻度”！


    没有刻度，怎么会有维度？一把尺子没有刻度如何测量外界？那还能叫尺子吗？每一个刻度都会形成正反两面，这里我们借用数学逻辑来表达，假设一个刻度为“0”，那么就会有-1
    与+1。


    这么讲虽然方便理解，但是也容易扭曲，这是现代人理解中国古代思想最容易发生歪曲理解的地方，也是拿着“科学观和哲学观”去理解“佛道思想”容易扭曲的地方。可以 procede
    用数学去方便表达，但千万不要死套逻辑。


    数学上的正反，与人心的正反完全是两码事。正如物理科学上的明暗与思想领域的阴阳完全两码事。


    数学上，角度、距离、坐标、象限等等，从两端的无限到中间的有限，这些是通过逻辑（用脑子）画出来的，可以用数字表达。'
