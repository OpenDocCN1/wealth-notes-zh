    \n老子不卖炒鸡蛋、不干木匠活，也没有像儒法墨兵纵等有着具体的社会实践领域，如果用功利主义去看老子，老子 100% 是“无用”的！\n\n但他老人家干了一个其他人都无法干的活：在找寻事物的本源形态上达到前所未有之至极！\n\
    \n如果把中华大地思想文明比喻成一棵树木，那么老子对“至极”的探索与追问，生出了中华大地思想之根，思想管理的方法、权力管理的方法、军事斗争的方法、外交纵横的方法、谋略的方法等无不源于此根，不仅有这些“大用”，乃至细小到做人的方法、做事的方法、思考的方法、养生的方...\
    \ \n\n这个“至极”就是道！\n\n一个不争的事实是，无论是身处市井还是庙堂，是武者还是文者，是古人还是今人，所有领域所有人都讲“道”。有政治之道、经济之道，有管理之道、经营之道，有做人之道、做事之道，再具象的还要有职场之道、饮食之道、养生之道、家庭之道、恋爱之道…\n\
    \n道无所不在，它就像是万物的本源代码，大家无论做什么都想找到那个本源，要归于那个本源，并且这个本源都是相同相通的，世间之事，殊途同归，其道一也！\n\n\
    三眼把这个过程叫做“归根”，悟道就是在归根！而这个根是老子给的。\n\n不仅文化上要归根，人们的思想与行为也在追求归根，悟道就是在悟自己、悟文化、悟所有人，悟那个由根到支脉的整个系统。中华大地能够血脉一体，人们能够紧密联系在一起，可不仅仅是因为现代社会规则约束，法是无定法（规则）的，而由道相连，也可以叫做“魂”。\n\
    \n地域有魂、文化有魂、民族有魂，人更要有魂！悟道就是再找魂，魂祖宗给了，能否合身看自己了。\n\n老子 100% 是“无用”的，但他的“道”有着万用，也可叫做“无用之用”！"
