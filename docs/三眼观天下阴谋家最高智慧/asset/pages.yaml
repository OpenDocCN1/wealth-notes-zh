  md: '撒谎是动物天性，所以不要动不动就发出感叹、哀叹，什么人生都是谎言之类的，多幼稚啊！不撒谎那还能叫做人吗？最起码的做人资格。


    还有什么“谣言真可怕”等等。有 microbes可怕的？道家子弟要习以为常才行，不能习以为常那就是幼稚！


    我们所面对的社会信息网就是一张谣言网，一点也不难理解，如果把谎言换位等同于低级动物伪装，那么信息网相当于无数个“伪装色”在欺骗交互而已。所以少刷手机多思考，少读书多思考…


    那这里有反应快的小伙伴就有疑问了：三眼，很多人讲话以及传递信息，可都是发自内心的啊，很真实的呀。比如很多有名的作家、文豪、公知等等，他们可都是真心的呀！


    非也！这叫“真实的谎言”。比谎言更可怕！就像“圣人”比小孩和女人更可怕。什么意思呢？


    比如一个人从小被教育怎么做是正确的、光荣的、智慧的等等，这相当于被灌输一套“伪装系统”，只不过当事者在做伪装之前，已经默认和习惯了这套系统，觉得它是真实的、正确的，所以不觉得自己是在伪装。


    换言之，当一个人陷入到“一段刻度”里，是很难抽离出自身的，跳出自我无比艰难。


    比如人情社会生产制造的某个人，和一个老外玩“讲究”，玩“义气”等，老外根本不“上当”。这时候内心就很郁闷：哎哟我这么真诚，你怎么无动于衷甚至还抵触我呢？


    原因是其并不知息，他是在向老外使用“伪装系统”呢，虽然自己早已习惯默认了这套系统，但老外并不埋单。最后呢大家伙都解释成“文化差异”。


    啥叫文化？就是伪装系统的集合！伪装系统对接不上，就是差异！


    “文化差异”讲小一点，就是“圈层差异”，每个圈层的“文化系统”（伪装系统）是不一样的，不同圈层互相看看对方，彼此是排斥的。


    何谓“文化同一性”？就是“你必须要接受我的系统”，才会带你玩。


    所以文无第一、武无第二，在文化思想界，在实际生活的各个角落，每个“站位”都认为自己是正确的、高尚的、真诚的。以自己为中心看其他“站位”充满虚假！'
