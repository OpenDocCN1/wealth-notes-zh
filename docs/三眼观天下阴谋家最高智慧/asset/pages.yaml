  md: '心带着脑子向前行驶，比如在遇到困境、迷茫、甚至生命威胁之时，往往心的效率更强。


    那么好了，以上是在集体角度看道德仁义礼，这东西如何在个体生存上应用呢？


    # 《下篇：伪装的进化》


    好了，上面站在生命存续的角度，画了一个框架，就像是一个时空划分成五个结构性维度，人都存现于这些维度里，无一例外。


    借用数学理论，上面讲了“象限”，下面要讲“坐标”。也就是站在个体角度，如何在这些维度里找寻生存的坐标。


    首先要明白一点：甭管外界环境在“道德仁义礼”的哪个维度，到了个体应用这个层面，五个维度都可以利用，小到两个人交朋友处对象，大到复杂组织交互。


    # 伪装的隐藏与人心的正反


    从伪装这个角度切入，三眼自觉是最佳的，为何？因为这是生物活动的根子。


    所有动物（包括人）的存在都是为了生存延续，而生存只有一个技能伪装。


    用此二字可以看透任何动物的轨迹。


    一个人从降生直到死亡，每一天每一刻每一秒都在不停的伪装，而承载伪装的就是“自我”。伪装套路不停变化，“自我”就不停变换。


    如何看透“自我”呢？如何看透里面所承载的伪装内容呢？这就是接下来聊的：念头的隐藏与正反。


    还是回到前文配图：


    每一个“箭头”（圆点放大）在外部寻找组织，获得“同一性”的过程，看似是“求合作”，而本质是“求食物”，这需要通过隐藏来完成。'
