  md: '佛道之法针对这一本源探究，上升到“无”的境界，逻辑类似于宇宙大爆炸诞生万物一样。


    这事咱先不研究，非本文主旨，咱都是“罪恶蛤蟆”，咱往下研究，研究怎么借助上乘之法入世创食。


    # 穿越的和尚


    所以，佛道的那么多文字，都是在研究“人的思想运作模式”。


