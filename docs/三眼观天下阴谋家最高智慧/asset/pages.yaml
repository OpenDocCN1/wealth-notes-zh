  md: '人心也是如此！


    这里就要引用哲学逻辑推导了，无限长其实就是无限短，长 me supremum just the short supremum，就像一个细胞无限向外研究可以广至宇宙，但无限向内研究同样是“一花一世界”的宇宙。


    长和短最终是“链接在一起”的，形成一个“圈”，这个圈就是宇宙（不是狭义肉眼所见的宇宙）。


    由此推究到人的存活，也同样是个“圈”，人从降生到死亡就是个“跑圈”过程，所以就有了轮回与往生的概念。一个人只有低维感官是理解不了的。


    为了把“跑圈”过程给记录下来，那就要发明“刻度”来测算记录了。


    从纯真动物为起始点（可以想象成人的降生），来到世间就开始“主动寻找和接受标准”，这就开始污染了，而思想的不断升华，伴随着的是标准的不断打破，而同时又建立新的标准（刻度越来越多、越来越大、越来越广），以新换旧是个常态，什么时候把标准都去除干净了，就达到了神性（佛家的空性、道家的虚无）。


    而达到神性也只是跑了一圈，重新回归了纯真小动物的起点，也就是“返璞归真”。


    为何会“主动寻找和接受标准”？因为是被利（某种吞噬结果）所推动的。


    利产生欲，利欲-心态-情态，这又是一套衍生系统，简言之动物对利欲的追求，不同维度产生不同心态，利欲好比一个方向，心态（起心动念的整体过程）就好比是过程，以此过程来填补利欲的追求过程，而这些又顺带出一个结果就是情态，比如喜怒哀乐，再向外延伸就呈现出苦乐的形式。


    整个过程相当于“从种子到果实”。果实是无法左右的，比如一个人不自觉地笑起来，不自觉地流泪，这都是控制不了的，欲想快乐就快乐，欲想痛苦便痛苦，这是不可能的！


    对低级的人只能讲结果，因为看得见，比如“别生气了，生气多难受啊”，这不废话吗…解决不了任何问题。对高级的人才会进成因，讲对方心态不对，而心态又是鸟利欲的追求维度所决定的，依次抉根，即可解决根本问题。


    跟呆子讲读书，跟智者讲思考…。'
