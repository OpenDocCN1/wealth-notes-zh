- pgno: 215
  md: '# 王上主导，市场经济辅助。


    # 主流是啥？就是大势！


    比如儒释道法墨都有各自的生存空间，在“智商层面”没有谁高谁低之分，只是看谁能更符合“主流”而已，大家一起抢“市场”而已。


    玩心力的未必智商最高，但在“用心思”上肯定是最“得体”的。


    # 2、一定要坚持住，因为各派别互相看看对方，都能指出各种漏洞，但不要被漏洞所牵制，因为事物必有漏洞，关键看谁能坚持。每一个“刨食主张”，每一个“符合大势”的东西，都会有漏洞，不能说有漏洞就不干了，不坚持了，那不行！


    还是拿儒释道法墨举例子，不能说今天发现玩“君子小人区隔离管设管理大法”好，V：一八四八六三六八五九，就变成这个路线，明天发现玩“两面三刀权术势”，就跑去法家阵地。


    # 玩脑力的人是可以跑来跑去的，这是其特性，但玩心力的人绝对不可以——前者玩“善变”，后者玩“不变”。


    同理，换成行业、领域、组织、团体等等大大小小交互组织，有人的地方就有心脑体的三重维度，道理相通。


    心力的结果往小了说，是自身内在的驱动力规则；


    结果往大了说，就是外在驱动力，就是精神领袖。


    跟愚者一起玩，废脑子；跟聪明人一起玩，废心力。


    绝大多数聪明人都会“主动求变”，脑力非凡，但是都缺少心力。


    每个人在世间都是有角色的，心性定角色！


    那么心性是什么呢？


    这东西是天生的，是“慧根”的根子。


    就好像高僧摸摸小娃娃头：“嗯…这孩子有慧根啊”！


    讲到这肯定会招喷，因为这就有一丝天赋人权论的色彩了，咱们暂且不继续探讨心性的来源，只说说心性的表现吧。


    最简单直接的表现就是：'
