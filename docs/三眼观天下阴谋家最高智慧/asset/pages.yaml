  md: '自我实现需求。攀比这个游戏玩久了就没意思，因为不“个性化”，再往高了玩就要要个性，这其实是一种更高形式的比较，自己建立一个标准，超越普及的标准。


    乍一看是不是充满逻辑，特别对路子？其实呢，典型错误！如果人信了，拿这玩意去搞人生，必将痛苦不堪！


    马斯洛这个模型是典型的西方“切块”思维，跟东方思想比境界低的可怜，为啥？把人的一生给搞成机械运转了，切成好几个环节。但人的一生是“一体”的，怎么可能切块啊？


    切完块了还自己打自己脸，比如讲不一定要先满足低级需求再去满足高级需求，那这还切块干嘛呢？


    西学就是这样：先切块花了1万字。然后用10万字再告诉你切块其实不一定对，要灵活。而为了灵活二字，又会写100万字死逻辑去应付灵活…越搞越复杂！


    所以大多是“脑子转圈圈”，受众们也跟着脑子转圈圈，觉得沉甸甸获得了不少…研究物可以，比如热气球飞上天，一次不行换个路径再研究，啥时候上天啥时候算，虽然不是最完美结果，但以后多“转圈圈”，反复测验。


    但研究人不行，因为人是活的！不能切！


    # 研究一样东西，都是向高维借取力量，再看低维：


    研究物，要拿着人的思维（数理化）去研究；


    研究人，要拿着“神”（意识）去研究。


    儒释道都是通过自然宇宙更高维度去看人，找人的根子，根子找到了，就能“一体”上去看“人下山”这件事。


    什么叫一体，就是把所有做人的问题归结到一个问题，此问题搞明白了，所有问题皆自如。


    儒家解题其实并不在孔子，孔子只是给个大体方向，相当于初代1.0版；解题市场版本在子思，也就是孔子孙子，他弄出个中庸之道，而后子思徒弟也就是孟子又发扬光大。


    中庸之道，其实是向道家偷的，也不能叫偷，毕竟也是师承道家。人们认识这二字，会有两个中庸：


    一个是马马虎虎，得过且过，凡事差不多的那个已经深入百姓骨髓的，约定俗成的概念，严重阿Q精神胜利法，需要批判！'
