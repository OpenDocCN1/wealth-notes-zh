- pgno: 105
  md: '但是大同后面还有个字-梦，合起来是大同梦。


    不加梦字，那是儒家；加了梦字，那就是道家。因为在道家看来，这纯粹是做梦而已，不可能实现！道家看社会是没有希望的，发展尽头只有灭亡，只有“倒过来”发展才能得救。这个观念非常之重要。


    观念的始发点决定了后续万千的顺带逻辑，决定了一个家派、一个人的思想结构，简称“三观”！


    儒家也是师承道家，认不认同道家呢？认同！但是儒家“明知不可为而为也”，因为追求大同这个标杆虽然难以实现，但是追标杆的过程会让人类社会一直维系下去，维持在一个“差不多”的状态，不至于“人互食”。


    好了，这时候读者们最想知道的“道德仁义礼”五种生存形态该登场了，但是等一等，还没铺垫完…再铺垫个啥东西呢？就是再深抠一下为何道家觉得发展没希望，这就要钻进每一个“个体细胞”去仔细研究！无比重要！


    # 人，是个“箭头”


    个体细胞（人），是有漏洞的！集体是由个体构成的，个体的真实形态决定了集体的存在，个体的漏洞从根本上决定了集体（强大掠食者）不可能恒久存续。


    人的漏洞是什么？是主动接受标准！


    如果把一个人用最简单的形式画出来，由三个东西构成：


    +   1、吃——必须要吞噬外界能量获得自身存续；

    2、两性——个体延续的本能推动；

    3、主动接受标准——找组织、学纪律，通过“同一性”而参与集体（强大掠食者），从而获得更优的生存延续。


    前两者是肉体层面，后者是意识层面，其实完全没必要这么划分，对于绝大多数众生来说，身体与意识是一体的，这三个东西都是被动的，用西方心理学的词套用，都是本能，或者潜意识。


    吃与两性是被动的很好理解，学习和思考（主动接受标准）也是被动的就很难理解了。


    其实道理很简单，你以为能主宰自身的意志，并起了个名叫“自我”，其实这个自我是很被动的，根本就没有自我，或者讲所谓自我也是由外界的一个个“人造标准”培植出来的，这根本就不属于你。'
