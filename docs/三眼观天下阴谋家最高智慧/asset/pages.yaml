- pgno: 55
  md: '但！道是求不道的，求到的“道”都不是道。而在这个一路追求的过程里，推动着人们的智慧得以不断升华，生出了百家文化，生出了中华文明！


    # 认知，是接近真相的距离。


    真相如同真理是无限远的（没有），但我们离真相更进一步，认知就更高一维。


    所以道这个字是“人首”在车子上不断前进。


    所以，为何三眼讲“如何学习”要远远比学到了什么更重要？因为学到了什么都是“死”的，只有“如何学习”才是活的。


    如何学习=悟道；学到了什么=法或术。当“如何学习”升高了维度，“学到了什么”也会跟随其变化。


    这就像是一个班级的诸位同学，老师都是同一个，教授的内容也都一模一样，但是成绩结果差异很大，这源于每个人的“如何学习”不一样，导致最后“学到了什么”也不一样。


    # 人与人的差别，就在于找寻事物形态方法的不同。事物的形态都是假的（暂时有限正确），只有方法才是真的，这才是人一生中恒久的财富。


    在观察老子之门的过程中，会有一个思维贯穿始终——“反思维”。


    老子：反也者，道之动！


    这个反可不是仅仅是反向、反对、相反之意，如果这样理解那就成为“死逻辑了”！


    三眼用现代词汇把其翻译成“映射”。


    # 事物存在的本真并不是正或反，而是正与反的互相映射的过程，万物因动（映射过程）而存在，没有完全静态化的事物，世间只有“活物”，没有“死物”。


    也就是说，老子的“反”不是个形容词或名词，而是个代表运动逻辑的词汇。


    # “无，名万物之始也；有，名万物之母也”。


    # “有无之相生也”。


    有要依赖于无，无要依赖于有，他们俩的互相“映射”形成了万物的运动本真，从而成为万物的“父母”，万物都是“映射”出来的。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 而观察事物，就是观察其从无到有、从有到无这个“映射过程”，这才是事物本真。


    这就好比观察一个人的思想，要观察其“如何起心动念——念头消失又起心——新的念头又生成”这一循环往复的过程，人的念头从无到有、有又还无（还无可能是返璞归真按原路返回，也可能打死了之前的念头另起一个头）才是人思想的本真。


    这个过程就好像风箱、又像是蝴蝶煽动翅膀等等一样，一开一关一合一张，这个“节奏”就是事物在运动，“节奏”才是事物本身。


    所以：


    处理人或事物=处理这一合一张的运动形态。


    将欲翕之，必固张之。将欲弱之，必固强之。将欲去之，必固与之。将欲夺之，必固予之。是谓微明。


    这句里的细处逻辑我们以后再聊，我们看其整体，讲的就是：


    要想摆弄事物，首先就要洞察事物；而事物的本质是运动，那就要通过一个“反”去搞“映射”，“映射”一动，事物的运动本真即可显现；


    这就好比拿“冷”去试探“热”，冷与热的“映射”才是事物的本真。


    而在洞察了这一过程之后，要找到摆弄事物的关键点——微明。


    这个微明其实并不是一个“点”，我们现代人从小接受西方思维都习惯了，逻辑很容易限死，这个微明是一个“链接处”，其实这么讲也不是很恰当，但总比“点”字要生动。


    如果把事物运动比喻成窗户一开一关，那么这个“链接处”就像是窗户的“合页”，古人对此有个比喻——几（后来写作机）。


    只要掌控它（机点），即可掌控事物如何运动。


    这就如同现代人总说“我们要掌握好节奏啊”，这句话可追溯到几千年前的道家，但其实大多数人根本就不清楚“节奏”是個啥。


    人们每天都讲着道，但却不知道其是个啥！百姓日用而不知，故君子之道鲜矣！


    老子的这个思想就这么简单几句话，但“无用之用”却非凡，比如用在纵横家上就是“捭阖之道”，这是纵横术的命门。


    《鬼谷子》第一篇就是“捭阖”，其中讲：'
