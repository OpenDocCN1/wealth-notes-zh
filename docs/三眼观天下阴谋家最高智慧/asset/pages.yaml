- pgno: 218
  md: '灵魂、心识在哪？后者本来就是玩虚的，干瞪眼无法反驳。


    为啥无法反驳呢？因为 A 把 B 拉到 A 的维度和系统，B 当然无法反驳。


    这种互喷在高手看来毫无意义，因为：


    高手是 A+B=思想力。而不是天天 A 和 B 打架。


    做人做事道理一样，A+B 路越走越宽，后者越走越窄。


    在自然科学硬逻辑之外，还有社会科学、应用科学等。一旦涉及到具体生产生活，涉及到人们每天的具体生存，实与虚就手拉手了。比如社会科学中的经济学、心理学、社会管理学等等，必然要实虚结合。


    例如神州智囊会靠经济学死公式去管理经济？那想必死都不知道咋死的！


