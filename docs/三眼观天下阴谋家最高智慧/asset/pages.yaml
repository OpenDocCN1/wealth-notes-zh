  md: '老子讲东西就是把人从海平面带到“不是海”的境界，当眼中没有海，那么万事万物全都是海，“不是海”上悟得多深，那么从理-数-象，广度深度就都上来了，占就会有体系，大无外，细无内，这就可以“出海”了。


