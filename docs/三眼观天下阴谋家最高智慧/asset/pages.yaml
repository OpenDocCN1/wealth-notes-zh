    # 〈道〉


    # 《素书》：道者，人之所蹈，使万物不知其所由。


    还是用人这个载体来讲，人的一切情感、心识，以及所见的一切假相，都是道体运行的结果。也就是前文那个“迷茫箭头”只要一动，道体就运行了。


    但是这个道体谁也说不出来，只能意会，这个意可不是佛家那个第六识（意识），佛家那个词指代的是脑子逻辑转圈圈，这里的意是指“感悟”。


    找一个比较适当的比喻，很像是一种“肌肉记忆”，所谓悟道不仅仅是懂理论，而是要训练这种肌肉记忆，或者拿西方的词套，训练直觉。


    正如靠理论当上王者，想必下场会很惨，能保持王者地位，靠的是直觉。


    将一个强者和弱者一起扔到未知领地，在这里失去了固有的生存经验，固有逻辑已经失去了作用，但强者存活的概率还是要比弱者高得多。是因为强者的“肌肉记忆”更接近道体运行，遇到问题“感悟能力”就起效了。


    两个一尘不染的小孩，一起学习某种知识，所获得的结果完全不一样，这是天性中的“肌肉记忆”在起效。


    佛道都讲修行，修是修理论，通过理论不断爬 buffered 来接近道体；行是通过实践来增强“肌肉记忆”，这里的实践不是逻辑转圈圈，而是要用心。'
