    # 道德经第一章：


    C、道可，道，非常，道。名可，名，非常，名


    B、无名，天地之始。有名，万物之母。故，常无，欲以观其妙。常有，欲以观其微


    A、此两者同出而异名，同谓之玄。玄之又玄，众妙之门


    要是深入解玄的话，第一章就不能“随波逐流”了，什么道能说又不能说之类的，那都是浅层次的，要进阶就要盘模型了


    第一章关系


    是从 A 升级到 B！


    A 是 95%， C 是 A 的运行方法， B 是 5%升级点！


    A 相当于是小初高，玄不是老子发明的，属于道家基本理论，老子也是从这个基本理论来。就好比马克思理论也是从细胞学说、进化论、能量守恒的基础而来。


    B 是大学，是老子为了社会应用而做的升级，不然大学怎么面向社会毕业？


    在 A 上的用的是[阴阳]，这是天文物理词汇，而在 B 上升级成用[无有]，这属于哲学词汇了。这不是老子刻意玩与众不同，而是在[破象]，就好比心理学来自生理学，但不能完全当成生理学，要破了生理学的概念名相(相)和观察内容(象)，才能有自己一套应用。'
