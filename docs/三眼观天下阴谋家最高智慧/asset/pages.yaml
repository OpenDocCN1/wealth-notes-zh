  md: '所以世人去看道德经，越是拼命看道德经就越进入假象，因为法门都是死的，重要的是看清背后的东西。


    # 人们都活在一个个假象之中，低级的假象就是各种术，高级假象就是法，如果人有道，即可穿越各种法门，帮助看清各种法术(假象)。


    再回到三眼之前讲的那句话：有了真相和假象的区隔，就会产生伪装与猎杀。社会被此二者填满。


    # 向“虚空”要思想


