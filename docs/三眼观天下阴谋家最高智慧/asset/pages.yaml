    那么好了，个体如何在谎言的维度间穿梭呢？


    # 降维打击


    《素书》：夫道、德、仁、义、礼，五者一体也！


    三眼画个结构图，方便理解：


    ![](img/4874a246e4516bbd020adecffb3865a9_129_0.png)


    将道德仁义礼可以归纳成这样一个维度图景，从上到下依次相对应维度，其中有几个要点：


    为何是“五维一体”的？因为维度隔空打击力就弱，一定要相连接的维度，一环套一环，从上到下打击；用村长的方法能制服村民，但用省长的方法则未必。攻击元帅的方法，攻击不了群众，还是得靠“不拿一针一线”。'
