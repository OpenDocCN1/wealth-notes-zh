- pgno: 111
  md: '越是靠“义礼”取天下的，就越是需要谏士（西方叫管理学大师），参见美帝大流氓，就是因为其走的就是“无尽吞噬”路线，如果不够吃，精英层总是制造新问题。这条路走下去是没有光明的。无论如何思考管理妙招，而最后每一种制度都会被精英层“不要脸”式的把持利用，每当不要脸到极致，就会引发掠食者内部的不断“阵痛”与内耗。


