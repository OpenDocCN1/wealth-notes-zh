  md: '大家喜欢一个人的思想，本质上是喜欢此人“摸象方法”（思路），想得到的是“大象最终立体成像”（思想结构）。结构一得，思路即可扔掉，也就不记得象比内容了。


    什么是书呆子呢？就是把“思路”当成“最终结构”。书呆子拼的是“背下多少思路”，或者“读了多少本书”，用量级来衡量结果，量变能不能引发质变呢？或许能，但是一定很久很久。


    比如书呆子看庄子，衡量自己是否“学到了”，就是有没有把庄子笔下的各种神话故事背下来，以及背后一个个碎片小道理（三眼统筹死逻辑），谁背得多的，谁就学得好，这就叫呆！


    呆的眼中只有“好”，而没有“透”，越是想要背诵，越是得不到“大象的立体成像”。所以人的悟是有悖于思维惯性的。


    再讲摸象温柔的摸法，相当于从大象屁股开始摸：哎哟，好像马屁股啊，这么大！为啥温柔呢？因为马屁股人人都摸过，再摸大象会有个“已知”，从人们习惯性事物与角度去阐述，不会引发恐慌。


    冰冷的摸法，相当于从象鼻子象牙开始摸：哎哟，什么玩意这么长，好可怕！为啥冰冷呢？因为象牙象鼻子对人们来说是“未知”，未知就会惧恐不安。


    少读书，就是少去琢磨自己已经习惯的东西，人读书都是从“兴趣”开始的；多思考，就是要学会从未知入手，相对应的就是身心都感觉不舒服，因为离开了习性的温床。


    人如不能悖逆自身，那是很难以提升的！


    所以是从屁股开始摸，还是从象鼻子开始摸，更容易、更快速的摸到整体“象形”呢？肯定是后者。特色与恐惧才会帮助人们更有效的摸象，这个方法简称“颠覆三观”！


    比如本文要讲道德仁义礼，老学究们讲法就温柔，大体形式都是“要做好人好事呀”，就是妈妈对孩子讲“你要好好学习才会更好”的感觉，孩子是绝对不会听进去的！道德讲成品德好，仁义讲成友爱、包容等，礼字讲成有礼貌懂规范，这都属于从象屁股开始摸，迎合众人的固有逻辑习性，摸的结果大象屁股就像马屁，众人很开心，嗯…这种讲法就是“拍马屁”！


    拍马屁能否助人摸清“整体象”呢？或许，但路途是很遥远的！可能要 500 年…


    离经叛道才是修行的快车道！'
