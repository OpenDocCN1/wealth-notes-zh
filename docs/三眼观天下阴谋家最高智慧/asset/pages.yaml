- pgno: 124
  md: '竞争的残酷性与激烈程度. 推动着人们的意识逐渐升维，春秋战国的杀戮试验场，将人类的伪装技术提升到顶级. 将隐藏的方法推动至越来越“无形化”，也就是“道”与“法”这两种维度的出现。


    术，是制造一个陷阱，众人会觉察到，在制造与摆脱陷阱的缠斗中，产生了尔虞我诈这种喜闻乐见的生活场景；


    法，是制造一个陷阱，众人不会觉知其为陷阱，从而深陷其中；


    道，是制造一个无限广博的陷阱，广博到“看起来没有陷阱”的程度，这已经不是众人能否觉知到其的问题了，而是对于道来说众人皆“不知其所由”。


    能达到这种顶级伪装水平是非常难的，因为这是从低级感官爬维到最顶级的高级感官，在过程上完全违逆了动物本性！


    举个耳熟能详的例子“4 岁孔融让梨”，很具有代表性。孔融给大哥吃大梨是因为大哥比他大，给小弟吃大梨是因为小弟比他小…


    典型的违逆动物本性的伪装，无形中拉开了与大哥和小弟的竞争维度，舍大梨（小利））而得到更大的梨子（大利），嗯…被中华文化代代传扬…。


    聊到这里我们又要加入一个字——利。


    利是什么？是某种吞噬结果的目标取向。


    利是有维度的，追求不同的吞噬结果，人们对利字的认识维度就不一样，这个叫“志向”。生存伪装的最终结果也是为了得利，对结果（利）的追求维度反过来决定了伪装水平。


    老子在生存竞争的形态中，给了世人一个终极目的利：恒久存续（模仿天地长生）。


    为了达到终极目的“利”，顺带将生存技术推动至顶级，给世人建立一套标杆逻辑：不伪装而伪装；无利而无不利；无为而无不为。总结俩字：无形。


    好了，我们继续聊人心刻度。


    # 人心的标准


    还是借用数学逻辑来讲。比如尺度的建立，本来天底下只有“长和短”两个刻度，但是人们不满足，非要测量一下有多长、有多短，这就要开始建立“标准单位”。'
