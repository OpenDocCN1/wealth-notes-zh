- pgno: 120
  md: '而人心的正反，这是从兽性到神性的多维刻度，它的基本单位是“心”，而不是数字。


    我们要借用数学逻辑来讲，方便理解，但本质上不是，这个过程是“以意带识”，用佛家理论讲，就是通过描述“第六识”（脑子），而启发人领悟到第七识、第八识乃至道体。


    好了，如看看透道德仁义礼的“刻度”呢？怎么来的？如何测量？


    人类生产第一把尺子，在画刻度之前，需要确定一个东西叫做“单位”，没有“单位”就无法产生刻度。


    在有形尺子的刻度上，获取单位要靠视野（眼-低级感官）；而在人心的刻度上，获取单位要依靠“多维感官层级”。也就是说，人心的刻度不像数学刻度可以看得见摸得着，而只能去“感”刻度。


    一个人的感官层级越多，能看见的“刻度”就越多！


    # 思想维度与感官的进化


    问个问题：低级动物和高级动物根本区别是啥？


    义务教育洗礼的小伙伴回答了：会不会使用工具！嗯…也对，毕竟上了教科书的，但普世教育维度都比较低嘛。


    要是再问问题：做为高级动物的人，大家都会使用工具，但也会分“高级和低级”，根本区别是啥？会不会使用工具的角度显然派不上用场。


    答：伪装技术水平决定高低级。


    “低级”动物相对应的伪装技术水平就低，“高级”的对应就高。


    再问：什么决定伪装技术水平呢？


    答：感官层级的多寡！


    一个动物（包括人）所能调用的感官层级越高，所能见到的“人心刻度”就越多，所以人的“格局”就越大，思想力（覆盖范围）就越强，最终决定了其伪装水平就越高，相对应其生存能力就更强。


    感官就是对外界的感受反馈（反馈逻辑就是用刻度记录形态结果），形成观察结果。以此观察结果来决定生存伪装的方法。


    或者讲，一个动物眼中的世界呈现什么样子，决定了其构造出什么样的生存方法。看世界不一样，方法自然不同。这个所谓的看世界，就是思想。'
