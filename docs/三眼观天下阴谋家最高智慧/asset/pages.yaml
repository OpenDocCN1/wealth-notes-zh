- pgno: 212
  md: '# 心力、脑力、体力啥关系？心性怎么决定人一生轨迹？


    很多小伙伴都问心力是什么，三眼解释了几次，但有的小伙伴好像还是很模糊。


    只看局部肯定会盲人摸象，局部需要上升到整体，通过全貌（其中关系）才能看清局部的位置！


    如果用一句话简单表述心力、脑力、体力与心性，就是：


    这个世界，是由极少数玩“心力”的人，带着一小部分玩“脑力”的人，养殖一大群玩“体力”的人。


    而无论玩什么，个体最终能否取得一个良好的结果，看的是“心性”。


    再进一步解释：


    玩体力本质：是依附于规则——形态僵死；


    玩脑力本质：是（帮助）破坏或打造规则——玩的是“善变”；


    玩心力本质：是引导和制定规则——玩的是“不变”。


    咱慢慢解释！


    很多人对玩脑力与玩体力给理解偏了，玩脑力不等于脑子运动！


    人活着脑子都运动，但不是所有运动都是“有效”的，搬砖也要用脑子思考，能说搬砖是脑力活吗？


    再比如北上广 80%坐办公室的白领，其实都是体力活，虽然看似敲文字的形式是脑子运动，但都是“无效的”，因为都在“某一程序”下动脑子。


    社会的基础是规则秩序，而社会发展的动力是打破规则秩序。


    “最大的公司”也要以不断改革，再到各行业各领域、各种社会交互集合，都需要不断地“翻新”来驱动发展。


    这里就可以定义，活在旧有规则轨迹里的就是体力，能走在前沿主动求变，玩（帮助）破坏和打造规则的就是脑力。


    所以体力与脑力，不是智商问题，而是脑子怎么用的、用在哪的问题。搬砖与搬钱的，智商都一样，人与人没什么大差别。'
