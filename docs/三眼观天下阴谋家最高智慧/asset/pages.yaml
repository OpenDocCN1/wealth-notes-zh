  md: '好了，转换逻辑，此时道德仁义礼的这种刻度，统一用利欲来测量，利欲相当于“刻度的刻度”。


    庄子讲“圣人不死，大盗不止”，所指的圣人就是在道德仁义礼的“中间维度”之人，这些人高不成低不就（既不能悟得空性成神，又不纯真小动物），所以都是祸害，祸害的具体表现就是“做法弄术”，建立一套套人造标准，人的痛苦都是源自于这些标准的束缚！


    而人造标准，所玩弄的刻度，根子上就是利欲，再花哨点（刻度反复雕刻），就是道德仁义礼。这是“从刻度-刻度”。


    老子讲“天下皆知美之为美，斯恶矣；皆知善之为善，斯不善已。”


    简言之，世间有了标准，就已经失去了美好。


    佛家有云，是非善恶两头不沾，恶不要沾，善也不要沾，都是一个个“人造标准”，如能都不沾，既得空性。


    比如在生活中，教育之罪就是建立标准，本来小孩子无所谓善恶，两个孩子像小动物一样打一架，超不过三五分钟又是好伙伴，而父母与教师可不这么认为，他们脑子中被“圣人们”灌输的标准此时就激活了，硬生生的会将小孩子们区分成三六九等，还会为了“如何区分是对的”打上一架！


    慢慢的小孩子就被污染了，这个污染过程大同小异，大的层面就是“文化污染”！


    他们以为将好坏区分（加入刻度）即可得到美好结果，而殊不知故意区分好坏是最大的恶。


    神性与动物性是人的两端，两端是其实是一端（物极必反，阴极复阳），像个圈，在两端之间其实都是“魔”。


    所以三眼为何一直讲“不入魔焉能入神”，换言之“没有中间过程如何能得到两端”。


    所以一个人写东西助人开窍，喷子还奇多，而对于喷子行为能看得开靠的不是心态，而是能看到其“魔性”的一面，可爱又可怜，人生也是如此。


    到此就不难理解为何老子是“反社会”的，小国寡民老死不相往来是理想社会，因为他的理想是让人都成为纯真小动物，纯真小动物就是“神”，人人都是“神”的话，天下即可“自然”。'
