  md: '西医相当于玩利益均衡，这块组织坏死，其中有细菌作祟，好吧，注射一下杀死它。别的地方组织也坏死了，实在不行切了它！相当于逐一平衡“坏死组织”所产生的利益不均。


    中医一看牙疼了，思考了一下，你这是肾有毛病啊，病人很不开心，那还能给肾来个注射或者切了？都不是，而是得先吃点汤药，弄一弄脾，微信：1848636859。这样协调一下气…如果病人是个老外，此时逻辑上是极度崩溃的！


