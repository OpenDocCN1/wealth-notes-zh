- pgno: 123
  md: '好了，所以智慧从会隐藏开始。思想从会说谎开始。一个人从小到大，从初级到高级，所伴随的思想成长，本质上就是隐藏艺术水平的提升。


    当动物为了恒久生存，推动了伪装技术达到极致，那就是藏于无形，老子语境就是“大音无声，大象无形，道隐无名”，现代时髦话讲就是低调到令人发指，三眼语境讲就是“活着就是寄生”(参见寄生篇)，用本篇语境讲就是做到“不撒谎而撒谎、不隐藏而隐藏”。


    # 阴谋与阳谋


    这里就要插一下何谓谋略了?谋略有阴谋和阳谋。


    何谓阴谋?就是为隐藏而隐藏。所以自古带兵打架的讲“兵诡诈”，耍嘴皮子的讲“谋贵密”，通俗一点比喻讲，就像是玩扑克牌绝对不能漏牌底;如果要找感觉可以看前文配图的绿色小青蛙…


    何谓阳谋?就是不隐藏而隐藏。相当于明牌打.对手还无可奈克，为何无可奈克?因为对手根本不知道你所隐藏的东西是什么。


    阳谋，是竞争维度到了意识这个层面特有的形式，在低级感官竞争维度上，隐藏与否是可以被看得见（眼）、听得到（耳）、嗅得出（鼻）、尝得到（舍）以及综合感触得到的（身不自在）;阳谋是将伪装水平提升至更高维度，低维的根本看不见它。


    低维的竞争是低级感官的竞争，眼睛能看多远，针对白天黑夜是否自带特殊属性，嗅觉的敏感性等等，建立在调动身体每一个细胞的直观感受能力的基础上。


    而到了高维竞争，是高级感官的竞争（心识），这是眼耳鼻舌身无法起效的领域。在这个领域之中，动物可以将伪装玩弄的更加巧妙，低维感官根本识别不了高维的隐藏方法。比如最简单初级的“制造陷阱”。


    而在高维竞争里，还是会再细分高维与低维，此时“制造陷阱”也有了高低维度。


    比如大家一提到谋略，首先想到的是如何攻击他人，耍阴招，三十六计等等。这些都属于低维的阴谋，如能仔细品察，“制造陷阱”技术维度很低端，带着低级动物的伪装特色“你看不见我”。


    这些东西（此类维度）被古人称作“术”，大白话翻译就是“低维的小妙招”。'
