  md: '道德经：不尚贤，使民不争。不贵难得之货，使民不为盗。不见可欲，使民心不乱。是以圣人之治，虚其心，实其腹，弱其志，强其骨；常使民无知、无欲，使夫智者不敢为也。为无为，则无不治。


    从伪装的进化，聊到竞争的维度，再聊到道德仁义礼的五维形态，再聊到神性与动物性，再聊到人造标准与刻度，这时候再去看老头第三章这段话，才不会扭曲。


    因为自古以来无数“大师”都将此章解读为“Y民政策”，这种大师就是“大盗的帮凶”。


    何谓 y 民？是混在“中间维度”的那帮子人，通过“人造标准”而养殖人们，这才叫 Y 民。Y 民不是不教给你什么，而是必须通过“教给你什么”来完成！


    老子自始至终都是告诫人“去标准”，给人大智慧，怎么可能解读成 Y 民一说？


