- pgno: 112
  md: '所以西方文化的着力点必然在于个人物质利益（把精神利益也等同于物质一样去计算），相对应的必产生极强的个人主义，必然推动精致的利己主义者占为主体。比如我们看老美的影视剧、文学、新闻评论等等，无所不在的个人主义思潮。


    而中华文化从本源根子上，就已经把作为人的“利”字（某种吞噬结果），提升到了更高的精神修为，在经历残酷的生存竞争后，对于“义”与“礼”早已完成了数次“残酷试验”，从而导出了人存在的基又是“H鞋”。


    从老子的“人法地、地法天、天法道、道法自然”，一直到后世的“天人合一”，从佛家的因果轮回到渡人就是渡己，中华思想对于社会（掠食者）的存在形态，从根本上认为是“混元一体”的，在现如今有个词叫“H鞋”。


    所以从“仁”开始，谍略与管理的关键，是从“人本利益”的维度入手，通过给予个体更高维度的利益标准，而减少和修复掠食者内部的“自杀内耗”行为。


