- pgno: 214
  md: '心力，人们从始至终都看不见它，具象化都很难，更何况计算衡量？


    但这也意味着它极其重要，只能属于少数人。


    孟子讲，劳心者治人，劳力者治于人；


    这里的心，属于“脑子”层面的，是区分脑力活和体力活，是“求变”和“被动挨打”区别，是孟子拿来搞政治大法用的。


    政治本质是利益分配，老孟是想达成“君子劳心，小人劳力”这么个结果，把阶层给划分清楚——养殖层应该啥样，分配层应该啥样，各回各家各找各妈，都“当其位行其政”。


    但是沿着孟子的话，假设人人都是君子，都是“脑子聪明”的人，那么还能分层吗？谁“治人”谁“治于人”呢？怎么分层呢？


    答案是也还可以分层！


    # 那些聪明的、玩脑力“主动求变”的人，也需要有人来统治，给他们一个秩序规则！


    在君子这个人堆里，孟子就是这样一个人，他给了君子们一套秩序，统管各路“劳心者”。


    都是聪明人，为何能分层呢？


    此时的“劳心”，是指“心力”，不属于“脑子”层面。


    像古代思想家就分俩种，一种是玩“善变”，一种玩“不变”。


    前者代表人物，老子；后者代表人物，诸子百家的各位大神。


    玩善变的老子，对创食啊、分层养殖啊没兴趣，所以谈不上劳心劳力，谁治谁。


    要想“分层治人”就一定要玩“不变”，也就是独特的政治主张，儒法墨在各自主流派别上又分成一个个小派别，看谁在历史长河里站得稳？比的就是带头大哥的“心力”。


    老子别看思想高，但如入世创食，不玩心力，最终落实到社会生产分工上，也是给诸子百家打工的。


    所以心力有二：


    +   1、一定有一条自己认可的、相信的、确信的创食主张，看谁的主张更符合“主流”，古代主流就是“王上”，现代嘛...'
