  md: '所以，三眼讲道德经，师承老子的鸡贼心法：不要想着破解道，破解不了。只能去感受道，感受领导给你的“方针策略”。


    为了便于理解，三眼举个例子：


    为什么破解不了道呢？


    道就如同事物没有真相，真相是“无”，如同人们找寻事物的“底层代码”终极代码就是 0 与 1，源自“无”。


