  md: '# 1、其实这些做人的方法我们都耳熟能详，老子搞出来的各种耳熟能详就是“道德”，孔子搞得那一堆叫仁义，但都是“死法”。


    虽然从老子嘴里第一次说出来，但后世子孙都知道老子牛，所以跟着牛人就要“勤奋学习”技法，这些话都已经学得快吐了。


    类似这种技法无数，遍布神州，还有什么孔融让梨啊、三人行必有我师啊、一日三省吾身啊等等，从小就知道，在感觉上也都快吐了…


    但是呢，真正能做到的没几个，真正能懂的更是少之又少。为何呢？


    # 2、因为这些技法都是逆着人本性的！


    我们觉得这些话都“正常”，是因为听的太多了，大家把这些话和讲话的人捧得太高了，大家稀里糊涂就默认这些技法是“正常且高明”的，但真正沿着“反思维”一扒到底，扒到“道”扒到“无”扒到“自然”的没几个。


    没有道的加持，任何法术都是死逻辑，而且是“F人性不正常”的死逻辑，这样人们怎么可能体悟去做呢？


