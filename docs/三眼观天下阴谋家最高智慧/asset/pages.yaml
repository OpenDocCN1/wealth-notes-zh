- pgno: 115
  md: '这个盗字古人解释起来不如现代语境方便，但意思都一样，古人是认为天地、人、万物之间是互相“盗取精华”的，现代语境讲类似于“能量的转移与守恒”。


    道体一运行，天地、人、万物之间就开始互相“盗取”，为啥呢，因为有漏洞啊！当能量守恒了，也就是三盗既宜，三才（天地人）才能获得暂时的安定，等待迎接下一个混乱周期。


    修道的关键是要研究“盗机”，也就是事物变化的关键点。往下敲没完没了，道家谋略从宏观到微观以后慢慢聊，这里单拿出“三盗”是为啥呢？是为了引出“德”。


    # 《素书》：德者，人之所得，使万物各得其欲。


    素书这段与阴符经讲的“三盗”是一个意思，但是不如阴符经赤裸，都是玩均衡。


    德的维度要元远超于仁，完全不在一个维度。


    仁所在维度，还是玩“扶正”，是一种“明知不可为而为之”，是“义”与“礼”产生了大问题，实在没有办法了，为了“节省成本并减少消耗”而弄出来的方法。


    如果每个人的心地根本上都是“善”的，那么通过“仁”或许有希望走到大同那一步，但是人的内心就像前文的“箭头”，善恶是阴阳两端，不停的变换，所以“仁”这种方法不是大道！


    道家子弟的思维早已超越善恶的维度了，无所谓善恶，祖师爷老子开篇就讲了啊：“天下皆知美之为关，斯恶矣；皆知善之为善，斯不善已。故有无相生…”。人就是个箭头在那旋转找“归宿”，它必然要吃喝拉撒，必然要吞噬能量获得存续，那就让它一直吞噬好了！


    但是吞噬可以，不能瞎吞噬，不能搞破坏，不能没够，得有方法做到“周期性吞噬均衡”，谁能做到，谁就能“成德”。


    这里有必要说一下，这个均衡可不仅仅是利益均衡。要知道利益永远无法均衡，是超越利益层面的一种“综合性均衡”，“成德”所玩的均衡如果敲文字，得敲 n 篇。而且一辈子慢慢悟，常悟常新，敲也敲不完。


    其中是道家的整体三观。阴符经讲“天人合发，万变定基。”这个“合”就是“综合性均衡因素”。


    如果还是感知不深，可以拿中医与西医来举例子：'
