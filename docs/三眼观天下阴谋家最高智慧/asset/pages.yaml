  md: '你吃我、我吃你，让能量不断传导和延续，所有竞争集合在一起，就是环境。


    当能量的传导更加直接、紧密，在形式上就是单细胞逐渐凑在一起，形成群落，但这时候还没有形成多细胞动物，因为这时候的群落是“无组织无纪律”的，如下图：


    ![](img/4874a246e4516bbd020adecffb3865a9_103_0.png)


    怎么才能产生多细胞动物呢？要“有组织有纪律”才行，组织和纪律需要通过分工与分配来完成，只有这样“散兵游勇”才能“紧密团结在一起”。


    分工协作，个体的协作产生了集体行为。这使得弱小的“单细胞”集合在一起变成“强大掠食者”（多细胞动物），从而更有利于吞噬周围能量。分配，就是当掠食者吞噬更多的能量，需要在组成其的个体单细胞之间传导和分配，让每一个单细胞都活下去，从而让其集合（掠食者）存续下去。


    无论单细胞形态还是多细胞形态，存在的目的只有一个：恒久存续。这也是三眼解读道德经的核心起始点。


    为了恒久存续，仅仅依靠无数单细胞自发性的集合是很初级的，因为一是在整体分工与分配上没有效率，二是很容易“解体”分裂。


    为了解决这一问题，多细胞动物进化出了“大脑”，去统筹指挥分工与分配。自此，个体单细胞无意识自发性集合，进化出了“群体的意识”，从掠食者这个完整角度看，即为多细胞的“独立意识”。如下图：'
