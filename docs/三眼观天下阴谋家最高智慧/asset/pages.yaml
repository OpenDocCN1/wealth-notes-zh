  md: '# 玄学、科学、虚实、意识漏洞和思想力…


    不太愿意聊大家所认为的“迷信”，就如写东西一直“放不开”。


    因为人都是在漏洞里的，非要做选择，不是好就是坏，“无是非”讲100遍也说不通的，都是脑子接受，心不接收。


    人要是不打破“二元对抗”说什么都没用，就好比大组织不打破“二元区隔”，经济上做啥都没用。


    玄学和科学也是一样，90%人不自觉地就要选择谁正确谁错误，这都是思想漏洞，精神疾病。


    再比如攻击人的漏洞玩“入魔”，把道家中攻击人的法门都弄出来，想必很多人是接受不了的，因为破坏了“固有生命鸡汤”，打击是非观。


    比如城市化好的一面讲出来，事物一体两面，坏的一面呢？大组织如何搞新养殖，也不好讲。农、工、士总有一款喷你，而且会站在“自己是皇帝”的角度喷你，必须要分好坏，创食这事都不重要了…


    孔子为啥牛X？是非玩得溜！攻击小动物的思想漏洞很彻底，现代人100个99个处于常态被攻击中…


    玄学也是科学，科学也是玄学。


    玄学是由虚到实；科学是由实到虚，最后形成对接，通路完成！


    玄学是从宇宙向下推，科学是从一个具体“试验”结果向上推。但科学试验得有方向啊，引领方向的就是玄学。


    # 科学的定义，本来就是认识宇宙的实践和方法。


    所以玄学是科学之上，但上下并不代表谁厉害，只是大家分工不同而已。


    人们一提到科学，其实是指“自然科学”，比如数理化。这 一部分比较实，各种硬逻辑公式。


    因为特别 Adding， 所以在一般人观念里，“实虚”经常发生矛盾，与玄学互喷。这就像是西医和中医互喷一样，前者靠硬逻辑解剖肉体、细胞、大脑、神经元，然后喷后者，奇经八脉在哪？'
