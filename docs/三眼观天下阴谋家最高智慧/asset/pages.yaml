- pgno: 213
  md: '竞争饱和了，不会主动求变，弹钢琴这种优雅的天赋运动，也会变成体力活。


    科技的发展会让体力活从业者越来越多，原来的许多所谓脑力运动都会通过科技给变成体力活。


    科技不会让人们的生活变得越来越有“期望”，而是越来越“固化”。


    不会主动求变的，只把眼界局限于某一暂时的得失之上，有那么一天一定会被淘汰，手足无措。


    所以，脑力的本质是玩“变化”！


    # 脑力是“力”，力首先拼的是“方向”，方向错了，用力再多也是南辕北辙。


    # 脑力不是拼智商，拼的是“心性”。


    古人讲词语叫“心智”，而不叫“脑智”，是因为智慧是由心而生。脑子是“负责加工”的，心是“决定加工什么”的。


    # “决定加工什么”要远远比“深度加工”来得重要！


    但这里不要思考歪了，不是教人不务正业，不去打磨专业技能；而意思是每天要抽出更多时间思考一下“加工什么”，这是一个劳心血的活，不是一蹴而就的，需要坚持。


    因为每个人的付出与回报都是正比的，不要看什么金融掠夺了，炒房吸血了什么的，如果深度解构下去，看似“不合理”的背后也是“按劳收益”。


    脑子劳动要比体力劳动累得多，而劳心更累，且面对事物的风险要大得多。


    按照做功大小：心力>脑力>体力。


    按劳计算收益，心力付出最多，理应收获最大。


    我们平时看到的所谓“按劳分配”理论，只是个假象，是给玩体力活看的鸡汤。


    那什么是心力呢？


    劳力，人们能看见，把砖头从这搬到那，力都能算出来用多少。


    脑力，只能从结果去衡量，就很难计算了；'
