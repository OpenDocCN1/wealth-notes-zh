  md: '那往上悟，就发现政治决定经济，权利分配决定法律，人的言行举止都是在某种人为制定的条条框框之中；


    再往上悟，发现定规则就是定人心，历史的各种现象，包括诸子百家和东西方诸多所谓流派，都是在“定人心”，人们都活在一个个规则、秩序、规矩之内。


    庙堂有庙堂的规矩，江湖有江湖的规矩，宗教有宗教的规矩，这些规矩纠缠在一起形成日常生活中的重重矛盾，产生各种社会交互活动和现象。


    人们错把这些规矩当成真相，并乐此不疲，并管这些叫做信仰，江湖有江湖的信仰，庙堂有庙堂的信仰，宗教也自己玩一路，其实这些都是假象！


    再往上悟，就开始去找寻“定人心的方法来源”，这就上升到“道”和西方所谓哲学层面，因为哲学是将诸多假象抽象到一个虚拟的形态。


    到了这个层面，人就“不再是人”，事也“不再是事”，而是抽象化的一个个虚拟形态。


    此时若观人，人就不是“人”，穿透样貌、服饰、行为、言语、神态、经验、思维方法、道德、价值判断等等，此时人只是个形态。


    要想追溯“形态起源”，也就是在《思想观》和《生存法则》系列里写的东西，找到本源即可推导出具象化的人，乃至它的行为轨迹和预判等等。这就好比“掳贼先掳王”。


    再往上悟，就是天道，老子此时也没办法去描述，只能讲成“道、规律、自然”等等。


    这就好比时间、空间与意识是人类未解之谜，人类无法参透，只能研究“某一片段”，或者叫“某一面”，研究出一小块，人为主观搞套逻辑规则去下定义，管这个叫科学…


