    「東西拿到二手市場之後，一定會想要的人，自然就會對你心存感激。」

    「你就從這一點開始做起，體會一下這種感覺吧。這麼做比一下子就要你投資簡單多了吧？」


    當天回到家、用過晚餐之後，務陪著敬子在洗碗，一個人坐在二樓房間的小桌子前，打開筆電。他先上網搜尋有關節約省錢的資訊。網路上有非常多省錢的方法。甚至有人利用小谷所說的改用便宜手機及變更電力公司等方法，稍微花點時間研究，再加上忍耐些許的不便，一年竟然省下一百萬圓。大家對省錢的用心，讓務相當驚訝。


    「原來大家都為了省錢這麼努力！」再回頭看看自己，即使知道沒有錢，卻什麼也沒做，實在感到很羞愧。

    話雖如此，不管哪一種省錢的方法，現在家裡的開支都是由敬子在處理，根本不是馬上自己說了就算的問題。而且，眼前不爭的事實是，現在夫妻兩人的關係降到冰點，完全無法溝通，更別說要建議她怎麼省錢了。

    「這個就先緩緩再說吧。另一個方法是賣掉沒有用的東西。」

    之前電視新聞就曾經報導過時下盛行的二手拍賣網站，所以務很快就找到幾個網站，瞭解拍賣流程之後，馬上就用手機下載應用程式，登錄成為會員。

    （接下來，要拿什麼去賣呢……）

    務環顧了一下房間，打開櫥櫃。

    「現在可以賣的，應該只有這個了吧。」

    儲櫃裡擺著一套的高爾夫球桿。

    務打開球桿袋，伸手摸向其中一支球桿。


    球桿是知名的「SCOTTY CAMERON CLASSIC 1」。為了分辨是自己的球桿，上頭的「S」和「T」兩個字母被描上黑色油性筆，代表自己名字的第一個字母。對務來說，這支球桿比任何東西都還要寶貴。


