    有一本經典暢銷書名叫《我的人生思考》（As a Man Thinketh），包括戴爾·卡內基（Dale Carnegie）和奧格·曼迪諾（Og Mandino）在內的現代成功哲學始祖，都深深受其影響。我非常喜歡書裡頭的一句話：「每個人都是自己人生的主人。」這本書的一開始是這麼說的：


    「人的內心就像一片花園。有人會用智慧灌溉這塊園地，有人選擇放任不管。不論何者，一切都會長出東西。


    假如你沒有在自己的花園裡播下美麗花草的種子，那裡終將落下無數的雜草種子，成為一塊雜草叢生的土地。」


    （詹姆士·艾倫著）


    既然如此，要怎麼做，才能跳脫雜草叢生的人生呢？書裡頭是這麼寫的：「如果想活出精采人生，就必須挖開內心的花園，拔除裡頭不純粹的錯誤思想，然後種下純真的正確思想，並細心呵護它。」


    因此，首先第一步，擺脫現狀的方法只有一個。


