    ## 覺得是「浪費」的事物，其實也是一種「投資」


    想要擴大財富容器，很重要的是必須能把錢花在自己身上，並且展現有錢人的氣圍，帶給人放心的感覺。過去我在當上班族的時候，買了一只和某位成功者一樣價值十萬圓的皮夾。一開始當然很緊張，只不過，皮夾是每天都會用到的東西，也是財富的家。後來隨著愈用愈久，我對金錢的感謝心情一天比一天強烈，更想把金錢用在有意義的東西上。我也開始為自己選擇有品質的衣服。有些人會覺得「把錢花在衣服上太浪費了」，但是，衣服既然是給人的第一印象，看似浪費的物欲，其實也可以算是某種自我投資。另外像是為了健康找健身教練進行重訓，或是花錢去尋找適合自己的某樣事物，都是自我投資的一部分。有時在為上班族投資客提供建議的時候，我都會要他們花一個月的薪水去


    訂製一套西裝，或是改掉追求快速時尚的習慣。我的意思並非否定快速時尚，可以從中穿出流行感當然很好。只不過，真正的重點在於，你是抱著何種心情把錢花在自己身上？你是否肯定自己的價值，所以把錢投資在上面，而且真心對「有錢」這件事感到開心嗎？這才是最重要的。因為打從心底開心花錢的人，錢自然會源源不絕而來，花出去的錢也會確實地透過循環再回到自己身上。另外，「有錢人的氛圍」意思並不是「展現自己多有錢」，而是指「財富不斷流動的富足感」。就像故事主角務看到理財顧問小谷所住的高級公寓時，雖然難以置信，但同時心裡一定也覺得「原來一個年輕上班族也可以賺到錢，過這樣的生活」。假設小谷一身廉價西裝，住在屋齡五十年的老公寓，那麼就算他說「讓我們來擴大你的財富容器吧」，務可能也描繪不出夢想，不由得覺得「感覺就算聽他說的也無法致富」。


    把錢花在自己身上。透過把錢花在自己和自己所愛的人身上，創造出更多笑容。這點做得相當重要，為的是提高自我肯定感，打從心底「認可自己值得擁有財富」。透過為自己創造更多「我擁有財富，可以給自己和身邊的人帶來笑容，是個有能力帶來幸福的人」的體驗，你的財富容器自然會愈變愈大。


