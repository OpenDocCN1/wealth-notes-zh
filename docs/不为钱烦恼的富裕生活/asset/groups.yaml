    我對自己烘焙的豆子很有信心，所以就帶著去向餐廳提案，賣豆子給他們，甚至教他們如何沖泡咖啡。另外我也把豆子放到網路上去賣。」「原來如此，你沒有把自己局限在咖啡店裡，而是向外去拓展更大的市場。

    如果只是守著過去咖啡店『該做的』，一定不會有今天的結果。」「現在我兒子似乎也對我的這種做法感興趣，這讓我覺得自己的生活態度好像受到肯定，還滿開心的。」

    老闆的話給了務很大的鼓舞。


    眼前這杯藍山咖啡，香氣比過去更深奧了。他重新面對筆記本，開始寫下自己的目標。寫完之後，他喝了口咖啡，滋味格外美味。務靠在沙發上，看著櫃檯裡的老闆正在教兒子沖泡咖啡。「我是不能像他一樣，成為一個可以為兒子示範生活態度的父親呢？」他在心裡這麼問自己。


