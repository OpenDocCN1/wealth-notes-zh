- raw:
  - '[PAGE 63]


    已漸漸麻痺，甚至認為自己看起來就像是能幹的上班族。「忙到沒有時間睡覺」這種話，對我來說是「有能力的男人會說的台詞」。我不想看清楚自己的現況。因為我害怕承認。

    考上目標大學，順利畢業，依照人生規劃進入大公司工作。這樣的我，竟然選錯了公司。如果繼續靠這份薪水像奴隸一樣工作下去，夢想中的未來永遠不會有實現的一天。我在無意識間選擇漠視這一切，讓自己忙碌到連思考的時間都沒有。

    然而，這種逃避現實的做法，只會帶來悲劇。因為不想看見，所以選擇不看，恐懼只會愈來愈大。因為害怕，所以不看，不看就更害怕……最後陷入惡性循環中，漸漸動彈不得。'
  - '[PAGE 64]


    有一本經典暢銷書名叫《我的人生思考》（As a Man Thinketh），包括戴爾·卡內基（Dale Carnegie）和奧格·曼迪諾（Og Mandino）在內的現代成功哲學始祖，都深深受其影響。我非常喜歡書裡頭的一句話：「每個人都是自己人生的主人。」一這本書的一開始是這麼說的：


    「人的內心就像一片花園。有人會用智慧灌溉這塊園地，有人選擇放任不管。不論何者，一 Penc都會長出東西。


    假如你沒有在自己的花園裡播下美麗花草的種子，那裡終將落下無數的雜草種子，成為一塊雜草叢生的土地。」


    （詹姆士·艾倫著）


    既 然如此，要怎麼做，才能跳脫雜草叢生的人生呢？書裡頭是這麼寫的：「如果想活出精采人生，就必須挖開內心的花園，拔除裡頭不純粹的錯誤思想，然後種下純真的正確思想，並細心呵護它。」


    因此，首先第一步，擺脫現狀的方法只有一個。


    就是面對現實。'
  - '[PAGE 65]


    最後，我在二十六歲那一年，終於選擇正視自己的狀況。只不過，之前面對金錢的恐懼，我至今記憶猶新。才二十幾歲的我都有這種感覺了，可想而知，像故事中的主角務一樣年屆四十的人，要認清自己的人生其實充滿風險，心裡會有很多害怕。只不過，既然遲早都是要面對「錢不夠用」的現實。那麽，盡早正視問題總是好事。早一步意識到問題的存在，就能早一步重新整頓自己內心的花園。也就能早一步致富。每件事情都有原因和結果。必須好好正視導致眼前結果的原因才行。讀到這裡，即使各位也感到緊張、擔心，現在就是你開創人生的大好機會。'
  - '[PAGE 66]


    # 勇氣與財富的法則


    只有將內心花園裡蔓延生長、名為「維持現狀」的雜草拔除，重播下致富的種子，才有辦法成為自己人生的主人。'
  - '[PAGE 67]


    # V

    感謝的「價值」


    一個星期後。

    務趁著某一天上班中午休息時間，直接來到小谷的公寓拜訪他。

    小谷已經提早在咖啡廳等候了，就坐在一星期前的那張沙發上。

    看到匆匆趕到的務，小谷笑著問：

    「發生什麼事了嗎？」

    務幾乎沒等小谷說完便急著說：

    「我需要錢！……呃……」

    務的聲音之大連自己也嚇了一跳，覺得有點丟臉。看到務的反應，小谷似乎很滿意：

    「沒錯！你需要錢！你的確需要！」

    「可是，我不敢像你一樣有勇氣投資。不過我也很清楚，再這樣繼續賣命工作也沒有未來，一定要有所改變才行。但我真的很害怕改變現狀……」'
  - '[PAGE 68]


    務說完一臉垂頭喪氣，沉默不語。

    看到他的樣子，小谷說：

    「我以前就跟你一樣模一樣，年收入只有三百萬，每天像奴隸一樣為公司賣命，又不敢改變現狀。要離開曾經覺得『進到這家公司就放心了』的地方，確實會讓人恐懼。」

    「原來你以前也是上班族啊！」

    「是啊。要放棄上班族的身分轉做投資，真的會讓人很不安。只是，繼續過著原本的生活讓我更害怕。」

    「我懂你的感覺！當我看到自己寫下來的收支狀況之後，我害怕到完全不知所措。」

    「我以前也是這樣。其實我到現在還是個不折不扣的膽小鬼呢。我當初也跟你一樣不敢改變。不過雖然膽小，我還是鼓起勇氣去做了。而且正因為膽小，

    所以一開始真是從很小的一步做起。」

    「很小的一步？」'
  - '[PAGE 69]


    「是啊。我覺得這是每個人都可以做到的第一步。說到找理財顧問，大家可能會馬上聯想到被推銷金融商品之類的。事實上，找理財顧問最重要的，是改變對金錢的不好印象，發現金錢的真正意義。很多人為錢所苦的人，都不知道金錢的意義是什麼，而且會覺得自己不值得成為有錢人，也不會變成有錢人。所以一開始不能操之過急，要像爬緩坡一樣，一點一點改變對錢的感覺。你想試看嗎？」「改變對錢的感覺？」「沒錯。來體驗一下不必為公司賣命，也能靠自己賺錢的感覺吧。」小谷向務提出兩個做法。「首先，很多人
    在錢不夠用的時候，都會想辦法省錢。你只要在不強迫自己的範圍內去做就行了。」「用不強迫自己的方式省錢嗎？」「沒錯。就拿手機來說好了。」'
  - '[PAGE 70]


    小谷指著務的 iPhone。

    「現在市面上也有很多便宜的手機，只要改用便宜的手機，比起大型電信公司的月租費，可以省下好幾千圓。家裡的瓦斯電費也可以比較一下民營的選擇，然後實際採取行動去做。多出來的錢，就當成是多賺的，而不省下來」

    務看著自己的 iPhone。雖然這已經是第三代之前uries機型了，不過自己從來沒想過要節省每個月的電話費。就連瓦斯電費也是一樣，雖然知道怎麼做可以省錢，卻一直沒有付諸行動。一部分是因為家裡的錢都是交由敬子在處理，不過另一個原因是，其實自己連講求效率的多餘心力都沒有。

    「另外你還可以試著做一件事，就是把用不到的東西拿去二手市場賣掉。」「二手市場？」「沒錯，就是把少了也不會影響生活的東西，拿到網路上的二手市場賣掉。

