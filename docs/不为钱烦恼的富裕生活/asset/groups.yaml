    「沒錯！就是這種想法，你一定要改變才行。

    現在日本的勞動人口，仍有八成的人對錢還一直抱著錯誤的想法和觀念。

    事實上，錢代表的是感謝。

    也就是說，別人給你錢，一定是因為你對他有所幫助，對方會心存感謝。

