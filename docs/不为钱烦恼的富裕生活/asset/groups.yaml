    ## X

    「船員」的信賴


    務決定要嘗試投資房地產了。上班族的身分可以順利跟銀行貸到款，房貸就以房租收入來支付。比起其他投資，這種方式感覺最適合自己的個性。

    而且就像小谷說的，等到房貸還清之後，房租收入可以彌補年金的不足。

    萬一在還清之前自己發生什麼意外，到時候就用保險金來償還貸款。

    只不過，投資當然不可能完全沒有風險。

    所以，他積極地參加房仲業者和投資客舉辦的各種座談會，學習如何挑選物件，並且除了房仲業者以外，他也針對成功的投資客所選擇的物件仔細分析。

    先做分析，接著採取行動。

    就像以前以職業選手為目標時也是這種做法。如今一開始投入，感覺又找到回門志了。一想到自己以前對房地產沒來由的排斥，就覺得不可思議。現在他


    已 經明白了，投 資就 像 追 求 夢 想 一 樣，所有 事 情 都 有 風 險，只要 仔 細 分 析 挑 選， 再採 取 行 動 就 行 了。 下定決心之後，接下來的難關，就是取得敬子的同意。
    （敬子的個性踏實，會同意我投資房地產嗎……） 另外，小谷也給了他另一項功課：「把你在網路上拍賣東西賺到的錢，用 來買禮物送給太太和兒子。」 務已經好幾年沒有送禮物給敬子了，就連兒子的生日禮物和聖誕節禮物，
    也都是丟給她在打理，甚至生日當天自己就刻意加班不回家，避免尷尬的氣。 （我過去真的太不關心他們了。 我決定了！從現在開始我要盡我所能地去做！） 務在心裡暗自決定。
    「只是，到 底要送什麼好呢？」 務坐在公園裡苦惱地想著。


    要是買太昂貴的東西，以目前家裡的財務狀況，敬子一定會起疑心。「我們家沒有錢買這種東西吧？」他想起敬子常對讓說的話。突然間，他注意到公園裡的花圃。象徵春天的三色堇正綻放盛開著。敬子從以前就很喜歡花。當初剛結婚時住在公寓，她也在陽台種滿各種的花。後來打算搬到郊外的時候，她堅持房子一定要有院子。雖然後來勉強才湊出錢買下離車站有段距離的的
    中古小平房，不過務想到以前每到春天，院子裡總是會開滿三色堇。（現在院子都長滿雜草了吧。）敬子為了照顧兒子，在時間和心靈上都失去自由，從那時候開始，她就不再種花了。「不知道哪裡可以買得到三色堇的幼苗？」務拿起手機開始搜尋賣花苗的店家。


    幾天之後的週日夜晚。「這個，拿去種在院子裡吧。」等到讓睡著之後，務拿出從家具百貨買來的三色堇幼苗，擺在餐桌的椅腳邊。敬子直盯著花苗看，一句話也沒有說。看著她的反應，務拿出一個信封擺在桌上，裡頭裝的是拍賣球桿賺到的五萬圖。「其實，我在一個月前把球桿賣掉了。我想跟你討論這個家接下來該怎麼辦。「務在餐桌前坐了下來，要敬子也坐在他的對面。「……」敬子臉上閃過一絲疑惑，不過還是靜靜坐下來。眼神從頭到尾都沒有看向務。「她可能會覺得事到如今還說什麼討論吧……」


    務對自己一直以來都把家裡的事丟給敬子感到十分內疚，也很怕會受到敬子的責難。


    在一陣緊繃的氣氛中，他鼓起全部的勇氣開口：「其實……」接下來，他把這兩個月以來思考過的事、見過的人、對財務的不安和責任，


