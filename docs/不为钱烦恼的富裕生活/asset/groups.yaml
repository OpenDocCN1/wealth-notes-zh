    「在培養接班人喔。」「沒有啦。我好不容易栽培他去念大學，要他去做自己喜歡的事，沒想到他好像對開咖啡店也有興趣，所以就……」老闆說得一臉不好的樣子。「是這樣啊。你一面開咖啡店，還要賺錢給兒子念大學，很厲害耶！」「謝謝。很多人都羨慕我有自己的咖啡店，不過老實說，要養家，還要讓孩子念書，靠咖啡店撐下去真的很辛苦。」「老闆停頓了一下，看了看櫃檯裡的兒子，接著又繼續說：」「其實跟他想做哪種行業或是想做什麼都沒有關係。到頭來最重要的一點，就是考慮清楚自己想過什麼樣的人生，以此去設定計畫，然後付諸實行。我就告訴自己，就算開咖啡店，靠最喜歡的咖啡賺錢，也要讓孩子念大學，帶老婆出國旅行。所以就這麼做了。」


    老闆笑了笑。

    「這樣很厲害耶！

    你是怎麼做到的？」

    「很簡單啊。

    就是根據自己的生活方式設定要賺多少錢，再考慮要怎麼達到這個目標。

