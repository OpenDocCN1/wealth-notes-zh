    CAMERON」字樣中以油性筆塗描的「T」和「S」兩個字。「所以我要加油才行。教練，再請您多多指教了！」「我是很嚴格的唷」務有點開玩笑地說，伸手摸了摸翔太的頭。因為他知道若不這麼做，自己感動的眼淚一定會奪眶而出。那天晚上，務喝著敬子為他沖泡的卡布奇諾。


