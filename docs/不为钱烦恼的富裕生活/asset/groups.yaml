    「原來大家都為了省錢這麼努力！」再回頭看看自己，即使知道沒有錢，卻什麼也沒做，實在感到很羞愧。

    話雖如此，不管哪一種省錢的方法，現在家裡的開支都是由敬子在處理，根本不是馬上自己說了就算的問題。而且，眼前不爭的事實是，現在夫妻兩人的關係降到冰點，完全無法溝通，更別說要建議她怎麼省錢了。

    「這個就先緩緩再說吧。另一個方法是賣掉沒有用的東西。」

    之前電視新聞就曾經報導過時下盛行的二手拍賣網站，所以務很快就找到幾個網站，瞭解拍賣流程之後，馬上就用手機下載應用程式，登錄成為會員。

    （接下來，要拿什麼去賣呢……）

    務環顧了一下房間，打開櫥櫃。

    「現在可以賣的，應該只有這個了吧。」

    儲櫃裡擺著一套的高爾夫球桿。

    務打開球桿袋，伸手摸向其中一支球桿。


    球桿是知名的「SCOTTY CAMERON CLASSIC 1」。為了分辨是自己的球桿，上頭的「S」和「T」兩個字母被描上黑色油性筆，代表自己名字的第一個字母。對務來說，這支球桿比任何東西都還要寶貴。


    「好吧。」


    盯著球桿袋看了一會兒之後，務點了點頭，似乎是下定了心了。他平靜地將球桿的資料登錄上網。幾天之後，球桿以大約五萬圓的價格賣出。務親自將球桿交給宅配業者。又過了幾天，買家傳來收到球桿的訊息。


    上頭是這麼寫的：


    「非常感謝您將這別具意義的球桿賣給我們。我們有一個兒子，今年十三歲，我們決定栽培他打高爾夫球。雖然希望他能成為一名職業選手，不過其實家裡沒有錢幫他買新球桿，所以才會找二手的。」


    當他在網路上看到您的球桿時，興奮得直說：『我要這支！這可是很珍貴的球桿耶！』更別說他收到球桿時有多開心了。我們會好好愛惜這支您寶貴的球桿的。衷心感謝您的出讓。」


    現在網路拍賣網站的交易都是採匿名的方式，彼此不會知道對方的名字和地址，自然也不會瞭解對方的狀況。可是從這段訊息裡，務看了滿滿的感謝。自己長年收藏在櫥櫃裡沒有用到的球桿，竟然成了一名少年邁向光明未來的車票。以車票換到感謝和金錢的務，一想到這裡就很開心，一股暖流湧上心頭。


    「原來，錢象徵的就是感謝。」


    幾天之後，務又來到熟悉的咖啡店「SUZUKAGE」，給自己點了一杯藍山咖啡。他細細品嘗這杯九百圓的咖啡，喝得完全沒有罪惡感，因為這是用拍賣得到的錢付的。


    「謝謝你，咖啡很好喝。」

    結帳時務對老闆說。他內心充滿感恩，感謝老闆為自己沖了一杯如此美味的咖啡，也感謝買下球桿的那個人。


    「別這麼說，我才要謝謝你呢。很高興最近又開始看到你了。」

    老闆笑著說。


    「喂！你記得我？」

    「當然記得啊，我怎麼可能忘記喝我的咖啡喝得這麼享受的人。謝謝你。」


    「一做了讓對方開心的事，就能得到錢……這之間衍生出來的，應該就是信賴吧。」

    在回家的路上，務一直想著買下球桿的那個人和他的兒子。一直以來自己


    都對金錢抱著偏見，而且深信不疑。但是現在，他感覺自己的想法慢慢變得不一樣了。


    ## 改變對金錢的「觀念」


    錢不夠用。要打破這個現狀，多數人最先想到的是，應該都是「省錢」吧。很多錢不夠用的家庭，都會更想盡辦法省錢，卻感覺錢愈來愈不夠用。省錢的效果有限，除非想辦法開源、增加收入，否則想光靠省錢解決錢不夠用的問題，是不可能的。要想致富，首要第一步就是要思考「怎麼做才能得到錢？」。既然如此，在某種意義上，省錢也可以說是阻礙致富的一種想法。不過省錢也有好處。也就是可以體會「省下來的錢也是一種收入」的道理。因為很多「覺得錢不夠用的人」，除了不太願意花錢以外，另一方面對於付出的支出，卻經常都是漠不關心。


    ![](img/eb218596ca7d7233a5dc0b8e8579ca6f_78_0.png)


    正因為如此，所以可以試著找一樣東西，以不勉強的方式想辦法去省錢。這麼做是為了讓自己可以體驗到透過採取行動得到錢的成就感，踏出改變的小小一步。

    另外還有一點是，我認為日本一直以來的教育都沒有教我們如何賺錢，而是告訴我們要以時間和勞力辛苦換取金錢。

    戰後被稱為企業戰士的父親輩們這麼做，或許可以說是不得已。

    但是，高度經濟成長期如今已然結束，在終身雇用制度和獎金、加班費都沒有獲得保障，年金制度也因為少子化瀕臨瓦解的現代，「一旦成為企業的正式員工，努力工作，一輩子就不必煩惱」、「錢必須賣命工作才能換得」的觀念，感覺就像是上個世代根深柢固的落伍說法。

    因此，在學習賺錢方法之前，最多只能先有所體會。

    體會金錢究竟是什麼。

    錢原本並非必需品。

    在以前還沒有金錢的時代，人們都是靠以物易物的方式換取各自想要的東西。


    住在山上的人或是狩獵，或是採集菇類；住在海邊的人則捕魚、採集海藻，彼此交換需要的東西。

    雙方之間靠的是「信賴和感恩」，而不是金錢。

    到了後來，生活變得複雜，社會分工，人們才開始用錢換取需要的東西。

    這時候，當自己為他人的生活有所付出，就能得到錢。

    換言之，錢成了「信賴和感恩」的象徵。

    若是想賺錢、變成有錢人，首先最重要的是，就是領悟金錢原有的真正意義。

    第一步要做的，就是把自己家裡用不到的東西，讓給需要的人，換取對等的金錢。

    請各位好好地去體會自己賣出的東西，變成對方迫切需要的東西，彼此之間因而產生信賴和感恩的關係。


    ## 勇氣與財富的法則


    ![](img/eb218596ca7d7233a5dc0b8e8579ca6f_81_0.png)


    金錢建立在「感恩」和「信賴」之上。

    只要一直做出值得他人感恩與信賴的行為，

    金錢自然會源源不絕而來。


    ## VI

    重新懷抱夢想


    一個星期後，務再次來到小谷的公寓。

    「關於金錢象徵著感恩和信賴這一點，我已經稍微能夠理解了。」

    務一掃之前的憂愁，開心地將賣掉球桿的事說給小谷聽。

    「那真是太好了！

    我以前當上班族的時候也跟你一樣，完全不覺得自己對公司有什麼貢獻，也從來不覺得自己領薪水是因為對他人有所幫助、使人開心的緣故。」

    「是啊。自己嘗試了你要我做的事情之後，我終於明白自己現在的處境有多麼危險了。只不過……」

    「只不過什麼？」

    「話雖然這麼說，但我還是像你跟目代一樣有勇氣投資。再說我也沒有那種閒錢。我只是在想，既然不能這樣繼續下去，乾脆利用下班的時間去做夜間倉庫管理員，或是兼差修馬路好了。或者考慮重新進修學習新技術，轉換跑道。」


    務喝著咖啡苦笑著說。「我明白你的心情。五年以前我也是每天過得很辛苦。我問你，做什麼事會讓你打從心底覺得開心？」

    「覺得開心的事嗎？」小谷的問題總是讓務一頭霧水，就像現在這個突如其來的問題，自己以前根本從來沒有想過。這幾年來，不，應該是說這幾十年來，已經沒有什麼事會讓自己開心了。與其這麼說，其實自己對任何事情都沒有興趣，甚至覺得長大之後有了家庭就是這樣。尤其是從生活變得更辛苦之後，胸口經常有股壓迫感，做任何事都感覺不到快樂。不過，現在被小谷這麼一問，腦中倒是馬上浮現一件事情。也
