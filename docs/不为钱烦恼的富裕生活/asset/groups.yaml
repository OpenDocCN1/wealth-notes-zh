    # 不為錢煩惱的

    富裕

    生活


    向億萬富豪學習，改變人生的理財課


    「勇気」と「お金」の法則


    ふがない僕が年下の億万長者から教わった


    小林昌裕


    Masahiro Kobayashi


    當你想起發自內心的願望時，金錢就是你的「魔法棒」。


    過去的我身無分文。


    沒有勇氣採取行動，只是盲目地痛苦掙扎。沒有存款，也找不到自己的存在意義。家庭瀕臨破裂。


    序章

    「我們家可是沒有那種閒錢！

    每個月光是生活手頭就已經很緊了！」

    客廳裡迴盪著敬子激動的聲音。

    「可是人家想去看瑞士的房子長怎樣嘛。

    帶我去啦，好不好？

    到底什麼時候才可以帶我去嘛？暑假？還是春假？

    我要等到什麼時候才能去？」

    就快滿十歲的讓任性地鬧著脾氣。

    「你到底要我講幾次？我們家沒有那種閒錢！」

    「我就是要去！

    我要去、我要去！聽到沒有？我！要！去！」

    讓愈說愈激動，最後甚至要起脾氣來。


    「我吃飽了。」務低聲說，隨即便離開餐桌，一屁股坐在客廳沙發上看起報紙來，一副置身事外的樣子。敬子見狀深深嘆了一口氣，默默開始收拾餐桌上的碗盤。讓氣呼呼地拿起手機轉身離開客廳。務盯著報紙上的文字，思緒卻完全不在上頭，感覺只是用報紙遮住什麼似的，好讓自己可以逃離現實……這種令人窒息的氣氛，已經成了每天的日常。（不應該是這樣的，不應該是這樣。）


    # 前言


    這是一個以真實事件為基礎的故事，內容集結了許多為錢煩惱而來向我尋求諮商的人們的故事。除此之外，這也是過去長年任職於血汗企業，人生幾乎被沒有財富和時間的生活拖垮的我，重新起死回生的故事。


    人的一輩子可以賺多少錢、可以透過財富換來多少幸福，其實都決定於原生家庭的金錢觀念，以及所受的金錢教育。


    說到這裡，很多人會說自己根本沒有受過什麼金錢教育。事實上的確如此。


    在日本，一般人幾乎沒有機會學習金錢相關的知識。大家從小的成長環境便缺乏金錢教育，也曾思考過「如何靠自己賺錢」。日本的孩子唯一跟金錢有關的學習，就只有父母對待金錢的態度。


    假設父母經常掛在嘴邊、以身作則為孩子示範的態度是：「我們家沒有錢。」


    「要努力工作才能賺到錢。」

    「賺錢很辛苦。」

    那麼，孩子便會從唯一的金錢導師—父母的身上學習到同樣的態度，並且套用在自己的人生中。

    錢是工作換來的薪水。

    錢必須用汗水才能換得。

    人生就是不斷地為錢煩惱。

    這些觀念就是這樣養成的，縱然事實並非如此。

    不過，人一旦相信「錢就是這麼一回事」，便會緊抱著這樣的觀念不放，完全不想顧及自己的觀念去看看外面的世界。

    雖然大家常說「錢不是一切」，但是通常都要等到擁有財富，才會真正領悟這句話的意思。


    這世上可以靠錢解決的事物，多到數不清。我的工作就是為大家提供賺錢的建言。在這過程中我最大的體認，就是人生中有九成的煩惱，都可以靠錢解決。就連金錢買不到的美好事物，靠錢也能帶來更多邂逅的機會。故事中的主角務，最後為了家人鼓起勇氣改變。這份勇氣，正如今擁有億萬財富的人們，他們過去鼓起的「勇氣」。我衷心期望接下來這個故事，可以成為各位扭轉人生的契機。


    小林昌裕


