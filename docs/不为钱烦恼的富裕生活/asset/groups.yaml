    務不發一語。

    （我沒有錢。）

    他想起父親說的話。

    「我爺爺是個嚴肅又固執的人，很早就去世了，只留下奶奶和父親。

    父親很努力想讓一手撫養自己長大的奶奶過幸福的日子，只是還沒有等到這一天，奶奶就離開人世了。

    於是他把重心放在自己的家庭，

    努力要讓我們幸福。

    沒想到後來手受傷，

    再也無法工作。

    他一定覺得自己很沒用吧。

    說著說著，務想到了自己。

    自己過去一直看不起父親，

    因為他無法靠自己從困境中站起來，

    卻把一切

    怪罪給「受傷」和「自己的爸爸」，

    沉溺於酒精和賭博中，

    甚至對自己的老婆

    施暴。

    父親這種覺得自己沒有用、

    卻不知如何改變的軟弱心情，

    其實自己也是一

    樣。

    「我差點就變成和他一樣了，

    變成一個將一切怪罪給父親，

    無法給家人帶

    來幸福，軟弱、悲哀的男人。」

    「可是你也和他一樣，

    很努力想讓最愛的家人幸福，不是嗎？

    你們父子倆對家人的愛，

    其實是一樣的。」

    說完敬子笑了。


    「一樣嗎……或許是吧。我們個性都不堅強，害怕這個、擔心的，遇到困難就沒有辦法自己站起來。」「務以前從來不曾想過父親當時的心情，不過，現在他可以慢慢理解了。喝著手中已經冷掉的綠茶，務笑著說：「說到這個，小時候他都會用剩餘的木料，做很多玩具給我。現在讓的手那麼巧，說不定就是遺傳到他。」「想到這裡，務不禁開心了起來。敬子也開心地笑了。（改天再去看看他吧。哪一天也帶讓一起去好了。）幾天之後，務來到小谷的公寓。「是這樣啊。」「他將和父親見面的事，平靜地轉述給小谷聽。」


    務接著說：「我想，我應該是因為從小看著父親的背影，所以才會討厭工匠，覺得當上班族才是穩定、可以得到幸福的方法。加上只要一想到因為工作把身體搞壞、最後不幸去世的母親，我就會覺得自己不能獨自擁有幸福。因為母親的事，還無法保護她的罪惡感，導致我一直覺得自己沒有辦法讓女人擁有幸福。這就是為什麼我一直認為家人不幸是因為我不會賺錢，但是另一方面我又對賺錢抱有罪惡感。賺錢和擁有幸福對我來說，感覺就像是背叛母親……」務一面說，一面不斷重新思考自己的金錢觀和工作觀養成的原因。解開自己的行為和想法、痛苦的來源之後，他的
    心 終於找到平靜。


    ## 和父母的關係，會影響到自己如何看待社會和金錢


    人剛出生的時候，都沒有金錢的概念。等到懂事之後，才會開始知道錢的存在，學習怎麼花錢，同時也學習怎麼看待金錢。至於學習的對象，就是生長環境，尤其是父母。假設當媽媽的經常把「我們家沒有錢」掛在嘴邊，孩子就會默默接受「我們家沒有錢」的情況。如果父親每天總是疲於工作，孩子就會留下「賺錢很辛苦」的觀念。日本社會普遍認為「談錢是膚淺的行為」、「喜歡錢就是貪心」。很多人在家也會被教育「不要滿口都是錢」。那些從幼稚園開始就不斷被迫考試，從小學到高中埋首於補習，把考上好大學、進入大企業工作視為目標的人，一旦發現上班族能賺的錢有限的時候，或許也會很失望吧。


    說不定反倒是開始就被教育「錢會帶來開心」「賺錢是件開心的事」，對金錢擁有豐富想像的人，才有辦法擁有幸福。等到長大以後開始想打破過去的觀念面對金錢、改變人生的時候，心裡的矛盾於是產生。一日要靠工作以外的方式賺錢，如果覺得自己好像在做不該做的事，原本會順利賺錢的投資，到最後都會失敗。這就像成長過程中伴隨而來的痛苦一樣。要想擺脫這種想法，方法就是從不斷告訴自己「靠工作以外的方法賺錢不是壞事」、「錢是正面的東西」。除此之外，也要找出自己在成長過程中養成的金錢觀，或是導致認為「自己不能擁有幸福」的那些事情。我的父親是個上班族，每天忙碌於工作，也就是所謂勤奮老的企業戰士。從早到晚如修行般埋首工作，他，最後終於熬出頭，一路工作到退休。這些人將戰後的日本帶向今日的強國，對於他們，我當然表示尊敬，也認為這是必要的。


    或許是因為受到父親的影響，我踏入社會開始工作之後，也一度希望自己可以成為對社會有貢獻的人。我忙碌於工作，認為這是在社會上生存下去的方

    法，而且深信不疑。由於不知道其他方法，所以完全不覺得有什麼不對。

    打破我這個觀念的，正是羅勃特．清崎的《富爸爸，窮爸爸》這本書。

    雖然只是一本書，不過它讓擁有「富爸爸」的我，得到全新的金錢觀。於

    是，我鼓起勇氣辭掉血汗企業的工作，轉換跑道。後來即使我只是個上班族，卻找到許多全新的收入來源。

    假設各位現在對於賺取工作薪水以外的錢感到抗拒，一定要先質疑自己的

    這種植法。除此之外，我也希望各位可以回頭去思考父母給你的金錢觀是什麼。

    經過這幾年來從事金錢相關講座的經驗，我發現一般人接受家庭教育金錢觀的類型有兩大類。

    一種類是絕對忠於父母的價值觀，照單全收的類型。這類型的人從小被教育「找個正職的工作，腳踏實地領薪水直到退休，這種生活才是最幸福的」。看

    著同樣過這種生活的父母，自己也隨著步上這樣的人生。另一種類型是，將父母對待金錢的方式和觀念當成負面教材，選擇採取完全相反的方法賺錢。就像公務員的孩子立志要當藝術家，或者藝術家的小孩選擇揀找一份穩定的工作等。務的情況就是屬於這一類。他把從事木工這種一日受傷，生活很容易就會陷入困境的工作的父親當成借鏡，自己選擇了上班族這條路。與其思考自己屬於哪一類型，更重要的是去瞭解背後的一「選擇原因」。因為很多時候會發現，自己對金錢的不安，或者是深信不疑、不知道蘊通的價值觀，都來自於那裡。


    ## 勇氣與財富的法則

    在長大之前，

    金錢觀都是受控於父母。

    長大之後是要改變，還是繼續受到束縛，

    全憑自己的決定。


    在長大之前，

    金錢觀都是受控於父母。

    長大之後是要改變，還是繼續受到束縛，

    全憑自己的決定。


    ## XII


    ## 財富容器


    小谷不斷給務出功課。

    「接下來我們來聊聊『財富容器』吧。」「那是什麼？」「每個人會根據從小的家庭環境，以及自己賺到的錢，設定出一個『自己可以賺的錢大概就是這樣』的範圍。假設把這個範圍想像成一個容器，如果容器很小，就算賺很多錢，也會不自覺地把多於容器的錢全部花光。大家不是常說嗎？像是中樂透之類的暴發戶通常都沒有好下場。那就是因為他的財富容器沒有跟著擴大的關係。」「原來如此。可是要怎麼擴大自己的財富容器呢？」「最有效的方法就是我之前跟你提過的，實際去體會會錢代表感謝和信賴的感覺。還有就是讓自己愛上錢。


    從今天開始，當你每天花錢，或是賺到錢的時候，都要試著把「謝謝」說出口。

    花錢的時候要感受可以花錢的感覺，賺錢的時候就要想著自己的付出，

    並且把「謝謝」說出口。

    另外還有一點是，捐錢給一些會帶給你開心，或是覺得自己做了一件好事的機構或計畫。

    從那天以後，務開始養成習慣，不論是在超商買東西，或是投販賣機買

    汁，都會開口說「謝謝」。

    他也發現，拿到薪水和房租時開口說「謝謝」，心裡會莫名產生一種奇妙的感覺。

    以前不知道為什麼，對於得到錢，自己總是有種被壓榨的感覺。不過，現在每次得到錢，每一次付錢，都會感覺自己相當富足。

    漸漸地，他知道自己有能力賺錢，也有能力付出金錢，更懂得感謝自己。


    另外，針對捐款他也做了很多功課。

    他想了很多方法，思考如何讓捐款為自己帶來真心的快樂。後來他想到的

    方法是現在在日本很普遍的「群眾募資」。

    務對其中一個計畫相當感興趣。

    計畫內容是替有發展障礙的孩子建立一個教育環境，讓他們可以學習世界

    通用的技術。

    「就是這個了！」

    務二話不說馬上提供了十萬圓的贊助。

    這個金額是因為現在自己每個 月都 會有十萬圓的房租收入，於是便以一個

    月份的數字來作為設定。

    加上贊助還可以得到體驗課程和參與工作坊的回饋，他打算帶著讓一起去

    參加。

    後來，他把這個募資計畫告訴，讓，和他一起隨時關心計畫的發展。最後也

    真的帶著他一起去了課程。


    現在的務，覺得自己賺的錢可以幫助他人是一件相當值得驕傲的事。有一天，務買了一組家庭用的木工工具，來到安養中心探望父親。勝高興得像是得到玩具的孩子一樣。「我要用這個做一艘船給你媽媽。」認知症愈來愈嚴重的他，想為老婆做點事情的念頭卻一天比一天更強烈。（他也只是想讓家人幸福而已吧。）隨著慢慢瞭解父親的心情，務的心結也一點一點地慢慢解開了。「做好了！怎樣？你覺得她會喜歡嗎？」勝抬頭看向孩子。看到父親開心的樣子，務也很自然地跟著笑了。「嗯，我想她一定會喜歡。一定。」從此之後，務就經常到安養中心陪伴父親。勝認不出孩子的曰子愈來愈多了，有一天，他的狀況難得好轉，終於認出務來了。


    他對著務說：

    「你真的變成一個好男人了。

    聽好了，雖然自己沒有做到，不過你一定要讓家人幸福，

    知道嗎！」

    （我自己沒有做到。）

    聽到父親的話，務的淚水默默地流下來。

    （我以前也跟你一樣，把一切的錯都怪到你身上……）

    「爸，我對不起你。下次我會帶敬子和讓一起來看你。還有，你也是我的

    家人，我也會讓你幸福的！」

    務決定要賺更多錢。

    （只要有錢，就可以把他接到家裡附近比較好的安養中心，

    我也能為他做

    更多事。）

    此時的他，不再對金錢感到罪惡。

    對現在的他來說，金錢是實現心願必要

    的

    存在。


    ## 捐款會讓自己的「財富容器」變得更大


    前述中提到，

    金錢是感謝與信賴的象徵。

    然而，日本社會普遍認為賺錢是一種貪婪、罪惡的行為，

    導致很多人在不

    自覺間下意識地抗拒金錢。

    眼下有金錢困擾的人，

    他們的財富容器都很小，這一點無庸置疑。

    這時候，即使透過繼承遺產或是中樂透等獲得大筆財富，

    也會因為覺得

    「自己沒有能力擁有如此龐大的財富」，

    最後將錢一毛不剩地花光。

    舉例來說，我們經常聽到有人中樂透之後，

    因為無法拒絕要求而把錢全部

    借給親戚，自己一毛錢都不剩。

    或是炒股致富的人後來過度揮霍，

    或是

    不經思考地進行投機買賣，

    最後繳不出稅金而鋃鐺入獄。

    要想擴大自己的財富容器，有以下幾個方法。

    首先，要從日常生活

    中去感受賺錢、付錢的美好。


    如果依照目前為止的生活方式，當然感受不到這些美好。所以，無論是付錢或是得到錢的時候，先練習說「謝謝」。這麼做自然而然會開始產生感動和敬意。我自己每天也會隨時說「謝謝」。很奇妙的是，愈是經常說「謝謝」，令人感恩的事情就愈會發生在自己身上，也會開始注意到這些感動。我曾參加過心理諮商師小池浩的座談會。他曾經一度負債兩千萬，最後成功翻身，逆轉人生。在會中他也提到，經常說「謝謝」，決定了改變人生的速度。市面上有很多書都告訴我們說「謝謝」可以改變人生，我想這也是因為這麼做可以消除一直以來的負面思考。另外還

    有一個方法可以擴大財富容器。這個方法十分有效，就是每天持續接受新的小挑戰。因為，每天的

    小挑戰可以提高自我肯定感，擴大自己的財富容器。


    很多有錢人即使擁有幾乎過多的財富，仍然會維持挑戰的習慣。因為他們知道「賺錢」已經不是自己的目標，但是持續挑戰可以得到更多他人的感謝和喜悅。

    這種想法才叫做「人生不是為了錢」。唯有擁有財富之後懂得金錢的意義的人，才會瞭解這句話背後的深奧含義。這也是為什麼我希望所有人都能致富的原因，因為這可以讓幸福不停地向外擴散。

    無論是現在已經擁有億萬家產的人，或是靠著投資不斷賺錢的人，大家都經歷過—開始的第一步。雖然緊張不安，但還是鼓起勇氣踏出第一步，接著又一步，然後慢慢成為助跑，不斷累積經驗，一步一步擴大自己的財富容器。

    若是以金錢以外的東西來比喻，感覺就像每個小時候都經歷過的學騎腳踏車一樣。

    大家一開始都是先裝輔助輪，在爸媽的扶持下練習的，對吧？接著自己靠著輔助輪前進，最後拆掉輔助，學會騎腳踏車。一日學會之後，就會忘記之前不會騎的事了。

    '
