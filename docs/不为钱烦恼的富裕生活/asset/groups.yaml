    那一天在回家的途中，務又來到「SUZUKAGE」。他坐在老位置，打開筆記本，準備進行小谷給他的功課。那天，店裡罕見地只有務一個客人，耳邊只剩下爵士樂的曲聲輕輕地傳來。

    （結果和目標……）務雙手抱著胸不停地思索。就在這時候，從櫃檯飄來一陣藍山咖啡的香氣。

    循著咖啡香看過去，一個和老闆長得非常像的年輕人正在沖泡咖啡，老闆則在一旁認真地看著他的動作。

    （原來老闆有兒子啊。）

