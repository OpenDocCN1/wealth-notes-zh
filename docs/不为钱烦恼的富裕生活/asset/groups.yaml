    # I

    我的存在價值


    （我是從什麼時候變成這樣的呢……）

    務坐在公園的椅子上，大口咬著百圓麵包，腦袋不停想著這個問題。他總是習慣午休時來到這個公園。務的公司位於東京都丸之内區，附近一兩千圓的午餐價位，他根本負擔不起，所以每天都是自己一個人買了麵包，到公司旁邊的這個公園來吃。

    「應該是一連串的預料之外造成的吧……」

    他喃喃說道。

    務今年即將滿四十歲，是個平凡的上班族，任職於汽車銷售公司的人事部。家裡有太太和一個兒子，三個人一起住在一棟坪數不大、離市中心有段距離的住宅區內的中古透天房，生活樸實節儉。

    太太敬子是大學時期的學妹，兩人在務二十七歲、敬子二十五歲時結了婚。婚後一直無法順利懷孕，所以後來懷了讓的時候，兩人激動得喜極而泣。


    務口中的「預料之外」，就是從那個時候開始的。兒子讓三歲的時候，開始出現極度暴躁、亂發脾氣的現象。經過醫生診斷，確定為發展障礙。考量到兒子的狀況，敬子決定辭去正職的工作，改做打工，每天忙著照顧遲緩兒，從早到晚工作家事兩頭燒。這使得原本個性溫柔的她，開始對從不幫助家事和照顧孩子的務心生不滿。讓念小學的時候，務的父親因為腦中風造成大腦受損，引發失智症。七十幾歲的父親平時自己一個人住在遠方，生病之後，務當然不可能將行動不便又罹患失智症的父親接到市裡和自己同住，只好讓他住進安養中心。過去從事木工的父親，退休後沒有厚生年金可領，僅靠著微薄的年金根本不夠生活。非但如此，住進安養中心之後，務才發現父親過去因為賭博欠了不少錢。如今這些債務全部落到了家中獨子—務的肩上，導致他的生活頓時陷入困境。務雖然很希望敬子可以恢復正職的工作，但是基於讓也需要有人照顧，所以他也不敢奢望。


    從那時候開始，敬子不時抱怨希望務也多少幫忙一點家裡的事。但是務認為自己已經每天拚命辛苦賺錢養家了，也忍受花用全靠向敬子拿零用錢的做法，因此完全不理會她的抱怨，對家裡的事依舊不想過問，也不想幫忙。這使得夫妻倆的關係瞬間降至冰點。

    務的年收入大約有五百萬圓，在都會區屬於一般水準。敬子打工的工作一年大概有六十萬日圓，全部用來支付安養中心費用還不夠。

    兩人每天都在為了家計想辦法籌措安排，勉強度日，完全無法為將來做何儲蓄。

    這樣的生活持續了好幾年，讓今年也滿十歲了。

    在重新接受發展障礙的診斷之後，學校替讓安排了一位專門協助發展障礙學童的人員。然而儘管如此，讓的狀況卻愈來愈嚴重，經常上課到一半突然跑出教室，或是一焦躁起來便無法控制自己。他在班上也開始受到同學的嘲笑和捉弄，完全交不到朋友。

    不過另一方面，讓在美勞課卻表現得十分專注且亮眼，獲得不少肯定和獎項。有時候看著擺在客廳那些厲害的美勞作品，程度明顯優於一般孩童，連務都不由得感到佩服。就連學校的老師也跟他們說「一定要讓他充分發揮能力」，只是無奈家裡的狀況根本無法讓他學習才藝或接受特殊教育。

    一想到今後的學費和孩子的將來，務的心情更鬱悶了。

    萬一接下來連同身為獨生女的敬子也需要擔起照顧父母的責任，到時候該怎麼辦才好？就連夫妻倆自己的老後，他也不認為可以存到足夠的錢生活。

    想不到任何辦法突破困境的務，只能每天煩惱到幾乎快崩潰。

    有一天，對家具設計有興趣的讓，在電視上看到知名瑞士建築師事務所「Atelier Oi」要在日本舉辦個展，於是叼著要去看，敬子只好帶他來到六本木。

    讓參觀完個展之後完全迷上建築、空間和產品設計，回到家後不時叼著「想去瑞士」。讓的個性一旦想做什麼，就非要達成不可，這也是發展障礙的孩子的特徵之一，算是個優點，同時也是缺點。

    「我們家怎麼可能有那種閒錢！」


    敬子的壓力愈來愈大，對孩子也愈來愈常生氣。

    這……讓務看了只是心生厭煩。

    因為每次只要敬子生氣罵人或嘆氣，他就覺得她是在責怪他沒有用，錢賺得不夠多。雖然他對自己對待家庭的消極態度也很自責，不過老實說，他一點也不想去想這些，因為這會讓他覺得自己和從小憎恨的父親有幾分相似。

    漸漸地，務開始排斥溝通，家裡的事更是完全交由敬子去打理。

    自己在這個家已經失去存在的意義。

    「嗟……」

    務嘆了一口氣。

    在這喧囂市中心的公園裡，更讓人備感孤單。

    （工作，結婚，生小孩。

    原本以為這樣的日子雖然平凡，卻可以過得很幸福。

    ）

    「爸爸！我還要玩盪鞦韆。」

    突然耳邊傳來小女孩的聲音，應該才三、四歲吧。


    「好啊，盪鞦韆嗎？爸爸陪你玩。」

    小女孩可愛得像個童星，身邊的父親看起來比務還要年輕個十歲左右吧，身上的開襟羊毛衫質料不凡，和他乾淨清爽的外表十分搭配。（這平日大午中的，還真稀奇。）

    務出神地看著那對父女。

    過了不久，「我來了」一個身材苗條的漂亮女子抱著嬰兒走向父女，應該是他的太太吧。「啊！是媽媽咪！媽媽∼」

    小女孩朝媽媽跑了過去，年輕爸爸一臉幸福地慢慢跟上去。四人開心地一同走出公園。（真幸福，就像是没有任何煩惱的幸福家庭。以前我也曾幻想過這幅景象……）

    看著四人背影，務心中的絕望變得更沉重了。


    # 抛开「只要守住平凡，幸福就不会瓦解」的幻想


    畢業後盡量找一份可以領固定薪水的 工作，到適婚年紀就結婚、生小孩。平時除了努力工作，也要盡自己所能協助另一半照顧孩子。

    想必很多人都是「對這種平凡卻幸福的生活抱持著幻想而進入 現在的公司工作」的吧。

    我自己也是其中之一。

    我一畢業就進入建築材料製造公司工作，優柔地以為「從此以後人生一路順遂」。然而，我太天真了。我成為公司的奴隸，不顧一切地埋首於工作，直到發覺身心已經瀕臨極限才轉換跑道。還記得當初找到可以放心的工作時，我彷彿已經看到自己人生努力的終點。

    我在轉換跑道的當時，年收入大約有三百五十萬圓。這對二十六歲的年紀來說，生活綽綽有餘。只不過，當時在公司裡有個課長，和故事中的務年齡相仿，平均年薪約有六百五十萬圓。這樣的收入絕對不算低，但是他卻跟我說：「薪水全部都拿去養家了，每個月只有三萬圓的零用錢可以勉強度日。真羨慕你還年輕，賺的錢可以自由支配。」

    「把十幾年的歲月全部耗在這家公司，為的就是將來過著『勉強只有三萬圓的零用錢可以度日』的生活嗎？一想到這裡，我就不得感到憂心。

    「這不是我要的 安定的 人生」

    我告訴自己。

    在這個年代，不僅薪資停滯不前，遇上不景氣獎金還會被砍掉。近來的企業幾乎都沒有加班費，薪資也不再像過去在年功序列和終身雇用的制度下，會隨著年齡逐年調漲。

    我想當時不只是我，很多人都應該都對這樣的日子充滿不安和抱怨。

    加上隨著年紀愈來愈大，除了小孩的教育費之外，父母的照護問題也逐漸浮上檯面。現在很多人都是家裡都只有一個孩子，因此這個問題將來很有可能都要由孩子一個人獨自來承擔。


    在這樣的狀況下，不禁讓人也開始擔心起自己的老後，甚至還要擔心少子化導致年金給付減少的問題。如果將這些擔憂攤在陽光下一一檢視，或許很多

    人會寧願假裝這一切都不存在吧。

    假設這樣的生活，就是我們所描繪的「平凡的幸福」和「中上階級」的最後終將來，或許現在就有必要修正自己對於「平凡卻幸福」所抱持的期盼。

    我直到三、四十歲左右，才開始意識到這件事。

    我想各位很多應該都已經有家庭、有小孩了。就算想轉換跑道，卻沒有任何亮眼的工作表現，也沒有一技之長。即便想重新挑戰新嘗試，也沒有任何專業證照。加上還有養家的壓力，更讓人難以決定降低收入嘗試沒有經驗的領域，或是獨自創業。

    對將來感到不安，卻無法踏出改變的第一步。

    因為無法改變，造成心裡的不安日益高漲。


    再這樣下去，萬一像故事裡的務一樣遇到預料之外的狀況，該怎麼辦呢？這裡所說的預料之外狀況，指的是像是被解雇，或是公司倒閉領不到薪水，或是父母病倒，或是自己或家人罹患重病等因為突發事件而需要用錢的情況。不過，有一點大家一定要明白。各位到目前為止的人生，同樣是一連串預料之外的結果。正因為如此，擁有餘裕……也就是財富，才會如此重要。


    # 勇氣與財富的法則


    1

    人生就是一連串的預料之外。

    最終能夠「解決」這一切的，

    只有金錢。


    # II

    看見藍天


    務是汽車公司子公司的人事部課長。雖說是子公司，卻是日本家喻戶曉的汽車公司，所以當初找到這份工作時，他心想接下來自己的人生肯定可以一路順遂，對將來相當放心。另一方面

    他也承認，可以在泡沫經濟破滅後找到大企業的工作，讓他覺得自己簡直就是

    人生勝利組。

    然而，做了之後才知道，人事是個相當吃力不討好的工作。在定期的個別

    面談中，經常需要安撫年輕一輩的同事的抱怨，例如「這家公司爛透了，要改變才行啊」、「上面的老人是要我們做一些不可能辦到的工作」等。面對這些

    抱怨，當然不能直接告訴對方「既然這樣，那你辭職別幹啊！」。

    不僅要安撫年輕同事的心態，和部長之間的協調溝通更是困難，可以說自

    己每天都處於左右為難的狀態，像個夾心餅乾一樣。

    剛進公司的時候，每當看到同事因為非自願的人事安排陷入困境，務還會


    感到難過。不過現在已經漸漸麻痹了，不再有任何情緒，只是麻木地做自己該做的事。即使造成對方家庭破碎，他也不會感到心痛。他刻意迴避和人事部以外的同事聚餐喝酒，在公司裡儼然成為一隻孤鳥。這個星期是春季節的個別面談。光是不想到要聽同事那些跟抱怨沒有兩樣的話，務就感到心煩。每到這段期間，他的心情總是無比沉重，變得更沉默寡言了。（接下來是目代啊……業績倒是否持續進步中，只是上一次的面談他一直講如何改善主管的關係。）務心裡直嚎咕。等會兒肯定又會聽到一大堆關於如何改善同事關係之類的話題了。想到這裡就不禁皺起眉頭。「麻煩您了！」會議室裡走進今天最後一位面試員｜目代。他一身灰色西裝，搭配柔和的藍色領帶。（嘆？他怎麼看起來跟之前不一樣了？）


    眼前的 事讓 務驚訝 得說不出話來。上一次的個別面談是在半年前。那時候的目 代，心中壓抑著許許多不滿和抱怨，滿口盡是對公司莫名的擔憂。可是今天的他明顯不同，外表沉穩，眼神充滿光彩，簡直換了個
    人似的。

    「謝謝您平日的照顧！面談很辛苦吧？」

    目 代先開朗地主動問候。

    突然被這麼一問，務頓時不知如何回應，因為一直以來這對他來說只是分內工作，而且還是個得不到任何感激的工作。

    「嗯……沒有啦，就工作嘛。」

    務若無其事地回答，接著冷淡地開始詢問目 代的工作和同事處的狀況。

    眼 前這位二十七歲的年輕人，不管面對什麼問題，總是帶著笑容回答，沒 有一絲的抱怨，反而充滿自信。

    「我總覺得你看起來跟以前完全變了個人似的。」「是嗎？謝謝。」

    「是發生什麼事了嗎？」

    「嗯……也沒有什麼特別的事啦。」

    目代微笑回答。面談約十分鐘就結束了，目代離開前再一次向務道謝，接著便步出會議室。

    （原來一個人可以有這麼大的改變。一定是發生什麼事了。）

    時間來到午休。務一如往常來到公園的長椅坐下，邊咬著麵包邊想著。（話說回來，做人事這麽久，還 是頭一回遇到有人跟我說「謝謝」呢。）

    「您好。請問……這裡有人坐嗎？」

    突然一個聲音傳來。

    「什麼？」

    抬頭一看，原來是前幾天那個幸福家庭的年輕爸爸。務的旁邊還有空位。


    「啊！沒有、沒有。請坐。」等務一說完，對方不疾不徐地坐下來，抬頭望向天空。「今天天氣真好呢。」「天氣？啊！是呀。」務看了看天空，和煦的春日一片蔚藍。務繼續咬著麵包，喝著手中的咖啡。兩人並肩而坐，靜靜望著天空。（上一次像這樣感受藍天，是多久以前了？）「看著雲這樣飄，總覺得心情也變好了呢。」年輕爸爸舒服地伸了伸懶腰。「嗯……是啊。」務也跟著點頭附和。不過，其實眼前這片一望無際的蔚藍天空，讓他突然不知所措。天空一直都在，自己卻連這一點都忘了。務開口問：


    「那個，你今天沒有跟你女兒一起出來嗎？……其實，我前幾天有看到你和女兒一起玩……」

    對方愕然大悟地點點頭，笑了笑。

    「她今天和我太太一起出去玩了。」

    「這樣啊。再冒昧請問，你的工作平日可以休假嗎？」

    「對啊，我是自由業，可以自己排假。」

    「原來是這樣啊……」

    務沒有再說下去。年輕爸爸禮貌地點了點頭，兩人就這樣繼續靜靜望著天空。

    等到午休時間結束，務便離開了公園。

    （我有多少久沒有眺望天空了？）

    務一面走回公司一面想著。回到座位上，突然發現從自己的部門辦公室也可以看到外頭的藍天。

    （這裡竟然也看得到天空！）


    他從窗邊的座位一直望向外頭的天空。務覺得自己似乎被困在這狹小的大樓裡。（難道我就像這樣這輩子一直被困在這裡了嗎？）不知為何，他的腦海裡突然閃過一個念頭：「去找目代聊聊吧？」為什麼那個年輕人可以像換了個人似的，整個神情完全變得不一樣了？幾天之後，務跑去找目代一起吃飯。對方也非常開心地接受他的邀約。


    # 改變就從「發現從未見過的風景」開始


    人總是習慣用自己的價值觀去看自己想看的東西。

    面對金錢當然也不例外。

    「我沒有錢。」

    一旦這麼想，就會用「沒有錢」的眼光去看待這個世界，所以只會看到自己沒有錢的真實。除非改變這種心態，否則只會變得愈來愈「沒有錢」，遭遇愈來愈多「沒有錢」的困境。

    即使有固定的收入，但如果認為「錢必須靠拚命工作換來」，就會把拚命工作賺錢視為人生圭臬，甚至在不自覺間選擇成為血汗企業底下的奴隸。

    我過去也是在血汗企業底下工作的一員，所以我很清楚，當陷入人生谷底時，人通常會選擇對自己的困境視而不見。因為，雖然遭遇困境，但是熟悉的環境總是會讓人感到莫名的安心。


    既然如此，要怎麼做才能改變這種心態，得到全新的金錢觀呢？方法之一就是「看見不相同的風景」。發現自己眼前的世界並不是只有灰色一種顏色。這一點很重要。過去只是自己沒有察覺，其實這個世界無限遙闊，充滿多采多姿的風景。當你想「改變現在的自己」，你就會從這個世界中發現許多回應你的心意的訊息。


    故事中的主角便是如此，他先是在公園遇見幸福的家庭，隨後在公司遇到眼神散發光彩的年輕後進，接著又看到藍天。事實上，光是這些，就已經讓他的內心起了變化。他開始一步一步鼓起勇氣，為自己受限、只剩下痛苦的世界和價值觀，注入全新的改變。正因為如此，所以他開始看見過去不曾意識到的風景。假設各位現在正為錢煩惱，姑且先將錢的事情擺在一邊，抬頭看看天空吧。


    上班的途中，選擇走不以往的路，搭乘不以往的交通工具。

