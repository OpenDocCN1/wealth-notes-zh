    「很小的一步？」


    「是啊。我覺得這是每個人都可以做到的第一步。說到找理財顧問，大家可能會馬上聯想到被推銷金融商品之類的。事實上，找理財顧問最重要的，是改變對金錢的不好印象，發現金錢的真正意義。很多人為錢所苦的人，都不知道金錢的意義是什麼，而且會覺得自己不值得成為有錢人，也不會變成有錢人。所以一開始不能操之過急，要像爬緩坡一樣，一點一點改變對錢的感覺。你想試試看嗎？」

    「改變對錢的感覺？」

    「沒錯。來體驗一下不必為公司賣命，也能靠自己賺錢的感覺吧。」小谷向務提出兩個做法。「首先，很多人 在錢不夠用的時候，都會想辦法省錢。你只要在不強迫自己的範圍內去做就行了。」

