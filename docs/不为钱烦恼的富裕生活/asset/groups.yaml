    他央求父母買球桿給他，母親想盡辦法四處籌錢，後來終於為他買了一套二手的球桿。於是務開始每天努力練球。

    他本身體能非常好，領悟力也很高。所以一直以來都還有不錯的成績，可是卻在職業考試中遭遇難關。

    他始終無法通過考試，最後靠著獎學金進入大學就讀。除了繼續挑戰職業考試之外，他也加入某個高爾夫球俱樂部。俱樂部的老闆岡村先生，過去同樣是以職業選手為目標。他看中務的才能和發展性，主動給予一對一的指導，對務十分照顧。他將自己的球桿送給務，也就是前陣子在網路上賣掉的
