    務接過小谷手中的圖表，看得頻頻點頭。「感覺就像是根據自己的勇氣做決定，對吧？」「沒錯。要想增加收入、過著衣食無缺的人生，勢必需要先改善生活。方法有很多，以我來說，我會針對投資方法提供給客戶這樣一個圖表。其他還有像是工作上求發展的方法，例如挑戰國考以轉換跑道，或是創業等。不管選擇哪一種方法，都要配合自己的個性和資金，還有時間和勇氣。而且絕對嚴禁說「事到如今」這種話。」


    （資金、時間和勇氣……嚴禁說「事到如今」。）

    務仔細地將小谷的話寫在自己的筆記本中。

    當天回家路上，務順道來到「SUZUKAGE」。他坐在吧檯，主動向老闆提問：

    「老闆，你有沒有曾經因為覺得『事到如今努力也沒有用』，而放棄去做的事？」

    「事到如今？」

    「嗯。我最近發現，這幾年我一直告訴自己『事到如今也於事無補了』、

    『事到如今？』

    老闆想了想，淡淡地笑著說：

    『事到如今』這種話，指的是都過去的事了吧。

    事到如今再去想過去的事也於事無補。

    人對於過去的事，總是會覺得『事到如今都已經這樣了……』。」


    但是對於未來，都會告訴自己「從現在開始我要……」。老闆為務遞上一貫的藍山咖啡，「請用。」「對於未來，會告訴自己」從現在開始我要……」務把今天小谷給他的資金和勇氣的圖表打開來看。（從現在開始我可以為了賺錢做出的最大改變……）提到增加收入，一般人最先想到的應該不是投資，而是考取資格證照，然後換工作。只不過，這個方法無法實現之前和小谷提到的開一家高爾夫球俱樂部的夢想。務重新把思緒轉回眼前的圖表。上頭還寫著每一種方法各自的特色和分析。（我在上市工作了二十年，年收入有五百萬圓以上，應該可以跟銀行借到錢吧。如果真的沒辦法，還可以用房子去抵押貸款。投資房地產說不定真的可以改善我現在的生活。）務開始萌生這樣的念頭。


