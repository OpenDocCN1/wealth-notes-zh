    # XI

    父親的記憶


    自從和敬子談過之後，務就明顯變得不一樣了。

    首先，他避開擁擠的尖峰時間，每天利用搭電車通勤的時候，開始讀一些投資房地產的相關資料。只要哪裡有為投資客舉辦的座談會，他都會積極參加。針對座談會上的內容若是有疑問，也會先自己分析，然後找小谷討論，而不照單全收。到了假日，他就依照小谷的建議，靠自己積極地處尋找物件。

    這讓他也開始對建築產生興趣，連帶地跟讓之間也有了共同的話題。這時他才發現，讓擁有相當豐富的建築知識，讓他相當驚喜。

    三個月過後，務找到了一個物件，是間套房。

    而且就連小谷也覺得這個物件風險低，是個安全的好選擇，肯定他的努力。

    物件雖然不大，不過有個半個人高的寬敞夾層，有點像是樓中樓的感覺。

    而且地點位於市中心，交通方便，又是値得誇耀的好地段，加上才剛蓋好沒幾年，換成自己是剛踏入社會的新鮮人，肯 定也會想住在這樣的房子。'
  - '[PAGE 146]


    最後讓務做出決定的關鍵是，他想到「等到讓長大出社會以後，如果能住在這裡，自己也會比較放心，而且感覺這間套房還滿值得投資的」。但是話說回來，投資必須自己承擔風險。簽約的那一天，務和敬子為了踏出全新人生的第一步，兩人一同鼓起勇氣蓋下印章。不過老實說，務的手不停地在顫抖，緊張到連印章都沒蓋好，還重新蓋了三次。等到蓋完印章、確定成功踏出第一步之後，心裡感覺十分踏實。房子很快就租出去了，讓務鬆了一口氣。房租收入每個月有十二萬八千圓，扣掉還給銀行的九萬圓房貸費用，以及其他水電瓦斯和稅金之後，大約還剩下兩萬五千圓。對現在的鈴木家來說，這兩萬五千圓可是一筆相當可觀的收入。不只如此，奇妙的是，開始靠副業增加收入之後，務對自己的工作也突然充滿幹勁，變得比以前更認真了。就連在公司遇到目代，也會忍不住揶揄他「哎啾！看起來很有精神嘛」。敬子也變得更常陪伴務，讓他感受到「夫妻同心協力」的支持。除此之外，'
