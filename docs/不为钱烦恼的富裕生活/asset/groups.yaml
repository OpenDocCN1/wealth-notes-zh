    ## XI

    父親的記憶


    自從和敬子談過之後，務就明顯變得不一樣了。

    首先，他避開擁擠的尖峰時間，每天利用搭電車通勤的時候，開始讀一些投資房地產的相關資料。只要哪裡有為投資客舉辦的座談會，他都會積極參加。針對座談會上的內容若是有疑問，也會先自己分析，然後找小谷討論，而不照單全收。到了假日，他就依照小谷的建議，靠自己積極地處尋找物件。

    這讓他也開始對建築產生興趣，連帶地跟讓之間也有了共同的話題。這時他才發現，讓擁有相當豐富的建築知識，讓他相當驚喜。

    三個月過後，務找到了一個物件，是間套房。

    而且就連小谷也覺得這個物件風險低，是個安全的好選擇，肯定他的努力。

    物件雖然不大，不過有個半個人高的寬敞夾層，有點像是樓中樓的感覺。

    而且地點位於市中心，交通方便，又是値得誇耀的好地段，加上才剛蓋好沒幾年，換成自己是剛踏入社會的新鮮人，肯 定也會想住在這樣的房子。


