    公司為業界首屈，所以我以為自己接下來的人生將會一帆風順。只是沒想到，這種幻想沒有多久就破滅了。當時我負責業務的工作，白天四處奔走拜訪客戶，回到公司之後還要處理一大堆行政工作，期間還不絕的電話要應付。簡單來說就是血汗企業底下的奴隸。工作得這麼辛苦，年收入卻只有大約三百萬圓。就算後來轉換跑道，年入也不過只有三百五十萬圓左右。當然，以同世代的人來說，這樣的收入還算達到平均水準。但是，對結婚生子的生涯規劃而言，根本完全不夠。就算加薪也是有限，於是我告訴自己，再這樣工作下去恐怕沒有未來。只不過，雖然明白這一點，我卻遲遲無法踏出改變的第一步。因為我害怕。我的個性原本就十分膽小。別說是改變了，我比故事裡的務更逃避面對現實，繼續待在公司裡，讓自'
  md: "\n放假的時候，到許久未訪的地方走走，就算只是家裡附近也好。去發現過去不曾看見的景色。要想改變觀點，靠的是每天一點一滴的累積。當你開始能夠提起一點點勇氣「去看看過去未曾見過的風景」時，你的人生已經起了變化。你會發現自己再也不是活在痛苦中，痛苦不過只是人生中的一部分而已。別繼續在黑暗中摸索尋找了，何不走出黑暗到陽光下呢？可以帶領你走出黑暗的，這世上只有一個人。就是你自己。\n\
    \n## 勇氣與財富的法則\n\n假使對金錢有所怨懟，不妨暫且忘記錢的煩惱，去看看不曾見過的「風景」吧。改變，就此開始。\n\n## III\n踏出第一步的勇氣\n\
    \n身為人事部的員工，和其他部門的單一員工單獨見面這種事，考量到其他員工的眼光，務這二十年來一直嚴格規範自己不能這麼做。  \n然而，目代的改變實在令他大為吃驚，甚至不惜打破這個原則。\
    \  \n（身為人事部的員工，瞭解一下也沒什麼吃虧的。）  \n務和目代一同來到義式餐廳，一路上他不停在心裡為自己這麼找藉口。  \n（我有多久沒來這麼高級的餐廳了？）\
    \  \n兩人一口一口享用著夜間套餐，一面聊著公司最近發生的事，以及生活上的瑣事。之所以選擇有品味的餐廳而不是居酒屋，一方面也是為了展現誠意，因為務認為「有事向人請教，就要好好地請對方吃一頓飯，邊吃邊討教，而不是隨隨便便的」。只不過，像這樣細細品味一道一道送上桌的料理，對最近的務來說，已經是很久以前的事了。不可思議的是，這讓他莫名地產生了自信和勇氣。\n\
    \n「其實我今天找你出來，是有事想問你。」務開門見山地說。「啊，該不會是前幾天個別面談時，你問我的那件事吧？」目代輕輕地笑了。他的眼神中透露出光彩。「什麼？啊，對，就是那件事。」那天自己到底表現得多麼渴望知道啊？目代打探式地問：「所以現在你是以人事的身分想問我，還\
    \ 是……？」「沒有、沒有，完全是我個人想知道。」「那就好。」難不成他以為我是以人事的身分想跟他確認什麼嗎？聽到務這麼說，目代看似鬆了一口氣。「跟半年前相比，你現在看起來明顯有自信多了。半年前你曾經說過，當時的薪水讓你對未來的\
    \ 人生規劃感到很不安。」「沒錯，我的確這麼說過。」\n\n想，\n「可是，在這一次的面談當中，你完全沒有提到這方面的困擾。所以我在是不是有什麼重大的轉機讓你改變了……」\
    \  \n「或是以為我該不會是在做副業吧……？」  \n說完目代自己也笑了。  \n「什麼？做副業？」  \n聽到這個想都沒想過的答案，務不得反問。  \n\
    在務的公司，基本上是禁止員工從事副業的。  \n加上公司要求所有員工繳交個人編號，因此在從事兼職副業這方面，應該做得更是滴水不漏才對。  \n看到務游移不定的懷疑眼神，目代笑著說：\
    \  \n「沒有啦。其實與其說是做副業，我只是懂得運用自己的錢而已。」  \n一問之下才知道，目代利用自己上班族的身分向銀行貸款買房子，再將房子租出去，賺取房租。接著又透過其他方法，將房租收入做進一步的運用，為自己帶來更多財富。\n\
    \n聽到這裡，務一點也不覺得「原來還有這種方法！」，反而是充滿懷疑。\n\n「可是，這樣風險很大吧？」\n\n務一臉老實地喃喃說道。\n\n對於現階段沒有多餘閒錢的他，完全沒有想過什麼金錢運用。\n\
