    多了。我覺得我根本就是『窮爸爸』，想到連我自己都笑了。」「那麼，你現在對投資客應該比較不會那麼疑心病了吧？」小谷開玩笑說。沒想到務一臉認真地回答：「是啊。別的不說，光是知道原來上班族也可以投資房地產，就讓我夠驚訝了。」「一沒錯。因為在日本，其實上班族是最值得信賴的職業。我覺得就某種意義來說，根本是最強的工作。我在二十幾歲的時候之所以選擇從房地產開始投資，也是因為上班族的身分具備信用，可以讓我向銀行借到錢。」「我們一般人的印象，貸款買房子一輩子也就一次，當然會考慮到自己能夠多快還清貸款。沒想到現在的利息幾乎等於零，真是···不敢相信。」「所以我都會建議來找我提供建議的人，如果要投資房地產，就算手邊有存款，也一定需要貸款來買。只要用心找，市中心的物件價格幾乎都不會跌太多，也很少會賣不出去。而且以貸款來說，萬一不幸去世，假如貸款已經還清，接下來就可以收房


