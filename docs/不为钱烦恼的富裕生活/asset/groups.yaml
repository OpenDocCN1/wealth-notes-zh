    ## 正因為不想做，所以更要去做


    過去負責跑業務的我，曾經有一次被外商保險公司相中，想挖角我到他們公司工作。對方跟我接洽的那個人，年收入竟然高達三億圓，在保險業中屬於最頂端的超級業務員。後來由於我對保險業沒有興趣，婉拒了對方的挖角。不過，當時我問了一個問題：「請問，要怎麼做才能像你一樣如此成功？」這時候，對方給我看了他的薪資明細，告訴我：「選擇不想做的去做就對了。你就能跟我一樣成功。」我不懂他的意思。於是他說，他告訴自己，如果覺得「今天不想再拜訪客戶了」，就一定要再打最後一通電話。


    ![](img/eb218596ca7d7233a5dc0b8e8579ca6f_103_0.png)


    最後他建議我：

    「如果一下子就要每次都選擇不想做去做，壓力也會很大，所以一開始只要三次挑一次去嘗試就行了。」

    話是這麼說，但是很多人一定會說「選擇不想做的去做，一定不會有好的結果啊」。不過，這其中其實有一定的標準。

    我也是嘗試之後才體會到的，所謂「選擇不想做的事」，判斷的標準就是「雖然覺得對自己應該會有幫助，但是就是不想做」。

    舉例來說，「有機會可以和崇拜的人見面，但是卻不想去，因為實在不敢跟對方說話。」這種時候就一定 catchment 要去。又例如「雖然知道只要再稍微努力一下，一定會成功，但實在很想放棄」。這種時候只要再一次、再五分鐘就好，一定要注意繼續堅持下去。

    可以從小事情開始練習。假設各位現在感受到不到幸福，或是覺得錢不夠用，這時候一定要做的事，就是採取有別於過去的行動。

    原因很簡單。


    因為過去的行動，只會造就出現的你。假設現在的你過得並不如意，就必須採取和過去不一樣的行動。所謂和過去不一樣，指的多半就是過去自己沒有選擇的那些「不想做的事」。人都希望保持慣有的行動和思維。對於新的做法，或是可以改變自己的行為，通常會感到害怕而下意識地選擇逃避。

    只要繼續過去的做法，永遠不可能打破現狀。光是想的，是無法改變現狀的。正因為如此，所以要試著去做自己不想做的事。選擇「害怕」、「抗拒」的去做，用不同於過去的做法，重新拿回自己人生

    的掌控權，一步步改變人生。為什麼賺不到錢？最大的原因就在於自己的思維。


    必須先意識到眼前的現狀，全都是自己一手造成的。

    眼前一直逃避面對的現實，雖然感覺要比實際上來得更可怕，不過當選擇正面迎接問題之後，很多時候會發現，其實並沒有想像中恐怖。

    因此，當你鼓起一點勇氣，決定去面對、不再逃避的時候，甚至是實際採取行動之後，一切都會開始改變。

    我很認同心理學上的一個說法：「自己身邊的一切都是反映自己的鏡子。」

    因為覺得自己很沒有用，對讓的情況無能為力，所以選擇對他關上耳朵，保持距離。

    結果導致自己在家裡漸漸失去存在的意義。

    造就出現實的人是自己。自己的處境，就像是一面鏡子，反映出自我內心的狀態。讓所感受到的無助，其實就是務心裡的無助，具體呈現出感覺在家裡失去意義的務最真實的內心。


