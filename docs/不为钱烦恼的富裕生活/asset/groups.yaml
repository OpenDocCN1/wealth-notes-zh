    ## 奇蹟發生


    隨著財富容器擴大，夢想會變得更大，奇蹟也會更容易發生。我自己也體驗過好幾次這種奇蹟。例如二〇一七年《富爸爸，窮爸爸》的作者羅勃特．清崎來到日本，當時我和他一起站在台上。我只是一名讀者，而他則是高不可攀的大人物，所以對我的人生來說，這就像是奇蹟發生一般。我之所以能夠和他一起站在台上，是因為我花了幾百萬圓成為活動的贊助商。有
    人可能會說「什麼嘛，花了錢當然會有奇蹟啊」。不過，我所謂的奇蹟，其實是指在他要來日本的當下，我身邊竟然正好有錢可以讓我成為贊助商。對於當時讀過他的書的我來說，這才是奇蹟。


    除此之外，我大學一畢業就一直是個平凡的上班族，這樣的我，後來竟受到母校的邀請回去擔任講師。這件事對我而言，在某種意義上也是奇蹟。我因為懂得賺錢的方法，知道如何讓人生變得更豐富，而且以親身體騐證明白了這一切，所以受到母校的邀請，成為理財相關課程的講師。這對十年前我來說，根本是作夢也想不到的事，讓我非常開心。諸如此類跟錢有關的奇蹟例子還有很多。好比我有一位經營房地產公司的朋友M，他原本在丸之內擁有一家事務所，後來考慮到雙親年事已高，所以打算把公司搬到老家所在的另一區工作。只不過，由於該區為精華地區，地段好，所以遲遲沒有好的物件釋出。有一天，他得知一個物件，竟後就是老家附近的新建辦公大樓。物件非常搶手，詢問度相當高，不過屋主急著脫手，所以希望找可以馬上拿得出訂金的買主。M手上的資金非常多，當天就匯了好幾千萬的訂給賣家，順利將物件得手。這也可以說是個奇蹟，因為手上正好有錢，所以得手想要的東西。


    務的情況也是如此。翔太會來跟他學高爾夫球，完全是偶然。但是，如果他當初沒有為了實現夢想而踏出第一步開辦課程，遇見翔太的機率肯定是零。當懷抱著夢想的時候，或是有學習目標的時候，倘若手上正好有錢可以馬上付諸行動，夢想會更有可能實現，也更有可能發生奇蹟。


