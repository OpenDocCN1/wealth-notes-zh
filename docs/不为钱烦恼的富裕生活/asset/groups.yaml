    # XII


    # 財富容器


    小谷不斷給務出功課。

    「接下來我們來聊聊『財富容器』吧。」「那是什麼？」「每個人會根據從小的家庭環境，以及自己賺到的錢，設定出一個『自己可以賺的錢差 приговор是這樣』的範圍。假設把這個範圍想像成一個容器，如果容器很小，就算賺很多錢，也會不自覺地把多於容器的錢全部花光。大家不是常說嗎？像是中樂透之類的暴發戶通常都沒有好下場。那就是因為他的財富容器沒有跟著擴大的關係。」「原來如此。可是要怎麼擴大自己的財富容器呢？」「最有效的方法就是我之前跟你提過的，實際去體會會錢代表感謝和信賴的感覺。還有就是讓自己愛上錢。'
  - '[PAGE 168]


    從今天開始，當你每天花錢，或是賺到錢的時候，都要試著把「謝謝」說出口。

    花錢的時候要感受可以花錢的感覺，賺錢的時候就要想著自己的付出，

    並且把「謝謝」說出口。

    另外還有一點是，捐錢給一些會帶給你開心，或是覺得自己做了一件好事的機構或計畫。

    從那天以後，務開始養成習慣，不論是在超商買東西，或是投販賣機買\n

    汁，都會開口說「謝謝」。

    他也發現，拿到薪水和房租時開口說「謝謝」，心裡會莫名產生一種奇妙的感覺。

    以前不知道為什麼，對於得到錢，自己總是有種被壓榨的感覺。不過，現在每次得到錢，每一次付錢，都會感覺自己相當富足。

