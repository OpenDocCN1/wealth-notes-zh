    ## 決定結果、寫下來之後，朝著目標去行動


    決定結果，寫下來，然後採取行動。這是許多自我啟發和成功法則類書籍中經常會出現的手法，也是我多年以來一直做的方法。因為，這麼做確有效，會給自己帶來源源不絕的財富。哈佛大學曾經針對畢業生做過一項「人類行動程式度」的調查，最後根據數據結果，提出「3：10：60：27法則」。這項法則是根據成功者和沒有成功的人的思考和行動模式，做程度上分。假設一百個人當中，真正成功的人有幾個？答案是：設定具體目標，最後交出成果的，交出成果的，只有三個人。沒有設定明確目標，不過同樣花了很長的時間採取行動，最後交出成果的


    人共有十個。

    另外六十個人雖然勉強能夠維持生活，不過和務一樣對未來充滿擔憂，即使嘗試改變，也會因為中途挫折而放棄。

    最後的二十七個人則是空有不安和抱怨，卻毫無行動的人。

    這個結果就跟我在投資座談會上所做的調查一致，所以我一直思考，有沒有什麼辦法可以改變這個比例？

    那些3％的成功者，靠的是設定具體結果及階段性的目標，然後擬定達成目標的計畫，再根據計畫每天去執行。

    換個角度來說，如果可以在正確的人的帶領下，學習瞭解風險，持續錯誤嘗試，賺到錢的機率幾乎將近百分之百。

    這個方法每個人都知道，可是真正會去做的只有少數。只要能夠做到這一點，財富自然會源源不絕而來。

    所以，寫下「有錢之後可以做的事」之後，要做的只有一件事。


    就是付諸行動。

    很多「夢想致富」的人也許都會把夢想寫下來，但是毫無行動。與其說這就好像把夢想寫在祈願紙上祈求神明，其實很多人幾乎都是抱著「反正不會實現」的MATEMA的心態在作夢。

    相反的，我身邊那些年收入破億的人，他們寫下夢想之後，都會思考「如何實現夢想」，並且實際採取行動。

    曾經有一位二十幾歲的男性上班族來找我尋求意見，他寫了一百多件有錢之後想做的事情。我發現要實現這些所有夢想，竟然需要多達四十億圓。這個金額遠比「中樂透」要來得更大，不過接下來他做的，是「思考如何實現這個夢想且付諸行動」。

    經過短短幾年之後，如今他的年收入高達數千萬圓，而且當初寫下那些夢想，也正一個一個慢慢實現當中。現在的他，比以前更懂得如何賺錢，一開始的戰戰兢兢，如今已然變得樂在其中，對錢的看法也相當正面。

    羅勃特．清崎曾說過這麽一句話：


    「一旦選擇致富，就必須學習全新的遊戲規則。這時候需要的是截然不同的思維和財商。」

    陷入錢不夠用的困境，其實就是搞不懂賺錢的方法，長久下來於是導致如今的困境。要想打破這個現狀，就需要學習全新的方法，以及實際的行動。

    話雖如此，一下子就要嘗試投資，難度的確太高。那麼，要怎麼做才能開始為賺錢行動呢？答案就是，先在生活中採取不同於過去的行動，即使只是微不足道的小事。從慢慢習慣為生活帶來新的改變開始嘗試就行了。


