    ### 投資幸福


    「原來是這樣。看來你已經慢慢感受到捐款的快樂，還有收到錢和花錢的喜悅了。我想你的『財富容器』一定變得比以前更大了。」

    隔了一段時間再拜訪小谷，務提到自己的近況。小谷聽完笑著這麼說。接著他又問：

    「你會把錢花在自己身上嗎？」

    「我嗎？沒有欸，我不太會把錢花在自己身上。啊，我最近倒是經常去喝咖啡。現在喝咖啡已經不會有罪惡感了，心情也格外滿足。只是買東西的時候，還是有亂花錢、浪費的感覺。」

    「沒錯，這很正常。不過，如果你想讓你的財富容器變得更大，就要像把錢花在家人和捐款上一樣，把錢花在自己身上，這一點很重要。很多人對花錢都會有罪惡感，不過事實上，把錢花在自己身上，謹慎地使用，在某種意義上來說也是一種投資。」


    「把錢花在自己身上是一種投資？這是什麼意思？」「用做生意來解釋你應該就會懂了。如果今天老闆身上穿著破舊的衣服，鞋子也破破爛爛的，你應該不會想跟他買東西吧。你會擔心跟這種人買東西不曉得可靠，對吧？」「嗯，好像是這樣沒錯。」「不過，如果賣同樣的商品，但是另一個老闆戴名錶、一身西裝筆挺，就會讓人想跟他買東西。這就是人的心理。不過事實上，這並不只是單純因為對方一身名牌，所以就覺得他值得信賴。」「什麼意思？」「謹慎地把錢花在自己身上，代表你重視對方，對方也會感受到你的這種心態。相反的，如果一身隨便，賣的卻是昂貴的東西，難免會讓人有種似乎會被騙的感覺。花在自己身上的錢，代表你對自己的從容和重視。而這種感覺會讓對方感到放心。

    到頭來，不重視自己的人，通常也不會重視對方。」「真的是這樣沒錯。以往此前我都把薪水全部交給太太，自己只能天天啃麵包，內心真的覺得了無生氣。我甚至認為自己受到壓榨，所以那時候我對家人完全沒有感謝的心情，也不會想去照顧、去愛他們。」「沒錯。所以要先愛自己。你可以買你自己想要的東西，不必有罪惡感。回想一下小時候存零用錢買到想要的東西時的心情。等到你懂得把錢花在自己身上之後，就為你自己買個貴一點的皮夾吧，這會讓你對金錢的感謝變得更深刻。」「那天回家的路上，務來到玩具店。聽到小谷說可以把錢花在自己身上的時候，他也想過或許可以給自己買個勞力士錶之類的，但是不曉得為什麼，後來他想到的東西，竟然是任天堂的紅白機。小時候家裡很窮，光靠自己的零用錢根本買不起紅白機，所以他一直壓抑自己的欲望。有時候到朋友家玩到紅白機，都會讓他開心不已。但是「買紅白機給我」這種話，他實在對母親說不出口，只能當成夢想放在心中。「我決定了！我現在就要買給我自己。」說完便走進玩具店。過了一會兒，務手上提了個大紙袋走出來。裡頭裝的，正是最新款的遊戲機和軟體。回到家後，敬子和讓都嚇到了。這也難怪，因為過去總是說「電玩那種東西只會把人變笨」而堅持不買給讓的務，這回竟然開心買了遊戲機回來。那一天，鈴木家陷入瘋狂。一家三口，就連務和敬子也像小孩子一樣，興奮地玩著遊戲機。到了夜裡，務有了新的體認。（以前之所以不給讓玩，或許是因為自己以前沒得玩，一直壓抑自己的緣故吧。）從那天之後，花錢對務來說變成一件快樂的事。他並沒有因此亂花錢，而是有了全新的觀念——除了靠自己賺錢，也要開心地把錢花在自己身上。


    皮夾。

