    # 改變對金錢的「觀念」


    錢不夠用。要打破這個現狀，多數人最先想到的是，應該都是「省錢」吧。很多錢不夠用的家庭，都會更想盡辦法省錢，卻感覺錢愈來愈愈不夠用。省錢的效果有限，除非想辦法開源、增加收入，否則想光靠省錢解決錢不夠用的問題，是不可能的。要想致富，首要第一步就是要思考「怎麼做才能得到錢？」。既然如此，在某種意義上，省錢也可以說是阻礙致富的一種想法。不過省錢也有好處。也就是可以體會「省下來
    的錢也是一種收入」的道理。因為很多「覺得錢不夠用的人」，除了不太願意花錢以外，另一方面對於付出 的支出，卻經常都是漠不關心。


    ![](img/eb218596ca7d7233a5dc0b8e8579ca6f_78_0.png)'
  - '[PAGE 79]


    正因為如此，所以可以試著找一樣東西，以不勉強的方式想辦法去省錢。這麼做是為了讓自己可以體驗到透過採取行動得到錢的成就感，踏出改變的小小一步。

    另外還有一點是，我認為日本一直以來的教育都沒有教我們如何賺錢，而

    是告訴我們要以時間和勞力辛苦換取金錢。

    戰後被稱為企業戰士的父親輩們這麼做，或許可以說是不得已。

    但是，高度經濟成長期如今已然結束，在終身雇用制度和獎金、加班費都

    沒有獲得保障，年金制度也因為少子化瀕臨瓦解的現代，「一旦成為企業的正

    式員工，努力工作，一輩子就不必煩惱」、「錢必須賣命工作才能換得」的觀

    念，感覺就像是上個世代根深柢固的落伍說法。

    因此，在學習賺錢方法之前，最多隻能先有所體會。

    體會金錢究竟是什麼。

    錢原本並非必需品。

    在以前還沒有金錢的時代，人們都是靠以物易物的方式換取各自想要的東'
  - '[PAGE 80]


    西。

    住在山上的人或是狩獵，或是採集菇類；住在海邊的人則捕魚、採集海藻，彼此交換需要的是東西。

    雙方之間靠的是「信賴和感恩」，而不是金錢。

    到了後來，生活變得複雜，社會分工，人們才開始用錢換取需要的東西。

    這時候，當自己為他人的生活有所付出，就能得到錢。

    換言之，錢成了「信賴和感恩」的象徵。

    若是想賺錢、變成有錢人，首先最重要的是，就是領悟金錢原有的真正意義。

    第一步要做的，就是把自己家裡用不到的東西，讓給需要的人，換取對等的金錢。

    請各位好好地去體會自己賣出的東西，變成對方迫切需要的東西，彼此之間因而產生信賴和感恩的關係。'
