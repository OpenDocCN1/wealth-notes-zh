    # 和父母的關係，會影響到自己如何看待社會和金錢


    人剛出生的時候，都沒有金錢的概念。等到懂事之後，才會開始知道錢的存在，學習怎麼花錢，同時也學習怎麼看待金錢。至於學習的對象，就是生長環境，尤其是父母。假設當媽媽的經常把「我們家沒有錢」掛在嘴邊，孩子就會默默接受「我們家沒有錢」的情況。如果父親每天總是疲於工作，孩子就會留下「賺錢很辛苦」的觀念。日本社會普遍認為「談錢是膚淺的行為」、「喜歡錢就是貪心」。很多人在家也會被教育「不要滿口都是錢」。那些從幼稚園開始就不斷被迫考試，從小學到高中埋首於補習，把考上好大學、進入大企業工作視為目標的人，一旦發現上班族能賺的錢有限的時候，或許也會很失望吧。'
  - '[PAGE 163]


    說不定反倒是開始就被教育「錢會帶來開心」「賺錢是件開心的事」，對金錢擁有豐富想像的人，才有辦法擁有幸福。等到長大以後開始想打破過去的觀念面對金錢、改變人生的時候，心裡的矛盾於是產生。一日要靠工作以外的方式賺錢，如果覺得自己好像在做不該做的事，原本會順利賺錢的投資，到最後都會失敗。這就像成長過程中伴隨而來的痛苦一樣。要想擺脫這種想法，方法就是從不斷告訴自己「靠工作以外的方法賺錢不是壞事」、「錢是正面的東西」。除此之外，也要找出自己在成長過程中養成的金錢觀，或是導致認為「自己不能擁有幸福」的那些事情。我的父親是個上班族，每天忙碌於工作，也就是所謂勤奮老的企業戰士。從早到晚如修行般埋首工作，他，最後終於熬出頭，一路工作到退休。這些人將戰後的日本帶向今日的強國，對於他們，我當然表示尊敬，也認為這是必要的。'
  - '[PAGE 164]


    或許是因為受到父親的影響，我踏入社會開始工作之後，也一度希望自己可以成為對社會有貢獻的人。我忙碌於工作，認為這是在社會上生存下去的方

    法，而且深信不疑。由於不知道其他方法，所以完全不覺得有什麼不對。

    打破我這個觀念的，正是羅勃特．清崎的《富爸爸，窮爸爸》這本書。

    雖然只是一本書，不過它讓擁有「富爸爸」的我，得到全新的金錢觀。於

    是，我鼓起勇氣辭掉血汗企業的工作，轉換跑道。後來即使我只是個上班族，卻找到許多全新的收入來源。

    假設各位現在對於賺取工作薪水以外的錢感到抗拒，一定要先質疑自己的

    這種植法。除此之外，我也希望各位可以回頭去思考父母給你的金錢觀是什麼。

    經過這幾年來從事金錢相關講座的經驗，我發現一般人接受家庭教育金錢觀的類型有兩大類。

    一種類是絕對忠於父母的價值觀，照單全收的類型。這類型的人從小被教育「找個正職的工作，腳踏實地領薪水直到退休，這種生活才是最幸福的」。看'
  - '[PAGE 165]


    著同樣過這種生活的父母，自己也隨著步上這樣的人生。另一種類型是，將父母對待金錢的方式和觀念當成負面教材，選擇採取完全相反的方法賺錢。就像公務員的孩子立志要當藝術家，或者藝術家的小孩選擇揀找一份穩定的工作等。務的情況就是屬於這一類。他把從事木工這種一日受傷，生活很容易就會陷入困境的工作的父親當成借鏡，自己選擇了上班族這條路。與其思考自己屬於哪一類型，更重要的是去瞭解背後的一「選擇原因」。因為很多時候會發現，自己對金錢的不安，或者是深信不疑、不知道蘊通的價值觀，都來自於那裡。'
