    過去他雖然認為「人事是個吃力不討好的工作」，但是現在有愈來越多人感

    謝他。即便他自認為並沒有做什麼了不起的事，不過他深信「自己之所以領


    這份薪水，是因為背後的感謝和信賴，對人事的工作也逐漸感到驕傲。另一方面，經營合租公寓讓敬子忙得不亦樂乎。對於務來年即將投入的高爾夫球俱樂部，她也提供了許多想法。務還清了父親的債務，將他接到家裡附近以上層階級為對象的安養中心。勝在狀況好的時候，會用務買給他的木工工具，替安養中心做一些簡單的修繕和DIY。讓偶爾也會到安養中心探望爺爺，和他一起開心做DIY。務聽到安養中心的人這麼告訴他，心裡滿是欣慰。一家人感情慢慢地愈來愈深了。後來，敬子的母親因為癌症住院，務替她找了一家好醫院的單人病房，讓她接受最完善的治療。對務而言，這不僅是身為丈夫的自豪，同時也讓他覺得彌補了過去自己無法為母親做到的事。如今這一切的富裕、自信和人生意義，全都來自五年前自己勇敢踏出的第一步。在務的身邊，也有很多人和他一樣，利用這個金錢的魔法棒抓住幸福。金錢可以說就像讓所愛的人獲得幸福的魔法棒。


    包括為務指引投資之道的目的。目代在今年春天辭去了工作，終於下決定心開啟創業的人生道路。他和務兩個人如今是投資夥伴，經常一起吃飯聊天。目代結婚的時候，務還送給他們一趟塞班島蜜月之旅作為驚喜。這是他對於將自己從人生危機中拯救出來的目代的感謝，同時也是為了回報他當初那筆顧問費。目代對於這份傳回自己身上的信賴與感謝，真心感到開心。至於咖啡店「SUZUKAGE」老闆，他丟下一句「我打算把店留給兒子，自已到義大利去走走」便退休了。後來，務從他兒子那裡聽說他要實現多年來的夢想—「在義大利開咖啡店」，至今仍在舊閩當中。翔太發揮了他罕見的才能，在職業高爾夫球巡迴錦標賽中，以高中生的身分在業餘組中首次出賽，最後以全世界最年輕的選手身分寫下亮眼的成績。在十八歲那年成為職業選手之後，務便以球桿主人的身分和他「重逢」，成為翔太的贊助者。
    這一天，讓準備出發到瑞士留學。


    務獨自送他到機場。因為敬子說自己會捨不得，無法到機場送機。在前往機場的路上，務一直想自己過去的人生。尤其這五年的轉變更是巨大。只是鼓起一點勇氣，人生便截然不同。這一點，這一路走來兒子也慢慢感受到。了。務轉頭看著副駕駛座的讓。（當初我如果沒有踏出這一步，可能就沒有機會看到眼前這個值得信賴和驕傲的孩子了。

    務看著讓走向登機門，突然讓停下腳步回頭說：「爸爸，謝謝你。我也要跟你一樣，成為一個讓家人幸福的男人。我一定會做到的！」說完便轉身離去。務覺得兒子的背影看起來可靠極了。在回家的路上，車子行駛在高速公路上，收音機裡傳來
    Mr. Children 的


    〈Hero〉。

    和敬子結婚時，婚禮上播放的是這首歌。

    「我雖然不是什麼英雄，

    但是為了這個家，我願意成為英雄。」

    務想起自己當初了無新意的致詞，當時還狠狠地被大家嘲笑了一頓。

    （現在的我，對敬子和讓來說，

    算得上是最棒的英雄了嗎？

    我算是最棒的丈夫、最棒的父親、最棒的兒子嗎？）

    務突然這麽問自己。

    「我一定要是全世界前三名的幸福的女人。」

    「我也要跟爸爸一樣，成為一個讓家人幸福的男人。」

    「你真的變成一個好男人了。」


    務想起父親、敬子和讓說過的話。看來答案毫無疑問是肯定的。等到回過神來，自己眼淚流滿面。他再也壓抑不住心中的激動。他將車子停靠在高速公路的路肩，埋頭在方向盤上嚎啕痛哭。「謝謝，謝謝，謝謝，謝謝……」他不禁脫口而出。對自己所愛的人，對相信自己的人，還有對自己。所有感謝再也止不住地宣洩而出。一會兒過後，務滿臉淚水地笑了。「呼～」他深呼吸一口氣後，看向前方。前方的道路筆直，遠方一片藍天。


    （現在距離品嘗「最後的甜點」還有很長一段時間。

    那麼，接下來該實現什麼夢想呢？）


    結語 — 每一個父親，都是家人的英雄

    「希望這世上所有的窮爸爸，都能變成富爸爸。」

    我真心期盼有一天這樣的世界可以實現。

    故事中的鈴木務雖然是個虛構的角色，但是裡頭的橋段，全部都是根據來

    找我尋求建議的人身上發生的真實故事，也是原本不敢改變的上班族們，一路

    走來關於金錢和勇氣的故事。

    我的客戶各個年齡層的人都有，介於二十幾歲至七十幾歲之間。他們的故事

    事情發生的年代，與務的年齡和時間順序或許多少有些落差，不過我還是原封不

    動地直接放入故事中。

    我既不是心理諮商師，也不是人生教練。


    所以面對他們的問題和人生課題，我並不會給予心理上的建議或任何諮商輔導。我所做的不過就是給這些試圖擴大自己的「財富容器」、開拓視野、正　在摸索賺錢方法和副業的人，提供我自己以前的做法。雖然如此，但是很多人都見證了為了賺取財富所踏出的一小步，真的可以克服人生課題，使心靈富裕，深刻改變人生。在這個以罪惡看待金錢、把談論金錢視為禁忌的社會中，為了賺錢開始踏出腳步的人，就能一步步得到幸福。一日專注在自己的人生，鼓起勇氣踏出第一步之後，人生也會隨之改變。只要認真看待自己的人生，每個人都可以獲得幸福。這就是我想透過這本書告訴大家的道理。最後，我會將這本書的一部分版稅，捐給旨在促進幸福家庭的非營利法人團體「MAMA-PLUG」。

