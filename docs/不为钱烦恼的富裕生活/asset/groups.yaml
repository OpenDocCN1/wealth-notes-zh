    \n住在這裡，會帶孩子去那個公園玩也很正常。「你好，我叫做小谷。」男子向務自我介紹。在小谷的邀請下，務進到這棟奢華公寓大廈的住戶專用咖啡廳，坐在高級的沙發上。咖啡廳有著挑高的天花板，宛若五星飯店的酒吧。務突然覺得自己和這裡格格不入，開始感到坐立不安。「那我們就開始吧。如果不介意的話，是不是可以把你的狀況說給我聽聽呢？」在服務生送上兩杯咖啡之後，小谷直截了當地切入主題。「喔好。」務很自然地就將自己目前的狀況說給小谷知道。換作是以前，他完全無法想像會把自己的遭遇，跟一個和目代一樣比自己年輕好幾歲的晚輩訴說。更別說對方還是自己不信任的投資客和理財顧問了。\n\
    \n倒不是因為談話中得知小谷和自己是同一所大學的學弟，所以才對他卸下心防。而是，不曉得是因為小谷散發的氣息，還是因为自己內心對人生的不安，又或者是因為看到小谷幸福的模樣，務總覺得或許可以從他身上找到答案也說不定。\n\
    \n「是這樣的……」小谷認真聽著務的描述。等到務說完之後，小谷先是嚴肅地點了點頭，隨即又恢復笑容跟務說：  \n「其實你已經遭遇出解決問題的第一步了，不是嗎？」\
    \  \n「我有嗎？」  \n這可是很重要的一步呢。\n\n「有啊。很多人雖然嘴裡喊著沒錢、沒錢，可是卻毫無行動。但是你不一樣，為了家人，你已經決定要改變了。\
    \  \n你一定要對自己有信心！」  \n「是這樣啊。謝謝你。可是，我沒有想過要投資，而且我也沒有多餘的錢\n\n可以花三十萬請你來當我的理財顧問。」  \n\
    「那不是問題。比起投資什麼的，我認為你需要做的，是把現階段可以想到  \n的風險，全部列出來。」  \n「把風險列出來？」  \n「我想要，你所擔心的事情，只要有了錢，應該都能迎刃而解。你現在只是沒有錢而已。\
    \  \n你可以試著把目前的狀況，具體地寫出來。除了薪水多少、每個月的實際所得要用來支付哪些費用以外，還要包括你  \n的終身所得有多少，以及接下來的。人生活需要多少錢才夠用等\
    \  \n等。只要大概的數字就好，把這些全部列出來。這麼一來，應該就會知道現在自己必須怎麼做了。  \n現在你可能不懂這些做的用意是什麼，不過就當是被騙也好，試試看吧。」\
    \  \n「什麼！一定要做嗎……」  \n「務對小谷的話相當猶豫，很明顯地開始產生動搖了。\n\n而且老實說，他已經後悔剛剛把狀況全告訴了小谷。  \n因為小谷的提議讓他感到無比的不安。\
    \  \n「這對我現在的狀況，好像沒有什麼幫助……」  \n務像是在找藉口似的。  \n「嗯，不過沒關係。請你一定要試試看。  \n只要這麼做，你的問題或許就能解決了。」\
    \  \n小谷的眼神看起來十分堅定，務莫名地就被說服了。  \n「好吧，我知道了，我會盡力去試試看的。」他說。  \n小谷很開心聽到務的決定：  \n「另外，你現在不用付我諮詢費，因為我覺得跟你好像特別有緣。費用就等到日後你真的嘗試投資、賺到錢再說吧。那麽，我們就下個禮拜再見嘍。」\
    \  \n傍晚，告別小谷之後，務搭電車回到家裡附近的車站。他沒有直接回家，而是來到車站旁的咖啡店「SUZUKAGE」。務在家裡沒有自己的房間，如果\n\n\
    要進行小谷給他的功課，還是在家裡以外的地力比較適合。  \n嚐嚐（  \n一推開咖啡店復古的大門，咖啡香迎面撲鼻而來。老闆依舊是一身戴著領結的裝扮。好久沒有來這裡了。\
    \  \n務挑了最裡頭的沙發座位，椅子的布料是胭脂紅色的上等天鵝絨布。一坐下之後，連菜單都沒有打開就直接跟老闆說：「我要一杯藍山。」  \n在父親病倒送進安養中心之前，務最喜歡來這家咖啡店，品嘗藍山精品咖啡。\
    \  \n啡。  \n對於現一個月只有兩萬圓零用的務來說，這裡一杯九百圓（稅外）的咖啡實在是奢侈的享受。不過今天不知道為什麼，就像是想這裡來喝杯咖啡。或許是因為覺得自己接下來要進行什麼特別的事吧。\
    \  \n老闆以法蘭絨濾布全神貫注地為務沖泡咖啡。  \n「這是您的咖啡，請慢用。」眼前的咖啡飄來熟悉的優雅香氣。務的心中\n\n湧起一股莫名的感動。胭脂紅沙發彷彿成了自己舒適的個人空間。受\
    \ 到咖啡香氣的激勵，務在心裡告訴自己：（好，就試試看吧！）\n\n家裡的開支平時都是敬子在處理，詳細的支出務完全不清楚。不過，既然小谷說只要大概的數字就好，那麽就先把目前大致的財務狀況列出來吧。原本只打算隨便寫一寫，結果就這樣一路寫下去，感覺像是\
    \ 在計算他人的支出似的。\n\n看著自己寫出來的列表，務頓時慍眼。\n\n自己雖然年收入有五百萬圓，不過以實際所得來計算，每個月只拿到大約二十五萬圓。其中九萬圓是用來支付每個月安養中心\
    \ 的費用及父親的債務，扣掉之後，一個月實際只有十六萬，再加上敬子打工的五萬，以及一萬圓的兒童津貼，一共是二十二萬圓。一家三口一個月的生活費就全靠這筆錢了。\n\
    \n這筆錢別說是兒子的學費了，就連夫妻兩人以後的 老後生活都不夠用。務從以前就一直擔心的未來，經過這一番計算之下，如今成了確定的事實。\n\n| 收入 |\
    \  | 支出 |  |\n|---|---|---|---|\n| 務的薪水<br>（實際拿到的數字） | 25 萬圓 | 房貸 | 10 萬圓 |\n\
    | 女子的打工費<br>（實際拿到的數字） | 5 萬圓 | 伙食費 | 4 萬圓 |\n| 兒童津貼 | 1 萬圓 | 瓦斯水電費 | 1.5 萬圓 |\n\
    |  |  | 電話費 | 2 萬圓 |\n|  |  | 保險費 | 1 萬圓 |\n|  |  | 衣服、日用品 | 1 萬圓 |\n|  |  | 務的零用金費\
    \ | 2 萬圓 |\n|  |  | 安養中心、<br>父親的債務 | 9 萬圓 |\n|  |  | 交通費及其他 | 1.5 萬圓 |\n| 共計 |\
    \ 31 萬圓 | 共計 | 32 萬圓 |\n\n(這樣的話，辛苦工作、掙命省錢，就完全沒有意義了嗎？) 憤怒、沮喪、擔憂，所有情緒同時湧上心頭。當下的一瞬間，原本喝咖啡的餘裕，也瞬間轉變為極大的罪惡感。務感覺自己緊張到連表情都變僵硬了。(不夠，錢根本完全不夠。\
    \ 這根本就是不要節省的問題了。) 雖然每個月都過得很辛苦，不過一直以來都以為這樣的日子總有一天會結束。或者應該是說想要這麼相信吧。不知為什麼，就是覺得只要現努力一點，將來老了之後就能過平靜的生活。\
    \ 不過現他知道了。 經過試算之後，很明顯的未來最少也需要超過三千萬圓，自己根本完全沒 有這筆錢。 務苦惱地抱著頭。 這時候，他忽然想起小谷當初說的話。\n\
    \n## 店\n\n「把數字列出來之後，應該就會知道現在自己必須怎麼做了一」務似乎明白了。雖然知道答案，可是卻不想面對。看來得再去拜訪小谷了。他心想。決定之後，務一口氣喝完杯子裡已經冷掉、走味的咖啡，沉重地步出咖啡店。\n\
    \n## 就算害怕，也要把目前的財務狀況具體列出來 一一檢視\n\n「請問你現在的薪水和收入，都用在哪些地方？」來找我尋求諮商的人當中，很多人聽到這個問題就開始緊張。有人會急忙解釋：「平常都是我太太在管錢的。」有人則是開始為自己找藉口：「呃，老實說我沒有記帳的習慣，因為實在太忙了……」雖然每個人的說法不同，不過緊張其實是另有原因。說白了，就是因為害怕。沒錯，就是「出於恐懼的心理」。不論是沒來由地對金錢沒有安全感，或是為錢所困的人，面對這個問題，大家都會害怕。為什麼會這樣呢？其實這是因為「害怕看清楚現狀」。\
    \ 我大學念的是東京六大學之一，一畢業就進入建材材料製造公司工作。該\n\n公司為業界首屈，所以我以為自己接下來的人生將會一帆風順。只是沒想到，這種幻想沒有多久就破滅了。當時我負責業務的工作，白天四處奔走拜訪客戶，回到公司之後還要處理一大堆行政工作，期間還不絕的電話要應付。簡單來說就是血汗企業底下的奴隸。工作得這麼辛苦，年收入卻只有大約三百萬圓。就算後來轉換跑道，年入也不過只有三百五十萬圓左右。當然，以同世代的人來說，這樣的收入還算達到平均水準。但是，對結婚生子的生涯規劃而言，根本完全不夠。就算加薪也是有限，於是我告訴自己，再這樣工作下去恐怕沒有未來。只不過，雖然明白這一點，我卻遲遲無法踏出改變的第一步。因為我害怕。我的個性原本就十分膽小。別說是改變了，我比故事裡的務更逃避面對現實，繼續待在公司裡，讓自\n"
