    # I

    我的存在價值


    （我是從什麼時候變成這樣的呢……）

    務坐在公園的椅子上，大口咬著百圓麵包，腦袋不停想著這個問題。他總是杜在午休時來到這個公園。務的公司位於東京都丸之内區，附近一兩千圓的午餐價位，他根本負擔不起，所以每天都是自己一個人買了麵包，到公司旁邊的這個公園來吃。

    「應該是一連串的預料之外造成的吧……」

    他喃喃說道。

    務今年即將滿四十歲，是個平凡的上班族，任職於汽車銷售公司的人事部。家裡有太太和一個兒子，三個人一起住在一棟坪數不大、離市中心有段距離的住宅區內的中古透天房，生活樸實節儉。

    太太敬子是大學時期的學妹，兩人在務二十七歲、敬子二十五歲時結了婚。婚後一直無法順利懷孕，所以後來懷了讓的時侯，兩人激動得喜極而泣。'
  - '[PAGE 16]


    務口中的「預料之外」，就是從那個時候開始的。兒子讓三歲的時候，開始出現極度暴躁、亂發脾氣的現象。經過醫生診斷，確定為發展障礙。考量到兒子的狀況，敬子決定辭去正職的工作，改做打工，每天忙著照顧遲緩兒，從早到晚工作家事兩頭燒。這使得原本個性溫柔的她，開始對從不幫助家事和照顧孩子的務心生不滿。讓念小學的時候，務的父親因為腦中風造成大腦受損，引發失智症。七十幾歲的父親平時自己一個人住在遠方，生病之後，務當然不可能將行動不便又罹患失智症的父親接到市來和自己同住，只好讓他住進安養中心。過去從事木工的父親，退休後沒有厚生年金可領，僅靠著微薄的年金根本不夠生活。非但如此，住進安養中心之後，務才發現父親過去因為賭博欠了不少錢。如今這些債務全部落到了家中獨子—務的肩上，導致他的生活頓時陷入困境。務雖然很希望敬子可以恢復正職的工作，但是基於讓也需要有人照顧，所以他也不敢奢望。'
  - '[PAGE 17]


    從那時候開始，敬子不時抱怨希望務也多少幫忙一點家裡的事。但是務認為自己已經每天拚命辛苦賺錢養家了，也忍受花用全靠向敬子拿零用錢的做法，因此完全不理會她的抱怨，對家裡的事依舊不想過問，也不想幫忙。這使得夫妻倆的關係瞬間降至冰點。

    務的年收入大約有五百萬圓，在都會區屬於一般水準。敬子打工的工作一年大概有六十萬日圓，全部用來支付安養中心費用還不夠。

    兩人每天都在為了家計想辦法籌措安排，勉強度日，完全無法為將來做何儲蓄。

    這樣的生活持續了好幾年，讓今年也滿十歲了。

    在重新接受發展障礙的診斷之後，學校替讓安排了一位專門協助發展障礙學童的人員。然而儘管如此，讓的狀況卻愈來愈嚴重，經常上課到一半突然跑出教室，或是一焦躁起來便無法控制自己。他在班上也開始受到同學的嘲笑和捉弄，完全交不到朋友。

    不過另一方面，讓在美勞課卻表現得十分專注且亮眼，獲得不少肯定和獎'
  - '[PAGE 18]


    項。有時候看著擺在客廳那些厲害的美勞作品，程度明顯優於一般孩童，連務都不由得感到佩服。 就連學校的老師也跟他們說「一定要讓他充分發揮能力」，只是無奈家裡的狀況根本無法讓他學習才藝或接受特殊教育。
    一想到今後的學費和孩子的將來，務的心情更鬱悶了。 萬一接下來連同身為獨生女的敬子也需要擔起照顧父母的責任，到時候該怎麼辦才好？就連夫妻倆自已的老後，他也不認為可以存到足夠的錢生活。
    想不到任何辦法突破困境的務，只能每天煩惱到幾乎快崩潰。 有一天，對家具設計有興趣的讓，在電視上看到知名瑞士建築師事務所「Atelier Oi」要在日本舉辦個展，於是叼著要去看，敬子只好帶他來到六本木。
    讓參觀完個展之後完全迷上建築、空間和產品設計，回到家後不時叼著「想去瑞士」。讓的個性一旦想做什麼，就非要達成不可，這也是發展障礙的孩子的特徵之一，算是個優點，同時也是缺點。
    「我們家怎麼可能有那種閒錢！」'
  - '[PAGE 19]


    敬子的壓力愈來愈大，對孩子也愈來愈常生氣。

    這...讓務看了只是心生厭煩。

    因為每次只要敬子生氣罵人或嘆氣，他就覺得她是在責怪他沒有用，錢賺得不夠多。雖然他對自己對待家庭的消極態度也很自責，不過老實說，他一點也不想去想這些，因為這會讓他覺得自己和從小憎恨的父親有幾分相似。

    漸漸地，務開始排斥和溝通，家裡的事更是完全交由敬子去打理。

    自己在這個家已經失去存在的意義。

    「嗟……」

    務嘆了一口氣。

    在這喧囂市中心的公園裡，更讓人備感孤單。

    （工作，結婚，生小孩。

    原本以為這樣的日子雖然平凡，卻可以過得很幸福。

    ）

    「爸爸！我還要玩盪鞦韆。」

    突然耳邊傳來小女孩的聲音，應該才三、四歲吧。'
  - '[PAGE 20]


    「好啊，盪鞦韆嗎？爸爸陪你玩。」

    小女孩可愛得像個童星，身邊的父親看起來比務還要年輕個十歲左右吧，身上的開襟羊毛衫質料不凡，和他乾淨清爽的外表十分搭配。（這平日大午中的，還真稀奇。）

    務出神地看著那對父女。

    過了不久，「我來了」一個身材苗條的漂亮女子抱著嬰兒走向父女，應

    該是他的太太吧。「啊！是媽媽咪！媽媽∼」

    小女孩朝媽媽跑了過去，年輕爸爸一臉幸福地慢慢跟上去。四人開心

    地一同走出公園。（真幸福，就像是没有任何煩惱的幸福家庭。以

    前我也曾幻想過這幅景

    象……）

    看著四人背影，務心中的絕望變得更沉重了。'
  - '[PAGE 21]


    # 抛开「只要守住平凡，幸福就不会瓦解」的幻想


    畢業後盡量找一份可以領固定薪水的\工作，到適婚年紀就結婚、生小\孩。平時除了努力工作，也要盡自己所能協助另一半照顧孩子。

    想很多人都是「對這種平凡卻幸福的生活抱持著幻想而進入\現

    在的公司

    工作」的吧。

    我自己也是其中之一。

    我一畢業就進入建築材料製造公司工作，優優地以為「從此以後人生一\路

    順遂」。然而，我太真了。我成為公司的奴隸，不顧一切地埋首於工作，

    直

    到發覺身心已經瀕臨極限才轉換跑道。還記得當初找到可以放心的工作時，

    我

    彷彿已經看到自己人生努力的終點。

    我在轉換跑道的當時，年收入大約有三百五十萬圓。這對二十六歲的年紀

    來說，生活綽綽有餘。只不過，當時在公司裡有個課長，和故\事中的務年齡相


    ![](img/eb218596ca7d7233a5dc0b8e8579ca6f_21_0.png)'
  - '[PAGE 22]


    當，平均年薪約有六百五十萬圓。這樣的收入絕對不算低，但是他卻跟我說：「薪水全部都拿去養家了，每個月只有三萬圓的零用錢可以勉強度日。真羨慕你還年輕，賺的錢可以自由支配。」「把十幾年的歲月全部耗在這家公司，為的就是將來過著『勉強只有三萬圓的零用錢可以度日』的生活嗎？一想到這裡，我就不得感到憂心。

    「這不是我要的」安定的 人生」「

    我告訴自己。

    在這個年代，不僅薪資停滯不前，遇上不景氣獎金還會被砍掉。近來的企業幾乎都沒有加班費，薪資也不再像過去在年功序列和終身雇用的制度下，會隨著年齡逐年調漲。

    我想當時不只是我，很多人都應該都對這樣的日子充滿不安和抱怨。

    加上隨著年紀愈來愈大，除了小孩的教育費之外，父母的照護問題也逐漸浮上檯面。現在很多人都是家裡都只有一個孩子，因此這個問題將來很有可能都要由孩子一個人獨自來承擔。'
  - '[PAGE 23]


    在這樣的狀況下，不禁讓人也開始擔心起自己的老後，甚至還要擔心少子化導致年金給付減少的問題。如果將這些擔憂攤在陽光下一一檢視，或許很多

    人會寧願假裝這一切都不存在吧。

    假設這樣的生活，就是我們所描繪的「平凡的幸福」和「中上階級」的最後終將來，或許現在就有必要修正自己對於「平凡卻幸福」所抱持的期盼。

    我直到三、四十歲左右，才開始意識到這件事。

    我想各位很多應該都已經有家庭、有小孩了。就算想轉換跑道，卻沒有任何亮眼的工作表現，也沒有一技之長。即便想重新挑戰新嘗試，也沒有任何專業證照。加上還有養家的壓力，更讓人難以定決心降低收入嘗試沒有經驗的領域，或是獨自創業。

    對將來感到不安，卻無法踏出改變的第一步。

    因為無法改變，造成心裡的不安日益高漲。'
  - '[PAGE 24]


    再這樣下去，萬一像故事裡的務一樣遇到預料之外的狀況，該怎麼辦呢？這裡所說的預料之外狀況，指的是像是被解雇，或是公司倒閉領不到薪水，或是父母病倒，或是自己或家人罹患重病等因為突發事件而需要用錢的情況。不過，有一點大家一定要明白。各為到目前為止的人生，同樣是一連串預料之外的結果。正因為如此，擁有餘裕……也就是財富，才會如此重要。'
  - '[PAGE 25]


    # 勇氣與財富的法則


    1

    人生就是一連串的預料之外。

    最終能夠「解決」這一切的，

    只有金錢。'
  - '[PAGE 26]


    # II

    看見藍天


    務是汽車公司子公司的人事部課長。雖說是子公司，卻是日本家喻戶曉的汽車公司，所以當初找到這份工作時，他心想接下來自己的人生肯定可以一路順遂，對將來相當放心。另一方

    他也承認，可以在泡沫經濟破滅後找到大企業的工作，讓他覺得自己簡直就是

    人生勝利組。

