  - '[PAGE 175]


    擴大自己的財富容器、學會賺錢，就跟學騎腳踏車一樣。第一步只要小小的Like前進就行了。就算連一步都不到的滑步，甚至是用爬的，或是抓著扶手都沒有關係。最重要的是，從現在腳下所站的地方向前踏出去，即便只是一毫米也好。'
