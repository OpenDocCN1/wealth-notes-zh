    ### 結果與目標


    從此以後，務隨時都會提醒自己盡量「做出和過去的自己相反的選擇」。早上走不一樣的路到車站，提早一個小時起床出門，搭乘空曠的電車上班，避開過去每天擠電車通勤的時間。或是利用週末，上圖書館找過去一直不懂，卻從來不去瞭解的理財書來讀。

    不知不覺中，他回想起過去那個積極進取的自己，心裡很開心。除此之外，透過專注在「過去沒有做的事情」，他發現自己之前意和家人保持距離，而且還無視於敬子也是個職業婦女，一股腦兒地把家裡所有的事全都丟給她去煩惱。

