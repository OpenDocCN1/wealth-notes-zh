    # 面對問題，採取行動之後，一切都會改變


    務審視自己的內心，發現心靈已然是一片荒蕪。他真心希望可以恢復這片心靈花園過去的美丽，於是開始採取行動。缺乏整理的花園，就算撒下「金錢的種子」，也難以順利生長。種下再多花的種子，也勝不過滿地叢生的雜草，即使是已經萌芽的花，最後也會逐漸枯死。市面上關於理財的書<|message|>比皆是，然而，真正賺錢的方法，其實沒有什麼具體的技巧。有些人希望自己可以中樂透，抱著幾乎不可能實現的夢想，荒廢了自己內心的花園。採取行動，靠自己改變人生。一開始或許很難。但是，如果希望人生過著不必為錢煩惱的富裕生活，現在就必須鼓起小小'
  - '[PAGE 143]


    的勇氣，踏出小小的第一步。各位是不是也有這種經驗？雖然在做之前心裡很害怕，不過付諸行動之後卻發現，其實並沒有多可怕。舉例來說，大家小時候第一次自己搭電車，一定都很緊張吧？當自己辦到之後，心裡應該都格外興奮，同時也鬆了一口氣，因為「一切意外地順利」。這個世界比你想像的更安全。

    一直以來我都告訴自己：「我的個性膽小，不過我所擔心的事有99％都不會發生。」

    我跟許多少前來尋求建議的人都會這麼說。這也是我經過多年經驗實際感受到的數據。就以金錢來說，光是出生在日本這一點就已經很幸運了，因為在這個國家，幾乎沒有人會窮到橫死街頭。

    這一點大家一定要先有認知。善用各種制度，絕對可以保證最低限度的生活。只要想到這裡就會知道，踏出第一步採取行動，擺脫「早知道老後退休金一定不夠用」的目前的生活，其實也沒有什麼好害怕的。'
