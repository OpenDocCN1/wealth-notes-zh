    \n「你現在看起來就是一臉『饒了我吧』的表情。」「呃……是喔。」務也跟著笑了起來。不知道為什麼，務感覺不再像以前那麼排斥，或許去聽聽看也無妨。「今天我請客。不對，應該是說這是我的一點心意。今天真的很謝謝你。」老實說，對一個月的零用錢只有兩萬圓的務來說，這一頓飯一口氣花掉八千圓，可以說真是抱著破釜沉舟的決心。但是不知道為何，他覺得自己花錢做了一件很建設性的事。「我才要謝謝你今天的招待。」目代又接着說：「今天和你聊天，讓我想起從進公司到目前為止經歷過的一切。以為念書的時候，以為出社會賺了錢，就能過著快樂的人生。不過剛進公司的時候，由於心態還停在學生時代，每天都被女主管罵到臭頭，至少就因此哭過三次。那時候每到午休時間，我就一個人沮喪地坐在中庭，同時的同事都會來安慰我。當時我很認真在想，是不是乾脆辭職算了。\n\
    \n就在那個時候，其實你曾經主動關心過我。你看到我一臉愁眉苦臉的樣子，要我有事都可以去找你商量。當時在公司裡除了同期的同事以外，我覺得自己一個朋友也沒有。有個人主動這麼關心我，讓我真的很感動。所以，後來每一次面談，我都會很認真地把認為可以改善的問題跟你說。也是因為這樣，所以我今天才會一起跟你吃這頓飯。一聽到投資，可能多少會讓人感到卻步。不過，正因為身兼二職，我才有辦法直到現在還留在公司裡沒有辭職。如果把投資當成一種方法來看待，或許可以從中找到解決的出口也說不定。回家時，務在家里附近的車站下了車，一路散步回家。他邊走邊想，發現心裡除了有說不出的恐懼以外，另一方面卻是抱著一絲的希望。他知道自己在財務上必須有所作為，可是又害怕自己做不到。另一方面懷抱著希望，覺得只要行動前考慮周全，說不定可以找到擺脫困境的方法。\n\
    \n（原本想知道世代轉變的原因是什麼，沒想到竟然是跟錢有關。就算是那種多餘的閒錢，我還不是得先拿去還老爸欠下的債務。~可是他心裡明白，這種生活，光靠自己的薪水和敬子打工的錢，總有一天一定會撐不下去。\n\
    \n## 人生最大的風險就是「毫無作為」\n\n讀到這裡，各位發現了嗎？務已經踏出解決問題的第一步了。\n\n他開始思考「是否有方法可以解決自己的問題？」，根據意識到的問題，展開行動。\n\
    \n即便不知道他人的方法是也是適用於自己，不過至少沒有抱著一概否定的態度，而是試著去接受，瞭解原來也有這種方法。這就是學習的第一步，學習自己過去不懂的方法。\n\
    \n人對於沒有嘗試過，或是有違自己價值觀的方法，通常都會感到排斥和抗拒。\n\n這是很自然的反應。因為大家對於沒有嘗試過的事都會感到害怕。\n\n![](img/eb218596ca7d7233a5dc0b8e8579ca6f_45_0.png)\n\
    \n尤其只要關乎錢，人會變得格外謹慎。因為大家都覺得錢很重要，可以左右一個人的人生。說到關於投資等致富的方法，如果光是口說無憑，當然會讓人半信半疑。然而，很多像務這樣的上班族都沒有意識到的一點是，生活只有一個收入來源，其實存在著非常大的風險。我自己過去就是這樣，後來在二十五歲那年讀了羅勃特．清崎（Robert\
    \ Kiyosaki）的《富爸爸，窮爸爸》，受到非常大的震撼。羅勃特．清崎是金融教育公司「The Rich Dad Company」的創辦人，不斷奔走於世界各地推廣金融教育的重要性。在《富爸爸，窮爸爸》一書當中，他透過自己從兩個教育方式截然不同的「富爸爸」和「窮爸爸」身上所受到的影響，整理出一套獨特的經濟理論。在閱讀這本書的過程中，我突然意識到，萬一自己哪一天病倒了，可能會頓時失去收入來源。這種生活本身，其實存在著相當大的風險。務一聽到投資和理財顧問就心生抗拒，這是因為他之前完全沒有接觸過這\n\
    \n類的事情，會有這樣的反應很正常。事實上，理財顧問也不是完全可靠，因此根據個人觀點不同，最好也不要全然相信。但是如果防衛心過重，只會造成好不容易終於鼓起勇氣行動的人生，又繼續停滯不前。\
    \  \n那麽，如果想透過安全的方法致富，到底該怎麼做呢？答案就是請教會賺錢的人。也就是向成功的人學習經驗。我很喜歡一句話：「聰明的人也會向笨的人學習，笨的人卻不會向聰明的\
    \  \n人學習。」「這是德意志帝國第一任宰相俾斯麥的名言，他甚至還說過「只有笨  \n的人才會從自我經驗中學習」。  \n不論怎麼說，當人生面臨抉擇或困境時，就是抛棄舊有做法的時候。因為正是這些方法，造成了自己今天的痛苦。接下來就是盡其所能地去請教已經實現夢想人生、擁有一切夢想事物的人，向對方學習適合自己改善自我的方法。至於要不要照著對方的方法去實踐，不妨先瞭解之後再做打算。如果聽完\
    \  \n對方的方法之後，覺得「不適合自己」，就繼續尋找其他適合的人。就算一開\n\n始就找到適合自己的方法，也不要輕易地照單全收，可以多聽幾種不同的方法，互相比較、思考。漸漸地就能從中找到自己的方向。近來，在日本有愈來愈多人都有人生導師。所謂人生導師，指的是在工作和人生方面走在自己前方，足以作為「目標」的人。透過經常拜訪、請教，可以使自我目標更清晰，並且獲得提點。各...\
    \ 各位務必要為自己找一位人生導師。向失敗的人學習，就等到成功之後再說吧。在這之前，請務必先聽聽成功者的經驗。\n\n## 勇氣與財富的法則\n\n3\n\n\
    只看見失敗的人，  \n即便有機會也遲遲沒有行動，  \n人生永遠不會改變。  \n唯有改變舊有的做法，  \n向真正的成功者學習，  \n才能辦法走出一條路。\n\
    \n## IV 人生的風險\n\n（哇！住這麽高級的高層公寓大廈呀！）距離上次一起用餐兩週後的週日。義務照著 BST 所給他的地址，來拜訪所謂的理財顧問。眼前的公寓大廈讓他不由得驚呼。據說，對方就是在裡頭住戶專用的咖啡廳和大廳會客室裡，替人提供諮詢服務。\n\
    \n這棟頂級公寓位於市中心，樓高有三十六層。和務的人生是截然不同的兩個世界。（感覺好像會是個暴發戶之類的人……）務的腦中頓時浮現「Hills 族」（譯註：指六本木一帶的上班族，或是居住在這裡的人）一詞，心裡閃過一絲不安。「去聽聽就好，絕對不能被騙。」他告訴自己。重新整理一下心情之後，鼓起勇氣按下對講機。「哪位？」\n\
    \n「那個……我是鈴木。」  \n「請進。」  \n大門打開了，務被帶到大廳等候。  \n「你好，請問是鈴木先生嗎？」  \n過了一會兒，有個人走了過來。\
    \  \n務緊握對方的手。  \n「我是。噗？你不是那個……」  \n眼前這位一身休閒打扮、長相清爽的年輕人，正是務前陣子午休時在公園裡見到的那個年輕爸爸。\
    \  \n「原來是你呀！你竟然是目代的事？」  \n「竟然有這麼巧的事。」  \n這麼一想，這棟公寓大廈距離公園的確很近。務當初就是為了不讓公司的人看見，才會特地走到和公司有段距離的高級住宅區的公園裡用餐。男子既然\n\
    \n住在這裡，會帶孩子去那個公園玩也很正常。「你好，我叫做小谷。」男子向務自我介紹。在小谷的邀請下，務進到這棟奢華公寓大廈的住戶專用咖啡廳，坐在高級的沙發上。咖啡廳有著挑高的天花板，宛若五星飯店的酒吧。務突然覺得自己和這裡格格不入，開始感到坐立不安。「那我們就開始吧。如果不介意的話，是不是可以把你的狀況說給我聽聽呢？」在服務生送上兩杯咖啡之後，小谷直截了當地切入主題。「喔好。」務很自然地就將自己目前的狀況說給小谷知道。換作是以前，他完全無法想像會把自己的遭遇，跟一個和目代一樣比自己年輕好幾歲的晚輩訴說。更別說對方還是自己不信任的投資客和理財顧問了。\n\
    \n倒不是因為談話中得知小谷和自己是同一所大學的學弟，所以才對他卸下心防。而是，不曉得是因為小谷散發的氣息，還是因为自己內心對人生的不安，又或者是因為看到小谷幸福的模樣，務總覺得或許可以從他身上找到答案也說不定。\n\
    \n「是這樣的……」小谷認真聽著務的描述。等到務說完之後，小谷先是嚴肅地點了點頭，隨即又恢復笑容跟務說：  \n「其實你已經遭遇出解決問題的第一步了，不是嗎？」\
    \  \n「我有嗎？」  \n這可是很重要的一步呢。\n\n「有啊。很多人雖然嘴裡喊著沒錢、沒錢，可是卻毫無行動。但是你不一樣，為了家人，你已經決定要改變了。\
    \  \n你一定要對自己有信心！」  \n「是這樣啊。謝謝你。可是，我沒有想過要投資，而且我也沒有多餘的錢\n\n可以花三十萬請你來當我的理財顧問。」  \n\
    「那不是問題。比起投資什麼的，我認為你需要做的，是把現階段可以想到  \n的風險，全部列出來。」  \n「把風險列出來？」  \n「我想要，你所擔心的事情，只要有了錢，應該都能迎刃而解。你現在只是沒有錢而已。\
    \  \n你可以試著把目前的狀況，具體地寫出來。除了薪水多少、每個月的實際所得要用來支付哪些費用以外，還要包括你  \n的終身所得有多少，以及接下來的。人生活需要多少錢才夠用等\
    \  \n等。只要大概的數字就好，把這些全部列出來。這麼一來，應該就會知道現在自己必須怎麼做了。  \n現在你可能不懂這些做的用意是什麼，不過就當是被騙也好，試試看吧。」\
    \  \n「什麼！一定要做嗎……」  \n「務對小谷的話相當猶豫，很明顯地開始產生動搖了。\n\n而且老實說，他已經後悔剛剛把狀況全告訴了小谷。  \n因為小谷的提議讓他感到無比的不安。\
    \  \n「這對我現在的狀況，好像沒有什麼幫助……」  \n務像是在找藉口似的。  \n「嗯，不過沒關係。請你一定要試試看。  \n只要這麼做，你的問題或許就能解決了。」\
    \  \n小谷的眼神看起來十分堅定，務莫名地就被說服了。  \n「好吧，我知道了，我會盡力去試試看的。」他說。  \n小谷很開心聽到務的決定：  \n「另外，你現在不用付我諮詢費，因為我覺得跟你好像特別有緣。費用就等到日後你真的嘗試投資、賺到錢再說吧。那麽，我們就下個禮拜再見嘍。」\
