    # 回想自己真正想做的事


    做什麼事會讓你感到真正開心呢？

    假設學會致富的方法、財富來源不絕，你會想用這些錢來做什麼呢？

    很多人聽到這些問題，一時之間都回答不出來。

    有些人會很謙虛地說「不可能會有那種事啦！」，或是「我又沒什麼一技之長」。也有人會感到忿忿不平，覺得「只有少數人可以有了家庭之後還能想做什麼就做什麼」。

    不過另一方面，有些人則是會慢慢回想起以前的興趣，或是想做的事、想實現的夢想。很神奇的是，這些人一日想起來之後，就會彷彿開啟某個開關，滔滔不絕說個不停。

    說了一個會兒之後，最後半多都會這麼說：

    「不過，這都已經是過去的事了。」'
  - '[PAGE 90]


