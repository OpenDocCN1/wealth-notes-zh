    # 勇氣與財富的法則


    認識金錢的美好，把「謝謝」說出口，擴大自己的「財富容器」。即使只有一毫米也好，從現在所站的地方往前踏出第一步吧。'
  - '[PAGE 177]


    # XIII


    # 投資幸福


    「原來是這樣。看來你已經慢慢感受到捐款的快樂，還有收到錢和花錢的喜悅了。我想你的『財富容器』一定變得比以前更大了。」

    隔了一段時間再拜訪小谷，務提到自己的近況。小谷聽完笑著這麼說。接著他又問：

    「你會把錢花在自己身上嗎？」

    「我嗎？沒有欸，我不太會把錢花在自己身上。啊，我最近倒是經常去喝咖啡。現在喝咖啡已經不會有罪惡感了，心情也格外滿足。只是買東西的時候，還是有亂花錢、浪費的感覺。」

    「沒錯，這很正常。不過，如果你想讓你的財富容器變得更大，就要像把錢花在家人和捐款上一樣，把錢花在自己身上，這一點很重要。很多人對花錢都會有罪惡感，不過事實上，把錢花在自己身上，謹慎地使用，在某種意義上來說也是一種投資。」'
  - '[PAGE 178]


    「把錢花在自己身上是一種投資？這是什麼意思？」「用做生意外來解釋你應該就會懂了。如果今天老闆身上穿著破舊的衣服，鞋子也破破爛爛的，你應該不會想跟他買東西吧。你會擔心跟這種人買東西不曉得可靠，對吧？」「嗯，好像是這樣沒錯。」「不過，如果賣同樣的商品，但是另一個老闆戴名錶、一身西裝筆挺，就會讓人想跟他買東西。這就是人的心理。不過事實上，這並不只是單純因為對方一身名牌，所以就覺得他值得信賴。」「什麼意思？」「謹慎地把錢花在自己身上，代表你重視對方，對方也會感受到你的這種心態。相反的，如果一身隨便，賣的卻是昂貴的東西，難免會讓人有種似乎會被騙的感覺。花在自己身上的錢，代表你對自己的從容和重視。而這種感覺會讓對方感到放心。'
