    # 就算害怕，也要把目前的財務狀況具體列出來 一一檢視


    「請問你現在的薪水和收入，都用在哪些地方？」來找我尋求諮商的人當中，很多人聽到這個問題就開始緊張。有人會急忙解釋：「平常都是我太太在管錢的。」有人則是開始為自己找藉口：「呃，老實說我沒有記帳的習慣，因為實在太忙了……」雖然每個人的說法不同，不過緊張其實是另有原因。說白了，就是因為害怕。沒錯，就是「出於恐懼的心理」。不論是沒來由地對金錢沒有安全感，或是為錢所困的人，面對這個問題，大家都會害怕。為什麼會這樣呢？其實這是因為「害怕看清楚現狀」。
    我大學念的是東京六大學之一，一畢業就進入建材材料製造公司工作。該'
