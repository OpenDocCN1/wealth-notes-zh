    盯著球桿袋看了一會兒之後，務點了點頭，似乎是下定了心了。他平靜地將球桿的資料登錄上網。幾天之後，球桿以大約五萬圓的價格賣出。務親自將球桿交給宅配業者。又過了幾天，買家傳來收到球桿的訊息。


    上頭是這麼寫的：


    「非常感謝您將這別具意義的球桿賣給我們。我們有一個兒子，今年十三歲，我們決定栽培他打高爾夫球。雖然希望他能成為一名職業選手，不過其實家裡沒有錢幫他買新球桿，所以才會找二手的。」


    當他在網路上看到您的球桿時，興奮得直說：『我要這支！這可是很珍貴的球桿耶！』更別說他收到球桿時有多開心了。我們會好好愛惜這支您寶貴的球桿的。衷心感謝您的出讓。」


    現在網路拍賣網站的交易都是採匿名的方式，彼此不會知道對方的名字和地址，自然也不會瞭解對方的狀況。可是從這段訊息裡，務看了滿滿的感謝。自己長年收藏在櫥櫃裡沒有用到的球桿，竟然成了一名少年邁向光明未來的車票。以車票換到感謝和金錢的務，一想到這裡就很開心，一股暖流湧上心頭。


