    ## 拿出改善生活、實現夢想的勇氣


    各位當初為什麼選擇現在的工作？

    「因為這是我一直想做的工作。」

    「因為來參加面試，然後被錄取了。」

    每個人決定工作的理由或許不同，但是背後一定都有某種選擇。就連「沒得選擇」的人，也一定有些標準，包括根據自己的個性挑選工作，例如「只要不是勞力方面的工作就好」、「我不適合行政方面的工作」。或者像是「最好是知名的大企業」、「就算只是沾到一點邊，最好是跟自己想做的事情有關的工作」等。

    如果想增加收入、改變人生，建議這時候可以針對自己的個性進行瞭解，也就是面試工作時會做的性格分析。這時候的性格分析，最重要的不是知道「自己適合什麼工作」，而是要把重點擺在「如何賺到需要的錢，讓自己可以」


    做開心的事。另一個重點是，不要去想「事到如今……」，而是思考「從現在開始……」。根據自己的個性和資質，認真思考「從現在開始要用什麼方法」賺到錢，支持自己做想做的事，過幸福的人生，直到離開人世為止。我自己過去也一直深陷在「事到如今，我要怎麼做才能改變人生？」的煩惱中，所以我很清楚「事到如今」的念頭，會讓人一直把焦點放在過去，不斷否定、責怪自己從過去到現在的生活態度，阻礙自己嘗試不同的路。透過自身的體會，以及多年來的諮商經驗，我可以肯定一件事就是，人生永遠不可能回到原點重新開始，只有「從當下這一刻做出選擇」，才有辦法改變人生。正因為如此，所以我們應該問自己目前的現狀是什麼，和自己討論「從現在開始該怎麼做」，然後採取行動。不是「重來」，而是「從現在開始做出選擇」。從這個角度去思考和行動，過去的經驗就會變成參考，提供你做出正確的選擇。


