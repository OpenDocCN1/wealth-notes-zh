    # # 第 8 版 編輯說明


    修訂一部經典作品，壓力確實很大。關於應該如何修訂，每位批評者或讀者都有意見，包括是否應該不著痕跡地修改作者的原文，假裝作者當時能夠預知未來，讓整本書看起來像是在2000年編寫而不是1948年，其他還包括：編輯錯誤與年份錯誤是否應該保留，或者做註腳，以及其他等等……等等。（我不理會英文作文老師長久以來的抗議，仍然引用馬基最愛使用的「等等……等等」（etc.,
    etc., etc.）因為我喜歡這種好像能夠召喚無限擴張宇宙的感覺）。


    雖然每位讀者都可以有意見，但我相信所有批評者應該都希望在第21世紀，能夠繼續引用這本編寫於第20世紀的技術分析經典作品。


    # ## 維持原文的完整性


    大體上，我採用第5版當作原文。令人訝異地，該版原文在格式與文義方面，幾乎完全不需修訂。這主要是因為原文的格式與內容寫得非常清晰，甚至可以說是「好的可怕」，但這種形容詞似乎有些陳'
  - '[PAGE 22]


    腔濫調了。請注意，該版本是編寫於20世紀中期，而且是處理非常複雜的主題，當時的市場複雜程度可能還不到目前的十分之一，所以「好得可怕」是相當貼切的形容詞。該版本的技術言論與分析沒有必要變動或更新。這些文字的目前適當性，就如同1948年的情況一樣。


    雖然保留作者的原意與文字，但我決定重新安排某些章節的位置。對於那些希望學習如何透過手工方式繪圖的初學者，可以在本書最後的附錄中找到適當章節。另外，有關綜合槓桿倍數（Composite
    Leverage）與敏感指數（Sensitivity Index）的章節也是如此。


    # 明顯的年代問題


    批評者如果不瞭解長期交易成功的關鍵，或許認為討論「1929年發生的事件」或「1946年遠古時代的走勢圖」跟目前的市場毫無關係。這些人可能會指出，AT&T已經不復存在（至少整個結構已經不同了），紐哈芬（New
    Haven）已經下市，很多走勢圖代表的公司早就作古了。這種評論完全忽略走勢圖象徵的意義。股價走勢圖代表的是人們在市場上的行為模式，這些行為很可能明天就會重複發生在某支網路或高科技股票上。更重要者，這種批評不瞭解過去歷史對於目前交易的重要性。關於這點，容我引用傑克·史瓦格（Jack
