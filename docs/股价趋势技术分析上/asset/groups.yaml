    # 股價趨勢技術分析（上冊）


    價格不只是反映眾多正統分析師的價值看法，還包括無數潛在買方與賣方的期待、恐懼、猜測，以及不理性或非理性的情緒，還有他們的需要、智慧與財力。這些因素未必會認同正統分析師對於價值的看法，我們也無法取得這些因素的任何統計數據，但它們整體將會互相結合與加權，最後彙整為單一數據，這也是買、賣雙方（透過其代理或股票經紀人）完成交易的價格。而且，這也視為一實數的結論。


    另外，技術分析者還有一項合理主張。基本分析者考慮的絕大部分統計數據，都屬於歷史資料，已經過時而不再有影響力，因為市場不關心過去，甚至不在意目前！市場永遠向前展望，試圖反映未來的發展；無數投資人各由不同角度與立場觀察未來，他們的估計與猜測，將透過市場機制而整合。總之，市場本身所認定的價格，將涵蓋所有基本分析的資訊，這也是統計分析者研究的對象（再加上基本分析者不知道的內線消息），以及無數其他統等重要或更重要的資訊。


    任何有經驗的玩家，都不能否定一項事實：價格變動具有趨勢，而且該趨勢將繼續發展，直到某些事故改變供需之間的均衡。這類變動通常都可以由市場本身的行為中觀察。圖形上存在一些具有意義的形態或排列、水準或區域，它們可以被解釋，然後評估未來趨勢的可能發展。請注意，這並不是萬無一失的方法，但具有顯著的勝算。透過時間與經驗的證明，這些技術的預測功能，遠超過最精明、資料最完整的統計分析。


    技術分析者甚至可以進一步宣稱，即使不知道股票的名稱，也不會妨礙他解釋股價走勢圖的能力，只要有精確的交易紀錄可供參考，涵蓋期間足夠長而可以做為研究股價行為的背景與根據。換言之，只要有股票的報價代碼，就足以交易獲利，完全不需理會特定股價走勢圖是屬於哪家公司、哪個產業，也不需知道該公司所製造或銷售的產'
  - '[PAGE 53]


    品是什麼，或資本額如何。當然，我們並不建議採用這種做法，但技術分析者如果有足夠的經驗，確實可以做到他所宣稱的。


    現在，如果讀者覺得自己全然不能接受前述說明的技術投資與交易方法，最好把本書合起來，不要繼續閱讀，因為這正是技術分析的精義所在，也是本書後文準備處理的主題。


    # 編者附註：艾略特波浪理論：觀點與評論¹


    我們很高興這個星期能夠參加紐約市場技術分析者協會（Market Technicians Association of New York，簡稱MTANY）的12月份聚會。


    長期訂閱者應該還記得，MTANY是紀念約翰·馬基在1978年獲選為「年度最佳分析師」（Man of the Year）而成立的組織。這次講座的演講者是《艾略特波浪理論家》（The
    Elliott Wave Theorist）投資刊物的發行人羅伯·普烈希特，他根據艾略特（R. N. Elliott）的研究成果而提供股票市場預測……。


    訂閱者的主要興趣，應該是普烈希特對於技術分析本身所做的評論。我們必須記住，艾略特波浪理論實際上只是顯示股票市場價格走勢的概況，不斷地抽絲剝繭，直到我們找到最大型、最根本的型態為止；簡言之，這也就是純粹的技術分析。以下整理普烈希特對於基本分析的定義與觀察：


    +   1. 「首先，讓我說明『技術分析』與『基本分析』資料之間的差異……技術分析資料是由相關市場之行為產生的。」


    +   2. 「基本分析的最大問題，是其指標被抽離到市場本身之外。分析師假定外部事件與市場走勢之間存在因果關係，這是一種幾乎必然錯誤的概念。可是，還有另一種同樣重要而較不'
  - '[PAGE 54]


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_54_0.png)




    顯著的間題，基本分析在歸納出任何市場結論之前，幾乎都必須針對相關的基本面資料本身做預測。換言之，在分析師決定市場將受到什麼影響的結論之前，他必須做兩個步驟的預測。技術分析者只需要採取單一步驟，這讓他們享有顯著的優勢。對於所採用的指標本身，不需要做任何預測，這是技術分析者的最主要優勢。」


    +   3. 「更糟者，基本分析者的第二步驟，往往也是建立在不切實際的基礎上……。基本分析的最常見運用，就是估計當期與未來一年的企業盈餘，然後根據這部分資料提供選股建議……。就這方面的表現來說，情況相當糟，就如同6月4日出版之《拜倫週刊》（Barron）某篇文章所顯示的，道瓊工業指數30支成份股的當期盈餘預測，估計的平均誤差為18%，未來一年盈餘預測的誤差則高達54%。可是，基本分析的最致命環節，是假定正確的盈餘預測，可以有效提升選股與操作績效。根據前述《拜倫週刊》刊載之文章的某份表格顯示，如果購買道瓊工業指數30支成份股之中盈餘預測最好的10支股票，10年的累積獲利為40.5%，但如果購買盈餘預測最差的10支股票，則對應的獲利高達142.5%。」


