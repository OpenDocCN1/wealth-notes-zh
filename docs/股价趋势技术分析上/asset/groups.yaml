    # 支撐失敗的意義


    可是，小型波浪構成的正常型態，遲早會中斷。這類的中斷現象，可能以兩種形式出現（雖然細節變化有無數多種）。第一，行情噴出不成比例的漲勢，漲幅遠大於先前的上升波。對於這類發展，價格很少再折返先前的支撐，比較可能發展為某種區域型態（連續或反轉型態）。


    另一種中斷形式，價格折返並沒有停止於前一個小型趨勢循環的'
  - '[PAGE 334]


    頭部，而是穿越該區域，甚至到達前一個小型趨勢的底部。這種走勢已經「跌破支撐」，代表趨勢變動的警訊，尤其是跌破支撐當時或隨後的成交量有放大傾向。請注意，我們說趨勢變動而不是反轉，因為跌破小型支撐可能代表暫時的橫向整理。當然，這也可能預示即將發生趨勢反轉。兩者都代表變化。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_334_0.png)


