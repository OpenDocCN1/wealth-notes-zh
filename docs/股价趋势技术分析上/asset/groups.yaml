    避免發生混淆，方便稽核相關紀錄，自動化投資組合管理，投資組合自動根據市價結算價值（這點可能最重要）。根據市價進行結算，這是評估投資組合採用的標準方法；換言之，不論部位是否結束，都根據當時的市場價格結算投資組合價值。


    # 根\u6442市價進行結算


    這本書的書名或許可以稱為《技術分析藝術禪理》，雖然聽起來似乎有些陳腔濫調，但確實傳遞了射箭藝術的禪理，強調現實與目前時刻的重要性。在《華爾街一般語義學》（The
    General Semantics of Wall Street，現在改名為《華爾街心理戰》，Winning the Mental Game on Wall
    Street）一書中，約翰·馬基相當嚴厲地批評投資人的腦海裡，經常保留兩種帳冊，一種專門記錄獲利，不論已經或尚未實現的獲利在內，一種專門記錄虧損，但只記錄已經實現的虧損。換言之，在該筆交易還沒有結束之前，尚未實現的虧損，都不算真正虧損。電子化投資組合帳戶拒絕玩這種「自欺欺人」的遊戲，所以很值得推薦。當電腦與資料庫或經紀公司連線，投資組合就自動按照市價進行結算，如此就很難假裝虧損沒有發生，投資人會看到交易帳戶的實際狀況，不論是已經實現或尚未實現的盈虧。


    # 分辨粗糠與穀粒


    面對著電子交易與數字導向技術分析的誘惑，眼光銳利的投資人必須知道如何分辨粗糠與穀粒。玩弄著各種玩具，很多自詡為大師的人發表各種見解，還有各種「研究分析」資料，這一切可能取代交易'
  - '[PAGE 436]


    獲利真正應該做的事。事實上，馬基式分析者應該處理的研究，本書基本上都提到了。


    # 粗糙


    聊天室、網路推銷、新聞、預測、解盤、經紀商提供的買進一賣出一持有有強烈持有一小買一大買一或任何其他推薦，都屬於不可取的粗糙。千萬不要忘記，經紀商是透過證券交易賺取收入的；客戶買賣股票，證券商才有收入。事實上，經紀商的最主要客戶是法人機構，經紀商經常幫這些法人客戶銷售股票，轉賣給一般散戶，收取鉅額的服務費用。這是赤裸裸的利益衝突，問題也在2000年初爆發，很多人遭受鉅額罰款，甚至關入監牢。在柯林頓擔任總統的1990年代大多頭市場，這一切都進行得很平順。可是，一旦進入空頭市場，問題全部爆發了，各種旁門左道的花招全部失靈。（第9版附註：2000年初出現一波嚴厲的空頭市場，任何人只要閱讀edwards—magee.com網站發行的約翰·馬基投資通訊，就知道馬基圖形分析精準判斷這段行情。）


    # 摘要結論2


    回顧整個股票市場發展史，散戶投資人從來沒有這麼多資源可供運用。充分運用這些資源，電腦屬於必要工具。


    只要很少花費（或全然免費）就可以透過網際網路或撥接方式，自動取得交易資料。


    投資人想像得到的各種服務，網路上都提供，由投資組合帳務，'
  - '[PAGE 437]


    乃至於隨身攜帶的交易警訊工具（呼叫器、手持PDA或其他等等）。


    某些隨身攜帶器材，甚至可以提供即時報價資訊，讓一些搞不清楚狀況的投資人，可以「即時」破產。


    我們也可以在網際網路上找到各種分析，由可敬的技術分析（經常太過複雜），乃至於「通靈」。


    網路聊天室可以提供各種即時的推銷或謠言，傳遞各種令人印象深刻的花招。可是，如同我們預期的，對於本書讀者來說，全然無用。


    最重要者，資訊革命與電腦可以提供：


    +   1. 分析者不需從事一些重複性的工作，加速分析程序：資料收集、繪製圖形、投資組合帳務處理、分析與報稅。


    +   2. 讓分析者能夠輕鬆處理投資組合帳務，每天按照市價結算帳戶淨值。如同馬基說的，避免投資人把現金與應計帳務弄混淆。


    +   3. 從事一些過去難以想像的工作。分析的股票數量幾乎完全不受限制。至於如何透過電腦篩選交易對象，請參考第21章「圖形選股策略」。


    +   4. 允許投資人透過ECNs或電子市場進行交易，這些管道沒有實際的交易大廳，也沒有專業交易員玩弄報價。'
