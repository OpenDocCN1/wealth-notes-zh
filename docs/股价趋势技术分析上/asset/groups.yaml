    對於任何特定頭肩排列，究竟如何判斷其為正常的反轉型態，或異常的連續排列呢？這個問題通常不會造成危險，因為它們都屬於逆向的型態（逆著先前的趨勢方向）。換言之，頭肩底連續型態會發生在上升趨勢，頭肩頂連續型態會發生在下降趨勢。當這些價格排列的'
