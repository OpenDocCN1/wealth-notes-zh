    # 股價趨勢技術分析（上冊）


    跌到 4 或 3 1/2，雖然損失高達 30%，但投資人或許不會很緊張，因為「股價點數」損失很少，他相信股價還是很容易回到 6 或 7；所以，投資人願意等待。


    關於跌幅距離的準則，還有一點需要考慮。繼續引用先前討論的 PDQ 例子，如果股價由 20 反彈到 24 之後，價格一路跌到 12，不只在 20 買進的投資人覺得氣憤而希望解套出場，在
    12 買進的人也希望在 20 獲利了結（66 2/3% 利潤）。然而，在 18 買進的投資人，還不會急著想在 20 賣出。


    評估底部壓力動道的第三個準則，是考慮該底部發生之後的時間長度，以及這段期間內的整體市況。舉例來說，如果行情由堅實的主要底部回升，當既有漲勢遭遇 4、5 年前主要空頭市場趨勢的中期底部，此處的壓力應該不會太大。在某種程度內，這種說法確實有道理。發生在
    1、2 年前的底部，其壓力應該大於 4、5 年前的底部，但我們也不能全然忽略後者的潛在威脅。事實上，某些發生在很久之前的底部，也可能構成嚴重壓力，如果它們從來沒有被「測試」，而且股票發行公司資本結構也沒有變動而模糊投資人的持股成本。後者是指公司進行股票分割或分派大量股票股利，甚至是發放大額的現金股利。當然，我們不是說股票分割或發放股利之後，投資人就會忘記當初的持股成本，但他們的「怨恨」（以及解套慾望）多少還是會緩和一些人。


    可是，如果壓力區曾經被「測試」（換言之，價格曾經回升，試圖攻擊，但無功而返），這會釋放一部份壓力。過去發生的攻勢，會驅散上檔的某些壓力。因此，第二波攻勢在此需要消化的籌碼比較少。同樣地，我们也可以透過成交量圖形，估計被消耗的買壓。無論如何，如果第三波攻勢再來過壓力區，成功貫穿的勝算總是較大一些。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_329_0.png)


    關於如何評估特定價位的壓力動道，我們提出三個準則：成交量、距離遠近與時間長短。顯然地，運用這些準則時，需要仰賴相當程度的個人判斷。這是無可奈何的，我們無法提出任何精確的公式。


    可是，這個問題畢竟不複雜。一般性判斷原則很單純，也很容易瞭解。觀察過去的股價走勢圖，在先前的下降趨勢發展過程，尋找某些底部，這些底部在隨後的漲勢過程可能形成壓力。我們需要估計這些地方的可能供給籌碼，評估有多少股票曾經在這裡買進，有多少股票希望在此解套。


    做前述評估時，最大風險是低估可能存在的壓力。絕對不該出現這種傾向，寧可高估潛在賣壓。各位本身可能持著多頭看法，因此認為：「上檔套牢的人應該知道目前的情況已經不同了，他們不該急著賣出。」這種想法絕對靠不住。這些人已套牢很長一段時間，他們即使對於大盤看法相對樂觀，但對於所持有的股票可能很失望，一且有機會，還是可能換股操作。（一般美國投資人都存在「拒絕認賠」的頑固心理，甚至不願及時認賠而換股操作。）


    前文有關如何估計壓力潛在動道的說明，當然也適用於相反方向的情況：如何估計支撐區的潛在動道。原理完全相同，雖然根本理由更難掌握。


    ## 判定支撐與壓力的位置


    接下來準備處理另一個問題：如何在每天的圖形分析過程，儘可能精確判定支撐／壓力區間；很多情況下，甚至是由特定價位來代表支撐／壓力的核心。先前的說明範例，我們都採用整數價位，但實際交易很少發生這類價位，即使是
    V 形反轉之類缺乏型態的底部，其幾天的價格波動，也可能出現 2 點或 4 點的區間；底部的最低點可能發生單日反轉，或出現 2、3 天的向下突兀走勢，價格遠低於排列內其他線形。這種情況下，雖然沒有嚴格的公式可供運用，但觀察價、量之間的關係，還是很容易估計買壓的可能位置。尤其是觀察底部密集交易區的收盤價，想像其平均值；平均值可能很接近壓力區的「重心」。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_331_0.png)


    圖 138. 這份月線圖最顯著的壓力是 1936 年 3 個月期密集整理區的下限（26 稍下方），這構成 1939 年、1940 年與 1941 年，甚至於
    1944 年的上檔壓力。另外，請注意 1936～37 的大成交量頭部下限（28），該價位在 8 年之後的 1945 年成為重要壓力。


    一旦克服這些壓力之後，股價「一飛沖天」。我們還可以在這份走勢圖看到其他支撐與壓力。請留意 1937～1938 與 1942 年的主要底部。


    當然，價格一旦接近壓力區邊緣，可能就開始遭受賣壓，但愈靠近中心區，賣壓就愈大。某些情況下，如果仔細比較成交量與賣壓潛在分配，還是可以預測漲勢深入賣壓區的精確價位。這需要仰賴經驗，但經驗累積不一定需要支付昂貴代價。然而，多數情況下：我們不需要這類精確的預測，甚至不該嘗試。


    本書提供的每個範例，幾乎都存在某種形式的支撐／壓力；所以，當讀者讀完本章之後，應該回頭觀察先前各章的圖形，深入分析每個走勢圖的支撐／壓力。經過實際練習，才能夠更瞭解本章討論的法則。另外，如果可能的話，請收集重要股票近
    10 年來的月線圖，詳細研究其中的支撐／壓力，這方面的練習絕對有幫助。編者附註：許多網站提供的軟體，可以輕鬆繪製這類圖形，例如：prophet.net 與
    stockcharts.com。練習過程一定會發現，在主要趨勢的連續擺動之間，頭部、底部與密集交易區經常發生在相同價位附近；在這些重要價格區域之間，價格可以迅速上下移動。就這些走勢圖來說，支撐／壓力分析實在沒有必要執著於精確價位。


    我們或許應該暫時停下，考慮一個重要問題：哪種走勢圖最適合用來判斷支撐／壓力位置？就小型的短期趨勢而言，日線圖當然是最適用於這類分析，如果必要的話，日線圖應該涵蓋最近一年以上的資料，藉以判斷中期趨勢關卡。可是，我們認為，如果要瞭解主要與中期趨勢的支撐／壓力，日線圖並不足以提供分析上需要的宏觀架構。分析者經常過份強調最近形成的小型趨勢支撐／壓力，並因此忽略中期趨勢的真正重要區域。為了取得宏觀視野，週線圖比較適合，這些走勢圖應該同時提供價格與成交量資料，並涵蓋過去一整個主要多、空趨勢循環。除此之外，深入研究月線圖也可以提供一些額外效益。


    接著，再回頭討論支撐的問題。先前章節經常提到所謂「正常」（normal）趨勢。「正常」也就是「理想狀態」或「最具代表性」的意思。正如同許多所謂正常的事物一樣，正常趨勢只不過是實際發展的「平均」型態。雖說如此，但對於股價走勢來說，這些正常或「平均」的發展，確實常常可以見到。上升趨勢是由一系列上下起伏的齒圈狀循環走勢構成，每個循環的上升波，將帶動價格創新高，次個循環的下降波，則把價格拉回到前一個循環上升波的高點附近。讓我們用實際數據來說明：價格上漲到
    10，退回到 6，上升到 15，退回到 10，上升到 20，退回到 15，上升到 26，退回到 20，依此類推。這種走勢也就是技術分析者所謂的「自行修正」（self-correction），一種健全而應該繼續發展的走勢。其實，這只不過說明一種現象：每個順勢的上升波，其折返將回到最近小型趨勢提供的支撐。對於我們觀察的股票，如果出現這種發展型態，正常折返支撐將代表理想的買進機會。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_333_0.png)


    圖 139. 這份月線圖標示主要的支撐／壓力，請注意其角色互換。


    ## 支撐失敗的意義


    可是，小型波浪構成的正常型態，遲早會中斷。這類的中斷現象，可能以兩種形式出現（雖然細節變化有無數多種）。第一，行情噴出不成比例的漲勢，漲幅遠大於先前的上升波。對於這類發展，價格很少再折返先前的支撐，比較可能發展為某種區域型態（連續或反轉型態）。


    另一種中斷形式，價格折返並沒有停止於前一個小型趨勢循環的頭部，而是穿越該區域，甚至到達前一個小型趨勢的底部。這種走勢已經「跌破支撐」，代表趨勢變動的警訊，尤其是跌破支撐當時或隨後的成交量有放大傾向。請注意，我們說趨勢變動而不是反轉，因為跌破小型支撐可能代表暫時的橫向整理。當然，這也可能預示即將發生趨勢反轉。兩者都代表變化。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_334_0.png)


    圖 140. 1946 年，迴線圖顯示的下降三角形向下突破，跌勢可能在 37 附近獲得支撐（至少暫時可以獲得支撐），這是 4 月份長達 4 個星期的密集交易區，下檔次一個支撐在
    35～36 附近，這是 2 月份的頭部區域。如果跌勢不能在 35～36 獲得支撐，主要上升趨勢可能發生變化（請參考下一頁）。另外，隨後的漲勢將在 40 1/2
    遭受壓力。


    舉例來說，我們先前談到的頭肩頂排列，其「頭部」完成之後，下降過程跌破小型趨勢的支撐，因為價格穿越「左肩」峰位，這是整個排列可能發生反轉的第一個警訊。


    所以，即使只是跌破最近的小型支撐，在圖形分析上也具有技術意義。跌破小型支撐，永遠應該被視為是中期趨勢發生反轉的第一個步驟。（如果這一切只是發展為連續排列，隨後還是有機會重新進場建立多頭部位。）依此推論，跌破中期支撐，則是主要趨勢反轉的第一個警訊。我們相信，這個原理沒有必要進一步強調。關於交易實務上的戰術運用，則屬於本書第
    II 篇的討論範圍；另外，支撐／壓力特別適用於設定停損點，這也將在後文討論。


    ## 常見誤解


    前文有關跌破支撐的概念，當然也適用於壓力貫穿。結束這方面討論之前，還有一點值得特別強調。如果各位經常在券商那裡看盤，可能發現一般散戶對於支撐／壓力的解釋不同於本章看法。舉例來說，某股票上漲到
    62，折返到 57，再推升到 68。這種情況下，很多人認為 57 是最近的支撐，因為這是前一波跌勢獲得支撐而向上反轉的價位。可是，最近的支撐應該是 62 附近。這是很重要的觀念差異，實際交易結果也經常因此大不相同。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_336_0.png)


    圖 141. 這是一支交投相對冷清的股票，經常發生沒有技術意義的小缺口，但 1945 年 10 月 8 日的大缺口配合著巨量，非常值得重視。這個缺口看起來像是逃逸缺口，上檔衡量目標價位為
    26 1/2。可是，隨後的漲勢停頓於 24 1/2，然後形成 3 個月期間的矩形排列。1946 年 1 月 10 日，價格向上突破，完成矩形排列（以及 10
    月份逃逸缺口）的衡量目標，然後價格折返。後續發展請參考圖 142。


    不可否認地，我們很難把先前的頭部，想像成為隨後的底部，反之亦然；表面上看起來，頭部與頭部，或底部與底部之間，它們比較具有邏輯上的關連性。另外，就前一段的例子來說，某些投資人可能先前準備在
    57 買進而沒有成功，結果股價直接上漲到 68，這些買單可能繼續設定在 57，或當股價回檔到該價位，這些買單可能重新遞入。雖說如此，但情況沒有什麼理由非如此發展不可；價位
    57 沒有「既定利害關係」會「自動」引發新的買盤。反之，根據本章稍早的說明，先前底部將存在既定利害關係結構，並產生實壓（壓力），造成新的頭部；先前頭部則產生實盤（支撐）、造成新的底部。


    這個觀念很重要。深入分析股價走勢圖，不難發現上升趨勢相對容易穿越先前的峰位，但比較不容易克服先前的大量底部。（對於下降走勢來說，情況當然相反。）先前高點的實壓不大，通常只足以造成漲勢的暫時停頓，而不像先前底部一樣構成顯著壓力，迫使價格大幅折返或陷入長期橫向整理。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_337_0.png)


    圖 142。圖 141 顯示的 2 月份折返走勢在 24 暫時獲得支撐；價格反彈恰好足以封閉 2 月 7 日的缺口，但隨後跌勢穿越短形排列上限的支撐，這是很重要的技術性警訊。接著，走勢出現等腰三角形排列，但向上突破的發生位置過於接近三角形頂點，所以漲勢不夠強勁，只能回升到先前高價，接著就發生「收場」走勢（參考本章正文稍後的說明）。8
    月 22 日發生雙重頂訊號之前，我們早就可以預見中期以上的跌勢。


    ## 整數價位


    某些價位即使過去沒有發生「既定利害關係」，也同樣會產生明顯的壓力／支撐。我們需要特別注意某些整數價位，例如：20、30、50、75、100……等。買進股票的時候，我們往往很自然地把獲利目標設定在整數價位。如果某支股票由
    10 上漲，20 通常會發生相當可觀的獲利了結賣壓，尤其是相關整數價位也代表多年來高價的話。事實上，任何股票只要創歷史新高價，上檔就是海闊天空；碰到這種情況，整數價位都代表顯著賣壓。對於一些老牌而交易活絡的股票，整數價位相對上比較不重要，例如：美國鋼鐵（編者附註：IBM
    或奇異電器）。


    ## 重複發生的歷史價位


    重要的支撐／壓力一旦形成，通常會長期發揮作用；在不同的多、空循環過程，我們發現中期趨勢的頭部與底部，經常重複發生在相同價格區間。事實上，許多老牌大型股，都具有很明顯的這類現象。舉例來說，奇異電器在整個
    1920 年代到 1950 年代之間，下列價位經常爆出巨量：22～24、34～35、40～42 與 48～50；因此，中期趨勢反轉也經常發生在這些區域。同樣，南太平洋（Southern
    Pacific）在下列價位也有明確支撐／壓力：21～22、28～30、38～40 與 55～56。美國鋼鐵的重要反轉也經常發生在 42～45、55～58、69～72、78～80
    與 93～96 等區間。第 9 版附註：某些個股或許已經不存在，但相關原理仍然有效。


    可是，經過長期發展，這些支撐／壓力將發生調整，區間逐漸擴大而變得模糊，然後產生新的關卡價位。空頭市場發生的恐慌性跌勢，經常為後續發展創造新的壓力區。這類跌勢完全「不尊重」先前任何支撐。（當我們討論道氏理論的主要擺動時，恐慌性走勢被歸類為空頭市場發展的第二階段。）恐慌性急跌走勢中，所有先前的潛在支撐區似乎都被一筆勾消，直到發生實壓高潮為止。可是，這類實壓高潮不一定發生在先前顯著的支撐區。繼續引用美國鋼鐵的例子，在
    1937 年的恐慌性跌勢中，股價穿越 93～96 區域，在 78～80 稍做停頓，然後又一腳穿越 69～72 與 55～58 等支撐，最後終止於 50。1946
    年的恐慌性走勢，也同樣一舉跌破 78～80 與 69～72 的重要支撐，最後終止於 66。


    如果恐慌性跌勢底部爆發巨量，相關價位將代表顯著的「既定利害關係」，並構成重大壓力而妨害後續漲勢（換言之，空頭行情發展過程，回升漲勢很難穿越稍早的恐慌性跌勢底部）。


    談及恐慌性走勢，很自然引導我們回頭考慮主要趨勢其他階段的支撐與壓力，這也是本章開始的討論內容，此處還要補充幾點。請記住壓力與成交量的關係。當漫長的空頭擺動到達最後低點時，成交量會明顯萎縮，倒數第二個中期趨勢底部，其供給相對偏低，所以新的上升趨勢在此只會發生些微折返。主要跌勢的末期階段，買家大多會向下分批承接，投資人早就有心理準備，預期價格將繼續走低，所以手中籌碼在回升過程不易被洗出來。主要多頭市場初期階段，行情發展非常緩慢，主要原因在於買盤不積極，不在於實壓沈重。


    空頭市場恐慌性跌勢結束，回升走勢通常都沒有辦法拉高到主要下降趨勢構成的壓力區（這通常是指循環絕對峰位發生之後第一個中期下降趨勢底部），因為在此之前經常會先遭逢前一個多頭市場的壓力區。因此，碰到這類情況時，應該回頭觀察先前循環的走勢。


    另外，在上升走勢遭逢上檔遙遠壓力區之前，沒有必然理由必須繼續挺進。沒錯，上升走勢如果沒有遭遇先前下降趨勢底部或密集交易區，確實能夠、也可以繼續挺進，但上檔第一個顯著壓力區如果距離遙遠，在漲勢到達該處之前，可能已經耗盡力氣。基於種種理由，龐大籌碼可能在價格到達壓力區之前就湧出。所以，不妨把遠距離的壓力區，視為漲勢上檔的極限，不應該視為某種目標。可是，如果考慮買進兩支股票，假定其他條件都相同，當然應該挑選上檔壓力較輕、距離較遠的對象。


    ## 型態壓力


    現在，我們可以回頭考慮先前談論的反轉與整理型態，觀察其中一些現象。舉例來說，我們現在很容易理解折返走勢為何會填補先前的跳空缺口。缺口發生當時，代表該價格區間沒有「既定利害關係」。另外，如果缺口即將出現之前曾經發生大量，當折返走勢填補缺口之後，走勢經常很快發生轉折。突破缺口就經常發生這類情況。


    因此，對於任何缺口，只要隨後發生折返走勢，如果缺口距離不遠，而且中間不存在折返走勢的阻力，缺口很容易就被填補。就逃逸缺口來說，一旦被填補之後，折返走勢沒有什麼理由應該停頓，走勢可能繼續穿越缺口之前的「小量」線形。


    頭肩排列或其他區域型態，突破之後的折返走勢也充分反映支撐/壓力原理。舉例來說，下降三角形突破之後，原本扮演支撐功能的水平下限，將轉換為壓力區。隨後折返走勢向上拉高時，很可能在三角形下限附近遭逢壓力而難以穿越。同理，頭肩頂頸線在突破之前為支撐，突破之後將轉換後續走勢的壓力。價格有效向上突破矩形排列之後，原本扮演壓力角色的上限，將轉變為後續走勢的下檔支撐。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_341_0.png)


    圖 143. 第 6 章曾經說明頭肩排列突破之後的折返現象，本章也就支撐／壓力觀念重新討論這點（參考正文）。大部分情況下，頭肩排列頸線突破之後，都會產生折返走勢。很多頭肩排列會出現兩次折返，一次發生在頸線突破之後幾天內，通常都是在價格還沒有正式展開重大走勢之前，另一次是發生在幾個星期之後，通常是在價格完成頭肩排列衡量目標之後。就目前這份圖形來說，1946
    年，股價突破頭肩頂之後，曾經發生罕見的 4 次折返，第一次發生在 8 月份突破之後的 2 個星期，10 月份出現另一次折返，第三次發生在 11 月份，最後一次發生在
    1947 年 2 月，後者不只遭遇頸線壓力，而且也遭逢下降趨勢線，這是銜接先前頭肩排列之「頭」與「右肩」的延伸線。


    本章稍早曾經談到先底部壓力勁道的一種評估準則，關於「距離遠近」部分提到：中等價位股票至少應該離開某價位 10% 以上，該價位附近的壓力才會形成。可是，這個法則並不適用於明確區域型態突破之後的立即折返走勢。這類型態一旦發生有效突破，強勁的壓力就已經形成。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_342_0.png)


    圖 144. 這是 1945 年的日線圖，顯示幾個等腰三角形支撐的例子。2 月 5 日，價格突破第一個等腰三角形排列，時間明顯落後（太接近三角形頂點），隨後的整理走勢是以
    1 月中旬的頭部為支撐，比較嚴重的折返走勢發生在 2 月 26 日，價格退回三角形頂點水準。這是關鍵時刻，三角形頂點本身即是重要支撐（壓力），其功能將因時間經過而減弱。目前，整個盤勢可能發展為「收場」走勢，多頭部位應該在三角形頂點下方設定停損（參考第
    27 章）。可是，就目前這個例子來說，價格並沒有跌破支撐，繼續形成另一個「螺旋」，並在 3 月 10 日向上突破。正如同預期的，這個三角形的上限變成隨後走勢的下檔支撐。3
    月中旬到 4 月底之間，形成上升三角形排列，上限成為 6 月份走勢的支撐，但 7 月份跌破支撐。請回頭對照圖 120。

