    # 股價趨勢技術分析(上冊)


    除了「勁道」之外，突破缺口並沒有特殊衡量意義，也沒有其他預測功能。接下來，另一個問題是：我們是否應該預期突破缺口在短期內被填補？或者，把話講白一點：我們是否應該延遲進場，因為重大走勢應該發生在缺口被填補之後？


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_304_0.png)


    為了提供合理答案，我們必須深入觀察缺口發生之前與之後的成交量情況。如果缺口之前發生大量，而缺口之後的成交量相對萎縮，則隨後發生的小型折返，大約有一半機會回到型態邊緣而封閉缺口。反之，如果缺口之後爆出大量，價格夾著大量遠離缺口，則短期內填補缺口的可能性就不大。這種情況下，折返走勢通常只會觸及缺口的外側。


    （關於技術分析的結論，大家都希望採用「必定」、「絕對不會」'
  - '[PAGE 305]


    等毫不妥協的字眼。我們非常能夠理解這種心理。不幸地，我們從來沒見過「毫無例外」的技術法則。技術分析者永遠都要防範意外或例外。這些意外經常來自大盤市況，大盤與個股的技術條件可能彼此衝突。務必要留意大盤指數與個股走勢之間的關係。）


    突破缺口如果發生在盤中，日線圖當然不能顯示當時的成交量情況。若是如此，只有參考盤中走勢圖，或請經紀人提供相關資料。編者附註：現在可以輕易取得這類的資料，請參考本書附錄D。第9版附註：目前很多人使用的陰陽線，允許使用者看到盤中突破缺口。萬一沒有明確的成交量資料可供參考，合理作法是假定該缺口在型態充分發揮功能之前（也就是道氏理論的次級折返走勢），不會被填補。


    # 連續或逃逸缺口


    連續（逃逸）缺口的發生頻率，低於前述兩類缺口，但具有重要的技術意涵，可以大略顯示走勢的可能幅度。基於這個理由，這類缺口也稱為「衡量缺口」（measuring
    gaps）。


    普通缺口與突破缺口都和價格型態有關，前者是發生在排列發展過程內，後者是發生在排列完成的突破過程中。另一方面，逃逸缺口與稍後將討論的竭盡缺口，則和價格型態無直接關係，是發生在直線狀快速漲勢或跌勢中。


    動態性漲勢由承接區發動之後，最初幾天或一個星期內，通常會加速發展，然後因為漲幅過大而引發獲利回吐賣壓，漲勢開始失去動能。就成交量來說，最初突破通常會爆出大量，漲勢中段則稍微縮小，然後再發生巨量而止住漲勢。這類漲勢過程（或對等的跌勢），很可能出現寬大的缺口，代表大成交量的行進間換手完成。這類缺口'
  - '[PAGE 306]


    發生的位置，通常是介於快速走勢發動位置與最後反轉（或整理）位置的中央。所以，連續或逃逸缺口將長可以用來衡量整段走勢的幅度。換言之，缺口發生之後的後續走勢距離，應該等於缺口發生之前的走勢距離，這是就走勢圖上的垂直距離而言。


    衡量缺口發生之後，後續漲勢點數通常會超過算術刻度所衡量的目標，而跌勢點數則通常不及缺口法則所衡量的目標。所以，前逃法則比較適用於半對數刻度的圖形（換言之，垂直距離應該以「價格百分率」來衡量）。如果採用算術刻度的圖形，向上缺口的衡量目標會稍微低估，向下缺口的衡量目標會超為高估。（可是，如果手上持有順勢部位，最好在價格達到理論目標之前獲利了結。）


    由事後角度回顧，逃逸缺口在價格走勢圖上很容易辨識，但投資人的工作，是在缺口發生當時做精確判斷。首先，逃逸缺口絕不可能與型態缺口或突破缺口相互混淆。任何跳空缺口，如果發生在密集交易區（或穿越重要趨勢線，突破支撐／壓力水準）之後的快速漲勢或跌勢過程，就一定昰逃逸缺口，要不然就是竭盡缺口。所以，問題是如何區別逃逸缺口與竭盡缺口。一般來說，根據缺口發生之後的價量關係，應該可以做成合理的判斷。'
  - '[PAGE 307]


    # 第12章 跳空缺口


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_307_0.png)


    圖126. 這份1946年早的日線圖，包含很多有趣的技术現象。1945年12月，股價由19上漲到25，然後進行9個星期的矩形整理（上圖顯示相關排列的末期階段）。2月11日，股價透過典型的突破缺口，向上穿越矩形排列。4天之後，出現另一個成交量更大的跳空缺口，當天幾乎是以最高價收盤。這看起來向是逃逸缺口；若是如此，根據衡量法則估計，上檔目標價位應該在32。（請注意，矩形排列的衡量目標在31。）可是，隔天出現單日反轉，高價在31，收盤價為30；然後，次一天走勢封閉2月15日的跳空缺口，所以這個缺口必須重新定義為竭盡缺口。隨後，價格下跌到9個星期矩形排列的支撐區，並沿著中期上升趨勢線緩慢攀升。4月24日，價格跌破趨勢線，再度拉回到矩形支撐區25。5月份，展開另一波漲勢，價格上攻到30附近，但遭遇先前趨勢線延伸的壓力。這是最後一波向上嘗試；7月底，當價格跌破兩個峰位所夾的「谷底」25，完成主要雙重頂排列。


