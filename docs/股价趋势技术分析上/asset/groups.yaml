    # 芝加哥期貨交易所

    道瓊指數期貨的投資與避險策略


    期貨契約是同意在未來某日期，買進或賣出特定商品的契約。舉例來說，如果做多玉米期貨，除非在結算日之前賣掉期貨契約，否則就必須在未來某日期、接受玉米交割。反之，如果放空期貨的話，除非回補（沖銷）該部位，否則將來某日期必須交割玉米。就此處討論的主題來說，所謂的「商品」，是指道瓊工業指數成分股。所有的期貨契約，都規定相關交易必須終止的日期，也就是「結算日」（settlement
    date），並說明結算的交易方式，也就是「交割」（delivery）。道瓊工業指數期貨契約的價格，基本上完全反映其成分股的價格。


    期貨價值等於指數價格乘以 $10。舉例來說，如果期貨指數價格為 10000，契約價值為 $10\times 10000=$100,000。所以，這種契約的買賣雙方，其交易代表的股票價值大約是
    $100,000。實際價值可能稍高或稍低，可能造成影響的因素有幾項，包括下文將討論的持有成本。


    # 期貨契約結算


    所有的期貨契約都必須結算。某些期貨是透過「交割」方式進行結算。這也是我們經常聽說的夢魘：一早醒來，發現院子裡堆滿 5000 蒲式耳黃豆。道瓊指數期貨是採用現金結算（交割）。空方沒有必要實際運送一大堆道瓊工業指數成分股，倒在多方的家門口。換言之，在契約結算日，結算價格等於
    $10 乘以所謂的「特別開盤價」（Special Opening Quotation），後者是在道瓊指數期貨最後交易日隔天，根據成分股開盤價而計算出來的數值。這項數值將與契約建立當時的價格做比較。舉例來說，如果道瓊期貨到期水準為
    10000，當初買進的指數水準為 9000，則多方將取得 $10,000($10\times 1000)，空方支'
