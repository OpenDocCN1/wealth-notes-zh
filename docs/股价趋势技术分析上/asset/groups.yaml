    號」對於交易者的影響很明顯，隔天的成交量擴增為65萬股，價格再跳升一整點。


    隨後12個月的走勢，沒有必要特別說明，因為這對於道氏理論的解釋，不構成任何問題。7月中旬之後，價格出現9個星期的不規則起伏跌勢，但淨跌幅很有限。接著，除了短暫的停頓之外，工業指數在1945年月29日上漲到169.08，鐵路指數在1945年6月26日攀升至63.06。我們將簡略說明隨後的發展，這倒不是因為行情演變沒有什麼特別值得研究之處，主要是因為日本投降而結束第二次世界大戰。


