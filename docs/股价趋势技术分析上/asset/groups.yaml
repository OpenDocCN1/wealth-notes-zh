    Redmond, WA 98052\nwww.stockcharts.com\n\n# 第 8 版 序\n\n一本編寫於 20 世紀中期的書，到了今天不只還適用，而且還非常重要，確實不尋常。事實上，《股價趨勢技術分析》（中文版第六版，請參考寰宇出版公司）仍然是股票圖形分析方面最權威著作。市面上雖然有很多類似讀物或模仿品，就像海鷗追逐著漁船而想要沾些好處。可是，對於愛德華當初編寫而馬基持續編修到第\
    \ 5 版的這本經典著作，那些新發行的書籍完全沒有擴增我們的知識、開拓我們的視野。\n\n一本書究竟要具備哪些條件，才能成為經典呢？事實上，不只是經典，這是一本適合目前交易使用的手冊。\n\
    \n回答這個問題之前，還需要考慮另一個問題。什麼是圖形排列 (chart formation) ? 根據本書兩位作者的看法，圖形排列是代表人們在各種複雜市況下的不變行為模式。\n\
    \n圖形排列透過單一變數（價格）描述各式各樣的人類行為。價格變數展現的影響因素，涵蓋範圍很廣，包括：恐懼、貪婪、慾望、狡詐、惡意、欺騙、純真、盈餘預估、經紀人需要收入、專業經理人需要績效與工作安全、股票供需、貨幣流動性與資金流量、自我破壞、被動、陷阱、人為操縱、傲慢、炒作、欺瞞、月亮盈缺、太陽黑子、經濟循環與相關信念、大眾情緒、人們想要證明自己正確的無法克制慾望……等。\n\
    \n![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_16_0.png)\n\n# 股價趨勢技術分析 (上冊)\n\n圖形排列是市場傳達訊息的語言，告訴我們某支股票的垂死掙扎，顯示某支股票即將一飛沖天，透露某支股票正在進行生死關鍵的戰爭，預示某支股票的買方已經擊敗賣方，價格即將向上突破。\n\
    \n總之，這是人們從事僅次於血淋淋戰爭的最劇烈掙扎，所遺留下來的指紋。\n\n如同佛洛伊德呈現人類的心理層面一樣，愛德華與馬基關心的是金融市場，呈現的是人類的心靈與情緒。他們不只能夠精準呈現這些現象，而且還提供解釋的方法，能夠從這些人類行為中攫取利益。在人工智慧與電腦科技能夠產生重大突破之前，我們很難想像這方面的知識還能更進一步。\n\
    \n# 既然是經典，爲何要有新版？\n\n不同於法國星象學家諾斯特德拉馬斯（Nostradamus）與法國科幻小說家茱利斯·佛尼（Jules Verne）或很多當代投資顧問，作者沒有水晶球或時光機器。馬基不曉得將來會發明電腦，所以只採用了計算尺。即使知道將來會有電腦，大概也沒有想到其運算能力與普及程度竟然會發展到這種程度。總之，時間經過與科學進步。\n\
    \n非常令人訝異的，本書絕大部分內容完全沒有更新的必要。還有誰能夠更精準描述圖形排列，說明其意義呢？\n\n可是，為了反映科技進步，以及市場結構與性質的變動，則又是另一回事了。人性或許不會改變，但21世紀的市場結構與性質似乎就代表變動。市場的管理法規雖然未必一致，但相關變動基本上是朝好的方向發展，更有利於投資人與商業用途使用者。當然，霸菱銀行與其他某些機構則屬例外。\n\
    \n## 新增內容反映時代、科技與市場變動\n\n大體上說，新增添內容、附註或更新資料，是要讓一般讀者瞭解投資成功的相關必要條件。當然，由於所涉及的資料實在太多，所以我們並不打算提供絕對完整的資訊。這部分努力，只希望讓讀者能夠由適當的立足點看待金融市場；如果各位願意的話，也提供一些資料與指引，讓讀者能夠做進一步研究。事實上，各位詳細閱讀本書正文之後，還可以在本書附錄找到相關的「參考資料」。\n\
    \n各位甚至可以只運用本書提供的知識（還有紙、筆、尺與繪圖紙）而在金融市場獲致成功。\n\n## 科技\n\n為了讓本書能夠當作手冊或指南，因應第21世紀的金融市場，第5版與第7版需要增添一些新內容。顯然地，科技神速進步的事實需要被處理，並且擺在原來的架構上呈現分析方法與內容。為了要在這個強悍的新世界獲得成功，投資人必須瞭解如何運用電子化市場、網際網路、微電腦、無線電傳輸，以及市場提供的任何可想像新奇產品。\n\
    \n進階投資人也應該要瞭解一些金融、投資理論與相關科技的新發展，例如：布萊克-薛里斯選擇權評價模型（Black-Scholes Model）、現代投資組合理論（Modern\
    \ Portfolio Theory）、量化分析（Quantitative Analysis）。很幸運的，我們沒有必要在這裡處理這些議題。\n"
