    付對應金額。


    # # 按照市價進行結算


    可是, 前述的$10,000並不是在契約到期一次支付, 而是按照市價變動每天支付。這些付款每天都由「保證金」扣減。這些保證金並不是交易價款的一部份, 而是「定金」或「履約擔保金」。每天交易結束之後,
    所有未平倉期貨部位都必須根據最新的市場價格結算價值。然後, 依據最新結算價格與前一天結算價格的差價, 某方必須支付給另一方相關金額。


    舉例來說, 由5月17日到5月18日, 道瓊期貨指數由9800上揚到9840。當天結算的時候, 空方必須支付 $400($10×40) , 多方則會取得$400。隔天,
    如果期貨指數下跌10點, 多方必須支付$100給空方。所以, 在期貨契約到期之前, 未平倉部位每天都必須根據最新期貨指數進行結算。


    只要在開盤時段內, 期貨部位隨時可以透過反向交易沖銷既有部位; 多頭部位可以賣掉契約, 空頭部位可以回補契約而結束既有部位。在契約到期日, 所有未平倉部位則根據最後結算價格進行現金結算。


    # # 可取代性


    類似如芝加哥期貨交易所或芝加哥商業交易所等集中市場, 其最大貢獻之一, 就是提供標準化的契約。這包括可取代性(fungibility)的功能在內。不論是玉米、股價指數或任何商品,
    期貨契約的根本資產只要相同, 就可以彼此充分取代。另外, 交易所也指定清算公司取代交易對手的地位, 使得每位交易者的往來對手都是清算公司, 不需'
  - '[PAGE 449]


    承擔交易對手可能不履行契約義務的風險。換言之，如果有任何交易對手不履行契約義務，相關損失是由清算公司承擔。還有，由於未平倉部位每天根據市價進行結算，輸贏雙方每天都會結清帳目，如此可以顯著減少不履約的風險。


    未平倉期貨部位都必須存放保證金（履約擔保金）在經紀商處。對於股票交易者來說，保證金創造的信用擴張程度是很可觀的。起始保證金經常是契約總價值的 3～5%。往後，每天必須繳納或收取的變動保證金，則取決於每天按照市場價格進行結算的金額。


    讀者應該很容易瞭解，買賣道瓊指數期貨，等於是買賣一個相當龐大的股票投資組合，但期貨部位在未來某特定日期之前必須結束，這不同於現貨股票幾乎可以無限期持有。


    # 現貨與期貨的差異


    現貨與期貨交易的最主要兩項差異為：


    +   1. 現貨部位，投資組合價值必須先付價款，或透過股票融資帳戶借款。


    +   2. 現貨部位持有人可以收取現金股息。


    當然，兩者之間的差別不僅止於此。期貨交易具備顯著的信用擴張能力，但這是兩面開鋒的利刀。如果交易者毫不保留，些許行情波動就可能勾消帳戶。對於現貨部位持有人來說，前述些許行情波動造成的影響，甚至很難被察覺。


    # 道瓊指數期貨


    期貨價格與指數價格之間，存在密切的關連（請參考圖 199.1）。兩種價格如果出現不正常的背離，就會立即引發套利交易：套利者會'
  - '[PAGE 450]


    買進價格低估者，同時放空價格高估者，直到不正常的背離現象消失為止。這兩種價格不會剛好相同，因為期貨價格還會反映放空股票的短期融通成本，以及指數成分股發放的股息。這也是所謂的「持有成本」（cost
    of carry）。期貨的「理論價格」，應該等於指數價格加上持有成本。這也就是所謂的「公平」或「理論」價值。


    # 運用股價指數期貨控制行情暴露程度


    道瓊工業指數成分股投資組合或鑽石組合持有人，可以運用期貨進行避險，藉以控制風險與行情暴露程度。舉例來說，假定投資人對於行情後市看法悲觀，更明確來說，由於上升趨勢線被貫穿，技術面轉差，他可以放空期貨契約，數量約略等於現貨部位，使得行情暴露程度大約降到零。


