    # ## 股價趨勢技術分析(上冊)


    同於一般字典上的解釋。這是指市場本身之行為的研究，而非研究市場交易的對象。「技術分析」是一種科學方法，通常採用圖形格式式來記錄某支股票或大盤指數的實際交易歷史，然後根據圖形的歷史紀錄，推測未來可能的行情發展趨勢。編者附註：隨著電腦普及化，各種技術分析學派就像雨後春筍般地興起。以數據分析為主的技術分析方法，例如：移動平均、擺盪指標等，試圖由絕對客觀的角度分析行情。愛德華·馬基的研究領域，則屬於「古典技術分析」(classical
    technical analysis)。請參考本書最後的附錄 C。


    因此，技術分析者認為，針對某股票而指派特定的內含價值，這是毫無意義的行為。以美國鋼鐵（United States Steel）股票為例，1929年秋初的每股價格為
    $ 261，但到了1932年6月份，只要 $ 22就可以買到。1937年3月的價格為 $ 126，一年之後的價格則為 $ 38。1946年5月，股價上漲到
    $ 97，10個月之後的1947年，股價又跌破 $ 70；可是，就最後這個日期來說，該公司盈餘創歷史新高，而且利率大體上仍然處於最低水準。根據公司資產負債表觀察，美國鋼鐵的每股帳面價值（年底）如下：1929年為
    $ 204，1932年為 $ 187，1937年為 $ 151，1938年為 $ 117，1946年為 $ 142。這類發展——認定價值與實際價格之間的嚴重背離——絕非特例，而是常態，隨時隨地都存在。總之，在任何特定時間，美國鋼鐵股票的真正價值，其絕對而唯一的決定因素是市場供需關係，後者會精確反映在「紐約證交所」營業大廳的報價螢幕。'
