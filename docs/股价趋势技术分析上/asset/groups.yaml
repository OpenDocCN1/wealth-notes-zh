    # 第13章 支撐與壓力


    先前底部將存在既定利害關係結構，並產生實壓（壓力），造成新的頭部；先前頭部則產生實盤（支撐）、造成新的底部。


    這個觀念很重要。深入分析股價走勢圖，不難發現上升趨勢相對容易穿越先前的峰位，必較不容易克服先前的大量底部。（對於下降走勢來說，情況當然相反。）先前高點的實壓不大，通常只足以造成漲勢的暫時停頓，而不像先前底部一樣構成顯著壓力，迫使價格大幅折返或陷入長期橫向整理。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_337_0.png)


    圖142。 圖141顯示的2月份折返走勢在24暫時獲得支撐；價格反彈恰好足以封閉2月7日的缺口，但隨後跌勢穿越短形排列上限的支撐，這是很重要的技術性警訊。接著，走勢出現等腰三角形排列，但向上突破的發生位置過於接近三角形頂點，所以漲勢不夠強勁，只能回升到先前高價，接著就發生「收場」走勢（參考本章正文稍後的說明）。8月22日發生雙重頂訊號之前，我們早就可以預見中期以上的跌勢。'
