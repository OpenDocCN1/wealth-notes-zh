    # 三重頂（底）


    就邏輯推論而言，如果有雙重頂，自然也應該有三重頂，兩者的發展很類似。事實上，很少反轉排列只能夠被歸類為三重頂。很多上升趨勢的頭部轉折是由三個峰位構成，但這些排列大多屬於矩形。由這個立場觀察，任何頭肩頂排列也可以被視為三重頂，尤其是「頭」不特別突出的頭肩頂。


    真正的三重頂（有別於其他由三個峰位構成的排列），非常類似雙重頂。峰位間隔很遠，中間折返走勢的幅度很深，達成呈現弧狀軌'
  - '[PAGE 220]


    跡。第二個漲勢的成交量，小於第一個漲勢，第三個漲勢的成交量更小，經常沒有明顯擴增的傾向。三個峰位的間距或許不如雙重頂，相隔距離也沒有必要相等。所以，第二個峰位可能發生在第一個峰位之後的三個星期，第三個峰位則發生在第二個峰位之後的六個星期。另外，三個峰位所夾的兩個谷底，其價位也沒有必要相同；第二個谷底可能低於第一個谷底，反之亦然。三個峰位的價格不需完全相同，仍然適用3%的準則。三重頂雖然可以存在種種變形，但整體結構應該有明確的型態，足以讓有經驗的圖形分析者立即判定三重頂排列。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_220_0.png)


    圖3. 雖然沒有呈現任何明確的型態，但星期四夾著大量出現長線形，盤中低點第三度測試今年低價，這是由單日反轉構成的三重底排列，即將展開上升趨勢。如果多方不能利用這個機會上攻，我們將減碼，把停損設定在今年最低價附近。'
