    式進行，隨後的價格走勢應該更猛烈、快速。我們沒有必要過份強調這點；這是合理的推論，多數情況也實際是如此，當然也有例外而造成失望結果的。雖說如此，但假定其他條件相同，如果兩支股票都由上升三角形向上突破，當然應該優先買進伴隨突破缺口的對象。


