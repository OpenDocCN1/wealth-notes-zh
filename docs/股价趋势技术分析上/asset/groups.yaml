    形排列一樣）。


    菱形排列似乎不需要做更進一步討論，讀者應該可以透過本章範例觀察排列的細節。關於排列突破之後的最低衡量目標，估計方法與頭肩排列或三角形相同，讀者或許可以自行推演。由突破點起算，價格走勢幅度至少應該等於排列最寬距離。關於最低衡量目標，我們還是要重複強調一點：「反轉必須有可供反轉的本金」。一般來說，排列突破之後，價格走勢應該會超過最低衡量目標。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_238_0.png)


    ## 楔形排列


    截至今日，我們討論的排列，都可以發生在主要趨勢的轉折點，而且某些排列很少發生在主要反轉之外的情況。接下來，我們準備討論三種經常出現的小型反轉排列，或頂多只具有中期意涵。雖然如此，這些排列在短線交易上，還是很有用。首先討論楔形排列
    (wedge formation)，第8章曾經提到這種排列有些類似三角形。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_239_0.png)


    楔形排列過程的價格波動，可以藉由兩條相互收斂的直線（或幾近於直線的曲線）界定，但這兩條直線是同時朝上或朝下傾斜，不同於三角形排列的界線。等腰三角形的上限朝下傾斜，下限則朝上傾斜。直交三角形只有一條朝上或朝下傾斜的界線，另一條為水平狀。對於上升楔形（rising
    wedge），上限與下限都是朝右上方傾斜，但由於兩條直線相互收斂，所以下限的傾斜角度較大。下降楔形（falling wedge）的情況剛好相反。


    我們知道，上升三角形的上限為水平狀，下限則向上傾斜，所以代表多頭意涵。依此推理，由兩條向上傾斜之直線界定的上升楔形排列，應該具有更強烈的多頭意涵。可是，實際狀況並非如此。請記住，上升三角形的上限為水平狀，代表某固定價位的供給（出貨）；一旦該固定價位之賣壓被消化（向上傾斜的下限，顯示上檔供給將被消化），價格將因為壓力消失而向上挺進。反之，上升楔形排列的上檔沒有明確的供給障礙可供穿越，投資意願反而呈現逐漸降低的現象。價格雖然上漲，但每波攻勢則愈來愈弱。最後，需求（買方）全面瓦解，趨勢向下反轉。所以，上升楔形通常都代表技術面轉弱的徵兆。


    # 第10章 重要的反轉型態 V：其他


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_241_0.png)


    圖94. 1946年，美國鋼鐵出現菱形頭部排列，時間長達3個月，這個排列也可以視為頭肩頂。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_241_1.png)


    圖95. 11月份，價格向上突破菱形排列，所以這個排列屬於整理型態，不是反轉排列。


    # 股價趨勢技術分析（上冊）


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_242_0.png)


    圖96. 相對於日線圖來說，週線圖上的菱形反轉排列更容易觀察。請注意1946年5月份與6月份的價格搖動與成交量型態。另外，1946年9月到1947年2月之間，也發生明確的下降三角形，排列突破之後，價格曾經在3月份拉高到三角形頂點附近，代表理想的放空機會。


    當然，我们也可以辯稱，任何價格漲勢（不論其形狀如何）都代表市場技術面轉弱。潛在買盤將因為價格走高而降低買進意願，潛在賣盤也將因為價格走高而強化賣出意願；換言之，任何上升趨勢都會造成供給增加、需求減少。這種說法在理論上雖然站得住腳，但價格上漲往往反而會吸引買氣，讓賣方期待將來有更高價格可賣。上升楔形不同於一般上升趨勢通道（後文將說明），兩者之間存在差異，楔形設定漲勢的某種限制。兩條邊界相互收斂，其頂點代表漲勢端點，也是反轉發生的位置。


    # 第10章 重要的反轉型態 V：其他


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_243_0.png)


    圖96.1 技術分析者將來回顧1990年多頭行情，應該會充滿驚嘆。最神奇之處，應該是當時發生的可資辨識、可供分析之徵兆（參考附錄D）。進一步分析可以發現，宴會已經結束了（或少胖女人已經開始唱歌）。如同愛德華指出的，具有其本身意涵的擴張頂排列，轉變為菱形排列，後者發出假訊號，結果向上突破，並發展為另一個三角形結構的排列（可以視為不規則或上升三角形，此處只顯示排列下限）。這個三角形排列隨後向下突破，然後呈現V型反轉。價格快速回升，到達一個巨大矩形排列的上限，後者是繪製於2000年8月，2001年的漲勢終止於此，然後行情開始下滑到2001年9月11日的悲劇。投資人顯然沒有做多的理由。當時，是否有任何徵兆顯示行情將呈現橫向發展？全然沒有。這一切都是後見之明嗎？讀者可以參考本書附錄D，查詢約翰·馬基投資通訊（John
    Magee Investment Newsletter）當時對於行情的分析。


    我們只需要用幾句話，就可以點出上升楔形的基本特質。這種排列可能發生在上升趨勢末端而成為頭部型態，也可能發生在下降趨勢過程而成為連進型態。楔形排列通常至少需要3個星期的時間來完成；如果時間短於3個星期，應該歸類為三角旗形（pennant，參考下一章說明）。由楔形底部到排列收斂頂點之間，價格波動通常至少會跨越三分之二的距離；很多情況下，價格會繼續朝頂點發展，但另一些情況下，價格也可能在較短距離內暫時向上突破，然後才正式向下崩跌。一旦價格有效突破楔形排列，通常不會多做猶豫而立即大幅下跌。下檔衡量目標至少是楔形排列本身的漲幅。楔形排列過程的成交量型態，非常類似三角形排列，當價格朝頂點發展時，成交量持續萎縮。


    ## 下降楔形


    除了排列邊界的傾斜角度之外，下降楔形在各方面都類似上升楔形。可是，排列完成之後的價格走勢方向，則截然不同。上升楔形突破之後，價格通常會快速挫跌。可是，下降楔形突破之後，價格經常演變為橫向走勢，或沈悶的碟形排列，最後才向上發展。所以，對於上升楔形，型態判斷與手腳反應速度要很俐落，否則沒有辦法即時掌握機會。至於下降楔形，交易者通常可以慢慢思考如何因應後續的漲勢。


    這兩種型態都需要有明確的結構。除非價格波動非常緊密，排列邊界由兩條相互收斂的直線清楚界定，而且兩條直線的都明顯朝上或朝下，否則楔形結構就值得懷疑。如果排列的某條邊界接近於水平狀而類似直角三角形排列，則型態蘊含的可能後續發展，就可能截然不同。我們很難提出簡單明瞭的法則，藉以區別楔形與直角三角形。如果某條邊界幾乎是水平狀（該處轉折點收盤價都大約落在相同價位），則排列應該屬於直角三角形。總之，讀者不需過份擔心這方面的問題，只要經過一段時間實際演練，應該很容易區分楔形與直角三角形。各位應該不難辨識各種排列的不同「徵兆」，幾乎可以憑著直覺做出正確判斷。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_245_0.png)


    圖97. 1946年，多頭行情頭部出現菱形的主要反轉排列，也可以視為複雜頭肩頂。這個排列在週線圖上很清楚，但日線圖就很模糊。請注意，菱形突破位置高於頭肩頂排列賣出訊號，差距大約為2點。年底前，價格在
    14 1/2與 17 1/2之間發生疲軟的矩形排列；排列突破之後，只勉強完成目標價位（1947年2月）。


    # 股價趨勢技術分析（上冊）


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_246_0.png)


    圖98. 1937年8月，美國鋼鐵的次級回升走勢，已經逐漸形成頭部，價格波動慢慢收斂，成交量萎縮。這是空頭意涵很明確的楔形排列。就整個7月份到8月份的走勢來說，則屬於圓形頂排列。圖形內標示三個突破缺口（G，請參考第12章），最後一道缺口引導價格跌破支撐（參考第13章）。


    ## 週線圖與月線圖的楔形排列


    真正的楔形排列，發展期間大多很短暫（很少超過3個月），所以很難呈現在月線圖，但週線圖偶爾可以察覺這類排列。發展緩慢的長期下跌走勢，如果繪製在算術刻度的圖形紙上，整個形狀看起來經常是楔形。所以，如果採用算術刻度，主要空頭走勢呈現在月線圖上，整個結構將是巨大的下降楔形。這是因為主要趨勢的上下攪動，其百分率幅度雖然類似，但價格由高檔下跌之後，在偏低價位將佔有比較短的垂直距離。這類走勢型態當然不是真的楔形排列。如果把前述走勢繪製在半對數方格紙上，整個型態將呈現平行狀通道，甚至稍微發散而不收斂。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_247_0.png)


    圖99. 1936年發生典型的下降楔形排列。請注意成交量型態，虽然沒有明顯的規律，但大體上呈現萎縮趨勢。另外，7月份曾經發生小規模旗形排列（參考第11章），年底出現矩形排列，排列突破之後，股價一飛沖天，直奔75。


    ## 上升楔形將常發生在空頭市場回升走勢


    最後補充一點，上升楔形是空頭市場回升走勢的典型現象。所以，長期下跌走勢如果發生上升楔形，幾乎就可以確定主要趨勢仍然向下，而不是多頭市場的第一段主升波。舉例來說，假定某個空頭市場最後是以頭肩底排列結束，上升楔形將常發生在左肩完成之後的反彈走勢，價格隨後還會向下創新低（頭肩底的「頭」）。對於算術刻度的週線圖，上升楔形幾乎一定是空頭市場的現象，因為價格逆著主要趨勢向上振動，相同垂直距離代表的百分率幅度愈來愈小。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_248_0.png)


    楔形很少發生在主要趨勢反轉點，但這支股票在 1946 年形成的多頭市場峰值，卻是長達 8 個月的上升楔形。這個排列在週線圖上看起來很清楚。位在 60 附近的虛線，代表重要支撐（參閱第
    13 章），曾經有效遏止跌勢長達 9 個星期。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_249_0.png)


    圖101. 這份涵蓋12個月份的日線圖，有很多具有技術性意義的有趣結構。

    12月3日發生單日反轉，代表主要頭部。隨後雖然出現模糊的下降三角形，但單日反轉是唯一明確的賣出訊號。當各位閱讀下一章討論的三角旗形排列之後，請重新回頭觀察這份走勢圖在11月份發生的三角旗形。隨後發生的整段跌勢中，除了1946年8月一度向上穿越中期趨勢線之外（但成交量沒有配合放大，參考第14章說明），完全沒有呈現任何「買進」型態。


    ## 單日反轉


    本書第6章曾經提到「單日反轉」（one-day-reversal）型態，這種反轉排列本身只有暫時性意義，或代表小型趨勢的反轉。沒錯，這種排列也可能發生在長期漲勢的峰位，例如：頭肩頂的頭部，隨後並展開長期跌勢；可是，請注意，隨後跌勢是來自於頭肩頂排列，單日反轉實際上只代表「頭部」完成。舉例來說，單日反轉可能發生在等腰三角形排列的第一個小峰位，隨後只出現整理走勢，沒有發生趨勢反轉。雖說如此，但這種技術型態還是可以警告我們，顯示多頭氣勢在短期內可能暫告一段落。


    跌勢發展過程，單日反轉經常發生在恐慌性殺盤走勢末端，通常稱為「高潮日」(climax day) 或「賣壓高潮」(selling climax)。這種表現方式，具有特別意義，我們稍後會討論。現在，先讓我們說明何謂「單日反轉」？


    就成交量來說，單日反轉當天會爆出明顯大量，遠超過最近幾個月來的單日成交量。另外，在單日反轉發生之前，股價曾經出現長期而穩定的漲勢（或跌勢），成交量有逐漸放大的趨勢。當天，市場開盤之後，價格一路走高，氣勢極為強勁。甚至可能以跳空方式開盤，走勢圖留下顯著的缺口。（稍後會討論跳空缺口的意義。）開盤最初一、兩個小時，價格漲幅可能超過平常三、四天的程度。可是，漲勢最終還是停頓了，這可能發生在開盤的一個小時之後，也可能是在下午盤。接著，價格開始「攪拌」，上下波動很有限，但交投仍然十分熱絡。突然之間，趨勢向下反轉，價格下跌速度更甚於上漲。臨收盤前爆出大量，價格被打到開盤水準附近。總之，當天交易出現極端大量，盤中價格可能上下震盪幅度可能到達
    2% 或 3%，價格最後卻收在前一天水準附近。


    頭部的單日反轉，經常出現在走勢曾經很強勁、交投很熱絡的小型股（流通籌碼相對有限）。對於大盤指數來說，峰位很少發生單日反轉。相反地，在不理性或恐慌性殺盤之後，大盤指數經常在底部出現單日反轉（賣壓高潮）。


    如同前文談到的，對於主要趨勢來說，單日反轉沒有太大意義。短線交易者如果手腳夠快、時機拿捏正確，或許可以賺個幾點。可是，一般來說，單日反轉結束之後，並不會立即發生新趨勢；價格通常還需要「工作」一段時間，建立某種型態，才能蓄積足夠力量，發展為中期程度的走勢。可是，由於單日反轉經常發生在重大走勢的起點，往往能夠透露後續發展的可能徵兆。總之，單日反轉代表一種警訊，分析者必須密切留意價格的可能發展，隨時準備採取因應行動。


    第8章討論等腰三角形的时候，曾經提到三角形頂點附近發生的假突破或震盪盤，經常出現單日反轉排列。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_251_0.png)


    ## 賣壓高潮


    憶起往日美好時光，當時融資買進股票只需要支付10%現金，而且放空股票沒有任何限制，專業玩家可以（事實上也經常）採取有計畫的「空襲」，給那些財力不足的融資買進者一些「震撼教育」。當一般大眾過度擴張信用而融資買進股票，大量拋空可以讓股價暴跌。然後，經紀商會追繳保證金，許多投資人沒有能力或不願補繳現金，於是斷頭賣壓湧入市場，造成股價進一步下挫。這個時候，專業玩家可以獲利回補空頭部位，並低檔承接籌碼，等待隨後的股價反彈。雖然證管會已經禁止這類
    的「空襲」行為，但只要繼續維持融資買進的管道，只要股票市場曾經飆漲而隨後大跌，追繳保證金與斷頭賣壓就會造成重大影響。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_252_0.png)


    圖102.1 蘋果電腦，1987年崩盤。這個崩跌走勢難道是「晴天霹靂」嗎？未必見得。事實上曾經出現許多徵兆：跌破主要趨勢線；崩盤前的激情市況下，短期動能下降；崩盤本身，恐慌性殺盤之後，出現典型的空頭回補漲勢，然後繼續下跌。


    # 第10章 重要的反轉型態 V：其他


    真正的賣壓高潮，大多來自前一段所說的恐慌性賣出。這種現象通常發生在快速而重大的跌勢之後，許多投機客沒有多餘資金可以補繳保證金，股票被迫斷頭，不計成本在市場拋售。這是一種惡性循環，每波斷頭賣壓都可能導致股價重挫，然後每波股價重挫又引發另一波斷頭賣壓；因此，數以百萬計的股票在短時間內倒入市場，展現血淋淋的跳樓大拍賣。這類賣壓高潮往往爆出天量，遠超過先前漲勢過程的任何單日成交量。對於保持空手的交易者來說，這是撿便宜貨的大好時機。


    這種「清倉大拍賣」或賣壓高潮，顯然會快速改變市場的技術結構。整個發展過程內，股票會由散戶手中，低價轉移到實力雄厚的玩家。籠罩市場的高氣壓，轉化為一場傾盆大雨，然後雨過天晴。另外，市場一旦發生恐慌性賣出，股價會顯著下跌，甚至跌到任何保守估計的合理買進水準。


    賣壓高潮進行的時間，可能不足一天；當天尾盤可能就會向上反轉。這就是發生在底部的單日反轉。可是，某些情況下，賣壓可能持續到尾盤才慢慢緩解，當天沒有足夠時間向上反轉。隔天，價格可能直接開高，恐慌性賣壓不復存在。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_254_0.png)


    1937年10月19日發生恐慌性盤整，包括大盤指數與許多主要股票，當天都出現單日反轉走勢。就這份走勢圖來看，除了實壓高潮之外，還有幾個值得注意的排列，包括：7、8月份的頭肩頂，以及10月初的矩形排列演變為三角形整點。最後，隔年3月份創空頭市場低點10
    1/2。對於這份對數格式走勢圖而言，價格一直到1938年6月才突破下降趨勢線。


    實壓高潮的最典型歷史案例，發生在1929年10月29日。當時，市場籠罩在恐慌性氣氛中，道瓊工業指數開盤252.38，這也是當天最高價（較前一天收盤下跌8點），然後指數最多曾經下跌40.05點！收盤前兩小時開始，指數由低點212.33反彈，收盤指數回升到230.07點，當天股價反彈幅度將近18點，隔天又上漲28點。10月29日當天的成交量也創歷史新高：16,410,000
    股，超過前一個多頭市場任何單日成交量的兩倍。可是，一個星期之後，股價跌破 10 月 29 日盤中低點，而且整個 1929～32 空頭市場第一階段的真正低點發生在
    11 月 13 日。編者附註：請參考以下有關 1987 年股市大崩盤的評論。


    1937 年的恐慌性賣壓，也透過典型的賣壓高潮結束於 10 月 19 日，在股票市場的歷史上，又登錄另一個「黑色星期二」。前一天，道瓊工業指數收盤價為 125.73。價格由
    8 月中旬高點 190 附近一路下跌，幾乎完全沒有反彈，融資帳戶岌岌可危。經紀商不斷電話追繳保證金，但補繳情況很不樂觀。10 月 19 日開盤後不久，在層層賣壓追殺之下，指數一路走低。接近中午的
    11:30 左右，直到工業指數下跌到 115，賣壓才逐漸消失。大約又經過一個小時，價格開始回升，當天收盤價為 126.85，反而較前一天上漲 1 點。當天成交量為
    7,290,000 股，大約是前一個多頭市場頭部任何單日成交量的兩倍。十天之後，盤中高價一度到達 141.22，但 1937 年 11 月 20 日又跌破恐慌性賣出低點，這波空頭市場最後結束於
    1938 年 3 月 31 日，道瓊工業指數收盤價為 98.95。


