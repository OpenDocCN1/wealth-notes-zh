    圖8. 道瓊工業指數與鐵路指數收盤價與成交量走勢圖，涵蓋期間為1945年12月1日到1946年5月31日。這段期間值得注意的現象包括：1月份與2月份的偏高成交量（相對於4、5月份而言）；鐵路指數表現相對弱勢，工業指數在4、5月份創新高，但鐵路指數沒有跟進。請注意圖形最右端，2月份低點仍然是道氏理論關鍵的下檔「訊號」水準。


    # 1946年春天


    12月底，股票市場小幅回檔，這是每年經常發生的正常現象，通常歸因於「稅務賣壓」。到了1946年1月，行情又開始大幅挺進。1月18日，當天成交量超過300萬股，這是5年來首見的壯舉。2月份的第一個星期，走勢陷入「攪拌」，沒有什麼具體結果。這段期間的最高'
