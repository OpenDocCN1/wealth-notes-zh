    關於前述說明，讀者如果覺得我們「辯解太多」，那主要是希望讀者能夠秉持開放的心胸考慮缺口，不要受到某些神祕說法的影響而產生先入為主的觀念。由另一個角度說，某些缺口確實具有重要的技術意義。圖形分析者可以透過某些缺口，評估趨勢的可能發展，現'
