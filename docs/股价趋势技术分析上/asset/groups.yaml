    \n### 絕對必要的修訂\n\n不久前，我的小兒子聽到我提起「計算尺」，於是我問我：「什麼是計算尺？」沒錯，目前距離愛德華與馬基的時代已經很遠了，差距就如同計算尺與計算機一樣。隨著時代變遷，原稿的某些文字已經不恰當或無意義，這些場合必須做些必要的修改。\n\
    \n對於那些因為時代變遷而過時的評論，我會在註腳說明，或在各章末端特別註明。這些文字都會標示「編者附註」。讀者絕對有必要閱讀這些附註，否則可能會迷航到20世紀。\n\
    \n某些情況下，這些附註可能整理為新的章節，譬如說，馬基時代不能針對股票指數直接交易。目前，某個股票指數或一籃股票如果沒有選擇權或指數可供交易的話，大約在紐約時間1分鐘之內就會出現（如同每個人瞭解的，紐約的1分鐘只有59秒）。這是本版修訂所要考慮的重大事實。本書前言有詳細的說明。因應新科技與金融環境變化而新增添的章節，都會特別標明，例如：第18-A章（但第23章是例外，該章是完全新增加的）。\n\
    \n### 再論必要的修訂\n\n很多情況下，在少數交易所具有獨佔經營權而能夠控制佣金費率的年代，本書傳遞的資訊還繼續有效，譬如說，經紀商收取的佣金與交易成本。現在，一般書籍已經不適合提供這類的資訊，因為金融資訊變化太快。目前，如果必要的話，應該上網查詢最新的資料。因此，對於這種變化快速的資料，讀者應該上網查詢。\n\
    \n### 關於性別\n\n容我引用我在馬基的《華爾街一般語意學》（Magee's General Semantics of Wall Street，依據最新流行重新命名）第2版所寫之前言的一段評論：\n\
    \n### 關於性別\n\n我是女性主義者。現代男人（某可愛女兒的父親）怎麼會不支持女性主義呢？關於語言運用、文法與風格，我的態度相當傳統而單純。所以，採用男性代名詞來代表一般中性對象，關於這種作法，不知道立場與我相同的男人（還有女人）看法如何？\n\
    \n現代美語使用字典（Dictionary of Modern American Usage）作者表示，「英文有很多兩性通用的一般文字，例如：人（person）、任何人（anyone）、每個人（everyone）或沒有人（no\
    \ one），但也有非共通性別的人稱單數代名詞。所以，我們有他（he）、她（she）與它（it）。一般使用上都採用男性代名詞「他」來代表所有性別的『他』與『她』……。某些情況下，代表兩性的男性代名詞如果不太適用的話，英文在這方面的缺陷就暴露出來了。」\n\
    \n不論適當與否，最好還是採用涵蓋所有性別的代名詞（she/he/it）與其他英文髒話。（「雜種」「bastard」從不用來罵女人，即使這個女人真的是私生女，這點很有趣，不是嗎？）關於男性代名詞的中性用法，我傾向於佛勒（Fowler）的說法，共有三種權宜之計，第一是任何人（他或她）都心裡明白者；第二是任何人（他們）都可以自行琢磨者；第三，任何人（他）都明白者。不得已的情況下，採用第一種；可是，這種用法很笨拙，除非狀態緊急，否則看起來很好笑，而且也有一點故意顯得幽默的味道。第二種是最常見的辦法；強調「man」的原始、真正意義，然後在全然不同的情況下，如果不願冒險採用第三種的話（這是此處建議的用法），努力讓自己看起來像是採用這種用法。至於第三種用法，是在性別不顯得重要的情況下，允許採用男性格式來代表中性對象，用man（人類）來取代man（男人）。\n\
    \n雖然基本教義派信徒會挑剔，但即使我強調man的原始、真正意義也是如此；所以，凡是泛指一般中性對象者，我都採用男性代名詞。這些文法上的吹毛求疵終究會變得毫無意義，那些不斷在這方面仔細琢磨、藉以取悅文法恐怖份子的人（所謂「人」，是指男人与女人），將來看起來一定很好笑，甚至沒有女人會接受。請問，珍·奧斯丁（Jane\
    \ Austen）又會怎麼做呢？\n\n### 有關投資人的性別\n\n既然談到性別的話題，不妨也順便討論投資人的性別，雖然這些結論沒有科學根據。就我身為交易顧問、老師與理財專家的經驗觀察，我認識的女性投資人，似乎都具有先天的優勢（相較於男人來說）。我見過一些女性賭徒，也認識一些。可是，我沒有在金融市場見過女性賭徒。我認識很多這類的男人。在我的學生與客戶之中，我也發現女人（整體而言）比較具有耐性。所謂的耐性，我是指精明投資人應該具有的耐性。\n\
    \n以上純屬個人的觀察。我沒有做過深入研究，所以不能談論整體女性，而且我也不認識芭芭拉史翠珊，她據說是不同凡響的投資專家，尤其精通新上市股票。我相信，如果有更多女性政府或警察主管，美國一定會變得更好；同樣地，如果有更多的女性投資人，金融市場一定會變得更好；而且，我也相信女性投資人与經理人的人數會愈來愈多。\n\
    \n### 重要問題：敏感指數與貝他值\n\n早在投資市場正是採用貝他值（beta，衡量個別股票相對於整體市場之價格波動程度）之前，馬基與愛德華就採用敏感指數（Sensitivity\
    \ Index），兩者基本上是相同的東西。讀者如果對於這方面運用有興趣，請參考本書附錄D，其中利用貝他值代入「綜合槓桿比率」（Composite Leverage）做計算，馬基用以衡量風險水準。關於敏感指數的舊有附錄，則移到附錄A，另外還探討綜合槓桿比率，這兩部分內容都根據目前的金融理論與實務做必要的調整。\n\
    \n### 1/8美元與12.5美分\n\n本版發行的時候，金融界又揚言要改採十進位計算的小數計算股價。過去，股價採用1/8為一檔，因為這種計價方式對於業者比較有利，允許經紀人與專業報價商賺取較大的報價碼差。對於本書與股票交易來說，改採十進位小數報價自然有其重要性。馬基建議停損應該設定在高價或低價外緣的1/8處，追蹤性停單也採用1/8間隔。改採十進位小數報價之後，究竟會造成什麼影響，我們還不太清楚，心理上的計價單位將是12.5美分、10美分或其他的9美分或11美分，還有待進一步觀察。至於本書的走勢圖，則仍然引用過去版本的計價單位。\n\
    \n### 編者代名詞「我」\n\n讀者將發現，馬基與愛德華都自稱「我們」，而本人則自稱「我」，這應該不會造成混淆，因為他們兩位採用複數的「我們」，本人則採用單數的「我」。至於用「我」來強調「自我」，讀者可以放心，因為在金融市場混了40年，已經沒有剩下多少「自我」了。有關編輯的立場，或許可以引用強森博士（Dr.\
    \ Johnson）對於字典編輯者的定義。有些人認為，強森博士的重要性，完全來自於他編輯的字典。「字典編輯者，就是字典的作者。是一份無害而沈悶的工作。」我扮演的角色大概如此。\n\
    \n至於本書的出版公司，認為本版很重要，把本人視為第8版的共同作者之一。對於這種處理，約翰·馬基應該覺得很高興。我們兩個人存在著師生之誼，大師最樂見的，莫過於把法統傳承給熱忱的弟子。\n\
    \n## 謝 辭\n\n### 感謝以下人士：\n\n- 約翰·馬基的耐心教導。\n- 布萊·胡爾（Blair Hull）教導我有關選擇權的種種。\n- 比爾·德雷斯（Bill\
    \ Dreiss）教導我交易系統。\n- 阿特·凡·華寶（Art von Waldburg），可敬的同事，也是碎形波浪運算（Fractal Wave Algorithm）的發現者。\n\
    - 費雪·布萊克（Fischer Black），他應該活久一點而獲得諾貝爾獎。\n- 比爾·史考特（Bill Scott）朋友與交易同事。\n\n### 向第8版提供協助者致謝：\n\
    \n- 亨利·普魯登教授（Professor Henry Pruden），舊金山金門大學，提供珍貴的支持與建議。\n- 馬丁·普寧（Martin Pring）；\n\
    - 勞倫斯·麥克米倫（Lawrence Macmillan）；\n- 亞米茄研究公司的米區·亞克利斯（Mitch Ackles）；\n- 卡森·卡利賽爾（Carson\
    \ Carlisle）；\n- 愛德華·杜普森（Edward Dobson）；\n- 大衛·羅賓森（David Robinson）；\n- 西林·艾胥（Shereen\
    \ Ash）；\n- 史蒂芬・包含（Steven W. Poser）；\n- 先前胡爾交易公司的萊斯特・陸普斯（Lester Loops）；\n- 龜族的湯姆・山克斯（Tom\
    \ Shanks）。\n- 聖露西出版社熱心支持的德魯・基門（Drew Germer），\n- 生產部門的派特・羅伯森（Pat Roberson），\n-\
    \ 以及生產主編蓋爾・雷納（Gail Renard）。\n\n特別感謝我的研究助理唐・卡羅斯（Don Carlos）與伯西第・朵易爾（Bassetti Doyle）。此處也要感謝本版與先前版本使用之各種套裝軟體的開發商，包括：\n\
    \n- AIQ Systems\n  - P.O. Box 7530\n  - Incline Village, NV 89452\n  - 702-831-2999\n\
    \  - www.AIQsystems.com\n\n- Metastock\n  - Equis International, Inc.\n  - 3950\
    \ S. 700 East, Suite 100\n  - Salt Lake City, UT 84107\n  - www.equis.com\n\n\
    - Tradestation\n  - Omega Research\n  - 14257 SW 119th Avenue\n  - Miami, FL 33186\n\
    \  - 305-485-7599\n  - www.tradestation.com\n\n## 紀念感言\n\n約翰·馬基於1987年6月17日過世，我們在此向他致上最高敬意，並以本書新版做為紀念。馬基被視為技術分析的前輩大師，他與羅伯·愛德華合著的《股價趨勢技術分析》可以說是型態分析的經典作品，書中闡述、擴充查爾斯·道（Charles\
    \ Dow）與理查·莎貝克（Richard Schabacker）的觀點；道氏在1984年首創股價指數，奠定技術分析的基礎，莎貝克曾經在1920年代擔任《富比士雜誌》（Forbes）編輯，他說明股價指數的訊號，並引用到個別股票。在整個技術分析領域內，約翰·馬基強調3個基本原則：股價變動呈現趨勢；價量配合；趨勢一旦形成，傾向於繼續發展。\n\
    \n《股價趨勢技術分析》一書以顯著篇幅說明股價在趨勢反轉過程，經常發生的型態，包括：頭肩頂／頭肩底、W型態、三角形、矩形與其他常見型態。圓形底與下垂頸線則屬於較罕見的排列。\n\
    \n馬基強調，投資人應該順勢操作，不要猜測底部位置，也不要在下跌過程試圖攤平。他始終拒絕參加行情猜測的遊戲，不願猜測市場的發展方向，也不願預估道瓊工業指數的年底水準。反之，不論大盤趨勢發向如何發展，他都強調選股的重要性。\n\
    \n隨機漫步學派認為，金融市場行為完全不可預期。對於這方面的挑釁，馬基的回應很有格調。他表示，「你們太過於依賴電腦。功能最強大的計算機，還是人腦。理論學家嘗試模擬股票市場行為，無法在其中發現任何可預期的性質，然後宣佈股票市場的價格行為屬於隨機漫步。這難道不是因為電腦程式不夠敏感，或電腦功能不夠強大，因此不能成功模擬人類大腦嗎？」然後，馬基由他的圖譜挑選一張走勢圖，顯示給那些隨機漫步信徒看。這是突然的漲勢，配合著大量；整理走勢，則配合著小量；接著，又是夾著大量的漲勢。第三次、第四次。一個漂亮的對稱走勢，演變為明確的趨勢通道，價量配合。「你真的相信這是隨機型態嗎？」馬基問道，但他早已知道答案了。\n\
    \n對於我們推崇的作者，總有一些論點或評論特別讓我們印象深刻。我非常欣賞馬基在一本小冊子內的評論：「當你踏入股票市場的時候，等於是踏進一個競技場，你的判斷與看法，將受到某些最敏銳心智的挑戰。你處在一個高度專業化的領域，其中分為許多不同部門，每個部門都有專業的研究者，他們的經濟生產完全仰賴相關判斷。你將聽到許多建議與看法，以及各方面提供的協助。除非你能夠培養出自己的市場哲學，否則將無從判斷好與壞、對與錯。」\n\
    \n除了約翰·馬基之外，我很懷疑還有誰更適合協助我們培養健全的投资觀念。\n\n理查·麥德莫特 (Richard McDermott)\n約翰·馬基股份有限公司總裁\n\
    1991年9月\n"
