    # 股價趨勢技術分析（上冊）


    來說，假定主要上升趨勢的中期漲勢在某天早上11點創新高價，工業指數為152.45，但稍後行情拉回而以150.70做收。這種情況下，次一波漲勢必須出現150.70以上的收盤價，才能顯示主要趨勢仍然向上。先前盤中發生的高點152.45並不算數。反之，如果次一波漲勢在盤中即使創新高152.60，但只要收盤指數沒有辦法站在150.70之上，則主要多頭趨勢的連續性仍然存疑。


    指數一旦穿越先前端點（頭部或底部的數據），到達何種程度之後，才能視為有效的穿越？近年來，市場研究者對於這個問題的看法頗為分歧。就道氏與漢彌爾頓來說，收盤價的任何穿越（即使只是0.01點），都屬於有效的穿越，但某些現代評論家則要求一整點（1.00）的穿越。我們認為，最初的觀點比較合理，因為沒有任何證據顯示後來的修正具有任何顯著意義。請參考後文提到的1946年6月份案例，顯示傳統的「任何穿越」法則比較理想。


    12. 反轉訊號被確認之前，應該假定既有趨勢將繼續發展（ATrend Should Be Assumed to Continue in Effect Until
    Such Time as Its Reversal Has been Definitely Signaled）：這是道氏理論最經常遭到批評的原則之一。可是，如果深入瞭解，將發現這個法則與前述的其他法則一樣，是經得起時間嚴格考驗的。這個法則談論的是機率問題，警告投資人不該過早改變既有的市場部位。一旦趨勢變動的訊號發生之後，投資人當然不該耽擱。可是，根據經驗顯示，在趨勢反轉訊號還沒有得到確認之前，投資人應該穩住陣腳，不要倉促買進或賣出。這種做法的勝算，很難用數學語言表達，例如：2對1'
