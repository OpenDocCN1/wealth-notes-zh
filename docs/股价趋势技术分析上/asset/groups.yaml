    圖104.4.1. 朗訊過線圖。在圖104.4的評論中，編者質疑：理性投資人為何會想要持有這種股票呢？這份走勢圖顯示，理性投資人如果沒有設定適當的停止策略，恐怕就不能避開後續非理性的價格波動。市場知道一些投資人所不知道的東西，但市場會把這些資訊透露給最一般的投資人，前提是他要判讀走勢圖。本書第9版新增添這份圖形，讓讀者瞭解圖104.4的後續發展。


