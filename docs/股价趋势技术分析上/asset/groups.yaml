    現在，讓我們看看銅板的另一面。假定行情如同預期地由高檔下跌，展看次級修正走勢，但你相信多頭行情還會繼續延伸。目前，股票指數為在 10000，價格大約已經見底，看起來將會朝
    11000 發展，你想增加股票風險暴露程度。如同稍早談到的，你當時持有 80% 的股票，以及 20% 的貨幣市場交易工具。你決定，現在是讓自己變得貪心一點的時候了，準備把所有的資金都轉入股票市場。雖然非常清楚：公牛（多頭）能夠賺錢，熊（空頭）也能賺錢，但豬（貪婪之徒）最後會進入屠宰場；可是，你也知道，沒有什麼格言是絕對正確的。


