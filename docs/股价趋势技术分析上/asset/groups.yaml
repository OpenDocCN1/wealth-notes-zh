    道氏理論提到的大盤指數狹幅盤整（line），也可能是連續排列或反轉排列，但前者的可能性大於後者。當然，道氏所謂的狹幅盤整，只不過是鬆散的矩形排列。事實上，幾乎所有橫向價格型態構成的密集區間（congestion）或交易區間（trading
