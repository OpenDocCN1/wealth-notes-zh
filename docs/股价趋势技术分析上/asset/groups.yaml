    過去，在「證管會」還沒有嚴格取締之前，矩形排列經常是出自組織嚴密的單一操作集團。譬如說，操作集團預先得知某公司的內線利多消息，想要設法先承接大量股票，準備等到利多消息公佈之後獲利了結。為了取得所需要的籌碼，操作集團往往需要想辦法先「震出」其他交易者或投資人的持股。首先，他們突然拋空數一些股票，澆熄當時的買氣，促使價格下跌。然後，在價格下跌到低檔支撐之前，他們開始買進，買單儘量分散而不引起注意。可是，這類買進遲早會造成股價上漲，於是他們在號子裡散播謠言，例如：某些大股東正在拋售、預計購併按將取消、公司將停止發放股息……等，如果必要的話，甚至賣掉手中部分股票來「證實」相關謠言。類似程序經過幾次'
