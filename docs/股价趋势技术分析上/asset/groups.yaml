    圖4是兩個指數的日線圖，涵蓋期間為1942年3月2日到10月31日。兩個指數都在4月底創1940年以來的低點，鐵路指數4月24日的收盤價為23.72，工業指數4月28日的收盤價為92.92。不久之後，兩個指數之間又呈現顯著的背離，鐵路指數只上漲7天之後就回檔，但工業指數繼續延進。成交量仍然偏低（事實上，在9月底之前，成交量都沒有顯著放大）。6月1日，鐵路指數創新低，2日的收盤價為23.31。6月22日，工業指數看起來似乎會被拖累而拉回，但幾天之後，卻展'
  - '[PAGE 84]


