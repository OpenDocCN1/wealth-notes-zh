    # 第 4 章 道氏理論實務


    的現象，總是過度渲染背離的意義，尤其是背離可以強行解視為有利的徵兆。事實上，就道氏理論而言，如果某個指數拒絕確認另一個指數，絕對不可以解釋為任何正面訊號。拒絕確認只有負面意涵。沒錯，背離現象有時候會發生在主要趨勢的反轉點（股票市場過去曾經發生幾次這類的案例，最顯著者可能是1901年與1902年，我們很快還會碰到另一個例子），但背離發生在非主要反轉的頻率，至少也同樣高，目前討論的例子就屬於後者。


    所以，就道氏理論的立場來說，1941年5月底的主要趨勢，完全與2月14日相同。6、7月份的漲勢帶動鐵路指數在8月1日創30.88的高點，工業指數在7月28日創130.06的高點（請比較1940年11月份的高點），然後價格開始加速下跌，最後發展為「珍珠港」恐慌。這使得工業指數跌破空頭市場低點（1940年6月10日的111.84）。鐵路指數雖然沒有跟進，但還是顯著跌破中期底部（2月14日的26.54）。


