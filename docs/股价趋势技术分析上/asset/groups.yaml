    # 股價趨勢技術分析(上冊)


    最關鍵時刻，出現致命的錯誤。本書訴求的對象，主要是外行人，他們不是金融專業人員，不能花費大量時間在投資或交易的活動內，但本書討論的內容，具有顯著重要性，即使是外行人也應該每天撥出幾分鐘時間來研究與管理。（第9版附註：事後回顧，這種說法似乎低估本書的重要性。處在第21世紀，最頂尖的專業玩家都瞭解趨勢分析的重要性，而且把本書當做教科書。）本書探討的理論與方法，只需要採用最簡單格式的股價走勢圖，也就是利用股票每天交易的最高、最低、收盤價與成交量等資料繪製的圖形。我們可以自行繪製日線圖，每天更新資料；某些情況下，還需要採用週線圖與月線圖，目前市面上的套裝軟體大多可以提供這些圖形。


    本書後文提供的圖例說明，幾乎都是日線圖。這類圖形很容易透過人工繪製，只需要一些方格紙，一份提供股票交易精確數據的報紙、一枝鉛筆與幾分鐘時間。編者附註：另外，很多圖形服務社可以提供相關資料給電腦套裝軟體使用，或透過國際網路下載資料（請參考附錄D）。透過這類方法取得資料，就沒有必要使用人工方式繪製或更新圖形。可是，這類「科學」方法也不是沒有缺點，因為少了人工繪製圖形的「感覺」。


