    突破缺口有什麼預測價值呢？第一，這類缺口具有提醒作用，強調突破已經發生。如果價格透過明顯的缺口離開型態，突破效力應該無庸置疑。假突破很少透過突破缺口進行。第二，突破發生時，缺口蘊含的力量，通常超過沒有缺口的對應情況。因此，如果突破是以跳空缺口方'
