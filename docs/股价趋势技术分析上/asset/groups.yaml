    3280 = $100 \times (18.90 + 13.90)$。這也是該部位可能發生的最大損失。


    只要道瓊期貨價格出現足夠大的走勢，多頭跨形交易就能夠獲利；換言之，期貨價格低於 $7472 = 7800 - 328$ 或高於 $8128 = 7800 +
    328$。上檔獲利潛能無限，下檔的最大獲利潛能為 $\$10 \times (7800 - 328) = \$74,720$（如果道瓊期貨價格跌到 $0$，雖然實際上不太可能發生，但理論上還是可能）。


    ## 狀況 4


    8 月份，投資人發現選擇權市場的行情明顯高估；換言之，隱合價格波動率明顯高於理論價格波動率。根據判斷，夏天結束之前，股票市場的走勢會趨於和緩。於是，這位投資人決定分別銷售
    1 口 9 月份買權與賣權，履約價格都是 $7800$，權利金收益總共為 $\$3280$。如果 9 月份期貨到期價格低於 $7472$ 或高於 $8128$，前述空頭跨形交易就會發生虧損。下檔可能發生的最大損失為
    $\$10 \times (7800 - 328) = \$74,720$，上檔可能發生的損失為無限。可是，這位投資人認為，風險實際上並不大，因為指數在選擇權到期之前不太可能出現重大走勢。當然，縱使是如此，銷售者還是要考慮災難性風險（舉例來說，編者的客戶在
    1987 年崩盤期間銷售賣權而發生 $\$5,700$ 萬損失）。


    ## 總結


    （第 9 版附註：重新強調一次，關於此處討論的方法與技巧，除非有充分把握，否則不要輕易嘗試。最好能夠參加期貨與選擇權的正式課程，或徵詢專家的意見。）


    本文主要是讓有意從事選擇權交易的讀者或一般投資人，瞭解市場潛在風險的可怕之處，當然還有對應的重大獲利潛能。如同我在本書其他場合提到的，初學者在實際從事期貨與選擇權交易之前，務必要先有充分的準備。反之，對於那些願意深入研究、累積知識、培養操作技巧的投資人，則可以運用這些交易工具來進行避險。


    對於一般投資人，道瓊指數期貨與其選擇權可以做為投資組合保障或純粹投機的新工具。稍有程度的投資人，就可以透過這些工具執行各種策略。千萬記住，本書談論的投資方法是根本：換言之，即工具的相關知識與運用；謹慎的交易管理；停損設定；留意市場脈動。


    這些工具讓那些最保守的投資人，可以運用過去所不可能執行的保險與避險技巧。


    總之，道瓊指數期貨與選擇權的相關知識，是任何勝任技術投資人或交易者所應該具備的。


