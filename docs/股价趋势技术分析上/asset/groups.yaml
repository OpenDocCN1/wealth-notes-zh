    # 股價趨勢技術分析(上冊)


    走勢圖過去常見的集體操縱痕跡，現在已經比較罕見。某些過去常見的價格排列，目前已經很少發生，變成沒有實務運用上的價值；本書不準備討論這些內容。另一些排列行為稍有變化，或影響所及稍有不同（但基本性質仍然一樣），這些部分我們當然會詳細解說。市場偶爾會出現成交量非常稀少的狀況（無疑是管制冷案造成的後果），使得市場存在更多的「假走勢」(false
    moves)，以及更多單調、沈悶的行情（因此也無利可圖）。可是，整體上來說，市場還是遵循舊有的運作方式，相同的型態還是不斷重複發生。對於投資人與交易者來說，這方面知識的重要性絲毫未減。


    本書第II篇討論市場型態與相關現象的實務運用，以及交易戰術。這都是全新的內容。約翰·馬基（John Magee）在股票市場打滾30多年，最後15年是完全透過技術分析進行投資與交易，他保留數以千計的走勢圖，實際從事的交易高達數百筆，嘗試過各種運用方式，由不同角度檢驗與分析各種可能的方法、戰術與結果。他的生計完全仰賴投資獲利。約翰·馬基的貢獻，是由實際經驗與知識所累積。


