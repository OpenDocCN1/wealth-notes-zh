    # 股價趨勢技術分析 (上冊)


    在短期內可能暫告一段落。


    跌勢發展過程，單日反轉經常發生在恐慌性殺盤走勢末端，通常稱為「高潮日」(climax day) 或「賣壓高潮」(selling climax)。這種表現方式，具有特別意義，我們稍後會討論。現在，先讓我們說明何謂「單日反轉」？


    就成交量來說，單日反轉當天會爆出明顯大量，遠超過最近幾個月來的單日成交量。另外，在單日反轉發生之前，股價曾經出現長期而穩定的漲勢（或跌勢），成交量有逐漸放大的趨勢。當天，市場開盤之後，價格一路走高，氣勢極為強勁。甚至可能以跳空方式開盤，走勢圖留下顯著的缺口。（稍後會討論跳空缺口的意義。）開盤最初一、兩個小時，價格漲幅可能超過平常三、四天的程度。可是，漲勢最終還是停頓了，這可能發生在開盤的一個小時之後，也可能是在下午盤。接著，價格開始「攪拌」，上下波動很有限，但交投仍然十分熱絡。突然之間，趨勢向下反轉，價格下跌速度更甚於上漲。臨收盤前爆出大量，價格被打到開盤水準附近。總之，當天交易出現極端大量，盤中價格可能上下震盪幅度可能到達
    2% 或 3%，價格最後卻收在前一天水準附近。


    頭部的單日反轉，經常出現在走勢曾經很強勁、交投很熱絡的小型股（流通籌碼相對有限）。對於大盤指數來說，峰位很少發生單日反轉。相反地，在不理性或恐慌性殺盤之後，大盤指數經常在底部出現單日反轉（賣壓高潮）。


    如同前文談到的，對於主要趨勢來說，單日反轉沒有太大意義。短線交易者如果手腳夠快、時機拿捏正確，或許可以賺個幾點。可是，一般來說，單日反轉結束之後，並不會立即發生新趨勢；價格通常還需要「工作」一段時間，建立某種型態，才能蓄積足夠力量，發'
