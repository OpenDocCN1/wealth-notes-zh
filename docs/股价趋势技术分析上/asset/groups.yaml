    （第9版附註：本版附錄D的內容大幅擴充，增添很多至為重要的資訊）


    網際網路據說是人類所曾經建構的最複雜系統。這種說法似乎很有道理。複雜、持續蔓延、很有特性，對於每個人都有點幫助，尤其是投資人。有關投資的任何東西，幾乎都可以在網際網路上找到相關網站，它們就像飢渴的怪獸等著吞噬無辜的瀏覽者。經紀人、顧問（技術分析或基本分析）、報紙、雜誌、新聞群組、推銷者、共同基金、共同基金顧問，以及前述所有相關的批評或評估者。還有資料庫供應商、聊天室、電子化市場與交易所、ECNs。投資色情或許是唯一還未開發的領域；裸露選擇權（沒有設定抵補的選擇權部位）不曉得算不算。


    可供運用的資源，幾乎多到無法處理的地步。所以，怎麼辦？對於網路投資人來說，網路提供的服務與功能還可以進一步延伸：報價與資料；投資組合管理與帳務；網路互動繪圖服務、個人數位助理（適用於手機、手提電腦或其他小巧玩意兒）的自動化警訊；分析與建議；電子會議室；沒有仲介人的電子交易所。這方面的資料，請參考本書的附錄D。本章只做概略性討論。思考這些功能的多樣性是一回事，評估其重要性與優先順序則是另一回事。如果我們每個星期才檢視一次投資組合，通常沒有必要採用即時報價系統。同理，對於長期投資人來說，衛星傳遞的交易警訊只是噱頭而已。那些缺乏明確思
    緒與方法的投資人，很容易救被捲入神奇的電子化漩渦，然後被扒掉'
