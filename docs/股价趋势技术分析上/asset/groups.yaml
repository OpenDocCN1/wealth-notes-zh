    # # 鬆散的型態


    多重頭肩排列的成交量型態，大體上也遵守簡單頭肩排列的「法則」。早期發展過程中，成交量很不規則，沒有可資辨認的清楚型態，但後半段將呈現頭肩排列的典型結構。


    多重頭肩排列具有的性质，特別適合技術操作者運用。由於存在相對明顯的對稱傾向，交易者很容易預測排列的後續發展。可是，一旦排列完成之後，就要考驗交易者的耐心了。這些走勢似乎非常不願亦「配合」新趨勢的發展。就這方面來說，分析者經常誤以為自己碰到假訊號而被「耍」了。事實上，除了前文談到的走勢「幅度」之'
