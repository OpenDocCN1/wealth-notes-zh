    # 股價趨勢技術分析 (上冊)


    市場指數會反映投資人的整體活動，包括那些見解最深入、最能夠掌握趨勢與相關資訊的人們，所以指數的每天波動將反映每種已知、可知的事件，以及任何足以影響股票供需條件的因素。即使是完全無法預知的突發事件或天災，一旦發生之後，其可能造成的影響就會立即反映在股價指數之上。


    +   2. 三種趨勢（The Three Trends）： 「市場」是指股票市場的整體價位，最重要的市場趨勢撬動，稱為主要或初級趨勢 (major or
    primary trends)。這屬於長期性上升或下降走勢，通常延伸一年或以上，所造成的整體股價漲幅或跌幅超過20%。主要趨勢發展過程中，會夾著反向的次級
    (secondary) 撬動；換言之，主要趨勢一旦過度延伸，就會產生暫時性折返 (reactions) 或修正 (corrections)。(次級走勢與其間夾雜的主要趨勢波段，合稱為中期走勢[intermediate
    movements]。) 最後，次級趨勢是由小型 (minor) 趨勢或每天波動構成，後者並不重要。


    +   3. 主要趨勢（The Primary Trends）： 如同前一段所做的說明，這是整體性上升或下降走勢，通常（但不必然）持續一年以上，也可能長達數年。只要每波段漲勢的高點都高於前一波漲勢的高點，而且次級折返走勢的低點也高於前一個次級折返的低點，主要趨勢就繼續處於上升狀態。這稱為多頭市場
    (bull market)。反之，如果中期跌勢的低點愈來愈低，中間夾著的反彈高點也愈來愈低，主要趨勢就處於下降狀態。這稱為空頭市場 (bear market)。(多頭與空頭是意義相當鬆散的術語，可以代表任何程度的漲勢或跌勢，但本書只利用這兩個名詞來形容道氏理論的主要趨勢。)
