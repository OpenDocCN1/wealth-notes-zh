    以下討論比較重要的金融理論與實務一般性發展。


    # 選擇權


    1973年，費雪·布莱克（Fisher Black）與其同事麥隆·薛里斯（Myron Scholes）共同發表選擇權訂價模型的相關論文，從此奠定了衍生性產品的訂價基準，也讓這個市場由一無所有，成長為數以兆計的規模。投資人如果不瞭解選擇權，等於是玩半副牌而已。可是，這個主題已經遠超過本書準備處理的範圍，此處只希望提供一些概略性的討論，指引有興趣的讀者做更深入的研究。


    選擇權大約有30%或以上，最後會過期沒有價值。關於選擇權交易，這可能是最值得重視的一項事實。（選擇權有所謂的60－30－10準則：發行的所有選擇權之中，大約60%在到期之前平倉，10%會執行，剩下的30%則過期沒有價值。）另外還有一個事實需要注意：1987年崩盤期間，10月16日按照$0.625價格購買的價外賣權，到了10月19日，價格上漲到每股數百美元（如果你有辦法讓經紀人接電話的話）。（編者有位客戶，當時任職於選擇權研究股份有限公司[Options
    Research, Inc.]，3天之內虧損$5,700萬，差點讓芝加哥某家銀行因此倒閉，因為他裸露銷售太多賣權了。）


    最精明的專業交易者，其生計（非常不錯的生計）是來自選擇權買賣。一些頗有根據的估計顯示，一般從事選擇權交易的散戶投資人，大約有90%發生虧損。另外，一般投資大眾只懂得購買選擇權，不懂得銷售。這兩個事實，似乎可以說明那些選擇權專業交易者為何能夠賺大錢。


    記住前述事實之後，接著由一般投資人的立場，說明選擇權的基本性質。選擇權有許多有用的功能。選擇權可以讓交易者大幅擴張信'
  - '[PAGE 440]


    用；換言之，透過選擇權，同樣資金控制的部位，選擇權的盈虧規模將遠大於純股票部位。所以，選擇權可以是最棒的投機工具。（對於任何投機工具來說，擴張信用幾乎都是特質之一。）可是，我們也可以用很保守的方式運用選擇權；換言之，當做一種保險。舉例來說，如果持有某種證券的多頭部位，可以購買該證券之賣權做為避險部位（請注意，這只是一個例子，並不是明確的建議。任何明智投資者，都應該根據個別情況挑選最有利的策略。）


    有經驗的投資人，也可以利用選擇權來提升投資組合的收益。舉例來說，他可以抵補銷售賣權；對於打算持有的股票，也可以裸露銷售該股票的賣權（如果所銷售的賣權遭到執行，可以低價買進原本就打算持有的股票，否則也可以賺取權利金）。


    選擇權有太多這類的戰術可供玩弄。請注意，是「玩弄」，因為對於一般投資人來說，選擇權可能帶來災難。選擇權玩家具備的操作技巧，不是一般投資人能夠想象的。很多場內交易員可以在腦海裡計算選擇權「理論價值」，只要實際價格與理論價值之間的偏離幅度到達
    $0.625，他們就有辦法賺取其中的差價利潤。編者曾經與最頂尖的選擇權玩家對談，他說的一件事，或許值得讀者深思。這位造市者不經意地說，他的財富是由這些微不足道的差價累積而成。讀者想想，一般投資人如何能夠賺取這種
    $0.625的差價利潤。


    當然，這並不表示一般投資人不得碰觸選擇權，而是說各位如果想要「玩」選擇權的話，務必要有充分的準備。選擇權交易裡面有所謂的多頭價差交易、空頭價差交易與鱷魚價差交易。鱷魚價差交易是否噬客戶資本的一種選擇權策略。


    抵補銷售買權（covered call writing）就屬於這類策略。這種策略被奉為股票投資組合的收益製造機。對於投資人做多的股票，實在沒'
  - '[PAGE 441]


    # 第 17-B 章 投資科技進展


    有道理銷售其買權，除非該股票陷入狹幅盤整區間，而且在選擇權到期之前不會突破。如果股票處在下降趨勢，投資人就應該賣掉股票，而不是銷售其買權。反之，如果銷售上升趨勢之股票的買權，這會被經紀人視為最佳客戶，協助經紀人賺取佣金。如果股票處於漲勢，銷售買權的後果很明顯：銷售者（也就是讀者「您」）會按照選擇權履約價格賣掉股票，喪失股票多頭部位與其未來升值潛能。至於銷售選擇權的權利金收益，雖然不無小補，不過只是「苦中作樂」而已。


    # 計量分析


    投資人還需要知道另一個有關電腦與投資科技的領域，這是一個績效差異更明確、更具獲利潛能的領域，但也是由模型主導的市場：選擇權市場。從事選擇權研究與交易的計量分析者，他們不同於一般的技術分析者。很有趣的，選擇權基本上是透過運算模型決定的市場，但這種衍生性產品的根本資產，卻屬於行為市場的股票。目前有關選擇權交易的訂價模型，都是由布萊克－薛里斯訂價模型演變來的，後者根據
    5 個變數決定股票選擇權的理論價值，這 5 個變數分別為：選擇權履約價格、股票價格、「無風險」利率、選擇權到期期間，以及股票價格波動率。


    目前的衍生性交易產業，都已經普遍接受布萊克－薛里斯訂價模型。本書不準備列舉目前可供交易的衍生性產品種類，因為它們並不是本書想要處理的對象。本節的主要目的，是要警告那些想要「擊敗衍生性市場」的投資人，務必要先做徹底的研究，否則可能會付出慘重代價。


    最初，首先體會選擇權訂價模型之重要性的交易者，徹底擊敗老式交易者，後者是指那些憑著直覺或單純信念（換言之，人類情緒）'
  md: "\n在走勢圖上，而且是可以辨識的。\n\n可是，對於另一種交易工具，電腦則可以提供顯著的效益。選擇權市場是由計價模型主導的市場。從事選擇權交易與分析的計量研究者，他們屬於另一種類型的技術分析者。股票市場本身雖然是由人類情緒主導的市場，但以股票為根本資產的選擇權，其價格則大體上取決於計量（訂價）模型。計量分析者相信（包括編者本人在內），參與者可以運用純粹的計量方法，從事選擇權的交易。根據相關業者的操作結果觀察，這種信念應該是正確的。\n\
    \n對於單純的股票交易者來說，人生沒有那麼單純。股票價格行為是不能透過數學解釋的，價格雖然是用數字表示，除此之外也就跟數學沒有關連，沒有辦法透過簡單方式預測未來走勢。甚至包括馬基的圖形分析，或其他任何形式的分析（技術分析、基本分析、或神祕分析），都不能預測價格未來走向。（由純理論觀點來看，根據圖形分析所進行的每筆交易，都應該視為驗證機率實驗。如果趨勢沒有按照預期發展，實驗很快就結束了。）圖形分析沒有辦法透過機械方式操作，這點非常重要。這也是圖形分析之所以繼續有效的原因。不能透過機械方式操作，就不能有明確的反擊對策，除非是非常明顯的圖形排列，例如：每兩個人都很容易判斷的支撐／壓力。現在，不論是否相信圖形分析，幾乎每個人都看著走勢圖進行交易。如果技術判斷很明顯，業者往往會試圖短暫操縱走勢，讓價格穿越應有的支撐或壓力，造成一般投資人或交易者的困惑，藉以實現獲利。\n\
    \n有人操縱股價，自然會產生錯誤訊號，也就是所謂的多頭陷阱或空頭陷阱。非常有趣的，這些失敗訊號本身，經常就是很可靠的訊號，不過要朝相反方向進行操作。\n\n\
    ## 電腦科技的重要性\n\n電腦可以說是紙漿之後的最重要人類發明。這項神奇的工具，究竟有什麼用途或重要性呢？（市面上有無數的套裝軟體，可以執行下文討論的諸多功能。）電腦如果不能有效辨識適合交易的機會，那還有什麼用呢？\n\
    \n對於馬基分析機構來說，電腦的最重要功能，是自動處理一些重複性的工作。資料可以直接由資料庫下載。只要按幾個鍵，就可以叫出走勢圖。投資組合帳戶的資料處理與報稅工作，都變得相對簡單，操作者可以一邊喝咖啡，一邊操作電腦。這一切讓電腦看起來像是很重要的工具，不過實際上的效用很有限。這種說法也未必貼切。對於馬基分析機構而言，電腦除了處理繁瑣的重複性工作之外，至少還有一項重大功能：投資組合分析。請參考附錄D，該處引用一個相當複雜的例子，說明專業交易者如何進行投資組合分析（布萊·胡爾選擇權研究機構\
    \ [Blair Hull and Options Research Inc.]）。即使是一般投資人運用的相對單純投資組合，也可以受惠於電腦的投資組合管理功能，或是利用網際網路提供的服務，或是直接使用商業套裝軟體（關於這些套裝軟體，請參考附錄D）。\n\
    \n電腦能夠把基本資料透過各種不同形式表達出來，這是另一項有用功能，例如：圈叉圖、陰陽線、收盤價曲線圖；這方面的轉換可以瞬間完成，能夠讓分析者由不同角度觀察資料。某些分析需要電腦提供的資料計量處理能力，譬如：成交量研究，還有移動平均，50天與200天移動平均可以提供一些有趣的資訊。很多市場參與者（包括基本分析者在內）認為這兩條移動平均很重要。謹慎的圖形分析家瞭解，這兩條移動平均與股票市況之間存在明確的關連。\n\
    \n可是，下列這些（名稱怪異的）指標又是什麼東西：隨機指標（stochastics）、包寧傑帶狀（Bollinger Bands）、%R、MACD、移動平均（簡單、指數、穿越……等）、價格／成交量背離指標（price/volume\
    \ Divergence）、RSI（韋達當初設計的單純格式）、VP趨勢（VP Trend）、TCI、OBV、交易帶狀上限／下限（Upper/Lower Trading\
    \ Bands）、ESA交易帶狀（ESA Trading Bands）、ACM DIS？這些指標之中，某些或許有點道理，某些情況下也有點用途。正如同我們瞭解的，任何交易系統至少在兩種情況下，可以展現完美的功能：研究階段與大多頭市場。那些市場上推崇的交易天才，經常是憑透過這類數據導向的指標而聞名。本書前任編輯曾經簡單探討這類指標，請參考附錄C。第9版附註：另外，如同我所說的，你也可以利用螺絲起子來釘鐵釘。工具發明者可能獲致重大成功，但其他使用者可能因此破產。\n\
    \n這些指標提供的，很可能是多餘的資訊，就像基本分析提供的多餘資訊一樣，經常遮掩了真正重要的東西，讓投資人看不到那些會真正影響交易結果的資訊。投資人或許還是應該採用行為模型，因為市場反映的是人類行為。數據導向的技術分析讓人看了眼花撩亂，就像強生博士用後腳走路狗，往往不能把市場擺在適當的架構上。唯有「人」才能辦到這點。數據導向模型畢竟沒有考慮很多因素，包括：裙子長度、月亮圓缺、太陽黑子、經濟循環，以及市場的多空狀態（如果空頭市場還存在的話）第9版附註：這是相當諷刺的評論，寫在2000年崩盤之前。總之，人類大腦仍然是唯一能夠綜合評估所有定量、定性資訊的工具，很多東西是沒有辦法簡化為0與1。受過適當訓練的人，仍然是衡量市況與股價狀態的最佳判定者。\n\
    \n![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_432_0.png)\n\n## 摘要結論1\n\n電腦是一種工具，雖然功能非常強大，但仍然是一種工具。電腦不具備解決問題或擬定決策的智慧。我們可以用怪手來挖土，但怪手本身不能決定在哪裡挖土。\n\
    \n我們應該以懷疑的態度看待這些無奇不有的指標與系統，把它們擺在圖形分析的架構內評估。對於發明者或其他使用者，這些指標或許很適用，但對於你或我，可能只是徒增困擾，即使我們曾經深入研究其歷史績效紀錄也一樣。\n\
    \n所以，對於所採用的分析方法，有經驗的投資人都會儘量保持單純，直到他確實瞭解某種技巧、方法或指標，才會將其納入運用。更重要者，關於哪種方法或指標適用，每個人都必須根據自身的條件做評估。\n\
    \n### 對於圖形分析者與其他投資人都很重要的其他技術發展\n\n電腦並不是唯一值得留意的科技發展，投資人還需要考慮多種資訊科技革命。大體上來說，這包含：網際網路與其相關功能，電子市場的發展，金融投資理論與實務的進步。最後這部分，將在第17.2章處理。\n\
    \n這些領域的相關範圍實在太廣，我們不可能在此做深入處理，只能提供一般或概括的評論，讓投資人能夠由適當角度看待這些問題。另外，讀者如果想要做進一步研究，請參考本書附錄D提供的資料。\n\
    \n首先考慮幾個問題。是否有任何科技發展，使得圖形分析變得更適時？答案是否定的。是否有任何科技發展，使得交易保證成功？答案也是否定的。我們惟一可以確定的是，很多騙子還會繼續推銷那些絕對有效的方法。投資人如果相信這類推銷花招，只能怪自己太過幼稚。\n\
    \n# 網際網路：現代事件的第八奇景\n\n（第9版附註：本版附錄D的內容大幅擴充，增添很多至為重要的資訊）\n\n網際網路據說是人類所曾經建構的最複雜系統。這種說法似乎很有道理。複雜、持續蔓延、很有特性，對於每個人都有點幫助，尤其是投資人。有關投資的任何東西，幾乎都可以在網際網路上找到相關網站，它們就像飢渴的怪獸等著吞噬無辜的瀏覽者。經紀人、顧問（技術分析或基本分析）、報紙、雜誌、新聞群組、推銷者、共同基金、共同基金顧問，以及前述所有相關的批評或評估者。還有資料庫供應商、聊天室、電子化市場與交易所、ECNs。投資色情或許是唯一還未開發的領域；裸露選擇權（沒有設定抵補的選擇權部位）不曉得算不算。\n\
    \n可供運用的資源，幾乎多到無法處理的地步。所以，怎麼辦？對於網路投資人來說，網路提供的服務與功能還可以進一步延伸：報價與資料；投資組合管理與帳務；網路互動繪圖服務、個人數位助理（適用於手機、手提電腦或其他小巧玩意兒）的自動化警訊；分析與建議；電子會議室；沒有仲介人的電子交易所。這方面的資料，請參考本書的附錄D。本章只做概略性討論。思考這些功能的多樣性是一回事，評估其重要性與優先順序則是另一回事。如果我們每個星期才檢視一次投資組合，通常沒有必要採用即時報價系統。同理，對於長期投資人來說，衛星傳遞的交易警訊只是噱頭而已。那些缺乏明確思緒與方法的投資人，很容易就被捲入神奇的電子化漩渦，然後被扒掉好幾層皮，最後才落得更精明一些。\n\
    \n對於一般頭腦清楚的投資人，這些服務與產品之中，哪些是具有重要性呢？哪些是需要的呢？投資人需要資料、圖形與交易管道。滑鼠點一下，就可以取得資料。再點一下，圖形就顯示在電腦螢幕上。最後再點一下，交易就完成了。處在網際網路時代，描述這些程序，就像實際在桌上型電腦與網路連線上執行這些動作。這種非常簡單的程序（不加思考地說起來比較簡單），其展示可以參考本書附錄D提供的連結。交易需要透過某種型態的經紀人進行，或許是電子虛擬經紀人，也可能透過電話聯絡實體經紀人。透過電腦，电子化交易場所不久將（或已經）取代造市者或專業報價商。\n\
    \n經紀人還能夠存在多久，答案會在本世紀揭曉。（經紀人這個行業會繼續存在，而且也繼續受到歡迎。）那些不需經紀人或專業報價員的電子市場，目前已經逐漸普遍化（參考附錄D）；對於一般投資人來說，這類電子市場顯然優於傳統交易大廳，後者讓專業交易員享有顯著的優勢。就整個初步發展判斷，在相關問題逐步獲得解決之前，情況還會很混亂，充滿風險與機會。\n\
    \n採用電子交易指令，不論是傳遞到電子交易所或紐約證券交易所，顯然都勝過口頭交易指令。對於登錄有案的電子形式指令，內容通常不會引起爭議，口頭交易指令的情況則不同，經紀人與客戶的解釋可能存在差異。另外，交易者只處理一次資料（而不是進行分析，打電話給經紀人，登錄交易，然後把交易轉到投資組合內）。如果只是敲個按鍵，整筆交易就透過套裝軟體進行；這種情況下，如果發生錯誤，很容易追蹤。採用人工方式，每個步驟都可能出差錯。萬一發生錯誤，損失可能非常嚴重。\n\
    \n電腦帶來的效率與方便，是非常值得肯定的：自動化交易程序，避免發生混淆，方便稽核相關紀錄，自動化投資組合管理，投資組合自動根據市價結算價值（這點可能最重要）。根據市價進行結算，這是評估投資組合採用的標準方法；換言之，不論部位是否結束，都根據當時的市場價格結算投資組合價值。\n\
    \n# 根據市價進行結算\n\n這本書的書名或許可以稱為《技術分析藝術禪理》，雖然聽起來似乎有些陳腔濫調，但確實傳遞了射箭藝術的禪理，強調現實與目前時刻的重要性。在《華爾街一般語義學》（The\
    \ General Semantics of Wall Street，現在改名為《華爾街心理戰》，Winning the Mental Game on Wall\
    \ Street）一書中，約翰·馬基相當嚴厲地批評投資人的腦海裡，經常保留兩種帳冊，一種專門記錄獲利，不論已經或尚未實現的獲利在內，一種專門記錄虧損，但只記錄已經實現的虧損。換言之，在該筆交易還沒有結束之前，尚未實現的虧損，都不算真正虧損。電子化投資組合帳戶拒絕玩這種「自欺欺人」的遊戲，所以很值得推薦。當電腦與資料庫或經紀公司連線，投資組合就自動按照市價進行結算，如此就很難假裝虧損沒有發生，投資人會看到交易帳戶的實際狀況，不論是已經實現或尚未實現的盈虧。\n\
    \n# 分辨粗糠與穀粒\n\n面對著電子交易與數字導向技術分析的誘惑，眼光銳利的投資人必須知道如何分辨粗糠與穀粒。玩弄著各種玩具，很多自詡為大師的人發表各種見解，還有各種「研究分析」資料，這一切可能取代交易獲利真正應該做的事。事實上，馬基式分析者應該處理的研究，本書基本上都提到了。\n\
    \n### 粗糙\n\n聊天室、網路推銷、新聞、預測、解盤、經紀商提供的買進-賣出-持有有強烈持有-小買-大買-或任何其他推薦，都屬於不可取的粗糙。千萬不要忘記，經紀商是透過證券交易賺取收入的；客戶買賣股票，證券商才有收入。事實上，經紀商的最主要客戶是法人機構，經紀商經常幫這些法人客戶銷售股票，轉賣給一般散戶，收取鉅額的服務費用。這是赤裸裸的利益衝突，問題也在2000年初爆發，很多人遭受鉅額罰款，甚至關入監牢。在柯林頓擔任總統的1990年代大多頭市場，這一切都進行得很平順。可是，一旦進入空頭市場，問題全部爆發了，各種旁門左道的花招全部失靈。（第9版附註：2000年初出現一波嚴厲的空頭市場，任何人只要閱讀edwards—magee.com網站發行的約翰·馬基投資通訊，就知道馬基圖形分析精準判斷這段行情。）\n\
    \n# 摘要結論2\n\n- 回顧整個股票市場發展史，散戶投資人從來沒有這麼多資源可供運用。充分運用這些資源，電腦屬於必要工具。\n- 只要很少花費（或全然免費）就可以透過網際網路或撥接方式，自動取得交易資料。\n\
    - 投資人想像得到的各種服務，網路上都提供，由投資組合帳務，乃至於隨身攜帶的交易警訊工具（呼叫器、手持PDA或其他等等）。\n- 某些隨身攜帶器材，甚至可以提供即時報價資訊，讓一些搞不清楚狀況的投資人，可以「即時」破產。\n\
    - 我們也可以在網際網路上找到各種分析，由可敬的技術分析（經常太過複雜），乃至於「通靈」。\n- 網路聊天室可以提供各種即時的推銷或謠言，傳遞各種令人印象深刻的花招。可是，如同我們預期的，對於本書讀者來說，全然無用。\n\
    - 最重要者，資訊革命與電腦可以提供：\n  1. 分析者不需從事一些重複性的工作，加速分析程序：資料收集、繪製圖形、投資組合帳務處理、分析與報稅。\n \
    \ 2. 讓分析者能夠輕鬆處理投資組合帳務，每天按照市價結算帳戶淨值。如同馬基說的，避免投資人把現金與應計帳務弄混淆。\n  3. 從事一些過去難以想像的工作。分析的股票數量幾乎完全不受限制。至於如何透過電腦篩選交易對象，請參考第21章「圖形選股策略」。\n\
    \  4. 允許投資人透過ECNs或電子市場進行交易，這些管道沒有實際的交易大廳，也沒有專業交易員玩弄報價。\n\n# 第17-B章 投資科技進展\n\n\
    ## 第I節 金融理論與實務發展\n\n網際網絡上散播著無數有害或無用的發明、服務與產品；可是，現代金融理論與科技還是很重要的，一般投資人有必要瞭解相關發展。本章準備討論這方面的最基本知識，這也是一般進階投資人應該知道的東西。另外，讀者如果想要進一步研究，此處也提供參考資料。\n\
    \n某些目前很普遍的交易工具，在愛德華與馬基的時代，其運用非常有限。對於這些交易工具，最重要者包括：個別股票選擇權、股價指數期貨、期貨選擇權、股價指數選擇權、證券化股價指數……等。目前，投資人可以針對股價指數進行交易或避險，這無疑是現代金融市場的最重要發展之一。這些產品之中，芝加哥期貨交易所（CBOT）設計的一些工具最重要，包括：道瓊工業指數期貨與道瓊工業指數期貨選擇權，細節資料請參考本章第II節。（第9版附註：美國證交所[AMEX]的股票指數基金[ishares]也很重要，尤其是DIA、SPY與QQQQ，讓一般投資人可以持有指數型產品。）\n\
    \n以下討論比較重要的金融理論與實務一般性發展。\n\n## 選擇權\n\n1973年，費雪·布莱克（Fisher Black）與其同事麥隆·薛里斯（Myron\
    \ Scholes）共同發表選擇權訂價模型的相關論文，從此奠定了衍生性產品的訂價基準，也讓這個市場由一無所有，成長為數以兆計的規模。投資人如果不瞭解選擇權，等於是玩半副牌而已。可是，這個主題已經遠超過本書準備處理的範圍，此處只希望提供一些概略性的討論，指引有興趣的讀者做更深入的研究。\n\
    \n選擇權大約有30%或以上，最後會過期沒有價值。關於選擇權交易，這可能是最值得重視的一項事實。（選擇權有所謂的60－30－10準則：發行的所有選擇權之中，大約60%在到期之前平倉，10%會執行，剩下的30%則過期沒有價值。）另外還有一個事實需要注意：1987年崩盤期間，10月16日按照$0.625價格購買的價外賣權，到了10月19日，價格上漲到每股數百美元（如果你有辦法讓經紀人接電話的話）。（編者有位客戶，當時任職於選擇權研究股份有限公司[Options\
    \ Research, Inc.]，3天之內虧損$5,700萬，差點讓芝加哥某家銀行因此倒閉，因為他裸露銷售太多賣權了。）\n\n最精明的專業交易者，其生計（非常不錯的生計）是來自選擇權買賣。一些頗有根據的估計顯示，一般從事選擇權交易的散戶投資人，大約有90%發生虧損。另外，一般投資大眾只懂得購買選擇權，不懂得銷售。這兩個事實，似乎可以說明那些選擇權專業交易者為何能夠賺大錢。\n\
    \n記住前述事實之後，接著由一般投資人的立場，說明選擇權的基本性質。選擇權有許多有用的功能。選擇權可以讓交易者大幅擴張信用；換言之，透過選擇權，同樣資金控制的部位，選擇權的盈虧規模將遠大於純股票部位。所以，選擇權可以是最棒的投機工具。（對於任何投機工具來說，擴張信用幾乎都是特質之一。）可是，我們也可以用很保守的方式運用選擇權；換言之，當做一種保險。舉例來說，如果持有某種證券的多頭部位，可以購買該證券之賣權做為避險部位（請注意，這只是一個例子，並不是明確的建議。任何明智投資者，都應該根據個別情況挑選最有利的策略。）\n\
    \n有經驗的投資人，也可以利用選擇權來提升投資組合的收益。舉例來說，他可以抵補銷售賣權；對於打算持有的股票，也可以裸露銷售該股票的賣權（如果所銷售的賣權遭到執行，可以低價買進原本就打算持有的股票，否則也可以賺取權利金）。\n\
    \n選擇權有太多這類的戰術可供玩弄。請注意，是「玩弄」，因為對於一般投資人來說，選擇權可能帶來災難。選擇權玩家具備的操作技巧，不是一般投資人能夠想象的。很多場內交易員可以在腦海裡計算選擇權「理論價值」，只要實際價格與理論價值之間的偏離幅度到達\
    \ $0.625，他們就有辦法賺取其中的差價利潤。編者曾經與最頂尖的選擇權玩家對談，他說的一件事，或許值得讀者深思。這位造市者不經意地說，他的財富是由這些微不足道的差價累積而成。讀者想想，一般投資人如何能夠賺取這種\
    \ $0.625的差價利潤。\n\n當然，這並不表示一般投資人不得碰觸選擇權，而是說各位如果想要「玩」選擇權的話，務必要有充分的準備。選擇權交易裡面有所謂的多頭價差交易、空頭價差交易與鱷魚價差交易。鱷魚價差交易是否噬客戶資本的一種選擇權策略。\n\
    \n抵補銷售買權（covered call writing）就屬於這類策略。這種策略被奉為股票投資組合的收益製造機。對於投資人做多的股票，實在沒有道理銷售其買權，除非該股票陷入狹幅盤整區間，而且在選擇權到期之前不會突破。如果股票處在下降趨勢，投資人就應該賣掉股票，而不是銷售其買權。反之，如果銷售上升趨勢之股票的買權，這會被經紀人視為最佳客戶，協助經紀人賺取佣金。如果股票處於漲勢，銷售買權的後果很明顯：銷售者（也就是讀者「您」）會按照選擇權履約價格賣掉股票，喪失股票多頭部位與其未來升值潛能。至於銷售選擇權的權利金收益，雖然不無小補，不過只是「苦中作樂」而已。\n\
    \n## 計量分析\n\n投資人還需要知道另一個有關電腦與投資科技的領域，這是一個績效差異更明確、更具獲利潛能的領域，但也是由模型主導的市場：選擇權市場。從事選擇權研究與交易的計量分析者，他們不同於一般的技術分析者。很有趣的，選擇權基本上是透過運算模型決定的市場，但這種衍生性產品的根本資產，卻屬於行為市場的股票。目前有關選擇權交易的訂價模型，都是由布萊克－薛里斯訂價模型演變來的，後者根據\
    \ 5 個變數決定股票選擇權的理論價值，這 5 個變數分別為：選擇權履約價格、股票價格、「無風險」利率、選擇權到期期間，以及股票價格波動率。\n\n目前的衍生性交易產業，都已經普遍接受布萊克－薛里斯訂價模型。本書不準備列舉目前可供交易的衍生性產品種類，因為它們並不是本書想要處理的對象。本節的主要目的，是要警告那些想要「擊敗衍生性市場」的投資人，務必要先做徹底的研究，否則可能會付出慘重代價。\n\
    \n最初，首先體會選擇權訂價模型之重要性的交易者，徹底擊敗老式交易者，後者是指那些憑著直覺或單純信念（換言之，人類情緒）\n"
  mdcn: "\n在走勢圖上，而且是可以辨識的。\n\n可是，對於另一種交易工具，電腦則可以提供顯著的效益。選擇權市場是由計價模型主導的市場。從事選擇權交易與分析的計量研究者，他們屬於另一種類型的技術分析者。股票市場本身雖然是由人類情緒主導的市場，但以股票為根本資產的選擇權，其價格則大體上取決於計量（訂價）模型。計量分析者相信（包括編者本人在內），參與者可以運用純粹的計量方法，從事選擇權的交易。根據相關業者的操作結果觀察，這種信念應該是正確的。\n\
    \n對於單純的股票交易者來說，人生沒有那麼單純。股票價格行為是不能透過數學解釋的，價格雖然是用數字表示，除此之外也就跟數學沒有關連，沒有辦法透過簡單方式預測未來走勢。甚至包括馬基的圖形分析，或其他任何形式的分析（技術分析、基本分析、或神祕分析），都不能預測價格未來走向。（由純理論觀點來看，根據圖形分析所進行的每筆交易，都應該視為驗證機率實驗。如果趨勢沒有按照預期發展，實驗很快就結束了。）圖形分析沒有辦法透過機械方式操作，這點非常重要。這也是圖形分析之所以繼續有效的原因。不能透過機械方式操作，就不能有明確的反擊對策，除非是非常明顯的圖形排列，例如：每兩個人都很容易判斷的支撐／壓力。現在，不論是否相信圖形分析，幾乎每個人都看著走勢圖進行交易。如果技術判斷很明顯，業者往往會試圖短暫操縱走勢，讓價格穿越應有的支撐或壓力，造成一般投資人或交易者的困惑，藉以實現獲利。\n\
    \n有人操縱股價，自然會產生錯誤訊號，也就是所謂的多頭陷阱或空頭陷阱。非常有趣的，這些失敗訊號本身，經常就是很可靠的訊號，不過要朝相反方向進行操作。\n\n\
    ## 電腦科技的重要性\n\n電腦可以說是紙漿之後的最重要人類發明。這項神奇的工具，究竟有什麼用途或重要性呢？（市面上有無數的套裝軟體，可以執行下文討論的諸多功能。）電腦如果不能有效辨識適合交易的機會，那還有什麼用呢？\n\
    \n對於馬基分析機構來說，電腦的最重要功能，是自動處理一些重複性的工作。資料可以直接由資料庫下載。只要按幾個鍵，就可以叫出走勢圖。投資組合帳戶的資料處理與報稅工作，都變得相對簡單，操作者可以一邊喝咖啡，一邊操作電腦。這一切讓電腦看起來像是很重要的工具，不過實際上的效用很有限。這種說法也未必貼切。對於馬基分析機構而言，電腦除了處理繁瑣的重複性工作之外，至少還有一項重大功能：投資組合分析。請參考附錄D，該處引用一個相當複雜的例子，說明專業交易者如何進行投資組合分析（布萊·胡爾選擇權研究機構\
    \ [Blair Hull and Options Research Inc.]）。即使是一般投資人運用的相對單純投資組合，也可以受惠於電腦的投資組合管理功能，或是利用網際網路提供的服務，或是直接使用商業套裝軟體（關於這些套裝軟體，請參考附錄D）。\n\
    \n電腦能夠把基本資料透過各種不同形式表達出來，這是另一項有用功能，例如：圈叉圖、陰陽線、收盤價曲線圖；這方面的轉換可以瞬間完成，能夠讓分析者由不同角度觀察資料。某些分析需要電腦提供的資料計量處理能力，譬如：成交量研究，還有移動平均，50天與200天移動平均可以提供一些有趣的資訊。很多市場參與者（包括基本分析者在內）認為這兩條移動平均很重要。謹慎的圖形分析家瞭解，這兩條移動平均與股票市況之間存在明確的關連。\n\
    \n可是，下列這些（名稱怪異的）指標又是什麼東西：隨機指標（stochastics）、包寧傑帶狀（Bollinger Bands）、%R、MACD、移動平均（簡單、指數、穿越……等）、價格／成交量背離指標（price/volume\
    \ Divergence）、RSI（韋達當初設計的單純格式）、VP趨勢（VP Trend）、TCI、OBV、交易帶狀上限／下限（Upper/Lower Trading\
    \ Bands）、ESA交易帶狀（ESA Trading Bands）、ACM DIS？這些指標之中，某些或許有點道理，某些情況下也有點用途。正如同我們瞭解的，任何交易系統至少在兩種情況下，可以展現完美的功能：研究階段與大多頭市場。那些市場上推崇的交易天才，經常是憑透過這類數據導向的指標而聞名。本書前任編輯曾經簡單探討這類指標，請參考附錄C。第9版附註：另外，如同我所說的，你也可以利用螺絲起子來釘鐵釘。工具發明者可能獲致重大成功，但其他使用者可能因此破產。\n\
    \n這些指標提供的，很可能是多餘的資訊，就像基本分析提供的多餘資訊一樣，經常遮掩了真正重要的東西，讓投資人看不到那些會真正影響交易結果的資訊。投資人或許還是應該採用行為模型，因為市場反映的是人類行為。數據導向的技術分析讓人看了眼花撩亂，就像強生博士用後腳走路狗，往往不能把市場擺在適當的架構上。唯有「人」才能辦到這點。數據導向模型畢竟沒有考慮很多因素，包括：裙子長度、月亮圓缺、太陽黑子、經濟循環，以及市場的多空狀態（如果空頭市場還存在的話）第9版附註：這是相當諷刺的評論，寫在2000年崩盤之前。總之，人類大腦仍然是唯一能夠綜合評估所有定量、定性資訊的工具，很多東西是沒有辦法簡化為0與1。受過適當訓練的人，仍然是衡量市況與股價狀態的最佳判定者。\n\
    \n![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_432_0.png)\n\n## 摘要結論1\n\n電腦是一種工具，雖然功能非常強大，但仍然是一種工具。電腦不具備解決問題或擬定決策的智慧。我們可以用怪手來挖土，但怪手本身不能決定在哪裡挖土。\n\
    \n我們應該以懷疑的態度看待這些無奇不有的指標與系統，把它們擺在圖形分析的架構內評估。對於發明者或其他使用者，這些指標或許很適用，但對於你或我，可能只是徒增困擾，即使我們曾經深入研究其歷史績效紀錄也一樣。\n\
    \n所以，對於所採用的分析方法，有經驗的投資人都會儘量保持單純，直到他確實瞭解某種技巧、方法或指標，才會將其納入運用。更重要者，關於哪種方法或指標適用，每個人都必須根據自身的條件做評估。\n\
    \n### 對於圖形分析者與其他投資人都很重要的其他技術發展\n\n電腦並不是唯一值得留意的科技發展，投資人還需要考慮多種資訊科技革命。大體上來說，這包含：網際網路與其相關功能，電子市場的發展，金融投資理論與實務的進步。最後這部分，將在第17.2章處理。\n\
    \n這些領域的相關範圍實在太廣，我們不可能在此做深入處理，只能提供一般或概括的評論，讓投資人能夠由適當角度看待這些問題。另外，讀者如果想要做進一步研究，請參考本書附錄D提供的資料。\n\
    \n首先考慮幾個問題。是否有任何科技發展，使得圖形分析變得更適時？答案是否定的。是否有任何科技發展，使得交易保證成功？答案也是否定的。我們惟一可以確定的是，很多騙子還會繼續推銷那些絕對有效的方法。投資人如果相信這類推銷花招，只能怪自己太過幼稚。\n\
    \n# 網際網路：現代事件的第八奇景\n\n（第9版附註：本版附錄D的內容大幅擴充，增添很多至為重要的資訊）\n\n網際網路據說是人類所曾經建構的最複雜系統。這種說法似乎很有道理。複雜、持續蔓延、很有特性，對於每個人都有點幫助，尤其是投資人。有關投資的任何東西，幾乎都可以在網際網路上找到相關網站，它們就像飢渴的怪獸等著吞噬無辜的瀏覽者。經紀人、顧問（技術分析或基本分析）、報紙、雜誌、新聞群組、推銷者、共同基金、共同基金顧問，以及前述所有相關的批評或評估者。還有資料庫供應商、聊天室、電子化市場與交易所、ECNs。投資色情或許是唯一還未開發的領域；裸露選擇權（沒有設定抵補的選擇權部位）不曉得算不算。\n\
    \n可供運用的資源，幾乎多到無法處理的地步。所以，怎麼辦？對於網路投資人來說，網路提供的服務與功能還可以進一步延伸：報價與資料；投資組合管理與帳務；網路互動繪圖服務、個人數位助理（適用於手機、手提電腦或其他小巧玩意兒）的自動化警訊；分析與建議；電子會議室；沒有仲介人的電子交易所。這方面的資料，請參考本書的附錄D。本章只做概略性討論。思考這些功能的多樣性是一回事，評估其重要性與優先順序則是另一回事。如果我們每個星期才檢視一次投資組合，通常沒有必要採用即時報價系統。同理，對於長期投資人來說，衛星傳遞的交易警訊只是噱頭而已。那些缺乏明確思緒與方法的投資人，很容易就被捲入神奇的電子化漩渦，然後被扒掉好幾層皮，最後才落得更精明一些。\n\
    \n對於一般頭腦清楚的投資人，這些服務與產品之中，哪些是具有重要性呢？哪些是需要的呢？投資人需要資料、圖形與交易管道。滑鼠點一下，就可以取得資料。再點一下，圖形就顯示在電腦螢幕上。最後再點一下，交易就完成了。處在網際網路時代，描述這些程序，就像實際在桌上型電腦與網路連線上執行這些動作。這種非常簡單的程序（不加思考地說起來比較簡單），其展示可以參考本書附錄D提供的連結。交易需要透過某種型態的經紀人進行，或許是電子虛擬經紀人，也可能透過電話聯絡實體經紀人。透過電腦，电子化交易場所不久將（或已經）取代造市者或專業報價商。\n\
    \n經紀人還能夠存在多久，答案會在本世紀揭曉。（經紀人這個行業會繼續存在，而且也繼續受到歡迎。）那些不需經紀人或專業報價員的電子市場，目前已經逐漸普遍化（參考附錄D）；對於一般投資人來說，這類電子市場顯然優於傳統交易大廳，後者讓專業交易員享有顯著的優勢。就整個初步發展判斷，在相關問題逐步獲得解決之前，情況還會很混亂，充滿風險與機會。\n\
    \n採用電子交易指令，不論是傳遞到電子交易所或紐約證券交易所，顯然都勝過口頭交易指令。對於登錄有案的電子形式指令，內容通常不會引起爭議，口頭交易指令的情況則不同，經紀人與客戶的解釋可能存在差異。另外，交易者只處理一次資料（而不是進行分析，打電話給經紀人，登錄交易，然後把交易轉到投資組合內）。如果只是敲個按鍵，整筆交易就透過套裝軟體進行；這種情況下，如果發生錯誤，很容易追蹤。採用人工方式，每個步驟都可能出差錯。萬一發生錯誤，損失可能非常嚴重。\n\
    \n電腦帶來的效率與方便，是非常值得肯定的：自動化交易程序，避免發生混淆，方便稽核相關紀錄，自動化投資組合管理，投資組合自動根據市價結算價值（這點可能最重要）。根據市價進行結算，這是評估投資組合採用的標準方法；換言之，不論部位是否結束，都根據當時的市場價格結算投資組合價值。\n\
    \n# 根據市價進行結算\n\n這本書的書名或許可以稱為《技術分析藝術禪理》，雖然聽起來似乎有些陳腔濫調，但確實傳遞了射箭藝術的禪理，強調現實與目前時刻的重要性。在《華爾街一般語義學》（The\
    \ General Semantics of Wall Street，現在改名為《華爾街心理戰》，Winning the Mental Game on Wall\
    \ Street）一書中，約翰·馬基相當嚴厲地批評投資人的腦海裡，經常保留兩種帳冊，一種專門記錄獲利，不論已經或尚未實現的獲利在內，一種專門記錄虧損，但只記錄已經實現的虧損。換言之，在該筆交易還沒有結束之前，尚未實現的虧損，都不算真正虧損。電子化投資組合帳戶拒絕玩這種「自欺欺人」的遊戲，所以很值得推薦。當電腦與資料庫或經紀公司連線，投資組合就自動按照市價進行結算，如此就很難假裝虧損沒有發生，投資人會看到交易帳戶的實際狀況，不論是已經實現或尚未實現的盈虧。\n\
    \n# 分辨粗糠與穀粒\n\n面對著電子交易與數字導向技術分析的誘惑，眼光銳利的投資人必須知道如何分辨粗糠與穀粒。玩弄著各種玩具，很多自詡為大師的人發表各種見解，還有各種「研究分析」資料，這一切可能取代交易獲利真正應該做的事。事實上，馬基式分析者應該處理的研究，本書基本上都提到了。\n\
    \n### 粗糙\n\n聊天室、網路推銷、新聞、預測、解盤、經紀商提供的買進-賣出-持有有強烈持有-小買-大買-或任何其他推薦，都屬於不可取的粗糙。千萬不要忘記，經紀商是透過證券交易賺取收入的；客戶買賣股票，證券商才有收入。事實上，經紀商的最主要客戶是法人機構，經紀商經常幫這些法人客戶銷售股票，轉賣給一般散戶，收取鉅額的服務費用。這是赤裸裸的利益衝突，問題也在2000年初爆發，很多人遭受鉅額罰款，甚至關入監牢。在柯林頓擔任總統的1990年代大多頭市場，這一切都進行得很平順。可是，一旦進入空頭市場，問題全部爆發了，各種旁門左道的花招全部失靈。（第9版附註：2000年初出現一波嚴厲的空頭市場，任何人只要閱讀edwards—magee.com網站發行的約翰·馬基投資通訊，就知道馬基圖形分析精準判斷這段行情。）\n\
    \n# 摘要結論2\n\n- 回顧整個股票市場發展史，散戶投資人從來沒有這麼多資源可供運用。充分運用這些資源，電腦屬於必要工具。\n- 只要很少花費（或全然免費）就可以透過網際網路或撥接方式，自動取得交易資料。\n\
    - 投資人想像得到的各種服務，網路上都提供，由投資組合帳務，乃至於隨身攜帶的交易警訊工具（呼叫器、手持PDA或其他等等）。\n- 某些隨身攜帶器材，甚至可以提供即時報價資訊，讓一些搞不清楚狀況的投資人，可以「即時」破產。\n\
    - 我們也可以在網際網路上找到各種分析，由可敬的技術分析（經常太過複雜），乃至於「通靈」。\n- 網路聊天室可以提供各種即時的推銷或謠言，傳遞各種令人印象深刻的花招。可是，如同我們預期的，對於本書讀者來說，全然無用。\n\
    - 最重要者，資訊革命與電腦可以提供：\n  1. 分析者不需從事一些重複性的工作，加速分析程序：資料收集、繪製圖形、投資組合帳務處理、分析與報稅。\n \
    \ 2. 讓分析者能夠輕鬆處理投資組合帳務，每天按照市價結算帳戶淨值。如同馬基說的，避免投資人把現金與應計帳務弄混淆。\n  3. 從事一些過去難以想像的工作。分析的股票數量幾乎完全不受限制。至於如何透過電腦篩選交易對象，請參考第21章「圖形選股策略」。\n\
    \  4. 允許投資人透過ECNs或電子市場進行交易，這些管道沒有實際的交易大廳，也沒有專業交易員玩弄報價。\n\n# 第17-B章 投資科技進展\n\n\
    ## 第I節 金融理論與實務發展\n\n網際網絡上散播著無數有害或無用的發明、服務與產品；可是，現代金融理論與科技還是很重要的，一般投資人有必要瞭解相關發展。本章準備討論這方面的最基本知識，這也是一般進階投資人應該知道的東西。另外，讀者如果想要進一步研究，此處也提供參考資料。\n\
    \n某些目前很普遍的交易工具，在愛德華與馬基的時代，其運用非常有限。對於這些交易工具，最重要者包括：個別股票選擇權、股價指數期貨、期貨選擇權、股價指數選擇權、證券化股價指數……等。目前，投資人可以針對股價指數進行交易或避險，這無疑是現代金融市場的最重要發展之一。這些產品之中，芝加哥期貨交易所（CBOT）設計的一些工具最重要，包括：道瓊工業指數期貨與道瓊工業指數期貨選擇權，細節資料請參考本章第II節。（第9版附註：美國證交所[AMEX]的股票指數基金[ishares]也很重要，尤其是DIA、SPY與QQQQ，讓一般投資人可以持有指數型產品。）\n\
    \n以下討論比較重要的金融理論與實務一般性發展。\n\n## 選擇權\n\n1973年，費雪·布莱克（Fisher Black）與其同事麥隆·薛里斯（Myron\
    \ Scholes）共同發表選擇權訂價模型的相關論文，從此奠定了衍生性產品的訂價基準，也讓這個市場由一無所有，成長為數以兆計的規模。投資人如果不瞭解選擇權，等於是玩半副牌而已。可是，這個主題已經遠超過本書準備處理的範圍，此處只希望提供一些概略性的討論，指引有興趣的讀者做更深入的研究。\n\
    \n選擇權大約有30%或以上，最後會過期沒有價值。關於選擇權交易，這可能是最值得重視的一項事實。（選擇權有所謂的60－30－10準則：發行的所有選擇權之中，大約60%在到期之前平倉，10%會執行，剩下的30%則過期沒有價值。）另外還有一個事實需要注意：1987年崩盤期間，10月16日按照$0.625價格購買的價外賣權，到了10月19日，價格上漲到每股數百美元（如果你有辦法讓經紀人接電話的話）。（編者有位客戶，當時任職於選擇權研究股份有限公司[Options\
    \ Research, Inc.]，3天之內虧損$5,700萬，差點讓芝加哥某家銀行因此倒閉，因為他裸露銷售太多賣權了。）\n\n最精明的專業交易者，其生計（非常不錯的生計）是來自選擇權買賣。一些頗有根據的估計顯示，一般從事選擇權交易的散戶投資人，大約有90%發生虧損。另外，一般投資大眾只懂得購買選擇權，不懂得銷售。這兩個事實，似乎可以說明那些選擇權專業交易者為何能夠賺大錢。\n\
    \n記住前述事實之後，接著由一般投資人的立場，說明選擇權的基本性質。選擇權有許多有用的功能。選擇權可以讓交易者大幅擴張信用；換言之，透過選擇權，同樣資金控制的部位，選擇權的盈虧規模將遠大於純股票部位。所以，選擇權可以是最棒的投機工具。（對於任何投機工具來說，擴張信用幾乎都是特質之一。）可是，我們也可以用很保守的方式運用選擇權；換言之，當做一種保險。舉例來說，如果持有某種證券的多頭部位，可以購買該證券之賣權做為避險部位（請注意，這只是一個例子，並不是明確的建議。任何明智投資者，都應該根據個別情況挑選最有利的策略。）\n\
    \n有經驗的投資人，也可以利用選擇權來提升投資組合的收益。舉例來說，他可以抵補銷售賣權；對於打算持有的股票，也可以裸露銷售該股票的賣權（如果所銷售的賣權遭到執行，可以低價買進原本就打算持有的股票，否則也可以賺取權利金）。\n\
    \n選擇權有太多這類的戰術可供玩弄。請注意，是「玩弄」，因為對於一般投資人來說，選擇權可能帶來災難。選擇權玩家具備的操作技巧，不是一般投資人能夠想象的。很多場內交易員可以在腦海裡計算選擇權「理論價值」，只要實際價格與理論價值之間的偏離幅度到達\
    \ $0.625，他們就有辦法賺取其中的差價利潤。編者曾經與最頂尖的選擇權玩家對談，他說的一件事，或許值得讀者深思。這位造市者不經意地說，他的財富是由這些微不足道的差價累積而成。讀者想想，一般投資人如何能夠賺取這種\
    \ $0.625的差價利潤。\n\n當然，這並不表示一般投資人不得碰觸選擇權，而是說各位如果想要「玩」選擇權的話，務必要有充分的準備。選擇權交易裡面有所謂的多頭價差交易、空頭價差交易與鱷魚價差交易。鱷魚價差交易是否噬客戶資本的一種選擇權策略。\n\
    \n抵補銷售買權（covered call writing）就屬於這類策略。這種策略被奉為股票投資組合的收益製造機。對於投資人做多的股票，實在沒有道理銷售其買權，除非該股票陷入狹幅盤整區間，而且在選擇權到期之前不會突破。如果股票處在下降趨勢，投資人就應該賣掉股票，而不是銷售其買權。反之，如果銷售上升趨勢之股票的買權，這會被經紀人視為最佳客戶，協助經紀人賺取佣金。如果股票處於漲勢，銷售買權的後果很明顯：銷售者（也就是讀者「您」）會按照選擇權履約價格賣掉股票，喪失股票多頭部位與其未來升值潛能。至於銷售選擇權的權利金收益，雖然不無小補，不過只是「苦中作樂」而已。\n\
    \n## 計量分析\n\n投資人還需要知道另一個有關電腦與投資科技的領域，這是一個績效差異更明確、更具獲利潛能的領域，但也是由模型主導的市場：選擇權市場。從事選擇權研究與交易的計量分析者，他們不同於一般的技術分析者。很有趣的，選擇權基本上是透過運算模型決定的市場，但這種衍生性產品的根本資產，卻屬於行為市場的股票。目前有關選擇權交易的訂價模型，都是由布萊克－薛里斯訂價模型演變來的，後者根據\
    \ 5 個變數決定股票選擇權的理論價值，這 5 個變數分別為：選擇權履約價格、股票價格、「無風險」利率、選擇權到期期間，以及股票價格波動率。\n\n目前的衍生性交易產業，都已經普遍接受布萊克－薛里斯訂價模型。本書不準備列舉目前可供交易的衍生性產品種類，因為它們並不是本書想要處理的對象。本節的主要目的，是要警告那些想要「擊敗衍生性市場」的投資人，務必要先做徹底的研究，否則可能會付出慘重代價。\n\
    \n最初，首先體會選擇權訂價模型之重要性的交易者，徹底擊敗老式交易者，後者是指那些憑著直覺或單純信念（換言之，人類情緒）\n"
