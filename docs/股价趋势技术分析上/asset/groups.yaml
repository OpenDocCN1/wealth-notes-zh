    # 等腰三角形


    最常見的三角形排列，是由一系列價格波動構成，波動的振幅愈來愈小；換言之，價格波動的小型峰位愈來愈低，小型谷底則愈來愈高。結果逐漸收斂成為「道氏狹幅盤整」（Dow
    line），對於這種橫向交易走勢，波段峰位愈來愈低而能夠透過明確的向下傾斜直線銜接，波段谷底則愈來愈高而能夠透過明確的向上傾斜直線銜接。這種三角形，稱為「等腰三角形」（symmetrical
    triangle）。用更精確的幾何學術語來說，應該稱為「銳角三角形」（acute triangle），因為銜接峰位與谷底的兩腰，長度未必相等，也就是說兩腰與橫軸的夾角未必相等。可是，三角形排列有明顯的「等腰」（對稱）傾向，所以稱其為等腰三角形也不為過。這種型態有時也稱為「螺旋」（coil）。'
