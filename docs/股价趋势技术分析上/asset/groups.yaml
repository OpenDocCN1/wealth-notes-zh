    能沒有受到限制。如果交易者的判斷錯誤，行情不跌反漲，他將損失當初支付的權利金＄660。交易者可 以挑選賣權的履約價格，藉以調整下檔承受的風險程度。當道瓊期貨價格為7534＝7600－66，賣權內含價值剛好等於權利金，處於不賺不賠的狀態。換言之，這種狀況下，股票投資組合不管有沒有賣權設定保障，結果都一樣。


