    ### 主要下降趨勢線


    由技術分析觀點來看，個別股票在空頭市場呈現的主要趨勢線，幾乎沒有實務運用價值。1929—32年的漫長空頭市場則屬於顯著例外，許多個股的算術刻度趨勢線都呈現直線狀（股價指數也是如此，稍後討論）。可是，其他情況下，空頭市場的趨勢線幾乎都沒有預測價值，不論採用算術或對數刻度都是一樣。


    正常情況下，空頭市場主要趨勢不只較多頭市場主要趨勢陡峭（空頭市場的涵蓋期間，平均是多頭市場的一半），而且呈現加速向下發展（價格軌跡呈現開口向下的曲線）。在半對數圖形紙上，這種傾向尤其明顯，所以更難有效預測。


    總之，在空頭市場轉變為多頭市場的關鍵時刻，技術分析者恐怕很難由主要趨勢線方面獲得重要資訊。可是，這並不是說完全不需繪製空頭市場的主要趨勢線，或完全不理会顯然具有重要意義的趨勢線。如果期待不高，往往就可以獲得一些可供運用的線索，藉以判斷行情轉折。


    如果技術分析不很「斤斤計較」，對於研究結論不太「吹毛求疵」，往往可以由空頭市場趨勢線取得奇妙的資訊。雖然這些趨勢線不能預測主要行情轉折，其延伸線也經常偏離實際價格軌跡；可是，經過幾個月或幾年之後，當價格逐漸向趨勢線靠攏，趨勢線經常可以提供奇妙的線索（這些現象只能由趨勢線解釋，否則顯得不可理解）。雖然很有趣，但就我們所能夠掌握的知識程度來說，這類現象充滿不確定性，不可預期。編者附註：這個事實可能永遠持續下去，就如同費馬最後定理（Fermat''s
    Last Theorem）始終無法被證明。現在雖然邁入第21世紀，但我們擁有的知識程度並不顯然勝過馬基時代。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_390_0.png)


    這幾段討論的內容，顯然不具建設性，所以我們要特別強調一點，主要空頭市場結束的徵兆，可以由最後階段的中期趨勢線反映，這是前章的重要結論之一。


    ### 主要趨勢通道


    在算術刻度圖形紙上，如果繪製折返線來呈現主要趨勢通道，顯然又會碰到一些麻煩。主要上升趨勢的發展過程，中期與小型價格擺動通常會愈來愈大，所以會呈現向上擴張的通道。折返線不會與基本趨勢線相互平行（這是假定首先可以繪製理想的基本趨勢線），而會向外發散。當然，某些主要趨勢還是會有明確的上升通道，但一般都也不行。


    有關主要趨勢通道向外發散的問題，採用半對數圖形紙可以改善，但對於主要空頭市場，不論採用哪種刻度，都很難彌補這方面的困擾。


    ### 股價指數的趨勢線


    前一章有關個別股票中期趨勢線的討論，大體上都適用於股價指數。事實上，大盤指數的趨勢更有規律，因此也更適合採用趨勢線分析。這一方面可能是因為股價指數都是由最具代表性的股票構成，這類成分股的表現比較「正常」（就技術分析角度說）。另一方面，計算股價指數的過程，個別股票的突兀表現會被「平均化」，使得整體指數能夠更準確反映經濟的真正脈動。


    總之，許多股價指數走勢圖確實呈現明確的趨勢線，例如：道瓊鐵路指數、道瓊工業指數、道瓊65種綜合股價指數、紐約時報50種股價指數、紐約先鋒報100種股價指數、標準普爾90種股價指數，最後兩者的結構最合理，比較能夠反映整體市場狀況（編者附註：這些指數多數已經過時了。目前，S&P
    500可能是最具代表性的股價指數）。


    由於股價指數呈現的趨勢很精確，尤其是中期趨勢，允許我們繪製緊密的趨勢線；所以，趨勢線突破的判斷，比較沒有必要保留彈性空間。對於中等價位的股票，我們稍早主張有效突破幅度必須是股價的3%；對於股價指數來說，突破幅度只需要2%。


    有經驗的交易者都會留意大盤狀況，順勢而為總是比較簡單的。


    ### 編者附註：股價指數的趨勢線&指數交易


    自從本書第5版發行以來，股票市場出現無數的價格指數：S&P 100、S&P 500、羅素2000……等。對於新聞工作者來說，每天報導這些指數，就是繁重的工作。股價指數就如同雨後春筍般不斷冒出，理由很簡單，因為某個股價指數一旦被普遍接受，就可以替開發者帶來豐厚的利潤。集中市場使用的股價指數，都必須付費給相關指數的開發者；所以，標準普爾與道瓊公司都可以坐收高額權利金。由於指數交易工具不斷翻新，這方面的資料只能列在附錄D，讀者如果想要查閱各種指數的交易工具與報價，也可以參考《華爾街日報》、《拜倫週刊》（Barron''s）與《投資人商務日報》（The
    Investor''s Business Daily）。任何這類交易工具的最即時報價資料，幾乎都可以透過網路經紀商與財經網站查詢。關於這些網站與其連結，請參考本書的附錄D或edwards-george.com。


