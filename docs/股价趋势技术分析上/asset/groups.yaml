    # 直角三角形


    前一段曾經提到上升三角形（ascending triangles）。上升與下降（descending）三角形，都屬於直角三角形排列（right angle
    triangles），分別屬於多頭與空頭型態。在很多方面，直角三角形排列的行為，很類似等腰三角形，但有一點重大差異：這類排列會預先表露型態完成之後的意圖。如同排列名稱顯示的，上升三角形將發展為上升趨勢，下降三角形將發展為下降趨勢。


    前文談到，等腰三角形是由一系列震幅愈來愈小的價格波動構成，波動的轉折峰位可以銜接為一條向下傾斜的直線，轉折谷底則可以銜接為一條向上傾斜的直線。至於直角三角形，銜接波動轉折峰位或谷底的直線之一，大約是水平狀，另一條則向上或向下收敘到水平'
  md: '

    屬於整理（consolidation）型態；換言之，三角形排列只代表既有上升或下降趨勢暫時停頓，稍做整理之後，既有趨勢還會朝原先方向繼續發展（莎貝克 [Schabacker]
    稱此為「連續型態」，continuous patterns）。我們之所以把三角形排列擺在反轉型態內處理，主要是因為這類排列偶爾會出現在主要趨勢反轉過程，投資人絕對有必要在這個時候辨識它們。


    ## 等腰三角形


    最常見的三角形排列，是由一系列價格波動構成，波動的振幅愈來愈小；換言之，價格波動的小型峰位愈來愈低，小型谷底則愈來愈高。結果逐漸收斂成為「道氏狹幅盤整」（Dow
    line），對於這種橫向交易走勢，波段峰位愈來愈低而能夠透過明確的向下傾斜直線銜接，波段谷底則愈來愈高而能夠透過明確的向上傾斜直線銜接。這種三角形，稱為「等腰三角形」（symmetrical
    triangle）。用更精確的幾何學術語來說，應該稱為「銳角三角形」（acute triangle），因為銜接峰位與谷底的兩腰，長度未必相等，也就是說兩腰與橫軸的夾角未必相等。可是，三角形排列有明顯的「等腰」（對稱）傾向，所以稱其為等腰三角形也不為過。這種型態有時也稱為「螺旋」（coil）。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_166_0.png)


    圖44. 這是過線圖上呈現的完美等腰三角形反轉排列。排列上限由1942年2月高點21向下傾斜，下限由「偷襲珍珠港」的低點16度向上傾斜，上限與下限的收斂位置大約在18度。由這個主要底部開始，HD在1946年上漲到46。請注意成交量在排列過程如何萎縮，然後在1942年10月爆出大量、向上突破。突破是發生在第一個峰位到三角形頂點之間水平距離的四分之三位置。


    等腰三角形排列發展過程，價格波動的振幅不斷收縮（螺旋狀的彈簧不斷壓縮），成交量也會逐漸萎縮（或許沒有明顯的規律，但經過一段時間就可以清楚察覺）。價格排列的上限與下限，向右端的三角形頂點收斂（換言之，向未來收斂）。當價格朝三角形頂點發展，價格波動振幅愈來愈小，成交量萎縮到異常偏低水準；接著，突然之間，在毫無預兆的情況下，價格夾著大量突破三角形排列（就如同愈繃愈緊的螺旋彈簧突然鬆開一樣），突破方向通常即是朝原先趨勢的發展方向（換言之，屬於連續排列，不是反轉排列），該趨勢隨後的發展幅度，大約等於先前（進入三角形排列之前）的幅度。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_167_0.png)


    圖 45. 1946 年，多頭市場的頭部形成等腰三角形反轉排列，隨後又形成另一個三角形，但後者屬於連續排列而不是反轉排列。（成交量採用對數刻度，這使得成交量變動看起來不是很明顯。）
    第一個三角形的賣出訊號在 44 1/2，第二個三角形的訊號在 41。12 月份，價格跌到 30 1/2。


    關於三角形排列最後的突破方向，我們幾乎不可能在排列過程內察覺任何可供判斷的徵兆。我們雖然可以根據相同類股之其他股票的走勢，判斷三角形排列的可能突破方向（稍後將討論的重要主題），但就這個排列本身而言，通常只有靜待市場自己打定主意。由另一個角度說，股價之所以進入三角形排列整理，也正是市場「打定主意」之前的醞釀過程；整個型態凸顯出躊躇、猶豫與不確定的心理，直到最後打定主意為止。


    ### 等腰三角形的注意事項


    乾淨俐落的三角形排列，確實具有迷人的性質，但也有令人難以捉摸之處。技術分析的初學者，經常希望尋找三角形，而且也自以為已經找到這些排列，但實際上完全不是這回事。請記住，兩點才能連
    接成一直線。唯有當兩個小型價格峰位確定之後，才可以連接這兩個 峰位而繪製價格區間的上限；換言之，價格必須上漲與下跌，在圖形 上顯示2個清晰而可以辨認的峰位。同理，唯有當2個小型谷底確定之
    後，才能夠繪製三角形排列的下限。所以，唯有當我們發現小型趨勢 的4個反轉點之後，才可能判斷三角形排列正在發展中。如果三角形 排列出現在上升趨勢，則首先需要出現一個峰位，拉回走勢出現谷
    底，然後出現低於第一個峰位的第二個峰位，接著出現高於第一個谷 底的第二個谷底（價格當然還要彈升一段距離，才能確定第二個谷底 已經形成）。唯有在這種情況下，才能繪製等腰三角形的上限與下
    限，並假設該排列正在發展中。


    另外，如果排列發展過於接近三角形頂點而沒有進行突破，型態 的威力將減弱（這點似乎不符合螺旋彈簧的性質）。請注意，當價格 被壓縮到某種程度之後，排列蓄積的力量將減少而不是增加。根據三
    角形底部（排列最左端）到頂點之間的水平距離衡量，價格最好是在 一半或四分之三位置進行突破（不論向上或向下）。如果超過四分之 三距離而沒有突破，價格繼續愈盤愈緊，最後很可能「無疾而終」或
    「不了了之」；換言之，價格通過三角形頂點而演變為沈悶的橫向走 勢。如果碰到這種情況，最好放棄而另外尋找更有潛力的交易對象。


    最後，當三角形排列完成之前（價格明確突破之前），往往需要 重新繪製排列上限或下限。舉例來說，當兩個小型峰位出現，我們可 以繪製向下傾斜之上限。隨後，第三波漲勢可能穿越剛才繪製的上
    限，但穿越幅度不大，成交量也沒有擴大。然後，價格又回檔而形成 第三個小峰位，其價位低於第二個峰位，但高於原先上限。這種情況 下，我們必須放棄最初繪製的上限，重新根據第一個峰位與第三個峰
    位繪製新的上限。


    ## 等腰三角形突破


    價格可能向上或向下突破三角形排列；如同稍早談到的，在價格實際突破之前，通常沒有可靠的線索，可供判斷突破的方向。先前有關頭肩排列突破的評論，原則上也適用於此。譬如說，有效的突破，是指突破幅度至少是股價的3%。另外，向上突破必須配合大量；如果沒有顯著成交量配合，突破並不可靠。可是，向下突破並不需要經過成交量確認，這也與頭肩排列相同。根據經驗顯示，多數的向下突破也會伴隨著大量，但成交量放大程度未必很顯著，除非等到價格跌破最後一個小型谷底，但這與突破實際發生位置之間，可能有一段不小的距離。


    說來也奇怪，如果等腰三角形從一開始就夾著顯著大量向下突破，往往代表假訊號，不是真正的下降趨勢。尤其突破是發生在很接近三角形頂點的位置，這類大量向下突破經常——甚至是「通常」——發展為2、3天的震盪走勢，然後展開真正的上升趨勢。


    這無疑是技術交易者的心夢魘：一種漂亮的技術型態，我們卻不能相信它。不幸地，等腰三角形發出假訊號的頻率，遠超過頭肩排列，也超過我們已經討論或即將討論的任何其他排列。更不幸地，我們往往要實際進場之後，才能確定這些假訊號（雖然理想的交易戰術可以防範這類假訊號演變為重大虧損）。另外，這類的假訊號還經常持續反覆：當我們判斷向下突破實際代表的是上升趨勢時，結果後續發展又證明趨勢確實是朝下發展。雖然沒有任何價格型態是絕對可靠的，但等腰三角形卻是其中最善變者。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_170_0.png)


    圖46. 1942年出現等腰三角形的主要反轉型態，形狀有些類似頭肩底，但右肩拖得很長。雖然是過線圖，但價量關係還是頗值得研究。隨後4年，股價上漲超過100點。


    可是，絕大多數的等腰三角形排列還是頗知自制，不會在真正傷害造成之後才表態自己是假訊號（我們雖然沒有統計數據可供參考，但經驗顯示應該有三分之二以上的個案是如此）。夾量的向上突破，雖然可能是「過早」的訊號，價格稍後往往又會跌回三角形整理區間，但歸根究底還是會向上發展，很少演變為假訊號。本章與隨後各章還會討論假訊號的問題，讓讀者有機會培養一些處理假訊號的經驗。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_171_0.png)


    ## 三角形排列的典型發展


    本章提供的等腰三角形範例，應該可以讓讀者熟悉這種排列的各種可能變化。可是，如果我們逐步說明這種排列的典型發展，或許有助於澄清一些重要論點。假定各位正在觀察某支股票的上漲走勢，漲勢過程只出現短暫的停頓，以及一些無關緊要的折返，價格由20上漲到30，然後是32、35，而且繼續攀升。（但願各位能夠在20買進！）成交量維持每天300股到600股之間，下跌過程的成交量縮小。可是，價格上漲到30之後，開始吸引跟進的玩家，成交量增加到每天1,000股左右。當股價接近40，成交量擴大為2,000股，價格先在39、40附近「搅拌机」，然後開始下跌。股價下跌過程，各位很關心後續發展（尤其是實際擁有股票的話），即使知道價格不太可能直接跌回20（這不是股價發展的應有行為
    [編者附註：處在第21世紀的今天，某些股票往往會如此]），但還是會擔心。假定這支股票的趨勢已經反轉，價格應該會在頭部附近盤旋一陣子，出現某種出貨的型態。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_172_0.png)


    圖48. 三角形經常成為某種更大型排列的構成部分。此處的三角形排列，構成圓形轉折的後半部。請注意，10月17日曾經發生過早的突破，價格隨後拉回到原來的交易區間，11月8日才出現真正的突破。


    該波跌勢持續將近10天，成交量明顯萎縮。價格觸及33之前，每天成交量大約是700股。在33的價位，成交量開始放大到每天800股或900股，但價格沒有進一步下挫。經過1、2天整理，價格開始上揚，成交量沒有顯著變化。經過8、9天，價格又逼近40，成交量放大，當價格到達39時，每天成交量為1,200股。可是，價格並沒有回升到40，又開始拉回，大約跌到37附近（如果各位自行繪製價格走勢圖，這部分發展看起來會比較清楚）。現在，我們發現，第2個峰位發生在39，這個時候可以繪製一條暫時的型態線（還有其他名稱，稍後討論），銜接兩個峰位的盤中高點（不是收盤價），這條直線向右下方傾斜。可是，整個修正走勢目前還只有一個谷底，所以不能繪製對應的下限。第二波回檔走勢的成交量，更低於第一波回檔。成交量下降到400股左右，價格跌勢停頓於34，然後畫出向上的弧線，再度挺進。交易狀況還是很沈悶，但成交量在36附近開始放大。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_173_0.png)


    圖49. 價格持續盤旋到等腰三角形頂點附近才突破。這類突破非常不可靠。目前這個例子，呈現假突破，真正趨勢是朝下發展。


    這段走勢可以界定第二個小型谷底，現在可以繪製底部的切線：向上傾斜的直線，銜接兩波折返走勢的極端低價，一是33，一是34。於是，走勢圖呈現兩條相互收斂的型態線，交差於36
    1/2附近，時間大約是在4個星期之後。這是一個等腰三角形，但我們不知道價格最後是要向下突破，或擺脫遲疑而繼續向上挺進，展開另一波值得操作的漲勢。各位可以密切觀察，準備在適當時機，採取因應的行動。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_174_0.png)


    圖50。價格由「恐慌性」底部向上反彈，經常會產生三角形排列，因為這正代表猶豫、不確定的階段。可是，對於這種情況來說，猶豫的結果通常是繼續下跌。價格很少能夠守住恐慌性底部。這份圖形顯示1937年10月19日發生的著名賣壓高潮，價格回升之後構成三角形連續排列。請注意，價格一度拉高到三角形頂點。


    次一波漲勢的成交量稍微放大，當股價推升到38（盤中高價為38 1/2），成交量為700股。漲勢一度穿越型態線，幅度大約是 1/4點（價格波動的振幅愈來愈小，週期也愈來愈短）。可是，穿越過程的成交量小於前一個頭部（39）。不久，追價買盤又消失，價格回跌到37、36附近。現在，我們要重新繪製上側的切線，銜接第一個峰位40與目前這個峰位38
    1/2。新的切線位置向上移動，似乎意味著買方力道轉強，但這種推断未必靠得住。此處不應該太過於強調精確性；三角形排列需要留一些可供迴轉的空間。


    接下來的跌勢發展過程，成交量更是萎縮。如果三角形排列得以維持目前的发展，則價格將在35附近觸及向上傾斜的谷底切線。價格回檔是否會一路下滑到谷底切線？這是一個值得觀察的重點。如果回檔走勢能夠停頓於谷底切線上方半檔位置，則先前漲勢稍微突破上限的走勢就有點意思了。然而，實際情況並非如此，價格繼續下跌到35，每天成交量只剩下200股，甚至低於股票由20起漲的階段。這是關鍵時刻。行情暫時陷入停頓，接著稍微走高，然後繼續揚升，穿越36
    1/2，成交量放大，價格直逼三角形排列的（新）上限37 1/2。隔天，價格夾著1,500股大量，向上買穿排列上限，收盤價為39 1/8。這是突破走勢；市場已經打定主意，決定繼續向上挺進（雖然可能是假突破，但目前看起來似乎不像）。請注意三角形排列完成的位置，突破發生的價位，低於先前高點40，因為排列上限稍微向下傾斜，這正是三角形排列的有趣之處。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_176_0.png)


    圖51．等腰三角形的主要頭部排列中，價格經常盤旋到三角形頂點，然後向上假突破（參考圖49）。這支股票提供一個技術性的不良示範，但這個突破原本就非常值得懷疑。


    ## 反轉？整理？


    本章把等腰三角形歸類為反轉型態，但範例卻出現一些整理 (consolidation) 型態；換言之，既有趨勢藉由三角形排列做整理，稍做停頓之後，繼續原來的趨勢發展。事實上，大約有四分之三的等腰三角形是屬於連續（整理）型態，但剩下的四分之一卻很可怕（如果我們持有股票的話）。如何分辨呢？


    就前一節談論的例子來說，當價格在39明確向上突破之前，整個排列可能發展為反轉型態，不是連續型態。如果是典型的反轉型態，第一個徵兆可能發生在價格由第三個谷底35反彈後不久。這波反彈大約只能挺進到36
    1/2，就應該回跌而成交量稍微增加，最後跌破排列 下限。當價格下跌到 34 (整個排列的最低點), 成交量可能擴增到 600 股或 700 股。往後, 任何進一步跌勢都代表賣出訊號,
    成交量將擴大, 一旦價格「引發」34 之下的停損點 (稍後討論), 跌勢將加速發展。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_178_0.png)


    這是一份週線圖。1944 年, 股價發生長達 7 個月的整理走勢, 最初很難界定排列型態, 後來演變為典型的等腰三角形。1945 年 1 月, 價格夾著大量向上突破,
    2 個月之後拉回到排列頂點附近, 然後快速挺進。這個三角形排列的上檔最低衡量目標為 16 (參考本章稍後解釋)。


    結束這個例子之前，或許應該討論價格突破之後的折返或拉回走勢。如同頭肩排列的情況一樣，等腰三角形最初突破之後，價格可能不會立即發動重大走勢，而會重新折返到三角形排列的邊界，這種折返走勢通常會持續2、3天。所以，就稍早討論的例子來說，價格向上突破而在39
    1/8收盤，隔天可能進一步上漲到40。接著，隨後1、2天內，價格可能夾著小量退回到37 1/2或38。稍做整理之後，才開始正式向上挺進。向下突破也有類似狀況；突破之後，價格可能向上反彈到排列下限，然後才夾著大量正式向下發展。可是，就三角形排列而言，突破之後出現折返走勢的發生頻率，明顯低於頭肩排列。繼續討
    論其他排列之前，讓我們花點時間研究等腰三角形之所以產生的根本理由。這或許有助於推測三角形排列完成之後的可能後續發展。當然，任何這類嘗試，都免不了會有「過於簡化」的缺失，我們雖然不能解釋三角形的各種變形，但做這類的心智冥想還是頂有趣的，應該
    有助於我們對於圖形分析的整體性瞭解。容我們回頭觀察前一節的例子。首先，價格很穩定地由20上漲到40左右，然後開始拉回整理。我們不難推測40附近的情況：很多投資人已經取得不錯的帳面獲利，可能是100%。（類似如40、50、75或100的整數關卡，經常被設定為心理目標價位，所以這些水準的賣壓往往特別大。）某些投資人準備獲利了結，而且也確實這麼做，技術性鐘擺暫時由需求移往供給。當
    然，價格下跌之後，賣出慾望將減退。些準備接手的買盤早就在旁「虎視眈眈」，他們來不及在30或更低價位「上轍」。這些人雖然不願向上「追價」到40，但很樂意在拉回走勢中逢低買進。當價格下跌到33，接手買盤已經足以讓供需之間的力量重新恢復均衡。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_181_0.png)


    圖56. 直角三角形過早突破（1946年3月），使得搶進的交易者大失所望，但最後發展還算正常。1946年進行股票分割之前，經常發生大幅震盪的走勢，例如此处可以看到3月9日與26日。


    可是，在價格回升過程，先前來不及在40附近獲利了結的投資人，這次決定不要太貪心，準備在「合理」價位出局。所以，當價格向上穿越37之後，賣壓開始浮現，並在39附近有效遏止漲勢。於是，價格又開始回撤。我們可以推想這類情況如何週而復始地重複發展，新資金持續進場，持股者也愈來愈急著想獲利了結。最後，潛在的賣壓都被消化或改變心意，專業玩家與充滿期待的投資人赫然發現上檔已經沒有賣壓了，於是紛紛搶進。


    等腰三角形完成之後，經常會有很可觀的漲勢或跌勢（稍後將討論衡量方法），如果能夠預先判斷突破方向，交易者就可以居于很有利的地位。如同前文提到的，機率站在連續排列這邊；換言之，三角形將順著排列發生之前的趨勢方向進行突破。當然，如果三角形排列是發生在主要多頭或空頭趨勢的初期，排列連續發展的可能性很高。反之，如果三角形排列是發生在主要趨勢的成熟階段，反轉型態的機會就很大。除此之外，觀察相關類股的其他股票走勢，也有助於判斷突破方向。舉例來說，如果發現某支股票出現等腰三角形排列，而相同類股的其他股票普遍呈現碟形底、頭肩底、上升三角形或其他多頭排列，顯然可以提升等腰三角形向上突破的可能性。某些情況下，前述種徵兆可能非常強烈，族以促使我們願意承擔風險，提早進場建立部位。


    ## 直角三角形


    前一段曾經提到上升三角形（ascending triangles）。上升與下降（descending）三角形，都屬於直角三角形排列（right angle
    triangles），分別屬於多頭與空頭型態。在很多方面，直角三角形排列的行為，很類似等腰三角形，但有一點重大差異：這類排列會預先表露型態完成之後的意圖。如同排列名稱顯示的，上升三角形將發展為上升趨勢，下降三角形將發展為下降趨勢。


    前文談到，等腰三角形是由一系列震幅愈來愈小的價格波動構成，波動的轉折峰位可以銜接為一條向下傾斜的直線，轉折谷底則可以銜接為一條向上傾斜的直線。至於直角三角形，銜接波動轉折峰位或谷底的直線之一，大約是水平狀，另一條則向上或向下收敘到水平

    '
  mdcn: '

    屬於整理（consolidation）型態；換言之，三角形排列只代表既有上升或下降趨勢暫時停頓，稍做整理之後，既有趨勢還會朝原先方向繼續發展（莎貝克 [Schabacker]
    稱此為「連續型態」，continuous patterns）。我們之所以把三角形排列擺在反轉型態內處理，主要是因為這類排列偶爾會出現在主要趨勢反轉過程，投資人絕對有必要在這個時候辨識它們。


    ## 等腰三角形


    最常見的三角形排列，是由一系列價格波動構成，波動的振幅愈來愈小；換言之，價格波動的小型峰位愈來愈低，小型谷底則愈來愈高。結果逐漸收斂成為「道氏狹幅盤整」（Dow
    line），對於這種橫向交易走勢，波段峰位愈來愈低而能夠透過明確的向下傾斜直線銜接，波段谷底則愈來愈高而能夠透過明確的向上傾斜直線銜接。這種三角形，稱為「等腰三角形」（symmetrical
    triangle）。用更精確的幾何學術語來說，應該稱為「銳角三角形」（acute triangle），因為銜接峰位與谷底的兩腰，長度未必相等，也就是說兩腰與橫軸的夾角未必相等。可是，三角形排列有明顯的「等腰」（對稱）傾向，所以稱其為等腰三角形也不為過。這種型態有時也稱為「螺旋」（coil）。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_166_0.png)


    圖44. 這是過線圖上呈現的完美等腰三角形反轉排列。排列上限由1942年2月高點21向下傾斜，下限由「偷襲珍珠港」的低點16度向上傾斜，上限與下限的收斂位置大約在18度。由這個主要底部開始，HD在1946年上漲到46。請注意成交量在排列過程如何萎縮，然後在1942年10月爆出大量、向上突破。突破是發生在第一個峰位到三角形頂點之間水平距離的四分之三位置。


    等腰三角形排列發展過程，價格波動的振幅不斷收縮（螺旋狀的彈簧不斷壓縮），成交量也會逐漸萎縮（或許沒有明顯的規律，但經過一段時間就可以清楚察覺）。價格排列的上限與下限，向右端的三角形頂點收斂（換言之，向未來收斂）。當價格朝三角形頂點發展，價格波動振幅愈來愈小，成交量萎縮到異常偏低水準；接著，突然之間，在毫無預兆的情況下，價格夾著大量突破三角形排列（就如同愈繃愈緊的螺旋彈簧突然鬆開一樣），突破方向通常即是朝原先趨勢的發展方向（換言之，屬於連續排列，不是反轉排列），該趨勢隨後的發展幅度，大約等於先前（進入三角形排列之前）的幅度。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_167_0.png)


    圖 45. 1946 年，多頭市場的頭部形成等腰三角形反轉排列，隨後又形成另一個三角形，但後者屬於連續排列而不是反轉排列。（成交量採用對數刻度，這使得成交量變動看起來不是很明顯。）
    第一個三角形的賣出訊號在 44 1/2，第二個三角形的訊號在 41。12 月份，價格跌到 30 1/2。


    關於三角形排列最後的突破方向，我們幾乎不可能在排列過程內察覺任何可供判斷的徵兆。我們雖然可以根據相同類股之其他股票的走勢，判斷三角形排列的可能突破方向（稍後將討論的重要主題），但就這個排列本身而言，通常只有靜待市場自己打定主意。由另一個角度說，股價之所以進入三角形排列整理，也正是市場「打定主意」之前的醞釀過程；整個型態凸顯出躊躇、猶豫與不確定的心理，直到最後打定主意為止。


    ### 等腰三角形的注意事項


    乾淨俐落的三角形排列，確實具有迷人的性質，但也有令人難以捉摸之處。技術分析的初學者，經常希望尋找三角形，而且也自以為已經找到這些排列，但實際上完全不是這回事。請記住，兩點才能連
    接成一直線。唯有當兩個小型價格峰位確定之後，才可以連接這兩個 峰位而繪製價格區間的上限；換言之，價格必須上漲與下跌，在圖形 上顯示2個清晰而可以辨認的峰位。同理，唯有當2個小型谷底確定之
    後，才能夠繪製三角形排列的下限。所以，唯有當我們發現小型趨勢 的4個反轉點之後，才可能判斷三角形排列正在發展中。如果三角形 排列出現在上升趨勢，則首先需要出現一個峰位，拉回走勢出現谷
    底，然後出現低於第一個峰位的第二個峰位，接著出現高於第一個谷 底的第二個谷底（價格當然還要彈升一段距離，才能確定第二個谷底 已經形成）。唯有在這種情況下，才能繪製等腰三角形的上限與下
    限，並假設該排列正在發展中。


    另外，如果排列發展過於接近三角形頂點而沒有進行突破，型態 的威力將減弱（這點似乎不符合螺旋彈簧的性質）。請注意，當價格 被壓縮到某種程度之後，排列蓄積的力量將減少而不是增加。根據三
    角形底部（排列最左端）到頂點之間的水平距離衡量，價格最好是在 一半或四分之三位置進行突破（不論向上或向下）。如果超過四分之 三距離而沒有突破，價格繼續愈盤愈緊，最後很可能「無疾而終」或
    「不了了之」；換言之，價格通過三角形頂點而演變為沈悶的橫向走 勢。如果碰到這種情況，最好放棄而另外尋找更有潛力的交易對象。


    最後，當三角形排列完成之前（價格明確突破之前），往往需要 重新繪製排列上限或下限。舉例來說，當兩個小型峰位出現，我們可 以繪製向下傾斜之上限。隨後，第三波漲勢可能穿越剛才繪製的上
    限，但穿越幅度不大，成交量也沒有擴大。然後，價格又回檔而形成 第三個小峰位，其價位低於第二個峰位，但高於原先上限。這種情況 下，我們必須放棄最初繪製的上限，重新根據第一個峰位與第三個峰
    位繪製新的上限。


    ## 等腰三角形突破


    價格可能向上或向下突破三角形排列；如同稍早談到的，在價格實際突破之前，通常沒有可靠的線索，可供判斷突破的方向。先前有關頭肩排列突破的評論，原則上也適用於此。譬如說，有效的突破，是指突破幅度至少是股價的3%。另外，向上突破必須配合大量；如果沒有顯著成交量配合，突破並不可靠。可是，向下突破並不需要經過成交量確認，這也與頭肩排列相同。根據經驗顯示，多數的向下突破也會伴隨著大量，但成交量放大程度未必很顯著，除非等到價格跌破最後一個小型谷底，但這與突破實際發生位置之間，可能有一段不小的距離。


    說來也奇怪，如果等腰三角形從一開始就夾著顯著大量向下突破，往往代表假訊號，不是真正的下降趨勢。尤其突破是發生在很接近三角形頂點的位置，這類大量向下突破經常——甚至是「通常」——發展為2、3天的震盪走勢，然後展開真正的上升趨勢。


    這無疑是技術交易者的心夢魘：一種漂亮的技術型態，我們卻不能相信它。不幸地，等腰三角形發出假訊號的頻率，遠超過頭肩排列，也超過我們已經討論或即將討論的任何其他排列。更不幸地，我們往往要實際進場之後，才能確定這些假訊號（雖然理想的交易戰術可以防範這類假訊號演變為重大虧損）。另外，這類的假訊號還經常持續反覆：當我們判斷向下突破實際代表的是上升趨勢時，結果後續發展又證明趨勢確實是朝下發展。雖然沒有任何價格型態是絕對可靠的，但等腰三角形卻是其中最善變者。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_170_0.png)


    圖46. 1942年出現等腰三角形的主要反轉型態，形狀有些類似頭肩底，但右肩拖得很長。雖然是過線圖，但價量關係還是頗值得研究。隨後4年，股價上漲超過100點。


    可是，絕大多數的等腰三角形排列還是頗知自制，不會在真正傷害造成之後才表態自己是假訊號（我們雖然沒有統計數據可供參考，但經驗顯示應該有三分之二以上的個案是如此）。夾量的向上突破，雖然可能是「過早」的訊號，價格稍後往往又會跌回三角形整理區間，但歸根究底還是會向上發展，很少演變為假訊號。本章與隨後各章還會討論假訊號的問題，讓讀者有機會培養一些處理假訊號的經驗。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_171_0.png)


    ## 三角形排列的典型發展


    本章提供的等腰三角形範例，應該可以讓讀者熟悉這種排列的各種可能變化。可是，如果我們逐步說明這種排列的典型發展，或許有助於澄清一些重要論點。假定各位正在觀察某支股票的上漲走勢，漲勢過程只出現短暫的停頓，以及一些無關緊要的折返，價格由20上漲到30，然後是32、35，而且繼續攀升。（但願各位能夠在20買進！）成交量維持每天300股到600股之間，下跌過程的成交量縮小。可是，價格上漲到30之後，開始吸引跟進的玩家，成交量增加到每天1,000股左右。當股價接近40，成交量擴大為2,000股，價格先在39、40附近「搅拌机」，然後開始下跌。股價下跌過程，各位很關心後續發展（尤其是實際擁有股票的話），即使知道價格不太可能直接跌回20（這不是股價發展的應有行為
    [編者附註：處在第21世紀的今天，某些股票往往會如此]），但還是會擔心。假定這支股票的趨勢已經反轉，價格應該會在頭部附近盤旋一陣子，出現某種出貨的型態。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_172_0.png)


    圖48. 三角形經常成為某種更大型排列的構成部分。此處的三角形排列，構成圓形轉折的後半部。請注意，10月17日曾經發生過早的突破，價格隨後拉回到原來的交易區間，11月8日才出現真正的突破。


    該波跌勢持續將近10天，成交量明顯萎縮。價格觸及33之前，每天成交量大約是700股。在33的價位，成交量開始放大到每天800股或900股，但價格沒有進一步下挫。經過1、2天整理，價格開始上揚，成交量沒有顯著變化。經過8、9天，價格又逼近40，成交量放大，當價格到達39時，每天成交量為1,200股。可是，價格並沒有回升到40，又開始拉回，大約跌到37附近（如果各位自行繪製價格走勢圖，這部分發展看起來會比較清楚）。現在，我們發現，第2個峰位發生在39，這個時候可以繪製一條暫時的型態線（還有其他名稱，稍後討論），銜接兩個峰位的盤中高點（不是收盤價），這條直線向右下方傾斜。可是，整個修正走勢目前還只有一個谷底，所以不能繪製對應的下限。第二波回檔走勢的成交量，更低於第一波回檔。成交量下降到400股左右，價格跌勢停頓於34，然後畫出向上的弧線，再度挺進。交易狀況還是很沈悶，但成交量在36附近開始放大。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_173_0.png)


    圖49. 價格持續盤旋到等腰三角形頂點附近才突破。這類突破非常不可靠。目前這個例子，呈現假突破，真正趨勢是朝下發展。


    這段走勢可以界定第二個小型谷底，現在可以繪製底部的切線：向上傾斜的直線，銜接兩波折返走勢的極端低價，一是33，一是34。於是，走勢圖呈現兩條相互收斂的型態線，交差於36
    1/2附近，時間大約是在4個星期之後。這是一個等腰三角形，但我們不知道價格最後是要向下突破，或擺脫遲疑而繼續向上挺進，展開另一波值得操作的漲勢。各位可以密切觀察，準備在適當時機，採取因應的行動。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_174_0.png)


    圖50。價格由「恐慌性」底部向上反彈，經常會產生三角形排列，因為這正代表猶豫、不確定的階段。可是，對於這種情況來說，猶豫的結果通常是繼續下跌。價格很少能夠守住恐慌性底部。這份圖形顯示1937年10月19日發生的著名賣壓高潮，價格回升之後構成三角形連續排列。請注意，價格一度拉高到三角形頂點。


    次一波漲勢的成交量稍微放大，當股價推升到38（盤中高價為38 1/2），成交量為700股。漲勢一度穿越型態線，幅度大約是 1/4點（價格波動的振幅愈來愈小，週期也愈來愈短）。可是，穿越過程的成交量小於前一個頭部（39）。不久，追價買盤又消失，價格回跌到37、36附近。現在，我們要重新繪製上側的切線，銜接第一個峰位40與目前這個峰位38
    1/2。新的切線位置向上移動，似乎意味著買方力道轉強，但這種推断未必靠得住。此處不應該太過於強調精確性；三角形排列需要留一些可供迴轉的空間。


    接下來的跌勢發展過程，成交量更是萎縮。如果三角形排列得以維持目前的发展，則價格將在35附近觸及向上傾斜的谷底切線。價格回檔是否會一路下滑到谷底切線？這是一個值得觀察的重點。如果回檔走勢能夠停頓於谷底切線上方半檔位置，則先前漲勢稍微突破上限的走勢就有點意思了。然而，實際情況並非如此，價格繼續下跌到35，每天成交量只剩下200股，甚至低於股票由20起漲的階段。這是關鍵時刻。行情暫時陷入停頓，接著稍微走高，然後繼續揚升，穿越36
    1/2，成交量放大，價格直逼三角形排列的（新）上限37 1/2。隔天，價格夾著1,500股大量，向上買穿排列上限，收盤價為39 1/8。這是突破走勢；市場已經打定主意，決定繼續向上挺進（雖然可能是假突破，但目前看起來似乎不像）。請注意三角形排列完成的位置，突破發生的價位，低於先前高點40，因為排列上限稍微向下傾斜，這正是三角形排列的有趣之處。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_176_0.png)


    圖51．等腰三角形的主要頭部排列中，價格經常盤旋到三角形頂點，然後向上假突破（參考圖49）。這支股票提供一個技術性的不良示範，但這個突破原本就非常值得懷疑。


    ## 反轉？整理？


    本章把等腰三角形歸類為反轉型態，但範例卻出現一些整理 (consolidation) 型態；換言之，既有趨勢藉由三角形排列做整理，稍做停頓之後，繼續原來的趨勢發展。事實上，大約有四分之三的等腰三角形是屬於連續（整理）型態，但剩下的四分之一卻很可怕（如果我們持有股票的話）。如何分辨呢？


    就前一節談論的例子來說，當價格在39明確向上突破之前，整個排列可能發展為反轉型態，不是連續型態。如果是典型的反轉型態，第一個徵兆可能發生在價格由第三個谷底35反彈後不久。這波反彈大約只能挺進到36
    1/2，就應該回跌而成交量稍微增加，最後跌破排列 下限。當價格下跌到 34 (整個排列的最低點), 成交量可能擴增到 600 股或 700 股。往後, 任何進一步跌勢都代表賣出訊號,
    成交量將擴大, 一旦價格「引發」34 之下的停損點 (稍後討論), 跌勢將加速發展。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_178_0.png)


    這是一份週線圖。1944 年, 股價發生長達 7 個月的整理走勢, 最初很難界定排列型態, 後來演變為典型的等腰三角形。1945 年 1 月, 價格夾著大量向上突破,
    2 個月之後拉回到排列頂點附近, 然後快速挺進。這個三角形排列的上檔最低衡量目標為 16 (參考本章稍後解釋)。


    結束這個例子之前，或許應該討論價格突破之後的折返或拉回走勢。如同頭肩排列的情況一樣，等腰三角形最初突破之後，價格可能不會立即發動重大走勢，而會重新折返到三角形排列的邊界，這種折返走勢通常會持續2、3天。所以，就稍早討論的例子來說，價格向上突破而在39
    1/8收盤，隔天可能進一步上漲到40。接著，隨後1、2天內，價格可能夾著小量退回到37 1/2或38。稍做整理之後，才開始正式向上挺進。向下突破也有類似狀況；突破之後，價格可能向上反彈到排列下限，然後才夾著大量正式向下發展。可是，就三角形排列而言，突破之後出現折返走勢的發生頻率，明顯低於頭肩排列。繼續討
    論其他排列之前，讓我們花點時間研究等腰三角形之所以產生的根本理由。這或許有助於推測三角形排列完成之後的可能後續發展。當然，任何這類嘗試，都免不了會有「過於簡化」的缺失，我們雖然不能解釋三角形的各種變形，但做這類的心智冥想還是頂有趣的，應該
    有助於我們對於圖形分析的整體性瞭解。容我們回頭觀察前一節的例子。首先，價格很穩定地由20上漲到40左右，然後開始拉回整理。我們不難推測40附近的情況：很多投資人已經取得不錯的帳面獲利，可能是100%。（類似如40、50、75或100的整數關卡，經常被設定為心理目標價位，所以這些水準的賣壓往往特別大。）某些投資人準備獲利了結，而且也確實這麼做，技術性鐘擺暫時由需求移往供給。當
    然，價格下跌之後，賣出慾望將減退。些準備接手的買盤早就在旁「虎視眈眈」，他們來不及在30或更低價位「上轍」。這些人雖然不願向上「追價」到40，但很樂意在拉回走勢中逢低買進。當價格下跌到33，接手買盤已經足以讓供需之間的力量重新恢復均衡。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_181_0.png)


    圖56. 直角三角形過早突破（1946年3月），使得搶進的交易者大失所望，但最後發展還算正常。1946年進行股票分割之前，經常發生大幅震盪的走勢，例如此处可以看到3月9日與26日。


    可是，在價格回升過程，先前來不及在40附近獲利了結的投資人，這次決定不要太貪心，準備在「合理」價位出局。所以，當價格向上穿越37之後，賣壓開始浮現，並在39附近有效遏止漲勢。於是，價格又開始回撤。我們可以推想這類情況如何週而復始地重複發展，新資金持續進場，持股者也愈來愈急著想獲利了結。最後，潛在的賣壓都被消化或改變心意，專業玩家與充滿期待的投資人赫然發現上檔已經沒有賣壓了，於是紛紛搶進。


    等腰三角形完成之後，經常會有很可觀的漲勢或跌勢（稍後將討論衡量方法），如果能夠預先判斷突破方向，交易者就可以居于很有利的地位。如同前文提到的，機率站在連續排列這邊；換言之，三角形將順著排列發生之前的趨勢方向進行突破。當然，如果三角形排列是發生在主要多頭或空頭趨勢的初期，排列連續發展的可能性很高。反之，如果三角形排列是發生在主要趨勢的成熟階段，反轉型態的機會就很大。除此之外，觀察相關類股的其他股票走勢，也有助於判斷突破方向。舉例來說，如果發現某支股票出現等腰三角形排列，而相同類股的其他股票普遍呈現碟形底、頭肩底、上升三角形或其他多頭排列，顯然可以提升等腰三角形向上突破的可能性。某些情況下，前述種徵兆可能非常強烈，族以促使我們願意承擔風險，提早進場建立部位。


    ## 直角三角形


    前一段曾經提到上升三角形（ascending triangles）。上升與下降（descending）三角形，都屬於直角三角形排列（right angle
    triangles），分別屬於多頭與空頭型態。在很多方面，直角三角形排列的行為，很類似等腰三角形，但有一點重大差異：這類排列會預先表露型態完成之後的意圖。如同排列名稱顯示的，上升三角形將發展為上升趨勢，下降三角形將發展為下降趨勢。


    前文談到，等腰三角形是由一系列震幅愈來愈小的價格波動構成，波動的轉折峰位可以銜接為一條向下傾斜的直線，轉折谷底則可以銜接為一條向上傾斜的直線。至於直角三角形，銜接波動轉折峰位或谷底的直線之一，大約是水平狀，另一條則向上或向下收敘到水平

