    圖122. 1945年4月到6月之間的許多矩形排列，發生許多明顯的型態缺口，兩個標示為G的較大缺口，屬於逃逸缺口。請注意，缺口發生時，當天收盤價都很接近盤中高價。這兩個缺口在2年內都沒有被填補。


