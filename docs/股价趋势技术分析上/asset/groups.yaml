    展為中期程度的走勢。可是，由於單日反轉經常發生在重大走勢的起點，往往能夠透露後續發展的可能徵兆。總之，單日反轉代表一種警訊，分析者必須密切留意價格的可能發展，隨時準備採取因應行動。


