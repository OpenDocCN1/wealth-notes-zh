- raw:
  - '[PAGE 109]


    道氏理論的投資風險性質，看起來是相當獨特的，容我談論一些明顯者。相較於道氏理論投資人，前述的買進—持有投資人，不只整段期間的獲利較少，而且也承擔更大的風險。乍看之下，在前述表格內，放空投資人賺取的報酬，就代表買進—持有投資人實際遭遇的風險。而且，這只是乍看之下。稍微深入思索就可以發現，買進—持有投資人承擔的風險程度，實際上應該是由整個期間的帳戶淨值最大跌幅來衡量。這些談論不只是理論而已，我們可以根據用實際數據衡量。


    由風險角度觀察，結果是相當嚇人的。由2000年的頭部到2002年的底部，帳戶淨值減少39％。有點嚇人？雷根總統執政期間的1987年大崩盤，帳戶淨值減少程度為41％。不過，這還只是「小巫」而已。1929年到1932年的帳戶淨值減少程度為89％。當然，類似事件將來不太可能再發生，因為政府當局絕對會介入支撐行情。


    如果想要完全避開市場風險，辦法只有一個：不要進場。降低市場風險的第二種重要辦法，就是要正確判斷趨勢，或不要判斷錯誤。事實上，由於道氏理論的特質緣故，投資人可能會花很多時間在場邊觀望。如此自然可以減少風險。對於我們考慮的投資期間，由1897年到2006年，總共有39,493個交易日，道氏投資人留在場外的時間大約是14,378天，相當於整段期間的37％。可是，在我們這份「單純的」研究中，累積獲利沒有考慮投資人留在場外的資金利息收入。


    表1.2的資料並不只是由多邊進行投資。我個人認為，只由多邊進行操作是不明智的，所以我計算道氏理論之多、空操作的累積獲利。股票市場畢竟是有漲、也有跌的，所以當道氏理論發出空頭訊號，投資人將賣掉持股，並且反手放空。我們稍早曾經提到，如果只由多邊操作，截至2006年的累積獲利為$345,781.94，看起來很不錯。'
  - '[PAGE 110]


    可是，如果同時進行多、空操作，道氏理論在同一期間的累積獲利將是 $1,902,859 。


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_110_0.png)


    圖9.1 根據我瞭解，這是顯示道氏理論由開始到2006年止之所有重要轉折的唯一走勢圖。圖形上標示的號碼，完全對應先前表1.1與1.2每列的數據。表格顯示重要轉折發生的精確日期與道瓊工業指數水準。舉例來說，對於此處標示19的轉折點，查閱表格可以知道這是發生在1929年11月23日經濟大恐慌期間，當時的指數水準為305.85
    。


    讀者如果仔細聆聽的話，應該可以聽到我想要傳達的信息。對於絕大部分投資人來說，「長期」是很重要的。可是，在網際網路與電腦世界的「當下」文化裡，講究的是迅速致富，除非是非常富有或非'
  - '[PAGE 111]


    # 第 5-A 章 20 世紀與 21 世紀的道氏理論


    常睿智的人，我很懷疑有多少這類的長期投資人。或許還有一些年長者，他們閱讀過本書稍早的版本。不過，也不要太沮喪，或許會有些新的版依者。


    # 道瓊工業指數


    截至03/23/2006美東標準時間下午11:54(月線資料)


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_111_0.png)


    圖 9.2 續接前一份表格，顯示道氏理論由最初到 2006 年的所有訊號。


    圖 9.1 與 9.2 代表我的想法。我在道瓊工業指數走勢圖上，標示道氏理論的所有買進與賣出訊號。我經常建議研究者與客戶們，把他們做得很差（或很好）的交易標示在這份圖形上仔細觀察這種走勢圖，就可以得到很大的啟發。事實上，如此也可以讓投資人檢驗自己是否'
  - '[PAGE 112]


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_112_0.png)




    根據健全的方法操作。就本書與本編輯的立場來看，所謂健全的方法，是指中、長期的順勢方法。


    另外，這兩份道氏理論方法走勢圖，還可以與第28章介紹之基準點方法（Basing Points）的圖210與210.1做比較，讓讀者除了本書倡導的圖形分析方法之外，還有兩種方法可以研究市場行情。


    羅伯．考貝（robertwcolby.com）是市場技術分析師協會（Market Technicians Association，mta.org）的成員，他在該組織出版的一篇論文上（也可以在其網站上取得），探討道氏理論操作表現的多種客觀運算方法。相關方法之中，我覺得自然通道突破運算（naturalistic
    channel breakout algorithm）非常值得進一步研究。我把這套運算的相關法則列舉出來，不做任何其他評論，但要特提醒讀者，除非經過深入的研究，否則不要以實際的資金操作任何系統。


    +   1. 當道瓊工業指數創9個交易日新高，而且TRAN指數創39個交易日新高$\longrightarrow$進場做多（買進）。


    +   2. 當道瓊工業指數創22個交易日新低，而且TRAN指數創166個交易日新低$\longrightarrow$結束多頭部位（賣出股票）。


    +   3. 當道瓊工業指數創22個交易日新低，而且TRAN指數創166個交易日新低$\longrightarrow$建立空頭部位（放空）。


    +   4. 當道瓊工業指數創36個交易日新高，而且TRAN指數創32個交易日新高$\longrightarrow$結束空頭部位（回補）。'
  - '[PAGE 113]


    # 第6章

    # 重要的反轉型態 I


    第5章討論道氏理論在實務操作上的缺失時，曾經提到該理論不能告訴我們如何從事特定股票的交易。可是，我們又不能買賣指數。（第9版附註：現在顯然不是問題，因為投資人可以直接購買道瓊工業指數，就如同個別股票一樣，交易大盤指數。）對於保守而富有的投資人，如果安全性考量大於獲利，他可以透過分散投資的原則解決這個問題，列出一張清單，涵蓋許多老牌而健全的「藍籌股」，每當道氏理論發出多頭趨勢的訊號，就把這張清單交給經紀人，買進清單上所有的股票。某些股票會有相對不錯的表現，有些則會「泡湯」，但分散投資可以確保合理的平均績效。可是，如果我們可以找到某種方法來挑選適合買進的股票，並在買進理由充分反映到價格之後，立即賣出而換股操作，如此進行投資的績效，應該會比較理想才對。


    還有另一種提升投資報酬的辦法。如果我們能夠在道氏理論發出多頭訊號之前，找到相對安全的買點，在更低價格提早買進；然後，在行情大幅折返而引發道氏理論空頭訊號之前，試圖在更高價位提早賣出。'
  - '[PAGE 114]


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_114_0.png)




    第5章也曾經提到，道氏理論對於中期趨勢的交易，幾乎不能提供什麼幫助。如果我們能夠掌握所有的主升段，而且能夠避開部分的中期折返走勢，顯然有助於投資績效。或者，如果我們可以分別做多與放空行情，就可以兩邊獲利。


    最後，雖然所有股票大體上都會隨著「市場」（大盤指數）起伏而漲跌，但個別股票的實際價格走勢還是有很大的差別。股價指數畢竟只是異中求同，利用單一數據來代表諸多數據的平均值。舉例來說，道瓊工業指數在1946年5月29日結束一段主要多頭市場，但聯合航空（United
    Air Lines）在1945年12月份創高價，通用汽車（General Motors）的峰位則發生在1946年1月，固特異（Goodyear）的高點發生在4月份，杜邦（DuPont）在月份，仙來（Schenley）則在8月份。這些分歧走勢難道沒有利用價值嗎？


    就此處提到的4個問題來說，個股走勢圖的技術分析，絕對可以解決其中第一個問題、也是最關鍵的問題：選股。另外，這方面的分析，通常（但不必然）可以讓投資人在起跑線上不會輸給道氏理論。除此之外，大體上還可以解決中期趨勢的問題，雖然相關操作策略與風險控制仍然有所保留，我們會在適當場合處理相關配合的問題。最後，如果個股「做頭」的時機發生在股價指數大幅回檔之前，謹慎的技術分析通常可以讓投資人即時脫身，甚至把資金轉移到漲勢尚未結束的個別股票。


    根據道氏理論的原則，任何足以影響整體股票市場的已知或可知因素，都已經反映在大盤指數。同理，任何足以影響個別股票未來表現的已知或可知因素，都已經反映在個別股票的走勢圖。個股走勢圖所反映的所有因子，涵蓋整體大盤的影響因子，以及個別股票的特定因子，包括「內線操作」在內。'
  - '[PAGE 115]


    我們不妨假定各位讀者並不屬於所謂的「內線者」。真正的內線者，他們透徹瞭解某家公司的大小細節，包括財務報表的數據，乃至於未來的可能發展；這類集團或許存在，也確實能夠影響股票的市場價格（第9版附註：最後的下場，往往是吃牢飯），但我們可以確定一點，內線交易者的人數並沒有一般想像那麼多，影響所及也沒有如同一般責難那麼嚴重。事實上，內線交易者也會犯錯，他們的計畫可能因為意外發展而遭到破壞，他們所仰賴的專家估計數據也可能不正確。任何成功的內線運作，畢竟還是要透過公開市場買進或賣出，其行為勢必會改變主導價格變化的供需力量，這些作爲遲早都會顯示在價格走勢圖。我們「局外人」可以藉此判斷「內線」的意圖，或起碼也可以判斷內線運作與所有其他市場因子對於供需面的整體影響。所以，各位不需要是內線者，經常也可以尾隨他們前往銀行。


    # ## 重要的反轉型態


    股票價格會呈現趨勢性的發展。某些趨勢呈直線狀，另一些呈曲線狀；某些趨勢持續很久，另一些則很短暫；某些趨勢很不規律、難以界定，另一些則具有「常態」的規律，顯示高度一致性的行動與反動波浪。這些趨勢遲早都會改變方向，可能反轉（向上或向下），或因為某種橫向走勢而中斷，但隔了一段時間之後，趨勢又朝原來方向發展。


    多數情況下，當價格趨勢進入反轉過程（向下或向上反轉），通常在走勢圖上都會呈現特殊性質的區域或「型態」（pattern），產生可供辨識的反轉排列（reversal
    formation）。這些排列有時候很快就完成，有時候則需要好幾個星期的醞釀，然後我们才能確定其中蘊含的'
  - '[PAGE 116]


    趨勢反轉。原則上，反轉區域愈大（價格波動愈寬、涵蓋期間愈長、股票換手數量愈多），反轉的意涵愈顯著。所以，大型的反轉排列，意味著隨後將發生較大規模的走勢；較小的型態，則代表較小的走勢。圖形技術分析者的最主要任務，是學習如何辨識重要的反轉排列，評估其中蘊含的交易機會。


    有一種一天之內就完成的反轉型態，稱為「單日反轉」（one-day reversal）。某些情況下，這種排列具有重大意义，顯示既有上升或下降趨勢將停頓，至少是暫時停頓，但通常並不代表趨勢將立即朝相反方向發展。這是一種很有用的型態，我們稍後會深入討論。可是，一般來說，如果價格排列具備真正的潛力，能夠發展為新趨勢，通常需要一段時間來運作。這應該是很容易理解的，譬如說，一輛大卡車以每小時100公里的速度前進，很難瞬間掉頭而朝相反方向繼續以100公里的時速前進。


    # ## 趨勢反轉需要時間


