    \ Leverage）與敏感指數（Sensitivity Index）的章節也是如此。\n\n### 明顯的年代問題\n\n批評者如果不瞭解長期交易成功的關鍵，或許認為討論「1929年發生的事件」或「1946年遠古時代的走勢圖」跟目前的市場毫無關係。這些人可能會指出，AT&T已經不復存在（至少整個結構已經不同了），紐哈芬（New\
    \ Haven）已經下市，很多走勢圖代表的公司早就作古了。這種評論完全忽略走勢圖象徵的意義。股價走勢圖代表的是人們在市場上的行為模式，這些行為很可能明天就會重複發生在某支網路或高科技股票上。更重要者，這種批評不瞭解過去歷史對於目前交易的重要性。關於這點，容我引用傑克·史瓦格（Jack\
    \ Schwager）在其經典作品《新金融怪傑》（The New Market Wizards）（中文版，請參考寰宇出版公司）內訪問亞爾·懷斯（Al Weiss）的一段對答。\n\
    \n「你研究的走勢圖，最久可以回溯到什麼時候？」\n\n回答：「各個市場的情況差別很大，而且也要看資料的完整程度。以穀物市場為例，最久能夠回溯到1840年代的圖形。」\n\
    \n「有必要回溯到那麼早嗎？」\n\n「絕對有必要，長期圖形分析的目的之一，是瞭解市場在不同經濟循環週期下的不同表現。要找出這些重複發生和持續變動的長期型態，需要很多歷史資料。首先必須確定當時處在經濟週期的那個階段（譬如說，通貨膨脹階段或通貨緊縮階段），這點很重要，因為這樣才能解釋當時演變中的排列型態。」\n\
    \n### 辨識原稿與修訂\n\n此處呈現的是愛德華與馬基當初著述的原文，包括相關的走勢圖與評論在內。本書第5版以來的編者變更與評論，則予以重新安排，如果必要的話，並且特別註明是編者的修訂。\n\
