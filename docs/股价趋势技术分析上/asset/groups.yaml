    # 股價趨勢技術分析（上冊）


    進行交易的人。可是，專業玩家學得很快；所以，現在上得了台面的選擇權玩家，大概都採用某種模型、反模型（antimodel）或反反模型。另外，就交易者類型來說，選擇權銷售者（大多是專業交易者）是大贏家，那些購買選擇權的一般投資大衆，則是輸家。很不公平？現實世界就是如此。


    # 選擇權訂價模型與其重要性


    自從布萊克—薛里斯模型（適用於個別股票）問世之後，跟著出現許多其他模型，包括：考克斯—羅斯—魯賓斯坦模型（Cox—Ross—Rubinstein）與布萊克期貨選擇權訂價模型。對於一般投資大衆來說，前述訊息代表：如果想要交易選擇權，就必須熟悉這些模型，瞭解其功能。請記住，這些模型可以計算選擇權的「理論價值」。專業玩家經常銷售訂價偏高的選擇權，然後購買訂價偏低的對應選擇權，賺取幾乎沒有風險的差價利潤。一般投資人如果搞不清楚選擇權的合理價值，等於是不知道股票的交易價格。對於這類無知的投資人，專業玩家會向他們收取學費。不幸地，很多散戶投資人雖然不斷繳學費，但始終沒以學得教訓。


    科技與知識來自創新者與發明者，最先被專業玩家運用；但最後還是會慢慢普及化。可是，等到一般大眾都瞭解某項發明時，又有一些新玩意兒出現了。雖說專業玩家基本上都擁有相對先進的工具，但一般投資人如果要使用選擇權，還是要想辦法徹底教育自己。由於本書並非討論選擇權的書籍，讀者如果需要這方面的進一步資料，請參考附錄D。


    此處想要介紹一本不錯的選擇權交易者必備書籍：勞倫斯·麥克米倫（Lawrence McMillan）的《選擇權投資策略》（Options as a'
  - '[PAGE 443]


    Strategic Investment，寰宇出版公司）。另外，初學者可以跟芝加哥選擇權交易所（CBOE）聯絡，其網站 www.cboe.com也提供一些教學軟體。


    # 指數期貨


    期貨就如同選擇權一樣，能夠提供投機性的信用擴張；換言之，所投入的資本遠少於直接購買根本商品或指數，就能控制相對龐大的部位。期貨推銷員很喜歡強調，你存入的保證金額度只是契約價值的5%或10%，如果契約價格呈現類似幅度的走勢，你就可以獲取一倍的報酬。可是，這些推銷員卻不願談論相反的可能性，萬一價格出現反向走勢，就可能勾消你的保證金。從事期貨交易不同於購買選擇權，市場走勢造成的損失，可能超過保證金。期貨交易帳戶可能出現赤字，你會欠經紀商錢；換言之，期貨交易損失可能超過100%。基於這個原因與其他考量，在沒有充分準備之前，千萬不要從事期貨交易。


    讀者如果想要做這方面的準備，不妨閱讀目前最棒的一本相關書籍，史瓦格的《史瓦格期貨技術分析》（Technical Analysis，Schwager on Futures，中文版，請參閱寰宇出版公司）。


    假定我們不打算利用期貨契約進行投機，而是要針對道瓊鑽石成分股或道瓊指數成分股的投資組合進行避險。換言之，我們要買保險，不是投機。作爲一個非常簡化的例子，投資人發現道瓊指數不能突破某個頭部而開始進入區間整理（可能是連續或反轉型態）。碰到這種情況，他可以放空道瓊指數期貨作為避險。現在，他同時持有多頭與空頭部位：做多現貨，放空期貨。期貨部位的停損，設定在賣價的稍上方，萬一價格持續上漲，就平倉出場。反之，如果價格下跌，'
  - '[PAGE 444]


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_444_0.png)




    他將繼續持有期貨部位，直到修正走勢见底，或直到他判定行情已經向上反轉為止。這個時候，期貨部位將獲利了結（需要課稅），但他仍然持有現貨部位，整體獲利應該可以彌補稅金，也應該可以彌補如果賣掉現股而重新建立部位的困難與滑移價差。


    # 指數或期貨選擇權


    選擇權可以用來投機或避險。舉例來說，在一段突兀漲勢之後，某投資人認為他做多的S&P 500或S&P存託憑證（SPDRs）進入超買狀態。於是，他可以購買S&P的指數權權，防範預期中最可能發生的跌勢。如果股價真的下跌，選擇權部位可以獲利，而原先持有的S&P部位繼續存在。反之，如果股價指數繼續挺進，他將損失選擇權的權利金，這等於是為了防範股票投資組合發生損失而支付的保險費。


    附註：前述策略只是提供給讀者參考的概念。實際採取這類策略或任何陌生程序之前，投資人務必要徹底瞭解相關資訊，透過模擬操作重複演練，測試各種可能發生的結果，然後才可以實際投入資本。總之，投資人必須搞清楚可能發生哪樣的損失。很多網站提供這類服務，投資人也應該在電腦中另外建立模擬投資組合，不要與實際交易混在一起。


    交易者也可以操作期貨選擇權（期權）。芝加哥期貨交易所（CBOT）同時提供道瓊工業指數的期貨與選擇權。期權操作與前述的現貨選擇權很類似，可以用於投機或避險，唯一的差別是期權的根本資產是期貨契約，不是現股或股價指數本身。如果投資人對於期貨操作不熟悉的話，可能會覺得很不自在，尤其是期貨價格與現貨價格之間如果有很大差距的話，這種情況發生在1987年與1989年，當時的期貨價格曾經遠低於現貨。信用擴張程度是採用期貨契約的主要理由'
  - '[PAGE 445]


    之一。採用期權的主要理由，是對於未來走勢的不確定，只願意花費選擇權的權利金。


    對於投機客來說，他當然可以把股票與期貨完全擺到一旁，只針對選擇權進行交易。可是，實際採取這項措施之前，交易者或許需要到大學研究所上課。請注意，成功的選擇權交易者之中，業餘與專業玩家之間的人數是不成比例的。事實上，我們甚至可以说，成功的選擇權交易者都是專業玩家。


    # 現代投資組合理論


    現代投資組合理論（Modern Portfolio Theory，簡稱MPT）是投資組合經理人為了嚴格控制風險與報酬，而對於投資組合之成分所做的分類與分析。這類程序希望在風險與報酬之間找到量化關係。不只是分析投資組合的個別成分，MPT試圖決定投資組合構成部分彼此之間的統計關係，以及它們與市場之間的關係。


    MPT的分析程序包括：（1）投資組合價值評估，透過期望風險與期望報酬來描述投資組合；（2）資產配置，決定資本如何配置到各種不同的資產類別或交易工具（債券、股票……等）；（3）最佳化，透過投資組合成分選擇來調整風險/報酬之間的得失關係；（4）績效衡量，根據個別股票的風險做系統性或證券相關的分類。


    對於一般投資人來說，MPT有什麼重要性？不多。事實上，對於專業分析師（例如：本人）與專業玩家，MPT是否具有實用價值也是很大的問題，雖然大家都把MPT看成是發生船難狀況的救生圈。孟德爾布洛特（Mandelbrot）曾經在論文（「華爾街多重碎形漫步」，A
    Multifractal Walk Down Wall Street）與《科學美國人》（Scientific American，1999年2月與1999年6月）表示，MPT捨棄大約5%的統計'
  - '[PAGE 446]


    ![](img/899bfe361f2e586eb5ba6fae0e5c5ec0_446_0.png)


    經驗，就如同資料不存在一樣（實際上是存在的）。他發現，所忽略的經驗包括市場的「10級」超級風暴，但這導致投資組合失敗的原因，卻歸咎於資料錯誤，而不是程序錯誤。


    # 神奇的投資科技


    金融與投資理論還有哪些新發展，是一般投資人應該知道的？（請參考第42章討論的VAR）。原則上，當然是愈多愈好，但最頂尖的玩家不僅知道所有的相關發展，而且還不斷追尋各方面的可能運用。可是，如同馬基所說的，究竟什麼是充分而必要知道的（請參考《華爾街心理戰》）？除非心智狀態很幼稚，或具備宗教般的極端信念（這些人根本不知道己不知道），否則沒有什麼是絕對明確的。所以，我只能說，本書或許已經提供一般投資人所需要知道的，而且知道這些也就夠了。


    請注意，只要閱讀本書，準備好相關的走勢圖，任何老太太都能擊敗那些擁有超級電腦、現代投資組合理論、取得諾貝爾獎或其他等等專業玩家。我熟悉的一些投資團體，它們投資無數資源來發展即時交易系統，實驗過程顯示相關系統可以徹底擊敗市場。可是，一旦拿到市場上實際運用，卻發現系統過於龐大，電腦運算速度跟不上行情變動，所以不能做即時交易。這就是哲學家提供不切實際的解答。


