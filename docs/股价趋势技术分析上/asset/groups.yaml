    | 貨幣市場：+ $400,000 · 1.005 | $402,000 |

    | **總計** | **$497,000** |


    透過期貨市場避險，你相當於擁有價值$100,000的道瓊指數成分股，以及價值 $400,000的貨幣市場交易工具。股票行情下跌，只影響價值 $100,000的股票投資組合，而不是
    $400,000；另外，貨幣市場賺取的報酬率0.5%，其本金額外增加$300,000。


    如果沒有做期貨避險，股票投資組合價值為 $480,500。期貨空頭部位的獲利 $15,000，可以用來彌補 $300,000股票投資組合的損失，因為後者已經透過期貨空頭部位沖銷而中性化。總之，建立價值
