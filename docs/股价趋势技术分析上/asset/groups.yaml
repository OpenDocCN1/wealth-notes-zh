    # 電腦科技的重要性


    電腦可以說是紙漿之後的最重要人類發明。這項神奇的工具，究竟有什麼用途或重要性呢？（市面上有無數的套裝軟體，可以執行下文討論的諸多功能。）電腦如果不能有效辨識適合交易的機會，那還有什麼用呢？


    對於馬基分析機構來說，電腦的最重要功能，是自動處理一些重複性的工作。資料可以直接由資料庫下載。只要按幾個鍵，就可以叫出走勢圖。投資組合帳戶的資料處理與報稅工作，都變得相對簡單，操作者可以一邊喝咖啡，一邊操作電腦。這一切讓電腦看起來像是很重要的工具，不過實際上的效用很有限。這種說法也未必貼切。對於馬基分析機構而言，電腦除了除理繁瑣的重複性工作之外，至少還有一項重大功能：投資組合分析。請參考附錄D，該處引用一個相當複雜的例子，說明專業交易者如何進行投資組合分析（布萊·胡爾選擇權研究機構
    [Blair Hull and Options Research Inc.]）。即使是一般投資人運用的相對單純投資組合，也可以受惠於電腦的投資組合管理功能，或是利用網際網路提供的服務，或是直接使用商業套裝軟體（關於這些套裝軟體，請參考附錄D）。


    電腦能夠把基本資料透過各種不同形式表達出來，這是另一項有用功能，例如：圈叉圖、陰陽線、收盤價曲線圖；這方面的轉換可以瞬間完成，能夠讓分析者由不同角度觀察資料。某些分析需要電腦提供的資料計量處理能力，譬如：成交量研究，還有移動平均，50天與200天移動平均可以提供一些有趣的資訊。很多市場參與者（包括基本分析者在內）認為這兩條移動平均很重要。謹慎的圖形分析家瞭解，這兩條移動平均與股票市況之間存在明確的關連。'
  - '[PAGE 431]


    可是，下列這些（名稱怪異的）指標又是什麼東西：隨機指標（stochastics）、包寧傑帶狀（Bollinger Bands）、%R、MACD、移動平均（簡單、指數、穿越……等）、價格／成交量背離指標（price/volume
    Divergence）、RSI（韋達當初設計的單純格式）、VP趨勢（VP Trend）、TCI、OBV、交易帶狀上限／下限（Upper/Lower Trading
    Bands）、ESA交易帶狀（ESA Trading Bands）、AcmDis？這些指標之中，某些或許有點道理，某些情況下也有點用途。正如同我們瞭解的，任何交易系統至少在兩種情況下，可以展現完美的功能：研究階段與大多頭市場。那些市場上推崇的交易天才，經常是憑透過這類數據導向的指標而聞名。本書前任編輯曾經簡單探討這類指標，請參考附錄C。第9版附註：另外，如同我所說的，你也可以利用螺絲起子來釘鐵釘。工具發明者可能獲致重大成功，但其他使用者可能因此破產。


    這些指標提供的，很可能是多餘的資訊，就像基本分析提供的多餘資訊一樣，經常遮掩了真正重要的東西，讓投資人看不到那些會真正影響交易結果的資訊。投資人或許還是應該採用行為模型，因為市場反映的是人類行為。數據導向的技術分析讓人看了眼花撩亂，就像強生博士用後腳走路狗，往往不能把市場擺在適當的架構上。唯有「人」才能辦到這點。數據導向模型畢竟沒有考慮很多因素，包括：裙子長度、月亮圓缺、太陽黑子、經濟循環，以及市場的多空狀態（如果空頭市場還存在的話）第9版附註：這是相當諷刺的評論，寫在2000年崩盤之前。總之，人類大腦仍然是唯一能夠綜合評估所有定量、定性資訊的工具，很多東西是沒有辦法簡化為0與1。受過適當訓練的人，仍然是衡量市況與股價狀態的最佳判定者。'
