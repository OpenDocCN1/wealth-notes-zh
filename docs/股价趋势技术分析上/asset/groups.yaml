    細心的讀者可能會發現，此處引用的數據與其他資料來源，似乎有些出入。這主要是因為道氏理論專家對於行情判讀，未必有一致性的看法。換言之，對於訊號的性質與發生日期，每位專家的看法可能有差別。（舉例來說，有些人認為
    1956 年 10 月 1 日是再進場日期，另一些人則認為是 1957 年 10 月 7 日）。當然，這意味著行情解釋涉及主觀判斷。道氏理論不是一種完全客觀的運算，就如同盤勢判讀不是客觀的運算一樣。


    總之，每當道氏理論宣佈多頭市場出現，就買進道瓊工業指數，然後繼續持有，直到道氏理論宣佈另一個空頭市場開始，則賣出股票。假定最初在 1897 年拿 $100
    投資道瓊工業指數，到了 2005 年底，帳戶餘額成長為 $345,781.94。


    到了 2005 年底，如果按照市價進行結算，前述技術性投資人的口袋裡將有這些金額，相對於買進－持有策略的 $39,685.03。


    姑且不論道氏理論是否仍然適合用來評估整體股票市場，但最起碼可以用來預測其相關部門的行情轉折，這些部門的股票市值——如同傑克·史奈普指出的——是那斯達克市場的
    5 倍。


    如同馬克·吐溫所說的，每個人都談論著道氏理論，但沒有人可以搞出一些東西。馬克·吐溫的說法或許不完全是如此，但大體上反映出政府的作為。为了深入了解道氏理論，我與金門大學財務系的布萊恩·布鲁克（Brian
    Brooker）進行一系列的研究。以下表 1.2 是我們的一些研究結果，摘錄自《剖析道氏理論》（Dissecting Dow Theory）。


