  md: '# 美股与全球的关系


    +   - 投资美国股市与全球股市的关系

    +     - 美国聚集全球最大的跨国公司，反应全球经济的基本面

    +     - 各国的最大互联网公司聚集美股，反应了新经济前景

    +   - 投资美国公司与投资BRICS的关系，以苹果为例

