  md: '# 利率风险：定义与管理方法


    +   - 国际企业的财务风险源：利率风险和外汇债务的汇率风险。利率风险是市场基准利率变化时债务支付的不确定性。

    +   - 贷款种类：固定利率和浮动利率

    +     - 浮动利率：Libor为参考基准

    +   - 利率风险的衡量方法

    +     - 与股票风险衡量方法不同，一般用久期衡量，表示利率变化一个百分点时债务上升的幅度，其近似等于债务的平均到期时间

    +     - 相当数量公司ROA低于银行存款利率。1%的收益显得特别重要。

    +   - 风险管理方法：FRA，利率期货，利率互换'
