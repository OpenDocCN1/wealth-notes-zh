- pgno: 272
  md: '# 通过套保管理外汇风险必要性的理论解释


    +   - 套保降低外向型企业风险

    +   - 若中国企业居民的效用函数 $U = R - \frac{1}{2}\gamma\sigma^2$, 其中 R, σ分别表示预期收益和标准差，企业追求效用最大，γ为风险回避系数

    +     - 如果 $1 未来50%可能涨1%，50%可能跌1%，则预期收益 R=0，σ²=1（%²）.企业不会买入外汇。

    +     - 如果企业有 $1 应付账款，则不参与外汇市场面临的效用为 -γ * 1%²，如果选择买入即期外汇（进行对冲），则效用为0（忽略利率因素）。'
  merge: -1
  img_proc: true
