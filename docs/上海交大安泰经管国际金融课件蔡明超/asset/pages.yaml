- pgno: 124
  md: '# 国际债券市场（2）欧洲债券：

    双币种债券


    +   定义：发行日元债券，利息为日元，但到期本金支付为美元。


    +   如果知道该债券的现在日元交易价格，可推出隐含的未来美元汇率。


    +   例A five-year, 4 percent Euroyen bond sells at par. A comparable risk five
    year, 5.5 percent yen/dollar dual currency bond pays $833.33 at maturity. It sells
    for ¥110,000. What is the implied ¥/$ exchange rate at maturity?


    +   含义：Since the dual currency bond is of comparable risk, it will yield 4 percent
    like the straight Euroyen bond selling at par. Thus,


    ¥110,000 = ¥5,500 x PVIFA(n = 5, i = 4%) + S5(¥/$) x $833.33 x PVIF(n = 5, i =
    4%) = ¥5,500 x 4.4518 + S5(¥/$) x $833.33 x .8219


    +   PVIFA表示n年期,每年利息4%的现值，PVIF表示n年期按4%贴现的现值。'
  merge: -1
  img_proc: true
