  md: '# # Factors Affecting

    ## Current Account (International Trade Flows)

    ### 影响经常性账户的因素


    Inflation（-，surplus decrease）


    +   - A relative increase in a country’s inflation rate will decrease its current
    account, as imports increase and exports decrease.


    National Income（-）


    +   - A relative increase in a country’s income level will decrease its current
    account, as imports increase.'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# Factors Affecting

    Current Account (International Trade Flows)

    影响经常性帐户的因素


    # Government Restrictions


    +   - tariffs, or a quota. 关税，配额（稀土），反腐

    +   - 1992以来中国关税税率的调整


    | 时间 | 1992 | 1993 | 1995 | 1997 | 2001 | 2002 |

    |------|------|------|------|------|------|------|

    | 关税率 | 43. 2 | 36. 4 | 23. 0 | 17. 0 | 15. 3 | 12 |


    +   - 我国的经常帐户管理，---“可自由”兑换

    +     - 限额管理是经常项目外汇账户管理的主要内容

    +       - 即企业的外汇收入在核定的限额内可以意愿结汇，超过限额的部分强制结汇。

    +       - 从2002年10月份起，核定账户限额为企业上年度经常项目外汇收入的20%。2008年起完全放开（易纲，2012）

    +       - 防止在国际收支状况恶化时，企业积存过多外汇，削弱国家外汇储备，影响国内外外汇市场供求和汇率稳定'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# # Factors Affecting

    ## Current Account (International Trade Flows)

    ### 影响经常性账户的因素


    +   - **Exchange Rates**（贬值，+）

    +     - If a country’s currency begins to rise in value, its current account balance
    will decrease as imports increase and exports decrease.

    +     - （汇率变化+商品对价格的弹性才产生影响。如美元升值，但 CPU 只有美国生产，则需求不下降（替代弹性低））


    +   - 弹性定义：单位价格的变化导致商品数量变化的幅度

    +     - 出口弹性 $\eta_{xe}=\frac{\partial X/X}{\partial e/e}$：$e$ 一个单位外币等于多少本币，$X$
    出口商品数量

    +     - 进口弹性 $\eta_{Me}=\frac{\partial M/M}{\partial e/e}$：$M$ 进口商品数量'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# a weak home currency may not necessarily improve a trade deficit贬值不一定促进出口


    +   ◆ 1）从协议到生产的时滞

    +     ◆ 合同期，本币贬值导致进口结算上升

    +     ◆ 传递期：本币贬值消费者逐步考虑比价效应

    +     ◆ 数量期：贬值效应转为消费者购买行动

    +   ◆ 2）本币贬值后本国产品价格可能上升

    +   ◆ 3）各国竞相贬值

    +   ◆ 4）关联交易。（从跨国公司的母公司进口

    +   ◆ 5）进一步贬值的预期

    +   ◆ 6)马歇尔—特纳条件： η Xe + | η Me | >1 进出口需求对价格的弹性大于 1'
  merge: -1
  img_proc: true
