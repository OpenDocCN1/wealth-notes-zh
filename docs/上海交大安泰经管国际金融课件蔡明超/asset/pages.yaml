- pgno: 169
  md: '# 以利息差为目标的套利活动


    # （1）无抛补套利(Uncovered Interest Arbitrage)


    +   - 欧元即期汇率 =1.16，

    +     美元90天利率2%，欧元利率= 4%


    +   - 某投资者从货币市场按2%利率借入$。期限为90天。将美元换为欧元，按4%利率贷出，到期将欧元再转为美元，并还本付息，则可获得超额利息2%。


    +   - 这一活动称为无抛补套利，或Currency Carry Trade，风险是欧元到期可能大幅度贬值(也称存在欧元敞口)


    +   - 如果存在远期外汇市场，即投资者现在约定好，将来可以按照现在预订的价格卖出，则可规避外汇风险'
  merge: -1
  img_proc: true
- pgno: 170
  md: "# （2）抛补套利 Covered Interest Arbitrage）\n\n○ **Covered interest arbitrage**（购入利息高的货币，为防止高息货币贬值，同时卖出其远期）\n\
    \n○ 如果存在远期欧元市场，远期汇率和即期汇率都为1.16，美元90天利率2%，欧元利率=4%\n\n+   - 某投资者从货币市场按2%利率借入1$，期限为90天，将美元换为欧元，**同时卖出远期欧元**。按4%利率贷出欧元，到期将欧元再转为美元，并还本付息，则可获得超额利息\
    \  \n+     `1/1.6*(1+0.04/4))*1.6-1*(1+0.02/4)=0.005$`\n\n+   - 投资欧元的同时，卖空远期欧元，避免欧元到期可能贬值。称为抛补套利（使欧元敞口为0）"
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 以利息差为目标的套利活动

    （2）抛补套利Covered Interest Arbitrage


    +   - 如果大家都觉得有抛补套利机会，则欧元的现汇价格不断推高，远期价格不断走低。最终使欧元利息收入等于欧元汇率损失。即无利可套

    +   - 抛补套利将导致汇率与利率间存在一等式关系

    +   - 抛补套利实质：存高息货币的同时(先需借低息货币，买高息货币的现货)，抛高息货币的期货，使外汇敞口净头寸为0'
  merge: -1
  img_proc: true
- pgno: 172
  md: "# 利率平价公式推导\n\n+   - *Interest rate parity*, IRP 是指由抛补套利，导致的利率与汇率间的等式关系）\n+\
    \   - 证明：下面两种方式存钱，最后得到的钱一样：（1）将1个单位本币直接存银行；（2）抛补套利，将1个单位本币换成外币存银行，同时卖出远期外币。\n\
    +     - 方法（1）得到的钱 = 1 + i_H\n+     - 方法（2）得到的钱 = (1/S)×(1+i_F)×F\n+       \n+\
    \       = (1/S)×(1+i_F)×[S×(1+f)] = (1+i_F)×(1+f)\n+     - 这里P是外汇的远期的升水率，S：1个外币现货兑换本币，F：1个外币期货兑换本币数\n\
    +     - 两者相等，有远期外汇升水 f 满足：\n+       \n+       f = \\frac{1+i_H}{1+i_F} - 1"
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 利率平价公式含义


    远期外汇升水


    $f = \frac{1 + i_H}{1 + i_F} - 1$


    +   - 高息货币，远期汇率小于即期

    +   - 远期外汇的上升率（升水）等于其利率的贴水

    +   - 注意：3个月期远期外汇的升水等于3个月利率的贴水。6个月期远期外汇的升水等于6个月利率的贴水。因此严格的IRP公式：

    +   - $f(n) = \frac{(1 + i_H * \frac{n}{12})}{(1 + i_F * \frac{n}{12})} - 1 \approx
    i_h - i_f$，或 $F(n) = S \frac{(1 + i_H * \frac{n}{12})}{(1 + i_F * \frac{n}{12})}$

    +   - 如果本币利率突然宣布上升，市场有何变化？'
  merge: -1
  img_proc: true
