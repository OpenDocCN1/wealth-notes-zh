- pgno: 40
  md: '# 人民币汇率制度（改革开放后）


    +   - 80年代改革开放初，外汇计划管理。发行外汇兑换券，黑市猖獗。人民币最高1$=1.45RMB，（据此，中国在1995年GDP 3万8千亿$,成为第二经济大国）

    +   - 1 9 8 5 年 1 月 1 日，外汇牌价双轨制。贸易收支与非贸易收支均按官方牌价结算，调剂外汇市场仍然存在。即官方牌价 1 美元 = 5 .
    8 元左右，调剂外汇价 1 美元 = 8 . 7 元左右。

    +   - 1994年1月起并轨，建立银行间外汇交易中心

    +   - 1996年12月起经常项目可自由兑换'
