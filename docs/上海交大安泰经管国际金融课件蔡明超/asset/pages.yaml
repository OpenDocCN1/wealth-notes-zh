- pgno: 269
  md: '# 企业外汇风险管理背景


    +   - 非金融机构的需求

    +     - 2011年上海外贸依存度147%，1998年的58%。2011年全国外贸依存度水平50%。

    +       - 外贸依存度是外贸进出口总额占GDP的比例

    +       - “完善汇率形成机制”的说法，使得美元汇率波动对中国经济的影响尤其重要

    +       - 人民币年均升值幅度5%，但很多出口企业的利润率只有5%

    +     - 对日本、美国和欧盟三大贸易伙伴的贸易额，已占到上海进出口贸易总额的六成以上。日元、欧元汇率的波动对经济影响也不容忽视。


    +   - 金融机构

    +     - 投行：汇率风险是股票分析师预测公司未来利润的重要不确定性因素之一。

    +     - 银行：经营和销售汇率风险管理产品'
