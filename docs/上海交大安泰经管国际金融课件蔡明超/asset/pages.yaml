- pgno: 55
  md: '# 国际收支与宏观经济等式


    +   - GDP ≡ C+I+G+X-M: Output，支出法核算

    +     - C = consumption spending

    +     - I = capital investment spending

    +     - G = government spending

    +     - X = exports of goods and services

    +     - M = imports of goods and services

    +   - Y ≡ C+S+T: Income收入法核算

    +     - S=Saving

    +     - T=Tax

    +   - Market equilibrium: GDP≡C(Y)+I+G+X-M=Y

    +   - Deficit: X-M<0；T-G<0'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# Balance of Payments


    ![](img/26c5ecc8e8d39d3ae08a606cec76fa4e_56_0.png)


    +   - The *balance of payments* 国际收支平衡表 is a measurement of all transactions between
    domestic and foreign residents over a specified period of time. (一定时期本国与外国居民间的所有交易)

    +   - Each transaction is recorded as both a credit and a debit, i.e. *double-entry
    bookkeeping*. (每笔交易借贷复式记帐)

    +     - 出口1美元或者收到1美元投资的同时，官方储备增加1美元'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Balance of Payments: Three Accounts


    +   - The transactions are presented in three groups – (经常项目，资本与金融项目，平衡项目)

    +     - a *current account*,

    +     - a *capital* and *financial account*,

    +     - balance account

    +     - 导致资金流入的一般记贷方，用正号表示：出口，融资'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 第1类账户：*Current Account*


    +   - The *current account* 经常账户：

    +     - purchases of goods or services 购买商品或劳务，

    +     - the provision of income on financial assets 金融资产的利息股息，or

    +     - unilateral current transfers (e.g. government grants and pensions, private
    remittances 单方面转移（捐赠）)


    +   - 复式记账

    +     - 中国出口10万美元服装，则经常项目贷记10万美元（+），同时国家外汇储备借记10万(-).（和为0，或者说贷方余额=借方余额）'
  merge: -1
  img_proc: true
