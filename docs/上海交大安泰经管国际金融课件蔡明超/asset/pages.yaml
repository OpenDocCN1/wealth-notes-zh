- pgno: 232
  md: '# 外汇投资的分析方法与金融市场效率


    +   - 金融市场效率理论(Eugen Fama,2013 Nobel Prize Winner)在外汇市场应用：

    +     - 非有效：历史价格及各种信息都未能被反应

    +     - 市场弱有效：大家都采用某种技术指标去预测，该指标将无效。

    +     - 半强有效，大家都采用经济基本面分析去预测，则基本分析无效。

    +     - 强有效市场：各种分析方法都不能获得超额利润

    +   - 反对市场有效的代表人物Yale大学Shiller也在2013年同时获得诺奖。

    +     - 人有行为偏差，非理性

    +     - 媒体大量报道会吹大泡沫。

    +     - Dividended / Price可以预测泡沫

    +   - NPR代表人物访谈：

    +   - Shiller公开课


    ![](img/26c5ecc8e8d39d3ae08a606cec76fa4e_232_0.png)'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 外汇投资的分析方法与金融市场效率


    +   外汇投资的分析方法


    +   平价分析（PPP、IFE、回归）、BOP分析、技术分析


    +   金融市场效率理论(Eugen Fama,2013 )在外汇市场应用（中国居民投资者与SAFE）：


    +   市场弱有效：大家都采用某种技术指标去预测，该技术分析预测将无效。


    +   半强有效，大家都采用经济基本面分析（平价法、BOP）去预测，则基本分析无效。则外汇远期价格就是未来价格的最佳估计


    +   更远的远期汇率，市场上不可以直接观测到。因为CME并没有两年以上的期货的牌价。可以由IRP公式得到。（例如：美元5年期复合利率6 1 %，英镑8 4
    %，则英镑5年后贴水预期为（1. 6 1 /1.84-1）


    +   强有效市场：各种分析方法都不能获得超额利润，分散持有外汇头寸'
  merge: -1
