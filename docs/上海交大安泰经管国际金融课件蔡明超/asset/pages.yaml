  md: '# 什么是外汇的经济风险


    +   - *Economic exposure*： future cash flows can be influenced by exchange rate
    fluctuations.（汇率变化引起的销售、成本的变化，也叫经营风险）

    +   - 交易风险与经济风险的差别

    +     - 人民币升值导致本公司以美元计价的出口产品(已经形成应收账款)，转换成人民币后销售下降

    +     - 人民币升值导致本公司的人民币计价的出口产品数量下降，从而销售收入下降'
