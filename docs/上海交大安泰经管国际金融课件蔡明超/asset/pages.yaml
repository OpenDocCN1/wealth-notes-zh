- pgno: 313
  md: '# 会计换算方法


    +   o 功能货币与报表货币存在差异

    +     - 功能货币：经营中使用的主要货币。

    +     - 报表货币：中国香港上市公司HK$，中国在美国上市公司USD,但功能货币RMB


    +   o 功能货币转报表货币方法：现行汇率(Current Rate)法和货币非货币法（美国会计准则FASB以现行汇率为主，国际会计准则以货币非货币为主）


    +     - 现行汇率法：资产负债表除股东权益外以当前汇率计，利润表通常以平均汇率计。汇率换算导致的差异出现在资产负债表的CTA账户轧平。


    +     - 货币/非货币：货币性的资产负债为当前汇率，其它为历史汇率。利润表通常以平均汇率计,成本与折旧以历史汇率计。调整出现的不平衡在损益表中最后轧平。'
  merge: -1
  img_proc: true
