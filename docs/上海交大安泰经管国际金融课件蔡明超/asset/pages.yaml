- pgno: 43
  md: '# 我国当前汇率安排两难

    --人民币升值有八利


    +   1. 国外产品价格下降，提高国人的生活水平和产业水平

    +   2. 使用进口原材料比率较高的厂商的生产成本会下降.

    +   3. 企业的国外投资能力将增强

    +   4. 人民币升值，使已在华投资的外资企业利润增加.

    +   5. 在非制造业方面，人民币升值有利于人才出国学习.

    +   6. 未偿还外债还本付息所需本币的数量相应减少.

    +   7. 合理估值中国资产.

    +   8. 有利于中国 G D P 在国际经济中地位.'
  merge: -1
  img_proc: true
- pgno: 44
  md: "# 我国当前汇率安排两难  \n--人民币升值有七弊\n\n+   1. 对出口存在干扰\n+   2. 可能导致投机盛行。由于以美元表示的国民财富迅速增加，股市和房地产达到高潮\n\
    +   3. 升值后，可能使国内投资环境恶化，新增的海外投资则会减少，因为这种投资变得相对昂贵\n+   4. 升值后，目前出口的产品大部分是技术含量较低的劳动密集型产品，出口受阻会增加就业压力\n\
    +   5. 升值后，通货紧缩局面压力\n+   6. 许多尚不具备竞争力的产业将直接受到冲击\n+   7. 产生一种“暴富效应”。日本就是一个例子。日元与美元的比率战后最早是350∶1，最高到70∶1\n\
    \n“利弊”可能导致贫富加剧"
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 升值预期以来的专家观点回顾：六方面减压³⁵


    一是维持贸易的总量及结构性平衡。在遵守入世承诺，逐步减少对贸易的限制时；


    二是进一步放宽对经常项下的外汇限制。逐步取消强制性银行结售汇制度，放宽对旅游等外汇汇兑限制；


    三是建立银行、企业间外汇市场，放开主要外贸企业进入外汇市场；


    四是放宽汇率波动幅度，至少可以考虑从目前的3‰放宽至1%的固定汇率下的波动幅度；


    五是减少对外汇交易者的头寸控制；


    六是加强外汇期权及远期市场建设。


    政府多采用舆论干预（大声吆喝），最低成本降低升值压力'
