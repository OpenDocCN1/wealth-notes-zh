    如何实证检验投资N个国家的风险分散效果？以100个国家为例：


    +   只投资1个国家，取这100个国家股市指数风险的平均值，作为只投资一个国家的风险衡量σ(1);


    +   等权重投资2个国家，从100个国家股市指数中任取2个国家构成投资组合计算风险，然后对所有可能情形进行平均，作为投资2个国家的风险衡量σ(2);


