  md: '# ADR不同级别


    | Description | Level I | Level II | Level III | Rule 144A |

    |---|---|---|---|---|

    | Description | Unlisted program in the U.S. | Listed on a U.S. exchange | Shares
    offered and listed on a U.S. exchange | Private placement to Qualified Institutional
    Buyers; U.S. private placement |

    | Trading | OTC | NASDAQ, AMEX, NYSE | NASDAQ, AMEX, NYSE | U.S. private placement
    |

    | SEC Registration | Form F-6 | Form F-6 | Forms F-1 and F-6 | None |

    | U.S. Reporting Requirements | Exempt under Rule 12g3-2(b) | Form 20-F* | Form
    20-F* | Exempt under Rule 12g3-2(b) |


    Level I to III上市由易到难：是否交易所上市，财务报告合规，是否融资


    *Financial statements must be partially reconciled to U.S. GAAP.

    Level I: The most basic type of ADR program.

    The issuer is not seeking to raise new equity capital in the U.S. and/or cannot
    list on NASDAQ.

    Level II: The issuer is not seeking to raise new equity capital in the U.S. and
    ADRs can be listed on NASDAQ, AMEX, or NYSE.

    Level III: The issuer floats a public offering of new equity in the U.S. and lists
    the ADRs on NASDAQ, AMEX, or NYSE.

    Rule 144A: This type of ADR program is a private placement of equity to Qualified
    Institutional Buyers (QIBs). It can only be traded among QIBs.

    Source: Excerpted from www.adr.com.'
