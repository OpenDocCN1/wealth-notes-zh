  md: '# Eurocurrency Market


    # 欧洲货币市场（1）：定义与产生背景


    +   - The Eurocurrency market is made up of several large banks called *Eurobanks*
    that accept deposits and provide loans in various currencies. (专门经营境外货币的银行也称欧洲银行，并不一定在欧洲)

    +   - For example, the Eurocurrency market has historically recycled the oil revenues
    (petrodollars) from oil-exporting (OPEC) countries to other countries. (七十年代OPEC国家出口石油，石油美元大量流入，后又流入欧洲市场并被借贷到其它国家，政治宗教军事冲突促进了欧洲美元市场的发展)

    +   - 欧洲美元存款利率高，贷款利率低，原因：不受央行监管（监管套利）'
