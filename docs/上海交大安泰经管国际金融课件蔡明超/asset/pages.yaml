- pgno: 13
  md: "# Foreign Exchange Market:  \n国际货币体系三步曲\n\n+   - From 1876 to 1913, each currency\
    \ was convertible into gold at a specified rate, as dictated by the *gold standard*.（金本位：银行券自由兑换金，各国汇率取决于黄金含量）\n\
    +   - The 1944 *Bretton Woods Agreement* called for fixed currency exchange rates.（布雷顿协议与双挂钩）\n\
    +   - In 1973, the official boundaries for the more widely traded currencies were\
    \ eliminated and the *floating exchange rate system* came into effect.（牙买加协议：西方国家主要货币汇率浮动工资与金融风险传播的开始，并推动外汇交易市场发展）\n\
    \n![](img/26c5ecc8e8d39d3ae08a606cec76fa4e_13_0.png)"
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Exchange Rate Systems

    汇率制度分类


    +   - 简单分类

    +     - Fixed（1973以前）

    +     - freely floating（自由浮动）

    +     - managed float管理浮动

    +     - Pegged盯住


    +   - IMF在1999年用新方法对各国的汇率制度进行分类，将汇率制度分为八类，按浮动程度由小到大排列

    +     - 无独立法定货币（美元化）、货币局制度、固定钉住制、水平带内的钉住、爬行钉住、爬行带内的汇率安排、管理浮动、单独浮动'
  merge: -1
  img_proc: true
