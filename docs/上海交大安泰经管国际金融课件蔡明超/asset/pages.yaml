- pgno: 23
  md: '# (7) Managed Float Exchange Rate System管理浮动


    +   - *managed* (or “dirty”) *float exchange rate system*, （无限制+干预）

    +   - 实行国家：中国，有一定市场规模的发展中国家

    +   - 优点: 政府的国内政策目标优先于外部目标。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# (8) 浮动汇率


    +   - 汇率由市场因素决定

    +   - 实行国家：主要西方国家货币

    +   - 缺点：企业要耗费资源管理汇率风险

    +   - 优点：

    +     - 少受其它国家经济变量影响，例美通胀，则增加对英商品需求，英镑需求上升汇率上升，从而对英商品需求下降，英通胀程度小，并不随美通胀

    +     - 央行无须干预，不会导致其它变量连锁反应,政府无须大量外汇储备

    +     - 制定政策毋须稳定汇率

    +     - 汇率有波动，金融市场活跃'
  merge: -1
  img_proc: true
