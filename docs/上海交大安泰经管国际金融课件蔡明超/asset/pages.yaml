- pgno: 179
  md: '# 考虑交易成本的套利：合成期货


    +   - A, 如果银行远期外汇的买入价高于客户“从/塞”的卖出价（在银行借本币，转换成外币并存起来后的收入），则有套利机会，即


    $F_{H/F}$（银行报出远期买入价）> \frac{1+i_{H存款利率}}{1+i_{F存款利率}} * S_{H/F}$（卖出价）


    【前者：实际价格或者称报价价格，后者理论价格或者客户合成期货价 Synthetic Forward】


    +   - 或者 B，银行远期外汇的卖出价低于客户在市场借外币，转换成本币并存起来后的收入，则有套利机会，即


    $F_{H/F}$（银行报出远期卖出价）< \frac{1+i_{H存款利率}}{1+i_{F贷款利率}} * S_{H/F}$（买入价）


    套利区间为远期外汇升水大于大（贷减存）的，小于小（存减贷）


    $f_{H/F} > i_{H贷}-i_{F存}$ 或 $f_{H/F} < i_{H存}-i_{F贷}$'
