- pgno: 186
  md: '# 购买力平价：相对 P P P 推导


    +   购买力平价一般指相对PPP，假设[t, t+1]期间本国、外

    +   国通货膨胀分别为 π_h、 π_f

    +   π_h =P_h(t+1) / P_h(t)-1， π_f =P_f(t+1) / P_f(t)-1


    +   物价发生变化时，本国物价变化将等于外国物价变化乘外汇汇率的变化：

    +   (1 + π_f) (1 + e_f) = (1 + π_h)

    +   e_f = (1 + π_h) / (1 + π_f) -1

    +   其中 e_f 是外汇汇率的变化率 e_f =S_f(t+1) / S_f(t)-1


    +   (1 + π_f) (1 + e_f) / (1 + π_h)=1 也表明名义汇率经物价调整（即实际汇率）后应保持不变


    +   站在 t 时刻，以上 t+1 时刻变量（π, P, e）均为随机变量, 随机变量相等则表明在未来各种经济情形下均相同'
  merge: -1
  img_proc: true
