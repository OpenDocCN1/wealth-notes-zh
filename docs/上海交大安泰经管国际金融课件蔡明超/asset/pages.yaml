- pgno: 325
  md: '# Forward Rate Agreement


    +   - FRA 3x9 4%报价解读：At t=0, you would like to borrow 10 million EUR in 3 months
    (t₁) for 6 months (t₂=9), and you agree with the counterparty that the rate is
    4%.(t=0时买入FRA者同意t₂时刻按约定价格支付利息,可贴现到t₁时刻)

    +   - 如果3个月后，6 month Euribor went up to 4.25%，损益如何？

    +     - Your interest income in t₂ will be 4.25% * 10 million * 180/360 = 212,500

    +     - Based on your FRA the interest cost is only 4% * 10 million * 180/360
    = 200,000

    +     - In t₂ you will get 12,500 EUR interest.

    +     - We discount the 12,500 from t₂ to t₁ (12,500 / (1 + 4.25% * 180/360))
    = 12,240 Now, in t1 you will receive 12,240 EUR from your counterparty.


    ![](img/26c5ecc8e8d39d3ae08a606cec76fa4e_325_0.png)'
