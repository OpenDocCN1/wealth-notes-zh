  md: '# Purchasing Power Parity (PPP)

    购买力平价原理：绝对PPP


    绝对PPP：不同国家商品采用一种货币应一个价。或者说，价格乘上汇率后应一样。


    +   - Sₕ/ᶠ = Pₕ / Pᶠ

    +   - 其中 Pₕ 表示本国在 t 时期末的一般物价水平， Pᶠ 表示外国在 t 时期末的一般价格水平， S 是 t 时期末以本币直接标价的汇率。


