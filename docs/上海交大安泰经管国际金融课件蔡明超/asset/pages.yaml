  md: '# 比较IFE, IRP与 PPP


    +   - IRP：某一时刻，远期、即期、利率关系

    +     f ≈ i_H − i_F

    +   - PPP：某一时间段，将来的即期汇率随通胀变

    +     **e_f ≈ π_h − π_f**  **E(e_f)≈E(π_h)−E(π_f)**

    +   - IFE：某一时间段，将来的即期汇率与利率关系

    +     **E(e_f)≈ i_h − i_f**

    +   - 以上定价公式两边，都隐含等式两边相同期限的假设，例如三个月后外汇的升水，对应于三个月的利率或者通货膨胀率）'
