  md: "# DCF模型进行估值（绝对估值法）\n\n+   - 如果假定公司前n年现金流CF的超常增长率为g，随后保持一个稳定的增长率gₙ，则公司的绝对价值：\n\
    +   \n+     $$V=\\sum_{t=1}^{n}\\frac{CF_1(1+g)^{t-1}}{(1+r)^t}+\\frac{CF_{n+1}}{r-g_n}\\\
    times\\frac{1}{(1+r)^n}=\\frac{CF_1\\left(1-\\frac{(1+g)^n}{(1+r)^n}\\right)}{r-g}+\\\
    frac{CF_{n+1}}{(r-g_n)(1+r)^n}$$\n\n+   - 计算公司价值（股票、债务之和）时，r是投资者要求的回报率，等于债券要求回报率和股票要求回报率的加权平均WACC"
  merge: -1
  img_proc: true
- pgno: 157
  md: '# DCF模型进行估值（绝对估值法）


    +   - rₑ=投资者要求的股权资本收益率,根据Sharpe提出的资本资产定价模型估计:rₑ=rf+Beta*(rm-rf),rf是无风险利率,rm是股市的预期收益率(长期预期回报约10%-16%),Beta是该股票的系统风险测度,一般在0.8~1.2间。

    +   - 得到公司的价值后，减去债务价值即公司股票价值

    +   - 股票市值除以股数，得到股价'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 汇率对估值模型的影响：以股利定常增长模型为例


    +   - 在投资学估值模型中，$P_0=\frac{D_1}{r-g}$


    +   - 如果某中概公司的每年的人民币红利保持稳定不变 $g_{rmb}=0$，但对于美国投资者，如果人民币每年升值5%，则美元红利增长 $g_\$=\frac{E_{1,\$/rmb}-E_{0,\$/rmb}}{E_{0,\$/rmb}}=5\%$。这家公司变成了成长股，估值是否产生冲突？下面证明其一致性


    +   　- 汇率升值速度正好等于利率贴水，即 $g_\$=\frac{r_\$-r_{rmb}}{1+r_{rmb}}$（代入下面美元估值等式）


    +   　- 设第一年末人民币红利 $D_1$，则


    +   　　▪ 人民币估值 $P_{0,rmb}=\frac{D_{1,rmb}}{r_{rmb}-g_{rmb}}=\frac{D_{1,rmb}}{r_{rmb}}$


    +   　　▪ 美元估值 $P_{0,\$}=\frac{D_{1,rmb}*E_{1,\$/rmb}}{r_\$-g_\$}=\frac{D_{1,rmb}*E_{0,\$/rmb}}{r_{rmb}}=P_{0,rmb}*E_{0,\$/rmb}$


    估值一致得证'
  merge: -1
  img_proc: true
