- pgno: 333
  md: '# Plain Vanilla Swap: Pricing


    互换： exchange interest rate cash flows, based on a specified notional amount from
    a fixed rate to a floating rate (or vice versa).


    定价机制：固定支付、浮动支付的现值都是1，互换是一个公平游戏。（尽管浮动支付的表示方法为： For quarterly swap, float payment
    is denoted L₀(90), L₉₀(90)【90天后的90天Libor报价】, L₁₈₀(90), L₂₇₀(90). ）


    定价步骤：1）根据 L₀(90)、L₀(180)、L₀(270)、L₀(360)，计算90、180、270、360天的贴现率；2）结合固定支付、浮动支付的现值都是1，计算固定支付的年利率，即互换利率的定价'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# Plain Vanilla Swap: Pricing


    例：根据当前Libor报价，计算互换利率：


    # 1,Relationship between Libor and discount factor


    +   L₀(n) is the LIBOR of n days. L₀(90)=0.0345 L₀(180)=0.0358 L₀(270)=0.037 L₀(360)=0.0375


    +   Suppose Z(n) is the discount factor of n days.

    +   Z(90)=1/(1+0.0345*90/360)=0.9914, Z(180)=0.9824

    +   Z(270)=0.973 , Z(360)=0.9639


    # 2,Pricing of Interest Rate Swap: What is the fixed payment level?


    +   Since PV of float must be equal to fix, and PV of float is 1, Suppose fixed
    payment is F, then


    +   F*Σₜ Z(t)+ Z(360)=1,


    +   F=0.0092


    +   That is, pricing of swap is 0.0368'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# Plain Vanilla Swap: Pricing


    一般结论：


    +   - The fixed periodic-rate on an N-period swap at initiation (as a percentage
    of the principal value) can be calculated as:

    +     F = [ 1 - Z_T / (Z_1 + Z_2 +...+ Z_T) ]

    +     Where Z_t is the present value of $1 to be received on the t^th payment
    date, of T dates.


    +   - 采用相同原理，根据中长期Libor 报价可以得到2年，3年，5年，10年。。美元互换利率


    +   - 采用相同原理，根据中长期Libor 报价可以得到2年，3年，5年，10年。。。其它欧洲货币互换利率的报价，即固定利率支付水平'
