- pgno: 255
  md: '# Currency Put Options

    买卖看跌期权到期时的损益与价值


    +   - Speculators who expect a foreign currency to depreciate can purchase put
    options on that currency.

    +   - 期权到期时的价值 $P_T=\max(E-S_T,0)$ {E: 执行价，$S_T$: 到期时对应的股价}

    +     - 买入者利润 Profit = $\max(E-S_T,0)$ − option premium（期权价）

    +     - 卖出者利润 = − $\max(E-S_T,0)$ + option premium

    +       - 与买入者利润互为相反数，即零和游戏'
  merge: -1
