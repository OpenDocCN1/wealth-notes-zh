- pgno: 250
  md: '# 看涨期权当前的理论价值

    --1990年NOBEL经济学奖Black-Scholes的贡献


    +   ◆ P/L图描述了看涨期权在到期时的获利情况，那么在期初买入时应该支付多少钱？ C_T=max(S_T-E,0), C_t=?

    +   ◆ 1990年NOBEL经济学奖Black-Scholes在1973年给出了股票期权的公式

    +   ◆ 一个近似的思路，就是假设期末时外汇或者股票价格服从正态分布，然后将期权持有人得到的不确定的现金流（Revenue, not profit）求期望值，并按无风险利率贴现。

    +     ◆ stated annual interest rate r: 利息按复利计算r/n，一年支付n次。

    +       P₁ = P₀(1 + r / n)ⁿ    limₙ→∞ P₀(1 + r / n)ⁿ = P₀ eʳ

    +     ◆ 一元钱t年后价值为 e^{rt}，反之t年后一元钱的现值为 e^{-rt}'
  merge: -1
  img_proc: true
- pgno: 251
  md: '# 看涨期权当前的理论价值

    --1997年NOBEL经济学奖Black-Scholes的贡献


    +   ◆ Scholes 与 Merton 一起获奖


    +   ◆ In 1983 Garman and Kohlhagen extended the Black-Scholes model to currency
    option.


    +   • C=e^{-r_f*T}*S*N(d1)-e^{-r_d*T}E*N(d1-σ√T)


    +   • 由于IRP的连续时间复利公式F=S*e^{(r_d - r_f)*T},所以可以写成远期汇率形式：


    +     C=[F*N(d1)-E*N(d1-σ√T)] e^{-r_d*T}


    +     外汇期权公式与股票期权公式区别：多了外汇的贴现率项e^{-r_f*T}，期权持有人将来买入的外汇不含外汇利息。


    +   ◆ EXCEL计算： 007-currency option'
  merge: -1
  img_proc: true
