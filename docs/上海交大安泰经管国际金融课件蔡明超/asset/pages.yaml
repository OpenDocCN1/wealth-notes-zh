    for the change in money supply, it is said to engaged in *nonsterilized intervention*.（消极干预，干预外汇时不调整本币投放

    +   - In a *sterilized intervention*, Treasury securities are purchased or sold
    at the same time to maintain the money supply.（积极干预，抛售本币时，还抛售一些债券，以保持货币供给平衡）'
