- pgno: 262
  md: '# 投资两得宝业务收益的影响因素


    +   ◆ 挂钩货币以澳元和英镑为主选择，汇率波动与日元、欧元相比明显要小得多。客户最适宜选择这类货币投资“两得宝”。

    +     • 挂钩货币以澳元和英镑为主，其利率较高。

    +       一旦美元升值，被迫取澳元或者英镑本息时，

    +       可获利息补偿


    +   ◆ 但是收益风险是对等的，因为银行设计时：

    +     • 如果货币波动率低，银行支付的期权费低。


