- pgno: 89
  md: '# Motives for Using International Money Markets


    +   - 国际金融市场划分：固定收益、股权、衍生产品、另类投资

    +   - 国际固定收益分类

    +     - 外汇市场，货币市场，信贷市场，债券市场

    +   - 投资国际固定收益市场动机

    +     - foreign currencies to be appreciated

