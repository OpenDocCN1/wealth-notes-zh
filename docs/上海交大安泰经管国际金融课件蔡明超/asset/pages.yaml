- pgno: 294
  md: '# 交易风险管理反对者：不要管理


    +   - 由于汇率市场有效性，套保收益与成本权衡后的边际收益可能为0。

    +     - 对于应收外汇账款，采用卖出远期外汇，化解了外汇汇率下跌风险。但卖出的期货价格等于（不套保时）预期的将来汇率,没有超额收益。

    +     - 对于应付外汇账款，采用买入远期外汇，化解了外汇汇率将来上升风险。但买入的期货价格等于（不套保时）预期的将来汇率,也没有超额收益。'
