- pgno: 31
  md: '# Government Intervention

    政府干预动机


    +   - 外汇干预应围绕经济政策的四大目标

    +   - Central banks manage exchange rates

    +     - to smooth exchange rate movements

    +       （减少波动）

    +     - to establish implicit exchange rate boundaries （设定上下限）

    +     - to respond to temporary disturbances

    +       （减少意外事件冲击。外汇市场波动多少为大幅波动？）

    +   - Intervention methods: direct and indirect'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Government Direct Intervention

    政府直接干预


    +   - *Direct intervention* refers to the exchange of currencies that the central
    bank holds as reserves for other currencies in the foreign exchange market.（直接干预：央行直接在外汇市场买卖）

    +   - Direct intervention is usually most effective when there is a coordinated
    effort among central banks.（通常央行联手）'
  merge: -1
  img_proc: true
