  md: '# 5.1 人人都要懂点产品运营


    从我公众号发展史来谈谈产品、运营


    这里很多都是做技术的，对产品、运营知之甚少，有的甚至不知道产品是干嘛的，那么今天，我就以我公众号为例，来给大家普及下产品相关的知识，以及看似我在按部就班的写文章，其实这其中我把我的产品思维充分的发挥了出来。


    如果说把我的公众号看做一款产品的话，那么最初从博客关注我的一批用户就是所谓「种子用户」，「种子用户」的作用是帮助产品从 0 过渡到 1，对于公众号来说，读者过万就是所谓的
    1，所以怎么从几百个「种子用户」增长到 1w 是关键。


    我最早在知乎回答了一个问题很火，叫「如何自学 Android」，直到现在这个回答都是 Android 话题下最火的回答，只不过当初回答的时候不知道，但是当我开始做公众号的时候，我在这个回答放下了我的二维码，这就叫「引流」，很多读者都是看了当初的那个回答来关注过来的。


    靠着知乎上的「引流」和种子用户的自发支持与口碑传播，我读者很快就 1w 关注了，从产品的角度，也就是所谓的完成了从 0 到 1 的过程。


    任何产品从 0 到 1 的过程很难，他决定了你能不能活下去，能不能坚持下去，无数产品其实都倒在了 1 面前。


    其实回头来看，我 2014 年注册的公众号，2015 年就积累到了 1w 读者，但是我没有重视，整个 2015 年直接就搁置了，读者也没有增长，现在想想其实后悔万分，错过了一波流量红利。


    2016 年微信赞赏功能内测，我看到了一个机会，一个付费阅读的机会，但是当时还不知道这个词，这个词只不过是现在来看的，但是当时隐约觉得是个新玩意，新机会，于是在
    2016 年初我决定重视公众号，下定决心好好运营这个产品。


    当时注册公众号的人其实挺多的，但是没多少人重视，尤其技术领域，很多把它当做一个玩具而已，所以我当时的策略就是「勤奋」，比别人更勤奋，坚持更新有用的内容，坚持分享一些技术文章与经验。


    于是，就是这么一点点的坚持，无数个日夜的深夜写作换来了点作用，我开通了原创与赞赏，很多读者传播与转发，很快积累到了 3w 读者。


    如果说，公众号读者从 0 到 1w 是产品从 0 到 1 的过程，那么粉丝从 1w 到 3w 就是产品从 1 到 10 的过程。


    产品的生命周期一般是，从 0 到 1 起步阶段，代表生根发芽了。从 1 到 10 代表产品被市场认可，找到商业模式。从 10 到 100，代表产品成熟了，占领一定的市场份额了。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '所以，在粉丝到 3w 的时候，我第一次接到一个广告，我收了 2000 块，而且价格跟读者总数和阅读量有关，我第一次找到了商业模式，这让我做事更加有方向了，我的方向很明确，就是继续写，继续积累读者，让更多的人关注到。


    于是，我开始了从 10 到 100 的产品阶段。


    但是产品从 10 到 100 的阶段光靠自然增长是远远不够的，是会遇到很大瓶颈的，于是，我想到了一个产品「新增」的策略—拓展渠道。


    之前我写文章只在我自己博客更新，之后更新到公众号，但是之后，我开通了各大技术社区的账号，我写完一篇文章，我在 csdn、博客园、知乎专栏、SegmentFault
    等等平台全部发一遍，很辛苦，那时候确实很辛苦，但是我想不到其他的做法，别说，当时这个方法也很奏效，很多平台都缺乏优质内容，有些平台看不到错的文章就会主动推荐，所以，我在部分技术社区建立了影响力，还跟一些社区运营人员建立了联系，慢慢的，我的这种策略起到了成效，读者很快也从
    3w 增长到 5w。


    2016 年初，我的读者是 5w 多，但是到了 2016 年 6 月份，读者才增加到了 6w 多，这半年的时间只增长了 1w 左右，我觉得哪里出问题了，我分析了下数据。我发现了一个问题，留存率很低。


    留存是什么意思呢，就是新增了 100 个读者，但是取关了 60 个，这留存就是 40%。我分析了这半年跟之前的数据比，留存明显下降不少。我花了很长时间反思，到底是哪里出问题了，后来从读者陆陆续续类似的留言「一个
    Android 号，不更新 Android 技术文章了，取关了」。


    我才意识到问题，我的公众号名字是「AndroidDeveloper」，很多人是冲着名字关注的，但是因为我工作转型的原因，很多新用户不了解我，觉得内容与标题不付，所以很容易就取关了。


    所以，2017 年 7 月份我坚定了改名字，「AndroidDeveloper」这个名字有利有弊，利是很一目了然，弊是我发的内容如果跟 Android 无关，那很容易让新来的读者取关。改名「stormzhang」之后虽然没有之前的一目了然，但是好处是这就是我个人的号，我所分享的东西都是跟我个人相关的，也更加利于建立个人品牌。


    事实证明，这个名字后来改对了，一开始会有读者不适应而取关，但是长期来看，利远远大于弊，留存也大大提升，stormzhang 的关键字搜索指数也一路提升。


    2016 年底小密圈横空出来了，我对产品与机会的敏感性第一时间就试用了，加上当时的「得到」，当时的我意识到付费阅读时代越来越近了，于是我于 2017 年 2
    月份开通了我的小密圈，赶上了付费时代的首班车。


    如果说公众号那些关注的读者是「目标用户」的话，那么付费加入我小密圈的读者就是「付费用户」。'
