  md: '这个世界上没有天上掉馅饼的事，又能赚钱，又没风险的事肯定轮不到你了。我之前就给大 家谈过风险的概念，我认为冒险精神是所有成功人士必备的特质，这个世界上没有风险的事
    本质上是没什么价值的。


    所以，在决定要投资理财之前，你先问问自己，你能承受风险么？因为这个不同的人的性格 确实差异很大，这无关一个人的好坏，就是不同的性格而已，如果你承受不了风险，那么你
    还是老老实实，安心工作，把本职工作做到极致，后面成为这个领域的大牛，甚至专家，依 然可以生活的不错。


    但是投资有风险，不代表你能承受风险就可以赚到钱，其实投资最大的一个策略，就是要学 会降低风险，所以，你不能以赌博的心态去看待投资，你不能拿家人的钱，不能借钱去投
    资，要用自己的闲钱去做，在投资之前最好做一个最坏的打算，如果这些钱全部亏光了，至 少不会对你的生活有影响，并且一定要懂得「分散投资」，也就是所谓的「萝卜不能都放在
    一个篮子里」，这是降低风险的一个很大的原则。


    # 投资品种


    我们所说的投资理财，其实有很多品种，常见的有这些：银行基金、P2P 理财产品、保险、 股票、外汇、黄金、数字货币等等等，每类品种的收益不一样，承受的风险也不一样。我只
    给大家讲述一些常见的投资品种就可以了。


    第一类：余额宝、银行理财产品，这种大家都知道，就不多说了，因为平台大，所以基本没 风险，但是收益也很低。


    第二类：P2P 理财平台，比如我之前推荐的友金所就属于这类，互联网金融这几年很火，而 且也'')}很赚钱，但是这类平台最大的风险是怕公司倒闭，老板跑路，之前也有跑路的情况，导
    致大家都不敢相信任何 P2P 了，其实在我看来，之前有人跑路反而更安全了，因为这更受重 视了，央行监管更加严格，如果之前没出过事的，P2P 这两年这么火，我反而有点担心的，
    所以我现在给大家推荐的友金所我丝毫不担心。另外不止友金所，也有其他比较靠谱的理财 平台，大家可以关注下背景，上市公司背景或者国有资背景，并且跟银行建立资金托管基本是
    可以保证的了，这里有个排名链接，可以帮助大家判断，能上榜的基本都可以信任的：


    链接：创业系、风投系、国资系、上市系排名前10的网贷平台有哪些_网贷之家


    P2P 理财产品一般年化最高在 10% 左右，超过 10% 的就要小心了，要看下是不是最近砸钱 搞活动抢人，还是 一直都这么高，如果一直这么高，就要很注意了。


    这些理财平台，适合大部分人，只要找到靠谱的平台，风险就可以控了，但是收益相对也较 小，不能发财，但是起码可以让自己的财富保值，跑赢通货膨胀。


    第三类：股票、数字货币类。这里品种风险很大，国内股票，俗称 A 股市场，一天涨跌幅就 达到 10%，要知道理财平台一年才 10% 的收益啊，可想而知这类风险有多大，港、美股更是
    涨跌幅不限，理论上 一天就可以让你的资金翻倍或者减半，不过，一般来说，很少有这样的 股票。'
