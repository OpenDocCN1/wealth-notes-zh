    # 7. 其他方面


    除了以上方法之外，还有其他方面都可以赚到钱，只要你细心观察，敢想敢做，赚钱的机会真的太多了，怕就怕你整天埋头写代码，根本不去关注这个世界，不去关注身边的机会，不去多方位的去看待问题，有很多类似的案例，篇幅也太长了，以后想到了再给大家补充一些案例。'
