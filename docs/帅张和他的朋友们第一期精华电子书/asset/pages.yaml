  md: '从产品的角度来说，付费用户的商业价值十倍于目标用户的价值，这也是为什么同样的用户规模，「得到」估值这么高的原因，所以付费用户值得享受更好的服务，也有利于建立更好的氛围，所以，我今年在小密圈上花费了不少精力与时间。


    刚创立小密圈我没有急着宣传，我小密圈的第一批「种子用户」是从赞赏的读者中邀请来的，在不确定一个全新的产品能不能被用户市场认可的时候，内测邀请新产品的目标用户是最好的办法，之前赞赏过我的读者，我认为认可我，信任我，并且有付费意愿的读者，很快第一批读者就有了几百人。


    之后逐步开放给更多的人，我也在逐渐摸索运营方式，回答问题、分享知识与认知、内部抽奖都属于我的运营方式。


    之前有人说，我在小密圈内部抽奖是营销、推广，其实错了，这叫「运营」，这种方式只会让内部用户更加活跃，更加有粘性。


    而营销推广是指针对外部渠道，针对新增的。如果说我告诉我公众号的读者说，你付费加入我的小密圈吧，我在小密圈里抽奖送书，如果真的有人只冲着抽奖送书就来付费加入的，那这才叫营销推广。毫无疑问，不会有人单纯冲着我小密圈有抽奖而加入的，所以，内部抽奖活动是属于一种运营的方式。


    第一期小密圈读者有 4200+，都是从我公号过来的，所以小密圈是我公号孵化的一种全新的商业模式，公号 10w 读者，小密圈用户 4200+，也意味着付费用户
