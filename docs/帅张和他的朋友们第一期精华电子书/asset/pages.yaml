    +   1. 无论何时侯，生存一定是第一位的，如果生存都有问题，那么兴趣、爱好都是虚的，所以，生存 > 兴趣。

    2. 我之前在知乎回答一个问题的时候，说了，如果工作的行业是自己的兴趣所在，那么是非常幸运与幸福的，但是大部分人都没有这么幸运，大部分人其实先是为了生存，做着做着，发现把这件事做的好，做出成就感了，才慢慢的产生兴趣。比如我转行
    Android 之前从来不对开发有兴趣，因为那时候对开发根本没什么了解，只不过为了多赚点钱，才决定转行的，慢慢的，做得久了，在业内做出点成绩了，我才慢慢的产生兴趣。


