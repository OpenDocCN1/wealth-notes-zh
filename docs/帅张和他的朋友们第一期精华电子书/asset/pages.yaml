  md: '其实你可以看到，不管是做什么，当你有了影响力之后，后面你想赚钱很容易，就拿我举例子，你可能看到我开小密圈赚钱了，目前为止赚了 10w 多有了，但是以我现在的影响力，小密圈是对我来说，赚钱最慢，最低效的方式。只要我想，我随时可以写书、录视频、甚至录收费课程、开知乎
    live 等等，哪一种方式都比小密圈持续一年的时间赚的更多更快，当然，我不是夸自己，我只是拿我举个例子，所以，如果你要赚钱，建议眼光放长远些，不要只盯着眼前的这点钱，积累自己的影响力，不管你是跳槽去大公司也好，还是在一些公司混个好看的
    title 也好，还是写博客、当讲师也好，尽量去做一些又赚钱、又能积累影响力的事。


    比如上面三种，如果让我推荐，我不推荐你去做私活，因为写书也好、录制课程也好，都是又能赚钱，又可以积累影响力的，影响力在短期内可能不会给你带来实质性的利益，但是长期会对你产生很大的收益。


    # 5. 写作


    这件事也是我自己积累的，我以前从没觉得我一个程序员可以靠写作赚钱，但是等我做到了，我才发现，原来是真的可以。很多人理解的写作是文人的事，我们理科生没曾文采，没有过硬的文字功底，其实错了，你们看我的文字有什么高深的技巧么？就是最普通文字。


    这个世界的交叉领域是个人才缺乏的机会，什么意思呢？那些会写作的通常不懂技术，但是做技术的，又不太会写作，所以，如果你是做技术的，写作还不错，那么这个就是优势。同样拿我举例子，某自媒体之前让我兼职给他们的官方提供内容，主要话题是互联网、科技相关的就行，因为他们的自媒体写字的都是文科出身，他们哪懂得什么是真正的互联网，什么是真正的科技啊，所以给我开价每千字
    800 块，这个价格相当高，相当于每个字快值一块钱了，如果我没运营自己的公众号，那么我毫不犹豫去做了，但是我精力有限，如果给他们写了，我就没精力运营自己的公众号了，也就是说，我现在一些公众号上的一篇不错的文章，其实随随便便价值一两千的，但是我还是看的长远的，虽然短期内可以赚到钱，但是长期来看，公众号会更有价值。


    所以，我之前为什么让你坚持写作，因为交叉领域的人才太少了，会写作的人太多，技术牛的也太多，但是技术又不错，写作又不错的少之又少，这以后就会给你直接创造金钱上的回报的。


    # 6. 投资理财


    想赚钱，投资理财也是一个方向，但是我说句实话，不管是放余额宝还是买银行基金，还是买理财产品，最高每年收益 10% 的利率赚不到什么钱的，因为风险太小，理所应当回报不高。风险大的股票、投资才能赚到钱，我自己玩股票，风险很大，收益很大，过去的两个月之内我赚了超过
    20% 的收益，当然，只是最近的两个月，之前也有亏很多的时候，但是我把他当做一个长期的事业来看的，现在就是为了学习知识，当我以后老了，代码写不动了，或者不想工作了，不管是写作、还是投资我都可以养活自己。'
