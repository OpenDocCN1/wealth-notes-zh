  md: '所以，在粉丝到 3w 的时候，我第一次接到了一个广告，我收了 2000 块，而且价格跟读者总数和阅读量有关，我第一次找到了商业模式，这让我做事更加有方向了，我的方向很明确，就是继续写，继续积累读者，让更多的人关注到。


    于是，我开始了从 10 到 100 的产品阶段。


    但是产品从 10 到 100 的阶段光靠自然增长是远远不够的，是会遇到很大瓶颈的，于是，我想到了一个产品「新增」的策略—拓展渠道。


    之前我写文章只在我自己博客更新，之后更新到公众号，但是之后，我开通了各大技术社区的账号，我写完一篇 случаях，我在 csdn、博客园、知乎专栏、SegmentFault
    等等平台全部发一遍，很辛苦，那时候确实很辛苦，但是我找不到其他的做法，别说，当时这个方法也很奏效，很多平台都缺乏优质内容，有些平台看不到错的文章就会主动推荐，所以，我在部分技术社区建立了影响力，还跟一些社区运营人员建立了联系，慢慢的，我的这种策略起到了成效，读者很快也从
    3w 增长到 5w。


    2016 年初，我的读者是 5w 多，但是到了 2016 年 6 月份，读者才增加到了 6w 多，这半年的时间只增长了 1w 左右，我觉得哪里出问题了，我分析了下数据。我发现了一个问题，留存率很低。


    留存是什么意义呢，就是新增了 100 个读者，但是取关了 60 个，这留存就是 40%。我分析了这半年跟之前的数据比，留存明显下降不少。我花了很长时间反思，到底是哪里出问题了，后来从读者陆陆续续类似的留言「一个
    Android 号，不更新 Android 技术文章了，取关了」。


    我才意识到问题，我的公众号名字是「AndroidDeveloper」，很多人是冲着名字关注的，但是因为我工作转型的原 因，很多新用户不了解我，觉得内容与标题不付，所以很容易就取关了。


    所以，2017 年 7 月份我坚定了改名字，「AndroidDeveloper」这个名字有利有弊，利是 很一目了然，弊是我发的内容如果跟 Android 无关，那很容易让新来的读者取关。改名「stormzhang」之后虽然没有之前的一目了然，但是好处是这就是我个人的号，我所分享的东西都是跟我个人相关的，也更加利于建立个人品牌。


    事实证明，这个名字后来改对了，一开始会有读者不适应而取关，但是长期来看，利远远大于弊，留存也大大提升，stormzhang 的关键字搜索指数也一路提升。


    2016 年底小密圈横空出来了，我对产品与机会的敏感性第一时间就试用了，加上当时的「得到」，当时的我意识到付费阅读时代越来越近了，于是我于 2017 年 2
    月份开通了我的小密圈，赶上了付费时代的首班车。


    如果说公众号那些关注的读者是「目标用户」的话，那么付费加入我小密圈的读者就是「付费用户」。'
