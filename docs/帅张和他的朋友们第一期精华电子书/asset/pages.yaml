  md: '# 3.11 我的阅读经验


    > 行万里路，读万卷书。


    我之前跟大家说过，我现在特别喜欢阅读，我每天平均的阅读量大概在 5w 字左右，差不多每天阅读的总时间在 1 小时左右，有人说，听起来不过每天就一小时的阅读时间而已，然而常年累月坚持下去，这个习惯会极大的提升自己。


    其实，要是以前，我从来不敢想象我竟然这么喜欢阅读，要知道，大学时候我最讨厌的事情就是看书，然后，在社会上混了这么多年，随着自己知道的越多，我才逐渐意识到知识的重要性，也逐渐意识到自己的无知，所以，迫不及待的想弥补下前十几年的缺失。


    你们注意到了没有？我说的阅读，并没有说看书。那是因为，看书的最终目的也是为了阅读，只不过随着时代的改变，阅读的方式一直在变迁，从报纸到书籍、电脑、手机、Kindle
    都是阅读的一种方式，很多其实还停留在阅读就是看书的时代，而我永远追随适应新的潮流，我总觉得时代在进步，我们处理事情的方式还停留在以前有点说不过去。我之前也说过，因为从事移动开发的关系，我变成了一个手机控，生活中的绝大部分时间都在使用手机，所以我选择了手机作为我阅读的主要方式，而用手机阅读基本上充分利用了我的碎片化时间。


    之前有人质疑碎片化阅读是噱头，说根本没有任何作用。然而我自己的亲身经历告诉大家，碎片化阅读不是噱头，是你太功利化了，如果你是想提升专业技能，想着阅读之后立马有明显的效果提升，那么碎片化阅读肯定不能满足你，专业技能的提升一定是需要持续花大量时间，系统性去学习的，比如考研突击、培训班等，你说你靠碎片化阅读就可以很轻松的让考过托福、雅思，那基本是不可能。


    而碎片化阅读最大的作用在于提升你的视野，丰富你的认知。这就好比，你以前去图书馆，没事的时候喜欢读点散文，看些小说，看些科普文之类的，这些东西看似对你没啥影响，但是时间长了，你会不自然的受到影响，你的语感、兴趣爱好、你的视野都会逐渐被开拓，这才是碎片化阅读的好处。而我这一两年内坚持阅读，很多东西也在逐渐的改变。


    之前有人问我，我是怎么从一个技术人，逐渐变得这么全能的，产品、运营、投资、管理、商业好像每个领域都懂点，本质上就是因为我长期利用碎片化时间，来阅读这些领域相关的知识，这些东西不会对我本职工作产生有效的帮助，但是长久下来之后，我的很多认知与视野都受到了影响。


    有人问了，我阅读的渠道从哪里来呢？


    我一直认为现在我们是最好的时代，互联网如此发达的现在，网上有各种信息可供我们筛选，有人抱怨信息太多太杂，其实却不会反思自己的信息筛选能力。还有人扬言付费阅读时代是收智商税，我还记得之前有过一篇文章，标题貌似是「我花了
    5000 块钱付费订阅，买来这些教训」，很多人还疯狂转发，我看了想笑。这就好比你上了一所名校，交了几万块的学'
