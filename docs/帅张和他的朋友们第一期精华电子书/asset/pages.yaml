- pgno: 5
  md: '高情商的人一定是懂得自我控制的，学习累了，懂得娱乐，但是娱乐归娱乐，说不想一直娱乐那是假的，但是他懂得控制，他懂得做一件事情的目的是什么，娱乐是为了更有效率的学习，不是目的。


    人这一生总会有不顺心的时候，总会有遇到让自己崩溃的人或事，但是高情商的人是会控制自己的情绪的，不会因为不顺心的事而打乱自己的节奏，影响自己的工作与生活。


    为什么你会觉得有些人脾气很好，很好相处？为什么你会觉得有些人做事很靠谱，做任何一件事情都很很难轻易放弃？又为什么有些人原则性很强，该做的会去做，不该做的一定不会去做？


    本质原因就是因为他们懂得自我控制，能控制自己的人，才真正是可怕的高情商之人！


    # 3. 自我激励


    从小到大你会不会经常遇到这样一群人：你的高中班主任会经常给你们打一针鸡血，大学如何如何好，考上大学就会怎么样怎么样？你的老板是不是每隔一段时间就要给你们画个饼，等这个产品成功了，我们每个人的回报都是超乎想象的，我们的梦想是星辰大海...


    你可能会觉得很反感这种鸡血，但是这就是所谓的激励，只不过这种激励是外界的，你可以看一下，每个公司的老板画大饼、打鸡血的能力一定要是具备的，不然这绝对是一个不合格的老板。这种鸡血有没有用？别说，还真有用，每次老师讲到未来、老板讲到梦想的时候，每个人仿佛真的充满了斗志，但是这种好景不长，一段时间过去，鸡血的药效就过了，大部分人原来是什么样还是什么样。


    但是总有一些人，过去了一段时间之后，他还是能一如既往的努力、坚持着，那些比较优秀的人，以及你的老板们，你有没有想过？你的老板经常激励你们，但是谁来激励你的老板？


    答案就是：自我激励！


    那些优秀的人从来都是自我激励，自己给自己打鸡血，那些商界大佬们其实可能比我们更忙，比我们更累，但是让他们继续下去的动力就是他们的自我激励。自我激励的方式有很多种，比如赚更多的钱，比如改变世界，比如实现自己的自由梦。


    成功人士看起来总是充满激情的，而让他们充满激情的方式恰恰就是自我激励，自带鸡血，他们从不需要别人来激励自己，他们的做事方式与做事风格会不自觉地影响他人。


    以上就是我认为的高情商的最基本的三种特质：自我认知、自我控制、自我激励。有些我也做的不够好，也在继续努力，智商可能后天很难改变，但是情商完全是后天可以培养的，而且情商的高低完全影响着你之后的爱情、事业以及生活，这也是为什么不用在意你之前怎么样，之后你会怎么样才是最重要的！'
