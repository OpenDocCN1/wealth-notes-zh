  md: '# 3.4 如何有效提高执行力


    > 来自匿名用户提问：「张哥，弱弱问一下，怎么有效提高执行力？自己每次都不知道怎么进入学习状态，磨磨蹭蹭的，又不是因为想玩才不去学习，也想多学些东西，但就是有点抵触，看一会就会有点烦躁，脑子思路杂乱。怎么办呀。」


    其实我也是一个学渣，我其实一点不爱学习，你们可能不知道，我最爱玩了，各种娱乐项目基本都有涉猎，喜欢打篮球、乒乓球、羽毛球，爱玩游戏，以前大学时候 dota、网游、页游等，包括麻将、牌九，再加上跟死党一起
    K 歌、喝酒等等等，但是我后来为什么「改邪归正」，喜欢学习了呢，直到现在还坚持阅读学习，付出的时间可能远比大部分人还要多。


    我总结了有两点因素：


    # 1. 外部因素的刺激


    我当初自学为啥这么拼？家里条件虽然不优越，但是大学起码不愁吃不愁穿，当然是没有任何压力，不会想那么多，但是毕业之后，跟我女朋友一起来上海，尼玛不努力挣钱就特么得饿着，这个真不是我有多努力，任何人遇到这种情况都会被逼上一把的，饭都吃不起的时候你哪有心思想那么多，唯一想的就是挣钱，让我俩吃饱饭，换个稍微大点的房子住，你的荷尔蒙每天都会分泌很多，你每天都会充满激情，那个时候每天
    6 点起床做地铁、转公交去上班，晚上 10 点下班，到家还得看会书，12 点之后才睡觉，每天睡眠时间也就 6 小时，现在想想当初是咋坚持过来的，但是放在当时，完全没觉得累，反而还觉得每天挺充实，这一切都归功于外部刺激。


    当然，这种情况不是每个人都能遇到的，大家再怎么困难，也不太会遇到当初我吃不饱饭的时候。


    # 2. 自我的主动刺激


    现在生活好多了，再也没当初的那种外部刺激着我继续前行了，但是我现在依然拼命工作，坚持阅读学习，我也有累的时候，有时候甚至想着，我他妈的还这么拼干嘛呢，老子不干了，回老家快活去，每当有懈怠的时候，我都会主动刺激自己，怎么刺激呢？


    别人都月薪五万了，我再努努力，争取也到这一步，我得查查月薪五万需要达到什么标准，朝着这个方向去努力。我有个大学同学，当初一起的时候学习好垃圾，现在人家开保时捷，不行，我得向人家看齐，虽然人家有钱，但是富不过三代，争取我哪天也能开保时捷。我还有大学同学，都在上海买房了，人家可以，我也一样可以，我得再奋斗几年，争取让小孩留在上海。地铁口看到来来往往的人群，都在拼命的挤地铁，有时候想想自己，虽然没房，但是好歹有车子，收入也还可以，这熙熙攘攘的人群都在努力奋斗，争取在这座城市扎根，我现在的条件比他们优越多了，我还有什么理由不努力？老爸老妈穷苦了一辈子，老爸开了一辈子车，就是从没开过小轿车，每次做我车的时候都_.'
