  md: '这个事情上从来都是有失必有得，我做了管理之后，在 Android 技术领域上花费的时间很少了，而且我已经有快一年没写代码了，但是我在其他领域的能力收获非常大，我也一直向我口中所说的多元化人才努力。


    有人可能会有疑问了，不给自己设限不跟上面说到的专注矛盾么？


    当然不矛盾，不给自己设限的前提一定是自己具备了至少一项不错的能力，而且即使你再怎么专注，也没法一天 24 小时都在做一件事，即使你很专注，你也会有看电视、娱乐的时间。


    所以，专注的做好手上的事固然很重要，但是不要闷头工作，也偶尔抬头看看外面的天空，拓宽下自己的视野，在有其他领域机会的时候，不妨勇敢的去尝试下。


    # 5. 执行力


    我们都知道努力很重要，但是很少有人能做到。


    比如，即使我一而再再而三的号召大家，要写博客，学写作，又有几个人做到了呢？你知道，每天只需学习 2 小时，一年之后，你的能力就有很大提高，又有几个人能做到？


    所以，大部分人的执行力很差，可能你一时做到了，也没法坚持下去，而把自己的执行力持续下去恰恰是最关键的一环，也就所谓的：“道理我都懂，可是我做不到”。


    这个话题很长，后面我会抽时间单独写篇文章，以自己的亲身经历总结了一点方法，教教大家如何才能改变这一现状，提高你的执行力，让你的努力更容易坚持下去。


    以上，就是我所总结的，如何让你脱颖而出的一些技巧，希望对部分同学有所思考与帮助！


    PS：可能有些人，看了以上我的总结，会觉得，这些东西我都知道，但是，真的这样么？我敢说，在你没看这篇文章之前，你丝毫没有意识到自己比别人差在哪里，你只是看了之后，恍然大悟了。


    还有些人，可能会觉得是鸡汤，某种意义上来说，确实是鸡汤，但是却都是自己真实经历的经验总结，有时候，鸡汤可能比所谓的干货更有用，很多道理其实大家都懂，我们做出改变缺少的只是一个推动力。'
