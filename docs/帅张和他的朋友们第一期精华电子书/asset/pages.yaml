    V.P.N，别 人通过我的链接购买，每有一个人购买我可以得到 10 块钱，看起来一个人就 10 块钱，但是 一两年断断续续的竟然有两千多人购买，然后单单靠这个
    10 块钱的提成赚了两万多块。话说，那个 V.P.N 也挺贵的，但是产品确实好用，所以即使贵，当时也有很多人接受，这一下就改变了我很多的认知。


