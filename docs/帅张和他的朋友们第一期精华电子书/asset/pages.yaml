  md: '# 3.7 程序员如何保护自己


    > 程序员在人们的印象中是一个薪水高、智商高的双高群体。但在生活中程序员也会遇到很多挫折：工资被拖欠、生活压力大、一旦失业就没有经济来源等等。程序员应该学会保护自己。


    中兴事件让我很为当事人惋惜，最近两年程序员群体被大众注意到，前有 WePhone 开发者被恶毒女诈骗自杀，后有中兴 70 后程序员被内部宫斗想不开，程序员的弱势在于常年跟机器打交道，以为什么都像机器一样讲道理，低估了人性的复杂与丑陋，加上工作的原因，习惯了遇事自己独立解决，导致遇到事情也不会妥善处理，更不会轻易请人帮忙，往往容易酿成悲剧。


    其实这个世界是美好的，我们一生中接触的人，遇到的事情 99% 都是好的，然而恰恰那 1% 的坏人坏事被你遇到，如果你没有妥善处理，也许会对你的人生造成毁灭性的打击。所以，今天我想给我的球友们总结几点经验，希望你们在遇到那
    1% 的时候，可以轻松应对。


    # 1. 技术不是全部


    这个观点，我曾不止一次普及过，眼里只有技术的程序员，跟读书时候的书呆子没什么区别。程序员们很多都认为只要技术够牛，我就可以凭借技术赚更多的钱，然后就可以过的更好，所以容易往往忽略了其他方面的发展，沟通交流、为人处事都是很重要的，程序员的弱势在于常年跟机器打交道，以为什么都像机器一样讲道理，低估了人性的复杂与丑陋，没有一点防范心理，这些都是很危险的，总之一句话，程序员们大多智商较高，但是情商较缺乏，但是人这一生，情商绝对比智商要更有用的多。


    # 2. 培养第二技能


    都说程序员是青春饭，被认为中年危机最严重的一个群体，在很多人看来不理解，说人到中年，有车有房，收入也较高，怎么会有那么大的危机呢？然而殊不知，人到中年，收入虽然高了，但是房贷、车贷压力不小，同时还背负着家庭的责任，到处都是花钱的地方，而且经济大环境不好，很担心公司发展遇到困难，自己受到各种影响，跳槽的话虽然不愁找工作，但是这个年纪薪资岗位低了不想就转，高的诸除非管理岗位，否则企业不如找个年轻点的、工资低点的来代替了，种种原因导致中年危机感很重。


    我之前就说过，一定要培养第二技能，永远不要把所有赌注都押在工作上，年轻的时候越早培养第二技能，写作、演讲、英语、咨询等等都属于第二技能，根据你的个人兴趣爱好去选择，第二技能会是你的后路，当你到了中年，也许第二技能早就发展的如火如荼，甚至超越你的本职工作，拥有第二技能的人从不会担心危机的到来，奉劝所有程序员们，一定要重视第二技能的培养。


    # 3. 永远不要在非正常状态下做任何决定'
