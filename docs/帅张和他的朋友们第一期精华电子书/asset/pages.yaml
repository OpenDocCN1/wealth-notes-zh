  md: '你是不是几乎没听到过单纯靠写代码很出名的？但是你一定听到过不少是写代码出身的，最后很牛逼的，比如马化腾，比如雷军，比如张小龙等，都是写代码出身，但是最终成就他们的却不是代码，是商业也好，产品也好，都是来自另一领域。


    这个很容易理解，当你只会写代码，想在一群写代码的人才中脱颖而出，非常非常难，而如果除了写代码，你又懂产品，你会发现你已经比大多数人都优秀了，而如果你还懂写文案，那简直是稀缺物种，而如果你还恰好懂营销，那你简直就是企业的宝贝，同样是商业大亨，马云光靠英语这一个额外的维度，就比其他大亨优势不知道高到哪里去了。


    为什么现在技术圈全栈工程师很火？本质上在技术圈，全栈也是多维度。但是这是狭义上的多维度，我想带大家应该往广义上的多维度去发展。


    我之前给大家说过写作的重要性，写作很可能是未来让你的知识与技能转化为财富的最重要技能，但是如果只会写作就行了么？你写的东西再好，很可能根本没人知道。而如果你懂写作的同时，你又懂营销，又懂推广，那你这优势就大了。比如今天我探索了一点营销的方式，「骗取」了部分赞赏的同学入圈了，本质上也是一种多维度，当然，我有信心让加入的人感到很值，我才开始做的。


    如果写代码的同时，你还懂产品，参与产品的讨论，或者你还懂获客的方法，懂 SEO 的优化等等，不用我说，谁都知道你会因此有更多的机会。


    所以，我一直认为，技术人的未来，甚至是未来的人才，一定是多维度、多领域人才，但是如何选择多维度技能？


    前面说了，技术的可积累性与可持续性很差，选择其他维度技能的时候，尽量选择可积累性的技能，比如写作，你肯定是写的越久，越会写，比如投资，肯定是经验越丰富，给你带来的收益越高，比如营销、产品，等等等。


    所以，综上，我对未来市场上技术人的看法是，你现在吃饭的技术领域，先要花足够的时间去深 जर，先成为某一领域的专家，这本质上是让自己有货、建立影响力。其次，业余时间培养下其他维度的能力，其他维度的能力不用那么着急，这是一个可积累的能力，时间越长，你的这个能力越强，所以完全可以同步进行，你只需要花费业余时间
    20% 甚至 10% 的精力就好了，重要的是把这件事持续下去，几年之后，你就获得了你本职能力之外的能力，甚至还可能超越你本职的能力。


    拿我自己举例，在一开始除了我的本职工作，只要有机会，我都会参与产品、公司商业决策、团队管理、投资、写作等多个维度，不根本不会担心影响我本职工作，因为这些在一开始我都是当做业余时间而已，只不过随着我的发展，管理的权限变得大了。很多人可能一开始无法理解我为什么要坚持原创，这是因为我认为，原创写作是一个非常值得积累的能力，我多写一篇原创，我的写作能力就有所提高，我给大家带来的影响就会更多一分，写的越来越好，就会有越来越多的读者关注我，哪怕每天多一个人关注我，持续下来，给我带来的好处只会越来越好，现在我靠写作赚
    100 块，下个月就可以赚 200 块，很可能有一天会超过我的本职工作的收入，所以，即使再累，即使再难，我都一直坚持写作，坚持原创，这是我坚持做这件事的逻辑。'
