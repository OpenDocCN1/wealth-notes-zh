  md: '# 1.1 你真的了解「情商」么？


    情商决定你的未来


    我相信绝大部分人都知道「智商」与「情商」对于一个人的重要性，很多人都希望成为一个高智商、高情商的人，然而在我看来，情商要比智商重要的多的多，因为绝大部分人的智商其实都差不多，这世界上没有那么多的天才，也没有那么多的傻子，每个人的智商的确会有差异，但是这点差异还不足以影响人们在各个方面的成就，但是每个人的情商可谓是差异万千，它将直接决定你之后的职场、生活以及人生。


    仔细想想，那些政治政要、商界大佬甚至你的老板们，论智商，有时候可能真的都不如你，但是他们的情商无一例外都是很高的。


    所以，情商的重要性不言而喻，但是你真的知道什么只真正的「情商」么？你会不会以为那些平时处事圆滑、懂得人情世故就是情商了？那些只是情商非常小的方面，真正的情商远远不止这些。


    在我看来，一个人的情商高低主要表现在三个方面：自我认知、自我控制、自我激励。


    # 1. 自我认知


    我们中的大部分人其实都不能很好的认识自己，都会高估自己，低估别人。别人做了一件了不起的事，会想当然的以为，也没那么了不起么，我有这样的资源同样可以。别人取得了点成就，会觉得就不就赶上了好时机么，如果我早生两年，赶上那个风口，我会比他做的更好。然而真正自己去做的时候，会觉得自己情况特殊，遇到了这样那样别人遇不到的麻烦。而如果做一件事情如果失败了，会想当然的觉得别人能力不足、逞强等。即总会给自己找各种借口，而习惯性的贬低别人。这就是低情商的表现，本质原因是缺乏自我认知。而高情商的人，对自己有明确的自我认知，会更容易从别人身上看到闪光点，然后与自己进行比较吸收。比如也许一个人失败了，但是他做事的执着是自己身上缺乏的特质，也许自己不喜欢王思聪，也许在很多人眼里王思聪就是败家子、渣男的代表，但是王思聪这种博人眼球的商业上的成功，这就是一种商业策略与能力，同样是值得自己学习。当他在批评别人的时候，会对照着自己，看有没有类似的错误与缺陷。所以，请看下自己是否具备自我认知的能力，是否为人处世愿意换位思考，除了自己明确的认识自己之外，也能从别人身上认知到自己的缺陷，发现别人身上的闪光点，加以学习吸收，这才是高情商最基本的一项能力。


    # 2. 自我控制


    大家都是人，人就会有各种各样的诱惑与心理变化，比如大家都知道玩游戏很爽，都知道学习很累，但是有的人就是网瘾上瘾，而有的人就懂得劳逸结合，这就是自我控制的差距。'
