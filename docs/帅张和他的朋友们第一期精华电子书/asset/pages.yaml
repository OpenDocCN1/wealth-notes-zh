  md: '# 2.4 大部分人都缺乏的一种特质


    我从来没在公开场合给大家推荐股票，因为股票永远是 28 原则，20% 的人赚钱，80% 的人亏钱，风险很大，但是我并不是抵触有人玩股票，有的人能承受这个风险，去搏那丰厚的回报，这完全是合理的，大家都是成年人，自己去判断风险承受能力就好，但是公开场合我如果推荐大家去玩股票，这是不道德的，因为大部分人是不具备这样的能力的，所以我只会给大家推荐风险极低的理财平台，因为在我看来，绝大部分人只能承受这种风险。


    庆幸的是，小密圈的所有圈友们都已经具备了一定的冒险精神，因为你们加入我的小密圈其实也是承担了一定的风险，付费加入的圈友的费用会不会不值？我是否会携款潜逃？参与活动的圈友们的资金是否安全？...等，只不过你们通过对我的关注与了解，判断我的人品还行，觉得风险很小，自己可以承受，所以选择加入了，这个不能代表你们是否优秀，只能说，你们比大部分人要具备基本的冒险精神了。


    我自认为自己算是個冒险主义，某种意义上从我当初测试转行开发就是一种冒险，再到之后折腾投资，有亏有赚，再到之后开小密圈、跟友金所搞活动被人骂、被人看不好都是一种冒险，但是我坚定的按照自己的判断，做好了去承担后果的准备，一直?p到现在，当初的测试转行开发再到现在做产品与管理，在投资领域也有一些自己的理解，有点小成就，小密圈也做的如火如荼，当初骂我、不好小密圈的人现在无一都很羡慕，我可能是第一个从码农到公众号写作、运营小密圈，并且赚到钱的人，从开始的很多人不理解，到后面有人开始跟随，每一步我都承担了不小的风险，但是，正因为我承担了这些风险，我才能有现在的一些回报，不管是金钱、能力还是影响力都是一种回报。


    所以，如果你想安安静静的做个普通人、上班族，那么你只需要努力就够了。但是，如果你想有更大的成就，想从一个穷人阶级向更好的阶级跨越，光是努力是远远不够的，你一定需要具备冒险精神，然后在时代的变化中，抓住机会，放手一搏，你才能有机会翻身，跨越阶级，享受更好的资源。


    但是，我不建议赌博似的 All In，王思聪之所以做事情容易成功，是因为他失败了，可以很容易的重新来过，然而对于我们普通人来说，我们如果 All In，那么我们失败了，可能就再也没有机会站起来了，我们输不起，所以，我个人的建议风格是，即使需要冒险，需要去搏，也要给自己留条后路，某种意义上，我放弃了很多优越的大公司的机会，一直留在薄荷，也是在「赌」，但是我之所以还在坚持运营者公众号、小密圈也是给自己留后路。


    最后，不同的人不同的性格，不同的性格向往着不同的生活，没有对错，只是选择而已，但是不管你选择哪种生活，你们都必须具备一定的冒险精神，了解自己的风险承受能力，这样你才能因此获得更好的回报，甚至过上你从没想过的生活。'
