  md: '这次事件很多人都想不通，当事人高学历，经验丰富，被裁了大不了换份工作就是了，何必想不开呢？简直太盖弱了。其实我们不知道当时是在一个什么环境下，我们处在事外当然看得清，但是很多决定其实都是一念之差，就是那么一瞬间没想通，导致冲动做出错误的选取，我们能总结出的经验教训就是：永远不要在非正常状态下做任何决定。


    什么叫非正常状态？醉酒、愤怒、极度伤心甚至兴奋、异常喜悦等状态都属于非正常状态，这种情况做出的决定通常都是不客观甚至错误的，另外，做决定的时候多想想身边的家人，考虑的因素全面点，会更能避免一些想不发生。


    # 4. 职场中不要讲感情


    我以前也说过，成熟的职场人士是不会讲感情的，不要把公司当做家一样，更不能把公司同事当做家人看待，那些只给你打感情牌，没有任何实质性的表示的公司或者老板，你得小心了。


    当然，可以对公司以及同事有感情，但是不可以感情用事，在公司的任何决定，如果你都可以抛开感情，其实都很好处理，但是很多同学想不开，在遇到类似事情的时候，往往会有非常不理智的处理方式。


    仅以此事，给我所有的球友普及下，希望不会有下一个悲剧发生，更希望我的球友们都可以做一个不馁的代码农！'
