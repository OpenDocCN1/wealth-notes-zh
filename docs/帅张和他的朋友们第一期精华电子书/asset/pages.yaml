    比如，你也可以推荐一些有提成的好的 V.P.N，虽然每单就赚 10 块钱（现在风口，这条态度，不建议了），比如你也可以推荐我的「知识星球」，虽然每单就赚 25.8
    元，比如你也可以在淘宝客上推荐一些不错的书籍，虽然每单也就几块钱，但是这些你完全不用负责，而且是推荐的第三方的产品，相対比较中立，很多读者就是这样，一看你推荐自己的东西，根本不管三七二十一，就会觉得广告狗，但是如果你推荐的是第三方的产品，刚好是他需要的，那么他们想法就不一样了。


