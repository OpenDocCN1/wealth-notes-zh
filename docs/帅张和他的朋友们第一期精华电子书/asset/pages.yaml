  md: '# 5.2 一次高管之间的对话


    > 数据、产品、营销、技术杂谈


    我现在担任薄荷的产品技术负责人，其实不止产品技术，很多事情都有参与。上周我们开高管会议，我们在讨论一件事，当然，这不涉及到机密，我们讨论「薄荷 App 要不要做推广？」


    我们看法不一，老板让每人发表下自己的看法，轮到我的时候，我这样说的：


    这个事情我觉得没那么难，做推广无非有两种，一种是拼命砸钱的，这种要么是准备融资，段时间内获取用户，让数据更好看的公司，要么是拿完融资，或者不差钱的公司，用钱来换用户，毫无疑问，我们暂时都不是。还有一种就是花钱是为了赚钱的，我们过去做了一些推广，每一次推广花了多少钱，带来了多少用户，这些用户来了之后带来了多少销售转化，有多少复购，留存多久，这些都有详细的数据的。如果算下来，每花
    100 块，带来了 100 块的转化，哪怕一分钱都不赚，这事就好办了，就拼命地花钱推广就好了，因为即使现在不赚钱，但是他有品牌传播效应，这样的推广一定是非常值的，但是每花
    100 块，只带来了 90 块的转化，推广的越多，亏的越多，这对一个成熟的商业公司来说，是不值得干的。


    从我们过去的推广数据来看，现在的推广投入产出比是没法维持的，主要原因是现在 App 红利期已过，每争取一个 App 用户获客成本太高，而用户对产品推广已经免疫了，所以带来的转化很少，所以得出结论，应该不止我们，这个行业现在所有推广
    App 的都在亏钱，所以这事不值得再去做，起码暂时不值得去做了。


    我的看法获得了同事和老板的认同，这是毫无疑问的。


    有的同学可能会以为这不过就是你工作的事情，跟我们也没关系啊，那再联想到我最近在小密圈做的事，很多圈友们可能都知道，我最近都在推广小密圈，经常做活动啥的，你们知道我做这事的逻辑是什么吗？


    小密圈刚开始的很长一段时间我多没有做过一些宣传与活动，如果把小密圈看过我的产品的话，产品正处于初期，很多东西都不完善，我不确定我能给大家提供什么，更不确定你们对这里满意么，如果我给大家带来的价值很小，很多用户都不满意，那么我让更多的人加入进来，只会让这里的氛围更差，让付费加入的同学不满意甚至uch怨，这会严重的影响我个人的口碑与声誉。


    但是通过这几个月以来的进化，我已经大概演变成一种稳定的形式了，我在圈子里回答一些问题，平均每周固定生产出一篇对你们有用的长文，之前还做了两次满意度调查，每次调查结果都是
    98% 满意度，当然，这数据有水分，比如有很多人没参与进来，比如有的人可能冲着我的面子给个满意，但是这已经远超一些好产品的满意度了，我已经自信，加入这里进来的大部分都觉得自己花的钱值，剩下来的就好办了，我只需要宣传、推广给更多目标用户就好了。'
