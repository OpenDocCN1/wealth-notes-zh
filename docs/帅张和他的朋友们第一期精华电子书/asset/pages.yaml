  md: '# 4.3 我的⼀次创业投资史


    > 创业是生活的一部分，我们只把它当作一种工具来用。创业如修行，在不断前行中找到自己存在的价值


    # 我的⼀次创业投资史


    上次做了调查，没想到大家对我投资的吐司店这么感兴趣，那么今天就来给大家分享下。


    这家吐司店其实不是已经存在的，而是我们全新集资，从店铺到品牌到生产全部从 0 起步，可以算是实打实的创业。最初因为我们以前的公司对面有一家面包店，经常卖断货，包括我们自己也经常喜欢去这家店买，这让我们觉得这产品做的太好了，然后我们
    CEO 试着跟这家店老板接触，了解到这家店也是别人投资的，请的一位做面包很厉害的人全职打理，经过深入接触，我们发现，这位老板娘对吐司是非常的热衷。


    她有两个女儿，每天早上四五点钟就要为女儿准备早餐，而早餐就是以吐司为主，而且为了不让女儿吃腻，每天变着法的做不重样的吐司，她对吐司有着非凡的热情。而她现在管理的这个面包店，也只是打工而已，老板为了追求更高的销售，会让她做各种不同的面包，还有各种酸奶、饼干、糕点之类的，虽然她都可以做，但是她不太喜欢。


    我们觉得这是个机会，然后我老板就说服了她出来创业，她负责产品，其他的不要管，终于，经过长时间的接触与了解，终于说服了她离职。但是创业需要资金，老板找了我们几个平时一起玩的不错的兄弟
    + 高管，问有没有一起愿意投资的，老板此举一是想一起筹集资金，别以为老板很有钱，老板只是身价高，但是在没变现之前流水资金倒不见得有多少，二是也想借此拉拢一些高管，长期跟着公司干下去。


    别以为现在发展的不错，但在当时只有一个想法的时候，你根本看不到未来，当时很多人就放弃了这次投资。而我在了解了之后，就基于一点判断，我吃过她做的面包，确实很好吃，我觉得这产品足够好，一定是有机会的，所以，我几乎没犹豫就选择了投资，当时我媳妇还各种担心，觉得不靠谱，不让我投，好在我坚定了自己的判断。当然了，除了老板之外，其他人当时都没多少钱，投的较少，老板投了大头，十来个人总共凑了差不多
    200w 吧。


    创业这事说起来容易，但真正做起来特别难。我清楚的知道，就光找门店地址就找了有将近半年，地段、人流量、房租等等都需要考虑，好不容易条件符合了，去谈判的时候，还会遇到商场管理人员的一些为难与“小费”，折腾半年之后，终于敲定了在上海最繁华的地段世贸大厦升起来了。


    但是升起来之后，原料、工具都是个大事，我们笃定，要做就要秉着最好的去做，所以，所有原料与生产工具都买的国外最好的，我还清楚的记得工具运到国内的时候被海关扣掉，深夜我跟一哥们去海关处理，根本不知道哪里不合规定，其实就是想为难你，最后塞了
    500 块了事。'
