  md: '# 2.1 认知与知识


    > 认知与知识，财富与思维。


    目前为止，知识星球已经有将近 3500 位球友了，有的人加入比较早，有的人加入比较晚，但是到期时间是一样的，之所以这样设置，因为我认为这个世界就是这样的，先入为主就是这个社会的现实，仔细想想每一个行业是不是都是这样。


    不管你是最先加入的，还是中途加入的，你们可以观察到，我几乎很少在这里分享技术相关，甚至技术的问题也不会回答，我一直跟大家说，我想让大家在这里「做事态度」与「思维方式」有所改变，这是受益终生的，很多人也许不理解啥是「思维方式」，觉得有点抽象，其实「思维方式」本质上就是「认知」。


    # 1. 什么是认知和知识


    我之前跟大家说过，技术性问题你最需要的是 Google，没人能比 Google 能解决你的问题，而 Google 搜索出来的东西本质上是「知识」，Google
    不可能告诉你一些「认知」上的东西，有人问了，啥是「认知」？啥是「知识」呢？


    举几个例子，大家就明白了：


    五年前告诉你去买比特币能赚钱，是认知。如果告诉你比特币背后的原理，给你普及区块链相关的技术，这是知识。


    好几个月前，我告诉你定投腾讯股票能赚钱，是认知。怎么买腾讯的股票？怎么开户？这是知识。


    我告诉你未来五年是人工智能的时代，Python 语言会大火，是认知。如何正确的学习 Python？这是知识。


    前段时间我告诉大家，搞个头条号，搬运点内容，可以赚点小钱，这是认知。怎么注册、运营头条号？怎么搬运内容？这是知识。


    我告诉你投资理财很重要，这是认知。怎么接触学习投资理财？这是知识。


    ……


    # 2. 知识的作用


    知识有没有用？当然有用，但是知识你不加以吸收转化为自己的能力，是没多大用的，而认知通常不需要你花大量的时间去吸收，你只要愿意执行、总结甚至加以扩展，那就有很大用。市面上所有开发的东西，能找到的东西，基本都在传授知识，但是很少有人告诉你认知，这是最大的差异。'
