  md: '# 3.3 如何更好的坚持下去


    > 很多人总是说：“道理我都懂，可是我做不到”，还有很多人也会有这么一种感觉，为什么我也很努力，但是总没什么进步呢？或者说，我努力了一阵，但是总是坚持不下去。很多人知道，我自己是很努力的，但是如果只是努力的话，我相信大部分人都能做到，并不是每个人都觉得努力很有用。


    如何更好的坚持下去？（看完之后也许会让你恍然大悟）


    前一阵子，有读者留言问我「张哥，道理我都懂，可是我做不到啊，该怎么改变这一现状呢？」


    我们都知道一万小时理论，意思就是，不管你做什么领域，从事什么行业，只要你能坚持学习 1w 小时，那么你肯定能成为行业专家。听起来很简单，只要坚持就行了，但是坚持恰恰是最难的，绝大部分人是没有这样的意志力的，就跟上面读者提到的问题一个意思，那么今天我就来教教大家如何更好的坚持下去。


    坚持其实跟自己的「意志力」直接相关的，很多人总觉得自己的意志力很薄弱，无法控制自己，然而实际上，我们对意志力的理解是狭隘的。


    意志力分为两种，一种是内在的，即我们常规理解的，包括自控、自律，要做什么，不要做什么等等，另一种是外在的，这与我们所处的环境，所接触的人、事物等有关。


    我们先来说说第二种，即外在的。这种应该很容易理解，比如你在学校的时候可能会喜欢学习，但是放假回家了，你就没有学习的动力了；比如你在一个学习氛围很好的班级里，那么你也会不自觉的跟着学习，但是如果你在一个小混混班里，那么你如果想继续维持一份学习的心态是很怪的。


    我们都知道「孟母三迁」的故事，本质上也是因为孟母知道外在环境对一个人意志力的影响是很大的。所以，如果你想提升自己的意志力，不妨尝试着看看可否改变下外在环境：


    多跟身边爱学习、优秀的人接触，哪怕不是一个行业，但是他的一些行为多少会对你有些促进作用；积极的加入一些氛围不错的圈子，拿我的小密圈举例，很多人都在小密圈积极的分享、学习、写作，你会发现写作、分享的人越来越多，这就是一种从众效应；多向自己崇拜的人靠近，你想成为什么样的人，就多向他们靠近，有意无意间都会对你有影响。


    说完了外在，我们再说说内在，很多人总觉得内在的意志力是天生的，无法改变的，其实，这是错误的，如果你什么都不做，当然意志力是无法改变的，而且意志力可能会越用越少，没错，意志力是有限的，比如我们经常开始做一件事情的时候是三分钟热度，在开始做的时候意志力是最强大的，但是随着我们坚持的时间越来越长，你的意志力越来越弱，这不是你个人的问题，本质上是因为意志力是有限的，它会越用越少。只不过不同人的意志力有强弱之别，你的意志力只能让你坚持三天，有的人意志力可以坚持一个月，有的人意志力可以坚持一年，但是那些能坚持一年的人，后面看到了成果，取得了一些许成就，又产生了额外的刺激，使他意志力再次提升，然后就很容易把一件事情做成。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '那么如何提升自己内在的意志力呢？


    这个世界上一种技能叫做「刻意训练」，什么意思呢？大家都知道我做一件事情算是有毅力的了，比如一个人自学编程，再忙的时候都坚持每天学习，到写公众号，平时工作已经很忙了，但是我依然坚持着，直到后面也做出点成就等等，其实我的这些意志力都是「刻意训练」得来的。


    那我大概做了哪些事呢？我自己负责的产品薄荷上有个打卡功能，到今天为止，我已经连续打卡了 649 天，有我微信好友的同学都知道，我坚持每天至少发一条朋友圈，印象中应该有遗漏的时候，但是你可以去翻翻，遗漏的天数非常少，我坚持每天晚上睡觉前阅读，我坚持在小密圈每周至少写一篇有思考的长文，等等等。


    这些看似毫无关联的小事，其实都在围绕着一个点：「刻意训练」自己的意志力。


    从更容易坚持的小事开始，先是打卡，再是发朋友圈，如果连每天坚持打卡这样的小事都做不到，你告诉我，你说你能坚持每天学习，你觉得可能么？但是，当我把一件小事做好了之后，再逐步提升自己的难度，从坚持打卡之后，到坚持发朋友圈、再到坚持写作、坚持阅读、坚持学习，逐渐的，我的意志力就这么锻炼起来了，而且，后面我再做任何事情总觉得一定可以做成，因为对我来说，坚持写作、坚持阅读、自学编程这么难的事我都可以坚持的下来，还有什么更难的呢？


    之前有一位读者在我公众号留言说：「张哥，我是学生党，没钱赞赏，我坚持给你公众号点广告，希望不要介意。」我给他回复说：「你点广告对我来说没几个钱，但是如果你真的如你所说能坚持把这件事做下去，你绝对会有所收获。」只不过我没有给他解释会收获什么，其实就是会收获意志力。


    所以，如果你想提升自己的内在意志力，那么建议你先从身边可以做成的小事来「刻意训练」做起，坚持每天跑步，坚持每天读一篇文章，坚持每周健身等等等，当你把一件小事坚持下去的时候，你的意志力就已经得到了提升，并且逐渐提升自己的难度，每完成一件事情，你的成就感会上升，你的意志力会逐渐强大，以后做任何事，你都会更好的坚持下去。


    所以，「刻意训练」内在，着手改变外在，你的意志力绝对会有提升，方法教给你们了，如果再有人给我说「张哥，道理我都懂，可是我做不到」，那就是人的问题了。'
