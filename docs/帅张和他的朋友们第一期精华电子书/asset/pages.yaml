- pgno: 73
  md: '最后，这次创业的完整经历，总结出以下几点：


    +   1. 产品好才是王道。不管你是自己创业还是投资别人，首先产品真的足够好，这样你才会有说服力，一切的根本，都是建立在产品的基础上，否则，没法持续。我们在中间遭遇了不少挫折，每一次都是因为我们自认我们的产品足够好，这才支撑我们走下来了。

    2. 靠谱的团队很重要。对的人才能做成对的事，如果你的产品够好，那么仍然没能发展起来，那么一定是人的问题。找到靠谱的人，好的产品，这样的人会有办法推向市场，我们从
    0 创业非常难，幸亏我们都是职场精英，每个人都具备自己的技能，都可以帮得上忙，如果是普通人创业，是不具备这么多技能的，所以，找到靠谱的团队一起创业，胜算才能更大。

    3. 专注。上次我没提到这点，但是这次的经历，我们就是因为专注才能达成这么大的合作，我们没有急于求成，没有为了销售，去推出更多的产品，而是一年多的时间专注在吐司这件事上，这让我们在单一品类的竞争上，有了巨大的优势。所以说，不管是创业也好，还是你在职场也好，争取你可以在专注在某一块，先在某一块精了之后，再去横向拓展。


    以上，就是这次创业的真实经历。但是创业就要时刻有危机意识，虽然现在看似发展还不错，但是未来怎么样谁也不知道，我们一直在用平常心来做事，扎扎实实走好每一步就好了。


    最后，以上是我在星球的私密分享，从没有分享在其他地方，这篇分享我不希望扩散，也不希望转发，还请大家理解，只希望对部分有创业想法，或者未来打算创业投资的部分球迷们，有点借鉴帮助作用。'
