  md: '最后，我再强调一次，投资理财，很重要，在这个社会，不懂得钱生钱的人，是很难积累财富的。


    # 2. 投资理财经验谈


    之前有断断续续的跟大家提过投资理财方面的知识，发现大部分人其实都缺乏相关概念与意识的，今天就借这个机会跟大家普及下投资理财，以及我自己对投资理财的一些看法。


    +   - 为什么人人都要懂点投资理财？


    首先，先给大家介绍一个很关键的问题，就是，为什么人人都要学点投资理财呢？如果看完这部分之后，依然对投资理财不感兴趣，那么建议后面的内容就可以不用看了。


    每个人都崇尚「财务自由」，但是财务自由是个伪概念，没有多少人能真正的财务自由，但是我们总期待着，除了工作之外，还可以尽量多赚点，哪怕实现不了财务自由，但是起码我们在为这个方向做努力。而我们中绝大多数人，唯一的收入来源就是工作，单纯的靠工作有没有可能实现财务自由呢？绝对不可能，别的不说，就说IT行业，只靠努力工作，年薪能达到50w的都算是佼佼者了，年薪达到100w的绝对是进入了高层。


    所以，我们要做的除了工作之外，我们要增加我们的「被动收入」，年薪100w与年薪50w + 50w被动收入你选择哪种？毫无疑问选择后者，一是年薪100w光交税都得交几十万，到手¿Quién能有60%就不不错了，而50w被动收入，一是自己不用交税，二是自己做事会更有底气，完全不用担心自己失业，所以，被动收入很重要。


    而增加被动收入的方式有很多，这个以后再专门跟你们讲讲有哪些增加被动收入的方式，投资理财就是属于其中一种，而且它其实是增加被动收入很高级的一种，用钱来赚钱。


    可是绝大多数程序员的钱都是存在余额宝的，虽然可能很多人觉得，钱存余额宝只是为了方便存取而已，你根本不在乎余额宝那点利息，这个思想我觉得是错的，这个世界上之所以有钱人越来越有钱，穷人越来越穷，本质上就是因为有钱人懂得让钱生钱，甚至会借钱让钱生钱，而穷人的钱只会存银行，现在的余额宝基本跟银行没什么区别。


    当然，有钱人能赚上千万，很可能动用了几个亿的资金，我们没有那么大的资金，但是赚钱的技能是通的，反而在我们只有几万块的时候，恰恰是风险最小的时候，我们如果只亏损了几万块就学会了一项赚钱的技能，这才是最大的价值，要知道，随着年龄的增长，我们的财富会积累越来越多，而我们年轻时候如果掌握了一项投资理财的技能，这对以后是非常大的价值。


    所以，我建议，年轻人，你不该满足于只埋头工作拿的死工资，更不该满足于余额宝那低的可怜的利息，你应该越年轻，学点投资理财知识。


    +   - 投资有风险


    如果你看完上面的一大段，决定要投资理财的话，那么在正式进入之前，你必须先知道两个原则，这两个原则是投资最关键的两条原则：1. 投资有风险；2. 懂得分散投资；'
