  md: '# 4.4 如何正确的提加薪


    > 加薪职场不可避免的一件大事。


    之前不少人问我提加薪的事，就给大家聊聊如何正确的提加薪，这里给大家总结了 12 点建议，仅供参考。


    +   1. 不同的公司其实加薪制度是不一样的，大公司不可能关注到个人，所以更多的是依赖制度管理，加薪考核机制也一样，一般一年一次考核，然后升职加薪。小公司比较灵活，没那么多的条条框框，氛围好的可能一年两次加薪机会，再不济一年一次加薪机会是有的；

    2. 加薪的幅度取决于加薪的频率，而且是按照工资的基础来算的，比如大公司一般一年一次考核的，依据考核结果决定加薪比例，一般多在 15%-20% 之间算正常，而小公司一年两次加薪的，那么每次加薪幅度就没那么大，一般一次在
    10% 左右。

    3. 也有一些特别良心的公司与老板，你也刚好做出了重大贡献，一年加薪次数可能不固定，比如，我之前为公司做出重大贡献，也刚好赶上工资融资资，那一年，我印象很深，加薪了四次，工资直接翻倍，不过也因为当时工资基数较低，所以翻倍很容易，这种特例情况，就不单独考虑了，这条是秀光辉历史的，没想到吧。

    4. 大公司因为有明确的加薪制度，你主动提加薪基本没 quorum，也不太可能为了你一个人去违反制度的，所以，一般来说，主动提加薪的情况也基本在比较灵活的小公司会出现。

    5. 一般来说，具备以下情况你应该要主动提加薪。过去一段时间你做的还不错，这个不错是领导对你的评价，而不是你的自我感觉。你的薪资明显低于市场平均水平，或者你已经超过一年以上没加薪了。公司没有出现一些财务问题，或者公司没有经营不善，或者没有赶上资本寒冬。以上缺一不可。

    6. 补第 5 条，哪怕你工资真的远低于市场水平，但是你自己做得很差，那么公司也没义务给你加薪，加薪是一项福利，而不是法律要求，所以，以上加薪条件缺一不可。

    7. 在主动提加薪之前，你该先想清楚自己加薪的期望以及可能造成的后果，如果加薪同意了，那么皆大欢喜，如果加薪不同意，或者加薪幅度没达到你的预期，这个时候很多东西会发生一些微妙的变化的，你是离职还是继续接着干必须提前想好。

    8. 千万不要以离职为理由来要挟老板或者公司，我是见过有情商比较低的同事，在跟公司谈加薪的时候，有意无意的暗示如果不加薪就离职，这种做法是最愚蠢的，公司离了谁都正常运转，任何一个老板都接受不了被威胁。

    9. 如果你拿到了一个不错的 Offer，但是不想离开这家公司，毕竟一些环境、氛围与关系都熟悉了，如果公司给你加薪你会留下来，这个时候依然不要以拿到一份不错的
    Offer 为资本来谈判，正确的做法是，跟你的领导或者老板提加薪的时候，无意识提到外面一家公'
