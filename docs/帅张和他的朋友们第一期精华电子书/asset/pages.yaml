  md: '# 3.1 堪称月薪 5w 的顶级文案都必须遵守的标准


    > 之前有不少人在我公众号给我留言，说看我的排版很舒服，求指导。我自己在我的知识星球中也一直强调排版的重要性，很多球友发布的动态无一排版都太烂，为此，在这里写下了这么一篇排版指南，我相信相对不少人都有很大帮助。


    # 1. 空格


    我每次看到网页上的中文字和英文、数字、符号挤在一起，就会坐立不安，忍不住想在他们之间加个空格。


    > 「有研究显示，打字的时候不喜欢在中文和英文之间加空格的人，感情路都走得很辛苦，有七成的比例会在 34 岁的时候跟自己不爱的人结婚，而其余三成的人最后只能把遗产留给自己的猫。毕竟爱情书写作都需要适时地留白。」


    +   - 中英文之间需要加空格


    eg. 大家可以搜索公众号 AndroidDeveloper 或者 googdev 关注我。


    +   - 中文与数字之间需要加空格


    eg. 不知不觉，我都快 30 岁了。


    +   - 数字与单位之间需要加空格


    eg. 我有一块 20 TB 的硬盘，鬼知道我是变成用完的。


    +   - 完整的英文整句时标点与单词之间需要加空格


    eg. Stay hungry, stay foolish.


    但是也有一些例外。


    +   - 度的标志、百分号不加空格


    eg. 今天气温有 30° 的高温。eg. 据统计，关注公众号 AndroidDeveloper 的读者中有 80% 是长得好看的。


    +   - 全角标点与其他字符之间不加空格


    eg. 大家好，我是 stormzhang，请多多关照。


    # 2. 标点


    说到标点，不得不说下全角和半角，很多人可能不了解全角和半角的概念，这里顺便介绍下。'
  merge: -1
