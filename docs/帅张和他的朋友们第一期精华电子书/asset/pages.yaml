  md: '我在公众号上写作分享，我写的越多，我的文案写作能力越强，只要我一直写下去，哪怕一天有一个新的读者关注我，我每月能帮助到一位读者，随着时间的积累，我的读者会越来越多，我的影响力也会逐渐积累下来，我要做的只是坚持下去就好了，时至今日，我所有的这些成就都是积累下来的。


    相对应的，我学习投资理财，哪怕亏钱，但是只要我坚持下去，实践下去，我的投资理财经验只会越来越丰富，能力只会越来越强，这种能力也许暂时对我的帮助不是太大，但是通货一直膨胀，我的年龄与经验一直在增长，等到我
    40 岁、50 岁，投资理财方面的积累我相信一定会给我带来巨大的收益。


    所以，我认为程序员培养第二技能非常重要，而第二技能的选择要选择「可积累性」更强的技能。


    比如写作、演讲、投资理财、授课、技术咨询等等。


    你的第一技能，也就是你的本职工作，为了养家糊口，积攒第一桶金，但是你应该想到你的价值远远没有发挥出来，如果你具备第二技能，比如写作、演讲，这种第二技能还能跟你的第一技能结合起来，让你的第一技能价值最大化，互联网时代，让你的技术影响帮助到更多人，而不单单让你你的技术只为你的老板创造价值，把本身的价值发挥最大化，相信当你影响帮助足够多的人，第二技能一定会让你有额外的收入，甚至逐渐的第二技能超过你的本职工作，中年危机对你来说，根本不可能。


    投资理财、授课等等一样的。


    我经常看到有人利用业余时间接外包，甚至发传单，跑滴滴专车等，其实我非常不赞同，这种多是短期利益，除非短期利益很高，否则这些业余时间用来培养可积累性较高的第二技能，将会在你人生的长期阶段给你创造价值，别被短期的蝇头小利迷惑了你的双眼。


    至于第二技能多种多样，不仅仅限于以上列举的这些，比如我有位读者学计算机的，吉他谈的非常好，他在大学的时候搞了个吉他教学班，收费的，这也算是他的第二技能，帮他创造了价值。你的性格适合什么样的第二技能，需要你自己去发掘，只不过需要提醒的是，你的第二技能在职场的初期不要影响本职工作，还是应该把主要精力优先放在第一技能的提升，因为第一技能是吃饭的家伙，业余时间去培养第二技能，第二技能具有不确定性，当有一天你的第二技能收入超过了第一技能带来的收入，本质上就可以考虑所谓的「自由职业者」了。


    以上就是我本人的经验分享，也许有人不同意，有人不赞同，没关系，不同的阶段有不同的认知太正常了，只希望认同我的观点的读者，从现在开始，就开始考虑你的第二技能，越早越好，三五年之后，期待第二技能给你带来的变化。'
