  md: '# 2.2 2018 互联网预测


    2018 已到，你是否抓的住风口。


    想要抓住风口，就要对未来敏感，虽然任何人都无法看清未来，也没法准确预测未来，但是预测是让自己更好的做准备，哪怕未来跟自己预测的完全不着调，也没啥影响，但是一旦真如自己预测一般，自己会更快的上车，我自己这些年的经验，告诫大家，更快的上车异常重要。


    以下就是我个人对 2018 年互联网的一些预测，可能很扯淡，但是仅供参考。


    +   1. 区块链在 2018 年会更火热，可能会是 2018 最火热的领域，但是一定会比较动荡，动荡之中也许会诞生非常有潜力的公司；

    2. 2018 年言论监管与控制会更严格，不要随意发布太敏感言论；

    3. 人工智能也许会在 2018 年有一些具体的商用项目；

    4. Python 和 Go 也许会成为 2018 年最火的编程语言；

    5. 随着小米的上市，物联网、智能家居也许会是一个风口；

    6. 今日头条会成为新的巨头；

    7. 付费阅读会成为常态；

    8. 腾讯和阿里巴巴依然宝刀不老，股票依然有增值的潜力；

    9. 无人驾驶也许会有新的突破，无人驾驶会成为巨头必争之地，因为汽车在未来会成为像移动互联网操作系统一样重要的地位；

    10. 电动汽车会被越来越多的人青睐。


    以上，是我的预测，坐等 19 年打脸，这其中对我们来说有很大机会，说句真实的，我从来没有像现在这么激动，我认为现在的时代，机会遍地，对于我们普通人来说，抓住一个风口就可以弯道超车，我在时刻准备着。'
