  md: '# 4.5 职场带团队应该要知道的事


    分享我带团队的经验


    # 1. 凝聚力


    一个团队最重要的就是凝聚力，每个个人入职的第一天，我一般都会做个简单谈话，介绍下公司业务、团队氛围以及产品业务，但是我永远先是强调一句话：「我们是一个团队」，无论你做什么业务，跟进什么样的产品线，但是我们
    Android 永远是一个团队，这意味着以后所有的成就也好，遇到困难也好，你不再是一个人，背后永远是一个团队，团队成员其他人遇到困难一定要当做自己的事情去帮忙。


    因为一直强调这个事情，导致团队内部氛围非常和谐，有什么活动的时候一般都是团队行动，比如公司聚餐排酒，比如一起玩游戏，一起打篮球等。


    凝聚力是一个团队的灵魂！


    # 2. 抗事


    我想我们都有这么一个共识，就是如果一个团队或者团队成员做的不错，那么只要是一个靠谱的老板肯定会认为这个 Leader 做得也不错，如果团队成员犯了什么错，Leader
    理应抗下事，如果一个 Leader 只是贪功，不能抗责，任何一个成员我想都会有所怨言。


    我见过很多 Leader 在出事的时候，都会跟老板说，是谁谁由于什么问题犯的错，言外之意就是这事跟我没关系，但是我却从来不是这样，在公司的这几年，手下的人员没少出事，有些是很严重的
    bug，出事的时候我能明显感受到团队成员都慌了，生怕会被开除，然而每次我都跟他说，先想办法去补救，天大的窨子有我扛着呢。


    所以，每次团队成员出事了，在老板那边我都会说是我的问题，主动承担，主动总结经验教训。事后，我会在团队成员内部问责，出事了不能说算了，一定要让团队成员意识到事情的重要性，虽然责任我扛了，但是需要总结教训，下次一定争取不能再犯，也因为这件事，团队成员无论老小，都很服我。


    # 3. 为团队成员争取福利


    抗事归抗事，如果只是抗事，不能给团队成员争取福利，那是虚的。虽说一个 Leader 应该没有绝对的话语权，但是一旦有加薪的机会，我都会尽我所能为团队表现优秀的成员争取加薪，这一点很多
    Leader 做不到，因为一旦涉及到钱的问题，大部分人都会优先考虑自己，其实这个格局就比较低了，不管是加薪也好，奖金分配比例也好，自己率先做出牺牲，才能让你的小伙伴们愿意跟着你。'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 4. 给团队成员更多成长的机会


    一个人员工在一家公司工作一般只关注两点，一是钱，二是成长。所以哪怕你们公司跟土豪公司比不了，但是能让他成长，给他更多的机会，这个也是很有吸引力的。


    所以，我会充分了解每个人的优缺点，在职业成长这块每个人的性格，决定不同的发展方向，比如有人对技术很痴迷，那成给他深入研究技术的机会，有的人在沟通交流很擅长，有团队管理的潜质，那成给他团队或者产品负责人的机会，有的人对产品感兴趣，那成给他争取产品经理的机会，充分发挥每个人的性格与擅长的地方，而不是一股脑的都往架构师的方向，毕竞，不是所有人都适合一个方向。


    我当 Leader 的时候一直记得一句话，这句话深刻的影响着我：


    > 「Before you are a leader, success is all about growing yourself. When you become
    a leader, success is all about browing others.」


    # 5. 亦师亦友


    我当 Leader 的时候有个特点，因为我跟团队成员的年龄差不大，所以工作上我们是上下级，工作之外，我会跟团队成员玩在一起，但是工作跟生活我是很能分得开，无论关系多么好，工作上的事做不好，我一样批评，做的好，我一律表扬。


    而且现在是在一家公司工作，但是以后每个在不同的公司的时候，依然是当做朋友，当做兄弟一样相处，我前段时间两个兄弟离职，每个人的工作我都尽我所能内推，我的人脉关系会给他们推荐一些各方面更好，更适合他们的工作。


    # 6. 坦诚


    虽然有时候我会尽我所能给团队成员争取加薪或者福利，但是自己总归没有最终的决定权的，而且有很多客观环境，比如资本寒冬的时候，很多人都在那年都没怎么加薪，整个市场确实差，老板也跟我说明了情况，我跟我们团队成员很坦诚的沟通，资本寒冬情况，今年都没有什么加薪，如果有想跳槽的，都完全理解，毕竞每个人都有自己的选择与考虑，令我没想到的是，团队成员很理解现状，资本寒冬期间，没人离职，那段时间每个人的薪资其实都很一般，跟市场比没什么竞争力，可是当你坦诚沟通这件事的时候，一切都很简单，大家都是成年人呐，遇到事情藏着掖着，都能看出来，不如坦诚沟通，事情一说开，无论怎么走就简单多了。


    大概就是这些吧，一时间也想不到了，希望对大家有所帮助，对现在已经是 Leader 的同学，或者以后将要成为 Leader 的同学有所借鉴，当然，前提是，你得能遇到个好老板，你所做的这些你的老板会看在眼里的，但是这件事不是自己能决定的，我们能决定的，就是做好自己，你得相信，长期坚持做对的事，遇到一个好领导、好老板只是时间问题而已。'
