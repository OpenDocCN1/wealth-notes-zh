  md: '司对你有意思，给的薪水还不错，但是你对现在公司的产品以及方向很认可，也喜欢这里的工作氛围，就是薪水低了点，希望可以争取下加薪，这样工作会更有动力。如果争取失败了，那么可以理直气壮的去那家公司了。


    10. 提加薪之前最好先充分的了解下市场行情，最好还能给自己提前留好后路，做最坏的打算，万一加薪不通过，你离职了，而且可能很多人遇到这种情况都会选择离职，因为会觉得干的不爽，这种时候起码有条后路。


    11. 任何时候提加薪的时候千万不要有恃无恐，虽然说敢提加薪一般都是有恃无恐了，但是态度一定要谦卑，要表现出自己非常热爱公司的样子，千万不能说不给加就滚蛋。多强调自己的贡献和目前生活的困难。


    12. 提出离职的时候一定要果决，理由必须是私人原因，任何情况都不要跟公司撕破脸，还要表现得非常的依依不舍，但是态度一定坚决，过來人的经验告诉你，离职被挽留在這继续工作会很不爽。


    13. 提加薪之前，先考虑一条最重要的，就是「你的工作是否具有不可替代性」，不可替代性越高，你的加薪要求被同意的概率会更大，反之，被通过的概率会较小。'
