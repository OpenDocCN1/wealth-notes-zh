  md: '# 3.10 教你一些赚钱的套路


    > 君子爱财人人皆知，一些赚钱套路分享给大家，愿君早日财富自由。


    知识星球内部的球友都知道，我经常谈的最多就是「赚钱」，我个人的价值观认为，只有多赚点钱，才能实现我们的理想，才能做我们想要的事，我年轻的时候也是一个理想主义者，总觉得那些有钱人很
    low，没有钱一样可以实现自己的理想，可是当我走上社会，在社会上四处碰壁的时候，我才发现，没钱真是寸步难行，没钱也很難实现自己的理想，没钱更不能让自己的家人过的更好，所以，我会想法赚钱，而且当我有钱了，我一直坚持「达则兼济天下」的原则，我慢慢的也不再仇富了，我甚至佩服那些有钱人，无论如何，那些有钱人可以赚到钱，一定是有非常人的能力，而且我的态度比较乐观，我如果听到谁谁又赚到钱了，我会很高兴，因为我觉得他们可以，那么我就一样可以。


    那么今天我就结合我这些年的经验，来给大家谈一谈一些切实可行的赚钱的套路，注意，我从不觉得「套路」是个贬义词，只要合法合规，一些套路我认为都是聪明之人的策略，另外，我知道星球内部肯定有一些人对赚钱不屑的，有的人生态度是追求平凡、安逸的渡过一生就可以了，这种生活态度没问题的，我也没有批判这种生活态度的观点，只是不同的人不同的选择而已，只不过如果你是这种态度，你对赚钱无感，那么可以忽略这篇文章，如果你对赚钱很感兴趣，那么你就认真看下这篇文章。


    很多人知道，我赚钱是相对你们来说是比较容易的，但是本质上我赚钱容易是因为流量 + 原创内容，有了流量之后，赚钱就相对容易了，而再加上我可以产生原创内容，不管是一些经验总结也好，还是某一领域的知识技能也好，都可以通过巨大的流量去做转化，比如知识星球，目前已将近
    3000 人，这 3000 人给我创造的收入都是建立在我本身有流量，加上可以产生有价值的内容基础上的。


    但是大部分人，是不具备这样的条件，或者说不同时具备这样的条件，那么就没法赚钱了么？并不一定，下面我就来说一说明怎样让你们赚钱。


    # 1. 靠流量赚钱


    其实互联网时代，如果你没有流量，没关系，只要你肯用心，努力点，就可以获取流量，比如微博、知乎、公众号、头条等都是获取流量的平台，只不过知乎、公众号都是相对来说个人有影响力、有某一领域的真知灼见才能吸引流量，而微博现在有点像是媒体了，如果你没有影响力，没有产生内容的能力，那么建议你去试试头条号，头条号的推荐基于内部算法，而且流量超大，现在也是一个风口期，随便折腾点，有流量之后，靠点广告赚钱，每月赚个小几千块是很容易的。


    我举个例子，比如你开个头条号，就每天花半小时转发一些比较火的视频，有人会担心版权问题，一般来说文章的版权意识较严肃，视频的话，视频内部都会声明版权的，转发也没多大大事，实在不行，你从国外
    Youtube 上搬运一些比较火的视频肯定是没有版权问题的，这种'
