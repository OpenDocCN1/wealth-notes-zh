  md: '我不知道有多少球友有印象，我之前给大家普及的认知中，如果回头看看，虽然就短短的几个月，但是很多认知都被验证了，我给大家普及过定投的概念，并且建议大家定投腾讯股票，现在再看看腾讯的股票，我说过我长期看好比特币，在3w左右的时候短期内不建议大家入了，后面大跌之后又大涨回来了，我说过玩头条号可以小赚点零花钱，我不止看到一两位球友在上面赚到钱了，当然还有赚钱的套路、自我激励、我的阅读经验，甚至还有产品、运营、房价、房贷等等方面的认知，当然也有一些知识，还有各种各样方面的问题回答，总之，我是想做到的是提升大家的认知。


    # 3. 如何提升认知


    有人会问？如何提升自己的认知呢？


    认知这东西真的不是靠你努力就能获得的，这取决于你接触的环境、接触的人脉，以前我只是一个程序员的时候，很多东西真的没机会接触，但是当我在公司成了高管，负责公司产品，加上我公众号也影响力越来越大，我接触的行业、人脉是很多人没法接触的，比如我经常跟老板交流，也接触过不少产品经理、投资人，通过公众号也认识了不少金融大V、互联网大V等各行各业，长时间的接触与交流，加上我自己长时间的阅读，我的思维与视野都会被打开，我的认知也逐渐被提高，我可以这么说，这两年内的认知提升，超过之前我二十多年的认知。


    我之前说过这么一句话：「你想成为什么样的人，那就尽量去向他们靠近。」你跟别人靠近并不会对你产生职业上多少帮助，但一些交流、思维、影响是会逐渐感染的，你的认知，总归也会逐渐受到提升。


    所以，我的星球不是「知识付费」，而是「认知付费」，而本质上，认知付费才是最有价值的，也是最有可能让你弯道超车的！'
