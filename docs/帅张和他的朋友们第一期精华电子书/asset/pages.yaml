- pgno: 82
  md: '从产品的角度来说，付费用户的商业价值十倍于目标用户的价值，这也是为什么同样的用户规模，「得到」估值这么高的原因，所以付费用户值得享受更好的服务，也有利于建立更好的氛围，所以，我今年在小密圈上花费了不少精力和时间。


    刚创立小密圈我没有急着宣传，我小密圈的第一批「种子用户」是从赞赏的读者中邀请来的，在不确定一个全新的产品能不能被用户被市场认可的时候，内测邀请新产品的目标用户是最好的办法，之前赞赏过我的读者，我认为认可我，信任我，并且有付费意愿的读者，很快第一批读者就有了几百人。


    之后逐步开放给更多的人，我也在逐渐摸索运营方式，回答问题、分享知识与认知、内部抽奖都属于我的运营方式。


    之前有人说，我在小密圈内部抽奖是营销、推广，其实错了，这叫「运营」，这种方式只会让内部用户更加活跃，更加有粘性。


    而营销推广是指针对外部渠道，针对新增的。如果说我告诉我公众号的读者说，你付费加入我的小密圈吧，我在小密圈里抽奖送书，如果真有人只冲着抽奖送书就来付费加入的，那这才叫营销推广。毫无疑问，不会有人单纯冲着我小密圈有抽奖而加入的，所以，内部抽奖活动是属于一种运营的方式。


    第一期小密圈读者有 4200+，都是从我公号过来的，所以小密圈是我公号孵化的一种全新的商业模式，公号 10w 读者，小密圈用户 4200+，也就意味着付费用户
    4200+，转化 4.2%，这转化率在整个产品市场来看相当高了。


    小密圈第二期续费用户目前 700，700/4200 叫做「复购率」，复购大概在 17%，这复购率也相当高了，我敢打赌，应该是所有小密圈中很高的复购了，而且，复购还没结束，因为还有部分小密圈读者在等待活动。


    当然，为了提升复购我也做了些运营的活动，就是大家知道的续费赠送价格 199 的永久星球，但是并不是所有的运营活动用户都会买账，运营活动做的不 hyg，用户反而会加速流失，做的好的才会有效果。从目前的复购数据来看，加上很多球友的反馈，我的这个运营活动做的还不错，很多球友比较满意，而事实上也确实是很大的福利。


    小密圈属于虚拟商品，跟其他实体产品不一样，虚拟产品没有生产成本，卖多少份那就赚多少份的钱，唯需投入的成本是我的人力成本，也就是我的时间成本。


    我在第一期的「帅张和他的朋友们」星球的运营中，最吸引大家的方式主要是每周一篇的长文分享，我写一篇文章的时间成本其实不变，所以，我要尽可能大的扩大规模，让更多的人加入，这样我投入一样的时间成本，才是最划算的。


