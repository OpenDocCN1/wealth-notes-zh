  md: '# 3.2 如何主动学习


    > 知识可能改变命运，但我天生命硬学不来弯腰。


    你相信知识改变命运么？也许知识真不见得一定能改变命运，但是起码绝大部分人都相信这句话的，不然大家也不会去读书、上大学、付费加入我的知识星球，而在这个互联网如此发达的今天，可能会是知识改变命运最好的时代，互联网给了我们无限的可能，让我们极大的缩短了改变命运的最短路径。


    但是知识是如何得来的？学习，知识是通过终身的学习而来的。


    有些人可能会说，我读书的时候成绩一直很好，学习能力很强，所以学习能力是自己的强项。这可真不见得，要知道，我们在读书的时候，是父母让我们去上学的，到了学校，我们的大部分动作都是为了完成学业不得不进行的学习，这种我把它叫做被动学习，顾名思义，被动学习就是我们在外力因素下不得不进行的学习，有些人在学校成绩很强，但是到了社会，工作之后，自己的能力提升甚至不如那些成绩一般的同学，本质上是因为你主动学习的能力较弱，当你走上了社会，你的能力提升、你的知识获取全部取决于你的主动学习能力。


    主动学习包括三方面，一是学习意识，二是学习方法、三是行动。


    # 1. 学习意识


    别觉得你具有学习意识，很多人其实真的缺乏学习意识的。举个实际工作中常见的例子，我在职场中见过各种各样的人，有的人自己分配的任务做完了，就感觉良好。无所事事了，而有的人任务做完了，会利用一些空档的时间去学习下新的技术、阅读别人的源码，有的人下班了看看电视、玩玩游戏，有的人下班了还会看些书、写写博客啥的。


    这种差别本质上是意识的差别，只有先有了学习意识，你才会有行动。不管你能力强弱，还是工作经验有多丰富，你一定要认识到，你现在所具备的能力与知识远远不够的，你需要持续不断的学习来提升自己，工作也许是一时的，但是学习是终生的，有这种学习意识之后，你才会有进步的潜力。


    # 2. 学习方法


    也许很多人都知道学习，而且每个人可能都有自己的学习方法，有人可能会问？有没有一种最好最高效的学习方法？我告诉你，有！


    举个例子，假设一个人想学编程，大部分人可能会是这样一个学习过程，先看下编程需要学习什么知识，经过搜索发现编程有很多方向，有 web 开发、app 开发，经过种种纠结与思考，可能选择了
    web 开发，而 web 开发中网上又说 java web 开发不错，于是选择了 java web 开发，然后又去搜了下 web 开发需要学习 css、html、java
    等等等，然后下定决心要去学习，然后学着学着发现，这玩意怎么这么难，然后坚持不下去了。。。'
  merge: -1
  img_proc: true
- pgno: 42
  md: '然而，在我看来，最好的一个学习方法是，先问问自己你要做个什么东西出来，自己在大学发现有些网站赚钱的，自己就想搞个咨询网站，然后放点新闻，最后放点广告，就可以赚外快了，想想都好激动，但是同学之中没有会编程的怎么搞？没办法，只有自己自学了，然后网上搜索了下编程的学习资料，发现
    web 开发有很多种，java、python、ruby，我其实不那么关心用哪种语言实现，我只想快速开发出来就好了，然后搜了下说 ruby on rails
    开发网站很快速，于是就选择了 ruby on rails 来做一个网站出来，然后会发现我想做个效果炫酷点的，然后又去学了 css、js，然后数据哪里来呢？网上搜索有些聚合数据
    api 可以用，就这样一步步实现自己心中想法的过程中慢慢就扒腾过来了，这个学习过程，你不会觉得那么枯燥，而且很有效，因为你一直在解决问题中学习的，而且自己每解决一个问题会很有成就感，然后自己兴趣越来越大，紧接着，等你把你自己心中网站扒腾出来的时候，你的编程已经算是入门了，而一旦入门之后，后面的路就简单容易多了，这世界上大部分有技术含量的职业，其实都被阻塞在了入门阶段。


    所以，在我看来，最好的学习方法不是给自己定个按部就班的学习计划，去看那些枯燥的书籍或者理论，最好的学习方法 Dimple 先有个小想法、小目标，这个小目标如果实现了最好还非常有吸引力，比如如果你要做一个伟大的
    app，做成之后可以放广告、甚至融资等，紧接着朝着自己的目标去学习，一开始你就知道要去什么地方，你会不那么容易轻易放弃，会更有动力与成就感。


    所以，以后如果你再要学习编程或者学习一门别的技能，先别去想要学习哪些东西，先去想想你要做成一件什么事，再去针对性的朝着自己的目标去学习。


    # 3. 行动


    当你有了学习的意识、有自己的学习方法的时候，最关键的其实就是行动了。但是很多人恰恰在最关键的行动坚持不下去，道理我们都懂，但是我就是坚持不了。


    对于坚持，从来没有一个很好的方法能帮你解决，这取决于一个人的自控力，不过，我依然总结出一些不错的方法，可以让你更好的坚持下去。


    一是借助于习惯的力量。


    我相信每个人都有自己的习惯，比如有的人习惯早睡早起，有的人习惯晚睡晚起，比如有的人习惯看纸质书，有的人习惯看电子书，等等，但是你在学习的过程中，如果能很好的借助于习惯的力量，你不会感觉那么累。我举两个自己的例子：


    我以前在上家公司的时候，我每天要固定做一班地铁去上班，在地铁上要做 40 多分钟，因为地铁很稳定，所以这个是固定的，我在地铁上也无所事事，后来我就想，能不能把这部分时间利用上，于是我就在手机上存储一些自学
    Android 的资料，我就在每天的地铁上 40 多分钟的时间，每天看一点手机上的资料，你们可能不相信，不知不觉中，也就一个月时间不到，我就把一本 Android
    pdf 数据全部看完了，但是如果你让我每天晚上看 40 分钟，让我一个月看完一本书，我可能都做不到，后来想想，我自学 Android 的时候，可能大部分时间都是在地铁中学过来的。'
