  md: '再之后，品牌、包装设计、微店等等都需要花费时间，好在我们都是公司高管，都身怀绝技，我们这一堆兄弟，本职工作有做技术的，有做设计的，有做市场的，有做销售的，有做产品经理的，我们都分工协作业余时间给搞定了。


    但是在吐司生产好了之后，卖的不怎么样，买过的倒都说好，但是达不到每天都卖完的境地，我们设想的是，应该是每天生产的都不够卖的才对。


    我们聚在一起问自己，问题到底出在那里？我们开始怀疑产品是不是不够好？然后拿来市面上的一些吐司又做了一次比较，我们确认产品是没问题的，产品绝对比他们好，但是没有起色那就是人的问题了，老板娘只懂做吐司，但是她不懂市场、推广、运营、定位等等，所以需要一个专职的合伙人来帮她做这件事。于是，我们从兄弟几个找了个做产品经理的合伙人，经过他本人同意，给他额外的股份，果然，这哥们，给产品做了明确的定位，只做「精品吐司」，然后从推广到渠道再到网店都做了充分的调查与分析，做了会员，搞一些品尝活动，很快，情况就不一样了，口碑传播让我们的吐司很火，甚至一些美食节目主动报道采访。


    再之后，他们中间有一个困惑，就是发现，只做吐司，品类很少，没有新品持续吸引消费者，导致销售上不去，他们有想过要不要配合销售一些酸奶、饼干之类的，但是我们讨论之后给否了，我们就一个逻辑，专注，只有专注在一个产品，实打实的做法成全上海最好的吐司，就这一个点就够了。


    于是，我们真的就只做吐司，其余什么也不做。


    从来没想过，正是因为我们的专注，后面跟阿里盒马鲜生达成合作，盒马鲜生可能很多人不了解，阿里盒马鲜生是线下超市的新零售形态，多少品牌做梦都想入驻，我们这个成立一年多的品牌，本来以为是没戏的，但是万万没想到，就是因为我们的专注，盒马在十几家吐司合作中选择了我们，这真是莫大的惊喜，这个合作直接让品牌曝光、销售上一个大的档次。


    至今为止，我从没有在我公众号为这家吐司店打过广告，一是想低调些，二是也不想干扰它的发展节奏。但是现在入驻盒马，我觉得低调不起来了，而而且也证明了本身产品就是最好的，我们几个人完全可以拍着胸脯说，我们就是全上海最好的吐司。


    这是一次我经历的完整的创业过程，从0起步，从0投资的，知道这其中的不易，我们投资的那一刻都没抱太大的希望，而且中间一度以为投资的钱都打水漂了，现在看来，不只是有所回报，更多的是
    一次真实的创业体验。


    有人可能会纳闷，发展这么好，赚了多少钱？说实话，到目前为止，我没拿到过一分钱，我们几个投资的时候就决定，盈亏全部让全权管理的人决定，我们帮着参考，现在应该是赚了钱，但是赚的钱全部用来扩大规模、招聘员工了，我们拿到的也只是一纸股权协议，但是估值翻了近10倍，也就意味着当时投资了100块，现在估值1000了，但是估值不是现金流，你现在如果想要退出，想要返回10倍估值等额的现金，那是不可能的，所以，很多人会误以为现在能赚很多钱似的，这个其实只是资产的一部分，但是现在还无法变现，希望它继续发展下去，以后会引入更多的投资，争取也可以有意想不到的发展，到时候再谈变现的事。'
