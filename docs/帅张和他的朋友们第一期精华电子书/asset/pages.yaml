  md: '# 2.9 你的什么时间最重要


    > 分享「睡后」收入文章的时候提到这么一句话「如果你接外包，你的外包时薪单价一定要比你工作时薪单价高，再考虑接，否则是不划算的。」


    有同学可能就问了，为啥？我alka的业余时间反正闲着也是闲着，能赚点那就赚点呐。


    但是今天，我要再给大家提升下认知，你的这种想法完全错误，你根本不知道你的什么时间是最重要的。


    经济学有一句话大家都听过，叫做「物以稀为贵」，原理我就不需要解释了，相信大家都清楚，那么基于这点，我们就可以仔细对比下你大学读书和你工作之后的差别。


    大学的时候，最主要的职责是读书，正常来说，你上课的时间是最多的，如果这些上课的时间都作为学习的话，那么你是不缺学习时间的，因为平时待在校园里的时间最多，上课的时间也最多，那就意味着大学缺的是社会实践，那么就会引发一个问题，大学生的业余时间是用来学习还是用来实践是更划算的呢？


    我之前说过，业余时间用来社会实践是比你学习更值的，但是我没说原因，原因就是因为大学最不缺的是学习时间，最缺的是社会实践，如果能把你的业余时间拿去做大部分同类人最缺少的事，那么才是最优策略，也才能更体现你的优势。如果要排个名的话，那么应该是这样的：


    上课好好学、业余时间社会实践 > 上课好好学、业余时间也在学 > 上课不学、业余时间学 > 完全不学


    （以上社会实践包含各种实习、做项目等等）


    那么我们再说回工作之后，工作之后，毫无疑问，我们大量的时间都在工作，尤其算上加班，我们完全不缺实践，做项目，最缺少业余时间，缺少学习时间，缺少充电时间。所以理论上来说，工作之后的业余时间是最稀少的，如果要算个时薪的话，业余时间的时薪理论上也应该是比工作时薪更高的，这个时候你用业余时间去接外包的时薪甚至比你工作的时薪还要低，那是远远不划算的，聪明人哪怕业余时间在家休息娱乐，也不会去挣这一点钱，哪怕业余时间的时薪跟你工作时薪一样，那也是不划算的。当然，如果你急需钱，等钱用，那么这种另算，我所讨论的是从一个聪明的、有能力之人的角度考虑的，那些成功人士、富豪们，绝不会去花费自己业余时间去赚跟工作一样多的钱，除非，业余时间的时薪比你工作时薪更高，甚至几倍，那才是划算的生意。


    所以，综上，你的什么时间最重要？学生时代你的学习时间没那么稀缺，看似那些抓紧一切时间去学习的人，其实没有发挥价值最大化，因为任何学生都不缺学习时间，那些学习不错，同时业余时间还积极的参与大部分人缺少的社会实践、去实习、去做项目的同学，才是最聪明的选择，这样的人以后在职场也会更有竞争力。'
