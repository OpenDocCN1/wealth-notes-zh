  md: '渠道本身不需要花费多少时间精力，就做一个搬运工，而且视频很容易起流量，只要用心，搬的内容不错，每月靠着广告赚几千块是可行的，而且上次在群里聊，已经有人赚到钱了，并且真实的赚了小几千块。


