  md: '习，你也许说你在大学是计算机专业，系统性的学过，但是那算不上系统，因为那个时候你还不知道到底哪些基础是有用，哪些是无用的，而工作一段时间后，再系统性的去补习基础知识，你会很有针对性的知道自己缺乏什么，自己需要补习什么，比如，我工作
    2 年多的时间，突然发现，我 Java 基础较弱，于是专门从头看了一遍 Thinking In Java，这个时候再回头看，和我当初自学 Android 的时候看是完全两种收获，很多之前你疑问的地方，很可能再次回头系统学习的时候，解开了。


    这就好比，当你到了高中的时候，回头看初中的课本发现很简单，有些在当时看起来非常难的数学、物理也一样很简单，因为你所在的 level 已经不一样了，这个时候再回头复习在当初看起来很难的定理很容易就理解了。


    ok，以上就是我作为过来人的一点见解与建议，希望对部分人有帮助。'
