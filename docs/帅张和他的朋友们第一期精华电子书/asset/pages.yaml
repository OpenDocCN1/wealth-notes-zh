  md: '# 2.4 大部分人都有缺乏的一种特质


    大部分人都有缺乏的特质，看完这篇你就与众不同。


    前一段时间，有一位读者微信上问我一个问题，他准备报名一个写作教程，但是不知道怎么样，问我要不要报名？我问他教程多少钱？他说19块，不是那种培训课程，是一个图文加语音的课程。我接着问他，如果发现课程不适合你，或者课程很垃圾，被骗了，损失19块你能接受么？他似乎一下就明白了，连忙表示想通了，谢张哥，然后果断去报名了。


    这么一个简单的道理，我相信所有人都能明白，但是绝大部分人遇到类似这样的问题依然还是会犹豫不决，归根结底原因 fox，是绝大部分人都会有各种担心，担心不值、担心被骗等等，都想着有一种稳妥、无风险的解决方案最好不过了，但是，我想说的是，这也许就是你之所以会平庸的原因，绝大部分人都缺乏一种很重要的特质--冒险精神！


    可能有人会不信，觉得我按部就班的努力工作，不需要承担什么风险，依然可以过好自己的生活。


    的确，在这个时代，只要你能吃苦，愿意努力，你就可以凭借自己的双手让自己过上衣食无忧的生活，但是仅仅是衣食无忧而已，努力很重要，但是这个世界上努力的人太他妈多了，如果你只想靠单纯的努力就可以让自己有更大的成就、甚至跨越阶级，那是远远不够的。


    我们都意识到这么一个现象，现在的时代，穷人想出人头地越来越难，因为上流阶级享受到的资源太丰富了，穷人们凭借自己努力衣食无忧完全没问题，但是穷人们如果想跨越到上流阶级是难上加难，但是难不代表不可能，王健林、马云哪一个不是穷人出身，但是他们却冲破了阶级的束缚，到达了金字塔的顶端，他们凭借的是自己的努力么？当然不是，或者说远不止于此，本质上而是他们站在十字路口，看到了一些机会的时候敢于去搏，这也就是所谓的他们敢于冒险。


    王健林曾经说过这么一句话：清华北大，不如胆子大。这句话虽然不太恰当，但是反应了敢于冒险是每个成功人士必备的特质。我们中的很多人都在抱怨，自己没有遇上风口，没有生在马云那个时代，但是我要告诉你的是，时代的风口每年都有，但是等到机会真正到来的时候，大部分人都畏畏缩缩，没有几个人敢真正的去干。


    现实中的绝大部分人，做任何事总想着没有风险，最好是0风险，然而殊不知0风险也就意味着没有什么价值，这个世界上的回报总是伴随着风险的，风险越大，可能得到的回报越高，无数创业者所承受的风险是巨大的，然而正因为风险很大，一旦成功得到的回报也是巨大的，这也是为什么即使创业失败的越来越多，但是依然不缺少后来有新的创业者。


    说一个很现实的现象，我每每在公众号只要提及投资理财、ierul等字眼，总有一堆人在后台问我：这个有风险么？我从来没有回答过，在我看来，这个问题是很愚蠢的，投资怎么可能没有风险？你的钱放银行也都是有风险的，只是风险大小的问题，这个需要你自己去判断，要么是去查资料，要么相信我，都是一种自我判断力。'
