- pgno: 60
  md: '还有，早几年移动互联网刚起步的几年，流量红利时期，很多聪明的程序员就做了一些 App，集成一些广告，然后就躺着赚钱了，早期做的，而且还能赚到不少钱，再早几年的网站、博客等，拎点聚合内容，放点广告，都是属于「睡后」收入的方式。


    你会发现，「睡后」收入不一定可以赚大钱，但是只要你写的书火了，你做的 App 用的人多了，你做的课程口碑不错，有渠道帮你推荐宣传，那么这种方式赚钱很容易，后期你几乎不用再投入多少时间，真正是睡着就把钱给赚了，相比于出售时间来赚钱，「睡后」收入潜力很大，想象空间更大。


    除以上之外，还有一种适合所有人的「睡后」收入方式，这就是我之前一直跟大家普及的投资理财，投资理财说白了，就是用钱来帮你赚钱，仔细想想，那些有钱人之所以越来越有钱，就是因为他们懂得钱生钱，有人投资公司、有人玩股票、玩期货，有人买基金、理财、国债等，可能有些人一听我说投资理财就反感，过来的经验告诉你，投资理财真的很重要，而且这是每个人都可以增加「睡后」收入最简单直接的方式，就说一句，我这一两年内的理财与定投，可以让我少奋斗两年。不过，我们普通人是不具备金融方面的专业知识的，公开场合我不推荐大家玩一些高风险的投资品种，有兴趣的可以了解些基金和理财方面的知识，很值得去尝试下。。


    总之，如果大家想赚一些外快，优先推荐选择「睡后」收入的方式，其次再选择提升自己单位时间价格的方式，最后再选择堆时间来赚钱的方式，别看很可能一开始没多大差别，但是时间长了，你所选择的方式会导致差距千差万别。'
