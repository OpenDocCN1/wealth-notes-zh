- pgno: 56
  md: '实在有点后悔的，因为当初视频网站才刚起步，这块资源很缺乏，很多在线网站给我开的价格远比现在高的多，粗略估计，如果当时放弃了原则去做的话，做到现在，至少赚个4、5十万没问题，现在我名气越来越大，当时没做，现在就更不能去做了。


    但是，对于没有什么影响力的人来说，录制免费课程是个不错的选择，因为你们是按照时长收费，不用在乎自己的名气，也不用在乎会不会卖出去，录制完毕，质量还说的过去，收费就可以了。


    # 3. 写书


    写书除了可以积累影响力，其实也是一种赚钱的方法。一般来说写书不怎么挣钱，但是如果你的书销量不错，那还是能挣到钱的。


    通常来说一本书的版税在10%算高的了，就是说，假如你的书定价是79元，那么每卖出去一本，你可以赚到7块9，加上扣除几毛钱的税，一本书纯收入7块5没问题的，如果你卖出去5w册，那么你可以赚到37万5千块，是不是也不是一笔小数字？不过一般来说，技术书籍是卖不了这么多的，技术书籍能卖出去2w册算不错了，所以，写本书，赚十来万还是有的。


    但是有些有影响力的人，有自己的流量渠道，是可以卖出去很多的，透露个出版社的内部消息，不要外传，郭霖的「第一行代码」卖出去了6、7w多册，所以，你算下光靠这本书就赚了多少。郭霖的书之所以能卖出去这么多，一是这本书填补了市场空白，而且赶上移动互联网火热，加上我之前有个100w阅读的帖子推荐了这本书，所以能卖出去这么多不足为奇，不过写书确实不易，付出得到回报是郭霖应得的，而且也不是每本书都能有这么大的成绩的，能像郭霖这样卖这么火的书寥寥无几。


    写书这件事也很早一直有出版社联系我，因为出版社看中我本身自己的影响力与渠道来源，给我开各种丰厚的条件让我写书，了解我的人知道，我就不是个受约束的人，我喜欢自由，一旦答应写书，意味着可能一年的时间我几乎都得听从出版社安排，闷头写书，而且Android市场现在各个阶段的书也都饱和了，我写了，虽然靠我的影响力应该能卖出去不少，但是不能保证比别人写的好，我是坚决不愿意去做的的，为此，也确实又耽误了一些赚钱的机会，我公众号、微博、知乎、博客，加上圈内认识的一些好友，覆盖个20w粉丝应该没问题的，加上出版社的宣传与推广，保守估计卖出去个3、4w册应该没问题，但是写书这件事我还是很慎重的，不能为了赚钱，放弃了自己的原则，除非我能找到不错的主题，保证写的比较好，否则，我还是不做这件事。


    但是，对于一些工作有一定积累的同学，也许你没名气，没影响力，但是知识确实过硬，不妨够刻写本书，一是可以提升下自己的名气与影响力，二是出版社会帮你宣传与推广的，卖出去1、2w册应该没大问题，虽然不能发财，但是也能小赚一笔。


    # 4. 影响力'
