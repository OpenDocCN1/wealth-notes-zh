  md: '# 3.6 程序员如何培养第二技能


    > 之前的 中兴跳楼事件，我就告诫大家一定要培养第二技能，尤其是程序员，第二技能异常重要，有了第二技能才能避免中年危机。


    我为什么说程序员培养第二技能异常重要呢？


    想必大家都听过这么一句话，程序员都是吃青春饭。这句话虽然我不完全同意，但是不可否认的是如果你想一直写代码，你是很难写到 35 岁的，有人反驳了，国外谁谁谁写代码都写到
    50 岁呢，以特例来论证整体是不成熟智智的，我敢这么说，单纯的写代码，在国内能写到 35 岁的人极少数，也许你对代码有极大的热情，但是技术的变化实在太快，年轻的时候你有时间精力去学习新东西，但是年纪大了，你是心有余而力不足，你跟年轻人比学习是永远没法比的，而程序员恰恰需要一直不断的去学习，才能保证让自己的技术水平不至于滞后，所以程序员是吃青春饭的是有那么一点道理的。


    其实本质上来说，程序员的可积累性较差。


    什么意思呢？就是因为技术的升级变过太快，你需要保持不断的学习才行，想想以前的 Windows 桌面程序开发、网站开发、手机开发再到现在的人工智能，每一个时代基本都是大变过，有人反驳了，我以前做网站开发现在转行做手机开发不一样么？这当然可以，注意，我说的是可积累性较差，不代表完全没积累，程序员在技术框架、思维以及逻辑思维上确实是有积累的，但是在技能的积累上是比较差的，你从一个网站开发转到手机开发，意味着你要重新开始学习，意味着你以前积累的网站开发经验基本浪费了。


    这么说也许有人不太理解，但是举个例子大家就知道了。


    医生，大家都知道，肯定是我看的病人越多，积累的经验越丰富，我的技能越强，我的资历与待遇也越高的。


    律师，打过的官司越多，经验越丰富，同样自己越资深，也越被认同。


    演员，演的电影越多，演过的角色越多，积累的经验越丰富，同样自己的演技越好。


    弹钢琴的、唱歌的等等


    但是相比这些职业，程序员哪怕你之前做了十年的 PC 桌面程序开发，到了移动互联网时代，人工智能时代，你的编程经验虽说会有些帮助，但是相比较于十年的付出，你的技能的积累性太差了，远远不值。


    有人说了，那我以后转管理岗，先不说成功转型的永远是少数，我指的单单是技能积累这块，如果说转管理岗，医生可以升院长呢，律师可以升事务所呢，演员可以当导演、升工作室自己当老板等等。


    所以，两三年前，我就想通了，有了这样的认知，所以我才决定要坚持写作分享的。'
