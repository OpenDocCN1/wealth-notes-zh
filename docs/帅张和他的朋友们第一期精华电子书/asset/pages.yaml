  md: '# 4.1 初入职场，认真对待每件小事


    > 中国有句俗话：细节决定成败。初入职场，认真对待每件小事，一次由星球村民引发的思考。


    给大家说件小事，前几天不是有人加我微信续约加不上么，然后我让他们私信我微信 id，我来加他们。


    大部分球友发给我的都是这样的：


    张哥你好，这是我的微信 id：xxxxxxxxxx，麻烦张哥了。


    这种有没有问题？语气也很客气，看似是没问题的。


    但是有個別两个球友发给我这样的：


    xxxxxxxx


    张哥，上面是我的微信 id，张哥有时间加一下。


    下面的这种明显想到了我的操作步骤，方便我直接粘贴查找，这跟你语气怎么样，客不客气完全两码事，他想到了我的下一步操作场景，把 id 单独发出来，方便我复制。


    其实就是这么一件小事，反应了一些人做事的细致，在职场中其实没有什么诀窍，就是把每一件小事做到极致就好。


    之前有个问题问，我是怎么一步步从一个不起眼的小程序员走到现在这个位置的？取得老板信任的？


    我记得我跟老板打交道的时候，从未让老板操作任何心思，印象中有一一次老板问我们是咋科学上网的，周围的人都跟他解释说用什么什么，怎么怎么操作，我自己默默的把所有流程整理好，确保自己弄清楚了，然后把老板手机和电脑全都配置好了。


    还有一次老板晚上十二点多问我要个数据，本来不归我管的，但是那个负责数据的人睡了，其实不是很急，但是老板就想着顺便问下我知不知道，我是已经躺床上了，但是我立马就起来打开电脑，把数据搞出来，还整理成一个格式，方便在手机上阅读，折腾了半个多小时才给到老板。


    类似的事情还有很多，多到我都记不得了，可以说老板之所以信任我，就是因为在一次次的跟我打交道中，交代我办的事我全都一丝不苟搞定了，而且连后续都帮老板想好了，从没让老板操半点心，这才一点一滴积累了老板对我的信任与高看。


    这不是为人处世多么圆滑，而是告诉大家，职场中你有这种做事的态度，有多想一步的意识，确保每件事都做的漂亮，那么你的信任，你做出的成就，总会慢慢积累起来，总有一天是会引起别人注意，总有一天是会脱颖而出的。'
