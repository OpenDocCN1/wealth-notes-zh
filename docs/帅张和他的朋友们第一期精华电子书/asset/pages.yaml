    所以，道理就是，当你在工作的时候，学习利用工作时间去学习，也许你工作很忙，但是以我过来人的经验，不管你工作时长 8 小时还是 9 小时，一个人集中精力、全神贯注工作的时间每天能有
    4、5 个小时就已经相当高效了，而其余时间你再干嘛？要么跳出来刷刷微博、看看新闻、聊聊 qq 等等，别说你不是，这不是偷懒，这是一个正常的工作现象，任谁也不可能一直全神贯注的工作，有松有驰是一个高效的工作状态。但是你仔细算一下，除了高效工作的那几个小时，其余时间如果你每天都能利用上的话，这会是一个多么宝贵的时间，这可是所谓的带薪学习，一举两得的事。


    我反正工作至今，都很擅长在工作的时候主动学习，别人在闲聊、刷微博的时候，我都是去 GitHub 看下最近有啥好的开源项目，最近有什么新的技术，又或者去写篇博客，我心里一直想着这种学习时间非常宝贵，在学习吸收到知识的同时，最好还能为现在的项目服务，那更是一举多得的事了。


    所以，学会利用工作时间学习，毕竟让你下班回家单独学习，我想你很难坚持，只有少部分人可以做到，但是好好利用工作时间的学习机会，时间长了，依然可以有很大的提升，而且这可是带薪学习啊。'
