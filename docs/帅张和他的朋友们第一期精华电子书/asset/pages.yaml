  md: '# 5.3 知识星球第一期年度总结


    马上就到春节了，看了下时间表，春节假期回来之后的几天，第一期星球就到期了，所以算下来，本周算是我陪伴第一期球友渡过的最后一个完整周了，姑且给大家来个星球的年终总结吧。


    1. 一年的时间说长不长，说短不短，但是没想到眨眼就过去了，想起当初我开知识星球的时候，我预判付费阅读一定会是未来的趋势，我坚信自己的判断，所以几乎毫无犹豫的开了自己的知识星球，通过自己的搜索与研究，逐渐的找到了属于自己的一条路，回首这一年的时光，我在这里的付出与坚持，大家有目共睹，能取得如此巨大的成就，在星球创立之初我自己是都没有预料到的，当初我的自学编程之路，我的坚持与拼搏影响了一批人，知识星球，我想是我又一次凭借自己的坚持与付出影响了大家，我又一次用实际经历向大家证明了，抱对的事情坚持下去，其实就离成功不远了。


    2. 不过很多人只看到了最终的成就，然而殊不知，这中间遭受了多少非议，鲁迅说过：第一个吃螃蟹的人是令人佩服的，不是勇士谁敢去吃它呢？我深深的体会到了这句话的含义，我是一个做技术的，然而摇身一变，去公众号写作去了，又摇身一变，开了自己的知识星球，别看现在付费阅读越来越多的被人接受，但是在16年底的时候，在我刚创建知识星球的时候，一大堆人都在骂我骗子，骂我圈钱，尤其很多所谓的的
    技术大牛，说我败坏圈子风气，也因此在技术圈不受一些人的待见，现在虽然说起来比较轻松，但是你们能想象我当时承受的压力么？甚至在一开始，我媳妇都劝我放弃，说咱不搞这个好了，每天有人骂你，看着她也心疼。但是我的性格是比较偏执的，我认定的正确的事
    情，无论如何不会轻易放弃的，有越来越多的人骂我，我就一定要证明我是的对的，顶着这么多人的谩骂与质疑，我愣是坚持过来了，现在越来越多 人已经接受了付费阅读的观念
    了，也 有 越来越多的技术人开始学习我开了自己的知识星球了，也 有越来越多的技术人开始学习我写公众号了，甚至连风格与排版都在模仿我，我很欣慰，我应该算得上是第一个吃螃蟹的人，我自认为自己还算勇士，我的这个实际经历想告诉大家第二个道理，要勇于做第一个吃螃蟹的人，哪怕会有质疑与谩骂，但是你要坚定自己的判断，第一个吃螃蟹的人才有可能抓住最大的机会。


    3. 一开始的时候很多人都问我，是不是在我的星球里可以学到技术啊？我从一开始就不把自己的星球定位于技术，因为我知道，身为一个技术人，做技术是你的本职工作，哪怕没有我，你也可以找到一万种方法可以提升自己技术的，但是我的个人经历比较特殊，从职业上来讲，我从一个在普通不过的底层程序员成长为公司的核心骨干与高管，跟着老板接触产品、投资、商业等，而且自己又做自媒体，有机会接触了很多各个圈中的大佬，我深知以前只做程序员的我视野真是太狭隘了，思維真是太受限了，见识也是太浅薄了，所以，我的星球是想给大家分享一些你们从事程序员根本没机会接触到的思维与认知，我自己说过一句话，真正能改变命运的从来不是努力，而是认知，努力固然很重要，但是努力是成功的必要条件而不是充分条件，而一旦你的认知打开，你做事的方式与考虑问题的角度则会影响你一辈子，所谓成长，就是认知升级，这是我深有感触的，也是想要传递给你们的第三个观念。'
