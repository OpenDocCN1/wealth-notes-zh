  md: '# 2.7 人人都要懂点投资理财


    > 投资理财非常重要，人人应该懂点。


    # 1. 投资理财概念


    我以一个过来人的角度告诉大家，投资理财非常重要，很多人总以为自己当下没多少存款，就对投资完全不 care，其实这是错误想法，当你存款 1w 的时候不去投资理财，不去尝试，那么当你有存款
    10w、100w 的时候你会很后悔，资金是需要积累的，但是这些金融知识完全可以提前学习了解。


    投资理财其实可以简单的分为两类，一种是投资，一种是理财。


    投资可以认为是高风险、高回报，比如股票、债券、黄金、期货、甚至最近比较火的比特币等等，这种风险非常高，但是同时伴随着收益也很高，对于不懂行的大家，我不推荐大家接触这类高风险、高收益的品种，但是我不反对这类玩这类品种，我是个爱冒险的人，实话说，这类投资我有玩过，大家都是成年人，你应该懂得控制风险，能为自己的行为负起责就好了。


    理财类的就简单多了，市面上一大堆理财产品，余额宝、银行以及互联网金融产品，这类就风险很低，如果找到靠谱的平台可能说是 0 风险，但是风险极低，同时也就伴随着收益很低，一般年收益能达到
    10% 就很不错了，超过 10% 的理财产品就要小心了。


    我知道可能会有人问为什么我这次推荐的友金所号称年化 12% 的收益，请仔细看清楚，那是新手收益 12%，只有一个月的时 间，而且限额 2w，如果友金所不限额直接放开一年，那他要亏死了，所以不要看到
    12% 就觉得不靠谱，请看清楚条件，这次我看到很多人注册之后只投了 100 块，真是可惜了，也就只有这一次有这么高的利率了。


    很多人都把自己的钱存放在余额宝或者银行卡，其实上面的利率真是太低了，我自己的钱，银行卡和余额宝放的很少，只预留一些应急资金，我强烈建议大家把闲置资金用来买买理财，虽然不能让你发财，但是在通货如此膨胀的今天，理财可以尽量的让自己的资产保值。


    理财平台很多，我知道大家怕老板跑路而不敢尝试，其实在我看来，不敢尝试永远会错失比别人更多的机会，如果大家要买理财的话，建议大家选择陆金所和友金所，绝不是广告，陆金所是平安旗下的，除非平安倒闭，否则完全没问题，友金所是用友网络旗下的，而且也跟平安银行建立合作，就是说你投资的钱其实是放在平安银行账户下的，即使友金所和陆金所倒闭，你的钱也是安全的。


    这次是我跟友金所做了很大的争取，给入圈的朋友做了补贴，临时做的一个活动，通过这次活动进来的真是赶上了，这么大的福利很多人还骂我，我真是无语了，另外，没赶上这次活动之前就入圈的圈友们，我不知道以后还会不会有别的活动，如果还没注册友金所的，那么可以先等等看，看之后还会不会有别的活动给你们。'
