  md: '# 2.3 贫困不是你的资本


    > 贫困可以限制你的想象力，但它并不是你的资本。


    我这人做事有很强的原则，我比较讨厌这种人，或者说是鄙视吧，就是跟别人讨论问题、跟别人谈判条件的时候，以自己家庭情况、贫困背景为资本，妄图博取同情，来换来一些东西。


    真的，我骨子里看不起这种人，也许有人会认为我偏执，但是这就是我真实的态度，也许可能跟我的个人经历有关吧。


    很多人知道我以前的奋斗经历，我在最困难、难到吃不饱饭的时候，都不会向家里说半个不字，也从来没有问同学、朋友借钱，更不可能吃饭的时候跟老板说，我吃不起饭了，能不能给我便宜点。


    我现在有影响力了，我在公号帮过很多人捐款，我自己也会尽我所能帮这个社会做点什么，但是我从来不在公号要求大家帮我自己筹款，更没有向大家民乞，我公众号的赞赏、知识星球赚的钱，我从来都认为我是靠个人能力赚来的钱，这些钱我赚的心安理得，而且我也从没有否认过我做这些是为了赚钱，不能赚钱......我去做这些事呢。


    之前公号有不少读者给我留言，很多 𝚣人和说法是自己是个穷学生，没有多少钱，可否给他便宜点，对于这类信息，我从来都是忽略，因为，我认为贫困不是一个人的谈判条件，你该自己想办法去解决，而不是想着可以有特殊对待。


    但是你们知道吗？这次 199 续约，也有不少穷学生续约，印象比较深刻的是，有一位读者给我说，他是穷学生，这周生活费快没了，他剩余资金仅剩 200 了，下周才会问家里要生活费，问我可否先支付
    150，留 50 块吃饭，下周他问家里要钱了再补，因为人太多，我没有及时回复，他可能觉得不太好意思，还是咬牙给我转了 199，等排到他的时候，我看到这条信息，领了红包，然后给他发了一个
    66.66 的红包，我说拿去吃饭，不用还了，我非常欣赏这种做法，哪怕穷的吃不起饭了，但是也不会以此寻求优惠，但是这位球友仍然表示后面拿到钱一定会归还，说实话，我不是那么在意，但是我相信这种人会说到做到。这位球友应该在这里，虽然我不知道你是哪位，但是我必须公开表达下对你的认可。


    还有的球友私信我说这个月没钱了，给我私信，希望争取分期支付，分两次或者三次付清，真的，对于这种请求，我看到了，基本都直接同意了，我也不知道有多少人欠我钱的，因为我相信这部分人，他们在最困难的时候没有放弃尊严，没有寻求特殊对待，他们之后有钱了你觉得会不记得这件事么？


    所以，那些因为自己穷，私下里问我能不能便宜些的留言，我从来不会回复，因为我懒得花时间给你解释，这里有不少学生因为涨价到 199 而续约不起的，即使他们很想续约，但是因为经济问题也从未要求我给他特殊对待，我很欣赏这部分人，哪怕你不续约，也比那些因为贫困不是你的资本。'
