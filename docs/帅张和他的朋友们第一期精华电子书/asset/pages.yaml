  md: '# 4.6 高级工程师的标准


    高级工程师的武林秘籍


    为什么你觉得自己还达不到高级的标准？


    前段时间我面试，其中面试了一位 5 年工作经验的同学了，我问了他这么一个问题：你觉得你的技术现在是什么级别？初级、中级 or 高级？


    他思考了下，回答说：中级偏上，还达不到高级。


    我问他，那你工作 5 年了你觉得还达不到高级的标准，是哪方面比较薄弱呢？


    他自己也说不出来。


    其实他工作 5 年，技术是还可以的，各方面技能算是比较全面，但是在我看来，他没有一个擅长的地方。


    是的，高级工程师起码在某一领域比较擅长，比如插件化、音视频、动画、热修复、架构等等，不需要每个领域都精通，最起码在一个领域有所深入研究与实践。


    很多人都说大公司的人就是螺丝钉，一直在某一领域研究，但是其他领域接触的相对较少，而小公司的人则大多比较全面些，但是缺乏某一领域的深入研究。所以，如果你是这两种人才的交集，技术面比较广的同时，还能在某一领域深入研究，毫无疑问，你会有竞争力，你也就是别人口中的高级人才。


    所以，我建议大家，如果你在公司工作，全面发展的同时，也要选择某一领域进行深入研究，最好是这个领域就是你目前所在公司的关键核心技术点，因为深入研究某一领域的同时，你已经慢慢成长为公司不可替代的人才了，一举两得的事，如果你们公司是个重视用户体验重视设计的公司，那就把
    UI、动画做深，如果你们公司是搞直播的，就把直播技术吃透，如果你们是视频网站，那就把音视频编解码技术做深入研究，如果你对热修复技术感兴趣，那就把热修复的原理、市面上一些方案吃透，并且应用在你们的产品中，等等等之类的。


    你可能工作了 5 年，甚至更长，但是当别人问你最擅长哪方面的时候，你不能很好的回答这个问题，很可能就是你认为自己还达不到高级人才的原因。'
  merge: -1
