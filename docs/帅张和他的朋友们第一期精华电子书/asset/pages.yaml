  md: '# 3.5 程序员如何提升编程真本领


    > 来自匿名球友的提问：「做 Android 开发两年了，大都是使用 Google 以及 GitHub 上一些开源项目拼凑完成的，感觉自己没什么真正的本事。」


    前面有人说道：做 Android 开发两年了，大都是使用 Google 以及 GitHub 上一些开源项目拼凑完成的，感觉自己没什么真正的本事，这个问题我觉得是个普遍现象，所以这里统一给大家解答下。


    # 1. 解决问题是工作的首要目标


    不管你是用 Google 也好，还是 GitHub，还是请教别人，还是摸索出来的，总之，能解决问题，就是一名称职的员工，这是一项能力，而且是不可多得的能力，我甚至鼓励大家要多使用
    Google，多使用 GitHub，在解决一个个的问题过程中，你的能力其实在不自不觉中在提高。


    # 2. 为什么总觉得自己没什么进步


    我之前说过，只要你埋头工作，多做项目，你的能力一定会随着时间提高的，但是这是有时时间周期的，最多也就在工作的前两年左右，你会觉得有进步，但是紧接着，你会发现，不管你再怎么努力工作，你就没这么感觉了，所以这个时候就要适当的进行系统性的学习了。


    举个例子，我们开发中会使用各种开源项目，一开始只要会用，能解决你项目的问题，这就 ok 了，但是你不应该只满足于只会用，你要有了解其原理，阅读其源码的好奇心，不追求使
    用的每个项目都要花时间阅读源码，只需要有针对性的阅读 1、2 个开源项目就行了，我知道，这在一开始会很难，你会不知如何下手，会看不懂，没关系，就针对这一两个项目，硬
    着头皮去看，即使看不懂，也要追求把整个项目都看一遍，看完一遍看不懂，再看第二遍， 还看不懂，再第三遍...第四遍，逐渐的你会发现，你好像能看懂一点了，然后你大概知道他的
    原理了，也理解了源码实现的一些设计上的精妙之处，这期间，别贪，就扛着这一个项目 看，看懂了，再有针对性的去看第二个项目，慢慢的，你会发现，你的进步会比努力工作的
    那个阶段更快。


    所以，最初阶段，多使用开源项目解决问题是没问题的，因为一是你没能力，二是即使有能 力，你也无法每使用一个开源项目都有精力弄懂其原理，只要有针对性的抓住一两个你感兴
    趣，并且对你的技能互补的开源项目研究下，后面只会越来越顺。


    # 3. 系统性的补习基础知识


    我相信大部分人一开始从事开发职业，其实都还没怎么搞清楚状况就进入这个行业了，可以说 是在懵懂的状态下工作的，我们会利用各种搜索引擎、工具帮我们解决问题，但是等我们到
    了一个阶段，会发现你的基础知识不足，因为我们在进入工作之前还没有进入系统性的学'
