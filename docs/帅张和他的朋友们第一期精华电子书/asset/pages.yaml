  md: '但是股票市场有个 28 原则，就是永远是 20% 的赚钱，80% 的亏钱，加上风险很大，又需要很多的专业知识，所以我不会公开推荐给大部分人，但是我不抵触有人玩股票，大家都是成年人，取决于你自己，你自己只要能承担这个风险就好。


    数字货币这两年大火，尤其是比特币，我对数字货币的看法跟股票类似，不推荐不抵触，自己去选择就好。很多人问我对数字货币的看法，因为数字货币有些国家承认，有些国家抵触，有些国家睁只眼闭只眼，所以政策性因素我觉得是它最大的风险，其次就是技术问题，毕竟数字货币依赖于区块链技术，之后是否有漏洞也是一个隐患。不过长期来看，毕竟比特币是一种全球货币，只要不是所有国家全部抵触它就有发挥的空间，加上任何技术其实都有漏洞，漏洞发现之后，只要有解决方案就好，所以，长期来看，我觉得比特币还有上涨空间，不过这只是我个人的看法，我同样不建议不抵触大家去玩比特币，至于一些比特币衍生出来一堆山寨币不建议大家去玩，这就好比房子一样，要炒肯不炒一线城市的房子，即使崩盘了，一线城市的房子会更抗跌。


    +   我自己的投资理财经验


    有人问，我自己在玩哪些？其实以上品种我都有玩过。我也有部分资金在友金所理财，也玩股票，A股美股都玩，也买过比特币，我一是在尝试学习，二也是根据自己的风险承受能力再分散投资，股票我大亏过，也大赚过，现在总体还在小亏。比特币我也买过，我最早买比特币的时候才几美元，那时候才刚出来没多久，跟一个同事我俩拆腾着玩的，但是那时候根本啥都不懂，完全把它当成游戏币的，根本没有投资的意思，花几百块买了十几枚，后面翻倍了就卖掉了，之后就专心工作，不怎么关注了，等再关注的时候，比特币已经突破
    1000 美元了，然后再也不敢买了，如果当初的十几枚不卖掉，现在也能赚不少，你问我后悔么？不后悔，毕竟当时什么都不懂，根本没想过投资，就是拿来玩伴的，没有那个意识，自然没有那份幸运。


    所以之后，我才有这种投资理财的意识，才会这么乐于关注新鲜事物，愿意尝试、愿意接受新东西，也才给大家普及下，投资理财一定要趁早，最起码这种意识一定要早点养成。


    +   一种稳定赚钱的策略


    虽然投资理财很难，但是这年的经验我也总结出一条稳定赚钱的策略，就是：定投策略。


    大家都知道房价很夸张，这些年房子疯长，然而其实这些年一些公司的股票涨幅超过房价的不少，我之前说了，不建议大家炒股，因为股票风险很大，亏的多，那是因为大部分人炒股是抱着一种赚快钱的心态去玩的，如果你把心态放好，时间周期拉长，那么也是有一些好公司的股票值得去买的。


    这里有个最简单的投资逻辑，当你身边的人一直都在用 QQ、微信，都在玩王者荣耀，生活、关系都离不开腾讯了，那么你告诉我腾讯这样的公司会不会一直赚钱？如果一家一直赚钱的公司，人们的生活都离不开他，你告诉我，公司股票有什么理由不涨？何况通货膨胀，这些公司的市值最起码得跑赢通货膨胀吧？只不过腾讯的股票，每天涨涨跌跌，很多人拿不住而已，如果你以年为单位，看下腾讯这几年股票的涨幅，稳稳的跑赢房价涨幅。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '同样的逻辑，如果人工智能是未来的话，那么 Google 毫无疑问就是人工智能的领头兵，自动驾驶、AI 机器人、物联网各种关于人类未来的研究、等等等，随便哪一项成功了不是改变时代的？如果
    Google 引领时代的话，那么 Google 的股票凭什么不涨？


    所以，所谓的定投就是找到有潜力的公司，每月拿出你工资的一部分，比如十分之一，如果你工资 1w，每月就拿 1k 块买点这类公司的股票，买完之后不用在乎涨跌，完全忘记这回事，就每月按时操作就行了，激进点的，风险承受能力高的，就可以适当的买点，但是一定严格遵守策略，无论涨跌，都不要在意，5
    年之后，10 年之后再去看，如果不赚钱，你来找我，到时候你可能会突然发现，竟然无缘无故多么这么大一笔资金。


    有人说，我这么做了么？我之前就尝试过这种，而且这种方式确实让我赚到钱了，我买的腾讯的股票，弥补了其他方面的一些亏损，可惜的是，我当时媳妇怀孕，必须要买车了，而且买车的时候急用钱全都给卖了，那次定投就暂停了，如果当时还能继续坚持下去，我能赚不少。现在也算涨了个教训，这类投资除非万不得已，尽量不要去动这笔钱。我还会找机会，继续执行这种策略的。


    满足这种条件的大公司大概有：Google、Facebook、Amazon、Tencent、Alibaba，最看好 Google 和 Tencent，至于如何买美股和港股，网上垂直教程，我相信你如果想的话是可以搞的定的。不过这类现在股价很高，买
    100 股就需要不少钱了，但是 5 年之后，我敢保证这些股票肯定还会涨，国内的一些公司潜力也很大，比如茅台、伊利、格力、美的等，但是 A 股不成熟，受政策性因素影响太大，想定投的还是优先美股还是第一选择。


    有人问了？就这么简单，为什么其他人不要去做呢？那是因为绝大部分人心态放不平，买完之后就没事看看盘，只要看盘，每天的涨涨跌跌肯定会影响，要么大部人等不了这个时间周期，要么中间有事，急用钱，比如之前的我，要么几个月不涨，就急了，耐不住性子。所以，虽然是很简单的策略，但是很少人能按照原则坚定的执行。


    +   • 最大的投资


    我之所以不推荐大家玩股票，一方面风险太大，另一方面是很多人一玩上之后总觉得自己是那 20%，然后投入了很多时间与精力在这上面，最后导致本职能力没有进步甚至荒废，这是我最不愿意看到的。


    其实，最大的投资，是投资自己。要知道哪怕你一年到头折腾，即使赚了点钱，但是如果花费了太多的时间与精力也是不值的，把时间花在你本职能力的提高上，未来的工资涨幅，发挥空间，要大的多的多。而我之所以推荐想投资的同学，去定投，就是因为定投也不用花费大家时间，你也不需要多么懂，就按照原则傻瓜式的执行就好了，越是自以为自己很懂的人，越看不上定投，定投适合那些小白用户，而往往可能也是投入产出比最高的一种策略。


    # 总结


    以上给大家普及了下投资理财的概念与意识，过来说人的经验，一定要尽早有这种意识，这会增加你对钱的敏感性，再碰到一些机会的时候你会更容易抓住，而且如果可以耐得住寂寞，除了理财之外，定投也是一个很不错的策略，但是不建议大家在这方面花费特别大的精力，'
