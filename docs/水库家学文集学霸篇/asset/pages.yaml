  md: '豫鲁也有。他们对考试有非常成熟的打法，超级重视教育。这是他们改变命 运的唯一武器，肯定会子子孙孙代代传。虽然外来中产现金收入高，但是没 房子，大部分收入拿去买房了，结余不多，日子也紧巴巴的。


