    你要学会举一反三 找到不同和相同的规律。高中要靠思维吃饭了。


    初中学的知识少。初中一个星期学的内容 高中一两天就学完了。高中基本上 讲讲 知识 很快就做题。做的同步题 就是学校发的同步练习册。一个畜节也就 10 ~ 15
