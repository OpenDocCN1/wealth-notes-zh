- pgno: 294
  md: '# **11.12没有笨孩子， 他做不出来是因为..**


    有孩子认为， 概念 定理弄懂就行了。 作业也不好做， 错了抄个答案就完事儿。 因此理解的很浅， 很快就忘。 脑海中快速链接没有建立起来。


    有的孩子听话照做大量的基础练习， 脑海中快速链接得以建立。 例如：

    一见某条件就列公式 一贝两相似式子就相比。


    再难的题， 也是由简单题堆砌的。 当再碰到中档题 难题时，没练的小孩儿， 就在脑海中建立不起这个 ‘ 快速链接 ” 来。 如同爬 6 阶梯子， 没快速链接的孩子，
    看不到梯子的前三阶。 感觉 ‘ 题好难， 想不出来 ”， 而家长会误认为， 是不是孩子 ‘笨 ” ?


    脑海中有通过基础题建立的 ‘ 快速链接 ”， 就能迅速帮孩子想起难题前的一些步骤。 即， 难题前的铺垫思路。


    完成前面步骤的书写后， 脑瓜儿再检索之前与这种相似的题型。 若有，回忆当时这种题型是咋做的。 这就是所谓 ‘好学生” 的 “聪明”。


    简单的东西， 在一开始学也要大量练。 如学车时： (1) 上车， 系安全革， 词整座椅 (2) 快踩离合至底， 挂 1 档 (3) 打左灯， 看周围， 松手刹
    (4) 慢抬离合， 至半联动， 车头抬起颤动 慢加油门， 左打方向盘， 车启动。


    就这么一连串简单动作， 家长在驾校时， 练了无数遍， 以至于现在开车， 这些都是下意识的动作。 家长若不知怎么辅导孩子学习， 就回忆自己当时怎么学车即可。
    道理亦然！'
