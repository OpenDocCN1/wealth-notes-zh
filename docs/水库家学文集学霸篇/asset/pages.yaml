- pgno: 125
  md: '级的，电脑作业，电脑批卷，你爱学不学。高考中考成绩，是家长的事情，老师只管孩子不要在校园内摔伤流血，其他无所谓。所谓家访，其实就是去看看孩子家里经济条件和父母情况。


    美国公立学校也是这样，但是美国的失业福利较好，所以还可以维持平稳。我们这些孩子，将来赚钱能力不行，平富心态强烈，仇富心理 xx，以后可怎么办啊？


    和一个小学数学老师聊了几句。他说，一年级下学期，数学考试，分数就拉开了。各位家长要提前准备。 大家可能已经不知道，现在的小学数学题是什么样子了。我建议你先去看两眼。说实话，最后几个题目，我都要想一想才敢答题。


    孩子对表扬不感兴趣，他们对胜利才感兴趣。最好是无情碾压了班上的同学，那才是最大的快乐。就好像你超过了邻居家的三好学生，你爸妈简直是要乐翻天了。


    我问了邻居家的小学生，她说，就算是在优质小学，到了二年级，高中低成绩也明显分层了，有的孩子就掉到七八十分了，有的还是双百分。大部分原因是父母家庭矛盾造成的，没人管了，孩子也就读不下去了。我奉劝男人，出轨了也不要马上离婚，假装没事儿，不能影响孩子前途啊。'
