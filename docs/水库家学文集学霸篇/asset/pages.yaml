  md: '# **11.16学习提分考试这点事儿， 就是这几句话**


    孩子们， 快考试了， 写几句话给你。


    只要你愿做好你的工作， 你每天的生活一定是紧张、 忙碌。 现在， 学习就是你的工作， 分数就是你的业绩！ 永远有80%的人在疲于应付， 永远有20%的人在积极向上！


    孩子们， 你们的目标就是要成为那20%。


    成功与否，这完全取决于你内心的那股火。享受努力奋斗的过程，享受成功之后内心的幸福和安逸，这就是积极向上的人生。


    若你想考60~70分， 你的目标应该是80~90分。 若你想考90分， 你的目标应该是100分。 不要告诉我不可能。 只要你想， 一切皆有可能。 谁都有梦想和目标，
    就看实现它们的态度。


    按美国Ted演讲叫''坚毅'', 其实是一回事!


    中高考是选拔性考试， 即100人中， 小于30人能进重点。 要想名列前茅，你的思想、行为一定要与大多数人不一样。


    选拔性考试， 意味着你晚上要躺在床上， 好好想想， 你凭什么能超过大多数人，而跑到他们前面？


    大多数人坚持不下来的事儿， 你要坚持下来。


    大多数人课堂记的笔记， 从来不看， 你要认真复习。


    提分的本质是补短板， 在学习中是改错题。 改错题本身''逆人性''。 小学生体现得更明显。 考差的卷子， 从来不看， 塞书包最里面。


    大多数人看错题时， 老师讲过一遍， 听懂了， 就再也不看了。 从人性角度看， 最容易被超。 谁都不愿去看自己痛苦的地方。'
