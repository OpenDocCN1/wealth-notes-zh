  md: '卧槽，这下子，辈生的新仇旧恨都来了。打架不为钱，纯泄愤。差生专找你带女朋友出来的时候。差生之间还抱团。今天，我帮你出气，明天，你帮我去打。优生很倒霉，常常是被一群人围殴。我也被围殴过，没办法。工作后，都是成年人了。那时候，上海开始拆迁多了，买房多了，互相就散了。打架基本没了。


