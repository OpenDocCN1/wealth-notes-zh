    （5）有棍棒，必有糖果。先大致问一下，例如：物理一个半小时能完成吗？英语 50 分钟能写完吗？全部作业 10 点前，能写完吗？


    写完后省下的 1 小时，可以玩手机，可以和狐朋狗友聊天，手机游戏也行，用鼻子顶手机再拿大顶也行，1 小时冲 6 个澡也行，孩子随意安排，是孩子自己的爱好就行。


    或提前写完作业的孩子，可获得爸爸的浓郁法式胡茬香吻，有猪肉大葱味的，有韭菜鸡蛋味的，有茴香肉丁味的任君选择


    （6）所有能 10 点前写完作业的学霸孩子，都有一个共同特点，就是在学校课间的时候，就开始写了。


