  md: '而为，确保对方把第一次合作干好，保证了你对外的信誉。完成后，观察合作方的态度。


    **如果他觉得，他拿六是正经意义的，那就点到为止了。**


    如果我觉得，下次应该看贡献分成，说明人品靠谱，值得交往。就我自己来说，我对孩子投入那么多心血，不是为了培养一个很会占便宜的聪明小人。我的一生，都是为了孩子将来在更大的舞台上竞争一次，哪怕失败，也值了。这种高段位的竞争，基本不看聪明了，而是看你对利益的态度。你每次分
    30%，你可能会有 100 次机会，你每次分 70%，你就没有下次了。你对人宽厚，人家心里都懂的。


    **刚毕业的大学生 99%的人写简历=获奖汇总，毫无意义。**如果你是去求职（不是猎头主动找你），你要明白，任何单位都不缺情怀和总裁，他们只要两类人：老黄牛，拉单子。其他都是废话。你啰啰唆唆写了这么多自我表扬的话，没用的。如果你实在要显摆一下，可以放在最后。你去面试也简单，要么干一个实例，要么自带客户。


    **如果你是在校的学生，珍惜现在的美好时光，珍惜爱情，珍惜身体。**不要为了一点小事请假发脾气。大学这段时光，将是你人生中无法磨灭的印记，即'
