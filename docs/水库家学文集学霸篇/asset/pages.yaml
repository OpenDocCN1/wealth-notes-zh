- pgno: 9
  md: '# 1.2教育周期


    # 我不主张幼儿提前教育


    我在生活中，尽可能避免提前教育。孩子提问，我耐心解答，但我不会一本正经的安排计划。孩子怎么搞，我都不管。我的任务是，满足孩子对大自然的好奇心。孩子想知道什么，我就查资料，用最简单的话答复问题。


    儿童的大脑发育是有客观规律的，提前两年死记硬背一些单词和认字，并不会让你的孩子获得超人的智慧，只是破坏了成长规律，耽误了其他部分的发育。我不知道儿童脑力发育的具体细节，但是我们对大自然还是要有一些敬畏。什么年龄做什么事情。


    大棚蔬菜颠倒了生长阶段，只不过是一时的惊艳，实际上不好吃。我小学读书也一般。我们班上有个教师子女，一年级是语文数学双满分。但到了初中就是中下水平了。因为这个同学的小学成绩都是激素催的，不是自然思维的结果。到了初中，需要自己解决问题的时候，他就没办法了。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 1.3读书重要性


    读书分两种，读厚，读薄。


    读厚，就是大量的做笔记，写总结，适合今后去当教授，做院长，吹牛逼。


    读薄，就是掌握思想，今后做老板，你骗不了我就行了。


    读书为什么？读书为了“学以致用”，不是最后去北京开出租。


    我读过的书，包括金融法律税务塑料桶，都是为了实战。要读就好好读，读出书本背后的含义。人的精力有限，看看闲书可以，但不要沉迷于闲书。我为了搞清楚一个细节，经常查阅大量论文和规定规范，这才是读书态度。当然，买了房就可以不读了。


    读书，是为了快乐，为了谋生，而不是去碾压同学，谋取利益。


    很多人说，高考是最公平的。这完全是幻觉。最公平的是宽进严出，考及格了，就给你文凭。清北80%的课程，不需要做复杂昂贵的实验，把老师的课堂教学直播出来，大家一起学，就可以了。特别是数学系，理论物理，有个鸟的实验？'
  merge: -1
  img_proc: true
- pgno: 11
  md: '我们现在的孩子，功利性太强了。他们不都喜欢学习，更多的是喜欢碾压别人，获取利益。我多考了 10 分，可以去清北，可能我也不喜欢这个专业，但我最大的快乐是剥夺了你聆听大师课程的机会。


    # 这个公平吗？


    机械系读了四年，连个门锁也不会修，连个火花塞也不会换，到了工厂，跟个 250 一样。而且，他们绝大多数转行了，大量的教育经费被无谓消耗了。这对社会公平吗？


    高考，是零和游戏，我占了这个坑，你就没了。为什么不把优秀的课程直播出来呢？大家一起学！我们的教育，不应该是为了碾压别人，而应该是追求科学，鼓励那些真正喜欢的人去学习。以我的观察，相当一部分大学生，并


    不喜欢自己的专业，学习兴趣也不大，只是


    为了搞个京沪户口去考博，找个正式编制去考研。有必要吗？


    毕业后考编制，是成年人的游戏，另外考一场就是了。不要去折腾孩子啊！'
