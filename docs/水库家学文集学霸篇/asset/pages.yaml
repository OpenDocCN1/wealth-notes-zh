- pgno: 115
  md: '我家孩子才上幼儿园，从小到大都是豪宅保姆，我一直担心孩子长大了变蠢材。最近发现，孩子学会了各种底层生存技能，偷骗哄，说瞎话，假装不知道，和别人使眼色，打配合，偷摘小区的橘子树，骗其他孩子的棒棒糖。我一查发现，都是保姆教的，我实在是惊喜万分。


    刚才和我老婆聊了一会八卦。我家的娃，进了幼儿园半年，已经学坏了，越来越会胡扯了。当面一套，背后一套。小小年纪，比我小时候还会吹。明明是前几名，回来说是第一名。我说明天去问老师，这才认怂了！'
