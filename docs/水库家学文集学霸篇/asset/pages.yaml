- pgno: 325
  md: '，最后损失惨重。


    大家不要以为，嫁个土豪大叔，倒插个白富美，人生就算完美了。如果这样，大清怎么会亡了呢？我们处在一个剧烈变化的社会，每隔十年二十年，都有一次剧烈的财富洗牌，你站对了风口，你一家老小继续嗨，站错了方向，你就挂墙上了。你去市里的图书馆，看看近几十年的报纸，当年那些赫赫有名的大土豪，绝大多数已经灰飞烟灭了。为什么？思维跟不上了，押宝押错了。回顾我大清，自努尔哈赤入关到1912年，绝大部分皇亲国戚也不过是三代就拉倒了。


    你不动，世界在动。每个富豪都希望就这样舒舒服服过下去了。这是不可能的。你要做的是，时时刻刻研究世界变化，分析人心，尽可能多押对几次宝。我时常和我老婆说，这块地这房子，三十年前不是我们的，三十年后也不一定是我们的。我们只是暂时的管理一下。不以物喜，不以己悲。我们做对了，要总结经验。我们押错了，要反思教训。我们留给下一代的，不仅仅是财富，更重要的是获取财富的能力，眼界和格局。


    我们最后必然会对一次倾家荡产的失败。这是客观规律，我们要有这个勇气面对，不要怕。最重要的是，我们要把获得财富的经验传承下去，这是财


    332'
  merge: -1
  img_proc: true
- pgno: 326
  md: '富的种子。只要有合适的水和土壤，十年后，我还是富人。


    家学的核心是，研究人性。家学的重要性，比财富本身更重要。


    君不密，失国。臣不密，失身。


    很多凤凰男，缺乏家学教育，对人心复杂性认识极少。面对单位里热情豪爽的大哥小妹，特别是帮了你一个什么小事后，往往会失去对人心复杂的警惕性，一激动就开始掏心窝子。人家很快就把你私下说的话，在不经意间婉转报告领导，把你出卖了。我以前经常遇到，年幼无知啊。但是，也有好处。在低层次犯错，成本不大。


    （家学）孩子面对的不是学习，而是时间管理。


    学习不重要，考试最重要。很多人以为，孩子在中小学拼搏十二年，是在学习，这是误解。这十二年不是在学习，而是准备考试。现在的教育环境中，高分低能是普遍情况。高分低能，可以读985，你家孩子啥都会，肯定考试差。


    你家孩子面对的是八门课程，每天晚上除了吃饭洗澡休息，学习三个小时已经很累了， 四个小时基本是极限了，再加码，身体肯定崩溃。'
  merge: -1
  img_proc: true
- pgno: 327
  md: '一周工作五天，晚上自习合计 15 个小时。周末两天，可以学习 15 个小时。一星期有 30 个小时，如果算上各种意外情况，一星期大概是 20-25个小时的自习时间。高中八门课，平均每门课是
    3个小时。一学期，每门课分配到 50 个小时左右。


    你看懂了吗？你的孩子考 985，还是去职高混，

    就看这 50 个小时了。具体细节，你自己安排。


    很多人翻过《曾国藩家书》，以为那便是家学，这是 250 的幻觉。真正的家学渊源，是秘不示人的，就是家族内一代又一代的读书人不断总结发展起来的。内容非常贴近生活。包括治学，考试，做官，农耕，手工匠人，婚配，造屋，买地，识人，拜师等等。每个事情你都会遇到的，教你怎么处理各种复杂情况。


    每两代人就会重新梳理一遍，把淘汰的东西去掉。例如，现在己经不需要研究春耕播种的日期了，也不需要研究水源质量了。这种家学一般都有几百年历史了。其中对人性的研究，几乎是非常精准了。'
  merge: -1
  img_proc: true
- pgno: 328
  md: '湖畔大学成立的初衷是研究大败局。我和湖畔大学没有一毛钱关系。但我当时听到这个消息，犹如电击一般的震惊。因为家里学非常重要的一个内容就是，总结失败教训，拓展到逆境中如何苟活，在时代变化来临时，家庭成员怎么分工等等。又听说，湖畔大学最后变成了成功经验的演讲比赛。我就放心了。


    # 家学，能不能举个例子？


    答：好的。大家刚刚进单位的时候，都还记得吧？你下班后干什么？吃饭看电视，最多是考职称。但是，有的家庭就不是这样了。孩子把一天之内的所有事和人，说给父亲听一遍，父亲告诉他，这个事情怎么处理，那个人怎么应付，这句话可能有两个意思，那个领导怎么搭上线。三年后，你还是个傻鸟，人家已经是跑到第一方阵，随时准备为单位挑担子了。


    现在的高考知识点，都是清朝的知识。教育系统的传承，大概是中国历史最规范的技术传承了。无论风云变幻，老师还是那些老师，教材还是那些教材，思路方法代代传。那都是十九世纪的老古董知识，能改到哪里去啊？我感觉很多老师的潜在思路甚至可以追溯到我大清科举时代。


    335'
  merge: -1
  img_proc: true
- pgno: 329
  md: '省重点市重点，在尖子生培训的过程中，确实有很多不为人知的商业秘密，就是如何选拔人才和培训人才。我看现在京沪有几个著名校长，当年就是我们那种打法的培训老师。可能他们后来走了大运，遇到了几个大佬孩子，省略几百字。


    大家常见的开学摸底考之类的，就是最简单的识别尖子生的方法。


    很多劣质中学的摸底考，只知形式，不知内涵。我们当年的摸底考，根本不是靠题目，而是考体系。就是通过不同题型组合，考察你对于这个学科的体系认识。分数不重要，重要的是你逻辑是不是流畅。还有一个常见的是，高三分班。现在已经异化了。当年我是高二就分班。我是化学班小班。我的智商，拿不到物理奥赛名次，只能被当做次品，送去化学小班。当然，这是省市级名次，不是班级名次。到正常班级，我们都是那种战神一般的学生。老师从来不找我们麻烦。


    说了半天，什么意思呢？高考的知识点没有改变，高考的基本试卷没有改变，老一套的培训方法，其实还有巨大现实意义。如果你们要找超级补课教师'
  merge: -1
  img_proc: true
- pgno: 330
  md: '，最好去找区重点校长给你推荐。他们很多人当年是奥赛培训班老师出身。


    现在的教育，真的有点跟不现实了。高中毕业，放在五十年前是中等知识分子了。现在不要说什么知识分子了，连个最简单的工作都不会做。为什么？因为，学校只教你做怪题，刷题。我们是在同一个教育体系中混出来的，为什么有的孩子工作后迅速改变形象，立即进入角色？有的孩子傻乎乎的错过了工作前五年的黄金期，慢慢沦落到底层，看不到任何翻身机会？主要是两个原因：


    **一是家世。**


    父母都是高级档次，来往的都是大行长，大主任，大老板，你在旁边端茶倒水，听个一年两年，也懂个七七八八了。随便哪个叔叔阿姨给你个机会，你就上去了。而很多普二代，几十年都没机会和大头头说上几句话，更不要说什么指点了。五年后还不是差到十万八千里了。


    **二是家学。** 很多时候，我看到的只是一个人的成长结果，没人会告诉你他的培养成长过程。这就需要家学渊源了。小到说话，大到站队，事事皆学问。单位里，也不都是领导亲戚子弟，总要有几个精明强干的心腹。你能不能进入圈子，就看你懂不懂事，有没有眼水了。这种事情，只可意会，不可言传'
  merge: -1
  img_proc: true
- pgno: 331
  md: '。领导总不能说，我家老人住院了，你给我找个优秀保姆来。怎么办呢？想在在前头，记在心里，办在实处。


    # （ 家学 ）结交朋友的思维。


    现实中，95%的人喜欢结交权贵朋友。人家有钱的，指望找他借钱。人家有权的，指望找他开后门。为了这个虚幻的目的，你首先投入了巨大的精力和一定的交际费用。实际上，你的想法是不可能实现的。因为权贵身边有太多太多这样的人了。权贵朋友也没有能力给所有的人解决麻烦，撸取利益。


    **正确的思路是，不看权钱，而是看人的水平。**


    很多人并没有显赫的门票，也没有大把的金钱，但有一定的水平。有的是技术领域，有的是人情世故，有的是消息灵通。这样的人，一般有二十年以上的工作经验，或许还是事业的失败者。你适当留意。如果有可能，可以熟悉一下。


    我以前大单位的老同事遇到我，经常会说一句话，有什么发财的路子，带我一把。我心里觉得好笑。你是谁啊，一句话就让别人带你发财？人的成长主要靠自己，不可能有人给你铺好路，带你发财的。正确的打法是，你找到合适的朋友，给你一些你不知道的经验，在这个基础上，主要靠自己闯出一个路子。这才是真正属于你自己的财富。'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# （家学）怎么培养孩子走基层路线？


    我家族的先辈们，在解放前也是这么玩的，文学，艺术，金融，企业，审美，外语，交响乐，样样精通，都是半专业水平。但是，这种模式培养出来的人，有个巨大的缺点，不接地气。他们的圈子就会越来越小，小到只有十几个人，自娱自乐。一旦遇到时代的变革，啥也不足了。


    # 圈子小的后果是，无法赚钱了。


    赚大钱，主要是带领一群穷人，去打击市场。例如脑白金。你要是不了解穷人，你就不会赚穷人的钱，无法管理员工，无法处理基层矛盾。当年莫斯科东方大学毕业的二十八个半人，很难适应中国农村实际，屡战屡败，带不了队伍。相反，只有在基层千锤百炼出来的人，才能做大事。


    这群所谓的精英，最后的结果，无非是当个 985 老师，自顾自怜，曲高和寡。或者在父辈的基础上，接个董事长位置，一旦遇到狂风暴雨，根本没用。现在，中国的富一代大土豪，也不知不觉的走上这条错误的路，以为学历越高越好，外语越热越好，但他们忘记了根本。我们的根本在基层，在于熟悉国情。这些人在国外也就是个普通人，在国内又不接地气，没啥花头的。'
  merge: -1
  img_proc: true
- pgno: 333
  md: '（家学）家族兴盛的秘密。人世间，只要有富，必定会有穷。穷和富，是相生相伴的。个人和家族的命运，也是如此。没有长盛不衰的家族，但是，家学传承是再起的精神准备。


    有几条可以参考。


    # 一，学习真本事


    大路货知识，知道就行了。立体几何，在一百年前算是知识，现在因为不过是几毛钱的小程序而已。真正的知识是，懂人心+专业技能。在的时髦话是，消费心理，士农工商心理。


    # 二，占据好位置


    国内有三个好地方，京沪广（深）。这三个地方，是中国经济的源头。无论贫穷富裕，在那里占个坑，总是不错的。首推上海。


    # 三，锻炼好身体四，关注新机会


    在中国，传统行业，都是早就有霸主了。逆袭是不可能的。只要是明确发财的事情，你千万不要去。好事情轮不到你。但是，中国人有保守心理，权贵们在不能保证发财的情况下，往往不愿意切入新行业。这才是你的机会。


    340'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 五，略


    # 家学。怎么合理合法的把事情办到地头的心坎里？


    很多屌丝家长以为，吹捧几句，就是讨好 了。有的以为，逢年过节送礼，就是讨好 了。这不是傻子吗！地头要吹捧？上面的人就 喜欢你的那点小礼品？你的好话一文不值，还
    听的反胃。大地头也不是生活中真空里的，适当 的人情往来也是合法合理的。只要不涉及金钱， 物质利益，你出点力气，跑个腿，也没什么。真 正的讨好，是看到地头心里的麻烦事，替他合法
    合理的解决，还要精打细算，严格按照市场价， 让地头自己付钱，两袖清风，不留麻烦。


