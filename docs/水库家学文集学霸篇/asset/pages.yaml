- pgno: 28
  md: '，还是租房。但底子已经有了，工作户口房子孩子，逆袭成功。如果老公今后升个一官半职，那就是中上条件了。


    总结：该女生为人热情，虽然还不老练，但态度认真，讨人喜欢。


    +   2. 浙江某小土豪女儿，从小到大很骄傲，不会巴结讨好，在上海工作了几年，没什么明显进步。家里有个弟弟，估计以后也就是上海一套房的表妹了。


    +   3. 北方地级市的女孩。家里有个哥哥，姑娘从小就知道，生活完全靠自己了，博士毕业，靠自己考进了现在某事业单位，在周浦买了新房子，她老公是同一小区的，小夫妻两套漂亮公寓，各自还贷，步入中产家庭。


    +   4. 某亲戚女儿，从小家庭条件差，节约过日子，进入企业后，我一直给她机会，但她为人处世不怎么样，说话喜欢隐瞒，做事遮遮掩掩，让人不放心，后来就算了。现在嫁给一个没房子的上班族，瞎混日子。


    我的看法是，女儿要培养一定的情商，特别是如何与人打交道，要热情得体，让其他人愉悦，放心，这样就会有机会提升。相反，家庭条件再好，如果对人热情，不大气，做事情没章法，遇到几个波折，终究是回到普通人。


    # 【女人的价值在哪里？】


    女人再漂亮，学历再高，和别人没关系。你高考全省第十名，关我啥事？女人的价值是，你能不能给别人带来什么利益？如果没有，你还趾高气昂的，'
