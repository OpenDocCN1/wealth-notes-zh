  md: '响全部员工，那时人社局是不会理会小老板的。我是忍气吞声地熬和让步，最后忍无可忍，生意也不赚钱了，索性关闭。


    出于什么考虑，我不知道，但是我对象当小老板是彻底不感兴趣了。记住一条准则，保你发财。搞定各种手续，得八成利润，干活的拿两成利润。坚持这个比例，可以保证你一生发财，直到永远。比如做一个国企超大型软件，假设
    1000 万元，智力不值钱，拿到单子才是王道。让出去八成利润，是底线。


    做人的一个准则：忠诚。对上级，对朋友，对家庭，对爱情。忠诚的前提是，你要看准了人， 就不变了。吕布勇冠三军，不断叛变，最后没人理他了。


    做人，不要首先去挑战别人的底线。宁可错，不可叛。


    千万不要从小就学习适应社会，学一些偷奸耍滑、占便宜的事情。


    要培养孩子将来做大事的心态，必须要讲诚信。诚信是，吃小亏，等待大机会。年轻人收入低， 很容易陷入斤斤计较的窘境，一定要摆正心态。占便宜就像做小偷，会上瘾的。必须在源头上卡断，从小盯紧，
    不忘初心。第一次合作，如果是五五开的分量， 你主动谦让一部分利益，你六我四，各自尽力'
