- pgno: 29
  md: '摆出一副“老娘就是能力强，气死你”。呵呵，那就只会收获一大堆的嫉妒和嫉恨。等你哪天倒霉了，其他人立马冲上来，一人踏上一脚！


    女人漂亮学历高，只对你未来的丈夫有意义，对其他男人女人，没啥意义！


    女人无论自己如何条件好，要有一颗谦卑的心，善待别人，善待比你差一点的人。任何拽的像个 250 的女人，结局不一定好。女人容貌也就到 30 岁，娘家的财富也是会变化的，只有口碑是永远伴随你的。做人太累。走，我们去内环线！


