- pgno: 349
  md: '为你的那些话，很快会被这些人拿去献给领导。


    **一定要追求几个自己心目中不可企及的女神。** 虽然你追不到手，但是通过女神的反应，你会学到很多，以后撂倒土肥圆，那就是手到擒来的事情。别担心失败！ 你也没啥损失，反倒是青春的记忆。万一你成功了，嘿嘿。尾炸天！
    对于已经毕业屌丝男的建议，别挑挑拣拣了，抓紧找个土肥圆，一起合租搭伙。拖过 30 岁，年轻土肥圆也不要你了，只能找二手土肥圆了。


    **京沪小白领，赚钱后回老家买个大房子，安静地过好下半辈子，**


    有山的爬爬山，有水的地方多游泳，多吃点儿好的，多玩一会儿，彻底放弃以前的尊严。在京沪，烦恼会时时刻刻地纠缠你。不要多考虑孩子的将来，你现在如果没有户口，我保证，你永远都别想了，政策，我比你熟悉。当然，你不会真同意我的。


    **一个忠告：用尽三代人的关系，进国企；花光三代人的存款，大城市买房。**


    **做到这两件事情，你就不会蠢蠢欲动，想当小老板了。实在进不去公家单位，创业也要做公家的合同。** 道理很简单，绝大部分社会资源都在公家单位，而花钱的人是在花公家的钱，只要你懂事，价格贵
    20%~90%，领导绝不心疼。千万不要去做那种纯市场，市场一热，三年完蛋。


