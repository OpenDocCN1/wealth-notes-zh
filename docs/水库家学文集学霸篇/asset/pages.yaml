  md: '学的就业情况，和他们家族的经济情况，高度一致。人不能和别人比啊！


    # **初中辍学的农村孩子，经济收入将全面超过京沪二本高职大学生。**


    美国的管道工收入，和哈佛大学副教授差不多。澳洲的泥瓦匠月薪 300澳元，是本地会计的二三倍收入。京沪快递员，卖煎饼果子，收废纸的，修空调灶具的，收入已经和一般大学生已经持平了。手艺好的装修工，已经是五百强部门副经理的收入了。两口子贴瓷砖，月入五万是正常情况。


    现在的大学生其实分为两种，一是聪明人，这批人无论什么时代都是优秀的。二是扩招后的普通人。后者本来是一般员工，读了个大学后，肩不能扛，手不能提，刮风下雨不出门，太阳底下不干活，没有空调不想活，但是自己并没有什么强项技术。同水平的大学生，每年如过江之鲫一般扑向就业市场，他们的日子越来越差。


    # **职业没有高低贵贱，劳动最光荣！**


