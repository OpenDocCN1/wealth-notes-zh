  md: '不能回头。大单位里的很多老油条熬到五十岁了，虽然都明白怎么升官了，但也没用了，机会错过了。大部分屌丝出身于劣质家庭，遗传了劣质思维，非常看重小钱，不重视经验，十块钱比天大。“我什么都懂，什么都可以百度”，听不得不同意见，思路狭隘，愤世嫉俗，很容易白白错过黄金期。等到他四十岁明白过来的时候，房价已经涨了十倍了，他只能像傻驴一样过完余生了。


    **兼听则明**。聪明人善于辨识成功者，聆听成功者经验，指导自己的人生规划。所以，屌丝们不要嘲笑我这样的前辈，至少我比你走的稳健，至少我高考分数比你高。你的经验全部来自拿不出首付的劣质家庭，不听还好些！


    **你没有经验不要紧，你就跟紧前两名，拷贝不走样！**


    **这样选择的结果，大概率比你自己思索要好。**


    **家学。** **中国传统文化中，有很多匪夷所思的超级智慧。**


    但是，这些话在近几十年被有关的人和书，故意曲解了，所以，很多人根本不知道本意了，也就无法体会先人人们的智慧了。 今天举个小例子。屌丝逆袭，关键是跟对人。 你看了这句话，估计要骂我了：SB，这话人人都知道啊'
