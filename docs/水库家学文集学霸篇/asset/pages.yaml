  md: '+   2，有利于子女教育。出国留学，肯定是玩了不少地方，以后带孩子的时候，见多识广，肯定是加分的。


    +   3，日常生活中，可以鄙视一下土老帽小领导。自我阿Q 一把。


    # 四，总结


    +   1，增加工作实力是第一。这个是干货，但90%的人是做不到的。


    +   2，留下来打工是第二。有个语言能力，给国内代购，给华人卖房，也是个活法。


    +   3，倒插门是第三。这个是最实战的，一步到位。'
