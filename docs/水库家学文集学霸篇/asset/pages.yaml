- pgno: 350
  md: '生活必然会遇到各种艰难险阻，不要气馁，不要悲伤，努力奋斗，生活会好起来的。你可以多看看书，多学习一些财务知识、金融知识，实在找不到老婆， 你就先泡个士官，凑合一下群租。生活对每个人都是公平的，勤俭节约，量入为出，按时交租，生活一定更美好。


    你最好在结婚前，把要考的证考出来。否则，你今后会面临谈恋爱、结婚、买房、租房、事业发展、同事关系、家庭矛盾、抚养孩子、照顾老人、投资决策等一系列极度耗费精力的事情，你根本静不下心来。我不反对下海赌命
    ，但聪明伟大的你，最好先去考个值钱的证，


    壮壮胆。即使今后，巴菲特没有给你风险投资，等你坑完了所有亲朋好友，烧钱结束，公司破产，你好歹还有个饭碗。否则，你熬到三十多岁，穷屌丝一个，啥也没有，掏出来的只有一把辛酸泪，那是把老婆孩子坑了。


    我本科毕业时，上海还是一个尘土飞扬的大工地。


    我和同龄人一样，除了户口，家里没给我钱，也没房子，我是一个人站在孤零零的浦东大道某招聘会，受尽了白眼和屈辱，当时，我立志要赚一套房子。二十年后，我得到了太多太多。暂时的贫穷和困窘不可怕，只要你不要丢'
