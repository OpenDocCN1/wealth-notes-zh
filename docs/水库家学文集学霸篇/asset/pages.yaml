- pgno: 127
  md: '# 3.2 重点小学的意义


    **重点小学到底有多大意思？**


    很多家长，可能自己当年读书不好，一门心思希望孩子从小就进重点，一路重点，最后考到 985，不惜一切代价，也要搞个重点小学附近的老破小，顺利报名。我简单说说，重点小学是怎么样的？


    **重点小学分为两种：一是考试型。二是靠文体特招班。我重点说一下考试型。**


    大家都是人，重点小学也是人，不会比普通小学厉害多少。当然区别也是有的，就是提前刷题，多刷题。小学也没什么花头，成绩好都是刷题的结果。鸡兔同笼，算几只脚之类的。你要是没刷过，考场上肯定晕菜。老师起到的作用是，逼迫你尽可能多刷题。有些老师也是农村出来的，说话尖刻，阴阳怪气的。


    有的家长以为，重点小学，家长更加重视。普通小学有外地人孩子，学风不好。其实，你真的误解了。现在，外地家长对小学的重视程度，甚至比富人还家孩子还要严格。大部分家长是在初中后，才会彻底放弃孩子。小学生时期，还是超级重视的。


    有的家长，不顾现实经济情况，买个不居住的老破小，每天开车来回重点小学，接送孩子。这是不可取的。家长们如果真的对孩子成绩报以巨大希'
  merge: -1
  img_proc: true
- pgno: 128
  md: '望，关键是自己抓，自己盯，如果能力有限，找个稳定家教，长期跟踪。每天路上这么多时间，至少五年，大家都累，还不如把这个时间用在学习上。


    现在上高价小学，其实就是图个出身。


    你要是中关村一‑小，北京四中，人大附中，再去伦敦帝王学院交学费，那在学校里泡北京妹子，十拿九稳。人家姑娘一看就知道，嗯，出身好，是大户人家，晚上来吃饺子吧。'
  merge: -1
