  md: '国贸系，吃软饭的多，很多人娶了个厂老板的独生女。


    金融系的，大部分去了银行，现在分布在各种金融机构。


    法律系的，法检律为多。建筑系的，这些年发达了。


    建筑系，原来只是名声好听，设计院上班，实际上没什么事情，也很穷。穷到什么程度？当时，农村拆迁，有图纸的农民房，可以多分几万元。他们就在要拆迁的村口趴着，给农民房补画图纸，赚两千块都乐疯了。我在建筑系选修课的老师，在九十年代之前，唯一的作品是一个路边厕所，他津津有味了很多年。


    学金融，必须要穷人孩子。这个专业，说白了就是拉单子。白富美只能在内设机构里拿工资，发不了财。富二代，最好的专业是法律系。也别想什么发财了，把父母留下来的财富看紧，别给人骗了，就算好的了。以我的观察，法检律的专业人士，风险意识强大到“怀疑一切甲方”的程度。这种心态，发不了财的，因为太谨慎了。但是，守业是很好的。


