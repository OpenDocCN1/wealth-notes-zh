- pgno: 291
  md: '# 11.11暗透一本书， 胜过随便翻翻 10 本书


    我经常在图书大厦看到这样一幕： 家长给孩子买书， 一买买一捆， 后面跟着一个小拖油瓶， 可怜巴巴地拽着妈妈的衣角。 尤其初三、 高三年级， 时间紧迫， 书买了心里踏实了，
    可没看透， 其实没用。


    再进一步， 做题再多， 不消化， 不总结， 也没啥用。


    我们做题的目的， 从来不是做题， 而是总结， 提炼规律， 为考试碰到同类题型时， 秒杀之。


    因为， 无论再怎样做， 我们也不可能在中考的考场上遇到原题。 但非常可能遇到熟悉题型， 因为题型就那么多， 反反复复、 来来回回地考。


    为啥呢？ 因为精明的出题人， 非常清楚某些题型的区分度是多少。


    若一个题型的区分度是 0.1 ， 则意味着只有 10%的孩子能做对， 就能在激烈的竞争中， 将前 10%选出来。 出两个这样的题， 就能控制 90 分以上的学生数量，
    从而完成选拔任务。


    对于他们用熟练了的题型， 因为熟悉、 了解、 有把握， 他们是不会轻易改变的。 因此， 我经常在课堂上给学生们说：


    +   1. 做完任何一个有难度的题后， 都要问自己两个问题：


    第一， 我从这道题中新总结了什么？


    第二， 我从这道题中复习了什么？'
