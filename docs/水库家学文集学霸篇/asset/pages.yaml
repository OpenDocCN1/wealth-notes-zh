- pgno: 100
  md: '5，成功率高。我们当初入选，都是精英，基本功好。经过 20 次淘汰赛，最后大概有 40%的学生，在 150 天内，可以达到专业水平的工作要求。当然，写作水平比较低，只能表意，不能修饰。


    续上。我们后来在国外遇到几个外语系的学生，他们是专业搞这个语言的，一般是学了四年左右。我们不比他们差多少。因为他们英语水平不如我们，所以，他们前两年主要是在干单词。


    外语系的优点是，写作能力强。语法好。单词不会写错。


    我们的缺点很多。语法一塌糊涂，写作是小学生水平，单词经常写错。我们的优点是，猜的水平高。遇到陌生单词，外语系的 250 直接就说不知道，我们大部分能够猜对。


    因为我们的学习路径就是猜。另外说一句，外语系的学生，笨的比较多。因为他 是专业翻译，普通人不敢质疑。我们就看得出来了。


    # 续 2。


    民国时期，经常有人号称精通七国语言，但是建国后，几乎没人说了。


    为什么？其实，这个原因，我最清楚了。精通七国语言不难。难得是，什么'
