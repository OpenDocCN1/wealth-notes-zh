  md: '因为保姆习惯性的教孩子逆来顺受，不要打回去，生怕孩子受伤，保姆增加工作量。如果保姆去问，肯定是教育孩子‘不能打架，要报告老师。这TMD是在养250了。我这么大的家业，总不能交给一个唯唯诺诺的人。


