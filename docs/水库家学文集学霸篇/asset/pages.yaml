  md: '# 11.14 考完试卷别扔了，这样分析能涨 50 分


    期中考试结束了，别草草改了错题，听老师讲一遍，就算完事儿。那这份试卷，可就白考了。试卷是像是医生开的诊断书，能直接告诉你问题在哪里，你得会分析。


    如下分析方法，比较靠谱。


    (1)马上"改"


    发下试卷后，要立刻改正。问同学、问老师，弄明白。把详细解题过程写在纸上，贴在试卷上（包括详细过程）。弄错题本也行，但尽量不要抄题，费时费力，效率低。抄多了，孩子嫌浪费时间，就不抄了，带来的后果是，他（她）不改错题了。


    整理错题，有两种常用方法：


    (1)卷子都留着，用小夹子，分科夹起来。错题前面打红色*。这就是期末考试，重点冲刺，最有针对性的个性化的教材。


    (2)把卷子上的所有错题，剪下来，贴在本质上。一科一本，再在第二页，写上过程。


    不论哪种方法，不用在意美观，只要简单、高效即可。（我推荐第一种，效率高。）


    过程要写得非常详尽，注意规范，注意细节。因为中高考对书写的规范、解题过程的严谨程度，有详细要求。


    (2)马上"抄"


    写出来的东西，才会真正重视。有时，光在脑子里面想一想，没用，很快就忘了。'
  merge: -1
  img_proc: true
- pgno: 299
  md: '反思：即哪些题目做得好，哪些题目有失误，并且，要用红笔写在试卷上。


    对错题进行归类，找准原因，对症下药。最重要的是这一点，错题，就是自己的不足之处。多练这种类型错题，主动在作业中参考书中，查找该类错题，补上这一短板。


    很多题目，看似是某个题的不会，其实是某个题型的不会。不知道该题型的技巧方法是什么，就觉很难。不知道啥题型的，去问老师！老师一般都会给你同样类型的题。彻底将该题型练透！


    # (3)统计分析


    在家长辅助下，用数学统计方法，计算各原因的丢分数值。如：


    +   (1)计算失误多少分？


    (2)审题不清多少分？


    (3)公式记错多少分？


    (4)概念不会多少分？


    (5)纯粹不会多少分？


    (6)纯粹马虎多少分？


    (7)每道题考查的知识点是什么？知识点的内容是什么？


    (8)该错题应用的技巧是什么？


    (9)你认为，这次考试体现了你实力的百分之多少？90%？80%？


    (10)最后一个让孩子警醒的问题：若加上这些不该扣的分，你能得多少分？排班里多少名？'
  merge: -1
  img_proc: true
- pgno: 300
  md: '深入做到这些， 才能对试卷有一个非常深邃地分析， 自然就想清楚下一阶段怎么做了。


    光统计一张卷子没啥用。 有时间的话， 统计本学期开始到现在的所有试卷， 就会对自己的情况有个极其清晰的认识。要学会理性思维， 一切以数据说话！


    # (4)改进策略


    +   (1)若错的都是单选 多选 前面的题， 说明基础知识理解有问题。 尤其理科， 很多概念理解透， 是需要做大量基础题 中档题来完成的。


    最好的策略， 就是先把学校发的同步练习册， 做透！ 啥叫做透？ 就是上面的每一道题， 都要弄懂， 能写清晰过程。


    +   (2)若错的都是单选最后一个、 多选最后一个、 填空最后一个、 最后大题， 说明孩子需练的是归纳好的题型题， 难度上来说是中档题和难题。 只做这种！


    +   (3)若错的都是实验题， 最简单做法就是， 找到之前的试卷， 或者往年的试卷， 只做实验题！ 刷他个 7、8 套， 自然就发现， 题型都一样。 自然就不会再错了。


    # (5)错题


    装订成册的错题本， 千万不要束之高阁， 要每次考试前， 都重新做一遍错题， 以达到真正理解。


    复习、 考试， 和这个世界上的任何工作都一样， 本质都是熟能生巧， 专门针对自己的不会点去反复攻克。 反复熟练， 方为正途。'
