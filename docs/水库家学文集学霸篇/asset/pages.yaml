- pgno: 123
  md: '# 孩子怎么考上985？抓早，抓实。


    前两天和一个老教师聊天。他说，千万不要指望学校怎么样。一个班级40个同学，一个老师可能要教两三个班级，不可能多关心你家孩子的。很多老师因为家庭负担重，长期心情不好，能够把课上完，抓一抓最差的几个，就已经忙不过来了。


    孩子的成长，主要靠家长。很多家长想，出个两千块钱，交给辅导班就行了。那是吃错药了。辅导班的老师，只是讲讲题，你听不懂，关我什么事情？只要大部分人听懂了就行。


    怎么办呢？必须家长亲自上。辅导班，你也学一遍。重新读一遍12年课程。十几年前，我有个办公室同事老大姐，她原来是理工科毕业，因为个别原因，调到我们单位，做后勤杂务，抄抄写写。我经常看她上班时间学习高中数学历，非常奇怪，但我也从来不问。后来得知，她女儿是重点高中的数学尖子生，大学考上了同济或者复旦，有点记不清了。


    几年后，我调走了，遇到就问：你看得懂高中数学吗？我早就看不懂了。她说，看不懂也要重新学啊。她老公单位是科研院所，同事夫妻绝大部分是理工科研究生，都在家给孩子们补课，只不过不说出去而已。他们的孩'
  merge: -1
