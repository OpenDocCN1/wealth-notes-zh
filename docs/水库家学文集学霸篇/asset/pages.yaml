- pgno: 337
  md: '管理，说白了就是打造一支队伍，忠诚+能干。99%的中小企业，熬不过十年。原因就是无法形成一只战斗力强，又不会散的队伍。很多企业当年干起来，主要是创始人机缘巧合，能力超强，一旦富二代接手，很快就垮了。


    只有懂了普通人的思维，才能够管理员工，针对普通人，设计出他们最能够接受的产品和服务，甚至是欺诈产品，例如高科技床垫。例如老中青屌丝们最大的特点是：好吃懒做，贪财好色，胆小怕死。但是，书上得来终觉浅，绝知此事要躬行。你和孩子们讲答案是没用的，必须让孩子们自己领略几次。


    # （家学）谦虚使人进步，骄傲使人落后。


    这句话，每个人都知道。但你真的理解吗？今天，我以自己血迹斑斑的往事，告诉你这句话是什么意思。这句话从头到尾，没有提及个人能力，而是专门说做人。我年轻时候是出了名的牛b，业务水平比同龄人高一大截子，我分管的业务年年都是第一名，但最后我还是混不下去了。'
