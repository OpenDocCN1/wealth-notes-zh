  md: '# 11.13 干的冒烟的学习方法干货，适合初二及以下年级


    讲一个真实小故事。 有一个高二学生叫赵 XX。她妈妈必须得重拾英语。


    为啥呢？


    她妈妈所在的超级大央企 开发的产品卖给外国人。但外国人不会使得他们培训。本来这都是刚毕业小年轻儿内部竟聘干的事儿。但她家 2015 年刚换了大房子 有房贷
    20 多年的北京打拼生活 周遭工作也乏味 就想换个环境 重点是工资还翻倍呢 于是就递交了内部竟聘申请 准备考试。


    要学英语 并且还得学大量行业内的专业英语术语。她妈妈本是 20 多年前的大本英语底子还行 但过了这么多年 也忘得差不多了啊 于是就不得不重新拾。


    天天追着孩子问。 孩子英语本来中上等 但轻飘啊 老以为自己英语都好到她妈家了。 就给她妈讲。一开始 还有点优娇 还嘴畔瑟 还有点爱搭不理的劲儿。但很快就歇菜了
    就原形毕露了。 教不动了 教不明白为了。


