  md: '很多人在小学里就被老师家长天天问，你长大后的理想是什么？做科学家，做飞行员，当大老板等，其实小孩子也就是随口一说，说完就忘了，老女人们也是笑的花枝招展，水桶腰乱扭。时间长了，大家都把理想二字彻底玩笑
    化了。


    任何经典都是有具体原因的。理想是人类最伟大的精神之一，是激励人，鼓舞人的精神武器。一个充满理想的人，可以克服痛苦，克服恐惧，无惧风雨，砥砺前行，充满战斗力。


    理想会激励你勤奋不止。当你的第一个理想是 985 的时候，你会无休无止的刷题，晚睡早起，自觉自愿，三年如一天的刻苦。这就是理想带给你的精神动力。当然，这种理想只是初级阶段。因为利益太直接了，甚至这不是理想，只是简单目标。


    理想会让你明确选择。当你工作后，很多事情就变的复杂了。面对纷纷扰扰的多选题，人就迷茫了。无论怎样做，都有利害得失，翻倍成功，或鸡飞蛋打。如果你没有理想，斤斤计较，人生就会越来越痛苦和迷茫。如果有理想，那就简单了。不问利益，直奔目标。如果


    你希望成为一个技术专家，不怕吃苦，毫不犹豫去业务部门，去基层一线。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '吃亏占便宜，我全认了。


    理想会让你克服恐惧。人们在面对人生重大选择的时候，往往是充满了恐惧。这一步踏出去了，是祸是福，谁也不知道啊。反复犹豫，辗转难眠。举例，我在地级市混成了副高，有房有车有女票，还不要求名分，开心伐？现在有个京沪落户口的工作机会，放弃一切，从出租房开始，敢不敢去？很多人就傻眼了。如果你的理想是吃光用光，身体健康，那就别去了。如果你的理想是，把孩子推到更高的层面，那怕什么？立马就走。


    人生是一个无休无止的多选题考场。没有理想，你时时刻刻会痛苦焦虑，计较一点一滴的得失。理想明确，你就没有什么思想包袱了。人有希望了，就会精神饱满，无所畏惧。当我六十岁的时候，输了也不怕，至少我收获了经验和各种技术。


    万一赢了呢？走，去 KTV，十块头的来一打。我包场！


    （家学）我一直告诉孩子，你长大了，要为国家做贡献。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '这不是我唱高调，而是精密思考过的。一个孩子的成长，会遇到各种各样的麻烦，各种各样的痛苦选择。一个人，如果没有远大的理想，没有为国为民的抱负，很快就会陷入斤斤计较，患得患失，过分的考虑个人利益，格局越来越小。


    我已经为孩子准备好保底的财富了。何不让孩子放手一搏？输赢不重要，有这个眼光和阅历了，再下一代，也不会太差。


    这是大智慧，长远考虑。


    # **我生活的目标。**


    我家孩子太小，我一身考试的武功还没传下去呢，只能慢慢等待。我这个人，别无所成，就是会考试。当然，这个在成年人的世界毫无意义，但对孩子很有意义。我就这么个目标了。其他的，我看兴趣也不大了。


    # **家学。有实践意义的教育，历来是奢侈品。**


    我说个书本上从来没有写过的，祖上口口流传下来的小故事。明朝有个大 an 子，叫做大礼议之争。说起来也搞笑，就是文武大臣争论，嘉靖法律上的亲爹是谁？嘉靖的老师，翰林院修撰，内阁大学士杨慎，直接反对自己的学生嘉靖，被自己学生廷杖三次，打的死去活来，也不松口，最后开除一切职务'
  merge: -1
  img_proc: true
- pgno: 23
  md: '，发配云南瘴气之地充军。这个事情的奥妙在于，杨慎在云南，居然活的超级舒服。你想啊，一个皇帝恨之入骨的人，居然活的非常舒服，七十二岁才挂了，当中还回四川老家玩了三次。为什么？我后面讲。


    其实，历朝历代的实战教育，都是昂贵的。


    # 一，学徒三年，吃尽苦头


    穷人家玩不起高级教育，只能是学手艺。但学手艺也不简单啊。裁缝，木匠，厨子，唱戏，保镖，哪个不是学徒开始？家长没钱，就孩子去干活。早上天不亮起来当保姆，给师傅洗衣做饭，扫地擦桌，什么苦活累活都要干，吃的差，住的差。等于是三年免费劳力，一日为师，终身为父，才换个入门技术，非常残酷。


    # 二，科举精英教育是天价


    这个我最熟悉了。我家老一辈的人说，明清时代，科举家庭有个秘密开支，收集科举试卷，主考官文章，请进士讲考试方法。这种教育是非常秘密的。


    家里秀才以上的读书人才可以听。老弱妇幼，闲杂人等，是不让进的。


    考试技法研究都是名师点拨的。科举意味着官位。有本事的人绝对不会轻易传授。这种教育简直是天价了，秘而不传的。回到篇首，天底下，考试最牛逼的是谁啊？帝师，翰林院编修，内阁大学士。巧了，杨慎就是这个人。杨'
  merge: -1
  img_proc: true
- pgno: 24
  md: '慎要是秘密的给哪个学生点拨一下，那还得了？所以，杨慎成了国宝级人才，受到了云南巡抚衙门的秘密保护。


    # 三，中产家庭孩子只是三年私塾


    私塾教育都是很贵的，要养活一个私塾普通教师，相当于五个农民家庭的收入；中等地主家庭才行。阎锡山的父亲是高利贷商人（后来破产），他才读上三年私塾。这件事情对阎锡山刺激很大，民国时期，阎锡山发狠了，山西教育搞平民化，家家户户的孩子必须读书。


    直到解放前，全国文盲大概是80%。


    教育的目的，一是普及基础劳动技能和文化，类似于我们的二本，或者美国的州立大学。二是精英选拔，例如哈佛大学。历朝历代，世界各地，这两个系统是分开进行的。法国德国英国，都是这样的。


    但是，我们的教育九年制义务教育不分开，高中分流一半，所有的孩子都在初中小学打混战。这就没办法了，逼得家长去补课。建议：


    +   1，高中不分流，但可以分校。贵的，便宜的，看你情况。


    2，保留985的精英选拔。二本教育注册制，鼓励学习科学文化。


    只要不强制分流高中，补课问题，基本解决。大部分家庭孩子也没打算读清华，但不让我读二本，家长就急眼了。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '孩子才十五岁啊，这就定性了？


    # 【孩子教育四条】


    （一）影响孩子成绩的主要因素不是学校，而是家庭。


    （二）如果家庭教育出了问题，孩子在学校就可能会过的比较辛苦，孩子很可能会成为学校的“问题儿童”。


    （三）成绩好的孩子，妈妈通常是有计划而且动作利落的人。


    父亲越认真，越有条理，越有礼貌，孩子成绩就越好。


    +   1. 贫穷是重要的教育资源，但并非越贫穷越有利于孩子的成长。做父母的，需要为孩子提供基本的文化资料，不让孩子陷入人穷志短的自卑深渊。


    孩子的起跑线是家长，具体来说有这么几个方面：


    第一，家长传递给孩子的三观，包括怎么为人处世，看待事物的角度，看待金钱的态度等等，孩子在一个温暖的家庭长大，以后容易形成健全的性格。


    第二，教给孩子分析问题、解决问题的方法，这是一整套思考体系，从问题的表面入手，直到问题的本质，这样孩子以后很可能沉着、冷静以及高情商，不易怒、不感情用事。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '第三，孩子的智商，相貌，身高，这些跟家长都有极大关系。


    第四，尽量给孩子提供好的物质基础，以后孩子可以少为柴米油盐发愁，才能更好的发挥自己。千万别相信儿孙自有儿孙福那种鬼话，那都是不负责任的家长给自己找的借口和托辞。


    # 培养孩子。


    +   一：体育锻炼，长跑加强身材和心肺功能。


    摸高跳跃，会长高。不能经常负重，个子矮。


    +   二：生活技能，女孩买菜做饭，缝缝补补，


    男孩修个自行车，换个灯泡，安装电脑桌。


    +   三；抓分数。考上复旦交大是重中之重。


    一个豪门媳妇，二本还是顶级大学，天差地别。


    +   四：注意视力，劳逸结合，不要近视。


    # 怎么培养儿子？


    +   1，吃好的，多锻炼，不要晒黑了，争取长到 178cm+。


    +   2，读书不重要，不要搞成四眼狗了，'
  merge: -1
  img_proc: true
- pgno: 27
  md: '考个上外同济的三本垃圾学院即可。


    +   3，打扮很重要。多看看男人服装杂志。


    +   4，学点歌舞开车，撩妹的实操技能。


    +   5，学点散打长跑，万一被抓奸了，还能活着跑掉。


    +   6，公婆有大房子的，送到英国去撩妹。


    +   7，家里穷的，做上门女婿，吃吃喝喝一辈子，也蛮好的。


    # 培养女儿。


    我认识的熟人家，绝大多数生女儿，现在女儿基本成家立业了。


    说几个例子。


    1，**女屌丝家庭**。父母是穷县城的下岗职工，但是自强不息。父亲在省会开了个小餐馆，半死不活，赚了点小钱。母亲是下岗退休的会计，又去打工了，一年收入 5-8
    万。


    女屌丝是山东某电力专业的本科生，在沪国企的合同工，同单位找了个老公，是国企干部编制。老公是上海户口，又帮女屌丝转为了正式编制。几年后，女屌丝也可以转为上海户口。


    小夫妻连续投资了两套老破小，现在增值很多。但他们在市中心买不起房子'
