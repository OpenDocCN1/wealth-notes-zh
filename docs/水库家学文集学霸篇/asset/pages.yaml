  md: '**粉丝：家里没关系的县城男孩，明年考一本有把握，想去京沪。**


    **读什么专业好？**


    **答：1，做一个很辛苦，需要技术，不靠关系，别人不愿意干，收入比较高，今后有能力创业的专业。例如：修高档车，房产中介，婚介老师，留学咨询，IT  技术。**


    **2.不建议银行，法会，律师，医生，重点中学教师，很要社会关系。**


    **村二代学什么专业？苦活累活。学开海德堡印刷机，比学国际政治，公共管理要好得多。任何带有经济，金融，国际学眼的专业，一律删除。任何工厂不需要专业，看也别看。现在，大学生比垃圾袋还泛滥，你找个靠劳动吃饭的工作。不要想着走捷径，这个时代已经过去了。**


    学学保姆思维，没人想干的活，真赚钱。


    **穷学金融，富学法律。**


    我是金融科班出身。当年的  985，金融算是不错的专业，但不是最好的专业。当年最好的专业是国贸系，经济类属于中上。最破的专业是数学物理化学系。但是，人生给我们开了个大玩笑。


    **我们同一届的数理化专业同学，现在 80%在美国波士顿瞎混。**'
