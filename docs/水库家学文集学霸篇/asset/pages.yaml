    写报告条理清楚，很容易获得赏识。这叫能文能武。


    +   3，初中英语，八百句最多了。


    +   4，高中生物，主要是看血型，老婆偷人也不是没有可能的。


    +   5，高中地理，天气变化，温度湿度，雷雨，也不错。


    中学课程是有科学意义的。只不过，学校老师把好经念歪了，


    把科学变成了刷题，便宜了很多收费 app。


    把化学知识变成生活和做菜的小秘密，你马上就是专家了。物理也这样。


    985厨师和技校厨师的区别，讲清楚工作原理。


    烧菜的本质是，高温作为催化，加快食物的化学反应，目的杀菌和产生'
