- pgno: 342
  md: '，还要你教？哈哈，我想你第一反应，应该是北方思维：在单位跟紧一个领导，将来给你个小职务。或者跟紧一个大佬，给你发点小单干子。这其实是表层意思。这句话的本意，不是人身依附关系，而是思维依附关系。


    据我家族里老人说，这句话本来是北洋政府里的一个高参，私下闲聊的时候说的，我家祖上拿笔，记下来了。北洋时期，各路人马，派系纷争，争奇斗艳，此起彼伏。个人的力量，微不足道，你要想搞大，必须跟对人。但是，靠错了码头就完了。那你靠哪个码头呢？你也别自己猜了，你就选个你钦佩的人。他干啥，你跟啥。


    这个人可能也不熟悉你，也不会直接给你好处，但你在跟的时候，自然就进入圈子了，慢慢积累了资历和本钱，到时候，你就有机会脱颖而出。换到现代商业社会，本质是一样的。各种门道，暗流涌动，千难万险，我实在是没本事研究了。怎么办？风投圈有句话，跟投。我看不懂，也不看了，我就信你了。你投
    20%，我就投 5%。反正你不会害自己。你见过哪个大老板花 500 万去买批图.p (p2p) 的吗？都在买房子。


    失败分为两种。一是真的蠢，二是赌输了。现在，大部分屌丝的对社会和人生的认知水平，并没有超过钱钟书他们年轻时代的高度，甚至是远远不如。如果你在大学毕业前，没有接受过系统的家学传承，今后要走点弯路，交点'
