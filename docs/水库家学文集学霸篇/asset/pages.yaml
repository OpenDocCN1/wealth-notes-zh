- pgno: 103
  md: '给她们了，自己再也不敢带好东西去学校了，是挺可怜的。但家长也真没办法。因为好几年忧郁，这女孩子看上去非常胆小，让人觉得心酸。


    **各位家长，如果你发现孩子放学后闷闷不乐，要找原因，很多是被人欺负了。**虽然家长也帮不上什么，但是要鼓励孩子勇敢一点。实在不行，就带去学习跆拳道，拉上一帮师兄师弟，撑撑场子。据我所知，学校边上的跆拳道班，一般和附近的坏孩子都认识，打个招呼，可能就好解决了。


