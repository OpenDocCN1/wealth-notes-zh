  md: '# # 第八章 读大学，进社会


    # ## 8.1文凭的作用


    **文凭，是中产碾压穷人的利器。**


    富裕家庭可以不靠文凭了。富孩子能不能考上 985，家长不是特别关心。考上我高兴，考不上也没什么。孩子以后不需要求职了，随便挑个公司去当 CEO，再给你配几个老臣，玩十年，就当练手吧。35
    岁回总公司接班就行了。虽然大多数富人的公司也不宏大，比不上王健林，但也可以吃个饭。


    真正残酷的事情是，中产阶级对下层的碾压。绝大部分中产家庭，年收入 50~100 万左右，高不成低不就，他们的职务职称不能继承。房子和钱也不多，留不下几套大平层。留给孩子的只能是文凭，而且他们中产有这个优势。


    上海的中产人群中，本地人很多，也有很多是考试出来的安徽人，江浙'
