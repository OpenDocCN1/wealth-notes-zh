- pgno: 116
  md: '# 第三章读小学，当学霸


    # 3.1 小学教育，家长为主


    小学教育，关键是家长。


    你就算把北师大教授找来当班主任，也是精力有限的。以前的王公贵族子弟，老师都是最好的，成才率也一般啊。现在，更不要说那些正在为买房找婆家烦恼的女老师了。


    我家的情况是这样的。我负责定计划，


    我老婆负责拼时间，娃娃负责去班上碾压同学。


    （ 家学 ） 如何让孩子自觉自愿的成为学霸？首战必胜！


    我们家据说是江南大族的一个分支，几百年来，起起伏伏，但总能快速翻身。最快的办法是倒插门，层出不穷，群星璀璨。我们这一行是非常隐秘的。人家大土豪也不是傻的，你要有绝活。什么东西最拿的出手？功名（考试）。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '**我们家就专门研究考试。**虽然书读的一般，但那个不重要，谁靠读书吃饭啊？说到底，还是靠分数吃饭。朱熹说，读书目标是，存天理，灭人欲。我呸，250才信呢。我们读书就为了考试。


    **考试，是一个长期耐力项目。**请家教，小聪明，只是辅助条件，不能解决本质问题。最关键的是，孩子要形成一种非常强大的自律性。通过长期自律，争分夺秒的刻苦，考试成绩往往是非常好。


    **但是，孩子那么小，怎么可能形成坚韧不拔的自律性呢？**光靠家长哭穷卖惨，苦口婆心，基本无效果。最好使的办法是，利用人性中“恶的一面”，把孩子引上不归路。我就举个最容易操作的套路。


    **孩子们在四岁以后就进入幼儿园集体生活。**在人生最开始的阶段，孩子们争强好胜是普遍心态，经过一番较量，最后会形成强者越强，弱者越弱的固定格局。猴王一旦形成，必然是千方百计，不惜一切，维持荣誉。


    同理，如果孩子在最初的竞争中，趁其他孩子还没有反应过来，以最快的速度进入努力状态，迅速成为幼儿园或小学一年级，语数外的前三名，甚至是第一名。首战必胜，打出气势打出名气，打出地位。'
  merge: -1
  img_proc: true
- pgno: 118
  md: '老师们肯定是反复表扬，同学们羡慕嫉妒恨。这种环境会极大刺激他的荣誉感。经过一两年的反复刺激，孩子就会对这种快感上瘾。为了保持荣誉，会在下课后主动练习。


    这时候，家长再选择合适的家教，教材，基本上就他引上道了。


    # 如何抓好中小学成绩？


    教师节过完了，大家今天要进入紧张学习状态了。


    作为当年的老学霸，我提几个建议，给家长们参考。


    # 一，我当年的情况


    我们那年，上海一本录取人数 4-5 千人左右，985+211 招生合计大概是2000人。也就是说，头部考生的入学难度，和现在差不多。那年代家长不管的，实际上也管不了，也没有家教。我们全部靠自己。主要是和老师搞好关系，争取额外指点。现在这条路走不通了


    # 学习阶段性的重点


    +   1，小学靠熟练。家长要抓早。只要家长关心，少量家教即可。因为小学作业，家长看得懂，基本能够管的起来。


    124'
  merge: -1
  img_proc: true
- pgno: 119
  md: '+   2，初中靠逻辑，初一下和初二上，必须利用寒暑假，提前学习，否则上课听不懂。初中课程难度直线上升，内容急剧增加，题型千变万化，死记硬背是不行了，必须学会数理化的逻辑思维，融会贯通，一通百通。这个阶段的最主要任务是，培养孩子的思维方式转化，所以很多男孩子成绩突飞猛进，女学生掉队了。再说一遍，提前学习，防止信心崩溃。


    +   3，高中靠自觉。任何打游戏，谈恋爱等大量花费时间，影响情绪的事情，会导致学业崩溃。高中三年，时间紧，任务重，基本是卡到天才计算依据的。我当年就是这样的。每天看完多少页，做完各科多少题。家长已经管不了了，孩子必须靠自觉。家长哭惨也好，诱导也好，欺骗也好，反正你必须让孩子知道：成绩不好，人生就毁了。


    # 三，学习方法


    +   1，题海战术。题目看多了，心里不慌。遇到怪题无所谓，反正我不会，别人也不会。


    +   2，总结。这个最重要。各科必须画出一个思维结构图。不是你画好了给'
  merge: -1
  img_proc: true
- pgno: 120
  md: '孩子看，孩子不可能看的，必须是孩子自己画。每一科目的思维导图（逻辑树），大概是一平米左右。我是用白纸一点点画的，背后点胶水连接。画好了，也不是天天看。但画出来了就说明，我对每一个学科的整体把握已经完成了。


    3，错题本。老生常谈了。但做到不容易，太费时间了。家长可以帮忙做，给孩子节约时间。最好是活页册那种，可以随时加加减减。


    4.小升初，初升高，高考，三大考之前一星期，你手里应该有一本 100 页左右的全科错题集。每天看一遍，再配合一些以前的卷子，主要是保持考试的状态。


    # 四，家教分两种


    1，答疑解惑。遇到难题，他给你讲一下。


    2，额外加课。现在老师课堂不教真本事的，都是课外教。


    但是，以上都不是最重要的。最重要的是，老师都有一套自己写的课程总结。尽可能找他们要这个。


    # 五，考试方法'
