- pgno: 111
  md: '偷着老师的裙子。


    只有经过了这一系列的人生履历，这个人才格才基本塑型完整。自己在家教的，纯粹是在封闭空间长大，毫无意义。


    # 孩子读幼儿园还是爷爷奶奶带？


    我一开始以为，老人带孩子更加贴心。但是，我经过长期观察认为，正常孩子去幼儿园更好。因为在幼儿园里，孩子们学会了社交能力，小朋友之间的关系，也是很复杂的，勾心斗角，拉帮结派，背后揭发，偷小东西，互相嘲笑，今天跟他好了，明天跟你吵了。现在，


    幼儿园还搞才艺投票，为了争取多一票，小孩子们的社交能力，明显提高。这些混社会的能力，在今后的成长中是很有用的。


    幼儿园大中班的家长，你们适当考虑每天晚上让孩子固定时间学点东西，例如拼音，写字，算术。这个不是什么提前教育，而是培养一种学习习惯，让孩子知道，晚饭后就要求学习，而且是每天学习。现在是装模作样学一下，哪怕是学一个拼音，目的是做规矩，以后读小学了，就好办了。'
