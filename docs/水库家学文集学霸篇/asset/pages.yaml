  md: '# 第十二章家学知识启蒙篇


    自古有一种学问：家学。这是口口相传，秘而不宣，真实存在的。就是祖上世世代代对人生的经验体会，涉及方方面面，包括如何做学问，如何安身立命，对外怎么说活，对内如何管家，如何选择机会，如何对上对下。一般人不承认这个事，但你可以看到，很多家族不管朝代更替，真的就是人才辈出，没办法了。


    家学就是家里传男不传女的那些技能。49年后长期臭老九政策，近三十年文凭决定一切，导致几千年的家学传统，彻底丢失。家学一般有两种，一是罕见技能，例如某个小语种，螳螂拳，烤鱼秘方；二是为人处事原则。现在我慢慢看到，很多富裕阶层已有意识在恢复了。好事。


    家学文化心理，几百年没变化。你看明清小说对人性的表述，三国，水浒，'
  merge: -1
  img_proc: true
- pgno: 309
  md: '官场现形记， 看张爱玲对老上海人的内心独白，看蒋介石的日记，看钱钟书的围城，和现在的人心，就是一模一样。最苦的就是农二代，种地的家学用不上了。屌丝总认为别人和他差不多，精英就是运气好。如果你真有这个想法，你真完了。


    家学遇到的事多了，37 年抗战，一切归零。


    52年公私合营，一切归零。老运动员了，经验丰富。


    保命办法多：一是细细的金耳环留几十个，没钱了就卖一个。


    二 是 家 学 要 传 承 ， 三 是 认 怂 要 快 。 四 是 打 死 不 咬 别 人 。


    【家学传授】包罗万象。为人处事，工作学习，生活婚姻，餐饮养生，购房买地等。你在走廊上看到一把手，怎么打招呼。你和各色人等，如何相处。如何面对危机，如何摆脱嫉妒到仇恨的人。如何营建房产。如何保育幼儿。各家的体质适合什么样的生活规律。如何考试。如何安排休息时间。现在这些知识都没了。


    【家学】。近代普及了大学制，私塾传授断绝。学校优点是低价快速标准，适'
  merge: -1
  img_proc: true
- pgno: 310
  md: '合技术部门。但人对事的研究和看法，被彻底删除了，只剩下高大上了。


    单纯灌输环境中出来孩子，很难适应社会真实一面。大学生进单位第一年表现，就决定了人们对你的看法，今后很难改变。很多没有家学传授的孩子，吃了大亏。


    现在的所谓周末私塾，我很反感，穿个中装，装神弄鬼。家学传承，绝不是背三字经，是类似于案例教学的东西。父辈按照孩子的年龄，有计划的补全孩子各个方面的短板。小时候，
    是性格养成，营养健康。中学时代，是学习方法，身体锻炼，情绪控制。大学时代，为人处事。工作后，分析人心，寻找财富渠道。


    前面说的都是大道理，其实不管用。真正的家学，是针对每一个特殊场景，险中求胜。这不是几句能够说的清楚的。但有一句话，你可以体会。成功的家族，更懂怎么成功。他们看多了自己和竞争者的伎俩，就算是过年去送茶叶，你送不出去，他就能送出去。你有啥办法？
    你根本不懂怎么去送茶叶。对伐？


    屌丝好像很喜欢听秘闻。其实也没啥的。无论啥段位的，除了办公室和大楼的档次不一样，其他思维方式，基本接近。只不过，高段位的人考虑得远一'
  merge: -1
  img_proc: true
- pgno: 311
  md: '点，顾虑多一点。一般人想问题， 基本是现开消，也不考虑别人的感受。高段位的人，往往是先考虑上上下下，今后一年的影响，经常委屈自己，保持平衡。


    **说个直白的干货。你为啥送茶叶送不出去？因为第一次去，必须有人带着去，你可能想不到吧。你硬生生过去，十有八九是不行的。** 除非本来就对你的很满意，想拉你一把，
    但这种情况是极罕见的。


    （ 这算是隐性知识点了）


    **秘闻，我在家学中看到的，现在已经没有意义了。一百年前没有味精，餐馆如何炒菜提鲜？ 一是便宜办法。蛎洗干净，晒成干，磨粉，当味精用。二是海鲜提味。例如瑶柱，小鱼干，
    晒干，捣碎，当味精用。** 没有开过餐馆的经历，只是作为传闻记录。


    【**豪学，如何处关系？】** 人在社会谋食，上下左右的人，需要相处好关系。你要经常琢磨对方的需求在哪里？就往这个方向上着力。一般情况下，你不能直接帮对方解决，但可以通过语言，小礼物，去赞美奉承对方。与你没利害关系的人，可以适当场合，为他小小的造势，
    但要注意，不要得罪他的竞'
  merge: -1
  img_proc: true
- pgno: 312
  md: '竞争对手。


    两个年轻技术人，甲是水平高过乙，但斤斤计较，非要价格满意才干。乙是一般水平，不太计较，小赚点就行了。前三年，两人收入差不多，甲比较闲，乙比较苦。三年后，甲越混越差，乙发大财了。因为新客户一看，乙做过那么多项目，自然就服了。甲的项目较少，新客户不信任，生意比较冷清。你说这怨谁啊？


    **如何赚钱？你先让别人赚到钱了，别人就会不知不觉中使劲帮你赚钱。**


    **一代为一代，这就是家学传承。为人父母，就要自我牺牲，勇于牺牲。**


    厨艺也是家学的重要部分。家族健康，孩子成长，功不可没。现在很多女人只会考试+画眉毛，不会做菜，到了大户家庭，是混不开的。做菜不难。保姆课培训 3~5 天，保证是入门级厨师的水平。小美白不要去做什么木艺陶艺，瑜伽马甲线了，学学做菜吧，收益极大。有的懒婆娘告诉女儿：好好考文凭，千万不要学做菜，学会了就是你一辈子做。这种女人都是底层劳动妇女，没见识的。照顾自己男人和孩子，还斤斤计较，垃圾。我老婆的厨艺，非常好。有时候，家庭聚会，就是我老婆下厨，大家都表扬。我老婆做饭，讲究颜色搭配和味道兼顾，特别是做水产品，很有方法。


    **家学渊源。** 中国近代史，纷乱频繁，物质财富和权势地位的传承，每隔一段'
  merge: -1
  img_proc: true
- pgno: 313
  md: '时间就完全中断。真正有可能传承是家学。家学不是虚幻的东西，而是实战经验。举例。书香门第往往 “一门三举人”，这不是什么天生聪明，而是掌握了学习方法。清华复旦毕业的本科生基本具备了卓越的学习方法，这种玩意传承下去的意义是很大的。只要给点机会，下一代立马又是一个上上人。很多家庭看中学历，也是有道理的。


    **家学之练字**。我没练过，字写的不好看，一般是清晰。以前老辈人都练字，从小就是童子功，只练颜体，读书出功名，是要去做官的，要正气。字如其人，考官第一眼看的就是字，字好看了，立马加分。现在，第一眼看的是颜值，我天天练蒸汽美白，册那，也是蛮辛苦的。我家里的人饿不死的，总可以混个活法。


    # **【家学，交朋友为了什么？】**


    很多人不知道交朋友的目的，只知道一起玩，一起吃，说说八卦话。这是很愚蠢的。交朋友的目的是，事先考察掌握对方的能力，人品和各种信息。人的发展机遇和商业机会，往往是朋友熟人带来的，但这类信息真真假假，扑朔迷离，需要自己去判断，去伪存真，果断决策。判断的依据是：先确认信息来源。这个消息是你朋友带来的。你的这个朋友靠谱吗？这可不是临时想'
  merge: -1
  img_proc: true
- pgno: 314
  md: '的明白的，必须是有一段时间的研究和熟悉。这就是交朋友的起始目的。


    **决策之后，需要大家去落实，一个人可能干不了这么多事情。**不同的岗位，需要不同的能力。你在前期对朋友的熟悉理解，就可以判断出，什么人适合办什么事。你可以迅速联系相关的人，合作相关的事情。


    **遇到利益极其复杂的事情，你需要的是人品靠谱。**遇到技术难题，你需要的是技术过硬。这些事情一旦来了，就是火烧眉毛，风险巨大，容不得过多思考。那么，你前期交朋友的铺垫，就是现在立即决策的依据。


    你对人真诚，人也会对你客气。剔除猪一般的队友，


    是日常交朋友的唯一目的。


    **【家学，人世间最宝贵的财富是风险评估方法】**你家要想发财赚大钱，就必须冒险。但是不能胡乱冒险，至少要有六七成把握。怎么判断风险，就是你的人生必修课了。要学会看人品，出身，学识，经验，经历，现实状态。风险投资家是最精明的人，银行信贷科是照猫画虎，但也有一定的技术积累。'
  merge: -1
  img_proc: true
- pgno: 315
  md: '规划。用两代人三代人的自我牺牲和无私铺垫，让孩子有机会在高级平台上一博一次。失败了也没什幺，五十年后再来。赢了，那一代也不过是享受几十年。这世界没有常胜将军。但是，
    家学经验就是这么一辈一辈摸下来的。


    # 家学：如何过上优雅从容的中产日子？你要像做企业一样的，经营自己的人生。


    一，练就一个强项。就是企业主打产品，你总要赚钱吧。


    二，发现外部技术人才。你和你的家人，在今后几十年的生活中，会遇到各种突发情况，紧急需要帮助，而你一瞬间又无力判断哪些人是人才，哪些是混的。


    你需要未雨绸缪，主要涉及：


    +   1. 律师（例如房产，婚姻，交通事故等）


    +   2. 医生（例如我有支气管炎）


    +   3. 各类教师（例如中小学，考研，考职称）


    +   4. 各种部门的人（你总要去盖章吧）


    +   5. 技术人员，例如修车，家装，维修


    +   6. 保姆中介物业等等


    三，处理好内部关系。'
  merge: -1
  img_proc: true
- pgno: 316
  md: '例如婚姻关系，婆媳矛盾，父子感情等等等。团结就是力量！


    四，明确家庭财产规划。若有结余资金，如何安排。三代出贵族。


    五，储备 1-2个赚钱后手，万一发生意外外，例如酒驾嫖娼被单位开除了，你可以迅速满血回归。


    六，投资 1-2 个将来的人脉关系。例如你看中哪个人将来可能有出息，可以适当帮忙。这个不确定性很大，就当是买彩票。


    # 【家学，人生的隐形战场】


    穷人家的孩子，无论清华北大还是洛阳师专，在工作初期，大多数做事不行。因为他们的屌丝父母没有教过如何为人处事，孩子自身也只会考试。举个最简单的例子，你遇到利益分配，如何去争，既要达到预期，又要不少露痕迹，还要言行得体。穷人家的孩子，基本不懂这些门道。有的过于自卑，有的假装傲气，有的硬扯大旗。这些人在起初工资不高，工作还经常出错办砸，自尊心特强，说他三句，他就甩脸子了。（小干部家庭的孩子比较乖巧）如果经常批评这些年轻人，年轻人会对你产生敌对情绪。你为他好，他还恨你。


    如果不管他，让他到处吃隐形亏，他工作前十年基本就完了，最后这辈子也就那样了。我不知道该怎么，当然年轻人也不愿意听你的。我曾经遇到一个


    323'
  merge: -1
  img_proc: true
- pgno: 317
  md: '外地小姑娘，top 大学毕业，干活卖力，颜值中略偏下，可塑之才，本想委婉指点她几句，如何开展工作，结果撞上女 250 了，过于敏感的自尊心，不愿意接受任何提醒，甚至还要嘲笑你：你
    out 了，你过时了，现在不是这个潮流了。


    **人情世故，无非是做人做事，本质都是一样的。** 你现在看看大清朝的官宦笔记，也是完全适用。这些孩子们，大多数是可塑之才，由于家庭出身卑微，自身性格倔强，不懂人情世故，
    就这么走进了玻璃房，前途光明，到处碰壁，实在可惜了。我一般只会在不经意的时候，委婉的说一次，如果自己不领悟，那就结束了。


    # 穷人家的孩子要成功，真的很很难很难。


    **【为人仗义，好不好？】** 做大事或富人，没有一个是闷葫芦的性格。热情助人，善于言辞， 是成功的必须要素。但初入职场的你，在涉及复杂关系时，绝不能太仗义了。你的实力不够，
    搞不好被对方势力认为，丫的，来捣乱啊。你能做的，就是假客气，私下安慰几句，做点耗费时间，但也不得罪对方势力的事情。


    **【如何选择办公室的决战对象？】** 你在一个大单位，必有看不惯你的人，有欺负你的人。你在单位的口碑名气，必是通过一次略有影响的事件树立。对'
  merge: -1
  img_proc: true
- pgno: 318
  md: '你而言，这就是荣誉决斗。你的优势是，你可以选对手，既树立品牌，也不至于打击一片，选好决战对象，至关重要。较优的自卫反击对象是，一个大家都讨厌的人。


    为人父母，一定要有为子女牺牲的精神。我就这样，一辈子就这个目标，为了孩子。你也要这样。等你老了，你的孩子会感谢你的。


    技术人也要讲人情世故。技术要有人买，才是技术。90%技术工作，都是一般性事务，会的人多了。技术大咖，也有很多竞争者。举例，同样是在上海的德语口译，水平各有千秋，有的人生意极好，有的都是啃硬骨头。你说为什么？因为你不会做人，一条利益链上的人，都要分一点，才有生意。吃独食，没前途。


    【贵人相助】很重要。你再有本事，你要有买家啊，没人给机会，五年也就荒废了。星辉国际里的公主妹纸，随便拉几个出去，配上大牌导演+豪华制作，演几年电影，80%可以成名。但没人给你机会，公主也只能就在那儿陪笑脸，喝点小酒，一晚上赚个几千而已。'
  merge: -1
  img_proc: true
- pgno: 319
  md: '你说 怎么办？


    优质父母，应该把一切给到子女，毁灭一切自我意识。


    倾尽三代人的努力，让孩子在更高的层面上，取得一次机会。我家世世代代就是这样。我们家的男丁，生下来就是一大套的家国教育，不言鬼神，不畏生死，风雨向前，无愧先祖。败了无所谓，只要家族精神不丢，三代之后，卷土重来。


    理论联系实际。我是个优质油腻大叔，但从来不搞女人，不吃喝嫖赌，天天在家围着老婆孩子转悠，攒下一切资源给孩子买房。我有钱有貌，风趣幽默，跪舔一流，要想自己开心，真不难。但如果我只考虑自己吃干抹净，孩子怎么办？


    为人父母，要做到几条：


    +   1，少生孩子多买房。集中资源，薪火相传。


    +   2，中年男女都要管好下半身，不要到处打野炮。


    下半身一时爽，二房闹上门。


    +   3，时刻注意孩子的心理健康和学习进步。


    +   4，中年夫妻多努力，尽可能多赚钱。多写经验总结，树立一个良家风。'
  merge: -1
  img_proc: true
- pgno: 320
  md: '+   5，穷爸爸，退休后去小城市，把京沪房子卖了给孩子当首付。


    富爸爸，给孩子留下 1-2 套房子，上海内环线大平层，佘山别墅。


    不要让孩子为了房子，而委屈自己的婚姻。


    6，有了第三代，尽可能去干活。老丈人买菜做饭，丈母娘带孙儿。让子女们有足够的时间学习休息。富爸爸直接给钱。


    7，家族资产全部给孩子。


    8，孩子不争气，我们不要悲观，继续培养第三代。夺取社会资源的战斗，是整个家族几代人的竞争。个人的力量，犹如尘埃，微不足道。一时成败，无足轻重。


    【家学。有实战意义的教育，历来是奢侈品。】


    我说个书本上从来没有写过的，祖上口述传下来的小故事。明朝有个大案子，叫做大礼仪之争。说起来也搞笑，就是文武大臣争论，嘉靖法律上的亲爹是谁？嘉靖的老师，翰林院修撰，内阁大学士杨慎，直接反对自己的学生嘉靖，被自己学生廷杖三次，打的死去活来，也不松口，最后开除一切职务，发配云南瘴气之地充军。这个事情的奥妙在于，杨慎在云南，居然活的超级舒服。你想啊，一个皇帝恨之入骨的人，居然混的非常舒服，七十二岁才挂了，当中还回四川老家玩了几次。为什么？我后面讲。教育活动，在八十年'
  merge: -1
  img_proc: true
- pgno: 321
  md: '代出现了一个罕见时期，教育好像自己努力就可以的。因为当时是特殊情况


    首先，大家都没钱砸。社会上刚刚经历了文 ge，大家都是固定工资，也没老师敢收钱辅导。其次，社会上急需人才。只要是大学毕业，中级职称，在九十年代，京沪户口不是大问题。英雄不问出处。最重要的是，机会太多了，没人和你抢。据说马爸爸高考数学才考了几分，也读上了本科。只要自己跑到终点站，就是成功。进入
    2000 年，大家思想开放了，家长有钱了。各种各样的劣质补习班，饭桌补课出现了。但这种补习班，良莠不齐，也就是身边的几个老师互相介绍，没有什么选择余地。家长想找好的老师，也找不到地址。


    2010 年左右，互联网的普及，风险投资进入，好的补课教师被层层选拔出来了，这就进入高收费阶段。疯狂的金钱游戏开始了。


    **其实，历朝历代的实战教育，都是昂贵的。**


    学校教育，往往是不全面的教育。很多孩子被养傻了，自己还不知道！老师对学生说的每一句话，不一定是对的，而只是最符合老师的利益和学校的利益。'
  merge: -1
  img_proc: true
- pgno: 322
  md: '我们举个例子：一个孩子打了另外一个孩子。按照正常的逻辑是应该是当场打回去，这叫正当防卫。但是孩子打来打去，有可能会打伤了，学校就头疼了。如果一个孩子被打，不敢吭气儿，那是学校最愿意看到的事情了。所以学校老师千方百计的引导受害者，不要打回去，报告老师就行了。报告老师又怎么样？无非是去说两句而已，不解决任何问题。相反，那个受害的孩子会长期得到心理阴影。


    又比如大学生，如何为人处事，如何正确对待上级下级？老师是不会教你的，相反会用一套放之四海皆准的大道理，把孩子教的傻乎乎的。大学生真正走向社会后，会为此承担代价。青春很宝贵，刚工作的前三年，基本就决定你大半辈子的情况。


    我曾经在一个大单位工作过好几年。进单位前二年，被大小领导看上的，经过 20 年后，他们就是佼佼者。而其他人很难翻身。而这些日后飞黄腾达的大学生，往往来自于中上阶级的家庭。他们的为人处事非常聪明和有经验，这都是家里教的，而来自农村的或者是校穷家庭的平民孩子，往往就表现得傻乎乎的，不懂潜规则，往往是碰得头破血流，到了
    30 岁才基本明白，但那个时候他们已经没有希望了。'
  merge: -1
  img_proc: true
- pgno: 323
  md: '大单位里的农村娃，主要有四种。


    **一是农村精英家庭的子女**，主要是村长，村会计，乡里包工头。这群孩子的战斗力爆表。最大的表现是，媚上踩下。农村是靠实力说话的地方，能够成为方圆五里地的顶尖家庭，都是有一套非常实战的生存哲学。对上面，舔起来是感天动地。对待同类，往往是冷血无情，见死不救。这种人，要百倍当心，可以"利益联盟"，互相提防。


    **二是老农民家里飞出了金凤凰**。这种孩子苦出身，因为天赋极高，考上 985，但人情世故不懂，满脑子孝敬父母，非黑即白。这种人往往在单位里尖酸刻薄，心胸狭隘，好出风头，典型的穷秀才。他们坏心不大，但是容易乱说话。你多多吹捧他，技术厉害能力强，不要得罪他。可以"技术联盟"，点到为止。


    **三是各方面一般的农村娃**，往往是有个在系统里当大头头的亲舅舅。他们往往不知不觉沦为了探子，专门收集单位各种人的言论表现。你别看平平淡淡'
  merge: -1
  img_proc: true
- pgno: 324
  md: '的，厉害的很。


    **四是老实人**。是真老实，每天勤勤恳恳搬砖，就想多赚点，从来不敢惹事。这种人可以多接触。


    **人生有三个阶段，决定了孩子一生的事业。**


    +   1. **小学一年级，培养孩子喜欢读书的意识。**

    2. **初中二年级，培养孩子单兵作战的能力。**

    3. **工作第一年，培养孩子为人处世的哲学。**


    这三个阶段，都是对以前认识的完全颠覆。**特别是工作后的第一年。**


    读**书期间都是个人逞强，客观打分。工作后是，抱团取暖，拉帮结伙，不分是非，人言可畏。很多凤凰男就被打垮在这个阶段，十几年辛苦读书，基本白费。这些人，哪有什么希望啊？**


    **逆袭**？屌丝的情况是：做人做事没人教，买房买车没有钱，说话做事很刻薄，争强好胜惹人嫌。你拿什么逆袭？女儿也要穷养几年。最好是大学时候。真养出个傻白甜，女儿能不能过下去，还真是不好说了。我见过很多大小姐，表面上聪明，一到大事就糊涂了，因为人情世故不懂，很容易被穷人家的讨好，伪装和欺骗所蒙逼，心又不够硬，抹不开面子，傻乎乎的相信其他人


    331'
