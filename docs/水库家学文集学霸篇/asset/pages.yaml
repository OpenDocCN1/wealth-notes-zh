  md: '# **6.3学英语方法**


    外国人为什么喜欢看书，而不是像中国人看 iPad？很多人不理解。


    那我就用我的巨大学问来告诉你。


    +   1、 中文重视词语，句式简单。


    +   2、 英文法语西班牙语，重视句式，词语简单。


    +   3、 中文的句式表达基本和口语接近，用词不一样，有的用现代词，有的用深奥的典故，古语。


    +   4、 英文和拉丁文语系，句式十分复杂，和口语简直是两个世界。 要想写好文章，必须坚持看原著，学习巩固经典句式或千奇百怪的优雅句式，而不是 iPad
    上的快餐文章。


    +   5、 我年轻时可以用三种外语写论文，现在只会写段落了。


    # **如何学好外语？**


    目前的常规外语教育方法，是不科学的。六级通过，基本无法交流。但是，这也没办法。因为最科学的玩法太贵了，你们玩不起的。当年，我们学外语'
  merge: -1
  img_proc: true
- pgno: 99
  md: '的时候，是玩实战的。当时因为一个特殊情况，需要我们一个小班在几个月内迅速掌握一门外语，然后马上去工作。于是，给我们上全套了。那才是最科学的方法。


    我简单介绍一下那个超脱训练方法。


    +   1，全封闭。人不能出去，必须留在一个院子里。除了晚上睡觉，或着出去买点东西。这个环境里，一半是外语老师，一半是学员。


    +   2，全部外教，没有中文老师。我们当时一个外国字也不认识。怎么教呢？简单。看图说话。先教单词，不管语法。然后教句子，不问原因，就这么读。反正也没有中文教师，我们连蒙带猜，这倒也好，不考虑对错。


    +   3，激发潜能。每周淘汰一个人。这个是非常残酷的。每周的对话考试，简直是鬼门关。逼得你做梦都在学。有一个学员被逼的精神好像不对劲了。最后怎么样，我不知道，反正被送回去了。


    +   4，任务单一。你没有其他任务，基本与世隔绝。我们自觉关闭手机，没有电脑。就是复读机。'
