- pgno: 348
  md: '要记住：在你背后说坏话的，和你抢老破小的，和你抢土肥圆的，给你妈开保健大处方的，给你爹卖保健品的，卡着你居住证的，和你在地铁上争位置的，还真不是房东。你今后的人生，就是和这些人纠缠一辈子。你努力啊，房东没时间和你对骂。


    看到权贵，你就千方百计使劲贴上去，几年后，要么直接得到钱财，要么得到机会，要么得到经验。你不好意思贴上去，你就苦命了。这个话有点儿残忍，但哪个富一代不是这么过来的？也抄送女屌丝。屌丝不要相信独立人格，人格不是人，不会发钱给你买房子的。屌丝不要脸，成功在眼前。


    屌丝混职场，第一要谦卑。屌丝可以经常说说家乡的土特产、老家比上海差远了之类的招人喜欢的话。现在很多屌丝真的发疯，经常来一句，“去年某安徽亲戚赚了几百万”。混职场，说这种话要遭霹雳的。你要是觉得钱少，直接滚。某熟人经常说，能够在上海工作很幸福之类的低调话，十年后副处长了。如果你是混好单位或大公司的屌丝，你记住一句话，你的敌人，就是那些和你称兄道弟的同龄人。因为你们的资历业务差不多，机会永远不够，他有时无。所以，远离这些人，警惕这些人。关系再好，也不要吐露心声，因'
