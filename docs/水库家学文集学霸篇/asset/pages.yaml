  md: '从零开始，勤奋刻苦，学会德语法语西班牙语到熟练程度，需多长时间？


    中国人学外语，要么  500 小时速成，要么是学了二十年也不行，从来没有仔细研究过这个问题。我有一次问了几个哈佛的语言学专家，他们说，你要是能够考入清华大学的智力，熟练一门外语，至少需要六年。


    问：国人学习一门拉丁文字的外语，例如西班牙语，法语，德语，葡萄牙语，需要多久，可以读懂原版论文，日常生活口语？


    答：英语好的活，150  天左右。


    不要奇怪，我们都是这么过来的。我来解密吧。


    1，读懂原版论文，大概只需要 45  天。


    因为拉丁语言的单词，在学术方面，和英语是一样的。


    2.日常生活用语，大概是 1500  个单词。五个月还嫌多。


    3. 比较难的是语法。其实无所谓，你用最简单的语法，也能混混。


    4，听力，都是有具体场景的，


