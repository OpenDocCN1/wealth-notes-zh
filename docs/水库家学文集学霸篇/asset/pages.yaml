  md: '# 3.5 教育不全面，孩子被养傻


    学校教育，往往是不全面的教育。很多孩子被养傻了，自己还不知道！


    老师对学生说的每一句话，不一定是对的，而只是最符合老师的利益和学校的利益。我们举个例子。一个孩子打了另外一个孩子。按照正常的逻辑是应该是当场打回去，这叫正当防卫。但是孩子打来打去，有可能会打伤了，学校就头疼了。如果一个孩子被打，不敢吭


    气儿，那是学校最愿意看到的事情了。所以学校老师千方百计的引导受害者，不要打回去，报告老师就行了。报告老师又怎么样？无非是去说两句话而已，不解决任何问题。相反，那个受害的孩子会长期得到心理阴影。


    又比如大学生，如何为人处事，如何正确对待上级下级？老师是不会教你的，相反会用一套放之四海皆准的大道理，把孩子教的傻乎乎的。大学生真正走向社会后，会为此承担代价。青春很宝贵，刚工作的前三年，基本就决定了你大半辈子的情况。


    我曾经在一个大单位工作过好几年。进单位前二年，被大小领导看上的，经过 20 年后，他们就是佼佼者。而其他人很难翻身。而这些日后飞黄腾达的大学生，往往来自于中上阶级的家庭。他们的为人处事非常聪明和有经验，这都是家里教的，而来自农村的或者是较穷家庭的平民孩子，往往就表现得'
