- pgno: 293
  md: '标准，就是这个标准，绝对不可以打折。你对自己的努力打折，你的梦想就会对你打折。并且主动归纳总结，在不断改正错题的过程中，大脑里要想：哪些题的样子是类似的，哪些题的方法是类似的，并且能将其规律写在本子上。


    绝大部分题型，我都更新在个人微信朋友圈了。题目也整理归纳了，方便纵向复习。


    做到最后，做完最后一页时，你一定会有这样的感悟：很多题本质一样。甚至很多题，孩子一看就会做。这就达到了触类旁通的地步。'
