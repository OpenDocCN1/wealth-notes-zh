    很多女生，因为小时候读书成绩好，就有点 250 了，自以为自己什么都懂了。你成绩再好，有我好吗？呵呵。今后大学教育，男女同校要继续坚持，但录取要分开，女生不要高考了，高中毕业，然后直接摇号录取即可。对女性，不应该要求太高了，高中足以为。


