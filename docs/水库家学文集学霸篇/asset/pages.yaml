  md: '# ## 9.4学历与发财，文凭不重要


    # ### 什么是幼稚？


    如果你觉得考个什么雅思，cpa，人生就有希望了，那么恭喜你，你这辈子已经出局了！真正的成熟是找到一个适合自己的赚钱路子，然后再决定考个什么入门级的资格证书。拉单子才是正道。干活嘛，都是通用技术，大概找个人就就行了。


    # ### 学历不是赚钱能力。


    很多人把学历高视为本钱，这个是不对的。学历只能保底，例如找个工资还可以的工作岗位，这和买房子八竿子打不到。真的要赚大钱，你就必须提供一个大受欢迎的产品和服务，生产漂亮的灯具，开个家教补习学校，房产中介店，
    4s 销售店，让员工替你赚钱。学历和发财，没有一毛钱关系。


