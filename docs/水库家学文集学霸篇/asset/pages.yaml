- pgno: 126
  md: '我说个真事。某优质小学，孩子父亲是富人，孩子母亲是数学博士，全职在家带孩子。母亲还要去找小学老师搞关系拍马屁，否则孩子就会在学校受气。其实，这些课程，孩子母亲随便就教了，但不行，非要按照小学老师的步骤来，否则你家孩子就会被老师批评嘲笑。你说，这事情哪里去讲理？


