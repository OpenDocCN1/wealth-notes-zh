  md: '课间 15 分钟或 10 分钟，很多学霸就开始写一些易完成的作业了。在北京 4 号线地铁上，我常见北京一流学校人大附的孩子，还有蹲在地上写作业的。可能作业多是一方面，但更重要的一方面是，他们时间利用率非常高，做事非常高效。


