- pgno: 357
  md: '复旦交大，大家都知道，沪上名校。特别是复旦附中和华二，如雷贯耳，比大学还厉害。同济也是名校。我们那时候，同济以建筑，汽车，德语出名，现在不熟悉了。因为几十年前，能进桑塔纳是毕业生非常高兴的选择。那时候，正式编制不那么热，外资是热门。现在不一样了。


    华师大也是著名大学，虽然叫师范，实际上，我们都不认为是师范大。学他是一个综合性大学，文理兼备，各行各业都有，但是存在感不强，去中学的比较多。


    985是看各系总量的，上海还有一些好的行业学校，例如华政上外上财。但是体量小，估计混不上985。目前的户口口径抵在985研究生。如果放宽到985本，江浙皖闽，冀鲁豫的高考格局就有变化了。结论：小娃娃考试分数最要紧。985的含金量越来越高。


    # 3.考试很重要


    我对九十年代的户口还有印象，因为单位里，我对好朋友办户口比较有印象。当年，落户口有两个大的渠道，一是应届大学生，二是有中级以上职称。指标是发到单位学校，大学生是一张黄表格。应届大学生，成绩好的，一般都有，我听他们说，好像一个班级有十几张。


    还有就是中级职称，这个在单位手里。那时候，单位招聘，同意要你了，就给你一个表格。说起来是人才。但是，人才是很难判断的。一个人58岁发明了的计算机，他22'
  merge: -1
  img_proc: true
- pgno: 358
  md: '岁的时候能不能算人才？这个话，谁也讲不好。怎么办呢？划硬条件学历，职称基本也有学历因素。


    我们那时候，学历比较简单，就两种大专，本科。


    现在分类比较细了。我的意思是，万变不离其宗，考试太重要了。


    建议：如果你不能给你家娃娃买房买车，那就一条正路，考试。我家保姆的子女，小时候居然  在小县城学钢琴，最后高职毕业就没读了，我是目瞪口呆。你是什么条件，就干什么事情。对于一殷家庭，考试是正道。千万不要想入非非。你家女儿20岁走艺考，还是在华尔街大读书好？


    如果读书不行，就考个职业技能，例如会计，小师范。千万不要荒废学业。你不要以为自己娃啥都行，艺考文化双一流，不可能的。


    +   4.高中怎么办？我仔细研究过衡水模式，无非是当年我们那一套打法。


    高中的特点是，家长彻底没办法了。我高中的时候，有个同学家长是 985  教授，没用，根本没帮助。高中的数理化，难的飞上天。绝大部分孩子基本靠努力了。我简单说说，怎么安全度过高中，混进前一半（本科）。


    # 一，找准动力


    高中孩子已经是人高马大了，家长打不得骂不得。搞不好，家长会被腰戳趴下了。所以，千言万  语，循循善诱，没用。关键是孩子自己努力。努力要有个动力。高中最大的动力是面子。高中同学最要面子。因为高中已经有喜欢的女生男生了。要想在班级里博得  女生'
  merge: -1
  img_proc: true
- pgno: 359
  md: '好感，在同学里有面子，必须成绩好。这就是动力。


    # 二，高价辅导


    我们那时候，没有商业辅导，我是校长亲自辅导数学课的。学校指望我挣面子，还有几个同学，父母是高中老师，在家拼命。现在不可能了。家长就要想办法了。最好的办法是找个长期陪练，985，耐心，全力以赴。上哪找？给钱呗。一年5-15万。


    # 三，大量刷题辅导什么？


    无非是刷题讲题。一节课一张卷子。发了疯的赶进度。


    # 四，孩子努力


    所有的灌注，说到底，还是要孩子吃的下去。吃不下去，再多的营养也是浪费。如果家里穷，就要让孩子认清形势，如果家里富，就要孩子有危机感。你那个死鬼老爹外面还有个娃，你不行咱们就算完了。”


    5.孩子的未来，就在我们一念之间


