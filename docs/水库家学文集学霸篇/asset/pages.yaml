  md: '学历最能干，买菜算账，一把好手。小学文化，看悟性。有的比较精明，有的是 250，前说后忘。


    上海，所谓的金牌保姆，大概是月入 1 万多，加福利。永远没有失业风险，住别墅大平层的单间，和东家吃一样的。如果是高中生，开 1.5 万，完全 是可能的。但是，基本没人干。大部分保姆，工作不累，地位不低，做六休
    一。大人孩子白天读书上班，她就是打扫卫生，看看电视。假设有老人，也 就是做个饭，不是伺候人。卧床老人是另外算的。东家对保姆是很客气的， 因为这是内部人员，如果给你捣鬼一下，你也怕啊。


    保姆主要是，讲卫生，做菜要可口一点，不能用农村的搞法，不管不顾的。 这需要培训。但是，大多数农村保姆记不住的，培训走过场。真正顶事的保 姆，大概需要初中文化。例如填写个快递单，家里买个什么小配件，小学就
    不行了，初中的勉强。高中文化是最佳的，但我找不到。


    很多高中生，四十五岁之后，可能也就是做个营业员或者保安，一个月 3500 元，累的浑身酸痛。这个就属于有文化但不会用的。


