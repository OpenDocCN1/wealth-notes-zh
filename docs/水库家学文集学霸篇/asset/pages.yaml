- pgno: 197
  md: '想主义害了的，比如有的孩子觉得摩天大楼建的漂亮就要学建筑或者土木，有的孩子看到火箭上天就要学航天，有的孩子看到大型船舶很震撼就要学船舶。


    中二的年纪有这种幼稚的想法是很正常的，作为家长的，一定要帮助孩子消除这些不切实际的想法，及早帮孩子认清社会现实，老爹有钱孩子随意，可以追求梦想，可以试错，老爹没钱的孩子就得奔钱走，没钱谈个屁的理想，等孩子有钱了，孙子再谈理想吧。


    另外，咨询建议的时候，尽量问那些“成功人士”，提炼对自己有用的东西，自己不认识可以找人帮忙甚至花钱，不是什么三姑六婆阿猫阿狗的建议都要参考的，loser的建议根本不要去听，他们没有眼界，学校老师的意见也要谨慎，很多老师也没什么见识，他们只知道学校的名气，他们对于大城市什么职业是吃香的，完全没概念，这些东西家长意识不到位都会害了孩子。


    # 新一年高考又双来了。填志愿选哪里？


