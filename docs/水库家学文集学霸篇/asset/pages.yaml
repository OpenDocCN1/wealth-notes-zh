  md: '父母只是孩子成长阶段的一个同路人，之后的人生是他们的了，你也别想太多了。孩子能够读出来，自然是最好，如果读不出来，那就务实一点，让他练个养家糊口的技术，哪怕是做个小生意，也是可以的。


