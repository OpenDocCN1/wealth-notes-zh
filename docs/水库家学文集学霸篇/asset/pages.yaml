- pgno: 352
  md: '稍微像样一点儿的房子。当然，如果上海嘉定南汇的某拆迁妹，偶然翻了你的牌子，你的人生从此就与众不同了。地段决定人生。


    如果你为了图自己轻松，建议去中西部省会就业，再找个工资尚可的老婆，努力五到八年，攒个省会首付。但子女又要重奏一次你的进京沪之路。如果你愿意牺牲自己，有两条路：一是去京沪拼命工作，一辈子租房，退休前买个极偏远的小房，等待户口政策开口子；二是学习凤姐。熬个四十年，肯定有机会。


    去京沪，须谨慎。用高房价来赶人，是比拟理想的办法。如果你不准备为孩子牺牲一辈子，那就建议同学们去省会城市发展，不要在京沪熬了。个人的努力，比不上资本的力量。来沪的小博小硕小本，我建议，最好去南汇奉贤嘉定崇明等区县。下了车，最快速度相亲，找个拆迁妹妹，一切全部解决。在陆家嘴和外滩上班的金融
    狗，表面看，好像很有面子，一点儿也不实惠，下了班还要挤公交车回出租屋。十年打工，也无力首付车程一小时以内的房子，肯定是人生悲剧。


    努力二十年，再回市区。


    如果你打算创业或者经商，首先要学会怎么管理员工。


    我是怕员工的。我公司办公集中在某一楼层，如有一个员工大吵大闹，肯定影'
