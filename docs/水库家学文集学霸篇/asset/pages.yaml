- pgno: 121
  md: '1，心理指导。考之前一定要告诉孩子：你做的题目已经够多了，考场上遇到不会的，不要慌，因为你不会，别人也不会。先把会做的做完，回头再看不会的。


    2，目标设定，考京沪深会 211，争取 985。不要定位什么清华北大。特别难的理科题目，直接放弃，会做的，做两遍，确保不出错。这就肯定可以考上 211 了。


    3.作文课是有套路的。现在的作文题是给一个大家想不到的新材料，让你在某个不熟悉的写个感想之类的。这种题目关键是过渡。你事先准备五个作文套路，练好过渡句。绝不要求新求怪，争取拿到
    80%的分数就够了。


    我对小学生家长的建议：抓早抓好。


    小学生第一天上课，就要抓学习。回家后，对照当天的课程表，逐一复盘。可能小孩子坐不住，哭哭闹闹，那只能殴打了。这也是没办法。自己舍不得打，将来被别人碾压。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '如果家长学不下去，或者太忙了，必须找个全程家教。现在的大学生家教，都是为了赚零花钱，对教育本身没什么兴趣，只是讲解几道题目，一两个小时就混完了，三百元给我。他们不可能给孩子们进行解题规律的系统性总结。因为这个太花时间了。


    可以考虑，家长辞职一个，孩子学，家长也学。家教负责解题思路，家长负责归纳总结，为孩子们形成整体学科知识架构和拾遗补漏。这样做，孩子们才能成为前几名。


    孩子们如果一年跟不上，那可能就毁了，因为他可能失去了学习动力。所以，辞职一个家长，也是迫不得已。不要相信孩子会突然开窍之类的异想天开。


    现在不比以前了，我们那时候，家长都不管，自然生长。现在的 985 家长，简直是逼的发疯了。我认识一个理工科女博士，不上班了，就管孩子学习。现在，京沪的很多
    985 家长，思路已经很明确了。给孩子买婚房，那是不要想了，但家长给孩子拼一个 985 学历出来，是可能的。儿子将来是骗丈母娘房子，还是去加拿大移民，你随意。'
