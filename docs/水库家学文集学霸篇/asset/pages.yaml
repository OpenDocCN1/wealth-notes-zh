  md: '看本书。并告诉孩子，最近爸爸（或妈妈）的目标是看完某本书，目前已经看了 124 页，快一半了……哈哈哈，给孩子一种爸妈和孩子在一个战壕里，为明天的更美好生活共同奋斗的感觉。


    （2）开始写作业前，问一下子孩子总作业量，目的不是家长关心作业多


    而是孩子回答完后，自然下意识里会根据总作业量对时间上有大概的安排。


    其实，主要起到提醒孩子的作用。


    （3）写作业卡时间，到时间仍写不完，就告诉他（她）不要写了，自己明天找老师解释，马上去睡觉，也不能早起偷偷写。学会让孩子为自己的拖拉承担责任。


    （4）孩子再小，不要盯着他做作业，不要呵斥他（她）“快点写”！


