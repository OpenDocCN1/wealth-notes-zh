- pgno: 30
  md: '，表面上聪明，一到大事就糊涂了，因为人情世故不懂，很容易被穷人家的讨好，伪装和欺骗所蒙逼，心又不够硬，抹不开面子，傻乎乎的相信他人，最后损失惨重。


    # 给年轻的妈妈们的建议！


    一定要注意孩子的视力，成绩中等即可，身体好，视力好，以后选飞行员，当兵，考军校，都是出路。带个啤酒瓶，痛苦一生，最爱一生，我与你生死与共！


    # 为什么 985  的孩子考试比较好？不绝对，但普遍成绩好。


    我这个年龄的 985  基本属于考试机器。长年累月的积累，考试经验和学习方法是比较先进的，无法言说，只能是代代相传。985  的孩子，智力水平基本是中上，正确的学习方法，稳定的学习环境，家长又言传身教，一般成绩都比较好。


    # 富孩子不会天然比穷孩子蠢。


    大部分情况，富人家孩子更加容易出彩。因为现在的教育环境越来越依赖金钱。如果你给我 30  万一年，我可以全天候陪你和孩子，配合学校把各个学科抓上去。不说考清华，985
     的可能性是极大的。12  年就是一套房'
