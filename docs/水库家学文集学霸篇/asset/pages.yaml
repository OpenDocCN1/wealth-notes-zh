  md: '大学毕业进入体制内单位，所有的人都非常疲劳。早上八点半到单位，至少六七点就要起床了。晚上六七点到家里，吃饭洗澡就累的半死了，如果辅导孩子作业，根本不用活了。哪有什么心思去发现美，创造美？那个腰围胖了三圈的女人，我也不想多看一眼了。99%的人，就这么昏昏沉沉的混到了五六十岁。最多是有点小地位了，嗨两次妍头。


    我意外的走了歪路。我失业后，花了很多时间研究美。起初是工业设计，滑板车怎么做的好看。我就研究。先是凭感觉，再拆开项目，一点一点感受，再看看理论。慢慢的，我就稍微知道一点了。其实，就这一点点区别，我就赚钱了。我的滑板车总是比老王家的稍微好看一点，市场欢迎。


    自从淘宝抄号族开始流行后，我就倒闭了。没办法，混不下去了。我没事就研究男生商务形象设计，隔三差五的梳个发型，装成功人士，和我老婆去吃个大餐，和其他有钱人聊聊天，也不丢份。


    我说这个事情，其实是为了提醒一下各位理工科985，虽然你很忙，但你还是要研究一点审美。这玩意很有用。失业了，你就算摆地摊，也可以'
