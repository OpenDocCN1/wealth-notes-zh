  md: '。大学培养的是懒散自由，胡说八道，特立独行的个人风格。而社会需求是，纪律严明，令行禁止，吃苦耐劳的劳动者。很多大学生，第一年上班就受不了了，好几年才能适应。而大单位，第一年的工作表现，几乎决定了其今后十年发展。


