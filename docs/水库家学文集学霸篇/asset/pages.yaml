  md: '# 8.5跳过大学里的坑


    【管住自家孩子，远离高利贷】


    现在的高利贷团伙很黑心，盯住二十岁左右的小孩子，借给你一万，要求 45天还三万。若还不出钱，就变成 9万，不断累积，年底，你家房子就是别人的了。问题是，小孩子被恐吓了，起初不敢说，最后高利贷团伙上门闹事了，就无法挽回了。这种借贷纠纷，派出所很难管。


    高利贷团伙比一般人聪明多了。他们在法律方面的细致谨慎，远远超过一般人的想象。高利贷团伙要养一批人，产品推销的，方案设计的，操作跑腿的，打人闹事的，成本非常高。如果你一个普通人读了几天合同法就想破局，你当高利贷团伙是
    250 啊？管好自己孩子和自家男人，别上了高利贷贼船，否则太麻烦了。各位大学生家长，你们今天晚上打个电话给孩子。牢记血的教训；避免重蹈覆辙。


