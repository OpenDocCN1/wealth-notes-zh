  md: '# 致年轻人的一封信


    从普通院校毕业的大学生，在你们今后人生的道路上，你们会遇到太多的愤怒、悲伤、无奈、绝望的事情，特别是你结婚后，那是各种麻烦接踵而至，让你精疲力竭，苦不堪言。这个谁也解决不了，你就熬吧。你要是运气好，熬到
    35~40 岁，基本能走出困局，但大部分人走不出来。不要为过去悲伤，谁也没办法，你管好将来。面对高房价、低收入，没有女友，到处憋屈，不要抱怨啦，我给你们一个建议：找一个自己能够坚持十年的行业，一头扎进去，不怕吃亏，不怕吃苦，十年后，你就是本地区这个行业的中流砥柱了。房子、老婆，还是会有
    的。当然，你要是坚持批判现实，指点江山，幻想打土豪、分田地，那么，你的子女只不过是重走一遍你的路罢了。


    除了工程技术类的二本，其他文科社科专业，读不读都一样，用人单位不会仔细看你的文凭，就看你是不是干活勤快。若是遇到二百五的 HR，找隔壁小王借一个文凭复印一下也可以，没啥的。小老板不会去查的，因为查询要花钱的，小老板舍不得花这个钱。二本屌丝的奋斗目标是国家单位。99%民'
  merge: -1
  img_proc: true
- pgno: 346
  md: '企生存周期是五年，任何民企黄金期不超过三年。年轻时在京沪混喂青春饭，男屌丝跑销售，女屌丝做行政，谈一场穷得轰轰烈烈的恋爱，好像很浪漫。但过了35岁，经济压力袭来，男人消沉，女人出轨，比比皆是。


    男屌丝的脱贫标配：公家单位+拆迁妹，其他皆浮云。二本妹注意了，隔壁班的那些男孩子大多是屌丝，妹妹就不要理他们了，毕业后都是去群租房的货色。


    年轻人真要读书，就读实战书。喜欢政治就学法律。喜欢经济就学税法。喜欢文学，就去学写作。千万别读废纸一筐的萨缪尔森、《国富论》、《货币战争》。这种书只会误导你，自以为是解国事经济，其实你连支票也不会填写，报纸也看不懂，一实践就二百五。实战中，你自然而然会想，为啥要这么规定？那时，你就真懂了。熟读凯恩斯、萨缪尔森，还不如装热水器来钱。真的，别骂我，这是事实。


    买一张二本文凭，搭进去四年时间和父母10多万现金，如果没有在学校里找到一个土肥圆，那是亏吐血了。出了校门，你就是二百五，没房没车没希望，土肥圆都鄙视你。不要愤怒，谁让你考不上清华研究生的，这怪谁啊！


    有人用“人人都高贵”来忽悠大学生，毫无意义。你住在京沪漂亮公寓，对'
  merge: -1
  img_proc: true
- pgno: 347
  md: '住在群租房和地下室的人说，你是高贵的，真好笑。我希望你能看清现实，努力去涉公单位工作，赚钱买房，踏实生活。现在，大部分私企不太好，少部分私企暂时得到融资还不错，但是长远看，还是不行的。国企机关事业好，努力去考吧。


    **在你成功之前，不要为亲戚人情所累，没意思的，特别是春节前。**


    学个特别精通的技能，攒钱买个房。找老婆，不求多好，先过小日子。挤进中产的机会有时候还会不经意地出现几次。过日子精打细算，洁身自好，不要黄赌毒。身体当心，别吃垃圾食品。把英语学一下，以后不用请家教花钱了。


    **不要和别人争论无关紧要的事情。**很多人的价值观和思维方式是与生俱来的，长期贫困底层练练就的，不可能因为你几句话就改变的，他们大多数还自以为很聪明。与人争论的结果是，他在心里骂你是傻。正确的做法是：假装认真地倾听点头，实在觉得他傻，就找个借口走吧！也不要去学管理。管理的前提是，你先要有个大企业，先给百十来个人发出工资。屌丝应该先学一点手艺技术，例如挖掘机、码农、制图、拎灰桶、搬砖。等你赚到了首个
    1000 万，有钱可以开家大工厂了，那就抓紧考虑买房的事情。


    354'
