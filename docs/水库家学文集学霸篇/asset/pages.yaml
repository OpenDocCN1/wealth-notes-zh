  md: '# 1.4学校的作用


    问：你这么厉害，就不要孩子上学了，你自己教吧。


    答：上学的目的，不是真的要和老师学什么。上学的重要意义是：


    +   1，基础简单的数理化，由老师教一下。


    2，适应集体生活，树立集体观念。


    3，培养同龄人之间的竞争意识。


    4，让孩子知道人世间的各种情感：


    拍强者马屁，互相坑害队友，举报揭发，谈恋爱。


    5，熟悉别人在想什么。


    6，通过各种考试比赛，逐步树立信心，那群蠢货也就这样了。


    问如果孩子教育靠家长，那要学校干什么？


    花那么多钱把孩子送到学校干什么？中国实行 9年义务教育干什么？正是因为父母忙于工作，才把孩子送到学校，让专门为教育工作的人去教育孩子。每个人都各负其职，这个社会才会和谐。学校把孩子教育好了，父母才能一心一意的工作。教育是老师的天职，也是老师的工作。


    答：这种家长，自己嫌累，就想把孩子推给学校，怎么可能呢？学校只能教'
