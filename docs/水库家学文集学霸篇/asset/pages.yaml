  md: '会他识字，算术。你要想考 985，那就没人包了。老师的作用是，尽可能让大部分孩子毕业。其他不要想多了。


    问：你有房子，就不让孩子读书了？


    答：读书是需要的，收房租也要看得懂合同。出门旅游也需要懂一些外语，装修房子也要懂一点基本的物理化学知识，找对象也要拿个英国硕士学历，撑撑场面。但不必苛求是清华还是复旦，考个立信会计之类的也算合格了。人生需要的是综合平衡，而不是单一指标。


