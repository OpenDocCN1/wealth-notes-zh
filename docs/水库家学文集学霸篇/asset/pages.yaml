  md: '# 第一章  教育理念


    # 1教育本质


    # 1.1关于教育


    什么是教育？


    对于 90%的人而言，教育是谋生手段。


    大学的起源是，富人孩子为了追求精神享受，或者科学怪才推动科学发展， 这是极少数的事情。现在搞笑了，农夫的孩子不种地了，去追求历史沧桑感了。平民的孩子去学习企业管理了，你的企业在哪？


    我曾经去过一个扶贫帮困结对子家庭，资助读书孩子。我至今印象深刻。我们去帮扶，也就是带点大米食用油，再给点钱，然后报告居委会。我们总不能说，放下就走，还要鼓励加油啊！于是没活找活聊几句，再拍点照片，凑满二十分钟再走。


    聊什么呢？那些老大姐也聊不出什么？就来一句，你考大学，准备考什么专业？那孩子把我吓了一跳。她要考企业管理专业，今后当老板。然后，她描


    7'
