  md: '我老婆以前就是翻译，一天商务口译，参观走访类，不是法律谈判，劳务费八百元。这个算是奖励的单子，因为管一顿饭。如果你笔译做得少，这种单子还抢不到。笔译，主要是各种乱七八糟的机器说明书，会展说明书，千一天也就是四五百元。问题是，活不多，抢单子激烈。


