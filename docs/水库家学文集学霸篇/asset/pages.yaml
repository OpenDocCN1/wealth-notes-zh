- pgno: 7
  md: '绘了一下，她的人生计划。


    首先，她要走遍千山万水，世界各地（就是贪玩）。再成立一个旅游公司，把生意做到世界各地。上海人喜欢旅游，公司前途远大，最后上市成功。赚了钱，孝敬父母。后来她考了个二本，市场营销专业。现在做淘宝！


    其实，这种家庭最合理的安排是，女生考师范，毕业当老师，那时候很容易。主教数理化，周末再抓点小猪仔，年入三十万。再找个经济条件好的外地男。可惜，被父母带傻了，胡思乱想了。


    教育的目的是激励人，培养人，鼓舞人，而不是为了淘汰某些请不起家教的孩子。我们的青少年，读书是为了知识吗？可能更多的是为了淘汰其他同学。全社会选拔出千分之一去清北，3%进
    985，12%进 211。你有没有知识，有没有人品，无所谓，这个不考。


    你在小学二年级的时候，就可能因为鸡兔同笼，被淘汰到差班了。孩子才八岁啊，孩子得罪谁了？我连兔子都没见过，兔子就把我淘汰到差班了，合理吗？'
