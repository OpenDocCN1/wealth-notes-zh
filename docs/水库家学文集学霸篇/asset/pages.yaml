  md: '# 8.4怎么读 top 10 大学


    # 清北是不是最聪明的人群？


    **答：他们只是考试最聪明的。如果上战场，上商场，只能算是中上，不敢说第一。聪明是相对的。围棋九段不一定是乒乓球高手。**


    少数人把文凭当做科举，所以才会有一些不切实际的想法，


    # 清北复交，真有用吗？


    **答：若不是搞科研，我认为大多数没用。理由：**


    +   1，人数少，影响力低。清北复交，分散到各个专业，每年不过几十个人，一大半出国改行，真正进入专业工作的人，微乎其微。当然，也有例外，据说五道口的财经类还可以。但是，其他专业，我并不觉得有什么压倒性优势。


    +   2，进单位后，同龄人防着你。你自带光环，大家怕你抢风头，自觉围堵你。领导对你有不切实际的高期待，往往导致你不堪重负。


    +   3，清北复交最实用的领域，应该是倒插门。


    +   4，真正娶媳妇，还是看经济条件的。你就算有个 985 博士，没房子，京沪也吃不开的，反而是读书读傻了的反面教材。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '建议：抛开面子，最实战的学校应该是人数多，知名度高的专业院校。


    例如，上财西财央财，西政华政中政，北航南航，北邮南邮，华东化工北京化工，各石油大学。或者按照专业分类，例如吉大汽车，西交汽车，同济汽车。码农是华中等。


    这些学校本身也是好学校，这么多年，系统内到处都是，长年累月，形成了一定的知名度，大家普遍印象好。


    # 为什么要上清华


    # 【京城四校： 从政风格记】


    中央国家机关中，京城四校（北大，清华，人大，法大）毕业生从政者众：


    +   （1）北大毕业生，不太好用不屑抱团；


    +   （2）人大毕业生，很好用但喜欢抱团；


    +   （3）法大毕业生，基本够用也不抱团；


    +   （4）清华毕业生，很好用且因而不抱。


    结果是，北大的，自由独立，个性张扬，机关还没混熟，就纷纷跳槽了；人大的，专业扎实，但因校友抱团，领导多有提防，结果是易为 “将才”'
  merge: -1
  img_proc: true
- pgno: 215
  md: '，难成 “统帅”；法大，踏实好用，领导喜爱，但校友互不提携，晋升慢，爬不高；相比较而言，清华毕业生，严谨笃行，既能脚踏实地，又能仰望星空，校友之间明着不抱团，实则提携互助，从中国政坛的人事格局，也可以看出清华毕业生，具有更高远的为官智慧和政治传承。


    某北大科班出身领导谈道：“最欣赏清华学生，上去一个，提拔一批，上去一批，提拔一群，一茬一茬，牢牢掌控关键位置。最反感北大学生，个个精明，最喜内斗，井底之蛙相互掐，一人升天必然一人落地。至于人大学生，志向远大，行事散漫，抱不成团，做不成大事，罕见爬到高位的。”'
