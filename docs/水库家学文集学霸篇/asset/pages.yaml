  md: '# 第二章幼儿园，练习惯


    # 1.1儿童教育怎么做？


    # 一，各种培训班都报一遍


    真不是为了去学什么。那些农村出来的高职女青年，就别太指望她们能够教什么了。我的目的很明确，打破神秘感，顺带家长休息两个小时。每个孩子都有好奇心，没玩过的游戏，就是好奇，玩过几次了，也就无所谓了。孩子之间也有谈资。你没参加过，就自卑了。


    # 二，提前熟悉课程，打破陌生感


    我家孩子已经开始接触语数外了。我不是那种一本正经上课，而是玩中带学。给十块钱买糖，要找回来几块钱？你答对了，我们就去买。几个拼音，背会两个就去玩。儿童的记忆力很好的。一般五分钟就搞定了。积少成多，熟能生巧。


    # 三，用大学的学习框架塑造小学教育体系'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 每个家长都听说过一个词“打基础”但99.99%的家长不知道


    什么是打基础。打基础，就是建立思维框架，思维逻辑。通过家长暗中的思维控制，以看不见的手段，引导孩子进入正确的学习方法。拿乐高玩具举例。优秀的孩子，就是按照图纸拼积木，拼出来就算高分了。还有60%的孩子拼不出来。但我孩子不是这么玩的。我家孩子是大学的训练体系玩的。


    +   1，先不拼积木。把课程结构说一遍。例如一个城堡。


    +   城堡分为几个部分：屋顶，墙体，门窗，花园，园丁，花草。


    +   2，归类


    +   哪些积木是屋顶部分的，哪些是花园部分的。


    +   3，定计划


    +   今天完成屋顶部分。以此类推。


    +   4，搞协调


    +   把各部分衔接点找出来，放在专门地方。


    +   5，动手组装小模块


    +   一个玩具，分为五个过程，目的是建立逻辑思维。


    +   大部分孩子拿到玩具，一阵乱玩，三天就不感兴趣了。'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 四，去碾压同龄人，建立自信心


    我们其实在家里已经完成了语数外启蒙了，根本不需要去报幼升小补课班了。但我还是报。我的目的很清楚，去碾压同学。孩子每次小测验回来都是第一名。老师表扬，同学巴结，心情美美哒。


    其实，这个结果是预料之中的。我是让孩子感受一下，长期做第一名的自信心。我不比别人差，只要我努力，我也是第一名。


    # 五，最难的是持之以恒


    道理不难，你做的到吗？


    # 小孩子还是要去幼儿园。


    现在，有些神奇家长，自以为是，觉得学校学的知识没用，不如自己教的。其实，这个是很愚蠢的想法。学校的课本知识确实用处不大。我现在初中数学也不行了。但是，孩子们在学校里还要学习集体生活，人际关系，互相斗争，各种龌龊也要看一看，例如偷东西，作弊，欺负弱小，拉帮结派，'
