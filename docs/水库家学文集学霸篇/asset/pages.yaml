  md: '# 11.10以为孩子上课听懂了，其实根本还不会


    下课了  孩子从教室蜂涌而出  有一位家长  一直待学生散去  然后赶忙和老师说两句：“  老师  您好  我是 XX的家长  您看他 （她） 课堂上怎么样
    ？ 能听懂吗 ？  能跟上吗 ？  这是我作为老师 经常会听到的一句话。


    由于绝大多数朋友 不是教育行业的 “能听懂吗 这是问得最多的一句话。或者说 怕孩子听不懂 这是家长朋友们最大的一个担忧。我倒觉得家长们其实问错了！为啥呢？
    谈一下自己的浅见 仅供朋友们参考。


    我教了好多孩子了 真正课堂上听不懂的是极少的（ 除非是主动不听的）  因为听懂一堂课 只需要最基本的公式、定理。


    因此  只要孩子课堂上认真听  不说活  注意力适当专注 就一定能听懂。但孩子们往往有一个误区 认为听懂了就会做了。 其实听懂距离会做还差 八丈远呢！


    数学、 物理中 听懂# 会做。


    上课听懂的过程 就特别类似于 老师是公交车司机  孩子是乘客。解一道题 如同开车载若孩子  从世界公园门口到北京西站 怎么走、什么时候拐弯、什么时候走辅路  、哪个口儿上桥、怎么绕、什么时候出辅路
    其实孩子自己动脑子的地儿并不多！ 因为老师会一直引导孩子前进。


    而孩子自己做题的过程 就如同让他自己开车 从世界公园到北京西站。您看他  在只坐一次公交车的前提下  能自己完成任务吗 ？ 对了 并且还有时间限制 因为考试是有时间限制的。


    大部分孩子都不行。 因为自己开车和坐车是两码事儿。 好多朋友都会开车 也肯定'
