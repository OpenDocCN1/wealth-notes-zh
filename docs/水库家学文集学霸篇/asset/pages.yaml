- pgno: 192
  md: '# 6.6合理安排时间


    高考前半个月怎么过？


    作为一个九十年代的高考尖子生，我谈谈自己的体会。


    # 一，把每天的最佳时间，调整到考试时间


    假如上午九点开考。那么你正常情况应该是六点半起床，厕所洗漱，吃早饭。八点以后，不要大口喝水，渴了小喝几口。八点半后，绝不喝水。考完再喝。你应该八点半离开酒店，步行过去。家长陪同最好。考前尿一次，然后两个小时不上厕所。考前半个月，就要这样习惯了。晚上十点一过，洗澡，放松。十一点前，必须上床。保证七八个小时休息。


    # 二，制定学习计划


    每天学习 8-10 个小时以上，每门课，看两个小时。记住：主要是看，少量复杂题做一下。看题速度快，可以复习更多的知识点。平均使用力量，不要专搞一个科目。语文一分和数学一分，是一样的。


    # 三，注意饮食，不要受伤生病


    吃的好一点，蛋白质高一点，干净卫生，不要叫外卖。'
  merge: -1
  img_proc: true
- pgno: 193
  md: '家里做。不要吃猪肝，四季豆，容易出现食物中毒。


    **不要去太远的地方，少坐车，避免意外伤害。**


    我高考前，居然得了眼结膜，一只眼睛红的不像话，


    多多少少还是影响考试的。


    # 四，家长不要吵架，假装夫妻恩爱，万事无忧。


    # 五，学生不要看电视手机，家长看一下。


    考卷五月份就印好了。近期新闻无意义。但是家长注意收集素材。如果出现重大新闻，给孩子讲几句，或许可以用到作文里。内容不需要太深，知道就行了。


    # 六，最后十几天，就是无休无止的刷题，看错题集。


    # 七，考前那个晚上保持平常心，


    我高考前一晚，失眠了。失眠就失眠，也无所谓。


    把眼睛闭上休息就行了。


    # 八，考完不要对答案


    你假设自己全猜对了，已经考上清华了。


    安安心心考下一课。陪同家长也别问考试。'
