  md: '如果实在没办法，也只能刷题了。我已经开始预习小学所有课程了，买了全套的人教版小学教科书。数学模型，语文练习册，外语教材，一应俱全。我现在已经在测试，孩子在什么环境下，用什么办法，最容易记忆语数外。这个很重要。你也试着看。


