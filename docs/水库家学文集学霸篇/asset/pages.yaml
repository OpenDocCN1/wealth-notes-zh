  md: '# 11.5大家都一样辛苦， 可为什么最后考上重点的， 依然是少数？


    很少有人去想过这个问题。这个世界，要想名列前茅，你的思维一定要与绝大多数人不一样。


    思考透问题的本质，才更易达到目的。


    中高考的分值，体现的不是 ` 努力度"，而是 ` 投入产出比"，学习本质是 ` 拼效率"，而提分的本质是 ` 补短板"。 不同的学生， 学的东西不同， 时间利用率不同，
    最终收获不同。 这是分值差别得根本！


    应试年级的努力是常态， 但学什么更重要！ 怎么学更重要！ 而不是每天忙忙碌碌地傻学！ 这就如同 每人心中都有一个 ` 土豪梦"， 却在工地不停地搬砖。


    2011 年， 我毕业工作第一年， 在公交车上， 我就想过这样的问题 为什么有人月薪 5000， 有人 5 万， 甚至有人 50 万呢？甚至是同一个行业，
    不同的人， 10 年后， 收入差别巨大？！


    核心根本就在于， 工作内容不同， 投入产出比不同。 因此， 尤论工作， 还是学习， 一定要做 ` 投入产出比" 最高的东西。


    对于学生， 思考才是最重要的 思考学什么才是最重要的 思考怎么学才是最重要的！ 对于成年人， 思考做什么工作才是最重要的， 怎么工作才是最显要。 之后才是努力！


    所以， 才有我常说的那句 有思考的努力才有用。 切记 每天忙忙碌碌的感动自己， 没人在乎你的汗水， 这个世界还残忍'
