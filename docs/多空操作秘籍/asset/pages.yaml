- pgno: 116
  md: '遊戲永不改變。圖3-23與3-24顯示類股與個股的型態近來十分類似的狀況。從一九八六年八月開始，我對石油類股的態度即轉為多頭。該類股向上突破重要壓力，相對強度線美妙地翻升而進入正値區域。最後，絕大多數的石油個股圖形都大聲急呼「買進」。非常有趣的是，原油價格每桶接近10美元，人們甚至擔心它將一路跌到每桶6到8美元(註11)。這種情況恰好是一九八一年初的反面景象，當時石油有新聞標題的鼓吹，卻無技術面的支撐。這是在相反意見中採取行動的傑出範例。《專業軌跡解讀》所推薦的十餘支石油相關股（石油、鑽油以及石油設備）在這段時期都有傑出表現，也就不令人驚訝了。其中有幾支個股，例如American
    Oil Gas（圖2-24）更是令人嘆為觀止。


    (註11) 圖形能夠神奇而精確的預先反應未來。一年之後，不僅石油股上漲，甚至原油價格亦接近每桶22美元。'
