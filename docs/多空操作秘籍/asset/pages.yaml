  md: '還有一些工作待處理。繼之而來的下跌使ＡＳＡ下挫到34.375，該處約高於左肩底部約2點。在下一波彈升開始時，右肩已完成。然後連接兩個反彈高點（Ａ與Ｂ點）形成頸線。現在是等待與觀察的時候了。當ＡＳＡ移到頸線42.5
    上方時，你的停止買單已經被執行。接著成交量於突破時擴增，深具鼓舞作用。相對強度在突破前後數週內大幅改善，此乃另一個正面因素。最後，雖然壓力重現於45附近，但它已經過了兩年，力量已然不足。配合系統，此時你可以買進所剩之另一半部位。雖然你從週線可能看不出來，但ＡＳＡ在快速攀升到44之上方後拉回近42，在該處便應追加買進。該股隨後漲到49，再回挫到46，該處是ＡＳＡ飆升到73.5之前的最後買進機會。


