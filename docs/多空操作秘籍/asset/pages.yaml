- pgno: 291
  md: '+   2. 因為股票漲幅過大而放空。


    許多交易員與投資人所採用的另一個毀滅性方法是，他們會在感覺某支股票漲幅過高時放空。如果你喜歡玩俄羅斯輪盤，這種玩法便屬於你的遊戲類型。子彈擊發只是時間早晚而已，你遲早終會被巨額虧損擊中。玩這種遊戲的人是在股票處於強力前進的第二階段放空，但他們卻竟然不瞭解為何遭受慘敗。現在你已經明瞭階段分析，應該能理解他們其實是在猜測第二階段頂部時，奉上了他們的頭顱。圖7-5的Angelica是你在玩這種猜測遊戲時慘敗的極佳範例。在一九八一年四月份——個空頭市場的起點——Angelica已上漲逾倍而處於14的高點。八個月之後，它無視於道瓊指數下跌200點，反而還漲升到25。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_291_0.png)'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# 3. 陷入放空的陷阱。


    股票市場有時也會出現那種好到不像話的情況。我們都見過那種狀況，明明股票的條件沒那麼好，交易價格卻還是漲翻天，簡直令人無法相信。如果進一步仔細調查，就會發現你的直覺並沒有錯，天底下確實沒有免費的午餐。而在市場中，這種情況往往以軄空的形式出現。像這樣的股票漲幅往往過大，超過明顯的合理價位，它看來註定要先跌。每次市場在多空循環時總會出現很多像這樣的空頭股票。它們最終都以崩跌收場，但這通常是在你的空頭部位受到極大損失、不得不回補之後過了很久才發生。這種股票包含有兩項要素，我警告你最好要避開：高本益比與大漲幅。另外，該股票令人兩眼突出的漲勢，往往會吸引媒體的注意。最後、也是最危險的是，相對於平均日成交量，其融券餘額非常大(註1)。雖然很多股票的融券餘額等於平均日成交量（當它爲大量時）的三到四倍，但這種顯見的空頭部位通常會等於平均日成交量的五倍或更多。


    在檢視兩個案例顯示這種空頭股票有多麼危險之前，你應該先知道要在何處取得融券餘額的數字。每個月一次（在21日左右），紐約與美國證券交易所彙整最新大量融券餘額之股票總數。這些數字（圖7-6之A欄）與平均日成交量（B欄）會公布在華爾街日報。如果將A欄除以B欄，你就會得到一個比率。例如，Home
    Shopping Network的融券餘額為4,283,306。平均日成交量為137,595。該比率爲巨大的31倍（4,283,306除以137,595）！


    （註1）融券餘額（short interest）是某支特定股票目前被放空之總股數。'
