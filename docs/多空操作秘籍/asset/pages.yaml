- pgno: 416
  md: '在選擇權到期之前，如果普通股在數週之內上漲到35，則買權的價格可能就會上升到10附近。如果在到期之前還有很長一段時間，則其價格可能更高。雖然其相應的普通股價格大幅揚升40%，但你的選擇權卻會出現400%以上的獲利。正是這種攫取金指環的機會，不斷吸引著選擇權的買家，雖然他們以長期而言多半是虧損的。


    賣權與買權正好相反。它類似放空。如果你預期股票即將劇挫，則購買賣權就等於是給自己一個在某特定時間內、以某既定價格賣出X Y Z股票的權利。如果賣權之履約價格為50，而該股票目前交易於49，則其內含價值為1，因為你可以目前成交易價49買進該股票，然後再立刻以50履行你的賣權。在接下來數週，如果X
    Y Z跌到40，則賣出選擇權之市場價值至少會上升到10，此即為其內含價值。普通股之跌幅若為20%，如果你放空該股，當然會有很好的短期利潤。但如果你持有賣權，則會有超過400%的利潤，因為它將由1.875上漲到10！


    購買買權與賣權的優點很明顯。只要看得正確，你就能擊出一支滿分全壘打！另一個優點是你可以界定你的風險。賣權代表賣出該股股票100股的權利。如果你決定在2美元的價位購買10個賣權，每一個賣權將花費你200美元，而你最後在該交易中可能的虧損，絕不會超過2,000美元（相同計算也適用於買權）。選擇權最後一個好處是，你可以用極少量的資金，博取極大的利潤。'
  merge: -1
  img_proc: true
- pgno: 417
  md: '不幸的是，銅板還有另一面——反面。如果你以2美元的價格購買履約價格爲50的賣權，假設到期時你仍持有它，而股票卻成交於51，此賣權就會變得毫無價值。換句話說，你就虧損了那全部2,000美元的投資。同樣地，如果你投入總金額2,000美元購買10個履約價格爲25的買權，倘若到期時普通股成交於24，由於履約價格是25，因此這樣的買權也就會變得毫無價值，而你也將喪失掉所有的投資金額。


    另外一項風險是，如果你所支付的權利金太高，即使你對股票趨勢的判斷正確，結果有可能虧損。這是因爲股票價格的波動，有可能還不足以使你的部位獲利。例如，普通股價爲50.5時，你購買了一個履約價格爲50的賣權，其權利金是6美元。這麼一來的話，該股票至少必須跌到44.5，你的賣權才能損益兩平。另一項風險則是，選擇權市場的成交量非常薄弱。所以在購買賣權或買權時，一定要採用限制委託單而非市價委託單。如果你不這麼做的話，市場搓合者一定會因你的委託單而大感高興，而你將會發現在此領域更難賺錢。


    顯然地，買權與賣權並不適合每一個人去購買。如果你是保守的長期投資人，那麼就甚至連想都不用去想。雖然保守的投資人可以利用對沖（hedging）策略大幅降低風險，但獲利的機會仍然很少。對沖策略適用於那些不能決定自己是多頭或空頭的人。不過對我而言，它並不是個成熟的方法，只會導致不成熟的報酬。我實在無法同意在持有第四階段的某支股票'
  merge: -1
  img_proc: true
- pgno: 418
  md: '時，採用賣出買權的方式來減少虧損的觀念。我也不贅同針對處於第二階段的個股賣出買權，只為了多爭取幾塊錢，卻減損了獲取上檔龐大利潤的機會。對我而言，如果你看多，就應該購買股票或買權；如果你看空，就放空股票或購買賣權。


    縱使你是真正積極的市場玩家，我還是不同意你將選擇權交易做為你主要的市場活動。均衡是在市場及生活中成功的關鍵。如果 你真的對選擇權很有信心，你還是可以將一小部份比率的資金分配到這個詭譎多變的領域中，但即使只是小小的部位，它也能讓你看到比拉斯維加斯賭場更多變的場面。如果你能依據我的法則從事選擇權交易，那麼與賭博就會有一個主要的差別，那就是我的方法會使勝算站在你這一邊，而不是站在賭場莊家的那一邊。


    # 以下是增加你成功機率的方法：


    +   1. 唯有當股票處於第二階段、或正要進入第二階段時，才購買買權。同樣地，唯有股票處於第四階段、或剛進入此負面階段時，才購買該股票的賣權。


    參閱 I B M（圖9-7）在一九八七年的日線圖(註6)。


