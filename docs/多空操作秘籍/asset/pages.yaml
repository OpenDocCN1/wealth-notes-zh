  md: '點上漲接近先前高點（C）時，你就應該調高停止賣點到D點。注意D點位於之前整理低點與三十週移動平均之下方。接下來當賣壓將股價擠壓至移動平均附近，再回升到接近E點的峰位後，此時即為採取進一步行動之時機。股價接近先前高峰時，停止賣點應該調高到F點（略低於先前低點與三十週移動平均）。接下來在急漲到G點高峰與另一次回檔之後，接著另一波漲勢再創新高點時，停止賣點就應該調高到H點。這個點遠在先前低點之下方，設定在三十週移動平均的下側。在另一波漲勢結束於I點之後，S
    K Y大幅下挫。龐大賣壓再次恰巧止於三十週移動平均。一旦股票大幅彈升離開該低點之後，停止賣點就可以移到J點，而這個點也略低於移動平均，也略低於先前整理的低點。


    只要嚴格遵循紀律，縱使股價不再走高，也可以鎖定豐厚的利潤。Skyline並未結束其第二階段的漲勢，接著它上漲至K點，稍微回挫，然後又漲到M點。停止賣點現在可以移到L。注意L點的位置遠低於先前的低點，也略低於上升移動平均（只要移動平均的斜率是陡峭上揚，投資人在設定停止賣點時，就應該給予相當大的空間）。接下來你應該以同樣的方式，將停止賣點移到N點，然後到P點。移動平均一旦開始走平，潛在的第三階段頭部便開始形成，此時就是要把停止賣點掌握得緊湊一點的時機。現在你應該把停止賣點壓縮到Q點，即使該點位於移動平均上方。最後，在買進之後過了將近兩年的一九七二年底，S
    K Y向下跌破其水平趨勢線，觸及了位於'
