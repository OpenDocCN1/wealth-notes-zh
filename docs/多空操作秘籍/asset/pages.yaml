- pgno: 86
  md: '圖3-3顯示了這種買進形態的樣貌。移動平均應有明確的上升趨勢。這點很重要！這就像馬拉松選手需要保留體力達到終點一樣，在第二階段上漲的股票也是如此。如果移動平均開始反轉趨平，那就不要碰那支股票。即使它連續向上突破，實際上看起來已不具有你所希望的那種潛能。相反地，你應該另尋其他類似本圖形以及具有高能量的個股。


    Swift Energy（S F Y）提供了我們所談論內容的典型例證。在形成了長達數年的第一階段底部之後，它在一九八六年初突破2.125處（圖3-4的A點箭頭處）。Swift在六個月內上漲到5.375處，獲取超過150%的利潤。一般投資人（不幸的是，甚至還有一些技術派人士）開始叫嚷股價偏高。這種看法並不正確。接下來五個月，S
    F Y歷經大幅上漲後的盤整，其三十週移動平均持續不停的攀高。然後，在一九八七年二月，Swift於5.5處（B點箭頭處）突破其再盤整區域，又在未來四個月飆升了240%。並不意外的是，它從未拉回接近5.5的突破點。雖在第一階段底部出現的最初突破之後，大約有80%的機會出現拉回，但在連續買進情況下，拉回的機率則不會超過50%。如果該股票最終打了個滿分全壘打，上述說法更是尤為正確。所以，處理此型態突破的適當戰略，就是在它克服其重要壓力之後，以全數部位買進。


    雖無正式規則，但以經驗法則而言，我認為投資人應於第二階段初期以75到80%的部位買進，剩餘部位則於連續走勢中投入。另一方面，交易員則應將這些數字顛倒，在個股處於第二階段'
