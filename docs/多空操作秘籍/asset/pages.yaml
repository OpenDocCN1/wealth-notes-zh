- pgno: 259
  md: '的一件事情是，如果三十週移動平均遭到穿破，即使只是一點點，交易員也絕對不可以再保有該部位。


    圖6-28的Reynolds Metals（R L M）顯示，在真實世界裡，交易員應該如何使用停止賣單。以交易而言，該股應該在25.125買進。在成交量擴增之後，它突破了連續型態。最初，交易停止賣點應該設在23.875（A點），位於整數24下方(註3)。隨後R
    L M急漲到37.375（B點），接著進行大規模整理，股價回落到31。在Reynolds反彈接近其於37的前一個高點時，停止賣價應提升到30.875（C點）。接下來，股價漲升到40，並出現7%的回檔，此時你應該準備下一個動作了。當R
    L M回升到其高點，然後超越該價位時，停止賣點便應調高到36.875（D點）。其後，在下一個有意義的整理出現之前，Reynolds展開另一波直線上漲而抵達54.25（E點）。R
    L M在49的整數價位探底，這並非完全巧合。它然後回到先前高點。另外，R L M形成了長達五週的中性型態，出現橫向盤整。在巨幅上漲之後，這總是令人擔憂的徵兆。交易停止賣點因此應該進一步提升到48.875（F點）。


    (註3) 25.125乘以4%大約為一點，這使得停止賣價成為24.125，這個位置有點問題，因為它剛好在重要的心理整數之上方。若取5%則為1.125，這使得停止賣價成為23.875，恰在整數價位之下。'
