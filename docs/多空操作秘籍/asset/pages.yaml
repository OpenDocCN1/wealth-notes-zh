- pgno: 109
  md: '在處理類股時，可以採用與個股一樣的衡量標準。投資人應該將買盤集中在突破第一階段底部型態的市場領域中，而交易員則應該傾向於關注已存在之第二階段上升趨勢的連續走勢中。不過這裡仍有一點不同之處。如果個股已經進入成熟的第二階段上升趨勢，而且遠離支撐，投資人在正常情況下不會輕易地買進此種型態。但是，如果一個類股已經完全進入第二階段，而你發現該類股中的某支個股正首度突破第一階段底部，投資人買進該支股票則是可以的。依同樣方式，在剛進入第二階段的類股中，如果交易員發覺某支個股具有連續買進型態，則交易員絕對能夠買進該股。在處理類股時，最重要的一項因素便是該類股必須是健全的（亦即不處於第三或第四階段）。在其他條件相同的情況下，投資人的最佳處境是該股票處於第二階段突破的初期，而且該股票所屬的類股也呈現完全相同的型態。對交易員而言，最理想的情況是個股連續性突破，而其所屬之類股動態也呈現十分類似的型態。


    第二種類股的訊號是由審視圖形本身而來。瀏覽圖表時，如果你看見某一類股中的幾支股票突然轉變為多頭（或空頭），那便是很明確的訊號(註9)。你可以將具有最佳圖形型態的個股一一列出，並註明相應的類股名稱。如果有六個類股的


    (註9) 這種做在NYSE（紐約證券交易所）很容易執行，因為個股都是依照類股順序排列的。在Amex和OTC則比較麻煩，因為個股是依照字母順序排列的。'
