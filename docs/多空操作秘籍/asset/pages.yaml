  md: '現在讓我們看一些實際的歷史案例，練習一下設定停止買單的方法。


    Blair（圖7-35）在一九七二年中完成小型的頭—肩—頂型態，然後在A點跌破頸線，股票於該處應該以19.875放空。最初的保護性停止買單應該設定在漲升峰位B點的稍上方。然後，當第四階段開始將股票愈拉愈低時，保護性停止買點應依序調降到C、D、E
    等，一路到達K點（接近7.5）。當Blair回升到7.5之上，保護性停止買單遭到觸發，雖然那並不是絕對低點，但此時你已鎖定了優厚的利潤。這就很好了，因爲我們的方法以冷靜而有紀律的方式鎖定超過60%的獲利，讓我們能在非常接近低點處脱脱放空部位。


