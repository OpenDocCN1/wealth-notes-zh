  md: '美式足球的四分衛，也無法完成每一次的傳球。你沒有必要永遠正確。但只要一貫地遵循我的方法，正確的百分率將會很高。大多數專業都但只知道一項秘密：只要你能夠讓獲利部份持續成長，並快速停止你的虧損，縱使你操作的正確性低於百分之五十，你仍能累積大筆財富。在未來的章節裡，我會教導你如何正確地處理虧損。這將是你所學習的內容中，最能夠提升獲利的秘訣。


    # 為何採行技術分析


    現在我們就進入更明確的內容。首先，請將你以前對市場的觀念擱置一旁，準備迎接一個嶄新的開始。這就像是參加一項減肥計畫，首先你必須潔清你的系統，在這裡也一樣，首先你必須把所有對市場的信條擱置一旁，重新開始，一步一步地緩慢前行。如果你是堅決的基本分析者，也不必擔心。你不會有萎縮的症狀，過程中也不會產生什麼幻象！一旦精通了新方法，你就能這兩個方法合為一體，而且將更能掌握基本分析買賣點的時效性。


    相反地，如果你能夠精研技術分析，最後就很有可能與我一樣，懂得忽視重要的新聞報導，而將注意力完全集中在軌跡所傳遞的訊息。每一期《專業軌跡解讀》的標題座右銘便是「軌跡呈現一切」，這並非巧合。這不僅是一句有趣的標語，而且也是一個有效的市場哲學。其真正的意義，就是所有公'
  merge: -1
  img_proc: true
- pgno: 14
  md: '司的相關資訊，包括公司盈餘、新產品、管理及其他基本分析資訊等等這些目前已知且受到關注的資訊，都已經反應在股票價格中。這並不表示我不關心任何重要的基本面訊息（例如懸而未決的併購案），而是我很早就明瞭，當我們發現這項甜蜜的消息時，我們的反應在時間上不可能早於它真正對軌跡的作用——知道的時候已經太遲了。當然，我們也會聽到一些謠言，但我們所聽到的一百個謠言中，真正實現者不會超過一、二個。這可不是在市場上致勝的好機率。因此，請接受一項事實：除非你願意觸犯內線交易的法律，否則你不可能及者を發覺任何重要資訊。一旦你在報紙上閱讀到任何訊息，你已經來不及做出任何有利的反應了。非常值得注意的是，一旦你學會如何適當地解釋軌跡以及線圖中所發生的dest，
    通常你反而能夠根據內線消息來做交易，縱使你並不真正地知道這些內線消息。


