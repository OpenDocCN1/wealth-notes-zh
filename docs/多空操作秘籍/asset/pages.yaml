  md: '與圖1-2）。雖然你尚未受過訓練，但本書接下來的一百頁將會教導你，甚至連一個新手也可以看得出來，一九八七年初與一九八七年中稍早，在Piedmont與Spectradyne分別做重大宣布之前的幾個
    организму，市場交易已經出現非常不尋常與熱絡的行爲。雖然我並沒有暗中刺探內線消息，但我傾聽軌跡所傳遞的訊息，在公司接收消息與股價暴漲之前，我便在《專業軌跡解讀》中建議買進這兩支股票（參閱圖1-1與圖1-2的箭頭部位）。很明顯地，許多內線買盤已經發生。當你閱讀完本書之後，再翻回本頁，你就會更清楚看出爲什麼你絕對不會考慮賣出這些股票——即使每天都有上千個投資人在賣出，股價卻節節上升。更重要的是，你將會瞭解爲什麼此時你應該打電話給你的經紀人下買單。


