  md: '# 第8章


    # 運用最佳長期指標辨識多空市場


    在一九七五年一月、一九七八年三月，與一九八二年八月，當時若能積極買進，豈不是很好嗎？這幾個關鍵時刻，都恰好發生在主要多頭市場正要展開之前。而在一九七三年一月、一九七六年底、一九八一年七月，以及一九八七年十月初等主要空頭市場造成慘重傷害之前，如果能轉進極端防禦性的部位，那就更好了。《專業軌跡解讀》做到了——相信你也做得到！


    一九八二年七月，當時很多經濟學者發表評論，認為經濟嚴重衰退還要持續一年或更久。道瓊工業股價指數處於800點之下，一位廣受尊崇的市場權威人士預測它將崩跌至少到500點——大衆傾聽而且信以為真。在空頭走勢進行十二個月之後，我在一九八二年七月二十二日的《專業軌跡解讀》寫道，「我們正處於一個新多頭市場的蘊釀階段。這是我們從一九八一年六月份轉爲空頭市場以來的第一次，希望各位利用所有回檔時機買進。」三週之後，市場觸及770的盤中低點，其他一切皆成爲歷史。本世紀最偉大的多頭市場之一從此展開。'
  merge: -1
  img_proc: true
- pgno: 350
  md: '另一個極端在一九八七年八月，當時一般大衆處於絕對陶醉狀態。一家領導性的金融雜誌甚至刊出一篇標題極端樂觀的文章，「道瓊指數3000點：並非如果，而是何時。」超級多頭不斷調高市場預測；道瓊指數3,500被視為當然，4,000
    也被視為合理，因爲我們的股價較日本市場便宜許多。當我在一九八七年九月十七日的《專業軌跡解讀》寫道：「地平線上正形成一些不祥的烏雲」，這正是指數創歷史新高2,746的後幾天，在此瘋狂的多頭環境下，那聽起來真像是句蠢話。接下來幾個禮拜，我的技術指標愈來愈呈現負面，我要求訂閱者持有大量現金。然後在十月十五日，我寫道，「這絕對不是捨棄防禦姿態的時機。」接下來的星期一，十月十九日，道瓊指數令人不可置信地大跌508點，創下歷史上最慘烈的單日崩跌！


    我是如何辦到的？只是做了我的技術分析功課，以及傾聽我長期指標所發出的訊息。在你研讀本章之後，你也能自信精確地辨識主要頭部與底部。我密切觀察一百種以上的技術指標，而在每期《專業軌跡解讀》中報導五十種最佳指標。這五十個指標構成我的證據權數，並依據它們判斷市場三個趨勢——長期、中期與短期——的技術健康狀況。我的方法與很多分析師不一樣，他們只追蹤幾個他們所相信的指標。我喜好基礎廣泛的理由是，這些年來，我發覺任何技術工具，不論其記錄多優良，也會在某些時刻投個變化球給你。如果你過度依賴少數指標，你的系統遲早會把你帶到外野去。如果你學習傾聽這些多數優良指標所發出的集體訊息，你處於錯誤波段的機率'
