- pgno: 10
  md: '大部份都是不值得被印刷出來的。很多書太過單純而毫無實用價值；其他的某些則屬於空談或純理論，閱讀它們只會為你帶來頭痛。更糟的是，有部份書籍會給讀者許多不切實際的承諾。如果你希望有一本書能夠讓你在下星期二下午四點以前，將一萬變為一百萬，那麼請立刻停止閱讀本書。但如果你的態度是嚴肅的，並且真心想要學習如何在經年累月裡一貫地獲利——不論在多頭或空頭市場——而且想要在未來的幾年內，為自己累積一小筆財富，那麼本書正適合你。


    還有一些事情你必須瞭解。我們是一個團隊。在學習我的方法時，你投入的精力愈多，你能從桌面上拿走的籌碼也就愈多。這就像參加專家指導的網球課程一樣。第一個小時的課程只是學習經驗的開始；第二步也是很重要的，你必須實際練習並運用你所學習到的技巧。我會儘量簡化學習的過程。在過去幾年，我一直在編寫《專業軌跡解讀》這份刊物，並在全國各地舉辦講習會。所以請不用擔心，縱使你從來沒有看過線圖，或從未描繪過任何指標，你只需要做好份內的工作，就能很快瞭解並學會我的方法。


    有些技術分析的書籍十分深奧，只有作者與少數學術型人士才能瞭解，但本書並非如此。我僅會處理一些對於賺錢來說十分重要的因素，而將一些次要因素擱置一旁。另外，本書將循序註解各章，緩慢地發展你的獲利能力。為了幫助你檢查你對本書方法的瞭解程度，很多章節末尾皆附有簡短的測驗。如'
