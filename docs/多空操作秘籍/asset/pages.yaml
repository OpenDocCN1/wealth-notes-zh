- pgno: 110
  md: '標準普爾圖形呈現多頭，而大多數最具潛力的個股皆出自於其中一、二個產業，那 Raúl ! 那就透露出很重要的訊息。雖然六個類股很可能都會上漲，但同時擁有幾個最佳個股圖形型態的類股，將會是其中表現最佳者。


    這個方法也可以用另一種方式協助你步上正軌。有些時候，標準普爾的產業圖形會因為類股中某支個股所展現的大幅上漲或下跌而被扭曲。此時利用交互審查法才不致因為某支股票成為購併候選公司或受制於不利因素，而使你被拋離正軌。


    # · 運作方式


    回顧一九七八年的美好往日時，我注意到不尋常的力道呈現在個別的投機股票圖形中，而且飯店、汽車旅館以及娛樂業也呈現可觀的技術面力量。另外，它們個別的相對強度線都偏多。尤有甚者，沒有一支投機股呈現空頭圖形型態。在所有可供選擇的買進機會裡，我覺得我像一個身處糖果店的小孩，幾乎不知道如何選擇。如此令人難以置信而且廣泛的強弱勢涵蓋了整個產業的每一支個股，這是很不尋常的，但是當其發生時，不要忽視市場所帶給你的明顯訊息。從一九七八年三月底開始，我加入了明牌推薦狂歡會。在接下來的兩週內，我推薦了Bally、Caesars
    World、Harrah’s、Holiday Inns以及Playboy（參閱圖中的買進點箭頭）。它們擊出了滿貫全壘打，在接下來的幾個Month內，分別上漲105%到560%。'
