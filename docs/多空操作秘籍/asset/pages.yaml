- pgno: 218
  md: '同樣有損投資組合表現的是過早賣出。你是否經常正確地買進一支股票，而在隨後十二到十八個月內，它增值為三倍，但你卻早已不再持有它？股票從40一路上升到120，你未順勢抬轎，而是在50處迅速獲利了結，還誤以為只要獲利了結就不至於破產？事實上，以長期而言，你必須攫取這種巨幅漲勢，才能抵消偶而犯錯所造成的虧損。辦到這一點，你才會有剩餘的巨額淨利。


    問題癥結在於投資人或交易員賣掉持股時，往往只是因為他感覺股價太高，然後只能看著它高飛。是否有方法可以明智地判別，一支股票是否已達高峰而搖搖欲墜？當然有，方法就圍繞在我的階段分析法之中。不過在介紹適當的賣出技巧之前，先分析一下多數投資人所遵循的不當方法，也是會有一些幫助的。


    # 不可犯的賣出行為


    +   1. 不可依據稅負考量，決定你的賣出決策。


    這是本末倒置的典型範例。投資人時常因為稅負太高而決定不賣出股票。然後在接下來幾個月內，卻因股票下挫而蝕去大部份獲利。當初如果能避開該波下跌，他便能夠支付稅金且能留下相當的利潤。尤有甚者，你可能還可以再買進一支步入第二階段的股票，取得賺進利潤的潛在機會。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '下面的真實故事，可以告訴你我確切想要表達的意思。回顧一九七八年，我在一場投資講習會上演講時，我說賭場類股在呈現一波多頭走勢之後，現在發出了賣出訊號(註1)。在演講完之後，一位煩惱的投資人（我們稱她為珍）走過來說她面臨嚴重問題。她持有數千股Resorts
    International的A級股票（參閱圖6-5）。當時該股位於65附近。我告訴她，「不要這麼煩惱，認賠這小小的損失，你以後可以在別的地方賺回來」。然後她嚇人的說，「哦，我沒有虧損。我是在20處買進該股。我的問題是我獲利過多而必須支付大筆稅金。」於是我告訴她，每個人都有同樣的問題。我會把股票賣掉，把稅金視為交易成本。一年之後，我再到同一個研討會演講時，我又看到珍。當她過來打招呼時，我想起我們去年的談話。我問她的問題結果如何。「哦，我已經沒有問題了」，她說，「Resorts現在跌回20，我不用再擔心獲利會帶來稅金問題了」。


    (註1) 雖然尚未正式進入第三階段，但那些賭場類股已呈現典型的爆裂瘋兆，成交量與價格走勢都太過份了。'
