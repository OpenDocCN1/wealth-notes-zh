  md: '若你對某些章節不十分明瞭，請重覆瀏覽直到能夠掌握其內容爲止，然後再繼續向下閱讀。


    # 我的投資哲學


    在接下來的內容中，你將正確學習到我分析與擊敗市場的方法。當然，這並不容易，但也不像多數投資人或交易員所做的那麽困難。


    第一課是「一貫」（consistency）！過去二十五年來，我始終一貫遵守我的方法與紀律。這是非常重要的。請勿在本星期做爲一個基本分析者(註1)，下星期又變成一個技術分析者。請勿在這個月遵循A指標，下個月又改遵循B指標。你只需要尋求一個好方法，然後非常有紀律地守著它即可。如果你這個方法無法規律地擊敗市場，才需要去尋求另外一個方法。請絕對遵守紀律，不要只因爲您認爲這次情況有所改變，就隨意放棄一個成功的方法。


    第二課是要學習一件大部份投資人所不瞭解的事：如果 你


    (註1) 如果你對這些名詞感到陌生，沒關係，你只需瞭解：基本分析者買賣決策所根據的因素為經濟表現、產業表現與特定公司的盈餘趨勢。相反地，技術分析者觀察市場行為本身。他們專注於價量關係，協助他們解讀供需方程式。'
