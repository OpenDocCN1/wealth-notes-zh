- pgno: 352
  md: '# 股價指數的階段分析


    要從哪裡開始，其實很明顯。如今你應該已對階段分析感到十分得心應手，所以就讓我們將它應用到股價指數上吧。其中所運用到的三十週移動平均線，可說是最易於追蹤、也是最重要的一個指標。如果你只能追蹤一個長期指標，那就非它莫屬了。你可以利用每週的圖表服務對它進行追蹤，或者自己繪製也可以。


    如果你決定自己追蹤這項指標，可參閱第九章談到圖9-2時關於移動平均計算的相關內容。其實你只需要將每週五的收盤價記錄下來並繪製在圖表上，就能計算並追蹤三十週移動平均。


    接下來，就是要解釋其行爲。就和個別股的階段分析一樣，一旦道瓊工業股價指數形成潛在的第三階段頭部，你就必須謹慎行事。然後當道瓊指數跌破其三十週移動平均，並向下突破而進入第四階段時，則是轉為防禦的時機。就算你看到有一些股票在圖表中向上突破，此時也要暫時停止買進。任何呈現弱勢相對強度的股票都必須確實賣出。而此時在你少數留存的多頭部位中，其保護性停止賣單的設定也要盡可能地嚴謹。最後，便開始獵取理想的放空型態。


    雖然這項關鍵性的長期指標並不是絕對正確，它偶爾也會給你震盪訊號，但是它非常可靠。過去幾十年來所有空頭市場'
  merge: -1
  img_proc: true
- pgno: 353
  md: '展開時，這項指標都出現負面訊號。只要參考圖8-1，你即可理解我在一九八七年十月崩盤前轉爲空頭的其中一個主要理由。道瓊工業股價指數在一九八四年八月穿越其三十週移動平均之後，在一七八五年初，它進入第二階段，呈現出瘋狂似的展望。在接下來的兩年半，它不斷上漲，指數成長逾倍，而且一直處於上升三十週移動平均之上方(註1)。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_353_0.png)


    (註 1) 道瓊指數唯有在一九八六年底一度稍微跌破移動平均，但因均值線持續走高，而沒有出現負面訊號。另外，道瓊指數不曾跌破支撐。'
  merge: -1
  img_proc: true
- pgno: 354
  md: '但在一七八七年底，若干危險徵兆開始出現。首先，指數在八月底抵達新高點（A點），然後大幅下挫（到B點）。接下來在十月初出現漲勢（C點），但未能抵達八月份的高峰。這個A、B、C序列大有明顯做頭的潛在性。當道瓊工業指數隨後再次跌破先前低點B時，至少中期頭部的訊號便可說是已經出現。


    除了發生這些負面性的震盪外，更為嚴重的問題也在形成。三十週移動平均正喪失上升動力而開始走平。這使得圖形出現令人擔憂的第三階段。市場的最後一擊，是當它在2,450附近跌破三十週移動平均之時。這是一個強烈的第四階段賣出訊號，而且是宴會結束的徵兆。新的空頭市場由此展開。接下來的幾個交易日，市場開始加速下跌，甚至還創下了歷史上的最大單日跌幅！雖然很多人宣稱該崩盤是突然出現的，但你知道其實並非如此。


    在一九二九年，情況完全相同。關於這件發生已久的大崩盤有很多文字記載，但其中很少屬實。我曾經看到有些文獻認為，要避開一九二九年大災難的唯一途徑就是在一九二八年便脫離市場，當時股價已開始變得嚴重高估。其他人則說，該崩盤完全不可預期。這簡直是荒謬之論。歷史與循環確實不斷重覆，而當階段在推進時，那些未能從歷史中學習到教訓的人，注定要重蹈覆轍。'
  merge: -1
  img_proc: true
- pgno: 355
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_355_0.png)


    圖8-2


    在一九二八年或一九八六年，當股價在基本面上變得高估時，你並沒有必要對股票說再見。如果這麼做，你將錯失兩個可觀的漲勢。在這兩個案例中，只要辨識潛在的第三階段頭部，然後對第四階段向下突破三十週移動平均做出反應，便能使你走在華爾街群眾之前（參閱圖8-2一九二九年的崩盤），同時還可以讓你安全停留在場內直到最後一局。


    現在參閱圖8-3，該圖顯示了幾個道瓊指數步入空頭市場前的第三階段頭部，以及最後向下突破進入第四階段的情況。在每一個案例中，故事都相同。一旦第三階段頭部形成，移動平均不再上升，便是小心謹慎的時機了。最後的負面訊號便是明顯跌破其三十週移動平均。因此，一旦移動平均開始朝下行，你就應該停留在避風港，等待移動平均出現走平的徵兆。記住，如果均線持續下降，則指數僅短暫穿越移動平均（猶如一九六九年底）是不夠的。'
  merge: -1
  img_proc: true
- pgno: 356
  md: "# 356\n\n# Stan Weinstein's Secrets for \nProfiting in Bull and Bear Markets\
    \ \n多空操作祕笈\n\n另一方面，這個重要的長期指數並非粗淺的指標。不同於我多年來所研究的其他指標，階段分析也同樣擅於辨認多頭與空頭市場的起點。在主要跌勢完成後，一旦第一階段的底部開始形成，便是準備接納下一個多頭市場訊號的時機（參閱圖8-4）。一旦三十週移動平均由下而上遭到貫穿，那便是在你的股票圖表中尋找積極買進對象的時機了。\n\
    \n![](img/63c92c8be10593e716ed1b88e7ce9321_356_0.png)"
  merge: -1
  img_proc: true
- pgno: 357
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_357_0.png)


    # 圖8-4


    # 騰落線


    下一個必須密切追蹤的市場重要指標是紐約證券交易所（NYSE）的騰落線。騰落線是由某一天的上漲家數（一個正數）與下跌家數（一個負數）間的差值所構成。以下說明騰落線每天的讀數，如何協助你正確站在市場主要趨勢上的方法。'
  merge: -1
  img_proc: true
- pgno: 358
  md: '| 日誌 | | | |

    |---|---|---|---|

    | **NYSE** | **週五** | **週四** | **本週** |

    | **Issues traded** | **2,004** | **2,015** | **2,175** |

    | 上漲 | 692 | 1,296 | 820 |

    | 下跌 | 912 | 386 | 1,135 |

    | 不變 | 400 | 333 | 220 |


    SOURCE: Reprinted from The Wall Street Journal, November 16, 1987, Dow Jones &
    Company, Inc. 1987. All Rights Reserved.


    圖8-5


    你可以隨時開始計算，並任意選取一個基數(註2)，例如 +50,000。然後你每天計算上漲與下跌家數的差值。例如，假設692家上漲，912家下跌（參閱圖8-5取材自「華爾街日報」的市場日誌；未見漲跌者捨棄不論），你就會得到-220的值。接著從你的基數+50,000中扣除該數，則你可得到+49,780。如果隔天出現上漲多於下跌，就將該數據加到前一天的數字上。


    只要騰落線與道瓊指數齊步走高，便沒有什麼值得擔心的；市場甚至不太可能出現重大的整理。但是，當該指標開始喪失上升動力而道瓊指數卻仍持續走高，這便是負面的背離走勢，預示市場遭遇麻煩(註3)，而這段下跌可能是多頭市場進行


    > (註2) 因為騰落線的刻度是任意的，因此你所選取的基數無關緊要。它是一條累積的線，如果當天上漲家數多於下跌家數，就往上加；如果下跌家數多於上漲家數，你就往下扣。


    > (註3) 當道瓊指數創新高，而騰落線及其他市場指數未同步上揚到新高點而予以確認時，這種情形即为負面背離走勢。它是轉為防禦性的一項理由。'
  merge: -1
  img_proc: true
- pgno: 359
  md: '中的整理。但是，如果這種負面的背離走勢長時間（數個月）持續，那便有問題了。最嚴重者，如果道瓊指數與騰落線由重要的頭部型態下挫，則新的空頭市場便將準備降臨華爾街。在整個市場歷史中，這個明確的訊號屢次應驗。你非常可能看到騰落線較道瓊指數先到達高峰，因為當信心逐漸消散時，資金會先從二線股抽離，然後再移到高品質的績優股。從歷史來觀察，紐約證券交易所的騰落線到達高峰的時間，通常較績優股做頭的時間早五到十個月。一旦騰落線停止上升，就會不禁令人愈來愈懷疑多頭市場還能存活多久。


    主要底部形成時，道瓊指數先觸及最終低點，但不再進一步下跌，而騰落線卻仍愈走愈低，這種情況出現的機率非常高。這並非許多市場玩家所相信的是負面徵兆，實際上這是正面的長期指標。它是第三階段頭部形成時負面背離走勢的相反現象，因此可稱之為正面背離走勢。這種走勢顯示有些類股已經開始恢復健康，其他則還在持續惡化中。不論你是在處理頭部或底部，記住其背離走勢延續愈久，則最終之反轉也愈為重要。


    在《專業軌跡解讀》中，我持續追蹤紐約證券交易所、美國證券交易所、店頭市場與道瓊工業股價指數的騰落線。雖然它們都能提供市場深層技術面情況的觀察，但其中你應該持續追蹤，唯一具有關鍵地位的就是紐約證券交易所的騰落線。它不僅每天刊載在「華爾街日報」的市場日誌內，而且刊載在幾'
  merge: -1
  img_proc: true
- pgno: 360
  md: '乎每一份當地報紙的金融版中。


    繪製本指標時，要確定它與道瓊工業股價指數放在同一個圖面。兩者皆應每天繪製。只需要花費幾秒鐘的時間追蹤此一指標，便能大幅增加你的獲利潛能。你所要做的就是將圖表紙分割為兩部份，在圖形上半部畫上合理的刻度並繪製道瓊指數，並在圖形的下半部繪製紐約證券交易所勝落線每天的累積數值。你必須決定圖表紙中上漲家數淨超過下跌家數的單位置（例如以每200家為一個單位）。隔天，如果道瓊指數收盤下跌20點，先在道瓊指數圖上找出該點，畫上一點，並繪製該線。而在處理當天的勝落資料時，如果前一天的讀數是+50,000，而今天下跌家數超過上漲家數200，就要在+49,800的累積數值上進行繪製。由於是以每200家為一個單位，因此你要在圖形往下一個單位處繪製今天的讀數。反之，如果是1,200家上漲，400家下跌，則該天的淨差值為+800的讀數。因此就要在圖表往上四個單位（因為每200家為一個單位）處畫上勝落指標。


    市場歷史充滿了例證，顯示紐約證券交易所的勝落線要比道瓊指數先到達高峰位置，然後不論指數如何進一步攀高，它都拒絕再上升。這種現象顯示市場漲勢已經具有選擇性的風險。當信心消退時，就會有愈來愈多的資金從整體市場中抽離，轉進最高品質的公司中。這永遠是一個重要的預警，顯示多頭市場的審判日已近，此時你必須特別小心觀察你的圖表與指標，檢視行情結束的進一步徵兆。'
  merge: -1
  img_proc: true
- pgno: 361
  md: '圖8-6完美地說明了這種型態。雖然紐約證券交易所的膽落線在一九六一年五月份漲達其高峰位置（A點），但道瓊指數在該年底前皆未停止攀升（B點）。在兩個高峰位置之間存在幾乎長達七個月的領先時間。當指數於一九六一年的八月、九月、十一月與十二月屢創新高時，膽落線並未出現類似走勢，沿途只出現幾次未確認的訊號。這是嚴重麻煩正在蘊釀的重大警訊。當指數在一九六二年初跌破主要支撐及三十週移動平均時，很明顯這便是空頭開始咆哮的時機。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_361_0.png)


    圖 8-6'
  merge: -1
  img_proc: true
- pgno: 362
  md: '相同的空頭現象也出現在一九六五年。膽落線首先在一九六五年五月份做頭，雖然道瓊指數持續上揚九個月。道瓊指數的新高點出現在一九六五年十月份，以及一九六六年的一月份與二月份，但皆未經這項重要指標創新高點的確認。膽落線的先前高點與一系列未經確認的道瓊指數新高點，是對市場的第一與第二個重擊。透露出一九六六年空頭市場開始形成的第三個重擊，就是一九六六年三月份指數跌破關鍵支撐與三十週移動平均。


    膽落線最大的背離走勢之一，可能是出現在一九七二年三月到一九七三年一月的那一段期間。這項指標抵達其高峰位置時，較道瓊指數在一九七三年一月份做頭早了十個月。在這一段長時間內，道瓊指數創下本指標皆未予確認的四次高點。這是十分強有力的警訊。幾乎可預期地，道瓊指數在一九七三年一月底跌破支撐與三十週移動平均後，便展開了四十年來最具破壞力的空頭市場。


    最後，在股市歷史中最嚴重之單日崩跌發生前，同樣的警訊也出現在一九八七年。雖然很多人將此次崩跌視為龐大預算與貿易赤字下的合理產物，但該赤字只是個愚蠢的藉口，因為在一九八七年頭八個月市場大幅走高及後來崩盤時，它都一直存在著。


    實際情況是，市場崩跌的理由與平時遭到痛擊理由一樣——它在技術面變得太過脆弱而無法進一步漲升。一旦這種'
  merge: -1
  img_proc: true
- pgno: 363
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_363_0.png)


    情況發生，最不具阻力的路徑總是朝下的。參閱圖8-7，你便會瞭解這個絕佳的指標又在一九八七年呈現其無法衡量的重要性。紐約證券交易所的膽落線在一九八七年月份抵達高峰位置（A
    點）。在該點上，道瓊指數正掙扎攀抵2,400。在接下來的五個月，空頭膽落現象壯觀地展現。膽落線鼓足氣力卻無法超越三月份的峰位。在同一期間，道瓊指數翻越2,700。道瓊指數於一九八七年的四月、六月、七月與八月，共出現四次未受確認的高點。道瓊指數在觸及2,746的盤中高低時，絕大多數市場玩家的唯一爭論便是道瓊指數何時可抵達3,000點。這是重大的預警，數過之後，道瓊指數在2,490附近跌破其主'
  merge: -1
  img_proc: true
- pgno: 364
  md: '要支撐，然後又跌破其三十週移動平均時，便註定了死亡的命運。空頭市場已經降臨。唯一令人訝異之處是，通常需要花費幾個月時間完成的工作，卻僅發生在數週之內，這是因爲電腦程式式賣盤將跌勢濃縮的結果。


    多頭背離走勢會以非常不同的方法展現，瞭解這點是很重要的。在一九二九年到一九三二年間崩盤後，紐約證券交易所的騰落線與道瓊指數同步下滑。然後在大幅彈升之前，兩個指數皆在一九三二年七月份出現新低點。大約八個月之後，於一九三三年二月底，有趣的現象出現了。道瓊指數觸底後大幅反彈。但騰落線卻道出不同的故事。道瓊指數上揚時，騰落線在整個三月份期間持續下降。這是主要底部形成時的標準行爲。在漫長的跌勢之後，信心自然非常微弱，買盤出手買進時會極端謹慎。買盤最初會集中在績優股，避開比較投機的股票。因此，騰落線的新低點未經對應道瓊指數低點的確認，這種有利的序列在若干年來的幾個主要底部都可以看到。


    這種現象的另一個典型案例則發生在一九五七年底（圖8-8）。在該年下半年遭到痛擊之後，道瓊指數於十月份觸底（A點）。在接下來的兩個月，第一階段底部開始形成，指數在跌勢中仍然站在十月份低點之上。但騰落線在這段期間仍承受相當壓力而創下新低點（B點）。這種背離行爲很快就演變成爲一九五八年到一九五九年的偉大多頭市場。'
  merge: -1
  img_proc: true
- pgno: 365
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_365_0.png)


    # 圖 8-8


    在一九六二年崩盤後，這種多頭型態再度出現（圖 8-9）。明瞭市場歷史的技術分析師當時皆處於買進位置，而一般人則因爲古巴飛彈危機而感到恐慌。道瓊指數在該年六月底掉落到崩盤低點（A點），這是在頭條新聞事件發生之前的幾個月。接下來的八週內，兩項指標都出現良性的技術性漲升。然後隨著古巴飛彈與蘇聯戰艦而來的九月到十月份的歷史性賣壓，影響所及不止華爾街而已（B點）。有趣的是，在所有恐懼以及賒落線觸及新低點時，道瓊指數守住防線而未跌破其一九六二年的底部。當憂慮高漲時，這是非常有力的背離訊號。待赫魯雪夫召回戰艦後，市場便開始了爲期三年半的可觀多頭市場。'
  merge: -1
  img_proc: true
- pgno: 366
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_366_0.png)


    # 圖8-9


    這個非常有利的型態也出現在一九七○年代中期的金融市場。在一九六九年到一九七○年邪惡的空頭市場之後，道瓊指數在一九七○年五月份見底，而騰落線則持續崩跌，直到七月份才觸及最後低點。這是顯示一九七○年到一九七三年多頭市場即將降臨的有效訊號。最後，在一九八四年一月到七月的小型空頭市場之後，這種正面型態出現在六月到七月間的圖表中。數天之內，一九八四年七月到一九八七年八月令人難以置信的強勁多頭市場便展開了。'
