  md: '接下來戰術發生重大改變，務必密切注意！移動平均在 I 點之後，便不再上升而逐漸走平。一旦發生這個現象，第三階段頭部開始形成的機率便升高，而下一次若嚴重跌破支撐與移動平均，就很可能帶來第四階段的問題。因此，一旦股票進入高風險地帶，對於停止賣單的態度就要轉為積極。這也表示在
    X Y Z 的案例中，雖然整理低點 K 處位於移動平均之上方，此時仍要將停止賣點移到 K 處。因為 K 在 46 處，因此我們將停止賣點調升到 45.875。然後，在接下來數週內，潛在的頭一肩一頂形成，其頸線在
    46 附近。因為 M 點位於 46.5，該點非常接近停止賣點的價位 46，因此你沒有必要因為瑣碎的變化而調整停止賣點。最後位於 46 的支撐跌破，而在新的第四階段跌勢開始吞噬你的利潤之前，你已經以優渥之獲利出清你的部位了。採用這項技巧不會讓你賣在最高價位，但這很好，因為我們是跟真實世界打交道。你通常能夠在接近最高點附近賣出，並取得重大獲利以回報你所花費的時間與精力。尤有甚者，你不會像那些未能及時賣出
    Alfin（圖 6-3）與 VM Software（圖 6-4）的投資人，吐出幾乎到口的巨額獲利。反之，只要你以類似停止買單進場的方式設定好你的停止賣單，就可以將你的部位以外科手術般精確的程度出脫。股票在進入第四階段時，其下跌速度通常極快，不過你在痛楚發生前已經出場了。


    採用停止賣單可以使情緒反應降到最低。賣單發生時，你甚至不會知道。當時你可能正忙於日常工作，或者甚至在渡假。最重要的是，你將不需要再絞盡腦汁做出決定。你是否應'
