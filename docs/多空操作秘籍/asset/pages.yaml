    # 圖1-17


    我不會讓圖形中的所有特徵——其中有很多是很基本的——來煩擾你。很多特徵是令人迷惑而沒有必要的。我們只會專注於圖形中真正重要且會產生利益的部份。


    +   1. 首先觀察每一個高－低－收盤價的條柱。股票價格是圖形中最重要的構成要素，因為隨著時間推移，它會形成一個型態，而給予我們下一個主要波動的線索與複雜的內涵。
    2. 第二個要素是所描繪的週成交量。價漲量增、價跌量縮是一個有利訊號。就如我們前面所說的，在本書中也將不斷地強調，在向上突破時，呈現擴張性的大成交量是非常重要的。龐大的成交量透露急切而且有力的買進，會把股價推往更高處。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '3. 圖形中的第三個重要細節是三十週移動平均。Mansfield 圖形公司所提供的圖形並不採用簡單的三十週算術移動平均（也就是每週等權值的計算方式）。反之，這裡採用的是加權三十週移動平均，亦即近期權數遠較早期資料為大的方式。這會使移動平均對目前的活動較為敏感，而且會較快的反映反轉。加權平均的缺點是它們會導致較嚴重的上下波動圖形。由於它是一條長期移動平均，所以訊號還是十分清楚。請牢記一點，如果一支股票的價格落在三十週移動平均下降趨勢線的下方，就算以基本面觀察，不論它多便宜，或近期跌幅有多深，也「絕對不要」買進。這樣的價格正給你一個明確的訊號，蘋果內有條蟲！買進？想都別想！相反地，不論股票本益比有多高，如果它的價格是在三十週移動平均上升趨勢線的上方，那就絕對不要放空該股。


    4. 第四個要注意的事項是要知道長期背景。在Mansfield 的圖形左下角有每年高低價的圖。這個長期背景圖的價値在於它能幫助你把目前的價格波動置於歷史宏觀內。當一個上揚的向上突破使Goodyear
    Tire的股價創下一九八六年新高點時（參閱圖1-18），只要快速地瀏覽背景圖，你就知道它也是這幾年來的新高點。這是特別有利的情況，因爲它顯示該股上檔不再有壓力。它已經進入處女地，已不存在「不賭就好」的賣盤。在沒有賣盤的情況下，該股就能夠持續走高。這也就是Goodyear
    Tire在一九八六年底至一九八七年初的實際表現。它在突破37高點之上後，幾個月內的漲幅較未'
