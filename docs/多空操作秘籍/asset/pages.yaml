    # 圖5-14


    # 三重確認型態


    第二種可資追尋的型態也能產生突出的獲利。除非巧合，否則它與收購對象沒有任何關連，但其結果一樣令人嘆為觀止。在某些情況下，它甚至比併購的股票更有利可圖。


    我很久之前便發覺這項技巧，而且在一九七○年代中期便在《專業軌跡解讀》中予以介紹。雖然這個型態能挖掘出令人難以置信的潛力股，但請注意它並不適用於短期交易。它是讓具有侵略性的投資人挖掘出潛在大贏家搭上主要漲勢的方法。在美式足球中，一個能跑、能傳、能踢的選手，會給對手帶來三重威脅。很少有人能在所有這三方面都表現非常傑出。在股'
  merge: -1
  img_proc: true
- pgno: 198
  md: '票中，這種型態也只是偶而發生，因為它需要不尋常的事發生——即三個不同的有利訊號必須相互在距離不遠處出現。


    除了股價必須處於移動平均上方之基本要求外，下列三項事件都必須發生。第一，必須有成交量訊號。這是極重要的！市場優勝股在突破時，其成交量幾乎永遠會顯著地大於第一階段底部區域任何一點的成交量。但對於這種型態的大贏家，我們想要看到的成交量不只兩倍於其前四週的平均成交量。另外，巨額成交量不應是短暫的。成交量最初的遞增應伴隨著數週的巨額成交量。這種訊號顯示對該股票有不尋常的興趣遞現，而且未來還有追加性需求。因為該股票才剛開始躍升，對於任何整理，買盤都急於追加其部位。如果回檔太淺而無法吸收買方的動力，買盤通常會演變為恐慌性買進。


    非常巨大的成交量（圖5-15之A點）再度成為超級贏家的關鍵要素，但它並非唯一要素。第二個焦點因素是相對強度（圖5-15之B點）。在區分好的買進與最佳之買進時，這是非常重要的工具。在三重威脅型態中，R
    S線一定要處於某個位置。它應處於負値區或以中性方式處於零線附近。然後，一旦第二階段突破出現，R S線應明確地進入正値區。這是非常重要的！我曾經表示，如果R
    S線位於負値區，你仍可買進該股。但是當我們尋求這個非常特殊的大贏家型態時，便無妥協餘地。如果相對強度仍保持在負値區，縱使該股可能是好的買進對象，能獲取不錯的利潤，但它仍不算滿足這裡的特殊標準。'
  merge: -1
  img_proc: true
- pgno: 199
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_199_0.png)


    # 圖5-15


    第三個所要追蹤的線索是股票突破前的大幅波動。我知道聽起來很奇怪，因為我們都希望儘可能便宜地買進；但這是侵略性大豐收型態的重大因素。如果一支股票仍處於第一階段底部時，便出現大幅波動的現象，那麼它突破時就有可能成為一團火球。就像跳高選手在起跳前會先彎下身來一樣，一支股票首先需稍做頓挫，然後在脫離閘門爆發時，其力道才會更強勁。依常例而言，股票在突破之前已經上漲40到50%或更多，則對未來數個月的走势最有利。但這會增加突破的一些短期風險，這就是為什麼我在前面強調，這種類型的買進全然屬於投資人而非交易員。'
  merge: -1
