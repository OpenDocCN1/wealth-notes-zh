    點），由於附近沒有進一步支撐，結果就像童話故事中一跌倒便無法爬起來的矮胖子一樣，蒙受大幅挫跌。


    # 4. 相對強度


    絕對不可放空一支具有正面相對強度的個股，尤其是其相對強度走高時。如果這麼一支股票向下突破而你正持有它，當然你會拋掉它；但你並不應該進一步放空。雖然在Mansfield'
  merge: -1
  img_proc: true
- pgno: 310
  md: '公司所提供的圖形中，相對強度處於零線以上的個股還是可以考慮放空，但它必須已經明顯做頭且趨於下跌。如果價格圖形向下突破時伴隨著其相對強度跌落負值區域，則這便是一個更具負面意義的現象。這種股票通常都能成爲放空的絕佳贏家。


    圖7-20的U.S. Steel在一九七四年時的表現，便是一個完美的範例。當時其相對強度十分強勁，即使它跌破位於42的支撐（A點），仍不應該放空。當它向下突破時，相對強度線仍十分穩健；因此，該股並未成爲有利可圖的放空對象。另外，圖7-21的Allen在一九七二年底時，便是一個絕佳的放空對象。其相對強度嚴重轉弱，股票跌破位於19的支撐時（A點），相對強度正貫穿零線。稍微瀏覽該圖便可發覺，當該股進入第四階段時，會發生什麼事。'
