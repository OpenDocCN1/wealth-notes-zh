    # 圖7-17


    猶如圖7-16與7-17所顯示，下跌趨勢的真正主因源於空頭走勢的類股與該類股之個股圖形所造成。


    Coleco為《專業軌跡解讀》在一七七三年初所推薦的放空對象，它成為下跌走勢中的大贏家並非巧合。該股具備所有要件；整體市場趨勢偏空，該類股也屬於負面，一旦Coleco向下突破且完成其頭—肩—頂型態（在本章稍後，我會仔細探討這個非常重要而且有利可圖的型態），它後續的圖表型態果然十分嚇人。


    # 3. 個股圖表型態


    現在讓我們將整個程序進一步地精練。理想放空對象構成'
