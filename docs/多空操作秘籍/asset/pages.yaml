  md: '是潛在的獲利而已。就像搭公車一樣，總會有另一班車的。但如果你在勝算不大的情況中慘敗，你所喪失的將是非常值得珍惜的一部份資金。這裡涉及一點數學。如果你投入50,000美元而損失了20%，你的市場資金將減少到40,000美元。要撈回本錢，你在下一次交易就得有25%的獲利。如果交易又失敗，那麼百分率將愈不利於你。所以「紀律」與「選擇」是你commit
    in 心的操作字眼。記住，即使我們錯失了一百支贏家，在一年之內只買進十支股票，其中七或八支成為贏家，我們仍能在市場中賺到真正的大錢。


    如果謠言股的圖形具有多頭型態，只是尚未突破，那該如何呢？或者，如果它已經移到壓力區之上，但仍未到達理想進場點，那又該如何呢？如果所有因素皆屬有利，而且你真的認為即使沒有謠言你也會買進，那麼它便值得一搏——對你來說可能的收購只不過是錦上添花而已。Kidde（圖5-3）在八七年中便是如此。當它挾巨量翻越37之上時，不論有無謠言，該股皆為有效的買進對象。成交量令人印象深刻，相對強度亦處於改善中，上檔也無進一步壓力。數週之後，Hanson
