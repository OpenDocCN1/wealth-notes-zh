- pgno: 129
  md: '# 第4章


    # 精鍊買進程序


    我們已經學會要先審查市場主要趨勢和發掘少數最佳類股，現在我們準備處理最終的步驟。現在是將我們的選擇縮小到類股中單一潛力股的時候了。我們如何決定該類股中的某一支或兩支股票應該買進？是否有方法可以預測某支股票既會上漲，而且會成為表現最佳者呢？


    絕對有！雖然絕無任何系統是未來的完美預言者，但是我們可以學習一些簡單的規則，使我們處於成功機率較大的一方。


    # 壓力愈小愈好


    我已經解釋過壓力的概念，但且讓我們快速地複習一次，然後再繼續深入探索。這對你未來投資的成功率非常重要，所以我們將謹慎地進行。在圖4-1中，X Y Z股票在大幅下跌之後，於18到20地帶形成一個交易區間。該交易區存在時，在18區域附近成為一個暫時的支撐。在上檔，因為每次反彈攻擊20的努力皆受阻，因此20變成該交易區間的壓力。然後，在該中性區間幾個禮拜的來回波動之後，X
    Y Z向下突破18的支'
  merge: -1
  img_proc: true
- pgno: 130
  md: '撐水準。這當然是一個負面指示，而且警示新下跌波的開始。在新一回合的跌勢中，X Y Z於低點13處走穩。於是它進入了另一個新交易區間，建立一個紮實的底部。新的支撐目前在13處，而壓力在15處。最後它克服了在15處的壓力，更重要地，它也翻升到移動平均之上方。


    現在你有足夠的理由知道這支股票可以買進。但你想要買它嗎？未必見得。雖然這支股票會上漲的機率很高，而且你也會賺錢，但這是不夠的。一開始這對你而言，聽來可能有些瘋狂。我不會訝異聽到你說，「史丹在說些什麼啊？我曾經買一堆沒用的股票，在我還沒有拿到回報單之前，它們就已經下跌了。現在你告訴我這支股票會上漲，而我卻不應該買進！」


    ![](img/63c92c8be10593e716ed1b88e7ce9321_130_0.png)'
  merge: -1
  img_proc: true
- pgno: 131
  md: '你只要隨著我多想一步，就能瞭解我並沒有失神。如果買進ＸＹＺ股票，你將因此而賺錢，這並不是可怕的事。但除了賺錢之外，我還想為你多做些事。我和你一樣，都希望你賺大錢！


    在經濟學裡有一個概念稱之為機會成本，它在此處完全適用。擱開那些戲慢的象牙塔術語不談，它意指我們都只擁有有限的資源，不論它是25,000美元或是2,500萬美元。所以我們必須最有效地運用我們的資源——在本例中也就是你的賭本。如果
    execution you buy XYZ stock, it rises 20%, but ABC stock rises 200% in the same
    period, then we actually lost profit potential. Therefore, what we want to do
    is dig out the best stocks, leave the second best to others.


    現在回到圖4-1，我將告訴你為什麼這是支次佳的股票。一旦ＸＹＺ股票突破15的壓力而顯露正面訊號時，你就必須觀察下一個壓力區域在那裡。它在18，那是前一個交易區間的支撐。支撐一旦跌破，當股票隨後反彈到該水準時，它就會成為壓力。假設ＸＹＺ克服該壓力，則它將發覺一路上升到20的道路十分艱困。所以整個18到20間的區域代表潛在的重要壓力。這當然不意味該股永遠無法克服那個區域。它所意味的是該股將付出相當的買盤力道才能通過這個地帶。所以它非常可能在該區域停留一段不短的時間。即使在非常不可能的情況下，它快速通過壓力區，最後仍將疲倦而必須重整軍容。這無異於某人爬六層樓梯到他的公寓，另一人卻搭電梯。很明顯地，誰會'
