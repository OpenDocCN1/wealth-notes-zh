  md: '圖6-24的Merck（MRK）說明股票即使在行進途中稍微貫穿移動平均，你仍能繼續持有該股。但是，這只有符合兩項重要準則時才是正確的。第一點，移動平均必須仍然處於上升狀態。第二點，先前整理低點不能被穿越。如果你在一九八五年，當Merck翻越壓力時於約60時予以買進，你的最初停止賣點應設在A點。然後，當它在沿途整理而上漲，保護性停止賣點應依序調升到B、C、D
    等位置。猶如你所見者，停止賣點永遠保持在移動平均下方，縱使整理低點位於其上方。這是投資人必須牢記在心裡的要點，因為交易員的操作方法相當不同。


    在你提高停止賣點到E之後，Merck漲到新高點，然後龐大的賣壓暫時將股價壓到三十週移動平均稍下方。但該向下突


