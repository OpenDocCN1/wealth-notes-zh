    # 圖6-19


    # ‧ 適當地賣出——投資人的做法


    我們已經知道何者不可爲，現在就讓我們開始討論決定何時該賣出的正確方法。理論上來說，投資人與交易員的做法是相似的，不過其中還是有些不同的指導方針與參數。我們先討論投資人的做法；下一節我們再檢討交易員應該如何運作。


    所有優秀交易員或投資人首先應該要做的事情，就是瞭解自己絕對不可在沒有停止賣單（sell-stop）的保護下持有任何部位。所有期貨交易人士都知道這是成功的關鍵技巧。股票市場也沒有什麼不同。只是波動較爲緩慢而已。在股票指數期貨與電腦程式交易發明之後，這其間的差異很快就變得更小了。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '一九五○年代時需要耗時經年的週期循環，現在可能只需歷經數月便發生了。


    股票市場波動的增加，如同劍之雙刃。從正面而言，它提供我們更快速的賺錢機會。負面則是當股票反轉發生時，你的股票很可能非常迅速地就從第二階段進入第三階段。這種情況對於法人機構過份偏愛的個股來說尤爲眞確。一旦出現利空消息而法人機構先恐慌，這種股票眞的就會快速轉向。保護你自己的方法就是採用停止賣單。這是我在第三章教各位的停止買單之反面。


    # · 停止賣單


    唯有預先設定的價位觸及時，停止賣單才會被執行。舉例來說，如果ＸＹＺ股票目前交易於30，而你遞出26.875的停止賣單，那麼唯有ＸＹＺ向下突破27時，它才會生效。然後，它就會成爲以市價成交的賣單。在多數情況下，交易會發生於非常接近26.875處。猶如停止買單一樣，你應該以取消前有效之基礎（good-''til-canceeled）遞單。另外，有個與停止買單稍微不同之處，我建議你對於紐約證券交易所的個股直接遞出單純的停損單（stop-loss），而不要採用停止賣出限制單（sell-stop
    limit order）。在紐約證券交易所，這兩種委託單皆可使用，但是賣出與買進並不相同。在嘗試買進時，對於既定股票願意支付多少錢，我們具有很大的選擇性。假設我們遞出一張'
