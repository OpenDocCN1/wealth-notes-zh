- pgno: 308
  md: '之因素很多。我們不希望只是找到即將下跌的普通放空對象而已。我們要的是一個絕佳的放空目標。有一種瀉網可以協助你區別優劣。首先要確定該股在形成頭部之前，出現過相當大的漲幅。如果頭部出現在平淡的第二階段漲勢之後，那麼很可能就只會有一小段跌勢，將它拉回到先前的底部區域，這將不會是一段令人興奮的旅程。如果你的放空對象在第三階段頭部形成之前，曾經像火箭一樣飆升，那麼出現大幅挫跌的機率就非常高。第二個需要密切觀察的因素，是要觀察在向下突破附近，是否有重要的支撐區域。


    這裡有兩個圖形，兩者皆形成第三階段頭部，然後向下突破進入第四階段。圖7-18的Northwest Airlines（NWA）只出現了一小段下跌，因為在22附近有堅實的支持，該支持距離


