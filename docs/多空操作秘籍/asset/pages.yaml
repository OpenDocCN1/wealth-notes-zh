- pgno: 97
  md: '夏季行情症候群的看法。同時，二月、五月、六月與九月都有可怕的記錄。這是你應該放輕鬆的時間，除非圖形或指標呈現正面徵兆。


    在其書中，Yale Hirsch根據一九五〇年以來的標準普爾綜合股價指數之漲跌幅做了一些有趣的研究。整體而言，其結論與Merrill的研究相當一致，但有一些值得注意的差異。雖然他也指出十一月到一月份極具多頭氣勢，但十一月份實際上是十二月份行情的前導。另外，四月份表現也很好，因為近年來承I
    R A買盤之惠。表現較差的月份仍然是二月、五月、六月與九月份。


    現在讓我們在顯微鏡下，更仔細地觀察一週當中每天之情況。再一次地，現實與神話互相衝突。一般投資人認為在享受週末的歡樂與陽光之後，週一市場會準備走高。然後，因為他們不斷聽到人們重覆預期，因此市場於週五會出現賣壓。理由是交易員理應在週末之前拋售股票，這樣他們才不用擔憂週末的新聞事件。這些看法絕對是錯誤的！猶如Yale
    Hirsch的數據（參閱圖3-8）所顯示，週一是一週內表現最差勁的一天，週五則是最強勁者。在空頭市場中，週一尤其可怕，這也就是人們說「憂鬱的週一」的理由。縱使處在多頭市場，週一也實在沒有什麼值得興奮之處。'
