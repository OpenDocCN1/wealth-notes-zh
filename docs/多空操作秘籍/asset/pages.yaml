    現在將你的注意力轉移到圖8-26。當我刊出這張過度樂觀的集錦圖片時，華爾街正快馬加鞭策地進入多頭狂熱階段。國內最具威望的一家報紙告訴我們「多頭來臨了」！另外，基本放款利率正在下降，而盈餘也正在上升。你可知道市場在幾天之內便到達一九七六年的高峰位置,1,026點。因爲有太多的長期指標正在逆轉，因此一九七六年九月到一九七八年二月的空頭市場將由此開始，這其實是非常容易預測的。


    模式總是以相同的方式出現。相反意見的另一個美好案例出現在一九八二年的夏天（圖8-27）。雖然當時很多分析師與投資人都相信嚴重的衰退與道瓊指數500點很快就會來臨，但我卻發出了主要買進的訊號，因爲我的關鍵性指標中絕大多數皆轉正，完全不同於新聞的負面報導。'
