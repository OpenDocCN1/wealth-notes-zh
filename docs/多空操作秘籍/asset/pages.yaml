- pgno: 8
  md: '遠在你閱讀或收聽到報導之前。況且，市場價格乃反應未來而非目前的盈餘。若想要成功，你就必須學習利用市場行為所提供的線索。本書會教導你如何發掘線索，並且將它們轉化為利潤。


    依賴華爾街神童——經紀人與分析師的意見，也很難使你有所進展。證據明確顯示，專家意見遠遜於你對著股票版投擲飛鏢所得到的結果（相信我，一組飛鏢的費用便宜多了）。大多數的專家總是把時間花費在與其他經紀人或分析師交談。他們赴午宴，財星五百大公司的經理人員則會招待他們豐盛的餐點，並提供公司目前營運的資訊。而你只要參加過幾次這種午宴，便會發覺那些餐點與資訊都擺在桌上很久了。


    真正的市場專業與交易所的專家，絕不會執著於任何類似的誤導。他們的決策乃根據市場行為，而非消息。遵循陳腐教條的大眾正陷於虧損狀態時，真正的市場專家正在大撈財富。一般投資者總說他們在股票市場非常不幸運，但這種說法是荒謬的。這與運氣毫
    xả相干。他們只是採用了錯誤的規則參與遊戲，因此除非他們能夠學習什麼是獲勝的規則，否則他們將繼續績效不彰。為了踏上致勝之路，他們所需要的是一貫的方法來掌握市場的適當時機，並控制兩個市場敵人：貪婪與恐懼。


    這就是本書所關注的一切——獲勝。在犯下許多錯誤之'
