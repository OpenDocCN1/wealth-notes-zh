- pgno: 138
  md: '發性的大贏家。就算我們永遠無法發現成交量十分重要的理由，但只要快速研讀任何圖表，便足以說服你相信成交量對於確認突破具有關鍵作用。但是，這裡有一個好理由，可以說明爲什麼成交量訊號確實能有效運作。成交量是買方力量強弱的衡量儀器。就像前面所述，股票有可能因爲本身的重量而下跌，但卻需要很大的買盤力道才能驅使它上漲。這與推動一個圓石上山沒有什麼不同。你必須花費相當的精力才能將它移到山上，但是只要你放開它，它就可以從其本身的重量凝聚相當的下降動能。


    規則十分簡單。永遠別相信一個未伴隨成交量巨增的突破。圖4-7明確地顯示出技術面健全的型態，其成交量應該如何展現。當股票處於底部區域時，成交量將呈現不規則。我的研究結論與許多技術分析師不同。有些人相信底部首先應有一根大成交量，顯示該股最後的恐慌性賣壓。他們認爲，成交量隨後應該萎縮（枯竭）以顯示賣壓減輕。雖然這是個好理論，但我看過太多太多的圖形，各有不同的成交量型態，它們都能成爲大贏家。所以，讓事情單純一點，只要具有獲利性，我不擔心股票在形成第一階段底部時，其成交量是以何種型態出現。可是，一旦
    X Y Z 股票向上突破其壓力區域頂部且騰越其移動平均時，我就要你好好關心成交量的變化。猶如圖4-7所示，成交量於突破時必須大幅增加。如果不如此，那麼在最佳情況下，手握一支平庸的贏家而且僅小漲幾點的機率非常高。最糟的情況下，該股結果是假突破，很快就會又跌回交易區間。'
