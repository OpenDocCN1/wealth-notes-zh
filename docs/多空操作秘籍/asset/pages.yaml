- pgno: 276
  md: '教訓很明顯。請務必以停止賣單保護你的所有部位，不可以有例外，因爲有些股票屬於特殊情況。


    # ・賣出的哲學，沒有必要別把獲利吐回


    光是瞭解賣出的機制還不夠。你還必須瞭解伴隨該方法的致勝哲學。很多市場參與者對待獲利與虧損的方式，我只能將其歸爲異類。他們的觀點會導致怪異且具毀滅性的決策。如果
    X Y Z 於40時買進，而現在跌到20，此時你問十個這樣的投資人，他們虧損多少，其中有八個人會回答完全沒有！傳統的智慧認爲，只要不賣股票，就沒有虧損；或者它只是帳面上的虧損。這是很荒唐的！你的股票只値它收盤時的價格。它是一項資產，只要市場有營業，你隨時可以賣掉。如果你決定將某部位的籌碼變現，你就可以拿到該筆款項並隨意處理。可是正因爲這種損失50%不算真正虧損的無稽觀念，使他們持有再持有，想要等待股票漲回到原來價値，如此他們才不會自覺愚蠢。這不僅使資金招致無謂的縮水，也喪失了將資金移往另一個第二階段股票的機會。相反的情況也很荒唐。如果他們在40買進一支股票，然後它竄升到80。他們會覺得並沒有獲利，因爲還沒有賣掉。他們會覺得那還是「別人」的錢。但其實他們應該要知道，這些真實的獲利若不加以適當保護，獲利即會喪失。


    一旦你以這種方式重新整理你的思考，你所採取的行動就會有所不同。想想看，如果你在40買進1,000股的X Y Z，然'
  merge: -1
  img_proc: true
- pgno: 277
  md: '後它漲到80，你的40,000美元現在就變成有80,000美元的價值。你可以兌現該筆款項，將它移往另一支股票。如果你想拿它當做房屋的頭期款，那也是你的選擇。但如果你沒有好好照顧你的生意，因為沒有使用停止賣單而讓你的股票從80跌到40，那麼你便損失了這辛辛苦苦賺來的40,000美元。


    我強烈建議你在每個週末將你的投資組合價值加以計算。如果每週的變動只是幾個百分點，那就不必擔心。市場本來就是這樣。但如果你看到你的資產下跌20%到25%，那就有問題了。如果你有採用停止賣單，那很可能是你在停損點上方很遠處買進股票而承擔了過高的風險。如果情況並非如此，那很可能是因為市場情況惡劣，將你的部位一個一個洗出場，使你連續產生許多小額虧損。在這種情況下，你就只需退場觀望，直待致勝機率轉好即可。在第八章，我會教你如何與幾個便於計算的指標保持密切接觸，這可以防止上述情況發生。同時，不斷持續列出你的成績，可使你對資產管理變得更嚴肅，絕不准許獲利溜走。


    觀察圖6-39的T S Industries（T N D S），你便可以瞭解我的意思。該股在一九八七年崩盤時遭到痛擊。很多投資人累積了豐厚的利潤又全部喪失，並且還額外付出不少代價。如果你irth該股頂部時有所遲疑，後來發生的事你也就沒什麼藉口好說的了。我於一九八六年初在《專業軌跡解讀》中推薦T
    N D S，當時它位於10之下。在接下來的一年半裡，它以完'
  merge: -1
  img_proc: true
- pgno: 278
  md: '美的第二階段型態向上漲升，期間不曾觸及其上升三十週移動平均。它在整段期間甚至不曾觸及任何的次要支撐。然後，在一九八七年九月底，於31的上方建立了一個堅固的支撐基礎後，它觸及34.5的高點。因為移動平均逐漸喪失上升動力而走平，我提升停止賣點到30.875。幾個禮拜之後，該停止賣點被觸及，於是該股以優於200%的獲利結束。但對於沒有遊戲計劃的投資人，或者那些自認爲可以繼續給予T
    S Industries較大轉圜空間的市場玩家而言，發生在他們身上的事就很令人驚歎了。在我出脫該部位的幾個禮拜之後，該股票跌了令人嘔心泣血的92%，甚至觸及2.75
    的低點！在三個禮拜裡，為期兩年漲勢所帶來的整個利潤一筆勾銷。如果你能忠實遵循你現在所知道的紀律，你就永遠不必要因為這種市場夢魘而失眠了。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_278_0.png)


