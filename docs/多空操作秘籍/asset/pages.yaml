  md: '現在看看一九八七年的超級漲勢（G點）。雖然市場向上攀升，但這項指標不再上升，實際上還稍微傾向下降。這顯示在表面之下某些事物已經廢敗了。當這項指標與我們的其他指標在十月份進一步同步轉弱時，你就知道天大的麻煩要出現了。一九八七年的崩盤當然符合了該項預言。所以應該非常明顯地，這項易於建構的長期指標，是你必須不斷密切注意的指標。


