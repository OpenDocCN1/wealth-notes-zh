    # 買進的理想時機


    # · 如何買、何時買、買什麼


    閱讀前兩章的內容之後，你的能力已進展到超出你所能理解的地步了。如今你已能夠拿起你的投資組合及圖形，區分良莠，不再盲目地依賴你經紀人的意見。你現在能夠快速地審視你的股票中，哪些是有高成功機率者，哪些很可能會為你帶來潰瘍之痛。知識即力量，而你正邁向成為Hercules(註1)的途中。但你仍有一些重要事項有待學習。現在地基已設置妥當，你已能輕易地分辨第二階段的多頭股票與第四階段的空頭情況。


    下一個步驟是要架設建築物的其餘部份，學習最佳買進時機。另外，瞭解應該如何買進股票以及知道買進什麼股票是非常重要的。其之所以極端重要，是因為當你瀏覽圖形時，尤其是處在熱滾滾的多頭市場時，你會發覺有數以百計的股票可以買進。因此，學習如何篩選具有超級上漲空間的最佳股票、而捨棄次等股票的工夫，便具有絕對重要性。


    > (註1) Hercules為希臘神話中的大力士。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '在本章稍後，我們會處理買進什麼股票的問題，該問題比何時買進股票要困難的多。但是你首先必須精通下一個基本技巧，那就是精確地知道在何處介入一支股票。當你看到一個呈大幅上漲走勢的股票圖形時，哪一點才是最佳買進時機？理想的介入點就是我們即將討論的焦點。


    # · 投資人的作法


    對投資人而言，有兩個好時機可以從事新的買進，兩者皆圍繞在突破點附近。一是股票首次脫離第一階段底部而進入第二階段時。第二個比較安全的時機，是第一階段最初的買進狂熱消散而股票拉回接近突破點時。在拉回時買進的優點是你能扮演影評人角色，依你所見者下判斷。成交量是否巨幅放大？股價是否漲至突破點上方很遠處？成交量在拉回時是否萎縮？或者
    X Y Z 是否只是稍微突破關鍵性壓力水準後，即行回挫至其下方，這永遠代表警訊？一旦你觀察這些行為，即能明白自己是在處理潛力絕佳的股票還是絕差的股票。


    所以，何種戰略最佳？你是否應該等待只在拉回時才買進？不！如果你只等待這種風險低的買進時機，你將會錯失最大的獲勝良機。那些不曾拉回的股票，總是展現出最強勁的衝力。那些股票將會帶來豐厚的利益，我們絕對不會希望棄其於發射台上。如果你是長期投資者，可以稱作妥協，先將你欲投資部位的一半在最初突破時投入，等到後來股票如果拉回接近突破價，而你又喜歡其突破後之行為模式，再投入其餘一半'
