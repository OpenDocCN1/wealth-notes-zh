- pgno: 221
  md: '業類股時，這種思考形式尤為普遍，因為該類股通常會提供慷慨的殖利率。它們處於第二階段時，持有這種股票是件好事。雖然它們通常不會大幅上漲，但是總報酬情況還不錯（價格上漲加上股利），這當然比銀行利息5.5%要好。一旦這些股票進入第四階段開始朝下奔走，那麼持有這種股票與持有任何其他第四階段輸家都是一樣的荒唐。記住，如果你獲得10%的殖利率，卻因為價格下跌而損失20%，這絕不是致勝的算式。這還算好消息。實際上還可能更糟。股票價格巨幅下挫通常有很顯著的預警，顯示出該公司未來會有利空之經濟面消息。該消息可能非常不利，以致於公司可能完全沒有能力支付未來的股息。許多投資於像是Continental
    Illinois或其他墮落天使的投資人，最後都經歷了劇痛才學到教訓。


