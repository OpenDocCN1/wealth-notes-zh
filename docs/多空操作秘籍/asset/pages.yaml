  md: '閱讀了今天新聞的基本面報導，然後就根據這項消息做出反應，結果你必將無法一貫的賺錢。這種做法是大災難的處方，是投資新手所吸唉的毒藥。你一定要瞭解，市場具有充分吸收（discounting）的機能，股票價格的決定乃是依據未來而非目前的基本資訊。因此我採用技術分析法，來解釋市場對於已知資訊預期所作出的解釋。千萬不要被怪異的名詞嚇著。所有的技術分析實際上都只是針對價量關係的研究，並藉此發展出對未來趨勢的觀察。


    在本書中，我將教導各位一套新的規則與一套新的市場語言，這將使得市場變得比較容易預測、比較容易獲利，同時比較令人愉快。不幸的是，多數交易員與投資人認為技術分析比較類似妖術或天文學（有一些技術分析人員操作方法，確實離此看法不遠）。事實上技術分析比較像藝術而非科學。任何人都能提起畫筆，但並不表示他就是畢卡索。同樣地，一個人翻開線圖，也不代表他就是約翰馬姬（John
    Magee）(註2)。我將教導各位這個方法。對你而言，它將是一套新的規則。只要適當地運用，這個方法將使你在市場上更容易獲勝。


    那麼，這個方法是否完美無瑕呢？當然不是！就算是一個


    （註2）約翰馬姬於一九四八年著作了《股價趨勢技術分析(典藏版)》（Technical Analysis of Stock Trends，寰宇出版F243/F244）一書，而被視為技術分析的始祖。'
