  md: '同樣的致勝戰術也在Dow Chemical（圖7-36）得到良好印證。該股在一九七七年空頭市場遭受嚴厲打擊。當Dow跌破位於A點的支撐與三十三移動平均時，該處大約為53，此時該股已完成第三階段的頭部型態而進入第四階段。最初，該部位應該以緊密的保護性停止買單加以保護，因此停止買點設定在B點，即先前漲升峰值位的稍上方。在接下來的幾個月，停止買點應依序調降到C、D、E點等，直到它最後調降到位於25.125的M點爲止，然後就在此點以極可觀的獲利出場。注意，假若沒有紀律的協助，當股票在接下來幾個月回升到35左右，你將開始吐回原本豐厚利潤的其中一大部份。我們的停止買進系統不但讓我們未陷入令人沮喪的後悔過程，反而使我們在底部3點內出場，並且在整個下跌過程中讓我們心情保持輕鬆，而且能控制整體局面。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_333_0.png)


