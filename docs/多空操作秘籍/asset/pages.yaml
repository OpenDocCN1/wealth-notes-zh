- pgno: 56
  md: '不是開玩笑，這曲簡短歌謠中所蘊涵的市場策略，遠較百老匯或華爾街大廈裡喰出的基本教條來得紮實。想想這智慧之語：


    > 「你一定要明白何時該把 握，知道何時該放棄，明白何時該離開，知道何時該落荒而 逃」。


    不論你在玩撲克或股票遊戲，學會依勝算而搏、懂得採用專業技巧，都是非常重要的。


    如果你讀完本書之後，除了不再買進或持有第四階段的股票之外，即使並沒有改善你其他的操作技巧，我仍可以保證你在下一年度將大幅提高你在市場中擊出安打的比率。當你看到你明年的所得稅單時，說不定你會認為你的會計師搞錯了。請不要誤解我的意思——真正要成為一個大贏家，還有很多東西必須學習；但這個策略是如此地重要，以致於我要如此地強調。


    > 「市場分析家」肯尼羅傑又告訴我們，「每個賭徒都明白，生存的秘訣就是要知道什麼該丟棄，知道什麼該保留，因為每手牌皆是贏家，每手牌皆是輸家」。


    這個觀點也是正確的。這幾年來，我曾經看過許多投資組合的選股，其中贏家牌總多於輸家牌，但最終卻仍以巨額虧損收場。業餘投資人經常過早拋出手中的贏家牌以獲取微薄的利'
  merge: -1
  img_proc: true
- pgno: 57
  md: '潤，而持有的輸家牌卻演變成第四階段的大災難，給自己帶來一場惡夢。反之，較為深思熟慮的玩家則能獲取巨額利潤，因為他們在第二階段便一路乘勢而行，而且快速地拋售問題股。所以，這實際上只和「知道什麼該丟棄、知道什麼該保留」有關。


    請檢查一下你個人的經驗。有多少次你手中的持股應該在50賣出，但你卻只是看著它跌到47，然後45，然後40？這時你的經紀人拉著你的手，向你保證它仍是50美元的股票，這種鼓勵聽起來多麼美好？（不幸的是，這種莫名的信心只在別的地方管用）更樂觀一點，你的經紀人可能會提供這麼一個絕佳的意見：如果該股在50值得買進，那麼在40就更值得買進了。所以你沒有賣出，事實上，你採用了危險且具毀滅性的向下攤平策略，加重了你所犯的錯。你在40又買進，告訴自己只要它回到45就打平了。幾個月以後，那支40的便宜股票跌到25，價格又更便宜了。股價下跌的基本面利空消息雖然來得晚但總算公佈了。此時，當第一階段底部開始形成，結果你卻以巨額虧損拋售掉你的部位。


    聽起來熟悉嗎？別再讓這個惡夢變成你的宿命，因為股價愈挫愈低時，你不必聽由它擺佈，也不必再去祈求底部的形成。反之，你應該控制全局；你應該負責任地拋棄掉任何處在第四階段的跛腳股票——不論你是獲利、打平或是虧損。記住，市場是機械式的、沒有思考能力的個體，它不知道、也不'
  merge: -1
  img_proc: true
- pgno: 58
  md: '關心你對某支個股所支付的價格。所以，如果你的持股成為了輸家，就跟它說再見吧！否則你的利潤將會消失，或者你本來的小小損失，將會演變成巨額虧損！


    現在讓我們回顧圖1-6的X Y Z股票。注意它最初在25.875向下突破。起初它下跌到23處，接下來幾乎永遠都會有一波以上的反彈出現，使股價回升到向下突破點附近，因為逢低承接者發覺股價相對於他們近來所見者已經很便宜了。此後，下降趨勢正式啟動，移動平均也開始下滑。從報酬／風險分析的角度來觀察，這是你
    inventario 在市場中所能遭遇到的最危險情況。想想看，如果你能永遠不再陷入這種境況，那將是多麼令人興奮且具有獲利潛力的事情。當你每天翻開報紙，發覺這類股票交易頻繁——你知道有某些人在買進，而你會感到很欣慰，因為那一定不是你。


    在第四階段時，每次下跌都創新低點，而每次超賣後的反彈都會低於前次高點。這是下降趨勢的典型例子。更糟者，所有這些負面行為皆發生在移動平均下降趨勢線的下方。不幸的是，在這個階段會有許多單純的投資人企圖挑選便宜貨，因為他們認為股價已經跌得夠深了。但是捕捉下落中的星火，絕對是灼傷自己的好方法。'
  merge: -1
