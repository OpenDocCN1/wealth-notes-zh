  md: '態，且移動平均開始走緩。幾個月之後，該股崩跌到9.625。值得注意的是，本益比在十八個月內皆屬偏高，股價卻仍持續走高。唯有在供給量追平需求量而第三階段的危險頭部形成之後，Maxtor才終於下挫。這明確說明了爲什麼我們的技術分析方法，較本益比超值之主觀理論更爲有益而且更加精確。


