- pgno: 312
  md: '# ### 5. 成交量


    現在，請謹慎留意！當我們站在買方面對向上突破時，成交量居於關鍵地位。未經成交量確認的向上突破，你絕對不應買進。如果你已經買進，而成交量並未確認，你就應該在第一段小漲中將它賣掉。放空時則全然不同。雖然以成交量明顯擴增確認其向下突破是個很好的現象，但是對於致勝的放空而言，成交量並非必要。股票上漲需要力量，但股票卻可以因其本身的重量而大跌。有很多案例，例如一九七三年的Jonathan
    Logan（JOL），成交量並未確認其向下突破，但該股仍成為令人嘆為觀止的贏家。JOL於55向下跌破趨勢線時（圖7-22之A點），完成了主要頭部。你可以注意到該點（B）成


    ![](img/63c92c8be10593e716ed1b88e7ce9321_312_0.png)


    圖7-22'
  merge: -1
  img_proc: true
- pgno: 313
  md: '交量有多低。這並未阻止該股崩跌近90%！如果成交量在向下突破時猛增，而在拉回向下突破區域時萎縮，這便是更具負面意義的現象。雖然你在買進時絕對要遵循成交量的法則，但處於空方尋找潛在贏家時，則沒有必要視成交量為主要的優先考慮因素。


    # 6. 支撐


    最後一個檢查因素為該股票下檔附近的支撐。理想的放空對象是其之前具有陡峭的第二階段漲勢，沿途沒有密集成交區域。當反轉發生時，這種情況便會出現遽跌。另一方面，若一支股票緩慢上漲，而在向下突破水準不遠處有廣大的交戰地帶，則該股將會有大得多的抗跌性。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_313_0.png)


    圖 7-23'
  merge: -1
  img_proc: true
- pgno: 314
  md: '圖7-23的Pacific Scientific與圖7-24的Banc One說明了這點。Pacific具有直線上升的第二階段漲勢，沿途沒有密集交易的重大支撐。毫不令人訝異地，它下跌的速度甚至快過其上漲，而在跌勢中出現對稱的現象。


    圖7-24的Banc One Corporation則提供我們非常不同的型態與結果。首先，其漲勢較緩慢，也較不刺激。另外，它在20到24地帶交易了一段時間，然後向上突破而穿越到28之上。當Banc
    One跌破其三十週移動平均與趨勢線（A點）後，跌勢非常緩慢。它曾數度測試位於20的主要支撐，但皆未跌破。所以在篩選放空對象時，請永遠偏愛那些下檔具有極小支撐的圖形。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_314_0.png)


    圖7-24'
