- pgno: 315
  md: '# · 濾委訂單


    一旦你決定放空某一、兩支股票，下單方式應該如下所述。如果 X Y Z 股票於 24.875 向下跌破，則以 24.875 停止與 24.375 限制之方式放空所拋出的股數。此處有一點與買進時不同。買進時，如果該股交易活絡，則停止買進價格與限制價格之間的價差可設為
    0.25。但放空時，你應該讓它至少維持 0.5 點。對冷門股而言，價差可能更大。為什麼？在紐約與美國證券交易所有個老舊的規則，稱為上檔規則（uptick rule）。它要求你只能在較高的價位放空。依據我個人的意見，這是荒唐而缺乏邏輯的規則，它起源於一九二九年的股市崩盤。為了避免空頭襲擊，交易所——根據其無限的智慧——決定不準許放空者迅速壓低股價。這顯示交易所非常偏愛多頭市場。但你是否能夠想像，他們要求你只能在價格走軟時買進股票？這簡直是無稽之談，因此我相信有一天上檔規則終將會被取消！不過目前由於此一規則，因此你應該要讓你的放空有較大的轉圜空間。


    如同買進一樣，你所濾出的委託單應該設定為取消前有效。在店頭市場交易時，由於無法實際運用停止委託單，因此你必須依靠你的經紀人。不過在店頭市場交易的優點是沒有無稽的上檔規則。因此，如果你看見
    X Y Z 向下跌破 25 的內盤，而 24.875 應該是放空之處，那麼只要內盤出現 24.875，你的經紀人就可以立刻為你放空。在崩跌的市場中，這實在是很大的優勢！'
  merge: -1
  img_proc: true
- pgno: 316
  md: '# 永遠不會太遲


    截至目前為止，我們都在討論如何於向下突破點附近放空。當股票已有相當跌幅後，放空是否仍為可行？答案是當然可以。雖然在頭部附近放空比較理想，原因是潛在利潤比較大，但請記住，真正的大輸家在觸及堅實底部之前，看起來總有進一步大崩盤而跌得更慘的傾向。在第四階段下跌中放空，是交易員的好戰術，因爲隨即而來的賣壓通常既迅速又瘋狂。但是這套戰術僅適用於下降移動平均下側的盤整型態，且向下突破再發生之時。


    這種型態的交易相當於在第二階段中的連續買進。猶如連續買進比較適合交易員一樣，這種型態也比較適合積極的市場玩家與交易員。但是這樣的放空有其優點，因爲當它再向下突破時，下跌速度會非常快。放空一支像Winnebago（圖7-25）的股票——它已經從50附近下跌到22——即使是在其出現整理而於21.875（A點）處再次向下突破時放空，仍然很有道理，因爲它很快就產生了豐厚的利潤。這種型態的適當放空對象，是屬於已經跌到無人喜愛類股中的部分個股。如果你能找到這樣的一支股票——如同一九七二年的Winnebago，而且倘若它曾經爲法人機構所偏愛那就更好了。法人機構由愛生恨時，你可以更加安穩地下賭注，並認定它一定會出現恐慌性賣壓而造成長期跌勢。'
  merge: -1
  img_proc: true
- pgno: 317
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_317_0.png)


    COURTESY OF MANSFIELD STOCK CHARTS


    # 圖7-25


    在圖7-25的例子中，雖然價格已經巨幅下跌，但其下檔的潛在百分率仍舊十分可觀。即使不管先前的大幅挫跌，就算後來從22跌到3（依據Winnebago之案例），仍是十分可觀的下跌百分率。


    你必須確定，不會去放空一支沒有出現適當型態的股票。你必須確定整理曾經出現，而新的向下突破也確實發生。你必須鑒定適當的進場點，並且在上檔需有若干壓力及安全位置，可供你設定保護性停止買單。'
  merge: -1
