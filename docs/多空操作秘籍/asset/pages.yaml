- pgno: 114
  md: '不要誤認爲這些股票表現優異是因爲新的多頭市場正在進行。那當然有所幫助，但如果沒有做好技術分析的功課，你可能就會掉落到基本分析的陷阱之中，買進低本益比的個股例如
    Warner Communication（W C I，參見圖3-22）。它是一家非常好的公司，在一九八二年夏天，當市場展開新的多頭行情時，它過去十二個月的盈餘極佳，爲4.35美元，而W
    C I 的本益比只有十一倍多。如果你在一九八二年中買進它而非買進汽車旅館股，一年之後，你將蒙受60%的可觀損失，而非260%的獲利。


    是否有任何技術面的暗示警告你離它遠一點？當然有！參閱圖3-21的娛樂業類股圖形。它在一九八二年夏天向下突破其移動平均，而汽車旅館業卻向上突破。尤有甚者，在那個夏天，娛樂業的相對強度線相當疲軟，實際上它落入負值區。最後一點，其個股圖形表現不齊，有些還好，其他如Warner
    Communications則看起來恐怖。注意Warner（圖3-22）在夏天向下突破進入第四階段，而大多數的股票和整個產業則進入第二階段。甚至在一九八二年其惡性崩盤之後，更多麻煩還埋伏在前方。一九八二年底超賣後的大幅反彈，使其股價由30多上升到60。但是，該反彈僅止於空頭趨勢線(註10)。此後，Warner挫跌到20，逢低承接者受到了真正的懲罰。


