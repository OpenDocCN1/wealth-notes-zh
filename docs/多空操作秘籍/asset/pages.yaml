- pgno: 303
  md: '# ・ 何時該放空


    下一個要解決的問題是：何時是放空的最佳時機？是在最初向下突破發生時（A點），還是等它反彈拉回到原來向下突破的區域時（B點）？同樣的，之前我們在買進時所學習到的每件事情，在放空時仍然有效，只是要顛倒過來即可。我先前曾經說過，面對向上突破的情形時，如果你在拉回時買進，風險較低，但是它很可能不拉回，如此一來你將完全錯失機會而永遠無法買進該股。因此我奉勸投資人，最佳戰術是在突破時買進一半的部位，另一半部位則在股價向突破點拉回時再投入。另一方面，交易員應設法攫取機會，因此在突破時即買進全數部位。放空的法則也是一樣。交易員尤其要瞭解這個重點。雖然朝向下突破點拉回的情形占一半以上，但它發生的頻率仍遠低於向上突破的拉回。理由很單純。股票下跌乃源於恐懼，一旦恐慌出現，它就會一面倒。但保守的投資人希望將風險維持在最低點，因此仍應在最初向下突破時先放空一半部位，然後在拉回時再放空另一半部位。


    圖7-14推薦的一支放空對象——說明了我要表達的意思。只要它停留在第二階段，即使其本益比已高達47倍的荒唐水準，我們仍拒絕加入群眾來稱它為高估的股票。移動平均一旦停止上升而形成頭部，這就是把它列入放空名單的時機了。在它向下跌破A點之後，它仍不斷向下挫跌，接下來趣事便開始了。'
  merge: -1
  img_proc: true
- pgno: 304
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_304_0.png)


    圖7-14


    +   • 採取有利的步驟


    如同在考慮買進時需要採取有紀律性的步驟，在放空時也應該有這樣的步驟。


    +   1. 市場


    整體市場趨勢是一個非常重要的起點。雖然我不會告訴你整體市場處於多頭時，你絕不可放空股票，因為實際上有例外，但這原則上仍然成立。恰如我在第五章所示者，在一九七三年的空頭市場時，還是可以買入一支像National
    Semiconductor一樣傑出的多頭型態股票，同樣地，即使整體'
  merge: -1
  img_proc: true
- pgno: 305
  md: '市場趨勢相當有利時，還是可以放空一支具有傑出空頭圖表型態的股票。在空頭市場買進的National Semiconductor，應該可以被視為是你所持有空頭部位的一項避險工具。依據相同的說法，如果你能夠找到一支具有傑出負面圖表型態的個股，也可將它視為是你所持有多年部位的一項避險工具。不過一般而言，最好保持單純。市場主要趨勢偏多時，你會比較希望尋找買進對象。相反地，市場氣氛顯然偏空時，你也會希望能找到放空的對象。市場指數顯然偏空時（像一九六一、一九六六、一九七三到一九七四、一九七七，以及一九八一
    到一九八二年時），便是個可以考慮放空的起點。一旦主要趨勢明確認爲空頭，猶如在一九七三年初（參閱圖7-15），放空攬取暴利就會


    ![](img/63c92c8be10593e716ed1b88e7ce9321_305_0.png)


    # 第7章 放空：獲利捷徑


    305'
