  md: '你應該知道的最後一件事是，頭肩底也可以是一般市場或某一類股的指標。容我說明一下。雖然一、兩個獨立型態對市場並無意義，但在同一時期數個此種型態同時形成便具有意義。例如，在一九七四年初與一九八二年中便有很多這樣的型態。這是整體市場的一項多頭訊號。你們之中記得市場歷史的人就知道，上述兩個時間點正是主要多頭市場開始的時間。同理，某個類股中如有數個這樣的型態，這對該類股便是一項多頭指標。這可由一九八六年的一个絕佳範例看得出來。幾個石油相關股票——石油、鑽探與石油服務股票，該類股於一九八七年成為市場大贏家之前，就已先完成了頭肩底的形態。


    # 雙重底行為


    我所要教導各位的下一個型態，雖然不具有像頭肩底那般強大的動力，但它也是非常有利可圖的一種形態。當它配合巨大的成交量、有利的相對強度與最小上檔壓力時，這種說法尤為正確。'
