    # 圖5-18


    為了確定你已經完全瞭解這個重要概念，讓我們再看幾個相關的範例。一九八七年初，Blocker Energy（圖5-18）於1.125處突破其第一階段底部型態時，成交量遞增。成交量不輕易超過數週前均量的二倍，實際上還超過了五倍。成交量如此巨幅擴增，顯示其中涉及大筆金錢，而這幾乎永遠暗示一個重大漲勢，Blocker
    並不例外。再一次地，要發覺這個大贏家非常容易。雖然基本面不誘人，公司出現大量虧損(註3)，但預示的技術性線索卻就在那裡。另外，該類股處於偏多狀態，上檔令人擔心的籌碼供給相當有限，該壓力已在一年半以外了。


