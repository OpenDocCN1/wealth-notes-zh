  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_330_0.png)


    # 圖7-34


    放空點則在59.875。最初停止買單應該設定在先前上漲高點65（B點）的稍上方。因此，取消前有效的停止買單將設定在65.125處。但是，如果先前高點爲64.625或64.75，你仍應將停止買單設定在65.125。這與我告訴你有關設定停止賣單的概

    念是一樣的（只是顛倒過來）。就像買方一樣，賣方也受到整數心理的影響。一大堆賣單很可能聚集在65處，而非64.875或64.75。因此，只要停止買價很接近整數關卡，請永遠把它設

    定於其上方。


