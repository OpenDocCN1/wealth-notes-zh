  md: '變得很容易。所以一旦我們確定所有市場指數皆在其三十週移動平均下方，而且處於第四階段，大多數的長期測量指標（我會在第八章詳述）也出現訊號，那麼便是開始獵取放空對象的時機了。


    # 2. 類股


    下一個步驟是鎖定明顯的潛在弱勢類股。為了達此目的，我們會在類股圖形中尋找負面型態。我們希望確定該類股已經跌破其三十週移動平均。另一個關鍵則是相對強度趨跌。最後，該類股內的若干個股皆出現技術性弱勢也很重要。


