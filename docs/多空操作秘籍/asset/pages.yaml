- pgno: 23
  md: '支撑（Support）——下跌趨勢很可能穩定下來的區域，之後可能反彈與回升（至少是暫時地）。它像是地板。但是請注意，不要變得太狂熱，就像很多技術分析師一樣，談到支撐就把它視為是一個點。它實際上是一個區域（Area）或地帶（Zone）。在圖1-6中，支撐最初是在26到26.5的地帶。第一次低點在26，第二次在26.5。第三次止跌於26.25，而第四次賣壓止步於26。


    請注意，跌破支撐區絕對底部（本例為26），對股價而言具有非常負面的含意。支撐被測試的次數愈多，測試的時間愈長，一旦支撐最後突破時，其出現的負面訊號愈重要。請同時注意，一旦主要跌勢或漲勢形成後，沿途會形成新的支撐水準。以XYZ的例子而言，新支撐形成於8到8.5的區域（參閱圖1-6）。


    壓力（Resistance）——又稱為供給（Supply），這兩個名詞可以互用。上漲股票很可能遭遇麻煩（至少是暫時地）而且發生回轉的區域。壓力區被測試的次數愈多，測試的時間愈長，一旦壓力區最後衝破時所出現的多頭訊號愈重要。在圖1-6的例子裡，壓力最初在近30的水準。在主要跌勢之後，下一個有效壓力地帶變成11.5到12。在XYZ股票突破壓力區上限之前，第一次多頭走勢失敗於12，第二次於11.5，然後在11.75。永遠記住，對股價而言，走勢衝破壓力區上限是一項極佳的多頭指標。同樣地，在主要走勢進行時，沿途會形成新'
  merge: -1
  img_proc: true
- pgno: 24
  md: '的壓力（或供給）水準。在XYZ的例子中，第一個壓力在29.5至30的地帶。後來則落在11.5到12的區域。


    # 交易區間（Trading Range）


    這是買賣雙方進行戰爭的中立地帶。當一種股票處於上升趨勢時，買方的火力明顯較賣方為強，會造成股價上漲的結果。下降趨勢則是銅板的反面，賣方的力量較買方強盛。但在交易區間裡，雙方勢均力敵，撕殺則發生在支撐地帶（本例為8到8.5）與壓力區域（本例為11.5到12）之間。請注意，在圖1-6中還有第二個交易區間（在26到30的區域）。


    # 移動平均（Moving Average、MA）


    這是一項非常重要的技術分析工具，它能協助你同時留意短期與長期走勢。實際上，移動平均是將主要趨勢平滑化，使每天的瘋狂震盪（最新的電腦程式使得買賣盤震盪更加瘋狂）不至於將你拖離市場。幾年來，我發覺三十週移動平均最適合長期投資者，而十週移動平均最適合交易員採用。三十週的移動平均不過是將本週五的收盤價和前面廿九個星期五的每週收盤價加總，再把上述值除以30所得到的結果，即是本週圖形所應描繪的點(註4)。股票交易價格若處於三十週移動平均之下，則不考慮買進，尤其是該移動平均處於下降趨勢。股票交易價格若處於三十週移


    (註4) 某股票的十週移動平均，顯然就是本週五的收盤價與前面九個星期五的收盤價之加總，再除以十。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '動平均之上，則不考慮放空，尤其是該移動平均處於上升趨勢。對於一個長期投資者而言，購買股票的最理想時機為股價向上突破壓力區，同時移至三十週移動平均之上，而且該移動平均不再處於下降趨勢。對於一個交易員而言，他可採取行動買進股票的理想時機，是當股票處於三十週移動平均之上，而且該移動平均正處在上升階段。交易員的理想進場點是等待股價在新的交易區間盤整過後，當它拉回移動平均附近，而再向上突破壓力區的時刻。


    # 向上突破（Breakout）——股票價格移動至壓力地帶上限（在XYZ圖形為12）的上方時。


    在本例中，一旦壓力地帶上限被清理乾淨，向上突破即發生在12.125處。猶如雞蛋有不同的品級，向上突破也有許多不同。永遠記牢兩項暗示：(1)股價在壓力區之下停留愈久，最後的向上突破愈具意義；(2)向上突破時，成交量擴增愈大，其所蘊涵的多頭氣勢愈盛。（不用擔心：我們在未來的幾章裡還會更詳細說明。目前只要記牢這兩項簡單的規則，即可大大增加你的利潤）。


    # 向下突破（Breakdown）——與向上突破相反，即股票價格移動到支撐區底部（在XYZ圖形的例子為26）的下方。


    在本例中，支撐區底部被貫穿時，向下突破即發生在25.875。與向上突破不同，向下突破不需伴隨大成交量即可視為有效。股票可以因為本身的重量而下跌，但是一般來說成交量還是會以某種程度放大。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '拉回（Pullback）——股票向上突破交易區間而向前邁進之後，通常至少會有一次獲利回吐的整理，將股價帶回原始向上突破點（本例為12.125）附近。這是理想的第二次加碼買進機會（尤其是拉回發生時，成交量大幅萎縮）。相反地，股價向下突破到支撐之下而繼續滑落，通常至少會有一次拉回動作逼近向下突破的水準（本例為25.875）。如果拉回發生時，伴隨著很小的成交量，這就是放空該股票的理想點。


    趨勢線（Trendline）——如果你拿一支尺連接某個圖形中的任何二個低點，便可完成一條趨勢線。但是，一條趨勢線與一條「有意義的」趨勢線之間的差異非常大！一條有意義的趨勢線至少會被碰觸三次。圖1-7（Skyline）說明了一條具有意義的趨勢線。在第五次測試該線而向下突破之前，它曾被碰觸四次。像這樣的線遭到破壞時，即應發出警報，因為這種突破代表主要趨勢的改變。向下突破一條上升趨勢線具有負面意義，而向上突破一條下降趨勢線則屬多頭（注意一旦Skyline向下突破它的上升趨勢線，接下來它便可說是崩盤了）
    。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_26_0.png)


    Source : Data Graph


