- pgno: 128
  md: '8. 錯。雖然交易員有時也可以在拉回時買進，但他們大部份應該在突破時買進。如果最初的漲勢相當不錯，交易員可以迅速獲利了結，並在拉回時，再度進場交易。


    9. 對。在該時點，不會有太多處於第一階段底部準備突破的股票。


    10. 對。永遠不要與整體市場和類股趨勢對抗。該圖形屬於American Motors，一九七四年初突破發生於10處。指標與類股皆處於負面，在不到一年的時間內，它就下跌到將近3處。


    11. 對。但是連續性的突破通常不會如此。


    12. 你應該選擇B類股。它的上升趨勢比較堅實，另外，它沒有上檔壓力。相反地，A類股有很多籌碼待清理。最後一點，A的相對強度線很可怕，B則很好。A是區域性銀行類股，在七個月之後，道瓊指數上漲600點，而它沒有變化。B為石油類股，它是一九八七年頭七個月的最大贏家之一。'
