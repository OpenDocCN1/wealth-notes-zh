- pgno: 238
  md: '你遇到一個不願意合作的經紀人，那就另外找一位新的經紀人吧！


    在股票經紀人這個課題上，我要強調的是你一定要確定自己並沒有支付全額佣金！非常明顯地，你可以從一些提供折扣的經紀人處節省大筆佣金費用，而且目前也有很多極佳的經紀人，會提供一定的佣金折扣。有一點比較不明顯而且是多數投資人所不瞭解的是，有一些提供全套服務的經紀人（full-service
    broker），可以提供相當大的折扣。你所需要做的僅只是詢問一下，做一些詢價與議價的工作。再者，因為你是進出頻繁的帳戶，因此想商議出一個好的折扣應該不會有什麼問題。不要低估這些節省下來的錢，因為經年累月下來這將對你很重要。只要你能取得優渥的佣金費率，不論你是與提供折扣或全套服務的經紀人（或兩者）來往都可以。


    適當採用保護性停止賣單，是你的賣出策略的中心部份。你必須使決策過程儘量保持單純、客觀與冷靜。你並沒有必要不斷思考是否該獲利了結或停損出場。賣出過程的簡化在市場波動加劇時尤為重要。你絕不希望只是因為道瓊指數在當天下跌60或70點，而你的股票只是在電腦程式賣壓的交叉火力下大幅下挫，就輕易地突然賣出處於第二階段的極佳股票。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '絕大多數的市場專業人士都會採用保護性停止賣單，而一般大眾則不會這麼做。理由很單純。一般的市場玩家很少有人真正了解該如何適當使用停止賣單。這是個極為有用的獲利工具，但卻背負了它所不該擁有的惡名。這是因為有很多投資人只聞其名，卻以下列非常荒唐的方式去使用它。這些人或許曾經因閱讀而抱有一種觀念，停止賣單應該設定在目前交易價格下方10到12或15%處以保護他們的部位。這是個很糟糕的意見，因為往往會導致更糟的結果。這裡並不存在所謂正確百分率這樣的一個魔術數字。你不可能因為遵循這種膚淺的想法，而能夠在市場上一直賺錢。為什麼10%或其他任何特定的百分率會是正確的數字呢？市場會知道或關心你所支付的價格嗎？


    圖6-20顯現了我/Index要表達的意思。U S X Corporation在一九八六年突破22.375（A點）。如果你隨意以10%的幅度將停止賣單設定在20.125處來保護它，你就會在股票拉回到19.625（B點）時賣出該股。不幸的是，這恰是該股正要起飛呈現倍數成長的起點。當該股漲到33.25（C點）之後，如果'
