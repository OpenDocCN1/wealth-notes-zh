    # A 解答


    1. 適當的選擇是B股票，Republic Airlines。它具有三重致勝型態，突破時成交量增加三倍，突破時股價已經上漲超過50%，相對強度越過零線之上。為確認起見，成交量在接下來數個月之內進一步擴增，在一九八六年初，Republic被西北航空以17的價位收購，此乃可觀之獲利。至於A股票（MacGregor
    Sporting Goods），相對強度不是很好；更重要者，成交量不到前四週均量的兩倍。最終結果是它上漲了幾點到15.5處，然後就在一九八七年中崩跌到8。最後是C股票（Inter-City
    Gas），突破時成交量很差，所以它不應考慮。它在12.25處突破，八個月之後，勉強抵達15處。


    2. 在本例中，你應該買進C股票（Ex-Cell-O）。成交量大幅擴增，相對強度穩健。它應該在突破55時買進。數週之後，它以'
  merge: -1
  img_proc: true
- pgno: 214
  md: '77.5的價位被Textron併購。A股票（Van Dorn）成交量還算可以，相對強度平平。該股於32處向上突破，八個月之後小幅揚升到40。最後，B股票（Lamson
    & Sessions）具有可怕的相對強度，更糟糕的是成交量。它是三者之中最差者，表現結果也是如此。它在突破10.25處時曾經稍為揚升，但一年半之後就跌到4。


    3. A股票（Crown Crafts）與B股票（International Proteins）皆為極佳的買進對象。Crown Crafts是三重贏家，因為它在突破之前已經上漲將近100％，突破時成交量巨幅擴增，R
    S線也進入正值區。該股突破於9處，十八個月後漲到87.5。International Proteins也是三棲贏家，因為在突破之前已經上漲超過50％，突破時成交量遞增，而R
    S線也翻轉為正值。在隨後不到兩年的時間，該股上漲到20.75處，並不令人意外。至於C股票（CCS Industry），成交量尚可而已。雖然它超過二倍的均量，但成交量在突破時卻小於底部型態中數週的成交量。它突破於10.125，六個月之後，它只上漲到12。


    4. 對。三者皆為極佳的買進對象。A股票（G T I）為一個三棲贏家，它突破於3.5處。四個月後，它漲到10。B股票（Sperry Corporation）也是三棲贏家。該股呈現令人印象深刻的巨額成交量。它應該在升越57時予以買進。僅在四週之後，它就以76.5的價位被Burroughs
    Corporation併購。最後，Harcourt Brace（C股票）穿越40時是極佳的買進對象，因其成交量遞增，相對強度處於正值，而且在40之上無上檔進一步籌碼供給。所有這些正面因素都在遽漲中獲得報酬，該股在數週之內幾乎升抵60。'
