- pgno: 27
  md: '非常重要而且該理解的一點是，趨勢線的斜率愈大，其向下突破的意義愈小。如果你看到一條非常陡峭的上升趨勢線（圖1-8），該趨勢線的向下突破可能僅意味著該股票（或一個市場平均指數）目前將以較緩慢的速率向上移動——只是因為它無法維持先前的速率。若一條趨勢線愈接近水平，當它遭到向下突破時（圖1-9），其所蘊涵的負面意義愈大。相反地，一條下降趨勢線的下降角度愈陡峭（圖1-10），當它被克服時，其多頭意義也愈淡。它可能意味（尤其是股價處於長期移動平均之下方）的是該股票將以較緩的下降速率下跌。但是，一條趨勢線愈接近水平，當它遭到向上突破（圖1-11），其多頭意義也愈大。最好的多頭訊號是當一條重要趨勢線被向上突破，同時在數天之內，上揚的長期移動平均也被克服。相反地，最具負面含義的是當一條重要的趨勢線被向下突破，同時在數天之內，下降的長期移動平均也遭到破壞。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_27_0.png)


