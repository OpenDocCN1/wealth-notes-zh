- pgno: 89
  md: '# · 採用停止買單


    從現在開始，只要你想在突破時買進個股，請使用停止買單（buy-stop order）。你們之中或許有部份人已經知道那是什麼，但不曾使用它；少數有經驗的玩家懂得如何利用它，但你們當中大部份的人不僅沒有使用過，甚至連那是什麼都不知道。現在，一切即將改變。學習如何適當使用這項專業技巧，會是你即將精通獲利性投資的另一秘訣。從現在開始，你將時常利用此單。


    運用停止買單的做法是告訴你的專員，你想買進X Y Z股票。但是——而且這是非常重要的但是——唯有當該股向上突破某一水準時。以我們理想的循環圖（圖1-6）為例，唯有當該股呈現足夠的力量上漲到壓力區12的上方時，我們才想要買進。那麼，就投入一張1,000股X
    Y Z於12.125的停止買單，如果X Y Z未能突破到12的上方，該股就不會被買進。如果該股真的上揚到12的關鍵水準之上，它就會立即變為市場買單，買進1,000股的X
    Y Z。你沒有必要盯著股票看。你甚至可能不知道你的單子何時會被執行。但請注意，它不一定會成交於12.125。該股有可能會以12.125或12.25或甚至12.375的價格被買進；但是在絕大部份的情形下，它會非常接近你的理想價格。如果該股屬於上櫃股票，你將不被准許使用停止買單或停損賣單。在此情況下，你就必須與經紀人打打交道，讓他將你的上櫃股票輸入電腦，然後等到它一旦突破壓力區，即為你買進。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '使用停止買單對你的市場新策略是很重要的，但在結束本主題之前，還有一些細節必須學習。在市場或生活中，永遠沒有任何一件事是只有好處沒有缺點的。本技巧雖具獲利性，但有些潛在危機你仍必須瞭解。這類委託所牽涉到的一個問題是，你有可能會得到執行得很差的結果。雖然這有可能只是五十次中發生一次，但壞事總是一次就嫌太多。


    此處要討論的是，如何確定這種事情不會發生在你身上。假設X Y Z股昨晚收盤於11.625處。你研讀圖形之後，判定它即將突破上檔12的壓力。第二天早晨股市開盤前，你打電話給經紀人下1,000股X
    Y Z於12.125的停止買單。不幸的是，就在市場開盤前，該股公布利多消息，開盤跳出的價格為15。如此一來你就無法以12.125的極佳價格介入，反而會以15的價格成為X
    Y Z的持有人。雖然上述買盤終將完成，但它並不是你想要介入之處。另外，報酬／風險率現在遠較其於12.125時不利。由於有這種潛在的負面效果，因此無論交易員和投資人都希望設法迴避此問題。他們會使用一種只以特定價格成交、也就是所謂的限價停止買單（buy-stop
    limit）。這意味你的買單只能以你的理想價格（此處為12.125）買進，而非任何其他價格。不過，我發覺這類委託單更具負面意義，因為它所造成的問題多於其所能解決者。這種問題不是每五十次只有一次，而更有可能每四次中有一一次。當股票突破時，你根本沒有機會買進，因為它會快速穿越12.125，從而使你的單子永遠無法被撮合。'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# ・ 在限價內買進


    答案究竟是什麼呢？其實還有另一種類似的限價停止買單，只是很少有市場玩家知道它。它綜合了最佳的停止概念，可設置你所能支付的價格上限。當股價穿越12時，如果想買進，我們可於12.125處採用停止買單，同時在突破點上方0.25點處設限——以本例來說就是12.375。因此我們投單的內容為：買進1,000股XYZ於12.125停止——12.375上限（12.125
    stop - 12.375 limit）。那麼你買進該股便不會有任何問題，除非該股成交量很低（在此情況下，你可將上限放寬到突破點上方半點，則該訂單為：買進1000股XYZ於12.125停止——12.625上限）。這一次，你總算可以放鬆心情了，因為你不用再擔心最後必須支付嚇人的價格。


    另一個潛在問題是當你在週一與週二遞單，該股卻沒有立即突破。然後，週三你因為很忙而忘了下單。賓果。墨菲定律——所有會出錯的事一定會發生。該股果然出現了突破。你的單子不在場內而股票也就此棄你而去。每個市場老手都有過這種經驗。古老的市場名言說，市場會照你預期的方向而行，但不會照你預期發生的時間而行。這絕對是千真萬確的。在市場上打滾幾年之後，我已經成為奧圖定律（O’Tolle’s
    Law）的堅實信徒，它說：「墨菲是個樂觀主義者！」所以只要能解決市場中潛在問題的任何工具，都是有價值的！這就是何以以下一個技巧如此美妙。它很簡單，卻非常有效。'
  merge: -1
  img_proc: true
- pgno: 92
  md: '當你做研究時發覺了二或三種你想進場的潛在型態——如果它們屬於突破的形態——請依下述方式進行：以取消前有效（good-‘til-canceled，GTC）為基礎，對所有三種股票投遞停止買單。這意味你在你的專員處有預備買單，直到你取消這些買單或被實際執行為止。若採用這種做法，要小心做好紀錄。如果你忘記了這些買單，可是要承擔責任的。如果不小心的話，你可能會在二、三週之後，驚訝地發覺自己買進了2000股的Widget
    Technology。這種買單是長這樣的：買進1000股XYZ於12.125停止——12.375上限——取消前有效（12.125 stop- 12.375
    limit - GTC）。


    採用取消前有效的停止委託單，會讓你養成許多好習慣。首先，你無需整天緊盯市場，而可以更集中精力於工作。第二點，你可以做出比較正確而不情緒化的決策，因為當天市場的瘋狂行為將與你無關。在荒唐、新穎與浮誇的電腦程式買賣下，道瓊指數常常會在一小時之內上下波動十到五十點，這使得上述方法尤為重要。或者，突如其來的力量會誘使你搶購某些東西，因為市場似乎突然要捨棄你而上揚。千萬不要受到誘惑影響進行操作。學習如何以有紀律且輕鬆的方式適當地買進股票，是一個關鍵。採用我的階段分析法，並與取消前有效之停止委託單配合，一切將自動化進行，而這也是我們想要達成的。系統愈機械化，愈不受制於判斷與情緒，就會變得更具獲利能力。這幾年來，這個概念對我而言變得十分明顯。非常有趣的是，這個微妙而重要的事被我華爾街專業好友的支持所強'
  merge: -1
  img_proc: true
- pgno: 93
  md: '化。他們學習到相同的教訓，但通常是以艱辛的方式得之。


    為什麼應該如此？簡單！因為我們都是人，充滿恐懼與貪婪這類似孿生惡魔的情緒。恐懼造成恐慌，使你在底部做賣出動作，貪婪驅使你在頭部附近做出買進動作。這就是群眾猶如迴力球、心態搖擺不定背後的驅動因素。為了避免染上恐懼貪婪症候群，請於每個週末騰出一些時間冷靜地瀏覽圖形。你實際上只需要一小時的時間便可完成工作，但你花費的時間顯然愈多愈好。首先，將你從圖形中所發覺的少數傑出潛力股編製成明細表。然後，每晚追蹤與描繪這幾支股票以及你投資組合中的個股。簡易的運作將可幫助你發展出非常敏銳的市場感。另外，如果你遵循此有利可圖的遊戲計劃，你將會感到輕鬆而有信心，不必再承擔過重的壓力與市場的洗盤。


    # 應該熟悉的買進與賣出型態


    在討論該買進什麼的詳細內容之前，你應該知道，還有一些市場型態會以令人無法相信的規律發生。它們將加強你的優勢，讓你可判斷何時應該更具攻擊性。明瞭這些重覆的型態對交易員尤其重要。如果能夠理解這些趨勢，即使是投資人也能提高平均成功率。雖然有很多類似我們的技術分析人士涉足此領域，但就我所知，卻沒有一人能夠像Arthur
    Merrill與Yale Hirsch一樣做出深入的研究。Merrill 的著作《華爾街之價格行為》（Behavior of Prices on Wall
    Street，Analysis'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Press，1984）以及Hirsch的著作《不可於週一賣出股票》（Don''t Sell Stocks on Monday，Facts on File
    Publications，1986）是與本論題相關的佳作。在作者的允許下，我在未來幾頁之內，將大量借用他們的資料，務必使你瞭解這些重覆發生的重要型態。


    你所應該知道的第一種週期循環是最重要的一種。不論交易員或投資人都應該熟悉它——那就是為期四年的總統選舉循環。很多投資人都錯誤地認為最好等到選舉之後再買進。他們認為華爾街偏愛共和黨黨員，因為他們是以商業為導向的政府。如果民主黨黨員當選，股市將會下跌。這是錯誤的，其原因有二。首先，道瓊工業股價指數於本世紀內，在民主黨總統任內的漲點實際上是多於共和黨總統任內的漲點。雖然其<|message|>上漲原因係源於民主黨任內較高的通貨膨脹。其次更重要的事實是，不論誰當選，在大選後的一年內通常都是大災難。這種空頭市場發生的頻率就像總統候選人親吻小孩一樣平常。因此，選後第一年如一九六九、一九七三、一九七七和一九八一為空頭市場就不足為奇了。（當然也有例外——一九八五年就是個多頭年）。從歷史來看，機率顯示在第二年空頭市場會持續到年中，直到底部形成為止（猶如一九八二年八月所發生者）。第二年剩下的月份則是多頭，然後總統任期的第三年將是整個週期循環中表現最佳者（一九八七年直到八月之前亦無例外）。到了第四年，即選舉年，股市較善變，通常上半年呈現弱勢而下半年呈現強勢。'
  merge: -1
  img_proc: true
- pgno: 95
  md: '在過去一百年來，此四年的週期循環一直以令人無法置信的規律出現，看起來簡直就像是政治劇作家的腳本。畢竟任何總統都想連任，所以在選舉前兩年刺激經濟是相當合理的事。相反地，他們通常會在當選之後立刻處理一些負面的棘手問題。如此一來，在他們再度出馬競選前，才能有充裕的時間讓經濟強大起來。所以，你雖然應該隨時密切觀察市場指標，但在選舉後的期間更是尤其重要。


    另一種歷史模式是，在典型的一年中每個月的市場行為。根據Merrill的資料顯示，在過去八十多年來，十二月份是股市表現最佳的月份。他的結論係根據道瓊工業股價指數在每一月份是否上漲來進行判斷。十二月份是贏家。其漲幅為68%。'
  merge: -1
  img_proc: true
