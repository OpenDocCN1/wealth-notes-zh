  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_134_0.png)


    # 圖4-3


    現在參閱圖4-4，一九八七年同屬多頭航空類股的Pan Am Corporation（PM），雖然它突破了底部型態，並翻越其趨勢線與移動平均，它仍不應與Allegis同等視之。它在6.5附近有壓力，該處是其一九八六年底上升走勢潰敗之處。更糟者，在7附近有大量供給籌碼，該處是PM在一九八六年初向下突破而隨後被壓擠壓到4的地方。最後，當你審視長期展望時會發現，它明白顯示就在8的上方有非常重大的壓力（在一九八三年與一九八六年之間，每隔四年便在8之上做頭部）。如果Allegis是甲上，那我給予PM的評分就是丙下(註3)。記住，如果你非對該股採取動作不可，PM還是較佳的買進而非賣出對


