    Glass Container（圖5-2）於一九八七年中接近28處，那麼也請忘了它吧(註1)。我寧可在任何時候錯失一個潛在的獲利機會，也不願買進一支報酬／風險比率差勁的股票。當錯失一個贏家時，你所有的損失也只不過


