- pgno: 394
  md: '蹤這些數據時，發覺它們雖然有用，但波動得相當厲害。對於真正的主要訊號，我還是比較偏愛從金融刊物中汲取。那些報章雜誌的新聞標題主筆者並不是存心想要成為一項指標，但他们卻正是如此啊！因為他們想推銷報紙，因此他們就一心想想到適當的神經。如果他們感受到一般大衆正處於戰戰兢兢的狀態，恐懼便是他們報導的重點；而在多頭期間，我們就可以看到樂觀的報導像洪流般地湧現。


    一個新聞標題或雜誌的封面報導，便足以觸發你「這一定是錯了」之反應。然後，當我們的其他指標認同時，你就知道市場即將出現真正重要的走勢。封面故事症候群的絕佳案例發生在一九七四年底。這是一九二九年以來最嚴重的空頭市場，一家主要金融雜誌採用一隻巨大恐怖的黑熊圖片做為封面。為了強調，他們讓黑熊推倒華爾街的樑柱。因為我的長期指標中有很多個指標在此時紛紛轉正，因此這便是捨棄華爾街恐懼症而開始買進的時機了。


    另外一個典型的相反意見訊號出現在一九七八年夏天。一家主要商業雜誌刊登其封面報導，標題為「股票之死」。並不令人訝異的是，市場隨後展開了一段主要漲勢，幾乎持續三年。比較難以相信但確實買賣的是，同一本雜誌在五年後又刊出一段相同主題的新故事。這次封面的圖案是一隻勇猛的公牛，其標題則為「股票之再生」。非常有趣的是，這件事發生在一九八三年春季即將結束時。在幾個禮拜後的六月份，投機'
  merge: -1
  img_proc: true
- pgno: 395
  md: '股創下主要高點之後便崩跌了。績優股勉強捍扎多攀高了幾個月，隨後便在一九八四年一月十七日的小型空頭市場中遭到痛擊。我無意挑出某家特定的雜誌或報紙，因爲媒體只是代表當時的心理狀況而已。必須瞭解的是，刊物上時常會出現這種報導。你應該學習如何適當地利用它，而不要讓它誤導你。


    若出現許多類似的新聞標題，其效果更勝於一個新聞標題，因爲它們其實是在相互強化同一種心理。圖8-25的集錦圖片刊載於一九七四年底的《專業軌跡解讀》，看過之後你就會更加瞭解我的看法。在一九七三年到一九七四年慘遭空頭痛擊後，就開始出現大規模解雇、盈餘大幅衰退及可能出現世界性經濟蕭條等等新聞標題。我們都知道，市場都是在利多充斥之下做頭，而在利空籠罩之下觸底。但有太多投資人卻忘記了這項眞理，而與新聞同步進退。嚇人的新聞標題與報導，將使意見更趨一致，而使人們更相信市場將進一步崩跌。這就是一個重要底部形成的時機。在這些新聞標題出現後的幾個禮拜，市場結束了經濟大蕭條以來最嚴重的崩跌，這個現象並非巧合。'
  merge: -1
  img_proc: true
