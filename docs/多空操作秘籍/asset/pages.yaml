- pgno: 223
  md: '# 4. 不可只因為本益比太高而賣出股票。


    上述範例的反面也是一項嚴重問題。有個古老的華爾街笑話說，一位投資人問他的經紀人，為什麼某支股票上漲。由於缺少比較好的理由，於是該經紀人應付說：「買的人比賣者多」。這個笑話背後所涵蓋的訊息與事實多於虛構，只是很少投資人能夠明白。他們總希望得到某支股票價位變動的理性答案。但他們真正得到的卻是藉口或推論之見解。很少市場參與者能夠明白市場並不是永遠理性的。它所反應的僅是目前市場上彌漫的投資人心理或心境。如果投資人極度看多而沈溺於樂觀的美夢，則高本益比也可以變得更高。Tandem
    Computers（TDM，圖6-8）清晰地說明了此一論點。在一九八五年


    ![](img/63c92c8be10593e716ed1b88e7ce9321_223_0.png)


    圖6-8'
  merge: -1
  img_proc: true
- pgno: 224
  md: '底，當TDM穿越10之壓力時（A點），本益比為32倍並不便宜。十五個月之後，股價接近38水準時，本益比變得更高而成為44倍。


    投資人猶如狂熱的受壓抑者：當他們變得樂觀時，不論本益有多高，他們都可以找到藉口買進股票。另一方面，他們變得憂慮而偏空時，不論本益比多低，他們都不會買股票。因此訣竅便是接受下列事實，即股票處於第二階段時，高本益比可以變得更高，此時要抑制你的賣出動作，直到它們雙眼翻白而第三階段開始形成之時。這比高本益比來得重要得多，因為它客觀地顯示並推動你的賣壓。造成股票形成頭部的原因並不是模糊的超值（overvalued）概念，而是可以衡量的供需均衡。


    圖6-9的Maxtor（MXTR）再次說明了一切。當MXTR在一九八六年初穿越8之壓力時，雖然本益比16倍並不便宜，但該股仍是處於第二階段的堅實買進對象。然後到了A點時，本益比更高到28倍。隨後在B點變成了24倍，以基本面而言，它仍然很危險。在C點時為20倍，仍屬偏高。但是因為移動平均仍然上升，因此我們的階段分析方法強烈要求忽視高本益比之危險訊號而繼續持有。數月之後，該股揚升到34處，本益比則到達33倍的極高水準（D點）。其後在E點，本益比仍處於令人擔心的28倍。如果你你的賣出決策是依據本益比做判斷，你可能在16的價位（A點）就賣出了。但MXTR一直沒有出現真正的賣出訊號，直到F點處才向下突破重要的頭部型'
  merge: -1
