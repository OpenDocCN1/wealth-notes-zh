  md: '9.B. B股票是Pepsico，在一九七三年，它是理想的放空對象。在幾個月拖泥帶水的走勢之後，在向下突破時，其相對強度落入負值區。另外，移動平均朝下推進。最後，頭部的形成超過一年，而「頭部愈寬廣，跌幅愈大」。在本例中，Pepsico一路崩跌至29.25，才反轉向上。
