  md: 從投資觀點而言（我們將在稍後章節中談交易），買進股票的正確時機是在最初突破處，或在其後拉回整理接近突破之處（以圖1-6的X Y Z來說，就是12.125的位置附近）。此時股價仍接近底部，下檔風險相當低，上漲潛能則相當可觀。此時的報酬／風險比率十分有利於你。另外，在接近第二階段的末期時，價格波動將愈來愈古怪，因為早先進場的買方不願意喪失絕佳的獲利，會開始出現恐慌性賣壓，而新進者也想為剛發現的熱門股找一個好價格，因此會針對每一次的賣壓進場承接。此時，該股常會成為謠言與媒體熱烈報導的對象，同時情緒對買賣雙方的決策將產生巨大影響。我要不斷強調，我曾看過某些投資組合內充斥套牢股，只因為這些股票的進場時點實在太差勁。請自制！如果你是一個長期投資人，就要告訴自己只在第二階段初期才買進（以X
    Y Z來說，就是接近12.125處）。如果你錯過了買進時機，也不要慌張地去追價，因而付出代價。你必須始終一貫地正確買進，要不然就乾脆不要買。很明顯地，這只是一般普遍的常識。如果你
    наличием12.125處錯失機會，在12.875處買進或許沒什麼關係，但若是要付出25或26，那就有關係了！如果你錯失一支好股票，也不 Euler.
    市場中有數千種上市與上櫃的股票可供挑選，永遠都會有價格很好的好股票。這就像是招計程車一樣，就算是錯失了第一輛，另外一輛也很快就會來了。
