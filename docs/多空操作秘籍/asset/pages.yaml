  md: '這項工作還有最後一個步驟——觀察圖形中的長期展望圖。Mansfield圖形公司會在圖形左下角提供過去十年的高低價長條圖。如果圖形中沒有壓力（在過去十年，它不曾交易於此價格之上），那麼你真的應該興奮，因為你觀察到的是一个絕佳的情況。


    這裡有一些實際的範例，可以用來強化此理論。參閱圖4-3。當Allegis Corporation（A E G）於一九八七年向上突破其一年來的交易區間頂部時，圖形中便已不再有壓力。然後在審視長期展望之後，綠燈著實開始閃爍。在過去十年來，這個水準之上沒有壓力（參閱左下角長期展望圖之箭頭）。後來A
    E G快速飆升30點，也就不令人驚訝了，因為買盤完全沒有遭遇抵抗。只要一支股票突破進入處女地（以前不曾在此成交），這就是你所能夠買進者之中最為偏多的情況。想想看。在那裡，沒有任何做多的人會虧損。沒有人想打平就好或有賺就好。所以買方的力量可以對價格產生真正的爆炸效果(註2)。


    (註2) 圖中其他兩個多頭要素也出現：成交量巨幅擴增以及相對強度線大幅改善。'
