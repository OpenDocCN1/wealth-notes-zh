    # 圖7-38


    # ·下跌趨勢線


    交易員必須納入其獲利方法的最後一項技巧，就是在放空時運用趨勢線。我在第六章曾教導各位如何運用上漲趨勢線，相同的概念也適用於放空——只是要予以顛倒。


    如果沒有有效的趨勢線形成（該線至少要被觸及三點），那就只好採用停止買進的技巧。當一條明確的趨勢線形成時，利用它當然會有所收穫。一條趨勢線遭到破壞時，至少部份空頭部位應予回補。剩餘部位則以停止買單保護，而這個停止買點通常會位於趨勢線的上方。'
  merge: -1
  img_proc: true
- pgno: 338
  md: 圖7-39說明如何將趨勢線納入你的空頭市場遊戲計劃中。最初，停止買點應設於53.125（A點）。49.875的6%為52.875，因此把停止買點設在整數上方——53.125。當股票開始步入第四階段後，停止買點應陸續予以調降，首先是在C點，然後到D點。漲升峰值B、C與D形成一條有效的下降趨勢線後，策略就必須改變了。這你應該瞭解才對，因此請將它納入你的策略之中。在接下來數週，當X
    Y Z出現自由落體走勢時，你應該調降停止買單到E、F、G等，至少一半的部位應採用趨勢線做出出場指標。因為趨勢線大幅下降，即使股票出現橫向走勢，如同它在K點以後的走勢，你仍可将一半的部位不斷調降停止買點。最後，一半的部位由設定在H上方的停止買單保護，而另一半則緊密地設定在J點。接著橫向走勢終於使股價穿越趨勢線，觸發設定在J點的停止買單，讓我們得到了一筆絕佳的利潤。雖然貫穿趨勢線並不意味將大幅反轉，但它很可能會形成中性的交易區間，因此這是交易員至少部份獲利了結的好時機。當真正的力量出現，第二個停止買點（H點）遭觸及，便可鎖定另一筆豐厚的獲利，於是該部位就成為歷史了。
