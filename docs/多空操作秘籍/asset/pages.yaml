  md: 'Dravo向上突破20（A點）時，創下了多年來的新高點。不幸的是，接下來你無甚進展，而當它向下突破位於18的主要支撐後，你只能停損出場。在同一時間，Tandem
    Computers很快地由我們的建議價格19.875處（A點）成長近倍。Texas Instruments也呈現極佳的績效，雖然它耗費了較長的時間才從我們的建議價格41.875成長近倍。


    如果你將所有資金都投入Dravo，則一九八七年初的市場強勁漲勢對你將是一場失望。如果你將資金分散在這三個持股中，則你將可含笑退場。


    很多參加我的講習會的人問，「我的投資組合內應有多少種股票才屬正確？」它應是八、十或十二呢？答案？並沒有一個單一的魔術數字！但有一個大致的範圍是我認爲有道理的。我知道一或兩支股票的資產分配方式太過危險。我也知道四十到五十支股票數量太多，而且難以追蹤。對你的投資組合保持適當的警戒態度，與扮演父母的角色很類似。你所負責的小孩愈多，便愈難照顧週全。股票也一樣。如果你將你的資產分配到五十支股票，你很難感受每支股票的表現。另外，你應該保持一種態度，集中注意力於表現良好的股票，然後把那些你認爲隨後才會展現活力的落後型股票暫時擱置一旁。這就是你讓好股票支援壞股票所產生的結果。


    照顧你的股票的適當方法是，假裝每一個部位皆是你唯一持有的部位。如果它表現不錯，很好，就這麼做。但如果它嚴'
  merge: -1
  img_proc: true
- pgno: 182
  md: '重落後而且表現差勁，即使停損點未被觸發也應該減輕部位。將資金移入較具前瞻性的一支第二階段新股票。更明確的說，對投資金額較少（10,000美元到25,000美元）的小型投資組合來說，我分散的對象不會超過五或六支股票。如果你更上層樓，進入六位數字或更大的投資組合，我在任何一段時間所投資的股票種類最多為十到二十支。


    在設計你的投資組合時，可採用大致等量的金額來作為依據。不可以像很多投資人一樣，他們以其所能購買的股票數量來思考。他們每樣皆買進1,000股，不論它是5美元或40美元的股票都一樣。你可以使用一個整數，假設我們以100,000美元投資於十支股票，每一部位應大致為10,000美元的價値。如果你買進每股50美元的股票，你只能買200股。如果第二個部位是每股10美元的股票，你將可遞出1,000股的買單。在設計投資組合時，你應利用一般常識，不可將所有的雞蛋放在一個籃子裡，但也不要走到另一個極端，使用太多的籃子。


    這裡還有另一種分散的形式，是您應該知道與執行的。不可從某單一類股中挑選所有的買進對象。如果有三或四個產業呈現良好的技術行為，則可由所有這些產業中挑選出第二階段突破者買進，而不可僅選擇某單一類股。如果某類股突然反轉，則你的投資組合仍可保持良好表現。


    如果你能執行以上這兩種形式的分散，並且恰當地利用我的系統，你在市場中應該就能經年累月保持良好的表現。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 第 5 章


    # 挖掘潜力股


    你曾否夢想今天買進股票，第二天一覺醒來欣聞該公司已被高價併購？我將在本章向你展示，如何使你的夢想偶然能夠成真。另外，你將學習我所發展而罕為人知的技術方法，它能產生猶如併購案般的驚人獲利。


    首先，讓我們檢驗一下併購夢想。對大多數投資人而言，它常導致財務上的夢魘。我看過很多投資人每逢謠言便買進，終至無一成真。他們在等待那永遠不會成真的宣佈時，虧損可能早已累積得嚇人。為什麼會有那麼多投資人追逐雨後彩虹？這是很簡單的心理。第一是貪婪。我們都希望一夜致富，所以我們夢想這一次大船可能會進港。第二，心理學有一個理論稱間歇性強化。就是說如果一隻動物偶然得到其想要者，即使是很罕見的情況，它還是會讓自己不斷回來要求更多。事實層次顯示，如果一隻老鼠在經過迷宮時，僅有一次得到一塊乳酪，這便會驅使它不斷遊走迷宮，即使乳酪已經不再放置在該處。人類與動物並沒有什麼不同。有什麼理由會讓我們在拉斯維加斯玩吃角子老虎，或想贏得彩券？只要賭場裡有一個人中大彩，或新聞標題出現贏家的一則報導，我們就會開始夢想。'
  merge: -1
  img_proc: true
- pgno: 184
  md: '如果你能控制這渺茫的症候群，在吃角子老虎機器投入少許銅板，或偶而買張彩券，這種人性的特徵並沒什麼了不得。但是如果它驅使你不斷買進充斥謠言的股票，那就算了非常嚴重的問題。它會讓你付出慘痛代價，因為往往有數以百計的股票最後以第四階段的下降趨勢結束，偶爾才會有一則謠言真的成真。這可不是什麼好的勝算。


    愈多這樣的股票被囤囤吞，收購狂熱者就愈普遍。這場遊戲是否有聰明的玩法呢？有的，再一次地，紀律這個答案就存在於圖形中。你只需遵循下列事項。第一，只以少數的資金投入這場遊戲。你其他絕大部份的資金，還是應該根據你的研究來操作。第二，如果你聽到謠言，就針對來源做判斷。如果它來自於你的經紀人，而過去他的部份建議曾經實現，該項來源便優於一輩子也不曾正中目標的經紀人。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_184_0.png)


    圖5-1'
