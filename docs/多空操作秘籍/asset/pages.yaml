  md: '現盤整，接著又突破壓力地帶的上限之時（圖3-3的A點）。這稱之爲連續買進。同樣地，這裡又再度涉及交換條件(註4)。這種型態的買進較適合交易員而非投資人。但是當整體市場非常強勁，市場上已沒有很多突破初期的機會時，投資人有時也會願意在第二階段走了一段之後再做一些買進。在主要的多頭市場初期，投資人絕對沒有必要連續買進，因爲有很多股票都才剛初次突破其底部(註5)。另一方面，在多頭市場末期——例如在一九八六到一九八七年期間——第二階段初期的買進機會很少，但仍有很多連續買進的機會。在這時期，即使是投資人也應該做一些連續買進。


