- pgno: 54
  md: '在第三階段時，必須非常小心地控制你的情緒，因爲一些與個股有關的故事通常會令人興奮，而且種種新聞往往很熱烈（盈餘佳及股票分割等）。請永遠相信圖形，因爲圖形與你我不同——它不會情緒化。透過接受遵從圖形所顯示市場訊息的一貫訓練，我們也可以學會冷靜、沈著與計劃，而其他人則始終會被貪婪／恐懼併發症所操縱。所以請牢記——不論基本面如何強而有力，不論某個故事多麼具有說服力，你永遠都不可以再這個階段買進股票，因爲報酬／風險比率將不利於你。


    # 第四階段：下降階段


    在本階段，維持股價於頭部階段的因素終於屈服於賣方疲憊與恐懼的壓力。在圖形中，它以下述方式呈現：股票遊走於中性的交易區間後，終於向下突破其支撐地帶的底部。我們的X
    Y Z 圖形（圖1-6）顯示支撐地帶爲26至26.5，壓力約在30，而移動平均幾乎爲水平。不同於向上突破時成交量必須明顯擴增才能視爲足以信賴，第四階段的向下突破並不需要巨量即可視爲有效。成交量增加的向下突破，伴隨著繼之而來的成交量萎縮並且拉回到向下突破點，是非常危險的訊號；我曾看過很多例證，股票僅以相當少的成交量進入第四階段，但在未來幾個月內，股價仍大幅挫跌。因此，成交量增加的向下突'
