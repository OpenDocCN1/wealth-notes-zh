- pgno: 263
  md: '票呈橫向走勢中，設定在F點的停止賣單終於被觸及。即使它不預示巨幅下跌，但也很有可能形成交易區間。對交易員而言，這是一項壞消息，所以最好鎖定一半部位的獲利。當真正的弱勢出現後，位於C點的第二個停止賣點也遭觸及，於是另一筆豐厚利潤便可以落袋了結。


    圖6-31的Computer Sciences（C S C）與圖6-32的Tultex（T T X）說明了採用趨勢線的優點。當C S C突破其下降趨勢線並穿越位於38之壓力時，應該買進。最初的停止賣點應該設定在整數36之下方(註4)。然後在漲到40之後，又拉回到37.375，隨後停止賣點應提升到36.875。截至此點為止，並沒有偏離我們告訴交易員停止賣單設定的方法。但是現在事情開始變化。你可以連接四個點（1、2、3與4）而在圖6-31上畫出一條斜率向上的趨勢線。該線應伸延到未來。很顯然地，ComputerSciences在接下來數週緊沿著趨勢線攀高。現在我們確知手中掌握一條意義重大的趨勢線。因此，至少一半部位的停止賣點應持續調高到該上升趨勢線的下方，惟需維持在心理整數的下側。如果你希望展現出侵略性，則可以採用單一停止賣單，並且設定在上升趨勢線的下方。如果寧可保守一點，你可以讓一半部位的停止賣點緊逼在持續上升趨勢線的下方。而另一半部位之停止賣點，則設定在最近整理低點之下方。


    (註4) 38.125的5%約為2點，這將使得停止賣出價位成為36.25。在此將它設定在重要心理水準36的下方。'
