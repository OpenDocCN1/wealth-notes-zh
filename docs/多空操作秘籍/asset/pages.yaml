- pgno: 144
  md: '還有許多內容必須學習，但讓我們稍作停頓，回顧一些我們目前已知該追尋的重點。第一點，我們需要市場大勢是多頭。第二點，類股應該具有正面的性質。另外，由有利類股中所挑選的圖形必須突破而進入第二階段，且僅有最小的上檔壓力。最後，成交量絕對必須能確認該突破。至此，你可以稍作審視，看看我們有多少個審核項目，想想如何運用它們，將優劣區分出來。


    在使用技術分析時，有許多內容必須學習。通常一些學院派的經濟學家會告訴你，圖形無效，市場交易是隨機的。幾年前，這種說法會使我難過，但現在我只是對自己笑笑。所有這些走勢看來是隨機的嗎？你怎麼能夠將1,000個突破輸入電腦，視它們全部相等，猶如它們全部是最佳走勢呢？這就好像將所有四分衛的傳球距離予以平均化，將Dan
    Marino及John Elway（兩人皆爲當時職業美式足球的著名四分衛）之類的人物與小聯盟（Little League）的球員等量視之。不過這無所謂。就讓那些隨機游走的人在突破時把持股賣給我們好了。當他們買進第四階段的股票而股價不斷下跌時，我們就會讓他們認爲圖形猶如巫術。


    # 一切皆相對


    要縮減我們的潛力股名單，所要審視的下一個重要因素爲相對強度（R S）。這是衡量個股相對於整體市場表現的指標。縱'
  merge: -1
  img_proc: true
- pgno: 145
  md: '使一支股票處於漲勢，它仍可能呈現拙劣的相對強度。同樣地，一支下跌中的股票也可以展現出好的相對強度。想一想。如果 X Y Z 股票上漲10%，而標準普爾綜合指數⁽註6⁾上漲20%，X
    Y Z 便嚴重落後，即使其股價走高。它不僅不是一支領先股，而且明顯地它是被勉強拉高。因此，當整體市場反轉而下時，X Y Z 遭受打擊的機率就很高。相反地，如果它下跌10%，而市場平均挫低20%，那麼它在相對強度上就算
    是表現良好。一旦市場轉而趨堅，該股可能會領先該波段的上涨行情。


    相對強度的公式很簡單：


    # 相對強度 = X Y Z 的價格 / 市場平均價格


    如果 X Y Z 股價目前為50，而標準普爾綜合指數為310，相對強度則為0.16（50 ÷ 310）。有些技術人士每天計算該數字，但我發現並無必要。如果你每週製作一次⁽註7⁾，你將可以看到一個明確的型態隨著時間而形成，這才是最重要的。相對強度在本週可能為正值，而下週可能是負值。唯有經過一段時間，真正的輪廓才會形成。


    (註6) 只要一致，你可以使用任何的股價指數，但是標準普爾綜合指數和道瓊股價指數是最好的。


    (註7) 最好是在每週的同一天製作，不論是星期幾都無所謂，本書作者則偏好在星期五。'
  merge: -1
  img_proc: true
