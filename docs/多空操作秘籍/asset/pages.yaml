    # 圖3-2


    這是理論。現在讓我們看看實際生活中的例證。Mexico Fund於一九八七年初突破3.25處（參閱圖3-2之箭頭處）。成交量開始放大，股價在幾天之內躥升35%。最初買盤進發後，它暫時在4.375形成高點。兩週後，它拉回到3.375——非常接近突破點。成交量拉回時萎縮，所以這是你應該將剩餘一半部位投入的時機。此後，當其動能集結之後，成交量巨幅擴增，接下來在未來九個月內，它上漲到14，出現了330%的快速獲利。


    # 交易員的作法


    這裡有另外一個十分有利可圖的新買進時機。它發生在第二階段漲勢進行相當程度之後，股票回挫到移動平均附近並出'
