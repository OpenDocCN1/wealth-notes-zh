  md: '當我們的市場到達高峰時，法國（圖8-16）再度出現空頭市場訊號。這些早期警訊都明確呈現這是重新整頓投資的時機了，因爲空頭快速抵達我們海岸的機率很高。如果還有任何疑問，澳洲、加拿大、香港與新加坡皆一致出現空頭訊息。一九八一年到一九八二年空頭市場出現後，結果是一場爲期十六個月的艱困期。


    好消息是這項長期指標在多頭時也同樣運作良好。回顧一九八二年上半年，陰鬱的命運肆虐華爾街之時，這項指標確立了一絲曙光。雖然美國股市無情地走低，但英國（圖8-17）在一九八一年底開始傾向走高，荷蘭與西德也形成第一階段的堅實底部。它們都呈現上檔突破時，三者皆確認了美國市場始於一九八三年下半年的多頭浪潮已在前方不遠了。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_379_0.png)


    圖 8-16'
  merge: -1
  img_proc: true
- pgno: 380
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_380_0.png)


    很明顯，這些都是你需要密切監視的金融脈動。但是，它 的確需要耗費相當時間，所以這裡有個好消息：追蹤這項指標 的簡易途徑，就是只繪製全球市場股價指數的週隨圖即可。
    Barron''s雜誌在其全球股市圖表中（圖8-12）提供了這些數 據。它將可提供你有關所有國外市場十分明確之輪廓。只要每 個週末繪製，並且計算及繪製該資料的三十週移動平均即可。'
  merge: -1
  img_proc: true
- pgno: 381
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_381_0.png)


    # 圖8-18


    你可以從圖8-18看得出來，這個關鍵性長期指標在一九八二年夏天穿越其三十週移動平均時，它出現了重要的買進訊號（A點）。它在一九八三年底第三階段頭部形成之前，一直都處於相當有利可圖的狀況。'
  merge: -1
  img_proc: true
- pgno: 382
  md: '此後，這項指數在一九八四年初進一步走弱、突破其移動平均（B點）。這個負面行為與一九八四年一月十七日的小型空頭市場準確地配合。這項指標在一九八四年底領先美國市場而向上突破時（C點），出現了罕見的力量。這正是同時間在美國市場蘊釀的、從一九八五年到一九八七年八月令人興奮大多頭走勢的絕佳訊號。然後在爲期近三年的強勁力道之後，全球股價指數開始形成明確的第三階段頭部（D點），而這也是美國市場在八月份高峰之後轉爲守勢的另一項理由。一旦主要支撐與三十週移動平均在十月份遭到貫穿（E點），你就有了另一個明確的徵兆，此時如果還繼續夢想著道瓊指數將上漲達3,000點，最後一定會成爲自殺行爲！


    # 當通用汽車發動......


    一九五〇年代末期，內閣閣員查爾斯.威爾遜（Charles Wilson）曾評論說，「對通用汽車好的，對美國一定好。」雖然通用汽車如今已不再像當年一樣居於領導公司之地位，但仍具有相當大的影響力。市場並不民主。每一支股票在決定主要趨勢時所投下之多空選票，絕對不能等量視之。交投最熱絡與法人機構因偏愛而持有者，一定比在店頭交易的第二線股票遠爲重要。在所有領導股之中，就有一支你必須永遠密切注意的股票——通用汽車。當然，絕不能只單獨傾聽这支關鍵性股票所帶來的訊息，但當它所發出之訊息與本章絕大多數指標一致時，也不要忽略它！'
  merge: -1
  img_proc: true
- pgno: 383
  md: '這個指標的另一個好處是，只需要花費些許時間追蹤即可。當你翻開你的圖表時，一定要確實注意通用汽車之行為。這裡有一個很多人用來衡量這支關鍵性股票健康（或不健康）狀態的方法。它稱為四個月法則。如果通用汽車在四個月之內未創新高點（或新低點），這便是通用汽車領先趨勢正在反轉的徵兆。過去五十多年來，遵循四個月法則有超過70%是有利的。令人印象更深諷刻的是，在其失敗的例子中，沒有一次偏離超過10%。由於此項奇蹟，因此正面訊號提供了獲取可觀利潤的機會。


    我在《專業軌跡解讀》中追蹤四個月法則，而它也值得你跟著這麼做。不過我發現，若將階段分析應用於通用汽車的圖形，在判斷市場時效上效果更大。如果這兩個方法出現背離現象，請永遠要採用我們的圖表技巧所提供之訊息。當它完成了第三階段頭部，並向下突破進入第四階段時，即使通用汽車在上個月創新高點，這也是你應該憂慮的時機。相反的情況下，當通用汽車突破第一階段底部時，同樣的概念也是正確的。另一個應該考量的因素是背離分析的概念，對於這個概念你現在應該更感覺坦然。當通用汽車未與道瓊指數或其他領導指數同步創新高時，這便是一個你最好要小心謹慎的早期警訊。'
  merge: -1
  img_proc: true
- pgno: 384
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_384_0.png)


    # 圖8-19


    圖8-19是利用通用汽車協助辨認重要底部的一個絕佳範例。在一九七三年到一九七四年的空頭市場中，不斷創新低點的通用汽車股價，證實了最糟糕的空頭下跌力道仍完整無缺。但在一九七四年中，通用汽車改變了態勢。首先它向上突破其下降趨勢線，接著它完成了雙重底，最後它穿越其三十週移動平均。這恰與一九七五年到一九七六年的強勁多頭市場起點相配合，是一個非常有利徵兆。


    一九八一到一九八二年的空頭走勢，看起來也很有意思（圖8-20）。雖然指數無情地走低，但通用汽車早在一九八二年第一季便開始形成第一階段底部。當年五月份，該股票進入第二階段，這是空頭市場即將結束的預告。非常有趣的是，我在七月份轉為多頭，當時我大多數的指標與通用汽車一樣進入有利階段；但一直到八月份，市場指數才觸及空頭市場的低'
  merge: -1
  img_proc: true
- pgno: 385
  md: '點，而多頭市場由此展開。有許多市場玩家認爲，你必須設法猜測出低點，才能搶進便宜貨，因爲空頭市場的反轉實在太快了——千萬別相信這種說法。這絕對是錯的！在上升走勢形成之前有太多的預兆。如果你有在家做好技術分析的功課，你就能夠把它辨認出來。


    與一些指標（例如我的動量指數）不同的是，通用汽車在市場指數於頭部與主要低點時的訊號具有同時性。一九六六年初，通用汽車無法越過一九六五年的高點時，它便透露了危險訊號。雖然道瓊指數再創新高，但這個背離走勢卻是一項重要警訊。另一個負面訊號是一七六六年初孱弱的相對強度與第三階段的做頭行為。最後，一旦它跌破支撐及其移動平均時，出現麻煩就再也不是疑問。此後不久，股價果然大幅滑落，而一九六六年的空頭市場也就此正式登場。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_385_0.png)


    圖8-20'
  merge: -1
  img_proc: true
- pgno: 386
  md: '到了一九六九年到一九七○年的空頭市場時，這個指標並不是輕聲迂迴地透露訊息，而是直接大聲地發出警告！當道瓊指數在一九六八年十二月份回到其一九六六年高點時，通用汽車當時股價卻是淒慘兮兮。它根本沒有接近其一九六六年的高點，而且在一九六九年初當它跌破其移動平均時，就等於宣告麻煩已經上路了。


    在一九七三年到一九七四年空頭市場出現之前，通用汽車的危險警告也發揮了同樣的功效。不僅通用汽車無法在一九七三年一月份創新高點，就連道瓊指數也沒能做到，甚至連一九七一年的高峰位置也沒能稍稍靠近。這種背離走勢令人心驚肉跳。後來它在一九七三年初跌破支撐與三十週移動平均時（圖8-21），你就應該知道這是捨棄利多開始賣股票的機會了。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_386_0.png)


    COURTESY OF MANSFIELD STOCK CHARTS


    圖8-21'
  merge: -1
  img_proc: true
- pgno: 387
  md: 最後，讓我們檢查通用汽車最近的行爲。在一九八七年十月份的歷史性崩盤前，這項指標是否出現了任何賣出的線索？當然有！與本章的其它每一個指標一樣，在一九八七年崩盤前，通用汽車呼籲賣出。參閱圖8-22中一九八七年的價格行爲。雖然通用汽車在八月份觸及新高點，但在幾個禮拜之後便出現遭遇麻煩的訊號。這也是爲什麼我比較強調類似階段分析的彈性系統，而較不重視類似四個月法則的僵硬系統。那些盲目遵從後者的投資人與分析師相信，至少在十二月以前還沒有什麼值得擔心的。但當你查閱圖表時，你應該瞭解爲什麼危險徵兆在九月底到十月初已經顯現。後來通用汽車突然反轉，率先跌破其長期上升趨勢線。然後它又跌破其三十週移動平均。雖然所有這些情況正在發生，但道瓊指數還由2,500附近上漲約到2,650。這是引起關切的理由。如果你剛學的幾個其他指標情況良好，你的憂慮還可以稍微減輕。但是這些指標中的每一個皆處於不良狀況。因此我建議《專業軌跡解讀》的訂閱者進入非常防禦性的位置。記住，如果通用汽車不加入，任何市場都難以持續向上攻堅；同樣地，如果通用汽車拒絕下跌，空頭市場很難掌握大局。因此，這個單純的指標應該加以密切觀察。當它出現明確訊號，而該訊號與本章所述大多數的長期指標一致時，如果你忽視它所透露的訊息，那就太冒險了。
  merge: -1
  img_proc: true
- pgno: 388
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_388_0.png)


    圖 8-22


    # ・便宜還是昂貴


    下一個長期指標顯示我事實上一個實用主義者。雖然我堅決相信技術分析，但我總是儘可能保持客觀。在講習會中，我常常開玩笑說，如果對股票名單投擲飛鏢能夠給我80%的正確答案，那麼它也將會爲《專業軌跡解讀》「證據權數」中的第五十一個指標。不論是技術分析或是基本分析，我想要的只是對明天市場可能行為的較佳洞察力。不幸的是，大多數我測試過的基本分析指標，其預測能力皆不值得信賴。但有少數則是，其中最佳者爲股價／股息比率。這個非常長期的指標顯示股票價格是股息的幾倍。換言之，爲了買進價值一元的股息，你必須支付多少代價（以股票價格表示）？'
  merge: -1
  img_proc: true
- pgno: 389
  md: '在更深一層探討理論之前，先瞭解如何計算價息比率。在每個週末Barron''s雜誌的市場試驗室專欄裡，有一個表格，其標題為「指數、本益比與殖利率」（參閱圖8-23）。一九八七年十一月廿三日的Barron''s雜誌刊出下述內容：道瓊工業股價指數之殖利率在十一月廿日收盤時為3.58%。在市場試驗室專欄的其他欄位中，你可以找到道瓊收盤指數為1,914點。下一步便是將道瓊收盤指數乘以殖利率（週五收盤指數乘以指數之殖利率即等於道瓊指數之股息支出）。在本例中，該數據為68.52（1914乘以3.58%——它必須改為0.0358的小數點形式——等於68.52）。68.52美元便是道瓊三十支績優股目前所支付的股息數。我們現在已經備妥最後一步了。因為該項指標是股價/股息比率，因此我們現在要做的只是將道瓊指數的價格再除以股息（1,914除以68.52）。這就給了一個讀數爲27.9的價息比率（捨去小數點以下第二位數字）。


    | | Last<br>Week | Prev. Week | Year Ago<br>Week |

    |---|---|---|---|

    | DJ Ind.-P/E<br>Yield, % | **15.2**<br>**(3.58)** | 15.3<br>3.54 | 15.9<br>3.64
    |


    SOURCE: Reprinted from Barron''s, November 23, 1987, p.154, Dow Jones & Company,
    Inc. 1987. All Rights Reserved.


    圖8-23'
  merge: -1
  img_proc: true
- pgno: 390
  md: '我們現在準備行動。這個長期指標擅於辨認主要的頭部與底部。每個人在談論市場是否便宜或昂貴時都是主觀的。但這是種客觀判斷的方法。當價息比率降至14到17的區域時，普通股便是異常便宜。另一方面，股票以其報酬來表示而變得昂貴時，則是謹防主要頭部形成的時機。該數字高達26之上，就歷史而言已是危險的讀數，而當該數值處於30之上時，則是股票嚴重高估的徵兆。


    在進一步探討之前，必須先確定你能瞭解，這雖然不是一個精確的指標，但若配合本章的時效指標一起應用，它就會是一個很有用的指標。你必須瞭解的是，有利或不利的徵兆會比採取行動之時機早很多。空頭數據意味市場已經進入高風險地帶，而崩跌幾乎一定會隨之而來。但空頭市場仍可能在一年或更久之後。所以，如果我們所有的其他長期指標仍處於多頭狀態，則應繼續站在多方，但要謹慎留意出場。這項指標轉為有利時，則只要相反過來就對了。有一個絕佳的範例發生在一九三二年，當時價息比率下降到十分偏低而有利的水準。這項指標正確顯示了驚人的多頭市場正在形成，但在我們的時效指標（例如道瓊指數與其移動平均之關係）轉為正面之前，你仍不應該變得太積極。'
  merge: -1
  img_proc: true
- pgno: 391
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_391_0.png)


    在有利可圖的這一方面，此指標呈現非常多頭的讀數，分別出現在一九三二年、一九三七年、一九四二年、一九四九年、一九七四年與一九八〇年（圖8-24）。每一個都伴隨出現非常有利的多頭市場。但有些讀數，例如出現在一九三二年、一九四二年與一九八〇年者，則是提早出現超過一年。因此，可將此指標視為辦認潛在多頭與空頭之指標，但在火花出現之前（我們的時效指標可予以辦認），即使汽油不斷地湧入，也可能暫時不會爆發。


    在呈現不利的方面，此指標分別在一九二九年、一九三六年、一九三九年、一九五九年、一九六一年、一九六五年、一九六八年、一九七二年與一九八七年都達到高風險水準。一九八七年的訊號尤其有幫助，因為價息比率到達接近40的水準——這是過去20年來最危險的讀數，也是有史以來最高者'
  merge: -1
  img_proc: true
- pgno: 392
  md: '之一！一九八七年十月份的崩盤如此嚴厲，並不令人訝異，因爲這項指標顯示有太多的高估必須加以修正。不過同樣再一次地，這項比率在一九八七年初已經明確逆轉，但直到一九八七年八月份高峰位置出現之前，我們大多數的長期指標仍未參與此空頭盛宴。


    # ・與群眾相反


    我們所探討的指標至少都具有一個共同點——它們都可以客觀地測量。它們都依據特定的統計數據（例如上漲與下跌家數，或創新高與新低的家數）。但是，這裡有一個主觀的指標，它不依賴任何特定訊號，可是它非常有用。我將它稱之為相反意見理論（theory
    of contrary opinion）。


    這個理論談論的是群居本能對投資人之折磨。本理論的基本論點之一是，人身處於主流內感覺最安全。因爲這個理由，投資人形成了一致的意見。他們相互強化其信念，並封鎖支持其他結論之證據。在市場中，這種行爲往往導致崩盤前夕的過度樂觀信念，以及底部時的普遍悲觀看法。採用相反意見理論的人，則會試圖發掘出一致的意見，然後再以截然相反的方式運作。


    在進一步探討之前，我先要警告你。若能適當地加以運用，相反意見是一個很有價值的工具。不幸的是，雖然每個人'
  merge: -1
  img_proc: true
- pgno: 393
  md: '及其經紀人都希望能深思熟慮，而且他們都認爲自己在運用相反意見，但實際上真正瞭解其意義者百不取一。請不要誤以爲會有很多的相反意見題材，而試圖在每個禮拜、甚至每幾個月就想要從相反意見中強行歸納出某些答案。真正的相反意見訊號，可能在一年或更長的時間都不會出現。唯有當一個盛行的話題開始在媒體間流傳，而且從華爾街到緬因街都能夠完全地接受時，它才是有效的。不要認爲相反意見只是打電話給你的經紀人，發覺群衆處於多方，你便決定站到空方那邊。重點是要等待一個非常明顯、而且一面倒的意見形成，那時候每個人都會認爲自己知道些什麼，於是開始懷疑傳統的智慧。我完全相信俗話所說的，「當每個人都知道一些時，那它便不值得去知道」。


    一個真正一面倒的意見開始掌握投資界時，它將變得如此濃厚而具體，真實到你幾乎可以拿到刀子把它切開的程度。再次警告：我並不同意那些相信只看相反意見便已足夠的人。這不正確。我視相反意見爲一種心理潛能，猶如股價／股息比率代表一種評價潛能一樣。如果所有其他時效指標皆不認同時，這兩者便都不足以促使你買賣股票。但是當相反意見與其他技術工具一致時，那你就要準備妥當，因爲一個巨大的市場走勢即將展現。


    下一個問題是：你該如何判斷相反意見？大部份的分析師都會選擇採用某些投資情報服務公司所編輯的多空數據。我追'
