    Glass Container（圖4-28）與Sun Microsystems（圖4-29）所發生的狀況。但在少數情況下，它也可能要相當長的時間才能完成，如同Harvard
    Industries（圖4-30）所發生的情形。請對此三個歷史案例稍做觀察。'
