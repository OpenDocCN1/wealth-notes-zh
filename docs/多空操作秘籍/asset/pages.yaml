- pgno: 331
  md: '失的方法。只要你的放空對象處於下降三十週移動平均下側，便可以給它相當的轉圜空間。你可依下列方式隨著價格下跌調整停止買點。在第一次買壓於D點探底之後，出現至少8%超賣後的反彈時，可準備調整保護性停止買單。此時你還不會實際調整停止買點，而是要等到該股彈升到達其峰位（E點）而再朝先前低點（D點）回挫時再進行調整。如果股價向上彈升時穿越了三十週移動平均之後才回跌（即E點在移動平均上方），投資人就應將停止買點調降到該水準（E點）的稍上方。但如果像是本例的情況，反彈的峰位低於移動平均，則投資人就應將停止買點設在移動平均之稍上方（F點）。在該循環之後，當移動平均逐漸下滑，則可變得更積極一點，而將停止買點緊壓到反彈峰位的稍上方。


    接著，該股票暴跌到G點，這是第四階段的正常行為。在大幅彈升奔向下降移動平均（H點）之後，漲勢停頓，股票再度下挫。如果股票稍微穿越下降移動平均也不用擔心。唯有當它大幅穿越均線時才需要特別關心。彈升結束之後，股票又朝先前低點（G點）回挫時，停止買點應調降到先前彈升峰位（H點）附近整數關卡的稍上方。在接下來的數月，保護性停止買點應可按照順序依次調降到J、K、L與M，而該部位最終將以豐厚之獲利在25.125停止買進點出場。注意，一旦你到達第一階段底部區域，移動平均不再下降，戰術就必須進行調整。此時即使該停止買點位於三十週移動平均下側，保護性停止買點仍應調降到重大壓力區上方的M點。'
  merge: -1
