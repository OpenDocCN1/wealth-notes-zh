- pgno: 37
  md: '所有這三種圖形皆有一個功能。日線圖（圖1-14）對短期交易來說絕對是最佳的工具。另一方面，月線圖（圖1-16）對追求數年趨勢的真正長期投資人而言，是優良的工具。介於兩個極端之間的便是週線圖（圖1-15），該圖是二者間的折衷。週線圖擁有足夠的交易資訊（雖然非常短線的交易員應該採用日線圖），尤其對中期（數個月）交易員及長期投資人息息相關的重要波動上，週線圖有其特殊價值。在本書中，我雖然會談論所有的圖形，但我會把重點放在週線圖，因為以整體而論，它們是投資人的最佳參考圖形，特別是因為它們可以一次顯示兩年的歷史資料。但是，請注意這三種圖形都是絕佳的圖形工具，而且皆可達成其各別目的。


    # 解讀線圖


