- pgno: 428
  md: '股票圖表上一樣，但期貨的進展遠較為快速。這就像是以高轉數快速播放唱片一樣。如果你想涉獵期貨，就必須更加敏感，並發展出一套短期思考的方式。這可不是一個可以只在週末檢視價格的領域。每天與市場保持接觸，具有關鍵性的作用！當期貨穿越頸線（A點）時，如果你買進柳橙汁合約，你的部位將運作得很好。如果你想以交易的方式來操作，在最初於右肩正下方設定了停止賣單後，接下來你就應該依序將其調升到B、C、D與E點。當合約跌破設立於E點的停止賣點時，你便能以優渥的利潤出場。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_428_0.png)


    CHART COURTESY: CRB FUTURES CHART SERVICE


    # 圖9-11'
  merge: -1
  img_proc: true
- pgno: 429
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_429_0.png)


    # 圖9-12


    如果你想扮演投資人，那麼只要它仍在圖9-12的四十天移動平均上方，你就可以繼續持有該合約。這裡最令人訝異之處，就是你可以完全不知道有關橙汁、銅、大豆或其他商品之基本面資訊；但你的預測仍然會比那些花費大量時間，閱讀美國農業部所提供所有報告的人要來得精確。


    另一個高風險但令人興奮的工具，就是股價指數期貨合約。目前有幾種不同的合約可以交易，每一種都是由一籃子的股票所組成。最為著名且成交量最大的期貨合約是Standard
    & Poor''s（S & P）500，這是法人機構最喜愛的標的。另一種交易沒那麼熱絡的是Value Line期貨合約，它是以第二線股票'
  merge: -1
  img_proc: true
- pgno: 430
  md: '做為權值計算的對象，不像S & P的合約是採用績優股。


    在一九八七年十月份的歷史性崩盤中遭到痛擊的市場玩家與分析師，都宣稱那完全是晴天霹靂，但只要對圖9-13稍做瀏覽便可發覺情況絕非如此。在六月份與十月份之間，明確的頭一肩一頂型態已然形成。一旦頸線遭到貫穿，它便真的成為崩裂的情況！當你閱讀圖9-14的S
    & P 期貨合約週線圖時，就會發現情形甚至更明顯。所以，如果你做了技術分析的家庭作業後，仍選擇看多而陷入可怕的災難，那是絕對找不到藉口的。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_430_0.png)


    CHART COURTESY; CRB FUTURES CHART SERVICE


    # 圖9-13'
  merge: -1
  img_proc: true
- pgno: 431
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_431_0.png)


    # 圖9-14


    我不斷強調，本節是專業人士與交易員的高風險遊戲。高風險的背面即是非常鉅大的報酬。頸線跌破時，只要放空一口合約（當時每口合約需要7,500美元的保證金），在幾天之後的崩盤低點回補，即可獲取超過66,000美元的利潤(註8)。


    這是很明顯的教訓。從現在開始，當你企圖預測未來價格時——不論它是ＩＢＭ、共同基金、股票選擇權、黃金或大豆——請不要再閱讀金融版的新聞。相反地，請確實掌握圖表，仔仔細細地好好研究吧！


    (註8) 崩盤之後，保證金就被提高為每口合約20,000美元。'
  merge: -1
  img_proc: true
- pgno: 432
