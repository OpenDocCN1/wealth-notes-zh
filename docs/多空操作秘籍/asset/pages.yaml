- pgno: 76
  md: '回顧一九七三年，Avon是那個時代所謂的單一決策股之一。很多聰明而懶惰的基金經理人認為，對這種成長型股票所需做的唯一決策就是何時買進。請永遠不要相信這種童話故事。沒有任何一種投資——不論它是股票、黃金、房地產、珠寶或Nawgahyde期貨——可以採用這種「買進然後忘掉」的做法。所有的投資都會經歷週期循環，當你持有它們時正好歷經循環的下降部份（第四階段），你將同時蒙受財務上與情緒上的痛苦。當Avon完成其頭部而進入第四階段時，它的每股盈餘為2.26美元；而當它成交於每股80美元或稍低時，每股盈餘則為2.30美元（過去十二個月）。如果你掉進抱牢的陷阱進而推論股價終將回升，那麼你應該知道，在我著作本文時（一九八七年底），也就是在十四年之後，Avon再也不曾接近其140的高點、或向下突破的120附近價位。如今它仍在35附近掙扎。


    參閱Avon的圖2-14，就可以看到它完全遵循你應該逐漸熟悉的劇本演出。它在110跌破支撐後出現殺盤。然後它拉回到近120，亦即原先向下突破處。其後，在第四階段接手後，股價大幅下挫。往後一年的每次反彈皆未能穿越移動平均的下降趨勢，而在第四階段買進的所有數百萬股股票（只因為它在80顯得便宜，然後是70，然後是60），皆是受到毀滅性的底部猜測症所驅使。如果你學會我的方法，並有紀律地遵循，這便將永遠不會再成為你的噩運。'
  merge: -1
  img_proc: true
- pgno: 77
  md: '當有線電視出現後，Teleprompter（圖2-15）成爲另一個耀眼的寵兒。雖有令人興奮的基本面，但是當Teleprompter向下突破移動平均與其主要趨勢線後，它便明確地完成了主要頭部。再次地，這裡有初次的暴跌（到30），隨之而來的是拉回到向下突破水準的反彈。從此之後，Teleprompter徹底地奔瀉。在該股下跌超過其價值90%的期間，所有的反彈都止於移動平均或其下方。


    「事情變化愈多，愈能保留其原貌」這句古老的信條，於此再次得到確認。相同的危險模式再度出現於一九八六年底。這次是二支新進的耀眼股——Crazy Eddie（圖2-16）與Endotronics（圖2-17）——在超級多頭市場中慘遭格斃。就像是要證明基本分析的侷限性似的，一家主要經紀公司在崩盤前幾天，尙對Endotronics提出買進建議！結果如你所見，事情再度依你的預期發展。在此二例中，在第三階段頭部完成之後，皆出現重要的賣出訊號。又一次地，在初步暴挫之後，出現拉回反彈，其後賣壓持續發展，使得所有超賣後的反彈皆未能回到其個別移動平均之上方。我可以向各位保證，類似情況在未來還會不斷重現。華爾街寵愛的股票總在火焰中下墜，一些逢低承接與揀便宜貨的人總會蜂湧攫取這些大好機會，而你的策略應該很清晰：賣出，然後避開第四階段的跌勢。當群眾汲汲經營其虧損，然後推論這是因爲他們運氣差時，在某些情況下你甚至應該放空——我們在後面會加以討論。'
  merge: -1
