- pgno: 262
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_262_0.png)


    # 圖6-30


    要將趨勢線整合到你的交易計畫時，可依照前例的方式開始進行。參考圖6-30，當你在突破時於20.375處買進，設定最初停止賣點於19.375（A點）。股票彈向高點G時，可調高停止賣點到B。一條明確的趨勢線至少必須連接三點。趨勢線成型之後，就應該將它納入設定停止賣點的分析之中。在X
    Y Z彈升離開C點後，停止賣點應設定在C點的下側。趨勢線在此便可以開始協助你了。幾個月來，它一直有效，也被碰觸至少三次，你應進一步將停止賣點提高到趨勢線的下方。首先你將它調高到D，數週之後，再調高到E與F的位置。因為趨勢線處於上升狀態，即使股票出現橫向走勢，猶如在I點之後出現的走勢，你還是可以針對你手上一半的部位，繼續調高停止賣點。現在你有一半的部位，以設定在C點的停止賣單保護，另一半則設定在非常靠近交易價位的D、E，最後為F點。在股'
