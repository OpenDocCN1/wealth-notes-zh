- pgno: 200
  md: '回顧一九七一年，Anthony Industries完全符合所有必要標準。成交量擴增為正常水準的四倍——這是重要買進意願的明確徵兆（圖5-16之A點）。尤有甚者，成交量在接下來數週仍維持相當巨大。R
    S線也決定性地進入正値區（圖5-16的B點）。第三個重大線索顯示重要時刻正在形成。那就是Anthony Industries處於第一階段底部時所出現的震盪。它在支撐點5與壓力點10之間來回震盪。因此，它在一九七一年底首度突破10.125時（圖5-16之D點），已經上漲了100%。對許多投資人而言，這是賣出時機，因爲該股處於超買狀態(註2)。但我已經訓練過你的眼力，而你也開始發展出對圖形的感受力，因此你的看法應該已不同於一般投資人。在D點，Anthony以大成交量首度進入第二階段。所以請不要再追隨群衆使用如超買與超値這類的一般術語。你應該說一個字——買！經過八個月之後，Anthony上漲超過300%，我們的大贏家理論於焉實現。


    (註2) 超買〔Overbought〕是技術名詞，意指一支股票在短期內上漲過速而應回檔整理。'
