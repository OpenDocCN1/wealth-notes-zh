- pgno: 399
  md: '# 第9章


    # 勝算、結局與獲利


    你即將抵達目的地！除了我教你的技巧外，如今就算不再學習其它致勝戰術，只要誠心運用我的技巧，在市場中你一定還是能運作得非常好。接下來我要提供給你更完整的教育。若以之前用過的網球來做比喻，如今你的知識已足以使你成爲贏家，但是接下來你將學習到的進一步技巧，可使你成爲冠軍。你現在已精通階段分析的方法，而接下來你該知道的是，除了股票之外，還有其它的幾個領域，一樣可以非常有利地應用同樣的技巧！


    # · 嬉戲於基金


    我們所要進入的第一個領域乃是共同基金。這是一場易於精通，而且風險比較低的遊戲。多數投資人視共同基金爲長期投資，買進之後即束諸高閣。這是愚蠢的行爲，其理由如下：第一，如果你瞭解如何拿捏主要走勢的時機，爲何要坐等它渡過第四階段的空頭走勢呢？第二，愈來愈多的基金採用無手續費或低手續費之政策^{(註1)}。最後一點是，現在有很多基金公司提


    > (註1) 無手續費基金對基金的買賣不索取費用。買賣係依據淨資產價值。低手續費基金則索取較低之費用，通常在2%到3%左右。'
  merge: -1
  img_proc: true
- pgno: 400
  md: '供積極性股票基金，以及貨幣市場基金。爲了吸引你將資金留滯在其庫藏中，它們准許你隨意在基金之間做轉換，通常僅需用電話聯絡即可。這可讓你立即建立起一場非常具有獲利潛力的交易與投資遊戲。我們所要做的只是在市場明顯轉爲多頭時（例如一九八二年中與一九八六年底），買進積極性的基金，而在第四階段出現時（例如一九八四年一月份與一九八七年十月初），將積極性的基金賣出，將資金轉入貨幣市場基金。


    很多年以前，當我最初開始推薦共同基金之轉換時，只有少數基金提供這種機會。但如今共同基金產業的成長，已使得這種機會變得十分普遍。


    Stein Roe Capital Opportunity的週線圖（圖9-1）顯示了這種策略有多麼容易執行。在一九八二年的夏天，三十週移動平均在連續十四個月的跌勢之後開始走平。然後，當該基金於13.50美元處穿越其三十週移動平均時，一個低風險的買進訊號出現了。因爲你在共同基金中無法實際採用停止賣單，你必須使用心理停損單（意即如果它的收盤價低於你的停止賣點，你就要立刻打電話給基金公司將它賣出）。在本例中，停止賣單最初應該設定在低點A點之下方。一旦圖形轉佳，基金大幅走高時，你只要繼續持有即可。一年之後，當Stein
    Roe跌破其移動平均，便是回收100%獲利而將積極性的基金轉換爲貨幣市場基金的時機了。'
  merge: -1
  img_proc: true
- pgno: 401
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_401_0.png)


    利用共同基金以掌握市場循環的優點是，你沒有必要詳細研究爲數衆多的個別股票。你所要的只是追蹤一些績效良好的基金，以及它們的三十週移動平均。這只需要在週末花費幾分鐘的時間，而這些工夫是值得的。


    如果你對如何計算三十週移動平均並不熟悉，沒關係，放輕鬆吧。首先，請重新閱讀第一章中我對於移動平均的描述。然後再回到本例中，你就能輕易地學會了。'
  merge: -1
  img_proc: true
