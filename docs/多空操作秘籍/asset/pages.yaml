  md: '一九七二年到一九七三年的Bowmar，與一九八六年到一九八七年的Home Shopping，可以明確說明我所要表達的意思。回顧一九七○年代初期，Bowmar（BOM，圖7-7）由2漲到10，然後15，然後漲到20。它簡直瘋狂，每當它上漲幾點，便有基本面報導顯示該股缺乏實質支撐，註定要崩盤。基本分析師的看法是正確的，因為Bowmar所生產的口袋型計算機即使賣到全國的每張桌子上都有一台，其股價還是太貴。那些放空該股票的分析師與許多市場玩家所不瞭解的是，只要BOM仍處於第二階段，高股價還是可以漲得更高。第二項他們未曾考慮的因素是，有那麼多人在放空該股。它引誘了幾近25萬股的空頭，大約是平均日成交量的10倍。只要它開始漲升，空頭便會爭先恐後回補，單靠這項因素，不正常地大量放空便已能推動該股走高。這正是Bowmar在上漲到30、35與40時所發生的現象。週復一週，當該股爬升到45的高峰價位時，愈來愈多的空頭被洗出場，它甚至無視於一九七三年頭十個月的空頭市場。當然現在你已經瞭解階段分析，應該瞭解單看不斷走高的移動平均，你絕對不會在一九七二與一九七三年間放空該股票^(註2)。


    > (註2) 移動平均只有一次停止揚升，而股價跌到其下，當時出現暫時的龐大賣壓。在這段期間，你還是不應放空，因為融券餘額太大了。假使你放空，當BOM回升到移動平均之上時，你將被迫回補打平。'
