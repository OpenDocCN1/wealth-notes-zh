    & Company Investment的圖形還算不錯，它在一九八七年初（圖3-30）出現了向上假突破（A點）。像這樣的鋸齒走勢在負面類股內是相當常見的。它在上檔無法施展並不令人十分驚訝，然後它就在有史以來最突出的多頭市場中下跌。這個教訓很明顯。不要嘗試成為精明的神童，企圖在病態類股內找贏家。不要嘗試證明你是個市場天才。讓所謂的天才虧錢，而你只是很單純的從絕佳類股中找絕佳的股票，然後享受搭便車的愉悅，以及豐厚的獲利。'
