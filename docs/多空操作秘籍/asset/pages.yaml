    # 圖3-11


    檢測大盤的方法就是要讓值得信賴的指標冷靜地為你做決定。我現在不會教你這些指標，因為我想在後面章節中再詳加討論。目前，我們暫時假設趨勢是多頭的。等你閲畢第八章之後，你便能夠認出下一個重要市場的頭部和底部！'
