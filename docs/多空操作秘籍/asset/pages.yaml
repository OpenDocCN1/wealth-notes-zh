  md: '後，我已經學會如何解讀市場提供給我們非常明顯的線索，以及如何策略性地回應某種既定的情況。我將教導你一套新的股票市場規範，使你覺得市場的壓迫感減輕，而且更容​​易獲利。這些規範不要你鑽研公司的資產負債表，或聆聽公司發言人有關提升股東權益報酬率的無聊言論。這套規範只需要你做兩件事情：控制自己的貪婪與恐懼，發覺與解讀市場所提供的明顯線索。


    這就是在本書我所要教導的內容，當你學會後，將使你成為勝利的投資者。尤有甚者，一旦你瞭解這套規範的使用方法之後，每個星期你只要花費大約一個小時的時間，來執行這套致勝的方法即可。


    過去二十五年以來，我已經學會什麼是實用的，什麼是無效的。這些知識與經驗，經由我琢磨與精鍊後發展成一套能永遠站在市場贏面的方法。這套方法使得《專業軌跡解讀》（The
    Professional Tape Reader）在過去十五年中能夠預測出「每一個」多頭與空頭市場。你可以在任何市場中利用這些技巧，不論是股票、共同基金、選擇權、股價指數期貨或商品皆可。以下內容可涵蓋到每一種市場，不過重點仍將放在股票市場。


    在進一步討論以前，我要強調本書並非討論「一夜致富」的書籍。每年總有幾十本這樣的書出現在我桌上，這些書籍絕'
