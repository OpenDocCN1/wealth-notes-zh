  md: '# 第2章


    # 一限勝過千萬盈餘預測


    本章的標題是我真正相信的觀念。你只需要看看像通用汽車這樣的個股就能瞭解。該股盈餘在一九八一年轉佳，股價卻由58下跌到34。再看看Greenwich Pharmaceuticals這檔個股，該股的股價在一九八六年到一九八七年間由3上漲至19，而其盈餘卻是赤字！所以請牢記：眞理其實是：「軌跡呈現一切」，而我們的工作便是學習如何適當地去傾聽。


    你現在已準備好，要開始攻讀你的技術分析學位，並開始學習如何應用我的方法。市場對你將不再神秘，而且將更具獲利性。請參閱圖2-1的階段圖。如果一張圖勝過千言萬語這種說法是正確的，這便是絕佳的例子！請好好研讀圖2-1一會兒。這就是你從現在開始分析股票與市場的方法。一旦你掌握這有利的技巧，則股票、選擇權、共同基金、商品或其他市場遊戲都將變得更為簡單，而且將更具獲利性。你將能夠快速翻閱圖表，而且能夠立刻認出那些更值得進一步研究、甚至可以採取行動的個股。同時，你也可以不再理會報紙標題所刊載的那些令人振奮的報導，更快速地刪除掉那些不值得再考慮的個股。'
