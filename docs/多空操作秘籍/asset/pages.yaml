- pgno: 254
  md: '從現在開始，你知道只在遊樂場裡，才會去搭乘雲霄飛車。如果ＩＴ向上突破時你買進，最初你應該在Ａ點設停止賣單來保護你的股票。接下來幾個月的，你應該會如圖所示地提高它。一旦移動平均走平，股票跌破其停止賣點，你就應該會樂見停止賣單被觸發，因為你在麻煩出現前已經鎖定優渥的利潤。雖然你並沒有爭取到最高價——實際上你大概永遠爭取不到，但你確定在為期幾個月的時間內，將獲取可觀的利潤。更重要的是，你避開了會使你的厚利轉為虧損的第四階段惡性下跌！為了避開致敗的反轉（相信我，這種情況經常出現），你絕對值得為偶發性的震盪洗盤付出一些代價。


    # 交易員的做法


    在我最常被問到的問題中，有幾個與交易行為有關。你如何定義交易員？我該從事交易嗎？為什麼要做交易？投資與交易何著較好？如果你是市場老手，應該知道自己是傾向於交易還是投資。但新進者通常會困惑於應選擇那一條道路。令人訝異的是，甚至一些已經在市場中的玩家，也會對自己的做法感到迷惑。他們可能認爲自己是投資人，但實際上卻採用交易員的心態，因此績效很差。


    所以以討論交易員拿捏賣出時機的適當方法之前，我想在理念上稍作探討。我真的不相信在交易與投資何者較佳的問題上，存在一個絕對的眞理。我認識很多非常成功的交易員，當'
  merge: -1
  img_proc: true
- pgno: 255
  md: '然也認識很多成功的投資人。但我可以確定的 是，對於大多數市場玩家而言，遵循投資途徑獲取豐厚利潤是比較容易的（尤其是對新進的市場參與者而言）。它涉及比較少的付出時間、比較少的技巧，而且你的情緒也會比較輕鬆。那麼，為何有人會考慮從事交易行為呢？簡單。交易員需要挑戰與行動！大多數投資人生性保守，喜歡生活保持輕鬆與平靜，而交易員比較傾向生活在邊緣地帶。他們喜歡享受在火線上做決策所帶來的刺激與快感。


    不要浪費時間企圖判斷出交易與投資中何者才是最好的賺錢途徑。沒有最佳的途徑；如果有技巧地運用，兩種方法皆可以成功。反之，好好思考並瞭解你是那一類型的人，以及你適合採用何種方法。花一點自省的工夫發覺你的天性適合於何者，然後再盡己所能成為一個最佳的投資人或交易員！如果你決定從事投資，卻在你的股票下跌六或七點時變得非常憤怒，然後在股票起漲之前拋出持股，那麼它終將導致一場大災難。所以請務必和你自己懇談一下。如果你顯然偏向兩者其中之一，那就站到那裡去吧。有趣的是，有些市場玩家確實是處於中間地帶，可以採用任何一種方法。如果你屬於此一類型，我建議你採用混合方式。原則上採用投資人的方式時，如果市場指標（在第八章我會教授該內容）出現嚴重賣壓之強烈徵兆，不妨也可以做些交易。如果你的股票飆漲而且漲幅過度，或者如果它遠離三十週移動平均時，你也可以考慮快速獲利了結。在這種情況下，可以鎖定1
    / 3到1 / 2 的投資獲利部位，其餘'
  merge: -1
  img_proc: true
- pgno: 256
  md: '部位則以投資式的停止賣單繼續搭輔，這可說是相當合理的一種做法。


    我想要談的理念就這樣了。接下來讓我們繼續嚴密探索特定內容。猶如對投資人而言有明確規則可循，對交易員而言也是如此。交易員的規則比較不僵硬，因為你隨時準備翻銅板，但即使如此，還是有明確的指導方針必須遵循。


    第一個追求卓越的交易技巧，是以追蹤停止賣點為中心。在使用這項工具時，交易員要遠比投資人具有積極性。理想上，只要該股票仍處於第二階段，投資人都希望能繼續維持其部位。他們可以接受沿途出現一些相當嚴厲回檔的現實。同時，在股票上漲之前，也可能會歷經為期數月的橫向整理。


    交易員則非如此。他們理解時間即金錢。他們不僅希望避開所有的重跌，而且如果股票進入中性地帶達數月之久，他們也希望能離開。這是有道理的，因為股票若只是來回遊走，他們寧可進軍另一支新股票，因為該股票已經進入週期循環中令人興奮的部份。因此，交易員不應該等到賣壓跌破三十週移動平均才賣出（事實上，X
    Y Z 處於移動平均上方很遠時，如果能夠巧妙掌握賣出時機，交易員可以在股價拉回均線時再買進）。'
  merge: -1
  img_proc: true
- pgno: 257
  md: 之前我們已看過很多投資的案例，接下來就讓我們開始研究一些特定狀況，以便更深入瞭解交易的觀念。圖6-27的X Y Z股票在18.25到20.25區間盤整幾個月之後，在20.375處突破。再次地，股票應該在20.375處買進。但在本例中，最初停止賣點應以不同方式處理。對交易員而言，你在追逐一個較爲快速、但幅度較小的上漲波段，所以應該願意在犯錯時接受較小的初步損失。如果該股票要成爲極佳的交易對象，它不應該大幅跌破其突破點。所以你應該將停止賣點設定在前一個低點下方。如果沒有任何低點，那麼你或許可以玩玩下列的數字遊戲。雖然投資人絕不應該採用自動的百分率，但是多年的經驗告訴我，這些突破如果要在短期之內成爲大贏家，其回檔不會超過突破點下方4%到6%。如果你實在無法在附近找到一個具有意義的停止賣點，你就可以將它設定在突破水準下方4%到6%處。可是，你必須確定它落在整數價位下方。例如，如果突破點在20.375，4%的値較0.75點稍多，則停止賣點應該是19.625。若是取5%，則爲19.375。由於19.5在心理上可視爲是一個類似整數的關卡（在20美元之下，視每個0.5點爲整數，但在20美元以上，停止賣點應設定在實際整數之下方，例如21、22等），因此在這裡可用19.375（A點）的停止賣單加以保護。
