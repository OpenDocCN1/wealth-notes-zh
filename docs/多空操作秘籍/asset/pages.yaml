- pgno: 271
  md: '# · 利用虧損學習致勝之道


    不論我的系統多麼卓越，也無法讓你100％獲勝。這是一種承諾。人生很長，而你如何面對現實，就決定了你能取得多大的成功。事實上，在市場上打滾了許多年之後，我心中毫無疑問地認為，致勝的真正關鍵之一便是要學習如何虧損。請對此稍做思考。接受一、兩個部位的損失是否真有那麼可怕？對大多數人而言，它是的，這也就是他們老是做出不當決策的原因。但對市場專業人士而言，這是生活的現實，也是做生意的成本。如果某個部位陷入虧損，專家與其他專業人士不會因此而失眠。他們所關心的是兩項遠為重要的因素：(1)他們所有部位的淨結果（只要它是個很大的正數，他們就很開心了），(2)如果某支股票走勢對他們不利，他們該在哪裡退場。


    這就是用成熟的、理性的——卻極少被執行的——方法跟市場打交道。打網球時，你真的從不預期你的發球會觸網嗎？如果你是個實際的人，一定能接受部份的發球失誤，但只要你有很高比率的致勝發球，你就不會感到不舒服。訓練自己用這種方式思考是具有關鍵意義的。相信你就跟我一樣，曾經看過有人在網球場或高爾夫球道上，為了一些失誤而怨天尤人。如果你無法適當處理的話，情緒具有毀滅性的效果。我曾經看過一些市場玩家操作得相當不錯，尤其是處在多頭市場之時，可是只要有一個不佳的部位，便足以破壞他們的整體策略。他們不僅不能理解最初的些微損失是最好的損失，而且反而在股票'
  merge: -1
  img_proc: true
- pgno: 272
  md: '挫跌中，變得憤怒而頑固。當股價跌到看似便宜的水準時，他們便向下攤平，然後在惡劣的第四階段企圖打平，結果反而虧損更多的錢。更糟的是，虧損開始累積時，另一個毀滅性的步驟，便是開始獲利回吐那些仍處於賺錢階段的股票。在短期之內，可能因為有了進帳而使那些投資人感受好些。但在接下來的幾個月內，投資組合就會反應出這種短期作法的效果。很簡單，這種策略上的認知錯誤最終會使你放棄掉第二階段的贏家，而你的投資組合內只會剩下處於第四階段的輸家。


    是什麼驅使我們做出這種毀滅性的行為？一個字：自我（ego）！太多的交易員與投資人認為，如果他們能夠挑選出大贏家，他們便是天才，但如果他們虧損，他們便是蠢蛋。這種認知未必正確。如果你因為戰術不佳而獲勝，你所依賴的其實是運氣而不是你自己。如果你遵循確切的紀律而認賠，你的行為反而是明智的。請與自己好好的談一談，下決策時，你必須確定自我是在你的控制之中。不要為了在雞尾酒會上誇耀你的勝利而於市場中嬉戲。在市場中投入時間與金錢，是因為你想要享受賺取高報酬的挑戰。


    這種自我的毀滅性行為，每天都可以看得到。你只需要坐到隨便任何一家紀經商的辦公室裡，傾聽他們的對話，你便總能聽到人們談論，只要股價回升到他們能夠打平的價位，他們就會賣掉那支爛股。為什麼要打平呢？為什麼不是當它彈升到上檔壓力時就賣出，即使如此會產生些微虧損？那些自我導向'
  merge: -1
  img_proc: true
- pgno: 273
  md: '型的投資人會說，「我又不是傻瓜」。他們的自尊與勝負密不可分。虧損時，他們的個性型態是非得責怪他人不可——任何方便的代罪羔羊都可以。還有誰會比經紀人更方便責怪呢？最後所有的責怪，都會來到他們的身上。雖然我們都遇到過不甚傑出的經紀人，但經紀人並不能逼你買賣某支股票。即使真的不勝任，他們也不能逼你非得跟他們來往不可。歸根究底，這總是你的選擇，所以學習為自己的行為負責是很重要的事。如果某些行為具有正面意義，就應該想辦法加強它們；如果它們是負面的，就要想辦法瞭解並改正。請永遠記得確定，是你坐在駕馭座上，而不是你的自我。一九八七年的歷史性崩盤，在邁阿密就出現了一個極端的範例，顯示自我與交易失敗混合之後，可以產生何等強烈的力量：一位蒙受巨額虧損的投資人，槍殺了他的經紀人，然後自殺。


    請承諾自己，永遠不准許任何單一的虧損不成比例地擴大。第一點，請將你的投資組合視為共同基金，只注意其整體報酬。第二點，發誓你永遠不會在沒有止蝕單保護下，持有任何多、空部位的股票。這可使大局不受情緒影響，保證沒有任何單一部位能嚴重傷害到你的投資組合。


    現在讓我們研究一些真實的情況，那是我在《專業軌跡解讀》中曾處理過的案例。雖然回顧很多我曾建議的大贏家行為或許更有趣，但是學習如何處理蹤炸的局面也重要。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '當American Capital Management（ACA，圖6-37）於24處向上突破其最後壓力，而相對強度進入正值區時，我在一九八七年元月份建議買進。所有系統皆透露前進的訊號，但它並沒有走高，反而陷入僵局。對交易員而言，這永遠是個警訊。如果一支股票在突破時沒有強力衝出閘門，交易員就應該立即減碼，在突破點下側約5%處（整數價位之下）緊密設定停止賣單來保護剩餘部位。以ACA案例而言，停止賣點為22.875。所以對交易員而言，其損失是相當小的。當股票未能進入突破水準上方時，即使是投資人也可基於常識而減碼。在這時候，投資人的停止賣單是設定在移動平均下方的22處。因此，股票開始呈現弱勢時，該部位是以9%的虧損結束。如果沒有遵循紀律，則ACA於幾個個月之後在8.25觸及低點時，些微的虧損將演變成65%的災難。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_274_0.png)'
  merge: -1
  img_proc: true
- pgno: 275
  md: '圖6-38顯示另一個失敗的潛在贏家——Rollins Environmental（R E N）。再一次地，我們美妙地處理這個變化球時，並沒有造成太嚴重的問題。最初它於23.5穿越最後壓力時，Rollins出現連續買進的機會。在漲到26之後，它快速地拉回到突破點23.5的下側，此乃交易員以些微虧損離場的好理由。能成為極佳交易對象的股票很少會跌到原始突破點下側。對投資人而言，停止賣單應設定在21.875
    處，因爲先前低點恰在22之上。這也是我在《專業軌跡解讀》中所設定的位置。另外，三十週移動平均位於22處，所以R E N向下突破22時，即是以7%的虧損向該部位說再見的時候了。數週之後，股票崩跌到11.5而出現50%以上的虧損時，出場點看起來反而像獲利點！


    ![](img/63c92c8be10593e716ed1b88e7ce9321_275_0.png)


