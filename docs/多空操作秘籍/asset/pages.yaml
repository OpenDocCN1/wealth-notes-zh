    此後，X Y Z上漲到第一個高峰25（B點），然後回挫到22（C點）（交易員不應注意低於7%的整理，只該處理比較具有意義的波動）。一旦股票止於C點而後反彈到接近先前高點（B點）時，您就應該將停止賣點提升到C點稍下方（21.875）。記住：如果先前低點位於22.125或22時，停止賣點都應該設在整數下方的21.875處。


    在接下來數週，X Y Z又上漲到D點（接近30），然後回挫到E點（25.5）。再一次，X Y Z回升到D點附近時，停止賣點應提升到25.375（E點正下方）。依據同樣方法，停止賣點隨後調升到29.875（G點）。最終，在雙重頂（double
    top）形成之後（峰頂為F與H），你的整個部位在29.875出場，在極短的時間內，即取得了極豐厚之利潤。必須永遠牢記'
