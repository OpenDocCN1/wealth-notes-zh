  md: '但是，成交量並不特別巨大。它僅滿足兩倍的標準，不過該股在接下來數週仍然走高。但在一九八七年四月初，令人興奮的事情開始形成。有關ＢＵＲ的謠言傳開了，該股以令人難以相信的巨大成交量向上突破50處的壓力。如果你之前買了Burlington，這是追加買進的好時機；如果你並未持有它，則這個巨量突破無疑是對你的買進提出了保證。該股在接下來數個月內，就從50躍升到77.5。巨額成交量再度提供了併購者運作的情報。


