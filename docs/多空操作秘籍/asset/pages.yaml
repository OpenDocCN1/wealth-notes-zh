- pgno: 301
  md: '最後應該注意的錯誤是，放空時未設保護性停止買單。絕對不可如此！如果你在紐約或美國證券交易所放空，則應設定一個取消前有效的保護性停止買單。但股票如果屬於店頭市場，則必須確定你的經紀人將它納入其市場監視系統內，當它觸及你的停止買進水準，即應立即回補。


    # ・放空時之戒律摘要


    +   * 不可因為本益比過高而放空。


    +   * 不可因為股票漲幅過高而放空。


    +   * 不可對每個人皆認定它會崩跌的股票放空。


    +   * 不可對成交量薄弱的股票放空。


    +   * 不可對處於第二階段的股票放空。


    +   * 不可對處方強勢類股的個股放空。


    +   * 不可在沒有停止買單保護的情況下放空。


    # ・如何正確執行


    我們現在已知道何者不可爲，接下來讓我們開始學習如何以有紀律而不帶情緒的方法成功地放空。起點是尋找一支過去'
  merge: -1
  img_proc: true
- pgno: 302
  md: '一年大幅上漲的股票。但是，這樣還不夠。許多業餘人士只做到這裡就停了，但你還必須確定放空對象處於第三階段，而且其移動平均已經走緩，如果移動平均開始下降，那就更好了，這一點非常重要。另外，如果該股票處於橫向整理已長達數週，有可能是正在醞釀頭部，屆時將更有利於下跌。最後，可以在移動平均或其下方找出一個明確的水準，一旦該水準遭到破壞，即顯示第四階段的跌勢展開了。


    圖7-13提供了更清楚的說明。只要X Y Z持續走高，而且其移動平均處於上升狀態，你就不應該考慮放空該股。但在移動平均走平而形成頭部（A 點）之後，主要跌勢形成的機率就會變得很高。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_302_0.png)


    圖7-13'
