    第三個重要訊號顯示，一個巨大的上升趨勢正在蘊釀，National Semiconductor在第二階段突破前就出現大幅震盪走勢。該股票於40.5突破D點之前，由接近20處上升到40，漲幅近倍。再一次地，很多人認為在大幅上漲後，股價已經過高，但你對此應有更深入的見解。看看三重確認型態能夠呈現多麼強大的力量——National
