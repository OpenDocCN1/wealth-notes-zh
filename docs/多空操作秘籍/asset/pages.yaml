  md: '圖6-23的Goodyear Tire and Rubber（G T）再度顯示投資人應該如何擺取輕鬆而有紀律的利潤。G T在一九八六年超過35時（A點）應予買進。最初的保護性停止賣點應該設定在29.875處（B點），就在G
    T突破進入第二階段之前的低點稍下方。一旦該股漲到50（C點）而又回挫到接近40處，這便是你準備提高停止賣點的時機。等到G T漲升而遠離其低點後，停止賣點就應該移到39.875（D點）。這個點位於先前明確低點之下方，同時也在三十週移動平均之下側。它也在心理整數價位40下方。在接下來的幾個月，它應該會被依序提高到E、F、G、H、I與J。然後在一九八七年十月大屠殺時，Goodyear向下突破67而進入第四階段。在這個時候，你應該毫無疑問地在66.875出場，讓可觀的利潤落袋。


