- pgno: 334
  md: '雖然市場有時一定會投出若干令人沮喪的變化球，但我們仍應該選擇有紀律、冷靜與有利可圖之途。無論多空，永遠都要以停止單保護你的部位。不論你看到什麼頭條新聞或電視報導，這種做法都能讓你完全保持機械性，而不會受到影響。


    # · 交易員使用停止買單的方法


    交易員設定停止買單的法則恰與多方設定停止賣單的法則顛倒。如同在多方一樣，交易員較投資人更積極使用停止買單。只要整體負面型態不被破壞，投資人都會給放空對象較大的轉圜空間，但交易員只有在股價緊密遵循遊戲計劃時，才願意持有部位。只要該部位開始偏離，那便是出場尋找新空頭部位的時候了。交易員應該視震盪為潛在的反轉，或是橫向盤整之开端，這有可能會長期羈絆資金。猶如做多一樣，交易員不應等待漲勢穿越三十週移動平均後再回補。


    圖7-37告訴你應該如何參與空方的交易遊戲。首先X Y Z股票進入第三階段的橫向整理，遊走於位在60的支撐與位在70的壓力之間。最後它跌破位於60的重要支撐，而在59.875（A點）出現賣出訊號。這是放空該股票的位置。在本例中，最初的停止買點不應採用投資人的做法。和做多一樣，讓交易員的損失達到最小是非常重要的事，所以保護性停止買單應以下列方式設定。如果A點之前的峰位與向下突破的價格水準非常接近，就可直接利用它來設定停止買單。但如果没有很接近的'
