  md: '這裡有一個絕佳範例。雖然道瓊指數在一九八六年底到一九八七年夏天上漲超過600點，但房地產投資信託類股卻表現得令人厭惡（圖3-27）。Lomas & Nettleton
    Mortgage以及許多該類股中之個股在一九八七年的前六個月內，出現相當跌幅（圖3-28），而整體市場卻攀高。雖然古老的基本面陷阱仍在，但它已無法再誘捕到你。本益比很低而且公司很好，它怎麼不漲呢？簡單——因為整個類股表現不佳，而其個股圖形在年初便陷入了危險的第三階段。一旦它向下突破29.5的支撐後，便進入麻煩的第四階段。最後，相對強度線是個大災難。由於這些負面因素，我們便很容易瞭解為甚麼該股下跌超過30%，而道瓊指數卻大幅走高。


