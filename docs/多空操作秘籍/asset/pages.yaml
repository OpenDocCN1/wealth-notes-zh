    5. 圖形中的最後一個重要部份就是相對強度線。只要這條線處於下降趨勢，縱使它在高一低一收盤價格圖中向上突破，也「不要」考慮買進該股。相對強度不佳顯示它與整體市場比較是屬於表現拙劣者。另一方面，如果相對強度線處於上升趨勢，縱使它在價格圖中已向下突破，也不要考慮放空該股。相對強度線的另一個重要應用是觀察它由負値區（零線以下）進入正値區的情況，這是另一個有利訊號。'
