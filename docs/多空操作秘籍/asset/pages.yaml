  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_325_0.png)


    # 圖7-30


    以圖7-30來做說明的話，可看到該股票在頭部區域時，曾觸及價格低點（A點）。在該股尚未跌破A這個低點之前，曾創下最高價位（B點）。以圖中的例子來看，股票的高峰價位在60（B點），而先前低點（A點）爲40，因此你可以得到20點的差值（60減40）。下一個步驟是將原來的低點（A點）扣除20點。40減20等於20點，這個水準便成爲潛在的交易目標。如同在多方的情況一樣，這個測量通常相當精確，只要留意交易底部在這附近所形成的徵兆，通常都會有所收穫。'
