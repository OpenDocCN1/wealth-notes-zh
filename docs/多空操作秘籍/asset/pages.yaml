  md: '該不顧利空消息而繼續持有？你是否應該因為你的經紀人聽到有關該股的利空消息而賣出？X Y Z是否價位過高或快要劇跌？如今回斷，純屬技術性與紀律的範疇。最重要的是，我們讓市場為我們做判斷。因為我們處理趨勢時，市場是最終實體，它的判斷遠較我們衡量所有正反意見的結論更為正確！


    理論方面已經說夠了。接下來讓我們看看實際生活中的範例，如此你在未來才能安於調整你的賣出策略。圖6-22顯示 Skyline Corporation（S K
    Y）在 jednoho 年代初期，走勢開始活絡。它提供我們一個絕佳的例證，告訴投資人應該如何依據我的系統在股價下方設置停止賣點。S K Y在一九七○年尾穿越三十週移動平均進入第二階段時，應該在20出頭的價位買進（B點）。最初，保護性停止賣點應設在突破前整理波低點的下方（A點）。如果多頭走勢失敗，這可使你免於巨額虧損。接下來的數週內，S
    K Y在整理之前先上揚到C點，然後


