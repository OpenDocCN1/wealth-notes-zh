  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_240_0.png)


    # 圖6-20


    你決定再度將保護性停止賣單設定在當時交易價格（D點）下方的10%處，則當股價下跌到29.5時，你又會毫無必要地被迫停損出場（我們假定你在A點停損出場後，再度買進該股），但USX接著又開始了另一波強有力的上漲波。你非但未能在此第二階段強力上升趨勢中攫取報酬，卻在整個圖形震盪下隨波起伏，支付無謂的交易佣金。像這樣可怕的故事太過尋常了，而這也正是少數曾經實驗性地使用停止賣單的投資人，最終急忙捨棄它們的理由。


    只要適當使用保護性停止賣單，它將是非常有益且具有獲利潛力的工具，而這便是你現在所要學習的。首先你要知道，在設定最初停止賣單時，你必須保留一些彈性。有時它在你買進價格下方8%，有時是12%或更多。百分率並非決定因素。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '相反地，先前的支撐水準與三十週移動平均才是兩個重要關鍵。在設定最初的停止賣點時，你必須將注意力集中於前一次盤整的低點，而對於移動平均只需稍加注意即可。如果
    X Y Z 股票成交於18.25至20.25的地帶，當它突破20.375時予以買進，停止賣點就應該設置在重要支撐區的正下方。你可以將停止賣點設在18.125（底部18.25
    的下方）。但在過去幾年，我學到一個對我相當有盍的小訣竅。如果停止點可以設在某個整數的上方，或恰在該整數上，那麼就不妨將它設在該整數的下方。例如，如果停止賣點應該為18.125或18，遞單時不妨將它改為17.875。在市場行為中，心理學常扮演非常重要的角色，這是群眾本能的另一範例。很多投資人喜愛在整數價位買進。如果股票成交於18.5或18.125，買單通常會聚集在18的價位。因此，該水準會相當堅實而且難以貫穿。一旦被穿越，那麼你就知道你的股票真的遭遇麻煩，最好儘快出場。我常常看到在整數上方適當水準的停止賣點，例如18.125，出現以下的狀況：價格觸及該水準後，在整數價位只成交數百股而未被穿越。然後便展開一波新漲勢。另一種稍微比較少見的情況是，這種現象也會發生在0.5的價位上（18.5，19.5等）。所以如果應設停止賣點在18.625時，不妨將其設定在18.5價位的下方18.375處。


    從現在開始請謹記，在沒有保護性停止賣單的情況下，不可持有任何一種股票。只要你買進某股票，請立刻遞出取消前有效的停止賣單。如此一來你將永遠不會處於未受保護的情'
  merge: -1
  img_proc: true
- pgno: 242
  md: '況。譬如在你打開晚報時，發覺一件令人不快的意外，而你因為早設有保護性停止賣單，便可以不需要再緊繃著臉了。同樣重要的是，你必須等到明確計算出你的保護性停止賣點應設在何處之後，才可遞出買單。在養成了這個習慣之後，當你縮減買進候選名單時，可以依此再過濾一次。舉例來說，如果先前我所描述的所有買進準則皆滿足，結果你有三個很好的買進對象，於是接下來你逐一檢查初步停止賣點的水準。如果A股票在20突破，而停止賣點應設定在17.875，那麼下檔風險為11%。B股票突破於40，而停止賣點在33.875，下檔風險為15%。最後，C股票突破於60，但保護性停止賣點的水準在56.875。由於C股票換算為潛在最壞狀況之損失為5%，在其他因素相同的情況下，從報酬／風險之觀點而論，C股票將是最佳選擇。你應該儘量將你的買進對象予以限制，使最初停止買點位在買進價格下方的15%以內，但有時因為圖表型態極為傑出，所以也會有例外出現。


    # 真實世界中的停止賣單


    現在讓我們進入比較實際的內容，如此你才能夠確切知道停止賣點最初應設於何處，以及何時應將它提高到什麼水準。請參考圖6-21，XYZ股票在突破而進入第二階段之前，它處於18.25到20.25的交易區間。你在20.375處買進該股，最初停止賣點則設在整數價位下方17.875處。現在你所需要做的就是坐下來等待。在某些不尋常的情況下，倘若該股向下突破，觸'
  merge: -1
  img_proc: true
- pgno: 243
  md: '及停止賣點，你就可以脫手出場。


    在比較可能且令人高興的情況下，如果你的股票開始走高，那麼以下便是你該做的事。只要你的股票處於上升三十週移動平均之上方，而且移動平均處於第二階段形態的上升趨勢中，你就必須給它較大的迴旋空間。我們會依照下列方式，隨著價格上漲而調整停止賣點。在出現第一次至少8到10%的重大盤整之後，你便可準備提升停止賣點。但在股票整理結束而回升到前次高點（圖6-21的A點）之前，你都還不需真的去改變你的停止賣點。如果向下整理時價格低點（B點）跌破三十週移動平均，那麼這個B點便是投資人準備用來提高其停止賣點的有效價位。但如果整理低點位於上升三十週移動平均之上方，則可以準備將停止賣點設定在移動平均（C點）的下方。當移動平均走高時，可持續將停止賣點調高（E、G、I點）。在本例中第一個盤整低點為21，而移動平均則上升到20處。因此停止賣點應可準備調升到C點19.875（在整數價位20之下）。不過要注意的是，必須等到該股確實彈升而遠離B之低點，並且回升到前次高點A之後，才能將停止賣點調高到19.875。'
  merge: -1
  img_proc: true
- pgno: 244
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_244_0.png)


    # 圖6-21


    接下來，該股在歷經第一次盤整之後，以正常的第二階段行為模式向上攀高。在接近35（D點）的高峰後，拉回到28的水準盤整，然後再走高。在該點，移動平均上升到26。因此，你調升停止賣點時，將它設定在25.875（E點）。再一次強調，必須等到X
    Y Z 彈升到F點，接近前次高點時才能調升停止賣點。下一波挫跌到G點時，恰好止於移動平均之上方32.125處。在下波漲勢進行中，當股價逼近F點時，停止賣點應調升到31.875——再次設定於整數的下方。依據同樣的方法，停止賣點隨後應調升到位於38.875處的I點。在這個時候，最後的低點為40，而移動平均則上升為39.25。'
