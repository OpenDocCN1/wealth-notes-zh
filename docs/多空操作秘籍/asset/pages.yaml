- pgno: 237
  md: '20.125停止——20.375限制的買單，若該股突破20.125時，買單沒有成交，這沒什麼大不了。但在賣出情況下，你手中已持有股票，悠閒晃蕩就不是辦法。如果股票逆轉時，你一定希望確定自己能安然出場。


    如果你是在美國證券交易所（American Stock Exchange）進行操作，就無法使用單純的停止單（stop）。他們只接受停止限制單（stop-limit）。不過美國證券交易所還是順應二十世紀的潮流，做了一些改變。以前停止限制單必須是同一個價位（例如：停止26.875——限制26.875）。如果股價迅速跌破你的賣出價位時，你的單子沒有成交，那麼就只能算是你運氣不好。但現在他們准許價差存在，所以你可以說，例如：賣出
    X Y Z 26.875停止——26限制。因此，如果你遞出的單子價差夠寬，那就不應該會有問題。不過要再度要強調，請確定是以取消前有效的方式遞出賣單。


    至於店頭交易（over-the-counter）股票，買進賣出都會遇到相同的問題。不論是買進或賣出，都不能使用停止單。你必須與你的經紀人就這些股票密切溝通合作，讓他在電腦中進行追蹤。如果突破危險價格水準，你就應該立即以市價予以賣出。這應該不會有什麼問題，因為實際上這就是你要求你的股票經紀人所要做到的事。從現在開始，你要自己下買賣決策。你從經紀人那裡所得到的只是服務。大多數經紀人會樂於遵從，因為你的帳戶會比買進後長期持有的客戶活絡得多。如果'
