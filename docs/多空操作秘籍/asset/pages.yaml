- pgno: 253
  md: 'Wal-Mart的案例或許會使你歷經一些崎嶇、招受一些挫折，但你仍能以兩次不錯的獲利離場。實際上真正能讓你摧心的是喪失全部的豐厚獲利，而以虧損收場。這種經驗是沒有必要去歷經的痛苦。在本書一開始時，我已向你展示了幾個來得簡單、去得容易的範例。IntelogicTrace（I
    T，圖6-26）是另一個符合該情況的個股。但你現在知道如何適當使用停止賣單，而不再陷入那種情境了。Intelogic Trace騰越8.25而出現買進訊號時，很多投資人搶進。不幸的是，不少人在該股大幅上漲時乘勢搭瞙，卻不知道何時該下輔。最後他們喪失了所有的獲利，實際上卻以虧損收場！


