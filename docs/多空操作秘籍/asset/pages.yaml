- pgno: 398
  md: '最後，讓我們檢查一九八七年主要頭部形成時之心理狀態。從相反意見的角度觀察，最爲嚇人的新聞標題，是我在八月末所複印的「道瓊指數3,000點：不是如果，而是何時」（圖8-28）。對一家主要金融雜誌而言，它令人強烈感覺到上漲走勢是唯一的走勢，而這便是重要的訊號。加上我的其他技術指標都在轉弱，這使我採取了非常防禦性的措施，結果幫助《專業軌跡解讀》訂閱者避開了一九八七年的歷史性崩盤。更糟的是，當市場開始滑落時，大衆仍以泰然而非恐慌的心態去對待它。


    從現在開始，要非常留意新聞標題。當這項指標最後發表了意見，而它同時與我們的其他指標一致時，你必須確定自己正確地傾聽到它所傳遞的訊息。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_398_0.png)'
