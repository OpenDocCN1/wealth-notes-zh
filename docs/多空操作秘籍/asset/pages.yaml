  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_252_0.png)


    # 圖6-25


    有時被震盪洗出場並不一定是錯誤的。一旦危險徵兆消失，你還可以用稍高的價位再買進。你可以把喪失的幾點視爲保險成本，猶如你支付保費保護房子免於火災與偷竊一樣。保護你的股票部位免於第四階段毀滅的代價是值得的。在本例中，第一次交易賺取大約七點之後，股票強力翻越25邁向新高點時，你應該再度進場。這次你的新停止賣點應設定在F點，而在接下來幾個月內，可以繼續向上調到G、H、I點，而I點就在35稍下方。然後在一九八七年十月，停止賣點觸及時，你就能第二次以不錯的利潤出場。當股市崩跌時，還有很多人
