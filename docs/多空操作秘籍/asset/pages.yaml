    # 顯微鏡下


    現在讓我們慢慢探索某一支股票經由第一階段底部進入第二階段的過程，如此你才會更明白在何時買進。參閱圖3-5，注意X Y Z是如何在接近8的支撐與12的壓力之間波動。所有的打底行為都發生在靠近三十週移動平均處，該均線已不再劇烈下降，反而開始走緩。唯有股票向上突破其壓力於12處，那才是介入該股的絕佳時機(註6)。


