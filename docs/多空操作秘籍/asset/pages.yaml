- pgno: 83
  md: '(註2)。圖3-1以圖形說明整個過程。A點是新買進的絕佳時機。它是投資人絕佳的介入點。在此關鍵時刻的風險極低，因為底部支撐就在買價下方。同等重要的是，上檔空間遼闊，因為整個第二階段就展現在眼前。唯一的缺點是第二階段堅實動能的凝聚，可能需要花費一些時間。這就像生活中的其他事物一樣，沒有白吃的午餐，所以這是個交換條件。如此你將可取得可觀的報酬／風險率，但你通常也必須付出耐心以作為代價(註3)。對投資人而言，耐心沒什麼了不起，但這可是會逼瘋交易員的。所以，投資人在第二階段初期所做的買進通常遠多於交易員。


