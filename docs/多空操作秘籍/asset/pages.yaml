- pgno: 127
  md: '# 解答


    +   1. C。停止應設於突破處；因為交易熱絡，所以限價應設於突破之上方0.25點處；該委託單應以取消前有效（G T C）為基礎遞出。\n2. 錯。因為它仍處於三十週移動平均之下方。另外，移動平均仍在下降，所以請遠離它。這樣的決策不僅在理論上，而且在實際上也被證明是適宜的。這是clorox的圖形，它於一九七三年在20.5處突破。一年之後，它成交於6處。\n3.
    錯。該年呈現負面的機率很高，如果主要指標轉為空頭，則遠離股票。但還是有多頭的例外，比如一九六五與一九八五年。\n4. A股票是對投資人較佳之買進標的，當時它正突破第一階段長期底部。該圖屬於Swank，在一九七五年突破發生於7.125處。一年之後，它在20附近成交。B股票較適合於交易員。它在盤整前已經上漲300%。該圖形是Apple
    Computer，它在一九八六年突破穿越39處，六個月之後，它漲到80之上！\n5. 錯。取消前有效的委託單即表示——取消前皆有效。所以不要忘記保有紀錄，如果型態出現變化，而且你其後改變主意，不要忘記取消。\n6.
    C。向原始突破點拉回時，是最安全的可能介入點。\n7. 對。'
