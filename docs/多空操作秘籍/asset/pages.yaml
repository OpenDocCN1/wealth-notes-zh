  md: '該處停止下跌）與壓力地帶（漲勢在該處遭遇麻煩）是非常有用的。分析股票時，我雖然會用ＯＸ圖來配合我所有的其他圖形，但絕對不可單獨使用，因為ＯＸ圖並未包含成交量與移動平均的資訊。另外，ＯＸ圖也較難精通。所以在本書中，我將完全採用長條線圖。在適當使用的情況下，長條線圖可以幫助你獲得可觀的利益。


    現在讓我們回到長條線圖分析。我們所處理的時間長短實際上並沒有關係，但為了說明起見，假設我們在談論的是一天的交易（參見圖1-13的日線圖）。如果當天高點是18而低點是16.5，你所要的就是在當天高點（18）與低點（16.5）處，各點上一點，然後畫一條直線把兩點連起來。如果當天收盤於17.5，你就在當天交易價17.5處，畫上一個橫劃。至於成交量，顯示在圖形底部，相應的垂直軸上應該有另外的量度。如果該天的成交量是25,000股，你只要在25,000水準點上一點，然後由該點引一條直線下至成交量度的零線。隔天，高點為18、低點為17，而收盤為17。我們就在時間量度隔一線的右方，以同樣方式再畫出高點18，低點（17）與收


