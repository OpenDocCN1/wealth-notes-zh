- pgno: 405
  md: '在進一步討論之前，讓我們先處理一個你可能準備發問的問題。因爲這項令人興奮的共同基金操作技巧，看起來如此簡單而且具有獲利性，你是否應該忘掉個股而完全採用它呢？我的答案是：對大部份的人而言，不是！個別股票比基金更具有潛力，所以完全忽略前者是一項錯誤。但這必須取決於你的個性與你所能花費在市場的時間。你應該在共同基金的轉換與個股的購買之間做適當的調配。如果你非常熱衷於市場，而且想每週花費幾個小時在其中，則你顯然應該要重視個股更甚於基金。但即使是這類型的投資人，也應該將一部份的資金分派在基金轉換的遊戲中。我尤其建議你將個人退休帳戶（Individual
    Retirement Accounts）及退休基金（Pension Funds），運用於基金轉換，而將比較具有積極性的資金投入個股中。另一方面，如果你沒有可以花費在市場的時間，則你依賴基金的程度超過股票是有道理的。


    剛才所展示的三十週移動平均遭穿越的單純買賣法則，對投資人而言可以運作得相當良好。雖然訊號出現並不頻繁，但它們能夠擷取所有的主要走勢。對交易員而言，則必須採用日線圖與三十天移動平均。這種做法的潛力雖然更大，但必須花費更多的時間與注意力。另外，也會有更頻繁的訊號與波動。基於這個理由，所以你應該仔細思考，究竟自己適合投資還是交易。'
  merge: -1
  img_proc: true
- pgno: 406
  md: '# ・短期基金交易


    圖9-4的Scudder International Fund顯出交易方法可以非常精確。在捕獲了從一九八六年底（A點）到一九八七年五月份的超級漲勢之後，當其每日價格跌破三十天移動平均時，該基金傳出了短期賣出訊號。雖然該賣出訊號隨後的走勢只成為一股震盪，但該次賣出仍鎖定了巨額獲利。而且當股價再度突破，在六月底上漲到了新高點（B點）時，便應該再次買回該基金。第二波漲勢同樣令人感到興奮而且有利可圖，股價一直漲到十月初才出現賣出訊號（C點），而這恰好就在十月崩盤之前。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_406_0.png)'
  merge: -1
  img_proc: true
- pgno: 407
  md: '你要知道在處理基金日線圖時，必須同時注意圖表型態與三十天移動平均，如此才能讓震盪保持在最低的程度。雖然基金跌破其三十天移動平均時，你就應該做交易性的賣出，但唯有它同時穿越其短期均線且突破上檔壓力時，你才能買進基金，就像前述的Scudder在A點與B點的情況。


    下一個問題是幾個基金同時出現買進訊號時，要如何決定該買進哪一個無手續費的共同基金。雖然它們每一個都有可能爲贏家，但如果A基金上漲了15%，而在同一期間，B基金上漲了30%，很顯然你會很希望知道該持有哪一檔基金。當你學會使用一些技巧之後，就很容易判斷出誰可能成爲比賽中的贏家。其實祕訣並不在於取得基金的公開說明書，然後嘗試發掘出基金中的哪些股票看起來較佳，以及該基金投資哪一個領域。首先，這種做法既荒唐又耗時間。再者，基金經理人會迅速變動其投資組合，而你所閱讀的公開說明書非常可能已經過時。因此比較簡單而且更具有成功機率的方法，就是比較不同候選對象在買進訊號出現前六十天到九十天內的相對強度。首先，可檢視由低點到買進訊號出現時，這一段時間內的漲幅百分率。在第一階段底部區域中漲幅最大的基金，其在第二階段幾乎總是能夠領導同類基金。第二個有利的暗示，就是觀察某個基金是否比另一個基金早幾天出現向上突破。率先向上突破的基金通常會呈現出較佳的相對強度。最後，可檢視移動平均之行為。如果某個基金穿越其仍處於下降狀態的移動平均，而第二個基金躍過其已經呈現平坦狀態的移動平均，則第二個基金'
  merge: -1
  img_proc: true
- pgno: 408
  md: '便是較佳的選擇對象。通常，如果上面這三種判斷方式都指向相同的買進候選對象，不要猶豫——買它就對了！另一方面，如果你所得到的是令人混淆的訊號，沒有明確的答案，則所有基金都有可能出現十分類似之績效。


    請不要認爲這個方法是完全爲風險規避者及老古板所設立的。在轉換無手續費共同基金時，只要透過一個有紀律的方法，就能以最小的下檔風險獲取驚人的績效。爲了說明我的意思，請參閱圖9-5，它呈現的是《專業軌跡解讀》在八年內所達成的結果。雖然采用的方法有一點不同（大多數的交易訊號是根據我的類股密度交易指數，而該指數刊登於每一期的《專業軌跡解讀》中），但是你若採用我剛才所教的簡單方法，所得到的結果將會十分接近本表所刊者。請注意在這段時間內，原本的100,000美元最後增值超過五倍而成爲530,000美元！年複利成長率爲23%，顯然勝過銀行所提供5.5%的利率，但即使如此，仍然有很多人將個人退休帳戶的資金存於銀行。'
