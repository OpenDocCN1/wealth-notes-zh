- pgno: 147
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_147_0.png)


    # 圖4-13


    參閱圖4-13（箭頭處），你可以看 到Mansfield圖表服務公司所繪製的相對強度。他們採用複雜的加權公式，但結果還是一樣。如果你發覺R S線比價格表現拙劣，永遠不要買進該股。相反地，如果你看見一個正面的相對強度趨勢，就不要考慮放空它。


    Mansfield公司的相對強度還有一條零線（Zero Line）繪於其中（參閱圖4-13）。在零以上屬長期正向，零以下則是屬長期負向。如果我們的審核明細表中所有正面因素（類股確認、壓力最小、大成交量等）都滿足，同時，其R
    S線由負值進入正值區，則這便是重要的長期優勢，雖然它很少發生。以放空而言（稍後討論），相反者為正確。當所有的放空因素出現時，R S突破到零線以下是重要的負面因素。但是請不要'
  merge: -1
  img_proc: true
- pgno: 148
  md: '認爲，R S線處於零線以下時，你便不能買進該股票；或者，當它處於零線以上，你便不能放空該股票。如果相對強度型態很好且在改善中，而且其他所有因素皆屬正面，那麼就可以進場。如果相對強度處於負値區而且持續不佳，那麼不論其他因素多麼卓越，也絕對不可買進該股。


    現在讓我們觀察現實世界中，有關相對強度行爲之範例。首先，回到圖4-13的Merck（M R K）。當它在一九八五年底突破到60上方時，其相對強度著實起了作用(註9)。事實上，在突破之前，相對強勢已趨高，這是一項正面訊號。然後，在M
    R K突破到60上方之後，它進入了正値區，而且在整個一九八六年與一九八七年上半年，仍繼續走強。Merck的價格上漲爲三倍並不令人訝異，事實上它是在這段期間內的績優股最大贏家之一。


    圖4-14與4-15顯示了相對強度圖形之優點。Adams-Russell（A A R，圖4-14）在一九八六年初時，當它翻越其15處之壓力後，展開了主要突破。成交量令人印象深刻，一旦它翻越到16之上，長期展望顯示上檔已無進一步的供給籌碼。在突破之前，相對強度表現僅爲平平。但就在突破前數週，它開始巧妙地上升。突破發生時，R
    S圖進入零線之上。在符合我們所有的買進標準之下，在未來一年半內，A A R股價呈三級跳並不令人驚訝。


    (註9) 它同時在長期展望圖中創新高，所以上檔無壓力。'
