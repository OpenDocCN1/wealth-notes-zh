    Alpine Group（圖4-15）於一九八六年初向上突破到5.5之上。成交量快速擴增；長期展望沒有壓力存在，而且RS型態很好。雖然在突破前它處於零線之下，但在突破前九十天，RS線已逐漸趨高。當股票翻越到5之上時，RS線進入零線之上——這是相對強度的第二個有利訊號。結果該股票非常規矩地遵循遊戲計劃，在接下來一年半的時間內，股價漲為四倍。'
