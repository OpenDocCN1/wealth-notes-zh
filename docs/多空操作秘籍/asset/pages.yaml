- pgno: 419
  md: '當 IBM 跌破 A 點時，它正處於拙劣的技術型態，因此它成為上檔贏家的機會幾乎等於零。而且在它向下突破 A 點之後的每一天，都有大量的買權成交。因此並不令人訝異的是，絕大多數的選擇權到期時都將變得毫無價值，而大多數的選擇權玩家結果都將處於非常不利的地位。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_419_0.png)


    # 圖9-7


    2. 只買進極具潛力的選擇權。較之於買進股票，你在選擇權方面的抉擇有可能会犯下更多的錯誤。這就是現實，不過這並不意味你不能大有斬獲。事實上，如果嚴格遵循我的方法，你大可以為你的資金賺取較股票本身更高百分率的報酬。但要達成這個目標，你必須承諾自己，只有在具有巨大潛力的'
