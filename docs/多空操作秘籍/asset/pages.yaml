- pgno: 42
  md: '以Amdahl（圖1-20）與Newmont Mining（圖1-21）為例——在一九八六年夏天，《專業軌跡解讀》曾推薦兩者（參閱箭頭）——在向上突破的同時，相對強度線移入正值區，買進大黑馬的機率大大增加。相反地，當價格圖向下突破伴隨著相對強度線移入負值區（零線以下）（參閱圖1-22與1-23），這便是「當心下檔」的情況！此時需明確視其為空頭情況，不論股價從基本面來看多麼便宜。Ocean
    Drilling與Reading & Bates這二支股票，便顯示了會發生什麼事。雖然它們的相對強度線在轉變為負值之前，股價已經有相當的跌幅，可是一旦它們的相對強度線落入負值區時，跟著便又出現了更嚴重的下跌。


