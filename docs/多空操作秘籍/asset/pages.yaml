- pgno: 18
  md: 'TS Industries的基本面更差，它的表現卻更可觀。當我於一九八六年初建議該股票時，其過去十二個月的盈餘為38美分——俏可但不令人興奮。後來，在十五個月後，當其股價上漲200%，其每股盈餘卻下降到9美分。瘋狂嗎？一點也不！一旦你瞭解市場實際的運作，並不像象牙塔式的教科書所說的市場應該如何運作時，你就能明白類似行為是很平常的。在精通我的技巧之後，你不但不會迷惑，反而能夠從這種矛盾中獲取利益。


    我們若檢驗整體市場，就會發現同樣的模式以更大的規模明白的呈現出來。在一九七四年底，道瓊工業股價指數由1050暴跌到570。當時陰沉毀滅的氣氛如此濃厚，你幾乎都快要能觸摸得到。新聞標題極端恐怖（參見圖1-5）。一家主要金融報紙刊出一則重要報導，標題為「世界大恐慌」，而那在當時還算是一則比較正面的報導！更引人注目的是，一家主要的新聞週刊刊出一幅漫畫，畫著一隻大熊撞倒華爾街的樑柱。當時恐懼氣氛彌漫，市場恐將繼續下跌——有可能跌到250~300！在所有的悲觀與恐懼氣氛中，我們的技術指標狂呼「買進」訊號，接下來一個新的多頭市場由此誕生，很快就將道瓊指數帶回1000點之上。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_19_0.png)


    # 圖1-5


    現在你是否得到了一些啟示？這也就是為什麼精明的市場專業者總在利空消息下買進，而在利多消息下賣出。股票在可怕的消息籠罩下形成底部，而在一般大衆狂歡盈餘大幅成長、股票分割，及其他類似消息中形成頭部。因此，典型交易員與投資人會在樂觀的消息中，於高檔買進股票，而在媒體報導恐怖消息下，在低檔大量認賠拋售，這種情況也就不奇怪了。一般大衆一貫的虧損，與真正專業人員一貫的獲利，其原因無關運氣（好運或壞運），而是這兩種人所遵循的遊戲規則不同。這種情況與一個職業撲克玩家明瞭得失機率，拒絕跟進一付順子的牌，而業餘者卻會讓感覺引導他虧損，其間是沒有差異的。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '因此，你的哲學應該很單純：


    +   1. 不可在沒有檢驗線圖的情況下買賣股票。

    2. 不可在好消息公佈時買進股票，尤其是線圖顯示在消息公佈前股價已有相當漲幅。

    3. 不可在股價暴跌時因為股價便宜而買進。在賣壓持續下，你會發覺便宜會變得更便宜。

    4. 不可在線圖的下跌趨勢中買進股票（我會很快地告訴你，如何明確定義下跌趨勢）。

    5. 不可持有處於下跌趨勢的個股，不論它的本益比有多低。幾個星期後，在更低的股價下，你就會發現股價下跌的理由。

    6. 永遠保持一貫。如果在實際完全相同的情況中，你有時買進，有時賣出，那麼你就犯了違反紀律的可怕錯誤。


    所以請瞭解線圖解讀與技術分析並不是神秘的科學。它不是妖術或天文學。它非常單純，只是解讀市場健康狀態的心電圖。你的醫師在為你做診斷之前，會為你拍攝X光、檢定血液、或做EK
    G s檢查。一位勝任的技術分析師，同樣也會對市場進行類似的檢查。他們兩者皆非巫醫（雖然我對部份醫師持保留意見）。讓我們繼續前進，我將帶你進入股票市場的內部。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# · 讓我們以同樣的語言溝通


    在利用圖形開拓你未來的獲利之前，有一些基本術語是你必須熟悉的。圖1-6將幫助你瞭解它們的意義。縱使你過去並不偏好技術分析，你也可能已經聽過或看過這些術語了。但即使如此，或許你還是對它們的確實意義感到有點印象模糊。沒問題，我們只要快速回顧一下，即可達到釐清的目的。縱使你是熟練的技術分析師，也請檢查我是如何定義這些術語，如此我們才能採用相同的方式溝通。這是非常重要的，因為這些術語是我技術分析方法的構成要素，本書將會不斷的使用到它們。所以請花費一、二分鐘瀏覽這些定義，確定每一個名詞的意義。如果你在本章善盡本份，那麼本書將十分易於理解。而且這也有利於你。如果你對某個名詞不是百分之百理解，往後你可隨時參閱本節的內容。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_22_0.png)


    # 圖1-6


    我不依照嚴格的字母順序介紹這些技術分析名詞，因為有些既定的名詞先瞭解之後，你將更能掌握其他某些名詞的意義。首先，請對股票XYZ的圖形（圖1-6）稍做研讀、瀏覽一下，嘗試掌握這個圖形對你的意義。然後，第二回合，一次研讀一個定義，好好思考，只研究圖形中與定義有關的部份。不要貪多，不要企圖一次就把所有的意義記住。這完全沒有必要。對某些人而言，這是一項新語言，但只要你慢慢地研讀本節，它就會開始對你產生意義。在讀了幾章之後，你就會覺得自己是一個技術分析老手。且讓我們開始吧：'
