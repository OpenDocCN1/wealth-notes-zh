  md: '破並不足以觸發E點的停止賣單。Merck在90上方的支撐與接近115的壓力之間整理一段之後，該股票再度向上突破。然後停止賣點應移升到F點。接下來數月，每當整理之後，保護性停止賣點便依序進一步提高到H、I與J點。然後在一九八七年十月份，MRK向下突破190時，終於觸及停止賣點。雖然你沒有爭取到最高價，但已經相當接近，而且在過程中，你的資金變爲三倍，如果你能得到它，這已經是傑作了。


    這個保護獲利與限制虧損的方法非常可觀。它以後將爲你增添無數的市場成功機會。但請不要期望它或是 我所教你 的任何其他技巧完美無缺。沿途永遠都會存在一些失敗與不順利的狀況，而這只不過是生意上的成本。這些瑕疵只是採用極大利潤有紀律方法時，所必須付出的小小代價而已。


    圖6-25的Wal-Mart（WMT）提供了一個偶而出現、不那麼順利的案例。如果你在一九八五年於15附近買進Wal-Mart，你最初應該在A點設停止賣點來保護。在接下來幾個
    月，停止賣點應繼續提高到B、C、D與E點。不幸的是，它於一九八六年底向下突破位於22的支撐。更糟的是，它明確跌破三十週移動平均，而且該均線已不再處於上升狀態。位於21.875的停止賣點觸發時，WMT當然顯示已完成第三階段頭部，開始步入第四階段的挫跌。沒錯，至此你已鎖定不錯的利潤，但在接下來幾個月裡，Wal-Mart重新整理，再度向上突破翻越位於25的壓力。現在來看很明顯，向下突破是假突破，開始新漲勢的機率相當有利。'
