- pgno: 229
  md: '千萬不可落入此誘人的陷阱，認為只要較低的價位買進更多的股票，則股票只需反彈二分之一，你即可解套出場。你應該依據專業人士的行事運作方式操作——向上而非向下攤平。當市場行為開始顯示他們的看法正確時，專業人士會進一步累積持股，而不是當他們被證明為錯誤時才去做這樣的事。他們不會坐在一支問題股票上等待，而是會立刻脫身。學習如何處理虧損局面而使損失達到最小，是成功投資訣竅中最重要者。它是如此重要，所以我在本章稍後會以整節的篇幅來討論這個非常重要的課題。


    向下攤平的人，實際上已脫離獲利的正途。他不僅沒有脫身，反而愈買愈多。縱使股票小幅彈升，他還是會遭遇進一步的麻煩，因為他的心中存有解套的目標價格。當股票漲勢未達此價位，他還是會因為目標而頑固地繼續持有。


    從這幾個少數範例中可以看出來，如果你處於真正的第四階段崩跌中，向下攤平尤其能傷你筋骨。每當你希望股價觸底而做攤平動作時，你只是為投資組合增加更多的持股與更多的虧損而已。結果是你想撥回損失卻變得損失更大。這並不是保守的投資組合工具，實際上它是極度的投機。企圖猜測弱勢股票的底部，猶如用手在大海撈魚。期待是支持繼續持有的愚蠢理由，而且是支持加碼買進更糟的理由！所以你應該學習採用保護性的停止賣單（sell-stop）來鎖定你的獲利，一旦發覺持股陷入麻煩，就立即停損出場。如果遵循這項致勝的紀律，你仍將擁有資本，才能在未來的買進中補回這次的虧損。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 6. 不可因爲市場處於多頭走勢而拒絕賣出。


    雖然強而有力的多頭市場通常能夠彌補你那些不夠明智的判斷，但請千萬不要認爲這是市場問題的萬靈丹。當然，主要上升趨勢可以爲你的第二階段贏家錦上添花，但氣盛的多頭市場同樣也會爲你的問題股下檔提供支撐。這也就是爲什麼華爾街流傳一句古老格言：「不要將腦力與多頭市場混爲一談」。一旦股票嘎的開始出現警訊，不要再考慮——出場就對了。在多頭市場中，某支股票顯現弱勢是大災難來襲的一種警告。McLean
    Industries（圖 6-14）與 Sunbelt Nursery（圖 6-15）便說明了這個論點。雖然道瓊工業股價指數由 1,250 漲到 2,746，McLean
    卻從 15 美元跌到 0.75 美元。同樣地，Sunbelt 由 15.5 跌到 5.5 的同時，道瓊指數卻由 1,500 漲至 2,746。爲整體市場處於多頭而持有這些股票或其他第四階段的災難股，其代價可說是非常昂貴。永遠別落入這個陷阱中。'
  merge: -1
