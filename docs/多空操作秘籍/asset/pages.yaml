  md: '很有趣的是，在 C S C 連續七個月走高、由買進價格38.125 漲到61之後，兩個停止賣價也在相互靠攏。在一九八七年四月底、五月初時，該趨勢線抵達57.50，所以一秉部位應受56.875的停止賣單保護。另一半部位的停止賣點則應設定在54.875，因為就在55之上有良好支撐。到了五月份，兩者皆被觸及而豐厚的獲利也已經鎖定。


    值得注意的是，該股票並未崩跌，它下挫到49.25之後又反彈到55之上。不過此處所需知道的重要事實是，交易員的目的已圓滿達成。在他持有該支股票的六個月裡，它不斷走高，累積了十分優渥的利潤。但在停止賣單遭到觸發後的四個月裡，C
    S C 只比當初賣價稍微高了一點。因為以交易員而言，我們希望持有能夠衝刺的股票，而趨勢線正確顯示給我們旅程何時結束，該是下轎離場的時機。


    圖6-32的Tultex（T T X）是在有意義的趨勢線協助下操作的另一個交易範例。T T X在一九八五年底，它向上突破其下降趨勢線時，應在5.5處買進。從一九八六年初開始（圖6-32的1點），一條重要的趨勢線在接下來三個月裡二次遭觸及（2與3）而逐步形成。股票在接下來四個月又觸及該線二次（4與5）。所以除了使用追蹤性停止賣單外，這條意義重大的趨勢線也應在走勢展開後納入你的交易計劃。當它於13處向下突破趨勢線時，部位的一半應先結清，結果就是在八個月裡獲取了超過130
    %的報酬。然後，位於12.5的前一個整理低點遭'
  merge: -1
  img_proc: true
- pgno: 266
  md: '到破壞時，剩下的部位也應該了結。再一次，該支股票並沒有演變成第四階段的大災難。在趨勢線逆轉的前八個月裡，它不斷攀高。但在跌破後的八個月之後，Tultex甚至還低於你的離場價位1.5點！這個現象意義重大。請仔細傾聽趨勢線所透露的訊息，因為它會告訴你上漲動力退潮的時間，以及多頭汽球何時開始洩氣。


    # · 测量走势


    在結束討論關於交易的章節之前，還有一個鮮為人知的交易技術，可以用來增加你的交易技巧。多年來，很多技術分析人士提出各式各樣的奇怪理論與規則，來預測某支股票的漲跌幅度。相信我，這其中從最單純到最複雜者，我皆有所涉獵。我並不打算拿那些東西來騷擾你，因為根本不值得花費工夫。但是其中仍有一個單純的概念，或許你應該知道，因為它的精確性十分高。將它納入交易工具箱，你就真的可以準備上線了。這個交易測量法稱為擺動法則（swing
    rule）。它不經常出現，可是一旦出現，便能使你真正看透某段漲勢的可能停止點。它通常十分精確，幾乎就像是在今天就能閱讀到下個禮拜的報紙似的！你所要做的只是挑出主要跌勢出現前的高峰價位，扣除接下來的波段低價即可。在圖6-33，X
    Y Z的高峰價位在26處，而低點形成於16處，因此你可算出有10點的差價——26（A點）減去16（B點）等於10點。'
  merge: -1
  img_proc: true
- pgno: 267
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_267_0.png)


    # 圖6-33


    一旦 X Y Z 超越先前高峰26，下一步驟即是將10點加到A點的高峰價格上。所以26加10點等於36。這個水準即成為近期的潛在目標區域。這顯然只是概括的測量。該走勢可能止於35或38，但在接近該區域時，你要留心頭部形成的徵兆。


    Aydin（AYD，圖6-34）在 一九八六年漲到27.625的高峰價位（A點），然後陷入跌勢。在破壞性走勢結束後，該股曾被擠壓到17.5的低點（B點）。AYD在一九八七年初向上突破位於25的壓力。穿越頸線的走勢也完成了頭—肩—底。該股以十分協調的步伐快速前進，穿越一九八六年的高峰價位'
  merge: -1
  img_proc: true
- pgno: 268
  md: '27.625。擺動法則告訴我們有10.125的差値（27.625減去17.5等於10.125）。我們現在可以對A Y D在喪失衝力前能夠漲到多高的水準做出明智的猜測了。只要將10.125點加到27.625的高峰價位，你就會得到37.75的目標。數週之後，Aydin愈來愈接近該水準，形成頭部，然後於33.875處向下突破其上升趨勢線。你認為C點的價位是多少呢？不，它並不是我們所預測的37.75，而是37.5！這個結果不錯吧！所以使用擺動法則的最佳方法是，盡可能在預測價位的附近出脫一部份部位，然後在停止賣點被觸發時，賣出剩餘部份。就本例而言，停止賣點是在33.875處，亦即價位跌破趨勢線之時。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_268_0.png)


    # 圖6-34'
  merge: -1
  img_proc: true
- pgno: 269
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_269_0.png)


    # 圖6-35


    為了顯示AYD並非單一事件，讓我們再研究一下Reebok（圖6-35）的股價行為。一九八六年中，其高峰位價為17.625（A點）。它然後跌到B點，該點是10.25。從17.625扣除10.25得到7.375點。將7.375點加到先前高點17.625，我們就得到25
    的交易目標。而最後該走勢實際上止於25.25（C點）！


    最後，再檢視一下Tiger International（TGR，圖6-36）所展現的行為。它向上穿越6時，在一九八六年年底出現買進訊號。但在此之前，它從一九八五年的高峰價位10.5（A點）跌到3.625（B點）。這相當於是6.875點的差值。為了得到上檔交易預測值，應用擺動法則把6.875加到先前高峰價位'
  merge: -1
  img_proc: true
- pgno: 270
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_270_0.png)


    # 圖6-36


    10.5，就產生了17.375的上檔預測值。令人無法置信的是，該走勢的實際高點恰為17.75（C點），然後T G R又很快地跌落到6之下。


    雖然並非每一個擺動法則的預測值都像這些案例一般完美，但絕大多數股票都能令人訝異地進入目標區。所以當你交易股票而有機會利用到這個令人嘆為觀止的測量儀器時，不妨趁機利用吧！在預測價位附近，至少出脫一部份部位，然後再讓停止賣單帶領你出清剩餘的部位。只要適當使用停止賣單，並結合趨勢線與擺動法則，你便已經準備妥當做出有紀律且有利潤的交易了。'
  merge: -1
