- pgno: 55
  md: '破雖然更具空頭意義，但不要因為成交量不大，就被引誘陷入錯誤的安全感之中！(註1) 無論如何，你都應出脫持股。如果你 的經紀人是基本分析師，他可能會嘗試勸阻你，因為盈餘和其他基本面可能非常好。第四階段開始發展時，傳統的想法會認為這只是股票的盤整，其實這是很荒唐的。一旦股票突破而進入第四階段，上漲潛力就很小（一旦突破發生，XYZ的原始支撐地帶將變成新的上限、或壓力區域），下檔的風險則相當大。


    至此，請稍作停頓並加以反省，然後對自己立下承諾。你發誓永遠不會在第四階段買進股票。同時，你承諾只要個股步入第四階段，就不會再持有該股票。在有關停損的章節裡，我將說明如何使這個最終的承諾變得更簡單。承諾將自動地完成，而且不會在過程中衍生疑慮與矯測。它將會是機械式的而且是有紀律的。


    不要在衝破下跌走勢的粗暴遊戲中被捕。堅毅佇立在第四階段是一種被虐待與代價不菲的遊戲。眼睜睜地看著你辛苦賺來的錢揮霍怠盡，是絕對沒有任何尊貴或灑脫的意義。為了學習這個非常重要的市場課程，你所要做的就是播放肯尼羅傑（Kenny
    Rogers）的歌曲——「賭徒」（The Gambler）。我


    (註1) 尋求放空的對象時，以帶量向下突破的個股較佳，因為成交量大意味賣方十分急切，這種股票的下跌速度也較快。'
