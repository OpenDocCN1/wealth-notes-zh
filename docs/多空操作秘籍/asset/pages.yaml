- pgno: 69
  md: '# A 解答


    +   1. 第四階段。移動平均呈下降趨勢，而且股價處於移動平均之下方。

    2. 第二階段。移動平均呈上升趨勢，而且股價仍安穩地處於移動平均之上方。

    3. 第四階段。移動平均呈下降趨勢，而且股價遠處於移動平均之下方。

    4. 第一階段，移動平均呈水平走勢，而且股價仍在壓力區下方的底部區域。

    5. 第三階段。移動平均漸趨平緩，且在第二階段大幅上漲之後，股價開始來回穿越移動平均。

    6. 第一階段。移動平均呈水平走勢，而且股價仍在壓力區下方的底部區域。凡此皆為第四階段大幅下挫之後所發生的情況。

    7. 第四階段。移動平均呈下降趨勢，而且股價仍處於移動平均之下方。

    8. 第二階段。股票於9處向上突破重要壓力，完成第一階段築底工作。股票現在處於移動平均上升趨勢之上方。

    9. 第三階段。在第二階段大幅上漲之後，移動平均開始走緩而股價來回穿越它。

    10. 第二階段。股價仍處於移動平均上方（一年多來它一直如此），而且移動平均呈上升趨勢。

    11. 第三階段。這個圖形十分詭異，因為潛在的頭部相當廣大（形成已一年）。但是，移動平均基本上呈水平走勢，而且股價來回穿越它。另外，股價仍處於主要支撐之上，所以還沒有進入第四階段。

    12. 第二階段。股價仍遠處於移動平均上升趨勢的上方。'
  merge: -1
  img_proc: true
- pgno: 70
  md: '# ・真實的世界


    現在你已經登堂了，接著讓我們來研究第二階段強力上漲與第四階段大災難的一些實際例證，以說明它並非「理論上有效而實際上無效」。沒有什麼能比事實更真實！雖然沒有任何一種預測市場的方法是絕對正確的，但我們在這裡所看到的結果是如此之好，好到令你難以相信！


    在未來的章節，我將透露如何將狀況未如計劃所產生的負面效果予以極小化。現在請先看圖2-10至2-13的四支股票。它們在進入第二階段時，所有的股票都應該買進，猶如《專業軌跡解讀》所提供的建議（參閱箭頭）——當時它們正突破它們第一階段的底部。


    當Starrett Housing（圖2-10）上漲到10之上時，等於是在一九七五年初完成了重要的第一階段底部。接下來移動平均翻揚，這正是一個節節上漲的例子。該股在未來六個月內上漲到24（相當於年率280%的可觀漲幅）。請注意，六個月內的所有盤整都發生在移動平均上升趨勢的上方。


    當ARA Services（圖2-11）在一九八二年以巨量向上突破30時，它也表現出類似的勝利模式。它在未來九個月漲到55附近，呈現了相當不錯、約等於100%的年獲利率。後續所有的盤整，也都處於移動平均之上方。'
  merge: -1
