- pgno: 341
  md: '# 另一個降低風險的方法


    使用賣出選擇權（put option，簡稱賣權）是以相當小的風險參與跌勢的另一個方法。只要買進賣權，你便有能力在既定日期以前，以某特定價格賣出該股票。因此，如果你以250美元的權利金，買進
    X Y Z 於50的賣權，而 X Y Z 在選擇權到期之前跌到30，這便對你十分有利。你可以在公開市場以30的價格買進股票，再以50的價格賣給當初賣權的原始出售者。這20點的差值價值2000美元，扣減賣權的權利金成本之後即為你的利潤（在本例中為1,750美元，不含手續費）。買進一支你認為即將崩跌股票的賣權，將會帶給你相當於放空的利益。而且這麼做的好處是，你可能蒙受的最大損失將是有限的，也就是當初買進賣權的費用——在本例中為250美元。


    若從負面來看，你購買賣權所支付的權利金，會降低你的獲利潛能。如果在選擇權到期之前，跌勢並未展開，則你終將喪失這筆購買選擇權的成本。對一般市場玩家而言，放空是較佳的戰術。但對於身經百戰的投機客而言，買進賣權則是限制風險的好方法，而且還能增加槓桿的效果（在第九章，我們將詳細討論選擇權）。


    結論是，你應該瞭解第四階段的情況實際上是提供你另一個賺錢的機會，而放空的風險並不會高於買進——只要你遵循幾個重要指標，並且永遠記得要使用保護性停止買單！'
