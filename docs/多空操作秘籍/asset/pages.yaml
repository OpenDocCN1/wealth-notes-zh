  md: '雖然共同基金可提供相當好的承諾，但是也要瞭解它們會對你投出一些變化球。很顯然地，永遠都會有出現震盪訊號的潛在可能————就如同股票一樣。另外要瞭解的一點是，很多基金對於一定期間內所能轉換的次數有所限制。有些基金准許在一年之內做無限次數或相當多次的轉換（前提是你不濫用這項特權而以魯莽剝削的方式進行買賣）。有些基金在特定次數轉換之後，會索取少量的罰款。因此取得你追蹤每一個基金的公開說明書是很重要的，而且一定要熟悉它們的種種規定。建議你只與那些准許合理轉換次數的基金往來即可。


    # ・ 相同遊戲稍作變化


    除了基金轉換遊戲之外，最近又出現另一個選擇對象。當你買進共同基金時，顯然你就等於是投入了一個股票投資組合，而且分散投資於基金經理人當時所偏愛的產業：汽車、化學、科技或是其他。但如果你的技術分析顯示，某一特定產業即將展現傑出之漲勢呢？沒有問題。你現在也可以購買完全投資在某個產業的共同基金。雖然投資於這種狹隘的基金顯然比傳統分散型基金要危險，但其獲利潛能也遠較爲大！有幾家基金目前已經開始提供這種產業基金。這種基金通常會收取低廉的手續費，但只要運用適當，這對獲取良好的績效並不會造成大妨礙。'
  merge: -1
  img_proc: true
- pgno: 412
  md: 雖然不是只有一家共同基金公司提供這種產業基金，但以我的觀點而云，富達基金是這個領域中的佼佼者，而且具有最完整的遊戲計劃。首先，其基金數量很多（最近計算為35種），可供你依據產業做出相當特定的選擇。另外，進入該計劃雖然有2%
    的最初手續費（如果資金是從其旗下基金轉換過來者，則只收取1%）。但這只是一次的費用。只要你將資金保留在它們的產業基金計劃內，譬如由黃金類轉換到科技類（或者，如果你根本不喜歡當時的市況，而轉換到它們的選擇性貨幣市場基金），你都不需要再支付2%的費用。在轉換產業基金時，你只需另外支付25美元的交易費用。對於大筆資金而言，這真是微不足道。還有，它們的基金報價是以小時為基礎。如果你當天稍早看到主要走勢出現，你沒有必要像處理其他基金一樣等待收盤價（該價格可能更高）。這是你個人退休帳戶或退休基金適合參與的良好領域，也適合你一部份的交易資金——尤其是如果你沒有時間檢視個別股票的話。如果你選中一個致勝的產業，例如一九八六年到一九八七年的能源類股，你的報酬將十分美妙。富達選擇性能源基金在一九八六年中於圖9-6的A點出現強烈買進訊號，當時它首度穿越其三十週移動平均。它於10.40美元向上突破壓力時，便展開了第二階段的漲勢。它在接下來十四個月內持續第二階段的多頭上升趨勢，最後就在崩盤前的一九八七年十月初出現了及時的賣出訊號。
