  md: '撐水準底部的下方設下保護性的停止賣單（參閱圖1-6，本例為25.875）。目前，暫時可接受它為好的市場策略。在後面的章節中，我將揭示如何適當的設立停損——投資人知道其如何運作者百不取一，而它正是在股市中致勝的真正秘訣之一。


