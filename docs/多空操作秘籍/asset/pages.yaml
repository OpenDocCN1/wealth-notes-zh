  md: '底，而設定在J點36.125的停止買單被觸發，此時已鎖定了豐厚的利潤。永遠記住：接近整數價位時，要將停止買點設定在其上方（例如，假如漲勢止於J點35.75，停止買點則應設定在36.125處）。最後一個重點是：就和做多一樣，不用理會漲幅不足7%的超賣後反彈（投資人應採用8%至10%的標準）。在3%到4%範圍內的波動不應視爲影響策略的走勢。最後一句忠告（現在說這個你應該已不會感到訝異）：若走勢向上穿越三十週移動平均，即使只是極短暫的時間，此時交易員也絕不可再持有空頭部位。


