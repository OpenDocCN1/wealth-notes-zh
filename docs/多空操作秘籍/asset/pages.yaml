- pgno: 283
  md: '# 第7章


    # 放空：獲利捷徑


    雖然股票市場以長期觀點來看偏上升趨勢，但仍有三分之一的時間是下跌的。這也適用於個別股票。多数投資人認爲下跌階段正是脫離市場、或是拋開某支個股的時刻。在這段期間，他們甘於接受銀行及貨幣市場基金所提供的微薄報酬，然後慢慢等待所謂惡劣市場的結束。


    在這段爲時長久的期間，投資散戶並非唯一束手無策者。他們的經紀人也不會比較好過——他們的局勢甚至可能更危險。他們在空頭市場中，只能依靠推薦挫跌的股票——通常還有一段相當幅度要跌——來填補日子及賺取他們的佣金。


    本章是整本書中最重要的部份之一。它討論有關放空的內容。請以開放的心態仔細閱讀。如果你對放空的概念不熟悉，請參閱第一章有關放空與向下突破的定義。


    我總是感到非常詫異，竟然有那麼多的市場玩家拒絕放空！很多人絲毫不考慮放空。他們將放空一支股票視爲像是將房子地契押在維加斯賭場的輪盤賭局：他們認爲放空極具風險。因此，談到這個話題時，他們的反應會如此負面，那也是'
  merge: -1
  img_proc: true
- pgno: 284
  md: '可以理解的。但這種恐懼並沒有根據，實際上他們喪失了零那間賺取大量金錢的機會。股票下跌的速度高過上漲，這是一項統計事實。所以，如果你學會如何利用跌勢，你將能夠在遊戲中居於領先地位。


    股票下跌遠較其上漲速度為快，原因是恐懼會造成恐慌性反應，貪婪則需一段時間蘊釀。圖7-1與圖7-2這兩個弱勢圖形，是《專業軌跡解讀》所推薦的放空對象。若將負面技術型態與空頭市場混合來看，它們的確明確顯示獲利的成份！


    ![](img/63c92c8be10593e716ed1b88e7ce9321_284_0.png)


    # 圖7-1'
  merge: -1
  img_proc: true
- pgno: 285
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_285_0.png)


    # 圖7-2


    很多人屬於樂觀主義者，要他們從負面局勢中獲利有違他們的天性。但如果你只參與市場的榮面，這猶如駕駛一部只有前進檔的汽車一樣。雖然你用到前進檔的時機比較多，但是在少數情況下，當你需要在障礙面前退後時，沒有退後檔是非常危險的。這道理同樣適用於股票市場。以時間長短而論，多頭市場勝過空頭市場。例如在一九六〇年到一九八七年只有八年的時間屬於空頭市場，但在這些年頭如果出現失誤，你將喪失大部份獲利。若在空頭市場中不懂得利用放空的技巧，將使你的投資組合處於更不利的地位。若想要在空頭市場中進出，其最單純而合乎邏輯的方法，其實與學習在多頭市場中挑選最佳股票買進一樣，要學習在空頭市場中選擇最弱勢的股票放空。'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# 為何放空令人如此畏懼？


    如果你遵循我的法則，相信你可以看出放空所涵蓋的風險不會大於買進。如果是這樣，為什麼有如此多的人拒絕放空，為什麼他們會對這個非常重要而且有利可圖的技巧如此恐懼？以下是這幾年所聽到的一些最尋常的答案。


    很多投資人認為放空非美國式作風。他們相信，我們都應該希望公司運作良好。他們的行為看起來就好像是在為當地的棒球隊或足球隊加油，而他們不希望成為叛徒。因為多數美國人的天性傾向樂觀，而放空通常被視為是負面的消遣。


    我對上述說法的反應很單純。對市場與經濟現況予以瞭解絕對沒有錯。週期循環也是生活的現實，當股票進入下跌的第四階段時，仍繼續持有它與愛國心並沒有關係。同理，股票開始崩跌時，將它賣出避開巨額虧損則是理性的行為，而從跌勢中獲利也同樣合理。


    放空實際上也提供了十分有效的經濟功能。放空會增加股票下檔的流通性，所以某支股票遭到痛擊時，跌勢終究會緩和。畢竟，某人放空 X Y Z 必須在某時點回補。每一筆放空都代表該股票的未來需求。股票下跌時，若放空者必須回補該股票，這種需求實際上還可以緩和跌勢。'
  merge: -1
  img_proc: true
- pgno: 287
  md: '最後，在我所交談過的專業人士中，沒有一個人視放空為不愛國。更重要的是，他們當然也不會迴避去做放空這件事。我這麼說可能有點過於諷刺，但我真的認為，如果一般大衆只懂得美國式作風這一套，而把放空這件事都留給那些專業人士去做，大多數的專業人士一定會很高興的。


    第二個造成很多人迴避放空的標準藉口是，你可能會因此而喪失一切！這種想法（或者可說是沒想清楚的想法）大致會以下列方式展開：如果你在40處買進 X Y Z，可能發生的最差結果莫過於公司破產，該股票最後跌到零。但是如果你放空，則上檔無限。它可以無限上漲。由於無限大會在心理上產生不可測量的假象，因此這種理論上的危險便足以使多數投資人保持在原軌道上。他們捨棄放空的觀念，回歸到他們感覺安全的地方，甚至在空頭市場中，反而買進處於第四階段的股票。


    雖然股票不斷上漲理論上可能，而且在你放空時，就會將你的利潤一筆勾消。但你只要遵循我的方法，上述事件發生的可能性就會降為零。到這裡為止，你已經對我的方法做了充分的閱讀與消化，所以在我告訴你那是什麼之前，很可能你已經知道答案了：是的，就是保護性的停止買單。這個工具可以保證你永遠不會招致無限虧損的可怕命運或蒙受永恆的痛苦。這與我所教你
    的、處於買方立場的方法沒有差別。依照相同的方法，適當地設定保護性停止賣單，可以使你免於持有任何一支由40跌到零的股票。同樣地，一個明智設定的保護性停止買'
  merge: -1
  img_proc: true
- pgno: 288
  md: '單，可以確保當 X Y Z 由40漲到200時，你絕不會放空它！當你學會如何運用這項重要的工具後，你就會很快瞭解，聽從親朋好友要你別從事邪惡的放空行為，這種告誡是完全沒有道理的。你不會失去房子、車子，甚至孩子，猶如很多業餘人士所擔心的那樣。以最糟的情況來看，如果走勢不利於你所持有的部位，你將損失10%到15%。這與你站在多方，而你所買進的某一部位未依計劃發展，使停止賣單遭觸發時所發生的情況並沒有差異。


    一旦學會如何適當看待市場，你將瞭解它只是單純的數字遊戲。X Y Z 股票突破40時，就在第二階段買進，並以設定在26.875的停止賣單保護該部位。如果在第四階段於40處放空
    Z Y X 股票，則以設定在44.125的停止買單加以保護，這兩者絕無差別。在此兩例中，如果該部位失利，你都會蒙受10%的虧損。忘掉那些有關風險無限的謬論。依據我的方法，你絕對不會持有多頭部位直到價格跌到零，也絕不會持有空頭部位直到價格飆到無限大。


    # 放空時常見之錯誤


    在揭示具有獲利潛能與能夠降低風險的正確放空方法之前，這裡有一些極為常見的錯誤，是空方投資人所易觸犯的。'
  merge: -1
  img_proc: true
- pgno: 289
  md: '1. 使用價值高估 (overvaluation) 做爲放空的準則。


    永遠不可以落入陷阱，認爲高本益比即意味你應該放空。我曾在前文中討論過價值高估的主觀性。在考慮放空對象時，它是一個非常模糊的概念，你應該發誓完全捨棄它。以本益比而言，價格看似過高的股票，在接下來數月，它有可能走得更高。像這樣的例子，多到我能以實例填滿本書的每一頁。小型空頭市場開始時，如圖7-3的Data
    General ( D G N ) 在一九八四年初的表現，從基本面來看，它是誘人放空的對象。它以天文數字般的本益比35成交，整體市場看來隨時可能逆轉。但在接下來的八個月，雖然道瓊工業股價指數下跌超過200
    點，但 D G N 卻從30漲升到近60 ! 這支股票處於堅實的第二階段，而你應該已經知道，絕不可以考慮放空一支處於該階段的股票。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_289_0.png)'
  merge: -1
  img_proc: true
- pgno: 290
  md: '非常有趣的是，有很多進入第四階段的股票，其實出訊號出現時，雖然本益比很低，卻仍成為空方真正的大贏家。Wayne-Gossard（圖7-4）在一九七二年底以大約10倍的本益比成交，當向下突破11時出現了賣出訊號。一年之後，股價崩跌到4.5時，本益比就更低了。這個教訓很清楚：基本面高估絕不是發放放空對象的途徑，雖然它是一般市場玩家最常採用的方法。


    ![](img/63c92c8be10593e716ed1b88e7ce9321_290_0.png)


    COURTESY OF MANSFIELD STOCK CHARTS


    # 圖7-4'
  merge: -1
