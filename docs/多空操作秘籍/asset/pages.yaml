  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_72_0.png)


    # 圖2-12


    Telex（圖2-12）也以巨量向上突破10。該股在未來三個月大幅飆漲，呈現出令人難以置信、年率680%的獲利。這並非巧合！再一次地，後續所有的盤整都輕鬆地落在三十週移動平均上升趨勢的上方。


    最後，最近的一個典型例證便是我們在一九八六年底所推薦的Micropolis（圖2-13）。當它以令人印象深刻的大量突破19.5後，出現了一個快速的、年率為250%的獲利機會。這是四個範例中唯一一檔股票由第一階段進入第二階段，卻不是買進時機的例證。Micropolis在一九八六年初突破壓力區10處而進入第二階段時，首度呈現買進時機。然而它後來形成看似第三階段的潛在頭部（在19.5的壓力與大約15的支撐區之間）。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '![](img/63c92c8be10593e716ed1b88e7ce9321_73_0.png)


    # 圖2-13


    但是當它以巨量攀升到19.5之上時，終於出現第二次突破。當此情況發生——相當罕見——表示第三階段的潛在頭部失敗，股票又恢復第二階段。這是一個強有力的排列，對於交易員而言，特別有利可圖。對於長期投資人來說，大多希望在接近底部時買進，但對於交易員來說，這種情況下風險極低，因此可特別留意這種連續性波動，因為這種狀況通常非常強勁而快速！


    現在這裡還有一些股票（參見圖2-14至2-17）。如果你沒有在它們完成第三階段頭部而進入第四階段時予以脫手，最後它們一定會對你的投資組合造成傷害。很高興一提的是，這四支股票在進入第四階段時，我們都曾在《專業軌跡解讀》建議賣出。'
