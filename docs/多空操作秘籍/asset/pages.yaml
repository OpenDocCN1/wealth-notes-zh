    圖7-33


    # ・以停止買單保護空頭部位


    現在你對我接下來要討論的內容，應該已有了很好的概念。這其中並無令人驚訝之處，而僅是將我在第三章所教導各位的停止賣單概念應用在空方。如果將我們在第六章所討論有關停止賣單的每一個論點予以反轉，你就應該已經知道怎麼做了。我將快速講解一個理想範例以及幾個歷史案例，以確定你已完全瞭解。對我而言，這可是放空獲利的真正關鍵。第一，當你放空時，它能帶給你平靜。不要低估心理平靜的重要性；如果你對市場行為感到緊張，你的情緒便常常會超越你閱讀圖表的能力。第二點，如果放空部位的走勢不利於你，這項紀律將可確保你只會有小小損失。最後，一旦你的股票開始崩跌，它可以保證在第四階段不斷前進時，你的獲利也將隨之增加。'
  merge: -1
  img_proc: true
- pgno: 329
  md: '在進一步討論之前，你必須承諾自己，絕對不會在沒有設定以取消前有效爲基礎的保護性停止買單情況下放空。就和做多一樣，在你撥電話給你的經紀人之前，必須先計算停止買點應該設在何處。在挑選優良放空對象時，非常重要的步驟便是在理想放空價位不遠處找出停止買點加以保護。這樣的做法否決了股價可以漲到無限大的可能性，讓這種關於放空的嚇人老調失去作用。如果你的放空對象符合所有其他條件，但保護性停止買單必須設定在放空點上方的30%到40%處，那就去找尋另一支股票吧。依據同樣方法，如果你遇到兩個潛在的放空對象，兩者看起來一樣的孱弱，而且都符合所有其他條件，但其中一支可以用10%的停止買單加以保護，而第二支的停止買點距離放水水準爲20%，那麼就選擇低風險的對象。


    在你放空股票，並設定保護性停止買單之後，還要知道如何在未來數週內調降停止買點，以鎖定愈來愈大的獲利。這非常重要。且讓我們小心地研究這個程序。


    先前高峰價位與三十週移動平均，是你在設定保護性停止買單時所必須注意的兩項關鍵因素。你在設定最初停止買點時，可將注意力多放在先前高峰價位，而少放在移動平均之上。例如，在圖7-34中你可以注意到，在巨幅的第二階段上漲之後，X
    Y Z 股票在60到70地帶橫向整理形成第三階段的頭部。它最後穿越位於60的支撐（C點），並跌破其三十週移動平均，當時該均線也已趨於平坦。這是第四階段的賣出訊號，'
  merge: -1
  img_proc: true
