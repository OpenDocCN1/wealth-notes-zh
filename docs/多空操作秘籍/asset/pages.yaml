- pgno: 420
  md: '絕佳情況下，才去購買買權或賣權。只要嚴格遵守這項紀律，你就可以在遠低於50％正確的比率下，獲取一筆小小的財富。唯有讓你的損失保持在很小的程度，然後讓你買對的買權成為全壘打，這樣到最後才能讓你真正獲利。不要落入陷阱，只因為你覺得一定要採取行動，就和很多其他選擇權玩家一樣場場都下賭注。你的選擇絕對是成功的關鍵！只有在看到最佳的好球時，才需用力揮棒。


    # 3. 在到期之前，給自己一段合理的時間。


    在選擇權市場中想要掌握正確很難；如果是在有限的時間內，那 fwrite = 所以請給自己充裕的時間，確定你只買進在到期之前仍有一段合理期間的選擇權。最理想的狀況是三個月，而絕不可少於45到50天。很多選擇權玩家挑選距離到期日只剩下一個月或更短時間的選擇權，只是因為它比較便宜（亦即權利金中的時間價值很低）。不要再挑便宜貨了。只剩下極短時間就到期的選擇權當然很便宜，但你絕不會因為省下這一點錢而有所斬獲。選擇權是隨時間而逐漸喪失其價值的資產，愈接近到期日，愈沒有價值。因此那種比較便宜的價格一點都不令人驚訝。如果你總是購買那些到期前沒有充裕時間的選擇權，你將來損益表的樣子一定不會太好看。


    # 4. 儘量在接近履約價格處買進選擇權。


    如果可能的話，儘量買進價內（in the money）的選擇權。這是一個難以處理的領'
  merge: -1
  img_proc: true
- pgno: 421
  md: '域。一方面，我們都希望儘可能付出較少的資金，這樣一來萬一錯誤的話，我們的損失會比較小。而這也就是為什麽會有如此多的選擇權玩家去購買價外（out of
    the money）選擇權的原因，因為那就意味著當時的內含價值為負值。如果你購買履約價格為50美元的買權，但其普通股當時成交價為45美元，那麼你的買權就沒有真實的價值。它的溢價是5美元。如果它到期時，普通股仍然為45，你就會損失掉當初購買買權時所支付的所有資金。很多投機客會買進這種位於價外甚遠的買權（與賣權），因為他們可以用非常低廉的價格購買，或許其中之一偶爾會帶來鉅大的報酬。以上述的例子來說，如果普通股起漲，在到期日之前上漲到55，履約價格50美元的買權價格就會至少增加到5美元以上，而相較於當初的買價，那很可能是1,000％的增幅。在這種情況下，當初只要投入10,000美元的投資，很快就會變成100,000美元。市場上總會有這種成功的故事發生，而且非常吸引人。但其成功的機率當然不會很高，至少絕對不會比在拉斯維加斯賭雙零賭局的勝算來得高。因此，我不希望你們去做這種機會渺茫的事，而是希望你們去從事具有一致性的好行動。


    相反地，有些人會採用過度安全的做法，只購買深度價內的選擇權。假設股票目前價格為50，而你以10美元左右的價格購買履約價格為40的買進選擇權，如此一來你必須支付大筆金額，同時也將喪失大幅度的上檔槓桿。另外，報'
