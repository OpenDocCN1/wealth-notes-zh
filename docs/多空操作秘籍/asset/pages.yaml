- pgno: 107
  md: '本階段學習的起始乃是圖形本身。爲達此目的，我們特別瀏覽標準普爾的產業週線圖。這項重要內容在Mansfield圖形服務公司處也有提供。在研究產業圖形時，與個股圖形的唯一差別在於類股圖並未描繪成交量。除此之外，其他一切完全相同，這你可以由圖3-14與圖3-15看出來。


    首先，檢查該類股處於什麼階段。圖3-14顯示，在一九八七年時，化學類股處於上升趨勢第二階段的強力多頭市場，而在同一期間，電力公共事業類股則處於下降趨勢的第四階段。因此，在一九八七年上半年，化學類股中的任何個股，即使其圖形呈現出大空頭走勢，我都不會考慮放空它(註8)。同樣地在一九八七年三月，電力公用事業類股中的任何一支股票，不論其表現多麼優越，我都不會考慮買進它。另一項現實清楚地顯示，如果你處於錯誤的類股中，即使一般股票都在飆升，你仍會很輕易地招致虧損，猶如在一九八七年上半年的狀況。


    (註8) 如果你持有優勢類股中的個股，萬一它跌破支撐而逆轉，你仍應該拋售。但不要放空！'
