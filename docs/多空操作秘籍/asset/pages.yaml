- pgno: 204
  md: '尤有甚者，第一階段的底部非常寬廣。在所有這些多頭訊號之外，大贏家的三個要素皆已齊備。第二階段突破時，成交量絕佳，顯示這個潛在贏家背後十足的推進力。第二，相對強度在零線附近的正值區域遊走。一旦突破發生，它便不再如此。RS線會像一顆子彈由零線中性區迸出。最後，在突破發生前，股價曾經大幅揚升，雖然低股價掩蓋了這個現象。Blocker於突破時，股價由低點0.375處上漲到1.125——這可是200％的巨大漲幅。可預測的趣事這才剛開始，後來Blocker在接下來的十一個月創造了600％的漲幅。


    這些是否只是盲目射中的幾顆砲彈？不可能！雖然這種型態不會每天或每個禮拜都出現，但它們會週期性地形成。當你變得比較擅長閱讀圖表之後，便可挑出這種型態並順勢搭轎——這種機會很多。


    Keystone Consolidated與Philippine Long Distance Telephone（圖5-19與5-20）兩者皆符合大贏家的三個基本要求。結果再度令人嘆為觀止！非常有興趣的是，當Keystone由4.625起漲時，其過去十二個月的每股盈餘是負3.70美元，很多本益比觀察家擔心該公司已步上破產之途。在其躍升到30之後，您認為盈餘改善到何等情況呢？在一九八七年中，股價上漲到30，其前十二個月的累積每股盈餘為負1.16美元。盈餘還是沒有轉正！基本分析與本益比又怎樣！至於底部的行為，它應該能符合我們40％以上的標準，不過如今在圖形中已難以辨認。Mansfield公司所提供圖形的幾個弱點之一是，它採用算術刻度，而非對數或百分率座標。因此當低價股劇漲時，即'
