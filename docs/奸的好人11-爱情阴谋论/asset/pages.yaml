  md: 'Timothy 曾经因这种软性药品的研究而被判入狱，他的著作也曾经被美国政府焚烧。所以美国虽有言论自由，但并非我们想像中般的自由。Timothy 的试验其中最具争议性的不只是用到神奇蘑菇、LSD
