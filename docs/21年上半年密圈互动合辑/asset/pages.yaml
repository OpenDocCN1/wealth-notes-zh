  md: '实在的，正是因为它太直接了，反倒让我聚焦于结果，而忽略了很多细节。


    我应该在他们之间取得一个平衡，以至于到手后剩下的不只是目标达成的片刻愉悦，和长久的虚无感。


    # 二、做每件事，都要力求把事情做到最好


    而有没有做到最好的中药指标，就是有没有做到把自己掏空的感觉


    ——无论是精神上，还是体力上


    就比如，上个月我手机坏了，但是我狠下心来，买了一个承受范围内性能、内存最好的手机。


    在购买前，我也挣扎了很久，害怕浪费钱，心疼自己的存款，因为支撑我购买的理由，仅仅只时——'
  merge: -1
  img_proc: true
- pgno: 489
  md: '我可以很久不用清空微信群聊天记录和文件传输记录。


    但是购买后，不用删除记录、心底知道所有传输的文件，都有一个底稿的感觉，真的特别踏实。


    通过这次精神上的折磨，让我更加坚定了生产力工具一定要足够好的决心。


    又例如，每次发信息前，我都会讲自己的信息重复默念，强迫自己模拟对方看到信息时的场景。


    我这么压榨自己，是因为我明白——工作中的大多数错误和麻烦，都是因为少说了一句话造成的。


    # 三、忽视弱点，聚焦优点


    以前的我，一听到有人议论说我的不是，我就患得患失。'
  merge: -1
  img_proc: true
- pgno: 490
  md: '但在取得一点成绩后，我突然发现以前的自己挺无聊的。


    人人都会有弱点，但这不是关键。


    关键是，我们有没有足够碾压别人的优点。


    当我们的优势足够强时，不论我是高矮肥瘦、不爱社交、为人颐腆，还是内心敏感，这都会成为我的特点。


    所以，问题根本就不在于我的这个“小缺点”，而在于优点不够大。


    就是这样的，普通人的缺点，就叫做缺点；而牛人、有钱人的缺点，叫特点。'
  merge: -1
  img_proc: true
- pgno: 491
  md: '再想明白这个道理后，往后的工作，我会更聚焦于自己、目标、以及实现目标的过程，而不是无聊的议论、担惊受怕的仿徨。


    我相信，人人都懂得许多锦囊、大道理，但是不同的人因为付出的代价不同，理解这些道理的程度也会有所不同，自然就会做出不同程度的决策，得到的结果也会不一样。


    就像人人都知道健康饮食、规律生活的重要性，但是一个二十岁的少年，和一个刚从医院出来的中老年人，对于这八个字的理解肯定会截然不同，行为方式也肯定会表现的不一样。


    后者可能宁愿牺牲工作的时间，也要保证休息，安排合理的运动，但是前者可能连手机、电脑都不愿意放下一刻，这就是不同理解之间的差异。'
  merge: -1
