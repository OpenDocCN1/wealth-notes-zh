  md: '# 04. 罗袖袖


    我理解的与同事气场不合是指相互沟通总是不在一个频道上，话不投机，虽然也没什么矛盾，但就是说不到一块去，互不认可的一种感觉。


    首先，先反思一下自己是否存在偏见，找到不合的原因。若真不合适相处，那就做一个寻常的同事，只谈公不谈私。摆正自己心态，不要带有情绪。记住自己是在工作而不是在交朋友。


    其次，就合作事项梳理其目标、具体工作内容后主动与其沟通。因为不管你与 TA 气场合不合，工作雷打不动，就在那里。你不去处理，也会一直放在那里。与其这样，不如速战速决。'
