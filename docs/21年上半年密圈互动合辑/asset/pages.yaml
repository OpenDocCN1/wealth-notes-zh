    记录以后，就开始寻找关于问题发生的原因和组织行为学是如何解释这类问题和涉及的行为。


    开始去思考，假如我是部门的领导面对现在的管理问题应该如何思考和处理，接着打开百度去搜索类似问题或者在管理类公众号寻找解决方法。


    例如，员工离职率高，离职原因有很多种，聊完以后，带着他们说的离职原因，翻开组织行为的态度和工作满意度的章节。'
