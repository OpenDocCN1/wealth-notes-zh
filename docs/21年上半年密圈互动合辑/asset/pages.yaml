  md: '我本身也会带编程课，我们属于校外教育，更偏向于兴趣班，不是强制性的。所以孩子和家长的认真态度也不会像在学校那么高。我的课每年都会考试，也算是学生自己对自己这学期一个检验，考不好也没啥。考题就是上课讲的例题原题，即便如此也没几个人复习，但今年我发现一个很有意思的现象。


