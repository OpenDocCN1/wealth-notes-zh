  md: '# 02. CKLG


    # 【过年的感悟】


    因出入京的核酸比较麻烦，于是就没有回东北老家。这几天有时间将一些以前买过却没有好好看、好好听的网络课程进行了整理，将其中有价值的音频下载到了电脑上，又看到了豆瓣、B站的一些信息，有了如下感悟：


    +   1. 想要学习新东西，不仅教程很多，素材真是太多太多了。


    +   1.1 从去年底开始想学习作曲、编曲的一些内容，后来再看一些电视剧、电影的时候，就会特别注意其中的配乐，看别人是如何用旋律描摹人物的情绪、情感的。比如电视剧《棋魂》，在主角与好友发生冲突感觉愧疚的时候，是一段很纠结的音乐，当他们后面冰释前嫌，旋律又变得开阔而舒缓。我会一个'
  merge: -1
  img_proc: true
- pgno: 166
  md: '个音阶的感受、体会其中的微妙之处，学习他们随着人物情感发展而转换音乐强度的处理手法，受到了很大的启发。


    1.2 之前有个习惯，喜欢听网上翻唱的歌曲，相同的歌由不同人唱出来，为什么这个好听，那个就差了点意思？我会逐一比较嗓音、节奏、对转换气息的处理方式，慢慢明白，这里确实用虚声要比实声听着好多了，那里转换的手法会给人一种欲说还休的绵绵不断的气势，这种嗓音唱这首歌的时候就是得怎样才能发挥其特色。将一首歌拆解到明白透彻，不仅对歌曲本身有了充分的了解，还学到了很多歌唱的技法、节奏的控制要点。


    1.3 在喜马拉雅上面听到柏邦妮的一个点评影视剧的音频，开始听的时候觉得她口头语“然后”、“那个”太多，本想关掉，试着换了第 3 期——经常请吃饭的漂亮姐姐，一下子被吸引住了，听到结尾有'
  merge: -1
  img_proc: true
- pgno: 167
  md: '种开了窍、豁然开朗的感觉。她提到剧情中 有个地方，男女主角见面，门打开，男伸出手，将女拉进去，这时候停顿了一下，然后门“啪嗒”一下关上了，节奏控制的非常完美。在我看来，这种节奏就是打台球时的走位，控制的好，白球刚好走到合适位置，为下一杆架好了轨道，而此时好像一切都静止下来（停顿），然后刚才被撞击的球又靠着剩下的一点点惯性力，不徐不疾的慢慢滚落进袋，一点都不浪费。如果能把整个音频节目听完吃透，不说能否学会写剧本，至少写书评、影评没有任何问题，看人识人也会提高不少。


