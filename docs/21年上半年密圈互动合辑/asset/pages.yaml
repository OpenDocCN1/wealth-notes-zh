- pgno: 382
  md: '这里“定时活动”是指固定时长的运动，而是每隔 1h~1.5h 时的主动休息，让自己离开工位、离开紧盯的屏幕，放松一下眼睛、做做扩胸运动、接杯水，如果可能的话跳绳几十下。让自己从一种长时间固定的坐姿中抽离出来。毕竟脊椎酸痛背部僵硬，都是这样长时间的固定坐姿导致的。多定时活动，减少发病率。


