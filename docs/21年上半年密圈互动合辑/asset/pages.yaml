  md: '假如，假如这两个选项，过了两三年以后，你分别都后悔了，那会是什么样？你觉得哪个后悔更能忍受一点？


    这个问题后边，我还会跟着另一个提问，那就是——


    假如，你不想让那个特别后悔的后果发生，面对当下这两个选项，你会做点什么？


