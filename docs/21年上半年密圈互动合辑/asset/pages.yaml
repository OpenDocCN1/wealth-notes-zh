- pgno: 33
  md: '# 2020 年，在职场上学到的 3 个道理


    2020 年是极不平凡的一年。这一年，我完成了民企职工到部委公务员的角色转变。今天分享的内容可能和主题内容稍稍有些偏离，但我还是想用几小段文字，开启在曹将知识星球的初次分享之旅。


    # 第一部分：学习方面的 3 个道理


    一是要设立一个目标。关于目标，首先是内生动机，这是根本。有人说，学得了方式方法，学不了内生动机。内生动机是你对某个人或事情的极度渴望。比如你要追求一个女孩，你必定会使出浑身解数，你会赠送礼物、接送上下班、制造惊喜，总之是思维和行为最高水平的集合体，这就是内生动机。其次是具体操作层面，要遵循
    smart 原则，s 具体的：你要考的某个具体岗位/要追的某个女孩；m 可衡量：可以用'
  merge: -1
  img_proc: true
- pgno: 34
  md: '分数或者女孩对你的态度衡量；a 可达到：符合报考标准或在能力范围内的/可与自己各方面匹配的；r 相关的：对你的人生起促进作用/可组成家庭；t 有期限：给自己一个考试期限，考不上就好好工作/追不到就换目标。最后，每天要问一遍自己，自己的目标到底是什么，可以尝试很多种选择，但是需要确定一个切实可行的目标。


    二是讲究方法和效率。方法和效率是方法论的一体两面，好的方法可以促进效率提升，高效率也可以归纳总结成好方法，前者是指导理论，后者是实践成效的衡量指标。每个人的方法都不同，最重要的是适合自己，在这里给大家推荐一个，那就是系统的方法，学习某一项课程，要有系统思维，着眼于全局，比如报考公务员，首先了解公务员考试分为国考和省考，考试历程有笔试-面试-体检-政审等等，考试内容有行测和申论，有的还有专业能力测试，行测又可以细分为常识、数量关系、言语理解、判断推理和资料'
  merge: -1
  img_proc: true
- pgno: 35
  md: '分析等等。同样的，提升效率的做法也有很多种，比如定时番茄钟让自己专注，全身心投入到学习当中。


    三是要坚持到底。任何学习的过程都是一场马拉松，比如考公，考研等等，有坚定的目标，有正确的方法和效率，剩下来的就是坚持。回想我考公的三年间，可谓屡战屡败，却又屡败屡战，但是是一直咬牙坚持到底。尤其是在职备考，在繁重的工作下备考生理和心理都承受着巨大折磨，要给自己打气，鼓励自己一直坚持下去。


    # 第二部分：职场方面的3个道理


    一是对于新人来说，加班有百利。初到一个单位，最重要的是熟悉新环境，适应新角色。适当的加班可以更好地融入工作，你可以学习掌握单位基本情况，比如若干年以来的工作总结和计划，了解单位的过去和未来；可以学习和掌握单位的规章制度，知道哪些能干哪些不能干；可以学习和掌握单位各种硬件'
  merge: -1
  img_proc: true
- pgno: 36
  md: '软件，各类数据和设施，为以后的工作奠定扎实基础。当然，你会觉得很累，但是以我四五年的工作经验来看，短期的累绝对可以换到长期的“闲”。


    二是身在兵位，胸为帅谋。简单点说，要学会从大领导的视角考虑问题，站位高了，你会发现你的心胸，眼界，格局各个方面都会提高。从前你在底层小员工的视角，犹如井底之蛙，加个班觉得累，写个文件觉得苦，当你从大领导的角度统筹摆布整体工作时，你会考虑整个团队的想法、协调各个部门的工作、均衡每个群体的利益等等，长此以往，你的综合素质也在不知不觉中得到跃升。


    三是写作能力极其重要。写作是职场人的必备能力，小到通知和函，大到领导讲话，单位的总结计划，无处不考验着写作能力。很多事情你会感觉说不清楚，更写不清楚，这就是制约你上升的掣肘。写作能力可谓是思维能力、沟通协调能力、执行能力等的'
  merge: -1
  img_proc: true
