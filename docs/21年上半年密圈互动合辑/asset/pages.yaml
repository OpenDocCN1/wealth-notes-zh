- pgno: 240
  md: '我觉得工作也是，当初我们对它充满了美好的幻想，但只有真正投身进去，才发现它并不是我们想象中的样子，于是很容易丧失热情，失去动力。


    但正是这个时候，我们才更需要脚踏实地的做事。 不要想太多，干就完了！


    * 为什么别人都那么斗志昂扬，而我却如此之丧呢？


    其实每个人都有工作积极性降低、动力不足的时候，只有承认了这一点，才能更好的认清现实。


    每个人的节奏不同、兴奋点也不一样，同样一件事有的人是兴奋不已，有的人则惆怅不已，这不足为奇。同时，你眼中的别人，其实并不是对方的全部，他也会有状态不好的时候，所以不要拿对方的好来打压自己。'
