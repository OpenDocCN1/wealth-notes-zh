  md: '第一，千万不要正着数 1、2、3、4、5、6……这是战备状态，数到 10 就冲出去打架了；


    第二，不要按照数字顺序数，这调用不到理智脑，要间隔数：13、11、9、7、5……这样数到 1 就平静了。


    3. 不想干活儿怎么办？给你两颗速效💊，打败职场拖延症


