  img_proc: true
- pgno: 497
  md: '（1）说服他每天上班前查看日计划，并在下班后做好当天工作总结与隔天的工作计划，公司每周周五开会员工汇报工作业绩、交流工作中需要解决的问题、分享提升工作效率的方法或技巧。


    （2）说服他建立资料库、工作常用文档或制图的模板，提升工作效率。


    （3）说服他及时与甲方沟通、反馈项目进展情况及需要甲方配合的事項。


    （4）说服他每周至少锻炼两次、培养自己兴趣爱好，保持身体健康、学会调整工作与生活的压力。


    （5）说服他项目完成后需全文核对、校验后再送审，减少返工或修改导致的工作量增加。


    2. 以周为单位，给自己设立一个小挑战。'
  merge: -1
  img_proc: true
- pgno: 498
  md: '以周为单位，时间短，前一两天难受下，后面就慢慢适应了，偶尔给自己制造难题，也挺有成就感的。这个不仅适用于职场，也适用于生活，举例子：


    挑战 1：下班前需将所有工作资料、办公用品归位，保持桌面整洁。


    挑战 2：每天记录 1 个工作技巧或者职场锦囊，并做分享。


    挑战 3：上班时间除接听与工作相关的电话外，不碰手机。


    挑战 4：每天浏览行业相关信息，并记录自己的思考与评价。


    挑战 5：关于生活，比如不喝奶茶、不吃油炸等高热量食物、每天花 15 分钟整理房间等等，以周为单位，相对比较好做到，就会有成就感。'
  merge: -1
  img_proc: true
- pgno: 499
  md: '3. 在做好本职工作的情况下，需要花时间去了解同行信息、其他新兴行业或者就业方向、投资自己等等，这些是增加收入或者未来转行、跳槽的基础。分享自己近期的一些事例：


    +   (1) 关注整理师行业，学习一些入门课程、相关书籍。

    (2) 与同行的同学、朋友保持连续，关注今年整体的业务方向。

    (3) 学习说服课程，改变自己错误的观念、提升说服能力。

    (4) 坚持瑜伽锻炼。脑力工作者很难将工作和生活分清楚，有时候会觉得压力大、大脑没办法得到休息，在锻炼的 1 小时内通过专注于冥想与锻炼，可以让自己暂时将工作放一旁，得到真正的放松。'
  merge: -1
