  md: '# 07. 春风王锐


    +   1. 想法记录


    这里的想法不是指成熟 Idea，而是我们大脑中不断闪现的思绪：心情不好时会有各种消极的抱怨，工作繁重时会有各种 TODO 和他人安排的工作，阅读时认同的观点和拍案赞赏的金句，思考时的内心触动，还会有我们拖延时充斥内心不想去触碰的恐惧事项、灵感进发时的奇思妙想。如实地记录这些思绪，会清空大脑、减轻压力。


    正如最近在使用的 flomo 的 slogan：重要的是记录，而是更好地思考。我们所需要的就是如实的记录，让想法汇集，汇出思考的轨迹，川流不息。


    +   2. 反思日记'
