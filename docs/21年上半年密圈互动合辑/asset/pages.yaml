- pgno: 1
  md: '# 引言


    「曹将和朋友们」2021 年第 1 期密圈互动：


    “2020 年，在职场上学到的 3 个道理”


    先由小助理星雨，回顾下过去 2020 年学到的东西。


    ——


    今年是褪去新皮的一年，也是有一番酸甜经历，学会了如何修筑自己外部的防御层。


    今年学到的，也是沉淀下来的，作为后续防雷的三个道理：


    +   1. 重要的事情反复确认，且留出等待的机动时间。


    昨天就发生了没有反复确认出现的纰漏，一条微博的文案及图片，涉及到一些关键信息的确认，包括产品卖点信息等。'
  merge: -1
  img_proc: true
- pgno: 2
  md: '因为着急传递给下游对接口的人，又是在群里，对方很精明的避过了再次确认图片，表达意思为“之前确认过的图片不用再次确认”，自己则只发了文案给对方确认。


    这段文案包含了卖点和促销信息两部分，在以为对方确认后，立即传递给了下游，但过了一会，之前确认的却又说不对，她其实只是确认的产品卖点部分，但是促销信息部分却并未确认，并指出这个应该向某人确认。


    以上信息不难看出，即使是“确认”都得是掰开来看，对方的“确认”并不是你以为的“确认”。


    这种时候怎么办？


    自己总结了解决方案：


    +   ①无论对方如何回复，现在群里进行全部素材的第一次和第二次确认，然后再私聊进行第三次最终确认；'
  merge: -1
  img_proc: true
- pgno: 3
  md: '②这点很关键，很多时候对方可能都是没有仔细看的，如果时间还够的话，即使对方确认了，也预留出10-15 分钟的等待缓冲的时间，因为有可能你刚发给另外的人，这头对接人又需要修改了。


    让输出信息的一方多一点时间查阅和反馈，多一点缓冲总是好的。


    # 2. 统一收口后，再进行对外。


    有活动经验的童鞋都很清楚，在执行活动尤其是和外部对接的时候，往往事情都是又多又着急，很多时候对方都是需要你尽快回复，这种时候就是沟通最容易出乱子的时候。


    很有可能大家都是多线程沟通，但是出现了信息差，导致的问题就是对外的信息不是最终内部团队达成一致的。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '自己的角色大都是收口人，但因为出现过对外信息不统一，导致对外承诺前后不一致的尴尬情况。


    所以自己后续都会把对接口的人逐个确认他们对外的信息是什么，以及自己表达这样的对外信息，是否OK，都进行确认后，再进行出口，即使时间紧，也一定要把统一出口信息放在第一位。


    没有把握的信息，一定不能擅自决定和传达。


    3. 把执行的此，做成一套套清单，随取随用。


    自己每天都会有很多流程要走，同时还要兼顾各类同步并行的项目，刚开始的时候比较混乱，因为经验还不能支撑自己多线并举，且不出错。


    但随着熟悉了流程和项目经验的沉淀后，对于纯执行的事情，则进行了清单式的流程梳理，换句话说，如果自己有一天离开了公司，把这个执行流程清单给到另一个人，对方也能清楚的执行整套流程而不出错。'
  merge: -1
  img_proc: true
- pgno: 5
  md: '总结出来的清单包括「联合活动清单」「新品上架准备清单」等等，拿来即用，可以按照清单上的内容去筹备。


    以上三点，其实不算道理，算是细节，但是都是今年最常出现，且总结经验后就没有再出现过，对未来工作十分具有指导性意义的内容。


    也是对自己今年职场工作的一次回顾。


    也期待大家分享自己今年在职场上学到的 3 个道理~'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# 01. 浮生若梦


    2020 年是我职场的第 4 年，学到的三个重要的职场道理总结如下：


    +   1、横向领导力可能比纵向领导力更重要

    2、尝试让领导成为你的“良师益友”

    3、6677 就开干，小步快跑，学中做干中改


    接下来一一阐述：


    1、横向领导力：说人话，就是统筹和整合资源的能力，与人打交道的能力。


    大公司做项目的时候，推动起来往往效率特别低，因为别人没有义务帮你忙，而且可能虽然他是项目参与者，但是项目好不好，不影响他的 KPI，还有可'
  merge: -1
  img_proc: true
- pgno: 7
  md: '能成为“为他人作嫁衣裳”。但是部门有个94年的小妹妹，这项能力特别突出，深受大家的一致好评。


    她主要做到了三点：


    +   ① 平时与大家真诚处关系，遇到谁都特别热忱，她身上有种与谁都自来熟的魔力，而且经常给办公室带吃的，带礼物，有好的事情乐于分享，还特别会生活，积累有很多生活小窍门，所以平时她爱帮别人忙，大家有事也爱找她请教。


    +   ② 特别会向上管理，也特别会赞美别人。她去协调资源，统筹材料的时候，总是特别会借力领导，与同级沟通，则特别会设身处地为对方找利益点，给对方安功劳，找别人帮忙也是会为对方便利考虑，尽量把自己能做的部分做好做完，降低他人帮忙的门槛。'
  merge: -1
  img_proc: true
- pgno: 8
  md: '③办事效率高，结果导向。做事情特别有目标，思路清晰，找人协调事情，三下五除二能说清楚要点，对进度总是心里有数，靠谱。


    # 2、尝试让领导成为你的“良师益友”：


    很多人都没办法和领导“做朋友”，见到领导绕着走的都有很多，但实际上，职场的信任感就来源于更多的“交互”，如果不主动与领导产生“互动”，被“看见”的机会会大大减少。所以不论工作还是日常生活，都可以尽量和领导有「共同话题」，或者多主动请教也行。


    工作上：比如做项目，从立项到执行，及时按节点汇报，让领导放心，做执行时和做复盘时，尽量会让领导参与进来，有“参与感”才会对项目更支持。尽量工作中产生更多的交互，工作成果才更容易被“看见”'
  merge: -1
  img_proc: true
- pgno: 9
  md: '生活上：经常有空一起吃吃饭，或者自己可以平时带些方便分享的小东西，与办公室同事分享，日常生活中的大小事也可以多聊聊，不要见了领导避着走，一和领导聊天就觉得“社恐”。


    3、6677 就开干：


    以前总觉得做一件事就一定要先做好准备再开始做，但是今年遇到很多猝不及防的变化，常常要随机应更改方案和策略。一开始会经常觉得慌张，束手束脚不敢大胆干，经常瞻前顾后想太多，反而把事情越搞越砸。


    后来，看视频的时候，看到一个词叫“ Yes and ”，是一种即兴喜剧，就是不管上一个人台词说的是什么，做了多么出人意料的自由发挥，都要硬着头皮往下接，然后把故事圆下去，很有意思，很受启发。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '然后自己在项目中，遇到变量，尽量先试图让自己稳定下来，用 yes and 的心态应对，问题来了就解决问题，方法错了就换个方法，先应对当下的事情，而不是现在慌张或者自责的情绪里，情绪平稳，人才能冷静，然后才能尽快去找解决方案。学中做，干中改，其实只要方向对了，最终都会把事情做好的


    以上。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# 02. 冰火菠萝油


    职场学到的三个道理，先总结如下：


    +   1、别在职场找妈

    2、以结果为导向

    3、摆脱学生思维


    第一点，别在职场找妈：


    一个工龄 3 年的同事 A，和我一样是产品经理，工作能力尚可。她和产品总监平时关系如同姐妹，一起聊八卦开玩笑点奶茶。唯独会隔一个月变身一次“婴儿”。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '上个月，她预定的会议室因 oa 系统会议预定突发 bug 而取消，到了开会时间才发现，她和研发团队无法准时开会。


    负责会议室预定系统的是另一位产品经理 B，于是她跑过去抱怨，吐槽系统难用有 bug，当然会议也只好延期。B 连连道歉表示也是刚知道有这个偶然性问题研发正在解决了。A
    不依不饶越说越气愤加委屈后来竟然哭了。


    不一会儿，总监刚开完会出来，见此场面，也是无可奈何，安慰 A 半个上午，什么事情都没做。我偶然间只听到一句话 “我不能每次都惯着你这个样子，遇到问题要自己解决……”
    。看来不是第一次这样咯。


    工作中把公司或者团队当成一个 “快乐的大家庭” 本身没有错，工作氛围会很好，效率也很高。但是如果有人因此把自己变成一个 baby，在公司这个'
  merge: -1
  img_proc: true
- pgno: 13
  md: '“大家庭”里边找“妈”，那么问题就出现了——职场婴儿，这在职场里是万万要不得的。


    两个方面，先说工作，再说情绪。


    # 关于工作


    如果你在职场中总是认为同事应该乐于助人解答你的问题，领导应该照顾你的工作量给你指导给你资源，那可能你就要警惕“婴儿化”了。


    想想你自己小的时候，是不是经常抱怨小伙伴不带你玩、不给你好吃的、不跟你分享秘密？有兄弟姐妹的还会抱怨爸妈偏心给他买衣服不给自己买、给他买好吃的不给自己吃？


    工作中同事关系你要自己维护，同样，资源你也要自己争取。而不是像婴儿一样哭闹。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# 关于情绪


    我们常说工作要负责，不仅要对你的本职工作负责，也要对你的职场形象，你的情绪负责。


    今天不高兴了，有压力了，委屈了，生气了，这就是你的情绪。你要对自己的情绪负责，管理好自己的情绪，而不是像小孩一样想发火就发火想哭就哭。


    你惹老板生气了，老板对你大喊对你发火，你会内疚吗？大可不必，这是老板的情绪，老板需要自己负责管理好。同样，你委屈、不满、生气、压力很大的时候，也要记住，这是你的情绪，没有人应该对此负责，也没有人会负责，除了你自己。


    学会对自己职场中的情绪负责，才是更成熟的职场人。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# 第二点，以结果为导向：


    老生常谈的话了，甚至各招聘 jd 中都会出现，但是很多时候我们对这句话的认知并不够


    和我一起仔细回想一下几个画面：


    +   a. 在你即将到 dd1 还没有完成任务时，客户问你进度如何


    +   b. 老板问起上次给你布置的工作怎么样了


    +   c. 团队同事问你你负责的那部分工作什么时候可以完成


    第一种情况，如果你尚未完成，你可能会回复工作过程中哪里遇到了困难还没有解决、因其他高优先级工作耽搁或者因个人原因耽搁等等甚至可能要延期。不过这不是其他人关心的。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '我们说结果导向，更多意味着一种职场思维习惯，有工作任务就要尽快拿出结果，各种原因都不是推脱或者没完成的借口。有困难有问题需要确认或影响进度就要及时沟通或者汇报，和同事交流方案共同解决，请领导帮忙解决高层级问题。我们需要拿出的结果就是按时完成了任务，职场中没有功夫的话就没有任何苦劳，没有人会在意你的过程，每个人的过程都很困难。


    就算是无法按时完成，也要及时沟通明确将在什么时间点完成，这也算是一种结果导向。最怕的就是信息闭塞，也就是下一种情况。


    这种情况就是如果你已经完成却被问起进度情况，这种情况有时更可怕。你已经完成了，但是为什么客户、领导、同事还在问你呢。是你信息没有闭环。工作开始前没有计划好完成时间，工作过程中没有及时沟通进度，工作完成时没有及时沟通汇报，没'
  merge: -1
  img_proc: true
- pgno: 17
  md: '有形成信息闭环。你工作完成了，你的上游在等你汇报以便进一步规划。你的同事在等你完成后开始下一步工作。而你，完成了工作却没有完成信息闭环，这是更大的问题，而很多人可能没有发现。


    所以结果导向，不但是你的工作任务要有结果要完成，你也要形成完整的信息闭环，这才是全面的结果导向。


    # 第三点，摆脱学生思维：


    值得强调的是：学生思维不是指学生才有的思维，是指你的思维仍然像学生而不是一个成熟的职场人。所以你要警惕的是，什么是学生思维？我在此处给大家列举一些平时的积累，当然也欢迎大家互动一起补充完善，共同进步。


    +   1、职场里更加注重每个人的核心能力，没有人会真的站在你的角度上对你好，除非你的核心能力是他'
  merge: -1
  img_proc: true
- pgno: 18
  md: '需要的。要清楚自己的努力方向，趁着年轻多积累自己的核心竞争力


    2、功劳是一个系统性的东西，不是一次性的。谁功劳最大，存在于人们长期以来形成的感知。谁拥有这个领域，谁就拥有最大的功劳。多沉淀、多积累、不浮躁，到你独当一面的时候，你的经历都是你的功劳。


    3、社会本质是价值交换，没有那么多师生情同学情室友情兄弟情，只不过价值交换有时交换的是当下的价值，有时交换的是未来的价值罢了。


    4、不要等到万事俱备才去争取，无论是新项目、新的工作机会、新的岗位，想要就立刻争取，每个人都是边做边学，在实践中迭代改进。学生期间复习好了准备一年再去参加考试的方法，在职场中不适用。'
  merge: -1
  img_proc: true
