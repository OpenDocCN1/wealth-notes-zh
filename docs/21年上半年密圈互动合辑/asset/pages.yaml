- pgno: 329
  md: '人似乎天生会认为 “我是好的” “我是正确的”，且不加训练无法有效快速从对方的话语中提取「有效信息」，那些蒙盖在「有效信息」之上的便是「莫名敌意」——认为对方是为了批评自己，认为万事万物都在给自己找麻烦，不想让自己好过等。


