- pgno: 568
  md: '# 08. 悠意


    实在是忙的分身乏术，怎么控制自己的工作节奏。对于这个问题，首先应该知道自己为什么这么忙，是因为领导要的东西比较急，还是因为自己的工作能力不到位，再或者是因為其他合作部门的同事，不能准时完成任务导致影响了你的工作进度，等等，还有其他很多的原因。


    中医治病，讲究的是对症下药，其实在现在企业的工作过程中，也是一样的，只有明确了问题所在，才能更好的解决问题。


    明确问题之后，就要进行选择和判断，比如领导安排的任务是否真的是领导想要的东西，是否通过自己加班的形式，就可以完成任务，是否只依靠自己就可以完成工作，如果不可以的话，那么自己是否可以找其他的同事帮忙分担一下简单的工作，多人完成，可能整体的完成进度就会快很多，现代社会本身就是一个合作分工'
  merge: -1
  img_proc: true
- pgno: 569
  md: '共赢的社会，相互的帮助，不仅可以更好的完成工作，还可以增进同事关系呢！总之，就是，不同的问题，找到不同的解决方法。自己实在解决不了的问题，也可以向同事们寻求建议和帮助，公司里的前辈经验多，说不定几句话，就令你茅塞顿开了呢！


    最后，度过了这段异常忙碌的日子，有时间就要对本段时间的工作进行复盘，要尽量的复盘到每一个细节，不重不漏，多重维度的对比，吸取经验教训，争取下一次可以避免到类似情况，也为以后的工作提供借鉴，这样，再遇到类似的情况，也不会那么慌张了呢！'
