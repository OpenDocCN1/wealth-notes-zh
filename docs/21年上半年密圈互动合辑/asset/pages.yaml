  md: '在职场，每天面对的工作事情琐碎且复杂，难免无法集中注意力。这个时候，就需要一个能够安静思考的空间。


    这个空间，不是职场工位，可以是公司阅览室或无人会议室，或是家里读书角，在这个地方，要关掉手机、屏蔽干扰，静静地让自己思考一些事情，照亮未来的方向。


