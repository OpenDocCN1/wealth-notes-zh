- pgno: 334
  md: '# 2. 从自己内在因素来看


    # 1）态度不够积极主动


    很多时候作为新人我们的态度会比较保守，比起主动揽活更倾向于先观察，再接受任务。但是这样被动的态度往往让我们会失去很多把自己原有的能力展现出来，承担更大责任的机会。


    # 2）没有做到有意识地发现自己的优势


    我非常幸运，现在的直接上级特别会发现人的优势，并且给予我们机会去放大自己的优势。但是在此之前，其实我对自己的优势是非常模糊的，只觉得自己对人比较敏感，但是要说得更具体，或者说怎么样转化为能力项，我是很懵圈的。


    也是因为不知道自己的优势，所以在完成任务的时候也没有下意识去锻炼加强这个能力，说好听就是'
  merge: -1
  img_proc: true
- pgno: 335
  md: '综合能力比较强，真实一点就是样样行，但更高一点的要求就很吃力了。


    # 3）缺乏目标感和规划能力


    因为缺乏目标，也不知道朝哪个方向去规划，所以在完成工作任务的时候往往是来一个做一个，做完了就不知道下一步该干啥，只能被动等待任务，最后完成的工作任务也是相对零散，很难关联起来形成一张自己的成就网。长期来说很难帮助自己很好地建立自己的职业优势。


    以上就是我对过去一年多的自己总结出来最大的影响自己成长的因素啦～不过非常幸运的是无论外在因素还是内外因素，这半年年来都在往好的方向改变。'
