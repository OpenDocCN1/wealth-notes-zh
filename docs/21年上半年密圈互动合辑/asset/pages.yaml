- pgno: 480
  md: '# 2. 看场合说自己的想法，切入点。


    现在很多时候工作安排借助微信群等，多转换视角去了解现在当下老板的关注点是什么？担忧是什么？以及同事们的反应。然后平时针对性多做一些积累，可以做做时间记录，会记录复盘，这样才能有话说，并且抓住场合说。主动积累很重要！！！


    # 3. 适当表达自己愿意承担责任。


    对公司有价值才会别领导看见和重视，我曾经遇到过平时做事喜欢推的同事，哪怕多做一点都不乐意，其实这非常不利于自己的成长，非常被动式样的学习。一旦有个好的成长机会空出来，也不会有机会轮到。'
  merge: -1
