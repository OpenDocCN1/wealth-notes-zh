- pgno: 403
  md: '# 「曹将和朋友们」2021 年第 9 期密圈互动：


    “职场上你遇到的一个恩人。请分享一个他帮助你的故事”。


    由小助理星雨先开始。


    最近要离职了，恩人就是自己的直接上级，一个典型的老员工，“好人型”的老板。


    +   1. 像老父亲一样。


    老板很像自己的老父亲，印象特别深的是，在自己刚入职的时候，一个人去和其他部门对接一个项目，中间自己沟通上比较软弱，然后被对方压了一头，毕竟对方比自己熟悉公司，很多流程和对接上吃了亏。'
  merge: -1
  img_proc: true
- pgno: 404
  md: '对方是一个男生，老板在群里虽然不吭声，但也看到了我们对话的过程，在群里也只是帮着搭腔。


    但私下老板在某些对话中，听到了我的委屈和一些哭腔，紧接着就拉了一个三个人的小群，“教训”了这个人，用于包括“不准欺负*，你再敢这样，我当面有你好看”……。


    当时虽然在沟通上第一次吃了亏，但是老板护犊子的感觉，还是让自己被暖到了。


    包括到现在，只要自己在群里因为对方火力太猛，或者在会议上，自己的发言被对方压制的不行的时候，领导都会出来直接顶上，有时甚至会用比较硬气的话怼回去。


    除此之外，自己曾调侃我和他很像“老夫老妻”，因为彼此的默契，经历了两轮组织变动，人员架构调整，变得十分合拍。'
  merge: -1
  img_proc: true
- pgno: 405
  md: '同时，中间曾经经历过两次有一个新人build_and 自己搭档成组，但最后都只剩下了自己一个人，曾经有一次和前搭档聊天的时候，自己意外得知，有一个项目的机会，因为只能给一个人，但老板最后选择的是自己，而不是另外一个人。


    机会愿意给，且愿意让我去大胆尝试，做坚强的后盾，这是“老父亲“所带给自己印最深的。


    # 2. 谋定而后动+主动出击相结合。


