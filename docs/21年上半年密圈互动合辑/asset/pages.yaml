- pgno: 322
  md: '对我而言，内部因素更多地来源于「能力陷阱」。


    「能力陷阱」—我们更乐于做那些我们擅长的事，如果一直去做，最终会导致我们就只擅长这些事。


    简单来说，我们呆在「舒适圈」，不愿走出来。


    毕竟走出「舒适圈」，就意味着会有新的挑战。


    挑战意味着失败，而我们最不愿经历失败。


    但往往失败，才是快速成长的助燃剂。


    正如@将哥在《我劝你不要太努力》中提到，


    人生有无限可能。


    是所有人的人生有无限可能。'
