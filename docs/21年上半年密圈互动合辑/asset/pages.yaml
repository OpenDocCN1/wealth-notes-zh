- pgno: 333
  md: '# 04. Emerald


    +   1. 从外在因素来看


    1）入职了一家初创公司，公司的业务变动比较快，所以时不时会遇到手上的工作刚做顺畅，就会被因业务变动原因被动中断，导致经验积累不连续，很多精力花在不断地重新适应。就像玩“掘地求生”，爬到一半的山猿不及防回到快乐老家。


    +   2）直接上级原因。


    进入职场我们不能保证遇到的上级都具备辅导下属，发现下属优势能力。因此对于职场新人来说，如果遇到一个只要结果，不懂辅导的上级，我们的更多时间会花在磕磕碰碰，走弯路上面，在工作计划推进上也会相对迷茫，看不到职业发展进度条。'
