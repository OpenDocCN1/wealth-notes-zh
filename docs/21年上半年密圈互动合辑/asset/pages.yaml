    > 【遇到气场不合的同事，不知道怎么合作，你该怎么办？】


    首先我们来拆解话题的三个关键词：「气场不和」、「同事」、「合作」。


    ① 气场不合：两个人谈不来，无论其中一个人做什么事情，另一个人总是看不顺眼，总是觉得别人做的不对，总想挑他的刺—来源于：百度。


    简单来说：你说 A，我非要说 B，让你不舒服是我的乐趣。


    ② 同事：上级/平级/下级。'
