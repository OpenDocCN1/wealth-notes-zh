- pgno: 347
  md: '一切一切都在打压我自己，情绪不好，压力焦虑，根本没办法正常思考。有些人会教你浑水摸鱼的技巧，有些人Fork我说生活就是如此，让我看开点，多出去玩。


    「失败」情绪下，沉溺娱乐，沉迷让自己开心。这成了我成长的最大的阻碍。


    后来遇到了一些人和事，开始用番茄钟对抗自己，逐渐的增长了一些知识，认识了一些新的朋友。我们一起不断的积累知识和经验，然后相互之间鼓励，慢慢的我从那种情绪中抽身出来。失败不可怕，可怕的是因为失败而放弃。


    我们要正确面对「失败」，打破自己局限，不断成长。'
