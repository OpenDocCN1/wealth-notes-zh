- pgno: 487
  md: '为了升职加薪而去追求升职加薪，一定是说我们认为某种人生幸福或者自身满足，需要这次升职加薪。


    那么，什么是人生幸福？什么是自我满足？又或者是更大的，这个钱能够满足什么人生意义？


    在我们做到上级领导那个位置时，难道这些东西就立即同时获得了嗎？


    他们之间，可能毫无关系。


    只有走远路，走得远，看得远，我们才可能认识自己，知道自己是个怎么样的人，自己能够干些什么样的事，以及明白自己在什么事情里能获得内心的喜乐和满足。


    而近路太直，太快，以至于我们都没有心思往周围多看一眼，如同短跑一样直奔目标而去。'
