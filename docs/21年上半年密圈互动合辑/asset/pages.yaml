    毕竟我们都应该按时、按要求完成上级安排的任务。况且，如果全心全意去追逐这个目标，比如你想完成一个业绩，实现升职加薪的目标，那么它也有很大可能实现。


    但是，然后呢？如果你已经得偿所愿了，那么我们接下来又要做些什么呢？我相信，大多数人并不是'
