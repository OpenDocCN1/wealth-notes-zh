- pgno: 290
  md: '# 07. Eugene


    遇到气场不合的同事怎么办？


    首先建立一个基础认知，遇到气场不合的人是常态，遇到气场合的人是值得感激的，所以不必期待自己遇到的人都是合得来的。


    接下来分场景和类型分析


    第一个角度，分场景分析


    +   1. 气场不合，但是合作几率小。


    比如对方是不同部门的同事，或者同部门不同小组，那么一般在合作之前双方的领导已经达成共识并有权责分工。这时候我们就做好本分，把自己负责的工作尽可能地提高完成度。如果实在需要沟通协调，又觉得很难与对方沟通，那就将情况向上反馈求助，'
  merge: -1
  img_proc: true
- pgno: 291
  md: '在自己的工作完成度高的情况下，求助成功的几率还是比较高的。


    # 2. 气场不合，却要经常合作。


    首先做好铺垫，在开展工作前先寻找共同目标，达成共识，并互相确认双方是否同意该目标。


    在确认目标之后，对合作内容进行分工，确认双方是否同意分工内容，并在有领导的沟通群内主动进行反馈沟通，这一步目的是公开确认，避免工作推进过程中互相扯皮。


    总之原则就是，达成共识，不厌其烦地反馈确认。


    第二个角度，对不同的人的类型分析


    +   1. 虽然对方气场/价值观不合，但也不找茬'
  merge: -1
  img_proc: true
- pgno: 292
  md: '这种情况还算比较好处理，最起码还是想好好做事的，那么大家各自完成自己负责的部分，再交作业根据反馈调整即可。


    # 2. 对方气场不合，甚至沟通不来，很难推进工作。


    这种情况真的很令人头疼。


    和这样的人工作沟通尽量选择公开场合，比如小组聊天群，专项工作沟通群，首先保护自己，减少对方给自己挖坑的机会；第二是对方在不配合工作的情况下，还能寻找领导支持，相信群众的眼睛。


    总的来说，遇到气场不合的同事


    +   第一，不必讨好，做好本分工作


    +   第二，寻找共识，多次确认目标'
