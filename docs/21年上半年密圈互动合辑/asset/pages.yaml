- pgno: 189
  md: '我妈听了后，再次很实诚地跟她说，那早点准备吧，到时候报考机会来了，备考可以轻松点。


    然后我妈回来后，把这件事跟我说了一下。


    我听完后建议我妈，针对那个考普通话二甲难不难的问题，应该跟那个姑娘说很简单的，毕竟我女儿也就努力一个月多点，就一次考出二甲了。


    我妈笑笑，说我有那个姑娘的腔调了。


