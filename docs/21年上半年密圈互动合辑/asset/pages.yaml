- pgno: 46
  md: '候，我和部长开始转变思路，遇到事情就去问领导这个打算怎么安排，那个打算怎么做，后面几天很多临时的改动都完成的很好。


    可能有朋友会说，这个属于沟通问题啊。这个在我看来就是一个干活考虑领导想法的問題，在我们的很多政府单位，就是一把手说了算。我们自己想的再好，再完美，不符合领导的喜好，也是白做。所以在做事情之前，一定要多问，去了解领导想做成的样子，然后开工。我们经常开玩笑说，不要你觉得，也不要我觉得，要领导觉得。符合领导的想法干活，才能把活干的漂漂亮亮。


