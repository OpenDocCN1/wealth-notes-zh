- pgno: 512
  md: '# 「曹将和朋友们」2021 年第 11 期密圈互动：


    “目前影响你职场成长障碍是什么？你准备怎么解决这个问题？”


    由小助理星雨先开始。


    ——


    目前自己最大的职场成长障碍，是关于如何管理。


    背景：自己在新公司，被分配了管理的岗位，对日常运营的指标负责。


    但自己实际的工作经验也才两年，一下交给自己管理 20 个人，压力满满。


