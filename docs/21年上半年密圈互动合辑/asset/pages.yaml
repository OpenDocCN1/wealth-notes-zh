  md: 出版社编辑很欣赏她的作品，想要出版，她觉得还达到不到出版的水平，想要再考虑考虑，过了一年多等她终于动心了，编辑说他们出版社这条线被砍掉了；二是前几个月她一时兴起决定去考研，打鸡血的准备了几个月，等马上考试时才发现这个专业只招收很少几个名额，而她并没有什么优势；三是因为压力，饮食上出了一些问题，精神状态也不是很好。可以说，她虽然很有才华，但是需要一个能为她量身定制周密计划的经纪人一类的人，否则她上面的做法完全就是犹犹豫豫、错失良机、不做计划、任意而为的典型，除非运气超好，否则大概率是会吃亏的。反观B站另一位移居国外的画画播主B，就与之形成鲜明的对比，比如她要参加比赛，会提前一年做计划，比赛需要画多少张作品需要她每个月画多少张、想要得奖需要达到什么水平、她哪些技能还有欠缺该如何练习等等，每天的安排也是井井有条，即便偶尔会因为身体、事情原因而出现偏差，但是总体方向是不会变的。通过
