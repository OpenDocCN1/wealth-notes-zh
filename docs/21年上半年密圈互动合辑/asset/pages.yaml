- pgno: 170
  md: '别人的案例，不必自己再亲历一遍，也一样仿佛走过了无数不同的人生。


    # 3. 从不同领域吸收养分，学会跨界迁移和降维打击。


    3.1 还是 B 站那个在国外的画画播主 B，她非常喜欢看电影，在观看之余还反复研究电影中的画面构图、颜色配置、光影布局，并选取几个精彩镜头，用马克笔画的形式记录下来，用电影的经验来提高画画的水平，在我看来是一种降维打击，电影的内容更丰富更灵动，画画只是一个瞬间的截取，很多地方是一种简化，通过对电影内容的学习，可以把握其中的微妙之处，对于画画的提升有很大的益处。


    3.2 我喜欢搜集图书的封面、版式设计，有些比较熟悉出版社的书，一看封面或是排版，就能猜出是哪家出版社出的，就是因为自身的特征很明显，已经形成了品牌特色。对于一些引进的图书，我还会比较'
