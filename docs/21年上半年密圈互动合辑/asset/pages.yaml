  md: '# 07. 果子


    主题：为了训练我说话艺术，远房姑姑真是操碎了心。


    前几天，我妈去逛超市的时候，遇见一个远房姑姑，问我妈考普通话二甲难吗？


    我妈人很实在，说有点难的，有些人考了三四次，都是差个两三分。然后说我备考的一个半月里在不停地念念念。


    但是没想到，我那个远方姑姑听到「难」后，非常惊讶，说：“不会吧，我的侄女前两年考考很轻松的！”


    接着她告诉我妈，说是她的侄女普通话证书没了，得知要去考试的地方（武汉）打证明，觉得太麻烦，所以想着年后重新考一个吧。'
