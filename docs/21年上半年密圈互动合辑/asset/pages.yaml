- pgno: 38
  md: '# 07. 一株仙草


    好久没来写作业了，在 2021 年第一天正好借这个话题总结一下我上一段职场经历。可能对初入职场的人会有启发，也请各位前辈多多交流呀！


    2020 年对我来说是触底然后逐渐反弹的一年，不魔幻反而很踏实。因为重新找回了对生活的掌控感。我用了四个字概括就是归零、重启。


    我告别了一毕业就进入的那家公司，但是其实是离开了，才给我提供了一种脱离出来的旁观者视角。


    +   1. 工作就是工作，要把它跟生活分得开。学会说不。


    可能这句话说起来很容易，大家也都知道，但是执行起来，却并不简单。人在工作中，常常是身不由己的。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '实际上经常会面临一种尴尬的境地：工作跟生活分不开，尤其是像我的工作是一个服务者角色，必须第一时间回复家长的消息


    以及满足家长的需求。家长们白天上班，甚至晚上还加班，经常会在半夜十一二点给小朋友辅导完作业把他们哄睡了才能安静下来，然后就开始来问他家小朋友近日的表现呀各种问题。而身为负责人，我为了能对每一条消息做到及时回复，经常半夜十一二点还在回电话回微信，甚至一睡醒也是在做同样的事情。


    可能是长此以往习惯了，感觉到工作与我生活交融在一起，然后想抽离都很难。后来发现自己专注力被消耗地厉害，才开始寻求解决办法。比如：强调上班时间段，如早9：30～晚9：30。


    这里其实就涉及另一条小法则：勇敢地说不！上级领导们永远从利益和效益最大化的角度出发，他们'
  merge: -1
  img_proc: true
- pgno: 40
  md: '希望你创造更多价值，所以说：要第一时间回复消息！但是，你不能因为盲目地为了遵循这一句话而将工作与生活混在一起。也许遵循它会使工作业绩短暂地变漂亮，但终不是长久之计。


    2、如果一份工作给你的压抑大于成长和收获，换掉它别犹豫。


    我们经常为了谋生把自己固定在一个地方，进退维谷。不进因为不喜欢，不退因为怕改变。但是很多人说，不喜欢也未必不能做好，也有人说好不容易适应了这个节奏也有不错的薪资了，再坚持一下。然后就这样，一边压抑着一边坚持着。


    但是其实总会有一天得崩溃和爆发，只是如果你最初意识到问题的时候就改变了，也许不只是释放了自己，节省出来的时间早就已经足够你自己脱胎换骨，升职加薪了。'
