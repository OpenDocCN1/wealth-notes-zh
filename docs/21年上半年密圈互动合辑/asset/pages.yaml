  md: '# 「曹操和朋友们」2021 年第 6 期密圈互动：


    > “遇到气场不合的同事，不知道怎么合作，你该怎么办？”


    由小助理星雨先开始。


    遇到气场不合的同事，要分情况。


    气场不合的场景大都是有求于人，毕竟如果主动权掌握在自己手里，大概率对方会顺从你的脾性。


    既然有求于对方，就很有可能是因为观点不和，或者因为对方占主导位置而发生不合。


    +   1. 目标导向


    回到项目目标的原点，进行双方的纠偏。'
  merge: -1
  img_proc: true
- pgno: 252
  md: '举个例子，做一档传播活动，A 希望方向是砸费用，找各大 KOL 尽心宣推，自己则希望费效最大化利用，以转化为关键。


    虽然最后都是为了活动的完成，但是目标上出现了偏差，这时候向对方再次强调并梳理出共同目的是为销售转化，用更直接的量化目标，梳理出这个目标下要做什么，方便对方更好的支持。


    # 2. 借助权力


    有求于人，合作中地位相对弱势，则需要借助上级或者领导的力量。


    向领导表达出自己当前的状态，因此导致项目产生了什么困难，阻碍了当前项目的推进，自己建议是什么。


    这种沟通最好在有领导的群里进行，让领导出面了解当下情况之后，帮助推进后续事宜。'
  merge: -1
  img_proc: true
- pgno: 253
  md: '或者有时候，领导会帮助自己分析另一个人的性格和喜好，会帮助你们进行一个气场的融合。


    # 3. 分工清晰


    把有求于对方的事情表达清楚，且明确内容边界和量化指标，让对方有底。


    比如问别人“能帮我做新 PPT 吗？”，就比不上“能帮我做两页正文的带……的 PPT 吗？”。


    这样，对方才心理更有底。


    # 4. 学会坚强


    自己曾经遇到过，和一位公司资深老员工意见不合的情况，对方气场就是压倒性的强势，导致自己没有办法反抗，或者只能吃亏的状态。'
