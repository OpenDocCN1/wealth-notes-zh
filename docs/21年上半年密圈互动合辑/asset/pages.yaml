  md: '# 「曹将和朋友们」2021 年第 8 期密圈互动：


    > “有哪些花少量时间，却对职场生活造成巨大改变的事情？”


    由小助理星雨先开始。


    +   1. 下班前，花一点时间写工作微博。


    我们公司会强制员工每天下班前，按照要求的模板，进行工作微博的撰写。


    模板包含：工作地点、工作内容，上午工作内容、下午工作内容、明日工作计划。


    虽然看起来简单和有点教条，但是不知不觉做久了，当这套模板嵌入脑海后，对于回顾自己日间工作是十分有效的。'
  merge: -1
  img_proc: true
- pgno: 351
  md: '假如没有公司强制的要求，则可以每天完成一个“轻任务”，简单就只写下自己今天做了什么。有回顾，才不会觉得荒废。


    # 2. 养成爱喝水的习惯。


    之前自己不爱喝水，加上手里工作活儿总是太多，很多时候往往一天就喝一次水。


    但水喝少了皮肤会有反应，加之办公坐久了腰受不了，后面便刻意保持一定的轻运动量。


    合二为一，就把接水当做了补充水分和运动的解决方案。


    也就在最近半年，慢慢养成了接水+拉伸组合的活动，来当做间歇娱乐。


    可以买一个中等大小的杯子，增加自己接水的频率，没水了就走去饮水机接，顺便在排队和去的路上做'
