  md: '无论在工作群里还是在工作时间正常交谈过程中，和领导讲话时一定要过下脑子。一次，在工作群中因为一项事情我和我的两位同事没做好，小领导指出来，我在群里面指出了那件事情存在的客观缺陷因素，没有首先承认自己没有做好。被直系大领导指出建议可以提，但不是事情没有做好的借口。这件事也反思自己讲话有失妥当，在工作群里这样直白提出问题，一是有种反驳小领导的感觉，二是传播了做错事首先找借口的负面影响


