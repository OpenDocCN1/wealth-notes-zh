- pgno: 317
  md: '# 「曹将和朋友们」2021 年第 7 期密圈互动：


    “进入职场后，有哪些因素阻碍你成长？”


    由小助理星雨先开始。


    +   1. 大公司里的小部门，缺少机会见到更大的世界。


    大公司里面的小部门，是很不容易的。


    虽然有背靠大公司背书的好处，但是实质性配置，却是低配版的，远不如其他亲生的部门。


    资源有限、资金有限、人员有限，接触到的活动、项目管理的宽度、见识到的东西也有限制。


    自己在前一年多，具备了符合流程上、沟通上、技能上要求的能力。'
  merge: -1
  img_proc: true
- pgno: 318
  md: '但因为“先天不足”，导致没有办法看到更大的世界，去接触更大的活动、更综合的事务。


    是遗憾，也是自己职场成长的客观限制条件。


    办法一是转岗，二是积累小实力，跳槽到更大世界去发挥。


    2. 向外看、多吸收不足，导致自己“脱水”严重。


    来到了工作完整的第二年，所做的事情开始“轮回”。


    策划的活动、时间节奏、对接的 team 都开始重复上一年的运行规则。


    领导述职对自己的评价，是需要进行创新力的提升，但更多的却是困在当前的流程、对接体系中，开始满足现状、懒于对标。'
  merge: -1
  img_proc: true
- pgno: 319
  md: '这就是所谓的有了套路，没了思路。


    对外，即非本部门、本公司、本行业的相关知识吸收变弱，对外活动、对外沟通机会变少，思路慢慢被局限。


    对于后续活动提案都是换汤不换药，缺少活动新的打法的思考，脱水严重，导致输出雷同。


    办法是借助鲶鱼，一是通过新人给自己带来危机感；二是主动向外，回归职业长期目标，积极积累新知，提升对外沟通频率。


    以上。'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# 01. 阳阳的小事


    回答这个问题前，我们先来拆解下「因素」：外部因素、内部因素。


    ① 外部因素


    对我而言，外部因素更多地来源于「家庭」。


    我来自 18 线的小县城，我的父母职业生涯经历国企上班、下岗、打工、个体户变化。


    故在我毕业之际选择工作时，他们对我最大的期待是「稳定」。


    于是我放弃某家企业（现已是独角兽）邀请，回到家乡省会进入一个央企。'
  merge: -1
  img_proc: true
- pgno: 321
  md: '今年我小孩即将出生，在和太太协商后，我放弃了一个驻外挂职机会。


    很多朋友都替我遗憾：


    +   - 第一个让我失去工资待遇 triple 的机会；

    - 第二个可能让我失去 35 岁前升正科机会。


    但我不后悔。


    因为每个人都有内心坚守的东西，而我一直坚守的就是我的家庭。


    毕竟职场这条路不是走三年，是走三十年，或者更久，不用太纠结一时的选择。


    一直努力前行的职场人从不缺少机会。


    # ② 内部因素'
