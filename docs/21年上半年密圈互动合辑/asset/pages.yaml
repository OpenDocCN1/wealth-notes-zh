- pgno: 482
  md: '# 07. WAYSON


    最近收获的 3 条职场锦囊：


    +   1，接受任务方面，要多想“目的”、多找“方法”、多拿结果。


    # 1）多想目的


    当上级领导交付一项任务时，一定要首先明确他的核心目的：是为了满足客户需求还是为了面对 BOSS 审核？是为了对接资源还是为了开拓客户？是为了锻炼下属还是为了推动合作？等等，想清楚核心目的+次要目的，才能更好入手。


    # 2）多找方法


    可以和上级简单沟通后，确定大致方向，然后准备 3~5 种解决方法，最终提交时以 2~3 种为宜，不然'
  merge: -1
  img_proc: true
- pgno: 483
  md: '多了也容易陷入选择困境。而寻找方法的途径包括但不限于网络搜索、请教同事、寻求亲友援助等。


    # 3）多拿结果


    职场是讲求结果的地方，所以，任何事关结果的事情都有做好多次准备，例如：①结果预判：最差、一般、最好结果；②阶段性结果：前中后期结果；③多方结果：内部、外部、个人、部门等。


    # 2，学会巧妙表达自身诉求


    无论是要资源，还是提薪资，亦或者在开会讨论方案的时候，都需要掌握一些语言技巧，更好地达成目的，比如：


    # 1）先肯定后建议'
  merge: -1
  img_proc: true
- pgno: 484
  md: '说明肯定上级或同事的观点或者意见，明确其中的条件适用范围，最后按照：提出问题-给出解决方法-谦虚的交流态度来结束谈话。


    2）先说难处再给出方案


    先表明自身态度：支持决定，但存在部分客观条件限制；然后给出解决方案，寻求共识。


    3，妥善且谨慎地处理同事关系


    1）平常心看待同事关系


    不需要谨小慎微，更别委曲求全，大家都是打工人，平等交流就可以，也不需要处处防备，友善度 OK 就可以。


    2）尽量避免和同事一起宣泄负能量'
  merge: -1
  img_proc: true
- pgno: 485
  md: '宣泄负能量虽然可能让你更轻松，但实际上对于问题解决无济于事，不要缘木求鱼。


    # 3）敢于表达自身不满


    勇敢拒绝同事的不合理或者过分要求，比如帮忙加班等等。


    总的来说，工作就是一场修行，重要的是不是与谁共事，而是在工作的过程中赚到钱、找到自己的价值所在和热爱所向，其他的有就更好啦。


    我是 Wayson，一个穿梭于职场、社会和生活的自由人。'
  merge: -1
  img_proc: true
- pgno: 486
  md: '回望将近半年的职场生涯，我悟透了一些道理。


    这些道理对今后我的工作有积极的意义，希望对你有所帮助。


    # 一、职场目标的设立，宜大不宜小


