- pgno: 381
  md: '这里的反思日记，不同于日常“工作日报”等流水账形式的记录，而是具有具体的个人思考和改进形式。


    举例：昨天我做得不好的事情是什么？我当时是怎么考虑的？它有哪些不恰当之处？如果我重新来做会有那些改进？之前学习了 XX 方法，为什么没有用到这件事情上呢？能否坚持每天按照新的标准，对照我的行为进行改进？


    反思日记的 3 个作用：


    +   - （1）发现知识误区；

    - （2）促进已有知识产生新知识；

    - （3）检验学习的新知识是否用了起来。


    # 3. 定时活动'
