- pgno: 310
  md: '# （4）分配工作职责


    展现个人能力与优势，按个人情况安排工作任务与相关职责。


    # （5）执行并设立沟通节点


    各自拿到工作任务后，在执行过程为保证双方的信息同步与检测，还需设定沟通节点，定时对接工作与信息。


    # （6）评判标准与人员


    遇到矛盾，双方争执不下，就拿出最开始设定的工作目标与评判标准对比，谁的方案更优；标准对比不出或者仍有争执，需求可评判的人员（领导）进行最终决策。'
