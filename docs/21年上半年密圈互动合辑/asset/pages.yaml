  md: '# 引言


    「曹将和朋友们」2021年第2期密圈互动：


    > “跨部门沟通时，你踩过哪些坑？有哪些技巧？”


    先由小助理星雨，分享下自己的经历。


    自己的工作职责是整合营销，所以跨部门的合作每天都在发生，从最初的碰壁到现在的调度有序，走过一些坑，但也磨练出一些经验，可以分享给大家。


    +   1. 学会利用自己的“双面角色”进行事务的推进。


    整合人最痛苦的地方，就是受“夹板气”。


    自己遇到过的分两种情况。第一种，是大家都一起在一个环境下，上下游的两方如果立场不一致，会产生'
  merge: -1
  img_proc: true
- pgno: 87
  md: '口角，最终导致讨论或者会议没有结果，最后作为中间人的我很蒙。


    还有一种情况是，上游的两方保持都各自的孤傲，在不见面的情况下，仅通过你来沟通，双方站在各自的立场上，都会不同意你做的一些事情，分歧最终向你汇聚，最终就会被夹板给“夹”得死死的。


    第一种情况，解决方案是求助老板。


    核心想谈一下第二种情况的解决方案，那就是“借力打力”。


    假如 A 不同意自己提出的某些内容，那就借助 B，向 A 表达 B 已经认可了的意思，不建议再修改；换过来，假如 B 不同意自己的一些内容，可以把 A 拿出来，就说这已经是
    A 指定的内容了。'
  merge: -1
  img_proc: true
- pgno: 88
  md: '由此可见，当没有办法让自己协同的所有部门都快速达成一致时，借助一个相对权威部门的认可，来压制其他部门部分的反对声，效果是不错的。


    # 2. 多见面，所利用物理位置的优势。


    在这一点上，自己吃了巨亏，自己所协同的部门总计有 3-4 个，每一个部门互相都不在一个物理位置上，这里指的不是办公区，而是不同的办公楼。


    微信的聊天当然不影响事物的推进，但每天见面的人，如果可以聊点八卦、分享个小零食、吃个午饭，非正式的沟通会让正式的沟通不那么生硬。


    跨部门沟通先是要破冰，接着除了工作上的交集，要学会增加一些非正式的场景，比如一起加班、开会等等。


    # 3. 区分清楚哪些需要私聊，哪些需要在微信群沟通解决。'
  merge: -1
  img_proc: true
- pgno: 89
  md: '群是个好东西，无形之间会给人以压力，让你暴露在领导面前，沟通也会更加正式。


    但有些时候，有些事情是需要私聊的，比如资源的沟通、各部门自己独有的事务等等。


    但有些时候，又是必须要在群里聊的，群里聊有几种目的：1. 让领导们看见事情在推动的过程中；2. 增加沟通对象对事情的重视度；3. 让所有协同的部门，都能收到统一的推进信息，从而形成推动项目达成的合力。


    总之，如果一个项目涉及部门过多，且信息是需要同步让各部门知晓，那一定要在群里说，即使是为了后续给自己不背锅找证据，也是好的。


    以上。


    是自己的分享。


    也期待其他星友们的沟通经验分享。'
