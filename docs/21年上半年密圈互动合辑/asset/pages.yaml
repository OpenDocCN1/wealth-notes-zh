  md: '# 09. TESTHS


    在说我的职场经历带给我的 3 个道理前，我觉得有必要先说下我们单位的性质。我们单位是一家有着政府背景的可以开展培训活动的事业单位。所以我在今年收获的一些道理可能没有那么具备普遍性。


    # # 干活要随东


    在我们单位干活，我的部长经常和我说的一句话就是。干活不随东，累死也无功。做任何事情，要符合领导所安排，符合领导所想，不然干了也是白干。


    这个感想在前端时间尤为强烈，前端时间我们承办了一个培训活动。时间紧，任务重。在接到领导安排后，我和部长两个人先把能做的都做了，之后开始到领导那汇报已经完成的事情。结果很多细节的处理领导不满意，这个时候领导开始说这个那个怎么怎么么做，于是很多活我们又重新返工。等会议开始的时'
  merge: -1
