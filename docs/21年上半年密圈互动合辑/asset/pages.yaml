    记得今年元宵过后没多久就是三八节，总务部的同事来找我商讨这次活动的举办，和礼物的挑选。由于两个节日子离得很近，上一次元宵节活动我一起沟通、搭建舞台、摄影花了很长时间，这点经理看在眼里，这次三八活动又要开始筹办，又要花很多时间，而营销的同事又在催我们的产品样本要赶紧做出，因为之前和市场部沟通，知道样本的排版还需滞后，所以我就把这件事放在后面处理。看我又开始忙活活动的事情，经理私下找了我谈话，告诉我事情是要有轻重缓急的，工作上的事情要优先处理，自己工作上
    KPI 的输出和成长才是最重要的，要有效输出，不能每个人都帮，经理分享了说，如果飞机遇到异常天气，语音播报会让旁边有小孩的大人，先自己戴上口罩，再给孩子戴上口罩，你保证不了自己的存活，你是没有能力去救别人的。经理分享的故事让我顿时意识'
