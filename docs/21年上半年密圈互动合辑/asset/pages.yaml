- pgno: 544
  md: '# 02. 余小漫


    哈啰，大家好，我是小漫。


    我之前工作忙的时候，非常焦虑，做事也是杂乱无章。


    最开始公司给我安排的话，有写文章一配图一排版一发布其他平台；写朋友圈文案；以及统计一些转发的数据。


    我当时没有轻重缓急的排序，觉得什么简单先做什么，每篇文章要配的图也是乱七八糟堆放在同一个文件夹。


    后来当同事来向我要完成的工作，才发现我最重要的事情才开始准备做。'
  merge: -1
  img_proc: true
- pgno: 545
  md: '后来，我开始先给所有事情划分了一下【轻重缓急】


    重要且紧急: 写文——同事审核——排版——配图 ——发送


    重要不紧急: 写朋友圈文案


    不重要不紧急: 统计转发数据


    紧急但不重要: 突如其来的任务


    列清楚以后，我又优化了一下配文的相关流程，将图片分门别类地保存，节省自己反复查找首图尾图的时间。


    不仅如此，排版的流程我也进行了优化。先全文选择好字体，再配上标题的序号，接着重点标注，最后配图。'
  merge: -1
  img_proc: true
- pgno: 546
  md: '经过这一系列动作，我又对自己写文时长进行计时，忙得很有头绪。哪怕同事问我进展，也能明确告知还需要多长时间。


    当我忙的分身乏术，实在也无法完成任务时，我会主动向上交代手上已有的任务。


    让带我的人，给我砍掉一些任务，或者宽限一些时间，让我最终可以顺利完成任务。


    以上就是我的心得体会啦。希望对大家有帮助。'
  merge: -1
