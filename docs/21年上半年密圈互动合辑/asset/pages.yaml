  img_proc: true
- pgno: 522
  md: '为了破除这个障碍，努力使自己成长，我去看讲管理的书和文章，去加入讲管理的社群。


    我认真思考了在我现在的工作环境下，如何更好的开展工作，想到了如下方法：


    # 【方法一】：提高自身在专业知识的权威性。


    工作中我面对的除了跟我一样的经验少、年纪轻的新员工，更多的是学历虽然不高，但工作经验极其丰富的老工人，他们表面上对你是尊敬的，但是内心并不认同，因为你还没人家懂得多，凭什么来指指点点？


    所以，工作之余，多学习专业知识，向本部门的老员工学习，通过网上视频学习，慢慢的就可以在施工中提出一些切中要害的问题，施工单位的人也会愿意去听你的话，整改善现场的问题。'
  merge: -1
  img_proc: true
- pgno: 523
  md: '# 【方法二】：学习沟通的技巧。


    即便有再丰富的施工经验，如果上来就咋咋遛人，任你说的再对，工人也不会给你好脸色。


    学习一些沟通表达技巧，嘴上甜一些，该叫哥叫哥，该叫师傅叫师傅，只要能推动工作按照自己的目标进行，那就是好的。


    # 【方法三】：请领导背书。


    有时候，使出浑身解数仍然不能很好的解决问题或者推动施工进度，那这时候不要犹豫，不要怕丢脸或挨骂，抓紧找领导站台，强力推动工作进行。


    施工中，进度是非常重要的，能够有效推动施工进度，有时候就得主动麻烦领导，相信领导也是支持的。'
