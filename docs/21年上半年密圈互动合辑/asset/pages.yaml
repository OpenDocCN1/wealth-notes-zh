- pgno: 600
  md: '我的目标：3个月内顺利转正，1年内有望升加薪，3年内有望升职升值。


    管理上级对我的预期：


    +   1、3个月内，力所能及达到80分，证明我是合格达标者；

    2、3个月至半年内，努力达到85分，人要不断前进，才能走得更稳；

    3、半年内至1年内，争90保85分，因为这个阶段你对业务要了解更多更深，不断挖掘自己的优势项和待发展项，在这段期间，除了做自己可以做到的事情，还要寻求突破。


    有人会问：会不会太激进了?这个时候应该思考，在发展如此快速时代，怎么才能让自己在职场上活得更稳更好。'
  merge: -1
  img_proc: true
- pgno: 601
  md: '另外在 3 个月和 6 个月的节点，要主动和领导做面谈交流自己的发展和领导对自己的预期，面谈很重要 归总一句话：凡是不能瞬间做太满，要给予他人期待，给与自己提升空间。


    # [对于同级]


    初入职场，


    对于同级伙伴有 3 个观点，还蛮实用的


    +   1、好好交流，好好合作，礼尚往来；

    2、切勿感情用事，依靠感情维持的合作不长久；

    3、在完成本职工作之余，力所能及帮助，未来某一天你可能也需要他人帮助'
