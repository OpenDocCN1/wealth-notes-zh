    读樊锦诗和张桂梅两位先生事迹有感：


    最近被两位“傻子”所折服，一个是“敦煌的女儿”樊锦诗先生，一个是华坪女子高中张桂梅先生。合上书，扣上电脑，脑海中尽是两位先生瘦弱的身躯，但转念却是他们伟岸的背影。两位先生身处不同的行业，但身上的品质何其相似：“守一不移；简单相信，傻傻等待；无我”。


    守一不移。樊先生北大考古专业毕业后，冥冥之中与莫高窟结下深厚缘分，扎根荒无人烟的大西北，用一生挚爱守护着心中的信仰。有几次，先生可以选择离开莫高窟，过上更好的生活，但心中的那个声音总呼唤着她“孩子，回来吧。这里才是你的归宿“。自此，她再未离开过这块土地。其实，像先生一样，几代人扎根莫高窟的修行者不在少数，有从唐开始，几代人供养莫高窟220窟的翟氏家族，也有现在李云鹤三代为佛像”'
