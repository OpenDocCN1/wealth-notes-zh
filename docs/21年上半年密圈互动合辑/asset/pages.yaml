  md: '# 12. 谦行公子


    我把老板炒鱿鱼了…


    觉得老板能力不如自己，怎样优雅而不失体面的炒老板鱿鱼


    3 条职场小锦囊送给大家


    +   1. 首先评估自己在公司的位置，老板平时给自己的方向，是否只是在战术层面老板不如你，但战略层面老板看得更高，还是两者都不如你…


    如果是前者，那很正常，但如果是后者建议你不必久留…


    因为老板的认知和思维决定了公司的天花板。一个不懂事的老板会毁了一个有才华的员工。'
  merge: -1
  img_proc: true
- pgno: 501
  md: '2. 确定了老板确实不如自己之后，接下来就要展开行动。


    可以和老板敞开心扉去聊，尝试去独立负责一整条业务线的机会。能对结果负责，尽量不要让老板掺和，用自己的专业性去说服老板。


    一般稍微懂点事的老板都会让你自己去做，但往往结果是最后，因为他的阻力项目无疾而终。因为在他的地盘，他的公司，不可能把事情全权交给你。


    这个时候老板一定会怪你，说是你没有把项目做好。你当然可以用十分专业的证据来证明不是你的问题，但一定要和老板争个对错，真没必要。


    3. 最后一步，请老板吃饭


    （或者借口自己生日让老板请你。）'
