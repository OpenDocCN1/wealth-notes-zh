  md: '案是否的话，那还有什么理由让你自己的动力不足呢，直面人最原始最直接的欲望，才最现实。


    2、同类比较；我相信每个部门都会有闪光的人，与其他人相比，他更受老板重视，本人在国企，更是看到了好多 80 后的处级领导。对于这些成功人士的成功，相信有很多人都是羡慕＋嫉妒，抛出一
    些非人为因素之外，人家是如何成功的呢，同样的年纪，你就甘心被人 家越超越远？这时候只能对自己说一声，快滚去干活！


