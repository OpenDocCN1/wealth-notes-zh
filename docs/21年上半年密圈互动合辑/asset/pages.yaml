  md: '# 09. 土豆粉 0423


    最近收获的三条职场锦囊：


    +   1、对于每一个方案，无论是和老板汇报或者和下级传达，都会提前准备将方案尽可能的呈现 planA， planB…并且告诉对方我的倾向方案和倾向原因，并且在这个过程中不断模拟可能会被问到的问题且准备好答案，这样的过程是自己得到了很多的锻炼；

    2、时刻提醒自己使用利他性原则，从对方的利益和角度出发，与自己的需求进行结合，找到共同利益点，事半功倍；

    3、把老板的建议记下来，并在正式或非正式的沟通中体现我的推进，践行老板的方向和思路从中得到锻炼和提升，让自己站位和视角更加开阔。'
