  md: '对比，我们就知道，该如何有步骤、有计划的运用自己的才华，将其威力发挥到最大。


    2.2 在豆瓣上我也关注了很多画画的人，看到一个有趣的案例：某业余画家 C 说她老爸喜欢木工，退休后弄了个小工作室，工具也是自己手工制作的，之前她老爸帮一个友邻制作工具，前后研发花了半年多时间，每天乐在其中，因为毕生所学的木工和机械知识都能用的上，而且还想要在学些新东西。我们可以想象她的家庭氛围是怎样的，她父亲对于她自学画画这个爱好的态度如何。反观另一位画画的豆友
    D，她父亲是高级钳工，但是家里灯泡坏了也不管，在她小时候尝试做很多事情的时候，她的父母即便不懂也一定是先对她的积极性打击一番，导致她一直很自卑，不敢表达自己的想法，因为展示自己就好像是在炫耀，而炫耀是错误的行为，后来她即使画的很棒，也还是很羡慕前者那种家庭氛围。通过对比，我们看到了原生家庭、父母的态度对一个人的影响有多大，看'
