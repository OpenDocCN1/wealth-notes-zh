  md: '# 09. tesths


    我聊三个我跨部门沟通时会注意的点。


    # ## 尽量同级交流


    我想说的第一个是尽量同层级交流。比如在我们单位，就要尽可能的避免 A 部门的部员去找 B 部门的部门长的情况。部长们沟通好之后，下面的员工再进行具体的事物对接。虽然这个不一定适合其他人，但也算我自己走过的一个坑吧。有时候因为跨部门的工作比较复杂，当我们需要去跨部门安排任务或者对接的情况，经常会出现层级比你低的人不捋理你的情况，而且由于下面人是具体执行，很多宏观的也不太了解，就导致沟通会出现问题。


    有时候我们单位还会出现跨部门合作的时候极力保护各部门的人情情况，A 部长想直接找 B 部门的员工，而 B 员工说我部长交代我了必须先找她报备这种'
  merge: -1
  img_proc: true
- pgno: 119
  md: '情况。这时候如果是同级别交流，就可以很好的避免，由部门长沟通协调好，互相借人工作。


    # ## 交付的时候尽可能详细


    我在的部门平时负责宣传工作，经常需要发送各部门的新闻稿件。有的部门给我们发送材料的时候，会先用 word 简单文字+图排版下，然后在 word 里非常详细的标注这块怎么帮他们做一下，那里需要我们帮他设计个什么，然后把图片原图发来防止压缩。这样我们在后期做新闻稿件编辑的时候就很容易的去制作。素材也很充实，很快就可以完成这项工作。


    有时候我们也要向其他部门报送材料，我就会提前问好需要什么格式的材料，有时候对方没来及说我就多准备几种。有放在一起的，有图片和文字分开放的，注明后一起打包发送。做好详细的交付，大家'
  merge: -1
  img_proc: true
- pgno: 120
  md: '后续的工作都会很方便。时常考虑别人的需求，工作也能非常快速的推进。


    # ## 平时要保持好感情


    像我们单位人比较少，互相也都比较了解，所以就一定要注意好保持好感情。很多时候跨部门的事情不大，但是因为平时不经意的一两句话，搞的互相不开心，后面合作的时候就很难推进。


    平时没事的时候大家一起吐槽下生活或者工作，增进一下感情，小忙随手就帮，大忙能帮则帮。后面真到工作需要跨部门合作沟通的时候，看在大家的感情上也会互相多提醒，多帮助。像我部长和后勤部长两个都是男的，没事他俩一起吃吃饭，我们部长经常帮他修修电子设备，没事的时候把他喊到我们办公室聊聊天喝个茶，后勤部长需要买什么东西就顺便问问我们部长需要什么一起买。大型活动来的时候，他俩'
  merge: -1
  img_proc: true
- pgno: 121
  md: 亲如兄弟，互相补位，合作愉快，工作也能圆满完成。
