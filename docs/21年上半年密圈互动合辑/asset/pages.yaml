- pgno: 561
  md: '# 06. 妙蛙种子


    实在忙的分身乏术，要如何把控工作节奏


    为何忙得团团转，只因事不断


    我属于推广岗，所以只要能和推广扯得上边的，都会找到我，手上的事情没做完又被其他事情打断，任务越来越多，忙得分身乏术。


    如何才能有自己的工作的节奏


    +   1、列每日任务清单


    一二三四五，顺序摆清清楚楚，事情很多忙的团团转有一个重要的原因是没有给事情做优先级排序，一天好像做了很多琐碎的事情，但晚上梳理起来发现本周任务还没启动，到下一周的周会时，常常忐忑不安，因为上周列的计划都被很多紧急的事情挤掉了。'
  merge: -1
  img_proc: true
- pgno: 562
  md: '# 解决办法：


    列每日任务清单


    每日任务不要超过五项，完成一项才能增加一项，如果事情比较复杂，也可只列三项，甚至一项就好，列出任务的优先顺序，按此执行。


    2、不要马上答应别人事情，来个集草器。


    一个紧急电话，一个紧急邮件，或有人来座位上我帮忙，我常常会习惯性地答应说好的，结果做了他的事，你自己的时间也没了，记得有一次找市场部的姐姐，看到她的电子日历会有每日的计划事项，她说把一周的计划分配到每一天里面，如果领导临时加活，可以拿着表和领导讨论这些事情的优先顺序，防止任务完不成。曹大的日计划表里面也有一个每日最重要的事，我用着用着就变成，上午、下午、晚上的'
  merge: -1
