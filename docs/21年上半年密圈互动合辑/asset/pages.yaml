- pgno: 470
  md: '# 04. 三水啦啦啦


    第一次尝试打卡，用一个买花的经历，总结这周的收获。


    一年多来，我一直固定在隔壁小区的一家花店老板那里买花，后来小区对面新开了花店我也没有改。老板把花店关门改开工作室，更难找了我也没有换地方。


    我觉得，最重要的是，和这个老板做生意很舒服。舒服的点在于，她会站在你的角度为你考虑，会让你很放心。


    比如，周末就是母亲节，花价明显上涨，就会告诉会员日常买花就提前，不要赶在这样的节日。


    比如，明明定好的花，因为花市采购的质量不好，就会给会员主动挑等值的其他花。'
  merge: -1
  img_proc: true
- pgno: 471
  md: '再比如，会员们都有定期买花的习惯，为了让大家享受更多养花的乐趣，经常去花市的时候，有时间就在群里直播看到的进口品种，买得起的就买，买不起的开开眼也很开心。还会给大家主动定制养花主题，像刚刚养过的芍药，也是老板认真对接基地，谈好价格给会员团购。


    我觉得，这就是用心服务好用户，每一个细节都在赢得用户的认可。所以，我经常充值，而且每次买花都不算钱，相信老板自己划扣。


    在职场，员工也是我们的用户，为用户多考虑一点，也容易建立和员工之间的信任感。


    比如请病假的时候，多问一句还好吗？月头或者月尾，遇到重要的事情，在钉钉群里给大家发一个小红包，加油打气。'
  merge: -1
  img_proc: true
- pgno: 472
  md: '员工遇到问题的时候，多说一句别害怕，一起面对。暂时先放下情绪，聚焦在解决问题上，再事后复盘，更容易帮助员工发现问题。


    日常看到的好的观点和行业信息，即时分享给下属，为他打开更多信息渠道。不仅仅有利于彼此双方交流更加同频，建立默契，也有利于我自己把输入的信息进行输出训练。


    我认为，在职场里，管理者也需要服务好员工，只有服务好了，员工才愿意更好的服务用户。'
  merge: -1
  img_proc: true
