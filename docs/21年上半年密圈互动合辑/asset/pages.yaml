- pgno: 479
  md: '# 4. 少说话多做事


    看到这，聪明的你们应该知道自己的职场奋斗目标了：


    多说话多做事。


    简言之：基础工作(专业能力)要过关，还有就是职场表达要跟上。


    # ③如果你不善言辞具体怎么改善呢？


    +   1. 一周主动找老板 2-3 次，闲聊&正式报告。


    我知道不善言辞的人开始不习惯，可以慢慢养成习惯。比如开始不熟悉工作，可以日报，周报和月报勤整理，建立信任后可以利用好吃饭间隙，休闲时刻去更进一步交流，有很多重要的决定反而是在比较轻松的情况下做出的。'
  merge: -1
