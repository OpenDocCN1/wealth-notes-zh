  md: '什么类型的任务：紧急且重要，紧急且不重要，不紧急且重要，不紧急且不重要。紧接着开始分轻重缓急。


    制定工作计划：根据各象限的项目开始制定工作计划，看项目的截止结点，如果是周合适，建议做周计划，如果是月合适，建议做月计划。（这个时候可以用曹将老师推荐的计划模板啦！）


