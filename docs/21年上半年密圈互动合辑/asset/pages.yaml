- pgno: 521
  md: '我在的单位是总承包，干的就是所谓管理的工作，这个“管理”又不像通常意义上所说的管理，领导给了你几个新人，你带着他们一起工作，一起完成任务。


    我们所谓的管理，是去管理施工单位，但是施工单位只是下属单位，对接的人并不是直接下属，可以说人家愿意听你的就听，不愿意听你也没啥办法。


    真正的工作开展中，又不能把关系处的太亲近，因为出了问题不好处理；又不能处的太僵硬，很多工作都是需要他们去完成。


    因此，很多时候真正做成一件事，往往还是靠领导的权威去压，靠扣分去“恐吓”对方，靠报告给对方的领导去推动工作。


    而这，真的算管理吗？'
