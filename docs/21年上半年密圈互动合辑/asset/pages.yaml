- pgno: 464
  md: '到，当一个老好人有时候不仅不能帮到别人，自己也会忙的团团转。


    # 2、只要你不放弃自己，没有人能放弃得了你。


    最近领导想提升我解决事情的能力，当任务过来时，我更加能独当一面。于是开始放手让我独立完成一些任务，比如独立负责一个展会，能从头到尾负责一个项目。由于能力与目标还有很大的差距，我开始感觉压力倍增，担心自己做不到，害怕领导会失望，担心自己成长太慢被放弃。由于能力没办法一下子匹配上期望，我开始思绪万千，然而这只会让我在工作上更容易出错。


    其实只要我们不放弃自己，那我们永远有反败为胜的机会。没有谁一出生就会什么都会，也没有谁不会犯错，只要我们过程用心，结果空心，才能在成长的过程中痛并快乐着。不是每一个努力都会有回报，但'
  merge: -1
  img_proc: true
- pgno: 465
  md: '不努力一定没有回报。接纳自己成长所需的过程，带着一颗至真至纯的责任心努力前行。


    # 3、请对你的输出负责


    最近需要输出一些公众号文章，我经常会写完初稿就发给领导，领导每次读的时候就会发现文章不是错别字太多，就是语句不通顺。于是耐心辅导我，你输出的东西会形成大家对你的印象，就像品牌的建立也是由一次次的输出形成，所以你要对自己的交付负责，每一次交付输出都是都是你自己个人品牌的累积，所以要重视每一次的输出，对输出负责。


    # #最近收获的 5 条职场锦囊'
