- pgno: 374
  md: '我把叠被子夹在摘眼镜之前，也就是，把新习惯建立在旧习惯的基础上，并且我做了个先后链接 — 先叠完被子，才可以摘眼镜哦！（os: 如果你想摘眼镜，就赶快叠被子，不然有本事别摘！）


    绑定旧习惯，让新习惯必须执行。


