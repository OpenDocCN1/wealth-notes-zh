- pgno: 387
  md: '# 09. clannad


    # 1、 电脑桌面及工作桌面的整理


    对于电脑桌面，因为平时待处理的文件都会直接放桌面便于开机就能看到提醒自己，当然这样会稍微显得有点杂乱，但每当完成后就会及时按照类别归档相应的文件夹并做好统一命名及标注，便于后续的查找，提高工作效率。


    对于工作桌面，每天上午一到工位就会先擦拭下台面（最近车间在装修），然后准备几页打印废纸横放在键盘下（笔记笔记也喜欢横向记录，因为这样空间比较大，有时相关链接及备注能有更大空间），先规划下当天计划的工作任务，采用打勾的形式，每完成一项大致记录下时间，同时会在印象笔记中同步记录当天计划（开机）。每天有时看到一些新知识点或灵感也会立刻随机记录在纸张上，每天下班前就根据纸张上记录的情况再记录进印象笔记中。这样就不会在'
  merge: -1
  img_proc: true
- pgno: 388
  md: '工作中随时切换去处理及做电脑笔记。每次完成电脑记录，废纸张就可以放入废纸处理区（每隔一段时间部门废纸统一清理掉）。


    # 2、 必备 1 水杯、1 保温杯


    办公室统一大容量的煮水器，每天自己都先从家里带 1 保温杯（500ml）装第一杯水上班，一上班擦拭完桌面就可以喝水，夏天水杯能快速散热喝水方便，保温杯能保持热度便于过程中添加，随时随地想喝热喝冷切换自如。有时自己生病了，早上就拿保温杯装煨好的药上班喝，保持温度，药效才能起作用。


    # 3、 善用效率小工具/插件


    从一些公众号里面下载并安装一些效率小工具/插件，如：listary、效率专家、美化大师……等大大提供办公效率。Listary 能根据关键词快速搜索到自己想找的文件，有时忘记文件全名及位置，直接根据关'
  merge: -1
  img_proc: true
- pgno: 389
  md: '关键词所有就能找到自己想要的文件，也免去打开文件夹繁琐的存放路径。效率专家主要是作为插件用于提供 EXCEL 文件的处理，能快速生成文件目录、能直接提取将单元格按照需要进行文本或数字的提取，便于数据的处理。至于美化大师，OFFICE
    多文档的打开不能实现像 WPS 那样的直观查看及点击选择（直接工具栏下方），美化大师作为插件能直接解决这个问题，还能提供很多实用的模板供日常办公参考。


    这些小工具/插件的相互搭配合理使用，大大提高了自己的日常工作效率，现在基本都是以关键词找自己的文件，间接也让自己养成规范化命名及归档归类的习惯。'
  merge: -1
  img_proc: true
- pgno: 390
  md: '# 10. C**nie


    # 1. 利用闲暇时间时做运动或付费提升自己


    我喜欢看剧时转呼啦圈或者贴墙挺腰，有时候会做家务打扫卫生。从小学三年级接触英语后，到现在工作没有停止过英语学习，这是我坚持已久的学习。


    # 2. 每周固定时间与领导谈心


    你可能觉得领导没有那么时间会接通你的电话，你可以学习简明扼要的讲述你近期的成果和接下来的行动，领导会给出建议指导你工作，让领导发现你的成长。


    # 3. 早睡，早起


    假如平时自己 11 点睡觉，赶紧把自己工作做好，提前半小时睡觉，进入睡梦前，你会回顾到自己工作的不足、方案修改等等，想法会更加清晰。第二天起'
  merge: -1
