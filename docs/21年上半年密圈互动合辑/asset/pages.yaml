  md: '# 02. 陈海生 Hanson


    大家好，我是 Hanson，一名喜欢干培训的 HR。现在开始完成作业：如何管理他人对自己的预期？


    先审题，题目有几个关键词：管理、他人、自己、预期。


    “管理”表明这是一个主动影响的过程，要通过行动去影响别人对自己的影响；


    “他人”这个词非常广，可以是家人、爱人、同事、上司、下属等等，因为星球是职场主题，所以我把“他人”限定为“下属”


    “自己”涉及到客体，就是别人是怎么看到“我”这个人的，涉及到平时的表现，这个在下文会分析；'
  merge: -1
  img_proc: true
- pgno: 584
  md: '“预期”指的是对未来情况的估计，这里可以理解为对你行为的期望值。


    所以，我要分享的主题是：作为管理者，如何管理下属对自己的期望值？


    首先，“预期”可以分为三种：


    +   1、 “实际值”等于“期望值”，代表实现目标了，此处不分析；


    +   2、 “实际值”大于“期望值”，代表超预期，可以产生团队的嚅点，可以重点分析；


    +   3、 “实际值”小于“期望值”，代表大失所望，团队可能情绪低落，需要采取措施。


    以下重点分析第2、3种情况。'
  merge: -1
  img_proc: true
- pgno: 585
  md: '# 一、如何带领下属实现“超预期”


    1、设定目标。公司每年对于部门的工作都会制定明确的目标，例如招聘 XX 人、培养 XX 个中层管理人员，作为管理者，要去理解领导的出发点，同时上承下达，把目标传递给下属。有些目标可能具有挑战性，下属就会很不理解，认为目标老板简直是疯了，这个时候，管理者就要做好“预期管理”。


    第一、向下属讲解这个目标对于公司发展的重要性；


    第二、对目标进行分解，让下属明白目标通过努力，是可以实现的。


    第三、确保每个分解的目标，都有对应的负责人，能够检查或监督。'
  merge: -1
  img_proc: true
- pgno: 586
  md: '2、制定计划。动员下属针对各自的目标拿出自己的实现计划，知道每个人的底线。


    3、过程管理。大目标要设置节点，就像战争需要拿下一个个阵地，当取得阶段性成果时，要及时庆祝。举例：人事部在完成阶段性招聘任务的时候，都会出去聚餐，一般都是找有特色或有记忆点的餐厅，例如松哥油焖大虾，因为他们家有一个家庭套餐，20斤的小龙虾通过一个直径1米的大盘子端上桌，场景非常震撼，所以大家在庆祝胜利的时候会有记忆点。


    4、结果庆功。对于完成了总目标，会向公司申请奖金嘉奖团队，起到团体激励的作用。


    # 二、如何调整下属的“期望失调”


    1、目标分析。没有完成既定目标，整个团队士气都会比较低落，这个时候，要分析目标完成的成果，对于过程中好的表现，要给予鼓励；对于没有做好的'
  merge: -1
  img_proc: true
- pgno: 587
  md: '下属，要有一定的鞭策，当然不能当众责怪，最好一对一沟通；


    +   2、切换场景。离开工作场景，转换心情，调整团队士气。


    +   3、重新树立新目标，发起新的冲锋。这是为了让团队快速从现有的低谷出来。'
  merge: -1
  img_proc: true
- pgno: 588
  md: '# 03. 金木木


    一开始看到这样的问题，我是有点懵的。


    从毕业到现在三年，我一直工作在一个非常狭小的工作空间里，靠近入海口的一个工地上。每天见的都是那些人，每天做的都是差不多的事情，领导很少，同事很少。


    从来不像国内大多数人的工作，会有假期，会有旅游，会有和朋友的聚餐，会有和同事的合作与竞争。


    所以我从来没有去思考过，什么是预期管理？别人眼中的自己是怎样的？自己又该去怎么管理他人对自己的预期？


    从看到这个题目，到开始码字，我经历了一整天，这一整天我在工作之余都在思考这个问题。'
  merge: -1
  img_proc: true
- pgno: 589
  md: '# 01 什么是预期管理？


    预期管理应该分为两类，自己对自己的预期管理和他人对自己的预期管理，为了贴合题目，只讨论他人对自己的预期管理。


    既然身在职场，既然谈到管理，相信每个人都希望通过管理他人对自己的预期，来达到一定的目的，这个目的可以是自我成长，可以是同事关系融洽，可以是得到领导重用和栽培。


    我理解的预期管理，就是当领导交代一项工作，或者需要配合同事一项工作的时候，拿出百分百的认真态度去完成它，这时候领导和同事对自己有一个初步的预期，且相对不低；在下一次的时候可能会交代难一点的工作任务，这时候还是拿出百分百的认真态度去完成它，自己的能力得到锻炼和成长，领导和同事对自己的预期也会提高，将会鞭策自己更努力提升自我，从而完成更有难度的工作任务。这样形成一个'
  merge: -1
  img_proc: true
- pgno: 590
  md: '良性循环，虽然会比较累，但是成长的速度也会是令人惊讶的。


    # 02 我在工作中感受到的别人对自己的期望


    举两个小栗子。


    第一个是来源于我的一个其他部门的同事（部门副经理）。因为大家都在各自岗位工作了很久，都很熟练了，也有点疲惫了，再加上领导有意进行轮岗，我的这个同事向我表达了希望我可以去他部门工作的想法，因为他觉得我比较靠谱，且工作态度和工作能力都是有的。我的心里自然是开心的，因为得到了认可，这是之前很多次工作给力的结果。虽然最后没能去成那个部门，但是还是高兴的。


    第二个是负面例子，跟我的直系大领导有关。因为之前工作做得都还不错，领导对我也比较认可，就比较放心的将很多工作任务交给我。有一次交代了一'
  merge: -1
  img_proc: true
- pgno: 591
  md: '个很简单但是很重要的工作：早上安排车去码头接公司来的大领导。因为早上比较早，我前一天晚上安排了之后，第二天就没有起床，结果车没有按时出发，让大领导吹了一会儿海风。结果遭受了自己领导的严厉批评。之前对自己很良好的预期，结果就因为这一次，就会导致很大的影响。


    # 03 如何管理他人对自己的预期？


    对同事：


    不当老好人。不是自己的工作，要敢于拒绝，优先完成自己的工作任务，可以在时间富余的时候，适当帮忙。


    全力配合。有的工作是需要多部门协作的，需要自己提供协助的，就一定全力以赴，全力配合，因为我们有一个共同的目标，将工作做好。'
  merge: -1
  img_proc: true
- pgno: 592
  md: '# 对领导：


    尽职尽责，优中更优。领导安排了工作，很多时候是因为相信我们可以很好的完成，那就充分发挥自己的聪明才智和能力去超额完成它，给领导一个好的印象。


    适当拒绝。有时候很多领导会同时给安排工作，那么当自己实在忙不过来的时候，就要将跟自己关系不大或者对自己成长帮助不大的工作适当拒绝掉，留出精力专心做对的事情。'
  merge: -1
  img_proc: true
- pgno: 593
  md: '# 04. 彼墨羊


    核心：放平心态，踏踏实实地做事。


    首先，你需要明白他人为什么会对有预期，原因是什么？


    其次，你需要找准自己的职场定位，面对他人的给你的预期，你应该怎么样做？


    如果是初入职场，你需要知道你的上级对你有一个怎么样的预期值，上级给你的预期是 100%，那么你需要将工作完善到 200%，尽全力去完成。这时候你的同级对你的预期值一般不会太高，能帮则帮，勤快点。


    过渡完职场小白之后，你的上级跟同级差不多已经知道你的水平，这时候的你需要做的是为每次预期画一个等级。上级给你的预期是 80%，那你尽 90%完'
  merge: -1
  img_proc: true
- pgno: 594
  md: '成，上级给你是 90%，你就尽 100%去完成，每一次进步一点点，让上级明白你在进步。


    关于同级对你的预期，最好和睦相处。他给到你 80%的预期，你就按照自己的节奏在 80%的预期范围内完成就好，有超过预期范围外的事，委婉拒绝。


    最后，小结一下。


    +   1. 找到预期的原因跟人，是上级就超期完成，是同级，看是否在能力预期范围内，是的话就按时完成，不是的话委婉拒绝。


    +   2. 找准自己的职场定位。明白自己还处于职场的哪一个阶段，根据自己的阶段判断预期选择合适的方法。


    （一点点小见解，共勉。）'
  merge: -1
  img_proc: true
- pgno: 595
  md: '# 05. 妙蛙种子


    在工作中，别人对自己的期待是很常见的，领导的期待中希望我们能独当一面，保质保量地完成交下来的任务，同事的期待，希望配合地过程中能高效地协同，可面对这些期待，我常常压力好大，虽然压力大，但这不见得是一件坏事。


    结合 GROW 模型分享我的故事


    G goal 目标


    R realistic 现状


    O options 行动的方案


    W will 意愿


    G、目标'
  merge: -1
  img_proc: true
- pgno: 596
  md: '这个月有一个光伏展的参展活动，早在2个月前，领导就把这个任务给我，希望也可以独自完成这个任务，刚接到活的时候，我真是一脸蒙圈，没有思路，因为这是我第一次接触大型的展厅，怎么整没有思路，但领导说了，让我独当一面，目标就是，我要全面、细致地筹备整个展会。线下推广岗就我一个人，我毫无退路可言。


    # R 、现状


    现状就是没有任何筹备展会的经验，但我懂的产品，懂解决方案，善于与多方沟通。


    # 0、行动的方案


    我需要了解展会有那几个模块，展会的前期准备需要哪些物料，具体的工作人员有哪些，具体怎么分工，酒店的房间和班车预定，展馆的搭建市场，具体搭建人，展会的活动，展后撤展人员及物资的运输。'
  merge: -1
  img_proc: true
- pgno: 597
  md: '这些前期要去筹备。按此进行，不懂就问领导，领导比较有经验。


    # W、意愿


    列完清单就着手准备，中间也会压力很大但，方向是对的，那就带着压力往前走。


    遇到问题，先不说，我做不了，如果对方的预期和自己需要成长的方向是匹配的那就耐下心来，一步步往前走。


    成长的路上，不是策马奔驰，而是负重前行。


