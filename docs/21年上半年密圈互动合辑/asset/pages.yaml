  md: '# 04. 造梦之城 ☁


    # 一、分析问题成因。


    仔细回忆和分析是否是现在的工作遇到了瓶颈，无法进行个人成长和能力的升级，如果是因为这个原因导致工作积极性降低的话，那么就需要去开发工作中新的激励点，研发工作升级办法，从根本原因解决。


    # 二、根据分析的结论进行分类解决


    第一点中已经明确工作本身的原因如何进行解决；如果分析后发现只是自己的原因而导致的话，我有如下几条建议和方法供大家选择；


    +   1、薪酬激励；我相信每个人在最开始从业的时候最为直接的目的就是为了赚钱，那么仔细的看看你自己的存款有几位数，对自己的薪资是否满意，如果答'
  merge: -1
