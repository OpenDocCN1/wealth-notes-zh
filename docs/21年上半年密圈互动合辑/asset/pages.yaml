- pgno: 223
  md: '# 引言


    「曹将和朋友们」2021年 第5期密圈互动：


    > “工作积极性降低，动力不足应该怎么办？”。


    由小助理星雨先开始。


    ——


    自己最近就遇到了这个问题，最好的解决办法，是找刺激点，怎么找，有两个办法：


    +   1. 向内，坚定现有职业线的目标导向。


    这点，因为最近才述职完的原因，深有感触。


    规定自己将来的职业目标是往专业线上走，还是管理者上走。其次核心是，是否往上走，也就是要不要升职。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '把自己从惰性的边缘，无论是通过公司的官方述职，还是自我年终总结也好，强调和梳理出自己的短期职业规划。


    如果是就要升职，那一定要在升值述职前，做好自己的高光里点，后续要挖的时候才会方便很多。


    # 2. 向外，找外部机会的刺激点


    这点最近因为跳槽找工作的原因，深有感触。


    当自身动力不足的时候，就需要有外部的力量来敲打你，最好的方式是投简历。


    目的当然不是为了真正地辞职，而是跳出现有的框架，无论是去看看不同行业同一岗位，还是同一行业不同岗位，在和业务乃至于和 HR 面谈的过程中，不光对这份工作，其实对这个行业的发展，和岗位的发展，能互换交流很多信息，能开阔眼界，给到一些之前自己在做工作时没有想到的灵感和思考延伸。'
  merge: -1
  img_proc: true
- pgno: 225
  md: '还有可能在面试的过程中，沟通到一些现有工作的资源置换，这样的沟通，十分的有价值感。


    同时，和面试官在沟通的过程中，通过类似于“您觉得，我还需要改进或者新增什么技能，才能符合这个岗位和您的期望？”等问题，来看到自己专业能力和日常工作中的不足，会打开你思考的新思路。


    # 3. 发展斜杠爱好。


    动力不足，可能是过于把经历都放在了 only 一份工作上，所以有些时候难免会觉得枯燥无趣。


    这时候，可以在业余时间内，发展一些或许对工作有益的斜杠爱好，比如手绘笔记、剪辑视频等等。


    因为纯爱好，太过耗精力，所以如果对工作有助益的话，是最好的。


    以上。'
  merge: -1
  img_proc: true
