  md: '# 1. 学会忍耐。


    受疫情影响，单位倡导就地过年。其他处对是否离开单位所在的区不作要求，但我所在处的处长单独要求大家（除了他自己）不准出单位所在的区，也不准接触其他区的外来人，并且让副处长转告我，让我不要去找他。这是明显的“双标”，而且处理方式也比较难看。这件事的最终结果就是我无法和女朋友见面（我们打算四月份结婚），而全处只有我一个人女朋友在其他的区，所以看起来好像是针对我一个人。虽然我内心极度愤懑，心里骂了几百遍，但是过往四五年的工作经历告诉我，必须忍耐，直属领导决定了升迁、晋级等各方面，说白了，一根手指头就可以把我捏死。


    所以，我表面上还是要积极服从领导安排，认真完成好各项工作，让处长对我的工作比较满意。学会'
