- pgno: 372
  md: '持续了一段时间以后，会突然觉得自己有些颓废了，或者说，不像自己期望的一般自律地生活了。


    于是 Lands 某一时刻突然痛改前非，特别认真地优化了我的 Morning Routine，就出现了下图 — 最近我的早晨都在干什么。


    虽然看起来是个长 list，但也许细心的你会发现，它们加起来根本用不了多少时间。


    但是它们每一条的存在都有意义（甚至理论根据），容我逐条说明一下。


    +   1. “当我按掉 5:00 闹钟时，我将立即叠被子。”


