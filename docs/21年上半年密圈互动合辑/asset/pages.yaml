- pgno: 537
  md: '# 「曹将和朋友们」2021年第12期密圈互动：


    “实在忙得分身乏术，如何把控自己工作节奏？”


    由小助理星雨先开始。


    +   1. 向上管理：沟通机制的固定，信任基础的搭建。


    从第一周开始，就要搭建起固定的向上汇报的框架，之前的个人是通过写工作微博的方式，通过主动写下自己每天的重点工作，领导选择性查看，来进行的基础沟通。


    后续则是以周的方式，重点来沟通除每日的工作微博之外的，自己遇到的一些“大的”难题，是需要上层去帮忙推动或者解决的。'
  merge: -1
  img_proc: true
- pgno: 538
  md: '除此之外，职场上遇到最多一个情况，就是被通知有额外的工作，这种时候，需要做的，就是要做的漂亮，且“声势浩大”。


    做得漂亮，不是说比别人正规军做得好，而是展示自己的用心程度，以及在局部一些细节上做得很出色；


    “声势浩大”就是要把自己做了的事，在有领导的大群，做“留言板”，不管谁看到，一定要保证在群的能见度，这样后面在翻历史记录，找证据的时候，也一举两得。


    # 2. 向下管理：目标管理，过程下放。


    最近在管理团队，因为人数不少，所以基本之平均一个人问我几个问题，我的时间就可以被占满。


    所以，核心自己一开始根据 KPI，详细的梳理了所有的工作结构和流程，针对每一个指标，核心是三个，做出了目标 by 日和 by 月的细分。'
  merge: -1
  img_proc: true
- pgno: 539
  md: '过程中，自己在尝试挤出组长的过程，让组长代替自己进行组员的基础管理。但每个组员的周报自己是会认真阅读的，一开始的目标完成，以及过程是什么样子的会跟进的比较细节。


    但是在后期，预计熟练上手业务后，自己更多的是 By 日的一个目标跟进和打气，实质的过程追踪，自己会下放到组长，而组长会安排各组员完成不同事项。


    以上。'
  merge: -1
  img_proc: true
- pgno: 540
  md: '# 01. 阳阳的小事


    大家好，我是阳阳，星球的老朋友，一枚工作第3年工程师。很开心能参加这期密圈互动。


    对于本期话题【实在忙的分身之术，如何才能掌控自己的工作节奏】，我很感兴趣。


    最近一个月，我在工作中尝试一个【精力分配】试验。


    这个试验的结果很让我意外：


    做为一个技术人员，我的专业工作精力占比仅为35%，而其它事项（报销、做表、走审批流程等）占比高达65%。


    而早上的8：00-11：00是我工作效率最高值（基本无人打扰），可完成当天任务的75%+。'
  merge: -1
  img_proc: true
- pgno: 541
  md: '事实上，我每天都很忙，感觉有做不完的工作。


    造成这样的原因主要有二点：


    +   1. 职场“老好人”——业务外的工作不好意思拒绝

    2. 时间被碎片化——工作效率完全不进节奏


    于是，我现在对自己的工作方式做了一些调整：


    +   1. 业务外工作选择性接受


    平常在工作中，我最怕的是同事突然来找：


    小阳，你做 PPT 的能力还可以，能不能帮我修改一个 PPT，很急的。


    小阳，你文笔不错，帮我把这段文字润色下吧。'
  merge: -1
  img_proc: true
- pgno: 542
  md: '…


    现在，我会先确认他们的时间节点，如果时间太急或者会占据我过多的工作时间，我都会委婉拒绝。


    # 2. 创造自己的工作时间区


    我的工作时间被碎片化主要因为二个因素：邮件和微信。


    我收邮件的最高纪录是 150+/天，你能想象电脑桌面上那不断调出来的邮件框嘛？


    微信现在完全变成各种工作群，但事实上如果有什么特别重要的事情一定会电话沟通。


    于是，我会在早上 8：00-11：00 给自己断网，这段时间全力完成今日工作，11：00-11：40 处理上午'
  merge: -1
  img_proc: true
- pgno: 543
  md: '的邮件及回复微信信息，打造属于自己掌控的工作区。


    我是小结


    今天给大家分享二个掌控自己工作节奏小技巧：


    +   1. 业务外工作选择性接受

    2. 创造自己工作时间区


    希望对您有帮助~'
