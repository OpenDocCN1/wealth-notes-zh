- pgno: 547
  md: '# 03. Sunny


    实在忙得分身乏术，如何把控工作节奏？


    忙得分身乏术的时候，焦虑很正常，别遇到就回避。因为焦虑失去的掌控感，可以用理智拿回来，转化为成长的动力。


    具体的方法论是：


    +   ① 给自己的焦虑故事换个角色：


    尽量使用自己喜欢的偶像、崇拜的名人、身边的榜样，想像如果他们面对自己正在经历的事情，对方会怎么做，在脑子中过一遍对方的处理步骤 123……。


    +   ② 对标对方可能会做出的行为：'
  merge: -1
  img_proc: true
- pgno: 548
  md: '如果你认为对方可能进行的处理步骤是极好的，如果你也认为对方会顶住压力继续努力，并且使用 4D、番茄钟、吃掉三只青蛙、OKR 等多种时间管理法 来按优先顺序一项项完成任务，为什么自己不直接那样做呢？


    对标它，照做。


    # ③ 别想太多，立即开始：


    把有效的想法孵化成行动，用行动穿越焦虑，别把自己更多的时间浪费在“浮想联翩”上，立即就做，干就完了！马上焦虑就会因为你的行动而缓解。'
  merge: -1
  img_proc: true
- pgno: 549
  md: '# 04. 好姑娘


    > 【忙的实在分身乏术，我用这 5 个步骤掌控工作节奏】


    我的工作情况和阳阳类似，忙于主业中心工作只有三分之一的时间和精力，其他时候被综合管理工作所牵绊，拟方案、审批、采购、沟通、报销、宣传等环节琐碎事务消磨。


    我工作七八年了，很多时候想改变这种工作结构，但是人微言轻，不容易改变环境，只有改变自己的方法和节奏。经过摸索和改变，我总结出了以下步骤来控制工作节奏。


    +   1、短暂的报复性休息放松'
  merge: -1
  img_proc: true
- pgno: 550
  md: '多重任务来临时候，人会很焦虑。一般人觉得，这时候就应该分秒必争，抓紧把任务完成交托出去才能彻底放松。


    殊不知，有时候着急反而会出错，有个短暂的休息时间很重要。这个短暂，半个小时左右，最多不超过半天。


    反正工作已经来了，逃也逃不掉，那就迎头而上吧！


    推荐的短暂休息方法有：


    +   - 去茶水间洗茶杯、接热水、泡茶叶；

    - 去楼梯间做个广播体操伸伸懒腰；

    - 去窗外远眺高楼大厦绿地鲜花；'
  merge: -1
  img_proc: true
- pgno: 551
  md: '+   - 与部门同事闲谈十分钟；


    这些都是为接下来紧张工作的身心准备，作用很大，也必不可少。


    此时的休息，虽然神经是紧绷的，但是像大会战前的动员会一样，像运动前的热身样，能够充分把身心调动起来。哪怕是片刻的休息放松，情绪就能稍稍平静一点，有心思准备接下来的硬战了。


    # 2、列任务清单，按紧急重要优先排序


    除了每天上下班的计划总结外，我还习惯性在【滴答清单】内添加工作任务和截止时间。


    多个任务同时进行，我就先按照紧急重要程度优先排序，先完成最紧要的三项任务。'
  merge: -1
  img_proc: true
- pgno: 552
  md: '此时列任务，并不是慢调斯理漫不经心工作，是兵马未动粮草先行的事先准备，是磨刀不误砍柴工的笃定。


    一旦完成一件事就打勾，此刻的成就感最强。忙碌时候完成了一个任务，就信心倍增，更有动力冲击下一个任务。


    琐碎的事务集中到下班前处理。忙碌了一天之后比较疲惫，下班前半小时比较轻松，处理单据、整理文件、发同事所要的资料……不太着急的临时索取资料要求，我都是在滴答清单里设置提醒下班前发送。


    小 TIPS：滴答清单 PC 版【Ctrl+Shift+A】快捷键快速创建任务，日期和时间能快速智能识别，【^】快速分类，【！】快速设定优先级别，十秒钟快捷创建任务和提醒不是问题。'
  merge: -1
  img_proc: true
- pgno: 553
  md: '# 3、合理分工，寻求外援


    万金油可以不同时期充当不同角色救火，但是不能同时完成多个角色。一心两用效率低还容易出错，此时寻求外援是最合理高效的。


    对上，可以找领导说明情况，其他职工也可以胜任的任务分配给其他人，在推脱出去前，最好同时给领导推荐合适的接替人选，由领导出面安排。


    对外，也可以找交情好的、工作不太忙的同事帮忙。这需要平时的好人缘，互帮互助，积累情分，才可以礼尚往来求助他人。


    # 4、番茄钟专注，耳机降噪隔绝外扰


    番茄工作法是高效工作的利器，【滴答清单】和【潮汐】比较推荐。我比较钟情与滴答清单，可以设置任务提醒，也可以番茄专注计时。'
  merge: -1
  img_proc: true
- pgno: 554
  md: '我一般是在手机上开启勿扰模式，钉钉设置“忙碌中”状态标签。然后打开滴答清单番茄钟，拿出 AirPods 耳机戴上，打开滴答清单专注功能，开启降噪模式，专心致志投入工作。半个小时候休息三五分钟，再继续下一个计时，个人偏好‘雨声’和‘海洋’白噪音。


    有时候不想听白噪音，也会打开 QQ 音乐，听赵海洋钢琴曲。毕竟任务紧急时候，番茄专注计时反而容易打断工作思路，持续专注半天比较常见。手表提示久坐要站立下，就站立片刻伸一伸懒腰就坐下。


    单位电脑双屏也很方便，一侧搜索参考资料，一侧编辑文档。没有双屏，推荐用 windows 分屏对照。


    小 TIPS： windows 电脑【win】+【←】可以把当前窗口左侧分屏，同理【win】+【→】右侧分屏。'
  merge: -1
  img_proc: true
- pgno: 555
  md: '# 5、复盘总结形成模板，快速应用


    除了与人沟通打交道外，文字公文类的工作都有套路可以照搬，所以每次活动后的总结很重要。


    沉淀萃取出标准工作流程、备好常用的审批表单、相应的总结文档模板。忙起来的时候，工作能做到60分及格就行了，此时有现成的模板可以套用很就是及时雨。


    很重要的是，因为有现成的模板可以套用，就算交给他人办理，也能给别人减少工作难度和工作量，方便高效合作。


    小结一下↓


    忙碌无法分身时候，用这5个办法专注工作掌控节奏。'
  merge: -1
  img_proc: true
