- pgno: 122
  md: '# 10. 月影


    随着进入职场时间越来越长，免不了多多少少涉及跨部门沟通。一开始其实还是挺害怕，毕竟不同部门利益共同体之间会有矛盾和合作，特别如我这种天生高敏感的人，面对跨部门沟通而产生的焦虑和不安。后来慢慢克服和总结，以下是摸索经验。


    一般跨部门沟通的目的有两个：


    第一，各部门达成共识


    第二，各部门共同配合完成 ☑ 工作


    在沟通前务必注意 △


    +   1. 提前预测有可能出现的沟通问题


    在沟通过程中，我最害怕就是对方提出一个我无法回答的问题。当对方发现你无法回答的时候，他往'
  merge: -1
  img_proc: true
- pgno: 123
  md: '往会死咬不放，直到把你赶出去为止。所以提前想想假如需要跨部门牺牲或者退步达成共识的时候，对方有可能会怎么反抗和折腾甚至逼退你。


    面对无法回答的问题，淡定地告诉对方，我回去跟领导商量，再回复你们。不要表现出害怕和慌张失措。


    # 2. 提前预测跨部门的难搞份子


    每个部门都会有一个难搞份子，往往不愉快的声音从她发出，甚至扰乱秩序。可以就事论事是最好的方式，如果不行就得加点润滑剂和凝固剂，润滑剂就是私下一对一与对方沟通，增加沟通的说服力，平时多打招呼少摩擦，凝固剂就是借别人的力量把她固定下来，就算是她反对都没用……例如跟领导层达成一致或者足以影响她的同事。'
  merge: -1
  img_proc: true
