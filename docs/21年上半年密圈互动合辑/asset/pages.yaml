  md: '# 09. 九九


    Q: 进入职场后，有哪些因素阻碍你成长？


    A: 「失败」。


    关于这个作业，我第一反应是自己的哪些技能有缺失，或者是缺乏哪些思维模型。后来再仔细想一想，其实真正 rivel 在职场上阻碍我的，是自己不断「失败」的经历。


    从大学出来到职场一直在「失败」，工作不达标、沟通不顺畅、与老员工无法正常相处、不会处理问题。刚出大学出来的我以前没有尝试过犯那么多的错，也没想到会犯那么多的错，毕竟在大学还不错嘛，而且也没想到人际关系原来这么复杂，太多太多的碰壁。'
