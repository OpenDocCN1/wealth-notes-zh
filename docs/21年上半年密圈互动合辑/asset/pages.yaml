- pgno: 306
  md: '# 13. 九九


    遇到气场不合的同事，不知道该怎么合作，你该怎么办？


    从三个角度去探讨问题：


    # 【思维】


    认知层面：气场不合，是你认为的？还是 ta 认为的？发生了什么，我的错？还是 ta 的错？


    有原因的气场不合：


    +   1. 在合作前发生过摩擦：如果在合作之前你们有过相处的经历，并且对方给你留下不好的印象，或者发生了冲突与摩擦，导致双方产生友好的合作关系；

    2. 合作中发生摩擦：两者的理念有相反的地方甚至冲突，导致双方无法产生友好的合作关系。'
  merge: -1
  img_proc: true
- pgno: 307
  md: '无原因的气场不合：


    没有发生过摩擦，但从感官上面不喜欢这个人。

    甚至对方并不知情，你对他的感官认知。


    首先要从思维认知层面知道气场不合的原因，这样才能在执行过程中理性地避免或者预防过多的摩擦，知道什么时候该退一步，保证正常工作。


    # 【关系】


    人际关系层面：我一定要和 ta 合吗？是否会影响我的未来工作？我们的摩擦无可避免吗？如何才能更客观判断？


    第二，要从人际关系上面去判断两个人的职场地位以及对立方关系，如果说两者的职位或者能力甚至是工作的阵营不一致，那么是很容易导致双方不合'
  merge: -1
  img_proc: true
- pgno: 308
  md: '的。在两者有偏差的时候，就必须在工作开始前设立客观的评判标准与人员。


    如果是因為之前的摩擦才产生了气场不合的，那么也可以从这次合作中仔细观察是否有误解，如果有的话，那么也许也是一个很好的缓解机会。


    # 【执行】


    行动层面：我会是否因为气场不合而没尽力工作？ta 是否有同样的问题？


    第三，带着气场不合的认知会容易产生个人的负面情绪，而负面情绪可能对效率或者执行都会带来一定的影响。所以如果从一开始双方都带着负面情绪的话，建议从一开始就应该袒露心声，并且设立工作截止时间以及标准要求，避免双方负面情绪导致工作停滞或者失败。'
  merge: -1
  img_proc: true
- pgno: 309
  md: '# 建议：


    # （1）设立沟通立场


    如果双方本来就有矛盾，那么从开始就应该袒露立场，希望对方以本次工作为重心，放下成见，发挥各自优势，有任何矛盾工作之后可私下解决。


    # （2）工作目标


    双方合作要共同往一致的目标方向前进，避免更多的争端。


    # （3）工作分解


    根据合作项目进行工作分解，落实每个人的工作任务，以及在每个任务的时间截止与评判标准，保证工作的执行进程与质量。'
  merge: -1
