- pgno: 575
  md: '# 「曹将和朋友们」2021 年第 13 期密圈互动：


    “如何管理他人对自己的预期？”


    由小助理星雨先开始。


    核心从管理上级预期和同级预期，来看这个问题。


    首先，是对上级的预期管理。


    这里分为刚入职和入职一段时间后。


    刚入职的时候，需要充分满足领导的预期，意思就是说如果领导的期望值是 90%，那就需要努力做到 100%，让作为新人的自己，让领导看到自己快速上手的能力，和新人要留下一个好的第一印象是一个道理。


    紧接着，入职了大半年后，可能领导慢慢给你的活儿越来越多，你会发现自己被压得死死的。'
  merge: -1
  img_proc: true
- pgno: 576
  md: '这时候，就需要“管理“上级领导的预期，其实指得就是适时的“降低“预期，让领导知道你完成的难度，以及让你你的目标可以更好的达成。


    常见的几种方式，就是 1. 澄清现在手里的活儿的优先级；2. 可以完成领导预期的目标，但还需要 xx 资源辅助；3. 拖延时间。


    其次，是同级的预期管理。


    遇到举手之劳，当然是尽全力帮忙同事。


    同事和自己是打配合的角色，所以在预期管理上，自己一般都是如果别人的预期是 60，那自己会争取做到 70，如果 80，自己会争取达到 90。


    核心是让和自己配合的同事，充分的了解和认可自己。'
  merge: -1
  img_proc: true
- pgno: 577
  md: '但另一个层面来说，同级间好的预期管理，需要建立在事先约法三章好的内容上。


    举个例子，很多时候和队友间的配合，对方会有一些本不该你完成的需求，但鉴于你把之前的自己包装的过于有能力，预期就会放得比较高。


    到了这时候就需要通过时间不够、需求反向推回去等方法，管理同事对你的预期。


    以上。'
  merge: -1
  img_proc: true
