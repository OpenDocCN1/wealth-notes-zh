- pgno: 20
  md: '# 03. 兔子


    2020 年，我在职场上学到的三个道理，其实也不算是道理。


    今年从一线岗位转变到中后台，对我来说是一个成长的过程


    在这一年的工作中，对我最重要的三个点：


    +   1. 重要的事情说五遍


    第一遍：告诉员工需要做什么


    第二遍：让员工重复一遍


    第三遍：让员工分析这个事儿的目的


    第四遍：让员工分析遇到事情意外怎么办'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 第五遍：问这个事情员工有什么想法和建议


    ①对于带团队：我们总是说员工执行力有问题，做事情达不到我们的预期，其实员工的执行力=领导的领导力，我们可以通过布置工作说五遍来提高员工执行力。我们在沟通的过程中也是一个导航的功能，看员工是否有偏离本来的方向，在这五遍说完之后基本上员工能够知道自己应该做事情，我们也能知道是否能够达到自己的预期。但是简单的事情就可以不说五遍啦～


    ②对于自己做事情：通过这几步来让自己厘清楚事情的方向，厘清自己的思路，这样能够更好的达到预期目标。


    # 2. 工作项目制'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 将大的项目拆分成子项目和设定责任人与截止日期


    ①拆分成子项目可以让一个复杂的项目，变得清晰、可行，完成分拆后的工作包，也能给我们带来阶段性的目标感、成就感。


    我们可以按照项目的工作内容属性，进行分拆。比如说，如果要进行年会筹备，就可以分拆为：选场地、排节目、买礼物等等。也可以按照项目的阶段属性进行拆分，比如：年会开始前、年会进行中、后续收尾工作等等。


    项目拆分应该遵守 MECE 法则，尽量做到“不漏不重”，一般我的方法就是把项目分拆完之后，就得反过来问自己一个问题：这些事都做完了，是不是代表这项工作就完成了？'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# ②设置责任人与截止日期


    项目需要拆分到落实个人的情况，责任为一个人，而且每个项目需要有一个达成共识的时间，这样我们才能更有产出。


    # 3. 流程事务清单化


    工作中有很多事情是可以形成步骤和清单的，特别是对于纯执行的事情，看到清单就可以工作，今年产出的清单还有几个：「开课清单」「自检清单」「信息登记清单」等等～


    以上是我分享的今年对我的工作最有指导意义的三个点，通过布置任务说五遍提高了工作效率，减少重新推翻返工的情况；通过工作项目制能够责任到人，及时了解工作进度以及情况；通过清单让新人能够快速上手工作。'
  merge: -1
