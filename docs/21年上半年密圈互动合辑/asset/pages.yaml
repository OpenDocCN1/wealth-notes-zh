  md: '如果我们能跟身边的人聊一聊，那样最好。如果不行，那就干脆不要看别人怎样，而是更加关注自己，找回自己的节奏，给自己些时间，一步步来。


    综上所述，面对“工作积极性降低、动力不足”时，我们更要肯定自己、踏实做事、留些时间、找回节奏。调整好心态，你很快就可以上路了。


