  md: '# 13. 大丽


    好久没写作业了，突然很想完成一下，不知道要说什么，就把自己在职场中觉得好的做法分享给大家：


    第一，早到，晚走。这是一个非常好的习惯，不是为了显示你多么勤奋。我上大学的时候，老师们一直认为我是好学生，其实我只是个中等生。工作后，早到，是为了给自己更充足的准备时间，晚走，是希望陪领导多待一会，不至于在想要干活的时候，空无一人，而且等领导走了之后再走，也是一种尊重和礼貌。


    第二，做好向上管理和向下管理。向上管理，是处理好跟领导之间的关系，要适应不同领导的工作方式；向下管理，是要与同级或者下级都处好关系，也就是要大家说你好，你才好。'
