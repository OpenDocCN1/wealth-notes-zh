    「曹将和朋友们」2021 年第 3 期密圈互动：


    > “今年过年你有什么打算？准备怎么实践它？”


    先由小助理星雨，分享下自己春节的规划。


    建立在自己能返乡的基础上，给自己囤了 7 天的过年时间，虽然不能外出游玩了，但是宅也要宅得有尊严，值得好好安排。


    Day1-3：


    自己会留出前两到三天的时间陪伴家人，不会刻意做些什么，就回到被老母亲催着起床的旧时光，陪爸妈吃顿早饭、午饭、晚饭，聊聊北漂的生活，主动做些家务，洗碗、拖地、收拾书房，“认真”关心起父母的身'
