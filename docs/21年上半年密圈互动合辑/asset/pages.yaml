- pgno: 331
  md: '# 03. 银璃


    1、没有树立正确的工作观，认为拿多少钱干多少活，上班摸鱼，工作中拈轻怕重眼高手低。


    应对：从职业发展来说，你走的每一步都算数，现在偷的懒将来都是要还的。改变打工者心态，为自己工作。


    2、没有形成良好的工作习惯。粗心大意，不复盘，不长进，重复犯一些低级错误。


    应对：意识上重视起来，操作上建立自己的常犯错误清单，对照检查，做到文经我手不出错。


    3、没有考虑过职业规划。现有单位貌似不错，但只是大公司的一颗小螺丝钉，职业路径越来越窄，但得过且过，对未来没有规划，与外部逐渐脱节。'
