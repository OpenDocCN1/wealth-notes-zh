- pgno: 494
  md: '# 10. 晨燕小步跑


    职场思考：「及时反馈」、「限时完成」、「善用工具」。


    1、及时反馈，指的是赶在领导问你前。


    闷头干活，个人职场能见度低，当领导问进展的时候，已经晚了。所以最好在工作一开始，和领导汇报下目标、现状，可能遇到的难题，应对措施；工作过程中时不时和领导报阶段性进展。让领导对事情有掌控感。


    2. 善用工具：一键录音转文字，特别方便！


    有个通讯工具叫飞书（字节跳动官方用的通讯工具），飞书有个功能叫飞书妙记，直接用这个飞书开会或者上传语音，可以很快转为文字且区分说话人，'
  merge: -1
  img_proc: true
- pgno: 495
  md: '非常方便！！！比讯飞听见 app 转换速度快一些而且免费哦。


    # 3、限时完成。忙碌不是成就哦。


    开始做事前，先自问一下，我做这个事儿是什么目的，谁要看这份成果，这样做事的思路会清晰很多。很多时候接到一份任务就开始做，忙碌又不是成就。想一想这个任务和部门有什么关系、和个人有什么关系，要什么成果，做起来会思路清晰一些。更重要的是，给自己限定一个时间。'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# 11. 陈小厨


    以往自己经常想的多、做的少，担心自己做的不

    好，不敢主动与他人交流和分享。近期自己开始做出

    行动，让自己的一些想法落地，所以希望通过分享，

    给有同样困惑的朋友带来一些帮助。


    +   1. 如何说服别人或自己在设立目标后付出行动？


    不要试图说服别人去做那些最需要改变的事情，

    而是挑一个最可能做到而非最重要的目标，重点放在

    他的下一步而非最后一步，学习拆解说服目标。举例

    子：


    说服目标：员工比较佛系，希望鼓励员工今年业

    绩超过 100 万。


    拆解目标：'
