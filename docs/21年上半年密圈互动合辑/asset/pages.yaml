- pgno: 373
  md: '对我来说有两个好处。


    第一，它给我的心理形成了一个暗示：一天才刚刚开始，我已经完成一件事了，我在一天的开始就拥有了做成一件事的成就感。这会促进我后面这一天的办事积极性。


    第二，我每天会很整洁地来工作和生活。


    2. “叠完被子后，我将可以摘眼镜。”


    这个，摘眼镜我解释一下。我近视，晚上睡觉戴角膜塑形镜（又称 ok 镜），早晨摘掉以后就视力超神了。


    所以，摘眼镜，是我以前晨间必须要做的事情。


    但是叠被子，是我最近新加的习惯。'
