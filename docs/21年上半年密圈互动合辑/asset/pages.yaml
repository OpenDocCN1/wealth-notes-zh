- pgno: 171
  md: '中文版和外文版的封面差异，很多时候就能发现问题，比如某几本书，英文版可以说是大气磅礴的史诗级大片海报的气势，到了中文版则变成了卑鄙小人的作态，如果不看英文版可能还觉得中文版凑合看，一对比真心觉得太烂了。见得多了，再去做排版、做PPT，哪怕自己做的还很一般，至少能看出其中的机关要害之处，有时候可能都不需要大的改动，只要把某个小地方稍微改一改就可以脱胎换骨。


    以上就是我最近的一些感悟，希望对大家有所帮助。只要用心，生活中处处都是学问，都是学习和提高的素材，很多甚至是别人看不上的“垃圾”，变废为宝不只关乎能力高低，其实也和心态息息相关，多问几个为什么，多一点耐心和善意，可能会得到意想不到的惊喜！


