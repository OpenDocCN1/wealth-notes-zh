- pgno: 506
  md: '# 14. 陈少安


    # 一、读懂领导的框架


    上周，将哥的课程分享了一个【读懂领导的框架】：溯源-衡量-参照-重述-汇报。


    这个框架很好用，能解决领导交代任务时，我们不知如何开展的情况。


    特别是【衡量】环节，我们要防止获取一些“虚”的信息。


    像我跟其他部门领导沟通培训需求的时候，就经常会遇到。


    当我问到【部门预期的培训效果】时，销售领导的答复往往是：让一线成员掌握或了解这个知识点即可。'
  merge: -1
  img_proc: true
- pgno: 507
  md: '其实每个人对【掌握】或【了解】的理解是不一样的，所以我们还需要落实到【具体行为层面】。


    例如：培训后，是希望一线成员的考试通过率达到多少或一线成员能够复述出什么知识点，才算是掌握。


    起码有个标准，方便我们后期去把控。


    在这个框架里，我可能还会加上一个环节，就是会输出简单的会议纪要。


    一般谈完，我会习惯性花一两分钟做下梳理，并整理成文字形式，发给领导。


    目的有两个，一来可通过文字的形式再次进行确认，二来经过自己梳理，会对这个任务更加清楚。


    # 二、高难度的事情安排在上午'
  merge: -1
  img_proc: true
- pgno: 508
  md: '以前我总习惯在上午工作的时候，处理一些简单的工作，美名曰是让自己慢慢过渡到工作状态，但处理完这些简单琐碎的事情后，一上午也就快要过去了。


    而工作难度较大的，就只能安排在效率不高的下午来处理。


    目前很多数据表明，我们精力的巅峰大部分会在上午，而下午，我们处理和思考能力会大幅度下降。


    所以早上给自己安排工作的时候，可把难度较高，挑战性较大的工作安排在上午，确保我们自己在精力最佳的情况下，高效率完成重点工作。


    # 三、跨部门协作时，突出对方利益很重要


    在职场中，我们百分之百会遇到的事情，就是跨部门沟通。'
