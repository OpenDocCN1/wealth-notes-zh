- pgno: 239
  md: '但其实，你也是在进步的，只不过别人迈得步子大了一些，而你的步子小了一些而已。所以，千万不要用自我否定来伤害自己，否则就会陷入无尽的循环之中。不如安静的坐下来，翻翻自己以前的日记或者总结，看看自己这几年来有什么改变。记忆是带有选择性的，当我们情绪低落时，常常会忘记自己好的一面，而尽是自己的缺点和不足。这个时候，我们更应该看到那个完整的自己。


    总之，先肯定自己，再把眼光放得长远一些。


    * 为什么我对原来热爱的工作失去了热情？


    感觉这跟谈恋爱似的，最初两个人被彼此吸引，但是接触时间长了，你就会发现对面这个人并不是你当初所以为的那样。也就是说，我们会随着时间的推移，才逐渐了解一个人的全貌。'
