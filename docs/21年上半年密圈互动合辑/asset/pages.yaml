  md: '# ② 借用上级力量推动


    平级同事涉及核心关系，那一定要借助上级领导力量。


    比如你负责的项目因某个同事导致项目无法按时完成，私下饭也请了，好话也说了，仍然无进展，这个时候就需要上级领导支持。


    # ③ 赛马机制，必争第一


    职场中，领导最喜欢的一个方法就是：“赛马机制”。


