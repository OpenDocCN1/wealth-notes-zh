- pgno: 466
  md: '昨天下班的时候，我去找一个营销的同事一起讨论样本折的事情，讨论完之后我说我请你们去吃素食吧！两位同事就愉快的答应了。


    我们一起出发去石鼓路旁边吃饭，吃着饭营销的同事也聊起了一些了工作上的事情。这位同事分享的几个点，我觉得挺受益的，分享给大家：


    +   1、如果有流程的话，事情尽量按流程走。


    这位姐姐有分享到我们部门在做一些事情有时候是不按流程走的，如果这放在以前的公司，她会觉得我们在背后做手脚，因为在以前的公司大家都是这么认为，所以公司规定员工需要非常严格按流程办事的，特别是涉及到金钱部分。但是在工厂端大家其实没有这块的意识，所以才会出现不按流程办事的情况。所以就会看到，其实按流程办事，有时候其实是在护其他人的念。'
  merge: -1
  img_proc: true
- pgno: 467
  md: '# 2、领导对你很随和，但你不能太随意。


    同事有分享到。公司有一些领导还是很注重层级关系的，但是有一些领导是很随和的，所以当领导对下属很随和的时候，我们有时候也经常会随意起来，但是他有一天意识到领导可以对我们很随和，但我们不能因此变得随意，如何处理上下层级关系是基本的职业操守。


    # 3、把自己的工作做得更好，不只是完成


    这位同事主要负责组织整个营销的开会，所以他们在周末的时候就需要收集各部门数据，每个数据收集完，他还需要把数据整理清楚，因为数据不清楚，表格有错误被骂的都是他，所以对自己要提出去的东西负责，在处理数据不仅仅是完成，而是尽可能的完美。'
  merge: -1
  img_proc: true
- pgno: 468
  md: '# 4、用心观察 找到和每个人沟通的方式。


    同事说有时候他开会的时候发现其他部门有问题，他不会去直接找这个部门的领导去沟通，而是会通过自己的上级去阐述这个问题，并说明这个问题的严重性。然后经由她部门领导去沟通。并且她发现她的领导跟她沟通事情的时候，因为她她年纪比较小，所以都是直接说。但领导跟年纪比较大的部门负责人沟通时，都是会很委婉地提起，看到每个人的沟通就是为了让别人能舒服的改变。


    # 5、细节非常重要


    同事分享说越高的领导越注重细节，所以在细节处要去把控好每一个标点符号，每一句话，每一个字都是需要去认真核对的，细节决定成败，在细节之处用功才是每个人真正的区别。'
  merge: -1
  img_proc: true
