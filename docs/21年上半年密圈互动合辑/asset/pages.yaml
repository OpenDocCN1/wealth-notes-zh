    # 二、不同部门


    # 1、以领导为中心


    所谓的以领导为中心，就是自己的工作完成后是否能够让本部门的领导满意。举一个简单例子：我和小A是两个部门的主管，公司一项工作是他们部门牵头，我们部门协助完成，在我完成我的对应部分之后，小A对相关内容存在异议。且总是找各种无厘头的理由让我修改各种方案，但我把我完整的工作思路和内容向我们部门的领导汇报之后，处长直接和对方的处长沟通，事情就一下子解决掉了，所以有时候不合拍没关系，只要领导之间协调的好，完全可以避免。'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# 2、目标导向


