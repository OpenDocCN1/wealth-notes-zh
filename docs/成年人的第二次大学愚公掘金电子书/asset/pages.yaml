  md: '# 昨天是世界读书日，推荐几本认知提升、金融理财、运营销售、物理天文的好书吧


    今天是世界读书日，经常有人私聊让我荐书，干脆今天推荐几本：


    如果你想看商业史，推荐《浪潮之巔》、《激荡三十年》、《零售的哲学》。


    说实话，这些书我看的比较早，很多内容都忘了，像《浪潮之巔》这本书，2011年刚出的时候我就看了，七八年过去了，我还记得“从成立的那一天起，企业基因就决定了它的宿命”，对我影响非常深。'
  merge: -1
  img_proc: true
- pgno: 1049
  md: '如果想提升认知高度、想看完书有一种“我靠这个思考模式好厉害”的感觉，推荐《人类简史》、《枪炮、病菌与钢铁》、《失控》。


    如果你想看运营、销售类，推荐《故事经济学》、《超级符号就是超级创意》、《影响力》。


    如果你想看金融理财，新手推荐《穷爸爸富爸爸》，学术点推荐《经济学原理》，另外还有《中央帝国的财政密码》、《权力的边界：税、革命与改革》。


    如果你想看物理天文，没错，看物理非常有益于提升思维高度，前提是能看懂……入门有趣的推荐《量子力学史话》，专业点的推荐《皇帝新脑》、《宇宙的琴弦》。


    当然，如果实在看不懂，又想看物理相关的，可以去看科幻小说。


    如果你想看历史，看的太多了推荐不过来……'
  merge: -1
  img_proc: true
