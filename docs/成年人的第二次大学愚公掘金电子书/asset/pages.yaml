  md: '虽然，工作了大半年，不过我应该不算是进入行业，认知还比较局限，加了您的星球，还希望前辈能帮忙分析下。我愿意为提高认知付费，只求尽量少走些弯路。”


    # 回答：


    **1.先根据你的描述，** 大概判断你处在产品一只脚刚入门的阶段。我不知道你有没有想过，为什么工作两年，仍然只有一只脚入门？答案你心里很清楚，你的公司不行，你只是流水线上的一个螺丝钉，拧了两年和拧了两个月区别不大。


    **2.所以，** 你要明白，哪怕你今天专门去学习产品技能，学完如果进了一家垃圾公司，你还是在虚度光阴。你报班只能学 10个月，但你要工作多久？几十年。你觉得是工作中学到的多，还是培训机构里学到的多？


    好的工作环境，永远是最好的老师，不管任何人来问，我都不建议在不工作的情况下去学习职业技能——这种背水一战、孤注一掷的做法，非常不明智。提升工作能力的最好方法，一定是边工作边利用业余时间学习，就好像拓宽收入来源的最后方法，一定是边拿工资，边尝试获得其他非工资收入。'
  merge: -1
  img_proc: true
- pgno: 596
  md: '3.问题现在很明显了，你的第一选择，一定是先去一家有好的成长环境的公司。你可能会想，我这么菜，好公司我进不去啊！


    错了，我们想一想，什么是好公司，只有大公司才是好公司吗？不是的，有非常多的创业团队，中层都是大公司出来的，职业素养很高，但因为创业团队不好招人，所以他们往往会降低对职业技能的要求，不会做没关系，他们可以教，他们喜欢招性格好、学习能力强、有耐力的入。这才是你最好的工作环境，至于怎么找到靠谱的小团队，核心就是多面试，做好面试三十家的准备，千万别急，和长远的未来比起来，这点付出是很值得的。具体到怎么通过面试判断公司是否靠谱，看这篇回答：https://t.zsxq.com/vnubmyf


    我建议你，只要团队靠谱，先去上班是上上之策。


    4.如果第一选择实现不了，好的成长环境的公司实在是进不去，可以报培训去学习吗？可以，但不要一开始就报上万的培训课程。我在这篇回答里（https://t.zsxq.com/Y7EAYRb）详细说过，怎么判断培训课程值不值，一定要仔细看。'
  merge: -1
  img_proc: true
- pgno: 597
  md: '对你来说，先自学，然后去面试，如果还不够，报初级便宜的培训（比如三节课），再去面试，如果还不行，再去报更贵的课（比如暖石。起点学院）。这是典型的用最小代价测试效果的思路，作为产品你应该掌握。


    **5.想从产品经理入门，进而掌握整套商业需要的认知和技能，这个思路可以吗？** 没问题，事实上，互联网行业里，产品和运营是天然可以接触更多信息的优势岗位——只要你够主动。


    **6.最后，提醒你，也提醒所有职业初期的花友，** 千万不要根据工资选公司，一个月多一两千，两三年里你也就多赚几万块，这几万块放在你整个人生的财富里，占比真的没多少。但你如果为了这点钱，在最好的年纪选择了一个垃圾公司，可能要耽误小十年时间。钱现在不赚，以后可以赚，年轻的时间没了，就真的没了。


