- pgno: 788
  md: '# 新媒体岗位求职，有什么要注意的？


    提问：


    花爷好，想咨询下职业发展的问题：一年新媒体策划运营的经验，目前在准备转岗产品运营。基础知识有所了解，但还不算系统。5月份打算投一家二手书小程序的平台，我仔细查看招聘要求并且花了近一个月的时间整理了产品分析、竞品分析及用户成长体系的资料；而且尽可能将简历内容往产品运营的职责任方向靠拢。但是没有收到任何消息，甚至给hr发的消息也没有回复。


    之后又投了两家产品运营岗位，但是没有像之前准备那么详细。（简历里没有产品分析之类的资料）'
  merge: -1
  img_proc: true
- pgno: 789
  md: '由于成都的产品运营岗位发布有限和其他原因，目前暂时停止了投简历，打算多看一些运营的书。想问下，我这样的准备求职方式有没有问题呢？对于没有直接经验的产品运营小白有什么建议嘛？


    # 回答：


    你的求职方式大体上是正确的，有两点可以注意：


    1.花一个月去做竞品分析的资料这事儿别干了。


    为什么求职时，带对方的产品资料会加分？因为让对方看到了诚意，同时可能某些观点让对方认同或者感兴趣，愿意给面试机会让你聊聊。


    但准备一个月就矫枉过正了，你不了解内部情况，准备的越多越容易出错。


    另外，所有人、做任何事，切忌孤注一掷，对找工作来说，花一个月时间成本太高了，很容易拉升期待值最后无功而返。'
  merge: -1
  img_proc: true
- pgno: 790
  md: '+   2. 你需要理解，职场本来就是互相选择，公司没有回应你，不代表你不优秀，可能是不合适，也有很多公司挂着招聘职位，其实根本不缺人，不用太放在心上。


    理解了这些，再就应该明白，招聘不仅看自己的质量，也靠投递简历的数量，数量越多越容易碰到合适的公司——所以花一个月准备一家公司也是不明智的。


    正确做法是，筛选一批意向公司（5-10家），根据公司要求修改出不同的投递简历。每家简历修改0.5-2天，视公司重要程度而定。


    最后你提到系统的学运营，其实大部分运营都是不系统的，公司侧重哪方面，你哪方面学到的就比较多。不用着急，只要你在学，慢慢会积累起来的。


    我倒是想给一个建议：


    成都的互联网圈子相对较小，可以考虑慢慢的加一些当地的运营社群。一方面了解当地的信息和渠道，另一方面，多展示自己的能力，逼自己输出，等你工作三年以后，你应该是靠朋友内推找工作，而不是招聘网站投递简历。'
  merge: -1
  img_proc: true
