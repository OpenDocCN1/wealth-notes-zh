  md: '# # 武夷山优质茶资源，怎么做推广好？


    # ## 提问：


    花爷您好，见字如面。最近在以茶为桥重新沉淀客户，更新交际圈。后期想做一个自己的茶叶品牌。


    现有资源：1武夷山茶山，自产自销，有茶叶源头。2品质好，性价比高，在自己的朋友圈中有一些客户。(基数不多，因为之前都是自己招待客户朋友用茶，没有特意去卖)


    思路:1线下企业走访，先弱化销售以交流学习，分享茶文化为主。主打性价比工作茶。2线上推广，(正经茶，不会有微信那种茶叶女的故事)和社群的资源对接。


    目前处于先干后学的状态，思路不是很清晰，望不吝赐教，万分感谢。'
  merge: -1
  img_proc: true
- pgno: 622
  md: '# 回答：


    借着你的问题，给所有卖货的小团队提几点建议。


    很多人都知道，卖货是次要的，主要是卖品牌。道理很多人都懂，但是什么是品牌呢？品牌这事儿啊，对大企业来说很复杂，但对小团队来说，其实特别简单。


    # 1. 品牌是与众不同：


    武夷山黄山庐山，那么多名茶，你到底有什么不同？


    你可以在社交上不同：这茶啊，本市大领导都爱喝，求人送礼，管用有面子。


    你可以在功能上不同：这茶啊，有 xxx 成分，常喝控制高血压。


    你可以在价格上不同：这茶啊，每天花 0.5 元，可以喝到 1000 元/斤的品质。


    你可以在制作上不同：这茶啊，老农纯手工制作 120 天，你看，这是每天的制作跟拍视频。'
  merge: -1
  img_proc: true
- pgno: 623
  md: '每一种不同，都从用户需求出发，想送礼、想健康、想便宜、想原生态……


    明白没？用户有多少种需求，就可以有多少种不同。


    茶叶啊，它不能只是茶叶。


    # 2.品牌是专一：


    虽然茶叶可以有很多种不同，但一个品牌，只能占据一种不同。


    所以回到问题，你到底是想通过社群卖给大众，还是想通过走访卖给企业家？


    同样的茶叶，卖给大众可以30元/斤卖十万斤，卖给企业家可以1000元/斤卖一万斤，两者都没毛病，但你一定得中选一个人群，包装、定价都跟着人群走。


    # 3.品牌是讲故事：'
  merge: -1
  img_proc: true
- pgno: 624
  md: '你看那些大牌，不是源自1894，就是有个传奇故事。我记得有个叫海蓝之谜的牌子，说创始人是太空物理学家，做实验被烧伤之后，专心研究祛疤护肤，于是创造了海蓝之谜。


    太蠢了吧这故事，但是妹子们信啊！（说到这为什么我和我的钱包哭了）


    所以，当你选定了目标人群和品牌的定位，请围绕产品特色，包装一系列精美的故事——因为用户就是喜欢听故事。


    举个例子，你想凸现茶叶的性价比，那你 要让用户知道，你和1000元的茶叶是同一条生产线，而你只卖50元。为啥你不卖1000呢？因为1000元的茶叶，有严格的筛选流程，中间很多稍微差一点的茶叶都被淘汰了，但这些被淘汰的茶叶其实口感也非常好，于是茶农就将淘汰的茶叶收集起来带出大山......


    好吧，故事是我随口编的，但核心就是，用户不傻，想要让用户相信你的卖点，就需要一个完美无缺的故事。'
  merge: -1
  img_proc: true
- pgno: 625
  md: '最后，对个人创业者来说，你自己也可以是个好故事。还是拿性价比茶叶举例，如果你有一系列故事，证明自己是个茶叶渠道专家，专门收集性价比高的茶叶资源，是不是更可信了一点。


    当然，讲故事，不是让大家胡编乱造去骗人。而是让你在自己的真实优势基础上，适当做包装，这几乎是所有产品品牌约定俗成的文化了。


