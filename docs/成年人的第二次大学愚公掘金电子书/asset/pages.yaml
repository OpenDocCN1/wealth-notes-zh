    数据是具备底层逻辑的数字，否则只是数字而已。然后静默转化指的就是消费者看到你这个链接，直接进行购买。静默转化率背后的决定因素就是：主图视频、主图、销售氛围（成交数量）、评价、问大家、详情。


    （权重排行为降序。）也就是你要根据消费者的浏览习惯来决定你在每一个模块需要给消费者看到什么，才能促使消费者认可你这个产品是他想要的。


    询单转化指的就是看完你的链接后，去咨询客服后成功购买的几率。这里面考量的是：1、客服能力（产品专业度、引导能力、权限等）我们公司现在已经对客服岗位做了升级，称作客户营销员。


