- pgno: 856
  md: '# 经营低频商品（大家具），想要拓宽销量应该怎么做？


    # 提问：


    花爷好，家具厂欠款拉了一批家具抵货款，价格都是出厂价卖，刚开始呢，都是在自己的同学群里，或者关系比较好的推荐给他们，因为出厂价确实远远低于专卖店价格。同学朋友又给我介绍同学朋友，结果找我买的人不少，有找不同风格的我我就找相应的厂家配合。本身平时打交道的都是家具厂资源，我拿到低价格，在朋友圈儿也卖了不少，但毕竟家具是大件的东西，没个几年一般不会换的，虽然现在还能卖，但我在想，如果朋友圈儿的人卖过后还有什么方法可以卖给其更多的人？怎么更好的利用手上这些家具厂资源？希望有些思路的提醒和建议，谢谢！'
  merge: -1
  img_proc: true
- pgno: 857
  md: '# 回答：


    正常情况下，这种情况肯定是建议你收代理做分销的，但即使是分销，仍然会很快出现瓶颈，家具的购买频次低，代理出不了单，热情会很快下降。


    你看，问题的根，不在销售策略上，而是产品矩阵上，主要有三个问题：


    +   1. 家具价格高、购买频次低


    +   2. 家具运输困难，覆盖范围以本地为主


    +   3. 家具制作过程复杂，单个产品很难跑出高销量


    解这三个问题，两个思路：


    # 1. 提高获客效率


    价格高，购买频次低，侧面也就说明了单个用户的价值很高。建议你考虑经营快手，内容不用太复杂，带着大家看工厂的家具制作过程，体现出匠心、性价比，本地人可以直接加微信，现场看货低价买。'
  merge: -1
  img_proc: true
- pgno: 858
  md: '# 2.丰富产品矩阵


    既然大家具不会经常换，那试试扩展更多小产品。比如实用型的小家具、生活用品等等，把品类从家具扩到家居用品去。


    这么做三个好处，第一，通过快手加到微信的粉丝，可以用更多产品触达他们，形成性价比家居卖家的定位。第二，不是本地的用户，也能通过快递购买。第三，如果你要搞活动把免费用户转成付费，不可能拿家具搞活动，便宜的小家居更适合。


    当然你可能会说，你没做过快手，你也没有家居资源，你手上只有家具工厂，可能他们只会做大家具。那我只能告诉你，生意做到一定程度，想再上一步，就是要主动拓宽资源、投入一些成本的。


    相比继续在家具这个行业里做大做深，我觉得你扩展更多品类的操作性更强，投入也更少。'
  merge: -1
  img_proc: true
