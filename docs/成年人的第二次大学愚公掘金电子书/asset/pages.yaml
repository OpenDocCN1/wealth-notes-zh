- pgno: 487
  md: '# 在面对一些需求的时候，有没有一个方法论来验证这个需求是伪需求还是真痛点？


    提问：


    在面对一些需求的时候，有没有一个方法论来验证这个需求是伪需求还是真痛点？


    回答：


    其实严格来说，需求没有真伪，只有优先级。比如你有一个特别奇葩的需求，这个需要当然是真需求，只不过影响很小，优先级低而已。'
  merge: -1
  img_proc: true
- pgno: 488
  md: '明白这个道理，我们就能理解——需求的优先级，其实只跟影响利益的大小有关。那么衡量一个需求，最主要就看这个需要能影响多少利益：


    +   1. **谁的需求：**有人觉得，需求的优先级是按影响的用户人数来算的，完全错误。你的用户也是分三六九等的，核心用户、高净值用户的需求，权重自然就高一些。甚至企业发展到一定规模，需要抛弃收益低的用户，全力投入到核心用户的发展上去。你去一家高端餐厅，人家是不出便宜的菜谱的。满足低端需求的最好方法，是另开一家子品牌餐厅。


    +   2. **影响范围：**在这里，你需要注意到沉默的大多数。可口可口可乐之前有个经典的例子，说是一部分用户觉得不好喝，可口可乐按照他们的要求改进了，结果之前沉默的大多数用户批评声更大（不知真假，反正说明了这个道理）。所以，当你在改善20%用户的体验时，记得想一想有没有触犯到剩下的80%。'
  merge: -1
  img_proc: true
- pgno: 489
  md: '3.符合商业目标：很多公司其实搞不清自己的商业模式，觉得市面上谁牛逼我就学谁，错。拿我举例子，我的粉丝数其实不算多，但增长稳定、付费转化奇高，这得益于我早期一篇篇的精品文章保证了粉丝质量。如果我去搞活动搞裂变，弄来上万粉丝，一个个去聊让她们转化付费，很可能效果没达到，投入的人力成本更高。同理，你拿到一个需求，不能光看到涨粉、提升用户体验、用户觉得好这些虚的东西，想一想，符合你的商业模式吗？


    4.成本：很简单的道理，收益一定要大于成本吧？需求实现需要钱、需要人力，如果这个需求给你实现带来的收益，小于投入的人力物力成本，那肯定是不值当的。当然，大家遇到最多的问题是，我也不知道能带来多少收益，这时候需要绕一个弯，想一想有没有更简单的解决方案，先小范围小成本的验证一下是否可行，这也就是创业常说的MVP模型了。'
  merge: -1
  img_proc: true
