    我相信，上面的道理，星球里不少花友都懂，但问题是，还是有大把的人往盘子里跳。


    这里的人，无非两种，第一种是真傻，听到大涨就按耐不住，第二种是觉得自己足够聪明，能在大涨之后、收割之前挑出来。


