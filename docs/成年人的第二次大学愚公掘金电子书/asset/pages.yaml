- pgno: 832
  md: '# 花爷如何看待宠物店生意？行业门槛以及和互联网结合的机会会有哪些？


    提问：


    花爷怎么看待宠物店的生意？现在一二线城市中产消费力的提升与越来越低的结婚率、生育率，感觉都在催生宠物行业的发展，那么做这个行业的门槛主要是哪些，和互联网结合的机会可能有哪些？


    回答：


    宠物行业主要分三块，售前：卖宠物；售后消耗品：狗粮等等；售后服务性产品：兽医、宠物旅游等等。'
  merge: -1
  img_proc: true
- pgno: 833
  md: '综合来看宠物行业肯定是个增长性的行业，而且各个相关生意的利润率都高，不妨想一想，为什么利润高呢？


    因为大家都不懂啊！


    养宠物的需求几乎是最近几年陡然爆发的，但还有大量消费者的基础认识没有跟上。卖幼猫的利润率高，因为分不清好的坏的、血统正不正，怕买到不好的猫但又不舍得扔会遭罪；卖宠物粮、宠物看病的利润高，也是因为消费者分不清什么好，什么坏，没办法只能买贵的，毕竟宠物就跟儿子一样。


    在这个背景下，第一波收割红利的，一定是做科普、积累信任货币的人。做幼猫的科普，你信任他了，就在他那里买，不然你怕被骗；做宠物粮的科普，做兽医的科普，同样的道理，积累信任货币，就能带货转化成真正的财富。


    在这一波里，已经有不少人做起来了，你去淘宝搜搜狗粮，一定能找到网红兽医在卖狗粮，这类狗粮大多宣传是手工狗粮——亲手做的，这就是信任转化啊！'
  merge: -1
  img_proc: true
- pgno: 834
  md: '那到了第二个阶段，又会出现第二波收割红利的人，他们同样是积累信任货币，但积累信任的方式是：找第一代网红的茬，说第一代网红哪怕科普是对的、卖的东西也太贵了，然后进行新一轮科普。


    这轮科普里，除了第一阶段的知识正确性，还会注重性价比的宣传。于是第二波红利的带货方式是：不仅要信任，不仅要产品好，而且要性价比高。


    不光是宠物行业，任何一个行业几乎都有这三个阶段：先野蛮生长坑蒙拐骗、然后科普宣传网红带货、最后又好又便宜宣扬性价比。


    本质上，每个阶段都通过否定上一个阶段的理念，将用户的认知升级，从而占领用户心智，实现带货的目的。整个过程中，用户的素质也在不断提高。


    下一代超越上一代最好的方式，永远是掀上一代的桌子。'
  merge: -1
  img_proc: true
