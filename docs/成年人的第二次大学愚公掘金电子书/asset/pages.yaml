- pgno: 906
  md: '1.希望老师们能做出个人品牌，要求有点高了，要么你自己做出个人品牌，要么你们机构做出品牌，总之主要看你，不能把希望寄托在其他人身上。


    2.位置偏、公寓开店，低价引流本身就是重要的方法之一，没啥好排斥的。你们知道去做复购，是好事，但复购不代表不引流，复购和推荐入学的比例就算再高也有个天花板。


    最好早点接受这个现实，对培训机构来说，招生本来就是工作的重心，指望纯靠复购和推荐是不现实的。


    我在另一个回答里，讲过完整的公寓美甲店的引流、留存、复购方案，你可以借鉴一下：https://t.zsxq.com/QbqzjYV


    3.做中端学员，还是看市场有没有受众，以及你的中端产品能不能打动受众。


    地理位置和楼层确实会有影响，但不是决定性因素。如果做中端课的话，建议试试你的低端学员能不能转化购买中端课，如果不能，那大概率不是引流之类的问题，而且课程本身没有吸引力。


    899'
