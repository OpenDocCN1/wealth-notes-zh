- pgno: 804
  md: '# 程序员怎么做运营和寻找副业方向？


    # 提问：


    花爷好，我是做java开发7年，目前越来越意识到自己的短板，做技术一直是便执行强，但是商业思维和运营策略知之甚少，花爷有什么学习路径推荐吗？或者副业方向？


    # 回答：


    首先我觉得大部分技术，真的不是没机会接触商业，而是没有主动去探索。最简单的方式，你公司的商业模式，每一次产品运营、老板的决策，你是否都能深刻的理解，不要单纯的觉得产品运营sb，退一万步说，大部分老板能成为老板，一定都有某方面的过人之处。'
  merge: -1
  img_proc: true
- pgno: 805
  md: '其次，人的发展也还是要结合自己的性格，不应该强求所有的技术人都要做好商业、运营、营销，能理解基本逻辑，站在其他人的角度思考问题即可。如果是纯小白，一开始还是看书最实在，我在之前推荐过各个类型的书（https://t.zsxq.com/qRZZVnA），里面说到的商业史和提高认知的书建议你先看看。


    最后，技术人的通病，不愿意跨圈子沟通。你自己也说了，工作里执行性质很强，其实大多数情况下，产品运营还是很愿意和研发聊聊天的。先从和公司的其他部门同事聊天做起，接下来再慢慢通过网络进一些群做交流，别陷在程序员的圈子不出来。也提醒下，别急，心态和思维是很难扭转过来的，给自己设一个比较充足的期限，比如一年，然后坚定不移的努力一年，一定会有所不同的。


