- pgno: 779
  md: '# 顶尖互联网公司的研发，想再进一步还有哪些路可以走？


    提问：


    花友提问，已经脱敏：


    “有个问题想请教一下，目前工作做的不是很开心，不开心的主要原因是工作没啥技术含量，看不到前途。我是在（国内顶尖互联网公司）做开发，但是实际得工作却是维护一个组内遗留的项目。现在有俩思路，一是好好干，争取在这些简单的工作上做好做出色。(但是目前来看这个实在不是我想干的)另外一个思路是出去看看，顺便看看自己值多少钱。”


    回答：'
  merge: -1
  img_proc: true
- pgno: 780
  md: '所有的互联网人，不管是产品运营还是研发，都需要思考一个问题：


    30岁之后，只有最多10%的人可以进入管理岗、或者创业做老板，剩下90%的一线互联网人届时准备拿什么去和能熬夜、有创意的年轻人拼？


    我目前的观点是，未来跟不上节奏的互联网人，会退回到二三四五线城市，对传统行业进行更细致的互联网改造。基本等于一种变相淘汰了。


    所以，30岁之前更要把进入管理岗和创业做自己的老板当做长期目标。


    你已经在国内最顶尖的互联网公司做研发了，虽然项目不是很好，但收入水平应该也算完爆大部分同龄人，更重要的是看下一步的升级空间，大体上有三条路：


    +   1.进管理层，也就是升P：'
  merge: -1
  img_proc: true
- pgno: 781
  md: '虽然手头项目不够好，但你还是可以多磨练技术，多认识公司其他研发，看看有没有机会做内部孵化的小项目，总之多在内部展示自己的能力，条件成熟了申请转岗，在更好的项目里攒业绩晋升。


    这条路，考验你的技术能力和公司内部社交挖掘能力。


    # 2.跳到中小公司做管理层：


    这条路最需要慎重，因为你从顶尖公司跳出去，过往经历给你的背书只有一次，如果你跳去一家辣鸡公司，哪怕是管理层，那你也是辣鸡公司的管理层了。如果走这条路，仍然要尽量往中上层的公司跳。


    所以我非常建议你，走这条路你要尽早建立自己在技术圈的影响力，包括分享技术、了解产品运营、多认识各家公司的管理层。等到你跳出去的时候，应该是靠朋友内推介绍、圈内人邀请，而不是靠简历。


    # 3.创业创收：'
  merge: -1
  img_proc: true
- pgno: 782
  md: '其实这条路看上去风险大，实际上是最稳的。一方面国外很多技术人变现的案例，可以打开思路，另一方面不需要全职，可以业余时间先探索。搞研发的一般比较缺运营和商业思维，所以第一步以补充商业思维为主，也可以顺便多认识圈内人，看以后有没有机会合作。


    基本这三条路，我身边的技术朋友都有人走过，甚至同一个人在不同阶段走了不同的路，比如先升P做管理，然后结识圈内人尝试自己做项目。


    本质上三条路没有优劣之分，主要看你的性格和个人技术情况吧，不要走别人吹捧的那条路，认清自己适合自己就好了。


