  md: '# # K12领域个人逆袭的两个小案例


    Hello，花爷晚上好，大家晚上好，我是Angela，今天主要分享两个K12领域个体逆袭的案例，然后回答大家提出的问题。


    分享：


    第一个案例：从事K12阶段的语文阅读和写作课程的S


    阶段一：'
  merge: -1
  img_proc: true
- pgno: 82
  md: '毕业后在师范学院工作，抓住被同事忽视的机会，主动承担工作，借着这个机会，了解每个学生的性格，兴趣，特长，和打算授课的层次，年纪，区域，方向，把当时市面上所有不同版本，包括人教版，苏教版，沪教版，长春版，鄂教版，北师大版，粤教版，等等等等，不同年级的语文科目教材全都过上一遍，并且随身带着一个小本本，记录下有用的信息。七年的基础技能积累，做中小学工作得心应手。


    # 阶段二：


    离开四线城市去广州，前三年，负责教育科技公司的成人教育培训的一个语文课程，在此过程中，接触到前辈Z老师，Z老师晚年孤独，想招收一批孩子在家里上课，因为不忍心拒绝老人家的请求答应，却由此开启自己的K12培训之路。用心的教学，良好的口碑传播，两年的时间，收入翻了十倍。


    # 阶段三：'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'S老师怀孕休产假期间，之前的一位家长联系S老师问能否回来继续教学，并且私下为她招收了很多学生。于是月子期间的S老师，开始研究初高中教材，琢磨不同阶段可能的教学侧重，考试的重点，想象种种问题破解之道，自己做题，然后找不同地区，不同年份的各种的中考真题和其他类型的问题。邀请老公停薪留职，共同从事作文培训，并搬到了那位家长所在的小区，进入新的K12教育阶段，收入再次翻倍。


    # 阶段四：


    两年过后，S老师发现自身积淀不够， 在广州买房钱也远远不够，开始细化自己的作文培训产品和提升用户体验，帮助学生提分的同时，注重学生行为习惯及综合能力的培养，同时满足家长和孩子交流沟通的情感需求。并且在这一阶段，加入了M老师的社群，借力社群持续赋能，个人影响力飙升，至少60%的学生续了未来3~5年直至高中毕业的
    course。用了两年的时间，营收达到七位数。


    # 本案例简单总结：'
