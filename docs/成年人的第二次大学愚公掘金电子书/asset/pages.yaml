  md: '# 跨境电商：美金烧出的Dropshipping实战经验


    介绍:


    大家好！我是Lin，今天我分享下Dropshipping，都是一路摸爬滚打出来的实战经验，说白了是用美金烧出来的经验。


    我先讲下我是怎么接触到这行的。（起初）是Youtube，国内俗称油管。平时我经常会去YTB上看我感兴趣的内容，包括大到创业相关，小到个人兴趣爱好。平台也有推荐算法会推荐更多相关的视频给到你。我想说YTB真的是一个很好的学习的地方。也是这个契机让我发现了dropshipping。外加海外的分享文化比较浓厚，所以可以学到不少东西。'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# 分享：


    回到正题讲 dropshipping。


    **主要分**为3大板块：**选品，**推广，**运营**。


    刚起步时我们人少，所以挑核心工作去做，也就是**决定** **业务成败最关键的部分：** **选品和****推广**。其实每一个板块拆分出来其实有很多工作可以做。要成功通过
    facebook 广告推出一个爆款出来，我们最后总结出来：**选品占 40%，广告素材 35%，受众定位 25%**。爆款当中其实也会有分大小， 我们暂借归类为：小爆，中爆，大爆，颠覆人生爆。各自对应
    100-200美金/天，300-400美金/天，1k-2k美金/天，3k以上/天，可以做个参考。


    **选品：**


    接下来说下选品。


    dropshipping的选品是个频率很高的工作。我们一周大 概要测试30-40个产品，多的时候一周60-70个都有，看 自己情况和预算。每个产品我们会给个100刀的预算，能
    测试跑出来的，我们才会考虑扩量，否则直接 pass 下一 个。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '我们自己的情况是平均一周出一个爆款， 中爆级别的。我也问过很多同行，我们的数据还是比较好的。所以可以平均下，50个左右能测试出一个款出来。


    # 这里面如果提高测试成功率呢？


    那么我们要做好选品工作。刚才我说了，选品占的因素会有40%。


    # 选品的思路：


    刚需，受众广，最好是针对女性。建议选可以卖24.99美金以上+有现成视频素材（这个待会说为什么）另外还有个捷径是直接寻找已经热卖的款（跟别人的款），这个对新手来说成功率会更高些，缺点是广告竞价竞争激烈。


    # 选品方式：


    有很多包含但不包括，比如 facebook刷购物广告，平台会推给你更多的购物广告。订阅竞争对手段的网站，看亚马逊迹、ebay的商品排名，海外各大产品博客网站，YTB/IG
    网红频道。


    ```

    124

    ```'
  merge: -1
  img_proc: true
- pgno: 132
  md: '找到产品后。 很重要的一步是看下，是否已经是被推烂了的产品，那么我们要去 facebook 上面搜索相关的关键词。 这里面会有一大部分的广告投放你是不一定会搜索出来的，但是可以做一个参考。另外一个，我们不是订阅了很多竞品的网站么，我们可以看有多少竞品已经上架了这款产品。


    # 产品定价：


    一般都是在产品成本+运费基础上x3，比如成本是10刀，那么我们定价就是29.99美金。如果成本超过15美金以上的话，一般建议减去产品和运费成本后至少留出20美金的毛利。一个比较健康的比例，我一般建议是成本+运费控制在30%左右。找到要测试的产品后，搜集并制作着陆页素材，广告素材。


    大家可能想你们这么几个人，这么大量的工作如何完成的?


    每天要做6个视频，我们做视频的一天也只能做出3个出来。这还不算完，还有落地页，翻译，图片等等。6个推广视频，小团队其实光忙选品就都不一定做的过来。产品我们筛选出来30-40个，预选的最起码60-70个。我们解决这个问题是通过菲律宾的VA——简称：兼职。'
  merge: -1
  img_proc: true
- pgno: 133
  md: '我们找到了菲律宾当地的类似猪八戒的网站。国人用的比较少，国内一般用fiverr，freelancer，upwork，fiverr上都是印度佬。freelancer服务不好，upwork要求和收费太高。


    看来看去菲律宾这个最合适。算了，还是分享给你们吧（www.onlinejobs.ph）。我们最多的时候有10个VA帮我们做选品，写文案，做视频，客服，广告留言回复等工作。


    # 为什么要找菲律宾的兼职呢？因为真的性价比很高。


    +   400-500美金一个月工资对他们第三世界的国家来说是还不错的水平


    +   地道的美式英语


    +   听话，服务超级好。


    +   虽然时区和我们一样，但是他们的作息是美国时间。（因为他们多年来都是被很多美国公司雇佣过）


    缺点：自己要会点口语，可以正常沟通交流。工资2周付一次。


    这就解决了我们本土化和人力的问题。一石二鸟。


    # 推广：'
