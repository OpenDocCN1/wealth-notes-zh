  md: '随着这几年跨境电商的快速发展，大量国际包裹，发达国家特别是美国，也是要求中国邮政必须要涨价，邮政小包费用也是每年涨，甚至还翻倍地涨。由于发达国家高昂的人力成本，现在这样其实是在让他们来补贴我们。。。只是不得不受万国邮联体系的约束，去年还传出美国要退出万国邮联。。。


    插一下，做Dropshipping的新手，记得物流选挂号服务，多付一个挂号费就好了。毕竟有跟踪信息的物流服务才能让客户安心。虽然是“屌丝通”，但由于产品价格低，性价比高，速卖通上做dropshipping的买家和各个国家的小批发客户还是不少的。


    我们在速卖通上是做标类，半标类的产品，比如数码产品，五金工具。简单来说，标类产品是相对于服装，饰品这些注重个性需求的产品而言。标准品，意味着注重功能，需求相对统一，另一面是同质化严重，不可避免地价格战。


    # 3、流量'
  merge: -1
