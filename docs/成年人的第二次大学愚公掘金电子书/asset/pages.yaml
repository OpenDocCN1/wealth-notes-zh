  md: '# 怎么判断一家 p2p 靠不靠谱？


    提问：


    花爷，你好！


    请问怎么判断一家 p2p 靠不靠谱？家里人想买，给我发了好几家 p2p 公司让我参谋，恒昌，普惠，中恒信达等，我也看不懂，希望花爷指导一下，谢谢！


    回答：'
  merge: -1
  img_proc: true
- pgno: 717
  md: '这要是一年前，还能说找国内实力靠前的几个大平台的，但现在，这话说不出口了。前两天还看到一个土豪花5.5亿买中泰的理财，关键这个理财年化收益好像才百分之五点几，对这个资金量级来说收益真不高，但最后钱还是没了。你也不能说他贪心，毕竟收益本身不高，就是行业不景气。


    普通老百姓，现在还是安全为主，老老实实买正规银行理财或者余额宝零钱通这种货币基金，不要冒风险，我自己没有买任何匹凸匹，要么保守理财，要么做价值投资。


    当然，现实情况呢，很可能你根本说服不了家人，家人就是要买匹凸匹，那折中之策，就是去买陆家所这种类似的大型老牌平台。'
  merge: -1
  img_proc: true
- pgno: 718
  md: '买的时候也要注意，这些大平台迫于业务压力，会上一些其他平台的理财网货，这种风险明显就高多了，普通人真假难辨，很容易买错。比如小赢理财背后是众安保险，它自营的理财产品如果亏了钱都有保险保障，相对比较安全，但随着大环境变差，小赢理财里自营的产品比例越来越少了，自营产品额度基本靠抢，需要仔细辨别。


