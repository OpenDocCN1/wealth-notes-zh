- pgno: 949
  md: '# # 垃圾分类中，对企业和个人会出现哪些机会？


    昨天发了一篇如何正确看待垃圾分类的文章，最后留了个小尾巴：在垃圾分类中，对企业和个人会出现哪些机会？


    为什么中国急着垃圾分类？官方没说的理由在这里...


    看完文章之后你不难看出，在这条产业链里，有两个核心的需求：


    +   1.国家希望居民可以对垃圾分类

    2.国家希望被分类的垃圾可以更好的处理


    所有的垃圾分类生意都会围绕这两个需求，比如：'
  merge: -1
  img_proc: true
- pgno: 950
  md: '# 1.帮助老百姓理解垃圾分类：


    比如各种小程序帮你一键识别垃圾的分类，这会 是长期稳定增长的流量（但不太容易行程壁垒）。


    比如垃圾分类的教育玩具，你可能觉得你不会买，但我 打赌这东西大概率会成为一线城市幼儿园的标配。


    # 2.提高老百姓垃圾分类的效率：


    这估计是门槛相对较低、利润相对较大的一类需求。


    比如最开始的分类垃圾桶，这种主要靠先发优势，也比 较难形成壁垒。


    比如厨余垃圾处理器等产品，国外已经有了，国内肯定 会有更创新的产品。


    比如智能易拉罐投放机，这是我最看好的一类产品，估 计已经有企业在做了。老百姓把易拉罐等可回收垃圾整理 后，扔了也白扔，不如投进企业的智能机器换取积分或 者换钱，国外很多超市都有这类设备。'
  merge: -1
  img_proc: true
- pgno: 951
  md: '想象一下，支付宝在每个小区放一个这种设备，你整理好的易拉罐之类的顺手丢进去，可以换成支付红包，好像……还不错？


    # 3. 为垂直场景提供垃圾分类处理的服务：


    最早有人在网上传“垃圾代分类服务”，一个月几十块帮你做分类。


    说实话，我是不看好这类服务的。从大趋势上，它违背了垃圾分类的初衷，从现实上看，愿意花这个钱的还是少数，如果一个小 区只有几户人家愿意付费，那代分类的跑腿成本就上升了，价格也要随之上升，价格上升后愿意购买的人又更少了，形成恶性循环。到最后变成了有钱人才需要的服务，但……有钱人有保姆……


    或许这个生意也能成，但我觉得至少空间不大。


    我觉得相比给老百姓做代分类，不如专门去处理装修的建筑垃圾等等类似的垂直场景，预计装修公司的服务项目里的，扔垃圾的费用又要涨。


    # 4. 处理分类后的垃圾：'
  merge: -1
  img_proc: true
- pgno: 952
  md: '属于和zf对接的服务了，一家企业承包一个片区做垃圾处理，普通人插手不了，不多说。


    # 5. 一定会有垃圾再利用后制造出来的产品：


    在国外，用垃圾做出的鞋之类的产品有很多，我不确定需要多长时间，国内才能接受使用垃圾再利用制造出的产品。


    但我确定如果某个品牌第一个做出垃圾制成的商品，哪怕卖的不好，也是绝佳的公关营销机会，反正号称做出中国第一个垃圾制成的商品也没什么成本，不会有人去追查，相反官媒还会帮你宣传。


