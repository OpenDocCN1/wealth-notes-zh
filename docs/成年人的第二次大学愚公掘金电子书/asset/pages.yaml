  md: '6.从描述来看，是先有一些客户或者说潜在客户，再有课程？那么初步的客户是通过什么渠道获取呢？


    夏天：就是我前面分享里说的，一次又一次免费的公益活动，是最主要的获客渠道。


    7.课程、师资来源？是否附带销售产品？利润比例？固定场地还是流动场地？


    夏天：


    # 7.1师资来源：


    师资主要是通过这些年积累的人脉，我们个城市地方不大，老板又是混文化圈的，所以朋友、同学、师兄弟甚至客户，都可能成为介绍师资的人脉。


    # 7.2是否附带销售产品：


    是的，课程中需要用的物品，都会通过场景式营销的方法进行销售；但因为我们通常销售的都是有一手货源的东西，所以对于质量把控极其到位，价格反而比外面市场上还要便宜。'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# **7.3利润比例：**


    去掉硬成本，和老师按一定比例（如55、46等）分成。


    # **7.4固定场地还是流动场地：**


    通常来说，不收费的活动都是在固定场地；收费的活动都会尽量出去做；但也有例外，比如请的老师特别大咖，那么对场地的投入就会减少，就还是会选择自己的场地来做。


    8.策划一个完整的活动需要考虑的方面，团队成员有多少，策划周期是多长。


