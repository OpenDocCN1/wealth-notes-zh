- pgno: 125
  md: '余奕宏：我为什么会选择餐饮做切入点，因为我做广告行业的时候，会去研究各个行业的发展趋势，就是比方说，人均GDP到多少之后，这个行业会发生什么变化，渠道到了什么样阶段时候，这个行业会发展什么样的变化，它会有这种规律的东西出现的。然后呢，在2015年的时候，餐饮行业有两个大的趋势被我们捕捉了，第一个，就是购物中心啊，那个时候购物中心已经在全国开始广泛建立了，对吧，今天购物中心已经泛滥了，那个时候我就知道，当购物中心诞生的时候，就是线下的服务业开始规模化的时候，因为一定是渠道先行。


    那么另外一个就是外卖，外卖差不多应该是从2012年，2013年就开始有了，那么到了2015年的时候呢，其实那个份额还很小，就全国那个时候一年大概在400亿。现在大概差不多有两三千亿左右吧，但是那个时候我就预言，我说外卖将来一定会上万亿，因为它其实就是餐饮行业的电商，所以我就知道说这个行业一旦开始发生这种两大变革，这行业就开始规模化，加速规模化，然后正好那个时候，北京开始有这个皇太极呀，什么西少爷这些，然后资本也开始注入，当资本和人才进入一个行业的时候，那这个行业也开始发生变化，所以我开始选择说，那我开始研究这个行业。'
