  md: '# 从一篇广告软文，花爷手把手为你拆解出10个营销要素


    我之前在群里聊天时，说到我在研究优秀的公众号做总结，研究的其中之一就是最近最火的“卢克文工作室”。


    卢克文是写时政故事的，短短时间写过上百万阅读的文章，还被侠客岛这类官媒转载过，确实非常厉害。


    不过今天不聊卢克文，聊聊卢克文公众号前几天发的一篇广告：在这件事上，日本彻底认输了！


    卢克文说这篇6万阅读的文章，卖掉超过1万斤大米，销量破10万。'
  merge: -1
  img_proc: true
- pgno: 989
  md: '当然，作为这方面的老司机，花爷可以告诉你一篇文章带货10万，远远不是这个行业的顶尖水平。不过依然很优秀，特别是这篇文案，值得所有对卖货、营销、做IP的人研究。


    我提练几个关键点，花友们可以看看自己有没有想到：


    +   1.民族情绪：日本认输，最好的引流对立矛盾。


    +   2.品质对标：直接对标日本煮饭仙人。


    +   3.价格对标：文中的米128十斤，其实不算便宜，但煮饭仙人300一斤的米一对比，就不贵了。


    +   4.权威认证：贯穿全文，从开头的亚洲大米评比大会上打败了日本越光米，最后的无公害认证，一头一尾分两次加深印象，非常重要。


    +   5.用户害怕得到不好的东西：新闻报道大米种植条件污染。


    +   6.用户害怕失去好的东西：传统大米流水线会流失营养。'
