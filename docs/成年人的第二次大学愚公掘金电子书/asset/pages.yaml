  md: '**客服**：及时响应每个店铺的客户咨询，遇到不懂的向上家咨询。协助售后专员解决售后问题；


    **拼单**：巡查等待成团的订单，检查有没有亏本的订单，确认无误后用小号进行拼单；


    **拍单**：查看单独拍单的订单有没有亏本，确认无误后用小号进行拍单；


    **售后**：及时处理售后订单，特别要尽量避免平台介入，否则售后的亏损漏洞很大；


    **数据采集**：店铺产品数据的好坏决定了店铺的产出；


