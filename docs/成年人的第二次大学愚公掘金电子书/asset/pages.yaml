  md: '# # 朋友借了几万块钱，到期不还钱怎么办？其实借钱和讨债，本质上就是在比谁更不要脸


    **提问：**


    昨天有个花友提问，借给一个不熟的朋友几万块钱，要不回来，心里憋气。


    **回答：**


    昨天回答完之后不知道哪里敏感，一直在审核，这里重新发一遍，告诉更多花友，被人借钱了怎么办。


    借钱和讨债本质上在比什么？比谁更不赖脸啊！'
  merge: -1
  img_proc: true
- pgno: 720
  md: '消费贷、分期贷，如果借钱的是学生，催债公司给家人发短信、去学校闹事、去家里涂油漆，仗着就是学生还要脸。如果借钱的是老赖，万般手段不沾身，脸不要，命一条，催债公司其实也没什么办法的，又不能真的下狠手，没意义。


    普通人借钱讨债也是一样，先礼，约定一个还款时间，到了时间，几次不还，那就到了比谁不要脸的时候了。


    这时候你就要抉择，如果想维系感情，那就心甘情愿吃个闷亏，当交学费了。如果想要钱，手段也不用太夸张，他不是说暂时还不上钱吗？没关系，几万没有，一千两千有吧，先还上。过几天再去要，别怕麻烦，就当定期去收房租了。


    别管面子，甭管多少钱，有多少还多少，还到还完为止。


    最后提醒所以花友，借钱谨慎啊～


    713'
