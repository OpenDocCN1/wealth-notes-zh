- pgno: 563
  md: '# 经营披萨培训中心，如何提高推广效果？


    # 提问：


    花爷好！我做披萨培训，经营一个披萨培训中心，之前做快餐店，小白入坑，一年亏了50多万。现在河南郑州和一些地市投了广告，有头条，百度，朋友圈，推广文案是他们拟订，是常见的餐饮培训文案，也做过地推，所有推广效果都不好，咨询率低，转化率零，目前最困惑的是这个披萨培训行业还是有需求的，但我这边差，苦笑。市面有一部分培训中心生源还是比较多的，每期能招20人左右，一月可以开2-3期，高价的8天披萨培训班12800元，低价的3000元买一送一，我这边是6800元7天课程，9800元8天课程，市面上培训的东西有新，旧，全，菜单不全区别，多是创业开店人群。请教您问题：是项目不行？有没有更好的经营或者宣传方式？'
  merge: -1
  img_proc: true
- pgno: 564
  md: '# 回答：


    说实话，餐饮行业我还接触过一些，披萨培训这个行业我完全没有接触过，而且你提到你的培训中心的信息也很少。本着不懂不能装懂的原则，我很难直接告诉你这个项目行不行，只能告诉你，你想评估项目可不可行，评估自己的经营宣传方式出了哪些问题，可以从以下几个方面入手：


    # 1.定位


    你也提到，市面上有一万多的培训和三千的培训，显然，这两者在各方面肯定提供的服务不一样。但我想提醒你的是，在做培训中心的定位时，千万不要走中庸之道，不要追求面面俱到，要么走高端，要么走低端。定位一旦定下来，你的所有宣传、服务都应该跟着目标人群走。


    但我看你的价格，6800元7天和9800元8天，这两个价格方案，正常人应该更倾向于6800元7天（少一天能省一半的钱），但6800这个价位，有种比高端比不过一万的同行、比便宜比不过三千的同行的感觉。不知道你是否想清楚了究竟走哪个路线？'
  merge: -1
  img_proc: true
- pgno: 565
  md: '# **2.价格**


    我们做定价策略时，每个档次往往只有一个主打价格，剩下都是用来做烘托的。再看你的定价，6800元7天和9800元8天。我假设你想走高端路线，那9800这个价格，比一万多的同行稍便宜一点，我建议当做主打价格。我建议你可以尝试8800元6天，9800元8天，8800这个价位没人没关系，只为了烘托9800这个价格。


    # **3.宣传**


    你说你做过投放，做过地推，单转化为零。我不知道你有没有研究过和你定位相同的同行的宣传策略，你最好的宣传方式，就是直接找到同行的学员，询问同行是怎么做宣传的，然后在同样的渠道做宣传，用更好的策略（下面第4点谈）击败同行。


    另外，做投放千万不要一股脑交给宣传公司，也不要一股脑全部资源都投进去宣传，一定要准备好多个方案，每个方案先投放一点点，测试一下效果，然后挑效果最好的去做投放。


    # **4.试学**'
  merge: -1
  img_proc: true
- pgno: 566
  md: '一般来说，用户购买高客单价的产品，主要靠的是信任。假设你现在跟同行在同一个渠道投放，虽然你比同行便宜，但用户一般还是不会选你，因为同行干了这么多年，品牌的信任度在这里。怎么搭建自己的信任度呢？我出个主意，你可以自己考虑一下。


    一般创业开店的人，都比较谨慎，一万左右的学费交出去，心里总有些忐忑的。你可以以试学为卖点，进行投放，让用户免费学一小部分，试学期间充满感受到你们的服务专业度，产生信任，试学结束的时候适时给一些报名优惠政策，应该可以拿下一部分。


    # 5. 扩大受众


    最后提一点，不知道你的投放是不是直接以“披萨店培训”为名投的。事实上，很多人想开店有开店意向，但不知道开什么店好，在大众普遍认知里，没有觉得开一个披萨店很赚钱，一看到披萨店是没有兴趣的。所以你的投放时，不如试试把人群扩大到整个开店人群，着重描述披萨店赚钱、好开。广告投放上类似的小技巧还有很多，重点就在于你要一个环节一个环节的去抠转化。'
  merge: -1
  img_proc: true
