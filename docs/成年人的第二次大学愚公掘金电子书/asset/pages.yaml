- pgno: 694
  md: '# 花爷再次化身情感博主：大学被骗、贷款，欠债8万后应该怎么走出焦虑？


    提问：


    花爷，几个月前被人骗了3万，在此之前因为有消费一些东西已经预支了2万，大学的助学贷款还有近3万没还款，加起来有近8万负债，所有都是信用卡，目前自己就是倒卡中度过，不敢和家人说，刚来北京自己的工资很低，业绩8k上下浮动，每个月还款有限。想到自己不知道什么时候才能还款完，每天焦虑中度过，感觉有时候紧张的都快抑郁了。从来没想到自己身上会发生这样的事情，我该怎么办？'
  merge: -1
  img_proc: true
- pgno: 695
  md: '# 回答：


    被人骗了三万：我上大学都没三万给别人骗，你这个被骗不光是诈骗这么简单吧。


    消费一些东西预支两万：没啥好说的，即使我现在收入还可以，光我自己买东西一年也花不了两万


    大学助学贷款三万：都助学贷款了，还有钱被骗……


    当然，我不是来数落你的，我是告诉你，这些钱怎么没的，你心里应该很清楚。社会是险恶，诱惑是多，但你得从自己身上找问题，毕竟不是每个人会掉坑里，更不会次次都往坑里跳。


    钱反正是没了，还肯定要还的。你唯一翻盘的机会，让这几万没有打水漂的机会，就是买一个教训，一个一辈子都不要忘记的教训。


    记得不要贪婪、记得脚踏实地，以及，记得自己犯的错，咬着牙也要扛起责任。'
  merge: -1
  img_proc: true
- pgno: 696
  md: '如果你的欠款还在一直滚利息，别犹豫，跟家里说，自己犯的错，挨打挨骂要站直。毕竟是一家人，你要是被债务逼出个三长两短，更对不起爸妈。


    也不是说做错了事让你爹妈背，你和爸妈说这钱是你借的，先还上，至少先不要再滚利息。


    以后你做牛做马努力，先把爹妈借你的养老钱还上，然后带着这个教训，带着对爸妈的愧疚，从新开始好好努力。


    从头再来，永远不会比今天更晚。


