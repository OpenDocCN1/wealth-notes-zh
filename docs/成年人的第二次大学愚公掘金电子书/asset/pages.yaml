  md: '# 餐饮创业类的公众号，

    可以往这三个方向发展


    提问：


    花爷好，我地质专业，干了5年餐饮，抱着不当将军的士兵不是好士兵的心态，从服务员开始入行餐饮业一路到职业经理人，团队一年多时间，从0到100家加盟店，各人成长也非常大


    自媒体时代最好的IP就是自己，虽文采平平，但也想尝试下写个关于餐饮人创业的号，列了下思路（附图）琢磨了一个多月了，迟迟还未动笔，请教花爷几个问题


    1.我要从什么切入点写，用什么样的方式写


    2.好多知识点，都是零散的，我该如何有序融合在一起，一篇赏心悦目的文章逻辑是怎么样的'
  merge: -1
  img_proc: true
- pgno: 611
  md: '3.你认为我这个号要有什么样的价值体现比较合适当下


    4.目前有限爬了几十万个一二线门店联系方式资源，有什么方式高效低成本转化到公众号吗


    ![](img/5688f8284c7103ed77046cfddaf3da13_611_0.png)'
  merge: -1
