- pgno: 1132
  md: '# 花爷觉得自己成长经历里最重要的几点


    提问：


    花爷，你好。特别想知道你是如何从一个打工仔一步一步走到今天的，尤其是这么厉害的商业分析与拆解能力是如何锻炼出来的？能和我们分享一下吗？


    回答：


    提问的花友应该是看到了我那条朋友圈。没看过的不用去找了，朋友圈是凌晨两点发的，起床后就删了，大意是说只要经历足够多的失败，多思考多实干，赚钱真的没那么难，我自己就是个例子。'
  merge: -1
  img_proc: true
- pgno: 1133
  md: '既然问了，行，我摊牌了……花爷是90后这个很多人已经知道了，家庭背景也就是普通人，毕业几年各种折腾，终于从打工仔实现了年收入百万（其实没到百万，差一点点……）的转变，我觉得最重要的经历如下：


    # 1.大学毕业，做了整个系同学都不同的选择：


    我大学虽然是个一本，但远远没到清北复交这种程度，就这样我大学成绩还特差，小助手是我大学同学，他知道我每学期都挂科。


    不过好在我从小爱看书上网，对互联网都比较了解。所以当时我们系毕业主流都是争取去外企工厂的，剩下的考研考公务员，而我觉得这些成长空间都太小，决定去干互联网。


    于是我大三暑假决定一个人来上海实习，没记错的话，整个学院只有我这个学渣这么早实习的，从此走上了另一条路。'
  merge: -1
  img_proc: true
- pgno: 1134
  md: '说起来简单，其实当时也有很多困难。比如我爸妈不同意，我一个人跑去上海早期过得还挺惨的……再比如干互联网我也没啥经验，还是个学渣呢，我就花了好久自己做了各个app的体験报告，终于混到一家上市公司（其实内部非常垃圾）的产品运营实习。


    后来出来才知道，名校大学生都是很早实习的，毕业30-50万年薪的大有人在。跟这些人，我实在是比不了，不过就我自己的基础来说，算是选了一条很重要的路，不然肯定没有后面的发展。


    # 2.跟对人，会学习


    因为大三之后一直在实习，快毕业的时候我简历也算看得过去了，所以当别人努力实习转正的时候，我实习期间选择了跳槽。


    很幸运的是，后面跟的几个老大都是大佬，这里我承认，有点运气成分。


    但是有一点值得注意，其实大佬是没时间手把手教你的，同样是跟在大佬后面，我身边不少同事学到的东西很少。'
  merge: -1
  img_proc: true
- pgno: 1135
  md: '但我有一点做的很好。每次和大佬汇报工作，我可能要讲十几分钟，大佬只会确认几个问题，交代两三点改进建议——而我每次都会反复想，项目可关注的问题很多，为什么大佬偏偏关注这几点问题呢？


    想的多了，我发现我越来越能像大佬们一样思考问题了。现在，我养成了从任何事情里学习的习惯，所以你很少看到我沮丧或者愤怒，遇到再糟糕的事，我想的也是如何解决、以及能够学到什么教训。


    # 3. 抵抗浮躁，长期盈利


    经过上面的学习阶段，当我各项能力都还可以的时候，工资薪水虽然也还可以，但没达到自己的目标。


    这段时间我利用自己的学习、搜索能力疯狂探知各种可能赚钱的生意，也由此接触了很多接地气的玩法，但我也和你们一样，沮丧的发现：


    内心非常浮躁，好像知道不少，但又没有那件事干得很好。其实很多生意，你看上去是一个月大赚一笔，其实人家以及积累了很多年。'
  merge: -1
  img_proc: true
- pgno: 1136
  md: '于是痛定思痛，开始只做自己擅长的事，并且注重长期积盈利。第一桶金是通过选品、写推文、找流量投放的方式赚到的，比较成功的爆款可以赚六位数，比较忙的时候拉了小伙伴兼职处理。


    不过这种模式，仍然是以产品为核心，不符合长期积累影响力的要求，所以后面你知道了，开始做自媒体，而且效果还可以——其实也是积累的结果。


    # 4. 坚韧


    以上三点，是我选出来的，对我比较重要的几个转折点。但如果用一句话总结过去几年，我觉得最重要的是：


    追求当一个持续的聪明人。聪明、思考、总结，很重要——但持续的去当个聪明人更重要。


    不少花友知道我晚睡，其实我的作息是这样：一点半左右睡，八点半左右起床，一周至少工作六天——这个作息我坚持很久了。'
  merge: -1
  img_proc: true
