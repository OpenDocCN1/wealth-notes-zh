- pgno: 618
  md: '天啊，人生这么憋屈的吗？对，就是这么憋屈，而且中国活得比你憋屈的大有人在。


    我们在残酷的现实面前唯一的出路，就是让自己3-5年后别再这么憋屈了。


    所以，在你的描述里，我发现的两个问题：


    # 1. 你不知道自己擅长什么


    你说你喜欢设计，但是又不擅长；你考虑去做销售，但是又不喜欢——看你的描述，这两样你好像都不擅长？


    一个人是不可能把不擅长的事发展成事业的，你擅长的是什么？


    如果你擅长设计，只是工作时间不长水平一般，那建议做设计。


    如果你做销售业绩很好，只是内心比较抗拒，那建议做销售，擅长比喜欢重要。


    # 2. 你的职业规划还停留在工资阶段'
  merge: -1
  img_proc: true
- pgno: 619
  md: '如果你只考虑工资，那我觉得销售和设计，做得好点工资差不太多，不如挑你喜欢的设计。


    如果你想获取更多财富，你就要认识到，出卖单一技能，收入会很快到达天花板。唯一的突破方法，是把技能融入社会关系，把技能做成一门生意。


    而从这个角度将，设计和销售最终都可以转化一门生意，但你在磨练技能的时候要多留心，3-5年后，你不应该只是一个加了几千工资的高级技工，而是有手艺、有生意头脑的生意人。


