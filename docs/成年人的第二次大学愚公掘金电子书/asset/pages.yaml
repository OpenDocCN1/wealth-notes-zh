- pgno: 812
  md: '国内的美妆品牌这两年已经崛起了，已经还会继续崛起，多关注新兴品牌的玩法，它们中间一定会出现巨头的。


    稍微说下怎么分析新兴品牌，首先怎么发现这些待研究的新兴品牌？最好的办法就是看广告、公关稿，那些在小红书、微博、淘宝上推的，都值得关注。


    其次要分析整个链条的利益分配，我在之前的文章写过：


    如果我们把所有社会活动都理解成一种交易，那么


    +   a. 获利原则：交易中每一方的行动，都期望能够获利（包括金钱、情感、生理等多方面的获利期望）


    +   b. 自愿交易原则：当交易有多方参与时，只有每一方的获利期望都得到满足，交易才在多方自愿下完成


    这两条原则铭记于心，先找到商业链条上参与的每一环，然后研究每一环的收益是否大于成本，如果某一环只付出没有收益，说明还有你没有研究到的环节。'
