  md: '# 以拼多多为例，店群玩法入门手册


    介绍：


    自我介绍：


    我叫小陈，从2012年开始从事电子商务行业，距今已有7年，从平面设计到推广然后到运营总监，从去年年初开始愈加发现电商行业越来越透明化，去技术化，后面的发展方向必然是供应链以及实力，思维模式的升级迭代，不再是技术能解决的年代了，且发现身边很多做运营的朋友也出来创业，所以去年一直在观察项目，毅然决然从去年年底辞职单干，现在在经营有货源淘宝店以及无货源拼多多店群。


    店群概念：'
