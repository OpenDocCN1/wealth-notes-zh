  md: '# 程序员是先努力进大厂，还是寻找副业方向比较好？


    提问：'
  merge: -1
  img_proc: true
- pgno: 869
  md: '花爷好。本人是程序猿，在一家小公司工作。在这家公司已经工作了4年（毕业5年），同事也换了不少了，公司发展状况一般。要说好的地方，就是比较轻松，基本不需要加班，收入相对工作量来说还可以。由于自己比较松懈，自问技术水平停滞不前。接下来想专注学习，提高技术和准备面试，争取进去大一点的公司。但是，到了这些公司，大概率工作时长长，需要经常加班。同时，我也想尝试发展副业，感觉单靠正职是难以出头的，不过现在还处于开阔眼界的阶段，在寻找方向中。问题来了，到这些公司工作，感觉会影响到发展副业，因为少了很多空闲时间。如何平衡正职和副业？这个困惑是想的太多做得太少吗？或者纯粹是太懒了？想听听花爷的看法，谢谢。


    # 回答：


    程序员如果技术水平还在中游徘徊的话，优先还是先努力进大公司。


    中游程序员的薪资大概在20-30万年薪，社招跳到大公司，一般40万+。这中间一二十万的增长，想通过副业赚回来，新手还是有些难度的，所以进大公司优先。'
  merge: -1
  img_proc: true
- pgno: 870
  md: '程序员做副业，一般是真的遇到了瓶颈，要么，技术水平确实上不去，进不了大公司，要么，进了大公司卡在了P7，熬不出头了，增长空间狭隘。


    到了这个时候，就是真正考虑副业、创业的时候了。


    至于时间的平衡，我上次聊过如何管理时间


    (https://t.zsxq.com/VfMfEyf)，其实道理是一样。


    首先，个人做副业，强迫自己只做最重要的那件事。


    如此，保证自己的业务精简，同时不浪费太多时间。


    其次，以半小时为节点，管理自己的效率。


    大部分人的工作效率都没有开满，如果按半小时管理自己，至少可以多挪出10%以上的时间。说白了，上班只要本职工作做好，花一点点时间处理自己的事，其实问题不大。


    所以不用担心时间的问题，等到你把程序员的红利期吃光，心态、工作的游刃有余程度，自然也会到一个新的境界。'
  merge: -1
