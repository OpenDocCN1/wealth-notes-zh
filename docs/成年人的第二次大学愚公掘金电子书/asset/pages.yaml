  md: '# 《如何从生活中发现100个商机》系列第一分部：从广告中发现商机


    上次提到，准备在星球里推出一个“金花奖”。


    金鸡奖金马奖大家都知道，金花奖有什么特别的呢？


    金花奖，主要是为了鼓励大家在日常生活里，锻炼自己发现商机、商业思考的能力。你在生活中，发现任何觉得值得关注的商业模式，都可以在星球提问，由花爷来为你拆解，而且提问提的好还有奖励。


    那有花友要问了，我感觉生活很平常啊，要如何才能像花爷一样，不断发现生活中的诸多商机呢？'
  merge: -1
  img_proc: true
- pgno: 910
  md: '所以，这周开始，准备在星球里更新一个小系列，名字就叫《如何在生活中发现100个商机？》大家看完这个系列，就可以照葫芦画瓢去观察生活细节，参加后面金花奖的活动了。


    这个系列会分4-5个部分讲解，**今天先讲第一个部分：从广告中发现商机**。


    很多人不喜欢看广告，但我不一样，花爷特别喜欢看广告。


    广告有什么好看的？你要知道，广告是商业社会获取用户最主要的手段之一。


    不管是高大上的奢侈品广告，还是厕所门上图的壮阳药广告，这个世界上，没有任何一个行业不需要广告。


    所以，通过广告，我们可以获得两个非常重要的收获。


    **第一，你不能理解的广告，如果一直存在，说明背后藏着你不懂得商业模式，有人在闷声赚大钱。**'
  merge: -1
  img_proc: true
- pgno: 911
  md: '小时候，脑白金、塑形内衣、背背佳、静心口服液，各种商品广告经常轮番轰炸电视台，而且广告跟不要钱一样，一个接一个的轮着播。


    我那时候完全不理解，为什么要拍这种又臭又长的广告，哪有傻子会买。长大了我才知道，不仅有人会买，而且买的人海了去了。


    现在也是一样，在微博上，你会看到各种股神的广告，一看就像是骗子；在共享单车上，你会看到各种贷款、花呗提现的小纸条，你甚至都懒得看一眼；朋友圈里，你会看到有人发非常low的海报宣传，一看就像是搞传销的。


    你可能也会想，这么蠢的广告，怎么会有人信？


    不不不，只要这些广告是长期存在，那背后一定藏着一个你不知道的商业模式，一定有人是这些广告的受众，并愿意为之买单。


    **第二，大家都在做的广告，往往是一种值得你学习的、新的获客方法。**'
  merge: -1
  img_proc: true
- pgno: 912
  md: '比如，你有没有发现，现在很多广告，都做成了短视频？而且广告的故事性越来越强了？你有没有发现最近微信公众号，经常推各种9块钱的训练营？你有没有发现去年朋友圈里，很流行扫码免费进群学习海报？


    这些大家都在做、出现频次很高的广告，大概率背后就是一种新的获客方法。因为获客效率高，所以很多人都在模仿这个玩法，如果及时了解，那就可以抓住红利期。


    所以，以上两种情况，当你发现你看不懂的广告的时候、当你看到某类型广告频繁出现的时候，大概率背后就是一段你不了解的知识点。


    以后，当你发现这些问题时，星球提问并且带上“金花奖”标签，由花爷为你拆解背后的秘密答案。


    ok，这就是第一部分的内容，学会提问，是从生活中学习的第一步。'
  merge: -1
  img_proc: true
