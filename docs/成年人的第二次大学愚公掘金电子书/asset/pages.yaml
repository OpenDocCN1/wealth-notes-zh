- pgno: 855
  md: '但全都要，也有先后顺序，先写文章（或者短视频等等内容也可以）攒粉，然后转化付费用户，最后挑合适的付费用户做代理。如此，每个阶段专注一件事。


    做生意，最重要的是让整个轮子滚起来。想让轮子滚起来，不是这做一点、那也做一点，而是先有一、再有二、最后有三，三者都做扎实，最后再把三者连起来，并没有想象中那么难。


