- pgno: 584
  md: '“目前体制内产科医生，月薪3w。在理财这块我买了一些推荐的书，我明白这些知识的重要性，也很乐意学习，但是我目前的工作强度比较高，而且就算我把这些都学了，理论和实践也还是差的十万八千里的，可能我直接套书上的内容来投资的话，还是会踩坑。我已经进入中年，没有太多时间试错了，所以我想请花爷帮忙分析下我的情况，多谢多谢！”


    回答：


    直接讲几个关键点：


    +   1.不要把目标放在财务自由上，而是放在第一个100万上


    我知道你存款不少，但那是你人生几十年的储蓄，不是收入标准。财务自由这个目标是非常虚无缥缈的，至少我个人体验来看，年收入到七位数已经相对比较自由了。人最不自由的就是生老病死，你是医生你应该清楚，大部分病100万救不回来就真的比较难了。


    至于年收入七位数还是八位数，说真的，只要还在老百姓过日子的范围，生活上差不了特别多，我身边的大佬有的花销比我还少，主要是满足事业心。'
  merge: -1
  img_proc: true
- pgno: 585
  md: '所以我一般喜欢建议收入20w+的朋友，反复死抠一个问题，怎么样才能做到七位数的水平？


    # 2.投资不是你最好的选择


    看到你详细的背景之后，我觉得你最好别把投资当主攻的方向。想要投资获得你预期的收益是非常难的，而你又没基础，正如你说的，你也没时间从头去学这些理论，也没时间把理论再付诸实践总结经验。


    最大的可能是你花了时间学习、花了钱投资，结果没赚到钱就算了，而且没有积累任何虚拟资产，性价比很差。


    # 3.接受医生的职业轨迹


    当了这么多年医生，我觉得你应该理解了，像医生、老师这类行业，其实就是在拿上升空间换稳定性。说白了，爆发性增长收入的可能性很小，哪怕金字塔顶层，也必须熬过很长一段年头。'
  merge: -1
  img_proc: true
- pgno: 586
  md: '所以我建议你先从心态上，理解医生这个职业的职业轨迹，接受它。至少你现在的收入和储蓄，已经能够给家庭一定的保障了，不要焦虑。


    # 4.多打造自己的个人IP和私人客户


    理论上，产科在医生里是容易创收的科室。医生的职业发展，有一个正向循环，除了科研论文之外，医生越注意打造包装、宣传自己，就越能获得更多名气，名气又会反向促进医疗体系内的晋升，晋升再带来宣传包装点，形成闭环。


    医生每天都能见到新的病人，相当于源源不断的给自己积累新粉丝。厉害的医生，会挑一些性格好、经济力比较不错的患者，加到微信里做后续的运营。如果你有能力写一写科普知识（我看你提问的逻辑表达比一般中年人要强不少），也可以在网上做科普（比如短视频），获取粉丝。


    变现的方法有很多，妇产科周边产品、婴幼儿的检测等等，母婴是个大品牌，很多都能做。我之前回答过一个医药代表的业务拓宽问题，可以参考一下： https://t.zsxq.com/YZNRRr3'
  merge: -1
  img_proc: true
- pgno: 587
  md: '这里还要延伸两点：


    +   a. 很多医生有顾虑，不好做粉丝变现，这个要看医院的宽松程度了。如果你觉得自己变现不合适，可以和人合作，把粉丝导过去。比如让亲戚在微信里卖母婴营养品代购，然后你只需要找一个理由给患者介绍一下，这个代购还挺靠谱就可以了。


    +   b. 千万不要急着变现，一些患者会很难缠。先给用户足够的免费科普内容，筛选出合适用户，然后再用合理的方式变现。


    当然，估计打造个人品牌对你来说也不算容易。但跟理财相比，打造个人品牌是明显的滚雪球，只要你做，就一定有效果，只是效果好效果差的区别，而理财，可就不一定了。


