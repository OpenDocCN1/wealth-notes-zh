- pgno: 986
  md: '# 关于奥克斯空调股份有限公司生产销售

    不合格空调产品的举报信


    国家市场监督管理总局:


    5月24日，国家市场监督管理总局、国家发展和改革委员会、中华人民共和国水利部联合下发《关于加强能效水效标识监督检查工作的通知》，要求各地监管部门进一步加强能效水效标识监督检查，打击虚假行为。我司特向贵局实名举报奥克斯空调股份有限公司生产销售不合格空调产品的问题，提请贵局核实查处。


    众多消费者此前曾向我司反馈奥克斯空调价格便宜但耗电量很大的意见，经我司实验室（获得CNAS认可，具备检测资质）实测，奥克斯空调股份有限公司生产的以下型号空调产品与其宣传、标称的能效值差距较大。经我司委托有专业资质的第三方机构检测验证，检测结论与我司检测结论一致，能效比和制冷消耗功率的检测结论均为不合格。生产销售此类产品不仅严重侵害了消费者的合法权益，对国家节能减排环保政策以及市场公平竞争也造成了巨大破坏。


    涉及具体型号包括：KFR-25GW/NFW+3、KFR-35GW/NFI19+3、KFR-25GW/ZC+2、KFR-35GW/HFY+3、KFR-35GW/NFW+3、KFR-25GW/NFI19+3、KF-26GW/NFAI+3、KFR-35GW/ZC+2等8个型号。以KFR-25GW/ZC+2为例，标称能效比3.59（达到国家二级能效标准），第三方实测值仅为2.68，远达不到3.40的国家二级能效标准，距离3.20的国家强制性标准也有较大差距。不排除其他在售型号也存在类似问题。


    奥克斯空调股份有限公司生产销售不合格空调产品的行为，严重违反了国家《房间空气调节器能效限定值及能效等级》(GB12021.3-2010)的强制性标准，违反了《产品质量法》第二十六条第二款第（三）项、第三十二条的规定，违反了《标准化法》第二十五条的规定，涉嫌构成生产销售不合格产品且销售金额巨大。目前，上述产品仍通过主流电商平台及实体卖场销售。据奥维云网公布的中国空调电商市场零售额TOP20机型排行榜数据统计，仅KFR-25GW/NFW+3、KFR-35GW/NFW+3两款机型产品2018年线上零售额就高达16.71亿元，销售量近百万台套。


    鉴于上述情况，我司根据《产品质量法》第十条、《标准化法》第三十五条规定特向贵局举报，提请贵局依照《产品质量法》第五十条规定依法查处。如相关行为涉嫌构成《刑法》第一百四十条生产销售伪劣产品罪，请移送公安机关依法追究刑事责任。


