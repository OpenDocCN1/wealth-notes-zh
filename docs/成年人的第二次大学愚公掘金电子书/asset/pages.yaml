    # ## 6.线下培训的教师资源从哪里来？


    Angela：人力资源部在各招聘渠道投放广告，从师范学院及相关专业学员招收应届毕业生，或邀请在校生参观校区，为后期留人做铺垫，三线培训机构教室流动率大，机构之间老师流动互换，内部同事推荐，外部家长推荐，前期会有公办学校老师在培训机构兼职，现在国家明令禁止。'
