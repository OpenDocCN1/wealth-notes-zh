- pgno: 896
  md: '说到这，可能有人不愿意了：花爷，你怎么教人家溜须拍马呢？


    不好意思，这就是体制内的现实，不然你告诉我，一个二十人的路政大队有什么做公众号的必要？这事儿在非体制内环境，本身就概率极低。


    如果你做自媒体的能力很强，可以再问我如何蹭热点、如何和用户互动等等，但我必须明白的告诉你，二三线城市的体制内部门，业余时间做公众号非常成功的概率，无限接近于零，这就是现实。


    所以，最好的策略，就是做好1、2两点，同时一定要多跟领导沟通，让他感觉到你对这事儿上心、在不断努力。至于第3点，确实看个人天分了。


