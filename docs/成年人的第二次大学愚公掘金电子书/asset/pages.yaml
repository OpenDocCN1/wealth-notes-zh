- pgno: 730
  md: '# 花爷给职场新人的十条心里话


    # 提问：


    花爷好：


    目前正在选择职业生涯第一份正式的工作，想就相关问题向您寻求一些建议。先交代一些自己的背景吧：


    新闻传播学专业硕士准毕业生，意向是找一份互联网营销相关的工作


    我的优点：爱好钻研和学习，善于总结复盘，有较好的写作能力，对问题会进行系统和深入的思考'
  merge: -1
  img_proc: true
- pgno: 731
  md: '缺点：缺乏和社会接轨，目前没有太多相关的工作经验，不够自信，很多时候想法很多但很少真正去执行，理论多实践少


    我的未来愿景是最终不受公司限制，凭自己掌握的知识和技能获得收入，打算用5~10年时间实现这个目标。不过现在先找一家公司选择一个岗位工作才是一个比较符合实际的开始，所以，针对我的这个目标，想向您需求一些意见和建议！


    # 回答：


    这个问题挺宽泛的，我针对职场新人这个身份给一些建议吧，在职场上不顺的花友也可以参考：


    +   1. 在职业决策、人生岔路等重要时刻，请谨记你5-10年的目标，它会帮你站在更高的视角看清问题的本质，一个有远见的决定可以少走几年弯路。


    +   2. 在平常工作时，忘记你5-10年的目标，脚踏实地的做事。你说你想的多执行少，那我更要建议你，详细的规划不要超过半年，多做事少乱想。'
  merge: -1
  img_proc: true
- pgno: 732
  md: '3. 在职场上，不要在乎谁好谁坏，不要在意别人的缺点，一进公司就寻找厉害的榜样，对照别人的优点拼命吸收。


    4. 当领导批评你，不管你错没错，请马上说出三个字：对不起。


    5. 说完对不起，如果还能立马给出有效的解决方案，基本就是公司最靠谱的前10%。


    6. 除了磨练技能，多和不同部门的人沟通，一方面可以认识更多厉害的人，另一方面可以磨练短缺的沟通能力，而沟通是基层人才进阶的必备选项。


    7. 如果不擅长沟通，那就找各部门最外向的人做朋友，最适合社交的场合包括茶水间、一起吃饭、一起下午茶。


    8. 你不是老板，你无法说服任何人，如果和同事争论不决，那就请领导决定。领导确定的结果，可能很傻，可能是有你不能知道的深层原因，不要抱怨，哪怕是领导的错误决定，你也要执行的漂漂亮亮。'
  merge: -1
  img_proc: true
- pgno: 733
  md: '+   9. 职场就是生意，老板出钱，你出自己，如果觉得公司不行，那就马上准备跳槽，感情和理想不能当饭吃。


    +   10. 收藏这个回答，过一段时间就来看看，如果你再来时，发现这十条已经不能给你更多收获了，恭喜你，你进阶了，可以再咨询下一个阶段的问题。


