- pgno: 42
  md: '我是17年11月23号开始做APP的，当初纯粹为了玩，为了锻炼技术，当我看见市面上有同类产品（做的不如我的）能赚钱的时候，心里开始痒痒了。于是在18年做了2.0版本，并推广运营(我的app免费无广告体验相对较好)，天真的我想要干过同类产品，最终现实给我上了一课。没推出去后，APP扔那快半年了没有管，有一天闲着无聊看友盟数据，发现用户居然有上升趋势！于是开始投入点时间进行维护，维护后从新增几十人
    到 新增几千人，当时的心情和赚多少钱没关系了，就觉得APP做成了，不赚钱无所谓 但是我没白干！现在用户已经有25万，次日留存50%左右，使用时长30分以上占60%左右，新用户4周留存22%左右，活跃用户4周留存50左右。


    ![](img/5688f8284c7103ed77046cfddaf3da13_42_0.png)'
