  md: '乐尚： ab单之前一直在做，之后应该是淘宝封杀就彻底不做了，现在做ab单完全就是买家激活群里用户。来增加活跃用的，并且ab单有一定几率封阿里巴巴账户，一般做ab单都需要好多阿里巴巴账户来操作。ab单一般就是3000单1000单左右就是商家来拉评分的，量大了很多商家也承受不住。


    # 10、淘客的推广渠道一般有哪些？


    乐尚： 渠道很多，网站。app，微博微信群。QQ群！只要有人的地方就有淘客存在，不过现在大量还是微信群。


    # 11、招来的人会存在，学会整套流程就拍屁股走人吗？


