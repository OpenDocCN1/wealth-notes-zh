  md: '# 一线城市房价有泡沫吗？


    提问：


    花爷，刚刚看了你分析房地产的文章，但是我观察到以下一些现象:有数据说中国几个特大城市的房地产总值已经超过全美国房地产总值了; 就业带来的住房需求其实通过租房就可以解决，是一种伪刚需;
    目前特大城市的租房价格对比该城市的人均可支配年收入，个人估算在20%~40%之间，北京会更高一些，这说明租房市场的涨价空间有限; 目前通过出租房屋可获得的收益比在1~2%左右，也就是一套500w的房子一年租金只有5w左右，这个甚至跑不赢通胀，也就是投资房地产获利的唯一途径是房价上涨，然后转手卖出。


    这些情况是否表明一线城市的房价也有很大泡沫呢？'
  merge: -1
  img_proc: true
- pgno: 575
  md: '# 回答：


    你在问题里列了很多数据支撑，但其实逻辑上都很难自洽：


    # 1.租房就可以解决住房问题，所以买房是一种伪刚需吗？


    人每天只吃饭不吃菜也饿不死，那吃菜是一种伪刚需吗？显然不是。买房和吃菜同理，只要你有能力垫垫脚买房，只要经济还不崩盘，买房就是刚需。


    # 2.房租占上班族收入的20%，所以涨价空间有限？


    且不说20%这个比例是否准确，假设它是正确的，房租占收入比就固定在20%这个比例上，那人均收入本来就是逐年上涨的，房租岂不是每年跟着上涨，哪来的涨价空间有限？恰恰相反，能跟着社会经济大潮上涨的商品，是非常厉害的。


    # 3.投资房地产只能通过房价上涨赚钱，一线城市是否有很大泡沫？'
  merge: -1
  img_proc: true
- pgno: 576
  md: '照这个逻辑，过去十几年，投资房地产都是通过涨房价赚钱的，岂不是每年都有很大泡沫？事实上，一线城市不缺人，是最不担心房价泡沫的。


    房价这个事，短期看政策，中期看人口，长期看制度。对投资和刚需买房的人来说，怎么理解人口的流动呢？


    如果你对世界工业史有一点了解，你会发现，最早的霸主荷兰发展稳定之后，国内资源有限，投资收益也有限，资本为了寻求更高的收益，开始投资英国，然后英国崛起了，就把荷兰拉下了马。


    等英国发展稳定后，出现同样的问题，资本开始投资美国，然后美国崛起了，把英国挤下去。


    等美国发展稳定了，开始投资中国，现在美国国内……


    而你再看国内的发展史，其实就是一个微观世界发展史，一线城市饱和了，开始带二线城市，二线城市厉害了，开始辐射周边三四线城市……唯一的区别是，从长期来看，因为我们制度和先天资源的优越性，二线硬把一线拉下马的概率是很小的，不存在盘活一个城市就有一个城市要衰落的问题。'
  merge: -1
  img_proc: true
- pgno: 577
  md: '所以到最后，一线城市不愁没人，二线城市也不太愁没人，主要是高端人才少了点，这两个圈层的房价都不会有大的跌幅。三四线城市则在拼命抢人，不然就彻底掉队了。


    最后只剩下小城市、小老百姓，别看房价也在涨，二手房能不能卖得动市场清楚的很。


    话说回来，正因此，大家才要努力向更上一个圈层走啊。


