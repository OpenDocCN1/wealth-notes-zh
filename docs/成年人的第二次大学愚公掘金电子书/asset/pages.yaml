  md: '我的建议还是一样的，主动去交朋友，扩大社交圈子，学会发现身边的商机，最好是还在部队的时候就挤时间做这件事。就跟买菜一样，你得先问一圈价格再决定，别急着把退伍的费用砸进去。（同样的，后面星球里我会讲怎么发现生活里的商机）


