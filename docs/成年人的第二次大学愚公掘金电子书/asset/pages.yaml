- pgno: 737
  md: '我做公众号策略的方法之一，就是找到一些目标公众号，把历史所有文章数据扒出来，找到从哪个节点阅读量开始爆发的，再看看爆发前后的文章内容有什么不同。


    **第二，多和行业内的交流，包括做课的人，也包括课程平台的运营人员。**


