  md: '# 家里老人已经陷入保健品太深，怎么办？


    # 提问：


    花爷好，掘金暂时不多想，想着不丢金。家里老太太人家说什么都相信，各种传销，投了一回又一回，不是金钱返利就是健康养生为名，家里各种劝听不进去，整个被洗脑，我们在南方，南派传销一贯是比较具有迷惑性的，占了便宜尝了甜头，再加不断的心理暗示，老太太根本没有招架之力，无奈我们看着一次次把钱扔掉，还拉着亲友一起，明理的自然不会相信天上掉馅饼，也有愚昧侥幸的参与，像泥潭一样困住他们往下陷，作为女儿真的是又急又气，如何是好？


    # 回答：'
  merge: -1
  img_proc: true
- pgno: 761
  md: '我姑姑之前也被保健品忽悠过，我姐找到我，说劝不住，让我去劝。


    我去劝了几句，知道没戏，陷得太深，就和我姐说：这次认栽，但得买个教训。


    最后我姐同意姑姑花几万块钱买一张号称红外线治病的床，前提是，我嘱咐她把这件事告诉近亲，让大家都知道姑姑被骗了。


    过一阵子，家里亲人逢人就问她：


    你那个几万的床怎么样啦？


    你的颈椎病好没好呀？


    你的养老金买的床怎么不用啦？


    一个个的不明说，也不批评你，其实都话里有话。


    姑姑这时候心里也明白这玩意儿没用了，嘴上不提，再没用过那个床。'
  merge: -1
  img_proc: true
- pgno: 762
  md: '中老年人，很要面子，与其劝她这玩意没用，不如让大家都看她的笑话有效果。过一段时间，只要不傻就明白了，以后再遇到类似的事，怕丢面子也就顾忌许多。


    当然，这是入坑没有特别深的。确实也有的老人，陷得特别深，反复上当受骗。


    很多鸡汤喜欢说：她们是缺乏陪伴，她们想为儿女减轻负担。


    其实真不是，想给儿女减轻负担的，被骗一次也就老实了。凡是反复上当的，无非是心里执拗，一意孤行，就像管不住的野孩子一样，心性定型了。


    如果是这种情况，和你的兄弟姐妹联合起来，摆出强硬态度，直接管住老人的财务来源，从源头上掐死。


    这就好比有人问我，孩子特别顽皮实在管不住怎么办？送私立学校、送军队，用最严的规矩管几年就好多了。


    非常情况用非常办法，早不强硬，晚了也没机会强硬了。'
