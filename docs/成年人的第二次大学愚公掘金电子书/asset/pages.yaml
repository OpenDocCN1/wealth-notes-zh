  md: '# 做中产女性的生意，四个故事带你了解文创课程的玩法分享背景


    # 介绍:


    大家好，我是来自江苏的夏天，我目前从事传统文化相关的工作。在过去的四五年里，我相继在传统媒体和新媒体行业工作过，从去年开始转型做文化产业相关内容，可以说在这个行业还是个新手。跟前面几位大神相比，我的分享在深度上会欠缺很多，想了很久，只能从广度上尽可能多覆盖一些方面，希望通过4个小故事，给大家描绘一下我所从事的这个行业的一些面貌。


    # 分享:'
  merge: -1
