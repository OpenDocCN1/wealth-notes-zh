- pgno: 765
  md: '1. 新项目基本跟创业差不多，做烂太正常了，特别是在互联网公司，厉害的产品怎么成长起来的？做烂几个项目，烂着烂着总结经验，就成长了，重要的是把经历转换成经验。不用太放在心上，也不要不甘心，失败才是年轻的常态，你只需要赢一次就够了。


