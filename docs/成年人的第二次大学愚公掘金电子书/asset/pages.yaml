- pgno: 631
  md: '备注：我们产品批发价在20-50元之间。产品销售价格大约在50-200之间。有较高的利润率：


    # 回答：


    # 1.信任你的产品


    题主后来私聊我说，产品是新疆的金丝玉。玉器这东西，你的售价应该不算高的，可以主打性价比。


    想让人代理，需要先让别人自己有购买欲，别人才会觉得好推，不用昧着良心推。具体怎么为自己的产品写一个好故事，可以参考这篇：https://t.zsxq.com/MZRRVzF


    # 2.信任你的代理能赚钱


    要让新人们知道，做你的代理能赚钱，而且大概率能赚钱。你已经有导游在帮你推了，成功案例应该能找的出来吧？


