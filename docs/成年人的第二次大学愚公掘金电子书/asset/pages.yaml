  md: '# 三、做社交电商可以赚钱吗？


    普通人可以通过社交电商赚钱吗？答案是可以。


    这里，就需要了解社交电商的模式。


    目前市面上有2种比较主流的类型：


    # 1、无门槛准入型


    前期通过无门槛的流量获取方式迅速起量，比如小红书、芝麻鲸选等。之后用户主要的获益方式是分佣。这个模式的优点在于前期增量足够，缺点在于后期用户的主动能动性不好掌控。


