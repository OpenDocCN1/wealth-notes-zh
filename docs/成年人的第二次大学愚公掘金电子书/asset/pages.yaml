  md: '# 为什么一支药可以卖1448万？花爷讲解“价格”的第二弹


    昨天讲到“所有用户愿意买单的溢价都是合理的” (https://t.zsxq.com/eqZVVVV) ，今天正好看到一条新闻，也和价格有关，很有意思。


    这条新闻说，美国最近批准了一个天价药，这个药可以治疗一种罕见病，但价格高达每支210万美元（换算人民币就是1448万）。


    对这个新闻，可能会有三种看法，这三种看法，就是人的三个层次：


    +   1. 觉得药厂黑心：'
  merge: -1
  img_proc: true
- pgno: 1011
  md: '没啥好说的，最笨蛋、也是终将被压榨的最狠的人，屁股焊在社会底层。


    # 2.觉得合理，因为药厂科研花费巨大：


    这种说法在《我不是药神》热映的时候非常有市场，很可惜，不对。


    我们假设现在有一种长寿药，吃完立刻多活100年，生产成本是100元。现在有两个价格方案，一是卖101元，二是卖1000元。请问，如果你是药厂，你会选择卖101元吗？明明101元也覆盖成本，还能赚1元钱呢。


    你不会选101元，因为不管是101还是1000，大部分人都能愿意买，为什么不多赚一点呢？


    所以，最正确的理解是：


    # 3.价格高与成本无关，与善恶无关，之所以一支药能卖210万美元，只有一个原因——美国人民买得起。


    1004'
  merge: -1
  img_proc: true
- pgno: 1012
  md: '如果你深入了解，你会发现，天价药虽然卖210万美元一支，但只要一支就能治好，而如果用传统的手疗法，价格远超210万美元（还不一定治得好）。


    \*\*\*\*\*划重点，价格贵不贵不重要，比竞品有优势就行。


    另外，美国有非常完善的医保制度，这210万的大部分会由医保支付（类似于全美国人民一起分担），剩下的部分也允许患者分期支付，总之咬咬牙能够接受。


    划重点，价格贵不贵不重要，用户买得起就行了。


    所以结论非常神奇：


    这个药贵，贵就贵在它在美国卖，美国人民有钱、买得起，所以这药就贵。


    举个例子，去年七月，美国有个9岁的小女孩Yoder在夏令营的时候被一条铜斑蛇咬伤，送到医院紧急注射了四针抗蛇毒血清，每支血清价格高达3198美元。而在仅有一条国境线之外的墨西哥，类似的血清价格是200美元，价格差了16倍。'
  merge: -1
  img_proc: true
- pgno: 1013
  md: '所以现在你可以理解，为什么有些药只在美国销售——因为只有美国能卖出高价，其他地区的医疗系统支付不起，价格定低了又会影响美国的价格体系。


    价格是商业的灵魂之一，今天的内容可能对部分花友有点深，多读几遍，好好理解。明天有空的话，再给大家讲讲价格的另一重意义，突然发现这样每天讲点小知识的形式还挺好的。'
