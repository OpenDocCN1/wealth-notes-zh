  md: '# 同事能力比我差，薪资比我高，应该找HR谈吗？


    提问：


    花爷你好，上次因为入职薪资低于市场价2k，有提过问，后来有去找他们的HR聊，但是没能加钱。后来通过猎头我推荐了我的同事过去，他的薪资开的比我高2k，我们在现在这家公司，工资水平可能我会高点，而且领导对我更认可，因为我获得了一个奖金激励，他那个时候差点没转正，我有必要再找HR谈下工资吗？


    回答：


    没必要，非常没必要。'
  merge: -1
  img_proc: true
- pgno: 723
  md: '+   1.职场上，薪资跟工作能力只有相关性，没有必然性。


    工作几年的老员工，薪资没有刚进来的应届生高，能力很强的员工，薪资和能力一般的员工差不多或者没有高多少，类似的薪资倒挂问题，很多公司都有。


    工作能力，是个人能力的一部分，面试谈判、个人影响力、资源渠道，也是个人能力的一部分。你在面试时没有谈好价格，是你犯的一个错误，不是公司的错误，也不是你同事的错误。


    +   2.聪明人不做没有意义的事。


    你已经谈过一次薪资，被拒，再去谈，仍然不会有结果。恰恰相反，你企图以同事不行为由，弥补自己面试时没谈好价格的过失，反而显得格局有限、对职场理解不深，还会给HR、同事坏印象。


    +   3.既然说了也没意义，那就不说。要么忘了这回事，安心上班，要么走人。'
  merge: -1
  img_proc: true
