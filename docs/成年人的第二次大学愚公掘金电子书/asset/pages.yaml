  md: '我想大家都看过这些广告，这些广告基本上到处都是，有几个特点：第一个：这些产品都不是知名的品牌。第二：产品描述给人感觉价比非常高。第三：交易方式全部是货到付款


    二类电商产品大多是短时爆款，比如应季的衣服，夏天时候的灭蚊灯，灭蚊器，电子产品，化妆品等等，我大概给大家讲解一下他的盈利模式


    # 例子：


    就拿我们之前操作过的一个例子：智能手表


    当时我们智能手表卖198元，广告是在微信公众号文章底部投放，属于腾讯的广告。当时广告成本大概在40元左右会有一个订单，对接深圳智能手表工厂，产品的成本是50元一个，快递费用10元，订购的大部分是年轻人，很多大学生，因为当时智能手表正火，产品的签收率60%-70%。


    那么我们来算一下利润：'
  merge: -1
  img_proc: true
- pgno: 227
  md: '198（销售价格）-40（广告费）-50（产品成本）-10（快递费）=98


    因为签收率60%-70%，我们按照60%来计算


    98*60%（签收率）=59元


    我们最后得出的毛利润是59元每个订单，再除去退货运费，包装，人工等等，大概还有40-50的纯利润。


    有了利润，接下来做的就是放大广告投放力度，在广告成本可控的情况下，放的越大获利也就越多，一天1000单的话会有4-5万的获利。我们当时数据好的时候，一天会投出去几十万吧，这就是二类电商的商业模式。


    但每个产品都有生命周期，长的有2-3个月，短的只有十几天，原因在于一旦你广告投放加大，同行就会跟进！用户被很快洗一遍，广告成本开始增加，直到覆盖了你所有利润，那么生命周期结束，换一个产品。


