  md: '从0.460元跌至最低0.433元，验证了“当你买后就会跌”股市定律。于是在买入后，我就开始装死，一直等待0.48元的到来…华宝油气后来的价格走势由低到高，再到最近的走低。如果我一直抱着0.48元的价格再卖，可能我就和现在的进化后的网格交易无缘了。（实际上，第一笔卖出是在7.1日的0.467元，中间近一个月的华宝油气交易价格0.44，0.45,0.46元我都没有任何动作）。


    # 五、反思与进化


    现在回顾华宝油气的6月份的短期走势，最大价格差在0.038元，预定价格差为0.025元，似乎是可以做到的。


    但是实际上，这份表格是完全做不到的，因为没有考虑执行网格是人。最主要的因素是贪婪，在后面又分别对网格做2次，3次改进的时候，价格差分别为0.03元，0.04元（这里可以看到，不管嘴上怎样说，内心的贪婪还是会表现做事上的。）并且，这份不成熟甚至是失败的表格，还会直接影响到个人的情绪，导致无法正常的进行工作。'
