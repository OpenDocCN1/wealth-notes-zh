  md: '# 从微信封杀百万账号，再和大家聊聊私域流量


    私域流量上周又闹出幺蛾子，微信一下封杀了数百万的微信号，这些微信号是什么类型，大家心知肚明。


    六月初的时候，私域流量这个话题刚火，我就在星球里聊过，大体上，我是支持的。现在大批微信号被封杀了，有人问花爷你还支持吗？


    当然，我会一直支持经营私域流量，注意重点的两个字：“经营”。


    很多人说自己在搞私域流量，就是立个牌坊，其实根本没把用户当人。只要我疯狂加好友，然后疯狂群发消息、朋友圈刷屏，哪怕我卖的是垃圾，只要垃圾够诱人，也一定会有傻子买。'
  merge: -1
  img_proc: true
- pgno: 942
  md: '这样的逻辑，催生的是什么产物？批量机器操作大量微信号，毫无商业诚意可言，因为不把微信好友当人，那就更要卖高利润的产品，什么产品利润高？包装完美的垃圾利润最高。


    这样的商业逻辑，严重影响微信生态内的体验，微信不封你封谁？当你做这样一门快速起量、快速收割的生意开始，就要做好被封的准备。


    但正确的经营私域流量就不一样了，正常的交易买卖关系，本身就是社交的一部分。私域流量这个策略，是对你的生意的一种加成，你卖货，私域流量提高传播和复购，你写自媒体，私域流量提高触达和用户黏度，你做线下生意，私域流量提高成交。


    就拿我自己举例，我从写公众号的第一天开始，就开始往私人微信引流，我的粉丝有接近一半都在私人微信里。相比公众号更新，我在朋友圈更新的内容，会更真实，更容易产生用户信任。


    说白了，微信封的不是私域流量，而是恶意营销，你在微信里正正经经做生意，对整个生态是有利的，当你的利益和平台的利益一致，平台就不会搞你。'
