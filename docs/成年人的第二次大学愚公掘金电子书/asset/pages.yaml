- pgno: 441
  md: '作为平台商家，基本的流量来源都是平台的站内流量，就是说可以先不用考虑自主引流的问题。平台类目的流量其实是相对稳定的，平台发展好，投入多，卖家们所获取的总流量则多，反之亦然。


    所以平台卖货，可以看作是赛道赛跑，要比你的对手做得更好。短期内快速起来的卖家，必然意味要从别的卖家嘴里抢更多的蛋糕。套用句话，“用技术手段超越低价对手，再用产品（质量，价格，服务）和高阶对手竞争”。其实很多行业也是这个道理。


    平台算法虽然一直在改，但是核心指标往往离不开 点击率，转化率，GMV （销售额）。


    （1） 点击率 = 点击查看产品的次数/展现在客户面前的次数；


    （2） 转化率 = 成交人数 / 访问人数；


    算法依靠数据来判断，既然有数据就可以造数据——持续高于，甚至远超平均水平的好数据。


    说人话 —— 刷单。'
  merge: -1
  img_proc: true
- pgno: 442
  md: '算法一直调整，相应高级玩家（尤其是竞争激烈的标类行业）的刷单资源，刷单模型也一直在升级。依据算法的调整，类目产品的不同，围绕核心数据去打造产品成长路径模型。


    这一套，淘宝天猫卖家信手拈来，速卖通目前还是低阶版的天猫，所以甚至还可以参考天猫之前已经落后的打法，这也算信息差降维打击。但是速卖通收益小，国际市场竞争激烈，流量也小，很多天猫大卖家还看不上这点蛋糕。


    不刷单呢？当然可以，做广告占据优势位置，不赚钱，往往还要亏本卖个几千件 —— 用钱把数据砸出来。要考虑的就是收益能否跟前期投入匹配。


    造出来的数据只是让你在前期跑在前面，获取平台流量，但是能不能持续，最终还是要看你的产品。（质量，价格，客户评价等综合考量）


    所以，大佬们都会跟大家说 —— 产品才是王道。'
