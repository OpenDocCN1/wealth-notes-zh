  md: '# 想在家做冰粉销售，这事儿靠谱吗？


    # 提问：


    匿名用户 提问：花爷，由于字数限制，内容已图片形式展现。还请花爷指点一下，感谢！


    ![](img/5688f8284c7103ed77046cfddaf3da13_795_0.png)


