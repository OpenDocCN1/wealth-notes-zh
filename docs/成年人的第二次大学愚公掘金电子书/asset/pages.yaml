  md: '+   (4) 对知识的掌控性更强，学生可以选择自己感兴趣的门类学习，拥有了自主选择老师的权利。


    +   (5) 定价相对现在培训机构价位，有时要低得多。


    +   (6) 线上培训如果能做好并用好大数据的收集，对于增强用户的粘性是非常有效的。


