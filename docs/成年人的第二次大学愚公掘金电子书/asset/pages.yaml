- pgno: 963
  md: '# 贫困县花4000万拍电影，层层外包只剩135万，这事儿怎么看？


    最近有篇文章讲了贫困县是怎么花掉4000万，文章爆火之后被删了。


    事情是这样，万全县以前是个贫困县，后来脱贫了，准备斥资4000万拍一部水幕电影，为即将召开的旅游发展大会和冬奥会献礼。


    这4000万，去掉喷泉、灯光各种硬件，还剩1000多万用来拍电影。


    严某的公司拿下电影项目之后，以400万的价格转包给老乡方某，方某又以220万的价格转包给了博能时代公司。'
  merge: -1
  img_proc: true
- pgno: 964
  md: '博能时代的老总刘某留下50万，用剩下的165万转包给学弟汪某。


    汪某又把这个项目以135万的价格转包给了他的学弟李某。


    李某手下有个小团队，签完合同准备开工，被告知需要给团队配一个专业导演，于是花10万块找到了这篇文章的作者，结果拍完了电影，连10万都没付清，还剩4.5万一直没给。


    于是作者就写了这篇文章控诉，文章一下就火了，作者马上收到了4.5万尾款，然后主动把文章删了。


    这事儿有意思在哪呢？我看很多人的反应是，层层外包吃空饷！黑心！但是花爷强调什么来着，别看热闹，多动脑子做个聪明人。


    首先，这事儿的过程，本质上是1000多万的电影预算，以135万报给了制作团队，90%的预算在流转中被消耗了。


    其次，我们来拆解下这90%是怎么消耗掉的。'
  merge: -1
  img_proc: true
- pgno: 965
  md: '# 1.严某，拿下项目，400万转给老乡方某，方某220万转给博能时代公司。


    这里就有个问题，如果你是严某，为什么不直接220万转给博能？还要给方某倒一手？平白多损失了180万，多心疼啊。


    唯一的解释是，严某的能力，是拿到上面的项目，但上面的项目，可能是电影，可能是修路，可能是地产，五花八门，严某没办法面面俱到认识那么多一线工程公司，他最有效率的解法，就是找到在电影方面有资源和经验的方某，让他找个能把这事儿办成的工程公司。这次拍电影是找方某，下次修路可能就找黄某去了。


    # 2.博能时代公司的老板，又分两次转手给学弟李某。


    注意，其实这两次转手，在商业市场里算是正常的，你开个开放软件的外包公司，程序员也都是刚毕业的大学生帮你做。220万变成了135万，资源流通的损耗已经没那么高了，互联网外包的流通损耗可能比这个大。'
  merge: -1
  img_proc: true
- pgno: 966
  md: '这么一拆，你会发现所谓的层层外包，最大的损耗其实出在上游，也就是严某这，问题的根源就在于，为什么严某能拿到1000多万的项目又有权轻松的以400万转出去呢？嘿嘿。


    如果你是体制外的人，不要抱怨，因为抱怨也没有用，上游损耗的问题在哪里、在哪个年代都存在，你只能理解社会运转的规则：上层资源=钱。


    如果你是体制内的人，更不要抱怨，人是变色龙，在哪安家，就要披什么颜色，不然你就搬家让位。


