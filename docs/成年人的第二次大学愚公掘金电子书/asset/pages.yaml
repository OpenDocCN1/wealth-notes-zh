- pgno: 796
  md: '+   1、和店铺合作，主要倒不是口感好不好，而且这个模式一但成了，店铺会迅速更近自己做，把你排挤掉，不长久。


    +   2、3的配送其实也不是大问题，可以找达达接单配送。


    其实我看下来，你最主要的问题是选品不好，选了一个你们想做的，而不是用户想要的，冰粉这个品类受众太窄了。


    首先冰粉必须现做现吃，保质期很短，你们能覆盖周围五公里就不错了。


    其次大众吃冰粉的频次不高，上海这边冰粉都是辅助正餐的周边产品，没人特地去吃它，也很少有人拿它当下午茶。不知道北京的口味是否不一样，但我估计受众也高不到哪去。


    两者一结合，周围五公里的人群里有强烈欲望吃冰粉的人就更少了。


    给你三个解：'
  merge: -1
  img_proc: true
- pgno: 797
  md: '1.如果你家人只是想在家做点事创收，那我感觉"回家吃饭"这种平台可以尝试，就是你们家的饭菜多做几份，卖给消费能力高一点的白领，客单价也会高一些（这些人主要是图个干净、家乡口味，我偶尔会吃），你可以了解一下，做个备选项。


    2.如果你坚持想做冰粉，那一定要做的很有特色了，所谓特色，要么是很好吃（这个难度挺高的，我总觉得冰粉再好吃也不会差太多），要么是有噱头，比如加一些特殊的辅料，宣传可以除湿、调理皮肤等等，主打女性白领。然后去园区做低价试吃活动，往微信引流，配合朋友圈的宣传包装。


    3.其实这种在家做吃的成功案例是有的，但不是做冰粉，大多是做点心，做得好的收入非常可观。首先点心的应用场景多，除了下午茶，包装的好还可以送礼，其次点心保质期长，可以邮寄，无形增加了覆盖范围。可以预见的是，即使你做冰粉成功了，冰粉也是季节性的，如果想长期发展，早期一定要做好手工造、小众精致的定位宣传，这样以后容易扩展其他产品销售，不会被冰粉困死。'
  merge: -1
  img_proc: true
- pgno: 798
  md: '无论你选哪条路，切记，这种在家手工制作的食品，精致、逼格、文艺、和顾客的交友关系非常重要，是立足之本，甚至可能比口味还重要。没有店铺引流的食品店，复购是最核心指标。


