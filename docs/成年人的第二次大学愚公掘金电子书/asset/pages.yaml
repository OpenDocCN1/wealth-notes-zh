- pgno: 944
  md: '# # 如何看待垃圾分类？别

    # 看热闹，看门道


    看到很多人在质疑垃圾分类：反正垃圾最后都是一车拉走统一处理，干嘛还要垃圾分类？不是白干吗？？


    所以我才经常跟大家说啊，别光看热闹，多看门道。


    现在我们假设，你是领导，决心通过垃圾分类处理，解决垃圾问题，你会怎么考虑？


    首先我们要知道，垃圾处理行业可以简单粗暴的分成三类：垃圾制造者（也就是我们老百姓），垃圾中转者（垃圾站），垃圾处理者（处理垃圾的公司）。


    然后，作为领导，你要决策，现在我们要让哪一环来做垃圾分类的工作呢？'
  merge: -1
  img_proc: true
- pgno: 945
  md: '如果是垃圾处理者或者垃圾中转者做，那毫无疑问，你得给这些公司钱，钱从哪来，老百姓的税收。


    也就是老百姓交税去做垃圾分类的处理，但问题是，老百姓不理解垃圾不分类有什么问题啊！什么？影响生态环境？再活几十年我就死啦，关我什么事？这钱硬要收，会有困难，就算钱收上来了，通过各级部门分到垃圾处理公司的手上，流程中几乎一定会有产生损耗，到时候更难办，想想贫困县4000万多水幕电影预算是怎么被瓜分的？（https://t.zsxq.com/mu3VnIq）


    所以，干脆直接把垃圾分类的工作众包给垃圾制造者——老百姓，谁制造的垃圾谁分类，我也不收你们的垃圾处理费了，这部分税收省了还能去别的地方改善民生。再说了，其他发达国家也有现成经验，就这么定了！


    紧接着，第二个问题，领导，您看，垃圾处理公司都没做好准备，我们是等他们做好准备，再让老百姓进行垃圾分类呢，还是直接开干？


    有人说了，那肯定得等人家准备好啊！万事俱备只欠东风嘛！'
  merge: -1
  img_proc: true
- pgno: 946
  md: '你看，你这么想，你就当不成领导。事实证明，普通人之所以普通，就是要等所有事情都准备好，所以他们一直都准备不好。而能突破天花板的人，能当领导、当企业家的人，永远想的是先让轮子转起来。


    哪怕轮子转起来，跌跌撞撞，没关系。只要不散架、能走，那转起来了，就前进了。


    事实上，领导是这么想的：


    垃圾分类的推广，总要时间吧？一年、两年甚至更久，这段时间里，老百姓生产的垃圾肯定还是没有达到分类标准。


    如果等垃圾处理公司的技术成熟了，设备落地了，人员配置好了，再推广垃圾分类，那很长一段的时间里，工厂处理的其实还是没有达到分类标准的垃圾，那技术不是白研发了？设备不是白买了？人员不是白发工资了？


    企业一天不盈利，就是在亏损，这么搞，企业是要亏钱、倒闭。一旦一批做垃圾分类处理的企业倒闭，后继者就不敢再入局了，整个链条岂不是断了？'
  merge: -1
