- pgno: 1051
  md: '# 花爷聊聊人生的节奏感，对大事、小事可能都有用。


    说说人生的节奏感。


    话题从一位花友的提议说起。有天这位花友和我说：“花爷，咱们要不要搞搞小活动，把星球里搞活跃起来？不然总是你输出，虽然质量很高，但是怕你太累了”（天啊被感动了！）


    其实这位花友说的是对的，长远来看，大家一起输出肯定是最好的。但问题是，大家行业、背景、甚至认知水平其实还是有差异的，怎么保证大家输出的内容，是优质的、花友们都爱看的呢？'
  merge: -1
  img_proc: true
- pgno: 1052
  md: '这就需要细致的活动、规则设置，目前我和小助手已经在准备这样的活动了。而在完整的活动出台之前，我宁肯先保证输出质量，暂时舍弃数量，原因有二：


    第一，现在的数量其实也不算少，很多花友估计是一周挑个时间一次性刷完。


    第二，现在虽然数量不太多，但想号召大家一起参与，不难。但贸然推出活动，一旦质量把控不住，内容变水，用户的信任感会消失，以后再想把用户唤回，就难了。


    所以，高质量、高门槛，是初期比较合理的选择。


    再拔高一层，其实大多数生意、大多数人生，都是一个长期的事，并不需要急于一开始就做到十全十美。正确的做法，是分得清主次，把控好节奏，像浪潮一样循序渐进的良性发展。'
  merge: -1
  img_proc: true
- pgno: 1053
  md: '举个例子，第一代iphone堪称划时代的发明，大玻璃屏、手势交互、app矩阵系统，引领了未来十几年的移动浪潮。但你知道吗，第一代iphone甚至没有简单的文字复制粘贴功能，说出来你可能都不敢相信，复制粘贴功能是一直到三年后的iphone4才被加上的。


    这也是我之后会反复提到的“长期收益、指数盈利”的思想。人生是一场马拉松，却有太多人把它当成了百米赛跑，其实你并不需要比所有人跑得快，只要沿着正确的路线跑完，就能赢。


