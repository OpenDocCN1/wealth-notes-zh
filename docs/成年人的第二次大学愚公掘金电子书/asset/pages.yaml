  md: 'AI- Artificial Intelligence，人工智能是目前很火热的前沿科技，被中美都列入了国家战略规划当中，其重要性不言而喻。当然，人工智能涉及的技术范畴，覆盖和已经应用的产业都非常的宽广，今天这里我只能比较粗浅的介绍下。


    底层核心技术主要是机器视觉CV、机器学习ML、语音识别ASR、自然语言处理NLP等。核心产业：主要是智能的基础设施、信息数据处理、技术服务、智能产品等。比如AI芯片、智能传感器；数据采集、数据分析、数据处理；技术平台、算法模型、整体解决方案、智能在线服务等。关联衍生行业：信息系统集成、软件开发、电子材料、电子元器件；智能制造、智能家居、智能金融、教育、交通、安防、医疗、物流等等。以上就是人工智能行业的一个概况，行业很大，这里就不展开了。


    # 2、接下来我们聊下什么是电话机器人'
