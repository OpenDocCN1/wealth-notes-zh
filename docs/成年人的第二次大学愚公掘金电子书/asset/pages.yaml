    业务层我就不做过多解释了，可以理解为机器人的管理后台，设置什么时候打，给哪些人大，数据统计等。


    目前常见的机器人基本都具备以下能力：


    用户打断:用户打断机器人人:可根据语音音时长长、强度灵活配置


    机器人打断:机器人可打断用户:可设置N秒后打断


    静默:用户静默N秒后机器人播放固定话术询问


    重播:用户表达“没听清”等意图时，机器人播放不不重复但相同语义的话术


    情感分析:包括坐席和客户的情感分析


    敏感分析:包括各种敏感词汇的分析


