  md: '1. 新媒体作为新贵行业，其实也有企业、也有高管、也有高收入的从业者


    2. 这些从业者其实也有学习、积累人脉的需求，但他们不能去传统高校的商学院，因为那里教不了他们，而且都是传统企业的人，积累不了新媒体人脉


    3. 所以，新媒体商学院的需求，就在时代的变化中诞生了。他就是一个传统商学院，在新媒体行业的变种。


    有人说了，我参加过这种商学院，不仅有新媒体的资深人士，还有很多小白、传统企业人、甚至体制内人员啊，怎么回事？


    任何一个商学院，在打出学习和积累人脉的噱头之后，在宣传出名头之后，都会吸引小白和各行各业的人，很正常。


