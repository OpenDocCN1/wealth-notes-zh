- pgno: 954
  md: '# 最近不少人聊收入的事，花爷也和大家说一说


    最近不少帅张、曹大、冯大，不少人都在聊收入的事，年薪百万、月薪五万，等等，有的人听完非常热血，有的人听完又有点绝望。


    今天出了2018年北上广深城镇单位就业人员的平均工资，北京上海的非私营单位平均年薪是14万多，广州深圳的非私营单位平均年薪也过了10万。如果是私营单位的话，大概是8万左右。


    收入这个话题很多人都关心，结合我的感受和大家聊几句：'
  merge: -1
  img_proc: true
- pgno: 955
  md: '1.  很多人觉得这些数据都是平均的，不准，我和马化腾平均一下我也是亿万富翁。其实因为人口基数太多，富人虽然有钱，但富人数量远远不如中产和底层，所以平均数相对的没有想象的那么不靠谱。每年国家统计收入时，其实也统计了中位数，和平均数其实相差不太大。当然你要说国家统计的数据本身就不可信，那就没法聊了，谁也不知道真实数据。


    2.  整体来看呢，大多数人的月薪天花板是15k，这就很看行业的选择了。


    比如互联网行业，毕业起薪过万的非常多，工作两三年15k月薪的也不少，就算你资质差，工作一两年月薪过万至少不算难。但在别的行业，收入过万确实需要沉淀几年。


    3.  白领工资看上去高，但存钱比较难，哪怕是互联网行业。


    北京太干广深太潮，我去的很少，就我在上海的体验来看，与其说是工资上涨了，不如说是房租、物价上涨之后，倒逼工资上涨，公司不涨工资不行了，我问了几个朋友，其实存款速度没太大变化。'
  merge: -1
  img_proc: true
- pgno: 956
  md: '这样一来，公司的压力就大了，相当于房价物价上涨的基础生活成本由公司承担了。所以国家政策里说，保证企业的工资支付能力。


    # **4.白领月薪3w已经是个大坎了，要筛掉90%的人。**


    靠出卖技能赚钱，无轮赚多赚少，本质上都是出卖劳动力，这一点很多岗位和流水线工人确实没区别。唯一不同的，就是流水线工人除了出卖劳动力之外，很难获得软技能和资源，但某些行业可以，这也是我和大家说的开眼、见识和商业思维，但有机会获得软技能不代表一定能获得，仍让只有一部分先开智的人才能主动获取。


    出卖技能的天花板，3w是个坎，5w基本封顶了。


    # **5.每个阶层都很焦虑，不焦虑才不正常。**


    很多人说，平均工资14万，我又拖后腿了，你们赚这么多还不知足。其实你把他换到月薪1w的位置，他就知道了，真的存不下来什么钱。同理，月薪1w的望着月薪3w的，其实3w的人正在愁怎么凑首付，月薪3w的望着5w的，其实5w的正在愁孩子没有学区。'
  merge: -1
  img_proc: true
- pgno: 957
  md: '就我自己而言，收入上涨除了想吃榴莲马上就买之外，没感觉有什么区别。前几天看记账单，上半年就已经花了十几万了，我也有点焦虑……


    本质上，只有期许更好的未来，才会产生焦虑。焦虑不是问题，不焦虑才不正常，只要努力就好了，不要因为是焦虑干脆躺倒不干，那问题就大了。


    # ## 6.很多人都想赚钱，但赚钱不是目的，只是手段。


    今天有个花友提问，问什么副业比较好（晚点再回答）。很多人的第一份工作、从事的职业，可能不一定是自己喜欢的，可能收入不理想，那你去做副业，赚钱是手段，不是短期目标，重要的是给自己提供更多的可能性。


    其实副业、赚钱这些事，赚钱不是目的，只是一种获得更好生活的手段，而更美好的生活，需要的是长期的盈利、长期的赚钱，不要被短期的利益迷惑了。工地搬砖其实收入也不算低，你会晚上去兼职搬砖吗？你不会的，一样的道理。'
