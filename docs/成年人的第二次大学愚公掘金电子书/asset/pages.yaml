  md: "+   甲醛治理收费标准：按污染超标程度和建筑面积收  \n家装：30-70元一平  \n工装15-30元一平\n\n我一开始看到你这个项目，第一个想到的获客渠道就是医院妇产科、幼儿园、家装行业。后来发现这几个你都列出来了，说明你对用户属性还是有一定理解的。\n\
    \n# 回答：\n\n做获客分析，主要分三步：\n\n# 1.从场景倒推属性\n\n甲醛检测/处理，最主要的场景肯定是新装修的房子，这里面又分很多细分场景，其中需求比较迫切的，包括孕产妇、婴幼儿的新房，营业场所快速处理甲醛尽早开业。\n\
    \n# 2.从属性发散渠道\n\n比如对新房空气质量有要求的孕产妇和他们的家人，可以去哪里找到他们？"
