  md: '# 毕业生是不是应该接技术负责人的私人项目？


    提问：


    花爷好！


    我最近有个问题自己拿不定。我是18年毕业，今年3月1号加入深圳一家创业公司，职位产品助理，产品是小程序，面向校园市场，目前还是0到1的阶段。


    这周星期五，公司技术负责人问我感兴趣负责一款面向学校的团务管理产品吗？


    这个项目不是公司的，是技术负责人的个人项目，希望我通过业余时间去完成这个项目的产品工作，并且每个月补贴1000元。'
