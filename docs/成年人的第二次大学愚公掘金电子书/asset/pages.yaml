- pgno: 212
  md: '# 2、增长方向


    第二个话题是前面没有展开讲的增长方向。由于我自己主要看的就是这个方向，所以操作方面的个人感触也会多一些，对于增长流程的设计就有一些自己的总结，这块就主要聊这个话题。


    从我自己来讲，**增长更多谈的是一整块业务的增长，核心指标看的是正价课程的付费情况**，为了完成业务增长，我自己设计业务增长流程会有条主干思路，路径上有三个不同环节，分别承载不同的业务目标，环节是“**建立连接-产生信任-成交转化**”。


    **建立连接环节的核心目的是让用户高效地沉淀到自己的流量池**，产生可触达的关系。产生信任环节的核心目的是让用户对你产生信任，知道你的价值，形成依赖。成交转化环节的核心目的是让用户付费，真正成为你的客户。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '先说建立连接的方面，这个环节需要反复打磨用户的连接路径，即“用户从哪来、看到什么东西、进行什么操作、沉淀到哪里”。然后找量一般分两种类型，投放和老带新（很多人也叫裂变、存量找增量，意思都大体一致）。


    投放，就是花钱的路子，将确定好的连接路径进行付费推广。比如花爷之前号上写的长投学堂，就是靠投放做连接的典型例子。一般而言在线教育行业投放的诱饵更多的是免费试听课、低价试听课、成功案例展示、学习资料等和自身业务贴合比较紧的内容。投放的内容类型常见有软文、海报、贴片广告、短视频等。


    投放渠道会包含sem、微信生态、大的渠道主、头条系、和以抖音为代表的短视频生态等等，这其中sem、微信生态、信息流属于重点被关注的地带，基本属于被有钱的主们轰炸式覆盖，去年竞争到一个正经的付费试听课用户获取成本超1000块。


    纯做投放的话，最多被考虑的就是roi和是否可放大，在很多公司属于非常核心的用户来源。不过这块我烧的钱还很少很少，只能做这么些基础普及了。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '接着说我很熟悉的类型，老带新。在这块可以分的类型也很多，总结来讲是利益驱动型和情感驱动型。


    利益驱动型的老带新，涉及到奖励分配时其实也能划为两个方向，任务驱动和价值池驱动。


    任务驱动的基本逻辑就是，“我有一个好东西，想不想要呀？想要的话，就去完成个简单的传播任务吧”。


    非常代表性的操作方法是群裂变、任务宝，包括我以前做过的一元解锁活动。


    群裂变属于14、15年开始就有人在默默闷声发大财的操作手段，业内的千万级大号有书、大几百万粉丝的轻课，都是通过群裂变方式迅速爆发的。核心路径是其实很简单，“用户看到奖品海报->扫码进群->群内告知想要拿到奖品需要转发海报->转发后告知获取方式->新的用户看到奖品海报”，活动效果视奖品设置、启动人群、用户参与度决定，基本属于简单、暴力又安全的触达方式。只是目前来讲单从效果看，在在线教育领域已经稍微疲软了。有想自己操作的朋友，可以借助工具进群宝自行操作。


    207'
  merge: -1
  img_proc: true
- pgno: 215
  md: '任务宝属于公众号涨粉的神器，同样养起来了很多闷声发大财的项目（大几百万粉丝的新东方绘本馆了解一下）。核心路径同样简单，“用户看到奖品海报->扫码进入公众号->告知想拿到奖品需要邀请n人关注公众号->转发->新用户看到奖品海报关注公众号->拿到奖品”，活动效果同样依赖奖品设置和海报设计，也一样属于简单、暴力的触达方式。风险的话就是微信现在敏感，一般来讲单天涨粉过万就很容易封号清粉。有想自己操作的朋友可以拿自己的服务号，借助工具媒想到、星耀之类的来自行操作。


    另外我自己做过的效果也很不错的活动方式，一元解锁。基本路径是“用户看到优质课程->付费1元报名第一节课->邀请好友报名->额外赠送8节课”，详细的复盘就很多了，以前写过一个复盘可以看看https://mp.weixin.qq.com/s/Oy3AFdhe1_EsyIZjl-Vaqw


    老带新的另一个发力方向，属于打造价值池。常见的手法有各类分销玩法直接奖现金、自建硬通的价值体系。'
  merge: -1
