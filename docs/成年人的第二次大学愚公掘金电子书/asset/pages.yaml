- pgno: 646
  md: '二线城市下的县城，月收入四万以上确实挺小资了……

    我其实也蛮懒的，分享我对抗懒癌的几点经验：


    1. 定一个更高的目标，目标要量化，比如连续健身一个月，比如事业上一年内新开一家分店，并且把目标、进度告诉家人好友，不要孤独的奋斗。


    2. 承认自己是个废柴，先从最简单的事做起。其实很多事情，一旦你开始做，就不难，最怕迟迟不开始。所以，如果你要健身，不用要求自己每天练两小时，试试告诉自己，好吧，我就是个废柴，我就把目标定成每天锻炼五分钟好了，坚持一个月之后再加时间。


    3. 引入惩罚机制。既然目标定的这么低，再完不成说不过去吧？和你的家人好友约定好，每天监督你，如果没有完成，惩罚一定金额的处罚金，并且处罚金逐次翻倍，增大违规成本。


    4. 当然，你可以付费加入一些监督性质的训练营。这个我以后可能会做，你到时可以参考哈哈。


    5. 最后，既然目标定的不高，就必须要求自己每天都完成，不能允许任何借口违规，否则就要受处罚。'
