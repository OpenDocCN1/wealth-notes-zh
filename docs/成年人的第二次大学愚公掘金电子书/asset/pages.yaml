  md: '# 学会耐心积累，善于挖掘自己的优点才能不断接近成功


    提问：


    花爷好！我快奔四的女人了，没特长，没优点，甚至没特别的爱好！一直在工厂上班，以前做了十年物流，在小乡镇做物流工资低，这两年转做项目，工资就高那么一点，但与同事比又没有人家那么多的经验和年轻的本钱。本来看了你以前的文章想开个小培训机构，但没经验没人脉，老公不同意我出来冒险，毕竟还有三个小孩要养！认识一家英语培训的老板，暑假前有帮他发微信招了一些学生！本来就是想着帮这个老板做点事自己同时可以学习一下培训机构的运作，但一轮下来除了帮忙发一下朋友圈做广告之外，也帮不上什么忙，自己也学不到什么东西！所以对于前景很茫然，请花爷赐教？'
  merge: -1
  img_proc: true
- pgno: 821
  md: '# 回答：


    1.不开培训机构是对的，你老公不同意是对的，因为你确实在冒险。我在星球里回答过几个培训机构的问题，也给过一些建议方案，但再好的方案，没有合适的人执行也成不了。


    2.你主动帮培训机构的老板招生，这很棒，但从你的描述里，我至少看出来两个问题：


    a.第一次帮忙做招生的事，感觉没什么收获，这太正常了。我一直在说，别觉得人家成功是一两年的事，那都是积久的积累。你之前没有积累基础，就更好做好要积累几年的准备，不要嫌几年时间长，你现在不积累，一辈子都积累不起来，一辈子的时间更长。


    b.第一次做招生，你觉得没学到什么，这时候正确的做法是什么？是你想一想，如果再给你一次机会，你可以如何更主动一些，如何去认识更多人，如何去接触更多环节。一开始总是在外围浅尝辄止的，没关系，再深入一点，比如和人家吃个饭，没事多聊聊促进关系，让人家多教教你，等等等等，只要你愿意主动出击，还有很多机会可以做。'
  merge: -1
  img_proc: true
- pgno: 822
  md: '整体下来，就是不要停步，多总结，每次都比上一次更积极主动一点，长期下来，量产会带来质变。


    你换个角度想，如果什么事都是随便尝试一下就能成功，那大家都都成功了，你还凭什么脱颖而出呢？


    3. 你说自己没有优点，可能很多人都有这种想法，我觉得大家对优点的定义太苛刻了，一定要学习好、能力强才算优点吗？


    我举个例子，我知道一个大姐，原来是在宾馆当服务员的，你说她有啥优点，她就是会服务人而已。就这一点，后来她做民宿生意，服务贴心、愿意吃亏，口碑和生意都非常好。


    大部分人，能把服务别人做好，就已经有了做生意的基本特质了。别一开始把要求定的太高，也别想着一定要做一门大生意。在这个社会，多用吃亏换资源和人脉，利他的事最终大多都会利己。


