  md: '**发起拼单：** 以团购的价格拍下，并发起拼团，达到商家成团要求，商家才发货；


    **购买软件：** 便宜的几十一个月，贵的一万多，分为几大块：


    +   1. 数据采集&上传。可以采集不同平台数据，并上传到自己的店铺里面；

    2. 快捷拍单。可以在一个平台内管理多家店铺订单，并便捷拍单；

    3. 自动登录。因为店铺较多，手工登录比较慢，这个是必须的功能；

    4. 自动回复。自动回复权重对店群影响大，这一功能非常重要；

    5. 数据统计。数据是根本，不管是平台的统计，还是后期的优化，都要以数据为基础去进行，根据自己的规模，选择适合自己的。


