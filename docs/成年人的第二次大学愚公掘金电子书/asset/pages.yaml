- pgno: 571
  md: '1.现在一聊财务自由，就好像在吹牛逼似的，但我觉得其实还好，至少有一个长久的目标。但也要理解，真正意义上的财务自由，肯定是个长期过程。有人短期内财务自由吗？肯定有，几下踩到点上，就财务自由了。但作为普通人，我们不能把命运赌在运气上，要做好长期积累的准备。


    2.那这个长期究竟是多长呢？以你硕士毕业月薪3w的起点来说，我觉得10年内是比较合理的区间。当然，这里十年只是我大致的估算，而且只是相对自由，年入七位数这种，厉害的
    possible 八位数。可能有人觉得我在吹牛逼，说的赚钱好像跟玩儿似的。还真不是，收入上涨不是线性的，到了某个节点，收入会指数级增长，所以很多人说第一个一百万最难挣。题主按10%年收益，算出自己25年完成目标，这个算法是不合理的。假设你10年完成目标，大部分收入肯定都是后半场赚的。'
  merge: -1
  img_proc: true
- pgno: 572
  md: '我们国家是一座巨大的金字塔，塔底又大又厚，月入五千你就比全国一半人过得好，塔尖又细又长，千万资产走大街上你也不能太嚣张。题主硕士毕业月薪3w，已经比很多人少走不知道多少年的路了，但因为塔尖又细又长，你也还有很长一段路走。下一个切实的目标，我觉得你可以定在第一个一百万上。


    **3.** 之前在一个问题里说过，人生无非两条路，职场or创业，看题主字里行间这个思维模式，应该是创业这一趴的了。创业两个条件，一纵，你掌握一项特别的技能、资源，是你的核心竞争力，一横，想让生意跑起来，你什么都得懂一点。而这两项，其实和工作是不冲突的，因为真正掌握这两个条件，不是靠看书看出来的，是靠生活中积累出的。


    你以后进的公司应该不小，现成的好榜样，多看看生意是怎么做起来的，别局限在程序员的视角里。至于程序员忙没时间自我成长，这个我说句政治不正确的话——有些工作其实是没有意义的，要学会为自己挤时间，这也是一项职业技能。'
