  md: '# 遇到又蠢又固执的同事怎么办？时刻记住，你不是老板，你没有必要改变世界。


    提问：


    花爷好，想问在公司遇到傻x同事怎么办？和同事做一个活动，他水平很差又迷之自信，我和几个同事私下讨论他的方案根本没法看，但他不是我们部门的，只是合作关系拿他又没办法！！


    回答：


    1.很简单，和他一起，找他的领导做决断。你和他各自陈述自己的观点，让领导做决定。'
  merge: -1
  img_proc: true
- pgno: 744
  md: '2.不管是职场，还是人生，别把自己当主人公。这个世界不会按照你的意愿运转，好消息是，不按你的意愿运转其实对你没什么影响。公司是你老板的，部门业绩是领导的，你只要做你该做的，给出建议，剩下的决策和结果，赚了还是亏了，和你有什么关系呢？赚了不分你，亏了也不是你的。


    3.如果领导用了傻x同事的方案，最后失败了。那领导应该明白，你的建议更好，聪明的领导和老板会更重视你。你给的建议不是没有效果，而是需要一段时间培育。


    4.如果领导用了傻x同事的方案，最后失败了，而且领导还接着重用傻x同事。那么，很小的概率，可能公司有什么难言之隐，而更大的概率，你的能力层次比领导和同事要高，恭喜你，跳槽吧，努力去更高的平台发展。


