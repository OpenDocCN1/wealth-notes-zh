- pgno: 496
  md: '那时的你，你希望自己成为一个什么样的人？


    带着这个视角去看，很多问题就明朗了。


    你提到的两家企业，薪水都差不多，钱根本不是问题。


    至于你说的加班、出差等问题，从长远看，也都不重要。


    重要的是什么呢。


    是这两家公司，能在你下一次跳槽时，给你提供什么样的经验、资源、背书等虚拟资产。


    这也是我在《月薪6千、1.5万、3万，应该如何理财投资？》提到的。


    财富增长的逻辑是：


    你必须先用时间换来经验、思维、资源等一众虚拟资产。


    然后才能用虚拟资产+本金，换来更多的金钱。


    在职场工作几年后，还盲目崇拜工资、忽视虚拟资产重要性，是很短视的。'
  merge: -1
  img_proc: true
- pgno: 497
  md: '而K同学提到的传统大公司和创业团队，这两者能给人提供的虚拟资产，恰恰完全不同。


    在传统大企业，走的是标准职场晋升路线。


    两三年后，无论你是留在这家公司继续晋升，还是又一次跳槽。


    你最需要的是什么？工作能力强吗？


    不是。


    你需要一份漂亮的履历、一个更高的职场等级。


    试想，如果两三年后，你离开传统大企业，跳槽去别的公司。


    你大概率会去哪？


    当然是另一家传统大企业，或者去中型公司，当一个管理层。


    到那个时候，如果你挂着经理的头衔，跳槽后基本还是经理。


    大公司都这样，觉得你再差，好歹也干到经理了，应该差不到哪去。'
  merge: -1
  img_proc: true
- pgno: 498
  md: '但如果你还是个普通员工，哪怕你成绩单很好看。


    跳槽后升为经理的概率，小多了吧？


    人家凭什么让一个在原先公司当不了经理的人，来自己公司做经理呢？


    这就是传统大公司的歧视链，它对吗？肯定不对。


    但它不对，你也没办法，这是客观事实。


    在传统大公司体系里混，你就得接受，最重要的是往上爬。


    能力提升多少、有没有学到真本事，是没有保障的。


    创业团队，又是另一条职场路线。


    在创业团队做事，杂，什么事儿你可能都要管一手。


    跟着创业的第一年，往往容易把人培养出一个没有明显特长的全能型选手。


    如果你运气比较好，团队发展顺利，两三年后，你才能成为某个领域的专业人才。


    前提是，两三年后这个创业团队还在不断增长——这个概率其实挺小的。'
  merge: -1
  img_proc: true
- pgno: 499
  md: '但在小团队的好处是，干的活儿往往也比较接地气。


    另外，在创业团队，你可以接触到大量的上下游资源，然后把他们变成自己的人脉资源。


    这种上下游资源，在传统大企业一般都被严格保护的。


    但在创业团队就没有那么严，积累几年后，你独当一面了，自己去创业也不是不可能。


    而创业团队的坏处是，除非公司真的能一路做大（概率非常小）。


    几年后你再想去大公司，会有一些难度，那时候你的留学资历也变得没那么耀眼了。


    所以，一条传统大企业的职场晋升路线，一条创业团队的全能路线，是两条分明的未来。


    这两者有优劣之分吗？我觉得没有。


    最近有种趋势，喜欢说大公司学不到东西，呆两年就废了。


    难道你去创业团队，就一定能学到东西了？坑爹的创业团队多着呢。'
