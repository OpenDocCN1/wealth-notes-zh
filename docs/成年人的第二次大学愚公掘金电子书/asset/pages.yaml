    step3.中英文是存在思维差异，文化背景差异的，有些句子是必须了解文化背景的。


    step4.最后，也可能就是没有天赋不合适而已，那就算了吧，放过它，也放过自己。


    要不像不着急一样留个学啥的，被虐久了自然就听懂了。


    最后，作为一名一线老师，我觉得大趋势下前端的互联网产品更新迭代很快，但是一线的教育工作一定必须是一个慢慢来不能急躁不能浮躁的过程。'
