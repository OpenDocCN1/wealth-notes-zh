  md: '所以说，在这里主要就是给大家讲，你们去找人培训的时候，包括自己做的时候，就是内容不行，你的内容不吸引人，或者说太枯燥，是肯定不会上热门的，你就换位思考就行了，你看了一个东西毫无感觉，你还是会一直看完吗？在你毫无感觉的时候，前五秒就想关的时候，你还会在看到第60秒吗，那是不可能的。


    # 4、如何去做短视频


    讲了这么多之后呢，我开始正式开始讲这个，咱们现在最火的几个热门的一个领域，在就是教大家如何去做。


    +   1、引起共鸣和认同：观念、遭遇、经历


    +   2、引起好奇：为什么、什么东西、何时发生、给你惊喜


    +   3、利益相关：身边息息相关、群体利益、地域利益


    +   4、引起思考：人生哲理、生活感悟


    +   5、引发欲望：食欲、爱欲、追求美好的过程


    +   6、探求未知：新奇的事物、新鲜的景色、人新鲜的一面、新奇的生活


    +   7、满足幻想：爱情幻想、生活憧憬、别人家的男朋友、别人家的老婆、别人家的宠物猫


    +   8、感官刺激：听觉刺激、视觉刺激；


    +   9、获取价值：有用的信息、有价值的知识、有帮助的常识；


    +   10、强烈冲突：角色身份的冲突、常识认知的冲突、剧情反转的冲突、强烈反差造成的'
