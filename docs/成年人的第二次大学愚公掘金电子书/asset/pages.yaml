  md: '# 科创板大涨背后，到底谁是在后的黄雀？


    昨天科创板开市，第一天，大涨。我在朋友圈里说，能不涨吗？你看哪个局开头的时候不是大涨？


    摆几个数字：


    嘉元科技，三板退市前市值26亿，上了科创板市值143亿。


    天淮科技，三板退市前市值18亿，上了科创板市值106亿。


    西部超导，三板退市前市值47亿，上了科创板市值231亿。


    道理不难懂，你做一个抽奖的活动，怎么吸引大家都来玩？'
