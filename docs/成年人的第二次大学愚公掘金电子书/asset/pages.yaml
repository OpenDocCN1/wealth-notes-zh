  md: '学徒制在现实中有没有案例？有，主播届就是典型案例。


    主播里的一些大V中V，发展到一定瓶颈，粉丝很难往上涨，投入产出性价比已经不高了。这时候大V们选择收徒，用自己的名气给有天赋的徒弟导流，徒弟们在师傅的帮扶下做大，也会反向给师傅导流。


    这样一来，用户群就被多个主播一起拓宽了，而且粉丝在几个主播之间兜兜转转，仍然在一个主播矩阵里，这个矩阵的话事人，就是最初的大V老师，可以直接代表矩阵出去谈合作。


    这里有三个重点：


    1.学徒制对老师的能力是有要求的，你不定是全网第一，但你至少是某个区域内的某个行业里，有一定的成绩和影响力，这样才有能力为徒弟带资源，让徒弟打你的旗。


    2.学徒制对徒弟的天分也是有要求的，不像你做英语培训，交钱就能报名。徒弟的筛选中，天赋和发展空间比钱更重要，只有这些才能带给老师带来长期收益。'
  merge: -1
  img_proc: true
- pgno: 474
  md: '3.老师要有自己的护城河，最好让学生去做与自己不同的定位，这样才能避免在有限的用户池里恶性竞争。大家定位不一样，就能吸引不同的用户群，完成互相导流。


    所以你能看到，知识付费里，慢慢开始出现阶梯式定价，低价课筛选的是学员，超高价课筛选的才是学徒。


    举个例子，现在我的会员是365每年，假设我一年收5个学徒，手把手带，那每年至少3万超上，因为学徒能把学费赚回来的机会很大，而且我真心希望学徒能做好然后反哺我。


    因为不是标准化流程，所以规则的制定没有统一标准。如果英语培训想做学徒制，我觉得流程是：


    1.筛选本校学员里，英语学习效果好，而且有讲课的天赋、对运营英语培训感兴趣的人


    2.将其培养成本校的或者助理，让他通过英语培训赚到钱，感受到发展空间'
  merge: -1
  img_proc: true
- pgno: 475
  md: '3.开放正式的学徒报名，付费后手把手带学怎么开英语培训，并且给予优惠的分销加盟资格


    4.扶持学徒在更低一级的县市、或者其他价格定位区间开设分销，通过加盟分成和规模效应，反哺老师


