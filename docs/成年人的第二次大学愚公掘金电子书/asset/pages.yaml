  md: '习、管理、沟通、语言、会计、法律等一系列知识。我明白这些知识的重要性，也很乐意学习他们，但是我未来的工作可能要求我996投入。我不确定自己再完成工作后还能否有精力投入非职业方向的学习以及自己的小企业中。所以我想请花爷帮忙分析下我的情况。


