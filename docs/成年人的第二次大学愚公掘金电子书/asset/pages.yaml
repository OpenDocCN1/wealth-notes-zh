- pgno: 47
  md: '如果说第一波浪潮是卖卡坑钱（现在仍然有很多APP是这样）做一次性买卖，第二波浪潮就是给用户的福利！因为用户在使用APP时候完全免费，只需要拉新用户就可以了。麻花做的或许可以称为一个“合格”的产品了，有着相对较好的用户体验和裂变机制，还有很好的视频资源体系（乐尚的资源都是解析接口的，麻花的视频资源都是自己的
    还有自己的片头 水印等）。


    想知道麻花怎么赚钱，那么打开APP就知道了。里面有各种广告、引流入口，具体赚多少钱，我找不到数据，只知道麻花现在有3000万用户。麻花和乐尚是有本质的区别，乐尚是纯草根团队开发，做大了被抓（先不说商业模式）。麻花是有资本支撑，各大院线告了只是在下架部分影院热播剧（很恐怖）。除了这种APP还有影视类里细分的领域，看美剧
    韩剧的那种，在这里就不介绍了，有些超出范围了。


