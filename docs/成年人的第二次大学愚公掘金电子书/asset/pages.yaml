- pgno: 929
  md: '# 火车” 霸座 “掏出6张票？—-带大家看看管理的学问


    最近有个新闻，一位大姐带孩子坐火车，没买到卧铺，借亲戚身份证，买了6张硬座票。


    一开始孩子不困，就把空座让给站票的人坐了，等到晚上，孩子困了，让站票的人起来，给孩子腾地方躺着睡觉。没想到站票的人反而不愿意了，双方就吵起来了。


    这件事特别有意思，直接可以映射出你看待世界的角度。


    从情理上说，买站票的人肯定说不过去，人家都让你坐了那么久了，孩子要睡觉了让你起来，你还脸皮这么厚，真是翻脸不认人。'
  merge: -1
  img_proc: true
- pgno: 930
  md: '但很多人可能意识不到，从法理上来看，是这位大姐错了，站票的人是对的。


    为什么呢？因为国家规定，车票和购票人必须一致，如果不是本人上车，那相当于这个位置是空的，所有站票的人都可以坐。


    有人不满意了，凭什么啊？我手上有纸质车票啊！虽然本人没到，但买票的都是我亲戚啊！


    那 we 不妨想象一下，如果法律规定，只要有纸质车票、不是本人也可以乘车，结果会怎么样？


    那我是不是可以找一帮人代买，甚至把整辆车的票都买下来？


    如果是春运，对一辆高铁形成了座位垄断，是不是可以直接加价把纸质票转卖给别人？这中间是多大的利润？


    国家一定不会允许这种情况出现的。'
  merge: -1
  img_proc: true
- pgno: 931
  md: '什么？你们是亲戚代买，不是黄牛？那你去开个证明，证明你们是亲戚——如果真的有这种规定，估计又要被老百姓骂死。


    所以，干脆一了百了，买票人和坐车人必须一致，不然相当于无效票。


    你看，这么一分析，你是不是更能理解法律规定，更能体会到管理者的视角了？


    当然，这位大姐虽然不占法理，但实际情况大家都清楚，公务人员也不会为难她。这就是管理者的另一层学问：


    制定严格的规定，真到实际生活中，执行时允许宽松处理。这样一来，总比法律不严，被人钻空子好。


    为什么要在星球里给大家分析这种娱乐新闻？


    因为这种规则的设计、管理的学问，在生意里、商业里、甚至家庭里，都是一门很深的学问。


    你不一定马上学的会，但耳濡目染，总有通透的一天。'
