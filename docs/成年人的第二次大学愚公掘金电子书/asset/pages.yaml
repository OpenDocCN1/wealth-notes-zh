- pgno: 746
  md: '# 以租养贷的“凤变冰”玩法，还能利滚利出十套房子吗？


    提问:


    花爷，你好。我的朋友最近迷上了子安买房笔记。打造持续包租现金流和买卖房产。有线上课程，推荐我去听，我没去，因为实在是一点都不了解呀。能讲讲么？我觉得现在买房投资赚差价的话，成本太高了。其次包租，我不了解，不过你知道深圳有大量的二房东，同时中介也涉入了长租，还有一些大型的长期公寓租赁。我想问的是，这也钱途么？我的朋友信誓旦旦，目标
    2019 年包租 5 要收入，3 面买卖房产 3 套。


    回答:'
  merge: -1
  img_proc: true
- pgno: 747
  md: '我特意去看了一下这个子安买房笔记，其实还是水库几年前“凤变冰”的那一套。


    什么叫凤变冰呢，就是你在合适的地段，买一套老破小的房子，然后把它装修的很有高级感（但装修花不了多少钱，类似极简风），这样你的房租每个月就能多赚一些，房子也更受欢迎。


    先说优点，这个理论正确吗？正确。比如今天你在上海愚园有套房子，装修的很有特色，高价租给金领或者外国人，确实是睡后收入。这点其实和民宿的装修策略类似。


    那缺点是啥呢？就是你装修之后，比同小区的其他房子虽然房租会高一点，但高的很有限。举个例子，你们小区三室一厅普遍租金8000，你装修的好，最多到10000，差不多了，再多租客也接受不了。


    还有种房子，专门租给外国人和金领，确实房租很高。但这种一般在大城市核心地段，而且一旦房客搬走，很可能空置一段时间。你真在大城市租过房子就知道，15000租金朝上的房子，房客是大爷。这种情况建议你们不要幻想发生在自己身上。'
  merge: -1
  img_proc: true
- pgno: 748
  md: '为什么前几年凤变冰的玩法很有用呢？因为前几年，贷款宽松，我贷款买一套，凤变冰之后，房租收益可能刚好能抵当月的大部分还贷，这样我又能去贷款去买一套。以此类推，以房租养房贷，手里房子多了，坐等升值，真正赚钱的是房子，不是房租。


    这个玩法，现在肯定是玩不转了，房贷利率、限购都提升了，你就算凤变冰，最多赚点房租，想一套变十套，是不可能。就算你贷出来十套，现在这个经济情况，很可能锁死现金流崩盘，我前阵子还看几十套凤变冰玩法的房子在出售呢。


    所以，如果你本身有房子，可以学学怎么装修，每个月多赚点房租钱应该没问题。指望发家致富就算了，现在任何告诉你房市100%发家致富的都是大骗子。


    ![](img/5688f8284c7103ed77046cfddaf3da13_748_0.png)


