    # 9.单词分开来都认识，合起来就不认识解决？


    Angela： 建议仅供参考哈~


    这里的合起来具体是指把两个或者三个单词合成一个词，还是把单词放入同一个句子里呢。


    如果是前者，英语里有构词法规则，可以了解一下，熟悉了构词法规则以后，再尝试去理解，就会方便许多


    如果是后者：'
