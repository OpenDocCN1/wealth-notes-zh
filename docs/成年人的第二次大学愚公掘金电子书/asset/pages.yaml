- pgno: 516
  md: '# 没有经验的情况下，如何投简历？


    # 提问：


    之前花友提问，主要聊“没有经验的情况下，如何投简历”。


    “花爷，我想请教您个问题。如何才能顺利转行一家电商公司？我之前一直做的是在线教育付费、新媒体等行业。有3年互联网经验，目前也离职了，耐心考虑完以后想进入电商行业。但是投简历到电商公司几乎没有hr理我，可能是没有经验。所以我目前打算的策略是做一份电商的活动方案给到对方，但不知道这样做行不行，还有一点是如果这个想法可行的话怎么切入会更好呢？望花爷给些指导。'
  merge: -1
  img_proc: true
- pgno: 517
  md: '# 回答：


    这个问题让我想到自己大三的时候，跑出来实习。那时候就想干互联网（因为工资高），但产品、运营都是新鲜岗位，我也没什么经验，怎么办呢？


    # 1.合适的能力


    好在，找工作不光看经验，也要看能力——某种程度上，经验其实是能力的重保障。既然经验没有，那就把能力匹配上。当时我列出了招聘信息上要求的能力，然后绞尽脑汁，找出能表现出我这些能力的精力，一一写到简历里。值得一提的是，因为每个招聘岗位要求的能力其实不太一样，为了加大成功率，我每个岗位投出去的简历也都不一样。


    所以，没经验没关系，一定要有能力；能力不一定要多，一定要合适。你做了三年互联网，做过新媒体，文案能力、用户心理等等，在电商领域，也是用得上的。重要的是你要改变观点，写简历时，不是在堆砌经历、堆砌能力，而是用合适的经历、体现出你有对方需要的能力。'
  merge: -1
  img_proc: true
- pgno: 518
  md: '# 2.经验不够，作品来凑


    其实很多公司招人，不是怕没经验，而是怕你一点都不了解，招了张白纸进去半个月都不能上手工作。虽然简历里写了你有合适的能力和对应的历史经验，你还需要证明你的能力在新领域是能用的上的。所以，我投实习简历的时候，后面还加了一份对该公司运营策略以及竞品的分析，告诉对方我不是个愣头青。


    这一点你已经想到了，挺好的，我再提醒一下，你附上的作品，一定要符合岗位工作要求，同时也要符合招聘公司目前的公司规划，比如你说的做电商活动，如果招聘公司目前线上活动都是以订单成交为主的，你附上一份用户拉新活动，很可能吃力不讨好。还有一个方法，是你以招聘公司的某一个部分为例，提供一个改进建议和方案，也是条路子。


    # 3.跳板公司'
  merge: -1
  img_proc: true
- pgno: 519
  md: '前阵子讲到，普通人暂时进不了大公司，可以先进一个跳板公司——跨界进一个新领域工作也是一样。毕竟没经验，要求先不要放太高，可以进一些小团队磨练一段时间——我大三实习工作其实很一般，影响不大，迅速完成新手村积累，大四实习跳槽了。至于如何挑选小团队，你可以参考上次跳板公司的回答。


