  md: '# # 一线城市新建公寓适合投资么？


    提问：


    花爷你好，最近刷抖音看到一些一线城市新建公寓 首付低 某涛酒店包租 看着挺吸引人 但这类公寓适合投资吗？


    回答：


    不适合。


    普通人买房，是先买房子的“保值”能力，再买“升值”空间，最后才买房子的“出租收益”能力。'
  merge: -1
  img_proc: true
- pgno: 889
  md: '公寓房和住宅虽然都是房子，但就像人和狗的差别那么大，都是哺乳动物，都是碳基生物，但天壤之别。公寓房本身的性质，导致供需关系不匹配，供需关系决定价格，价格上不去就决定了“保值”和“升值”两项最重要的能力没了保障。


    如果不从买房投资的角度看，而是从经营出租的角度看呢？


    所谓经营出租的玩法，就是低价买入，包装宣传，最后出租时卖出溢价，而且这个溢价能力要非常持久，持久到能为公寓房本身的投资价值滑坡兜底。


    那这里很明显，能做出这种长期溢价，对包装宣传能力要求非常高。


    这么重要的宣传包装，普通人是达不到的，完全交给别人去做宣传、自己只出钱？你真的放心、能承受这个风险吗？


    所以，能把公寓房做好的，不是专业机构就是专业主理人，她们都不会问出你的这个问题。但凡来问这个问题的，我都建议：不适合。'
