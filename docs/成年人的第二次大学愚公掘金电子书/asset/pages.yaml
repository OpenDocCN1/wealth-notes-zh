    以上，就是这次分享中想要和大家探讨的部分。


    # 一、社交电商是什么？


    首先，还是来了解一下社交电商的源起背景。


    # 1、传统时代'
  merge: -1
  img_proc: true
- pgno: 238
  md: '传统的营销三板斧为：买央视广告、铺货、促销，这种模式成就了一批传统时代的国民品牌。那个时候全国人民都还在看电视，品牌商砸广告之后，投入和产出能够成正比。


    消费者通过：


    看广告判断哪家商品正规，


    看铺货判断哪家商品火爆，


    看促销判断哪家商品划算。


    消费者的购物状态为：


    被动接收信息，做出购买决策。


    # ## 2、PC时代


    随着互联网时代的兴起，搜索引擎的不断升级，人们的消费习惯和需求也发生了巨大的改变，逐渐从线下商圈过渡到线上PC端，更乐于在线上实现购买行为。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '在早期的流量红利期，C2C模式（个人对个人）的淘宝平台、B2C模式（商对客）的京东&天猫平台应运而生。商家通过在主流平台砸广告（比如淘宝的钻石展位和直通车等）就可以获得大面积的曝光，快速占领用户心智，然后通过价格促销实现成交。


    消费者的购物状态为：


    主动搜索信息，做出购买决策。


    # 3、移动时代


    流量红利褪去，野蛮生长的互联网时代进入下半场。消费越来越便利，销售形式和经营方式越来越多元。一方面是企業获客成本的居高不下，一方面是消费者对品牌的信任成本不断提升。


    有的消费者需要通过多重筛选做出判断，营销路径拉长，购买决策成本上升；有的消费者（下沉市场）根本就不会搜索……在这样的环境之下，一种更为便捷的方式就是——熟人推荐取代品牌广告。


    消费者的购物状态为：'
  merge: -1
  img_proc: true
- pgno: 240
  md: '遵循熟人推荐，做出购买决策。


    # 总结一下：


    | 传统电商 | 社交电商 |

    | :--- | :--- |

    | 依赖搜索引擎，受外部局限多，触达用户几率低 | 依赖熟人推荐，沉淀到自有体系，触达用户几率高 |

    | 以“货”为中心，先有人买货，再有机会和他们建立链接 | 以“人”为中心，先有人链接，然后建立信任，之后再卖货 |

    | 漏斗思维，先找到大规模的流量池，再一步步转化用户 | 发散思维，先找到固定的种子用户，再引导进一步扩散 |


    说完背景，我们进入到第二部分。


    # 二、为什么越来越多的企业开始做社交电商？


    # 1、企业之困


    (1) 流量获取成本越来越高'
  merge: -1
  img_proc: true
- pgno: 241
  md: '有研究显示，互联网平台的获客成本在2012年是71块钱左右，到2018年已经涨到365块钱，获客成本增至5倍。与之对应的是用户增长量的降低：2012年相比2011年的互联网用户增长率是63%，2018年相比2017年已经跌到了15%，2019年还会更低。


    在这种情况下，互联网流量已经进入到存量博弈的阶段。


    # （2）用户留存转化率越来越低


    企业之前通过多方品牌曝光获取的用户，大多积聚在公域流量池，这导致企业无法和用户之间形成良好的互动循环。用户买完一次产品之后，仍将面临大量新的选择。


    如果在用户做出新一轮的购买决策之前，企业的产品信息不能直接触达用户，并给出价格、品质、服务方面异于其他竞对的展示，那么用户下一次的购买决策很可能会做出调整。


    # （3）企业运转成本越来越高'
  merge: -1
  img_proc: true
- pgno: 242
  md: '市场不景气，整个大环境都不是很好。企业用人用地成本高，19年裁员已经是常态。


    # 2、企业之光


    在品牌效应逐渐衰弱，平台流量红利期基本结束的情况下，企业该如何破局呢？


    根据公式：销售额=流量*转化率*客单价，社交电商的运行思路是：


    # （1）搭建自有流量池


    之前的流量都被集中到淘宝、天猫、京东、苏宁等平台，现在企业通过社交电商模式，建立了属于自己的私域流量池，也就是可以反复利用、并且免费直接触达的用户池。


    他们将这批用户沉淀在自己的APP、微信公众号、微信群、微信个人号、头条或者抖音等平台，提升了接触用户的几率，增强了和用户之间的粘性。


    # （2）提升转化率'
  merge: -1
  img_proc: true
- pgno: 243
  md: '在公域流量平台，用户倾向于通过平台搜索比较的方式，确定自己想要购买的东西，企业的信用成本非常高，用户购物时花费的时间成本也比较高。


    但是社交电商通过“熟人推荐”模式，提升了用户对产品的信任度，并帮助用户缩短了购买商品花费的时间，降低决策成本，进而提升转化率。


    # （3）提升客单价


    成立于18年5月的“每日一淘”，就是通过这套模式，从受众广、消费频次高的生鲜水果类产品切入，仅用6个月，获取30万付费用户，估值上涨80倍。


    社交电商的本质是“熟人经济+信任经济”，当用户进入私域流量池之后，拉近了和用户之间的距离，并且通过熟人信用持续提升粘附性，产生更高的复购率，提升单个客户平均消费金额。此后，再根据“自买省钱，分享赚钱”的理念，带来新一轮的拉新转化。


    所以说，社交电商其实是一套可以低成本持续获取精准用户的增长策略，因此会被越来越多的企业所青睐。'
  merge: -1
  img_proc: true
