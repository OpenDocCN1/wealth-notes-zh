- pgno: 606
  md: '# 长投学堂的模式有没有什么不足之处？


    提问：


    花友提问：“花爷，我看了花爷对长投学堂的模式分析，很佩服花爷的分析， 【低成本试学诱饵】+【兼职代理制度】让长投学堂快速扩张


    然后不知道能不能请教下，花爷认为【长投学堂】他们这个运作有什么不足的地方吗？


    我看他卖的理财课程没有贴什么权威的标签（比如讲课的理财师是xx名校相关专业毕业、经过xxx权威认证，有xxx成功案例）只说他是目前国内最大的在线理财课堂，拿了个知名教育品牌的奖。”


    回答：'
  merge: -1
  img_proc: true
- pgno: 607
  md: '# 1.为什么长投的老师没有各种权威认证的背书？


    第一是因为有些老师可能确实没有，第二是因为不重要，在小白训练营里，最重要的是用理财观念冲击用户的固有认知，这也是我在之前的问答里提过的，你的一 套理论能让人信服最重要，至于各种权威背书，有更
    好，没有也不打紧，优先级不高。


    # 2.长投的知识付费天花板：


    长投的模式、它的软文投放，早期肯定占据了红利。但 长期看，肯定有其他平台模仿，软文投多了效果也会不 断下降。


    事实上，行业内的朋友和我说，长投目前仅知识付费而 言，是在亏钱的，千元大课的营收无法覆盖软文投放和 各种营销成本，说明市场竞争很激烈，转化率在不断下 降了。


    知识付费这个行业，天花板不高，适合小团队、个人去 做，长投在可预见的未来，肯定会碰到知识付费的瓶 颈。'
  merge: -1
  img_proc: true
- pgno: 608
  md: '# 3.长投更大的盈利空间在用户投资上:


    很多人觉得我每次说长投，是在损它，其实真不是，我非常看好长投。为什么？因为上面说的问题，比如投放成本上升、转化下降、知识付费上限不高等等，都是可以预见到的，我在注意长投的第一天就想到了。


    关键就在于，现在长投哪怕亏钱，花钱买用户规模，也是值得的。因为它的用户不是普通用户，不是僵尸粉，而是一路被教育、信任长投理念的用户，这些人现在只花上千块买课，但以后很容易就切换到上万元的投资项目上去，每个用户的价值还有十几倍的上涨空间，根本不愁盈利。


    长投有什么问题？我真的觉得大体方向上没什么大问题，整个团队对方向的把控、商业的理解、策略的执行都比较到位，一些小细节的问题，是完全可以忽略的。


