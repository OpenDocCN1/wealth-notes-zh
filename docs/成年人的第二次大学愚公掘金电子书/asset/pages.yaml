- pgno: 65
  md: '好了，我要分享的大概就是这么多。总结一下我这个新人的感受：文化产业是个很大的市场，但对资源和所在城市的要求比较高。但即使没有这些优势，哪怕仅凭个人的努力，只要前期肯学习和投入，并且找对了方向，还是能做出很多成绩来的。


    我的分享就到这里，谢谢大家。接下来回答昨天朋友们在群里提的问题。


    # Q&A:


    1. 付费项目线下和线上都有吗？客单价大概多少？


    夏天：付费项目目前主要集中在线下。客单价视课程/活动不同而不同，按成本和目的的不同来设置，比如有一些活动，我们就是纯引流的，那么就是只要转发朋友圈就能参加，这个属于客单价为零；有一些课程，做了好些年了，客源获取比较稳定，那么就主要以赚钱为目标，就会比较贵，比如3000元/4次；还有一些课程是刚刚发展起来，还需要培育市场，就会介于这两者之间，比如1200元/10次。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '2. 这些付费人群应该生活都比较富裕，相比其他消费者，服务他们有没有特别的地方？


    夏天： 回答这个问题之前，我先来把我们的客户做一个梳理：


    特别富裕的客户有，但绝对数量不是很大，不过他们确实是特别优质以及核心的客户，每年有一大部分产值都来源于这部分并不占比很大的人群。


    占大头的还是公务员、事业单位的一些领导、白领和白领以上的人群，有点儿小钱，吃喝不愁，需要丰富精神生活。比如，有些是孩子上大学了提前成为了空巢老人，要给自己找点儿事情做做；有些是银行啊什么退休了或还没退休的提前为自己规划退休生活的；这些年龄都偏大。还有一些年纪小点儿的，比如不婚一族，好奇心和精力都很旺盛，什么都想学，对什么都感兴趣；再比如年轻的全职妈妈，她需要一个优质的社交圈，需要和跟她志同道合的人一起，在不用围着家庭转的时候做一点自己真正喜欢的事情；还有就是幼儿园园长、医务工作者和银行领导等等，工作压力巨大，忙到想死只要稍一得空也一定要来偷得浮生半日闲。'
  merge: -1
  img_proc: true
- pgno: 67
  md: '分析完客户群体，再来说说相比其他消费者，服务他们有没有特别的地方呢？


    因为我是做新闻出身，以前都是作为“采访者”的角色在工作 的，所以还真没有服务过其他客户，因此这个问题中 的“对比”我没法回答。不过可以说说服务这些客户的一些
    小小心得。


    首先，她们是到你这里来寻求更丰富的精神生活的，所 以你自己得有文化（哪怕不够有，也要表现出有，然后 不停去学习，得以让这个“表现”越来越像真的），跟她们 得要有共同语言，甚至要去引领一些她们的趣味；


    第二，利用一切接触机会（朋友圈、平时见面）打造个 人品牌，让她们喜欢你、相信你，最后慢慢信任你；


    第三，发自内心地欣赏她们、关心她们，和她们成为朋 友，多多少少，深深浅浅，视缘分而定。


    3. 我猜测有钱人圈子的关系推荐机制很关键， 在这方面有没有什么特殊的产品机制？'
  merge: -1
  img_proc: true
- pgno: 68
  md: '夏天：我们有试过“老带新”两者一起打折的方法，但是效果不明显，很可能是这种激励没有戳到人心坎上。目前也没有想到特别好的方法。


    反而是无心插柳的时候往往柳成荫。比如遇到一个大家特别感兴趣的活动，根本不需要任何激励机制，立刻一传十、十传百，报名爆满。所以目前来看还是需要内容够硬核，够吸引人，够有逼格，他们是完全会帮你免费宣传的。


    4. 我感觉对于这些小富婆来说，钱只是一个数字，她们更注重内心的感受和体验。那么在平时没有安排课程和活动的时候，如何去维护客户关系呢？毕竟现在这样的服务也很多，如何做出自己的差异呢？


    夏天：


    第一，我们会有定期会员日，定一个时间，定一个主题，然后请会员们过来坐坐，围绕主题聊聊天；目的是搭建一个平台让大家互相之间多多交流，赋予我们这个院子一个社交属性，也增加会员的粘性；'
  merge: -1
  img_proc: true
- pgno: 69
  md: '第二，我们将一个平时闲置的空间打造成了一个蛮有格调的小书房，邀请付费会员平时有空的时候过来免费看书、喝茶；这也是增加付费会员粘性的一个方法；


    第三，我们开发周边产品的时候，有意识地请这些会员做我们的产品试用员，免费使用产品，撰写使用报告，给她们福利的同时，也增加她们的存在感；


    第四，一些非常核心的会员，我们老板会不定期组织她们举办一些小规模的茶会、美食会、私藏分享会等等，通过这种交流来深化彼此间的连接；


    第五，面向普通会员，我们还有质量非常高的公益活动，并且有意识地在会员群里先通知活动信息，让他们觉得“付一分钱就能获得两份服务”，并且自己是vip有优先得到服务的尊贵感。


    至于“如何做出差异”，那就必须回到产品上，只有产品够好，才能永久吸引住人。其他的客户粘性等等，都是建立在这个基础之上的。而我们在产品上下 的功夫就是尽一切努力去寻找能力范围内能请到的最好的老师。'
