  md: '产品测试期：刚才上面我也提到每个产品我们最多给100刀测试预算，我们会平均分配到2天。看数据， 数据我们主要看CPA（转化成本）和ROAS（Return
    On Ad Spent 广告投入产出比）。CPA根据产品的不同，会有变化。 比如以上面的例子，每卖一件10刀成本，售价30美金。那么利润如果要控制在30%=9美金，那么目标CPA就在11美金（30-10-9。ROAS应该就是2.7
    ）测试期数据能够达到以上的CPA和ROAS，就可以尝试扩量。 也即是加预算。


    扩量又分为横向扩量和纵向扩量。


    横向：增加更多受众测试，增加国家，再赢销等


    纵向：加预算，同样首宗复制多个广告组测试等。


    运营：


    网站的话，初期建议从综合站做起，就是类似亚马逊那种网站。综合站专门用来做产品测试。一旦有推爆的款出来，可以考虑专门做一个小的 niche 站。主要产品带周边小产品的那种。这样就可以专门针对用户去设计网站的视觉。产品交叉销售很重要，连带产品等。这个可以提高ROI的。'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Email客服： 24小时内回复邮件即可。不需要类似淘宝那种在线客服，海外用户都是静默下单的。


    这里 面 还 有个很关键 的 点 就 是 : 网站的打开速度， 我 一般建议平均速度在3秒以内。否则打开率很低的，白白的广告费都浪费了。


    发货： 发货的话，看你的体量。刚开始建议速卖通比较方便点。因为素材都是现成的，而且价格相对来说也便宜。昨天有人问有没有半自动的程序脚本，市面上有很多。他可以帮你自动下单到付款界面。建议单量日50单以下可以用。超过这个单量后，效率就不高了，建议招个人或者外包给货代，让他们发货。每天后天订单CSV导出来即可。
    再大的单量，比如每天45百单的话，我建议自己来吧。'
