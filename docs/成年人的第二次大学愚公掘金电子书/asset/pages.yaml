  md: '# 写完干货文章去哪里分发？不不不，这个问题本身就是错的


    提问：


    想问下花爷，一般写完干货分享的文章都到什么样的渠道去分发比较好呢？感觉有时候自己写完不知道该去哪里发， 该怎么发能实现文章价值最大化呢？


    回答：


    如果你就是想写文章，不报目的性，那你不用考虑分发，写着就完了。'
  merge: -1
