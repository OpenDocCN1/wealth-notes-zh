  md: '# 回答：


    就以你发的新媒体商学院为例，新媒体已经有很久了，不是新东西，商学院在常青藤高校里也有很多年历史了。


    这两个东西都不新，但是一结合，就成了新东西。


    你看，创新其实就是旧的流行元素，用一种新的方式排列组合诞生的产物。


    先看商学院，初期的商学院、MBA是给谁上的？大企业的高管，一边学习，一边结识人脉，不亦乐乎。


    再看新媒体，早期的新媒体非常屌丝，很多现在知名的新媒体，当年穷困潦倒。但现在不一样了，新媒体行业出了无数个年收入百万的年轻人，也出了不少年营收过亿的企业，大家都知道了，哦，新媒体行业也能像传统企业一样赚钱，而且向上攀爬的速度更快。


    所以，两者一结合看，呈现出来的现状就是：'
