- pgno: 548
  md: '# 这个古诗词培训是什么套路，免费送书不亏钱吗？——对，不仅不一定亏钱，做的好还赚了


    # 提问:


    花友提问:'
  merge: -1
  img_proc: true
- pgno: 549
  md: '“您什么时候有时间，请帮忙解读这篇文章赚钱的秘诀（李白《赠汪伦》：“追星”也能导致千古留名？「诗词精读.210天学习」试听）。虽然您上次有分析过这类情况，但是它赠送书籍的价格远远大于它的收费，会亏吗？我正准备做这方面的公众号，锁定人群和她蛮相似。区别就是我是个近30年教龄的中学语文老师，但是没有像她这样有号召力。还有我会有解读，主要是用古代读书方式吟诵来教学，而不是朗读，特别容易记住诗。线下在和书院谈吟诵合作的事，主要准备讲《千字文》《三字经》《声律启蒙》《诗经》和《论语》。是不是面向的对象和她有交错，我是否可以集中在初中，我原定对象是初中小学高年级。还有就是，我的课程设置会不会小众，侧重点是不是还是应该在“中学必背古诗词”？另外您说到的“学徒制”我还是不太理解。”


    # 回答：


    先说下你发的这篇文章的模式：99元押金，完成学习并且按要求每天朋友圈打卡，不仅能够返还押金，而且可以免费送书。如果你没完成，平台可以赚钱，如果你完成了，虽然又返押金又送书，但你为了完成任务每天在朋友圈打卡，可以帮它获取不少新用户。'
  merge: -1
  img_proc: true
- pgno: 550
  md: '也就是说，平台通过你，用一本书的成本，获取更多的新用户了。那平台亏了吗？肯定是亏钱的，毕竟免费送了本书。但你换个角度看，获客本身就是要花钱的，打广告啥的都要用钱，现在用一本书去换取一批新用户，书批发的话价格会低不少，这个获客成本可能比打广告划算多了。


    这个模式，现在很多教育培训行业都在用，背单词、学口语、学古文等等，一本书换一波新用户，新用户打开之后又拉新用户，一直循环下去。


    至于你想要做这方面的课程，我建议你先不要做公众号。你的优势，在于课程质量高，但线上的课程培训，质量高并不是决定性优势。你想啊，大家买的时候，根本不知道课程质量怎么样，看得是什么？宣传、文案、运营方法。这些对于一个30年教龄的老师来说，应该都不是擅长的，甚至可能都没怎么接触过。


    线上课程培训是一门要求各项技能非常全面的生意，你只有课程质量的优势，想直接上手和这些老玩家竞争，难度是很大的。'
  merge: -1
  img_proc: true
- pgno: 551
  md: '所以我建议你，和已有的课程平台去合作，先从授课老师当起，发挥你的优势，宣传运营什么的，就交给课程平台去做。如果你以后想做，那就多观察课程平台是怎么运营的，生意是怎么转起来的，等有一天你不仅知道自己的优势是什么，也知道自己的劣势是什么、需要找谁合作的时候，再考虑自己单干。


