- pgno: 1055
  md: '# 拆解“浇水赚钱”小程序


    今天在群里发了一个叫“浇水赚钱”的小程序，没看过的可以自行在微信里搜索一下。这个小程序大致规则是这样：


    +   1.  连续给你的树浇水一年，解锁1000元奖励（如图一）

    2.  每天浇水需要完成任务，目前主要是点击广告（如图二）

    3.  连续7天浇水奖励1元，邀请1000个好友奖励200元（如图三）'
  merge: -1
  img_proc: true
- pgno: 1056
  md: '其实套路还是很明显的，典型的空手套白狼，画一个1000元的大饼，让你浇水点广告，赚取佣金。到最后，就看广告收益能不能覆盖奖金收益了，如果不能，小程序跑路也没什么成本。


    我之所以把它拎出来讲，是出于另一个考虑——通过这款小程序的规则，你能看到它的设计思路，套用了很多成功案例的规则。


    首选浇水，套用蚂蚁森林，不多说了。


    其次浇水一年奖励1000元，这明显是套用“爱情银行”的规则。爱情银行的规则是，一对情侣一起打卡一年，就可以领1000元奖励——这个规则加抖音传播，让爱情银行飙到了App
    store社交榜首。


    很多人说，我才没这么无聊每天打卡呢，但你看，爱情银行只打情侣群体，就这么火了，我相信浇水领奖金这个玩法，在小城市还是很受用的。'
  merge: -1
  img_proc: true
- pgno: 1057
  md: '借鉴了优点，它还规避了爱情银行的缺点。爱情银行纯靠用户量忽悠投资维持，前不久因为发不出奖金，已经被下架了。而这个浇水小程序，把打卡改成了做任务浇水，极大的控制了风险。


    以后资金cover不住了，每次浇水点击的广告变成三个、四个、五个，点广告变成关注公众号，等等等等，都可以控制风险。


    再说了，因为是无本买卖，奖金要一年后才发放，广告收入可是按月到账的，爱情银行做不下去了只能下架，浇水小程序被封了、运转不下去了，跑路还能带上一笔钱呢。


    这么一分析，你会发现，它好像又有点像趣头条的模式。趣头条就是把新闻广告，返还一部分给用户，以此快速增长。


    这个小程序如果正常发奖金，那其实也是把广告收入分给用户，只不过要延迟一年，攒一个大的。套用这样一个形式，用户乐意接受，小程序开发者还能提前拿到现金流，比趣头条又改良了一点。'
  merge: -1
  img_proc: true
- pgno: 1058
  md: '不知道趣头条的产品看到这个案例，会不会出一个全年看新闻领取1000元奖金的机制？


    之所以说这么多，还是想告诉大家，很多创新不是拍脑袋想出来的，其实是集各家所长、规避各家所短，在这个基础上，能把模式跑通，往往就成功了一半。


    我们邀请各行业的朋友每周分享案例，也是这个道理，你不一定要手把手学他们的操作，只要有某一点能移植用到你的行业里，可能就有些收获了。'
