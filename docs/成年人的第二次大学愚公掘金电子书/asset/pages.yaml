- pgno: 599
  md: '# 手握国产护肤品五折渠道，应该怎么推广变现？


    提问：


    花爷您好，我目前手中有有一些品牌护肤品渠道，如：百雀羚、美肤宝、自然堂、馥佩、丹姿这些国产品牌，基本拿货价都是在五折左右。


    我觉得这个有点市场，想在线上推广销售，可是想来想去也没有明确的方向和思路。


    您可以建议一些思路和方向吗？谢谢花爷！


    回答：'
  merge: -1
  img_proc: true
- pgno: 600
  md: '零售讲究“人场货”，现在你有货了（前提是价格确实很有优势，这几个牌子我不太了解，原谅我是个直男），需要找人、找销售场景。


    如果你自己不擅长做流量池，最好的办法当然是找合适的渠道合作，核心还是我经常说的：去目标用户可能出现的地方，找目标用户。


    对国产品牌、低价感兴趣的人可能是谁？非一线城市宝妈、没钱的大学生、低收入白领和工人。那么问题变成了，去哪找他们？


    非一线城市宝妈：很多人会想到宝妈论坛，但我觉得微信群会更好，去找微信群主合作。


    没钱的大学生：很多人会想到贴吧、微博，但我觉得代理制更好，先去大学城里摆摊销售加微信，过滤出愿意做代理的人，让他们能赚到钱，然后复制这个模式。


    低收入白领和工人：白领有办公楼，工人有厂区和相对固定的住宿点，推广方式和大學生同理。'
  merge: -1
  img_proc: true
- pgno: 601
  md: '总之两个策略，要么，和现成的渠道合作，稳定供货，比如宝妈群、团购群，要么，在线下定点先推销，再发展代理人，比如大学生、白领、工人。


