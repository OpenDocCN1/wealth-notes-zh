- pgno: 687
  md: '记住场景的秘诀：以解决大众需求的场景为主，如果能和大厂、热门话题关联上，效果翻倍。


    # 3. 扩人设


    所谓个人IP，必须要在内容里把你这个真实的人传达给读者。所以一定要多口语化，多写个人经验和真实感受，有自己的风格，有时候即使不更新，也发段文字和读者唠唠嗑。


    同样的，内容不一定都跟编程有关，有时候程序员界有什么新闻，也把自己的想法写下来和大家交流。去当读者的朋友，朋友不只会聊编程。


    个人IP这点，短时间可能看不太出来效果，等到考虑变现的时候，你就能体验到差异了。


