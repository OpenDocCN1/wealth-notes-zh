- pgno: 799
  md: '# 从事线上减脂指导，如何引流和提升路人的关注和信任？


    提问：


    花爷好，我目前从事线上的减脂指导，通过生酮饮食模式，为用户指定个性化食谱与全程监督和答疑，收费在1000+。我们与市面卖生酮产品不同，用户只需按照我们营养师定制的食谱进行备餐、饮食，一个月平均可以减掉10斤，所以效果和安全性均有保证。目前主要在微博和公众号上发相关知识进行引流。想咨询下花爷，如果您手上有这个项目，您会如何操作来引流和提升路人的关注和信任？谢谢


    回答：'
  merge: -1
  img_proc: true
- pgno: 800
  md: '不是如果我手上有这个项目，而是我朋友就做过类似的项目，在早期我给了他一些意见，有些也确实 是有效的。所以比较巧，一些建议同样可以给你。


    照例，不直接告诉方法，说一下思考过程。


    首先对产品要有个正确的定位，不管是生酮、轻断食、还是其他饮食方法，和市面上鱼龙混杂的减肥方法相比，这些都算有一些科学依据的。这类与营养学擦边的产品，目标用户一般文化素养比较好，对应的经济水平也稍好一些。


    总结下来就是，用户小众，消费能力高，所以要提高获客精准度，提高客单价（小众产品一定要尽力做高客单价，用溢价弥补销量）。


    先解决获客精准度，看过我中产的合纵连横之术这篇文章就知道，去你目标用户喜欢去的地方引流。


    减肥的中高端精准人群在哪？医院营养科、医美机构、美容院、高端护肤品……等等相关的地方。'
  merge: -1
  img_proc: true
- pgno: 801
  md: '当时我的朋友有两个资源，一个是认识很多医院的营养科医生，另一个是认识做医美的人，所以他就靠营养科医生、医美代理那里合作，引流到第一波种子用户。


    种子用户把模式跑通之后，他去找了做护肤品代购的微商合作，这一次用户群就彻底-expanded了。


    这些资源你可能没有，但你去做公众号、微博、小红书的思路也是一样的，找有中高端用户的博主合作，不要瞎写瞎投放。


    当然这里面还是有蛮多其他需要注意的地方，比如做这种科学减肥，一定要有成熟稳重的医生形象，本身的理论一定要有说服力，不要自嗨。另外因为不是几十块的便宜货，引流要一步步来，先到微信，文章科普，然后再个人私聊、试用等等，逐步做好信任积累。这些细节很多，核心就是，怎么让用户相信你是个专业的营养医生？


    说完引流，还要顺带给你说一下客单价，虽然你没问。'
  merge: -1
  img_proc: true
- pgno: 802
  md: '你的这种减肥产品，属于刚需低频，复购率是比较差的，如果不能提高客单价、付费转化率和复购率，你引流就没有充分利用，做到后面会很累的。


    两点建议，第一，同样是减肥，做好阶梯定价，有普通版和贵族版，让有钱人可以享受更好的服务。第二，你圈了一群高净值女性，只做减肥很浪费的，后续可以考虑做自己的护肤品、医美产品，可以无缝衔接增加购买率。当然，前提是前面说的，你的营养科医生形象立的够足，用户才会一直买账。


    我那个朋友的自有品牌护肤品营收已经超过减肥产品了，希望给你的长期规划有帮助吧。


