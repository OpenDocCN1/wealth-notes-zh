- pgno: 381
  md: '我想很多人都在关注短视频，也有很多人在尝试做短视频，今天给大家讲解一下短视频


    # ### 分享：


    大家好，我是铭则，今天这个分享我就用这个图片加语音的形式来分享吧，我感觉语音的话，一个是讲的比较快，（另外一个是）还能多讲一点。


    今天的分享讲一下很火的短视频，从18年开始就很火，到今年会更火的一个短视频。简单的讲一下它的一个趋势，还有就是—些现在最火爆的，一些好的视频的做法，大家听完之后呢，肯定是可以直接拿去做的。'
  merge: -1
  img_proc: true
- pgno: 382
  md: '在分享之前呢，先给先做一个简单的自我介绍，我是从 14年开始，那时候还在大学，算是开始搞互联网，从那时候搞刷单，到后来开淘宝店。到15年的时候开始搞微商，因为（当时）在淘宝电商卖那个高仿，那时候开淘宝店卖高仿查的没那么严，被封掉之后就开始转到微信里面，算是开始做微商。因为一直都是在大学里，算是半做半不做，就是一边玩儿一边做，但是我那时候就充分感受到，就是在网上，这个空手套白狼，赚钱是非常容易的，因为我包括做微商，开淘宝店之后，都是做的无货源的模式，都是找别人代发的。


    从16年开始呢，（就是）毕业之后，白天上班，晚上开始就准备搞事情，那时候正好是接触到淘客，就是微信群淘客，那时候是从16年11月份开始的，其实微信淘客是从16年的5月份（或者）6月份开始有了第一个群发的软件，那时候如果说在网上有一定的资源积累，做淘客的都赚到钱了，我那时候因为白天上班，晚上搞这个，也算是一个兼职，所以说收入没那么高。但是在我感觉就是说，这个赚钱太容易了，就是说做淘客赚钱。然后一直到了17年的7月14号开始，腾讯开始大封杀淘客号。（就是）淘客这种微信号，这个时候开始收入就断崖下跌。'
  merge: -1
  img_proc: true
- pgno: 383
  md: '在17年的年底开始接触到这个花生日记算是。现在来看算是转型的很不错的一个方向，因为从目前来看，就是说做花生（日记），也算是带我淘客这一块的收入上算是一个比较稳定的一个方式吧，相比于其他的一个方式。然后那时候呢，18年的三月份开始，那时候这个抖音开始火爆，那时候开始尝试接触这个抖音，但是没有去认真去做。


    真正开始接触，还有尝试做短视频，是从今年的年初开始进军这个短视频（领域）。


    # 1、为什么做短视频


    为什么要做短视频，我觉得这是一个趋势，确实是一个趋势和风口，零几年的时候是一个图文时代，那时候就是做公众号，做这种文章，做网站，做SEO搜索，那时候是最赚钱的。还有后来的这个微博等等这些，算是一个图文的时代。


    到后来为什么我觉得短视频是趋势和爆发呢？主要是我个人认为是两个原因：'
  merge: -1
  img_proc: true
- pgno: 384
  md: '+   1、一个是网络的普及，4G普及之后，让大家上网变得更容易，就是短视频，用手机就可以播放，更加流畅；


    +   2、再一个就是这个手机的普及了，智能手机开始大范围普及，人人都可以买得起手机，人人都可以用手机去下载一些各种丰富的软件，也是这个短视频火爆的一个原因。


    其实互联网这个风口的趋势就是随着网络和硬件的普及而不断的发展的。比如说从网站、论坛、博客到微博、公众号、知乎，再到这个抖音和快手，就是短视频这一块。


    当然，并不是和大家说有什么趋势就一定要去跟风做。只是说在趋势上赚钱会更加容易点，现在（短视频是）最火的东西嘛，流量在哪里，这个钱就在哪里。


    今天给大家讲的短视频。我主要是以现在最火的两个平台开始讲，就是抖音和快手，其他平台就先用不用说了，因为你要做短视频就是这两个平台为主，其他的平台包括火山也好，美拍也好，包括小红书也能发视频，这些都是辅助的。'
  merge: -1
  img_proc: true
