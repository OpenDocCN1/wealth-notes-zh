  md: '我以前在上班的时候，有很长一段时间的薪资和能力只有我三分之一的人是一样的。眼光放长远一点，你的人生不会因为几个月少了2k工资本多大的变动，相反，如果你心态不好，每天上班都觉得在受委屈，那你青春里宝贵的一段时光就浪费了。


