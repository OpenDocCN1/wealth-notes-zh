  md: '# 回答：


    越是没有运营经验，越要集中所有精力去做一件事。


    从你的描述来看，就是想法太多，没拎到重点。


    比如，付费星球40人。


    我之前说过，做生意一定要先想好怎么变现，做离钱近的事情才能赚钱。但这并不意味着，一定要从一开始就赚钱。


    开星球这件事，如果你开的太早，那就好比细水长流，每天赚一点；但如果你积攒到一定程度再开，那就好比开闸泄洪，形成巨大的势能，喷薄而出。


    哪个更好，一眼便知。


    我从去年十二月开始写公众号，每天都有粉丝主动给我发红包、让我开星球，但我一直没开。一直到三月，一次性开闸泄洪，效果更好。'
