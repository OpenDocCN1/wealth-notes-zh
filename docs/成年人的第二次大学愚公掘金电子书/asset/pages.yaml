- pgno: 539
  md: '# 做2B业务，出海如何做好推广？——我建议你参考两个案例做好内容营销


    提问：


    一位做2B服务（面向企业销售服务）的花友的问题。问题是这样：


    “现状：2B 某体育数据（足球 / 电竞数据）SaaS云服务的提供商，国内前三


    目的：希望拓展海外市场'
  merge: -1
  img_proc: true
- pgno: 540
  md: '难度和问题：不了解海外市场，国外如何获取 2B 客户流量？有想过 google 和 facebook 买流量，但是不知道投入产出比是否可行；另外欧美市场和新兴市场（如印度）的取舍有无建议？""


    # 回答：


    我接触的2B行业，传统的都以线下开会+试用为主，拿下企业的决策人，这个企业就拿下了。但在海外，2B推广现在特别依赖于内容营销。


    为什么呢，因为国内企业出海，大部分没什么名气。企业买2B产品，本身就是一个比较重的决策，人家压根就不信你，你大笔的营销费用洒出去，老外最多花几千块买一个小产品用用看。


    而内容营销，不是以品牌的名义去触达用户，而是以人的角度，去向大家推荐：你的公司遇到过这些困扰吗？我也遇到过，这是我总结出来的一些好方法。说两个比较典型的内容营销方法：


    1.网红的社交媒体推荐：'
  merge: -1
  img_proc: true
- pgno: 541
  md: '国外有个叫 Neil Patel的网红，专门写博客讲数字营销的。他的内容特点是什么呢？中立、客观、贴合用户需求，这让他在社交媒体上有几十万的粉丝，博客网站每个月访问量上百万。而他的变现方式，就是推荐SaaS工具，因为他的内容有公信力，确实能帮大家解决问题，所以推荐工具转化非常高。


    所以你问，投google 和 facebook 买流量，投入产出比高不高。我想说，无论你们是投信息流广告，还是找网红帮你们推荐，无论是投视频广告还是软文，做出贴合用户需求的好内容才是关键，千万别用“收礼只收脑白金”的国内洗脑电视广告的形式。


    # 2.垂直论坛推荐


    举个有趣的小例子，国内一款工具“幕布”的创始人，在dota社区里，用幕布总结了游戏的各种信息（具体什么信息不太记得清了），相当于在线展示工具的可用性，结果在一个游戏论坛里，完成了效率工具产品的种子用户积累。之后幕布又从个人工具，切入到企业工具，目前已经被今日头条收购了。'
  merge: -1
  img_proc: true
- pgno: 542
  md: '你在问题里提到的电竞、体育行业，都有很多这样的论坛，除了公司运营人员自己去做推广，也可以付一些大学生推广费用，给他们定好的软文模板，让他们在论坛里做软文推广。我最近听到的一个例子，一个华人团队在美国做华人的留学、找工作全套服务，他们公司在google的几大关键词里，SEO都排很前面。为啥？因为他们雇佣大学生，在各大学的bbs、blog里按照模板发帖，既有推广效果，对SEO也效果奇佳。


    当然，以上两种方法，对内容的要求是很高的，并没有表面上那么容易。出海行业接触不多，就先聊这么多吧，权当抛砖引玉了。


