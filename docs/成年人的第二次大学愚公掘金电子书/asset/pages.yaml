  md: '# 《如何从生活中发现100个商机》系列第三部分：从热点时事里找商机


    今天继续《如何从生活中找到100个小商机》的第三部分，也是倒数第二个部分。


    先回顾下前两个部分：


    +   1.从广告中找商机：https://t.zsxq.com/RBiAuju

    2.从补贴中找商家：https://t.zsxq.com/RBiAuju


    今天第三部分：从热点时事里找商机。


    这个时代，什么最贵？'
  merge: -1
  img_proc: true
- pgno: 919
  md: '流量最贵。


    公众号一个粉丝的价格，从几分涨到了几块钱；App预 装激活的价格，单个用户的成本最高已经冲破百元。


    这个时代，每个老板都有流量饥饿症，不是在搞流量， 就是在焦心怎么搞流量。


    那最大的流量聚集地在哪里？在时事热点里。


    明星结婚，流量大到微博服务器宕机；百度花了上千万 做宣传，没什么效果，李彦宏被当众泼水，立马全民皆 知。


    时事热点带来的流量，好比瀑布倾泻而出，你随手拿取 一瓢饮，也够你喝得水饱了。


