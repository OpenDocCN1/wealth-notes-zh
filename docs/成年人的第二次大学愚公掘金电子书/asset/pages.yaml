- pgno: 774
  md: '可能你自己都没意识到，这点能力是很重要的，说明你的磁场能吸引有想法的人，给未来添加可能性。 至于这个项目能不能做成，或者负责人只给你100块钱是不是在压榨你——不重要了，你刚毕业，有机会可以练手、能尝试把一个项目从0做到1，已经很足够了。


    强调几点：


    +   1.saas生意是典型的销售推动，产品起不到发动机作用，所以对你来说，赚多少钱不重要（你才刚入行），学到的产品技能估计也有限，最重要的是把生意模式摸透，特别是你说的校园市场，看能不能积累些人脉资源，方便以后做别的项目。


    +   2. 对现在的你来说，学习更重要，钱不重要。但不代表着钱一直不重要，创业项目的成功率是很低的，如果过一段时间你发现学不到什么东西，甚至可能影响你正常生活（创业很容易有矛盾的），及时退出。'
