  md: '本人在一个二线小城市，27岁了。喜欢设计但水平不怎么样行，顶多一个月拿五千的薪资。想成长高级设计师也要3-5年的沉淀，二线小城市设计水平高的普遍也就七八千一个月。考虑到结婚买房买车压力很大，也需要钱，如果做销售很辛苦，基本上早九点晚十一点，一月休息三天。一个月稳定七千多，有时候好点能拿一万出头，但是又感觉销售以后没有多大出路，不可能以后结婚了还是这种工作状态。很迷茫，喜欢设计又迫于压力现在做销售，不知道未来该怎么规划。不知道花爷能不能根据我的情况，提提关于职业发展方便的规划。感谢感谢！


    # 回答：


    很不幸，95%以上的年轻人都要和你面对一样的问题：刚毕业就要考虑买车买房，家里实力不够的话，靠自己买房非常难。


    那怎么办呢？做3-5年的规划，争取3-5年后能有能力做选择。


    可是当下怎么办？没办法，只能忍耐，买不起北上广？那就买二线。二线也买不起？那就回老家。'
