  md: 乐尚是在17年末有的18年火起来的，后来做的太大被腾讯告了，有多大呢？据说被抓时候涉及资金1.3亿 大代理全国有一千多名，小代理不计其数。当初看的那篇文章找不到了，分享结束后会发大家一些扩展阅读，里面有另一个版本的文章。在我看来，他们的功能、用户体验不人性化，我当初就是看见这个APP我才想要做2.0版的。乐尚是以代理售卡、在线充值、发卡平台的形式售卖会员，主要是以卖卡（铜板纸刮刮卡
