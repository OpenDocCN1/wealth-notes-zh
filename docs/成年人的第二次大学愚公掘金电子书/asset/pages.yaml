  md: '# 想给爸妈在老家开家小店，选哪个品类比较好


    提问：


    花爷你好，目前想在家乡开一个天猫或者京东便利店给父母经营，希望花爷能给一些建议。


    【家乡经济】家乡是应该算是四五线城市啦，但是娱乐消费水平还是挺高的，喝杯奶茶也是要十几块钱，看个电影也要三四十，市中心有两个休闲广场+购物城，我感觉娱乐氛围还是挺浓的，全市房价平均差不多6千左右吧


    【市场】大街上也有很多便利店，但都是个体户开的，没啥品牌店，有一些连食品运营证都没有，相当于野鸡店。有一条街是有零食批发的，价格比较便宜，而且就在市中心附近，这里的人贪小便宜心理比较强'
  merge: -1
  img_proc: true
- pgno: 740
  md: '【计划】开一个专卖零食的小店，卖良品铺子那些零食，目标客户是学生和二三十岁的年轻人，这应该是先例


    # 回答：


    +   1. 一定要对三种店的区别有充分的理解：

    a. 传统便利店，以卖百货为主，也就是我们认知里的小区夫妻店。

    b. 全家、罗森等新派便利店，以鲜食为主，鲜食也是它们最主要的盈利点。

    c. 来伊份、良品铺子等零食店，就是卖各种小零食。


    +   2. 天猫京东店的改造：


    天猫和京东小店，主要改造的是 a 传统便利店，改造点在哪呢？b、c 两种，都是总部统一掌握供应链的，有利于控制成本质量，店铺负担也小。'
  merge: -1
  img_proc: true
- pgno: 741
  md: '天猫和京东，主要改造的就是统一传统便利店的配货渠道，在此基础上，再提供一些营销方面的政策指导。比如给传统便利店配一部分鲜食的业务，配合线上做节日活动等等。


    # 3.小城市开店的几点具体建议：


    +   a. 以上三种店，只能选一种。我看你的问题描述，感觉好像又是便利店又是零食店，不要幻想你的店里啥都有，啥都有就是啥都不行。


    +   b.如果开便利店，不要选b，小城市暂时还没有新型便利店。开a的传统便利店，可以考虑加盟天猫/京东小店，主要看成本和政策的自由度。加盟这类小店，是以改造升级为主，如果所有货源都要从天猫/京东走，那就需要慎重。'
  merge: -1
  img_proc: true
- pgno: 742
  md: 'c.如果开零食店，那就应该完完全全是个零食店。国内零食店其实已经有非常多成功先例了，不要加盟太小的品牌，但也不要局限于来伊份这种大品牌，仍然有一些二三线城市的零食店品牌，值得充分接触一下。可以看看和你老家类似的城市，有哪些零食店，去和店主聊聊生意怎么样，就我的了解，三四线城市的零食店也是有市场的。


