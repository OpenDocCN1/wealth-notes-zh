  md: '首先一定要用视频素材： 图片素材的带来的流量质量不好。我们的视频基本都是让我们菲律宾的VA帮我们做的，素材来源直接youtube上找到相应产品的视频，剪切下即可。切忌，千万不要一模一样原封不动的拿来用。海外版权意识比较强，所以高压先尽量不要碰，更何况剪切下成本也不高。


