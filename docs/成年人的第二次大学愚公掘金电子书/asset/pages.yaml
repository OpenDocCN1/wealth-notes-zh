- pgno: 901
  md: '+   1.免费赠送甲醛试纸（试纸成本很便宜）

    2.领试纸必须扫码加微信进群

    3.用户会想，为什么要进群，这时候他们会犹豫，所以你加把火，进群有专家本周末为大家答疑家装环境污染的问题，而且会在群里免费抽三个价值2000元的甲醛检测服务和一个价值8000元的甲醛处理服务

    4.进群后，持续运营，特别朋友圈宣传、答疑的过程建立信任

    5.群内答疑活动到达高潮，进行抽奖，抽奖结束后，设置一个托在群里说“没抽到但是想买，有没有折扣”，然后顺势给大家几重折扣，层层优惠刺激购买

    6.还没完，活动结束后，安排抽到奖的用户把体验发到群里，各种夸，并且告知大家上次的几重折扣还有最后几天结束，刺激最后一波转化


    如此，整个流程完成。


    当然，整个过程中，还是有很多细节把控，比如推销引流不能太激进，搞得跟发地产小广告一样肯定不行，比如群内氛围的把控，托儿的设置……等等等等。'
