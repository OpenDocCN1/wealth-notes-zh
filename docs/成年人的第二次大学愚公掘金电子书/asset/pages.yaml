  md: '# # 从6·18巨头的联合会员制度解析，留存比流量各重要


    618的时候，腾讯和京东出了联合会员，98元可以买一年腾讯视频会员+京东会员。这边淘宝系马上跟进，饿了么会员+优酷视频会员一年99元。


    流量越来越贵，特别是对巨头来说，获取新用户越来越难，留存就变得更加重要。


    联合会员的制度就像筑墙，以后巨头们越有越来越多类似的策略。其实早在之前，美团就和腾讯视频合作了出会员了，淘宝很早就有全平台的88会员了。'
  merge: -1
  img_proc: true
- pgno: 960
  md: '巨头的动作是具有风向标性质的，很多人还在想怎么大批次的搞流量，但是个人小团队想做长久生意，流量的精准度、付费转化率、留存和复购率，会比获取新流量更重要。


    换句话说，只要你做好上面的这些，有新的获取流量策略出现，你就直接跟进好了，直接完成闭环，事半功倍。


    可能现在还有花友不愿意听这些话，毕竟搞转化和复购没有搞流量有冲击感，没关系，两年后现实会逼你理解的。'
