- pgno: 1032
  md: '# 百度14年来首次亏损，传统广告颓势一定，“信任货币”的时代来了


    今天最大的新闻，百度第一季度亏损了，14年来首次，紧接着是组织大换血。


    不是我马后炮啊，这事儿前几天就有预料了。


    之前就有分析师说腾讯的收入比预期少了40亿，其中一大块是被广告收入拖了后腿。广告收入低了，但广告的利润反而高了，因为腾讯也知道广告行业不景气，减少了给自己的广告业务做广告的预算。相应的，网易、各电视台、各大品牌的广告收入和支出都少了。'
  merge: -1
  img_proc: true
- pgno: 1033
  md: '广告收入不行，一方面跟经济环境有关，另一方面跟用户迭代有很大关系——35岁以下群体，大多数都是互联网的老用户了，传统的贴片广告对他们没有效果，如果按CPS计算，单个有效广告的成本越来越高，广告主再有钱也是时候反应过来了。


    与之相对的，就是KOL的营销市场越来越火热，而且会持续火热——微博当初股价一路飙升，就是靠这个来的。未来的趋势在哪，不用我再强调了吧......


    顺便说一句，这次百度被主动辞职的大搜体系的大佬向海龙，当初为百度商业化立下汗马功劳，但传闻最近几年风评一直不好，“演讲还在强调手机阅读的便捷性，好像还停留在七八年前。”


    大佬跟不上时代，可以在功劳簿上躺几年，再光荣退休；普通人跟不上趟，十年之后就又是更无力跟上趟的十年。'
