- pgno: 854
  md: '你的星球，我建议改成每月开放一次加入的通道，其余时间都调价到9999（不允许加入），然后每月做一次宣传、新人互动就好，其他时间都用来专注吸收免费粉丝。


    等到了一定规模，再长期开放星球加入通道。


    再比如，免费的500人微信群。


    微信群是需要维护的，维护是需要人力的，除非你有办法同时维护上百个群（比如群控），否则都不建议做免费微信群，耗费时间长、效果差。


    按照你的情况，免费微信群没有个人微信粉丝的经营有效果。不如多花时间，和个人号的免费粉丝做触达和转化。


    最后，你的两个思路：写文章攒粉or用代理涨粉，应该用哪一个？


    不用选，成年人就是“我全都要”。'
