  md: 'b. 推广：考虑两方面，第一是展示产品优势，比如拍宣传小视频，注意一点一定要体现出两点——质量比普通好、价格比市面便宜。第二是初期找到合适的种子用户，毕竟你不可能一家家去推销。你说你是村委会的，那利用关系或者去小区做宣传，找到各个小区人缘最好的大姐，邀请她试吃、让她组织团购可以给低价，让她在朋友里有面子。


