    # Q&A:


    1、怎么知道哪些产品做烂了，哪些还有机会，只能靠投放测试嘛


    鹏举：如果一个产品。你看他在上面投了很长时间了，那你再去做的话，可能就没那么容易盈利。但是最终的数据还是要靠测试来才知道他到底有没有盈利的空间，看是很难看出来的。


