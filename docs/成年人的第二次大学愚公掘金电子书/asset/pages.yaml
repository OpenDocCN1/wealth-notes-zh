- pgno: 750
  md: '# 顶尖互联网公司的研发，想再进一步还有哪些路可以走？(1)


    提问：


    花爷，你好，向你咨询个问题。就是如何判断一个项目的可行性或者说目前可做的空间有多大？比如：跨境 ebay dropshipping 模式或者淘宝客。


    除了搜索、圈子等渠道还有其他指标帮助我们分析防止被割韭菜吗？


    或者说当别人跟你说 ebay dropshipping 可以做，你会怎么 去分析值不值得做？


    回答：'
  merge: -1
  img_proc: true
- pgno: 751
  md: '想防止被割韭菜，先弄清楚什么是割韭菜。


    首先明显的传销骗局就不说了，所有告诉你不劳而获、

    轻易年入百万的都是割韭菜——对，彩票也告诉你可以

    中头奖赚几百上千万哦，所以彩票也是……嘿嘿。


    但还有一种，行业本身不是割韭菜，但不适合你，那本

    质上就和割韭菜区别不大，比如我在上次问答里说的普

    通人去读MBA就没多大用处。


    我们都知道做生意最简单的公司：单位时间内，收益必

    须大于成本。


    这个单位时间很重要，可以是一个月、一年，也可以是

    十年。对大公司来说，单位时间可以很长，十年不盈

    利，盈利吃十年。但个人承受能力有限，必须要在短时

    间内，达到收益大于成本。


    **划第一个重点，衡量是否值得做，先明确自己期望在多

    长时间内获得多少盈利。**'
  merge: -1
  img_proc: true
- pgno: 752
  md: '比如你问淘宝客有没有空间去做，这个问题本身没多大意义，做淘客的有人月入百万千万，有人月入几百几千，你说有没有空间？答不上来。


    所以，你需要先明确，我想在x年内，做个年收入xxx的淘客，这个问题才有意义。


    明确了收益之后，再来明确成本。


    # 划第二个重点，做到这个目标，需要哪些重要的能力？


    不同的年收入目标，需要不同的能力。还是做淘客为例，假设你是做微信群淘客，你想月入一千，那很简单，只要有维护微信用户带货的能力；你想月入一万，那要么有比较强的引流能力、要么开始有小代理做工作室；你想月入十万，那大概率必须有带代理团队的管理能力了。


    你拥有这些核心能力的代价，就是主要成本。'
  merge: -1
  img_proc: true
- pgno: 753
  md: '很显然，想要收益大于成本，重点在于控制成本，即核心能力和你本身的资源越匹配越好。比如核心能力是代理团队的招募和管理，那你最好有类似经验、或者能找到类似经验的人加入，不然一穷二白，试错成本就太大。


    总结一下：


    +   1.明确想在多长时间内完成多少目标

    2.完成这个目标，需要哪些核心能力

    3.这些核心能力，自己有多少可以匹配上


    （最后插一句个人经验，一般核心能力和自己有一半以上能匹配，就值得尝试）


