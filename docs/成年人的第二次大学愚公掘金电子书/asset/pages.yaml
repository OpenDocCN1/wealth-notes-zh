- pgno: 552
  md: '# # 提问花爷个人发展类问题


    提问：


    这两天看到花爷在多处讲到财富增长的本质是用时间换经验、资源等虚拟资产+本金=更多的财富。我是一名公务员，从事审计工作，微薄的薪水（4k/月）和超级缓慢的成长性以及几乎不由个人能力决定的职位晋升，和4线边陲小镇的生活让我感受不到一丝生机，想要挣扎跳出此圈，却又像笼子里待久的鸟不敢也不知道飞去哪里。太过激进的辞职我没勇气，太过保守的慢慢探索我真的等的起吗（离30岁也没几年了）想过再去考个研转换一下身份？还是兼职尝试一下其他工作，锻炼一下自己的技能比较好？最尴尬的还是自己不知道喜欢什么？（不喜欢看账本）热爱什么？努力的目标都不知道！求大神站在更高的角度予以指导，拨云见雾'
  merge: -1
  img_proc: true
- pgno: 553
  md: '# 回答：


    # **1. 不要辞职不要辞职不要辞职！！！''


    说三遍加三个感叹号，给所有花友都提个醒，如果家里没矿，不要辞职创业。最稳妥最实际的方案就是一边上班一边找方向。


    有人说这样会很累吧？相信我，你全职创业更累，创业没结果累加上焦虑更让你崩溃。特别是题主公务员一般比较闲，更不能辞职。


    # **2. 不要用考证来感动自己**


    很多人觉得生活没个奔头，怎么办，要不考个研究生吧？要不考个会计吧？要不考个建造师吧？


    但你想清楚了吗，考证也是一条升级打怪的晋升路，越好考的证作用越小，到最后，你又会走上考一个更厉害的证的循环之路。'
  merge: -1
  img_proc: true
- pgno: 554
  md: '当然，如果你真的想清楚了，比如你就想做最顶尖的审计，那你去考个证也无妨。最怕的是你根本没想好，你就是想做点事，弥补自己无力进取的罪恶感，你根本不知道考完证之后的规划是什么。


    你想一想，你现在从事的工作“公务员”，不正是无数人梦寐以求去考试的职业吗？它让你满足了吗？没有吧，那你怎么确定考了研究生换个身份之后会更好呢？


    不要用我至少努力了这种话来麻痹自己，感动自己，拖累未来，没什么意思的。


    # 3. 没有爱好很正常，95%的人都没有爱好


    很多人会劝你，找到自己喜欢的事情，然后努力去做。这句话的问题在哪呢，当我们成年之后，我们的爱好越无法给我们带来收益，我们就越没有时间去做爱好的事，典型的恶性循环。


    你去大街上问问，我们这代人的爱好大多是什么，无非是唱歌、看电影、踢踢球之类的。而又有多少人能每天去做自己爱好的事呢？没有吧，每周能抽一天时间给爱好的人都很少。'
  merge: -1
  img_proc: true
- pgno: 555
  md: '所以，用爱好去赚钱本身概率就很小，不用强求，不用执着于给自己加一个爱好。大多数人，包括我，都是先赚了钱，才有钱有闲去做爱好的事。我难道爱好写文章吗？不是，我只是擅长而已，我的爱好是赚够钱安安稳稳去世界各地睡大觉。


    # **4.没有爱好就算了，没有擅长怎么办？**


    问题是，很多人不仅没有爱好，甚至没有擅长，怎么办？


    越是这样的人，越容易着急，但我建议你，更不能着急。因为从你的描述来看，你目前还缺乏基础的预判能力，盲目行动很可能南辕北辙。想象一下，现在的你好像被布蒙住了眼睛，周围很多人都在指导你，有人说，嘿，往左走！有人说，肯定是往右走，我走过，肯定成！这时候你怎么办，往左走还是往右走？


    不，你一步都不能走，你要先把蒙眼睛的布摘掉。


    所以我建议你，做一下小练习，这个练习我给好几个朋友做过，非常有效：'
  merge: -1
  img_proc: true
- pgno: 556
  md: '接下来的1-2个月，你每天要求自己，挑一个身边的小生意，这门生意可以是小区门口的便利店、可以是朋友圈里的微商、可以是一家常去的餐馆，都可以。


    然后，用尽你所有的努力，查清楚，每一门生意的上下游是什么，它们是怎么运转的，利益在整个链条中是怎么分配的，如果让你来做，会遇到什么问题，怎么解决。


    这是一场脑海中的生意沙盘模拟，你在过程中遇到什么问题，可以再来问我。我相信1-2个月后，你会对赚钱这件事有不同的理解，你会发现一些以前注意不到的、适合自己的小机会，到时候，你还是可以带着你的计划来问我的意见（已经有不少花友这么做了）。


    这个练习的开端，可能会有些痛苦，但要想走的远，人总不能一辈子蒙着眼睛走路，对吧？


