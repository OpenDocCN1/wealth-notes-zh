- pgno: 502
  md: '# 为了进大公司，如何选择跳板公司？


    提问：


    之前花友的提问，主要聊“为了进大公司，如何选择跳板公司”。


    “花爷，我目前面临选择offer，我自己半年小公司用户运营（社群拉新维护转化）经验，面试了一段时间，努力进大公司（新世相，小红唇，水滴筹等等）。我有一颗进大公司的纠结，觉得大公司有学习的对象进步快，小公司都要自己摸索，我自己学习能力和悟性一般。


    最终感受自己竞争力一般。。。目前想一周内确定offer，放低了对公司要求。'
  merge: -1
  img_proc: true
- pgno: 503
  md: '+   1.面试了简单心理的用户运营拿到offer，试岗了一天，决定不过去了，因为是同时负责7-8个群的日常管理和老师的配合工作，无绩效考核，并不能给我下一份工作带来更多帮助。


    +   2.一家抖音培训的初创公司，培训老师也是老板并没有社群转化人员，我可以过去，做拉新维护转化一系列动作，可发挥。


    +   3.继续寻找社群运营的工作，能够具体负责社群的转化，有绩效考核。我觉得也不是特别难找，但目前还没确定，想一周内尽快搞定。


    我对2蠢蠢欲动，但不清楚这是否是自己目前比较好的选择，希望花爷能给我一些指点。”


    # 回答：


    现在越来越多人想进大公司，但事实是，很多人起点不够高，第一份工作在小公司往往没有学到足以跳槽到大公司的本领，这时候跳槽，就会很尴尬，大公司进不去，再去小公司又很难选。'
  merge: -1
  img_proc: true
- pgno: 504
  md: '我往往把你进入大公司之前的一家公司，称为跳板公司，也就是你面临选择的公司。那么以未来进入大公司为目标，结合你做社群运营的背景，跳板公司的优先级依次可以分为：


    # 1.中型公司的社群运营岗


    如果有能力，最好的选择是去有一些知名度、但还不能称为大公司的企业的对应岗位。可能你对中型企业不太理解，其实很简单，什么样的公司门槛不会特别高、但是一提起它还有一些知名度呢？在某些特定领域、方向上可以排的上号的企业。


    比如你做社群运营，BATD这种大公司的社群运营岗本来就不多，门槛也高，你可以先进英语流利说、沪江等英语教育类的公司做跳板（英语教育的社群运营转化是很厉害的），如果沪江之类的还是进不了，可以试试宝宝玩英语之类的社群运营新兴公司。


    # 2.小团队的运营岗位'
  merge: -1
  img_proc: true
- pgno: 505
  md: '如果是有前景的小团队、创业团队，也是一个不错的选择。你会注意到，这里我说的是小团队的运营岗，而不是你原先的社群运营岗，是因为从长远看，社群运营并不是一个非常吃香的细分职业，你越往后发展，越会发现，做运营的可以下沉去做社群运营，但做社群运营的，很难插手其他运营领域，这是一个降维打击的问题。


    如果你的跳板公司是1中的中型公司，那你很难跨界到其他的运营岗，毕竟中大型公司很看重历史背景和职位对口。但你如果选择去小团队，就有机会可以尝试更多的运营岗位。


    挑选小团队，我就很难从公司层面更多建议了，毕竟很多小团队我都没听说过，唯一的办法就是尽量多面试，一定要多个小团队里挑一个最合适的。我给你分享几个判断小团队是否靠谱的标准：


    +   a. 商业模式是否能够跑通，是不是以盈利为目的去经营的（现在还想烧钱跑规模的小团队95%是个死）


    +   b. 体验他们的产品，特别是商业模式里最重要的环节，如果做的不好，直接pass'
  merge: -1
  img_proc: true
- pgno: 506
  md: 'c. 如果产品做的还可以，挑几个你觉得可以改进的地方，面试时，问问boss或者你的直属领导对这些点是否有改进计划，看他们逻辑是否清晰，判断能力靠不靠谱


    d. 面试时间问团队各部分是如何协作的，一个运营方案从构思到落地，需要经过哪些配合、多长时间。一个好的小团队应该能用最简单的方法协调各部门把方案落实。


    # 3.传统企业的社群运营岗位


    一些传统大企业，经常会为了追时髦、改革，搞一些新兴部门和岗位，你所做的社群运营就是其中一个。这种岗位进去八成是浪费时间，不多说了，反正别去。


