  md: '# 十八线城市修理铺，如何用最简单的方法引流？


    # 提问：


    花友微信提问，比较具体的案例，匿名发出来，问题：'
  merge: -1
  img_proc: true
- pgno: 756
  md: '“花爷，你好。我的老爹在十八线小城市做修理工的工

    作，就是家电维修师傅。然后和他竞争的也有一些，我

    的老爹也做了维修十几年。但是之前他是和别人一起合

    伙开的店铺，后面他的合伙人改行做早餐去了，然后他

    就只能把自己的店铺搬到家里去修。那个店铺已经存在

    十几年了，得有老客有时候把坏的家电搬去原来那个店

    铺一看卖早餐的就又走了。老爹说生意很受影。他说

    已经在老店铺那边放了个广告牌，但是也没什么用似

    得。我想请教一下花爷你有没有比较好的主意可以又把

    顾客引流回来？另外就是有个重要的原因是我爸是上门

    服务的，有时候家里还没人，没办法看店。家里的位置

    还是有点偏的。他不考虑重新开个店铺，因为成本可能

    会高。


    另外一开始叫我叫我老妈在她的朋友圈里发那些搬维修店

    的信息，但是我相信人类都是利益驱动型的，我是在想

    如果是朋友圈转发，也要找到类似病毒性的传播这样才

    有用。主要还是找不到切入点”


    # 回答：'
  merge: -1
  img_proc: true
- pgno: 757
  md: '**1.你想象下你家电器坏了，吭哧吭哧搬到店里去，发现店没了，这时候让你再搬到另一个地方，而且还不一定能修，这时候这笔生意最大的阻碍是什么？**


    +   **a.信任成本，不知道能不能修好，不知道还是不是原来的师傅**

    **b.体力成本，搬来搬去太累了**


    **2.针对信任成本，一定要让客户知道，师傅还是原来那个师傅，只不过现在主要做上门维修生意了。单纯的放广告牌效果可能不好，你可以做一点点宣传单，重点是和早点铺主人说好（送送礼），如果有人上门维修，让他帮忙解释介绍一下，小城市里口头指引人很重要。**


    **3.针对体力成本，客户辛苦搬来，这时候可能不愿意多动弹了。让早点铺主人和传单里重点宣传，可以上门服务，您可以马上打个电话确认一下这个电器好不好修。这个电话非常重要，只要他当场打个这个电话，正常生意就不会跑掉。**'
  merge: -1
  img_proc: true
- pgno: 758
  md: '4.不知道你们上门服务要不要加钱，如果要，可能有的客户不愿意出太多钱，这时候可以跟客户说，您想自己送店里也可以，自送自取可以给您打个九折。当然，如果店里没人，麻烦隔壁店家帮忙收一下也行，想想办法。


    5.最后，修电器是低频服务，特别是小城市，朋友引荐比较多。可以让你爸挑一天去周边的小区，做免费的电器维修宣传，老头老太太很爱吃这一套。当然，不是真免费，免费的条件是要加微信。这样一来，你免费修一天，成本其实不高，但可以加到足够多的精准用户。


    6. 加到微信之后，可以经常在朋友圈更新修电器的内容。可能你觉得修个电器有什么好宣传的，多着呢，比如你主动给小区八九十岁的独居老人免费修电器，比如客户准备扔了重买被你爸修好了省了几百块钱，等等。


    不能光手艺好，要让别人知道你手艺好。不能光让别人知道你手艺好，还要让别人你是个值得信赖的好人。'
  merge: -1
  img_proc: true
- pgno: 759
  md: '方法其实很多，但对你爸这个群体，我一般给简单的策略。复杂策略虽然收益高，但要求也高，普通人实现不了的。


