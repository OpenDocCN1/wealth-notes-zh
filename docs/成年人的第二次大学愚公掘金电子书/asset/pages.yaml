  md: '# 花爷说说瑞幸的死穴到底在哪


    群里有花友点播，让花爷讲讲最近上市的“瑞幸咖啡”，那就来讲讲。


    # 1.瑞幸的资本游戏


    瑞幸的操盘团队，是神州系的原班人马，从第一天开始，这个局就更像资本游戏，投资贷款加转借，一路火花带闪电。


    如果你还不清楚这点，看看这篇： 拆解瑞幸咖啡资本局


    # 2.瑞幸的商业死穴


    作为一个聪明人，你必须清楚：资本和商业是可以独立讨论的。'
  merge: -1
  img_proc: true
- pgno: 1017
  md: '你不能因为瑞幸的资本运作，就直接否定其商业价值。从商业的角度看，瑞幸财报中的众多数据里，真正的死穴其实只有一个：


    单价。


    根据财报，大致算出瑞幸的单价是9.1元/杯。一切都从这9.1元开始。


    # **3.降不了的成本**


    卖9.1元的咖啡能不能盈利？可以。


    全家等便利店、自动咖啡机，卖的咖啡都不贵，仍然有盈利空间——前提是它们的门店、宣传、获客成本足够低。


    而星巴克，因为品牌足够大，它的门店租金非常低，也压缩了成本。


    反观瑞幸，是一家没有星巴克的品牌效应，却为了讲对标星巴克的故事，品牌、营销、原料的成本居高不下的公司。'
  merge: -1
  img_proc: true
- pgno: 1018
  md: '进退两难。


    # # 4.上不去的单价


    成本不好降，提价呗？


    很多砖家说，星巴克卖30，瑞幸只要提价到20，就有充足的盈利空间。


    说这话的人不是蠢就是坏。


    我们先来看看历史对标案例，滴滴为什么在补贴战之后，可以成功提价？


    因为在打车这个场景上，除了打车之外，没有更多选择。大部分的打车场景，是本来就要打车的，不能被地铁、公交替代。


    所以，当滴滴比出租车便宜一点的时候，它就能吃掉一部分打车场景，甚至当打车单价只比地铁公交贵一点的时候，滴滴还能吃掉一部分公共交通的场景。


    而瑞幸完全是相反的模式：'
  merge: -1
  img_proc: true
- pgno: 1019
  md: '当瑞幸把客单价提升到20元的时候，它就不是在和星巴克竞争，而是和所有茶饮行业竞争，对手反而增加了。


    一杯20元的、并不廉价的廉价咖啡，和加10元就能获得逼格的星巴克、更便宜的一点点/coco、更流行的喜茶等等相比，竞争力在哪？


    很多人说瑞幸的问题，是没有复购，其实复购不是问题，但你让它涨个价试试？


    # 5.整个咖啡行业的问题


    事实上，整个咖啡行业都在受到新茶饮行业的冲击，你以为星巴克业绩下滑只因为瑞幸？可能只有瑞幸喜欢这么讲。


    当花爷看到开在星巴克对面的喜茶，不由想到了一个没落的品牌——哈根达斯。


    十几年前，一个五十块的哈根达斯冰淇淋球，还是多少北上广打工仔的梦想。现在呢？哈根达斯不停在关店。'
  merge: -1
  img_proc: true
- pgno: 1020
  md: '哈根达斯是因为新的冰淇淋品牌崛起而衰落的吗？不是的，而是下午茶这个场景，被其他品类瓜分掉了。


    所以，现在当你再看瑞幸对标星巴克的故事，你会发现：


    这是一个找错了对手、强行碰瓷、讲性价比故事结果在夹缝里进退两难的商业模式。


    当它们砍掉一些不必要的、迎合资本的宣传，可能还有盈利的空间。但无论如何，现在的局面只导向一个结果：瑞幸不值得这个市值。


