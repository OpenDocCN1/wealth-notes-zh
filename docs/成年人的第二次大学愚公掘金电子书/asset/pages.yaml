- pgno: 710
  md: '企业接入滴滴这个需求面其实挺窄的，小公司用不上，大公司一般直接和滴滴对接了，剩下不大不小的公司，你得说服他把传统出行报销的OA流程换到滴滴上，也不是件容易事。


    走正向思维的话，一般去企业老板、HR的圈子去试试推广。这块的人脉链接我讲过很多次了（https://t.zsxq.com/nMRfyRn），不过你技术出身，这方面资源不多，我就不多说了。


    走逆向思维的话，可以尝试“截流”的路子。举个例子，阿里云的代理商给用户的价格比官方低，代理商会做搜索优化，当用户搜索云服务时，看到代理商的网站，自然就买了。另外，代理商有时会拿到已经买过阿里云的用户电话，打电话告知快到期如果准备续费，可以加微信联系他们拿到更低的价格。'
