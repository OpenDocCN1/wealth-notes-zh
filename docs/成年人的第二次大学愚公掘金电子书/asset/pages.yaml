- pgno: 55
  md: '# 故事一：一个小院子从版本1到版本4的进阶


    我所工作的这个地方，是一个文保建筑群，我们公司租下了其中的一个院子。院子一开始只是几个有庭院情节的有钱人合租着，平时就用来喝喝茶，做做私宴，吃吃火锅什么的，生活美滋滋，就这样自娱自乐搞了一年多，这段时间可以看作这个院子的1.0时代。


    你可能会觉得很搞笑，我为什么要在这里讲这些，但其实，包括我所在的城市，包括全国很多其他城市，在经济下行压力增大的当下，有很多老板的钱不知道往哪里去，他们的选择并不多，其中一个就是搞一个这样中式的或大或小的院子在手里。然后院子的拥有者，他们自己也不知道应该用这些院子来干嘛，通常就只是满足了自己和亲友的日常娱乐。如果你有运营的想法和资源，给这些院子提供内容、赋予灵魂，会是一个很好的商机。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '好了我继续说。后来其他几个合伙人退出，我们老板自己开始搞院子。有了漂亮的小院子、有了精致的家具布置，这个地方看起来越来越美了，于是一些老板的朋友就开始在这样一个空间里做一些公益活动。活动都是和传统文化相关的，有时候是其他人来组织，有时候是老板自己组织，对参加者都不收钱。老板免费提供场地和茶水，收获人气、积累人脉，有时候还要请一些老师，包括做活动的物料成本等等，一年要贴四五万。这可以看作这个院子的2.0时代。


    这时期也不是完全没有营收，因为一些传统文化课程的开设，还是有点钱赚的，比如花道课和茶课，收入差不多刚好覆盖房租成本。而老板做这一切的初衷是，他认为只有家具布置的院子始终没有灵魂，只有在这个空间里做符合它气质的事情，比如带领大家去享受各种“中式传统文化生活”的片段，才能赋予这个空间以灵魂。当大家认可了这种生活方式，高附加值的周边产品销售就是顺带手的事情。'
  merge: -1
  img_proc: true
- pgno: 57
  md: '又过了一两年，也就是去年，老板觉得可以把活动再做

    大一点了，机缘巧合之下，我加入了。加入后，我负责

    策划付费会员活动，活动形式有点类似于成人游学：想

    一个主题，找一位老师，去一个地方，做一到两件事

    情。这可以看作是院子的3.0版本。也是去年，我们给了

    自己一个明确定位：成为中式文化生活方式（硬件+软

    件）的传播者。


    3.0版本和2.0最大的不同，在于活动开始收费了。虽然

    费用不高，刚刚覆盖掉全年的硬成本，但始终这是很大

    的一步，因为在这个过程中我们筛选掉了一大批不愿意

