- pgno: 847
  md: '# 如何合理分配时间，解决拖延问题？


    # 提问：


    花爷，这是我很长时间都遇到的苦恼，那就是关于时间分配。


    对每一天的分配会感到迷茫，感觉什么都没有做，但是一天就过去了，您是怎么分配时间的呢？如何解决有必要做的某事，但却一直拖延的问题呢？


    # 回答：


    作为一个重度被催稿人士，很喜欢回答这个问题，哈哈哈哈。


    时间管理这个概念，本质上是错的，时间不断在流逝，谁能管理时间呢？'
  merge: -1
  img_proc: true
- pgno: 848
  md: '我们能做的，只有管理自己，而已。


    想管理自己、改变旧的习惯，显然是很难的，所以抓住三个要点：


    1. 承认自己是个废柴，一天只做好一件事。


    既然管理自己这么难，那不如从最简单的开始。


    别给自己设太多任务，每天只做好一件事，坚持365天，绝对比你一天做十件事然后歇一个月要好得多。


    2. 庖丁解牛，任务拆解到半小时。


    有人说了，一件事可以很大，也可以很小，比如写文章，一天写不完，写着写着状态就飞了，咋整？


    划重点，把任务拆分、拆分，拆分成若干个半小时的工作量，然后把时间表列出来。


    比如写文章，拆分成找资源、列提纲、写第一段、写第二段……等等，可以很多。'
  merge: -1
  img_proc: true
- pgno: 849
  md: '这样做两个好处：


    第一，不会在某件事上卡壳耽误太多时间，比如写提纲计划用2个30分钟，那OK，2个30分钟内一定要完成，觉得自己没写好？不管，不改了，接着做下一步的任务，有什么问题，写下一篇文章的时候再总结。


    第二，任务划分到30分钟的维度，可以每30分钟审视一次自己，哪怕贪玩了、偷懒了，最多只浪费了30分钟，下一个30分钟打起精神就好。


    # 3.引入监督伴侣，对自己狠一点


    如果你做到了以上两点，你会发现，坚持两周之后，会感到有些孤独。


    那种感觉，怎么说呢，这个世界上大多数人的工作效率，都是没有开满的，而你却能开满，你真是太牛B了，同时你也会觉得自己有点格格不入了。


    人毕竟是情感动物，交流很重要。


    所以，引入一个监督伴侣，所谓男女搭配，干活不累。'
  merge: -1
  img_proc: true
- pgno: 850
  md: '把你每天的计划、完成情况都发给ta，让ta监督你，同时也让这个世界上，有这么一个人，知道你在默默努力。


    当然，当你的监督伴侣也是很耗精力的，所以可以引入一个监督惩罚机制，比如任务没有完成，罚款xx元给监督伴侣，让ta获得一些回报。


    具体罚款金额，最好是一个能让你肉疼得数字。


    我让女票监督我的时候，最开始罚款金额是几百，发现不痛不痒，没效果，后来直接改成几千……然后……我女票第一个月就靠这个发家了……


    当然，也只是第一个月，之后我再也没给她罚款的机会，回过头来看，我觉得这个钱，罚的值。


