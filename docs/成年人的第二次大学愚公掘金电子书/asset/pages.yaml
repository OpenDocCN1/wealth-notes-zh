  md: '# 偶然发现一个公号，原创只有26篇，是如何做到篇篇头条10W+？


    今天朋友圈看到一篇文章，阅读量10万+，出于习惯顺手看了下这个号，更新了好几年、每篇头条都是10万+，但是只有26篇原创文章！（见图一）


    明显的矛盾点，于是查了一下这个叫HUGO的号，果然大部分文章都是转载，但是文末的转载声明非常不明显（见图二）。


    可以推断出这个号的内容生产过程：


