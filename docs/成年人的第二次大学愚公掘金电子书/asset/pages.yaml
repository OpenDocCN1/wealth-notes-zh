  md: '其实关于这个模块，我在分享中也有比较详细的说明，如果大家需要进一步做法交流的话，可以加我的微信huangxiaoyu677


    +   4.我有一个疑问，社交电商的话，很多个人他的专业能力是有限的，如果有一个在线的Costco，较少的sku，可以让用户闭着眼睛买东西，那么这个社交电商还有多大的想象力呢


    黄小鱼：这想象力很小啊，因为电商的本质一定是多sku地矩阵去铺这个事情。较小sku就意味着用户在这个电商平台的商业行为较少，那其实到最后就是GMV较少。


    其实，大礼包的销售额和用户在电商平台上不同SKU之间的销售额是一个很重要的比值，也是衡量这个电商项目是不是健康的一个重要标准。


    电商项目最终一定拼的是你的GMV，那SKU越多GMV一定越多。社交电商是电商的一种增长策略，他最后竞争的逻辑依然逃不开电商的底层逻辑。'
