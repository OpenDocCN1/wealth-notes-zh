  md: '# 如何培养自己的演讲发言能力？


    提问：


    花爷好，工作中一直觉得presentation是个短板，有没有什么方法可以提高这一技能


    presentation这个词，有演讲的意思，也有一些非正式发言的意思。


    回答：


    我就当正式演讲，来给你举例了。


    我之前说过一个道理：当一个人突然成功时，你觉得他是赶上了风口、一夜暴富，但大多数情况下，其实这个人已经积累了很多年了。'
  merge: -1
  img_proc: true
- pgno: 879
  md: '我接触了这么多人，很少见到第一次创业就大获全胜的。


    演讲也是一个道理。


    你觉得自己演讲能力不行，不是你天赋不行，而是你练的太少了。


    你可能要问：同事也是第一次演讲，为什么他讲的那么生动、气氛那么好？


    你可以观察一下，一般这种演讲天赋很高的人，生活中的谈吐、阅读的书籍、写作的能力等等，都不会差到哪去。一切都是他日常积累的结果。


    同样，对你来说，提升演讲能力，最好的办法，就是练。


    练有两方面：


    **1. 写逐字稿**'
