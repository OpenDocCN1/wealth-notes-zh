  md: '# 年入千万的淘客招商案例，以及22个问答全记录


    分享嘉宾：乐尚-河南-淘客


    # 分享：


    大家好，先给大家介绍一下，我是做淘客招商这个行业的。


    淘客这一块其实很简单，要我讲的话可能就几句话就讲完了，淘宝客说白了就是给商家卖东西的，那么在这个中间有好几个环节，商家要想把东西推出去，他必须得找好的淘客，找到好的淘客，还得给高的佣金和优惠券，然后那些买家群的淘客看到这个产品，会编辑文案发到他们用户群。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '买家群的淘客，就是会把一大帮子想在网上想便宜买东西的人聚集在群里，然后整理产品给他们。我们是做招商的，就是最上游，就是找商家要不要推广的，要了我们就接下来这个单子，和商家谈力度。


    以上是项目的背景，下面开始分享我的经历：


    在2015年的时候，我也是怡好在网上看到别人教淘客的，我花了3万8报名学习，当时应该有40多人学习，一开始都赚不到钱，陆陆续续给别人退款了好多家，最终就剩下不到10个人左右。真的是一路坚持下来了，当时一毛不赚，就靠着相信能赚钱，也想坚持做个事。应该是在3个月后开始爆发，一天2000块，我就叫朋友来我家，买了一台电脑开始做，前面就完全是赔钱，我工作模式是五五分成，没有底薪，刚开始不赚钱，我每个月给他们
    500块生活费，我这里是管住宿的，也就是500块他们吃个饭而已，之后开始赚钱了，就不在补贴，按照五五分成的模式开始发工资。'
  merge: -1
  img_proc: true
- pgno: 15
  md: '我的公司模式我觉得适合我这种懒人，五五分，前期我带一个人出来，然后继续叫人来公司，这个人去教他怎么做，我的工作就是叫人来公司上班。后面发展到10几个人了，我该叫的朋友都叫完了，下来让这些人给我拉人，谁拉来的人，谁去带，这个东西后期盈利还算可以，做得好一个人一个月可以到手赚2万多，这些人也是我的朋友们，工作怎么弄都好说，晚上加班到11点下班，早上8点上班，坚持了一年，办公室发展到30多个人，之后进行了一个改革，选拔出来了12个人成为团长，团长可以给自己拉人，自己带，分成是（团长）25%，我拿25%，员工继续拿50%，正好赶上过年，第二年来，直接80多人，没两个月就100人了。我们2018年，最好的一个员工，一个月拿到手12万，现在正在进行第三波裂变，刚把方案列出来，第三波预计团队
    2019年能达到300人到500人左右。


    淘客，真的是一个很正规的行业，操作手法很简单。完全是坚持，重复，坚持，重复，我们业内有一句话，当你明白淘客等于勤奋的时候，你就成为了大牛。


    下面一个核心：'
