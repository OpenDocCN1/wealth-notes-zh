  md: '5.课程如何推广，如何判断一个活动策划的成果，以及是否有失败的案例。


    夏天：


    # 5.1课程如何推广：


    第一，所有在我们这里参加过活动或课程的人，都会在我们不同的群里，这些群就成了我们推广的阵地；


    第二，其他不在任何群里的朋友，比如过来参观的游客和领导啦，我们也会想办法让ta关注公众号或者加客服号，这样也能触发一些信息的到达；


    第三，我们街区的微信公号会常年转发我们的内容，算是一个官方的推广；


    第四，和客户性质相近的组织或机构进行异业合作，互相导流，如高端瑜伽馆等。


    说实话宣传渠道这一块其实一直都比较弱，目前主要还是靠口碑和熟人圈，还有请的大咖自带的流量。所以今年也在学习社群运营、被动涨粉这些技巧，希望今后能有所改观。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 5.2如何判断一个活动策划的成果：


    活动成果很难量化，去判断一个活动是否成功，主要看两个方面：


    一是现场气氛，活动好不好，大家享受不享受，投入不投入，兴奋不兴奋，是有序进行的还是混乱不堪的，这个是一看就能看出来的；


    二是活动之后的意见反馈，因为和客户平时关系都维护得比较好，再加上你特别真诚地去问，不要带有任何导向性，多问几遍，多问几个人，自然就能得到比较真实的反馈；


    还有一点也可以作为判断的补充，就是看大家发朋友圈的积极性，比如有一次我们做了一个“红楼梦里度佳节”的活动，现场逼格很高，大家都拿起手机拍视频发朋友圈，一时间朋友圈被刷屏，那就说明大家很满意这个活动。当然，有时候不发也不代表不喜欢这个活动，也有可能是活动本身让人很有收获，但是画面感比较差，拍不出啥内容，不适合发圈。所以说这一点只能当作参考。


    # 5.3是否有失败的案例：'
  merge: -1
