  md: '# # 做宠物猫生意，怎么调研市场？


    提问：


    准备做猫舍，就是卖宠物猫。定价准备定5000左右的价格，主做英短这个品种。我想问问可以从哪些渠道获取到数据信息，知道这个定价的市场的容量，竞争情况，有想过从淘宝的猫的周边产品入手分析，比如买5000的猫周边产品，猫衣服可能猫主人愿意花费100元购买，3000左右的猫花费50元左右的价格购买。类推回去。不知道这样收集数据可行？还有请问一下还可以通过哪些渠道收集信息？推广途径有哪些？


    回答：'
  merge: -1
  img_proc: true
- pgno: 627
  md: '这个问题我看了一分钟，没太看懂。你做5000左右的宠物猫的生意，和这个市场的容量、特别是全国的市场容量没什么必然联系呀。举个例子，你准备在小区门口开家包子铺，调查小区周边的早点消费情况、包子铺竞争情况是正常的，调查全国的早点市场就没必要了吧？同理，宠物猫市场很大，哪怕细分到5000这个价位，调查全国市场容量的作用好像也有限吧？


    这里面可能是我没理解对你的意思，如果是这样的话你评论里再补充。


    顺着这个话题，聊聊市场竞争调研这件事。


    首先我们要明白，市场无论多大，几乎都是按照二八定律分布的，即20%的头部企业占据80%的市场规模，有时候比例更夸张一点。所以，个人、小团队做生意，一般只有两种情况：


    第一，模仿成功的头部企业，跟着他一起吃80%的主流市场。这种情况下，只要整个市场的份额一直在扩大，你和头部企业就都有发展空间。比如餐饮行业里，粥这个品类的需求一直在增加，你模仿头部的三米粥铺、曼玲粥铺，至少不会失败得太惨。'
  merge: -1
  img_proc: true
- pgno: 628
  md: '第二，在头部企业吃剩下的20%市场里，把自己做成细分领域的头部企业。这就是大家常说的垂直细分。这种情况下，垂直细分的需要一定要是刚需，并且有用户愿意付费。还拿粥这个品类举例，如果你不做普通的粥铺，做高价的潮汕粥也是一条路。


    相比之下，第二种模式对操盘人的要求更高，风险更大、收益也更大。


    回到宠物猫，我觉得你可以调研的方向有：


    +   1. 连锁品牌宠物店的模式、价位和销售情况


    +   2. 淘宝个人宠物卖家的模式、定价和不同卖家的定位


    +   3. 宠物猫博主们的粉丝讨论度


    +   4. 晒宠物猫的社区（比如小程序猫卡）的晒猫情况、英短社区的讨论量


    1和2，一般通过搜索、自己体验、和上级宠物猫的经销商交流都能拿到。3和4，先找到合适的博主、社群，然后肉眼可以大概判断一个趋势，重要的是多和猫奴（特别是还没养猫的猫奴们）聊聊，一方面调研需求，一方面为以后销售做积累。'
  merge: -1
  img_proc: true
