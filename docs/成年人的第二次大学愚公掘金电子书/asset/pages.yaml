  md: '首先呢，我要说整个的一个成本结构，成本结构大家应该或多或少都听到过，我现在做餐饮，它有个三高。**一个叫房租高，第二个呢，叫人工高。第三个呢，叫开销高**，什么开销呢，就是水电煤等等，这些开销都是极其的高，而且基本上每年都在上涨，那在这里我补充一下啊，我是那个一直基本在上海，那么我的公司其实也是在上海，上海的整个市场，包括全国的一线，二线城市，其实整个餐饮行业的竞争是非常非常的激烈的，很多人都会觉得说，哎呀，餐饮其实不是特别好做吗，但很有可能我们更多的时候是看到那些火爆的。或者说你的朋友是带你去那些比较火爆的餐厅去吃饭，所以你可能就看到了整个行业里面的一角，你就会觉得哇，生意这么好。怎么，为什么说生意难做呢，那我前面说的三高就是其中一个原因。


