- pgno: 527
  md: '# 学习爬虫技术，爬取数据之后，有什么作用？


    提问：


    请教个爬虫的问题，群里看到好多位群友对爬虫有兴趣。


    想请教一下，数据爬下来后，做啥用呢？比如今天花爷分享了一篇文章《我爬了商圈百晓生花爷的星球，都是些什么样的大佬花友！》，作者数据爬下来后，用来写了一篇文章。除了这个产出，还有没有其余更加有价值的产出呢？或者说这篇文章可以带来更大价值的产出？'
  merge: -1
  img_proc: true
- pgno: 528
  md: '我在cao z 的小密圈，之前曹大分享过一个爬虫的课，我学了 10 节课后，有点迷茫了，感觉讲的都是技术，但我对技术没有疑惑，疑惑的是“数据分析，数据应用”。用什么数据，带来了什么产出，这块完全不懂。当然，可以说这个是数据分析的能力，但是我都不知道自己需要什么数据，分析啥呢？


    本人从事嵌入式开发，工作中没有互联网相关的工作经验，我这个岗位上也不需要什么数据分析。以前也看到过好过涉及爬虫的文章，就像花爷今天分享的这篇一样，看完后怦然心动，但最终还是一头雾水，没有感性认知。在没有一个目的前提下，学习的过程中就迷失了，比如我之前希望学爬虫技术，但实际上好多工具可以爬数据，了解到这个情况后，顿时对于学爬虫技术的意义产生了怀疑。


    曹大在他的文章里经常提到，要有数据敏感能力，但如果工作中不接触这些数据的话，如何给自己创造一个数据环境，来提高数据敏锐度。作为互联网的门外汉，一直没找到门在哪。


    希望花爷在有时间的时候可以指点一二，谢谢。'
  merge: -1
  img_proc: true
- pgno: 529
  md: '# 回答：


    **1.**你说的没错，爬虫只是个工具。什么叫工具呢？就是需要的时候才用，并不是所有人都需要。真正需要用爬虫的，主要是两个作用。


    第一，爬数据，比如互联网公司的产品运营、创业者，要观察竞争对手，盯着对方的数据做比照，对方数据突然上涨了，我马上分析他做了什么，然后迅速跟进。注意，一般这种需要，虽然也是爬虫，但小白靠工具也能实现，不一定非要学习写代码。


    第二，做比较复杂的数据分析，一些公司有很大的用户行为数据，为了个性化运营，做出正确决策，就需要有专门的数据分析师，从繁杂的数据里归纳出规律来。一般这种对爬虫要求比较高，就需要写代码了，属于专业技能范畴。


    **2.**是不是觉得以上两点，你好像都不太用的到？对，因为像最开始说的，工具就是需要的时候才用，如果你不是挑夫，不用非要有一个扁担，对吧？'
  merge: -1
  img_proc: true
- pgno: 530
  md: '3. 所以，对大部分人来说，缺的不是工具，不是爬虫技术，而是数据分析的能力，因为几乎任何一个行业，都可以运用数据分析能力获得收益。


    4. 那么到底什么是数据分析能力呢？我的工作本身就没有数据，还怎么分析呢？


    我觉得，你的误解可能在于，把数据分析当成了一件非常高大上的事情，必须先收集数据，再来一套分析方法才算过瘾。


    其实不是，你想啊，不光是你，全中国可能95%的人都不需要接触大量数据，难道大佬们都强调的数据分析能力，大家都用不上吗？我觉得，对普通人来说，所谓数据分析能力，主要还是一个思维习惯问题，主要分两方面。


    第一，凡事学会算笔账。有人说这还不简单？那我建议你看看我的文章《月薪6千、1.5万、3万，应该如何理财投资》，里面的道理很简单，其实算笔账就懂，但很多人就是不会算。'
  merge: -1
  img_proc: true
- pgno: 531
  md: '算账怎么算呢？最重要的就是列一个公式。比如收益应该大于支出，比如收益=单价*数量，这个公式可能千变万化，但你一定要自己慢慢列一列。比如你要买房，买房的收益是什么，支出是什么，哪些变量会影响收益，影响的系数是多少，你真的认真考虑过吗？买房总是大部分人都要经历的事了吧，对不对。


    第二，是实验思维。上面的公式列出来了，比如房价=地段*影响系数A+开发商*影响系数B+交通便利度*影响系数C……你可能还能列出很多影响房价的变量出来，那么这个时候，怎么确定每个变量的影响因素是多少呢？毕竟很难同时兼顾地段、开发商、交通便利对吧？咱们得选一个最重要的变量，选谁呢？


    这时候就需要你去看看历史的房产交易数据，同样的开发商和交通便利度，地段不同房价差多少？同样的地段和开发商，交通便利度不同房价差多少？


    这样一通分析下来，不能说你成为一个房产专家，至少很难被坑了，对吧？如果你每件事都能有这样的思维方式，人生会不会有一点不一样？'
  merge: -1
  img_proc: true
- pgno: 532
  md: '5.所以，重要的不是爬虫，而是像上面一样，每一个决策，都用上面的数据分析思维，去思考，去锻炼自己的分析能力。等到你数据分析能力上来了，比如你想看当地不同地段的房价走势，你可能就想用爬虫去爬链家的交易数据了。所以，不是爬虫没有用，而是对大部分人来说，还没到用爬虫的分析能力吧。


