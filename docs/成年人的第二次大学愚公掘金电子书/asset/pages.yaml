    # Q&A:


    最后我简单回答一下昨天几个朋友提出的问题。


    # 1、做电商用那些手段提升自己店铺的流量？


    奉孝：上面已经提及了，流量=展现量*点击率。我个人经验来说，先优化点击率，


    先优化点击率，先优化点击率。展现量是几个角度去提升：流量入口多元化、推广力度、链接权重（各平台的权重设置不同，需要针对性去研究权重逻辑。）'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 2、 销量不好的商品怎么处理？


    奉孝： 这个问题应该首先第一步确认产品本身是不是符合市场需求，（结合平台市场情况、产品定位、竞品情况）第二步是针对产品本身进行优化（功能、外观、视觉表达、卖点提炼等）第三步是运营方法调整，运营方法就比较细了，而且模式比较多样化，需要逐步尝试，但有一个捷径，去观察同类目做的比较好的商家的运营数据，可针对性复制他们的做法。


    # 3、 哪些商品用来做活动吸引流量，选择的策略是什么？


    奉孝： 活动的时候吸引流量，核心要点是活动资源的获取能力，然后爆款的引流能力肯定是最强的。其实做活动是跟做平台一个道理，你得了解活动入口的规则以及客群情况（比如淘宝天猫的活动有很多：聚划算、淘抢购、淘金币、天天特价等等。每个活动入口的客群都不一样）挑选符合客群属性的产品即可。'
  merge: -1
  img_proc: true
- pgno: 178
