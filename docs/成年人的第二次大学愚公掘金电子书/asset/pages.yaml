- pgno: 186
  md: '从需求来看，信贷、游戏、房地产、教育等外呼刚需的产业需求旺盛。传统电销公司上同时一直面临着许多的问题：据《2017年中国呼叫中心产业白皮书》统计显示，全国近680万电话从业人员，其中大部分是80后和90后。电话从业人员每天重复着简单、枯燥、甚至会招来辱骂的话务工作，工资低，工作幸福指数低。对于企业，电话从业员工离职率高，培训成本高，人员素质偏低。对于社会，这些正处于最美好年纪的青壮年劳动力，本该为社会做出更有用的贡献，却做着廉价、低效、毫无职业晋升前景的重复劳动。


    从技术环境来看：核心技术，比如语音识别、语音理解、TTS等技术比较成熟，但核心掌握在几家大厂手里。这里的大厂是指BAT、讯飞，以及几家语音AI领域的创业公司，比如云知声、思必驰等。


    从竞争环境来看：除了大厂自身的 产品之外，不少小公司利用大厂的核心技术构建了自己的电销机器人(包了一层UI皮)，竞争较为激烈。'
