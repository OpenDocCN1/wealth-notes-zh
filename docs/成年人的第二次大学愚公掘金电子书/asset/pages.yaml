- pgno: 149
  md: '那我就简单介绍下什么是店群？店群的概念是什么？


    1. 采集爆款，采集别人店里卖得好的产品；


    2. 在原基础上加价，别人卖100，我们卖150，多出部分就是我们利润；


    3. 上传到自己的店铺，通过开多家店铺，来丰富自己的产品库；


    4. 替人下单，当有人在我们的店铺里购买的时候，我们再到上家下单


    简单来说，就是利用开多家店铺，占据平台的流量，如果有人下单了，就去采购更便宜的货发货。


    # ## 分享：


    大家好！我是来自广东佛山的小陈，现在在做有货源淘宝店以及无货源拼多多店群。'
