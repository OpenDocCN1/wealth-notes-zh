  md: '# 学医一定不好？不不不，利用信息差，应届医学生也可以月入四万


    提问：


    花爷，我弟今年高考，爸妈思想很顽固填志愿准备让他学医，但大家都知道现在学医压力特别大，收入又一般，我学医的朋友都说不让以后小孩再学医了，连医生自己都嫌弃这个职业，我要怎么劝爸妈？


    回答：


    纠正一个误区，没有任何一个行业是绝对的差。'
  merge: -1
  img_proc: true
- pgno: 785
  md: '比如现在医生普遍吐槽自己又累又赚不到钱，但事实上，金字塔顶尖的肯定是闷声发大财，而普通人也可以利用信息差获得不错的收入。


    上次跟朋友聊天提到，深圳某顶级医院的口腔科医生，刚毕业的硕士应届生（211，非985名校）工作一年，月收入是四万。


    这个年纪有这个收入，不管在哪个行业肯定都算高薪了。那为什么一个非名校的医学生能有这么高的收入呢？


    +   1.深圳是超一线城市的经济水平，但高校教育和医疗资源完全比不上北京上海，甚至连一些二线城市都比不过。


    这就造成了巨大的信息差，如果你在深圳的高校读研究生，放在全国看可能只是一般，但毕业能在深圳进一家头部的医院。而深圳头部的医院，在全国看可能还是一般，但在深圳就非常值钱了。'
  merge: -1
  img_proc: true
- pgno: 786
  md: '2.他学的是口腔，提成本来就高（非灰色收入，就是医院发的奖金提成），而且不需要和别人分提成。内科外科做台手术，主刀、助手、护士都要一起分提成，而口腔科医生爱牙、正畸、治疗，都是自己干自己的，提
    成自己独享。他月收入四万里有一半以上都是提成。


    你看，利用整体思维上的优势，普通人在医疗行业也能在二十多岁拿到高收入。


    所以，如果你爸妈非得让你弟弟学医，也是有空间去发挥的，没你想的那么糟。


    而如果你弟弟学的是其他专业，往往是大学里和专业无关的经历，对以后工作更重要，这就主要看你弟弟的主 观能动 性了，你可以有四年辅导督促他，你爸妈的意见能起到的作用其实比较小了。


