  md: '# 现在文章投放的主要渠道有哪些？有哪些工具和需要注意的细节？


    提问：


    花爷好，现在投放都有什么渠道，如果是公号投放，除了新榜和西瓜数据的工具，还有没有其他工具，具体还需要注意什么细节，谢谢。如果有做这方面内容的朋友合作，那更好🌺


