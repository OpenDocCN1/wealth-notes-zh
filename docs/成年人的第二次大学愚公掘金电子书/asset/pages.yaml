  md: '# 优衣库哄抢T恤事件，从商业角度看四层深意


    # 提问：


    花爷你好，今天看了优衣库抢爆款T恤的新闻，联想到之前的星巴克猫爪杯疯抢事件以及曾经的苹果手机通宵排队等现象，我琢磨不明白为什么人们会这么做。


    能否请花爷从商业的角度简单的分析一下人们出现这类现象的原因，十分感谢花爷。


    # 回答：


    希望花友能够从类似事件里学到的几点：'
  merge: -1
  img_proc: true
- pgno: 727
  md: '+   1. 优衣库被抢爆的是和KAWS的联名款，不知道KAWS没关系，作为一个土鳖我也不知道，不理解为什 么有人这么喜欢KAWS也没关系，你不可能和所有人感同身受。


    +   2. 我们只要知道，价格是供需关系的体现，这个理论可以进一步推演岀，当价格被强行限制时，供 需关系就会失衡。


    星巴克的猫爪杯，优衣库的KAWS，被抢购后在转卖市场上价格翻了几倍，转卖的价格才是它真实的价 格。官方强行压价后，必然遭遇疯抢。


    今天LV卖一千一只，限量抢购你抢不抢？反正我抢。


    +   3. 类似的情况在球鞋市场非常常见，AJ、椰子等鞋款的限量款，抢购到之后在转卖市场大多能翻 几倍。奢侈品的限量款同样如此，supreme和LV联名出的箱子我记得已经涨到三十多万吧。


    为什么一双鞋、一个箱子能卖这么贵？'
  merge: -1
  img_proc: true
- pgno: 728
  md: '没别的，因为有人买得起。我们之前就说过，当吃喝拉撒睡这些基础需求被满足之后，人就需要消费来体现自己的阶级。


    有钱人爱买奢侈品，年轻人想要限量的猫爪杯，白领们只穿耐克不穿安踏，每个人都在力所能及的消费，确认自己的阶层。


    **4. 很容易被忽视的一点，就是虽然kawsT恤抢到就是赚到**，但为什么会引发哄抢甚至打架呢？


    不妨思考一下，kaws转卖一件无非是赚两百块。现在给你两百块，你愿意像野蛮人一样去哄抢、打架吗？


    别说你 unwilling，我相信在场哄抢的很多人，也是不愿意的。


    但当他们在那个哄抢的环境里，在那个同类疯狂竞争、无人监管的环境里，暴力和疯狂开始占据上峰，人性的丑恶暴露无遗。


    是不是想到前幾年里拿U型锁敲日本车主脑袋的年轻人？'
