    回答：


    8个问答带你思考这个问题：


    # 1. 书有高低贵贱之分吗？


    不好意思，真有，鸡汤文就是比较low。


    # 2. 那读鸡汤文有错吗？'
  merge: -1
  img_proc: true
- pgno: 672
  md: '没错，人不需要追求绝对的正确，只有更加合适的策略。如果你是读鸡汤文的水平，那读鸡汤文就很正常。


    # 3.既然没错，为什么读鸡汤文会被瞧不起呢？


    因为错的不是读鸡汤文，而是只读鸡汤文。人类不断探索、进步的过程，就是走出舒适区，迎难而上的过程。你三岁看连环画，三十岁还看连环画，就不太合适。


    # 4.可我一读有深度的书籍就困怎么办？


    那就别勉强自己读有深度的书，不如换个角度，先疯狂看鸡汤文，看到吐、看到审美疲劳为止————鸡汤文的最大弱点正是不耐读。


    # 5.我一本书要看一两个月，一年最多看十本，根本到不了看吐的水平啊？


    终于问到了点子上，其实你看什么不重要，有正确的看书习惯才重要，只要方法对，一周看一本绝对不是问题。阅读量大了，你接触到好书的概率也就大了。


    # 6. 如何一周读一本书？'
  merge: -1
  img_proc: true
- pgno: 673
  md: '不要每个字都看。先看目录，了解内容梗概，然后一目十行的看，不到重点不要停下来。


    # 7.这么看不是囫囵吞枣吗？


    反正你认真看，几个月后能记住几句金句就不错了。既然不影响结果，那速读换取阅读数量就是个好方法。


    # 8.鸡汤文速读，有深度的书也速读吗？


    对，鸡汤文速读，你会发现鸡汤文都差不多。有深度的书速读，你会迅速了解此书是否对你有用，如果没用，迅速抛弃，去读下一本书。


    所以，读什么书不重要，合适才最重要；书看不懂不重要，重要的是速读，扩大阅读宽度，先有个概念再说；就好像我直接给你的答案其实也不重要，重要的是像聪敏人一样去思考。'
