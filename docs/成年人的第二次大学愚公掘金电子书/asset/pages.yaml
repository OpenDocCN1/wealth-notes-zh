  md: '# 1.为啥上市的时候 拼多多和云集都说自己不是社交电商？


    黄小鱼：因为只讲社交电商的故事太小，需要个更大的容器。社交电商，其实更多的偏重点是在于前端的获客方式或者说裂变方式，那么整个去看电商，有另外一半的比重一定是在供应链端的。而供应链的整合，或者说供应链的反向定制，也是股市中很重要的一个组成部分。


    # 2.社交电商对电商从业者会有什么影响？


    黄小鱼：社交电商会改写传统电商的获客逻辑和成本结构，如果传统电商不及时转型的话，很有可能会被这一波新入场的人赶超过去。


    # 3.普通人能利用社交电商做些什么？


    黄小鱼：普通人利用社交电商，其实最根源的还是建立自己的个人品牌，打造个人品牌的同时去打造自己的私域流量池。有了这两个要素之后，可以去抓未来，一个又一个不具备不确定性的风口。'
