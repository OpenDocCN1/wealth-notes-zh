    坐标：深圳


    工作：小公司亚马逊产品开发


    收入：收入平均每月一万


    财务：一个人养家糊口，老婆在家带3个月大的娃。去年结婚，欠信用卡5万。现在每个月收支略微赤字。


    工作现状：受现实条件约束，工作经验无增长，唯一好的，到点就下班，有较多的时间自由支配。不好的，就是后续增长，人脉，资源等，为零。'
