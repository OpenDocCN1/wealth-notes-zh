- pgno: 59
  md: 因为我所在的城市属于二三线城市，所以文化产业的土壞只能说比较一般，不管从市场的大小、资源的多少来衡量，都是如此。但是一线、甚至超一线城市就不同了，接下来我想说一说另一个我观察了好几年的机构，也在做差不多的事情，它的坐标在国内一线城市。
  merge: -1
