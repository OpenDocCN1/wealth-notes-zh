  md: '# # 如何定位好公众号的价值？


    # **提问：**


    花爷好，问题有点长，烦请看图。


    ![](img/5688f8284c7103ed77046cfddaf3da13_891_0.png)


    一、基本情况：(纵向)属省交通运输厅下高速公路管理局下高速公路管理处下的一个二十人的路政大队，管辖60km多高速。（横向）1交警（协同处理事故，他们负责责任划分，我们负责勘察路产损失，救援都参与），2营运公司（监督他们做好道路维护和营运），3司乘人员(载人：事故后赔路产损失的钱，载货：出入收费站超限超载处理)，4沿线居民（不让他们在高速用地范围内乱来）。以上是主要常见业务工作并不全面，还要很多内部建设的意义不大就不说'
  merge: -1
  img_proc: true
- pgno: 892
  md: '了。


    二、领导要求做公众号，主要目的是宣传我们的工作。


    三、看花爷的文章学习到首先我们应该考虑我们能输出什么有价值的内容，我的考虑有以下几个方面但觉得都不太好：1交通相关法律.(不看好，利益关系不太，一般不愿意看)2驾驶相关经验技术(专门做这方面的已经做很好了)3路况信息(一般都畅通，偶尔有事故或管制，频次低)4救援好人好事（也是偶发性的，频次低）另，名字要求一定要xx路政执法大队，很多人连路政干什么的都不知道，苦恼。


    四、可借鉴的有路政之家、交通执法之家，我们属于信息最下游。从留言看他们粉丝也主要是交通相关从业人员。


    对于这样一个知晓率这么低的职业可以从哪些方面来做这个公众号，请花爷及各位大佬赐教？


    分享


    收藏


    删除


    打印


    # 回答：'
  merge: -1
  img_proc: true
- pgno: 893
  md: '不好意思，最近手机信号一直罢工，久等了各位。


    你说的很多，做公众号，一定要输出有价值的东西，但你没搞清楚另一个更深层的问题，对谁有价值？


    没有目标对象，就没有价值可言。


    举个例子，你在公众号写高端电子产品，对手机发烧友可能有价值，但对种地的农民老伯有价值吗？一毛钱价值都没有。


    同理，你写各种交通内容，对普通老百姓有价值吗？没有，你自己都列出来并且一一否定了。


    那真正的价值在哪？


    就在你的问题里：领导要求做公众号，主要目的是宣传我们的工作。


    看到没，这是政绩，是影响力，是帮领导做给领导的领导看的东西。'
  merge: -1
  img_proc: true
- pgno: 894
  md: '自媒体影响力这个东西，别的领导如果做了，你的领导没有，你的领导多尴尬？别的如果没做，你的领导如果有，你的领导多有面子？


    这个公众号，就是一个展示影响力的东西，影响力越大越好，别管有没有真正的实际使用价值。


    明白这一点，你就能找到写作素材：


    1.什么样的内容，能带来正面的影响力？


    聊部门取得的成绩，聊大家的付出，聊群众的证明反馈。


    上个月我们做了什么，成绩多么好，群众反向多么热烈，这类内容你懂吧？尽量写得生动、自然一点，在事实的基础上适当美化，让领导和同部门的人既不觉得夸张，又觉得心里飘飘然。


    2.怎么通过公众号，在系统内部，扩大影响力？


    你可能要问，写这些内容，用户不爱看，没反响啊！'
  merge: -1
  img_proc: true
- pgno: 895
  md: '废话，你看哪个体制内的文章是大家爱读的？为什么不爱读阅读量还这么高？因为要求大家一起看，一起点赞啊！所以多和你列的那些关联部门搞好关系，让各部门帮忙转发、宣传。


    当然，也许你确实叫不动其他部门的小领导，那就让你的领导帮忙疏通一下，美名其曰“部门对外宣传工作的一部分”。


    3.怎么通过公众号，在整个市区、交通系统内扩大影响力？


    想做到这一点，对你的要求就很高了。


    你可以尝试写本地的交通系统变迁历史，写出本地突飞猛进的自豪感，这种文章容易在区域内爆火。这一点，你可以借鉴公众号“地球知识局”。


    或者也可以蹭热点的交通新闻，写时事点评，新闻的传播速度永远是最快的。


    但总体来说，第三点很难很难。'
