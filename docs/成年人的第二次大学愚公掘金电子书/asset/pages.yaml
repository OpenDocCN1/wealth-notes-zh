- pgno: 92
  md: '3.现在很多智慧教育、智慧校园等类型的产品在国家大政策的背景支持下，全国正在大力推进，未来线上培训优质课程分享，优质教育资源都走线上分配都系统性集成在智慧校园等大系统里，对你们未来影响有多大，你们和龙头的竞争优势在哪里？


    Angela：影响有多大从我的角度完全不好说□，好未来企业，在人工智能领域投入巨额资本和企业资源，并且是教育领域第一家设立人工智能博士后工作站。2018年初好未来宣布与斯坦福大学达成人工智能战略合作，成立脑科学实验室……在同行业内，我所在机构所隶属的好未来公司是行业中的后起之秀，前景很值得看好。


    4.k12教育家长关注的重点是什么，家长和学生的主要诉求在哪里？


    Angela：一二线城市家长关注孩子的综合能力的培养提升，对应试也要较大需求。三线城市，中产阶级家庭在学龄前阶段注重孩子兴趣培养，视野开拓，综合能力培养。一旦进入小学阶段，至少60%家长倾向于转纯应试机构，提升孩子考试技巧。'
  merge: -1
  img_proc: true
- pgno: 93
  md: '学龄前家长对于孩子的诉求集中在：提升孩子的口语能力，能和外教自如交流，培养孩子自信心，课堂纪律意识和行为规范养成以衔接小学教育。


    进入小学阶段，诉求基本只有一个：提分。只有极少部分家长认同孩子的各项综合能力提升更为重要。


    孩子的诉求，一方面来自家长潜意识施压，家长的诉求会无意识转化为孩子的诉求。一部分孩子的真正诉求是没有作业，没有补习，玩得开心。一部分自我驱动型的学生诉求是高效成长，希望自己在学习和综合能力方面变得优秀。


    作为一线老师，我觉得学习必然是一个要付出时间精力成本的事情。我的诉求是和孩子一起，以更有趣的方式高效投入学习，在这个过程中培养孩子的综合能力。


    5.k12的线上培训我有些不明白，传统思想观念下家长应该还是让k12的学生少接触网络的吧？那么线上是如何做培训的呢？'
