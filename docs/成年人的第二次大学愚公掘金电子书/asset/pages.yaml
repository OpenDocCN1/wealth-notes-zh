- pgno: 947
  md: '所以，先推广垃圾分类，培养老百姓的习惯，哪怕最后垃圾还是一车收走，统一处理，没关系啊，等企业的技术、设备跟上了，整个轮子就跑得更快了。


    不信你看看，现在全民垃圾分类的氛围，多少企业想从中分一杯羹？不愁企业不投资入局。


    做企业，做生意，甚至是职场发展、做人，都是一样的道理，你得先从一团乱麻里找到那根线头，能找到线头的人，就是能突破阶层天花板的人。


