- pgno: 872
  md: '# 抄录国外内容来写公众号，是个好方法吗？


    提问：


    花爷，我想问下关于微信公众号写作。


    现在的问题是坚持自己的原创，自己没那么多输出，洗稿担心自己的名誉会不好，我说下我的思路看能不能行得通。


    +   1、抄录一些出版久远的书里面的部分句子，直接抄写，有些地方用自己的观点来进行表达，比如说《人性的弱点》


    +   2、抄录在YouTube上视频的文字再发表到自己的公众号上予以原创标识，国内大部分人不能访问Google，把国外的内容搬运到自己公众号上


    865'
  merge: -1
  img_proc: true
- pgno: 873
  md: '+   3、抄录国外的杂志文章，如台湾，利用信息不对称，把文章搬运到自己公众号上来

    4、花爷或者花友，有更好思路还望指点一二，先谢谢了。

    5、对于原创的疑惑，花爷，花友们是如何完全原创，不借鉴任何文章、书做到持续输出的


    # 回答：


    写作这个事，是这样：


    你哪怕再原创，你写的东西一定也会受看过的书、喜欢的KOL的影响，观点也一定会和其他人相似，这很正常，我也这样。


    这种写作是最难的，我没办法在一个回答里教会你怎么写，真要教可能要开门课讲两个礼拜。但学会了，就可以驾驭非常多的风格，我的公众号写作风格一直非常克制，其实我可以写、也写过非常多类型的文章，最高写过60w阅读的文章……


    低调，回归正题。'
  merge: -1
  img_proc: true
- pgno: 874
  md: '至于洗稿，自媒体里的原则是，如果你逮着一篇洗，那你很过分，而且显得你特别低能，洗稿都不会洗。


    但如果你这里洗一点，那里洗一点，东拼西凑然后文章本身有自己的逻辑，虽然也很不道德，但行业里很多人就是这么干的。


    比如写出《疫苗之王》，让假疫苗事件爆火的曾爷，公众号后面好多文章都是洗稿的。


    最低级的，当然是原封不动照抄的，有好多公众号都一字不改的抄过我文章的片段，但是也没什么办法，微信不管，举报没用。这种情况我也懒得管，一般low到一字不动摘抄的，抄出来也不会有太大效果。


    最后，你说的几个思路，我给你逐一点评一下。


    # 1.用自己的话写书里的观点


    用自己的话写别人的观点，是一个方法，但文章除了观点，还需要案例，书里的案例往往是过时的。'
  merge: -1
  img_proc: true
- pgno: 875
  md: '另外，书里的内容，展开的很慢，你读一本书，会感觉废话特别多。写文章不一样，观点要集中爆发，所以可能需要把几本书里的观点，合理的串在一篇文章里。


    整体来看，这个思路看上去挺简单的，其实是有一定门槛的，想写好并不容易。


    # 2. 搬运热门视频，写成文字版


    这条路可能是最好实现的，比如最近就有个案例，日本那边有个讲丧父的两兄弟，独自出门给父亲买忌日的鲜花的视频很火。这个视频在国外火过一轮，在微博上又火过一轮，最后被人写成文章，在微信里又火了一轮。


    泪目！日本4岁哥哥带着2岁弟弟，为去世父亲买花：路很长，谢谢有你陪我


    这个做法有几个好处，第一内容本身已经火过，而且热门视频大多是情感导向的，在微信里很容易传播。第二视频写成文字，相对没那么困难，多写几篇应该就得心应手了。


    如果一定要选一个思路，建议选这条。'
