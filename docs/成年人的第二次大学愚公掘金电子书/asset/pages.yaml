- pgno: 476
  md: '# 如何转行做短视频？


    # 提问：


    之前花友的提问，主要聊“如何转行做短视频？


    “我想请教您一个职业上的问题，我是15年毕业，做过微信公众号和今日头条运营，去年做了一年的区块链媒体运营，都是发文。今年想转做短视频，但是由于没有基础，面试不顺利，现在想是不是可以先找新媒体运营方面的工作，后续再转向短视频


    # 回答：


    同样是转行，如果你想转行短视频，这是个比较好的方向。为什么？这个答案的原因，也就指向了你接下来需要做的事情。我之前说过一个思考方法“穿越式思考”，如果你站在五年后来看，想要转行短视频：'
  merge: -1
  img_proc: true
- pgno: 477
  md: '1.不需要辞职，不需要去做新媒体运营来当做跳板公司，因为短视频行业本身的门槛非常低，低到你只要用业余时间去做就好了。


    无论是社交媒体的发展规律来看，还是整个互联网发展环境来看，视频都是未来5年的重头戏，而现在，做的最早的、做的最好的短视频从业者，也不过比你早一年而已，拉长到未来整个短视频发展预期来看，这根本不算多大的先发优势。


    2.那么怎么学呢？听课培训吗？我建议，如果你在短视频上还是个小百，可以买一些课程，听听短视频的基础概念和案例，花钱完成基础经验建设—————但也仅此而已，想要听完课程就一跃坐拥百万千万粉丝，显然是不切实际的。


    听完基础知识后，你只要动手实操，就可以了。。如果你思考定位、准备、学习的时间超过了一周，我建议你先强迫自己直接上手做视频，然后每周再做总结。说一千道一万，都不如先干起来'
  merge: -1
  img_proc: true
- pgno: 478
  md: '# 3.短视频的高阶会走向哪里？


    以上内容正常实操，相信只要不是大笨蛋，加上适时的点播和总结，个人成长为一个及格水平的短视频运营没问题。但究竟怎样才能成为这方面的佼佼者呢？


    纵观每个领域的发展历史，其门槛一定是越来越高、质量越来越往上走的，从最初的流量红利，一般都会走向专业人员对领域的降维打击。短视频领域也是一样，从最开始的PPT短视频就能火，到后来的真人出镜卖货、讲课，到现在越来越多的剧情、分镜、创意，短视频领域也会迎来专业影视人员带来的降维打击。


    当然，这里不一定非要专业影视人员来做短视频，而是传统影视领域，那些节奏、剧本、场景把握的规律，会在短视频领域造成降维打击，形成真正的壁垒。我建议你上手之后，可以多看一下影视专业内容，至少要多看热门影视、综艺，总结拍摄规律，留心剧情好口碑好的视频博主，拆解、学习他们，不过这些是我个人对短视频的判断了，说白了，最终短视频的时长限制会逐渐模糊，变成更碎片化的综艺、电影电视，因为有从业者充分的竞争，短视频的质量和传统电视比只会高不会低，最终抢走传统电视的市场。'
  merge: -1
  img_proc: true
