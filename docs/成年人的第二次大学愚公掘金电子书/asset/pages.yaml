    提问：


    有位宝妈花友提问：


    “


    花爷你好，我是一名30岁的宝妈，老公开药店。去年有了宝宝就辞掉工作在家至今，因为要带孩子但是也想自己经济独立，大学毕业我从事过教育行业，学校代课老师然后自己跟朋友合伙办小学托管，后来15年我又转行从事金融投资行业直到去年五月份，也积累了一些中老年人的投资群体。现在我很茫然，不知道是应该协助先生的药店生意还是自己去上班或者做点小生意呢？比如童装母婴用品类似的。'
