- pgno: 569
  md: '花爷你好，因为对财富自由的关注加入您的星球，想让您帮忙分析下我的状况。目前芯片设计研究生在读，马上毕业，已拿到互联网企业offer，但是是转行做算法方向，月薪接近3w。这两年投过币市，从16年入场到现在，大牛大熊都经历过了，陆陆续续亏了接近4w块，基本投资新手各种坑都踩了一遍。找完工作这大半年时间看了不少投资的书，比如《钱》《曼昆经济学原理》《投资最重要的事》《周期》。根据《钱》里边的方法，我算出自己达到财富自由的资金是4000w。如果按照目前的工资以及预期工资涨幅，使用瑞达利欧的全天候投资组合按10%的年收益计算，我可能要25年以上才能达到这个目标。但我的爱好是各种极限运动..(下接图片)


