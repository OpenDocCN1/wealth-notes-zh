  md: '还是那句话，就是因为我们认知到自己的精力能力，方方面面都非常非常的有限，所以我们决定只在某一个细分的领域里面的精进到天下无敌，我们的理想就是天下无敌，就有一天我拿出去的时候，没有人可以跟我去争。那就我就认为说，我可以赢得所有的市场。也就是说这个领域，比方说我举例假设这个门头的领域，它的市场有多大，我成为这个领域的第一的时候，那它的市场就全归我，或者说他的头部市场就全归我了，今天来找到我的这个，就合作伙伴也好，或者是投资人也好，基本上就是这个行业里面。应该算是最顶级的。


