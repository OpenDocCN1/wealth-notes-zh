    # 二类电商的选品和广告投放是最关键的两个因素！


    选品有两个方法，一个是跟投别人的，看别人投什么多，你跟着投，只要能跟的及时，基本上都会有盈利，第二个是自己测试，自己测试的话对团队要求比较高，选品能力、文案能力、广告投放等等。对于一般团队来说自己测试创新，要求很高，但一旦你成为第一个吃螃蟹的人，那么获利也是最多的。


    第二个关键因素，广告投放，关于广告投放，要说的太多了，不同的广告平台，不同的受众人群，投放方法也不一样。广告是花钱烧出来的经验，需要实践的！


    # 避坑：


    接下来我说一下二类电商容易踩的坑。


    # 1：供应链'
  merge: -1
  img_proc: true
- pgno: 230
  md: '一旦一个产品卖爆，你会发现货源跟不上，客户下单了你没货，厂家及时生产不上来，过个10天你再发货，签收率低到你想死。产品好不容易备足了，结果被同行做烂掉了，货全押你手上


    # 2： 广告成本


    广告成本直接决定着你能不能把这个产品继续做下去，如果广告成本控制不好，很容易亏钱，广告投放是花钱烧出来的经验，不是随便一个小白就可以去做的，当然也可以找广告公司代投，代投也要有一个懂的人监督才行，当然，新手也不是不能做，小额试投，慢慢摸索也是可以慢慢入行。


    广告投放平台有很多，腾讯，头条，抖音，各大新闻平台，都可以看到二类电商的投放身影，像头条的鲁班系统，就是一个二类电商系统。


    其实二类电商模式就是一道很简单的算数题，销售价格 - 成本 = 利润。'
