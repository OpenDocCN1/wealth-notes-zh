- pgno: 685
  md: '其实内容还是基础，互推、送书活动之类的，属于锦上添花，真有大V帮你推的话，无非两个原因，一是质量好，好到大V都忍不住想分享，二是做出成绩，大V想结识你。


    你自己分析的很对，你的文章质量高，但成绩上不去，主要就是因为定位太窄，内容阅读门槛太高。又要懂编程，还主要是go这种国内小众语言，本身天花板就很低。


    如果你只是写着开心，当个技术博客，那可以继续，完全没问题，如果你想再多做成绩，那给你三策：


    # 1.扩人群


    首先go这个语言在程序员里也算小众，那多写几种语言？不不不，如果你是奔着做大去的，写几种编程语言不是重点，千万别走偏。


    如果你真的要写深写精，那不如去github或者去开课好了。'
