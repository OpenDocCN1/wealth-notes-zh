  md: '# ## 2、快手和抖音的区别


    最主要的还是做这个快手和抖音，我先来说一下这个快手和抖音，这两个平台的分别：


    **1、首先呢，在这个带货这个方面，快手要比抖音是要强一点的。**


    因为在抖音上是以创意视频为主，就是说它没有那么强的卖货性质。咱们去看那个抖音的直播，基本上都是以这个唱歌儿啊，聊天儿啊，美女啊等等，这些东西为主，它这个卖商品的话，卖货也基本是与抖音合作的分成去卖货。


