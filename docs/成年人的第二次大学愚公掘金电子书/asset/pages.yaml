  md: '# 应该如何合理的看待副业？


    # 提问：


    花爷好，我做新媒体的，毕业一年，工资八千，但北京生活成本很搞，后来经朋友介绍开始接代写文章的副业，能赚一点钱，但是写得文章没什么意思，也没法提高，很纠结要不要继续


    # 回答：


    正好最近看到这篇写副业的文章，推荐大家阅读：那些带给我疲惫，没有成就感的副业收入'
  merge: -1
  img_proc: true
- pgno: 815
  md: '我们要明白，工作上本质只有两种，出卖劳动力和交易资源。白领的工作比工地搬砖高级，不是因为办公室舒服逼格高，而且因为白领相比于搬砖工，有更大的机会提升软实力，获得资源。


    说的理论一点，就是你得向着拥有生产资料努力。


    所以，白领在普世意义上比搬砖工高级，但白领比包工头高级吗？那就不一定了。


    我们鼓励人做副业，当然是为了赚钱，但不是为了赚短期的钱。每个人从毕业到工作，能接触到的商业面、社会层次其实很窄，遇到真正适合自己的工作内容的概率是很低的，做副业，就是探索更多可能性，争取找到最优解。


    什么是最优解？除了赚钱，还需要能长期积累，形成复利，越发展越好。


    我大学的时候，暑假会出去打工，那时想法很简单，不想要爸妈的钱，所以去端盘子、倒酒、工厂搬货，直到有一天我累的半死回到宿舍，我问自己，这样做到底有什么意义？'
  merge: -1
  img_proc: true
- pgno: 816
  md: '我找不到答案，后来我安心的要了妈妈给的生活费，把所有精力放在准备找一份互联网工作上。毕业的时候月薪过万，应该是我那个普通大学专业里最好的（不过那时候互联网工资溢价，也有点运气成分）。


    其实你现在的情况和我上大学是一样的，如果你不是缺了那点钱活不下去，你真心想把新媒体做好，那还是多花时间学习、自己去做新媒体，积累粉丝、积累失败，时间才不算辜负。


