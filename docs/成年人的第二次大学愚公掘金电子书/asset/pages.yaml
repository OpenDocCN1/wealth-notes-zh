- pgno: 1022
  md: '# 怎么看待头条的最新产品“飞聊”对自己最有利？


    最近头条又新出了社交App“飞聊”，有花友在群里点名让我聊。那花爷给它的评价仍然是四个字：


    没有希望。


    当然，任何一件事情，不能只看热闹，也不能只看结论。跟着我们一起来思考下， 怎么看待“飞聊”才对自己有益？


    +   1.飞聊有没有前途？'
  merge: -1
  img_proc: true
- pgno: 1023
  md: '这是个典型的商业逻辑问题。我们遇到这个问题的第一反应，一定是借鉴历史、寻找对标产品。很显然，从same、nice、马桶、多闪等一系列社交App的历史来看，我相信聪明的各位花友很容易得到一个结论：


    年轻人用QQ，成年人用微信。除非出现操作设备这种层面的大变动，否则熟人社交已经没有任何机会。


    剩下唯一的机会就是陌生社交，但这么多年来，唯一成功的陌生社交只有陌陌和探探。前者跟微信没法比，后者触及红线已下架。


    而其他所有失败的陌生社交，失败的原因无外乎用户彼此熟悉之后开始“加个微信聊”——相当于给微信在导流。


    所以飞聊没有机会。


    # 2.为什么头条要做飞聊？


    我们都知道飞聊没机会成，难道今日头条的高层是傻子？如果你这么认为，是典型的把屁股焊在了自己椅子上。'
  merge: -1
  img_proc: true
- pgno: 1024
  md: '在大公司的战略里，“打点”是件很重要的事。在他们看重的领域，明知成功率低，也要占个坑发力，万一成了呢？就算没成，给竞争对手造成一点骚扰也好。


    你可能要说，我靠，明知道大概率失败还这么多钱砸项目，老板们的钱都是烧着玩儿的？


    这就是典型的个人和大企业的思维差异。个人的容错率低，追求一击必中；大企业追求的是高额回报，是一次投资能赚十年，这种投资本身就是一百次中一次，所以人家不仅要烧钱，而且必须烧，不主动出击反而有危险。


    这一点和风险投资的逻辑类似，当然，投资者也会想办法提高投资的成功率。


    # 3.飞聊这么菜，我还看它干嘛？


    既然飞聊、多闪大概率扑街，那我还看它们干嘛？为什么花爷还鼓励大家一定要率先体验这些新事物？


    因为个人想要突破，就要把自己当成企业去经营，用最低的成本去搏概率。'
  merge: -1
  img_proc: true
- pgno: 1025
  md: '飞聊、多闪是不行，但万一行呢？你不看一眼怎么确定百分百不行？既然看一眼投入的不多是十分钟时间，那就值得去研究。


    另外，当你养成研究新事物的习惯之后，每次研究的时间会成为你的虚拟资产，让你进一步理解商业、产品逻辑，比如1、2中我提到的内容，不正是我之前研究新事物时总结出的元规律吗？


    现在，飞聊一出来，我马上下载，看一眼构架，心里就一清二楚，然后就判了死刑卸载了。因为经验丰富，整个过程没超过三分钟。


    看上去，这些三分钟是浪费了。


    但人生里，这些三分钟不能省，它们告诉我：你还在路上，继续向前吧，这里还不是目的地。


