  md: '速卖通的基本盘在俄罗斯，体量还是小。万一哪天速卖通崛起了呢（我也希望这样），阿里国内深耕多年，1688淘宝天猫，供应链卖家一呼百应，对阿里来说最不缺的就是卖家，只要市场蛋糕够大，直接引入天猫大卖（现在也一直在招商，只是很多天猫大卖根本没有把精力投入速卖通）。就像之前天猫替代C端淘宝一样，如果一开始没能占据一定位置，即使后面市场起来了，蛋糕也分不到你。


