  img_proc: true
- pgno: 500
  md: '这两条职业路线的终点，没什么太大差别。


    做的好，两条路线三十岁之前年收入过百万的概率，基

    本是相同的。


    重点是，抛开一切表面因素。


    你的性格，到底适合职场晋升路线，还是全能创业路

    线？


    这个问题，我想大多数人心里其实是有答案的。


