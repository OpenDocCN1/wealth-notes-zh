- pgno: 520
  md: '# 个人或者公司现在杀入抖音平台会不会有点晚了？假如运营短视频平台，如何切入呢？


    提问：


    花爷，最近这个抖音等短视频平台的培训越演愈烈，好多自媒体培训的号摇身一变就成了抖音月入十万秘籍等等～话说这个浮躁操蛋的涩会，这种现象会不会是某种趋势呢？


    个人或者公司现在杀入抖音平台会不会有点晚了？本人之前一直从事健康领域，现在在对接全球旅游资源，但是心里还是喜欢健康养生行业，未来可能还是要做这一块。，'
  merge: -1
  img_proc: true
- pgno: 521
  md: '假如运营短视频平台，如何切入呢？


    谢谢花爷指点


    # 回答：


    # 1.浮躁的抖音培训是一种趋势吗？


    不全是，正确的理解应该是：任何一个领域刚刚高速发展时，一定伴随着大量的低质量产品抢占红利，也一定伴随着一波大笨蛋贪婪得想要从中大捞一笔，最后一定会有一些人打着培训的名义收割这些贪婪的大笨蛋。


    但伴随着领域内的市场进化，用户的要求会越来越高，低质量的内容会被淘汰，用户需求的拔高会反向促进从业者的专业水平。同时贪婪的大笨蛋们被收割之后，也终于知道赚钱没那么容易，做低质量培训的生意也就没有那么好做了。


    这个规律基本可以印证任何一个行业，无论是短视频、公众号、小程序等等任何风口。所以，浮躁的开端本身就是趋势内的一部分。我一直和大家说，去做长期的生意，就是希望大家别被眼前浮躁、短暂的利益所迷惑，越低门槛的生意，生命周期就越短。'
  merge: -1
  img_proc: true
- pgno: 522
  md: '低质量培训赚钱吗？赚，但你要明白，它本身就不是靠质量赚钱，而是靠快速收割赚钱的。你要清楚：


    快，就是他们的核心竞争力。


    # 2.现在进入短视频会不会太晚？


    不晚。这点我前面回答问题的时侯说过了，无论是社交媒体的发展规律来看，还是整个互联网发展环境来看，视频都是未来5年的重头戏。而现在，做的最早的、做的最好的短视频从业者，也不过比你早一两年而已，拉长到未来整个短视频发展预期来看，这根本不算多大的先发优势。


    你可以看到，前面一波做ppt、低质量短视频的，虽然靠流量红利积累了粉丝，但变现非常困难，其实已经属于被淘汰的一波了。所以，当你准备深耕短视频的时候，和做低质量的短视频培训生意的逻辑完全不一样：


    快，并不是必要条件。


    # 3.健康养生的短视频怎么做？'
  merge: -1
  img_proc: true
- pgno: 523
  md: '这块可以将很多，我大概理一个方向，你实操时遇到问题可以再问。


    大体主要分两类，一块是你有产品资源，做短视频是为了给卖货、线下店导流的，这一块最开始其实不用想那么复杂，找准产品特色，想办法用视频呈现出来就好。比如你主打自己线下店可以有效祛痘，拍用户多次治疗的效果对比视频就好了，一个模板效果好就可以重复做同类视频。


    另一类是KOL型账号，也就是说你想做健康领域的大V，以后接广告、卖产品等等都可以。这类账号从最早的ppt短视频就能火，到后来的真人出镜科普，质量一直在提高。


    我提两点建议，第一是一定要做有信任感的个人IP，比如出境人是医生专家、医学博士、化妆品配方师等等，健康领域非常迷信权威和专家，同样是感冒，江湖游医和三甲专家的治疗方案哪怕一模一样，大家也会倾向于相信专家。所以视频第一眼，你就要从各方面打造自己的专业权威形象。'
  merge: -1
  img_proc: true
- pgno: 524
  md: '第二是“垂直受众+信息差”策略，健康是一个垂直、刚需但是低频的领域，很多疾病都有其垂直细分的场景，但建议最开始，还是选择受众广的细分领域（比如护肤、母婴）、配合季节性话题（比如春天鼻炎、流感）入手。说了这些还不知道怎么选细分领域？其实健康里热门的细分领域就那么多，去各大健康公众号看看关注度最高的文章讲什么话题，你就明白了。


    说完了垂直受众，说说什么是“信息差”。前面说了，随着短视频发展，用户对质量要求越来越高。同样是真人出镜做科普，你和别人做的一样，还是那些老科普内容，很难脱颖而出。怎么办呢？深挖用户需求，寻找更大的信息差，你可以看看一位名叫露露黄了的博主，做了一个《揭秘化妆品工厂》的视频，就是深挖信息差的案例。当然，这一点要求就比较高了，你可以先从普通的文献知识科普做起，攒足了经验之后，再尝试深挖信息差。'
  merge: -1
  img_proc: true
- pgno: 525
  md: '最后，拍视频会有很多技巧，这里就不多说了。基础的技巧你去网上搜，一搜一大片。更大的视频趋势，我在以前的回答也说过了。短视频领域也会迎来专业影视人员带来的降维打击，这里不一定非要专业影视人员来做短视频，而是传统影视领域，那些节奏、剧本、场景把握的规律，会在短视频领域造成降维打击，形成真正的壁垒。所以我建议从事短视频的花友，上手之后，可以多看一下影视专业内容，至少要多看热门影视、综艺，总结拍摄规律，留心剧情好口碑好的视频博主，拆解、学习他们，不过这些是我个人对短视频的判断了，说白了，最终短视频的时长限制会逐渐模糊，变成更碎片化的综艺、电影电视，因为有从业者充分的竞争，短视频的质量和传统电视比只会高不会低，最终抢走传统电视的市场。


