- pgno: 247
  md: '这个模式的缺点在于有门槛，初始用户量增速较缓，容易卡在起量模块。优点在于搭配团队管理培训津贴，能够充分提升每个节点的主观能动性，穿透力足够。正因如此，每日一淘前期有大批人赚得盆满钵满也就不足为奇了。


