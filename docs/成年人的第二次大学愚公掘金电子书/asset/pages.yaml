  img_proc: true
- pgno: 443
  md: '算法，规则调整，带来的技术手段红利，可能会有短则一两个月，长则一年的窗口期，但这些信息迟早都会被大家获取，头部卖家更是优先获取了，那么最后还是落到了产品的竞争上。


    说到“产品为王”，大家也不要一味陷入到追求“质量最好”的产品上。平台上销量最好的产品，往往是针对目标人群，在质量，价格，评价上综合，满足甚至略高于客户期望的产品。比如一些客户就特别偏好性价比高的产品——觉得自己赚到了，高于心理预期。有时候，要改进5%的产品缺陷可能就要增加50%的成本。比5%的缺陷，可能客户更在意50%的价格。


    我们起初也是小白一个，没有任何供应链上的优势。所以开始制定的策略就是——模仿，竞争，超越，这样的路线。'
