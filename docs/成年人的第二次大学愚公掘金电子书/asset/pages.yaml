  img_proc: true
- pgno: 534
  md: '花爷您好！家人现在做环球捕手下面的斑马会员和小区乐两个平台，做了大概3-4个月不太好，我看主要的问题是几年没有上班了，同学，朋友的社交圈子很小，目前建的微信群也不到100人（部分还是亲友家人在里面充数的），在里面发广告和产品信息等基本没有互动的人，成交也很少，也想过去地推，在小区里面发广告传单（需要克服心理障碍）等，希望您能指导一下，对待两个平台可能方法还不同，1.如何认识并加入更多的潜在客户，发展更多的会员。2.如何维护好社群，提高群友的积极性和互动，提高下单率等等。


    非常感谢


    # 回答：


    首先，我之前说过，社交电商如果想做长久的生意，一定建立产品质量和价格还不错的情况下（大城市，质量必须稳定，价格不能比网购高；小城市，价格必须比线下店便宜）。如果没有这个前提，我下面说的引流、运营，都是无根之木，做不长久的。


    现在我们假设产品质量和价格还不错的基础成立，那么：'
  merge: -1
  img_proc: true
- pgno: 535
  md: '# ## 1.先找爆款引流


    你的提问里，一直在想去哪里拉人进群比较好。但是，好的引流不是拉人。举个例子，我们在地铁上，以前经常看到人拿个二维码说“我在创业能不能加个微信支持一下”，这么硬拉就算拉到人，有多大意义呢？好的引流，一定是你有爆款的引流产品，可以吸引人和你产生关系。


    一般社交电商以生鲜、零食为主，你试试芒果比线下店便宜30%，在亲朋好友和小区宣传一下试试，是你求人加你，还是大家主动想加你？当然，具体选什么产品，便宜多少，可以根据实际情况而定，只要满足受众广、和其他购买渠道相比有优惠就可以。


    # ## 2.日常产品的分类'
  merge: -1
  img_proc: true
- pgno: 536
  md: '同样的，日常的商品，也应该有分类，不能一股脑看到什么就发到群里或朋友圈里。日常的产品至少需要分成：促单款和利润款两类。促单款要求受众广、价格低，促进用户购买，利润款要求垂直刚需、利润高，保证你的盈利。每天，你都需要主推你的促单款（比如每晚9点@所有人、朋友圈/群限量秒杀等等），让用户养成每天看看有什么值得买的习惯。吸引用户眼球之后，再发一发利润款带动盈利。


    当然，这是对小白最简单的产品分类方法了。等你摸熟了用户心理，可以尝试更多的产品分类。


    # 3.运营活动


    运营活动的本质，其实都是让利给用户，带动购物气氛和订单量，然后再伺机关联销售利润款。传统的运营活动包括抽奖、秒杀、团购、限时优惠等等。在社群里怎么玩呢，比如抽奖，群里发个红包，手气最好的可以享受今日主推款的八折优惠；发朋友圈，点赞第18、28、38可以享受优惠等等。类似的玩法非常多，你可以打开淘宝，看看电商有哪些促销方式，然后结合微信的实际情况，拿前面说的促单款做活动。'
  merge: -1
  img_proc: true
- pgno: 537
  md: '# 4. 用户维护


    一般电商群里，最好的活跃方式就用户反馈晒单了，用户购买之后，一定要主动询问产品如何，主动送一些小优惠，鼓励用户在群里晒单。然后配几个小号，打打暖场活跃气氛，让大家对你的产品有信任感。


    另外，常购物的用户，应该重点维护。比如买够 xx 元，送小礼品；老用户购买帮她免个单之类的。短期来看可能不赚钱，但长期来看，有利于用户复购。社交电商的竞争还是很激烈的，大家产品都差不多，你就需要和用户培养感情才能产生壁垒。


    用户维护的另一个重要性在于，用户实实在在看到你生意做的不错，适当的时候，你可以问她愿不愿意做代理。我可以说，发展代理是唯一一个社交电商可以长期做大的方法。


    所以综合来看：


    +   第一次怎么吸引用户？——靠爆款引流

    平常怎么吸引用户？——靠促单款保证订单量和活跃度


    530'
  merge: -1
  img_proc: true
- pgno: 538
  md: '如何让用户看到你的爆款和促单款？——用抽奖、限时优惠、秒杀、晒单等活动，想尽办法找理由触达用户


    如何延长用户的生命周期？——靠用户分层，对核心用户的逐一维护，发展代理


    总的来说，这个话题还是蛮大的，哪怕我写了一千多字，也不一定能讲清。我建议你先根据我的建议，自己拟一个简单的小方案，再让我看一下是否有改进的空间。


