  md: '# # 到底什么是社交电商？


    提问：


    之前花友提问的问题，主要聊聊“到底什么是社交电商”。


    > “最近有家人做环球捕手，斑马会员以及最新出来的小区乐，都是类似社交电商，也有点拉会员的性质但实际上没有交费，但是里面的产品，性价比应该都是不错的，也是正规品牌的东西，很多产品在京东，天猫都有卖，请问这个平台有发展吗？
    如果值得做，需要如何去拓展人脉？特别是人脉和圈子比较少的人去做。目前主要还是一些比较好的亲戚和朋友在支持买一些产品，估计被微商搞怕了，现在很多人还是比较难接受这种模式。谢谢”


    回答：'
  merge: -1
  img_proc: true
- pgno: 513
  md: '首先需要明确，社交电商和社区团购，本质上其实是两个东西。


    先讲社区团购，基本原理就是每个小区有一个团长，组织大家拼团，然后平台统一给这个小区发货，简单来说就是老姐妹们组团去批发市场买菜的线上版本。它和社交电商最大的区别是啥呢？注意，社区团购的每一个用户，都是伴随着购物交易的。这个好理解吧，我跟着团长买了点大蒜大葱啥的，我就是社区团购的用户了，如果我不买，那我就不是，顶多看看热闹。


    讲到这，我们不难理解，市面上这么多社区团购，竞争到最后谁能赢？就是东西便宜、质量好的能赢，专业点讲，供应链能强的能赢。你价格高了、质量不稳定了，社区团购的宝妈们大妈们，一个个比猴精，扭头就去其他社区团购平台参团了。


    那社交电商是什么呢？其实一开始，拼多多等依赖分享、助力、砍价的电商模式，都叫做社交电商。后来，好多会员制的平台（比如每日一淘，还有你说的环球捕手）都喜欢管自己叫社交电商，这个词就被弄混了。


    ![](img/5688f8284c7103ed77046cfddaf3da13_513_0.png)'
  merge: -1
  img_proc: true
- pgno: 514
  md: '所以，现在我一般把社交电商特指为“那些必须交会员费才能买东西的电商模式”。凭借着会员费这个模式，社交电商前期基本就是一个拉一个，疯狂拉人头，用户量暴涨。注意，前面咱们说，社区团购的每一个用户，都是伴随着购物交易的，那社交电商的用户，就不是伴随着购物交易的，因为大家花钱买的是虚拟的会员资格（虽然也会送一些会员奖品）。这个模式其实就是传销的擦边球了，你可以不喜欢这个模式，但这个模式就是可以快速起量。等到量起来了，平台就把会员费制度给主动废除掉（不然会被zf盯上），这时候不能拉人头赚钱了，想要长期做，靠的还是平台的供应链能力。


    所以，说白了，如果你想做社交电商，你得有很多的人脉资源和小弟，这样前期你可以靠下线大赚一笔（事实上社交电商平台起盘的时候，会主动找到有下线资源的人合作），如果你没有这个资源，还是不要掺和了。


    如果你想要长期做，那你就去看哪家平台的供应链强，哪家的货品全、价格低、质量稳定。有供应链做后盾，你是不愁卖货的，先从亲戚朋友做起，东西好大家自然乐意接受，跟微商的三无产品完全不是一个概念。'
