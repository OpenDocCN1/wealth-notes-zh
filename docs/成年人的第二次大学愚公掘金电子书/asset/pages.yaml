- pgno: 793
  md: '比如你做女装微商带货的，那就去研究别人的女装怎么做的，同类型的看十几个，看哪个风格适合你的性格，而不是谁火就选谁。如果你还没有业务，那就找贴合你性格、能力优势的方向努力。你也不知道自己的性格优势在哪？很简单，随机看热门的短视频，你觉得和哪个博主能产生共鸣、觉得这个视频我也能做，那你就可以去做，先从模仿开始。


