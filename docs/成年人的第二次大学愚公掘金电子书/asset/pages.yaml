  md: '# 微商要卖货，第一步先做好什么？——先想好微商最重要是卖什么，卖货？不是！


    提问：


    花友提问：“我记得刚加您那会我跟您说过我在做微商。首先，我做的产品不是三无产品，索性跟您说了，一个做瘦身减脂内调的产品，效果好，但客单价也不便宜，一个套餐3564。我想问问您对于这个产品是怎么看的？如果一个微商小白且自身资源又不是太好，可以从哪些方面来努力呢？比如引流、推广。”


    回答：'
  merge: -1
  img_proc: true
- pgno: 545
  md: '产品怎么看，我就不聊了，因为做品牌代理型的微商，想要做的好，产品质量不是最重要的（当然也很重要就是了），最重要的是两个字：


    # 信仰。


    怎么听着这么玄乎呢？还真不是。因为比质量，比性价比，很多微商跟大牌真的没法比，好多面膜护肤品，卖的跟大牌一样贵，怎么卖的？大多有一套独特的理论，这套理论自圆其说，能让消费者相信，信它比其他的方法都有效，而卖的产品，只是这套理论的一部分。


    所以你看，一个微商品牌，如果不是靠拉人头，而是实实在在靠卖货赚钱的，那这个品牌第一个产品卖得好，第二款产品一定也卖的不差，因为都是一个理论体系下的，用户都愿意买单。


    再拔高一个高度看，为什么很多品牌，都要说自己是中医药、纯天然呢？因为这个理论，群众有认知基础，而且中医药体系包容性特别强，各种派系，正着说反着说，只要你能说圆了加上产品效果还可以，大家就愿意信呗。'
  merge: -1
  img_proc: true
- pgno: 546
  md: '看到这你应该明白了，小白没资源没经验，要做的第一件事，就是要把自己培养成这套产品理论的专家。减肥有很多理论，什么轻断食、中医针灸等等，不管你是哪种，你都要做好理论专家的角色，树立权威性，用户不仅问不倒你，而且听完很信服。


    有了这个能力，加上如果产品效果确实可以，首先你的身边有减肥需求的人就会主动找你，然后再做一些引流裂变的活动，做一个微商新手入门，是不愁的。


    最后我要对大家说下，很多人瞧不起微商。确实，不少微商喜欢打鸡血拉人头，但咱们愚公社群的花友，我还是希望大家多研究研究别人为什么能经久不衰，而是随着时代，微商模式一直在进化。做的好的微商，是很值得我们取其精华去其糟粕的，别骂两句就完了，跳出鄙视链，才是大境界。


