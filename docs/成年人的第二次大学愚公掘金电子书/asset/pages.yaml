    如果有，且你有一定的演讲能力，做传统企业主的教育培训是个非常好的方向，国内35岁以上的企业主有很多受教育水平很一般，靠着行业红利起家，现在公司发展遇到瓶颈，很愿意花钱学习，而且重点是，他们有钱。


    你可以搜一下“苏引华总裁思维课”，他的线下课每月一次，几千块的课一次有好几千人报名，应该是我知道的线下培训做的最大的。'
