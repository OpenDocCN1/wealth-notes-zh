  md: '# 有电商运营经验，做 的事很杂，应该如何做职 位规划？


    提问：


    花爷你好，目前刚离职，之前在一家小公司做电商运营 是基于微信上的商城，除了平时的产品更新，活动和文 案推广；美工，客服，订单处理，下线去选货也都要自 己做，有点心累。


    因为之前也都是自己摸索的去做运营工作，也就半年时 间，现在静下来，还是想去从事电商运营的工作，可是 对于这个职业规划完全没有理出什么头绪，在近两年能 达到一个什么样的层面完全没有预期，有点慌也有点乱'
  merge: -1
  img_proc: true
- pgno: 635
  md: '希望花爷能在电商运营这一块，能给些职业规划上的指导或建议回答：


    # **回答：**


    # **1. 先试着把公司的业务做出起名：**


    你对公司整条业务线都有接触，这非常棒，一个有商业头脑的人需要有全局的把控能力。


    现在，我们假设，以后你会自己创业做电商生意，或者加入其他公司做一个电商部门的负责人，最重要的是什么？是你有过把电商业务做成功的经验。


    所以，你现在公司，是你完美的试错实验田，不要在乎工作在不不在你的职责范围内，不要在乎同事是不是傻 x，把自己当做公司老板，当做电商负责人，努力带动大家把业绩做上去，推动整个团队。


    很多人把工作当成负担，其实反过来想，老板花钱请你，你还能用老板的经费锻炼自己，何乐而不为呢？


    # **2. 先从小成绩做起：**'
  merge: -1
  img_proc: true
- pgno: 636
  md: '其实你算比较幸运的。很多大公司，员工就是螺丝钉，想要像1里讲的一样带领团队，难度非常大。


    而从你接触很多业务来看，你们公司工作还算比较自由，有这个基础。


    你可能要问，我又不是老板钦定的负责人，大家不听我的怎么办？


    很正常，职位不重要，重点是让大家信服你。


    试想，就算以后你自己是老板，但大家不信服你，交代的事情都不好好做，你的命令又有什么用呢？


    而建立信服的关键，就是你先从一点点的小成绩做起，让大家觉得你靠谱。同时多思考别人的利益在哪里，把团队所有人的利益捆绑在一起，才能把团队带好。


    说白了，职业技能是很容易到天花板的，顶多只能算高级技工。你只有能带着团队干出成绩，才有资格当管理层或者自己创业。'
