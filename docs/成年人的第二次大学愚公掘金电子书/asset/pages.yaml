    * Fan Pages


    ![](img/5688f8284c7103ed77046cfddaf3da13_135_0.png)


    Target Graph will help you to find potential audiences to sell your products.
    There are 14 interest groups in which you can target a specific audience and test
    the products you want.


    You can choose one or more groups depending on your budget and start your campaign(s).
    If your product is suitable for all groups and you have enough budget, then you
    can test the product in each group and find multiple audiences who are interested
    in your product.


    Example: You have a budget of $30/day and you want to test a yoga mat. You can
    target that you think can become a winning product. In this case, the majority
    of people will start standard campaigns with typical interests like - "Yoga",
    "Yoga Mat", "Yoga Teacher", "Yoga Instructor", "Yogaworks" and spend all the budget
    on this type of ad(s). In most cases, this method can be inefficient, and the
    target audience may not include potential buyers and of course, this will let
    you lose more money.


    With the help of Target Graph, you can reach people who are most likely to become
    your customer. You can spend $30/day in a more effective way by choosing interest
    groups for your campaign. Let''s imagine that you will use 3 groups: Magazines,
    Brands and Types (Categories). In this case, you need to create 1 campaign with
    3 different ad sets targeting different interest groups with $10/day budget (as
    shown below).


