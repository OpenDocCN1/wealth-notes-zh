  md: '![](img/5688f8284c7103ed77046cfddaf3da13_34_0.png)


    影视站的推广大家可能都见到过，就是朋友圈、群里面发的---热门电影+链接，点击快速观看的那种形式。


    # 资源站


    影视站里面用到的资源，是从哪里来的呢？ 答案是「资源站」。'
