  md: '# 私域流量最近很火，花爷知道很多团队早就在实践了，讲实操中维护用户的小技巧


    最近私域流量的概念很火，再往前，又叫做流量池。抛开炒概念、烧钱获客的东西，讲几点实用的小技巧，很多基于微信的小团队都在用了。


    很多商家把用户引流到微信，比如淘宝卖家、自媒体等等，引流不是问题，问题是大家都是草根起家，引流之后不知道要干嘛啊。


    这里就要引入一个“用户周期”的概念。'
  merge: -1
  img_proc: true
- pgno: 1001
  md: '这个概念早期在app运营时代很常见。一个用户，从刚认识你，到了解你，到对你付费，到主动为你做宣传，到最后平稳的和你互动，用户的情绪和行为是逐层递进的。


    如果还有花友不明白，你就类比成谈恋爱，从认识到热恋到老夫老妻，需要一个时间周期。而运营要做的工作，就像恋爱里主动追求的那个男生，把用户推向下一个阶段。


    不少在微信里耕耘的团队，已经有一套流水线一般的运营流程，为了方便理解我们拿做投资课程的团队举例，讲一些常见的小技巧，：


    # 1.标签体系


    按照用户周期，可以简单分成“建立信任、付费、维护”三个类型。要学会按类型运营用户，而不是一锅端。'
  merge: -1
  img_proc: true
- pgno: 1002
  md: '比如做投资的付费课程，用户在知乎看了引流文章加微信，这时候团队里的客服就得跟用户聊，看他的资产、投资诉求、对投资的了解程度，根据这些信息，给他打上标签，比如根据投资经验，可以分成小白、入门、多年经验，比如根据投资兴趣可以分成美股、A股、基金等等。


    建立标签体系是一个长期的、不断完善的过程。


    # 2.加速器


    对打了不同标签的用户，要努力推进用户进入下一阶段，刚认识的要加速建立信任，建立信任的要加速付费。


    加速的手段，我喜欢称之为加速器，一般常见的加速手段包括：根据用户属性发对应的投资学习资料、隔几天发一些投资小案例、新用户七天限时优惠等等。


    花爷自己的社群转化比较佛系，会给没付费的用户发一个星球的精华目录，你感兴趣就付费，不感兴趣就算了。付费加入星球之后，小助手会有一套引导到流程。'
