- pgno: 150
  md: '今天晚上我们接着昨晚的拼多多店群分享，从店群的概念开始说吧。


    # 交易流程如下：


    +   1.客户在我们店铺下单；


    +   2.我们去上家拍单，发给客户；


    +   3.客户收到货，确认收款；


    +   4.完成交易；


    # 退货&售后流程如下：


    +   1.客户申请退款，或售后；


    +   2.我们同时向上家发起售后；


    +   3.给客户上家退货地址；


    +   4.上家收到退货，退款我们，我们再退给客户；


    店群的本质就是：代购'
  merge: -1
  img_proc: true
- pgno: 151
  md: '店群的**特性**就是：**碰概率**


    靠大量铺货上新带来新品新店权重扶持，拿到“展现”，进而获取到一定量的访客和成交。**店群的门槛**一般分为：政策环境（平台、国家）、资质证明、资金实力、信息更新、开店数量、培训，这几大块。


    # 平台的选择和区别：


    淘宝店：一人一店，押金1000，竞争激烈，规则完善，处罚力度大；


    天猫店：企业开店，押金15万，服务费6万一年，5%扣点，处罚力度大；


    京东店：企业开店，押金3万起，服务费1.2万一年，5%扣点，处罚力度大；


    唯品会：企业开店，主打品牌招商，5%扣点，女性用户偏多；


    拼多多：个人企业均可，无限开店，押金1000-2000；'
