- pgno: 702
  md: '# # 非上市公司没有财报，怎么分析它们的商业模式？花爷以长投和瑞幸举例


    ## 提问:


    花爷您好:


    求教如何分析一个非上市公司？


    +   1. 有哪些需要分析的要素

    2. 如何分析这些要素

    3. 其它...'
  merge: -1
  img_proc: true
- pgno: 703
  md: '# 回答:


    公司有没有上市，无非是财报有没有公开，利用财报的详细数据，可以估算它的估值。没上市的话，虽然估值不一定准了，但只要有同行业有对标企业，其实还是能考虑它的商业模式能不能跑通。


    我一般看两个方面:


    # **1.内部链条分析**


    所谓内部链条，就是从推广获客，到转化付费，再到复购留存。


    这几个重要环节之间的效率，我会根据经验做一个估算，比如长投推软文获客，那我就找到一篇软文，看看软文阅读量，一般是一个阅读一块钱（这里需要你对一些业内的信息有认知），假设今天这篇软文是1万块，那我就不停进入软文末尾推广的训练营，估算一下有多少人报名了小白训练营，比如有100人，那小白训练营的获客成本就是100元/人。'
  merge: -1
  img_proc: true
- pgno: 704
  md: '接下来，在群里潜伏，发现这100人里经过几十天的小白训练营，有20人购买了进阶课程，进阶课程是1000元/人。


    到这里发现，1万元的推广成本，带来2万元的营收，当然，还要去掉一些员工的人力成本，但还是能推算出，这个模式是能盈利的。


    然后我们再看，这个模式是能够复制的，微信可以找很多号去做推广，那说明这个模式非常好。再根据长投官方公布的学员量，大概能推算出营收和利润。


    当然，现实情况是，长投的推广在后期是不赚钱的，可能每获得一个学院，长投不仅不赚钱，还要亏20元。但我们从长期来看，这个学员很可能后续还会消费，行业里一个理财粉丝的成本一般高达几百元，亏20元收一个学员仍然是门好生意。


    关于长投的详细分析可以看这里: https://t.zsxq.com/2RjY37i


    # 2.外部链条'
  merge: -1
  img_proc: true
- pgno: 705
  md: '这点很多人会忽略，你要知道公司除了内部，还需要跟外部竞争。我们得关心整个市场的利益分配，比如瑞幸咖啡，有一种观点是，瑞幸现在卖10块，星巴克卖30块，瑞幸涨价到20块仍然很有竞争力，仍然能保持现在的销量。


    这是典型的忽略外部链条，当瑞幸涨价到20元，就不是在和星巴克竞争，而是在和整个茶饮行业竞争。


    这里我也详细分析过瑞幸了，看这里：https://t.zsxq.com/Rzzjmern


    最后还是强调我分析商业的原则：


    如果我们把所有社会活动都理解成一种交易，那么


    **1. 获利原则：** 交易中每一方的行动，都期望能够获利（包括金钱、情感、生理等多方面的获利期望）


    **2. 自愿交易原则：** 当交易有多方参与时，只有每一方的获利期望都得到满足，交易才在多方自愿下完成


    所有违背以上两个原则的地方，都值得深入挖掘。'
  merge: -1
  img_proc: true
