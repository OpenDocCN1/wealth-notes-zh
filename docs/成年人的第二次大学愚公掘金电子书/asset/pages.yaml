  md: '如果不谈策划的话，课程的运营相对简单，我们每个课程都有课前、课中、课后要做的流程表格，课程助理会根据课程性质不同进行准备和跟进。以插花课为例，整个流程大致为：花课招生微信制作和各个渠道推送-报名学员统计和收费-接老师购买花材-花材处理和分发-花课教室布置（剪刀、箭山、花器、台布、白板、茶和茶杯）-学员插花时的课堂摄影记录-学员插花作品记录-帮学员打包花材-收拾花课教室-送老师-将花课照片归类整理并挑选精品发朋友圈，不同的课程有不同的要求，但也大同小异。


    # ## (2) 活动策划与运营：


