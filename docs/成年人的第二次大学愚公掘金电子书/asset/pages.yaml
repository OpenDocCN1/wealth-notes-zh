  md: "# 花友手上 有滴滴企业版资源, 打滴滴有折扣, 如何推广? 讲讲正向、逆向、偏门三个方向的思路\n\n提问: \n\n花爷, 第一次提问, 也是一个商业机会。\n\
    \n【背景】本人信息技术公司, 可提供运营商上网宽带, 尤其是跨境国际宽带。"
  merge: -1
  img_proc: true
- pgno: 708
  md: '【商机】机缘巧合跟滴滴合作。现有企业版业务，可以提供用车方便，并简化管理，降低用车和管理成本。我可以做代理，推广材料可以见附件。多方共赢：


    +   1. 企业：比养车和租车费用便宜，规范管理。


    +   2. 企业员工：企业统一支付，不用自垫资金。统一开票，报账方便。尤其是派驻外地的。


    +   3. 滴滴：拓展了业务，增加了收入。


    +   4. 我：获得代理分成，有额外收入。


    【问题：如何拓展】本人偏技术方面，并没有太多的资源，对于销售及业务拓展不擅长，所以来提问，请花爷给点建议。有意对接的花友也可联系。


