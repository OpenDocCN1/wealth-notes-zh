  md: '奥克斯凭什么这几年反超格力成了行业第二？因为奥克斯虽然只有格力70%的质量，但只要格力50%的价格，在下沉市场，低价的奥克斯还是占了上风————你 看，花爷说过很多次，很多行业里的龙头都不是质量最
