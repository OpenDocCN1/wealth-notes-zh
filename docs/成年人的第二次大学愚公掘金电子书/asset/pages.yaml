  md: '# 四线城市线下裂变数千位家长用户，裂变在下沉市场仍然玩得转


    花友在群里提到的例子，用成本几块钱的玩具、儿童用品做裂变活动，四线城市，几千人参与。


    对传统教育机构、儿童摄影来说，这个参与量以前不知道要发多少传单才能做到。


