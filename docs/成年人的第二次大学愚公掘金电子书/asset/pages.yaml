  md: '# ## 《如何从生活中发现100个商机》系列第二部分：如何从补贴中发现商机


    《如何从生活中发现100个小商机》系列，继续更新第二部分。


    昨天讲到“如何从广告中找商机”，错过的点连接去补课：https://t.zsxq.com/bmieieY


    **今天讲第二部分：如何从补贴中发现商机。**


    什么是补贴？就是企业、平台、国家等等，为了促进某个市场的发展，投入的金钱激励。'
  merge: -1
  img_proc: true
- pgno: 915
  md: '你要明白，补贴就意味着，你可以以远低于市场价的价格，获得超值的商品，价差就是利润。


    所以，当你发现某项大型补贴政策正在施行时，就可以留个心眼：有没有机会从补贴中获利？


    最基础的补贴获利行为，薅羊毛的性质很重，最典型的就是支付宝的线下支付奖励金活动。


    当初支付宝为了推广线下支付，狂撒奖励金。奖励金可以在线下付款时直接抵扣，而你邀请自己的好友使用奖励金，可以获得等额的奖励。比如，好友线下支付用奖励金抵扣了10元，你就同样获得10元现金奖励。


    这就意味着，只要你邀请足够多的人领钱，就能大量赚到补贴，于是，各方神魔各显神通：


    +   有的在超市门口，一个一个教老头老太太薅羊毛；

    有的装成淘宝官方，群发短信，让用户领补贴，其实是自己的邀请链接；

    有的到村口，让老人们下载支付宝后一顿操作后，免费送大米油盐大白菜……'
  merge: -1
  img_proc: true
- pgno: 916
  md: '但这种活动，薅羊毛的味道太浓，还有一些更高级的玩法。


    比如，前几年国家对新能源汽车进行补贴，有企业大批购买新能源汽车，算上补贴后购车成本极低，然后再把这些车租给送快递的、做物流的、跑网约车的……要不了多久就能回本，后期利润极高。


    再比如，国外亚马逊、奥特莱斯做活动打折时，渠道商批量低价购入囤货，等运到了中国，哪怕折扣销售仍然利润率极高……


    拿最近的拼多多举例，你知道吗？很多拼多多补贴的低价商品，被人买完之后，挂到淘宝京东再原价销售……


    如此这般，类似的商机有很多。


    如果你想不明白后面的商业模式，没关系，以后只要看到补贴类的政策，无论是外国的、国内的还是地方区域性的，在星球的“金花奖”活动里提问，花爷为你讲讲。


    更多内容，关注星球里这个系列的更新，金花奖活动，预计八月开启。'
