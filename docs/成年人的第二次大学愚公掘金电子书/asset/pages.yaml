  md: '在分享之前呢，先给先做一个简单的自我介绍，我是从14年开始，那时候还在大学，算是开始搞互联网，从那时候搞刷单，到后来开淘宝店。到15年的时候开始搞微商，因为（当时）在淘宝电商卖那个高仿，那时候开淘宝店卖高仿查的没那么严，被封掉之后就开始转到微信里面，算是开始做微商。因为一直都是在大学里，算是半做半不做，就是一边玩儿一边做，但是我那时候就充分感受到，就是在网上，这个空手套白狼，赚钱是非常容易的，因为我包括做微商，开淘宝店之后，都是做的无货源的模式，都是找别人代发的。


