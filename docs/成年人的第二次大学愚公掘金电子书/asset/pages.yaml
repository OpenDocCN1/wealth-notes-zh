    乐尚：佣金肯定是在淘客的账上，因为是他们拿我们的单子去推广的嘛，我们赚的是服务费，这个的话有两个方式，一般情况商家会转到支付宝上面。（商家给到他们一个专属码。从这个码进来成交的就分钱）。


