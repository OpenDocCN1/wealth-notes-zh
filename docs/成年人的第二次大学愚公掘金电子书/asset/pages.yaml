- pgno: 907
  md: '4. 亲子沙龙、财商培训啥的，大概率还是你想的太多了，不要觉得什么流行就往里装。如果真要试，先从现有学员里，发起一次活动试一试，看看有没有响应，不要盲目转型。


    其实你看你的问题，写了很多，但大多数都是问题，你想这样，你想那样，问题一二三四五，而关于你自己具体的情况介绍呢？只有开头介绍了一句做尤克里里培训而已。


    你在考虑未来发展的时候，也是一样，别总有那么多想法，不如多花点时间想想，你有什么，你的经历沉淀下来什么经验，如果只能选一件事去做，你觉得应该做什么。


    很多路都是能走通的，但你能走通的，一定是符合你自身情况的那条路。


