  md: '迷茫的原由：小北老师在他公众号上建议我们多看点落地的文章，就是具有可行性的文章（比如知乎上的哪些行业比较赚钱之类的文章），他的意思是大家都是成年人了，一些做人的规则或者常识都应该懂了。同时，在你自己还在温饱线上挣扎的时候，就不要关注那些宏观上的逻辑思维之类的。


