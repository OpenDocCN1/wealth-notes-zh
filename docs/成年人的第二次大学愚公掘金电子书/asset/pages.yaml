- pgno: 216
  md: '首先说分销玩法，由于在线教育边际成本很低，所以属于这个行业非常适合的方式。核心就在于把获客成本补贴给用户，给到用户cps分成。分销效果极度依赖对于分销员的管理和培训，属于微商体系能玩的炉火纯青的操作手法。在这个方面，宝宝玩英语可以说是吃到了一超一大口蛋糕，有兴趣的同学可以参考。


    然后是自建硬通货的价值体系，常见的有积分体系、课时卡、时长卡这类，核心在于在自己的产品中抽象出来硬通的价值，低成本给用户建立足够的追求。比较典型的有混沌大学的研值体系、vipkid的课时、微信读书的无限读书卡，有兴趣的同学同样自行体验。


    另一个大类情感驱动型，在火车上就也不太展开了…主要是打感情牌，见效不一定那么快，但胜在长期有效，核心出发点在于可见的反馈和情感联系。学习打卡属于其中很具有代表性的场景，实际操作中也有非常多的玩法。主攻教育场景打卡玩法的鲸打卡目前已经拿了数千万融资，且自身就是To
    B业务，非常赚钱。另一家做To C业务的小打卡，一样坐拥千万用户，很值得体验。


    接着是产生信任和成交转化，今天主要是讲一下这两个阶段核心要做什么事情，提供点能搜到的案例来参考。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '在产生信任的阶段，主要是给用户提供超预期的服务（如果是k12，就是针对家长用户）。比如当用户低成本进入到你的体系，惊喜地发现你能提供几乎所有他想要的资讯和资料，接着发现每个重要的学习阶段都有"专人"为你服务，为你"量身打造"学习建议，每天洗脑催着你前进…这一块很可以体验的是长投学堂、熊猫小课、核桃编程，随便报个试听课，看看他们的追踪服务吧~


    最后是成交转化环节，其实只要信任产生的足够好，已经完全 是临门一脚。这个环节主要在于烘托氛围，给用户造成"占便宜"的感觉（注意，一定不能是便宜，不要让用户觉得你掉价，必须是给到占便宜的感觉），烘托抢购氛围。常见的操作方式有限时抢、限量抢、抽奖、答题拿优惠券等等…


    ok，今天先是这些内容，也是准备大半天…这会儿还在火车上颠簸，网估计也时好时坏～主要是为盆友们提供基础知识和思路，要有兴趣涉及具体实操的可以再单聊哈。'
