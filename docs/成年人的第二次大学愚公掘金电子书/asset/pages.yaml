- pgno: 291
  md: '这是从赚取 YouTube 平台广告收益这个角度来说的.如果你的内容创作能力足够出色,受到金主爸爸的青睐,那么变现模式又增加了三种: CPM ,固定费用,销售分成.


    CPM ,就是根据影片的观看量的数据,给予相应的报酬.也就是说,给你的报酬,是和影片的观看数量直接挂钩的,观看次数多赚取的就多,观看次数少,赚取的就少.


    固定费用,这个就是根据金主爸爸的要求,就能稳定赚取费用的一种方式.比如我们现在看到的微信投放广告,就是我推一篇软文,金主爸爸给多少钱,至于转化率怎么样,效果怎么样,我是不考虑的.


    销售分成,这个很容易理解,就是根据销售量,给你收益.这种玩法在国内也是比较常见的.


    其中, CPM 是绝大多数腰部 + 长尾网红们的常规商业合作结算方式.


    这个时候,问题就来了,采用 CPM 的方式的话,我报价多少合适?这张图片或许可以给你一些参考:'
