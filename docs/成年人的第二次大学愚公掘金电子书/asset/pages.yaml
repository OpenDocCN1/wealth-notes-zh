  md: '对于绝大多数普通人而言，如果想要突破阶级固化，以上两个K12领域的小故事作为参考角度~关于线上线下教育问题，我做的不是产品研发端，所以我从老师的角度出发简单阐述，不到位的地方请大家多多担待。


    # Q&A:


    1. VIPkid之类的在线教育培训，对线下培训行业在生源、师资上有没有影响？


    Angela： 影响是肯定的，不过，在线教育培训对于三线城市的影响力远远低于一二线城市。三线城市的用户在应试高压，升学率要求下依然会倾向于选择传统线下培训，这样对于教学效果更有保障，师资主体也会在线下机构间流动。三线城市依然是线下机构占主体，部分少儿机构会配套线上教学体系，也仅仅是作为辅助。课堂的实时体验感是无法被线上课取代，特别是学前少儿阶段，老师对学生的关怀、眼神和拥抱，现实会比虚拟情境要温暖。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '2. 在二三线城市，线下培训学校大多是加盟的，开一家培训辅导有哪些成本？盈利状况怎么样？


    Angela：


    +   成本一：加盟费


    +   成本二：选址，合适的选址会极大带动生源，比如，学校，小区周边；在人流量高的商场也是较好选择，但是租金成本会更高昂。


    +   成本三：宣传推广，为了争夺更多的生源，教育机构不得不加大宣传成本的投资力度，从最开始的发传单、地推，商场推广活动，培训机构内部竞赛类活动，免费线下讲座，到各渠道广告投放。


    +   成本四：人力成本涵盖销售部，市场部，人力资源部，教学部，后勤保障部的工资核算，日常，年终福利发放。


    +   成本五：校区各项物资，大小型教学用具采买'
  merge: -1
  img_proc: true
- pgno: 91
  md: '成本六：去年三月起，国家严查培训机构办学资格，包括在家在小区办学，无证经营的机构，培训机构去政府办证打通各个环节耗时耗力耗财。


    以及面对互联网教育的冲击，还有潜在的学员流失概率成本。


    盈利状况参差不齐，特别是在去年严查之后，扬州有200多家培训机构被查封或要求整改，培训机构的情况不容乐观，风头过后，死灰复燃也是有的。三线城市消息相对闭塞，家长对于机构不够了解，往往倾向于靠熟人，其他家长的口碑推荐。


    现阶段能够持续盈利的，都是证件齐全，合法操作，师资相对过硬，教学体系完善，服务相对较好的机构。如果教学质量过硬，还是很有前景的。'
