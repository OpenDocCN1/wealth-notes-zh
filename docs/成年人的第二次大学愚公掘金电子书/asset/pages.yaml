- pgno: 675
  md: '# 想在二三线城市开培训机构，应该做哪些调研准备？


    提问：


    花爷，您好！我现在有中年危机，不想打工了，想转行开个教育培训机构！我这里是二三线城市的二三线小镇，这种培训机构也不少，要怎么样去调查开设什么种类的培训课程比较适合我们小镇的需求呢？还有加盟一个比较成熟的教育体系好还是自己创建好呢？（打算和朋友合伙一起做，但我们都没有这方面的经验和资源）


    回答：


    先说怎么调研：'
  merge: -1
  img_proc: true
- pgno: 676
  md: '# 1.看同行


    教育培训什么最关键，招生。


    小城市，招生无外乎三招：广告、裂变、教育资源。


    广告：对宣传能力要求比较高，靠投钱宣传招生。越是能一直投钱做广告的，越要留意，因为这说明他们一直在赚钱。


    裂变：对活动能力要求比较高，靠做裂变活动先吸引家长粉丝，然后在微信里做转化。案例的话，不妨参考这一条（https://t.zsxq.com/jeuVbQf）。多说一句，传统的靠口碑经营多年越做越大，其实也是一种裂变，只不过裂变速度比较慢。


    教育资源：对人脉资源要求比较高，培训学校里入驻了很多老师，自带学生资源，或者教育层面的领导给培训学校带学生。你懂的，不多说了。


    以上三种，你需要做到：每一种都去研究、体验，把每个环节都搞清楚，了解每个模式的要求你是否符合。'
  merge: -1
  img_proc: true
- pgno: 677
  md: '# 2.看内部


    上面三种模式，可能你通过自己努力，能大概摸清楚套路，但一些执行的细节，却不一定能了解。


    而我们知道，做生意，大方向的模式是重要的一方面，细节也是重要的一方面。比如你采用投广告的策略，投哪家？多少钱合适？比如你请大学生来做辅导老师，怎么管理？怎么结工资？


    都是问题。


    小城市的公司，内部往往没有那么严密，而小城市的人脉网络又比较密集，两个人总能通过“我小姨的朋友的儿子的爸爸”这种人脉关系牵上头。


    所以，利用这种优势，找到你的目标企业的内部工作人员认识，聊聊，并不难。比如老师的流动性很高（特别是大学生当辅导老师），轻松突破一个老师搞好关系，就能呼噜一大片内部细节。


    # 3.看用户'
  merge: -1
  img_proc: true
- pgno: 678
  md: '用户，也就是家长。


    其实对个人小团队创业，花爷一直建议，紧跟你领域里成功的企业，不要太在意用户的意见。特别是新手，用户的声音太杂，很容易被搞乱阵脚。


    那看用户的意义在哪？在于你要保持一个始终和用户、家长们在一起的状态，不一定啥都要听用户的，但对用户要有一个感知，知道他们关心什么、热点在哪。


    呆的时间长了，你自然就了解了这个市场。


    比如你去搞裂变，当下用什么奖品当诱饵，可以既节省成本又有好效果？你得了解本市的家长们才知道。


    当然，以上三点，只是策略，策略只体现在推演模拟的阶段，过了策略这一关，那就得看执行，也就来到你的第二个问题，自营还是加盟？


    正常来说，如果你和合伙人都没有任何经验，并且资金充足，那花爷绝对推荐加盟，可以少走很多坑。'
  merge: -1
  img_proc: true
- pgno: 679
  md: '但注意，即使加盟，上面提到的三个策略，你仍然要不折不扣的执行，千万不要什么都指望加盟品牌——你得知道，加盟品牌的屁股和你不一定在一起，为了自己的更大的利益，他们是可能抛弃你的利益的。


    所以，自己做个明白人，关键时候不怕忽悠。


    如果你们想自营，也不是不可以。但千万不要一把梭哈，而是小步快跑，从小做大。


    这种情况下，如果你本身没有教育资源，那走裂变这条路可能容错率更大一些，先搭一个小班，然后做活动把家长加到微信，包装、宣传、报名一条龙。


    一个人要经过多少失败，才能成为一个企业家？


    不知道，但我们知道，失败和吃亏在所难免，所以才要小步快跑，先用小投入尝试，有效果了，再一点点扩大规模。


    对了群里有多年教育培训的花友，我记得@Albert 就是，其他花友也可以留微信交流。'
  merge: -1
  img_proc: true
