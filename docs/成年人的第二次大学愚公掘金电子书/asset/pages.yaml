- pgno: 462
  md: '从走势图中可以看出，七月份以来，华宝油气价格呈现由高到低，到高再到低的走势。按照既定的网格交易，2019.7.9日与2019.7.11日成功交易一次，获利49元；但是在2019.7.1——2019.7.2——2019.7.11的三次交易中，均处于本月的高点买入，2019.7.17的则处于低点买入。另外，由于资金高位被套住，导致近期的网格无法执行（最近华宝油气价格持续下跌）。因此，一定要做好压力测试与资金规划！


    # 六、小结


    优点：最新的表格在实际操作过程中，交易次数较少，资金压力合适，符合个人的交易习惯，因此是其优点。


    缺点：某一价格(0.473元)的交易次数达到两次，可以看出在市场处于上涨阶段，还是难以克服内心的贪念，两次出手交易，导致处于短期的较高位，后续低价位时资金无法解套。


    并且，随着对网格交易的熟悉，会产生一种自以为是的的良好感觉，贪念被无限放大。场内交易看到0.001元价格的变化，心态会发生很大的变化。因此，网格交易最大的难点就是控制自己。'
  merge: -1
  img_proc: true
- pgno: 463
  md: '# 七、小结与反思


    +   1. 不去预测。

    2. 严格执行计划。

    3. 减少交易次数，做好资金分配。

    4. 控制自己。


    最后，用闲钱投资，不要加杠杆，不要配资，一定要用闲钱去投资。


