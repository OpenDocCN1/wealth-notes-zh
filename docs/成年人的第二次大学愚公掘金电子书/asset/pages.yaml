  md: '**流量*转化率*客单价=销售额**，这个公式应该大家都知道。


    但是就像现在电商行业的现状一样，实际上目前的电商公司运作差异来自于精细化运营，所以我们需要对这个公式进行数据拆分。


    拆分后：（**展现量*点击率**）*（**静默转化率+询单转化率**）***产品线客单价=销售额。


    好像看起来细化数据也不多，但是这里面的变量就不一样了。并且你对于整个数据的思考逻辑也会发生非常多的变化，今天我们应该都在强调数据的重要性，但是数据为什么重要，不知道有多少人
    going 去思考这个问题。我个人理解过来，数据的重要性是因为每个数据背后所代表的底层因素。


