  md: '# 如果你在上班，一定要

    学会反向“压榨”公司


    提问：


    最近有不少花友咨询了职场突破、转行的问题，因为是私聊的，都比较散，所以这里再给大家划一个重点：


    回答：


    如果你还在上班，一定要学会反向“压榨”公司。


    抱着给多少钱干多少事的心态，你永远就只能拿这些钱！不如反过来想想，公司除了工资，给你提供了什么？


