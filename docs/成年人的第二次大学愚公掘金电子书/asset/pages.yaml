  md: '# 7天获客15万的产品经理，讲讲在线教育行业的增长之路


    # 分享：


    大家好，我是李杨，做互联网产品经理出身，目前在好未来负责一块新项目的产品和运营。属于一直在职场厮混的这种，对于自己赚钱还一直没摸到门路，所以今天分享聊的内容会更多偏向于我自己对所在行业的了解和分析。


    （花爷插嘴：李杨在好未来做的一元裂变项目，7天获客15万精准用户，是难得懂理论又有实践的增长官。）


    因为也不想浪费大家时间，所以先说明分享内容能给大家带来的收益。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '首先，对于不在在线教育行业的朋友来说，能知道在线教育行业的基础情况、常见业务模型、获客逻辑，如果以后自己要做相关的事情，心里起码有个谱。


    其次，对于行业内的朋友来讲，可以对比自身业务判断发展方向、了解不同公司的人才需求、设计自己业务的增长模型，最不济在要跳槽的时候对自己适合去哪家


    公司有个保底的抉择标准。


    最后，对我自己来讲，最近要招点有灵性脑子活的产品和运营同学，因为能在花爷这里的起码都有基础筛选了，有意向的可以先勾搭勾搭~


    ok，现在进入正题~


    # 1、在线教育公司常见类型及特点


    第一个话题是聊在线教育公司常见的三种类型、代表公司及行为特点。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '先说为什么要从这个点切入，因为不同公司采用的各类商业手段，其实背后是由其主导角色和业务模型决定的。简单来讲，就是谁可以帮助公司带来更大的竞争优势，谁就可以在所在公司的运营发展中占主导地位，也决定了公司的文化和基因。


    最常见的三种公司类型，可以分为学科型、运营型、工具流量型，各自都有做的很不错的代表公司，我们逐个来唠一唠。


    （1）首先说学科型的公司，学科型的公司核心在于可规模化的教学能力。外化表现就是能批量产出的优质课程内容。由学科人才（课程的产品经理）主导，会主要涉及到教学教研的标准化，组成部分主要是课程设计、课程讲授。


    课程设计主要由学科和教研考虑，包含课程内容、授课类型、班容、课程包装等，成熟的学科体系内一般有一套标准的设计流程。'
  merge: -1
  img_proc: true
- pgno: 209
  md: '课程讲授主要由授课老师考虑（很多时候学科和教研会兼任授课角色），最重要的部分在于标准化的师训流程，足够规模的学科型公司也都有自己成熟的师训体系。当然现在越来越多的公司也都采用了双师模式来弥补授课资源不足的问题。（双师模式：主讲老师只负责授课，可以做直播放大，1对n。辅导老师进行辅导答疑，一对几十）。


    传统类的教育公司，包括很多线下自己做培训的，其实都是学科型的发展逻辑，他们的认知出发点在于只要我课程做的够好，进行简单运营，自然就有用户来买单，并且会带来源源不断的口碑和复购。


    从现阶段来看，因为极其看重学习效果交付，其实属于最健康的模式，业务模型也主要依赖口碑传播，跑出来了像好未来、新东方这样的教育行业龙头。'
  merge: -1
  img_proc: true
- pgno: 210
  md: '（2）下来聊运营型的公司，运营型的公司核心在于可规模化的推广能力，更注重商业化运作和赚钱。简单举例，就是有一个课程内容，尽全力去找各种方式和手段进行课程推广。由运营人才（或者现在很多人叫它用户增长）主导，主要涉及到新媒体领域的运营操作，主要关注增粉和变现转化


    这一块能展开的内容非常多，下个环节我们来具体聊。


    这类公司的特点是，够狼性，野蛮发展，运营冲量快。他们的认知出发点在于，课程内容只是变现方式，不断打磨高效的增粉和变现转化环节才是正经的生意模式。


    这类模式从目前看可能会遇到的最大问题会在用户流失严重，复购率低，容易陷入无止境的冲量拉新。比较有代表性的有跟谁学、轻课，很多的知识付费产品也能归到这类。


    （3）最后谈工具流量型，这个比较有趣了，这类公司一般属于比较正经的互联网公司，教育产品更多是被其看做变现的一种方式。其核心能力在于快速高效的产出能击中痛点需求的教育场景工具，汇聚大量流量再做课程变现。由产品技术主导，主要在于需求挖掘和实现。'
  merge: -1
  img_proc: true
- pgno: 211
  md: '这类公司好像不是特别适合群里的盆友们了解，也不太多展开讲。


    主要可以看的产品比如小猿搜题、有道词典、扇贝单词这类，他们的优势特点就在于用户场景挖掘准确，用户产品使用体验优秀，迭代能力强悍。一般来说的问题在于，过于重视产品技术，缺乏成熟的教育体系，课程整体的付费率会比较低。


    总结来说，各家公司起家的业务模型不同，产生了不同的主导风格和基因，也属于他们不太会被改变的底层思考方式，上面的常见分类可以帮大家在想要了解在线教育公司时快速定位。不过需要注意的是，在业态不停发展的前提下，大家也都能看到各自类型的特点，针对不足之处都会各有补齐，同质化在逐渐增强，千万别咬死一家企业就只能一个样子哈。


    聊完了常见类型，接着聊第二个话题~


    聊完了常见类型，接着聊第二个话题~


    聊完了常见类型，接着聊第二个话题~'
  merge: -1
