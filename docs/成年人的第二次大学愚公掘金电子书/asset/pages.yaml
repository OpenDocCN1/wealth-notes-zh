  md: '**售后：** 退货的问题，我们一般处理方式是，合理的要求，我们一般直接退钱，货也送了。如果是客户的问题或者物流商的问题，我们一般用购物券安抚，你给个30-40
    off折扣券，一般老外都比较好弄，到这步基本都解决了。说到这里，选品上就地注意了，退货率高的产品尽量不要做。成本高的也是，退货起来你吃不消的。还有一个降低退货率方式是，要在网站的页面上说明到货时间，我们一般说是12~20
    business days。这个时间老外都是接受范围内的。我曾经也测试过，美国本地海外仓发货和 dropshipping，转化率并没有明显提升。


    # **最后我再讲几个关键点：**


    dropshipping 门槛不高，砸钱就可以直接投放，但是现在要轻松的赚钱已经不是当初那么容易了。虽然国内准备要火起来，但是在海外这个模式已经玩了很多年了，这个模式本质上不是和国内的竞争而是与全世界的dropshipper竞争。所以要做好心理准备，更长周期，更多的钱需要烧。


    **Q&A：**'
