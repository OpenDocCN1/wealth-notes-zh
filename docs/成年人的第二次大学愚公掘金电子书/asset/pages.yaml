- pgno: 102
  md: '那先自我介绍一下，我叫佘奕宏，广告人，做了20年左右的广告，可以说，在南京，我们当时（所在）的广告公司应该排名前三强，然后我在那家公司做合伙人。这个南京，我们算是好像觉得自己还挺不错的一个广告公司，还是一个挺不错的广告人，但是事实上把它放到全中国来看，这个很普通了，因为南京的广告份额跟北上广深是没办法相提并论的。


    所以就是说，我在广告人当中，如果把中国的广告人都加起来。我可能应该排不进前100吧。


    排不进前100，不代表说我的这个专业能力啊，或者是什么（条件方面）的，我进不到前100，而是说。你没有差异化特色，你就是一个某个广告公司的。高管也好，或者叫创始人也好，或者是合伙人也好，你是没有任何的特色。我们这家公司在江苏有竞争力，但是把它放到全国呢，那他的竞争力又在哪儿呢，所以其实我今天跟大家探讨的这个话题呢，对我们每一个人，无论你是不是做餐饮，或者你是不是做广告，都不重要，重要的是你要思考一个问题，是你怎么样在某一个领域，某一个行业里面，脱颖而出，至少做到前三强，最好能做到第一名。'
  merge: -1
  img_proc: true
- pgno: 103
  md: '我是一个危机感很强的人啊，所以，我在2011年、2012年的时候，（我）那个时候负责公司的媒介投放，每年大概，在我手上，要经手也不算多，大概两个多亿的这个广告投放。日子应该是过得非常的舒服，因为我其实已经算是半个甲方了，对我来讲，我们虽然是广告公司，但是我是把两个亿的订单，投放给电视台和投放给我的下家的广告公司，所以其实我也是半个甲方，日子过得非常的舒服，但是。我有一种强烈的危机感，因为我总觉得日子一旦舒服就。是一件不美妙的事情。


    于是我开始寻求转型，后来我遇到了新浪微博的总裁——葛景栋，他到我们来找江苏的合作公司，跟我讲了微博，讲了Facebook，讲了Twitter（等等），就是西方的这个社交网络的发展史，那个应该是在2012年四月份左右。他把我讲懂，我当时就知道说，原来媒体界发生变革了，我们传统的大众媒体，将一去不复返，它的势能只会越来越差。所以那些年里面，媒体的朋友来问我，说怎么办，我跟他们讲了一个字，我说跑，跑的越快越好，早跑的都比晚跑得好，但是可惜很多人都没有听。大多数人来跟你竞争，提意见，只要不是付费的啊，付费的他都未未能听你的，就不要说是不付费的。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '葛总（当时）给我讲憧了两件事情，第一件事情，他告诉我，传媒发生了变化，第二件事情，我当时就明白了，因为我毕竟研究了20年左右的这个产品广告，然后我当时知道时候，好，普通人建立品牌的时候到了，因为原来（情况/条件）的话，在大众媒体的时候，你是没有机会去建立品牌的，因为，那个成本很高，如果报纸不采访你，如果电视台不采访你，你自己打广告都没有用，但是在社交网络里面，每个人都是一个品牌，你可以去，通过（那个时候就）微博，还有微信。今天还有抖音，还有各种各样的直播平台，我们看到很多人都在这些社交网络上突然窜红啊，有的叫我们叫他们网红也好，或者什么也好，我最红的时候走在北京的街头上都被人认出来。


    后来我就明白了这件事，让我明白这个事情的时候，我就知道机会来了，于是我开始放弃我原来的这个手上的既得利益。我开始去研究，社交网络，而且做了一家公司，然后做了一些案例。应该算是，在当地大获成功，我就知道整个社交网络的这个套路是什么了。后来，我就开始写公众号，然后我们也算是当时是吃到公众号的红利的一波。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '大家听到这时候肯定会这样说，原来其实还是因为你们有红利，你们通过社交网络啊，尤其是通过什么微博呀，或者是微信啊，做了这个方面的传播啊，你们吃到了这样的一个红利，那下一波，是不是大家开始去寻找抖音啊什么的，我在这儿，其实我想重点跟大家分享的，倒不是说怎么利用这些新媒体来传播自己，因为这个有很多的课程，你们都可以在网上买到。


    真正我想说的是，有两个非常重要的东西，第一个就是定位，就是你怎么样去给自己找到这样的一个位置，怎么样给自己找到一个定位，让你能够成为第一，成为某一个领域里面的第一。这是最重要的，因为如果你做的这个事情只是模仿他人。可能社交网络会帮你红上去，但是你无法脱颖而出，但是你是没有标签的，别人是不知道你是干什么的，你只是众多的红人当中一个，那个风过去了，你也就不在了，就跟很多网红都品牌也是一样的，就因为他其实缺乏定位，它是靠炒作，靠某一个小的技巧，然后借助这个抖音也好，借助这个传播红起来了。'
  merge: -1
  img_proc: true
- pgno: 106
  md: 什么意思呢，我讲一个例子啊，比方说，不知道大家有没有喝过喜茶，喜茶和答案茶。答案茶属于典型的网红品牌，就是做了一个噱头，就是你来点茶，然后给出一个答案，可以占卜一样的，然后就红了，红了以后，然后放加盟，迅速放加盟，然后圈了很多钱，这种网红品牌。那么这个喜茶呢，他就属于叫做有定位的品牌，因为是喜茶开创了芝士奶盖茶。那他至少是中国最早原创的芝士奶盖茶。所以它也是这个网络让它红的，但是因为它是一个有根的品牌，我们且不论它内部的运营的优劣，最重要的是它是一个有根的品牌，它是有清晰定位的品牌。更重要的是它是第一个创造了芝士奶盖茶的品牌。无论它是不是第一个创造的，但至少你是从它那儿知道的。
  merge: -1
  img_proc: true
- pgno: 107
  md: OK，我讲到这儿的时候，其实你们就知道说，为什么绝大多数的网红。是没有价值的，就是你们在那些直播平台上看到的，绝大多数的网红，他们就是“风口上的猪”，那个平台起来了他们就起来了，平台落了就落了。然后他的生命周期也非常非常的短，所以我今天跟大家分享的呢，是讲的叫做个人专家品牌，为什么叫个人专家品牌呢，就是他是一个在某个细分领域里面。他能够称之为顶尖的专家，这对我们这个社群里面来讲，我相信可能很有价值，因为我们社群里面卧虎藏龙啊，都有各种各样的这个精英，事实上这些精英。我们如何能让自己从经营跨越到第一，跨越到唯一。就你的市场是完全不一样的。
  merge: -1
  img_proc: true
- pgno: 108
  md: 我就讲讲我自己的经历，那个时候我也是靠写微信（文章）红了，我写了一些关于餐饮业的一些文章，红了之后我就成立了一个俱乐部，叫失控互联网餐饮俱乐部。你看这个就属于当时的网红，因为当时在2015年的时候，互联网餐饮很火，我就是一个话题，我自己原来又懂网络，又懂传统媒体，然后我还有一些电商的经历，所以我就知道，当时餐饮业外卖已经开始崛起，包括北京的一些互联网品牌，我就开始拆解他们。这就是话题，然后大家就很感兴趣啊，都纷纷加入。但我觉得那个是很难长久的。
  merge: -1
  img_proc: true
- pgno: 109
  md: 我自己就在研究，研究什么呢，我在研究什么是这个行业，因为我见到餐饮业的时候，我就想说，我得在这个行业里面一直干下去，因为那时候我已经40岁了，我不是小孩子了，我得一直在这行业干下去，那我就要知道的是这个行业的道，这个行业的规律是什么，什么是决定这个行业成败的本质，或者说决定一家餐厅成败的本质，或者说是个品牌成败的本质，所以我就开始去寻找，去探寻。当时因为有一些投资人，还有一些人来找我去做一家公司，就是我今天做的这个公司，叫未来食，我们一起去
    做投资吧，我说投资我不懂，餐饮我那个时候还是刚刚入门，我得去做一番研究，后来我就去研究它。那等我研究完了以后，我知道原来其实不是互联网餐饮。
  merge: -1
  img_proc: true
- pgno: 110
  md: 行业真正的机会是在于开始做品类，品牌，就是我们讲的叫做细分市场，因为整个的行业竞争，到后来的时候就开始大量涌现细分的品牌，这是我在2015年的时候得出的结论，今天你回头看的话，你会觉得说这有什么，这大家不都是这么讲的吗，现在不就是有这个种各种样的小而美品牌，或者是叫十分品牌，但是在2015年的时候，那个世道很混乱的时候，想找到真相，其实还是要花一些心思的，我是因为跟投资人走的特别近，受他们的影响比较多，他们也会跟我讲，说他们真正看重的是什么，不是那些什么所谓的互联网品牌。而是说，它是不是一个品类的品牌。
  merge: -1
  img_proc: true
- pgno: 111
  md: 那基于此，后来我就在北京开了这个课——品类战略，因为我自己在92年的时候就开始看品类定位的书，那我讲品类战略，我开了几期课程，那时反正也收到钱，因为那个时候有流量，但是我总觉得还是不对，为什么我觉得不对，因为，定位也好，评论也好，这不是我开创的，这个已经是特劳特和里斯的知识资产了，他们俩是牢牢地封锁了这个行业的，第一，这两家公司也是做到中国的这个在咨询行业战略咨询里面的第一名，我认识的绝大多数学定位学和品类的这些咨询师，过得都很不怎么样，就是每年接一点点小案子，做一些小客户，也就勉强赚点小钱而已。
  merge: -1
  img_proc: true
- pgno: 112
  md: 那我想这个不对啊，我必须要成为这个里面的第一。但我不可能成为定位的第一，也不可能成为品类战路的第  一。我后来。就开始研究整个的线下门店，因为餐饮基  本上还是以线下门店为主，后来我终于发现通过我的专  业知识，我发现说原来。他们在线下门店，都不知道怎  么用线下门店去获客，都忽视了这个门头。然后我再往  下深挖的时候，我发现原来门头不仅是我们看到的这个  门头，他代表的是这个创始人的思想和理念，代表的是  这个创始人对生意的理解，对顾客的理解。包括他通盘  的考虑，后来我就开创了一个门类，这个门类就叫做门  头战略。
  merge: -1
  img_proc: true
- pgno: 113
  md: 于是我开始重新定义门头，因为我认为线下门店的门头，它有四大功能，从道法术器来说，从道上来讲，它是金字招牌，它是一家餐厅的金字招牌，或者是一家门店的金字招牌，它代表了这个企业的使命愿景，价值观，不管这个企业有没有，但它代表着。那么第二个呢，从这个法的层面上来讲呢，它是这个线下门店的品牌竞争的阵地，就说它所有的品牌的表达，品牌的竞争阵地，那么从术的层面上来讲呢，它是线下门店的第一的流量入口，就是你线下门店主要是靠这个门头来获取流量的，而且它是第一流量入口，那么最后一个呢，其实门头还是什么的，就是从器的层面上呢，它是获客的所有装置，你不要把门头看成是一个招牌，整个的门脸全部都是获客装置。
  merge: -1
  img_proc: true
- pgno: 114
  md: '后来这个当我有了这样的一个定位以后，我开始写文章，这种文章我其实只写了几篇。但是影响非常大，因为别人可以清晰的认知你，清晰的定义你，并且当你开创一个新的门类的时候，你一开始就是第一名，没有人跟你竞争。大家知道发生了什么吗，就是我做了一年多一点的培训。我在培训业肯定也不是有名的，我就做了一年的培训，结果餐饮行业。几乎所有的知名品牌，就是你们能够报（出名字）的知名品牌，都参加了我的课程。而且我其实原来根本不认识他们，都他们主动来报名参加我的课程，这个包括西贝莜，海底捞，老乡鸡，东坡等等，都来报了我的这个（课程）。


    我有一句名言，叫：不换门头就换老板，是我的战斗口号，已经变成这些大老板的口头禅，跟他们的员工教育的时候，都是这么说，说校长讲的，所以不换门头就换老板，你看你们。想怎么着吧，所以很有意思，这是第一个案例，这是一个非常非常真实的案例。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '当我有了这样的一个定位，有了这样的一个，个人专家的品牌的时候呢，我获取的是整个行业的全部投入资源，来找我的都是这个领域里面的，顶级的投资人，或者是顶级的媒体，顶级的大会等等，就基本上是。我不用再去主动找别人，而是他们来主动来找我，你看，这就是当你成为个人专家品牌的时候，你就成为了这个行业的一个连接器，一个中心节点。


    那可能还会有人说，那当然了，因为你都做了20多年广告了，你自己有这么强的沉淀，这个毫无疑问，因为我毕竟服务过世界五百强，服务过中国的国内五百强，服务很多知名的一些企业，包括像光明，雪花，悦达起亚，还有等等，服务很多这样的品牌。那他们会觉得说，那是因为你你有这么深的累积，下面我讲一个。运用我这套理论，大获成功，但是他本身原来在传统上并没有什么特别累积的人，就是你们讲的叫素人。


    案例二：'
  merge: -1
  img_proc: true
- pgno: 116
  md: '这个人呢，她是我很熟悉的人，因为我们在一起已经十年了，她是我太太，2015年。八月份我41岁，我来北京，然后跟她讲，我说要到北京去，我们重新来开创我们新的天地，开创我们新的事业，她就开了一个车，我因为不会开车，她就开了一个车，我们两个人就把家搬到北京来了，到了北京，我记得非常清楚，是2015年的8月4号，大概过了两三天，我们安定下来以后，她就跟我讲了。她说这个老余，我现在跟你一块儿到北京来创业了，你那就不能再把我当成一个助理来用了，因为以前她就是我的金牌助理呀，她帮我做很多事情，然后她说你也帮我做个定位，你整天吹牛说帮人家公司做定位，那你帮我做个定位。


    我是有一套这个方法论的，但是这个方法论，不是我不愿意跟你分享，是因为需要面对面的交流，因为它需要沟通，就是需要了解你的一些情况，我才能帮你去做这个方面的定位，后来我就帮她用这个方法论去找，后来我就给她找到了一个细分的领域，这个细分的领域就是餐厅的菜单，广告人有个优势，就是他对用户特别敏感，就是我们总是观察用户的不满，不安和不便，于是我发现中国人点餐实在太痛苦了，就是你推我，我推你，你们都会发现这个现象。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '有的时候我们在那儿点餐的时候，那服务员在后面，我背后都冒冷汗，然后把菜单从前翻到后，从后翻到前，也不知道干点什么，然后最后胡乱点一些，结果点的都不好吃，这其实是因为什么呢，是因为这个菜单，他没有规划好，没有路径，他不是站在用户点选的那个场景里面去思考这个问题的，还有呢，就是你吃一顿饭，今天晚上吃完了以后，你根本不知道今天吃的是什么，这菜点的越多，你对这家餐厅就越没有印象，我发现这都是痛点，然后我就跟这个老板讲，我说，你去研究这个吧，这个挺有价值的。


    那她（佘太太）是一个非常有超强超强执行力的人，当我跟他讲完，我大概应该是在8月6，7号跟她说这个事情。那她大概应该是8月9号左右就把第一篇文章写出来了，就是每到餐厅去。看人家菜单，她就把那文章写出来，写出来以后就转发了这个朋友圈啊，我帮她转发朋友圈，那我朋友圈呢，里面都是这个餐饮行业的资深大佬，然后餐饮老板内参的，（我们餐饮行业最大的这个媒体的）总编就看到了。就问我这文章谁写的，我是你嫂子写的啊，他说我要跟她约稿，后来就帮他们登在了餐饮老板内参上，餐饮老板内参是这个行业里面的最大的自媒体。所以他传播一下还是非常不一样的。'
  merge: -1
  img_proc: true
- pgno: 118
  md: '那这个时候有人要说了，那当然了，是因为你，你有资源啊，你相当于用大V来带她，可以说是有用，因为至少说没有人说，你写第一篇文章就能上这个行业的一个权威媒体的。更重要的，我想讲的是什么呢，就是其实还是靠一个人持续的执行力，持续的精进，这是更重要的。我觉得她最厉害一点是她做了三年半了，她从那那个时间开始起，第一天开始去研究这个事情，中间的这有1000多天，从来没有一天断过。然后她就一个人写文章，一边写文章，一边接客户，一边去服务客户，做课程。


    她几乎一个人贡献了这个领域里面，全网95%以上的文章。你在网络上搜菜单规划的，95%以上的文章都是王小白（佘太太）一个人写的，也就是说，不是因为有我推荐了她，而是说她有超强的专注力和执行力，在这一点上，我觉得我们不管是做这个创业者，还是我们做这个个个人品牌专家，还是说我们做一个生意。然后这都非常，极其稀缺的品质，就今天这个世道太浮躁了，因为大家觉得到处都是机会，好像不小心遇到了机会，可能我们就鸡犬升天，迎娶白富美了，所以真正能够安下心来，踏踏实实去研究一个东西的事儿是少之又少的。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '所以我今天跟大家分享东西都不是捷径，你要是想说我讲个秘诀，没有秘诀，其实就是你怎么样找到一个细分的领域，首先你得找到一个细分的领域，不要跟风，不要看着别人干的什么东西，然后你说，这个好像我也能干，那这种没有价值，因为当你不能成为第一的时候，你也就是跟风蹭一下，然后赚点小钱而已，只有第一才是赢家通吃。


    所以后来她（王小白）也一样啊，她服务的这些，她（现在）比我更有名。因为来加她微信的人都是这个行业里面，顶尖的品牌老板，来加我的人很奇怪，反而有些是这个二把手，三把手什么之类的，来加她的基本上都是这个行业的品牌老大，他们主动来加她，因为越是懂行的人也就越知道啊，菜单非常的重，几乎是这个领域里面的一个命脉，那我们去见西贝的贾总，就说餐厅啊，餐饮的那个菜单是餐厅的一，就是没有这个一。一切都无从谈起，然后九毛九的这个管总也说，我衡量一个人餐饮做的怎么样，我就看他会不会看菜单，那他能不能从菜单上看出问题。'
  merge: -1
  img_proc: true
- pgno: 120
  md: 其实我和我太太，我们俩都不属于聪明人，我们都不是 说有多聪明，天资有多好，有什么样的这个资源和人 脉。对我们来讲其实还是蛮普通，还是很平凡的人，更 重要的是我们的年龄，她也30多岁，我也40多岁了，那
    其实我们跟很多年轻的比较起来，我们有两个短板啊， 一个是精力没有那么旺盛，但我们创业的精力还是很旺 盛。另外一个就是，我们其实学习新生的事物，比方 说，我在这两天在群里面听到答案，讲这些很新奇的，
    这些东西，事实上，我其实很多没有深入了解过，但是 正是因为这样，我们觉得自己时间有限，精力有限，我 们就把这些有限的时间和精力，极其极其专注的用在某 一个领域里面，我们只在这一个领域里面去做深刻的研
    究，当我今天研究下来可以这样讲，我对整个门头的理 解，我可以毫不夸张的讲，我超越了全中国，全中国就 没有人任何一个人，他不可能坐下来跟我谈，说他对门 头的理解，他能超过我，我觉得这是不可能的，我待会
    发张图给你们，你们一看就明白。
  merge: -1
