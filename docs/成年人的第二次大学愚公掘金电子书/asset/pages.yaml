- pgno: 60
  md: '这个机构是由高校的几位老师牵头、几位研究生具体做事弄出来的。目标客户群体是城市高端白领和家境优渥的全职妈妈。产品主要是读书会、讲座、成人游学（市内、省内、国内和出国）和文创周边，其中会员的会费是很大一块收入。因为牵头者身份的原因，他们在对接高校师资一块有天然优势，那些学术上很厉害，最主要是全国范围内还很有名的老师，他们都能以很低的价格请到。另外，因为他们跟政府之间也有很好的对接，所以以“民非”的身份申请到了很好的政府津贴，这是第二块很丰厚的收入。第三，他们的读书会客户群体中还会有一些大老板，覆盖各个行业，所以很多活动的住宿、餐饮成本都通过企业赞助的形式解决了。第四，因为拥有丰厚的高校学生资源，又因为“民非”组织本身的名头，所以很多活动都是以“公益活动”的形式出现的，这样聘请临时工作人员的费用也省了，因为来做事的学生都是以“志愿者”的身份出现的，做一场大活动的人力成本都几乎可以忽略。


    综上，以上种种开源节流的方式，这个机构运转良好，收入丰厚。但高校资源是核心，这一点一般人或者一般城市较难复制。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 故事三：中心城市有资源的人，他们这么玩（二）


    这个故事离我更远，因为我只是听一位前辈讲过，而自己还没有机会操作。当然啦，这位前辈德高望重，绝对不会乱说，所以真实性是可以保证的，但是其中细节我尚无法参透，只能先把一个轮廓告诉大家。故事的发生地点还是在拥有丰富高校资源的城市，这两年流行一种面向企业或政府单位的培训。基本模式就是需要培训的单位通过中间人，在高校门口挂一个横幅，“**单位大学培训**”，租一间这个高校的教室，请1-2位这个高校相关专业的老师（视培训需求而定）。然后这个来培训的企业或政府单位就可以高调宣称“组织多少人在某某高校接受了为期*天的培训”了，而实际上这个培训跟这个高校一丁点关系都没有，只是借门头挂了个横幅拍了个合影、租了间教室、请了俩老师。但是这笔培训费用是极为丰厚的。


    这里面自然有利可图，但可以想见需要搞定的人也不会少，但我觉得还是可以尝试一下的。毕竟这个路径只要走通一遍，后面的都可以如法炮制，而且这种需求只会越来越多，市场还是挺大的。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 故事四：有“钱”景的她、她和她


    讲完了文化公司的做法，再讲讲个人在这波文化风潮中的机遇。故事四中有三个主角，她们互不认识，但是有很相似的境遇，所以我放到一起讲。


    第一位女主角，我们叫她q。q是在5年前入的花道的坑，她原本是北方人，为了孩子读书迁居到了南方，放弃了家乡高校的教职，自己开了一家花道工作室。一边去日本继续进修花道，一边在自己的工作室以及长三角地区其他城市寻找合作者，上课。因为她学习的是日本的品牌花道，又因为她自己的文化艺术修养非常深厚，她的花道课收费还挺高的，平均一位学员一年的学费在2万元左右，一年有几十位学员。刨去成本，这个收入也是非常可观的了。'
  merge: -1
  img_proc: true
- pgno: 63
  md: 第二位女主角，我们叫她x。x硕士毕业后一直在上海做着“二流编剧”（这是她自己的原话）。因为喜欢花艺，所以在求学期间就坚持去台湾学习中华花艺，这一学就是6年。后来，她开始试着在上海和长三角地区的城市与一些知名或非知名的机构合作（比如南京的先锋书店）做一些花艺的免费讲座，没想到场场都是人气爆棚。很多免费讲座的听众就成了跟她学习花艺的学员。后来她就辞了职，开了自己的工作室，专心做起教插花的事业。当然她现在还在继续通过活动拓客，但是她跟我说，上海的市场非常大，有很多人甚至从外省赶过去上她的课，但做这一行的人其实不是很多，尤其是做得好的，就那么几家，市场还远远没有达到饱和的状态，所以她对不管是“前”景还是“钱”景都比较乐观。
