  md: '# 跨境电商平台——速卖通的介绍和从业经验分享


    # 介绍：


    分享嘉宾：咚


    分享背景： 从业跨境零售（主要是速卖通）三年，标类行业卖家。速卖通是阿里旗下的跨境平台，可以看作是国际版的淘宝，物流目前基本是国内直发。第一大市场在俄罗斯，占平台40
    %左右。


    # 分享：'
  merge: -1
  img_proc: true
- pgno: 436
  md: '大家好，我们今天主要聊聊跨境电商（速卖通）的一些经验。


    # 1、平台


    我们一般在谈跨境电商，大多谈的是跨境出口零售这块，所以先狭义地圈定在这个范围内。


    谈及电商，往往离不开平台，目前对中国卖家而言，主流的跨境电商平台主要有：Amazon(亚马逊)、eBay、Wish以及Aliexpress(速卖通)，还有近两年势头不错的东南亚平台Lazada和Shopee。


    # 2、物流


    按物流方式，一般分为销售国本地仓发货（先把货从国内发到国外仓库，客户下单后，再从国外仓库发货上）和国内直接发到客户手上。'
  merge: -1
  img_proc: true
- pgno: 437
  md: '亚马逊通常以销售国为独立站点部署，建设本地仓库，基本上都是本地仓发货，第三方卖家也是先把货发到亚马逊仓库，再上架销售，由亚马逊物流配送（Fulfilll
    By Amazon, 行业内简称FBA），客户体验好，几乎牢牢占据欧美发达国家中高端市场。最近也积极入局印度，中东这些新的潜力市场。


    这四大平台里面，速卖通体量大概是垫底的，但是为


    是在阿里旗下，体系相对国内卖家较熟悉，资金风险相对小。


    除了亚马逊，其他平台也有本地仓发货，一般称为海外仓，主要看类目，但大多还是以国内直发的形式为主，尤其是货值低的轻小物件。


    ![](img/5688f8284c7103ed77046cfddaf3da13_437_0.png)'
  merge: -1
  img_proc: true
- pgno: 438
  md: '![](img/5688f8284c7103ed77046cfddaf3da13_438_0.png)


    上面图片从上往下分别是，ebay，wish，速卖通。


    0.99美金全球包邮! 你没有看错。


    大家笑称速卖通为“屌丝通”，运营采购客服发货必须一应俱全，价格甚至比国内还低，流量还小，简直国际搬运工。'
