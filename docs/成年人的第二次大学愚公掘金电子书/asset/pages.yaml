  md: '# 华为P30月出货量500万，论“性价比”模式的死结


    华为最新的P30系列，售价四五千，月出货量能到500万台。


    反观国内第一个跑出来的品牌小米，之前被oppo、vivo压着，现在又被华为赶超。在国内，你会发现所有主打性价比的品牌，无论任何品类，比如小米、比如网易严选，都能做到快速起量，但永远做不到所在品牌的第一。


    华为有点现在有点像十年前的苹果，大部分年轻人和中老年人都认可它好，但你去问老百姓，华为拍照好在哪？系统好在哪？没多少人能和你讨论参数的真假，一句华为好我朋友都在用就完事了。'
  merge: -1
  img_proc: true
- pgno: 1043
  md: '性价比就意味着对用户认知要求高，但大部分用户，永远不懂行；性价比就意味着没有溢价，但大部分消费品类的第一品牌，都需要卖出溢价。


    不是说质量不重要，但在质量不错的基础上做生意，让用户觉得产品100分，比产品真的100分，要划算的多。毕竟很多用户，并不需要产品真的100分。


