- pgno: 558
  md: '# # 财务公司如何引流？


    **提问：**


    这是一位花友的问题，微信私聊问的，为了方便大家看到做个参考，星球里写回答了。


    问题是这样：


    “花爷，我看了宝宝起名字的那篇文章，觉得有启发。联想到自己之前注册公司的时候，给公司起名称花了很长时间，所以想从这块入手，网上帮用户筛查起的名称不可行，引流之后帮忙注册公司以及后续的代理记账。'
  merge: -1
  img_proc: true
- pgno: 559
  md: '我今年在家想想自己能做啥，因为做生意前是做财务的，现在也不想去上班，想开一个代理记账的公司，而这种公司比较多，想从网上这块找客源。看完那篇给宝宝取名的文章后，我觉得我这个应该是可以操作的，麻烦花爷有空的时候，能不能帮忙分析一下，多谢”


    # 回答：


    我很高兴花友们看了我或者其他花友的案例，能够有所启发，尝试运用到自己的行业里。


    公司起名这件事，据我了解，需求主要分两块。一块是公司名风水这一块，有的大老板非常信这风水这一套，大师们给公司起名的客单价很高，当然这一块跟你无关，不提。'
  merge: -1
  img_proc: true
- pgno: 560
  md: '另一块是公司名查重，因为我也有注册公司、找代理记账的经历，这一块的问题在于，市面上的查重产品已经很多了，做SEO（搜索排名优化）你肯定做不过老手。还有个问题是，一般到起名查重的阶段，很多企业主已经找过代理记账公司咨询过了，在这个阶段引流，转化到后续记账服务的效果应该不会太好。比如你可以现在去企业名查重的工具网站上去投广告尝试一下，估计转化率不会很高。


    你作为个人创业者，我比较建议你从更源头入手，直接和有创业需求的人交朋友，提供微信一对一的咨询服务，从一开始占据用户心智。一般创业的人，琐事很多，不会花太多时间去找很多代理记账公司做对比，再说了，市面上的代理记账服务，本身差异化就不大，如果你给创业者的印象很好、很靠谱，基本就认准你这家了。


    那么问题就变成了，去哪找创业者呢。我在《中产的合纵连横之术》里说过，目标用户常常分散在各个相关领域，想办法找到这些相关领域，然后各个击破是很好的办法。我能想到几个相关领域包括：'
  merge: -1
  img_proc: true
- pgno: 561
  md: '1.创业共享空间：看你微信显示在上海，上海有非常多的创业共享空间，你可以试试到这些共享空间里，找那种2-6人的小办公室，大多是一些初创团队。找这些初创团队聊聊，加个微信保持联系，然后经营好你的朋友圈。当然，这些初创团队有一部分已经找好代理记账公司了，但创业者往往有创业微信群，他们的朋友可能需要代理记账服务。对了，如果能跟共享空间的前台搞好关系，让她们帮你引荐一下就更好了。


    2.知识星球、创业者社群：cao z、冯大辉几个大V的星球，互联网人和创业者居多，你可以加入他们的星球，营造好自己的形象，吸引对创业财务有问题的朋友。另一个策略是，你可以新建一个免费星球，免费回答创业公司的财务问题，然后引流到自己的微信提供服务，有一个名叫“上海买房指南”的星球，就是以回答问题引流到微信，再提供借贷、户口落地等服务。


    当然，还有淘宝等渠道，都可以一试，我建议的核心观点在于：


    +   1.以免费的创业财务咨询服务引流到微信

    2.经营好朋友圈，宣传自己的专业代理记账业务'
  merge: -1
  img_proc: true
