  md: '再然后就是如果自己还有精力的话,可以发展一下自己独 有的服务,这个就看各位的能力了.


    # 3、最后说说, vlog 与短视频有什么区别,为什 么目前它火了起来


    Vlog 就是视频博客,短视频也是视频,它们之间的差别在 哪儿呢?


    | 区别 | 短视频 | vlog |

    | :--- | :--- | :--- |

    | 长度 | 15-60秒 | 4-10分钟 |

    | 内容来源 | 以账号定位为主 | 以创作者为主 |

    | 流量去向 | 流向内容本身 | 流向创作者个人 |

    | 表达方式 | 碎片化 | 主题式表达 |


    从上面这些区别我们能够看出来,短视频是以账号定位为 主的,而 vlog 是以创作者个人为主的,这就是 vlog 为什么 会是风口的原因,因为短视频可以抄袭类似的主题,类似的
    内容,但是 vlog 不同,它是以创作者个人为主,那么一个 vlog 就代表着一个人的生活,短视频的内容主题可以抄袭, 但是每个创作人的生活却不会雷同.


