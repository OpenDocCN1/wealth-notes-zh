  md: 第三位女主角，我们叫她d，高级秘书出身，后因为机缘巧合进入了个人形象、礼仪培训行业。培训内容涉及商务礼仪、销售礼仪、服务礼仪、会务接待礼仪、汽车服务礼仪、前台接待礼仪、银行柜员服务礼仪、形象管理系列、精准形态礼仪、场合着装艺术等等方面。d老师上课很认真，课堂效果也很棒，所以在培训市场上很吃香，合作的单位中有很多都是大银行、大国企。她常年保持每年平均出差100天的节奏，而她的收费标准是：6k/天（6~7小时），
    4K/半天（3小时）。教礼仪还不像别的，几乎除了老师本人以外不需要其他太多的物料成本，所以加上她不出差的日子在所在城市赚的钱，一年七八十万是稳的。去年，听小d老师说她打算回归家庭，接下来想要培训礼仪讲师，把出差这种累活交给弟子做。我个人当时听了还是蛮心动的，觉得这是一个很大的市场，而且前期投入不会一下子就很大，可以一边学，一边出去教一些初级的内容，再回来继续学习深造，然后教高级的。除了辛苦点，“钱”景同样是非常不错的。
  merge: -1
