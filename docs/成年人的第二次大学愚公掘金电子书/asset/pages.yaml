- pgno: 139
  md: '接下来回答昨天的问题


    # 1. 这些海外在Facebook倒流来的消费者，什么属性比较多？什么类型的产品比较好卖？


    Lin：都是冲动型消费。好卖的产品，大方向是偏女性会购物的比较多。还有，海外的中老年消费能力很强，相反年亲人没什么钱。我们纵观我们所有的历史数据来看，客群几乎涵盖babyboomer。如果你针对这类客户选品，也是一个很好的方向。


    # 2. 同行里应该中国人外国人都有，怎么在竞争中形成优势？


    Lin：更好的产品，更好的文案，更好的定位，更多的预算。：）要形成优势的话，那就是你的数据累计。

    facebook 广告平台的 pixel 像素是所有的广告互动数据，当你累计大量数据以后，你可以根据这些用户数据画像去做更多的产品尝试。


    # 3.跨境电商这块，国家的政策有什么规避风险什么？'
  merge: -1
  img_proc: true
- pgno: 140
  md: 'Lin: 出口一直是国家鼓励的。唯一的风险是目的国政策风险，我们基本都是国内直邮发货。所以相对来说目的国国家要监管也比较难。不像B2B贸易，一票货被盯上麻烦就很多
    损失也很大。另外还有个相对比较麻烦的是资金回流。初期交易量小的时候，我觉得不需要考虑这个问题。如果交易量大的话，香港公司，美国公司就很有必要了。这个有兴趣回头我再展开讲。


    # 4. 代发时产品遇到纠纷，退换货之类的怎么处理？


    Lin: 看问题。如果是我们的问题，直接退款，产品也不要求客户退回 了。如果是客户的问题，给些下次购物的优惠券。还不行？就商量部分退款。


    # 5. 货物的关税怎么处理，发货量太大海关不会限制？


    Lin: 走小包，没有关税。税其实都已经算在运费里了。我们没有遇到限制的情况。发货量大，反而运费更加便宜了。哈哈'
  merge: -1
  img_proc: true
- pgno: 141
  md: '6. 客户群体主要是哪些人（人群标签）？销售国家占比情况是怎么样的？以及主流国家的产品侧重点有什么区别？


    Lin: 看你的产品。每个人的情况不同，没法以点盖面。我们自己的产品累计出来的数据就是 40-65 + 岁这个群体女性。国家占比是 Tier 1 Country
    (US/CA/UK/AU/NZ) 占比最高：达到 70% 其它国家分剩下的。主流国家基本相同的购物需求。我们有个经验就是，美国能卖的动的 其它欧美国家基本没什么问题。要知道全世界有两个国家的市场是最大的，一个是美国，另外一个就是中国，哈哈。


    7. 这几年做跨境电商，有没有踩坑的经历？需要注意哪些禁忌？


    Lin: 对产品执念不要太深。一个产品卖不动的话，如果执念太深会耗费太多的时间成本。我们要找的 我们能力范围内能够成功营销出去的产品。然后，另外就是我们目前可以说是几乎是零库存。除了春节会稍微备些货以外，其余时间基本不备货的，这也是
    dropshipping 优势之一。另外一个就是每家企业都会重视的问题就是：资金流是否健康。这个我就不展开多讲了。'
