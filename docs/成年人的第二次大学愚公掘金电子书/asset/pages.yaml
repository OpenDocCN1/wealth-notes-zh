- pgno: 35
  md: '资源站是提供给影视站采集用的，所有的资源都会有专人进行维护，每天都会更新资源。做资源的人为了给不懂技术的新站长使用，一般都会制作一个简易的采集教程。有的资源站还会把伦理资源放出来，供站长筛选。资源站里的资源能涵盖市面上绝大多数的观影需求(如果缺片还可以联系管理添加)。


    ![](img/5688f8284c7103ed77046cfddaf3da13_35_0.png)


    资源站一般都长这样。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '资源站一般都会把视频资源加上水印(资源站网址、滚动广告), 然后把处理好的视频上传到云端(这又涉及了一个灰产领域, 感兴趣的话可以继续深入分享), 再把视频链接提供给站长们。刚刚影视站里第二张截图的滚动广告就是这种。


    资源站一般也会作为解析接口的备用资源，因为解析接口由于技术 和成本的原因 不能解析全部类型的视频(为什么不能解析呢？这得说视频平台安全机制了，感兴趣的话可以继续深入分享)，那么就会将不能解析的视频用资源站作为备用播放。资源站在视频中添加水印，滚屏广告(一般色情、菠菜居多)。去站长的群撒广告推广靠口碑传播就行了。


    # # 解析接口


    # ## 刚刚提到了解析接口


    解析接口的功能就是通过技术手段，把一些视频突破了平台的限制，如去90秒广告、去除中间广告、去除贴片广告、去除VIP限制、去除购买电影券的限制等。**解析接口分为两类，收费和免费。**'
  merge: -1
  img_proc: true
- pgno: 37
  md: '免费接口是长这样的 http://jx.xxxxx.com/?url=要破解的视频地址。接口是可以判断用户使用什么设备播放的，大部分的接口都是在移动端有广告，部分接口PC端有广告，有精明的会在晚8-10点投广告。提示：链接是假的，这里只是展示下接口的格式


    ![](img/5688f8284c7103ed77046cfddaf3da13_37_0.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/5688f8284c7103ed77046cfddaf3da13_38_0.png)


    这是解析接口正在解析视频。


    收费的接口大概可以分为两套收费标准，一是包月XX元钱，二是按量解析一次XX「解析点」，解析接口其实和github的一个开源项目(you-get)有些相似，如果感兴趣
    的可以了解下 https://github.com/soimort/you-get 。


    解析接口都支持什么解析平台呢 说出来吓你一跳。'
