  md: '# 花爷对短视频vlog化趋势的预测


    上周郑璐璐同学关于vlog的分享 (https://t.zsxq.com/R3zfUjy)，建议花友们都看一下，特别是对短视频领域感兴趣的。


    我在之前的两个问题都聊过短视频，分别是“自媒体如何转行做短视频” (https://t.zsxq.com/rJMbU7U) 和“理解短视频趋势，做好健康养生短视频”
    (https://t.zsxq.com/BI6QfUv) 。


    核心就是，短视频从粗制滥造的红利期，到搬运党，到现在的原创党，一直在进化。


    但远远还没进化到头。'
  merge: -1
  img_proc: true
- pgno: 1028
  md: '目前短视频的问题非常明显，娱乐化、同质化严重，带货能力单一，特别是抖音（快手的IP变现能力更强一些），粉丝黏性相较其他平台，非常一般。


    而任何一个健康的生态，一定要允许更多的中小V有创收能力，即粉丝虽然不算多，但因为精准垂直，粉丝付费能力强，中小V也可以活得很好。


    这也就是我常提到的，个人小团队渗透到各个毛细血管，市场才会更扎实。


    所以，我个人预测，短视频经过vlog化的加工，是未来一部分中小V的短视频趋势。当然，跟传统的小清新的vlog有区别，短视频vlog化之后，更像是兼顾了观众口味、和IP塑造的故事片。


    说得有点玄乎，举个例子，现在你是个果农，可能你随手拍个果园橙子又大又水嫩的短视频一上传，就有人找你买。但这种视频没有任何门槛，一旦效果不错，马上有大批团队跟进，个人没有任何优势。'
  merge: -1
  img_proc: true
- pgno: 1029
  md: '但如果你拍一段视频，不仅讲橙子好，还像vlog一样，把你种橙子的过程、你与果园的故事拍下来，那基本等同于一段观众爱看的个人宣传片。


    前后两者核心的区别在于，前者你只是买橙子的渠道之一，就像马路上遇到的小贩；后者用户才真正成为你的粉丝，它们爱的不仅是产品，更是你这个人，你的生活，你的态度。


    “信任货币”总有一天会变成“真实货币”。


