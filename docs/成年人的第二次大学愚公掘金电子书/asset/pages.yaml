- pgno: 736
  md: '移动互联网时代卖课，重点除了质量，还有宣传。宣传运营决定是否购买，质量决定是否有人复购。你去看十点读书、得到里那些大卖的课，其实也就是录音，用电脑录音和用几万的麦克风录音有什么区别？用户真的不怎么在乎，无非是课卖的好了，再花钱升级设备，锦上添花用的。


    所以新手的设备，保证录出来的课程效果合格即可，很多vlog视频博主，也都是手机录的而已。


    重点放在课程卖点、宣发渠道和课程质量上。


    # 2.去哪里获取做课的知识？


    第一，自己多看别人的课，不仅要看课，还要研究宣发的整个过程。也不要买特别贵的，荔枝微课、千聊、喜马拉雅的课程很多，找到和你的目标类似的课程，研究别人所有的历史课程，看看别人从哪个节点开始爆发的，看看别人犯过什么错误。


