- pgno: 841
  md: '公众号主要就是你说的这两个，西瓜数据和新榜，这俩只能看到一些基础数据，但很多号都有刷数据，如果投大号想判断数据真实性，最好爬虫抓一下它的文章阅读量上升轨迹，正常的阅读量上升都是先急后缓、成一道平滑曲线的，如果是刷数据，会再某一个时间阅读量不合理的猛涨。


    其他投放渠道的话，比较大的分类就是SEM（搜索关键词竞价）和信息流广告（头条、微博、微信、抖音等都有），SEM可以看百度和谷歌的第三方工具，信息流广告可以用信息流雷达看。


    还有一种投放就是小红书、微博博主的投放，需要自己上门联系。博主们的数据同样可能有水分，需要人工判断一下，博主是否有强烈的个人风格、风格和产品是否相符。


    但总归来看，都是参考，具体效果需要少量的投放看一看，投放本身就是个不断测试、调整的过程。'
