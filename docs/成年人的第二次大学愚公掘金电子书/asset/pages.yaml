- pgno: 439
  md: '其实，上面所用的物流叫国际小包，包裹重量要求在2kg以下，根据国家地区不同，时效差别很大，10-90天，甚至更长都有。国际快递虽然快，但是价格太高，一般适合高价值的物品。


    国际小包的运作，是基于万国邮联的体系。就是我们小时候交笔友寄信（现在的小朋友可能没这个概念了),现在寄明信片这样的邮政系统。


    **跟信件一样，国际小包分为平邮和挂号**，两者区别就是有没有跟踪信息，所以挂号也比平邮多个一个挂号费，大概十多二十RMB。平邮的计费就是按克计费，比如现在速卖通官方到俄罗斯平邮渠道，大概是100RMB/kg。上面一个小戒指包裹只有10多克的话，运费只要一块多。这就不难明白为什么能0.99刀包邮了。


    万国邮联协议下，按国家发达程度分为几等，费用不同。中国被列为发展中国家，等级较低，所以费用很低。'
  merge: -1
  img_proc: true
