- pgno: 612
  md: '# 回答：


    看了下你的思路和脑图，感觉你问的问题，并不是最重要的，我就不按照你提问的顺序回答了。


    +   你的定位有问题：


    首先，先找从餐饮行业入手，再切到个人创业——几乎不可能。餐饮行业特别垂直，个人创业又特别宽泛，特别垂直的行业想跃迁到特别宽泛的领域，难度大到不可能。


    +   所以，先确定你的定位，给你三个方向：


    +   面向高收入餐饮老板的营销管理内容


    +   面向个人餐饮创业者（或观望创业者）的内容


    +   面向实体行业的营销内容


    以上三者，只能选一个。


    +   是不是选了以上三者之一，就够了？不，还不够细分，我给你举例说明。'
  merge: -1
  img_proc: true
- pgno: 613
  md: '+   a.面向高收入餐饮老板做内容，一般变现方式是线下培训，客单价高（至少五位数）。可以参考我们社群里的@段宏奕老师，他在餐饮老板的营销领域里，又切了一个更细分的领域，餐饮店的门头和菜单战略。


    +   b.面向个人餐饮创业者，可以参考我经常念叨的“开店笔记”。开店笔记主要只满足一个需求：大量基层人民想开店，但不懂加盟、选址、运营的坑，又没有人指导。所以开店笔记靠满足这个需求起家，目前知识星球年收入近两百万，其中还有学员花更多钱加盟他的品牌店。这是个典型双赢的商业模式，起点来自于一个很细分的需求。


    +   c.面向实体行业的营销内容——如果你真的想做个人创业这个领域的生意，那至少得细分到实体行业创业还是互联网创业，不能只深耕垂直行业。小马宋是这个模式的成功案例，但我建议你别选这个模式，难度太大。


    +   4. 所以发现了吗，你选的领域越细分，满足的需求越稀缺，成功难度就越小。上面abc三种，明显c的难度是最大的，而且不止大一点点。'
  merge: -1
  img_proc: true
- pgno: 614
  md: '5.如何把零散知识点融汇成一篇文章？当你确定了上面提到的定位，你的目标人群、你要满足的用户需求就清楚了，我觉得文章框架也就很清楚了。找到用户喜欢的核心论点，再拆分成层层递进的小论点即可。


    明白了吗，同样一件事，有很多事件可以去写。重要的是弄清楚定位，找对视角，所以我才说做自媒体是一门生意，你不是写你爱写的，你是写用户爱看的。


    6. 至于你脑图里划的裂变之类的，属于放大镜性质，当你冷启动成功之后，再试着去做，现在不要考虑这么多，这就是我说的节奏感。


    对了，手机号码资源如何用来涨粉，同样只是一个渠道，可以群发短信引流，但具体发什么，就要看你的定位和引流诱饵设置了。


