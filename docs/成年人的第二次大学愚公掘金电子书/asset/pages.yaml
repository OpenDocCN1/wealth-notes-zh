  md: '那今天我在这里不是要跟大家去分析三高的成因，如何解决啊，这样的一些事情。而是我想跟大家从另外一些角度说说，另外影响餐饮难做的一些其它的情况，第一个情况是什么呢，其实就是现在，做大做强的餐饮企业，真的是强者愈强，越来越厉害了，他们就压缩了很多小餐饮，尤其是创业型餐饮企业的一个生存空间，那么第二个点是什么，第二点就是说，很多人刚开始做餐饮的时候，他们对餐饮行业的有些潜规则，尤其是这个从业人员的这个人心的认知啊，是比较不足的。


