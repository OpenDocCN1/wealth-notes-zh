- pgno: 144
  md: 'Lin: 2个广告优化师，1个选品，2个客服，2个广告视频制作，2个着陆页文案，1个美工。另外发货端全部外包了，我们会有一人专门负责对接供应链这块。个人认为更多的是小而美的品牌红利，第三方平台以亚马逊为例本质上就是美国线上版本的沃尔玛，美国的实体零售很强势，你东西卖的再好，消费者认知的是亚马逊，因为亚马逊有更好更便宜的价格，其次才是产品
    最后才是品牌。数据在亚马逊手里，消费者又对亚马逊忠诚（有的还是P rime 会员）。对商家的品牌的感知是少之又少。以前段剧爆亚马逊上的一个嘉兴出的产品刷爆美国的orolay为例，两个关键词Amazon
    Coat 和Orolay 看看哪个搜索量更高就知道消费的认知到底在哪里了。所以你想做品牌 你想更了解用户，自己直接面向终端消费者会比较好。


