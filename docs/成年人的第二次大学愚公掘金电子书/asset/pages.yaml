  md: '# 想在深圳买一套500万的房子，应该如何做信息储备？


    提问：


    请教花爷，夫妻双方深户。


    如果要在深圳买一套价值 500 万左右的房子，手里至少要储备多少现金才可以上车？


    回答：


    各种贷款额度可能因人而异，但是我怎么知道我要存多少才能上车，这些知识或信息都能通过哪些途径来了解呢？如果计划 2 年后买房，除了攒钱，还需要做哪些准备呢？'
  merge: -1
  img_proc: true
- pgno: 768
  md: '恰好在张哥星球看到你也问了这个问题，不好意思，跟张哥看法不太一样……


    买房子，钱重要么？非常重要。


    但大部分人的问题就是：没钱……


    所以，获取信息、找到内行人对普通人就很重要，可能一个信息让你省1%，就不是小数目，举几个例子：


    1.大部分人买房第一反应是中介，但屁股决定脑袋。中介的利益是提成，不是帮你买到最划算的房子。一套500万A级房和一套450万的B级房，中介为了尽快交易，一定是尽量推荐450万的房子，但500万的A级房对你才是最好的，虽然多花了50万。


    2.可能你碰到500万的A级房，买到就是赚到，但是按正常首付比例，500万的房子要准备接近200万的首付，你没这么多钱。这时候有一种职业叫贷款顾问，可以帮你尽量拿到更多的贷款以及凑首付现金，当然，杠杆风险评估也在考量范围之内。'
  merge: -1
  img_proc: true
- pgno: 769
  md: '+   3.再比如装修也是一个大坑，北上广的装修队选不好，那就不是钱的问题，花钱还讨不了好。


    总结下，你需要什么呢？


    资深的买房人讲解、和你一样的买房人的交流、以往买房人踩过的坑、以及等等。


    这些，不是等你买房才去考虑的，而是你有买房计划开始，就要去链接的。


    具体去哪里找？给你两个思路，第一，知识星球有免费的买房交流，比如上海买房指南、深圳买房指南，以及其他的买房论坛，我们社群里也有深圳的小伙伴，第二，房产相关的课程，附带的交流群。


    最后，给一点忠告：别和人交流之后失去了理智，买房要量力而行，所有把买房和发财梦挂钩的都要长个心眼。'
