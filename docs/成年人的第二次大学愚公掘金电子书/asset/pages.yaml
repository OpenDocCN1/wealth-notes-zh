    8.在线教育目前还算是圈地过程么，一节课的价格整个行业应该比较统一了吧，在什么方面如何能过做到价格差异。师资？学程跟进？线下活动补充？线下教育的内容还是很丰富的，相对而言在线教育的竞争力主要集中在哪里。


    Angela： 线上培训还是有明显优势的。


    (1) 不受场地的限制，互联网的兴起让所有课程只需要在虚拟空间里就得以传授完成，大大节省了成本。


    (2) 不受时间限制，只要有网络，无论何时都可以学，对于碎片化时间的利用，这一点绝对碾压了线下教育。


    (3) 优秀教育资源的普惠式传达，优秀的教学资源在三线城市也得以普及，打破了地域局限性。'
