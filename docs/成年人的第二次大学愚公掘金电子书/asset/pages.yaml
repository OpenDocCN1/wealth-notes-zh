- pgno: 452
  md: '# 分享：


    # 一、网格交易简介


    什么是网格交易：假设一个交易品种的价格在[P0-P10]之间，按照等差数列或者等比数列将其价格设置为序列P0,P1,P2,...,P10，其中，每一个价格称之为“一网”。


    按照既定的价格序列，当价格降低某个序列时进入买入，当价格上升至某个序列时进行卖出，即为网格交易。


    譬如：当价格从P6降至P5，那么按照P5的价格买入一定的份额；当价格再从P5升至P6，那么按照P6的价格将已有的份额进行卖出，从而获利。


    # 二、网格交易的适用性


    # 1、网格交易适合的品种：


    一个交易品种长期来看没有什么涨跌幅，中短期来看波动不小，并且不会存在退市等毁灭性的品种，比如上证指数，这么多年了还是在3000点徘徊，但是却中间发生了巨大的波动。'
  merge: -1
  img_proc: true
- pgno: 453
  md: '# ## 2、网格交易不适合的场景：


    +   1. 牛市的一直涨，每次盈利较少，不如长期持有。

    2. 熊市的一直跌，会导致仓位越来越重，占用资金。

    3. 波动较小，导致很长时间都难以进行一次交易。


    价格差如何设定以及每次买入的金额：一般而言价格差在3%-5%较为合适，可以根据个人的喜好进行选择，当价格差选择较小的时候，交易次数较为频繁；当价格差选择较大的时候，交易次数则较少。个人根据自己投入资金量，列好表格后做好压力测试(即全部买入而不卖出时所需要的资金量)即可。每次买入的金额可以一样，也可以不同，一般低位是买的较多，高位时买的较少，但一定要做好压力测试。


    # ## 三、网格实操起源


    说来幸运，在跟随"长赢指数投资计划"近一年后，计划管理人“ETF拯救世界”于今年5月左右陆续分享了三篇关于网格交易的系列文章。'
  merge: -1
  img_proc: true
- pgno: 454
  md: '诚如契诃夫所言“如果在第一幕里出现一把枪,那么在第三幕枪一定要响。”，在学习了上述三篇网格交易的文章之后，我便在某证券开通了交易账号，对华宝油气(162411)开始了我的网格实操。


    刚才谈到网格交易适合长期不会死、短期有波动的品种，因此ETF指数基金是较为适合的交易品种。我这里用于网格交易的华宝油气便是一种指数型基金其，全称为“华宝标普石油指数”。


