- pgno: 880
  md: '即兴发挥能力不行，那就写逐字稿，反复改稿子，最后背下来，背书总比即兴发挥强吧？


    # 2.对着镜子，一个人多练


    对着镜子，一个人模拟演讲，一字不差的讲，一遍一遍的讲。


    讲到你滚瓜烂熟、倒背如流为止。


    这个过程不仅在锻炼演讲能力，也是在积累信心。真到了台上，第一次上台，乌压压一片人，难免有些紧张，怎么办？


    背书吧，用本能把内容背下来。


    只要你能背得下来，有了第一次，多几次之后就不会那么紧张了。


    最后推荐一篇快刀青衣的文章，此人是“得到”的CTO，这篇文章是他作为技术人，第一次在大众面前进行“得到”三周年演讲后，写下的演讲心得。'
