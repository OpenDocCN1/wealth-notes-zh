- pgno: 883
  md: '”


    # 回答：


    我发现大多数在事业方面还不得要领、找不到方向的人，主要分两类。


    第一类，确实本身没有太多资源、经验、能力，不知道从哪里入手。


    第二类，接触了不少行业，有一定的资源和经验，所以对未来充满了想法，以至于不知道到底哪个想法好。


    提问的这位花友，就属于后者。


    这个世界上有很多行业，能成事的人有很多。如果看别人这样成功了、那样也成功了，心就乱了。


    能成事的方向有很多，能长久的成事的方向，只有一个，它一定符合以下特质：


    +   1.和你的个性吻合'
