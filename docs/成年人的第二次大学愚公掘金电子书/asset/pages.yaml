- pgno: 662
  md: '# 如何培养自己写出像花爷一样有深度的文章？


    **提问：**


    花友提问：“花爷，您是如何把文章写的这么有深度，又有逻辑性呢，感觉每篇文章写的内容您都了解的很彻底，又是怎么做到的呢？如果想要培养写这么深度的文章和培养逻辑性您有什么好的建议呢？谢谢”


    **回答：**


    先解释一个误区，很多人误会了“深度”这个词。


    打个比如，如果你写如何做一个活动，策划、执行、执行，事无巨细，可能字字珠玑，但这不叫“深度”，这叫“干货”。'
  merge: -1
  img_proc: true
- pgno: 663
  md: '真正的“深度”，不是内容多、全，而是“观点新”。


    你感受一下，“干货”往往具有实操性，门槛高，不容易火。而“深度文”往往大 家都能参与讨论，又折服于作者的新颖观点。


    所以怎么探索“深度”，找到新观点呢？


    首先是切入点，往往是时事、节日热点、或者行业话 题，就拿刚刚过去的母亲节举例吧。


    确定了主题是母亲节，这时候别写，千万别，先去找别人以前都是怎么写母亲节的。


    把大多数人写过的母亲节视角，全部列出来，然后这些 视角，通通pass掉，从反方向去找视角。


    别人写感谢母亲，你找一个新视角：我恨妈妈。


    别人写妈妈牵挂自己，你找一个新视角：妈妈每天在外 旅游从来不管我。


    可能你要问了，这么写不是很负能量吗？'
  merge: -1
  img_proc: true
- pgno: 664
  md: '重点来了，找到的新视角可能是负面的、不好的，你需要加一个转折性的结尾，升华到正能量。


    比如，大家妈妈都很爱孩子——我的妈妈从小对我狠——我恨我妈妈，刺骨的恨，长大后我用冷暴力报复妈妈——偶然回家，才发现妈妈还在惦记我，对我狠是为我好，而她其实失去了很多………


    发现了没，这就构成了一个典型的故事，如果你看过《都挺好》，你就知道前面苏大强越作，结尾苏大强老年痴呆在巷子里的那段戏就越动人。


    之前咪蒙虽然狗血，但她的几篇文章视角真的很好，比如情人节，她不写情人，而是采访在这天去离婚的夫妻。


    当然，我的文章娱乐性比较小，过程会更艰难一点，比如写中国经济那篇，有些传统经济观点你故意往反方向写，很难圆回来。这要求你的阅读量有足够的广度，可以持续的去找刷新认知的视角。'
