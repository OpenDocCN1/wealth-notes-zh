  md: '现在有一个自己看来是机会的事，县城有个福安特产店，卖当季水果及福安特产，当季的水果（比如:橙子，枇杷，水蜜桃，葡萄）在本地很出名，购买者多，口碑好，店老板接触过，是个务实做产品的，但文化不高，缺乏线上销售的知识及技巧，有意愿拓宽线上渠道，水果也有销往少数几个外省，都是靠店里口碑卖货。因为之前接触时有跟老板聊过线上销售的事，他觉得我可以跟他合作。但具体合作什么，我们双方都不清楚。


