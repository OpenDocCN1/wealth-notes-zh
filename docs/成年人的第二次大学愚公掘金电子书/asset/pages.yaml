- pgno: 480
  md: '我有打算下半年自己做点小生意，目前却毫无头绪，之前在群里看到有花友推荐他化自在天的公众号，想花三千多跟着学营销这个想法实际吗？


    提问：


    花爷好，我有打算下半年自己做点小生意，目前却毫无头绪，之前在群里看到有花友推荐他化自在天的公众号，想花三千多跟着学营销这个想法实际吗？'
  merge: -1
  img_proc: true
- pgno: 481
  md: '# **回答：**


    他化自在天的课我没学过，所以没办法直接告诉你这课值不值。包括以后很多朋友，可能来问xxx的课值不值，但我其实了解、能担保质量的人不多，很多人的课我都没上过，都没法直接回答值不值的问题。


    但无妨，我说过，在我们圈子里，除了开眼界，最重要的是学会如何思考和逻辑分析，终有一天，你的这些虚拟资产会兑换成财富。我们不如换个角度，当我们想要学一门有点小贵的课程的时候，如何最大限度的保证课程符合自己的预期呢？


    # **1.确保它是否有用**


    用户对一门课，最基础的需求是有用。怎么定义有用呢？就是课程提供的，和用户想要的，两边恰好契合。这就又拆解出两个问题：


    +   a. 你知道自己想要什么吗？'
  merge: -1
  img_proc: true
- pgno: 482
  md: '你说自己想做点小生意，想要学点营销。但是营销其实分很多种，你让你一个BAT的活动运营，去做线下实体店的营销，那他就是再牛逼也无济于事。所以你需要问问自己，你到底做什么生意？线上还是线下？什么行业？营销是为了获客？还是促进付费？还是做留存和复购？


    你可能会说，这些我都不懂啊，我是小白啊！对，既然你是小白，那就不要上来就买三千的课程，去买一些几十块钱的同类型课程或者书籍，不用特别高深，只要能让你看懂基础概念，对时长有个认识就可以。等你明白了自己具体需要什么，再去买贵的、实操性的课程。


    # **b. 课程可以提供什么？**


    你可能会说，课程有个大纲，就提供大纲上那些东西呗！我可以负责告诉你，任何一个老师，包括我，都有自己的专长和重点。不要对大纲上的所有内容都报有期望，看看课程讲师的历史文章，搞清楚他最擅长的是品牌推广、还是玩流量获客、还是其他的领域。


    确保a、b两者契合，是你购买课程的基础。'
  merge: -1
  img_proc: true
- pgno: 483
  md: '# 2.确保它不能提供什么


    做生意的人，喜欢撩动用户的G点，用户发现这东西和我的需求匹配，一下子冲动就买了。但我们作为用户，还需要确认，这件商品不能提供什么。


    道理其实很简单，没有任何一件商品是完美的，一定有它的缺陷，万一它的缺陷恰好是被你忽略的需求，那就坏事了。很多人逛淘宝会专门去看差评，就是这个道理。


    所以，不妨逼自己思考一把，这门营销课有什么是不能提供的，不能提供上下游资源？不能提供手把手实操？如果这些不能提供的东西，你觉得都无所谓，那 就没问题了。


    # 3.确保它是否值得


    完成上面两点后，还剩最后一个问题，这门课到底值不值这么多钱呢？我们一定要清楚的认识到，价格不是由价值决定的，而是由供需关系决定的。'
  merge: -1
  img_proc: true
- pgno: 484
  md: '前阵子华与华（我推荐过的一个品牌营销团队）开了一堂课，三天线下课售价9.9万，四十个名额一会儿就抢光了。你说这9.9万的课，和市面上9.9元的课有什么差别吗？我觉得对于一个小白来说，没差别，反正9.9万的课小白也理解不了。但对老板们来说，他们不差这个钱，他们就要听最顶尖的华与华讲课，所以9.9万对他们来说值得不得了。


    所以，确保课程是否值得售价，就不是看它教什么，而是看市面上其他类似的课程教什么、价格多少。教营销的课很多，各种细分领域的营销课更多（比如实体店、电商等等），多看看，不坏事。


    最后，当你真的按上面三点去摸索、思考以后，也许你会发现，你甚至可能不需要再去上课了，因为市面上浩瀚的基础营销知识，完全够一个小白起步练手了。当然，如果你觉得还需要去上课，也可以，这时候你已经做好充分准备了。'
  merge: -1
  img_proc: true
- pgno: 485
  md: '最后的最後，我建议所有人，不妨再拔高一层想一想：如果你不是买课的，你是卖课的，你是不是也要这样去思考？思考用户需要什么、思考自己能提供什么、思考自己的缺陷然后做好准备、思考市场上的供需关系再定价……


    再拔高一层呢，不仅是卖课的，是不是所有的生意，都可以这样去思考？所以我说，很多时候结果都不重要了，你每向上思考一层，就离商业社会的元规则更近一层，从开眼、到复制、到贯通，就是如此了。


    又是一千五百字的回答，看过的朋友点个赞让我知道一下哈哈，欢迎大家把自己的思考评论出来。


