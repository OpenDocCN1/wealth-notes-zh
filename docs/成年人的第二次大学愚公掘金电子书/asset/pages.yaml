- pgno: 602
  md: '# 名创优品的商业模式：借钱给老百姓加盟自己


    提问：


    花友提问：“花爷，请问是否了解名创优品，对于没做过零售的人加盟它创业成功可能性怎么样？听说只需要选好地址，后期运营人员和配货都是厂家负责。”


    回答：


    名创优品是原先哎呀呀的老总叶国富做的，在供应链和资本上有非常硬的实力。


    表面上，名创优品是利用叶国富的供应链资源压低成

    本，做一个国内的廉价版无印良品，利润薄没关系，只要商品种类多、店铺够多、销量都大，就可以盈利。'
  merge: -1
  img_proc: true
- pgno: 603
  md: '这个逻辑对吗？对，但名创优品远不止这么简单。


    花爷常常念叨，一定要做长期的事。同样的，当我们分析一门生意，也要用长期的眼光去分析。名创优品刚出来的时候，确实占据先发优势，但再往后呢？全中国有供应链资源的不止叶国富一个，一定有后来者加入竞争，在名创优品初期品牌和规模效应还没有形成的时候，如果被后来者挑战，很可能失去先发优势。


    所以，名创优品在早期，发展一定要快，开店一定要多，规模一定要大，才能把先发优势牢牢握在手里。


    这也就是你在问题里提到的，名创优品的加盟门槛非常低，只要交钱，装修、运营、配货，全都不用愁，名创优品给你搞定（全家的加盟模式也类似这样）。


    但名创优品还嫌加盟不够，他们早期不断宣传店铺的盈利神话，给人一种加盟就能大赚一笔的感觉（很早期也确实能赚钱），不仅有钱人心动了，连没钱的草根都心动了。


    这时候，叶国富放出了名创优品真正的绝招：只要交钱就能加盟，但老百姓没钱怎么办？可以借钱给你加盟。'
  merge: -1
  img_proc: true
- pgno: 604
  md: '由于叶国富手里还有金融公司，可以向加盟商提供分期

    贷款，所以就变成了：一批被名创优品的造富神话冲昏

    头的人们，借叶国富的分期贷款，再交给叶国富加盟名

    创优品创业。真的，第一次把这事搞明白的时候我都震

    惊了……


    再回到我们说的，用长期的眼光看问题。一批借钱创业

    的人入局加盟后，情势会如何转变？很显然，市场上开

    了太多名创优品。本来早期的火爆生意就很难维持，再

    加上加盟商互相挤压，很多店都倒闭关门，或者勉强维

    持着。


    所以你说，只需要选好地址就能赚钱，这话对吗？其实

    是对的。但什么是好地址？好地址的标准会不会不断提

    高，导致你现在认为的好地址以后就不好了？这个对个

    人眼光的要求极高。总之，这个世界是动态的、长期

    的，100%长期赚钱的生意，不会这么容易发生。


    ![](img/5688f8284c7103ed77046cfddaf3da13_604_0.png)'
