- pgno: 43
  md: '这是曾经让我激动的一个数据（APP所有的所有均一人开发），后来嘛，APP新增被拦截了，导致每日新增也就一千，或者大几百，再加上印了一批卡，找朋友又推广了一次，还是没做成，就减少维护了。现在就在APP里接点菠菜小广告，偶尔帮朋友引个流，也卖源码，也帮别人搭建APP(我的项目框架可以无成本的复制多个APP,后台有好几十动态开关控制APP)。这个APP已经勉强完成了当初预期的90%，没必要去耗费大量时间去增加那剩下的10%(产品体验、功能)。出于安全考虑，纠结了很久还是不打算把APP分享给大家体验了，毕竟这要是真出事可是要喝茶的，但如果有朋友想要合作的可以来私聊我（公司、个人均可）。现在APP基本不怎么维护，但也很稳定了，我就逐渐把重心放到其他方面上，因为我知道
