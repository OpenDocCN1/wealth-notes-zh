  md: '# 以前做k12培训，想转型家庭教育自媒体，应该注意什么？


    提问：


    花爷好，关注你一个多月了（看背后～）今天第一次提问。


    我之前是做线下k12培训，算是创业吧，现在因为一些原因把机构转手了。自己16年开始涉猎了公众号，但真正关注了解是进入你的社群后。有两个问题想向你请教一下：


    1.本身是做教育创业，现在想从家庭教育方向切入自媒体这块，你觉得这个方向可行性咋样，有什么好的定位建议吗？'
  merge: -1
  img_proc: true
- pgno: 639
  md: '+   2.最近在 看一些自媒号，发现很多群是付费进入的，我自己也觉得花了钱自己才会重视，而且花钱买的东西确实质量好。但如何筛选合适购买的付费内容，不是看到题主宣传口号购买，这样可以省事省钱。


    谢谢花爷


    # 回答：


    +   1. k12培训和家庭教育自媒体，差别其实很大。k12培训是面向应试为主的，是军体拳，只要训练得当，就能达到合格的标准。而家庭教育自媒体是面向家长的心法，没有严格的合格标准。


    我举个例子，杨永信电击上网少年，大家都觉得不对，为什么还有家长愿意把孩子往杨永信那送，因为就是有一帮大笨蛋家长，育儿标准不是盼着孩子好，而是“孩子要听话”，杨永信电击完美符合他们的需求。


    所以，如果你本身擅长的是提高孩子的应试成绩，那么最高的方法不是写应试技巧，而是先写清华北大学霸父母的育儿经验，把你的应试技巧、学习方法融入到学霸父母的心得里去。'
