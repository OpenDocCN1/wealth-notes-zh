- pgno: 817
  md: '# 如何确定是否适合在一家公司继续待下去或者辞职呢？


    提问：


    花爷，请问如何确定还是否适合在一家公司继续呆下去或者辞职呢？(因为某些原因，我就匿名提问了)


    回答：


    其实特别简单，职场也是一门生意，公司和个人各取所需。现在个人要跳槽，理由有且只有一个：


    在这家公司工作获得的收益，大于另一家公司的收益。'
  merge: -1
  img_proc: true
- pgno: 818
  md: '这里的收益，不仅是工资，包括未来的个人发展空间、成长速度，甚至家庭、身体等因素。


    每个人衡量收益的观念是不一样的，可能有的人家庭观念很重，就喜欢呆在老家，有的人事业心很强，愿意去北上广闯，都很正常。


    就我个人而言，未来更好的发展，是比工资高低、压力大小更重要的事情，这里的发展空间包括：工作技能的成长、资源的积累、与个人长期目标的契合度、公司和业务对自己履历的美化作用等等。


    简单来说，如果你目前的公司，发展空间很好，那不要轻易为了工资高一两千块钱跳槽，要好好衡量一下，如果你目前的公司，发展空间有限，那哪怕跳槽工资涨幅不大，也建议跳到更有发展空间的公司的去。


    别在垃圾学校当学霸，有机会一定要上清华啊！'
