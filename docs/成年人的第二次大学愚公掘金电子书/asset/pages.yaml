- pgno: 491
  md: '# 跳槽offer该如何选择？


    **提问：**

    “愚公掘金”社群里有位朋友，最近遇到跳槽offer选择的问题，私聊问我。

    问题是这样（已经做过脱敏处理）：

    “花爷您好！我叫K，美国排名前十的大学毕业。

    毕业后加入了一家区块链公司，已经工作一年。

    作为您的新粉，第一时间购买了你的社群，您的文章也让我有很多获益，感谢花爷！

    问题可能比较长，我先打在这里，花爷您有时间就看一下吧~'
  merge: -1
  img_proc: true
- pgno: 492
  md: '因为区块链行业下行，我目前准备跳槽，拿到了两个offer。


    一个是传统大企业的岗位，负责出海东南亚的，主要做市场调研和对接。


    另一个是小有名气的创业团队，做职场社群和在线教育。


    两份工作总体收入差不多，到手每年20万的样子。


    但传统大企业月薪少，年终奖8-10个月。


    创业团队月薪高，年终奖少。


    总体收入两家是差不多的。


    另外传统大企业因为做出海，需要经常出差，加班也挺严重，工作强度上看起来。


    创业团队貌似略好一点。


    实在非常头疼，请问我该怎么选？”


    **回答：**


    花爷的回答（一开始没写这么多，后来扩写了一下）：'
  merge: -1
  img_proc: true
- pgno: 493
  md: 'K你好。


    去国企还是私企、去大公司还是创业公司，这是很多人的老大难问题。


    最近流行一种说法：


    年轻人去了大公司就是一颗螺丝钉，在大公司呆几年你就废了。


    这句话对吗？当然不对。


    咱们一点一点分析。


    看你的背景介绍，绝对算是学霸级的。


    美国前十的名校，毕业一年，年薪20万。


    说明你能力还是蛮强的，大部分人，这辈子是很难有这么高起点的。


    但是，我也常常强调：


    能力是一回事，眼界和思维方式，又是另一回事。


    比如现在回到一年前，你刚毕业的时候。'
  merge: -1
  img_proc: true
- pgno: 494
  md: '那时候区块链正是风口，政府、资本都在推。


    公司钱给的也到位，正合适。


    你的能力，可以让你获得你想要的东西。


    但你現在回头看，不管区块链如何发展，其实去年区块链企业的泡沫，还是蛮明显的。


    仅仅一年之后，你是不是发现，在区块链公司工作其实还蛮尴尬的。


    当初的风口、高薪，好像都以前那么重要了。


    当然，一年前你還是应届毕业生。


    没有职业规划，看不清未来，是很正常的。


    但这件事应该让你意识到：


    有能力，可以获得你想要的。


    但有能力却没有眼界，你就看不清你想要的，到底有没有想象中那么重要。


    打个比方，现在让你从水和美金里只挑一个，独自去旅行。'
  merge: -1
  img_proc: true
- pgno: 495
  md: '如果把你丢在荒芜一人的沙漠，只带有钱有用吗？


    没用，没地儿花去。


    如果你去的是美国，只带水有用吗？


    也没用，21世纪了，谁还能跟你以物易物啊？


    如果你的未来是一串数字。


    能力就是开头那个1，眼界是跟在1后面的0。


    你的未来，没有1当然不行，但只有1，没有0，未来也就做小了。


    那怎么才能以更高更远的眼界，去看待问题呢？


    花爷有个思考的方法，我喜欢称之为，“穿越式思考”。


    所谓穿越式思考，就是假想自己穿越了，切身实地地想一想：


    如果你是几年后的自己，你希望现在的自己，做点什么？


    比如K同学的这个问题，你有没有想过。


    两三年后，你可能又一次面临跳槽。'
