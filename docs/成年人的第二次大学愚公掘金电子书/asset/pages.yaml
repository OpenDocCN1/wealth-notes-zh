  md: '# 有十年经营装修公司的经验，想进互联网行业创业有什么好的建议？


    提问：


    花爷好，我87年的，在杭州南京经营装修公司十年，目前还算稳定。个人想进入互联网行业创业，最好是带有趋势性和复利性的领悟，想找个人带或合作。请问花爷和球友有什么好建议么？感谢，有兴趣的球友也可以加我微信聊聊，13750809250


    回答：'
  merge: -1
  img_proc: true
- pgno: 829
  md: '你问有哪些领域适合进入创业——这个问题本身在互联网行业就不成立，任何一个领域都能成事，创业者永远选择适合自己的领域，所谓适合，除了趋势红利，更重要的是经验和资源。


    不过你既然问了，我还是结合你的装修公司的经历，聊聊我的思路：


    **1.无论是国家高速发展，还是经济下行，教育行业一定是个好行业。这里的教育，不仅是小孩子读书，成人教育也在内。**


    上一代人受教育程度有限，消费观保守，但随着八零九零成为社会主流，加上互联网对付费习惯的促进，成人付费学习一定会成为主流，主流到你不付费生意都很难做、职场也很难突破。


    除了时代造成的认知壁垒，不同城市、不同行业、不同收入阶层，信息差太大了，你今天在上海听起来非常基础的互联网理论，去给三线城市的互联网人讲，去给传统企业老板讲，能把他们当场震住，一点都不夸张。'
  merge: -1
  img_proc: true
- pgno: 830
  md: '2. 信息差存在，贩卖信息差就像古代跨地区卖货一样有利可图，更棒的是，古代卖货还是承担运输、损耗的成本，贩卖知识的边际成本很低，一堂课100人听和10000人听，人均成本差别不是特别大。


    3. 就你自己的情况来看，你做装修公司，我第一下想到的就是：


