  md: '# 医药代表如何拓宽思路?


    提问：


    之前花友提问，发到星球上来，主要聊“医药代表如何拓宽思路”。


    “我是生物制药专业毕业，今年30岁，在医药行业工作7年，工作内容是：负责A公司在医院药品的销售，根据销量拿提成，即医药代表，工资一个月在1W左右。目前遇到的困境：国家医药反腐、降低药占比、医保限费、报销合规，简而言之，大环境不好，外企、国企的日子都不好过。这7年得到的：湖北J市的医院资源。希望咨询的问题：从花爷的角度看，我是不是该转行了？又该如何减少试错的成本？”'
  merge: -1
  img_proc: true
- pgno: 509
  md: '回答：


    医药代表这几年确实大环境是向下的，根据我个人经验，1W月薪在行业应该算不上顶尖水平，不过咱们这里不聊怎么提高销售业绩了，你也不是问的这个。


    应不应该转行？我觉得不应该，你七年的积累都在医院资料这一块儿，如果不是在其他领域有特别大的优势，不建议转行，而是应该考虑拓宽业务边界。在医药这个领域，所谓拓宽业务边界，大多是这几个方向：


    # 1.医院周边产品


    能拿到医院的内部使用产品，比如口罩、护肤产品等等。有特定的一波人，很吃医院内部产品这一套，特别是皮肤、儿科、慢病这几块，全国都很有市场。


    # 2.自制产品'
  merge: -1
  img_proc: true
- pgno: 510
  md: '如果你认识一些朋友，可能会做一些自制的产品，主要是护肤美妆类、营养保健（益生菌之类的）等等。这些产品虽然是自制的，但因为本身门槛不高，有些其实还蛮好用的。你可以选择性的加入他们做兼职销售（如果你有资源，自己做也不是不行），然后找一些认识的医生做做背书、推荐，只要效果不错，用户会积累起来的。


    # 3. 配套的医疗服务


    营养、减肥、中医之类的垂直领域，很多用户其实是有长期陪护需求的——简单说就是社群，减肥营、养生群之类的。这类社群，需要医生专家坐镇（你可以找认识的朋友），需要懂运营的人维护（医生不懂，你可以担任），这个模式就需要医生有一点运营思维、你有一点专业医学尝试了。


    以上三个，举个例子，帮你开开思路，核心无非是：医疗是个有无数垂直细分领域的行业，比如过敏，可能有皮肤过敏、宝宝过敏、鼻炎过敏等等，不要贪多，抓住一点，满足用户需求，生意就有机会做的起来，平常要多留心，大众的健康需求往往是低频、刚需、长尾的。'
