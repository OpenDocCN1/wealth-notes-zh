  md: '那如果说我们一共就做一个抖音快手号，就是你自己的号，你整天没事还拿着看，拿着它出去玩儿，那个IP地址整天换，你用养什么号，根本不需要的，你不火的原因就是你的内容不行，内容没有吸引力，用户根本不会给你给反馈，更不会推上热门。


