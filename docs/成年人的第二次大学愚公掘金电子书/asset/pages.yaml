- pgno: 1063
  md: '咱们今天不是上课，就是花爷组个局，很自由的讨论，唯一的限制，就是我在“愚公掘金”社群里反复强调的东西：时间。


    咱们晚上9点正式开始，最迟12点群就会解散，在此期间，大家集中讨论，不要抱着有人传授你自媒体秘籍的心态来，只有参与其中，才是最大的意义。


    讨论分为两部分，第一部分，花爷准备了10个问题，带头和大家讨论；第二部分很简单，大家自由提问，总之12点前都可以继续自由讨论。


    第一部分，花爷准备和大家聊的问题是：


    +   1. 你做自媒体多久了？在哪些平台做？一共有多少粉丝？


    +   2. 你在兼职做自媒体还是全职？大概多久更新一次？每次更新需要花费你多长时间？


