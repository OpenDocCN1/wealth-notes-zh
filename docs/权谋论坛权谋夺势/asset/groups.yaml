    # 权谋应用


    社会，往往是吞噬所有人的社会。非法执法者怎能保证，他自己有日不被另一个非法执法者给办了？前面提到的酷吏们，“苍鹰”郅都被斩，“屠伯”严延年弃市，“乳虎”宁成亡家，张汤死于三长史手，王温舒五族俱灭。这决非世俗意义上的因果报应，但或可视作是一种恶法循环的因果报应。


    社会繁荣和稳定的根本在于设置一个相对公正的制度，尽可能合理地分配利益和财富。稳定的根本在于'
