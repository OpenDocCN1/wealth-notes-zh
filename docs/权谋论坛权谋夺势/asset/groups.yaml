    ## 仕董老板。


    董老板和柳世权的处事风格截然不同，因此不喜欢高俅。


    原因很简单，柳世权开的是赌场，需要地痞、流氓充当打手，所以没事收留一些不务正业的“隔涝汉子”。


    而董老板呢？是个正经生意人，一心想的是自己的药铺生意。


    开药铺顶多需要一个坐堂先生，你们谁没见过哪个开药铺的还需要站俩黑社会打手？


    所以，董老板见了高俅后，肚里寻思：


    “这高俅，我家如何安得着遮着他？若是个志诚老实的人，可以容他在家出入，也教孩儿们学些好；他却是个帮闲破落户，没信的人，亦且当初有过犯来，被断配的人，旧性必一肯改，若留住在家中，倒惹得孩儿们不学好了。”


    董将仕不仅怕高俅一个人胡闹影响自己生意，更怕把自己苦心经营的团队伍带坏了，看来董老板还很懂企业管理的。


    但是，董老板碍于柳世权的情面，还不能不收留高俅，只得“权且欢天喜地相留在家宿歇，每日洒食管待。”


    十多天以后，董将仕终于想出个办法来了，就是将高俅——礼送出境。


    董将仕是这么做的：


    将出一套衣服，写了一封书简，对高俅说道：“小人家下萤火之光，照人不亮，恐后误了足下。我转荐足下与小苏学士处，久后也得个出身。足下意内如何？”


    人家董老板说的多好呀，我们家的光就像萤火虫，照不亮你，怕把人耽误了。换句话说，就是我们水浅，容不下你这条龙。


    所谓小苏学士就是苏轼苏东坡，董老板以帮助高俅进一步发展为借口，决定将高俅这股祸水引向苏东坡。


    那么苏轼见到高俅以后是怎么办的呢？


    苏轼久居官场，也不白给。他早就知道高俅的为人，所以也像董老板来了个礼送出境。


    苏轼心想：“我这里如何安着得他？不如做个人情，他去驸王晋卿府里做个亲随；人都唤他做小王都太尉，他便欢喜这样的人。”


    而且苏轼的效率要比董将仕高，当下苏轼就给董将仕写了封回信，留高俅在府里住了一夜后，第二天就写信将高俅引荐给了小王都太尉。


    这个小王都太尉是哲宗皇帝妹夫，神宗皇帝的驸马，就喜欢主仆这样的人，真是物以类聚，人以群分，小王都太马上收留高俣在府内做个亲随。


    亲随虽然不是什么重要职务，只是中央大员的一个跟班，但是亲随能够接触到重要人物。


    在以后一个偶然的机会里，亲随身份的高俣来到端王府，凭借一脚精湛的球艺，结识了端王。


    端王就是没有登基之前的宋徽宗，宋徽宗登基后，任人唯朋，让高俲担任太尉。高俲也就完成一个从充军配犯到国之重器的华丽转身。


    一个不学无术的市井无赖，最终能够成功上位，里面固然有机遇的原因，有命运的成份，有宋朝皇帝不务正业的大背景在起作用，但大多数人面对负能量的不作为行为则是高俲成功的另一个重要社会原因。


    开药铺的董老板，身为国家高级官员的苏东坡对于高俲这样的浮浪子弟既不批评教育，又不愿拒绝好友的推荐，而是采取一个看似高明的“礼送出境”的办法，将祸水引向别处。


    ### 权谋家如何白手起家


    和曹操有雄才伟略、孙权承继父兄基业不同，刘备似乎是建立在一穷二白的基础上。一个统治者能够白手起家，且屡战屡败、屡败屡战，这期间刘备的用人之术更让人敬佩。


    那刘备虽说是汉景帝中山靖王刘胜的后人，可因为年代久远，本身并不具备号召力，即便是真的，在当时刘繇、刘表、刘岱、刘虞、刘焉、刘璋等人，都是汉高祖的后人，也没有可比性。刘备居然能够脱颖而出，完全是自己魅力的展现。当然刘备和他人不同，最重要的是让人觉得极为真诚。


    其一，穷人的孩子早当家。刘备家里穷，根据当时的户籍显示，刘备只是普通的贫下中农，母亲一贫如洗，依靠编草席为职业，刘备小的时候，也做得这一行当，一直做到二十多岁。当然这并不妨碍刘备晚上思量今后的路该如何走？由于没有兄弟姐妹，刘备小时候很重视发现人才，意识到人才的可贵。刘备第一次出山的时候，就得到当地大户苏双、张世平的支持。


    其二，喜欢攻心战术。刘备手下最重要的伙伴，就是关羽张飞，这两个人都有万人敌，当初三人食则同桌、寝则同席，关羽和张辽的谈话就表明和刘备之间感情深厚：与兄（指的是张辽），朋友之交也：我与玄德是朋友而兄弟、兄弟而君臣者也。最后又说：“吾受刘将军厚恩，誓以共死，不可背之。”可见在关羽心目中，刘备的地位是什么样子。


    其三，刘备能豁得出去。当初张飞醉酒被吕布夺了徐州，让刘备一家老小被困在城中，张飞因为受到关羽责备要自杀，刘备就劝说：古人云兄弟如手足，妻子如衣服，衣服破尚可缝；手足断，安可续？感动得张飞泪如雨下，兄弟三人抱头痛哭，你说人家刘备都对自己这样了，自己还不玩命给人干？


    其四，挖人墙角水到渠成。刘备喜欢有本事的人，可谓一见如故如饥似渴，当初欣赏赵云，就是如此。那赵云本是公孙瓒手下大将，一条银枪使得上下翻飞，如入无人之境。刘备看见赵云，便伸手相搀，不想分开，因为公孙瓒是自己师兄弟，不好下手，后来在公孙瓒死后，又给赵云抛了媚眼，方才让赵云死心塌地地跟着自己，从此如虎添翼。


    其五，信任别人，不疑神疑鬼。刘备是帅才，不小肚鸡肠，他知道自己的人格魅力，从不给下属使绊子。关羽在曹操手下，刘备在古城相会后，没有像张飞那样的不依不饶，揪住对方的小辫子不放；赵云在长坂坡和敌人厮杀，去救幼主，有人像刘备举报，说赵云投降曹操，刘备说绝不可能；大将黄权在夷陵之战后，投降了曹魏，刘备还是没有搞株连九族，甚至重用黄权的儿子。这个大度量，实在让人羡慕。


    其六，刘备对待知识分子很厚道，不仅有了“三顾茅庐”善待诸葛亮的佳话，刘备对庞统、对刘璋旧部法正、张松等人都是极端的虔诚，刘备礼贤下士的举动，让诸葛亮鞠躬尽瘁死而后已，让庞统死心塌地为之心甘情愿地取西川，让法正占领成都成为刘备的智囊。


    其七，刘备虽然早年穷困，可后来却极为慷慨，刘备不吝惜爵位，大胆提拔名不见经传的魏延为汉中太守，让汉中成为守护成都的门户；重用老将黄忠，让老英雄以七十岁高龄仍然效力沙场，甚至斩杀曹操大将夏侯渊，夺取了定军山的胜利。


    三国演义是一部波澜壮阔的大书，任何人只要想成就一番大业，便可从这些英雄人物身上，找到自己效法的榜样，从而兢兢业业踏踏实实，努力去开创自己的事业。


    ### 权谋家为何选择将错就错


    曹操因疑心重，误以为父辈的世交老友吕伯奢的家人要谋害他，于是先下手为强，一下杀了吕伯奢全家。事后知道杀错，铸成大错，可能私下也是很懊恼的。逃离作案现场的路上，碰巧又遇到吕伯奢为招待他兴冲冲地打酒归来，曹操无法面对，与其让吕老伯回家承受不能承受之痛，或报警寻仇，何不甘脆来个错上加错，一了百了，于是把吕伯奢也给杀了。


    关于这段震撼人心的公案，历来众说纷纭。主要观点是说曹操乱世奸雄，宁我负人，毋人负我。也有人分析曹操当时是逃犯，怕吕伯奢报警；也有人说曹操杀人成性，狡诈残忍，不可理喻。


    这些分析都有道理，我还想补充一点意见，曹操的做法只是一种处理世事手段——将错就错。他只是把这种当权政治家领袖人物都能娴熟运用的权谋发挥到极致，且戏剧性地在短时间完成并收效，成为一件典型的案例标本。


    将错就错，负负得正，对于“三无”弱势群体是行不通也不敢行的，但对于强势人或当权者，绝对是处理某些棘手问题的法宝，或称权术。这方面的案例太多，最大最典型的都是牵涉政治的话题，不便举例。打一个极端比方：为了达到某个目标应该向东前进，可是最高领导已下令向西。有人提醒他方向有误，他为了维护权威和面子，在批判向东路线错误的同时，不惜劳民伤财仍坚持继续向西。因为地球是园的，最后也达到的目标，通过操纵舆论宣传，维护了他一贯正确的伟大形象。


    天真的人以为人非贤圣，孰能无过？有错立纠，善莫大矣！话都对，问题在“立纠”二字上。有人犯错，自己心里其实很明白，也不是不想纠正，但要“立纠”，一是面子上下不来，强势人或当权者都是冠冕堂皇很要面子的人；二是眼下局面不好收拾，认错就要改，一改眼前利益损失太大。而将错就错，然后看准时机暗中逐步改正之，曲线纠错，最后归正，以证明他本来就是对的，只是有些庸常之人不能理解而已。虽然这是机巧权术，但与坚持错误死不改悔还是有所区别的。


    将错就错毕竟是政治家的权术，太吓人！我们不议论也罢。但在处理普通人际关系上，也有人搬用，就错到爪哇国去了。别人告诉我这么一件事：有两个很好的朋友，曾有很多年友谊交往，后来，其中一位有意无意做了大对不起朋友的事，伤了朋友的心。这位做错事的朋友不是知错立改，坦诚面对，修补友谊，而是自知做了对不起朋友的事，无颜面对朋友，干脆错上加错，离他的朋友而去，连给朋友原谅他错误的机会都不给，后果可想而知。看来，将错就错，其属性应该类似“三十六计”范畴，正如“上屋抽梯”、“过河拆桥”一样，其使用要分别敌友，有一定适用范围。曹操若是普通老百姓，就凭他将错就错制造的吕伯奢事件，就看出他心狠手辣，让其它老朋友寒心，陈宫不就离他而去了吗？如果曹操开车把人撞重伤了，他也会将错就错，把车倒回去干脆把那人辗死算了，免去那人的痛苦和自己的麻烦。但这是法律和道德绝不允许的。而他作为帝王级人物，道德和法律对他是不适用的，在特定时刻毫不动摇地坚持将错就错，正是他雄才大略和英明伟大之处，常人实不可及也绝不可学也。


    ## 权力斗争的根本是利益之争


    武则天登上政治舞台是因为当时朝廷以长孙无忌、褚遂良为首的元老大臣势力强大，唐高宗的权力受到很大限制。唐高宗决定借“废王立武”来钓鱼，等元老大臣来反对，然后顺水推舟打击他们，重振皇权（钓鱼结果是贬尚书右仆射褚遂良，使其郁闷而死；黜同中书门下长孙无忌，逼其自缢。所以钓鱼技术有时也很可怕。57年反右这种大钓鱼就更可怕）。所以武则天一开始只是高宗政治上的工具。


    顾命大臣与高宗的矛盾主要体现在：


    1. 李世民授予顾命大臣过大权力


    “丁卯，疾笃，召长孙无忌（李世民小舅子，高宗亲舅舅）入含风殿。上（李世民）卧，引手扪无忌颐，无忌哭，悲不自胜；上竟不得有所言，因令无忌出。己巳，复召无忌及褚遂良入卧内，谓之曰：‘朕今悉以后事付公辈。太子仁孝，公辈所知，善辅导之。’谓太子曰：‘无忌、遂良在，汝勿忧天下！’”


    2. 李世民知道以后的凶险


    李世民“又谓遂良曰：‘无忌尽忠于我，我有天下，多其力也，我死，勿令谗人间之。’”（这段话是春秋笔法，李世民知道高宗必然与长孙无忌产生矛盾，在打预防针，要诸遂良中立，不要掺和）


    3. 高宗倒扑


    “有洛阳人李弘泰诬告长孙无忌谋反（这个有意思，长孙无忌是皇帝亲舅舅，竟然有人告谋反，没有人操作指使是不可能的，可能是博弈的一部分，至少为后来冲突埋下伏笔或接口），上命立斩之。”


    4. 长孙无忌反扑


    “无忌与褚遂良同心辅政，上亦尊礼二人，恭己以听之”（这段话是春秋笔法，实际是迫不得已）。


    5. 高宗借题发挥


    “太宗女衡山公主应适长孙氏，有司以为服既公除，欲以今秋成婚。于志宁上言：‘汉文立制，本为天下百姓。公主服本斩衰，纵使服随例除，岂可情随例改，请俟三年丧毕成婚。’”（于志宁是高宗心腹，太子府的旧人。所以这话本身就是高宗自己想说的，说明高宗已经不耐烦长孙无忌）上从之。”


    6. 直接短兵相接第一回合，高宗占上风


    “己未，监察御史阳武韦思谦劾奏中书令褚遂良抑买中书译语人地（褚遂良压价购买中书省翻译人员的土地）。大理少卿张睿册以为准估无罪。思谦奏曰：‘估价之设，备国家所须，臣下交易，岂得准估为定！睿册舞文，附下罔上，罪当诛（置估定价格，是预备国家需要时征收用的，臣下之间的交易，怎么能够按照估定的价格呢？睿册利用文书舞弊，附和臣下，欺罔皇上，按其罪行应当处死）。’”是日，左迁遂良为同州刺史，睿册循州刺史。”


    （这段话很有意思，有点反腐为借口清除异己的味道）


    7. 正面与长孙无忌冲突


    “上谓宰相曰（实际就是长孙无忌）：‘闻所在官司，行事犹互观颜面，多不尽公。（听说你们所在的官署，官员们还要互相观察脸色行事，大多不能完全公正）’长孙无忌对曰：‘此岂敢言无；然肆情曲法，实亦不敢。至于小小收取人情，恐陛下尚不能免。’无忌以元舅辅政，凡有所言，上无不嘉纳”（这也是春秋笔法，说明长孙无忌之猖獗，不把皇帝放在眼里，为以后埋下祸根）。


    ## 权力斗争的模式


    从胡亥，刘彻，杨广，李世民，武则天，赵光义，甚至到朱棣，胤禛，中国历史上任何在若干大位觊觎者中脱颖而出的新君登基，基本行为模式都大致相同。本来中国政治传统就是权力斗争，新君登基就表现得更显眼。


    对《资治通鉴》中描述的一千多年历史总结，新君登基的基本矛盾，归根到底是新君与旧臣之间的矛盾。元老重臣想倚老卖老，管束新皇帝，稳固自己既得利益；而新皇帝又想按自己的想法去处理朝政事务，摆脱旧臣的控制，尤其是新皇帝的嫡系心腹，也急于瓜分旧臣的利益范围。这种矛盾表现最明显的在唐高宗初年、唐玄宗初年、唐肃宗初年、唐代宗初年。当然后来的清代康熙、雍正、嘉庆几代皇权交替中也都表现得比较突出。斗争的基本模式如下：


    1. 权力斗争目的


    稳固大位。


    2. 权力斗争的目标


    把自己人搞得多多的，别他人搞得少少的。一般是依赖基本班底（门生故吏，旧友同窗，例如著名的黄埔系，红一方面军系都莫不是如此），用名位争取不得志的阶级（武则天时代的李义府，许敬宗，甚至周兴，来俊臣等等都是不得志而被名位诱惑投靠过来的）。


    3. 权力斗争的原则


    首先搞清楚谁是我们敌人，谁是我们朋友，谁是可以拉拢的同盟军。


    4. 权力斗争对敌人手段


    各个击破；以虎驱狼；一桃杀三士；挑动内讧；收买拉拢；掺沙子；拉出打人等等。不过最常见的还是倒扑，挑动不明真相群众群殴（海南话读音是昆虫斗昆虫，很形象），再嫁祸于人，激起民愤，最后被成为“咎由自取”，全民共诛之（当然如果酷吏介人，黑白颠倒，指驴为马，牵连冤枉就更常见）。


    5. 对自己人手段


    恩威并施，顺我者昌逆我者亡；平衡控制，互相制衡，异论相搅（君主只做天平的支架，哪边权力过大倾斜了，就减少修理一下，以保持平衡。这时间外人看见家奴被修理，千万不要高兴或掺和，因为修理不是抛弃，自作多情的局外人经常认为落井下石时机到来了，其实往往是自己送死。牢记内外有别，就算是王八蛋，也是自己人的王八蛋，轮不到外人来搅合）。


    6. 主要工具


    对自己人用名利诱惑；对敌人鼓励告密和重用酷吏。


    因为觊觎大位者比比皆是，妄想取而代之这不乏其人，不进攻别人，别人就会进攻你，在明处的政治家，最好的防御手段就是进攻，暴风骤雨的进攻可以让敌人无机可乘，无反守为攻的喘息时间。


    当然稳固政权光靠整人还不行，还得有办法治国，尤其是要实现国泰民安，安居乐业，否则都没有好下场。


    下面以最典型的唐高宗和武则天登基和执政过程来说明（所有资料来自《资治通鉴》唐纪第 14 到 23）。


    也许这一段历史是中国传统政治权力搏斗最好的教科书：夫妻，母子，兄弟，父子，舅甥无一不为权力而厮杀。政治家只有利益，没有亲情，更没有什么同情，联盟是因为有利，无利时任何联盟都会取消。纯粹的理想主义者在政治这个漩涡中都活不长，纯粹的实用主义者，也难以长期凝聚人心，保持斗志。真正的政治家都是理想主义与实用主义的结合者。


    ## 深藏不露 才能避免别人钻空子


    无论何人，只要在社会上混过一段时间，便多少练就察言观色的本事，如果是一个愿意把自己的一切都毫无保留地展示给下属的上司，就可能有这样的下属，他们根据上司的喜怒哀乐来调整与其相处的方式，并进而顺着上司的喜怒哀乐来为自己谋取利益。


    上司也会在不知不觉中，意志受到了别人的掌控。如果上司的喜怒哀乐表达失当，有时会招来无端之祸。因此，高明的掌权者都不随便表现这些情绪，以免被人窥破弱点，予人以可乘之机。越是精于领导术的人，城府便更深。


    不露喜怒哀乐，不说心里话，等于是藏在暗处，看别人表现一切，而自己决不表态，以免别人的表白受自己的态度左右，然后都好充分掌握真情实况，作出应对决断。


    楚汉战争期间，刘邦屡次被项羽打败，兵困荥阳，处境危在旦夕。而正在这时，刘邦的部下韩信在北线却捷报频传，攻占了齐国。随着军事上的节节胜利，韩信的政治野心也膨胀起来。他派人面见刘邦，要求封自己为假（代理）齐王。刘邦一听，便怒不可遏，对前来送信的信使大声斥责。张良正坐在刘邦身边，急忙用脚轻轻踢了刘邦一下，附耳说道：“汉军刚刚失利，大王有力量阻止韩信称王吗？不如顺水推舟答应他，否则将会产生意外之变。”刘邦立即心领神会，感到前言有失，便话锋一转，反改口骂道：“大丈夫既定诸侯，就要做个真王，何必要做假王！”刘邦原本爱骂人，这一骂不足怪，况且前后两语衔接不错，竟也没露出什么破绽。


    不久，刘邦派张良作为专使，为韩信授印册封。刘邦不动声色稳住了韩信，为汉军日后十面埋伏，击败项羽作了组织准备。如果当时便为此事与韩信闹翻，后果不堪设想。


