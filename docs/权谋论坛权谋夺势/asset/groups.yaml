    ![](img/3c7504fceae7961a2b74d2a0b3112717_335_0.png)'
  - '[PAGE 336]


    在古代帝王的统治术中，有一种名为“无为而治”的权术，主要表现为深藏不露、诡诈多变。这就是道家和法家所极力称道的帝王南面君人之术。


    “无为而治”是道家的政治哲学，主要是说统治者应尽量克制欲望，不要劳民扰民，对政事少干预，顺其自然，垂拱而治，这样做就会收到“无为而无不为”的效果，使社会得到大治。后来，他们进一步把'
  - '[PAGE 337]


    这一原则用在君臣关系方面，于是便发展成一套颇具特色的帝王权术学。我国著名史学家钱穆先生指出：“‘无为而无不为’、‘后其身而身先’，此乃完全在人事利害得失上着眼，完全在应付权谋上打算也。”钱穆：《庄老通辨》卷中《道家政治思想考》。马来西亚大学的郑良树先生也认为“无不为”是权谋之术。不过他进一步指出：“大概《韩非子》在解释《老子》、利用《老子》之际，于老子‘无为’思想别有会心的了解，乃创立‘人君无为，'
  - '[PAGE 338]


    # 权谋应用


    臣下无不为’的政治法术。后人不察，竟以此权谋法术加在老子朴素的哲学上。”郑良树：《论帛书本老子》，《竹简帛书论文集》。


    这一帝王权术的内容，首先是指君主不要亲自处理政务，而是指挥臣下干一切事情，使自己处在虚静无为的地位，垂拱而治。君主逞能恃才，事必躬亲，其实并不表明君主的聪明，反倒表现出君主的无本事和低能。法家认为，如果人君亲自处理一切政务，这是代臣下蒙劳负'
  - '[PAGE 339]


    任，而臣下反而无所事事，享受安逸。这样，君主就把自已降到臣下的地位了。另外，君主处处争先逞能，容易把自己的一切长短优劣都暴露给臣下，而使君主失去主动权，处于被动的尴尬地位。君主的职责是用臣，而不是代臣下办事。君主如果能够像汉高祖那样善于用将，善于任用和指挥天下最有才智的人为其尽力，这才是最高明的统治艺术。韩非说：


    明君在上行无为之道，群臣在下则'
  - '[PAGE 340]


    竦惧而不敢为非。明君之道，使智者尽其思虑，而君主因之以断事，故君之智慧无穷；使贤者贡献才能，君主因而任之，故君之才能无穷；办事有功则君主受贤名，有过则臣下承担罪责，故君之声誉无穷。如此，君主虽不贤，可为贤者之师；君主虽不智，可为智者之准则。能使臣任其劳，而君有其成功，此即君主之常法。为君之道在于使臣下无从观测，无从知晓。君主虚静无为，暗中观察臣下的过失，见若不见，闻若不闻，知若不知；知其言'
  - '[PAGE 341]


    # 权谋应用


    则验其言行是否一致，每一官职设一人，无令其相互通气，则万物之情尽显。君主要掩盖行迹，隐匿念头，使臣下无从推测；去掉智巧，不显才能，臣下就无从揣度。不泄露意图而考核臣下是否与我一致，谨慎而牢固地执掌权柄。杜绝臣下的欲望，破除臣下的意欲，无使其贪求我之权柄……为君之道，以静退为贵，不亲操事务而知臣下办事之巧拙，不亲自谋虑而知臣下之谋虑是祸是福。（《韩非子·主道》。）


    339'
  - '[PAGE 342]


    权谋应用


    韩非的这一段议论把这种“无为而治”的要旨讲得非常明白。在法家眼里，无为之术是君主驾驭臣下的一种特殊手段。这一权术的特点就在于：君主在驾驭臣下时，要处在虚、静的地位，以虚制实，以静制动，大智若愚，以“无为”而达到“无不
    为”。这一权术的内容可以归纳为以下五个方面：


    其一，君主要深居简出，神出鬼没，隐蔽自己的行踪，使自己在臣下的心目中充满着高深莫测的神秘感。


    340'
  - '[PAGE 343]


    这种神秘感会对臣下产生巨大的威慑力量。在这方面秦始皇最为典型。


    他经常变换居住的宫室，严禁侍从把他的言行透露给大臣。侍从违令，泄露了他的行踪，就要被处死。汉武帝经常潜游离馆，外朝官难以面见帝王，凡请奏机宜，多由宦官充任，这就增强了汉武帝的神秘性。


    明世宗十几年不见大臣，有一次，他在内廷召见大臣，几位大臣战战兢兢，诚惶诚恐。世宗听了汇报后，感到不满，哼了一声，一位大臣当即吓得屎尿失禁，秽气熏天，被内'
  - '[PAGE 344]


    侍拖出了内廷。


    其二，君主对任何事情都不要事先表态，不要流露出自己的意向。只要君主有任何意向性的表示，臣下都会钻空子，或乘机使诈，这样一来，人主就难免受到迷惑。君主应该尽量让臣下发表意见，让他们尽力去做，自己则冷眼旁观，不露声色，不置可否，在暗中观察臣下的一举一动，伺机捕捉臣下的过失。这就是韩非所主张的
