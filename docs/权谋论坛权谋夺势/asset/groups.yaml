    ## 势


    经过多年翻阅大量古籍研究积累，最终才发现：


    人与人的区别，最终是格局的区别。

    格局大的人永远都能操控格局小的人。


    如果一定要给社会分层的话，我认为应该这样划分：下层人做事、中成人借势、上层人造势。


    社会底层做事，遵循的是“事道”，讲究的是“技术”。


    这是社会上最多的人，他们往往是工薪阶层、自由职业者、零工、兼职人员等等，他们依靠出卖劳动力和技能生存，比如司机、农民、会计、律师、工人、医生、老师。


    首先需要自己拥有某项技能，当然越厉害越好，然后乘以自己投入的时间，这就是自己可以获得的财富。


    他们往往需要找到一家能够发挥自己的特长的公司或平台，然后将自己特长发挥出来，但是对于普通人来说，我们的时间、体力都是相差无几的，没有人一天有 25 个小时，所以大家只能不断提升自己的技能水平和熟练水平。


    但是，这种性质的人有一种方式可以变得强大，那就是：成名。


    成名之后才能达到社会中层，你会发现你收入增加了，同样是靠演戏赚钱，你是明星和演员的报酬就是天壤之别。同样是靠设计赚钱，你也是有名的设计师身价远远高于普通设计师，同样是帮别人打官司赚钱，你是大律师身价远远高于普通律师。同样是靠治病赚钱，名医就是要花大钱才能请到。


    不止钱财，随着你的声望提升，以前不知道你的人现在开始找你办事，每天收不完的礼品，吃不完了的酒局，更重要的是，在此期间你会接触更多社会高层。


    所以，“做事”的人在初级阶段靠“技术”，到了一定程度是靠“名声”，但成名靠的是运气和机遇，它并不只是技能高超到某种程度的结果，这是他们最纠结的事。


    再看社会高层“做势”的人


    这种人往往并不在意一件事如何做好，他们考虑的是设计出一个什么样的“模式”，能让那些喜欢做事的人更好的去做事，它遵循的是“世道”。


    我们要记住：“武”永远都在“术”之上。


    这种人除了懂技术之外，还要具备一定的文化、眼光、魄力、创新意识，需要对新产品、新渠道、新工具、组织变革有深刻的洞察。创业者、企业家基本上都属于这一类人。


    在懂管理和善于梳理的基础上，他们更关注一个团队、一家公司的模式创新，因为有了模式就可以成全无数个做事的人。


    “做势”的人必须要懂三样东西：一是看懂社会大势，趋势如滔滔江水，顺之者昌，逆之者亡；二是看懂新工具，比如互联网；三是读懂新政策，配合国家行动。


    创业的本质，其实就是从“做事”努力升级到“做势”，这就意味着一个人不用再靠“技术”去挣钱，而是站在更高的位置上靠设计“模式”去赚钱，同时自己的经济、人身、人格都实现了自由。


    这是一个社会阶层不断固化的时代，但也是一个逆袭随时可能发生的时代。


    提升你的格局，懂得造势，是人生逆袭的唯一途径！


    ## 造势


    造势，要造气势。这需要充分利用各种舆论、文化手段，调动和操纵对抗双方力量中的精神因素，调动和操纵能够影响这些因素的各种内外在条件，形成一种有利自己的强大气势。


    现代广告多利用名人的效应来推销自己的产品，说到底，其实就是在谋气势。


    赵云是一位智勇双全的人物，有长胜将军的美称。赵云的智勇使他无往不胜，敌军只要远远望见“常山赵云”四字的旗号，就会尽皆逃窜；只要听见“赵子龙在此”的喊声，就会惊得落马。赵云的旗号和大名就是人们在万军阵上对他的形象识别，这一个形象识别同赵云本身一样，具有强大的威势。


    古时有个卖马人在马市上蹲了三天也未把马卖出去，他找到了伯乐，请求伯乐给予帮助。伯乐一看他的马，真的是匹千里马，就答应下来。


    第二天，当马市上交易正繁忙的时候，伯乐出现在千里马旁边，他左瞅右瞧，观察良久，后做依依不舍状离开。伯乐前脚刚走，很多买主就围过来，千里马很快出手，并且卖了一个好价钱。


    三国中刘备赴江东招亲时，赵云令荆州随行兵士俱披红挂彩入南徐，便是孔明之计。其目的在于制造出一种热热闹闹办喜事的舆论声势。用现代话来说，这既是表明来意的“安民告示”，又是广而告之的“轰动效应”。结果，这一轰动效应惊动了乔国老和吴国太，孙权和周瑜的假戏不得不真唱下去，最后，刘备得了孙夫人又保住了荆州。


    回顾三国演义中造势最多的便是诸葛亮，一个永久的智者，三顾茅庐时利用缺席与周边人传播，最危难的时候，利用空城计。五丈原生命垂危之时利用七星灯造势，可以看出智者的一生有造不完的势。


    商战同样需要造势。一个刚开张的新企业，一种刚上市的新产品，知名度低，企业需要造势以提高知名度，为其鸣锣开道；一个实力雄厚的知名企业，一种名牌产品，虽然已有了一股势，仍需继续造势，以巩固市场，提高形象。


    有人认为，实力本就是一股强势，人为地再造势无非是花拳绣腿，这种观点有失偏颇。“酒香也怕巷子深”，有实力自然好，但是实力还应当被消费者认识到，才会对企业产生认同感和信任感，因此造势与不造势就大不一样。企业搬家，是再平常不过的事。不造势，路人视而不见，造了势，就可能引起冲击心理的强大轰动效应。


    而当一个企业鲜为人知之时，当企业的某个活动不被人理解时，造势开路最具效应。


    如果孔明没有造势，江东百姓连刘备过江这件事都不会留意，更何言知其来意。孙权、周瑜本无意演戏，孔明却极想把这出戏热热闹闹地演下去，演戏以前必然有一番招揽看客的锣鼓家伙，披红挂彩入南徐就是开场前的锣鼓，锣鼓敲毕方能引出“二气周瑜”的正戏。赵云的造势明明白白地告诉东吴百姓，刘备过江是来求亲的，不是来打仗的，不会给百姓造成威胁，只能因孙结婚给百姓带来好处，从而使东吴百姓，以及东吴的上层人物乔国老、吴国太接受了刘备的此行。


    ## 先造势，后谋利


    成功是化繁为简、提高效率的学问，一个人要想在有限的时间里成功，就必须学会造势，即借助各种有利条件迅速实现自己的目标。正像一个科学家所言：只有站在巨人的肩上你才能看得更远。


    正如我们在前面所说，自身有限的力量要想通过外在的客观条件成倍地增加，就必须处于有利的位置上。如圆石于高山上滚动而下。这种借助的过程充满了“顺应”和“惯性”的动感，力量在这种动感中得到猛增。


    所以，要想造就有利于自己的势，就必须抢占最高点，找到有利于自身的位势。


    东汉末年军阀混战之际，曹操之所以能够脱颖而出，成为一代枭雄，最后成就大业，和他善于谋势是分不开的。当时，乘乱起兵的大多数领导者，只有军事家的头脑，而很少有政治家眼光。而曹操却独具慧眼，清楚地认识到政治路线的正确与否，民心的向背，是决定胜负的首要因素。


    《三国演义》第 14 回记述，荀彧向曹操进策：“昔晋文公纳周襄王，而诸侯服从；汉高祖为义帝发丧，而天下归心。今天子蒙尘，将军诚因此时首倡义兵，奉天子以从众望，不世之略也。若不早图，人将先我而为之矣。”曹操听后“大喜”，慨然接受荀彧的建议，“克日兴师”到洛阳为汉献帝“保驾”；接着，他又果断接受董昭的建议，把献帝迎接到自己的根据地许都。从此，汉献帝成了曹操讨伐异己、实现统一的政治工具。这就造成政治上的优势，使割据一方的军阀陷入了被讨伐的境地。


    《三国演义》第 56 回又记述，建安 15 年春，曹操大宴文武于铜雀台。这时，虽然赤壁兵败，但整个北方已经扫平。王朗、钟繇、王粲、陈琳等一批文官，在宴会上进献诗章，多称颂曹操“功德巍巍，合当受命”(即该当皇帝)。曹操逐一看了他们的诗章后，笑了笑，冷静地说了一段表白心迹的话。


    在这段话里，他一方面极力标榜自己毫无野心，只是顺应历史的潮流而起事，是坚持统一，反对分裂的历史代表和中流砥柱，即所谓“如国家无孤一人，正不知几人称帝，几人称王”；另一方面毫不含糊地表示，决不“慕虚名而处实祸”，放弃手中的兵权，回到所封的武平侯之国安享富贵。这些是多么具有战略家的眼光！


    在曹操临死前几个月，孙权上书表示愿意归降，并劝曹操称帝。


    曹操并没有老而昏庸，却以清醒的政治头脑，一眼看穿这是孙权的阴谋，企图让自己激怒天下，陷于孤立，于是“观毕大笑”，说：“是儿欲使吾居炉火上耶！”侍中陈群等进一步劝说：“殿下德功巍巍，生灵仰望。今孙权称臣归命，此天人之应，异气齐声。殿下宜应天顺人，早正大位。”曹操表示，“苟天命在孤，孤为周文王矣。”
    意思是说，即使做皇帝的条件已经具备，时机已成熟，自己也不去做。要做，让自己的后辈去做好了。具有强烈正统观点的罗贯中，也不得不在曹操死时引用后人的诗歌称赞曹操：“文章有神霸有气，岂能苟尔化为群？”“安有斯人不作逆，小不为霸大不王？”可见，曹操能够剪灭群雄，成其霸业，是与他抢占制高点的战略和“挟天子以令诸侯”的战


    术运用是分不开的。


    殊不知，孙子早就说过，“上兵伐谋，其次伐交，其次伐兵，其下攻城，攻城之法，为不得已。”硬拼硬杀其实是下下策，上策是强化市场竞争的“势”，把市场的主动权牢牢把握在手中。


    “谋势”，意味着高屋建瓴，驾驭全局，用好机遇，也就是打造“铁一般的成功”；‘谋子''，则是眼光短浅，缺乏战略思考，“捡到篮里就是菜”。精明、成熟的领导者应当善于‘谋式’而疏于‘谋子’，站得高，看得远，少急功近利，多从长计议，所谓“不谋万世者，不足谋一时”。


    真正优秀的企业领导者都是战略家，在今日瞬息万变的竞争环境中，战略显得尤为重要。这要求领导者一方面要对形势的发展和趋向，有超前的眼光和判断力；另一方面，要对自己是否具备造势与任势的条件和实力，有清醒的认识和完善的考虑。一个无懈可击的竞争战略，如果执行不力，最后也会变得一文不值；而一个先天偏差的竞争战略，无论企业领袖多么卓而不凡，执行过程无可挑剔，最后也难逃失败的厄运。可以说，善弈者谋一局之胜，不善弈者求数子之得。


    从历史经验来看，中国人做事是最讲究造势的。古人云：名不正则言不顺，言不顺则事不成。自古以来，讲究师出有名。比如在三国演义中，一方欲讨伐另一方，必定要请高手来写一篇檄文，以示对方天人共怒，从而为自己“师出有名”造势。


    唐敬宗时，兖州一带大旱，赤地千里、颗粒不收，村间炊烟稀少、饿殍遍野。米价腾贵，有些米商更加囤积居奇，望价待沽。原兖州节度使赈灾不力，朝廷将他革职外调，任命以擅政闻名的令狐楚来做兖州节度使。


    上任前夕，令狐楚先派得力助手去兖州，乔装私访，掌握赈灾第一手资料。助手来到兖州，深入乡间、市镇调查，得知：兖州素为鱼米之乡，以往连年丰收，民间贮粮甚多，但多集中在一些财力甚丰的大户手中，广大老百姓没有多少余粮，多是青黄不按时借贷，收下粮食后偿还。这一遇歉收，有的断了顿，有的变卖家产，以求渡灾活命。但因米价天天上涨，故刮起抢米之风，致使不少米店关门不卖米，使米价更加上涨。


    加之，前任节度使只知出告示压米价，不知采取有效引导措施，故米店纷纷关门，大户人家更是囤米不卖。百姓嗷嗷待哺，社会局势动荡，潜伏着造反危机。兖州官仓中还有不少存粮，但为了保证驻军的供应，也不敢轻易开仓放粮。


    得知这些情况，令狐楚思谋良策，怎样才能让那些囤积居奇的大户们售出仓库里的米来赈救灾民呢？突然，他想起大户们囤积米粮不外乎是想等粮价越涨越高时抛售赚大钱，若他们得知米价涨到极限，马上就下跌时，肯定会纷纷抛售的。对，自己就制造个“米价马上下跌”的假情报。


    主意已定，令狐楚带手下人走马上任。消息早传到兖州，州内大小官员迎出郊外。未及进城，寒暄几句后，令狐楚马上问来迎的官吏，州内米价几何，州中有多少官仓，共存米多少。听完汇报，令狐楚掐指算起来：存米多少多少，可调出多少多少投放市场。多少多少米投放市场后，可将米价压下多少。最后说：“看来赈灾救民不成问题了。”他故意算得很响，让前来迎接的官吏和他们的随从们都听到。


    官吏、随从们回到家，赶忙告诉自己的亲朋好友：新来的节度使要开官仓平方米价了，米价马上要下跌，赶快抛售存米！一时间，“米价马上下跌”的消息不胫而走，存米大户纷纷抛米换钱。没用令狐楚开一个官仓，米价就压下来了。


    令狐的聪明就在于先制造放粮的假象，进而影响舆论，从而为自己要开官仓放粮平价造势。激化市场。舆论在斗争中是非常重要的。因为大多数的公众并不是直接去了解事实真相，很多时候是通过舆论来判

    '
