    # 权谋应用


    在古代，思想家经常将“权”和“经”视为一对范畴，用来说明人们的社会行为。“神即道，道法自然，如来。”这里所谓的“道”是指一般的规律、一般的行为准则，而“权”是这一准则的灵活运用。孟子说：“男女授受不亲，礼也；嫂溺则援之以手，权也。”这里说的“礼”和“权”就是一般行为规则及其灵活运用。总的说，“经”就是天经地义的道理，“权”就是随机应变的手段。'
  - '[PAGE 162]


    # 2.什么是谋?


    谋,《说文》解释说: “虑难曰谋。”

    意谓考虑事情的难处, 找出应对的方法, 就是 “谋” 。“谋”字初形从母,《说文解字约注》说: “所以从母者, 人世一切谋虑, 始于母之为赤子谋也。赤子初生,
    不能言语, 赖母推心为之。时其饥寒而衣食之, 候其疾痛而调卫之, 以善以育, 所以为之谋虑者, 至周至密。”《尚书.洪范》说: “明作哲, 聪作谋。”'
  - '[PAGE 163]


    # 权谋应用


    这些都具有计谋、筹划的意思。所以，“谋”就是针对具体的问题，为了达到一定的目的，经过周密的思考而得出的行为方法。


    # 3. 什么是权谋？


    权与谋，合起来讲，就是随机应变的计谋。荀子说：“上好权谋，则臣下百吏诞诈之人乘而后欺”，“故用国者，义立而王，信立而霸，权谋而亡。”刘向说：“孟子、孙卿儒术之士弃捐于世，而游说权谋'
  - '[PAGE 164]


    之徒贵于俗。”正是就这种概念而言的。这说明权谋不是一种谋略，而是谋略的一部分，它具有随机应变的特性。谋略较权谋的内容要广泛得多，谋为权宣之计，略为长远之策。


    # 4.权谋的构成


    权谋的构成，一般包含四种因素：权谋主体、权谋客体、权谋场和权谋本体。权谋主体，主要指发明和运用权谋的一方，包含谋士、策士'
  - '[PAGE 165]


    和智囊；权谋客体，指被权谋所指向或支配的一方，是权谋主体的认识和实践的对象；权谋场指时间、地点和具体情况等权谋所依托的各种客观条件；权谋本体指人们处于特定权谋场内的应对能力和方法。


    # 5.权谋认识的误区


    儒家，孔子对权谋的认识和理解持公允态度；荀子尽管兼容儒法，但本质上站在反权谋的立场上；孟子也是把权谋放在“信”、“义”'
  - '[PAGE 166]


    的对立面，彻底否定。《老子》具有明显的反权谋倾向，但在老子本人那里，却包含着较多的权谋成分，如“将欲歙之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲取之，必固与之，是谓微明。”意思是说，想要收敛，必须暂且扩张；想要削弱，必须暂且加强；想要废弃，必须暂且兴旺；想要夺取，必须暂且给予，这就是深沉的预谋。


    唯权谋论的谬误，在于没有弄清权'
