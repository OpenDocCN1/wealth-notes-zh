    断。


    北宋大臣文彦博处理危机的方法，与令狐楚的计谋也有异曲同工之妙。当时有位臣僚请求废除陕西铁钱。朝廷虽然没有接受，消息却不胫而走。


    平民百姓以为朝廷迟早会这么做，便争先恐后地拿出铁钱去买东西，以免到时候铁钱作废。消费者希望抛出铁钱，而销售者不愿收铁钱。这样，彼此相持不下，长安城因此而发生骚乱，商人们纷纷关店歇业，'
  - '[PAGE 45]


    # 权谋应用


    市场陷入一片混乱，许多人对此束手无策。这时，文彦博出来说话了。


    针对许多人提出的禁止关闭店门的主张，他提出反对：禁止只会使人们更加疑惑，从而引起更大的骚动，唯一的办法是让官府出面做买卖，只收铁钱不收铜钱。于是他命人召来丝绸行业的商人，让他们卖丝绸时说：“凡买丝绸者一定要用铁钱，铜钱不收。”这样一来，人们知道铁钱不会作废，市场便又恢复了稳定。'
  - '[PAGE 46]


    # 权谋应用


    从上面的两个故事可以看出，所谓造势，就是制造声势，影响舆论，烘托气氛，为自己的行为寻找合理性的依据和利益点。千万不要小瞧了群众的嘴巴和眼球，它们一点活动起来，就会像风一样不胫而走，影响人的心理，进而影响人的行为和决策。在现代商业的营销活动中，有一种营销方式叫做“事件营销”，就是通过造势来运作的。


    所谓事件营销，指的是企业通过主动策划或利用某些具有重大新闻价'
  - '[PAGE 47]


    值或社会影响力的热点事件，以吸引公众注意力，提高企业形象和知名度，提高产品吸引力，并最终达到吸引消费者购买的营销方法。


    事件营销的重点是借式和造式，有“事”则借，无“事”则造。


    本来没有事，自己造些事出来，事出而势成，于是借势而为，达到了四两拨千斤的效果。


    大多靠的则是借势，事件本来就存'
  - '[PAGE 48]


    # 权谋应用


    在，他们所要做的，以一种合适的方法依附于其上，借着这些重大事件或热点事件万众瞩目的机会，将本来不为人们所注意的企业或产品显露于公众之前，吸引众人的眼球。说到底，事件营销玩的还是一种注意力经济。


    对于企业来说，事件营销的好处在于：


    第一，节约成本，获取超值回报。


    因为借助全社会所关注的重大事件或热点事件进行营销，新闻媒体往'
  - '[PAGE 49]


    # 权谋应用


    往不请自来，为企业节约了大量的广告费和宣传费。


    第二，效果立竿见影。事件营销最大的好处是，上午媒体做报道，下午顾客就会有反应，速度非常之快，很多企业借助事件营销一夜成名。


    第三，企业不但可以推产品，还可以树品牌，一箭双雕。第四，操作简便，可以一个人操作，也可以一群人操作。'
  - '[PAGE 50]


    # 造势者都是先传达信念


    陈胜、吴广


