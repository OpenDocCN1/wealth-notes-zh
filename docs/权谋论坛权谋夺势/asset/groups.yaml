    # 权谋应用


    游戏规则是观音制定的，她说没事就没事，你看着办吧！这样的妖怪打得死吗？


    第三，来自各种社会关系。


    这个要怪孙悟空自己，谁叫他喜欢结交狐朋狗党，在涉及到情与法、法与理的时候，往往自己手软了。如牛魔王是自己的“义兄”，牛魔王的儿子红孩儿是“义侄”，牛弟弟如意真仙也攀上“义弟”。天上那些朋友更多了。他当齐天大圣时“会友游宫，交朋结义。见三清称个‘老’字，逢四帝道个‘陛下’”。那帮九曜星、五方将、二十八宿、四大天王等，俱只以兄弟相待。西游路上，那些妖怪大多出自这些神仙的门下。这样的妖怪打得死就怪了！


    孙悟空不敢打死有背景的妖怪问题，在网络上引起热议，跟帖者很多。但是意见几乎一边倒，大家认为孙大圣不敢得罪后台老板，手段尚不够硬朗，扫除魔怪的决心不够坚定，并不是真正的英雄；也有的咬牙切齿猛顶，痛骂那些贪宦污吏，横行霸道。不过，我倒认为，孙悟空这样做，是有其道理的。西游是一个江湖，也是一个实打实的职场，你如果要混得好，必须遵循其中的“潜规则”，这样你我好我好大家好。如其不然，则会四处碰壁，西天的路并不好走，困难大大的有！因为老孙遵循了潜规则，打死不如放生，才建立了牢固的关系网，确保取经大业的完成。因此说，取经大业是大方向，一切工作都要服从这个大目标。至于打死或不打死那些妖怪，不管他们是否有后台，都是细枝末节的问题。孙大圣应该是这样考虑的！


    那么，他是如何遵循这些潜规则的呢？


    1. 没有领导的支持，你的努力经常是白费。孙悟空深知，取经大业是如来佛祖的布局，因此一切行动听指挥，佛祖指东就打东，叫他走西就走西，一定不能违背这个方向和原则。最终因为工作任务完成得好，立功受奖，授予“斗战胜佛”的光荣称号，这是服从领导的结果。如果你的努力没有得到如来的允许，擅自中途离队，或者半路开小差，这个功劳可要打折扣了。猪八戒经常闹分家，这些最高决策层看在眼里，最终他也得到应有的位置。


    2. 获得重用或升迁，业绩并不是唯一的标准。孙大圣沿途出的力是最多的，但在唐僧的心里，并非不能“开除”的。因为打死白骨精妹妹的问题，被师父驱逐出境，老孙心中那份惆怅向谁说？气得他眼里掉泪，倒像个多情的男子呢！后来又打死几个拦路抢劫的贼人，依然被唐师父踢出“革命队伍”，这叫做多错多！猪八戒不太干活，师父当他是“甜心”，沙和尚是最闷的人了，从来没挨过一次批评。到了灵山会上，大家都得到奖励，猪八戒还闹意见，佛祖还安抚他，其实你的职位是最实在的！


    3. 与其到处拉关系，不如与直接领导拉关系。观音菩萨是取经工作的“艺术总监”，包括团队的构建，路线的安排，灾难的策划，矛盾的解决等，她都亲力亲为。最要紧的，是她对项目开展的监管，以及最后绩效的考核。直接服务于观音的天上六丁六甲诸位神将，全程监督工作落实，每天撰写工作日志，取经结束将督查情况上报，观音高兴地说，“准缴，准缴”，又问，“那唐僧四众，一路上心行何如？”诸神说，“委实心虔志诚，料不能逃菩萨洞察。”面对如此细心抓落实的直接领导，难道孙大圣能打死她下放为妖的家奴吗？


    4. 人在江湖中行走，尽量不伤害有本事的人。漫漫取经路，是一个另类江湖。在这里，林子大了什么鸟儿都有，其中“大鸟”也不少。今天的妖怪，变成明日的救星，这就是西游江湖最给力的启迪。如果不给自己留点后路，到时候求着人家，连门儿都没有。孙大圣深谙此道，因此面对天上二十八宿下凡为妖的奎木狼，举起“杀威棒”时也不得不留情！放奎木狼一马，何尝不是放二十八宿一马？后来，需要他们帮忙，个个心存感激，奋勇争先。如不是亢金龙的搭救，老孙可能被黄眉老妖困死在金饶中；如果没有以奎木狼为首的四木禽星相助，老孙岂能打败青龙山的犀牛怪？


    5. 打死不如放生好，留余地总比没有余地好。虽然沿途打死一些山精树怪、小鱼小虫之类的，但老孙是有底线有原则的。在女儿国时，师父师弟因为喝错了水，怀了“鬼孕”，在取“堕胎泉”水时，被霸占该水的如意真仙阻拦，经过交火打败了他，老孙本想给点颜色看的，但他知道，“正是打死不如放生”，还是留点余地好。留了这点余地，便为自己拓展了一个广阔的新天地，赢得了源源不断的社会资源！


    透过这些潜规则，可以看出，孙大圣一切的所为，都是为了实现取经工作的最高目的，而依照职场潜规则办事的。连接这些规则的纽带，是彼此尊重对方的核心利益，自己的利益才能得到保障，甚至是实现最大化！孙大圣也看到了，只要是有人有关系的，就法办不了，慢慢的自己也看到了可能是上司为了考查自己而故意设下的计策，所以不得不做些让步呀，不然如何会产生一个斗战圣佛呢！


    # 权术三重境界


    心术：慈，忍，残，变。


    - **慈**：仁和止静。务善策者，无恶事；无远虑者，有近忧。

    - **忍**：必有忍，事乃有济。小不忍则乱大谋。事物的发展规律往往和我们的意愿相违，只有忍住与规律相违的冲动，舍意愿而从规律，才能顺其自然，见机而作。

    - **残**：理性行事，不留性格弱点。看得远，不因小得小失乱大局；忍得住，不因小恨小怨树强敌；狠得下，不因小恩小惠留后患。

    - **变**：以仁义治天下，却丢天下，是因为不知权变。设权致变，所以解结。穷而不谋者困，困而不战者亡。穷则变，变则通。


    治略：乌龟胜兔。


    间接路线：最近的道路上，往往有最多的防守，看似弯曲的迂回，往往是最短的捷径。


    治人事天，莫若啬。圣人终不为大，故能成其大。蚯蚓无爪牙之利，筋骨之强，而上食埃土，下饮黄泉，用心一也。专心于一，用蚕食之法，以柔克刚，以小谋大。这就是范蠡难以传人的超世绝学。


    # 治术


    一、出手之前先研究透局势，做到一切了然于胸，而后知道用力方向。出头之前，需恭俭谦约，韬光养晦，在胸中纵横统筹，全局策划，将自己的韬略系统酝酿成熟之后再治世济务。方可在任何情况下，都心中有数，方寸不乱，在一团混乱中，谈笑自若，指挥若定。驾驭豪杰，统帅万军，于白热化的各类拼杀中游戏自如。


    二、手里要有两条路线。既可预留回旋余地，又可作为遇到障碍时的应变之法。有时也是出奇制胜的必由之路。


    三、做事要抓住关键。不是非做不可的事坚决不做，一来节约兵力，二来为了无为而治。做事贵在进取，贵在疾速。进取则势张，疾速则机得。


    四、统筹处理各类关系。以心理力学之法分析人心，执中致和，务使各类关系有利于我。


    五、耐心战胜一切。不做无把握的事是一切战略战术的根本原则，一切战略说到底也就是一句话：不做无把握的事。


    ![alt text](img/3c7504fceae7961a2b74d2a0b3112717_335_0.png)


    在古代帝王的统治术中，有一种名为“无为而治”的权术，主要表现为深藏不露、诡诈多变。这就是道家和法家所极力称道的帝王南面君人之术。


    “无为而治”是道家的政治哲学，主要是说统治者应尽量克制欲望，不要劳民扰民，对政事少干预，顺其自然，垂拱而治，这样做就会收到“无为而无不为”的效果，使社会得到大治。后来，他们进一步把这一原则用在君臣关系方面，于是便发展成一套颇具特色的帝王权术学。我国著名史学家钱穆先生指出：“‘无为而无不为’、‘后其身而身先’，此乃完全在人事利害得失上着眼，完全在应付权谋上打算也。”（钱穆：《庄老通辨》卷中《道家政治思想考》）。马来西亚大学的郑良树先生也认为“无不为”是权谋之术。不过他进一步指出：“大概《韩非子》在解释《老子》、利用《老子》之际，于老子‘无为’思想别有会心的了解，乃创立‘人君无为，臣下无不为’的政治法术。后人不察，竟以此权谋法术加在老子朴素的哲学上。”（郑良树：《论帛书本老子》，《竹简帛书论文集》）。


    这一帝王权术的内容，首先是指君主不要亲自处理政务，而是指挥臣下干一切事情，使自己处在虚静无为的地位，垂拱而治。君主逞能恃才，事必躬亲，其实并不表明君主的聪明，反倒表现出君主的无本事和低能。法家认为，如果人君亲自处理一切政务，这是代臣下蒙劳负重，而臣下反而无所事事，享受安逸。这样，君主就把自已降到臣下的地位了。另外，君主处处争先逞能，容易把自己的一切长短优劣都暴露给臣下，而使君主失去主动权，处于被动的尴尬地位。君主的职责是用臣，而不是代臣下办事。君主如果能够像汉高祖那样善于用将，善于任用和指挥天下最有才智的人为其尽力，这才是最高明的统治艺术。韩非说：


    “明君在上，行无为之道，群臣在下则竦惧而不敢为非。明君之道，使智者尽其思虑，而君主因之以断事，故君之智慧无穷；使贤者贡献才能，君主因而任之，故君之才能无穷；办事有功则君主受贤名，有过则臣下承担罪责，故君之声誉无穷。如此，君主虽不贤，可为贤者之师；君主虽不智，可为智者之准则。能使臣任其劳，而君有其成功，此即君主之常法。为君之道在于使臣下无从观测，无从知晓。君主虚静无为，暗中观察臣下的过失，见若不见，闻若不闻，知若不知；知其言则验其言行是否一致，每一官职设一人，无令其相互通气，则万物之情尽显。君主要掩盖行迹，隐匿念头，使臣下无从推测；去掉智巧，不显才能，臣下就无从揣度。不泄露意图而考核臣下是否与我一致，谨慎而牢固地执掌权柄。杜绝臣下的欲望，破除臣下的意欲，无使其贪求我之权柄……为君之道，以静退为贵，不亲操事务而知臣下办事之巧拙，不亲自谋虑而知臣下之谋虑是祸是福。”（《韩非子·主道》）


    韩非的这一段议论把这种“无为而治”的要旨讲得非常明白。在法家眼里，无为之术是君主驾驭臣下的一种特殊手段。这一权术的特点就在于：君主在驾驭臣下时，要处在虚、静的地位，以虚制实，以静制动，大智若愚，以“无为”而达到“无不为”。这一权术的内容可以归纳为以下五个方面：


    其一，君主要深居简出，神出鬼没，隐蔽自己的行踪，使自己在臣下的心目中充满着高深莫测的神秘感。这种神秘感会对臣下产生巨大的威慑力量。在这方面秦始皇最为典型。他经常变换居住的宫室，严禁侍从把他的言行透露给大臣。侍从违令，泄露了他的行踪，就要被处死。汉武帝经常潜游离馆，外朝官难以面见帝王，凡请奏机宜，多由宦官充任，这就增强了汉武帝的神秘性。


    明世宗十几年不见大臣，有一次，他在内廷召见大臣，几位大臣战战兢兢，诚惶诚恐。世宗听了汇报后，感到不满，哼了一声，一位大臣当即吓得屎尿失禁，秽气熏天，被内侍拖出了内廷。


    其二，君主对任何事情都不要事先表态，不要流露出自己的意向。只要君主有任何意向性的表示，臣下都会钻空子，或乘机使诈，这样一来，人主就难免受到迷惑。君主应该尽量让臣下发表意见，让他们尽力去做，自己则冷眼旁观，不露声色，不置可否，在暗中观察臣下的一举一动，伺机捕捉臣下的过失。这就是韩非所主张的“虚静无事，以暗观疵”之术。


    其三，君主不要显示自己的欲望，不要随便表示自己的好恶。韩非说，君主不要显示自己的欲望，若君主显示出欲望，臣下将千方百计满足君主的欲望以献媚；君主不要暴露心意，若君主暴露心意，臣下将显示其异能以投其所好。所以君主能隐蔽好恶之情，臣下就能现出本质。臣下总是要千方百计地伺察君主的欲望和好恶，然后投其所好，设诱饵以钓之。据说，燕昭王爱说梦话，为了不把自己的心思泄露给侍从，经常独寝一室。


    其四，用权术参验群臣，以察奸邪。韩非对君主参验臣下的权术列举得非常详细，其大意思是：参听众人之言，以知其是否忠诚；改易臣下任职之地及其职位，以观其实际才能；根据现有的事实推测审查其隐私隐情，举其往事以知其现状；通过亲昵之人而探其内情；以诡谲之道而使之，以杜绝其渎慢行为；故意说错话、说反话、做错事，试探所怀疑的人，以得奸情；派间谍监视、伺察专任之臣；扬言欲做某事，以察奸人动静；故意显示意欲好恶，以观察人臣的正直或谄渥；臣下结成朋党，则从中挑拨离间，制造事端，使其内部争斗，以散其党羽；详尽掌握一事的原委细节，以惊惧臣下之心，等等。隋文帝就曾派人向官吏行贿，凡接受贿赂者皆处以重刑。唐太宗为了考察官吏是否廉洁，也密使左右向掌管全国关卡通行以及赋税事务的司农令史行贿。该人受绢一匹，就以贿赂之罪杀之。宋太宗即位之初，为了考察臣下处理刑事案件是否公正，用权威镇静臣下，令侍从用自己的佩刀杀死一个在富户门前无理取闹的乞丐，然后弃刀而去。案件上报朝廷，太宗下令严加搜查，务必缉拿凶犯。官府以刀为证据而判该富户犯有杀人罪。刑官将审理结果上奏朝廷，太宗问：“该犯服其罪吗？”刑官答曰：“服矣。”太宗令献上刀来，又叫内侍取来自己的刀鞘，对刑官说：“此为朕所佩之刀，乞丐实为朕使人所杀，你如何冤枉好人？”（《宋人轶事汇编》卷一《太宗》）。满朝文武大臣始知太宗治臣有术。


    其五，君主驾驭臣下要诡诈多变，出其不意，使其防不胜防，因而不得不慑服于君主的威势。楚汉战争时，张耳、韩信统帅汉军救赵。一天早晨，刘邦带领侍从突然驰入军营。张耳、韩信尚在睡梦之中。刘邦直入其卧室收夺其印信符节，然后才召集众将听令。张耳、韩信从梦中醒来，方知汉王来临，不禁大惊失色。汉王遂命令张耳守赵地，同时拜韩信为相国，全权统兵进攻齐地。刘邦的诡诈之术，就连韩信也佩服之至，由衷地称颂他“善于将将”。


    总之，这种“无为之术”，其实质就是如何玩弄权术，搞阴谋诡计，愚弄臣下。历代帝王对这套东西非常欣赏，奉为圭臬。他们在统治过程中，无不熟练地运用这些权术，纵横捭阖。就连唐太宗这样一位被历代士大夫奉为至圣至仁的明君，虽然极力主张对臣下推心置腹，以诚相待，但在其晚年，也多次运用权术驾驭臣下。这是因为在集权专制的封建时代，皇权与其他集团之间始终存在着矛盾冲突，皇权的至尊无上和不容染指，决定了君臣关系中存在阴谋权术的必然性。


    # 不懂权谋，不使权谋，就不要玩政治


    1. 电影《赤壁下》比上部精彩多了，演员的表现好多了。剧中有这样一个细节，历史上未必有，但构思得比较巧妙——为了迷惑曹操，周瑜与刘备演了一处双簧，借以迷惑曹操，使他轻敌：刘备借曹操人多势众，怯阵退兵，诸葛亮以及刘备手下众人不解，刘备编了诸如要让兄弟们保命之类的话，退兵，曹操听了大喜。就在火烧曹船后，刘备突然率部杀出，出乎敌我双方人士意料，戏中，周瑜只说了一句话：很多事情，知道的人就是不能太多。是呀，这个计谋和部署，只有周瑜和刘备清楚，就连诸葛亮也不清楚。为政者，尤其是为“长”者，要注意上下有别，控制信息和舆论，这样能造就不少机会。


    2. 吕布凤仪亭戏弄貂蝉，这本是王司徒使的美人计加离间计，王司徒却劝董卓要容得下下属，要宽容大度。这其中王司徒用了一个典故，很有意思——绝缨会。楚庄王大宴群臣，派漂亮妃子给群臣酌酒，不料席间全场灯息，一武将久慕该妃子，趁熄灯，摸了一把妃子，妃子气不过，顺手扯下了该武将头上的红缨子，跑到台上，告之楚庄王，楚庄王听了之后，沉吟片刻，叫暂时不要点灯，且命全场武将将自己盔甲上的红缨扯掉，仍在地下。就这样，楚庄王救了这位武将一命。在后来的一次战斗中，该武将冒死救了楚庄王一命，当楚庄王问他为什么要救主时，该武将说：我就是绝缨会上被你救的那名武将。你会不会成为职场权术牺牲品


    # 《失街亭》《空城计》《斩马谡》《武侯祠》


    最具“以歌舞演绎故事”的京剧艺术结构特质的传统老戏，老生各个流派均有独特的演唱表演风格。三国时期，蜀国街亭为汉中咽喉要地，诸葛亮派将驻守。马谡请令，诸葛亮再三叮嘱须靠山近水扎营，并令王平辅之。马谡刚愎自用，违令，又不听王平谏言，竟在山顶扎营，因而被魏将张郃所败，街亭失守。


    诸葛亮驻西城，得街亭失守之讯，又知司马懿乘胜来攻，所部精锐已俱被遣出，西城空虚；在危急中，定空城之计，令将城门大开，自坐城头，抚琴饮酒以待。司马懿兵至城下，见状大疑，又素知诸葛谨慎，不进而退；及至探明回军，诸葛亮已调来赵云，惊退司马。马谡不遵诸葛将令，失守街亭，与王平回营请罪。诸葛亮虽惜马才，但以军法无私，挥泪斩之；并因己用人失当，上表自贬。


    马谡（190年—228年），字幼常，襄阳郡宜城县人。三国时期，与哥哥马良等四位兄弟并称“马氏五常”，是个不错的人才。起用他是诸葛亮为了自己所属势力的膨胀的权欲私心起的作用，目的是为了进一步削弱魏延在蜀国的势力实力存在。


    建兴六年（228年）街亭之战，马谡为张郃所破，蜀军放弃陇右三郡，退守汉中，后被诸葛亮处斩。斩首之时，全军落泪，诸葛亮亦痛哭。京剧《失街亭》就是讲这一段故事。《三国志·马良传》记马谡死于狱中，《向朗传》则提到马谡逃走，向朗知情不报，因此让马谡的死充满了谜团！


    # 马谡之死


    正史《三国志·蜀书》，有三种说法：


    一是狱中病死：《马谡传》记载：“马谡下狱物故”，即病死狱中。


    二是死亡：

    《诸葛亮传》：“斩（马）谡以谢众人。”

    《王平传》：“丞相（诸葛）亮既诛马谡及将军张休、李盛，夺将军黄袭等兵。”


    三是马谡逃走，向朗知情不报：

    《向朗传》：“向朗平时与（马）谡善，（马）谡逃亡，（向）朗知情不举，亮恨之，免官还成都。”，裴松之的注释为：“（向）朗坐马谡免长史，则建兴六年中也。”


    大部分的记载都是支持马谡被孔明诛戮，逃亡不一定就不一定必活不死，逃得再远，也是有追捕回笼的可能。


    同次战役的东路箕谷带兵官赵云虽敛兵固守，亦受贬官之罚（从征南将军贬至镇东将军），孔明本人也自贬三等（辞丞相降为右将军，但行丞相事，所总统如前），西路街亭带兵官马谡应有惩罪。所以马谡若未受死，也应受贬官，但是却无马谡贬官的记载，记载马谡逃亡，只是曾经，后来还可被捕受刑。


    # 马谡---诸葛亮权术的牺牲品


    当年孔明南征孟获之时，马谡与孔明的战略方针就不谋而合。在与孔明的日子里经常提出了很多很好的建议，并且实施以后都得到了很好的效果。孔明非常欣赏他，经常和他在一起讨论问题，常常是在一起一说就是一个晚上。二人情同父子。并且得到当时很多蜀名士的欣赏，比如蒋琬等等。也很得人心，比如在马谡被斩之后，当时军中就有十万人为之恸哭。


    马谡想凭高视下击败魏军。王平说水道被短如何是好，言此山是绝地。而马谡又以孙子兵法中“置之死地而后生，投之亡地而后存。”的道理来阻谏。马谡的狂妄、无知不仅害了自己，而且坏了蜀汉伐魏之大业，故其一死不足以谢国人！这似乎是近两千年来的定论！

