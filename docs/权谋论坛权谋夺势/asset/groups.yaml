  - '[PAGE 4]


    # 权谋

    造势


    # 开篇寄语:


    既然你没死、你还活着，那么你的人生，就只有两条路可走，或为弱者怨恨不公，泪水洒落飘零，乞求强者的残羹剩饭。如狗一般感谢着摇尾乞怜，回到破落狗舍，心怀愤懑舔着犹含汤汁的破碗，想着明天必定要大大哭闹一番。或为强者已远离人群，独自思考该如何制定规则，让弱者分到的残羹剩饭更少些。'
  - '[PAGE 5]


    是的，如果你是强者你就可以制定规则、划出道理，其余众人要么遵守，要么出走。


    因为在世界本没有绝对的平等，所谓公平不过是强者向弱者的示好。弱者泪水换来的食物不是吃剩下的，就是挑剩下的。要追求公平，与强者平起平坐，采集到新鲜甘美果实，只能用智慧来争取，从人类到自然界到整个地球彼此间干戈扰攘、争斗不休的根源就是资源。'
  - '[PAGE 6]


    资源是什么呢“资源”这个词是一个非常宽泛的概念。资源可以是阳光、水、土壤可以是生存空间，可以是动物植物，可以是饮食男女可以是高楼名车，可以是高高在上，可以是生杀予夺。


    资源进入了人类社会之后一般表现为物质资料即生产资料和生活资料。在这之上资源还表现为金钱、名望和权力。由于资源是稀缺的、有限的、资源与无限的占有总是存在着巨大的鸿沟因此为了争夺稀缺'
  - '[PAGE 7]


    资源的斗争便屡见不鲜了。


    比如市场上商人的机关算尽，学界里学者们的党同伐，异官场上官员们勾心斗角这些都是人们为了争取稀缺资源而进行的竞争。由于资源是稀少的为了夺取稀缺的资源人们便八仙过海各显神通。有的通过暴力掠夺，有的通过欺骗获得，有的通过交易互换有的通过索要勒索等等手段不一而足。


    资源是有限的，竞争是无情的，你'
  - '[PAGE 8]


    # 权谋应用


    没有智慧只能被收割，最近“智商税”这个词很流行，我认为所谓的智商税就是你对社会的认知不足。


    因为你永远无法挣到超出自己认知范围之外的资源，除非你靠运气，但是靠运气挣的资源，到最后往往会靠实力亏掉，这是一种必然。你所挣的每一份资源，都是你对这个世界认知的变现，你所亏的每一份资源，也是你对这个世界认知的缺陷。这个世界最大的公平在于，当一个人的资源大于自己认知的时'
  - '[PAGE 9]


    候，这个社会有 100 个方法收割你，直至你的资源与你的认知相匹配为止。


    此刻你最关心的问题，同时也是身边人最关心的问题，如何最大化地获得自己的利益同时最大化地降低自己的损失。


    在竞争中需要勇气和魄力、需要为了自己的目标而做出最大程度的努力。可你轻视了智慧远远比勇气更为重要。'
  - '[PAGE 10]


    # 权谋应用


    在生活中不乏那些智识之辈一计既出鬼神皆惊。他们往往能够将你我活的竞争变成任其掌握和操控的游戏，谋定而后动，运筹帷幄之中决胜千里之外。这样的人有着丰富的斗争经验和成熟的斗争智慧、有着敏锐的直觉和睿智的头脑。他们在斗争中从来不会盲目冲动、不会感情用事、不会一厢情愿、更不会随心所欲。


    他们在进行任何活动的时候总是要'
  - '[PAGE 11]


    权谋应用


    经过复杂的计算、通过认真的推理 通过严格的判断，最后作出一项尽可能逼近事实真相的判断。并且在行动过程中会随着不断变化 的事实随时作出新的判断，并调整自己的行动。


    相比之下从前的你是否为“三拍” 人士？


    +   一拍脑袋作出决策。


    +   二拍胸脯夸夸其谈。


    +   三拍屁股走人了事。


    原因在于你不肯动脑筋、不肯研究


    9'
  - '[PAGE 12]


    # 权谋应用


    事物真相成了为了一个“嘴尖皮厚腹中空”的人。


    还有另一种你做事的过程中也有着坚忍不拔的毅力、有着不达目的誓不罢休的精神。但是你从来不能深入到事物内部中，去揭示其真正的规律。而总是凭借匹夫之勇使蛮力用蠢劲，我告诉你这是有勇无谋表现。其结果往往是功夫下了一箩筐最后却竹篮打水一场空。


    ![](img/3c7504fceae7961a2b74d2a0b3112717_12_0.png)'
  - '[PAGE 13]


    # 势


    经过多年翻阅大量古籍研究积累，最终才发现：


    人与人的区别，最终是格局的区别。

    格局大的人永远都能操控格局小的人。


    如果一定要给社会分层的话，我认为应该这样划分：下层人做事、中成人借势、上层人造势。'
  - '[PAGE 14]


    社会底层做事，遵循的是“事道”， 讲究的是“技术”。


    这是社会上最多的人，他们往往是 工薪阶层、自由职业者、零工、兼 职人员等等，他们依靠出卖劳动力 和技能生存，比如司机、农民、会 计、律师、工人、医生、老师。


    首先需要自己拥有某项技能，当然 越厉害越好，然后乘以自己投入的 时间，这就是自己可以获得的财富。'
  - '[PAGE 15]


    他们往往需要找到一家能够发挥自 己特长的公司或平台，然后将自己 特长发挥出来，但是对于普通人来 说，我们的时间、体力都是相差无 几的，没有人一天有 25 个小时，所
    以大家只能不断提升自己的技能水 平和熟练水平。


    但是，这种性质的人有一种方式可 以变的强大，那就是：成名。


    成名之后才能达到社会中层，你会'
  - '[PAGE 16]


    发现你收入增加了，同样是靠演戏赚钱，你是明星和演员的报酬就是天壤之别。同样是靠设计赚钱，你也是有名的设计师身价远远高于普通设计师，同样是帮别人打官司赚钱，你是大律师身价远远高于普通律师。同样是靠治病赚钱，名医就是要花大钱才能请到。


    不止钱财，随着你的声望提升，以前不知道你的人现在开始找你办事，每天收不完的礼品，吃不完了的酒局，更重要的是，在此期间你会'
  - '[PAGE 17]


    接触更多社会高层。


    所以，“做事”的人在初级阶段靠“技术”，到了一定程度是靠“名声”，但成名靠的是运气和机遇，它并不只是技能高超到某种程度的结果，这是他们最纠结的事。


    再看社会高层“做势”的人


    这种人往往并不在意一件事如何做好，他们考虑的是设计出一个什么样的“模式”，能让那些喜欢做事的人更好的去做事，它遵循的是'
  - '[PAGE 18]


    “世道”。


    我们要记住：“武”永远都在“术”之上。


    这种人除了懂技术之外，还要具备一定的文化、眼光、魄力、创新意识，需要对新产品、新渠道、新工具、组织变革有深刻的洞察。创业者、企业家基本上都属于这一类人。


    在懂管理和善于梳理的基础上，他们更关注一个团队、一家公司的模'
  - '[PAGE 19]


    式创新，因为有了模式就可以成全 无数个做事的人。


    “做势”的人必须要懂三样东西： 一是看懂社会大势，趋势如滔滔江 水，顺之者昌，逆之者亡； 二是看懂新工具，比如互联网， 三是读懂新政策，配合国家行动。


    创业的本质，其实就是从“做事” 努力升级到“做势”，这就意味着 一个人不用再靠“技术”去挣钱， 而是站在更高的位置上靠设计“模'
  - '[PAGE 20]


    式”去赚钱，同时自己的经济、人身、人格都实现了自由。


    这是一个社会阶层不断固化的时代，但也是一个逆袭随时可能发生的时代。


    提升你的格局，懂得造势，是人生逆袭的唯一途径！'
  - '[PAGE 21]


    # 造势


    造势，要造气势。这需要充分利用各种舆论、文化手段，调动和操纵对抗双方力量中的精神因素，调动和操纵能够影响这些因素的各种内外在条件，形成一种有利自己的强大气势。


    现代广告多利用名人的效应来推销自己的产品，说到底，其实就是在谋气势。'
  - '[PAGE 22]


    # 权谋应用


    赵云是一位智勇双全的人物，有长胜将军的美称。赵云的智勇使他无往不胜，敌军只要远远望见“常山赵云”四字的旗号，就会尽皆逃窜；只要听见“赵子龙在此”的喊声，就会惊得落马。赵云的旗号和大名就是人们在万军阵上对他的形象识别，这一个形象识别同赵云本身一样，具有强大的威势。


    古时有个卖马人在马市上蹲了三天也未把马卖出去，他找到了伯乐，请求伯乐给予帮助。伯乐一看他的'
  - '[PAGE 23]


    马，真的是匹千里马，就答应下来。


    第二天，当马市上交易正繁忙的时候，伯乐出现在千里马旁边，他左瞅右瞧，观察良久，后做依依不舍状离开。伯乐前脚刚走，很多买主就围过来，千里马很快出手，并且卖了一个好价钱。


    三国中刘备赴江东招亲时，赵云令荆州随行兵士俱披红挂彩入南徐，便是孔明之计。其目的在于制造出一种热热闹闹办喜事的舆论声势。用现代话来说，这既是表明来意的'
  - '[PAGE 24]


    “安民告示”，又是广而告之的“轰动效应”。结果，这一轰动效应惊动了乔国老和吴国太，孙权和周瑜的假戏不得不真唱下去，最后，刘备得了孙夫人又保住了荆州。


    回顾三国演义中造势最多的便是诸葛亮，一个永久的智者，三顾茅庐时利用缺席与周边人传播，最危难的时候，利用空城计。五丈原生命垂危之时利用七星灯造势，可以看出智者的一生有造不完的势。'
  - '[PAGE 25]


    商战同样需要造式。一个刚开张的新企业，一种刚上市的新产品，知名度低，企业需要造势以提高知名度，为其鸣锣开道；一个实力雄厚的知名企业，一种名牌产品，虽然已有了一股势，仍需继续造式，以巩固市场，提高形象。


    有人认为，实力本就是一股强势，人为地再造势无非是花拳绣腿，这种观点有失偏颇。“酒香也怕巷子'
  - '[PAGE 26]


    深”，有实力自然好，但是实力还应当被消费者认识到，才会对企业产生认同感和信任感，因此造势与不造势就大不一样。企业搬家，是再平常不过的事。不造势，路人视而不见，造了式，就可能引起冲击心理的强大轰动效应。


    而当一个企业鲜为人知之时，当企业的某个活动不被人理解时，造势开路最具效应。


    如果孔明没有造势，江东百姓连刘'
  - '[PAGE 27]


    # 权谋应用


    备过江这件事都不会留意，更何言知其来意。孙权、周瑜本无意演戏，孔明却极想把这出戏热热闹闹地演下去，演戏以前必然有一番招揽看客的锣鼓家伙，披红挂彩入南徐就是开场前的锣鼓，锣鼓敲毕方能引出“二气周瑜”的正戏。赵云的造势明明白白地告诉东吴百姓，刘备过江是来求亲的，不是来打仗的不会给百姓造成威胁，只能因孙结婚给百姓带来好处，从而使东吴百姓，以及东吴的上层人物乔国老、吴国太接受了刘备的此行。'
  - '[PAGE 28]


    # 先造势，后谋利


    成功是化繁为简、提高效率的学问，一个人要想在有限的时间里成功，就必须学会造势，即借助各种有利条件迅速实现自己的目标。正像一个科学家所言：只有站在巨人的肩上你才能看得更远。


    正如我们在前面所说，自身有限的力量要想通过外在的客观条件成倍'
  - '[PAGE 29]


    # 权谋应用


    地增加，就必须处于有利的位置上。如圆石于高山上滚动而下。这种借助的过程充满了“顺应”和“惯性”的动感，力量在这种动感中得到猛增。


    所以，要想造就有利于自己的势，就必须抢占最高点，找到有利于自身的位势。


    东汉末年军阀混战之际，曹操之所以能够脱颖而出，成为一代枭雄，最后成就大业，和他善于谋势是分'
  - '[PAGE 30]


    不开的。当时，乘乱起兵的大多数领导者，只有军事家的头脑，而很少有政治家眼光。而曹操却独具慧眼，清楚地认识到政治路线的正确与否，民心的向背，是决定胜负的首要因素。


    《三国演义》第 14 回记述，荀彧向曹操进策：“昔晋文公纳周襄王，而诸侯服从；汉高祖为义帝发丧，而天下归心。今天子蒙尘，将军诚因此时首倡义兵，奉天子以从众望，不世之略也。若不早图，人将先我'
  - '[PAGE 31]


    # 权谋应用


    而为之矣。”曹操听后“大喜”，慨然接受荀彧的建议，“克日兴师”到洛阳为汉献帝“保驾”；接着，他又果断接受董昭的建议，把献帝迎接到自己的根据地许都。从此，汉献帝成了曹操讨伐异己、实现统一的政治工具。这就造成政治上的优式，使割据一方的军阀陷入了被讨伐的境地。


    《三国演义》第 56 回又记述，建安 15 年春，曹操大宴文武于铜雀台。这时，虽然赤壁兵败，但整个北方'
  - '[PAGE 32]


    已经扫平。王朗、钟繇、王粲、陈琳等一批文官，在宴会上进献诗章，多称颂曹操“功德巍巍，合当受命”(即该当皇帝)。曹操逐一看了他们的诗章后，笑了笑，冷静地说了一段表白心迹的话。


    在这段话里，他一方面极力标榜自己毫无野心，只是顺应历史的潮流而起事，是坚持统一，反对分裂的历史代表和中流砥柱，即所谓“如国家无孤一人，正不知几人称帝，几人称王”；另一方面毫不含糊地表示，决不“慕虚名而处实祸”，'
  - '[PAGE 33]


    放弃手中的兵权，回到所封的武平侯之国安享富贵。这些是多么具有战略家的眼光！


    在曹操临死前几个月，孙权上书表示愿意归降，并劝曹操称帝。


    曹操并没有老而昏庸，却以清醒的政治头脑，一眼看穿这是孙权的阴谋，企图让自己激怒天下，陷于孤立，于是“观毕大笑”，说：“是儿欲使吾居炉火上耶！”侍中陈群等进一步劝说：“殿下德功巍巍，生灵仰望。今孙权称臣归命，此天'
  - '[PAGE 34]


