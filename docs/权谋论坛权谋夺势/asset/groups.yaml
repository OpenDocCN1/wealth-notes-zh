    ## 权谋应用


    该贸然除掉，因为一旦落下诛杀功臣的名声，就会埋下叛乱的风险，而一旦打响内战，就容易首尾不相顾。


    - 如果你是老板你应该具备哪些权谋？


    刘邦是古代屌丝逆袭的典范，是历代君王中出身较为低下、也是最会当领导的人。刘邦知人善用，网罗天下人才为我所用，成就了别人，别人也自然成就了刘邦的霸业。


    汉高祖刘邦曾经问臣下自己之所以得天下的原因，回答各有不同。高祖听后说：“公知其一，未知其二。夫运筹帷幄之中，决胜千里之外，吾不如子房。镇国家，抚百姓，给饷馈，不绝粮道，吾不如萧何。连百万之军，战必胜，攻必取，吾不如韩信。此三者，皆人杰也，吾能用之，此吾所以取天下也。项羽有一范增而不能用，此其所以为我擒也。”


    刘邦，是当代企业家必须仔细研究的一个管理者。关注他的理由并不仅仅在于他是汉朝的开国皇帝，而在于他还是中国历史上第一个平民出身的皇帝。与“鞭挞天下，威震四海”的秦始皇相比，他的出身以及打江山的资本实在太微不足道了。他没有潼关、崤山之险，也没有关中、巴蜀之富，更谈不上有秦国的那样一支“铁血军团”。但就是这么一个甚至带有浓重“流氓”色彩与习气的刘邦，却击败了一个又一个强大的对手，让刚刚一统天下的秦朝二世灭亡，开创了汉家四百多年的基业。


    企业处在变革的时期。这个时期给了更多创业者更多的创业机会。这就是我们的企业要关注、研究刘邦的原因所在。管理者如何才能像刘邦那样，利用好这些机会，“因时”、“因地”、“因人”地展开自己的竞争策略呢?


    ### 一、知人善用


    公元前 202 年五月，刘邦在洛阳的南宫开庆功宴，宴席上，他总结了自己取胜的原因：“论运筹帷幄之中，决胜于千里之外，我不如张良；论抚慰百姓供应粮草，我又不如萧何；论领兵百万，决战沙场，百战百胜，我不如韩信。可是，我能做到知人善用，发挥他们的才干，这才是我们取胜的真正原因。至于项羽，他只有范增一个人可用，但又对他猜疑，这是他最后失败的原因。”


    吕后看着弥留中的刘邦，问他死后人事的安排：“萧相国死后，由谁来接替呢？”刘邦说曹参。吕后问曹参之后是谁，刘邦说：“王陵可以在曹参之后接任，但王陵智谋不足，可以由陈平辅佐。陈平虽然有智谋，但不能决断大事。周勃虽然不擅言谈，但为人忠厚，日后安定刘氏江山肯定是他，用他做太尉吧。”吕后又追问以后怎么办，刘邦有气无力地说：“以后的事你不会知道了。”


    ### 二、无条件信任


    刘邦的队伍里面，有很多人原来曾经是在项羽手下当差的，因为在项羽的部队里面待不下去跑过来投奔刘邦，刘邦敞开大门，不计前嫌，一视同仁表示欢迎。如韩信、陈平，韩信原来是项羽手下的人，因为在项羽手下不能发挥作用，来投奔刘邦。其实，一个领导者如果老是小心眼、计较甚多，能招募来好的人才吗？恐怕连帐下之人也会离他而去。


    ### 三、接班人的选择智慧


    刘邦选择接班人的过程中，始终贯穿着几种交叉的矛盾。


    一是观念问题。刘盈是长子、嫡子，立他为太子就是天经地义；刘如意不是长子，又是庶出，当接班人名不正言不顺。虽然刘邦在考察中觉得太子“仁弱”，“如意类己”，但是敌不过传统的观念。周昌、叔孙通动不动请命，“誓死捍卫”刘盈当太子的权力，大约就是出于观念上的原因。


    二是派系问题。吕后多年随军，和朝臣打了很多交道，有一定的交情，所以“吕派”实力强大。戚姬只是仗着刘邦当后台，把宝完全压在一个人身上，虽然有最高领导撑腰，却未免势单力孤。


    三是心理问题。戚姬的主要后台是刘邦，其实刘邦硬拍板，谁也无 可奈何，但是他始终优柔寡断，朝臣一碰就“卷刀”了。吕后心狠手辣，当时在人们看来却好像处于弱势，从而获得了许多人的同情。


    ### 四、豁达大度，从谏如流


    在楚汉争霸之初，项羽有雄兵百万，刘邦只有区区二十万，处于明显的劣势。但刘邦接受樊哙、张良、萧何等人的劝谏，不与项羽正面交锋，而是处处讨好示弱，迷惑项羽。公元前
    207 年，刘邦先于项羽攻入秦国都城咸阳，在壮丽的宫殿和无数的珍宝面前，刘邦动了杂念，“意欲留居之”。


    樊哙在此时力谏刘邦，他说：“凡此奢丽之物，皆秦所以亡也，沛公何用焉！愿急还霸上，无留宫中！”樊哙一针见血地指出，奢华之物是秦国灭亡的祸根。在樊哙、张良等人劝说下，刘邦终于醒悟过来，咸阳的财宝原封不动，“还军霸上”。今天看来，刘邦此举是十分明智而且关键的。倘若刘邦贪图富贵，把咸阳据为己有，等到随后项羽统率几十万大军到来后，刘邦定会遭到屠洗。


    此后，刘邦在夺取政权的道路上，屡屡接受谋士谏言，做出了“鸿门宴上示弱脱身”、“与关中父老约法三章”、“拜帅韩信”、“拜相萧何”、“还定三秦”等一系列明智之举，使他逐步迈向权力的顶峰。而项羽攻入咸阳后，肆无忌惮地抢夺财宝，还放火烧了阿房宫，“火三月不灭”。


    曾经有人进言说：“关中阻山河四塞，地肥饶，可都以霸。”意欲让项羽定都于此。项羽却说：“富贵不归故乡，如衣绣夜行，谁知之者！”显然是一副草莽流寇的做派。进言人听了，感慨道：“人们常说楚国人是猴子戴人帽，办不成事，果真如此。”项羽大怒，下令烹死了说客。之后，带着财宝和美女，率部东归。


    ### 五、卓越智慧放心大胆敢授权


    授权是现代管理学的重要原则之一，也是管理人员在日常管理活动中需要经常面对的问题。一个人的精力是有限的，他的知识和才干也是有限的，无论他多么能干，多么有精力和才华，都不可能把一个单位或一个部门的事情全部抓起来，事必躬亲。如果大事小事都事必躬亲的话，必然大事小事都抓不好，造成“顾此失彼”的现象。


    这时，最好的办法是授权。一个成功的领导者，不仅要维护权力、运用权力，还需要适时适度、通过各种方法把自己的权力放给自己的部属，让他们通过自己授予的权力去完成某一个方面或某一个领域的任务，从而服务于自己的总体目标。


    在中国五千年的历史长河中，汉高祖刘邦是一个授权的大家。他不仅敢于授权，而且善于授权，充分发挥了授权的作用，达到了很高的水平。汉王朝建立以后，在和臣僚探讨汉兴楚亡的得失时，刘邦曾经指出：“夫运筹帷幄之中，决胜千里之外，吾不如子房；镇国家，抚百姓，给饷馈，不绝粮道，吾不如萧何；连百万之众，战必胜，攻必取，吾不如韩信。三者皆人杰，吾能用之，此吾所以取天下者也。”


    ## 如何避免职场陷入死循环


    原文：《资治通鉴》周纪·周纪一


    智伯之臣豫让欲为之报仇，乃诈为刑人，挟匕首，入襄子宫中涂厕。襄子如厕心动，索之，获豫让。左右欲杀之，襄子曰：“智伯死无后，而此人欲为报仇，真义士也，吾谨避之耳。”乃舍之。豫让又漆身为癞，吞炭为哑。行乞于市，其妻不识也。行见其友，其友识之，为之泣曰：“以子之才，臣事赵孟，必得近幸。子乃为所欲为，顾不易邪？何乃自苦如此？求以报仇，不亦难乎！”豫让曰：“既已委质为臣，而又求杀之，是二心也。凡吾所为者，极难耳。然所以为此者，将以愧天下后世之为人臣怀二心者也。”襄子出，豫让伏于桥下。襄子至桥，马惊；索之，得豫让，遂杀之。


    翻译：


    智瑶的家臣豫让想为主公报仇，就化装为罪人，怀揣匕首，混到赵襄子的宫室中打扫厕所。赵襄子上厕所时，忽然心动不安，令人搜索，抓获了豫让。左右随从要将他杀死，赵襄子说："智瑶已死无后人，而此人还要为他报仇，真是一个义士，我小心躲避他好了。"于是释放豫让。豫让用漆涂身，弄成一个癞疮病人，又吞下火炭，弄哑嗓音。在街市上乞讨，连结发妻子见面也认不出来。路上遇到朋友，朋友认出他，为他垂泪道："以你的才干，如果投靠赵家，一定会成为亲信，那时你就为所欲为，不是易如反掌吗？何苦自残形体以至于此？这样来图谋报仇，不是太困难了吗！"豫让说：“我要是委身于赵家为臣，再去刺杀他，就是怀有二心。我现在这种做法，是极困难的。然而之所以还要这样做，就是为了”让天下与后世做人臣子而怀有二心的人感到羞愧。”赵襄子乘车出行，豫让潜伏在桥下。赵襄子到了桥前，马突然受惊，进行搜索，捕获豫让，于是杀死他。


    解析：


    智瑶是个有才无德的君主，得罪韩国国君和国相，后来又分别向韩国、魏国及赵国所要封地，因为被赵国拒绝，带领了韩魏两国去攻打赵国，最后反过来家族被杀死且土地被瓜分，赵襄子把智瑶的头骨涂上漆，作为饮具。这个历史人物虽然落到如此的下场，但却不曾想也有人为其报仇。此人就是豫让，先后三次刺杀赵襄子，最后一次被杀。其实撇开豫让是否需要刺杀赵襄子这件事情来说，我们以史为鉴，可以看到一个底层小人物的职场故事。


    ### 选错平台：


    豫让刚出道的时候，没有去到一个好平台，在范氏和中行氏当家臣时，没有展现自己才华的机会，于是跳槽来到了晋国，成了智瑶的手下。结果老板自己作死一下子作到连家族都破灭了。女怕嫁错郎，男怕入错行。男子跟错了老板，也是倒霉一辈子。梁园虽好，却非久居之地。智瑶看着花好朵好，却非一个好的选择。


    ### 缺乏调查：


    每个君主或者大家族门下都有若干门客，当选择投靠哪一家的时候，少不得要先做一番尽职调查。看看投靠对象是否有发展潜力。智瑶属于从小被宠惯了的富二代，这个也就意味着肯定会忍不住为自己的马仔们花钱让其努力为自己办事，但是这样的日子并不能长久。因为在整个春秋战国的博弈格局中，这样的人虽然开始有一副好牌，但是却没有好的牌技，因为赌性太大，很容易就会中途出局。所以在真正投靠之前，还是需要选择一个靠谱的投靠对象，以免自己一受了别人的知遇之恩，此生都要尽心回报了。


    ### 缺乏表现：


    豫让的个人品牌塑造缺乏策略，我们继续往后读史书，会看到毛遂自荐脱颖而出的故事，会看到冯谖怀才不遇弹铗而歌的故事，可见很多有才之士一开始也是默默无闻的。如何将自己推荐到主君的面前展现自己的才华也是一个非常重要的技巧。虽然从史书上短短的记载，无法确切的了解豫让到底有多少真正的才华，但是没有办法推广自己，落得最初的抑郁不得志也是正常的。


    因此我们可以看到豫让的死循环。


    缺乏个人品牌 ——>> 在范氏、中行氏的不得志 ——>> 由于没有机会展现自己，导致在业内没有名气 ——>> 个人目光短视，跳槽到智瑶手下 ——>> 终于被重用了一把，结果
    老板狗带了 ——>> 为了报答知遇之恩，刺杀赵襄子 ——>> 执意刺杀有主角光环的人物，所以只能被杀。


    豫让是很多人在职场上的缩影，最后自己个人的道路越走越狭窄，实在是可怜又可悲。


    ## 权谋家必须具备演技


    王莽是新朝的建立者，也是这短暂王朝的终结者。最近看《资治通鉴》里的一篇文章——王莽复出，我觉得可以这样评说他，他太会演了，要是在当今，他一定是实力派演员。可是生在那个纷乱的时代，他的演技全用在谋取大权上了。


    看罢此文，很感慨。也许只有这样的人才适合在官场左右逢源。全文非常细致地描写了王莽再次复出之后，为他谋取大业所做的一切。他对自己的言行极其的注意，表现出来的往往是一个谦谦君子的形象，礼贤下士、温和谦恭；所以他拥有家族里甚至官场上绝无仅有的好名声，不像其他骄慢的外戚。但本质上却并非如此，他虽是外戚，但由于父亲和兄长早亡，他和母亲过着凄清的日子，全靠亲戚接济，也由于此原因他练就一套为人处事的本领。机会一旦来临，他会毫不犹豫地摆脱目前的状况，所以，西汉元寿二年(公元前一年)，汉哀帝去世，他被重新重用时，他开始为一个顺我昌逆我亡的朝廷积极筹备。用书里的话说“于是附顺莽者拔擢，忤恨者诛灭”。这让我想到了曹操
    “宁我负天下人，不愿天下人负我”，这是多大的“雄心”啊！这样的人是可怖的，他慈眉善目之下掩藏的是蛇蝎毒心。多少人被他的外表欺骗，而且是心甘情愿地相信，这只能说明他太会表演了；又有多少人死在他的魔爪之下，不可胜数，只因与他的意愿相悖。


    总结起来，他能够执掌大权的原因:


    - 一、收买人心，所谓“得人心者的天下”，他很明白，他在大众面前塑造了一个贤者的形象，得到上至太后，下至百姓的普遍信任，为他的宏图大业铺平了道路。

    - 二、够狠。政治上一旦有与自己不合的人，那将是极大的威胁，他会找各种理由将他们“合法”地除掉；到最后留下来的全是依附拥戴他的人，这样的朝廷必然由他说了算。

    - 三、懂得以退为进。每每退让他应该得到的官职和赏赐，几次三番，他得到的是更高的官职，还有好名声；或在朝廷打击外戚的时候，及时隐退，等待时机复出。

    - 四、能够审时度势，“演”得真。他叔父生病，他一连好几个月半步不离地照顾，比亲儿子还亲，只为叔父将官位传给他；在封赏时，他称病不起，再三退让，最后以全民皆赏为条件接受了赏赐，他赢了民心兼职位。


    从某个方面来说，王莽不失为一个能人，但是他生活在那个年代，西汉已走入末路的时期，仅凭他一人之力无法扭转整个去势，这也注定了 他悲剧的人生结局。现实如此，王莽，实力派演员，无论如何卖力，也无力改变。不过在历史的银河里闪耀过，并载入史册，也算是他的人生里有意义的一笔了。


    ## “事必躬亲”太累，老板要学做“甩手掌柜”


    原文：夫以四海之广，兆民之众，受制于一人，虽有纶伦之力，高世之智，莫不奔走而服役者，岂非以礼为之纪纲哉！是故天子统三公，三公率诸侯，诸侯制卿大夫，卿大夫治士庶人。贵以临贱，贱以承贵。上之使下犹心腹之运手足，根本之制枝叶，下之事上犹手足之卫心腹，枝叶之庇本根，然后能上下相保而国家治安。故曰天子之职莫大于礼也。


    《资治通鉴》周纪一 威烈王二十三年（戊寅、前 403）


    翻译：四海之广，亿民之众，都受制于天子一人。尽管是才能超群、智慧绝伦的人，也不能不在天子足下为他奔走服务，这难道不是以礼作为纪纲的作用吗！所以，天子统率三公，三公督率诸侯国君，诸侯国君节制卿、大夫官员，卿、大夫官员又统治士人百姓。权贵支配贱民，贱民听从权贵。上层指挥下层就好像人的心腹控制四肢行动，树木的根和干支配枝和叶；下层服侍上层就好像人的四肢护卫心腹，树木的枝和叶遮护根和干，这样才能上下层互相保护，从而使国家得到长治久安。所以说，天子的职责没有比维护礼制更重要的了。


    解析：企业规范化管理不仅是一门学科，更是一种文化。要让员工获得成就感，就要把员工看成一种资源，管理者承担的是使员工发挥所长的责任。为什么很多管理者在管理企业时会感到“累”？大部分原因是因为管理者追求“尽善尽美”或“事必躬亲”，整日惶惶不安，为企业出现这样或那样的问题终日奔波在第一线。然而，管理者越是这样，企业越容易出现这样那样的问题而终日处心积虑。据说历史上最勤政的皇帝就是明末的崇祯皇帝朱由检了，但他最后不仅亡国而且自己也吊死在了煤山。可见，勤政和业绩也不一定成正比的。因此，管理者要想轻松、高效地管理企业，就要规范管理企业。


    ### 一、分级管理而不越级


    当企业发展到一定程度，就要开始进行分级管理。一竿子插到底，让管理者往往“出力不讨好”，因此在规范管理企业上，就要明确各层级管理人员的责任和奖罚。即使遇到问题，只要不涉及企业大局的，只需要所属部门自行处理即可。这样即使企业员工再多，管理者也能从管理员工的沉重负担中解放出来，只要管理各部门负责人就能维持企业正常运转。这种管理方式充分调动员工的创造性、积极性、主观能动性和责任感，让管理者有更多时间去研究关于企业发展方向的决策性问题。


    ### 二、多想、多看，少说、少干


    大小事不必“事必躬亲”，做到“旁观者清”，切勿“当局者迷”，站在客观的角度，才能有效、公正的判断是非曲直；才能看清企业发展出现的内部矛盾与外部危机，分清哪些事情企业应该坚持，哪些需要改进。就算你比你的员工强，也不要“事必躬亲”，一个指令或一个示范即可。


    ### 三、大事心知肚明，小事难得糊涂


    ## 权谋家“手腕”


    - 1. 获利。


    利益是衡量一个权谋手腕成功与否的标准，使用权谋手腕的权谋家最终是要获利的。一般说来，利益是谁得到的，就是谁使的手腕，当然这不是明显的，而是迂回的，这也是看其手腕是否高明的准则，手腕越是高明，隐蔽性就越强，这也是值得把握的一点。


    - 2. 借势。


    权谋家的手腕中，借势已经不再稀奇了，这种借力打力，借力行事更是司空见惯了。马基雅维利在《君主论》中有这样一句话：“凡是一度叛变的地方被征服之后不会那样容易丧失，因为统治者会利用叛乱提供的机会毫不犹豫的惩办罪犯，把可疑分子搞清楚，并在薄弱的地方加强自己的地位”。这句话充分说明了作为权谋家的借势，而且要借足势。


    - 3. “全”的思想。


    我把“全”看成两个方面，第一个方面是对整体的统筹，对整体的规划，是对事物运作全局的把握，这一点可以看出权谋家的洞察力，和对全局的控制力，这里的“全”可以理解为全面。第二个方面是全都的意思，这点尤为重要，这是一个打击面的问题，也是一个全争思想问题，我这两句话大家看一看哪句话表现的是全争思想，（1）剑是一切。（2）一切是剑。估计大家都已经看出来了，显然是第二句表现出全争思想了，我用我的一句话来形容一下全争思想，那就是：“团结能团结的一切力量，使用能使用的一切手段，利用能利用的一切条件，来为我所用”。


    - 4. 魄力。


    这在某种程度上表现出不近人情，狠毒，在这里我不想多说。


    ## 权谋家擅长礼送出境


    我们生活中会遇到各种各样的人，有好人，也有坏人，有投脾气的，还有一见就烦的。


    假如和你共事的同事中有一个令人讨厌的家伙，你该怎么办呢？


    是引导他，教育他，帮助他，还是和他直接对着干？


    《水浒》里的办法和上面说的这些都不是那样。


    对一些与整个团队格格不入的人，不打不闹，也不帮助，不教育，最后还把问题解决了，这个办法就是礼送出境。


    第一个被礼送出境不是别人，是书中的第一大反面人物——高俅。


    当年高俅没有发迹的时候，落魄至极。因为不务正业，被亲生父亲告上官府，发配出东京界。


    发配期间，幸而得到赌场老板柳世权的收留，暂且安身。三年之后哲宗皇帝大赦天下，高俅得以重返东京。


    我们今天说的这个故事就是从高俅返京说起的。


    柳世权柳老板知道高俅可以返京了，但是高俅一个刑满释放分子，返回东京后是需要生计的。柳老板很是仗义，本着“帮人帮到底，救人需救彻”的精神，写一封书信将高俅托付给东京城里开药铺的将

