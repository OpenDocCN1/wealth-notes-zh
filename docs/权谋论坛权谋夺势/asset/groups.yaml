    ## 三、妙喻


    这里所谓的喻，是指开导人，是一种说人的方法。对对方的言行有不同的意见，或对其缺点提出改正的方法，先不提出自己的见解，而是有针对性地引用他事或别人的语言作为譬喻，但譬喻必须有吸引力、说服力、启发力，才能促使被谕者觉悟和易于接受。《战国策》和刘向《新序·杂事》等古代史籍都记有不少妙喻，至今仍不失去其开导人的魅力。


    ## 四、微言


    所谓微言，是指精微要妙之言。其警句妙辞，可叩人心弦，开人心窍，促人省悟。


    ## 五、巧劝


    劝解，是件吃力不易讨好之事。劝解是为了调和矛盾，使矛盾的双方和好如始，或消除仇恨。矛盾的双方总有是非，劝解者必将赞同一方，劝解者表面上尽管装得不偏不倚，但实际上有所偏护。善于劝解的人，不仅以理眼人，措辞也各有巧妙，或以情喻义，或哄中含谏，或外骂内帮，或反言相劝，都达到劝解的目的。


    ## 六、智激


    智激，是说人的一种方法。智激有种种：或以激试探后始上说辞，或激怒对方引起对方对自己要说的话的注意，或针锋相对地与之辩论以理服之，等等。激的目的，是使被说的人听其说。而激就必引起双方冲突，这种冲突必须掌握分寸，使冲突逐步趋向统一。激怒对方，要使之由怒转喜，这样，被说者则有可能接受所说。不然，说必失败。当然，说理必须充分，对方才能接受。激的对象要选得其人，对方是有所作为，或能分明是非的人，激才有效；如果是无所作为的人，其心已像一潭死水，对这种人不管如何激也激不起波纹。


    ## 获得权力的三大策略


    - 1、打断；2、质疑讨论的前提；3、语言有说服力。


    ### 【打断】


    1、在所有的人际互动中，打断是权力的来源之一。有权力的人打断别人，权力较小者被人打断。会议分析领域的一些学者指出，在交谈中打断别人虽然没有礼貌，但可以显示出权力，这是一种有效的权力举动。

    2、在各种情况下，谈话模式都会强化权力和地位差异；这些差异产生于其他来源，比如一般社会期望和专业人士的权威。

    3、权力不仅产生在巨大的讲台上，产生于私人交往和小型会议上。


    ### 【质疑讨论的前提】


    1、权力有三个方面：第一个方面是赢得直接争论的能力。例如，在是否推出新产品的争论中，你能不能让自己的观点占上风？第二个方面比较微妙，它是指你能不能决定议程，能不能决定是否在议程中就一些具体问题展开讨论。比如，引进新的产品或服务这个问题，是否甚至会让大家讨论呢？第三个方面则更加微妙，它是指你能否决定人际互动的规则，议程和结果就是通过这种人际互动形成的。

    2、占据优势位置的一方可以用这样的方式来施加影响：即质疑和挑战对方陈述背后的基本假设，这也是在人际互动中获得权力的一项策略。

    3、一个人把看似合理的常识性问题摆到了桌面上，吸引了大家的注意力，让大家不得不重新讨论事情的一贯隐含假设。


    ### 【语言有说服力】


    ## 权谋应用


    - 1、有影响力的语言能够引起强有力的画面感和情绪，甚至于可以压倒理性。

    - 2、话语是唯一永恒的东西。

    - 3、有些词汇对鼓动情绪十分重要。

    - 3、那些促进认同感和归属感的语言具有说服力，可以支持你的和他的想法。

    - 4、要让语言有说服力，句子结构很重要。“在声音的重复和论点的完备之间当然没有任何逻辑关系，但如果运用巧妙，重复可以强化和巩固逻辑点，甚至在没有逻辑点的时候制造出存在逻辑点的幻觉。”

    - 5、我们经常会避免让我们感到不舒服的情形，但如果想在言语和行事中更好地体现出权力，没有任何东西可以替代经验。

    - 6、你的社会关系以及你如何通过访谈和举止表现你自己，这些都是树立声望和形象的组成部分。声望是权力的重要来源。


    ## 哪些是上等的权谋决断


    上等的权谋决断，都至少有三个逻辑起点。


    **背景:** 李克用被朱温大军困在太原，经过几番考虑决定放弃北窜、死守太原，李克用弟李克宁本来被封为忻州，正在赴任北上的半路，听说朱温军团攻打太原，立刻折返，说“太原是我葬身之地，我还去哪呢！”


    **分析:** 李克宁的决断可以说非常完美，表现出一个权谋家的优秀素质。


    1. 避免背上临阵脱逃的罪责。如果李克用抵挡了敌军，自己就很有可能被人以临阵脱逃的罪责构陷。

    2. 避免引起李克用怀疑。他可以借北上赴任为由躲避强大的敌军，而让李克用遭受冲击，但实际情况是，敌军凶猛，李家想要生存，就必须拧成一股绳，如果自己丢下李克用北上，李克用会认为他想借敌军杀自己，然后自己取代李克用，引起内乱，这样会让李家军瞬间瓦解。

    3. 稳定军心。军事处于劣势，仍可以有经营的余地，如果军心慌乱，队伍就势必瓦解。在危急关头，全军希望看到的是上层的从容镇定和团结一致，如果李克宁先走了，会给人呈现上层分裂的画面。计策的核心，就是计算。计算的得失在于你能否有无懈可击的逻辑起点。这样才会训练你养成周密的素质。


    ## 从权谋家身上学习说服别人手段


    张仪游说诸侯王们自有一套游说模式，第一步张仪上来就开始危言耸听，鼓吹秦国之强，强调六国所处之劣势，以动摇别国与秦国对抗之决心。“魏地方不至千里，卒不过三十万人。地四平，诸侯四通，条达辐辏，无有名山大川之阻。”“此所谓四分五裂之道也。”“韩地险恶，山居，五谷所生，非麦而豆；民之所食，大抵豆饭藿羹；一岁不收，民不厌糟糠；地方不满九百里，无二岁之所食。”“秦带甲百余万，车千乘，骑万匹，虎挚之士，科头，贯颐奋戟者，王不可胜计也。秦马之良，戎兵之众，探前后，蹄间三寻者，不可称数也。”张仪抓住别国的忧患，采用铺陈扬厉的游说方法给六国国君造成心理压力，从各个方面进行将六国与秦对比，以突出别国的弱小与秦国的强大，以动摇六国合力抗秦的信心。


    第二步张仪把矛头直指合纵，为了证明合纵战略之不可行，张仪直接指出合纵战略在军政上难以实施，比如他对楚王说若是秦国出兵武关进而向南进攻，那么楚国北面的交通就会被切断，楚国三月之内就会陷入危急形势，若是依靠合纵而等合纵国的援军，最快也要在半年才到，远水救不了近火楚国就会危亡了。还曾游说齐宣王：齐国与鲁国曾三次交战，鲁国虽三战三胜却因此而走向衰弱继而亡国，虽徒有战胜之虚名却走向亡国的命运，这是因为齐国强大而鲁国弱小，如今的赵国与秦国正如当初的鲁国与齐国，赵国与秦国几次交战虽都战胜秦国，但是赵国实际已经在走向衰亡了，以此向齐宣王证明以弱攻强之不可行。他还指出合纵战略之所以难以实施还因为合纵国的不可靠，为了使自己的论述更加具有说服力，在陈述的过程中张仪采用列举史实的游说方法，比如为了离间燕赵两国之间的关系他举出历史事实：昔日赵襄子把姐姐嫁给代君，并送大量的礼物百般讨好代君，但是却是意在吞并代国，他与代君约定在句注关塞会面，暗地里让工匠只做了一个柄极长可以用来打人的铜勺，在与代君喝酒之前吩咐侍者，当喝酒兴致正浓时就找时机用铜勺打死代君，于是当酒意正浓时，侍者趁机用铜勺击中了代君的头，代君脑浆流了一地，代君死后赵襄子的姐姐得知代君死讯，于是用发簪自杀而亡。在历史事实的面前，成功让燕王觉得赵国的不可相信，成功瓦解了合纵国彼此的信任。张仪为了推行连横战略往往与合纵者针锋相对，采取直接攻击主张合纵者的方法来使他们失去诸侯王的信任，他游说魏王：主张合纵的策士们大多夸夸其谈并不可信，他们坐着诸侯的车子出去游说，若是成功便可以得到封侯的资本，所以他们并不从实际出发为诸侯王进行谋划，而是只顾自己的利益才大肆鼓吹合纵之利，从而使六国国君在心理上对合纵者产生怀疑。


    第三步施加军事威胁，张仪利用了诸侯王们畏惧秦国的心理，从而威胁别国如果继续选择合纵与秦相抗或者保持中立，面临的将是灭国之危。比如他威胁燕王：若是不归降秦国，秦王就会发兵云中、九原，令赵国大军攻入溴过，那么燕国就会失去易水和长城了。他还曾威胁韩王，对韩王说：若是韩王不侍奉秦国，秦王将发兵一样，切断韩国上党的交通，冬眠攻取成。宣阳，这样鸿台、桑林也不再是大王您的了，若是成。被秦国占领，上党要道也就随之被切断了，这样韩国也就陷于四份五裂了。张议的威胁并不是抽象的，相反他将不事秦，秦国将会采取的军事行动详尽地向六国国君进行描述，将抗秦将会面临衰亡的命运摆在他们的眼前，增强了他们的危机感，使对方进一步认识到与秦国相抗是无法取胜的。


    第四步提出解决的出路，张仪站在别国立场为其分析合纵抗秦将给带来的严重后果，在一连串的威胁施压下，已然攻破六国国君心理防线，此时张仪又开始站在别国立场为其分析事秦将会带来的种种好处。他对魏王说：为了您考虑不如归顺于秦，若是归顺了秦国，那么楚国和韩国也就都不敢轻举妄动了，没了楚国和韩国的忧患，大王就可以高枕无忧了，国家也就没有忧患了。


    还曾诱惑韩王说道：大王可以西面侍奉秦国并为秦攻楚，那么秦王就一定会很高兴，这样您不但可以使韩国免于兵祸还可以占有楚国的国土，而且还因此而取悦了秦王。如此晓以利害，软硬兼施，六国国君无力招架，纷纷放弃合纵转而事秦。


    在这过程中张仪的高明之处在于他不从秦国的角度去劝诸侯王们应该怎样做，而是站在他们各自的立场为其出谋划策，从而打破了诸侯们的心理防线，心甘情愿地按照张仪的想法去步步实施。


    ## 权谋家造势细节


    **原文**


    **史记《晋世家》**


    十九年，献公私谓骊姬曰：“吾欲废太子，以奚齐代之。”骊姬泣曰：“太子之立，诸侯皆已知之，而数将兵，百姓附之，奈何以贱妾之故，废嫡立庶？君必行之，妾自杀也。”骊姬佯誉太子，而阴令人谮恶太子而欲立其子。


    二十一年，骊姬谓太子曰：“君梦见齐姜，太子速祭曲沃，归釐于君。”太子于是祭其母齐姜于曲沃，上其荐胙于献公。献公时出猎，置胙于宫中。骊姬使人置毒药胙中。居二日，献公从猎来还，宰人上胙献公，献公欲飨之。骊姬从旁止之曰：“胙所从来远，宜试之。”
    祭地，地墳；与犬，犬死；与小臣，小臣死。骊姬泣曰：“太子何忍也？其父而欲弑代之，况他人乎？且君老矣，旦暮之人，曾不能待而欲弑之。” 谓献公曰：“太子所以然者，不过以妾及奚齐之故，妾愿子母辟之他国，若早自杀，毋徒使母子为太子所鱼肉也。始君欲废之，妾犹恨之，至于今，妾殊自失于此。”


    **解析：**


    第一步，欲擒故纵。晋献公违卜立骊姬为夫人后，想立骊姬之子奚齐为嗣。骊姬尽管心中甚欲，但却跪求晋献公不要这样，甚至于诚恳到“欲行废立，妾宁自杀”。


    第二步，结党营私。骊姬以色拿下晋献公身边宠优优施，又以金币结交晋献公近臣东关五、梁五。


    第三步，排除异己。骊姬利用二五巧言晋献公出申生于曲沃、重耳于蒲、夷吾于屈。三公子俱远居晋鄙，骊姬益献媚取宠，以蛊其心。


    第四步，挑唆父子。骊姬夜半而泣，晋献公惊问其故。再三不肯言，迫之而道出缘由：申生说我惑乱于君，申生人很好，这不能怨他。这是我的不对，为了黎民大业你就杀了我吧。晋献公认为仁爱的申生不会反其父，骊姬亮出了“匹夫以爱亲为仁，上者以利国为仁”的观点，并举了周幽王与周平王父子的例子。这让晋献公十分担心，并且意识到了事情的严重性。骊姬又劝晋献公让国与申生，晋献公不同意。


    第五步，试探进攻。骊姬让晋献公派申生伐皋落氏。败了“罪其有名”胜了“信其得众”。


    第六步，发展势力。骊姬结党荀息使之傅奚齐、卓子，拉拢里克保持中立。


    第七步，正面交锋。骊姬召回申生，留申生吃饭诬其“言戏于妾”，邀申生游园诽其“调戏于妾”。


    第八步，收关之作。借晋献公外出之际，骊姬让申生祭祀齐姜，送胙回宫。晋献公回宫后，骊姬下毒于胙，并在晋献公享用之前亲自验之。从而彻底激怒了晋献公。晋献公下令讨杀申生，申生自杀。


    如此不难看出，骊姬设计之精巧，毒计之巧妙，连环计之巧合。


    先说设计之精巧，八步连环计，环环紧扣，缺一不可。再说毒计之巧妙，单单骊姬把一个晋献公玩弄于股掌之上一点就可见一斑。


    最主要的是连环计之巧合。逐出申生、重耳、夷吾巧有曲沃、蒲、屈三城，一人一个；为奚齐找个太傅巧有刚刚假途灭虢得胜而归的荀息；最最巧的是这两个主角：一个是城府极深、貌比息妫，妖同妲已，智计千条，诡诈百出，在献公前，小忠小信，贡媚取怜的骊姬；另一个是慈仁精洁、耻于自污、惮于贼人、愚孝、愚仁的申生。


    ## 培养权谋头脑的五个阶段


    虽然一直很强调「谋略」，但其实这玩意儿一直是社会高层的不传之秘，这些高官、富豪除了让自己的后代接受正规学校教育之外（还都是名校），还会让他们读一些特别的书，甚至有传说，有许多书本并没有流入民间。有一位台商富二代曾告诉我，他老爸在他很小的时候就要他读《菜根谭》。其实不难理解，权谋的本质是道家的东西，再怎么说《菜根谭》也是儒道释三家合一的语录体，有权谋色彩其实不难理解。


    实际的情况是，权谋这玩意儿就跟带兵打仗一样难学，而且玩命的程度跟战场没两样，台面上看到得这群人都是费尽心机不知道踩了多少尸体才爬上去的高位，有多少多少踏人这领域的一不小心就掉了脑袋、被关黑牢到天荒地老、或是被劳改到海枯石烂。学任何东西都有其阶段，要成为权谋高手也是，也是要一等级一慢慢打路边野猪练起，时不时还要点一下缺少的技能，练一下打怪的手感，整个权谋的学习过程，可以分为五个阶段：


    ### 阶段一：基础知识学习


    就跟算数学要先学加减乘除一样，权谋这玩意儿也有基本的组成元件要先拼凑，心法方面，可以读《孙子兵法》、《韩非子》、《战国策》、《老子》，这类专讲谋略或是历史的书，要提醒你的是，读这些书千万不能像语文课的读法一样去读，我们得通晓人性，这正是每一位权谋份子不希望麻瓜们拥有的知识，开玩笑，要是你知道我怎么玩你，那我要怎么玩你？有了这些知识，我们才可以升级到等级二，当然，如果你是高干子弟，从小就耳濡目染在看你老豆怎么搞别人，那可以直接跳第三阶段。


    ### 阶段二：实战


    我始终相信，只有真正的实战能让人学到真正的东西，前面读了一大堆理论，没有实战做验证，你自己都不太相信读进来的东西是不是正确的，而这个阶段也是最多人放弃的，有些是发现自己不是这块料，有些则是不小心被搞掉……如果你真的要放弃，我希望是第一个原因。


    战国时期赵国有个叫赵括的，只读了《孙子兵法》就上场跟秦国名将白起一争高下，一输就输掉了四十万兵马，纸上谈兵这成语就是他创的。


    ### 阶段三：近乎冷血的理智


    你有没有看见股票涨停以为要变飙股，好不容易梭哈买到涨停价，当天收盘却下杀跌停？或是看到对手出现一个连瞎子都看得到的破绽就见猎心喜长驱直入，却没想到这是一个诱敌引你入局的招？实战时会遇到的一个大问题，就是面对自己的情绪。我们作为凡人，注定有七情六欲缠身，彩卷中奖你会爽半天、股票涨停你会高潮，小赌小闹你还敢大胆去押注，但如果是用人命做赌注的游戏呢？


    搞权谋的通通都是这类游戏，小则赌上自己的荣华富贵，大则全家老小的命都赌进去，看看那位关在土城看守所的前总统。


    再者，会看这篇文章的可能连只鸡都没杀过，其实我也是，哈哈；那么，你能不能在真的要制敌人于死地之前摒除妇人之仁把他往死里打？我跟这家伙无冤无仇耶，他只不过挡住了我的升官之路，有必要做这么绝吗？要，今天你不绝他，明天就挨他绝你子孙。在必要的时候，得牺牲少部份人的权益或是性命去成就大业。


    要是这其中有你的家人朋友呢？你敢不敢把他们的牺牲当作统计数字里的一部份放手去干？这就是现实，身为权谋份子，势必要有掌控自己情绪决断力。


    ### 阶段四：决策能力


    我始终认为，阶段四是决定一个权谋份子是否优秀最重要的一项指标，各位同学必须整合阶段一到三学到的能力才能在这个项目拿到高分；想像你今天是一场学运的总指挥，或是一场政变的主谋，背负的是几千几万人的命运，被激怒后不加思索贸然进攻，死；知识不足错判形势，死；用人不明被奸细出卖，死；失败的原因太多，而成功的因素却只有一个，就是每一个环节都妥善规划并确实执行。


    这也正考验决策是不是够灵活多变，能够根据现实状况做应变而不是照本宣科去打套路，是能不能笑到最后的一个重要指标。如果这关过了，那还得过第五关才足以画龙点睛成为免许皆传的大内高手。


    ### 阶段五：藏


    自古以来的权谋高手都有一项特质，叫喜怒不形于色，甚至看起来像个白痴，历史上有太多的例子是装白痴去掩盖自己的真实意图，各位同学很幸运，我们台湾就有一个很好的例子可以观摩。


    有句话说「狠莫大于藏」，我之所以把「藏」放在最后的一个指标，是因为在权谋的路上有太多太多状况让你必须要隐忍，它是一种最强大的心理素质，高手过招时已经不再是拼技术，而是拼谁在心理上先行松懈出现漏洞，有的时候会在同一个对手手上输上好几十次，这时间也可能拉到几十年之久，就为了最后的反扑博得最后胜利，赌神高进不就在前一局故意盖牌输给仇笑痴让他愿意赌手感眼睛去拼最后一局的红心
    A 吗?


    上面这五个阶段，其实不是壁垒分明一阶一阶分开，你随时都可以回过头去加强上一个阶段的能力，而这五阶段都具备的人才，那可以说具备了水镜八奇的思考领域。另外，如果阁下想要在华人圈子里搞权谋，务必熟读《论语》这类的儒家学说。


    最后，送上我个人很景仰的南怀瑾大师曾经说过的一段话当作权谋教育的眉批，你就会知道为什么搞权谋一定要懂儒家：


    - 佛为心，道为骨，儒为表，大度看世界；

    - 技在手，能在身，思在脑，从容过生活。


