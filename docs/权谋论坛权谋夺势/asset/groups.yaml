    # 权谋造势


    内部整理材料，仅供历史爱好者参考，切勿传播。


    ## 权谋


    ### 开篇寄语


    既然你没死、你还活着，那么你的人生，就只有两条路可走，或为弱者怨恨不公，泪水洒落飘零，乞求强者的残羹剩饭。如狗一般感谢着摇尾乞怜，回到破落狗舍，心怀愤懑舔着犹含汤汁的破碗，想着明天必定要大大哭闹一番。或为强者已远离人群，独自思考该如何制定规则，让弱者分到的残羹剩饭更少些。


    是的，如果你是强者你就可以制定规则、划出道理，其余众人要么遵守，要么出走。


    因为在世界本没有绝对的平等，所谓公平不过是强者向弱者的示好。弱者泪水换来的食物不是吃剩下的，就是挑剩下的。要追求公平，与强者平起平坐，采集到新鲜甘美果实，只能用智慧来争取，从人类到自然界到整个地球彼此间干戈扰攘、争斗不休的根源就是资源。


    资源是什么呢？“资源”这个词是一个非常宽泛的概念。资源可以是阳光、水、土壤，可以是生存空间，可以是动物植物，可以是饮食男女，可以是高楼名车，可以是高高在上，可以是生杀予夺。


    资源进入了人类社会之后一般表现为物质资料即生产资料和生活资料。在这之上资源还表现为金钱、名望和权力。由于资源是稀缺的、有限的，资源与无限的占有总是存在着巨大的鸿沟，因此为了争夺稀缺资源的斗争便屡见不鲜了。


    比如市场上商人的机关算尽，学界里学者们的党同伐异，官场上官员们勾心斗角，这些都是人们为了争取稀缺资源而进行的竞争。由于资源是稀少的，为了夺取稀缺的资源人们便八仙过海各显神通。有的通过暴力掠夺，有的通过欺骗获得，有的通过交易互换，有的通过索要勒索等等手段不一而足。


    资源是有限的，竞争是无情的，你没有智慧只能被收割。最近“智商税”这个词很流行，我认为所谓的智商税就是你对社会的认知不足。


    因为你永远无法挣到超出自己认知范围之外的资源，除非你靠运气，但是靠运气挣的资源，到最后往往会靠实力亏掉，这是一种必然。你所挣的每一份资源，都是你对这个世界认知的变现，你所亏的每一份资源，也是你对这个世界认知的缺陷。这个世界最大的公平在于，当一个人的资源大于自己的认知的时候，这个社会有
    100 个方法收割你，直至你的资源与你的认知相匹配为止。


    此刻你最关心的问题，同时也是身边人最关心的问题，如何最大化地获得自己的利益同时最大化地降低自己的损失。


    在竞争中需要勇气和魄力、需要为了自己的目标而做出最大程度的努力。可你轻视了智慧远远比勇气更为重要。


    在生活中不乏那些智识之辈一计既出鬼神皆惊。他们往往能够将你我活的竞争变成任其掌握和操控的游戏，谋定而后动，运筹帷幄之中决胜千里之外。这样的人有着丰富的斗争经验和成熟的斗争智慧、有着敏锐的直觉和睿智的头脑。他们在斗争中从来不会盲目冲动、不会感情用事、不会一厢情愿、更不会随心所欲。


    他们在进行任何活动的时候总是要经过复杂的计算、通过认真的推理，通过严格的判断，最后作出一项尽可能逼近事实真相的判断。并且在行动过程中会随着不断变化的事实随时作出新的判断，并调整自己的行动。


    相比之下，从前的你是否为“三拍”人士？


    - 一拍脑袋作出决策。

    - 二拍胸脯夸夸其谈。

    - 三拍屁股走人了事。


    原因在于你不肯动脑筋、不肯研究事物真相，成了一个“嘴尖皮厚腹中空”的人。


    还有另一种，你做事的过程中也有着坚忍不拔的毅力、有着不达目的誓不罢休的精神。但是你从来不能深入到事物内部中，去揭示其真正的规律。而总是凭借匹夫之勇使蛮力用蠢劲，我告诉你这是有勇无谋表现。其结果往往是功夫下了一箩筐最后却竹篮打水一场空。


