    # 权谋应用


    减少社会矛盾，而非无视矛盾，或靠暴力酷刑压制矛盾。依靠暴力酷刑换来的稳定，终将昙花一现。用《后汉书》批评酷吏的话说则是：“末暴虽胜，崇本或略”，酷吏们试图用暴力手段来解决社会失范，只是舍本逐末，无法长治久安。


    付出了相当大的社会代价与政治成本，汉武帝打豪强运动的结果却未必美好。汉武帝派往地方州郡行政机关的酷吏，扰乱了地方权力结盟的平衡，却又缺乏有效的措施来控'
  md: "\n## 权谋应用\n\n  楚国的楚考烈王没有儿子，春申君对此十分忧虑，他遍寻众多能生育的妇女，进献给楚王，但是她们最终都没能为楚王生出儿子来。有个叫李园的赵国人带来了他的妹妹想进献给楚王，但听说楚王不能生儿子，便恐怕时间一长，自己的妹妹会失去楚王的宠爱。于是他请求侍奉春申君，做春申君的门人。没过多久，李园请假回赵国探亲，故意超过了期限才返回春申君处。春申君询问他原由，李园回答说：“齐国国君派使者来求娶我的妹妹，我陪那使者饮酒，所以就误了归期。”春申君说：“已经下过聘礼订婚了吗？”李园答道：“还没有。”于是春申君便纳李园的妹妹为妾。不久，李园的妹妹就怀孕了，李园便让她妹妹去劝说春申君道：“楚王非常宠信您，即使他的亲兄弟也比不上。现在您担任楚国的相国都有二十多年了，而楚王依旧没有儿子。照此情景，等他去世以后必将改立他的兄弟为国君，而新国君也必定要使他的旧亲信成为新贵，到那时您又如何能永保自己这种荣宠地位呢！不仅如此，因为您受楚王宠幸，长期执掌国事，肯定会对楚王的兄弟有过许多失礼之处，一旦他们登上王位，您就要面临杀身之祸。现在我怀有身孕的事情，还没有人知道，况且我受您宠爱时间还不长，假如以您的尊贵身份，把我进献给楚王，一定会受到他的恩宠。如果我托福于上天的恩赐生下一个男孩，那么将来继位为王的就是您的儿子了。得到楚国的全部，与在新君主的统治下面临难以预测的灾祸相比，哪一个结果更好呢？”春申君于是同意了，便将李园的妹妹送出府，安置在一个馆舍中住下，然后向楚王推荐她。楚王很快就召她入宫，并且对她百般宠爱。没过多久，李园的妹妹果然生下了个儿子，并被立为太子。\n\
    \n解析：李园所作所为不为人所称道，而且最终不得善终，但是他设计实现自己的目标的手段却是极其漂亮的。下面我们来看看李园如何一步步实现其夺权之旅的。\n\n\
    ### 社会调查\n\n  首先是背景调查。通过调查，李园得知当时的楚王（考烈王）没有子嗣，而且有迹象表明，楚王可能生不了孩子。事关国家大计，春申君作为楚相和楚国的王族，对此事极其热心，先后给楚王进献了很多宜男之相美女，但没有一个人孩子。此时赵国人李园携其妹一起到了楚国，李园特别宝贝他的妹妹，以为他的妹妹极其珍贵，可做王后夫人。有了上述调查结果及自身条件之后，李园便开始预谋他的夺权之旅了。\n\
    \n### 李园开始造势\n\n  能让楚王纳之。对于李园这样出身的人要想直达天听还是有困难的，似乎是比登天还难。李园是外国人，来到楚国人生地不熟，身上也没有多少钱可供他花费，即使有也不入权贵们的法眼，为权贵们出力讨巧的人也不少，根本显不出李园的本事来。于是李园想到了稳扎稳打步步为营的策略：先打入到楚王的亲人也是当时的楚相春申君那里，通过春申君来慢慢地将自己的妹妹送入王宫。\n\
    \n  这一点是可以做到的，因为春申君有好贤之名，如果自己扮成贤士进入春申君家中做个客卿，再好好拿出些本事来帮春申君做一些事情，让春申君知道他，那就成功了一半。于是也不知道他通过什么手段（贿赂门人，托关系，找门子）李园就进入了春申君家，当起了舍人，应该做得不坏，这当然是他竭力巴结的缘故。\n\
    \n### 引起领导注意的方式\n\n  当李园认为如果自己一旦离开就会让春申君觉察得到的时候，便提出回家看看，春申君同意了。\n\n  回家看看可不是一件很小的事，这是李园大棋局里很关键的一步棋，因为他要想办法把自己的妹妹引荐给春申君。然而又要不着痕迹，让春申君主动提出宠幸李嫣。好在李园在前面已经做足了功夫，把他妹妹的好处逢人便讲，夸得像是天下只有他妹妹一个好女人似的。这样还不足以让人相信，眼见为实，耳听为虚，一定要让春申君觉得李嫣确实是天下第一美人。\n\
    \n  李园这趟回家就是安排这件事的。要想让这件事成功，必须让春申君接纳自己，认为自己是诚实可靠的人，前面在春申君家的表现足以证明，现在要让春申君认为他妹妹是天下第一美人，光靠自己的一张诚实可信的嘴是不够的，毕竟萝卜青菜各有所爱，你李园哥哥看妹妹自然觉得是美若天仙，但别人呢？就未必了吧？嗯，这正是需要解决的问题，李园想方设法说动齐王派使臣来求娶李嫣。哇，这么大来头都能看上这么一个乡野丫头想来确实美若天仙了。这便是李园造势的过程。\n\
    \n  然而这件事必得让春申君知道才有下文，怎么办呢？很好办，现在我在你家做事，我玩来几天，本来是我李园的差事就会积压起来，等你春申君都知道了需要你亲自处理的时候，你自然知道我旷工了。当我来了之后，你自然就会来找我了解情况，那时候我就可以告诉你齐王建遣使求亲的事了。人都是有好奇心的，那时你还不想看看我妹妹的美貌？只要你要看，我就有信心让你喜欢上我妹妹，这点自信我还是有的。\n\
    \n### ● 春申君不懂审时度势\n\n史料：《资治通鉴·秦纪·秦纪一》\n\n楚王病，硃英谓春申君曰：“世有无望之福，亦有无望之祸。今君处无望之世，事无望之主，安可以无无望之人乎!”\
    \ 春申君曰：“何谓无望之福？”曰：“君相楚二十馀年矣，虽名相国，其实王也。王今病，旦暮薨，薨而君相幼主，因而当国，王长而反政，不即遂南面称孤，此所谓无望之福也。”“何谓无望之祸？”曰：“李园不治国而君之仇也，不为兵而养死士之日久矣。王薨，李园必先入，据权而杀君以灭口，此所谓无望之祸也。”“何谓无望之人？”曰：“君置臣郎中，王薨，李园先入，臣为君杀之，此所谓无望之人也。”\n\
    \n春申君曰：“足下置之。李园，弱人也，仆又善之。且何至此!” 硃英知言不用，惧而亡去。后十七日，楚王薨，李园果先入，伏死士于棘门之内。春申君入，死士侠刺之，投其首于棘门之外;于是使吏尽捕诛春申君之家。太子立，是为豳王。\n\
    \n翻译：\n\n楚王卧病不起。朱英对春申君说：“世上有未预料到而来的洪福，也有未预料到而来的灾祸。现在您处于生死变化不定的社会之中，为喜怒无常的君王效力，身边怎么能没有您尚未预料却忽然来到的帮手呢？”春申君说：“什么叫作‘未预料到而来的洪福’呢？”朱英答道：“您担任楚国的相国二十多年了，虽然名义上是相国，实际上却已相当于国君了。如今楚王病重，随时都会死去，一旦病故，您即可辅助幼主，从而掌握国家大权，待幼主成年后再还政给他，或者干脆就面南而坐，自称为王。这便是所谓的‘未预料到而来的洪福’了”。春申君又问：“那么什么是‘未预料到而来的灾祸’呢？”朱英说：“李园不治理国事，却是您的仇敌；不管理军务统率军队，却长期以来豢养一些勇士。如此，楚王一去世，李园必定抢先入宫廷夺权，杀您灭口。这即是所谓的‘未预料到而来的灾祸。’”春申君再问道：“这样说来，‘尚未预料却忽然来到的帮手’又是怎么回事呢？”朱英回答：“您将我安置在郎中的职位上，待楚王去世，李园抢先入宫时，我替您杀了他除掉后患。这就是所谓的‘尚未预料却忽然到来的帮手’。”春申君说：“您就不必过问这些事了。李园是个软弱无能的人，况且我又对他很好，哪至于发展到这个地步呀!”朱英明白自己的建议不会被春申君采纳了，便因担心发生变故累及自己而逃亡他乡。十七天后，楚王去世，李园果然抢先进宫，把他豢养的勇士埋伏在棘门里面。春申君一进来，勇士们即两面夹击，将他刺杀，并砍下他的头颅扔到宫门外面。接着，李园又派出官吏把春申君的家人全部捕获杀了。随后，太子毌悍继位，是为幽王。\n\
    \n解析：\n\n李园的手段固然狡猾险恶，但春申君之死，却有咎由自取的地方。考其致命错误有三。\n\n一是“不识时务”。楚王一去世，迫切追逐权力的李园，势必抢先夺权，杀掉春申君。站在李园的角度，这样做既能剪除异己实力，又能达到杀人灭口、掩盖利用妹妹争夺权力的无耻行径，此为“时务”之一。继位的新君实际上是春申君的儿子，春申君可以利用这点大做文章，揭穿李园以巩固自己的权位，并且可以先发制人除掉李园，此为“时务”之二。他的门人朱英就充分认识到了这两点。但春申君错误地估计了形势，没有清醒的洞察局势，也就意识不到即将到来的凶险。\n\
    \n二是识人不明。李园安排其妹嫁给春申君，待怀孕后再嫁楚王，将自己妹妹的幸福作为自己进身的阶梯和工具，只有利益和野心，少有血肉亲情。春申君对这样不择手段的人认识不清，对其罪恶本性估计不足，缺乏识人的犀利眼光，反而认为李园是软弱无能之人，对自己很好。\n\
    \n三是听不进不同意见。春申君的门人朱英有智慧，对形势洞若观火，对利害得失了然于心；有谋略，为春申君出谋划策，找到了解决问题的方法——先发制人，除掉李园，将权力掌握在自己手里；有勇气，愿意自己涉险入宫中除掉李园！但春申君对朱英的建议竟然充耳不闻，既不采取措施进攻，也不想办法自保。\n\
    \n游走在权力场上人，过的是刀尖舔血的生活。如果没有过人的谋略智慧，又不能识人用人，是很容易陷入绝境的。\n\n### ■ 面对新形势要有积极态度\n\n\
    #### 背景\n\n  起䒖，孙膑与庞涓一起学兵法，庞涓在魏国做将军，自己估量才能不如孙膑，便召孙膑前来魏国，又设计依法砍断孙膑的双脚，在脸上刺字，想使他终身成为废人。齐国使者来到魏国，孙膑以受刑罪人身份与他暗中相见，说动了齐国使者，偷偷地把孙膑藏在车中回到齐国。齐国大臣田忌把他奉为座上客，又推荐给齐威王。威王向他请教了兵法，于是延请他为老师。这时齐威王计划出兵援救赵国，任命孙膑为大将，孙膑以自己是个残疾之人坚决辞谢，齐威王便以田忌为大将、孙膑为军师，让他坐在帘车里，出谋划策。\n\
    \n  西方管理学讲鲶鱼效应，就是有新因素介入的话，原本的平衡局面会被冲击。我们看，田忌面对孙膑这条鲶鱼的反应：\n\n  其一，找人才。什么是人才，管用的是人才，当时齐国惦记魏国，想干掉魏国，恰巧有个知道魏国底细的人，恰巧又在那跟魏国权臣庞涓不对付，恰巧又和魏国国防部长庞涓有私仇，恰巧又是个有师承的高材生，恰巧又有了一定的政治经验，哪找去？所以派出齐使，去挖孙膑，你想啊，堂堂齐国外交官怎么会专门跑一趟牛棚呢？背后早有预谋罢了。\n\
    \n  其二，挖人才。国际较量，情报先行。鬼谷子两个徒弟出名，政治能量肯定是有的，现在这俩人闹得不愉快，把那个弱的挖过来，一是有孙膑想脱身的心理性基础，这事儿能成；二是有庞涓的步步紧逼，庞涓替田忌“先打”，田忌“后拉”，必然得到一忠诚人才。\n\
    \n  其三，鉴人才。彻夜交谈，实是探听虚实。鬼谷子神乎其神，他的关门弟子孙膑是个智库人物，彻夜长谈，运用各种提问技巧在疲劳状态下突然发问，得到对方真实想法，排出苦肉计、用间计的可能。\n\
    \n  其四，交人才。人才是好的，但也得听话，不听话白搭还危险。他对孙膑有救命之恩，百般尊重，凭良心任何人都不可能不依了他。再说，身为国务官的高级别，肯定有政敌，这也是施恩结党抗敌，一石三鸟。\n\
    \n  其五，挰人才。瞅准了，自己人，那么就壮大他，夸大其词，推荐给国王，给他战争机会去立功，只要站住脚，田忌就足以对他的的政敌造成攻势。\n\n## 揭露职场权谋家残忍造势\n\
    \n  高层领导昏庸或奸邪，高俅这种职场流氓就会吃香。高层领导昏庸，善恶不分、人鬼不辨，高俅们甜言蜜语，必然吃香。高层领导奸邪，和高俅同类相聚，有很多共同语言，高俼也会吃香。高俼这种职场流氓很会整人。整人的方法有很多种，下面简单说几种，我们称之为残忍造势。\n\
    \n  - 一、以帮助人的名义整人。\n    高棣能整林冲这种人，也能整孔明这种人。高棣会安排孔明做搬运工，每天给大货车卸水泥。不识字、手脚粗的农民每次扛两袋水泥，孔明每次只能扛一袋水泥。高棣手下的小奴才就教训孔明了：“想要事业成功一定要有强健的体魄。你工作能力这么差，领导想提拔你也没办法。”有时候，高棣昏庸的上级领导确实也想帮助人。但帮助人的事情由高棣去安排就变成了整人。高棣昏庸的上级领导读不懂“澹泊明志，宁静致远”，注定与孔明无法沟通。\n\
    \n  - 二、通过他最亲近、最信任、交往最多的人来整他。\n    职场流氓可以通过一个人的父母、子女、妻子、亲属、老师、同学、上级、同事、老板、客户等人来给他做思想工作，让他听话。在中国任何一个地方，你跟任何一个人交往，职场的流氓都有可能通过那个人给你做思想工作。职场流氓不止一个，职场流氓有身份、有地位、有异常庞大的势力。很多人出于各种考虑会顺从他们、屈服他们，不敢得罪他们。\n\
    \n  - 三、用没文化的人整人。\n    没文化的人被洗脑后，会像吸了毒品一样飘飘然，以为自己掌握了宇宙真理，以为自己特别聪明。他们会很兴奋地不断重复职场流氓输入他们大脑的文字，给人做思想工作，以改变别人的意志。有良知、有思想的人面对这些行尸走肉时，是无法与他们讲道理的。\n\
    \n  - 四、孤立他。\n    职场流氓有办法孤立一个人。例如，有思想的人批评应试教育。职场流氓在其他人面前就说：“某某人说读书没用。”这样，那些有文凭的人就会痛恨他、厌恶他。或者，职场流氓干脆在其他人面前说某某人反对党，这样所有人都不敢帮助他，而是疏远他。一些中小城市的市民，基本上都是没文化的农民，思维能力低，分辨能力低，这些人很容易被有后台的职场流氓挑拨。尤其在广东一些地方。孤立一个人，丑化一个人，瓦解一个人的人际关系，使他处于最弱小的状态。这样，职场流氓就可以象踩死一只蚂蚁一样粉碎他。\n\
    \n  - 五、利用道德文化整他。\n    一个人不管信仰什么宗教。职场流氓都能找到相应的人来对付他。这个人信仰基督教，职场流氓就通过道友和牧师来给他做思想工作。这个人信仰儒教，职场流氓就通过讲孝道的人来给他做思想工作。这个人信仰道教，职场流氓就通过道长来给他做思想工作。这个人信仰佛教，职场流氓就通过他的师父来给他做思想工作，通过有名气的佛教人士来给他做思想工作。名人未必是高人。随着权力指挥棒而起舞、而唱歌的宗教人士不能说没有吧？\n\
    \n  - 六、综合各种方法整他。\n    职场流氓不需要与被整的人直接打交道。就算一个人被整了，这个人还不知道是谁在整他。能报复谁呢？有时候，与被整的人直接打交道的那些人也被蒙在鼓里，以为自己在帮助人。\n\
    \n### ● 权谋家稳定形势手段\n\n  西汉袭秦严法，大体较春秋战国而重。然严法之下，社会并不和谐。\n\n  其时地方豪强，或由宗室演化，或由地主升级，或由巨商转成，或由游侠登堂，飞扬跋扈，横行乡里，乃至与郡守结盟，成为与官方政权平行的一种势力。汉景帝时对此即有少数举措，至汉武帝时始对地方豪强进行全面打击。\n\
    \n  汉武帝时期之打豪强，首先是政治目的，又分为中央朝廷维护统治之政治目的与地方官员维护个人地位之政治目的；其次是经济目的，主要是中央政权与地方豪强在经济领域的二元对立，打压豪强的手段常表现为“国进民退”；最后才是微不足道的民生目的，整顿社会秩序，减少豪强兼并，从而改善黎民生活。\n\
    \n  考汉武帝时期打压豪强之手段，主要有四：\n\n  - 一是利用酷吏诛灭豪强。\n  - 二是将部分地方豪强迁至长安，以“内实京师，外销奸滑”；\n\
    \  - 三是为弥补因大伐匈奴等造成的财政空虚，垄断盐铁业，排斥富贾大贾，又出告缗令，鼓励民间对富豪大贾告密，后者罚没家产由政府与举报者对分；\n  - 四是设置州刺史，推行“六条问事”之监察制度，第一条即是打击豪强。\n\
    \n  要打压豪强，必须借助地方官员之力。汉代郡守，名望既重，权力也大，可以专断郡政，自由用人，乃至专擅杀戮。中央既推行打压豪强之严酷路线，酷吏随之层出不穷。\n\
    \n  酷吏郅都，即是西汉中央专为打压地方豪强而派遣的第一个地方大员。《史记》称，其时济南瞯氏，宗人三百余家，豪猾，地方长官莫能制。遂遣郅都为济南太守，至则灭瞯氏首恶，余皆股栗。郅都行法不避贵戚，时人号为“苍鹰”。\n\
    \n  郅都虽酷，似尚有“法治”之理念，未见有上下其手之举，后来者则每况愈下，几乎都不顾程序正义，将法令只当作刑具的别名。严延年任河南太守，“其治务在摧折豪强”，流血数里，时人号为“屠伯”；宁成打击豪强，步法郅都，人皆畏之，所谓“宁见乳虎，无直宁成之怒”；周阳由“所居郡，必夷其豪”，执法随心所欲，“所爱者，挠法活之；所憎者，曲法诛灭之”；张汤，好揣摩帝意，所治即上所欲罪，所纵即上所欲释，“所治即豪，必舞文巧诋”；王温舒就更恐怖了，其为河内太守，捕郡中豪猾，相连坐千余家。上书请大者至灭族，小者乃死，杀戮太重，流血十余里。等到春天来了，还有犯人没杀完，而暂不能再杀(汉代执行死刑只在秋冬两季)，温舒竟捶胸顿足地说，要是冬天再长一月，我的事业就大成了！如此好杀，令人不寒而栗，汉武帝却对之甚为推许，“以为能”。\n\
    \n  酷吏之盛，酷卒也兴，黑狱风云可屡自史册窥见。《史记·周勃传》记其感叹“吾尝将百万之众，今始知狱吏之贵”；《史记·周亚夫传》记其在狱中不食五日，呕血而死。不食也许可致死，但不至于呕血死，这或是当时黑狱的一种例行死法吧？《史记·李广传》记其不愿对刀笔吏，自刎死；《汉书·司马迁传》记其“见狱吏则头抢地，视徒隶则心惕息”。可见西汉狱吏之尊，且多法外之刑；从酷吏到狱卒，都罕见遵守程序正义。\n\
    \n  严打豪强的过程中，由于程序正义之缺失，酷吏捞政治资本之心切，有时也扩大化，殃及平民。酷吏杜周为廷尉，每年要办一千多个案子，大者数百人，小者数十人；远者数千里，近者数百里。犯人如有不服，以掠笞定之。最终“诏狱逮至六七万人，吏所增加十有余万”，其中当有多少冤狱，多少枯骨！\n\
    \n  一个法治社会最基本的要求是，罪与非罪的界线和国家权力的运用都应在法律上加以明文规定，国家权力不能因为拥有暴力机器而超越自己所制定的法律规范去行动。在《史记·酷吏列传·杜周传》中，有一段对白泄露了两千余年来古代中国的法制秘密，那就是其决非法治社会。\n\
    \n  有客责备杜周说：“君为天子决平，不循三尺法，专以人主意指为狱，狱者固如是乎？”杜周回答说：“三尺安出哉？前主所是著为律，后主所是疏为令，当时为是，何古之法乎！”所谓“当时为是”，即是以当时皇权之是为是，以当时酷吏个人之是为是，所谓律令，不过是满足前二者的工具、刑具，乃至玩具。\n\
    \n  然而酷吏之下场，往往也很残酷，因为一个非法治社会，没有规则的社会，往往是吞噬所有人的社会。非法执法者怎能保证，他自己有日不被另一个非法执法者给办了？前面提到的酷吏们，“苍鹰”郅都被斩，“屠伯”严延年弃市，“乳虎”宁成亡家，张汤死于三长史手，王温舒五族俱灭。这决非世俗意义上的因果报应，但或可视作是一种恶法循环的因果报应。\n\
    \n  社会繁荣和稳定的根本在于设置一个相对公正的制度，尽可能合理地分配利益和财富。稳定的根本在于减少社会矛盾，而非无视矛盾，或靠暴力酷刑压制矛盾。依靠暴力酷刑换来的稳定，终将昙花一现。用《后汉书》批评酷吏的话说则是：“末暴虽胜，崇本或略”，酷吏们试图用暴力手段来解决社会失范，只是舍本逐末，无法长治久安。\n\
    \n  付出了相当大的社会代价与政治成本，汉武帝打豪强运动的结果却未必美好。汉武帝派往地方州郡行政机关的酷吏，扰乱了地方权力结盟的平衡，却又缺乏有效的措施来控\n"
  mdcn: "\n## 权谋应用\n\n  楚国的楚考烈王没有儿子，春申君对此十分忧虑，他遍寻众多能生育的妇女，进献给楚王，但是她们最终都没能为楚王生出儿子来。有个叫李园的赵国人带来了他的妹妹想进献给楚王，但听说楚王不能生儿子，便恐怕时间一长，自己的妹妹会失去楚王的宠爱。于是他请求侍奉春申君，做春申君的门人。没过多久，李园请假回赵国探亲，故意超过了期限才返回春申君处。春申君询问他原由，李园回答说：“齐国国君派使者来求娶我的妹妹，我陪那使者饮酒，所以就误了归期。”春申君说：“已经下过聘礼订婚了吗？”李园答道：“还没有。”于是春申君便纳李园的妹妹为妾。不久，李园的妹妹就怀孕了，李园便让她妹妹去劝说春申君道：“楚王非常宠信您，即使他的亲兄弟也比不上。现在您担任楚国的相国都有二十多年了，而楚王依旧没有儿子。照此情景，等他去世以后必将改立他的兄弟为国君，而新国君也必定要使他的旧亲信成为新贵，到那时您又如何能永保自己这种荣宠地位呢！不仅如此，因为您受楚王宠幸，长期执掌国事，肯定会对楚王的兄弟有过许多失礼之处，一旦他们登上王位，您就要面临杀身之祸。现在我怀有身孕的事情，还没有人知道，况且我受您宠爱时间还不长，假如以您的尊贵身份，把我进献给楚王，一定会受到他的恩宠。如果我托福于上天的恩赐生下一个男孩，那么将来继位为王的就是您的儿子了。得到楚国的全部，与在新君主的统治下面临难以预测的灾祸相比，哪一个结果更好呢？”春申君于是同意了，便将李园的妹妹送出府，安置在一个馆舍中住下，然后向楚王推荐她。楚王很快就召她入宫，并且对她百般宠爱。没过多久，李园的妹妹果然生下了个儿子，并被立为太子。\n\
    \n解析：李园所作所为不为人所称道，而且最终不得善终，但是他设计实现自己的目标的手段却是极其漂亮的。下面我们来看看李园如何一步步实现其夺权之旅的。\n\n\
    ### 社会调查\n\n  首先是背景调查。通过调查，李园得知当时的楚王（考烈王）没有子嗣，而且有迹象表明，楚王可能生不了孩子。事关国家大计，春申君作为楚相和楚国的王族，对此事极其热心，先后给楚王进献了很多宜男之相美女，但没有一个人孩子。此时赵国人李园携其妹一起到了楚国，李园特别宝贝他的妹妹，以为他的妹妹极其珍贵，可做王后夫人。有了上述调查结果及自身条件之后，李园便开始预谋他的夺权之旅了。\n\
    \n### 李园开始造势\n\n  能让楚王纳之。对于李园这样出身的人要想直达天听还是有困难的，似乎是比登天还难。李园是外国人，来到楚国人生地不熟，身上也没有多少钱可供他花费，即使有也不入权贵们的法眼，为权贵们出力讨巧的人也不少，根本显不出李园的本事来。于是李园想到了稳扎稳打步步为营的策略：先打入到楚王的亲人也是当时的楚相春申君那里，通过春申君来慢慢地将自己的妹妹送入王宫。\n\
    \n  这一点是可以做到的，因为春申君有好贤之名，如果自己扮成贤士进入春申君家中做个客卿，再好好拿出些本事来帮春申君做一些事情，让春申君知道他，那就成功了一半。于是也不知道他通过什么手段（贿赂门人，托关系，找门子）李园就进入了春申君家，当起了舍人，应该做得不坏，这当然是他竭力巴结的缘故。\n\
    \n### 引起领导注意的方式\n\n  当李园认为如果自己一旦离开就会让春申君觉察得到的时候，便提出回家看看，春申君同意了。\n\n  回家看看可不是一件很小的事，这是李园大棋局里很关键的一步棋，因为他要想办法把自己的妹妹引荐给春申君。然而又要不着痕迹，让春申君主动提出宠幸李嫣。好在李园在前面已经做足了功夫，把他妹妹的好处逢人便讲，夸得像是天下只有他妹妹一个好女人似的。这样还不足以让人相信，眼见为实，耳听为虚，一定要让春申君觉得李嫣确实是天下第一美人。\n\
    \n  李园这趟回家就是安排这件事的。要想让这件事成功，必须让春申君接纳自己，认为自己是诚实可靠的人，前面在春申君家的表现足以证明，现在要让春申君认为他妹妹是天下第一美人，光靠自己的一张诚实可信的嘴是不够的，毕竟萝卜青菜各有所爱，你李园哥哥看妹妹自然觉得是美若天仙，但别人呢？就未必了吧？嗯，这正是需要解决的问题，李园想方设法说动齐王派使臣来求娶李嫣。哇，这么大来头都能看上这么一个乡野丫头想来确实美若天仙了。这便是李园造势的过程。\n\
    \n  然而这件事必得让春申君知道才有下文，怎么办呢？很好办，现在我在你家做事，我玩来几天，本来是我李园的差事就会积压起来，等你春申君都知道了需要你亲自处理的时候，你自然知道我旷工了。当我来了之后，你自然就会来找我了解情况，那时候我就可以告诉你齐王建遣使求亲的事了。人都是有好奇心的，那时你还不想看看我妹妹的美貌？只要你要看，我就有信心让你喜欢上我妹妹，这点自信我还是有的。\n\
    \n### ● 春申君不懂审时度势\n\n史料：《资治通鉴·秦纪·秦纪一》\n\n楚王病，硃英谓春申君曰：“世有无望之福，亦有无望之祸。今君处无望之世，事无望之主，安可以无无望之人乎!”\
    \ 春申君曰：“何谓无望之福？”曰：“君相楚二十馀年矣，虽名相国，其实王也。王今病，旦暮薨，薨而君相幼主，因而当国，王长而反政，不即遂南面称孤，此所谓无望之福也。”“何谓无望之祸？”曰：“李园不治国而君之仇也，不为兵而养死士之日久矣。王薨，李园必先入，据权而杀君以灭口，此所谓无望之祸也。”“何谓无望之人？”曰：“君置臣郎中，王薨，李园先入，臣为君杀之，此所谓无望之人也。”\n\
    \n春申君曰：“足下置之。李园，弱人也，仆又善之。且何至此!” 硃英知言不用，惧而亡去。后十七日，楚王薨，李园果先入，伏死士于棘门之内。春申君入，死士侠刺之，投其首于棘门之外;于是使吏尽捕诛春申君之家。太子立，是为豳王。\n\
    \n翻译：\n\n楚王卧病不起。朱英对春申君说：“世上有未预料到而来的洪福，也有未预料到而来的灾祸。现在您处于生死变化不定的社会之中，为喜怒无常的君王效力，身边怎么能没有您尚未预料却忽然来到的帮手呢？”春申君说：“什么叫作‘未预料到而来的洪福’呢？”朱英答道：“您担任楚国的相国二十多年了，虽然名义上是相国，实际上却已相当于国君了。如今楚王病重，随时都会死去，一旦病故，您即可辅助幼主，从而掌握国家大权，待幼主成年后再还政给他，或者干脆就面南而坐，自称为王。这便是所谓的‘未预料到而来的洪福’了”。春申君又问：“那么什么是‘未预料到而来的灾祸’呢？”朱英说：“李园不治理国事，却是您的仇敌；不管理军务统率军队，却长期以来豢养一些勇士。如此，楚王一去世，李园必定抢先入宫廷夺权，杀您灭口。这即是所谓的‘未预料到而来的灾祸。’”春申君再问道：“这样说来，‘尚未预料却忽然来到的帮手’又是怎么回事呢？”朱英回答：“您将我安置在郎中的职位上，待楚王去世，李园抢先入宫时，我替您杀了他除掉后患。这就是所谓的‘尚未预料却忽然到来的帮手’。”春申君说：“您就不必过问这些事了。李园是个软弱无能的人，况且我又对他很好，哪至于发展到这个地步呀!”朱英明白自己的建议不会被春申君采纳了，便因担心发生变故累及自己而逃亡他乡。十七天后，楚王去世，李园果然抢先进宫，把他豢养的勇士埋伏在棘门里面。春申君一进来，勇士们即两面夹击，将他刺杀，并砍下他的头颅扔到宫门外面。接着，李园又派出官吏把春申君的家人全部捕获杀了。随后，太子毌悍继位，是为幽王。\n\
    \n解析：\n\n李园的手段固然狡猾险恶，但春申君之死，却有咎由自取的地方。考其致命错误有三。\n\n一是“不识时务”。楚王一去世，迫切追逐权力的李园，势必抢先夺权，杀掉春申君。站在李园的角度，这样做既能剪除异己实力，又能达到杀人灭口、掩盖利用妹妹争夺权力的无耻行径，此为“时务”之一。继位的新君实际上是春申君的儿子，春申君可以利用这点大做文章，揭穿李园以巩固自己的权位，并且可以先发制人除掉李园，此为“时务”之二。他的门人朱英就充分认识到了这两点。但春申君错误地估计了形势，没有清醒的洞察局势，也就意识不到即将到来的凶险。\n\
    \n二是识人不明。李园安排其妹嫁给春申君，待怀孕后再嫁楚王，将自己妹妹的幸福作为自己进身的阶梯和工具，只有利益和野心，少有血肉亲情。春申君对这样不择手段的人认识不清，对其罪恶本性估计不足，缺乏识人的犀利眼光，反而认为李园是软弱无能之人，对自己很好。\n\
    \n三是听不进不同意见。春申君的门人朱英有智慧，对形势洞若观火，对利害得失了然于心；有谋略，为春申君出谋划策，找到了解决问题的方法——先发制人，除掉李园，将权力掌握在自己手里；有勇气，愿意自己涉险入宫中除掉李园！但春申君对朱英的建议竟然充耳不闻，既不采取措施进攻，也不想办法自保。\n\
    \n游走在权力场上人，过的是刀尖舔血的生活。如果没有过人的谋略智慧，又不能识人用人，是很容易陷入绝境的。\n\n### ■ 面对新形势要有积极态度\n\n\
    #### 背景\n\n  起䒖，孙膑与庞涓一起学兵法，庞涓在魏国做将军，自己估量才能不如孙膑，便召孙膑前来魏国，又设计依法砍断孙膑的双脚，在脸上刺字，想使他终身成为废人。齐国使者来到魏国，孙膑以受刑罪人身份与他暗中相见，说动了齐国使者，偷偷地把孙膑藏在车中回到齐国。齐国大臣田忌把他奉为座上客，又推荐给齐威王。威王向他请教了兵法，于是延请他为老师。这时齐威王计划出兵援救赵国，任命孙膑为大将，孙膑以自己是个残疾之人坚决辞谢，齐威王便以田忌为大将、孙膑为军师，让他坐在帘车里，出谋划策。\n\
    \n  西方管理学讲鲶鱼效应，就是有新因素介入的话，原本的平衡局面会被冲击。我们看，田忌面对孙膑这条鲶鱼的反应：\n\n  其一，找人才。什么是人才，管用的是人才，当时齐国惦记魏国，想干掉魏国，恰巧有个知道魏国底细的人，恰巧又在那跟魏国权臣庞涓不对付，恰巧又和魏国国防部长庞涓有私仇，恰巧又是个有师承的高材生，恰巧又有了一定的政治经验，哪找去？所以派出齐使，去挖孙膑，你想啊，堂堂齐国外交官怎么会专门跑一趟牛棚呢？背后早有预谋罢了。\n\
    \n  其二，挖人才。国际较量，情报先行。鬼谷子两个徒弟出名，政治能量肯定是有的，现在这俩人闹得不愉快，把那个弱的挖过来，一是有孙膑想脱身的心理性基础，这事儿能成；二是有庞涓的步步紧逼，庞涓替田忌“先打”，田忌“后拉”，必然得到一忠诚人才。\n\
    \n  其三，鉴人才。彻夜交谈，实是探听虚实。鬼谷子神乎其神，他的关门弟子孙膑是个智库人物，彻夜长谈，运用各种提问技巧在疲劳状态下突然发问，得到对方真实想法，排出苦肉计、用间计的可能。\n\
    \n  其四，交人才。人才是好的，但也得听话，不听话白搭还危险。他对孙膑有救命之恩，百般尊重，凭良心任何人都不可能不依了他。再说，身为国务官的高级别，肯定有政敌，这也是施恩结党抗敌，一石三鸟。\n\
    \n  其五，挰人才。瞅准了，自己人，那么就壮大他，夸大其词，推荐给国王，给他战争机会去立功，只要站住脚，田忌就足以对他的的政敌造成攻势。\n\n## 揭露职场权谋家残忍造势\n\
    \n  高层领导昏庸或奸邪，高俅这种职场流氓就会吃香。高层领导昏庸，善恶不分、人鬼不辨，高俅们甜言蜜语，必然吃香。高层领导奸邪，和高俅同类相聚，有很多共同语言，高俼也会吃香。高俼这种职场流氓很会整人。整人的方法有很多种，下面简单说几种，我们称之为残忍造势。\n\
    \n  - 一、以帮助人的名义整人。\n    高棣能整林冲这种人，也能整孔明这种人。高棣会安排孔明做搬运工，每天给大货车卸水泥。不识字、手脚粗的农民每次扛两袋水泥，孔明每次只能扛一袋水泥。高棣手下的小奴才就教训孔明了：“想要事业成功一定要有强健的体魄。你工作能力这么差，领导想提拔你也没办法。”有时候，高棣昏庸的上级领导确实也想帮助人。但帮助人的事情由高棣去安排就变成了整人。高棣昏庸的上级领导读不懂“澹泊明志，宁静致远”，注定与孔明无法沟通。\n\
    \n  - 二、通过他最亲近、最信任、交往最多的人来整他。\n    职场流氓可以通过一个人的父母、子女、妻子、亲属、老师、同学、上级、同事、老板、客户等人来给他做思想工作，让他听话。在中国任何一个地方，你跟任何一个人交往，职场的流氓都有可能通过那个人给你做思想工作。职场流氓不止一个，职场流氓有身份、有地位、有异常庞大的势力。很多人出于各种考虑会顺从他们、屈服他们，不敢得罪他们。\n\
    \n  - 三、用没文化的人整人。\n    没文化的人被洗脑后，会像吸了毒品一样飘飘然，以为自己掌握了宇宙真理，以为自己特别聪明。他们会很兴奋地不断重复职场流氓输入他们大脑的文字，给人做思想工作，以改变别人的意志。有良知、有思想的人面对这些行尸走肉时，是无法与他们讲道理的。\n\
    \n  - 四、孤立他。\n    职场流氓有办法孤立一个人。例如，有思想的人批评应试教育。职场流氓在其他人面前就说：“某某人说读书没用。”这样，那些有文凭的人就会痛恨他、厌恶他。或者，职场流氓干脆在其他人面前说某某人反对党，这样所有人都不敢帮助他，而是疏远他。一些中小城市的市民，基本上都是没文化的农民，思维能力低，分辨能力低，这些人很容易被有后台的职场流氓挑拨。尤其在广东一些地方。孤立一个人，丑化一个人，瓦解一个人的人际关系，使他处于最弱小的状态。这样，职场流氓就可以象踩死一只蚂蚁一样粉碎他。\n\
    \n  - 五、利用道德文化整他。\n    一个人不管信仰什么宗教。职场流氓都能找到相应的人来对付他。这个人信仰基督教，职场流氓就通过道友和牧师来给他做思想工作。这个人信仰儒教，职场流氓就通过讲孝道的人来给他做思想工作。这个人信仰道教，职场流氓就通过道长来给他做思想工作。这个人信仰佛教，职场流氓就通过他的师父来给他做思想工作，通过有名气的佛教人士来给他做思想工作。名人未必是高人。随着权力指挥棒而起舞、而唱歌的宗教人士不能说没有吧？\n\
    \n  - 六、综合各种方法整他。\n    职场流氓不需要与被整的人直接打交道。就算一个人被整了，这个人还不知道是谁在整他。能报复谁呢？有时候，与被整的人直接打交道的那些人也被蒙在鼓里，以为自己在帮助人。\n\
    \n### ● 权谋家稳定形势手段\n\n  西汉袭秦严法，大体较春秋战国而重。然严法之下，社会并不和谐。\n\n  其时地方豪强，或由宗室演化，或由地主升级，或由巨商转成，或由游侠登堂，飞扬跋扈，横行乡里，乃至与郡守结盟，成为与官方政权平行的一种势力。汉景帝时对此即有少数举措，至汉武帝时始对地方豪强进行全面打击。\n\
    \n  汉武帝时期之打豪强，首先是政治目的，又分为中央朝廷维护统治之政治目的与地方官员维护个人地位之政治目的；其次是经济目的，主要是中央政权与地方豪强在经济领域的二元对立，打压豪强的手段常表现为“国进民退”；最后才是微不足道的民生目的，整顿社会秩序，减少豪强兼并，从而改善黎民生活。\n\
    \n  考汉武帝时期打压豪强之手段，主要有四：\n\n  - 一是利用酷吏诛灭豪强。\n  - 二是将部分地方豪强迁至长安，以“内实京师，外销奸滑”；\n\
    \  - 三是为弥补因大伐匈奴等造成的财政空虚，垄断盐铁业，排斥富贾大贾，又出告缗令，鼓励民间对富豪大贾告密，后者罚没家产由政府与举报者对分；\n  - 四是设置州刺史，推行“六条问事”之监察制度，第一条即是打击豪强。\n\
    \n  要打压豪强，必须借助地方官员之力。汉代郡守，名望既重，权力也大，可以专断郡政，自由用人，乃至专擅杀戮。中央既推行打压豪强之严酷路线，酷吏随之层出不穷。\n\
    \n  酷吏郅都，即是西汉中央专为打压地方豪强而派遣的第一个地方大员。《史记》称，其时济南瞯氏，宗人三百余家，豪猾，地方长官莫能制。遂遣郅都为济南太守，至则灭瞯氏首恶，余皆股栗。郅都行法不避贵戚，时人号为“苍鹰”。\n\
    \n  郅都虽酷，似尚有“法治”之理念，未见有上下其手之举，后来者则每况愈下，几乎都不顾程序正义，将法令只当作刑具的别名。严延年任河南太守，“其治务在摧折豪强”，流血数里，时人号为“屠伯”；宁成打击豪强，步法郅都，人皆畏之，所谓“宁见乳虎，无直宁成之怒”；周阳由“所居郡，必夷其豪”，执法随心所欲，“所爱者，挠法活之；所憎者，曲法诛灭之”；张汤，好揣摩帝意，所治即上所欲罪，所纵即上所欲释，“所治即豪，必舞文巧诋”；王温舒就更恐怖了，其为河内太守，捕郡中豪猾，相连坐千余家。上书请大者至灭族，小者乃死，杀戮太重，流血十余里。等到春天来了，还有犯人没杀完，而暂不能再杀(汉代执行死刑只在秋冬两季)，温舒竟捶胸顿足地说，要是冬天再长一月，我的事业就大成了！如此好杀，令人不寒而栗，汉武帝却对之甚为推许，“以为能”。\n\
    \n  酷吏之盛，酷卒也兴，黑狱风云可屡自史册窥见。《史记·周勃传》记其感叹“吾尝将百万之众，今始知狱吏之贵”；《史记·周亚夫传》记其在狱中不食五日，呕血而死。不食也许可致死，但不至于呕血死，这或是当时黑狱的一种例行死法吧？《史记·李广传》记其不愿对刀笔吏，自刎死；《汉书·司马迁传》记其“见狱吏则头抢地，视徒隶则心惕息”。可见西汉狱吏之尊，且多法外之刑；从酷吏到狱卒，都罕见遵守程序正义。\n\
    \n  严打豪强的过程中，由于程序正义之缺失，酷吏捞政治资本之心切，有时也扩大化，殃及平民。酷吏杜周为廷尉，每年要办一千多个案子，大者数百人，小者数十人；远者数千里，近者数百里。犯人如有不服，以掠笞定之。最终“诏狱逮至六七万人，吏所增加十有余万”，其中当有多少冤狱，多少枯骨！\n\
    \n  一个法治社会最基本的要求是，罪与非罪的界线和国家权力的运用都应在法律上加以明文规定，国家权力不能因为拥有暴力机器而超越自己所制定的法律规范去行动。在《史记·酷吏列传·杜周传》中，有一段对白泄露了两千余年来古代中国的法制秘密，那就是其决非法治社会。\n\
    \n  有客责备杜周说：“君为天子决平，不循三尺法，专以人主意指为狱，狱者固如是乎？”杜周回答说：“三尺安出哉？前主所是著为律，后主所是疏为令，当时为是，何古之法乎！”所谓“当时为是”，即是以当时皇权之是为是，以当时酷吏个人之是为是，所谓律令，不过是满足前二者的工具、刑具，乃至玩具。\n\
    \n  然而酷吏之下场，往往也很残酷，因为一个非法治社会，没有规则的社会，往往是吞噬所有人的社会。非法执法者怎能保证，他自己有日不被另一个非法执法者给办了？前面提到的酷吏们，“苍鹰”郅都被斩，“屠伯”严延年弃市，“乳虎”宁成亡家，张汤死于三长史手，王温舒五族俱灭。这决非世俗意义上的因果报应，但或可视作是一种恶法循环的因果报应。\n\
    \n  社会繁荣和稳定的根本在于设置一个相对公正的制度，尽可能合理地分配利益和财富。稳定的根本在于减少社会矛盾，而非无视矛盾，或靠暴力酷刑压制矛盾。依靠暴力酷刑换来的稳定，终将昙花一现。用《后汉书》批评酷吏的话说则是：“末暴虽胜，崇本或略”，酷吏们试图用暴力手段来解决社会失范，只是舍本逐末，无法长治久安。\n\
    \n  付出了相当大的社会代价与政治成本，汉武帝打豪强运动的结果却未必美好。汉武帝派往地方州郡行政机关的酷吏，扰乱了地方权力结盟的平衡，却又缺乏有效的措施来控\n"
