    之严酷路线，酷吏随之层出不穷。'
  - '[PAGE 126]


    酷吏郅都，即是西汉中央专为打压地方豪强而派遣的第一个地方大员。《史记》称，其时济南瞯氏，宗人三百余家，豪猾，地方长官莫能制。遂遣郅都为济南太守，至则灭瞯氏首恶，余皆股栗。郅都行法不避贵戚，时人号为“苍鹰”。


    郅都虽酷，似尚有“法治”之理念，未见有上下其手之举，后来者则每况愈下，几乎都不顾程序正义，将法令只当作刑具的别名。严延年任'
  - '[PAGE 127]


    河南太守,“其治务在摧折豪强”,流血数里,时人号为“屠伯”;宁成打击豪强,步法郅都,人皆畏之,所谓“宁见乳虎,无直宁成之怒”;周阳由“所居郡,必夷其豪”,执法随心所欲,“所爱者,挠法活之;所憎者,曲法诛灭之”;张汤,好揣摩帝意,所治即上所欲罪,所纵即上所欲释,“所治即豪,必舞文巧诋”;王温舒就更恐怖了,其为河内太守,捕郡中豪猾,相连坐千余家。上书请大者至灭族,小者乃死,杀戮太重,流血十余里。等到'
  - '[PAGE 128]


    # 权谋应用


    春天来了，还有犯人没杀完，而暂不能再杀(汉代执行死刑只在秋冬两季)，温舒竟捶胸顿足地说，要是冬天再长一月，我的事业就大成了！如此好杀，令人不寒而栗，汉武帝却对之甚为推许，“以为能”。


    酷吏之盛，酷卒也兴，黑狱风云可屡自史册窥见。《史记·周勃传》记其感叹“吾尝将百万之众，今始知狱吏之贵”；《史记·周亚夫传》记其在狱中不食五日，呕血而死。不食也许可致死，但不至于呕血死，'
  - '[PAGE 129]


    这或是当时黑狱的一种例行死法吧？《史记·李广传》记其不愿对刀笔吏，自刎死；《汉书·司马迁传》记其“见狱吏则头抢地，视徒隶则心惕息”。可见西汉狱吏之尊，且多法外之刑；从酷吏到狱卒，都罕见遵守程序正义。


    严打豪强的过程中，由于程序正义之缺失，酷吏捞政治资本之心切，有时也扩大化，殃及平民。酷吏杜周为廷尉，每年要办一千多个案子，大者数百人，小者数十人；远者数'
  - '[PAGE 130]


    千里，近者数百里。犯人如有不服，以掠笞定之。最终“诏狱逮至六七万人，吏所增加十有余万”，其中当有多少冤狱，多少枯骨！


    一个法治社会最基本的要求是，罪与非罪的界线和国家权力的运用都应在法律上加以明文规定，国家权力不能因为拥有暴力机器而超越自己所制定的法律规范去行动。在《史记·酷吏列传·杜周传》中，有一段对白泄露了两千余年来古代中国的法制秘密，那就是其决非法治社会。'
  - '[PAGE 131]


    有客责备杜周说：“君为天子决平，不循三尺法，专以人主意指为狱，狱者固如是乎？”杜周回答说：“三尺安出哉？前主所是著为律，后主所是疏为令，当时为是，何古之法乎！”所谓“当时为是”，即是以当时皇权之是为是，以当时酷吏个人之是为是，所谓律令，不过是满足前二者的工具、刑具，乃至玩具。


    然而酷吏之下场，往往也很残酷，因为一个非法治社会，没有规则的'
