    ### 什么样的人能成功


    成功学是剑术，但成功是“杀人术”。大凡成就大业而善始善终者，必须具备下面两项条件：


    **第一条 志向野心**


    每个人的意志都是受利益驱使的，最原始的利益就是食色二字。一个人可能在某个阶段受到极大的打击。生活潦倒，精神萎靡，食欲不振，甚至连对女人都缺乏性趣。但这不是正常的状态，一个人的正常的状态，永远都是不满足的，只要后面没有生存的威胁，他永远都想主动地获取更大的刺激。


    有人喜欢权势，有人喜欢金钱，有人喜欢美女，有人喜欢精神满足。生而为人，必受驱使。这就是权谋学立身的基本。


    **第二条 敢舍**


    敢舍，就是在明确自己的野心和谋划方案后，敢于毫不犹豫地舍弃机会成本和成为阻碍的任何资源。我决定要熊掌，我就敢把鱼扔在地上，踏上几脚。我要利，我就敢把名声、面子抛在脑后。反之亦然。


    同样是取天下，曹操舍名以势取天下，而刘备则舍利以名正天下。同样的目的，不一样的手段，舍弃的东西不一样，却殊途同归，舍弃从来都是手段。


    ## 解密做局的窍门


    一，攻心。做局一定要抓住对方的心理特点，甚至是弱点，针对对方的弱点，设计相应的策略！具体方法是厉害关系，以目前或者将来的状况进行分析，夸大造成的危害，逼迫他反思，并且给予他一条成功的途径，如果这么做的话，你会得到什么样的利益或者好处！必须是他看的见莫得着的！在秦始皇死后，赵高问李斯一个问题，你拥立扶苏，只是奉召，没有任何功劳，另外一个，扶苏继位，你和蒙恬谁更能得到公子扶苏的信任，如果我们拥立胡亥，天下其实就在我们的手中！简简单单的几句话，很能抓住李斯当时的心情。


    二，伪装。兵者，诡道也。想玩计谋，就不能胡同里赶猪——直来直去，必须掩盖真实的意图，不见兔子不撒鹰。伪装有很多种，利益的伪装、名声的伪装、陷阱的伪装等，在伪装的过程当中，九真一假，让别人难以分辨！在清朝末年，袁世凯看见革命党很吃香，就和革命见面就论变得，深得谭嗣同的信任，背地里却告密出卖！王莽窜汉，也是进行伪装的，他的儿子王获杀死了家奴，王莽逼子自杀偿命，王莽此举得到人们的好感。多人上书为他反平。在公元前
    2 年，王莽获允回京居住，来年哀帝死，太皇太后王政君收了玉玺，召王莽复为大司马，领尚书事，兼管军事令及禁军。


    三、保密。君不密失其臣，臣不密失其身，凡事不密则成害。这几句话，可见保密的重要性，一个局做前不能说，要不这个局就容易被别人破局，你就白忙活了，做完后也不能说，因为别人知道是你做的，会害怕你，要不就是密谋报复你，在中国历史上泄密的事情不少，在《三国演义》中，汉献帝的血诏本来是有机会公告于天下，揭露曹操的狼子野心，号令天下除汉贼，兴汉室的，但是董承家的下人的告密，结果事情败露，失去了宝贵的翻盘机会，造成董承满门抄斩，由此可见保密的重要性，可以说秘密关系到个人和国家的生死存亡，所以当…你想逞一时口快之时，请务必慎之又慎。


    ## 用这四招打败你的上司。


    原文：


    秦王使人行万金于魏以间信陵君，求得晋鄙客，令说魏王曰：“公子亡在外十年矣，今复为将，诸侯皆属，天下徒闻信陵君而不闻魏王矣。”秦王又使人数贺信陵君：“得为魏王未也？”魏王日闻其毁，不能不信，乃使人代信陵君将兵。信陵君自知再以毁废，乃谢病不朝，日夜以酒色自娱，凡四岁而卒。《资治通鉴》


    翻译：


    范雎对秦王说：“在秦国听见有太后、有穰侯，不听见有秦王。”于是，太后、穰侯很快就倒霉。秦王派宣传间谍到魏国，魏王又听到：“天下只知道有信陵君，不听说有魏王您呐！”于是，明明看到大厦将倾，且只有信陵君这根柱子还勉强可以支撑，那也毫不犹豫地过去用利斧砍断。


    解析：


    事实上不论什么时代，身居高位的人永远就像是古代君主，他们都希望自己的地位安全稳定，自己比周围的人更有智慧，更加英明，更富有魅力。有的人以为展现和夸耀自己的才华和天赋能够赢得上司的喜爱，这是普遍而又致命的谬论。你的上司可能会假装欣赏你，但是一有机会就会用不那么聪明、不那么有魅力、也不太具有威胁性的人把你换掉，你的上司不会说出和承认真相，但总会找到借口把你搞掉，让你在他眼前消失。


    职场启示：


    永远让你的上司感到比你优越。在取悦他们或给他们留下深刻印象的同时，不要过分显露你的才华，否则会适得其反——引发他的恐惧和不安。始终让你的上司显得英明聪慧，你就可以达到权力的巅峰，做到以下四条保你安全。


    - **人前吹捧**

    知道了盖过上司光芒的危险性，你就应该转化运用这条法则，让它对你更有用。首先你必须奉承你的上司，让他飘飘然踌躇满志。公开的奉承吹捧可能会有效果，但也有局限性，因为太直接明显，容易引起其他人的反感。不露痕迹的奉承的效果和威力要大得多。例如如果你比上司聪明，就要表现得相反，让他显得比你聪明干练。


    - **请求援助**

    你可以故作天真，表现出你十分需要他的指导和意见。有时可以故意犯些无关痛痒的错误，让你有机会向他求助。上司们会非常喜欢这样的请求。如果身为上司不能利用你来体现他的才能和经验，他就可能反过来，对你产生怨恨和憎恶。


    - **把功劳给上司**

    如果你的想法比上司的想法更有创意，就把它们归到上司的头上，你要尽量表现得非常公开，让大家都清楚，你的意见不过是对他想法的附和。如果你的才智胜过你的上司，那就不妨扮演宫廷小丑的角色，但不可让他与你相比显得呆板冷漠，必要的话要降低你的幽默感，要想方设法让上司成为鼓舞士气、带来幽默欢乐的主角。


    - **找好时机**

    如果你的上司地位很稳固，虽然你很清楚自己更有才干，也要耐心地等待机会。权力终究会衰退和削弱的，这是自然规律。你的上司总有一天会下台，只要你处事得体，不出差错，你就能经得住考验，终有一天会凌驾于他之上。要仔细评估他的力量。如果他力量变弱了，那就不动声色地采取措施加速他的衰败，在关键时刻超过他，表现得比他更有魅力和智慧。


    如果他气数已尽，即将衰落，那就顺其自然。不要去冒凌驾已经摇摇欲坠的上司的危险——那样会使你看起来显得冷酷无情，心肠狠毒。


    ## 怎样博得好名声


    曾国藩讲“全靠名声好，方扯得活”。职场名利场上，名声就是资本、名声就是分量、名声就是权力、名声就是金钱。如何享有盛名，不能守株待兔，要充分发挥自己的主观能动性。


    - **一是要拿得出真本事**

    真本事就是娴熟的业务技能、看家本领、立身之道。真本事是银行准备金，是真金白银，那是你讨价还价的筹码，比如有人想干掉你，组织离不开你、大家看不过去都为你说话。说话，这样小人只能是自食其果，或者说聪明的小人就不会这样搬起石头砸自己的脚。人家服你的业务，你说话就算数，不过这只是好名声的硬件标配。


    - **二是要哄好你的领导**

    领导说你行你就行，他是个权力印章，你想上升必须经他审批，必须挖空心思讨好领导，让他对你产生“舒适感”、进而产生“依赖感”，他才能成为你的“橡皮图章”。古代的弄臣都是这方面的高手，他们对于主子就像盛开的罂粟花。领导为你张目，你做的事上边总是认可，你过得不但舒服，而且名声怎么会不好呢？


    - **三是要围住你的同事**

    同事是一个泛化概念，即你圈子内的人，他们每个人共同支撑起这个叫作舆论的东西，记住，在投票权下，每个人都是你的领导，每个人都要照顾到，最不明智的就是与任何人起任何争执，你得罪一个，就是得罪了他的一圈子，你有几个圈子的面积禁得住这样糟践？好名声要从时刻点滴争取。君子自强不息，重点就是不息。


    - **四是要强化投资意识**

    许多人算计收获很起劲，比如工资比如好处，但从不考虑投资，这绝对是失败者的逻辑。好比种花，一定是天天侍弄精心照顾，“如鸡孵卵”，唯有如此，才能成功，严嵩一个月不洗澡只值班，总结了一下***、***等人年轻时几乎都被评价为勤奋、踏实、很尊重人，这是巧合吗？老子曰“将欲取之，必固与之”，参不透这点，永远卑贱。投资意识，这是你博取好名声的逻辑起点。


    真正的权谋就是把朋友搞得多多的，敌人搞得少少的，这就是你为什么要学会操控舆论，为自己争得一个好名声，争得成功。


    ## 权谋的内涵


    伟大的政治家必是伟大的权谋家

    伟大的军事家必是伟大的权谋家

    伟大的外交家必是伟大的权谋家

    伟大的企业家必是伟大的权谋家

    权谋不是吸人骨髓的恶魔

    而是帮助人们走出困境，开启成功的钥匙


    ### 1.什么是权?


    权，原义指秤锤，用来衡量一件物品重量时，需来回滑动，得到一个准确的重量，后引申为权变、权宜，开始有计谋的含义。


    在古代，思想家经常将“权”和“经”视为一对范畴，用来说明人们的社会行为。“神即道，道法自然，如来。”这里所谓的“道”是指一般的规律、一般的行为准则，而“权”是这一准则的灵活运用。孟子说：“男女授受不亲，礼也；嫂溺则援之以手，权也。”这里说的“礼”和“权”就是一般行为规则及其灵活运用。总的说，“经”就是天经地义的道理，“权”就是随机应变的手段。


    ### 2.什么是谋?


    谋，《说文》解释说: “虑难曰谋。”

    意谓考虑事情的难处, 找出应对的方法, 就是 “谋” 。“谋”字初形从母,《说文解字约注》说: “所以从母者, 人世一切谋虑, 始于母之为赤子谋也。赤子初生,
    不能言语, 赖母推心为之。时其饥寒而衣食之, 候其疾痛而调卫之, 以善以育, 所以为之谋虑者, 至周至密。”《尚书.洪范》说: “明作哲, 聪作谋。”


    这些都具有计谋、筹划的意思。所以，“谋”就是针对具体的问题，为了达到一定的目的，经过周密的思考而得出的行为方法。


    ### 3. 什么是权谋？


    权与谋，合起来讲，就是随机应变的计谋。荀子说：“上好权谋，则臣下百吏诞诈之人乘而后欺”，“故用国者，义立而王，信立而霸，权谋而亡。”刘向说：“孟子、孙卿儒术之士弃捐于世，而游说权谋之徒贵于俗。”正是就这种概念而言的。这说明权谋不是一种谋略，而是谋略的一部分，它具有随机应变的特性。谋略较权谋的内容要广泛得多，谋为权宣之计，略为长远之策。


    ### 4.权谋的构成


    权谋的构成，一般包含四种因素：权谋主体、权谋客体、权谋场和权谋本体。权谋主体，主要指发明和运用权谋的一方，包含谋士、策士和智囊；权谋客体，指被权谋所指向或支配的一方，是权谋主体的认识和实践的对象；权谋场指时间、地点和具体情况等权谋所依托的各种客观条件；权谋本体指人们处于特定权谋场内的应对能力和方法。


    ### 5.权谋认识的误区


    儒家，孔子对权谋的认识和理解持公允态度；荀子尽管兼容儒法，但本质上站在反权谋的立场上；孟子也是把权谋放在“信”、“义”的对立面，彻底否定。《老子》具有明显的反权谋倾向，但在老子本人那里，却包含着较多的权谋成分，如“将欲歙之，必固张之；将欲弱之，必固强之；将欲废之，必固兴之；将欲取之，必固与之，是谓微明。”意思是说，想要收敛，必须暂且扩张；想要削弱，必须暂且加强；想要废弃，必须暂且兴旺；想要夺取，必须暂且给予，这就是深沉的预谋。


    唯权谋论的谬误，在于没有弄清权谋的功能；泛权谋论的过错，在于没有弄清权谋的内涵；反权谋论的症结，在于没有弄清权谋的本质。


    你如何用三言两语就征服竞争对手，让其俯首帖耳？


    能说服别人，让别人跟着自己的思路走，这是一个领导者的看家本领。而将这种本领发挥到极致是一种什么样的状态呢？其实就是《孙子兵法》所讲的“上兵伐谋”，即说服你的竞争对手停止和你作对的行为。那么怎么操作才能够使这样看似“理想化”的目标得以实现呢？我们从下面案例的分析之中，就会得到颇多启示：


    **【案例材料】** 陶侃与杜弼相攻，弼使王贡出挑战，侃遥谓之曰：“杜弼为益州小吏，盗用库钱，父死不奔丧。卿本佳人，何为随之！天下宁有白头贼邪？”贡初横脚马上，闻侃言，敛容下脚。侃知可动，复遣使谕之，截发为信，贡遂降于侃。弼众溃，遁走，道死。


    **【案例分析】** 面对敌方阵营的挑战，谋略家陶侃并没有意气用事，草率迎战，而只是简单地通过三言两语进行回应。然而这“三言两语”的威力却极其巨大，不但保全自己毫发未损，还让对手阵营覆军杀将，一蹶不振。陶侃这位谋略家的言语为什么有这么神奇的力量呢？我们认为他主要抓住了这些谋略要点：


    一、以“釜底抽薪”之计动摇了对手的信心斗志，使其畏首畏尾。鬼谷子讲：“心散则志衰，志衰则思不达。”陶侃不与王贡直接硬拼，而是站在遥远的地方，大声揭露其上上级领导杜弼的黑历史。且不论其“爆料”的内容是否真实，这一策略都可以让所有人的注意力集中于对方主要领导者的身上，使其本人百口莫辩，在众多个下属面前异常难堪。


    二、以“庖丁解牛”之技将对手阵营中的各种角色相互剥离，激化内部矛盾。陶侃这一句“卿本佳人，何为随之”，是对鬼谷子“抵巘之术”的灵活应用。他抓住了打工者与雇主之间利害冲突的不同，找到了人与人之间关系的缝隙进行切割，毫不费力地就将对方的组织“碎片化”，将其成员“原子化”。


    三、以“远景分析”之策增加对手顾虑，促使临阵倒戈，回头是岸。“天下宁有白头贼邪？”陶侃这一句反问，自戳王贡的心窝，让对方立即感觉到自己当前说走的路走不通，必须改弦更张，另辟蹊径。


    总而言之，一个高明的谋略家想要说服别人，听从自己，无非这么一个套路：首先，让对方意识到某种问题的存在；其次，让对方看到这个问题可能造成的严重后果；最后，不露痕迹地提供某种物廉价美的解决方案！


    ## 权谋家架空领导的原理


    任何功能实体都可以被利用，领导作为一个功能实体，同样可以被利用。常在职场的人都懂得架空领导之术，从中获得权利与利益。而架空领导的远离主要离不开以下三个方面。


    ### 1 介入


    介入其能量团内部，从任何可能的角度。介入生活，为领导考虑周到做私活。介入工作，通过忠诚殷勤获取信任。介入爱好，满足其癖好嗜好。介入的越多得到的就越多。


    ### 2 替代


    获取了信任和亲近，你就可以为他提供多种多样的信息，包括同事的事，八卦八卦。渐渐成为一个信息渠道。从此以后谁对谁错都你说的算。


    ### 3 依赖


    最终目的是，营造依赖感。你处处给他舒适，就像罂粟，给他精神快感的同时，瘾就产生了。这时，你可以扭曲意旨，让领导成为你的工具。为自己服务。这个跟喂狗一个道理，一条狗你喂它三次它就不咬你，你喂它一年你把它送人它还会找到家，记住一点你的抚摸和服务都是把领导当狗养，让其为你看守财富大门。


    ## 权谋家是擅长口辩与攻心


    口辩与攻心密不可分，不善口辩的说理虽正确难于折服人，巧于口辩加上其说有理有据就易见奇效。人的认识决定其思想，思想决定其行动，所以要想纠正或制止人们的错误行动，以攻心为上。威胁或能吓人一时，用武力或可使人畏服，但不可能使人心服，人心不服问题就解决不了，当触动众怒激起众志成城时，威胁、武力将不起作用，反而自食其果。攻心才能使人心服，战国时期纵横家们以其妙语巧喻，使人心悦诚服，听其言服其人，他们因之在政治舞台上十分活跃，甚至成为主宰的力量，干出了人们不能干的出乎人意外之事。纵横学不仅在战国，一直至唐初仍很有影响。而当今世界从事游说的也不乏其人，尤其是公共关系日益受人重视，口辩攻心更显得重要。本章各节，即：一、利说，二、讽谏，三、妙谕，四、微言，五、巧劝，六、智激，正是总结和探讨古代游说之士的口辩攻心，以及他们的语言技巧，希能给今之从事类似以口辩攻心为业的人一点启发。


    ### 一、利说


    凡人做出任何决定，采取什么行动，都要衡量其利害，利则趋之，害则避之。但人的认识有所局限，认为利的未必有利，害的未必有害。所以，古代游说之士正是抓住人们认识上的分歧，向被说者陈说利害，指点迷津，使之趋利避害，加上其说辞有理有据，且妙语巧寓动人，说服力很强，被说者不得不折服。


    说以利害，可以说是说人的一个基本法则。


    ### 二、讽谏


    讽谏，是不直言其事，用一种委婉曲折的语言进行讽谏。它与讽刺有别，讽刺是用含蓄的语言讥刺人，因其带“刺”，往往伤人，易于引起被讽刺者的恼怒。讽刺的语言常用于反对的事和人。而讽谏则不同，常用于对上的劝喻，由于讽谏者谈笑风生、巧妙的暗示，既不刺痛对

