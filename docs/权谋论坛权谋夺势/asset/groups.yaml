    楚考烈王无子,春申君患之,求妇人宜子者甚众,进之,卒无子。赵人李园持其妹欲进诸楚王,闻其不宜子,恐久无宠,乃求为春申君舍人。已而谒归,故失期而还。春申君问之,李园曰:"齐王使人求臣之妹,与其使者饮,故失期。"春申君曰:"聘人乎?"曰:"未也。"春申君遂纳之。既有有娠,李园使其妹说春申君曰:"楚王贵幸君,虽兄弟不如也。今君相楚二十余年而王无子,即百岁后将更立兄弟,彼亦各贵其故所亲,君又安得常保此宠乎!非徒然也,君贵,用事久,多失礼于王之兄弟,兄弟立,祸且及身矣。今妾有娠而人莫知,妾幸君未久,诚以君之重,进妾于王,王必幸之。妾赖天而有男,则是君之子为王也。楚国尽可得,孰与身临不测之祸哉!”春申君大然之。乃出李园妹,谨舍而言诸楚王。王召入,幸之,遂生男,立为太子。


