    ## 权谋应用


    断。


    北宋大臣文彦博处理危机的方法，与令狐楚的计谋也有异曲同工之妙。当时有位臣僚请求废除陕西铁钱。朝廷虽然没有接受，消息却不胫而走。


    平民百姓以为朝廷迟早会这么做，便争先恐后地拿出铁钱去买东西，以免到时候铁钱作废。消费者希望抛出铁钱，而销售者不愿收铁钱。这样，彼此相持不下，长安城因此而发生骚乱，商人们纷纷关店歇业，市场陷入一片混乱，许多人对此束手无策。这时，文彦博出来说话了。


    针对许多人提出的禁止关闭店门的主张，他提出反对：禁止只会使人们更加疑惑，从而引起更大的骚动，唯一的办法是让官府出面做买卖，只收铁钱不收铜钱。于是他命人召来丝绸行业的商人，让他们卖丝绸时说：“凡买丝绸者一定要用铁钱，铜钱不收。”这样一来，人们知道铁钱不会作废，市场便又恢复了稳定。


    ## 权谋应用


    从上面的两个故事可以看出，所谓造势，就是制造声势，影响舆论，烘托气氛，为自己的行为寻找合理性的依据和利益点。千万不要小瞧了群众的嘴巴和眼球，它们一旦活动起来，就会像风一样不胫而走，影响人的心理，进而影响人的行为和决策。在现代商业的营销活动中，有一种营销方式叫做“事件营销”，就是通过造势来运作的。


    所谓事件营销，指的是企业通过主动策划或利用某些具有重大新闻价值或社会影响力的热点事件，以吸引公众注意力，提高企业形象和知名度，提高产品吸引力，并最终达到吸引消费者购买的营销方法。


    事件营销的重点是借式和造式，有“事”则借，无“事”则造。本来没有事，自己造些事出来，事出而势成，于是借势而为，达到了四两拨千斤的效果。大多靠的则是借势，事件本来就存在，他们所要做的，以一种合适的方法依附于其上，借着这些重大事件或热点事件万众瞩目的机会，将本来不为人们所注意的企业或产品显露于公众之前，吸引众人的眼球。说到底，事件营销玩的还是一种注意力经济。


    对于企业来说，事件营销的好处在于：


    - 第一，节约成本，获取超值回报。因为借助全社会所关注的重大事件或热点事件进行营销，新闻媒体往往不请自来，为企业节约了大量的广告费和宣传费。

    - 第二，效果立竿见影。事件营销最大的好处是，上午媒体做报道，下午顾客就会有反应，速度非常之快，很多企业借助事件营销一夜成名。

    - 第三，企业不但可以推产品，还可以树品牌，一箭双雕。

    - 第四，操作简便，可以一个人操作，也可以一群人操作。


    ## 造势者都是先传达信念


    ### 陈胜、吴广


    一、借扶苏、项燕的名义。在起义之前，为起义找一个名头，陈胜说道：“天下苦秦久矣”。认为现在天下人对于秦国的暴政已经忍耐很久了，快要忍耐不下去了，现在起义一定能够得到天下人的支持。陈胜又说道：“（扶苏）百姓多闻其贤，未知死也；…项燕为将…..楚人怜之，或以为死，或以为亡；今诚以吾众诈自称公子扶苏、项燕，为天下唱，宜多应者。”扶苏和项燕两个人都是很贤明的，这两个人都有很好的声望，天下的百姓对这两个人都很认同，并且天下人不知道这两人是生是死，如果我们假称是扶苏和项燕的队伍，肯定能够得到天下人的响应。陈胜、吴广起义首先借扶苏、项燕的名义，给自己的起义树立名声，吸引天下人追随。


    二、问事鬼神。陈胜、吴广在决定使用扶苏和项燕的名义起兵之后，便想要向鬼神询问这件事的吉凶。卜算的人知道这两人的意思，于是就说：“足下事皆成，有功。然足下卜之鬼乎！”你们两个的事情一定能成功，但是你问过鬼神了吗？陈胜听到后喜，认为这是让他们用鬼神来威服戍卒（此教我先威众耳），于是陈胜：乃丹书帛曰陈胜王，置人所罾鱼腹中，……又间令吴广之次所旁丛祠中，夜篝火，狐鸣呼曰：“大楚兴，陈胜王！”让戍卒认为陈胜称王是鬼神的意志，以此来提高陈胜在戍卒中的威信。陈胜、吴广的做法也确实起到了效果，卒中往往语，皆指目陈胜。陈胜、吴广问事鬼神，借鬼神的名义来树立威信，以便后期统领戍卒。


    三、同戍卒之念。起义的名声有了，也经过鬼神同意了，接下来就要发动士卒。一方面吴广利用自己士卒多为用者的优势，激化戍卒与将尉的矛盾。将尉醉，广故数言欲亡，忿恚尉，令辱之，以激怒其众。吴广故意在将尉面前说自己要逃走，并且辱骂将尉，想要激怒将尉，让将尉侮辱自己，以激发戍卒的同仇心理，让戍卒和自己立场一致；另一方面在吴广激发戍卒同仇的基础上，陈胜将戍卒面临的现实揭露出来：


    > 公等遇雨，皆已失期，失期当斩。藉第令毋斩，而戍死者固十六七。且壮士不死即已，死即举大名耳，王侯将相宁有种乎！


    现在大家遇到雨水天气，已经延误时间了，不能按时戍边了。延误期限，所有人都会被杀，即使没有被杀，戍边死亡的也占有一大半，我们即使死亡也要轰轰烈烈的，王侯将相难道是天生的吗？陈胜通过起义前的鼓动进一步激发戍卒士气，统一自己和戍卒的思想，戍卒敬受命。轰轰烈烈的大泽乡起义就此拉开帷幕。


    陈胜、吴广起义可以称作中国农民起义的源头，那么古代中国起义或造反的常见套路是什么呢？


    第一步宣示理念。宣示理念就是表明自己起义的理念，表明自己的立场。无论大大小小的起义都有着自己的理念，自己的宗旨，这是起义能否获取外部支持、能否取得成功的关键，如果理念能够得到外部的支持，那么将会出现天下箪食壶浆以待将军的局面，反之则是一群乌合之众，天下人追随王师以讨逆贼，徒增笑料而已。西汉末年，赤眉军起义宣扬：“刘氏复起、李氏为辅”就是表面起义为了兴复刘氏，引导天下的支持，天下人支持的是赤眉军吗？天下人支持的是刘氏。刘备用兴复汉室，还于旧都的口号也是这个目的，需要注意的是理念需要落到实处，达成理念，不然就成了挂羊头卖狗肉，喊着兴复汉室，却登基称帝了。


    ## 赤眉军起义


    第二步明示天意。中国人自古对于鬼神之说一项是不可不信，但又不能全信，所以孔夫子说敬鬼神而远之，但是渐渐发展为敬天法祖，皇帝自称天子，国人对于天意诚惶诚恐。古代农民起义特别喜欢用天的名义来宣扬自己的政治正确，表明自己的起义是得到了天的认可，既给自己增添信心，又给天下人希望。东汉末年，黄巾军起义，张角就喊出了“苍天已死，黄天当立，岁在甲子，天下大吉”的口号，表明自己是顺应天意，天要黄天当立，黄巾起义一定能成功。天意在中国不断发展，到清末的时候，洪秀全的太平天国起义依然摆脱不了天意，只不过换成了宗教的形式来解释天意，自称为上帝之子、天王，来表明受命于天。然天意不过是人心，人心向背就是天下大势，顺之者昌，逆之者亡。


    ## 太平天国运动


    第三步同上下之欲。同上下之欲在宣示理念和明示天意的基础上向起义的士卒和将领表明态度，让士卒明白现在面临什么样的情况，应该怎么去做，为什么这么做，就是给士卒赋予信念。一个没有信念的队伍再怎么强悍也逃脱不了乌合之众的范畴，而一旦有了信念，所有人都愿意做信念的信徒，队伍将会焕发出强大无比的战斗力，孙子兵法云：上下同欲者胜就是这个道理。


    《水浒传》中宋江起义，大部分好汉都是逼上梁山，社会黑暗，所以要做的就是替天行道，使梁山好汉上下同欲，天若不能治，梁山治之。秦明想要继续跟随朝廷，宋江让李逵假扮秦明攻打州城，结果无路可投，不得不反，这也是一种上下同欲的方式，只不过是过于极端。真正的上下同欲必定是首领与士卒有共同的信念、共同的追求，为共同的目标努力，才能激发强大的战斗力。


    ## 商人对势的应用


    市场这个词我理解其意为：民之所需，民之所求，民心所向才能创造机会创造良好的形势，根据国家政策、根据大的环境、根据大背景，市场经济大潮中有所需就有所求，有所求就滋生出利益之供给，有利益就产生了对谋略之所需。这种市场中的供求经济关系可以引用到现在市场经济效益学。


    “需求”这个词并不难理解，但最难的是怎么才能知道到别人需要什么，不需要什么，知道需要什么了该怎么进行供给，以什么方式进行供给，用什么人供给，供给什么产品，产品什么价位等等，这些都是一个策划人在策划之前需要掌握的最基本的情况。总的来说我认为学习策划先要学习“需求”，只有市场中的供求关系搞清楚了，才有可能在原来的基础上进行创新，然后再系统的整合、规划和分解。


    ## 权谋应用


    我把想和要了解称之为“谋”，把市场之所需称之为“势”。


    第一步从“谋势”开始，也就是寻求市场中的需求点。中国历史上就有“谋略、智谋”的称谓。在高级商务策划师培训的讲堂上周培玉教授讲习中国策划智慧，最多的是体现了历史上著名的“谋略”之术，起初的“谋略”在战争中广泛应用，谋略来源于战争而用于战争，最早的要数伊尹、姜尚都是以谋为生、以谋立足、以奇谋妙计名传后世的。中国的策划谋略思想曾经出现了四大门派：儒家之智，法家之略，道家之术，纵横家之说，这四大门派其实都在围绕谋略搜寻所需，国之所需，民之所需，有了所需用不同的思想方法和手段进行合理的供给分配。“谋势”用最简单的四个字可以概括为“究其形势”。


    策划的第二步从“借势”延伸，也就是在大政策环境下抓住机会顺势而动，三十六计中的胜战计系列都是以借势而展开，例如“借刀杀人、以逸待劳、趁火打劫”等。在现代营销广告策划的案例中，蒙牛集团就是借超女之势来为自己造势提高知名度，获得了空前的成功，但蒙牛集团起初需要的是“谋势”，先分析和研究“超女”的发展的形势，在年轻人的需求中创新出合理的供给，例如其产品“蒙牛酸酸乳”。


    策划的第三步从“造势”而攻，就是在原有的基础上创造新的形势，创造新的方法和环境，这是我们在策划中最关键的一环，也就是创新。例如：砸奔驰车事件，人喝涂料事件都是在原有产品上进行营销创新来制造事件，并由此事件为切入点开展新的攻势。古代的大军事家孙武著作中有：凡战者以“正合”以“奇胜”，在造势中要“知常知变”，知常以求稳，知变以取胜，不能盲目的不根据客观事实进行造势，否则造势不成便成为劣势了。


    策划的第四步从“控势”来抓，也就是经过“谋势、借势、造势”后必须有控制形势发展的能力，不能任由其自由发展，要有紧有松、有大有小、有前有后、有现在还要想到将来。就像有些活动举办时大放异彩，但总有所保留，把一些创新点故意保留，为了下一届活动更加成功而打好基础。要对大至政府权力影响、小至每一个客户在活动创新的基础上有所控制，现在的市场经济下“控势”更多需要的是公共关系和协调能力。


    策划的第五步从“得势”中解脱，就如拿到了走向成功的“通行证”一样，在大环境、大政策下，“造势”造就“得势”的成功。有个酒类的品牌名字叫“舍得酒”，暂且不管这个品牌在市场上走不走俏，名字还是挺有意思的。


    市场之势就是通过“谋势、借势、造势、控势、得势”的建立而完成的。


    ## 揭露职场中层借势上位


    ### 中国古代职场中的借势之术


    弄权者的阴暗心理揭露：凡在下者，应弘思远益，应权通变，多方建树，相时而动。由友及朋，由朋及党，由党及群，与自己志同道合的人滚雪球般越来越多，以自己为中心的势力范围逐渐扩大、蔓延，最终如火如荼，发展成不可遏止的局面。有朝一日，时机成熟，鹰扬而起，夺取权位便如探囊取物一样了。这就是古今政客商才建立基业的必由之路。


    位卑力弱的职场新人，有不足惧者三，深可谋者六。其中，庸人讹言不足惧，虎步失行不足惧，亲友不闻不足惧；权借在下深可谋，利异外借深可谋，托於似类深可谋，利害有反深可谋，参疑内争深可谋，敌国废置深可谋。（此《韩非子·内储说下》所言“六微”，即为臣下者六种最为微妙幽隐的权谋。）


