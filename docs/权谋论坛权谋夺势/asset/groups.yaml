    \n- **1. 明晰结果法**\n    对于小人，不需要用太多的招数，只需要把他每天做件事情分析出个结果来，他说的再好听，没有做出结果，一切都是空谈。这一个办法，足以让小人露馅。\n\
    \n- **2. 暗中监督法**\n    既然你知道他是小人，你就知道它不可能按照你的套路来，所以必须暗中监督他的行为。在这个过程当中，你会发现它存在的很多问题，抓住这些问题点，对他狠狠的下手，就能够让他产生一种恐惧感，控制整个局面是非常有利的。\n\
    \n- **3. 明励暗压法**\n    对小人也不能说一棒子打死，表面上可以鼓励他，但是暗地里必须狠狠的打压，直到让他抬不起头来为止，否则的话，宁肯牺牲掉这样的人，也不能让他们坏了一锅汤。\n\
    \n- **4. 心腹制衡法**\n    每个领导都会有自己的心腹，你之所以把他们拉拢成自己的心腹，一定是有自己的用法的，其中在小人身上就派上了大用场，这是一种平衡的法则。\n\
    \n- **5. 抓错警告法**\n    在你对小人实施控制的过程当中，一定会抓住他的很多问题，已经抓住他的很多错误，利用这些错误的事实警告，如果再不纠正的话，或者说在下一次发现他就没有在你这个平台里，存在的任何理由了。\n\
    \n## 权谋应用\n\n- **老板分大小：小老板做事，中老板做市，大老板做势**\n\n    小老板做事：小老板不见得就在小公司，小公司也不见得就做不大，有的老板已经把企业做成了庞然大物的恐龙，但仍然执著于精耕细作。\n\
    \n    小老板只是指老板的一种人生态度，并无褒贬之分。这种老板作风踏实，保持低调，不事张扬，许多理工科出身的老板都是这样。他们要求于自己与别人并无分别，人生有限，光阴似箭，做好手头的工作，做好一家企业，做大也可，不大也罢，总之无愧于人世间走一遭。\n\
    \n    在小老板手下做事，切忌喧哗，切忌浮躁，把老板交给的每一项工作做好，万不可华而不实地空喊口号。\n\n    中老板做市：中老板讲究管理，喜欢冒险尝试新的理论和新的知识，也喜欢拿自己的公司来做试验，成功了，好；不成功，不过是从头再来。胜而不骄，败而不馁，始终保持着旺盛的斗志。\n\
    \n    中老板喜欢集思广益，凡是由中老板把持的公司，从早到晚不停地开会，而且中老板的思维跳跃幅度极大，一件事尚无头绪，另一个项目就已经进入了实施阶段，效果好坏不在话下，关键是勇于尝试，像那种'不犯错误的员工不是好员工'的口号，也只有中老板会喊得出来，但你千万不要信，口号不妨跟着老板喊，但做事仍需千谨万慎，只有踏踏实实的业绩，才是中老板最喜欢的。\n\
    \n    大老板做势：最小的大老板，敢于挟一只皮包去承揽跨国公司的工程项目；最大的大老板，喜欢标新立异，自诩担负着人类文明发展的使命，为行业制定标准，为游戏制定规则。这一类老板大多是纵览全局的人物，眼光放得开，不争一城一池之得失，一个项目的进展究竟如何不是大老板所关心的，重要的是这个项目的价值。小公司的大老板一旦成功，那就是商业时代的英雄人物，一旦失败，只能挟着皮包走路。\n\
    \n    追随大老板，就需要有能够辅助大老板的开阔视野及心胸，做项目注意抓大放小，宣传的声势重于实际内容，炒作的氛围高于项目的价值，注意要引用新观念、新思维、新方法，赋予项目以全新的包装和最流行的管理学概念。在这样的老板手下工作最忌古板僵化，不知变通。\n\
    \n    大老板喜欢豪华的办公环境，工作间宽敞气派。中老板总是马不停蹄地奔走于客户之间，不停地推销自己的思想观念。小老板却一步也不肯离开车间，他的办公室甚至没有为客户预留座位。\n\
    \n    小老板做的是产品，每个小老板都是行业的精英人物，对生产技术精益求精，对企业管理要求稳步低调。\n\n    中老板做的是项目，喜欢在各个不同的行业之间跳来蹦去，挑战自己的思维极限，喜欢冒险进入陌生的领域并获得成功的荣耀。\n\
    \n    大老板做的是资源，最是重视无形资产的增值与服务，他的思维不会被现实的环境所左右，能够洞察宏观经济环境下的市场态势与走向。不同的员工适宜不同的老板。\n\
    \n    作风踏实的员工最适宜追随小老板，与小老板一起成长。思维敏捷的员工最适宜追随中老板，众多的新项目足以满足你的乐趣需求。善于谋略的员工最适宜追随大老板，每一个战略都能够让你获得足够的成就感。\n\
    \n    作风踏实的员工追随小老板，假以时日，有望晋升到高管的职位。思维敏捷的员工追随小老板，可以独当一面，获得主管的职位。善于谋略的员工在小老板面前无用武之地。\n\
    \n    在中老板手下，最容易获得晋升机会的是思维敏捷的员工。作风踏实的员工仍然有望独当一面，获得主管职位。善于谋略的员工会成为中老板的合作伙伴，而非部属。\n\
    \n    在大老板手下，善于谋略的员工将会获得前所未有的发展空间，思维敏捷的员工最不稳定，作风踏实的员工未必拥有晋升的机会，但也无失业之虞。\n"
