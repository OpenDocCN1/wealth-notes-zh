    我把想和要了解称之为“谋”，把市场之所需称之为“势”。


    第一步从“谋势”开始，也就是寻求市场中的需求点。中国历史上就有“谋略、智谋”的称谓。在高级商务策划师培训的讲堂上周培玉教授讲习中国策划智慧，最多的是体现了历史上著名的“谋略”之术，起初的“谋略”在战争中广泛应用，谋略来源于战争而用于战争，最早的要数伊尹、姜尚都是以谋为生、以谋立足、以奇谋妙计名传后'
  - '[PAGE 64]


    世的。中国的策划谋略思想曾经出现了四大门派：儒家之智，法家之略，道家之术，纵横家之说，这四大门派其实都在围绕谋略搜寻所需，国之所需，民之所需，有了所需用不同的思想方法和手段进行合理的供给分配。“谋势”用最简单的四个字可以概括为“究其形势”。


    策划的第二步从“借势”延伸，也就是在大政策环境下抓住机会顺势而动，三十六计中的胜战计系列都'
  - '[PAGE 65]


