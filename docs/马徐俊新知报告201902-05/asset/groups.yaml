    # |“视觉想象力障碍”是一种什么体验?


    英语 中有个说法叫Mind''s Eye，翻译 来叫 “心灵之眼”，就是指人们可以在脑中通过幻象来观事物。如果有人说你 有视觉想象力障碍， 那最直观的结果就是，
    你 没有在脑海中构建任何画面。你 的“心灵之眼”是盲的。


    这是一种什么体验呢？在英国兰开斯特，有个叫尼尔·肯德尔的人， 就有视觉想象力障碍。他 在自述中说，小时候看医 生 就喊他，“ 在脑海中数数 5” ，结果他完全做不
    到。他 脑海中，压根就想象不出任何关于栅栏 的场景，所以也没什 么 可以解释。


    还有一位视觉想象力 障碍者叫吉尔·摩根。有一次她参加一个培训班，老师在课堂 上 说，“ 请大家都想象一幅当日的 风景画。 " 可以想象 一天的画。当天晚上，她在酒吧里跟朋友
    吐槽，结果朋友 说， “想象画面？这不很 容易嘛！" 这话 轮到吉尔了，她这才发现自己和别人 不一样。


    不过，真正的困扰，是无法想起人脸。吉尔·摩根说，她 是最想拥有视觉想象力的，因为她在母 世之后，其他人 自己的 记忆中，脑海中都会浮现出他们 的名 字，记忆中的画面
    就像录像 一样一 幅幅闪过。但是吉尔做不到，想念念父母 的时候，只能看到， 让她非常难过。


    这就是视觉想象力障碍者真实的生活体 验，可一旦意识到人们 竟然不知道这样 的存在，是先 发现了他们的呢？就是英国 埃克塞特大学的亚当·泽曼 教授。他最 早注意到视觉想象力
    障碍，是 他的一位患者 声， 自从做了心脏手术之后，脑中再也不 有画面了。泽曼教授很 感兴趣，就开始了研究。


