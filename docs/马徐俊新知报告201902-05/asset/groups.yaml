    \n## 总结\n\n你的人生目前处于什么样的状态，不是最重要的，因为无论在什么样的状况中，你都可以尝试做出改变。想要更轻松的生活，就要分清生活和工作中轻重缓急，把能帮助自己成长的事情流程化、规范化，并且严格按步骤执行下来。\n\
