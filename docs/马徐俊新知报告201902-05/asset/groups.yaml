    +   * 习惯的力量非常强大，如果不为自己生活加成长性因素，你很难打破日积月累形成的惯例，从原地打转的生活节奏中实现突破和蜕变，所以为自己打造一套“早晚生活流程”非常重要。

    * 打造生活流程的关键是睡前的规划，包括晚间日记、制定“明日计划”，设置一个高效的起床环境、远离手机睡个好觉。

    * 早间生活流程包括早起，通过心理暗示或者日记来连接未来、执行前一晚制定的计划，做最重要的事。


