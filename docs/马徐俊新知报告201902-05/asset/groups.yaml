    明天的议题是如何给企业文化“排毒”？


    一般来说，如果一家企业的企业文化一团糟，大家勾心斗角乌烟瘴气，是不是就没救了？《哈佛商业评论》用一个“反转”案例，告诉我们如何给企业文化“排毒”。


