    我们通常认为，一个人的政治倾向受到了很多复杂因素的影响，但《大西洋月刊》的最新报道却说，人的政治倾向可能是天生的，而且和一个非常普遍的生理机制——“恶心敏感度”有着密切的关系，为什么这么说呢？


