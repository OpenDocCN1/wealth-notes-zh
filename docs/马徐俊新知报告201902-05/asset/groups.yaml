    明天的议题是#洗衣凝珠为什么成了“幼儿杀手”?#


    洗衣凝珠是一款广受欢迎的洗衣产品，但因为它的外观和颜色非常像糖果，很容易被幼儿误食，导致窒息。这么危险的产品，为什么始终没有改变外观设计？美国政府为什么不加强监管？这背后，是什么样的商业逻辑在起作用？


