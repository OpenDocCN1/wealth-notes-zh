    # 今日报告：中国汽车产业会引领全球吗？


    长久以来想要主宰全球汽车产业的雄心，在未来，会让中国成为个人出行领域一支异军突起的力量。


    ——《经济学人》


    马徐骏


    通过发展电动车生态，中国想要创造出一个强大的交通生态系统，输出一套全新的行业标准。


    今天的议题分为两个部分：


    +   - 中国的两次运输革命

    - 中国造电动车的优势在哪儿？


    今天我们先来说本期《经济学人》的封面文章，标题很有趣，叫《万里轮替》（Great wheels of China）。这篇文章将，中国从制造整车有智能汽车来打破全球，长久以来想要主宰全球汽车产业的雄心，在未来，会让中国成为个人出行领域一支异军突起的力量。


    A long- held ambition to dominate the global car industry will make China a force
    in the future of personal transport.


    这句话是咱们今天的金句。


    单看这句话，你可能会觉得奇怪，有雄心就能成事吗？那成败也未免太简单了。汽车工业，向来是欧美主导的产业，要说在未来的竞争中，日本有潜力加入战场，颠覆美国车霸的座席，还有可能，中国要成为异军突起的力量，可能吗？


    答案是：用静态的眼光来看，中国目前的综合实力离美国确实还有差距，但如果用发展的眼光来看，那《经济学人》的结论就非常有价值了。中国的汽车制造业，确实有潜力站在世界之巅，甚至能输出行业标准。今天的内容，咱们就来讲讲中国的汽车制造业为什么有这个潜力。


    # 中国的两次运输革命


    文章开门见山地指出中国正在经历的汽车业变革，称为中国的第二次运输革命。为什么叫第二次运输革命呢？因为30年前，国内曾经出过第一次运输革命，标志是汽车产能的大规模提升和国内爆火的购车浪潮。


    80后、90后可能没有印象，上个世纪后半叶，中国曾被称为“自行车王国”，上下班路上，浩浩荡荡的行军车队，人人为流，那个时代骑自行车是带感带东西，满是是政客们机关单位使个官用得上去，要么就是出租车，一般人还真不敢随便叫。


    为了改变这种局面，中国在上个世纪80年代，开始引入国外车企，跟中国本土车企成立合资公司，比如一汽集团和大众集团，就是这种试点的排头兵。《经济学人》认为，这次尝试非常成功，在短短几十年的时间，中国本土车企的汽车制造业技术水平快速地追赶上来，产能也得到了巨大的提升。


    比如去年，中国一共生产了2300万辆汽车，远远比欧洲和美国都高了五倍，你从下面这张状图中可以找到鲜明的对比，相信这会让你对中国的进步感到骄傲。


    ![](img/82c50821bc552fe72722a78212114e65_99_1.png)


    文章给出的数据显示，目前中国正在使用的汽车，共有3亿2200万辆。全球最拥堵的20个城市中，6就占了8个。根据贝恩国际顾问公司2017年的调查数据显示，“挤着一辆私家车主，是一种身份的的象征”，持这种想法的中国人不到50%，说明私家车对于中国人来说，已经不算罕见了，甚至在2018年，中国的新车销售数还出现了小幅下降。


    想想看，仅仅20年前，拥有辆私家车，还是大多数中国家庭可望而不可即的选择，但如今我们却在家为车子太拥挤，牌照上千了而烦恼。这种巨大的转变，不得不说是一个奇迹。


    所以，中国为第一次运输革命，是以巨大的产能爆发为标志的，解决了大量富裕起来的中国家庭，拥有私家车的渴望。


    而如今，我们来到了中国第二次运输革命的拐点。这次的运输革命，跟之前不同的是为目标的第二次运输革命，最大的不同在于，它不是技术水平的明显升级，也就是说，不是用更高质量更好的汽车，还是强调科技产业链条先进，其中最重要的指标，就是新能源汽车，准确地说，是电动车的出生。


    你可能也发现了，这几年电动车一直是全球的热点议题。咱们可能也觉得很多次了，但仔细想想，你会发现，对于美国等最发达，其实只有2个国家，一个是日本，但日本再厉害一个高下，那它不如造电动车的热情的，高上下远中位了。


    《经济学人》认为，这是因为在电动车制造中，中国不仅有得天独厚的优势，而且大力发展电动车，也更符合中国的国家利益，这是为什么呢？


    # 中国造电动车的优势在哪儿？


    文章里总结中国造电动车的优势，可以归纳为三个角度，分别是存量优势小，市场需求大及技术支持。


    先说存量优势小。目前全球的汽车工业，正在经历从内然机时代向电驱动时代的迁移，这正是中国会开弯道超车的机会。你可能会说，现在美英也是发发展电动车，中国相比之下，未必会有优势吧？但《经济学人》认为，中国的优势很大。相比之下有百年历史积淀的欧美国家，中国正因为起步较晚，反而迁移起来成本低很低。


    经济学上常说，‘沉没成本不是成本’，话虽没错，但真的让你放弃已经积累起来的优势，说得容易做起难，文章指出，像马迭特等车企汽车制造者，依然在摇摆，想着慢慢过渡到电动车技术，甚至还企图通过游说德国政府，来保留一些自己已经发家的余热，但总体来于德国电动车行业的余利，加大在工厂不上来，电动车的制造，比传统的内燃机车型要简便很多，比原原本本还差的一些关键技术，比如引擎制造技术，反而没有那么重要了。


    其次是市场需求大，由于中国给予新能源车极大的优惠政策，无论是建车的地补贴，还是大城市中限制更方便，都极大地刺激了中国国内电动车销量。2018年，中国一共卖出了110万辆电动车，今年预计会达到150万辆，差不多占了全球销售量的1/3。


    ![](img/82c50821bc552fe72722a78212114e65_99_2.png)


    从上面这张图你可以看到，预计未来20年，中国电动车的销量可以持续占据全世界1/3份额。这其中还包括中国的电动汽车出口，全世界目前还有多40万辆电动汽车，几乎全部是中国产的，绝大部分供应国内市场。销到的出口中。现在全中国超过了300家城市，都在使用电动车的电动汽车。根据咨询公司AltoMotor
    Co. 的首席执行官比尔·拉普的说法，这种强大的市场优势，会导致全世界的电动汽车供应链，都被引入到中国来，到时中国的电动车生产标准，会辐射到全世界的制造商。


    而中国的技术优势强，是从电池，并且出行和自动驾驶这三个方面体现的。


    首先要说造电动车的核心部件——电池。大家都知道，中国的电池技术-电池，本身是能源里领先的。但中国目前在电动汽车电池上，全世界第三倍多，这样积累起来的电池制造技术，正好可以应用在新能源汽车上。


    其次，中国拥有目前全世界最大的互联网用户群，产生的数据量是世界其他国家比的。这就为中国的共享汽车行业，带来了巨大的软件数据服务。举个例子，中国的滴滴是目前全世界最大的共享出行公司，拥有5.5万了万用户，每天上滴3个万亿。比Uber还多，而且在滴滴的背后，又是腾讯和阿里这两大互联网巨头，资金充足，移动互联网技术积累深厚，加上中国人也更容易尝试新事物，所以共享出行在中国的发展特别快。


    根据罗兰·贝格咨询公司的调查，2017年，中国约10%的车辆，都具备了共享出行业务，比西方市场要强到了1/6。在整个汽车行业，正合从个人购车，向共享出行转变的大趋势下，中国在这方面的积'
  md: "\n## 总结\n\n退休危机的出现，迫使人人们对于当前的社保改革思路进行重新思考：把养老逐渐变成需要个人承担的责任，虽然减轻了政府和企业的经济压力，可长期来看却带来了严重的副作用。美国的401(K)计划就是如此，表面上看赋予了企业和个人更多的选择权，貌似各方都受益，但这种“自由度”恰恰成了一把双刃剑，为退休危机的出现推波助澜。\n\
    \n其实我们中国也面临着相似的困境，这两年媒体上对于养老金账户亏空和延迟退休年龄的讨论不绝于耳。再看很多中小企业，只愿意给员工按照最低的标准缴纳社保，更别说有什么企业年金之类的补充养老计划。这一切都说明，退休危机其实离我们并不遥远。\n\
    \n如此看来，美国老年人陷入的退休危机，应该成为一面镜子。在全球都普遍进入老龄化时代的大趋势下，让老年人能安享晚年，不再因为迫于生计而坚持工作，是全社会共同的责任。毕竟我们都有老去的那一天，这件事，关乎着我们每一个人的未来。\n\
    \n## 划重点\n\n- 今日得到：\n  1. 美国的老年人陷入了退休危机，美国政府提供的两种养老金方案，都无法给他们提供足够的保障。养老保障从一种社会共同责任，变成了“自己对自己负责”，而老年人并没有为此做好准备。\n\
    \  2. 逆转“养老靠自己”的观念，有几大要点：企业不能随意中断或取消401(k)计划；401(k)计划减小自由度，不能允许参保人提前支取；取消社保基金的缴费上限，对超标准缴纳的高收入群体征收更高的“社保税”。\n\
    \n## 资料来源：\n\n- *The End of Retirement, by Katherine S. Newman and Rebecca Hayes\
    \ Jacobs, The Nation, April 15, 2019\n- *The Basics of a 401(k) Retirement Plan,\
    \ by Mark P. Cussen\n- https://www.investopedia.com/articles/retirement/08/401k-info.asp,\
    \ Feb 3, 2019\n\n## 下期预告：\n\n明天的议题是#虚拟世界的运气是如何被设计出来？#\n\n在现实生活中，运气跟概率有关，有很大的随机性。自古以来，人人都想要驾驭运气，操纵运气，而随着现代赌场的兴起，操纵运气就成了一门学问，各种赌场和游戏设计师，都需要精心地“设计”运气，来提升用户的体验。《鹦鹉螺》的最新文章从算法和脑科学的角度告诉我们，虚拟世界的运气是如何被“设计”出来，并且让我们成瘾的。\n\
    \n## 228报告 “幸运”是怎样被设计出来的?\n\n马徐骏·新知报告\n\n![](img/82c50821bc552fe72722a78212114e65_96_0.png)\n\
    \n## 今日报告：幸运”是怎样被设计出来的?\n\n幸运可以成为一个改善生活品质、增加幸福感的重要工具。\n\n> ——《鹅鹅魂》\n\n马徐骏\n\n\
    今天的议题分两个部分：\n\n- 什么是坏的“幸运设计”？\n- 好的“幸运设计”，存在哪里？\n\n都能有好运气吗？我们大家都在下一次说过去，关于运气的话题，但主要还是不一定说明理解运气、理解成为与运气之间的关系。过去，我们最常认为运气是随机出现的，但你有没想过，运气也有可能被“设计”出来的？\n\
    \n《鹅鹅魂》杂志最近刊登了一篇文章，叫做《工程师：探讨了“幸运究竟是如何被设计出来的”》，这个问题，文章的作者西蒙·帕普是一个很受欢迎的作家，他经常给《卫报》《纽约客》《麻省理工科技评论》这些大的媒体供稿，还写过一本专门分析机器的游戏设计学，叫做《龙卷风——虚拟实验台上的危险、快乐和沉迷》，对于游戏究竟如何操控人类行为的问题，他非常有研究。\n\
    \n西蒙·帕普这篇文章曾经也在《鹅鹅魂》杂志上发过，但是最近又被人做精，证明了这篇文章的价值，我读下来觉得，这篇文章对运气设计的观念也经得起时间的考验。\n\
    \n我们专栏虽说，正确识别幸运，才能变得更幸运。通过今天这篇文章你会知道，好运气，也就是“幸运”，其实是可以被设计出来的，我们在后面把它叫做“幸运设计”。好的“幸运设计”可以促公平，提升沉迷，而坏的“幸运设计”，则会让人们沉迷其中无法自拔。\n\
    \n## 什么是坏的“幸运设计”？\n\n有句话叫“七分注定，三分靠打拼”，意思是“幸运”这件事，是随机的。在自然界中，有运气大家都不奇怪的问题，但在人类社会中，好运气不但可以被设计，还能被操纵，从古至今都是如此。\n\
    \n文章里说，从古埃及人墓葬的陪葬品里，就有玩骰子赌博做的骰子，但那时还没有手机，而古人做的，也就是说，那时的埃及人，就已经开始使用各种手段来占卜，通过设计幸运来影响到他们的决策了，点击本文就可以看图片。\n\
    \n而在现代社会，对于幸运设计，研究最深的、操纵最狠的，就要算赌场了。按照作者帕金的说法，赌场对于幸运的设计，是设计出来的典范，不但赌场可以从中牟利，还会让人沉迷。\n\
    \n比如赌场里最常见的slot machine，老虎机为例。为了能让玩家持续投入，老虎机都是经营幸运设计的，每次玩家看三个图案，哪怕对大图案的奖励是，总是到一点就输过去了，玩家会感慨，真是运气不好呀。\n\
    \n英国哥伦比亚大学的心理学家卢克·克拉克斯说，赌博设计成了某条复杂的心理变化，一方面很吸引人，另一方面也让人迷失。其实最大的快乐，基本上就其老虎机都是算法控制的，本身不可能产生大错处，就是造成这种毫厘之间幸运错觉，引导玩家继续找下去。\n\
    \n而且借助大数据的力量，赌博业早已经有能力追踪个人的行为，建立顾客详细的数据档案，资料甚至可以用来预测，如何以及何时，这个人可能更会离开。算法会及时提醒顾客的获胜概率，在他马上要放弃的时候，让他小赢一次，调整顾客的愉悦和预期，让他留下来继续赌。\n\
    \n这其实已就不算是个什么秘密了，美国有很多州甚至合法了赌场，允许赌场这么“操纵”幸运。但赌场依然有反赌法，在赌场里有一种叫“幸运大使”的工作人员，会亲自走到顾客身边，送给他一些赠品作为奖励，说那是因为运气不好，中奖了，但其作用同算法控制的机器是一样的，依然是为了让顾客继续玩下去。文章里说的，这些人只是帮幸运设计幸运，让玩家看不投入进去的冰山一角，但也很触目惊心的。\n\
    \n克拉克斯还说，在人脑子里有一个处在核心位置的区域，叫纹状体，管理运动和奖赏，也是我们生存策略的重要器官，而这个区域还没有为学习而形成，所以它会不断地刺激纹状体，会导致上瘾行为。这也是为什么赌博很难戒除的原因。\n\
    \n我们知道了，赌场通过对幸运的设计，从赌客身上获利，是否会经常输钱，但如果把对幸运的设计，用在好的方面，又会怎么样呢？\n\n![](img/82c50821bc552fe72722a78212114e65_96_1.png)\n\
    \n## 好的“幸运设计”在哪？\n\n文章里说，好的幸运设计会让人产生一种公平感。\n\n你可能不知道，人类共需要的公平感，和现实世界的概率真相其实是同一回事，比如说，我们告诉一个人是一个游戏，他有1/3的概率会赢，那么，这个人期望游戏的结局是什么？答案，是这个人会期望玩三次至少会赢一次。\n\
    \n但从概率学上来说，根本不是这样。每一局获胜的概率都是1/3，意味着每次选择是概率都是66%，而且每局之间的结果都是不相关的，这个人才可能连续输10次，却一把都没想过，但普通人接受了这个逻辑时，如果这种游戏让玩家赢了10局，玩家会看到1/3的获胜概率，却连输10次，肯定不玩了，这就是对游戏设计师资力的考验了。\n\
    \n把幸运设计到游戏里，不只是要调整一些参数，增加游戏里的随机性，而是一个非常高难度的活儿。一方面，不能设计得太难，玩家一直赢不了，玩家大概率是要弃玩的；但另一方面，参考者感到自己是幸运的，所以一旦，设计与又不太简单，如果每次飞行都会带来好运，玩家很快就会发观规律，之后就觉得无聊了，就会弃玩，太轻松的游戏，同样留不住玩家。\n\
    \n这种情况被游戏设计师们称之为幸运谬论—lucky paradox，原 call lucky is fun，但 too lucky is unreal，意思是：是玩游戏，太走运就假了。跟真实世界相比，游戏的体验都非常重，要么，或者说让玩家感觉到自己很幸运，是关乎游戏成败的重要元素。设计游戏也体验到某种巧妙的平衡，所以必须在1/3的获胜概率，就必须的让玩家一次至少赢20%，这样的设计出来的游戏，才符合人类的公平感，游戏设计师能透过对幸运的公道设计，让不同水平的玩家能够一起享受游戏乐趣。\n\
    \n文章里举了一个例子，是一个纽约的游戏设计师，设计和国际象棋游戏“我们”。新手小时，高手和国际象棋本应玩得赢，新手只有能在地上狠狠摔棋盘的少年，高手也气得不停地跳。对于这个游戏设计，他写了一款叫Really\
    \ Bad Chess的国际象棋游戏，让双方开打的时候，棋子走随机走位，两个不同5小时，高手还是比新手多，这样就双方在不自不用的资源条件下博弈，高手也败得心服，最后所有人都不得过。\n\
    \n所以一个好的游戏设计，不只是让故事精彩，规则明晰，对于玩家心情的把控，规则的制定，都有着非常高要求。帕帕在文章里说，游戏向来是人与人真实世界的一种桥梁，幸运也可以被人为改造的，而在现实世界，幸运也都可以成为一个改善我们的生活体验，增加幸福感的重要工具。\n\
    \nLuck has become a design tool capable of changing our experiences and expectations.\n\
    \n这句话也是我们今天的主句。\n\n## 总结\n\n幸运是可以被人为设计的，坏的幸运设计，如同赌场，会让人上瘾、让人控制。而好的幸运设计，会让一个人进入开心的游戏，会让人们觉得公平，从而增加幸福感。\n\
    \n你觉得游戏里属于幸运的设计，能怎么迁移到我们的日常生活当中呢？\n\n欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n##\
    \ 彩蛋\n\n有这么一个故事，说的是北欧的国王奥拉夫二世想跟国王哈康·哈纳的国王在维京人的历史上写个故事，两个国王之间曾经发生了关于争夺领土的战争，他们互相在岛上放了一个空碗和一碗水，哈康·哈纳把水端走了，奥拉夫二世愤怒地在空碗上放了一个碗，结果哈康·哈纳又把空碗端走了，最后奥拉夫二世把两个碗都砸了，哈康·哈纳就笑了，说：你终于学会了放两个碗。\n\
    \n定用掷骰子的方式决定领土的归属。邻国的国王掷出两个6，跟奥拉夫三世说：“你别玩了，你不可能比我大。”但是奥拉夫三世在上帝的庇护下，掷出去的骰子，其中一个裂成了两半，结果变成了两个6和一个1，加起来13点，赢了邻国的国王。英语里把13比喻为“比幸运更幸运的事”，lucky\
    \ 13这个表达就是这么来的。\n\n## 划重点\n\n![](img/82c50821bc552fe72722a78212114e65_97_0.png)\n\
    \n## 资料来源：\n\n网站：\n- *How Designers Engineer Luck into Video Games, by Gregory\
    \ Laughlin, Nautilus, March 14, 2019*\n\n## 下期预告：\n\n明天的议题是#程序员的审美正改变世界？#\n\n\
    当今社会，程序员是一个很有特点的群体。他们经常被形容为木讷、思维古怪、不善沟通，审美也经常被吐槽。最新一期《连线》杂志解构了程序员的底层思维逻辑，并提出，程序员的审美取向伴随着新的科技浪潮，正在改变着世界。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_97_1.png)\n\n## 229篇结合程序员的审美正在改变世界！\n\
    \n### 今日分享：程序员的审美正在改变世界！\n\n程序员正在改变世界，“优化”是核心动力。他们追求高效、简洁、可扩展的解决方案，这深刻影响了科技、经济乃至文化。从代码到城市，他们的审美正在塑造一个更智能、更高效的未来。\n\
    \n## 【导语】\n\n### 当效率成为普世价值\n\n在当下社会，**“优化”** 是科技领域的核心语言。它不仅是程序员的信条，也日益渗透至商业、设计乃至生活哲学中。这种追求极致效率与逻辑清晰的思维模式，正以前所未有的广度重塑着世界的面貌。\n\
    \n## 【优化的本质是什么？】\n\n程序员优化，本质是**在给定约束下寻找最优解**。它不是消除限制，而是在限制内实现价值最大化。这种思维超越了代码，成为一种解决复杂问题的方法论。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_98_0.png)\n\n### 优化是权衡的艺术\n\n优化并非总追求“更多”或“更快”，而是**在多个目标间取得平衡**。速度、内存、可维护性、成本——往往需要在它们之间做取舍。这种权衡能力，是优秀工程师的核心素质。\n\
    \n### 从代码到世界\n\n优化思维正在外溢。从城市交通的智能调度，到供应链的精益管理，再到个性化学习路径的设计——**“效率”成为衡量价值的标尺**。这种转变既是机遇，也引发了关于人性化、公平性与可持续性的深刻讨论。\n\
    \n## 【程序员的审美如何定义？】\n\n程序员的审美，是**对逻辑、简洁与可扩展性的追求**。它体现在代码的每一行：清晰的命名、合理的抽象、优雅的算法。这不仅是技术美学，更是一种解决问题的哲学。\n\
    \n### 抽象是核心能力\n\n**抽象**是程序员应对复杂性的关键工具。通过隐藏细节、提炼本质，代码得以复用与组合。这种能力超越了编程，成为理解世界、构建系统的通用思维。\n\
    \n### 简洁与优雅\n\n“**能少一行代码，绝不多写一行。**” 简洁不仅是代码风格，更是一种价值观。它意味着清晰、可维护、易于理解。这种对简洁的追求，正在影响产品设计乃至商业模式。\n\
    \n### 可扩展性思维\n\n好的设计不仅解决当下问题，更为未来变化预留空间。**可扩展性**是程序员审美的另一维度，它体现为对不确定性的包容与对演进的预判。\n\
    \n## 【程序员的审美正在如何改变世界？】\n\n### 技术产品的重塑\n\n从移动应用背后的微服务架构，到云计算的弹性扩展——**以效率与规模为核心的设计哲学**，正在重新定义软件产品。用户体验、成本结构、商业模式，无不受其影响。\n\
    \n### 工作方式的变革\n\n**DevOps、敏捷开发**等理念，将“持续交付”与“快速迭代”推向核心。团队协作、项目管理的粒度更细、节奏更快，“小步快跑”成为新常态。\n\
    \n### 社会与文化的渗透\n\n“**数据驱动**”成为决策主流，“**A/B 测试**”进入市场营销，“**个性化**”重塑内容消费。程序员的思维模式，正在潜移默化地改变社会运行的底层逻辑。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_98_1.png)\n\n### 反思与未来\n\n追求极致效率，也需警惕其潜在风险：**“内卷”、短期主义、创新抑制**。未来，如何在效率与人性化、长期价值之间找到平衡，将是科技与社会共同面对的课题。\n\
    \n## 【结语】\n\n程序员的审美，远不止于代码。**它是一种以逻辑、简洁与可扩展性为核心，追求在约束下最优解的思维范式**。这种范式正在重塑技术产品、工作方式乃至社会文化。理解并善用这种审美，是把握未来科技脉搏的关键。\n\
    \n## **参考资料**\n\n- *Efficiency is Beautiful*，作者：Chris Crawford\n- *A Definition\
    \ of Computational Thinking*，来源：leantimes.com\n- *The Beauty of Simplicity*，来源：ACM\n\
    \n## 下期预告\n\n## 你的职业是程序员吗？你在日常工作中会遇到哪些有趣的问题？\n\n**评论区互动**：分享你的“优化”故事或困惑。\n\n-\
    \ 王小明：确认有看过代码时觉得优化一切的程序员吗？“crontab” 是啥意思啊。觉得程序员的思维都是“非黑即白”的，很少看到有“灰度”思维，要么就是“全或无”。\n\
    - 张三：确实，程序员审美更偏向逻辑，但业务方更关注体验和成本，两者常冲突。\n- 李四：简洁是好的，但过度抽象有时是灾难。要平衡！\n\n## 230报告丨中国汽车产业会引领全球吗？\n\
    \n马徐骏·新知报告\n\n![](img/82c50821bc552fe72722a78212114e65_99_0.png)\n\n## 今日报告：中国汽车产业会引领全球吗？\n\
    \n长久以来想要主宰全球汽车产业的雄心，在未来，会让中国成为个人出行领域一支异军突起的力量。\n\n——《经济学人》\n\n马徐骏\n\n通过发展电动车生态，中国想要创造出一个强大的交通生态系统，输出一套全新的行业标准。\n\
    \n今天的议题分为两个部分：\n\n- 中国的两次运输革命\n- 中国造电动车的优势在哪儿？\n\n今天我们先来说本期《经济学人》的封面文章，标题很有趣，叫《万里轮替》（Great\
    \ wheels of China）。这篇文章将，中国从制造整车有智能汽车来打破全球，长久以来想要主宰全球汽车产业的雄心，在未来，会让中国成为个人出行领域一支异军突起的力量。\n\
    \nA long-held ambition to dominate the global car industry will make China a force\
    \ in the future of personal transport.\n\n这句话是咱们今天的金句。\n\n单看这句话，你可能会觉得奇怪，有雄心就能成事吗？那成败也未免太简单了。汽车工业，向来是欧美主导的产业，要说在未来的竞争中，日本有潜力加入战场，颠覆美国车霸的座席，还有可能，中国要成为异军突起的力量，可能吗？\n\
    \n答案是：用静态的眼光来看，中国目前的综合实力离美国确实还有差距，但如果用发展的眼光来看，那《经济学人》的结论就非常有价值了。中国的汽车制造业，确实有潜力站在世界之巅，甚至能输出行业标准。今天的内容，咱们就来讲讲中国的汽车制造业为什么有这个潜力。\n\
    \n## 中国的两次运输革命\n\n文章开门见山地指出中国正在经历的汽车业变革，称为中国的第二次运输革命。为什么叫第二次运输革命呢？因为30年前，国内曾经出过第一次运输革命，标志是汽车产能的大规模提升和国内爆火的购车浪潮。\n\
    \n80后、90后可能没有印象，上个世纪后半叶，中国曾被称为“自行车王国”，上下班路上，浩浩荡荡的行军车队，人人为流，那个时代骑自行车是带感带东西，满是是政客们机关单位使个官用得上去，要么就是出租车，一般人还真不敢随便叫。\n\
    \n为了改变这种局面，中国在上个世纪80年代，开始引入国外车企，跟中国本土车企成立合资公司，比如一汽集团和大众集团，就是这种试点的排头兵。《经济学人》认为，这次尝试非常成功，在短短几十年的时间，中国本土车企的汽车制造业技术水平快速地追赶上来，产能也得到了巨大的提升。\n\
    \n比如去年，中国一共生产了2300万辆汽车，远远比欧洲和美国都高了五倍，你从下面这张状图中可以找到鲜明的对比，相信这会让你对中国的进步感到骄傲。\n\n\
    ![](img/82c50821bc552fe72722a78212114e65_99_1.png)\n\n文章给出的数据显示，目前中国正在使用的汽车，共有3亿2200万辆。全球最拥堵的20个城市中，6就占了8个。根据贝恩国际顾问公司2017年的调查数据显示，“挤着一辆私家车主，是一种身份的的象征”，持这种想法的中国人不到50%，说明私家车对于中国人来说，已经不算罕见了，甚至在2018年，中国的新车销售数还出现了小幅下降。\n\
    \n想想看，仅仅20年前，拥有辆私家车，还是大多数中国家庭可望而不可即的选择，但如今我们却在家为车子太拥挤，牌照上千了而烦恼。这种巨大的转变，不得不说是一个奇迹。\n\
    \n所以，中国为第一次运输革命，是以巨大的产能爆发为标志的，解决了大量富裕起来的中国家庭，拥有私家车的渴望。\n\n而如今，我们来到了中国第二次运输革命的拐点。这次的运输革命，跟之前不同的是为目标的第二次运输革命，最大的不同在于，它不是技术水平的明显升级，也就是说，不是用更高质量更好的汽车，还是强调科技产业链条先进，其中最重要的指标，就是新能源汽车，准确地说，是电动车的出生。\n\
    \n你可能也发现了，这几年电动车一直是全球的热点议题。咱们可能也觉得很多次了，但仔细想想，你会发现，对于美国等最发达，其实只有2个国家，一个是日本，但日本再厉害一个高下，那它不如造电动车的热情的，高上下远中位了。\n\
    \n《经济学人》认为，这是因为在电动车制造中，中国不仅有得天独厚的优势，而且大力发展电动车，也更符合中国的国家利益，这是为什么呢？\n\n## 中国造电动车的优势在哪儿？\n\
    \n文章里总结中国造电动车的优势，可以归纳为三个角度，分别是存量优势小，市场需求大及技术支持。\n\n先说存量优势小。目前全球的汽车工业，正在经历从内然机时代向电驱动时代的迁移，这正是中国会开弯道超车的机会。你可能会说，现在美英也是发发展电动车，中国相比之下，未必会有优势吧？但《经济学人》认为，中国的优势很大。相比之下有百年历史积淀的欧美国家，中国正因为起步较晚，反而迁移起来成本低很低。\n\
    \n经济学上常说，‘沉没成本不是成本’，话虽没错，但真的让你放弃已经积累起来的优势，说得容易做起难，文章指出，像马迭特等车企汽车制造者，依然在摇摆，想着慢慢过渡到电动车技术，甚至还企图通过游说德国政府，来保留一些自己已经发家的余热，但总体来于德国电动车行业的余利，加大在工厂不上来，电动车的制造，比传统的内燃机车型要简便很多，比原原本本还差的一些关键技术，比如引擎制造技术，反而没有那么重要了。\n\
    \n其次是市场需求大，由于中国给予新能源车极大的优惠政策，无论是建车的地补贴，还是大城市中限制更方便，都极大地刺激了中国国内电动车销量。2018年，中国一共卖出了110万辆电动车，今年预计会达到150万辆，差不多占了全球销售量的1/3。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_99_2.png)\n\n从上面这张图你可以看到，预计未来20年，中国电动车的销量可以持续占据全世界1/3份额。这其中还包括中国的电动汽车出口，全世界目前还有多40万辆电动汽车，几乎全部是中国产的，绝大部分供应国内市场。销到的出口中。现在全中国超过了300家城市，都在使用电动车的电动汽车。根据咨询公司AltoMotor\
    \ Co. 的首席执行官比尔·拉普的说法，这种强大的市场优势，会导致全世界的电动汽车供应链，都被引入到中国来，到时中国的电动车生产标准，会辐射到全世界的制造商。\n\
    \n而中国的技术优势强，是从电池，并且出行和自动驾驶这三个方面体现的。\n\n首先要说造电动车的核心部件——电池。大家都知道，中国的电池技术-电池，本身是能源里领先的。但中国目前在电动汽车电池上，全世界第三倍多，这样积累起来的电池制造技术，正好可以应用在新能源汽车上。\n\
    \n其次，中国拥有目前全世界最大的互联网用户群，产生的数据量是世界其他国家比的。这就为中国的共享汽车行业，带来了巨大的软件数据服务。举个例子，中国的滴滴是目前全世界最大的共享出行公司，拥有5.5万了万用户，每天上滴3个万亿。比Uber还多，而且在滴滴的背后，又是腾讯和阿里这两大互联网巨头，资金充足，移动互联网技术积累深厚，加上中国人也更容易尝试新事物，所以共享出行在中国的发展特别快。\n\
    \n根据罗兰·贝格咨询公司的调查，2017年，中国约10%的车辆，都具备了共享出行业务，比西方市场要强到了1/6。在整个汽车行业，正合从个人购车，向共享出行转变的大趋势下，中国在这方面的积\n"
  mdcn: "\n## 总结\n\n退休危机的出现，迫使人人们对于当前的社保改革思路进行重新思考：把养老逐渐变成需要个人承担的责任，虽然减轻了政府和企业的经济压力，可长期来看却带来了严重的副作用。美国的401(K)计划就是如此，表面上看赋予了企业和个人更多的选择权，貌似各方都受益，但这种“自由度”恰恰成了一把双刃剑，为退休危机的出现推波助澜。\n\
    \n其实我们中国也面临着相似的困境，这两年媒体上对于养老金账户亏空和延迟退休年龄的讨论不绝于耳。再看很多中小企业，只愿意给员工按照最低的标准缴纳社保，更别说有什么企业年金之类的补充养老计划。这一切都说明，退休危机其实离我们并不遥远。\n\
    \n如此看来，美国老年人陷入的退休危机，应该成为一面镜子。在全球都普遍进入老龄化时代的大趋势下，让老年人能安享晚年，不再因为迫于生计而坚持工作，是全社会共同的责任。毕竟我们都有老去的那一天，这件事，关乎着我们每一个人的未来。\n\
    \n## 划重点\n\n- 今日得到：\n  1. 美国的老年人陷入了退休危机，美国政府提供的两种养老金方案，都无法给他们提供足够的保障。养老保障从一种社会共同责任，变成了“自己对自己负责”，而老年人并没有为此做好准备。\n\
    \  2. 逆转“养老靠自己”的观念，有几大要点：企业不能随意中断或取消401(k)计划；401(k)计划减小自由度，不能允许参保人提前支取；取消社保基金的缴费上限，对超标准缴纳的高收入群体征收更高的“社保税”。\n\
    \n## 资料来源：\n\n- *The End of Retirement, by Katherine S. Newman and Rebecca Hayes\
    \ Jacobs, The Nation, April 15, 2019\n- *The Basics of a 401(k) Retirement Plan,\
    \ by Mark P. Cussen\n- https://www.investopedia.com/articles/retirement/08/401k-info.asp,\
    \ Feb 3, 2019\n\n## 下期预告：\n\n明天的议题是#虚拟世界的运气是如何被设计出来？#\n\n在现实生活中，运气跟概率有关，有很大的随机性。自古以来，人人都想要驾驭运气，操纵运气，而随着现代赌场的兴起，操纵运气就成了一门学问，各种赌场和游戏设计师，都需要精心地“设计”运气，来提升用户的体验。《鹦鹉螺》的最新文章从算法和脑科学的角度告诉我们，虚拟世界的运气是如何被“设计”出来，并且让我们成瘾的。\n\
    \n## 228报告 “幸运”是怎样被设计出来的?\n\n马徐骏·新知报告\n\n![](img/82c50821bc552fe72722a78212114e65_96_0.png)\n\
    \n## 今日报告：幸运”是怎样被设计出来的?\n\n幸运可以成为一个改善生活品质、增加幸福感的重要工具。\n\n> ——《鹅鹅魂》\n\n马徐骏\n\n\
    今天的议题分两个部分：\n\n- 什么是坏的“幸运设计”？\n- 好的“幸运设计”，存在哪里？\n\n都能有好运气吗？我们大家都在下一次说过去，关于运气的话题，但主要还是不一定说明理解运气、理解成为与运气之间的关系。过去，我们最常认为运气是随机出现的，但你有没想过，运气也有可能被“设计”出来的？\n\
    \n《鹅鹅魂》杂志最近刊登了一篇文章，叫做《工程师：探讨了“幸运究竟是如何被设计出来的”》，这个问题，文章的作者西蒙·帕普是一个很受欢迎的作家，他经常给《卫报》《纽约客》《麻省理工科技评论》这些大的媒体供稿，还写过一本专门分析机器的游戏设计学，叫做《龙卷风——虚拟实验台上的危险、快乐和沉迷》，对于游戏究竟如何操控人类行为的问题，他非常有研究。\n\
    \n西蒙·帕普这篇文章曾经也在《鹅鹅魂》杂志上发过，但是最近又被人做精，证明了这篇文章的价值，我读下来觉得，这篇文章对运气设计的观念也经得起时间的考验。\n\
    \n我们专栏虽说，正确识别幸运，才能变得更幸运。通过今天这篇文章你会知道，好运气，也就是“幸运”，其实是可以被设计出来的，我们在后面把它叫做“幸运设计”。好的“幸运设计”可以促公平，提升沉迷，而坏的“幸运设计”，则会让人们沉迷其中无法自拔。\n\
    \n## 什么是坏的“幸运设计”？\n\n有句话叫“七分注定，三分靠打拼”，意思是“幸运”这件事，是随机的。在自然界中，有运气大家都不奇怪的问题，但在人类社会中，好运气不但可以被设计，还能被操纵，从古至今都是如此。\n\
    \n文章里说，从古埃及人墓葬的陪葬品里，就有玩骰子赌博做的骰子，但那时还没有手机，而古人做的，也就是说，那时的埃及人，就已经开始使用各种手段来占卜，通过设计幸运来影响到他们的决策了，点击本文就可以看图片。\n\
    \n而在现代社会，对于幸运设计，研究最深的、操纵最狠的，就要算赌场了。按照作者帕金的说法，赌场对于幸运的设计，是设计出来的典范，不但赌场可以从中牟利，还会让人沉迷。\n\
    \n比如赌场里最常见的slot machine，老虎机为例。为了能让玩家持续投入，老虎机都是经营幸运设计的，每次玩家看三个图案，哪怕对大图案的奖励是，总是到一点就输过去了，玩家会感慨，真是运气不好呀。\n\
    \n英国哥伦比亚大学的心理学家卢克·克拉克斯说，赌博设计成了某条复杂的心理变化，一方面很吸引人，另一方面也让人迷失。其实最大的快乐，基本上就其老虎机都是算法控制的，本身不可能产生大错处，就是造成这种毫厘之间幸运错觉，引导玩家继续找下去。\n\
    \n而且借助大数据的力量，赌博业早已经有能力追踪个人的行为，建立顾客详细的数据档案，资料甚至可以用来预测，如何以及何时，这个人可能更会离开。算法会及时提醒顾客的获胜概率，在他马上要放弃的时候，让他小赢一次，调整顾客的愉悦和预期，让他留下来继续赌。\n\
    \n这其实已就不算是个什么秘密了，美国有很多州甚至合法了赌场，允许赌场这么“操纵”幸运。但赌场依然有反赌法，在赌场里有一种叫“幸运大使”的工作人员，会亲自走到顾客身边，送给他一些赠品作为奖励，说那是因为运气不好，中奖了，但其作用同算法控制的机器是一样的，依然是为了让顾客继续玩下去。文章里说的，这些人只是帮幸运设计幸运，让玩家看不投入进去的冰山一角，但也很触目惊心的。\n\
    \n克拉克斯还说，在人脑子里有一个处在核心位置的区域，叫纹状体，管理运动和奖赏，也是我们生存策略的重要器官，而这个区域还没有为学习而形成，所以它会不断地刺激纹状体，会导致上瘾行为。这也是为什么赌博很难戒除的原因。\n\
    \n我们知道了，赌场通过对幸运的设计，从赌客身上获利，是否会经常输钱，但如果把对幸运的设计，用在好的方面，又会怎么样呢？\n\n![](img/82c50821bc552fe72722a78212114e65_96_1.png)\n\
    \n## 好的“幸运设计”在哪？\n\n文章里说，好的幸运设计会让人产生一种公平感。\n\n你可能不知道，人类共需要的公平感，和现实世界的概率真相其实是同一回事，比如说，我们告诉一个人是一个游戏，他有1/3的概率会赢，那么，这个人期望游戏的结局是什么？答案，是这个人会期望玩三次至少会赢一次。\n\
    \n但从概率学上来说，根本不是这样。每一局获胜的概率都是1/3，意味着每次选择是概率都是66%，而且每局之间的结果都是不相关的，这个人才可能连续输10次，却一把都没想过，但普通人接受了这个逻辑时，如果这种游戏让玩家赢了10局，玩家会看到1/3的获胜概率，却连输10次，肯定不玩了，这就是对游戏设计师资力的考验了。\n\
    \n把幸运设计到游戏里，不只是要调整一些参数，增加游戏里的随机性，而是一个非常高难度的活儿。一方面，不能设计得太难，玩家一直赢不了，玩家大概率是要弃玩的；但另一方面，参考者感到自己是幸运的，所以一旦，设计与又不太简单，如果每次飞行都会带来好运，玩家很快就会发观规律，之后就觉得无聊了，就会弃玩，太轻松的游戏，同样留不住玩家。\n\
    \n这种情况被游戏设计师们称之为幸运谬论—lucky paradox，原 call lucky is fun，但 too lucky is unreal，意思是：是玩游戏，太走运就假了。跟真实世界相比，游戏的体验都非常重，要么，或者说让玩家感觉到自己很幸运，是关乎游戏成败的重要元素。设计游戏也体验到某种巧妙的平衡，所以必须在1/3的获胜概率，就必须的让玩家一次至少赢20%，这样的设计出来的游戏，才符合人类的公平感，游戏设计师能透过对幸运的公道设计，让不同水平的玩家能够一起享受游戏乐趣。\n\
    \n文章里举了一个例子，是一个纽约的游戏设计师，设计和国际象棋游戏“我们”。新手小时，高手和国际象棋本应玩得赢，新手只有能在地上狠狠摔棋盘的少年，高手也气得不停地跳。对于这个游戏设计，他写了一款叫Really\
    \ Bad Chess的国际象棋游戏，让双方开打的时候，棋子走随机走位，两个不同5小时，高手还是比新手多，这样就双方在不自不用的资源条件下博弈，高手也败得心服，最后所有人都不得过。\n\
    \n所以一个好的游戏设计，不只是让故事精彩，规则明晰，对于玩家心情的把控，规则的制定，都有着非常高要求。帕帕在文章里说，游戏向来是人与人真实世界的一种桥梁，幸运也可以被人为改造的，而在现实世界，幸运也都可以成为一个改善我们的生活体验，增加幸福感的重要工具。\n\
    \nLuck has become a design tool capable of changing our experiences and expectations.\n\
    \n这句话也是我们今天的主句。\n\n## 总结\n\n幸运是可以被人为设计的，坏的幸运设计，如同赌场，会让人上瘾、让人控制。而好的幸运设计，会让一个人进入开心的游戏，会让人们觉得公平，从而增加幸福感。\n\
    \n你觉得游戏里属于幸运的设计，能怎么迁移到我们的日常生活当中呢？\n\n欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n##\
    \ 彩蛋\n\n有这么一个故事，说的是北欧的国王奥拉夫二世想跟国王哈康·哈纳的国王在维京人的历史上写个故事，两个国王之间曾经发生了关于争夺领土的战争，他们互相在岛上放了一个空碗和一碗水，哈康·哈纳把水端走了，奥拉夫二世愤怒地在空碗上放了一个碗，结果哈康·哈纳又把空碗端走了，最后奥拉夫二世把两个碗都砸了，哈康·哈纳就笑了，说：你终于学会了放两个碗。\n\
    \n定用掷骰子的方式决定领土的归属。邻国的国王掷出两个6，跟奥拉夫三世说：“你别玩了，你不可能比我大。”但是奥拉夫三世在上帝的庇护下，掷出去的骰子，其中一个裂成了两半，结果变成了两个6和一个1，加起来13点，赢了邻国的国王。英语里把13比喻为“比幸运更幸运的事”，lucky\
    \ 13这个表达就是这么来的。\n\n## 划重点\n\n![](img/82c50821bc552fe72722a78212114e65_97_0.png)\n\
    \n## 资料来源：\n\n网站：\n- *How Designers Engineer Luck into Video Games, by Gregory\
    \ Laughlin, Nautilus, March 14, 2019*\n\n## 下期预告：\n\n明天的议题是#程序员的审美正改变世界？#\n\n\
    当今社会，程序员是一个很有特点的群体。他们经常被形容为木讷、思维古怪、不善沟通，审美也经常被吐槽。最新一期《连线》杂志解构了程序员的底层思维逻辑，并提出，程序员的审美取向伴随着新的科技浪潮，正在改变着世界。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_97_1.png)\n\n## 229篇结合程序员的审美正在改变世界！\n\
    \n### 今日分享：程序员的审美正在改变世界！\n\n程序员正在改变世界，“优化”是核心动力。他们追求高效、简洁、可扩展的解决方案，这深刻影响了科技、经济乃至文化。从代码到城市，他们的审美正在塑造一个更智能、更高效的未来。\n\
    \n## 【导语】\n\n### 当效率成为普世价值\n\n在当下社会，**“优化”** 是科技领域的核心语言。它不仅是程序员的信条，也日益渗透至商业、设计乃至生活哲学中。这种追求极致效率与逻辑清晰的思维模式，正以前所未有的广度重塑着世界的面貌。\n\
    \n## 【优化的本质是什么？】\n\n程序员优化，本质是**在给定约束下寻找最优解**。它不是消除限制，而是在限制内实现价值最大化。这种思维超越了代码，成为一种解决复杂问题的方法论。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_98_0.png)\n\n### 优化是权衡的艺术\n\n优化并非总追求“更多”或“更快”，而是**在多个目标间取得平衡**。速度、内存、可维护性、成本——往往需要在它们之间做取舍。这种权衡能力，是优秀工程师的核心素质。\n\
    \n### 从代码到世界\n\n优化思维正在外溢。从城市交通的智能调度，到供应链的精益管理，再到个性化学习路径的设计——**“效率”成为衡量价值的标尺**。这种转变既是机遇，也引发了关于人性化、公平性与可持续性的深刻讨论。\n\
    \n## 【程序员的审美如何定义？】\n\n程序员的审美，是**对逻辑、简洁与可扩展性的追求**。它体现在代码的每一行：清晰的命名、合理的抽象、优雅的算法。这不仅是技术美学，更是一种解决问题的哲学。\n\
    \n### 抽象是核心能力\n\n**抽象**是程序员应对复杂性的关键工具。通过隐藏细节、提炼本质，代码得以复用与组合。这种能力超越了编程，成为理解世界、构建系统的通用思维。\n\
    \n### 简洁与优雅\n\n“**能少一行代码，绝不多写一行。**” 简洁不仅是代码风格，更是一种价值观。它意味着清晰、可维护、易于理解。这种对简洁的追求，正在影响产品设计乃至商业模式。\n\
    \n### 可扩展性思维\n\n好的设计不仅解决当下问题，更为未来变化预留空间。**可扩展性**是程序员审美的另一维度，它体现为对不确定性的包容与对演进的预判。\n\
    \n## 【程序员的审美正在如何改变世界？】\n\n### 技术产品的重塑\n\n从移动应用背后的微服务架构，到云计算的弹性扩展——**以效率与规模为核心的设计哲学**，正在重新定义软件产品。用户体验、成本结构、商业模式，无不受其影响。\n\
    \n### 工作方式的变革\n\n**DevOps、敏捷开发**等理念，将“持续交付”与“快速迭代”推向核心。团队协作、项目管理的粒度更细、节奏更快，“小步快跑”成为新常态。\n\
    \n### 社会与文化的渗透\n\n“**数据驱动**”成为决策主流，“**A/B 测试**”进入市场营销，“**个性化**”重塑内容消费。程序员的思维模式，正在潜移默化地改变社会运行的底层逻辑。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_98_1.png)\n\n### 反思与未来\n\n追求极致效率，也需警惕其潜在风险：**“内卷”、短期主义、创新抑制**。未来，如何在效率与人性化、长期价值之间找到平衡，将是科技与社会共同面对的课题。\n\
    \n## 【结语】\n\n程序员的审美，远不止于代码。**它是一种以逻辑、简洁与可扩展性为核心，追求在约束下最优解的思维范式**。这种范式正在重塑技术产品、工作方式乃至社会文化。理解并善用这种审美，是把握未来科技脉搏的关键。\n\
    \n## **参考资料**\n\n- *Efficiency is Beautiful*，作者：Chris Crawford\n- *A Definition\
    \ of Computational Thinking*，来源：leantimes.com\n- *The Beauty of Simplicity*，来源：ACM\n\
