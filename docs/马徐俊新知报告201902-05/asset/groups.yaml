    # ！为什么波音737MAX事故不断？


    波音737MAX的事故之所以引发全球关注，不是因为没有人的机型...（此处省略大量段落，包括事故细节、飞行控制逻辑、MCAS系统缺陷等描述，直至“但反而更不安全。”）


    # ！波音和空客的竞争带来了什么？


    如果说激烈的市场竞争，会促使企业努力提高产品质量，这个比较容易理解，但为什...（此处省略关于波音空客竞争格局、双头垄断、1980年代市场情况、A300/B737对比、软件开发争议等段落）


    # ！航空业未来格局将如何变化？


    按照《经济学人》文章的观点，这次事故预计不会波音和空客以外的小型航空...（此处省略关于未来格局、双头垄断持续、中国市场需求的段落）'
  - '[PAGE 75]


    波音为了满足中国市场的需求，甚至还在浙江舟山，建了海外的第一个客机“完成及交付中心”，而空客在天津也有工厂。当生产工厂落地中国之后，飞机制造技术也会逐渐被中国吸收，最终，中国有可能出现新的顶尖飞机制造商，民航制造业被西方垄断的局面，将会被终结。


    # | 总结


    波音公司的两起航空事故，如果从技术层面来分析，是自动驾驶技术目前遇到的瓶颈，就是人机争夺控制权，反而降低安全性导致的；而从行业竞争的层面来看，是波音公司太急于应对空客的新机型挑战，反而降低了自己产品的品质造成的，而这将会给中国航空制造业，带来新的机会。


    最后我想说，得到用户应该经常听到一句话：竞争意识会削弱竞争力。波音公司的事故，不就是对这句话一个最新的案例补充吗？


