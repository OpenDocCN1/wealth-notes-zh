    《华尔街日报》的最新文章表示，全美有4500万人患有不同程度的心理疾病，每个人的临床反应虽不同，但他们都有一个共同点：使用智能手机。一些特定的手机APP可以收集人们的声音、表情和健康数据，做出分析，比如抑郁症患者笑容更没话，有自杀倾向的人用第一人称更多，有PTSD的男性挑眉毛动作更为频繁，这些APP可以辅助医生提前诊断抑郁症等精神疾病。


