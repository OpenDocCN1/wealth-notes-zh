    明天的议题是#人造肉会让世界变得更好么？#


    人造肉是这几年来全球最热的趋势之一，相关产品越来越多，也吸引了大量的风险投资进入。但《石英》杂志的一篇文章却说，人造肉所代表的细胞农业并不会让世界变得更好，因为它遵循的是和传统食品的工业化生产相同的逻辑，传统食品工业化生产会遇到什么问题，细胞农业也会重蹈覆辙。


