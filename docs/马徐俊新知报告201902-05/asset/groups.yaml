    \n我们为什么会觉得一个人、一道风景或一幅画很美？大脑究竟是怎样去处理这样的信息？《鹦鹉螺》最新发表了一篇文章，就从神经科学的角度探讨了这个问题。\n\n\
    ![](img/82c50821bc552fe72722a78212114e65_21_0.png)\n\n马未都·新知报告为你解析全球焦点议题，原稿可订阅App“新知”或公众号“新知报告”\n\
    \n# 192报告 | 你的艺术鉴赏力由什么决定？\n\n192报告：你的艺术鉴赏力由...\n\n## 今日报告：你的艺术鉴赏力由什么决定？\n\n用科学来研究艺术，不是为了揭开它艺术的神秘面纱，而是让你对“艺术为什么如此奇妙和神秘”有一个新的认识。\n\
    \n> 《鹦鹉螺》\n\n大多数有一整套理解美的生理机制，我们看到的艺术品，其实是“大脑进行二度创作”的结果。\n\n今天的议题分为两个部分：\n\n1.\
    \ 大脑的审美机制如何运作？\n2. 为什么说艺术鉴赏力的关键是阅历？\n\n有句话叫“一千个心中有一千个哈姆雷特”，意思是面对同一件艺术品时，每个人的感受、体验都不差万别的。我们都知道，每个人的艺术鉴赏力水平都不一样，但你有没有想过，一个人的艺术鉴赏力，到底是由什么决定的呢？\n\
    \n最新一期《鹦鹉螺》杂志的文章，从神经科学的角度回应了这个问题：其实大脑有一整套理解美的生理机制，我们看到的艺术品，是大脑经过复杂的拆分、解构、重组的结果，大脑进行的“二度创作”的能力，与我们每个人的理解力、记忆力、阅历息息相关，是它们共同决定了我们的艺术鉴赏力。\n\
    \n文章还说，用科学来研究艺术，目的不是为了揭开它的神秘面纱，而是让你对“艺术为什么如此奇妙和神秘”有一个新的认识。\n\n> The purpose of\
    \ a scientific approach to art is not to take the mystery out of the art. It's\
    \ to give you new insight into why you think it's so wonderful and mysterious.\n\
    \n这句话，也被我选为今天的金句。\n\n![](img/82c50821bc552fe72722a78212114e65_22_0.png)\n\n##\
    \ 大脑的审美机制如何运作？\n\n一般认为，人们对艺术和科学就好比硬币的两面，各行其道、互不相关。但是，《鹦鹉螺》的这篇文章告诉我们，如果从科学的角度来解释，人们审美的机制其实是有序可循的。\n\
    \n文章说，根据神经科学的研究，审美在大脑中其实是有生物学基础的。我们大脑有一套认知处理系统，而这套系统里也有一套机制来处理审美这件事，而且这套机制还挺复杂的。为什么它这么复杂？因为在大脑的大部分，并没有一个专门的区域负责审美，而是要由整个系统参与，大脑需要调用各个部分进行协同工作。\n\
    \n咱们来具体说说这套机制。这个机制分为两个步骤，第一步是自下而上的“解构”过程，第二步是自上而下的“重组”过程。\n\n就拿我们欣赏一幅画来举例吧。首先，眼睛的晶状体会把这幅画的二维图像，投射到视网膜上，然后视网膜细胞图像传着神经径，就像信息转换成电脉冲信号，传到丘脑，丘脑再把这些回路，传递给初级视觉区，最后初级视觉区，再把这些回路分布到各自的目的地，比如负责精怪的杏仁核，帮助记忆的海马体，和控制整体运动的大脑皮层。\n\
    \n这是审美的第一个步骤，也被叫做“自下而上”的过程。\n\n简单来讲，这个过程就是把图像信息拆解成分散的神经回路，随后这些神经回再被传输到大脑的各个区域。这就好比我们把模型拆开成一个个零件，而这些零备件的回路会被分配到各个车间进行加工。\n\
    \n不过，这些神经回路被拆解开，就变的杂乱无章了，因此还需要一个整合和重组的过程。下面我们来审美的第二步“自上而下”的过程。\n\n这个过程由大脑中的前额叶皮层来指挥完成，它会让分散的神经回路重新整合，并结合我们真正看到的面。不过，注意了，大脑对画面的重组方式，和拍照的原则完全不一样，在这个过程中，最关键的，是前额叶皮层在中心会先将脑内自先与不相关的细节、抽象先人先、景致实物的内容，从大脑记忆中取，搜索相关的内容进行扩展和联想，用自己的理解重新建构出画面的细节，最后，创造出一个完整的图像——也就是我们看到的图像，如果说，我们看到的图像，其实是被我们的大脑加工和“解读”过的，跟原想不一样。\n\
    \n这个步骤很有意思，你可能也知道，审美是二度创作的过程，但《鹦鹉螺》的文章里，相当于是给我们画了一张大脑的施工流程图，让我们从神经科学的视角，清楚地了解到二度创作的生产机制。现在大家应该能理解了，为什么人们常说“一千个心中会有一千个哈姆雷特”了吧。理解了大脑的审美机制，还只是第一步，为什么大家说起决定性的关键因素，那就是阅历。\n"
  mdcn: "\n# 总结\n\n这一步最重要，对我们来说也最难。\n\n你可能也有过这样的体验——如果起得够早的话，一上午能做的事情，比过去几天干的都多。早起固然是好事，但问题是，现在大多数人都是起床困难户，怎么能让自己早起呢？\n\
    \n首先，一天晚上你必须休息得足够好。不要指望自己前一天晚上刷手机刷到十二点，第二天还能在五点钟像生龙活虎地醒过来。\n\n其次，在起居环境上，你也可以花一些小心思来帮助自己清醒，比如说在手机上设置闹钟；把手机放远点，让你不得不下床来关闹钟；另外建议你，还可以洗一个60秒的冷水澡。美国顶级战略家、潜能开发者托尼·罗宾斯（Tony\
    \ Robbins）每天起床后第一件事，就是跳进14摄氏度的游泳池里泡一下，这么做既能增强免疫力，还能促进你的精神健康。据研究显示，在接触冷水的一瞬间，冰冷的感觉会激发身体释放提升情绪的化学物质，让你感到快乐。\n\
    \n起床后，你需要先安静下来，与未来生活连接。这是什么意思呢？哈迪说，你需要通过在大脑中想象，或者写晨间日记的方式，给自己积极的暗示。\n\n看到这，你会不会觉得有些鸡汤？还真不是。有一个心理学现象叫做“自证预言”，它指的是我们总会在不经意间让自己的预言变成现实，你怎么“预言”局面，局面就会怎么发展。\n\
