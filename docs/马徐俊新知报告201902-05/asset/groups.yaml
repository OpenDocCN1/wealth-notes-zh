    8, 2019

    *The Impact of Education on Declining Birth Rates, by Jennifer Le Grassa, The
    Silhouette, March 8, 2017

    *Rise in Size of African Families May be Tied to Less Schooling, by Jocelyn Kaiser,
    February 4, 2019

    *The Impact of Mothers Education on Fertility in Ghana, by Sulemana Abdul-Salam,
    Shei Sayibu Baba, Haruna Jabir, International Journal of Probability and Statistics,
    July 2, 2018


