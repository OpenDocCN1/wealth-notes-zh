    \n在明天的专栏里，我给你写了一封信，注意查收哦，再会！\n\n![](img/82c50821bc552fe72722a78212114e65_164_1.png)\n\
    \n## 请收信！感谢你这一年的同行\n\n![](img/82c50821bc552fe72722a78212114e65_165_0.png)\n\n\
    读者，你好\n\n我们是彼此相伴了一年的朋友，我用音频跟你交流，你用收听和留言跟我互动。\n\n专栏结束了，还有些话想对你说，我都写在了这里。\n\n一共是三件事。\n\
    \n第一件事。你可能还记得，尤瓦尔·赫拉利在《未来简史》里的预言，他说，算法的出现，会把人类一分为二，一部分是掌握算法的神人，另一部分是被算法掌控的无用阶级。\n\
    \n其实，在我看来，技术把人类一分为二的情况，早就已经发生了，这项技术就是文字，书本。经过这技术的进击，它记录下了人类文明最宝贵的财富——知识。\n\n而知识却如同一头来自远古的巨兽，栖息在人类的世界。有的人被它吞入腹中，有的人靠上它的脊背，驾驭着它乘风破浪。但无论你是否意识到了，但事实是，唯有知识才能让我们免于平庸。\n\
    \n第二件事。跟罗振宇老师聊天，听他提的最多的一词，是“手艺”。三年前刚开始做专栏的时候，我天天画点，不管是写东西嘛，写会写，很多人也会写，而且写得还不错，关键在得到开专栏，就是手工艺了，呢？\n\
    \n直到有一天，我跟一个做收藏的朋友聊天，他指着桌上我看起来毫不起眼的两块玉石，斩钉截铁地说，稍大一点的就是正宗的和田玉石籽料，而小的一点就是假的。\n\n\
    我好奇，问，你这眼睛就这么准？他回答我，这块玉石的密度大，跟你说清楚很难，但是，玉我研究十多年了，这就是我的手艺。\n\n那一刻我忽然明白了，到底什么是罗老师说的“手艺”，其实就是——他用生命和血写出来的高墙，每天它挡住这道生砖一砖一砖，假以时日，都是别人仰望的神迹。\n\
    \n专栏作家很多，日更的专栏作家，按微博有，但作品被拿来写作的日更专栏作家非常稀有。都是凡人，谁还没有写不出、写不动、找不到东西可写的时候？\n\n这三年里，这样的状况我碰到了不知道多少次，但只要想到再写一点，多写一点，就会再多一点，这门“手艺”就会被打磨得再锋利一些，也就咬着牙继续写下去。\n\
    \n其实生活不可能像小说和影视作品写的那样，有什么灵气突现的顿悟时刻，或者突然获得任督二脉。所有的进步，都是一条平滑的上升曲线，你说不清到底什么时刻，就进入了另一个境界的临界点。但聪明人的雄心壮志，应该体现在日复一日的生活中。\n\
    \n当你的“手艺”到了的时候，你自然就会知道了。\n\n第三件事。在一次跨年演讲里，罗振宇老师讲了一个概念，叫“国民总时间”。时间是不可售卖的，对每个人都公平。现在无论是淘宝、还是抖音，或者是美国的奈飞、亚马逊，本质上都是在抢夺国民总时间。\n\
    \n因为时间这个东西，你在一个地方用得多一点，在另一个地方必然就花得少一点，我们要把时间花在刀刃上。\n\n但这还不够。过去的大半年，我发现比时间更宝贵的，其实是人的注意力。跟时间一样，注意力也是不可再生的。今天用完，也带不到明天去。但不一样的是，注意力的时间更难以争取和分配，老板可以买断你的时间，让写996加加班，但也可以买断注意力的资源，你依然可以出力不出力，上就干净利落。\n\
    \n哪怕是把自己包围在书桌前，逼自己一天8小时的学习，如果你的注意力不在上面，效果一定不会好。而不夸张地说，我们所关注的东西，决定了我们的人生。\n\n科幻作家史特金曾经提出过，“史特金定理”（Sturgeon’s\
    \ Law），他认为，任何一个个领域中，只有10%的东西值得关注，音乐、电影、文学作品，都是如此。\n\n（其实原意是：任何事物，其中90%都是垃圾。）\n\
    \n我们的时间有限，不要在糟糕的东西上浪费掉。那么我们应该怎么判断，一个东西是好的，还是糟糕的呢？\n\n我认为，好的作品和内容，会自然锁定你的注意力，特别是在知识领域的作品中。\n\
    \n注意是看还是文文字，让你读着读着就分神了，读着读着就读不下去了，大概率来说，不会是特别值得关注的内容。\n\n## 新知目录 | 全年商业议题\n\n\
    马徐骏 · 新知报告\n\n### 马徐骏\n\n从今天开始，我将和你一起复盘「新知报告」整整一年的内容。\n\n为了帮你快速定位到感兴趣的话题，最有效地进入学习状态，我们为你整合了商业、经济、科技、政治、文化、自管理、教育、心理、健康等各大领域的所有内容，并做成了目录。点击链接即可跳转到相关推荐内容，你也可以作为专栏内的索引工具来使用。\n\
    \n今天，我为你复盘的是全年的商业议题。它包括：\n\n- 22个最受关注的行业前沿趋势与分析；\n- 12家企业的机遇与困境、经验与教训；\n- 3位商业风云人物的故事与梦想；\n\
    - 9个非常有用的商业实战锦囊\n\n本期复盘一次性放送46个议题，建议你先点击收藏。\n\n### 行业前沿\n\n**004报告 | 传统物流行业如何被改变？**\n\
    \n国际航运不仅效率低，改革动力还重重。对于传统物流行业的变局改革，不在于国际物流行业本身，而是来自于电商巨头。\n\n**261报告 | 电子竞技来了**\n\
    \n《经济学人》指出，从长远来看，科技与银行业的融合必然成为大趋势，这将带来银行提高效率、服务大众、资金分配效率的大幅提升。未来，大规模现代数字银行，将会重塑普通人的生活习惯和消费理念。\n\
    \n### 企业观察\n\n**022报告 | 任天堂屹立130年的成功之道**\n\n任天堂公司作为创立了一个130年的老牌企业，在经历了近10年的低谷销售，再度攀升，已经成功的换代在不断调整自己，以适应人民在不同时代的娱乐需求。\n\
    \n**019报告 “硅谷坏血骗局”的启示**\n\n“坏血骗局”在美国横行十多年，揭示了硅谷风险投资中的重大问题：过于依赖关系网、社会对赌注的态度迷题。\n\
    \n**032报告 | 奈·宗经济学**\n\n《经济学人》杂志专门提出了一个新概念，叫做“奈·宗经济学”（Nettliomics）），它是指一种让用户在网上订购视频的内容。它像“奈·宗经济学”的精髓有两条两点：海量内容、利用大数据精准定位用户的喜好和需求。\n\
    \n**046报告 | 百乐思决定阻击亚马逊的启示**\n\n在亚马逊的冲击下，传统电器零售巨头百乐思一度跌进死局，最后却奇绝地起死回生，从亚马逊手里抢回了顾客。总的来看，百乐思主要做到了三件事：解决展厅困境，对实体店进行电商化改造，全力提升消费者的体验。\n\
    \n**072报告 | 哈雷摩托的时代困境**\n\n哈雷摩托在这个全球化的时代，陷入了品牌危机，想要摆脱曾经的精神和海外市场，又受到自己所有新的年轻象征。如果咆哮的老狼，变成了温顺的小绵羊，哈雷迷还会是哈雷吗？\n\
    \n**257报告 | 波音空难的罪魁祸首节约成本？**\n\n《彭博商业周刊》指出，波音两起空难的事故线索中，各个关键项面初和过程约成本直接关系。百年一贯重视且品质著称的波音，正在挑剔自己的优良传统，给自己的品牌声誉带来了难以弥补的重创。\n\
    \n**101报告 | 迪士尼如何登顶《时代周刊》“最具创造力公司”榜？**\n\n《时代周刊》首次推出了“全球50家最具创造力公司”榜单，用最大的篇幅主推了迪士尼。作为一家老百号的，迪士尼凭其产品的创新、商业模式上的自我颠覆，打败众多高科技公司，成为了2018年最具想象力的公司之首。\n\
    \n**106报告 | 一百年前的“亚马逊”留下了什么教训？**\n\n拥有百年历史的美国零售商西尔斯破产了。《货币制造者》的作者德里克·汤姆森认为，从商业发展轨迹来看，亚马逊如今走的，就是西尔斯的旧路。如何避免重蹈覆辙？汤姆森给于亚马逊三条非常重要的建议。\n\
    \n**117报告 | 为什么说海尔重新发明了管理？**\n\n《哈佛商业评论》最新一期封面文章，详细介绍了中国的老牌家电厂商海尔，认为海尔的“小微模式”很好地解决了大企业的官僚化问题。\n\
    \n**191报告 | 宜室家具的转变型了吗？**\n\n《经济学人》杂志报道，宜家在伦敦中心的闹市区开了一家仅有50平方米的新店，而且支持线上下单，未来，类似的店铺将会进入巴黎、北京等30多个大城市的市中心铺陈。宜家为什么要这么做？答案是，为了在竞争环境中生存下来。\n\
    \n**207报告 | 巴菲特看好的3G资本做错了什么？**\n\n近年来，卡夫亨氏、百威啤酒、汉堡王这些西方传统食品巨头，都出现了巨大的营收危机。《经济学人》用三篇分额的篇幅，分析了它们倒闭下市值大跌、份额缩减的原因，事实上，它们背后的3G资本的贪婪策略露出了问题。\n\
    \n**217报告 | 波士顿飞机事故的启示**\n\n波音737MAX的事故之所以引发全球关注，是因为无人能听那个来原看：这是一种一个不应出现的问题的机票。坠机事故揭示了三大问题：全球最畅销的波音737设计早已过时、自化驾驶技术远未成熟，“双头垄断”格局带来了飞机质量的下降。\n\
    \n**198报告 | 福特如何创造未来汽车行业的“第三选择”**\n\n美国老牌汽车企业福特，正在探索汽车行业的第三种发展方向——从用户体验到方案。为此，福特高管还将重新执行了出身的吉姆·哈克来担任CEO，哈克将要求设计团队不再设计汽车作为产品，而是要设计成手机等电子消费品的一种延伸。\n\
    \n**238报告 | 亚马逊的自我优化算法**\n\n亚马逊的发展太离不了算法，比如产品推荐算法、语音识别算法，定义并训练算法等是。但《经济学人》提出，对亚马逊影响最大的是，它是进行自我优化的算法，包括经营内的评估系统、线下无人的商店的优化站等，都是它亚马逊的商业成功起到关键作用。\n\
    \n**249报告 | YouTube的内容困局**\n\n《经济学人》指出，视频网站YouTube面临着严重内容失控问题，用户和自主上的海量内容，让YouTube的、用户从源头上无法做到及时雨和内容的监管，事实上从根本上来看，是YouTube靠售卖采集广告的盈利模式，决定了今天这场无可避免的内容困局。\n\
    \n### 风云人物\n\n**042报告 | 埃隆·马斯克的第三次all-in时刻**\n\n2018年最惨的三个月，对马斯克来说，是一次地狱级的经阴。新Model\
    \ 3电动车的质量严重不足，每个季度都要烧掉10亿美金，特斯拉进入了总动员状态，就像是在打一场战争。难道做电动车的真比造火箭还难？\n\n**123报告 |\
    \ 《哈佛商业评论》全球最佳CEO榜单解读**\n\n2018年《哈佛商业评论》全球最佳榜首的CEO，平均任职时间为16年，平均年龄44岁。《哈佛商业评论》认为，拥有较长的任职时间，坚持长期化的CEO，能够持续地带领公司克服困难，一路保持增长势头。\n\
    \n**177报告 | 孙正义如何实现自己的“奇点”愿景？**\n\n孙正义被称为“日本投资界的巴菲特”，他这几年最大的动作，就是围绕“奇点理论”，发起了1000亿美级别“愿景基金”。《时代》杂志关注孙正义的投资图图，揭示了孙正义怎样通过“愿景基金”，来打通四个投资板块，一步一步走向他构想的“万物互联”时代。\n\
    \n### 商业技术\n\n**125报告 | 如何用“提高用户忠诚度”做强大公司**\n\n《财富》杂志的Future 50榜单，评出了未来最具潜力的50家公司，创业公司Workday因“极高的用户忠诚度”名列榜首，Workday的成长有有两个：“远超用户预期的产品更新速度”和“全天候的服务能力”。\n\
    \n**132报告 | 播客如何靠“讲好故事”翻身？**\n\n在美国，播客是一个庞大的产业。但在2014年之前，播客在西方市场惨淡，节目不多，也没几个听众，开始规模就很小。直到一档叫《Serial》的节目出现，才引爆了整个播客行业，这是因为，《Serial》打造了一种全新的叙事手法。\n\
    \n**140报告 | “零工时代”的游戏化管理**\n\n随着“零工时代”的到来，如何能对“零工”从业者进行约束和管理，他们投入更多的时间和精力，创造更大的利润？美国的游戏化平台Lyft给出了一个好办法：利用游戏化的管理手段，不仅大大提升了用户的积极性，甚至让他们对工作“上瘾”。\n\
    \n**142报告 | 摇滚乐队能给企业管理带来什么启示？**\n\n顶级摇滚乐队之所以成功，背后都有各自独特的管理思路和运作模式，作为管理者，《1843》杂志深入分析了滚石、披头士等4支顶级摇滚乐队的管理模式。从他们身上，企业管理者可以得到许多启示。\n\
    \n**145报告 | 领英创始人的“反常识”创业方法论**\n\n领英创始人里德·霍夫曼在他的新书《闪电式扩张》中分享了如何成为行业巨头的第一\n"
