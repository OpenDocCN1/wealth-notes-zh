    \n# 188报告 | 失去“视觉想象力”该怎么办?\n\n**今日报告：失去“视觉想象力”该怎么办?**\n\n就算没有 “视觉化” 的辅助, 人们还是可以充满创造力和想象力。\n\
    \n> ——《BBC聚焦》\n\n**马徐俊**\n\n最新一期的《BBC聚焦》关注了近两 年以来科学研究的一个新领域——视觉想象力的障碍, 患者无法在脑海中想象苹果的甜味或颜色，甚至想不起家人\
    \ 的长 相，这到底是 怎么回事？有什 么样的解决办法?\n\n今天的议题分为三个部分:\n\n- “视觉想象力障碍”是什么 样的体验?\n- 是什么造成了视觉想象力障碍?\n\
    - 如何应对视觉想象力障碍?\n\n先请你想象一个苹果。好，现在在想象中切开苹果、转 向它然后，想象它在你咬 了一口 的样子— 怎么样，能做到吧？这就是 “视觉想象力”。\n\
    \n视觉想象力是人类最有用的能力之 一，爱因斯坦依赖视觉想象力，才能在脑中 做那些复杂的 “思想实验”，想想目光和 时间的关系；综艺节目《最强大脑》里的那些记忆大师，也要靠视觉想象力才记得\
    \ 大量复杂的信息。\n\n那么，假如人类失去了视觉想象力，会 变成什么样呢，还能思考和创造吗？其实不用假设，我要告诉你的事，在这个世界上，真有一部分人是\
    \ 没有视觉想象力的，这也是神经科学家最近几年才 发现的一种新的病症，叫 视觉想象力 障碍 症(Aphantasia)。\n\n最新一期的《BBC聚焦》杂志就采访了\
    \ 著名的行为和认知科学家亚当·泽曼(Adam Zeman)，他是英国布莱顿大 学的一位教授，目前也是该 领域的权威。泽曼教授说，不要觉得视觉想象力 障碍很罕见，他预测，有2%的人\
    \ 在生不同的程度患 有视觉想象力障碍—这些人 怎么也无法想象出苹果的样子。他们的头脑里没有 任何画面。\n\n目前，神经科学家正在试图揭开视觉想象力障碍的成因。他们通过脑部扫描发现，视觉想象力障碍的成因，很可能都是大脑中负责\
    \ “视觉化” 的神经网络出了问题。不过，就完全失去 视觉想象力而言，人们还是可以找到一些替代方式，来避免彻底失去 思考能力和创造力。\n\n文章里有句话：就算没有\
    \ “视觉化” 的辅助，人们还是可以充满创造力和想象力。\n\n> It's perfectly possible to be creative and imaginative\
    \ without visualization.\n\n这句话，也是今天的金句。\n\n![](img/82c50821bc552fe72722a78212114e65_14_0.png)\n\
    \n## “视觉想象力障碍”是一种什么体验?\n\n英语 中有个说法叫Mind's Eye，翻译 来叫 “心灵之眼”，就是指人们可以在脑中通过幻象来观事物。如果有人说你\
    \ 有视觉想象力障碍， 那最直观的结果就是， 你 没有在脑海中构建任何画面。你 的“心灵之眼”是盲的。\n\n这是一种什么体验呢？在英国兰开斯特，有个叫尼尔·肯德尔的人，\
    \ 就有视觉想象力障碍。他 在自述中说，小时候看医 生 就喊他，“ 在脑海中数数 5” ，结果他完全做不 到。他 脑海中，压根就想象不出任何关于栅栏 的场景，所以也没什\
    \ 么 可以解释。\n\n还有一位视觉想象力 障碍者叫吉尔·摩根。有一次她参加一个培训班，老师在课堂 上 说，“ 请大家都想象一幅当日的 风景画。 \" 可以想象\
    \ 一天的画。当天晚上，她在酒吧里跟朋友 吐槽，结果朋友 说， “想象画面？这不很 容易嘛！\" 这话 轮到吉尔了，她这才发现自己和别人 不一样。\n\n\
    不过，真正的困扰，是无法想起人脸。吉尔·摩根说，她 是最想拥有视觉想象力的，因为她在母 世之后，其他人 自己的 记忆中，脑海中都会浮现出他们 的名 字，记忆中的画面\
    \ 就像录像 一样一 幅幅闪过。但是吉尔做不到，想念念父母 的时候，只能看到， 让她非常难过。\n\n这就是视觉想象力障碍者真实的生活体 验，可一旦意识到人们\
    \ 竟然不知道这样 的存在，是先 发现了他们的呢？就是英国 埃克塞特大学的亚当·泽曼 教授。他最 早注意到视觉想象力 障碍，是 他的一位患者 声， 自从做了心脏手术之后，脑中再也不\
    \ 有画面了。泽曼教授很 感兴趣，就开始了研究。\n\n他 查找了 不少历史 文献，发现几乎没有 关于“ 视觉能力 缺乏” 的记载。于是， 2015年，泽曼教授先\
    \ 先没设想 起了 个 名字，叫 “Aphantasia”。 这种叫， 媒体 报道后，陆续有 20个 者主动 系 他们，说自己也有 类似 情 况。只 过去，\
    \ 天 已经 到了 300 多 人。到 前为止，泽曼 授所掌握的视觉想象力 障碍者数量 已经 到了12000 名。\n\n他 估计，视觉想象力 障碍者的数量\
    \ 可 占 人口 的2%。这个 比例不 小。\n\n## 是什么造 成了 视觉 想象力障碍?\n\n通过对 患 视觉 想象力 障碍者进 行脑部 描， 发现\
    \ 这些人 想要 想象 某 的 时候，负 责视 觉 化功能 的脑 区 是不 的。\n\n这 神经 区域，并 不是 一个 独 的， 而是 网 络。 在 中，\
    \ 有 级 层， 有 负责面 识别 的 区， 有 管 理体 块的 区 和 皮 层， 有 主管 记 视 觉 体的 内侧 区。 这 一 下， 把 这个 比 一\
    \ 脑， 主 存、 和 能 分部 组成， 这 部 区 都 有 立 的 功 能， 只 有 合 在 起 共 动， 才 能 大 中 “ 学 幻 觉 ” 。 于 无法\
    \ 处 进 幻 觉 ， 他 神 区 中 个 区 的 联 了 题， 计 算 机， 它 主 板 是 卡 的 了 ， 就 其 功 出 题， 整 也 用 了 。\n\
    \n目 来 ， 视 觉 想象力 障 碍 有 先 天 的 ， 也 有 后 天 形 的 。 对 于 那 些 因 心 脏 手 术 后 就 失 了 幻 想 能 力\
    \ 的 者 很 可 在 手 过程 中 ， 他 的 区 过 了 儿 小 中 风 ， 导 负 责 视 觉 化 的 神 网 了 题 。\n\n如果 是 天生 就\
    \ 没有 视 想象力 ， 成 就 复 杂 了 ， 科学 目 前 没 找 到 解 法 。 发 现 ， 视 想象力 障 者 身 的 近 亲 ， 有 视 想象力\
    \ 障 的 几 很 。 如 父母 、 兄 弟 姐 妹 或 孩 子 ， 患 有 视 想象力 障 的 几 也 很 。\n\n此 外 ， 科学 家 还 发 了一\
    \ 现 象 ， 视 想象力 障 有 一 个 双 ， 一 端 视 想象力 障 ， 还 有 一部 人 于 个 极 点 ， 他 拥 有 “ 视 想象力 \" 。\
    \ 意 想 ？ 就 是 说 ， 这 人 脑 中 想 的 过 于 细 想 ， 甚 连 他 自 都 不 实 是 还 是 想 的 。\n\n有 个 叫 克 尔 ·\
    \ 杜 的 艺 家 就 拥 有 视 想象力 。 她 说 ， 如果 向 她 讲 一 场 画 片 的 事 ， 她 会 成 发 自 上 。 在 读 的 时 候 ，\
    \ 更 是 个 描 写得 很 情 和 想 象 中 的 面 自 打 耳 过 。 不 过 ， 她 和 视 想象力 障 者 一 样 ， 拥 有 “ 视 想象力 \"\
    \ 的 人 ， 也 于 数 情 况 。\n\n那 么 ， 对 于 那 些 不 幸 患 视 想象力 障 者 说 ， 没 有 办 法 弥补 这 欠 呢 ?\n\n\
    ![](img/82c50821bc552fe72722a78212114e65_14_1.png)\n\n## 如何弥补视觉想象力的欠缺?\n\n科学家惊讶地发现，失去视觉想象力的人，其实可以像普通人一样进行思考、想象和创造。他们的秘诀，是扬长避短，找到其他的代偿方式。\n\
    \n就拿记忆能力来说，我们知道，很多记忆技巧都要运用到视觉想象。比如要记住一长串电话号码，记忆高手都要把这组号码想象成具体的图像，这样才能记住。视觉想象力障碍者没办法用视觉想象来进行记忆，但是他们会用文字和符号来代替。我们通常说“好记性不如烂笔头”，其实也是同样道理。一些人还说，自己虽然视觉想象力**缺失**，但是有听觉想象力和嗅觉想象力，他们可以在脑中幻想声音和气味，用这种方式来展开联想，进行记忆和创造。\n\
    \n科学家还发现了一个有意思的趋势：视觉想象力障碍者有不少都在从事学术和计算机相关的职业。可能在这些领域，我们更能规避视觉想象力缺失所带来的劣势。美国著名的基因科学家、被称为“人造生命之父”的克雷格·文特尔（Craig\
    \ Venter）就有视觉想象力障碍。他说，失去了视觉想象力，反而让自己可以不受干扰，集中精力思考科学问题。\n\n艺术领域也有视觉想象力障碍者的身影。这些艺术家虽然无法在脑中用画面来想象，但是他们会直接描摹眼前看到的情景，或者把图片或照片摆在旁边，作为创作的灵感来源。\n\
    \n这些例子都说明，失去视觉想象力并不可怕。你看，之所以大众此前一直没发现“视觉想象力障碍”这种现象的存在，正是因为，这虽然是一个挺严重的问题，但仍然可以找到解决办法。\n\
    \n## 总结\n\n视觉想象力是人类最强大的能力之一，人类历史上很多伟大的发明创造，都离不开它的辅助。但听完今天的报告，你就知道，这世界上还有一部分人是没有视觉想象力的。他们没有办法在脑海中想象蓝天、白云和青草，甚至连回想自己亲人的长相也做不到。\n\
    \n视觉想象力障碍既有先天的，也有后天外力形成的，但无论哪种，原因可能都是大脑中负责“视觉化”的神经网络出了问题。不过，失去视觉想象力，并不会让人就此丧失思考能力和创造力，他们会用其他方式，代偿缺失的“心灵之眼”。\n\
    \n视觉想象力障碍者的存在，也让我们意识到，或许每个人感知世界的方式都是不同的。就算没有视觉想象力，人生一样可以“不设限”。连康复**科**教授都表示，视觉想象力障碍不需要治疗，也不是疾病，它只是一种与众不同的人生体验。\n\
    \n通过今天的内容，让我们不妨来重新思考优势和劣势，只有在具体的场景中，才会有所谓优势和弱点的分别，而哪怕我们确实不具备某种场景优势，依然有其他的替代方法来扬长避短，我们需要做的，是努力找到这种方法。\n\
    \n在平时的生活和工作中，你会经常运用自己的视觉想象力吗？都会在什么时候用？\n\n欢迎留言告诉我，也欢迎你**把**今天的内容转发给自己的朋友们。\n\n\
    ## 划重点\n\n### 今日得到：\n\n- “视觉想象力障碍”指的是一种认知障碍，患者无法在头脑中构建任何画面，比如无法想象一个苹果、一幅落日的景象，甚至连亲人的长相也想不起来，这很可能是因为他们的脑部神经网络的连接出了问题。\n\
