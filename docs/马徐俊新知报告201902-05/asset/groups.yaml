    - 智能纹身比一般的智能可穿戴产品更轻薄、更便携，它还是一种将美学与科技结合起来的全新产品，很可能成为人们表达健康理念与审美趣味的**新阵地**。

    - 纹身在年轻人当中非常受欢迎，将近40%的千禧一代至少有一个永久性纹身，这意味着智能纹身市场的基数是相当可观的。


