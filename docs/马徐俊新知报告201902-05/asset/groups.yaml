    # # 186报告｜教育为什么会致生育率下降？


    186报告 | 教育为什么会导致生育率下降...


    # 今日报告：教育为什么会导致生育率下降？


    由于教育因素的影响，全球生育率下降的速度，可能快于联合国的预期。


    ——《经济学人》


    马修银


    《经济学人》认为，决定一个国家生育率的主要因素，是教育水平。


    今天的议题分为两个部分：


    +   1. 为什么教育会影响生育率？

    2. 未来的生育率会比预期的更低


    人口负增长，是长期困扰着很多发达国家的问题，如今正在变成一个全球化的问题。而中国在当前老成化的问题也日趋严重。这也是为什么欧洲国家会接收那么多难民，机会生育都低于老龄化，主要原因。一直以来，生育率低于2.1，人口数量就会减少增长。根据最新的数据，中等收入国家的生育率是2.3，而发达国家的平均生育率只有1.7。


    对于这种富裕国家的人不爱生孩子的现象，我们一般会归为认经济的禁欲程度有关。因为，通常在经济状况比较好的国家，避孕措施相对比较到位，女性地位一般会比高，这样女孩子对于生育这件事就有更多的话语权和自主权。


    不过《经济学人》对这个看法，最近《经济学人》杂志最新刊登了一篇社评文章，叫《A school for small families》，给出了另外的一个观点，那就是决定一个国家生育率最大的因素，是教育。


    文章里说道，由于教育，全球生育率下降的速度可能快于联合国的预期。


    ```

    Thanks to education, global fertility could fall faster than the UN expects.

    ```


    这句话也是我们今天的金句


    下面我们来详细说说，教育究竟是如何影响生育率的？未来的人口趋势会是什么样的？


    ![](img/82c50821bc552fe72722a78212114e65_10_0.png)


    # ## 1 为什么教育会影响生育率？


    关于这个问题，《经济学人》给出了三个原因：首先，教育推迟结婚缩短了女性生育的时间；其次，教育增加了养育子女的成本；最后，教育变成了人们自我实现的认知。我一个一个来说：


    首先，教育缩短了女性的生育时间。'
  - '[PAGE 11]


    随后会逐年下降，到2100年这个数据会下降到89亿，这可比联合国项目组预估的112亿少了差不多20%啊。可见教育对于生育率的影响有多大!


    # 总结


    影响生育率的因素有很多，比如：家庭收入、城市化水平等等。但是，其实最重要的因素是教育，因为教育推迟并缩短了女性生育的时间、增加了养育子女的成本，并且改变了人们对自我实现的认知。在未来，由于教育因素的放大，人口数量下降速度可能会比预计的更快。


    那知道了今天这篇内容，对我们有什么用呢？我认为教育和人口增长的关系，为我们看待所谓的“棘手问题”提供了一种新的思路。


    曾经人口的高速增长，是一个让全世界感到很头疼的问题，美国曾经有一份叫做《国家安全研究备忘录200号（NSSM-200）：世界人口增长对美国安全和海外利益的影响》的报告，试图通过降低第三世界国家生育率的方式，来控制世界人口。


    在半个世纪之前，我们还把庞大的人口视为一种负担和灾难，因为资源不足以供养急速增长的人口数量，但如今，当人口出现老龄化和负增长的时候，全世界又开始忧虑了，这不是精神分裂，而是为，如今我们进入了新的科技时代，人不但能够更好地发挥自己的创造力和天赋，还能产生对新世纪非常重要的资源，就是数据。人口众多的国家，反而会在在这方面更加有优势。


    一个事物到底是麻烦，还是机遇，既取决于有没有合适的科技和制度来匹配，也取决于我们看待它的视角和我们自身的想象力，人口问题就是一个典型。


    还有什么现象像人口问题一样，当你转换了视角、匹配了合适的技术之后，成为了新的资源呢？


