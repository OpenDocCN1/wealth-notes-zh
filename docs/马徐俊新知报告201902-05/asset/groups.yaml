    \n下周一的议题是 # 亚马逊如何用算法优化自己？#\n\n亚马逊的发展壮大离不开人工智能和算法，比如产品页推荐算法、语音识别算法、语义分析算法等等。但是《经济学人》提出，对亚马逊影响最大的，是它进行自我优化的算法，包括企业内的评估系统、线下无人商店的优化算法等等，它们对亚马逊的商业成功起到了关键作用。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_112_1.png)\n\n## 237报告 | 3D打印怎样改变博物馆?\n\
    \n马徐骏 · 新知报告\n\n今日早报：3D打印怎样重塑博物馆？\n\n3D打印让人们能够通过多感官体验来学习、欣赏文化遗产。\n\n> —The Conversation\n\
    \n“不温不酸”的规则，人们对博物馆的准品产生了很强的心理隔阂。博物馆方后来强调的，就是想必鼓励游客们多多触摸这些打印出来的“文物”。\n\n今天的议题分为两个部分：\n\
    \n- 1. 3D打印技术给博物馆带来了哪些改变？\n- 2. 为什么博物馆要使用3D打印技术？\n\n3D打印技术刚出现时，是个时髦的新事物，主流媒体对它非常看好，《经济学家》在2011年就说过，3D打印对世界的影响，可能和工业制造业的诞生一样深远。我们在这回看，可能会觉得这些评价有些言过其实，但不得不说，在过去的几年里，3D打印确实在很多方面取得了进步。\n\
    \n咱们在上一年专栏里就讲过，Adidas是如何利用3D打印技术来制作个性化运动鞋的。我们还讲过，医疗领域的研究者是如何把3D打印和生物材料结合在一起，打印出人体器官的。不过，有一个3D打印技术的应用领域，显然是最很快，你可想不到，这个领域居然还跟博物馆。\n\
    \n英国布莱斯特大学的两位学者最近发表了一篇论文，详细讲述了3D打印技术是如何改变博物馆的。结论从字面来看就是让参观者可以运用技术，把展览变成触摸，把单一的视觉体验，变成多感官、触摸、更丰富的体验，就这大大拉近了参观者和博物馆展品之间的距离。\n\
    \n今天的内容会分成两个部分，第一部分，我会给大家具体讲，3D打印技术到底让博物馆发生了哪些改变。第二部分，你会知道，为什么博物馆会使用3D打印技术。\n\n\
    ### 1 3D打印技术给博物馆带来了哪些改变？\n\n过去我们去看博物馆，总不能隔着封边的玻璃柜柜看文物，摸不得碰不得。这倒可以理解，文物珍贵而脆弱，如果人人都上手摸一摸，会自张自合，相信用不了多久，文物就报废了。\n\
    \n但有了3D打印技术，参观者不仅可以和文物近距离接触，甚至还能把文物“吃”下去。\n\n![](img/82c50821bc552fe72722a78212114e65_113_0.png)\n\
    \n我们先来给3D打印和3D技术。\n\n埃及政府给3D打印最大的例子，就是埃及政府向3D技术公司Fabcad，采购3D打印技术复制法老墓的墓室。图坦卡蒙是世界上著名的法老之一，他出名不是因为他有过多少伟大的政绩，而是因为他在位才3000年的时间，他的墓从未被盗掘者洗劫过。保存着相当完好。图坦卡蒙的墓非常豪华，从他墓室出土的黄金面具，已经成为了埃及文化的代表。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_113_1.png)\n\n图坦卡蒙在1922年被发现，到了上世纪九十年代，旅游业开始兴起，一批又一批游客来到埃及，参观这座古老的墓室。但当时的人缺乏完善的保护意识，当地政府或相关部门也不做限制，就让游客随心所欲地参观。\n\
    \n时间一长，法老墓室里不断变化的温度、湿度，让墓室开始塌陷，壁画也变霉斑。整个墓室的状态越来越差。后来，埃及政府开始限制游客，并探索其他方式来展示法老墓。他们找到的办法之一，就是3D打印技术。\n\
    \n埃及政府给这个项目委托给一家叫Fabcad的瑞士3D技术公司，这家公司擅长3D激光扫描技术、3D打印机及其相关设备。按Fabcad的原比例复制了墓室的结构和壁画，并复制了墓室内部的全部壁画。这个复制版有多逼真呢？这么说吧，研究法老墓的专家来看，都感觉惊叫和激动。现在很多参观这个墓室，不仅可以尽情欣赏图坦卡蒙墓里精美的壁画，还能进入到墓室内部自己探索。\n\
    \n美国自然博物馆也是个例子，利用3D打印技术，让学生像古生物学家一样学习和了解古生物。他们会有恐龙的模型，再让学生自己组装一只恐龙。有了这个过程，学生们对恐龙的认识就更具体和深入。\n\
    \n纽约的大都会艺术博物馆的步子迈得更大，他们使用巧克力、奶酪、大米这样的食材进行3D打印，参观者不仅能近距离接触文物，还觉得好吃，还能把这些“文物”吃到肚子里去。\n\
    \n可以看到，3D打印在改变了人们参观博物馆的形式，也在很大程度上提升了游客的游览体验。它让人们对文化遗产了解。但它的坏处在于什么？下面我具体给你讲一下。\n\
    \n### 为什么博物馆要使用3D打印技术？\n\n3D打印技术能为博物馆带来三大好处：首先，它极大地拉近了参观者和文物之间的距离，其次让它被精准地数字化，便于传播、复制；最后，它满足了不同人群的需求，让博物馆变得更富有人性化。\n\
    \n我们先来说第一点，3D打印极大地缩短了参观者和文物之间的距离。其实大多数博物馆一直都在做文物的复制品，但在种类、复制的精细度上都有不足。而3D打印能让我们所见即所得，不仅可以直观感受到文物的形状、材质、重量，甚至让你感受到文物本身的气息。这可以说是历史上人类和文物之间的最短距离了。\n\
    \n第二，3D打印的前，是对文物进行精准的3D扫描，可以非常精准地建立文物的3D模型，在全球范围内进行传播。这意味着，大量的文物古迹可以通过3D打印技术重获新生。\n\
    \n今年1月，谷歌艺术和文化研究所和美国3D打印制造公司Stratasys联合宣布，他们将通过3D打印技术，复制博物馆及世界各类文物古迹的样本，让这些珍贵的文物被全世界更多人看到。\n\
    \n对于个人而言，3D打印，也会给你的生活带来很大的变化。比如你想带你家的小孩了解一个大文物，不一定是带他/她去博物馆，而是利用3D打印机，在家打印出复制的文物。当然，你也不能买博物馆的文物纪念品。你可以在家就下载文物的图纸，利用3D打印机，自己直接打印出来。\n\
    \n对于那些身体有障碍的特异人群来说，3D打印技术让他们感受到更精采的世界。比如说，有视力障碍的人原本不可能去博物馆，根本没办法直观感知到和对手触摸文物的保护。博物馆不可能让他或她亲手触摸文物。3D打印技术就解决了这个难题，比如说美国的斯默威博物馆就为有视觉障碍的游客设计3D打印的浮雕画，让这些游客通过触摸来感受壁画之美，并根据他们的反馈进行调整，比如让浮雕画加上欣赏书画时的指向器，或者通过不同材料的画面，来帮助这些人感受艺术不同流派等风格。\n\
    \n听到这里，你是不是也觉得3D打印特别好。有趣的是，文章最后说，现在最大的问题是，长久以来“不能触摸”的心理隔阂，让人们即使在面对打印出来的，可以触摸的复制品时，他们也不敢摸。技术已经解决了复制品，博物馆下来要解决的是，想法鼓励参观者多多去触摸“文物”！\n\
    \n## 1 总结\n\n3D打印技术，从刚出现时被戏言的滥觞，到进入技术稳步发展的早期，它从改变了生活方式方面的改变。它不仅改变了制造业，改变了医疗领域，也改变了我们理解世界和体验的方式，从而改变我们的生活。\n\
    \n> 3D printing enables people to learn, enjoy and better understand cultural\
    \ heritage through multi-sensory experiences.\n\n这句话，也被选为今天的金句。\n\n你认为，3D打印技术还可以应用在那些领域呢？\n\
    \n欣赏、研究方式变得更丰富多样，满足了不同人群的需求。\n\n## 资料来源：\n\n*How 3D printing is transforming our\
    \ relationship with cultural heritage, by Myrsini Samaroudi and Karina Rodriguez\
    \ Echavarría, The Conversation, 2019.04.01*\n\n## 下期预告：\n\n明天的议题是#亚马逊如何用算法实现自我优化？#\n\
    \n亚马逊的发展壮大离不开人工智能和算法，比如产品页推荐算法、语音识别算法、语义分析算法等等。但是《经济学人》提出，对亚马逊影响最大的，是它进行自我优化的算法，包括企业内的评估系统、线下无人商店的优化算法等等，它们对亚马逊的商业成功起到了关键作用。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_114_0.png)\n\n## 用户留言\n\n提交留言可与专栏作者互动\n\
    \n## 238报告｜亚马逊的自我优化算法\n\n马徐骏 · 新知报告\n\n238报告｜亚马逊的自我优化...下载全文\n\n今日报告：亚马逊的自我优化算法\n\
    \n在所有的算法中，对亚马逊的成功影响最大的，是它用于自身优化的算法。\n\n> ——《经济学人》\n\n马徐骏\n\n跟谷歌、Facebook不同，亚马逊使用人工智能的方式很低调，有一种埋头苦干的极客风范。\n\
    \n今天的议题分为两个部分：\n\n- 亚马逊怎样优化线下业务？\n- AWS云服务的优化算法\n\n最近，亚马逊计划退出中国的消息传得沸沸扬扬，目前外媒还没有发布具体的分析报道，我不得怪为你追溯它的市场。亚马逊从来不是一家专注于“值出”的钱科技巨头，那么，是什么造就了亚马逊的成功呢？\n\
    \n《经济学人》最近发表的一篇文章说，一家科技公司，当然离不开人工智能，离不开各种算法，比如说亚马逊为用户Alexa的芯片推荐算法，智能语音助手Alexa的语言识别算法，语义分析算法，智能对话算法等，这些算法帮助亚马逊在对市场上取得了巨大的成绩。但是《经济学人》认为，在所有的算法中，对亚马逊的成功影响最大的，是它用于优化的算法。\n\
    \nThe algorithms most critical to Amazon's success are those it uses to constantly\
    \ streamline its own operations.\n\n这句话也被我选为今天的全句。\n\n文章从线上和线下两个方面介绍了亚马逊的自我优化措施，包括如何利用人工智能来优化仓储配送，线下无人店、AWS云服务等等，下面就来详细地给你一一讲讲。\n\
    \n### ■亚马逊怎样优化线下业务？\n\n亚马逊的线下业务，主要包括一个“云”和一个“店”。“云”指的是亚马逊电商商，包括亚马逊运转的物流中心；“店”指的是亚马逊无人店\
    \ Amazon Go，它承载着亚马逊对线下零售的未来探索。\n\n亚马逊电商业务估值高达2070亿美元，它是亚马逊最大的利润，而电商业务的营利运转，比如货物的存储、物流和配送，还有亚马逊两天之内送达门口的服务中心（fulfillment\
    \ center）。《经济学人》介绍说，亚马逊在全球有超过160个巨型物流中心，其中光是北美地区就有超过100个。\n\n那亚马逊是怎样利用人工智能来优化仓储物流的呢？具体来说，亚马逊通过使用了人工智能的仓库机器人，进行仓储物流的自动运输。来实现高效率和低成本。亚马逊在2012年，收购将近8亿美元的机器人公司一家初创科技公司，并把它收购后改名为Amazon\
    \ Robotics，而这家中文就是亚马逊机器人。\n\n亚马逊机器人为仓储而生，它长得像一个橘色的扫地机器人，身上还装着一个不修边幅的支架。它们到处移动，却不会彼此相撞。亚马逊把这个货架叫做“豆荚”——Pods。\n\
    \n亚马逊机器人的引入，为亚马逊的仓储物流带来了大变化。首先，它改变了以往货物仓储的方式，效率更高，仓储空间实现了完全的自化，这就不需要给人留下通道、地方，货架的密度更高，可以装更多的货物。\n\
    \n我人工在管理仓库时，会分门别类地摆放货物，这样的方式，而机器人的方式是，机器人是根据自己的记录系统中的位置，精准找到货物。它们根本不在乎，也不需要时间专门识别类别摆放货物。\n\
    \n其次，亚马逊的物流运转，彻底从人为了效率，整个仓储区实现了无人化与自动化。人类工人在仓储区外围固定的工作站，当需要补货时，仓库机器人会带货到接站，补充货后，自动移走。当需要送物品，也不需要人跑前来取，装配对应货物时，机器人会把配送站，把货物都送进仓库里就可以了，就像原来物流配送只是货架，这样的原来的货物中心化，变成配送中心化，既降低了货物仓储和分拣的成本，也大大地提升了效率。\n\
    \n这听起来是不是已经很强了？但亚马逊的自我优化并没有止步于此，它们又进一步地做出改进。原来货物，配货员都会拿条形码扫描，来识别货物和相关的信息。\n\n\
    在系统中，都有清晰的记录。而现在，亚马逊将计算机视觉技术和机器学习结合在一起，配送站只需拿起，在新近安放的扫描仪上扫一下，放在货箱子里，机器人就能自动记录物品的位置了，不用配货员再去扫描箱子了。\n\
    \n根据亚马逊首席机器人专家布拉德·波特（Brad Porter）的介绍，他们接下来的目标，是利用人工智能优化“豆荚间隙”。\n\nFacebook、谷歌这些公司不同，亚马逊使用人工智能的方式更为低调，颇有一种默默做事的劳模风范。在线下，亚马逊机器人保证了货品的快速运转与交付，亚马逊的无人店系统，保证了顾客的顺畅体验。线上，亚马逊AWS的不断优化，不仅加速了企业的发展，更吸引了更多的业务。\n\
    \n你认为国内有哪些行业可以借鉴亚马逊的方式来实现自我优化？\n\n欢迎在留言区写下答案，也欢迎你到今天的内容转发给自己的朋友。\n\n### **划重点**\n\
    \n今日得到：\n\n1. 亚马逊利用物流机器人来改变传统的货物仓储方式，大幅提升了仓库空间的利用率，同时降低了货物仓储和分拣的成本，从整体上优化了仓储物流的效率。\n\
    \n2. 亚马逊的无人商店Amazon Go只追踪顾客的肢体动作，而不去收集顾客的面部数据，更好地保护了顾客的隐私。\n\n**资料来源：**\n\n> *The\
    \ Learning Machine, The Economist, 2019.04.13*\n\n**下期预告：**\n\n明天的议题是#独角兽公司的股票真的值得买吗？#\n\
    \n最近，大批中美独角兽公司上市，引发了全球范围的热烈讨论。最新一期《经济学人》的封面文章分析了为什么独角兽公司能快速成长，并提出了几个问题：独角兽的成功得益于哪些因素？这对投资者和股民来说，是一笔好生意吗？《经济学人》还认为，买入独角兽公司的股票不是一个好选择，建议投资者一定要慎重，这又是为什么呢？\n\
    \n![](img/82c50821bc552fe72722a78212114e65_116_0.png)\n\n## 239报告｜基因编辑将给畜牧业带来什么？\n\
    \n马徐瑞·新知客\n\n今日报告：基因编辑将给畜牧业带来什么？\n\n基因编辑能让我们的食物供应链更高效、更人性化，但却很难走出实验室，进入我们的餐桌。\n\
    \n——《连线》\n\n马徐瑞\n\n基因编辑给畜牧业带来的一个问题是，基因被编辑过的动物，它们的肉、奶、蛋，到底对人类的健康没有影响吗？\n\n今天的议题分为两个部分：\n\
    \n- 基因编辑怎样改变畜牧业？\n- 基因编辑技术的问题和挑战\n\n关于基因编辑技术的讨论，相信你已经听过很多了，无论是科学界还是主流媒体，对基因编辑大多抱有相当的警惕和批判的态度，生怕基因编辑变成科技界的“潘多拉魔盒”，一旦投入大规模使用，会给人带来想象不到的灾难。\n\
    \n《连线》4月刊的封面文，却指出了基因编辑的另一种应用的方向——畜牧业。如果将基因编辑应用到畜牧业，动物和家畜都有可能变得双胞胎。值得注意的是，这篇文章讲的是“不是技术，科学或说，而是已经实现的技术”，也就是说，基因编辑技术对畜牧业的介入，很有可能会影响到你未来的餐桌。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_117_0.png)\n\n### 基因编辑怎样改变畜牧业？\n\n\
    简单来说，基因编辑可以为畜牧业带来两大变化。第一，畜牧业变得可以主动定制、繁殖，让畜牧业变得更高效也更人性化；第二，基因编辑可以让动物更健康，减少经济损失。\n\
    \n我们来说什么叫做“定制繁殖”。简单来说，就是让基因可以主动定制动物的后代的性别。想要公的就生公的，想要母的就生母的。比如说同样想生产牛奶，养殖场希望多生公牛，因为公牛的肌肉；想要乳制品的养殖场呢？希望多生母牛，因为母牛产奶多。\n\
    \n改变动物的性别这件事，从基因编辑技术上早已经可以实现了。你知道它的应用到了什么程度吗？就是动物胚胎的性别不对，也能通过基因工程改过来。\n\n或者其他相关产品？\n\
    \n欢迎留言写下你的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n### 划重点\n\n今日得到：\n\n1. 基因编辑技术对畜牧业的两大推动：实现动物的定制化繁殖，让畜牧业变得更高效也更人性化；让动物更健康。\n\
    \n2. 基因编辑技术在畜牧业的推广，主要面临三大挑战：会不会带来新的产品安全问题；如何通过FDA的重重监管；如何防止人类私自尝试基因编辑，造成灾难性后果。\n\
    \n## 资料来源：\n\n刊物：\n\n* Cow, Interrupted, by Gregory Barber, Wired, 2019.04\n\n\
