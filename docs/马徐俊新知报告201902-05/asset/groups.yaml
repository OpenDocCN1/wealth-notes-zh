    ## 205报告 | 两个思维工具，应对中年职场危机


    马幼健 · 新知报告


    马幼健 · 新知报告


    ![](img/82c50821bc552fe72722a78212114e65_50_0.png)


    ### 今日报告：两个思维工具，应对中年职场危机


    中年职场危机最重要的三个原因是：未来人生的可能性变少，让人后悔；过去的选择无法改变，让人后悔；当前的工作内容不断重复，让人厌倦。


    > ——《哈佛商业评论》


    ![](img/82c50821bc552fe72722a78212114e65_50_1.png)


    不管你有没有“中年职场危机”，今天这篇报告都值得你关注，它或许能帮你找出焦虑和迷茫的根本原因，并为你提供非常实用的解决方案。


    ### 为什么光靠跳槽无法解决中年职场危机？


    应对中年职场危机的两个思维工具


    咱们都说“中年危机”（Midlife Crisis）这个词，指的是人到三四十岁这一年纪，事业、健康、婚姻都容易出现问题。中年危机在职场上，有个专门的叫法，叫“中年职场危机”（Mid-career
    Crisis），说的是中年人对当前的工作感到不满意、迷茫、甚至焦虑。


    不要夸张地，几乎每个中年人都会遭遇中年职场危机。美国有一项针对5000名职场人士的调查显示，一生中对于工作的满意度呈一个U形曲线。平均而言，在39岁时处于最低点，无论男女都是如此。奇怪的是，中年职场危机可并不是“loser”的专利，即使事有成的人也是难以避免，它也不是靠换工作就能解决的，有的人即便换了槽，危机感依然如影随形。


    那到底是什么回事呢？最新一期的《哈佛商业评论》刊登了麻省理工学院哲学教授基尔兰·塞（Kieran Setiya）的一篇文稿，提出了很有价值的见解。塞亚尼教授是这个世界著名，2017年曾写过一本书，叫《中年危机》（Midlife
    Crisis: A Philosophical Guide）。怎么说，他具体分析了中年职场危机是怎么回事，并再一次从哲学领域找到了解决方案。


    这套解决方案包含两个思维工具，概括来说，一个是“选择带来的机会损失和解”，另一个是“多与有价值的东西创造空间”。这两个思维工具，能够帮助你更好地应对中年职场危机。


    ![](img/82c50821bc552fe72722a78212114e65_50_2.png)


    #### 1 为什么光靠跳槽无法解决中年职场危机？


    很多人觉得跳槽可以一劳永逸地解决中年职场危机。表面上看起来很不错——既然对当前的工作不满意，那就换啊！可是，麻省哲学教授告诉我们的是，中年职场危机并不意味着当前的工作真的有问题。处于这个阶段的人，即便事变成发展趋势，也会产生迷茫、焦虑、后悔、空虚等负面情绪。这些负面情绪来源复杂，不是跳槽就能解决的。


    麻省哲学教授自己有切身体会。他的事业很成功，在声誉看重的省管理上担任终身教职，学术方向也有突破，但是，他依然产生了这种心态的空虚和焦虑。他意识到，自己陷入了中年职场危机。


    那么问题来了，如果中年职场危机的原因不在工作岗位，那又是什么呢？麻省哲学教授在工作研究里，认为是三个主要因素：未来人生的可能性变少，让人后悔；过去的选择无法改变，让人后悔；当前的工作内容不断重复，让人厌倦。


    ```

    There are multiple factors in mid-career crisis: the narrowing of options, the
    inevitability of regret, and the tyranny of projects successively completed or
    replaced.

    ```

