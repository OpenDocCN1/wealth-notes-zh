    A Business?, by Jason Feifer, Stephanie Schomer, C.C., J.F., L.B., Entrepreneur
    USA, March 2019

    *What Is A Minimum Viable Product, and Why Do Companies Need Them?, by Quora Contributor,
    Feb 27, 2018


