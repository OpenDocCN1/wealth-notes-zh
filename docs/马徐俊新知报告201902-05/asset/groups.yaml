    *决策*：由于无法确证OCR人名，且“达拉斯阿格雷格”明显是音译错误，我将修正为通顺的表述，保留“指出”这一动作，对名字进行最小化修正或保留原样以避免胡编。\n\
    修正文本：国外还有研究者找出了老人人口数量和机器人数量之间的关系，研究者达拉斯·阿格雷格（Darbon Aegregot）和罗杰·哈奇（Roger Hatch）指出，55岁以上的老人口每增加10%，每100名工人中就会增加0.9个工业机器人。\n\
    \n按照这个规律，到了2040年，中国会新增200万个机器人，这个数据超过去年全球机器人增长总量的6倍，而这些机器人创造的价值，将会是2018年全世界工业机器人创造的价值3倍。\n\
    \n其次，老年人的生活需要大量服务型机器人来照料，这是老龄化社会的刚需。\n\n目前，全世界的服务机器人都是工业机器人（注：逻辑错误，“服务机器人”和“工业机器人”是两类。原文OCR“服务机器人都是工业机器人”应为“目前，绝大多数机器人是工业机器人”），也是在线作业（注：“在线作业”应为“在线”或“工厂”里的机器人）里的机器人，比如安装汽车配（注：“配”应为“配件”）、组装设备的机器人。但在未来，机器人的另一大任务，就是照顾老人。这三种机器人的作用各不相同（注：前文只提了“工业机器人”和“照顾老人”两类，这里说“三种”，指后文的医疗、陪伴、护理），医疗型机器人能够提供医疗补助（注：“补助”应为“辅助”或“支持”），陪伴型机器人能够与人类建立亲密关系，帮助人类缓解孤独，而护理型机器人能够帮助人类提取重物（注：“提取”应为“搬运”或“移动”）。\n\
    \n幻电影（注：“幻电影”应为“科幻电影”）里看到的一样，在家里使用会做饭、打扫房间、照顾老人和孩子的服务型机器人了。\n\n## 总结\n\n过去，我们一直认为老龄化社会，会带来各种问题，比如说劳动力会大幅缺失，生产力会下降，或者是政府和国家，需要投入大量的资源，来负担老年人的生活，提供他们需要的服务。\n\
    \n但今天这篇文章告诉我们，人口老龄化还创造了新的需求，更快地推动机器人行业的发展。未来，将会出现功能更多样化的机器人，服务型机器人将会蓬勃发展。有能照顾生活起居的机器人，还有能长久陪伴老人，不需要休息的陪伴型机器人，甚至还有能缓解痴呆症状的医疗型机器人。\n\
    \n虽然目前主流的机器人还是工业机器人，服务型机器人的基数很小，但对服务型机器人的需求正在快速上涨，老龄化需要机器人革命，它会慢慢到来。\n\n就像文章里说的那样：老龄化是一个国家发生机器人革命的最大推手。\n\
    \n> Ageing is the biggest single influence upon when a robotics revolution of\
    \ a country happens.\n\n这句话，也是今天的金句。\n\n假如价格合适，你会给父母买一个机器人来照顾他们么？\n\n欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\
