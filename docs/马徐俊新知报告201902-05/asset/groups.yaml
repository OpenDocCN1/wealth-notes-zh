    # 220报告 | 我们真的需要5G吗？


    马徐骏·新知报告


    220报告 | 我们真的需要5G吗？


    # 今日报告：我们真的需要5G吗？


    即便是一场移动互联网革命正在发生，

    也可能以极其缓慢的速度到来。


    > ——《新科学家》


