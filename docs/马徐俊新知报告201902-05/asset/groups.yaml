    今天的议题分为两个部分：


    - “人体暗物质”包括哪些微生物？

    - 微生物对我们的健康有什么影响？


    作为得到的用户，特别是我们专栏的老朋友，您可能听说过“人类微生物组计划”，它检查着人类自身的细菌，已经精确到每个细菌、每个基因了。那么，人类的身体不是早已被探索到了极致，再没有什么超出我们认知的奥秘了呢？


