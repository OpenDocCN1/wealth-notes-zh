    \ emotion is more reflexive than reflective. 哪怕香甜的巧克力，如果被弄成了屎的样子，依然让人觉得恶心，无法接受。\n\
    \n既然我们知道了这点，那么掌握了一个很重要的实用技能：不要让别人通过制造恶心的生理感觉，影响你的决策。文章里举的例子是美国的政治选举，但我相信，这个新知不仅限于政治层面，商业、消费、日常生活里都是一样的。以前我们说不要在情绪里做重要决定，现在我们还可以说，不要在生理状态不舒服的时候，做重要的决定。\n\
    \n好，总结一下今天的内容。大量的研究表明，恶心这样的生理因素，会影响政治倾向这样高级意识形态，甚至比心理和情绪因素更直接，更难以压制。这跟人类的“行为免疫系统”的运作机制有关。理解这点，有助于我们免于被操纵，真正做出符合自己意愿的决定。\n\
    \n你能举出什么利用“行为免疫系统”，也就是利用人类对恶心的生理反应，来影响决策的例子吗？\n\n欢迎你在留言区写下自己的分享，也欢迎你把今天的内容转发给自己的朋友们。\n\
    \n## 划重点\n\n![](img/82c50821bc552fe72722a78212114e65_29_0.png)\n\n**资料来源：**\n\n\
