    \n能力，这笔钱在换了新工作，薪资提高之后，3个月就挣了回来。\n\n科技发展带来的新工作，需要新的技能来匹配。类似这样时间相对密集的新技术培训课，能学到比在大学课程里更实用也更前沿的内容，在全世界发展得都非常快。去年，这个行业里一家名叫\
    \ General Assembly 的明星公司，就以4亿美金的价格被收购了。因为从2011年至今，General Assembly 已经培训了超过5万人，每年的收入以30%的速度增长，资本非常青睐这样的商业模式。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_164_0.png)\n\n所以，你会发现，私立教育其实补充着大量公立教育力所未及的领域，甚至大量世界范围的研究表明，无论是在美国、加拿大、瑞典这样的发达国家，还是在印度、巴基斯坦、肯尼亚这样的发展中国家，私立教育蓬勃发展的地区，当地的公立教育水平也获得了很大的提升。\n\
    \n当然，不可否认的是，各国政府对私立教育心存戒备，是出于合理的担忧，比如私立教育可能会导致不平等、社会阶层固化、教育资源分配失衡等问题，那么到底该怎么办，才能把私立教育的优势最大化呢？\n\
    \n### 私立教育的优势应该怎么发挥？\n\n文章说，无论如何政府不应该把私立教育视为敌人，正确的姿态，是在公立教育暂时无法覆盖的领域，最大限度地发挥私立教育的长处，毕竟私立教育的质量很高，是无可争议的。文章里给出了一个有趣的数据，全世界排名前十的大学里，7所来自美国，全都是私立学校，3所来自英国，虽然名义上不是私立的，但从运作方式上来看，就是私立的，排名最靠前的公立大学，是爱因斯坦的母校，瑞士的苏黎世联邦理工学院，排名第11。\n\
    \n而且从现实的角度来看，哪怕国家不支持，普通人也总是会想办法获得更好的教育资源。很多亚洲国家是规定不让孩子上补习班的，但是也拦不住父母给孩子家教不是？所以，与其禁止，不如合理监管，比如通过发放补贴的方式，让贫困家庭的孩子也能享受私教育。或者向荷兰和中国的香港地区学习，这两个地区的教育制度，都是学校获得政府的资助，但是自主权很高，政府通过监管的方式来提升教育质量，防止不公平扩大。\n\
    \n对我们普通人而言，文章提出的建议是，如果父母在选择私立学校的时候，不只盯着分数和实际表现，而是考虑学校是否在塑造孩子的实际能力和价值观上，有独到的方法，这会更有利于私立教育未来的健康发展。\n\
    \n### 总结\n\n私立教育跟公立教育并不是对立的，而是一种很好的补充。公立教育注重公平，私立教育提升效率，就像我们一开始在金句里说的，世界各国政府不应该压制私立教育，相反，应该鼓励它的蓬勃发展。\n\
    \n在做这篇内容的时候，我总是会忍不住想，其实得到App也是一种私立教育，它的形式灵活，内容丰富，价格却不贵。这样的私立教育，难道不正是结合了公平和效率，为所有人打开了一种新的可能吗？\n\
    \n你对私立教育是怎么看的呢？欢迎在留言区写下你的答案。\n\n**划重点**\n\n1. 私立教育对公立教育力所未及的领域起到了很大的补充作用。无论是在美国、加拿大、瑞典这样的发达国家，还是在印度、巴基斯坦、肯尼亚这样的发展中国家，私立教育越蓬勃发展，公立教育水平获得的提升也越大。\n\
    2. 私立教育的高速发展，主要有四个原因：中产阶级收入的增加、大量工作岗位对学历要求的提高、师资力量的丰富，以及科技的快速发展对于新技能的需求增加。\n\n\
