    少用户的操控选择。比如说，大手笔砍掉不必要的操控按钮和指示灯，尽量使用最简洁的界面跟用户进行交互，这就像iPhone把最原始的手机按键都变成了简洁的触屏界面那样，把用户的使用成本降
    到最低。


    另外，哈卡特发现，在传统的汽车工业设 计里，所谓的“设计思维”其实是一个伪命题，因为每个人对它的理解都不同。就 像“功能设计”（feature set）这个词来
    说，工程师是一种理解、程序员是一种理 解、市场人员又是另一种理解，连基本的 共识都没有，何谈统一的“设计思维”？


    于是哈克特要求福特的设计团队先停下手里的工作，给大家放几天假，回去好好开开自家的车，把他们觉得不方便、不满意的地方都找出来。


    果然，设计团队带着一大堆问题回来了，比如“如果我去野营，忘了带手机充电器，怎么用车来解决这个问题呢？”“我在约会的时候，不想被导航唠叨叨地破坏情调，又该怎么办？”，像这样换位思考，完全站在用户的角度来思考产品网络的设计思路，在许多行业特别是互联网行业，早已经是共识了，但在汽车行业，却是一个全新的创举。


    文章作者尤西姆试驾过福特的无人驾驶概念车，他发现，当你切换到自动驾驶功能的时候，汽车座椅会下沉，拉开驾驶员和方向盘的距离，这个距离掌握得非常精 妙，既能让你明确感受到，驾驶权现在已经交给了机器，同时又不会让你有“失控”的无力感。这种完全从驾驶者的体验出发的设计，在汽车行业确实是前所未有的。


    更绝的是，哈克特要求福特的设计团队不再把汽车当作孤立的产品，而是要设计成手机等日常电子设备的一种延伸。这是一个了不起的洞见，也恰好呼应了我们刚才说到的那个核心问题——如果未来的汽车不再是私人物品，而是一种多人分享的交通工具呢？如果能与手机进行多维度的连
    接延伸，那么，未来的汽车将不再是 人与一面，而是千人与面的产品，拥有无限的可能。


    # | 总结


    福特的新任CEO吉姆·哈克特把自己在办公家具领域的“设计思维”理念，带进了保守的汽车行业，突破了过去的“工程师思维”，完全从用户的角度出发，来设计未来的汽车。


    福特是否能凭借这种“第三选择”，在未来获得差异化的竞争优势，目前还不能确 知。但是哈克特给汽车行业带来的新思 路，确实值得我们了解和借鉴。


    在哈克特的主导下，你是否看好福特的未来表现？为什么？


    欢迎在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。


    今日得到：


    1.福特认为，对于未来的汽车行业来 说，以用户体验为导向的“设计思 维”，比传统的“工程师思维”更重 要。


    2.未来汽车行业要面对的真问题是， 人们到底想不想拥有自己的私家 车。


    3.福特未来的汽车设计思路有三个重 点：尽量减少按钮和指示灯、以用户 体验为中心、把汽车视为手机的延 伸。


