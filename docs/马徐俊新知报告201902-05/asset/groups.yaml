    *修正策略*：原文说“不约而同地...把总驻地从伦敦迁到了...都柏林”。历史上巴克莱迁了。另一家可能是“富国银行”或“美林”？美林被摩根大通收购。\n鉴于OCR“沃尔济夫里姆”无法还原，且后文列举其他银行“没有公开迁至”，我将把这句中的具体错误名称修正为通顺的描述，或保留“美国投资银行”而不加错误名称。\n\
    *再次审视*：OCR文本“沃尔济夫里姆”可能是“华尔街”的音译错乱？或者是“Merrill”？\n为了安全，我将修正为“一家是美国投资银行”，去掉错误的专有名词，或者如果上下文有暗示，可能是“花旗”被误写但后文说花旗没迁总部。\n\
    算了，直接修正为通顺的中文，去掉乱码名字。\n“这里面比较明显的例子是两家银行，一家是美国投资银行，一家是英国著名的巴克莱银行。这两家银行不约而同地把欧洲总驻地从伦敦迁到了爱尔兰首都都柏林。”\n\
    \n单是巴克莱银行，迁过去的资产就达2150亿美元。而花旗集团、摩根斯坦利、摩根大通、高盛集团，虽然没有公开迁至都柏林，但也都承诺，会扩大它们在都柏林的分支机构的规模，来应对英国脱欧带来的不确定性。\n\
    \n另一波重要的力量是科技巨头们。其实专家们上季不止一次说过，很多著名的互联网公司，在更早之前就曾经把欧洲总部设在了爱尔兰，比如谷歌、微软、苹果和Facebook。不过，在英国脱欧这个重要的时间节点上，它们也都公布计划，要扩大在爱尔兰的投规模。\n\
    \n比如Facebook将设在爱尔兰的办公室增加了四成，并打算招募1000名新员工，成为规模最大的海外分支机构；谷歌最近也在爱尔兰新建了1000名职员的办公室；还新建了一栋大楼用于计算机科学的研发；上世纪80年代入驻爱尔兰的微软，近期将宣布计划增加2200名职员；苹果公司也将于爱尔兰第二大城市科克的总部分行扩建，员工从5000名增加到7000名（注：原文“增加到700名”逻辑错误，应为7000名或更多，根据常识和前后文“扩建”，700名不合理，推测OCR漏了一个0，或原文就是增加。考虑到“从5000增加到...”，700是减少。故修正为7000或保留原文逻辑错误？任务要求纠正明显OCR错误。5000到700是减少，与“扩建”矛盾。故修正为7000名或更多。此处修正为7000名）。\n\
    \n所以你看，英国脱欧这件事给爱尔兰带来的最直接的益处，就是新增了大批的就业岗位。英国官方据估计，因为脱欧的影响，英国将会损失12000个高薪岗位，其中大部分都会转移到爱尔兰去。\n\
    \n有一项统计显示，2018年各大跨国企业在爱尔兰的雇工加起来已经达到了23万名，创下了历史新高。新口看这23万名工（注：OCR错误，“新口”应为“你”或“大家”，“工”应为“员工”），要知道，爱尔兰全国人口不过才480万。\n\
    \n换一句话，爱尔兰的外企员工，已经占了全国人口的近5%，这可是一个不得了的比率。更不用说，随着这些新增就业岗位一起来爱尔兰的，还有上万亿美元规模的资产。\n\
    \n为了顺这波浪潮，爱尔兰近两年也是大干快上。爱尔兰四大高校（注：OCR“四大道高海地”应为“四大高校”或“四所大学”）计划投资1亿欧元，建设一个占地将近8000平方米的办公楼综合体（注：8000平米对于“综合体”且“占地”可能偏小，或许是8万平方米？OCR错误。根据常识，办公综合体通常更大。但若无确切信息，修正明显文字错误“四大道高海地”为“四大高校”，“8000平方米”保留或修正为更合理数值？原文“占地将近8000平方米”对于新建大楼可能合理，但“综合体”较大。暂保留数值，修正文字）。位于都柏林著名高等学府三一大学正旁（注：OCR“正往在耗资”应为“正旁，耗资”或“正对着，耗资”），在耗资10亿欧元建另一个占地3.5万平方米的科研区（注：OCR“占地3.5万平方米”与上文8000平米比例失调，但此处独立。修正文字错误），计划容纳400家创司（注：“创司”应为“创业公司”），希望借此成为欧洲的麻省理工或斯坦福。\n\
    \n还有不少的欧洲科技企业，也都选择爱尔兰作为进入欧洲市场的又一始站（注：“又一始站”应为“又一始站”或“首选站”）。文章特意提到，中国企业小米将在都柏林开设线下实验室。另外两家中国企业华为也与爱尔兰成了另一研究中心（注：OCR“成了”应为“建立”或“设立”），华为还宣布将与三一学院开展人工智能等领域的深（注：“深”应为“深入合作”或“深度合作”）。今年6月，日本软银集团宣布，将在都柏林试点首个“智慧城市”模型。\n\
    \n即将上任的爱尔兰新首相西蒙·科文（注：应为“西蒙·科文利”或当时首相，OCR“科文”缺字）说：“爱尔兰已经开启了经济换模式”（注：“换模式”应为“转模式”或“新模式”）。数据也显示，爱尔兰连续四年成为欧盟增长数据最快（注：“增长数据”应为“经济增长速度”）的经济体。这背后是什么原因呢？\n\
    \n### 爱尔兰靠什么受到跨国公司的青睐？\n\n地处偏远的爱尔兰，为什么能吸引这么多企业？把它们的欧洲总部都设在这儿，《财富》认为它靠的，是自身的“软实力”。文章总结了四个关键原因，分别是税率低、劳动力年轻化、母语为英语，还有极具包容性的社会文化。\n\
    \n先来说低税率。爱尔兰的企业所得税在世界范内（注：“范内”应为“范围内”）都是相当低的水平，只有12.5%，而欧盟国家的平均是19%（注：原文OCR“是19%，是21.6%”，此处可能有误。欧盟平均税率通常高于爱尔兰。若爱尔兰12.5%，欧盟平均约20-25%？OCR“是19%，是21.6%”混乱。修正为：而欧盟国家的平均水平约为21.6%（或根据实际数据修正，原文可能指欧盟平均21.6%）。相比之下，英国是19%，虽低于欧盟平均水平，但依然无法和爱尔兰相比。\n\
    \n低税率，当然是一个原因（注：OCR“会雷下因来”应为“当然是一个原因”）。因为对企业来说，它意味着省下一大笔支出（注：“支”应为“支出”）。所以就不难理解，为什么跨国公司都会选择爱尔兰了，因为省钱啊！\n\
    \n不过，爱尔兰的低税率并不是绝对优势（注：OCR“并不绝对”）。在欧盟国家，企业税率最低的并不是爱尔兰（注：OCR“最的是不是”），而是匈牙利，只有9%。可是，那些大企业并不是因为税率而选择匈牙利（注：此处逻辑稍显跳跃，意为虽然匈牙利税率更低，但爱尔兰仍被选中，说明税率非唯一原因），可低税率并不是唯一的原因，这里面肯定还有别的因素。\n\
    \n什么因素呢？这就说到爱尔兰另一个吸引企业的优势——劳动力的年轻化。爱尔兰拥有全欧盟最年轻的人口，平均年龄只有35.9岁；相比之下，欧盟国家的平均人口年龄是42.8岁（注：OCR“跟着，这了45.9岁”应为“而爱尔兰是35.9岁，欧盟平均42.8岁”或类似。原文OCR混乱。修正为：相比之下，欧盟国家的平均人口年龄是42.8岁），这意味着年轻的人口结构意味着什么？意味着更年轻、更有活力的劳动力。\n\
    \n同时，爱尔兰的教育质量也堪称世界少（注：“世界少”应为“世界一流”或“举世罕见”），国民教育高度普及，超过四成的成年人都接受过高等教育。既然年轻又高素质，这样优质的人才储备，哪个企业不想要？\n\
    \n这不就算（注：OCR“这不就算”应为“不仅如此”或“此外”），跟欧盟的其他国家相比，爱尔兰的驱动力有个极大的加分项，就是母语是英语。你可能觉得，现在每个国家没有一大堆英语好的人是不是一样（注：语句不通，修正为：你可能觉得，现在每个国家都有很多英语好的人，是不是都一样？）。没有母英语（注：“母英语”应为“母语为英语”），意味着完全没有语言障碍，在商业上，这个优势能把沟通成本降到最低。\n\
    \n此外，爱尔兰社会文化的包容性，也在国际上屡获好评，就在去年，爱尔兰还通\n\n# 过全民公投修改了宪法，实现了堕胎合法化。2015年，爱尔兰也是通过全民公投的方式，允许同性恋婚姻合法化。爱尔兰现任总理、38岁的印度裔爱尔兰人瓦拉德卡，就是一名公开出柜的同性恋。打个比方，这要是在美国，差不多相当于刚废除了奴隶制没几年，就选出了第一位黑人总统。爱尔兰社会的包容性，可见一斑。\n\
    \n包容、自由、平等、稳定——爱尔兰呈现出来的这种社会状态，在英国脱欧带来的混乱的衬托之下，更显得珍贵。试想，如果你把企业迁离英国就是为了避开乱局，那爱尔兰，不就是一个最合适的选择吗？\n\
    \n## 总结\n\n英国如今因为脱欧陷入了泥潭，而各大金融机构和跨国企业纷纷把在欧洲运营的重心转向了爱尔兰。为什么会选择爱尔兰？《财富》杂志总结了爱尔兰的四大优势，分别是税率低、劳动力年轻化、母语为英语，还有极具包容性的社会文化。这四大优势，共同拧成了一股强大的吸引力。\n\
    \n不过老实讲，这些优势爱尔兰一直都有，只不过恰好赶上英国脱欧这个历史事件，让全世界看到了大不列颠傲慢、自负的一面，以及政治上混乱不堪的局面，此消彼长，一下子就把爱尔兰的这些优势凸显出来了。\n\
    \n这也是为什么文章会说，英国脱欧释放了不列颠的“恶魔”，却也让爱尔兰头上的光环更加夺目。\n\n从这篇文章里，我们还可以洞察到国际资本流向的规律：最吸引外资的地方，未必经济最发达，但一定能够用“软实力”为企业发展提供适宜的土壤。爱尔兰就是一个绝佳的范例。\n\
    \n爱尔兰的这几大“软实力”中，有哪些是我们中国可以借鉴的？哪些又是学不来的？\n\n欢迎留言告诉我，也欢迎你把今天的内容转发给自己的朋友。\n\n## 划重点\n\
    \n> 今日得到：\n> 爱尔兰凭借税率低、劳动力年轻化、母语为英语，以及极具包容性的社会文化这几项“软实力”的综合叠加，在英国脱欧带来的不确定性中凸现出了极强的优势，成了科技巨头、金融巨头们离开伦敦后首选的落脚点，这使得爱尔兰成为英国脱欧最直接的受益者。\n\
