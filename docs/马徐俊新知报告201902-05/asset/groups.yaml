    ## 214报告「如何停止过度自我批判」


    马修·斯宾塞·报告 今天进入


    ![](img/82c50821bc552fe72722a78212114e65_68_0.png)


    # 今日报告：如何停止过度自我批判？


    对自己狠一点，能让自己变得更强大。如果自己一直不消除这个脑海里那个声音，你的潜力就会受到限制。


    > 《今日心理学》


    ![](img/82c50821bc552fe72722a78212114e65_68_1.png)


    过度自我批判会让我们在长期的巨大的心理压力之下。它带来的危害，远比我们想象得更严重。


    今天的议题分为两个部分：


    - 过度自我批判的坏处

    - 怎样停止过度自我批判？


    不知道你最近有没有遇到这样的情况——当众发言后，觉得这个没有说没有说好，脑子里总是回响着一个声音：「我刚才的回答真是太差了！完了，别人得怎么看我！」


    对，或者内心总觉得他们什么在不断地挑剔你自己。久而久之，让你的自信和勇气被自己给弄光了。像这样的时候，你就处在过度自我批判了。


    我们都知道，过度自我批判会让自己不快乐，但是，怎么能够停止过度自我批判呢？最新一期《今日心理学》杂志的刊面文章，给出了四种应对办法。通过今天的报告，你会知道，它会对你造成哪些不好的影响？然后，我还会告诉你，怎么做才能把大脑里不断批评自己的声音，帮你拉回大度和自信。


    ![](img/82c50821bc552fe72722a78212114e65_68_2.png)


    ## 我们为什么会过度自我批判？


    简单来说，一个人是否会有过度自我批判的倾向，与从小生活的家庭环境有关。


    其实，每个人的脑海里都会有两种声音，一种是自我批评，一种是自己鼓励，但是有些人脑子里一个种自我批评的声音，它格外严重，压制了所有鼓励自己的声音。


    美国心理学家马格利塔·福斯特 (Margalit Fodor) 认为，这种过度自我批判和孩子童年的经历密切相关。福斯特说，假如你的父母特别严厉，对他们的期望值都多于鼓励，那你会一直处于焦虑和紧张的状态，生怕自己犯错误。长大成人后，父母的指责就成为了内心的一部分。久而久之，以自己的责罚之身，我们就被自我给打自己。


    ![](img/82c50821bc552fe72722a78212114e65_68_3.png)


    ## 如何停止过度自我批判


    文章给出了四种方法，我们分别是自我抽离、自我同情、自我鼓励和接受。


    个表达自己的机会，在会议上发言，在聚会上发言，进而通过麦克风给观众演讲。慢慢地，你会越来越大胆，越来越自信。弗吉尼亚大学的社会心理学家蒂莫西·威尔逊 (Timothy
    Wilson) 把这种方法叫做“Do good, be good”，也就是做对的事，成对的人。总有一天，你会发现，自己活成了想要的样子。


    第四个方法，是自我超脱，也就是把注意力放在更高远、更重要的事情上，从而减少眼前的事情给自己的压力。我们可以告诉自己，我这样做是为了我信仰的宗教，为了项伟大的事业，或是为了自己的家人和朋友。比如，你讨厌有目的的社交，总觉得自己是在利用别人，特别虚伪。但心理学家发现，假如你把社交和一个更伟大的目标联系在一起，比如，往大了说，你是为了提高女性在传统行业中的地位；往小了说，你是为了给孩子储备社会资源，这样你对社交的厌恶感就能大大降低。


    ## 总结


    每个人都会自我批判。但正如文章里说的那样：对自己狠一点，能让你变得更强；但如果你一直关不掉脑海里的这个声音，你的潜力就会受到限制。


    > Being tough on yourself can make you stronger. But when you can''t turn that
    voice off, it can limit your potential.


    这句话，也被我选为今天的金句。


    为了对抗过度自我批判，我们一共给出了四个应对方法，分别是自我抽离、自我同情、自我鼓励和自我超脱。这些方法能帮助我们削弱过度自我批判，让鼓励的声音主宰你的大脑，从而拥有追求梦想的勇气。听完这篇文章，希望你可以拥有强大的内心，可以“Do
    good, be good”。


    你会过度自我批判吗？你有什么解决这个问题的秘籍吗？


