    刊物：

    * Stop The Spread, by Chelsea Whyte, New Scientist, April 20, 2019

    网站：

    * Measles is Back Because States Give Parents Too Many Ways to Avoid Vaccines,
    by Julia Belluz, April 18, 2019

    * The Anti-vaccination Movement: A Regression in Modern Medicine, by Azhar Hussain,
    July 3, 2018


