    \ Illegal, by Gbenga Oduntan, The Conversation.*\n\n### 下期预告：\n\n明天将给你带来的是议题是#“再利用型药物”为什么这么难？#\n\
    \n有没有什么办法，可以让普通人用上价格低廉又有效药的药品呢？《经济学人》杂志国际版提出了一个方案——推广“再利用型药物”，也就是重新发掘现有药品的新疗效和新作用，这样既可以减少药品的研发时间、降低成本，风险也低得多。\n\
    \n# 210报告 | 为什么“再利用型药物”面世这么难？\n\n马修彼 · 新知报告\n\n## 今日报告：为什么“再利用型药物”面世这么难？\n\n或许，某种“神药”早就已经被发现甚至面市了，它所需要的，只是以正确的方式被再利用。\n\
    \n——《经济学人》\n\n### 马修彼\n\n今天的议题分为两个部分：\n\n- “再利用型药物”是什么？\n- “再利用型药物”面临的困难\n\n我们经常会听到对于新药价格昂贵的抱怨。站在老百姓的角度，当然希望能以相对低的价钱买到好药。但站在制药厂的角度，研发一款新药动辄几十年，需要几十亿美元的投入，如果不能收回成本，获得高额的利润，制药公司哪还有动力去研发新药？那有没有其他方法，可以让普通人用低价格就能买到疗效好的药品呢？\n\
    \n《经济学人》国际版就提出了一个解决方案，叫做“再利用型药物”（Repurposed drugs），什么意思呢？就是从现成的药品里重新发现出新疗效，新作用，来治疗其他类型的病，比如用降压药来治疗精神疾病。\n\
    \n这样做的好处是，既可以减少药物的研发时间，降低成本，风险也低得多，因为这些药物本都已经通过了测试，且被人们使用了多年，安全性是有保障的。\n\n用文章里的说法就是：有海量的常用药物，等待着被挖掘出新的用途——There\
    \ is a huge untapped medicine chest of generic drugs with unexploited uses.\n\n\
    这种思路，相当于在存量中挖矿，用成本创新的方式来找新药。所以《经济学人》也说：或许某些“神药”，早就已经被发现甚至面市了，它所需要的只是以正确的方式被再利用。\n\
    \nThe next wonder-drug may already have been discovered and bottled; it just needs\
    \ repurposing.\n\n这句话也被我选为今天的金句了。\n\n### “再利用型药物”为什么可行？\n\n看完整对“再利用型药物”的介绍，你可能会问一个疑问：这不就是旧药新用吗？那有什么能说的呢？新闻嘛！《经济学人》给出的答案是：可以，还提供了很多实例来证明。\n\
    \n文章里讲了一个叫阿利斯泰的英国病人，2014年查出他脑子里长了恶性肿瘤，几年之后就会要他的命。更糟糕的是，他的肿瘤无法手术。\n\n阿利斯泰希望通过自己翻找医学文献和案例发现，有一种叫西妥昔单抗，把几种常用的药物混合在一起服用，可以帮助他缓解类似药物的患者起效的作用，关键是这样药又便宜，在咨询主治医生之后，阿利斯泰得到医生的回应是：虽然我不会主动给你这个药，但如果我自己尝试这么方法的话，我也拦不住你。\n\
    \n如今阿利斯泰的治疗已经进入第五个年头，他的肿瘤治疗手段之外，他也坚持在使用阿柏西普单抗，主要的药物配方，是一家叫Care Oncology的个人诊所推荐的，其中包括高负担胆固醇的药（statin）、一种治疗糖尿病的约（metformin）、还有一种抗癌杀菌的药（metronidazole）。\n\
    \n你可能会奇怪，这都什么跟什么啊，没有一种药是治疗癌症的。对。但这些药物都过证明，有一定的治疗癌症的效果。关键是他们不一定是安全的，便宜是便宜用，而且配合起来之后，对阿利斯泰阳性肿瘤的治疗确实起效，这就是“再利用型药物”可行的典型实例。\n\
    \n但你可能也说了，这是个例，在医学上因为每个人的个体差异，奇迹是有的，但能不能肯定认定，“再利用型药物”确实可行呢？\n\n我们不妨来再看一些其他案例，一种叫拉莫三嗪的抗癫痫药，虽然名声不太好，但被研发出对于抑郁症和精神病也有效果。《美国医学会精神病学周刊》的研究表明，常用的降压药厄贝沙坦，用于治疗精神分裂和抑郁症有效。一种叫米诺环素的抗生素，已经被用于治疗自杀治疗。\n\
    \n另外，一些现有药物被发现，对脑癌、寨卡病毒、结核病、运动神经疾病、睡眠打鼾、白血病和血液肿瘤有效。用于治疗男性能勃起功能障碍的“伟哥”——万艾可，最早被制得的用途，是为了治疗冠心病，结果意外发现了新大陆。\n\
    \n《经济学人》的文章里说，“再利用型药物”的前期非常广阔，根据美国非药物数据企业Curious Meds的负责人布鲁斯的说法，美国有9000多种被FDA批准上市的常用药，简直就是等着被药企再次发现新用途的金矿。而另一个慈善组织，抗癌症基金会的研究生，已经在260种抗癌药物中，发现了可以治疗癌症的证据。\n\
    \n要知道一款新药的研发，平均下来要花费超过20亿美元，还要经过各种严格的临床试验测试，而且有很多45%的概率无法通过。整个过程充满高风险和不确定性。\n\n\
    但是已经通过FDA批准上市的药物，安全性达标准，研发创新再上市，至少可以节省3到7年的研发时间，它们被再次批准用于新用途的可能性还非常大，再加上它们的价格只会研发新药的一半多一点，它们可以说有相当的吸引力。尤其是那些已经过了专利保护期的常用药，不仅是既便宜又安全，一旦被发现有用的治疗价值，可以被很快地生产出来，攻击病毒，造福人类。\n\
    \n不过虽然有很多优点，但我们真的想要用上又便宜更好的“再利用型药物”，却面临着重重困难，阻力来自多方群体，这也包括医生，甚至来自病人自身，又是因为什么呢？\n\
    \n### “再利用型药物”面临的困难\n\n就像刚才我们说的，“再利用型药物”想要推广运用广使用，不仅会面临来自制药公司的反对，而且开药医生也面临职业风险，甚至病人自身因为这些药不能进入医保，拒绝使用，我们分别来说说。\n\
    \n对于制药公司来说，虽然一款新药从研发到面市，时间漫长，费用高，但是相对来说，制药公司上市后的利润也非常丰厚，这是支撑着大型药企投入药物研发的基础。\n\n\
    但“再利用型药物”很多都是常用药物，不少已经过了专利保护期，这意味着着不只是原有的制药公司可以生产，任何有资质的药厂都能生产。更重要的是，一款新药被研发使用在说明书上，虽然也要通过测试、临床试验和审核，其成本要比研发新药低得多，但绝不是不要钱。对药企公司来说，为了钱不得不独家生产的权利，这难道在替别人做嫁衣吗？\n\
    \n所以常用的“再利用型药物”，也被制药公司内部戏称为令人感动的“孤儿”。制药公司这种反应，是否有点既得利益者的人道主义精神无关，是纯粹的商业考量，毕竟企业要想赚钱才能活下去嘛。\n\
    \n而对医生来说，病人可以治疗疾病说明书上，没有明确写出可以治疗某些疾病的药物做法，叫做“非指导性用法”（off label）的使用。的确确实有效，但这未必是承担风险的。万一出了事，医生会面临诉讼的风险，甚至因此丢掉工作。\n\
    \n美国的医生执照非常难考，所以原本太多医生的诊疗都偏保守，以安全为先，更别说让他尝试“非常规性用法”了，那种做法在诊疗法上，非理性常用，现实中也不是那么回事儿。还记得之前说的阿利斯泰的主治医生怎么说的吗？他只是不愿意，阻止医生主动开出这样的处方。\n\
    \n这也引出了另一个问题——对病人来说，没有医生的处方和保证，大多数人是不会轻易尝试“再利用型药物”的。像阿利斯泰这样有勇气，又肯下大功夫钻研医学文献的，毕竟是极少数的。\n\
    \n此外，病人群体最大的顾虑是，“再利用型药物”目前还没有被医疗机构和保险公司纳入医保体系，想吃这些药的，全要自己掏腰包，所以要是山穷水尽的地步，病人何苦冒险而坠崖呢？\n\
    \n说到这儿，你也能发现事情也没那么简单，“再利用型药物”的推广，也没想象的那么乐观。《经济学人》的文章里说，这问题不是政府应该去解决，可以通过授予政府补贴，或者开放新的专利保护期，能刺激药企对“再利用型药物”的研发积极性，不但能缓解病人自身承担高额的费用，或许也能给医疗机构带来新的希望。医疗资源有限的患者，打开一扇新的希望之门。\n\
    \n### 总结\n\n很多已经通过了审核上市的药品，被发现可以被用在新的治疗用途上。这种“再利用型药物”，价格便宜，安全性高，但仅仅指望靠市场的力量，很难被推广，制药公司需要利润，医生和患者需要安全，这种情况下，政府倒是可以承担起推手的工作，打破僵局。\n\
    \n而通过今天的内容，我想说的是，相比拥有一个美好的愿望和想法，哪怕是确实可行的方案，如果不能充分保证参与方的利益，依然无法执行。如何在阻力最小的情况下，把想法实施落地，是更重要的事情，也是对智慧更大的考验。\n\
    \n你看好“再利用型药物”的前景吗？为什么？\n\n欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n### 划重点\n\n![](img/82c50821bc552fe72722a78212114e65_61_0.png)\n\
    \n### 资料来源：\n\n- 杂志：\n\n*Drug Repurposing, The Economist, Mar 2, 2019*\n\n*New\
    \ Uses for Old Drugs, The Economist, Mar 2, 2019*\n\n### 下期预告：\n\n明天将给你带来的议题是#游戏主播为何会成为YouTube上最赚钱的人？#\n\
    \nYouTube 2018年收入最高的主播是一名只有7岁的美国小男孩，《福布斯》从行业的角度，分析了背后的原因：游戏文化在年轻群体中的盛行，让YouTube上形成了庞大的用户群；游戏视频的制作简单，在产能上有显著的优势；YouTube平台独特的广告分账方式，让游戏视频极高的播放量可以直接变现，为主播们增加了巨额的收入。这些因素加在一起，让游戏主播成了YouTube上最赚钱的群体。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_61_1.png)\n\n# 211报告 | 游戏主播为何成为YouTube上最赚钱的人？\n\
    \n马徐骏·新知报告\n\n## 今天\n\n玩游戏，也可以很赚钱。\n\n——《福布斯亚洲版》\n\n马徐骏\n\n游戏主播成为2018年YouTube上最赚钱的群体，《福布斯》分析，背后的主要原因有三个：游戏文化的盛行、游戏视频的易制模式、YouTube平台独特的广告分成模式。\n\
    \n今天的内容分为两个部分：\n\n- 当红游戏主播都是什么人？\n- 游戏主播们赚钱的奥秘\n\n最新一期《福布斯》杂志亚洲版，发布了全球最大的视频网站2018版游戏的一张主播收入榜单，在这张榜单上，收入最高的一位主播，每小时的收入几乎超过1500万英镑币，换算成人民币的话，相当于收入几亿。\n\
    \n排在榜上的主播你绝对想不到——是一名只有7岁的美国小男孩，叫Ryan，他专门拍玩具的开箱视频，他在YouTube上聚集了1700万的粉丝，年总收入接近2200万美元！\n\
    \n![](img/82c50821bc552fe72722a78212114e65_62_0.png)\n\n总的来看，这十位主播发布的视频内容五花八门，有人做恶搞视频的，有做科技表头的，还有教人化妆的。但如果仔细看名单，你会发现，游戏主播竟然占了5个席位，完全将“看榜”的YouTube上一般人只能玩游戏的思维，这些人竟然在短时间内里就拿了亿万富翁。\n\
    \n这是怎么回事呢？《福布斯》从行业的角度分析了背后的原因。文章指出，游戏文化在年轻群体中的盛行，形成了观看游戏视频内容的庞大用户群；游戏视频的制作很简单，在生产上有突出的优势；更重要的是，YouTube的广告独特广告分发模式，让游戏视频的视频创作者可以直接变现，为主播们带来巨额收入。\n\
    \n这些因素叠加在一起，就把游戏主播营造成了YouTube上最赚钱的群体。\n\n文章中有一句话说得特别漂亮：\n\n> It pays to be a play.\n\
    \n这句话今天的一句话，还很眼，我把它的内涵来的一句话。这句话什么意思？就是告诉我们，可以看看玩游戏，玩游戏可以很赚钱！\n\n### 当红游戏主播都是什么人？\n\
    \n纵观这次上榜的15位游戏主播，你会发现，他们有手无足同，有的是20-30岁的男性，白手起家，发布玩游戏视频，几年间就成为了亿万富翁。\n\n比如名列榜首排名第四位的英国红人DanTDM（本名Daniel\
    \ Middleton），他主打一款叫《Minecraft》的知名沙盘游戏，6岁时就吸引了超过2000万的粉丝，2017年甚至登上YouTube收入收入第一名。2018年虽然排到第四位，但也赚了1850万美元。截止到目前，他的视频播放量超过了1400亿次。\n\
    \n而粉丝数量最多的，要数瑞典游戏主播PewDiePie，达到了惊人的8913万。他上大学时就在YouTube上开设了频道，火了之后就辍学专心做起了游戏主播。2013年，PewDiePie的订阅人数到2000万人，从300万一下子飙升到1900万，成为YouTube粉丝最多的频道。\n\
    \n至今，PewDiePie依然是YouTube上粉丝数量最多的主播，不过他之前闹出过一些争议和关于人的种肤歧视之说，引发了争议，今年排名滑到第九位。\n\n\
    ![](img/82c50821bc552fe72722a78212114e65_62_1.png)\n\n此外，上榜的还有加拿大游戏主播VanossGaming，今年25岁，在榜单中排名第7。他来自多伦多，是一个从小玩起游戏的游戏博主，他和PewDiePie一样，也是从大学辍学专心做游戏主播，最拿手的是制作一些游戏中的“猎杀式喜剧”，剪辑上很有创意。\n\
    \n紧挨着排名第八的是爱尔兰“恶搞”主播JacksepticeEye，霍雷利的人，靠游戏，但出名，有时甚至自带语音，但他深受粉丝喜爱。\n\n而在这些人里，最励志的就要数排在第六位的Markiplier，《福布斯》杂志这次专门介绍了他。Markiplier是一位夏威夷小伙子，父亲是德国人，母亲是韩国人。2012年，他在罗德岛大学毕业时，遇到了一系列不幸：先是女友被车撞伤，然后女友跟医生分手了；紧接着他被打了一个大洞，没有多久，又发现自己身上长了肿瘤，不得不做手术。\n\
    \n接二连三的打击，让他的心情跌入谷底，决定要做点自己喜欢的事情。于是，他在YouTube上开设了一个频道。开始，他主要发一些恐怖游戏，因为有他声音很有磁性，听着就让人有一种阴森的感觉，但没想到让他火起来的却是解说视频。\n\
    \n为什么火呢？因为Markiplier的解说风格总是意想不到的。他长相时，留著恐怖游戏，但是玩恐怖游戏的时候，会故意玩梗玩小搞怪一样让人心惊胆战，他外表成了巨大的反差。而且他解说游戏的时候很丰富，时常妙语连珠，这也为他带来了大量的粉丝。\n\
    \n知道中国粉丝对他的爱称是什么吗？——“基哥”，意思是他很邪乎可爱。如今，Markiplier是YouTube上最大的游戏主播之一，去年的收入达到了1750万美元，真正从低谷翻身了人生巅峰。\n\
    \n你可能会猜得到，这些游戏主播能火，除了游戏玩得好，肯定也得靠个人魅力，这也很有趣，但也可说是一个种类别的YouTuber红，又有一个缺人力？所以，游戏主播们收入之高，背后一定有更重要的原因。\n\
    \n### 游戏主播们赚钱的奥秘\n\n游戏主播能在YouTube上年收入排行榜上占据一半的席位，背后有着非常重的行业因素：一方面，游戏内含很多粉丝，让游戏主播很容易获得大量的粉丝；另一方面，YouTube独特的广告分成模式，让游戏主播的高人也能去赚取巨额。\n\
    \n为什么游戏主播会容易获得大量粉丝呢？首先来一个很重要的环境因素，就是游戏文化在年轻群体中的盛行。十几年前，游戏的基本是真正的游戏玩家，但随着游戏产业的发展，以主机、PC、移动游戏等多种平台游戏层出不穷，年轻一代已经形成了稳定的文化，从大到小，游戏已成为了男女都在玩着的游戏。\n\
    \n这些年轻人在YouTube上观看视频，游戏类的视频内容也成了一个重要的选择。有些人是来研究游戏实况，还有很多人就所谓的“云玩家”，自己不玩，就喜欢看人玩。这也就为什么这些颜值优秀、人又有趣的游戏主播就快速聚拢了观众的原因——够多好的游戏本就很赚钱了。\n\
    \n而跟其他类型的视频内容相比，游戏视频在内容制作上也是有易有难度，你会发现，它的录制剪辑难度都相对简单，主播只要拍摄自己玩游戏和画面即可。并不需要超好的剪辑。一条游戏视频的时长很容易超过1小时，但照片一看，一些游戏主播能到个20分钟，也是靠每天更新，比如时间对内容制作难度也很有限。\n\
    \n比如，有人无意间看了你的视频，觉得有点意思，再一看看你的背景，内容原来这么好，他可能去你视频里看，成了你的粉丝，而且，随着越来越多看到你的更新，粉丝粘性就会保持越来越久。\n\
    \n当然，真正让游戏主播们能日进斗金的重要因素，是YouTube平台特有的广告分发形式。这和其他视频平台不一样。国内做视频的广告方式，要么是靠植入打广告，要么是发放优惠券，但YouTube的做法是“合作伙伴”计划——允许内容创作者的视频，制作方参与广告，分成，平台占45%，制作方占55%。这个\n"
  mdcn: "\n# 209报告 | “太空淘金”会成为现实吗？\n\n马徐骏 · 新知报告\n\n![](img/82c50821bc552fe72722a78212114e65_58_0.png)\n\
    \n## 今日报告：“太空淘金”会成为现实吗？\n\n小行星采矿，是我们未来向太空扩张的关键——去太空开采资源。\n\n> ——《新科学家》\n\n马徐骏\n\
    \n近地小行星中富含的各种稀贵金属和黄金，不仅能够解决地球资源紧缺的问题，还能为未来的太空旅行、太空移民做准备。\n\n今天的议题分为三个部分：\n\n-\
    \ 为什么要去太空开采资源？\n- 太空开采技术到底难在哪？\n- 太空开采会遇到哪些问题？\n\n在大航海时代到十九世纪美国西部的“淘金热”，人类对于资源的好奇和追逐从来没有停止过。为了获取资源，人类想尽办法、无孔不入。现在，我们终于把目光投向了太空。\n\
    \n《新科学家》杂志最近发表了一篇文章，叫 *The Final Frontier*，文章描述了一个好消息：去太空开采资源已经不再是梦想了，越来越多的企业、研究机构正在投入这个领域的投资研发，而随着技术的不断扩展，未来很可能掀起一场大规模的“太空淘金热”。\n\
    \n### 为什么要去太空开采资源？\n\n人类去太空开采资源，主要有两个原因：解决地球资源紧缺的问题、为人类将来的太空移民做准备。\n\n太空里到底有多少资源呢？目前太空采矿的主要目标，是近地小行星。所以我们就拿这些近地小行星举例。根据NASA的数据，在以这些地球为中心的方圆450万公里的范围内，大约存在着15,000多颗大小不一的小行星。很多小行星都富含钴、镍、铁、锰等稀贵金属或黄金。\n\
    \nNASA测算的结果显示，一颗直径1公里的小行星，就含有3000万吨铱、150万吨镍和7500吨钒。这是一个什么概念呢？我们拿地球上这些资源的储量来做下对比：2017年全球铱储量预测大约是740万吨；全球锰储量大约是10亿吨；钴储量大约1.4万吨。所以，仅仅是一颗1公里的小行星，就拥有差不多一半的全球矿产资源了。\n\
    \n另外，根据美国一家专门做小行星采矿评估的公司数据，一颗直径241米的小行星的价值，可以达到95.8万亿美元。这个数字超过了全世界GDP的总和。\n\n\
    开采这些小行星，除了可以补充地球紧缺资源外，还有一个重要的作用，就是为人类太空旅行、太空探索和太空移民做准备。现在人类如果要进行太空活动，需要向地面携带大量的物资。但换个角度想，如果能将这些物资从近地小行星上获取，就能大大节约直接太空开采的成本。比如：氢和氧可以作为火箭的燃料，而氢和氧都可以通过电解水来获取。根据科学家的估算，一颗直径75米的小行星上储备的氢，就可以让135名航天员，在任务提供能量。除此以外，小行星上富含钴、镍和锰，这些矿产可以制作工业级的钢条，这些钢条可以作为人类进行太空旅行的原材料。另外，如果有大航天真空的共其其他行星上居住的话，我们要在那建造家园，想地球上的资源全都要带过去，显然是不现实的，更可行的办法肯定是“就地取材”。\n\
    \n所以不论是出于哪个目的，太空开采都值得我们去做。那么我们人类下一步呢？技术、现在到底要发展到哪一步了呢？又有多少人在干这个事情呢？\n\n### 太空开采技术到底难在哪？\n\
    \n目前，人类对于太空开采，已经走出了理论阶段，对于太空开采，已经走入了理论阶段，对于太空开采，已经走出了理论阶段，对于太空开采，已经走出了理论阶段，对于太空开采，已经走出了理论阶段，对于太空开采，已经走出了理论阶段。\n\
    \n### 总结\n\n太空中蕴藏着巨大的资源。很多政府、企业，以及投资公司，都很看好它未来的发展。不过，太空采矿还是面临着包括技术、资金和法律在内的巨大的压力。但是，探索小行星的意义不仅仅是挖矿，更主要的是它可以扩展人类探索太空的眼界和脚步，成为人类进入深空的助推器。\n\
    \n正如美国行星资源公司说的那样：小行星采矿，是我们未来向太空扩张的关键。\n\n> Asteroid mining is the key to our future\
    \ expansion into space.\n\n这句话，也被我选为今天的金句。\n\n最后说一点我自己的想法，在创新上，有一个叫“相邻可能”的概念，意思就是，只有当某种技术成熟之后，才会打开下一种创新的可能，比如，如果没有晶体管和集成电路技术，仅靠机械结构，再精巧的计算机都不可能实现高速计算，这就是相邻可能。而可回收火箭技术逐渐成熟，降低人类进入太空的成本，是太空开采的前提，马斯克的Space\
    \ X公司是在这方面的努力，就在为人类利用太空资源打下相邻可能的基础。\n\n在你看来，去太空开采资源，是一件值得做的事情吗？\n\n欢迎留言告诉我，也欢迎你把今天的内容转发给自己的朋友。\n\
    \n### 划重点\n\n- **今日得到：**\n    1. 人类去太空开采资源的两大原因：解决地球资源紧张的问题、为人类将来的太空生活做准备。\n \
    \   2. 太空开采面临的三大问题：技术问题、资金和成本问题、法律问题。\n    3. 一颗叫做241 Germanya的小行星的估值，可以达到95.8万亿美元，这个数字超过了全世界GDP的总和。\n\
    \    4. 关于太空资源的所有权，各个国家的法律存在着巨大的矛盾，很有可能引发争端。\n\n### 资料来源：\n\n刊物：\n\n*Japan's Hayabusa\
    \ 2 May Finally Kick-start The Asteroid Mining Era, by Leah Crane, New Scientist,\
    \ 23 February, 2019*\n\n网站：\n\n*Single Asteroid Worth £ 60 Trillion If It Was\
    \ Mined – As Much As World Earns in A Year, by Rob Waugh, Daily Mail, 31 July\
    \ 2014*\n\n*Who Owns Space? US Asteroid-Mining Act Is Dangerous and Potentially\
    \ Illegal, by Gbenga Oduntan, The Conversation.*\n\n### 下期预告：\n\n明天将给你带来的是议题是#“再利用型药物”为什么这么难？#\n\
    \n有没有什么办法，可以让普通人用上价格低廉又有效药的药品呢？《经济学人》杂志国际版提出了一个方案——推广“再利用型药物”，也就是重新发掘现有药品的新疗效和新作用，这样既可以减少药品的研发时间、降低成本，风险也低得多。\n\
    \n# 210报告 | 为什么“再利用型药物”面世这么难？\n\n马修彼 · 新知报告\n\n## 今日报告：为什么“再利用型药物”面世这么难？\n\n或许，某种“神药”早就已经被发现甚至面市了，它所需要的，只是以正确的方式被再利用。\n\
    \n——《经济学人》\n\n### 马修彼\n\n今天的议题分为两个部分：\n\n- “再利用型药物”是什么？\n- “再利用型药物”面临的困难\n\n我们经常会听到对于新药价格昂贵的抱怨。站在老百姓的角度，当然希望能以相对低的价钱买到好药。但站在制药厂的角度，研发一款新药动辄几十年，需要几十亿美元的投入，如果不能收回成本，获得高额的利润，制药公司哪还有动力去研发新药？那有没有其他方法，可以让普通人用低价格就能买到疗效好的药品呢？\n\
    \n《经济学人》国际版就提出了一个解决方案，叫做“再利用型药物”（Repurposed drugs），什么意思呢？就是从现成的药品里重新发现出新疗效，新作用，来治疗其他类型的病，比如用降压药来治疗精神疾病。\n\
    \n这样做的好处是，既可以减少药物的研发时间，降低成本，风险也低得多，因为这些药物本都已经通过了测试，且被人们使用了多年，安全性是有保障的。\n\n用文章里的说法就是：有海量的常用药物，等待着被挖掘出新的用途——There\
    \ is a huge untapped medicine chest of generic drugs with unexploited uses.\n\n\
    这种思路，相当于在存量中挖矿，用成本创新的方式来找新药。所以《经济学人》也说：或许某些“神药”，早就已经被发现甚至面市了，它所需要的只是以正确的方式被再利用。\n\
    \nThe next wonder-drug may already have been discovered and bottled; it just needs\
    \ repurposing.\n\n这句话也被我选为今天的金句了。\n\n### “再利用型药物”为什么可行？\n\n看完整对“再利用型药物”的介绍，你可能会问一个疑问：这不就是旧药新用吗？那有什么能说的呢？新闻嘛！《经济学人》给出的答案是：可以，还提供了很多实例来证明。\n\
    \n文章里讲了一个叫阿利斯泰的英国病人，2014年查出他脑子里长了恶性肿瘤，几年之后就会要他的命。更糟糕的是，他的肿瘤无法手术。\n\n阿利斯泰希望通过自己翻找医学文献和案例发现，有一种叫西妥昔单抗，把几种常用的药物混合在一起服用，可以帮助他缓解类似药物的患者起效的作用，关键是这样药又便宜，在咨询主治医生之后，阿利斯泰得到医生的回应是：虽然我不会主动给你这个药，但如果我自己尝试这么方法的话，我也拦不住你。\n\
    \n如今阿利斯泰的治疗已经进入第五个年头，他的肿瘤治疗手段之外，他也坚持在使用阿柏西普单抗，主要的药物配方，是一家叫Care Oncology的个人诊所推荐的，其中包括高负担胆固醇的药（statin）、一种治疗糖尿病的约（metformin）、还有一种抗癌杀菌的药（metronidazole）。\n\
    \n你可能会奇怪，这都什么跟什么啊，没有一种药是治疗癌症的。对。但这些药物都过证明，有一定的治疗癌症的效果。关键是他们不一定是安全的，便宜是便宜用，而且配合起来之后，对阿利斯泰阳性肿瘤的治疗确实起效，这就是“再利用型药物”可行的典型实例。\n\
    \n但你可能也说了，这是个例，在医学上因为每个人的个体差异，奇迹是有的，但能不能肯定认定，“再利用型药物”确实可行呢？\n\n我们不妨来再看一些其他案例，一种叫拉莫三嗪的抗癫痫药，虽然名声不太好，但被研发出对于抑郁症和精神病也有效果。《美国医学会精神病学周刊》的研究表明，常用的降压药厄贝沙坦，用于治疗精神分裂和抑郁症有效。一种叫米诺环素的抗生素，已经被用于治疗自杀治疗。\n\
    \n另外，一些现有药物被发现，对脑癌、寨卡病毒、结核病、运动神经疾病、睡眠打鼾、白血病和血液肿瘤有效。用于治疗男性能勃起功能障碍的“伟哥”——万艾可，最早被制得的用途，是为了治疗冠心病，结果意外发现了新大陆。\n\
    \n《经济学人》的文章里说，“再利用型药物”的前期非常广阔，根据美国非药物数据企业Curious Meds的负责人布鲁斯的说法，美国有9000多种被FDA批准上市的常用药，简直就是等着被药企再次发现新用途的金矿。而另一个慈善组织，抗癌症基金会的研究生，已经在260种抗癌药物中，发现了可以治疗癌症的证据。\n\
    \n要知道一款新药的研发，平均下来要花费超过20亿美元，还要经过各种严格的临床试验测试，而且有很多45%的概率无法通过。整个过程充满高风险和不确定性。\n\n\
    但是已经通过FDA批准上市的药物，安全性达标准，研发创新再上市，至少可以节省3到7年的研发时间，它们被再次批准用于新用途的可能性还非常大，再加上它们的价格只会研发新药的一半多一点，它们可以说有相当的吸引力。尤其是那些已经过了专利保护期的常用药，不仅是既便宜又安全，一旦被发现有用的治疗价值，可以被很快地生产出来，攻击病毒，造福人类。\n\
    \n不过虽然有很多优点，但我们真的想要用上又便宜更好的“再利用型药物”，却面临着重重困难，阻力来自多方群体，这也包括医生，甚至来自病人自身，又是因为什么呢？\n\
    \n### “再利用型药物”面临的困难\n\n就像刚才我们说的，“再利用型药物”想要推广运用广使用，不仅会面临来自制药公司的反对，而且开药医生也面临职业风险，甚至病人自身因为这些药不能进入医保，拒绝使用，我们分别来说说。\n\
    \n对于制药公司来说，虽然一款新药从研发到面市，时间漫长，费用高，但是相对来说，制药公司上市后的利润也非常丰厚，这是支撑着大型药企投入药物研发的基础。\n\n\
    但“再利用型药物”很多都是常用药物，不少已经过了专利保护期，这意味着着不只是原有的制药公司可以生产，任何有资质的药厂都能生产。更重要的是，一款新药被研发使用在说明书上，虽然也要通过测试、临床试验和审核，其成本要比研发新药低得多，但绝不是不要钱。对药企公司来说，为了钱不得不独家生产的权利，这难道在替别人做嫁衣吗？\n\
    \n所以常用的“再利用型药物”，也被制药公司内部戏称为令人感动的“孤儿”。制药公司这种反应，是否有点既得利益者的人道主义精神无关，是纯粹的商业考量，毕竟企业要想赚钱才能活下去嘛。\n\
    \n而对医生来说，病人可以治疗疾病说明书上，没有明确写出可以治疗某些疾病的药物做法，叫做“非指导性用法”（off label）的使用。的确确实有效，但这未必是承担风险的。万一出了事，医生会面临诉讼的风险，甚至因此丢掉工作。\n\
    \n美国的医生执照非常难考，所以原本太多医生的诊疗都偏保守，以安全为先，更别说让他尝试“非常规性用法”了，那种做法在诊疗法上，非理性常用，现实中也不是那么回事儿。还记得之前说的阿利斯泰的主治医生怎么说的吗？他只是不愿意，阻止医生主动开出这样的处方。\n\
    \n这也引出了另一个问题——对病人来说，没有医生的处方和保证，大多数人是不会轻易尝试“再利用型药物”的。像阿利斯泰这样有勇气，又肯下大功夫钻研医学文献的，毕竟是极少数的。\n\
    \n此外，病人群体最大的顾虑是，“再利用型药物”目前还没有被医疗机构和保险公司纳入医保体系，想吃这些药的，全要自己掏腰包，所以要是山穷水尽的地步，病人何苦冒险而坠崖呢？\n\
    \n说到这儿，你也能发现事情也没那么简单，“再利用型药物”的推广，也没想象的那么乐观。《经济学人》的文章里说，这问题不是政府应该去解决，可以通过授予政府补贴，或者开放新的专利保护期，能刺激药企对“再利用型药物”的研发积极性，不但能缓解病人自身承担高额的费用，或许也能给医疗机构带来新的希望。医疗资源有限的患者，打开一扇新的希望之门。\n\
    \n### 总结\n\n很多已经通过了审核上市的药品，被发现可以被用在新的治疗用途上。这种“再利用型药物”，价格便宜，安全性高，但仅仅指望靠市场的力量，很难被推广，制药公司需要利润，医生和患者需要安全，这种情况下，政府倒是可以承担起推手的工作，打破僵局。\n\
    \n而通过今天的内容，我想说的是，相比拥有一个美好的愿望和想法，哪怕是确实可行的方案，如果不能充分保证参与方的利益，依然无法执行。如何在阻力最小的情况下，把想法实施落地，是更重要的事情，也是对智慧更大的考验。\n\
    \n你看好“再利用型药物”的前景吗？为什么？\n\n欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n### 划重点\n\n![](img/82c50821bc552fe72722a78212114e65_61_0.png)\n\
    \n### 资料来源：\n\n- 杂志：\n\n*Drug Repurposing, The Economist, Mar 2, 2019*\n\n*New\
    \ Uses for Old Drugs, The Economist, Mar 2, 2019*\n\n### 下期预告：\n\n明天将给你带来的议题是#游戏主播为何会成为YouTube上最赚钱的人？#\n\
    \nYouTube 2018年收入最高的主播是一名只有7岁的美国小男孩，《福布斯》从行业的角度，分析了背后的原因：游戏文化在年轻群体中的盛行，让YouTube上形成了庞大的用户群；游戏视频的制作简单，在产能上有显著的优势；YouTube平台独特的广告分账方式，让游戏视频极高的播放量可以直接变现，为主播们增加了巨额的收入。这些因素加在一起，让游戏主播成了YouTube上最赚钱的群体。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_61_1.png)\n\n# 211报告 | 游戏主播为何成为YouTube上最赚钱的人？\n\
    \n马徐骏·新知报告\n\n## 今天\n\n玩游戏，也可以很赚钱。\n\n——《福布斯亚洲版》\n\n马徐骏\n\n游戏主播成为2018年YouTube上最赚钱的群体，《福布斯》分析，背后的主要原因有三个：游戏文化的盛行、游戏视频的易制模式、YouTube平台独特的广告分成模式。\n\
    \n今天的内容分为两个部分：\n\n- 当红游戏主播都是什么人？\n- 游戏主播们赚钱的奥秘\n\n最新一期《福布斯》杂志亚洲版，发布了全球最大的视频网站2018版游戏的一张主播收入榜单，在这张榜单上，收入最高的一位主播，每小时的收入几乎超过1500万英镑币，换算成人民币的话，相当于收入几亿。\n\
    \n排在榜上的主播你绝对想不到——是一名只有7岁的美国小男孩，叫Ryan，他专门拍玩具的开箱视频，他在YouTube上聚集了1700万的粉丝，年总收入接近2200万美元！\n\
    \n![](img/82c50821bc552fe72722a78212114e65_62_0.png)\n\n总的来看，这十位主播发布的视频内容五花八门，有人做恶搞视频的，有做科技表头的，还有教人化妆的。但如果仔细看名单，你会发现，游戏主播竟然占了5个席位，完全将“看榜”的YouTube上一般人只能玩游戏的思维，这些人竟然在短时间内里就拿了亿万富翁。\n\
    \n这是怎么回事呢？《福布斯》从行业的角度分析了背后的原因。文章指出，游戏文化在年轻群体中的盛行，形成了观看游戏视频内容的庞大用户群；游戏视频的制作很简单，在生产上有突出的优势；更重要的是，YouTube的广告独特广告分发模式，让游戏视频的视频创作者可以直接变现，为主播们带来巨额收入。\n\
    \n这些因素叠加在一起，就把游戏主播营造成了YouTube上最赚钱的群体。\n\n文章中有一句话说得特别漂亮：\n\n> It pays to be a play.\n\
    \n这句话今天的一句话，还很眼，我把它的内涵来的一句话。这句话什么意思？就是告诉我们，可以看看玩游戏，玩游戏可以很赚钱！\n\n### 当红游戏主播都是什么人？\n\
    \n纵观这次上榜的15位游戏主播，你会发现，他们有手无足同，有的是20-30岁的男性，白手起家，发布玩游戏视频，几年间就成为了亿万富翁。\n\n比如名列榜首排名第四位的英国红人DanTDM（本名Daniel\
    \ Middleton），他主打一款叫《Minecraft》的知名沙盘游戏，6岁时就吸引了超过2000万的粉丝，2017年甚至登上YouTube收入收入第一名。2018年虽然排到第四位，但也赚了1850万美元。截止到目前，他的视频播放量超过了1400亿次。\n\
    \n而粉丝数量最多的，要数瑞典游戏主播PewDiePie，达到了惊人的8913万。他上大学时就在YouTube上开设了频道，火了之后就辍学专心做起了游戏主播。2013年，PewDiePie的订阅人数到2000万人，从300万一下子飙升到1900万，成为YouTube粉丝最多的频道。\n\
    \n至今，PewDiePie依然是YouTube上粉丝数量最多的主播，不过他之前闹出过一些争议和关于人的种肤歧视之说，引发了争议，今年排名滑到第九位。\n\n\
    ![](img/82c50821bc552fe72722a78212114e65_62_1.png)\n\n此外，上榜的还有加拿大游戏主播VanossGaming，今年25岁，在榜单中排名第7。他来自多伦多，是一个从小玩起游戏的游戏博主，他和PewDiePie一样，也是从大学辍学专心做游戏主播，最拿手的是制作一些游戏中的“猎杀式喜剧”，剪辑上很有创意。\n\
    \n紧挨着排名第八的是爱尔兰“恶搞”主播JacksepticeEye，霍雷利的人，靠游戏，但出名，有时甚至自带语音，但他深受粉丝喜爱。\n\n而在这些人里，最励志的就要数排在第六位的Markiplier，《福布斯》杂志这次专门介绍了他。Markiplier是一位夏威夷小伙子，父亲是德国人，母亲是韩国人。2012年，他在罗德岛大学毕业时，遇到了一系列不幸：先是女友被车撞伤，然后女友跟医生分手了；紧接着他被打了一个大洞，没有多久，又发现自己身上长了肿瘤，不得不做手术。\n\
    \n接二连三的打击，让他的心情跌入谷底，决定要做点自己喜欢的事情。于是，他在YouTube上开设了一个频道。开始，他主要发一些恐怖游戏，因为有他声音很有磁性，听着就让人有一种阴森的感觉，但没想到让他火起来的却是解说视频。\n\
    \n为什么火呢？因为Markiplier的解说风格总是意想不到的。他长相时，留著恐怖游戏，但是玩恐怖游戏的时候，会故意玩梗玩小搞怪一样让人心惊胆战，他外表成了巨大的反差。而且他解说游戏的时候很丰富，时常妙语连珠，这也为他带来了大量的粉丝。\n\
    \n知道中国粉丝对他的爱称是什么吗？——“基哥”，意思是他很邪乎可爱。如今，Markiplier是YouTube上最大的游戏主播之一，去年的收入达到了1750万美元，真正从低谷翻身了人生巅峰。\n\
    \n你可能会猜得到，这些游戏主播能火，除了游戏玩得好，肯定也得靠个人魅力，这也很有趣，但也可说是一个种类别的YouTuber红，又有一个缺人力？所以，游戏主播们收入之高，背后一定有更重要的原因。\n\
    \n### 游戏主播们赚钱的奥秘\n\n游戏主播能在YouTube上年收入排行榜上占据一半的席位，背后有着非常重的行业因素：一方面，游戏内含很多粉丝，让游戏主播很容易获得大量的粉丝；另一方面，YouTube独特的广告分成模式，让游戏主播的高人也能去赚取巨额。\n\
    \n为什么游戏主播会容易获得大量粉丝呢？首先来一个很重要的环境因素，就是游戏文化在年轻群体中的盛行。十几年前，游戏的基本是真正的游戏玩家，但随着游戏产业的发展，以主机、PC、移动游戏等多种平台游戏层出不穷，年轻一代已经形成了稳定的文化，从大到小，游戏已成为了男女都在玩着的游戏。\n\
    \n这些年轻人在YouTube上观看视频，游戏类的视频内容也成了一个重要的选择。有些人是来研究游戏实况，还有很多人就所谓的“云玩家”，自己不玩，就喜欢看人玩。这也就为什么这些颜值优秀、人又有趣的游戏主播就快速聚拢了观众的原因——够多好的游戏本就很赚钱了。\n\
    \n而跟其他类型的视频内容相比，游戏视频在内容制作上也是有易有难度，你会发现，它的录制剪辑难度都相对简单，主播只要拍摄自己玩游戏和画面即可。并不需要超好的剪辑。一条游戏视频的时长很容易超过1小时，但照片一看，一些游戏主播能到个20分钟，也是靠每天更新，比如时间对内容制作难度也很有限。\n\
    \n比如，有人无意间看了你的视频，觉得有点意思，再一看看你的背景，内容原来这么好，他可能去你视频里看，成了你的粉丝，而且，随着越来越多看到你的更新，粉丝粘性就会保持越来越久。\n\
    \n当然，真正让游戏主播们能日进斗金的重要因素，是YouTube平台特有的广告分发形式。这和其他视频平台不一样。国内做视频的广告方式，要么是靠植入打广告，要么是发放优惠券，但YouTube的做法是“合作伙伴”计划——允许内容创作者的视频，制作方参与广告，分成，平台占45%，制作方占55%。这个\n"
