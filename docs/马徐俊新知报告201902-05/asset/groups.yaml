    明天的议题是#追求“美”怎样阻碍了科学发展？#


    《鹦鹉螺》最近刊登的一篇文章表示，科学发展历史上的很多弯路，竟然都是因为科学家对“美”的追求导致的。那么，科学家的审美追求是什么样的，追求美为什么会阻碍科学发展呢？


