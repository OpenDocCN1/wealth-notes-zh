    \ Pictures, by Kathleen McAuliffe, The Atlantic, March, 2019*\n\n## 下期预告：\n\n\
    明天将给你带来的一议题是#“全民基本收入”可行么#\n\n“全民基本收入”也叫UBI，它指的是，不管有没有工作者或者其他收入，也不管你有多少资产，只要你是某国的公民，就“零门槛”定期发放给你的一笔钱。在过去的两年，芬兰做了一个UBI的落地实验，引起了《经济学人》《彭博》《赫芬顿邮报》《卫报》的争相报道，实验结果用一句话来概括就是：全民基本收入不能促进就业，但能提升受试者的幸福感以及健康状况。\n\
    \n# 196报告丨城市为什么不该灭鼠？\n\n![](img/82c50821bc552fe72722a78212114e65_30_0.png)\n\n\
    ## 196报告 | 城市为什么不该灭鼠？\n\n**和鼠鼠相比，我们需要做的是保持城市老态鼠群数量的稳定，减少鼠群的流动。**\n\n> —— —— ——\
    \ —— 《鹤鸣录》\n\n（左侧有一个用户头像，右侧为用户名“马晓波”）\n\n**马晓波**\n\n“捉鼠”策略可远没有有效，故捕鼠者来：“灭乎见影”，但投资。这是能有效控制鼠群数量、减少疾病传播的正确思路。为什么呢？\n\
    \n今天的议题分为两个部分：\n\n-   为什么灭鼠反而会加剧疾病传播？\n-   变“灭鼠”为“控鼠”\n\n城市鼠灾是一个全球性的问题。纽约、洛杉矶、巴黎等大都市都饱受过“鼠满为患”的问题。每年要投入巨额资金来灭鼠。可是，知名科学家《鹞鸮录》最新刊登的一篇研究，却提出了一个颠覆性的观点：目前各国城市大力灭鼠的作为，不仅灭不掉老鼠，还很可能加剧疾病传播。\n\
    \n文章介绍了加拿大英属哥伦比亚大学的知名病理学家哈尔斯·希斯沃思（Chelsea Hilsworth）的最新研究成果。希斯沃思教授的团队对温哥华城市老鼠群展开了多年的追踪调查，结果显示，城市中“老态的群群有着鲜明的地域聚集的特点。大规模的灭鼠行为，无法彻底消灭老鼠，只会让群群逃离它们的“据点”；在迁徙过程中，它们会有其他地区的鼠友发生冲突，在与它们身上携带的病毒杂杂交，这些疾病会，甚至产生新的新疾病。这些新病毒，会通过老鼠传播给人类。\n\
    \n这个发现，确实有点反直觉。之前全球各大城市的灭鼠项目，带往的是“见鼠就灭的机会。但这项研究关注的新闻是，鼠鼠真正可怕的是，不在于鼠群数量的多少，而在于“流动性”和“传播性”。不讲究策略地灭杀、驱赶，反而会增强鼠群的流动性，带疾病传播的扩散，甚至催生新型病原体的出现。\n\
    \n那么，难道就放任老鼠不管了吗？当然不是。文章给出的建议是，各个城市应该转变灭鼠策略，变灭鼠为控鼠，减少鼠群的流动，这样才可能有效地控制疫病传播。\n\n\
    文章中：和鼠鼠相比，我们需要做的是保持城市老态鼠群数量的稳定，减少鼠群的流动——这是基于对城市鼠群的深入研究才能获得的发现。\n\n```\nRather\
    \ than focusing on killing city rats, we need to try to keep their populations\
    \ stable and in place.\n```\n\n这句话，也被选为今天的金句。\n\n![](img/82c50821bc552fe72722a78212114e65_30_1.png)\n\
    \n### I 为什么灭鼠反而会加剧疾病传播？\n\n之所以灭鼠反而会加剧疾病传播，原因就在于“流动性”两个字上。希斯沃思教授的团队花了六年的时间，对温哥华城市里的鼠鼠鼠群进行了追踪和普查。他们发现，目前看似“彻底”的灭鼠方法，其实很缺乏实效，反而会刺激鼠鼠进行流动和迁移。而疾病的传播，恰恰是流动的结果。\n\
    \n为什么会产生流动呢？因为老鼠在城市里的生活状态和人们之前预想的完全不同，它们并不是通过在下水道四处乱窜的，而是以家族为单位，在一个固定的地方聚群。它们的领地意识非常强，不同街区之间的鼠鼠家族彼此泾渭分明，井水不犯河水。\n\
    \n一旦某个街区展开了灭鼠行动，那么这个老家族极有可能集体举家出逃，它们体内携带的细菌和病毒，也有了向外传播的机会。几乎一旦它们跑到新的老鼠的地盘上，几乎与占据当地的老鼠发生激烈的撕咬和争斗，场面异常惨烈，常常会咬得皮开肉绽，鲜血直流。\n\
    \n另外，当有“入侵者”，当地的老鼠往往会自卫，还会无辜地散发地驱赶出来，占示领地位。这些状况，都为病毒的传播提供了绝佳的“机会”。\n\n科学家发现，正是在这些撕咬和争斗当中，不同区域的鼠鼠之间的病毒，杂交传染、融合，甚至催生新的病原种类。老鼠的消化道，就像一个超级工厂，为这些病毒的交融和演化提供了一个完美的场所。\n\
    \n你可能想过，都是老鼠，身上携带的细菌和病毒难道还不一样吗？要有告诉你的，老鼠身上不同的菌，带着明显的区域性。从根源上来说，这些细菌不是老鼠自身携带的，绝大部分都是它们从周边环境中获取，又在自己的消化道内融合而成的。\n\
    \n举个例子，有一种极其名贵的超级抗药菌，叫“抗甲氧西林金黄色葡萄球菌”，感染的人会出现致死性感染，大多数抗生素都没办法。希斯沃思教授团队在温哥华某街区的老鼠体内，发现了这种金黄色葡萄球菌的一种新异体。通过分析，他们发现这种新异体有一些基因片段，明显来自另一种叫“耐红霉素肺炎链球菌”的超级细菌，而这种链球菌一般只会在养家动物，比如宠物身上发现。\n\
    \n这么一来，就可以推测，这些老鼠从下水道或垃圾中，获取了“抗甲氧西林金黄色葡萄球菌”，又在它们的消化道中，获取了宠物狗身上的“耐红霉素肺炎链球菌”。在老鼠消化道中，两种菌互相融合，诞生了新的病原类。这些新的细菌，最后很有可能会随着老鼠的排泄物和唾液，传染给人类。\n\
    \n刚一开始了，由于老鼠极强的领地意识，某一街区老鼠身上的病菌，一般都被限制在这个领区之内，很少外传。可是，大规模的灭鼠行为，很有可能会造成老态鼠群的逃散。这逃散老鼠身上带的病毒，就有了扩散的机会。灭鼠行为导致的鼠群流动，反而变相推动了病菌的传播。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_30_2.png)\n\n### I 变“灭鼠”为“控鼠”\n\n如果说希斯沃思教授团队的研究结论成立，那目前全球各大城市都推行的灭鼠政策就都是。更好的策略，并不是消灭老鼠和驱赶，而似乎是——什么都不做，甚至它们对。\n\
    \n听到这，你可能会觉得不服，人总比老鼠厉害吧？现在的灭鼠方式已经那么多样，各种毒饵、诱捕器，不出一片老鼠都死光了，人类的灭鼠方法杀不了老鼠的。因为老鼠的繁殖能力和生存能力，出乎意料地强悍。\n\
    \n文章中有一句话总结得很到位——“在动物中，除老鼠、狗一样接受人类的寄养驯化，活到较长寿得比老鼠长寿的。\n\n老鼠是在“脏乱差”中生存的高手，环境越乱，它生活得越滋润。老鼠需要的资源并不多，有少得的活物腐食，有水和小量食物就能过下来。而人类城市在进行带带来的混乱，恰为老鼠的生存繁殖提供了极好的环境。\n\
    \n换句话说，老鼠相比人类要适应城市生活。这也是为什么纽约、巴黎鼠患成灾，而当地市政府不停地灭杀、诱捕、驱赶，却始终无法起到好效果的主要原因。\n\n希斯沃思教授建议，我们应该转变灭鼠策略，变“灭鼠”为“控鼠”。也就是说，把侧重从“灭杀”放到“减少鼠群的流动性”上来。因为目前新型带给我们的灾难性的是，本地老鼠被杀干净，带来老鼠才危险。新的老鼠就意味着新的病菌。\n\
    \n从控制疾病传播的角度来说，维持当地鼠群数量的稳定，甚至是一件相当重要的事。\n\n举个例子，温哥华港是加拿大最大的港口，希斯沃思教授曾经研究温哥华港附近的鼠群。他发现这只鼠鼠鼠在杀了老港的鼠群以后，发现它们...\n\
    \n聚居的鼠群，她发现这里的老鼠耳朵里，普遍都有一种很特别的螨虫。这种螨虫在加拿大本土是没有的，一般只出现在亚洲。那为什么温哥华港的老鼠耳朵里会有呢？很容易想到，肯定是因为温哥华港有大量货物来自海外，带来了传染的机会。\n\
    \n可研究者发现，这些外来螨虫只能在温哥华港的鼠群中找到，温哥华其他区域的老鼠耳朵里就没有。这说明了什么呢？这说明温哥华港的鼠群，对外来的传染物起到了一个“缓冲器”的作用。当地鼠群的相对稳定，有效地阻止了外来螨虫的进一步扩散传播。\n\
    \n可是，要是不去灭杀的话，又怎么能保持鼠群数量的稳定，不会让老鼠过度繁衍，鼠患成灾呢？科学家们给出的答案是：减少混乱，创造更整洁有序的城市环境。\n\n\
    刚才我们也讲了，老鼠是在混乱中生存的专家。整洁和秩序，对它们来说就等同于“不宜居”。调查发现，那些城市中脏乱差的地区，老鼠的数量往往也更多，因为这里是它们的乐园。环境越混乱，它们就能获取越多的生存资源。相反，街区越整洁越有序，老鼠的生存空间就越小。\n\
    \n听起来，这种“控鼠”策略可远远没有投毒、放捕鼠器来得干脆，来得“立竿见影”，但其实，这才是有效控制鼠群数量，又能最大限度地减少鼠群流动性的良方。\n\n\
    ## 总结\n\n回到最初那个问题：城市应该灭鼠吗？答案是不该，因为灭鼠很可能会带来加剧病菌传播的反效果；真正应该做的，是“控鼠”。这个反常识的结论，是靠研究者通过对城市鼠群展开长期追踪，深入了解了老鼠的习性和特点，才得出来的科学发现。\n\
    \n这条新知给我们的另一个启示是：有时候，更好的解决方案恰恰是反直觉的。想要不受直觉的干扰，你就必须搞清楚真正的目标是什么。\n\n就拿灭鼠这件事来说，之所以要灭鼠，不是因为老鼠看着讨厌，而是因为老鼠会传播疾病，把老鼠对疾病的传播范围控制到最小，这才是最终的目标所在。从这个目标出发，人们才能明白，为什么把“灭鼠”变为“控鼠”才是更正确的决策。就像蒂姆·哈福德在《混乱》里说的，给复杂的世界建立一个简单的目标，有时候只会适得其反。\n\
    \n你在生活中，还遇到过哪些更好的解决方案，是和我们的直觉相反的？\n\n欢迎在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n## 划重点\n\
