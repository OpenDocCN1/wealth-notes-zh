    明天的议题是#“恐惧”有哪些好处？#


    为什么有人会喜欢看恐怖片，甚至喜欢玩鬼屋游戏？这种恐怖的体验是好还是不好？《新科学家》最新发表的文章提出，在安全环境下产生的“恐惧”，不仅有益身心健康，还能促进亲密关系。这是为什么呢？


    ## 193报告｜适度的恐惧有哪些好处？


    ![](img/82c50821bc552fe72722a78212114e65_24_0.png)


    **今日报告：适度的恐惧有哪些好处?**


    有些人渴望并喜欢恐怖, 是因为这让让他们拥有一种对自身恐惧的掌控感。


    > ——《新科学家》


    马徐骏


    你知道吗, 在安全的环境下, 适度的恐惧就像一块“心灵橡皮擦”, 能够擦去你内心的烦恼, 还能提升你的免疫力。


    今天的议题分为两个部分:


    - 为什么说恐惧能促亲密关系?

    - “安全的恐惧”有益身心健康


    为什么有人喜欢观看恐怖片、甚至尖叫?“鬼屋”体验那种担惊受怕、声尖气哑的感觉? 有没有约过对象、恋饰饰、甩鬼屋这种“恐怖娱乐”, 难道不会造成心理阴影么?


    最近《新科学家》杂志刊登了一篇文章, 就回答了这个问题。文章的标题是《为什么我们喜欢恐怖片?》 (Why We Love Horror), 作者切尔西·怀特
    (Chelsea Whyer) 是《新科学家》的一名记者。怀特在文章里指出, 和我们常认为的“危险相反, 无处要看到恐怖片, 还是去鬼屋, 刺激, 在这种安全环境下产生的恐惧感,
    不仅不会造成心理阴影, 反而有益于身心健康, 还能促近亲密关系: 同时, 是否喜欢带有恐怖元素的娱乐活动, 还能突显出一个人的性格特质。


    ![](img/82c50821bc552fe72722a78212114e65_24_1.png)


    ### 1 为什么说恐惧能促亲密关系?


    丹麦奥斯陆大学有一位学者叫马库斯·克拉森, 他十把不同的学科融合在一起, 包括社会科学、人类行为生物学和心理学等, 进行恐怖研究 (Horror Study),
    尤其是恐怖电影、恐怖小说这样的内容对人类个体和社会造成的影响。


    克拉森带领团队做过一个团体“鬼屋”探索实验, 他们发现, 在这种安全的恐怖环境中, 参与游戏的成员之间的亲密关系会被加强。


    研究是这么做的: 克拉森召集了280名游客, 去一个“鬼屋”玩游戏, 这个鬼屋像是一个旧工厂, 里面有30个房间, 每个房间的恐怖程度都不一样, 比如, 有些房间只光线比较暗,
    感觉比较阴森, 恐怖程度比较低, 有的房间全部扮成恐怖片演员扑向你, 这个恐怖程度就会高一些。


    进入鬼屋前, 这些游客被要求, 在进入鬼屋后要想办法控制自己的恐惧感, 有两个选项: 一个是尽量降低自己的恐惧感, 另一个是尽可能增强自己的恐惧感。


    当他们从鬼屋里出来后, 研究者对他们进行了采访, 结果跟他们说, 那些被要求加强恐惧感的A组, 他们的注意力被引到集中, 并且不断给自己做心理暗示: 告诉自己在当前的环境里感觉很危险;
    遇到恐怖设置的时候, 他们还故意尖叫, 加强自己的恐惧感。


    这些行为果然产生了效果, 这一组游客都感觉自己变得更勇敢了。


    而那些被要求减少恐惧感的人, 做的事情恰恰相反, 他们刻意将注意力转移到手开人的鬼屋设置, 或者是拉住同伴的手, 和同伴抱在一起来保护自己, 这些行为也有效地缓解了他们的恐惧感。


    但这两类人都起过一个共同的感觉——他们都觉得, 和一起玩鬼屋的伙伴之间的关系, 比以前更亲密了。


    为什么会这样呢? 运动生理学者考克斯·肯达尔 (Kris Kendal) 是这样解释的: 人类大脑有一种反应, 就是向他人结伴来增生存的几率。当人们害怕时,
    身体会释放更多皮质醇, 这是一种亲社交性的激素, 能让人更加友善、更愿意信任他人, 和别合作, 这也就加深了彼此的关系, 这也是在鬼屋里, 人们会紧紧彼此的手,
    会抱住在一起了。


    所以, 下次组织团建时, 假如你们团队里有胆子特别小的, 你们不妨可以试安排一场恐怖主题的密室活动, 因为适度的恐怖, 能让团队的凝聚力更强。


    那么, 从个人的角度来看, “恐惧”还有没有相应的好处呢?


    ![](img/82c50821bc552fe72722a78212114e65_24_2.png)


    ### 2 “安全的恐惧”有益身心健康


    怀特说, 恐怖娱乐活动带来的恐惧感, 叫做“安全的恐惧”, 它对人们的身心健康有三个好处: 首先, 它能缓解焦虑和疲...; 其次, 它能让你的大脑清醒;
    最后, 它能增强你的免疫力。这三个好处, 都和人体内的肾上腺素有关。


    医学博士约翰·梅耶 (John Mayer) 说, 当你惊慌时, 身体会进入战斗或逃跑模式, 这种模式在英文里还一个专门的说法, 叫做 fight-or-flight
    response, 你的心会加快、呼吸会更快变急, 手上出汗, 肾上腺素会飙升, 这种恐惧, 会让你专注于当下, 远离日常生活的焦虑和沮丧。


    梅耶博士对此还有一个很诗意的表达——适度的恐惧, 就像一块“心灵橡皮擦”, 擦去内心的烦恼、忧虑。


    而且临床心理学家史蒂夫·奥马 (Steve Orma) 说, 当你恐怖活动结束后, 恐惧感退去, 你的肾上腺素水平也会下降, 肾上腺素下降会带来一系列的身体变化,
    包括你的肌肉会开始放松, 你的身体还会产生大量富含氧气的血液时, 最后你的大脑会开始释放让你感觉良好的神经递质——内啡肽。


    这样, 你的精神就像经历了一场桑拿, 先热后舒爽, 大大缓解了疲惫感。


    此外, 适度的恐惧还能增强你的免疫系统。刚才咱们说过, 你在害怕时, 身体会释放大量肾上腺素, 肾上腺素在免疫系统中是会让免疫细胞的活跃度, 从而增强你的免疫系统。


    考文垂大学的研究人员就做过这样一个实验, 分别给看恐怖电影前中后三个阶段, 采集了25名志愿者的血液样本。研究者发现, 在志愿者看完恐怖电影后, 他们体内用来对抗感染、提高抵抗力的白细胞上升了,
    而且显然还能达到人体在接触感染时的白细胞水平, 这个发现还专门刊登在专业期刊《压力》 (Stress) 上。


    虽然恐惧有不少好处, 但如果你胆子比较小, 担心假想反抗恐怖片娱乐活动, 你可能是也会纳闷, 为什么有些人那么喜欢恐怖片, 去鬼屋玩, 这不是自己找虐么?


    其实, 这和性格有关。通过一个人是否喜欢恐怖娱乐活动, 可以初步判断这个人的性格。


    克拉森还曾经带领团队分析过北美1000个恐怖娱乐活动爱好者, 他们发现, 喜欢恐怖娱乐活动的人, 他们对奇怪的开放度更高, 更愿意努力上的刺激, 更有想象力;
    而对恐怖的耐受能力不高的人, 性格通常比较固执, 很容易就会被吓到。


    ### 3 总结


    适度的恐惧感, 虽然会让你紧张、害怕, 但你能给你的身体和精神都得到放松; 共同参加带有恐怖元素的整体活动, 还能促进团队的凝聚力, 让团队成员的关系更加紧密;
    通过恐怖娱乐活动的喜好, 我们还可以简单判断别人的性格。


    但话又说回来, 喜欢恐怖娱乐活动的人, 其实未必是因为刚才说的这些好处。他们最可能的, 就是有些人, 用文章里的话来说, 有些人渴望并喜欢恐怖, 是因为这让他们拥有一种对自身恐惧的掌控感。


    People who seek out and enjoy horror may do so because it helps them feel a sense
    of mastery or control over their fears.


    这句话，也是咱们今天的金句。


    但提醒你注意，参加恐怖娱乐活动也要控制频率，同时还要考虑参与者的年龄和身体状况。短时间内的恐怖娱乐活动能给你种种好处，但如果每周经历好几轮长时间的精神压力，还是会对你的精神和身体造成负面影响，比如有可能导致免疫系统减弱、消化性溃疡、心血管疾病，甚至是DNA损伤；而应激诱导产生的DNA损伤，又可能会引发过早衰老、肿瘤恶化，女性流产、以及抑郁症等精神疾病，这就是为什么不建议孕妇和老年人挑战鬼屋或者去看恐怖片的原因。


    你看过哪些印象特别深刻的恐怖片，或者玩过鬼屋游戏吗？它们给你的体验是什么样的？


    欢迎在留言区分享你的感受，也欢迎你把今天的内容转发给自己的朋友。


    **划重点** 添加到笔记


    > **今日得到：**

    >

    > - 在安全环境下产生的恐惧感，不仅不会给人们造成心理阴影，反而能缓解焦虑和疲惫、让大脑更清醒，还能增强人体的免疫力，并且促进团队成员的亲密关系。

    > - 当恐怖娱乐活动结束时，人体的肾上腺素水平也会下降，这个过程就像一场精神上的泰式按摩，能够大大缓解疲惫感。

    > - 喜欢恐怖娱乐活动的人，对新奇体验的开放度更高、更追求智力上的刺激，更有想象力。


