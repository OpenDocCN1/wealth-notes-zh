    # 201报告 | 美国精英阶层为何陷入“工作主义”？


    ![](img/82c50821bc552fe72722a78212114e65_40_0.png)


    # **今日报告：**美国精英阶层为何陷入**“工作主义”？**


    把我们价值的实现和赚钱的工作绑在一起，变成了一种文化，这只会制造出集体焦虑、失望情绪和无可避免的倦怠感。


    —《大西洋月刊》


    ![](img/82c50821bc552fe72722a78212114e65_40_1.png)


    **马徐捷**


    在过去，工作是生存的手段，而现在，工作在某种程度上变成了使命、信仰、个人价值的紧急竞赛。甚至一种新的宗教。


    今天的议题分为两个部分：


    精英阶层的“工作主义”是怎么来的？


    如何正确看待“工作主义”文化？


    1930年，“宏观经济病学之父”约翰·凯恩斯曾经有过一个非常悲观的预言，他认为到了21世纪，人们每周只需工作15个小时，相当于周一周二，剩下的5天都可度假。凯恩斯说，到了那个时候，人们首要考虑的问题是，到底怎么打发这么多的空闲时间。


    但身处21世纪的我们，只能遗憾地告诉凯恩斯老爷子，如今我们非但没有那么多空闲时间，反而比过去更忙了，这是为什么呢？


    《流行制造者》的作者德里克·汤普森最近在《大西洋月刊》上发表了一篇文章，对这 个现象给出了自己的回答。汤普森认为， 努力拼命工作，甚至把它当作一种为自己 人生定位的策略，在我们这个时代，至少在
    美国，是一种种族身份意识的文化，也就 是一种解决的身份焦虑，更是他们获得 归属感的方式，类似于一种新的宗教。


    他甚至还专门为这种现象造了一个新词，叫做“工作主义”（workism）。


    但是，汤普森并不认同这种在美国大行其道的“工作主义”，他认为，我们不应该被这种文化裹挟着，被动地卷入其中。


    汤普森在文章里说：当把自我价值的实现和赚钱的工作绑在一起，变成了一种文化，只会制造出集体焦虑、失望情绪和无可避免的倦怠感。


    > A culture that funnels its dreams of self-actualization into salaried jobs is
    setting itself up for collective anxiety, mass disappointment, and inevitable
    burnout.


    这句话，也是我们今天的金句。


    今天我们就来谈说，到底什么是美国精英阶层的“工作主义”文化？它是怎么来的？我们不应被这种文化所裹挟？


    精英阶层的“工作主义”是如何形成的？


    我们先来解释一下，到底什么是“工作主义”（workism）。汤普森在文章里给到的定义是：不只是把工作当作维持家庭收入 的必要手段，而是将其视为一种身份 认同的核心要素，以及生命的全部意义。


    看着这么个定义，是不是就觉得有些不舒服？怎么说人一辈子 的全副身家就 都寄托在这上面了？这也太偏激了吧。但你再听我说，不少美国精英的观念确实就是这样。


    这种观念的形成，是三个因素导致的：美国传统文化底蕴、信仰危机和“工作”概念的变迁。


    我们先来谈美国传统文化的底蕴这个因素。其实美国本来就是一种崇尚个人的奋斗、务实的国家，美国人所理解的“美国梦”，本质上是指，一个人可以通过个人努力获得成功和社会阶层的提升，所以跟其他发达国家相比，美国人的工作时间确实更长。


    文章里给出的数据是，从1950年到2012年，工作寿命的德国人和美国人的年工作时间减少了40%。而同期，美国人的年工作时间只减少了10%。这是横向比较。我们再来看看时间维度——在1930年，美国人的平均工作时间是一周47个小时，到了1970年下降到每周39个小时，而之后的半个世纪，直到现，都稳定在每周40个小时左右。


    萨缪尔·亨廷顿在2005年的著作《我们是谁：对美国国家认同的挑战》说：“更长的工作时间、更短的假期、尽量少失业、晚退休，是美国人区别于其他富裕国家的重要特征。”'
  md: "\n## 少用户的操控选择\n比如说，大手笔砍掉不必要的操控按钮和指示灯，尽量使用最简洁的界面跟用户进行交互，这就像iPhone把最原始的手机按键都变成了简洁的触屏界面那样，把用户的使用成本降到最低。\n\
    \n另外，哈克特发现，在传统的汽车工业设计里，所谓的“设计思维”其实是一个伪命题，因为每个人对它的理解都不同。就像“功能设计”（feature set）这个词来说，工程师是一种理解、程序员是一种理解、市场人员又是另一种理解，连基本的共识都没有，何谈统一的“设计思维”？\n\
    \n于是哈克特要求福特的设计团队先停下手里的工作，给大家放几天假，回去好好开开自家的车，把他们觉得不方便、不满意的地方都找出来。\n\n果然，设计团队带着一大堆问题回来了，比如“如果我去野营，忘了带手机充电器，怎么用车来解决这个问题呢？”“我在约会的时候，不想被导航唠叨叨地破坏情调，又该怎么办？”像这样换位思考，完全站在用户的角度来思考产品的设计思路，在许多行业特别是互联网行业，早已经是共识了，但在汽车行业，却是一个全新的创举。\n\
    \n文章作者尤西姆试驾过福特的无人驾驶概念车，他发现，当你切换到自动驾驶功能的时候，汽车座椅会下沉，拉开驾驶员和方向盘的距离，这个距离掌握得非常精妙，既能让你明确感受到，驾驶权现在已经交给了机器，同时又不会让你有“失控”的无力感。这种完全从驾驶者的体验出发的设计，在汽车行业确实是前所未有的。\n\
    \n更绝的是，哈克特要求福特的设计团队不再把汽车当作孤立的产品，而是要设计成手机等日常电子设备的一种延伸。这是一个了不起的洞见，也恰好呼应了我们刚才说到的那个核心问题——如果未来的汽车不再是私人物品，而是一种多人分享的交通工具呢？如果能与手机进行多维度的连接延伸，那么，未来的汽车将不再是人与车的一对一，而是千人与车的大连接，拥有无限的可能。\n\
    \n## 总结\n\n福特的新任CEO吉姆·哈克特把自己在办公家具领域的“设计思维”理念，带进了保守的汽车行业，突破了过去的“工程师思维”，完全从用户的角度出发，来设计未来的汽车。\n\
    \n福特是否能凭借这种“第三选择”，在未来获得差异化的竞争优势，目前还不能确知。但是哈克特给汽车行业带来的新思路，确实值得我们了解和借鉴。\n\n在哈克特的主导下，你是否看好福特的未来表现？为什么？\n\
    \n欢迎在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n今日得到：\n\n- 福特认为，对于未来的汽车行业来说，以用户体验为导向的“设计思维”，比传统的“工程师思维”更重要。\n\
    - 未来汽车行业要面对的真问题是，人们到底想不想拥有自己的私家车。\n- 福特未来的汽车设计思路有三个重点：尽量减少按钮和指示灯、以用户体验为中心、把汽车视为手机的延伸。\n\
