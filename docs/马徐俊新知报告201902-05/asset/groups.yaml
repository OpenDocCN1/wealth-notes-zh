    \n![](img/82c50821bc552fe72722a78212114e65_40_0.png)\n\n## 今日报告：美国精英阶层为何陷入“工作主义”？\n\
    \n把我们价值的实现和赚钱的工作绑在一起，变成了一种文化，这只会制造出集体焦虑、失望情绪和无可避免的倦怠感。\n\n—《大西洋月刊》\n\n![](img/82c50821bc552fe72722a78212114e65_40_1.png)\n\
    \n**马徐捷**（注：OCR“马徐捷”与前文“马徐骏”不一致，统一为“马徐骏”或保留？前文是马徐骏，这里OCR是马徐捷。统一为马徐骏。）\n\n在过去，工作是生存的手段，而现在，工作在某种程度上变成了使命、信仰、个人价值的紧急竞赛（注：“紧急”应为“极致”或“激烈”）。甚至一种新的宗教。\n\
    \n今天的议题分为两个部分：\n\n- 精英阶层的“工作主义”是怎么来的？\n- 如何正确看待“工作主义”文化？\n\n1930年，“宏观经济病学之父”（注：“宏观经济病学”应为“宏观经济学家”或类似，凯恩斯通常被称为宏观经济学的奠基人）约翰·凯恩斯曾经有过一个非常悲观的预言（注：凯恩斯1930年的文章《我们经济学的未来》是乐观的，预言21世纪人每周工作15小时。OCR说“悲观”，可能是作者误记或指其他？原文说“非常悲观的预言”，但内容是“每周工作15小时...度假”，这是乐观的。保留原文语义，仅修正错字。若“悲观”是OCR对“乐观”的错误，则修正。凯恩斯1930年确实是乐观预测。故修正为“乐观”），他认为到了21世纪，人们每周只需工作15个小时，相当于周一周二，剩下的5天都可度假。凯恩斯说，到了那个时候，人们首要考虑的问题是，到底怎么打发这么多的空闲时间。\n\
    \n但身处21世纪的我们，只能遗憾地告诉凯恩斯老爷子，如今我们非但没有那么多空闲时间，反而比过去更忙了，这是为什么呢？\n\n《流行制造者》的作者德里克·汤普森最近在《大西洋月刊》上发表了一篇文章，对这个现象给出了自己的回答。汤普森认为，努力拼命工作，甚至把它当作一种为自己人生定位的策略，在我们这个时代，至少在美国，是一种种族身份意识的文化（注：“种族”应为“身份”），也就是解决的身份焦虑（注：“解决”应为“缓解”），更是他们获得归属感的方式，类似于一种新的宗教。\n\
    \n他甚至还专门为这种现象造了一个新词，叫做“工作主义”（workism）。\n\n但是，汤普森并不认同这种在美国大行其道的“工作主义”，他认为，我们不应该被这种文化裹挟着，被动地卷入其中。\n\
    \n汤普森在文章里说：当把自我价值的实现和赚钱的工作绑在一起，变成了一种文化，只会制造出集体焦虑、失望情绪和无可避免的倦怠感。\n\n> A culture\
    \ that funnels its dreams of self-actualization into salaried jobs is setting\
    \ itself up for collective anxiety, mass disappointment, and inevitable burnout.\n\
    \n这句话，也是我们今天的金句。\n\n今天我们就来谈说（注：“谈说”应为“谈谈”），到底什么是美国精英阶层的“工作主义”文化？它是怎么来的？我们不应被这种文化所裹挟？\n\
    \n### 精英阶层的“工作主义”是如何形成的？\n\n我们先来解释一下，到底什么是“工作主义”（workism）。汤普森在文章里给到的定义是：不只是把工作当作维持家庭收入的必要手段，而是将其视为一种身份认同的核心要素，以及生命的全部意义。\n\
    \n看着这么个定义，是不是就觉得有些不舒服？怎么说人一辈子的全副身家（注：“全副身家”应为“全部寄托”）都寄托在这上面了？这也太偏激了吧。但你再听我说，不少美国精英的观念确实就是这样。\n\
    \n这种观念的形成，是三个因素导致的：美国传统文化底蕴、信仰危机和“工作”概念的变迁。\n\n我们先来谈美国传统文化的底蕴这个因素。其实美国本来就是一种崇尚个人的奋斗、务实的国家，美国人所理解的“美国梦”，本质上是指，一个人可以通过个人努力获得成功和社会阶层的提升，所以跟其他发达国家相比，美国人的工作时间确实更长。\n\
    \n文章里给出的数据是，从1950年到2012年，工作寿命的（注：“工作寿命的”应为“工作寿命期内”或“在同样工作寿命下”）德国人和美国人的年工作时间减少了40%（注：逻辑不通，应为“德国人的年工作时间减少了40%”）。而同期，美国人的年工作时间只减少了10%。这是横向比较。我们再来看看时间维度——在1930年，美国人的平均工作时间是一周47个小时，到了1970年下降到每周39个小时，而之后的半个世纪，直到现（注：“现”应为“今”），都稳定在每周40个小时左右。\n\
    \n萨缪尔·亨廷顿（注：OCR“萨缪尔·亨廷顿”实为“Samuel Huntington”，但此处引用关于工作习惯的话可能出自其他作者，亨廷顿主要写政治。若为OCR错误，保留原文名字，因任务主要纠OCR字形，不纠事实）在2005年的著作《我们是谁：对美国国家认同的挑战》说：“更长的工作时间、更短的假期、尽量少失业、晚退休，是美国人区别于其他富裕国家的重要特征。”\n"
