    下期将给您带来的议题是#为什么教育会导致生育率的下降？#


    人口负增长是长期困扰着很多发达国家的问题，我们通常认为，低生育率和经济的繁荣程度有关，但《经济学人》最近的一篇报道认为，决定一个国家生育率最大的因素是教育。那么，教育究竟是如何影响生育率的？未来的人口趋势会是什么样的？


