    明天将给你带来议题是#应对中年职场危机的哲学#


    中年危机投射在职场上，有个专门的叫法是“中年职场危机”(Mid-career Crisis)，说的是中年人对自己的工作感到不满足、迷茫，甚至厌倦。最新一期的《哈佛商业评论》刊登了麻省理工学院哲学家索姆基·萨蒂亚的一篇文章，文中提供了两个哲学思维工具，帮你平稳过渡中年职场危机。


