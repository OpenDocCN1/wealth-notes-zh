    ## 217报告 | 波音坠机事故的启示


    马骏毅 · 新知报告


    今日报告：波音坠机事故的启示


    经历了20年的高速发展之后，航空业作为西方世界最尖端的工业之一，正面临着艰难的未来。（文本截断）


    ——《经济学人》


    马骏毅


    无论从哪里角度来看，波音737MAX都不是一种不该出问题的机型。半年内连续两起坠机事故，揭示了什么问题？


    - 为什么波音737MAX事故不断？

    - 波音和空客的竞争带来了什么？

    - 航空业未来格局将如何变化？


    波音公司的坠机事故近期成为全世界关注的焦点，我们也通过多种渠道有所耳闻——3月10日，埃塞俄比亚航空有限公司的一架波音737MAX-8在起飞后6分钟坠毁，机上的157人无一生还。这是半年内的第二起事故，去年10月底，印尼狮航也有一架737MAX在起飞不久后坠毁，机上189人全部遇难。


    仅仅半年时间，一样的机型、相似的事故，同样的灾难性后果，把整个波音公司和737MAX机型推到了舆论的风口浪尖，极大地影响了人们对于航空业尤其是飞机制造商的信任。


    《经济学人》杂志用三篇文章的篇幅，分析了波音事故背后更深层的原因，揭示了自动驾驶技术目前的局限，并且探讨了西方航空业格局的未来走向。


    就像文里说的那样，经历了20年的高速发展之后，航空业作为西方世界最尖端的工业之一，正面临着艰难的未来。


    *After a 20-year boom, one of the West''s most sophisticated industries faces
    a difficult future.*


    这句话是开篇的金句。


    ![](img/82c50821bc552fe72722a78212114e65_74_0.png)


    ### 为什么波音737MAX事故不断？


    波音737MAX的事故之所以引发全球关注，不是因为没有问题的机型……（此处省略大量段落，包括事故细节、飞行控制逻辑、MCAS系统缺陷等描述，直至“但反而更不安全。”）


    ### 波音和空客的竞争带来了什么？


    如果说激烈的市场竞争，会促使企业努力提高产品质量，这个比较容易理解，但为什么……（此处省略关于波音空客竞争格局、双头垄断、1980年代市场情况、A300/B737对比、软件开发争议等段落）


    ### 航空业未来格局将如何变化？


    按照《经济学人》文章的观点，这次事故预计不会改变波音和空客以外的小型航空……（此处省略关于未来格局、双头垄断持续、中国市场需求的段落）


    波音为了满足中国市场的需求，甚至还在浙江舟山，建了海外的第一个客机“完成及交付中心”，而空客在天津也有工厂。当生产工厂落地中国之后，飞机制造技术也会逐渐被中国吸收，最终，中国有可能出现新的顶尖飞机制造商，民航制造业被西方垄断的局面，将会被终结。


    ### 总结


    波音公司的两起航空事故，如果从技术层面来分析，是自动驾驶技术目前遇到的瓶颈，就是人机争夺控制权，反而降低安全性导致的；而从行业竞争的层面来看，是波音公司太急于应对空客的新机型挑战，反而降低了自己产品的品质造成的，而这将会给中国航空制造业，带来新的机会。


    最后我想说，得到用户应该经常听到一句话：竞争意识会削弱竞争力。波音公司的事故，不就是对这句话一个最新的案例补充吗？


