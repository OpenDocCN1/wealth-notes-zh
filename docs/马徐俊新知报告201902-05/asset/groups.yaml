    \n# 189报告“慢全球化”的世界将会怎么样？\n\n从长达几个世纪的时间尺度来看，全球化的进程是不可阻挡的。\n\n——《经济学人》\n\n**马徐骏**\n\
    \n《经济学人》的封面文章提出了“慢全球化”的观点，这股不可阻挡的大趋势，将如何改变我们的生活？\n\n今天的议题分为两个部分：\n\n- 全球化进程为什么变慢了？\n\
    - “慢全球化”将如何影响我们的生活？\n\n近几年来，随着贸易保护主义的抬头、全球资本流动的回撤，不少人担心全球化（Globalization）进程是否走到了尽头，甚至可能面临倒退的风险。\n\
    \n对于这个问题，本期《经济学人》杂志的封面文章提出了一个观点：全球化并没有停止，只是放缓了速度。《经济学人》还对这个趋势起了一个新的概念，叫做“慢全球化”（Slowbalization）。\n\
    \n这期杂志的封面是一只蜗牛驮着整个地球在缓慢前行，非常形象。《经济学人》认为，“慢全球化”是一种新的全球贸易模式，也会是未来很长一段时间后内全球经济形势的全球性趋势。今天的文章，对于需要了解大的全球性趋势格局、理解世界贸易的大趋势，会是一个重要的参考。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_16_0.png)\n\n## 全球化进程为什么变慢了？\n\n《经济学人》杂志说，全球化进程之所以会变慢，是由很多复杂原因造成的，但我们依然可以粗略地分出两条线：红利吃尽和经济模式转型。\n\
    \n我们先来谈红利吃尽的问题。你可能会觉得奇怪，全球化不是一直高歌猛进吗？怎么突然的红利就不行了呢？事实上，这一轮全球化的起点，早在十年前，也就是2008年经济危机的**时候**就已经出现了。\n\
    \n不知道你有没有注意到，我用到了一个词，叫做“一轮全球化”，对，全球化的进程其实是**像**经济会动一样，是有周期的。《经济学人》说，上一次大规模的全球化发生在差不多100年前，而每一次世界战争**在**之后的冷战与**间隔中打断**，每当全球化都建立在之前红利的基础上，而这一轮全球化的黄金岁月，是从1990年到2010年的这20年里，吃的是上个世纪70到80年代攒下的底子，概括来说，就是三种成本的降低，包括全球的物流成本、各国的关税，以及信息传递的成本。\n\
    \n但是，任何一种成本的降低，都是有限度的，货物物流成本和各类的关税不可能为零，信息技术的优势也逐渐消耗殆尽。而2008年的经济危机，也是一个非常明确的信号，预示着这一轮全球化带来的高速增长到头了。\n\
    \n我们不妨来看几个数据：银行的跨境资金借贷，在全球GDP里的比重，从06年的60%，跌到了如今的36%，下跌了40%；国际资本流动总量，从07年触顶时**开始下降**；贸易在全球GDP里的比重，从08年的61%下降到18年的58%，10年内下降了整整3个百分点。\n\
    \n注意，我们刚才提到的，都是单个国家的数据，在全球经济总量里，**即使**我们以单位**变化**只是相差个1个百分点，也代表着巨大的量级。\n\n![](img/82c50821bc552fe72722a78212114e65_16_1.png)\n\
    \n**企**司，包括微软、Facebook和谷歌在内，全部加起来的海外收入，还不到世界总出口量的1%。这意味着，新一轮服务经济的爆发，还远没有到来。\n\n\
    我们再来说说**区域**化为王，这个趋势的主要表现是，供应链和投资都越来越区域化了。根据文章里给出的数据，北美、欧洲和亚洲的制造业供应链，减少了全球的采购，更多地开始集中在各自的区域内部进行整合、生产。\n\
    \n这个也好理解，拿咱们中国来说，帮别人代工的时间长了，自身能力也会发展成熟，如今的中国已经从“世界代工厂”变成了真正的“世界工厂”，所以文章里也说，made\
    \ in china，已经变成了真正的字面意思——“中国制造”了。\n\n## 总结\n\n《经济学人》杂志的封面文章，给出了对于未来全球的经济趋势预测，因为红利吃尽和经济模式转型，高歌猛进的全球化进程，转变成了服务为主、地区化为王的“慢全球化”，但我们不用担心生活会受到影响，随着服务经济的深化，我们的生活水平反而会有所提高。\n\
    \n当我们从一个更高的视角来审视全球经济，就会发现，全球化是有周期的，急速的全球经济发展不可能永远持续，但同样的，缓慢和摩擦也是暂时的。\n\n就像文章里说的：从几个世纪那么长的时间尺度来看，全球化的进程是无可阻挡的。\n\
    \nViewed in the very long run, over centuries, the march of globalization is inevitable.\n\
    \n这句话也是咱们今天的金句。\n\n查理·芒格不是说过吗？“宏观是我们必须接受的，微观才是我们可以有所作为的”，Micro-economics is what\
    \ we do, macroeconomics is what we put up with.\n\n作为一个普通人，如何在慢全球化的趋势里有所作为呢？\n\
    \n欢迎你留言写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n## 划重点\n\n![](img/82c50821bc552fe72722a78212114e65_17_0.png)\n\
    \n### 资料来源：\n\n- 刊物：\n    - *Slowbalization*, The Economist, Jan 26, 2019\n  \
    \  - *The global list*, The Economist, Jan 26, 2019\n\n### 下期预告：\n\n明天的议题是**#打造“早晚例程”，提高个人战力#**\
    \ 很多人每天的生活日程表都是一成不变的，但日复一日的单调重复，只会让自己原地地打转。组织心理学博士本杰明·哈迪指出，通过有意识地设计“早晚例程”(morning/evening\
    \ routine)，可以让你逐步蜕变，过上更有掌控感的生活。\n\n# 190报告 | 如何科学地打造“早晚生活流程”？\n\n计划胜过意志力。\n\n\
    — *Medium*\n\n### 1. 多读些\n\n**人的生活轨迹**，都是日复一日地原地打转。而通过有意识地为每天设计一套“早晚生活流程”，可以帮你突破自我，让生活更有掌控感，一步步实现长远的目标。\n\
    \n今天的议题分为两个部分：\n\n- 如何打造晚间生活流程？\n- 如何打造早晨生活流程？\n\n春节过后，不知道你**有没有**出现过下面这些状况：睡眠规律崩塌、肠胃不舒服、浑身疲惫、想好好**做**计划却起不起床……有人把这种现象叫做“假期综合征”。认为只要生活和工作回归正轨，待时间调整就能恢复常态。事实上，对于大多数人来说，生活最大的问题不是偶尔“开小差”，而是日复一日原地打转。\n\
    \n你想想，你身边有多少人是这样生活的：早上睁眼，先拿起手机刷刷朋友圈、微博和各类新闻 App，然后从床的另一侧起床、洗漱、吃差不多的早餐，走差不多的路线上班。第二天又重复前一天的所有动作……总之，以同样的方式度过每一天。\n\
    \n你也知道，习惯的力量是非常强大的。 如果你不自知，**将**习惯**变**成生长因素，那么，很难打破已经养成的、原生的生活习惯。\n\n今天，我就带你来**一份**参考性和执行性很强的生活指南，让你恢复活力、提高个人战斗力，在新的一年成为更好的自己——**新**心理学博士本杰明·哈迪（Benjamin\
    \ P. Hardy）最近在国内外大爆的内容中发布，上面就分享了一篇**文章**，文章指出，你可以有意识设计一套个性化的“早晚生活流程”（morning/evening\
    \ routine），它可以在早晚改变小设计的动作环节，可以帮你突破自我，让生活更有掌控感，一步步实现长远的目标。\n\n![](img/82c50821bc552fe72722a78212114e65_18_0.png)\n\
    \n## 如何打造晚间流程\n\n顾名思义，“早晚生活流程”分为早晨流程和晚间流程，但要注意顺序，首先打造的应该是晚间流程（evening routine），这有两个目的：它既帮你对一天的生活做收尾与复盘，还能帮你为第二天做充足的计划与准备，让你的每一天都在掌控中。\n\
    \n打造晚间流程需要四个步骤，分别是：写晚间日记→制定“明日计划”→设置起床环境→远离手机、放松大脑。\n\n首先是写晚间日记。 这份日记包括两个部分，一部分记录你当天的经历、心得，另一部分则是第二天的详细规划。\n\
    \n首先，要对当天的经历进行反思、分析和总结。这个动作对于**个人**发展非常重要，很多学术界和社会上富有成就的人士都有这个习惯。比如“复盘”，就是每天睡前，在回顾当天的事件，哪些做得好，哪些有待改进，并思考改进方法。有时候你不需要立刻有明确答案，这种种情况下，**你**也会带着问题入睡，让潜意识去消化。\n\
    \n关于晚间日记，作者哈迪建议放在电脑上进行，因为用电脑打字速度约是手写的五倍，这会让**记录**效果更**高效**且简洁。\n\n之后，你可以给自己当天的表现打个分，如果按照\
    \ 10 分制，看自己表现几分？自己在哪些**方面**达到或超出了应该**达**的标准？自己在哪些方面没达到？应该提高的方向，接下来，在制定第二天的计划时，你就会知道，什么样的表现能让自己拿\
    \ 10 分。\n\n那么，该何时制定第二天的计划呢？\n\n在这个部分，哈迪引用了“高效人士的七个习惯”的作者史蒂芬·柯维（Stephen Covey）博士的方法，先对事情的轻重缓急和**重要**程度划分成四个维度。**这两**个维度**两两组合**，需要**区分**重要且紧急、重要但不紧急、不重要但紧急、不重要也不紧急。\n\
    \n接下来的处理办法很简单：重要且紧急的马上去做，重要但不紧急的做计划，不重要但紧急的委托别人做，不重要也不紧急的干脆不做。\n\n![Urgent/Not\
    \ Urgent Matrix](placeholder)\n\n| | Urgent | Not Urgent |\n| :--- | :--- | :---\
    \ |\n| **Important** | 1. Customer Inquiries<br>Project Deadlines | 2. New Opportunities<br>Strategic\
    \ Planning<br>Improvement |\n| **Not Important** | 3. Interruptions<br>Some phone\
    \ calls<br>E-mails & meetings | 4. Unfocused web surfing<br>Gossiping |\n\n![](img/82c50821bc552fe72722a78212114e65_18_2.png)\n\
    \n哈迪说，最难也最重要的就是，你必须判断出什么事对你来说是最高优先级的。有一个简单的标准，你可以问自己“这件事能不能让我当场喊出‘HELL YES’——我绝不能错过？”如果答案是**否**，那么这件事在优先级别里就**不**只排第二，**而是**首先可以考虑做不做。**这种**算法，可以推动你关注长远的发展，而不是陷入鸡毛蒜皮。\n\
    \n接下来，就是第三步——根据你制定的第二天计划，设置好起床环境。\n\n你可以在前一天晚上提前把第二天要穿的衣服备好，这可以节省不少精力和时间；再比如，你可以在床边用玻璃杯装一杯温水，第二天起床后，先喝一大杯水，既帮助补充水分，又让自己更积极地清醒。如果你的计划包括学习，那就把第二天学习材料都准备好，让你坐下来就能开始学习。\n\
    \n总之，就是提前准备好该准备的，让你第二天早上刚一睁眼，就知道自己要做什么、怎么做，不需要耗费意志力就可以推动自己前进。\n\n最后，在上床前 1 小时，放下手机，把手机设定成飞行模式。\n\
    \n很多人，包括我自己在内，都有睡前看手机的习惯。哈迪说，睡前一小时，应该让自己的头脑从外部刺激中解脱出来，哪怕只是简单地做**冥想**都是好的，因为这会**使**你的大脑从外部的刺激中解脱出来，也能让你产生更多的灵感。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_18_3.png)\n\n## 如何打造早晨流程\n\n对于打造早晨生活流程的经验，作者哈迪非常自信，他在文章中**这样**写的：“我下面要讲的方法，能让你每天的生活都保持在巅峰状态。如果你每天早上坚持这么做，你的人生就会得到长久而持续的进步，你会以火箭般的高速成长。别人可能日复一日过着相同的生活，但是，你每天都是新的自己。”\n\
    \n我们来看哈迪是怎么说的。\n\n哈迪把早晨流程分成三步，分别是：早起床 → 和未来生活**建立**连接→执行前一夜制定的明日计划，做最重要的事。\n\n\
    哈迪说，最好的起床时间，应该是五点前。这一步最重要，对我们来说也最难。\n"
