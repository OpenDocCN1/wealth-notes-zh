    未来的汽车会是什么样子呢？目前主流的汽车厂商，只能给我们提供两种想象空间：新能源汽车和无人驾驶。而美国著名的老牌汽车企业福特公司，正在探索第三种方向一一从用户体验下功夫，为此，福特汽车还聘请了一个造家具的人来担任CEO。那么，在这位CEO的执掌下，未来汽车行业的“第三选择”将会是什么样子？


