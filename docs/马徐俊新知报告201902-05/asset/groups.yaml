    \n## 下期预告：\n\n明天的议题是#英国脱欧最直接的受益者为何是爱尔兰？#\n\n一直以来，爱尔兰的存在感并不强，但奇妙的是，谷歌、微软、苹果等科技巨头早早就在爱尔兰建立了分支机构，在英国启动脱欧程序之后，很多世界级的金融机构也把欧洲总部迁到爱尔兰，这是为什么？爱尔兰有什么独特的魅力？\n\
    \n![](img/82c50821bc552fe72722a78212114e65_35_0.png)\n\n# 199报告 | 爱尔兰为什么是英国脱欧的最直接受益者？\n\
    \n## 今日报告：爱尔兰为什么是英国脱欧的最直接受益者？\n\n英国脱欧制造了一次鲜明的对比，它释放了不列颠的“恶魔”，却在爱尔兰头上增添了一圈夺目的光环。\n\
    \n> 《财富》\n\n马德骏\n\n原本在经济地位并不起眼的小国爱尔兰，如今成了科技巨头、国际金融巨头离开伦敦后首先的落脚地。这是为什么？\n\n今天的议题分为两个部分：\n\
    \n- 为什么爱尔兰能从英国脱欧中受益？\n- 爱尔兰靠什么受到大型跨国企业的青睐？\n\n首先请你开一个脑洞：假如你现在是一家大型跨国企业的掌舵人，公司的欧洲总部原本设在伦敦，现在英国要脱离欧盟，你得在欧盟国家重新选择一个地方，把欧洲总部设过去。你会选择哪里呢？是德国、法国，还是瑞士？我来先告诉你，在真实的世界中，多数大型企业和金融机构选择的国家，是爱尔兰。\n\
    \n听起来有点意外，对吧？一般人的印象里，爱尔兰在欧盟中确实存在感并不算强。它地处偏远，人口只有400多万，经济也不算强劲，没法跟德法瑞等多辆马车相比。\n\
    \n可奇妙的是，这个小小国家能够收到大多数跨国公司的青睐，谷歌、微软、苹果等科技巨头早早就在爱尔兰建立了分支机构。在英国启动脱欧程序之后，美林银行、巴克莱银行等大型金融机构也决定，把欧洲总部迁到爱尔兰去。\n\
    \n爱尔兰到底有什么魔力呢？《财富》杂志最新的一篇文章，深度分析了背后的原因。文章认为，爱尔兰具有独特的“软实力”——税率低、劳动力年轻化、母语为英语，还有极具包容性的社会文化。这几项代表性因素集合起来，似乎不起眼，但它们在加在一起，立刻让爱尔兰在英国脱欧带来的不确定性中凸显出来，成为了跨国企业离开伦敦后首选的落脚点。\n\
    \n《财富》认为，这种跨国企业迁移的趋势将为爱尔兰带来巨大的经济发展机遇，甚至会让爱尔兰成为英国脱欧最直接的受益者。\n\n文章说：英国脱欧制造了一次鲜明的对比，它释放了不列颠的“恶魔”，却也让爱尔兰头上的光环更加夺目。\n\
    \n```\nBrexit is creating a contrast that hasn't existed before. It has unleashed\
    \ Britain's demons and given Ireland a halo.\n```\n\n这句话，也是今天的金句。\n\n### 为什么爱尔兰能从英国脱欧中受益？\n\
    \n之所以说爱尔兰是英国脱欧最直接的受益者，原因简单：英国和爱尔兰为它制造了一个历史性的发展机遇。而这个机遇是谁带来的呢？是那些选择把欧洲总部从英国撤出，迁入爱尔兰的跨国企业和大金融机构。别看这一举一动，它们为爱尔兰增加了数以万计的高薪岗位，带来了巨大的经济活力。\n\
