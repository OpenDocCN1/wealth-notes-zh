    这种叫， 媒体 报道后，陆续有 20个 者主动 系 他们，说自己也有 类似 情 况。只 过去， 天 已经 到了 300 多 人。到 前为止，泽曼 授所掌握的视觉想象力
    障碍者数量 已经 到了12000 名。


    他 估计，视觉想象力 障碍者的数量 可 占 人口 的2%。这个 比例不 小。


