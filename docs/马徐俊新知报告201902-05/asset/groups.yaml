    \ 12, 2018*\n\n## 下期预告：\n\n下周一将给你带来的议题是#推行“全民基本收入”可能#\n\n“全民基本收入”也叫UBI，它指的是，不管你有没有工作者其他收入，也不管你有多少资产，只要是某国的公民，就能定期发放给你的一笔钱，这比低保就“零门槛”。在过去的两年，芬兰做了一个UBI的落地实验，引起了《经济学人》《卫报》等媒体的争相报道，实验结果用一句话来概括就是：全民基本收入不能促进人们的就业积极性，但能提升人们的幸福感以及健康状况。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_31_1.png)\n\n# 马徐骏·新知报告\n\n为你解析全球热点议题\n\
    观点经AI辅助生成，未经马徐骏审核\n\n# 用户留言\n\n提交留言可与专栏作者互动\n\n# 197报告|\"全民基本收入\"值得推广么？\n\n“全民基本收入”可以让人们生活得更快\
    \ 乐，但却不会促进就业率。\n\n——《彭博商业周刊》\n\n芬兰做了一个全球最大规模的“全民基本收 入”落地实验，引起了《经济学人》《卫 报》等媒体的争相报道，这个实验的结果会\
    \ 如何呢？\n\n今天的试验分为两个部分：\n\n-   芬兰的“全民基本收入”实验是如何进行 的？\n-   “全民基本收入”值得推广吗？\n\n很多人担心，随着人工智能和自动化的全面\
    \ 普及，不会发生让大量普通人失业，得 不到生活保障吗？同时，人们没有工作之后，无所事事，会不会给社会秩序造成混乱呢？如果某一天真的到来，该怎幺解决这 个问题呢？\n\
    \n扎克伯格和埃隆·马斯克这些硅谷商业领 袖，都大力推荐过这一个方法，叫做“全民 基本收入”，英文全称是Universal Basic Income，我们在这里把它简称为UBI。\n\
    \nUBI指的是这样一种社会保障制度：不管你有 没有工作，不管你其他收入，也不管你有多少资产，只要你是国家的公民，政府 就是你给你发一笔钱，让你维持基本生活。\n\
    \nUBI和低保的区别在于，低保有门槛，而 UBI没有。所以，看上去，UBI会让人普遍人的生活更有保障、增强社会的稳定性，但同时这也增加了国家的财政负担。\n\
    \n我们上一节文章里讲过UBI，不过，它 当时只是只是一种设想，那么做大规模地到 底不可行？更适合在什么样的国家推行？这些问题，都没有得到过验证。\n\n\
    近年来，芬兰在一个大规模的UBI落地实验，并在今年2月公布了将初步的实验结果，令到全实验结果说成将是2020年公布。注意啊，哪怕初步的实验结果，也是一个非常重磅的新闻。《经济学人》《彭博商业周刊》《赫芬顿邮报》《卫报》这些顶级媒体都纷纷进行了报道。\n\
    \n《彭博商业周刊》更是评价说，如果要研究 UBI在工业化国家的运作情况，研究人员唯一可靠的数据来源，就是芬兰的这个实 验。\n\n领取UBI的人，生病的情况都少了很多。\n\
    \n对于芬兰这个实验的结果，各大刊物是这么评价的：UBI虽然不能鼓励失业者多找工作，但确实能增加他们的幸福感，提升他们的健康水平。\n\n借用今天的今天金句来重复一下芬兰UBI实验最核心重要的发现：“全民基本收入”可以让人们生活得更快乐，但却不会促进就业。\n\
    \nUniversal Basic Income didn't encourage the unemployed to look for work. But\
    \ it did increase their sense of well-being.\n\n虽然现在对于UBI是否可行还不能下定论，这还需要更多的研究和数据。但是更深入的问题来了：为了这份快乐和健康，政府要大幅增加社会支出、民众的税收压力也会更大，这值得么？这个问题，可能要留待2020年芬兰的全部实验结果公布之后，才会有更进一步的答案，我也会在专栏中为你带来持续的跟踪和汇报。\n\
    \n# 1 总结\n\n芬兰用了两年时间做了一次UBI的落地实验，得出的结论是：UBI虽然不能鼓励失业者多找工作，但确实能增加他们的幸福感，提升他们的健康水平。虽然实验存在一些缺陷和争议，结果也有待验证，但是，能够把一个理想拿到真实世界重进行实践，这种尝试仍然是非常有价值的。\n\
    \n你支持UBI么？假如你被选为UBI的领取者，每个月都会给你发钱保证你的温饱，你还会选择继续工作么？\n\n欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\
