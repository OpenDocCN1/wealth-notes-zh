    \n> ——《经济学人》\n\n美国传统食品巨头纷纷出问题不降的市值，市场纷纷下调的预期，问题根源出在它背后的3G资本身上，那么，它的战略格局到底做出了什么问题呢？今天的汇报为两个部分：\n\
    \n- 传统食品巨头们的生死挑战\n- 3G资本的模式与什么缺陷？\n\n本期《经济学人》的封面推荐文，谈到了著名的食品巨头卡夫亨氏集团最近遇到的困境，背后还牵扯到了超级资本帝国——巴西的3G资本和巴菲特。《经济学人》还另外用两篇文章剖析了3G资本运作模式问题，并且分析了巴菲特今年给股东的信。\n\
    \n我把《经济学人》的这三篇文章串在一起，来给你讲这么几个问题：为什么像卡夫亨氏、百威喜诗、汉斯王这些西方传统食品巨头，都出现了利润下滑？而它们面临的共同的问题是什么？它们如今面临竞争和集权是什么？还有它们背后的3G资本的运作模式有什么问题？\n\
    \n今天的内容，会带着你换个视角来看待那些曾经熟悉的品牌，让你正视它们背后隐藏的商业逻辑。\n\n就像《经济学人》在文章里说的：3G资本遇到的问题，是一个及时的警告：削减成本、大宗交易和高额负债的商业模式不是万能的。\n\
    \nThe problems of 3g Capital are a timely reminder that cost-cutting, deals and\
    \ debt go only so far.\n\n这句话就是今天的金句。\n\n## 1 传统食品巨头们的生死挑战\n\n说起3G资本，你不可能，其他们简单介绍一下，这家巴西的私募基金公司，是现在全球零售食品行业行家的巨头，掌控的资金总量，超过1500亿美元。\n\
    \n2016年开始，对3G资本非常推崇，而且从3G开始，巴菲特还跟3G资本联手，进行了一系列的行业并购，咱们熟悉的很多知名咖啡，无论是牛仔卡氏的第五大，麦斯特咖啡、奥利奥饼干的世界第五大食品集团，卡夫亨氏公司，还有美国第三大啤酒，中国哈纳啤酒等，世界第三大消费公司，巴西双汇啤酒集团，或者最大的快餐巨头汉堡王、加拿大的国民咖啡连锁施耐兹，等等，等等，其实背后的掌舵者，都是3G资本。\n\
    \n3G资本和巴菲特，之所以会出手购买这些品牌，就是相信它们有消费老白中，地位不可动摇，3G资本买下百分之60的，当时的美国系统巴士，还是公开对，国民品牌两立与卡夫的食品，更是陪伴着几百代美国人的生消记忆。根据卡氏特的价值投资理念，这是品牌在行业里的地位非常高，消费者不会轻易替换，所以得长期持有。在把这么多知名品牌收购之后，3G资本开始运用内部整合，开始削减成本，增加绩效等一系列操作，一开始取得了不小的成效。但是，近一年，当知名食品品牌的业绩下滑，日子开始好过不了。\n\
    \n今年21号，卡夫亨氏集团宣布，2018年第2季度，亏损了226亿美圆，而巴菲特，因为重仓持有卡夫亨氏集团的股票，也跟着出现巨亏，光是卡夫亨氏，去年就亏了27亿美圆，不少新闻都在写：“股神巴菲特也有看走眼的时候”。\n\
    \n之所以出现这样的新状况，跟咱们开始讲的那三个因素有关：新兴品牌的竞争，加上健康饮食，以及健康餐饮的风潮，还有非常大的关系。比如说喝饮料的消费者，现在不但有传统的可乐可以选择，还有大量的小众独立品牌可以喝，大家都喜欢鲜橙加上新奇广告词，引用网络语言通道进行销售，而传统可乐是大厂量产的，2014年，甚至哈雷啤酒在美国北美的销售额总体上升的，但是市场份额和利润都是在下降，要知道北美可是百威啤酒的故乡，向来是公司业绩与百威的啤酒卖，说这不是3G资本。再来看餐饮，现在餐饮，如今非消费者追求的是饮食，更在意卡路里含量高不高，求看食品，根据商业公司尼尔森的预测数据，最小约两万种商品，驱动了食品行业，大约一半的店长，包括沃法姆这样的大型连锁超市，也在销售自创的品牌食品。这些都极大挤压了传统食品的空间。\n\
    \n## 1 3G资本的模式与什么缺陷？\n\n3G资本最著名的商业模式，就是利用杠杆进行收购合并，参与被收购公司的管理，通过削减成本的方式获得利润。《经济学人》一针见剖成本低，和疯狂举牌并购这两点的不同。\n\
    \n咱们先来说说削减成本，这曾经是3G资本的一个大写。3G资本先后开了凯氏和卡夫公司，把二者合为一体之后，从2014年到2017年的3年里，亨氏卡夫的利润率涨了整整9个点，从15%，跳到24%，这对于这么多3G资本的，就是一系列比较的削减策略，比如去年推出了一条，叫“零基预算”——zero-base\
    \ budgeting，就是要管理者，在不考虑过去花过的情况下，每一年重新划“零”，然后，制定的预算，3G资本还要，开放资金投入最好的品牌和项目上。你会说，这没毛病啊。难道不高效又当省的做法吗？的破绽，就在这个地方。这种方法就被叫做，砍者之后，大砍掉，没用武试的资源，管理者会在大刀阔砍的尝试成本，和保证创新之间做出平衡，只考虑省钱，没有研发空间，余量，和应对市场突然变化的缓冲空间，在这个竞争越来越快的商业竞争环境中，会企业失去弹性。\n\
    \n而疯狂举牌并购有个问题，已经不是3G资本独有，而是近几年西方的商业模式，都成了一种潮流了。卡夫亨氏举了，像AT&T收购时代华纳集团，迪士尼买下福克斯，施曼收购桑基斯制药公司等，这三起近几年的并购案，动用了超过1100亿美圆，也产生了海量的债券。《经济学人》强调说，这样的借债方式，之前是没有人做过，却未必会有好结果，比如费用电高，去买掉了自己杠杆的资产，还债，2017年，3G资本付出1430亿美元的高价，试图收购高利华，最终失败。《经济学人》认为，幸好这次并购没成，既保住了联合利华，也降低了3G资本自己的风险，如今，从2016年开始，3G资本的指标已经不够多出来1/3了，整体表现远比标准普尔500指数的，其他食品和饮品公司都更差些。文章提醒说，董事会的共同责任，是反常情得投资纪律，识别当利益时那些正在扩大的大会并购，而不是被潮流裹挟，冲昏头脑的跟风。\n\
    \n## 1 总结\n\n有股神巴菲特持的3G资本，如下下的表现并不佳，出现了巨额亏损，还迎来了他克帝尔哈瑞公司，从外面上看，是因为新兴品牌的激烈竞争，线上渠道扩展的，以及健康饮食等趋势餐饮的风潮，但《经济学人》认为，更深层次的内因，就像有句话说的，是削减成本，大宗交易和高额负债的这种商业模式，不是万能的，企业既不能为了刺激，失去应对市场的弹性，也不能被潮流裹挟，盲目跟风。\n\
    \n你认为对于食品行业的公司，消费者真的会为中意产品吗？欢迎在留言写下你的答案，也欢迎把你的内容转发给自己的朋友。\n\n## 今日重点：\n\n- 线上渠道拓展不佳，新兴品牌的竞争、以及健康饮食的新风潮，是美国传统食品巨头面临的三个大挑战。\n\
    - 3G资本的高杠杆，削减成本、大宗交易和高额负债的商业模式不是万能的，给企业留足创新的空间非常重要。\n\n# 资料来源：\n\n- *The Parable\
    \ of 3G CapitalBad Recipe, The Economist, March 2, 2019*\n- *An Accident with\
    \ The Ketchup, The Economist, March 2, 2019*\n- *Buffettology, The Economist,\
    \ March 2, 2019*\n\n# 下期预告：\n\n明天将给你带来的议题是#在路上的“镜像世界”#\n\n互联网和社交媒体的出现，极大地改变了我们与自我、与他人、与世界的交互方式，那么，在它们之后，谁将接棒，成为塑造未来的新趋势？答案是：镜像世界。尽管镜像世界仍处于蹒跚学步的阶段，但随着AR技术的推动，镜像世界正在迅猛发展，一步步走进我们的生活。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_55_0.png)\n\n# 用户留言\n\n提交留言可与专栏作者互动\n\
    \n- 写留言\n- 请朋友读\n\n# 208报告 | 在路上的“镜像世界”\n\n马骏毅\n\n凯文·凯利认为，如今镜像世界已打破游戏的范畴，开始渗透进人们工作、生活的各个领域，并且发展成继互联网和社交媒体之后的第三大平台。\n\
    \n今天的议题分为三个部分：\n\n- 什么是镜像世界？\n- 镜像世界有什么作用？\n- 镜像世界未来的发展局势\n\n互联网和社交媒体的出现，极大地改变了我们与自我、与他人、与世界的交互方式。那么，在它们之后，谁将接管，成为塑造未来的新形态？答案是：镜像世界。因为它能彻底打通虚拟与现实，给我们带来一个前所未有的，“如幻如真”的新世界。\n\
    \n尽管镜像世界仍处于蹒跚学步的阶段，但随着AR技术的推进，镜像世界正在迅速发展，一步步地走向我们的生活。《连线》杂志的创办人和执行主编凯文·凯利说，谁主了镜像世界这个平台，谁就能跻身于历史上最富有、最有权势的人或者企业的行列。\n\
    \nWhoever dominates this grand platform will become among the wealthiest and most\
    \ powerful people in history.\n\n这句话，也被选为了今天的花句。\n\n今天，我们就来给大家讲讲，这个镜像世界究竟是什么，它对未来的人类社会会产生怎样的影响。\n\
    \n# 什么是镜像世界？\n\n镜像世界这个概念，是由世界大学计算机学家、大卫·格勒恩特（David Gelernter）在1991年提出的。他认为，互联网形成的模式就是现实世界的全息复制，也就是镜像世界。我们可以和这个镜像世界进行互动，够触碰它，还能像在现实世界里那样移动它。\n\
    \n之前，镜像世界只是一个概念。直到AR技术的出现，镜像世界才逐渐趋于现实。AR技术是镜像世界的基础技术，它可以将现实和虚拟世界叠加在一起，产生非常真实有趣的互动性。\n\
    \n镜像世界最早的应用之一，就是游戏。2015年，任天堂推出了一款叫做Pokemon Go的手游风靡全球，玩家可以通过手机的摄像头，看到周围真实的，还可以寻找环境中的虚拟神奇宝贝，并且和它们进行互动。这款游戏就体现出了AR实现增强技术，我们可以把它看作是镜像世界的初步尝试。\n\
    \n凯文·凯利认为，如今镜像世界已打破游戏的范畴，开始渗透进人们工作、生活的各个领域，并且发展成继互联网和社交媒体之后的第三大平台。\n\n严格来说，目前大卫描述的镜像世界还没有实现，但他正在迅速向我们靠近。\n\
    \n上面，我就非常高兴地第二部分，来看看目前为止，镜像世界发展到了哪一步了，它都有哪些用途。\n\n![](img/82c50821bc552fe72722a78212114e65_56_0.png)\n\
    \n# 镜像世界有什么用？\n\n总的来说，镜像世界当前的应用，可以分为三大类：一是信息叠加，二是数字学生，三是构建逼真的虚拟世界。\n\n先来说第一个用途——信息叠加。在信息里，镜像世界可以作为一个覆盖在现实世界上的信息层。做了，就是，你在AR眼镜，看见的街角咖啡店，可以带你介绍信息，比如说，以前新认识的同事，头项都上AR标识。有了信息叠加后，你戴上AR眼镜，之前见过的所有人头顶部都有标识。\n\
    \n以像搜索文字一样，搜索立体的物理空间，到那个时候，人类的沟通效率将会成倍地提升。\n\n比如，你去了球赛现场，想和场外的朋友分享比赛的精彩瞬间，那么你可以把比赛场景，直接传送到朋友的AR设备中，让他有一个360度的直观体验。\n\
    \n其次，我们可以通过镜像世界，随时改变任何物体的颜色、位置。比如说，家里要装修，你想把家里墙的颜色换了，在镜像世界里，只要点个颜色按钮就可以，颜色随便挑。家具的大小、位置，在镜像世界里可以随意调整，直到找到让你最满意的配置。\n\
    \n再次，镜像世界能让计算机真正“看见”这个世界，能与人类更好地互动。只要世界上有足够多的摄像头，就能制作出一个和真实世界1:1，也就是完全一样的镜像世界。文章中说，在镜像世界里，智能助手都将具备象化，也许是机器人的形象，也许是人类的形象。这些具象化的智能助手，同时行走在现实世界与镜像世界叠加的双重世界里，它们不仅能够理解现实世界里事物之间的关系，还能根据人类在现实世界里的实时动作，进行合理的回应，并提供服务。\n\
    \n# 总结\n\n镜像世界是通过AR技术构建的一个叠加在现实世界上的虚拟世界。目前，它除了信息叠加和数字孪生两大功能外，还可以通过将SLAM，AR和AI融合到一起，构建一个虚实结合、难辨真假的世界。这个世界将成为新的大型科技平台，为各个产业带来创新与革命。\n\
    \n我最近还听到一个说法，苹果公司未来的战略核心，可能会是专注于开发更厉害的AR技术，以此来完成新一轮对科技行业的引领，听完今天《连线》的内容，是否也会让你换一个角度来看待苹果的战略呢？\n\
    \n你对镜像世界有什么样的期待，又有什么样的顾虑呢？\n\n欢迎在留言区写下你的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n## 划重点\n\n-\
    \ 今日得到：\n  - 镜像世界能彻底打通虚拟与现实，它将彻底改变人与世界的交互方式，而日趋成熟的AR技术正在加速推动镜像世界的到来。\n  - 镜像世界的应用可以分为三大类：信息叠加、数字孪生、构造逼真的虚拟世界。\n\
    \n# 资料来源：\n\n刊物：\n\n*AR Will Spark the Next Big Tech Platform- Call It Mirrorworld,\
    \ by Kevint Kelly, Wired, 02.12.19*\n\n网站：\n\n*Microsoft HoloLens official website*\n\
    \n# 下期预告：\n\n明天的议题是#太空“淘金热”会成为现实吗？#\n\n人类对于资源的渴求和追逐从不停步，你可能会觉得去太空开采资源还只是科幻片中的场景，事实上，这已经是可以实现的途径。《新科学家》杂志的最新文章就介绍了人类应该如何进行太空开采，那么，未来会掀起大规模的太空“淘金热”吗？\n\
    \n![](img/82c50821bc552fe72722a78212114e65_57_0.png)\n"
  mdcn: "\n一项新的爱好，学学网球或爵士舞。别看这些事情的重要性不如你的本职工作，但它们都属于有存在性价的事情，能很好地平衡重复性工作带来的空虚感。缓解中年职场危机，需要有策略地多做这样的事情。\n\
    \n## 总结\n\n中年职场危机是一个不容易解决的问题。有些人的确在职业发展上碰到瓶颈，觉得在当前的工作中发挥不出才能，发展受到了局限。但萨蒂亚教授的洞见是：遭遇中年职场危机未必真的是工作本身不合适，我们的负面情绪更有可能是来自于对未来人生可能性变少的焦虑、对过去选择无法改变的后悔，以及对当前的工作内容不断重复的厌倦。如果是这些情况，哲学就可以帮上忙。\n\
    \n文章教给我们两招：与选择带来的“机会损失”和解，找到与爱有关的收获，让自己从失败的后悔中解脱；还有，多做有“存在性价值”的事情，来填补重复性工作所产生的空虚。这样，即使你不改变目前的工作，一样能平稳地度过中年职场危机。\n\
    \n如果这些策略都不管用呢？最后一招，就是勇敢地跳槽吧，要记住，中年，其实并不晚。只要做好心态上的调整，中年职场危机，也有可能会是事业发展上的一次良机。\n\
    \n你或你身边的人是否正在经历中年职场危机？\n\n欢迎在留言区说说你的感受和看法，也欢迎你今天的内容转发给自己的朋友。\n\n## 划重点\n\n- 今日得到：\n\
    \  - 中年职场危机产生的原因是：未来人生的可能性变少，让人焦虑；过去的选择无法改变，让人后悔；当前的工作内容不断重复，让人厌倦。\n  - 应对中年职场危机的两个思维工具是：与选择带来的“机会损失”和解；多为有“存在性价值”的事情创造空间。\n\
    \  - 多做有“存在性价值”的事情，能够填补重复性工作所产生的空虚。\n\n## 资料来源：\n\n- *Facing Your Mid-career Crisis,\
    \ Should You Cope or Quit?*, by Kieran Setiya, *Harvard Business Review*, March-April\
    \ 2019\n- *How Philosophy Can Solve Your Midlife Crisis*, by Peter Dizikes, *MIT\
    \ News*, October 2, 2017\n\n## 下期预告：\n\n明天将给你带来的议题是#为什么聪明人会做蠢事？#\n\n在工作和学业方面，智商与很多成就密切相关。但《新科学家》却指出，在做出决策和批判性思维方面，智商和专业知识往往会更容易让人犯错，甚至影响时局走向，文章还总结出了聪明人做蠢事的“四大陷阱”，它们分别是什么？\n\
    \n![](img/82c50821bc552fe72722a78212114e65_51_0.png)\n\n为你解析全球热点议题\n\n# 206报告\
    \ | 为什么聪明人总做傻事？\n\n马徐骏 · 新知报告\n\n![](img/82c50821bc552fe72722a78212114e65_52_0.png)\n\
    \n![](img/82c50821bc552fe72722a78212114e65_52_1.png)\n\n# 今日报告：为什么聪明人总做傻事？\n\n\
    高智商和专业知识，也不能保证让你免于思想误导。\n\n—《新科学家》\n\n马徐骏\n\n今天的议题分为两个部分：\n\n- 三大智力陷阱\n- 怎样才能避免做傻事？\n\
    \n你有过这样的疑问吗——我们学了很多知识，获得了高智商，脑瓜并不笨，却还是解决不了生活中迎面而来的问题，不好人、明明很有前途，却还会经常做出一些令人匪夷所思的傻事来，为什么会这样呢？\n\
    \n《新科学家》杂志最新一期的封面文章提出了一种解释：智力和专业技能，跟我们在工作和专业上的成功密切相关。但心理学研究表明，在做决策和批判性思维方面，智力和专业技能并不能太多帮助，还有可能让我们更容易做傻事。\n\
    \n文章的大卫·罗布森（David Robson）在3月7日刊发了一本新书，书名《智力陷阱》，《新科学家》的这篇封面文章，就提炼了这本书的精华。\n\n#\
    \ 怎样避免做傻事？\n\n文章主要提了三个方法，分别是建立多元思维、管理情绪，以及第三视角。\n\n第一个，也是最重要的方法，就是要拓宽自己的思考框架，建立多元化思维。要建立多元化思维，首先就要拓宽自己的知识面，比如说听完今天的内容，你就认识到，自己有可能遇到智力陷阱。意识到问题之后，你就能有意识地跳出原本的思维框架，进行更理性的分析了。\n\
    \n第二个，就是要管理自己的情绪，当要作决定时，先停下来，缓一缓，抑制自己瞬间的冲动。\n\n第三个方法就是，利用第三视角反思自己。这也是跳出惯性思维的经典方法。就是把你自己这事儿，当成别人的事儿来想。这三个方法，可以转化成三个问题，在做决定时，你可以问问自己：\n\
    \n- 这里有没有智力陷阱？\n- 我现在会做这个决定，明天、明年还会这么想吗？\n- 这要是别人遇到这个事儿，我会给对方出什么主意？\n\n# 总结\n\n\
    就算是个聪明人，想过好这一生也不容易。就像文章里说的那样，高智商和专业知识也不能保证让你免于思维谬误。这句话也被我选为今天的金句——A high IQ and\
    \ expert knowledge can't always protect you from flawed thinking. 理性障碍、所罗门悖论和动机性推理，这些智力陷阱无处不在。但只要我们能意识到这些陷阱，就像在森林里找路一样，能看清脚下的路，知道我们要面对的是什么，我们就能想办法去应对。\n\
    \n理性障碍、所罗门悖论和动机性推理这三个智力陷阱，哪一个最难克服？\n\n欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n![](img/82c50821bc552fe72722a78212114e65_53_0.png)\n\
    \n# 资料来源：\n\n*Why Smart People Do Stupid Things*, by David Robson, *New Scientist*,\
    \ 2019.02.23\n\n# 下期预告：\n\n下周一的议题是#巴菲特看多的3G资本做错了什么？#\n\n近两年来，卡夫亨氏、百威啤酒、汉堡王这样的西方传统食品巨头，都出现了利润下滑的问题，市场份额也明显缩减，问题出在哪里？这和他们背后的资本帝国3G资本有什么关系？它们如今面临的竞争和挑战是什么？\n\
    \n![](img/82c50821bc552fe72722a78212114e65_53_1.png)\n\n# 207报告 | 巴菲特看好的3G资本做错了什么？\n\
    \n与陈诚 · 新知报告\n\n# 今日报告：巴菲特看好的3G资本做错了什么？\n\n3G资本遇到的问题，是一个及时的警告：削减成本、大宗交易和高额负债的商业模式不是万能的。\n\
    \n> ——《经济学人》\n\n美国传统食品巨头纷纷出问题不降的市值，市场纷纷下调的预期，问题根源出在它背后的3G资本身上，那么，它的战略格局到底做出了什么问题呢？今天的汇报为两个部分：\n\
    \n- 传统食品巨头们的生死挑战\n- 3G资本的模式与什么缺陷？\n\n本期《经济学人》的封面推荐文，谈到了著名的食品巨头卡夫亨氏集团最近遇到的困境，背后还牵扯到了超级资本帝国——巴西的3G资本和巴菲特。《经济学人》还另外用两篇文章剖析了3G资本运作模式问题，并且分析了巴菲特今年给股东的信。\n\
    \n我把《经济学人》的这三篇文章串在一起，来给你讲这么几个问题：为什么像卡夫亨氏、百威喜诗、汉斯王这些西方传统食品巨头，都出现了利润下滑？而它们面临的共同的问题是什么？它们如今面临竞争和集权是什么？还有它们背后的3G资本的运作模式有什么问题？\n\
    \n今天的内容，会带着你换个视角来看待那些曾经熟悉的品牌，让你正视它们背后隐藏的商业逻辑。\n\n就像《经济学人》在文章里说的：3G资本遇到的问题，是一个及时的警告：削减成本、大宗交易和高额负债的商业模式不是万能的。\n\
    \nThe problems of 3g Capital are a timely reminder that cost-cutting, deals and\
    \ debt go only so far.\n\n这句话就是今天的金句。\n\n## 1 传统食品巨头们的生死挑战\n\n说起3G资本，你不可能，其他们简单介绍一下，这家巴西的私募基金公司，是现在全球零售食品行业行家的巨头，掌控的资金总量，超过1500亿美元。\n\
    \n2016年开始，对3G资本非常推崇，而且从3G开始，巴菲特还跟3G资本联手，进行了一系列的行业并购，咱们熟悉的很多知名咖啡，无论是牛仔卡氏的第五大，麦斯特咖啡、奥利奥饼干的世界第五大食品集团，卡夫亨氏公司，还有美国第三大啤酒，中国哈纳啤酒等，世界第三大消费公司，巴西双汇啤酒集团，或者最大的快餐巨头汉堡王、加拿大的国民咖啡连锁施耐兹，等等，等等，其实背后的掌舵者，都是3G资本。\n\
    \n3G资本和巴菲特，之所以会出手购买这些品牌，就是相信它们有消费老白中，地位不可动摇，3G资本买下百分之60的，当时的美国系统巴士，还是公开对，国民品牌两立与卡夫的食品，更是陪伴着几百代美国人的生消记忆。根据卡氏特的价值投资理念，这是品牌在行业里的地位非常高，消费者不会轻易替换，所以得长期持有。在把这么多知名品牌收购之后，3G资本开始运用内部整合，开始削减成本，增加绩效等一系列操作，一开始取得了不小的成效。但是，近一年，当知名食品品牌的业绩下滑，日子开始好过不了。\n\
    \n今年21号，卡夫亨氏集团宣布，2018年第2季度，亏损了226亿美圆，而巴菲特，因为重仓持有卡夫亨氏集团的股票，也跟着出现巨亏，光是卡夫亨氏，去年就亏了27亿美圆，不少新闻都在写：“股神巴菲特也有看走眼的时候”。\n\
    \n之所以出现这样的新状况，跟咱们开始讲的那三个因素有关：新兴品牌的竞争，加上健康饮食，以及健康餐饮的风潮，还有非常大的关系。比如说喝饮料的消费者，现在不但有传统的可乐可以选择，还有大量的小众独立品牌可以喝，大家都喜欢鲜橙加上新奇广告词，引用网络语言通道进行销售，而传统可乐是大厂量产的，2014年，甚至哈雷啤酒在美国北美的销售额总体上升的，但是市场份额和利润都是在下降，要知道北美可是百威啤酒的故乡，向来是公司业绩与百威的啤酒卖，说这不是3G资本。再来看餐饮，现在餐饮，如今非消费者追求的是饮食，更在意卡路里含量高不高，求看食品，根据商业公司尼尔森的预测数据，最小约两万种商品，驱动了食品行业，大约一半的店长，包括沃法姆这样的大型连锁超市，也在销售自创的品牌食品。这些都极大挤压了传统食品的空间。\n\
    \n## 1 3G资本的模式与什么缺陷？\n\n3G资本最著名的商业模式，就是利用杠杆进行收购合并，参与被收购公司的管理，通过削减成本的方式获得利润。《经济学人》一针见剖成本低，和疯狂举牌并购这两点的不同。\n\
    \n咱们先来说说削减成本，这曾经是3G资本的一个大写。3G资本先后开了凯氏和卡夫公司，把二者合为一体之后，从2014年到2017年的3年里，亨氏卡夫的利润率涨了整整9个点，从15%，跳到24%，这对于这么多3G资本的，就是一系列比较的削减策略，比如去年推出了一条，叫“零基预算”——zero-base\
    \ budgeting，就是要管理者，在不考虑过去花过的情况下，每一年重新划“零”，然后，制定的预算，3G资本还要，开放资金投入最好的品牌和项目上。你会说，这没毛病啊。难道不高效又当省的做法吗？的破绽，就在这个地方。这种方法就被叫做，砍者之后，大砍掉，没用武试的资源，管理者会在大刀阔砍的尝试成本，和保证创新之间做出平衡，只考虑省钱，没有研发空间，余量，和应对市场突然变化的缓冲空间，在这个竞争越来越快的商业竞争环境中，会企业失去弹性。\n\
    \n而疯狂举牌并购有个问题，已经不是3G资本独有，而是近几年西方的商业模式，都成了一种潮流了。卡夫亨氏举了，像AT&T收购时代华纳集团，迪士尼买下福克斯，施曼收购桑基斯制药公司等，这三起近几年的并购案，动用了超过1100亿美圆，也产生了海量的债券。《经济学人》强调说，这样的借债方式，之前是没有人做过，却未必会有好结果，比如费用电高，去买掉了自己杠杆的资产，还债，2017年，3G资本付出1430亿美元的高价，试图收购高利华，最终失败。《经济学人》认为，幸好这次并购没成，既保住了联合利华，也降低了3G资本自己的风险，如今，从2016年开始，3G资本的指标已经不够多出来1/3了，整体表现远比标准普尔500指数的，其他食品和饮品公司都更差些。文章提醒说，董事会的共同责任，是反常情得投资纪律，识别当利益时那些正在扩大的大会并购，而不是被潮流裹挟，冲昏头脑的跟风。\n\
    \n## 1 总结\n\n有股神巴菲特持的3G资本，如下下的表现并不佳，出现了巨额亏损，还迎来了他克帝尔哈瑞公司，从外面上看，是因为新兴品牌的激烈竞争，线上渠道扩展的，以及健康饮食等趋势餐饮的风潮，但《经济学人》认为，更深层次的内因，就像有句话说的，是削减成本，大宗交易和高额负债的这种商业模式，不是万能的，企业既不能为了刺激，失去应对市场的弹性，也不能被潮流裹挟，盲目跟风。\n\
    \n你认为对于食品行业的公司，消费者真的会为中意产品吗？欢迎在留言写下你的答案，也欢迎把你的内容转发给自己的朋友。\n\n## 今日重点：\n\n- 线上渠道拓展不佳，新兴品牌的竞争、以及健康饮食的新风潮，是美国传统食品巨头面临的三个大挑战。\n\
    - 3G资本的高杠杆，削减成本、大宗交易和高额负债的商业模式不是万能的，给企业留足创新的空间非常重要。\n\n# 资料来源：\n\n- *The Parable\
    \ of 3G CapitalBad Recipe, The Economist, March 2, 2019*\n- *An Accident with\
    \ The Ketchup, The Economist, March 2, 2019*\n- *Buffettology, The Economist,\
    \ March 2, 2019*\n\n# 下期预告：\n\n明天将给你带来的议题是#在路上的“镜像世界”#\n\n互联网和社交媒体的出现，极大地改变了我们与自我、与他人、与世界的交互方式，那么，在它们之后，谁将接棒，成为塑造未来的新趋势？答案是：镜像世界。尽管镜像世界仍处于蹒跚学步的阶段，但随着AR技术的推动，镜像世界正在迅猛发展，一步步走进我们的生活。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_55_0.png)\n\n# 用户留言\n\n提交留言可与专栏作者互动\n\
    \n- 写留言\n- 请朋友读\n\n# 208报告 | 在路上的“镜像世界”\n\n马骏毅\n\n凯文·凯利认为，如今镜像世界已打破游戏的范畴，开始渗透进人们工作、生活的各个领域，并且发展成继互联网和社交媒体之后的第三大平台。\n\
    \n今天的议题分为三个部分：\n\n- 什么是镜像世界？\n- 镜像世界有什么作用？\n- 镜像世界未来的发展局势\n\n互联网和社交媒体的出现，极大地改变了我们与自我、与他人、与世界的交互方式。那么，在它们之后，谁将接管，成为塑造未来的新形态？答案是：镜像世界。因为它能彻底打通虚拟与现实，给我们带来一个前所未有的，“如幻如真”的新世界。\n\
    \n尽管镜像世界仍处于蹒跚学步的阶段，但随着AR技术的推进，镜像世界正在迅速发展，一步步地走向我们的生活。《连线》杂志的创办人和执行主编凯文·凯利说，谁主了镜像世界这个平台，谁就能跻身于历史上最富有、最有权势的人或者企业的行列。\n\
    \nWhoever dominates this grand platform will become among the wealthiest and most\
    \ powerful people in history.\n\n这句话，也被选为了今天的花句。\n\n今天，我们就来给大家讲讲，这个镜像世界究竟是什么，它对未来的人类社会会产生怎样的影响。\n\
    \n# 什么是镜像世界？\n\n镜像世界这个概念，是由世界大学计算机学家、大卫·格勒恩特（David Gelernter）在1991年提出的。他认为，互联网形成的模式就是现实世界的全息复制，也就是镜像世界。我们可以和这个镜像世界进行互动，够触碰它，还能像在现实世界里那样移动它。\n\
    \n之前，镜像世界只是一个概念。直到AR技术的出现，镜像世界才逐渐趋于现实。AR技术是镜像世界的基础技术，它可以将现实和虚拟世界叠加在一起，产生非常真实有趣的互动性。\n\
    \n镜像世界最早的应用之一，就是游戏。2015年，任天堂推出了一款叫做Pokemon Go的手游风靡全球，玩家可以通过手机的摄像头，看到周围真实的，还可以寻找环境中的虚拟神奇宝贝，并且和它们进行互动。这款游戏就体现出了AR实现增强技术，我们可以把它看作是镜像世界的初步尝试。\n\
    \n凯文·凯利认为，如今镜像世界已打破游戏的范畴，开始渗透进人们工作、生活的各个领域，并且发展成继互联网和社交媒体之后的第三大平台。\n\n严格来说，目前大卫描述的镜像世界还没有实现，但他正在迅速向我们靠近。\n\
    \n上面，我就非常高兴地第二部分，来看看目前为止，镜像世界发展到了哪一步了，它都有哪些用途。\n\n![](img/82c50821bc552fe72722a78212114e65_56_0.png)\n\
    \n# 镜像世界有什么用？\n\n总的来说，镜像世界当前的应用，可以分为三大类：一是信息叠加，二是数字学生，三是构建逼真的虚拟世界。\n\n先来说第一个用途——信息叠加。在信息里，镜像世界可以作为一个覆盖在现实世界上的信息层。做了，就是，你在AR眼镜，看见的街角咖啡店，可以带你介绍信息，比如说，以前新认识的同事，头项都上AR标识。有了信息叠加后，你戴上AR眼镜，之前见过的所有人头顶部都有标识。\n\
    \n以像搜索文字一样，搜索立体的物理空间，到那个时候，人类的沟通效率将会成倍地提升。\n\n比如，你去了球赛现场，想和场外的朋友分享比赛的精彩瞬间，那么你可以把比赛场景，直接传送到朋友的AR设备中，让他有一个360度的直观体验。\n\
    \n其次，我们可以通过镜像世界，随时改变任何物体的颜色、位置。比如说，家里要装修，你想把家里墙的颜色换了，在镜像世界里，只要点个颜色按钮就可以，颜色随便挑。家具的大小、位置，在镜像世界里可以随意调整，直到找到让你最满意的配置。\n\
    \n再次，镜像世界能让计算机真正“看见”这个世界，能与人类更好地互动。只要世界上有足够多的摄像头，就能制作出一个和真实世界1:1，也就是完全一样的镜像世界。文章中说，在镜像世界里，智能助手都将具备象化，也许是机器人的形象，也许是人类的形象。这些具象化的智能助手，同时行走在现实世界与镜像世界叠加的双重世界里，它们不仅能够理解现实世界里事物之间的关系，还能根据人类在现实世界里的实时动作，进行合理的回应，并提供服务。\n\
    \n# 总结\n\n镜像世界是通过AR技术构建的一个叠加在现实世界上的虚拟世界。目前，它除了信息叠加和数字孪生两大功能外，还可以通过将SLAM，AR和AI融合到一起，构建一个虚实结合、难辨真假的世界。这个世界将成为新的大型科技平台，为各个产业带来创新与革命。\n\
    \n我最近还听到一个说法，苹果公司未来的战略核心，可能会是专注于开发更厉害的AR技术，以此来完成新一轮对科技行业的引领，听完今天《连线》的内容，是否也会让你换一个角度来看待苹果的战略呢？\n\
    \n你对镜像世界有什么样的期待，又有什么样的顾虑呢？\n\n欢迎在留言区写下你的答案，也欢迎你把今天的内容转发给自己的朋友。\n\n## 划重点\n\n-\
    \ 今日得到：\n  - 镜像世界能彻底打通虚拟与现实，它将彻底改变人与世界的交互方式，而日趋成熟的AR技术正在加速推动镜像世界的到来。\n  - 镜像世界的应用可以分为三大类：信息叠加、数字孪生、构造逼真的虚拟世界。\n\
