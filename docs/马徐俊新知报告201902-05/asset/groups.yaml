    电式扩张》中分享了如何成为行业巨头的秘密，简单来说，就是“唯快不破”、接受一定程度的混乱，以及关注当下、放弃完美。


    # 165报告 | 关于创新文化的五个硬道理


    关于硅谷的创新文化，我们都听过很多精彩的故事，比如苹果的扁平化管理，Facebook的“放纵管理”，但《哈佛商业评论》最新的封面文章却指出，我们一直忽略了创新文化的另一面，那就是严格的纪律。


    # 218报告 | “打破规则”的成功之道


    最新一期的《企业家》杂志采访了11位成功的创业者，他们的共性，就是在深刻了解既有规则的前提下，敢于打破规则，违背通行的创业经验，闯出了自己的天地。那么从他们身上，我们能得到哪些启示？


    # 241报告 | 如何给企业文化“排毒”？


    通常来说，如果一家企业的企业文化一团糟，大家勾心斗角乌烟瘴气，是不是就没救了？《哈佛商业评论》用一个“反转”案例，告诉我们如何给企业文化“排毒”。


    # 247报告 | “连接时代”的四种策略


    等着客户自动上门的商业模式越来越不是未来的主流了，《哈佛商业评论》提出，能够打通时间和空间的“无限连接时代”即将到来，企业和客户之间将会建立前所未有的深入连接关系。《哈佛商业评论》还提出了四种最有效的连接策略，分别是：回应渴望、策划式产品供应、行为指导和自动化执行。'
