    分成，平台分 45%，创作者分 55%。这就让这游戏主播的高产量、庞大的粉丝数量，超高的视频播放量都转化成了实实在在的变现能力。


    具体来说，YouTube会通过一套智能算法，为视频自动匹配最适合的贴片广告，并通过播放量来计算收益。据《福布斯》估算，YouTube上的顶级网红的视频，每1000
    个播放量可以为主播带来大约 5 美元的收益。以Markipler在今年1月26号发布的《生化危机2重制版》视频为例，到目前为止这条视频的播放量达到了364万，按照这个比例换算的话，单这一条视频，就已经给Markipler带来了近2万美元的收入。而这样的视频，Markplier一年能发布几百条。


    除此之外，这些游戏主播还在积极开拓副业来赚钱。比如我们之前提到的英国游戏主播DanDM，就推出了个人品牌的背包、卫衣和棒球帽；Markplier最近也和另一位当红游戏主播
    Jacksepticeye强强联手，推出了一款面向游戏玩家的运动服，包括开衫和T恤，这些48小时之内就销售一空。你看，这些游戏主播不光光游戏打得好，在玩转“粉丝经济”方面，他们也称得上是高手。


    # 总结


    游戏主播之所以能成为YouTube上最赚钱的群体，并不是说他们的专业能力和个人魅力就比其他类型的主播更强。这背后的奥秘，其实和游戏文化带来的庞大受众群、游戏视频内容突出的生产模式，以及YouTube具有激励性的广告分成模式都有关系。几乎每一项，都会在变现方面为游戏主播们加分，成为他们赚钱的优势。


    在很多人的刻板印象中，玩游戏只不过是一种娱乐消遣。甚至今天我们提到的这些游戏主播，当年辍学做游戏视频的时候，也遭到了父母的强烈反对，认为他们不务正业。可现实就是这么有意思，这些人正是靠着玩游戏，最终成为了全球知名的红人，赚取了普通人一辈子也难以企及的巨额财富。


    这可不只是靠运气，从更宏观的角度来说，这背后的推手，是时代。游戏主播们赶上了一个玩游戏也能赚钱，It pays to play的好时代。


