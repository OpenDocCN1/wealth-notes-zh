    《今日心理学》的文章提出，好的伴侣可以在感情中形成“米开朗基罗效应”，互相成为对方的“雕刻师”，持续地给伴侣支持和鼓励，让对方一点一滴地成为更好的自己。


    # 183报告| 如何通过“米开朗基罗效应”成就自己？


    在感情中形成“米开朗基罗效应”，你的伴侣就可以让你成为最好的自己。


    马徐骏


    今日心理学指出，称职的伴侣能够“雕刻”你，能引导你达到对自己的期待，能温柔地对待你，也能让你成为更好的自己。


    今天的阅读分为两个部分：


    - 什么是“雕刻者”？

    - 如何“雕刻”？


    如何让你的爱的人“互补”？


    我们都知道，想要变得更好，除了自身的努力之外，人生的另一半也很重要。好的伴侣可以帮助你更好地达成目标，成为更好的自己。


    “今日心理学”杂志最近发表了一篇文章，标题是《如何利用“米开朗基罗效应”》。文中指出，只要你的伴侣能够“雕刻”你，你的伴侣就可以让你成为更好的自己。


    *As long as you form Michelangelo effect, your relationship can be a tool that
    brings out the best in you.*


    这句话，也是咱们的金句。


    那么，什么是“米开朗基罗效应”？这个概念由著名心理学家查尔斯·雷德菲尔德·柯勒（Charles Reifried Koller）提出：意大利雕塑家米开朗基罗·博那罗蒂曾说：“我大理石中看到了被禁锢的天使，只有一凿一琢，才能把他们释放。”


    ![](img/82c50821bc552fe72722a78212114e65_4_0.png)


    所谓的“米开朗基罗效应”，就是从这句话里引申出来的。它的意思就是：就像雕塑家把石头凿成艺术珍品一样，你的伴侣也可以成为你的“雕刻家”，帮你发掘自己的优点，鼓励你发挥潜能，激发你的热情，支持你追求梦想，让你一点一点地变成一个更好的人。


    这种伴侣关系，不仅是“举案齐眉”式的相互体贴，更要强调彼此激发、相互成就。那么，怎样形成“米开朗基罗效应”呢？


    ## 什么是“雕刻者”？


    首先，你要寻找的伴侣，应当是能看到你的好，甚至从你身上看到连你自己都没有发现的好。


    于是她就将这件事儿写成文章，还发表在《纽约时报》上。


    俗话说“家丑不可外扬”，但奇怪的是，史蒂克里斯尽管觉得很丢脸，却还是发挥自己的文案专长，帮妻子润色文章的标题和文案。克里斯这样做的原因，归根结底还是在于他对妻子工作的理解和尊重，他深知一个好的标题，能够提升投稿的成功率，也明白写作是妻子毕生的重要事业，因此他非常乐于向妻子提供帮助，即便这会牺牲一点自己的面子。


    还有一层更深的原因是，文案本来就是克里斯引以为傲的专长，最能体现他自己的价值。从这个例子里我们可以看出，假如你的伴侣你在同一个领域或者相关领域工作，他就能更好地理解并尊重你的工作，甚至为你的工作添砖加瓦。


    ## 总结


    爱情中的米开朗基罗效应，可以让你在爱人的鼓励下一点一滴地变成一个更好的人。具体来说，能够形成米开朗基罗效应的伴侣，大多有三个特点：第一，他要能够时刻看到你的闪光点，鼓励你朝理想的自己前进，这一点也是最重要的；第二，他最好能和你有共同目标的奋斗目标，同时在性格上与你互相平衡；第三，他和你的专长最好能够相互促进，在事业上互相帮助。


    其实，只要满足了第一点，你就已经找到了一个能帮助你成就自己的好伴侣，而其他的条件，更是锦上添花。


    其实，第一条是所有其他条件的基础，也是米开朗基罗效应的核心，除了这一点外，只要满足了第一点，你就已经找到了一个能帮助你成就自己的好伴侣，而其他的条件，都是锦上添花。最重要的是，我们要记得远离那些不欣赏、不认同，也不鼓励你的那些“有毒”的伴侣，以免陷入自卑、绝望和迷茫的深渊。


    除了我们今天谈到的三点，你觉得一个理想的爱人，还需要哪些必备条件？


    欢迎你在留言区写下自己的答案，也欢迎你把今天的内容转发给自己的朋友们。


    ## 划重点


    今日得到：

    1. “米开朗基罗效应”提倡的伴侣关系，不仅是“举案齐眉”式的相互尊敬，它更强调彼此激发、相互成就。

    2. 所谓的“找对人”，是指伴侣能看见你的好，甚至能看到连你自己都没有发现的好，但你得真的拥有这样的优点，否则就不是对你的成全。

    3. 一个靠谱、自律、有条理的伴侣，能在潜移默化中把你也变成这样的人。


