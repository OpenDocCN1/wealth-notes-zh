    \n但是，这种情况正在发生变化。《经济学人》最新的一篇专栏报道，分析了科技融入银行业的大趋势，最重要的表现，就是电子银行的崛起，它将给整个银行业，以及我们普通人的生活带来一系列的变化。\n\
    \n这篇专栏报道篇幅不长，我先把它的核心告诉你：电子银行是银行，对传统银行业有巨大的反向作用，但对所有普通人而言，它也能够带来更大的生活便利和更理性的消费习惯。\n\
    \n### 什么是真正的电子银行？\n\n这篇报道很清楚地给出了一个界定，到底什么是 digital banking——传统银行的电子业务，比如是 digital\
    \ bank，指的是 bank 可以把传统的业务放到网络上，让我们可以通过电脑，或者手机这样的电子设备登录使用。\n\n而 digital bank 指的是完全没有实体分支，只能用手机在网上登录操作的金融服务。这两者有什么区别？可以用一个不太准确的比方，前者像是银行拿着它把建设银行放了一个手机App，而后者则是支付宝和蚂蚁金服。\n\
    \n为什么说这个比喻并不准确呢？因为我们国家有自己特殊的情况，支付宝和传统的银行之间有不能分离的，但是文章提到的其他国家，这两者之间的差别还是很明显的。\n\
    \n来了解一下英国的情况。在欧洲，我们把这种完全独立于传统银行体系之外的新型电子银行，称为“neobank”。像 Starling、Monzo、Revolut\
    \ 和 N26 是这类的 neobank。它们别立不、都是主要只向消费者服务，并且没有实体银行机构，只能通过网络登录，它们很受年轻人欢迎，增长速度非常快。\n\
