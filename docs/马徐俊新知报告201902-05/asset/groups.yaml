    # **今日报告：失去“视觉想象力”该怎么办?**


    就算没有 “视觉化” 的辅助, 人们还是可以充满创造力和想象力。


    > ——《BBC聚焦》


    **马徐俊**


    最新一期的《BBC聚焦》关注了近两 年以来科学研究的一个新领域——视觉想象力的障碍, 患者无法在脑海中想象苹果的甜味或颜色，甚至想不起家人 的长 相，这到底是
    怎么回事？有什 么样的解决办法?


    今天的议题分为三个部分:


    +   * “视觉想象力障碍”是什么 样的体验?

    * 是什么造成了视觉想象力障碍?

    * 如何应对视觉想象力障碍?


    先请你想象一个苹果。好，现在在想象中切开苹果、转 向它然后，想象它在你咬 了一口 的样子— 怎么样，能做到吧？这就是 “视觉想象力”。


    视觉想象力是人类最有用的能力之 一，爱因斯坦依赖视觉想象力，才能在脑中 做那些复杂的 “思想实验”，想想目光和 时间的关系；综艺节目《最强大脑》里的那些记忆大师，也要靠视觉想象力才记得
    大量复杂的信息。


    那么，假如人类失去了视觉想象力，会 变成什么样呢，还能思考和创造吗？其实不用假设，我要告诉你的事，在这个世界上，真有一部分人是 没有视觉想象力的，这也是神经科学家最近几年才
    发现的一种新的病症，叫 视觉想象力 障碍 症(Aphantasia)。


