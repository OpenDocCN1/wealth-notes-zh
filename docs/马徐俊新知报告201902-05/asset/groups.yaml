    - 什么是\"功能性障碍\"?\n- 为什么有人会患上这种病?\n- 怎样有效地治疗功能性障碍?\n\n你身边总有一些这样的人, 总说自己身体不适, 哪儿哪儿都不舒服,\
    \ 可去医院一检查吧, 什么事儿都没有。这时候别人就会说这个人, 要不就是在最关心你, 要不就是没病装病。但是, 最新一期的《新科学家》杂志的封面文章却告诉我们,\
    \ 我们可能都看错了他们, 他们不是装病, 而是认真地病了。不过, 他们身上的疾病, 不是因为某个身体部位出现了问题, 而是因为他们的大脑出了问题。这种病,\
    \ 就叫做**功能性障碍**(Functional Disorder)。\n\n得了功能性障碍的人, 尽管肉体上没毛病, 但大脑会让他们觉得自己病了, 他们会承受的痛苦,\
    \ 和身体上真得这个病的患者, 是一样的。好消息是, 现在医学检查已经关注好了。坏消息是, 研究发现了他, 疗效并不理想。这治疗方法倒非常简单, 患者在家就能自行操作,\
    \ 今天, 我们就来给你详细讲一讲。\n\n![](img/82c50821bc552fe72722a78212114e65_103_0.png)\n\n\
    ## 什么是功能性障碍?\n\n能够识别出功能性障碍非常重要, 如果识别不出来, 患者很有可能得不到合适的治疗, 为此承受巨大的痛苦。\n\n我先来给你讲讲什么是功能性障碍,\
    \ 它指的是你觉得自己得了某种病, 身上出现这种病的所有症状, 但检查不出问题。\n\n功能性障碍, 和器质性病变的区别在于, 器质性病变是可以从组织或器官层面找到病变的,\
    \ 但功能性障碍不是, 它是大脑的功能出了问题, 虽然功能上的异常, 但是身体的组织或器官并没有病变。\n\n我给你举两个文章中的例子, 你就更好理解什么叫做**功能性障碍**了。\n\
    \n有一位年轻人, 说自己右手麻木, 但是检查后说没有问题。但是, 他坚持说自己有毛病。医生让他用左手做某种动作, 发现左手也没问题。但是, 当他试图用右手时,\
    \ 右手真的没有反应了。这就是功能性障碍的一个例子, 他的大脑告诉他的右手它有问题, 于是它就真的没有反应了。\n\n还有一个例子, 一位女士, 说自己肚子疼,\
    \ 但是各种检查都没有问题。但是, 她坚持说自己有毛病。后来, 医生发现她的肚子上有很多小伤口, 是她自己用指甲抓出来的。医生告诉她, 这些伤口是真实的,\
    \ 但是肚子疼是她的想法导致的。\n\n![](img/82c50821bc552fe72722a78212114e65_103_1.png)\n\n##\
    \ 为什么有人会患上这种病?\n\n... (此处省略中间部分，根据原文直接承接下一页)\n\n![](img/82c50821bc552fe72722a78212114e65_104_0.png)\n\
    \n但是Stone发现，通常情况下，即使患者想相信自己没病，大脑也转不过“弯”来，那怎么办呢？Stone说，分心可以成为患者给自己治疗的手段。通常来说，功能性障碍患者在犯病前会有一些征兆，一旦他们发现这些征兆，就赶紧做一个让自己分心的事情，转移一下注意力，就能有效阻止犯病。\n\
    \n还有一些简单的办法，比如说倒数五个数、或者四处看看找特定的颜色，或者哪怕是和别人说说话，都能转移注意力。文章里说，有一个功能性癫痫的患者叫Payne，她平时走路会用一根拐杖，拐杖上有几个用来调节高度的金属卡扣，每当Payne觉得自己快要犯病了，就用手来回摸这些卡扣，靠这一招，她已经两年没犯过病了。Payne说，你得学会在犯病之前，让大脑想点别的。\n\
    \n## 总结\n\n有些人，身体检查没问题，却总觉得自己生病了，也许这些人没有撒谎，他们是患了功能性障碍。只有正确诊断出了这种病，才能得到有效的治疗。研究发现，分心测试，既能帮助诊断功能性障碍，也能帮助患者缓解症状。但对功能性障碍的探索，意义不仅于此，它也帮助研究者理解大脑是如何影响身体的。\n\
    \n如果有一天，研究者彻底地解开了这个谜题，那么我们就能够实现利用意识来调节身体的健康了。真到了那一天，今天这篇文章的标题《心胜于物》这四个字，也就离我们不远了。\n\
    \n*Mind over matter.*\n\n这句话也被我选为今天的金句。\n\n你有过发生功能性障碍的经历么？\n\n欢迎在留言区分享你的经历。\n\n\
    ## 划重点\n\n- **今日得到：**\n    1. **功能性障碍是一种大脑功能障碍，患者明明没病，却觉得自己身体出了问题。**\n    2. **功能性障碍的病因目前还没有定论，三种最常见的病理解释是心理创伤、创伤后心理后遗症、大脑处理信号功能失调。**\n\
    \    3. **治疗功能性障碍的有效办法叫做“分心测试”，本质上就是转移病人的注意力。**\n\n## 资料来源\n\n网站：\n* *Mind Over\
    \ Matter*, by Clare Wilson, *New Scientist*, 2019.04.06\n\n## 下期预告\n\n明天的议题是 **#为什么探月又成了热点？#**\n\
    \n从1969年阿姆斯特朗从阿波罗11号里走出来，一转眼，到今年人类登上月球已经有50年了。这五十年，世界发生了翻天覆地的变化，人类对月球的探索上也从来没有停止过步伐。《华尔街日报》最近发表了一系列文章，探讨为什么月球变得比以往更加重要。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_104_1.png)\n\n# 233报告 | 探月为什么又成了热点？\n\
    \n马徐骏·新知报告\n今天\n\n> 新知\n\n**今日报告：探月为什么又成了热点？**\n\n每一个人都像古希腊的英雄奥德修斯一样，我们的“生活”是一次史诗般的远征。我们想去到新的地方、看见新的事物、了解新的想法。而所有的所作所为，都是为了未知的明天而准备。\n\
    \n> ——阿姆斯特朗\n\n马徐骏\n人类登月的目标，从当年的“奔月”，变成了如今的“淘金热”。\n\n今天的议题分为两个部分：\n- 探月为什么又成了热点？\n\
    - 谁在推动月球资源开采？\n\n1969年7月20日，美国宇航员阿姆斯特朗从阿波罗11号走出，在月球表面留下了那双著名的脚印，开启了人类登月的征途。一转眼，五十多年过去了，世界发生了翻天覆地的变化，而人类对月球的探索也从来没有停过步伐。今年，《华尔街日报》发表了一系列关于月球的专栏，传递了一个核心观点：人类登月五十年后，月球探索再次成为全球热点，月球变得比以往更加重要。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_105_0.png)\n\n我曾在咱们专栏的209号报告给你讲过，人类为什么要去太空开采资源。在今天这篇报告里，我要告诉你的是推动太空开采热背后的原因，为什么各国政府和各大企业都为了太空开采有着这么高的热情，尤其是为什么月球成为了最热门的太空开采地点。\n\
    \n## 探月为什么又成了热点？\n\n读过《华尔街日报》的介绍，你会发现月球成为热点的两个原因：第一，人类目前正在推行的政策，明确了太空资源的分配方式，在某种程度上鼓励了私人企业进行月球探索；第二，月球探索具有巨大的商业潜力。\n\
    \n咱们先来说第一点，看看太空资源分配政策的变化。\n\n《华尔街日报》说，跟50年前相比，各个国家对太空探索的态度，现在是越来越宽松。其中最重大的一个突破，就是允许个人去开采太空资源了。\n\
    \n1967年1月，联合国制定了《外层空间条约》（Outer Space Treaty），这个条约号称“太空宪法”，规定了从事航天活动所应遵守的十项基本原则。其中，有一项原则只说了两件事，一件叫“golden\
    \ rule”——黄金定律，它的意思是简单：不许别人做的事，自己也别做；另一件叫“don’t do anything stupid”——别做傻事，意思是，别做任何可能造成危害的事情，比如污染太空、部署杀伤性武器之类的。\n\
    \n这项原则从大的方向上规范了世界各国航天活动，在当时的历史背景下，也很好地避免了各个军事强国在外层空间的军备竞赛。\n\n但是，这个条约忽略了一个很重要的事情，就是它约定的对象主要是各国政府，而对于非政府组织的太空探索行为，没有做出明确的界定。这就使得私有企业处于监管的“灰色地带”。\n\
    \n这会带来什么样的问题呢？假设有一个公司，它有能力和资金去太空探索，但它不确定它到底能不能拥有这些资源。一旦它开发了太空资源创造了价值，也不知道这些价值归谁所有。有了这些风险，导致没有企业有动力投入大量的资源来发展技术，进军太空。\n\
    \n直到2015年，美国总统奥巴马签署了《美国太空Launch竞赛法》（Commercial Space Launch Competitiveness Act\
    \ of 2015），这个法案规定，任何美国公民都享有对太空资源的所有权。虽然太空是所有人的，但不能属于哪个太空企业，但如果谁开发出了有价值的资源，那这些资源就归属于开发商。\n\
    \n这个法案一出来，就极大地激发了人们对太空探索的热情。有人把现在的太空探索比作美国的西部大开发，人们对广阔的未知领域，充满了驰骋马地的狂野激情。\n\n\
    说完了太空政策上的宽松，我们再来说说更实际的——月球探索背后，藏着巨大的商业价值。这个价值体现在两个方面：第一，月球开采省去了前期探索的成本；第二，月球蕴含着大量稀缺的资源，尤其是氦-3。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_105_1.png)\n\n咱们在209报告中已经知道，小行星里富含各种稀缺资源，但月球之所以格外热门，是因为月球开采省去了采样、样本的过滤、寻找、再开采的过程，先发射探测设备采样，看看这个小行星都有哪些资源，然后再研发技术和设备，看看怎么把资源带回来。\n\
    \n但月球就不一样了，人类明确地知道月球蕴含的各种资源，可以直接派采集设备，直接进入开采、利用资源的环节。这节省了大量的时间和资源，也可以更有针对性地投入设备和技术研发。\n\
    \n那么月球开采合不合算呢？非常合算！如果把月球上的资源归到地球，足以覆盖所有的探索成本，还有很大的利润空间。现在人们普遍看中的月球资源是氦-3，它可以作为可控核聚变的能源，而且是使用氦-3作为能源时，不会产生辐射，没有环境污染，它是一种绝对清洁的能源。\n\
    \n氦-3的储量在整个地球上最多只有500公斤，每吨的价格是50亿美金。而在月球上，氦-3拥有100万吨，基本属于取之不竭的能源。现在的航天飞机理论上往返一次可以带回20吨的氦-3。\n\
    \n其实，别说20吨了，哪怕能带回1吨氦-3，就能净赚4亿美元，是开采成本的10倍。这个投资回报比，比地球上的很多项目都要高很多。\n\n人们对太空探索的印象，最早可能来自于美苏争霸时期。那个时候，两个超级大国像疯了一样去月球，去告诉对方“我只比你好”……没人关心那些项目赚不赚钱，甚至连成本多少都不怎么重要。\n\
    \n阿波罗项目在1973年结束，前后总共烧掉了254亿美元。要知道，1973年中国的GDP才1000多亿美元啊。所以，当时的这些项目经费回报极低，完全不能和他们的巨额投入相比。\n\
    \n可是50年后的今天，情况就完全不一样了，在宽松政策和巨大的商业利益的助推下，月球成了各国政府和企业眼中的“金山”。它们具体是怎么做的呢？\n\n![](img/82c50821bc552fe72722a78212114e65_105_2.png)\n\
    \n## 谁在推动月球资源开采？\n\n总的来说，实力强劲的国家和企业，都已经在布局月球的探索了。除了国家之间的太空合作，在《外层空间条约》与企业的合作之外，《美国商业太空发射竞赛法》的推动下，还有许多私有企业参与到这个月球热潮中来。\n\
    \n走在最前面的，还是两个财大气粗的“金主”——中国和美国政府。中国的探月计划已经持续到2030年：今年年底，嫦娥五号将会登陆月球取土，然后会把样本带回地球；到2030年，中国的月球永久空间站将会建成。\n\
    \n美国也正在制定未来几年的财政预算，在NASA 2021的总经费可能会减少，但是，探月的预算会增加5亿美元，主要目的就是尽快把人再次送到月球上。\n\n\
    NASA也和私企业签订了合同，把一些实验和探测任务打包了出去，其中就包括一家叫做“Moon Express”的公司。这家公司曾经希望获得道达尔公司的“月球\
    \ X 大奖”（Lunar X Prize），这个竞赛很有新意，如果哪家公司能够第一个把机器人发射到月球上去，...\n\n![](img/82c50821bc552fe72722a78212114e65_105_3.png)\n"
  mdcn: "\n# 总结\n\n中国的汽车产业正在经历第二次革命，《经济学人》的文章帮我们从不同的角度，分析了中国在电动车领域得天独厚的优势。\n\n但最值得我们思考的，是在文章最后，《经济学人》点出了这些优势背后最强大的逻辑：中国最大、最无法复制的优势，是中国把电动汽车，当做了一个面向未来的国家级层面的重要战略来考虑。因此政府不光是给政策，全中国在电动车配套的基础设施设计建设方面，也领先于全球，比如北京一个城市的电动车充电桩，比整个德国都多。\n\
    \n通过电动车产业，中国想要创造一个强大的生态系统，集成了汽车制造、共享出行、人工智能、大数据、电信、电池、环境治理、智慧城市等等所有面向未来的技术，创造出一个新的集合式标准，最终变成全世界都会采用的通行标准。\n\
    \n未来在跟特斯拉、谷歌这些公司之间的竞争中，你会更看好中国的电动车吗？为什么呢？\n\n## 划重点\n\n- **今日得到：**\n    1. 中国汽车的产能迎来了一次爆发，去年中国一共生产了2300万辆汽车，把欧洲和美国远远地甩在了后面。\n\
    \    2. 中国造电动车的优势，可以归纳为三个维度：存量负担小、市场需求大和技术优势强。\n    3. 中国造电动车的技术优势，体现在电池、共享出行和自动驾驶三个方面。\n\
    \n## 资料来源\n\n> 刊物：\n> *Chinese Mobility: Great Wheels of China*, *The Economist*,\
    \ April 6, 2019\n\n## 下期预告\n\n明天的议题是 **#你为什么总会着急#**?\n\n我们在生活中经常会讨厌排队、塞车、讨厌前面的人走得慢吞吞，《鹦鹉螺》的文章指出，这是一种“慢怒症”，它扰乱我们的情绪，让我们变得不耐烦、愤怒，甚至做出不理智的行为。那为什么会出现这种情况呢？我们又该如何应对呢？\n\
    \n![](img/82c50821bc552fe72722a78212114e65_100_0.png)\n\n# 231报告 | 怎样克服“慢怠症”？\n\
    \n> 马徐骏 × 新知报告\n\n马徐骏\n今天\n\n**今日报告：怎样克服“慢怠症”？**\n\n感恩，是让我们更有耐心的捷径。\n——《鹅妈妈》\n\
    \n马徐骏\n生活节奏的加快，让我们对“慢”的容忍度越来越低了。这种“慢怠症”，正在吞噬我们的幸福感。\n\n今天的选题分为两个部分：\n- 为什么我们对“慢”这么愤怒？\n\
    - 如何拿回情绪的主动权？\n\n你有没有这样的经历：去超市买东西结账，排着长长的队，可前面的人走起慢吞吞的，你会觉得不耐烦，忍不住催快点；去超市，上网站，网页加载半天也不回来，你会合不住反复刷新。总之，就是对慢慢吞吞的一切感到烦躁。\n\
    \n其实这些经历和感受每个人有，用《鹅妈妈》最新一篇的观点来看，其实，人们讨厌的不是“排队”，而是走得很慢的“人”；不是需要反复刷新的“页面”，而是“慢”本身。这种面对“慢”的讨厌与缓慢的厌恶，在英文里叫作“slowness\
    \ rage”，翻译成汉语就是“慢怒症”，跟我们很熟悉的“路怒症”一字之变。\n\n对慢的愤怒无处不在，它扰乱我们的情绪，让我们变得不耐烦、愤怒，甚至让我们变得焦躁。那对这种情况我们该怎么办呢？\n\
    \n![](img/82c50821bc552fe72722a78212114e65_101_0.png)\n\n## 1 为什么我们对“慢”这么愤怒？\n\
    \n总的来说，造成慢怠症有生理和心智两方面的原因。从生理层面来看，每个人的身体里面都有一个“内部计时器”（internal timer），它会影响我们的心情，调节我们的行为；可当外界节奏越来越快，它打乱了我们的内部计时器，让我们越来越追求“快”，也越来越讨厌等待。\n\
    \n先来说说我们的内部计时器是干什么用的。内部计时器是人体为了维持平衡、能做出的一些反应而准备的。它让我们在需要等待时能保持耐心，在还没法实现时，又能产生足够“不耐烦”的情绪，催促你去行动。\n\
    \n你可以设想这么个场景：在远古时代，你的祖先在狩猎时为了延长对一头猎物的潜伏，可能要潜伏在草丛里，一动也不能动，否则就会给猎物发现。这个时候，就需要绝对的耐心。\n\
    \n但换个场景，一个人在外面等待食物时，如果食物不幸在外界无法获取，你要么等死要么行动。这个时候内部计时器就会发出警报，让我们产生不耐烦的情绪，放弃等待采取行动去获取食物，而不是在原地饿死。\n\
    \n所以你看，“耐心”和“不耐烦”，其实是根据不同时间和地点产生的有效情绪状态，是我们做出的反应。\n\n根据德国莱茵大学心理系和心理健康研究研究所心理学家，马克·维特曼（Marc\
    \ Wittmann）的研究，不耐烦、愤怒并不会让我们在一项活动中彻底失败，而是给了我们采取行动的中头。\n\n但现实问题是，我们的内部计时器，遵循的是几千年的古老节奏，而现代社会的节奏越来越快，打破了这种平衡。越来越快，越来越不耐烦，越来越焦躁，为了我们情绪里的常客。\n\
    \n社会节奏加快得有多快呢？德国耶拿大学社会和哲学教授格尔特·罗萨（Hartmut Rosa），他在其出版的《新异化的诞生》中指出，相比现代之前的时代，人类目前的运动速度，提升了100倍；信息交流的速度，提升了1000万倍；数据传输的速度，更是提升了100亿倍。\n\
    \n听起来这些数字可能还是觉得无感，那我来个具体的问题：你能忍受不断刷新的网页加载时间，最长是多久？\n\n我问我身边的人，有人说1秒的，也有说5秒的，根据维基百科的介绍，最能接受的最长时间是0.25秒。有意思的是，在2006年，这个时长是4秒，到2009年，就变成了2秒，而到现在，只剩下0.25秒。2012年，研究人员还发现，如果一个视频不能加载在2秒之内，就完全没有希望成为网红视频，进行病毒式传播了。\n\
    \n再问你一个问题：你有没有发现，现在人们越来越难以耐心，而且对互联网科技越发的发达，人们对越发的速度也越来越在意。在英文中，有个词专门描述一个城市里人走路速度，叫作pulse\
    \ of a city，翻译成中文就是“城市脉搏”。\n\n20世纪90年代，心理学家罗伯特·范恩斯，带着同事在世界上31个大型城市里，进行了城市脉搏的调查，结果显示，在纽约，每人走60英尺，大约就是1米多左右，要花大概1秒半。别看有一点两秒的差别，自己亲自走试就知道，速度会快多少了。还有研究者发现，到了2000年左右，全世界人走路的速度，都上升了10%。\n\
    \n科技的快速发展，带来了社会的快速转变，而社会的快速转变，进一步打乱了内部计时器的节奏，我们变得越来越追求即时回报，不愿意等待，耐心越来越少了。由此我们产生了“慢怠症”，它让我们恼怒、焦虑，减少了我们的幸福感，还让我们越来越冲动。\n\
    \n那有没有方法，能让我们克服“慢怠症”，恢复耐心呢？\n\n![](img/82c50821bc552fe72722a78212114e65_101_1.png)\n\
    \n通过想一些“感恩”的事情，来调节自己的情绪，提升自己的耐性。另外，如果你有意识地通过5-4-3-2-1方法来训练自己，不仅能有效平复情绪，还能提升自己管理注意力的能力。\n\
    \n正如文章说的那样：“感恩，是让你更有耐心的捷径”。\n\n*Gratitude is a mental shortcut to more patience.*\n\
    \n这句话也被我选为今天的金句。\n\n你生活里有“慢怒症”的情况发生么？你是如何应对的？\n\n欢迎留言写下自己的答案。\n\n## 划重点\n\n- **今日得到:**\n\
    \    1. 对“慢”产生的强烈愤慨和不耐烦，被称作“慢怒症”，它会大大降低我们的生活幸福感。\n    2. 我们每个人的身体里面都有一个“内部计时器”，它可以调节我们情绪的平衡，而现代社会的节奏越来越快，打破了这种平衡，让人们变得越来越没有耐心。\n\
    \    3. 治疗“慢怒症“的方法有两种：保持感恩、使用5-4-3-2-1五感训练法。\n\n## 资料来源\n\n网站：\n*Why Your Brain\
    \ Hates Slowpokes*, by Chelsea Wald, *Nautilus*, 2019.04.04\n\n## 下期预告\n\n下周一的议题是\
    \ **#大脑是如何骗你生病的？#**\n\n你可能遇到过这样的人，他们总觉得自己身体不好，去医院却查不出什么具体的病。《新科学家》的文章指出，这些人不一定是在装病，他们可能患上了一种叫做“功能障碍”的病，病人的身体没有问题，真正出问题的，是他们的大脑。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_102_0.png)\n\n# 232报告 | 大脑怎样\"骗\"你生病?\n\
    \n马徐骏·新知报告\n今天\n\n> 232报告 | 大脑怎样\"骗\"你生病?\n\n**今日报告: 大脑怎样\"骗\"你生病?**\n\n心生于物,\n\
    ——《新科学家》\n\n马徐骏\n\"功能性障碍\"患者一旦被骗诊,会承受来自生理和心理上的双重痛苦, 能够正确地识别出这种疾病,非常关键。\n\n今天的议题分为三个部分:\n\
    - 什么是\"功能性障碍\"?\n- 为什么有人会患上这种病?\n- 怎样有效地治疗功能性障碍?\n\n你身边总有一些这样的人, 总说自己身体不适, 哪儿哪儿都不舒服,\
    \ 可去医院一检查吧, 什么事儿都没有。这时候别人就会说这个人, 要不就是在最关心你, 要不就是没病装病。但是, 最新一期的《新科学家》杂志的封面文章却告诉我们,\
    \ 我们可能都看错了他们, 他们不是装病, 而是认真地病了。不过, 他们身上的疾病, 不是因为某个身体部位出现了问题, 而是因为他们的大脑出了问题。这种病,\
    \ 就叫做**功能性障碍**(Functional Disorder)。\n\n得了功能性障碍的人, 尽管肉体上没毛病, 但大脑会让他们觉得自己病了, 他们会承受的痛苦,\
    \ 和身体上真得这个病的患者, 是一样的。好消息是, 现在医学检查已经关注好了。坏消息是, 研究发现了他, 疗效并不理想。这治疗方法倒非常简单, 患者在家就能自行操作,\
    \ 今天, 我们就来给你详细讲一讲。\n\n![](img/82c50821bc552fe72722a78212114e65_103_0.png)\n\n\
    ## 什么是功能性障碍?\n\n能够识别出功能性障碍非常重要, 如果识别不出来, 患者很有可能得不到合适的治疗, 为此承受巨大的痛苦。\n\n我先来给你讲讲什么是功能性障碍,\
    \ 它指的是你觉得自己得了某种病, 身上出现这种病的所有症状, 但检查不出问题。\n\n功能性障碍, 和器质性病变的区别在于, 器质性病变是可以从组织或器官层面找到病变的,\
    \ 但功能性障碍不是, 它是大脑的功能出了问题, 虽然功能上的异常, 但是身体的组织或器官并没有病变。\n\n我给你举两个文章中的例子, 你就更好理解什么叫做**功能性障碍**了。\n\
    \n有一位年轻人, 说自己右手麻木, 但是检查后说没有问题。但是, 他坚持说自己有毛病。医生让他用左手做某种动作, 发现左手也没问题。但是, 当他试图用右手时,\
    \ 右手真的没有反应了。这就是功能性障碍的一个例子, 他的大脑告诉他的右手它有问题, 于是它就真的没有反应了。\n\n还有一个例子, 一位女士, 说自己肚子疼,\
    \ 但是各种检查都没有问题。但是, 她坚持说自己有毛病。后来, 医生发现她的肚子上有很多小伤口, 是她自己用指甲抓出来的。医生告诉她, 这些伤口是真实的,\
    \ 但是肚子疼是她的想法导致的。\n\n![](img/82c50821bc552fe72722a78212114e65_103_1.png)\n\n##\
    \ 为什么有人会患上这种病?\n\n... (此处省略中间部分，根据原文直接承接下一页)\n\n![](img/82c50821bc552fe72722a78212114e65_104_0.png)\n\
    \n但是Stone发现，通常情况下，即使患者想相信自己没病，大脑也转不过“弯”来，那怎么办呢？Stone说，分心可以成为患者给自己治疗的手段。通常来说，功能性障碍患者在犯病前会有一些征兆，一旦他们发现这些征兆，就赶紧做一个让自己分心的事情，转移一下注意力，就能有效阻止犯病。\n\
    \n还有一些简单的办法，比如说倒数五个数、或者四处看看找特定的颜色，或者哪怕是和别人说说话，都能转移注意力。文章里说，有一个功能性癫痫的患者叫Payne，她平时走路会用一根拐杖，拐杖上有几个用来调节高度的金属卡扣，每当Payne觉得自己快要犯病了，就用手来回摸这些卡扣，靠这一招，她已经两年没犯过病了。Payne说，你得学会在犯病之前，让大脑想点别的。\n\
    \n## 总结\n\n有些人，身体检查没问题，却总觉得自己生病了，也许这些人没有撒谎，他们是患了功能性障碍。只有正确诊断出了这种病，才能得到有效的治疗。研究发现，分心测试，既能帮助诊断功能性障碍，也能帮助患者缓解症状。但对功能性障碍的探索，意义不仅于此，它也帮助研究者理解大脑是如何影响身体的。\n\
    \n如果有一天，研究者彻底地解开了这个谜题，那么我们就能够实现利用意识来调节身体的健康了。真到了那一天，今天这篇文章的标题《心胜于物》这四个字，也就离我们不远了。\n\
    \n*Mind over matter.*\n\n这句话也被我选为今天的金句。\n\n你有过发生功能性障碍的经历么？\n\n欢迎在留言区分享你的经历。\n\n\
    ## 划重点\n\n- **今日得到：**\n    1. **功能性障碍是一种大脑功能障碍，患者明明没病，却觉得自己身体出了问题。**\n    2. **功能性障碍的病因目前还没有定论，三种最常见的病理解释是心理创伤、创伤后心理后遗症、大脑处理信号功能失调。**\n\
    \    3. **治疗功能性障碍的有效办法叫做“分心测试”，本质上就是转移病人的注意力。**\n\n## 资料来源\n\n网站：\n* *Mind Over\
    \ Matter*, by Clare Wilson, *New Scientist*, 2019.04.06\n\n## 下期预告\n\n明天的议题是 **#为什么探月又成了热点？#**\n\
    \n从1969年阿姆斯特朗从阿波罗11号里走出来，一转眼，到今年人类登上月球已经有50年了。这五十年，世界发生了翻天覆地的变化，人类对月球的探索上也从来没有停止过步伐。《华尔街日报》最近发表了一系列文章，探讨为什么月球变得比以往更加重要。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_104_1.png)\n\n# 233报告 | 探月为什么又成了热点？\n\
    \n马徐骏·新知报告\n今天\n\n> 新知\n\n**今日报告：探月为什么又成了热点？**\n\n每一个人都像古希腊的英雄奥德修斯一样，我们的“生活”是一次史诗般的远征。我们想去到新的地方、看见新的事物、了解新的想法。而所有的所作所为，都是为了未知的明天而准备。\n\
    \n> ——阿姆斯特朗\n\n马徐骏\n人类登月的目标，从当年的“奔月”，变成了如今的“淘金热”。\n\n今天的议题分为两个部分：\n- 探月为什么又成了热点？\n\
    - 谁在推动月球资源开采？\n\n1969年7月20日，美国宇航员阿姆斯特朗从阿波罗11号走出，在月球表面留下了那双著名的脚印，开启了人类登月的征途。一转眼，五十多年过去了，世界发生了翻天覆地的变化，而人类对月球的探索也从来没有停过步伐。今年，《华尔街日报》发表了一系列关于月球的专栏，传递了一个核心观点：人类登月五十年后，月球探索再次成为全球热点，月球变得比以往更加重要。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_105_0.png)\n\n我曾在咱们专栏的209号报告给你讲过，人类为什么要去太空开采资源。在今天这篇报告里，我要告诉你的是推动太空开采热背后的原因，为什么各国政府和各大企业都为了太空开采有着这么高的热情，尤其是为什么月球成为了最热门的太空开采地点。\n\
    \n## 探月为什么又成了热点？\n\n读过《华尔街日报》的介绍，你会发现月球成为热点的两个原因：第一，人类目前正在推行的政策，明确了太空资源的分配方式，在某种程度上鼓励了私人企业进行月球探索；第二，月球探索具有巨大的商业潜力。\n\
    \n咱们先来说第一点，看看太空资源分配政策的变化。\n\n《华尔街日报》说，跟50年前相比，各个国家对太空探索的态度，现在是越来越宽松。其中最重大的一个突破，就是允许个人去开采太空资源了。\n\
    \n1967年1月，联合国制定了《外层空间条约》（Outer Space Treaty），这个条约号称“太空宪法”，规定了从事航天活动所应遵守的十项基本原则。其中，有一项原则只说了两件事，一件叫“golden\
    \ rule”——黄金定律，它的意思是简单：不许别人做的事，自己也别做；另一件叫“don’t do anything stupid”——别做傻事，意思是，别做任何可能造成危害的事情，比如污染太空、部署杀伤性武器之类的。\n\
    \n这项原则从大的方向上规范了世界各国航天活动，在当时的历史背景下，也很好地避免了各个军事强国在外层空间的军备竞赛。\n\n但是，这个条约忽略了一个很重要的事情，就是它约定的对象主要是各国政府，而对于非政府组织的太空探索行为，没有做出明确的界定。这就使得私有企业处于监管的“灰色地带”。\n\
    \n这会带来什么样的问题呢？假设有一个公司，它有能力和资金去太空探索，但它不确定它到底能不能拥有这些资源。一旦它开发了太空资源创造了价值，也不知道这些价值归谁所有。有了这些风险，导致没有企业有动力投入大量的资源来发展技术，进军太空。\n\
    \n直到2015年，美国总统奥巴马签署了《美国太空Launch竞赛法》（Commercial Space Launch Competitiveness Act\
    \ of 2015），这个法案规定，任何美国公民都享有对太空资源的所有权。虽然太空是所有人的，但不能属于哪个太空企业，但如果谁开发出了有价值的资源，那这些资源就归属于开发商。\n\
    \n这个法案一出来，就极大地激发了人们对太空探索的热情。有人把现在的太空探索比作美国的西部大开发，人们对广阔的未知领域，充满了驰骋马地的狂野激情。\n\n\
    说完了太空政策上的宽松，我们再来说说更实际的——月球探索背后，藏着巨大的商业价值。这个价值体现在两个方面：第一，月球开采省去了前期探索的成本；第二，月球蕴含着大量稀缺的资源，尤其是氦-3。\n\
    \n![](img/82c50821bc552fe72722a78212114e65_105_1.png)\n\n咱们在209报告中已经知道，小行星里富含各种稀缺资源，但月球之所以格外热门，是因为月球开采省去了采样、样本的过滤、寻找、再开采的过程，先发射探测设备采样，看看这个小行星都有哪些资源，然后再研发技术和设备，看看怎么把资源带回来。\n\
    \n但月球就不一样了，人类明确地知道月球蕴含的各种资源，可以直接派采集设备，直接进入开采、利用资源的环节。这节省了大量的时间和资源，也可以更有针对性地投入设备和技术研发。\n\
    \n那么月球开采合不合算呢？非常合算！如果把月球上的资源归到地球，足以覆盖所有的探索成本，还有很大的利润空间。现在人们普遍看中的月球资源是氦-3，它可以作为可控核聚变的能源，而且是使用氦-3作为能源时，不会产生辐射，没有环境污染，它是一种绝对清洁的能源。\n\
    \n氦-3的储量在整个地球上最多只有500公斤，每吨的价格是50亿美金。而在月球上，氦-3拥有100万吨，基本属于取之不竭的能源。现在的航天飞机理论上往返一次可以带回20吨的氦-3。\n\
    \n其实，别说20吨了，哪怕能带回1吨氦-3，就能净赚4亿美元，是开采成本的10倍。这个投资回报比，比地球上的很多项目都要高很多。\n\n人们对太空探索的印象，最早可能来自于美苏争霸时期。那个时候，两个超级大国像疯了一样去月球，去告诉对方“我只比你好”……没人关心那些项目赚不赚钱，甚至连成本多少都不怎么重要。\n\
    \n阿波罗项目在1973年结束，前后总共烧掉了254亿美元。要知道，1973年中国的GDP才1000多亿美元啊。所以，当时的这些项目经费回报极低，完全不能和他们的巨额投入相比。\n\
    \n可是50年后的今天，情况就完全不一样了，在宽松政策和巨大的商业利益的助推下，月球成了各国政府和企业眼中的“金山”。它们具体是怎么做的呢？\n\n![](img/82c50821bc552fe72722a78212114e65_105_2.png)\n\
    \n## 谁在推动月球资源开采？\n\n总的来说，实力强劲的国家和企业，都已经在布局月球的探索了。除了国家之间的太空合作，在《外层空间条约》与企业的合作之外，《美国商业太空发射竞赛法》的推动下，还有许多私有企业参与到这个月球热潮中来。\n\
    \n走在最前面的，还是两个财大气粗的“金主”——中国和美国政府。中国的探月计划已经持续到2030年：今年年底，嫦娥五号将会登陆月球取土，然后会把样本带回地球；到2030年，中国的月球永久空间站将会建成。\n\
    \n美国也正在制定未来几年的财政预算，在NASA 2021的总经费可能会减少，但是，探月的预算会增加5亿美元，主要目的就是尽快把人再次送到月球上。\n\n\
    NASA也和私企业签订了合同，把一些实验和探测任务打包了出去，其中就包括一家叫做“Moon Express”的公司。这家公司曾经希望获得道达尔公司的“月球\
    \ X 大奖”（Lunar X Prize），这个竞赛很有新意，如果哪家公司能够第一个把机器人发射到月球上去，...\n\n![](img/82c50821bc552fe72722a78212114e65_105_3.png)\n"
