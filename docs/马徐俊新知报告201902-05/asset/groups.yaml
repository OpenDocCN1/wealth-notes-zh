    2. 欧洲是硅谷非常重要的海外市场，占到了科技巨头们收入的1/4，而且欧盟的法令一直是被全世界效仿的模板，所以《经济学人》才会说，欧盟的决定，会影响科技巨头的未来。

    3. 欧洲对垄断企业的警惕远胜于美国，欧盟所在地布鲁塞尔，在西方世界甚至有“反垄断之都”的称号。


