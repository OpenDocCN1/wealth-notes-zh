    ## 258报告 | 抗生素之死

    马欣骏 · 新知报告


    ### 今日报告：抗生素之死


    抗生素创造奇迹的时代正在结束，我们都应该感到害怕。


    > ——《新闻周刊》


    马欣骏


    如果有越来越多的细菌产生抗药性，那就意味着，人类将不得不再回到抗生素发明之前的时代。


    今天的议题分为两个部分：

    - 抗生素危机有多严峻？

    - 如何应对抗生素危机？


    最近一期《新闻周刊》报道了一个非常值得关注的流行病学研究趋势——细菌对于抗生素的抵抗力越来越强了，它们都变成了抗生素杀不死的超级细菌（superbugs）。


    超级细菌什么意思？打个比方，大肠杆菌本来是人体常见的细菌，如果我们体内的大肠杆菌挺听话的，不会带来生命危险，但只要你及时地用它，抗生素杀不死，也不会出什么大题目。但是，如果这些大肠杆菌对抗生素免疫了，那就已经严重了——感染大肠杆菌的患者，有一半会在两周内死亡。


    其实大肠杆菌案只是个引子，今天报告重点在于，《新闻周刊》报道了一个非常严峻的趋势，那就是细菌对于抗生素的抵抗力越来越强了，换句话说，抗生素正在渐渐失败。


    这也是为什么这一期《新闻周刊》封面文章的标题叫做《抗生素之死》（The Death of Antibiotics），文章的主旨就是——抗生素奇迹的时代在慢慢走向尾声。


    其实关于抗生素杀不死的超级细菌这方面的报道，我之前也看到过很多，但这次不一样，是美国《新闻周刊》的报道，无论是杂志久负盛名的声誉，还是内容的严谨性来说，都值得听一下。


    ### 抗生素危机到底有多严峻？


    按照《新闻周刊》的话来说，就是抗生素创造奇迹的时代，即将结束。


    1942年，青霉素首次投入使用，拯救了13名战伤感染患者的生命。从那以后，医学研究人员已经发现约100种新的抗生素，每一种都拯救了无数生命。


    但是，除了开头说过的大肠杆菌之外，有越来越多的细菌产生了抗药性，很多人因此死亡。根据《新闻周刊》的介绍，从2007年到2015年，死于细菌耐药菌感染的人数，增加了5倍。


    根据美国疾控和预防中心的报告，每年有200万人感染对主流抗生素产生抗药性的细菌，其中的23,000人会因此死亡。看这个比例，感觉还属于小概率事件。但美国感染控制和医疗专业人员协会负责人凯伦·霍夫曼（Karen
    Hoffman）说，这个数字远远被低估了。


    抗生素带来的药物时代正在慢慢结束。如果越来越多的细菌产生抗药性，那代表，人类开始慢慢回到了抗生素发明之前的时代。


    那是个怎样的时代？那个时代，哪怕只是手上被划一个小口子，嘴里有颗蛀牙，都可能危及生命。


    就算我们治疗感染的能力，也仅仅是让患者多活几年，而不是彻底治愈。


    ### 如何应对抗生素危机？


    可能产生抗药性，而原本，可能你不需要吃这么多抗生素，或者等身体自愈，就够了。不要矫枉过正哦。


    你平时会吃抗生素给自己“消炎”么？以后还会吃么？


    欢迎你留言写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。


    - 1. 根据美国疾病预防和控制中心的报告，每年有200万人感染的细菌，都对主流抗生素产生了抗药性。《新闻周刊》认为，按照这个趋势，我们很可能会回到抗生素发明之前的时代。

    - 2. 微生物产生的抗药性速度越来越快，无论何时使用新抗生素，大约一年后，就会出现第一批产生抗药性的微生物。


