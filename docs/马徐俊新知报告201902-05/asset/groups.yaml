    \n马徐骏 · 新知报告\n\n「新知周刊」\n\n### 今日得到：创伤是怎么搅乱记忆的？\n\n要消除无法言说的痛苦，那就必须让它变得可以言说。\n\n\
    马徐骏\n\n混乱和扭曲，才是创伤记忆的本质。\n\n面对创伤，大脑会创造出两种截然不同的记忆。这种机制会让创伤变得严重的心理困境，但是我们希望，一旦你明白这些原理，开始尝试理解它，就是积极应对的开始。\n\
    \n- 大脑为什么会创造出两种记忆？\n- 创伤记忆为什么会带来痛苦？\n- 如何治疗混乱的创伤记忆？\n\n前不久，一部关于美国流行天王迈克尔·杰克逊的新纪录片《离开马尼庄园》，在全球上映后引起了轩然大波。在纪录片中，有关于迈克尔·杰克逊幼年所遭受的性虐待的相关叙述。片中，两位儿童性虐待案受害者站出来，表示其中一位受害者是著名歌手玛丽亚·罗伯茨。玛丽亚和罗伯茨都受到了强烈指控，玛丽亚在此前也否认了强暴指控，而罗伯兹却一直力挺杰克逊清白。这次突然改口，让人们无法理解，开始怀疑他别有动机。\n\
    \n不过，最新一期《新闻周刊》刊登了斯坦福大学心理学家莎莉·杰恩（Shail Jane）的文章，指出：都搞错了，人们的记忆是错的，迈克尔没有做过这些事。莎莉·杰恩是一位专注创伤记忆研究的科学家，她认为，玛丽亚和罗伯茨的记忆都是错的。她们是受到了创伤后应激障碍（PTSD）的影响，被创伤的扭曲记忆误导。她说，“创伤后的记忆变得混乱和扭曲，这才是事实。人们在进行创伤后，可能会在几年里，甚至几十年里，反复体验创伤记忆。一种是“自愿回忆型创伤记忆”，一种是“非自愿回忆型创伤记忆”。这两种记忆相互交织带来的结果，就是混乱。”\n\
    \n这也解释了为什么在迈克尔·杰克逊的很多案例中，受害者能清楚记住他做过的很多事情，但在某些时刻，一些格外清晰的片段记忆又会被遗忘或模糊化。创伤后应激障碍的折磨。很多多年遭受过性侵的女性，终于生存了下来，但她们发现，自己的大脑被这些记忆搅动得混乱不堪。它们有时候会突然浮现，有时候又消失得无影无踪。她们不知道自己到底在经历着什么。\n\
    \n莎莉·杰恩说，要消除混乱记忆的负面影响，有一个办法，那就是“讲出来”。文章中有，清除痛苦的说法。那种无法言说的痛苦，那就必须让它变得可以言说。\n\n\
    > The unspeakable must be rendered permanently speakable.\n\n这句话也被我选为了今天的金句。\n\
    \n### 大脑为什么会创造出两种记忆？\n\n心理学家发现，在应对创伤的时候，大脑会创造出两种不同类型的记忆，一种叫“自愿回忆型创伤记忆”，一种是“非自愿回忆型创伤记忆”，这两种记忆是截然不同的。\n\
    \n先来说说自愿回忆型创伤记忆，顾名思义，就是你想起来它，你可以自行回忆的关于这件事的记忆。\n\n这是迈克尔·杰克逊性虐待案中的受害者，玛丽亚·罗伯茨。她是一个非常有成就的人，她可以清晰地记住那些细节，比如迈克尔给她买的第一件礼物，她记得清清楚楚。但奇怪的是，对于迈克尔虐待她的具体细节，她记忆却是模糊的，或者是完全想不起来。\n\
    \n### 总结\n\n很多遭遇过性侵的人，多年后鼓起勇气站出来发声，却遭到了外界质疑，说你当时为什么不讲，现在讲是不是有别的目的？为什么对事件的描述很乱，很多细节都说不清，是不是撒谎？这其实都是误解，因为普通人很难理解创伤记忆到底是怎么回事。\n\
    \n听完今天的报告，你就明白了，原来混乱和扭曲，才是创伤记忆的常态！面对创伤时，大脑会创造出两种截然不同的记忆，让人对创伤的记忆变得时而极度模糊，时而异常清晰。虽然归根结底是出于自我保护，可这种机制却会衍生出严重的心理问题，让当事人陷入巨大的痛苦之中。\n\
    \n而面对创伤，最好的治疗方式，就是讲出来。只有让不敢讲的事情变得可以讲，经历过创伤的人才能真正放下过去，拥抱现在。也只有讲出来，才能让内心的伤口，真正有愈合的机会。\n\
