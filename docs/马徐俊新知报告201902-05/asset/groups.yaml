    Instagram 自己就推出了很多其他功能，比如限时动态 Instagram Stories，长视频 IGTV，动态 GIF 和视频剪辑功能。这些五花八门的玩法，可以做出更多有创意的原创内容。很多品牌都想抓住这个趋势。比如，互联网美妆品牌
    Glossier 正在 Instagram 上尝试新的玩法。它发布的内容里，不光有自制的创意表情包，还有模特在素颜时的特写。这些特写说不上多好看，但贵在真实，让人觉得特别亲切。


    # 总结


    上一代精致又带点小清新的 Ins 风已经过时，取而代之的是真实到近乎粗糙的风格。社会结构的变化，年轻一代的崛起，他们对于自我更强的认同感，让他们敢于追求，并且展示真实而独特的自己。这不仅是网红风格的风水轮转，更是新一代年轻人
    为这个世界带来的影响。在这股新力量的带领下，很多老一代网红也纷纷脱下精致的面具，在公众面前讲述自己的困扰和压力。品牌和媒体的营销方式也发生了变化，他们把真实感和原创性放在第一位，拉近和粉丝的距离，同时用更新奇的表现形式，吸引新一代粉丝。


    这种强调真实和原创的风潮，相信很快就会刮到国内。其实，之前 zara 的雀斑女孩事件，就已经初露端倪。当时，有相当一部分人都认为，过去的那种精致无瑕的审美已经过时了，有雀斑才是一种返璞归真的美丽。那么，在你看来，什么样的审美风格是最能打动你的呢？欢迎你在留言里发表自己的看法。


