    \ the World's Greatest Investor*, rev. ed. John Wiley & Sons, 2007.\n- Roger Lowenstein.\
    \ *Origins of the Crash: The Great Bubble and Its Undoing*. Penguin Books, 2004.\n\
    - Roger Lowenstein. *When Genius Failed: The Rise and Fall of Long-Term Capital\
    \ Management*. Random House, 2000.\n- Sebastian Mallaby. *More Money Than God:\
    \ Hedge Funds and the Making of the New Elite*. Penguin Press, 2010.\n- William\
    \ J. O’Neil. *How to Make Money in Stocks: A Winning System in Good Times or Bad*,\
    \ 4th ed. McGraw-Hill, 2009.\n- William J. O’Neil. *The Successful Investor: What\
    \ 80 Million People Need to Know to Invest Profitably and Avoid Big Losses*. McGraw-Hill,\
    \ 2003.\n- Adam Smith. *Supermoney*. Random House, 1972.\n\n## 線上參考資源\n\n- **www.amex.com**\n\
    \  美國證券交易所（American Stock Exchange）網站。\n\n- **www.BerkshireHathaway.com**\n  提供華倫·巴菲特的波克夏公司年度報告與其他相關訊息。\n\
    \n- **www.Brondes.com**\n  提供「布蘭德斯投資夥伴公司」（Brondes Investment Partners）的相關資訊，以及「布蘭德斯機構」（Brondes\
    \ Institute）的全球投資與研究相關報告。\n\n- **www.ccpg.org**\n  康州賭博問題協會（Connecticut Council\
    \ on Probem Gambling）網站。這個協會與美國證券交易委員會（Securities and Exchange Commission）共同研究股市投機問題，並且提供實用的相關資訊與協助。\n\
    \n- **www.djaverages.com**\n  提供所有道瓊平均指數（Dow Jones averages）過去與現在表現的相關資料。\n\n\
    - **www.fool.com**\n  「莫特利」（Motley Fool）網站。「莫特利」是最受歡迎的財經網站之一，針對各類型的投資提供新聞、分析、建議與資訊。\n\
    \n- **www.footnoted.org**\n  搜尋、提供並解釋企業提交給證券交易委員會的报告內容，附註（footnote）如何解釋，代表什麼意義。這個網站很有趣，也可以在這裡學到許多公司治理的相關知識。\n\
    \n- **www.invetopedia.com**\n  為投資人提供許多資訊，如一長串的名詞解釋、說明與財經相關文章。\n\n- **www.iqtrends.com**\n\
    \  《投資品質趨勢》（Investment Quality Trends）是極具公信力的財經刊物，這是其網站。《投資品質趨勢》以三十年為單位追蹤、研究股利的重要性、影響與價值，並且提供投資收益與成長的相關資訊與指引。\n\
    \n- **www.johncbogle.com**\n  告訴你約翰·柏格（John Bogle）這位投資冒險家現在正在想什麼。\n\n- **www.kiplinger.com**\n\
    \  提供許多有用資訊，尤其是簡單實用的各種投資計算器。\n\n- **www.quantumononline.com**\n  提供關於優先股的資訊。\n\
    \n- **www.quicken.com**\n  「Quick」系列產品是個人理財軟體界的佼佼者。其產品結合許多項目，從你的支票本到理財帳戶，一應俱全。報稅時節，你可以將資料輸入這些軟體來簡化報稅過程。\n\
    \n- **www.savingsbonds.gov**\n  提供通貨膨脹、到期日（maturity date）、盈餘計算器，還有其他關於美國儲蓄債券（U.S.\
    \ savings bond）的資訊。有時，美國儲蓄債券反而是散戶很好的投資標的。\n\n- **www.sec.gov**\n  提供美國上市公司相關的規範、法條與公司治理等相關資訊。\n\
    \n- **www.sec.gov/edgar**\n  提供美國上市公司的相關文件與資訊。\n\n- **www.sec.gov/investor/pubs/**\n\
    \  提供數千項多關於企業的實用資訊與指引。另外，這個網站也提供幾篇教你如何分辨、預防詐欺的實用文章。\n\n- **www2.standardandpoors.com**\n\
    \  提供標準普爾公司產品服務與各種指數的詳細資訊。\n\n- **www.treasurydirect.com**\n  你可以開設帳戶直接在線上向美國財政部（U.S.\
    \ Treasury）買賣美國政府債券，如國庫券（Treasury bill）、國庫票（Treasury note）、國庫債（Treasury bond）或儲蓄債券（savings\
    \ bond）。可以從指定的銀行帳戶匯出或匯入。\n\n- **www.valueinvestorinsight.com**\n  《價值投資者洞察》（*Value\
    \ Investor Insight*）雜誌網站。提供最新一期的雜誌試讀版。\n"
