    破產不是好事，不過我們可以從中學到教訓：


    +   ．一家公司準備破產時，股價可能就像一顆發泡錠丟進一杯水裡，一下子就見不到了。2008 年 9 月 15 日，AIG 似乎大勢已去，準備破產。隔天，也就是
    2008 年 9 月 16 日，AIG 的股價下跌了 60％，如果手中有準備破產的公司股票，投資人就該想辦法自保。前面提過，避險是比較傳統的方式，不過除非真的是一家極大的控股公司面臨風險，不然避險的成本大到多數的散戶都不會去做。最容易的辦法是盡快賣掉你的股票，以避免進一步'
