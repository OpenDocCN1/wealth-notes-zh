    路公司）跟電力公司一樣。不管是鐵路還是電力，一直以來都會是我們的客戶的經濟命脈。』¹⁰⁴


    大衛・埃本也投資科技股，不過他只投資能夠經過適當分析的股票。「我們不會投資最新、表現最好的高科技股，因為這些公司常常隔年就消失了。』


    # # 全球布局


    巴菲特等美國投資者在 20 世紀末都不喜歡到海外投資。巴菲特認為自己了解美國國內的交易規則，而且美國本身有許多好企業，所以沒必要到海外投資。不過，這樣的時代已經是幾十年前的事了。現在義大利的飛雅特（Fiat）持有克萊斯勒（Chrysler）20%的股份，美國的卡夫食品擁有英國的吉百利（Cadbury）糖果公司，波克夏公司持有中國比亞迪汽車公司
    10%的股份，還持有以色列的 IMC 製造公司（Iscar Metalworking Companies）大部分的股權（這家以色列公司本身也擁有日本的東芝）。這樣看來，我們還不將商業世界視作一個國際大家庭嗎？


    現在，投資組合裡一定要包含海外投資。部分原因是美國以外的國家經濟成長最快，部分原因是美元匯率不斷走貶，失去購買力。持有海外股票往往能平衡美國股市的波動。不可否認，在
    2007 年、2008 年大部分海外股市也跟著美國一樣重挫，不過，像巴西、中國、德國、加拿大'
