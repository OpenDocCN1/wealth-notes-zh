    有18%，難免會覺得不好受。不過或許你該感到慶幸，你的朋友可能已經掉入股票市場從眾行為的陷阱。這種從眾行為的特徵就是大家想的都一樣，高估眾人的能力，也使大家不願接受不同的可能性。19盲從的群眾可能會推升股價，也可能在一片恐慌之中讓股價重挫。你該問的是，與你的投資組合相比，朋友的高獲利投資組合到底安不安全？


    +   - 需要持有一定程度的現金，才得以充分利用投資良機。出現通膨時，購買力不斷下降，這時的確需要勇敢地留住手上的持有部位，也需要持有相當的現金，才能在好買賣出現時毅然進場。


    +   - 有時，要留一點退路，不要全部的錢都投進去。價值投資者知道，自己不見得買在最低點，也不見得賣在最高點。甚至價值投資者選定買賣的時機點往往有點太快，可是這沒什麼大不了，不要因為一時貪心，承擔更高的風險。如果買進的價錢不錯，賣出後也獲得不錯的獲利，就不要計較那些幾塊錢的虶頭小利。


