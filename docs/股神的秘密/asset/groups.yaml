    有些股利再投資計畫不收手續費，有些則會收固定或一定比例的手續費。


    在股利再投資計畫裡買的股票，股價計算是基於該企業在一段時間買入股票的平均成本。


    價值型投資人如果看到一檔股票遭高估，就不該參加股利再投資計畫，也不該使用定期定額投資法。這時，要考慮是否續抱股票領取股利，還是賣出獲利了結，找尋另一家股價遭低估、股利也不錯的公司。一般而言，最好能賣出並找尋下一個投資良機。


    S&P 500 的成份股中，有「股利再投資計畫」的包括紐約時報、Nike、諾福克南方公司（Norfolk Southern Corp.）、諾斯洛普．格拉曼公司（Northrop
    Gruman Corp.）。


    ## 最佳的投資策略


    羅伯特．梅納德（Robert Maynard）是「愛達荷州公務人員退休基金」（Public Employee Retirement System of Idaho，簡稱
    PERSI）的投資總監。他在 1992 年接管這個基金；當他接手時，PERSI 基金的 1 年、5 年、10 年報酬率幾乎墊底。不過，羅伯特．梅納德相信簡單的投資策略，他重振這個資產
    90 億美元的基金，讓它起死回生。到了 2009 年中，PERSI 基金的 1 年、5 年與 10 年報酬率的排名分別達到 33 名、10 名與 18 名。


    他避開槓桿操作、市場時機與複雜的投資策略，也不碰國外的資產（如對沖基金追求更高報酬的手段）。他發現，這些手段、技倆在市場動盪時會置基金於水深火熱之中。


    > 「在市場穩定時待在市場追求報酬，不要在局勢動盪不安時貿然投入。」羅伯特·梅納德如是說。$^{110}$


    羅伯特·梅納德的看法是：「投資人在打造投資組合時，要不就想法法追求額外報酬，趁市場動盪不安時追求高額報酬，或者追求 10 年的長期報酬，打造可以度過短期波動的投資組合。只是，如果這兩個目標都要達到，那就太強人所難了。」$^{111}$


    ## 第 11 章


    ### 特殊情況


    好奇心是理論心智最典型和明顯的特徵。

    墨多爾 黛絲

    美國文學家


    投資中的特殊情況往往是股票市場最令人困惑，也最有風險的地方。即使再小心分析、再理性，還是難免遇到特殊情況；不過，這些例外也往往可以帶來極高的報酬，帶你走向致富之道。這些特殊情況隨時可能出現，現身許多不同的地方。可能出現在
    IPO、併購、破產拍賣、可轉換證券、認股權證，或是股價遭重創的公司。


    一般來說，只有經驗最豐富的老手該碰這些特殊情況，不過也不是絕對這樣。


    譬如，你今天在 A 公司工作。A 公司的歷史悠久、獲利良好，員工也握有股權，這是家高科技公司，而且員工未來也有機會再認股。你知道，公司的股價不斷穩定增加，產品的未來展望很好，而且公司可能有一天會上市。


    或是，你可能在 B 公司工作：B 公司才剛起步，不過在業界推出足以改變遊戲規則的新產品，而且你很了解這項產品。現在公司要上市了，而且你也可以參一腳。


    A、B 兩家公司情形不同，不過兩邊機會會很多。不管在哪一家工作，你都在巴菲特所謂的「競爭優勢區」裡。以你在業界的經驗、對這項技術的熟悉度，還有你對管理的了解都扮演了重要因素。


    特殊情況來臨時，需要冷靜的頭腦與自制力，並在必要時調整自己的投資策略。對葛拉漢來說，當初買下 GEICO 公司就是特殊情況。巴菲特發現過許多特殊情況；特別是隨著波克夏公司不斷成長，許多企業老闆往往會在非常時期向巴菲特求助。


    ## 首次公開發行


    投資人對首次公開發行股票（IPO）的反應，就像是 1849 年的淘金熱。熱潮一來，大家的反應就熱烈得不得了。微軟、Google 等明星企業讓投資人一夕致富的故事在市場上廣為流傳，於是投資人紛紛衝進市場。但是，對大部分的
    IPO 來說，成功並非如此容易。只有極少數人真的成為百萬富翁。常常一開始發行的股票股價極高，但卻撐不了多久，等股價重新漲回當初公開發行的股價，往往要等上好多年。


    一項研究發現，如果投資在 1968 年到 1998 年間 IPO 的 2895 間公司，平均年報酬率為 -45%。雖然一開始發行時眾人紛紛看好，但許多股票發行後，表現也越來越不理想。1990
    年代末期的網路泡沫中，許多公司，包括 VA Linux 與 TheGlobe.com 公開發行的第一天，股價就一飛沖天——有時漲幅高達 100%，或甚至 300%——但最後卻應聲倒地，徒留一臉茫然的投資人。不過，當中也有投資人進出夠快，大賺一筆，所以讓人覺得投資很簡單，好像不參加這場投資賭局就對不起自己似的。


    企業之所以選擇公開上市，就是为了募集資金，讓持有人可以拿回創投資金，並讓所有的股東都可以立即套現。投資人付出金錢換取公司股份，這些投入的錢用來加強公司的營運與經營策略，因而提升股票的價值。


    散戶要預測剛上市的股票在交易第一天會如何已經很難了，要正確利用過去紀錄評估公司就更難了。此外，大部分首次公開發行的公司往往是處於轉型的成長型公司，也因此未來的走向充滿不確定性。


    不過有件事我們可以確定：當市場瘋狂出現 IPO 時，代表多頭市場達到高峰；企業家希望能在最高價推動公司上市，募得最多的資金。


    1996 年，網路泡沫達到高點時，市場上有 675 家公司 IPO。2001 年泡沫崩裂，美國 IPO 的公司只剩下 80 家。


    另外，美國在 2001 年 9 月 11 日發生恐怖攻擊事件，重挫市場的流動性，也打擊了經濟活動。也難怪 2001 年到 2003 年間 IPO 的數目大幅降低。


    恐怖攻擊的衝擊過後，IPO 的數量又逐漸回升。接著，2008 年，全球經濟危機大幅削減 IPO 的數目。美國 IPO 的公司 2008 年降到 20 家；相較之下，前一年還有
    159 家。


    度過風波之後，IPO 就成了獨特的投資機會，特別是你如果在一開始就買了這些股票更是如此。以下是在進入 IPO 市場時的自保之道：


    - 多做功課：一定要深入調查研究。別忘了研究公司的資訊，更要看看過去幾年的企業表現，多看新聞，研究財經版或企業網站上的消息。一家公司在主要交易所宣布 IPO
    時，一定會出現一堆分析評論，一定要仔細看過這些意見，上網找找員工的評論、企業的公開信，還有任何可能有用的資料。

    - 別忘了看募資說明書或證券交易委員會的「S-1」報告：這些讀起來可能很無趣，但在選擇 IPO 股票時，這個步驟很重要。美國證券交易委員會會先檢視募資說明書的內容，也會要求企業揭露更多資訊，提供足夠的解釋。以
    Google 為例，美國證券交易委員會就曾指出 Google 不該在 S-1 報告中宣稱美國雅虎的提告毫無法律依據。美國證券交易委員會認為，Google 沒有權力做出這樣的解讀。Google
    沒改變報告的用字，而是用庭外和解的方式，付給美國雅虎 2700 萬美元了事。也因為美國證券交易委員會的監督，IPO 的文件通常都很保守，因為企業知道如果他們把話說得太滿，表現卻不夠好，名聲就可能面臨危機。

    - 選取與名聲好的券商合作的公司：一般來說，比較大、比較知名的承銷機構會承銷比較好的公司。只是，散戶可能很少有機會接近這些承銷機構。

    - 小心：有時候承銷機構可能會因為股票賣不出去，無所不用其極地兜售。

    - 檢視閉鎖期（lock-up period）：一家企業上市後，內部人員往往有一段時間不能賣股票。這就是所謂的閉鎖期。這段期間通常長達 90 天到 1 年，用意在於保護外部投資人。如果新上市的公司有什麼內線消息，也必須等到社會大眾知道消息時，才能依據這些消息進行買賣。

    - 小心 ETF：市面上也有以追蹤 IPO 指數為主的 ETF。


    有些公司會設下特別長的閉鎖期，以提升股票發行的信心。換言之，如果一家公司才剛上市，可是你卻找不到內部人員交易的跡象，最好就不要碰。內部人員可能只是在等閉鎖期結束，然後盡快賣掉手上的持股。


    本書前面提到，ETF 有獨特的優缺點。記住，如果 IPO 本身的品質堪慮，ETF 的情況也不會好到哪裡去。ETF 的設計就是要反應市場的情況。IPO 的領域變動很快、風險極高，IPO
    的 ETF 既然以 IPO 為基礎，自然也會反應相同的情形。


    ## Google 首次公開發行


    正當我們相信 IPO 投資風險太高時，例外出現了，而且這個例外還打破所有的規則。在公開發行的募資說明書中，Google 創辦人賴瑞·佩吉與瑟吉·布林自信滿滿地說，他們的公司與其他公司不同。而且，事實證明他們說的對。


    Google 在 2004 年公開上市，當時他們已經營運將近 6 年的時間。雖然如此，布林與佩吉很努力地延後上市。但到最後，實在是不能再拖下去了，因為創投與其他投資人不斷要求公司上市，好讓他們可以獲利了結，而且在
    IPO 之後，Google 也能用這些資金，使公司進一步成長。


    打從一開始，Google 就比其他剛起步的科技公司有優勢。Google 已經營運了好幾年，而且很快開始獲利。不過，Google 兩位創辦人也很努力不讓外界知道他們網路搜尋廣告的營收驚人。


    公開發行後，財經專家估計，Google 的市值高達 300 億美元。2004 年 4 月 29 日，Google 提出 S-1 報告，也就是美國證券交易委員會規定
    IPO 必備的文件。


    當時，網路泡沫才過沒幾年，矽谷的 IPO 也人人避之唯恐不及，但是 Google 使眾人快速改觀。分析家得知 Google 的廣告營收與毛利率後，開始覺得
    Google 可能就是下一個大好的投資機會。


    Google 表示，2003 年的營收達 9 億 6190 萬美元，淨利達 1 億 625 萬美元。2000 年至 2004 年之間，Google 的銷售金額成長了
    177%。從 2001 年開始，Google 就一直獲利，而且有高達 4 億 5490 萬美元的現金及約當現金。


    不過，賴瑞·佩吉也發表過讓投資人卻步的發言。他曾寫到：「 Google 不是一家傳統的公司。我們也不想變成傳統的公司。早在上市以前，Google 的管理方式就不一樣，我們也特別強調創意以及接受挑戰的精神，因而得以客觀、正確又自由地運用資訊，為依賴我們的人提供優質服務。」$^{112}$


    為了讓 Google 與華爾街之間劃清界線，Google 的高層表示，不會提供獲利預估或其他相關預測給業界分析師。他們說，公司所有的決定都是為了公司的長期利益。


    最出乎意料之外的是，Google 不透過傳統的承銷程序賣出 IPO 股票，而是透過網路單一價格標 (Dutch auction，或稱荷蘭標) 來出售股票。為求與眾不同，Google
    實行雙軌管理制度，讓佩吉、布林與執行長艾瑞克·施密特完全掌控公司。


    2004 年 8 月 18 日，Google 首次公開發行股票，賣出 1960 萬 5052 股，售價為 85 美元。Google 股票發行總共募得 16.7
    億美元，市值達到 230 億美元；雖然比預期低，但金額還是相當可觀。雖然還有例外，但許多 Google 員工一夕之間變成百萬富翁，佩吉與布林也在 27 歲就變成身價數十億美元的富豪。Google
    一下子變成散戶之間的當紅炸子雞，股價也一飛沖天，最高一度站上 715 美元。雖然 2007 年、2008 年的市場修正也使 Google 重挫，不過 Google
    的股票從沒跌到首次公開發行時的價格。$^{113}$ 到了 2010 年中，Google 的股票維持在每股 500 美元。


    ## 合併與收購


    價值投資者常會發現自己在無意中碰到併購案。價值型投資法的概念在於投資遭低估的公司，並期待這樣的公司鹹魚翻身。價值型投資人常買中小型公司的股票，因為這些公司的評估比較容易，法人股東也比較少。有些投資人會買二、三流的公司，期待這些公司被收購，增加獲利。


    的機會。不過，連葛拉漢也覺得，只要這些投資決定經過深思熟慮、評估風險之後，就沒問題。


    併購與 IPO 很像，往往在景氣循環的特定階段會特别多。到了空頭市場的中期，就算只有某個特定產業景氣落底，大型企業往往還是會買下規模較小的競爭對手。幾乎每次出現經濟衰退時就會出現這種情形。


    2007 年的經濟衰退則稍有不同，不過也不是完全不一樣。因為有了政府的紓困方案，併購的情形不如預期嚴重：美國政府出手援助 AIG、高盛、房利美、房地美等公司，而且
    2009 年的併購活動比前一年少了 28%，$^{114}$ 這與 2009 年反彈的股價相符；市場上出現的 19% 報酬率，為 6 年來新高。但雖然有了紓困方案，市場上還是出現不少併購案。


    譬如 2009 年，輝瑞、默克還有必治妥施貴寶公司（Bristol-Myers Squibb）都出價數十億美元，收購規模較小的競爭對手；又如埃克森美孚公司收購
    XTO 能源公司（XTO Energy）；另外，甲骨文公司（Oracle）原本就常藉由收購擴大規模，它也買了昇陽公司（Sun Microsystems）。


    ### 全球化的省思


    過去 30 年來的併購活動反映全球經濟的趨勢，商業活動變得越來越全球化，1997 年就有 2333 次跨國交易，總值高達 2980 億美元。


    2009 年比利時啤酒大廠英博公司（InBev）花了 520 億美元買下美國的安布公司*，這也是全球化的例子。兩家公司結合後，成為安布－英博公司（Anheuser-Busch
    InBev），變成世上最大的釀酒公司，在超過 30 個國家有酒廠，業務遍及 130 多個國家。這家釀酒公司生產百威（Budweiser）、麥格（Michelob）、時代（Stella
    Artois）與巴斯（Bass）等啤酒。它的競爭對手——總部位於倫敦的英國南非米勒公司（SABMiller）也佈局全球。


    有些併購案後來下場淒慘，如德國戴姆勒－賓士公司（Daimler-Benz）與美國克萊斯勒的結合。可是，這類併購案一開始看起來總是氣勢驚人，對投資人來說，要了解這麼大規模的企業也實在是一大挑戰。如果是規模相當的公司要合併或收購，有以下幾個考量點：


    - 資產評估跟買股票時評估一家公司的道理一樣，要看公司企業過去的獲利、未來能持續創造多少獲利、相對評價（relative valuation），還有現金流預估。可以比較類似的公司與類似的交易行為，比較好壞。

    - 大部分的併購案後來的效果往往不如預期，一般來說，投資「被收購」的公司比較好。


    大部分的投資人只專注在合併後的公司獲利能力如何。相對的，想要藉企業併購套利的投資人只關心這項合併案的套利機會有多高，什麼時候能完成合併。


    併購套利（merger arbitrage），或稱為風險套利（risk arbitrage），常常發生在收購公司用股票交換（stock swap）來融資的情形，套利者一邊買目標公司的股票，一邊賣收購公司的股票。


    一般來說，目標公司的市價會低於收購公司出的價錢，這兩個價格之間的落差，取決於機率與併購完成的時間，也與併購案的條件有關。併購案完成後，目標公司的股票會變成收購公司的一部分，合併的轉換價格取決於併購協議中同意的價格，想要從中套利的人便賣出足夠數量的可轉換股票，完成套利行為。


    如果這樣做就可以輕鬆賺錢，許多投資人就會如法泡製，套利者就沒有操作空間了。可是，實際的併購案存在許多未知因素。一個主要的風險是合併案可能失敗，或是收購價調降；也許有一方無法滿足合併案的條件，也許無法取得必要比例的股東同意，或因反托拉斯法而遭受阻礙，也可能因為某些事件影響目標公司或收購公司的意願。


    ## 卡夫食品


    卡夫食品在 2010 年收購英國的吉百利。一開始是卡夫食品執行長艾琳．羅森菲爾德（Irene Rosenfeld）的提議；也許打從第一天她就知道吉百利的管理團隊會屈服。過程非常戲劇化：艾琳．羅森菲爾德跨過大西洋去跟吉百利的董事會談；但是，對方很不欣賞她非英式的態度。當時的波克夏公司持有卡夫食品
    9%的股份，而巴菲特也跳出來說，卡夫食品給的條件太優渥了。


    不過，這個併購案聽起來還是很不錯。兩家公司的財務狀況都很好，雙方也都各自擁有食品、餅乾、糖果產品的龍頭品牌。


    卡夫食品是美國最大的食品公司，也是全世界第 2 大食品公司。卡夫食品主打的知名餅乾包括奧利奧（OREO），還有起士義大利麵等便利食品，行銷 155 個國家。卡夫食品在
    2001 年上市，更在 2008 年納入道瓊指數。卡夫食品的規模很大，營收高達 420 億美元，2009 年的淨利達到 29 億美元。


    吉百利以巧克力糖果品牌聞名全球，也擁有牛奶牌（Dairy Milk）巧克力、霍爾（Hall''s）咳嘔藥水、丹泰（Dentyne）口香糖、泰鼎（Trident）口香糖等許多品牌。


    卡夫食品開給吉百利的條件是現金加股票共 170 億美元，但吉百利拒絕了。於是，卡夫食品很快地賣掉自己在北美的披薩生意，賣給雀巢公司（Nestlé），拿到 37
    億美元，只為了收購吉百利，卡夫食品進一步將條件提高到 194 億美元，結果成交。


    華爾街對卡夫食品與吉百利的合併案興趣不大，唯一的例外是波欽廣場資本管理公司（Pershing Square Capital）的經理人比爾·艾克曼（Bill
    Ackman）。


    卡夫食品這次的併購案有幾個有趣的地方。吉百利的投資人從此變成跨國企業的股票。卡夫食品收購這家擁有許多銷售冠軍品牌的公司後，股東也因此得以投資新興市場。艾克曼預測，從雙方的股利與強勁的獲利表現來看，兩年內股票的報酬率會高達
    50% 到 60%。


    「我覺得收購案不見得都是好買賣，」艾克曼說，「不過這項併購案真的很不錯。」$^{115}$


    ## 優先股


    優先股可說是普通股與債券的混合體。追求收益的投資人往往比較喜歡優先股，因為優先股一般會保證一定的股利，股利分發也優於普通股。另外，公司破產時，優先股的股東也可以優先拿回自己的錢。所以，優先股比較安全，但風險還是比債券高。


    優先股的發行條件有很大的彈性。最重要的大概就是要看優先股是累積（cumulative）優先股還是非累積（noncumulative）優先股。如果是累積優先股，股利就會越積越多。股利配給普通股持有人之前，會先分發給優先股的持有人。如果優先股是非累積優先股，而且股利分發中斷一次，股東就沒辦法再領股利了；就算公司再度走強，這次股利也領不到了。


    影響優先股的價值還有其他許多因素，包括：


    - 是否有投票權。

    - 股利率是否固定，如果公司淨利提高，有沒有調整的彈性，還是額外的股利有參與率（participating factor）的限制。

    - 優先股是否能轉成普通股（下面會再解釋）。


    一般來說，投資人之所以選擇優先股，是打算放棄資本利得以求取更高的股利與較低的風險（當然，除非這些股份可以轉換）。


    華爾街有句老話說：「千萬不要轉換你的『可轉換股票』。」意思就是，如果你買優先股是為了收益與安全性，那就不要隨便轉換。


    對現在的散戶來說，優先股大概不太實際；不過，對企業的投資組合來說，優先股可以帶來極高報酬。這是因為散戶的股利必須 100% 課稅，但企業只需要課徵 30%
    的稅；也就是說，企業有 70% 的股利免稅。雖然情況視利率與稅賦規定不同，不過散戶課完稅後的股利報酬可能還比不過投資企業債券或地方政府的公債。另外，企業如果遭清算，債券的求償順位也在優先股之前。


    不過，要提醒全球的投資人：優先股的規範各國不同，在加拿大與英國等國，優先股比較普遍，在股市也占多數。


    想知道什麼優先股可供交易，可以上「量子在線」網


