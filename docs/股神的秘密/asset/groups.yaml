    \n- **www.savingsbonds.gov**\n  提供通貨膨脹、到期日（maturity date）、盈餘計算器，還有其他關於美國儲蓄債券（U.S.\
    \ savings bond）的資訊。有時，美國儲蓄債券反而是散戶很好的投資標的。\n\n- **www.sec.gov**\n  提供美國上市公司相關的規範、法條與公司治理等相關資訊。\n\
    \n- **www.sec.gov/edgar**\n  提供美國上市公司的相關文件與資訊。\n\n- **www.sec.gov/investor/pubs/**\n\
