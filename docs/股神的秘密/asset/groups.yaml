    \n## 質化分析（qualitative analysis）\n\n分析非量化的因素，像是市占情形、位置、產業、名氣等因素。\n\n## 量化分析（quantitative\
    \ analysis）\n\n基於財報表數字的分析。\n\n## 速動比率（quick ratio）\n\n又稱為「酸性測試比率」。這個比率顯示企業的短期流動性。速動比率評估企業能否用流動資產清償短期債務。速動比率的計算方法為「流動資產」減去「庫存」，再除以「流動負債」。速動比率越高，代表企業的體質越好。速動比率是比「流動比率」更保守的指標。\n\
    \n## 經濟衰退（recession）\n\n大部分的經濟學家認為，經濟衰退的定義是連續兩年以上的國民生產毛額（GDP）呈現負成長。\n\n## 紅鰭報告（red\
    \ herring）\n\n企業首次公開發行股票的說明書。這個名字的由來是因為說明書裡會用紅色字體標明投資的風險。\n\n## 保留盈餘（retained\
    \ earnings）\n\n未分配給股東的企業淨利，這些資本留起來作為其他用途。\n\n## 投入資本報酬率（return on invested capital）\n\
    \n企業淨利加上利息支出，再除以總資金。\n\n## 次要走勢（secondary movement in the stock market）\n\n根據查爾斯·道的說法，市場的波動與反應會在主要走勢之後，產生次要走勢，而且次要走勢的方向與主要走勢相反，幅度至少是主要走勢的\
    \ 3/8。譬如，如果股票上漲 10 點，就很可能會跌 4 點。查爾斯·道指出，這個規則也隨用適用於個股。\n\n## 美國證券交易委員會（Securities\
    \ and Exchange Commission，簡稱 SEC）\n\n為美國政府機關，主要負責監管證券業，於 1930 年代「新政」時期所設。\n\n\
    ## 美國證券交易委員會文件（Securities and Exchange Commission documents）\n\n美國證券交易委員會要求上市公司在特定時點必須呈交的文件報告。「10-K」表是年度商業與財務報告；「10-Q」表是每季的財務報告；「8-K」表為非預定事件或企業調整發生後\
    \ 15 天內必須繳交的報告。此外，企業也必須呈交年度股東大會的代理委託表，合併案必須有合併代理委託表；如果要發行新股票，也必須繳交募資說明書。\n\n##\
    \ 優先證券（senior security）\n\n企業清算時，順位高於普通股證券，如債券或優先股。\n\n## 參考書目\n\n- Peter L. Bernstein.\
    \ *Against the Gods: The Remarkable Story of Risk.* John Wiley & Sons, 1996.\n\
    - Peter L. Bernstein. *Capital Ideas: The Improbable Origins of Modern Wall Street.*\
    \ Maxwell Macmillan, 1992.\n- William Bernstein. *The Four Pillars of Investing:\
    \ Lessons for Building a Winning Portfolio.* McGraw-Hill, 2002.\n- John C. Bogle.\
    \ *The Little Book of Common Sense Investing: The Only Way to Guarantee Your Fair\
    \ Share of Stock Market Returns.* John Wiley & Sons, 2007.\n- Charles Brandes.\
    \ *Value Investing Today.* McGraw-Hill, 2003.\n- Christopher H. Browne. *The Little\
    \ Book of Value Investing.* John Wiley & Sons, 2007.\n- Philip Carret. *The Art\
    \ of Speculation.* Reprinted by Cosimo Classics in 2007. You may be able to locate\
    \ a copy through a major library system or through a rare book dealer.\n- Robert\
    \ Cialdini. *Influence: The Psychology of Persuasion.* Allyn & Bacon, 2001.\n\
    - Ken Fisher. *How to Smell a Rat: The Five Signs of Financial Fraud.* John Wiley\
    \ & Sons, 2009.\n- Philip Fisher. *Paths to Wealth Through Common Stocks.* Originally\
    \ published in 1960. Reprinted by John Wiley & Sons, 2007.\n- Benjamin Graham.\
