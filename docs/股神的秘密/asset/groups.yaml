    - 參考書目 254\n- 線上參考資源 258\n- 作者註釋 262\n\n# 不景氣時代的價值投資法\n\n> 不管到了幾歲，我都無法只在一處踹壁就心滿意足。生命就該好好把握，不能踹好奇心就此死去。\n\
    >\n> 美國前第一夫人伊麗諾．羅斯福（Eleanor Roosevelt）\n\n進入 21 世紀，每個人 都覺得更有信心、更聰明、更富有，也更有主導權，尤其美國人更是如此。70\
    \ 年來，美國經濟穩定成長，人民的收入、生活水準與富裕程度也因此提高。但這個好的開始馬上受到打擊，到目前為止，這個新世紀對投資人來說可是一路顛簸；新的千禧年才開始，動盪的徵兆立刻出現。\n\
    \n在網路公司紛紛成立、科技業過度炒作下，網路泡沫終於在 2000 年、2001 年全面崩盤，重創經濟。當時，「商標投資」（prefix investing）過度氾濫：許多新成立的公司發現，只要在公司名稱前加上「e-」或後面加上「.com」，股價立即一飛沖天。\n\
    \n不過網路致富的美夢在 2000 年 3 月 10 日開始崩潰；這一天，科技類股為主的那斯達克綜合指數（NASDAQ Composite Index）來到\
    \ 5048.62 的高點，超過一年前市值的兩倍。到了隔週的星期一，投資人瘋狂賣出思科（Cisco）、IBM、戴爾（Dell）等科技類指標股，數十億美元的賣壓重創股市。如此一來引發連鎖反應，投資人、基金與許多法人紛紛賣出持有部位。6\
    \ 天之內，那斯達克指數跌掉將近 9 個百分點，到了 3 月 15 日已跌至 4580 點。到了 2002 年 10 月，網路泡沫已經讓科技股的市值蒸發 5\
    \ 兆美元，引發經濟溫和衰退。\n\n## 危機再度重創華爾街\n\n儘管如此，大部分的投資人還是不以為意。沒幾年，Web 2.0 的熱潮又帶動新一波創投與\
    \ IPO（初次公開發行股票）的投資炒作。\n\n投資人受到的衝擊還不只這些。2000 年開始，多間大型上市公司的股東損失慘重；由於安隆（Enron）、泰科（Tyco）、愛德發通訊（Adelphia）還有世界通訊（WorldCom）等公司假造財務報表，導致股東損失高達幾十億美元。為了打擊企業大規模的會計詐欺，美國國會在\
    \ 2002 年通過「沙賓法案」（Sarbanes-Oxley Act）；只是，新法案還是未能遏止花樣百出的金融詐欺行為。也許我們聽過許多「銀行搶匪」的傳奇，不過以後我們可能會聽到許多「搶匪銀行」的故事。\n\
    \n## 第三波衝擊\n\n於是，歷史重演：股市在短短 10 年 大涨 1 倍，從 1997 年 2 月的 7022 點上漲到 2007 年 10 月的 14164\
    \ 點；我們覺得自己很聰明、很安全，殊不知當時已來到最高點。短短 17 個月後，也就是到了 2009 年 3 月，這些新增財富憑空消失。道瓊工業指數重挫 53%，跌至\
    \ 6547 點。\n\n全球各地股市雖然表現不一，但綜觀來說，全球股市市值在短短 18 個月跌幅超過 32%。雖然到 2010 年 1 月道瓊指數回到 1\
    \ 萬點附近，跌幅少了將近一半，但是市場仍然還沒完全恢復，這就是不記取教訓的後果啊！\n\n有些專家說，這是「經濟末日」（eclipe）；有些則說是「信用衰退」（crecession），也就是信用危機（credit\
    \ crisis）與經濟衰退（recession）的綜合體。雖然美國是在 2007 年 12 月正式進入經濟衰退，但我們很難把不景氣歸咎於特定某個年份。房貸市場與企業信用的問題在\
    \ 2007 年初爆發，加上產出萎靡不振、失業率高居不下，問題一路延燒到 2010 年。\n\n也難怪很多人要拿現在與 1920 年代、1930 年代的經濟大蕭條相比。不過，目前情況其實還不如當年嚴重。經濟大蕭條時，失業率高達\
    \ 25%，但 2009 年的美國失業率最高只有 10% 左右。在經濟大蕭條的時候，股市從高點跌至 1932 年谷底，總共大跌 86%；直到 1954 年\
    \ 11 月，道瓊工業指數才回到 1929 年前的水準。\n\n雖然 2007 年和 2008 年的股市比較接近 1973 年和 1974 年的股市表現，但美國經濟的隱憂與民衆的恐懼確實可以和之前的經濟大蕭條相比擬。\n\
    \n在投資界有 50 年豐富經驗的《投資者財經日報》（Investor's Business Daily）創辦人威廉・歐尼爾說：「我看到絕對的恐慌，許多人都在問，把錢放在美國銀行到底安不安全。」\n\
    \n千禧年的第一個 10 年讓許多人吃足苦頭，但不管發生什麼金融危機，總會有人從中獲利，總會有人看到未來的獲利機會，也讓我們學到寶貴的教訓。正因為如此，現在正是重新探討價值投資法的大好時機。檢視這些原則的好處並加以補強，來面對（即使已有新的法規）暫時不會好轉的經濟困境。\n\
    \n不管我們受到什麼影響、歸罪於誰，還是要求怎樣的制度改革，我們每個人都要負起責任，管理好自己的資產，繼續向前邁進、改善形勢，努力避免讓歷史重演。\n\n\
    2009 年 5 月，《華爾街日報》（The Wall Street Journal）專欄作家傑生・史威格（Jason Zweig）寫到：「在這個時候，葛拉漢的智慧特別受用。」史威格還說，如果葛拉漢看到現在的市場情況，一定會冷靜分析，絕不人云亦云，更不會隨著電視上的股市名嘴起舞。\n\
    \n## 負起責任\n\n歐尼爾特別強調，每個人都該負起責任管理自己的錢財。很多人認真工作、努力存錢，就為了把一生的積蓄交給別人來管理。求助他人當然可以，聽取財經專家的意見也有道理。但即使如此，投資人還是應該學會自保之道，了解經濟學的基本概念、企業運作的模式，還有證券市場的運作與如何評估個別證券等。投資人需要學習，只要願意下工夫，每個人都可以學會如何投資。只要肯深入研究、用心學習，一定會學到很多很多東西。」歐尼爾堅定地說。\n\
    \n美國證券交易委員會（Securities and Exchange Commission）官方網站上有這樣的提醒：「投資世界很迷人、很複雜，也可能滿載而歸，可是投資界與銀行界不同。銀行有聯邦政府保障存款，但股票、債券與其他證券都有跌價的風險。也就是說，投資界沒有什麼東西有保障，所以投資不能只是觀望不動。對證券市場的投資人來說，其實最好的保財之道就是多做功課、多問問題。」\n\
    \n## 重建財務堡壘\n\n顯然這些歷史回顧無法安慰損失慘重的投資人。許多受害者失去大部分的財產，找不到未來的夢想與希望，連退休計畫都化為泡影。但是看看股市過去的表情，想想全球救市方案可能帶來的通膨危機，我們只能趕快重拾儲蓄投資計畫，並從千禧年的第一波危機記取教訓；本書正是要帶領大家進行危機的事後檢討。本書將回顧這些衝擊，並從中記取教訓，還要告訴你未來如何拿回這些資金、保護好自己的財產。\n\
    \n這本書就是為了像伊蓮諾夫人這樣無法在一旁觀望就心滿意足的人而寫，也是為了相信資本主義、願意積極參與、創造所有人最大利益的讀者而寫。\n\n我們可以藉由價值投資法來收復這些投資失土，並且建立堅強堡壘。也就是說，我們只要追尋葛拉漢的概念，追隨這位前哥倫比亞大學（Columbia\
    \ University）教授兼投資大師的腳步，就能在面對任何投資危機時從容以對。甚至像葛拉漢說的，只要心態正確，我們還可以化危機為轉機、從中獲益。\n\n\
    2009 年 2 月的《富比士》(Forbes) 雜誌中，丹尼爾·邁爾（Daniel Myers）寫到：「葛拉漢的概念是長期成功投資的關鍵，也是亙古不變的道理。當年投資人大多把股票當成投機運動，但他力排眾議，認為買賣股票必須基於企業的真正價值，並且將投資加以科學分析。」\n\
    \n葛拉漢的學術背景與嗜好遍及語言、數學，也熱愛哲學，難怪他要用「價值」一詞來描述自己的投資方法。哲學家告訴我們，「價值」的概念與問題深入廣泛地觸及生命的每個面向。到底是什麼東西賦予事物真正的價值？什麼樣的東西值得努力追尋與珍惜？這樣的問題不只適用在財務投資，也適用於家庭、朋友、文化或是其他事情上。金融體系既然也是現實世界的一部分，自然也逃不過「價值」的問題。\n\
    \n## 葛拉漢的影響深遠\n\n在那個年代，葛拉漢是最受人景仰的知名投資家。他是價值投資法之父，即使逝世已近 50 年，依然是指引投資界的明燈。儘管寫作風格與引用的例子已經時隔久遠，不過他寫的《證券分析》（Security\
    \ Analysis）與《智慧型股票投資人》（The Intelligent Investor）到現在仍是經典之作。\n\n即使時空背景已經不同，葛拉漢所經歷的市場變化與我們今日面對的卻大同小異。1929\
    \ 年經濟大蕭條爆發之前，他進入華爾街工作，當時的股市尚無太多監管機制，也沒有今天的會計準則與資訊揭露法規。可以說，當時的市場充滿了投機、炒作與內線交易。\n\
    \n## 向大師學投資\n\n許多投資大師都曾受教於葛拉漢門下，直到今日依然信守這些原則。這些大師級人物包括巴菲特、華特·許羅斯（Walter Schloss）與厄文·卡漢（Irving\
    \ Kahn）。葛拉漢的忠實信徒還包括約翰·柏格（John Bogle）、大衛·卓曼（David Dreman）、塞斯·克拉曼、彼得·林區（Peter Lynch）、馬力歐·蓋伯里（Mario\
    \ Gabelli）、約翰·奈夫（John Neff）、查理·布蘭德斯、比爾·米勒(Bill Miller)、麥克·歐尼爾（Michael O'Neill）、麥克·普萊斯（Michael\
    \ F. Price）還有麥克·惠特曼（Michael Whitman），這些都是名聲極高的投資家。還有已經過世的克里斯多佛·布隆尼（Christopher\
    \ Browne）、約翰·坦伯頓（John Templeton）、馬克斯·海涅（Max Heine）都是這一派的信徒。當然，價值投資法的追隨者並不止於此；過去\
    \ 25 年來，價值投資法的勢力已經擴展到世界各地。以前，巴菲特每年在波克夏公司舉辦股東大會，其中包含專門接待外國投資人的歡迎會；但由於外國投資人的數目不斷成長，巴菲特不得不在\
    \ 2010 年停辦這個接待會。\n\n不過，也有許多人批評價值投資法。有人覺得要在股海獲取最高報酬，最好的方法便是追求成長、不管風險。也有其他投資大師說，致富之道在於了解景氣循環，並從中獲利。現代投資組合理論（Modern\
    \ portfolio theory，簡稱 MPT）的擁護者則堅稱沒有誰可以擊敗大盤表現。還有人喜歡研究市場時機，享受當沖交易的快感。\n\n不過，不論是《金融學刊》（*The\
    \ Journal of Finance*）、《金融分析期刊》（*The Financial Analysts' Journal*）等學術期刊也好，還是布蘭德斯機構（Brandes\
    \ Institute）等投顧公司也罷，都不斷發表相關的研究，告訴我們：**長期看來，價值型股票的表現幾乎都優過市場平均**。也就是說，價值投資法不但一直屹立不搖，而且也為市場帶來平衡穩定。不管市場如何變化，投資人都可以累積長久、穩定的財富。\n"
