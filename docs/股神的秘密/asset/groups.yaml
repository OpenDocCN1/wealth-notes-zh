    Google 創辦人的賴瑞·佩吉、瑟吉·布林與執行長艾瑞克·施密特（Eric Schmidt），每年也會賣掉一小部分的 Google 股票。他們定期獲利了結，並將錢轉投資在其它地方，不會把所有的錢都壓在
    Google 上。


    1929 年股市崩盤後，葛拉漢的投資組合裡有許多不同的股票。他尋找許多遭低估的股票；不過，當時的經濟景況不佳，市場充滿不確定性，許多公司處境艱難。面對這樣的困境，葛拉漢利用數字建立安全屏障。他通常會在投資組合裡最少放
