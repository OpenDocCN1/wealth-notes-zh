    # 規則 11：犯錯在所難免


    要知道，投資難免會誤判，所以要做好心理準備，犯了錯要懂得原諒自己，然後繼續向前走。巴菲特 2009 年寫給股東的信裡提到，他買下美國康菲石油 (ConocoPhillips)
    部分股權就是錯誤，「我根本沒料到，那一年下半年的能源價格會跌得這麼慘。」他也坦誠這次錯誤的嚴重性，「這筆錯誤投資害波克夏公司付出好幾十億美元。」多年來，巴菲特多次承認自己犯的投資錯誤，有時甚至開玩笑說，自己應該尋求專業協助，想辦法戒掉一直投資航空公司的「惡習」。不過，他的其他更多好投資大大彌補這些虧損，波克夏公司賺的錢也就越賺越多。


    # 規則 12：樂在其中


    投資應該充滿樂趣與挑戰性，也讓人很滿足。我們應該將投資想像成奇妙世界裡的大冒險。'
