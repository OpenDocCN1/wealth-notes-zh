    ## 指數股票型基金


    過去 10 年來，ETF 成為指數型基金界的新寵。ETF 指的是可以在金融市場上透過券商買賣的基金。相對的，一般指數型基金的交易方式與共同基金的買賣方式相同。目前美國的幾個交易所上有約
    1500 檔的 ETF 可供買賣。


    有時，ETF 可能以某個指數為樣本，不過 ETF 通常會集中投資特定類股；一檔 ETF 可能代表石油、貨幣或金礦類的股票。


    ETF 的確有潛力與傳統指數型基金一較高下。如果 ETF 的費用低、課稅少，又長期持有，就很有競爭力。


    不過，ETF 也有缺點。約翰·柏格就提醒投資人，ETF 常常誘發人類愛賭的本性。如果把 ETF 拿來短線交易，等於是把金融市場當賭場，這時就只能稱為「短線投機罷了」。


    柏格寫到：「這些新型指數型基金與傳統指數型基金大相逕庭，如果傳統的指數型基金理念是藉由多樣化來分散風險，那麼新型的指數型基金就意味著削弱多樣化，風險因此提升。如果投資的初衷是追求最小成本，那麼只投資特定產業的新型指數型基金成本確實很低，但並不意味在運氣好時，成功獲利的金額一定可以抵得过券商收取的手續費與稅收費用。」換言之，頻繁交易會提高投資成本、增加課稅的比重，道理就跟衝沷差不多。


    ## 程式交易是你的敵人嗎？


    程式交易早在 1970 年代就出現了，不過一直以來備受質疑；有時候，投資人一聽到程式交易就心生畏懼。程式交易可以同時交易不同的股票，而不是一次只買賣一檔股票。大部分程式交易是由電子形式進行，主要是大型交易公司的操作行爲。程式交易大約占紐約證券交易所每日交易量的
    10% 到 45%。對價值投資者來說，這種交易並不需要關心。通常，程式交易包括投資在大型交易所上市的重要股票，同時在其他交易所買賣相對應的選擇權。這些交易的基準完全取決於這些投資標的的相對價格，而且在交易前就已經將這樣的條件設定好了。


    1980 年代，程式交易才剛發明不久，當時只要股市波動稍微快一點，大家就會怪罪程式交易，特別是在股價下跌的時候更是如此。許多投資人認為 1987 年 10
    月的股市崩盤很可能就是因為程式交易所引發；如果不是，至少是程式交易讓結果惡化。不過接下來幾年的相關研究指出，大衆對程式交易的恐懼可能是反應過度。對於買下績優股、長期持有，再視情況賣出的投資人來說，程式交易只是創造市場流動性的一個因素，因此也造就投資良機。

    '
