    020  不敗投資法


    # 葛拉漢的影響深遠


    在那個年代，葛拉漢是最受人景仰的知名投資家。他是價值投資法之父，即使逝世已近 50 年，依然是指引投資界的明燈。儘管寫作風格與引用的例子已經時隔久遠，不過他寫的《證券分析》（Security
    Analysis）與《智慧型股票投資人》（The Intelligent Investor）到現在仍是經典之作。


    即使時空背景已經不同，葛拉漢所經歷的市場變化與我們今日面對的卻大同小異。1929 年經濟大蕭條爆發之前，他進入華爾街工作，當時的股市尚無太多監管機制，也沒有今天的會計準則與資訊揭露法規。可以說，當時的市場充滿了投機、炒作與內線交易。


    # 向大師學投資


    許多投資大師都曾受教於葛拉漢門下，直到今日依然信守這些原則。這些大師級人物包括巴菲特、華特·許羅斯（Walter Schloss）與厄文·卡漢（Irving
    Kahn）。葛拉漢的忠實信徒還包括約翰·柏格（John Bogle）、大衛·卓曼（David Dreman）、塞斯·克拉曼、彼得·林區（Peter Lynch）、馬力歐·蓋伯里（Mario
    Gabelli）、約翰·奈夫（John Neff）、查理·布蘭德斯、比爾·米勒'
  - '[PAGE 20]


    (Bill Miller)、麥克·歐尼爾（Michael O''Neill）、麥克·普萊斯（Michael F. Price）還有麥克·惠特曼（Michael
    Whitman），這些都是名聲極高的投資家。還有已經過世的克里斯多佛·布隆尼（Christopher Browne）、約翰·坦伯頓（John Templeton）、馬克斯·海涅（Max
    Heine）都是這一派的信徒。當然，價值投資法的追隨者並不止於此；過去25年來，價值投資法的勢力已經擴展到世界各地。以前，巴菲特每年在波克夏公司舉辦股東大會，其中包含專門接待外國投資人的歡迎會；但由於外國投資人的數目不斷成長，巴菲特不得不在2010年停辦這個接待會。


    不過，也有許多人批評價值投資法。有人覺得要在股海獲取最高報酬，最好的方法便是追求成長、不管風險。也有其他投資大師說，致富之道在於了解景氣循環，並從中獲利。現代投資組合理論（Modern
    portfolio theory，簡稱MPT）的擁護者則堅稱沒有誰可以擊敗大盤表現。還有人喜歡研究市場時機，享受當沖交易的快感。


    不過，不論是《金融學刊》（*The Journal of Finance*）、《金融分析期刊》（*The Financial Analysis'' Journal*）等學術期刊也好，還是布蘭德斯機構（Brandes
    Institute）等投顧公司也罷，都不斷發表相關的研究，告訴我們：**長期看來，價值型股票的表現幾乎都優過市場平均**。也就是說，價值投資法不但一直屹立不搖，而且也為市場帶來平衡穩定。不管市場如何變化，投資人都可以累積長久、穩定的財富。'
