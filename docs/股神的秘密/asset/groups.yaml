    獻給亞倫（Alan）還有我親愛的家人，

    謝謝他們的耐心與關愛。'
  - '[PAGE 3]


    這 10 年投資人遭到多重打擊，也學到許多教訓：先是 2000 年到 2002 年間的網路泡沫，然後是 2007 年到 2008 年的全球股市重挫。不管投資人擁護哪一派投資理念，全都無一倖免；就連最保守、最穩定的價值投資法也感受到這波危機的衝擊。


    若不是價值投資者持有的投資部位市值快速反彈，他們搞不好也要開始懷疑，究竟價值投資法可不可靠。


    21 世紀初，市場一片欣欣向榮。當時，擁護價值投資法的波克夏海瑟威公司（Berkshire Hathaway Inc.，簡稱波克夏，也就是華倫．巴菲特〔Warren
    Buffett〕的控股公司）表現並不突出。那時，只有波克夏的死忠股東看好波克夏的表現，每年 3 萬多名的擁護者出席股東大會，為巴菲特加油打氣。結果，他們贏了。2009
    年，巴菲特的公司創下 45 年來最好的成績：資產淨值增加了 218 億，每股淨值上漲 19.8%。


    另一位價值投資大師塞斯．克拉曼（Seth Klarman），長期以來持續打敗大盤，而且從不賣空，也不槓桿操作。過去 25 年來，克拉曼的包普斯特財務管理集團（Baupost
    Group）年報酬率高達 20%，在《阿爾發》雜誌（Alpha）'
  - '[PAGE 4]


    的對沖基金排行榜中排名第 49。接下來，本書會進一步介紹價值投資法，還會談到很多人如何堅守信念、戰勝投資困境。


    我們要時時檢查自己的想法對不對。想想過去 10 年來，市場遭遇多少嚴峻挑戰，散戶們身心煎熬，加上新的法規管制生效；可以說，現在正是溫習價值投資法的大好時機，學習班傑明．葛拉漢（Benjamin
    Graham）的投資法則來解決不同的新挑戰。


    我們會檢視這些投資原則如何被運用，又如何將這些法則應用到現在科技導向、無國界且快速變動的新世界環境中。


    1980 年代時，我是報紙的投資專欄作家，那是我第一次寫葛拉漢教授的故事。我的書《班傑明．葛拉漢的價值投資》(Benjamin Graham on Value
    Investing) 在 1994 年出版，第二本《價值投資勝經》(Value Investing Made Easy) 在 1996 年出版。這讓很多人對價值投資法產生濃厚的興趣。雖然有些人認為價值投資法只是「公式」應用，但是我不同意這種說法。葛拉漢極富好奇心、有實驗精神，也總是不斷尋找新的方式實踐價值投資法的基本原則。


    本書重新檢視這些基本原則，帶領大家探討各項投資決定的必要步驟，包括如何估算內在價值 (intrinsic value)、尋求安全邊際 (margin of
    safety)，並應用其他的價值投資原則。可以說，本書的內容從葛拉漢的概念出發，闡述價值投資法的道理。'
  - '[PAGE 5]


    也許你已經熟悉價值投資法，也許你才剛踏入股神巴菲特所說的「葛拉漢與陶德的投資園地」（Graham and Doddsville)*；但不管是哪一種，你都可以從本書獲得許多寶貴的新資訊。本書的內容包括市場上最新的投資思想與重要角色，也提到過去
    10 年來的各種想法、工業發展、經驗與企業故事等。此外，也會提到對高科技、生技與外商公司的投資，並解釋指數型基金（index fund）與指數股票型基金（exchange
    traded fund，簡稱 ETF）。同時，本書也會教導投資人如何利用網路搜集資料，學會如何分析、決定、買賣與管理投資組合。最重要的是，本書提醒你，不管是哪個理財專家或監管機制都不足以保護我們的錢財。雖然理財專家與政府的角色很重要，也負有重責大任，但我們也必須學會保護自己：知識，就是最佳的防禦武器。


    本書是專為散戶的你而寫。想學習理財也好，想要知道替自己操盤的人在做什麼也好，都可以參考這本書。


    如果有看到不懂的詞彙，請參考後面的名詞解釋；就算某一章都在談論特定的主題，參閱後面的名詞解釋還是可以幫助理解。本書也附上建議書單與相關網路資源，讓大家更了解投資的世界，培養巴菲特等價值投資大師所具備的必要直覺。


    本書包含許多知名價值投資大師的訪問內容，如巴菲特、威廉．歐尼爾（William O''Neil）、大衛．埃本（David


    > * 葛拉漢與陶德的投資園地（Graham and Doddsville）是股神巴菲特所創造的名詞，意指葛拉漢與陶德在《證券分析》一書中提出的價值投資概念。'
