    市，就只能投入10 年內用不到，最好是 10 年以上用不到的錢。」⁴¹ 這聽起來可能過於保守，不過她說的不無道理。還記得房市如何應聲而倒，股市也隨著快速崩盤嗎？而且還有許多人馬上丟了工作。


    美國長久以來維持市場穩定，讓大家忘了保護自己；也許這樣一來要買小一點的房子，得少出國幾次，投資報酬率也比較低，但還是應該要防患於未然。巴菲特常提醒我們，投資的第一原則是不要賠錢，第二原則則是要記住第一原則。他的忠告不只適用股市投資，也適用於其他理財的面向。


    # 了解風險


    有些風險的道理很顯而易見。一般來說，年輕人比老年人更能承擔風險，他們有時間調整自己的投資方式，並且將之前的損失贏回來。收入較低、儲蓄較少，可承擔的風險就比較小；相對的，如果收入高、負債少、儲蓄多、有充足的緊急備用金，就可以承擔更高的風險。越急著想投資，就應該要越保守。


    我們也知道，雖然數學是很有用的工具，但也可能導致過度自信。沒什麼比華爾街的例子來得貼切，華爾街很迷信量化分析（quantitative analysis），其中又以「高斯聯絡函數」（Gaussian
    copula function）最具代表性。《連'
  - '[PAGE 73]


    線》(Wire) 雜誌就說：「就是這個函數毀了華爾街。」


    高斯聯結函數是在加拿大接受高等教育的中國經濟學家李祥林 (David X. Li) 的傑作，2000 年，李祥林在《固定收益期刊》(The Journal
    of Fixed Income) 發表一篇文章，篇名為〈聯結函數的違約相關分析〉(On Default Correlation: A Copula Function
    Approach)。李祥林的這項公式簡單好用，可以漂亮地計算出風險，很快掀起一股風潮，從債券投資人開始，傳到大型銀行、對沖基金、交易機構、信評機構，甚至主管機關也不例外。這套公式旨在量化「不動產貸款抵押證券」(mortgage-backed
    securities，簡稱 MBS) 的風險，這讓業界人士信心滿滿推出抵押債權證券化商品，將數兆美元的貸款、債券還有任何手邊的資產通通包裝成「擔保債權憑證」(collateralized
    debt obligation，簡稱 CDO，為衍生性金融商品的一種) 。問題是，這個數學模型根本沒經過實際測試，而且背後根據的不過是高度波動、極不穩定的金融工具分析。


    許多經濟學家（包括李祥林自己）都提出警告，提醒大家這個高斯聯結函數模型有問題，可是沒什麼人聽。畢竟這個式子看起來很漂亮，在電腦模擬時也運作無誤：從電腦螢幕上看起來，這個模型看起來既現代又有科技感。


    「不能怪李祥林，」信貸研究機構 CreditSights 的凱 · 吉爾克斯 (Kai Gilkes) 說，「說起來，他只是發明這個數學模型。要怪就要怪誤用模型的銀行家。而且，之所以造成這麼大的危機，不是因為誰用了這個模型，而是每個人'
  - '[PAGE 74]


    都用了這個模型。歷史教訓告訴我們，如果金融市場上每個人都做一樣的事，就會導致泡沫與難以避免的泡沫破滅。』 $ ^ { 42 } $


    房價慘跌，失業率隨之攀升，債務違約擴及多項金融商品，幾兆美元瞬間蒸發，全球金融體系幾乎全面潰敗。這個故事的教訓是什麼？不管對專業投資人，還是其他散戶都一樣，那就是不要投資沒有徹底了解的商品。所有的金融活動都必然有風險。風險無可避免，但可以事先做好準備，防範於未然，並且降低風險。在這個過程中，務實思考大有幫助。


    # 風險與報酬的相關性


    葛拉漢說：「有時風險與報酬呈正相關……不過，價值投資法恰恰相反。如果你用 0.6 美元買 1 美元的資產，風險就比用 0.4 美元買 1 美元的資產來得高，但後者的預期報酬又比較高。』


    這種推論又把我们帶回到葛拉漢的「安全邊際」概念；就像巴菲特所說，這個概念不需要用到高等數學。簡單來說，安全邊際就是資產的真正價值與股價之間的差距。如果這個值為負數，代表股價被高估了。有時這個差距變小，有時變大；這個差距變大時，就是我們要等的投資機會。'
  - '[PAGE 75]


    大衛·埃本曾說：「我們還是偏愛價格遠低於淨值的股票，我們喜歡淨值帶來的下檔支撐能力與股價爆發力。」$^{43}$


    為了確保安全邊際，就要找出具有投資價值的商品。這樣的安全邊際可能來自某樣重要商品的大量庫存、某特定領域的當紅產品，或是強勁的現金資本。此外，也要試著：


    +   - 在市場走弱、許多股票遭低估時買進。2008年末與2009年初就是這樣的例子。


    +   - 尋找暫時受到衝擊的公司。2007年、2008年金融海嘯發生的時候，有些聰明的投資人趁機檢視各大銀行的情況，找到價格低廉的優質投資機會。2009年末，豐田因為加速器問題召回部分車輛，問題就開始越滾越大；到了2010年初，已經召回超過800萬部車，不但讓豐田付出許多成本，也影響原本極佳的商譽。2010年1月19號，豐田的股價為91.78元；但投資人了解問題的嚴重性後，股價立刻應聲下跌。到了2010年中，股價已經跌到68元。看起來，豐田似乎玩完了。不過，其實福特汽車（Ford）與通用汽車（General
    Motors）都曾出現召回車輛的紀錄，後來股價也都回升反彈。價值投資者密切注意豐田的變化，認為只要有耐心等待股價回升，這其實是價值投資的大好機會。


    +   - 即使空頭市場尚未出現，也可以仔細搜尋遭忽略的優質股票。'
