    # 衍生性金融商品


    衍生性金融商品是用股票、債券或指數型金融商品包裝而成的金融投資工具。期貨與選擇權就是歷史最悠久、投資人也最熟悉的衍生性商品；但隨著時間過去，許多衍生性金融商品卻變得越來越複雜。雖然多數散戶不會將錢投資在複雜的衍生性金融商品上，但這些商品卻會出現在對沖基金和其他基金中，也可能出現在公司的資產負債表上。


    一言以蔽之，衍生性金融商品不可信賴。面對這些複雜難解的金融工具，經驗老到的投資人常用「布萊克－修斯公式」（Black-Scholes formula）等複雜的公式來評估風險，不過這種工具不見得百分之百可靠。


    巴菲特寫到：「確實，最近的這些事件顯示，許多知名執行長（或「前」執行長）根本沒有能力管理帳面上的許多衍生性商品，查理跟我也不例外。」⁵³


    儘管巴菲特也持有一些遭低估的衍生性商品，不過他通常對衍生性商品敬而遠之。他在1998年買下通用再保（General Re）這家英國保險公司時，就學到這個教訓。他發現通用再保公司擁有太多衍生性金融商品，立即關閉該公司的衍生性商品部門，因而損失4億美元；他寧可這樣做，也不要續抱這些令人坐立難安的長期風險。那次決定的過程費時甚久，也很痛苦。'
  - '[PAGE 88]


    巴菲特說，新的法規提升了透明度，但即便如此，衍生性商品還是少碰為妙。「據我所知，沒有通報機制能正確評估一堆衍生性商品組合的風險。查核單位無力查這些帳目、主管機關也管不了。每次我翻開財報的「揭露資訊」（disclosure）時，如果看到一堆衍生性商品，最後一定都是看不懂這些投資組合是什麼（然後我就開始找阿斯匹靈）。」⁵⁴


    衍生性商品的設計有其功用，但往往運用在不好的地方；譬如說衍生性商品可能用來規避保證金要求（margin requirement）與交割期限（settlement
    period）。投資人看到企業大量運用衍生性金融商品應該特別小心；不管是企業、對沖基金公司、大型銀行還有其他法人機構都一樣，只要持有大量的衍生性商品，投資人就得非常小心。


    巴菲特有一次年度大會這樣說：「衍生性商品就像性愛，問題不在我們跟誰上床，而是對方到底跟誰上床。」


    # # 融資與融券


    所謂融資與融券，也就是向證券商借資來進行槓桿操作，風險其實很高。美國聯邦儲備銀行（Federal Reserve Bank）已經規定，一項投資的融資比例（margin
    debt）不得超過50%，但這種程度的融資還是可能釀成大禍。2007年、2008年的金融海嘯很大一部分是由放貸不當加上過度'
  - '[PAGE 89]


    擴張造成，並不只是房市的問題。


    2007 年 7 月，股票經紀詐騙部落格（Stock Broker Fraud Blog）寫到：「在紐約證交所，股票的融資比例已經超過 3500 億美元，在短短一個月內，融資的金額就增加
    350 億美元，相當於 10% 的增幅。融資比例的快速增加，代表投資人更要小心槓桿操作的風險。」⁵⁵


    葛拉漢之所以警告大家小心槓桿操作，是因為自己也有同樣的經歷。葛拉漢預測到 1929 年的股市崩盤，但沒想到事情會這麼嚴重，而且持續這麼久。他已事先進行避險，也小心選擇績優股，不過，他當時並沒有停止使用融資來槓桿操作。當券商紛紛要求追繳保證金時，他的帳戶也出現嚴重虧損。之後，他與夥伴紐曼努力不懈地無薪工作，才讓帳戶的數字由負翻正。從此，他們不再重蹈覆轍，再也不碰融資，但是很多明智的投資人卻還是跳不出融資的圈套。


    柏尼·艾伯斯（Bernie Ebbers）是世界通訊公司（WorldCom）的前任執行長，也是美國史上最大企業詐欺案的一個主角。在政府介入世界通訊的部分營運後，艾伯斯面臨極大的融資追繳壓力，外強中乾的真相也原形畢露。出於對世界通訊的情感，艾伯斯反手融資買進公司普通股，而且用他原本的股份做擔保。結果，世界通訊的股票開始下跌，艾伯斯接連收到追繳保證金的通知。他大可賣掉持股票清還債務，但董事們並不同意，因為要是風聲傳出去，其他股東也會紛紛跟著逃命，股價就會跌得更'
  - '[PAGE 90]


    慘。


    融資不見得是壞事，但必須小心使用。如果用了融資，就要隨時準備好面對融資追繳，而且在補繳保證金的同時，還能夠不需要賣出其他已持有的績優股。


    # 價值投資要點


    查理·布蘭德斯建議：「想要長期投資並獲利豐厚，就必須主動追尋超乎尋常的投資機會。但是，如果你有工作、有家庭，沒有時間或能力深入分析，或個性不適合當主動型投資人，就很難達到這樣的目標。」他還補充，「但我還是寧願更積極一點。我也相信，主動、聰明的投資人如果掌握基本的市場知識和必要的行為特質，還是比其他人有優勢。」


    打造投資組合，從這些觀念開始：


    +   - 依年齡、時間表、收入與個性打造合適的投資計畫。

    - 做好功課，並相信自己的決定。

    - 提醒自己，最有效、最省錢的自保之道就是避免信用擴張，並且分散風險，建立安全邊際。

    - 手中持股或市場出現波動時，不要過度驚慌。不過，如果你覺得自己的持股或市場開始陷入瘋狂狀態，就要當心了。'
  - '[PAGE 91]


    巴菲特提醒我們：「我們面對的是新時代、新產品，但一切終究還是要回歸到市場的本質；市場應該為我們所用，而不是把我們牽著鼻子走。」


    厄文·卡漢曾說：「在葛拉漢的保守派與股神巴菲特的高手風範之間，一定有適合自己的投資模式；要從中找到適合自己的風險／報酬組合，找出最適合自己資金需求與生活模式的投資方法。」⁵⁶


    # 你是在投資，還是在投機？


    許多投資人不懂什麼叫做投機，也就沒察覺到自己正在賭博。以下列出幾項特徵，提醒你可能以為自己正在投資，但其實是在賭博：


    +   - 冒著風險進行投機，導致相當程度的損失。

    - 已經賠錢了，還繼續投機，或是無法停損。

    - 借錢投資。

    - 行為反覆、不一致、不理性，或頻繁交易。


    康州賭博問題協會（Connecticut Council on Problem Gambling）針對賭博問題提供一些指引，而這些內容很多都適用於證券市場上的投機行為：


    +   - 不要動用到日常生活費用。

    - 設定上限，算好自己最多可以損失多少錢，要是輸了這麼多錢，就立刻停手。

    - 虧損就不要搶進，反而增加輸更多的風險。'
  - '[PAGE 92]


    · 有計畫地將贏來的錢（獲利）轉為他用。


    要進一步了解賭博與投資之間的關係，可以上康州賭博問題協會的網站：www.ccpg.org。


    # 防範詐欺


    真正的價值投資者，在投資股票之前會先做相關功課，比較不容易陷入金融詐欺的圈套；柏尼·馬多夫（Bernie Madoff）這類詐欺犯設下的陷阱比較難影響到這些價值投資者。老鼠會與其他詐騙手段都一樣，很少真的影響市場，因為其背後的詐欺犯很少真的在市場投資。不過有個例外，就是公司內部的財務詐欺行為，這部分會在後面討論到。總而言之，要小心以下這些徵兆出現：


    +   讓專專掌握你的資產，照他的意思投資、賣出，或隨時帶著你的錢一走了之。


    +   持續出現不合理的超高報酬率。定期比較同商品的投資報酬率，如果有出現超乎尋常的報酬率，就要特別注意。


    +   你不懂這些投資標的，而你的理專也告訴你，一般人本來就很難了解這麼複雜的學問。理專還告訴你，就是因為這樣，投資才會變成一門特別的學問。


    +   投資時感性多過理性。可能你面對必須馬上做決定的壓力，可能理專施展百絡蓮花說你現在地位提升了，讓你心花怒放。


    +   有一群狂熱的投資人共同參與投資計畫；這些人很可能是朋友、家人或是宗教團體。如果是宗教團體的人脈就更危險了，因為這些宗教團體都教我們要卸下心防，相信別人。'
  - '[PAGE 93]


    +   - 資料蒐集或實地查核是別人做的，別人說什麼你就信什麼。

    - 網絡上或電話中有陌生人要教你如何發財。網絡是投資人的好幫手，但就像其他有用的工具（如鏈鋸、焊槍）一樣，也可能用在不好的地方。詐騙集團現在運用網絡，重新推出舊有的詐騙手法，老鼠會、拉高倒貨（pump
    and dump）都是他們的手法之一。本書最後面會附上相關的名詞解釋。


    # 如何避免詐欺陷阱


    +   - 不碰自己不懂的商品、計畫或投資標的。

    - 不碰高風險的股票或債券。

    - 查證理專、投資顧問的背景，在投資前先向主管機關查詢。如果對方獨來獨往，或只跟少數幾個人合作，就要特別查清楚，確定這筆投資一切正常。查明他是否擁有執照？購買的商品是否登記在案？是不是透過正當程序上市？對方之前有沒有詐欺的不良紀錄？

    - 你的直覺會告訴你有沒有問題。直覺常常很準，所以要相信自己的直覺。


    # 如何處理金融的詐欺行為


    向負責的主管機關回報，求取資訊與協助。

    美國證券交易委員會提供許多關於詐欺與詐騙手法的資訊。可以上他們的網站：www.sec.gov.*'
  - '[PAGE 94]


    # 第 **6** 章


    # 資產負債表


    > 投資一直都是科學與藝術的美妙結合。⁶⁷


    大衛·埃本

    紐文信貸價值機會基金經理人'
  - '[PAGE 95]


    我們總是下意識地想跳過那一疊疊無趣、白紙黑字的財務報表，這些數字反正也不知道準不準、可不可靠。不過，古有明訓，要成長進步，就必須面對自己最害怕的事。花時間好好研究財務報表的基本原理，就會發現這些資產負債表、損益表其實不如想像可怕。實際上，這些財報可以變成我們的朋友，我們往往可以在這些文件裡找到或確認企業的內在價值。


    研究財務報表時，要注意三點：


    +   1. 資產反映公司財務的穩定性與安全性，也常常反映出未來的成長潛能。

    2. 負債會抵消資產與獲利，不過也可以用來刺激成長。

    3. 公司的獲利與潛在獲利會決定股價高低。


    資產負債表可以看出前兩點，而第三點則顯示在損益表上。


    # 投資的安全指標


    葛拉漢要學生面對現實，研究實際的資訊，不要管什麼預感、謠言，或其他與股市相關的小道消息。


    他說：「我的名字好像常常都跟『價值』連在一起。不過，我真正的重點是分析企業的獲利能力與資產負債表，'
  - '[PAGE 96]


    並用有說服力的方式清楚呈現。我不在乎每一季的變化，也不在乎所謂的『主要業務獲利』(primary earnings) 多了或少了哪幾個項目。最重要的是，我絕不預測未來。」⁵⁸


    葛拉漢說的有道理，不過巴菲特、蒙格、彼得·林區等人也證明了，隨著教育程度與經驗的提升，投資人的直覺也很有用。有經驗的投資人幾乎都能嗅出投資良機；不過如果是真正的老手，更會在投資之前做好功課，研究相關數字。大部分的投資人都可感應到即將出現的危機，如果直覺告訴我們可能有問題，就應該聽聽內心這個聲音。


    # ### 發現內在價值


    資產負債表的資產比較重要，還是損益表的獲利比較重要？這個問題長久以來就爭辯不休。厄文·卡漢與華特·許羅斯是葛拉漢與陶德早期的學生，他們強調資產負債表的重要，也創下許多驚人的投資紀錄。


    卡漢當初在哥倫比亞大學是葛拉漢的助教，他說：「我們強調資產負債表與資產資訊。我們比較老派，因為我們把主要目標放在保本。」⁵⁹ 他的兒子湯瑪仕（Thomas）是卡漢兄弟投資公司的合夥人，補充說：「股價很少與內在價值相差太多；如果差距很大，一定是市場認為這家公司可能遇到麻煩了。我們的工作就是進行分析，研究這種麻煩到底是永久還是暫時的。」⁶⁰'
  - '[PAGE 97]


    多年來，巴菲特一直持有不同觀點。在注意負債與其他資產負債表上的資訊同時，巴菲特更強調損益表的重要性。他的確很看重品質，但也注意成長性。近年來，他把焦點轉回能持續維持穩定、在嚴重通貨膨脹時期可以保護企業的資產上。


    為了完整、平衡、全面地檢視一家公司的體質，我們需要併用這兩份財報。這樣一來，我們就可以從兩個方向檢視企業的價值，交叉比對公司的現況與未來的營運走向。


    可以這樣講：如果這家公司是一艘船，資產負債表就是船身，損益表就是船帆。船身讓公司得以安然漂浮在水面上，而風帆（營業額就是推進力）則讓船前進。財務報表簡化了企業資訊，擷取我們需要、想要的訊息，讓我們知道船帆是鼓起還是毫無動靜？還是這艘根本是掛著骷髏頭的海盜船？讓我們先從資產負債表看起。


    # 資產負債表的要素


    資產負債表包含 4 大關鍵指標，分別是：


    +   - 資產。


    +   - 負債。


    +   - 現金（**cash holdings**）。


    +   - 股東權益（**equity position**），包含股利。'
  - '[PAGE 98]


    # 資產的本質


    資產有很多種，從存貨到生產計畫、信用卡用戶名單都算是資產。企業的資產可分為兩類——有形與無形資產。


    有形資產（或稱硬資產）指的是現金與固定資產；固定資產包括土地、建物、設備與辦公室擺設。


    現金就是現金，價值等同於面值。現金（或說流動資產）可以讓企業得以度過難關，也可以藉由開發新產品、新市場從內部擴張，或從外部收購其他公司來成長。


    不過，固定資產很難評估。如果有人付錢買下這些資產，或這些資產增值了，就會為企業注入一股強心劑。比如華爾格林公司（Walgreens）就擁有高價值的藥房，而且大部分是很久以前就買下來的。華爾格林公司在美國是最大的連鎖藥房，擁有
    7500 家連鎖商店；大部分的店面位於路口黃金地段，也因此為華爾格林公司帶來競爭優勢。


    不過，企業資產也可能帶來負面效應，所以要看看資產的種類與品質。航空公司的飛機或車廠生產線等資產都必須時時升級，而且所費不貲。如果是無法使用、設備破舊、效率低落的工廠，或必須用超低價才能賣掉的存貨，這種硬資產的品質就有待商榷了。


    第二種資產就是無形資產，或稱軟資產，因為這種資產不可捉摸，也就更難衡量價值。無形資產包括商譽、專利、商標、執照、廣告成本，還有其他無形的資源。這'
  - '[PAGE 99]


    類資產很難定價，卻可能是企業最重要的部分。Google、可口可樂與麥當勞都是全球知名的品牌，這些名字也為他們帶來競爭優勢；這些無形資產的成本甚至很低。比如
    Google 一直都沒打過廣告，也幾乎沒花錢推廣自己的服務。Google 在搜尋引擎界的驚人市占率來自口耳相傳，完全不需花一毛錢。同時，Google 也擁有優質的有形資產（現金與低成本的運算中心）與無形資產（品牌、優秀的員工與創意無限的服務）。


    # 計算淨值


    淨值其實就只是資產減去負債，不過什麼是資產，什麼是負債都還有爭議。要算出淨值，必須先找出資產合計的總額，然後減去無形資產、負債、還有優於普通股的股票。所得出的金額，就是買下整間公司要付出的金額；或者你也可以從這個數字出發，思考要花多少錢買下這家企業。要計算每股淨值，就將這個數字除以「流通在外的股數」。


    > 要衡量波克夏公司每年成長多少，最理想的標準是每股的內在價值變化。不過，這個價值根本無法精確計算，所以我們只好用別的標準代替，那就是：每股淨值。$^{61}$

    華倫·巴菲特'
  - '[PAGE 100]


    譬如，如果一家公司的資產有 20 億美元，負債有 16 億美元，淨值就是 4 億美元。如果這家公司流通在外的普通股有 2000 萬股，每股淨值就是 20 美元。葛拉漢認為，價值型股票的售價應該是有形資產淨值的
    1.2 倍；當然，價格越低越好。因此，葛拉漢不會花超過 24 美元買這家公司的股票。這樣的股票很難出現在正常的市場裡；不過，當股市動盪不安時，就會出現這樣的投資機會。


    只要看到算式裡出現「流通在外的股數」，就一定要仔細檢視企業的財務報表，連「附註」(footnotes) 也不能放過；如此一來，才能確定全部股票（包括所有的股票選擇權與其他可轉換股票）都包含其中。股東權益會受到所有未清償債務的稀釋；如果沒考量到這點，這類計算就毫無意義。


    # 淨值的優點


    淨值經過時間的考驗，可以反映企業的優勢與其對投資人的價值。


    常有人批評，淨值不過是對過去資料的分析，與未來的表現關係不大，應該是獲利能力比較重要吧！的確，這樣講不無道理。畢竟，資產有時很難估價，有時帳價與實際價值並不相符。不過，淨值就跟許多其他保守的指標一樣，在困境中更顯價值。當成長已不復見，穩定性便成了'
  - '[PAGE 101]


    救命仙丹。


    近年來，股價往往是淨值的 3 倍。尤其在 2007 年市場修正之前，股價淨值比常常高得嚇人。2007 年，亞馬遜（Amazon）的股價淨值比竟然高達 64。波音公司的股價淨值比也有
    13，蘋果（Apple）與微軟的股價淨值比也有 8.7。可以說，這些股票都太貴了。


    2009 年中，一位《霸榮週刊》(Barron''s) 的作家撰文指出，波克夏公司的股價淨值比已來到 1.2，正是買進的好時機，因為波克夏的股價淨值比通常落在
    1.6 到 1.8 之間。當時，波克夏的股價為 8 萬 5000 美元，相較於 2007 年每股 14 萬 9000 美元，可說跌了不少。⁶² 如果是葛拉漢，一定會考慮買進這檔股票。2009
    年，波克夏公司的淨值增加了 20%，來到 8 萬 4437 美元，股價漲到 12 萬 2420 美元，將股價淨值比拉到 1.4。顯然，《霸榮週刊》當初分析沒錯。


    # 淨值的缺點


    金融界所有的公式、比例指標都不是完美的，淨值當然也不例外。如果是固定資產比例較高（偏向工業）的企業，淨值就比較能準確衡量其價值；不過，如果一家企業的主要資產是智慧財產、商譽還有其他軟資產，淨值就容易失準。資本密集的產業往往股價淨值比較低，因為這些'
  - '[PAGE 102]


    產業每單位資產創造的獲利較低。相對的，依賴人力資本的行業往往能創造較高的資產獲利，股價淨值比也較高。大部分的情況下，相較於很傳統、很穩定的公司，投資人比較能接受成長型企業有較高的股價淨值比。不過，一般來說，有形資產還是比智慧財產或人力資本來得穩當。


    # ## 股價淨值比


    淨值常拿來與股價做比較。股價淨值比顯示，在最壞的情況下，股價的底線在哪裡。如果一家企業自願清算或不得已申請破產，淨值就是清償債務後可以分給股東的部分。如果一家公司的股價淨值比為
    1，表示投資人可以拿回原本全部投資進去的錢（不過前提是，資產可以以淨值賣出）。股價淨值比越高，在償還債務後，也就沒有剩餘的錢來還給股東。


    # ## 債務陷阱


    如果要說我們在 21 世紀的前 10 年學到了什麼教訓，那大概就是借錢要小心，而且千萬不要借過頭。不管對個人還是對國家來說，企業債務就是負債，債務的利息也是一筆費用。'
  - '[PAGE 103]


    借款可以幫助企業清償債務，穩定原本失衡的現金流，並加速成長。幾乎每家公司的資本結構都有借款；借款也讓管理團隊得以開發新產品、建立新設施，並且將觸手伸入新的市場。可是如果不謹慎運用，債務就會拖累資產與獲利，也可能拖垮整間公司。破產法院的設立，用意在讓公司可以暫時不用面對債權人，直到重新振作；如果不行，也可以用最公平的方式償還債務。生意不好時，無負債的公司也許會關門大吉，但不至於破產。關於企業清償債務的能力，請見下一章關於「稅前息前折舊攤銷前獲利」（Earnings
    Before Interest, Tax, Depreciation and Amortisation, 簡稱 EBITDA）的討論。


    # 債券評等失去公信力


    發行債券是政府與企業借錢的一個方法。長久以來，公司債券的評等是企業還債能力的指標。如果公司有違約風險，評等就較低，也就是在借錢時必須承諾付出更高的利息。評等高的公司可以輕易借得錢，付的利息也較低。


    幾十年來，主要的債信評等機構，如標準普爾（Standard & Poor''s）、穆迪（Moody''s）還有惠譽（Fitch）都受人信任，其債券分析也極具公信力。股市投資人可利用這些主要債信評等機構的報告，判斷一家企業穩不穩定。'
  md: "\n## 衍生性金融商品\n\n衍生性金融商品是用股票、債券或指數型金融商品包裝而成的金融投資工具。期貨與選擇權就是歷史最悠久、投資人也最熟悉的衍生性商品；但隨著時間過去，許多衍生性金融商品卻變得越來越複雜。雖然多數散戶不會將錢投資在複雜的衍生性金融商品上，但這些商品卻會出現在對沖基金和其他基金中，也可能出現在公司的資產負債表上。\n\
    \n一言以蔽之，衍生性金融商品不可信賴。面對這些複雜難解的金融工具，經驗老到的投資人常用「布萊克－修斯公式」（Black-Scholes formula）等複雜的公式來評估風險，不過這種工具不見得百分之百可靠。\n\
    \n巴菲特寫到：「確實，最近的這些事件顯示，許多知名執行長（或「前」執行長）根本沒有能力管理帳面上的許多衍生性商品，查理跟我也不例外。」⁵³\n\n儘管巴菲特也持有一些遭低估的衍生性商品，不過他通常對衍生性商品敬而遠之。他在1998年買下通用再保（General\
    \ Re）這家英國保險公司時，就學到這個教訓。他發現通用再保公司擁有太多衍生性金融商品，立即關閉該公司的衍生性商品部門，因而損失4億美元；他寧可這樣做，也不要續抱這些令人坐立難安的長期風險。那次決定的過程費時甚久，也很痛苦。\n\
    \n巴菲特說，新的法規提升了透明度，但即便如此，衍生性商品還是少碰為妙。「據我所知，沒有通報機制能正確評估一堆衍生性商品組合的風險。查核單位無力查這些帳目、主管機關也管不了。每次我翻開財報的「揭露資訊」（disclosure）時，如果看到一堆衍生性商品，最後一定都是看不懂這些投資組合是什麼（然後我就開始找阿斯匹靈）。」⁵⁴\n\
    \n衍生性商品的設計有其功用，但往往運用在不好的地方；譬如說衍生性商品可能用來規避保證金要求（margin requirement）與交割期限（settlement\
    \ period）。投資人看到企業大量運用衍生性金融商品應該特別小心；不管是企業、對沖基金公司、大型銀行還有其他法人機構都一樣，只要持有大量的衍生性商品，投資人就得非常小心。\n\
    \n巴菲特有一次年度大會這樣說：「衍生性商品就像性愛，問題不在我們跟誰上床，而是對方到底跟誰上床。」\n\n## 融資與融券\n\n所謂融資與融券，也就是向證券商借資來進行槓桿操作，風險其實很高。美國聯邦儲備銀行（Federal\
    \ Reserve Bank）已經規定，一項投資的融資比例（margin debt）不得超過50%，但這種程度的融資還是可能釀成大禍。2007年、2008年的金融海嘯很大一部分是由放貸不當加上過度擴張造成，並不只是房市的問題。\n\
    \n2007年7月，股票經紀詐騙部落格（Stock Broker Fraud Blog）寫到：「在紐約證交所，股票的融資比例已經超過3500億美元，在短短一個月內，融資的金額就增加350億美元，相當於10%的增幅。融資比例的快速增加，代表投資人更要小心槓桿操作的風險。」⁵⁵\n\
    \n葛拉漢之所以警告大家小心槓桿操作，是因為自己也有同樣的經歷。葛拉漢預測到1929年的股市崩盤，但沒想到事情會這麼嚴重，而且持續這麼久。他已事先進行避險，也小心選擇績優股，不過，他當時並沒有停止使用融資來槓桿操作。當券商紛紛要求追繳保證金時，他的帳戶也出現嚴重虧損。之後，他與夥伴紐曼努力不懈地無薪工作，才讓帳戶的數字由負翻正。從此，他們不再重蹈覆轍，再也不碰融資，但是很多明智的投資人卻還是跳不出融資的圈套。\n\
    \n柏尼·艾伯斯（Bernie Ebbers）是世界通訊公司（WorldCom）的前任執行長，也是美國史上最大企業詐欺案的一個主角。在政府介入世界通訊的部分營運後，艾伯斯面臨極大的融資追繳壓力，外強中乾的真相也原形畢露。出於對世界通訊的情感，艾伯斯反手融資買進公司普通股，而且用他原本的股份做擔保。結果，世界通訊的股票開始下跌，艾伯斯接連收到追繳保證金的通知。他大可賣掉持股清還債務，但董事們並不同意，因為要是風聲傳出去，其他股東也會紛紛跟著逃命，股價就會跌得更慘。\n\
    \n融資不見得是壞事，但必須小心使用。如果用了融資，就要隨時準備好面對融資追繳，而且在補繳保證金的同時，還能夠不需要賣出其他已持有的績優股。\n\n## 價值投資要點\n\
    \n查理·布蘭德斯建議：「想要長期投資並獲利豐厚，就必須主動追尋超乎尋常的投資機會。但是，如果你有工作、有家庭，沒有時間或能力深入分析，或個性不適合當主動型投資人，就很難達到這樣的目標。」他還補充，「但我還是寧願更積極一點。我也相信，主動、聰明的投資人如果掌握基本的市場知識和必要的行為特質，還是比其他人有優勢。」\n\
    \n打造投資組合，從這些觀念開始：\n\n- 依年齡、時間表、收入與個性打造合適的投資計畫。\n- 做好功課，並相信自己的決定。\n- 提醒自己，最有效、最省錢的自保之道就是避免信用擴張，並且分散風險，建立安全邊際。\n\
    - 手中持股或市場出現波動時，不要過度驚慌。不過，如果你覺得自己的持股或市場開始陷入瘋狂狀態，就要當心了。\n\n巴菲特提醒我們：「我們面對的是新時代、新產品，但一切終究還是要回歸到市場的本質；市場應該為我們所用，而不是把我們牽著鼻子走。」\n\
    \n厄文·卡漢曾說：「在葛拉漢的保守派與股神巴菲特的高手風範之間，一定有適合自己的投資模式；要從中找到適合自己的風險／報酬組合，找出最適合自己資金需求與生活模式的投資方法。」⁵⁶\n\
    \n## 你是在投資，還是在投機？\n\n許多投資人不懂什麼叫做投機，也就沒察覺到自己正在賭博。以下列出幾項特徵，提醒你可能以為自己正在投資，但其實是在賭博：\n\
    \n- 冒著風險進行投機，導致相當程度的損失。\n- 已經賠錢了，還繼續投機，或是無法停損。\n- 借錢投資。\n- 行為反覆、不一致、不理性，或頻繁交易。\n\
    \n康州賭博問題協會（Connecticut Council on Problem Gambling）針對賭博問題提供一些指引，而這些內容很多都適用於證券市場上的投機行為：\n\
    \n- 不要動用到日常生活費用。\n- 設定上限，算好自己最多可以損失多少錢，要是輸了這麼多錢，就立刻停手。\n- 虧損就不要搶進，反而增加輸更多的風險。\n\
    - 有計畫地將贏來的錢（獲利）轉為他用。\n\n要進一步了解賭博與投資之間的關係，可以上康州賭博問題協會的網站：www.ccpg.org。\n\n## 防範詐欺\n\
    \n真正的價值投資者，在投資股票之前會先做相關功課，比較不容易陷入金融詐欺的圈套；柏尼·馬多夫（Bernie Madoff）這類詐欺犯設下的陷阱比較難影響到這些價值投資者。老鼠會與其他詐騙手段都一樣，很少真的影響市場，因為其背後的詐欺犯很少真的在市場投資。不過有個例外，就是公司內部的財務詐欺行為，這部分會在後面討論到。總而言之，要小心以下這些徵兆出現：\n\
    \n- 讓專專掌握你的資產，照他的意思投資、賣出，或隨時帶著你的錢一走了之。\n- 持續出現不合理的超高報酬率。定期比較同商品的投資報酬率，如果有出現超乎尋常的報酬率，就要特別注意。\n\
    - 你不懂這些投資標的，而你的理專也告訴你，一般人本來就很難了解這麼複雜的學問。理專還告訴你，就是因為這樣，投資才會變成一門特別的學問。\n- 投資時感性多過理性。可能你面對必須馬上做決定的壓力，可能理專施展百絡蓮花說你現在地位提升了，讓你心花怒放。\n\
    - 有一群狂熱的投資人共同參與投資計畫；這些人很可能是朋友、家人或是宗教團體。如果是宗教團體的人脈就更危險了，因為這些宗教團體都教我們要卸下心防，相信別人。\n\
    - 資料蒐集或實地查核是別人做的，別人說什麼你就信什麼。\n- 網絡上或電話中有陌生人要教你如何發財。網絡是投資人的好幫手，但就像其他有用的工具（如鏈鋸、焊槍）一樣，也可能用在不好的地方。詐騙集團現在運用網絡，重新推出舊有的詐騙手法，老鼠會、拉高倒貨（pump\
    \ and dump）都是他們的手法之一。本書最後面會附上相關的名詞解釋。\n\n## 如何避免詐欺陷阱\n\n- 不碰自己不懂的商品、計畫或投資標的。\n\
    - 不碰高風險的股票或債券。\n- 查證理專、投資顧問的背景，在投資前先向主管機關查詢。如果對方獨來獨往，或只跟少數幾個人合作，就要特別查清楚，確定這筆投資一切正常。查明他是否擁有執照？購買的商品是否登記在案？是不是透過正當程序上市？對方之前有沒有詐欺的不良紀錄？\n\
    - 你的直覺會告訴你有沒有問題。直覺常常很準，所以要相信自己的直覺。\n\n## 如何處理金融的詐欺行為\n\n向負責的主管機關回報，求取資訊與協助。美國證券交易委員會提供許多關於詐欺與詐騙手法的資訊。可以上他們的網站：www.sec.gov。\n\
    \n## 第 6 章 資產負債表\n\n> 投資一直都是科學與藝術的美妙結合。⁶⁷\n>\n> 大衛·埃本  \n> 紐文信貸價值機會基金經理人\n\n我們總是下意識地想跳過那一疊疊無趣、白紙黑字的財務報表，這些數字反正也不知道準不準、可不可靠。不過，古有明訓，要成長進步，就必須面對自己最害怕的事。花時間好好研究財務報表的基本原理，就會發現這些資產負債表、損益表其實不如想像可怕。實際上，這些財報可以變成我們的朋友，我們往往可以在這些文件裡找到或確認企業的內在價值。\n\
    \n研究財務報表時，要注意三點：\n\n1. 資產反映公司財務的穩定性與安全性，也常常反映出未來的成長潛能。\n2. 負債會抵消資產與獲利，不過也可以用來刺激成長。\n\
    3. 公司的獲利與潛在獲利會決定股價高低。\n\n資產負債表可以看出前兩點，而第三點則顯示在損益表上。\n\n## 投資的安全指標\n\n葛拉漢要學生面對現實，研究實際的資訊，不要管什麼預感、謠言，或其他與股市相關的小道消息。\n\
    \n他說：「我的名字好像常常都跟『價值』連在一起。不過，我真正的重點是分析企業的獲利能力與資產負債表，並用有說服力的方式清楚呈現。我不在乎每一季的變化，也不在乎所謂的『主要業務獲利』(primary\
    \ earnings) 多了或少了哪幾個項目。最重要的是，我絕不預測未來。」⁵⁸\n\n葛拉漢說的有道理，不過巴菲特、蒙格、彼得·林區等人也證明了，隨著教育程度與經驗的提升，投資人的直覺也很有用。有經驗的投資人幾乎都能嗅出投資良機；不過如果是真正的老手，更會在投資之前做好功課，研究相關數字。大部分的投資人都可感應到即將出現的危機，如果直覺告訴我們可能有問題，就應該聽聽內心這個聲音。\n\
    \n## 發現內在價值\n\n資產負債表的資產比較重要，還是損益表的獲利比較重要？這個問題長久以來就爭辯不休。厄文·卡漢與華特·許羅斯是葛拉漢與陶德早期的學生，他們強調資產負債表的重要，也創下許多驚人的投資紀錄。\n\
    \n卡漢當初在哥倫比亞大學是葛拉漢的助教，他說：「我們強調資產負債表與資產資訊。我們比較老派，因為我們把主要目標放在保本。」⁵⁹ 他的兒子湯瑪仕（Thomas）是卡漢兄弟投資公司的合夥人，補充說：「股價很少與內在價值相差太多；如果差距很大，一定是市場認為這家公司可能遇到麻煩了。我們的工作就是進行分析，研究這種麻煩到底是永久還是暫時的。」⁶⁰\n\
    \n多年來，巴菲特一直持有不同觀點。在注意負債與其他資產負債表上的資訊同時，巴菲特更強調損益表的重要性。他的確很看重品質，但也注意成長性。近年來，他把焦點轉回能持續維持穩定、在嚴重通貨膨脹時期可以保護企業的資產上。\n\
    \n為了完整、平衡、全面地檢視一家公司的體質，我們需要併用這兩份財報。這樣一來，我們就可以從兩個方向檢視企業的價值，交叉比對公司的現況與未來的營運走向。\n\
    \n可以這樣講：如果這家公司是一艘船，資產負債表就是船身，損益表就是船帆。船身讓公司得以安然漂浮在水面上，而風帆（營業額就是推進力）則讓船前進。財務報表簡化了企業資訊，擷取我們需要、想要的訊息，讓我們知道船帆是鼓起還是毫無動靜？還是這艘根本是掛著骷髏頭的海盜船？讓我們先從資產負債表看起。\n\
    \n## 資產負債表的要素\n\n資產負債表包含 4 大關鍵指標，分別是：\n\n- 資產。\n- 負債。\n- 現金（**cash holdings**）。\n\
    - 股東權益（**equity position**），包含股利。\n\n## 資產的本質\n\n資產有很多種，從存貨到生產計畫、信用卡用戶名單都算是資產。企業的資產可分為兩類——有形與無形資產。\n\
    \n有形資產（或稱硬資產）指的是現金與固定資產；固定資產包括土地、建物、設備與辦公室擺設。\n\n現金就是現金，價值等同於面值。現金（或說流動資產）可以讓企業得以度過難關，也可以藉由開發新產品、新市場從內部擴張，或從外部收購其他公司來成長。\n\
    \n不過，固定資產很難評估。如果有人付錢買下這些資產，或這些資產增值了，就會為企業注入一股強心劑。比如華爾格林公司（Walgreens）就擁有高價值的藥房，而且大部分是很久以前就買下來的。華爾格林公司在美國是最大的連鎖藥房，擁有\
    \ 7500 家連鎖商店；大部分的店面位於路口黃金地段，也因此為華爾格林公司帶來競爭優勢。\n\n不過，企業資產也可能帶來負面效應，所以要看看資產的種類與品質。航空公司的飛機或車廠生產線等資產都必須時時升級，而且所費不貲。如果是無法使用、設備破舊、效率低落的工廠，或必須用超低價才能賣掉的存貨，這種硬資產的品質就有待商榷了。\n\
    \n第二種資產就是無形資產，或稱軟資產，因為這種資產不可捉摸，也就更難衡量價值。無形資產包括商譽、專利、商標、執照、廣告成本，還有其他無形的資源。這類資產很難定價，卻可能是企業最重要的部分。Google、可口可樂與麥當勞都是全球知名的品牌，這些名字也為他們帶來競爭優勢；這些無形資產的成本甚至很低。比如\
    \ Google 一直都沒打過廣告，也幾乎沒花錢推廣自己的服務。Google 在搜尋引擎界的驚人市占率來自口耳相傳，完全不需花一毛錢。同時，Google 也擁有優質的有形資產（現金與低成本的運算中心）與無形資產（品牌、優秀的員工與創意無限的服務）。\n\
    \n## 計算淨值\n\n淨值其實就只是資產減去負債，不過什麼是資產，什麼是負債都還有爭議。要算出淨值，必須先找出資產合計的總額，然後減去無形資產、負債、還有優於普通股的股票。所得出的金額，就是買下整間公司要付出的金額；或者你也可以從這個數字出發，思考要花多少錢買下這家企業。要計算每股淨值，就將這個數字除以「流通在外的股數」。\n\
    \n> 要衡量波克夏公司每年成長多少，最理想的標準是每股的內在價值變化。不過，這個價值根本無法精確計算，所以我們只好用別的標準代替，那就是：每股淨值。$^{61}$\n\
    >\n> 華倫·巴菲特\n\n譬如，如果一家公司的資產有 20 億美元，負債有 16 億美元，淨值就是 4 億美元。如果這家公司流通在外的普通股有 2000\
    \ 萬股，每股淨值就是 20 美元。葛拉漢認為，價值型股票的售價應該是有形資產淨值的 1.2 倍；當然，價格越低越好。因此，葛拉漢不會花超過 24 美元買這家公司的股票。這樣的股票很難出現在正常的市場裡；不過，當股市動盪不安時，就會出現這樣的投資機會。\n\
    \n只要看到算式裡出現「流通在外的股數」，就一定要仔細檢視企業的財務報表，連「附註」(footnotes) 也不能放過；如此一來，才能確定全部股票（包括所有的股票選擇權與其他可轉換股票）都包含其中。股東權益會受到所有未清償債務的稀釋；如果沒考量到這點，這類計算就毫無意義。\n\
    \n## 淨值的優點\n\n淨值經過時間的考驗，可以反映企業的優勢與其對投資人的價值。\n\n常有人批評，淨值不過是對過去資料的分析，與未來的表現關係不大，應該是獲利能力比較重要吧！的確，這樣講不無道理。畢竟，資產有時很難估價，有時帳價與實際價值並不相符。不過，淨值就跟許多其他保守的指標一樣，在困境中更顯價值。當成長已不復見，穩定性便成了救命仙丹。\n\
    \n近年來，股價往往是淨值的 3 倍。尤其在 2007 年市場修正之前，股價淨值比常常高得嚇人。2007 年，亞馬遜（Amazon）的股價淨值比竟然高達 64。波音公司的股價淨值比也有\
    \ 13，蘋果（Apple）與微軟的股價淨值比也有 8.7。可以說，這些股票都太貴了。\n\n2009 年中，一位《霸榮週刊》(Barron's) 的作家撰文指出，波克夏公司的股價淨值比已來到\
    \ 1.2，正是買進的好時機，因為波克夏的股價淨值比通常落在 1.6 到 1.8 之間。當時，波克夏的股價為 8 萬 5000 美元，相較於 2007 年每股\
    \ 14 萬 9000 美元，可說跌了不少。⁶² 如果是葛拉漢，一定會考慮買進這檔股票。2009 年，波克夏公司的淨值增加了 20%，來到 8 萬 4437\
    \ 美元，股價漲到 12 萬 2420 美元，將股價淨值比拉到 1.4。顯然，《霸榮週刊》當初分析沒錯。\n\n## 淨值的缺點\n\n金融界所有的公式、比例指標都不是完美的，淨值當然也不例外。如果是固定資產比例較高（偏向工業）的企業，淨值就比較能準確衡量其價值；不過，如果一家企業的主要資產是智慧財產、商譽還有其他軟資產，淨值就容易失準。資本密集的產業往往股價淨值比較低，因為這些產業每單位資產創造的獲利較低。相對的，依賴人力資本的行業往往能創造較高的資產獲利，股價淨值比也較高。大部分的情況下，相較於很傳統、很穩定的公司，投資人比較能接受成長型企業有較高的股價淨值比。不過，一般來說，有形資產還是比智慧財產或人力資本來得穩當。\n\
    \n## 股價淨值比\n\n淨值常拿來與股價做比較。股價淨值比顯示，在最壞的情況下，股價的底線在哪裡。如果一家企業自願清算或不得已申請破產，淨值就是清償債務後可以分給股東的部分。如果一家公司的股價淨值比為\
    \ 1，表示投資人可以拿回原本全部投資進去的錢（不過前提是，資產可以以淨值賣出）。股價淨值比越高，在償還債務後，也就沒有剩餘的錢來還給股東。\n\n## 債務陷阱\n\
    \n如果要說我們在 21 世紀的前 10 年學到了什麼教訓，那大概就是借錢要小心，而且千萬不要借過頭。不管對個人還是對國家來說，企業債務就是負債，債務的利息也是一筆費用。\n\
    \n借款可以幫助企業清償債務，穩定原本失衡的現金流，並加速成長。幾乎每家公司的資本結構都有借款；借款也讓管理團隊得以開發新產品、建立新設施，並且將觸手伸入新的市場。可是如果不謹慎運用，債務就會拖累資產與獲利，也可能拖垮整間公司。破產法院的設立，用意在讓公司可以暫時不用面對債權人，直到重新振作；如果不行，也可以用最公平的方式償還債務。生意不好時，無負債的公司也許會關門大吉，但不至於破產。關於企業清償債務的能力，請見下一章關於「稅前息前折舊攤銷前獲利」（Earnings\
    \ Before Interest, Tax, Depreciation and Amortisation, 簡稱 EBITDA）的討論。\n\n## 債券評等失去公信力\n\
    \n發行債券是政府與企業借錢的一個方法。長久以來，公司債券的評等是企業還債能力的指標。如果公司有違約風險，評等就較低，也就是在借錢時必須承諾付出更高的利息。評等高的公司可以輕易借得錢，付的利息也較低。\n\
    \n幾十年來，主要的債信評等機構，如標準普爾（Standard & Poor's）、穆迪（Moody's）還有惠譽（Fitch）都受人信任，其債券分析也極具公信力。股市投資人可利用這些主要債信評等機構的報告，判斷一家企業穩不穩定。\n"
  mdcn: "\n## 衍生性金融商品\n\n衍生性金融商品是用股票、債券或指數型金融商品包裝而成的金融投資工具。期貨與選擇權就是歷史最悠久、投資人也最熟悉的衍生性商品；但隨著時間過去，許多衍生性金融商品卻變得越來越複雜。雖然多數散戶不會將錢投資在複雜的衍生性金融商品上，但這些商品卻會出現在對沖基金和其他基金中，也可能出現在公司的資產負債表上。\n\
    \n一言以蔽之，衍生性金融商品不可信賴。面對這些複雜難解的金融工具，經驗老到的投資人常用「布萊克－修斯公式」（Black-Scholes formula）等複雜的公式來評估風險，不過這種工具不見得百分之百可靠。\n\
    \n巴菲特寫到：「確實，最近的這些事件顯示，許多知名執行長（或「前」執行長）根本沒有能力管理帳面上的許多衍生性商品，查理跟我也不例外。」⁵³\n\n儘管巴菲特也持有一些遭低估的衍生性商品，不過他通常對衍生性商品敬而遠之。他在1998年買下通用再保（General\
    \ Re）這家英國保險公司時，就學到這個教訓。他發現通用再保公司擁有太多衍生性金融商品，立即關閉該公司的衍生性商品部門，因而損失4億美元；他寧可這樣做，也不要續抱這些令人坐立難安的長期風險。那次決定的過程費時甚久，也很痛苦。\n\
    \n巴菲特說，新的法規提升了透明度，但即便如此，衍生性商品還是少碰為妙。「據我所知，沒有通報機制能正確評估一堆衍生性商品組合的風險。查核單位無力查這些帳目、主管機關也管不了。每次我翻開財報的「揭露資訊」（disclosure）時，如果看到一堆衍生性商品，最後一定都是看不懂這些投資組合是什麼（然後我就開始找阿斯匹靈）。」⁵⁴\n\
    \n衍生性商品的設計有其功用，但往往運用在不好的地方；譬如說衍生性商品可能用來規避保證金要求（margin requirement）與交割期限（settlement\
    \ period）。投資人看到企業大量運用衍生性金融商品應該特別小心；不管是企業、對沖基金公司、大型銀行還有其他法人機構都一樣，只要持有大量的衍生性商品，投資人就得非常小心。\n\
    \n巴菲特有一次年度大會這樣說：「衍生性商品就像性愛，問題不在我們跟誰上床，而是對方到底跟誰上床。」\n\n## 融資與融券\n\n所謂融資與融券，也就是向證券商借資來進行槓桿操作，風險其實很高。美國聯邦儲備銀行（Federal\
    \ Reserve Bank）已經規定，一項投資的融資比例（margin debt）不得超過50%，但這種程度的融資還是可能釀成大禍。2007年、2008年的金融海嘯很大一部分是由放貸不當加上過度擴張造成，並不只是房市的問題。\n\
    \n2007年7月，股票經紀詐騙部落格（Stock Broker Fraud Blog）寫到：「在紐約證交所，股票的融資比例已經超過3500億美元，在短短一個月內，融資的金額就增加350億美元，相當於10%的增幅。融資比例的快速增加，代表投資人更要小心槓桿操作的風險。」⁵⁵\n\
    \n葛拉漢之所以警告大家小心槓桿操作，是因為自己也有同樣的經歷。葛拉漢預測到1929年的股市崩盤，但沒想到事情會這麼嚴重，而且持續這麼久。他已事先進行避險，也小心選擇績優股，不過，他當時並沒有停止使用融資來槓桿操作。當券商紛紛要求追繳保證金時，他的帳戶也出現嚴重虧損。之後，他與夥伴紐曼努力不懈地無薪工作，才讓帳戶的數字由負翻正。從此，他們不再重蹈覆轍，再也不碰融資，但是很多明智的投資人卻還是跳不出融資的圈套。\n\
    \n柏尼·艾伯斯（Bernie Ebbers）是世界通訊公司（WorldCom）的前任執行長，也是美國史上最大企業詐欺案的一個主角。在政府介入世界通訊的部分營運後，艾伯斯面臨極大的融資追繳壓力，外強中乾的真相也原形畢露。出於對世界通訊的情感，艾伯斯反手融資買進公司普通股，而且用他原本的股份做擔保。結果，世界通訊的股票開始下跌，艾伯斯接連收到追繳保證金的通知。他大可賣掉持股清還債務，但董事們並不同意，因為要是風聲傳出去，其他股東也會紛紛跟著逃命，股價就會跌得更慘。\n\
    \n融資不見得是壞事，但必須小心使用。如果用了融資，就要隨時準備好面對融資追繳，而且在補繳保證金的同時，還能夠不需要賣出其他已持有的績優股。\n\n## 價值投資要點\n\
    \n查理·布蘭德斯建議：「想要長期投資並獲利豐厚，就必須主動追尋超乎尋常的投資機會。但是，如果你有工作、有家庭，沒有時間或能力深入分析，或個性不適合當主動型投資人，就很難達到這樣的目標。」他還補充，「但我還是寧願更積極一點。我也相信，主動、聰明的投資人如果掌握基本的市場知識和必要的行為特質，還是比其他人有優勢。」\n\
    \n打造投資組合，從這些觀念開始：\n\n- 依年齡、時間表、收入與個性打造合適的投資計畫。\n- 做好功課，並相信自己的決定。\n- 提醒自己，最有效、最省錢的自保之道就是避免信用擴張，並且分散風險，建立安全邊際。\n\
    - 手中持股或市場出現波動時，不要過度驚慌。不過，如果你覺得自己的持股或市場開始陷入瘋狂狀態，就要當心了。\n\n巴菲特提醒我們：「我們面對的是新時代、新產品，但一切終究還是要回歸到市場的本質；市場應該為我們所用，而不是把我們牽著鼻子走。」\n\
    \n厄文·卡漢曾說：「在葛拉漢的保守派與股神巴菲特的高手風範之間，一定有適合自己的投資模式；要從中找到適合自己的風險／報酬組合，找出最適合自己資金需求與生活模式的投資方法。」⁵⁶\n\
    \n## 你是在投資，還是在投機？\n\n許多投資人不懂什麼叫做投機，也就沒察覺到自己正在賭博。以下列出幾項特徵，提醒你可能以為自己正在投資，但其實是在賭博：\n\
    \n- 冒著風險進行投機，導致相當程度的損失。\n- 已經賠錢了，還繼續投機，或是無法停損。\n- 借錢投資。\n- 行為反覆、不一致、不理性，或頻繁交易。\n\
    \n康州賭博問題協會（Connecticut Council on Problem Gambling）針對賭博問題提供一些指引，而這些內容很多都適用於證券市場上的投機行為：\n\
    \n- 不要動用到日常生活費用。\n- 設定上限，算好自己最多可以損失多少錢，要是輸了這麼多錢，就立刻停手。\n- 虧損就不要搶進，反而增加輸更多的風險。\n\
    - 有計畫地將贏來的錢（獲利）轉為他用。\n\n要進一步了解賭博與投資之間的關係，可以上康州賭博問題協會的網站：www.ccpg.org。\n\n## 防範詐欺\n\
    \n真正的價值投資者，在投資股票之前會先做相關功課，比較不容易陷入金融詐欺的圈套；柏尼·馬多夫（Bernie Madoff）這類詐欺犯設下的陷阱比較難影響到這些價值投資者。老鼠會與其他詐騙手段都一樣，很少真的影響市場，因為其背後的詐欺犯很少真的在市場投資。不過有個例外，就是公司內部的財務詐欺行為，這部分會在後面討論到。總而言之，要小心以下這些徵兆出現：\n\
    \n- 讓專專掌握你的資產，照他的意思投資、賣出，或隨時帶著你的錢一走了之。\n- 持續出現不合理的超高報酬率。定期比較同商品的投資報酬率，如果有出現超乎尋常的報酬率，就要特別注意。\n\
    - 你不懂這些投資標的，而你的理專也告訴你，一般人本來就很難了解這麼複雜的學問。理專還告訴你，就是因為這樣，投資才會變成一門特別的學問。\n- 投資時感性多過理性。可能你面對必須馬上做決定的壓力，可能理專施展百絡蓮花說你現在地位提升了，讓你心花怒放。\n\
    - 有一群狂熱的投資人共同參與投資計畫；這些人很可能是朋友、家人或是宗教團體。如果是宗教團體的人脈就更危險了，因為這些宗教團體都教我們要卸下心防，相信別人。\n\
    - 資料蒐集或實地查核是別人做的，別人說什麼你就信什麼。\n- 網絡上或電話中有陌生人要教你如何發財。網絡是投資人的好幫手，但就像其他有用的工具（如鏈鋸、焊槍）一樣，也可能用在不好的地方。詐騙集團現在運用網絡，重新推出舊有的詐騙手法，老鼠會、拉高倒貨（pump\
    \ and dump）都是他們的手法之一。本書最後面會附上相關的名詞解釋。\n\n## 如何避免詐欺陷阱\n\n- 不碰自己不懂的商品、計畫或投資標的。\n\
    - 不碰高風險的股票或債券。\n- 查證理專、投資顧問的背景，在投資前先向主管機關查詢。如果對方獨來獨往，或只跟少數幾個人合作，就要特別查清楚，確定這筆投資一切正常。查明他是否擁有執照？購買的商品是否登記在案？是不是透過正當程序上市？對方之前有沒有詐欺的不良紀錄？\n\
    - 你的直覺會告訴你有沒有問題。直覺常常很準，所以要相信自己的直覺。\n\n## 如何處理金融的詐欺行為\n\n向負責的主管機關回報，求取資訊與協助。美國證券交易委員會提供許多關於詐欺與詐騙手法的資訊。可以上他們的網站：www.sec.gov。\n\
    \n## 第 6 章 資產負債表\n\n> 投資一直都是科學與藝術的美妙結合。⁶⁷\n>\n> 大衛·埃本  \n> 紐文信貸價值機會基金經理人\n\n我們總是下意識地想跳過那一疊疊無趣、白紙黑字的財務報表，這些數字反正也不知道準不準、可不可靠。不過，古有明訓，要成長進步，就必須面對自己最害怕的事。花時間好好研究財務報表的基本原理，就會發現這些資產負債表、損益表其實不如想像可怕。實際上，這些財報可以變成我們的朋友，我們往往可以在這些文件裡找到或確認企業的內在價值。\n\
    \n研究財務報表時，要注意三點：\n\n1. 資產反映公司財務的穩定性與安全性，也常常反映出未來的成長潛能。\n2. 負債會抵消資產與獲利，不過也可以用來刺激成長。\n\
    3. 公司的獲利與潛在獲利會決定股價高低。\n\n資產負債表可以看出前兩點，而第三點則顯示在損益表上。\n\n## 投資的安全指標\n\n葛拉漢要學生面對現實，研究實際的資訊，不要管什麼預感、謠言，或其他與股市相關的小道消息。\n\
    \n他說：「我的名字好像常常都跟『價值』連在一起。不過，我真正的重點是分析企業的獲利能力與資產負債表，並用有說服力的方式清楚呈現。我不在乎每一季的變化，也不在乎所謂的『主要業務獲利』(primary\
    \ earnings) 多了或少了哪幾個項目。最重要的是，我絕不預測未來。」⁵⁸\n\n葛拉漢說的有道理，不過巴菲特、蒙格、彼得·林區等人也證明了，隨著教育程度與經驗的提升，投資人的直覺也很有用。有經驗的投資人幾乎都能嗅出投資良機；不過如果是真正的老手，更會在投資之前做好功課，研究相關數字。大部分的投資人都可感應到即將出現的危機，如果直覺告訴我們可能有問題，就應該聽聽內心這個聲音。\n\
    \n## 發現內在價值\n\n資產負債表的資產比較重要，還是損益表的獲利比較重要？這個問題長久以來就爭辯不休。厄文·卡漢與華特·許羅斯是葛拉漢與陶德早期的學生，他們強調資產負債表的重要，也創下許多驚人的投資紀錄。\n\
    \n卡漢當初在哥倫比亞大學是葛拉漢的助教，他說：「我們強調資產負債表與資產資訊。我們比較老派，因為我們把主要目標放在保本。」⁵⁹ 他的兒子湯瑪仕（Thomas）是卡漢兄弟投資公司的合夥人，補充說：「股價很少與內在價值相差太多；如果差距很大，一定是市場認為這家公司可能遇到麻煩了。我們的工作就是進行分析，研究這種麻煩到底是永久還是暫時的。」⁶⁰\n\
    \n多年來，巴菲特一直持有不同觀點。在注意負債與其他資產負債表上的資訊同時，巴菲特更強調損益表的重要性。他的確很看重品質，但也注意成長性。近年來，他把焦點轉回能持續維持穩定、在嚴重通貨膨脹時期可以保護企業的資產上。\n\
    \n為了完整、平衡、全面地檢視一家公司的體質，我們需要併用這兩份財報。這樣一來，我們就可以從兩個方向檢視企業的價值，交叉比對公司的現況與未來的營運走向。\n\
    \n可以這樣講：如果這家公司是一艘船，資產負債表就是船身，損益表就是船帆。船身讓公司得以安然漂浮在水面上，而風帆（營業額就是推進力）則讓船前進。財務報表簡化了企業資訊，擷取我們需要、想要的訊息，讓我們知道船帆是鼓起還是毫無動靜？還是這艘根本是掛著骷髏頭的海盜船？讓我們先從資產負債表看起。\n\
    \n## 資產負債表的要素\n\n資產負債表包含 4 大關鍵指標，分別是：\n\n- 資產。\n- 負債。\n- 現金（**cash holdings**）。\n\
    - 股東權益（**equity position**），包含股利。\n\n## 資產的本質\n\n資產有很多種，從存貨到生產計畫、信用卡用戶名單都算是資產。企業的資產可分為兩類——有形與無形資產。\n\
    \n有形資產（或稱硬資產）指的是現金與固定資產；固定資產包括土地、建物、設備與辦公室擺設。\n\n現金就是現金，價值等同於面值。現金（或說流動資產）可以讓企業得以度過難關，也可以藉由開發新產品、新市場從內部擴張，或從外部收購其他公司來成長。\n\
    \n不過，固定資產很難評估。如果有人付錢買下這些資產，或這些資產增值了，就會為企業注入一股強心劑。比如華爾格林公司（Walgreens）就擁有高價值的藥房，而且大部分是很久以前就買下來的。華爾格林公司在美國是最大的連鎖藥房，擁有\
    \ 7500 家連鎖商店；大部分的店面位於路口黃金地段，也因此為華爾格林公司帶來競爭優勢。\n\n不過，企業資產也可能帶來負面效應，所以要看看資產的種類與品質。航空公司的飛機或車廠生產線等資產都必須時時升級，而且所費不貲。如果是無法使用、設備破舊、效率低落的工廠，或必須用超低價才能賣掉的存貨，這種硬資產的品質就有待商榷了。\n\
    \n第二種資產就是無形資產，或稱軟資產，因為這種資產不可捉摸，也就更難衡量價值。無形資產包括商譽、專利、商標、執照、廣告成本，還有其他無形的資源。這類資產很難定價，卻可能是企業最重要的部分。Google、可口可樂與麥當勞都是全球知名的品牌，這些名字也為他們帶來競爭優勢；這些無形資產的成本甚至很低。比如\
    \ Google 一直都沒打過廣告，也幾乎沒花錢推廣自己的服務。Google 在搜尋引擎界的驚人市占率來自口耳相傳，完全不需花一毛錢。同時，Google 也擁有優質的有形資產（現金與低成本的運算中心）與無形資產（品牌、優秀的員工與創意無限的服務）。\n\
    \n## 計算淨值\n\n淨值其實就只是資產減去負債，不過什麼是資產，什麼是負債都還有爭議。要算出淨值，必須先找出資產合計的總額，然後減去無形資產、負債、還有優於普通股的股票。所得出的金額，就是買下整間公司要付出的金額；或者你也可以從這個數字出發，思考要花多少錢買下這家企業。要計算每股淨值，就將這個數字除以「流通在外的股數」。\n\
    \n> 要衡量波克夏公司每年成長多少，最理想的標準是每股的內在價值變化。不過，這個價值根本無法精確計算，所以我們只好用別的標準代替，那就是：每股淨值。$^{61}$\n\
    >\n> 華倫·巴菲特\n\n譬如，如果一家公司的資產有 20 億美元，負債有 16 億美元，淨值就是 4 億美元。如果這家公司流通在外的普通股有 2000\
    \ 萬股，每股淨值就是 20 美元。葛拉漢認為，價值型股票的售價應該是有形資產淨值的 1.2 倍；當然，價格越低越好。因此，葛拉漢不會花超過 24 美元買這家公司的股票。這樣的股票很難出現在正常的市場裡；不過，當股市動盪不安時，就會出現這樣的投資機會。\n\
    \n只要看到算式裡出現「流通在外的股數」，就一定要仔細檢視企業的財務報表，連「附註」(footnotes) 也不能放過；如此一來，才能確定全部股票（包括所有的股票選擇權與其他可轉換股票）都包含其中。股東權益會受到所有未清償債務的稀釋；如果沒考量到這點，這類計算就毫無意義。\n\
    \n## 淨值的優點\n\n淨值經過時間的考驗，可以反映企業的優勢與其對投資人的價值。\n\n常有人批評，淨值不過是對過去資料的分析，與未來的表現關係不大，應該是獲利能力比較重要吧！的確，這樣講不無道理。畢竟，資產有時很難估價，有時帳價與實際價值並不相符。不過，淨值就跟許多其他保守的指標一樣，在困境中更顯價值。當成長已不復見，穩定性便成了救命仙丹。\n\
    \n近年來，股價往往是淨值的 3 倍。尤其在 2007 年市場修正之前，股價淨值比常常高得嚇人。2007 年，亞馬遜（Amazon）的股價淨值比竟然高達 64。波音公司的股價淨值比也有\
    \ 13，蘋果（Apple）與微軟的股價淨值比也有 8.7。可以說，這些股票都太貴了。\n\n2009 年中，一位《霸榮週刊》(Barron's) 的作家撰文指出，波克夏公司的股價淨值比已來到\
    \ 1.2，正是買進的好時機，因為波克夏的股價淨值比通常落在 1.6 到 1.8 之間。當時，波克夏的股價為 8 萬 5000 美元，相較於 2007 年每股\
    \ 14 萬 9000 美元，可說跌了不少。⁶² 如果是葛拉漢，一定會考慮買進這檔股票。2009 年，波克夏公司的淨值增加了 20%，來到 8 萬 4437\
    \ 美元，股價漲到 12 萬 2420 美元，將股價淨值比拉到 1.4。顯然，《霸榮週刊》當初分析沒錯。\n\n## 淨值的缺點\n\n金融界所有的公式、比例指標都不是完美的，淨值當然也不例外。如果是固定資產比例較高（偏向工業）的企業，淨值就比較能準確衡量其價值；不過，如果一家企業的主要資產是智慧財產、商譽還有其他軟資產，淨值就容易失準。資本密集的產業往往股價淨值比較低，因為這些產業每單位資產創造的獲利較低。相對的，依賴人力資本的行業往往能創造較高的資產獲利，股價淨值比也較高。大部分的情況下，相較於很傳統、很穩定的公司，投資人比較能接受成長型企業有較高的股價淨值比。不過，一般來說，有形資產還是比智慧財產或人力資本來得穩當。\n\
    \n## 股價淨值比\n\n淨值常拿來與股價做比較。股價淨值比顯示，在最壞的情況下，股價的底線在哪裡。如果一家企業自願清算或不得已申請破產，淨值就是清償債務後可以分給股東的部分。如果一家公司的股價淨值比為\
    \ 1，表示投資人可以拿回原本全部投資進去的錢（不過前提是，資產可以以淨值賣出）。股價淨值比越高，在償還債務後，也就沒有剩餘的錢來還給股東。\n\n## 債務陷阱\n\
    \n如果要說我們在 21 世紀的前 10 年學到了什麼教訓，那大概就是借錢要小心，而且千萬不要借過頭。不管對個人還是對國家來說，企業債務就是負債，債務的利息也是一筆費用。\n\
    \n借款可以幫助企業清償債務，穩定原本失衡的現金流，並加速成長。幾乎每家公司的資本結構都有借款；借款也讓管理團隊得以開發新產品、建立新設施，並且將觸手伸入新的市場。可是如果不謹慎運用，債務就會拖累資產與獲利，也可能拖垮整間公司。破產法院的設立，用意在讓公司可以暫時不用面對債權人，直到重新振作；如果不行，也可以用最公平的方式償還債務。生意不好時，無負債的公司也許會關門大吉，但不至於破產。關於企業清償債務的能力，請見下一章關於「稅前息前折舊攤銷前獲利」（Earnings\
    \ Before Interest, Tax, Depreciation and Amortisation, 簡稱 EBITDA）的討論。\n\n## 債券評等失去公信力\n\
    \n發行債券是政府與企業借錢的一個方法。長久以來，公司債券的評等是企業還債能力的指標。如果公司有違約風險，評等就較低，也就是在借錢時必須承諾付出更高的利息。評等高的公司可以輕易借得錢，付的利息也較低。\n\
    \n幾十年來，主要的債信評等機構，如標準普爾（Standard & Poor's）、穆迪（Moody's）還有惠譽（Fitch）都受人信任，其債券分析也極具公信力。股市投資人可利用這些主要債信評等機構的報告，判斷一家企業穩不穩定。\n"
