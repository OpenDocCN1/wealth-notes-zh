    # **第 7 章**


    # 唯一重要的成長率：獲利


    > 價值投資法其實只是基礎經濟學：要用邏輯思考你在做什麼；不要感情用事，想想怎麼做比較有道理。68

    安德魯·韋斯（Andrew Weiss）

    韋斯資產管理公司創辦人'
  - '[PAGE 117]


    損益表跟資產負債表一起參照，讓投資人更容易看出是什麼帶動公司成長。資產負債表是公司營運狀況的靜態表現，可說是某一個時點的「照片」；相對的，損益表展現這個公司的活力。損益表（profit
    and loss statement，或稱 earning statement）代表公司的動態。將資產負債表與損益表放在一起，再參照保留盈餘（retained
    earnings）與現金流量表，就可以從多面向檢視公司的營運情形。如此一來，企業的結構與動能就能一目瞭然。


    如果一家公司很努力，每年都帶來穩定所得 (income)，對股東來說當然是好資產。不過，如果這些所得並未隨著時間增加，這家公司的價值就沒有成長。彼得．林區就說：「唯一真正重要的成長率是：獲利」。⁶⁹


    # 損益表的祕密


    比爾．蓋茲（Bill Gates）曾說，做生意其實沒那麼難，只要知道自己賺多少錢，扣掉成本，就可以知道營運狀況。這樣說是沒錯，但如果是一間結構複雜的大型公司，會計帳目就會很複雜。


    企業必須賺取足夠所得來支付營運成本、償還債務；扣除給付的股利後，剩餘的錢再投入公司的營運，以促進未來的獲利成長。投資人當然也希望自己可以分享到成長的果實，而分享果實的方式有兩種，一種是分得股利，另'
  - '[PAGE 118]


    一種是靠股價上漲。也因為有這樣的誘因，投資人才願意將帳戶裡放得好好的錢拿出來，買上市公司的股票。


    就像蓋茲講的一樣，損益表可以分為兩個部分：收入（revenue）與費用（expense）。「收入」包括產品或服務出售的營業額，還有任何資產交易的獲利，包括房地產、子公司、租金、利息，以及其他可以為公司帶來現金的事物。「費用」則包括生產貨品或服務的成本、經常費用（overhead
    expenses）、折舊、研發成本、稅賦，還有其他商業成本。


    # 誠實的所得報告


    管理團隊如果要對會計帳目動手腳，往住會從損益表下手；有時候，會計不只是單純地計帳，可能還會看到有心人土發揮「創意」。葛拉漢將損益表稱為「會計實驗」的實地。看財務報表時，一定要讀底下的附註，以免公司動手腳，操弄非經常性損益、子公司狀況、資產折舊，還有任何可能遞延認列費用的資訊。


    有時，所得表現強勁可能是因為賣出某項資產，如賣出房地產或某生產線。這樣不能算是操弄財報，但如果公司是用這種意外之財來支付平常的支出，那就不好了。這種一次性事件只有在幾種情況下才對投資人有利的，那就是當這些錢用來：'
  - '[PAGE 119]


    +   - 穩固資產根基，如生產設施升級。

    - 降低債務比例，因而減少營運成本。

    - 刺激未來的獲利成長。


    所幸，即使對損益表動手腳，往往也只會影響當年或短期的獲利。到最後，紙總是包不住火的。


    # # 誠實的數字調整


    有時，公司根本上有些東西會「沖銷」或「打銷」，這不見得違法。這種數字調整對投資人有幾個好處。譬如，如果某項借款確定收不到了，或某些資產變得一文不值（如因新設備的出現，所以舊設備的價值大不如前），那麼在會計帳目上調整這些數字對投資人比較好，因為這樣一來投資人比較能看到公司真正的營運情況。


    有時，投資人可能過度反應，看到企業的營收暫時受創或股價下跌就驚慌失措，這時聰明的投資人就會利用機會逢低買進。不過要注意，企業管理團隊有時會故意將沖銷項目留起來，在獲利不佳時再認列。這樣一來，這些壞消息通通一次發作，就不會抵銷之後旺季的好表現。常常在沖銷之後的會計期間，獲利會往上衝。這樣的獲利成長讓一些人心花怒放，因為這些投資人將之當作成長的趨勢，沒發現這其實只是回歸常軌。要避免這種錯誤，可以'
  - '[PAGE 120]


    小心檢視特定會計期間的數字，仔細研讀財務報表。


    檢視獲利趨勢時，別忘了比較同一季的表現，譬如比較 2009 年春季與 2010 年春季的表現。有些企業可能在聖誕節前或期間營業額大增，到了春季就銷售大減。每家公司的淡、旺季不同。譬如說，有些零售商之所以持續經營，就是在等寒假一次大豐收。有些公司是在剛開學的時候賺錢，有些公司的旺季則是夏季。


    # 關於獲利


    為了避免被短期假象的誤導，要看損益表 7 到 10 年的數字。巴菲特甚至說，他有時會看過去好幾十年的數字，這樣一來，什麼是趨勢、什麼是短期現象就很清楚了。將這些數字平均起來，找出常態的營業額、所得和費用。時間拉得越長，越能準確衡量企業表現。葛拉漢特別強調長期觀察的重要。他說：「（營運）穩定性要從過去
    10 年的每股獲利趨勢來看，並與最近 3 年的數字相比。如果沒有下跌，就代表穩定性百分之分。」 $ ^{70} $


    他也提醒學生要看獲利的性質、品質以及可預測性。


    損益表最好從以下三方麵來看：


    +   ・ 會計角度：這些獲利是不是有效的獲利？是不是準確反映公司的狀況？'
  - '[PAGE 121]


    +   * **企業角度**：過去的表現不見得能準確預測未來的表現，不過至少提供一些線索。損益表是不是展現公司活力、展現成長動能？

    * **投資角度**：這些資訊對股價的意義是什麼？


    # ## 成長指標


    葛拉漢認為，一家公司成長的指標是：


    +   * **獲利在最近 10 年翻了 1 倍，而且**

    * **最近 10 年來，下跌超過 5% 的次數不超過 2 次。**


    這兩個條件代表公司營運的穩定性；不過，要注意光是有穩定性還不夠。就跟檢視資產一樣，我們也要找出公司確實正在成長的證據。


    彼得·林區指出：「一家公司增加獲利的方法有 5 種：降低成本、提高價格、擴大市場、對原有市場賣出更多產品，以及重新強化、關閉或放棄虧損的部分。」


    # ## 銷售收入


    價值投資者的目標是找到財務體質健全的公司，而'
  - '[PAGE 122]


    且這種公司的銷售收入與獲利應該要比競爭對手成長得更快，也比整體經濟成長更快。一般來說，股價上漲的速度大約與銷售收入的成長速度相同。如果是主要產業的龍頭公司，銷售收入年成長率應該有
    5% 到 7%。如果是成長型公司，銷售收入應該成長更快。投資組合裡包含的企業，平均年銷售收入成長率應有 10%。不過，不是每間公司每年都可以達到這樣的目標。有些產業（如房地產）往往有其產業循環。颶風來襲時，某家公司的生產設備可能遭到重創，但同產業的其他公司銷售收入也許會增加，因為他們提供受災戶急需的產品與服務。雖然有增有減，不過隨著時間過去，銷售收入的平均成長率應該有所提升。


    # 營收帶來利潤


    某家公司可能有很好的產品，賣得也很好，創造許多營收。但對投資人來說，這樣還不夠，企業應該控制成本，還要有強勁的毛利率與自由現金流，不但為股東帶來獲利，還要有其他良好表現。


    獲利能力有很多指標。葛拉漢最愛用的衡量指標是「營業所得」（operating income）與「銷售收入」比例。信評機構有時是用營收（revenue）的百分比來表示來表示營業所得，不過更常見的表示方法是毛利率（proﬁt
    margin）。'
  md: '

    30多年來，信評機構在全球債市扮演了舉足輕重的角色，《金錢週刊》（Money Week）說，「穆迪、標準普爾或惠譽的背書，成了債券交易的前提。這些機構的評分等級從
    AAA，也就是信用無虞的公司，到 C 或 D 等級，也就是投機風險高或違約率高的證券（又稱「垃圾債券」），形成了資本市場的基礎。」


    只是到了上個世紀末，這些評等公司被打上了問號。 1970 年代以前，債信評等機構的營收來自投資人，而這些投資人要的是客觀的企業評等、證券評等。可是，後來卻變成發行證券的機構開始付錢給這三大信評機構，於是有人開始質疑評等不客觀。此外，信評機構也開始介入發行的過程，指點這些公司如何獲得想要的評等，好借到更多錢。於是出現批評聲音，認為這些公司常在三家主要信評機構之間「貨比三家」，選擇對自己最有利的評等。


    2001 年安隆案爆發，財經媒體發現穆迪與標準普爾給安隆的債信評等都是「投資等級」（investment grade），直到安隆申請破產的前 4 天才改變評等。


    此外，次級貸款市場的結構將金融市場推向崩潰的道路，信評機構也飽受批評。「美國次貸市場這個好例子告訴我們，濫用信評、背書常識會帶來多麼可怕的後果。」《金錢週刊》指出，「房貸市場上，有許多借款是借給低收入、經濟條件不佳的美國人；這些人多隱瞞自己真正的收入，借了超出自己收入好多倍的錢。這些房貸經過重新包裝、證券化，就变成了
    AAA 等級的證券。」


    到了 2007 年，大家開始意識到這些鬆散的債券評等根本不可靠。過度膨脹的房市開始崩跌，許多債券也紛紛違約。「最後，這些 AAA 等級的證券價值跌掉 30%，等級低一點的證券幾乎變得一文不值，許多證券的等級也紛紛遭到調降。」《金錢週刊》如此寫到。


    2010 年，美國通過金融改革法案，試圖加強規範這些信評機構；但實際上，也只能檢視企業的資產負債表，確認債務資訊是否與該公司的債信等級相符。面對這樣的情勢，投資人應該問兩個關鍵問題，而且答案應該都是肯定的：


    - 負債的程度是否在可處理的範圍？

    - 清償債務後，是否剩下足夠現金讓公司得以繼續營運與成長？


    ### 負債淨值比


    這個式子顯示投資人面對債務的能力，或者說如果公司遭到清算，企業有多少資本可以用來償還債權人。


    **負債淨值比** = $\frac{\text{負債總合}}{\text{股東權益}}$


    體質良好的公司負債淨值比應維持在 50% 上下。換句話說，每 1 美元的資本應對上 0.5 美元的債務。如果公司一切營運狀況都很好，承擔的債務比例可以到 0.55
    美元的債務對 1 美元的資本，但絕不該超過這個數字。


    ### 淨流動資產價值


    淨流動資產價值，或稱營運資金，可說是葛拉漢投資法的核心概念。


    不管在哪個營運階段，淨流動資產價值都至關重要，因為這些營運資金讓公司得以每天繼續經營下去。企業的營運階段包括一開始買進原料，完成產品，最後賣出貨品，款項入帳。企業有足夠的營運資金，就可以用現有的流動資產清償現在的金債，抵抗任何可能的困境。


    **淨流動資產價值（營運資金）** = 流動資產（現金、應收帳款、存貨）－流動負債


    如果可以，盡量買股價為每股淨流動資產價值三分之二以下的公司，這樣才表示該公司有足夠的安全邊際。


    ### 安全邊際的限制


    股價低於淨流動資產價值的公司，大多資本較小，也因此往往不受投資機構的青睞。資本小，交易量就低，很難購入較多的股份。如果投資人想取得一定的股份，可能要分好幾天才能買足想要的股數。


    股價低於淨流動資產價值的股票不容易找，尤其在空頭市場更難。不過，2008年就曾短暫出現許多股價低於淨流動資產價值的股票。只是，雖然這時市場對追求淨流動資產價值的投資人有利，還是得研究為何這些股票的價格這麼低。當企業的市值低於淨流動資產價值時，與其繼續經營，還不如結束經營或賣出資產，利潤還比較高。如果這樣做，股東就可以分享資產出售的獲利。不過，除了資本雄厚、進攻型的投資人以外，大部分的股東都不希望看到這樣的結果，最好的情況是管理團隊可以扭轉局勢，讓公司的股票更吸引人，股價也跟著上漲。


    葛拉漢建議，投資組合以低淨流動資產價值的股票為主時，應該：


    - 股票張數比一般的投資組合更多。

    - 盡力分散風險。

    - 傾向持有獲利好的公司股票。獲利能力有問題、經營策略不明的公司都應該剔除。


    拉比·納葛瑞詹在「理性之道」(Rational Walk) 的網站上寫到：「許多股價低於淨流動資產價值的股票，股權都是集中在一個人或一小群人之中。在這種情況下，如果這些核心人物的想法與我們自己的利益衝突，就很難確保公司的價值能為股東共享。例如，如果管理團隊也領公司薪水，公司的錢可能會透過薪資制度大幅流向這些人，因而影響股東的利益。因此，一定要檢視企業的管理團隊是否可以信任。」


    ### 流動比率


    另一個營運資金的標準是流動比率。


    流動比率 = 流動資產 / 流動負債


    可以看到，流動比率很直觀，可以立即反映企業的現況——也就是當下的情況。流動比率為 2（即 2 元的流動資產比上 1 元的流動負債）比較理想。企業的負債不應超過流動資產的
    50%。如果公司的存貨少，收帳也沒什麼問題，就可以負債稍微多一點；如果是大公司，現金又較不穩定，就不該這麼做。


    ### 速動比率


    速動比率又稱為酸性測試，可用來衡量企業每天的營運狀況。


    速動比率 = $\frac{\text{流動資產} - \text{存貨}}{\text{流動負債}}$


    速動比率為 1 時，代表如果所有營業活動突然停止，企業也能清償債務。聽起來這個可能性很低，不過像 911 恐怖攻擊之後，航空業便受到這樣的衝擊。當時飛機不能飛，可是薪水、設備維護、貸款給付等都還是要付，而且必須隨時準備好復工。過了
    6 個星期，美國所有機場才重新開放，恢復航班。但即使這樣，很多人還是不願搭飛機，因此讓航空業經營更加困難。這次事件重創了航空業。這種意外就是會發生，所以如果企業能夠通過流動比率與速動比率的雙重考驗，就可以讓人比較放心。


    ### 淨資產價值\*


    價值投資者喜歡跳樓大拍賣。葛拉漢很喜歡找的一種股票，是流動資產比流動負債和長期負債總合多三分之一的股票。他的學生稱為「菸蒂投資法」。這些菸蒂被壓在髒兮兮的垃圾堆下，不過還可以抽上幾口，而且完全免費。想撿便宜的投資人發現到，2007
    年末與 2008 年出現了許多機會。當時市場上有許多「菸蒂價」的公司，而且這當中並不是每家的資源都已消耗殆盡。只是，雖然股價跌到這麼低，投資人還是怕得不敢下手，直到好一陣子以後他們才重新進場。


    這種投資法的致勝關鍵在於耐心。要耐心地尋找，不斷累積出一大籃不同種類的股票。可能其中三分之一會賠錢，另外三分之一不賺不賠，但可能剩下的三分之一能幫你將所有的損失一口氣賺回來。


    **每股淨資產價值** (Net-Net Asset Value per Share) = $\frac{\text{流動資產} - \text{流動負債}
    - \text{長期負債}}{\text{流通在外股數}}$


    \* 這裡的淨資產價值 (Net-Net) 是價值投資法常用的評估工具，指流動資產－流動負債－長期負債。


    ### 財務詐欺的惡果


    2001 年、2002 年發生爆發許多前所未見的企業醜聞。這些企業包括安隆、泰科、環球電訊 (Global Crossing)；其中最大宗要屬世界通訊公司高達
    110 億美元的詐欺案。


    世界通訊是美國第二大電信業者，規模僅次於美國電話電報公司（AT&T）。在超人氣執行長柏尼·艾伯斯的領導下，世界通訊不斷併購其他電信公司，特別是買了 MCI
    通訊（MCI Communications）。1991 年到 1997 年間，世界通訊花了近 600 億美元促成 65 件收購案，這過程累積 410 億美元的債務。但即便如此，世界通訊仍是華爾街分析師與券商的最愛。


    由於世界通訊在短時間大量收購其他公司，導致服務品質下降，也造成會計部門的管理一團混亂，給了有心人士可趁之機。


    世界通訊製作財務報表時，並未確實依照美國的「一般公認會計原則」（generally accepted accounting principles，簡稱 GAAP）行事。為了製造獲利增加的假象，世界通訊運用移花接木的手法：一方面在某一季沖銷收購案幾百萬美元的債務；另一方面，又提列未來可預期的支出。這樣一來，雖然當季的虧損較大，但接下來幾季的虧損減少，製造出獲利穩定成長的假象。只要世界通訊不斷併購其他公司，就能繼續瞞天過海。只是，2002
    年美國政府不讓世界通訊收購史普林特公司（Sprint），使真相開始浮上檯面。此外，一位內部審計人員開始懷疑會計程序遭人操弄、矇騙投資人。這位查帳英雄開始暗中調查，利用晚上、週末低調搜集資料，最後向董事會的審計委員會揭發此事。後來，世界通訊在
    2002 年夏天申請破產保護，並坦承高達 90 億美元的假帳問題。


    1999 年夏天，世界通訊的股價為 64 美元。到了 2002 年 5 月，這些股票已跌得一文不值。數十億美元的市值憑空蒸發。3 年後，艾伯斯被判 25 年有期徒刑。不過，發生這種醜聞的不只世界通訊一家公司，坐牢的也不只艾伯斯一個。德能公司（Dynegy
    Inc.）、愛德發通訊、泰科與其他公司的高級主管都因為會計作帳不實而遭到定罪。


    ### 沙賓法案


    為了解決層出不窮的企業詐欺問題，美國的沙賓法案於 2002 年正式生效。這項改革法案旨在加強監管金融行為與公司治理。這項法案的影響範圍不包括未上市公司，主要針對美國上市公司的董事會、管理團隊與會計公司。這項法案催生一個類政府機關，這個機關就是「上市公司會計監督委員會」（Public
    Company Accounting Oversight Board，簡稱 PCAOB），負責監督、規範、檢查並懲戒提供服務的會計師事務所，督促會計師事務所確實查核上市公司的帳目。沙賓法案的內容也包括審計獨立、公司治理、內控評估（internal
    control assessment），並進一步加強財務資訊揭露。


    沙賓法案讓上市公司的財務變得更透明，讓股東更了解自己投資的公司。在外部審計人員的監督下，管理團隊現在必須確實做好企業內控，也確保財務數字正確無誤。法案也祭出民事與刑事責任，嚴懲不遵從的公司。


    ### 快速、簡易的財務分析公式與比率


    - 每股淨值 = $\frac{\text{資產總值} - \text{無形資產} - \text{負債總值}}{\text{流通在外的普通股股數}}$

    - 負債淨值比 = $\frac{\text{負債總值}}{\text{股東權益}}$

    - 淨流動資產價值 = 流動資產 - 流動負債

    - 流動比率 = $\frac{\text{流動資產}}{\text{流動負債}}$

    - 速動資產淨額 = 流動資產 - 存貨 - 流動負債

    - 速動比率 = $\frac{\text{流動資產} - \text{存貨}}{\text{流動負債}}$

    - 淨資產價值 = 流動資產 - 流動負債 - 長期負債

    - 每股淨資產價值 = $\frac{\text{流動資產} - \text{流動負債} - \text{長期負債}}{\text{流動在外股數}}$

    - 本益比 = $\frac{\text{股價}}{\text{每股盈餘}}$

    - 毛利率 = $\frac{\text{毛利} \times 100}{\text{營收}}$

    - 自由現金流量殖利率 = $\frac{\text{每股自由現金流量}}{\text{股價}}$

    - 現金流量折現模型 = 現值折現 = $\frac{\text{未來價值}}{(1 + \text{利率})^n}$ = 未來價值 $\times (1
    + \text{折現率})^n$


    儘管如此，還是有人批評沙賓法案太過複雜，企業要耗費許多成本來遵守這些法規，也削弱美國的國際競爭力。但相對的，沙賓法案的支持者則堅持，如果希望國內外的資金流向美國股市，就需要這樣的嚴刑峻法。


    ## 基本面


    葛拉漢與陶德告訴我們淨值、權益與低負債淨值比的重要性，也要注意其他可以衡量企業核心能力的工具。雖然接近資產價值的股價不見得能保證豐厚獲利，但至少可以做為投資的起點。


    葛拉漢也解釋道：「股票的賣點在於獲利與股利，而不是現金資產的價值——除非，真的很快就會分配這些現金資產。」


    接下來，我們來看看企業創造獲利的能力，尋找正的本益比、低廉成本、具有吸引力的產品、充沛的營業額，還有未來的獲利潛能，這些通通都可以從損益表看出來。


    ## 第 7 章


    # 唯一重要的成長率：獲利


    > 價值投資法其實只是基礎經濟學：要用邏輯思考你在做什麼；不要感情用事，想想怎麼做比較有道理。68

    > 安德魯·韋斯（Andrew Weiss）

    > 韋斯資產管理公司創辦人


    損益表跟資產負債表一起參照，讓投資人更容易看出是什麼帶動公司成長。資產負債表是公司營運狀況的靜態表現，可說是某一個時點的「照片」；相對的，損益表展現這個公司的活力。損益表（profit
    and loss statement，或稱 earning statement）代表公司的動態。將資產負債表與損益表放在一起，再參照保留盈餘（retained
    earnings）與現金流量表，就可以從多面向檢視公司的營運情形。如此一來，企業的結構與動能就能一目瞭然。


    如果一家公司很努力，每年都帶來穩定所得 (income)，對股東來說當然是好資產。不過，如果這些所得並未隨著時間增加，這家公司的價值就沒有成長。彼得．林區就說：「唯一真正重要的成長率是：獲利」。


    ### 損益表的祕密


    比爾．蓋茲（Bill Gates）曾說，做生意其實沒那麼難，只要知道自己賺多少錢，扣掉成本，就可以知道營運狀況。這樣說是沒錯，但如果是一間結構複雜的大型公司，會計帳目就會很複雜。


    企業必須賺取足夠所得來支付營運成本、償還債務；扣除給付的股利後，剩餘的錢再投入公司的營運，以促進未來的獲利成長。投資人當然也希望自己可以分享到成長的果實，而分享果實的方式有兩種，一種是分得股利，另一種是靠股價上漲。也因為有這樣的誘因，投資人才願意將帳戶裡放得好好的錢拿出來，買上市公司的股票。


    就像蓋茲講的一樣，損益表可以分為兩個部分：收入（revenue）與費用（expense）。「收入」包括產品或服務出售的營業額，還有任何資產交易的獲利，包括房地產、子公司、租金、利息，以及其他可以為公司帶來現金的事物。「費用」則包括生產貨品或服務的成本、經常費用（overhead
    expenses）、折舊、研發成本、稅賦，還有其他商業成本。


    ### 誠實的所得報告


    管理團隊如果要對會計帳目動手腳，往往會從損益表下手；有時候，會計不只是單純地計帳，可能還會看到有心人發揮「創意」。葛拉漢將損益表稱為「會計實驗」的實地。看財務報表時，一定要讀底下的附註，以免公司動手腳，操弄非經常性損益、子公司狀況、資產折舊，還有任何可能遞延認列費用的資訊。


    有時，所得表現強勁可能是因為賣出某項資產，如賣出房地產或某生產線。這樣不能算是操弄財報，但如果公司是用這種意外之財來支付平常的支出，那就不好了。這種一次性事件只有在幾種情況下才對投資人有利的，那就是當這些錢用來：


    - 穩固資產根基，如生產設施升級。

    - 降低債務比例，因而減少營運成本。

    - 刺激未來的獲利成長。


    所幸，即使對損益表動手腳，往往也只會影響當年或短期的獲利。到最後，紙總是包不住火的。


    ### 誠實的數字調整


    有時，公司根本上有些東西會「沖銷」或「打銷」，這不見得違法。這種數字調整對投資人有幾個好處。譬如，如果某項借款確定收不到了，或某些資產變得一文不值（如因新設備的出現，所以舊設備的價值大不如前），那麼在會計帳目上調整這些數字對投資人比較好，因為這樣一來投資人比較能看到公司真正的營運情況。


    有時，投資人可能過度反應，看到企業的營收暫時受創或股價下跌就驚慌失措，這時聰明的投資人就會利用機會逢低買進。不過要注意，企業管理團隊有時會故意將沖銷項目留起來，在獲利不佳時再認列。這樣一來，這些壞消息通通一次發作，就不會抵銷之後旺季的好表現。常常在沖銷之後的會計期間，獲利會往上衝。這樣的獲利成長讓一些人心花怒放，因為這些投資人將之當作成長的趨勢，沒發現這其實只是回歸常軌。要避免這種錯誤，可以小心檢視特定會計期間的數字，仔細研讀財務報表。


    檢視獲利趨勢時，別忘了比較同一季的表現，譬如比較 2009 年春季與 2010 年春季的表現。有些企業可能在聖誕節前或期間營業額大增，到了春季就銷售大減。每家公司的淡、旺季不同。譬如說，有些零售商之所以持續經營，就是在等寒假一次大豐收。有些公司是在剛開學的時候賺錢，有些公司的旺季則是夏季。


    ### 關於獲利


    為了避免被短期假象的誤導，要看損益表 7 到 10 年的數字。巴菲特甚至說，他有時會看過去好幾十年的數字，這樣一來，什麼是趨勢、什麼是短期現象就很清楚了。將這些數字平均起來，找出常態的營業額、所得和費用。時間拉得越長，越能準確衡量企業表現。葛拉漢特別強調長期觀察的重要。他說：「（營運）穩定性要從過去
    10 年的每股獲利趨勢來看，並與最近 3 年的數字相比。如果沒有下跌，就代表穩定性百分之百。」


    他也提醒學生要看獲利的性質、品質以及可預測性。


    損益表最好從以下三方面來看：


    - 會計角度：這些獲利是不是有效的獲利？是不是準確反映公司的狀況？

    - 企業角度：過去的表現不見得能準確預測未來的表現，不過至少提供一些線索。損益表是不是展現公司活力、展現成長動能？

    - 投資角度：這些資訊對股價的意義是什麼？


    ### 成長指標


    葛拉漢認為，一家公司成長的指標是：


    - 獲利在最近 10 年翻了 1 倍，而且

    - 最近 10 年來，下跌超過 5% 的次數不超過 2 次。


    這兩個條件代表公司營運的穩定性；不過，要注意光是有穩定性還不夠。就跟檢視資產一樣，我們也要找出公司確實正在成長的證據。


    彼得·林區指出：「一家公司增加獲利的方法有 5 種：降低成本、提高價格、擴大市場、對原有市場賣出更多產品，以及重新強化、關閉或放棄虧損的部分。」


    ### 銷售收入


    價值投資者的目標是找到財務體質健全的公司，而且這種公司的銷售收入與獲利應該要比競爭對手成長得更快，也比整體經濟成長更快。一般來說，股價上漲的速度大約與銷售收入的成長速度相同。如果是主要產業的龍頭公司，銷售收入年成長率應該有
    5% 到 7%。如果是成長型公司，銷售收入應該成長更快。投資組合裡包含的企業，平均年銷售收入成長率應有 10%。不過，不是每間公司每年都可以達到這樣的目標。有些產業（如房地產）往往有其產業循環。颶風來襲時，某家公司的生產設備可能遭到重創，但同產業的其他公司銷售收入也許會增加，因為他們提供受災戶急需的產品與服務。雖然有增有減，不過隨著時間過去，銷售收入的平均成長率應該有所提升。


    ### 營收帶來利潤


    某家公司可能有很好的產品，賣得也很好，創造許多營收。但對投資人來說，這樣還不夠，企業應該控制成本，還要有強勁的毛利率與自由現金流，不但為股東帶來獲利，還要有其他良好表現。


    獲利能力有很多指標。葛拉漢最愛用的衡量指標是「營業所得」（operating income）與「銷售收入」比例。信評機構有時是用營收（revenue）的百分比來表示營業所得，不過更常見的表示方法是毛利率（profit
    margin）。

    '
  mdcn: '

    30多年來，信評機構在全球債市扮演了舉足輕重的角色，《金錢週刊》（Money Week）說，「穆迪、標準普爾或惠譽的背書，成了債券交易的前提。這些機構的評分等級從
    AAA，也就是信用無虞的公司，到 C 或 D 等級，也就是投機風險高或違約率高的證券（又稱「垃圾債券」），形成了資本市場的基礎。」


    只是到了上個世紀末，這些評等公司被打上了問號。 1970 年代以前，債信評等機構的營收來自投資人，而這些投資人要的是客觀的企業評等、證券評等。可是，後來卻變成發行證券的機構開始付錢給這三大信評機構，於是有人開始質疑評等不客觀。此外，信評機構也開始介入發行的過程，指點這些公司如何獲得想要的評等，好借到更多錢。於是出現批評聲音，認為這些公司常在三家主要信評機構之間「貨比三家」，選擇對自己最有利的評等。


    2001 年安隆案爆發，財經媒體發現穆迪與標準普爾給安隆的債信評等都是「投資等級」（investment grade），直到安隆申請破產的前 4 天才改變評等。


    此外，次級貸款市場的結構將金融市場推向崩潰的道路，信評機構也飽受批評。「美國次貸市場這個好例子告訴我們，濫用信評、背書常識會帶來多麼可怕的後果。」《金錢週刊》指出，「房貸市場上，有許多借款是借給低收入、經濟條件不佳的美國人；這些人多隱瞞自己真正的收入，借了超出自己收入好多倍的錢。這些房貸經過重新包裝、證券化，就变成了
    AAA 等級的證券。」


    到了 2007 年，大家開始意識到這些鬆散的債券評等根本不可靠。過度膨脹的房市開始崩跌，許多債券也紛紛違約。「最後，這些 AAA 等級的證券價值跌掉 30%，等級低一點的證券幾乎變得一文不值，許多證券的等級也紛紛遭到調降。」《金錢週刊》如此寫到。


    2010 年，美國通過金融改革法案，試圖加強規範這些信評機構；但實際上，也只能檢視企業的資產負債表，確認債務資訊是否與該公司的債信等級相符。面對這樣的情勢，投資人應該問兩個關鍵問題，而且答案應該都是肯定的：


    - 負債的程度是否在可處理的範圍？

    - 清償債務後，是否剩下足夠現金讓公司得以繼續營運與成長？


    ### 負債淨值比


    這個式子顯示投資人面對債務的能力，或者說如果公司遭到清算，企業有多少資本可以用來償還債權人。


    **負債淨值比** = $\frac{\text{負債總合}}{\text{股東權益}}$


    體質良好的公司負債淨值比應維持在 50% 上下。換句話說，每 1 美元的資本應對上 0.5 美元的債務。如果公司一切營運狀況都很好，承擔的債務比例可以到 0.55
    美元的債務對 1 美元的資本，但絕不該超過這個數字。


    ### 淨流動資產價值


    淨流動資產價值，或稱營運資金，可說是葛拉漢投資法的核心概念。


    不管在哪個營運階段，淨流動資產價值都至關重要，因為這些營運資金讓公司得以每天繼續經營下去。企業的營運階段包括一開始買進原料，完成產品，最後賣出貨品，款項入帳。企業有足夠的營運資金，就可以用現有的流動資產清償現在的金債，抵抗任何可能的困境。


    **淨流動資產價值（營運資金）** = 流動資產（現金、應收帳款、存貨）－流動負債


    如果可以，盡量買股價為每股淨流動資產價值三分之二以下的公司，這樣才表示該公司有足夠的安全邊際。


    ### 安全邊際的限制


    股價低於淨流動資產價值的公司，大多資本較小，也因此往往不受投資機構的青睞。資本小，交易量就低，很難購入較多的股份。如果投資人想取得一定的股份，可能要分好幾天才能買足想要的股數。


    股價低於淨流動資產價值的股票不容易找，尤其在空頭市場更難。不過，2008年就曾短暫出現許多股價低於淨流動資產價值的股票。只是，雖然這時市場對追求淨流動資產價值的投資人有利，還是得研究為何這些股票的價格這麼低。當企業的市值低於淨流動資產價值時，與其繼續經營，還不如結束經營或賣出資產，利潤還比較高。如果這樣做，股東就可以分享資產出售的獲利。不過，除了資本雄厚、進攻型的投資人以外，大部分的股東都不希望看到這樣的結果，最好的情況是管理團隊可以扭轉局勢，讓公司的股票更吸引人，股價也跟著上漲。


    葛拉漢建議，投資組合以低淨流動資產價值的股票為主時，應該：


    - 股票張數比一般的投資組合更多。

    - 盡力分散風險。

    - 傾向持有獲利好的公司股票。獲利能力有問題、經營策略不明的公司都應該剔除。


    拉比·納葛瑞詹在「理性之道」(Rational Walk) 的網站上寫到：「許多股價低於淨流動資產價值的股票，股權都是集中在一個人或一小群人之中。在這種情況下，如果這些核心人物的想法與我們自己的利益衝突，就很難確保公司的價值能為股東共享。例如，如果管理團隊也領公司薪水，公司的錢可能會透過薪資制度大幅流向這些人，因而影響股東的利益。因此，一定要檢視企業的管理團隊是否可以信任。」


    ### 流動比率


    另一個營運資金的標準是流動比率。


    流動比率 = 流動資產 / 流動負債


    可以看到，流動比率很直觀，可以立即反映企業的現況——也就是當下的情況。流動比率為 2（即 2 元的流動資產比上 1 元的流動負債）比較理想。企業的負債不應超過流動資產的
    50%。如果公司的存貨少，收帳也沒什麼問題，就可以負債稍微多一點；如果是大公司，現金又較不穩定，就不該這麼做。


    ### 速動比率


    速動比率又稱為酸性測試，可用來衡量企業每天的營運狀況。


    速動比率 = $\frac{\text{流動資產} - \text{存貨}}{\text{流動負債}}$


    速動比率為 1 時，代表如果所有營業活動突然停止，企業也能清償債務。聽起來這個可能性很低，不過像 911 恐怖攻擊之後，航空業便受到這樣的衝擊。當時飛機不能飛，可是薪水、設備維護、貸款給付等都還是要付，而且必須隨時準備好復工。過了
    6 個星期，美國所有機場才重新開放，恢復航班。但即使這樣，很多人還是不願搭飛機，因此讓航空業經營更加困難。這次事件重創了航空業。這種意外就是會發生，所以如果企業能夠通過流動比率與速動比率的雙重考驗，就可以讓人比較放心。


    ### 淨資產價值\*


    價值投資者喜歡跳樓大拍賣。葛拉漢很喜歡找的一種股票，是流動資產比流動負債和長期負債總合多三分之一的股票。他的學生稱為「菸蒂投資法」。這些菸蒂被壓在髒兮兮的垃圾堆下，不過還可以抽上幾口，而且完全免費。想撿便宜的投資人發現到，2007
    年末與 2008 年出現了許多機會。當時市場上有許多「菸蒂價」的公司，而且這當中並不是每家的資源都已消耗殆盡。只是，雖然股價跌到這麼低，投資人還是怕得不敢下手，直到好一陣子以後他們才重新進場。


    這種投資法的致勝關鍵在於耐心。要耐心地尋找，不斷累積出一大籃不同種類的股票。可能其中三分之一會賠錢，另外三分之一不賺不賠，但可能剩下的三分之一能幫你將所有的損失一口氣賺回來。


    **每股淨資產價值** (Net-Net Asset Value per Share) = $\frac{\text{流動資產} - \text{流動負債}
    - \text{長期負債}}{\text{流通在外股數}}$


    \* 這裡的淨資產價值 (Net-Net) 是價值投資法常用的評估工具，指流動資產－流動負債－長期負債。


    ### 財務詐欺的惡果


    2001 年、2002 年發生爆發許多前所未見的企業醜聞。這些企業包括安隆、泰科、環球電訊 (Global Crossing)；其中最大宗要屬世界通訊公司高達
    110 億美元的詐欺案。


    世界通訊是美國第二大電信業者，規模僅次於美國電話電報公司（AT&T）。在超人氣執行長柏尼·艾伯斯的領導下，世界通訊不斷併購其他電信公司，特別是買了 MCI
    通訊（MCI Communications）。1991 年到 1997 年間，世界通訊花了近 600 億美元促成 65 件收購案，這過程累積 410 億美元的債務。但即便如此，世界通訊仍是華爾街分析師與券商的最愛。


    由於世界通訊在短時間大量收購其他公司，導致服務品質下降，也造成會計部門的管理一團混亂，給了有心人士可趁之機。


    世界通訊製作財務報表時，並未確實依照美國的「一般公認會計原則」（generally accepted accounting principles，簡稱 GAAP）行事。為了製造獲利增加的假象，世界通訊運用移花接木的手法：一方面在某一季沖銷收購案幾百萬美元的債務；另一方面，又提列未來可預期的支出。這樣一來，雖然當季的虧損較大，但接下來幾季的虧損減少，製造出獲利穩定成長的假象。只要世界通訊不斷併購其他公司，就能繼續瞞天過海。只是，2002
    年美國政府不讓世界通訊收購史普林特公司（Sprint），使真相開始浮上檯面。此外，一位內部審計人員開始懷疑會計程序遭人操弄、矇騙投資人。這位查帳英雄開始暗中調查，利用晚上、週末低調搜集資料，最後向董事會的審計委員會揭發此事。後來，世界通訊在
    2002 年夏天申請破產保護，並坦承高達 90 億美元的假帳問題。


    1999 年夏天，世界通訊的股價為 64 美元。到了 2002 年 5 月，這些股票已跌得一文不值。數十億美元的市值憑空蒸發。3 年後，艾伯斯被判 25 年有期徒刑。不過，發生這種醜聞的不只世界通訊一家公司，坐牢的也不只艾伯斯一個。德能公司（Dynegy
    Inc.）、愛德發通訊、泰科與其他公司的高級主管都因為會計作帳不實而遭到定罪。


    ### 沙賓法案


    為了解決層出不窮的企業詐欺問題，美國的沙賓法案於 2002 年正式生效。這項改革法案旨在加強監管金融行為與公司治理。這項法案的影響範圍不包括未上市公司，主要針對美國上市公司的董事會、管理團隊與會計公司。這項法案催生一個類政府機關，這個機關就是「上市公司會計監督委員會」（Public
    Company Accounting Oversight Board，簡稱 PCAOB），負責監督、規範、檢查並懲戒提供服務的會計師事務所，督促會計師事務所確實查核上市公司的帳目。沙賓法案的內容也包括審計獨立、公司治理、內控評估（internal
    control assessment），並進一步加強財務資訊揭露。


    沙賓法案讓上市公司的財務變得更透明，讓股東更了解自己投資的公司。在外部審計人員的監督下，管理團隊現在必須確實做好企業內控，也確保財務數字正確無誤。法案也祭出民事與刑事責任，嚴懲不遵從的公司。


    ### 快速、簡易的財務分析公式與比率


    - 每股淨值 = $\frac{\text{資產總值} - \text{無形資產} - \text{負債總值}}{\text{流通在外的普通股股數}}$

    - 負債淨值比 = $\frac{\text{負債總值}}{\text{股東權益}}$

    - 淨流動資產價值 = 流動資產 - 流動負債

    - 流動比率 = $\frac{\text{流動資產}}{\text{流動負債}}$

    - 速動資產淨額 = 流動資產 - 存貨 - 流動負債

    - 速動比率 = $\frac{\text{流動資產} - \text{存貨}}{\text{流動負債}}$

    - 淨資產價值 = 流動資產 - 流動負債 - 長期負債

    - 每股淨資產價值 = $\frac{\text{流動資產} - \text{流動負債} - \text{長期負債}}{\text{流動在外股數}}$

    - 本益比 = $\frac{\text{股價}}{\text{每股盈餘}}$

    - 毛利率 = $\frac{\text{毛利} \times 100}{\text{營收}}$

    - 自由現金流量殖利率 = $\frac{\text{每股自由現金流量}}{\text{股價}}$

    - 現金流量折現模型 = 現值折現 = $\frac{\text{未來價值}}{(1 + \text{利率})^n}$ = 未來價值 $\times (1
    + \text{折現率})^n$


    儘管如此，還是有人批評沙賓法案太過複雜，企業要耗費許多成本來遵守這些法規，也削弱美國的國際競爭力。但相對的，沙賓法案的支持者則堅持，如果希望國內外的資金流向美國股市，就需要這樣的嚴刑峻法。


    ## 基本面


    葛拉漢與陶德告訴我們淨值、權益與低負債淨值比的重要性，也要注意其他可以衡量企業核心能力的工具。雖然接近資產價值的股價不見得能保證豐厚獲利，但至少可以做為投資的起點。


    葛拉漢也解釋道：「股票的賣點在於獲利與股利，而不是現金資產的價值——除非，真的很快就會分配這些現金資產。」


    接下來，我們來看看企業創造獲利的能力，尋找正的本益比、低廉成本、具有吸引力的產品、充沛的營業額，還有未來的獲利潛能，這些通通都可以從損益表看出來。


    ## 第 7 章


    # 唯一重要的成長率：獲利


    > 價值投資法其實只是基礎經濟學：要用邏輯思考你在做什麼；不要感情用事，想想怎麼做比較有道理。68

    > 安德魯·韋斯（Andrew Weiss）

    > 韋斯資產管理公司創辦人


    損益表跟資產負債表一起參照，讓投資人更容易看出是什麼帶動公司成長。資產負債表是公司營運狀況的靜態表現，可說是某一個時點的「照片」；相對的，損益表展現這個公司的活力。損益表（profit
    and loss statement，或稱 earning statement）代表公司的動態。將資產負債表與損益表放在一起，再參照保留盈餘（retained
    earnings）與現金流量表，就可以從多面向檢視公司的營運情形。如此一來，企業的結構與動能就能一目瞭然。


    如果一家公司很努力，每年都帶來穩定所得 (income)，對股東來說當然是好資產。不過，如果這些所得並未隨著時間增加，這家公司的價值就沒有成長。彼得．林區就說：「唯一真正重要的成長率是：獲利」。


    ### 損益表的祕密


    比爾．蓋茲（Bill Gates）曾說，做生意其實沒那麼難，只要知道自己賺多少錢，扣掉成本，就可以知道營運狀況。這樣說是沒錯，但如果是一間結構複雜的大型公司，會計帳目就會很複雜。


    企業必須賺取足夠所得來支付營運成本、償還債務；扣除給付的股利後，剩餘的錢再投入公司的營運，以促進未來的獲利成長。投資人當然也希望自己可以分享到成長的果實，而分享果實的方式有兩種，一種是分得股利，另一種是靠股價上漲。也因為有這樣的誘因，投資人才願意將帳戶裡放得好好的錢拿出來，買上市公司的股票。


    就像蓋茲講的一樣，損益表可以分為兩個部分：收入（revenue）與費用（expense）。「收入」包括產品或服務出售的營業額，還有任何資產交易的獲利，包括房地產、子公司、租金、利息，以及其他可以為公司帶來現金的事物。「費用」則包括生產貨品或服務的成本、經常費用（overhead
    expenses）、折舊、研發成本、稅賦，還有其他商業成本。


    ### 誠實的所得報告


    管理團隊如果要對會計帳目動手腳，往往會從損益表下手；有時候，會計不只是單純地計帳，可能還會看到有心人發揮「創意」。葛拉漢將損益表稱為「會計實驗」的實地。看財務報表時，一定要讀底下的附註，以免公司動手腳，操弄非經常性損益、子公司狀況、資產折舊，還有任何可能遞延認列費用的資訊。


    有時，所得表現強勁可能是因為賣出某項資產，如賣出房地產或某生產線。這樣不能算是操弄財報，但如果公司是用這種意外之財來支付平常的支出，那就不好了。這種一次性事件只有在幾種情況下才對投資人有利的，那就是當這些錢用來：


    - 穩固資產根基，如生產設施升級。

    - 降低債務比例，因而減少營運成本。

    - 刺激未來的獲利成長。


    所幸，即使對損益表動手腳，往往也只會影響當年或短期的獲利。到最後，紙總是包不住火的。


    ### 誠實的數字調整


    有時，公司根本上有些東西會「沖銷」或「打銷」，這不見得違法。這種數字調整對投資人有幾個好處。譬如，如果某項借款確定收不到了，或某些資產變得一文不值（如因新設備的出現，所以舊設備的價值大不如前），那麼在會計帳目上調整這些數字對投資人比較好，因為這樣一來投資人比較能看到公司真正的營運情況。


    有時，投資人可能過度反應，看到企業的營收暫時受創或股價下跌就驚慌失措，這時聰明的投資人就會利用機會逢低買進。不過要注意，企業管理團隊有時會故意將沖銷項目留起來，在獲利不佳時再認列。這樣一來，這些壞消息通通一次發作，就不會抵銷之後旺季的好表現。常常在沖銷之後的會計期間，獲利會往上衝。這樣的獲利成長讓一些人心花怒放，因為這些投資人將之當作成長的趨勢，沒發現這其實只是回歸常軌。要避免這種錯誤，可以小心檢視特定會計期間的數字，仔細研讀財務報表。


    檢視獲利趨勢時，別忘了比較同一季的表現，譬如比較 2009 年春季與 2010 年春季的表現。有些企業可能在聖誕節前或期間營業額大增，到了春季就銷售大減。每家公司的淡、旺季不同。譬如說，有些零售商之所以持續經營，就是在等寒假一次大豐收。有些公司是在剛開學的時候賺錢，有些公司的旺季則是夏季。


    ### 關於獲利


    為了避免被短期假象的誤導，要看損益表 7 到 10 年的數字。巴菲特甚至說，他有時會看過去好幾十年的數字，這樣一來，什麼是趨勢、什麼是短期現象就很清楚了。將這些數字平均起來，找出常態的營業額、所得和費用。時間拉得越長，越能準確衡量企業表現。葛拉漢特別強調長期觀察的重要。他說：「（營運）穩定性要從過去
    10 年的每股獲利趨勢來看，並與最近 3 年的數字相比。如果沒有下跌，就代表穩定性百分之百。」


    他也提醒學生要看獲利的性質、品質以及可預測性。


    損益表最好從以下三方面來看：


    - 會計角度：這些獲利是不是有效的獲利？是不是準確反映公司的狀況？

    - 企業角度：過去的表現不見得能準確預測未來的表現，不過至少提供一些線索。損益表是不是展現公司活力、展現成長動能？

    - 投資角度：這些資訊對股價的意義是什麼？


    ### 成長指標


    葛拉漢認為，一家公司成長的指標是：


    - 獲利在最近 10 年翻了 1 倍，而且

    - 最近 10 年來，下跌超過 5% 的次數不超過 2 次。


    這兩個條件代表公司營運的穩定性；不過，要注意光是有穩定性還不夠。就跟檢視資產一樣，我們也要找出公司確實正在成長的證據。


    彼得·林區指出：「一家公司增加獲利的方法有 5 種：降低成本、提高價格、擴大市場、對原有市場賣出更多產品，以及重新強化、關閉或放棄虧損的部分。」


    ### 銷售收入


    價值投資者的目標是找到財務體質健全的公司，而且這種公司的銷售收入與獲利應該要比競爭對手成長得更快，也比整體經濟成長更快。一般來說，股價上漲的速度大約與銷售收入的成長速度相同。如果是主要產業的龍頭公司，銷售收入年成長率應該有
    5% 到 7%。如果是成長型公司，銷售收入應該成長更快。投資組合裡包含的企業，平均年銷售收入成長率應有 10%。不過，不是每間公司每年都可以達到這樣的目標。有些產業（如房地產）往往有其產業循環。颶風來襲時，某家公司的生產設備可能遭到重創，但同產業的其他公司銷售收入也許會增加，因為他們提供受災戶急需的產品與服務。雖然有增有減，不過隨著時間過去，銷售收入的平均成長率應該有所提升。


    ### 營收帶來利潤


    某家公司可能有很好的產品，賣得也很好，創造許多營收。但對投資人來說，這樣還不夠，企業應該控制成本，還要有強勁的毛利率與自由現金流，不但為股東帶來獲利，還要有其他良好表現。


    獲利能力有很多指標。葛拉漢最愛用的衡量指標是「營業所得」（operating income）與「銷售收入」比例。信評機構有時是用營收（revenue）的百分比來表示營業所得，不過更常見的表示方法是毛利率（profit
    margin）。

