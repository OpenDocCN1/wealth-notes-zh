    ## 確切事實與價值投資法的優勢


    的確，波克夏公司是以價值投資法為依歸的控股公司，雖然某幾年的股價下跌，不過，整體而言，波克夏的表現遠勝過標準普爾 500 指數（S&P 500）。S&P 500
    指數 5 年來有 2 年呈現跌勢，但波克夏的股價只有 1 年出現負成長。波克夏的每股淨值變動不一，但過去 45 年來平均每年超越 S&P 500 指數 11.4%。到了
    2010 年初，波克夏公司的股價已經超過 12 萬 5000 美元；相較於過去 52 週的低點（每股 7 萬 9800 美元）來說，漲幅驚人。在股價最高點時，股價更高達到
    14 萬美元。


    其他價值投資者也證明這種投資法的優勢。美國個人投資者協會（American Association of Individual Investors）每年根據不同的投資理念篩選出各種投資組合。2009
    年上半年，大部分投資組合的價值呈現走跌或成長緩慢，但價值型股票的投資組合卻帶來 40.9% 的高報酬。而同樣追隨價值投資法的許羅斯，其投資組合也有 30.8%
    的報酬率，遠遠勝過成長型投資組合 19% 的報酬率與指數型 18.5% 報酬率。如果追隨價值投資法，加上特別注意成長性指標的話（第 9 章會提到），半年的報酬率就會高達
    67.1%。


    簡單來說，價值投資法的重點在於買入價值遭低估的證券，這種投資法包含基本面分析，同時追求安全邊際的概念。


    ## 葛拉漢的重要概念


    1920、1930 年代的股市表現看似毫無道理、難以預料。但葛拉漢知道，混亂的表象下有其規則。他指出，每支股票都代表真正的企業，而企業有其價值，就跟房子、馬匹或帽子有特定的價值一樣。知道買下企業的正確價格，再將這個價格除以流通在外股數（shares
    outstanding），就是正確的股價。聽起來也許是常識，但當時沒有人用這種方式投資；即使到現在，追隨這種理念的人仍是少數。


    葛拉漢在 50 年前就有先見之明，告訴投資人不要試圖預測股市走向——這樣做必敗無疑。不過，投資人的確有辦法避免損失，趁股價低迷時買進價值高的股票。


    葛拉漢鼓勵投資人自己思考、獨立行動，並且不斷問問題。經過不斷的觀察與研究之後，葛拉漢找出適用於所有投資人、經得起不同時代考驗的三大法則。


    雖然巴菲特與其他葛拉漢信徒具有驚人的分析能力，但他們仍然信奉這三大法則：正確的態度、尋求安全邊際與估算內在價值。我們會在第 2 章進一步探討這些法則。


    的確，大部分的散戶已經不知道要如何計算、甚至估算股票真正的價值（也就是內在價值）。最近的金融危機也無可避免地會持續發酵。可以說，一則以喜，一則以憂。


    憂的是：

    - 聯邦政府可能會繼續持有特定公司的資產，而且持續好一段時間。

    - 資本所得稅率可能提高。

    - 政府會針對特定產業加強監管。

    - 通膨加劇。


    喜的是，股東可能可以：

    - 影響高階主管的薪資。

    - 更專注於保本。

    - 有效地管理負債。

    - 找到更新、更好的方法監管自己的財富。

    - 更知道什麼行為可以視為詐欺。


    以下要介紹的趨勢可以說勢不可擋。不過投資人也會發現，走出眼前的困境後，我們面對的是更加全球化的經濟，科技與金融活動的影響也將變得不可分割。


    ## 是的，時代在改變


    從葛拉漢的時代以來，已經發生許多變化；進入 21 世紀後，這些變化不但持續發展，而且速度越來越快。


    我們正處於快速轉變的時期：從國家經濟過渡到全球經濟，從實體世界跨越到電子與網路的世界。從重工業轉到智慧財產導向，讓投資人不斷思索。人、貨品與服務的流通依然重要，但我們也必須檢視科技在這些領域的衝擊；想一想，現在這麼多物資都經由電子形式買賣、遞送，就必須更認真思考科技與我們的關聯。全球革命與數位、通信、網路革命都彼此緊密相連，也為個人、政府、企業，特別是為投資人創造無國界的世界。我們現在面臨的困境並不是什麼新鮮事，眼前的處境其實就跟之前人類經歷過的種種科技革命一樣：像是
    1840 年代的鐵路、1900 年代初期的汽車、1920 年代的收音機，還有 1950 年代的電晶體一樣。


    雖然許多事物日新月異，但仍有很多東西依舊不變，尤其是投資市場的行為其實還是一樣：金融市場依然充斥人云亦云的景象，我們身邊依然充滿狂熱的投資大眾，匯率波動依舊令人憂心，黃金依然牽動人們的情感與文化。


    我們面臨許多極具挑戰性的問題：我們如何利用資本主義的力量，又不受其害？我們可以從哪裡賺錢？下一個帶來巨變的想法在哪裡？要把錢放在哪裡才安全，才不會虧本，也不受通膨影響？


    ## 班傑明·葛拉漢傳奇：從困境中學習


    班傑明·葛拉漢成長在科技與社會劇烈變化的時代，也是市場動盪不已的時代。電話、汽車和電力才發明不久，正要開始普及；人類已經可以搭飛機進行空中旅行。但除了這些改變以外，1929
    年股市崩盤也對他的人生造成重大衝擊。


    1894 年，葛拉漢出生於倫敦；在他還是小嬰兒的時候，全家就移民紐約。不久後，他的父親去世，留下母親獨力扶養三個兒子。他們家境貧窮，還好葛拉漢聰明又認真，後來拿到哥倫比亞大學的獎學金。進入大學就讀後，葛拉漢在語言、數學與哲學課程的表現都很傑出。他原本以為自己會成為教授，但畢業時老師卻安排他到投資公司上班。1914
    年，第一天到公司上班時，他對華爾街可說是一無所知。


    很快地，歐洲陷入戰亂，而歐美股市也大受打擊。紐約證券交易所（New York Stock Exchange）關閉長達 4 個多月，但實際的交易並未停止。當時，證券交易所外出現所謂的「排水溝市場」（gutter
    market），這可以說是股票買賣的跳蚤市場；顧名思義，這些股票交易可說是在排水溝裡進行—暗無天日。等到紐約證券交易所重新開張，交易量不斷狂飆。1917 年
    3 月 17 日美國開始參戰；同年 11 月，股市已重挫 31%。「看起來就像世界末日到了，」1975 年葛拉漢接受《富比士》訪問時如此形容，「可是 1 年後，股市再度恢復旺盛買氣。」³


    很快地，葛拉漢掌握華爾街的生存法則，並且以創新方法幫客戶賺錢。到了 1920 年代，他已經獨當一面管理資產，可說事業有成，也充滿自信。


    只是，好景不常；1929 年秋天，悲劇發生了。葛拉漢的女兒還記得，當時全家不得不從紐約公園大道（Park Avenue）上的豪宅搬到便宜的小房子。儘管葛拉漢很有能力，但還是沒辦法挽救客戶日漸縮水的財富。葛拉漢與夥伴傑瑞·紐曼（Jerome
    Newman）之後連續 5 年不領薪水，才讓客戶的財產慢慢回復。


    在那幾年的困境中，葛拉漢開始在哥倫比亞大學教授投資課程補貼家用。他請一位金融學教授大衛·陶德（David Dodd）到他的課堂上記錄上課內容；1934 年，這些筆記集結成《證券分析》，於是第一本價值投資法的書就誕生了。這本書早已成為經典之作，許多投資人正是靠著這本書的指引，才得以度過許多危機。


    葛拉漢剛開始寫作、教書時，並沒有用特定的名詞來形容這些投資概念。他的想法很簡單，就是用有邏輯、基於事實的投資方法來面對股票與股票代表的公司。


    葛拉漢—紐曼公司（Graham Newman Corporation）度過 1929 年的金融危機後，葛拉漢從此不曾讓客戶損失一毛錢。30 年來（包括歷經大蕭條、兩次世界大戰的危機），葛拉漢的客戶平均每年報酬率為
    17%；這還不包括來自他旗下的「公務員保險公司」（Government Employees Insurance Co., 簡稱 GEICO，為波克夏公司的子公司，主要提供車險服務）的獲利。我們後面會再提到這家「公務員保險公司」的情況。


    葛拉漢在 1956 年退休，並將許多客戶轉介給當時年輕但充滿熱情與才能的巴菲特。這些葛拉漢的客戶就變成波克夏公司早期的投資人；直到現在，這些人的子孫輩有許多人仍持有波克夏公司的股票。葛拉漢於
    1976 年去世，死於法國南部艾克斯（Aix）的第二個家，享年 82 歲。


    ## 未來的方向


    在接下來幾章裡，我們會討論以上這些問題，以及其他更多的議題。在第 2 章與第 3 章中，我們會討論價值投資法的概要，並在之後的章節中討論這些基本的價值法則，檢視這些法則該如何作用與修正，來應用到現今的經濟環境。


    葛拉漢冷靜、理性地修正、運用價值法則，面對所有不同的經濟景況。他將這些法則應用到所有的證券上，包括優先股（preferred stock）、地方政府債（municipal
    bond）、公司債（corporate bond）還有共同基金。每一種投資類別都可以寫成一本書，但本書只討論與價值投資法相關的部分。我們主要把焦點放在普通股（common
    stock），也就是最容易獲得企業股權的方式；不過，我們也會與其他投資類別做比較。


    # 第 2 章


    # 21 世紀的價值投資法


    成功投資的關鍵，在於運用常識。


    約翰·伯格

    先鋒共同基金集團創辦人暨副執行長


    要說明葛拉漢的投資心法，最佳例子就是巴菲特這名得意門生了。金融危機爆發前幾年，許多評論家說巴菲特已經失去光環，他的波克夏公司表現也大不如前。2009 年初，著名避險基金經理人道格拉斯·卡斯（Douglas
    Kass）甚至宣稱，巴菲特的好日子已經結束了。⁵


    但就像第一章所說，雖然波克夏的規模變得如此龐大，依然能維持亮麗的表現。也就是說，這些只想快速致富的人再次低估巴菲特的能耐。沒過幾個月，這些評論家就發現，原來巴菲特憑著耐心準備好資金，準備逢機入市。他借一大筆錢給高盛（Goldman
    Sachs），年報酬率為 10%，另外還獲得選擇權，未來可以用每股 115 美元買下 4350 萬股的高盛股票；不到 1 年，高盛的股價已經漲到 170 美元。此外，他也出手援助奇異電子（General
    Electric）、瑪氏食品（Mars），還有陶氏化學（Dow Chemical），當然，這些都是用對股東有利的價格買進。同時，他更加碼富國銀行（Wells
    Fargo）、美國銀行公司（U.S. Bancorp）、BNSF 鐵路公司與其他控股公司。儘管巴菲特持續做出專業投資人不甚苟同的事，2009 年卻是他 60
    年投資生涯中獲利最高的年份之一。


    ## 價值投資 VS. 技術分析


    價值投資運用的是基本面分析，與技術分析的關係不大。技術面分析比較抽象，技術分析師也從不用「企業對股東的價值」來估算股票的價值，而是用市場活動相關的統計數字、圖表與其他工具找出交易的規律、預測未來的走勢。技術分析師相信過去表現是未來股票走勢的指標，他們研究市場週期、交易模式、交易量和其他數據，就好像用水晶球來窺見未來的股價波動一樣。


    投資百科網站（Investopedia）解釋這兩種分析的不同：在購物中心裡，基本分析師會跑進每一家店，研究販售的產品，再決定要不要買。相對的，技術分析師會坐在購物中心的椅子上，看著人走進店裡，不管店家產品的價值是多少，技術分析師只從顧客走進店家的行為找出規律，並以此做出決定。⁶


    某種程度而言，現代的價值投資者結合技術與基本分析；價值投資法同時兼顧定量分析與定性分析。就葛拉漢的概念來說，量化分析（定量分析）比質化分析（定性分析）重要。不過，他也知道，量化分析的要素有時會影響安全邊際，甚至在情況裡變成主角。在類似的股票間做選擇時，質化分析往往可以提供資訊，選出較偏好的企業股票。


    上一章提到，廣義來說，價值投資者抱持正確的態度、找出證券的內在價值，並用可帶來適當安全邊際的價格買下這些證券。


    ## 正確的態度


    價值投資者認為，投資不是投機，而是根據資訊來制定策略。價值投資者會觀察交易所上市的企業，然後以買下整間企業為前提，加以全盤研究。


    價值投資者了解市場的波動，但不會炒股票。他們知道股價會不斷變化，但會將這樣的變化當做買低賣高的機會；這部分會在第 4 章詳述。


    馬力歐・蓋伯里將這個概念進一步推展，成為他口中的「分拆市場價值」(private-market value)。所謂的「分拆市場價值」就是「內在價值」再加上額外的「控制權溢價」(control
    premium)。蓋伯里的公司所管理的客戶資產有 300 億美元，並且為投資人帶來 19.3% 的年複合成長率。


    巴菲特也常說類似的話：「《智慧型股票投資人》第 8 章的內容，勝過其他所有教科書的全部內容。重點是抱持正確的態度，不是靠高超的技巧或微積分，而是從根本的正確態度出發。這不需要碩士學位，但要好好認真研究。」


    葛拉漢告訴我們，價值投資就是找尋價格低於內在價值的證券，買下並持有，直到出現非賣不可的理由再賣掉。


    葛拉漢寫到：「所謂的投資，就是藉由徹底分析，保證拿回保本與適當的報酬。如果達不到這些標準，就只是投機。」


    - **保障本金**：如果投資的企業財務狀況良好、擁有高品質的 Management 團隊，那麼你的投資就相對安全。

    - **適當報酬**：由於未來的報酬基於企業獲利，適當報酬要仰賴企業現在與未來的展望。企業目前的獲利如何，未來的賺錢潛力又有多少？所有（潛在與實質）的報酬加起來，必須勝過其他安全投資的報酬。


    ### 內在價值


    「內在價值」這個詞並非葛拉漢首先提出。早在 1848 年，就有人把這個詞用在公司股票的說明上。投資專家威廉・阿姆斯壯（William Armstrong）寫到，內在價值是決定股價的重要因素。只是，阿姆斯壯並不認為內在價值是唯一因素。


    內在價值可能難以估量、時時變化。不同的分析師用不同的標準衡量，我們在之後的章節也會一一檢視這些標準。譬如葛拉漢最愛用的分析工具是淨流動資產價值（net current
    asset value）。尋找內在價值的過程會得到很多資訊，資產負債表（balance sheet）可以顯示投資的安全性，損益表（income statement）則有公司未來成長的線索。


    巴菲特曾說：「內在價值才是真正的關鍵。雖然內在價值難以精確估算，但這個數字很重要，必須審慎評估。」巴菲特還說：「我們對內在價值的定義，是一家企業在結束營運前可以拿出來的現金折現值。」「換句話說，巴菲特的投資決定是基於企業未來的賺錢能力，並視通膨程度加以調整。」


    股票的內在價值會受到不同因素的影響，包括（不幸地）資產價值下跌，或是（幸運地）股價上漲。葛拉漢特別提醒投資人，不可能知道什麼時候股價會達到或超越內在價值，只要知道總有一天會發生這件事就好。當你持有的股票市價已經超過內在價值，或是其他股票的投資報酬率更高的時候，就是賣出的時機。市場因素並不會左右你的決定，但也不能完全忽視。


    看起來，似乎大多數的散戶（包括認真學習投資理財的學生）都再也無法正確評估股票的真正價值（也就是內在價值）。金融市場的環境已經完全不同：會計原則變得如此繁複；市場上出現許多更新、更複雜的證券商品；網路則提供許多便利可得的資訊，讓交易得以在彈指間完成。此外，全球經濟出現新的變化，歐盟誕生，還有亞洲和以前被視為第三世界的新興國家崛起。


    不過，在這裡先深呼吸，冷靜下來。其實，企業仍然是企業，過去的經驗、西方文化的法則到現在一樣適用。政治情勢、法規、稅法或許在改變，但一樣可以找到基本的正確規則；即使是在現今的世界裡，2+2
    依然等於 4。


    ## 安全邊際


    拉比・納葛瑞詹 (Ravi Nagarajan ) 寫到：「我沒看到幾個經濟學家可以準確預測總體經濟的變化，也沒看過幾個股市分析師精準預測到主要股市將大跌
    50%。當然，我當初也沒想到股市會一片哀鴻遍野，也不認為自己有能力預測明年此時的道瓊工業指數或 S&P 500 指數。與其試圖猜測未來經濟或市場的走向，不如找一找哪些股票擁有較高的安全邊際。」⁸
    安全邊際就在那些你想買賣的股票中。


    在價值投資法的討論中，常常會出現「安全邊際」這個詞。這個概念很簡單：如果你買一間房子的價格低於市價，或低於其他相同大小、相同種類的房價，那你承擔的風險就比較小。如果你需要賣房子，就比較有機會用相近或甚至較高的價格賣出。同樣地，用折扣價買車和買股票也一樣。價值投資者找的是好買賣，也就是價格低於實際價值的股票。買進價格與實際價值的落差，就是所謂的安全邊際。


    有許多不同的方法可以找出安全邊際，葛拉漢主要從以下三個地方找：

    - 資產評估。

    - 獲利能力分析。

    - 多樣化投資。


    查爾斯・道（Charles H. Dow）是《華爾街日報》的創辦人與編輯。他因為研究股市變化、發明道氏理論（Dow Theory）而聲名大噪，更不用說他創辦的道瓊公司（Dow
    Jones）以及許多以他為名的指數。


    不過，就投資理念來說，他與葛拉漢其實差異不大。道氏常對讀者說，股價的波動是由於投資人對企業未來獲利的預期心理所造成。


    1900 年 5 月，道氏寫到：「最萬無一失的做法，就是假設長期下來『價值』終究會決定『價格』。價值與現階段的波動無關。好股票、壞股票都可能一下子漲 5%，可是長期下來，好的股票終究會反映出本身的投資價值，不好的股票也會像賭博一樣最後不支倒地。”


    「道氏剛開始工作時是調查記者『專跑財經線』。理查・羅素（Richard Russell）解釋。理查・羅素是《道氏理論通訊》（Dow Theory Letters）的編輯，他說：「1885
    年（很少有人意識到這點），道氏加入紐約證券交易所，也因此讓他有機會親身觀察市場機制。1889 年，道氏開始發行名為《華爾街日報》的小刊物。1899 年至 1902
    年間，道氏寫了一系列的評論與專欄，其中有許多公認是經典之作。一百年過去了，這些評論文章依然受用，絲毫不減當年的價值。”


    道氏理論是一種擇時法（market timing），利用特定的市場變化找出買進、賣出的訊號。根據這套理論，當大家開始出現相同的行為時，就代表這些訊號得到確認。


    不過，雖然道氏理論曾經成功預測市場走向，但長期看來並不可靠。葛拉漢的研究指出，在 1938 年到 1968 年的 30 年間，道氏理論的擁護者如果直接買進、持有道瓊工業指數包含的公司，獲利反而高出許多；這也是為什麼後來出現指數型基金的原因之一。


    1898 年道氏成為《華爾街日報》的主要股市專欄作家，但僅短短 4 年後便與世長辭。以他這麼短的財經新聞經歷來看，他對投資界的影響不可謂不大。


    這些並不是找出安全邊際的唯一辦法。安全邊際也反映在企業穩固的營運資金、充足的現金流裡，甚至從長期穩定的股利發放表現也可以當成指標。


    因為自身的股市經驗，讓葛拉漢不斷強調安全的重要。塞斯·克拉曼跟股東解釋，保持警覺是安全的關鍵要素。「一定要隨時隨地準備面對意外變化，知道如何應對市場與經濟忽然重挫的局面。」克拉曼說，「不管你預期的局面再怎麼慘烈，實際情況可能還會更糟。」¹¹


