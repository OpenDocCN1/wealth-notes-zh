    \ Martell），也感謝我的編輯考特尼・楊（Courtney Young），還有企鵝集團／投資組合出版社（Portfoli o/Pengui n）的馬修・波茲（Matthew\
    \ Boezi）與艾莉莎・阿梅爾（Alissa Amell）的幫忙，讓本書得以順利出版。\n\n最重要的是，請各位盡情享受本書的精彩內容。投資這門學問其實很有趣，應該讓人樂在其中、享受過程。\n\
    \n珍妮・羅溫  \n於新墨西哥州聖大非市  \n（Santa Fe, New Mexico）"
