    \ asset value）\n\n「流動資產」與「流動負債」之間的差異。\n\n## 淨利（net income）\n\n一家公司的「企業所得」減去所有費用支出後剩下的金額。\n\
    \n## 淨資產價值（net-net）\n\n資產減去流動負債，再減去長期負債。\n\n## 營業所得（operating income）\n\n企業正常營運的所得減去費用支出，不過這是尚未課稅的數字。\n\
    \n## 過度交易（overtrading）\n\n投資人過度融資、融券進行大量交易，超過本身能夠負荷的範圍。\n\n## 帳面盈虧（paper profit/loss）\n\
    \n一檔證券目前的價格與當初買進價格之間的差異。因為投資人還持有這檔證券，所以這只是帳面上未實現的盈虧。\n\n## 票面價值（par value，或簡稱面值）\n\
    \n表示一家公司發行股票最初的價格。不過，面值不見得就是當初股票上市的股價。\n\n## 投資組合（portfolio）\n\n投資人或投資法人所持有的投資部位。\n\
    \n## 本益比（price-to-earnings ratio，或稱 P/E 比）\n\n顯示購買某檔股票時，為了得到每 1 美元的獲利必須付出的金額。本益比的算法為「股價」除以「公司過去\
    \ 12 個月的每股獲利」。如果某檔股票的股價為 26 美元，每股獲利為 2 美元，本益比就是 13 倍。本益比又稱為「倍數」（multiple）。\n\n\
    ## 主要走勢（primary movement in the stock market）\n\n市場大幅上漲的趨勢，期間會出現稍微的跌勢（請參考次要走勢）。查爾斯·道認為，主要走勢的強度很難預測，甚至可以说無法預測。\n\
    \n## 程式交易（program trading）\n\n同時買賣一組股票，而非一次只買賣一檔股票。根據紐約證券交易所的定義，程式交易是指一次交易 15\
    \ 檔以上的股票，而且總交易金額超過 100 萬美元。通常，交易人下的交易單會直接從自己的電腦進入交易機構的電腦系統，並自動成交。指數套利就是一種程式交易。\n\
    \n## 募資說明書（prospectus）\n\n說明待售證券或共同基金的詳細資料。一般來說，美國證券交易委員會必須先核准這份文件，企業才能首次公開發行股票。\n\
    \n## 代理委託書（proxy）\n\n授權給他人（通常為企業管理團隊）的文件，讓委託人有權代表自己（通常為股東）的股份投票。\n\n## 拉高倒貨（pump\
    \ and dump）\n\n常見的股票投資詐欺手法，常見於網絡上。通常是某家公司發布不實新聞，吹捧自己的財務狀況、新產品或其他創新成就。不實新聞中會引用看似中立的消息誤導大眾，讓人以為這家公司是最新的當紅炸子雞；各個新聞版面也會有類似的訊息，勸大家趁買得起的時候趕快買。於是，投資人就買了這些股票，股價也就一如預料地上升。接著，內部人士或幕後的詐騙集團立刻賣出所有持股（所謂的「倒貨」），獲利了結。於是，股價下跌，不知內情的投資人只能自認倒楣。\n\
    \n## 賣權（put）\n\n即「賣出選擇權」（put option）。賣家有了賣權合約，就可以在某特定日期之前，以特定價格賣出特定股數的股票。購買「賣權」時，必須支付一定的權利金。例如，買了「A\
    \ 公司 12 月 50 元」賣權的人，可以在 12 月合約到期之前，以 50 美元賣出 100 股 A 公司的股票。這種情況表示買家預期股價下跌，賣家則預期股價持平、上漲或跌幅不超過權利金的利息，賣權即買權的反相詞。\n\
    \n## 質化分析（qualitative analysis）\n\n分析非量化的因素，像是市占情形、位置、產業、名氣等因素。\n\n## 量化分析（quantitative\
    \ analysis）\n\n基於財報表數字的分析。\n\n## 速動比率（quick ratio）\n\n又稱為「酸性測試比率」。這個比率顯示企業的短期流動性。速動比率評估企業能否用流動資產清償短期債務。速動比率的計算方法為「流動資產」減去「庫存」，再除以「流動負債」。速動比率越高，代表企業的體質越好。速動比率是比「流動比率」更保守的指標。\n\
    \n## 經濟衰退（recession）\n\n大部分的經濟學家認為，經濟衰退的定義是連續兩年以上的國民生產毛額（GDP）呈現負成長。\n\n## 紅鰭報告（red\
    \ herring）\n\n企業首次公開發行股票的說明書。這個名字的由來是因為說明書裡會用紅色字體標明投資的風險。\n\n## 保留盈餘（retained\
    \ earnings）\n\n未分配給股東的企業淨利，這些資本留起來作為其他用途。\n\n## 投入資本報酬率（return on invested capital）\n\
    \n企業淨利加上利息支出，再除以總資金。\n\n## 次要走勢（secondary movement in the stock market）\n\n根據查爾斯·道的說法，市場的波動與反應會在主要走勢之後，產生次要走勢，而且次要走勢的方向與主要走勢相反，幅度至少是主要走勢的\
    \ 3/8。譬如，如果股票上漲 10 點，就很可能會跌 4 點。查爾斯·道指出，這個規則也隨用適用於個股。\n\n## 美國證券交易委員會（Securities\
    \ and Exchange Commission，簡稱 SEC）\n\n為美國政府機關，主要負責監管證券業，於 1930 年代「新政」時期所設。\n\n\
    ## 美國證券交易委員會文件（Securities and Exchange Commission documents）\n\n美國證券交易委員會要求上市公司在特定時點必須呈交的文件報告。「10-K」表是年度商業與財務報告；「10-Q」表是每季的財務報告；「8-K」表為非預定事件或企業調整發生後\
    \ 15 天內必須繳交的報告。此外，企業也必須呈交年度股東大會的代理委託表，合併案必須有合併代理委託表；如果要發行新股票，也必須繳交募資說明書。\n\n##\
    \ 優先證券（senior security）\n\n企業清算時，順位高於普通股證券，如債券或優先股。\n\n## 參考書目\n\n- Peter L. Bernstein.\
