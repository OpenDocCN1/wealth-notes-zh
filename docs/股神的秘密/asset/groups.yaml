    # 預測股價高低點只會徒勞無功


    1902 年，查爾斯・道在專欄裡寫到：「在股市裡，你永遠不知道漲的時候高點在哪，也不會知道跌的時候低點在哪；只有在最高點、最低點出現一段時間後，才能確定什麼時候是真正的高點和低點。有時可以猜到高點和低點的價格，但這種猜測實在沒什麼意義。華爾街有一句話說，只有愚蠢的投機客才會想要買在最低點、賣在最高點。有經驗的投機客都知道，沒有人可以總是買在最低點、賣在最高點。」²⁸


    巴菲特說，大部分的投資人都禁不住市場時機的誘惑。他常觀察到所謂的「灰姑娘症候群」（Cinderella Syndrome）：「他們（投資人）到達舞會現場，雖然明知馬車在午夜
    12 點就會變回南瓜，可是每個人還是以為自己會在 11 點 55 分離開，實際上這根本做不到。」


    「如果你是百分之百的價值投資者，就不會買在高點。」大衛・埃本這樣說。大衛・埃本是「紐文信風價值機會基金」（Nuveen Tradewinds Value Opportunities
    Fund）的基金經理人，這個基金規模高達 5 億 7400 萬美元，他自認是尋找深度低估價值的反向投資者。在 2007 年、2008 年金融危機出現的前 3
    年，他為客戶創造平均超過 17% 的報酬率。2008 年，他的投資組合跌了 32%，但在 2009 年又反彈了超過 40%。


    ## 總在意料之外


    根據價值投資者兼基金經理人查理·布蘭德斯的說法：「我總是強調，現在也一直強調，價值投資者——還有其他類型的投資人也一樣——會不斷看到市場令人意外的短期震盪與經濟變化。不管你預測市場可以漲多少、漲跌到哪裡，實際的表現永遠超越你的估計。就連我這樣的價值投資者也會常會覺得股價的變化實在令人意外。而且，我認為這種現象在未來也不會改變。」


    ## 當沖暗藏危機


    當沖很刺激，卻又暗藏危機。隨著股票市場上下震盪，你也跟著殺進殺出，快速獲利。就定義來看，當沖就是看市場時機來投資。隨著個人電腦進步神速，當沖的魅力也跟著水漲船高。


    數百家公司試著挑動我們血液中的賭徒因子，告訴我們：只要穿著睡衣、待在家裡，就可以靠當沖致富。這些公司兜售訓練課程、軟體與資訊技術，賺進大把鈔票；有時，這些投資課程的售價高達
    4 萬 5000 美元。


    沒人知道實際上到底有多少人進行當沖，因為當沖通常都不具名，而且私下進行。有少數人替投資公司賣命，專門做當沖；但即使在這一行，往往變化很快，他們的職業生涯也不見得長。研究顯示，比起其他投資人，在家使用投資軟體操作的投資人成功機率更低。²⁹
    許多研究指出，有大約 70%的當沖客不賺反賠，而且大部分都賭上自己全部的資本。³⁰ 而一旦賭輸了，往往會血本無歸。


    想要玩當沖的人就跟其他投資人一樣，必須考量所有的成本，包括課稅以及失去的機會成本等。


    「投資人之家的 (Investor Home) 網站解釋這些因素如何互相運作。「舉例來說，假設當沖的投資客阿倫總共有 12 萬 5000 美元的資本，現在正職工作的年薪有
    10 萬美元。為了專心進行當沖的交易，阿倫辭掉工作。他估計，接下來 6 個月的生活費需要 2 萬 5000 美元，剩餘的 10 萬全部投入股市。6 個月後，阿倫的本金只剩一半，手邊只有
    5 萬美元。請問，阿倫決定專職做當沖以來，總共損失了多少錢？答案可不是 5 萬美元而已。」³¹


    除了當沖損失的 5 萬美元之外，阿倫還損失前一份工作的 5 萬美元收入；而且如果把這 5 萬元拿去做一些保本投資，還可以生利息，或是進一步增值。


    有的人玩當沖，最後的下場比阿倫更慘。許多人借錢來槓桿操作，像是融資 (借錢買股票)。一旦帳戶出現虧損，可能會背上一屁股債。


    當沖很傷神，需要投注許多時間精力，壓力也很大。就算真的獲利，報酬率也往往不如預期，還不如單純找個股價被低估的好公司，低調地持有該公司的股票，等待股價達到或超越公司真正的價值時再賣出。


    巴菲特不喜歡當沖，也不認同其他過於頻繁的交易行為：「我們認為，說這些頻繁交易的人是『投資人』，就像說是天天一夜情『很浪漫』一樣。」


    巴菲特還說：「很多人都覺得，自己有辦法跳著高明的投資之舞，在市場上游刃有餘，輕輕鬆鬆地從別人身上賺錢。可是，這門生意風險很高。」大部分追隨當沖派的人，就是禁不住最後一支舞的誘惑，最後慘遭套牢。


    「雖然這麼說，如果你骨子裡流著當沖的血，喜歡競爭、享受風險的刺激快感，你大概還是會選這條路。」巴菲特如此說，「不過，如果是不喜歡壓力太大的人，就不用想這麼多。因為你們可以靠價值投資法賺更多的錢，也比較不會血本無歸。」


    證券律師菲利普·費恩（Philip A. Feigin）說：「對散戶而言，當沖不是投資，而是賭博。如果你想賭，乾脆去拉斯維加斯，那邊的東西還比較好吃。」³²


    ## 短線交易


    近年來，許多對沖基金公司與投資機構開發出電腦軟體，可以在千分之一秒間完成買賣單交易。對某些投資機構來說，短線交易可以維持競爭力。在大量交易下，即使每股幾毛的微小差異也不容輕忽。


    不過，有些對沖基金公司利用先進的電腦系統，大量進行股票套利，從極小價差中牟利。有些基金公司甚至一秒鐘就買賣幾千次，持股時間可能只有幾分鐘。這類進出頻繁的交易占美國各交易所每日交易量的
    61%，每天買賣超過 100 億股。³³


    進行這類交易的人宣稱，這樣可提高流動性，讓所有投資人都受益。但批評者擔心，這類交易的金額高達數十億美元，交易速度又這麼快，只要一個小誤差就可能重創美國與世界的經濟。1987
    年便發生類似的事，當時因為自動停損單（stop loss order）齊發，讓股市一天大跌 22%。


    不過，對大部分的投資人來說，每股一、兩毛美元的差異對報酬率影響不大。也因為這類交易並非從市場的基本面出發，雖然會影響市場波動，但無法真正引導市場走向。


    ## 市場過熱的徵兆


    2007 年初，股市出現典型的過熱徵兆：


    - 股價來到歷史新高。

    - 本益比飆漲。

    - 與正常的債券殖利率相比，現金股息殖利率偏低。

    - 許多人紛紛融資買股票，因為想藉此提升獲利。


    當股市過熱時，市場往往湧現許多新發行的股票，特別是體質較差，或還沒開始獲利的新公司。多頭市場往往會出現一波 IPO 的投資機會，因為投資人看好市場前景，願意付出高價，追求新發行的股票。


    ## 多頭市場過熱的操作策略


    前面提到，沒人真的知道股市是否走到了高點，也沒有人知道經濟何時開始衰退或衰退結束，只有事後回顧，才知道到底開始還是結束了沒。


    《道氏理論通訊》的編輯理查·羅素解釋：「多頭市場的高點往往會持續一段時間，然後某個類股開始下跌，接著其他類股也跟著跌。」³⁴


    不過，即使是在高點，股市也有如雲霄飛車，停停走走，上上下下，造成市場波動不斷。


    這時，只有兩種合理的相應之道：


    - 如果你還沒降低你的投資比例，那就趕快賣掉吧。先獲利了結、落袋為安，等待市場冷靜下來。當股價降到安全邊緣出現時，就是買進的時機。聽起來很簡單，但大部分的投資人看到股價一直漲，就是不願賣出；也有人因為考量到課稅問題，遲遲不肯賣。不管是哪一種，都可能等到最後股價大跌，使得獲利化為烏有，也就沒有課不課稅的問題了。

    - 第二種因應之道就是賣掉那些漲過頭、明顯遭到高估的股票。而擁有持續成長動能的公司就加以保留，等到市場回歸常軌時，再買進潛力股，加入投資組合中。


    這兩種策略都需要決心、紀律與耐心。


    ## 市場總會回歸常軌


    查理·布蘭德斯提醒我們，2007年、2008年的危機始於次級貸款市場的崩壞，然後延燒到其他信用市場。布蘭德斯說，徵兆出現時，他也沒抓對時機，因為未能準確預測到問題的嚴重性。布蘭德斯說：「我們大致上看到了問題，只是沒有完全掌握。當時可以看到很多明顯的蠢事，我觀察
    2005 年、2006 年的房地產，正是情況開始越來越離譜的時候。可是，每個人（銀行與房貸機構）都以為房地產不是持平就是會繼續漲。因為我覺得情況太離譜了，就退出銀行類股，也不碰房貸。不過，我抓到的還不是最好的時機，所以之後泡沫繼續膨脹。我們很早就退出來，這也正是價值投資派的特點。」


    ## 尋找投資機會


    布蘭德斯說：「一般來說，判斷市場時機是投資人常犯的錯誤；另一方面，看到房地產發生這些現象，就必須特別小心。這需要相當驚人的耐心，但投資人往往沒有足夠的耐心。」


    布蘭德斯在 2008 年末給投資人的信中提到，許多價值投資的機會已經來臨，數千家好公司，如 Google、蘋果、英國石油（BP）、豐田等企業的股價都受到重創，來到低點。


    這樣好的投資機會不到一年就消失了，但還是有部分優質的股票會低價一段時間。布蘭德斯解釋，只要有耐心，注重長期獲利，而且願意布局全球，不管短期市場如何震盪，其實有非常多的投資機會。布蘭德斯關注那些暫時失寵，但對生活、經濟很重要的產業，如醫藥與電信業，將這些產業納入投資範圍，提升基金的永續成長動能。


    「銀行業就是一個例子。銀行體系與信貸服務有必要存在。如果你看的是未來 3 年、5 年的獲利，就會發現許多優良的投資標的。」但布蘭德斯也強調，分析銀行類股時要實際，「未來銀行的功用大概會不如此以往，而且銀行也必須依照法規提高自有資金部位；這樣做當然很好，只是如此一來也會降低投資報酬率。」


    他的這項建議是針對處於當下景氣的銀行業，可是其實不管是什麼時候，前瞻性思考都很有用。我們無法準確預測未來的事件與時機，但只要多用常識，就可以找到正確的投資方向。我們從歷史中學到教訓，避免重蹈覆轍。


    ## 空頭市場的特徵


    空頭市場的低點跟多頭市場的高點一樣難以察覺，當股價越跌越深，專家們就會開始問：現在跌到谷底了嗎？甚至有些就直接宣稱已經跌到最低點了。


    當然，股市的變化有跡可尋，可以發現一些徵兆，例如股價指數接近或創歷史新低。企業的資產負債表、損益表、本益比、現金股息殖利率（dividend yield）等數字都是徵兆之一。


    只是，投資人這時往往鬱卒無比，無意再戰；就算價格再誘人，他們也不想重入股海。


    ## 現金股息殖利率


    現金股息殖利率，也就是企業的現金股利與股價的百分比。多年來，這項指標相當準確地預測景氣循環。現金股息殖利率理論認為，如果一家企業有長期的現金股利紀錄，往往就可以經由分析現金股利的變化得知公司的股價是否遭到高估或低估。當股價過高時，現金股息殖利率就會來到歷史新低；股價跌了，現金股息殖利率就會提高。如果一檔股票的股價為
    100 美元，每年分發的股息為 5 美元，現金股息殖利率就是 5%。如果股價漲到 200 美元，現金股息殖利率就降到 2.5%。不過，如果股價跌到 50 美元，現金股息殖利率就提升到
    10%。只要公司體質健全，就應該在價格下跌、股利增加的時候買進。有些老企業的現金股利升降循環很明顯，投資人可以藉此決定買賣時機。


    道瓊指數（個股也一樣）的現金股息殖利率與指數（股價）成反比。常常道瓊指數的現金股息殖利率擺盪在 6%（市場跌到低點）與 3%（市場漲到高點）之間。不過，1994
    年到 2007 年是例外：當現金股息殖利率跌破 3% 時，股價上漲的趨勢居然反轉。道瓊指數的平均殖利率有時會超過這些數字，每檔股票也都有各自的規律，不過大體而言還是有跡可尋。這幾年間，市場很不尋常地一直漲，現金股息殖利率卻來到歷史新低；所以當漲勢逆轉時，大跌可說是來得又急又快。


    許多公司在獲利低時會限制股利發放，未來展望看好時則提高股利，所以股利提高代表該公司對未來充滿信心。只是，當市場多頭氣盛時，投資人往往偏好奇快速攀升的股價，不滿足於股利所得。許多快速成長的年輕公司會理所當然地將這些獲利再投資在公司身上，只是這樣一來就沒有現金股利紀錄可供參考。


    到了 2008 年中，市場跌到谷底，許多股票的現金股利驚人。以美國公開上市的公司來說，有超過 1200 家（超過 40%）公司的殖利率超過 5%。當時，美國國庫券（Treasury
    bill）⁶殖利率不到 4%。麥格羅希爾公司（McGraw-Hill）因為評等服務受到波及，股利也只有 5%；不過，才不到一年，它的股價大涨，現金股息殖利率就跌到
    2.8%。


    良好的現金股息殖利率反映其內在價值，現金股利也可視為一種安全邊際；不過，在檢視股利之餘，一樣要用其他資料交叉比對。要確保安全的現金股利，可以找負債少、現金流充足，而且營收與獲利持續成長的公司。


    關於股利，第 10 章會有其他相關討論。


    ## 投資機會涌现


    當股價跌到一定程度，股票出現極佳的安全邊際時，理論上人人都應該歡呼。巴菲特說，像這種時候，他會很高興，心情好到每天踩著踢踏舞步上班。


    巴菲特曾在 2008 年對股東說：「市場混亂帶給我們進場投資的機會。投資時，市場悲觀是好事，市場太樂觀就要小心。在保險這一塊，我們就以一般市場找不到的優渥條件做成
    3 筆大型投資交易。」


    > * 美國國債券即美國政府發行的債券。


    ## 公務員保險公司的傳奇


    公務員保險公司（GEICO）正是資本主義的成功典範。這個例子告訴我們，最棒的投資標的將會如何波動，也可以看到這樣的投資對價值投資者（如巴菲特）來說，如何帶來不只一次的驚人機會。


    經濟大蕭條期間，來自德州的李奧·古德溫（Leo Goodwin）與太太莉莉安（Lillian）共同創辦公務員保險公司。李奧當過保險公司的會計師，自信能對公務員直接銷售保險，創造低風險的車險公司。或許他注意到，公務員較少發生意外，而且會準時付款，是保險公司的優質客戶。古德溫夫婦創立公務員保險公司時，資本額
    10 萬美元，其中 75% 的資金來自德州華茲堡（Fort Worth）銀行家克里夫斯·雷亞（Cleaves Rhea）。公務員保險公司 1936 年在德州誕生，1
    年後遷移到華盛頓特區。不到 4 年的時間，公司已經開始獲利。


    1948 年，雷亞氏家族決定賣掉大部分持股，但華爾街卻沒有什麼買主想買他們的家族企業。不過，當他們找到葛拉漢—紐曼公司時，情況開始轉變成。葛拉漢發現，公務員保險公司很有投資價值，不過他也看到這家公司的潛在危機。他擔心的不只是這些資產的品質不夠好，最重要的是，他認為如果買下來，會用掉太多葛拉漢—紐曼公司的資源。保守的葛拉漢開始思考，是否該用
    25% 的公司資產收購這家公司。


    後來，葛拉漢下定決心，以 72 萬美元買下公務員保險公司大部分的股份，同樣的持股比例巴菲特在 1995 年出價 23 億美元。


    葛拉漢當時的確判斷錯誤，不過這個錯誤與財務無關。當時法規規定，一家投資公司不能持有另一家保險公司超過 10% 的股份。美國證券交易委員會要求葛拉漢減少持股。賣家不願買回原有股份，於是葛拉漢與美國證券交易委員會達成協議：他會將公務員保險公司獨立出來，並且將股份透過葛拉漢－紐曼基金（Graham
    Newman Fund）賣給其他投資人。


    不久後，公務員保險公司在紐約證券交易所上市，每股股價為27美元。之後，這家公司又將幾家子公司獨立出來，股票也分割了無數次。據估計，1948年到1972年之間，這些股票漲了超過280倍。


    1970年代早期，葛拉漢與紐曼決定從公務員保險公司的董事會退休。葛拉漢提名巴菲特做他的接班人，但董事會反對，因為他們認為巴菲特持有其他保險公司的股份，會造成利益衝突。事後看來，這實在不是什麼明智的決定。


    巴菲特還在哥倫比亞大學當葛拉漢的學生時，就對保險公司特別有興趣。1951年，巴菲特跳上開往華盛頓特區的火車，造訪公務員保險公司，從此進入保險的世界。他認為保險是自己的「核心競爭優勢」（circle
    of competence）。巴菲特將他65%的資本，也就是當時的7000美元，投資在公務員保險公司上。後來，他在高點時賣掉這些股份。


    1973年時，公務員保險公司的股價約60美元，但到了1976年跌到只剩5美元。當時負責管理公司的是創辦人的兒子，後來自殺身亡。


    這時，巴菲特又看到第二次的投資機會，於是以平均每股3.18美元的價格買下1300萬股。巴菲特一步一步增加自己的持股，最後持股比例達到51%。1996年，巴菲特的波克夏公司以略低於淨值的價格買下剩餘的股份。


    1995年時，公務員保險公司是美國第六大車保險公司；到了2010年更躋身為第三大車保險公司；在這期間，公務員保險公司的規模從27億美元成長到96億美元。而且很重要是的，」巴菲特說，「波克夏公司持有公務員保險公司的14年來，有13年都是獲利的。」³⁵


    不過，這時投資人可能因為之前的慘痛經驗遲遲不敢下手。投資理財作家詹姆斯·格蘭特（James Grant）曾說：「一般來說，不管是在哪裡，大家都是在價格低的時後買進；可是在股票、債券市場，大家似乎用高價買進的多。」³⁶


    ## 市場先生不高興時，就是你該高興的時候


    2008 年 10 月，巴菲特在《紐約時報》( The New York Times ) 發表文章，鼓勵投資人重回股市投資。巴菲特寫到，他已經開始買進美國的股票。為什麼？「別人貪婪時，要懂得恐懼；別人恐懼時，要懂得貪婪。」(
    Be fearful when others are greedy, and be greedy when others are fearful ) 他說，「很顯然的，現在恐懼已緊緊抓住每人的心，連經驗豐富的投資老手也難逃其中。的確，投資人是該小心過度槓桿操作、競爭力堪慮的公司。但不該以為其他好公司沒有繼續成長的動力。這些公司的獲利當然會受衝擊，這本來就是正常現象。但
    10 年、20 年之後，許多大企業的獲利將創下歷史新高。」³⁷


    巴菲特也坦承，他可能走在市場前面；可能要等上好一陣子，新買的股票股價才會攀升。可是另一方面，我們本來就很難預測市場何時會開始反轉。看到好的投資機會，就該立即出手：「如果你一直等待著知更鳥捎來春天的訊息，春天就會在不知不覺中過去。」³⁸


    大衛·埃本說：「一般而言，太早總比太晚好。就算太早行動可能代表要做出令人心痛的决定，不過還是比太晚行動好。」³⁹


    巴菲特強調，市場波瀉洶湧時要保持冷靜，堅持走自己的路。「如果你抱著一些好公司的股票，抱了好幾年，兩年前沒事，現在也沒發生什麼事，那就不要讓道聽塗說的羣眾打亂你的投資計畫。」巴菲特這麼說。


    查理·布蘭德斯告訴自己的客戶：「投資不只需要紀律，也需要審慎地重新檢視投資決定。」⁴⁰


    # 第 5 章 風險與報酬


    面對目前的市場情況，大家很自然會想辦法避險。而我們的目標，是追求風險與報酬之間的平衡。


    - 布蘭德斯投資公司 (Brondes Investment Partners)


    許多理論已經指出，在不同的收入、年齡與條件下，投資人可以承擔多少風險。有許多網站甚至提供算式，告訴你在何種情況下，適合放多少錢或多少比例的資金在股市裡，幾乎所有的算式都會運用貝他係數（beta
    coefficient）。雖說這些計算方法可以提供一些方向，卻也可能誤導大眾，阻礙我們的常識判斷。


    ## 平衡風險


    在全新的21世紀裡，我們（目前為止）已經學到教訓，知道自己該追求健康、平衡的財務狀態。股市投資適合財務狀況良好、房貸負擔輕、每個月繳得起信用卡帳單的人；此外，這些人也應該存有6個月以上的生活費，而且這些錢應該放在可以自由運用的地方，像以儲蓄帳戶、貨幣市場基金或是短期定存等方式存起來。另外，也應該將錢盡量放在有稅務優惠的帳戶裡，以美國來說，可以放在公司的401(k)帳戶，個人的退休基金帳戶，或「羅斯個人退休帳戶」（Roth
    Individual Retirement Account，簡稱Roth IRA）裡。⁶


    另外，當紅理財專家蘇絲·歐曼（Suze Orman）提到：「我們必須很清醒。我老是提醒大家，如果要投資股

    '
