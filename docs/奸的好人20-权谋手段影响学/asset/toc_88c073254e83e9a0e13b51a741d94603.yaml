- - '##'
  - 对方短暂的思考为佳。以及细节的力量
- - '###'
  - 1. 千（Qian）的全称是“慢千”，意思是慢慢的编造一套说辞，恐吓人家，刺激别人的情绪，让人家觉得大事不好。隆（Long），是赞美、鼓励、捧抬的意思。（千、隆、问、屈加起来，就是有名的
    NLP 神经链调整术，也叫地狱夹天堂法。）问的全称是“审问”，意思是一边观察，一边发问。比如，我说你十月份发生了一件比较大的事吧？然后我观察你的表情、眼睛、眉毛。表情不好，可以判断是不好的事。表情愉悦，可以判断是好事；屈，也叫响卖。就是把人整得心理情绪大起大落，他心灵失守，你就能通过发问与观察得到一个结论。比如：你十月份发生过一件不好的事。他就要用肯定的口气说出来。震住他，让他“屈”了。急打慢千，轻敲而响卖。只要准确的诊断你的客户的过去，他就会“误信”你可以预测他的未来。
- - '###'
  - 2. 当你的错误被人愤怒的指出时，罪恶感是一种机械反应；你要解决的是错误，而不是罪恶感。
- - '###'
  - 3. 怀疑是最好的权力。不信比误信更重要。两种人最不容易被骗：特种类、冷静型。当有情绪被引导，立刻内心抽离出一个自我，去觉察刚才发生了什么，对方做了什么，让我产生这样的情绪。（最容易骗的：老好人、利欲大的人、困境大的人）
- - '###'
  - 4. 如果一个女孩对一个男孩厌恶，那么你在场的时候，你越夸他，她越讨厌他。如果一个富家子追一个女孩，又夸又送等等，就是你的出手时机，以对双方都友好的方式加入，踩女孩夸男孩。男的一维护女孩，就对女孩说，你看这样的男孩才值得去追求。
- - '###'
  - 5. 遇到问题时，需求解决为上策，宣泄情绪为下策。遇到问题第一时间想，有多少种方法来解决这个问题。大丈夫做事，不看自己心情好不好，感受好不好。
- - '###'
  - 6. 要人相信你有火，你就制造烟；要人相信你有巨大的冰山，就让他看到冰山一角。
- - '###'
  - 7. 建议你刚开始与新客户见面时，策略性的麻烦他们，就算只是一些小事，让他们帮你。
- - '###'
  - 8. “印象洗脑”是借故事来塑造人物。记人物容易过记故事，记故事容易过记信息。印象洗脑的成功在于制造策略性的层次感。冲突和矛盾，制造神秘感。
- - '###'
  - 9. 报价策略：三平，两中，一停。三平：语调、眉、颊，三者皆平，对方就不会感觉到你任何的情绪。三平的目的就是让对方感觉到你讲的就是事实，而且还要讲到是全世界都认可的事实（报价的时候，热情会让对方感觉在说服，而只需要当做一个事实来表述，就像说太阳从东边升起一样的语气。你所报出的价钱应该属于“事实”。语调平平无起无落。）
