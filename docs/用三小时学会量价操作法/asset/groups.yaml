    ## 1.4 如何抓出股價漲跌趨勢？


    移動平均線（Moving Average，MA）是道氏理論的形象化表述。它以查理斯·道（Charles Henry Dow）的「平均成本概念」為基礎，採用統計學中的「移動平均」原理，透過由若干條不同時間週期的均線所組成的均線系統，來表現市場平均持有成本的變化情況，進而清晰地呈現股市及個股的趨勢運行情況。在本節中，我們將結合均線系統的不同排列形態，來看看它是如何呈現趨勢運行情況的。


    ### 1.4.1 均線的含義及原理


    股價走勢只是趨勢運行的表象，市場平均持有成本的變化情況才是趨勢運行的內在本質。市場平均持有成本，展現了多空雙方的出入意願及力度，這種意願及力度具有明顯的傾向性，可以維持較長的時間。一般來說，股價走勢的變化主要取決於兩點：一是市場平均持有成本及其變化情況，二是場外投資人的買賣意願。兩者對股價走勢的變化各有一半的影響力。


    在具體設計上，移動平均線以每個交易日的收盤價，近似地代表當日市場平均持有成本。將最近 n 日的收盤價進行算術平均，就可以得到這一時間週期內的市場平均持有成本的數值。


    下面我們以 5 日作為計算週期，來看看移動平均線 5 日均線，也就是 MA5 的計算方法。


    MA5（n）＝（Cn + Cn-1 + Cn-2 + Cn-3 + Cn-4）÷ 5


    Cn 表示第 n 日的收盤價，在此公式中近似地代表這一交易日的平均成交價，MA5（n）表示第 n 日的移動平均值。


    將每一日的 MA5（n）連成平滑的曲線，我們就會得到移動平均線 MA5。同理，我們還可以得到其他時間週期的移動平均線，其中的 5 日、15 日、20 日、30
    日這 4 種時間週期較為常用，它們是中短期市場平均持有成本走向的反映。


    ### 1.4.2 中期主導的多頭、空頭形態


    多頭形態與空頭形態是均線系統中最經典的形態，多頭形態代表著升勢的出現與持續，空頭形態代表著跌勢的出現與持續。


    多頭形態也稱為「多頭發散形態」。當股市進入上升週期後，後入場的投資人持有成本更高，這將使得週期相對較短的均線，運行於週期相對較長的均線上方。整個均線系統呈向上發散狀，這種組合形態稱為多頭發散形態。


    空頭形態也稱為「空頭發散形態」。在整個均線系統中，週期相對較短的均線運行於週期相對較長的均線下方，整個均線系統呈向下發散狀。空頭形態是跌勢出現、持續的標誌，也是空頭佔據主動的訊號。


    當多頭形態出現後，表明當前的市場處於多方佔優勢階段，是中期趨勢向上的訊號，只要多頭形態未被明顯破壞，我們宜以升勢思維來交易；當空頭形態出現後，表明當前市場處於空方佔優勢階段，是中期趨勢向下的訊號，此時，我們只宜參與超跌反彈的短線交易。


    圖 1-18 的均線系統由 MA5、MA10、MA20、MA30 這 4 條均線組合而成。股價在經歷了整理之後開始上揚，此時的均線系統呈多頭發散形態，這是多方佔優勢並且發動攻勢的標誌，也是中期股價走勢向上的反映，標誌著升勢的持續。


    圖 1-19 中股價持續震盪走低，雖然此時的中短線下跌幅度已經較大，但明顯的均線空頭發散形態，提示我們此時的市場仍是空方佔優勢，不宜過早抄底入場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_35_0.png)


    △圖 1-18 生物股份 2019 年 7 月至 11 月走勢圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_35_1.png)


    △圖 1-19 ST 羅頓 2019 年 3 月至 12 月走勢圖


    ### 1.4.3 途中整理的黏合形態


    在股價上升（或下跌）途中往往會有整理走勢出現，這不是趨勢轉折的訊號，它僅是原有趨勢運行中的整理。所謂的黏合形態是指在上升趨勢中，短期均線向下靠攏中長期均線（下跌趨勢中，短期均線向上靠攏中長期均線），使得多條均線黏合在一起。當黏合形態出現後，隨著交易的持續進行，這種多空平衡狀態會被打破，股價很大的機率會沿原有趨勢的方向運行。


    我們可以看到圖 1-20 中，股價在上升途中的回落、震盪使得短期均線向下靠攏中期均線，多條均線之間的距離極短，呈黏合形態。但此時的 MA30 仍舊在穩健上行，這說明多方力量依舊佔優勢。此時的均線黏合形態，代表著當前的橫向震盪走勢為途中整理，隨著整理走勢的結束，股價仍將保持原有的上升趨勢。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_36_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_36_1.png)


    圖 1-21 可以看到在震盪下跌過程中，股價的小幅反彈，使得短期均線向上靠攏中期均線，這是下跌途中的黏合形態，也是跌勢仍將持續的訊號，我們此時不可抄底入場。


    ### 1.4.4 反轉前的壓力支撐轉化


    在上升途中的一波下跌走勢後，原有的均線系統呈多頭形態，隨著這一波下跌，多頭形態被打破。當股價下跌至 MA30 附近時，若受到有力的支撐（或者在跌破 MA30
    後能快速反彈），則表明多方力量依舊較強，升勢有望延續。


    但是，若股價向下跌破了 MA30，並且在較長時間內無法向上突破時，這時的 MA30 將由原來的支撐作用轉換為阻力作用，趨勢反轉下跌的機率較大，這時我們應控制倉位、鎖定利潤。


    可以看到圖 1-22 在股價持續上升途中，MA30 對短期回檔走勢提供了較強的支撐作用。一般來說，當股價累計漲幅不大並且處於明顯升勢中，一波回落使得股價接近
    MA30 時，是較好的中短線入場點。


