    ## 第 3 章

    用均線結合量價，

    操作「中短線交易法」！


    ### 3.1 葛蘭碧的 8 大買賣法則


    趨勢決定著交易方式：是以買進持有為主，還是進行快進快出的波段交易。當股價運行的大方向相對明確之後，我們可以借助一系列的技巧工具來把握買賣點，而均線無疑是研判、把握趨勢的最佳工具之一。在第
    1 章中，我們已經講解了利用均線來分析趨勢的方法。在本章中，我們將進一步結合量價配合、趨勢各環節的量能特徵等要素，在暫不考慮主力參與的基礎上，來看看如何展開順勢而為的中短線交易。


    由於主力的參與可能會打破多空平衡關係、改變籌碼分佈狀態，因此，有主力參與的個股，往往會呈現出一些不同於大多數個股在自然交投下的量價配合關係。以本章內容瞭解趨勢下的量價關係後，筆者將在第
    4 章進一步解讀有主力參與的個股量價形態。


    在結合趨勢運行的基礎之上，技術分析大師葛蘭碧系統性地對移動平均線總結了 8 條買賣法則，其中既有短線買賣點，也有中長線買賣點，該法則是我們把握趨勢運行、展開買賣交易的重要參考指標。在實盤交易中，我們還需要結合量能變化情況來加以驗證，這樣才能獲得更高的成功率，更為精準地把握買賣點。


    #### 3.1.1 葛氏均線買賣法則示意圖


    圖 3-1 為葛蘭碧均線買賣法則示意圖，圖中標示了葛蘭碧均線上的 8 個買賣點，其中較細的曲線代表股價走勢（也可能用短期均線 MA5 來代替），較粗的曲線代表中長期均線
    MA30。在隨後的各個專題中，筆者將以量價配合為基礎，結合圖 3-1 中的買賣點展開實盤講解。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_75_0.png)


    #### 3.1.2 低點放量上穿 MA30


    低點放量上穿 MA30 形態，對應圖 3-1 中的「買 1」。在中長期低位移間，股價走勢止跌止穩、橫向震盪。此時，股價向上運行，由 MA30 下方向上突破
    MA30 並且出現明顯放量，代表著多方力量已經增強、買盤入場積極，有望出現行情反轉，我們此時可以實施中短線買入操作。


    由於個股此時處在低位移，因此放量穿越 MA30 時，以溫和式放量形態為最佳。量能的放大有一個連續過渡的變化過程，而這正是買盤躍躍欲試、多方力量充足的標誌，也是多空力量對比格局完全扭轉的訊號。


    由圖 3-2 我們可以看到，股價在低位移橫向止穩，股價重心有緩慢上移的趨勢，隨後的一波小幅度回落使得股價運行於 MA30 下方。緊接著一波放量上攻，使得股價向上穿越了
    MA30，這是中長期趨勢開始上行的訊號，也預示著上升行情有望出現。當股價放量向上穿越 MA30 時，此時可以作為中長期的買盤入場點。


    #### 3.1.3 攀升回檔放量反穿 MA30


    攀升回檔放量反穿 MA30 形態，對應圖 3-1 中的「買 2」。在上升途中，股價震盪運行於 MA30 上方，上升較為平緩，股價沒有向上遠離 MA30，一波回檔下跌，使得股價向下跌破了
    MA30。隨後，當股價再度向上穿越 MA30 且以量能放大為支撐時，表明買盤資金充足，預示著新一輪上攻行情的出現，這是中短線買股入場的時機。


    圖 3-3 中，可以看到股價緩慢攀升，股價重心緩緩上移，但一波回落打破了原有的趨勢運行節奏。隨後股價再度放量上穿 MA30，這就是新一波上攻走勢出現的訊號，我們此時可以中短線買股入場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_76_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_76_1.png)


    #### 3.1.4 快漲後回落至 MA30 縮量


    快漲後回落至 MA30 縮量形態，對應圖 3-1 中的「買 3」。在上升途中，股價走勢快速上揚，股價向上且明顯遠離了 MA30。隨後，股價回落，當其回落至
    MA30 附近時出現了明顯的縮量，這是短期內空方力量大大減弱的標誌，也是股價遇到較強支撐的訊號，我們此時可以短線買入。


    由圖 3-4 可以看到，股價沿 MA30 穩步攀升，股價重心不斷上移，正處於上升趨勢中。在此背景下，短期內出現了一波上漲，使股價向上遠離了 MA30，我們此時應注意風險，因為股價有再度回落至
    MA30 的趨勢。


    如圖中的標注所示，一波回落後，股價在盤中跌至 MA30 附近，量能也明顯萎縮，這正是短期內空方力量減弱的訊號，我們此時可以進行短線買股操作。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_77_0.png)


    #### 3.1.5 向上遠離 MA30 滯漲放量


    向上遠離 MA30 滯漲放量形態，對應圖 3-1 中的「賣 4」。上升途中，一波快速上揚走勢後，股價向上遠離了 MA30。短線的快速上漲使得市場處於超買狀態，如果此時出現短線滯漲且量能未見縮小，表明市場實壓較為沉重，我們此時應短線賣出。


    由圖 3-5 可以看到，股價一直穩健地運行於 MA30 附近，一波快速上攻使得股價向上遠離了 MA30。此後股價連續多日無力上攻，但這幾日的量能均保持著較大的態勢，這是短線量壓重、股價將要回檔的訊號，我們此時應短線賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_78_0.png)


    #### 3.1.6 高點持續回落破 MA30


    高點持續回落破 MA30 形態，對應圖 3-1 中的「賣 5」。該點預示著趨勢的轉向。在累計漲幅較大的高位區，股價回落向下運行。若出現了股價下跌並穿過 MA30
    的運行方式，則無論當時的破位下行是否出現放量，都是多空力量對比格局轉變的訊號，也是中期頂部出現的標誌。此時，我們應進行中長線的賣股操作。


    由圖 3-6 可以看到，在股價累計漲幅較大的高位區中，股價滑澌滑落，隨後以一條長陰線向下跌破了中期 MA30。這是趨勢開始轉向下的訊號，對於中長線的投資人來說，應及時賣股離場。


    一般來說，在高位區，股價緩慢下滑並跌破 MA30 的走勢的短線，其殺傷力最大。因為緩慢的下跌不會讓個股處於短期超跌狀態，股價反彈空間極小。無論中線還是短線，我們此時若「抄底」入場，很有可能被套牢。實盤中，股價回落至
    MA30 附近的運行方式是極為重要的，這也是我們在實盤操作中應多加注意的。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_79_0.png)


    #### 3.1.7 向下遠離 MA30 後放量


    向下遠離 MA30 後放量形態，對應圖 3-1 中的「買 6」。在下跌途中，股價位於 MA30 下方，MA30 也處於下行狀態。一波短期快速下跌，使得股價向下且明顯遠離了
    MA30，此時的市場處於超賣狀態。若此時還有相對放大的量能，則代表著短期內的賣盤大多已離場，市場賣壓有望快速減輕。此時，只需要少量的買盤資金推動，一波反彈行情就會出現。在實盤操作中，我們可以短線買股入場，獲取反彈收益。


    圖 3-7 的高位區中，股價在 MA30 附近運行，最終因空方力量更強使股價向下跌破了 MA30。如圖中的標注所示，短期內一波快速下跌之後，股價向下遠離了
    MA30，此時的量能也明顯放大。這是短期內賣盤已悉數離場的訊號，預示著走勢有望出現反轉，是短線抄底、獲取反彈收益的訊號。


    一般來說，在實盤中股價在第一次快速跌破高位區、向下遠離 MA30 時，若大盤沒有出現系統性風險，那此時出現的放量下跌所預示的反彈機率最高、空間更大。因為之前的高位盤整走勢並沒有讓市場做空思維「一面倒」，所以雖然此時的空方力量已明顯佔優勢，但多空分歧依舊較為明顯，股價難以在第一次破位時就快速進入下跌趨勢，此時正是獲取短線利潤的好時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_80_0.png)


    #### 3.1.8 反彈穿越 MA30


    反彈穿越 MA30 形態，對應圖 3-1 中的「賣 7」。在下跌途中，均線系統呈空頭排列，一波反彈上漲使得股價向上穿過了 MA30。隨後，當股價開始調頭向下或者向下穿過
    MA30 時，是反彈行情結束的標誌，我們應及時賣股離場。


    此賣點無明顯的量能特徵，在股價反彈穿過 MA30 時，量能可以相對放大、也可以相對縮小，其市場含義都是相近的。在無重大利多的情形下，趨勢的轉變有一個循序漸進的過程，難以快速扭轉。


    由圖 3-8 中可以看到，該股價格處於震盪下跌走勢，股價位於 MA30 的下方，這是市場中空方力量一直佔據主動地位、股價運行趨勢向下的標誌。如圖中的標注所示，一波反彈走勢使得股價向上穿過了
    MA30，但這並不是趨勢轉向行上的訊號，而多預示著「曇花一現」的反彈行情。我們此時應短線賣出，以規避出現新一輪下跌行情的風險。


    #### 3.1.9 反彈至 MA30 遇阻


    反彈至 MA30 遇阻形態，對應圖 3-1 中的「賣 8」。在下跌途中，一波反彈使得股價向上還行至 MA30 附近，並在 MA30 附近受到強力阻擋，此時，我們應舊股離場。一般來說，在反彈至
    MA30 附近時，量能會相對縮小、股價滯漲，這是買盤入場力度不足的標誌，也是反彈結束、新一輪下跌行情將出現的訊號。


    由圖 3-9 中可以看到，股價在高位區跌破 MA30 後，趨勢已反轉向 下。如圖中的標注所示，一波震盪反彈走勢出現，股價反彈至 MA30 時遇阻，量能一直保持著相對縮小狀態，買盤入場力度明顯不足，趨勢未發生轉變，此時我們應及
    時賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_81_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_81_1.png)


    ### 3.2

    ![](img/ac68af843c2aeef3dbf55e10ca066163_82_0.png)

    趨勢中的築底及升勢量能特徵


    在不考慮主力參與的情況下，在趨勢運行的典型位置區間，如底部區、頂部區、上升途中、下跌途中等，由於多空雙方力量對比格局的轉變，及競爭力度的變化，會出現一些較為特定的量價形態。


    雖然這些量價形態並不是趨勢運行的必要條件，但由於它們的出現頻率較高、形態特徵較為明顯，對於我們辨識、把握趨勢有重要的實戰意義。在本節中，我們將結合趨勢運行，來看看不同位置區間的常見量價形態。


    #### 3.2.1 底部區量能特徵


    真正的底部區是縮量的，因為底部區總是在市場最低迷的時候開始構築，若沒有明顯的消息及外在因素驅動，底部區的構築會是一個相對漫長的過程。這時，股價原有的下跌趨勢運行緩慢，個股處於明顯被低估的狀態。由於買盤並沒有大量入場，暫時無法推動股價持續上漲，但股價有跌不下去的趨勢。


    隨著底部區的持續構築，原有的跌勢被打破，市場也漸漸活躍起來，買盤入場意願開始加強、持股者拋售意願減弱，多空力量對比格局出現了轉變。當個股由「無量築底」轉而變成「放量震盪、緩緩攀升」的形態時，多預示著底部區將構築完畢，距離股價突破上行的時間越來越短。


    此時正是中長線投資人入場的最佳時機，在實盤操作中，我們可以在放量震盪中的波段低點買入，既可以結合股價波動獲取短線利潤，也可以結合大盤走勢耐心持股待漲。


    由圖 3-10 中可以看到，在中長期的低位區股價縮量止穩，此時的量能明顯縮減、


    ![](img/ac68af843c2aeef3dbf55e10ca066163_83_0.png)


    △ 圖 3-10 中國出版 2018 年 8 月至 2019 年 3 月走勢圖


    股價重心不再下移，這是空方已不再佔據主動地位的標誌，也是股價開始築底的訊號。


    隨後，因買盤積極入場、股價放量攀升，這是股價走勢脫離底部區的訊號。當股價再次縮量調整時，就可確認是上漲趨勢中的回檔。在實盤操作中，放量攀升中的中短期大幅調整低點，就是一個極好的買入時機。


    底部區出現在股價大幅下跌之後，一般來說在這一區域，股價有效止穩，同時成交量溫和放大。這種量價配合關係既是買盤開始大量入場的標誌，也是賣盤無賣出的標誌，也就意味着底部區的出現。


    #### 3.2.2 整體式量價齊升


    量價齊升是個股（特別是大盤指數）在步入升勢後最典型的量價特徵之一。量價齊升形態是指隨著股價的不斷上漲，成交量也不斷放大，兩者均不斷地創出新高，呈同步關係。它是量能形態的整體性表現，在股價不斷上漲的過程中，量能的放大也越來越充分。


    量價齊升形態正是市場買盤資金充足、股市上漲動力強勁的表現，也說明當前 的股市或個股價格的上涨，是由於充足的買盤資金的推動，為升勢牢靠並將持續的訊號。在實際操作中，當股市或個股在上升途中出現了這種量價齊升形態後，我們應耐心地持股待漲，以便最大限度地獲取升勢所創造的利潤。


    圖 3-11 中可以看到，隨著股價的攀升，整體的成交量也在不斷放大，價與量不斷創出新高。這就是量價齊升形態，是升勢持續的標誌，也是持股待漲的訊號。


    對於量價齊升形態來說，隨著量能的不斷放大，市場在高位區的多空分歧也不斷加劇。一旦量能無法繼續放大，且股價跌破原有的上升通道，這往往是趨勢反轉的訊號，我們應做好獲利離場、減碼降低風險的準備。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_84_0.png)


    ▲圖 3-11 千禾味業 2019 年 5 月至 7 月走勢圖


    #### 3.2.3 波浪式運行的縮放量


    美國證券分析家拉爾夫・納爾遜・艾略特（R. N. Elliott）在研究道瓊工業指數走勢後，發現股市的走勢呈現出一種「自然的韻律」，其形態就如同大海中此起彼伏的波浪，基於此發現，艾略特提出了著名的波浪理論（Wave
    Theory）。


    波浪理論指股價以「5 升 3 降」的 8 浪迴圈方式運動，即股價的總體運行特徵會呈現「波浪式」，特別是當股價震盪上升時，波浪式的震盪上升是最為常見的上升方式。


    與股價的波浪式運行方式相對應的，就是「波浪式量能」，即上漲波段量能放大，緊接著的回撤波段量能相對縮小。而且，隨著股價的總體攀升，上漲波段的量能也會進一步放大，當上漲幅度較大時，此時也是市場多空分歧過於劇烈的訊號，預示著股價離頂部越來越近，我們應注意控制倉位、鎖定利潤。


    圖 3-12 中可以看到，股價呈波浪式上漲，成交量的變化也是波浪式的。如圖中的標注所示，在上漲過程中，隨著股價創出新高，上漲波段的量能也創出近期的新高，這是上升趨勢中的「波浪式量能」典型特徵之一。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_85_0.png)


    #### 3.2.4 「活躍式」量能形態


    「漲時有量，跌時無量」是股價運行的常態，上升途中不一定會出現明顯的「量價齊升」、「後量大前量」等經典量價形態。但是，在沒有主力參與、市場籌碼相對分散的情形下，股價要想持續上漲，就一定要有充足的買盤入場來緩解不斷加劇的多空分歧。展現在盤面上，就是整個上升途中的成交量保持著一種十分活躍的狀態。


    圖 3-13 中可以看到，在同期大盤橫向震盪運行的背景下，股價逆勢上揚，出現了獨立的上攻走勢。上攻走勢會引發明顯的多空分歧，獨立的上攻走勢需要更多的買盤力量。因此，在整個上攻過程中，成交量一直保持著一種十分活躍的放大狀態，這是上攻動力充足的標誌，也是升勢得以持續的根本。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_86_0.png)


    ▲ 圖 3-13 海汽集團 2019 年 9 月至 12 月走勢圖


    ### 3.3 趨勢中的見頂及築頂量能特徵


    持續上漲至多空力量對比格局發生轉變時，升勢就步入了見頂及築頂階段，此時的量價形態會發生一定轉變。無論是從整體角度，還是從局部角度，正確地辨識量能特徵，將有助於我們能夠及時地鎖定利潤、逃離頂部。


    #### 3.3.1 價創新高量相對縮小


    價創新高量相對縮小形態也稱為「量價背離」形態，它是指股價在上漲過程中創出了新高價。但這一上漲波段的成交量，卻明顯小於此前上漲波段的成交量，即價格與成交量無法保持同步放大的狀態。


    在持續上漲之後的高位區，一旦個股在運行中出現了這種量價背離形態，則標誌著買盤入場力度已大不如前。股價之所以能夠創出新高，只是因為多頭思維仍舊佔主導地位，市場賣壓不重，但沒有買盤推動的上漲是難以站穩於高點的，這種形態也是升勢根本不牢固的標誌。此時，若股價走勢出現滞漲，將導致多空分歧加劇，股價走勢反轉下行的機率極大。


    圖 3-14 在股價穩健攀升的途中，我们可以看到明顯的「量價齊升」形態，這是升勢持續的標誌，但是，隨著股價上漲，高位區的量價配合形態出現了轉變。如圖中的標注所示，這一上漲波段中股價創出了新高，但成交量遠小於前一上漲波段，這是量價背離形態，預示著升勢見頂。在實盤操作中，量價背離形態出現後，我們應及時賣出該類股票。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_88_0.png)


    △圖 3-14 大豐實業 2019 年 1 月至 8 月走勢圖


    #### 3.3.2 整體式縮量震盪


    上升趨勢的持續得益於買盤的蹦躍入場，當入場資金無法跟進而股價又在高位區出現滯漲時，這便是多空力量對比格局發生轉變的訊號。表現在盤面上，就是前期上漲時的量能保持著活躍的狀態，而在高位區量能卻相對縮小了。量能縮小得越明顯、持續縮小的時間越長，就代表著多空力量轉變得越明顯，這是頂部出現、趨勢即將轉向的訊號。


    圖 3-15 在股價的整個上升途中，我們可以看到成交量一直保持著活躍的放大狀態。隨後，股價進入高位區並橫向震盪，此時成交量大幅縮減，且上下震盪幅度較大。這種「整體式縮量震盪」形態出現在大漲之後的高位區，它是頂部出現的訊號。在實盤操作中，我們應此時減碼（或清倉）離場，鎖定利潤。


    #### 3.3.3 天量長陰線


    在股價短線漲幅較大、漲速較快的背景下，突然出現了一條長陰線，且當日的量能遠高於此前上漲時的均量水準，這就是天量長陰線，它的出現往往預示著一輪快速下跌行情的到來。在實盤操作中，應在第一時間賣股離場，以迴避風險。


