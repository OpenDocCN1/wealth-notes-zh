    ### 1.4.3 途中整理的黏合形態


    在股價上升（或下跌）途中往往會有整理走勢出現，這不是趨勢轉折的訊號，它僅是原有趨勢運行中的整理。所謂的黏合形態是指在上升趨勢中，短期均線向下靠攏中長期均線（下跌趨勢中，短期均線向上靠攏中長期均線），使得多條均線黏合在一起。當黏合形態出現後，隨著交易的持續進行，這種多空平衡狀態會被打破，股價很大的機率會沿原有趨勢的方向運行。


    我們可以看到圖 1-20 中，股價在上升途中的回落、震盪使得短期均線向下靠攏中期均線，多條均線之間的距離極短，呈黏合形態。但此時的 MA30 仍舊在穩健上行，這說明多方力量依舊佔優勢。此時的均線黏合形態，代表著當前的橫向震盪走勢為途中整理，隨著整理走勢的結束，股價仍將保持原有的上升趨勢。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_36_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_36_1.png)


    圖 1-21 可以看到在震盪下跌過程中，股價的小幅反彈，使得短期均線向上靠攏中期均線，這是下跌途中的黏合形態，也是跌勢仍將持續的訊號，我們此時不可抄底入場。


    ### 1.4.4 反轉前的壓力支撐轉化


    在上升途中的一波下跌走勢後，原有的均線系統呈多頭形態，隨著這一波下跌，多頭形態被打破。當股價下跌至 MA30 附近時，若受到有力的支撐（或者在跌破 MA30
    後能快速反彈），則表明多方力量依舊較強，升勢有望延續。


    但是，若股價向下跌破了 MA30，並且在較長時間內無法向上突破時，這時的 MA30 將由原來的支撐作用轉換為阻力作用，趨勢反轉下跌的機率較大，這時我們應控制倉位、鎖定利潤。


    可以看到圖 1-22 在股價持續上升途中，MA30 對短期回檔走勢提供了較強的支撐作用。一般來說，當股價累計漲幅不大並且處於明顯升勢中，一波回落使得股價接近
    MA30 時，是較好的中短線入場點。


