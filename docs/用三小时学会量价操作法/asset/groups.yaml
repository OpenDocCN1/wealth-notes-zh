  md: "\n隨著上升趨勢的持續，在高位區出現了長陰線快速跌破 MA30 的形態，這是原有多空力量對比格局發生轉變的訊號，我們應注意趨勢的轉向。\n\n我們可以看到圖\
    \ 1-23 中，其股價一直處於穩健上升的通道中，但在高位區出現了震盪下滑的走勢，股價向下跌破了 MA30，並且 MA30 隨後對股價的反彈上漲構成了強力阻擋，這是多空力量對比格局發生轉變的訊號。考慮到股價的累計漲幅，在這個位置區震盪築頂的機率較大，此時我們應減碼或清倉離場。\n\
