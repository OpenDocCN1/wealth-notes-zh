    # 5.3


    圓弧右側的滑落低點，是短線入場的好時機


    「圓弧形」常與主力的行為相關，因為僅憑市場正常交投，難以出現這種「優美」的運行形態。當股價以溫和放量的圓弧形態突破低位盤整區時，大多是主力快速拉升前的一次加碼操作。此時，圓弧右側的滑落低點，就是我們短線入場的最好時機。


    由圖 5-4 中可以看到，股價在長期盤整之後，先是出現了兩條縮量陰線，使股價降低至 7.76 元（本書所有金額皆指人民幣）處形成破位之勢，但在隨後的運行中，'
  md: '

    ## 4.4 主力洗盤出現時，是入場好時機


    震倉環節常出現在一些主力的參與過程中，它雖然不是必然出現的一個環節，但它的量價形態特徵很明顯，當其出現時，也就給我們指出了短線逢低入場的最好時機。


    ### 4.4.1 連續縮量陰線下跌


    震倉環節出現在建倉後、拉升前，是主力對底部區參與的獲利浮額進行整理的一種手段，其目的就是為之後的拉升操作創造更好的條件。


    一般來說，震倉環節的典型盤面形態，是股價短期內的快速下跌並伴以量能的相對縮小。但投資人在識別這種形態時，一定要將其與主力前期的低位進貨行為結合，當股價前期的累計漲幅不大、主力有明顯的進貨跡象時，快速縮量下跌才可以被看作是由主力的震倉操作所導致的盤面形態。


    圖 4-10 中可以看到，股價先是出現了長期的盤整走勢，隨後量能溫和放大、股價向上突破了盤整區，這表明主力在積極參與。而這個盤整區很可能就是主力進貨的區域，對於這類股票我們應多加注意。


    如圖中的標注所示，溫和放量突破之後出現了一波縮量回落，股價回檔至啟動點，這是主力在建倉之後、拉升之前進行的一次震倉操作，而這個短線回落低點也是我們買入的最好時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_120_0.png)


    ### 4.4.2 整體放量相對縮量


    震倉環節的量能形態以「相對縮量」為主要表現形式。如果在之前的突破走勢中，量能的放大較為明顯，則回檔時的均量往往大於上漲前的均量，但這并不代表主力的出貨行為。一般來說，這種情形常出現在主力參與能力較差的中型股或大型股中。


    圖 4-11 中可以看到，股價在突破盤整區時量能的放大較為明顯。隨後的連續小陰線回落中，成交量相對縮小。結合股價處於低位置及短期內的量能縮放分析得出，這代表著主力拉升而非主力出貨，因此，這仍可被看作是震倉，我們在短線回檔中的低點可吸納籌碼。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_121_0.png)


    ## 4.5 主力拉升時常見的量價形態


    不同類型的主力有不同的拉升方式。中線主力持股數量較多、參與能力較強，拉升時往往也是不急不緩的，股價上升時間長、累計漲幅大；短線主力持股數量少，拉升時更需借助於市場力量。因為主力類型不同、參與能力不同、拉升風格不同，所以會展現出不同的量價形態。在本節中，筆者將講解主力拉升過程中，常見的幾種量價形態。


    ### 4.5.1 平臺式穩步上揚


    平臺式穩步上揚是中線主力常用的拉升方式。主力或許是因為在低位區進貨較為充分，或許是因系統性風險出現而沒能在高位出貨，所以手中持有大量的籌碼，當市場趨暖後，就有較強的拉升意願。


    此時，股價震盪著突破低位區間，溫和向上攀升，由於主力手中的籌碼多，市場上的籌碼數量就相對較少。此外，由於股價的上漲方式較為溫和，這對於散戶持倉者的賣出行為，也具有一定的抑制作用。基於這種狀況，股價上揚時的量能並不會明顯放大，而是呈「平臺式」攀升。


    這種平臺式攀升的形態只要未被打破，我們就可以耐心持股待漲。一旦股價累計漲幅較大，出現上漲加速、量能突然開始放大的情況，則說明主力參與能力開始減弱且有出貨意向，我們應逢高賣出、鎖定利潤。


    圖 4-12 中可以看到，股價先是處於中長期低位，隨後開始震盪上揚。如圖中的標注所示，在股價的持續上漲過程中並未出現放量，量能呈現出「平臺式」狀態。這是因為前期主力被套後的被動拉升，主力持股數量多、拉升阻力弱，因此股價有望衝擊前期新高。在實盤操作中，我們應耐心持股待漲。


    如圖 4-12 中的標注所示，隨著股價上漲進入高位區，此時的成交量突然放大、上漲速度加快，股價在盤中的上下波動的幅度也驟然增大。這種量價關係的突然轉變，再結合股價的累計漲幅來判斷，是主力開始出貨、市場浮額增多的訊號，預示著頂部的出現，我們應持股離場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_123_0.png)


    ▲ 圖 4-12 貴州輪胎 2018 年 6 月至 2019 年 6 月走勢圖


    ### 4.5.2 不等量式漲停啟動


    漲停板的短線衝擊力度無疑是最強的，它能夠激發市場的追漲熱情，很多主力往往喜歡借助於漲停板來實施快速、甚至是一氣呵成的拉升操作。股價的短線上漲勢頭強、漲幅大，主力借助於市場力量，因此不需要動用太多的拉升資金，就能成功拉升。對於散戶來說，不僅要瞭解主力的這種拉升方式，還需要從盤面上發現線索，進而在第一時間追漲買入，享受主力的拉升成果。


    一般來說，漲停啟動的拉升方式多出現在股價盤整之後，盤整區是主力進貨、加碼的區域。隨後，在某個交易日中，個股借助於良好的大盤氛圍，在盤中強勢上揚（多出現於早盤階段），連續的大單買盤向上推升股價，並且最終收漲停板。由於主力之前已買入較多籌碼，漲停板突破雖然可以全盤獲利，但市場多空分歧並不嚴重，漲停板時的量可能處於平量狀態，也可能在溫和地小幅放量，這種放量方式也反過來驗證了主力的參與能力。在實盤操作中，我們應在個股漲停板的第一時間買入。下面我們結合案例加以說明。


    由圖 4-13 此分時圖中可以看到，在早盤階段，股價出現了兩波連續的拉升，分時線流暢挺拔，這是主力的進貨、拉升行為的結果。在隨後的盤中高點，股價拒絕大幅回檔並且向上衝擊漲停板，結合股價當日正突破低位盤整區，以及此時的量能未明顯放大這一情況來看，如圖
    4-14 所示，可以發現主力的參與能力較強，股價有望以漲停板為啟動訊號迎來一波上漲走勢。在實盤操作中，我們應果斷地搶漲停板入場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_124_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_124_1.png)


    ### 4.5.3 先放量後縮量


    在拉升過程中，一些主力往住會因為起初的籌碼數量不夠，而在拉升初期進行進貨、加碼操作，此時的股價震盪上漲速度慢，主力力求降低持有成本。隨著主力持有數量的增加、參與能力的提高，個股在隨後的價格上揚過程中會出現相對縮量，量能明顯小於上揚初期。這種上漲方式雖與我們常接觸的「放量上揚」不符，但並不是升勢見頂的訊號。在實盤操作中，我們應多加觀察，只有當出現較為明確的反轉訊號時，才宜減碼或清倉離場。


    圖 4-15 中可以看到，股價上揚初期量能明顯放大，但隨著股價上揚的持續，成交量反而不斷縮減，這種縮量上揚的走勢緩慢。就中線交易來說，此時並不是賣出時機，圖中的後半部分股價高位放量滯漲，才是較好的頂部離場時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_125_0.png)


    ## 4.6 主力常見的整理方式及量價形態


    整理環節出現在主力進貨之後，雖然主力的買賣方式不同、參與能力不同，但此時的市場浮額已經明顯減少，因此，整理時的一個重要量能特徵就是「縮量」。當然，主力買賣股票是一個前後連續的過程，僅憑縮量，我們還無法判斷該量能特徵是否與整理行為有關。


    在實盤操作中，我們還需結合股價此前的運行特徵來綜合判斷。在本節中筆者將結合案例，講解常見的幾種主力整理方式及對應的量價形態。


    ### 4.6.1 平量式盤升平台


    平量式盤升平台，多出現在中線參與能力較強的主力的參與股中。股價以小陰線、小陽線（以小陽線居多）的方式極為緩慢地向上盤升，突破此前構築時間極長的震盪區間，全部的流通籌碼處於獲利狀態。這個盤升走勢構成了類似於「平台整理」的形態，但股價重心卻在上移。個股處於「盤升平台」時的成交量並沒有放大，呈現出一種「平量式」的狀態。


    這種量價形態往往是主力快速拉升前的一次緩慢整理行為，意在消耗那些持股時間短、短線拋售意願強的短線盤，從而為隨後的拉升減小阻力。在實盤操作中，這個平量式盤升平台，是我們中短線買入的好時機。


    圖 4-16 中可以看到，股價在突破長期整理區間時，出現了平量式盤升平台的形態，這是一個很顯著的量價關係，也側面表現出主力的整理行為，並預示了主力隨後的拉升行為。在實盤操作中，此時是中短線買入的時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_126_1.png)


    △圖 4-16 捲天高速 2018 年 12 月至 2019 年 3 月走勢圖


    ### 4.6.2 縮量下跌形態


    縮量下跌形態常出現在股價短線漲速較快時。此時，在中短線高點，出現了一波速度較快、量能快速縮減的下跌走勢。這一波快速下跌走勢的量能，與之前上漲波段的量能形成鮮明對比，表明下跌走勢並不是因為大量拋售而形成的。在實盤中，若股價此前的上漲較為強勁、走勢獨立於大盤，則此時的縮量快速下跌，具有更強的回檔含義。在實盤操作中，我們也可逢短線低點買入。


    圖 4-17 中股價震盪上揚，一波短線快速上漲，量能明顯放大，隨後出現了股價的快速下跌，下跌時量能急速縮減。結合同期大盤走勢來看，股價的震盪上行具有獨立性，有主力積極參與。股價此時的累計漲幅不大，透過股價的自然整理，在實盤操作中，我們可以逢低買入，積極投資。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_128_0.png)


    ▲ 圖 4-17 金晶科技 2018 年 12 月至 2019 年 3 月走勢圖


    ### 4.6.3 縮量式強勢整理平台


    縮量式強勢整理平台，常出現在參與能力較強的中線主力上，相應的個股往往有業績支撐，對股價的不斷攀升具有支撐作用。


    從盤面形態上來看，股價呈現橫盤走勢，在很長一段時間內股價波動幅度較小，短期內幾乎沒有什麼差價，且橫盤區間往往會出現成交量萎縮的情況，給人一種此股交投極不活躍的感覺。這是因為主力在此區間內既沒有出貨、也沒有拉升，散戶可透過股價的自然整理狀態時段，選擇充分換手。


    採取這種以時間換取空間的方法，主要針對市場中的絕大多數投資人沒有耐心的弱點，以達到淘汰一批持股者的目的。一般來說，平台整理的時間越長，股價上下振幅越小，表示整理得越徹底，之後股價上升的後勁就越大。


    圖 4-18 中可以看到，股價先是出現了獨立的攀升走勢，長陽線一舉向上突破了長期盤整平台。隨後，股價開始橫向震盪，且成交量大幅度減小，這就是主力拉升過程中的「縮量整理」形態，可以有效地消解缺乏耐心的短線盤，從而為隨後的拉升減輕阻力。在實際操作中，由於該股中線已有一定價格漲幅，我們在買入初倉時應控制好倉位，對於持股者來說，則應持股待漲。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_129_0.png)


    △圖 4-18 萬業企業 2019 年 8 月至 10 月走勢圖


    ### 4.6.4 下跌後的縮量收復


    股價的短線快速下跌伴以相對放量，可能是主力出貨所引發的，也可能是市場賣出湧現所引發的。如果想要判斷股價後期走勢，那麼我們應密切觀察股價短線下跌後的走勢特徵。若能夠出現縮量下跌的走勢，則表明主力參與能力依舊較強。在股價累計漲幅不大的情況下，我們仍可積極操作，或逢震盪回檔之機買入。


    圖 4-19 中可以看到，股價在一波放量下跌之後，出現了縮量，這是市場浮額較少、主力依舊有著較強參與能力的標誌。短線上，我們可以適當買入參與。隨後，股價短線上衝、加速上漲至前期盤整套牢區間時，量能突然大幅放大，股價在此位置點遇阻，我們在短線上宜賣出從而迴避風險。


    隨後，當股價二次回落時，可以看到又是一波縮量下跌走勢，主力並沒有快速出貨，在實盤操作中，我們可再度短線接回。實盤中的股價走勢往往一波三折，我們應結合量價關係的變化，而不斷調整買賣方向及倉位，力求降低風險、獲取更高的潛在收益。


