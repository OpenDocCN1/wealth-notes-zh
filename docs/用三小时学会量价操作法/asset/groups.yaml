    # 1. 量價圖有兩種——

    K線圖與分時圖


    「量、價、時、空」是技術分析的4大要素。「量」是指成交量，「價」則是由K線圖來表示，利用量與價的配合，再結合時間與空間兩個維度，我們就可以展開技術分析了，由此也展現了量、價的不可分離性。量價圖主要有兩種，一種是以一個交易日為時間單位的「日K線圖」，另一種是表現盤中即時成交情況的「分時圖」。在本節中，我們先結合案例，來認識一下兩種量價圖。


    # $1.1.1\quad$ 什麼是K線


    K線也常被稱為蠟燭線、棒棒線、酒井線等，它起源於300多年前的日本，起初是用於記錄米價漲跌情況的一種工具，因其直觀、立體，並且具有東方人擅長的形象思維特點，後來被應用到金融市場中，是投資人在證券交易分析中較早接觸的技術工具。


    K線中以「一個交易日」為時間週期的日K線最常用，一條K線可以大致反映當日的價格波動情況，它包含了4個價位，分別是開盤價、收盤價、最高價、最低價。


    +   1.  開盤價：開盤前為集合競價，確定開盤價。

    2.  收盤價：該交易日收盤時的價位。

    3.  最高價：該交易日盤中所出現的最高成交價。

    4.  最低價：該交易日盤中所出現的最低成交價。


    圖1-1為單條K線形態示意圖，單條K線可以分為兩種——陽線、陰線。陽線的收盤價在上方，收盤價高於開盤價，代表著股價上漲；陰線的收盤價在下方，收盤價'
  - '[PAGE 15]


    ![](img/ac68af843c2aeef3dbf55e10ca066163_15_0.png)


    價低於開盤價，代表著股價下跌。陽線多用紅色表示，陰線多用黑色或綠色表示。


    對於 K 線來說，開盤價與收盤價之間的矩形部分被稱為實體，實體上方的線為上影線，實體下方的線為下影線。


    一條日 K 線記錄的是在一個交易日內的股票價格變動情況，將每個交易日的 K 線以時間為橫軸、以股票價格為縱軸依次排列在一起，就組成了日 K 線圖，這也是反映股票價格變動情況的圖。


    # ### 1.1.2 認識成交量


    成交量以單邊的方式進行統計，這表示當日成交了 1000 股，即買方買進了 1000 股，同時賣方賣出了 1000 股。


    與成交量相關的概念還有成交額。成交額就是某檔股票每筆成交股數，乘以成交價格的金額總和。如果說成交量只是單純表現出這檔股票的交投活躍程度，那麼成交額則代表了這檔股票所涉及的資金量。同樣的成交量，如果股價越高，那買賣這檔股票所需要的資金就越多。成交額常用於大盤分析，它排除了因大盤中的各種股票價格高低不同所形成的干擾，也直接地反映出市場中參與股票買賣的資金量多寡。'
  - '[PAGE 16]


    # ### 1.1.3 量價圖就是K線圖


    在股票行情軟體中，量價圖也就是常說的日K線圖，是我們瞭解大盤、個股運行的視窗，它直接、清晰地呈現出股市及個股的運行情況。股票行情軟體很多，但操作方法基本相同。


    圖1-2為中國石油日K線圖，每一條K線都代表著一個交易日的價格波動，下方有相對應的柱形成成交量，柱形長短代表成交量的大小。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_16_0.png)


    # ### 1.1.4 以「分鐘」為週期的分時圖


    K線圖一般以「日」為時間週期，它是我們用於查看股票價格歷史走勢情況的圖。分時圖則以「分鐘」為時間週期，是我們用於查看每個交易日股票盤中價格，即時走勢情況的圖。


    圖1-3中，左側為該股的即時走勢圖，包括分時線、分時量、均價線，圖中右側顯示該股的掛單情況、成交細節等內容。


    1. 分時線是分時圖中最主要的部分。它以分鐘為時間單位，即時地反映出個股的盤中價格波動情況，是我們瞭解個股價格即時變化情況的視窗。分時線呈現了多空'
