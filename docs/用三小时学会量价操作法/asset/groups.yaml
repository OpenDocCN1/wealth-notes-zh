    ### 8.5 漲停突破點強勢放量整理（電子類股）


    漲停板，往往是主力強勢拉升股價的訊號，但也有些漲停板如曇花一現，若我們貿然追漲，將承受較大風險。漲停突破點強勢放量整理形態，是我們用來捕捉黑馬股的一種量價形態，它是指股價先以一個漲停板突破盤整區間，並在漲停板當日伴有明顯放量，這是股價突破時多空分歧加劇的結果。隨後數日，股價未出現回落，而是在漲停當日的收盤價附近強勢整理，整理期間量能保持放大狀態。


    漲停突破點是一個關鍵點，它是多空雙方爭奪的重要關口。強勢放量整理往往是主力進一步拉升前的加碼訊號。再結合股價之前處於低位盤整區間的狀態來看，一旦主力加碼完畢，則股價在主的積極拉升下，出現快速、大幅上漲的機率極大。在實盤操作中，這個強勢放量整理平台，是中短線入場的好時機。


    # 實戰案例：深科技


    圖 8-7 為深科技的走勢圖，股價於 2020 年 1 月 3 日以漲停板的方式，突破了長期整理平台。如圖 8-8 的分時圖所示，此時，我們還難以判斷主力的後續行為，無法確定其是繼續拉升，還是逢高賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_236_0.png)


    由隨後幾日的強勢整理且量能放大的情況來看，有資金在漲停價附近大力參與。在實盤操作中，這個較為短暫的強勢整理平台就是買入時機。一旦股價隨後以長陽線的方式突破這個平台，則該股成為黑馬股的機率極大，而且股價此时的累計漲幅很小，我們追漲所承擔的風險不大。這種潛在收益高、中短線風險低的商品，是值得我們重點投資的標的。


