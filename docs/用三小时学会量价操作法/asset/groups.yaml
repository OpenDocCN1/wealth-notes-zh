    ### 8.3 獨立股回落啟動點縮量盤整（電子類股）


    ![](img/ac68af843c2aeef3dbf55e10ca066163_232_0.png)


    價格強勢上漲、脫離於大盤震盪格局的個股，其中一定有主力在積極參與。但若股價在中短線獨立上漲之後，恰逢大盤出現了系統性的回檔，且回檔幅度較大，股價往往也會因此而出現大幅度下跌，甚至回落至上漲波段的啟動點附近，而這也給了我們買入的機會。


    在實盤操作中，可以借助於回落後的量價關係，來判斷主力是否在之前的高點位進行了出貨，及主力在當前低點的參與能力如何、市場實歷如何等等，來決定是否進行短線交易。


    股價在回落至上漲波段的啟動點附近後，一觸即發的反彈上攻走勢較為少見，更多的是持續的橫向震盪。若股價在反覆震盪之後能夠伴有明顯的縮量，則表示隨著震盪的持續，主力的能力得到了提高，股價也有望在主力的積極參與下，再度強勢上攻，恢復之前的獨立運行態勢。


    # 實戰案例 1：激智科技


    圖 8-4 為激智科技的走勢圖，圖中疊加了同期的創業板指，對比後可見，在大盤橫向滯漲時，該股價格獨立上揚、震盪攀升。隨後受大盤影響，股價再度回落至上漲波段的啟動點附近。此時的大盤走勢不穩，主力也沒有過於激烈的逆市拉升，而是讓股價隨大盤橫向整理。


    隨著整理的持續，我們可以看到該股成交量大幅縮減，這是市場實歷逐步減輕的標誌，也是主力參與能力仍舊較強的訊號。結合該股前體的獨立上攻行情，可以預測其價格隨後仍有望恢復上漲走勢。在實盤操作中，此時我們可以買股入場。


