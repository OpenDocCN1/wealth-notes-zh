    # 回檔走勢中的縮量，反映投資人心態


    ### 2.4.1 回檔走勢中的縮量成因


    縮量直接反映出了市場交投極為冷清，對於極度萎縮的成交量，我們可以將其稱為「地量」。縮量能更為真實地反映出市場交投行為的活躍程度。


    「漲時放量，跌時縮量」是股市和個股的普遍量價特徵，這與投資人的心理特徵有關。而這種心理特徵是建立在大眾買賣特點的基礎之上的，不因個別投資人的喜好、習慣而改變。


    漲時放量，是因為投資人在看到帳面有盈利時，往往有著較強的賣出意願，「獲利離場」、「擔心獲利回吐」是投資人在盈利後共有的心態，這也是散戶投資人在一檔股票中獲利很難超過
    30% 的原因。因為此時的股價一旦出現波動，投資人的賣出意願是極強的。因此，要想讓股價繼續上漲，必須要有更多的買盤入場承接才行。放量，正是買盤大量入場、獲利盤不斷賣出的標誌，可以說量能的大，也是支撐股價站穩於中短線高點，並繼續上漲的動力所在。


    下跌（或者短線回檔）的時候，情形則正好相反。持股者在看到獲利回吐或者短線被套的情形下，總是希望能夠等到股價反彈或行情反轉時再擇機賣出，有一種「惜售」心理。而且，對於場外的投資人來說，「買漲不買跌」是一種共識，大家都喜歡強勢上漲的股票，而對於那些弱勢下跌的股票，敢於抄底入場的投資人畢竟只是少數。基於這種情況，少量的賣出在沒有買盤入場承接的背景下，就會使股價下行，從而呈現出「縮量下跌」的局面。


    回檔走勢顯名思義，它出現在個股整體價格走勢呈震盪上行的背景之下。此時的縮量回檔可以看作是股價的一次短暫調整，由於短期內買盤的跟進速度較慢、力度不足，但並沒有打破市場上多頭力量的整體對比格局。因此，在股價累計漲幅不大、整體處於震盪上行走勢中時，這種回檔時的縮量並不是趨勢逆轉的訊號。相反地，縮量回檔後的低點，還是較好的中短線入場時機，特別是在大盤向上、個股價格走勢強勁的背景下。


    ### 2.4.2 上升行情回落縮量


    上升行情，是指個股的整體價格走勢為升勢的行情，將股價短期波動過程中的相鄰低點連接起來，可以得到一條向上傾斜的曲線，即上升趨勢線，該線與水平線的夾角為 45
    度時最為穩健。以此線為支撐，股價會震盪上行，呈現一波回落趨勢，而這僅是由於少量獲利賣出而導致的，所以會出現縮量回落的情形。當股價接近上升趨勢線時，將獲得較強的支撐，此時量能明顯縮減、短線做空力量消耗殆盡，這時就是中短線的逢低買入時機。


    圖 2-11 中可以看到，股價自低點位開始步入了升勢之中，股價在持續上漲之後出現了一波短線回落走勢。在回落過程中，量能不斷縮減，隨後再次放量使股價獲得了較強支撐，再度步入升勢。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_61_0.png)


    可以說，震盪上行走勢中的縮量回落，僅是一次短暫的整理，是對不穩定獲利浮額的一次整理，也給了場外投資人一次較好的逢低入場時機。當趨勢形成時，我們不宜過早地認為頂部即將出現，而應緊隨趨勢。當短線縮量回落時，若原有的上升形態依舊良好，則更宜將其看作是回檔，而不是股價走勢的反轉。


    ### 2.4.3 震盪回落波段縮量


    股價走勢呈寬幅震盪態勢，股價運行沒有明確的大方向，且股價在一波短線大幅上漲之後，出現了大幅的、相對快速的下跌，下跌時間能大幅縮減，這屬於震盪回落波段的縮量。


    一般來說，震盪回落波段的量能萎縮越明顯，則表明個股的空方力量越薄弱。股價的短線快速下跌，主要是由於主力不護盤、實盤入場不積極等導致的，因此，這類個股一般難以出現破位下行的價格走勢。當股價向下滑落觸及震盪區低點時，只需少量的抄底買盤入場即可止跌止穩，若有主力入場護盤，則出現一波強勢回升也是可能的。在實盤操作中，此時是一個較好的波段低點買入時機。


    圖 2-12 中，該股處於寬幅震盪走勢，在股價的一波快速回落中出現了量能的大幅縮減。在隨後的止穩走勢中，我們可短線買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_62_0.png)


    ▲ 圖 2-12 漢柯瑪 2019 年 1 月至 5 月走勢圖


    ### 2.4.4 回檔整理階段縮量


    短線回落之後，較多的持股者會遇到獲利回吐或短線被套的情況。此時，持股者拋售意願大大減弱，短線做空力量釋放得較為充分，常常出現縮量整理走勢。如果此時的股價，處於較好的上升行情中或中長期的低位區間，那麼只需少量的買盤入場就能引發股價的一波上漲。縮量整理既是股價短線止穩的訊號，也是隨後股價將出現反彈上漲的訊號，是一個短線入場的時機。


    圖 2-13 中可以看到，該股整體處於震盪上行的價格走勢之中，股價震盪幅度較大，此時的累計漲幅不大。如圖中的標注所示，股價短線回落的幅度較大，並且在相對低點出現了縮量止穩的走勢。結合股價的整體運行趨勢來看，縮量整理之後，股價有望再度回歸到原來的震盪上行趨勢中，這個縮量整理位置點，就是中短線買入點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_63_0.png)


    圖 2-14 可以看到，在橫向震盪走勢中，股價在箱體低點出現了縮量整理，對比此前的量能大小，此時的量能萎縮較為明顯，這是在股價經歷了橫向震盪之後市場浮額大量減少的訊號。結合股價原有的升勢特徵、累計漲幅不大等情形來判斷，主力或許在震盪區間進行了加碼操作。以此來進行綜合判斷可知，該股有望在主力的參與下出現突破行情。在實際操作中，此時是一個較好的買入點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_64_0.png)


    # 2.5 滯漲走勢，應結合整體價格走勢分析


    ![](img/ac68af843c2aeef3dbf55e10ca066163_65_0.png)


    ### 2.5.1 高位滯漲區的縮量的成因


    在高位區，一旦股價出現了明顯的滯漲走勢，由於缺少短線波動、短線盤交易不積極，因此多空雙方的競爭就會趨於緩和，從而出現縮量。


    對於滯漲走勢，我們可以結合個股的整體價格走勢特徵來解讀。若股價的累計漲幅較大、滯漲時間較長，且形態上打破了原有的上升格局，則此時的滯漲走勢多與主力的拉升意願較弱有關，甚至緣於主力的小量出貨行為。


    若股價累計漲幅不是很大，滯漲過程中也沒有出現股價重心的下移，則說明多空力量對比格局並未被完全打破，此時的滯漲多屬於整理環節，股價隨後將進一步突破上攻。


    在實盤操作中，我們一要結合個股的整體價格走勢，來分析高位滯漲區的縮量的成因，二要結合滯漲過程中的股價重心移動情況，以掌握多空力量對比格局的變化。這樣才能更完善地判斷當前的滯漲，究竟是屬於上升途中的「整理環節」，或是趨勢將反轉下行的「築頂環節」？


    ### 2.5.2 高位窄幅整理下移縮量


    當股價經歷了中短線大幅上漲而進入高位區時，若股價走勢呈滯漲、整理狀，股價重心隨著整理走勢的持續而緩慢下滑，且量能不斷萎縮，則表明主力無意再度拉升股價，而是正在進行小量出貨。這樣的個股一旦遇到大盤「跳水」或市場環境低迷，其抵禦風險的能力是極低的，其價格也易破位下行。在實盤操作中，我們應果斷賣出。


    圖 2-15 可以看到，股價中線漲幅大，在進入高位區後，股價重心緩緩下移，成交量不斷萎縮，這是小賣單源源不斷的典型盤面特徵，也是給我們的賣出訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_66_0.png)


    ### 2.5.3 高位震盪區縮量


    在中長期的高位區，個股整體價格走勢呈橫向震盪狀，上下震盪幅度較大，但此時的量能並沒有因股價的上下大幅波動而放大，反而出現了較大幅度的縮量。如果對比之前的上漲走勢，可以發現其量能呈極度萎縮狀態。


    一般來說，出現這種盤面特徵的個股，大多是有中長線強力主力參與的，主力在高位區的出貨打破了多空平衡，造成股價波動，但是投資人的高位承接意願極低，主力出貨也需要漫長的過程。極度低迷的成交量伴隨著股價的上下大幅度波動，表明市場浮額並不是很多，主力的參與能力仍舊較強。


    在股市做多氛圍濃郁的背景下，主力或許會進一步拉升股價，畢竟股價越高、主力越主動，但這種情形很少見。更為常見的情形是主力獲利幅度極大，而高位區出貨太慢，主力往往會大力出貨。因此，這類個股在大盤做多氛圍不強的背景下，出現股價破位下行的機率較大。


    圖 2-16 可以看到股價因利多消息，在幾次大漲之後進入了中長期高位區，累計漲幅極大。此時的股價走勢呈橫向寬幅震盪狀、上下波動幅度大，但同期的成交量卻有所萎縮。從股價走勢來看，主力無意拉升股價；從能量的角度來看，該股交投極度不活躍，主力在高位區出貨較為困難。同期的股市又較為低迷，成交量屢創近期新低，在這種市場環境下，這種在高位震盪區出現縮量的個股，其價格易破位下行，我們應及時賣出離場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_67_0.png)


    ### 2.5.4 強勢股整理區縮量


    高位整理區中的「高位」是一個相對概念，在股價累計漲幅不大的時候，若此時與起漲點的低點相比已有一定漲幅，但上漲幅度在一倍以內，這也是一個高位。但在這個位置點，主力可能不會出貨，因為此時既沒有足夠的出貨空間，也難以吸引跟風盤追漲買入。


    在這樣的位置點出現縮量漂浮形態時，若股價前期走勢獨立、上漲阻力較小，並且在橫向漂浮走勢中未出現股價重心下移的情形，則多是橫向的整理並非築頂，一旦多方力量積蓄完畢，新一輪的上攻行情會隨即展開。


    以圖 2-17 對照同期的大盤走勢，可以發現，個股前兩波的上漲走勢很獨立、強勢股特徵明顯。但每一波上漲幅度都不是很大，每一次突破上攻後股價都以橫向盤整的態勢出現，這使得股價的累計漲幅並不是很大。


    隨後，股價開始長時間的橫向整理，量能大幅縮減，基於該股之前的走勢特點，可判定這是整理階段。量能的大幅縮減代表著主力參與能力較強、市場浮額較少。在實盤操作中，我們可將此時的整理階段作為中短線入場點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_68_0.png)


    # 2.6 下跌趨勢的典型量價關係：跌勢無量


    ![](img/ac68af843c2aeef3dbf55e10ca066163_69_0.png)


    ### 2.6.1 下跌途中的縮量成因


    對於大多數個股來說，當其價格步入下跌後，其量能將持續地處於一種相對萎縮的狀態，「跌勢無量」是下跌趨勢中典型的量價關係。之所以如此，是因為當個股或股市步入跌勢後，財富效應消失，場外的投資人入場意願大大降低。


    場內投資人都希望能在更低的價位時進行抄底，此時只需少量的虧損盤「割肉離場」，就可以使股價降低，由此形成了縮量下跌的總體格局。只要跌勢中的量能一直保持縮減狀態，縮量下跌格局未被打破，則跌勢就不會輕易見底。


    此外，由於上升趨勢造成的個股估值普遍偏高，而價格又是圍繞估值上下波動，因此這也是價值回歸的過程。


    ### 2.6.2 破位下行時縮量


    股價在高位區間出現橫向震盪走勢時，若在其向下跌破盤整區時出現了縮量，則表示經歷震盪之後，空方佔據了主動地位，且場外買盤入場的意願極低，股價向下運行無支撐。這是股價步入下跌趨勢的訊號，也預示著股價隨後的中短線跌幅較大，在實盤操作中，我們應及時賣股離場。


    由圖 2-18 可以看到，股價在高位區出現了短期的盤整走勢。此時，趨勢運行不明朗，但是隨後的縮量破位則提示我們：股價已選擇了運行方向。


    # 用 3 小時學會量價操作法

    讓股票賺 3 倍


    ![](img/ac68af843c2aeef3dbf55e10ca066163_70_0.png)


    ### 2.6.3 下跌行進中縮量


    下跌行進中的縮量，代表空方依舊佔據主動地位，買盤入場不積極，此時，跌勢難以見底。在實盤操作中，我們此時仍應多看少動，靜待底部出現。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_70_1.png)


    圖 2-19 中，股價自高位區快速反轉向下，短線跌幅較大，下跌趨勢明朗。在下跌途中，出現了多條縮量小陰線，但這並不是賣壓減輕的訊號，我們應將其理解為買盤入場意願低。而且，下跌途中的多條縮量小陰線，是主力在下跌途中快速出貨的一種常見的買賣方式的展現，在實盤操作中，我們此時切不可抄底入場。


    ### 2.6.4 巨幅下跌後縮量


    巨幅下跌之後股價可能已中期見底，但也可能只是短期見底。在實盤操作中，我們一要看股價的累計跌幅，二要看縮量止穩時的股價重心變化情況。


    如果股票累計跌幅較大，且在縮量止穩時股價重心不下移，這往往是趨勢見底的訊號，我們可以逢低買入，耐心持有；在股票短線跌幅較大，但在累計跌幅不大的情況下，縮量止穩時又有股價重心下移的現象，則表示空方依舊佔據主動地位，此時的止穩並不是跌勢見底的訊號。在實盤操作中，我們可結合大盤實施短線博反彈的操作，但不宜進行中長線的買入操作。


    如圖 2-20 中的標注所示，股價的中期累計跌幅極大，在縮量止穩過程中，這是買盤陸續入場、賣壓減輕的標註，也是底部區多空力量對比格局發生轉變的訊號。因此，此位置區出現反轉上行趨勢的機率較大。在實盤操作中，我們可以積極買入，等待...


    ![](img/ac68af843c2aeef3dbf55e10ca066163_71_0.png)

    '
  mdcn: '

    ![](img/ac68af843c2aeef3dbf55e10ca066163_53_0.png)


    ▲ 圖 2-3 浙江富潤 2019 年 4 月至 11 月走勢圖


    此區間成為套牢區，中短線跌幅較大。隨後，股價反轉上行，當上漲至套牢區時，量能溫和放大。在短線獲利盤、套牢盤的雙重賣壓下，這種溫和式的放量止穩表明市場浮額較少，是股價能夠成功突破的訊號之一。


    ### 2.1.5 震盪反彈溫和式放量，應及時賣出


    在震盪下跌走勢中，股價的一波快速下跌之後，個股短期內處於超跌狀態，只要有一定的買盤入場，就可以推動股價反彈式上漲。此時出現的溫和式放量，僅代表股價的反彈式上漲，並不是大量買盤入場的訊號。


    一般來說，當底部出現時，會有一個反覆震盪的過程，若股價急速下跌的速度較快、幅度較大，能夠出現「V」形反轉的話，那麼其量能會連續大幅度放出，而不會溫和式放量。


    在實盤操作中，對於溫和式放量所引起的價格反彈式上漲的股票，我們是不宜追漲買入的；若股價中短線下跌幅度較大，溫和式放量之後，我們最好等股價短線再度回落後，才抄底入場。


    由圖 2-4 可以看到，該股在震盪反彈波段出現了幾次溫和式放量，量能放大幅度小。此屬於無量式反彈，代表著買盤入場不積極、反彈行情只是「曇花一現」。在實盤操作中，一旦股價短線滯漲，我們應及時賣出該股、規避新一輪的下跌風險。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_54_0.png)


    ▲ 圖 2-4 東方金鈺 2019 年 5 月至 8 月走勢圖


    當股價上漲到達寬震區箱頂位置點時，將受到雙重實壓阻隔，一是短線獲利盤實壓，二是箱頂位置附近的套牢盤實壓。因此，當在寬震區箱頂出現突兀式放量上漲時，表明此位置點的實壓極大，雖然有實盤入場推動股價上漲，但隨後量能突然恢復如初，意味著實盤入場力度減弱。股價在短線高點承接力度不足，量能放得越大，則短期內對多方力量的消耗越大，股價隨後的回落幅度也就越大。


    圖 2-6 中，該股的整體價格走勢呈寬幅震盪狀，在一波震盪反彈上漲中，股價到達箱頂阻力位。如圖中的標注所示，股價出現了突兀式的放量長陽線形態，放量效果明顯，達到了此前均量的
    3 倍以上；次日量能突然萎縮，是股價上攻受阻的訊號，預示著一波大幅調整走勢將展開。在實盤操作中，我們應賣股離場，從而規避短線風險。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_55_0.png)


    ▲ 圖 2-6 中國衛星 2019 年 3 月至 11 月走勢圖


    ### 2.2.4 回檔反衝突兀式放量


    回檔反衝是指，股價在第一次衝高之後出現了大幅回檔，隨後，股價二度上衝，接近前期高點時，成交量突兀式放大。


    回檔反衝過程中的突兀式放量是短線實壓沉重、股價難以突破上行的訊號。此外，在這一位置點的突兀式放量多與主力出貨行為相關，特別是在股價中期累計漲幅較大的情形下。在實盤操作中，我們一旦發現個股次日成交量大幅縮減、量呈現突兀式放大，則應考慮果斷賣出。


    圖 2-7 為波導股份走勢圖，股價一直在持續上漲並且創出新高。股價累計漲幅已經很大，隨後出現大幅調整、股價二度反衝，但同時出現了突兀式放量，這是一個中短線的賣股訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_56_0.png)


    ## 2.3 大單交易頻繁：連續式放量


    ### 2.3.1 連續式放量的成因


    從形態上來看，連續式放量至少能保持 3 個交易日以上，而且放量程度較為接近。在盤面上可以陸續看到較大的賣盤、買盤出現，盤中交投十分活躍、大單交易頻繁。連續式放量出現時，當日的成交量會顯著高於此前的均量，股價波動劇烈。


    連續式放量常出現在高位區，或一波快速上漲走勢中。但當連續式放量開始出現縮量時，往往就是中短線見頂的訊號。實盤操作中它是警惕我們的反轉訊號之一。


    ### 2.3.2 寬幅震盪連續式放量


    在股價處於上下寬幅震盪走勢中時，若成交量大幅度放出且放量效果較為接近，這就是寬幅震盪連續式放量。


    若股價中線累計漲幅較大，震盪中使得股價重心下移，則是出貨的訊號，我們應逢高賣出；若股價中線累計漲幅較小，震盪中使得股價重心緩緩上移，多預示著主力持有籌碼有所增加，後續有望進一步拉升股價。在實盤操作中，我們可以在震盪回落時的低點買入進行佈局。


    可以看到在圖 2-8 中，股價在脫離低位區時，頻繁出現漲停板，隨後股價震盪上行，且量能明顯放大，每個交易日的放量效果都較為接近，這就是連續式放量的特徵。考慮到股價中短線漲幅較小、主力成本較低，在震盪時，股價重心不斷上移，說明買盤力度更強。因此，若大盤配合，股價有望在主力參與下進一步上漲。在實盤操作中，我們應在震盪回檔時買股佈局。


    # 用 3 小時學會量價操作法

    讓我股票賺 3 倍


    ![](img/ac68af843c2aeef3dbf55e10ca066163_58_0.png)


    ### 2.3.3 短線飆升連續式放量


    短線飆升走勢中，出現連續式放量時的股價上漲並不具有持續性，股價的上攻走勢多為一波到頂，一旦量能開始縮減或者股價上攻受阻，我們應中短線賣出。特別是當這種短線飆升走勢，出現在股價累計漲幅較大的情形下時，股價隨後的下跌速度極快，下跌幅度往往也極大。


    圖 2-9 中出現了連續式放量上攻的形態特徵，如圖中的標注所示，高位出現了縮量、滯漲，這是一個明確的中短線賣出訊號。


    ### 2.3.4 橫向整理連續式放量


    在橫向的整理走勢中，股價上下波動幅度縮小，正常情況下，市場交投應有所減少，量能應有所縮減，若此時量能連續性放大且放大效果相近，則多與主力的出貨行為有關。一般來說，橫向整理走勢中的連續式放量，多出現在股價累計漲幅較高的高位區，看似個股交投活躍、承接資金踊躍，但通常是中短線見頂的訊號，主力往往在此時出貨。


    圖 2-10 可以看到股價累計漲幅大，一波回檔後，雖然股價處於短線低點，但從中長線角度來看，仍處高位區。此時的橫向窄幅整理卻引發了量能的持續性放大，這是一個短線下跌訊號，也預示著隨後的股價運行趨勢——破位下行。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_59_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_59_1.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_60_0.png)


    # 回檔走勢中的縮量，反映投資人心態


    ### 2.4.1 回檔走勢中的縮量成因


    縮量直接反映出了市場交投極為冷清，對於極度萎縮的成交量，我們可以將其稱為「地量」。縮量能更為真實地反映出市場交投行為的活躍程度。


    「漲時放量，跌時縮量」是股市和個股的普遍量價特徵，這與投資人的心理特徵有關。而這種心理特徵是建立在大眾買賣特點的基礎之上的，不因個別投資人的喜好、習慣而改變。


    漲時放量，是因為投資人在看到帳面有盈利時，往往有著較強的賣出意願，「獲利離場」、「擔心獲利回吐」是投資人在盈利後共有的心態，這也是散戶投資人在一檔股票中獲利很難超過
    30% 的原因。因為此時的股價一旦出現波動，投資人的賣出意願是極強的。因此，要想讓股價繼續上漲，必須要有更多的買盤入場承接才行。放量，正是買盤大量入場、獲利盤不斷賣出的標誌，可以說量能的大，也是支撐股價站穩於中短線高點，並繼續上漲的動力所在。


    下跌（或者短線回檔）的時候，情形則正好相反。持股者在看到獲利回吐或者短線被套的情形下，總是希望能夠等到股價反彈或行情反轉時再擇機賣出，有一種「惜售」心理。而且，對於場外的投資人來說，「買漲不買跌」是一種共識，大家都喜歡強勢上漲的股票，而對於那些弱勢下跌的股票，敢於抄底入場的投資人畢竟只是少數。基於這種情況，少量的賣出在沒有買盤入場承接的背景下，就會使股價下行，從而呈現出「縮量下跌」的局面。


    回檔走勢顯名思義，它出現在個股整體價格走勢呈震盪上行的背景之下。此時的縮量回檔可以看作是股價的一次短暫調整，由於短期內買盤的跟進速度較慢、力度不足，但並沒有打破市場上多頭力量的整體對比格局。因此，在股價累計漲幅不大、整體處於震盪上行走勢中時，這種回檔時的縮量並不是趨勢逆轉的訊號。相反地，縮量回檔後的低點，還是較好的中短線入場時機，特別是在大盤向上、個股價格走勢強勁的背景下。


    ### 2.4.2 上升行情回落縮量


    上升行情，是指個股的整體價格走勢為升勢的行情，將股價短期波動過程中的相鄰低點連接起來，可以得到一條向上傾斜的曲線，即上升趨勢線，該線與水平線的夾角為 45
    度時最為穩健。以此線為支撐，股價會震盪上行，呈現一波回落趨勢，而這僅是由於少量獲利賣出而導致的，所以會出現縮量回落的情形。當股價接近上升趨勢線時，將獲得較強的支撐，此時量能明顯縮減、短線做空力量消耗殆盡，這時就是中短線的逢低買入時機。


    圖 2-11 中可以看到，股價自低點位開始步入了升勢之中，股價在持續上漲之後出現了一波短線回落走勢。在回落過程中，量能不斷縮減，隨後再次放量使股價獲得了較強支撐，再度步入升勢。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_61_0.png)


    可以說，震盪上行走勢中的縮量回落，僅是一次短暫的整理，是對不穩定獲利浮額的一次整理，也給了場外投資人一次較好的逢低入場時機。當趨勢形成時，我們不宜過早地認為頂部即將出現，而應緊隨趨勢。當短線縮量回落時，若原有的上升形態依舊良好，則更宜將其看作是回檔，而不是股價走勢的反轉。


    ### 2.4.3 震盪回落波段縮量


    股價走勢呈寬幅震盪態勢，股價運行沒有明確的大方向，且股價在一波短線大幅上漲之後，出現了大幅的、相對快速的下跌，下跌時間能大幅縮減，這屬於震盪回落波段的縮量。


    一般來說，震盪回落波段的量能萎縮越明顯，則表明個股的空方力量越薄弱。股價的短線快速下跌，主要是由於主力不護盤、實盤入場不積極等導致的，因此，這類個股一般難以出現破位下行的價格走勢。當股價向下滑落觸及震盪區低點時，只需少量的抄底買盤入場即可止跌止穩，若有主力入場護盤，則出現一波強勢回升也是可能的。在實盤操作中，此時是一個較好的波段低點買入時機。


    圖 2-12 中，該股處於寬幅震盪走勢，在股價的一波快速回落中出現了量能的大幅縮減。在隨後的止穩走勢中，我們可短線買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_62_0.png)


    ▲ 圖 2-12 漢柯瑪 2019 年 1 月至 5 月走勢圖


    ### 2.4.4 回檔整理階段縮量


    短線回落之後，較多的持股者會遇到獲利回吐或短線被套的情況。此時，持股者拋售意願大大減弱，短線做空力量釋放得較為充分，常常出現縮量整理走勢。如果此時的股價，處於較好的上升行情中或中長期的低位區間，那麼只需少量的買盤入場就能引發股價的一波上漲。縮量整理既是股價短線止穩的訊號，也是隨後股價將出現反彈上漲的訊號，是一個短線入場的時機。


    圖 2-13 中可以看到，該股整體處於震盪上行的價格走勢之中，股價震盪幅度較大，此時的累計漲幅不大。如圖中的標注所示，股價短線回落的幅度較大，並且在相對低點出現了縮量止穩的走勢。結合股價的整體運行趨勢來看，縮量整理之後，股價有望再度回歸到原來的震盪上行趨勢中，這個縮量整理位置點，就是中短線買入點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_63_0.png)


    圖 2-14 可以看到，在橫向震盪走勢中，股價在箱體低點出現了縮量整理，對比此前的量能大小，此時的量能萎縮較為明顯，這是在股價經歷了橫向震盪之後市場浮額大量減少的訊號。結合股價原有的升勢特徵、累計漲幅不大等情形來判斷，主力或許在震盪區間進行了加碼操作。以此來進行綜合判斷可知，該股有望在主力的參與下出現突破行情。在實際操作中，此時是一個較好的買入點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_64_0.png)


    # 2.5 滯漲走勢，應結合整體價格走勢分析


    ![](img/ac68af843c2aeef3dbf55e10ca066163_65_0.png)


    ### 2.5.1 高位滯漲區的縮量的成因


    在高位區，一旦股價出現了明顯的滯漲走勢，由於缺少短線波動、短線盤交易不積極，因此多空雙方的競爭就會趨於緩和，從而出現縮量。


    對於滯漲走勢，我們可以結合個股的整體價格走勢特徵來解讀。若股價的累計漲幅較大、滯漲時間較長，且形態上打破了原有的上升格局，則此時的滯漲走勢多與主力的拉升意願較弱有關，甚至緣於主力的小量出貨行為。


    若股價累計漲幅不是很大，滯漲過程中也沒有出現股價重心的下移，則說明多空力量對比格局並未被完全打破，此時的滯漲多屬於整理環節，股價隨後將進一步突破上攻。


    在實盤操作中，我們一要結合個股的整體價格走勢，來分析高位滯漲區的縮量的成因，二要結合滯漲過程中的股價重心移動情況，以掌握多空力量對比格局的變化。這樣才能更完善地判斷當前的滯漲，究竟是屬於上升途中的「整理環節」，或是趨勢將反轉下行的「築頂環節」？


    ### 2.5.2 高位窄幅整理下移縮量


    當股價經歷了中短線大幅上漲而進入高位區時，若股價走勢呈滯漲、整理狀，股價重心隨著整理走勢的持續而緩慢下滑，且量能不斷萎縮，則表明主力無意再度拉升股價，而是正在進行小量出貨。這樣的個股一旦遇到大盤「跳水」或市場環境低迷，其抵禦風險的能力是極低的，其價格也易破位下行。在實盤操作中，我們應果斷賣出。


    圖 2-15 可以看到，股價中線漲幅大，在進入高位區後，股價重心緩緩下移，成交量不斷萎縮，這是小賣單源源不斷的典型盤面特徵，也是給我們的賣出訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_66_0.png)


    ### 2.5.3 高位震盪區縮量


    在中長期的高位區，個股整體價格走勢呈橫向震盪狀，上下震盪幅度較大，但此時的量能並沒有因股價的上下大幅波動而放大，反而出現了較大幅度的縮量。如果對比之前的上漲走勢，可以發現其量能呈極度萎縮狀態。


    一般來說，出現這種盤面特徵的個股，大多是有中長線強力主力參與的，主力在高位區的出貨打破了多空平衡，造成股價波動，但是投資人的高位承接意願極低，主力出貨也需要漫長的過程。極度低迷的成交量伴隨著股價的上下大幅度波動，表明市場浮額並不是很多，主力的參與能力仍舊較強。


    在股市做多氛圍濃郁的背景下，主力或許會進一步拉升股價，畢竟股價越高、主力越主動，但這種情形很少見。更為常見的情形是主力獲利幅度極大，而高位區出貨太慢，主力往往會大力出貨。因此，這類個股在大盤做多氛圍不強的背景下，出現股價破位下行的機率較大。


    圖 2-16 可以看到股價因利多消息，在幾次大漲之後進入了中長期高位區，累計漲幅極大。此時的股價走勢呈橫向寬幅震盪狀、上下波動幅度大，但同期的成交量卻有所萎縮。從股價走勢來看，主力無意拉升股價；從能量的角度來看，該股交投極度不活躍，主力在高位區出貨較為困難。同期的股市又較為低迷，成交量屢創近期新低，在這種市場環境下，這種在高位震盪區出現縮量的個股，其價格易破位下行，我們應及時賣出離場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_67_0.png)


    ### 2.5.4 強勢股整理區縮量


    高位整理區中的「高位」是一個相對概念，在股價累計漲幅不大的時候，若此時與起漲點的低點相比已有一定漲幅，但上漲幅度在一倍以內，這也是一個高位。但在這個位置點，主力可能不會出貨，因為此時既沒有足夠的出貨空間，也難以吸引跟風盤追漲買入。


    在這樣的位置點出現縮量漂浮形態時，若股價前期走勢獨立、上漲阻力較小，並且在橫向漂浮走勢中未出現股價重心下移的情形，則多是橫向的整理並非築頂，一旦多方力量積蓄完畢，新一輪的上攻行情會隨即展開。


    以圖 2-17 對照同期的大盤走勢，可以發現，個股前兩波的上漲走勢很獨立、強勢股特徵明顯。但每一波上漲幅度都不是很大，每一次突破上攻後股價都以橫向盤整的態勢出現，這使得股價的累計漲幅並不是很大。


    隨後，股價開始長時間的橫向整理，量能大幅縮減，基於該股之前的走勢特點，可判定這是整理階段。量能的大幅縮減代表著主力參與能力較強、市場浮額較少。在實盤操作中，我們可將此時的整理階段作為中短線入場點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_68_0.png)


    # 2.6 下跌趨勢的典型量價關係：跌勢無量


    ![](img/ac68af843c2aeef3dbf55e10ca066163_69_0.png)


    ### 2.6.1 下跌途中的縮量成因


    對於大多數個股來說，當其價格步入下跌後，其量能將持續地處於一種相對萎縮的狀態，「跌勢無量」是下跌趨勢中典型的量價關係。之所以如此，是因為當個股或股市步入跌勢後，財富效應消失，場外的投資人入場意願大大降低。


    場內投資人都希望能在更低的價位時進行抄底，此時只需少量的虧損盤「割肉離場」，就可以使股價降低，由此形成了縮量下跌的總體格局。只要跌勢中的量能一直保持縮減狀態，縮量下跌格局未被打破，則跌勢就不會輕易見底。


    此外，由於上升趨勢造成的個股估值普遍偏高，而價格又是圍繞估值上下波動，因此這也是價值回歸的過程。


    ### 2.6.2 破位下行時縮量


    股價在高位區間出現橫向震盪走勢時，若在其向下跌破盤整區時出現了縮量，則表示經歷震盪之後，空方佔據了主動地位，且場外買盤入場的意願極低，股價向下運行無支撐。這是股價步入下跌趨勢的訊號，也預示著股價隨後的中短線跌幅較大，在實盤操作中，我們應及時賣股離場。


    由圖 2-18 可以看到，股價在高位區出現了短期的盤整走勢。此時，趨勢運行不明朗，但是隨後的縮量破位則提示我們：股價已選擇了運行方向。


