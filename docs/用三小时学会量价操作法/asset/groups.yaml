    # 5.14 跌勢中巨量陰線後的反彈點，可能有下跌風險


    下跌途中的中短線買入機會會不多，且常出現在急速下跌之後，由於技術面要求及短線做空力量的減弱，常會有反彈行情出現。


    跌勢中巨量陰線後的反彈點形態，就是在跌勢中獲取反彈收益的一種量價形態。首先，股價的中短線跌幅已經較大，如果股價剛剛跌破高位整理區、距離最高點較近（少於 20%），則不宜參與。


    在下跌途中，股價以一條（或連續兩三條）巨量長陰線再探新低，長陰線當日的量能遠高於此前的均量水準，股價呈加速下跌狀。隨後，一旦股價走勢在數日內止穩，多預示著短期內的做空力量釋放過度，若同期大盤走勢相對穩健，則股價有望迎來強


    ![](img/ac68af843c2aeef3dbf55e10ca066163_154_0.png)'
