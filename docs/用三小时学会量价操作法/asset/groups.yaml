    # 8.8


    # 跳空漲停板放量平台（文化傳媒類股）


    跳空漲停板放量平台形態，是個股在利多消息的刺激下，主力快速建倉時所採取的一種方式。利多消息促使股價以跳空漲停板的方式，突破了平台區間，從而激發多空分歧。


    此時主力手中的籌碼不足，主力沒有選擇繼續拉升，而是讓股價在漲停價附近進行橫向整理。由於全盤獲利，且市場在對利多消息的解讀上存在分歧，主力可以積極'
