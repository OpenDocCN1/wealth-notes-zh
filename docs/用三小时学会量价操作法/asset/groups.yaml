    4. 隨後，股價快速上攻，一改前期緩慢攀升的格局。上漲方式的改變也預示著上升波段即將見頂，這正是主力借助於相對穩健的同期大盤走勢，而實施的再度拉升策略。此時的量能明顯放大，量能的大幅度變化也是多空對比格局變化的訊號，高位區預示著風險較大。


