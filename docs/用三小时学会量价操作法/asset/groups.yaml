    # 1.4.6 多空交替形態


    均線系統的多空交替形態，是指均線系統有時因一波上漲而呈多頭排列形態，而有時因一波下跌而呈空頭排列形態。多空交替形態常見於盤整震盪走勢中，是趨勢運行不明朗的標誌，也是多空雙方力量相對均衡的訊號。


    在股價走勢沒有發出明確的方向選擇訊號前，我們宜進行高賣低買的短線交易，即在均線系統呈現完全的空間排列形態並且股價位於盤整區低點時，可短線買入；隨後，一波上漲之後，當均線系統呈現完全的多頭排列形態，且股價處於盤整區高點時，可獲利賣出。


    在圖 1-26 中，股價在高位區震盪瀰漫之後開始向下破位，短線跌幅較大，此時的大盤仍舊處於橫向震盪之中，並且沒有系統性風險。因此，股價步入快速下降通道的機率較小，此時出現的止跌止穩可以作為一個短線買入點。'
