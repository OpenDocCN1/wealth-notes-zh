    ### 8.4 震盪上行區間整體縮量（醫藥製造類股）


    震盪上行區間整體縮量形態，是一種主力參與下的盤面形態，股價以震盪的方式向上運行。這個震盪區間可能出現在創新高的一波上漲中，也可能出現在大幅調整後的反彈波段中。雖然震盪期間的上下震盪幅度較大，但成交量卻較之前的均量明顯縮小。震盪上行時的整體式縮量形態，表示主力持股數量多、參與能力強。若此時的股價累計漲幅不大，後期仍有較為充裕的上行空間。在實盤操作中，我們可以達股價震盪回檔低點時買入。


    # 實戰案例：興齊眼藥


    圖 8-6 為興齊眼藥的走勢圖，股價在短線大幅調整後開始震盪上行，震盪期間的量能大幅度縮減。結合該股此前較為獨立的攀升走勢來看，主力仍參與在其中，且持股數量多。對於該類有強主力參與的股票，我們應及時達震盪回檔的短期低點買入，並耐心持有。


