    ## 3.4 趨勢中的跌勢及反彈量能特徵


    ![](img/ac68af843c2aeef3dbf55e10ca066163_90_0.png)


    「漲時有量，跌時無量」，下跌途中的縮量或者不放量，是跌勢持續的重要訊號。股價重心下滑、量能未明顯放出、股價走勢未見止穩，一般來說多預示著跌勢仍將持續下去。在本節中，我們將結合實例來看看跌途中常見的量價關係。


    ### 3.4.1 跌途無量


    震盪下滑的股價伴以量能的相對縮小，這是整個下跌趨勢中最主要的量價形態，特別是在累計跌幅不大的情形下，若個股仍以這種量價形態為主，則不可抄底入場。


    圖 3-17 的股價自高位破位下行，步入跌勢。如圖中的標注所示，連續下跌使得股價重心緩緩下移，同期成交量保持著一種相對縮小的狀態，這時的縮量下跌表示跌勢仍會持續較長時間。在實盤交易中，對於中短線投資人來說，這個位置點不宜進入。


    隨著累計跌幅的擴大，股價運行止穩，最重要的是量能大幅放大，這才是階段性底部出現的訊號，也是中短線投資人獲取反彈行情利潤的入場時機。


    ### 3.4.2 不放量弱勢反彈


    跌勢並不是「一測到底」的，與上升趨勢相同，它也是一個反覆震盪的過程，在下跌途中會伴有反彈波段。反彈與反轉不同，反彈只是市場短線超跌引發的短暫行情，並不是由多空力量對比格局轉變而引發的。因此，反彈時的量能一般不會放得過大，反彈常常以無量（或者是相對不放量）的形式出現，這也是我們用來辨識反彈與反轉的重要特徵。


    由圖 3-18 可以看到，在下跌途中股價出現了震盪止穩走勢。如圖中的標注所示，在股價的短期上漲波段中，成交量未見放大，這是買盤入場量較少的標誌，預示著此波上漲趨勢的性質屬於反彈，而非反轉。


