    # 5.4


    # 「紅三兵」是可靠的上攻訊號


    「紅三兵」是指連續 3 條中小陽線的 3 日 K 線組合。一般來說，紅三兵代表著多方力量佔據優勢，是上漲訊號；但在某些時候，紅三兵發出的訊號並不是上漲訊號。為了確保紅三兵形態的準確性，我們還要結合
    K 線整體運行形態及量能變化來判斷。當溫和放量的紅三兵出現在盤整區的突破位置點時，就是一個可靠的上攻訊號。它代表著買盤積極入場、多方力量充足，是即將展開一輪上攻行情的可靠訊號。


    圖 5-6 中可以看到，股價在中短期大幅下跌後的低點，出現了橫向震盪走勢。隨後連續 3 條溫和放量的小陽線，使股價開始向上突破震盪區。這就是突破點溫和放量紅三兵形態，也是買盤入場積極、股價有望展開上攻走勢的訊號。在實盤操作中，由於此時的股價中短線的漲幅均較小，因此我們可以追漲買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_141_0.png)'
  - '[PAGE 142]


    # **5.5 回檔後的縮量整理平台，主力隨後快速拉升**


    ![](img/ac68af843c2aeef3dbf55e10ca066163_142_0.png)


    放量盤升後回檔點縮量平台是一個組合形態，它由兩個局部形態構成。首先是溫和放量並且股價慢向向上攀升，一般來說，這種走勢具有一定的獨立性，強於同期大盤，往住是個股有主力資金積極參與的訊號。隨後，受大盤回落影響，股價沒能在短線高點止穩，而是順勢回落至前期起漲點附近，此時做橫向窄幅整理，量能大幅縮減。


    這種形態的出現常與主力的行為相關。只要股價當前處於累計漲幅不大的位置點，一般來說，隨後會有較大的上漲空間，而這個回檔後的縮量整理平台，常常就是主力快速拉升前的一個過渡階段。在實盤操作中，此縮量平台是中短線入場的好時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_142_1.png)


    ▲圖5-7 北京城鄉2018年10月至2019年5月走勢圖'
  - '[PAGE 143]


    圖 5-7 中可以看到，股價在中短線回落幅度較大的相對低點，先是出現了持續的橫向窄幅整理。隨後，股價向上緩慢攀升，形成了一個放量盤升平台。這期間的走勢，該股明顯強於同期大盤，具有一定的獨立性，標誌著主力積極參與此股，獨立上漲的放量盤升平台，更有可能是主力積極的進貨行為所形成的。


    隨後因大盤短線下跌，股價順勢回落，跌回至起漲點附近。此時出現了縮量窄幅運行的整理走勢，這是大盤震盪給我們創造的一次短線入場良機，應把握住入場機會。


    # 5.6


    ![](img/ac68af843c2aeef3dbf55e10ca066163_143_0.png)


    # 穿越型的長陽線，

    可以積極買入佈局


    平量長陽突破寬震區形態，是指股價走勢在多個交易日內形成的長陽線、長陰線交替出現的寬震格局。雖然每個交易日的股價盤中振幅較大，但由於長陰線、長陽線交替出現，所以股價重心並未向上移動。此時，一條實體更長的陽線以平量方式，向上穿越了這個寬震區，股價也達到了近期小高點，較高的收盤價使得寬震區的籌碼均處於獲利狀態。


    穿越型的長陽線是多方積極做多的標誌，平量則代表主力資金實力較強。如果股價的中短期漲幅較小，或者股價處於未啟動狀態，則多預示著有望展開一輪上攻行情，在實盤操作中，我們可以積極買入佈局。


    圖 5-8 中可以看到，該股緩慢攀升的價格走勢十分穩健，在攀升區的突破點，形成了一個長陽線、長陰線交替出現的寬震區，這是多空產生分歧的區域，也是股價運'
  - '[PAGE 144]


    行方向將明確的標誌。隨後的平量長陽線突破形態，表明股價的運行方向是向上，在實盤操作中，我們應跟隨訊號，積極買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_144_0.png)


    # 5.7

    縮量雙（三）探低形態，

    有望展開上攻行情


    縮量雙（三）探低形態，是指股價出現了類似於「W」的二次探低（或者三次探低）的震盪走勢，在整個震盪過程中，成交量逐漸減少。'
  - '[PAGE 145]


    無論是第二次回探震盪區低點，還是第三次回探震盪區低點，成交量都比前一次回探震盪區低點有所縮減，這說明股價破位下行的做空力量逐漸減弱。如果此時股價的震盪區處於中線低點，那麼這種量價形態可以被看作是多方力量轉強、空方出貨無力的標誌，預示著隨後有望展開突破上攻行情，當二次（或三次）回探震盪區低點時，便是很好的中短線入場點。


    圖 5-9 的股價在中期低位區間出現了橫向震盪走勢。這期間的成交量隨著震盪的持續而不斷縮減，第二次回探震盪區低點時是一個買點，但此時的股價仍有破位下行的可能。因此，我們可以透過控制倉位的方式來降低風險。但當股價第三次回探震盪區低點時，成交量已明顯縮小，且構築了一個低點整理平台，止穩訊號明顯。此時可以加大買入力度，從而獲取多空力量轉變後的反轉行情帶來的利潤。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_145_0.png)


