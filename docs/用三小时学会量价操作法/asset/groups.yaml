    # 早盤15分鐘內快速上漲的二次漲停板


    追漲是最為重要的一種操作漲停板的方式，一般來說，個股的封板時間越早、漲停板鎖得越早牢固，代表主力當日的拉升意願就越堅決，是股價中短期內上漲潛力更大、上漲勢頭更強厲的標誌。但若股價只以一波快速上漲就牢牢封住了漲停板，則參與搶漲停板的操作難度較大，投資人應該對個股的整體走勢有一個清晰的判斷，並冷靜觀察個股當日的盤中表現。


    當投資人以漲停板價位搶到籌碼後，股價很可能無力強勢鎖住漲停板，因為這種上衝擊漲停板的走勢，其根基有可能不是很牢固，很可能存在快速轉向的風險。


    早盤 15 分鐘內快速上漲的二次漲停板形態，是一種很好的漲停板形態，它是指股價在早盤開盤後便快速地大幅度上漲，並向上衝擊漲停板，但是股價並沒有在第一次衝擊漲停板後就強勢鎖住漲停板，而是在漲停板價位附近略做整理（分時線站於均價線上方）。隨後，股價在第二次衝擊漲停板時強勢鎖住漲停板，直至收盤。一般來說，對於股價第二次能否強勢鎖住漲停板，我們是比較容易判斷的，可以結合個股之前的
    K 線走勢形態、當日是否有利多消息等因素來分析，如果個股有這些因素的配合，則第二次漲停板走勢的出現多是主力做多意願的真實體現。


    再舉一個案例，圖 7-35 中可以看到，當日股價在早盤高開後快速衝擊漲停板，但是第一次並沒有牢牢鎖住，而是在第二次鎖住漲停板時才強勢封牢，這給了我們一定的思考時間決定是否參與追漲買股操作。


    結合該股前期的突破走勢，及當時市場中熱度較高的環保類題材，我們可以較為準確地判斷：當日的分時圖形態，是主力資金開始參與該股並有強勢拉升意願的表現。因此，在實盤操作中，我們可以在股價即將第二次鎖住漲停板時，快速地以漲停板價位掛單買入，進行搶漲停板的操作。'
