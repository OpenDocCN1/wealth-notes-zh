    ## 8.10 啟動前的逆市放量震盪平台（紡織服裝類股）


    啟動前的逆市放量震盪平台形態，是指股價在突破啟動過程中，受到大盤系統性下跌的影響。在突破位置點，上下寬幅震盪、伴有量能放出，震盪期間伴有漲停板出現。


    這種盤面形態是個股獨立性較強的標誌，強勢的放量震盪平台區是主力在其中積極拉升、但受到市場賣壓的標誌，主力也因大盤的回落而使得自己持股數量增多、持有成本升高。在這種形態中，震盪平臺區的放量一定要很充分，量要遠大於前期均量，只有這種量能效果，才能顯示出主力的強力加碼行爲。如此一來，一旦大盤止穩，主力爲了資金安全，多會強勢拉升，從而使得股價快速脫離其成本區域。而這個放量震盪平臺區也就是我們買入的好時機。


    ### 實戰案例：*ST 中鋰


    圖 8-13 為 *ST 中鋰的走勢圖，圖中疊加了同期的深證成指。如圖中的標注所示，在股價以漲停板的方式突破平臺區時，因大盤回落，股價加速突破未成功，期間成交量大幅放出，股價上下震盪，這是主力強力加碼行爲的表現。隨後大盤止穩時，主力多會選擇繼續拉升。在實盤操作中，此震盪平臺區就是我們逢回檔低點買入的好時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_244_0.png)


    ## 8.11 漲停震盪平台溫和放量區（航空類股）


    ![](img/ac68af843c2aeef3dbf55e10ca066163_245_0.png)


    在大幅下跌後的低點或當股價突破低點平台時，先是出現了一個漲停板，隨後，股價以這個漲停板價位作為支撐，持續橫向震盪。在震盪過程中，股價上下波動較為明顯，成交量溫和放大，整個震盪區的持續時間較長。


    這種量價形態可以被視作主力資金緩慢進貨的市場行為。一個漲停板引發了市場分歧，在隨後的震盪走勢中，股價重心緩緩上移，表示實驗資金入場積極，一旦主力完成進貨，股價就會加速脫離這個震盪區，打開上升空間。


    ### 實戰案例：海特高新


    圖 8-14 為海特高新的走勢圖，股價在中短線大幅下跌之後，開始止穩。先是以一個漲停板進行拉升、引發多空分歧，隨後的溫和式放量震盪走勢，則是主力入場進貨的表現。在實盤操作中，在識別出這種盤面形態後，我們可以在股價震盪回落的時候買入，既可以避免短線被套，又可以耐心等主力拉升、股價突破上行。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_246_0.png)


    ## 8.12 弱勢漲停板少量突破低位震盪區（醫藥製造類股）


    弱勢型的漲停板是指，股價在漲停板附近反覆震盪並沒有牢牢鎖住。在這個盤中高點、接近漲停板的位置點，多空換手頻繁，至尾盤階段，股價才以漲停板收盤。


    當股價以弱勢型的漲停板向上突破低位震盪區時，由於獲利浮額較多，且股價長時間不鎖住漲停板，因此勢必會加強投資人的拋售意願，從而出現較大幅度的放量。


    但若股價以這種漲停方式突破時，量能僅是小幅度放出，略高於前期的均量水準，則表示已有主力參與其中，市場浮額不多、獲利賣壓輕。結合股價剛剛突破低位震盪區、上升空間已完全打開的情形來看，個股有望成為中短線翻倍黑馬股，在實盤操作中，我們應在第一時間追漲買入。


    ### 實戰案例：達安基因


    圖 8-15 為達安基因的走勢圖，股價的中線跌幅較大，短期內處於低位震盪區間。股價於 2019 年 8 月 19 日以漲停板突破低位震盪區，這是一個溫和放量型的弱勢漲停板，如圖
    8-16 所示。


    綜合股價走勢來看，主力此時已有一定的參與能力，股價突破時沒有引發較大賣壓，短線上攻才剛剛展開，股價馬上出現回檔的機率不大。在實盤操作中，我們應順應股價的這種突破走勢，在第一時間追漲買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_247_0.png)


    ## 8.13 平台式突破震盪區（機械類股）


    ![](img/ac68af843c2aeef3dbf55e10ca066163_248_0.png)


    平台式突破震盪區形態，是指股價在低位區出現了持續一段時間的橫向震盪走勢，隨後，股價開始向上突破，在突破過程中，成交量未見明顯放大，與之前震盪時的均量水準相當，這就是所謂的「平台」。


    平台式突破可以被看作是主力持股數量較多、參與能力較強的標誌。由於股價剛剛突破低位震盪區，在強勢主力的積極參與下，股價隨後的上升空間值得期待，個股有成為翻倍黑馬股的潛質。在實盤操作中，我們可以在股價平量突破後的第一時間追漲買入；也可以再觀察一段時間，等股價短線出現回檔時，再擇機買入。


    ### 實戰案例：威海廣泰


    圖 8-17 為威海廣泰的走勢圖，股價在突破低位震盪區時，呈「平量」狀態，這是主力持股數量多的標誌。若出現了一波上揚持續時間較長但漲速緩慢，在短線高點有連續長陰線回檔的走勢，則此時的短線回檔點就是我們買入的好時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_249_0.png)


