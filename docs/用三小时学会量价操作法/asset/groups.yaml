    此區間成為套牢區，中短線跌幅較大。隨後，股價反轉上行，當上漲至套牢區時，量能漲溫和放大。在短線獲利盤、套牢盤的雙重賣壓下，這種溫和式的放量止穩表明市場浮額較少，是股價能夠成功突破的訊號之一。


    # 2.1.5 震盪反彈溫和式放量，應及時賣出


