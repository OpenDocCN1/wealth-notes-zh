    ## 7.10 向上試盤型溫和放量，當日不是最好的入場時機


    ![](img/ac68af843c2aeef3dbf55e10ca066163_202_0.png)


    主力在拉升股價時，往往會採取試盤的方法，「向上試盤」就是一種常用的方法。它的形成過程是這樣的：在盤中交投較為平靜的背景下，主力突然拉升股價，拉升時間往往在幾分鐘內結束，拉升幅度大多在
    5% 以內；隨後，主力放棄拉升，讓股價在盤中高點自然回落。透過股價的回落方式、回落速度、回落幅度，主力可以大致瞭解市場獲利賣壓情況，從而決定是否繼續實施拉升計畫。


    如果在回落時，分時線能夠以均價線為支撐或者圍繞均價線運行，且當日放量溫和，那麼這是試盤效果較為理想的訊號。股價隨後稍做整理，主力對其進行拉升的機率較大，一輪上漲行情有望出現。


    在實盤操作中，試盤當日往往並不是最好的入場時機，我們可以再觀察幾日，若隨後幾日能夠保持強勢整理的態勢，則可以買入，等待主力拉升；反之，若隨後幾日走勢較弱，則從短線角度來看，暫不宜參與。


    值得注意的是，「試盤」應出現在主力「進貨」與「拉升」兩個環節之間，因此我們要結合個股的日 K 線圖，來判定在個股盤中出現的是否為試盤線。若此前沒有明顯的進貨區間，即使當日的盤面形態相似，也不可將其認定為試盤線。


    圖 7-13 中可以看到，股價剛剛跳出低位盤整區，當日小幅高開後隨即上衝，但在盤中高點未獲支撐，股價順勢下滑。從成交量來看，市場賣壓並不沉重，當日量能溫和放大。在隨後幾日，股價強勢整理，這是短線入場較好時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_203_0.png)


    ▲ 圖 7-13 深南電A 2019 年 6 月 11 日分時圖


    ## 7.11 「向下試盤」是主力以拋售大單快速出貨


    「向下試盤」是主力透過拋售幾筆大單的方式，來快速出貨的行為，這會使得股價大致呈直線下跌。隨後，主力不再出貨，以此判斷多方的承接能力，看看在股價快速下跌之後，究竟是恐慌性的賣盤更多，還是抄底性的買盤更多。


    若股價能夠震盪回升至均價線上方，或者股價下跌後無恐慌盤賣出，則預示著試盤成功。由於實壓很輕，當日會呈現縮量狀態（這與向上試盤時的溫和放量不同），隨後股價有望在主力的拉升下不斷上漲，在實盤操作中，此時我們可以短線買股入場。


    圖 7-14 從日 K 線圖走勢來看，股價正處於調整後的低位盤整之中，短期內有震盪突破的趨勢。如圖中的標注所示，開盤後，突然出現了幾筆大賣單使得股價快速下挫，在大賣單出現後的幾分鐘內，分時量異常放大，隨後，市場又恢復了正常的交投狀態，股價也震盪回升至均價線上方。


    盤中出現這種走勢即表示，在主力向下試盤的過程中，並沒有引發恐慌性賣出的離場，這是該股籌碼鎖定程度良好的標誌，也預示了隨後股價極有可能在主力的拉升下突破上行。在實盤操作中，此時我們可以短線買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_204_0.png)


    △圖 7-14 中航魯通 2019 年 10 月 23 日分時圖


    ## 7.12 單筆大量買單，是主力有意拉升的訊號


    ![](img/ac68af843c2aeef3dbf55e10ca066163_205_0.png)


    有效推升的單筆大量買單形態，是指股價在盤中平穩運行時，多處於小幅上漲狀態，盤中出現了一筆或連續幾筆高價大買單，使得股價突然躍升了兩、三個百分點。隨後，股價在盤中高點強勢地橫向運行並且不回落，當日的量能呈溫和放大形態。


    這種盤面形態展現了兩個市場含義：一是，突然出現的大買單使得股價有效上漲，因此，這個大買單並不是大戶的隨機性買入；二是，市場短期內的獲利賣壓較輕。綜合這兩個方面的含義來看，若股價處於中短線的低點位，則它是主力有意拉升的訊號，預示著短線上攻行情的展開，此時我們可以買入。


    圖 7-15 中可以看到，股價處於短線盤整的位置，短期內走勢已止穩回升，當日盤中小幅上漲 2 個百分點，午盤後，單筆大買單有效推升了股價。從盤面形態來看，這一分鐘的分時量放得非常大，股價在突然上漲了約
    5 個百分點後也能強勢止穩。這是主力拉升的訊號，此時的反彈幅度很小，一旦主力開始拉升，股價仍有較為充裕的上漲空間。在實盤操作中，我們可以進行買入操作。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_205_1.png)


    ▲圖 7-15 深紡織A 2019 年 9 月 2 日分時圖


    ## 7.13 盤中漲停板進貨，是主力資金在買賣短線黑馬股時常用的手法


    ![](img/ac68af843c2aeef3dbf55e10ca066163_206_0.png)


    盤中漲停板進貨，是主力資金在買賣短線黑馬股時常用的手法之一，主力一般將其用在有熱門題材支撐，且基本面良好、前期價格未出現大幅上漲的個股上。此時，為了迎合熱門題材，主力往往會借助於漲停板來製造多空分歧，於漲停板上大力買入，隨後快速拉升，實現漲停進貨、漲停拉升一體化的飆升格局。對於散戶來說，能否正確地辨識漲停板進貨形態，將直接決定其短線追漲的成功率。


    一般來說，個股在早盤階段即強勢漲停板，但未牢牢鎖住，中短線獲利浮額在看到漲停板無法鎖住後，往往有較強的賣出意願，而真正的主力資金則會藉此機會大力買入。鎖住漲停板後，為達到充分進貨的目的，個股在漲停板上會多次打開，但因主力的積極買入。從日
    K 線圖來看，當日成交量明顯放大，但不會出現天量。


    當然，僅從漲停當日的盤面形態來分析只是一個方面，此外我們還要關注漲停次日的開盤情況。若主力短線拉升意願強，又於漲停價位買入較多籌碼，則主力多會利用股價上漲慣性強力拉升，以脫離自己的成本區。在漲停進貨次日，股價多會呈現小幅開高，開盤後主力因積極參與、強勢拉升，從而快速脫離成本區。


    基於以上兩個方面（漲停當日的盤面形態、漲停次日的開盤情況），再結合個股的題材面，我們可以較為準確地判斷出，主力是否進行了漲停進貨操作，從而確定追漲的可行性。


    圖 7-16 中可以看到，當日股價一舉突破了前期盤整平台，午盤後快速鎖住漲停板，在盤中高點交投活躍，漲停之後多次打開，當日量能明顯放大。綜合該股的日 K 線走勢，可以判斷出主力進行漲停進貨操作的機率較大。


    到了次日，如圖 7-17 所示，可將該股開高走高的盤面形態作為進一步的驗證，在實盤操作中，次日股價開盤衝高後回落至均價線附近時，就是一個較好的短線追漲入場點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_207_0.png)


    △圖 7-16 “ST 沈機” 2019 年 8 月 29 日分時圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_208_0.png)


    ▲圖 7-17 ‘ST 沈機 2019 年 8 月 30 日分時圖


    ## 7.14 衝高跌至均價線下方，與主力出貨有關


    ![](img/ac68af843c2aeef3dbf55e10ca066163_208_1.png)


    均價線代表著盤中的支撐與阻力。股價在盤中，特別是在早盤階段，快速上衝後，若出現放量跳水式下行並直接跌至均價線下方，則多表明之前的上衝可能與主力的拉升出貨有關。


    主力在個股早盤開盤不穩定時，快速將股價拉升到一個高點位，隨即大量拋售，股價迅速下滑，持股者難以成功賣出。當發現股價已遠離盤中最高點時，持股者往往會產生惜售心理，希望在隨後的盤面中的賣出價位可以與最高點接近。主力正是利用持股者的這種心理，降低盤面賣壓，而自己則悄悄出貨。


    圖 7-18 中的股價早盤快速衝高，但隨即跳水至均價線下方，跳水時量能明顯放大，這是資金撤出的訊號。一般來說，股價在盤中直線跳水幅度大、有明顯放量且經過一波跳水後直接跌破均價線，就是強弱轉化的明確標誌，常與主力的出貨行為相關，預示著中短線下跌走勢的開啟，隨後股價在盤中很難再出現強勢反彈。


    在實盤操作中，當我們發現這種形態後，應第一時間或等股價反彈至均價線附近時，賣股離場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_209_0.png)


    ## 7.15 45度角放量下行，是趨勢反轉的訊號


    ![](img/ac68af843c2aeef3dbf55e10ca066163_210_0.png)


    盤中 45 度角放量下行形態，是主力資金持續撤出時的重要盤面形態之一，它的形態特徵是分時線呈 45 度角，且股價不斷下滑。這種運行態勢的持續時間較長，至少會保持半個交易日，並且隨著股價的下滑，分時量也同步地不斷放大。


    45 度角放量下行常出現在午盤之後，且會一直運行至收盤，這使得收盤價接近當日最低點。


    相對於盤中穩步攀升、放量走高的形態來說，下行時的放量則更為真實，因此，這種放量的 45 度角下行也表現了做空力量的強大，是隨後個股或有大幅下跌行情出現的訊號。在實戰中特別要注意的是，如果股價的中短線漲幅相對較大，在高點出現這種
    45 度角放量下行形態，往往是趨勢反轉的訊號。股價短線回落後，此時我們不宜抄底入場，因為後期的下跌幅度將更大。


    圖 7-19 中可以看到，當日股價處於中短線漲幅較大的高點位，早盤衝高，隨後走勢出現轉變，股價開始震盪下行，呈 45 度角放量下行，一直持續到收盤。在下行過程中，可以看到量能明顯放大，這是場內資金大量撤出的訊號，且此時的股價正處於中短線高點，在實盤操作中，我們應及時賣出該股以迴避風險。


    相同的盤面形態總是預示著相同的未來走向。如圖 7-20 所示，在 2019 年 11 月 11 日股價開盤後，便呈 45 度角放量下行，當日也處於短線高點，可見主力運用了同樣的出貨手法。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_211_0.png)


    △圖 7-19 英特集團 2019 年 10 月 17 日分時圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_211_1.png)


    △圖 7-20 英特集團 2019 年 11 月 11 日分時圖


    ## 7.16 開盤後的閃擊漲停板，可用兩要素分析後期走勢


    ![](img/ac68af843c2aeef3dbf55e10ca066163_213_0.png)


    開盤後的閃擊漲停板形態，是指個股在早盤開盤後的短短幾分鐘內，由於個股交投相對清淡，此時受突然的單筆大買單影響，股價快速地衝擊漲停板。但這筆大買單的目的顯然並不是拉升股價，股價隨後瞬間被大量的賣單砸下。隨後，分時線在盤中漲幅較小的位置區開始趨穩，這使日
    K 線圖中出現了長上影線。


    這種開盤後的閃擊漲停板形態，很明顯是由大額資金興動而形成的，它往往是主力資金將有所行動的訊號。在實盤操作中，當個股出現了這種分時圖形態時，我們可以結合兩個要素來分析。


    一是，看股價的全天走勢是否呈持續滑落狀。如果股價在早盤閃擊漲停板後，其隨後在盤中的走勢持續滑落，甚至還出現了跳水，那麼這大多是主力短期內有意出貨的表現。主力透過開盤時的閃擊漲停板，讓投資人認為隨後股價還會再度上漲至漲停板附近的價位，也可以大大降低那些喜歡「逢高出場」的持股者賣股意願，而主力則可借機出貨；如果股價在早盤閃擊漲停板後，其走勢較為穩健、可以穩穩地運行於均價線上方，那麼這種走勢就極大地限制了主力的出貨行為。


    二是，看個股的局部價格走勢情況。如果這種分時圖形態，出現在一波快速上漲後的階段性高點，那麼它大多是價格將反轉下行的訊號；如果出現在短期大幅下跌後的低點時，那麼它更有可能是主力拉升前的一次向上試盤行為。相對而言，這種分時圖形態更常見於一波上漲走勢後的高點。


    當這種分時圖形態出現在一波快速上漲後的階段性高點時，表示主力在短期內有著較強的出貨意願，往往預示著短期內將有快速下跌行情出現，是應及時賣股離場的訊號。


    圖 7-21 中可以看到，當日該股價格在早盤開盤後向上閃擊漲停板。我們可以看到，股價上衝漲停板的速度是極快的，隨後再度跌回的速度也是極快的，因此我們稱之為閃擊漲停板形態。如圖
    7-22 的日 K 線走勢圖中可以看到，當日股價正處於一波快速上漲走勢後的階段性高點，且股價在當日震盪下行，因此這種閃擊漲停板形態，可以看作是主力短期內出貨意願較強烈的訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_213_1.png)


    在實盤操作中，我們應及時賣股離場，以迴避風險。圖 7-22 為西部資源 2019 年 8 至 11 月走勢圖，箭頭所指處為 2019 年 9 月 18 日。


    以下我們再舉另一個案例。當這種分時圖形態出現在緩緩攀升的走勢中時，說明個股價格短期內或許會有寬幅震盪走勢出現，而當日的盤中最高點，也很有可能是隨後一段時間的區域高點。但由於股價的階梯性上漲速度較為緩慢，因此，股價在短期內出現大幅下跌的可能性不大。在實際操作中，我們可以在之後數個交易日內逢高賣股。


    圖 7-23 中可以看到，當日該股在早盤開盤後出現了閃擊漲停板的形態，隨後，股價持續滑落。如圖所示，當日股價正處於緩緩攀升走勢中，這一形態的出現說明股價中短期內的上漲走勢不容樂觀。在實際操作中，我們應在隨後的交易日中逢高賣股。圖
    7-24 為中國船舶 2019 年 4 月至 7 月走勢圖，箭頭所指處為 2019 年 6 月 14 日。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_214_0.png)


    ## 7.17 凹形板形態是籌碼加速換手的標誌


    ![](img/ac68af843c2aeef3dbf55e10ca066163_215_0.png)


    開盤漲停板、中盤打開的「凹形板形態」，是指股價在早盤開盤後的幾分鐘內就快速漲停板（或者是個股直接以漲停板的方式開盤）。但隨後不久，漲停板就被打開，但股價並未大幅下跌，成交量集中於漲幅為
    7% 左右的位置區，直至尾盤半小時左右，股價才在大買單的掃盤下再度漲停板並直至收盤。這種漲停分時圖形態似凹形，故稱為「凹形板」。


    凹形板往往出現在盤整後的突破位置區，是籌碼加速換手的標誌。但籌碼究竟是從主力手中流入散戶手中，還是從散戶手中流入主力手中呢？我們可以結合個股的同期走勢，及凹形板出現之後的走勢情況來分析。


    當股價在上升途中的盤整突破位置出現了這種凹形板時，若此時的股價累計漲幅不大、股價並沒有在凹形板之後就快速地反轉下行，而是呈現出了長時間的止穩盤整走勢，則這多代表凹形板形態出現後，市場的實質並未明顯增強、籌碼仍被主力牢牢地掌握在手中。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_216_0.png)


    因此，前期盤整突破位置處的凹形板，極有可能是由主力的一次快速進貨所引起的。在此情況下，我們應在凹形板之後的止穩走勢中，逢回檔低點買股入場，才能獲利於個股隨後極有可能出現的快速上漲行情。


    圖 7-25 中可以看到，當日該股價格在 10：30 左右快速漲停板，但漲停板時間相對較短。隨後，股價在盤中漲幅為 3.5% 左右的位置區持續地橫向運行（ST
    股漲停幅度為 5%），直至收盤前半小時左右，才再度強勢漲停板。當日該股的這一分時圖形態，屬於典型的凹形板形態。


    從日 K 線走勢圖中可以看到，如圖 7-25 所示，當日股價正處於上升途中的盤整突破位置處。此分時圖形態一般來說，並不是主力短期內強勢拉升股價的訊號，在實際盤操作中，我們不妨多觀察一段時間再做決定。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_217_0.png)


    該股在 2019 年 7 月 26 日之後，於突破後的位置區再度漲停，這表示 2019 年 7 月 26 日的籌碼大幅換手，並非因為主力資金出貨，既然主力在當日沒有出貨，那麼主力就極有可能是買家。圖
    7-26 為 ST 創興 2019 年 4 月至 8 月走勢圖，箭頭所指處為 2019 年 7 月 26 日。


    在高位區的盤整震盪走勢之後，若個股於盤整突破位置處出現了這種凹形板，並且在凹形板之後，選出現了典型的看跌組合形態或快速回落走勢，則此凹形板多代表主力的出貨行為，是風險的預示，而非機會的象徵。


    圖 7-27 中可以看到，當日該股的盤面分時圖呈現出了凹形板形態，且當日量能大幅放出，這可能是主力手中籌碼流入市場的訊號，也可能是散戶手中籌碼流入主力手中的訊號，我們可以透過觀察個股隨後的走勢情況來判斷。


    一般來說，如果籌碼是由散戶手中流入主力手中，那麼主力為了保障建倉成本的安全性，大多會全力護盤，不讓股價出現大幅下跌；如果籌碼是由主力手中流入散戶手中，那麼主力隨後仍舊會強力出貨，股價也大多會出現快速的下跌走勢。


    可以看到 2019 年 4 月 8 日之後，股價在高位區開低走低，收出長陰線，這是一種典型的看跌組合形態。隨後，股價快速下滑，主力無護盤意願。因此，在實盤操作中，我們是不可以追漲買入的。圖
    7-28 為滄州大化 2019 年 2 月至 12 月走勢圖，箭頭所指處為 2019 年 4 月 8 日。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_218_0.png)


    △圖 7-27 滄州大化 2019 年 4 月 8 日分時圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_218_1.png)


    △圖 7-28 滄州大化 2019 年 2 月至 12 月走勢圖


    ## 7.18 10點前強勢的漲停板，是典型的看漲形態


    ![](img/ac68af843c2aeef3dbf55e10ca066163_219_0.png)


    上午 10 點前衝高不回落的漲停形態，是指股價在早盤開盤之後大幅上漲，一般來說，其漲幅會超過 7%，並且在當日大漲之後的高位區強勢運行，且未出現明顯的回落；隨後，股價會在
    10 點前於這一高位區再度上漲，並且牢牢地鎖住漲停板。


    早盤開盤之後股價就大幅上漲，這說明有主力在積極地推升股價，隨後，股價可以在大漲後的盤中高點位置區強勢運行而不明顯回檔，這說明主力參與能力強、市場獲利賣壓輕。10
    點之前就強勢漲停板，說明個股的漲停板時間早，這也是主力多意願堅決的一種表現。因此，這種漲停分時圖形態是一種典型的看漲形態，在實盤操作中，若個股之前的 K 線走勢較為配合，則我們不妨進行短線追漲操作。


    由圖 7-29 中可以看到，當日股價在早盤開盤後快速上漲且漲幅較大；隨後，股價在大漲後的高位區強勢運行，且沒有出現明顯的下跌；在 10 點前，股價再度因強烈的大買單鎖住漲停板。這種形態就是
    10 點前衝高不回落下的漲停形態，它是主力資金強勢做多的標誌，也是股價進入加速上漲階段的訊號。如圖 7-30 所示，股價在 2019 年 8 月 20 日之前，處於穩健的攀升走勢中，累計漲幅不大。


    但 2019 年 8 月 20 日的漲停板不僅創出了新高，還使股價上漲呈加速狀，因此，在實盤操作中，我們應積極地追漲買股。圖 7-30 為“ST 山水的走勢圖，箭頭所指處為
    2019 年 8 月 20 日。


    圖 7-31 中可以看到，當日該股在盤中也出現了這種 10 點前衝高不回落的漲停形態，結合該股之前的日 K 線走勢（當日股價正處於長期盤整後的突破位置處），我們可以認為這是主力資金對股價展開強勢拉升的訊號。在實盤操作中，我們應在第一時間追漲買股，以享受主力的拉升成果。圖
    7-32 為“ST 椰島的走勢圖，箭頭所指處為 2019 年 6 月 19 日。

