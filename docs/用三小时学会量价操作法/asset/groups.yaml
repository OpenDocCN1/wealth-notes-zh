  - '[PAGE 152]


    突破表明主力在積極做多。寬震式漲跌是多空分歧明顯的標誌，主力此時的參與能力並不是很強，若是沒有明顯的利多消息驅動，股價很難實現突破後立即飆升的走勢。


    在實務操作中，當股價放量突破寬幅震盪區後，可跟隨買進。


    # 5.13


    震盪活躍式量能，

