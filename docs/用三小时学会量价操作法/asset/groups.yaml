    # 循序漸進的放量

    溫和式放量


    成交量形態的變化歸根結底只有兩種情形，一種是放量，另一種是縮量。但是，放量和縮量的具體表現形式多種多樣，有較為溫和的放量，也有突兀式放量，在不同的股價走勢中，它們所蘊含的市場含義也不盡相同。


    學習量價知識前，對於成交量的放大、縮小形態，先要有一個較為系統性的瞭解，在此基礎之上，進一步結合實際股價走勢、解讀成交量的細微變化，才能取得更好的效果。在本章中，筆者以「放量」及「縮量」為核心，結合股價走勢，講解一些常見的成交量形態，為讀者打好基礎。


    # §2.1.1  溫和式放量的成因


    溫和式放量是一種相對溫和的放量形態，它是指成交量與近期的均量水準相比而言，出現循序漸進、幅度不大的放量，成交量的前後變化較為連續，成交量的放大水準多保持在近期均量的兩倍左右。溫和式放量多出現在上漲波段，而在不同個股的中短線價格走勢中，溫和式放量所具有的市場含義也不盡相同。


    「漲時放量，跌時縮量」是股價運動過程中的常態，也是市場正常交投的結果。波段上漲走勢中的溫和式放量，屬於普通的放量上漲形態，一般來說，只對局部走勢進行觀察，實戰意義不大。在實盤操作中，我們應將局部走勢中的溫和式放量形態放入趨勢運行中，「低位攀升走勢」、「突破套牢區位置點」和「震盪反彈波段走勢」這幾種情形下的溫和式放量，具有較高的實戰價值，能夠較為準確地預示股價後期的運行方向。'
  - '[PAGE 49]


    # 2.1.2 低位攀升溫和式放量，有實戰意義


    一般來講，當低位攀升溫和式放量這一形態，出現在市場整體或個股長期下跌之後的低位區時，最具實戰意義。因為這時的個股多處於超跌狀態，但超跌並不是股價上漲的動力，只有持續的買盤進入，才能讓股價步入底部並且隨後走入上升通道之中。而溫和式放量的形態，正是買盤持續進入的訊號，也就是股價見底、上漲趨勢即將出現的訊號。


    從圖 2-1 中可以看到，在前期經歷了短線快速下跌、中期持續下跌之後，股價進入了低位區。如圖中的標注所示，此時出現了一波上漲行情，量能溫和放大，股價在短線高點止穩不跌，這是買盤積極入場的訊號，預示著行情的反轉，在實盤操作中可以積極地跟進買入。


