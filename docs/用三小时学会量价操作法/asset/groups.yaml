    # 第 1 章 想學會量價操作法，你必須懂的基礎知識


    ## 1.1 量價圖有兩種——K線圖與分時圖


    「量、價、時、空」是技術分析的4大要素。「量」是指成交量，「價」則是由K線圖來表示，利用量與價的配合，再結合時間與空間兩個維度，我們就可以展開技術分析了，由此也展現了量、價的不可分離性。量價圖主要有兩種，一種是以一個交易日為時間單位的「日K線圖」，另一種是表現盤中即時成交情況的「分時圖」。在本節中，我們先結合案例，來認識一下兩種量價圖。


    ### 1.1.1 什麼是K線


    K線也常被稱為蠟燭線、棒棒線、酒井線等，它起源於300多年前的日本，起初是用於記錄米價漲跌情況的一種工具，因其直觀、立體，並且具有東方人擅長的形象思維特點，後來被應用到金融市場中，是投資人在證券交易分析中較早接觸的技術工具。


    K線中以「一個交易日」為時間週期的日K線最常用，一條K線可以大致反映當日的價格波動情況，它包含了4個價位，分別是開盤價、收盤價、最高價、最低價。


    - 1. 開盤價：開盤前為集合競價，確定開盤價。

    - 2. 收盤價：該交易日收盤時的價位。

    - 3. 最高價：該交易日盤中所出現的最高成交價。

    - 4. 最低價：該交易日盤中所出現的最低成交價。


    圖1-1為單條K線形態示意圖，單條K線可以分為兩種——陽線、陰線。陽線的收盤價在上方，收盤價高於開盤價，代表著股價上漲；陰線的收盤價在下方，收盤價價低於開盤價，代表著股價下跌。陽線多用紅色表示，陰線多用黑色或綠色表示。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_15_0.png)


    對於 K 線來說，開盤價與收盤價之間的矩形部分被稱為實體，實體上方的線為上影線，實體下方的線為下影線。


    一條日 K 線記錄的是在一個交易日內的股票價格變動情況，將每個交易日的 K 線以時間為橫軸、以股票價格為縱軸依次排列在一起，就組成了日 K 線圖，這也是反映股票價格變動情況的圖。


    ### 1.1.2 認識成交量


    成交量以單邊的方式進行統計，這表示當日成交了 1000 股，即買方買進了 1000 股，同時賣方賣出了 1000 股。


    與成交量相關的概念還有成交額。成交額就是某檔股票每筆成交股數，乘以成交價格的金額總和。如果說成交量只是單純表現出這檔股票的交投活躍程度，那麼成交額則代表了這檔股票所涉及的資金量。同樣的成交量，如果股價越高，那買賣這檔股票所需要的資金就越多。成交額常用於大盤分析，它排除了因大盤中的各種股票價格高低不同所形成的干擾，也直接地反映出市場中參與股票買賣的資金量多寡。


    ### 1.1.3 量價圖就是K線圖


    在股票行情軟體中，量價圖也就是常說的日K線圖，是我們瞭解大盤、個股運行的視窗，它直接、清晰地呈現出股市及個股的運行情況。股票行情軟體很多，但操作方法基本相同。


    圖1-2為中國石油日K線圖，每一條K線都代表著一個交易日的價格波動，下方有相對應的柱形成成交量，柱形長短代表成交量的大小。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_16_0.png)


    ### 1.1.4 以「分鐘」為週期的分時圖


    K線圖一般以「日」為時間週期，它是我們用於查看股票價格歷史走勢情況的圖。分時圖則以「分鐘」為時間週期，是我們用於查看每個交易日股票盤中價格，即時走勢情況的圖。


    圖1-3中，左側為該股的即時走勢圖，包括分時線、分時量、均價線，圖中右側顯示該股的掛單情況、成交細節等內容。


    - 1. 分時線是分時圖中最主要的部分。它以分鐘為時間單位，即時地反映出個股的盤中價格波動情況，是我們瞭解個股價格即時變化情況的視窗。分時線呈現了多空力量的即時轉換情況，一些較為特殊的異常分時圖形態，往往是對主力某種特定市場行為的直接表現。此外，分時線的最大作用，是可以揭示個股價走勢的強弱情況。

    - 2. 分時量位於分時線下方，同樣以「分鐘」為時間單位，它以圖形來表現成交量，每一根柱條的長短，代表了這一分鐘的成交量多少。

    - 3. 均價線呈現了當日入場買股者的平均持有成本。均價線的計算方法為：到目前這一時刻為止的當日總成交金額÷到目前這一時刻為止的當日總成交股數。透過分時線與均價線的位置關係，我們可以瞭解到當日買賣雙方的力量對比：若分時線穩健地運行於均價線上方，則說明買方力量更強；若分時線持續運行於均價線下方，則說明賣方力量更強。在分時圖中，有的軟體上方會顯示「均線」，有的軟體上方會顯示「均價」，但它們都指均價線。

    - 4. 委託買賣盤體現呈現了掛單情況。透過它，我們可以瞭解壓在上方的賣單多一些，還是聚在下方的託單更多一些。就一般的情況來說，委賣盤中的壓單多，代表上方壓力較大，是股價上漲較難的展現；聚在下方的買單多，代表承接力量較強，是股價下跌較難的展現。就市場的自然交投情況來說，上方的委賣單與下方的委買單，數量上雖存在差異，但差異一般不會過大。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_17_0.png)


    ## 1.2 如何看懂成交量的含義？


    雖然成交量的重要性是毋庸置疑的，但它並未受到所有投資人的關注。其原因在於這些投資人不瞭解其意義，仍舊只將成交量看作是一種交易訊息的回顧。在本節中，我們將結合案例，從多個角度來解讀成交量的深層市場含義，在具體學習量價操作技術之前，希望可以達到引|導的作用。


    ### 1.2.1 多空的分歧情況


    很多投資人僅把成交量單純地看作是交易量，但其實，只要我們稍微深入分析，就可以得出這一判斷：成交量是多空競爭規模、競爭力度的展現。


    多空雙方的競爭力，也代表著雙方分歧的大小。同樣的股價走勢，多空雙方的競爭力不同，其所蘊含的市場含義不同，預示的後期股價走向自然也不會相同。


    例如，同樣處於橫向盤整中，成交量放大表示多空分歧加劇，強烈的多空分歧勢必導致股價的方向性選擇儘快出現；而若是縮量情況下的橫向盤整，代表著多空競爭力較小，這種走勢若無外在因素影響，持續的時間就會更久一些。


    又如，上漲走勢中未出現放量，說明這種上漲僅是因為大量的持股者暫時穩定，股價在高位區的支撐力度就會弱一些；反之，上漲時有成交量放出，說明買盤入場力度較強，股價的支撐性就會更好一些。經由以上的分析可以看出，同樣的股價走勢，由於成交量的形態不同，其所蘊含的市場含義也是不同的，其所預示的後期股價走勢往往也不同。


    可以看到圖 1-4 在股價的一波上漲走勢中，股價於短線高點橫向震盪盤整，此時的成交量明顯放大，這是此位置區域中多空分歧加劇的標誌。在這個位置點，上攻明顯受阻，劇烈的多空分歧將使股價走勢再次發生變化。結合股價的短線上漲情况来看，股價走勢反轉回撤的機率更大一些。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_19_0.png)


    ▲圖 1-4 巨星科技 2019 年 8 月至 11 月走勢圖


    股價走勢無太大的變化，僅是橫向整理，但成交量的放大卻提示我們在此位置區域中多空分歧加劇。其隱藏的這一深層含義被揭開後，對於股價的走向，我們將能做更準確的預測。


    ### 1.2.2 籌碼的供求關係


    成交量的直接含義僅是指成交的數量，但是如果我們把成交量與股價走勢聯繫起來，它就有了更深一層的含義，即成交量可以呈現市場或個股的供求狀況。股價上漲但成交量卻未見放大，說明買盤少、賣壓小，少量的買盤入場即可推動股價上漲，個股籌碼「求大於供」。


    反之，當股價下跌但成交量未見放大，說明少量的賣盤就可以降低股價，入場接盤者少，個股籌碼「供大於求」。當籌碼供求關係較為明顯時，則是趨勢沿著這一方保持續運行的可靠保障；當籌碼供求關係改變時，則應提防趨勢的轉向。


    圖 1-5 的標注處，股價震盪上行量未能見放大，該股籌碼處於「求大於供」的狀態中。如果此時的震盪區間位於相對低位置，那種籌碼供求關係多預示著突破上升的走勢。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_20_0.png)


    ### 1.2.3 動力與方向的關係


    汽車跑得快不快，主要看引擎；沒有足夠的動力，再漂亮的車也只能成為擺設。量價分析的實質就是動力與方向的分析：成交量是動力，而股價走勢則是方向，這種動力作用尤其會展現在股價的上漲過程中。一般來說，如果沒有放大的量能作為股價上漲的動力，那麼上升走勢是難以維持的。


    雖然公司的基本面情況、經濟因素、政策因素等均會影響到股價的走勢，但歸根究底，決定股價漲跌的力量，還是來自市場本身的買賣活動。股價上漲時，量能穩步放大，這表示漲勢仍在延續；股價上漲但成交量卻在縮小，這意味著漲勢已到了盡頭，是大盤反轉的徵兆。反之，股價下跌而成交量大增，顯示跌勢初起；股價持續下跌，但成交量越來越小，反映跌勢將結束，這是大盤反彈的訊號。


    我們看圖 1-6 中的方框標注處，股價穩步上漲時，可以看到此時的成交量一直處於溫和放大的狀態。溫和放大的量能，代表著股價上漲時的動力，只要這種量價關係可以有效地保持，股價的上漲就具有較強的持續性。

