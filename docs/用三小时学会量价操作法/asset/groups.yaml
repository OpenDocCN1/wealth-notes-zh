    \n△圖 1-24 嘉麟傑 2019 年 4 月至 9 月走勢圖\n\n在實盤操作中，當股價回落至 MA30 附近時，就可以短線買入。若隨後的走勢證實我們的判斷是正確的，則可耐心持股待漲，直至出現短線賣出訊號。若股價再度向下跌破\
    \ MA30，則表明之前的長陽線突破 MA30 並不是上漲訊號，我們應及時賣出，從而保證本金安全。\n\n## 1.4.6 多空交替形態\n\n均線系統的多空交替形態，是指均線系統有時因一波上漲而呈多頭排列形態，而有時因一波下跌而呈空頭排列形態。多空交替形態常見於盤整震盪走勢中，是趨勢運行不明朗的標誌，也是多空雙方力量相對均衡的訊號。\n\
    \n在股價走勢沒有發出明確的方向選擇訊號前，我們宜進行高賣低買的短線交易，即在均線系統呈現完全的空間排列形態並且股價位於盤整區低點時，可短線買入；隨後，一波上漲之後，當均線系統呈現完全的多頭排列形態，且股價處於盤整區高點時，可獲利賣出。\n\
    \n在圖 1-26 中，股價在高位區震盪瀰漫之後開始向下破位，短線跌幅較大，此時的大盤仍舊處於橫向震盪之中，並且沒有系統性風險。因此，股價步入快速下降通道的機率較小，此時出現的止跌止穩可以作為一個短線買入點。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_41_0.png)\n\n△ 圖 1-26 海螺水泥 2018 年 12\
    \ 月至 2019 年 12 月走勢圖\n\n隨後，股價震盪上行、快速突破 MA30，這是多方力量再度佔優勢的訊號。但當股價上漲至前期高點附近時，由於存在較多的短線獲利賣壓以及解套賣壓，因此出現調整的機率較大，我們應逢高賣出、鎖定利潤。\n\
    \n## 1.5 如何掌握股價大幅變動的買賣時機？\n\n進行實盤交易時，我們首先要查看的就是盤面的各項資訊。其中，盤中出現異動（如量能異動、走勢異動、掛單情況變化等）的個股更值得關注，它們可能是主力短線重點參與的商品，也可能預示著個股上攻行情的出現。\n\
    \n在以量價形態為核心展開交易時，能否在第一時間發現這些個股非常重要，否則我們很可能錯過買賣入時機。在本節中，我們將說明重要的即時盤面資訊，來檢視如何在第一時間發現這些盤面異動股。\n\
    \n### 1.5.1 振幅、量比、換手率等重要數據\n\n各式各樣的盤面數據，從不同角度呈現出多空雙方的交控行為，利用它們可以更準確地觀察個股的運行情況。其中，振幅、量比、委比、內盤與外盤、換手率等數據較為重要。\n\
    \n- 1. 振幅\n  振幅是指股價在當日盤中的上下震盪的幅度。振幅展現了多空雙方的競爭情況。個股的盤中振幅越大，說明多空競爭越激烈。過大的盤中振幅，往往是短線股價走勢反轉的訊號。其公式如下。\n\
    \  振幅＝（當日最高價－當日最低價）÷ 上一交易日收盤價 ×100%\n\n- 2. 量比\n  量比，即成交量的相對比值，它以分鐘為時間單位，其數值為當日開市後每分鐘的平均成交量，與過去\
    \ 5 個交易日每分鐘的平均成交量之比，也是一種即時的盤面資料。量比將前幾個交易日的每分鐘平均成交量作為參照，可以幫助我們即時瞭解個股在這一分鐘量能放大或縮小的程度，是發現成交量異動的重要指標。對量比的數值進行分析時，量比值較大的個股（一般來說，量比值至少要在\
    \ 3 以上），更值得關注，可以幫助我們縮小選股範圍。其公式如下。\n\n![](img/ac68af843c2aeef3dbf55e10ca066163_43_0.png)\n\
    \n- 3. 量比曲線\n  在盤中，以分鐘為時間單位，將量比數值依次連接得到一條平滑曲線，這就是量比曲線。它使我們更能掌握個股當日成交量，與近期成交量的相對變化情況。\n\
    \n  一般來說，透過一夜的市場訊息及人們心理上的變化，新的一個交易日開盤的時候，股價及開盤成交量的變化極大。將其反映在量比數值上，就是很多股票開盤時的成交量比數值會高十幾倍，隨後量比數值又急速下降。大多數股票的成交量在新的一個交易日開盤時都顯得很不穩定，因此在通常的行情背景下，我們應該等待量比曲線穩定後再採取行動。\n\
    \n- 4. 委比\n  委比可以反映委買盤與委賣盤的掛單數量對比情況。委比的取值範圍為–100% 至 100%，當委比數值為 100% 時，個股處於漲停板；當委比數值為\
    \ –100% 時，個股處於跌停板。其公式如下。\n\n![](img/ac68af843c2aeef3dbf55e10ca066163_43_1.png)\n\
    \n  委比是具有即時性的盤面數據，隨著委買單、委賣單的陸續掛出、不斷成交，委比數值也會不斷變化。一般來說，當委比數值為正時，說明有較多的委買單在下面承接，這是買方力量相對較強的表現；當委比數值為負時，說明有較多的委賣單壓在上面，這是賣方力量相對較強的表現。\n\
    \n- 5. 內盤與外盤\n  外盤，是指以主動性買入方式成交的股票數量。對於一筆交易，在賣方報價後，買方主動以賣方報價買入，這是主動買入；在買方報價後，賣方主動以買方的報價賣出，這是主動賣出。內盤，是指以主動性賣出方式成交的股票數量。其公式如下。\n\
    \  成交量 = 外盤 + 內盤\n\n  當外盤較大時，說明以主動性買入方式成交的股票數量更多，這是投資人買股意願較強的展現，此時股價也多數會在買盤的推動下出現上漲。當內盤較大時，說明以主動性賣出方式成交的股票數量更多，這是投資人賣股意願較強的展現，此時股價也多數會在賣盤的壓力下出現下跌。\n\
    \n  在實盤操作中，我們需結合個股的價格走勢情況，來解讀內外盤所蘊含的市場訊息，以下列舉 5 種情況。\n  - 在長期下跌後的低位區：價格走勢止穩，量能溫和放大，此時出現的外盤大於內盤的情況，可以被看作是場外資金積極入場、多方力量增強的訊號。若個股可以在之後的更多的交易日中，出現外盤大於內盤的情況，則預示著多方力量正在積累，是後期價格走勢看漲的標誌。\n\
    \  - 在長期上漲後的高位區：價格走勢漲滯，量能相對縮小，此時出現的內盤大於外盤的情況，可以被看作是場內資金陸續離場、空方賣壓漸強的訊號。若個股可以在之後的更多的交易日中，出現內盤大於外盤的情況，則預示著空方力量正在積累，是後期價格走勢看跌的標誌。\n\
    \  - 在穩步上漲的價格走勢中：外盤大於內盤是買盤充足的表現，也是漲勢將持續的標誌。在持續下跌的價格走勢中，內盤大於外盤是賣盤充足的表現，也是跌勢將持續的標誌。\n\
    \  - 在高位震盪區：若個股在盤面中出現了外盤明顯大於內盤，但盤中價格走勢卻無力上漲的情形，是價格走勢看跌的訊號。\n  - 在低位震盪區：若個股在盤面中出現了內盤明顯大於外盤，但盤中價格走勢卻較為穩健、未見明顯下跌的情形，這是價格走勢看漲的訊號。\n\
    \n- 6. 換手率\n  換手率也稱周轉率，它是指一檔股票在「單位時間內的累計成交量與其流通總股本之間」的比率，是反映股票流通性強弱的指標之一。其公式如下。\n\
    \  換手率＝（單位時間內的累計成交量 ÷ 流通總股本）×100%\n\n  一般來說，在計算換手率時，多以交易日為時間單位。假設某檔股票連續 10 個交易日的換手率之和（累計換手率）為\
    \ 100%，我們可以這樣簡單地理解：這檔股票在經過了 10 個交易日的交投之後，其流通在股市上的全部股票籌碼已經從原有持股者手中，轉移到了新加入進來的投資人手中。當然，這只是一種簡單的理解，因為很多投資人都在頻繁地買賣一檔股票，換手率為\
    \ 100% 並不意味著持股者的完全轉換。\n\n  關注換手率時，我們要充分考虑個股的特性。對於大股東持股比例較高的個股，這些股票的換手率會較低；反之，對於大股東持股比例低、股票籌碼高度分散的個股，其換手率就會較高。\n\
    \n  個股的換手率可以反映個股的交投情況是否活躍。一般來說，日換手率小於 3% 表明交投不活躍，市場觀望氣氛較重。日換手率在 3% ～ 7%，表明市場交投氣氛活躍，意味著股票流通性好，進出市場比較容易，不會出現「想買買不到、想賣賣不出」的現象。此種換手率多出現在行情的行进階段，股票透過持續的換手，市場持有成本在不斷地增加或減少，這有利於行情的發展。\n\
    \n  日換手率大於 7% 表明股票在頻繁換手，如果發生在高位，我們應注意風險。此外，對於不同類型的個股，也應區別其換手率標準：大股本的換手率達到 2% 就可以算是較高的水準，而小股本、題材股的換手率一般要超過\
    \ 5%，才可以將其稱作是高換手率。\n\n  高換手率是最值得我們關注的。高換手率說明資金的流入、流出速度較快，若高換手率是由主力資金流入、散戶資金流出引發的，往往預示著機會的到來；若高換手率是由主力資金流出、散戶資金流入引發的，往往是風險的預兆。由於較長時間的高換手率可以表現出資金進出量大、持續性強的特點，因此在實務操作中，能在較長的時間內維持高換手率的股票，極具價值。\n\
    \n### 1.5.2 掛單分析：大單托底與大單壓頂\n\n掛單，就是指委買、委賣盤中的掛單情況。這些單子是已掛出、但卻仍未成交的。正常的掛單情況中，委買盤與委賣盤的單子數量相對平均，每個價位上的單子數量也不會相差太多。但是，有的時候可以看到委買盤的某一價位處掛有超級大單（大單托底），或是在委賣盤的某一價位處掛有超級大單（大單壓頂）。\n\
    \n大單托底給我們的感覺是此股價格難跌，大單壓頂給我們的感覺則是此股價格難漲，但經驗告訴我們，只憑感覺往往並不準確。很多時候，大單托底，但股價在盤中的走勢卻明顯弱於大盤；大單壓頂，但股價在盤中的走勢卻明顯強於大盤。在實盤操作中，我們一定要學會逆向思維，不能單單憑藉對盤面的感覺來做出判斷。\n\
    \n例如，股價走勢在盤中出現小幅度的震盪下行，在震盪下行過程中，委買盤的單子非常大，大單托底給人的感覺是有資金承接，股價難跌。然而，實際情況可能是此股當日的價格走勢較弱，明顯弱於當日大盤。\n\
    \n如果此大單真是為了防止股價下跌、主力護盤的話，那麼在當日大盤走勢較為穩健的背景下，個股的盤中表現應強於同日大盤，但短線走勢出現了一定的股價重心下移的情況。因此，我們對於這種大單托底的情況應逆向理解，從而判斷出這是賣出訊號。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_46_0.png)\n\n# 第 2 章 看懂放量與縮量，因為「有量才有價」！\n\
    \n## 2.1 循序漸進的放量：溫和式放量\n\n成交量形態的變化歸根結底只有兩種情形，一種是放量，另一種是縮量。但是，放量和縮量的具體表現形式多種多樣，有較為溫和的放量，也有突兀式放量，在不同的股價走勢中，它們所蘊含的市場含義也不盡相同。\n\
    \n學習量價知識前，對於成交量的放大、縮小形態，先要有一個較為系統性的瞭解，在此基礎之上，進一步結合實際股價走勢、解讀成交量的細微變化，才能取得更好的效果。在本章中，筆者以「放量」及「縮量」為核心，結合股價走勢，講解一些常見的成交量形態，為讀者打好基礎。\n\
    \n### 2.1.1 溫和式放量的成因\n\n溫和式放量是一種相對溫和的放量形態，它是指成交量與近期的均量水準相比而言，出現循序漸進、幅度不大的放量，成交量的前後變化較為連續，成交量的放大水準多保持在近期均量的兩倍左右。溫和式放量多出現在上漲波段，而在不同個股的中短線價格走勢中，溫和式放量所具有的市場含義也不盡相同。\n\
    \n「漲時放量，跌時縮量」是股價運動過程中的常態，也是市場正常交投的結果。波段上漲走勢中的溫和式放量，屬於普通的放量上漲形態，一般來說，只對局部走勢進行觀察，實戰意義不大。在實盤操作中，我們應將局部走勢中的溫和式放量形態放入趨勢運行中，「低位攀升走勢」、「突破套牢區位置點」和「震盪反彈波段走勢」這幾種情形下的溫和式放量，具有較高的實戰價值，能夠較為準確地預示股價後期的運行方向。\n\
    \n### 2.1.2 低位攀升溫和式放量，有實戰意義\n\n一般來講，當低位攀升溫和式放量這一形態，出現在市場整體或個股長期下跌之後的低位區時，最具實戰意義。因為這時的個股多處於超跌狀態，但超跌並不是股價上漲的動力，只有持續的買盤進入，才能讓股價步入底部並且隨後走入上升通道之中。而溫和式放量的形態，正是買盤持續進入的訊號，也就是股價見底、上漲趨勢即將出現的訊號。\n\
    \n從圖 2-1 中可以看到，在前期經歷了短線快速下跌、中期持續下跌之後，股價進入了低位區。如圖中的標注所示，此時出現了一波上漲行情，量能溫和放大，股價在短線高點止穩不跌，這是買盤積極入場的訊號，預示著行情的反轉，在實盤操作中可以積極地跟進買入。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_49_0.png)\n\n### 2.1.3 升勢創新高溫和式放量，可持股待漲\n\
    \n升勢創新高溫和式放量，是指個股在一波穩健上漲，並且創出近期新高的價格走勢中，出現了成交量循序漸進地溫和放大，而且其均量大於之前上漲走勢中的均量的情形。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_50_0.png)\n\n▲圖 2-2 中宣股份 2019 年 4 月至\
    \ 9 月走勢圖\n\n這種出現在上升途中的溫和式放量形態，是場外買盤資金較為充足的標誌，也預示著股價上升趨勢仍將延續下去。\n\n由圖 2-2 中的標示處可以看到，在震盪上升行情中，一波震盪上升走勢創出了新高，量能較之前的均量而言，出現了溫和式放大的情形，這是買盤資金充足的標誌。由於此時股價的累計漲幅不大、上升形態良好，因此，這種溫和式放量的量價關係，預示著升勢仍將持續下去，我們可以耐心持股待漲。\n\
    \n### 2.1.4 突破套牢區溫和式放量，可積極買入\n\n套牢區因股價破位下行而出現，隨後，股價反彈上漲至這一位置點，較多的被套盤處於解套狀態。同時，由於股價短線上漲而產生了一定的獲利盤，在這個位置點上，若股價能夠以溫和放量的方式突破套牢區，則表明市場籌碼鎖定狀態良好。這或許也可表明市場浮額較少，股價上漲阻力較小。\n\
    \n只要股價短線漲幅不大、中線仍處於相對低位置，則表明股價的中線走勢是向上的，仍會有較大的上漲空間。在實際操作中，股價在突破套牢區後，若能夠在突破位置點止漲，則預示著上漲動力較足，此時我們可以積極地買股入場佈局。\n\
    \n由圖 2-3 可以看到股價在急速下跌之後，跌破了前期的震盪整理區間，從而使得股價進入了一套牢盤較多的區域。\n\n## 2.2 突然大幅度放大：突兀式放量\n\
    \n### 2.2.1 突兀式放量的成因\n\n突兀式放量也稱「脈衝式放量」，它是指成交量在某一日或連續兩日內突然大幅度放大，其放量效果往往可以達到之前均量大小的\
    \ 3 倍以上。而且，在這一、兩日的放量之後，此股的成交量又突然地恢復如初。\n\n一般來說，量能的大縮小有一個連續過濾的過程，這是多空雙方戰爭不斷趨於激烈或不斷趨於緩和的寫照。但突兀式放量則完全不同，它是量能的一次突兀式躍動。突然地放量，又突然地恢復如初，這無疑是成交量的明顯異動。\n\
    \n那麼，突兀式放量是如何被引發的呢？一般來說，它是受消息面的刺激所引發的，下面我們就來看看突兀式放量究竟蘊含了怎樣的市場含義。\n\n利多消息會促使股價上漲，主要是由於股價的快速變動，和市場對利多消息的解讀結果不同，多空雙方產生強烈分歧，造成了較大的交易量。\n\
    \n利多消息刺激下的突兀式放量表明兩種訊息：一是買盤入場力度大，並且當日多方佔據了主動地位，但當日的巨量也造成了對買盤力量的極大消耗；二是交易是雙向的，突兀式放量也說明當日逢高賣壓異常沉重，放量過後，量能突然大幅度萎縮，說明市場後續入場的買盤力量不足。因為「漲時需有量能支撐」，當股價處於短線高點，而量能又無法維持放大態勢時，一波回撤下跌走勢難免會出現。\n\
    \n再來看看利空消息引發的突兀式放量。利空消息引發突兀式放量並且造成股價的快速下跌，這說明市場的主動性快速賣出力量巨大，空方完全佔據了主動地位，這是下跌訊號。\n\
    \n### 2.2.2 短線上衝突兀式放量\n\n短線上衝是指，股價出現了一波短線上漲，漲幅相對較大、漲速較快。從日K線圖來看，股價的一波短線上漲往往會使股價呈出突突突破上漲狀，這時出現的突兀式放量往往與主力的階段性減碼、出貨行為相關。\n\
    \n圖 2-5 中股價經歷了一波短線上漲，上漲幅度相對較大；在有了一個漲停板、全盤獲利的情形下，出現了跳空長十字線的形態，當日成交量異常放大，放大效果大致為此前均量的\
    \ 2 倍；次日量能又突然恢復如初，這就是突兀式放量上漲。出現在此位置點烈的這種量能形態，表明股價短線上攻動力已過度釋放，而且多與主力的階段性出貨行為相關，是短線上漲走勢結束的訊號。在實盤操作中，我們進行中線交易時應減碼，進行短線交易時應獲利離場。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_52_0.png)\n\n### 2.2.3 寬震區縮頂突兀式放量\n\
    \n在寬震區中，由於股價的上下波動幅度較大，股價走勢會在縮頂受到較強阻力，在縮底獲得較強支撐，此外寬幅震盪走勢常出現在浮額較多、主力參與能力較弱的個股上。\n"
  mdcn: "\n隨著上升趨勢的持續，在高位區出現了長陰線快速跌破 MA30 的形態，這是原有多空力量對比格局發生轉變的訊號，我們應注意趨勢的轉向。\n\n我們可以看到圖\
    \ 1-23 中，其股價一直處於穩健上升的通道中，但在高位區出現了震盪下滑的走勢，股價向下跌破了 MA30，並且 MA30 隨後對股價的反彈上漲構成了強力阻擋，這是多空力量對比格局發生轉變的訊號。考慮到股價的累計漲幅，在這個位置區震盪築頂的機率較大，此時我們應減碼或清倉離場。\n\
    \n當股價上漲至 MA30 附近時，若受到了明顯的阻擋（或者在突破 MA30 後又馬上回落到其下方），則表明空方力量依舊較強，跌勢仍未見底。若股價向上突破了\
    \ MA30，並且在較長時間內站穩於 MA30 上方，這時的 MA30 將由原來的阻力作用轉換為支撐作用，趨勢反轉上行的機率較大，這時我們就可以積極地在股價回檔時加碼買入。\n\
    \n可以看到圖 1-24 中，在中長期的低位區股價止穩後，均線呈現多頭形態，這是多方力量開始佔優勢的訊號，也是趨勢有望反轉上行的訊號。隨後，股價震盪上揚，多方力量明顯佔優勢，並且在股價的一波大幅調整過程中，MA30\
    \ 發揮了較強的支撐作用。這時 MA30 由原來的阻力作用轉換為支撐作用，這也是趨勢反轉上行的一個重要訊號。在實盤操作中，當股價回落至 MA30 附近時，我們可以進行中短線買入操作。\n\
    \n## 1.4.5 「蛟龍出海」反轉形態\n\n「蛟龍出海」反轉形態，出現在股價上升途中的長期震盪回落態勢中，或中長期低點的正穩走勢中。此時，MA30 仍舊處於緩慢下移的狀態中，股價也持續運行在\
    \ MA30 下方，總體下跌速度很慢，呈緩跌格局。\n\n此時，若一條長陽線突破了 MA30，股價將連續多個交易日站穩於 MA30 之上。\n\n「蛟龍出海」反轉形態是一種打破原有震盪緩跌格局的反轉形態，個股出現短線快速上攻行情的機率較大，在實盤操作中，我們可以積極跟進。\n\
    \n我們看圖 1-25，在較長時間的橫向震盪走勢中，股價滑落、MA30 下行。如圖中的標注所示，一條長陽線向上突破了 MA30，隨後多個交易日內，股價站穩於\
    \ MA30 上方。當股價回落至 MA30 附近時，再度出現長陽線，這說明可能有主力資金積極買入，此時若想進行中短線交易則可以買股入場。\n\n![](img/ac68af843c2aeef3dbf55e10ca066163_39_0.png)\n\
    \n△圖 1-23 ST 椰島 2019 年 6 月至 12 月走勢圖\n\n![](img/ac68af843c2aeef3dbf55e10ca066163_39_1.png)\n\
    \n△圖 1-24 嘉麟傑 2019 年 4 月至 9 月走勢圖\n\n在實盤操作中，當股價回落至 MA30 附近時，就可以短線買入。若隨後的走勢證實我們的判斷是正確的，則可耐心持股待漲，直至出現短線賣出訊號。若股價再度向下跌破\
    \ MA30，則表明之前的長陽線突破 MA30 並不是上漲訊號，我們應及時賣出，從而保證本金安全。\n\n## 1.4.6 多空交替形態\n\n均線系統的多空交替形態，是指均線系統有時因一波上漲而呈多頭排列形態，而有時因一波下跌而呈空頭排列形態。多空交替形態常見於盤整震盪走勢中，是趨勢運行不明朗的標誌，也是多空雙方力量相對均衡的訊號。\n\
    \n在股價走勢沒有發出明確的方向選擇訊號前，我們宜進行高賣低買的短線交易，即在均線系統呈現完全的空間排列形態並且股價位於盤整區低點時，可短線買入；隨後，一波上漲之後，當均線系統呈現完全的多頭排列形態，且股價處於盤整區高點時，可獲利賣出。\n\
    \n在圖 1-26 中，股價在高位區震盪瀰漫之後開始向下破位，短線跌幅較大，此時的大盤仍舊處於橫向震盪之中，並且沒有系統性風險。因此，股價步入快速下降通道的機率較小，此時出現的止跌止穩可以作為一個短線買入點。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_41_0.png)\n\n△ 圖 1-26 海螺水泥 2018 年 12\
    \ 月至 2019 年 12 月走勢圖\n\n隨後，股價震盪上行、快速突破 MA30，這是多方力量再度佔優勢的訊號。但當股價上漲至前期高點附近時，由於存在較多的短線獲利賣壓以及解套賣壓，因此出現調整的機率較大，我們應逢高賣出、鎖定利潤。\n\
    \n## 1.5 如何掌握股價大幅變動的買賣時機？\n\n進行實盤交易時，我們首先要查看的就是盤面的各項資訊。其中，盤中出現異動（如量能異動、走勢異動、掛單情況變化等）的個股更值得關注，它們可能是主力短線重點參與的商品，也可能預示著個股上攻行情的出現。\n\
    \n在以量價形態為核心展開交易時，能否在第一時間發現這些個股非常重要，否則我們很可能錯過買賣入時機。在本節中，我們將說明重要的即時盤面資訊，來檢視如何在第一時間發現這些盤面異動股。\n\
    \n### 1.5.1 振幅、量比、換手率等重要數據\n\n各式各樣的盤面數據，從不同角度呈現出多空雙方的交控行為，利用它們可以更準確地觀察個股的運行情況。其中，振幅、量比、委比、內盤與外盤、換手率等數據較為重要。\n\
    \n- 1. 振幅\n  振幅是指股價在當日盤中的上下震盪的幅度。振幅展現了多空雙方的競爭情況。個股的盤中振幅越大，說明多空競爭越激烈。過大的盤中振幅，往往是短線股價走勢反轉的訊號。其公式如下。\n\
    \  振幅＝（當日最高價－當日最低價）÷ 上一交易日收盤價 ×100%\n\n- 2. 量比\n  量比，即成交量的相對比值，它以分鐘為時間單位，其數值為當日開市後每分鐘的平均成交量，與過去\
    \ 5 個交易日每分鐘的平均成交量之比，也是一種即時的盤面資料。量比將前幾個交易日的每分鐘平均成交量作為參照，可以幫助我們即時瞭解個股在這一分鐘量能放大或縮小的程度，是發現成交量異動的重要指標。對量比的數值進行分析時，量比值較大的個股（一般來說，量比值至少要在\
    \ 3 以上），更值得關注，可以幫助我們縮小選股範圍。其公式如下。\n\n![](img/ac68af843c2aeef3dbf55e10ca066163_43_0.png)\n\
    \n- 3. 量比曲線\n  在盤中，以分鐘為時間單位，將量比數值依次連接得到一條平滑曲線，這就是量比曲線。它使我們更能掌握個股當日成交量，與近期成交量的相對變化情況。\n\
    \n  一般來說，透過一夜的市場訊息及人們心理上的變化，新的一個交易日開盤的時候，股價及開盤成交量的變化極大。將其反映在量比數值上，就是很多股票開盤時的成交量比數值會高十幾倍，隨後量比數值又急速下降。大多數股票的成交量在新的一個交易日開盤時都顯得很不穩定，因此在通常的行情背景下，我們應該等待量比曲線穩定後再採取行動。\n\
    \n- 4. 委比\n  委比可以反映委買盤與委賣盤的掛單數量對比情況。委比的取值範圍為–100% 至 100%，當委比數值為 100% 時，個股處於漲停板；當委比數值為\
    \ –100% 時，個股處於跌停板。其公式如下。\n\n![](img/ac68af843c2aeef3dbf55e10ca066163_43_1.png)\n\
    \n  委比是具有即時性的盤面數據，隨著委買單、委賣單的陸續掛出、不斷成交，委比數值也會不斷變化。一般來說，當委比數值為正時，說明有較多的委買單在下面承接，這是買方力量相對較強的表現；當委比數值為負時，說明有較多的委賣單壓在上面，這是賣方力量相對較強的表現。\n\
    \n- 5. 內盤與外盤\n  外盤，是指以主動性買入方式成交的股票數量。對於一筆交易，在賣方報價後，買方主動以賣方報價買入，這是主動買入；在買方報價後，賣方主動以買方的報價賣出，這是主動賣出。內盤，是指以主動性賣出方式成交的股票數量。其公式如下。\n\
    \  成交量 = 外盤 + 內盤\n\n  當外盤較大時，說明以主動性買入方式成交的股票數量更多，這是投資人買股意願較強的展現，此時股價也多數會在買盤的推動下出現上漲。當內盤較大時，說明以主動性賣出方式成交的股票數量更多，這是投資人賣股意願較強的展現，此時股價也多數會在賣盤的壓力下出現下跌。\n\
    \n  在實盤操作中，我們需結合個股的價格走勢情況，來解讀內外盤所蘊含的市場訊息，以下列舉 5 種情況。\n  - 在長期下跌後的低位區：價格走勢止穩，量能溫和放大，此時出現的外盤大於內盤的情況，可以被看作是場外資金積極入場、多方力量增強的訊號。若個股可以在之後的更多的交易日中，出現外盤大於內盤的情況，則預示著多方力量正在積累，是後期價格走勢看漲的標誌。\n\
    \  - 在長期上漲後的高位區：價格走勢漲滯，量能相對縮小，此時出現的內盤大於外盤的情況，可以被看作是場內資金陸續離場、空方賣壓漸強的訊號。若個股可以在之後的更多的交易日中，出現內盤大於外盤的情況，則預示著空方力量正在積累，是後期價格走勢看跌的標誌。\n\
    \  - 在穩步上漲的價格走勢中：外盤大於內盤是買盤充足的表現，也是漲勢將持續的標誌。在持續下跌的價格走勢中，內盤大於外盤是賣盤充足的表現，也是跌勢將持續的標誌。\n\
    \  - 在高位震盪區：若個股在盤面中出現了外盤明顯大於內盤，但盤中價格走勢卻無力上漲的情形，是價格走勢看跌的訊號。\n  - 在低位震盪區：若個股在盤面中出現了內盤明顯大於外盤，但盤中價格走勢卻較為穩健、未見明顯下跌的情形，這是價格走勢看漲的訊號。\n\
    \n- 6. 換手率\n  換手率也稱周轉率，它是指一檔股票在「單位時間內的累計成交量與其流通總股本之間」的比率，是反映股票流通性強弱的指標之一。其公式如下。\n\
    \  換手率＝（單位時間內的累計成交量 ÷ 流通總股本）×100%\n\n  一般來說，在計算換手率時，多以交易日為時間單位。假設某檔股票連續 10 個交易日的換手率之和（累計換手率）為\
    \ 100%，我們可以這樣簡單地理解：這檔股票在經過了 10 個交易日的交投之後，其流通在股市上的全部股票籌碼已經從原有持股者手中，轉移到了新加入進來的投資人手中。當然，這只是一種簡單的理解，因為很多投資人都在頻繁地買賣一檔股票，換手率為\
    \ 100% 並不意味著持股者的完全轉換。\n\n  關注換手率時，我們要充分考虑個股的特性。對於大股東持股比例較高的個股，這些股票的換手率會較低；反之，對於大股東持股比例低、股票籌碼高度分散的個股，其換手率就會較高。\n\
    \n  個股的換手率可以反映個股的交投情況是否活躍。一般來說，日換手率小於 3% 表明交投不活躍，市場觀望氣氛較重。日換手率在 3% ～ 7%，表明市場交投氣氛活躍，意味著股票流通性好，進出市場比較容易，不會出現「想買買不到、想賣賣不出」的現象。此種換手率多出現在行情的行进階段，股票透過持續的換手，市場持有成本在不斷地增加或減少，這有利於行情的發展。\n\
    \n  日換手率大於 7% 表明股票在頻繁換手，如果發生在高位，我們應注意風險。此外，對於不同類型的個股，也應區別其換手率標準：大股本的換手率達到 2% 就可以算是較高的水準，而小股本、題材股的換手率一般要超過\
    \ 5%，才可以將其稱作是高換手率。\n\n  高換手率是最值得我們關注的。高換手率說明資金的流入、流出速度較快，若高換手率是由主力資金流入、散戶資金流出引發的，往往預示著機會的到來；若高換手率是由主力資金流出、散戶資金流入引發的，往往是風險的預兆。由於較長時間的高換手率可以表現出資金進出量大、持續性強的特點，因此在實務操作中，能在較長的時間內維持高換手率的股票，極具價值。\n\
    \n### 1.5.2 掛單分析：大單托底與大單壓頂\n\n掛單，就是指委買、委賣盤中的掛單情況。這些單子是已掛出、但卻仍未成交的。正常的掛單情況中，委買盤與委賣盤的單子數量相對平均，每個價位上的單子數量也不會相差太多。但是，有的時候可以看到委買盤的某一價位處掛有超級大單（大單托底），或是在委賣盤的某一價位處掛有超級大單（大單壓頂）。\n\
    \n大單托底給我們的感覺是此股價格難跌，大單壓頂給我們的感覺則是此股價格難漲，但經驗告訴我們，只憑感覺往往並不準確。很多時候，大單托底，但股價在盤中的走勢卻明顯弱於大盤；大單壓頂，但股價在盤中的走勢卻明顯強於大盤。在實盤操作中，我們一定要學會逆向思維，不能單單憑藉對盤面的感覺來做出判斷。\n\
    \n例如，股價走勢在盤中出現小幅度的震盪下行，在震盪下行過程中，委買盤的單子非常大，大單托底給人的感覺是有資金承接，股價難跌。然而，實際情況可能是此股當日的價格走勢較弱，明顯弱於當日大盤。\n\
    \n如果此大單真是為了防止股價下跌、主力護盤的話，那麼在當日大盤走勢較為穩健的背景下，個股的盤中表現應強於同日大盤，但短線走勢出現了一定的股價重心下移的情況。因此，我們對於這種大單托底的情況應逆向理解，從而判斷出這是賣出訊號。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_46_0.png)\n\n# 第 2 章 看懂放量與縮量，因為「有量才有價」！\n\
    \n## 2.1 循序漸進的放量：溫和式放量\n\n成交量形態的變化歸根結底只有兩種情形，一種是放量，另一種是縮量。但是，放量和縮量的具體表現形式多種多樣，有較為溫和的放量，也有突兀式放量，在不同的股價走勢中，它們所蘊含的市場含義也不盡相同。\n\
    \n學習量價知識前，對於成交量的放大、縮小形態，先要有一個較為系統性的瞭解，在此基礎之上，進一步結合實際股價走勢、解讀成交量的細微變化，才能取得更好的效果。在本章中，筆者以「放量」及「縮量」為核心，結合股價走勢，講解一些常見的成交量形態，為讀者打好基礎。\n\
    \n### 2.1.1 溫和式放量的成因\n\n溫和式放量是一種相對溫和的放量形態，它是指成交量與近期的均量水準相比而言，出現循序漸進、幅度不大的放量，成交量的前後變化較為連續，成交量的放大水準多保持在近期均量的兩倍左右。溫和式放量多出現在上漲波段，而在不同個股的中短線價格走勢中，溫和式放量所具有的市場含義也不盡相同。\n\
    \n「漲時放量，跌時縮量」是股價運動過程中的常態，也是市場正常交投的結果。波段上漲走勢中的溫和式放量，屬於普通的放量上漲形態，一般來說，只對局部走勢進行觀察，實戰意義不大。在實盤操作中，我們應將局部走勢中的溫和式放量形態放入趨勢運行中，「低位攀升走勢」、「突破套牢區位置點」和「震盪反彈波段走勢」這幾種情形下的溫和式放量，具有較高的實戰價值，能夠較為準確地預示股價後期的運行方向。\n\
    \n### 2.1.2 低位攀升溫和式放量，有實戰意義\n\n一般來講，當低位攀升溫和式放量這一形態，出現在市場整體或個股長期下跌之後的低位區時，最具實戰意義。因為這時的個股多處於超跌狀態，但超跌並不是股價上漲的動力，只有持續的買盤進入，才能讓股價步入底部並且隨後走入上升通道之中。而溫和式放量的形態，正是買盤持續進入的訊號，也就是股價見底、上漲趨勢即將出現的訊號。\n\
    \n從圖 2-1 中可以看到，在前期經歷了短線快速下跌、中期持續下跌之後，股價進入了低位區。如圖中的標注所示，此時出現了一波上漲行情，量能溫和放大，股價在短線高點止穩不跌，這是買盤積極入場的訊號，預示著行情的反轉，在實盤操作中可以積極地跟進買入。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_49_0.png)\n\n### 2.1.3 升勢創新高溫和式放量，可持股待漲\n\
    \n升勢創新高溫和式放量，是指個股在一波穩健上漲，並且創出近期新高的價格走勢中，出現了成交量循序漸進地溫和放大，而且其均量大於之前上漲走勢中的均量的情形。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_50_0.png)\n\n▲圖 2-2 中宣股份 2019 年 4 月至\
    \ 9 月走勢圖\n\n這種出現在上升途中的溫和式放量形態，是場外買盤資金較為充足的標誌，也預示著股價上升趨勢仍將延續下去。\n\n由圖 2-2 中的標示處可以看到，在震盪上升行情中，一波震盪上升走勢創出了新高，量能較之前的均量而言，出現了溫和式放大的情形，這是買盤資金充足的標誌。由於此時股價的累計漲幅不大、上升形態良好，因此，這種溫和式放量的量價關係，預示著升勢仍將持續下去，我們可以耐心持股待漲。\n\
    \n### 2.1.4 突破套牢區溫和式放量，可積極買入\n\n套牢區因股價破位下行而出現，隨後，股價反彈上漲至這一位置點，較多的被套盤處於解套狀態。同時，由於股價短線上漲而產生了一定的獲利盤，在這個位置點上，若股價能夠以溫和放量的方式突破套牢區，則表明市場籌碼鎖定狀態良好。這或許也可表明市場浮額較少，股價上漲阻力較小。\n\
    \n只要股價短線漲幅不大、中線仍處於相對低位置，則表明股價的中線走勢是向上的，仍會有較大的上漲空間。在實際操作中，股價在突破套牢區後，若能夠在突破位置點止漲，則預示著上漲動力較足，此時我們可以積極地買股入場佈局。\n\
    \n由圖 2-3 可以看到股價在急速下跌之後，跌破了前期的震盪整理區間，從而使得股價進入了一套牢盤較多的區域。\n\n## 2.2 突然大幅度放大：突兀式放量\n\
    \n### 2.2.1 突兀式放量的成因\n\n突兀式放量也稱「脈衝式放量」，它是指成交量在某一日或連續兩日內突然大幅度放大，其放量效果往往可以達到之前均量大小的\
    \ 3 倍以上。而且，在這一、兩日的放量之後，此股的成交量又突然地恢復如初。\n\n一般來說，量能的大縮小有一個連續過濾的過程，這是多空雙方戰爭不斷趨於激烈或不斷趨於緩和的寫照。但突兀式放量則完全不同，它是量能的一次突兀式躍動。突然地放量，又突然地恢復如初，這無疑是成交量的明顯異動。\n\
    \n那麼，突兀式放量是如何被引發的呢？一般來說，它是受消息面的刺激所引發的，下面我們就來看看突兀式放量究竟蘊含了怎樣的市場含義。\n\n利多消息會促使股價上漲，主要是由於股價的快速變動，和市場對利多消息的解讀結果不同，多空雙方產生強烈分歧，造成了較大的交易量。\n\
    \n利多消息刺激下的突兀式放量表明兩種訊息：一是買盤入場力度大，並且當日多方佔據了主動地位，但當日的巨量也造成了對買盤力量的極大消耗；二是交易是雙向的，突兀式放量也說明當日逢高賣壓異常沉重，放量過後，量能突然大幅度萎縮，說明市場後續入場的買盤力量不足。因為「漲時需有量能支撐」，當股價處於短線高點，而量能又無法維持放大態勢時，一波回撤下跌走勢難免會出現。\n\
    \n再來看看利空消息引發的突兀式放量。利空消息引發突兀式放量並且造成股價的快速下跌，這說明市場的主動性快速賣出力量巨大，空方完全佔據了主動地位，這是下跌訊號。\n\
    \n### 2.2.2 短線上衝突兀式放量\n\n短線上衝是指，股價出現了一波短線上漲，漲幅相對較大、漲速較快。從日K線圖來看，股價的一波短線上漲往往會使股價呈出突突突破上漲狀，這時出現的突兀式放量往往與主力的階段性減碼、出貨行為相關。\n\
    \n圖 2-5 中股價經歷了一波短線上漲，上漲幅度相對較大；在有了一個漲停板、全盤獲利的情形下，出現了跳空長十字線的形態，當日成交量異常放大，放大效果大致為此前均量的\
    \ 2 倍；次日量能又突然恢復如初，這就是突兀式放量上漲。出現在此位置點烈的這種量能形態，表明股價短線上攻動力已過度釋放，而且多與主力的階段性出貨行為相關，是短線上漲走勢結束的訊號。在實盤操作中，我們進行中線交易時應減碼，進行短線交易時應獲利離場。\n\
    \n![](img/ac68af843c2aeef3dbf55e10ca066163_52_0.png)\n\n### 2.2.3 寬震區縮頂突兀式放量\n\
    \n在寬震區中，由於股價的上下波動幅度較大，股價走勢會在縮頂受到較強阻力，在縮底獲得較強支撐，此外寬幅震盪走勢常出現在浮額較多、主力參與能力較弱的個股上。\n"
