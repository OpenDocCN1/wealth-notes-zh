    # ## 7.19


    # 早盤大漲後、午盤前後的

    直線漲停形態


    早盤大漲後、午盤前後的直線漲停形態是指，股價在早盤階段大幅上漲，並且呈現出了明顯的強勢運行特徵。隨後，在午盤前後，股價再度自均價線附近快速啟動，出現了一波直線上漲收漲停板，並且牢牢鎖住漲停板至收盤。與
    7.18 節所介紹的「10點前衝高不回落的漲停」形態相比，這是一種主力資金參與跡象更為明顯、股價上漲也更為強勢的分時圖形態。


    它一般意味著主力判斷出大盤走勢較好，且主力有較強的拉升股價的意願，是個股強勢上漲行情出現的訊號。


    在 7-33 的分時圖中可以看到，當日股價在早盤階段大漲，且分時圖呈現了典型的強勢運行特徵（例如：分時線穩健運行於均價線上方、股價上漲幅度較大、量價配合良好（係理想等），這說明有主力資金在積極買賣該股。


    當日股價正好處於上升途中的盤整走勢之後的突破位置點，因此，我們應留意股價盤中隨後的走勢，一旦股價在盤中有再度強勢啟動並鎖住漲停板的傾向時，我們就應及進追漲買入。因為結合該股前期的日
    K 線走勢和早盤階段的表現來看，一旦該股於當日出現強勢漲停板形態，就是該股將出現上漲行情的訊號。


    隨後，股價在午盤之前出現了直線式的大漲，並牢牢鎖住了漲停板，這是股價啟動的訊號，也是主力開始強勢拉升股價的訊號。圖 7-34 為中昌數據的走勢圖，箭頭所指處為
    2019 年 8 月 27 日。'
