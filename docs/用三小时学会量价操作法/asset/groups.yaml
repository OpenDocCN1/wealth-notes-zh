    # 用 3 小時學會量價操作法

    讓我股票賺 3 倍


    為主力對這類個股的參與往往是極為短暫的，當我們發現這類個股並追漲買入時，很可能正迎來主力的快速出貨操作。


    # 5. 整理環節


    整理環節出現在上升途中，是股價震盪整理、市場平均持有成本提高的一個環節。經由整理，前期獲利浮額離場，新買入的市場浮額其持有成本較高，主力隨後可以更為容易地拉升股價，其出貨時也不會有大量的獲利盤爭相拋售。


    在整理環節，如果時間太短，難以完善處理想浮額，無法實現預期的效果；如果時間太長，則不利於形成上漲氛圍。一般來說，時間的長短還與市場的氛圍、主力的實力、投資的風格等因素有關。


    # 6. 再次拉升環節


    再次拉升環節出現在整理環節之後，是主力又一次對股價進行大幅拉升。這一階段的拉升與前期的主升段明顯不同，它多在大盤較好的情況下出現。


    一般來說，主力在大量出貨的時候，勢必會造成股價在高位區震盪溫和的走勢，透過再次拉升，主力可以在出貨時處於更為主動的地位。由於再次拉升，股價將再一次出現較大幅度的上漲。


    # 7. 出貨環節


    出貨環節是主力整個參與過程中的最後一個環節，也是關係到主力投資成功與否的最為重要的一個環節，相對來說也是最難的一個環節。因為對主力而言，如果資金充裕，在強大的資金實力的保證下，建倉、拉升都可以按計劃進行，股價可以達到目標位。但是出貨卻不同，一般要有良好的大盤氛圍來配合，否則主力想要在高位賣出籌碼並不容易。


