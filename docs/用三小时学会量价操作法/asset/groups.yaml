    # 第 4 章 跟著主力，進行低買高賣的「波段獲利法」！


    ![](img/ac68af843c2aeef3dbf55e10ca066163_100_0.png)


    ## 4.1 什麼是主力？他們的獲利手段是什麼？


    主力，即「主要力量」，是一個和「散戶投資人」相對的概念，是證券市場中的主要力量。凡是有一定股票投資經驗的人都會認同：無論對於股價的中長期走勢，還是對於股價的短期走勢來說，主力在其中的參與均有借鑒意義。


    對於散戶投資人來說，要想更實際認識股市運行情況，更深入瞭解成交量後面的交易雙方，那關於「主力」的內容是不可不知的。在本章中，筆者將結合主力的參與環節，以各種特徵鮮明的量價形態為突破口，講解我們應如何跟隨主力進行低買高賣的操作。


    主力與散戶投資人（以下簡稱：散戶）是不同的，主力有著更為專業的知識，對股市的理解也更為深刻，因此，主力對個股的價格走勢的預判強於散戶。在本節中，我們先來看看主力的優勢有哪些。


    ### 4.1.1 主力的優勢


    俗話說：「知己知彼，百戰百勝」，想更理解、把握主力動向，我們首先要對主力的優勢有一個清晰的認識。主力的以下優勢是他們可以將其轉化為勝務的關鍵，而這些優勢往往也是散戶的劣勢。


    - 1. 資金實力強，手中籌碼多

    對股價走勢的影響，程度往往取決於手中持有的股票數量及資金實力，手中沒有足夠的流通籌碼是不行的，即使一般意義上的大戶是不會有這麼多資金的，而散戶手中的資金相對來講則更少。


    雖然主力與散戶都想透過低買高賣來獲取差價利潤，但是散戶買入的股票籌碼數量少，又無法形成合力，這註定了散戶的買賣行為是雜亂無章的，難以對股價走向形成驅動力。


    主力在買賣股票的過程中，會將資金分成兩部分：一部分用於建倉，另一部分則用於拉升股價。這兩部分資金所占比例是成反比的，即用於建倉的資金越多，手中的股票籌碼也越多，那麼維護股價或拉升股價時所使用的資金就會減少。而如果建倉資金較少，那市場中仍存在大量的浮額，浮額越多越不利於主力買賣股票，主力隨後拉升與維護股價時需用到的資金便會越多。


    在實盤操作中，主力會根據個股及市場情況來買賣股票，從而確定多少資金用於建倉、多少資金用於拉升股價，儘量使自己處於主動地位。


    - 2. 對企業的瞭解更充分，買賣行為更明確


    主力的分析、研究能力是較為專業的，對上市公司的業績變化、發展方向、市場空間等方面的瞭解也更深入，主力的這些能力都強於一般的散戶。因此，在買賣股票時，主力的理由也更為充分，買賣行為更為明確，其成功的機率與散戶相比也更大。


    - 3. 更有專業性，更懂得順勢而為


    與散戶相比，主力對於整個股票市場的判斷更具有專業性，也更為理性，當然也更有耐性。在股票市場明顯被低估的時候，雖然股價走勢較為低迷，股市缺少財富效應，但主力往往能夠預見股市的回暖，從而提前操作、低位買入，這就需要有很強的耐性；當股市在過熱的市場情緒的助推下，不斷上漲進入泡沫區後，主力多能夠提前處理、減碼出局，這就需要理性。


    雖然「低買高賣」看似是簡單的交易，但是在股票市場中，若不能克服人性的恐懼、貪婪等因素的影響，想要穩定獲利是難上加難的。主力在這方面遠強於散戶，主要因為主力的理性與專業性，另一方面也是因為主力擁有豐富的經驗。


    - 4. 瞭解散戶的買賣方式、操作心態


    在買賣方式上，散戶容易出現「追漲殺跌」的操作，在心態上，則更容易受到「貪婪」與「恐慌」這兩種極端情緒的影響。而主力對於個股的運行有著更為理性的判斷，不易受情緒影響。主力在高位出貨時，若當時的大盤氛圍好，散戶往往是承接盤，主力再悄然出貨；當大盤較為低迷時，主力往往會更有耐心、提前操作，等待市場回暖，散戶則通常缺乏耐心與遠見。


    - 5. 主力獲取大波段利潤，散戶獲取「螻蟈小利」


    對於散戶而言，其交易十分頻繁，甚至是今買明賣，想著天天捕捉漲停板，最終卻發現所獲利潤寥寥無幾。實際情況也確實如此，很少有散戶能夠在一檔股票上賺取超過 30%
    的利潤，獲利了結是散戶共通的心態，也就因此錯過一些黑馬股。


    可以說，散戶過於頻繁的交易既是對自己判斷的懷疑，也無法保證利潤的穩步增長，獲取的只是股市中的「螻蟈小利」；一旦大盤跳水、股市疲軟，這些小小的利潤往往會很快「回吐」給市場，甚至最後虧損出局。


    主力則不同，主力資金強、持股多，只要市場不崩場，他就可以按部就班地買賣股票。想要低位買入，高位賣出，那麼建倉是第一步，它是主力收集籌碼的步驟；出貨是最後一步，它是主力套現離場的步驟。可以說，主力以獲取大波段利潤為目的，而不是短期內的小波段利潤，買賣實過程結束後，主力往往可以獲取巨額利潤。


    ### 4.1.2 解析主力參與環節


    主力的獲利手段也是低買高賣，但這「低」與「高」之間卻需要充分的上漲空間，才能保證手中巨量的股票籌碼獲利。為了完成低位買入、高位賣出的任務，主力要進行進貨、拉升、整理、再度拉升、出貨等一系列有目的且有計劃地操作，它們就是主力參與個股的過程中的環節。下面我們就以主力參與個股的前後時間順序為主軸，來看看主力參與下的各個環節。


    1. 選股策略


    不同類型的主力有不同的選股策略。中長線主力多以「業績」為基礎，結合個股的行業特點、成長性、潛在資產、注入題材等方面來綜合選股，對個股的參與時間跨度也更長；而短線主力則更關注市場熱點，重「題材」、輕「業績」，對個股的參與往往是「一波到頂」。


    主力資金的類型不同，主力的投資方式也不相同。能夠經常即時看盤的主力，可以多關注市場中的熱點，側重於分析短線主力的市場行為，實施快速跟進、跟隨熱點的策略；而沒有時間看盤的主力，宜多分析中長線主力行為及相應的個股，實行提前操作、耐心持有的策略。


    2. 建倉環節


    建倉環節也稱為進貨環節，是主力買入籌碼的一個階段。在建倉環節中，我們應關注「低位區」，這是主力建倉時的一個必要非充分條件，即「主力建倉時基本都是在低位區，但在低位區運行的個股未必有主力建倉」。


    主力建倉講究的是「低價」，若個股處於長期大幅下跌時，我們可以將它此时的股價稱為低價。反之，若個股前期出現了較大的累計漲幅時，我們就不能將這時的股價稱為低價了。主力只會在個股處於低價的時候建倉，这也是我們分析個股是否有主力建倉時，須格外注意的一點，即個股的總體運行趨勢。


    不同類型的主力，其建倉方式也不相同。中長線主力為了保持其較低的持有成本，會在低位區慢慢吸納籌碼；而短線主力為了保持題材股的市場熱度，往往是建倉、拉升一氣呵成。在後續章節中，筆者將結合具體的量價形態，來展示不同類型主力建倉時的盤面特徵。


    3. 震倉環節


    震倉環節只出現在少部分主力買賣股票的過程中。一般來說，在主力進貨之後、拉升之前，結合市場的短線調整，主力並不會大力買入，而是讓股價在短線獲利賣壓下順勢回落。如此一來，市場持有成本會有所提升，有助於為主力隨後的拉升創造更好的條件。


    4. 拉升環節


    拉升環節就是主力將股價持續拉高的階段，主力建倉的目的是實現低買高賣並從中獲得收益。為了實現「高賣」，股價必須要漲上去才行，這就是主力拉升的目的所在。一般來說，若主力前期進貨越充分，市場浮額就會越少，主力拉升時所面臨的獲利賣壓也就越輕；反之，主力在拉升時受到的阻力則相對較大。


    主力在拉升階段會暴露自己的行蹤，對散戶而言，應及時發現主力的拉升行為，進而快速展開操作——買入。買入的時間越早，越接近主力的成本區域，散戶的交易風險就越小。在追漲時，特別要注意那些題材熱度不夠、短線漲幅已較大的個股，因為主力對這類個股的參與往往是極為短暫的，當我們發現這類個股並追漲買入時，很可能正迎來主力的快速出貨操作。


    5. 整理環節


    整理環節出現在上升途中，是股價震盪整理、市場平均持有成本提高的一個環節。經由整理，前期獲利浮額離場，新買入的市場浮額其持有成本較高，主力隨後可以更為容易地拉升股價，其出貨時也不會有大量的獲利盤爭相拋售。


    在整理環節，如果時間太短，難以完善處理想浮額，無法實現預期的效果；如果時間太長，則不利於形成上漲氛圍。一般來說，時間的長短還與市場的氛圍、主力的實力、投資的風格等因素有關。


    6. 再次拉升環節


    再次拉升環節出現在整理環節之後，是主力又一次對股價進行大幅拉升。這一階段的拉升與前期的主升段明顯不同，它多在大盤較好的情況下出現。


    一般來說，主力在大量出貨的時候，勢必會造成股價在高位區震盪溫和的走勢，透過再次拉升，主力可以在出貨時處於更為主動的地位。由於再次拉升，股價將再一次出現較大幅度的上漲。


    7. 出貨環節


    出貨環節是主力整個參與過程中的最後一個環節，也是關係到主力投資成功與否的最為重要的一個環節，相對來說也是最難的一個環節。因為對主力而言，如果資金充裕，在強大的資金實力的保證下，建倉、拉升都可以按計劃進行，股價可以達到目標位。但是出貨卻不同，一般要有良好的大盤氛圍來配合，否則主力想要在高位賣出籌碼並不容易。


