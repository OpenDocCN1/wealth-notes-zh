    # ◎ 4.3.2 震盪區漲停式反覆進貨


    震盪區的漲停板常會激發多空分歧，因為漲停板使得震盪區密碼處於解套狀態，市場浮額的鎖定度大大下降，主力可以趁機進貨，且漲停板的出現正是主力從中助推的標誌之一。


    利用漲停板激發多空分歧，主力在震盪區反覆進貨，個股在漲停板出現前後的五個交易日中量能明顯放大，在隨後的回落走勢中則明顯縮量。反覆震盪之後，主力最終實現了較強的參與能力。


    因此，隨著震盪走勢的持續，我們會看到個股的量能逐漸縮小，這正是主力鎖倉、市場浮額減少的重要標誌。這種利用震盪區反覆出現的漲停板來進貨的方式，多出現在中線主力參與股中。一旦這類股票開始突襲上攻，其潛在的上升空間是很大的。


