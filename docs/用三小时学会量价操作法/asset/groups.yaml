    # 2.3.1 連續式放量的成因


    從形態上來看，連續式放量至少能保持3個交易日以上，而且放量程度較為接近。在盤面上可以陸續看到較大的賣盤、買盤出現，盤中交投十分活躍、大單交易頻繁。連續式放量出現時，當日的成交量會顯著高於此前的均量，股價波動劇烈。


    連續式放量常出現在高位區，或一波快速上漲走勢中。但當連續式放量開始出現縮量時，往往就是中短線見頂的訊號。實盤操作中它是警惕我們的反轉訊號之一。


