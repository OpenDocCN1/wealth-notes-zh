    ## 6.15 連續小陰線縮量下滑形態，預示股價即將下跌


    多空力量的轉換往往是一個循序漸進的過程，陰線、陽線僅代表著一天交易後的多空勝負情況。若個股連續收出小陰線、使得股價開始下滑，即使同期的量能萎縮，這也是空方力量開始轉強的訊號。特別是當股價處於短線上漲後、潛在獲利賣出較多的位置點時，這種連續縮量小陰線的走勢，很容易使得持股者失去耐心而選擇拋售，從而進一步加快股價的下跌速度。


    一般來說，盤整後出現這種連續小陰線縮量下滑形態，往往是股價破位下行前的警示訊號，短線高點出現這種形態，則預示著股價大幅調整的展開。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_185_0.png)


    圖 6-25 中，股價在大盤橫向震盪期間經過了「特立獨行」的上漲，累計漲幅較大，主力在高位區有出貨的需求。如圖中的標注所示，此時出現了連續小陰線縮量下滑形態，這就是高位反轉、股價加速下行前的警示訊號，也是多空力量轉變過程中的一個短暫的過渡時期，如果我們不能準確地辨識它，很有可能會在高位區被套牢。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_186_0.png)


    # 第 7 章

    我用分時圖，抓到個股「最佳買賣點」！


    ## 7.1 早盤中出現放量上揚，應逢回落的低點買入


    日 K 線圖中的量價配合關係固然重要，但對於短線交易來說，能夠在盤中捕捉到最佳買賣點往往才是交易的關鍵。短線的買點越低，我們在操作中就會越主動，設立的停利位和停損位就更不易受大盤偶然波動的影響。


    短線的買點把握得好，就可以獲取更多的利潤，實現「正確的交易多賺、虧損的交易少賠」，有利於資金的滾動增值。而要想更精準地判斷盤中高點和低點，正確解讀盤中量價形態，就是其中的關鍵。在本章中，我們將聚焦分時圖，看看分時圖中的量價關係，能為我們提供哪些買賣訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_188_0.png)


    早盤是多空雙方的必爭之地，特別是對於主力而言，參與能力相對較強的主力往往會選擇在早盤拉升股價，而非尾盤。


    如果股價中短線漲幅較小，在早盤中出現放量上揚的形態，隨後能在盤中節節走高、呈強勢運行格局，並且當日放量效果溫和，那麼多預示主力有意拉升股價、市場賣壓相對較輕，一輪中短線上攻行情或將開啓。實盤操作中，在隨後幾個交易日，我們可以逢盤中股價震盪回落的低點進行短線買入操作。


    由圖 7-1 此分時圖可以看到，股價在緩緩攀升的過程中，當日加速上漲。早盤放量上揚、盤中節節走高，這是主力開始大力拉升股價的訊號，短期內出現一波上攻走勢的機率較大。若無明顯的熱門題材支撐，則隨後一兩個交易日就是短線入場的最好時機；若有消息、題材面配合，則當日即可追漲買入。


    ## 7.2 盤中量價齊升不回落，收盤前應積極短線買入


    盤中量價齊升不回落形態，是指股價在盤中交易時間段出現了流動快速上揚，主力拉升動作明顯。在快速上揚的過程中，成交量隨著股價的衝高而不斷放大，即量與價呈同步不斷上升的態勢。在隨後的盤中高點，股價強勢整理的回落，距離下方的均線維持有一定的距離。


    這是一種極為強勢的分時圖中的量價組合，流動快速的股價上揚伴以同步放大的量能，是主力大量入場拉升的表現。股價在隨後的盤中高點處不回落，說明市場獲利賣壓輕、主力參與能力強。若此時股價的中短線漲幅較小，則這種盤面形態預示著有望展開一輪上攻行情。在實盤操作中，若當日盤中漲幅不大（小於
    5%），則收盤前可以進行積極的短線買入操作。


    圖 7-2 的當日盤中股價快速上揚，分時圖中呈現出了量價齊升的形態，而且隨後股價在盤中高點處強勢運行、震盪緩升，股價重心不回落。結合日 K 線圖來看，此時正處於低位盤整突破點，因此，可以判斷出這個強有力的上揚分時圖，是一波上漲行情開始的訊號，也是提示我們應短線入場的訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_190_0.png)


    △圖 7-2 中國巨石 2019 年 11 月 7 日分時圖


    在實盤中，與此案例形態相似但不完全相同的分時圖有很多，我們應注意其形態的變化。其中，理解形態的市場含義、學會解讀形態的變化才是關鍵。下面來看一個與此例形態相近但又略有不同的分時圖。


    圖 7-3 中可以看到，該股在其價格盤中上揚時出現了量價齊升形態，但量價的配合還不夠理想，量能的放大不充分、分時線不夠挺拔，隨後在盤中高點股價也出現了一定的回落，但回落幅度較小。


    綜合來看，圖 7-3 是一個與圖 7-2 形態相似但又相對「弱勢」的分時圖，但它仍不失為一個預示股價短線上漲的訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_191_0.png)


    △圖 7-3 光電股份 2019 年 6 月 11 日分時圖


    ## 7.3 量堆推升節節高，股價中線的上漲空間可觀


    量堆推升節節高形態，也稱為「台階式上揚」形態。從形態的角度來看，股價如同邁著台階向上漲，在每一波快速上揚後都會出現一個量能堆；隨後，股價在推升後的高點強勢橫向運行，這是一個整理過渡時期；最後，再度出現量能堆，推升股票至盤中新高點。


    這種盤面量價形態往往是中長線主力入場，並積極拉升股價的訊號，股價的上漲有著堅實的基礎，盤中高點的買盤承接力度也很強，市場買盤不重。若股價累計漲幅不大或者正處於盤整後的突破點，則這種盤面形態預示著將展開一輪上漲行情，短線交易有一定的利潤空間，股價中線的上漲空間也較為可觀。


    圖 7-4 中可以看到，在低位的橫向整理之後，股價在 2019 年 8 月 19 日開始向上突破。盤中出現了多次較為明顯的上漲，每一次上漲後都有一個量能堆，且上漲後的盤中高點都能夠強勢平穩運行，從而能在盤中不斷走高。這是一個強勢型的分時圖，有主力積極參與，此時是買入時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_192_0.png)


    ## 7.4 活躍量能的斜線式拉升，是低風險的買入時機


    活躍量能的斜線式拉升形態，是顯出主力蹤跡的一種盤面量價形態。在盤中，常常是在尾盤階段，股價的上揚走勢呈 45 度角（或 60 度角）的斜線狀，持續上漲的時間較長，整個上揚過程中的量能保持著放大的態勢。


    一般來說，如果斜線拉升的幅度不是很大，且股價在盤中高點能夠止穩不回落，那麼表明主力參與能力較強，其拉升行為會在隨後的日子中持續下去。在實盤操作中，我們還應關注日
    K 線圖，如果這種盤面量價形態出現了中短線的低點，則是一個風險低、潛在收益高的買入時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_193_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_193_1.png)


    圖 7-5 中可以看到，股價在尾盤階段出現了斜線式放量拉升，當日成交量放大，股價正處於盤整突破點。結合此時圖所顯示出的主力參與行為分析後，可知隨後股價出現突破上攻的機率極大。在實盤操作中，我們可以短線買入，享受主力拉升成果。


    ## 7.5 低開下探帶量震盪上揚，應趁回檔低點買入


    低開下探帶量震盪上揚形態，常出現在一波快速下跌走勢中。股價當日慣性低開，開盤後出現了一波跳水，但隨後即在盤中的承接下開始震盪上揚，並躍升至均價線上方，成交量保持相對放大的狀態。


    這種量價形態是短期內多空力量轉變的訊號，在實盤操作中，當股價震盪上揚、向上攀升明顯時，表示多方力量已經明顯佔據了主動地位，我們可以逢盤中回檔低點買入，因為股價在隨後的盤中節節走高機率較大。若個股出現這種量價形態，則其收盤價往往接近全天最高價，短線買入的風險較低。


    圖 7-6 中可以看到股價短線下跌，幅度大、速度快。當日早盤股價下探，隨後震盪上揚、放量攀升。至此，多空力量對比格局開始轉變，雖然因盤中的震盪回升，股價略有上漲，但從日
    K 線圖來看，短線的反彈才剛剛開始。在實盤操作中，我們應趁盤中回檔，低點買股入場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_195_0.png)


    △圖 7-6 西藏藥業 2019 年 8 月 12 日分時圖


    ## 7.6 早尾盤二度上揚，顯示買入的訊號


    早尾盤二度上揚形態，是主力拉升股價時一種較常見的盤面形態。早盤開盤後不久，股價快速上揚，分時成交量同步放大，股價隨後在盤中橫向運行，持續時間長；在尾盤階段，股價再度上揚，分時成交量同步放大。透過這兩波拉升，股價在盤中穩健上漲，這也是中短線內主力有意拉升股價、股價步入上升通道的訊號。在實盤操作中，如果股價突破低位盤整區或處於短線超跌狀態，則此分時圖中的形態預示著一波上攻行情的出現，這是買入訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_196_0.png)


    圖 7-7 中的個股在早盤階段、尾盤階段均出現了流暢、挺拔的上揚走勢，中盤階段股價強勢橫向運行，這與主力資金的積極參與密切相關。從日 K 線圖中來看，當日正處於低位整理後的突破點。結合分時圖進行分析後，可知道是主力拉升的訊號，預示著上行情的展開，是買股入場的時機。


    同一個主力在買賣個股時往往會採取相同的手法，該股價格在整理數日之後的 2019 年 9 月 10 日，再度出現了首尾盤二度拉升的盤面形態。如圖 7-8 所示，首尾盤的兩波上揚也有明顯放大的量能作為支撐，與圖
    7-7 的拉升遙相呼應，主力做多意願較強、做多行為堅決。此時的股價中短線漲幅較小，仍有較為充裕的上升空間，在實盤操作中，我們此時則應該耐心地持股待漲。


    # 第 7 章 我用分時圖，抓到個股「最佳買賣點」！


    ![](img/ac68af843c2aeef3dbf55e10ca066163_197_0.png)


    ## 7.7 水平式巨量，應第一時間離場以規避風險


    水平式心電圖巨量形態也稱為「一字形巨量」形態，它是指個股在盤中的分時線呈水平運行，或水平式的上下跳動，分時成交量大幅放出。水平巨量形態的執行時間可長可短，短為十幾分鐘，放量較為明顯；長則幾小時，放量較為均勻，但兩者的市場含義是一樣的，不必單獨分析。


    一般來說，在水平巨量分時線形態出現之前，股價往往會先在盤中出現一波快速上衝走勢，隨即快速跳水，並且呈現出水平巨量的分時線走勢。


    水平巨量分時圖給人的直接感覺是大買單與大賣單正展開交鋒，似乎有老主力出局，新主力在入場進貨。然而，實際情況並非如此，股價在隨後的運行中往往會快速下跌，這表示並沒有新入場的主力在積極買賣個股。


    筆者就許多案例分析後，得出此形態的分時圖常出現在股價短線漲幅較大的情況，它是一種較為可靠的短線下跌訊號。在這種分時圖出現之後，股價在短期內有很大的機率將會出現急速下跌。因此，對於散戶來說，當遇到此類分時圖中的形態時，不應抱有僥倖心理，應第一時間賣股離場以迴避風險。


    圖 7-9 中的股價短線漲幅較大，當日股價在盤中跳空高開，隨即向下衝跌，呈水平運行狀，分時線未呈現買賣雙方交易過程中本應出現的波動形態。而且，在水平運行中，我們可以看到量能明顯放大、大買單與大賣單交易頻繁，當日的放量效果從日
    K 線圖中可以看得更清晰。這是有大資金在積極賣出的訊號，在實盤操作中，我們應及時賣出離場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_198_0.png)


    ▲圖 7-9 長春經開 2019 年 6 月 18 日分時圖


    ## 7.8 「皮球落地」巨量跌停，應逢反彈及時賣出


    「皮球落地」巨量跌停形態，是一種有趣的比喻說法。它的形成過程一般是這樣的：當日個股因利空消息或價格短線漲速過快，先是出現了跌停或接近跌停，隨後股價在盤中被突然拉升，但在盤中高點沒有得到支撐，股價開始快速地向下滑落，向下滑落過程中的反彈力度越來越弱。整個過程如同「皮球落地」，股價最終又向下滑落至跌停價附近，當日成交量呈巨量形態。


    這種分時圖中的形態是短線暴跌拉開序幕的訊號，也是短線主力快速出貨的標誌，在實盤操作中，我們應該逢反彈及時賣出才能更好地迴避風險。


    圖 7-10 中可以看到，當日股價在急速上漲、開高後快速跳水奔向跌停板，並在盤中反覆鎖住跌停板；午盤之後被突然拉升超過 10%。這種拉升並不意味著有跟風盤進入，只是主力在製造多空分歧，目的就是快速出貨，隨後的盤面運行猶如「皮球落地」，當日放出了巨量。在實盤操作中，主力在盤中的快速拉升給了持股者逢高退出的時機，不可錯過。


    圖 7-11 中的股價短線漲幅極大，短線主力對股價進行了快速拉升，在出貨時往往也十分快速，主要採取突然下跌至跌停板、然後盤中拉升的方式，從而吸引短線跟風盤入場，主力則在跟風盤入場時，減碼出貨。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_200_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_200_1.png)


    ▲圖 7-10 ST 昌魚 2019 年 4 月 18 日分時圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_200_2.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_200_3.png)


    ▲圖 7-11 東方創業 2019 年 3 月 29 日分時圖


    ## 7.9 破位前跳水式出貨，是股價破位前的警告


    快速出貨是主力常用的手法之一。在股價短線高點或盤整之後，若主力感覺出貨較為吃力，為了節省時間，主力往往會採取快速賣出的方式來提升出貨速度。有時候，股價盤中放量跳水之後，還能短暫地「收復失地」，在日
    K 線圖上收出一條長下影線，可能是長下影陰線，也可能是長下影陽線，但它們的市場含義較為接近。這給投資人的印象是買盤承接力較強，殊不知這只是股價真正破位前的一次警示訊號，若我們不能正確解讀它，則會損失慘重。


    圖 7-12 中的股價在上漲之後，當日走勢突變，早盤直線跳水並伴以分時成交量的大幅放出。雖然在收盤前股價再次被拉回，但這種放量長下影線可以被看作是股價破位前的一次預演。在實盤操作中，我們此時應警惕風險，及時賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_201_0.png)


    △ 圖 7-12 富奧股份 2019 年 4 月 19 日分時圖

