    △圖 8-8 深科技 2020 年 1 月 3 日分時圖


    ### 8.6 突破點連續加碼式放量（能源類股）


    突破點連續加碼式放量形態，是中線主力快速建倉、加碼時的一種盤面形態。從日 K 線圖來看，股價先是在低位區長期整理，波動幅度較小、主力進貨較為緩慢，受大盤或行業回暖等因素影響，主力看到了拉升時機，但手中籌碼數量不多。


    此時股價仍處於低位區，主力採取快速拉升、突破平台區的方法進行短線加碼，連續幾日（一般來說至少 3 日）的長陽線伴以放量，主力可以大量進貨，從而為隨後的進一步拉升打好基礎。


    在實盤操作中，我們還應觀察連續放量後的股價走勢，若股價能夠在短線高點強勢整理不回落，則說明主力中短線做多意願較強，不願讓股價再度回落至持有成本區。此時，也應順著主力的思路，短線追漲入場。若出現放量長陰線，則表示主力參與能力仍不強，我們在中短線操作上不宜追漲，應等短線回撤較為充分時，再選擇買入。


    # 實戰案例：華能水電


    圖 8-9 為華能水電的走勢圖，股價在突破時，連續 3 日放量並伴以中陽線，這是主力加碼買入、進行拉升的訊號。隨後的強勢整理和縮量向我們表明：市場賣壓較輕、主力無出貨行為。結合股價中短線漲幅較小的情況來看，股價在主力的積極參與下，有望進一步震盪走高。在實盤操作中，我們在這個縮量整理平台可以進行買入操作，並且耐心持有，等待股價上漲。


