    # 5.12


    # 放量突破後，應逢短線回檔之際買入


    「寬震式漲跌」是指盤中振幅較大的陰線、陽線在數個交易日內交替出現的量價形態。即這幾個交易日的盤中波動幅度較大，但由於陰線、陽線交替出現，股價沒有上漲。「放量突破」則是指股價突破這個短線寬幅區間時，出現了明顯的放量。


    寬震式漲跌是股性開始明顯活躍的訊號，多與主力積極參與有關，此時的量能也會因盤中震盪幅度的加大而放大，股價運行方向尚不明確。隨後的放量突破則表明主力資金的行為是做多的，而且經歷了寬幅震盪區間後，多方已明顯佔據主動地位，這是有望展開一輪上攻行情的訊號。在實盤操作中，我們可以在放量突破後，逢短線回檔之機買入。


    從圖 5-14 可以看到，股價在長期盤整之後出現了寬震式漲跌形態，隨後的放量


