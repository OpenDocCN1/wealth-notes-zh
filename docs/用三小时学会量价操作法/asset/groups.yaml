    對於該股票來說，雙陽天量中的第二個交易日收盤前是最好的賣出時機。如圖 6-24 此分時圖中可以看到，當日股價振幅超過 10%，尾盤時又無法收漲停板，這說明經過了一天的上漲之後，由於多方力量消耗過大，因此在收盤階段已是空方佔優勢了。這是典型的弱勢型分時圖，次日低開的機率較大，結合雙陽天量這個賣出訊號進行分析後，收盤前果斷賣出、鎖定利潤是較佳的策略。'
