    # 1.3 如何建立交易前的完善系統？


    投資人依據量價關係展開實盤交易時，不應只關注局部。對於剛剛接觸這一技術分析領域的投資人來說，首先應建立一套較為完善的交易系統，在熟練掌握之後，就可以從量價圖輕鬆辨識出交易系統中需提前關注的盤面資訊，進而快速地依據量價關係展開實盤交易。


    一般來說，量價分析流程應是先進行全域分析，再看局部運行，最後進行細節化分析。全域分析主要是對於趨勢的判斷；局部運行則是關注股價的短期波動情況；細節化分析是結合個股的具體量價形態，依據它的歷史表現來分析多空力量的變化情況，進而預測股價漲跌趨勢。在本節中，我們將以流程化的方法，來簡單介紹量價實盤交易的各個環節。


    # 1.3.1 市場趨勢运行情况


    「趨勢」一詞的字面意思為：事物或局勢發展的動向，並且這種發展動向具有客觀性、不以人的主觀意志為轉移。在統計學中，趨勢具有時間性，主要是指時間軸上的某個可見的動向，是一種線性發展的客觀規律。可以看出，趨勢代表一種較為確定的發展方向。將「趨勢」一詞引入金融市場中，它是指價格走勢的某種客觀規律性，而且這種趨勢是不以人的意志為轉移的。那麼，股市中的「趨勢」究竟是指什麼呢？


    股市中的趨勢是指股價運行的大方向，而股價運行的大方向無非 3 種，即上升、橫向震盪、下跌。因此，股價運行的 3 種趨勢就相應地分為上升趨勢、橫向震盪趨勢、下跌趨勢。順應趨勢的發展方向來操作，我們可以最大限度地獲取利潤、迴避風險；反之，「逆市而動」則將使我們處於一種極為不利的境地。'
  - '[PAGE 25]


    在分析量價關係、預測股價走勢時，市場趨勢運行情況就是我們開展交易的背景環境，也直接關係著我們的倉位調度。在上升趨勢中，我們的操作可更為積極一些，短線交易也可以更為頻繁一些；在下跌趨勢中，我們則更應關注本金安全，更宜輕倉參與。


    因此，在展開交易前，首先應判斷市場趨勢運行情況，判斷當前的趨勢是處於橫向震盪之中，還是處於上升趨勢或下跌趨勢之中；是處於上升趨勢的回檔階段，還是處於大幅下跌後的探底階段。可以說，趨勢分析是一項重要的工作，在之後的
    1.4 節中，筆者將結合移動平均線來進行詳細講解。


    對於大盤指數來說，它反映的是市場多空力量整體對比情況，一旦多空力量對比格局形成，就具有較強的持續性。


