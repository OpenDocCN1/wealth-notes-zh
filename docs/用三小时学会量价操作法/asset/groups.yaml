    ## 5.4 「紅三兵」是可靠的上攻訊號


    「紅三兵」是指連續 3 條中小陽線的 3 日 K 線組合。一般來說，紅三兵代表著多方力量佔據優勢，是上漲訊號；但在某些時候，紅三兵發出的訊號並不是上漲訊號。為了確保紅三兵形態的準確性，我們還要結合
    K 線整體運行形態及量能變化來判斷。當溫和放量的紅三兵出現在盤整區的突破位置點時，就是一個可靠的上攻訊號。它代表著買盤積極入場、多方力量充足，是即將展開一輪上攻行情的可靠訊號。


    圖 5-6 中可以看到，股價在中短期大幅下跌後的低點，出現了橫向震盪走勢。隨後連續 3 條溫和放量的小陽線，使股價開始向上突破震盪區。這就是突破點溫和放量紅三兵形態，也是買盤入場積極、股價有望展開上攻走勢的訊號。在實盤操作中，由於此時的股價中短線的漲幅均較小，因此我們可以追漲買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_141_0.png)


    ### 5.5 回檔後的縮量整理平台，主力隨後快速拉升


    ![](img/ac68af843c2aeef3dbf55e10ca066163_142_0.png)


    放量盤升後回檔點縮量平台是一個組合形態，它由兩個局部形態構成。首先是溫和放量並且股價緩慢向上升，一般來說，這種走勢具有一定的獨立性，強於同期大盤，往往是個股有主力資金積極參與的訊號。隨後，受大盤回落影響，股價沒能在短線高點止穩，而是順勢回落至前期起漲點附近，此時做橫向窄幅整理，量能大幅縮減。


    這種形態的出現常與主力的行為相關。只要股價當前處於累計漲幅不大的位置點，一般來說，隨後會有較大的上漲空間，而這個回檔後的縮量整理平台，常常就是主力快速拉升前的一個過渡階段。在實盤操作中，此縮量平台是中短線入場的好時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_142_1.png)


    ▲圖 5-7 北京城鄉 2018 年 10 月至 2019 年 5 月走勢圖


    圖 5-7 中可以看到，股價在中短線回落幅度較大的相對低點，先是出現了持續的橫向窄幅整理。隨後，股價向上緩慢攀升，形成了一個放量盤升平台。這期間的走勢，該股明顯強於同期大盤，具有一定的獨立性，標誌著主力積極參與此股，獨立上漲的放量盤升平台，更有可能是主力積極的進貨行為所形成的。


    隨後因大盤短線下跌，股價順勢回落，跌回至起漲點附近。此時出現了縮量窄幅運行的整理走勢，這是大盤震盪給我們創造的一次短線入場良機，應把握住入場機會。


    ### 5.6 穿越型的長陽線，可以積極買入佈局


    ![](img/ac68af843c2aeef3dbf55e10ca066163_143_0.png)


    平量長陽突破寬震區形態，是指股價走勢在多個交易日內形成的長陽線、長陰線交替出現的寬震格局。雖然每個交易日的股價盤中振幅較大，但由於長陰線、長陽線交替出現，所以股價重心並未向上移動。此時，一條實體更長的陽線以平量方式，向上穿越了這個寬震區，股價也達到了近期小高點，較高的收盤價使得寬震區的籌碼均處於獲利狀態。


    穿越型的長陽線是多方積極做多的標誌，平量則代表主力資金實力較強。如果股價的中短期漲幅較小，或者股價處於未啟動狀態，則多預示著有望展開一輪上攻行情，在實盤操作中，我們可以積極買入佈局。


    圖 5-8 中可以看到，該股緩慢攀升的價格走勢十分穩健，在攀升區的突破點，形成了一個長陽線、長陰線交替出現的寬震區，這是多空產生分歧的區域，也是股價運行方向將明確的標誌。隨後的平量長陽線突破形態，表明股價的運行方向是向上，在實盤操作中，我們應跟隨訊號，積極買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_144_0.png)


    ### 5.7 縮量雙（三）探低形態，有望展開上攻行情


    縮量雙（三）探低形態，是指股價出現了類似於「W」的二次探低（或者三次探低）的震盪走勢，在整個震盪過程中，成交量逐漸減少。


    無論是第二次回探震盪區低點，還是第三次回探震盪區低點，成交量都比前一次回探震盪區低點有所縮減，這說明股價破位下行的做空力量逐漸減弱。如果此時股價的震盪區處於中線低點，那麼這種量價形態可以被看作是多方力量轉強、空方出貨無力的標誌，預示著隨後有望展開突破上攻行情，當二次（或三次）回探震盪區低點時，便是很好的中短線入場點。


    圖 5-9 的股價在中期低位區間出現了橫向震盪走勢。這期間的成交量隨著震盪的持續而不斷縮減，第二次回探震盪區低點時是一個買點，但此時的股價仍有破位下行的可能。因此，我們可以透過控制倉位的方式來降低風險。但當股價第三次回探震盪區低點時，成交量已明顯縮小，且構築了一個低點整理平台，止穩訊號明顯。此時可以加大買入力度，從而獲取多空力量轉變後的反轉行情帶來的利潤。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_145_0.png)


    △圖 5-9 赤峰黃金 2018 年 10 月至 2019 年 7 月走勢圖


    ### 5.8 寬幅箱體區低點強縮量形態


    ![](img/ac68af843c2aeef3dbf55e10ca066163_146_0.png)


    寬幅箱體區低點強縮量形態，是指股價出現了橫向的寬幅箱體震盪走勢，震盪區一般處於中期高點位，箱體震盪持續時間較長。隨著震盪的持續，當股價再度經短線回落至箱底時，成交量大幅縮減，明顯小於前期震盪回檔後的成交量，故稱之為「強縮量」。


    這種量價形態多標誌著在箱體震盪的過程中，有主力資金進行了積極的進貨。在箱底位置出現強縮量時，也意味著主力參與能力較強、手中掌控的籌碼較多，個股有望迎來突破箱體區的上攻行情。此外，從短線角度來講，股價也有向上反彈再碰觸箱頂的趨勢，可以說是在中短線投資中較佳的買入點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_146_1.png)


    圖 5-10 中可以看到，股價在短期上漲後的高點長期震盪。如圖中的標注所示，當股價隨著震盪的持續而再度回落至震盪區低點時，此時的成交量呈極度縮量形態，這是主力持股數量較多、空方無力使股價降低的訊號。而且，震盪區低點也是一個很好的反彈買入點，在實盤操作中，此時我們可以大膽買入。


    ### 5.9 「倒三角回升」形態


    ![](img/ac68af843c2aeef3dbf55e10ca066163_147_0.png)


    「倒三角回升」形態，由一條長陰線之後的連續多條小陽線組合而成，「縮量倒三角」則是指包括長陰線當日的多個交易日內，成交量處於相對縮小的狀態。一般來說，連續小陽線時的量能萎縮得更為明顯。


    低點縮量倒三角回升形態出現在短線低點，特別是在股價短線上衝後再度回探前期低點位時。此時股價無力破位下行，只要股價中短線累計漲幅小、短線跌幅大，此形態大多能準確地預示一波上攻行情的展開。在實盤操作中，如果長陰線之後出現了連續的縮量小陽線，並且此時的股價短線漲幅小，則縮量倒三角形態已完全形成，那麼我們可以積極買股入場。


    圖 5-11 中可以看到，股價的中短線跌幅較大，此前有明顯的獨立上攻行情。在這個股價將要破位下行、短線跌幅較大的位置，出現了縮量倒三角形態，表示這是一個階段性的反彈訊號，說明多空力量對此已經發生轉變，在實盤操作中，我們可以短線買入。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_148_0.png)


    ▲圖 5-11 首鋼股份 2018 年 12 月至 2019 年 4 月走勢圖


    ### 5.10 看到平量式攀爬上看震盪區間，應耐心持股待漲


    ![](img/ac68af843c2aeef3dbf55e10ca066163_148_1.png)


    平量式攀爬上看震盪區間形態，是一種揭示主力參與股情況的量價形態。個股首先出現了持續時間較長的橫向震盪價格走勢，這是一種常見的運行格局，此時很難判斷是否有主力參與其中，多數投資人只能結合震盪走勢進行波段式的高賣低買操作。一旦股價有向上穿越震盪區的趨勢，投資人很難作出判斷。但利用這種量價形態，我們可以判斷股價是會開放突破上攻走勢，還是會再度折轉返回震盪區間內。


    當股價向上運行至震盪區頂部時，若攀升速度緩慢、股價重心緩緩上移，並且此時的成交量未見放大，呈現出一種平量式的狀態，則預示著經過震盪走勢之後，主力已經擁有了較多的籌碼（此時的主力已有較強的參與能力），同時股價向上緩慢攀升，是股價脫離主力成本區域的訊號。在實盤操作中，此時我們應耐心持股待漲，等待主力的進一步拉升，而不是過早地離場。


    圖 5-12 中可以看到，股價經歷了長期的震盪，上下震盪幅度不大，累計漲幅較小，但震盪走勢並不預示著一定有主力參與其中，股價運行方向不明朗。隨著震盪的持續，當股價再度上漲至震盪區的相對高點時，如圖中的方框所標注，以連續平量的方式突破震盪區。


    此時全盤獲利，但獲利拋售盤不多，表示主力參與能力較強，結合股價累計漲幅不大且想要突破的價格形態來看，有望迎來一波上攻走勢。在實盤操作中，此時我們可以積極跟隨。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_149_0.png)


    △圖 5-12 盈峰環境 2018 年 10 月至 2019 年 3 月走勢圖


    ### 5.11 中短線急跌後回升縮量，有望出現一波反彈走勢


    中短線的急速下跌，往往會出現在股價的一波上衝之後。此時，或由於利空消息影響，或由於主力突然反手出貨，股價開始了「雪崩」走勢，中短線跌幅大、跌速快，但這種走勢也容易引發強反彈行情。一般來說，如果股價在中線已有較大跌幅，且短線再度出現快速大幅跳水（以兩三條長陰線的方式呈現），那麼此時股價走勢一旦止穩且以連續多日的小陽線縮量回升，則預示著短期內的做空力量已消耗殆盡，有望出現一波反彈走勢。在實盤操作中，我們可以適當參與，從而獲取反彈收益。


    圖 5-13 的股價中線跌幅大、短線跌速快，如圖中的標注所示。在連續 2 條長陰線，股價跌至 5.05 元後，股價隨著連續的小陽線而緩慢回升，回升時的量能萎縮。這是股價止穩的訊號，也預示著反彈行情的展開，我們此時可以進行短線買入操作。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_150_0.png)


    ### 5.12 放量突破後，應逢短線回檔之際買入


    「寬震式漲跌」是指盤中振幅較大的陰線、陽線在數個交易日內交替出現的量價形態。即這幾個交易日的盤中波動幅度較大，但由於陰線、陽線交替出現，股價沒有上漲。「放量突破」則是指股價突破這個短線寬幅區間時，出現了明顯的放量。


    寬震式漲跌是股性開始明顯活躍的訊號，多與主力積極參與有關，此時的量能也會因盤中震盪幅度的加大而放大，股價運行方向尚不明確。隨後的放量突破則表明主力資金的行為是做多的，而且經歷了寬幅震盪區間後，多方已明顯佔據主動地位，這是有望展開一輪上攻行情的訊號。在實盤操作中，我們可以在放量突破後，逢短線回檔之機買入。


    從圖 5-14 可以看到，股價在長期盤整之後出現了寬震式漲跌形態，隨後的放量突破表明主力在積極做多。寬震式漲跌是多空分歧明顯的標誌，主力此時的參與能力並不是很強，若是沒有明顯的利多消息驅動，股價很難實現突破後立即飆升的走勢。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_151_0.png)


    在實務操作中，當股價放量突破寬幅震盪區後，可跟隨買進。


    ### 5.13 震盪活躍式量能，可累計的漲幅不大


    ![](img/ac68af843c2aeef3dbf55e10ca066163_152_0.png)


    所謂「主力股」，是指從價格走勢中可以明顯看到有主力在其中參與的個股。一般來說，依據量價形態，我們可以判斷出主力的存在。這類個股，其價格在進入高位區後，若正遇大盤系統性調整，往往也會隨之暴跌，主力很可能在高位區出貨數量較少，或者在暴跌後的低位區又進行了加碼。此時，判斷主力是否會進行新一輪的拉升是關鍵，其中的「震盪活躍式量能」，就是用來判斷主力行為的依據之一。


    「震盪活躍式量能」是指在震盪過程中，雖然股價短線波動幅度較大，但股價重心在上移。此時，成交量明顯放大，而且股價也剛剛脫離近期最低點，累計漲幅不大。


    我們來看看圖 5-15 中該股的價格走勢變化過程。首先，股價在中長期低點出現了一波反彈走勢，這一波反彈，雖然讓前期震盪平台區的籌碼處於解套狀態，但成交量沒有明顯放大，說明市場浮額較少、解套盤未「蜂擁而出」，這也從側面驗證了主力仍參與在其中。


    隨後，借助於利多消息，股價以無量漲停板的方式實現了短線飆升。但是，在高位區運行不久後，股價又受大盤系統性下跌的影響，而出現了新一輪的暴跌。主力是否已在反彈過程中快速出貨？這個問題暫時難以判斷。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_153_0.png)


    △圖 5-15 中關能源 2018 年 7 月至 2019 年 3 月走勢圖


    但隨著低點止穩走勢，及隨後反彈過程中的「震盪活躍式量能」的出現，我們預計主力仍有再度拉升股價的意願，且此時股價距低點的累計漲幅不是很大。因股價反覆波動，主力的持有成本也相對較高，震盪活躍式量能又表明了主力積極參與的行為。在實盤操作中，震盪活躍式量能形態構築期間，正是我們逢回檔低點買入的好時機。由圖
    5-16 中可以看到，在主力的積極參與下，股價漲勢強勁，遠強於同期大盤。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_153_1.png)


    △圖 5-16 中關能源 2018 年 10 月至 2019 年 4 月走勢圖


    ### 5.14 跌勢中巨量陰線後的反彈點，可能有下跌風險


    下跌途中的中短線買入機會會不多，且常出現在急速下跌之後，由於技術面要求及短線做空力量的減弱，常會有反彈行情出現。


    跌勢中巨量陰線後的反彈點形態，就是在跌勢中獲取反彈收益的一種量價形態。首先，股價的中短線跌幅已經較大，如果股價剛剛跌破高位整理區、距離最高點較近（少於 20%），則不宜參與。


    在下跌途中，股價以一條（或連續兩三條）巨量長陰線再探新低，長陰線當日的量能遠高於此前的均量水準，股價呈加速下跌狀。隨後，一旦股價走勢在數日內止穩，多預示著短期內的做空力量釋放過度，若同期大盤走勢相對穩健，則股價有望迎來強勢反彈。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_154_0.png)


    這類形態的重點是長陰線的「放量」，只有放出了巨量，且在中短線跌幅較大的位置點，這種反彈行情才能「一觸即發」，因為巨量陰線可以被看作是空方力量消耗過度的表現。


    對於這類形態來說，由於是在跌勢中獲取反彈收益，因此我們更應注重倉位的控制，並密切留意股價短期走向。一旦數日內股價無法回升，始終無法脫離我們的建倉成本區，則應考慮賣出，規避股價有可能出現新一輪的下跌風險。


    由圖 5-17 中可以看到，股價走勢呈震盪下跌狀，且下跌趨勢明顯，這是多空力量整體對比格局轉變的表現，此時我們不可過早抄底入場。但隨著震盪走勢的持續，如圖中的標注所示，一條巨量長陰線使得股價快速下跌，中短線的跌幅極大，我們此時可留意反彈行情的出現。隨後幾日的走勢止穩，就是我們短線入場、獲取反彈收益的時機。


    ### 5.15 漲停板次日巨量陰線形態


    ![](img/ac68af843c2aeef3dbf55e10ca066163_155_0.png)


    漲停是股價啟動的訊號，也是主力參與的標識之一。當股價以漲停板強勢突破啟動時，主力很可能因為市場浮額較多、拉升阻力較大而先賣出一些籌碼，這時多以放量長陰線形態為主要表現方式。


    漲停板次日巨量陰線形態，是指股價先以一個盤面走勢強勁的漲停板向上啟動，這個漲停板早盤鎖位、全天未打開，當日量能放大不明顯，是典型的強勢漲停。次日，股價慣性開高，但在盤中卻節節下滑，收於一條放量長陰線。


    如果在隨後的幾日，股價能夠止穩、不延續長陰線後的弱勢運行格局，且股價累計漲幅小、正處於長期盤整後的突破起點，則這種「強勢板 + 放量長陰線」的組合形態，多為一次股價短暫的快速回落走勢，我們可以擇機買入。


    由 5-18 的分時圖中可以看到，股價在長期盤整之後，在 2019 年 4 月 4 日出現了一字板的漂移板形態，結合股價正處於突破盤整區這一情况来看，這是股價再次啟動的訊號，也是主力有意拉升的訊號。但是，長期的盤整也使得市場浮額過多。次日，股價開高走低，出現放量長陰線，在放量長陰線隨後幾日內止穩，此時是我們短線入場的好時機。


    也有個股在兩個漂移板之後，出現了這種放量長陰線的價格走勢，「兩個漂移板」往往也對應「兩條放量長陰線」。在實盤操作中，第一條放量長陰線並不是最佳的入場抄底點，下面結合案例加以說明。


    圖 5-19 中可以看到，股價走勢在連續兩個漂移板之後，出現了兩個交易日的放量長陰線。由於股價累計漲幅較小、無利空因素，出現這種形態往往是因为該股有題材面支撐，但主力手中籌碼不夠。在實盤操作中，這類股價走勢往往極為迅捷，我們應密切注意盤面變化。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_156_0.png)


    一旦盤中股價走勢不弱，那麼此時往往就是主力選擇再度拉升的時機。圖 5-20 為兩條長陰線後第二個交易日的分時圖，股價並沒有繼續大幅走低的弱勢，而是低開探低拉起，這是股價短期內整理完畢、有望展開新一波上漲走勢的訊號。在實盤操作中，我們應及時跟上，把握買入時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_157_0.png)


    △圖 5-19 高能環境 2020 年 1 月至 3 月走勢圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_157_1.png)


    △圖 5-20 高能環境兩條長陰線後第二個交易日的分時圖

