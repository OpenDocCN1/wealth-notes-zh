    # 6.14  雙陽天量出現時，應賣出股票以迴避風險


    雙陽天量形態，是股價短線上衝時的一種常見形態。兩個交易日均收出長陽線，且股價短線漲幅較大；這兩個交易日的放量效果相近，且遠大於其他交易日的量能。從日 K 線圖中來看，這兩個交易日的成交量十分突兀。


    雙陽天量形態的出現，多與主力手中籌碼不多、參與能力不強有關。由於獲利浮額過多、賣壓過重，主力在拉升時遇到了強力阻擋，雖然這兩個交易日收出陽線，但卻極大地消耗了多方力量。


    一般來說，雙陽天量常出現在低點位盤整後的突破走勢中，雖然它不是主力出貨的訊號，卻預示著股價的短線大幅調整。在實盤操作中，我們應賣出股票以迴避風險，等待股價回檔止穩後再擇機買入。


