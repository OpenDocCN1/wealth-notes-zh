    # 2.2.2 短線上衝突元式放量


    短線上衝是指，股價出現了一波短線上漲，漲幅相對較大、漲速較快。從日K線圖來看，股價的一波短線上漲往往會使股價呈出突突突破上漲狀，這時出現的突兀式放量往往與主力的階段性減碼、出貨行為相關。


    圖 2-5 中股價經歷了一波短線上漲，上漲幅度相對較大；在有了一個漲停板、全盤獲利的情形下，出現了跳空長十字線的形態，當日成交量異常放大，放大效果大致為此前均量的
    2 倍；次日量能又突然恢復如初，這就是突兀式放量上漲。出現在此位置點烈的這種量能形態，表明股價短線上攻動力已過度釋放，而且多與主力的階段性出貨行為相關，是短線上漲走勢結束的訊號。在實盤操作中，我們進行中線交易時應減碼，進行短線交易時應獲利離場。


