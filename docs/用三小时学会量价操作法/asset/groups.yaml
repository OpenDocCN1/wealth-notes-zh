    # ### 4.3 中長線主力與短線主力，持股方式大不同


    中長線主力與短線主力的進貨風格迥然不同，中長線主力更注重控制建倉成本，進貨的時間往往較長，參與能力更強；短線主力更注重市場熱點、進貨時間較短，參與時更需借助於市場的追漲熱情及其他遊資的力量。由於主力的進貨風格與方式不同，反映在盤面的量價形態也就不盡相同。在本節中，我們就結合主力的風格，來看進貨環節下的常見量價特徵。


    # 4.3.1 放量縮量對比


    主力進貨時會造成股價上漲，也會引發量能放大，隨著股價的短線上漲，主力會暫停進貨，在獲利盤拋售的情況下，股價自然會回落。由於僅是市場少量獲利盤回吐，主力並沒有參與拋售，因此股價回落時的成交量會明顯縮小。這就導致在股價波動過程中，成交量形成了放大、縮小的鮮明對比：波段上漲時的量能明顯放大，波段回落（或窄幅整理）時的量能明顯縮小。利用放量與縮量的鮮明對比，再結合個股中短期內的價格走勢的獨立性，我們可以初步判斷個股有主力入駐進貨的可能性。


    圖 4-6 中可以看到，在低位區的橫向震盪走勢中，多次出現獨立上攻的長陽線，且上漲波段的放量較為明顯；而在上漲波段後的回落走勢中，則明顯縮量，放量與縮量形成了鮮明的對比，這正是大資金入場進貨後積極鎖倉的訊號之一。獨立的上漲波段放量，啟動了多空分歧，使得主力有機會從中進貨；隨後的回落波段僅是由市場少量獲利浮額拋售所致，因此量能會明顯縮小。'
