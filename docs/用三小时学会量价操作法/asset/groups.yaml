    # 7.15


    45度角放量下行，是趨勢反轉的訊號


    ![](img/ac68af843c2aeef3dbf55e10ca066163_210_0.png)


    盤中 45 度角放量下行形態，是主力資金持續撤出時的重要盤面形態之一，它的形態特徵是分時線呈 45 度角，且股價不斷下滑。這種運行態勢的持續時間較長，至少會保持半個交易日，並且隨著股價的下滑，分時量也同步地不斷放大。


    45 度角放量下行常出現在午盤之後，且會一直運行至收盤，這使得收盤價接近當日最低點。


    相對於盤中穩步攀升、放量走高的形態來說，下行時的放量則更為真實，因此，這種放量的 45 度角下行也表現了做空力量的強大，是隨後個股或有大幅下跌行情出現的訊號。在實戰中特別要注意的是，如果股價的中短線漲幅相對較大，在高點出現這種
    45 度角放量下行形態，往往是趨勢反轉的訊號。股價短線回落後，此時我們不宜抄底入場，因為後期的下跌幅度將更大。


    圖 7-19 中可以看到，當日股價處於中短線漲幅較大的高點位，早盤衝高，隨後走勢出現轉變，股價開始震盪下行，呈 45 度角放量下行，一直持續到收盤。在下行過程中，可以看到量能明顯放大，這是場內資金大量撤出的訊號，且此時的股價正處於中短線高點，在實盤操作中，我們應及時賣出該股以迴避風險。


    相同的盤面形態總是預示著相同的未來走向。如圖 7-20 所示，在 2019 年 11 月 11 日股價開盤後，便呈 45 度角放量下行，當日也處於短線高點，可見主力運用了同樣的出貨手法。'
