  mdcn: '

    則以溫和放量的圓弧形態「恢復了失地」。在實盤操作中，我們應在股價圓弧形滑落時進行短線買入操作。這種量價形態常與主力的積極參與有關，股價隨後的中短線漲幅也十分可觀。在實戰中，我們應多加觀察這種量價形態，把握時機。


    圖 5-5 中可以看到，股價以一個溫和放量的圓弧形態，突破了之前的短線整理密集區。圓弧形態構築完成之後，股價出現了短線回落，此時就是較佳的入場點。


