    # 7.16

    開盤後的閃擊漲停板，

    可用兩要素分析後期走勢


    開盤後的閃擊漲停板形態，是指個股在早盤開盤後的短短幾分鐘內，由於個股交投相對清淡，此時受突然的單筆大買單影響，股價快速地衝擊漲停板。但這筆大買單的目的顯然並不是拉升股價，股價隨後瞬間被大量的賣單砸下。隨後，分時線在盤中漲幅較小的位置區開始趨穩，這使日
    K 線圖中出現了長上影線。


    這種開盤後的閃擊漲停板形態，很明顯是由大額資金興動而形成的，它往往是主力資金將有所行動的訊號。在實盤操作中，當個股出現了這種分時圖形態時，我們可以結合兩個要素來分析。


    一是，看股價的全天走勢是否呈持續滑落狀。如果股價在早盤閃擊漲停板後，其隨後在盤中的走勢持續滑落，甚至還出現了跳水，那麼這大多是主力短期內有意出貨的表現。主力透過開盤時的閃擊漲停板，讓投資人認為隨後股價還會再度上漲至漲停板附近的價位，也可以大大降低那些喜歡「逢高出場」的持股者賣股意願，而主力則可借機出貨；如果股價在早盤閃擊漲停板後，其走勢較為穩健、可以穩穩地運行於均價線上方，那麼這種走勢就極大地限制了主力的出貨行為。


    二是，看個股的局部價格走勢情況。如果這種分時圖形態，出現在一波快速上漲後的階段性高點，那麼它大多是價格將反轉下行的訊號；如果出現在短期大幅下跌後的低點時，那麼它更有可能是主力拉升前的一次向上試盤行為。相對而言，這種分時圖形態更常見於一波上漲走勢後的高點。


    當這種分時圖形態出現在一波快速上漲後的階段性高點時，表示主力在短期內有著較強的出貨意願，往往預示著短期內將有快速下跌行情出現，是應及時賣股離場的訊號。


    圖 7-21 中可以看到，當日該股價格在早盤開盤後向上閃擊漲停板。我們可以看'
