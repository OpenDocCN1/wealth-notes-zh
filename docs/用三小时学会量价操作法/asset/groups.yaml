    # 5.1  3個交易日的量價形態：進攻式三日放量組合


    以成交量分析而言，以日K線為基礎的日K線圖量價分析是其核心。在前面幾 個章節中，筆者已經從趨勢運行、經典量價理論、主力參與等方面，講解了一些較為 常見的日線圖量價形態，但對於變幻莫測的股市及股價走勢來說，這些還是遠遠不夠
    的。


    要想更加深入地理解並在實戰中運用好量價關係，我們要從條例入手，以A 股市場的獨特運行方式為基礎，更加全面地學習量價形態。在本章及第6章中，筆者 以「日K線圖」為例，來展開量價的相關內容的講解。本章先講解能夠預示股價上
    漲的量價組合，第6章則講解預示股價下跌的量價組合。


    進攻式三日放量組合是3個交易日的量價形態組合，這3個交易日的量能明顯放 大。第一個交易日和第三個交易日收出中小陽線，且量能的放大較為明顯，使股價呈 上攻狀；第二個交易日為股價整理走勢，量能相對縮小。


    這種量價形態常常是大資金短線加碼、有意拉升股價的訊號，雖然股價並不一定 馬上啟動上漲，但隨後的整理時間往往會較短。在實盤操作中，當股價回落至第二個 交易日附近且能夠獲得支撐時，我們可以短線入場。


    圖5-1可以看到股價盤整之後，出現了三日放量突破盤整區的形態。這是進攻式 三日放量組合形態，是多方入場積極、短線推升股價意願強的訊號，也預示著有望展 開一波上攻行情。在實盤操作中，我們可以在隨後的橫向整理期間買股入場。'
