    # 1.5 如何掌握股價大幅變動的買賣時機？


    進行實盤交易時，我們首先要查看的就是盤面的各項資訊。其中，盤中出現異動（如量能異動、走勢異動、掛單情況變化等）的個股更值得關注，它們可能是主力短線重點參與的商品，也可能預示著個股上攻行情的出現。


    在以量價形態為核心展開交易時，能否在第一時間發現這些個股非常重要，否則我們很可能錯過買賣入時機。在本節中，我們將說明重要的即時盤面資訊，來檢視如何在第一時間發現這些盤面異動股。


    # 1.5.1 振幅、量比、換手率等重要數據


    各式各樣的盤面數據，從不同角度呈現出多空雙方的交控行為，利用它們可以更準確地觀察個股的運行情況。其中，振幅、量比、委比、內盤與外盤、換手率等數據較為重要。


    +   1. 振幅

    振幅是指股價在當日盤中的上下震盪的幅度。振幅展現了多空雙方的競爭情況。個股的盤中振幅越大，說明多空競爭越激烈。過大的盤中振幅，往往是短線股價走勢反轉的訊號。其公式如下。

    振幅＝（當日最高價－當日最低價）÷ 上一交易日收盤價 ×100%


    +   2. 量比

    量比，即成量量的相對比值，它以分鐘為時間單位，其數值為當日開市後每分鐘'
  - '[PAGE 43]


    的平均成交量，與過去 5 個交易日每分鐘的平均成交量之比，也是一種即時的盤面資料。量比將前幾個交易日的每分鐘平均成交量作為參照，可以幫助我們即時瞭解個股在這一分鐘量能放大或縮小的程度，是發現成交量異動的重要指標。對量比的數值進行分析時，量比值較大的個股（一般來說，量比值至少要在
    3 以上），更值得關注，可以幫助我們縮小選股範圍。其公式如下。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_43_0.png)


    # 3. 量比曲線


    在盤中，以分鐘為時間單位，將量比數值依次連接得到一條平滑曲線，這就是量比曲線。它使我們更能掌握個股當日成交量，與近期成交量的相對變化情況。


    一般來說，透過一夜的市場訊息及人們心理上的變化，新的一個交易日開盤的時候，股價及開盤成交量的變化極大。將其反映在量比數值上，就是很多股票開盤時的成交量比數值會高十幾倍，隨後量比數值又急速下降。大多數股票的成交量在新的一個交易日開盤時都顯得很不穩定，因此在通常的行情背景下，我們應該等待量比曲線穩定後再採取行動。


    # 4. 委比


    委比可以反映委買盤與委賣盤的掛單數量對比情況。委比的取值範圍為–100% 至 100%，當委比數值為 100% 時，個股處於漲停板；當委比數值為 –100%
    時，個股處於跌停板。其公式如下。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_43_1.png)


    委比是具有即時性的盤面數據，隨著委買單、委賣單的陸續掛出、不斷成交，委比數值也會不斷變化。一般來說，當委比數值為正時，說明有較多的委買單在下面承接，這是買方力量相對較強的表現；當委比數值為負時，說明有較多的委賣單壓在上面，這是賣方力量相對較強的表現。


    # 5. 內盤與外盤


    外盤，是指以主動性買入方式成交的股票數量。對於一筆交易，在賣方報價後，'
  - '[PAGE 44]


    買方主動以賣方報價買入，這是主動買入；在買方報價後，賣方主動以買方的報價賣出，這是主動賣出。內盤，是指以主動性賣出方式成交的股票數量。其公式如下。


    成交量 = 外盤 + 內盤


    當外盤較大時，說明以主動性買入方式成交的股票數量更多，這是投資人買股意願較強的展現，此時股價也多數會在買盤的推動下出現上漲。當內盤較大時，說明以主動性賣出方式成交的股票數量更多，這是投資人賣股意願較強的展現，此時股價也多數會在賣盤的壓力下出現下跌。


    在實盤操作中，我們需結合個股的價格走勢情況，來解讀內外盤所蘊含的市場訊息，以下列舉 5 種情況。


    +   1.  在長期下跌後的低位區：價格走勢止穩，量能溫和放大，此時出現的外盤大於內盤的情況，可以被看作是場外資金積極入場、多方力量增強的訊號。若個股可以在之後的更多的交易日中，出現外盤大於內盤的情況，則預示著多方力量正在積累，是後期價格走勢看漲的標誌。


    +   2.  在長期上漲後的高位區：價格走勢漲滯，量能相對縮小，此時出現的內盤大於外盤的情況，可以被看作是場內資金陸續離場、空方賣壓漸強的訊號。若個股可以在之後的更多的交易日中，出現內盤大於外盤的情況，則預示著空方力量正在積累，是後期價格走勢看跌的標誌。


    +   3.  在穩步上漲的價格走勢中：外盤大於內盤是買盤充足的表現，也是漲勢將持續的標誌。在持續下跌的價格走勢中，內盤大於外盤是賣盤充足的表現，也是跌勢將持續的標誌。


    +   4.  在高位震盪區：若個股在盤面中出現了外盤明顯大於內盤，但盤中價格走勢卻無力上漲的情形，是價格走勢看跌的訊號。


    +   5.  在低位震盪區：若個股在盤面中出現了內盤明顯大於外盤，但盤中價格走勢卻較為穩健、未見明顯下跌的情形，這是價格走勢看漲的訊號。'
  - '[PAGE 45]


    # 6. 換手率


    換手率也稱周轉率，它是指一檔股票在「單位時間內的累計成交量與其流通總股本之間」的比率，是反映股票流通性強弱的指標之一。其公式如下。


    換手率＝（單位時間內的累計成交量 ÷ 流通總股本）×100%


    一般來說，在計算換手率時，多以交易日為時間單位。假設某檔股票連續 10 個交易日的換手率之和（累計換手率）為 100%，我們可以這樣簡單地理解：這檔股票在經過了
    10 個交易日的交投之後，其流通在股市上的全部股票籌碼已經從原有持股者手中，轉移到了新加入進來的投資人手中。當然，這只是一種簡單的理解，因為很多投資人都在頻繁地買賣一檔股票，換手率為
    100% 並不意味著持股者的完全轉換。


    關注換手率時，我們要充分考虑個股的特性。對於大股東持股比例較高的個股，這些股票的換手率會較低；反之，對於大股東持股比例低、股票籌碼高度分散的個股，其換手率就會較高。


    個股的換手率可以反映個股的交投情況是否活躍。一般來說，日換手率小於 3% 表明交投不活躍，市場觀望氣氛較重。日換手率在 3% ～ 7%，表明市場交投氣氛活躍，意味著股票流通性好，進出市場比較容易，不會出現「想買買不到、想賣賣不出」的現象。此種換手率多出現在行情的行进階段，股票透過持續的換手，市場持有成本在不斷地增加或減少，這有利於行情的發展。


    日換手率大於 7% 表明股票在頻繁換手，如果發生在高位，我們應注意風險。此外，對於不同類型的個股，也應區別其換手率標準：大股本的換手率達到 2% 就可以算是較高的水準，而小股本、題材股的換手率一般要超過
    5%，才可以將其稱作是高換手率。


    高換手率是最值得我們關注的。高換手率說明資金的流入、流出速度較快，若高換手率是由主力資金流入、散戶資金流出引發的，往往預示著機會的到來；若高換手率是由主力資金流出、散戶資金流入引發的，往往是風險的預兆。由於較長時間的高換手率可以表現出資金進出量大、持續性強的特點，因此在實務操作中，能在較長的時間內維持高換手率的股票，極具價值。'
