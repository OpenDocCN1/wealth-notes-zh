    8-16 所示。


    綜合股價走勢來看，主力此時已有一定的參與能力，股價突破時沒有引發較大賣壓，短線上攻才剛剛展開，股價馬上出現回檔的機率不大。在實盤操作中，我們應順應股價的這種突破走勢，在第一時間追漲買入。


