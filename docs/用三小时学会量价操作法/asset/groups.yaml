    #### 4.3.3 突破點翌日進貨巨量


    主力在低位的進貨，往往會因為市場低迷而使得效果不理想，這時，就需要再次拉升進貨。當股價突破盤整區時，若出現明顯的放量，且隨後股價能夠站穩於突破位置點，則多與主力在突破時實施積極的建倉行為有關，股價就有望就此步入上升通道。下面我們結合實例來說明。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_117_1.png)


    △ 圖 4-8 雲南白藥 2019 年 7 月至 11 月走勢圖


    圖 4-8 中可以看到，經歷長時間的橫向震盪之後，該股出現了長陽線向上突破形態，長陽線上穿整個盤整區時，當日的量能明顯放大，有大量的資金參與。隨後，股價強勢站穩於突破後的短線高點，正是主力積極的建倉、加碼，才使股價得以抵擋中短線獲利、解套賣壓，預示股價將步入上升通道，此時是中短線入場的時機。


    #### 4.3.4 突破點多日進貨放量


    股價先是放量突破盤整區，在強勢的橫向震盪過程中，該股不時地出現單日明顯放量形態，且股價重心隨著震盪的持續而向上移動，這多是主力借突破之機進行加碼的操盤行為，預示著股價隨後將出現一波上攻走勢。在實盤操作中，強勢震盪中的回落點，就是最佳的短線入場時機。


    圖 4-9 中可以看到，股價在相對低位區出現長期盤整走勢，隨著放量突破形態的出現，股性得以啟動，但股價並沒有立刻強勢上攻，這與主力手中籌碼數量相對較少、參與能力不足有關。此時，主力有加碼的需要，可以看到在強勢震盪區間又多次出現單日放量陽線，這正是主力在突破點加剧的多空分歧，而積極加碼操作的表現。在震盪過程中出現的股價重心上移，也表示買盤力量強於賣盤，一旦主力加碼完畢，隨後出現上攻行情的機率較大，此時是很好的入場時機。


