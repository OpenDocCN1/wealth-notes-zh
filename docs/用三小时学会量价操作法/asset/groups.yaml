    ## 第 8 章 一出手賺 3 倍！13 支黑馬股實戰案例


    ### 8.1 進貨後極度縮量整理（電信類股）


    ![](img/ac68af843c2aeef3dbf55e10ca066163_228_0.png)


    黑馬股是指那些可以在中短期內價格快速上漲且漲幅驚人的個股，成功地買入並持有這類股票，這也是股市的魅力所在。但想要成功地捕捉到黑馬股並不是一件容易的事，需要有較豐富的看盤經驗，並掌握有一定的技巧。


    基於量價形態來說，捕捉黑馬股更需善於分析，從量價形態的變化來分析主力的市場行為，進而及時報股入場。在本章中，我們仍以「量價」為核心，看看黑馬股是如何透過量價的變化，向我們發出訊號的。


    進貨後極度縮量整理形態常出現在主力進貨之後、快速拉升之前，是一個相對短暫的過渡整理過程。該形態的構築過程如下：股價首先緩慢地震盪攀升，此時量能明顯放大，這是資金積極入場的標誌；隨後，股價小幅調整，呈橫向窄幅整理狀，在這期間的成交量明顯地大幅度萎縮（與之前股價震盪攀升時的量能相比）。


    極度縮量整理平台的出現，標誌著主力進貨已經較為充分、主力參與能力得到了很大的提高，市場浮額很少。此時，在大盤止穩的背景下，主力隨時可以向上拉升股價，而且從中長線角度來看，這個縮量整理平台也是處在低位區的。可以說，無論中線還是短線，此形態都是一個很好的入場點。


    # 實戰案例：中國聯通


    圖 8-1 是中國聯通的走勢圖，股價的震盪攀升較為緩慢，但是量能充分放大，結合股價重心上移的走勢來看，有資金在積極入場。隨後，股價回檔進行平台式整理，此期間的成交量突然大幅度萎縮，這就是「進貨後極度縮量整理」形態，預示著該股有成為黑馬股的潛力，此時的縮量平台也是較佳的中短線入場點。


    ### 8.2 盤整中的極度縮量（物流類股）


    # 第 8 章 出手賺 3 倍！13 支黑馬股實戰案例


    ![](img/ac68af843c2aeef3dbf55e10ca066163_229_0.png)

    △圖 8-1 中國聯通 2018 年 5 月至 2019 年 3 月走勢圖


    盤整（我們這裡主要指低位盤整區間）中的極度縮量形態，是指股價處於中短線大幅下跌後的低位震盪區間，震盪幅度不大約 10% 左右，在這期間的成交量相對平穩。但是，隨著震盪的持續，某幾個交易日的成交量突然大幅萎縮，遠小於之前的均量，呈現出極度縮小的形態。


    極度縮量形態的出現，表示有主力參與且主力持股數量多。由於在這幾日的盤中，主力沒有參與買賣，股價的波動幅度也不是很大，所以市場交投極為冷清，出現了極度縮量形態。


    這是一個需要仔細觀察才能發現的量價特徵，極度縮量並不是個股被市場拋棄的結果，它只是主力高度參與下的產物。其實我們可以結合個股之前的運行情況來分析，一般來說，個股此前的運行都會有一定的獨立特徵，並不是隨波逐流的邊緣股。


    # 實戰案例1：廈門象嶼


    極度縮量表示大量的籌碼並沒有在市場上，而是在主力手中。如果此時的股價處於中長期的低位區，那麼這種情況預示著個股有望在主力的參與下成為黑馬股，是機會的象徵。


    圖 8-2 為廈門象嶼的走勢圖，該股在低位區的震盪過程中，連續 4 天出現極度縮量形態，縮量效果十分明顯。一旦股價向上運行、突破這一整理區，就是主力開始拉升股價的標誌。在實盤操作中，對於這類股票我們可以積極買入，耐心持有並等待突破。


    # 實戰案例2：浙江富潤


    對於特立獨行的強勢股來說，主力參與其題材的時間往往較長。當股價經歷上漲而到達一個高位平台後，若在平台震盪過程中出現了極度縮量形態，表示主力仍舊持股較多。結合強勁的盤整走勢來看，主力的參與能力依舊很強，因此，個股有望迎來新一波上攻行情。在實盤操作中，我們可以適當短線參與。


    但是，相對於低位盤整區的極度縮量形態來說，此時買入畢竟是追漲行為，且我們的買入成本要遠高於主力，本著資金安全的原则，輕倉參與才是上策。


    圖 8-3 為浙江富潤的走勢圖，此股走勢十分強勁。在中短線已有明顯升幅的背景下，股價仍能夠強勢震盪，股價重心不回落，從盤面形態上來看，沒有主力出貨的跡象。如圖中的標注所示，一小波回撤後，出現了極度縮量整理，這表明主力參與能力依舊較強、市場浮額較少，該股出現新一波上攻行情的機率較大。在實盤操作中，在強者恆強的市场格局下，我們可以適當參與、獲取中短線收益。


