    +   一是單日（或雙日）托底量放大。突破當日（或突破時的連續2個交易日）成交量明顯放大，放量幅度為之前均量的2～3倍（並不是超過4倍以上的天量）。在隨後的交易日中，股價強勢止穩、量能明顯縮小。


