    # 第 6 章 我用日 K 線與成交量，預測「暴跌股」！


    ## 6.1 單日放量長上影陽線，應賣出股票以迴避風險


    在第 5 章中，筆者講解了預示股價上漲的量價形態，依據這些形態，我們更能掌握中短線的買入機會。與此相對的則是預示股價下跌的量價形態，它們是風險的象徵。在股市中，把握機會只勝利了一半，要想長久地在股市中生存下去，還需要懂得迴避風險的方法，透過講解本章中的這些量價形態，相信可以幫助讀者從量價角度更好地迴避風險。


    單日放量長上影陽線形態，是指股價當日收出陽線但上影線較長，一般來說，上影線長於陽線實體，且當日量能明顯放大。


    這種形態常出現在一波上漲後的短線高點，是股價在盤中上衝時遇到較大賣出阻擋、上攻受阻的訊號，預示著股價有短線回落的可能。在實盤操作中，此時我們應賣出股票以迴避風險。


    如圖 6-1 中可以看到，股價上漲後的短線高點，出現了單日放量長上影陽線的形態，這是股價上漲遇阻、空方實壓較大的訊號，也是股價短線回落的訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_160_0.png)


    △圖 6-1 中彙數據 2019 年 10 月至 12 月走勢圖


    ## 6.2 放量陰孕線組合，表示空方實壓較重


    「孕線」是一種前長後短的雙日 K 線組合形態。後面一條短 K 線的最高價低於前面一條長 K 線的最高價，且後面一條短 K 線的最低價，高於前面一條長 K 線的最低價，這使得後面的
    K 線猶如「孕於」前面的長 K 線，故得名「孕線」。


    在孕線形態中，如果前面的一條長 K 線為陽線，後面的一條短 K 線為陰線，這種孕線被稱為「陰孕線」。陰孕線多出現在一波上漲走勢後的高位區，如果陰孕線形態伴有量能的放大，則表明空方實壓較重、多方上攻無力，預示著即將出現一波回檔下跌走勢。


    如圖 6-2 中可以看到，股價的上漲走勢一直很穩健，並沒有短線飆升，僅從日 K 線圖來分析，很難預測到股價會短線回落，但此時的成交量卻發生了異動。如圖中的標注所示，在高點位的盤整過程中，出現了放量陰孕線組合，這兩日的量能異常放大，正是市場實壓突然加重、多方無力推升股價的訊號，也預示了股價的見頂回落。在實盤操作中，就中短線而言，由於股價中線累計漲幅較大，此時我們應賣出股票以迴避風險。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_162_0.png)


    ## 6.3 短線上衝單日天量，回落幅度大


    「單日天量」也稱「脈衝式放量」。它是指成交量在單獨一個交易日（或兩個交易日）內突然大幅度放出，其成交量可達到正常水準的4倍以上，隨後又突然恢復如初。從成交量的直條圖來看，這一日的放量效果十分明顯，猶如躍動式閃現的電脈衝，打破了量能連續平穩變化的節奏。


    短線上衝時的單日天量，伴以當日的長陽線，給人的第一感覺是放量上攻、行情可期，然而，這是因為我們不瞭解脈衝式放量上漲的市場含義。隨後的股價走勢表示，這種直接的感覺往往是錯的。


    在常態下，市場交投有一個相對連續的過程，量能展現了多空雙方的競爭力度，基於市場交投的連續性，量能的放大與縮小也不會過於突兀。但脈衝式放量明顯打破這種連續性交投格局，它是量能的一次偶然性躍動。突然放量、又突然恢復如初，顯然是由某種原因驅動的。只有充分理解脈衝式放量形態的成因，我們才能更完整地掌握這種形態。


    在短線上衝時出現的脈衝式放量長陽線，往往會形成一種「放量上漲」的市場氛圍，吸引跟風盤買入，而主力則積極出貨。因此，脈衝式放量當日的盤中高點往往也就是短線高點，股價在此之前短線漲幅較大，但隨後的回落速度快、回落幅度大。在實盤操作中，我們應注意該類風險。


    圖 6-3 中可以看到，股價的一波上漲使其突破了盤整區，並在 2019 年 10 月 15 日加速上漲，當日的量能也達到了峰值，從該股此前的成交量表現來看，這種放量效果是難以持續的。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_163_0.png)


    △圖 6-3 平高電氣 2019 年 8 月至 11 月走勢圖


    我們可以看到圖 6-4 中，當日出現天量是因為開盤後不久，股價就衝高至漲停板附近，但未能收漲停，從而引發了巨量賣出。結合股價短線漲幅較大，且並無明顯熱門題材支撐來分析，這很有可能是多空力量轉變的訊號。在實盤操作中，我們在當收盤前應賣出或減碼。次日，該股成交量大幅度萎縮，表示
    2019 年 10 月 15 日的單日天量形態，是明確的短線見頂訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_164_0.png)


    △圖 6-4（此處原圖缺失標題，根據上下文推斷為圖6-4）


    ## 6.4 放量上漲中探頭式量能，隨時可能反轉下行


    放量上漲中的探頭式量能形態，是指股價以放量的方式實現上漲。上漲過程中，在某個交易日中量能進一步放大，但次日量能恢復如初。


    探頭式量能的出現，說明股價的中短線上漲已是強弩之末，多方力量已有了較大的消耗。如果股價短線漲幅較大、漲速較快，則探頭式量能一旦出現，往往就是股價短線見頂回落之時；如果股價之前的上漲相對穩健，那麼雖然隨後幾日仍能進一步上漲，但上漲基石已不牢固，隨時有反轉下行的可能。


    在圖 6-5 的走勢圖中，股價以穩健的中小陽線方式向上突破了盤整區間，但在累計漲幅不大的位置點出現了探頭式量能，預示著此輪突破行情的根基並不牢靠。在隨後的若干交易日內，我們應逐步減碼離場、鎖定利潤。


    圖 6-6 與圖 6-5 的案例不同，圖 6-6 該股價格的短線上漲走勢較為迅速、漲幅大，此時出現的探頭式量能，大多是股價短線見頂的訊號，特別是該股價格在次日又出現了滯漲。在實盤操作中，此時我們應果斷賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_165_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_166_0.png)


    ▲ 圖 6-6 航發科技 2019 年 1 月至 5 月走勢圖


    ## 6.5 遞增放量下的量能峰，是股價的階段性高點或低點


    逐級式遞增放量形態，是指在一波快速上漲過程中，股價連續收出陽線，且成交量呈現出逐級放大式的遞增特徵。所謂的逐級放大式，即後一交易日的量能略高於前一交易日，5日均量線呈快速上扬狀。


    遞增放量是一種只能持續數個交易日的局部放量形態，其往往與股價走勢沿某一方向快速發展有關，是買盤持續加速流入（遞增放量與股價上漲同步出現）或是賣盤持續加速拋售（遞增放量與股價下跌同步出現）的表現。在實盤操作中，我們應關注遞增放量形態下的量能峰值點，因為這裡往往也是股價的階段性高點或股價的階段性低點。


    圖 6-7 在股價震盪走高並創出短線新高的一波行情中，出現了連續 4 日逐級放大的遞增放量形態，在第四個交易日股價收出長陽線，且量能創出近期新高。結合該股的歷史表現來看，此時量能難以再度放大，且短線上攻呈加速狀，在實盤操作中，此時我們可以適當減碼、鎖定利潤。


    圖 6-8 在一波反彈走勢中，股價連續 5 天上漲，量能遞增式放大。如圖中的標注所示，此時，量能無法進一步放大，這是反彈結束的訊號。在實盤操作中，若我們想要短線獲取反彈收益，則此時應賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_168_0.png)


    △圖 6-7 粵泰股份 2019 年 9 月至 10 月走勢圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_168_1.png)


    △圖 6-8 動力源 2019 年 9 月至 11 月走勢圖


    ## 6.6 大幅放量式滯漲有兩種表現形式


    大幅放量式滯漲形態也常被稱為「堆量滯漲」，這種形態是指在短線高點，個股連續多個交易日明顯放量，量能的放大效果相近。但此型態下股價並未明顯上漲，即量能的大幅放出無法推升股價，股價會呈滯漲形態。


    堆量滯漲主要有兩種表現形式。

    - 一是，在橫向滯漲過程中，以中小陽線、陰線居多，股價在每個交易日的盤中振幅不是很大。此時，僅從 K 線走勢來看，股價的運行相對平穩，未見明顯異常，如果不借助於成交量，我們幾乎難以做出有效的判斷。

    - 二是，在橫向滯漲過程中，長陽線、長陰線交錯出現，股價在每個交易日的盤中振幅都較大。


    這兩種表現形態雖有所不同，但它們的市場含義是相近的。既然放大的量能無法推升股價，並且由於交易是雙向的，那麼，這種放量也就表示短期內賣壓很沉重。而大幅度的放量，又最大程度地消耗掉短期內的市場潛在買盤，嚴重削弱多方力量，預示了股價的調整。


    圖 6-9 中股價因利多消息的驅動而漲至短線高點，此時股價上下震盪，長陽線、長陰線交替出現，量能急劇放大，但股價無法上行。這屬於多個交易日盤中股價振幅度較大的放量滯漲形態，是多空分歧過大的標誌，也呈現了沉重的賣壓。在實盤操作中，我們應及時在逢盤中震盪衝高時賣股離開。


    圖 6-10 中可以看到，在短線漲幅較大的位置點，股價橫向滯漲，K 線圖呈小幅波動狀。單看 K 線的運行，這似乎是上升途中的一個中繼整理平台，但結合同時的量能情況分析後發現，這屬於短線高點的放量滯漲形態，是一個危險的訊號，預示著股價的調整。在實盤操作中，此時我們應賣出股票以迴避風險。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_170_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_170_1.png)


    ## 6.7 高位整理區突然縮量，股價走勢多會震盪緩跌


    股價經歷了長期上漲之後會進入高位區，在這個區間，我們難以判斷股價走勢。因為股價前期的獨立上漲，表示有主力參與此股，所以結合量價形態的變化來分析是重點，也是關鍵。


    如果股價在高位整理區中運行時，突然出現了量能大幅度萎縮的震盪形態，那麼這種量價關係的轉變，往往預示著多方力量開始趨於枯竭，而空方實壓則陸續釋放中。這是多方力量轉弱、空方力量轉強的訊號，預示著頂部的出現，也是中長線投資人持股離場的訊號。


    運用這一量價關係時，應注意兩點。

    - 一是，股價的累計漲幅。只有在股價的累計漲幅較大、個股處於明顯高估狀態時所出現的這種縮量滯漲形態，才是可靠的趨勢反轉訊號。

    - 二是，要準確地區分何為滯漲形態。整理形態一般會使得股價重心上移，而滯漲形態則不同，由於空方力量開始佔據優勢，因此股價走勢多以震盪緩跌、股價重心下移等為表現形式。


    圖 6-11 中可以看到，股價此前的上漲具有很強的獨立性，主力參與明顯。隨著累計漲幅加大、主力拉升放緩，股價進入了高位震盪區，此時的股價重心無法繼續上移，我們也應留意趨勢的反轉。如圖中的標注所示，此時出現的整理區突然縮量形態，就是股價盤整之後將破位下行的訊號，也是提示中短線投資人賣出離場的訊號。


    對於價格累計漲幅巨大的個股來說，它們多有主力積極參與。當股價進入高位區時，若股價長期震盪滯漲且量能極度萎縮，則表示雖然此時主力的能力依舊較強，但由於主力獲利空間巨大，股價在高位區的狀態是極不穩定的。一旦大盤出現回檔或主力有意大力出貨，那麼個股破位下行的空間極大。在實盤操作中，我們應規避這類個股。


    圖 6-12 中可以看到，股價在高位區長期震盪滯漲運行，此時量能極度萎縮，股價走勢雖獨立於大盤。但由於主力獲利幅度大，股價破位下行的機率也隨著震盪的持續而增加，散戶不宜參與此類股票。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_172_0.png)


    ▲圖 6-11 蘇農銀行 2018 年 12 月至 2019 年 8 月走勢圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_172_1.png)


    ▲圖 6-12 卓勝微 2019 年 6 月至 12 月走勢圖


    ## 6.8 震盪破位前突然縮量，預示主力參與能力提升


    在橫向的震盪運行中，即使股價重心略有上移，但如果震盪期間沒有主力入場，則隨著多空交投趨於冷清、市場人氣逐漸低迷，股價還是極有可能破位下行的。在實盤操作中，很多股票在震盪破位之前（即使震盪區間的累計漲幅不大），常會出現突然縮量的形態特徵，這是一個警示風險的訊號。


    在實盤操作中，有時難以分析震盪之後的突然縮量，究竟是因為主力參與能力提升、積極鎖籌，還是因為市場交投趨於冷清、買盤無意入場。此時，我們可以關注縮量時的 K
    線形態特徵。如果此時的陰線實體明顯較長，多預示著買盤無意入場、空方力量有轉強趨勢；反之，多預示著主力參與能力有所提升。下面筆者將結合案例加以說明。


    圖 6-13 可以看到在橫向震盪過程中，成交量大幅萎縮，陰線實體明顯較長，這是股價破位前的警示訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_173_0.png)


    ▲ 圖 6-13 韓建河山 2019 年 5 月至 2020 年 2 月走勢圖


    ## 6.9 穿越式長陰放量反轉，此時應果斷賣出


    穿越式長陰放量反轉形態常出現在盤整走勢之中，從 K 線形態來看，它往往是開高走低的長陰線，陰線實體極長，使當日的收盤價接近或跌破了原有的橫向震盪區間。這種長陰線多伴有量能的放大，是主力資金快速出貨的重要訊號。


    一般來說，若同期大盤走勢較弱，一旦股價走勢中出現了這種類型的放量長陰線，說明股價隨後的短線跌速快、跌幅大。在實盤操作中，為了資金安全，此時我們應果斷賣出。


    圖 6-14 中可以看到，股價在高位區出現了橫向震盪走勢。此時，一條開高走低的放量長陰線極為明顯，它是趨勢反轉的訊號，預示著將展開一輪快速下跌行情，是明確的賣出訊號。


    很多時候，我們不一定要等到收盤時才確定這是開高走低的放量長陰線，在盤中可以判定的前提下，逢反彈之機賣出是更好的選擇。


    圖 6-15 的分時圖中可以看到，該股早盤放量跳水，而從圖 6-14 中可以看到當日量能明顯放大、盤中跌幅較大，股價一直運行於均價線下方，這是資金加速撤出、多方無力反擊的訊號。


    結合圖 6-14 中的放量長陰線來看，股價走勢已呈破位狀，我們應果斷賣出，不必等到收盤時再做決定。


    圖 6-16 股價在震盪下跌的過程中出現了一波反彈，反彈時出現了一條開高走低的放量長陰線，這是反彈行情快要結束的訊號，也預示了將展開新一輪下跌行情。在實盤操作中，我們應注意股價走勢快速轉變的特徵，結合個股及大盤的變化，及時調整買賣策略。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_175_0.png)


    ![](img/ac68af843c2aeef3dbf55e10ca066163_175_1.png)


    ## 6.10 跳空破位放量長陰線，此時不宜過早抄底買入


    一旦股價步入跌勢時，「跌勢不言底」這句用來警示風險的名言，可能被那些喜歡抄底的投資人所忽略。在跌勢中，能以更低的成本買入固然重要，但是若低點的整理只是暫時的，則此時買入無疑是十分危險的。從時間的角度來看，當前的低點很可能就是以後的高點。


    跳空破位放量長陰線形態，是我們判斷跌勢是否見底的重要形態之一。若股價以一條跳空低開、盤中放量低走的長陰線降至新低，則多表示市場中賣壓依舊十分大，當前的一個低點很難形成真正的底部區域。在實盤操作中，此時我們不宜過多抄底買入。


    圖 6-17 中可以看到股價自高點位置開始震盪下行，並明確步入下跌通道。這時，我們應以應對跌勢的方法進行操作，中長線投資人可持幣觀望，短線投資人則可以結合股價及大盤的波動情況，適當參與以獲取反彈收益。


    如圖中的標注所示，一條跳空低開的放量長陰線加快了股價的下跌速度，放量長陰線之後是持續的小陽線、小陰線，股價出現止穩走勢。這條放量長陰線只是股價下跌途中的第一次加速下行，距離頂部並不遠，下跌趨勢並未見底，此時我們不宜過多抄底入場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_177_0.png)


    △圖 6-17 特變電工 2019 年 6 月至 12 月走勢圖


    ## 6.11 高點收漲的天量陰線，其轉向後的下跌幅度會較大


    ![](img/ac68af843c2aeef3dbf55e10ca066163_178_0.png)


    高點收漲的天量陰線形態出現在短線快速上漲過程中，此時股價跳空上漲，盤中慣性上衝，但在高點遇到賣出阻擋，股價會出現一定的下滑。至收盤時，收盤價低於開盤價，當日收出陰線，但股價仍然處於上漲狀態，跳空缺口未回補。


    這種盤中走勢伴以明顯放大的量能，是多空力量對比格局在盤中快速轉變的標誌，多預示著短線上攻走勢的結束。由於股價短線漲幅較大，其轉向後的下跌幅度往往會較大，跌速也會較快。


    圖 6-18 中可以看到，一波短線快速上漲之後，股價在早盤慣性衝高、隨後快速下滑。在圖 6-19 此盤中運行情況圖中，股價在早盤開高走高的原因是慣性上漲，隨後快速跌破均線，反彈無力，這是多空力量轉變的訊號。如圖
    6-18 所示，當日量能明顯放大，結合股價在盤中震盪下行的情况来看，主力已開始出貨，因此，每一次的盤中反彈都是我們減碼、賣股的好時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_178_1.png)


    ▲圖 6-18 廣州發展 2019 年 5 月至 8 月走勢圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_179_0.png)


    △圖 6-19 廣州發展 2019 年 7 月 29 日分時圖


    ## 6.12 飆升股量價緩慢下滑時，應果斷賣出


    ![](img/ac68af843c2aeef3dbf55e10ca066163_180_0.png)


    飆升股量價緩慢下滑形態，出現在股價短線大幅飆升之後。由於股價飆升，成交量也大幅放出，但這種走勢持續的時間較短。隨後，股價失去了上漲動力，在短線高點處，交替出現的小陰線、小陽線使得股價重心下移，同期的成交量也開始不斷下滑，這就是「量價緩慢下滑」形態。


    在短線高點處，這種形態是多空力量對比緩慢轉變的標誌，即多方力量緩慢減弱、空方力量緩慢增強，是一個由量變到質變的過程。且多空力量轉變結束，將展開短線加速下跌行情。在實盤操作中，我們識別出這種量價形態後，應果斷賣出，不可抱有僥倖心理。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_180_1.png)


    ▲ 圖 6-20 亞盛集團 2019 年 1 月至 5 月走勢圖

