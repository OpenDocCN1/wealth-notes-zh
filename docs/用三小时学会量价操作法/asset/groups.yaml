    現了與大盤完全不同的形態，其中的進貨、拉升、整理、再次拉升、出貨環節，均透過一定的盤面特徵展現出來了。


    1. 在低位置，主力先是小幅度拉升股價，這有利於激發多空分歧，而此時主力則緩慢持續進貨，且股價走勢與大盤相近。由於主力的參與改變了多空力量格局，因此股價止跌止穩，呈橫向震盪狀。進貨環節是持續時間較長的，它所產生的效果直接與主力的後期參與能力成正比。由於主力的進貨行為較為溫和，從量價配合關係著手，我們很難發現其蹤跡。對於這類個股，它只有在進入拉升環節後，才能相對準確地進行分析、預判。


    2. 隨後，主力開始拉升股價，股價在上漲時可以看到輕微放量。在股價突破前期盤整密集區時，這也是一個套牢區間，該股僅溫和放量，未見大幅放量，這表示市場浮籌不是很多。再結合股價相對獨立的突破走勢來看，我們可以判斷有主力參與，且主力手中持有相對較多的籌碼，股價後期上漲空間值得期待。在實盤操作中，此時是較佳的買入點。


