    # 4.3.4 突破點多日進貨放量


    股價先是放量突破盤整區，在強勢的橫向震盪過程中，該股不時地出現單日明顯放量形態，且股價重心隨著震盪的持續而向上移動，這多是主力借突破之機進行加碼的操盤行為，預示著股價隨後將出現一波上攻走勢。在實盤操作中，強勢震盪中的回落點，就是最佳的短線入場時機。


    圖 4-9 中可以看到，股價在相對低位區出現長期盤整走勢，隨著放量突破形態的出現，股性得以啟動，但股價並沒有立刻強勢上攻，這與主力手中籌碼數量相對較少、參與能力不足有關。此時，主力有加碼的需要，可以看到在強勢震盪區間又多次出現單日放量陽線，這正是主力在突破點加劇的多空分歧，而積極加碼操作的表現。在震盪過程中出現的股價重心上移，也表示買盤力量強於賣盤，一旦主力加碼完畢，隨後出現上攻行情的機率較大，此時是很好的入場時機。


