    # 7.8 「皮球落地」巨量跌停，

    應逢反彈及時賣出


    「皮球落地」巨量跌停形態，是一種有趣的比喻說法。它的形成過程一般是這樣的：當日個股因利空消息或價格短線漲速過快，先是出現了跌停或接近跌停，隨後股價在盤中被突然拉升，但在盤中高點沒有得到支撐，股價開始快速地向下滑落，向下滑落過程中的反彈力度越來越弱。整個過程如同「皮球落地」，股價最終又向下滑落至跌停價附近，當日成交量呈巨量形態。


    這種分时圖中的形態是短線暴跌拉開序幕的訊號，也是短線主力快速出貨的標誌，在實盤操作中，我們應該逢反彈及時賣出才能更好地迴避風險。


    圖 7-10 中可以看到，當日股價在急速上漲、開高後快速跳水奔向跌停板，並在盤中反覆鎖住跌停板；午盤之後被突然拉升超過 10%。這種拉升並不意味著有跟風盤進入，只是主力在製造多空分歧，目的就是快速出貨，隨後的盤面運行猶如「皮球落地」，當日放出了巨量。在實盤操作中，主力在盤中的快速拉升給了持股者逢高退出的時機，不可錯過。


