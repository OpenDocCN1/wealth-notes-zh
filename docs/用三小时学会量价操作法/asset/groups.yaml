    ![](img/ac68af843c2aeef3dbf55e10ca066163_130_0.png)


    △圖 4-19 尖峰集團 2019 年 5 月至 9 月走勢圖


    ## 4.7 主力出貨的量價關係，可作為風險評估


    主力往往在股價累計漲幅較大時出貨，但若股市低迷，主力往往會提前出貨。我們應結合市場冷暖及量價關係的變化，來把握主力的出貨行為。在本節中，筆者將講解主力出貨時的幾種常見量價關係，它們是股價走勢中線轉折的訊號，也是風險訊號。


    ### 4.7.1 縮量震盪下滑


    在持續上漲後的高位區，若股價出現震盪滯漲走勢且量能開始明顯縮減，股價重心下移時，這便是主力無意拉升、開始小量出貨的訊號。我們此時應注意風險，股價隨後有可能因大盤震盪，而向下跌破平台支撐位。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_131_0.png)


    圖 4-20 在高位震盪走勢中，我們可以看到股價在震盪走低，同期的量能明顯縮減，這是主力小量出貨的訊號。這種縮量震盪下滑，也打破了股價走勢原有的上升形態，標誌著頂部的出現以及趨勢的反轉。


    ### 4.7.2 斷層式縮量滯漲


    斷層式縮量滯漲，也是主力出貨時較為常見的一種量價關係，它是指個股在價格不斷上漲過程中出現了較為顯著的放量，並且股價的上漲走勢獨立，明顯強於大盤，中短線的漲幅相對較大。隨後，在高點位股價橫向震盪，但量能卻大幅度縮減，此時的量能與之前上漲時的量能相比，顯現出「斷層式」的特徵。


    高點位的斷層式縮量滯漲，大多表示此前股價上漲時的堆積式放量，或與主力的連續式拉升有關。此時量能斷層式縮減並伴以股價滯漲，標誌著主力連續式拉升的結束，也是股價走勢見頂的訊號。


    圖 4-21 中可以看到，股價的上漲過程持續時間長、累計漲幅大，上漲時的量能明顯放大。如圖中的標注所示，高點位出現了縮量滯漲，從量能效果來看，這屬於「斷層式」的縮量，是股價走勢見頂的訊號，此時我們應賣出離場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_132_0.png)


    ▲圖 4-21 珠江實業 2019 年 1 月至 8 月走勢圖


    ### 4.7.3 放量攀升再放量


    上升途中，成交量若在原有的放量攀升的基礎之上再度明顯放大，會使多方力量消耗過大、過快，容易引發中線反轉走勢。此外，再度放量時往往伴有股價的快速上衝，經常使多空力量對比格局發生轉變。在實盤操作中，當成交量無法繼續放大，或股價開始滯漲時，我們應賣出離場。


    圖 4-22 中可以看到，股價在大盤走勢處於震盪狀態時，出現了這種較為獨立的上攻走勢，這是主力積極參與的結果。但是，放量攀升之後出現了量能進一步放大的上攻走勢，這就是一個反轉訊號，此時我們應果斷賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_133_0.png)


    ## 第5章 我用日 K 線與成交量，預測「上漲股」！


    ### 5.1 3個交易日的量價形態：進攻式三日放量組合


    以成交量分析而言，以日K線為基礎的日K線圖量價分析是其核心。在前面幾章中，筆者已經從趨勢運行、經典量價理論、主力參與等方面，講解了一些較為常見的日線圖量價形態，但對於變幻莫測的股市及股價走勢來說，這些還是遠遠不夠的。


    要想更加深入地理解並在實戰中運用好量價關係，我們要從條例入手，以A股市場的獨特運行方式為基礎，更加全面地學習量價形態。在本章及第6章中，筆者以「日K線圖」為例，來展開量價的相關內容的講解。本章先講解能夠預示股價上漲的量價組合，第6章則講解預示股價下跌的量價組合。


    進攻式三日放量組合是3個交易日的量價形態組合，這3個交易日的量能明顯放大。第一個交易日和第三個交易日收出中小陽線，且量能的放大較為明顯，使股價呈上攻狀；第二個交易日為股價整理走勢，量能相對縮小。


    這種量價形態常常是大資金短線加碼、有意拉升股價的訊號，雖然股價並不一定馬上啟動上漲，但隨後的整理時間往往會較短。在實盤操作中，當股價回落至第二個交易日附近且能夠獲得支撐時，我們可以短線入場。


    圖5-1可以看到股價盤整之後，出現了三日放量突破盤整區的形態。這是進攻式三日放量組合形態，是多方入場積極、短線推升股價意願強的訊號，也預示著有望展開一波上攻行情。在實盤操作中，我們可以在隨後的橫向整理期間買股入場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_137_0.png)


    ▲圖 5-1 拾得酒業 2019 年 6 月至 7 月走勢圖


    ### 5.2 長陽線突破點的窄幅整理區，有望展開突破行情


    股價在長期盤整之後走勢不明朗，若此時出現長陽線放量突破盤整區，多預示著盤整區是多方積蓄力量的一個階段。但是，多方也有可能因空方獲利賣壓較重，使主力持股數量不夠而無功而返。此時，在長陽線的突破位置點，若股價走勢能夠出現小幅度整理形態，是多方已經在突破位置點佔據主動地位的標誌，有望展開突破行情。在實盤操作中，這個突破點的窄幅整理位置區，就是我們中短線入場的好時機。


    由圖 5-2 可以看到股價在運行中，先是出現了放量長陽線突破盤整區，隨後在突破點出現了窄幅整理不回落的走勢。此時股價正處於低位盤整區的突破形態中，而這種突破量價形態又是多方佔優勢、主力拉升的訊號。因此，在實盤操作中，在突破點的窄幅整理過程中，我們可以積極加碼買入。


    這種量價形態常出現在大型股中。此時，股價在突破點是否有強勢的窄幅整理形態出現，是我們衡量多空力量的重要依據，也是判斷上攻行情是否真實的標準。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_138_0.png)


    圖 5-3 中可以看到，股價在以長陽線向上突破盤整區時，當日量能的放大較為明顯，這是個股中沒有強勢主力參與的標誌之一，股價的運行方向是多空力量合力的結果。此時，若在突破點可以出現強勢窄幅整理形態，則表示多方可以穩守勝果，仍完全佔據主動地位，股價隨後仍有上攻空間。在實盤操作中，我們可以耐心持股待漲或買股入場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_139_0.png)


    △ 圖 5-3 廣譽遠 2019 年 5 月至 7 月走勢圖


    ### 5.3 圓弧右側的滑落低點，是短線入場的好時機


    「圓弧形」常與主力的行為相關，因為僅憑市場正常交投，難以出現這種「優美」的運行形態。當股價以溫和放量的圓弧形態突破低位盤整區時，大多是主力快速拉升前的一次加碼操作。此時，圓弧右側的滑落低點，就是我們短線入場的最好時機。


