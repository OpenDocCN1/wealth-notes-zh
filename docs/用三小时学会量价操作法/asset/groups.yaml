    ## 3.5 趨勢關鍵點量能特徵


    股市中常說的「無量無行情」，指定確定一輪行情發展的關鍵位置點時，如突破點、破位點、反轉點等，除了股價走勢的配合，往往還需要量能來驗證，在量能的配合下，這些關鍵點才能夠被更好地確定下來。依據量能的縮放形態，結合股價的走勢特徵，我們能更瞭解當前股價走勢的市場含義，從而判斷突破、破位、反轉走勢的可靠性。


    ### 3.5.1 突破點托底量的兩種形態


    突破點托底量是股價突破盤整區時常見的量能特徵，它是買盤大量涌入、市場獲利買盤得到有力承接的標誌。從形態上來看，在股價向上突破盤整區時，托底量的表現方式主要有以下兩種。


    - 一是單日（或雙日）托底量放大。突破當日（或突破時的連續 2 個交易日）成交量明顯放大，放量幅度為之前均量的 2～3 倍（並不是超過 4 倍以上的天量）。在隨後的交易日中，股價強勢止穩、量能明顯縮小。

    - 二是單日放量幅度極大，為此前均量的 4 倍以上。隨後數日量能相對縮小，但仍明顯高於此前的均量，且股價強勢止穩。


    這兩種托底量形態，都是真實的市場買盤入場承接的表現方式，只要股價的中短線累計漲幅不大，一般來說，隨後的突破上升空間將是較大的。在實盤操作中，在托底量形態出現之後，我們可在突破後的短期強勢止穩區域逢價漲低點買入股票。


    圖 3-19 中可以看到，在股價突破窄幅盤整區時，出現了單日托底量放大的形態。隨後股價在突破點位強勢止穩，量能也沒有萎縮。此案例對應本節中的第一種托底量表現方式。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_93_0.png)


    △圖 3-19 中金領南 2018 年 12 月至 2019 年 4 月走勢圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_93_1.png)


    △圖 3-20 麗珠集團 2019 年 6 月至 11 月走勢圖


    這種單日（或雙日）的托底量放大對突破走勢形成支撐，常出現在有業績或題材支撐的個股上，它是多方主力資金合力拉升股價的訊號，預示著新一輪上攻行情的展開。


    圖 3-20 中可以看到，在股價突破當日，單日放量幅度很大，超過了此前均量的 4 倍。隨後在突破點的止穩運行中，量能仍舊處於明顯的放大狀態，只是與突破日的量能相比縮小了。


    這種突破點量價配合形態，常出現在短線主力快速進貨的時候。在強勢盤整之後，短線主力進貨達到一定程度時，個股有望迎來短線飆升行情，此時則是一個難得的短線買入時機。


    ### 3.5.2 突破點連續性放量


    在股價突破過程中，也可以連續數日放量，代表著買盤資金的持續入場，放量大小一般為此前均量的 2～3 倍。在實盤操作中，連續放量突破後，我們可以觀察幾日，若出現股價強勢止穩，則於止穩平台買入；若出現股價短線回落，則逢回落之機買入。


    圖 3-21 中可以看到，在股價突破低位平台區時，該股出現了連續 5 個交易日的相對放量。量能放大效果溫和，股價短線上漲幅度不大，隨股價再次突破此處放量高點，這是中短線入場的絕佳時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_94_0.png)


    ### 3.5.3 放量突破後縮量回落


    在突破盤整區之後，股價有兩種常見的短線運行軌跡。一是在突破點強勢止穩不回落，這常常與同期大盤穩健運行相關；二是在大盤回落、短線獲利盤的雙重賣壓下出現了回落。只要股價不跌破放量長陽線突破當日的啟動點價格，則多表明場外做多資金仍然活躍，突破上攻行情依舊成立，此時是一個很好的中短線切入點。股價在短線回落時，一般會伴以成交量的快速縮減，這表明股價的下跌更多緣於市場獲利浮額的拋售。


    圖 3-22 中可以看到，股價在低位區長期盤整之後，出現了連續性放量突破走勢，這是買盤持續入場、多方開始發力的訊號。隨後大盤回檔，受此影響股價也順勢回落，但並沒跌破突破日的啟動點，此時就是最好的短線入場時機。這個短線買入時機是大盤震盪所創造的，也給了我們更充足的短線獲利空間。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_95_0.png)


    ### 3.5.4 破位點連續縮量


    在高位區盤整之後，若股價以連續的小陰線向下跌破盤整區支撐位，且量能沒有放大，這表明空方在未大量拋售的情況下，就已經佔據了主動地位，高位區的支撐非常無力，這是趨勢折轉下行的訊號。在實盤操作中此時應及時賣出，以迴避風險。


    圖 3-23 中可以看到，股價在長期盤整之後出現了破位走勢，連續的縮量小陰線跌破了盤整區的支撐位，這屬於縮量破位形態，是盤整區支撐點力量薄弱、破位走勢將出現的訊號。預示著之後會有較大風險，這是提示我們應清倉離場的訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_96_0.png)


    △圖 3-23 萊茵體育 2019 年 8 月至 12 月走勢圖


    ### 3.5.5 破位點單日放量


    盤整區的破位點出現放量陰線，是賣盤重、多方承接力量不足的訊號，也是短期內空方完全佔據主動地位的訊號，多預示著中短期內可能有急速下跌行情展開，特別是當股價處於高位盤整區時，中短線的快速下跌空間更大。在實盤操作中我們應及時賣出，以迴避風險。


    圖 3-24 為供銷大集 2019 年 3 月至 8 月走勢圖，股價以向下跌空的缺口跌破盤整平台，當日大幅放量，這是破位點的單日放量形態。空方賣盤重、股價可能出現急速下跌走勢，我們應及時賣出以迴避風險。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_97_0.png)


    △圖 3-24 供銷大集 2019 年 3 月至 8 月走勢圖


    ### 3.5.6 反轉時量能整體轉變


    在股價走勢出現中期反轉時，量能形態往往會提前發生整體轉變，例如在原來溫和式放量的過程中，某日的成交量突然暴增，或量能形態由放量轉變為縮量等。結合股價的階段性運行情況，利用成交量形態的整體性變化，我們更能掌握行情的轉捩點。量能整體轉變的方式很多，一般來說，如果中短線的股價漲跌幅度較大，而量能形態的整體轉變較為明顯的話，多是原有行情將發生變化的訊號。下面筆者結合兩個案例加以說明。


    圖 3-25 中可以看到，股價此前強勢上漲，成交量呈溫和放大狀。但是當日的加速上攻長陽線卻放出了天量，股價短線上漲幅度已經較大，量能又突然放大，這是量能形態整體轉變的標誌，也預示著原有的強勢上攻走勢將出現轉折，這是賣出訊號。


    圖 3-26 中可以看到，股價在持續下跌之後，於低點止跌止穩並橫向震盪。如圖中的標注所示，在連續多個交易日裡，成交量明顯縮小，這是股價下跌過程中出現的量能整體性轉變。結合股價中短期的大幅下跌情況來看，此為中期築底的訊號，我們可以進行中短線買入操作。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_98_0.png)


    △圖 3-25 滬三峽A 2019 年 4 月 10 日分時圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_98_1.png)


