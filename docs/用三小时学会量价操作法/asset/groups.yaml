    ## 1.2.4 股價走勢的前兆


    ![](img/ac68af843c2aeef3dbf55e10ca066163_21_0.png)


    成交量蘊含了豐富的交易資訊。尤其是多日成交量的不同組合，對於預測股價的後期走勢具有極為重要的作用。


    不同的量價關係蘊含了不同的市場含義，有一些經典的量價關係呈現著趨勢的運行情況，也有一些量價關係反映著短期波動情況。利用量價關係的不同形態進行分析，無論是在中長線交易中，還是在短線交易中，都更能幫助我們把握買賣時機。


    圖 1-7 方框標注處可以看到，股價在中短線大幅下跌之後，出現了止穩走勢，此時的成交量大幅萎縮。結合股價之前的下跌情形來看，這是短期內做空力量消失的訊號。股價中短線的連續大幅下跌，已使得該股在短期內處於超賣狀態。成交量的形態變化，可以作為判斷反彈行情的依據，並提前預示股價運行方向。


    ## 1.2.5 主力行為的線索


    ![](img/ac68af843c2aeef3dbf55e10ca066163_22_0.png)


    有主力參與的個股，其走勢往往「特立獨行」，甚至出現大行情。因此，關注主力的市場動向，是在股市中獲利的有效手段。主力的買賣方式不同於普通的散戶投資人，由於主力的加入，個股量能的放大與縮小會有一定的規律，發現這種規律後，我們就能好好把握主力動向了。


    主力在參與個股時，會結合大盤進行進貨、震倉、拉升、整理、再度拉升、出貨等操作。


    在這些環節中，進貨、拉升、出貨這 3 個環節是必然會出現的，其他幾個環節是否出現，與主力的風格、大盤走勢等因素相關。但是，無論哪一個環節，主力都會透過其買賣方式暴露其動向，而成交量就是反映主力動向最重要的線索之一。


    由圖 1-8 可以看到，股價在經歷了大幅下跌之後，先在低位區止跌止穩，隨後放量上漲。結合隨後短線高點的強勢止穩、不回落的股價走勢來看，這波溫和放量上漲呈現出主力能力較強、拉升阻力較小。由於股價的上漲走勢才剛剛展開，因此隨後仍有較大的上漲空間。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_23_0.png)


    △圖 1-8 東方鉅業 2019 年 4 月至 6 月走勢圖


    ## 1.3 如何建立交易前的完善系統？


    投資人依據量價關係展開實盤交易時，不應只關注局部。對於剛剛接觸這一技術分析領域的投資人來說，首先應建立一套較為完善的交易系統，在熟練掌握之後，就可以從量價圖輕鬆辨識出交易系統中需提前關注的盤面資訊，進而快速地依據量價關係展開實盤交易。


    一般來說，量價分析流程應是先進行全域分析，再看局部運行，最後進行細節化分析。全域分析主要是對於趨勢的判斷；局部運行則是關注股價的短期波動情況；細節化分析是結合個股的具體量價形態，依據它的歷史表現來分析多空力量的變化情況，進而預測股價漲跌趨勢。在本節中，我們將以流程化的方法，來簡單介紹量價實盤交易的各個環節。


    ### 1.3.1 市場趨勢运行情况


    「趨勢」一詞的字面意思為：事物或局勢發展的動向，並且這種發展動向具有客觀性、不以人的主觀意志為轉移。在統計學中，趨勢具有時間性，主要是指時間軸上的某個可見的動向，是一種線性發展的客觀規律。可以看出，趨勢代表一種較為確定的發展方向。將「趨勢」一詞引入金融市場中，它是指價格走勢的某種客觀規律性，而且這種趨勢是不以人的意志為轉移的。那麼，股市中的「趨勢」究竟是指什麼呢？


    股市中的趨勢是指股價運行的大方向，而股價運行的大方向無非 3 種，即上升、橫向震盪、下跌。因此，股價運行的 3 種趨勢就相應地分為上升趨勢、橫向震盪趨勢、下跌趨勢。順應趨勢的發展方向來操作，我們可以最大限度地獲取利潤、迴避風險；反之，「逆市而動」則將使我們處於一種極為不利的境地。


    在分析量價關係、預測股價走勢時，市場趨勢運行情況就是我們開展交易的背景環境，也直接關係著我們的倉位調度。在上升趨勢中，我們的操作可更為積極一些，短線交易也可以更為頻繁一些；在下跌趨勢中，我們則更應關注本金安全，更宜輕倉參與。


    因此，在展開交易前，首先應判斷市場趨勢運行情況，判斷當前的趨勢是處於橫向震盪之中，還是處於上升趨勢或下跌趨勢之中；是處於上升趨勢的回檔階段，還是處於大幅下跌後的探底階段。可以說，趨勢分析是一項重要的工作，在之後的
    1.4 節中，筆者將結合移動平均線來進行詳細講解。


    對於大盤指數來說，它反映的是市場多空力量整體對比情況，一旦多空力量對比格局形成，就具有較強的持續性。


    一般而言，日 K 線時間週期太短、變化過於頻繁，容易產生太多的雜亂資訊誤導投資人。但是週 K 線就完全不同了，週 K 線反映的是一週的交易狀況。因為股市的變化是有趨勢的，趨勢一旦形成，短時間內無法改變。就中長期來看，大的趨勢是一般資金難以影響的，對於有的個股價格走勢，用日
    K 線可能難以判斷，而用週 K 線則能一目了然。所以在判斷趨勢的時候，就 K 線形態而言，週 K 線才是中線大波段的真正代表。


    圖 1-9 中利用週 K 線的走勢及形態特徵，我們可以很完整地把握市場中的多空力量對比格局。如圖中的標注所示，上證指數在經歷了長期的橫向整理之後，週 K 線出現了長陽突破形態，這是方向性的選擇，空方無力再將上證指數壓低至原來的震盪平台區內，這也預示著上升趨勢的出現。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_25_0.png)


    在經歷了長期的上漲之後，出現了一條上影線極長並且普遍收陰的 K 線，這是空方實壓明顯增加的訊號，結合上證指數的長期大漲、市場處於歷史上的高估值狀態來看，這是大盤加速趕頂的訊號。隨後的長陰線，則是趨勢開始反轉的明確訊號。


    可以說，利用週 K 線圖的典型位置點及週 K 線形態特徵，我們可以更準確地判斷趨勢運行情況，從而展開順勢交易。


    ### 1.3.2 個股整體價格走勢情況


    個股在股市之中，雖然受到大環境的影響，但往往也有自己獨特的運行格局，因此，在關注市場趨勢運行情況之後，我們應把目光更多地集中在個股上。特別是當股市處於橫向盤整的上漲態勢中時，個股的價格走勢差異十分明顯，有的強勢上攻、漲幅驚人；有的則走勢平穩、漲幅不大。


    在關注個股整體價格走勢情況時，分析其歷史運行軌跡、把握「高低點」至關重要。當個股價格經歷了中線大幅下跌而進入低位區時，下跌動力減弱，反彈甚至反轉的機率增加；在持續上漲後進入高位區時，則應提防突破後的快速反轉風險。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_26_0.png)


    圖 1-10 中，2019 年 6 月 3 日該股收出放量陰線。當日成交量較大，市場賣壓很大，僅從局部走勢來看，股價處於窄幅震盪整理中，這條放量長陰線似乎是股價易破位下行的訊號。但是，在查看該股整體價格走勢情況後，我們的這個結論就顯得很片面了。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_27_0.png)


    △ 圖 1-11 中置股份 2019 年 3 月至 9 月走勢圖


    將日 K 線圖的時間範圍擴大，如圖 1-11 中我們可以看到，股價經歷了兩輪大幅度下跌，當前正處於低位。因此，2019 年 6 月 3 日的放量陰線只能預示股價的短線回檔，破位下行的機率很小。在操作上，我們可以在隨後股價短線回落期間積極入場。


    ### 1.3.3 股價的短期走勢


    短線交易要「長短兼顧」：所謂的「長」，是指趨勢運行情況；「短」則是指短期走勢情況、波段運行情況。


    當股價經歷了一波上漲而達到短線高點時，必然會有較大的賣壓，易出現回落。在這種情況下，那些具有下跌含義的量價配合關係則更為準確。當股價經歷一波下跌而達到短線低點時，會引發一定的抄底盤入場，市場承受力增強，在這種情況下，那些具有上漲含義的量價配合關係則更為準確。


    將股價的短期走勢與量價關係相結合，當其形成「共振」時，我們依據量價形態展開短線交易的成功率，將大大提高。


    我們可以看到圖 1-12 中，股價以一條放量的陰線跌破了短期支撐點位，有加速下跌之勢。但是，從短期走勢來看，股價正處於箱體震盪區的低位，這是一個短期承接力較強的位置區，只要大盤不出現大幅下跌，在短線抄底盤入場承接的情況下，股價很難破位下行。在實盤操作中，我們不必恐慌拋售，可以等股價反彈後尋找一個相對高點再賣出離場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_28_0.png)


    ▲ 圖 1-12 寧波聯合 2019 年 10 月至 12 月走勢圖


    ### 1.3.4 異動量能的盤面特徵


    盤中的成交細節也是短線交易時，需特別注意的一個要素，特別是主力在盤中參與，使得收盤價較高的個股。對於這類個股，若僅查看它的日 K 線圖、利用量價配合關係來預測股價走勢，很可能會得出錯誤結論。


    我們可以看到圖 1-13 中，該股在 2019 年 3 月 6 日、3 月 7 日連續兩日放量，股價突破了长期的整理區間，這種形態多預示著上攻行情的出現。2019
    年 3 月 8 日，即圖中最後一根長陰線，股價開低走低，這是突破後調整的開始，還是應逢高拋售的停利點？從日 K 線圖的理想量價關係來看，此時應短線持有，但若查看
    3 月 6 日和 3 月 7 日的分時圖，就會得出相反的結論。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_29_0.png)


    圖 1-14、圖 1-15 為該股 2019 年 3 月 6 日、3 月 7 日的分時圖，這兩日的盤面有一個重要特徵，就是尾盤上揚、收盤價較高。


    真正的短線上攻行情，控盤能力較強的主力資金是不會以參與提高收盤價來實現拉升目標的。但主力短期內有意出貨時，往往會參與拉高收盤價，為次日出貨預留空間。經過全面的分析後，判斷出股價加速上攻的機率較小，因此，2019
    年 3 月 8 日股價開低走低並且無力上衝時，我們的短線操作應是果斷賣出、鎖定利潤。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_29_1.png)


    ### 1.3.5 局部量能與整體量能對比


    我們在對成交量進行分析時，要有一個宏觀的視野，不能只侷限於量能的局部縮放情況。放量和縮量都是相對的，要有一個明確的参照。例如，我們說股價突破盤整區時出現了放量，這時的「放量」是相對於之前盤整區的低迷整理走勢而言的，若將視野放大，以股價在盤整區之前的上漲波段作為参照，則可能就是縮量。不將視野放大，我們就不能兼顧全境，也不能從整體的角度來解釋主力的市場行為，進而準確預測股價運行趨勢。


    我們可以看到圖 1-16 中，2019 年 1 月 15 日股價以放量長陽線突破盤整震盪區，所有籌碼都處於短線獲利狀態。從局部走勢來看，當日量能放大明顯，似乎是變盤較重、主力參與能力較差的標誌，股價的突破上漲走勢並不被看好。


    但是，將視野放大，對於 2018 年 3 月之後的運行趨勢來說，2018 年 12 月 26 日的放貴形態是較為溫和的，而且，考慮到股價一舉突破了長期的盤整震盪區間，在全盤獲利的背景下，量能才放大到這樣的程度，也從側面反映了主力較強的參與能力。


    從短線走勢來看，股價也許有小幅回落，但中線走勢還是被看好的。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_31_0.png)


    ▲圖 1-16 大唐電信 2018 年 3 月至 2019 年 4 月走勢圖


    ### 1.3.6 認識典型量價形態


    量價形態分析，既要考慮成交量形態，也要考慮股價走勢。在 A 股市場中，有一些較為常見的量價形態，它們有著相對固定的市場含義，只要個股的盤面運行平穩、盤中大筆交易數量相對較少，即這種量價形態是市場真實交投的結果，則當相同的量價形態出現時，它們也預示著相同的股價走勢。


    對於中短線交易的學習者來說，在深入學習、理解並且懂得分析各種不同的量價形態之前，熟悉這些典型的量價形態，可以幫助他們快速找到突破點。在本書中，筆者既講解了葛蘭碧的經典量價關係
    8 大法則，也結合筆者的長期實戰經驗，總結了近百種量價配合形態，力求幫助讀者快速掌握量價操作之道。


    我們可以看到圖 1-17 中，該股在一波快速上漲走勢中出現了遞增放量，這就是一種典型的量價配合形態。對於這種量價形態來說，量能的高峰處也將是股價的短線頂點，而且隨後多會出現大幅調整。依據這種典型的量價形態，當我們預判該股的成交量無法再度放大時，應果斷賣出、鎖定利潤。


