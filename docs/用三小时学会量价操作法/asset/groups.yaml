    # 凹形板形態是籌碼加速換手的標誌


    開盤漲停板、中盤打開的「凹形板形態」，是指股價在早盤開盤後的幾分鐘內就快速漲停板（或者是個股直接以漲停板的方式開盤）。但隨後不久，漲停板就被打開，但股價並未大幅下跌，成交量集中於漲幅為
    7% 左右的位置區，直至尾盤半小時左右，股價才在大買單的掃盤下再度漲停板並直至收盤。這種漲停分時圖形態似凹形，故稱為「凹形板」。


    凹形板往往出現在盤整後的突破位置區，是籌碼加速換手的標誌。但籌碼究竟是'
  - '[PAGE 216]


    從主力手中流入散戶手中，還是從散戶手中流入主力手中呢？我們可以結合個股的同期走勢，及凹形板出現之後的走勢情況來分析。


    當股價在上升途中的盤整突破位置出現了這種凹形板時，若此時的股價累計漲幅不大、股價並沒有在凹形板之後就快速地反轉下行，而是呈現出了長時間的止穩盤整走勢，則這多代表凹形板形態出現後，市場的實質並未明顯增強、籌碼仍被主力牢牢地掌握在手中。


    因此，前期盤整突破位置處的凹形板，極有可能是由主力的一次快速進貨所引起的。在此情況下，我們應在凹形板之後的止穩走勢中，逢回檔低點買股入場，才能獲利於個股隨後極有可能出現的快速上漲行情。


