    主力在拉升股價時，往往會採取試盤的方法，「向上試盤」就是一種常用的方法。它的形成過程是這樣的：在盤中交投較為平靜的背景下，主力突然拉升股價，拉升時間往往在幾分鐘內結束，拉升幅度大多在
    5% 以內；隨後，主力放棄拉升，讓股價在盤中高點自然回落。透過股價的回落方式、回落速度、回落幅度，主力可以大致瞭解市場獲利賣壓情況，從而決定是否繼續實施拉升計畫。


    如果在回落時，分時線能夠以均價線為支撐或者圍繞均價線運行，且當日放量溫和，那麼這是試盤效果較為理想的訊號。股價隨後稍做整理，主力對其進行拉升的機率較大，一輪上漲行情有望出現。


    在實盤操作中，試盤當日往往並不是最好的入場時機，我們可以再觀察幾日，若隨後幾日能夠保持強勢整理的態勢，則可以買入，等待主力拉升；反之，若隨後幾日走勢較弱，則從短線角度來看，暫不宜參與。


    值得注意的是，「試盤」應出現在主力「進貨」與「拉升」兩個環節之間，因此我們要結合個股的日 K 線圖，來判定在個股盤中出現的是否為試盤線。若此前沒有明顯的進貨區間，即使當日的盤面形態相似，也不可將其認定為試盤線。


