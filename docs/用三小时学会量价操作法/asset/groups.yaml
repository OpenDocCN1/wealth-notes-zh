    ### 8.3 獨立股回落啟動點縮量盤整（電子類股）


    ![](img/ac68af843c2aeef3dbf55e10ca066163_232_0.png)


    價格強勢上漲、脫離於大盤震盪格局的個股，其中一定有主力在積極參與。但若股價在中短線獨立上漲之後，恰逢大盤出現了系統性的回檔，且回檔幅度較大，股價往往也會因此而出現大幅度下跌，甚至回落至上漲波段的啟動點附近，而這也給了我們買入的機會。


    在實盤操作中，可以借助於回落後的量價關係，來判斷主力是否在之前的高點位進行了出貨，及主力在當前低點的參與能力如何、市場實歷如何等等，來決定是否進行短線交易。


    股價在回落至上漲波段的啟動點附近後，一觸即發的反彈上攻走勢較為少見，更多的是持續的橫向震盪。若股價在反覆震盪之後能夠伴有明顯的縮量，則表示隨著震盪的持續，主力的能力得到了提高，股價也有望在主力的積極參與下，再度強勢上攻，恢復之前的獨立運行態勢。


    # 實戰案例 1：激智科技


    圖 8-4 為激智科技的走勢圖，圖中疊加了同期的創業板指，對比後可見，在大盤橫向滯漲時，該股價格獨立上揚、震盪攀升。隨後受大盤影響，股價再度回落至上漲波段的啟動點附近。此時的大盤走勢不穩，主力也沒有過於激烈的逆市拉升，而是讓股價隨大盤橫向整理。


    隨著整理的持續，我們可以看到該股成交量大幅縮減，這是市場實歷逐步減輕的標誌，也是主力參與能力仍舊較強的訊號。結合該股前體的獨立上攻行情，可以預測其價格隨後仍有望恢復上漲走勢。在實盤操作中，此時我們可以買股入場。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_233_0.png)

    △圖 8-4 激智科技 2019 年 5 月至 11 月走勢圖


    # 實戰案例2：平治信息


    圖 8-5 為平治信息的走勢圖，該股因主力參與，前期出現了連續快速上攻的價格走勢。股價隨後在高點停留的時間不長，受大盤影響出現了大幅調整，並跌至啟動點附近，主力沒有足夠的時間與空間出貨。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_233_1.png)

    △圖 8-5 平治信息 2019 年 1 月至 11 月走勢圖


    在啟動點附近，該股因前期價格的強勢上漲已完全啟動了股性，其在上下震盪期間十分活躍，這是進行波段操作的好時機，隨著震盪的持續，成交量出現了較大程度的萎縮。如圖中標注所示，在這個明顯縮量的整理時期之後，該股也迎來了較為強勁的反漲上攻行情。


    ### 8.4 震盪上行區間整體縮量（醫藥製造類股）


    震盪上行區間整體縮量形態，是一種主力參與下的盤面形態，股價以震盪的方式向上運行。這個震盪區間可能出現在創新高的一波上漲中，也可能出現在大幅調整後的反彈波段中。雖然震盪期間的上下震盪幅度較大，但成交量卻較之前的均量明顯縮小。震盪上行時的整體式縮量形態，表示主力持股數量多、參與能力強。若此時的股價累計漲幅不大，後期仍有較為充裕的上行空間。在實盤操作中，我們可以達股價震盪回檔低點時買入。


    # 實戰案例：興齊眼藥


    圖 8-6 為興齊眼藥的走勢圖，股價在短線大幅調整後開始震盪上行，震盪期間的量能大幅度縮減。結合該股此前較為獨立的攀升走勢來看，主力仍參與在其中，且持股數量多。對於該類有強主力參與的股票，我們應及時達震盪回檔的短期低點買入，並耐心持有。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_235_0.png)

    ▲圖 8-6 興齊眼藥 2019 年 1 月至 12 月走勢圖


    ### 8.5 漲停突破點強勢放量整理（電子類股）


    漲停板，往往是主力強勢拉升股價的訊號，但也有些漲停板如曇花一現，若我們貿然追漲，將承受較大風險。漲停突破點強勢放量整理形態，是我們用來捕捉黑馬股的一種量價形態，它是指股價先以一個漲停板突破盤整區間，並在漲停板當日伴有明顯放量，這是股價突破時多空分歧加劇的結果。隨後數日，股價未出現回落，而是在漲停當日的收盤價附近強勢整理，整理期間量能保持放大狀態。


    漲停突破點是一個關鍵點，它是多空雙方爭奪的重要關口。強勢放量整理往往是主力進一步拉升前的加碼訊號。再結合股價之前處於低位盤整區間的狀態來看，一旦主力加碼完畢，則股價在主的積極拉升下，出現快速、大幅上漲的機率極大。在實盤操作中，這個強勢放量整理平台，是中短線入場的好時機。


    # 實戰案例：深科技


    圖 8-7 為深科技的走勢圖，股價於 2020 年 1 月 3 日以漲停板的方式，突破了長期整理平台。如圖 8-8 的分時圖所示，此時，我們還難以判斷主力的後續行為，無法確定其是繼續拉升，還是逢高賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_236_0.png)


    由隨後幾日的強勢整理且量能放大的情況來看，有資金在漲停價附近大力參與。在實盤操作中，這個較為短暫的強勢整理平台就是買入時機。一旦股價隨後以長陽線的方式突破這個平台，則該股成為黑馬股的機率極大，而且股價此时的累計漲幅很小，我們追漲所承擔的風險不大。這種潛在收益高、中短線風險低的商品，是值得我們重點投資的標的。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_237_0.png)

    △圖 8-8 深科技 2020 年 1 月 3 日分時圖


    ### 8.6 突破點連續加碼式放量（能源類股）


    突破點連續加碼式放量形態，是中線主力快速建倉、加碼時的一種盤面形態。從日 K 線圖來看，股價先是在低位區長期整理，波動幅度較小、主力進貨較為緩慢，受大盤或行業回暖等因素影響，主力看到了拉升時機，但手中籌碼數量不多。


    此時股價仍處於低位區，主力採取快速拉升、突破平台區的方法進行短線加碼，連續幾日（一般來說至少 3 日）的長陽線伴以放量，主力可以大量進貨，從而為隨後的進一步拉升打好基礎。


    在實盤操作中，我們還應觀察連續放量後的股價走勢，若股價能夠在短線高點強勢整理不回落，則說明主力中短線做多意願較強，不願讓股價再度回落至持有成本區。此時，也應順著主力的思路，短線追漲入場。若出現放量長陰線，則表示主力參與能力仍不強，我們在中短線操作上不宜追漲，應等短線回撤較為充分時，再選擇買入。


    # 實戰案例：華能水電


    圖 8-9 為華能水電的走勢圖，股價在突破時，連續 3 日放量並伴以中陽線，這是主力加碼買入、進行拉升的訊號。隨後的強勢整理和縮量向我們表明：市場賣壓較輕、主力無出貨行為。結合股價中短線漲幅較小的情況來看，股價在主力的積極參與下，有望進一步震盪走高。在實盤操作中，我們在這個縮量整理平台可以進行買入操作，並且耐心持有，等待股價上漲。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_238_0.png)

    △圖 8-9 華能水電 2019 年 5 月至 8 月走勢圖


    ### 8.7 N字形放量漲停（造紙印刷類股）


    N 字形放量漲停形態，是指個股前後出現了兩個漲停板，中間數日為回檔走勢，兩個漲停板當日均明顯放量，中間數日則相對縮量。這是一種較為獨特的漲停形態，其出現大多與主力積極參與有關。


    放量漲停的兩個交易日，是主力快速進貨的表現，中間的縮量回檔，則是整理不穩定獲利浮額的一種方式。綜合大量案例的分析結果來看，這類股票隨後成為黑馬股的機率較大。


    在實盤操作中，當 N 字形放量漲停形成後，我們不必急著追漲入場，因為這樣很有可能短線被套。可以等股價短線小幅回落、追漲風險釋放後，再擇機買入。無論是長線還是短線，這都是投資的好時機。


    # 實戰案例：銀鶴投資


    圖 8-10 為銀鶴投資的走勢圖，在股價突破低位窄幅整理區時，出現了 N 字形放量漲停形態，這是主力積極參與該股的明確訊號。如圖 8-10 所示，隨後股價短線回落後的投資時機，投資人應多加把握。


    # 用 3 小時學會量價操作法 讓我股票賺 3 倍


    ![](img/ac68af843c2aeef3dbf55e10ca066163_240_0.png)

    △圖 8-10 銀鴿投資 2019 年 7 月至 8 月走勢圖


    ### 8.8 跳空漲停板放量平台（文化傳媒類股）


    跳空漲停板放量平台形態，是個股在利多消息的刺激下，主力快速建倉時所採取的一種方式。利多消息促使股價以跳空漲停板的方式，突破了平台區間，從而激發多空分歧。


    此時主力手中的籌碼不足，主力沒有選擇繼續拉升，而是讓股價在漲停價附近進行橫向整理。由於全盤獲利，且市場在對利多消息的解讀上存在分歧，主力可以積極地加碼、進貨。股價在走勢上呈橫向的強勢震盪整理，期間量能放大，一旦主力加碼完畢，就會進行新一輪的拉升操作。


    從個股案例來看，在業績驅動型、資產注入型這兩種利多消息的刺激下，最有可能出現此類形態。特別是在利多消息較為突然、主力前期進貨不充分的情形下，一旦個股出現類似的形態，我們不妨在滯停平台區積極投資，等待新的上攻走勢出現。


    # 實戰案例：長城動漫


    圖 8-11 為長城動漫的走勢圖，受雲端遊戲概念的刺激，市場的熱情被引燃，當日的跳空漲停板突破了前期震盪平台。


    但一個漲停板顯然不能釋放如此明顯的利多消息，股價走勢反映的是未來，主力深悉這一要旨，並在漲停板平台處進行了大力度的加碼，股價走勢呈強勢震盪不回落狀。它也為該股隨後成為黑馬股埋下了伏筆，若我們瞭解市場主力常用的這種加碼手法、拉升方式，就可以在這種滯停板平台區與主力同時操作，隨後耐心持有，享受主力的拉升成果。


