    地加碼、進貨。股價在走勢上呈橫向的強勢震盪整理，期間量能放大，一旦主力加碼完畢，就會進行新一輪的拉升操作。


    從個股案例來看，在業績驅動型、資產注入型這兩種利多消息的刺激下，最有可能出現此類形態。特別是在利多消息較為突然、主力前期進貨不充分的情形下，一旦個股出現類似的形態，我們不妨在滯停平台區積極投資，等待新的上攻走勢出現。


