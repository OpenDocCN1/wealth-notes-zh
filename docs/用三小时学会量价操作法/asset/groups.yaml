    # 2.5 滯漲走勢，應結合整體價格走勢分析


    ![](img/ac68af843c2aeef3dbf55e10ca066163_65_0.png)


    # ❾ 2.5.1 高位滯漲區的縮量的成因


    在高位區，一旦股價出現了明顯的滯漲走勢，由於缺少短線波動、短線盤交易不積極，因此多空雙方的競爭就會趨於緩和，從而出現縮量。


    對於滯漲走勢，我們可以結合個股的整體價格走勢特徵來解讀。若股價的累計漲幅較大、滯漲時間較長，且形態上打破了原有的上升格局，則此時的滯漲走勢多與主力的拉升意願較弱有關，甚至緣於主力的小量出貨行為。


    若股價累計漲幅不是很大，滯漲過程中也沒有出現股價重心的下移，則說明多空力量對比格局並未被完全打破，此時的滯漲多屬於整理環節，股價隨後將進一步突破上攻。


    在實盤操作中，我們一要結合個股的整體價格走勢，來分析高位滯漲區的縮量的成因，二要結合滯漲過程中的股價重心移動情況，以掌握多空力量對比格局的變化。這樣才能更完善地判斷當前的滯漲，究竟是屬於上升途中的「整理環節」，或是趨勢將反轉下行的「築頂環節」？


    # ❾ 2.5.2 高位窄幅整理下移縮量


    當股價經歷了中短線大幅上漲而進入高位區時，若股價走勢呈滯漲、整理狀，股價重心隨著整理走勢的持續而緩慢下滑，且量能不斷萎縮，則表明主力無意再度拉升股價，而是正在進行小量出貨。這樣的個股一旦遇到大盤「跳水」或市場環境低迷，其抵禦風險的能力是極低的，其價格也易破位下行。在實盤操作中，我們應果斷賣出。'
  - '[PAGE 66]


    圖 2-15 可以看到，股價中線漲幅大，在進入高位區後，股價重心緩緩下移，成交量不斷萎縮，這是小賣單源源不斷的典型盤面特徵，也是給我們的賣出訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_66_0.png)


    # 2.5.3 高位震盪區縮量


    在中長期的高位區，個股整體價格走勢呈橫向震盪狀，上下震盪幅度較大，但此時的量能並沒有因股價的上下大幅波動而放大，反而出現了較大幅度的縮量。如果對比之前的上漲走勢，可以發現其量能呈極度萎縮狀態。


    一般來說，出現這種盤面特徵的個股，大多是有中長線強力主力參與的，主力在高位區的出貨打破了多空平衡，造成股價波動，但是投資人的高位承接意願極低，主力出貨也需要漫長的過程。極度低迷的成交量伴隨著股價的上下大幅度波動，表明市場浮額並不是很多，主力的參與能力仍舊較強。


