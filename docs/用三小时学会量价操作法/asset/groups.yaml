    ### 2.1.5 震盪反彈溫和式放量，應及時賣出


    在震盪下跌走勢中，股價的一波快速下跌之後，個股短期內處於超跌狀態，只要有一定的買盤入場，就可以推動股價反彈式上漲。此時出現的溫和式放量，僅代表股價的反彈式上漲，並不是大量買盤入場的訊號。


