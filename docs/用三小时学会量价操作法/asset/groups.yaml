    ## 7.9 破位前跳水式出貨，是股價破位前的警告


    快速出貨是主力常用的手法之一。在股價短線高點或盤整之後，若主力感覺出貨較為吃力，為了節省時間，主力往往會採取快速賣出的方式來提升出貨速度。有時候，股價盤中放量跳水之後，還能短暫地「收復失地」，在日
    K 線圖上收出一條長下影線，可能是長下影陰線，也可能是長下影陽線，但它們的市場含義較為接近。這給投資人的印象是買盤承接力較強，殊不知這只是股價真正破位前的一次警示訊號，若我們不能正確解讀它，則會損失慘重。


    圖 7-12 中的股價在上漲之後，當日走勢突變，早盤直線跳水並伴以分時成交量的大幅放出。雖然在收盤前股價再次被拉回，但這種放量長下影線可以被看作是股價破位前的一次預演。在實盤操作中，我們此時應警惕風險，及時賣出。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_201_0.png)


    △ 圖 7-12 富奧股份 2019 年 4 月 19 日分時圖

