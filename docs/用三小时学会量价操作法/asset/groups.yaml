    # 衝高跌至均價線下方，

    與主力出貨有關


    均價線代表著盤中的支撐與阻力。股價在盤中，特別是在早盤階段，快速上衝後，若出現放量跳水式下行並直接跌至均價線下方，則多表明之前的上衝可能與主力的拉升出貨有關。


    主力在個股早盤開盤不穩定時，快速將股價拉升到一個高點位，隨即大量拋售，股價迅速下滑，持股者難以成功賣出。當發現股價已遠離盤中最高點時，持股者往往'
  - '[PAGE 209]


    會產生惜售心理，希望在隨後的盤面中的賣出價位可以與最高點接近。主力正是利用持股者的這種心理，降低盤面賣壓，而自己則悄悄出貨。


    圖 7-18 中的股價早盤快速衝高，但隨即跳水至均價線下方，跳水時量能明顯放大，這是資金撤出的訊號。一般來說，股價在盤中直線跳水幅度大、有明顯放量且經過一波跳水後直接跌破均價線，就是強弱轉化的明確標誌，常與主力的出貨行為相關，預示著中短線下跌走勢的開啟，隨後股價在盤中很難再出現強勢反彈。


    在實盤操作中，當我們發現這種形態後，應第一時間或等股價反彈至均價線附近時，賣股離場。


