    ## 6.12


    如圖 6-20，股價先是出現了一波短線飆升走勢，在這期間量價齊升，成交量的放大十分明顯，這使得股價短線漲幅極大。在隨後的高點處，股價開始滯漲，小陽線、小陰線交替出現，股價重心開始下滑，成交量也隨之不斷縮小。這種量價同步緩慢下滑的形態，預示著該股難有第二波上攻行情。在實盤操作中，我們此時應果斷賣出，鎖定利潤。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_181_0.png)


    ## 6.13 巨量的長下影線，應短線賣出離場


    「長下影線」是多空雙方盤中競爭較為激烈，且最終以多方佔優勢收盤時，所出現的一種 K 線形態，它往往被視作是股價上漲訊號。但是，若結合股價的局部走勢及量能來分析，則有不同的處理方式。


    如果長下影線出現在短線高點處，且當日伴有巨量放出，那麼這是空方賣壓突然增大的訊號。雖然多方當日進行了有力的承接，但是當日的巨量也預示了多方力量的過度消耗。這種巨量長下影線出現當日，無論是收陽線還是收陰線，只要出現在局部高點處，都可以被看作是股價回落的訊號，此時我們應短線賣出離場。


    我們可以看到在圖 6-21 中，股價在經歷了長期盤整之後開始突破上行，在短線漲幅為 30% 左右的位置點，出現了一條巨量長下影陰線，這是一個較為明確的短線反轉訊號，也是上攻行情受阻的訊號，此時我們應賣出。


    在盤整走勢中，巨量長下影線形態也是我們提前作出判斷的重要依據。圖 6-22 中可以看到，股價在中線漲幅較大的位置區，持續橫向震盪運行，隨著震盪走勢的持續，股價運行方向仍不明朗。如圖
    6-22 中的標注所示，此時出現巨量長下影陰線形態，表示該股中有較多的空方賣壓，雖然當日未使股價馬上降低，但隨著多方力量的不斷減弱，股價隨後破位下行的機率加大。在實際操作中，我們應逐步減碼、降低風險。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_182_0.png)


    △圖 6-21 興發集團 2019 年 6 月至 8 月走勢圖


    ![](img/ac68af843c2aeef3dbf55e10ca066163_182_1.png)


