    緊接著的回撤波段量能能相對縮小。而且，隨著股價的總體攀升，上漲波段的量能也會進一步放大，當上漲幅度較大時，此時也是市場多空分歧過於劇烈的訊號，預示著股價離頂部越來越近，我們應注意控制倉位、鎖定利潤。


    圖 3-12 中可以看到，股價呈波浪式上漲，成交量的變化也是波浪式的。如圖中的標注所示，在上漲過程中，隨著股價創出新高，上漲波段的量能也創出近期的新高，這是上升趨勢中的「波浪式量能」典型特徵之一。


