    # 1.2.5 主力行為的線索


    有主力參與的個股，其走勢往往「特立獨行」，甚至出現大行情。因此，關注主力的市場動向，是在股市中獲利的有效手段。主力的買賣方式不同於普通的散戶投資人，由於主力的加入，個股量能的放大與縮小會有一定的規律，發現這種規律後，我們就能好好把握主力動向了。


    主力在參與個股時，會結合大盤進行進貨、震倉、拉升、整理、再度拉升、出貨等操作。


    在這些環節中，進貨、拉升、出貨這 3 個環節是必然會出現的，其他幾個環節是否出現，與主力的風格、大盤走勢等因素相關。但是，無論哪一個環節，主力都會透過其買賣方式暴露其動向，而成交量就是反映主力動向最重要的線索之一。


