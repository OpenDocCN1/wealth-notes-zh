    對於起始於建倉環節的主力路線而言，這—主力參與過程的時間順序是：建倉—拉升—出貨。這種主力參與路線適合新主力，由於新主力在入駐個股之前手中沒有籌碼，所以不得不從建倉開始。此時，能否在低位區或者在恰當時機買入大量的建倉籌碼，對主力來說是至關重要的。


    對於起始於賣出的主力參與路線，其參與過程的時間順序是：賣出—建倉—拉升—出貨。起始於賣出的主力參與路線有很多優勢，其中最重要的是，主力不用被動地等待建倉時機，而是可以結合大盤震盪走勢，去主動創造一個好的建倉價位。


    在弱勢的市場環境下，主力往往也會先賣出手中持有的股票，等待時機，從而獲得有利的建倉價位，為下一輪參與打下基礎；或者主力利用大盤的不穩定性，來進行中線的高賣低買操作。一般來說，這類主力的實力較強，如果總是被動等待市場提供的機會，就會有一種極不穩定的因素。因此主動創造有利於自己的價位，就會讓成功率大大提高。下面我們結合案例，來看看主力是如何結合大盤波動，以進行大波段上的高賣低買操作。


    圖 4-5 中可以看到，經歷了 2018 年 10 月股市系統性暴跌之後，股價在「強勢反攻」、「收復失地」時，並沒有量能放出，這說明主力持股力度較大、參與能力較強。如圖中的標注所示，2018
    年 12 月，股市再度出現系統性風險，在滬深兩市全線暴跌的背景下，主力一般不會刻意維護股價，因此該股的價格也跟隨著大盤快速下跌，短線跌幅巨大。


    值得注意的是，股價在前期高點並沒有足夠的震盪整理時間，主力難以出貨。在這種情形下，我們可以推測主力仍舊在個股之中。在暴跌之後的低點，當股價再度出現一波縮量快速下跌時，便會出現更好的買入點。


    主力利用大盤的波動進行高賣低買操作，是一種常見的情形。主力因為對股價未來走勢看得更遠，往往能夠接受由於大盤暴跌造成的帳面快速虧損，這是一種策略性的買賣方式。所以我們不能憑當然地認為，個股在主力沒有大量出貨的情形下是不可能暴跌的。主力可以透過反覆買賣個股，利用股價的大波動來進行「低買高賣」操作，最終實現獲利出局。'
