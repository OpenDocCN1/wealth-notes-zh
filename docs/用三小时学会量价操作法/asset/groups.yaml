    # ### 下跌趨勢的典型量價關係：跌勢無量


    # ### 2.6.1 下跌途中的縮量成因


    對於大多數個股來說，當其價格步入下跌後，其量能將持續地處於一種相對萎縮的狀態，「跌勢無量」是下跌趨勢中典型的量價關係。之所以如此，是因為當個股或股市步入跌勢後，財富效應消失，場外的投資人入場意願大大降低。


    場內投資人都希望能在更低的價位時進行抄底，此時只需少量的虧損盤「割肉離場」，就可以使股價降低，由此形成了縮量下跌的總體格局。只要跌勢中的量能一直保持縮減狀態，縮量下跌格局未被打破，則跌勢就不會輕易見底。


    此外，由於上升趨勢造成的個股估值普遍偏高，而價格又是圍繞估值上下波動，因此這也是價值回歸的過程。


    # ### 2.6.2 破位下行時縮量


    股價在高位區間出現橫向震盪走勢時，若在其向下跌破盤整區時出現了縮量，則表示經歷震盪之後，空方佔據了主動地位，且場外買盤入場的意願極低，股價向下運行無支撐。這是股價步入下跌趨勢的訊號，也預示著股價隨後的中短線跌幅較大，在實盤操作中，我們應及時賣股離場。


    由圖 2-18 可以看到，股價在高位區出現了短期的盤整走勢。此時，趨勢運行不明朗，但是隨後的縮量破位則提示我們：股價已選擇了運行方向。'
