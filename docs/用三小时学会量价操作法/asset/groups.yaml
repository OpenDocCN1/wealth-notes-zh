    ### 2.3.3 短線飆升連續式放量


    短線飆升走勢中，出現連續式放量時的股價上漲並不具有持續性，股價的上攻走勢多為一波到頂，一旦量能開始縮減或者股價上攻受阻，我們應中短線賣出。特別是當這種短線飆升走勢，出現在股價累計漲幅較大的情形下時，股價隨後的下跌速度極快，下跌幅度往往也極大。


    圖 2-9 中出現了連續式放量上攻的形態特徵，如圖中的標注所示，高位出現了縮量、滯漲，這是一個明確的中短線賣出訊號。


    ### 2.3.4 橫向整理連續式放量


    在橫向的整理走勢中，股價上下波動幅度縮小，正常情況下，市場交投應有所減少，量能應有所縮減，若此時量能連續性放大且放大效果相近，則多與主力的出貨行為有關。一般來說，橫向整理走勢中的連續式放量，多出現在股價累計漲幅較高的高位區，看似個股交投活躍、承接資金踊躍，但通常是中短線見頂的訊號，主力往往在此時出貨。


    圖 2-10 可以看到股價累計漲幅大，一波回檔後，雖然股價處於短線低點，但從中長線角度來看，仍處高位區。此時的橫向窄幅整理卻引發了量能的持續性放大，這是一個短線下跌訊號，也預示著隨後的股價運行趨勢——破位下行。


