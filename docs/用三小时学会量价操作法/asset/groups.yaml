    ## 4.2 主力的類型及投資風格有哪些？


    ![](img/ac68af843c2aeef3dbf55e10ca066163_107_0.png)


    隨著國內股市及經濟發展前景總體向上，多路資金紛紛涉足 A 股，除了中小散戶外，其他的資金大多實力雄厚，它們可以被稱作是 A 股中的主力。但是，大多數的主力資金只是助推著行情的發展。在實盤操作中，我們要結合主力類型及其投資風格來進行綜合判斷。


    ### 4.2.1 依資金性質劃分主力


    對股價走勢產生重要影響的主力資金，可以分為公募基金、券商、QFII、大股東、遊資及私募等，以下逐一說明。


    1. **公募基金**


    公募基金（Public Offering of Fund）是指由基金管理公司透過發行基金單位，來集中投資人的資金，由基金託管人（具有資格的銀行）託管、基金管理人管理和運用資金，以從事股票、債券等金融工具投資。在這裡，公募基金主要指那些投資於股市的基金，即偏股票型基金。


    公募基金的資金量龐大，為了可以穩定應對基金投資人的申購、贖回等操作，大多參與規模較大並且有業績支撐的個股。在一般的股票行情軟體中，往往對「基金重倉」的個股進行單獨的劃分，投資人可以在此查詢到哪些個股更能獲得基金的青睞。


    也正因為如此，公募基金對股價走勢的影響力會更在於助推作用。當股市行情向上，基金投資人申購踊躍時，公募基金對藍籌股、績優股的買入也會增多，從而對行情具有推動的作用。但當行情不好時，這類個股雖有業績支撐，為了應對基金投資人的贖回，其股價走勢往往也不理想。這些都是投資人參與基金重置股時應瞭解、注意的。


    當然，由於股票型基金種類繁多，也有不少公募基金專注於投資小股本、題材股，而且由於基金經理的理念不同，不同的基金往往會出現截然不同的投資風格，這時我們就要具體分析了。


    2. **券商**


    券商是提供證券買賣服務的中間機構。但是也有一些實力強大的券商，在提供證券買賣服務的同時，也進行證券投資。其資金募集方式與公募基金類似，對象大多是公眾，以「券商理財產品」的方式進行資金募集，由專業人士負責。券商所選的個股大多是一些業績較為優秀、行業發展前景較好的個股，在股市中的參與方式與公募基金基本相似。


    3. **QFII（合格境外機構投資人）**


    QFII 是英文 Qualified Foreign Institutional Investors 的縮寫，即合格的境外機構投資人。QFII 制度使得國際資金可以進入
    A 股市場，但由於 QFII 資金要設專用帳戶並且會受到一定的監控，而且國外資本在國內股市投資的原因，大多是看好經濟的發展，以長線投資行業龍頭股，故 QFII
    多以價值投資為核心來參與個股。他們常常在低位區進行投資，耐心等待股市行情轉熱後，在高位賣出，對於行情及股價走勢的影響力較弱。


    4. **大股東**


    大股東，特別是直接參與上市公司運行的大股東，對公司的情況無疑是最瞭解的。當公司前景樂觀、業績高速增長時，若市場沒有給公司股票一個合理的定價，則大股東很有可能在市場上實施積極的增持行為。這種增持行為往往會引起場外大資金的關注，也會讓中小投資人看好該股中期價格走勢，從而對股價的後期運行產生重要影響。


    5. **遊資及私募**


    遊資、私募，也稱為民間資本，在一些暴漲的題材股、消息股甚至有隱藏題材的 ST 類股中，很難發現公募基金的身影，參與這類個股的主力正是遊資或私募。


    我們常常會看到同一個板塊或同一種題材、概念中的許多股票，在沒有重大利多的前提下，僅憑著一些市場傳聞就能在短時間內飆升，成為同板塊或同題材中的「黑馬」或「龍頭」。而這往往就是市場遊資或私募參與熱門題材股的結果。


    投資人在把握短線機會時，遊資或私募的動向及相關個股的異動，是最值得關注的，因為這類股票可以創造較好的短線收益。但是在參與時，我們一定要記住買早不買晚。當我們發現個股的價格已經短線飆升
    30% 以上，此時即使有好的題材助推，也應保持理性，不宜重倉參與，更不宜盲目地追漲買入。


    ### 4.2.2 中長線主力參與股解讀


    在實盤操作中，我們更應該依賴於盤面資訊來分析主力的投資行爲，特別是盤面上的量價形態，依據量價配合形態的變化，我們可以更完整地分析、把握主力的投資行爲。在實盤操作中，依據盤面形態來著手分析主力的投資行爲時，我們主要應以「參與時間長短」來區分不同類型的主力。不同的主力有不同的投資風格，其投資風格會表现在個股的不同走勢上。接下來，我們結合實例來看個股的不同走勢，是如何反映主力的不同投資風格。


    中長線主力是指參與時間較長的主力，一般來說，其參與時間可以超過一年。這類主力在底部區的進貨較為充分、對股價的總體拉升幅度較大。如果投資人可以做到中長線持股待漲，那麼將能獲取高額的回報。


    對於中長線主力參與股來說，它的進貨環節持續時間往往很長，我們有更多的逢低佈局時機，這類個股更適合有耐心的中長線投資人。而且，當個股進入到主力拉升階段，在股價累計漲幅不大的時候，每一次的短線回落低點都是較好的中短線入場時機。


    圖 4-2 是一支中長線主力參與的股票，主力很可能在股價前期破位下行前就已進入。當股價隨股市大貶而進入低位區之後，出現了長期的橫向震盪走勢，並屢次出現漲停板啟動股價短線波動的情況，而主力正好借此機會進貨。相對來說，進貨佈局時間並不是很長，這也造成了主力的參與能力不夠強，該股在隨後股價突破時仍有較大的拋售阻力。


    在實盤中，雖然股價突破上行時的量能放得比較大，但由於低位區蓄勢很充分，並且股價在突破時的小陽線漲幅均不大，因此，在實盤操作中，我們可以適當追漲買入，享受主力拉升成果。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_110_0.png)


    該股隨後出現了較為獨立的上攻行情，之間還夾雜著一次盤整走勢，這正是中線主力積極參與的結果。在股價累計漲幅翻倍的情形下，主力開始進行出貨操作。此時，盤面上的漲勢下滑打破了原有的上升形態，再結合股價上漲時放量較大、主力所持股碼數量相對有限等因素，所以在實戰中，本着資金安全的原则，我們此時也應及時地減碼或清倉出場。


    ### 4.2.3 短線主力參與股解讀


    短線主力的參與時間較短，往往在幾週或幾個月內，即可完成一輪完整的買賣過程，個股價格的短期漲勢較為明顯、漲幅較大。短線主力所參與的個股，也多是與當時市場熱點相符的題材股。一般來說，民間遊資更喜歡短線投資個股，即成為個股短期內的參與主力。


    短線主力參與的個股，大多是有熱門題材推動的。在短線上攻走勢剛剛展開時，股價往往不易回撤。此時，對投資人的買賣技巧的要求較高，投資人一定要敢於追漲入場，畢竟股價才剛剛啟動；但是，一旦股價短線漲幅相對較大，超過
    30% 後，其波動幅度也會增大，投資人此時應結合題材熱度及市場環境，再來決定買賣方向。


    短線主力多會結合市場熱點來把握建倉時機。由於市場熱點往往頻繁轉換且不斷出現，因此，短線主力的建倉目標股較多、建倉時機也較多。但由於市場熱點往往是突然湧現的，因此，短線主力的建倉時間就會相對較短。


    圖 4-3 中可以看到，股價以漲停板的方式突破盤整區、快速上攻。短線主力也常採取連續漲停板的方式，最大限度地啟動個股的股性及題材熱度。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_111_0.png)


    對於投資人來說，一要結合個股的題材來決定是否追漲，二要在股價突破上攻之初，特別是在剛剛啟動的前兩個交易日追漲買入，這樣可以尽可能地降低追漲風險、增大短線獲利空間。並且，短線主力在參與這類個股時，其價格走勢很有可能一波到頂，特別是對於那些同題材下的非龍頭個股，一波到頂的概率極大。在實盤操作中，我們一旦發現股價數日內滯漲不前，應果斷賣出該種股票。


    ### 4.2.4 超短線主力參與股解讀


    超短線主力嚴格來講並不是主力資金，因為他們對個股的參與往往就是「一日遊」。超短線主力的目標，只是獲取在一、兩日之內的差價利潤。


    超短線主力的市場行為如同快進快出的散戶，他們經常選擇日 K 線形態優異的個股，提前一、兩個交易日進行操作，然後在隨後交易日的早盤階段快速拉升，從而使得該股的價格走勢呈突破上行形態。若市場跟風情緒較濃，超短線主力則順勢收漲停板，次日出貨；若跟風盤不足，超短線主力則在當日盤中高點即開始出貨，該股當日的價格走勢會呈現出衝高回落的長上影線形態。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_112_0.png)


    因此，若個股的價格某日大漲甚至漲停，但沒有什麼明確的題材或消息面支撐，且隨後幾日的走勢明顯疲軟，千萬不要過於肯定地認為有強大的主力隱藏其中，因為這種股票的異動，很可能就是由超短線主力快速快出所引起的。


    圖 4-4 中，股價以一個漲停板強勢突破了盤整區，似乎將展開一輪上攻行情，殊不知次日出現了衝高回落的放量長上影線 K 線，這種形態往往就是超短線主力參與的結果。超短線主力早在漲停板前一日就已略放量，借助良好的突破形態及跟風追漲盤的湧入，超短線主力在漲停板次日實現了快速出貨。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_112_1.png)


    ### 4.2.5 主力的兩種參與路線


    對於主力參與個股的流程來說，以「建倉環節」為起點的路線是最常見的參與路線，畢竟手中有一定籌碼之後，才能發揮對股價走勢的影響力。但是，也有一些主力會反覆買賣同一檔股票：主力在高位區出貨後，手中仍餘有少部分籌碼，借助於大盤震盪，順勢賣出剩餘的籌碼，股價往往也因此進入了低位區，此時再慢慢買入，這就是以「賣出」為起點的參與路線。


    對於起始於建倉環節的主力路線而言，這—主力參與過程的時間順序是：建倉—拉升—出貨。這種主力參與路線適合新主力，由於新主力在入駐個股之前手中沒有籌碼，所以不得不從建倉開始。此時，能否在低位區或者在恰當時機買入大量的建倉籌碼，對主力來說是至關重要的。


    對於起始於賣出的主力參與路線，其參與過程的時間順序是：賣出—建倉—拉升—出貨。起始於賣出的主力參與路線有很多優勢，其中最重要的是，主力不用被動地等待建倉時機，而是可以結合大盤震盪走勢，去主動創造一個好的建倉價位。


    在弱勢的市場環境下，主力往往也會先賣出手中持有的股票，等待時機，從而獲得有利的建倉價位，為下一輪參與打下基礎；或者主力利用大盤的不穩定性，來進行中線的高賣低買操作。一般來說，這類主力的實力較強，如果總是被動等待市場提供的機會，就會有一種極不穩定的因素。因此主動創造有利於自己的價位，就會讓成功率大大提高。下面我們結合案例，來看看主力是如何結合大盤波動，以進行大波段上的高賣低買操作。


    圖 4-5 中可以看到，經歷了 2018 年 10 月股市系統性暴跌之後，股價在「強勢反攻」、「收復失地」時，並沒有量能放出，這說明主力持股力度較大、參與能力較強。如圖中的標注所示，2018
    年 12 月，股市再度出現系統性風險，在滬深兩市全線暴跌的背景下，主力一般不會刻意維護股價，因此該股的價格也跟隨著大盤快速下跌，短線跌幅巨大。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_114_0.png)


    △ 圖 4-5 千金藥業 2018 年 10 月至 2019 年 4 月走勢圖


    值得注意的是，股價在前期高點並沒有足夠的震盪整理時間，主力難以出貨。在這種情形下，我們可以推測主力仍舊在個股之中。在暴跌之後的低點，當股價再度出現一波縮量快速下跌時，便會出現更好的買入點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_114_1.png)


    主力利用大盤的波動進行高賣低買操作，是一種常見的情形。主力因為對股價未來走勢看得更遠，往往能夠接受由於大盤暴跌造成的帳面快速虧損，這是一種策略性的買賣方式。所以我們不能憑當然的認為，個股在主力沒有大量出貨的情形下是不可能暴跌的。主力可以透過反覆買賣個股，利用股價的大波動來進行「低買高賣」操作，最終實現獲利出局。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_115_0.png)


    ### 4.3 中長線主力與短線主力，持股方式大不同


    中長線主力與短線主力的進貨風格迥然不同，中長線主力更注重控制建倉成本，進貨的時間往往較長，參與能力更強；短線主力更注重市場熱點、進貨時間較短，參與時更需借助於市場的追漲熱情及其他遊資的力量。由於主力的進貨風格與方式不同，反映在盤面的量價形態也就不盡相同。在本節中，我們就結合主力的風格，來看進貨環節下的常見量價特徵。


    #### 4.3.1 放量縮量對比


    主力進貨時會造成股價上漲，也會引發量能放大，隨著股價的短線上漲，主力會暫停進貨，在獲利盤拋售的情況下，股價自然會回落。由於僅是市場少量獲利盤回吐，主力並沒有參與拋售，因此股價回落時的成交量會明顯縮小。這就導致在股價波動過程中，成交量形成了放大、縮小的鮮明對比：波段上漲時的量能明顯放大，波段回落（或窄幅整理）時的量能明顯縮小。利用放量與縮量的鮮明對比，再結合個股中短期內的價格走勢的獨立性，我們可以初步判斷個股有主力入駐進貨的可能性。


    圖 4-6 中可以看到，在低位區的橫向震盪走勢中，多次出現獨立上攻的長陽線，且上漲波段的放量較為明顯；而在上漲波段後的回落走勢中，則明顯縮量，放量與縮量形成了鮮明的對比，這正是大資金入場進貨後積極鎖倉的訊號之一。獨立的上漲波段放量，啟動了多空分歧，使得主力有機會從中進貨；隨後的回落波段僅是由市場少量獲利浮籌拋售所致，因此量能會明顯縮小。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_116_0.png)


    △ 圖 4-6 揚農化工 2018 年 12 月至 2019 年 4 月走勢圖


    #### 4.3.2 震盪區漲停式反覆進貨


    震盪區的漲停板常會激發多空分歧，因為漲停板使得震盪區籌碼處於解套狀態，市場浮籌的鎖定度大大下降，主力可以趁機進貨，且漲停板的出現正是主力從中助推的標誌之一。


    利用漲停板激發多空分歧，主力在震盪區反覆進貨，個股在漲停板出現前後的五個交易日中量能明顯放大，在隨後的回落走勢中則明顯縮量。反覆震盪之後，主力最終實現了較強的參與能力。


    因此，隨著震盪走勢的持續，我們會看到個股的量能逐漸縮小，這正是主力鎖倉、市場浮籌減少的重要標誌。這種利用震盪區反覆出現的漲停板來進貨的方式，多出現在中線主力參與股中。一旦這類股票開始突襲上攻，其潛在的上升空間是很大的。


    圖 4-7 中可以看到，該股在低位區的震盪走勢中多次出現漲停板，且震盪上漲波段的量能明顯放大。隨著震盪走勢的持續，整理走勢中的成交量明顯萎縮，這正是主力進貨行為，導致市場浮籌大幅減少的訊號。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_117_0.png)


    △ 圖 4-7 深大通 2019 年 6 月至 9 月走勢圖


    #### 4.3.3 突破點翌日進貨巨量


    主力在低位的進貨，往往會因為市場低迷而使得效果不理想，這時，就需要再次拉升進貨。當股價突破盤整區時，若出現明顯的放量，且隨後股價能夠站穩於突破位置點，則多與主力在突破時實施積極的建倉行為有關，股價就有望就此步入上升通道。下面我們結合實例來說明。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_117_1.png)


    △ 圖 4-8 雲南白藥 2019 年 7 月至 11 月走勢圖


    圖 4-8 中可以看到，經歷長時間的橫向震盪之後，該股出現了長陽線向上突破形態，長陽線上穿整個盤整區時，當日的量能明顯放大，有大量的資金參與。隨後，股價強勢站穩於突破後的短線高點，正是主力積極的建倉、加碼，才使股價得以抵擋中短線獲利、解套賣壓，預示股價將步入上升通道，此時是中短線入場的時機。


    #### 4.3.4 突破點多日進貨放量


    股價先是放量突破盤整區，在強勢的橫向震盪過程中，該股不時地出現單日明顯放量形態，且股價重心隨著震盪的持續而向上移動，這多是主力借突破之機進行加碼的操盤行為，預示著股價隨後將出現一波上攻走勢。在實盤操作中，強勢震盪中的回落點，就是最佳的短線入場時機。


    圖 4-9 中可以看到，股價在相對低位區出現長期盤整走勢，隨著放量突破形態的出現，股性得以啟動，但股價並沒有立刻強勢上攻，這與主力手中籌碼數量相對較少、參與能力不足有關。此時，主力有加碼的需要，可以看到在強勢震盪區間又多次出現單日放量陽線，這正是主力在突破點加剧的多空分歧，而積極加碼操作的表現。在震盪過程中出現的股價重心上移，也表示買盤力量強於賣盤，一旦主力加碼完畢，隨後出現上攻行情的機率較大，此時是很好的入場時機。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_118_0.png)

    '
  mdcn: '

    現了與大盤完全不同的形態，其中的進貨、拉升、整理、再次拉升、出貨環節，均透過一定的盤面特徵展現出來了。


    1. 在低位置，主力先是小幅度拉升股價，這有利於激發多空分歧，而此時主力則緩慢持續進貨，且股價走勢與大盤相近。由於主力的參與改變了多空力量格局，因此股價止跌止穩，呈橫向震盪狀。進貨環節是持續時間較長的，它所產生的效果直接與主力的後期參與能力成正比。由於主力的進貨行為較為溫和，從量價配合關係著手，我們很難發現其蹤跡。對於這類個股，它只有在進入拉升環節後，才能相對準確地進行分析、預判。


    2. 隨後，主力開始拉升股價，股價在上漲時可以看到輕微放量。在股價突破前期盤整密集區時，這也是一個套牢區間，該股僅溫和放量，未見大幅放量，這表示市場浮籌不是很多。再結合股價相對獨立的突破走勢來看，我們可以判斷有主力參與，且主力手中持有相對較多的籌碼，股價後期上漲空間值得期待。在實盤操作中，此時是較佳的買入點。


    3. 主力對股價的拉升也較為溫和，這種情況常見於有中長線主力參與的個股。對於該股來說，股價拉升途中出現了小幅回檔，回檔時的幅度較小、量能大幅縮減，這正是整理環節的盤面形態。


    4. 隨後，股價快速上攻，一改前期緩慢攀升的格局。上漲方式的改變也預示著上升波段即將見頂，這正是主力借助於相對穩健的同期大盤走勢，而實施的再度拉升策略。此時的量能明顯放大，量能的大幅度變化也是多空對比格局變化的訊號，高位區預示著風險較大。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_105_0.png)


    △ 圖 4-1 陽光城 2018 年 12 月至 2019 年 6 月走勢圖


    5. 在高位區，放量滯漲形態的出現說明有大資金主動賣出，這往往就是主力出貨的訊號之一。股價走勢的快速反轉，跟風追漲盤反應過來時，股價早已大幅下跌。由於再次拉升時創造了較為充足的出貨空間，而高位滯漲形態又使主力能在高位區出掉較多籌碼，因此主力掌握著主動權，跟風入場的散戶若不能果斷「割肉」離場，將被套牢在高位區。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_106_0.png)


    ## 4.2 主力的類型及投資風格有哪些？


    ![](img/ac68af843c2aeef3dbf55e10ca066163_107_0.png)


    隨著國內股市及經濟發展前景總體向上，多路資金紛紛涉足 A 股，除了中小散戶外，其他的資金大多實力雄厚，它們可以被稱作是 A 股中的主力。但是，大多數的主力資金只是助推著行情的發展。在實盤操作中，我們要結合主力類型及其投資風格來進行綜合判斷。


    ### 4.2.1 依資金性質劃分主力


    對股價走勢產生重要影響的主力資金，可以分為公募基金、券商、QFII、大股東、遊資及私募等，以下逐一說明。


    1. **公募基金**


    公募基金（Public Offering of Fund）是指由基金管理公司透過發行基金單位，來集中投資人的資金，由基金託管人（具有資格的銀行）託管、基金管理人管理和運用資金，以從事股票、債券等金融工具投資。在這裡，公募基金主要指那些投資於股市的基金，即偏股票型基金。


    公募基金的資金量龐大，為了可以穩定應對基金投資人的申購、贖回等操作，大多參與規模較大並且有業績支撐的個股。在一般的股票行情軟體中，往往對「基金重倉」的個股進行單獨的劃分，投資人可以在此查詢到哪些個股更能獲得基金的青睞。


    也正因為如此，公募基金對股價走勢的影響力會更在於助推作用。當股市行情向上，基金投資人申購踊躍時，公募基金對藍籌股、績優股的買入也會增多，從而對行情具有推動的作用。但當行情不好時，這類個股雖有業績支撐，為了應對基金投資人的贖回，其股價走勢往往也不理想。這些都是投資人參與基金重置股時應瞭解、注意的。


    當然，由於股票型基金種類繁多，也有不少公募基金專注於投資小股本、題材股，而且由於基金經理的理念不同，不同的基金往往會出現截然不同的投資風格，這時我們就要具體分析了。


    2. **券商**


    券商是提供證券買賣服務的中間機構。但是也有一些實力強大的券商，在提供證券買賣服務的同時，也進行證券投資。其資金募集方式與公募基金類似，對象大多是公眾，以「券商理財產品」的方式進行資金募集，由專業人士負責。券商所選的個股大多是一些業績較為優秀、行業發展前景較好的個股，在股市中的參與方式與公募基金基本相似。


    3. **QFII（合格境外機構投資人）**


    QFII 是英文 Qualified Foreign Institutional Investors 的縮寫，即合格的境外機構投資人。QFII 制度使得國際資金可以進入
    A 股市場，但由於 QFII 資金要設專用帳戶並且會受到一定的監控，而且國外資本在國內股市投資的原因，大多是看好經濟的發展，以長線投資行業龍頭股，故 QFII
    多以價值投資為核心來參與個股。他們常常在低位區進行投資，耐心等待股市行情轉熱後，在高位賣出，對於行情及股價走勢的影響力較弱。


    4. **大股東**


    大股東，特別是直接參與上市公司運行的大股東，對公司的情況無疑是最瞭解的。當公司前景樂觀、業績高速增長時，若市場沒有給公司股票一個合理的定價，則大股東很有可能在市場上實施積極的增持行為。這種增持行為往往會引起場外大資金的關注，也會讓中小投資人看好該股中期價格走勢，從而對股價的後期運行產生重要影響。


    5. **遊資及私募**


    遊資、私募，也稱為民間資本，在一些暴漲的題材股、消息股甚至有隱藏題材的 ST 類股中，很難發現公募基金的身影，參與這類個股的主力正是遊資或私募。


    我們常常會看到同一個板塊或同一種題材、概念中的許多股票，在沒有重大利多的前提下，僅憑著一些市場傳聞就能在短時間內飆升，成為同板塊或同題材中的「黑馬」或「龍頭」。而這往往就是市場遊資或私募參與熱門題材股的結果。


    投資人在把握短線機會時，遊資或私募的動向及相關個股的異動，是最值得關注的，因為這類股票可以創造較好的短線收益。但是在參與時，我們一定要記住買早不買晚。當我們發現個股的價格已經短線飆升
    30% 以上，此時即使有好的題材助推，也應保持理性，不宜重倉參與，更不宜盲目地追漲買入。


    ### 4.2.2 中長線主力參與股解讀


    在實盤操作中，我們更應該依賴於盤面資訊來分析主力的投資行爲，特別是盤面上的量價形態，依據量價配合形態的變化，我們可以更完整地分析、把握主力的投資行爲。在實盤操作中，依據盤面形態來著手分析主力的投資行爲時，我們主要應以「參與時間長短」來區分不同類型的主力。不同的主力有不同的投資風格，其投資風格會表现在個股的不同走勢上。接下來，我們結合實例來看個股的不同走勢，是如何反映主力的不同投資風格。


    中長線主力是指參與時間較長的主力，一般來說，其參與時間可以超過一年。這類主力在底部區的進貨較為充分、對股價的總體拉升幅度較大。如果投資人可以做到中長線持股待漲，那麼將能獲取高額的回報。


    對於中長線主力參與股來說，它的進貨環節持續時間往往很長，我們有更多的逢低佈局時機，這類個股更適合有耐心的中長線投資人。而且，當個股進入到主力拉升階段，在股價累計漲幅不大的時候，每一次的短線回落低點都是較好的中短線入場時機。


    圖 4-2 是一支中長線主力參與的股票，主力很可能在股價前期破位下行前就已進入。當股價隨股市大貶而進入低位區之後，出現了長期的橫向震盪走勢，並屢次出現漲停板啟動股價短線波動的情況，而主力正好借此機會進貨。相對來說，進貨佈局時間並不是很長，這也造成了主力的參與能力不夠強，該股在隨後股價突破時仍有較大的拋售阻力。


    在實盤中，雖然股價突破上行時的量能放得比較大，但由於低位區蓄勢很充分，並且股價在突破時的小陽線漲幅均不大，因此，在實盤操作中，我們可以適當追漲買入，享受主力拉升成果。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_110_0.png)


    該股隨後出現了較為獨立的上攻行情，之間還夾雜著一次盤整走勢，這正是中線主力積極參與的結果。在股價累計漲幅翻倍的情形下，主力開始進行出貨操作。此時，盤面上的漲勢下滑打破了原有的上升形態，再結合股價上漲時放量較大、主力所持股碼數量相對有限等因素，所以在實戰中，本着資金安全的原则，我們此時也應及時地減碼或清倉出場。


    ### 4.2.3 短線主力參與股解讀


    短線主力的參與時間較短，往往在幾週或幾個月內，即可完成一輪完整的買賣過程，個股價格的短期漲勢較為明顯、漲幅較大。短線主力所參與的個股，也多是與當時市場熱點相符的題材股。一般來說，民間遊資更喜歡短線投資個股，即成為個股短期內的參與主力。


    短線主力參與的個股，大多是有熱門題材推動的。在短線上攻走勢剛剛展開時，股價往往不易回撤。此時，對投資人的買賣技巧的要求較高，投資人一定要敢於追漲入場，畢竟股價才剛剛啟動；但是，一旦股價短線漲幅相對較大，超過
    30% 後，其波動幅度也會增大，投資人此時應結合題材熱度及市場環境，再來決定買賣方向。


    短線主力多會結合市場熱點來把握建倉時機。由於市場熱點往往頻繁轉換且不斷出現，因此，短線主力的建倉目標股較多、建倉時機也較多。但由於市場熱點往往是突然湧現的，因此，短線主力的建倉時間就會相對較短。


    圖 4-3 中可以看到，股價以漲停板的方式突破盤整區、快速上攻。短線主力也常採取連續漲停板的方式，最大限度地啟動個股的股性及題材熱度。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_111_0.png)


    對於投資人來說，一要結合個股的題材來決定是否追漲，二要在股價突破上攻之初，特別是在剛剛啟動的前兩個交易日追漲買入，這樣可以尽可能地降低追漲風險、增大短線獲利空間。並且，短線主力在參與這類個股時，其價格走勢很有可能一波到頂，特別是對於那些同題材下的非龍頭個股，一波到頂的概率極大。在實盤操作中，我們一旦發現股價數日內滯漲不前，應果斷賣出該種股票。


    ### 4.2.4 超短線主力參與股解讀


    超短線主力嚴格來講並不是主力資金，因為他們對個股的參與往往就是「一日遊」。超短線主力的目標，只是獲取在一、兩日之內的差價利潤。


    超短線主力的市場行為如同快進快出的散戶，他們經常選擇日 K 線形態優異的個股，提前一、兩個交易日進行操作，然後在隨後交易日的早盤階段快速拉升，從而使得該股的價格走勢呈突破上行形態。若市場跟風情緒較濃，超短線主力則順勢收漲停板，次日出貨；若跟風盤不足，超短線主力則在當日盤中高點即開始出貨，該股當日的價格走勢會呈現出衝高回落的長上影線形態。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_112_0.png)


    因此，若個股的價格某日大漲甚至漲停，但沒有什麼明確的題材或消息面支撐，且隨後幾日的走勢明顯疲軟，千萬不要過於肯定地認為有強大的主力隱藏其中，因為這種股票的異動，很可能就是由超短線主力快速快出所引起的。


    圖 4-4 中，股價以一個漲停板強勢突破了盤整區，似乎將展開一輪上攻行情，殊不知次日出現了衝高回落的放量長上影線 K 線，這種形態往往就是超短線主力參與的結果。超短線主力早在漲停板前一日就已略放量，借助良好的突破形態及跟風追漲盤的湧入，超短線主力在漲停板次日實現了快速出貨。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_112_1.png)


    ### 4.2.5 主力的兩種參與路線


    對於主力參與個股的流程來說，以「建倉環節」為起點的路線是最常見的參與路線，畢竟手中有一定籌碼之後，才能發揮對股價走勢的影響力。但是，也有一些主力會反覆買賣同一檔股票：主力在高位區出貨後，手中仍餘有少部分籌碼，借助於大盤震盪，順勢賣出剩餘的籌碼，股價往往也因此進入了低位區，此時再慢慢買入，這就是以「賣出」為起點的參與路線。


    對於起始於建倉環節的主力路線而言，這—主力參與過程的時間順序是：建倉—拉升—出貨。這種主力參與路線適合新主力，由於新主力在入駐個股之前手中沒有籌碼，所以不得不從建倉開始。此時，能否在低位區或者在恰當時機買入大量的建倉籌碼，對主力來說是至關重要的。


    對於起始於賣出的主力參與路線，其參與過程的時間順序是：賣出—建倉—拉升—出貨。起始於賣出的主力參與路線有很多優勢，其中最重要的是，主力不用被動地等待建倉時機，而是可以結合大盤震盪走勢，去主動創造一個好的建倉價位。


    在弱勢的市場環境下，主力往往也會先賣出手中持有的股票，等待時機，從而獲得有利的建倉價位，為下一輪參與打下基礎；或者主力利用大盤的不穩定性，來進行中線的高賣低買操作。一般來說，這類主力的實力較強，如果總是被動等待市場提供的機會，就會有一種極不穩定的因素。因此主動創造有利於自己的價位，就會讓成功率大大提高。下面我們結合案例，來看看主力是如何結合大盤波動，以進行大波段上的高賣低買操作。


    圖 4-5 中可以看到，經歷了 2018 年 10 月股市系統性暴跌之後，股價在「強勢反攻」、「收復失地」時，並沒有量能放出，這說明主力持股力度較大、參與能力較強。如圖中的標注所示，2018
    年 12 月，股市再度出現系統性風險，在滬深兩市全線暴跌的背景下，主力一般不會刻意維護股價，因此該股的價格也跟隨著大盤快速下跌，短線跌幅巨大。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_114_0.png)


    △ 圖 4-5 千金藥業 2018 年 10 月至 2019 年 4 月走勢圖


    值得注意的是，股價在前期高點並沒有足夠的震盪整理時間，主力難以出貨。在這種情形下，我們可以推測主力仍舊在個股之中。在暴跌之後的低點，當股價再度出現一波縮量快速下跌時，便會出現更好的買入點。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_114_1.png)


    主力利用大盤的波動進行高賣低買操作，是一種常見的情形。主力因為對股價未來走勢看得更遠，往往能夠接受由於大盤暴跌造成的帳面快速虧損，這是一種策略性的買賣方式。所以我們不能憑當然的認為，個股在主力沒有大量出貨的情形下是不可能暴跌的。主力可以透過反覆買賣個股，利用股價的大波動來進行「低買高賣」操作，最終實現獲利出局。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_115_0.png)


    ### 4.3 中長線主力與短線主力，持股方式大不同


    中長線主力與短線主力的進貨風格迥然不同，中長線主力更注重控制建倉成本，進貨的時間往往較長，參與能力更強；短線主力更注重市場熱點、進貨時間較短，參與時更需借助於市場的追漲熱情及其他遊資的力量。由於主力的進貨風格與方式不同，反映在盤面的量價形態也就不盡相同。在本節中，我們就結合主力的風格，來看進貨環節下的常見量價特徵。


    #### 4.3.1 放量縮量對比


    主力進貨時會造成股價上漲，也會引發量能放大，隨著股價的短線上漲，主力會暫停進貨，在獲利盤拋售的情況下，股價自然會回落。由於僅是市場少量獲利盤回吐，主力並沒有參與拋售，因此股價回落時的成交量會明顯縮小。這就導致在股價波動過程中，成交量形成了放大、縮小的鮮明對比：波段上漲時的量能明顯放大，波段回落（或窄幅整理）時的量能明顯縮小。利用放量與縮量的鮮明對比，再結合個股中短期內的價格走勢的獨立性，我們可以初步判斷個股有主力入駐進貨的可能性。


    圖 4-6 中可以看到，在低位區的橫向震盪走勢中，多次出現獨立上攻的長陽線，且上漲波段的放量較為明顯；而在上漲波段後的回落走勢中，則明顯縮量，放量與縮量形成了鮮明的對比，這正是大資金入場進貨後積極鎖倉的訊號之一。獨立的上漲波段放量，啟動了多空分歧，使得主力有機會從中進貨；隨後的回落波段僅是由市場少量獲利浮籌拋售所致，因此量能會明顯縮小。


    ![](img/ac68af843c2aeef3dbf55e10ca066163_116_0.png)


    △ 圖 4-6 揚農化工 2018 年 12 月至 2019 年 4 月走勢圖


    #### 4.3.2 震盪區漲停式反覆進貨


    震盪區的漲停板常會激發多空分歧，因為漲停板使得震盪區籌碼處於解套狀態，市場浮籌的鎖定度大大下降，主力可以趁機進貨，且漲停板的出現正是主力從中助推的標誌之一。


    利用漲停板激發多空分歧，主力在震盪區反覆進貨，個股在漲停板出現前後的五個交易日中量能明顯放大，在隨後的回落走勢中則明顯縮量。反覆震盪之後，主力最終實現了較強的參與能力。


    因此，隨著震盪走勢的持續，我們會看到個股的量能逐漸縮小，這正是主力鎖倉、市場浮籌減少的重要標誌。這種利用震盪區反覆出現的漲停板來進貨的方式，多出現在中線主力參與股中。一旦這類股票開始突襲上攻，其潛在的上升空間是很大的。


    圖 4-7 中可以看到，該股在低位區的震盪走勢中多次出現漲停板，且震盪上漲波段的量能明顯放大。隨著震盪走勢的持續，整理走勢中的成交量明顯萎縮，這正是主力進貨行為，導致市場浮籌大幅減少的訊號。


