    # 1.2 调整显示屏位置（1）


    ![](img/e60c777a5ccf4a0b8a375fd0630997c4_4_0.png)


    ![](img/e60c777a5ccf4a0b8a375fd0630997c4_4_1.png)


    +   调高显示屏的位置，以避免因显示屏高度、远近不合适，而导致不正确的坐姿或用眼方式

    调整显示屏的远近：调整显示屏至端坐时与显示屏中心距离一臂长的位置

    调增显示屏的高度：使用可调节支架或直接垫高显示屏，使显示屏的顶部与端坐时的视线齐平'
