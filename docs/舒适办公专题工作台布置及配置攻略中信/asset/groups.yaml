    # 1.1 调整椅子高度


    ![](img/e60c777a5ccf4a0b8a375fd0630997c4_3_0.png)


    ![](img/e60c777a5ccf4a0b8a375fd0630997c4_3_1.png)


    +   - 办公桌的高度往往是固定的，对于不同的人来说，可能会太高或太矮

    - 调整椅子高度：直到端坐时，手臂自然放置在办公桌上时，**手臂弯曲角度为90度**

    - 如果调整后，由于座椅太高导致脚无法触到地面，可以**选择脚垫**或其他物品垫在脚下，保持舒适'
