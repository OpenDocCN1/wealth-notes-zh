    - 调增显示屏的高度：使用可调节支架或直接垫高显示屏，使显示屏的顶部与端坐时的视线齐平\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_5_0.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_5_1.png)\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_5_2.png)\n\
    \n如果使用多显示屏：\n- 主显+副显的搭配：则保证主显在正前方，主显、副显的远近、高度都按照一臂长、齐视线放置\n- 双主显的搭配：则保证自己正对两个显示屏的中间，同时按照一臂长、齐视线放置\n\
    - 如果仅使用笔记本电脑：使用支架保证显示屏高度，其余位置不变\n\n## 1.3 调整键盘和鼠标位置\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_6_0.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_6_1.png)\n\n- 键盘和鼠标放置的最关键问题是：能够不费力地接触到它们\n\
    - 键盘位置：当手肘放置在办公桌上呈90度时，伸直到刚好能到的位置\n- 鼠标位置：放置在键盘侧边。关键点是：尽量使用手腕而非整个手臂来操作鼠标，避免劳累和疼痛\n\
    \n## 1.4 调整电话位置\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_7_0.png)\n\n- 如果有座机，摆放到非惯用手的位置，这样在接电话时可以方便进行记录\n\
    - 同样，手机放置在非惯用手的位置也能够在来电时更加从容\n\n## 1.5 彩蛋：可在办公椅上完成的放松动作\n\nSTEP 1：下领动作\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_8_0.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_8_1.png)\n\nSTEP 2：放松颈部\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_8_2.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_8_3.png)\n\nSTEP 3：肩胛骨活动\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_9_0.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_9_1.png)\n\nSTEP 4：骨盆矫正动作\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_9_2.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_9_3.png)\n\nSTEP 5：最后，记得每小时起来站一站、动一动\n\
    \n### 第二章 工作台配置升级攻略\n\n- 2.1 键盘\n- 2.2 鼠标\n- 2.3 显示器\n- 2.4 电脑支撑架/升降台\n- 2.5 人体工学椅/办公用腰垫\n\
    \n## 2.1 键盘——介绍\n\n我们推荐机械键盘，机械键盘键程较长，能有效延缓长久打字下的手指疲劳问题\n\n| 轴体类型 | 特点 | 优点 | 缺点\
    \ | 是否适合投行人员 |\n| :--- | :--- | :--- | :--- | :--- |\n| 青轴 | 段落感明显，敲击声大 | 段落感、机械感较强，适合打字\
    \ | 噪音略大 | 推荐居家使用 |\n| 红轴 | 直上直下，没有明显的段落感（黑轴轻量化手感） | 手感轻盈 | 按底噪音略大（可选静音红轴） | 推荐\
    \ |\n| 茶轴 | 段落结构轴体，但较青轴段落感较为轻微 | 段落感较弱、压力克数适中 | 手感一般 | 适合机械键盘入门 |\n| 黑轴 | 直上直下，没有明显的段落感\
    \ | 噪音较小 | 按压较为费劲 | 不适合 |\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_11_0.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_11_1.png)\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_11_2.png)\n\
    \n不适合投行从业人员\n\n适合投行从业人员\n\n## 2.1 键盘——推荐\n\n机械键盘的价格差异较大，建议大家可以根据自己的需求选择对应的键盘\n\
    \n- 机械键盘品牌推荐:\n    - 入门品牌：达尔优、雷柏、雷神等\n    - 中端品牌：ikbc、雷蛇、卓成高斯等\n    - 高配品牌：Cherry\
    \ 原厂、Leopold、Filco、罗技、阿米洛等\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_12_0.png)\n\
    \n- 入门推荐品牌：达尔优\n    达尔优的机械键盘性价比较好，大部分机械键盘定位中端，产品类型也比较丰富，细节、手感较好，适合大部分用户使用\n- 中端产品推荐品牌:\
    \ IKBC\n    IKBC是一个专注键盘创新与研发的品牌，成立于2007年。其C系列键盘比较简约，窄边框设计，手感较好。且由于IKBC键盘都是PBT材质，所以颗粒感很好，触感干燥、稳定，节省清洁和保养的时间\n\
    - 高配产品推荐品牌: Cherry\n    Cherry是德国机械键盘品牌，其机械键盘之普及，已经成为了机械键盘行业的标准。Cherry公司以制造机械键盘轴闻名，市面上的机械键盘大多使用Cherry的轴。这些轴在世界各地的13间公司及工厂以机械化方式生产，因此按键精确、产品可靠\n\
    \n## 2.2 鼠标——介绍\n\n**长时间使用鼠标会导致腕管综合症（俗称“鼠标手”）的发生，因此鼠标的选择尤其重要**\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_13_0.png)\n\
    \n**腕管综合症**\n\n经常反复机械地点击鼠标，会让右手示指及连带的肌肉、神经、韧带处于一种不间歇的疲劳状态中，使腕管周围神经受到损伤或压迫，导致神经传导被阻断，从而造成手掌的感觉与运动发生障碍\n\
    \n**两类鼠标设计**\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_13_1.png)\n\n**鼠标的使用方法**\n\
    \n- 使用电脑时，电脑桌上鼠标的高度，最好低于坐着时肘部的高度，这样有利于减少操作电脑时对手腕腱鞘等部位的损伤。肩膀和背部放松挺直，不要耸肩或下垂\n-\
    \ 鼠标的位置越高，对手腕的损伤越大；鼠标距身体远，对肩的损伤越大；因此，鼠标应该放在一个稍低的位置，这个位置相当于坐位时，上臂与地面垂直时肘部的高度\n\
    - 使用鼠标时，手臂不要悬空，以此减轻对手腕的压力，移动鼠标时不要用腕力而尽量靠臂力，减少手腕受力。手腕不要悬空，要有所支撑，并且处于中立位，选择合适的鼠标垫，使手腕既不过伸，也不过屈\n\
    \n**人体工学设计**\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_13_2.png)\n\n对称式设计\n\n\
    ## 2.2 鼠标——推荐\n\n推荐原则：握感舒适、可编程按键（电竞鼠标是个不错的选择），根据自己的手型、使用场景和使用习惯来选择\n\n**办公鼠标/适合办公的电竞鼠标好物推荐（主推罗技品牌）**\n\
    \n| 预算 | 型号 | 特点 |\n| :--- | :--- | :--- |\n| 100-200元 | 罗技G102 | 握持舒适、轻便耐用 |\n\
    | | 罗技G300S | 9个可编程按键，效率神器 |\n| | SANWA人体工学鼠标 | 竖握设计，解放手腕 |\n| 200-300元 | 罗技G304\
    \ | 轻便握持、反应灵敏 |\n| | 微软Sculpt | 设计独特，舒适手感 |\n| 300-500元 | 微软Arc | 弯折设计，轻薄便携 |\n\
    | | 罗技MX Master 2S | 上一代办公神器 |\n| 500+元 | 罗技MX Master 3 | 新一代办公神器 |\n| | 罗技MX\
    \ Vertical | 办公神器+舒缓肌肉疲劳 |\n\n## 2.3 显示器——介绍\n\n显示器几乎是每一个投行人必备的生产力工具，添置一台显示器可以大大提高工作效率\n\
    \n**显示器尺寸选择**\n\n| 观看距离/cm | 最大舒适宽度/cm | 显示器尺寸/英寸 |\n| :--- | :--- | :--- |\n\
    | 40 | 40.16 | 18.17 |\n| 50 | 51.70 | 23.40 |\n| 55 | 57.47 | 26.01 |\n| 60 |\
    \ 63.24 | 28.62 |\n| 70 | 74.78 | 33.04 |\n| 80 | 86.32 | 39.06 |\n| 100 | 109.40\
    \ | 49.51 |\n\n建议：日常办公观看距离在50-60cm，推荐选择23-27寸显示器\n\n**显示器面板选择**\n\n| 面板类型 | 可视角度\
    \ | 软/硬屏 | 优点 | 缺点 |\n| :--- | :--- | :--- | :--- | :--- |\n| IPS | 大 | 硬 | 色彩鲜艳\
    \ | 成本较高，会漏光 |\n| TN | 小 | 软 | 成本低廉 | 色彩表现差，可视角度小 |\n| VA | 较大 | 软 | 对比度高 | 拖影严重\
    \ |\n\n建议：主流的三种面板中，日常办公选择IPS面板屏幕\n\n**显示器分辨率选择**\n\n| 尺寸 | 分辨率 |\n| :--- | :---\
    \ |\n| 21 | 1080P |\n| 23 | 1080P |\n| 24 | 1080P |\n| 25 | 1080P / 2K |\n| 27\
    \ | 2K |\n| 32 | 2K / 4K |\n\n建议：分辨率越高，显示画面就越细腻，可根据屏幕尺寸对应选择。1080P和2K分辨率可以满足绝大多数办公需求\n\
    \n## 2.3 显示器——推荐\n\n推荐原则：满足办公需求的主流品牌，兼具性价比与实用性\n\n| 品牌 | 款式 | 特点 |\n| :--- | :---\
    \ | :--- |\n| 三星 | S24R352FHC 23.8英寸 IPS | 公司爆款 |\n| | C27F390FHC 27英寸 曲面 | 颜值担当\
    \ |\n| 飞利浦 | 243i7QSB 23.8英寸 IPS | 大牌性价比 |\n| | 273V7QDSBF 27英寸 IPS | |\n| 戴尔\
    \ | U2417H 23.8英寸 IPS | 可旋转，竖屏处理Excel更友好 |\n| AOC | I2490VXH/BS 23.8英寸 IPS | 某电商平台销量冠军\
    \ |\n| | CQ34G2 34英寸 2K | 21:9超宽带鱼屏，多窗口办公得心应手 |\n\n## 2.4 电脑支撑架/升降台——介绍及推荐\n\n\
    电脑支撑架通过改变视觉角度改变坐姿，从而改善颈部、背部不适\n\n- 笔记本电脑支架通常设有调节器，使用者可以通过调节倾斜角度，找到最适合自己的使用角度。使用户的视线和显示器平行，从而缓解颈肩部疲劳\n\
    - 通过抬高电脑，同时可以改善电脑散热，同时降低笔记本键盘进水、磨损的机会\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_17_0.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_17_1.png)\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_17_2.png)\n\
    \n电脑支撑架构造简单，选择较多；建议选择性价比高，可调节角度多，稳定性高的产品\n\n建议预算：100元左右\n\n长时间久坐会导致肩颈、脊椎严重磨损，坐站交替是一种提倡舒适的办公方式\n\
    \n- 世界卫生组织（WHO）科学研究表明：长时间保持坐姿会引起各类身体异常，对腰颈、脊椎影响尤为明显\n- 上班族长期久坐会导致脊椎不适、肥胖、糖尿病、静脉曲张等不良\n\
    - 久坐后站立，将会减少对血管的压迫，能使更多含氧的血液供给大脑，使大脑更清醒舒适、从而提升工作效率；坐站交替还可促使更多热量的消耗\n- 坐站交替是一种提倡舒适的办公方式，告别久坐伏案，呵护颈椎腰椎\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_18_0.png)\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_18_1.png)\n\
    \n![](img/e60c777a5ccf4a0b8a375fd0630997c4_18_2.png)\n\n> 建议：升降台款式、功能多样，应根据自己的办公需求挑选，价格在300-1000元不等\n\
    \n## 2.5 人体工学椅/办公用腰垫——介绍及推荐\n\n长期伏案工作易导致腰椎疼痛，选择合适的人体工学椅与办公室腰垫均可为腰部提供支撑\n\n- 脊柱是由26节脊椎骨组成，包括7节颈椎、12节胸椎、5节腰椎以及融合的骶椎及尾椎，人体腰椎部分承受压迫最大；正常状态下脊椎的自然状态呈S状，但一旦坐下就很难长时间再继续保持这样的状态，使用人体工学椅/办公用腰垫可缓解因长时间维持同一个姿势太久导致的腰部酸痛\n\
    - 专业人体工学椅/办公用腰垫可提供背阔肌支撑、脊柱贴合支撑、肩胛处支撑、盆骨处支撑及尾椎保护\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_19_0.png)\n\
    \n人体工学椅\n\n![](img/e60c777a5ccf4a0b8a375fd0630997c4_19_1.png)\n\n办公用腰垫\n\n**人体工学椅/办公用腰垫推荐**\n\
    \n- 预算500元：推荐购置办公椅，另外加购腰靠和坐垫的组合\n- 预算1000元：推荐购置入门级人体工学椅\n- 预算2000元及以上：推荐购置中高档人体工学椅\n"
