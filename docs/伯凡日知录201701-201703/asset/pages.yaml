    美国的《财富》杂志曾经有一段时间评年度最愚蠢的CEO，这个榜与其说是让那些当事人尴尬，其实也是让媒体尴尬的。如果有那么闲工夫翻这个杂志，你会发现一般上那个榜的人，好多年前他们一直在吹捧他们，其实那个时候的吹捧和表扬也不是全错的。这里头有一个逻辑存在，就是导致你成功的逻辑其实就是你失败的逻辑，聪明和智慧都只是一个期权，也就是回过头来对自己进行嘲弄、讥讽、拆台的分析。如果你缺乏一种反讽的精神，也就是对自己进行拆台型的恶意评估，改变角度来审视自己和公司的成功，你缺乏这种工夫的话，你就会顺理成章地陷入到归因偏差里头。


    我们天天在讲认知升级，我一直有一个观点，比认知升级更重要的是提防你陷入到种种的认知谬误当中，要不然你自己认为你是在升级，其实你已经陷入到一个不自知的认知陷阱里。2人写想绪法


    认知偏差也是一种我们在认知当中很容易陷入到的一种陷阱，学术的定义是认知者系统地歪曲了某些本来是正确的信息，有的源于人类认知过程本身固有的局限，有的则是由于人们不同的动机造成的。


    ![](img/f47a5fb2d99d8b2557309e5ada0c8e7e_120_0.png)


    中国古人不知道认知偏差这个词，但是有很多的寓言其实都讲的是认知的偏差。当你有一个动机存在的时候，你会启动你的意识雷达。你的意识雷达里头植入了几个有限的变量，对于其他不关心的变量并没有在你的雷达里头，所以一旦你启动认知也就开始了搜集种种偏见的过程。


