    我们昨天说到, 所谓智能就是能够捕捉场景性的信息, 在特定的场景下作出适当的反应。而机器和人最大的差别就在于机器的智力, 它常常是非常隐形的。一个最先进的机器人和一个4岁半的小孩子之间的最大的差别,
