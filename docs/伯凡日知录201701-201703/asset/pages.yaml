  md: '他仔细地考察，发现了其中的一个隐秘的因果关系链条。英国的独身的女性有一个习惯，她们喜欢养猫，而且不止养一只猫，有时候会养3只、4只，甚至5只猫，作为她们生活当中的一个必要的陪伴。当这个老姑娘的数量越来越多的时候，猫的数量就会增加，猫的数量增加的时候，有一种动物的数量就会随之而减少，这种动物就是田鼠，因为猫很擅长捕捉田鼠作为它们的食物。当田鼠的数量随着猫的数量的增加而减少的时候，有一种动物的数量会随之而增加，这种动物就是丸花蜂，那是一种野蜂。为什么丸花蜂的数量会增加呢？因为田鼠很爱吃丸花蜂的卵。当田鼠的数量在增加的时候，丸花蜂的数量就会减少；反过来，田鼠的数量减少的时候，丸花蜂的数量就是会增加。而丸花蜂的数量增加会导致一种植物的数量增加，这种植物叫红三叶草，因为丸花蜂喜欢在红三叶草的花上采蜜。我们说了，蜜蜂采蜜的过程也是授粉的过程，所以蜜蜂的数量越多，红三叶草的种子的数量就会增加，相应的红三叶草的数量就会增加。有一种动物特别爱吃红三叶草，这种动物就是奶牛。一方面红三叶草营养很好，再一个就是红三叶草对于奶牛好像有一种催情的作用，所以它吃红三叶草增加以后，奶牛的繁殖能力就会增加，这样就导致奶牛的数量会增加，奶牛数量增加以后，自然牛奶的产量就会增加。


    我们看到，这样一个漫长的因果链条，其实是一种众多利益相关方组成的一个链条。它们之间的关系就是一种生态关系。


    现在我们对生态就有更一个具体的认知了，所谓生态就是多要素，多环节，彼此之间或者明显或者隐秘的一种利益相关的关系链条。这种关系链条，由于它的隐秘性是往往让我们感受不到它的存在，甚至是给我们造成某种错觉，甚至会蒙蔽我们，误导我们，我们不知道是一种什么样的原因导致了一个结果。我们甚至会把那些有利的因素看作是有害的因素。


    ![](img/f47a5fb2d99d8b2557309e5ada0c8e7e_4_0.png)


    # 例子：草原上的狼


    我们如果看过《狼图腾》这个小说，我们就能够感受到生物物种之间的这种关系的隐秘性，甚至是欺骗性。在草原的人们看来，狼是ূ非常可恶的一种动物，因为它们会吃羊，会吃马，甚至对人进行攻击。所以一些年轻的牧民，尤其是从内地到了内蒙古的那些知识青年们，他们就觉得在草原上，大家要想过上幸福安定的生活就必须把狼全部消灭，打不尽就狼绝不下战场。但是，让人非常痛惜，非常尴尬的是，当他们把狼打尽的时候，灾难就降临了。


    +   1. 狼被打尽之后，首先是出现了兔灾，也就是说当兔子的天敌——狼消失的时候，兔子的数量就会无节制的繁衍，兔子一年会生三四次，兔子的数量以几何级数增加的时候，草原上的草就越来越不够吃，很多羊由于吃不到草身体越来越弱，甚至会饿死，病死。俗话说，兔子不吃窝边草，它的洞是很隐秘的，马在草原上行走的时候，一脚踏在兔子窝上的时候，兔子窝就会塌陷下去，而马的腿就很容易骨折。当一匹马骨折以后，它就没有用了。这样牧民被迫把骨折的马杀掉。本来打狼是为了保护马，结果当狼被打尽的时候，很多的马就被牧人杀掉了。


    +   2. 当草原上没有狼的时候，旱獭也泛滥成灾，旱獭的洞是隧道式的，它跟兔子一样，它会跟羊来抢草吃。旱獭越多，羊能吃到的草就越少，而且旱獭它喜欢在它的像地道式的洞里头储存很多的草，久而久之草原上就有了很多像地道一样的旱獭的洞穴。由于这些隧道式的洞里头冬天比较温暖，当冬天来临的时候，很多的蚊子就不会被冻死，它们会逃到旱獭的洞里头去。我们知道，蚊子的繁殖数量也是以几何级数增长的。所以来年夏天的时候，大量的蚊子出现，就造成了蚊灾，这些蚊子会叮在马上，马的身上就
    Purchase 了吸它们的血的蚊子，看上去像铺上了一面毯子，这些蚊子把马的血吸干，很多的马就这样死去了。当没有狼来吃马的时候，在整个马的物种里头比较低劣的那些马也能够活下来，这些品质不高的马也会繁殖后代，这样整个马的种类的质量就会大大地下降。


    +   3. 当狼消失的时候，男性的牧民他们在白天放牧的时候就能够放心地睡觉，不用担心狼来吃他们的羊或吃他们的马。晚上回到家的时候，他精力充沛。过去这些男性牧民在放了一天牧的时候回到蒙古包里头，累个半死，他们就呼呼大睡。而妇女负责晚上上来看护羊圈，因为狼晚上上可能会来偷食，整个晚上由于有狼的存在这些女性的牧民们整个晚上都睡不着觉。也就是说由于有狼的存在，整个草原的出生率是处于稳定的，比较低的一个数量级上。当狼消失的时候，整个草原的人口在几年之内就出现了明显的增长。由于人口数量的增长，整个草原本身由于兔子，由于旱獭的存在，过去牧民们可以凭借仅仅是放牧就可以养活自己，现在随着人口的增加，也随着草原的草的数量的减少，他们已经不能够凭借放牧来养活自己。所以他们就开始开荒种地，整个蒙古草原是属于高纬度地区，一方面他们土层很薄，另一方面这个地方在冬天的风很大，所以冬天过去之后，大量的开垦的土地在第二年已经出现了沙化的趋势，也就是说它的肥力非常的小，牧民们就不能在这些土地上种庄稼了，他们只能去开垦新的土地来种庄稼，这样久而久之，整个草原上就出现了越来越多的像牛皮癣一样蔓延的那种沙化的土地，草原被大大地破坏了。


    只有在这个时候，当年蔫蔫烈烈打狼的这些人才意识到，为什么当年他们打狼的时候，这些老年人在提醒他们，狼是不能打的，狼是草原的守护神。今天他们终于意识到，狼消失的时候，草原也面临着消失的危险。


    这个故事听起来有点冗长，我们从这样一个故事里头能够感受到物种之间的生态的关联是的隐秘的，我们人往往看不到这样一种隐秘的因果关联，我们抓住一点，不及其余，任性妄为，最后我们发现我们做的事情是事与愿违的。


    通过我们上面的分析，大家可能能够比以前更细致地感受到什么叫生态，生态的力量有多大。


