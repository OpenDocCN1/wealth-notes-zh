    2.27 | “酷”与“美感”...


    # —— 知识笔记 ——


    我以前节目里经常提到一个90后的朋友，她对我帮助的确很大，今天她给我转来了一篇万维钢老师的文章，叫《喜欢=熟悉+意外》，这文章写的很有意思。第一，它验证了我的很多的感受、体验和判断。另外一方面它又给我提供了一个我比较陌生
    的，我没有想到的那些观点和视野。


    万老师这篇文章其实是对《大西洋月刊》 的有一篇文章的解读，那篇文章的标题叫 《什么能让东西显得酷》，这个酷我们今 天说的特别多，说多了以后，我们往往忘 记它本来来的意思。


    # 酷和Cool


    酷：一说到酷我们就想 到是很剧烈的东西，酷热，酷寒，冷酷这样的意思。汉语 当中这个酷  的烈度要比英文当中的Cool要 大得多。


    cool：形容人的一种状态，这种状态可以用我们今天很流行的一 网络词语“高 冷”来形容。就是说这个人他不是那么平 易近人的人，是 一种让你觉得有距离，让 你内心里头有某种敬畏，想接近又不容易
    接近的那样一种状态。这个词最早是一些 很年轻的，甚至是儿童爱用的词。当他说 这个东西很高级的时候，他就说“ So Cool”，高级的意思就是你不容易接近，
    跟你有距离，同时又有一种诱惑，让你去 接近。这里头就有一种禁忌即诱惑的那种 微妙的心理。


    # 冷媒体 和 热媒体


    麦克卢汉有一对概念，叫凉媒体和热媒体，有的译成叫冷媒体、热媒体。


    那个冷媒体就是Cool media，它所呈现的内容不是 你马上就能够明白的，你需要动 用你的智力，动用你的感知力，比较深度的参与它，然后你才可能获知它的信息的
    那样的一种媒体。比如说相对于报纸，书 就是冷媒体。相对于电视，电影就是冷媒体。


    # 酷和美的關係


    我们今天说一个东西如何显得酷，其实就是说如何显得高级，如何显得有吸引力，有一种又在排斥我，同时又在吸引我的那样一种东西。其实那种东西就像我们通常 所说的那种状态，其实就是“美”，美的
    东西它往往都是具有吸引你的一面，同时 又有排斥你的一面。所以美天然的是跟距 离联系在一起的。


    英国的有一个美学家叫布洛，专门提出了一种理论叫“距离说”。


    如果一个事物，一个人他是美的，就一定意味着他跟你之间是有距离的。


    关于美，中国有一个美学家叫高尔泰，他 对美有两个定义，实际上是合二为一的定 义。


    +   1. 美是自由的象征。\n2. 美是努力的象征。


    就是说美的东西首先是让你体会到了一种自由。那什么叫自由呢？自由是通过努力 而获得的那种东西才叫自由，自由不是任 性。


    # 关于美的两种观点


    ![](img/f47a5fb2d99d8b2557309e5ada0c8e7e_85_0.png)


    # 美是客观的


    有人认为美是客观的，一个东西之所以美是因为它包含着某种很硬的、很严格的规律和数据。


    ![](img/f47a5fb2d99d8b2557309e5ada0c8e7e_85_1.png)


    # 美是一种互动的关系


    更多的人认为，美其实是一种互动的关系。当年苏东坡写过一首诗探讨“音”是从哪儿来的。


    # 关于美感的几种看法


    # 美感是一种成就感


