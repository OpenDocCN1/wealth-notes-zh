    # —— 知识笔记 ——


    今天我们都在谈终身学习，我们知道学习区跟焦虑区是不一样的，焦虑区是只有痛感，只有劳而无功，你整天在想一件事，但是毫无结果，于事无补，无论是认知上还是行动上没有任何进展，你感受到不停的运转，但是得不到任何结果，那种状态叫焦虑。而学习是通过行动和思维上的劳作，让自己产生一种强烈的真切的新鲜的获得感。


    我经常在想，每天都在使用各种各样的产品，有点像交朋友，产品是有各种各类型的，朋友也是有各种各类型的。按照余光中先生的分类，朋友分为四种类型，我们把有趣、无趣作为横轴，把高雅、庸俗作为纵轴，这就得出了四个象限。


    第一象限是高雅而有趣，第二象限是高雅而无趣，第三象限是庸俗而无趣，第四象限是庸俗而有趣。


