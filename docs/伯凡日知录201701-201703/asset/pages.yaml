  md: '这就回到我们本周一开始提的那个问题，为什么教育小孩子是超级复杂的事情？我们说伴君如伴虎，说的是臣子跟君王相处的过程当中非常的艰险，所以处理好跟他的关系会非常的难，稍有不慎，失之毫厘，谬以千里，但我要说的是这还不是最难的。因为臣子和君王之间的权力关系，各自的角色都是非常固定的，这个整体的场景是固定的，但有一种场景比这要复杂得多，这种场景比伴虎还要凶险，这就是与孩子相处。


