  md: '放弃了和弱化了一种能力。你不断的彰显、滥用自己某一个强势功能的时候，也就意味着你在不断的废除和弱化其他可能的能力。企业尽可能的彰显自己的优势，最大化利用自己的优势的时候，也就意味着企业可能会遭遇重大的危机。


    前些年讲贵族教育，而且很多人会讲到英国的伊顿公学，那个学校就是培养英国的贵族，当然中国现在很多有钱人也把孩子送到那个地方去。伊顿公学的学生，当然要学现代的先进的各种各样的知识，但是他们有一个跟其他学校很不一样的就是，他们始终要读古典的书，学拉丁文这种看似已经死掉的文字，要去精读那些在我们看来好像没有用的古代经典。其中有一本书在伊顿公学可以说是一个保留的书目，那就是亚里士多德的《尼各马可伦理学》。哲学家罗素认为这是《尼各马克伦理学》里头的一个核心观点，就是恢宏大度的人，Generous
    men。


    # 什么叫恢宏大度的人？


    生活当中，他总能够通过尽可能的奉献、付出形成一种势能。你跟他相处的时候你总觉得他给你的多，你付出的少，他试图制造一种你永远在欠他的感觉。你明明欠他的，但是他又不追着你来偿还你所欠的。


    所谓贵族就是要做一个恢宏大度的人，用我们前面的话说，就是要做一个“执左契，而不责”的人，这样你才可能形成一种巨大的凝聚力，自然而然的会形成一种领导力。


    在亚里士多德看来，一个城邦的领导者就应该是这种恢宏大度的人，他应该出身在并不是特别显赫特别高层的家庭。因为出身太高的人容易跋扈，出身太低的人容易刻薄。在介于这两个层级之间的人，通过教育可以培养出一种叫做恢宏大度的性格。这个性格是适合于做领导者。一个精神上没有脱贫的人，或者一个精神上是一个铺张浪费，无所顾忌，极度任性的人都不适合于做一个领导者，他不是一个和光同尘的人，不是一个铢其纷、解其铄的人，不是一个被褐而怀玉的人。


    如果个人要自我迭代，大家可以问一问我现在是处于哪个阶层，我是否能够一点一点的让自己成为一个恢宏大度的人，执左契而不责的人。


