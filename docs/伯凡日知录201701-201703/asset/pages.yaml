    赵旭明·吴老师，您好。您对“坏的东西一学就来，好的行为总是A不易”这个句是怎么理解的？如果也从经济学的角度分析，是不是恶这个东西往往更容易获得短期利益，这又人们容易短视的弱点呢？


    吴伯凡


    应该说是有关系的。


    德国哲学家康德对道德有一个基本的定义，他不是从善和恶的角度，他是说你的这个行为是否具有逻辑的普遍性以及在这个行为本身可不可以持续。比如说钱钟书先生说有一类人的基本理财方式是借钱不还，那这个借钱不还到底道德不道德呢？


    我们就从这两点分析：第一，它是不是普遍的？就是说你借我的钱不还，这个行为它在逻辑上是不是普遍的，如果把这个逻辑倒过来用在你身上，你愿意不愿意，如果你愿意那就是这个是道德的，当然显然你是不愿意的，所以它不具有逻辑的自洽性，它不是一个通行的规则。


    第二，有没有可持续性，就是说我借了别人的钱不还，我下次还可不可以借到，或者你这个借钱不还的名声自然而然会传播，你以后能不能够继续采用这种理财方式，你显然是不可持续的。


    所以没有普遍性、不可持续，这就叫不道德的，我们可以说把那种东西就叫做恶的东西。


    为什么做好事比较难，做坏事比较容易？很简单，第一他不顾普遍性，第二他不顾可持续性。只要你顾及到普遍性和可持续性，所谓普遍性就是空间意义上的，在同一个时间里头这个逻辑是否可通行，所谓可持续性是一种时间上的普遍性，这两者说到底就是一个普遍性的问题，这个逻辑是否能够普遍适用。


    什么叫好的事情？就是我的行为叫具有普遍性，我在判断、我在决定做和不做这件事情的时候，我必须要考虑到这个事情的普遍性如何，这也就意味着做好的事情会有很多的约束。尽管你眼前没有约束，但是在一个更大的空间和一个更大的时间里头你是受到约束的，如果你事先考虑到这些约束，那么你的选项就会变少，很多眼下可操作方案你就要放弃，这样就意味着做好的事情就会比较难，做坏的事情就是由于他考虑的约束条件，所谓容易就是约束条件少，所谓困难就是约束条件多。


    我们记得好莱坞著名的那部电影《闻香识女人》最后那一段演讲，阿尔·帕西诺在最后的演讲里头说，在我人生的每一个关头其实我都明白什么是对的，什么是错的，但是我是差不多无一例外地选择了错的，为什么？因为做对的事情太难了。从另外一个侧面反映，做好事情的确是由于他的约束条件增多，你的选项变少而变得很难，但是是从另外一个意义上说，做更困难的事情也许更容易，做容易的事情也许更困难，这怎么讲呢？做困难的事情，你从一开始就选择了做困难的事情，实际上选择了一种普遍性的逻辑，你不至于在更大的空间和更大的时间里头暗中给自己设下了各种各样的障碍。


    Google公司的口号叫Don''t be evil，不要作恶，不要作恶表面上是堵死了自己的路子，实际上是让自己避免陷入到一个可怕的逻辑，这个逻辑是在其他的地方或者在未来呈现的。以谷歌为例，由于它聚集了那种容易挣，但是违反道德原则，也就是违反普遍性原则的那些钱，使得它从一开始选择了一种具有普遍性的逻辑。我们知道创新都是由于两个不可能性造成的，比如说你又要想产品好，你要想性能高，同时又要想价格低，这两者几乎是不可能的，你选择更高的技能你就可能要增加成本，你要选择更低的成本你就很可能降低你的性能，同时实现这两者就是一个不可能的使命。但创新恰恰就是完成不可能的使命，所谓创新有一个很简单的定义，就是在两种不可能之间有那个鸿沟上夹搭一座桥bridge，弥合这个鸿沟，那就叫创新。以谷歌为例，它不把广告内容放入它的搜索结果，这就是堵死了自己赚钱容易的钱、赚坏钱、赚恶钱的道路，那就不着它去找到一条既不违反原则，又要赚钱的路，那怎么办？他们就只能寻找一种技术，能够对搜索者的个人偏好有深度洞察的一种技术。你在输入每一个关键词的时候，尤其是把你历年来使用关键词收集起来、汇聚起来，同时根据特定的时间、时段来你搜的是什么关键词等等，这一类数据合起来，从这个数据里头挖掘出一种你自己都可能没有意识到的信息，它通过数据挖掘获得对每一个搜索者需求的洞察力，依据这种洞察力在内容搜索结果的右边放置跟你的这种需求相匹配的广告，这样就会大大增加你点击这个广告的可能性，它既没有干扰搜索结果，同时它也能赚到了钱。所以挣简单的钱、挣傻钱、挣恶钱会让自己越来越傻、越来越恶，当你拒绝赚傻钱、赚恶钱的时候，你只有一条路就是创新，能够找到那种不作恶也能赚钱的技术。谷歌选择这种方式，虽然是很困难，但是它凭着这样一种路径，它挣钱反而会越来越容易，当你选择那种作恶的方式挣钱的时候，你就从根本上丧失了创新的意愿和能力，也就是在一
    条低等级公路上，越来越差的道路上越走越走不下去，越走越艰难，所以做困难的事情有时候更容易。这是我们在创业的时候一定要记住的一条原则。'
