  md: '在《汤姆·索亚历险记》里头马克·吐温说过那句话，如果有人雇你在烈日炎炎下去收割庄稼，你会觉得非常难受，你会抱怨，不得已你去干活，你也会觉得太阳太晒了、工资太低了。但是他经常看到一些登山者，在那个烈日炎炎下登山，那个劳动强度一定比在田里头干活要大得多，最要命的是没人给你钱，你可能还得花钱。为什么那些人那么兴奋地去登山呢？只不过是他们为自己设定了另外一种需求，或者说自己的心理切换到了另外一个频道上。


    我们之所以觉得这个很停滞，实际上是因为我们没有意识到人性的多面性和他的弹性。我们如果仔细地观察自然的话，会发现自然界有很多的案例、很多的生物在颠覆我们刚性的概念。


    比如说海星，海星作为一个完整的生命体，它每一个尖角对这个生命体来说应该embre是刚性的，如果你要把那只角割掉，它会逐渐地恢复，长出一个角来，最有趣的是割掉的那个小角又成了一个小海星。有一本书叫《海星式组织》就说的是，有一种组织是极富弹性的，你越是去摧残它，不就就是在壮大他，你打击的过程就是在培养的过程。


    对反脆弱这个概念我们一点都不陌生，反脆弱里头一个很核心的观念就叫过度补偿机制。我们身体里头有一种过度补偿机制，当出现某种伤害或者匮乏的时候，我们的身体会自然启动一种补偿和修复的机制，从而让一个本来很脆弱的个体变得越来越强大。


    # 生物变性


    ![](img/f47a5fb2d99d8b2557309e5ada0c8e7e_113_0.png)


    我看《侏罗纪公园》的时候有一个细节我记得很清楚，侏罗纪公园里头这些科学家们出于安全的考虑，防止这些恐龙从自乱搞男女关系，导致侏罗纪公园里头恐龙的“人口爆炸”，最后对人类形成威胁，他们采取了一个其实是很残忍的、很不人道的、很不兽道的方法，就是这个公园里头所有的恐龙都是雌性，这就是说截断了它们自我繁殖的那条路。但是在电影里头有一个细节，当它们开始要造反的时候，有一只恐龙在干嘛呢？在变性，它能够在较短的时间从雌性变成雄性，这个种系就可以繁衍了。这可不是科学幻想，它是幻想，但也有科学的成分。


    在自然界里头有很多的生物都有变性的功能。我们经常常常听说的就是鱼，它有这个变性的功能，事实上这是一条生物学的规律，在一个种群里头，当性别的比例出现大的落差，多数派已经超过70%的时候，这个多数派里头就有一些个体<|message|>变性，来平衡这个种群的雌雄比例。


    最典型的变性动物有乌贼，有一种叫束带蛇，还有蝴蝶虫、小丑鱼等等，大家去查百度百科去。这些变性的动物在给我们讲一个道理，所谓的刚性，刚的不能再刚的这个性，连性别这种事情都是有得商量的，连吃饭这种事情都是有得商量的，食色性也，最基本的需求，这两样都是可以商量的，那还有什么东西不可以商量呢？


    自然界里头如果讲刚需，只有非常少的东西是刚需，比如说盐对于动物来说是刚需，不仅仅是对于人，我很晚才知道各种动物都有招数来获取盐。有些动物你以为它只是饮水，其实它能够区分两条河之间的含盐量的多少，它们会选择那个盐分大的水来喝。


    在东北养驯鹿的鄂伦春人，他们之所以能够让那些鹿非常的驯服，有一个很重要的手段就是时不时地给那些鹿喂带盐的草料，这是一个很强的刚需，因为有这个刚需它就离不开它的主人。经济学家经常会把盐和火葬场的价格作为价格刚性的例子来说，意思就是说这两种商品的价格是不太容易影响需求的，比如说盐降价了，你会不会去买更多的盐来吃，除非你信了那些鬼话，说是哪有核辐射，几年前有一个人买了1万斤的盐吗？我们不会因为降价就吃更多的盐，也不会因为盐涨价会吃更少的盐。正是由于盐的价格不太影响需求，可以说是一个高度刚性的产品，在很多国家盐都是由国家来专营的。火葬场的价格也是这样，不会因为火葬场降价了我们就多死几回，不会因为那个价格涨价了我们就少死几回，这个价格也是不影响人需求的。


    我们在日常生活当中，很多我们认为<|start|>rave是刚需的那些需求其实都是富有弹性的，这里头有一个因素在作怪，它不是一个纯粹经济的问题，其实是一个心理学的问题。当然今天的经济学已经引入了心理学的概念，比如说行为经济学就是这样，比如说买手机是不是刚需？汽车是不是刚需？当我们说手机是刚需的时候，我们可能会忘了人类在大部分时间里都是没有手机的，甚至连电话都没有。当你觉得车是刚需的时候，我们可以想想我们小的时候是怎么过的，我们的父母是怎么过的。还有农村里头贫穷的家庭，他们在过年的时候都要割几斤肉，都要请客，他们的孩子结婚也要大摆宴席，这背后是什么？


    背后是习俗，习俗或者说是共识会成为一种强大的因素来塑造我们的刚需，不是因爲它本身是刚需，而是因为这个习俗迫使你觉得没有这个就活不了了，但事实上没有这个你可能活得也笨或活得更好。


    我们自己可以给自己拉一个清单，梭罗说多余的钱只能用来做多余的事。我们今天有了很多多余的钱，我们做的都基本上是多余的事，真的不一定是满足自己的刚需，当然现代的经济繁荣其实是建立在大量的所谓刚需越来越多，不是因为需求而产生约产品，而是因为一个产品创造了需求，甚至是创造了刚性需求。由于市场已经成熟，对某种东西的消费已成为一种强大的习俗的时候，我们就觉得那是刚需了。我们不是说在批判这种现象，我们只是说很多的刚需只是一种表面的刚需，它里头包含着很大的弹性。


    这样一个观念对于自我管理还是公司的管理，可能都会有一点用处，我们不妨给自己列一个极简主义的清单，在什么样的条件下我没有那些东西也活得很不错，这不是在倡导过清教徒的生活，而是要我们意识到
    ey 有一个你可能还没有的需求也说算得上是一个刚需，那是什么？那是扫除力和删除力。如果Fibtex你没有这样一种扫除力和删除力的话，各种各样所谓的刚需就会来压迫你，尤其是那些伪刚需，会使你在消费的时候常常是超出你的支付能力之外，但是你不得不咬紧牙关去消费。


    有一个调查说某一款车的cfg三系车的车主幸福指数是比较低的，原因是什么呢？原因是购买这种车的人，他在买这个车的时候透露出一种心理倾向，就是超出自己的购买力，非得要硬着进入到某一个所谓的阶层上去，明明是更低的价格买到性价比很高的车，但是你是非得要用更高的价格买一个功能并不那么好，除了有一个那么品牌之外，芝麻可陈的一辆车，这种购买行为里头透露的这种心理倾向，其背后就是被所谓的刚需绑架。


