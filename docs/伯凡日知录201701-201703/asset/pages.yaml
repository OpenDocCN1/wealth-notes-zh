  md: '# 3.16 | “刚需”会不会是一个伪命题？


    # 3.16 | “刚需”会不会是...


    # —— 知识笔记 ——


    我们在讲互联网产品思维的时候经常会提到三个字，据说这个说法是周鸿祎同志发明的，衡量一个产品有没有市场，就要取决与客户对这个产品的诉求包含不包含三个要素：刚需、高频、痛点。


    刚需好像是一个最强的理由，没有刚需你这个产品就没有价值。所谓痛点其实是跟刚需相关的，因为有痛点所以才有刚需，没有刚需也不存在着所谓高频的问题，刚需在这里头是一个核心点。


    最近我在想一个问题，用现在流行的话说：刚需会不会是一个伪命题？


    这个可不是我自己突发奇想，其实薛兆丰教授初名声大振与他有一篇文章关系，就是说火车票需要涨价，这里头他就提到了这个问题。有人说火车票涨价以后民工过年就回不了家了，而回家是一个刚需，如果在这个时候涨价就有点耻人居危了，处于危险当中当然那个需求就是很刚性的了。每年春节回家是不是一个刚需？当我这样说的时候，我发现一种危险，我已经把自己置于人民公敌的位置了。


    我们不妨冷静地分析一下，我们很多认为是刚需的东西到底是不是刚需？


    我们就从最简单的事情说起，比如说吃饭，吃饭当然是刚需了，但是一天吃几顿饭，早、午、晚，我们现在形成习惯了，一日三餐，每一顿饭是不是刚需，我自己就有些感觉，我差不多有十多年的时间是不吃早饭的，早饭对我来说不是什么刚需。有时候特别累、特别忙的时候，甚至是忘了吃晚饭，真的是到那种废寝忘食的地步。终于能够睡觉的时候，突然感觉到有点饿，一想没有吃晚饭，那个时候我徒四壁，只有忍着了。后来我才发现咬饭这事儿从这件事情本身可能是个刚需，但是从细节上来看可能它就不是刚需。很长一段时间在农村里头都是吃两顿饭的，一日三餐是后来逐渐成为一个习俗的。


    现在有很多医学界认识，我说的不是中医，哪怕是西医都觉得，我们之所以到了时间就要吃饭，一方面是由于要补充能量，另一方面是因为他已经形成了一种习惯，或者说是一种轻度的上瘾。你觉得不吃这个饭会
    prak... 感觉有点恐慌，或者到了吃饭的时候你不吃饭，你总会觉得有点不自在、不舒服。


    BBC拍了一个片子讲断食跟节食如何跟健康密切相关，这个结论是由华盛顿医学院做出来的。


    他们在偶然的一次调查当中，发现在美国大饥荒时期有一个城市饥荒很严重，这个城市甚至饿死过人，当然饿死的只是少数，其他的人只是饿肚子而已。最后他们发现一个非常奇怪的现象，这个城市的平均寿命比其他地区的人高出了八岁，通过他们顾藤摸瓜做了大量的研究，得出了一个很确凿的结论，就是我们在摄取食物的时候，人体会分泌一种叫一型生长素的东西，它的主要功能就是让摄取的热量尽可能迅速和全面地转换成，让你的细胞更新、让你的器官保持生长。因为人类和其他动物一样，饥饿基本上是一种常态，当找到食物的时候要尽最大限度地利用这个食物，促进身体的生长，这当然是合理的，因为得来食物不容易。但是Bond一型生长素导致的研究...
    简介... 有了食物就赶紧生长，就像我们盖一个房子先盖出一个毛坯房。


    下一步怎么办呢？人体在饥饿的时候会分泌一种叫做二型生长素的东西，它是负责重新修复细胞和器官，让你的器官和细胞处于一个相对健康的状态，由于人类长期处于饥饿状态，吃完以后野蛮生长，有点带有粗制滥造意味的生长，以后你饥饿的时候二型生长素分泌出来，它就会来修复你的器官和细胞。


    所以对于人体来说，两种生长素都是必要的，可以说在那个食物不足的年月，人的营养是非常充分的，他不仅有一型生长素，而且能够大量地分泌二型生长素。人类进入不饿肚子的时代，实际上是很晚近的事情，对于我们中国人来说可能也就是三四十年的事情，那这个时候我们就可以不愁吃穿了，我们想吃什么就吃什么，我们想吃多少就吃多少，我们想什么时候吃就什么时候吃。可是人体的进化实际上是很慢的，身体这个时候不知道人类已经进入这个时代，反正你吃我就分泌一型生长素，你持续地吃我就不断地分泌这个生长素，这就让二型生长素没办法分泌，也就是说你的细胞和器官就一直是处于一种新常态，这个新常态就是粗制滥造而没办法修复的状态，长此以往你的身体就出大问题。


    所以他们给出一个结论就是，你要去掉至少五分之一的进食，比如说一日三餐一个星期就是21餐，能不能够去掉五分之一，也就是说四到五餐，这样你就给二型生长素的分泌提供了条件，这是有利于健康的。说得有点远，我只是想说明吃饭这事儿是不是刚需还真是一个问题，我们到时候不吃饭感到有点心虚、有点心慌、有点不自在，背后不是什么生理的原因，而是心理的原因。


    如果把这个逻辑往前推，我们还会得出一些结论，这些结论大家听起来可能不舒服，我的本意也并非如此，我们只是在说这个逻辑。


    你说什么是刚需？我们人有两条腿是不是刚需，人有两只眼睛是不是刚需，我们经常说我们要像爱护眼睛一样的爱护什么东西，眼睛对我们来说绝对是刚需，真的是如此吗？难道人的身体就一点弹性都没有吗？如果有一只眼睛不幸失明，你就活不了吗？甚至是双目失明你就活不了吗？在战争和灾难当中失去了一条腿你就活不了吗？甚至失去了两条腿你就活不了吗？你会顽强地活下去，而且可能还活出精彩来。这样的说法起来很反动，我只是在说这个逻辑。


    有一个著名的澳大利亚的高尔夫运动员，他就是没有双腿的，他能打出非常精彩的高尔夫球，大家想一想都是匪夷所思的事情，没有双腿的人怎么打高尔夫球。说到这些例子，我只是想说明一件事，就是所谓需求的刚性在很多时候，它其实是有弹性的，尽管这种弹性往往意味着对我们常识的冒犯。


    丹麦有个哲学家叫克尔凯郭尔，他有一句话我印象很深，他说人对于那种小的麻烦、困扰常常会抱怨，但如果是一场灾难降临的时候，人反而没什么话说了。


    你会抱怨这屋子的空调不制冷，说这个房子不隔音，窗户开关起来很费劲等等。如果有一天突然来一个地震的话，我们反而是憋了、服了，不抱怨什么了。


    这是一种什么样的心理机制呢？其实用我们刚才的话说，它是打破了一个所谓刚需的幻象，你觉得空调制冷是刚需，其实不一定是刚需，你没有体验过风餐露宿之前你想都害怕，想想都很不幸福。你换一个角度去看问题，你想索尔紊，贝克实际上在做一件什么事情？他就在挑战所谓刚需观念，在最极端情况下人如何还能活得下来，而且最有意思的是，当豪宅、锦衣玉食不存在的时候，只要你有勇气和能力，你不仅能活下去，而且还活得有点精彩。'
