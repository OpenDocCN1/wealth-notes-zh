  md: '# 1.23 | Leadership’s Dilemma


    # 1.23 | Leadership’s Dilemma


    # —— Knowledge Note ——


    Last week a student from the parent-teacher association came to see me in a hurry,
    saying that no matter how busy the teacher is, you must see me, I have encountered
    a particularly big matter, I want to hear your opinion. After she came she talked
    to me and started crying, she is a very typical strong woman, doing things with
    courage and daring, but she is actually crying now.


    ![](img/f47a5fb2d99d8b2557309e5ada0c8e7e_31_0.png)


    The matter is like this, her company is preparing to go public, and the development
    seems very smooth, but recently there was a big change in the company. Several
    senior managers who have been with her for a long time asked her for resignation.
    She was completely unprepared, because these people have been with her for almost
    ten years, to propose resignation at this critical moment, on one hand it will
    affect the company’s performance, on the other hand it will cover up her cognition,
    she starts to doubt life.


    In fact the direct reason is because this company is going to go public, so it
    must introduce some heterogeneous talents, change from the original small workshop,
    family-style way of working to a team-style, standardized organization and process
    company. And once introduced, it must be used immediately, in many matters it
    must rely on them, these people who started the business with her immediately
    feel a threat, or can be said to be jealous. Jealousy has one, a relatively authoritative
    explanation is the anxiety about unstable status, they have all fallen into this
    anxiety. And with this anxiety to observe phenomena, they will feel more firmly
    that you want to abandon us, you rely on the new people, without us your company
    could not get to today, you are crossing the river and tearing down the bridge,
    ingratitude etc etc, all kinds of words are flipping in their minds.


    But she feels particularly lonely, because she introduced these people to let
    the company go public smoothly, after going public these people who started the
    business with her can get benefits, so she is actually doing it for them, but
    they interpret it as she is harming them, abandoning them. She feels these people
    leave her, in a sense she can find replacements, even better people, but she feels
    being defined by her old subordinates as such a person she can’t bear. In their
    eyes she has been defined as a Zhu Yuanzhang type of person. Zhu Yuanzhang doesn’t
    have a famous saying? ''Yours is mine, mine is still mine.'' She cannot accept
    such a definition.


    # The predicament of a leader


    ![](img/f47a5fb2d99d8b2557309e5ada0c8e7e_31_1.png)


    As a leader, your motive, understanding, vision must be higher than others, you
    have to stand higher and see farther, you cannot be like your subordinates, because
    some things limited by their various aspects you can’t see, you have to see.


    At the same time, you cannot go too far, leaving everyone behind. Because at this
    time you actually become a light pole commander, although the company is still
    your company, the team is still your team, in this situation doing things will
    draw a clear boundary between your interests, your rights and their interests
    and rights.


    They will feel this company is yours, not ours, usually the situation is working
    without effort, in that messy, embezzle power, wait until this company goes public
    we will collectively leave, many companies once go public show collective escape,
    this happens a lot. Besides saying it is to retaliate against someone, there is
    another important reason because they no longer recognize the original leader.


    You must be very different from everyone, at the same time you must always stand
    with them, let them feel you are part of them. You not only have to stand higher,
    walk faster than others, but you also have to in a way stand lower than others,
    walk slower than others, let everyone feel the company cannot do without themselves,
    themselves are of great importance.


    As a leader one very important work is to avoid others feeling you are of great
    importance in the company, you have to let every person feel they are of great
    importance, only then can you form a team.


    ![](img/f47a5fb2d99d8b2557309e5ada0c8e7e_31_2.png)


    This problem is actually an ancient problem, our Confucius said early: ''The people
    can be made to follow, but they cannot be made to understand.''


    Ordinary people you let them do what they do, you have no time, no energy, and
    no need to go with them to reason about facts, say why I have to do this, what
    I do is actually for what. When you want to explain clearly the time is already
    cold, in fact you cannot explain clearly, because the world we are in is a world
    that cannot be fast-forwarded, we live not watching a film, I see this place is
    tired, see something a bit comforting, I fast-forward to that ending to see, then
    clearly know what happens, if each person could fast-forward to the ending, it
    is very easy to reach consensus.


    Li Chuanren says if a person is not living from 1 year old to 80 years old, but
    from 80 years old to 1 year old, then two thirds of people can become saints,
    everyone can become Zhu Xiaogang, but only very few people are truly Zhu Xiaogang,
    that is pre-cognitive Zhu Xiaogang. This is as a leader the dilemma you face moment
    by moment, you must know before you know, you must go ahead of everyone, you must
    be authoritative and credible, shout and respond, but on the other hand you also
    have to let everyone feel you are part of them, once you separate from them it
    is extremely dangerous.


    # Being a leader and being parents


    The predicament of leadership, being parents also have deep experience. All your
    efforts, all your care are for the child, but the child does not think so. In
    the child’s eyes you are a self-righteous, high and mighty person, always imposing
    your will on our heads, you are a self-centered narcissist, with no real ability,
    always wanting to realize your past regrets on us, this shared understanding is
    hard to achieve.


    If you only feel you are better than your child, you are not a qualified parent,
    you must not only be better than your child, compared with your child you have
    walked more roads, you have eaten more salt than the child, but you must let your
    child know you are together.


    In the child’s view you are important, but we are also important, even we are
    more important than you, only fathers and mothers who are aware of this and can
    achieve it are truly qualified parents.


    You have to be higher than others, and also lower than others, you have to walk
    in front of others, and also mingle in the ranks of others, and form a piece with
    the masses, this is actually easy to say but very difficult to do.


    # —— Extended Thinking ——


    Why do all leaders always face such a dilemma, and must solve this dilemma?


