    所谓仪式感就是制造一种场景、制造一种氛围，软性强制地去凝视、去关注你眼前的看到的这个东西。这种凝视和关注会激发出一种独特的体验，这种体验在你心不在焉的时候你是体验不到的。


    有很多产品的广告里头都有这种增加神秘感和仪式感的手法，一个化妆品很难说有什么高科技，它加了很多你听不懂，它也没想让你听懂，它就是想让你听不懂的那些广告词。这种化妆品里头富含多种养
    生因子。谁知道什么叫养生因子？但是这几个字就会让你对它有一种神秘感和敬畏感。这种敬畏感又会激发出你对这个产品的好感。


    人的观念是很 容易改变我们的感受的，有没有明显的先入之见，感受事物的方式就会有明显的不同。


