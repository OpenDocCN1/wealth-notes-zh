    吴伯凡


    这个问题看上去很简单，但答案可能是相当复杂的，我尝试回答一下。首先我们要区别省钱、节俭与苛 嗇有什么不同，应该说苛嗇是一种非理性的节俭，为节俭而节俭，没有意义、没有目的的节俭，它是一种心理癖好、一种情绪。人一旦被这样的情绪所纠
    缠的话就会身不由己，难以自拔，被这种非理性的节俭习惯所控制的人，一方面他做事的时候会出现惊人的浪费，或者说他实际上浪费的资源相当大，但却在某些局部性、细节性上不遗余力的节省，做那种没有意义的节俭。'
