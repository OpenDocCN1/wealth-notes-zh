    我读过一篇文字，是一个父亲写的，他在这篇文章里表达的就是，教育孩子是一件极其复杂的事情，它的难度远远超出了我们的想象。他举了一个例子，有一天他在家里头忙工作上的事儿，事情很紧急，可是小孩子在屋子里头闹，时不时还要过来问这问那，弄得他心神不宁。这个时候做父母的往往最直接的反应就是，你安静点行不行，你滚一边去。之所以父母很可能说这句话，是因为他们不知道他们跟孩子之间的权利边界在哪里，他们已经无意识地认可了一个前提，那就是孩子是我的，我是他有支配权，当他不听话的时候我是可以教训他的。很多父母对孩子所谓的教育不过就是教训，甚至教训都不是，而是斥责，如果他们意识不到这一点的話，这样所谓的教育累积起来就会逐渐地在孩子的内心形成一种巨大的负能量。一旦到他的自我意识觉醒的时候，这些负能量就会总爆发，所以所谓孩子到了叛逆期，不过是随着孩子的自我意识的觉醒，积聚在他心中的负能量在那个时间段集中地爆发出来。


    所以古代辅佐少主、做皇帝老师的人往往没有好下场。像张居正这样的，他觉得他是在教育小皇帝，但其实是在不断地给小皇帝心里头注入巨大的负能量。所以一旦他亲政的时候也就是到了秋后算账的时候。我们的孩子不能亲政，但是他有叛逆的权利。所以当孩子在屋子里头闹腾，在不断地骚扰他的时候，他告诉自己，我一定不能够教训他，而是要教育他，而教育要有效，必须要以一种恰当的方式。所以他就于脆停下来对孩子说，对他的儿子说，我给你讲一个故事，你还记得去年爸爸给你买了一辆小汽车吗？小孩子点点头，那是你特别想得到的小汽车，可是那天我回来的时候你已经睡着了，我当时没有叫醒你，而是把这辆小汽车放在你的床头，第二天早晨你醒来的时候你特别的高兴。你知道爸爸当时为什么没有叫醒你，把这辆你最喜欢的小汽车给你呢？小孩子有点茫然，他告诉他，是因为你在睡觉，因为我不能打扰你睡觉，虽然这辆小汽车是你最喜欢的，但是我不能打扰你睡觉。


