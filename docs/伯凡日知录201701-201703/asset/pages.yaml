  md: '岁月无声：心里一直有个问题，可能跟今天伯凡老师讲的有点不相干，今天憋不住了，就是如何永远让自己处于一种弱势的状态，而让别人显得更高明，但又不是真正的弱势？


    # 吴伯凡


    其实我们以前讲到过，关于这个问题我们以前也讲到过好几次了，我现在可以从另外一个角度补充一下。


    民间的说法是人善人欺天不欺，人恶人怕天不怕，《道德经》有一句话叫天道无亲，唯与善人，老天他是没有亲戚的，他不会偏向于任何一个人，偶尔你觉得这个人幸运，他是有各种各样的原因，但是这种原因，这祥一种态势是不可能持续的，因为老天不会去偏爱任何一个人。大自然或者说整个生态系统，它唯一的目的就是要维持整个系统的运行，而不是让哪一个个体在其中显得多么优势，尤其是有些物种显得过于优势以后，它忘记了老天的这个特性，天地不仁，以万物为刍狗，天道无亲，他忘记了这一点，所以以为这是老天对自己的眷顾，是对自己的福佑，但是又很可能是一个巨大的诅咒。


    恐龙就是受到了这样的诅咒。恐龙最后灭绝有个很重要的原因是，它几乎到了包打天下的地步，表面上是个善的循环，其实是个恶的循环，它的体型越大，它的食物就越丰富，只要它能看见的，它就能够抓住。像那种霸王龙又凶猛，体型又大，同时它还跑得很快，看起来老天对它多眷顾，但是捕捉的食物，它的粮食来源越丰富的时候它的体型就会越来越大，这是一个总的规律。要不像大象，大象虽然选择的是食物链的低端，它吃的是植物，但是由于这个食物的供给很丰富，使得它的体型就很大，如果它选择食物链的高端它就活不下去。


    我们讲熊的时候提到过这样一个观点，就是食物越丰富你的体型越大，反过来你的体型越大就要求你的食物供给就越丰富。如果按照这个逻辑一直往上走的话，一个物种它的体型就会越来越大，越来越大的结果实际上是把自己越来越置于一个高危的境地，一旦有一天环境发生变化，那些作为你食物的物种减少的时候，那你就只有一条路——饿死。所以恐龙就是因为它过于强大，导致大量的危机在它没有意识到的时候产生，比如说它的神经系统变得反应特别迟钝，因为它太强大了，它不需要反应特别敏捷就可以活下来。它的体型会越来越大，它每天要要求的食物供给越来越大，这些都是巨大的系统性风险，一旦环境发生变化，系统受到破坏的时候，那它就没有活路了。


    最好的状态就是始终处于弱势，又不是真的弱势，佛教说躺着的人是打不倒的，卧佛是最高的境界。这一点上我们还是应该向熊学习，那个熊是一个不把自己定位于一个食物链高端
    мощностью，能屈能伸，能动能静，实在找不到东西吃就去光秃地冬眠，很弱势，但是它其实又是一种很强大的动物，大熊其实什么动物都是怕它的，它之所以能够获得这种优势，是跟它习惯性的处于弱势，它能够做到像温州老板那样，白天做老板晚上睡地板，要想人前鲜就得背后受罪。熊其实受过很多罪的，它不像狼、不像老虎，它是始终让自己处于一个高大上的位置上头。


    在讲领导力的书里头，在讲销售的书里头都有一个原则，就是努力地表现出你不拥有权利的样子。你作为一个领导者对小人不难于严，而难于不恶，也就是对那个比你地位低的人，你对他严格不难，你要对他不恶、不凶恶那是很难的。不凶恶实际上是要暂时放弃你的优势，至少是不彰显你的优势，对于君子不难于恭，而难于有礼，对位置比你高的人你做到恭敬是很简单的，但是你要做到有尊严的恭敬那是很难的。


    这里头有一个关键概念就是，英文当中叫take no advantage，就是不占用、不彰显、不使用、不占有自己的优势，你要形成这样一种习惯，当你获得优势的时候不去彰显、不去滥用这种优势。大家还挺比较具体、生动地理解这句话，理解如何不彰显优势，就可以去阅读《红楼梦》，比较一下林黛玉和薛宝钗之间的差别，再比较一下薛宝钗跟王熙凤之间的差别。你能耐得住贫贱、守得住繁华，在繁华和贫贱之间游刃有余，也就是说让自己对于环境，对某一单一环境的依赖度降低。当你对单一环境的依赖度降低，也就意味着对多环境的适应性，而对多环境的适应性就能够避免你的优势发生断Compatibility。


    张少天：伯凡老师，请问一下发现漏洞并利用这个漏洞是推动这个系统向前发展的动力吗？或者是毁灭这个系统的源头？


    # 吴伯凡


    也不一定是要摧毁，也不是一定要发展，它是要应用这样一个漏洞来让自己获得一个巨大的杠杆。所以杠杆就是极大地放大原有的资源在这个市场上获利。


    讲一个历史上的例子，比如说秦朝，最近《大秦帝国》这个电视剧很火。这个大秦帝国的历史很有意思，它从一个非常边缘的小部落慢慢地成长，成长了500年最后才成就是帝业，从坐上老大的位置到灭亡用了14年的时间。经常会说秦朝的系统就是迅速崩溃，它怎么会那么快的崩溃？我们知道秦朝的法律是非
    常严的，秦始皇做了很多很多的风险防范措施，他把全国的金属，除了必须的农具之外，这个金属全部收集起来，在咸阳铸成十二金人，也就是说百姓制造武器的原材料都没有了，这应该说做的风险防范是极严密的、很严格的。同时通过焚书坑儒，一个个柱子、一个个箍子他牢牢地握在手里头，有了这两样风险应说降到了最低。但是他有一个特别大的，自己没有意识到的系统漏洞，就是秦朝的法律，秦朝的法律原来只是管一个小国家的，一个疆域只相当于跟一个陕西省差不了这么一个小国家的，用来管理整个国家的时候，它会出现了一个他完全没有意识到的漏洞，那就是什么？比如说一个小小的规定，规定你几天之内必须到边关去戍边、去修长城，这个在秦国那个气候相对比较稳定，疆域也不大的情况下，发生的意外几率是比较低的，所以它的法律很严格也不碍事，不仅不碍事，而且有很正面的作用，那就是令行禁止，通过这种严苛的法律使得秦国的执行力非常强。


    但是这样一个规定一旦放到整个国家的疆域里头，陈胜吴广在南方、在安徽这一带，他们要去戍边的话，要到今天的北京这一带来执行任务，我们知道到一个地方去如果近，你堵车的可能性就会小，如果那个路途遥远，不仅是路途本身需要的时间长，而且它发生堵车、发生意外的可能性就会增加。这个可能性，增加的可能是数倍的增加，尤其是到了夏天的时候，天气变化无常，这个时候就会很容易出现意外。搁在陈胜吴广面前的说
    желудо 两个选择，其实只有一个选择了，你去你时间错了，大水把道路冲断了，你走不了，你赶过去是死，你揭竿而起也可能死，也可能活，而且这种现象比较普遍，有很多类似的小案例都在发生。这样一个小小的系统漏洞，这个规定本来是出于要让系统非常严密的，这么一个规定，恰恰就是秦朝在很短的时间，在各地出现那种揭竿而起的案例，表面上是由一个事件引起的，实际上是这个系统里头很容易出现这样的黑天鹅。而且一个黑天鹅出现，就意味着有很多的黑天鹅同时出现，黑天鹅满天飞，辛辛苦苦奋斗500年，14年的时间一下子就崩溃了，这就是一个小小的，没有被设计者，具有强烈的风险防范意识的设计者忽略的一个小漏洞导致系统的瞬间崩溃。


