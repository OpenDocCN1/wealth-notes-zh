    王熙凤显然是无我主义的对立面，她是极端有我的一个领导者，她能力非常的强，做事情非常的勇猛精进，但是她却是一个不祥之兆。后来，包括贾母在内的贾府所有的人都在操心一件事情，谁将会成为贾府的那个具有无我主义特点的真正的女主人。


    林黛玉是另外一种极端的有我主义者。与林黛玉相反，薛宝钗才是一个真正的无我主义者，用贾母的话说：“耐得住贫贱，守得住繁华的女人。”而贾府的悲剧就在于，家族的命运被王熙凤这样一个极端的有我主义者不知不觉的引向了毁灭的深渊，而真正能够担当贾府的隐性领导力或隐英雄的薛宝钗还没来得及成为贾府的操作系统，这个家族就�Deploy
