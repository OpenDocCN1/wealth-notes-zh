    # MACD 实战操盘用法研究


    越均线，穿越均线后，回踩均线。均线发生支撑作用，股价拐弯向上，发动一波新的拉升。跌势是类似的。


    +   1. 均线从下降逐渐走平且略向上方抬头，而股价从均线下方向上方突破，为买进信号。 2. 股价位于均线之上运行，回档时未跌破均线后又再度上升时为买进时机。
    3. 股价位于均线之上运行，回档时跌破均线，但短期均线继续呈上升趋势，此时为买进时机。 4. 股价位于均线以下运行，突然暴跌，距离均线太远，极有可能向均线靠近（物极必反，下跌反弹），此时为买进时机。
    5. 股价位于均线之上运行，连续数日大涨，离均线愈来愈远，说明近期内购买股票者获利丰厚，随时都会产生获利回吐的卖压，应暂时卖出持股。 6. 均线从上升逐渐走平，而股价从均线上方向下跌破均线时说明卖压渐重，应卖出所持股票。
    7. 股价位于均线下方运行，反弹时未突破均线，且均线跌势减缓，趋于水平后又出现下跌趋势，此时为卖出时机。 8. 股价反弹后在均线上方徘徊，而均线却继续下跌，宜卖出所持股票。


