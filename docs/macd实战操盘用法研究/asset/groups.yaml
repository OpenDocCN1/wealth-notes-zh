    跑了吗？一个跌势的品种，一两个反弹，一两次指标的背离，你就能轻易下多单吗？趋势的惯性是如此之强大，如大海波涛汹涌不绝，然而你感受到了吗？相反你却担心海涛会停止下来，岂不可悲？一个涨势很好的品种，你的多单已经获利，一两次回调，一两次指标顶背离，你就能轻易出场吗？你就会被吓得狼狈逃窜吗？一个身体健壮的人要病死，需要一段时间的，他需要先身体从强壮变得正常，再变得虚弱，再慢慢病死，而这绝不是短时期能完成的。因此市场必然有一个顶部和底部，顶部和底部的构造都需要一点时间，至少是两周的时间。你有足够的时间顶部多单获利走人，底部空单获利走人。你有足够的时间在顶部下空单，在底部下多单。你既然已经有了顺势的单子，何必一遇风吹草动就立马逃之夭夭？说你看着一两次反弹或回调就下了逆势单，可能就会大赔。对那些不懂指标背离的投资者来说，利用指标背离判断趋势转势下逆势单，是非常有害的。


    ### （三）即使趋势末期也绝不轻易下逆势单


    跌势中的任何一次抄底行为都是下逆势单，涨势中的任何一次下空单行为都是下逆势单。我们一定要坚信趋势惯性，绝不轻易下逆势单。我的建议是，绝不下逆势单。在趋势即将转势的时候，宁可空单观望，等新趋势走出来后，在下顺新趋势的单子，绝对不下逆势单。


    也就是即使在一个跌势的末期，我们仍不可下多单，在跌势末期，它的趋势也是跌势，后市跌的可能性仍很大，我们下多单往往会赔；一个涨势末期我们不可下空单，在涨势末期，它的趋势也是涨势，后市涨的可能性仍很大，我们下空单往往会赔。


    ## 2.2.2 如何利用均线辨识市场趋势


    ### （一）利用均线辨识趋势的方向


    最简单的看趋势的方法，是研判均线的方向。如果均线的方向是向上，则你可以认为趋势是向上的，就可以下多单。如果均线的方向是向下的，则你可以认为趋势是向下的，你可以下空单。


    至于选择哪根均线，不同的人有不同的选择。短线交易者选择的可能是20日均线。20日均线号称月线，它的方向一旦走出来一般至少要走1～2个月才会停止的。20日均线方向向上则一直做多；方向向下，则一直做空。20日均线基本水平，没方向，则观望，不做单。


    中线交易者可能选择的是 60 日均线。60 日均线号称季线，它的方向一旦走出来，一般是要走 3～6 个月才会停止的。60 日均线方向向上则一直做多；方向向下，则一直做空。60
    日均线基本水平，没方向，则观望，不做单。


    长线交易者可能选择的是 120 日均线。120 日均线号称半年线，它的方向一旦走出来，一般是要走 1 年到 1 年半才会停止的。120 日均线方向向上则一直做多；方向向下，则一直做空。120
    日均线基本水平，没方向，则观望，不做单。


    200 日均线是葛兰威八大均线法则采用的均线，240 或 250 日均线是年线。200 日均线、240 日均线、250 日均线都可以看成年线，实际上起辅助研判作用，等着这些均线拐弯，价格早就转势很久了。这些均线，辅助作用大，实际交易作用就小了一些。


    至于 5 日均线，即周线，10 日均线，即半月线，这是短期的投机交易采用的均线。一般站在 5 日均线上走的股票是非常强势的股，站在 10 日均线上走的股，是强势股。这些短期投机交易者，一般看到价格站在
    5 日均线上就考虑做多，价格站稳 5 日均线则进入，有效跌破 10 日均线则出场。


    一般来说，股市做短线是看 20 日均线，做波段的是看 60 日均线，做长线的是看 120 日均线。期货做短线的是看 5 日 10 日均线，做波段的是看 20
    日均线，做长线的是看 60 日均线。


    如果 20 日均线拐弯一定要注意趋势可能有变；60 日均线拐弯趋势不变也至少是个极大的回调或反弹；120 日均线拐弯则一般是转势或至少是个长达 1 年左右的超级回调或超级反弹。


    60 日均线金叉 120 日均线，两线之间的距离，可以称之为暖气带，股价回落到该区域一般会继续上涨，有效站在暖气带上可以做多，可以安心持有多单。60 日均线死叉
    120 日均线，两线之间的距离，可以称之为冷气带，股价回落到该区域一般会继续下跌，有效在暖气带下可以做空，可以安心持有空单。


    ### （二）利用均线系统如何精确研判趋势转势


    均线的趋势转势动作的口诀是一靠、二出头、三穿越、四回踩、五拉升。一个跌势末期，趋势要想转势，股价必须先靠均线，也就是碰到均线股价拐弯向下。然后再有反弹时候刚过均线出点头，就无力站到均线上，立刻下跌，不能有效突破均线就跌下来。然后是再次反弹有效穿越均线，穿越均线后，回踩均线。均线发生支撑作用，股价拐弯向上，发动一波新的拉升。跌势是类似的。


    - 1. 均线从下降逐渐走平且略向上方抬头，而股价从均线下方向上方突破，为买进信号。

    - 2. 股价位于均线之上运行，回档时未跌破均线后又再度上升时为买进时机。

    - 3. 股价位于均线之上运行，回档时跌破均线，但短期均线继续呈上升趋势，此时为买进时机。

    - 4. 股价位于均线以下运行，突然暴跌，距离均线太远，极有可能向均线靠近（物极必反，下跌反弹），此时为买进时机。

    - 5. 股价位于均线之上运行，连续数日大涨，离均线愈来愈远，说明近期内购买股票者获利丰厚，随时都会产生获利回吐的卖压，应暂时卖出持股。

    - 6. 均线从上升逐渐走平，而股价从均线上方向下跌破均线时说明卖压渐重，应卖出所持股票。

    - 7. 股价位于均线下方运行，反弹时未突破均线，且均线跌势减缓，趋于水平后又出现下跌趋势，此时为卖出时机。

    - 8. 股价反弹后在均线上方徘徊，而均线却继续下跌，宜卖出所持股票。


    以上八大法则中第三条和第八条不易掌握，具体运用时风险较大，在未熟练掌握均线的使用法则前可以考虑放弃使用。


    第四条和第五条没有明确股价距离均线多远时才是买卖时机，可以参照乖离率来解决。


    ## 2. 2. 3 葛兰威尔均线法则精解


    谈到股票价格的移动平均线的分析方法，我们就不得不重点提到著名的葛兰威尔移动平均线八大法则，葛兰威尔法则在中外证券市场中可谓是无人不知无人不晓，葛氏八大法则是美国著名的证券市场技术分析大师葛兰威尔先生在
    20 世纪 60 年代所著的名为《每日股票市场获最大利益之战略》一书中所运用的测市法则，依据此八大法则可以帮助我们来判断股票的最佳买卖时机，寻找最佳的买卖点。


    葛兰威尔的移动平均线的八大法则是以股票价格与移动平均线之间的关系，作为判断买卖点的依据，共有八个买卖信号点，故称之为葛兰威尔移动平均线的八大法则。具体说是由四个买进点和四个卖出点组成，现分别叙述如下：


    A 点（买进点）。

    定义：当移动平均线从下降状态逐渐走平，而股票价格从移动平均线的下方向上突破移动平均线时，是投资者买进股票的信号。

    解释：移动平均线从下降状态逐渐走平时，表示在较长的时间内，股价趋势已经从下跌趋势中逐渐止跌回稳，即移动平均线出现止跌转平的趋势，进而有可能出现转势回升的趋势。由于股票价格的移动平均线的走势比当日股票价格的走势缓慢得多，并且具有时滞性，因此若移动平均线出现止跌转平的现象，或移动平均线进而可能出现转势回升的趋势，而移动平均线一旦确立上涨趋势则往往要沿此趋势运行一段时间和空间，相应的股票价格的涨幅将远超过移动平均线的涨幅，所以此时股票就有买入的意义与相当的获利空间。当股票价格从移动平均线的下方向上突破移动平均线，则显示当前的股票价格已脱离原先的移动平均线助跌反压的作用，意味着空方与多方的力量发生了转变。若随后移动平均线也反转回升，则这段期间中的买方居于主动地位，则相对居于劣势。这时，是股票价格从低档盘整完毕，开始进入上升阶段的时期。所以可以按此信号买入股票，等待获利。

    较长期的移动平均线从下降状态逐渐走平后，此时股票价格从移动平均线的下方向上突破。在我国的股票市场上往往意味着两种市场现象：第一意味着股票卖压穷尽，由于普通投资者套牢的股票亏损严重，已经没有割肉的动力了。第二意味着有庄家在低位进行吸货或高位套牢者有低位摊薄买入的行为。随后对股票走势的判断要结合盘面与成交量进行具体分析，才可辨别是否有一段可观的升势。


    B 点（买进点）。

    定义：股票价格连续上升并远离移动平均线后，随着时间的推移，此时移动平均线也开始上升，此时股票价格突然下跌，但并未跌破上升的移动平均线。股票价格又再度上升时，此时投资者可以大量买进，这是投资者买进股票最安全、赢利可能性最大的买点。

    解释：股票价格连续上升并远离移动平均线后而又回跌至上升的移动平均线附近时，此时处于上升趋势的移动平均线将会对股票价格产生助涨的作用。使股票价格在快速下跌之后立即弹升，与移动平均线形成相辅相成的上升局面。股票价格由于连续上升而远离移动平均线，也就是说在移动平均线的参数设定天数中的投资者的股票平均都有获利，并且获利不菲，随着移动平均线的上升，股票持有者的成本也在不断上升。此时就产生了下面的情况：


    - 1. 低位买入者有了获利，自然产生获利了结的意愿。

    - 2. 前期套牢的投资者对这次的股票价格上涨，有解套出局的欲望。

    - 3. 看好该股的投资者由于此股票短期上涨太快，价格相对过去高了，所以追涨买入的欲望减弱。


    这些都是不利于多方的因素，所以空方借机发挥，造成股票价格下跌。但此股票的上升却是不可阻挡的（或许因为股票的基本面有了大的改观，或许庄家进场吸纳等不明因素），下跌只是空方的小反击，是为了以后更好的上升，所以是最
    佳的股票买入点，赢利的可能性极大，往往投资者在 A 点不容易及时发现股票就要上涨，容易错过买入时机，而此时的 B 点就是逢低承接的好机会，也是投资者在看好该股票中长期上升行情后加码买入的良机。


    ### MACD 实战操作盘用法研究


    C 点（卖出点）。

    定义：股票价格急速上升远离移动平均线时，将可能出现短期的回跌，使得股票价格产生再度趋向移动平均线的趋势，这是一种卖出股票的信号。


    解释：股票价格在进入上升趋势后，原来的股票价格与移动平均线的上升趋势比较平缓，股票价格与移动平均线保持适当的距离并行上升，当由于消息面的影响或关注该股票并买入的投资者剧增，或主力庄家的拉升动作等，股票价格从缓升进入暴涨阶段，使得此时股票价格远离移动平均线。此时持股者短期利润随着股票价格的暴涨而大幅增加，此时持有该股票的投资者卖出的欲望强烈，而未买入的投资者由于股票价格上涨大多，买入的欲望也逐步降低，由此则会产生获利回吐的短期巨大压力，投资者为了防止股票价格的短期到顶或因其他因素影响而演变为中期到顶，则此时不妨可以短期获利卖出。


    D 点（买进点）。

    定义：股票价格经过大幅上升而又回落，虽然暂时迅速向下 跌破移动平均线，但移动平均线仍在上升，且股票价格不就马上又回到移动平均线之上，并继续上升，这时仍是买入信号。


    解释：股票价格跌破移动平均线，而移动平均线仍然继续上升。这种情况是由于股票价格连续快速上升，造成获利回吐，股价快速回跌，短时间跌破移动平均线，但跌幅并不深，股价又快速拉起，并再次形成股票价格与移动平均线继续同步上升。这时也是一个较好的买入点，但普通投资者对该点的判断应首先明确不是主力彻底出货，只是短期获利回吐的巨大压力所造成的。


    E 点（卖出点）。

    定义：移动平均线从上升转为走平，而股票价格从移动平均线的上方向下跌破移动平均线时，随后移动平均线也转向下跌，此时是投资者卖出股票的最佳时机。


    解释：经过股票价格的持续上升后，股票到达高位区，在某一区域盘整，这时移动平均线上升的幅度与速度都减缓，但移动平均线是很难在短时间内迅速改变其运行方向的，移动平均线在形态上表现为类似抛物线顶端的图形，有上升趋势即将转弱的迹象，这表明多方在此区域受到强力阻击，空方的力量逐步强大，此时是很危险的时刻，假若此时股票价格向下跌破由上升转为走平的移动平均线，从而使得移动平均线的走势反转向下，这时就是一个卖出信号，标志着移动平均线的趋势转变，由于移动平均线的趋势改变后，往往会沿着下跌趋势运行一段时间和空间，再加上这段时间与空间的不可预测性，所以投资者此时应该卖出股票观望，而股票价格跌破移动平均线就是持有股票的投资者获利了结或止损卖出股票的信号。


    F 点（买入点）。

    定义：股票价格跌破移动平均线后，如若发生暴跌，股票价格远离移动平均线，这时股票价格就可能发生反弹，令股票价格再度向移动平均线靠近，这时就会出现一个股票买入点。


    解释：股票价格在短线止损卖盘和长线投资者获利了结的双重卖压下，股票价格急剧下跌，这时在移动平均线参数天内的股票持有者大多数为亏损，但随着跌幅的加大，继续杀跌的动能会明显减弱，而抄底的投机客与高位套牢后在低位摊薄成本的买方力量会逐步增加，自然会出现股票价格的反弹回升。对于这样的上涨行情市场人士称之为反弹行情，因为这只是股票价格暴跌之后出现的回升修复行情，通常是急促而又短暂的，只是回补一时跌过头的行情而已，并不是真正的上升行情。普通投资者如果没有足够多的市场经验时，参与这样的反弹行情要十分小心。


    G 点（卖出点）。

    定义：股票价格跌到平均线之下，若移动平均线也开始转为下降趋势，此时股票价格会由于太远离移动平均线，而发生反弹，股票价格回升并向移动平均线靠拢，但未有效突破移动平均线即又告回落，此时出现卖点。


    解释：由于股票价格跌破移动平均线，移动平均线也转为下降趋势，此时表示在一段时间内，所持有股票的投资者都是亏损的，由于股票趋势已经转坏，则股票上涨所遇到的解套压力极大，此时而发生的反弹，并不是股票价格的再次上升行情，所以在股票价格反弹至移动平均线附近时，出现卖点，是投资者为了避免扩大损失的卖出时机。


    H 点（卖出点）。

    定义：移动平均线一直呈下降趋势，股票价格虽然一时上升突破移动平均线，但由于没有成交量的有效配合，股票价格随即又向下跌破移动平均线，而移动平均线则继续呈下降趋势，是卖出信号。


    解释：移动平均线转为明显的下跌趋势后，则此下跌趋势不容易改变，也就是套牢了许多人的股票，不会十分轻易马上就解套所有的人（除非公司基本面发生巨大变化，或有庄家因突发事件仓促介入），虽然因买盘介入，使股票再次回升，但抛盘依然很大，所以股票价格会再次回落，这时又是一个卖点出现。实际应用中这个点也很有意义，在中国的股票市场出现这种情况往往表示有庄家被套，此时他们在利用一些利好因素在做解套行情。另外，下跌后的长期横盘整理现象会显示有买盘介入。若有成交量的配合，则此股票就应加以注意，如果随后有更长期的盘整走势，则在以后再次放量上涨的上升行情的初期，应及时介入，获取利润。


