    # 四、停损


    适当的资金管理方法，是交易成功不可或缺的一环。自律严格的交易者会迅速认赔，绝不会像输家一样犹豫不决。“三重滤网”交易系统是采取非常紧密的停损。


    一旦进场买进之后，将停损设定在交易当天或前一天的低价——以较低者为准——下方一档处；一旦进场放空之后，将停损设定在交易当天或前一天的高价——以较高者为准——上方一档处。如果行情朝有利方向发展，尽快将停损调整到损益两平的价位。往后，设定停损的原则是保护
    50% 的账面获利。


    由于“三重滤网”仅顺着潮汐方向进行交易，所以需要采用紧密的停损。如果一笔交易不能立即获利，显示市场表面之下的根本情况已经发生变化，最好迅速出场。


    第一个认赔的机会，往往是最明智的认赔——让你在场外重新检讨市况。


    保守的交易者应该根据“三重滤网”交易系统的第一个讯号进场买进或放空，然后继续持有部位，直到主要趋势发生反转或被停损出场。积极的交易者可以继续采纳日线摆荡指标的每个新讯号，利用既有部位的获利部分进行加码。


    在平仓方面，部位交易者应该以第一层滤网的讯号为准，继续持有部位，直到周线趋势发生反转为止。短线交易者可以根据第二层滤网的讯号获利了结。


    总之，“三重滤网”交易系统同时采用了数种的时间架构与不同形态的指标。它采用长期走势图上的顺势指标，以及中期走势图上的短期摆荡指标，并运用特殊的进场买进或放空技巧。另外，它还采用紧密的资金管理法则。'
