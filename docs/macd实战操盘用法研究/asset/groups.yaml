    ## 第十五章 交易心得


    ### 15.1 交易八关


    基本面和技术面谁更重要？有人完全用基本面交易，有人完全用技术面交易。经过多年股票期货实盘交易，笔者个人认为基本面非常重要，只有了解了基本面才能有信心持有顺势单。技术面是分析趋势和决定进出的，不懂技术面的人，不可能成为优秀的操盘者。


    做交易，必须二者兼顾，这是所有交易者都需要注意的一个问题，不可执迷于一种分析方法。


    交易者要取得成功至少需要过以下八道关：


    ### 一、止损关


    交易初期，交易者通常入市不久就会遭受损失，甚至是一连串的重大损失。分析自己的交易记录后，才发现原来其中的一笔或者某几笔交易导致本金大失血，这时的资金曲线会表现为断崖式的下跌。


    所以，交易者一定要防止发生大亏损的交易，要果断止损。止损是交易者最先接触也是最先学会的一门实战课程，它能保护交易者的本金支撑到下一关。


    止损关非常难过，我是期货交易第三年上才会止损，但是直到现在才开始学会快速止损。学会快速止损花了7年的时间。但是有时仍然选择抗单，最大的错误就是小分钟结构下单，该止损了，但是看到大分钟问题不大，就不止损，等大分钟让止损时才止损。这是变换交易时间框架的错误，这个错误，目前仍时有犯错。这个错误必须改掉。


    ### 二、顺势关


    学会止损后，交易者经过一段时间的懈怠操作，却猛然发现自己的本金还是一如既往地减少，只是减少的速度慢了很多，即止损止损，越止越损。经过分析自己的交易记录，发现原来自己很多笔交易的方向有问题，与行情的大方向不符，所以很多交易最终都是止损平仓，这时的资金曲线表现为连续的碎步式的下跌。


    如果说不止损会大失血，则不能顺势交易则会慢性失血，导致交易者慢性死亡。所以，即使没有大亏一笔的单子，但是多笔小亏损的单子累加起来同样会使本金越来越少。因此，一定要顺势交易，按照行情的大方向去做单。


    2011 年以来我在期货上交易战绩不佳，根本原因是 2011 年商品期货价格到低位后，我习惯性地想抄底做多，犯了逆大势的错误。直到今天，感觉所有商品价位都很低，很多品种跌破
    2008 年的低点了，很多品种跌破生产成本了，这诱导我去做多，这是错的。跌势不言底，做了这 8 年期货，我还是没有真正理解顺势二字。


    ### 三、轻仓关


    交易者在做到了既能止损，又能顺势后，交易绩效有所改善，逐渐赢多输少，但此时，快速发财的欲望膨胀，胆子越来越大，仓位也越来越重，终于有一天出现了交易者虽然设置了止损但市场没有给予执行的机会，于是资金大幅回撤甚至出现重大亏损，一笔输掉了很多，这时的资金曲线表现为总体上行但偶尔再次发生断崖式下跌。


    这类似于健康的人遭遇车祸，交易中的意外总是不期而至的。交易者要认识到交易生涯中偶然性的重大负面作用，明白期望“一朝暴富”但结局却往往是猝死。要防止这种意外发生，就不能重仓，否则一旦出现特殊情况就没有了回旋余地。交易者要轻仓交易，不再急于求成。


    ### 四、择时关


    学会了截断亏损让利润奔跑，但在轻仓操作下，赚钱的速度毕竟也慢了，于是交易者恨不得每时每刻都有交易做，恨不得每时每刻都有惊天大行情，整日东征西讨，一看到所谓的“机会”出现，就一个猛子扎进去。但经过一段时间的额操作后发现，资金曲线上大的回撤虽几乎没有，但是资金曲线近乎上下波动而无明显增长。分析交易记录后发现，原来自己是在行情的振荡期不断操作，因为没趋势，或者说没行情，因此纵使做得再多再好也赚不到多少，倒是自己的交易费用上升了不少。


    所以做交易原来不用每天都待在市场中，有的时候休息一下反而效果更好，交易者此时明白了张弛有道，一年中只需要抓住那几次有限的行情即可，不必时时交易。


    择时需要技术分析功力，没有 5 年以上的研究很难精确择时。


    ### 五、系统关


    如果前四关过了，那么能让交易者快死、慢死、猝死的主要障碍业已都清理，即该吃的亏都吃过，该吸取的教训也都吸取了，至此一个较为完善的交易理念初步形成。虽然如此，但交易者还是会不时地犯一下上面所列的错误，例如有的时候止损不坚决，或一再放宽止损额，有的时候灵光一闪要抄个底，有的时候一放纵自己就重仓了，有的时候几笔亏损后急于翻本又过度交易。总是
    ​​不自觉地错了改，改了又犯，仿佛永远无法杜绝。


    因此，交易者必须把交易理念转化为具体的操作规则，使之成为可供遵守的纪律。经历了艰苦的尝试，交易者终于在此基础上构建了自己的交易系统，也意识到一个完善的交易系统必须是初始资金、人场、止损、止盈、加减仓五位一体的系统，不可能先解决了其中的一个，再去解决其他的，所有的关节必须同时打通。


    一个交易系统大约需 5～8 年建成。


    ### 六、自信关


    交易系统构建成功了，而且历史数据测试很理想，交易者心想终于可以轻松地赚钱了。但严格按照信号操作后，却碰到了连续亏损五六笔的情况，极端的还有将近二十笔的亏损，交易者此时又开始怀疑自己的系统，认定系统必定有自己不知道的重要缺陷。


    具有完美主义倾向和勤奋钻研精神的人往往又会陷入到系统的修修补补中，遗憾的是这个问题并非努力就可以解决，也许要经过很长时间交易者才会明白，连输连错不过是坏的行情在起作用，因为交易系统并不适合当时的行情，资金管理的作用之一就是要能熬过这种行情。


    长期交易盈利才能建立自信。


    ### 七、重复关


    经过磨炼，交易者明白了亏损是交易的必然组成部分，赚钱的交易不一定是好的交易，亏钱的交易也未必就是坏的交易。重读经典著作，才发现原来交易的奥秘前人都讲过，可惜不亲身经历就难解其中真义。这个阶段交易者已经可以稳定盈利了，但是交易者心中始终存有一个问题：成功是否还有其他捷径可走呢？换句话说，虽然交易者有了自己的交易系统，但是别人的交易系统会不会更好呢？不能为了抱牢一棵树而放弃整个森林，于是交易者又会全身心地投入到其他系统的设计和测试中来，结果不甚了了。


    其实，只有经历了很多的挫折，吸取了很多失败的教训，交易者才会形成自己的交易理念，而系统就是要将这个可行的理念具体化，从这一点看，所有的交易系统都有相同的特点，万变不离其宗。因此，交易者应专心按照既有系统信号操作，不断重复盈利模式，资金才能稳定增长。


    ### 八、自在关


    通过上述修炼，交易者防止每个错误的方法都已规则化，并且每次交易都能做到严格执行规则，这时的资金曲线逐渐上行、斜率适当且没有很大的回撤，交易者自身也会感觉到交易不那么累了，虽然还在天天盯盘，但是做单数量越来越少，成功率却越来越高。此时交易者相信自己的交易系统，也明白系统虽然有一些缺点，但是坚持下去，赚钱是必然的。这时候，交易者定力仍然不足，容易受到外界信息的干扰，比如自己仰慕的高手的建议、有关于庄家主力的报道、似是而非的基本面信息等，交易者还会因轻信而犯错吃亏。


    这一阶段交易者最重要的是修炼定力。随着心态的不断改善和经验的丰富，交易者渐至耳顺境界，能轻松辨别信息的真伪轻重，不为外界信息所扰。此时交易者回顾自己的交易记录会发现，原来一年之中单子虽不多做，但钱并不少赚，长此以往，必能逐渐达到财务自由、心神自在的境界。


    ### 15.2 长线交易的根本方法


    长线是金短线是银，绝大多数交易者应该选择做长线。只有极少数的超级高手才能选择做短线。普通人成为这种高手一般需要 12～15 年才行。


    网上有一篇好文章，是千年不遇的好文章。写得很好，不知道作者是哪位高人，现在摘抄如下，以更为广泛地传播这种正确的交易理念，为全国散户送去福音。


    我想系统地分析一下如何进行长线投资，希望和大家一起完善它。


    我希望和大家一起探讨下列问题：

    - 1. 市场的本质是什么？

    - 2. 交易的最根本的要点是什么？

    - 3. 什么才是符合市场本质和交易要点的交易方法？

    - 4. 我们如何去执行这些交易方法？


    我近期准备辞去公职，不再给公家操作，自己弄了点小钱，想挣点养老金，同时也想和大家一起研究点货真价实的东西，不求有什么用处，全当以艺会友。从明天开始，我结合自己的经验，每天写一点，和大家探讨，我不希望听到大家的表扬，更希望补充和更正。


    ## 我对市场本质的体会是：


    一、市场是由价格和资金互相推动而产生的机会。


    二、机会是风险（成本）和收益的比例（或者价格双向运动的空间比例），以及这个比例实现的可能性（概率）。


    进入市场，别的 inspired 的都可以不考虑，但价格、风险、收益、可能性大小是绝对要考虑的，如果我们明白了这四项，还有什么不在我们的视野中呢？


    ## 说到市场，不得不谈价格：


    许多朋友往往以价格绝对高低来判断是做多还是做空，并往往因此产生亏损。


    我的体会是：虽然价格一般不会降低到零，而且其高度也不是无限的，但是从我们资金的承受力来看，还是要树立一个基本观点，即价格没有绝对高低，而只有相对高低，只能从技术上判断价格高低。


    我建议从实战出发，用三个标准判断价格高度：


    第一，顺势还是逆市，以做多为例，只要趋势线、均线表明趋势没变，价格就应该判定为低价。


    第二，以价格离趋势线和均线的距离来判定，以做多为例，只要价格离趋势线和均线近，就判定为低价。


    第三，以支撑阻力位的远近来判断，以做多为例，只要离支撑位近、离阻力位远的价格即为低价。特别注意，以做多为例，价格未突破上方阻力位，可以说是高价，一旦突破站稳，就成低价了。我建议大家认真研究铜的周线走势，为什么突破
    3000 美元后许多人做空死了？因为他们以价格绝对值为标准去搞战略性做空。我有一种感觉，在中期内，价格突破 3000 美元后，按照过去 1500 美元一个箱体的惯性，铜价将在一时间内在
    3000～4500 美元或者 5000 美元的范围内运动，3000 美元就是低价，但若突破 3000 美元并确认，3000 美元又会成高价。建议大家以这个思路研究天胶。当然，任何观点都有风险，正如期货价格有风险一样，如果我们的观点错了，那
    издания就随期货价格一起止损好了。


    ## 还想进一步谈谈价格：


    第一，价格是我们交易要考虑的唯一对象，我主张我们只用眼睛交易，最好只有眼睛和手，眼睛看价格，手敲键盘。把耳朵堵掉。思维停止。期货市场是个流言蜚语多如牛毛的地方，骗子很多，就是请来福尔摩斯恐怕也查不清什么是真什么是假。但有一个工具，最客观最快最完全地反映了实际情况，那就是价格。所以，我主张价格是我们要考虑的唯一因素。


    第二，价格是风险和收益的统一。价格包含了一个空间概念和时间概念。空间上就是支撑阻力位，时间上就是方向。支撑阻力位加方向，你就可以判断出风险有多大收益有多大。


    第三，价格包含的风险和收益是一个可能性，而不是一个绝对能实现的东西。我们可以通过技术工具判断这种可能发生的概率，但不能说它一定能发生。这就是我们为什么要止损的原因。我认为，在期货市场上凡是满口绝对的人，要么是神仙，要么是骗子，要么是门外汉。


    第四，价格变动的中期方向比短期方向更容易辨别和把握。因为中期变动主要取决于相对稳定的供求关系和市场的中期交易成本、（平均线）决定的多空优势与劣势以及市场上占上风的交易习惯，这些因素稳定一些；短期趋势主要取决于因获利产生的平仓冲动、随机消息产生的情绪冲动等，就非常不稳定。所以，做中线比做短线要容易一些，短线高手更难培养。当然，我不主张人人做中线，因为市场需要流动性，如果没人做短线，市场就没有流动性，中线建仓和平仓都没办法实现了。市场是一个生态链，大家都相互依赖，缺了谁都不行，所以，我建议：只要你是以价格而不是以消息为依据，做中线和做短线都行，但一定要明白，你有什么样的本事，适合做什么。


    ## 现在说说交易的本质：


    - 1. 交易的目的是交易收益，交易收益＝交易机会成功率 X 交易机会仓位率 X 仓位损益率。

    - 2. 交易的本质就是对上述公式中的三个因素进行控制，达到交易收益至少为正数的目标。

    - 3. 控制机会成功率。这就是大家最关注的，也最爱说的。我们喜欢预测，实际上就是本能上希望提高成功率。基本面分析和技术分析的目的，就是为了提高机会成功率。一般而言，机会成功率能达到
    50% 已经是不错的了，若达到 70% 以上那就非常好了。由于外界因素的不可控制性，我们永远不可能也没必要追求 100% 的成功率。但是由此就引出了交易上的两个基本原则：一是止损，因为错误是难免的；二是扩大利润，而且利润必须超过亏损＋手续费。


    ### 仓位问题：


    1. 为什么要控制仓位呢？


    从消极的角度讲是为了控制风险总量，特别是控制意外事故。即使是你看对了行情方向，也选了个比较好的建仓点，但市场总免不了出现小概率的意外事故。比如突然反向来一两个停板，然后又恢复趋势。这样的事，我这几年遇到过多次，幸亏仓位控制好，才没出大事。即使你日内交易，也有措手不及的时候。我特别要提醒朋友们注意，千万别忽视小概率事件，因为不管你成功多少次，一次意外事故，就使你
    10 年都白干了。在风险投资领域，眼睛必须牢牢地盯着那 5% 的致命意外事故，只有 100% 确保它不会威胁我们生命时，再放手去搏收益。控制仓位是最基本的控制风险的方法。我前面列的公式用的是乘法，其中任何一个因素是零，整个公式都是零。如果你不会控制仓位，别的做得再好也没意义。从积极的角度看，控制仓不仅可以控制风险，而且可以扩大利润，如果你是做中线，一旦做对了，每攻克一个阻力位，就递减式加仓，你可以使你赢利时候的仓位永远大于出错时候的仓位。


    2. 如何控制仓位？


    我认为下列几条是必须坚持的：

    - 一是总仓位最好别大于 50%；

    - 二是每个品种的仓位别大于 30%；

    - 三是把仓位分散在不相干品种上；

    - 四是分批建仓；

    - 五是永远别在亏损头寸上加仓；

    - 六是只有新阻力位突破并确认后再加仓；

    - 七是加仓要递减式进行；

    - 八是加仓别超过两次。


    ### 控制仓位损益率，是期货交易能否成功的又一个关键。


    首先是止损问题。不知 道止损死扛的人当然会被淘汰，但知道止损的人估计也有很多人被淘汰了，因为止损就意味着犯错误了，如果你不断地犯错误，还有不被淘汰的？


    所以核心问题不在于你知道止损，而在于你尽量少出现止损的结局，你必须把止损放在你的全部交易策略中去运用。


    第一，你要争取使你抓的机会的成功率大于 50%，而且要在趋势过程中选择一个比较有利的位置建仓；换句话说，你交易十次，最好只有 5 次以下是以止损告终。


    第二，你的仓位不能过大，因为过大的仓位可能使你十次交易即使只碰到一次止损，也可能一败涂地。


    第三，你要保证你止损时候的仓位小于你成功时候的仓位，否则会导致止损亏的多，赢利赚的少。


    第四，你的止损点要设的科学。短线交易我不懂，从中长线交易看，我觉得只有真正错了才止损或者当自己也搞不清是对还是错时候才止损，因为中线建仓是以趋势十回撤或者转折十确认为依据的，所以，趋势被破坏或者转折不成功就该止损。但这里面还有一个资金承受力问题，我的体会是：以趋势线、颈线、均线为止损位，加上总资金的
    5% 左右的绝对止损额。由于我单个品种仓位只在 30% 以内，同时尽量在回撤时建仓，这样算起来，止损环境还是比较宽松的，能够抗击一般的震荡。


    第五，止损错了，要及时建回丢掉的仓位。


    第六，遇到假突破（即假性摆动）一定要止损。


    第七，在形态形成中，只顺原来的方向建仓，形态顺势突破就加仓，反向突破止损并反手。


    总之，止损的内涵非常丰富，可以说它包含了交易的全部艺术，没搞明白它，你就没入门。


    ## 努力发现并跟踪一波势：


    很多朋友问我，为什么不就铜、天胶发表自己的看法？我的想法是这样的：一个人要赚大钱，必须跟做一波大行情，铜和天胶一直处在牛市之中，期货人都知道！目前，无转市信号。那么如果没有原始低位单，现在就很难做。不妨把精力用于那些刚启动的品种上来，从“头”做起，只有这样，才能在一根甘蔗上去掉根和梢，从头吃到尾。


    因此，我觉得评论最好着眼于那些行情面临转折的品种，也就是人们常说的要有拐点的品种，进行跟踪和关注，这样读者也就能够因为关注了你的评论而受益匪浅。


    有朋友还说我，你的评论过于简单，我的回答是：实际上我的评论也过于复杂了，对于明确的趋势品种，真正有用的评论只是由两个字组成：买开、卖平、卖开、买平、持有、观望。不同的时间用不同的两个字就够了。你已经做对了趋势，你除了持有就该品茶、听音乐放松了，你还用得着再瞎折腾吗？


    经常有人问我某品种“下午怎么走？”“明天会涨吗？”我对此表示理解，但我更希望你不要关注得这么短，而是去多关注一波势。


    真正期货市场要混下去，说复杂也复杂，说简单也简单，因为你只要抓住下面几点，坚持不懈，不赢都难：


    第一，始终只看周线和日线，别看日以下的周期。（做中线）

    第二，只用均线、趋势线、颈线、假性摆动、回撤，别的东西也别理会。

    第三，总仓别超 50%，但仓位别超 30%。

    第四，尝试建仓，错了止损，对了加仓。

    再补充一点，宁可顺原方向交易，最终只套一次，别抢小反弹，次次被套，特别是目前的豆子；建仓只用顺势＋回撤就可，千万别管价格高低。


    其实，期货上找到个好机会不难，难在把机会用好。我觉得，建仓对了，守不住仓，原因估计有如下几个方面：

    一是仓位太大，一波动，就抗不住了，只好逃跑；

    二是建仓点位没有优势，刚建仓，就遇到反弹，被挤出来了；

    三是就没有设定平仓依据，又天天看盘，情绪性地跑进跑出；

    四是就看不出方向，想当然地进出。

    我建议：你的图表上只留 300、150、75、30 日四根均线，永远只顺 30、75 日方向交易，只要均线方向明确，价格靠近 30、75 日均线时就建仓；每一个波段的趋势线和颈线跌破才平仓。仓位永远小于
    30%；只有趋势线、颈线、均线三者同时突破并确认后，再换方向交易。另

