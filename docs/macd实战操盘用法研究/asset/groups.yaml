    MACD 极其有名的 “事不过三” 原则，0 线以下三次金叉，必定要么一波大反弹，要么转势。因此，建议投资者一旦看到 MACD 在 0 线下出现连续三次金叉，则可以考虑在第三次金叉的时候平空买涨。


