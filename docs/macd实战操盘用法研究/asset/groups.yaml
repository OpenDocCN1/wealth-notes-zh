    # 四、可交易的区间内价格摆动


    有些走势图分析人士在这种形态的价格摆动中进行交易——在市场回档至价格区间的底部时买进，而反弹至价格区间的顶部时卖出。这种技法使短线交易者充分利用确定无误的价格边界，并从无趋势的市场中获利。由于仓位建在价格区间的边界，因此风险不但相对较小而且明确。如果交易区间完好如初，这种逆势交易法就很奏效。当突破的确发生时，交易者不仅可以立即从最后的亏损交易中脱身，而且可以通过顺着新趋势的方向重新交易来倒转以前的仓位。振荡量指标在横向交易的市场中尤为有用，但是一旦由于第十章中讨论的原因发生突破，其效用就会减少。


    另一些交易者认为矩形是持续形态，因此在上升趋势中价格带的下边界建多仓，或在下降趋势中的价格区间的上边界附近建空仓。另一些投资者避开所有这种无趋势的市场，并等到明确的突破出现后才投入他们的资金。大多数趋势跟随系统在市场横走及趋势不明的时候表现拙劣。


    # 五、其他相似处和差异处


    在持续时间方面，矩形通常属于一至三个月的类别，这与三角形和楔形类似。矩形的成交量形态与其他持续形态有所不同，这是因为宽阔的价格摆动阻止了在其他持续形态中见到的交易活动萎缩现象。


    在矩形中最常用的测算技法以价格区间的高度为基础。从顶至底测量出交易区间的高度，然后从突破点投射出这段垂直距离。这种方法类似于前面提到的其他各种垂直测算技法，也以市场波动性为基础。当我们涉及
    OX 图分析中计数时，将更多地讨论水平价格测算的问题。


    到目前为止讲过的突破时的成交量以及反抽的可能性在矩形中也很有效。由于在矩形中上边界和下边界是水平的，而且明确可见，因此支撑位和阻力位也更加明显。这就意味着，在向上突破时，原先价格带的上边线现在应为任何抛售提供稳固的支撑。而在下跌趋势中的向下突破发生后，交易区间的底边（先前的支撑区域）现在应对任何反弹的努力构成坚实的ynth天花板。'
