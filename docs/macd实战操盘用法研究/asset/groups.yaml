    # 以糖为例谈谈如何进行成功的交易：


    第一，必须懂得期货交易赢利的基本原理。

    我把这个原理概括为一个公式，即：交易损益＝机会成功率×机会仓位率×仓位损益率。你只要保证了你交易时成功的概率大于50%，交易成功时仓位大于交易失败时的仓位，交易失败时的损失小于交易成功时的赢利，那么你必胜无疑。


    第二，如何使机会的成功率大于50%？


    1. 首先，弄明白你依据什么交易。我的经验是，小资金唯一的依据只能是技术，而且是简明扼要的技术图形。在这个问题上，最大的陷阱有三个：一是所谓基本面消息，二是所谓名人预测，三是所谓评论。道理很简单，即使是那三个交易依据都正确，如果你技术交易点不对头，一个震荡就让小资金承受不了。比如说现在的糖，罗杰斯说要涨，那些乱嚷嚷的人也说要涨，我们能依据这些来建仓？我也曾经准备做多，但我绝对不会随便介入。我必须等待两个技术条件才会做多：区间突破＋均线系统收敛并给出方向。如果给出的方向向下，我就改主意做空了，反而不做多了。我唯一的依据是技术图形，至于什么罗杰斯，不会把他当回事，道理很简单，我如果输了钱，他也不赔我，我干吗听他的？


    2. 其次，你运用什么技术图形交易？我的经验是：越原始越简单越好。就用区间＋趋势线、均线、颈线（形态）就足够了。所以，建议你把其他图形全删除。运用这些技术工具，你看看糖是个什么样子？国内的糖，在4500～5300这个大区间内震荡，均线系统杂乱，没什么方向；美国11号糖，也在一个区间震荡，但向下破位的危险比较大，日线上向下破位的态势更明显。运用图形，一看就简明扼要，还需要听罗杰斯的？我这么说，肯定有人会指责我不尊重大名人。我有我的道理：即使罗先生说的对，将来糖真能涨300%，可目前没涨，目前的回调也足以让我做多死掉，就是将来涨了，对我有何意义？别只信罗杰斯，要信自己的眼睛＋技术图形。技术图形涨了，跟进就是了，即使老罗说不涨也照涨不误；技术图形跌了，跟进就是了，即使老罗说涨也没用。


    3. 如何运用技术图形？第一步，看清价格运行的大区间，知道价格的支撑阻力在哪里？见过大江大河吗？两条河岸就决定了水的运行区间。价格就是水，区间就是河岸。第二步，运用趋势线和均线判明价格是在震荡还是明显单边方向中；第三步，如果价格在震荡中，就别交'
  - '[PAGE 337]


    # MACD 实战操盘用法研究


    易，或者按照震荡的边线做短线交易；第四步，如果价格在单边趋势中，就顺着大方向，回调就建仓。目前的糖，是在区间震荡中，正确的交易方式是：要么别交易，等突破方向；要么在两个边线附近做多或做空，等区间突破后再定中线方向。盲目叫多叫空，要么是门外汉，要么是骗人的侏儒，愿朋友们慎重。


    总之，只要你能分辨价格是在震荡还是趋势中，在震荡时，边线交易；在趋势中坚持有顺势＋逆波交易，那么你成功的概率就大于 50%。当然，如果你说你分不清震荡和趋势，那我只能把你归入那一类没入门的人之列了。不同的是，我同时建议你把工夫放在学习上，而不是放在喊叫上，那样你很快就入门了，而不会一生都在门外。


    第三，如何控制仓位？


    首先必须明白，控仓是绝对必须的。因为任何机会都不是 100% 对的，我们人的认识能力也总免不了犯错误。如果你满仓交易，一旦出错，必定死掉，就再没有机会了。我建议：任何时候，总仓位别超过
    50%，单品种仓位别超过 30%，像糖这样的品种，别超过 20%。还有一点特别重要，把要建的仓为分成两半，第一半对了，加第二半。但是，区间边线交易别加仓。


    第四，如何控制仓位损益率？


    +   1. 要会止损。


    首先，建仓要还就止损。如果不好止损，或者止损量大，宁可别建仓。比如现在的糖，你在 4600 左右做多，在 5100 以上做空，离边线不远，就好止损，否则，你真会左右为难。


    其次，也别随便止损。这就要求你轻仓。只要大格局没变，别轻易逃跑。再次，一旦大格局变了（突破了），一定要一次 100% 跑掉。现在的糖，如果破了区间，跑的越快越好。


    +   2. 要学会捂“大”钱。


    方法很简单：一旦做对，画一条波段趋势线，没破趋势线，绝对不出来。


    我可以告诉大家，我的铜多单虽然走了，但天胶和玉米多单至今没动，道理很简单，趋势没变啊。


    第五，概括一下我的交易思想：


    +   1. 从交易方法上看，概括为十个字：顺势、逆波、控仓、止损、扩利。'
  - '[PAGE 338]


    2. 从交易者看，概括为八个字：客观（只用眼睛交易）、耐心、简明、一贯。


    # 交易基本策略：


    1. 固定交易品种（CU、RU、SR、C）＋顺势、波初介入＋控仓（总仓 55%、单仓 35%；波初 70%，加仓 30%）＋止损（8%）＋扩利。


    2. 客观简明一贯的规则＋等待机会的耐心＋控制仓位的理智＋快速止损的果断＋扩大利润的大气。


    我只做五类机会：月周线趋势强劲＋远摆价格带回破，小仓短线；月周线趋势强劲＋2B 价格带回破，小仓短线；月周线趋势平缓＋价格带边线，小仓短线；月周线收敛趋转＋价格带突破，中仓中长线；月周线趋势强劲＋回调价格带突破，中仓中长线。


    特别说明：


