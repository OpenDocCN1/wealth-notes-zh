    # 图 8.13


    如果上升趋势本身处于调整过程中，那么向下的调整通常会在上面一根速度线上止住（2/3速度线）。若不然，市场会跌到下面一根速度线上（1/3速度线）。如果下面一根速度线也被跌破了，那么市场有可能一泻至先前趋势的起点。在下降趋势中，市场突破下面一根速度线表明很可能会反弹至上面一根速度线。如果市场突破这根速度线，那之为说明反弹行情会涨至先前趋势的起点。


    正如所有的趋势线一样，速度线一旦被突破也会变换角色。因此，在上升趋势的调整过程中，如果上面一根线（2/3线）被突破，而且市场跌到了1/3线处并从那反弹，那么上面一根线就变成了阻力线。只有突破上面这根线时，才是市场可能挑战老高点的信号。在下降趋势中道理也一样。


