    # 第七章 MACD 形态以及与形态理论的经典结合使用


    ## 7.1 主要的反转形态


    ### 一、价格形态


    什么是价格形态？价格形态是图案或者构造，它们出现在股票或期货的价格走势图上，它们可以分成不同的类别，而且有预测价值。


    两种形态：反转形态和持续形态。


    有两种主要类型的价格形态——反转形态和持续形态。正如这些名称暗示的那样，反转形态表明趋势中的重要转折正在发生。另外，持续形态显示市场仅是暂作停留，可能是要对短期的超买或超卖做出调整，此后现存趋势将恢复。窃门在于，在形态发育的过程中尽早区分出这两种类型。


    在本章中，我们将研究三种最常用的反转形态：头肩形、三重顶和三重底、双顶和双底。我们将研究价格结构的本身，它是如何在走势图上形成的，以及如何才能鉴别它们。然后，我们再看看另外两个需要考虑的重要因素——随之出现的成交量形态以及测算推断。


    成交量在所有价格形态中都扮演着重要的印证角色。在吃不准的时候（很常见），研究一下与价格数据相伴的成交量形态可能是价格形态是否可信的决定性因素。


    大多数价格形态还有某些测算技法，它们可以帮助分析人士确定最小的价格目标。虽然这些目标仅仅是随后市场运动的大致规模，但它们仍有助于交易者确定他或她的报偿与风险之比。


    # MACD 实战操盘用法研究


    我们还将看看第二种形态——持续形态。我们将研究三角形、旗形、尖旗形、楔形以及矩形。这些形态通常反映出现行趋势的停顿而不是反转，因此相对主要形态，它们通常被归为中级形态或小形态。


    ### 二、所有反转形态的初步要领


    在我们开始讨论单个的主要反转形态之前，得说明几个适用于所有这些反转形态的初步要点。


    +   1. 任何反转形态的先决条件是先前趋势的存在。

    +   2. 即将到来的趋势反转的第一个信号常常是市场突破重要的趋势线。

    +   3. 形态越大，后续的市场运动就越大。

    +   4. 筑顶形态通常比筑底形态经历的时间短且波动性强。

    +   5. 底部的价格区间通常较小且构筑时间长。

    +   6. 成交量往往在市场的上升阶段中更重要。


    先前趋势的必要性。先前趋势的存在是任何反转形态的先决条件。显然，市场必须有东西可反转。在走势图上偶尔会出现一种结构与某一反转形态相像。然而，如果这种形态之前没有一种趋势，那就无势可转，而且这种形态也很可疑。知道在趋势结构中何处最易出现反转，是形态识别的关键因素之一。


    有先前的趋势可转这一点的必然结果是测算推断问题。前文曾说过，大多数测算技法仅仅给出最小价格目标。最大目标可能是先前市场运动的整个范围。如果一轮大牛市已经出现，并且大的筑顶形态正在形成，那么潜在向下运动的最大限度便是对牛市
    100% 的回撤，也就是它开始的地方。


    市场突破重要的趋势线。即将到来的趋势反转的第一个信号常常是市场突破重要的趋势线。但要记住，市场突破主要的趋势线并不一定说明趋势反转。要说明的只是趋势中的一个变化。市场跌破主要的上
    升趋势线或许表示横走价格形态的开始，这种形态以后可能被识别成反转型或巩固型。有时，市场突破主要趋势线与价格形态的完成同时发生。


    形态越大，潜力越大。当我们用“越大”这个词时，我们指的是价格形态的高度和宽度。高度衡量了形态的波动性。宽度是构筑与完成该形态需要的时间。形态的规模越大——即在形态内摆动的价格摆动（波动性）越大而且构筑形态的时间越长——那么形态就越重要，而随后的价格运动的潜力就越大。


    实际上，这两章中的所有测算技法均是基于形态的高度。这是一种主要适用于柱线图的方法，柱线图使用一种竖直测量标准。而测量价格形态水平宽度的方法通常适用于 OX
    图分析。这种走势图分析法采用了一种计数方法，这种方法假定顶部或底部的宽度与随后的价格目标之间存在着紧密的联系。


    顶部和底部的差别。相比筑底形态，筑顶形态的持续时间短且波动大。价格摆动在顶部更宽而且更剧烈。顶部的形成时间通常较短。底部通常有较小的价格区间，但构筑时间长。正因如此，辨别和捕捉底部通常比捕捉顶部容易，损失也少。一个使变化多端的筑顶形态值得捕捉的安慰因素是，市场往往跌得快而涨得慢。因此，相比在牛市做多，交易者在熊市做空可以快得多地赚更多的钱。生活中的一切都是在风险与回报之间的权衡。高风险带来高回报，反之亦然。筑顶形态较难捕捉，但却值得努力。


    成交量在上升行情中更重要。成交量一般应沿着市场趋势的方向增加，而且成交量是所有价格形态完成的重要印证因素。每一种形态的完成应伴随着成交量的显著增加。然而，在趋势反转早期，成交量在市场顶部并不如此重要。一旦处于熊市，市场会“因自重而下降”。走势图分析人士喜欢看到在市场下跌的同时交易活动不断增加，但这不是决定性的。然而，在底部，成交量的放大绝对必要。如果在价格向上突破期间，成交量形态没有呈现显著的增加，那么整个价格形态应当值得怀疑。我们将在第七章更深入地探讨成交量。


    ### 7.1.1 头肩形反转形态


    现在，让我们来仔细看看在所有主要的反转形态中很可能是最出名且最可靠的形态——头肩形反转。我们将花费较多的时间在这个形态上，因为它很重要，而且我们还要解释所有涉及的细微差别。其他大多数反转形态仅仅是头肩形的变体，因此无需赘述。


    正如其他所有反转形态一样，头肩形仅仅是对趋势概念的进一步提炼。想象一个主要上升趋势中的情形，此时一系列爬升中的波峰和波谷逐渐开始失去动量。上升趋势因此横走了一阵。在此期间，供求力量处于相对平衡状态。一旦这个派发阶段完成，市场就会跌破沿水平交易区间底部的支撑位，并建立了新的下降趋势。新的下降趋势现在有了不断下移的波峰和波谷。

