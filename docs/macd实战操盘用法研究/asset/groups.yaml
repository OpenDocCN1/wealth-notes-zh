    2. 当 RSI 值低于 20 时，则表示市场上卖盘多于买盘，空方力量强于多方力量，空方大举进攻后，市场下跌的幅度过大，已处于超卖状态，股价可能出现反弹或转势，投资者可适量建仓、买入股票。如果市场是涨势，可迅速建立多单；如果市场是跌势，只能短多抢反弹，最好观望。


    3. 当 RSI 值处于 50 左右时，说明市场处于整理状态，投资者可观望。


    4. 对于超买超卖区的界定，投资者应根据市场的具体情况而定。一般市道中，RSI 数值在 80 以上就可以称为超买区，20 以下就可以称为超卖区。但有时在特殊的涨跌行情中，RSI
    的超卖超买区的划分要视具体情况而定。比如，在牛市中或对于牛股，超买区可定为 90 以上，而在熊市中或对于熊股，超卖区可定为 10 以下（对于这点是相对于参数设置小的
    RSI 而言的，如果参数设置大，则 RSI 很难达到 90 以上和 10 以下）。


    5. 市场趋势是涨势时，RSI 至少两次达到 80～100 区间；市场趋势是跌势时，RSI 至少两次达到 0～20 区间。


    # 三、长短期 RSI 线的交叉情况


    短期 RSI 是指参数相对小的 RSI，长期 RSI 是指参数相对较长的 RSI。比如，6 日 RSI 和 12 日 RSI 中，6 日 RSI 即为短期
    RSI，12 日 RSI 即为长期 RSI。长短期 RSI 线的交叉情况可以作为我们研判行情的方法。


    +   1. 当短期 RSI>长期 RSI 时，市场则属于多头市场；

    2. 当短期 RSI<长期 RSI 时，市场则属于空头市场；

    3. 当短期 RSI 线在低位向上突破长期 RSI 线时，一般为 RIS 指标的 “黄金交叉”，为买入信号；

    4. 当短期 RSI 线在高位向下突破长期 RSI 线时，一般为 RSI 指标的 “死亡交叉”，为卖出信号。


