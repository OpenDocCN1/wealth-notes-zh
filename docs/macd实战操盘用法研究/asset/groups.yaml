    #### 五、成交量必须印证趋势


    在印证价格信号时，道把成交量作为一种次要但却重要的因素。简而言之，在大趋势的方向上成交量应当膨胀或增加。在大上升趋势中，成交量随市场上涨而增加，随市场下跌而减少。在下降趋势中，成交量应当随市场下跌而增加，随市场上涨而萎缩。道把成交量作为次要指标，他把实际的买卖信号完全基于收盘价。今天成熟的成交量指标可以帮助确定成交量是在增加还是在减少。然后，机智的交易者将这个信息与价格行为比较，看看两者是否相互印证。


    #### 六、趋势在给出明确的反转信号之前被假定一直有效


    我们曾在第一章中接触过的这条基本原则形成了现代趋势跟随法的主要基础。它将物理定律与市场运动相结合，这个定律说明，运动中的物体在这个情形中是趋势会保持它的运动状态，直至有某种外力使它改变方向。一些技术分析工具有助于投资者辨别反转信号的艰巨任务，包括对支撑位和阻力位、价格形态、趋势线和移动平均线的研究。某些指标甚至可以提供动量丧失的更早的警告信号。对于那些模棱两可的情况，机会总是站在现存趋势还将继续这一边。


    对道氏理论者或者就此而言的任何趋势跟随者来说，最困难的工作在于有能力把现存趋势中的普通次要调整与相反方向的新趋势的第一段区分开来。对于市场何时给出真正的反转信号，道氏理论者们还没有统一的意见。下面两图表明这种分岐是如何显露出来的。


    ![](img/e00f2195878851621153c98be41c491d_234_0.png)


    失效摆动。高点C挑战点A失败，加之市场跌破了最低点B，构成了在点S处的“卖出”信号。


    ![](img/e00f2195878851621153c98be41c491d_234_1.png)


    非失效摆动。注意点C在跌破点B之前超过了点A。某些道氏理论者会在S1处看到“卖出”信号，而另一些人则需要在S2处转为看跌之前看到E处更低的高点。


    # 图 10.3


    在上面10.3左图中，注意到达点C的反弹低于前一个高峰点A。然后价格跌破了点B。两个依次下降的波峰和两个依次下降的波谷的出现，在最低点B被跌破的位置，点S，给出了明确的卖出信号。这种反转形态有时称为“失效摆动”。


    在上面右中，点C处的反弹顶部比前一个峰值点A高。然后，价格跌到点B之下。某些道氏理论者并不认为S1处的支撑崩溃是真正的卖出信号。他们或许会指出，这个情形中只存在依次降低的低点，而没有依次降低的高点。他们宁可看到点E的反弹比点C低，然后，他们会寻找点D之下的另一个新低点。对于他们来说S2才是真正的卖出信号，因为有两个更低的高点和两个更低的低点。


