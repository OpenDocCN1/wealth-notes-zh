    B 和 D 底部的趋势线，并跌破了点 D 处的支撑，而且已经满足了新趋势的必要条件——下降的波峰和波谷。新的下降趋势可以从点 C、D、E 和 F 处下降的波峰和波谷来确定。市场跌破颈线时成交量应放大。然而，在顶部的初始阶段，当市场下跌时的成交量放大并非至关重要。


    # 二、反抽


    市场通常会出现反抽现象，即反弹至颈线下方或点 D 处的前一个反作用最低点（见点 G），这两者现在都成了悬在头上的阻力。反抽并不总是出现，有时或许只是微弱的反弹。成交量可能有助于测定反弹的规模。如果市场最初跌破颈线时成交量骤放，那么反抽可能性就很小，因为增加了的交易活动反映出更大的向下压力。跌破颈线时的成交量较小会增加反抽的可能性。然而，这个反弹伴随的成交量必定小，并且在恢复新的下降趋势时应该伴随着明显增加的交易活动。


