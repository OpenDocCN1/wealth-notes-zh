    图 1.1 MACD 图


    ## 1.2 MACD 指标的一般研判标准


    MACD 指标是市场上绝大多数投资者熟知的分析工具，但在具体运用时，投资者可能会对 MACD 指标的运用的准确性、实效性、可操作性上有很多茫然的地方，有时会发现用从书上学来的
    MACD 指标的分析方法和技巧去研判股票走势，所得出的结论往往和实际走势存在着特别大的差异，甚至会得出相反的结果。


    这其中的主要原因是市场上绝大多数论述股市技术分析的书中关于 MACD 的论述只局限在表面的层次，只了解 MACD 的一般分析原理和方法，而对 MACD 分析指标的一些特定的内涵和分析技巧的介绍鲜有涉及。


    本节将在介绍 MACD 指标的一般研判技巧和分析方法基础上，详细阐述 MACD 的特殊研判原理和功能。


    ### 1.2.1 DIFF 和 DEA 的值及线的相对位置


    - 1. 当 DIFF 和 DEA 均大于 0（即在图形上表示为它们处于零线以上）并向上移动时，DIFF 向上突破 DEA 时，一般表示为股市处于多头行情中，可以买入或持股；可以开多单并持有多单。

    - 2. 当 DIFF 和 DEA 均小于 0（即在图形上表示为它们处于零线以下）并向下移动时，DIFF 向下突破 DEA 时一般表示为股市处于空头行情中，可以卖出股票或观望。可以开空单并持有空单。

    - 3. 当 DIFF 和 DEA 均大于 0（即在图形上表示为它们处于零线以上）但都向下移动时，DIFF 向下突破 DEA 时，一般是股市的获利回吐，可以用于平仓多单，但是一般不能用来开空单。

    - 4. 当 DIFF 和 DEA 均小于 0（即在图形上表示为它们处于零线以下）但向上移动时，DIFF 向上突破 DEA 时，一般表示将会出现一波反弹，股票将上升，可以短线买入股票。期货可以作为空单平仓条件，但是不推荐开仓买多单，最多只能做短多。


    ![](img/e00f2195878851621153c98be41c491d_15_0.png)


    上边 4 条法则用上图 1.2 橡胶 1501 的 30 分钟线图验证可以看出，DIFF 和 DEA 都在 0 线上，出现金叉就大胆做多，出现死叉就平多单不做空，如果做空也是短空（MACD
    顶背离除外）；DIFF 和 DEA 都在 0 线下，出现死叉就大胆做多，出现金叉就平空单不做多，如果做多也是短多（MACD 底背离除外）。


    ## 图 1.3 0 轴之下，死叉做空


    ### 1.2.2 MACD 指标中的柱状图分析


    在一般的行情分析软件中通常采用 DIFF 值减 DEA（即 MACD）值而绘制成柱状图，用红柱状和绿柱状表示，红柱表示正值，绿柱表示负值。用红绿柱状来分析行情，又可以起到明显的效果。


    - 1. 当红柱持续放大时，表明市场处于牛市行情中，股价将继续上涨，这时应持股待跌或短线买入，直到红柱无法再放大时才考虑卖出。


    ![](img/e00f2195878851621153c98be41c491d_16_0.png)


    ## 图 1.4 0 轴之上，红柱放大


    ![](img/e00f2195878851621153c98be41c491d_16_1.png)


    ## MACD 实战操盘用法研究


    - 2. 当绿柱持续放大时，表明市场处于熊市行情之中，股价将继续下跌，这时应持币观望或卖出股票，直到绿柱开始缩小时才可以考虑少量买入。如果是期货做空，坚定持有空单，直到绿柱缩短，才考虑平空。


    ![](img/e00f2195878851621153c98be41c491d_17_0.png)


    ## 图 1.5 0 轴之下，绿柱放大


    - 3. 当红柱开始缩小时，表明市场牛市即将结束（或要进入调整期），股价将大幅下跌，这时应卖出大部分股票而不能买入。尤其是 0 轴下方红柱缩短，是做空的好时机。


    ![](img/e00f2195878851621153c98be41c491d_17_1.png)


    ## 图 1.6 0 轴之下，红柱缩短开空


    - 4. 0 轴上方，当绿柱开始收缩时，表明市场的调整行情即将结束，股价将止跌向上（或进入盘整），这时可以买入。


    0轴之上，每次绿柱缩短就是开多良机


    ## 图 1.7 0 轴之上，绿柱缩短开多


    - 5. 顶部横盘或顶部出现次高后，当红柱开始消失、绿柱开始放出时，这是股市转市信号之一，表明股市的上升行情（或高位盘整行情）即将结束，股价将开始加速下跌，这时应开始卖出大部分股票而不能买入股票。


    红柱之后出现绿柱，并且持续放大，坚决放空


    ## 图 1.8 多转空


    ## MACD 实战操盘用法研究


    - 6. 底部出现横盘或出现次底后，当绿柱开始消失、红柱开始放出时，这也是股市转市信号之一，表明股市的下跌行情（或低位盘整）已经结束，股价将开始加速上升，这时应开始加码买入股票或持股待跌。


    ![](img/e00f2195878851621153c98be41c491d_19_0.png)


    ### 1.3 MACD 背离详解


    ### 1.3.1 顶背离和底背离


    MACD 指标的背离就是指股价 K 线创出新高或者新低，技术指标 MACD 没有相应的创出新高和新低。MACD 指标的背离有顶背离和底背离两种。


    #### （一）顶背离


    当股价 K 线图上的股票走势一峰比一峰高，股价一直在向上涨，而 MACD 指标图形上的由红柱构成的图形的走势是一峰比一峰低，即当股价的高点比前一次的高点高、而
    MACD 指标的高点比指标的前一次高点低，这叫顶背离现象。


    顶背离现象一般是股价在高位即将反转转势的信号，表明股价短期内即将下跌，是卖出股票的信号。


    ## 图 1.10 MACD 顶背离


    #### （二）底背离


    底背离一般出现在股价的低位区。当股价 K 线图上的股票走势，股价还在下跌，而 MACD 指标图形上的由绿柱构成的图形的走势是一底比一底高，即当股价的低点比前一次低点底，而指标的低点却比前一次的低点高，这叫底背离现象。


    底背离现象一般是预示股价在低位可能反转向上的信号，表明股价短期内可能反弹向上，是短期买入股票的信号。


    ## 图 1.11 MACD 底背离


    ![](img/e00f2195878851621153c98be41c491d_20_0.png)


    ![](img/e00f2195878851621153c98be41c491d_20_1.png)


    ## MACD 实战操盘用法研究


    橡胶日线走势图，形成底背离。我们发现一般背离后都有一波行情，要么是转势行情，至少也是大反弹或大回调行情。


    在实践中，MACD 指标的背离一般出现在强势行情中比较可靠。股价在高价位时，通常只要出现一次背离的形态即可确认位股价即将反转；而股价在低位时，一般要反复出现几次背离后才能确认。


    因此，MACD 指标顶背离研判的准确性要高于底背离，这点投资者要加以留意。


    ### 1.3.2 MACD 背离实战应用


    股价经过一段上涨，与前高持平或者创新高，而 MACD 指标中的 DIFF 不与股价同步向上，反而持平或创新低。使用方法就是不看上面股价，只看 MACD 的
    DIFF 的最高点，只要这个新出来的高峰没有前高就算背离了，一般往下至少有 15% 的跌幅。


    这里要说明的就是教科书上所说的 MACD 背离是股价与 MACD 指标中的 MACD 比，而我这里的是股价与 MACD 指标的 DIFF 比。例图中塑料 1409
    日线走势图，出现顶背离后的走势。


    ![](img/e00f2195878851621153c98be41c491d_21_0.png)


    ## 图 1.12 MACD 顶背离


    反过来，就是 MACD 底背离。股价创新低，DIFF 不再创新低（前面应有一个最低点），这个次低点的后一天就是底背离点，要注意：这个次低点是由后一天涨而形成的，底背离点是一个进货参考点。


    使用方法就是不看上面的股价只看 DIFF，不再创新低了造成这次低点的那天就是底背离点。


    ![](img/e00f2195878851621153c98be41c491d_22_0.png)


    ## 图 1.13 MACD 底背离


    ![](img/e00f2195878851621153c98be41c491d_22_1.png)


    ## 图 1.14 连续的底背离更为准确


    依此看来，MACD 背离战法准确率十分高。凡是要买入股票或期货，一看 MACD 有这种情况了，就不要马上跟进，至少也要等到它回调 15% 以上再进。第二天逢高甩，可以在低位捡回来。


    ![](img/e00f2195878851621153c98be41c491d_23_0.png)


    ## 图 1.15 连续的顶背离更为准确


    以上是原则，一般顶背离较准，看到逃没错，下面至少有 15% 的跌幅，逃错了无非是少赚点，底背离买点就只能供参考，不能保证买了一定有 15% 的赚头，买了不涨只有止损。


    还有一种背离叫做隔峰底背离或隔峰底背驰：第二次金叉出现底背离，第三次金叉位置比第二次金叉位置低，但是比第一次金叉位置高，相比第一次金叉也形成了背离，这就是隔峰底背离或隔峰底背驰。


    隔峰顶背离或隔峰顶背驰：第二次死叉出现顶背离，第三次死叉位置比第二次死叉位置高，但是比第一次死叉位置低，相比第一次死叉也形成了背离，这就是隔峰顶背离或隔峰顶背驰。


    ![](img/e00f2195878851621153c98be41c491d_23_1.png)


