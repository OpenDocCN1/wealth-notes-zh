    ## 第五章 MACD 与布林带的经典配合使用


    BOLL 指标又叫布林带指标，其英文全称是 “Bollinger Bands”，是用该指标的创立人（约翰·布林）的姓来命名的。BOLL 指标是研判股价运动趋势的一种中长期技术分析工具，属于趋势类指标。


    ## 5.1 BOLL 指标的原理和计算方法


    ### 5.1.1 BOLL 指标的原理


    BOLL 指标是美国股市分析家约翰·布林根据统计学中的标准差原理设计出来的一种非常简单实用的技术分析指标。一般而言，股价的运动总是围绕某一价值中枢（如均线、成本线等）在一定的范围内变动，布林带指标正是在上述条件的基础上，引进了
    “股价通道” 的概念，其认为股价通道的宽窄随着股价波动幅度的大小而变化，而且股价通道又具有变异性，它会随着股价的变化而自动调整。正是由于它具有灵活性、直观性和趋势性的特点，BOLL
    指标逐渐成为投资者广为应用的市场上热门指标。


    在众多技术分析指标中，BOLL 指标属于比较特殊的一类指标。绝大多数技术分析指标都是通过数量的方法构造出来的，它们本身不依赖趋势分析和形态分析，而 BOLL
    指标却与股价的形态和趋势有着密不可分的联系。BOLL 指标中的 “股价通道” 概念正是股价趋势理论的直观表现形式。BOLL 是利用 “股价通道” 来显示股价的各种价位，当股价波动很小，处于盘整时，股价通道就会变窄，这可能预示着股价的波动处于暂时的平静期；当股价波动超出狭窄的股价通道的上轨时，预示着股价的异常激烈的向上波动即将开始；当股价波动超出狭窄的股价通道的下轨时，同样也预示着股价的异常激烈的向下波动将开始。


    投资者常常会遇到两种最常见的交易陷阱：一是买低陷阱，投资者在所谓的低位买进之后，股价不仅没有止跌反而不断下跌；二是卖高陷阱，股票在所谓的高点卖出后，股价却一路上涨。布林带特别运用了爱因斯坦的相对论，认为各类市场间都是互动的，市场内和市场间的各种变化都是相对性的，是不存在绝对性的，股价的高低是相对的，股价在上轨线以上或在下轨线以下只反映该股股价相对较高或较低，投资者做出投资判断前还需综合参考其他技术指标，包括价量配合、心理类指标、类比类指标和市场间的关联数据等。


    总之，BOLL 指标中的股价通道对预测未来行情的走势起着重要的参考作用，它也是布林带指标所特有的分析手段。


    ### 5.1.2 BOLL 指标的计算方法


    在所有的指标计算中，BOLL 指标的计算方法是最复杂的之一，其中引进了统计学中的标准差概念，涉及到中轨线（MB）、上轨线（UP）和下轨线（DN）的计算。另外，和其他指标的计算一样，由于选用的计算周期的不同，BOLL
    指标也包括日 BOLL 指标、周 BOLL 指标、月 BOLL 指标年 BOLL 指标以及分钟 BOLL 指标等各种类型。经常被用于股市研判的是日 BOLL
    指标和周 BOLL 指标。虽然它们的计算时的取值有所不同，但基本的计算方法一样。


    以日 BOLL 指标计算为例，其计算方法如下：


    - 1. 日 BOLL 指标的计算公式

    中轨线 = N 日的移动平均线

    上轨线 = 中轨线 + 两倍的标准差

    下轨线 = 中轨线 - 两倍的标准差

    - 2. 日 BOLL 指标的计算过程

    （1）计算 MA

    MA = N 日内的收盘价之和 ÷ N

    （2）计算标准差 MD

    MD = 平方根 N 日的（C - MA）的两次方之和除以 N

    （3）计算 MB、UP、DN 线


    ## MACD 实战操盘用法研究


    MB=（N−1）日的 MA

    UP=MB±2×MD

    DN=MB−2×MD


    在股市分析软件中，BOLL 指标一共由四条线组成，即上轨线 UP、中轨线 MB、下轨线 DN 和价格线。其中上轨线 UP 是 UP 数值的连线，用黄色线表示；中轨线
    MB 是 MB 数值的连线，用白色线表示；下轨线 DN 是 DN 数值的连线，用紫色线表示；价格线是以 K 线表示，颜色为浅蓝色。和其它技术指标一样，在实战中，投资者不需要进行
    BOLL 指标的计算，主要是了解 BOLL 的计算方法和过程，以便更加深入地掌握 BOLL 指标的实质，为运用指标打下基础。


    ## 5.2 BOLL 指标的一般研判标准


    BOLL 指标的一般研判标准主要集中在：


    - 1. BOLL 指标中的上、中、下轨线的意义


    （1）BOLL 指标中的上、中、下轨线所形成的股价通道的移动范围是不确定的，通道的上下限随着股价的上下波动而变化。在正常情况下，股价应始终处于股价通道内运行。如果股价脱离股价通道运行，则意味着行情处于极端的状态下。


    （2）在 BOLL 指标中，股价通道的上下轨是显示股价安全运行的最高价位和最低价位。上轨线、中轨线和下轨线都可以对股价的运行起到支撑作用，而上轨线和中轨线有时则会对股价的运行起到压力作用。


    （3）一般而言，当股价在布林带的中轨线上方运行时，表明股价处于强势趋势；当股价在布林带的中轨线下方运行时，表明股价处于弱势趋势。


    - 2. BOLL 指标中的上、中、下轨线之间的关系


    （1）当布林带的上、中、下轨线同时向上运行时，表明股价强势特征非常明显，股价短期内将继续上涨，投资者应坚决持股待涨或逢低买入。


    （2）当布林带的上、中、下轨线同时向下运行时，表明股价的弱势特征非常明显，股价短期内将继续下跌，投资者应坚决持币观望或逢高卖出。


    （3）当布林带的上轨线向下运行，而中轨线和下轨线却还在向上运行时，表明股价处于整理态势之中。如果股价是处于长期上升趋势时，则表明股价是上昇途中的强势整理，投资者可以持股观望或逢低短线买入；如果股价是处于长期下跌趋势时，则表明股价是下跌途中的弱势整理，投资者应以持币观望或逢高减仓为主。


    （4）布林带的上轨线向上运行，而中轨线和下轨线同时向下运行的可能性非常小，这里就不作研判。


    （5）当布林带的稳定上、中、下轨线几乎同时处于水平方向横向运行时，则要看股价目前的走势处于什么样的情况下来判断。


    ①当股价前期一直处于长时间的下跌行情后开始出现布林带的稳定三条线横向移动时，表明股价是处于构筑底部阶段，投资者可以开始分批少量建仓。一旦三条线向上发散则可加大买入力度。


    ②当股价前期是处于小幅的上涨行情后开始出现布林带的稳定三条线横向移动，表明股价是处于上升阶段的整理行情，投资者可以持股待涨或逢低短线吸纳，一旦三条线向上发散则可短线加码买入。


    ③当股价刚刚经历一轮大跌行情时开始出现布林带的稳定三条线横向移动，表明股价是处于下跌阶段的整理行情，投资者应以持币观望和逢高减磅为主，一旦三条线向下发散则坚决清仓离场。


    ④布林带三条线在顶部横向运动的可能性极小，这里也不作研判。


    - 3. K 线和布林带上、中、下轨之间的关系


    （1）当 K 线从布林带的稳定中轨线以下、向上突破布林带中轨线时，预示着股价的强势特征开始出现，股价将上涨，投资者应以中长线买入股票为主。


    （2）当 K 线从布林带的稳定中轨线以上、向上突破布林带上轨时，预示着股价的强势特征已经确立，股价将可能短线大涨，投资者应以持股待涨或短线买入为主。


    （3）当 K 线向上突破布林带上轨以后，其运动方向继续向上时，如果布林带的稳定上、中、下轨线的运动方向也同时向上，则预示着股市的强势特征依旧，股价短期内还将上涨，投资者应坚决持股待涨，直到
    K 线的运动方向开始有掉头向下的迹象时才密切注意行情是否转势。


    （4）当 K 线在布林带上方向上运动了一段时间后，如果 K 线的运动方向开始掉头向下，投资者应格外小心，一旦 K 线掉头向下并突破布林带上轨时，预示着股价短期的强势行情可能结束，股价短期内将大跌，投资者应及时短线卖出股票、离场观望。特别是对于那些短线涨幅很大的股票。


    ## MACD 实战操盘用法研究


    （5）当 K 线从布林带的上方、向下突破布林带上轨后，如果布林带的 пище的、上、中、下轨线的运动方向也开始同时向下，预示着股价的短期强势行情即将结束，股价的短期走势不容乐观，投资者应以逢高减磅为主。


    （6）当 K 线从布林带中轨上方、向下突破布林带的 入轨时，预示着股价前期的强势行情已经结束，股价的中期下跌趋势已经形成，投资者应中线及时卖出股票。如果布林带的通、中、下线也同时向下则更能确认。


    （7）当 K 线向下跌破布林带的下轨并继续向下时，预示着股价处于极度弱势行情，投资者应坚决以持币观望为主，尽量不买入股票。


    （8）当 K 线在布林带下轨运行了一段时间后，如果 K 线的运动方向有掉头向上的迹象时，表明股价短期内将止跌企稳，投资者可以少量逢低建仓。


    （9）当 K 线从布林带下轨下方、向上突破布林带下轨时，预示着股价的短期行情可能回暖，投资者可以及时适量买进股票，作短线反弹行情。


    （10）当 K 线一直处于中轨线上方，并和中轨线一起向上运动时，表明股价处于强势上涨过程中，只要 K 线不跌破中轨线，投资者坚决一路持股。


    （11）当 K 线一直处于中轨线下方，并和中轨线一起向下运动时，表明股价处于弱势下跌过程中，只要 K 线不向上反转突破中轨线，稳健的投资者都可一路观望。


    ## 5.3 BOLL 指标的特殊分析方法


    ### 5.3.1 布林带 “喇叭口” 的研判


    布林带 “喇叭口” 的研判是 BOLL 指标所独有的研判手段。所谓布林带 “喇叭口” 是指在股价运行的过程中，布林带的上轨线和下轨线分别从两个相反的方向与中轨线大幅扩张或靠拢而形成的类似于喇叭口的特殊形状。根据布林带上轨线和下轨线运行方向和所处的位置的不同，我们又可以将
    “喇叭口” 分为开口型喇叭口、收口型喇叭口和紧口型喇叭口三种类型。开口型喇叭口形态常出现在股票短期内暴涨行情的初期，收口型喇叭口形态常出现在股票暴跌行情的初期，紧口型喇叭口形态则常出现在股价大幅下跌的末期。


    ### （一）开口型喇叭口


    当股价经过长时间的底部整理后，布林带的 cuestion 上轨线和下轨线逐渐收缩，上下轨线之间的距离越来越小，随着成交量的逐渐放大，股价突然出现向上急速飙升的行情，此时布林带上轨线也同时急速向上扬升，而下轨线却加速向下运动，这样布林带上下轨之间的形状就形成了一个类似于大喇叭的特殊形态，我们把布林带的这种喇叭口称为开口型喇叭口。


    开口型喇叭口是一种显示股价短线大幅向上突破的形态。它是形成于股价经过长时间的低位横盘筑底后，面临着向上变盘时所出现的一种走势。布林带的上、下轨线出现方向截然相反而力度却很大的走势，预示着多头力量逐渐强大而空头力量逐步衰竭，股价将处于短期大幅拉升行情之中。


    开口型喇叭口形态的形成必须具备两个条件：其一，是股价要经过长时间的中低位横盘整理，整理时间越长、上下轨之间的距离越小则未来上涨的幅度越大；其二，是布林带开始开口时要有明显大的成交量出现。


    开口喇叭口形态的确立是以 K 线（或 K 线）向上突破上轨线、股价带量向上突破中长期均线为准。对于开口喇叭口形态的出现，投资者如能及时短线买进定会获利丰厚。


    ![](img/e00f2195878851621153c98be41c491d_130_0.png)


    图 5.1 开口型喇叭口


    ### （二）收口型喇叭口


    当股价经过短时间的大幅拉升后，布林带的上轨线和下轨线逐渐扩张，上下轨线之间的距离越来越大，随着成交量的逐步减少，股价在高位出现了急速下跌的行情，此时布林带的上轨线开始急速掉头向下，而下轨线还在加速上升，这样布林带上下轨之间的形状就变成一个类似于倒的大喇叭的特殊形态，我们把布林带的这种喇叭口称为收口型喇叭口。


    收口型喇叭口是一种显示股价短线大幅向下突破的形态。它是形成于股价经过短时期的大幅拉升后，面临着向下变盘时所出现的一种走势。布林带的上下轨线出现方向截然相反而力度很大的走势，预示着空头力量逐渐强大而多头力量开始衰竭，股价将处于短期大幅下跌的行情之中。


    收口型喇叭口形态的形成虽然对成交量没有要求，但它也必须具备一个条件：即股价经过前期大幅的短线拉升，拉升的幅度越大、上下轨之间的距离越大，则未来下跌幅度越大。


    收口型喇叭口形态的确立是以股价的上轨线开始掉头向下、股价向下跌破短期均线为准。对于收口型喇叭口形态的出现，投资者如能及时卖出则能保住收益，减少较大的下跌损失。


    ![](img/e00f2195878851621153c98be41c491d_131_0.png)


    图 5.2 收口型喇叭口


    ### （三）紧口型喇叭口


    当股价经过长时间的下跌后，布林带的上下轨向中轨逐渐靠拢，上


    下轨之间的距离越来越小，随着成交量的越来越小，股价在低位的反复振荡，此时布林带的-derived 上轨还在向下运动，而下轨线却在缓慢上升。这样布林带上下轨之间的形状就变成一个类似于倒的小喇叭的特殊形态，我们把布林带的这种喇叭口称为紧口型喇叭口。


    紧口型喇叭口是一种显示股价将长期小幅盘整筑底的形态。它是形成于股价经过长期大幅下跌后，面临着长期调整的一种走势。布林带的上下轨线的逐步小幅靠拢，预示着多空双方的力量逐步处于平衡，股价将处于长期横盘整理的行情中。


    紧口型喇叭口形态的形成条件和确认标准比较宽松，只要股价经过较长时间的大幅下跌后，成交极度萎缩，上下轨之间的距离越来越小的时候就可认定紧口型喇叭初步形成。当紧口型喇叭口出现后，投资者既可以观望等待，也可以少量建仓。


    ![](img/e00f2195878851621153c98be41c491d_132_0.png)


    图 5.3 紧口型喇叭口


    上图 5.3 是白糖日线图，图中标示出了紧口型喇叭、开口型喇叭和收口型喇叭。


