    # 一、对称三角形


    对称三角形（或称绕线筒）通常是一种持续形态。它代表现存趋势的停顿，此后原有的趋势会继续发展。在图7.6的例子中，先前的趋势向上，因此三角形巩固形态之后市场向上的可能性大。如果趋势已经向下，那么对称三角形就有看跌的含义。


    三角形至少需要有四个转折点。要记住两个点才能成一线。因此，为了绘制两条会聚的趋势线，市场必须触及每根线两次。在图7.6中，三角形实际上从点1开始，这是上升趋势中巩固形态开始的地方。市场随后回撤至点2，然后反弹到点3。然而，点3低于点1。一旦市场已经从点3回落，我们就能绘制出上边趋势线。


    注意，点4高于点2。只有在市场从点4向上反弹时，我们才能绘制上倾的下边线。正是这个时候，分析人士开始察觉他或她正在研究对称三角形。现在有了四个转折点（1、2、3和4），以及两条会聚趋势线。


    看涨对称三角形的例子。注意两根会聚的趋势线，市场收于任何一根趋势线之外都完成了形态，左侧的竖线是底边，右侧两线的交汇点是顶点。


    上升三角形的例子。注意平坦的上边线和上升的下边线，这通常是一种看涨形态。


    # 图 7.6


    ![](img/e00f2195878851621153c98be41c491d_157_0.png)


    下降三角形的例子。注意平坦的底边线和下降的上边线。这通常是一种看跌形态。


    戴尔公司的股价在1997年第四季度形成了一个看涨对称三角形。从左至右度量，三角形的宽度是18周。市场在第十三周突破（见圆圈），刚刚超出三分之一的位置。


    # 图 7.7


    ![](img/e00f2195878851621153c98be41c491d_157_1.png)


    ![](img/e00f2195878851621153c98be41c491d_157_2.png)


    虽然三角形最低要求四个转折点，但许多三角形有六个转折点。这意味着，在恢复上升趋势前，在三角形内实际上有合起来形成五个浪的三个波峰和三个波谷。（在进入艾略特波浪理论时，我们将进一步讨论三角形中的五浪倾向。）


    ## 二、三角形完结的时间极限


    这种形态的完结有时间极限，那就是两边线的交点——顶点。一般来说，市场应该在三角形水平宽度的三分之二到四分之三的位置上沿先前趋势的方向突破。三角形水平宽度是左侧竖直的底边到右侧顶点的距离。由于两条边线必定在某处相交，所以一旦画出两条会聚的边线就可测得这段时间距离。市场穿越上边趋势线发出向上突破的信号。如果市场在三角形内超出了四分之三的宽度，那么这个三角形就开始失去力量，通常也就意味着市场将浮动至顶点，甚至顶点之外。


    因此，三角形提供了价格与时间的有趣结合。会聚的趋势线给出了形态的价格边界，并指明形态何时完成，以及原有的趋势因市场穿越上升趋势线而得到恢复（在上升趋势的情况下）。但是，这些趋势线还通过度量形态的宽度提供了时间目标。例如，如果宽度为20个星期，那么突破就应发生在第13周到第15周之间的某个时刻。


    实际的趋势信号用收盘价穿越某条趋势线发出的。有时，在突破之后，市场会回抽被穿越的趋势线。在上升趋势中，这条趋势线已经变成支撑线。在下降趋势中，下边线一旦被突破就变成阻力线。突破出现后，顶点也是重要的支撑位或阻力位。对于这种突破可以应用各种类似于前两章涉及的穿越规则。最低穿越标准是市场收于趋势线之外，而非仅仅是日内穿越。


    ## 三、成交量的重要性


    成交量应随着价格摆动在三角形内的收窄而萎缩。在所有巩固形态中都存在成交量收缩的倾向。但是，当市场穿越趋势线从而完成形态时，成交量应明显增加。回抽时的成交量应萎缩，然后当趋势恢复时交易活动应更加频繁。


    对于成交量还需提到两点。同反转形态的情况一样，成交量在上涨时比在下跌时更重要。在所有巩固形态中，成交量的放大对于恢复上升趋势至关重要。


    关于成交量的第二点是，尽管交易活动在形态的构造过程中萎缩，但仔细考察成交量通常仍可给出成交量是在上涨中放大还是在下跌中放大的线索。例如，在上升趋势中，成交量应有在反弹时放大而在下跌时萎缩的微弱倾向。


    ## 四、测算技法


    三角形也有测算技法。在对称三角形的情况下，一般可以采用两种方法。最简单的技法是测出三角形最宽处（底边）的竖线高度，然后从突破点测出这段距离。下图显示了从突破点投射出的这段距离，这是作者比较偏爱的技法。


    第二种方法是从底边的顶点（点A处）作出一条平行于下趋势线的平行线。这条上通道线因此成了上升趋势中的上升目标。


    ![](img/e00f2195878851621153c98be41c491d_159_0.png)


    对称三角形的价格目标有两种测算方法：第一种是量出底边（AB）的高度；从点C处突破点投射出这段竖直距离。另一种方法是从底边顶部(A)绘制一条平行于三角形下边线的平行线。


    # 图 7.8


    ## 五、上升三角形


    上升三角形和下降三角形都是对称三角形的变体，但是有不同的预测推断。下面7.9两图是上升三角形的例子。注意上边趋势线是平坦的，而下边线是上升的。这个形态说明买方比卖方更为积极主动。它被认为是看涨形态，因此通常以向上的突破告终。


    上升三角形和下降三角形都与对称三角形存在重要的区别。上升三角和下降三角形形式无论在趋势结构中的何处出现，都有非常明确的预测推断。上升三角形看涨，而下降三角形看跌。相比之下，对称三角形本质上是一种中性形态。然而，这并不意味着对称三角形没有预测价值。相反，由于对称三角形是一种持续形态，因此分析人士只需看清原有趋势的方向，然后假设该趋势会继续。


    让我们回到上升三角形。如前所述，上升三角形经常是看涨的。


    ![](img/e00f2195878851621153c98be41c491d_160_0.png)


    上升三角形，市场收于上边线之上完成形态。这种突破应当带有巨量。这条上边阻力线应当在突破之后对市场后续的回调起到支撑作用。通过测量正三角形的高度（AB）并从C处的突破点向上投射出这段距离，就可得到最小的价格目标。


    ![](img/e00f2195878851621153c98be41c491d_160_1.png)


    道琼斯运输股指数在1997年末形成了一个看涨的上升三角形。注意3400点处的平坦的上边线以及上升的下边线。这种形态常见一种看涨形态，无论它出现在走势图何在。


    # 图 7.9


    涨突破以收盘价明显高于平坦的上边趋势线为信号。正如在所有向上的有效突破中那样，成交量应在突破时明显增加。回抽至支撑线（平坦的上边线）并不罕见，而且应伴随着较小的成交量。


    ## 六、测算技法


    上升三角形的测算技法相对简单。只需量出该形态最宽处的高度，然后从突破点投射出这段竖直距离。这只是另一个利用价格形态的波动性来确定最小价格目标的例子。


    ## 七、作为底部的上升三角形


    尽管上升三角形经常出现在上升趋势中，并被认为是持续形态，但是它有时也会以筑底形态出现。在下降趋势的末端看到上升三角形的发展不足为奇。然而，即使在这种情况下，对该形态的研判仍然是看涨的。突破上边线标志着底部的完成，并被认为是看涨的信号。上升三角形和下降三角形有时也被称作直角三角形。


    ## 八、下降三角形


    下降三角形仅仅是上升三角形的镜像，因此通常被认为是看跌形态。注意在下边7.10左右两图中，上边线下降而下边线平坦。这种形态说明卖方比买方更为积极主动，因此通常是以向下突破告终。向下的信号以收盘价明显低于下边趋势线为标志，并且通常伴随着成交量的增加。回抽有时会出现，它应在下边趋势线遇到阻力。


    其测算技法与上升三角形的完全相同，即分析人士先在左侧底边测得形态的高度，然后从突破点向下投射这段距离。


    ![](img/e00f2195878851621153c98be41c491d_161_0.png)


    下降三角形。收盘价明显处于下侧水平线之下时，这个看跌形态就完成了。测算技法是从点C处的突破点起向下投射三角形高度(AB)。


    ![](img/e00f2195878851621153c98be41c491d_161_1.png)


    杜邦在1997年夏季形成的看跌下降三角形。它的上边线下降而下边线平坦，股价在10月初跌破下边线完成了形态。


    # 图 7.10


    ## 九、作为顶部的下降三角形


    尽管下降三角形是一种持续形态，而且通常在下降趋势中出现，但下降三角形偶尔出现在市场顶部也不足为奇。当这种类型的形态的确出现在筑顶过程中时，并不难辨认。在这种情况下，收盘价低于平坦的下边线可能就标志着大势向下反转。


    ## 十、成交量形态


    成交量形态在上升三角形和下降三角形中很相像，都是成交量随三角形的完成而萎缩然后又在突破时放出。就好像在对称三角形中那样，在其构建过程中走势图分析人士能够探测到成交量形态随价格摆动呈现出的细微变化。这意味着，在上升形态中，成交量倾向于在反弹时稍稍放大，而在回落时稍稍萎缩。在下降形态中，成交量应在价格下跌时放大而在反弹时萎缩。


    ## 十一、三角形中的时间因素


    对于三角形，要考虑的最后一个因素是时间维。三角形被认为是中期形态，这意味着它通常需要花费1个月以上的时间才能形成，但一般少于3个月。持续时间短于1个月的三角形可能属于另一种形态，例如尖旗形——稍后我们会谈到。如前所述，三角形有时也会出现在长期价格走势图上，但它们的基本含义永远相同。


    ![](img/e00f2195878851621153c98be41c491d_162_0.png)


    # 图 7.11


    ![](img/e00f2195878851621153c98be41c491d_162_1.png)


