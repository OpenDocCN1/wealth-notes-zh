    2. 当 K 线（或 K 线）向上突破布林带中轨后，如果股价依托布林带中轨向上攀升时，则意味着股价的中短期向上趋势已经形成，这是布林带指标揭示的逢低买入或持股标志。


    3. 当 K 线（或 K 线）向下跌破布林带中轨时，如果股价也先后跌破中短期均线，则意味着股价的中短期向下阴跌趋势开始形成，这是布林带指标揭示的中短期卖出标志。


    4. 当 K 线（或 K 线）向上突破布林带中轨后，如果股价被布林带中轨压制下行时，则意味着股价的中短期下降趋势已经形成，这是布林带指标揭示的持币观望标志。


    ## 5. BOLL 指标与 KDJ 指标的配合使用。


    KDJ 指标是超买超卖类指标，而布林带则是支撑压力类指标。两者结合在一起的好处是：可以使 KDJ 指标的信号更为精准，同时，由于价格日 K 线指标体系中的布林带指标，往往反映的是价格的中期运行趋势，因此利用这两个指标来判定价格到底是短期波动，还是中期波动具有一定作用，尤其适用于判断价格到底是短期见顶（底），还是进入了中期上涨（下跌），具有比较好的研判效果。


    我们知道，布林带中的上轨有压力作用，中轨和下轨有支撑（压力）作用，因此当价格下跌到布林带中轨或者下档时，可以不理会 KDJ 指标所发出的信号而采取操作。当然，如果
    KDJ 指标也走到了低位，那么应视作短期趋势与中期趋势相互验证的结果，而采取更为积极的操作策略。但要注意的是：当价格下跌到布林带下轨时，即使受到支撑而出现回稳，KDJ
    指标也同步上升，可趋势转向的信号已经发出，所以至多只能抢一次反弹。而当 KDJ 指标走上 80 高位时，采取卖出行动就较为稳妥，因为当股价跌破布林带中轨后将引发布林带开口变窄，此时要修复指标至少需要进行较长时间的盘整，所以说无论从防范下跌风险，还是从考虑持有的机会成本来看，都不宜继续持有。


    ## 5.4 MACD 与布林带的经典配合技巧


    ### 一、横盘时利用 MACD 提前预知布林带开口方向


    在较长时期横盘的时候，布林带中轨是平的，此时如果 MACD 金叉，我们可以提前判断布林带将开口上涨，我们可以提前利用 MACD 金叉做多。同时在横盘时，布林带是平的，如果
    MACD 死叉，我们可以提前判断布林带将开口向下，可以提前利用 MACD 死叉做空。


