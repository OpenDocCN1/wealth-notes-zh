    ### 四、瀑布线的持币信号研判


    +   1. 瀑布线在高价区由多头排列向汇聚发展。

    +   2. 瀑布线形成多重死叉，表明股价有继续走弱的趋势。

    +   3. 瀑布线由高位汇聚开始向下发散。


