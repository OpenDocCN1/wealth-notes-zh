    # 六、调整价格目标


    在试图预测价格目标时，应当考虑到其他一些因素。来自价格形态的测算技法，如刚刚介绍过的关于头肩顶的，仅是第一个步骤。还有其他要考虑的技术因素。例如，在先前的牛市期间形成的反作用最低点留下的明显支撑位到哪里去了呢？熊市经常会在这些位置驻足。百分比回撤怎样？最大目标会是对先前牛市
    100％的回撤。但 50％和 66％的回撤位到哪里去了呢？这些位置常常在市场下方提供了重要的支撑。市场下方明显的价格缺口怎样？它们经常起到支撑区域的功能。市场下方有明显的长期趋势线吗？


    技术分析人士必须考虑其他技术数据，以精确地从价格形态得出价格目标。例如，如果向下的价格测算预计目标在 30，而在 32 的位置有明显的支撑，那么走势图技术分析人士会明智地调整下跌目标至
    32，而非 30。一般地，当预测的价格目标与明显的支撑位或阻力位存在微小的差别时，将价格目标调整到这些支撑位或阻力位上通常很安全。为把其他技术数据考虑在内，常常很有必要调整从价格形态测得的价格目标。分析人士有许多不同的工具供他或她支配。技术最娴熟的分析人士是那些懂得如何适当地混合所有这些工具的人士。


    # 七、倒头肩形


    头肩底，有时也称为倒头肩形，恰好是头肩顶的镜像。头肩底有三个清晰的底，而头（中间的波谷）略低于两肩。市场明显穿越颈线收盘也是完成形态所必需的，而且测算技法也一样。在底部唯一的轻微差别是，当市场向上突破颈线后更惯于反抽。


    头肩顶与头肩底最重要的区别在于成交量的排列。成交量在鉴别和完成头肩底形态中扮演着更为重要的角色。这一点通常适用于所有的底部形态。前面曾讲过，市场有一种 “因自重下跌”
    的倾向。然而，在底部，市场需要买压的大幅增加——反映在更高的成交量上，以发动新一轮的牛市。下面两小图就是头肩底的理论图形和时机例子。


    看待这个差别的一个更技术的方法是，市场可以仅因惯性而下滑。需求不足或者交易者的买意缺乏常常足以压低市场；但市场不会因惯性'
  - '[PAGE 151]


    # 图 7.2


    ![](img/e00f2195878851621153c98be41c491d_151_0.png)


    倒头肩形的例子。这种形态的底部基本上是顶部的镜像。唯一的近期区别是后半部的成交量形态。从头部开始的反弹应该当较大成交量的配合，而当市场突破颈线时，应看到交易活动暴增。反抽颈线在底部更常见。


    ![](img/e00f2195878851621153c98be41c491d_151_1.png)


    倒头肩底。颈线略微向下倾斜，这很正常。市场突破颈线后的回撤（见箭头）稍稍跌破了颈线，但随后恢复了上升趋势。


    而上扬。市场只有在需求超过供给，并且买方比卖方更进取时才会上涨。


    对于头肩形的前半部分，底部的成交量形态与顶部的很相似。也就是说，头的成交量比左肩的稍少。然而，从头开始的反弹不但应该显示出交易活动的增加，而且其成交量常常超过从左肩开始的反弹伴随的成交量。市场微调至右肩时的成交量应该很小。关键点发生在穿越颈线的上扬行情中。如果是真突破，这个信号必须伴随着成交量的骤放。


    这一点是头肩底与头肩顶的最大差别。在底部，巨量绝对是完成筑底形态的要素。相比在顶部，反抽在底部更常见，但必须伴随着微弱的成交量。随后，新的上升趋势应当在更大的成交量上恢复。头肩底的测算技法与头肩顶的相同。


    # 八、颈线的倾斜


    顶部的颈线通常稍微向上倾斜。但有时，它是水平的。在两种情况下，它们带来的差异不大。然而，顶部的颈线偶尔会向下倾斜。这种倾斜是市场走弱的信号，而且通常伴随着疲软的右肩。但这祸福参半。等待市场跌破颈线以建立空头仓位的分析人士不得不稍做等待，因为从向下倾斜的颈线发出的信号出现得很晚，而且会在大部分市场运动已经完成之后出现。对于筑底形态来说，大多数颈线都略微向下倾斜。向上倾斜的颈线是市场力度更强的信号，但也有给出信号过迟的缺陷。


    # 九、复合头肩形


    有时会出现一种头肩形的变体，称为复合头肩形形态。这些是双头，'
  - '[PAGE 152]


    或双左肩和双右肩可能出现的形态。这些形态不那么常见，但有同样的测算推断。在这方面的一个窍门是头肩形具有强烈的对称倾向。这意味着，单左肩通常对应着单右肩，而双左肩增加了出现双右肩的可能性。


    # 十、策略


    市场策略在所有交易中扮演着重要角色。并非所有的技术派交易者都喜欢等到市场突破颈线后再建仓。相信已经正确地识别出头肩底的更为进取的交易者，会在右肩形成过程中开始尝试做多。否则他们会在右肩下跌结束的第一个信号出现时买进。


    有些人会测量市场从头的底部反弹的距离（点 C 至 D），然后在对反弹 50% 或 60% 的回撤位置买进。还有些人会沿着点 D 至 E 的下跌行情绘制一根短期的下降趋势线，并在市场第一次突破该趋势线时买进。由于这些形态相当对称，因此有些人会在右肩接近左肩的相同位置时买进。大量预期性的买进发生在右肩形成的过程中。如果最初的尝试性多头仓位证明有利可图，那么就可在市场果真穿越颈线或在突破后反抽颈线时追加仓位。下图
    7.3 为复合头肩形。


    ![](img/e00f2195878851621153c98be41c491d_152_0.png)


    对头肩底的市场策略。许多技术派交易者会在右肩（E）仍处于形成过程中时开始建立多头仓位。对点 C 至 D 的反弹的一半至三分之二的回撤——到达与点 A 处的左肩相同位置的下跌行情，或者市场突破短期下降趋势线（线
    1）都提供了入市的先机。当市场突破颈线或反抽颈线时，可以追加仓位。


    # 图 7.3


    # 十一、失败的头肩形


    一旦穿越颈线并完成了头肩形形态，市场就不应再越过颈线。在顶部，一旦市场向下突破颈线，那么任何明显收于颈线上方的现象都是严重的警告：最初的向下突破很可能是个无效的信号，并创造了通常所说的失败的头肩形。这种类型的形态以经典的头肩形反转开始，但在其发'
  - '[PAGE 153]


    # MACD 实战操盘用法研究


    展过程中的某个时刻（无论是在市场突破颈线之前还是稍稍过后），市场恢复了原先的趋势。


    这里有两个重要的教训。第一个是这些走势图形态没有哪一个是一贯正确的。它们在大多数时候有效，但并非总是如此。第二个教训是，技术派交易者必须永远警惕错误分析的走势图信号。在金融市场生存的关键之一是使交易损失保持最小，并尽快从正在亏损的交易中退出。走势图分析的最大优势之一是其迅速警告交易者他或她正处于市场中的错误一方。迅速认识交易失误并迅速采取防御措施的能力和意志力，在金融市场中是难能可贵的。


    # 十二、头肩形作为巩固形态


    在进入下一种价格形态之前，关于头肩形还有最后一点要说明。我们开始讨论时曾把它列为主要反转形态中最著名且最可靠的。然而，应该警告你，这种结构偶尔也会充当巩固形态而不是反转形态。如果出现这种情况，那么与其说是规则，不如说是例外。在本章“持续形态”中，我们将更多地讨论这个问题。


    # 7.1.2 双顶（M头）和双底（W底）


    更常见的反转形态是双顶或双底。它们出现的频率和易于识别的程度仅次于头肩形。下面两图展示了双顶和双底变化。出于显而易见的原因，这种顶经常被称为“M顶”，而这种底被称为“W底”。双顶的总体特征与头肩顶和三重顶的相似，只是它只有两个波峰，而不是三个。成交量形态与测算规则也都相似。


    ![](img/e00f2195878851621153c98be41c491d_153_0.png)


    ![](img/e00f2195878851621153c98be41c491d_153_1.png)


    图 7.4'
  - '[PAGE 154]


    在上升趋势中（如7.4左图所示），市场在点A处创出新高——通常伴随着增加的成交量，然后以萎缩的成交量下跌至点B。至此，一切均符合上升趋势的要求。然而，至点C的下一轮上升行情以收盘价衡量无力穿越点A处的前一个波峰，并开始再度下滑。一个潜在的双顶已经确立。我用“潜在”这个词是因为，就像在所有反转形态中那样，在市场按收盘价衡量没有击穿点三处的前一个支撑点之前，反转还未成立。在此之前，市场可能仅仅处于横向巩固阶段，准备恢复原先的趋势。


    理想的双顶有两个处于相同价位的明显的波峰。成交量往往在第一个波峰期间较大，而在第二波峰期间较小。市场以大量明显收在点B处的波谷之下时，就完成了这个形态，并标志着趋势向下反转。在下降趋势恢复之前，市场反抽突破点的现象并不少见。


    # 一、双顶的测算技法


    双顶的测算技法是从突破点（市场跌破点B处的中间的波谷时的价位）向下投射形态的高度。另一种替代方案是，测量出下跌的第一个段（点A至B）的高度，并从点B处的中间的波谷向下投射这段长度。双底的测算方法与此相同，但方向相反。


    # 二、理想形态的变体


    就像在大多数其他市场分析领域中一样，现实生活中的例子通常是理想模型的某种变体。例如，双顶的两个波峰有时并不正好处于同一价位上。有时第二个波峰达不到第一个波峰的高度，这并不是大问题。的确成问题的是当第二个波峰实际上略微超过第一个波峰的时候。起初貌似有效的向上突破并恢复上升趋势的走势可能最终证明是筑顶过程的一部分。为了解决这个两难问题，已经提到过的某些过滤标准或许派得上用场。


    # 三、过滤器


    大多数走势图分析人士首先要求收盘价超出前一个阻力波峰，而不仅仅是日内穿越。其次，我们还可采用某种价格过滤器。这样的一個例子是百分比穿越标准（如1%或3%）。最后，双日穿越原则可以用作时间过滤器。换言之，市场必须连续两天收在第一个波峰之上，以发出有效穿越的信号。另一个时间过滤器可以是周五收于前面的波峰之上。向上突破时伴随的成交量也可能提供有效突破的线索。


    波峰或波谷间的时间很重要，形态的规模始终很重要。两个波峰间'
  - '[PAGE 155]


    的时间越长，形态的高度越大，即将临的反转的潜力就越大。所有走势图形态都是如此。一般来说，大多数有效的双顶或双底应当在两个波峰或波谷间有一个月的间隔。有时甚至是两或三个月。（在范围更广的月走势图和周走势图上，这些形态可能跨越几年。）这里讨论所使用的大部分例子都已介绍了市场顶部。读者现在应该清楚，筑底形态是顶部的镜像，除了某些本章开头已经接触到的一般差别之外。


    # 7.1.3 三重顶和三重底


    大多数在处理头肩形形态时涉及的要点也适用于其他类型的反转形态。少见的三重顶或三重底只是头肩形的小变体。它们之间的主要区别是，三重顶或三重底的三个波峰或波谷处于大致相同的价位。至于反转形态到底是头肩形还是三重顶，走势图分析人士常有争议。这种争论是学术性的，因为两者的含义相同。


    ![](img/e00f2195878851621153c98be41c491d_155_0.png)


    三重顶。除了所有的波峰都处在同一价位之外，与头肩形相似。每个上升行情的波峰应伴随较少的成交量。当市场放弃跌破两个波谷时形态完成。测算方法是从突破点向下投影形态的高度。反抽下面一根直线现象并不少见。


    ![](img/e00f2195878851621153c98be41c491d_155_1.png)


    三重底。除了每个低点均处于同一价位之外，与头肩底相似。它是三重顶的镜像，只是在向上突破时成交量更加重要。


    # 图 7.5


    在顶部，成交量往往随相继的每个波峰萎缩，而且应在向下突破点增加。三重顶直到沿其间最低点的支撑位被向下突破后才得以完成。反过来，在底部，市场必须收在其间的两个波峰之上以完成三重形态。（作为替代策略，市场突破最近的波峰或波谷也可作为反转信号。）在底部形态完成时，向上突破的巨量也是非常关键的。


    它们的测算推断与头肩形的相似，也是基于形态的高度。市场通常会从突破点开始运行的最小距离是形态的高度。一旦突破出现，反抽突破点的现象并不少见。由于三重顶或三重底仅代表头肩形的微小变化，这里我们就不再赘述。'
  - '[PAGE 156]


    # 7.2 持续形态


    下文涉及的走势图形态称作持续形态。这些形态通常表示走势图上横走的价格行为仅仅是大势的停顿，而且市场的下一步运动将与这个结构前的趋势同向。这使这组形态有别前一章的那些形态，后者通常表明重要的趋势反转正在形成。


    反转形态与持续形态之间的一个差别在于它们的持续时间。反转形态通常需要长得多的时间来构造，而且代表着重要的趋势变化。另外，持续形态的持续时间通常较短，而且被更精确地归为短期形态或中间形态。


    注意总在使用的“通常”一词。对待所有的走势图形态都必定涉及普遍的倾向性，而非严格的规则。例外总会存在。甚至把价格形态聚合成不同的类别有时都变得非常微妙。三角形通常属于持续形态，但有时会作为反转形态出现。尽管三角形通常被看作中期形态，但它们偶尔会出现在长期走势图上并具有主要趋势的意义。三角形的一种变体——颠倒的变化——通常标志着市场的主要顶部。甚至于头肩形这种广为人知的
    主要反转形态，偶尔也会被视作巩固形态。


    即使允许存在一定程度的含混和偶尔的例外，走势图形态的确通常归结为上述两种类型，而且只要研判得当，就能帮助走势图分析人士确定市场在未来大多数时候的走势。


    # 7.2.1 三角形


    让我们开始研究三角形这种持续形态。有三类三角形——对称三角形、上升三角形和下降三角形。（某些走势图分析人士还把扩散三角形或变宽结构纳入三角形的第四种类型。后面我们将分开处理这种形态。）每种三角形都有差别不大的形状，并有不同的预测推断。


    对称三角形（见下边7.6左图）显示出两条会聚的趋势线，上边线下降而下边线上升。左侧的竖线称作底边，表示的是形态的高度。右侧的交汇点称为顶点，是两条直线相遇的地方，对称三角形也称为绕线筒。


    上升三角形有上升的下边线以及平坦或水平的上边线（见下边7.7右图）。相比之下，下降三角形（见7.7下降三角形左图）有下降的上边线以及平坦或水平的下边线。让我们来看看如何解释每一种三角形。'
