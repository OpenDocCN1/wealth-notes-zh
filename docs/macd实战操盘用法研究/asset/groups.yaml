    ## 2. 超买超卖信号


    根据 KDJ 的取值，可将其划分为几个区域，即超买区、超卖区和徘徊区。按一般划分标准，K、D、J 这三值在 20 以下为超卖区，是买入信号；K、D、J 这三值在
    80 以上为超买区，是卖出信号；K、D、J 这三值在 20～80 之间为徘徊区，宜观望。


    ## 3. 多空力量对比


    一般而言，当 K、D、J 三值在 50 附近时，表示多空双方力量均衡；当 K、D、J 三值都大于 50 时，表示多方力量占优；当 K、D、J 三值都小于 50
    时，表示空方力量占优。


    ## 4. 超买超卖分析


    当 KD 达到 80～100 时，就是超买，后市可能要回调下跌；当 KD 达到 0～20 时，就是超卖，后市可能要反弹上涨。


    超买超卖非常重要，开多单尽量选择 KD50 以下入场，最好超卖时入场；开空单尽量选择 50 以上进场，最好选择超买时入场。前提是做顺势单。核心精髓就是涨势回调多单入场，跌势反弹空单入场，顺大势逆小势做单。


    ## 5. J 大于 100 后，市场进入强势，但是要随时谨防回调，如果是跌势，可以随时准备开空单；J 小于 0 后，市场进入弱势，空单随时谨防反弹；如果是涨势，可以准备随时抄底。


    ## （二）KDJ 曲线的形态


    KDJ 指标的研判还可以从 KDJ 曲线的形态来分析。当 KDJ 指标曲线图形形成头肩顶底形态、双重顶底形态（即 M 头、W 底）及三重顶底等形态时，也可以按照形态理论的研判方法加以分析。KDJ
    曲线出现的各种形态是判断行情走势、决定买卖时机的一种分析方法。另外，KDJ 指标曲线还可以划趋势线、压力线和支撑线等。


    ## 1. 当 KDJ 曲线在 50 上方的高位时，如果 KDJ 曲线的走势形成 M 头或三重顶等顶部反转形态，可能预示着股价由强势转为弱势，股价即将大跌，应及时卖出股票。如果股价的曲线也出现同样形态则更可确认，其跌幅可以用
    M 头、三重顶、下降双顶、下降多顶等形态理论来研判。


    信达地产（600657）2015 年 1 月出现日线 KDJ 三重顶，出现了较大程度下跌回调。


