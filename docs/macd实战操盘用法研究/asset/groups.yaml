    # 第六章 MACD 与瀑布线的经典配合运用


    # 6.1 瀑布线的计算公式和应用法则


    瀑布线（PBX）是欧美国家90年代初，广泛应用于金融领域中的判断股价运行趋势的主要分析方法，因为它汇聚发散时呈瀑布状而得名。属于传统大势价格趋势线，它的真正名称叫做非线性加权移动平均线，是由六条非线性加权移动平均线组合而成，每条平均线分别代表着不同时间周期的股价成本状况，方便进行对比分析。


    瀑布线是一种中线指标，一般用来研究股价的中期走势，与普通均线系统相比较，它具有反应速度快，给出的买卖点明确的特点，并能过滤掉盘中主力震仓洗盘或下跌行情中的小幅反弹，可直观有效地把握住大盘和个股的运动趋势，是目前判断大势和个股股价运行趋势颇为有效的均线系统。


    瀑布线的优点还在于其不会类似其他指标那样频繁发出信号，瀑布线的买卖信号出现并不多，如果瀑布线给出了买入或卖出信号，只要按照其应用原则去做，就一定会取得较好的投资收益。在趋势明显的上涨或下跌趋势中，瀑布线能给出明确的买卖点和持仓信号，是把握波段行情的利器，它不仅适用于平衡市的操作，更适用于上涨趋势明显中应用。


    # 6.1.1 瀑布线的计算公式


    +   1. PBX1 = （收盘价的 M1 日指数移动平均 + 收盘价的 M1 × 2 日简单移动平均 + 收盘价的 M1 × 4 日简单移动平均） /
    3'
  - '[PAGE 138]


    +   2. PBX2 = （收盘价的 M2 日指数移动平均＋收盘价的 M2×2 日简单移动平均＋收盘价的 M2×4 日简单移动平均）/3

    3. PBX3 = （收盘价的 M3 日指数移动平均＋收盘价的 M3×2 日简单移动平均＋收盘价的 M3×4 日简单移动平均）/3

    4. PBX4 = （收盘价的 M4 日指数移动平均＋收盘价的 M4×2 日简单移动平均＋收盘价的 M4×4 日简单移动平均）/3

    5. PBX5 = （收盘价的 M5 日指数移动平均＋收盘价的 M5×2 日简单移动平均＋收盘价的 M5×4 日简单移动平均）/3

    6. PBX6 = （收盘价的 M6 日指数移动平均＋收盘价的 M6×2 日简单移动平均＋收盘价的 M6×4 日简单移动平均）/3

    7. 参数 M1=4，M2=6，M3=9，M4=13，M5=18，M6=24


    # 6.1.2 瀑布线的应用法则


    # （一）四大信号


    +   1. 买入信号：当前股价低于全部 6 条瀑布线；6 条瀑布线呈现空头排列；瀑布线处于向下发散状态。这时，如果瀑布线走平，股价止跌企稳后迅速向上运行，且有成交量的配合，可以买入。


    +   2. 持股信号：瀑布线在低价区由空头排列向下汇聚发展；瀑布线形成多重金叉，表明股价有继续走强趋势；瀑布线由低位汇聚开始向上发散。这时，投资者应以坚定持股为主。


    +   3. 卖出信号：当前股价高于全部 6 条瀑布线；6 条瀑布线呈现多头排列；瀑布线处于向上发散状态。这时，如果瀑布线由升转平，股价明显难以进一步上涨。以后开始快速下跌，则无需成交量的配合，均应卖出。


    +   4. 持币信号：瀑布线在高价区由多头排列向上汇聚发展；瀑布线形成多重死叉，表明股价有继续走弱趋势；瀑布线由高位汇聚开始向下发散。这时，投资者应以坚定持币为主。


    # （二）注意事项


    +   1. 当瀑布线极度发散时，可根据个股有股性、题材不同，结合趋势通道、乖离率指标做相应的滚动操作。


    +   2. 做长线一般要用周的瀑布线来分析，做中线波段行情，通常以日 K 线所对应的瀑布线系统为主，而分时瀑布线系统则是短线进出的好工具。


    +   3. 瀑布线也具有助涨助跌的特性。'
