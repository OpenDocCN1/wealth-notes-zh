    ## 十九、整数作为支撑和阻力的重要性


    整数有阻止上涨或下跌的倾向。交易者往往把 10、20、25、50、75 和 100（以及 1000 的倍数）这样的重要整数位当作为价格目标，并采取相应的行动。因此，这些整数位常常担当起了“心理上的”支撑位或阻力位。交易者可以利用这个信息在市场接近一个重要的整数位时开始获利了结。


    黄金市场是这种现象的绝佳例证。1982 年熊市的最低点恰好是 300 美元。市场然后在 1983 年第一季度回升到稍高于 500 美元的位置，随后又跌至 400
    美元。1987 年，黄金的反弹再次于 500 美元处受阻。从 1990 至 1997 年，黄金屡次上试 400 美元未果。道琼斯工业股平均指数有在 1000
    点的倍数处驻足的倾向。


    这个原理的一项交易应用是：避免将委托单正好设成这些明显的整数。例如，如果交易者试图在一轮上升趋势中的短期市场回档时买进，那么最好是把限价委托正好设在一个重要的整数位之上。由于其他人正企图在整数位上买进，因此市场或许永远跌不到那里。寻找反弹机会卖出的交易者应该把限价卖出委托正好设在整数位之下。在对现有仓位设


    置保护性的止损委托时，事情正好相反。作为一条总的规则，避免将保护性的止损委托正好设成这些明显的整数。


    换言之，多头仓位的保护性的止损委托应当设在整数之下，而空头仓位的保护性的止损委托应当设在这种数字之上。对于市场来说，遵循整数，特别是先前提到的重要得多的整数位，是对交易最有用的市场特性之一，因此技术派交易者应该将其牢记在心。


    ## 10.2 维克多 123 转势方法与 2B 法则


    ### 10.2.1 维克多 123 转势方法


    - 1. 趋势线被突破；

    - 2. 上升趋势不再创新高，或下降趋势不再创新低；

    - 3. 在上升趋势中，价格向下穿越先前的短期回档低点，或在下降趋势中，价格上穿先前的短期反弹高点。


    123 法则相当于道氏理论对趋势发生转变的定义，注意其中第二点，有的时候价格会出现短暂的假突破（新高或者新低），但很快会回到前高以下（前低以上），因此还可以和
    2B 法则相结合。


    ### 10.2.2 2B 法则


    在上升趋势中，如果价格已经穿越先前的高价而未能持续挺升，稍后又跌破先前的高点，则趋势很可能会发生反转。下降趋势也是如此，只是方向相反。这两个法则不论是中长线的趋势中还是短线当日交易中都可以加以运用。


    在期货投资中，保护性止损价位的设置非常关键，而运用上述两个法则在期货具体操作过程中，止损价位可以这样设置：运用 123 法则，当上升中出现法则中第 3 条，开立空头头寸，止损价位设在前低点稍上方；在下降中出现法则中第
    3 条，开立多头头寸，止损价位设在前高点稍下方。


    运用 2B 法则，在上升趋势中，价格已经穿越先前的高价，稍后又跌破先前的高点，立即开设空头头寸，止损价为设在先前的高点稍上方；在下降趋势中，价格已经穿越先前的低价，稍后又涨回先前的低点上方，立即开设多头头寸，止损价为设在先前的低点稍下方。


    如果之后又发生符合 123 法则的情况，结合 123 的操作方法追加头寸，原先头寸的止盈价和追加头寸的止损价共同放在前低点稍上方（或前高点稍下方）。


    123 法则、2B 法则在期货上的运用，其好处不仅仅在于较好地把握了价格转向的先机，而且由于止损价位和开仓价位非常接近，使风险能被控制在更小的范围内，从而获得较高风险收益比。


