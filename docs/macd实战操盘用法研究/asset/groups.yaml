    # 三、修正浪的变异型态


    常人共有 10 指和 10 趾。但平常，我们也见过 12 指的人，我们不能说他不是人，只能说他有些怪而已。修正浪有时候也会出现这种情况，这些变异的型态就像突变的染色体一样，令人厌烦。不过，没有这些变异型态的存在，波浪理论也就失去了稳固的根基。历史上不少波浪理论的追随者都纷纷提出了自己所认为的也属于修正浪一种的变异型态，乃至国内，也有人标新立异列出许多古灵精怪的型态，企图为其说法或浪型划法提供足够的证据。在我看来，当一种理论已经成为
    “标准” 之后，不要轻易去做改动。特别是他所观察的市场缺乏足够的自由竞争机制，这样往往由于取样的不准确而造成的错误，会令人对这种理论产生误解。


    下面，我们先看看几种变异型态：


    +   1. 强势三角形：通常三角型态中每一个次级浪均是依次递减（增）的，但在某些时候，特别是收缩三角形中，b 浪会突破 a 浪的始点，这样就形成了强势三角形型态（如图
