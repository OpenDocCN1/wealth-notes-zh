    MACD 柱状图是三重滤网的第一层滤网，MACD 柱状图的斜率是由最近两支柱状图的关系决定。在三重滤网的第一层滤网中，交易者首先必须观察周线图，然后再分析日线图。如果周线图的趋势向上，我们仅可以由多方进行交易或在场外观望。如果周线图的趋势向下，我们仅可以由空方进行交易或在场外观望。


