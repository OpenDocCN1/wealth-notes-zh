    ## 8.2 通道线


    通道线，有时称作返回线，是趋势线技法的另一种有用的变体。有时，市场会在两条平行线——基本趋势线和通道线之间呈趋势运动。显然，如果出现这种情形而且分析人士辨认出了通道线的存在，那么这个知识就可用来获利。


    通道线的绘制相对简单。在一轮上升趋势中（见下边左图），首先沿着各个最低点画出基本趋势线。然后从第一个显著高峰（点 2）引出一条虚线，平行于基本上升趋势线。两条直线均向右上方伸展，形成一个通道。如果下一轮上升行情抵达通道线（在点
    4 处）并折返，那么通道就可能存在。如果市场随后跌至原先的趋势线（在点 5 处），那么通道就很可能的确存在。在下降趋势中道理也一样（见下边右图），但方向相反。


    ![](img/e00f2195878851621153c98be41c491d_189_0.png)


    ![](img/e00f2195878851621153c98be41c491d_189_1.png)


    # 图 8.8


    读者应该马上看出这种情形的价值。基本上升趋势线可以用于开始建立新的多头仓位。通道线则用于获取短线利润。更有闯劲的交易者甚至可能用通道线来建立反向的空头仓位，虽然这种与大趋势反向交易的策略可能十分危险，而且常常代价高昂。与基本趋势线的情况一样，通道完整无缺的时间越长，而且市场成功试探通道的次数越多，那么它的


    重要性和可靠性就越大。


    市场突破主要的趋势线表明趋势中的重大转变。但是，市场突破上升中的通道线恰好有相反的意义，它发出了现存的趋势开始加速的信号。有些交易者把市场跳过上升趋势中的上边线视为增加多头仓位的依据。


    ![](img/e00f2195878851621153c98be41c491d_190_0.png)


    注意市场是如何在上下两条平行的趋势线中波动了 25 年的。1987、1989 和 1993 年的头部恰好出现在上面的通道线上。1994 年的底部从下面的趋势线开始反弹。


    市场无力到达通道的上端常常是在警告将要破坏下边线。注意市场未能到达点 5 处的上边线之后，便在点 6 处破坏了基本上升趋势线。


    # 图 8.9


    使用通道技法的另一条途径是观察市场未能到达通道线，这通常是趋势走软的信号。在上边右图中，市场无力到达通道的顶部（在点 5 处）也许是趋势正在反转的早期警报，而且增加了跌破另一条线（基本上升趋势线）的可能性。作为一条一般规则，任何在已建立的通道中的运动无力到达通道的某一边通常意味着趋势正在发生变化，并增大了通道的另一边被突破的可能性。


    ![](img/e00f2195878851621153c98be41c491d_190_1.png)


    如果市场突破上面的通道线（如浪 5 中的），许多走势图分析人士会重新绘制基本上升趋势线，平行于新的通道线。换言之，线 4-6 是等于线 3-5 绘制的。由于上升趋势正在加速，因此顾理成章，基本上升趋势线也会同样加速。


    如果市场无力抵达上面的通道线，而且可以沿两个下降中的波峰绘制出一条下降趋势线（线 3-5），那就可以从点 4 处的最低点绘制一条暂定的通道线，平行于线 3-5。下面的通道线有时指明了最初的支持会在何处。


    # 图 8.10


    ## MACD 实战操盘用法研究


    通道还能用来调整基本趋势线（见上边两图）。如果市场大大越过了预期的上升通道线，则通常表明不断增强的趋势。因此，某些走势图分析人士会从最后一个反作用的低点出发，绘制出一条平行于新通道线的更陡的基本上升趋势线（如上边左图）。更陡的新支撑线经常比原先较为平坦的趋势线更有效。类似地，一轮上升趋势未能到达通道的上端证明应当在上一个反作用的低点之下绘制一条新的支撑线，平行于经过以往两个波峰的新阻力线（如上边右图）。


    通道线具有测量意义。一旦从现存的价格通道突破，市场通常就会运动一段与通道宽度相等的距离。因此，使用者只需简单地测量出通道的宽度，然后从趋势线的突破点起投射出同样的距离。


    但必须永远牢记，在两条线中，基本趋势线更加重要，也更加可靠。通道线是趋势线技法的次要应用。不过通道线的功效常常足以为了其搬入走势图分析人士的工具箱提供证明。


    笔者认为必须画两个通道，一个是宽通道，包含所有价格波动，一个是窄通道，它的基本趋势线和回归线包含了大多数 K 线，但是不包括突出的某些点或某些 K 线组合。这样就形成了双通道线，它比单通道线更能指导我们做单。


    ![](img/e00f2195878851621153c98be41c491d_191_0.png)


    图 8.11


    上图 8.11 是豆油 1505 日线图，例如按照笔者的画法，豆油涨势有两个通道，最外的两条线组成大外通道，里边两条线组成内通道。每次价格回落到最下两条支撑线之间的时候，就以下多单，以最下面的那


    条支撑线为止损位置。每一次涨到最上边的两条趋势线之间的时候，就时刻提醒自己随时准备获利平仓。破了最下面的那条支撑线就是要变为跌势了，破了最上边的那条趋势线，可能是涨势要加速了。这种双通道线其实用处更大。


    ## 8.3 百分比回撤与速度阻力线


    ### 一、百分比回撤


    从前面所有上升趋势和下降趋势的例子中，读者肯定已经注意到，在每个特定的运动之后，市场会回撤掉前一轮趋势的一部分，然后再恢复沿原来方向的运动。这些逆势运动往往落入某个可以预测的百分比参数中。这种现象的最著名应用是
    50%回撤。


    例如，让我们假设市场处于上升趋势，而且从 100 的水平涨到了 200 的水平。那么，接下来的反作用常常回撤掉这轮运动的一半，至大约 150 的水平，然后市场才重拾升势。这是一种著名的市场倾向，而且频繁出现。同样，这些百分比回撤适用于任何级别的趋势——主要趋势、次要趋势和短期趋势。


    除了 50%回撤之外，还有广为人知的最大百分比回撤参数和最小百分比回撤参数——三分之一回撤和三分之二回撤。换言之，价格趋势可以分成三等分。通常，最小的回撤约为
    33%，而最大的回撤约为 66%。这意味着，在强势的调整中，市场通常至少回撤掉前一个运动的三分之一。这个信息用处很大有几个原因：如果交易者正在寻找市场下方的买入区域，那么他或她就可以在走势图上算出
    33%至 50%回撤的区间，并将此价格区间作为买入机会的总参考框架（见下边两图）。


    ![](img/e00f2195878851621153c98be41c491d_192_0.png)


    在回到原来的方向之前，市场常常要回撤掉先前趋势的大约一半。这个例子显示了 50% 回撤。最小回撤是先前趋势的三分之一。而最大回撤是先前趋势的三分之二。


    ![](img/e00f2195878851621153c98be41c491d_192_1.png)


    三根标注着 38%、50%和 62%回撤的水平线从 1997 年 4 月的顶点点划至 8 月的最低点。第一次下跌降到了 38%这根线，第二 nasty下跌降到了
    62%这根线，而第三次下跌接近 50%这根线。大多数调整将会在 38%至 50%这个区域找到支撑。38%和 62%这两根线是要被特别回撤，因此在走势图分析人士中很流行。


    # 图 8.12


    ## MACD 实战操盘用法研究


    最大回撤参数是 66%，它成了一个特别关键的区域。如果先前的趋势要维持下去，那么调整必须在三分之二处停住。所以，这成了上升趋势中风险相对较小的买进区域，或下降趋势中风险相对较小的卖出区域。如果市场越过了三分之二的位置，那么趋势反转而不是仅仅回撤的可能性就大了。接着，这个运动通常将回撤掉原先趋势的
    100%。


    或许读者已经注意到，到目前为止提到的三种百分比回撤的参数——50%、33%和 66%——正是取自原始的道氏理论。当我们进入艾略特理论和斐波纳奇比率时，我们会看到这种方法的追随者使用
    38%和 62%这两种百分比回撤。我们宁愿把两种方法结合起来，把最小回撤区域设为 33%至 38%，把最大回撤区域设为从 62%至 66%。某些技术分析人士将这些数字进一步取整，得出
    40%至 60%的回撤区域。


    研究 W. D. 江恩的人都知道他把趋势结构八等分——1/8、2/8、3/8、4/8、5/8、6/8、7/8 和 8/8。然而，即使是江恩也对 3/8（38%）、4/8（50%）和
    5/8（62%）回撤数字特别强调，而且也认为把趋势三等分——1/3（33%）和 2/3（66%）——很重要。


    我们常用的黄金分割线就是一种百分比线。


    ### 二、速度阻力线


    说到三分法，让我们接触另一个结合了趋势线和百分比回撤的技法——速度线。这种由埃德森·古尔德建立的技法实质上采用了趋势分成三段的理念。它与百分比回撤概念的最大区别是：速度阻力线度量了趋势上升或下降的速率（换言之，它的速度）。


    要构建看涨的速度线，首先要找到当前上升趋势的最高点。然后从走势图上的这个最高点向下作一条竖直线至趋势开始的位置。再把这根竖直线段三等分。随后从趋势的起点开始走出趋势线通过竖直线段上标出的两个点，这两个点分别代表三分之一点和三分之二点。在下降趋势中，绘制过程正好相反。先度量下降趋势的最低点至趋势起点的垂直距离，然后从趋势起点开始绘制两根直线通过竖直线段的三分之一点和三分之二点（见下边两图
    8.13）。


    每当市场在上升趋势中创出新高或在下降趋势中创出新低时，就必须绘制一组新的直线（因为有了新的高点或新的低点）。由于速度线是从趋势起点通过三分之一点和三分之二点绘制的，所以这些趋势线有时或许会横穿某些价格活动。这是趋势线没有画在低点之下或高点之上，而实际上是通过了价格活动的情形。


    ![](img/e00f2195878851621153c98be41c491d_194_0.png)


    上升趋势中的速度阻力线的例子。从顶峰到趋势起点的垂直距离被分成三等分。接着，从点1出发通过点2和3绘制两根趋势线。上面一根直线是2/3速度线，下面一根直线是1/3速度线。这些直线应在市场调整期间起到支撑作用。如果市场跌破这些速度线，它们就转变成了反弹的阻力线。有时这些速度线会横穿价格活动。


    ![](img/e00f2195878851621153c98be41c491d_194_1.png)


    下降趋势中的速度线


    # 图 8.13


    如果上升趋势本身处于调整过程中，那么向下的调整通常会在上面一根速度线上止住（2/3速度线）。若不然，市场会跌到下面一根速度线上（1/3速度线）。如果下面一根速度线也被跌破了，那么市场有可能一泻至先前趋势的起点。在下降趋势中，市场突破下面一根速度线表明很可能会反弹至上面一根速度线。如果市场突破这根速度线，那之为说明反弹行情会涨至先前趋势的起点。


    正如所有的趋势线一样，速度线一旦被突破也会变换角色。因此，在上升趋势的调整过程中，如果上面一根线（2/3线）被突破，而且市场跌到了1/3线处并从那反弹，那么上面一根线就变成了阻力线。只有突破上面这根线时，才是市场可能挑战老高点的信号。在下降趋势中道理也一样。


    ## 8.4 MACD 与切线理论的配合使用技巧


    ### 8.4.1 MACD 与趋势线的配合使用技巧


    价格突破下降趋势线后一般要返测下降趋势线，返测成功后的MACD金叉将是良好的中长线做多时机；价格跌破上升趋势线后一般要返测上升趋势线，返测成功后的MACD死叉将是良好的中长线开空时机。


    下图8.14是美日日线图，价格在2009年1月初突破日线下降趋势线后，在1月底返测下降趋势线成功，此时MACD金叉，这个MACD金叉是我们极好的做多机会。


    ## MACD 实战操盘用法研究


