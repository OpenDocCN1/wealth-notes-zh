    方大集团均线紧凑平行，是非常强势的大牛股才具备的特征，感觉上，这就是最强的股了。

    因为这个股我感觉非常好，今天就没守纪律直接进场做多了。缙师不知道告诫我们多少次了，无论如何必须按缙论买点进场，看来以后必须得守纪律。不改掉随意开仓的毛病，是不可能交易成功的。这个毛病我至今没改掉，难道我不适合交易？还是我没有真努力去改？因为方法没固定下来，所以主要精力忙着学技术，没把主要精力放在执行上？我可能的主要原因是我想先进场一部分，手中先有单，后市再按节奏进出。手中没有单子，就不急于做分析。


