    在一轮上升趋势中，各个阻力位被穿越到了足够大的程度后，就变成了支撑位。一旦点1处的阻力被超越，它就在点4处提供了支撑。 前面的波峰在后续的调整起到了支撑作用。


    在一轮下降趋势中，被跌破的支撑位变成了后续反弹的阻力位。注意，点1处前面的支撑是如何变成点4处的阻力的。


    # 图 10.10


    色彩。作为一种基准，有些走势图分析人士把 3% 的穿越作为评判标准，尤其是碰到主要的支撑位和阻力位时。短期支撑区和阻力区可能只要求小得多的数字，如 1%。实际上，每个分析人士都必须为自己决定穿越多少才算有效。但要记住，只有在市场运动得足够远，使市场参与者确信他们已经犯下错误时，支撑区或阻力区才会互换角色。市场走得越远，他们越相信。


    # 十九、整数作为支撑和阻力的重要性


    整数有阻止上涨或下跌的倾向。交易者往往把 10、20、25、50、75 和 100（以及 1000 的倍数）这样的重要整数位当作为价格目标，并采取相应的行动。因此，这些整数位常常担当起了“心理上的”支撑位或阻力位。交易者可以利用这个信息在市场接近一个重要的整数位时开始获利了结。


    黄金市场是这种现象的绝佳例证。1982 年熊市的最低点恰好是 300 美元。市场然后在 1983 年第一季度回升到稍高于 500 美元的位置，随后又跌至 400
