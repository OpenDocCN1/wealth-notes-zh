    第二，不关注市场走势，而以什么主力、庄家之类的说法来交易。其实，主力的任何行为都在价格上有反应，何必去猜测啊？甚至搬出个什么罗杰斯来说事，可以想想，谁的话都不是绝对真理，就算是绝对真理，还有一个如何操作的问题。即使是大牛市，回调也能死人。还是那句话，主力也好，老罗也好，都得经历市场检验。市场比老罗走得更快更真实，我们何必要舍近求远，不相信眼睛而相信耳朵呢？


    第三，交易错了总以什么长线趋势没变来辩解。其实，由于期货是保证金交易，风险和收益都成十倍的放大。即使你看清了长线趋势，如果你不会回避短线风险，那一个回调就死了，还谈什么长线？这就有点像股市上说的一句话：短线变长线，长线变贡献。股市多少还给你留点股票，期货你要是也那么玩，就什么也不剩了。


