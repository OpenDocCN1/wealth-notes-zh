    上图 4.1 图中标出了多种底部顶部 RSI 形态。


    - 3. RSI 曲线顶部反转形态对行情判断的准确性要高于底部形态。


    ### 二、RSI 曲线的背离


    RSI 指标的背离是指 RSI 指标的曲线的走势正好和股价 K 线图的走势方向正好相反。RSI 指标的背离分为顶背离和底背离两种。


    #### （一）顶背离


