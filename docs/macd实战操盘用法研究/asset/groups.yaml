    行时，表明股价处于整理态势之中。如果股价是处于长期上升趋势时，则表明股价是上昇途中的强势整理，投资者可以持股观望或逢低短线买入；如果股价是处于长期下跌趋势时，则表明股价是下跌途中的弱势整理，投资者应以持币观望或逢高减仓为主。


    （4）布林带的上轨线向上运行，而中轨线和下轨线同时向下运行的可能性非常小，这里就不作研判。


    （5）当布林带的estable上、中、下轨线几乎同时处于水平方向横向运行时，则要看股价目前的走势处于什么样的情况下来判断。


    ①当股价前期一直处于长时间的下跌行情后开始出现布林带的 stable三条线横向移动时，表明股价是处于构筑底部阶段，投资者可以开始分批少量建仓。一旦三条线向上发散则可加大买入力度。


    ②当股价前期是处于小幅的上涨行情后开始出现布林带的 stable三条线横向移动，表明股价是处于上升阶段的整理行情，投资者可以持股待涨或逢低短线吸纳，一旦三条线向上发散则可短线加码买入。


    ③当股价刚刚经历一轮大跌行情时开始出现布林带的 stable三条线横向移动，表明股价是处于下跌阶段的整理行情，投资者应以持币观望和逢高减磅为主，一旦三条线向下发散则坚决清仓离场。


    ④布林带三条线在顶部横向运动的可能性极小，这里也不作研判。


