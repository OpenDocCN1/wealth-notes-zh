    ## MACD 实战操盘用法研究


    ### 图 2.23 豆油


    上图 2.23 是豆油连续日线走势图。2006 年 5 月到 2008 年 3 月豆油的超级大牛市，让很多期货死多头发了大财，那么这样的牛市何时转为熊市呢？我们该什么时候进场做空呢？


    图中圈 1 之前没有出现过死三角价托，圈 2 之前没有出现过 MACD 0 下死叉，因此圈 1 和圈 2 之前市场为涨势，绝不能入场做空，只能大胆顺势做多。图中圈
    1 出现了一个死三角季价托，并且是真死三角季价托，圈 2 出现了 MACD 0 下死叉，表明此时趋势转为跌势，此时平了多单入场做空。入场点为圈 2 中的 MACD
    死叉（这也是第一个 0 下 MACD 死叉）。我们发现在圈 2 MACD 0 下死叉入场下的空单，就一直处在盈利状态之中。


    直到圈 3 出现真金三角季价托，圈 4 出现 MACD 0 上金叉，市场重新转为涨势，我们平掉空单，建立中长线多单。空反多的人场点为圈 4 中的 MACD
    金叉（这也是大跌以来的第一个 0 上 MACD 金叉），我们的空单获利非常巨大。


    而圈 5 出现一个死三角季价托，由于 MA（60）虽然上升斜率变小，但是方向依然向上，因此这是一个假死三角季价托，后市仍未涨势，多单不该平仓。且此时圈 6
    根本没有 MACD 0 下死叉，出现的反而不是 MACD 金叉，因此从 MACD 看，趋势也没有转为跌势，也不该平多单，因此多单需要继续持有。


    在周线上出现这种 MA 与 MACD 结合选择的进场机会，那么获利更为惊人！


