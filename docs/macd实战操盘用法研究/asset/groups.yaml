    ## 2.5 MACD 与 MA 的配合使用原则


    ### 2.5.1 MACD 与 MA 结合研判趋势变化与选择进场点


    指标可以分为趋势指标和摆动指标。趋势指标主要用于判断市场趋势，摆动指标主要用于精确选点进场。趋势指标的老大就是 MA，摆动指标的老大就是 MACD。趋势指标永远比摆动指标重要。


    从上四节我们可以看出，单单使用 MA 就可以交易盈利，毕竟 MA 是趋势型的王者，而趋势指标比摆动指标重要，因此 MA 可以称之为指标之王。MACD 既可以一定程度上反映趋势，又可以有摆动指标精确选点的优点，它集趋势指标和摆动指标的优点于一身，是一个非常好的指标，我称之为摆动指标之王。单单用
    MA 看趋势，只能事后判断趋势，而辅助 MACD 配合 MA 看趋势，则能明确认识趋势，甚至在趋势即将反转尚未反转之前就提前预先判断出趋势的变化。因此 MACD
    和 MA 的配合使用包括两方面内容：一是利用 MACD 的辅助作用，结合均线提前判知趋势的转折；二是结合 MA 利用 MACD 的选点作用精确进场交易。


    ### （一）MA 判断趋势的方法


    利用 MA 判断趋势最主要的用法是利用 MA 的方向判断趋势的方向，这种用法当然非常好，但是它有一个极大的缺点，就是在趋势转折的时候，均线的方向往往没有变化，它很难快速判断趋势转折，只能等趋势确实转折（交易者已经亏损后），才能知道趋势发生了转折。利用
    K 线对 MA 的穿越，观察 MA 的支撑力度，加上 MACD 的背离，就可以帮助非常准确地提前预知趋势的转折。


    日线 MA（20）金叉 MA（40），接着 MA（20）金叉 MA（60），然后 MA（40）金叉 MA（60），MA（20）、MA（40）、MA（60）三线围成的三角形叫做金三角季价托，它对价格是个巨大支撑，后市价格很难跌破该价托。一般形成金三角季价托后，跌势就转为涨势了，这是利用均线理论研判趋势的一种重要方法。


    但是这种金三角价托有的是真价托，有的是假价托。真价托对价格有强大支撑作用，真价托后趋势转为涨势，我们可以依据真价托建立中长线多单。而假价托对价格没有支撑作用，假价托后趋势没有转为涨

