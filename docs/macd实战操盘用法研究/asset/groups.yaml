    ## 3.3 KDJ 具体实战经典运用


    ### 一、对 KDJ 指标在股票操作中的应用探讨


    KDJ 指标又称超买超卖指标，它反映的是多空双方买卖力量的对比，是单一价格因素的评定，具有很强的实用性，KD 的波动范围一般在 0～100 之间，以 50
    为中位，50 以上是强势区，50 以下弱势均力区。具体可以 50～80 分为强势区，表示买方力量增强，80 以上为超强势区，为超买区，表示买方力量巨增，大多数投资者看好此股，极少数投资者在卖股，也是高风险区，而
    20～50 为弱势区，为半数以上的人在卖股票，20 以下为超卖区，即 80 以上的人在卖股票，或说只有两成以上的人在买股票，股价超卖。但是注意 KDJ 在超高位和超低位都会出现钝化现象，即股价涨至了指标的
    80 以上时，还会再涨，股价一涨不回，只要 KDJ 不死叉，跌了仍会再跌，20 以下时，一路下跌不反弹。


    实战操作时，当 KDJ 处于低位 50 以下时，甚至是超低位 20 左右时，一旦金叉可以考虑抢反弹。


    当周、日 KDJ 同时在 20 以下金叉时，则实战重仓持有，中线持仓，一直持有到日 KDJ 死叉卖出，当然是指的高位区了。


    若作短线则以 30 分钟、60 分钟系统作高抛低吸，至日 KDJ80 以上死叉则有一较长的调整时间。


    同理，当周、日 KDJ 冲向 50 以上回落至 50 左右时，KDJ 死叉后，或不死叉反转向上，均线形态良好，为多头排列，则意味洗盘结束，放量则是买入时机。可以以
    70 左右的仓位买入。


    KDJ 在 70 以上或 80 以上金叉时，可能为短暂的洗盘后的快速拉升，有庄家拉高出货的嫌疑，宜快进快出，若根据 30 分钟和 60 分钟 K 线及指标系统，符合卖出条件的则速出，仓位控制在半仓以内，为三分之一为好。


    实战买入条件：


    - 1. 巨量长阳线，密切关注。

    2. 看周、日 KDJ 是否有效金叉，（日 KDJ 在低位有效金叉，周 KDJ 在低位拐头就是进入时机）。

    3. 量比是否大于 1，若大于 1，越大越好，说明庄家上攻的意愿越强烈。

    4. 是否有止跌信号是买人的关键。


    如周、日 KDJ 已经确实金叉则正是买入良机，应略高于市价挂单买入，因为真正的大涨还在后面，保证一定能够买入。


    如符合以上条件，可作中线持有，高抛低吸，当日 KDJ 死叉时卖出，一旦符合买入条件则可再杀个回马枪，若周 KDJ 高位死叉，则中期调整展开，宜速出局。


    KDJ 参数的选取：一般选用（9.3.3），以 KDJ（9.3.3）的参数的 KDJ 值较为敏感，做短线较佳。选 KDJ（36.3.3）的好处能够过滤掉杂波，能够看得更清，做长线为好。而且一旦
    KDJ 从低位 50 以下金叉上来，一时半时，不会改变，某天该股票 KDJ 死叉就是卖出时机。


    如何用 KDJ 判断洗盘特征，当 KDJ 在 50 以上运行时，当 J 值上升过快，拐头向下与 K、D 值死叉后快速金叉，则速买入，或当 J 值下探 K、D
    值不交叉反转向 oʻ，则表示洗盘结束，即将快速拉升，最好是均线呈现多头攻击排列的状态。


    当月 KDJ 在高位时死叉，则是长期卖出时候，大跌还在后面，要果断卖出，不后悔。


    ### 二、对于超短线 KDJ 值回调的时效的研究


    30 分钟和 60 分钟的高位死叉后回调的时间判定：


    1. 当 30 分钟 KDJ 由高位死叉可能回调 4 个小时。

    当 30 分钟 KDJ 处于高位时要倍加小心，一旦 J 值由上向下靠近 KD 值则卖出，等回调后介入。


    2. 当 60 分钟 KDJ 处高位死叉时可能回调 8 小时左右，在下跌的第二天买入。


    同理，若 60 分钟 KDJ 处低位金叉则可能上涨 8—12 小时，持有至高位时卖出做高抛低吸。


    3. 若 30 分钟、60 分钟 KDJ 同时处高位死叉，则进行深幅回调，可有几天（指交易日）的整理。当 30 分钟、60 分钟处低位时买入。


    但必须确定该股近期的走势和中期走势或大盘向好时可做高抛低吸。


    中期走好的条件是周 KDJ 线低位金叉，或周 K 线呈现多头攻击排列。实战中以 30 分钟和 60 分钟超短线图表选择入场时机。


    ## 3.4 MACD 与 KDJ 实战经典配合技巧


    ### 3.4.1 MACD 与 KDJ 同周期共振的交易技巧


    如果 MACD 已经金叉，随后出现 KDJ 金叉，这时候按 KDJ 选点进场做多，后市必定大涨，必定获利丰厚；如果 MACD 已经死叉，随后出现 KDJ 死叉，这时候按
    KDJ 死叉选点进场做空，后市必定大跌，必定获利丰厚。MACD 死叉与 KDJ 死叉同时发生，这种共振也可以开下空单。


    ![](img/e00f2195878851621153c98be41c491d_110_0.png)


    ### 3.4.2 MACD 与 KDJ 形态共振的交易技巧


    无论是否背离，MACD 和 KDJ 的形态无非有 W 底、M 头、多重底、多重顶、上升双底、下降双顶、上升多底、下降多顶这几种基本形态。如果 MACD 和
    KDJ 的形态同时走出看涨或看跌的形态，这就叫形态共振。如果 MACD 和 KDJ 的形态同时走出看涨的形态，则应该进场做多，后市必定大涨；如果 MACD
