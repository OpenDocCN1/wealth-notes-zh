    ![](img/e00f2195878851621153c98be41c491d_237_1.png)


    图 10.6


    从一般意义上说，趋势就是市场的走向，它沿哪条途径运动。但是我们需要更加精确的定义以研判趋势。首先，市场一般不会朝哪个方向直线运动。市场运动以一系列锯齿线为特征。这些锯齿线好似一系列前'
