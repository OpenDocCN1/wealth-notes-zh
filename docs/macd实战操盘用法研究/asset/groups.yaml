    10 年都白干了。在风险投资领域，眼睛必须牢牢地盯着那 5% 的致命意外事故，只有 100% 确保它不会威胁我们生命时，再放手去搏收益。控制仓位是最基本的控制风险的方法。我前面列的公式用的是乘法，其中任何一个因素是零，整个公式都是零。如果你不会控制仓位，别的做得再好也没意义。从积极的角度看，控制仓不仅可以控制风险，而且可以扩大利润，如果你是做中线，一旦做对了，每攻克一个阻力位，就递减式加仓，你可以使你赢利时候的仓位永远大于出错时候的仓位。


