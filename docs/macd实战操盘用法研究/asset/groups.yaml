    以上。它们形成形态的某些金叉死叉位置如果不对，则不行。


    ## （三）KDJ 曲线的交叉


    KDJ 曲线的交叉分为黄金交叉和死亡交叉两种形式。


    一般而言，在一个股票的完整的升势和跌势过程中，KDJ 指标中的 K、D、J 线会出现两次或以上的“黄金交叉”和“死亡交叉”情况。


    ## 1. 当股价经过一段很长时间的低位盘整行情，并且 K、D、J 三线都处于 50 线以下时，一旦 J 线和 K 线几乎同时向上突破 D 线时，表明股市即将转强，股价跌势已经结束，将止跌朝上。如果市场是涨势，可以中长线买入；如果市场是跌势，可以短线抢反弹。这是
    KDJ 指标“黄金交叉”的一种形式。


    ## 2. 当股价经过一段时间的上升过程中的盘整行情，并且 K、D、J 线都处于 50 线附近徘徊时，一旦 J 线和 K 线几乎同时再次向上突破 D 线，成交量再度放出时，表明股市处于一种强势之中，股价将再次上涨。如果市场是涨势，可以加码买进股票或持股待涨；如果市场是跌势，短多可以继续持有。这就是
    KDJ 指标“黄金交叉”的一种形式。


    ## 3. 当股价经过前期一段很长时间的上升行情后，股价涨幅已经很大的情况下，一旦 J 线和 K 线在高位（80 以上）几乎同时向下突破 D 线时，表明股市即将由强势转为弱势，股价将大跌，这时应卖出大部分股票而不能买股票，这就是
    KDJ 指标的“死亡交叉”的一种形式。如果市场是跌势，可以大胆开空单；如果市场是涨势可以短线平仓，不能开空单。


    ## 4. 当股价经过一段时间的下跌后，而股价向上反弹的动力缺乏，各种均线对股价形成较强的压力时，KDJ 曲线在经过短暂的反弹到 80 线附近，但未能重返
    80 线以上时，一旦 J 线和 K 线再次向下突破 D 线时，表明股市将再次进入极度弱市中，股价还将下跌，可以再卖出股票或观望，这是 KDJ 指标“死亡交叉”的另一种形式。如果市场是涨势，可以平多单；如果市场是跌势，大胆开空单。


    ## 5. K 线从右侧金叉 D 线非常可靠，后市必定大涨；K 线从右侧死叉 D 线非常可靠，后市必定大跌。这就是关于 KDJ 著名的 “右侧相交” 原则。


    ## 6. 低位多次金叉，后市将大涨；高位多次死叉后市将大跌。


    ## （四）KDJ 曲线的背离


    KDJ 曲线的背离就是指当 KDJ 指标的曲线图的走势方向正好和 K 线图的走势方向正好相反。KDJ 指标的背离有顶背离和底背离两种。


    当股价 K 线图上的股票走势一峰比一峰高，股价在一直向上涨，而 KDJ 曲线图上的 KDJ 指标的走势是在高位一峰比一峰低，这叫顶背离现象。顶背离现象一般是股价将高位反转的信号，表明股价中短期内即将下跌，是卖出的信号。如果市场是涨势，后市将出现大回调，多单可以平仓；可以大胆轻仓短空。如果市场是跌势，大胆中长线开空。


    当股价 K 线图上的股票走势一峰比一峰低，股价在向下跌，而 KDJ 曲线图上的 KDJ 指标的走势是在低位一底比一底高，这叫底背离现象。底背离现象一般是股价将低位反转的信号，表明股价中短期内即将上涨，是买入的信号。如果市场是涨势，大胆长中线买入；如果市场是跌势，可以大胆短线轻仓抢反弹。


    ![](img/e00f2195878851621153c98be41c491d_100_0.png)


    与其他技术指标的背离现象研判一样，KDJ 的背离中，顶背离的研判准确性要高于底背离。当股价在高位，KDJ 在 80 以上出现顶背离时，可以认为股价即将反转向下，投资者可以及时卖出股票；而股价在


    低位，KDJ 也在低位（50 以下）出现底背离时，一般要反复出现几次底背离才能确认，并且投资者只能做战略建仓或做短期投资。


    ## （五）K、D、J 曲线运行的状态


    - 1. 当 J 曲线开始在底部（50 以下）向上突破 K 曲线时，说明股价的弱势整理格局可能被打破，股价短期将向上运动，投资者可以考虑少量试仓。

    - 2. 当 J 曲线向上突破 K 曲线并迅速向上运动，同时曲线也向上突破 D 曲线，说明股价的中长期上涨行情已经开始，在上涨趋势时，投资者可以加大买入股票的力度。如果是下跌趋势，则可以抢反弹。

    - 3. 当 K、D、J 曲线开始摆脱前期窄幅盘整的区间并同时向上快速运动时，说明股价已经进入短线强势拉升行情，在上涨趋势时，投资者应坚决持股待涨。如果是下跌趋势，则可以抢反弹。

    - 4. 当 J 曲线经过一段快速向上运动的过程后开始在高位（80 以上）向下掉头时，说明股价短期上涨过快，将开始短线调整，投资者可以短线卖出股票。

    - 5. 当 K 曲线也开始在高位向下掉头时，说明股价的短期上涨行情可能结束，投资者应短线卖出股票。

    - 6. 当 D 曲线也开始在高位向下掉头时，说明股价的中短期上涨行情已经结束，投资者应全部清仓离场。

    - 7. 当 K、D、J 曲线从高位同时向下运动时，说明股价的下跌趋势已经形成，投资者应坚决持币观望。


    ## （六）KDJ 曲线与股价曲线的配合使用


    - 1. 当 KDJ 曲线与股价曲线从低位（KDJ 值均在 50 以下）同步上升，表明股价中长期趋势向好、短期内股价有望继续上涨趋势，投资者应继续持股或逢低买入。

    - 2. 当 KDJ 曲线与股价曲线从高位（KDJ 值均在 50 以上）同步下降，表明短期内股价将继续下跌趋势，投资者应继续持币观望或逢高卖出。

    - 3. 当 KDJ 曲线从高位回落，经过一段时间强势盘整后再度向上并创出新高，而股价曲线也在高位强势盘整后再度上升创出新高，表明股价的上涨动力依然较强，投资者可继续持股待涨。

    - 4. 当 KDJ 曲线从高位回落，经过一段时间盘整后再度向上，但到了前期高点附近时却掉头向下、未能创出新高时，而股价曲线还在缓慢上升并创出新高，KDJ
    曲线和股价曲线在高位形成了相反的走势，这可能就意味着股价上涨的动力开始减弱，KDJ 指标出现了顶背离现象。此Itr时投资者应千万小心，一旦股价向下，应果断及时地离场。


    - 5. 当 KDJ 曲线在长期弱势下跌过程中，经过一段时间弱势反弹后再度向下并创出新低，而股价曲线也在弱势盘整后再度向下创出新低，表明股价的下跌动能依然较强，投资者可继续持币观望。


    - 6. 当 KDJ 曲线从低位向上反弹到一定高位、再度向下回落，但回调到前期低点附近时止跌企稳、未能创出新低时，而股价曲线还在缓慢下降并创出新低，KDJ
    曲线和股价曲线在低位形成相反的走势，这可能就意味着股价下跌的动能开始衰弱，KDJ 指标出现了底背离现象。此时投资者也应密切关注股价动向，一旦股价向上就可以短线买入，等待反弹的出现。


    ## 3.2 KDJ 的特殊分析方法


    ## 一、KDJ 的分析周期


    分析周期分为：日、周、月、分钟（主要是 60 分钟）。


    10 日以下为分析参数的 KDJ 的研判适用周期为 3 天左右（从金叉到死叉为 3 天时间）。


    50 日以下为分析参数的 KDJ 的研判使用周期为 10 天左右。


    50 日以上为分析参数的 KDJ 的研判适用周期为 20 天左右。


    ## 二、均线先行原则


    股价一旦被长期均线压制，KDJ 再怎么样金叉一般也只能做短线操作，切莫做中长线投资。这是 KDJ 使用的前提。在长期均线下，且远离均线，KDJ 金叉时，股价有超跌反弹的可能，可做短线操作。


    ## 三、涨势的大体周期


    日 KDJ 是短中期，最多维持 15 天～1 个月。


    周 KDJ 是中期，维持时间为 1～3 个月（一旦金叉，一个月内基本会涨，但涨幅不能确定）。


    月 KDJ 是长期，维持时间一般为 3～5 个月。


    ## 四、KDJ 的参数的修改


    随着技术分析的广泛应用，技术指标的重要性已是不言而喻。但由于目前技术指标的运算已大为简化，这就造成技术指标大面积的雷同，并失去其指导作用。因此为尽量保持精确性、敏感性和时效性的和谐与统一，有必要对某些指标重置参数，并注意以下通则：


    第一，根据时间循环周期设定参数。无论大盘还是个股，时间周期对其运行都会产生较大的影响，而周期本身往往就是一个非常重要的参数，这一点在均线、强弱指标等方面表现得尤为突出。至于周期的测量，通常可由两个重要低点的时间跨度来确定。同时，由于存在长、中、短线的区别，投资者必须根据具体情况设定个性化且自己熟知的参数，而
    5（日）或其倍数以及斐波那契数列在这方面都是不错的选择。


    第二，保持不同时间标准的一致性。如果将适用于日线的参数放到分时里，特别是震荡类指标就会过于敏感，用于周线或月线则会明显滞后。因此，在应用过程中，这一原则必须适当变通后方可使用，这绝不是一个简单的计算问题，而是换算之后需要进行微调，尽管个别指标绝对保持一致仍能取得较好的效果。


    第三，注意大盘与个股间的异同点。由于大盘与个股是一般与特殊的关系，适合于大盘的同一指标参数，通常可直接或略作调整后用于大多数个股，但两者之间的差异毕竟存在，大盘的平均结果往往也会掩盖许多真相或忽略了个性化，即处于超强或超弱状态的个股不同于大盘，其参数的设定理应另开小灶。


    第四，随市场变化不断调整并优化。强势股和弱势股与大盘情形迥然不同，平衡市与趋势运行也有所不同。面对不断变化的市场，一旦发现原参数不太适合当时的市势，大家就需要对该参数进行修正以便优化指标，这应是一项长期的工作，中短期参数更是如此。


    ## 五、不同周期参数的 KDJ 指标的研判


    ## （一）34 日 KDJ（注：这是钱龙软件上的 KDJ 参数）的使用方法


    对于大部分股市分析软件，投资者都可以根据不同的股票、股票不同时期的走势以及投资者的兴趣偏好来修改指标，从而得出不同的分析结论。把日 KDJ 的数值修改为 34，下面在这里简单介绍
    34 日 KDJ 的使用方法。


    - 1. 首先，把 KDJ 运行的区间分为 20 以下极弱势区，20～50 之间为


    弱势区，50～80 之间强势区和 80 以上极强势区，数值 50 是强弱的分界线。


    34 日 KDJ 指标中的 50 线对于从弱势区涨起来的股价来说是一个强大的短线阻力位，只要 KDJ 中的 D 值没有有效冲上 50 位值，就不能说股价已经走出弱势区，KD
    两值在此点位无功而返是非常正常的事，所以必须十分重视此阻力位的作用，很多股票的反弹都在此点位就结束。


    34 日 KDJ 指标中的 50 线对于从强势区跌下来的股价而言，虽有些支撑，却较为轻易击破，显得并没有重要参考意义。这与股价上涨要成交量配合，而下跌没有量也能做到是同样的道理。


    ## 2. 如果是跌势，KDJ 三值在极弱势区 20 以下运行时，一般不作买入计划，持币观望为主，特别是股价刚刚经历过一轮较长时间的下跌。除非是股价经过大跌并在低位盘整了很长时间后，如果有反转意义的低位放量大阳线出现，或有反转意义
    K 线组合形态明确告诉投资者进场。如果是涨势，则果断在 KD20 附近建立多单。


    ## 3. KDJ 三值在极强势区 80 以上运行时，一般不作卖出计划，以持股待涨为主。除非有反转意义的高位放量大阴线（乌云盖顶，穿头破脚）出现，或有反转意义的
    K 线组合形态明确告诉投资者离场。


    ## 4. 如果是跌势，KDJ 在 20 以下极弱势区运行的时间越长，在极弱势区内发出的金叉信号越应该重视，特别是那些向上角度较大、能迅速脱离 20 线的金叉，K
    线组合形态也在明确告诉我们有反转的可能，更应该重视此金叉的意义，这很有可能是中短期底部形成的第一个信号。


    ## 5. KDJ 在 80 以上极强势区运行的时间越长，在极强势区内发出的死叉信号越应该重视，特别是那些向下的角度较大能迅速跌破 80 线的死叉，K 线形态组合也在明确告诉我们有反转的可能，更应该重视此死叉的意义，这很有可能是顶部形成的第一个信号。


    ## 6. KDJ 在 20 以上（弱势区）和 50 以上（强势区）的每次 KDJ 金叉都是介入机会，金叉的位置越高市场意义越大，同时还必须关注 KDJ 金叉角度大小，角度越大越好。另外，还要注意
    K 线形态组合和成交量配合情况。如我们在高位 KDJ 金叉（80 线以上）介入之后不久却又看见 KDJ 死叉，投资者要立即止损离场，防止扩大损失。但 20
    以下的金叉如无 KD 两值迅速脱离 20 极弱势区或 K 线组合形态确认反转，无多大市场意义。


    ## 7. KDJ 在 80 以下（强势区）和 50 以下（弱势区）的每次 KDJ 死


    叉都是必须离场的信号，死叉的位值越高下跌的风险也越大。但 KDJ 在 20 以下的极弱势区内的死叉，如果 KD 两值没有继续走低则无多大参考意义。


    ## 8. 股价短期暴涨，会引起 KDJ 滞后的连续上升，这时我们要保持冷静，切忌盲目追涨，此时股价走势可能正与 KDJ 的走势相反，耐心等待 KDJ 走势与股价走势的同步运行。然后再寻找介入机会，同样股价的短期暴跌，也会引起
    KDJ 的滞后下降，股价也会出现暴跌后的反弹走势是与 KDJ 走势相反的情况。当 KDJ 走势与股价走势同步时，正是我们反弹离场之时。


    ## 9. 在下跌的市场中，反弹时产生的 KDJ 金叉位置也会越来越低，从而引起 KDJ 的死叉位置也会越来越低，在上涨的市场中，回调时产生的 KDJ 死叉位置越来越高，从而引起
    KDJ 的金叉位置也会越来越高。


    ## 10. KDJ 在冲出极弱势区 20 以后，KDJ 会出现报复性的上窜，即股价并没有上涨很多，KDJ 就很快进入强势区，这时我们要注意 KDJ 的回调整理，要注意
    KDJ 在强势区的第二次金叉，因为第二次金叉的介入意义会比每一次更大。更有上涨空间。


    ## 11. KDJ 的使用只是作为一种辅助手段而存在，投资者应参考股价的 K 线组合、量价关系、趋势形态与 KDJ 指标一起研判，当它们发出的买卖信号趋于一致之时，这样的买卖信号比较可靠。


    ## （二）89 日 KDJ（注：这是线老软件上的 KDJ 参数）参数的使用方法


    如果把 34 日 KDJ 指标作为一个比较有实际研判意义的 KDJ 短线指标，那么 89 日 KDJ 指标就是一个比较重要的 KDJ 中线研判指标，它和 34
    日 KDJ 指标在研判上虽有很多相似的地方，但也有不少不同步骤，具体研判如下：


    ## 1. 和 34 日 KDJ 指标的研判相同的是，89 日 KDJ 运行区间也分为 20 以下极弱势区，20～50 之间为弱势区，50～80 之间强势区和
    80 以上极强势区，数值 50 是强弱的分界线。


    89 日 KDJ 指标中的 50 线对于从弱势区起来的股价来说是一个强大的短线阻力位，只要 KDJ 中的 D 值没有有效冲上 50 位值，就不能说股价已经走出弱势区，KD
    两值在此点位无功而返是非常正常的事，所以必须十分重视此阻力位的作用，很多股票的反弹都在此点位就结束。


    89 日 KDJ 指标中的 50 线对于从强势区跌下来的股价而言，虽有些支撑，却较为轻易击破，显得并没有重要参考意义。这与股价上涨要成交量配合，而下跌没有量也能做到是同样的道理。

    ## 2. 要关注 0～20 区间的 KDJ，越靠近底部股价越有上升力度。和 34 日 KDJ 指标一样，89 日 KDJ 在 20 以下极弱势区运行的时间越长，在极弱势区内发出的金叉越应该重视，特别是那些向上角度较大、能迅速脱离
    20 线的金叉，K 线组合形态也在明确告诉我们有反转的可能，更应该重视此金叉的意义，这很可能是中长期底部形成的第一个信号。


    ## 3. 89 日 KDJ 指标中的 80 这条强弱分界线对于中线卖出股票有着重要的指导意义。只要 89KDJ 曲线没有向下突破 80 区间，就可以一路持股，直到该指标中的
    J 线、K 线、D 线都向下跌破 80 这条多方防线以后，就可以中线卖出全部或大部分股票。


    ## 4. 89 日 KDJ 中的 K、D、J 这三条曲线在 80 以上极强势区运行的时间越长，那么它们在极强势区内发出的死叉越应该重视，特别是那些向下的角度较大能迅速跌破
    80 线的死叉，K 线形态组合也在明确告诉我们有反转的可能，更应该重视此死叉的意义，这很可能是中长期顶部形成的第一个信号。


    ## 5. 当 89 日 KDJ 指标在 80 以上的高位死叉、并开始朝下发散时，应立刻卖出余下的股票更不要轻易买进股票（死叉向下发散应观望）。


    ## 6. 一旦 89 日 KDJ 指标在 20 以下金叉并开始向上发散，不要轻易卖出股票，直到确定它高位死叉。


    ## （三）55 周 KDJ（注：这是钱龙软件上的 KDJ 参数）使用方法


    相比较 34 日和 89 日 KDJ 指标，55 周 KDJ 指标就是 KDJ 指标研判中的一种长期指标，它对于研判一个股票未来半年以上的走势具有很强的参考意义。


