    ### 8.6 小结：本章的主要理论贡献


    一、趋势线创新之处：上升趋势线的画法不用从一波涨势的最低点或次低点话，而是从涨势开始的某个低点开始，找到涨势开始的某个低点和最近最高点之间的某个低点，使得这波涨势的最低点和最近最高点之间所有
    K 线都在这条连线的上方，并且使得这条线大致能和这波涨势的方向吻合，这条线就是上升趋势线。


    下降趋势线的画法不用从一波跌势的最高点或次高点画，而是从跌势开始的某个高点开始，找到跌势开始的某个高点和最近最低点之间的某个高点，使得这波跌势的最高点和最近最低点之间所有
    K 线都在这条连线的下方，并且使得这条线大致能和这波跌势的方向吻合，这条线就是下降趋势线。


    二、必须画两个通道，一个是宽通道，包含所有价格波动；一个是窄通道，它的基本趋势线和回归线包含了大多数 K 线，但是不包括突出的某些点或某些 K 线组合。这样就形成了双通道线，它比单通道线更能指导我们做单。


    三、价格突破下降趋势线后一般要返测下降趋势线，返测成功后的 MACD 金叉将是良好的中长线做多时机；价格跌破上升趋势线后一般要返测上升趋势线，返测成功后的
    MACD 死叉将是良好的中长线开空时机。


    四、0.5 位置是非常好的开仓位置，绝大部分反弹或回调都要在 0.5 位置附近出现反弹或回调的结束。


    五、价格每次回调到上升趋势线附近，如果 MACD 金叉就做多；价格每次反弹到下降趋势线附近，如果 MACD 死叉就做空。


    价格回调到上涨趋势线附近拐弯向上，如果 MACD 金叉就做多；价格每次反弹到下降趋势线附近拐弯向下，如果 MACD 死叉就做空。


    六、涨势的回调 0.382 是强势回调，如果价格回调到 0.382 线附近出现 MACD 金叉，则进场做多。0.5 回调是最常见的回调也是最重要的，如果价格回调到
    0.5 附近出现 MACD 金叉，则大胆进场做多。0.618 回调也比较常见，如果价格回调到 0.618 附近出现 MACD 金叉，则进场做多，此时做多价位低，获利空间大。


    跌势的反弹 0.382 是强势反弹，如果价格反弹到 0.382 线附近出现 MACD 金叉，则进场做空。0.5 反弹是最常见的反弹也是最重要的，如果价格反弹到
    0.5 附近出现 MACD 金叉，则大胆进场做空。0.618 反弹也比较常见，如果价格反弹到 0.618 附近出现 MACD 金叉，则进场做空，此时做空价位低，获利空间大。


    七、本章笔者用自己独创的趋势线画法，对白银、黄金、棕榈油价格走势进行画趋势线分析，是一个较大的创新。


    # 第九章 MACD 与波浪理论的经典配合使用


    ### 9.1 波浪理论简介


    #### 9.1.1 五升三降是波浪理论的基础


    波浪理论认为：股票市场的发展遵循着五浪上升，三浪下降的基本型态，从而形成包含八浪的完整周期。前面五浪所组成的波浪是股市运行的主要方向，而后面三浪所组成的波浪是股市运行的次要方向。图中的第1浪，第3浪和第5浪称为推动浪，第2浪和第4浪则称为修正浪。


    ![](img/e00f2195878851621153c98be41c491d_208_0.png)


    经过第1浪至第5浪推动之后，又会受到 a、b、c 三浪的修正。在这个完整的八浪周期结束之后，随之而来的第二个类似的周期变动，如此不断地重复。这样，较小级别一波浪总是包含在较大的波浪中，或者说：波浪理论认为，任一序列中，任一級次的浪，均可被细分以及再细分为较小级次的浪。但五升三降乃是其基础。


    尽管古今中外，有不少人对这个“五升三降”提出种种质疑。或许事实上它并不是代表了真理。但是，根据我们的经验，在没有证明其他序列比之更好之前，我们还是先以此为基础。下图是
    1989－1995 年初香港恒生指数走势图，这是一组典型的艾略特波浪，遵循了“五升三降”的原则。


    ![](img/e00f2195878851621153c98be41c491d_209_0.png)


    由于波浪理论所描述的波浪“有界无限”（在实际应用中是有限的），所以，我们必须对每一级次的波浪做出标识，以及准确分析。习惯上，我们只关心所有级别中九个级别的波浪：


    + 超级大循环浪、大循环浪、循环浪；

    基本浪、中型浪、小型浪；

    细浪、微浪、次微浪。


    一般而言，超级大循环浪的运行时间往往会超过一个人的寿命。而细浪以下的更小级别的小波浪运行时间很少超过 1 小时。因此，在实际应用上，我们只关心这九个级次的波浪。对于初学者来说，如何比较正确地辨别波浪的级次，是相当困难的。特别是在一个新的波浪开始之际。作者在分析工作中，也经常会面临这样的困难。但是，好在我们所关心的只是相对的级次而已！而当你的经验开始变得丰富之后，你会觉得这已不是重点了。不过，我们仍然会在做分析工作时划上记号，下面是一般的习惯标记符号：


    超大循环浪（Grand Supercycle）：

    <I>、<II>、<III>、<IV>、<V>，<A>、<B>、<C>；


    大循环浪（Supercycle）：

    （I）、（II）、（III）、（IV）、（V），（A）、（B）、（C）；

    循环浪（Cycle）：

    I、II、III、IV、V，A、B、C；

    基本浪（Primary）：

    （1）、（2）、（3）、（4）、（5），a、b、c；

    中型浪（Intermediate）：

    1、2、3、4、5，a、b、c；

    小型浪（Minor）：

    （i）、（ii）、（iii）、（iv）、（v），（a）、（b）、（c）；

    细浪（Minute）：

    i、ii、iii、iv、v，a、b、c；

    微浪（Minuette）：

    1、2、3、4、5，（a）、（b）、（c）；

    次微浪（Subminuette）：

    i、ii、iii、iv、v，a、b、c；

    上述标记符号并不是唯一合法的，也可以使用其他的标记符号。值得注意的是，不宜使用“大”、“特大”、“一、二、三……”等字眼，它除了只会让人觉得你不够专业外，没有任何好处。

    另外，如果使用科技标记法，如“A1”、“C5”等则会令波浪图不容易快速阅读。也应尽量少用或不用。波浪理论的“五升三降”看似简单，实则深奥。浪中有浪更是包含了丰富的哲理，与中国古代的“太极生两仪、两仪生四象、四象生八卦……”的含义多少有些类似。一名高瞻远嘱的投资者，他总是会注意到目前股市的走势在更广阔的范围内处在什么阶段。波浪理论恰好就是这样一种合适的工具，就像一副大倍数的望远镜一样，但是到了关键时刻，它又可变成一副显微镜，帮助投资者捕捉市场大逆转的转折点。

    作者要提醒投资者，每一个波浪并不是相等的，它可以压缩，可以延长，可以简单，可以复杂。总之，一切以型态为准。


    #### 9.1.2 推动浪、调整浪以及它们的变异型态


    如果在你面前站着一只动物，你一定可以知道这是人或者是猫或是其他你所知道的动物，如果是一个人，你会知道他的哪部分与你不一

    样，但你会知道他是人。在艾略特波浪理论中，波浪的型态决定了其性质是推动浪还是修正浪。但是每一个浪的型态也不完全一样。在现实情况中，推动浪会因基本面的不同而出现一些变异型态。但以标准的推动浪来说，它们是五浪推动的，在牛市中是五浪上升，在熊市中是五浪下跌，五浪结束就会运行修正浪。推动浪的变异型态则有数个种类。最初艾略特只提出了“浪的延伸”、“失败的第5浪”、“倾斜三角形”等类型。后来，又有人进一步指出，还有“第二种倾斜三角形”等形态。


    ![](img/e00f2195878851621153c98be41c491d_211_0.png)


    ##### 一、浪的延伸


    所谓浪的延伸，是指浪的运动发生放大或拉长的现象。当波浪发生延伸时，将会使得此一波浪序列形成大小相似的九浪，而如果延伸浪中再出现延伸，则我们会见到十三个大小相似的波浪。根据作者的经验，在现实中波浪的延伸是经常出现的，也许在未来，浪的延伸会被认为是推动浪的正常型态。如果在分析中无法辨认是哪一个波浪出现延伸，这不要紧。因为在艾略特的理论体系中，五浪、九浪与十三浪甚至十七浪的意义是一样的（见下图
    9.4）。


    ![](img/e00f2195878851621153c98be41c491d_211_1.png)


    我们所关心的是波浪的延伸到底给予我们什么好处。一般情况下，三个推动浪中有且仅有一个浪出现延伸。这个事实，使波浪的延伸现象变成了预测推动浪运行长度的一个相当有用的依据。举例来说，如果投资者发觉第
    3 浪出现延伸时，那么第 5 浪理应只是一个和第 1 浪相似的简单结构。或者，当第 1 浪与第 3 浪都是简单的升浪，则有理由相信第 5 浪可能是一个延伸浪，特别是当成交量急剧增加时。请注意，在成熟的股市，延伸浪经常会出现第
    3 浪中；而在新兴股市中，第 5 浪往往也出现延伸的现象。


    推动浪可以延伸，也可以失败。艾略特使用“失败型态”的字眼，藉以描述第 5 浪的运动未能突破第 3 浪终点的价格水平。也有人使用“未完成的第 5 浪”这个词表达上述意思（见下图）。


    牛市


    熊市


    ![](img/e00f2195878851621153c98be41c491d_212_0.png)


    # 图 9.5


    作者认为，如果不使用“失败的”这个词，则不如使用“未创新高（低）的”。因为“未完成的”很容易让人误以为第 5 浪尚未结束。当第 5 浪不能创新高（低）时，很可能市场会出现大逆转。其包含的深层意义，并非在此三言两语所能说得清楚。要特别提醒读者的是，在实战应用中一定要注意第
    5 浪中的次一级 5 个小浪清晰出现后才可确认此“失败 5 浪”。否则，可以演变成“4 浪 b”，只要它是 3 浪运行的。“失败的第 5 浪”的出现，大多数情况下是由于基本面出现突然的重大变化而造成的。例如，利率变动、战争、政变等。不过，单有基本面的变化而第
    3 浪没有过分扬升的话，则也很难令第 5 浪失败。正如现实世界难以完美一样，股市也经常会出现令人遗憾的地方。除了“延伸”和“失败”之外，倾斜三角形型态也是推动浪的变异型态。相对前两者来说，这确实是较为少见的。艾略特认为，倾斜三角形为推动浪中的一种特殊型态，主要出现在第
    5 浪的位置。他指出，在股市中，一旦出现一段走势呈现快速上升或赶底的状况，其后经常会出现倾斜三角形型态（见下图）。


    ![](img/e00f2195878851621153c98be41c491d_213_0.png)


    图 9.6


    人生旅途，有顺境有逆境。顺境时开心、高兴，度日自然容易；逆境时万事不顺心，你会觉得日子难熬。股市的波动也有类似的情况，推动浪容易判别，修正浪较不容易清楚地加以辨识和划分。作者的经验是：除非修正浪已经结束，并且完整地呈现在投资者面前，否则要辨认是一件相当困难的事情。而事实上，修正浪的变化相当复杂，型态种类比推动浪要多得多。


    ##### 二、传统上，波浪理论将修正浪分为四种型态，现分别介绍如下


    + 1. 锯齿型：锯齿型的修正浪是三浪运行的，以 A—B—C 标识。它可以细分为更小一级的 5—3—5 的形式。多头市场中的锯齿型态，是三浪下跌的修正浪，空头市场中的锯齿型态，是三浪上升的修正浪。锯齿型态的修正浪，其
    A 浪由 5 个次一级的子浪组成。B 浪则由 3 个次一级的子浪组成，而且 B 浪的终点明显地低于 A 浪的始点水平（如图 9.7）。有时，特别是当一个锯齿型态未能达到正常的目标时，市场会出现连续两个（至多三个）锯齿型态。每一个锯齿型态之间由一个
    “三浪” 所连接，即所谓的双重锯齿型或三重锯齿型（图 9.8）。


    ![](img/e00f2195878851621153c98be41c491d_213_1.png)


    图 9.7


    ![](img/e00f2195878851621153c98be41c491d_214_0.png)


    图 9.8


    2. 平台型：和锯齿型不一样，平台型的修正浪细分为 3—3—5，同样以 A—B—C 标识（如图 9.9）。


    ![](img/e00f2195878851621153c98be41c491d_214_1.png)


    图 9.9


    由于市场在推动浪之后缺乏足够的拉回力度，使得 A 浪无法像锯齿型修正浪那样形成完整的五浪。因此，B 浪的反弹（下调）也得以接近 A 浪的始点才结束。当然，接下来的
    C 浪一般也在较 A 浪终点不远的地方即告结束。不像锯齿型中的 C 浪，结束的位置往往明显低于 A 浪的终点。空头市场中的平台型态，与多头市场相同，只是倒转过来而已。整体而言，平台型态的修正浪，对于先前推动浪的拉回力度，经常小于锯齿型态。这也是读者预测市场走向比较可靠的依据之一。


    艾略特波浪理论认为，平台型修正浪经常出现在强劲的市场趋势中，许多时候是在延伸浪后出现。而且，市场走势愈强，平台整理的时间就愈短。与双重（三重）锯齿型态一样，平台型态也有双重平台、三重平台之说。但是艾略特却把它们归入双（三）重三的复杂型态之中——稍后我们也将讨论。上帝是公平的，由于平台型态通常修正幅度比较小，也因此而令其变化比较多。


    艾略特赋予了三种不同的标记——常态、扩张以及强势平台（如图 9.10）。


    ![](img/e00f2195878851621153c98be41c491d_215_0.png)


    图 9.10


    扩张平台是指在平台型态中，B 浪的终点超出 A 浪的始点水平，而 C 浪也明显击破 A 浪的终点而进一步探底。而强势平台则是指 B 浪超越 A 浪的始点，而
    C 浪则未击破 A 浪的终点，显示出市势非常强劲。不过，在过往的日子里较大级别修正浪中，很少发现这种型态。因此，读者在实际分析中，最好不要抱侥幸的心态。否则，所遭受的损失可能会比较可怕。相比较而言，强势三角形则比较常见。


    3. 三角型态：三角型态是唯一以五浪运行的修正浪，其次一级的细浪皆可划分为三浪，即 3−3−3−3−3 的型态。在三角型态中，大部分的次一级细浪都是锯齿型态（如图
    9.11）。


    ![](img/e00f2195878851621153c98be41c491d_215_1.png)


    图 9.11


    但是，有时候某一个次级浪（C浪的可能性较大）会出现比其他次级浪更加复杂的型态。此外，有些时候三角型态将会延伸为九浪，是因为其中一个次级浪本身以三角型态出现，E浪的可能性最大。艾略特认为，三角型态只会出现在第4浪、B浪或X浪中。第2浪形成三角型态的机会甚少。股票市场中，当三角型态结束之后运行的推动浪经常会出现“飙升”的情形。其上升目标大概就是三角型态最宽部分的距离。我想，读者在平常的分析中也会有类似的经验，因为这和一般价格型态分析的目标是相同的。以前，波尔顿（著名波浪理论追随者）列出一种变异型态，叫做“水平三角型态”，用来表示三角型态两条边界线互相平行的情况。不过，艾略特本人却未提过。事实上，前述三角型态艾略特就称之为“水平三角形”，以便和我们此前所讨论的“倾斜三角形”有所区别。


    4. 双重三或三重三型态：前面三种形态，都是简单型态的修正浪。而下面我们所讨论的双（三）重三则是复杂型态的修正浪（如图 9.12）。


    ![](img/e00f2195878851621153c98be41c491d_216_0.png)


    艾略特认为，当一个简单型态的修正浪运行结束之后，如果市场不允许出现新一组推动浪，那么它还要继续在过渡浪（标记为 X 浪）之后再运行一个修正浪。有时候，这种情况还要重复两次。而很多时候，是基本面的因素导致了这种局面的产生。前面我们曾提到过双重平台、三重平台，艾略特之所以将它们归入双重三或三重三型态，是因为他认为水平型态的修正浪和双重锯齿型态的非水平修正浪有所区别。我想，如果单纯以型态划分，这样的意见不够严谨。但是，如果对于在实际分析工作中，着重于修正浪的运行幅度来说，这样的划分显然更加合乎情理，也更容易让初学者接受。根据我的经验，由于人类社会的迅速发展，事物都比以往任何时候要更加复杂。因此，复杂型态的修正浪出现的频率也会随着人类社会的不断发展而增加。我建议读者在一个三浪下

