    势，此时股票价格会由于太远离移动平均线，而发生反弹，股票价格回升并向移动平均线靠拢，但未有效突破移动平均线即又告回落，此时出现卖点。


    解释：由于股票价格跌破移动平均线，移动平均线也转为下降趋势，此时表示在一段时间内，所持有股票的投资者都是亏损的，由于股票趋势已经转坏，则股票上涨所遇到的解套压力极大，此时而发生的反弹，并不是股票价格的再次上升行情，所以在股票价格反弹至移动平均线附近时，出现卖点，是投资者为了避免扩大损失的卖出时机。


    H 点（卖出点）。


    定义：移动平均线一直呈下降趋势，股票价格虽然一时上升突破移动平均线，但由于没有成交量的有效配合，股票价格随即又向下跌破移动平均线，而移动平均线则继续呈下降趋势，是卖出信号。


    解释：移动平均线转为明显的下跌趋势后，则此下跌趋势不容易改变，也就是套牢了许多人的股票，不会十分轻易马上就解套所有的人（除非公司基本面发生巨大变化，或有庄家因突发事件仓促介入），虽然因买盘介入，使股票再次回升，但抛盘依然很大，所以股票价格会再次回落，这时又是一个卖点出现。实际应用中这个点也很有意义，在中国的股票市场出现这种情况往往表示有庄家被套，此时他们在利用一些利好因素在做解套行情。另外，下跌后的长期横盘整理现象会显示有买盘介入。若有成交量的配合，则此股票就应加以注意，如果随后有更长期的盘整走势，则在以后再次放量上涨的上升行情的初期，应及时介入，获取利润。


