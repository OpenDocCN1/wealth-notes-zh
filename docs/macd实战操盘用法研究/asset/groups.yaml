    ## 3.5 小结：本章最主要的理论贡献


    一、强调 KDJ 超买超卖与市场趋势的结合，这就是市场趋势和 KDJ 的配合原则。强调只有市场趋势是涨势下，KDJ 超卖领域的金叉才可以中长线做多；市场趋势是跌势下，只能短线抢反弹。市场趋势是跌势下，KDJ
    超买领域的死叉才可以中长线做空；市场趋势是涨势下，只能平多单，短线做空。


    二、强调了 KDJ 右侧相交的重要性，并做了详细的图解。


    三、在市场趋势和 KDJ 有效配合下，市场跌势下的 KDJ 高位顶背离是非常好的中长线开空机会；市场涨势下的 KDJ 低位底背离是非常好的中长线开多机会。


    四、强调了 MACD 与 KDJ 同时发出的买卖信号非常可靠，这就是 MACD 和 KDJ 的同周期共振原则。


