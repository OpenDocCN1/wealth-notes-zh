    6。这种均线回踩是极好的买入机会，也是我们推荐给广大散户的最佳买入时机。这也是葛兰威尔八大法则的第二个买入点，也是国内有人称之为老鸭头形态的东西，其本质就是转势后的第一次获利回吐，转势后的最佳买入机会。


