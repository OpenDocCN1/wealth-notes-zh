    如何识别真假价托呢？形成金三角季价托的时候，如果 MA（60）的方向变平或拐弯向上，则是真价托；形成金三角季价托的时候，如果 MA（60）的方向虽然向下的斜率变小，但是方向依然是向下的，则是假价托。


    日线 MA（20）死叉 MA（40），接着 MA（20）死叉 MA（60），然后 MA（40）死叉 MA（60），MA（20）、MA（40）、MA（60）三线围成的三角形叫做死三角季价托，它对价格是个巨大压力，后市价格很难突破该价托。一般形成死三角季价托后，涨势就转为跌势了，这是利用均线理论研判趋势的一种重要方法。


    但是这种死三角价托有的是真价托，有的是假价托。真价托对价格有强大压力作用，真价托后趋势转为跌势，我们可以依据真价托建立中长线空单。而假价托对价格没有压力作用，假价托后趋势没有转为跌势，继续是涨势，我们如果根据假价托建立空单，将损失惨重，更好的选择反而是继续建立多单。


    如何识别真假价托呢？形成死三角季价托的时候，如果 MA（60）的方向变平或拐弯向下，则是真价托；形成死三角季价托的时候，如果 MA（60）的方向虽然向上的斜率变小，但是方向依然是向上的，则是假价托。


    真金三角季价托后趋势变为涨势，真死三角季价托后趋势变为跌势。这就是我们利用均线判断趋势转折的一个极其重要的方法。


    ## （二）MACD 判别转势的方法


    一般转势之前 MACD 要背离，先出现背离的 MACD 更可靠，这是辅助判断方法。长期跌势后 MACD 0 上金叉趋势转为涨势，长期涨势后 MACD 0 下金叉趋势转为跌势。这是
    MACD 判断趋势的极其重要的方法之一。


    ## （三）MA 与 MACD 结合研判趋势变化与选择进场点


    长期大跌后，MA 出现真金三角季价托和 MACD 出现 0 上金叉，两个条件同时发生，我们研判趋势转为涨势。入场点是真金三角季价托后的第一个 MACD 出现
    0 上金叉进场做多。


    激进交易者也可以仅仅根据真金三角季价托判断趋势转为涨势，入场点为真金三角季价托后的第一个 MACD 金叉（这里不要求 MACD 0 上金叉）。


    长期大涨后，MA 出现真死三角季价托和 MACD 出现 0 下死叉，两个条件同时发生，我们研判趋势转为跌势。入场点是真死三角季价托后的第一个 MACD 出现
    0 下金叉进场做空。


    激进交易者也可以仅仅根据真死三角季价托判断趋势转为跌势，入场点为真死三角季价托后的第一个 MACD 死叉（这里不要求 MACD 0 下死叉）。


