    # MACD 实战操盘用法研究


    吻，这波湿吻达到了使男上位出现了空头陷阱，这时的空头陷阱底背驰，就是周线二买，即图中红箭头处。周线二买后，男上位就变成了女上位，随后大涨高潮的产生就成了自然的事情。


