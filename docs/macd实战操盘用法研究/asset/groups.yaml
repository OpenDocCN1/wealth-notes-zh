    破时，往往收出中、大阳线，但随着成交量的萎缩，价格会出现滞涨现象，K 线也出现了十字星、小阴小阳形态。而当成交量快速萎缩后，价格也就随之调整，K 线出现了中阴线。这样，在
    K 线形态上出现了黄昏之星、塔形顶、覆盖式大阴线等短期见顶的 K 线组合形态。投资者应结合时空度量理论，以短期服从中长期、小趋势服从大趋势、小形态服从大形态为原则，将短期趋势融入长期趋势形态中进行复合研判。


    最后，是与均线系统等其他分析工具背离。仍以价格向上突破为例，假突破常常在价格突破创新高后，就开始缩量横盘，让投资者误以为是突破后的回抽确认，但在回挡时价格却跌破了
    5 日均线，继而又跌破 10 日均线。当 5 日与 10 日均线形成死叉时，假突破就可以得到确认。投资者应结合其他技术分析工具进行立体研判，特别要注意先有反向运动迹象的突破。一般第一次的突破，假突破性质居多。突破过程没有缺口出现，回抽趋势线快速、有力也都是假突破的特点。


    ## 次谈交易的常识：


    很久没来论坛，最近有空来看看，感觉一切都没有改变，特别是看到有些朋友还在犯同样的错误，还在亏同样的钱。我忍不住又要说几句，尽管这可能又会引起某些人的攻击。


    第一，做期货，一定要明白这是个做多做空都赚钱的市场，而不是只有做多才赚钱。比如糖、小麦、豆子，典型的长线空头市场，如果你不固执于做多，早赚的口袋满满的，何必在这里苦苦盼多头啊？资金是有时间价值的，等一两年等来多头，即使是挣点钱，也不符合投资的真理，那你也不必做期货，炒股不就得了？我再次建议：赚眼前的钱，别惦记未来的钱。


    第二，市场是多是空，别去提前猜测，市场给出一个方向后，一般有很长的路要走，不会轻易转方向。所以，别天天盼市场转方向，而要致力于顺势而为。如果市场不断转方向，那一定是个盘整市场，就只适合于短线交易。比如糖，空头市场很明显，别盼它转向，它真转向了，一眼就能看见，何必去提前猜？


    第三，看市场的方向和市场转折，必须用大周期均线和大形态突破，绝对不能看一两天的 K 线就下结论。一两天的 K 线，绝大多数是市场大鳄玩的小把戏。只有大均线和大形态才是真正客观的转向标志。


    第四，看清了方向，还要注意不要追大乖离率，要背靠大方向，逢回调再建仓，否则，你看对方向也会因承受不了振荡而亏钱。


    第五，一定要控制仓位，错了要及时退出，对了要坚定持仓。

    第六，要学会盈利退出：在下面情况下可以退出而获得暴利，破阶段趋势线、破颈线。


    ## MACD 实战操盘用法研究


    ### 15.3 期货十段


    这是网上广为流传的期货十段评定标准，现在摘抄如下：


    一段：你刚进入期货市场，非常的兴奋，决心要在期货市场大有作为，对市场里的一切都比较模糊或空白，各个货币合约的规定你也不太清楚，要买什么要卖什么你也没有什么主意，你的交易主要是看各期货经纪公司网站的评论，或者听听朋友的建议，你总觉得他们说得都有道理。基本上都是看着行情的一会儿上一会儿下凭着自己的感觉下单，凭着运气和胆量可能也会赚钱，你的交易主要是日内的短线，交易十分频繁，赚点钱你就急着平仓，生怕到手的利润飞了，亏了你就抱着，想着总有解套的时候。听不进也听不懂风险忠告，大多很快就赔没了或是爆仓。三到四成的投资者已经爆仓。


    二段：你很不甘心失败，连续追加资金，非要把亏的钱赚回来（勇气可嘉），但就是不去总结失败教训，直到血本无归，退出战斗。很多人从此不再相信期货市场能够赚钱。少部分比较有理性的人才能走过这个阶段。六到七成的投资者再次经历爆仓。


    三段：你开始知道什么是技术面什么是基本面，你也知道了一些技术指标，移动平均线 MA、MACD、KDJ、RSI、DMI 之类的，总觉得它们有时准，有时又不准。你也关心基本面情况，今天都有什么重要经济数据，当前都有哪些热点问题和重大事件。你总是第一时间上网查查看。你的交易比较频繁，时赚时亏，但总的来说，账户是亏损的。


    四段：你在市场上已经交易了一段时间了，但总的来说账户是亏损的。你觉得要在期货市场赚钱真的很难，你急着想翻本，可你不知道该怎么办。你看了一些关于交易的书，可你觉得他们说的是一回事，拿到这个市场中实际操作又蛮不是那么回事。你觉得还是指标不够精确，于是你试着调整参数，可它们仍然是有时准有时不准。你上论坛，希望得到高手的指导。可他们也是有时准有时不准。


    五段：你有过大亏或者爆仓的经历了。你知道要在这个市场上生存不能听信那些个评论。于是你开始系统地学习，你把能找到的相关书籍都看了，希望能从中找到一个战胜市场的法宝。你也学习了波浪理论、江恩的测市法则、混沌理论之类的。你也知道了要顺势而为、亏损了要止损。可你搞不清这个“势”是怎么确定的，止损设在什么地方才好。你觉得要准确地知道市场何时反转真的太难了，你不相信在这个市场有人可以赚到钱，因为聪明的你都觉得面对市场束手无策，他们怎么可能赚到钱？


    六段：你开始明白要在这个市场上赚钱必须要有—一套交易系统。可你对这个交易系统具体都包括哪些东西还搞不太明白。你试着将几个指标组合成你的系统，根据它们提供的信号开平仓。可它们经常相互冲突，让你搞不明白此时到底该相信哪个。你试着长线交易，可有时你搞不清到底是回调还是要反转了。你也试着就做日内短线好，每天赚个三五百块钱，一年下来应该也不少了。可关键是经常今天赚了三百，明天却亏了五百。你的账单仍然是亏损的，你觉得做期货真是太难了，实在不行的话，你考虑是不是该放弃了。


    七段：你开始明白在这个市场上你没法预测价格走势，你不行，别也不行。你开始有一套自己的交易系统，你知道自己只要严守纪律，长远来看，你该能够赚到钱。你开始用概率来考虑问题，每一次进场，知道风险和报酬的比率各是多少。错了你会止损，盈利的单子你也开始能拿得住了。你的账单时赚时亏，盈亏基本相当。有时你能按自己的系统交易，有时你不能。但你开始相信这个市场上有人可以赚到钱。


    八段：你开始能够稳定盈利，有自己的一整套交易系统。你已经解决了交易理念的种种问题，开始有了自己的交易哲学。对于技术性的东西你不太关心，你知道只要理念正确，即使是使用简单的移动平均线你也可以稳定获利。你知道哪些是关键的点位，你可以从容地进场，虽然你看不清以后的走势到底如何。某一天你可能先赚五百又亏了三百，但你能正确地执行止损，你知道这些亏掉的钱迟早又会回来。你的心态基本平静，但偶尔面对行情的剧烈波动还是会有些起伏，特别是有单的时候。


    九段：这时候赚钱对你来说是家常便饭，就像一名驾驶老手开车一样，遇到红灯就停、绿灯就行。交易对你来说完全是无意识的。你不再需要对着图形精确地定义止损的位置，拿着笔或计算器计算着风险和报酬的比率。你完全不再关心经济数据和政治事件的影响，因为基本面对你来说毫无用处。


    十段：这时候的你对世界经济了如指掌，你可以提前预知下一轮的经济走势。一年你只交易几次，也可能一单一拿就是几年。你很少有看盘的时候，多数时间你在打高尔夫或是在太平洋的某个小岛钓鱼。你从不和别人说起交易的事，因为你知道没人能明白。


    ## MACD 实战操盘用法研究


    ### 15.4 笔者的交易感想


    交易者需要经过一轮牛市一轮熊市，这大约是 10 年左右的时间，其中的优秀者才可能入门。绝大部分交易者需要经过 2 轮牛市 2 轮熊市（大约 20 年）才能入门。


    经历过了牛市，才知道自己每次按背离看空，空仓等回调，价格却背了又背离，不断创新高，离我而去。这种感受要在 1～2 年的牛市中，别人持股不动赚了大钱，自己短线进出拿不住单，赚了小钱，不断的懊悔中，才能初次明白什么是牛市。第二次经历牛市，才会有点能抱住单了，有点相信趋势了。第三次经历牛市才是炒股炒期货真正刚刚入门的开始。


    经历过熊市，才知道自己每次底背离抄底，结果不断止损。或者死扛大亏止损，或者不断止损。结果底背完了又是底背，不停地底背，不停地抄底，最终不但赚不到钱，还总是亏。看人家期货做空的，持有空单不动，暴赚，自己只有不断懊悔的份。第二次经历熊市，才能稍微抱住空单，才能赚点钱恢复一下可怜的自信，失去多年的自信才能回来一点，多年来的年年创伤才能得到恢复。于是在第三次熊市，终于能像
    2～3 岁的小孩子，终于能学好磕磕绊绊地走路了，这才算交易刚刚开始踏入大门，万里长征才刚走了第一步。


    经历过 20 多年，才算刚迈出交易的第一步。这就是绝大多数学炒股炒期货炒外汇者中最优秀的那些人的最真实的写照。这些人全身心投入交易，失去了青春、失去了事业、失去了身体健康，20
    多年过去，仅仅能走出第一步而已。


    但是这第一步走出后，交易者就实现了阶段性质变，成为一个稳定盈利的交易者。其次变成一个赚大钱的交易者也许再过 10 年即可实现。


    中间的问题是什么？就是我们人类多疑的性格而已。我们不相信朋友，甚至不相信自己的家人，我们能相信趋势吗？


    什么时候真正把趋势看成用于不背叛自己、永远忠于自己的朋友，


    交易就入门了。那就不会干逆势的事情了，顺势的单也不会止损了。


    无论如何交易首先经历技术入门，再经历理念入门，最后是坚信技术和理念，在实盘中应用这些技术和理念，时间久了，这些技术和理念就融入了血液，交易就入门了。

    经过几年学习，刚刚搞清楚了正确的技术和正确的理念，就想交易入门，是不可能的。感觉万事俱备只欠东风，距离交易成功只差一步。但是就这一步，还得需要经过漫长的亏损过程才能走完。

    交易成功的人，都是品德极其优秀的人，绝没有阴险小人，这个行业阴险小人绝不可能成功。交易成功是符合自然之道才能成功。走正道是交易成功的必备条件。选择了交易的道路，就得走人间正道，就得做一个品德高尚的人。

    交易最终成功到底需要多少年？

    这是很多人想问的问题。

    如果一个人把主要的精力用于交易上，正常人大约 8～10 年即可入门，实现稳定盈利。赚大钱需要 15 年左右。所以一个正常智商的人做交易，全身心投入交易，大约
    15 年后就能赚大钱，最迟 20 年后就能赚大钱。

    普通人干一件普通事，潜心 20 年，没有不成功的。要坚信这一点。亏损累累的交易者，相信这一点，你才能坚持下去。

    成功后干什么呢？要去干正事。不要干无聊的事情。如果有能力，就去推动中国的进步，这是最大的正事，否则就洁身自好。干正事才能好运常存，干坏事难以长期保身。

    交易成功非常简单：那就是你要发自内心地坚信交易成功是很简单的事。

    最后一句话：一定要顺势交易。


