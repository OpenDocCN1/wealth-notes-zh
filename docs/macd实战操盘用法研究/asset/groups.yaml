    ## 顺势十回撤和转折十确认的含义：


    - 1. 期货市场上的建仓机会，本质上只有四种： 第一种是转折加确认； 第二种是顺势十回撤； 第三种是极端的远离平均价格（均线）； 第四种是收敛形态内边线双向交易。


    其中，第三、第四种机会适合短线操作，这种机会我能看懂，但胆子小，不敢做，只好留给别人做了。前面两种机会，是中长线机会，比较容易把握。


    - 2. 说到顺势和转折，必须在一定的时间周期上定义，我的定义是：铜要用 75 日以上均线＋趋势线＋颈线，其他用 30 日以上均线＋趋势线＋颈线。


    - 3. 所谓顺势，是指定义的均线系统＋趋势线的方向明确，所谓回撤是指价格向上述两线靠近或者急速穿越后又回到顺侧。


    这里特别要提醒的是，当两线（均线、趋势线）防线明显而价格快速从远处回撤并穿越两线时，你千万别转向操作，恰恰相反，应该在价格企稳后顺两线防线建仓。我说的可能复杂了点，这就是人们常说的葛兰维均线法则。建议各位朋友再去研究一下。


    - 4. 所谓转折＋确认，是指 30、75 日或周以上均线＋趋势线＋颈线都突破了，而且价格有反抗（回抽或横盘）行为，那就可以肯定，趋势变了，该换方向交易了。


    - 5. 特别向大家建议两点：第一点，一般而言，当看不明白方向时，也就是说价格属于收敛形态中时，应该看看周线和月线，尽量顺原来方向的那一条形态边线建仓，如果形态顺势突破，就加仓，如果逆向突破，就反手。这样条理分明，比较好操作，尽量别双向操作，最后把自己搞的精疲力竭，真突破了，反而不敢做了。第二点，任何时候，不要轻易判断说方向变了。换句话说，宁可顺原来的方向，不可轻易转向交易。因为真正的转向实际上是很少的，交易机会中估计只占
    20%，其他都是顺势机会，我们何必要舍弃可能性大机会和去抓可能性小的机会呢？


    ## 要想在市场上立足，必须对技术分析和运用有一个根本的认识：


    1. 技术分析的实质是分析价格形态、价格方向及其包含的风险和收益概率。


    2. 技术分析应该坚持四项基本原则。


    第一是客观：就是说，我们在选择技术工具和运用技术工具时候，尽量选择没有包含价值判断的工具，比如 K 线、均线、颈线、趋势线、价格箱等，反过来来，KDJ、ADX、MACD
    这些摆动指标就包含了许多主观判断，比如多少数量是超买、超卖之类，依据这些摆动指标交易，很容易落入陷阱。


    第二是本原：尽量用原始指标，比如 K 线平台、价格通道等，少用后人计算出来的指标，道理很简单，环节越少，出问题的概率越低，越复杂的设备越容易出故障。


    第三是简明：一个交易体系，最好只用一个工具，或者利用相互补充的两三个工具，比如 K 线、均线、趋势线、颈线，四者层层推进，互相支持，各司其职，而且一眼就看明白了，其他指标都是因它们而来的。


    第四是一致：千万别用相互矛盾的指标，均线、趋势线、颈线与许多摆动指标在许多时候是互相矛盾的，趋势越强劲，颈线越是要突破时，摆动指标越表现为超买、超卖，这一方面被主力充分利用来引诱散户逆向交易，另一方面是散户们内心永远充满矛盾，无法挣到大钱。


    3. 技术只是工具，技术本身不能说明你什么时候建平仓。你应该运用技术出现某一特征时候建平仓。对于这种特征，你必须大量对图形进行统计分析和逻辑分析，找到成功率最高的图形进行运用。不仅如此，最好每隔一年统计一次，以便与市场的最新发展保持一致。


    4. 技术运用离不开时间周期，如果是做中线，建议只看日、周级别的图表，因为时间周期越长，越不容易被操纵。


    5. 技术分析、技术系统只是交易系统的一部分，必须把资金管理、止损、扩利也做好，技术才能发挥作用。


    6. 基本面分析必须用技术分析来补充，但技术分析完全可以脱离基本分析而存在，特别是钱少的人，千万别以基本面分析为依据交易。


    别把眼睛只盯着钱，那样就看不清行情了。我建议各位把铜、胶、柏、油、小麦的图从 2000 年研究到现在，如果你立足中线，交叉操作，能挣到不少钱。不过，我再次建议，别考证过去赢利了多少倍，用眼睛看住图形，尤其是周线图，并用日线选好交易点，不要随便跑进跑出，挣钱并不是很难得。我从不做行情评论，这里破个例，建议大家研究一下胶的连续图，看看周线，已经破了大箱体，有点像铜，其库存和基本面也有点像铜，如果确认突破成功，就是大机会；当然，如果又跑回箱体内，另当别论；至于铜，新箱体在
    3000 至 5000 之间，千万别以过去的价格眼光看铜；还有豆粕，也是好品种，盯住它。这三个品种是给你大机会的品种，就看你的耐心了。还有三句话供大家参考：1.
    周线判断行情性质：顺势、反弹、转折、区间，日线选交易点；2. 只在三种情况下交易：转折突破＋确认；顺势＋反弹（回撤）；大形态边线；3. 心中只有图形没有钱。


    ## 以糖为例谈谈如何进行成功的交易：


    第一，必须懂得期货交易赢利的基本原理。

    我把这个原理概括为一个公式，即：交易损益＝机会成功率×机会仓位率×仓位损益率。你只要保证了你交易时成功的概率大于50%，交易成功时仓位大于交易失败时的仓位，交易失败时的损失小于交易成功时的赢利，那么你必胜无疑。


    第二，如何使机会的成功率大于50%？


    1. 首先，弄明白你依据什么交易。我的经验是，小资金唯一的依据只能是技术，而且是简明扼要的技术图形。在这个问题上，最大的陷阱有三个：一是所谓基本面消息，二是所谓名人预测，三是所谓评论。道理很简单，即使是那三个交易依据都正确，如果你技术交易点不对头，一个震荡就让小资金承受不了。比如说现在的糖，罗杰斯说要涨，那些乱嚷嚷的人也说要涨，我们能依据这些来建仓？我也曾经准备做多，但我绝对不会随便介入。我必须等待两个技术条件才会做多：区间突破＋均线系统收敛并给出方向。如果给出的方向向下，我就改主意做空了，反而不做多了。我唯一的依据是技术图形，至于什么罗杰斯，不会把他当回事，道理很简单，我如果输了钱，他也不赔我，我干吗听他的？


    2. 其次，你运用什么技术图形交易？我的经验是：越原始越简单越好。就用区间＋趋势线、均线、颈线（形态）就足够了。所以，建议你把其他图形全删除。运用这些技术工具，你看看糖是个什么样子？国内的糖，在4500～5300这个大区间内震荡，均线系统杂乱，没什么方向；美国11号糖，也在一个区间震荡，但向下破位的危险比较大，日线上向下破位的态势更明显。运用图形，一看就简明扼要，还需要听罗杰斯的？我这么说，肯定有人会指责我不尊重大名人。我有我的道理：即使罗先生说的对，将来糖真能涨300%，可目前没涨，目前的回调也足以让我做多死掉，就是将来涨了，对我有何意义？别只信罗杰斯，要信自己的眼睛＋技术图形。技术图形涨了，跟进就是了，即使老罗说不涨也照涨不误；技术图形跌了，跟进就是了，即使老罗说涨也没用。


    3. 如何运用技术图形？第一步，看清价格运行的大区间，知道价格的支撑阻力在哪里？见过大江大河吗？两条河岸就决定了水的运行区间。价格就是水，区间就是河岸。第二步，运用趋势线和均线判明价格是在震荡还是明显单边方向中；第三步，如果价格在震荡中，就别交易，或者按照震荡的边线做短线交易；第四步，如果价格在单边趋势中，就顺着大方向，回调就建仓。目前的糖，是在区间震荡中，正确的交易方式是：要么别交易，等突破方向；要么在两个边线附近做多或做空，等区间突破后再定中线方向。盲目叫多叫空，要么是门外汉，要么是骗人的侏儒，愿朋友们慎重。


    总之，只要你能分辨价格是在震荡还是趋势中，在震荡时，边线交易；在趋势中坚持有顺势＋逆波交易，那么你成功的概率就大于 50%。当然，如果你说你分不清震荡和趋势，那我只能把你归入那一类没入门的人之列了。不同的是，我同时建议你把工夫放在学习上，而不是放在喊叫上，那样你很快就入门了，而不会一生都在门外。


    第三，如何控制仓位？


    首先必须明白，控仓是绝对必须的。因为任何机会都不是 100% 对的，我们人的认识能力也总免不了犯错误。如果你满仓交易，一旦出错，必定死掉，就再没有机会了。我建议：任何时候，总仓位别超过
    50%，单品种仓位别超过 30%，像糖这样的品种，别超过 20%。还有一点特别重要，把要建的仓为分成两半，第一半对了，加第二半。但是，区间边线交易别加仓。


    第四，如何控制仓位损益率？


    - 1. 要会止损。


    首先，建仓要就止损。如果不好止损，或者止损量大，宁可别建仓。比如现在的糖，你在 4600 左右做多，在 5100 以上做空，离边线不远，就好止损，否则，你真会左右为难。


    其次，也别随便止损。这就要求你轻仓。只要大格局没变，别轻易逃跑。再次，一旦大格局变了（突破了），一定要一次 100% 跑掉。现在的糖，如果破了区间，跑的越快越好。


    - 2. 要学会捂“大”钱。


    方法很简单：一旦做对，画一条波段趋势线，没破趋势线，绝对不出来。


    我可以告诉大家，我的铜多单虽然走了，但天胶和玉米多单至今没动，道理很简单，趋势没变啊。


    第五，概括一下我的交易思想：


    - 1. 从交易方法上看，概括为十个字：顺势、逆波、控仓、止损、扩利。


    - 2. 从交易者看，概括为八个字：客观（只用眼睛交易）、耐心、简明、一贯。


    ## 交易基本策略：


    1. 固定交易品种（CU、RU、SR、C）＋顺势、波初介入＋控仓（总仓 55%、单仓 35%；波初 70%，加仓 30%）＋止损（8%）＋扩利。


    2. 客观简明一贯的规则＋等待机会的耐心＋控制仓位的理智＋快速止损的果断＋扩大利润的大气。


    我只做五类机会：月周线趋势强劲＋远摆价格带回破，小仓短线；月周线趋势强劲＋2B 价格带回破，小仓短线；月周线趋势平缓＋价格带边线，小仓短线；月周线收敛趋转＋价格带突破，中仓中长线；月周线趋势强劲＋回调价格带突破，中仓中长线。


    特别说明：


    - 1. 短线指 1～3 周，长线指 4 周以上。

    - 2. 我从不重仓，更别提满仓，因为那是找死。


    ## 交流一下“心态”问题：


    很多朋友喜欢谈心态问题。也有人认为心态重于一切，似乎有了好心态，什么问题都解决了。我认为，对于心态问题，也要客观全面地分析和把握。


    第一，好心态要有物质基础，否则就会陷入唯心主义的空谈，甚至陷入神秘主义。心态的物质基础有两条：


    一是仓位。只有控制好仓位，才能面对震荡而心不慌。如果你仓位过大，稍微一震荡就可能玩完，恐怕谁的心态也好不到哪里去。


    二是 一个客观简明的好交易方法。因为只有好的交易方法才能既看清市场方向，又可以选择一个好的优势位置，你才能游刃有余地应付震荡，而且即使是建仓错了，由于你的位置有利，止损起来也方便。如果具备了这两个物质基础，好心态就有了基础。


    第二，好心态有其特定的内涵。


    首先，好心态是指任何时候都要明白价格运动既有规律，又有一定随机性。任何时候，你的判断都有可能错，也有可能对。我们唯一能做的事情只有两条：通过努力，使我们抓住的机会成功的概率大于
    50% 或者更高一点，但我们永远别追求 100% 的正确率。否则，你必然整天惶恐不安，生怕犯错误。另外，既然犯错误难以避免，那我们就应该把迅速利索地改正错误作为良好心态之一来对待。千万不要像部分人，错了，死不认错，还不断找理由来为自己坚持错误辩解，其实何必呢？只要我们承认我们是人不是神，犯错误和改错误都是天经地义的事。可以说，这个心态，是决定你能否在期货市场长久生存的关键因素。


    其次，我们不仅要不怕犯错误，还要敢于做正确的事。交易信号一出现，就要坚决交易，绝对不能不敢行动。只是你在行动时注意控制风险，不要孤注一掷，要想好错了如何逃跑就行了。还有，只要你做的事情总体是正确的，就要坚持，别轻易退出正确的行列。换句话说，只要你的仓位是正确的，就要一路持有。


    再次，坚持八个字：客观，就是用眼睛交易，防止耳朵和心干扰你的交易；耐心，你的交易方法就是你的猎枪，端着它，守株待兔，等待交易信号出现；简明，就是抓住几条根本的市场特征，别以小人之心度君子之腹，别去猜测什么主力啊庄家之类的无聊东西，更不要弄了一大堆花花绿绿的指标，保持工具和心态的简明；一贯，就是别天天改方法，只要方法能挣钱，就别改，始终如一地坚持它，除非实践（亏钱）证明它错了。


    最后，好心态不是凭空得来的，必须心性平稳。但这种平稳不是指的念经，而是实践，要不断通过交易，通过总结正反两方面的经验来平稳心态，我的感觉是，必须有两三年时间，当你的方法成为你的习惯与性格时，你的心态就自然好了。如果你心态没有成为习惯和性格，如果你还在谈论心态的重要性，那么，可以肯定，你的心态还不好。


    ## 以糖为例谈谈失败的交易：


    失败的交易，说到底就败在不尊重市场方面。具体表现在：


    第一，不关注市场价格本身的走势，而是自己持有什么仓位就一厢情愿地认为市场会朝什么方向走，当市场走反时，不仅不改正错误，反而以各种可笑的理由为自己辩护。其实，市场永远是一种可能发生，我们建仓时也只是一种对可能性的判断，如果判断错了，就该走人，而不应该固执己见。我在糖上多空赚过大钱，在回撤以后也建过多头仓位，但当市场告诉我价格进入震荡状态后，我就再不固执于多头或空头，而坚决平掉多头，亏点小钱，并转变为区间偏空的交易思路。这个思路，至今仍然有效。


    第二，不关注市场走势，而以什么主力、庄家之类的说法来交易。其实，主力的任何行为都在价格上有反应，何必去猜测啊？甚至搬出个什么罗杰斯来说事，可以想想，谁的话都不是绝对真理，就算是绝对真理，还有一个如何操作的问题。即使是大牛市，回调也能死人。还是那句话，主力也好，老罗也好，都得经历市场检验。市场比老罗走得更快更真实，我们何必要舍近求远，不相信眼睛而相信耳朵呢？


    第三，交易错了总以什么长线趋势没变来辩解。其实，由于期货是保证金交易，风险和收益都成十倍的放大。即使你看清了长线趋势，如果你不会回避短线风险，那一个回调就死了，还谈什么长线？这就有点像股市上说的一句话：短线变长线，长线变贡献。股市多少还给你留点股票，期货你要是也那么玩，就什么也不剩了。


    第四，不懂得博弈原理。期货其实本质就在于输时输小钱，赢时赢大钱，并尽量提高赢的次数比例。没有任何人，包括老罗，能次次做对，关键是对了要扩大胜利，错了要快速逃跑。可有些人，认为会做期货的人，必然每次都对。我的交易成败比率在
    60%～70%之间，但这并不妨碍我挣钱。糖也一样，看错了不要紧，改就得了。就怕错了，还死要面子，死不改正，又去瞎喊其他品种，其实，这种做法，只能骗那些没入门的人，对于有点专业素质的人来讲，只是增加点笑料而已。


    再加一条，别以一两天的价格变动来判断市场。有些人，往往在价格没顺他的想法走时，一声不响，一旦某天价格顺他的方向走走，就大呼小叫，反复强调自己正确。其实，价格在一个大方向下，经常出现大幅度的反向运动，我们应该始终顺大方向，逢小反弹介入，这就占领了制高点。


    ## 怎样确定其突破的真实性和有效性呢？


    识别假突破是有一定规律可循的，虽然价格运行的轨迹总是飘忽不定、难以捉摸，但由于市场多种因素的作用，价格往往能够在一个特定的阶段运行于一个相对清晰的趋势中。这就使得趋势线、通道、形态等理论在投资操作中具有相当重要的技术分析意义。


    一般地说，不管是上升还是下降，在一个相对平缓的运行趋势中市场机会较难把握，而在市场突变过程中将孕育更多、更大的市场机会。当趋势线被有效击穿后，市场便发生了质的变化，行情开始加速。此时正是加码建仓的好机会，而误判的投资者也应果断离场并尝试反向操作。客观地说，由于趋势改变带来的中线机会以及回抽趋势线（或颈线）的短线机会都是市场变化过程中难得的、最具操作性的投资机会。


    但市场也有其复杂的一面，常常在其突破的有效性上花样百出，搞一些形形色色的令人迷惑的骗线做法。通道上轨被突破后，人们预期价格将加速上扬，等追高盘蜂拥而至时，价格却会“栽”下来，形成多头陷阱。同样也常出现击穿下轨形成空头陷阱的情况。


    技术分析理论认为：


    首先，是收市价原则。即一般地说，收市价的突破比仅仅只有日内瞬间价格的暂时突破更可靠。其次，是百分比原则。它要求收市价格穿越参考价的幅度要达到3%（当然3%只是就一般情况而言），针对不同品种可以选用不同的最小价格波动允许值，但至少2%的幅度是必须的。最后，是时间原则。为了确认对趋势线的有效突破，市场必须连续3天保持收市价在该直线的同一侧。当然也有人认为期货市场只要2天即可。


    以上原则，虽然可靠，但需要的时间较长，等突破得到确认后，行情往往已走去一大截，投资者此时的人市成本也较高。


    实用的还是应该学会辨别一些骗线做法，笔者就个人的实战经验，总结如下：


    首先，是与大势背离。一般而言，当市场整体大势处于调整、反弹或横向整理的阶段时，个别合约出现放量突破是假突破的可能性较大；而当大势处于较为明朗的情况下，个别合约顺势出现真突破的可能性较大。投资者应结合基本面、历史上的资金介人状况、目前价格位置以及主力操作习惯等进行综合研判。特别要当心在低价区的向下突破和在高价区的向上突破。


    其次，是与量能背离。就笔者的经验，当价格突破以后，交易量应该顺着市场趋势的方向，相應地增长，这是验证所有价格形态完成与否的重要线索。任何形态在完成时均应伴随着交易量的显著增加，但在形态的顶部、反转过程的早期，交易量并不如此重要。一旦熊市来临，市场习惯于“因自重而下降”。投资者当然希望看到，在价格下跌的同时，交易活动也更为活跃，不过在下跌过程中，这不是关键。然而在底部反转过程中，交易量的相应扩张，却是绝对必要的。如果当价格向上突破的时候，交易量并未呈现出显著增长的态势，那么整个价格形态的可靠性就值得怀疑了。


    再次，是与K线形态背离。以价格向上突破为例，当价格放量突

