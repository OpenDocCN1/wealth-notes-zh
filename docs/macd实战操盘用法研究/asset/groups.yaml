    # 12.2 从缠论的角度贵州茅台 2012 年如何逃顶？


    贵州茅台自 2012 年 7 月 16 日最高点 228.5 元（复权价，以后全是复权价）开始大跌，2014 年 1 月 8 日跌到 103.31 元，总共跌了两年半，跌幅超过
    50%，如何能逃过这波大跌呢？利用缠论很容易提前看出这波大跌。


    下图 12.2 是贵州茅台股票月线图，图中上涨分为三个阶段，第一个阶段是月线上张，这波上涨为线段 a，第二阶段是月线下跌，这波构成中枢 B，第三阶段是月线上张，这波上涨线段为线段
    c。


    因为 c 段的 MACD 红柱子面积之和小于 a 段的 MACD 红柱子面积之和，且 c 段的 MACD 黄白线都低于 a 段 MACD 黄白线。显然 a
    与 c 两段构成盘整顶背驰。这样后市一个大级别的下跌，是不可避免的，这种盘整背驰下跌，一般会由于中枢的吸引而回到中枢，由此看下跌空间是巨大的，必须逃顶。


    由此 B 段就构成了背驰段。我们需要分析 c 段内部，这需要分析周


    线图。C 段用周线图这个显微镜观察时，需要找出其内部的中枢，然后比较中枢前后的两段线段的背驰情况，找出更小的背驰段 c2。这样就实现了背驰段观察区间的缩小，有利于寻找合适的做空点。这样做，把做空区域从
    c 缩小为 c2。


