    # （三）KDJ 曲线的交叉


    KDJ 曲线的交叉分为黄金交叉和死亡交叉两种形式。


    一般而言，在一个股票的完整的升势和跌势过程中，KDJ 指标中的 K、D、J 线会出现两次或以上的“黄金交叉”和“死亡交叉”情况。


    1. 当股价经过一段很长时间的低位盘整行情，并且 K、D、J 三线都处于 50 线以下时，一旦 J 线和 K 线几乎同时向上突破 D 线时，表明股市即将转强，股价跌势已经结束，将止跌朝上。如果市场是涨势，可以中长线买入；如果市场是跌势，可以短线抢反弹。这是
    KDJ 指标“黄金交叉”的一种形式。


    2. 当股价经过一段时间的上升过程中的盘整行情，并且 K、D、J 线都处于 50 线附近徘徊时，一旦 J 线和 K 线几乎同时再次向上突破 D 线，成交量再度放出时，表明股市处于一种强势之中，股价将再次上涨。如果市场是涨势，可以加码买进股票或持股待涨；如果市场是跌势，短多可以继续持有。这就是
    KDJ 指标“黄金交叉”的一种形式。


    3. 当股价经过前期一段很长时间的上升行情后，股价涨幅已经很大的情况下，一旦 J 线和 K 线在高位（80 以上）几乎同时向下突破 D 线时，表明股市即将由强势转为弱势，股价将大跌，这时应卖出大部分股票而不能买股票，这就是
    KDJ 指标的“死亡交叉”的一种形式。如果市场是跌势，可以大胆开空单；如果市场是涨势可以短线平仓，不能开空单。


    4. 当股价经过一段时间的下跌后，而股价向上反弹的动力缺乏，各种均线对股价形成较强的压力时，KDJ 曲线在经过短暂的反弹到 80 线附近，但未能重返 80
