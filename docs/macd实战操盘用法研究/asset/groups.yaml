    外，建仓要分批进行，错了及时逃跑，对了就递减加仓，耐心持仓，直到价格破趋势线和颈线再平仓。还有，千万别关心基本面和价格高低，顺势交易就行。


    我送大家一个公式，如果各位领悟透了，肯定有投资收益：


    投资损益＝机会成功率×机会仓位率×仓位损益率。


