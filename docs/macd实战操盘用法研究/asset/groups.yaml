    识别假突破是有一定规律可循的，虽然价格运行的轨迹总是飘忽不定、难以捉摸，但由于市场多种因素的作用，价格往往能够在一个特定的阶段运行于一个相对清晰的趋势中。这就使得趋势线、通道、形态等理论在投资操作中具有相当重要的技术分析意义。


    一般地说，不管是上升还是下降，在一个相对平缓的运行趋势中市场机会较难把握，而在市场突变过程中将孕育更多、更大的市场机会。当趋势线被有效击穿后，市场便发生了质的变化，行情开始加速。此时正是加码建仓的好机会，而误判的投资者也应果断离场并尝试反向操作。客观地说，由于趋势改变带来的中线机会以及回抽趋势线（或颈'
