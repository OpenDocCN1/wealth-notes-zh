    线）的短线机会都是市场变化过程中难得的、最具操作性的投资机会。


    但市场也有其复杂的一面，常常在其突破的有效性上花样百出，搞一些形形色色的令人迷惑的骗线做法。通道上轨被突破后，人们预期价格将加速上扬，等追高盘蜂拥而至时，价格却会“栽”下来，形成多头陷阱。同样也常出现击穿下轨形成空头陷阱的情况。


    技术分析理论认为：


    首先，是收市价原则。即一般地说，收市价的突破比仅仅只有日内瞬间价格的暂时突破更可靠。其次，是百分比原则。它要求收市价格穿越参考价的幅度要达到3%（当然3%只是就一般情况而言），针对不同品种可以选用不同的最小价格波动允许值，但至少2%的幅度是必须的。最后，是时间原则。为了确认对趋势线的有效突破，市场必须连续3天保持收市价在该直线的同一侧。当然也有人认为期货市场只要2天即可。


    以上原则，虽然可靠，但需要的时间较长，等突破得到确认后，行情往往已走去一大截，投资者此时的人市成本也较高。


    实用的还是应该学会辨别一些骗线做法，笔者就个人的实战经验，总结如下：


    首先，是与大势背离。一般而言，当市场整体大势处于调整、反弹或横向整理的阶段时，个别合约出现放量突破是假突破的可能性较大；而当大势处于较为明朗的情况下，个别合约顺势出现真突破的可能性较大。投资者应结合基本面、历史上的资金介人状况、目前价格位置以及主力操作习惯等进行综合研判。特别要当心在低价区的向下突破和在高价区的向上突破。


    其次，是与量能背离。就笔者的经验，当价格突破以后，交易量应该顺着市场趋势的方向，相應地增长，这是验证所有价格形态完成与否的重要线索。任何形态在完成时均应伴随着交易量的显著增加，但在形态的顶部、反转过程的早期，交易量并不如此重要。一旦熊市来临，市场习惯于“因自重而下降”。投资者当然希望看到，在价格下跌的同时，交易活动也更为活跃，不过在下跌过程中，这不是关键。然而在底部反转过程中，交易量的相应扩张，却是绝对必要的。如果当价格向上突破的时候，交易量并未呈现出显著增长的态势，那么整个价格形态的可靠性就值得怀疑了。


    再次，是与K线形态背离。以价格向上突破为例，当价格放量突'
