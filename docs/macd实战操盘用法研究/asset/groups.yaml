    上述变异型态，有些至今尚未能在业界取得共识。至少，我认为第 3 及第 5 项不能成立。另外，艾略特还提到了一种叫“半月”的形状。但不是修正浪的具体型态（如图
    9.17）。


    它只是价格指数走势的描述。在一个上升或下跌过程中，市场的多空力量对比缓慢，以至突然加速，然后在一根长阳或长黑中结束。充分反映了股市中投资人的心理变化状况。至今，我们已介绍完所有的波浪型态。有时候虽难看一点，但从我开始认识波浪理论开始到现在，没有一段走势其型态划分在上述讨论的型态之外。起码，波浪理论可以满足


