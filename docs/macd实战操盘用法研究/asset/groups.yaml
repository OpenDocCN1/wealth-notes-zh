    ## MACD 实战操盘用法研究


    过于远离 0 线时候，多方才不得不调整一下，形成远离 0 线的 DIFF 和 DEA 死叉或者远离 0 线的 DIFF 和 DEA 二次死叉，市场调整一下，把
    DIFF 和 DEA 调整到 0 线附近，如果 0 线支撑继续有效，则市场开始新的上升之旅，DIFF 和 DEA 也形成新的一浪比一浪高的上升之旅。


    市场如果是跌势，则 0 线是 MACD 的强大压力线，每次 DIFF 和 DEA 反弹到 0 线，或略微涨破 0 线，必将受到 0 线的强大压力，而从 0
    线弹开，继续下跌远离 0 线，因为跌势的核心就是要求 DIFF 和 DEA 必须不断下降，形成一浪比一浪低的下跌态势。只有确实 DIFF 和 DEA 过于远离
    0 线时候，空方才不得不调整一下，形成远离 0 线的 DIFF 和 DEA 金叉或者远离 0 线的 DIFF 和 DEA 二次金叉，市场调整一下，把 DIFF
    和 DEA 调整到 0 线附近，如果 0 线压力继续有效，则市场开始新的下跌之旅，DIFF 和 DEA 也形成新的一浪比一浪低的下跌之旅。


    MACD 红绿柱子远离 0 线和靠近 0 线，利用 0 线对 MACD 红绿柱的支撑和压力作用做交易的方法，其核心思想也是远离 0 线的柱子要靠近 0 线，靠近
    0 线的柱子要远离 0 线。


    0 线附近时：0 线上，0 线对红柱子构成支撑；0 线下，0 线对绿柱子构成压力。


    远离 0 线时：0 线上，红柱子远离 0 线要下找 0 线；0 线下，绿柱子远离 0 线要上找 0 线。


    可见精确理解 0 线的支撑压力作用，以及 DIFF 和 DEA 远离 0 线必将被 0 线吸引回找 0 线的远离，就是我们正确理解运用 MACD 的一大核心。


    ## 第二章 MACD 与 MA 的经典配合使用


    ### 2.1 MA 的计算方法与基本用法简介


    ### 2.1.1 MA 的计算方法


    均线指标（MA）实际上是移动平均线指标的简称。由于该指标是反映价格运行趋势的重要指标，其运行趋势一旦形成，将在一段时间内继续保持，趋势运行所形成的高点或低点又分别具有阻挡或支撑作用。因此均线指标所在的点位往往是十分重要的支撑或阻力位，这就为我们提供了买进或卖出的有利时机，均线系统的价值也正在于此。均线向上是均线多头，均线向上产生的交叉是金叉，反之是死叉。


    以每天的前九天和当天共十天的收盘价取算术平均值，再以若干天的这种算术平均值而联结的曲线就是十日均线。同样，有十分钟均线、十小时均线，还有以周、月、年等不同的时间单位做成的各种均线。通常10个时间单位的均线统称为10均线。20均线就是20个时间单位的均线，依次类推，其他都是同样的意思。以上是常见的做法。还有人取每天的平均价，还有的取加权平均值等，做法不一。K线图中常标以MA5、MA10、MA20、MA30……


    以前的K线图通常都是自己计算而绘制的，现在，所有的技术分析软件中都可以的某一时间周期的K线图中找到相对应的均线。由于均线对股价趋势有一定的比照作用，所以，它对于技术分析相当重要。一般以日线MA5、MA10分析短期走势，以MA30、MA60分析中期走


    势，以 M125 和 M250 分析中长期走势。而以 5—30 分钟 K 线做短线操作，以周、月、年 K 线中的均线走向分析长期走向。


    ### 2.1.2 常用均线及均线系统介绍


    由于从均线可以动态分析股价的走势，所以，常有人以均线来设置止损点及止赚点（高抛点），其实就是起到一种通过技术分析而确定的活动标尺的作用。这些都只有相对的参考价值。


    - （一）均线的计算


    举例如下：30 日均线就是大盘 30 天的收盘价再除以 30 形成 30 日均点，然后依次连接就形成 30 均线，其他依次类推。


    从形态来看：前期的密集成交区、前期头部（由上升到下跌的拐点）、前期底部（由下跌到上升的拐点）等。


    从均线系统来看：5 日线、10 日线、20 日线、30 日线、60 日线、半年线、年线等都有支撑，且依次支撑强度越来越强。


    从技术指标来看，各种技术指标都有自己的支撑位和压力位，因为指标太多，你可以自己去看。常见的有 KDJ、MACD、BOLL、W%L等。


    均线的大概特点分多头排列和空头排列：多头排列就是市场趋势是强势上升势，均线在 5—10—20—30—60k 线下支撑排列向上为多头排列。均线多头排列趋势为强势上升势，操作思维为多头思维。进场以均价线的支撑点为买点，下破均价线支撑止损。


    空头排列就是市场趋势是弱势下跌趋势，均线在 5—10—20—30—60k 线上压制 k 线向下排列为空头排列。均线空头排列为弱势下跌趋势。进场以均价线的阻力位为卖点，上破均价线止损。


    均线是技术指标分析的一种常用工具，被大多技术分析者采用。5—10 均线变化较快，常用的就是 5—10—20—30 均线，期货价格变化较快，用 60 以上的均线较滞后，常用均线
    5—10—20—30—60 日均线为主。


    均线在什么条件下价格具备单边快速大幅暴涨，条件是 1 分—5—10—15—30—60—日—周—月均线都是多头排列。其他影响暴涨因素除外。反之单边暴跌一样。


    周月线的均线时间把握趋势会更稳定，均线变化短时不会太大。如果周月线是多头排列或空头排列，这拨行情上涨或下跌的时间周期要更长。


    均线的相互关系，如日线均线多头排列，周线空头排列，周线有均线压力，价格会震荡上涨，也可能会上涨失败，因周线的均线不会很快改变，影响趋势变化更大一些。如周线也是多头排列，价格涨幅会更稳定，趋势也较稳定不会轻易改变。如5分均线多头排列，10分空头排列，5分上涨的失败概率会更高。如60分均线多头排列，进行短线交易会维持60分的支撑强势，短线交易成功概率会比5分高。如果均线日线比较乱，上有均线压力下有均线支撑，这是震荡势，趋势方向不明。


    买卖点，应用均线设买卖点，均线系统在粘合交叉向上为买点；启动点，根据各个不同时间图的连环性来定价格启动的幅度大小。比如5分条件具备了，10分不具备，5分上涨的压力位在10分均线。均线系统在粘合交叉向下为卖点。为下跌启动点。


    应用均线系统可以用来看明现在的趋势是强势还是弱势震荡势、买卖点的信号以及现在将要启动的信号。


    - （二）移动平均线的买入时机


    均线首次粘合向上发散，或均线首次交叉向上发散是激进型投资者的买进时机；均线再次粘合向上发散，或均线再次交叉向上发散既是稳健型投资者更是激进型投资者买进时机。


    为什么这样描述呢？因为均线首次向上发散（包括粘合向上发散，交叉向上发散），多方基础并不稳固，如果空方抛压力量很大，或多方上攻力量不足，行情随时都有可能遭到夭折。因此在这种情况下，稳健型投资者为了资金安全起见，应继续观望，不要轻易出击，而激进型投资者可在设好止损位的前提下积极跟进。但均线再次向上发散（包括再次粘合向上发散，再次交叉向上发散）与均线首次向上发散有很大不同，这时多方基础已相对比较稳固；多方主力再次向上攻击，往往是有备而来，股价继续上涨的可能性要比首次向上发散时大得多。此时，稳健型投资者就可主动出击，而激进型投资者在风险系数减少的情况下更加可以大胆地采取积极做多的策略。


    有投资者可能要问：为什么均线首次向上发散，激进型投资者和稳健型投资者所采取的投资策略有如此大的不同呢？因为激进型投资者本来追求的就是在高风险下的高收益，见到均线向上发散就觉得机会来了，自然会主动出击，当然，这里承担的风险也很大。我们可以设想一下：均线首次向上发散后，形成继续向上发散趋势，股价涨上去了，激进型投资者就此能大赚一笔；均线首次向上发散后，很快收敛起来，股价跌下去，激进型投资者即使及时止损，也要遭到一些损失，如果止损不及时，或因接盘很少筹码抛不出去，损失就更大。可见，激进型投

