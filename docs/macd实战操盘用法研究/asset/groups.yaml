    ## 十六、支撑位和阻力位如何互换角色


    到此为止，我们把“支撑”定义为前一个低点，而把“阻力”定义为前一个高点。然而，情况并不总是如此。这把我们领入支撑和阻力的更有趣也更鲜为人知的一面——它们的角色互换。一旦支撑位或阻力位被大大击破，它们就互换角色，成为对方。换言之，阻力位变成了支撑位，而支撑变成了阻力。要理解为什么出现这种情况，或许讨论一下形成支撑位和阻力位背后的心理状态会有所帮助。


    ## 十七、支撑和阻力的心理状态


    为了说明，我们把市场参与者分为三类——多头、空头和观望者。多头是那些已经买入的交易者；而空头是那些已经站在卖方的交易者；观望者则是已经离场或者还未决定站在哪一方的人。


    让我们假定市场从一个支撑区域——市场已在此波动了一段时间——开始向上运动。多头（那些在支撑区域附近买进的人）兴高采烈，后悔当初买得太少。如果市场再次回调至支撑区域附近，他们会增加多头仓位。空头现在意识到（或强烈感到）他们处于市场错误的一边。（市场从该支撑区域上升的距离将大大影响这些判断，不过我们稍后会讨论这一点。）空头希望（并祈祷）市场再跌回支撑区域，这样他们就能在当初进场的位置离场（他们打平的地方）。


    那些站在边界线上的人可以分成两群——那些从未持仓的人以及那些出于这样或那样的原因在支撑区域把多头仓位平掉的人。当然，后一群人正在为过早地平掉多头仓位而恼火，他们希望有另一次机会在接近他们卖出的地方把那些多头仓位补回来。


    最后一群人，即那些犹豫不决的人，现在意识到市场正在攀升，因此决心要趁下一个买入良机进场做多。所有四群人都决意“在下一个回调中买进”。他们在市场下方那个支撑区域都有一种“既得利益”。自然地，如果市场的确下跌到该支撑附近，那么所有四群人重建的买意会使推动市场上扬成为现实。


    在该支撑区域发生的交易越频繁，它的意思就越大，因为更多的市场参与者在这个区域有了“既得利益”。任何一个支撑位或阻力位的交易量可由三个方面决定：在该位置花费的时间、成交量以及交易发生的时间有多近。


    市场在一个支撑区或阻力区交易得越久，该区域就越重要。例如，如果市场在走高之前，在一个巩固区横走了三周，那么这个支撑区就比仅仅交易了三天的支撑区更加重要。


    成交量是另一个衡量支撑和阻力重要性的途径。如果一个支撑位在巨额成交量下形成，那就表明有大量交易单位换手，而且标志着这个支撑位比交易清淡的支撑位更重要。衡量日内交易活动的
    OX 图在确认交易最频繁因而支撑和阻力很可能最有效的价位时特别有用。


    判断一个支撑区或阻力区的重要性的第三个途径是交易发生的时间有多近。因为我们正在研究交易者对市场运动以及他们已经建立或未能建立的仓位的反应，所以交易活动越近，支撑或阻力的潜力就越大。


    现在让我们扭转一下，想象市场不是走高，而是走低。在前面的例子中，由于市场上升，因此市场参与者的总体反应导致每次下跌反作用会遇到更多的买盘（因而产生了新的支撑）。然而，如果市场开始下跌，


    而且跌破了前一个支撑区域，那么市场参与者的反应恰好相反。所有那些在支撑区买进的人都意识到他们犯了错误。对于期货交易者来说，他们的经纪人现在开始发疯地催缴保证金。由于期货交易的高杠杆性质，交易者难以长久坐视亏损。他们必须补足保证金，或者平掉正在亏损的仓位。


    最初造就支撑区域的是市场下方的买单优势。然而现在，以前市场下方的所有买单全都变成了市场上方的卖单。支撑已经变成了阻力。而且，前面支撑区的重要性越大——即，那里发生的交易距今更近而且更活跃——现在变成阻力区的潜力便越大。三类参与者——多头、空头和观望者——当初创造支撑的所有因素，现在的作用是给随后的市场上升或反弹放上了一块天花板。


    为什么走势图分析人士使用的价格形态以及像支撑和阻力这样的概念确实奏效，偶尔停下来对此做一点反思很有用。这不是因为走势图或在走势图上画出的某些直线产生了某种魔力。这些形态起作用是因为它们为市场参与者的实际活动提供了生动的写照，并使我们判断市场参与者对各种市场事件的反应。走势图分析其实研究的是人类心理以及交易者对变化中的市场条件的反应。遗憾的是，由于我们生活在步调迅速的金融市场中，因此我们往往大量依赖走势图名词和简称，而这些名词和简称忽略了首先在走势图中创造各种图形的内在力量。为什么能够从各种价格走势图上确认支撑位和阻力位，为什么能够用它们来帮助预测市场运动，这些都有可靠的心理学原因。


    ## 十八、支撑变为阻力，反之亦然：穿越程度


    支撑位被穿越到一定程度之后就变成了阻力位。注意市场在下面左图中上升时，点4处的反作用在点1处的波峰顶端或其上方止住。点1处的前一个波峰曾是一个阻力位。然而，一旦它被浪3明确地穿越，那么这个前面的阻力波峰就变成了一个支撑位。所有先前在浪1顶端附近的卖盘（创造了阻力位）现在成了市场下方的买盘。在展示了下跌市场的下面右图中，点1（曾经是市场下方的一个支撑位）现在已经变成了点4处市场上方相当于一个天花板的阻力位。


    早先曾提到过，价格从支撑位或阻力位开始运动的距离会增加该支撑或阻力的重要性。当支撑位和阻力位被穿越并变换角色时，这种情况尤为突出。例如，据说仅在重大穿越之后，支撑位和阻力位才互换角色。但怎样才算重大呢？在判断一次穿越重大与否时，有相当多的主观


    色彩。作为一种基准，有些走势图分析人士把 3% 的穿越作为评判标准，尤其是碰到主要的支撑位和阻力位时。短期支撑区和阻力区可能只要求小得多的数字，如 1%。实际上，每个分析人士都必须为自己决定穿越多少才算有效。但要记住，只有在市场运动得足够远，使市场参与者确信他们已经犯下错误时，支撑区或阻力区才会互换角色。市场走得越远，他们越相信。


    ![](img/e00f2195878851621153c98be41c491d_244_0.png)


    在一轮上升趋势中，各个阻力位被穿越到了足够大的程度后，就变成了支撑位。一旦点1处的阻力被超越，它就在点4处提供了支撑。 前面的波峰在后续的调整起到了支撑作用。


    在一轮下降趋势中，被跌破的支撑位变成了后续反弹的阻力位。注意，点1处前面的支撑是如何变成点4处的阻力的。


    # 图 10.10


    ## 十九、整数作为支撑和阻力的重要性


    整数有阻止上涨或下跌的倾向。交易者往往把 10、20、25、50、75 和 100（以及 1000 的倍数）这样的重要整数位当作为价格目标，并采取相应的行动。因此，这些整数位常常担当起了“心理上的”支撑位或阻力位。交易者可以利用这个信息在市场接近一个重要的整数位时开始获利了结。


    黄金市场是这种现象的绝佳例证。1982 年熊市的最低点恰好是 300 美元。市场然后在 1983 年第一季度回升到稍高于 500 美元的位置，随后又跌至 400
    美元。1987 年，黄金的反弹再次于 500 美元处受阻。从 1990 至 1997 年，黄金屡次上试 400 美元未果。道琼斯工业股平均指数有在 1000
    点的倍数处驻足的倾向。


    这个原理的一项交易应用是：避免将委托单正好设成这些明显的整数。例如，如果交易者试图在一轮上升趋势中的短期市场回档时买进，那么最好是把限价委托正好设在一个重要的整数位之上。由于其他人正企图在整数位上买进，因此市场或许永远跌不到那里。寻找反弹机会卖出的交易者应该把限价卖出委托正好设在整数位之下。在对现有仓位设


    置保护性的止损委托时，事情正好相反。作为一条总的规则，避免将保护性的止损委托正好设成这些明显的整数。


    换言之，多头仓位的保护性的止损委托应当设在整数之下，而空头仓位的保护性的止损委托应当设在这种数字之上。对于市场来说，遵循整数，特别是先前提到的重要得多的整数位，是对交易最有用的市场特性之一，因此技术派交易者应该将其牢记在心。


    ## 10.2 维克多 123 转势方法与 2B 法则


    ### 10.2.1 维克多 123 转势方法


    - 1. 趋势线被突破；

    - 2. 上升趋势不再创新高，或下降趋势不再创新低；

    - 3. 在上升趋势中，价格向下穿越先前的短期回档低点，或在下降趋势中，价格上穿先前的短期反弹高点。


    123 法则相当于道氏理论对趋势发生转变的定义，注意其中第二点，有的时候价格会出现短暂的假突破（新高或者新低），但很快会回到前高以下（前低以上），因此还可以和
    2B 法则相结合。


    ### 10.2.2 2B 法则


    在上升趋势中，如果价格已经穿越先前的高价而未能持续挺升，稍后又跌破先前的高点，则趋势很可能会发生反转。下降趋势也是如此，只是方向相反。这两个法则不论是中长线的趋势中还是短线当日交易中都可以加以运用。


    在期货投资中，保护性止损价位的设置非常关键，而运用上述两个法则在期货具体操作过程中，止损价位可以这样设置：运用 123 法则，当上升中出现法则中第 3 条，开立空头头寸，止损价位设在前低点稍上方；在下降中出现法则中第
    3 条，开立多头头寸，止损价位设在前高点稍下方。


    运用 2B 法则，在上升趋势中，价格已经穿越先前的高价，稍后又跌破先前的高点，立即开设空头头寸，止损价为设在先前的高点稍上方；在下降趋势中，价格已经穿越先前的低价，稍后又涨回先前的低点上方，立即开设多头头寸，止损价为设在先前的低点稍下方。


    如果之后又发生符合 123 法则的情况，结合 123 的操作方法追加头寸，原先头寸的止盈价和追加头寸的止损价共同放在前低点稍上方（或前高点稍下方）。


    123 法则、2B 法则在期货上的运用，其好处不仅仅在于较好地把握了价格转向的先机，而且由于止损价位和开仓价位非常接近，使风险能被控制在更小的范围内，从而获得较高风险收益比。


