    # 交流一下“心态”问题：


    很多朋友喜欢谈心态问题。也有人认为心态重于一切，似乎有了好心态，什么问题都解决了。我认为，对于心态问题，也要客观全面地分析和把握。


    第一，好心态要有物质基础，否则就会陷入唯心主义的空谈，甚至陷入神秘主义。心态的物质基础有两条：


    一是仓位。只有控制好仓位，才能面对震荡而心不慌。如果你仓位过大，稍微一震荡就可能玩完，恐怕谁的心态也好不到哪里去。


    二是 一个客观简明的好交易方法。因为只有好的交易方法才能既看清市场方向，又可以选择一个好的优势位置，你才能游刃有余地应付震荡，而且即使是建仓错了，由于你的位置有利，止损起来也方便。如果具备了这两个物质基础，好心态就有了基础。


    第二，好心态有其特定的内涵。


    首先，好心态是指任何时候都要明白价格运动既有规律，又有一定随机性。任何时候，你的判断都有可能错，也有可能对。我们唯一能做的事情只有两条：通过努力，使我们抓住的机会成功的概率大于
    50% 或者更高一点，但我们永远别追求 100% 的正确率。否则，你必然'
