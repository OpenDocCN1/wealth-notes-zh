    # （二）利用均线系统如何精确研判趋势转势


    均线的趋势转势动作的口诀是一靠、二出头、三穿越、四回踩、五拉升。一个跌势末期，趋势要想转势，股价必须先靠均线，也就是碰到均线股价拐弯向下。然后再有反弹时候刚过均线出点头，就无力站到均线上，立刻下跌，不能有效突破均线就跌下来。然后是再次反弹有效穿'
