    如果是涨势，只要每波低点比前波低点高，则大胆在每次回调时候的 MACD 金叉做多，死叉平；如果是跌势，只要每波高点比前期高点底，则大胆在每次反弹时候的 MACD
    死叉做空，金叉平。


