    # 投资期货几条戒律：


    +   1. 戒急躁：不符合建平仓条件就乱动。 2. 戒恐惧：条件具备别犹豫，赚了点钱别一震荡就跑了。 3. 戒侥幸：错误了要跑得比兔子还快。 4. 戒用基本面信息、价格高低、预测作为建平仓依据。
    5. 戒用日以下的图表作为交易依据。 6. 戒不断改变交易方法和交易品种，交易 2/3 个品种最好，千万别交易成交和持仓小的品种。我人为大豆、铜和油是最好的品种。


    把 30% 仓分两份，尝试一份，确认正确后再加上一份，新阻力位突破确认后，适当再加一点点。


    钱少的朋友不用急，越急钱越少。我的建议是：你轻易别动，像鳄鱼一样，轻易不出手，但动了，就要咬回一大猎物。具体措施是：选择走势平稳的品种，受外盘影响小的；再就是不参与盘整，来回割受不了，要突破跟进，当日就有浮盈，这样跟对势了又有浮盈，你就能留住单了，不怕震了。


    # 顺势十回撤和转折十确认的含义：


    +   1. 期货市场上的建仓机会，本质上只有四种： 第一种是转折加确认； 第二种是顺势十回撤； 第三种是极端的远离平均价格（均线）； 第四种是收敛形态内边线双向交易。


    其中，第三、第四种机会适合短线操作，这种机会我能看懂，但胆子小，不敢做，只好留给别人做了。前面两种机会，是中长线机会，比'
  - '[PAGE 334]


    较容易把握。


    2. 说到顺势和转折，必须在一定的时间周期上定义，我的定义是：铜要用 75 日以上均线＋趋势线＋颈线，其他用 30 日以上均线＋趋势线＋颈线。


    3. 所谓顺势，是指定义的均线系统＋趋势线的方向明确，所谓回撤是指价格向上述两线靠近或者急速穿越后又回到顺侧。


    这里特别要提醒的是，当两线（均线、趋势线）防线明显而价格快速从远处回撤并穿越两线时，你千万别转向操作，恰恰相反，应该在价格企稳后顺两线防线建仓。我说的可能复杂了点，这就是人们常说的葛兰维均线法则。建议各位朋友再去研究一下。


    4. 所谓转折＋确认，是指 30、75 日或周以上均线＋趋势线＋颈线都突破了，而且价格有反抗（回抽或横盘）行为，那就可以肯定，趋势变了，该换方向交易了。


    5. 特别向大家建议两点：第一点，一般而言，当看不明白方向时，也就是说价格属于收敛形态中时，应该看看周线和月线，尽量顺原来方向的那一条形态边线建仓，如果形态顺势突破，就加仓，如果逆向突破，就反手。这样条理分明，比较好操作，尽量别双向操作，最后把自己搞的精疲力竭，真突破了，反而不敢做了。第二点，任何时候，不要轻易判断说方向变了。换句话说，宁可顺原来的方向，不可轻易转向交易。因为真正的转向实际上是很少的，交易机会中估计只占
    20%，其他都是顺势机会，我们何必要舍弃可能性大机会和去抓可能性小的机会呢？


    # 要想在市场上立足，必须对技术分析和运用有一个根本的认识：


    1. 技术分析的实质是分析价格形态、价格方向及其包含的风险和收益概率。


    2. 技术分析应该坚持四项基本原则。


    第一是客观：就是说，我们在选择技术工具和运用技术工具时候，尽量选择没有包含价值判断的工具，比如 K 线、均线、颈线、趋势线、价格箱等，反过来来，KDJ、ADX、MACD
    这些摆动指标就包含了许多主观判断，比如多少数量是超买、超卖之类，依据这些摆动指标交易，很容易落入陷阱。


    第二是本原：尽量用原始指标，比如 K 线平台、价格通道等，少用后人计算出来的指标，道理很简单，环节越少，出问题的概率越低，'
  - '[PAGE 335]


    # MACD 实战操盘用法研究


    越复杂的设备越容易出故障。


    第三是简明：一个交易体系，最好只用一个工具，或者利用相互补充的两三个工具，比如 K 线、均线、趋势线、颈线，四者层层推进，互相支持，各司其职，而且一眼就看明白了，其他指标都是因它们而来的。


    第四是一致：千万别用相互矛盾的指标，均线、趋势线、颈线与许多摆动指标在许多时候是互相矛盾的，趋势越强劲，颈线越是要突<|message|> 时，摆动指标越表现为超买、超卖，这一方面被主力充分利用来引诱散户逆向交易，另一方面是散户们内心永远充满矛盾，无法挣到大钱。


    3. 技术只是工具，技术本身不能说明你什么时候建平仓。你应该运用技术出现某一特征时候建平仓。对于这种特征，你必须大量对图形进行统计分析和逻辑分析，找到成功率最高的图形进行运用。不仅如此，最好每隔一年统计一次，以便与市场的最新发展保持一致。


    4. 技术运用离不开时间周期，如果是做中线，建议只看日、周级别的图表，因为时间周期越长，越不容易被操纵。


    5. 技术分析、技术系统只是交易系统的一部分，必须把资金管理、止损、扩利也做好，技术才能发挥作用。


    6. 基本面分析必须用技术分析来补充，但技术分析完全可以脱离基本分析而存在，特别是钱少的人，千万别以基本面分析为依据交易。


    别把眼睛只盯着钱，那样就看不清行情了。我建议各位把铜、胶、柏、油、小麦的图从 2000 年研究到现在，如果你立足中线，交叉操作，能挣到不少钱。不过，我再次建议，别考证过去赢利了多少倍，用眼睛看住图形，尤其是周线图，并用日线选好交易点，不要随便跑进跑出，挣钱并不是很
    identify 的。我从不做行情评论，这里破个例，建议大家研究一下胶的连续图，看看周线，已经破了大箱体，有点像铜，其库存和基本面也有点像铜，如果确认突破成功，就是大机会；当然，如果又跑回箱体内，另当别论；至于铜，新箱体在
    3000 至 5000 之间，千万别以过去的价格眼光看铜；还有豆粕，也是好品种，盯住它。这三个品种是给你大机会的品种，就看你的耐心了。还有三句话供大家参考：1.
    周线判断行情性质：顺势、反弹、转折、区间，日线选交易点；2. 只在三种情况下交易：转折突破＋确认；顺势＋反弹（回撤）；大形态边线；3. 心中只有图形没有钱。'
