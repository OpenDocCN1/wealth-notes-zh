    EMA 之后，将停止价位移往损益两平点。 2. 当 EMA 处于下跌状态，由空方进行交易。当价格反弹到均线附近或稍上方，这代表放空机会。当你建立空头部位之后，将停损点设定在最近的次要高点上侧；一旦收盘价向下穿越
