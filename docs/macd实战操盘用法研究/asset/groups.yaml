    # 二、均线技术兵法——均线修复


    均线在很大程度上代表市场成本，而市场成本的变化最直接的体现就是均线的运行。当牛市时，随着股价的不断上升，市场成本也随之上升，均线向上稳步运行；当市场进入熊市时，随着股价的不断下跌，市场成本也随之不断下移，此时的均线向下运行。在实际炒作中，我们会发现，股价与均线之间有着密不可分的关系，股价始终围绕均线波动，而均线的方向就是股价运行的趋势方向，这是为什么呢？解释这种现象的理论根据就是成本因素，当市场上升时，市场成本也随之上

    升，当股价在短期内上涨过快时，由于换手率不够充分，将在短期内导致市场的获利盘增加，从而产生多头了结，形成获利卖压，导致股价向成本（均线）回调。当股价在短期内下跌过快时，同样，由于市场成本并没有快速下降，导致市场的平均成本出现亏损，此时抛压减轻，并且出现空头回补，形成逢低买盘，导致股价出现反弹。股价和均线之间存在强大的吸引力，当股价远离均线时，由于成本因素将导致股价向均线回归，从而形成回调或反弹。这一现象就是“均线修复”（股价和均线之间修复乖离率），乖离率是一个非常重要的技术指标，在实战中十分'
