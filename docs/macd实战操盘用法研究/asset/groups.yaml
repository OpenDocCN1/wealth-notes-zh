    # 5.3 BOLL 指标的特殊分析方法


    # 5.3.1 布林带 “喇叭口” 的研判


    布林带 “喇叭口” 的研判是 BOLL 指标所独有的研判手段。所谓布林带 “喇叭口” 是指在股价运行的过程中，布林带的上轨线和下轨线分别从两个相反的方向与中轨线大幅扩张或靠拢而形成的类似于喇叭口的特殊形状。根据布林带上轨线和下轨线运行方向和所处的位置的不同，我们又可以将
    “喇叭口” 分为开口型喇叭口、收口型喇叭口和紧口'
  - '[PAGE 130]


    型喇叭口三种类型。开口型喇叭口形态常出现在股票短期内暴涨行情的初期，收口型喇叭口形态常出现在股票暴跌行情的初期，紧口型喇叭口形态则常出现在股价大幅下跌的末期。


    # （一）开口型喇叭口


    当股价经过长时间的底部整理后，布林带的 cuestion 上轨线和下轨线逐渐收缩，上下轨线之间的距离越来越小，随着成交量的逐渐放大，股价突然出现向上急速飙升的行情，此时布林带上轨线也同时急速向上扬升，而下轨线却加速向下运动，这样布林带上下轨之间的形状就形成了一个类似于大喇叭的特殊形态，我们把布林带的这种喇叭口称为开口型喇叭口。


    开口型喇叭口是一种显示股价短线大幅向上突破的形态。它是形成于股价经过长时间的低位横盘筑底后，面临着向上变盘时所出现的一种走势。布林带的上、下轨线出现方向截然相反而力度却很大的走势，预示着多头力量逐渐强大而空头力量逐步衰竭，股价将处于短期大幅拉升行情之中。


    开口型喇叭口形态的形成必须具备两个条件：其一，是股价要经过长时间的中低位横盘整理，整理时间越长、上下轨之间的距离越小则未来上涨的幅度越大；其二，是布林带开始开口时要有明显大的成交量出现。


    开口喇叭口形态的确立是以 K 线（或 K 线）向上突破上轨线、股价带量向上突破中长期均线为准。对于开口喇叭口形态的出现，投资者如能及时短线买进定会获利丰厚。


    ![](img/e00f2195878851621153c98be41c491d_130_0.png)


    图 5.1 开口型喇叭口'
  - '[PAGE 131]


    # （二）收口型喇叭口


    当股价经过短时间的大幅拉升后，布林带的上轨线和下轨线逐渐扩张，上下轨线之间的距离越来越大，随着成交量的逐步减少，股价在高位出现了急速下跌的行情，此时布林带的上轨线开始急速掉头向下，而下轨线还在加速上升，这样布林带上下轨之间的形状就变成一个类似于倒的大喇叭的特殊形态，我们把布林带的这种喇叭口称为收口型喇叭口。


    收口型喇叭口是一种显示股价短线大幅向下突破的形态。它是形成于股价经过短时期的大幅拉升后，面临着向下变盘时所出现的一种走势。布林带的上下轨线出现方向截然相反而力度很大的走势，预示着空头力量逐渐强大而多头力量开始衰竭，股价将处于短期大幅下跌的行情之中。


    收口型喇叭口形态的形成虽然对成交量没有要求，但它也必须具备一个条件：即股价经过前期大幅的短线拉升，拉升的幅度越大、上下轨之间的距离越大，则未来下跌幅度越大。


    收口型喇叭口形态的确立是以股价的上轨线开始掉头向下、股价向下跌破短期均线为准。对于收口型喇叭口形态的出现，投资者如能及时卖出则能保住收益，减少较大的下跌损失。


