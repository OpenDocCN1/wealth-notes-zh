    起后继的波浪，有相当明显的波峰和波谷。正是这些波峰和波谷的走向构成了市场趋势。这些波峰和波谷是上升、下降还是横走告诉了我们市场的趋势。上升趋势被定义为一系列相继上升的波峰和波谷；下降趋势正好相反，是一系列相继下降的波峰和波谷；水平的波峰和波谷确定了一种横走的价格趋势。


    # 十三、趋势有三种方向


    我们已经提到的上升、下降、横走趋势有充分的依据。大多数人往往认为市场总是要么上升，要么下降。但事实上，市场有三个运动方向——上升、下降，以及横走。弄清这种区别非常重要，因为保守估计，至少有三分之一的时间，价格在一种平坦的、水平的形态中运动，这种形态称为交易区间。这种横走行为反映出价格水平的一段均衡时间，此处供求双方的力量处于一种相对平衡的状态。（如果你回忆一下，就会记起道氏理论称此类形态为一条横线。）尽管我们已经定义平坦的市场有一种横走的趋势，但称此为无趋势更加常见。大多数技术工具和系统在本质上都是趋势跟随型的，这意味着它们主要为正在上升的或下降的市场而设计。当市场进入这种持平的或者说“无趋势”的阶段时，它们通常表现逊劣，甚至根本不起作用。正是这种横向市场运动时期，技术派交易者经历着他们最大的挫折，而采用交易系统的人也蒙受着最大的净值损失。趋势跟随系统，根据其定义，需要有趋势可循，以施展功用。所以，这里的失效不在于系统。相反，这种失效在于交易者，他们试图将为趋势运动的市场设计的系统运用到无趋势的市场环境之中。


    交易者面对三种选择——买进（做多）、卖出（做空），或者无所事事（观望）。如果市场正在上升，那么买进策略更可取。如果市场正在下降，那么第二种方法才是正确的。然而，如果市场正在横向运动，那么第三个选择——置身市场之外——通常最为明智。


    # 十四、趋势有三种类型


    除了有三种方向之外，趋势通常还可细分为三种类型。这三种类型是主要趋势、次要趋势和短期趋势。实际上，从只有几分钟和数小时的极短期趋势到持续50年或100年的超长期趋势，几乎存在无数个相互作用的趋势。然而，大多数技术分析人士将趋势的分类限于这三种。但是，对于不同的分析人士如何定义每一个趋势就有些含糊了。'
