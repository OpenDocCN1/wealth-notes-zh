    # MACD 实战操盘用法研究


    眼前时我们能预知下一步它大概怎么走就行了。而前面所讨论的所有型态就变得非常有用。艾略特波浪的每一种波浪都具体地反映了市场大众的心态，而这种心态是在受到外界各种因素、现象刺激再加上个人不同的理解而出现的不同判断。市场心理从悲观到乐观，然后又乐极生悲，每一次都沿着类似的道路前进但又不尽相同。无论是超大循环浪或是细浪，其波段都相当清晰。


    第 1 浪：在技术上较具建议性。成交量及市场宽度出现明显的增加。但是，市场中绝大多数人只是认为不容易出现的一次中级行情而已。然而事实上，这一回价格指数出现了
    5 个次一级的推动浪。不过，大部分第 1 浪只是整个市场底部的一部分，随后的第 2 浪将会令市场认为熊市又再重现。大级别的第 1 浪总是在价格指数经历痛苦的调整之后出现的，市场资金充裕，但经济仍处于不景气，不过未来前景乐观。


    ![](img/e00f2195878851621153c98be41c491d_221_0.png)


