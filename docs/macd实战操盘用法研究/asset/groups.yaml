    离差值 DIFF 和离差平均值 DEA 是研判 MACD 的主要工具。其计算方法比较烦琐，由于目前这些计算值都会在股市分析软件上由计算机自动完成，因此，投资者只要了解其运算过程即可，更重要的是掌握它的研判功能。另外，和其他指标的计算一样，由于选用的计算周期的不同，MACD
    指标也包括日 MACD 指标、周 MACD 指标、月 MACD 指标、年 MACD 指标以及分钟 MACD 指标等各种类型。经常被用于股市研判的是日 MACD
    指标和周 MACD 指标。虽然它们的计算时的取值有所不同，但基本的计算方法一样。


    在实践中，将各点的 DIFF 和 DEA（MACD）连接起来就会形成在零轴上下移动的两条快速（短期）和慢速（长期）线，此即为 MACD 图。


