    上图 2. 25 是豆油 1005 小时图，出现 A 买点之前已经有 MACD 的 a 买点提示，而之后的 DB 经典买点，有 db 来精确选点。C 卖点有
    c 远离 0 线的死叉选点。E 开空点之前有 e 的死叉提示且出现 MACD 顶背离提示。HG 的经典开空点，有 hg 精确选点。F 抢反弹点，有 f 的金叉精确选点且出现
