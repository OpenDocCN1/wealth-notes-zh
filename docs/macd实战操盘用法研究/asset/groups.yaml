    ### 1.4.4 MACD 买“小”卖“小”法


    这是运用 MACD 捕捉最佳买卖点的一种简易方法。其实这不过是利用 MACD 红绿柱子远离 0 线和靠近 0 线，利用 0 线对 MACD 红绿柱的支撑和压力作用做交易的方法而已。


    这里的“大”和“小”是指 MACD 中的大绿柱、小绿柱和大红柱、小红柱。我们只注重红绿柱的变化。


    《曹刿论战》中有句话，叫做“一鼓作气，再而衰，三而竭”。


    在股市中，任何一次头部和底部的形成，市场都会提供两次或两次以上的机会给我们（入市或出场）。“大红”之后是“小红”，“大绿”之后是“小绿”。


    当一波气势汹汹的下跌，或一波气势如虹的上涨开始时，我们首先应避其锐气，保持观望。也就是说，当经历一波下跌后，当股票处于最低价时，此时 MACD 上呈现的是一波“大绿柱”。


    我们首先不应考虑进场，而应等其第一波反弹过后（出现红柱），第二次再探底时，在 MACD 中出现了“小绿柱”（绿柱明显比前面的大绿柱要小），且当小绿柱走平或收缩时，意味着下跌力度衰竭，此时为最佳买点，这就是所谓的买小（即买在小绿柱上）。


    ![](img/e00f2195878851621153c98be41c491d_35_0.png)


    显现上涨也同样。


    当第一波拉升起来时（MACD 上显现为大红柱）我们都不应考虑出货，而应等其第一波回调过后，第二次再冲高时，当 MACD 上显现出 “小红柱”（红柱比前面的大红柱明显要小），此时意味着上涨动力不足，这时我们方考虑离场出货。这就是所谓的卖小。


    也就是说，当市场 “一鼓作气” 时，无论是上涨还是下跌，我们都应保持观望；当市场 “再而衰” 时，我们方考虑进场或减仓；当 “三而竭” 时，我们应重仓追涨，或者杀跌出货。


