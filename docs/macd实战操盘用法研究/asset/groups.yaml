    ## 8.1.2 维克多趋势线画法以及对维克多趋势线的革新


    由于趋势线非常重要，而传统趋势线有很大的缺点，那就是想找三个点使他们连成一线是比较困难的，很多时候，趋势很明显，却无法找到连续的三个高点或低点成为一线，价格走势哪有那么教科书式的正规？《专业投机原理》的作者维克多自创了一种趋势线，非常有创意，这里介绍一下，我们觉得他这种趋势线更有统一性。


    ### 一、维克多趋势线画法


    上升趋势线画法：最近这波涨势的最低点出发，连接该最低点和最近的最高点之间的某个低点，使该最低点和最近的最高点之间的所有 K 线（含影线）都在这条连接线上边，这条线就是上升趋势线。


    ![](img/e00f2195878851621153c98be41c491d_186_1.png)


    图 8.5


    ## MACD 实战操盘用法研究


    下降趋势线画法：最近这波跌势的最高点出发，连接该最高点和最近的低点之间的某个高点，使该最高点和最近的最低点之间的所有 K 线（含影线）都在这条线的下边，这条线就是下降趋势线。


    上图 8.5 是豆油日线图，A 点是这波大跌时的起点，即 14896 的最高点；C 是这波大跌势的最低点，即 5560 的最低点。只有连接 B 这个之间的高点，才能让
    AC 之间的所有 K 线都在 AB 这条线下边，B 点选取别的位置都不行，因此 AB 线就是下降趋势线。


    C 点同时是最近涨势的最低点，E 点是最近涨势的最高点，只有 CE 之间的低点 D，才能使 CE 之间的所有 K 线都在 CD 上边，因此 CD 是上升趋势线。


    维克多的趋势线，任给一个图形，能且仅能画出一条趋势线。而传统趋势线，任给一个图形，能画出不同的几条趋势线，甚至有的画不出趋势线。因此维克多的趋势线远比传统趋势线是好得多。


    ### 二、维克多趋势线的缺点


    如果刚发动跌势不久的 B 点上影线很高，则趋势线 AB 很平缓，趋势线并不能有效代表趋势的变动。刚发动涨势不久，如果 D 点比较低或下影线很长，趋势线 CD
    太平缓，也不能有效代表趋势的变动。


    ### 三、维克多趋势线的革新


    我们觉得趋势线必须和绝大多数 K 线的大致走向一致，才能有效反映上涨或下跌的精确方向及上涨下跌的力度。因此我们建议上升趋势线的画法不用从一波涨势的最低点或次低点画，而是从涨势开始的某个低点开始，找到涨势开始的某个低点和最近最高点之间的某个低点，使得这波涨势的最低点和最近最高点之间所有
    K 线都在这条连线的上方，并且使得这条线大致能和这波涨势的方向吻合，这条线就是上升趋势线。


    下降趋势线的画法不用从一波跌势的最高点或次高点画，而是从跌势开始的某个高点开始，找到跌势开始的某个高点和最近最低点之间的某个高点，使得这波跌势的最高点和最近最低点之间所有
    K 线都在这条连线的下方，并且使得这条线大致能和这波跌势的方向吻合，这条线就是下降趋势线。


