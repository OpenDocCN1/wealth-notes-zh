    第 2 浪：它经常把第 1 浪的升幅吃去大半，以至于在第 2 浪的终点出现时，市场无利可言。因此，第 2 浪出现锯齿型或双重锯齿的概率比第 4 浪要大。


    第 3 浪：奇迹！强大且宽广。各种资金纷纷介入，令供求关系失衡，基本面彻底改善，投资者的信心明显恢复了。通常，会出现最大的成交量及价格变动。中等级别的第 3
    浪通常是所有推动浪中最长的，经常出现延伸。如果是股票市场，二线股（特别是股本比较小的那一类）会脱颖而出，而三、四线股也试图跑出几只黑马。


    第 4 浪：第 4 浪通常比较规范。其深度及运行时间也比较容易预测。在一般情况下，第 2 浪简单与第 4 浪复杂总令市场人士始料不及。高价股的碎步与低价股的上蹿下跳也确实精彩。由于第
    5 浪高价股很少有精彩的表演，故小幅上落较为正常，而低价股大幅回吐也只是为强劲'
