    # 11.3 “三重滤网” 交易系统中的 KDJ


    # 一、KDJ 交易法则


    随机指标提供三类交易讯号，依重要性的排列顺序为：背离、随机指标的读数与线形方向。


    5 天慢速随机指标：当随机指标进入上方的超买区，价格往往即将形成头部。当随机指标进入下方的超卖区，价格往往即将形成底部。这类的讯号适用于横向走势中，但在明确的趋势中，讯号通常会过早发生，当指标与价格之间产生背离，这是最理想的交易讯号。


    当根据随机指标做多或做空之后，将停损设定在最近次要低点之下或高点之上，图形的最右端出现一个买进讯号——回补空头部位，转空为多。


    # 二、背离


    当随机指标与价格之间产生背离的现象，这代表最强烈的交易讯号。


    +   1. 当价格下跌而创新低，但随机指标的底部高于前一波跌势的低点，这构成多头的背离。这种现象显示空头正丧失力量，价格仅仰赖惯性下跌。一旦随机指标由第二个底部翻升，即是强烈的买进讯号：建立多头部位，将停损设定在最近低点的下侧。如果第一个底部在超卖基准线下侧而第二个底部位于基准线上方，这代表最理想的买进讯号。


    +   2. 当价格上涨而创新高，但随机指标的头部低于前一波涨势的峰位，这构成空头的背离。这种现象显示多头正丧失力量，价格仅仰赖惯性上涨，一旦随机指标由第二个底部下滑，即是强烈的卖出讯号：建立空头部位，将停损设定在最近高点的上侧。如果第一个头部在超买基准线上侧而第二个头部位于基准线下方，这代表最理想的卖出讯号。


    # 三、超买与超卖


    当随机指标上升而超过上方的基准线，这代表行情进入超买状态，超买意味着过高，可能拉回。当随机指标下降而超过下方的基准线，这代表行情进入超卖状态，超卖意味着过低，可能回升。


