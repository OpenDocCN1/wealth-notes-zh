    上图 2.24 是镑美周线走势图，在圈 2，2008 年 5 月份首先出现以前大牛市以来的第一个 MACD 0 下死叉，MACD 已确定周线转为跌势。接着
    2008 年 6 月份圈 1 处出现周线的真死三角季价托，MA 确定周线转为跌势。由此我们确认周线转为跌势。空单入场点是 2008 年 8 月圈 3 处周线真死三角季价托后的第一个
