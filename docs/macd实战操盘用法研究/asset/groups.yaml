    # MACD 实战操盘用法研究


    艾略特赋予了三种不同的标记——常态、扩张以及强势平台（如图 9.10）。


    ![](img/e00f2195878851621153c98be41c491d_215_0.png)


    图 9.10


    扩张平台是指在平台型态中，B 浪的终点超出 A 浪的始点水平，而 C 浪也明显击破 A 浪的终点而进一步探底。而强势平台则是指 B 浪超越 A 浪的始点，而
    C 浪则未击破 A 浪的终点，显示出市势非常强劲。不过，在过往的日子里较大级别修正浪中，很少发现这种型态。因此，读者在实际分析中，最好不要抱侥幸的心态。否则，所遭受的损失可能会比较可怕。相比较而言，强势三角形则比较常见。


    3. 三角型态：三角型态是唯一以五浪运行的修正浪，其次一级的细浪皆可划分为三浪，即 3−3−3−3−3 的型态。在三角型态中，大部分的次一级细浪都是锯齿型态（如图
    9.11）。


    ![](img/e00f2195878851621153c98be41c491d_215_1.png)


    图 9.11'
  - '[PAGE 216]


    但是，有时候某一个次级浪（C浪的可能性较大）会出现比其他次级浪更加复杂的型态。此外，有些时候三角型态将会延伸为九浪，是因为其中一个次级浪本身以三角型态出现，E浪的可能性最大。艾略特认为，三角型态只会出现在第4浪、B浪或X浪中。第2浪形成三角型态的机会甚少。股票市场中，当三角型态结束之后运行的推动浪经常会出现“飙升”的情形。其上升目标大概就是三角型态最宽部分的距离。我想，读者在平常的分析中也会有类似的经验，因为这和一般价格型态分析的目标是相同的。以前，波尔顿（著名波浪理论追随者）列出一种变异型态，叫做“水平三角型态”，用来表示三角型态两条边界线互相平行的情况。不过，艾略特本人却未提过。事实上，前述三角型态艾略特就称之为“水平三角形”，以便和我们此前所讨论的“倾斜三角形”有所区别。


    4. 双重三或三重三型态：前面三种形态，都是简单型态的修正浪。而下面我们所讨论的双（三）重三则是复杂型态的修正浪（如图 9.12）。


    ![](img/e00f2195878851621153c98be41c491d_216_0.png)


    艾略特认为，当一个简单型态的修正浪运行结束之后，如果市场不允许出现新一组推动浪，那么它还要继续在过渡浪（标记为 X 浪）之后再运行一个修正浪。有时候，这种情况还要重复两次。而很多时候，是基本面的因素导致了这种局面的产生。前面我们曾提到过双重平台、三重平台，艾略特之所以将它们归入双重三或三重三型态，是因为他认为水平型态的修正浪和双重锯齿型态的非水平修正浪有所区别。我想，如果单纯以型态划分，这样的意见不够严谨。但是，如果对于在实际分析工作中，着重于修正浪的运行幅度来说，这样的划分显然更加合乎情理，也更容易让初学者接受。根据我的经验，由于人类社会的迅速发展，事物都比以往任何时候要更加复杂。因此，复杂型态的修正浪出现的频率也会随着人类社会的不断发展而增加。我建议读者在一个三浪下'
