    ## 第十章 MACD 与道氏理论的经典配合使用


    查尔斯·道（Charles Dow）与他的合伙人爱德华·琼斯（Edward Jones）在1882年创办了道琼斯公司（Dow Jones&Company）。大多数技术分析人士以及市场研究者一致认为，今天我们称之为技术分析的许多东西源自道在20世纪初首先提出的各种理论。道在为《华尔街日报》撰写的一系列社论中发表了他的理念。今天，大多数技术分析人士都知道并吸收了道的基本理念，无论他们是否知道这个来源。即使面对当今成熟的电脑技术，以及更新的而且据说是更好的技术指标不断繁衍，道氏理论仍然形成了技术分析研究的基石。


    1884年7月3日，道发表了第一种由11种股票的收盘价组成的股票市场平均指数：九家铁路公司和两家制造公司。道氏认为这十一种股票为美国的经济健康状况提供了一种有效的标志。1897年，道确定两种不同的指数更能代表这种健康状况，所以创立了由12种股票组成的工业股指数，以及由20种股票组成的铁路股指数。到了1928年，工业股指数已经增加到包含30种股票，也就是它今天代表的股票数量。《华尔街日报》的编辑在随后的年份中对成分股的名单作了多次更新，并在1929年添加了公用事业股指数。1984年，即道指发表一百周年之际，市场技术分析师协会向道·琼斯公司赠送了一个哥翰银碗。据市场技术分析师协会所说，该奖是为了感激“查尔斯·道对投资分析领域作出的永恒贡献。在他逝世80多年后，他的指数——如今被视为股市活动主要晴雨表的先驱——仍然是市场技术分析人士必备的工具”。


    对我们来说不幸的是，道不曾为其理论著书立说。相反，他把他对股票市场行为的理念写在了20世纪初出版的《华尔街日报》的一系列社论中。1903年，即道氏逝世一年之后，S.
    A. 纳尔逊（S. A. Nelson）将这些文章收录到一本名为《股市投机常识》的书中。在这本著作中，纳尔逊创造了“道氏理论”这个词。理查德·罗索在为该书1978年重印时撰写的序言中把道氏对股票市场理论的贡献比作弗洛伊德对精神病学的贡献。1922年，威廉·彼得·汉密尔顿（道氏在华尔街日报的助手和接班人）曾对道的基本原则进行了分类，并将其发表在一本名叫《股票市场晴雨表》的书中。罗伯特·雷亚在1932年出版的《道氏理论》（纽约：巴伦氏）一书中进一步发展了这一理论。


    道氏将他的理论工作应用于他发明的股市平均指数，即工业股指数和铁路股指数。但是，他的大多数分析理念在所有的市场平均指数上应用得同样出色。本章将介绍道氏理论的六个基本原则，并将讨论这些理念如何适应现代的技术分析研究。我们将在后面的章节中讨论这些理念的分支。


    ### 10.1 道氏理论的基本原则


    #### 一、平均指数包含一切


    股票交易所的交易总量及交易倾向体现了所有华尔街对过去、现在和将来知识的总和，这些知识应用到了对未来的贴现中。不需要像某些统计学家做的那样，在平均指数中加入对商品价格指数、银行清算、交易的波动、国内贸易和国外贸易量或者其他东西的精心汇集。市场反映了每一个可以知道的影响供求关系的因素是技术分析理论的基本前提之一。就像这个理论适用于单个股票市场一样，它也适用于市场平均指数，甚至为“不可抗力”留下了余地。尽管各个市场不可能预见地震或其他各种不同的自然灾害，但是它们很快就能包含这种事件，并几乎立即将它们的影响消化在价格行为中。


    #### 二、市场有三种趋势


    在讨论趋势如何运转之前，我们必须弄清道考虑的趋势是什么。道曾把上升趋势定义为每一轮后继的上升行情均收在以前上升行情的最高点之上，以及每一轮后继的回稳的最低点均收在以前上升行情的最低点之上。换言之，上升趋势有一种上升的波峰和波谷的形态。相对的情形就是下降趋势，因为波峰和波谷依次下移。道的定义已经经受住了时间的考验，而且仍然是趋势分析的基石。


    道相信，作用力与反作用力也能应用在市场中，就像它们能够应用于物理中一样。他曾写道：“交易记录表明，在许多情况下，当一只股票到达顶部时，它会有一次适度的下跌，然后再次上升接近最高点。如果在这种运动之后，股价再度后退，它就有可能下跌一些距离。”


    道认为一个趋势有三种组成部分：主要趋势、次要趋势和小趋势，他把这些比做大海中的潮流、波浪和波纹。主要趋势代表潮流，次要趋势或称中期趋势是组成潮流的海浪，而短期趋势就像海浪上泛着的波纹。


    一个观察者能够通过注意后续的波浪是否到达海滩上的最高点来确定潮流的走向。如果每一个后续的波浪比前一个波浪向陆地推进得更深，那么潮流正在上涨。当每一个后续的波浪的最高点不断跌落，那么潮流已经转向，正在退却。不像实际的海潮只持续几个小时，道想象市场的潮流持续一年以上，甚至好几年。


    次要趋势或称中期趋势代表主要趋势中的调整，而且通常持续三个星期到三个月。这些中级调整通常回撤至前面趋势运动的三分之一至三分之二之处，最常见的大约是前面运动的一半或称50%处。


    按道的说法，小或称短期趋势通常持续不到三个星期。这种短期趋势代表了中期趋势中的波动。


    #### 三、主要趋势可分为三个阶段


    道将他的注意力放在主要趋势或称大趋势上，他认为这些趋势通常以三个独特的阶段发生：收集阶段、公众参与阶段以及派发阶段。收集阶段代表最机敏的投资者有见识地买入。如果前一个趋势下跌，那么此时这些机敏的投资者认识到市场已经消化吸收了所有的所谓“利空”消息。公众参与阶段出现在价格开始快速上扬而且公司的各种消息渐好的时候，此时大多数技术型趋势跟随着开始参与。当报纸开始越来越多地刊登看涨的故事时；当经济消息好得不能再好的时候；当投机性成交量和公众的参与增加时，派发阶段就出现了。在这个最后阶段，同样在熊市底部附近开始“收集”的有见识的投资者在其他人开始抛售之前开始“派发”。


    艾略特波浪理论学者将会把一个大牛市看成三个不同的阶段。R·N·艾略特曾把雷亚在《道氏理论》一书中的工作更加细化，辨认出一轮大牛市有三次向上的大运动。在第九章中提到的“艾略特波浪理论”，我们可以看到道的牛市三阶段与五浪艾略特序列极为近似。


    #### 四、各种平均指数必须相互印证


    说到工业股平均指数与铁路股平均指数，道认为除非两个平均指数都给出相同的信号并因此相互印证，否则重要的牛市信号或熊市信号就不会出现。他认为两种平均指数都必须涨过前一个次高点，以确认一轮牛市的开始或持续。他相信这些信号不必同时出现，但认为两个信号之间的时间越短，印证越有力。如果两个平均指数相互背离，道就认为在前的趋势依然得到了维持。


    ![](img/e00f2195878851621153c98be41c491d_233_0.png)


    长期运输中的道氏理论。对于要继续发展的大牛市来说，道琼斯工业股指数与道琼斯运输股指数必须同步上扬。


    # 图 10.1


    ![](img/e00f2195878851621153c98be41c491d_233_1.png)


    两个道氏理论印证的例子。在1997年初，点1，道琼斯运输股指数印证了道琼斯工业股指数早先的突破。在接下来的5月，点2，道琼斯工业股指数印证了道琼斯运输股指数早先创出的新高。


