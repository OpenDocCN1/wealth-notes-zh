    B 的回调伴随着较小的成交量，这并不意外。然而，在点 C，警觉的走势图分析人士或许会注意到，伴随市场向上突破点 A 的成交量较前一轮上涨行情的成交量有所萎缩。这个变化本身并不重要，但在分析人士的脑海中一盏黄色警告灯已经亮起。


