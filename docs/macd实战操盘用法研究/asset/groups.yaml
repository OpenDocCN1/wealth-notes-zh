    在实际走势中，RSI 指标出现顶背离是指股价在进入拉升过程中，先创出一个高点，RSI 指标也相应在 80 以上创出新的高点，之后，股价出现一定幅度的回落调整，RSI
    也随着股价回落走势出现调整。但是，如果股价再度向上并超越前期高点创出新的高点时，而 RSI 随着股价上扬也反身向上但没有冲过前期高点就开始回落，这就形成 RSI
    指标的顶背离。RSI 出现顶背离后，股价见顶回落的可能性较大，是比较强烈的卖出信号。


    ## （二）底背离


    RSI 的底背离一般是出现在 20 以下的低位区。当 K 线图上的股价一路下跌，形成一波比一波低的走势，而 RSI 线在低位却率先止跌企稳，并形成一底比一底高的走势，这就是底背离。底背离现象一般预示着股价短期内可能将反弹，是短期买入的信号。


