    # 一、对称三角形


    对称三角形（或称绕线筒）通常是一种持续形态。它代表现存趋势的停顿，此后原有的趋势会继续发展。在图7.6的例子中，先前的趋势向上，因此三角形巩固形态之后市场向上的可能性大。如果趋势已经向下，那么对称三角形就有看跌的含意。


    三角形至少需要有四个转折点。要记住两个点才能成一线。因此，为了绘制两条会聚的趋势线，市场必须触及每根线两次。在图7.6中，三角形实际上从点1开始，这是上升趋势中巩固形态开始的地方。市场随后回撤至点2，然后反弹到点3。然而，点3低于点1。一旦市场已经从点3回落，我们就能绘制出上边趋势线。


    注意，点4高于点2。只有在市场从点4向上反弹时，我们才能绘制上倾的下边线。正是这个时候，分析人士开始察觉他或她正在研究对称三角形。现在有了四个转折点（1、2、3和4），以及两条会聚趋势线。


    看涨对称三角形的例子。注意两根会聚的趋势线，市场收于任何一根趋势线之外都完成了形态，左侧的竖线是底边，右侧两线的交汇点是顶点。


    上升三角形的例子。注意平坦的上边线和上升的下边线，这通常是一种看涨形态。


