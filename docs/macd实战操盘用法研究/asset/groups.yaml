    MACD 柱状图＝MACD 线－讯号线


    MACD 柱状图是衡量 MACD 线与讯号线之间的差值，然后将这些差值绘制为柱状图，这些数值看起来很小，但可以透过电脑将它们放大。


    如果快速线位于慢速线之上，MACD 柱状图为正值，绘制在零线之上。如果快速线位于慢速线之下，MACD 柱状图为负值，绘制在零线之下。当快速线与慢速线交叉，MACD
    柱状图为零。


    当 MACD 线与讯号线拉开，MACD 柱状图变得比较长（正值）或比较深（负值）。当 MACD 线与讯号线靠拢，MACD 柱状图变得比较短（正值）或比较浅（负值）。


    MACD 柱状图的斜率是取决于相邻两支柱状的关系（在下方中，当提及柱状图的高度，考虑正、负符号在内，举例来说，愈接近零的负数，高度愈大；换言之，－1>－2，愈接近零的正数，高度愈小：换言之，＋2>＋1）。如果最近的柱状图较高，柱状图切线的斜率向上。如果最近的柱状比较矮，柱状图切线的斜率向下。


    # 四、市场心理


    MACD 柱状图是代表长期与短期价值共识之间的差值。快速的 MACD 线反映比较短期间的群众共识。慢速的讯号线反映比较长期间的群众共识。MACD 柱状图是追踪这两条线之间的差值。


    MACD 柱状图切线的斜率，可以反映市场主导力量转强或转弱。柱状图位于零线以上，多头是市场的主导力量；斜率向上代表多头的主导力量转强，斜率向下代表多头的主导力量转弱，柱状图位于零线以下，空头是市场的主导力量；斜率向下代表空头的主导力量转强，斜率向上代表空头的主导力量转弱。


    当 MACD 线的上升速度快于讯号线，MACD 柱状图的高度会增加，这代表多头的力量逐渐增强，最好由多方进行交易。当 MACD 线的下降速度快于讯号线，MACD
    柱状图的高度会减少，这代表空头的力量逐渐增强，最好由空方进行交易。


    当 MACD 柱状图的斜率与价格趋势保持相同的方向，趋势很安全。当 MACD 柱状图的斜率方向不同于价格趋势，趋势很有疑问，最好顺着 MACD 柱状图的斜率方向进行交易，因为它可以反映多、空力量的消长。


    MACD 柱状图斜率的重要性，高于柱状图位于零线之上或之下。'
