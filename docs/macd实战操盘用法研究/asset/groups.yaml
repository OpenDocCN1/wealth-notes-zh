    ## 第十三章 方大集团走势分析


    ——基于缠论和 MACD 的视角


    ## 13.1 方大集团基本面介绍


    2014 年 7 月 24 日查看股票行情时看到了方大集团，心中震惊，上涨的内在动力真是大。又遍看了所有 A 股，发现日线涨势最有力的就是方大集团，其次是国投电力、广东明珠、生益科技。查了基本面，方大集团和生益科技最好。选的涨势好的股中，网络这一块同花顺比较好，这个行业看好。由此定下方大集团、生益科技、同花顺是未来主要炒作的股票。


    第二天早上还是先买了长江电力、国投电力，后来又买了点方大集团。真是晕，最好的股，不去买，还是买相对较差的股，原因还是以前的恐高心理。本该买的三只股当天都涨了，两个电力买上都跌了。下周就等赚钱了，出来电力，买入方大集团（000055）和生益科技（600183），再少买一点同花顺（300033）。其实好股看企业介绍就看出来了，下面是这三家公司的基本介绍。


    方大集团（000055）公司是我国目前规模最大的新材料高新技术企业，连续多年创下了同行业的许多第一，荣获“中国工业行业状元”等称号。公司现已形成新型建材产业、机电一体化工程产业、半导体照明及光电子产业等三大产业体系。新型建材产业包括各类建筑幕墙、铝塑复合板、单层铝板、节能环保门窗、铝型材、新型采暖散热器、特种结构等；机电一体化工程产业包括地铁屏蔽门、自动门、特种门等；半导体照明及光电子产业包括氮化镓（GaN）基蓝、绿、白光
    LED 外延片和蓝、绿、白光 LED 芯片以及集成电路、半导体照明等。公司拥有国家级企业技术中心、国家级光电材料与器件工程研究中心、同行业第一家企业博士后工作站，并在美国等地设立了研发基地和分支机构。


    生益科技（600886）公司是国内最大的覆铜板专业生产商，公司主要产品有阻燃型环氧玻纤布覆铜板、复合基材环氧覆铜板及多层板用系列半固化片。产品主要供制作单、双面及多层线路板，广泛用于手机、汽车、通讯设备、计算机以及各种高档电子产品中。公司技术力量雄厚，先后开发出多种具有国际先进水平的高科技产品，是东莞市唯一一家拥有国家级企业研究开发中心的企业，产品质量始终保持国际领先水平。主导产品已获得西门子、摩托罗拉、索尼、诺基亚、三星、华为等企业的认证，形成了较大的竞争优势，产品远销美国、欧盟、马来西亚、新加坡等世界多个国家和地区。在世界制造中心转移到中国且竞争日趋激烈的情况下，销量始终保持国内第一。


    上面两家公司科技含量都不错，但是 886 更好！明显更好，因为 886 技术是国际领先，且质量国际领先，产量国内第一。55 也不错，企业博士后流动站、国家级企业技术中心，说明技术还可以，但不是最优秀的，但是有工业行业状元称号，说明技术也不错，且处在新材料行业，也还不错。但是
    886 领域是电子计算机手机领域，更有前途。


    同花顺公司是国内产品类别最全面的互联网金融信息提供商，最大的网上证券交易供应商，互联网安全密码通讯产品供应商，互联网电子商务软件供应商。产品涵盖证券、期货、外汇、港股、黄金等金融产品的网上交易、互联网密码安全、互联网通讯、信息服务等技术领域，形成了自主知识产权的核心技术体系，提供证券公司网上交易和互联网安全电子商务及移动证券的全面解决方案，为证券投资者提供从网站、软件、交易、理财、社区、手机炒股一站式金融理财服务。是唯一一家与中国移动、中国联通、中国电信三大移动运营商合作提供手机金融信息，上证信息公司许可的
    Level-2 数据经营商之一。同花顺手机金融信息服务系统是目前支持手机类型最多、应用最广泛的手机证券产品。代表产品有：网上行情交易系统、决策家、同花顺深度分析系统（Level-2）、同花顺大机构、小财神、手机金融信息等。


    同花顺公司的简介中没有提到科技，说明没有科技竞争力。只是互联网金融信息服务产品类别最全＋与三大公司合作＋支持手机类型最多等几个亮点，但是都不是核心竞争力。说明这个企业不是行业龙头。

    从上述三家公司的简介粗略看，886 最好，55 次之，33 一般。

