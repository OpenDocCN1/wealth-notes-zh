    ## 10.4 小结：本章主要的理论贡献


    - 一、维克多 123 转势方法与 2B 法则

    （一）维克多 123 转势方法

    - 1. 趋势线被突破。

    - 2. 上升趋势不再创新高，或下降趋势不再创新低。

    - 3. 在上升趋势中，价格向下穿越先前的短期回档低点，或在下降趋势中，价格上穿先前的短期反弹高点。


    （二）2B 法则


    在上升趋势中，如果价格已经穿越先前的最高价而未能持续挺升，稍后又跌破先前的最高点，则趋势很可能会发生反转。下降趋势也是如此，只是方向相反。这两个法则不论是中长线的趋势中还是短线当日交易中都可以加以运用。


    二、如果 是涨势，只要每波低点比前波低点高，则大胆在每次回调时候的 MACD 金叉做多，死叉平；如果是跌势，只要每波高点比前期高点底，则大胆在每次反弹时候的
    MACD 死叉做空，金叉平。


    激进交易者在次高时的 MACD 死叉下空单，次低时的 MACD 金叉出场；在次低时的 MACD 金叉做多，次高时的 MACD 死叉走人，长线做单，获利很大。


    # 第十一章 MACD “三重滤网” 交易系统实战应用详解


    MACD多周期传递的运作机理都在“三重过滤系统”里，本章主要讲解主要运用MACD多周期传递原理做单的“三重滤网”交易系统。该系统综合运用MA、MACD、KDJ三个指标，根据长期、中期、短期三个时期的周期共振原理做单。


    ## 11.1 “三重滤网” 交易系统中的 MA


    ### 一、移动平均的长度


    移动平均的长度愈短，对于价格的反应愈敏感——这可以让你尽快掌握趋势的变动。另外，长度愈短，移动平均愈经常改变方向，产生较多的反复讯号。“反复讯号”是指快速反转的交易讯号（举例来说，当移动平均发出买进讯号之后不久又发生卖出讯号而使先前的买进讯号发生亏损）。移动平均的长度愈长，可以减少反复的讯号，但讯号的落后程度会加大（不能及时掌握趋势的转折）。


    当电脑问世之初，许多人透过历史资料进行测试，希望找出每个市场的最佳移动平均长度。可是，过去最有效的长度，未必适用于目前，因为市场不断变化，经纪人不允许我们在过去的行情中进行交易。


    如果可以找到行情循环的周期，则应该根据周期的长度来调整移动平均的长度，移动平均的长度，应该是主导循环长度的一半（所谓“主导”是指你所希望交易的那一个循环）。如果循环的周期长度为22天，应该采用11天期的移动平均。如果循环的周期长度为34天，应该采用


    17 天期的移动平均。某些交易者透过电脑软件（例如：MESA）而试图寻找有效的循环周期，但 MESA 所发出来的杂音经常大于循环的周期长度。


    交易者也可以采用一种简单的法：你所希望掌握的趋势愈长，所需要的移动平均长度也愈长，钓大鱼需要长钓竿。对于股票投资者来说，如果希望掌握主要的长期趋势，可以考虑
    200 天的均线。大多数交易者都是采用 10 天到 20 天之间的 EMA，移动平均的长度不应该短于 8 天，否则会破坏它身为顺势指标的功能。就我个人而言，过去几年来大多采用
    13 天的 EMA。


    ### 二、交易法则


    成功的交易者不预测行情——他观察行情的变化，然后处理交易的部位。移动平均可以让我们顺着趋势进行交易。移动平均的最重要讯息，是其切线的斜率方向，它代表市场惯性的方向。当
    EMA 朝上时，最好做多；当 EMA 朝下时，最好做空。


    13 天指数移动平均：当 EMA 上升时，代表趋势向上。应该由多方进行交易。最佳的买进时机是当价格折返 EMA，它们提供比较理想的风险/报酬比率。当 EMA
    下降时，代表趋势向下，应该由空方进行交易。最佳的放空时机是当价格折返 EMA。在 12 月份，EMA 呈现水平状，代表市场没有明显趋势，不可以再采用这种顺势指标，但必须继续跟踪·留意趋势转为明显的时机。


    - 1. 当 EMA 处于上升状态，由多方进行交易。当价格跌到均线附近或稍下方，这代表买进机会。当你建立多头部位之后，将停损点设定在最近的次要低点下侧；一旦收盘价向上穿越
    EMA 之后，将停止价位移往损益两平点。

    - 2. 当 EMA 处于下跌状态，由空方进行交易。当价格反弹到均线附近或稍上方，这代表放空机会。当你建立空头部位之后，将停损点设定在最近的次要高点上侧；一旦收盘价向下穿越
    EMA 之后，将停止价位下移到损益两平点。

    - 3. 当 EMA 基本上呈现水平状，这代表行情没有明显的趋势，不可以采用顺势指标进行交易。


    ### 三、机械性系统


    传统的机械性交易方法，通常通过四个步骤运用移动平均：（1）移动平均上升而价格收在其上侧，则买进；（2）当收盘价跌破移动平均，则卖出；（3）当移动平均下降而价格收在其下侧，则放空；（4）当收盘价向上穿越移动平均，则回补。这种方法适用于趋势明确的行情，在横向走势中则会产生反复的讯号。


    如果希望运用机械性的方法过滤反复的讯号，这类的尝试注定徒劳无功——过滤法则可以降低亏损，但获利的潜能也会受到影响。举例来说，价格必须收在移动平均的同一侧达两次，或价格必须穿越移动平均达某个百分率，这类的机械性过滤法则虽然可以减少反复的讯号，但也破坏移动平均的最重要功能——及早锁定趋势。


    4 天、9 天与 18 天的移动平均交叉系统比较常见。当三条均线都朝相同方向时，才产生交易讯号。可是，就如同其他移动平均方法一样，这套系统也仅适用于趋势明确的市场。


    交易者必须接受一项事实：EMA 是一种交易工具，它有优点，也有缺点，移动平均可以协助你辨识趋势，并进行顺势的交易。但它们在交易区间内将产生反复的讯号。在本章所讨论的“三重滤网”交易系统中，我们将尝试解决这种两难的困境。


    ### 四、再论移动平均


    移动平均也具有支撑与压力的功能。上升的移动平均代表下档的支撑，下降的移动平均则代表上档的压力。所以，我们在上升均线的附近买进，在下降均线的附近放空。


    除了价格以外，移动平均的概念也可以运用于指标。某些交易者采用 5 天的移动平均成交量，当成交量低于 5 天均线，代表交易大众兴致不高，当时的短期趋势可能反转。当成交量高于
    5 天均线，代表交易大众兴致很高，这可以确认当时的价格趋势。


