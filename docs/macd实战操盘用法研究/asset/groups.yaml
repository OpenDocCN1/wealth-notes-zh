    ## MACD 实战操盘用法研究


    橡胶日线走势图，形成底背离。我们发现一般背离后都有一波行情，要么是转势行情，至少也是大反弹或大回调行情。


    在实践中，MACD 指标的背离一般出现在强势行情中比较可靠。股价在高价位时，通常只要出现一次背离的形态即可确认位股价即将反转；而股价在低位时，一般要反复出现几次背离后才能确认。


    因此，MACD 指标顶背离研判的准确性要高于底背离，这点投资者要加以留意。


    ### 1.3.2 MACD 背离实战应用


    股价经过一段上涨，与前高持平或者创新高，而 MACD 指标中的 DIFF 不与股价同步向上，反而持平或创新低。使用方法就是不看上面股价，只看 MACD 的
    DIFF 的最高点，只要这个新出来的高峰没有前高就算背离了，一般往下至少有 15% 的跌幅。


    这里要说明的就是教科书上所说的 MACD 背离是股价与 MACD 指标中的 MACD 比，而我这里的是股价与 MACD 指标的 DIFF 比。例图中塑料 1409
    日线走势图，出现顶背离后的走势。


    ![](img/e00f2195878851621153c98be41c491d_21_0.png)


    ## 图 1.12 MACD 顶背离


    反过来，就是 MACD 底背离。股价创新低，DIFF 不再创新低（前面应有一个最低点），这个次低点的后一天就是底背离点，要注意：这个次低点是由后一天涨而形成的，底背离点是一个进货参考点。


    使用方法就是不看上面的股价只看 DIFF，不再创新低了造成这次低点的那天就是底背离点。


    ![](img/e00f2195878851621153c98be41c491d_22_0.png)


    ## 图 1.13 MACD 底背离


    ![](img/e00f2195878851621153c98be41c491d_22_1.png)


    ## 图 1.14 连续的底背离更为准确


    依此看来，MACD 背离战法准确率十分高。凡是要买入股票或期货，一看 MACD 有这种情况了，就不要马上跟进，至少也要等到它回调 15% 以上再进。第二天逢高甩，可以在低位捡回来。


    ![](img/e00f2195878851621153c98be41c491d_23_0.png)


    ## 图 1.15 连续的顶背离更为准确


    以上是原则，一般顶背离较准，看到逃没错，下面至少有 15% 的跌幅，逃错了无非是少赚点，底背离买点就只能供参考，不能保证买了一定有 15% 的赚头，买了不涨只有止损。


    还有一种背离叫做隔峰底背离或隔峰底背驰：第二次金叉出现底背离，第三次金叉位置比第二次金叉位置低，但是比第一次金叉位置高，相比第一次金叉也形成了背离，这就是隔峰底背离或隔峰底背驰。


    隔峰顶背离或隔峰顶背驰：第二次死叉出现顶背离，第三次死叉位置比第二次死叉位置高，但是比第一次死叉位置低，相比第一次死叉也形成了背离，这就是隔峰顶背离或隔峰顶背驰。


    ![](img/e00f2195878851621153c98be41c491d_23_1.png)


