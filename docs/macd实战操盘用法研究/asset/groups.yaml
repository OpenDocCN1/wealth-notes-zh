    ## 第八章 MACD 与切线理论的经典配合使用


    ### 8.1 趋势线


    #### 8.1.1 传统趋势线绘制方法与理论概述


    既然我们理解了支撑和阻力，那就让我们在技术工具的武器库中加上另一块积木——趋势线。（见下边两图。）基本的趋势线是走势图分析人士使用的最简单的技术工具之一，但也是最有价值的工具之一。上升趋势线是一条沿相继的反作用最低点向上绘制的直线。下降趋势线是一条沿相继的反弹波峰向下绘制的直线。


    ![](img/e00f2195878851621153c98be41c491d_180_0.png)


    ![](img/e00f2195878851621153c98be41c491d_180_1.png)


    ## 图 8.1


    ### 一、绘制传统趋势线


    正确绘制趋势线与绘制走势图的其他方面很像，而且为了发现正确的趋势线，通常需要尝试一些不同的线。有时，一条貌似正确的趋势线可能不得不重画。但是，在搜索正确的趋势线中，有一些有用的指导方针。


    首先，必须有趋势的迹象。这意味着，为了画一条上升趋势线，必须至少有两个反作用的低点，并且第二个低点高于第一个。当然，两点才能成一直线。例如，在上边左图中，只有在市场已经开始从点
    3 向上运行之后，走势图分析人士才能有把握地相信一个反作用的低点已经形成，而且只有到那时才能在点 1 和 3 之下画出一条暂定的上升趋势线。


    某些走势图分析人士要求市场突破点 2 处的波峰以印证上升趋势之后才做出趋势线。另一些走势图分析人士只要求浪 2—3 形成 50% 的回撤，或者市场逼近浪 2
    的顶部。尽管标准可能不尽相同，但应记住的要点是，走势图分析人士要有把握地相信一个反作用的低点已经形成，然后才能判定它的有效性。一旦确定了两个上升的低点，就绘制一条连结这些低点的直线，并将直线向右上方延伸。


    ### 二、暂定趋势线与有效趋势线


    到目前为止，我们有的只是一条暂定趋势线。然而，为了印证一条趋势线的有效性，市场就必须第三次触及该线并反弹。因此，在上边左图中，在点 5 处对上升趋势线的成功试探印证了该线的有效性。上边右图显示了一个下降趋势，但规则是一样的。对趋势线的成功试探出现在点
    5 处。归纳起来，要用两点绘制趋势线，并要有第三个点使其成为一条有效趋势线。


    ### 三、如何使用传统趋势线


    一旦第三个点得到印证，而且趋势按其原来的方向发展，那么这条趋势线就有了多方面的用处。趋势的基本概念之一是，运动中的趋势会保持运动。由此推论，一旦某个趋势如趋势线确定的那样呈现出一定的斜率或速率，那么它通常会继续维持同样的斜率。所以，趋势线不仅可以帮助确定市场调整阶段的极限，更重要的是可以告诉我们趋势何时要发生变化。


    例如，在上升趋势中，必定出现的调整性回档经常会触及或非常接近上升趋势线。因为交易者的目的是在上升趋势中乘回档时买进，所以


    一旦上升趋势线已经建立，靠近趋势线的后续回档可以用作买入区域。这个例子中的点5和点7本该用来开立新的多头仓位或增加多头仓位。当市场在点9处跌破趋势线时，就发出了趋势向下反转的信号，要求了结全部多头仓位。


    ![](img/e00f2195878851621153c98be41c491d_182_0.png)


    ![](img/e00f2195878851621153c98be41c491d_182_1.png)


    点5和点7本可用作卖出区域。当市场在点9处突破趋势线时，就发出了趋势向上反转的信号。


    ## 图 8.2


    趋势线提供了一条在市场下方可以用作买进区域的支撑边界。下降趋势线则可以用作阻力区，达到卖出目的（见上边两图）。


    只要趋势线未受侵犯，就可用来确定买入或卖出区域。然而，在上边左图中的点9处，市场跌破趋势线，发出了趋势转变的信号，要求平仓了结所有沿先前趋势的方向建立的仓位。经常地，市场突破趋势线是趋势转变的最佳早期警报。


    ### 四、如何确定趋势线的重要性


    让我们来讨论一下对趋势线的明确表达。首先，什么决定了一条趋势线的重要性？这个问题答案包含两个方面——完好的时间越久，受试探的次数越多，就越重要。例如，一条已经成功经受八次试探的趋势线，已经连续证明了它的有效，显然比一条只经受过三次试探的趋势线重要得多。而且，一条已经作用了九个月的趋势线比一条只作用了九周或九天的趋势线重要得多。趋势线越重要，它引发的信心就越足，而且它的突破就越重要。


    ### 五、趋势线应当包含全部价格活动


    柱线图的趋势线应当绘在整个一天的价格区间的上下。有些走势图分析人士更喜欢通过连接各个收盘价来绘制趋势线，但这不是一种标准的方法。虽然收盘价很可能是全天最重要的价格，但它只代表全天价格活动的一小部分样本。包含今天价格区间的技法考虑了所有的价格活动，因而更常用。


    ### 六、如何处理细小的趋势线穿越


    有时，市场会在一天内干扰趋势线，但仍收于原来的趋势方向上，


    这使分析人士吃不准趋势线是否实际上已被突破。市场曾在一天中回档至趋势线之下，但在收盘时又回到了上升趋势线之上。这根趋势线应当重画吗？


    不幸的是，在这种情况下没有一条牢靠的规则可循。有时候，最好是忽略这种轻微的破坏，尤其是在随后的市场行为证明原趋势线依然有效的情况下。


    ### 七、什么构成了对趋势线的有效突破


    作为一条总的规则，收盘在趋势线的另一侧比日内穿越更加重要。再进一步，有时甚至收盘价的穿越也不足以说明问题。为了分析有效的趋势线穿越并消除误信号或“拉锯现象”，大多数技术分析人士采用各种不同的时间“过滤器”和价格“过滤器”。3%穿越标准便是价格过滤器的一个例子。这种价格过滤器主要用于市场对长期趋势线的突破，但要求趋势线被突破的幅度按收盘价计算至少达到3%。（3%原则不适用于一些金融期货，例如利率市场。）


    例如，如果黄金价格在400美元处跌破了一条重要的上升趋势线，那么黄金价格就得收在趋势线下方，幅度是趋势线跌破处价位的3%以上（在这个情形中，黄金价格必须收在趋势线以下12美元处，或收在388美元处）。显然，12美元的穿越标准对于短期交易来说不会合适。也许，在这种情形中1%的标准更有效。百分比原则仅仅代表价格过滤器的一种类型。例如，股票走势图分析人士会要求整点穿越，并忽略小数点位上的运动。在使用任何类型的过滤器时都有折中问题。如果过滤器设得太小，在减少拉锯现象的影响时就不会很有用。如果太大，那么在有效信号出现之前，就会错过初始运动的大部分。这里再说一遍，交易者必须确定什么类型的过滤器最适于所跟踪的趋势的级别，要永远接受各个市场间的差异。


    价格过滤器（要求趋势线被穿越了某种预设的价格或百分比）的替代物是时间过滤器。常见的时间过滤器是“两天原则”。换言之，要形成对趋势线的有效突破，市场必须连续两天收市在该线的另一侧。因此，要突破上升趋势线，价格就必须连续两天收在该趋势线的下方。一天的干扰没有价值。1%～3%原则和两天原则不仅应用于对重要趋势线的突破，同样也应用于对重要支撑位和阻力位的突破。另一种过滤器会要求周五的收盘价超过主要的突破点，以确保周信号。


    ### 八、趋势线如何互换角色


    前面讲过，支撑位和阻力位一旦被击破，就变成了对方。趋势线也有同样的规律（见下边两图）。换言之，上升趋势线（支撑线）一旦确定被跌破后，就变成了阻力线。下降趋势线（阻力线）一旦确定被冲破后，就变成了支撑线。这就是为什么即使在趋势线已经被打破之后，依然把它们尽可能地在走势图上向右延伸是个好主意。令人惊奇的是，旧的趋势线未来再次作为支撑线或阻力线的现象屡见不鲜，只是角色相反。


    ![](img/e00f2195878851621153c98be41c491d_184_0.png)


    ![](img/e00f2195878851621153c98be41c491d_184_1.png)


    ## 图 8.3


    ### 九、趋势线的测算含义


    趋势线能够用来帮助测算价格目标。在本书关于价格形态的章节中，我们将大量探讨价格目标。实际上，我们曾经提及的某些由各种价格形态衍生出的价格目标，与我们将要涉及的用趋势线测算出的价格目标很相似。简而言之，一旦趋势线被突破，市场离开趋势线的距离，通常与趋势反转以前市场在趋势线的另一侧曾经达到的垂直距离相等。


    换言之，如果在原先的上升趋势中，市场在上升趋势线的上方曾走了 50 美元（垂直测量），那么当市场跌破趋势线后预计会在趋势线下方跌去同样的 50 美元。这种使用趋势线的测算规则与广为人知的头肩形反转形态使用的测算规则相似，头肩形中“头”至“颈线”的距离就是市场突破颈线后会到达的目标价位。


    ### 十、趋势线的相对陡度


    趋势线的相对陡度也很重要。一般来说，大多数重要的上升趋势线


    往往有大约 45 度的平均斜度。某些走势图分析人士只在走势图上从一个显著高点或低点引出一条 45 度的直线，并将其作为一条主要的趋势线。这样一条直线反映出价格以价格与时间处于完美平衡的速率上升或下降的情形。


    如果趋势线过陡，则常常表明市场上升得太快，因而当前陡度的上升行情不会持久。市场跌破这种陡度的趋势线可能只是回调至接近 45 度线的更持久的斜度。如果趋势线过平，它可能说明这个上升趋势太弱而且不可靠。


    ### 十一、怎样调整趋势线


    有时趋势线必须加以调整，以适应正在放缓或加速的趋势（见上边右图）。例如，正像前面的图例所示，如果陡峭的趋势线被突破了，就可能有必要做出一條较慢的趋势线。如果原先的趋势线过于平坦，就有可能必须以更陡的角度重新绘制。市场跌破陡峭的趋势线使绘制一条较慢的直线变得必要。


    原先的趋势线过于平坦，以更陡的角度重新绘制。上升趋势已经加速，这就需要更陡的直线。一条过于远离价格行为的趋势线显然对跟踪趋势毫无用处。


    在趋势加速的情况下，有时需要按不断陡峭的角度绘制出几条趋势线。然而，根据我的经验，在更陡峭的趋势线变得必不可少时，最好采用另一种工具——移动平均线，它与弯曲的趋势线一样。同时了解几种不同类型的技术指标的优势之一在于可以按特定的场合选择最合适的指标。本书涉及的所有分析技法在某些特定的场合中功效显著，但在另一些场合中就不太灵验了。如果技术分析人士有一把技术分析工具可供利用，那就能在一个特定的形势下迅速从一种工具转换到另一种可能更有效的工具上。加速的趋势就是这种场合之一，此时移动平均线会比一系列越来越陡的趋势线更为有用。


