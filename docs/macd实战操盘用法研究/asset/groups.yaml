    ## 2. 5. 3  MACD 与三线开花理论的经典配合使用


    三线开花后，后市要大涨。这就有几个买点：一是开花起点买点，二是 120 跳马买点，三是回踩 250 日均线买点。这几个买点都存在一个问题，如果开不了花怎么办？如果跳马不成摔伤了怎么办？如果回踩不成踩踏了怎么办？幸好我们有
    MACD 的护航保驾，只要在这三个买点附近同时出现 MACD 金叉，则大胆按 MACD 金叉买入，这三个买点基本必然不会失败，即使失败，我们仍有随后的 MACD
    死叉来止损。所以 MACD 是辅助配合三线开花选取进场点的非常有力的工具。


    ![](img/e00f2195878851621153c98be41c491d_90_0.png)


    ### 图 2.26 菜油


    上图 2.26 是菜油 1005 日线图，菜油日线出现了顺向三线开花，它要走顺水推舟的时候我们不知道它能不能推成舟，然而当时 MACD 一金叉我们就知道它肯定能推成舟了，就果断按
    MACD 金叉买入。它 120 跳马的时候，我们不知道它跳起来还是摔下去，然而当时出现了 MACD 金叉，我们就知道它必然能跳起来，于是就按 MACD 金叉选点买入。


    这个行情多方很不容易，本来 120 跳马后，后市该大涨了，然而这次三线开花属于涨势不大的三线开花，因为 MA（20）金叉 MA（120）后很久才出现 MA（120）金叉
    MA（250），本来应该是 MA（120）金叉 MA（250）才出现 120 跳马，那才是大涨的。而它提前出现 120 跳马，这次跳马的涨势仅仅推动了 MA（120）金叉
    MA（250），而这次 MA（120）金叉 MA（250）本该是顺水推舟 MA（20）金叉 MA（120）来完成的，因此它比正常的顺向三线开花涨势弱了一拍，由此它必然出现回踩
    MA（250）。


    这次回踩 250 日均线能否成功，关键要看日线 MACD 是否能金叉。目前日线 MACD 有金叉迹象，即将金叉，如果金叉成功，后市必定回踩 MA（250）成功，出现一波大涨，开花成功。如果金叉不成功，出现
    MACD 将金不金，必然导致回踩 MA（250）失败，由于 MACD 将金不金跌势很大，甚至重新造成 MA（120）死叉 MA（250），不但花开不成，后市还是发动新的长期跌势。


    鉴于豆油的历史最高价格 14896，历史最低价格 4558，目前价格 7078 处在历史低位，且当前的豆油生产成本约 6500—7000 附近，考虑大豆的亩产以及大豆生产成本，根据这些基本面信息，按照个人估计，这次可能会金叉成功，后市可能会开花。


    前面那些三线开花为何都是只回踩 MA（120）不回踩 MA（250），而这次豆油却为何回踩 MA（250）呢？关键的原因是前边的几个例子，都在底部横盘时候出现多次多头反弹进攻，在三线开花时候
    250 日均线已经变平（开特大花）或虽然方向向下但是向下斜率很小比较平了（开大花），而这次豆油底部横盘时候没有几次较大反弹，且底部横盘时间不够长。前边的品种要么底部横盘
    1～2 年，要么底部横半年但是开花前反弹力度较大。而豆油底部横盘仅仅横盘 5 个月，且反弹力度不大，这导致 120 日均线金叉 250 日均线时，250 日均线的方向还是明显向下的。250
    日均线方向向下对价格的大吸引导致了价格要回踩 250 日均线，如果回踩完豆油能发动一波新上涨则会拉平 250 日均线，甚至让 250 日均线拐弯向上，然后价格可能再次
    120 跳马，以后才是真正的大涨势，真正的开大花。


    股市期货绝不是速成的市场，它是一个战场，我们每个人都不是神仙，都是凡人，我们来到投机市场，无论学历高低、智商高低，就像一群新兵来到战场，初期必然是一触即溃，必然付出惨重代价。关键的是随后意志坚强的人继续挺了下来，总结经验继续战斗，尽管还会战败，但时间久了，敌人招数都了解了，吃亏也差不多了，慢慢也就能开始盈利了，最后甚至可能大胜了。


    想想围棋界韩国的李昌镐前期是多么厉害，号称“石佛”，基本百战百胜，毫无漏洞，国内棋手基本遇之必败。面对这个围棋世界第一人，国内棋手虽然不断失败，但是我们却在不断研读每次失败时我们出现的失误以及找出每次局中领先时的经验，慢慢地李昌镐的招数用完了，我们的错误总结完了，改正好了，慢慢地我们的棋手开始能偶尔胜李昌镐，最后胜李昌镐也水到渠成司空见惯了。至少不至于世界各大围棋赛的冠军奖杯基本全被李昌镐囊括吧？至少最近两年李昌镐拿到的世界围棋冠军奖杯就很少了。


    这就是事物的本质，我们做期货也这样，只能长期失败，长期改正自己的操盘缺陷，坚持下去，最终是一定能胜利的。


    ## 2.6 小结：本章最主要的理论贡献


    并向三线开花的最大要求是开花时（即 MA（20）金叉 MA（120）时），MA（120）已经金叉 MA（250）。而后边的顺向三线开花，开花后才形成 MA（120）已经金叉
    MA（250）。而再后边的逆向三线开花则是开花后却形成 MA（120）死叉 MA（250）。这就是三种三线开花的本质差别。


    回头望月是 MA（20）金叉 MA（120）后，股价回调到 MA（120）附近再涨，这是股价回踩 MA（120），就叫 120 跳马；快马加鞭是 MA（20）金叉
    MA（120）后，股价高位横盘不回调等 MA（120）上来后再涨；顺水推舟是 MA（20）金叉 MA（120）后，股价慢慢涨上来既没有大回调，也不是强势高位横盘，自然上涨。


    顺向火车轨是 MA（120）金叉 MA（250）金叉后，一直平行前进，后市必定长期大涨。类似的空头市场的顺向火车轨是 MA（120）死叉 MA（250）金叉后，一直平行前进，后市必定长期大跌。


    小均线汇聚后，要么顺势服从要么扭转大均线，一旦出现均线汇聚，我们开仓的时机就快到了。小均线汇聚后，如果对大均线只出头不穿越，或穿越后不能有效回踩，回踩时接着回破均线，则是均线服从，后市按大均线方向前进。如果小均线汇聚后，对大均线穿越且穿越后有效回踩不破大均线，则是均线扭转，后市要转势，大均线方向要改变。


