    # 3.2 KDJ 的特殊分析方法


    # 一、KDJ 的分析周期


    分析周期分为：日、周、月、分钟（主要是 60 分钟）。


    10 日以下为分析参数的 KDJ 的研判适用周期为 3 天左右（从金叉到死叉为 3 天时间）。


    50 日以下为分析参数的 KDJ 的研判使用周期为 10 天左右。


    50 日以上为分析参数的 KDJ 的研判适用周期为 20 天左右。


    # 二、均线先行原则


    股价一旦被长期均线压制，KDJ 再怎么样金叉一般也只能做短线操作，切莫做中长线投资。这是 KDJ 使用的前提。在长期均线下，且远离均线，KDJ 金叉时，股价有超跌反弹的可能，可做短线操作。


    # 三、涨势的大体周期


    日 KDJ 是短中期，最多维持 15 天～1 个月。


    周 KDJ 是中期，维持时间为 1～3 个月（一旦金叉，一个月内基本会涨，但涨幅不能确定）。


    月 KDJ 是长期，维持时间一般为 3～5 个月。'
