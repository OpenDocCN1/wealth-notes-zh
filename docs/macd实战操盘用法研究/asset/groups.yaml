    # 第三章 MACD 与 KDJ 的经典配合使用


    KDJ 指标又叫随机指标，是由乔治·蓝恩博士（George Lane）最早提出的，是一种相当新颖、实用的技术分析指标，它起先用于期货市场的分析，后被广泛用于股市的中短期趋势分析，是期货和股票市场上最常用的技术分析工具。


    # 3.1 KDJ 指标的原理、计算方法与研判技巧


    # 3.1.1 KDJ 指标的原理


    随机指标 KDJ 一般是根据统计学的原理，通过一个特定的周期（常为 9 日、9 周等）内出现过的最高价、最低价及最后一个计算周期的收盘价及这三者之间的比例关系，来计算最后一个计算周期的未成熟随机值
    RSV，然后根据平滑移动平均线的方法来计算 K 值、D 值与 J 值，并绘成曲线图来研判股票走势。


    随机指标 KDJ 是以最高价、最低价及收盘价为基本数据进行计算，得出的 K 值、D 值和 J 值分别在指标的坐标上形成的一个点，连接无数个这样的点位，就形成一个完整的、能反映价格波动趋势的
    KDJ 指标。它主要是利用价格波动的真实波幅来反映价格走势的强弱和超买超卖现象，在价格尚未上升或下降之前发出买卖信号的一种技术工具。它在设计过程中主要是研究最高价、最低价和收盘价之间的关系，同时也融合了动量观念、强弱指标和移动平均线的一些优点，因此，能够比较迅速、快捷、直观地研判行情。'
  - '[PAGE 95]


    # MACD 实战操盘用法研究


    随机指标 KDJ 最早是以 KD 指标的形式出现，而 KD 指标是在威廉指标的基础上发展起来的。不过威廉指标只判断股票的超买超卖现象，在 KDJ 指标中则融合了移动平均线速度上的观念，形成比较准确的买卖信号依据。在实践中，K
    线与 D 线配合 J 线组成 KDJ 指标来使用。由于 KDJ 线本质上是一个随机波动的观念，故其对于掌握中短期行情走势比较准确。


    # 3.1.2 KDJ 指标的计算方法


    指标 KDJ 的计算比较复杂，首先要计算周期（n 日、n 周等）的 RSV 值，即未成熟随机指标值，然后再计算 K 值、D 值、J 值等。以日 KDJ 数值的计算为例，其计算公式为：


    n 日 RSV = (Cn − Ln) ÷ (Hn − Ln) ×100


    公式中，Cn 为第 n 日收盘价；Ln 为 n 日内的最低价；Hn 为 n 日内的最高价。RSV 值始终在 1−100 间波动。


    其次，计算 K 值与 D 值：


    当日 K 值 = 2/3 × 前一日 K 值 + 1/3 × 当日 RSV


    当日 D 值 = 2/3 × 前一日 D 值 + 1/3 × 当日 K 值


    若无前一日 K 值与 D 值，则可分别用 50 来代替。


    以 9 日为周期的 KD 线为例。首先须计算出最近 9 日的 RSV 值，即未成熟随机值，计算公式为：


    9 日 RSV = (C − L9) ÷ (H9 − L9) ×100


    式中，C 为第 9 日的收盘价；L9 为 9 日内的最低价；H9 为 9 日内的最高价。


    K 值 = 2/3 × 前一日 K 值 + 1/3 × 当日 RSV


    D 值 = 2/3 × 前一日 K 值 + 1/3 × 当日 RSV


    若无前一日 K 值与 D 值，则可以分别用 50 代替。


    需要说明的是，式中的平滑因子 1/3 和 2/3 是可以人为选定的，不过目前已经约定俗成，固定为 1/3 和 2/3。在大多数股市分析软件中，平滑因子已经被设定为
    1/3 和 2/3，不需要作改动。另外，一般在介绍 KD 时，往往还附带一个 J 指标。


    J 指标的计算公式为：


    J = 3D − 2K


    实际上，J 的实质是反映 K 值和 D 值的乖离程度，从而领先 KD 值'
  - '[PAGE 96]


    找出头部或底部。J 值范围可超过 100。


    J 指标是个辅助指标，最早的 KDJ 指标只有两条线，即 K 线和 D 线，指标也被称为 KD 指标，随着股市分析技术的发展，KD 指标逐渐演变成 KDJ
    指标，从而提高了 KDJ 指标分析行情的能力。另外，在一些股市重要的分析软件上，KDJ 指标的 K、D、J 参数已经被简化成仅仅一个，即周期数（如日、周、月等），而且，随着股市软件分析技术的发展，投资者只需掌握
    KDJ 形成的基本原理和计算方法，无须去计算 K、D、J 的值，更为重要的是利用 KDJ 指标去分析、研判股票行情。


    和其他指标的计算一样，由于选用的计算周期的不同，KDJ 指标也包括日 KDJ 指标、周 KDJ 指标、月 KDJ 指标年 KDJ 指标以及分钟 KDJ 指标等各种类型。经常被用于股市研判的是日
    KDJ 指标和周 KDJ 指标。虽然它们的计算时的取值有所不同，但基本的计算方法一样。


    # 3.1.3 KDJ 指标的一般研判技巧


    随机指标 KDJ 主要是通过 K、D 和 J 这三条曲线所构成的图形关系来分析股市上的超买超卖，走势背离及 K 线、D 线和 J 线相互交叉突破等现象，从而预测股价中、短期及长期趋势。KDJ
    是市场上绝大多数投资者熟知的分析工具，但具体运用时，投资者可能会发现 KDJ 的分析结果和实际走势存在着特别大的差别，有时还会得出相反的结论，这其中原因主要是绝大多数投资者只知道
    KDJ 的一般分析原理和方法，而对 KDJ 分析指标的一些内涵和特定的分析技巧知之甚少。本节在介绍股市分析中市场上流行的 KDJ 的一般研判技巧和分析方法上，重点挖掘
    KDJ 指标的内在规律，详细分析 KDJ 的一些特殊研判功能。


    KDJ 指标是三条曲线，在应用时 KDJ 指标的一般研判标准主要是从 KDJ 三个参数的取值、KDJ 曲线的形态、KDJ 曲线的交叉、KDJ 曲线的背离和
    K 线、D 线、J 线的运行状态以及 KDJ 曲线同股价曲线的配合等几个方面来考虑。


    # （一）KDJ 的取值


    +   1. 取值范围


    KDJ 指标中，K 值和 D 值的取值范围都是 0～100，而 J 值的取值范围可以超过 100 和低于 0，但在分析软件上 KDJ 的研判范围都是 0～100。通常就敏感性而言，J
    值最强，K 值次之，D 值最慢，而就安全'
