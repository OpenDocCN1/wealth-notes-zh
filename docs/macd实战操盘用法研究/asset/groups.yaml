    ## 11.2 “三重滤网” 交易系统中的 MACD


    ## 一、MACD 交易法则


    MACD 线与讯号线之间的穿越，可以反映市场潮流的变动。顺着穿越方向交易，相当于是顺着潮流前进，相对于单一移动平均线的交易方法来说，这套系统所提供的交易讯号较少，讯号反复的可能性也比较小。


    - 1. 当快速的 MACD 线由下往上穿越慢速的讯号线，这是买进讯号，进场建立多头部位，停损设定在最近的次要低点下侧。

    - 2. 当快速的 MACD 线由上往下穿越慢速的讯号线，这是卖出讯号，进场建立空头部位，停损设定在最近的次要高点上侧。


    MACD 指标：当快速的 MACD 线由上穿越慢速的讯号线，这是买进讯号；当快速的 MACD 线由向下穿越慢速的讯号线，这是卖出讯号。相对于价格与单一均线的穿越讯号，这套方法比较能够掌握主要的趋势，也比较不会产生反复的讯号。


    ## 二、再论 MACD


    许多交易者不采用标准的 12 天、26 天与 9 天的 EMA，他们透过历史资料的测试，寻找最佳化的期间：5-34-7 是另一组常用的期间。某些交易者尝试将
    MACD 与市场循环结合在一起，问题是市场经常不存在循环。如果你采用循环，第一条 EMA 的长度应该是主导循环长度的四分之一，第二条 EMA 的长度是循环长度的一半，第三条
    EMA 是一种平滑工具，它的长度不需要与循环相关。请留意，不要太沉迷于 MACD 的最佳化程序：只要不断尝试，一定可以找到最佳的期间，它们提供最完美的讯号，但仅适用于过去的资料。


    如果软件不提供 MACD 的指标，可以直接计算 11 天与 26 天的 EMA，然后由它们的穿越讯号来代表 MACD 线与讯号线。


    ## 三、MACD 柱状图


    MACD 柱状图可以更进一步显示多、空力量的消长，它不仅说明多、空双方谁居于主导地位，还可以反映主导力量的强化或转弱，这是技术分析者所可以运用的最佳工具之一。


    MACD 柱状图＝MACD 线－讯号线


    MACD 柱状图是衡量 MACD 线与讯号线之间的差值，然后将这些差值绘制为柱状图，这些数值看起来很小，但可以透过电脑将它们放大。


    如果快速线位于慢速线之上，MACD 柱状图为正值，绘制在零线之上。如果快速线位于慢速线之下，MACD 柱状图为负值，绘制在零线之下。当快速线与慢速线交叉，MACD
    柱状图为零。


    当 MACD 线与讯号线拉开，MACD 柱状图变得比较长（正值）或比较深（负值）。当 MACD 线与讯号线靠拢，MACD 柱状图变得比较短（正值）或比较浅（负值）。


    MACD 柱状图的斜率是取决于相邻两支柱状的关系（在下方中，当提及柱状图的高度，考虑正、负符号在内，举例来说，愈接近零的负数，高度愈大；换言之，－1>－2，愈接近零的正数，高度愈小：换言之，＋2>＋1）。如果最近的柱状图较高，柱状图切线的斜率向上。如果最近的柱比较矮，柱状图切线的斜率向下。


    ## 四、市场心理


    MACD 柱状图是代表长期与短期价值共识之间的差值。快速的 MACD 线反映比较短期间的群众共识。慢速的讯号线反映比较长期间的群众共识。MACD 柱状图是追踪这两条线之间的差值。


    MACD 柱状图切线的斜率，可以反映市场主导力量转强或转弱。柱状图位于零线以上，多头是市场的主导力量；斜率向上代表多头的主导力量转强，斜率向下代表多头的主导力量转弱，柱状图位于零线以下，空头是市场的主导力量；斜率向下代表空头的主导力量转强，斜率向上代表空头的主导力量转弱。


    当 MACD 线的上升速度快于讯号线，MACD 柱状图的高度会增加，这代表多头的力量逐渐增强，最好由多方进行交易。当 MACD 线的下降速度快于讯号线，MACD
    柱状图的高度会减少，这代表空头的力量逐渐增强，最好由空方进行交易。


    当 MACD 柱状图的斜率与价格趋势保持相同的方向，趋势很安全。当 MACD 柱状图的斜率方向不同于价格趋势，趋势很有疑问，最好顺着 MACD 柱状图的斜率方向进行交易，因为它可以反映多、空力量的消长。


    MACD 柱状图斜率的重要性，高于柱状图位于零线之上或之下。


    当 MACD 柱状图位于零线之上而斜率由正转负，这是最理想的卖出讯号，因为多头的气力放尽。当 MACD 柱状图位在零线之下而斜率由负转正，这是最理想的买进讯号，因为空头的气力放尽。


    ## 五、交易法则


    MACD 柱状图可以提供两类的讯号，一是每天都发生的普通讯号，另一种讯号相当罕见，任何市场每年可能仅有几次，但这是强烈的讯号。


    普通讯号是由 MACD 柱状图的斜率决定。如果目前的柱状高于前一支柱状，斜率向上，代表多头力量转强，适合买进。如果目前的柱状低于前一支柱状，斜率向下，代表空头力量转强，适合放空。如果价格朝某个方向移动，而
    MACD 柱状图朝另一个方向移动，代表市场主导力量的热忱正在冷却中，价格趋势很弱。


    - 1. 当 MACD 柱状图停止下降而回升，这是买进讯号，建立多头部位，停损设定在最近次要低点的下侧。

    - 2. 当 MACD 柱状图停止上升而下降，这是卖出讯号，建立空头部位，停损设定在最近次要高点的上侧。


    在日线图中，MACD 柱状图经常波动，实务上不能将每次的变动视为买、卖讯号。


    在周线图中，MACD 柱状图的斜率变动比较有意义，可以纳入“三重滤网”交易系统。


    如果 MACD 柱状图与价格之间发生背离的现象，这代表主要的转折点，这类的讯号很少发生；可是，一旦发生之后，经常发展为主要的反转与新趋势的开始。


    在什么情况下可能创新峰位或谷底？


    MACD 柱状图就像是车子的大灯——让交易者了解前面的路况。当指标创新高或新低，价格通常也会随之创新高或新低。


    如果 MACD 柱状日线图创最近三个月的新高，代表多头气势如虹，价格可能进一步上升。反之，如果 MACD 柱状日线图创最近三个月的新低，意味着价格可能进一步下挫。


    在涨势中，MACD 柱状图创新高，代表上升趋势很健康，次一波涨势可能重新测试或超越前一波的峰位。同理，在跌势中，MACD 柱状图创新低，代表空头劲道十足，可能重新测试或超越前一波低点。


    技术分析中最强烈的讯号是什么？


    对于任何特定的市场，MACD 柱状图与价格之间的背离现象，每年顶多仅会发生几次，它们是技术分析中最明确的讯号。这种背离现象意味着主要的转折点，代表“超级”的买进或卖出讯号。它们不会发生在每个重要的头部或底部，但只要察觉这类讯号，你知道主要的趋势很可能发生反转。


    当价格涨势创新高，而 MACD 柱状图的头部却下滑，这形成空头的背离。MACD 柱状图的头部下滑，显示多头在价格上涨的过程中显露出疲态，多头逐渐放尽力气，空头准备接手控制大局。MACD
    柱状图与价格之间的空头背离现象，指出行情头部的结构脆弱。当它发出最强烈的卖出讯号，许多交易者或许还陶醉在价格创新高的激情中。


    - 3. 当价格涨势创新高而 MACD 柱状图的头部下滑，这代表卖出讯号，建立空头部位，停损设定在最近高点的上侧。


    只要价格与 MACD 柱状图都持续创新低，就可以确认下降趋势，如果价格创新低，而 MACD 柱状图的底部垫高，这形成多头的背离。价格仅是仰赖惯性下跌，空头是外强中干，多头即将主导盘势。MACD
    柱状图与价格之间的多头背离现象，指出行情底部潜藏着无限的生机。当它发出最强烈的买进讯号，许多交易者还迷失在价格创新低的恐吓深渊中。


    - 4. 当价格拉回创新低而 MACD 柱状图的底部垫高，这代表买进讯号，建立多头部位，停损设定在最近低点的下侧。


    如果 MACD 柱状图与价格之间的多头背离现象无效，价格再创新低，你将被停损出场。继续观察 MACD 柱状图，如果价格创新低而柱状图出现第三个垫高的底部，这是“三重多头背离”——非常强烈的买进讯号，在这种情况下，当
    MACD 柱状图开始回升时，立即进场买进。对于三重空头的背离，则采取相反的放空程序。


    ## 六、再论 MACD 柱状图


    MACD 柱状图适用于任何的时间架构：周线图、日线图与盘中走势图。周线图讯号所代表的意义将大于日线图与盘中走势图。这个原则适用于任何的技术指标，长期时间架构的讯号，它所代表的意义愈重要。


    当你根据周线图分析 MACD 与 MACD 柱状图，讯号的判断不必等待星期五。主要的趋势变动可能发生在任何时候——市场不会看日历。所以，你每天都必须研究周线图。


    ## 11.3 “三重滤网” 交易系统中的 KDJ


    ## 一、KDJ 交易法则


    随机指标提供三类交易讯号，依重要性的排列顺序为：背离、随机指标的读数与线形方向。


    5 天慢速随机指标：当随机指标进入上方的超买区，价格往往即将形成头部。当随机指标进入下方的超卖区，价格往往即将形成底部。这类的讯号适用于横向走势中，但在明确的趋势中，讯号通常会过早发生，当指标与价格之间产生背离，这是最理想的交易讯号。


    当根据随机指标做多或做空之后，将停损设定在最近次要低点之下或高点之上，图形的最右端出现一个买进讯号——回补空头部位，转空为多。


    ## 二、背离


    当随机指标与价格之间产生背离的现象，这代表最强烈的交易讯号。


    - 1. 当价格下跌而创新低，但随机指标的底部高于前一波跌势的低点，这构成多头的背离。这种现象显示空头正丧失力量，价格仅仰赖惯性下跌。一旦随机指标由第二个底部翻升，即是强烈的买进讯号：建立多头部位，将停损设定在最近低点的下侧。如果第一个底部在超卖基准线下侧而第二个底部位于基准线上方，这代表最理想的买进讯号。

    - 2. 当价格上涨而创新高，但随机指标的头部低于前一波涨势的峰位，这构成空头的背离。这种现象显示多头正丧失力量，价格仅仰赖惯性上涨，一旦随机指标由第二个底部下滑，即是强烈的卖出讯号：建立空头部位，将停损设定在最近高点的上侧。如果第一个头部在超买基准线上侧而第二个头部位于基准线下方，这代表最理想的卖出讯号。


    ## 三、超买与超卖


    当随机指标上升而超过上方的基准线，这代表行情进入超买状态，超买意味着过高，可能拉回。当随机指标下降而超过下方的基准线，这代表行情进入超卖状态，超卖意味着过低，可能回升。


    这类讯号在横向走势中表现不错，但不适用于趋势明确的行情。在上升趋势中，随机指标很容易进入超买区，但它发出卖出讯号之后，行情将持续上涨。在下降趋势中，随机指标很容易进入超卖区而过早发出买进讯号。在运用上，随机指标应该配合某种长期的顺势指标。在“三重滤网”交易系统中，唯有当周线图的趋势向上时，才采用日线图上随机指标的超卖（买进）讯号；同理，唯有当周线图的趋势向下时，才采用日线图上随机指标的超买（卖出）讯号。


    - 1. 假定周线图处于上升趋势中，如果日线图的随机指标下滑进入超卖区，这即是买进讯号，不必等待指标回升或向上穿越基准线，立即在最近一支长条图的最低价上侧设定买单，一旦建立多头部位之后，停损设定在进场当天或前一天最低价——以较低者为准的下侧。


    随机指标底部的形状，经常可以显示涨势的强弱程度。如果底部又窄又浅，代表空头的力量很弱，涨势可能比较强劲。如果底部的形状又深又宽，代表空头的力量很强，涨势可能比较弱，最好仅选用强劲的买进讯号。


    - 2. 假定周线图处于下降趋势中，如果日线图的随机指标上升进入超买区，这即是卖出讯号，不必等待指标下滑或向下穿越基准线，立即在最近一支长条图低价的下侧设定空单，当随机指标向下穿越超买基准线，行情经常暴跌，一旦建立空头部位之后，停损设定在进场当天或前一天最高价——以较高者为准的上侧。


    随机指标头部的形状，经常可以显示跌势的强弱程度。如果头部很窄，代表多头的力量很弱，跌势可能比较严重。如果头部的形状又高又宽，代表多头的力量很强，跌势可能比较有限——最好放弃这类卖出讯号。


    - 3. 当随机指标进入超买区，不可买进；当随机指标进入超卖区，不可放空。这个法则可以过滤掉大部分的不理想讯号。


    ## 四、线型的方向


    当随机指标的快速线与慢速线都朝相同的方向发展，这可以确认短期趋势。如果价格上涨而两条线形也向上，上升趋势可能持续。反之，如果价格下跌而两条线形也向下，短期下降趋势可能持续。


    ## 五、再论随机指标


    随机指标可以运用于任何的时间架构，包括：周线图、日线图与盘中走势图。在周线图上，随机指标改变方向的时间，通常较 MACD 柱状图提早一个星期。所以，当周线的随机指标发生转折时，它是在提出警告，顺势的
    MACD 柱状图可能在下一周发生转变，对于既有的部位，应该调整停止点，或开始获利了结。


    随机指标的视窗宽度是一个很重要的参数。短期的摆荡指标比较敏感，长期的摆荡指标仅捕捉重要的头部与底部。如果你单独采用随机指标，最好采用稍长的期间。如果你准备将随机指标纳入交易系统而配合其他的顺势指标，则应该采用稍短的期间。


    伯恩斯坦（Jacob Bernstein）提出一种随机指标的短线运用方法，称为“随机指标遽升”（Stochastic pop）。当随机指标向上穿越超买线，代表上涨的力量，你可以买进而掌握这波急涨的走势。一旦随机指标反转，立即卖出。这个讯号可以让你捉住多头走势的最后一段。一（雷恩本人也提出一个适用于超卖区的相反观念，称为“随机指标遽降”（Stochastic
    poop））


    随机指标是自动化交易系统者最偏爱的工具之一，他们试图以纯机械的方式运用随机指标，将快速线与慢速线的交叉视为交易讯号。当这种方法不能产生神奇的效果时，他们又纷纷舍弃这种指标，不论采用什么最佳化程序，快速线与慢速线的交叉讯号绝对不是万灵的，因为随机指标的效用取决于市场是处在趋势明确或横向走势中。


    ## 11.4 “三重滤网” 交易系统及其应用


    ## 11.4.1 “三重滤网” 交易系统详细介绍


    股票市场有三种趋势：这三种趋势分别比喻为潮汐（tide）、波浪（wave）与涟漪（ripple）。交易者应该顺着潮汐方向交易，掌握波浪的走势，不需要理会涟漪。


    “三重滤网”交易系统在这方面采取一个原则：任何时间架构都是以 5 的因子与较大和较小的时间架构相互关联。


    每位交易者都必须决定自己所希望交易的时间架构。“三重滤网”称此为“中期”时间架构。“长期”时间架构是较高一个层次，“短期”时间架构则是较低的一个层次。


    举例来说，如果你的交易部位通常是持有数天或数个星期，则你的中期时间架构是由日线图界定。周线图是属于较高一个层次，界定长期的时间架构，小时走势图是属于较低的一个层次，界定短期的时间架构，部位持有时间短于一个小时的当日冲销者也可以采用相同的原则。对于他们来说，中期时间架构是由
    10 分钟走势图界定，小时走势图界定长期时间架构，2 分钟走势图界定短期时间架构。


    在“三重滤网”中，首先必须检视长期的走势图。你仅可以顺着潮汐的方向交易——长期走势图中的趋势。然后，在逆着潮汐方向的波浪中寻找进场机会。举例来说，当周线趋势向上，日线图的跌势是买进的机会。当周线趋势向下，日线图的涨势是放空的机会。


    ## 一、第一层滤网——市场潮汐


    “三重滤网”首先是分析长期走势图，这比所交易的时间架构高出一个层次。如果交易日线图，则采用周线 MACD 柱状图的斜率辨识潮汐的方向。斜率是由最近两支柱状图的关系决定，如果斜率向上，代表多头居于主控地位，仅由多方进行交易。如果斜率向下，代表空头居于主控地位，仅由空方进行交易。


    在周线图中，MACD 柱状图的每个跳动都代表趋势的变动。发生在零线下方的向上跳动，它所提供的买进机会优于零线之上。同理，发生在零线上方的向下跳动，它所提供的卖出机会优于零线之下。周线的
    MACD 柱状图是三重滤网的第一层滤网，MACD 柱状图的斜率是由最近两支柱状图的关系决定。在三重滤网的第一层滤网中，交易者首先必须观察周线图，然后再分析日线图。如果周线图的趋势向上，我们仅可以由多方进行交易或在场外观望。如果周线图的趋势向下，我们仅可以由空方进行交易或在场外观望。


    当周线的 MACD 柱状图斜率向上，代表买进的讯号。当指标在零线下方翻升，买进讯号比较理想。当周线的 MACD 柱状图斜率向下，代表卖出的讯号，当指标在零线上方回挫，卖出讯号比较理想。一旦判定周线
    MACD 柱状图的趋势之后，转到日线图上寻找相同方向的交易机会。


    我们还可以采用非常简单的指标，例如，13 周价格 EMA 的斜率。基本的原理都相同，大部分的顺势指标都可以作为“三重滤网”的第一层滤网。只要你先分析周线图上的趋势，然后顺着趋势方向在日线图上进行交易。


    第一层滤网：利用顺势指标辨识周线图上的趋势，完全顺着趋势方向进行交易。


    交易者有三个选择：买进、放空或观望。“三重滤网”的第一层滤网剔除其中一个选择。在主要上升趋势中，仅可以买进或观望。在主要下降趋势中，仅可以放空或观望，你必须顺着趋势潮汐方向前进，否则不要下海。


    ## 二、第二层滤网——市场波浪


    第二层滤网是辨识逆着潮汐方向的波浪。如果周线的趋势向上，日线的跌势代表买进的机会。如果周线的趋势向下，日线的涨势代表放空的机会。


    第二层滤网是运用日线图上的摆荡指标，辨识偏离周线趋势的交易机会。摆荡指标在跌势中提供买进讯号，在涨势中提供卖出讯号。根据“三重滤网”交易系统第二层滤网的规范，仅可以采用周线趋势方向的日线交易讯号。


    第二层滤网：运用日线图上的摆荡指标，在周线的上升趋势中，利用日线的跌势寻找买进机会。在周线的下降趋势中，利用日线的涨势寻找放空机会。


    当周线趋势向上，“三重滤网”仅接受日线摆荡指标的买进讯号，忽略它们的卖出讯号。同理，当周线趋势向下，“三重滤网”仅接受日线摆荡指标的放空讯号，忽略它们的买进讯号。随机指标是“三重滤网”所适用的摆荡指标。


    随机指标的交易讯号是以超买区与超卖区为基准。如果周线的 MACD 柱状图上升而日线的随机指标跌破 30 的读数，这是超卖的买进机会。如果周线的 MACD 柱状图下降而日线的随机指标上升超过
    70 的读数，这是超买的放空机会。


    ## 三、第三层滤网——盘中突破


    在“三重滤网”交易系统中，第一层滤网是辨认周线图中的潮汐。第二层滤网是辨认日线图中逆着潮汐方向的波浪，第三层滤网是辨认顺着潮汐方向的游涡。它根据盘中的价格行为设定进场点。


    第三层滤网不需采用走势图或指标，它是在第一层与第二层滤网发出买进或放空讯号之后，用来设定进场点的技巧。在上升趋势中，第三层滤网是采用“追踪型买进停止单”，下降趋势则采用“追踪型卖出停止单”。


    如果周线的趋势向上，日线的趋势向下，利用追踪型买进停止单捕捉向上的突破。如果周线的趋势向下，日线的趋势向上，利用追踪型卖出停止单捕捉向下的突破。


    ## 表 11.1 三重滤网的小结


    | 周线趋势 | 日线趋势 | 行动 | 交易指令 |

    |---|---|---|---|

    | 上升 | 向上 | 观望 | 无 |

    | 上升 | 向下 | 做多 | 追踪型停止买单 |

    | 下降 | 向下 | 观望 | 无 |

    | 下降 | 向上 | 做空 | 追踪型停止卖单 |


    ## 四、停损


    适当的资金管理方法，是交易成功不可或缺的一环。自律严格的交易者会迅速认赔，绝不会像输家一样犹豫不决。“三重滤网”交易系统是采取非常紧密的停损。


    一旦进场买进之后，将停损设定在交易当天或前一天的低价——以较低者为准——下方一档处；一旦进场放空之后，将停损设定在交易当天或前一天的高价——以较高者为准——上方一档处。如果行情朝有利方向发展，尽快将停损调整到损益两平的价位。往后，设定停损的原则是保护
    50% 的账面获利。


    由于“三重滤网”仅顺着潮汐方向进行交易，所以需要采用紧密的停损。如果一笔交易不能立即获利，显示市场表面之下的根本情况已经发生变化，最好迅速出场。


    第一个认赔的机会，往往是最明智的认赔——让你在场外重新检讨市况。


    保守的交易者应该根据“三重滤网”交易系统的第一个讯号进场买进或放空，然后继续持有部位，直到主要趋势发生反转或被停损出场。积极的交易者可以继续采纳日线摆荡指标的每个新讯号，利用既有部位的获利部分进行加码。


    在平仓方面，部位交易者应该以第一层滤网的讯号为准，继续持有部位，直到周线趋势发生反转为止。短线交易者可以根据第二层滤网的讯号获利了结。


    总之，“三重滤网”交易系统同时采用了数种的时间架构与不同形态的指标。它采用长期走势图上的顺势指标，以及中期走势图上的短期摆荡指标，并运用特殊的进场买进或放空技巧。另外，它还采用紧密的资金管理法则。

