    # MACD 实战操盘用法研究


    ## ③长牛股的基础：两线顺向火车轨


    当 120 日均线上穿 250 日均线后，120 日均线和 250 日均线呈现顺向排列走势，即 120 日均线在上，250 日均线在下，出现多头排列所以叫顺向排列。在以后的价格走势中，股票价格在
    120 日均线之上，120 日均线与 250 日均线都呈现平稳的上涨走势，两条线近乎于平行线，这样的股票价格走势图形，叫做“两线顺向火车轨走势”。


    ## 90 周线特殊形态：周线三线开花


    周线三线开花，是以周线系统中的主要均线参数即 5 周线、20 周线和 90 周线为主，构成类似于 1250 日线系统的“三线开花”形态时，这时的周线走势形态就叫做“周线三线开花”。也就是说，20
    周线与 90 周线处于并线状态或顺向交叉状态，此时 5 周线几乎同时上穿 20 周线和 90 周线，形成了一个多头发散的均线排列组合状态。


    ## 2.4 高级均线理论介绍


    ### 一、均线的使用方法


    在技术分析中，市场成本原理非常重要，它是趋势产生的基础，市场中的趋势之所以能够维持，是因为市场成本的推动力，例如：在上升趋势里，市场成本是逐渐上升的，下降趋势里，市场成本是逐渐下移的。成本的变化导致了趋势的延续。


    均线代表了一定时期内的市场平均成本变化，本人非常看重均线，在实战中总结出一套完整的市场成本变化规律——均线理论。用于判断大趋势是很有效果的。


    内容包括：


    - 1. 均线回补。

    - 2. 均线收敛。

    - 3. 均线修复。

    - 4. 均线发散。

    - 5. 均线平行。

    - 6. 均线脉冲。

    - 7. 均线背离。

    - 8. 均线助推。

    - 9. 均线扭转。

    - 10. 均线服从。

    - 11. 均线穿越。

    - 12. 均线角度。


    首先给大家重点介绍一下均线回补和均线收敛，希望在和大家交流中得到完善和补充。


    ### （一）均线回补


    均线反映了市场在均线时期内的市场成本，例如：30日均线反映了30日内的市场平均成本。股价始终围绕均线波动，当股价偏离均线太远时，由于成本偏离，将导致股价向均线回补（回抽），在牛市里表现为上升中的回调，在熊市里表现为下跌中的反弹。葛兰威尔均线法则中涨势回踩均线不破和回踩破均线接着回到均线上，跌势回踩均线不破和回踩破均线接着回均线下，这四种买卖点就是均线回补。


    ### （二）均线收敛


    均线的状态是市场的一个重要信号，当多条均线出现收敛迹象时表明：市场的成本趋于一致，此时是市场的关键时刻，因为将会出现变盘！大盘将重新选择方向。


    当均线出现收敛时大家都能看出来，这并不重要，而重要的是：在变盘前，如何来判断变盘的方向呢？判断均线收敛后将要变盘的方向是非常重要的，他是投资成败的关键，如果判断准确，就能领先别人一步。


    判断变盘方向时，应该把握另外的两条原则：均线服从原理和均线扭转原理。


    均线服从原理是：短期均线要服从长期均线，变盘的方向将会按长期均线的方向进行，长期均线向上则向上变盘，长期均线向下则向下变盘。日线要服从周线，短期要服从长期。


    利用均线服从原理得出的结论并不是一定正确的，它只是一种最大的可能性，而且他还存在一个重要缺陷：也就是迟钝性，不能用来判断最高点和最低点，只能用来判断总体大方向。另外在实战中，市场往往会发生出人意料的逆转，此时均线服从原理就要完全失效了，而此时要利用均线扭转原理。


    均线扭转原理是指：当市场出现与均线服从原理相反的走势时表明：市场见底反转或见顶反转，此时要看扭转力度。均线服从原理具有较大的惯性，一般情况下都有效，想扭转它并不容易。在低位时多条均线收敛，你并不能知道此时是底部还是下跌中继平台，因此不能盲目进场，底部时利用均线服从原理得出的结论都是向下的，因为长期均线的方向是向下的。但当市场在低位出现连续的巨大成交量时，并向上逆转，此时就是均线的扭转原理在发生作用！


    另外，高位见顶后，当股价跌破均线后回抽无力就要止损，虽然均线还在上行，但已经发生了均线扭转，所以此时要执行纪律。


    涨势中，多条小均线下跌着汇聚去找大均线，如果找到大均线，接着都拐弯向上，这就是均线服从；如果破了大均线导致大均线拐弯向下，这就是均线扭转。


    跌势中，多条小均线反弹着汇聚去找大均线，如果找到大均线，接着都拐弯向下，这就是均线服从；如果破了大均线导致大均线拐弯向上，这就是均线扭转。


    值得注意的是：任何一种技术分析方法，都不是唯一的，更不可能绝对准确的，他们都有自身的缺陷，不能只迷信一种，应该把多种分析方法结合起来综合运用，例如：均线分析要结合型态分析和趋势线分析，如果再考虑到基本面分析，那么准确率就会大大提高，这样才能做到取长补短，优势互补。


    ## 二、均线技术兵法——均线修复


    均线在很大程度上代表市场成本，而市场成本的变化最直接的体现就是均线的运行。当牛市时，随着股价的不断上升，市场成本也随之上升，均线向上稳步运行；当市场进入熊市时，随着股价的不断下跌，市场成本也随之不断下移，此时的均线向下运行。在实际炒作中，我们会发现，股价与均线之间有着密不可分的关系，股价始终围绕均线波动，而均线的方向就是股价运行的趋势方向，这是为什么呢？解释这种现象的理论根据就是成本因素，当市场上升时，市场成本也随之上
    升，当股价在短期内上涨过快时，由于换手率不够充分，将在短期内导致市场的获利盘增加，从而产生多头了结，形成获利卖压，导致股价向成本（均线）回调。当股价在短期内下跌过快时，同样，由于市场成本并没有快速下降，导致市场的平均成本出现亏损，此时抛压减轻，并且出现空头回补，形成逢低买盘，导致股价出现反弹。股价和均线之间存在强大的吸引力，当股价远离均线时，由于成本因素将导致股价向均线回归，从而形成回调或反弹。这一现象就是“均线修复”（股价和均线之间修复乖离率），乖离率是一个非常重要的技术指标，在实战中十分重要，它很直观地反映了股价偏离均线的程度。


    股价在修复均线时，会出现两种情况：一是主动修复；二是被动修复。


    ### （一）主动修复是指当股价偏离均线太远时，出现剧烈波动，并且成交量放大，主动而且快速向均线回归，这种现象一般出现在顶部和底部时


    1. 底部的主动修复，当股价连续暴跌以后，此时出现恐慌性卖盘，股价由阴跌进入直线跳水，股价迅速远离均线，而同时整个均线系统出现发散状态，中长期均线由于跟不上股价的运行速度，导致市场在技术上产生巨大的乖离率，当恐慌性的非理性抛售结束后，市场的抛压迅速减轻，此时看空的人基本都已出局，而多头的逢低买盘开始大举介入，由于抛压减轻，因此低位买盘很轻松地就能造成股价的快速反弹，股价出现剧烈震荡，前期抛空的人手里握有大量现金，股价一旦反弹，空头惧怕踏空，也随时空翻多进场接盘，于是股价出现放量上涨，向上方均线进行主动的快速攻击，这就是均线在底部的
    例子。例如... 此时表明市场见底，至少也是短线见底。


    2. 顶部的 例子主动修复，当股价连续以后，此时出现消耗性上升，股价由缓涨进入直线，股价迅速远离中长期均线，而同时整个均线系统出现发散状态，中长期均线由于跟不上股价的上涨速度，导致市场在技术上产生巨大的乖离率，当消耗性上升结束后，市场买盘迅速减轻，此时看多的人基本都已进场，而巨大的获利盘造成空头的大举抛压，由于买盘减弱，因此高位卖盘很轻松地就能造成股价的快速下跌，股价出现剧烈震荡，前期买入的人手里握有大量股票，股价一旦在高位下跌，多头惧怕套牢，也随时多翻空离场止损，于是股价出现放量下跌，向下方的中长期均线进行主动的快速回挡，这就是均线在顶部的
    例子。此时表明市场见顶，至少也是短线见顶。


    ### （二）均线的被动修复是指当股价偏离均线以后，并没有出现主动修复，而是在原地踏步，被动地等待均线向股价靠近，这种现象一般发生在上涨或下跌的中途，具体表现为强势整理或下跌抵抗。他是市场的一种中继信号，一旦均线跟上来以后，股价仍将保持原有的上涨或下跌趋势


    1. 上升途中的被动修复，此时市场处于上升途中，股价偏离中长期均线，但由于成交量连续活跃，场外资金不断进场接盘，换手充分， 导致股价虽然偏离均线，但获利盘被源源不断的场外接盘所消化，导致股价无法深幅回调，一旦下方的均线跟上来以后，由于换手充分市场成本趋向一致，股价在消化获利盘以后再度上升。具体表现为：股价上涨后在相对高位原地踏步，回调力度不足，而买盘源源不断，这就是强市整理。


    2. 下降途中的被动修复，此时市场处于下降途中，股价偏离中长期均线，但由于买盘不足，场内筹码不断的离场抛压，导致股价虽然偏离均线，但买盘和空头回补盘被源源不断的场内卖压所消化，导致股价无法出现有力度的反弹，股价在下跌后原地踏步，一旦上方的均线压下来以后，由于换手充分市场成本重新趋向一致，股价在消化完空头回补盘以后，再度下跌。具体表现为：股价下跌后原地踏步，缺乏弹性，反弹无力，这就是下跌抵抗。


    ### （三）在实际炒作中经常会遇到均线修复现象，但是，问题的关键不在于去发现它，因为它本身就具体表现在图形上，谁都能够看到，而对于我们来说，关键问题是在于如何判断它属于哪一种修复方式，从而帮助我们判断未来市场的走势方向，这一点才是我们最需要的。判断均线的修复方式可以根据如下几个方面来判断


    - 1. 成交量因素


    上涨时的成交量连续活跃程度。注意：成交量连续活跃是判断问题的关键，如果成交量连续活跃则形成强市整理的可能性大，从而产生上升途中的被动修复，如果成交量不连续活跃的话，则可能会回调，从而形成主动修复。


    下跌时，买盘不足成交量低迷，反弹无力，则说明市场进入下跌抵抗，从而产生下跌途中的被动修复。


    - 2. 上涨或下跌速度的因素


    主动修复均线一般是出现在快速的暴跌之后。而被动修复均线一般出现在股价温和上涨或下跌时。


    - 3. 乖离率因素


    主动修复均线一般都是在产生巨大乖离率之后出现的，此时股价远远偏离了中长期均线，主升段或主跌段都已基本完成。


    被动修复均线一般都是在乖离率并不是很大的情况下产生的，此时股价虽然偏离了中长期均线，但偏离的距离有限，主跌段或主升段尚未完成。


    - 4. 均线稳定性因素


    主动修复均线一般是产生在均线大幅发散的状态下，而被动修复均线一般是产生在均线发散的程度有限时。


    ## 三、均线系统的运作过程详解


    均线的趋势转势动作的口诀是一靠、二出头、三穿越、四回踩、五拉升。一个跌势末期，趋势要想转势，股价必须先靠均线，也就是碰到均线股价拐弯向下。然后再有反弹时候刚过均线出点头，就无力站到均线上，立刻下跌，不能有效突破均线就跌下来。然后是再次反弹有效穿越均线，穿越均线后，回踩均线。均线发生支撑作用，股价拐弯向上，发动波新的拉升。跌势是类似的。下面我们看图仔细讲解。


    ![](img/e00f2195878851621153c98be41c491d_80_0.png)


    ### 图 2.17 均线修复


