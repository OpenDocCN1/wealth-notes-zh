    PTA1505 出现了隔峰底背离和隔峰顶背离。


    ### 1.4 MACD 指标的超买超卖与0线法则


    ### 1.4.1 0线的压力支撑作用与超买超卖的划分


    使用 MACD 必须注意，0 线是其多空分界线，DIFF 和 DEA 两线在 0 线以上，则市场可以看作牛市；DIFF 和 DEA 两线在 0 线以下，则市场可以看作熊市。这就是
    MACD0 线多空分界法则。


    ![](img/e00f2195878851621153c98be41c491d_24_0.png)


    图 1.17 多空市场的划分


    DIFF 和 DEA 两线离 0 线过远，则处于超买或超卖区域。如果 DIFF 和 DEA 两线在 0 线以上距离 0 线过远，MACD 处于超买领域，虽然市场为多头市场，但应该考虑多单平仓观望，谨防获利回吐下跌。


    还有 DIFF 和 DEA 两线在 0 线上距离 0 线过远形成的金叉，并不可靠，尽量不要做多，如果非要做多单，最好短多。


    然而，当 DIFF 和 DEA 两线在 0 线以上距离 0 线过远形成死叉后，接着形成金叉，这个金叉的位置离 0 线很远，后市很可能涨幅不大就开始下跌，此时的下跌形成了死叉，这种
    0 线上方距离 0 线很远的二次死叉非常可靠，后市一般都会大跌，此时多单一定要果断出场，空单可以大胆入场。即使市场不转势，后市至少也会有大幅度的回调下跌。


    如果 DIFF 和 DEA 两线在 0 线以下距离 0 线过远，MACD 处于超


    ![](img/e00f2195878851621153c98be41c491d_25_0.png)


    ## 图 1.18 0 轴之上，二次死叉做空


    卖领域，虽然市场为空头市场，但应该考虑空单平仓观望，谨慎获利回吐反弹。还有 DIFF 和 DEA 两线在 0 线下距离 0 线过远形成的死叉，并不可靠，尽量不要做空，如果非要做空单，最好短空。


    然而当 DIFF 和 DEA 两线在 0 线以下距离 0 线过远形成金叉后，接着形成死叉，这个死叉的位置离 0 线很远，后市很可能跌幅不大就开始反弹，此时的反弹形成了金叉，这种
    0 线下方距离 0 线很远的二次金叉非常可靠，后市一般都会大涨，此时空单一定要果断出场，多单可以大胆入场。即使市场趋势不转势，后市也至少有大幅度的反弹。


    ![](img/e00f2195878851621153c98be41c491d_25_1.png)


    ## 图 1.19 0 轴之下，二次金叉做多


    0 线附近的金叉死叉非常可靠。如果市场是涨势，则每次 DIFF 和 DEA 两线反弹到 0 线附近形成的死叉，开空单获利的可能性非常大。如果市场是涨势，则每次
    DIFF 和 DEA 两线回调到 0 线附近形成的金叉，开多单获利的可能性非常大。顺势单，MACD 背靠 0 线开多开空；逆势单，MACD 超买超卖区域开多开空。


    市场如果是涨势，则 0 线是 MACD 的强大支撑线，每次 DIFF 和 DEA 跌到 0 线，或略微跌破 0 线，必将受到 0 线的强大支撑，而从 0 线弹开，继续上升远离
    0 线，因为涨势的核心就是要求 DIFF 和 DEA 必须不断上升，形成一浪比一浪高的上升态势。只有确实 DIFF 和 DEA 过于远离 0 线时候，多方才不得不调整一下，形成远离
    0 线的 DIFF 和 DEA 死叉或者远离 0 线的 DIFF 和 DEA 二次死叉，市场调整一下，把 DIFF 和 DEA 调整到 0 线附近，如果 0
    线支撑继续有效，则市场开始新的上升之旅，DIFF 和 DEA 也形成新的一浪比一浪高的上升之旅。


    ![](img/e00f2195878851621153c98be41c491d_26_0.png)


    ## 图 1.20 MACD 回抽 0 轴


    市场如果是跌势，则 0 线是 MACD 的强大压力线，每次 DIFF 和 DEA 反弹到 0 线，或略涨跌破 0 线，必将受到 0 线的强大压力，而从 0
    线弹开，继续下跌远离 0 线，因为跌势的核心就是要求 DIFF 和 DEA 必须不断下跌，形成一浪比一浪低的下跌态势。只有确实 DIFF 和 DEA 过于远离
    0 线时候，空方才不得不调整一下，形成远离 0 线的 DIFF 和 DEA 金叉或者远离 0 线的 DIFF 和 DEA 二次金叉，市场调整一下，把 DIFF
    和 DEA 调整到 0 线附近，如果 0 线压力继续有效，则市场开始新


    ## MACD 实战操盘用法研究


    的下跌之旅，DIFF 和 DEA 也形成新的一浪比一浪低的下跌之旅。


    ![](img/e00f2195878851621153c98be41c491d_27_0.png)


    ## 图 1.21 下破 0 轴，MACD 回抽 0 轴后继续跌势


    上图 1.21 第一个箭头处表示出现一波大跌，随后的回抽 0 轴，没有站上 0 轴，后市继续下跌，即图中第二个箭头所指的大跌。


    到图中第二个圆圈处再次回抽 0 轴勉强稍微站上了 0 轴，但是随即跌破 0 轴，又回抽 0 轴失败，于是再次大跌，即图中的第三个箭头。


    可见精确理解 0 线的支撑压力作用，以及 DIFF 和 DEA 远离 0 线必将被 0 线吸引回找 0 线的远离，就是我们正确理解运用 MACD 的一大核心。


    ### 1.4.2 MACD 将金不金卖出法与将死不死买入法


    #### 1.4.2.1 MACD 将金不金卖出法


    MACD 指标两曲线发生金叉时股价会上升，这是常识。但是，有时 MACD 两曲线高位死叉后股价也会上升，而且有时还会创新高，这就令人感到迷惘了。MACD 两曲线高位死叉后股价为什么也会上升？我们知道，当一列火车高速运行时，刹车后要它立即停下来是不可能的，巨大的惯性会使火车继续向前冲一段路程才会停下来。MACD
    两曲线死叉发出卖出信号后股价还继续上升，如同火车惯性前冲的道理一样，是形成的上升趋势的惯性作用，是一波上升行情的最后一冲。随着股价惯性上升，高位死叉后的 DIFF
    会勾头上行与 MACD 将要金叉


    （未金叉），然后 DIFF 再勾头下行，形成“将金不金”的形态。MACD 两曲线“将金不金”形态出现，后市将会产生新一轮下跌。


    MACD 两曲线高位死叉后形成的“将金不金”形态会引发新一轮下跌，对这一走势特点，有些投资者不了解，把 MACD 两曲线死叉后股价惯性上冲，误认为是一波新的大上升行情又开始，追高买入，结果跌进了“多头陷阱”，被高位套牢。我们在实际操作中，只把
    MACD 高位死叉后的上升认作只是惯性上冲，采取快进快出的策略，才会避免跌进“多头陷阱”。DIFF“将金不金”后开始勾头下行，便要卖出，或者开空单。


    其实到处常见的 MACD“将金不金”卖出法，只不过是 DIFF 和 DEA 远离 0 线后形成的二次死叉而已，不过多头势力较弱，第二次没有形成金叉，从而也没形成二次死叉。但是如果把时间架构变小，MACD“将金不金”卖出法肯定就是
    MACD 高位二次死叉。如果日线形成 MACD“将金不金”，则 2 小时图或 1 小时图一定形成 MACD 高位二次死叉。


    作者认为最可靠的 MACD 高位二次死叉卖出法是 MACD 高位二次死叉的同时出现顶背离或将死不死，后市必将大跌。


    ![](img/e00f2195878851621153c98be41c491d_28_0.png)


    ## 图 1.22 将金不金做空


    豆油 1005 日线图，开始 MACD 出现高位三次死叉、且第二、三次死叉形成了顶背离，后市必跌。后来 MACD 形成将金不金，后市必跌。


    ## MACD 实战操盘用法研究


    特别值得注意的是，短时期内 MACD 高位死叉非常可靠，后市必跌。短时期的含义是图形中最近两次 MACD 死叉的位置距离很近，这一点的重要性必须强调，远距离顶背离则不准确，有时可靠有时不可靠，但是近距离背离死叉非常可靠。MACD
    将金不金，非常可靠的是——后市必跌。


    #### 1.4.2.2 MACD 将死不死买入法


    MACD 低位形成将死不死，也就是 MACD 在低位将要死叉但是没有死叉接着上涨，后市必然大涨，要么转势，要么至少是一个大反弹。此时一定要买入，这就是 MACD
    将死不死买入法。


    MACD 低位形成将死不死的走势，回到更小的时间架构，一定是 MACD 0 下远离 0 线的二次金叉，并且这种二次金叉往往是上升双底形式的二次金叉，后市上涨的可靠性很大。因此
    MACD 低位形成将死不死，后市一定会大涨。


    作者认为最可靠的低位二次金叉，是同时发生 MACD 近距离底背离或者将死不死，事后必然大涨。这里必须强调一下，MACD 远距离底背离有时准确有时不准确，近距离底背离必定总是准确！


    ![](img/e00f2195878851621153c98be41c491d_29_0.png)


    ## 图 1.23 将死不死做多


    澳美日线走势图，2008 年 11 月份出现 MACD 近距离顶背离，后市出现了大反弹。2009 年 2 月份出现了 MACD 将死不死，后市大涨，趋势随之转势。

