    ## 9.3 波浪理论实战解析——50 年黄金价格长期走势 波浪分析


    我们从 70 年代的黄金价格 K 线开始分析，一直分析到 2014 年，力图对布雷顿森林体系破产后这 50 年的黄金价格走势给予一个波浪理论剖析。


