    D），所以此时的快速下跌往往是短线投机高手施展抄底技术的最佳时机。随后有关该股票的利好消息才会不断在正式媒体上公布，对于庄家往往与上市公司联合操纵信息公布的方式，实际查处很难取证，目前在中国股票市场上有两类情况，一类是此涨势一直到正式媒体公布利好信息，往往股价的涨势就此改为下跌，有些投资者归纳为“见利好出货”来把握此卖出点。一类是在公布利好消息之前就已经开始下跌，公布利好后马上开始上涨，使得想买入的投资者买不上该股票，以吸引更大的跟风盘，制造更大的市场吸引力。这两类情况需要普通投资者灵活掌握，具体分析。这时该股票会成为市场热点，某些被庄家收买的股评家们也开始重点推荐，各种各样的分析报告不断在各种媒体上刊载，这时预测此股票要涨到某某价位的传言也就在市场中广泛流传，市场上股票价格继续上涨但幅度减弱，可能会创出新高，但此时已出现放量滞涨的现象，庄家往往利用媒体稳住持股的普通投资者，并吸引其他投资者来买入此股票，并借助基本面消息面的配合完成出货过程。当该买入的投资者基本买入了，庄家大仓位的货也基本出的差不多少时，买盘开始减少，而短线投机客发现股票价格不涨，遂有了卖出欲望，庄家也在卖出股票，于是股票价格开始下跌并跌穿移动平均线（出现卖点
