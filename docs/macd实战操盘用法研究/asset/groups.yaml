    # 第四章 MACD 与 RSI 的经典配合使用


    相对强弱指标 RSI 又叫力度指标，其英文全称为 “Relative Strength Index”，由威尔斯·魏尔德（Welles Wilder）所创造，是目前股市技术分析中比较常用的中短线指标。


    ## 4.1 RSI 指标的原理和计算方法


    ### 4.1.1 RSI 指标的原理


    相对强弱指标 RSI 是根据股票市场上供求关系平衡的原理，通过比较一段时期内单个股票价格的涨跌幅度或整个市场的指数的涨跌大小来分析判断市场上多空双方买卖力量的强弱程度，从而判断未来市场走势的一种技术指标。


    从它构造的原理来看，与 MACD、TRIX 等趋势类指标不同的是，RSI 指标是对单个股票或整个市场指数的基本变化趋势做出分析，而与 MACD、TRIX 等不同的是，RSI
    指标是先求出单个股票若干时刻的收盘价或整个指数若干时刻收盘指数的强弱，而不是直接对股票的收盘价或股票市场指数进行平滑处理。


    相对强弱指标 RSI 是一定期期内市场的涨幅与涨幅加上跌幅的比值。它是买卖力量在数量上和图形上的体现，投资者可根据其所反映的行情变动情况及轨迹来预测未来股价走势。在实践中，人们通常将其与移动平均线相配合使用，借以提高行情预测的准确性。


    ## 4.1.2 RSI 指标的计算方法


    相对强弱指标 RSI 的计算公式有两种。

    其一：

    假设 A 为 N 日内收盘价的正数之和，B 为 N 日内收盘价的负数之和乘以（-1）这样，A 和 B 均为正，将 A、B 代入 RSI 计算公式，则 RSI（N）=A
    ÷（A+B）×100

    其二：

    RS（相对强度）=N 日内收盘价涨数和其均值÷N 日内收盘价跌数和其均值

    RSI（相对强弱指标）=100−100÷（1+RS）

    这两个公式虽然有些不同，但计算的结果一样。

    以 14 日 RSI 指标为例，从当日算起，倒推包括当日在内的 15 个收盘价，以每一日的收盘价减去上一日的收盘价，得到 14 个数值，这些数值有正有负。这样，RSI
    指标的计算公式具体如下：

    A=14 个数字中正数之和

    B=14 个数字中负数之和乘以（-1）

    RSI（14）=A÷（A+B）×100

    式中：A 为 14 日中股价向上波动的大小

    B 为 14 日中股价向下波动的大小

    A+B 为股价总的波动大小

    RSI 的计算公式实际上就是反映了某一阶段价格上涨所产生的波动占总的波动的百分比率，百分比越大，强势越明显；百分比越小，弱势越明显。RSI 的取值介于 0～100
    之间。在计算出某一日的 RSI 值以后，可采用平滑运算法计算以后的 RSI 值，根据 RSI 值在坐标图上连成的曲线，即为 RSI 线。

    以日为计算周期为例，计算 RSI 值一般是以 5 日、10 日、14 日为一周期。另外也有以 6 日、12 日、24 日为计算周期。一般而言，若采用的周期的日数短，RSI
    指标反应可能比较敏感；日数较长，可能反应迟钝。目前，沪深股市中 RSI 所选用的基准周期为 6 日和 12 日。

    和其他指标的计算一样，由于选用的计算周期的不同，RSI 指标也包括日 RSI 指标、周 RSI 指标、月 RSI 指标、年 RSI 指标以及分钟 RSI 指标等各种类型。经常被用于股市研判的是日
    RSI 指标和周 RSI 指标。


    虽然它们计算时的取值有所不同，但基本的计算方法一样。另外，随着股市软件分析技术的发展，投资者只需掌握 RSI 形成的基本原理和计算方法，无须去计算指标的数值，更为重要的是利用
    RSI 指标去分析、研判股票行情。


    ## 4.2 RSI 的一般研判标准


    RSI 的研判主要是围绕 RSI 的取值、长期 RSI 和短期 RSI 的交叉状况及 RSI 的曲线形状等展开的。一般分析方法主要包括 RSI 取值的范围大小、RSI
    数值的超卖超买情况、长短期 RSI 线的位置及交叉等方面。


    ### 一、RSI 取值的大小


    RSI 的变动范围在 0～100 之间，强弱指标值一般分布在 20～80。如下表所示：


    | RSI 值 | 市场特征 | 投资操作 |

    | 80～100 | 极强 | 卖出 |

    | 50～80 | 强 | 买入 |

    | 20～50 | 弱 | 开空 |

    | 0～20 | 极弱 | 抢反弹 |


    这里的“极强”、“强”、“弱”、“极弱”只是一个相对的分析概念，是一个相对的区域。有的投资者也可把它们取值为 30、70 或 15、85。另外，对于所取的
    RSI 的参数的不同以及不同的股票，RSI 的取值大小的研判也会不同，在下面部分再详加介绍。


    ### 二、RSI 数值的超买超卖


    一般而言，RSI 的数值在 80 以上和 20 以下为超买超卖区的分界线。


    - 1. 当 RSI 值超过 80 时，则表示整个市场力度过强，多方力量远大于空方力量，双方力量对比悬殊，多方大胜，市场处于超买状态，后续行情有可能出现回调或转势，此时，投资者可卖出股票。如果市场是涨势，这叫做短线平多单，不可以开空；如果市场是跌势，这是短线平多单，可以开空单。


    2. 当 RSI 值低于 20 时，则表示市场上卖盘多于买盘，空方力量强于多方力量，空方大举进攻后，市场下跌的幅度过大，已处于超卖状态，股价可能出现反弹或转势，投资者可适量建仓、买入股票。如果市场是涨势，可迅速建立多单；如果市场是跌势，只能短多抢反弹，最好观望。


    3. 当 RSI 值处于 50 左右时，说明市场处于整理状态，投资者可观望。


    4. 对于超买超卖区的界定，投资者应根据市场的具体情况而定。一般市道中，RSI 数值在 80 以上就可以称为超买区，20 以下就可以称为超卖区。但有时在特殊的涨跌行情中，RSI
    的超卖超买区的划分要视具体情况而定。比如，在牛市中或对于牛股，超买区可定为 90 以上，而在熊市中或对于熊股，超卖区可定为 10 以下（对于这点是相对于参数设置小的
    RSI 而言的，如果参数设置大，则 RSI 很难达到 90 以上和 10 以下）。


    5. 市场趋势是涨势时，RSI 至少两次达到 80～100 区间；市场趋势是跌势时，RSI 至少两次达到 0～20 区间。


    ### 三、长短期 RSI 线的交叉情况


    短期 RSI 是指参数相对小的 RSI，长期 RSI 是指参数相对较长的 RSI。比如，6 日 RSI 和 12 日 RSI 中，6 日 RSI 即为短期
    RSI，12 日 RSI 即为长期 RSI。长短期 RSI 线的交叉情况可以作为我们研判行情的方法。


    - 1. 当短期 RSI>长期 RSI 时，市场则属于多头市场；

    2. 当短期 RSI<长期 RSI 时，市场则属于空头市场；

    3. 当短期 RSI 线在低位向上突破长期 RSI 线时，一般为 RIS 指标的 “黄金交叉”，为买入信号；

    4. 当短期 RSI 线在高位向下突破长期 RSI 线时，一般为 RSI 指标的 “死亡交叉”，为卖出信号。


    ## 4.3 RSI 的特殊分析方法


    ### 一、RSI 曲线的形态


    当 RSI 指标在高位盘整或低位横盘时所出现的各种形态也是判断行情、决定买卖行动的一种分析方法。


    - 1. 当 RSI 曲线在高位（50 以上）形成 M 头、三重顶、下降双顶、下降多顶等高位反转形态时，意味着股价的上升动能已经衰竭，股价有可能出现长期反转行情，投资者应及时地卖出股票。如果股价走势曲线也先后出现同样形态则更可确认，股价下跌的幅度和过程可参照
    M 头、三重顶、下降双顶、下降多顶等顶部反转形态的研判。


    - 2. 当 RSI 曲线在低位（50 以下）形成 W 底、三重底、上升双底、上升多底等低位反转形态时，意味着股价的下跌动能已经减弱，股价有可能构筑中长期底部，投资者可逢低分批建仓。如果股价走势曲线也先后出现同样形态则更可确认，股价的上涨幅度及过程可参照
    W 底、三重底、上升双底、上升多底等底部反转形态的研判。


    ![](img/e00f2195878851621153c98be41c491d_119_0.png)


