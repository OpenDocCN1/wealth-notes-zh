    ## 三、修正浪的变异型态


    常人共有 10 指和 10 趾。但平常，我们也见过 12 指的人，我们不能说他不是人，只能说他有些怪而已。修正浪有时候也会出现这种情况，这些变异的型态就像突变的染色体一样，令人厌烦。不过，没有这些变异型态的存在，波浪理论也就失去了稳固的根基。历史上不少波浪理论的追随者都纷纷提出了自己所认为的也属于修正浪一种的变异型态，乃至国内，也有人标新立异列出许多古灵精怪的型态，企图为其说法或浪型划法提供足够的证据。在我看来，当一种理论已经成为
    “标准” 之后，不要轻易去做改动。特别是他所观察的市场缺乏足够的自由竞争机制，这样往往由于取样的不准确而造成的错误，会令人对这种理论产生误解。


    下面，我们先看看几种变异型态：


    - 1. 强势三角形：通常三角型态中每一个次级浪均是依次递减（增）的，但在某些时候，特别是收缩三角形中，b 浪会突破 a 浪的始点，这样就形成了强势三角形型态（如图
    9.13）


    ![](img/e00f2195878851621153c98be41c491d_217_0.png)


    这种情况的出现，说明市道极为强劲，但也令分析师会束手无策。究竟是新一轮升势还是 b 浪反弹？的确是一件头痛的事情。


    - 2. 前置三角形：以前，我们曾经讨论过倾斜三角形的情况。它出现在第 5 浪居多，但也可以出现在 c 浪中。其内部结构为 3—3—3—3—3 的形态。现在，另一种倾斜三角形也值得我们关注。它的内部结构为
    5-3-5-3-5 的形态（如图 9.14）。


    ![](img/e00f2195878851621153c98be41c491d_218_0.png)


    这种情况下锯齿型的 A 波中最为常见。有时候，第 1 波也会出现。我认为，价格波动除了温和的平台型之外就是凶狠的锯齿型，两者之间差距太大。如果某些时候，当一组
    5 波中的第 1（或 5）个小浪走得过急，那么将会出现一组不可思议的 5 波，其幅度之大有可能动摇波浪理论的根基。


    因此，前置三角型态的出现，就是两者之间的某种平衡——虽然是 5 波下跌但也不至于跌得太多。即便如此，其后出现的 b 波仍然是属于较弱的类型，投资者不可有过高的期望。


    - 3. 变异的锯齿型：艾略特曾经指出，有一种非常态修正浪，b 波将如锯齿型中的一样，并未爬升到 a 波的始点水平，便已结束，而随后的 c 波也未跌破 a
    波的终点。如果这种型态事实上存在的话，确实是“失败 c 波”。事实上，艾略特提出这个型态是不正确的，它从根本上动摇了整个波浪理论的根基。至少以我的经验来看，小时图以上的任何价格走势至今尚未发现有这样的例子。以深沪股市为例，5
    分钟图上倒经常见到有类似的型态出现。但是如果仔细地划分，十有八九可以归到其他型态中。我希望读者不在万不得已时，不要做出这样的划分（如图 9.15）。


    ![](img/e00f2195878851621153c98be41c491d_218_1.png)


    - 4. 非常态顶部：这个极为少见的变异型态，是在特定环境下出现的。艾略特在其著作中，用了较多的笔墨去解释这个概念。他指出，如果第 5 波出现延伸，发生且终止在一个更大规模的第（5）波之内，而一个相当大型的空头市场即将到来时，则此即将到来的空头市场（修正浪），如果不是以一个相当异常的小扩张平台型态作为前导（a
