    # 第五章 MACD 与布林带的经典配合使用


    BOLL 指标又叫布林带指标，其英文全称是 “Bollinger Bands”，是用该指标的创立人（约翰·布林）的姓来命名的。BOLL 指标是研判股价运动趋势的一种中长期技术分析工具，属于趋势类指标。


    # 5.1 BOLL 指标的原理和计算方法


    # 5.1.1 BOLL 指标的原理


    BOLL 指标是美国股市分析家约翰·布林根据统计学中的标准差原理设计出来的一种非常简单实用的技术分析指标。一般而言，股价的运动总是围绕某一价值中枢（如均线、成本线等）在一定的范围内变动，布林带指标正是在上述条件的基础上，引进了
    “股价通道” 的概念，其认为股价通道的宽窄随着股价波动幅度的大小而变化，而且股价通道又具有变异性，它会随着股价的变化而自动调整。正是由于它具有灵活性、直观性和趋势性的特点，BOLL
    指标逐渐成为投资者广为应用的市场上热门指标。


    在众多技术分析指标中，BOLL 指标属于比较特殊的一类指标。绝大多数技术分析指标都是通过数量的方法构造出来的，它们本身不依赖趋势分析和形态分析，而 BOLL
    指标却与股价的形态和趋势有着密不可分的联系。BOLL 指标中的 “股价通道” 概念正是股价趋势理论的直观表现形式。BOLL 是利用 “股价通道” 来显示股价的各种价位，当股价波动很小，处于盘整时，股价通道就会变窄，这可能预示着股价的波'
  - '[PAGE 126]


    动处于暂时的平静期；当股价波动超出狭窄的股价通道的上轨时，预示着股价的异常激烈的向上波动即将开始；当股价波动超出狭窄的股价通道的下轨时，同样也预示着股价的异常激烈的向下波动将开始。


    投资者常常会遇到两种最常见的交易陷阱：一是买低陷阱，投资者在所谓的低位买进之后，股价不仅没有止跌反而不断下跌；二是卖高陷阱，股票在所谓的高点卖出后，股价却一路上涨。布林带特别运用了爱因斯坦的相对论，认为各类市场间都是互动的，市场内和市场间的各种变化都是相对性的，是不存在绝对性的，股价的高低是相对的，股价在上轨线以上或在下轨线以下只反映该股股价相对较高或较低，投资者做出投资判断前还需综合参考其他技术指标，包括价量配合、心理类指标、类比类指标和市场间的关联数据等。


    总之，BOLL 指标中的股价通道对预测未来行情的走势起着重要的参考作用，它也是布林带指标所特有的分析手段。


    # 5.1.2 BOLL 指标的计算方法


    在所有的指标计算中，BOLL 指标的计算方法是最复杂的之一，其中引进了统计学中的标准差概念，涉及到中轨线（MB）、上轨线（UP）和下轨线（DN）的计算。另外，和其他指标的计算一样，由于选用的计算周期的不同，BOLL
    指标也包括日 BOLL 指标、周 BOLL 指标、月 BOLL 指标年 BOLL 指标以及分钟 BOLL 指标等各种类型。经常被用于股市研判的是日 BOLL
    指标和周 BOLL 指标。虽然它们的计算时的取值有所不同，但基本的计算方法一样。


    以日 BOLL 指标计算为例，其计算方法如下：


    +   1. 日 BOLL 指标的计算公式

    中轨线 = N 日的移动平均线

    上轨线 = 中轨线 + 两倍的标准差

    下轨线 = 中轨线 - 两倍的标准差

    2. 日 BOLL 指标的计算过程

    （1）计算 MA

    MA = N 日内的收盘价之和 ÷ N

    （2）计算标准差 MD

    MD = 平方根 N 日的（C - MA）的两次方之和除以 N

    （3）计算 MB、UP、DN 线'
  - '[PAGE 127]


    # MACD 实战操盘用法研究


    MB=（N−1）日的 MA

    UP=MB±2×MD

    DN=MB−2×MD


    在股市分析软件中，BOLL 指标一共由四条线组成，即上轨线 UP、中轨线 MB、下轨线 DN 和价格线。其中上轨线 UP 是 UP 数值的连线，用黄色线表示；中轨线
    MB 是 MB 数值的连线，用白色线表示；下轨线 DN 是 DN 数值的连线，用紫色线表示；价格线是以 K 线表示，颜色为浅蓝色。和其它技术指标一样，在实战中，投资者不需要进行
    BOLL 指标的计算，主要是了解 BOLL 的计算方法和过程，以便更加深入地掌握 BOLL 指标的实质，为运用指标打下基础。


    # 5.2 BOLL 指标的一般研判标准


    BOLL 指标的一般研判标准主要集中在：


    +   1. BOLL 指标中的上、中、下轨线的意义


    （1）BOLL 指标中的上、中、下轨线所形成的股价通道的移动范围是不确定的，通道的上下限随着股价的上下波动而变化。在正常情况下，股价应始终处于股价通道内运行。如果股价脱离股价通道运行，则意味着行情处于极端的状态下。


    （2）在 BOLL 指标中，股价通道的上下轨是显示股价安全运行的最高价位和最低价位。上轨线、中轨线和下轨线都可以对股价的运行起到支撑作用，而上轨线和中轨线有时则会对股价的运行起到压力作用。


    （3）一般而言，当股价在布林带的中轨线上方运行时，表明股价处于强势趋势；当股价在布林带的中轨线下方运行时，表明股价处于弱势趋势。


    +   2. BOLL 指标中的上、中、下轨线之间的关系


    （1）当布林带的上、中、下轨线同时向上运行时，表明股价强势特征非常明显，股价短期内将继续上涨，投资者应坚决持股待涨或逢低买入。


    （2）当布林带的上、中、下轨线同时向下运行时，表明股价的弱势特征非常明显，股价短期内将继续下跌，投资者应坚决持币观望或逢高卖出。


    （3）当布林带的上轨线向下运行，而中轨线和下轨线却还在向上运'
