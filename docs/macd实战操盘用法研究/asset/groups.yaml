    后来，市场开始跌至点 D，而且更加恼人的事出现了。这 一轮行情跌到了点 A 处的前一个波峰之下。还记不记得，在上升趋势中，被穿越了的波峰应当对随后的调整起支撑作用。但这次下跌大大低于
    A 点——几乎达到点 B 处的 前一个反作用的最低点——是另一轮上升趋势可能出问题的警告。


    市场再次上扬至点 E，这次伴随的成交量更加萎缩，而且达不到点 C 处的前一个波峰。（至点 E 的最后一轮上扬行情常常会折回到点 D 至 C 的下跌幅度的一半至三分之二。）要继续上升趋势，则每一个最高点都必须超过前一轮上升行情的最高点。至点
    E 的上升行情无力达到点 C 处的前一个波峰，满足了新下降趋势所需的一半要求——即下降的波峰。


    此时，市场已经跌破了主要上升趋势线（线 1）——常常在点 D 处，这构成了另一个危险的信号。但是，尽管出现了所有这些警告，此时我们所知道的是这个趋势已经由上升转为横走。这也许是套现多头仓位的充分理由，但还不足以证明开始放空是对的。


