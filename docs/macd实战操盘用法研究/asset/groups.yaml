    ## 7.2.2 旗形和尖旗形


    旗形和尖旗形结构相当普遍。由于它们很相像，因此通常受到同样处理，它们往往出现在现存趋势的相同位置，并有相同的成交量和测算标准。


    旗形和尖旗形代表活跃市场中的短暂停顿。实际上，旗形和尖旗形的必要条件之一是，它们在陡直而且几乎垂直的直线运动之后。它们代表的情形是，陡直的上涨或下跌已经超越了其本身，因而市场要短暂停顿“喘一口气”，然后再沿着相同的方向疾驰。


    ![](img/e00f2195878851621153c98be41c491d_163_0.png)


    ![](img/e00f2195878851621153c98be41c491d_163_1.png)


    # 图 7.13


    旗形和尖旗形属于最可靠的持续形态，而且极少导致趋势反转。上边7.13左右两图显示了这两种形态的样子。首先，注意结构出现前的伴随巨量的陡直价格上升。还要注意，在该巩固形态形成时交易活动急剧萎缩，然后在向上突破时突然进发。


    ## 一、旗形和尖旗形的结构


    这两种形态的构造略有不同。旗形与平行四边形成矩形相像，有两条与当前趋势反向倾斜的平行趋势线。在下降趋势中，旗形会稍稍向上倾斜。


    尖旗形以两条会聚的趋势线为特征，而且更为水平。它极像小的对称三角形。在每一种形态形成的过程中，一个重要的先决条件是成交量应明显萎缩。


    ![](img/e00f2195878851621153c98be41c491d_163_2.png)


    ![](img/e00f2195878851621153c98be41c491d_163_3.png)


    # 图 7.14


    两种形态都是相对短期的，应在一至三周内完成。在下降趋势中，尖旗形和旗形的发展时间往往较短，常常不超过一或两周。在上升趋势中，两种形态均在市场突破上边趋势线时结束。市场跌破下边趋势线标志着下降趋势得到恢复。市场突破这些趋势线时应放量。通常上涨时的成交量比下跌时更重要。


    ## 二、测算推断


    两种形态的测算推断相似。旗形和尖旗形被称作在旗杆的“—半处飘扬”。旗杆就是先前陡直的上升或下降。“—半处”这个词意味着，这些小持续形态往往出现在整个运动的中点。一般来说，趋势恢复后的市场运动将复制旗杆或形态构造前的运动。


    要想更加精确，就应当从原始的突破点测量先前运动的距离。也就是市场在穿越支撑位或阻力位，或者重要趋势线时给出原先趋势信号的位置。然后，从旗形或尖旗形的突破点——即市场在上升趋势中突破上边线或在下降趋势中跌破下边线的位置——测出先前市场运动的竖直距离。


    ![](img/e00f2195878851621153c98be41c491d_164_0.png)


    # 图 7. 15


    ## 三、小结


    让我们来总结两种形态的要点：


    - 1. 它们都处于伴随巨量的几乎直线式的市场运动（称作旗杆）之后。

    - 2. 市场然后在小成交量下停顿一至三周。

    - 3. 趋势在交易活动进发时恢复。

    - 4. 两种形态都出现在市场运动的中点附近。

    - 5. 尖旗形就像小水平对称三角形。

    - 6. 旗形就像与当前趋势反向倾斜的小平行四边形。

    - 7. 两种形态在下降趋势中的发展时间较短。

    - 8. 两种形态在金融市场中都很普遍。


    ## 7. 2. 3 楔形与矩形


    就外形和形成时间而言，楔形结构与对称三角形相似。就像对称三角形那样，它以两条在顶点相交的会聚趋势线为特征。就其形成的时间而言，楔形通常持续一个月以上，但不超过三个月，这使它属于中期类型。


    楔形的与众不同之处是它明显倾斜。楔形向上或向下明显倾斜。通常，楔形如同旗形一样与当前趋势反向倾斜。因此，下降楔形看涨，而上升楔形看跌。注意在下边7.16左图中，看涨楔形在两条会聚的趋势线间下倾。在下边7.16右图的下降趋势中，会聚的趋势线无疑向上倾斜。


    ![](img/e00f2195878851621153c98be41c491d_165_0.png)


    ## 一、作为顶部反转形态或底部反转形态的楔形


    楔形经常出现在现存趋势中，因此通常形成持续形态。但楔形也可能出现在顶部或底部，发出转势的信号。但这种情况很少见。在上升趋势接近尾声时，走势图分析人士或许会观察到清晰的上升楔形。因为在上升趋势中的持续性楔形应与大趋势反向下降，所以对走势图分析人士来说这个上升楔形就成了看跌而不是看涨形态的线索。在底部，下降楔形会是熊市可能结束的警告。


    无论楔形出现在市场运动的中间还是尾部，市场分析人士总应从这句格言中得到指引：上升楔形看跌，下降楔形看涨。


    ## 二、矩形结构


    矩形结构有许多别名，但通常容易在价格走势图上识别出来。它代表了趋势的停顿，在此期间，市场在两条平行的水平线之间横走（见下边7.17两图）。


    矩形有时也称为交易区间或巩固区域。按道氏理论的说法，它称作直线。不管怎样称谓，它通常只是现有趋势中的巩固阶段，因此通常在它出现之前的市场趋势方向上结束。在预测价值方面，它也可视作与对称三角形相似，但有平坦的而不是会聚的趋势线。


    市场明显收于上边界或下边界以外表明矩形结束，并且指明了趋势的方向。不过，市场分析人士必须始终警觉矩形巩固会不会演化成反转形态。例如，在下边左图所示的上升趋势中，注意这三个波峰起初可能被看作三重顶反转形态。


    ![](img/e00f2195878851621153c98be41c491d_166_0.png)


    ## 三、成交量形态的重要性


    要观察的一条重要线索是成交量形态。因为在两个方向上的价格摆动同等广阔，所以分析人士应当密切注意哪个方向上的成交量更大。如果价升量增且价跌量减，那么该结构很可能就是上升趋势中的一种持续形态。如果价跌量增，就可视作趋势可能正在反转的警告。


    ## 四、可交易的区间内价格摆动


    有些走势图分析人士在这种形态的价格摆动中进行交易——在市场回档至价格区间的底部时买进，而反弹至价格区间的顶部时卖出。这种技法使短线交易者充分利用确定无误的价格边界，并从无趋势的市场中获利。由于仓位建在价格区间的边界，因此风险不但相对较小而且明确。如果交易区间完好如初，这种逆势交易法就很奏效。当突破的确发生时，交易者不仅可以立即从最后的亏损交易中脱身，而且可以通过顺着新趋势的方向重新交易来倒转以前的仓位。振荡量指标在横向交易的市场中尤为有用，但是一旦由于第十章中讨论的原因发生突破，其效用就会减少。


    另一些交易者认为矩形是持续形态，因此在上升趋势中价格带的下边界建多仓，或在下降趋势中的价格区间的上边界附近建空仓。另一些投资者避开所有这种无趋势的市场，并等到明确的突破出现后才投入他们的资金。大多数趋势跟随系统在市场横走及趋势不明的时候表现拙劣。


    ## 五、其他相似处和差异处


    在持续时间方面，矩形通常属于一至三个月的类别，这与三角形和楔形类似。矩形的成交量形态与其他持续形态有所不同，这是因为宽阔的价格摆动阻止了在其他持续形态中见到的交易活动萎缩现象。


    在矩形中最常用的测算技法以价格区间的高度为基础。从顶至底测量出交易区间的高度，然后从突破点投射出这段垂直距离。这种方法类似于前面提到的其他各种垂直测算技法，也以市场波动性为基础。当我们涉及OX图分析中计数时，将更多地讨论水平价格测算的问题。


    到目前为止讲过的突破时的成交量以及反抽的可能性在矩形中也很有效。由于在矩形中上边界和下边界是水平的，而且明确可见，因此支撑位和阻力位也更加明显。这就意味着，在向上突破时，原先价格带的上边线现在应为任何抛售提供稳固的支撑。而在下跌趋势中的向下突破发生后，交易区间的底边（先前的支撑区域）现在应对任何反弹的努力构成坚实的“天花板”。


