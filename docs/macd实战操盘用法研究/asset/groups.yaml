    G），解套盘，获利盘，庄家手中的余货等纷纷涌出，此时股票由于大多是散户持有，于是会出现散户之间的多杀多，所以股票价格再次下跌，由于低位承接盘很少又没有主力护盘，而杀跌动能却很大，所以股票价格呈现快速暴跌状况或者长期的绵绵阴跌不止。这正是股价下跌杀伤力最大的一段。由于股票价格跌幅大，则容易产生反弹，有时出逃的庄家往往会在低位做一把快进快出的反弹行情，此时移动平均线仍然处于下跌趋势中，所以此时投资者应以反弹行情对待，逢高坚决出货（出现卖点
    H）。


    ## MACD 实战操盘用法研究


    ## （三）葛兰威尔法则中八个买卖点的评价


    对于葛兰威尔移动平均线八大买卖法则中的八个买卖点我们大家现在都已经了解了，在此还有必要对这八个买卖点进行一下综合评价，以利于我们在实战中掌握。


    首先分析四个买入点：A 点、B 点、D 点、F 点。在这四个点中，A 点的股票价位最低，是股票行情刚启动的点位，是最安全的，获利最大的点位，一旦确认后势走势则持有的股票获利惊人。但
    A 点在具体实践中的识别与操作并不容易把握，有太多的虚假信号，有时投资者介入后会因为只是一段反弹行情，没有及时获利了结而被套。B 点是最容易确认的买点，但股票价位已经高于
    A 点，但由于 B 点容易辨认，而且随后往往是升势最凌厉的一段行情，所以 B 点在安全性，可辨认性和可靠性等方面都是最佳的，也是实践中最值得普通投资者努力学习并掌握的，在后面我们将介绍实战中
    B 点的识别与操作。


    D 点是上升途中出现较深幅回档时的一个买入点，有时会击穿移动平均线，此点的股票价格已经比较高了，而且往往只能确定一个比较宽幅的价格区域。此时股票价格的大部分升势已经完成，随后是否能再创新高也是未知数，所以面对的未来走势可能是一拨上升行情也可能是反弹行情。所以此买点的风险性比前两点要大。需要投资者具有一定的实战经验，方可运用得当。


    F 点是股价下降途中遇到买力而产生反弹行情的一个买点，此买点的掌握是最难的，也是最危险的买点，笔者在此提醒投资者如果您没有较长时间的经验积累，不要轻易尝试做
    F 点的反弹买入，要做也只能以较少的资金搏反弹，以利积累经验。因为有时股票价格下跌并不产生明显的反弹，由于反弹的空间与买入点位的不确定性因素太多，因此实际获得的可操作利润空间并不大，所以在此点介入股票要特别小心。


    综合以上四个买点，从安全性、可辨别性、可靠性、资金的投入量等方面综合评价上来分析，我们得出最优的买入点是 B 点，按优排序的结果是 B＞A＞D＞F。下面我们分析四个卖出点：C
    点、E 点、G 点、H 点。C 点是股票在大幅飙升过程中的卖出点，此点不易把握，由于往往是股票价格快速行进过程中形成的卖点，容易出现卖出股票后，股价继续上涨而错失后续行情的风险。但如果持有的股票买入点不错，也获得了大段升势而获利了结，即使错失一部分行情也是可圈可点的。对于此点的实际把握是经验越多则越好把握。


    E 点是股票经过大幅上涨后，在高位盘整时，往往利好不断，似乎股票又要展开新的一轮升势，但此时却出现股票价格不涨反跌，并有效击破移动平均线的情况，此点发出卖出信号的可靠性较高，投资者遇到这种情况下，应该不去理会基本面的情况（往往造成虚假误导），仅依照技术分析坚决卖出股票，事后证明这样的卖出操作行为的正确率是较高的。但此点在实际操作中也不易把握，由于股票价格往往下跌时的速度快于上涨时的速度，所以实际操作中要么一犹豫就会错过好几个价位，要么被庄家洗盘洗出局。因此，在实践中该点的选择除了移动平均线来判断，还要应用图形的颈线和其他一些参考技术指标等综合来判断。


    G 点是抢反弹行情的卖出点，或是被套牢的股票的斩仓止损卖出点，辨别此点需要有综合的分析，要考虑到成交量、大势、基本面等因素，它是比较好辨别的一个卖出点。


    H 点不易明显识别。因为这段行情的特征往往与牛市的第一浪比较接近，辨认此点主要考虑的因素是移动平均线仍然处于下降状态，反弹的升势快速，在长期走势中看，筑底的时间很短，这样综合考虑便可以识别出此卖出点，实践中此卖出点的价位区域较宽，投资者往往不能寻找到最佳的卖出价位与时机。


    综合以上四个卖出点，从可辨别、可靠性等方面综合评价上来分析，我们得出最优的卖出点是 E 点，按优排序的结果是 E>C>G>H。

    上边的卖出点，是做股票的平仓点。如果对做期货而言，做空的话，C 点做的是逆势单，所以最不宜开空。最保险的开空是跌势出来后回踩不破均线，所以 G 点开空最好。其次是
    H 点，这时跌势已经很明显，只要均线方向向下，在 H 点开空把握很大。E 点不宜把握，主要原因一般有长期明显底部，而顶部却不一定明显，因此 E 点把握的难度远远大于开多单时的
    A 点，但是把握好了获利巨大。最优的开空单顺序是 G>H>E>C。


    ## 2.3 三线开花均线理论介绍


    ### 1. 20 日均线（或 30 日均线）——月均线


    20 日均线的技术含义：股价中期走势的生命线。


    20 均线在低位拐弯向上，往往意味着股票价格走势是中线上升行情。20 日均线在高位拐弯向下，往往意味这是中期调整趋势，投资者对此股票不介入或寻机出局。


    #### 20 日均线的作用：

    - (1) 确定中期趋势。20 日均线低位拐弯，中期趋势的跟踪线。

    - (2) 确定买入点。股票价格低位放量上涨突破 20 日均线，缩量回跌调整到 20 日均线时的买入点。

    - (3) 确定卖点。大多数情况下（除急庄暴涨的股外）在股票价格远离 20 日均线 20%～30%之间获利了结是个不错的卖点。

    - (4) 确定止损点。大幅上涨后 20 日均线拐弯向下时，应短期止损离场出局或不介入。20 日均线的高位拐弯向下，是一个要重要的止损位（或暂不介入）；而股价向上远离
    20 日均线 20%以上，应该要学会果断止赚减仓。


    ### 2. 120 日均线——半年线


    120 日均线的技术含义：可称为股票价格走势的脊梁线、灵魂线。由于 120 日均线时间周期长，趋势一旦形成就不易改变，所以主力庄家不易制造骗线。


    #### 120 日均线的作用：

    - (1) 助涨作用。当 120 日均线处于上涨状态时，有助涨作用，股价会沿着 120 日均线上涨。

    - (2) 重压作用。当 120 日均线处于下降趋势时，120 日均线对股票价格走势具有重压作用，股价往往涨到 120 日均线，反弹结束。120 日均线下降斜率如果比较陡，则对股票价格走势的压力更加明显，即使股票价格走势出现快速上涨，但随后往往会出现更为快速下跌的走势。

    - (3) 确定买入时机。利用 120 日均线处于上涨趋势时，对股票价格走势具有的助涨作用，来确定买点。即以 120 日均线作为支撑线，当股价回跌到 120
    日附近时买入。

    - (4) 中长期股价趋势判别。120 日均线由于变动缓慢，趋势一旦形成或改变，不论是上涨还是下跌都要持续一段时间。所以，投资者可以从 120 日均线的变动中，把握中长线的股价运动趋势。

    - (5) 市场成本及趋势指导作用。如许多庄家主力在操盘时，也按 120 日均线为参考线；庄家在洗盘打压价格时往往也在 120 日均线止步；长期平台整理时也往往是在
    120 日均线上涨上来后进行向上突破等。


    ### 3. 250 日均线——年线


    250 日均线的技术含义：股票价格走势的牛熊分界线，实际操作中，250 日均线经常被用在判别股票走势的牛熊转换。


    250 日均线的趋势方向和股票价格升破或跌破 250 日均线，有着重要的技术分析意义。如果市场中有一大批股票出现这样的走势，说明就要有一波行情了，或者市场中就要出现新的炒作题材了。


    250 日均线的作用：


    250 日均线主要是支撑作用和压力作用。


    250 日均线的作用与 120 日均线的作用非常类似。在实际操作中，中大盘股的走势往往于 250 均线的作用大，于 120 日均线的作用小，并且 250 日均线和
    120 均线共同使用则作用与效果更加明显。


    支撑作用：即处于上升状态的 250 日均线对股价有支撑作用，股价缩量回调到 250 日均线往往会结束调整，重新开始上涨。


    压力作用：即处于下降状态的 250 日均线对股价有压力作用，股价反弹到年线附近是个强阻力区域，突破这种压力需要成交量和时间才可确认。因此在 250 日均线走平或向上之前，都不能介入，否则会屡买屡套，损失了金钱和时间。


    250 日均线几乎不能单独使用，而主要是和 20 日、120 日均线配合使用，主要起辅助参考作用。


    ## 4. 20 日均线金叉 120 日均线的几种形态


    #### （1）回头望月

    技术走势形态特征：

    ①股票价格走势在升破 20 日均线后，先有一波上涨行情，成交量相对前期盘整走势明显放大，并突破 120 日均线压力，在 120 日线上盘整。

    ②随着股价的盘整，20 日均线从 120 日均线下方向上移动，来试探穿越的可靠性，当 20 日均线从下向上穿越 120 日均线形成金叉买入点时，股票价格走势缩量回落也宣告结束，开始形成上涨的转点。

    ③随后股票成交量放大，股票价格走势开始形成大幅的上涨行情。


    如何确认回头望月的金叉穿越是否有效。需要看随后一两个交易日是否有成交量放大的配合，若叉后有量，则回头望月形态成立。随后的操作可用 20 日均线操作法则来进行，或转到
    5 日、10 日、30 日均线系统来操作。


    #### （2）快马加鞭

    其技术走势形态特征，与回头望月技术走势相比：

    相同：都是 20 日均线上穿 120 日均线，120 日均线处于走平盘升或微跌状态，股票价格前期已经穿越了 120 日均线的压制，处于盘整的走势，此时 20
    日均线正在穿越 120 日均线。

    不同：在快马加鞭的技术走势中，股价升破 120 日均线的压力后，往往并不回跌调整，多是高位横向整理，等待着 20 日均线穿越 120 均线，而在 20 日均线穿越
    120 均线的叉点日，出现的是放量拉升的状态。此走势就像已经启动的快马受到鞭子的刺激，而飞奔起来。


    快马加鞭这种技术走势，往往出现在市场的龙头股上，出现有市场大行情的第一波领涨的股票中，也可经常出现在一些强势股上。


    #### （3）顺水推舟

    技术走势形态特征：

    当 20 日均线上穿越 120 日均线，形成金叉穿越时，其股价形态，并不像快马加鞭那样迫不及待地上涨，也不像回头望月走势那样有明显的回跌确认走势，而是顺其自然地让
    20 日均线与 120 均线形成金叉穿越，在穿越后成交量往往出现温和放大，股票价格走势也不像前两种形态那样出现快速上涨。


    顺水推舟的走势形态，给出的买入信号可操作的时间长，股票价位较低，买入的股价安全性较好。但这样的买点需要有一定的耐性，顺水推舟的技术形态在随后的走势中变数较多，有些会出现失败的走势，应引起注意。


    ①如何判断顺水推舟形态的成立？

    要依靠股价和成交量的关系，尤其是有没有叉后量出现。


    ②如何操作顺水推舟技术形态的股票？

    顺水推舟形成后投资者的参考线就是 120 日均线破不破，20 日均线的走势方向是投资者的方向。


    顺水推舟这种技术走势往往是比较稳健的庄家主力在操盘，其手法温和，用各种操盘手法进行洗盘并且将市场的成本不断地推高，以利于其高位出货。对此投资者要有耐心与智慧才能获得好的收益。


    顺水推舟形态，价格不像快马加鞭那样追不及待地上升，也不像回头望月走势那样有明显的回跌确认走势，而是顺其自然地让 MA（20）与 MA（120）形成金叉穿越。


    顺水推舟的好处是给我们足够长的低价位区域买入，坏处是它后市不如快马加鞭和回头望月强势，是相对较弱的一种技术心态。


    ## 5. 三线开花的具体形态


    三线开花的具体形态有并线三线开花、顺向三线开花和逆向三线开花。这三种技术走势形态都可以十分有效地预测股票价格走势。


    #### (1) 并线三线开花

    其形态一旦成立有较大的获利空间，是大黑马的摇篮。

    并线三线开花，是指在三线开花的初始点，120 日均线与 250 日均线是处于极度接近的平行状态，此时 20 日均线从下向上穿越这两条均线的技术走势，形成均线的金叉穿越。

    穿越后如果股票价格走势出现大幅放量的上涨行情，就预示并线三线开花走势成立，并将预示均线系统将要 “开大花”，其隐含的技术意义就是股票价格将要大幅上涨。

    其后，如果 20 日均线出现高位拐弯，是提示我们中线趋势向淡，应该出局了结，这就是 20 日均线发出的卖出信号。


    #### (2) 顺向三线开花

    其形态一旦成立也有较大的获利空间。


    顺向三线开花，是指在三线开花的初始点，120 日均线与 250 日均线是顺向交叉的状态，即 120 日均线从下向上穿越 250 日均线，形成两条长期均线的黄金交叉，此时
    20 日均线从下向上穿越这两条均线交叉点的技术走势形态。（交叉点即买入信号）

    形成顺向三线开花的技术走势，并且在穿越的过程中成交量有效放大，就预示顺向三线开花走势成立。虽然我们无法买在股票启动的最低点，但借助“顺向三线开花”的技术走势，我们完全可以在交叉点的当日发现它的趋势，只要我们顺势而为，获利是不难的。


    #### （3）逆向三线开花

    一旦形态成立，预示股票将要走牛。

    逆向三线开花，是指在三线开花的初始点，120 日均线与 250 日均线形成死亡交叉，即 120 日均线下穿 250 日均线，此时 20 日均线由下向上穿越这个交叉点的技术走势形态。

    形成逆向三线开花形态，预示股票将要走牛，但在 20 日均线穿越 120 日均线和 250 日线交叉点时，应有成交量有效放大的支持，这样逆向三线开花形态才成立。


    ## 6. 三线开花总结


    三线开花融合了前面的“回头望月”、“快马加鞭”、“顺水推舟”的技术分析方法与实战操作方法。它比较常见，在实际应用中应注意：

    （1）从三种预测股票价格走势的技术形态的潜力比较看：

    最大的，要数“并线三线开花”，往往都是大黑马的摇篮。

    其次是，“顺向三线开花”，也是获利较大的一种技术形态。

    再次是，“逆向三线开花”。“逆向三线开花”与“并向三线开花”和“顺向三线开花”相比，其走势相对较弱，但也不排除个别急升行情。“逆向三线开花”有一个好处是：买点出现时，是一段买入时机，投资者在买入时往往可以从容地买到较低的价位。这是“顺向三线开花”和“并线三线开花”所不及的。

    （2）灵活应用，不拘泥于条件的严格满足。

    由于股票分析并不是精密科学，我们在分析“三线开花”的技术走势形态中，并不是要求严格在 120 日均线和 250 均线形成交叉点的同时，20 日均线正好穿越这个交叉点，其实在
    120 日均线和 250 均线形成交叉点的前后一段时间内（比如 20 个交易日内），20 日均线由下向上形成黄金穿越都是可以的。在这个分析过程中，投资者更应该注重的是：趋势的分析与判断，而并不要过分纠缠于细微之处是否严格满足，这也是投资者要注意的。

    （3）三线开花这种技术形态只是告诉投资者，从穿越点起股票就确立了涨势，但涨多少则是“三线开花”这种技术走势无法分析的，必须要结合其他的分析方法来做后期判断。

    （4）三线开花会有各种各样的形态，虽然我们在其“开花”的过程中并不知道“它”的品种，但我们能从其成交量的变化上判断“花”的大小，我们只要买入了“花柄”的价格，则“开花”后的“果实”不就理所当然是我们的了吗？

    （5）并不是所有的金叉点都可买入股票。


    上面介绍的“回头望月”、“快马加鞭”、“顺水推舟”和“三线开花”都是同样的道理即金叉点买入股票。但不是所有的这类 20 日均线与 120 日均线或 250
    日均线形成的金叉穿越的叉点都发出的是买入信号呢？是不是都可以买入？仍然存在技术骗线。

    特殊的均线穿越金叉点不是买点，反而是卖点的走势形态。


    ①这种假金叉穿越点的特点

    首先，是行情突然暴发，形成暴涨行情，当 20 日均线上穿 120 日均线和 250 日均线即形成金叉穿越时，股价也到了最高位。

    其次，其前期的走势形态既不是“回头望月”也不是“顺水推舟”和“快马加鞭”，若说是“快马加鞭”则没有突破大均线后的盘整走势形态，所以这是一种特殊形态。

    最后，这种金叉穿越形态中，有时 20 日均线并不是顺其自然的与大均线形成金叉穿越，而是被强行的“提带”与大均线来形成“金叉穿越”。由于这种均线金叉穿越使改变的均线形态变成了目的，既然目的已经达到，也就失去了目标，因此这种金叉穿越点就不是买点反而是卖点了。


    ②假金叉穿越点形成的原因

    - 主力没有完全准备好，仓促应战的结果；

    - 由于各种原因，主力放弃了操盘计划，只想拉高出货；

    - 操盘主力经验不足，想尽快营造转势形态，快速拉高股价反遭市场巨大抛压，不得不收剑；

    - 由于市场中许多主力采用类似“三线开花”均线系统法则的操盘思路，所以想制造技术骗线。

