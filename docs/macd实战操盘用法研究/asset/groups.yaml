    # 序 言


    我是一名“老期货”，炒期货八年来，我犯了无数的错误，亏了很多钱，很多常见的错误，是很多年才能真正改掉。为何明知的错误就改不掉呢？根本的原因还是功力不到那个层次。例如逆势交易的错误，我是在第八年上，才逐渐改掉的。单单“顺势”两个字，想要真做到，就需要八年的时间，期货交易真不是件容易的事。我也炒股，炒股每年都是赚钱的，还没有哪年亏过钱，但是炒股上，顺势两个字，也不是容易做到的。2014年大牛市中，不停地恐高空仓等待，其实就是没有做到顺势。交易稳定盈利的根本就是顺势。


    作为一名八年的“老期货”，我说一说我这八年的进阶过程，给读者以分享。达不到我的水平的，可以以此定位自己的交易水平到了什么层次了；超过我的水平的，可以以此回想自己当年是如何经历这些事的。


    第一年：不知道什么是趋势，死扛亏损单，频繁交易。巨亏或者爆仓，也不明白是如何亏这么惨。总结出的经验是一定要学会止损，止损怎么这么难，就是做不到啊。


    第二年：终于学会了慢速止损。根据某个指标或某条线止损，价格真到止损条件时，也不舍得止损，但是再多亏一点，就止损了，终于控制住了巨大损失。虽然大多数单子能慢止损，但是经常有单子选择不止损死扛，单笔巨大亏损。


    第三年：开始研究势，搞明白自己应该顺哪个势。我第三年是决定顺60分钟的势，按60分钟MA60的方向作为我的势，价格突破MA60并回踩成功，就是转势了。这一年学会了从大分钟看势，从小分钟逆势'
  - '[PAGE 4]


    # MACD 实战操盘用法研究


    进场。偶尔还有死扛单的时候。


    第四年：经过三年多技术学习，这一年开始形成了比较准确的交易系统。前三年是在试用不同的交易方法和交易理论，试用过程伴随着不断亏损的代价，到这一年已经定下了交易方法。这年是这个方法在不同时间架构试用，不知道自己适合操作哪个分钟的图。有时觉得自己适合炒周线，有时觉得自己适合5分钟，在各个周期不断试错。


    第五年：交易周期初步定在下，对多数期货人而言，这一年定下的操作周期基本都是15～60分钟。多数是30分钟或60分钟。


    第六年：感觉自己距离成功只差一步之遥，有些期货人已经有过赚钱经历，甚至年度赚钱经历了，甚至交易回本了。


    第七年：第四年到第六年总体上赚钱回本或者大赚，到今年重新走入亏损，因为赚钱的自信，导致了自己操盘资金迅速增长，自己受不了这么大的资金，自己具备稳定盈利的能力，实盘也必然稳定亏损。这个道理就是我们具有在20厘米高走钢丝的稳定盈利，但是100米的钢丝，同样的技术和方法，再走钢丝，必然稳定失败。


    第八年：回头仔细回味，还是周线大势浩浩荡荡，第一次明白了什么势，第一次真正明白了逆势的可怕，并决定真正顺势交易。明白要想期货交易稳定盈利，必须从其他方面提高自己的修养，开阔自己的心胸，找到自己的信仰，开始让自己变得更好、更包容。只有如此，才能得到长期交易自信，心才能坦然，才能真正成为高手。


    能稳定盈利的交易者，比例大约是5%，最终赚大钱的交易者大约是0.001%。根本的原因还是综合素质。成功的交易者，极少数是在5～8年开始成功，8～12年开始赚大钱；多数是在8～10年开始成功；10～15年开始赚大钱。对多数交易者而言，八年是一个坎，连续潜心交易八年，就处在了量变产生阶段性质变的临界点上了。最终的成功，无一例外是脚踏实地，勤劳敬业，自信乐观，坚持不懈，是人类共同的这些真正美德造就的。最后，成功就等于美德。期货最后的成功，就是集人类所有成功人士的共同诸多优秀品德于一身，才能成功。还没有成功的日子里，是因为自己还有一些优秀品德不具备，所以你才会不断尝受到失败的痛苦滋味，让你觉悟，让你放弃坏的品德，培养出这些优秀品德。


    我做炒股、炒期货的根本原因和内在动力是什么呢？根源就是我是非常正直的人，想通过自己的智慧理财，即君子爱财取之以道。'
  - '[PAGE 5]


    将来我理财成功了，我会干什么呢？尽自己的力量，著书立说。所谓修身齐家治国平天下，作为一个文人，我们应该负起儒家文化赋予我们的历史责任，这也是我们作为文人最应该干的事。


    我觉得炒股、炒期货，最终得有一个责任感，尤其是民族责任感，才能成功。这可能就是炒股炒期货的最高修养领域——交易哲学吧。


    本书的部分理论内容和全部案例是由刘成刚撰写和论述，部分理论内容由孙学辉撰写，全书经过作者多年的理论和实践积累，并且进行了多次案例更新成型，最后作者对全书进行了细致的修改和润色。


    这本书集合了传统技术分析之经典和缋论的主要经典结论，许多技术是笔者多年交易的独创性总结，对股民和期民，相信会有非常好的借鉴作用。'
