    #### 七、收盘价的使用与横线的存在


    道只依据收盘价。他相信，平均指数必须收于前一个波峰之上或前一个波谷之下才有意义。道不认为日内的突破是有效的。


    当交易者提到平均指数中的横线时，他们是在指有时出现在走势图中的水平形态。这些横向的交易区间通常在调整阶段扮演重要的角色，而且通常被称为现固。在更现代的名词中，我们可能称这种横向形态为“矩形”。


    #### 八、对道氏理论的某些批评


    多年来，道氏理论在辨别大牛市和大熊市上非常有效，但也难逃批评。一般来说，道氏理论在发出信号之前，已经错过了一段市场运动的20%至25%。许多交易者嫌这太迟了。道氏理论的买入信号通常出现在¬一轮上升趋势的第二阶段，因为价格突破了前一个次要高峰。顺便说一句，这是大多数趋势跟随技术分析系统开始认出并参与现存趋势的地方。


    为了回应这种批评，交易者必须记住道从未要预测趋势；相反他设法认清大牛市或大熊市的来临，然后抓住重要市场运动中的一大段。记录表明道氏理论的这种功能非常强。从1920年到1975年，道氏理论信号抓住了工业股平均指数和运输股平均指数的运动中的68%以及标准普尔500综合指数的67%。那些批评道氏理论未能抓住实际市场顶部和底部的人缺乏对趋势跟随基本理论的根本理解。


    #### 九、作为经济指标的股市


    显然，道从未打算用他的理论预测股市的走向。他认为，理论的真正价值是用股市走向作为企业总体环境的气压读数。我们只能对道的眼力和天赋赞叹不已。除了阐明今天的价格预测方法论中的许多问题之外，他曾是把股市平均指数作为先行经济指标的先驱之一。


    #### 十、应用于期货交易的道氏理论


    道的工作是深思股票平均指数的行为。尽管原先工作的大部分在期货市场中有重要的应用，但是股票和期货交易仍存在着一些重要的差别。首先，道假定，大多数投资者只跟随大趋势，而且只把短期调整用来选择市场时机。道认为小趋势或短期趋势无足轻重。显然，在大多数交易者按中期趋势而不是主要趋势操作的期货交易中，情况并非如此。这些交易者必须为选择市场时机多加关注小幅的市场摆动。如果一个期货交易者指望中级上升趋势持续几个月，那么他或她就必须寻找短期回档发出买入信号。在中级下降趋势中，交易者会利用小反弹发出的卖空信号。因此，小趋势在期货交易中变得极为重要。


    #### 十一、交易道氏平均指数的新途径


    在道琼斯工业股平均指数存在的头一百年中，它只能作为一种市场指标。1997年10月6日，当古老的道氏平均指数开始有期货及期权交易时，一切都变了。芝加哥交易所发起了基于道琼斯工业股平均指数的期货合约，同时道琼斯工业股平均指数的期权，代码：DJX，也开始在芝加哥期权交易所进行交易。此外，针对道琼斯运输股平均指数的期权，代码：DJTA，以及道琼斯公用事业股指数的期权，代码：DJUA，也出现了。1998年1月，美国股票交易所开始交易钻石信托基金，这是一种模拟30种道琼斯工业股指数的单位投资信托基金。此外，还有两种以30种道琼斯工业股指数为基准的共同基金。在这些指数创立一个世纪之后，道先生会很高兴地知道可以交易他的道氏平均指数，而且实际上是把他的道氏理论付诸实践。


    #### 十二、趋势的定义


    对于市场分析的技术分析手段来说，趋势的概念是必不可少的。走势图分析人士使用的全部工具——支撑位和阻力位、价格形态、移动平均线、趋势线等等——的唯一目的就是帮助衡量市场趋势，从而参与到趋势中去。我们经常可以听到这样熟悉的话，像“永远顺势交易”、“永不逆势而为”或者“趋势是你的朋友”。所以，让我们花点时间定义什么是趋势，并将其分成几类。


    ![](img/e00f2195878851621153c98be41c491d_237_0.png)


    图 10.5


    ![](img/e00f2195878851621153c98be41c491d_237_1.png)


    图 10.6


    从一般意义上说，趋势就是市场的走向，它沿哪条途径运动。但是我们需要更加精确的定义以研判趋势。首先，市场一般不会朝哪个方向直线运动。市场运动以一系列锯齿线为特征。这些锯齿线好似一系列前起后继的波浪，有相当明显的波峰和波谷。正是这些波峰和波谷的走向构成了市场趋势。这些波峰和波谷是上升、下降还是横走告诉了我们市场的趋势。上升趋势被定义为一系列相继上升的波峰和波谷；下降趋势正好相反，是一系列相继下降的波峰和波谷；水平的波峰和波谷确定了一种横走的价格趋势。


    #### 十三、趋势有三种方向


    我们已经提到的上升、下降、横走趋势有充分的依据。大多数人往往认为市场总是要么上升，要么下降。但事实上，市场有三个运动方向——上升、下降，以及横走。弄清这种区别非常重要，因为保守估计，至少有三分之一的时间，价格在一种平坦的、水平的形态中运动，这种形态称为交易区间。这种横走行为反映出价格水平的一段均衡时间，此处供求双方的力量处于一种相对平衡的状态。如果回忆一下，就会记起道氏理论称此类形态为一条横线。尽管我们已经定义平坦的市场有一种横走的趋势，但称此为无趋势更加常见。大多数技术工具和系统在本质上都是趋势跟随型的，这意味着它们主要为正在上升的或下降的市场而设计。当市场进入这种持平的或者说“无趋势”的阶段时，它们通常表现逊劣，甚至根本不起作用。正是这种横向市场运动时期，技术派交易者经历着他们最大的挫折，而采用交易系统的人也蒙受着最大的净值损失。趋势跟随系统，根据其定义，需要有趋势可循，以施展功用。所以，这里的失效不在于系统。相反，这种失效在于交易者，他们试图将为趋势运动的市场设计的系统运用到无趋势的市场环境之中。


    交易者面对三种选择——买进，做多、卖出，做空，或者无所事事，观望。如果市场正在上升，那么买进策略更可取。如果市场正在下降，那么第二种方法才是正确的。然而，如果市场正在横向运动，那么第三个选择——置身市场之外——通常最为明智。


    #### 十四、趋势有三种类型


    除了有三种方向之外，趋势通常还可细分为三种类型。这三种类型是主要趋势、次要趋势和短期趋势。实际上，从只有几分钟和数小时的极短期趋势到持续50年或100年的超长期趋势，几乎存在无数个相互作用的趋势。然而，大多数技术分析人士将趋势的分类限于这三种。但是，对于不同的分析人士如何定义每一个趋势就有些含糊了。


    例如，道氏理论把主要趋势归为实际上长于一年的趋势。由于期货交易者比股票投资者在更短的时间维中操作，因此作者倾向于在期货市场上把主要趋势缩短为任何长于六个月的趋势。道把中期趋势，或称次要趋势，定义为延续三个星期至数月的趋势，这在期货市场中也较为合适。短期趋势通常被定义为短于两或三个星期的趋势。


    每个趋势都成了其下一个更大趋势的一个组成部分。例如，中期趋势可能是主要趋势中的一段调整。在长期上升趋势中，市场会停下来调整数月，然后重拾升势。次级趋势本身由更短的波浪构成，这些浪被认为
    是短期的下沉和反弹。这个主题出现了许多次——每个趋势都是其下一个更大趋势的组成部分，而它本身也是由更小的趋势构成的，见下图。


    ![](img/e00f2195878851621153c98be41c491d_239_0.png)


    # 图 10.7


    在上图10.7中，正如上升的波峰和波谷，点1、2、3和4反映的那样，主要趋势向上。调整阶段2—3代表主要趋势中的一次中级调整。但要注意，浪2—3也可细分成三个更小的浪A、B和C。在点C处，分析人士会说主要趋势仍然向上，但中级和短期趋势向下。在点4处，所有三个趋势均向上。理解不同级别趋势间的区别非常重要。如果有人问一个给定市场中的趋势怎样，那么在你知道此人咨询哪个趋势之前即使能够做出回答也是很难的。你也许不得不按照前面讨论的定义三种不同趋势类型的办法来回答。


    由于不同交易者对趋势的解释，因此产生了相当多的误解。对长线仓位的交易者来说，几天至几周的价格行为也许毫无意义。而对日内交易者来说，两或三天的上涨可能会构成一轮主要上升趋势。所以，弄清趋势的不同级别，以及保证所有参与交易的人都在谈论同一个趋势尤为重要。


    一般而言，大多数趋势跟随法专注于可能持续数月的次要趋势。短期趋势主要用来选择市场时机。在中级上升趋势中，短期回调可以用来建立多头仓位。


    #### 十五、支撑和阻力


    在前面对趋势的讨论中曾说过，价格以一系列波峰和波谷运动，而且那些波峰和波谷的走向决定了市场的趋势。现在让我们给这些波峰和波谷合适的名词，同时介绍支撑和阻力的概念。波谷，或者说反作用的最低点，称为支撑。这个名词不言自明，而且表明支撑是走势图上市场下方的一个价位或区域，此处的买意极强，足以胜过卖压。结果，跌势中断，价格再度调头向上。通常，支撑位用前一个反作用的最低点事前确定。


