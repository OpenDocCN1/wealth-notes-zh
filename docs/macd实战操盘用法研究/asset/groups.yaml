    # 十六、支撑位和阻力位如何互换角色


    到此为止，我们把“支撑”定义为前一个低点，而把“阻力”定义为前一个高点。然而，情况并不总是如此。这把我们领入支撑和阻力的更有趣也更鲜为人知的一面——它们的角色互换。一旦支撑位或阻力位被大大击破，它们就互换角色，成为对方。换言之，阻力位变成了支撑位，而支撑变成了阻力。要理解为什么出现这种情况，或许讨论一下形成支撑位和阻力位背后的心理状态会有所帮助。


    # 十七、支撑和阻力的心理状态


    为了说明，我们把市场参与者分为三类——多头、空头和观望者。多头是那些已经买入的交易者；而空头是那些已经站在卖方的交易者；观望者则是已经离场或者还未决定站在哪一方的人。'
  - '[PAGE 242]


    让我们假定市场从一个支撑区域——市场已在此波动了一段时间——开始向上运动。多头（那些在支撑区域附近买进的人）兴高采烈，后悔当初买得太少。如果市场再次回调至支撑区域附近，他们会增加多头仓位。空头现在意识到（或强烈感到）他们处于市场错误的一边。（市场从该支撑区域上升的距离将大大影响这些判断，不过我们稍后会讨论这一点。）空头希望（并祈祷）市场再跌回支撑区域，这样他们就能在当初进场的位置离场（他们打平的地方）。


    那些站在边界线上的人可以分成两群——那些从未持仓的人以及那些出于这样或那样的原因在支撑区域把多头仓位平掉的人。当然，后一群人正在为过早地平掉多头仓位而恼火，他们希望有另一次机会在接近他们卖出的地方把那些多头仓位补回来。


    最后一群人，即那些犹豫不决的人，现在意识到市场正在攀升，因此决心要趁下一个买入良机进场做多。所有四群人都决意“在下一个回调中买进”。他们在市场下方那个支撑区域都有一种“既得利益”。自然地，如果市场的确下跌到该支撑附近，那么所有四群人重建的买意会使推动市场上扬成为现实。


    在该支撑区域发生的交易越频繁，它的意思就越大，因为更多的市场参与者在这个区域有了“既得利益”。任何一个支撑位或阻力位的交易量可由三个方面决定：在该位置花费的时间、成交量以及交易发生的时间有多近。


    市场在一个支撑区或阻力区交易得越久，该区域就越重要。例如，如果市场在走高之前，在一个巩固区横走了三周，那么这个支撑区就比仅仅交易了三天的支撑区更加重要。


    成交量是另一个衡量支撑和阻力重要性的途径。如果一个支撑位在巨额成交量下形成，那就表明有大量交易单位换手，而且标志着这个支撑位比交易清淡的支撑位更重要。衡量日内交易活动的
    OX 图在确认交易最频繁因而支撑和阻力很可能最有效的价位时特别有用。


    判断一个支撑区或阻力区的重要性的第三个途径是交易发生的时间有多近。因为我们正在研究交易者对市场运动以及他们已经建立或未能建立的仓位的反应，所以交易活动越近，支撑或阻力的潜力就越大。


    现在让我们扭转一下，想象市场不是走高，而是走低。在前面的例子中，由于市场上升，因此市场参与者的总体反应导致每次下跌反作用会遇到更多的买盘（因而产生了新的支撑）。然而，如果市场开始下跌，'
