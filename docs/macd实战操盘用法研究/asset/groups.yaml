    # 第十二章 贵州茅台走势分析


    ——从缠论与 MACD 的角度


    # 12.1 缠论的基本概念和基本理论


    缠论是 2005—2008 年由缠师独创的技术分析理论，该理论博大精深，深受投机人士喜爱。在投机领域，笔者真正发自内心佩服的中国人并不多，缠师是笔者真正佩服的第一人。个人认为他是世界上最伟大的投机大师，他的理论是世界上最伟大的理论，他开创了技术分析领域的科学研究之门，此前的研究有些是不着边际的，从他以后，技术分析才首次真正成为严谨的科学。


    他发现的这个理论是解释价格波动的终极理论，这是真正的天机。个人认为缠师是因为泄露了天机，而在 2008 年被神收走，刚刚写完这个理论就仙逝了。缠师的另一个伟大在于他无私地贡献了他独创的全部理论，缠师是谁？他是男还是女？现在还是未解之谜。他是仙逝了，还是退隐了，个人还是觉得仍是未解之谜。个人觉得他可能还活着，但是如此天机居然公布于众，估计是犯了天条了，可能真的被收走了。


    笔者对缠论的理解还有很多很多不到位的地方，笔者以后的时间里会继续研究缠论。笔者也要学习缠师伟大的情怀，毫不保留地公开自己掌握的技术分析精华，去普世救人，力争做一个伟大的爱他人如爱己的人。这方面缠师就是我们行为的典范。


    ## 一、缠论基本概念和基本理论介绍


    K 线包含关系：指一 K 线的高低点全在另一 K 线的范围内。


    K线包含关系的处理：在向上时，把两K线的最高点当高点，而两K线低点中的较高者当成低点，这样就把两K线合并成一新的K线；反之，当向下时，把两K线的最低点当低点，而两K线高点中的较低者当成高点，这样就把两K线合并成一新的K线。


    顶分型：第二K线高点是相邻三K线高点中最高的，而低点也是相邻三K线低点中最高的。


    底分型：第二K线低点是相邻三K线低点中最低的，而高点也是相邻三K线高点中最低的。


    笔：两个相邻的顶和底之间构成一笔。


    笔的意义就是忽略掉相邻的顶和底之间的其他波动。


    上升的一笔：即底分型＋上升K线＋顶分型；下降的一笔：即顶分型＋下降K线＋底分型。


    线段：至少由三笔组成，而且前三笔必须有重叠的部分。


    ## 二、线段划分定理


    线段被终结，当且仅当至少被有重叠部分的连续三笔的其中一笔终结。而只要构成有重叠部分的前三笔，那么必然会形成一线段。换言之，线段终结的充要条件，就是形成新线段。


    和笔一样，从顶分型开始的线段，其终结一定是底分型；反之亦然。所以构成线段的笔数一定是奇数。


    用S代表向上的笔，X代表向下的笔。


    以向上笔开始的线段，可以用笔的序列表示：S₁X₁S₂X₂S₃X₃…SₙXₙ。容易证明，任何Si与Si+1之间，一定有重合区间。而考察序列X₁X₂…Xₙ，该序列中，Xi与Xi+1之间并不一定有重合区间，因此，这序列更能代表线段的性质。


    序列X₁X₂…Xₙ为以向上笔开始线段的特征序列，Xi为该特征序列的元素；序列S₁S₂…Sₙ成为以向下笔开始线段的特征序列，Si为该特征序列的元素。特征序列两相邻元素间没有重合区间，称为该序列的一个缺口。


    把每一元素看成是一K线，那么，如同一般K线图中找分型的方法，也存在所谓的包含关系，也可以对此进行非包含处理。经过非包含处理的特征序列，成为标准特征序列。


    线段划分的标准：


    参照一般K线图关于顶分型与底分型的定义，可以确定特征序列


    的顶和底。注意，以向上笔开始的线段的特征序列，只考察顶分型；以向下笔开始的线段，只考察底分型。


    在标准特征序列里，构成线段终点分型的三个相邻元素，只有两种可能：


    第一种：特征序列为顶分型中，第1和第2二元素间不存在特征序列的缺口，那么该线段在该顶分型的高点处结束，该高点是该线段的终点；底分型反之亦然。


    注意：第一元素是指形成特征序列为顶分型的第一个特征序列元素，第二元素是指形成特征序列为顶分型的第二个特征序列元素。


    第二种：特征序列为顶分型中，第1和第2元素间存在特征序列的缺口，如果从该分型最高点开始向下一笔开始形成的特征序列出现底分型（意味形成了新的线段），那么该线段在该顶分型的高点处结束，该高点是该线段的终点；底分型反之亦然。


    需要强调的是，在第二种情况下，后一特征序列不一定封闭前一特征序列相应的缺口，而且，第二个序列中的分型，不分第一二种情况，只要有分型就可以。


    把线段看作为次级别的走势类型，三段以上重复的线段就构成了缠中说禅中枢，由此就有缠论的一买、二买、三买的概念。这三段重复的线段中的两个高点中的低点就是中枢ZG，两个低点中的高点就是中枢ZD。


    ## 三、第一二三类买卖点的形成


    第一类买点：某级别下跌趋势中，一个次级别走势类型向下跌破最后一个缠中说禅走势中枢后形成的背驰点。


    第二类买点：某级别中，第一类买点的次级别上涨结束后再次下跌的那个次级别走势的结束点。


    第三类买点：某级别上涨趋势中，一个次级别走势类型向上离开缠中说禅走势中枢，然后以一个次级别走势类型回抽，其低点不跌破中枢上边缘的中枢破坏点（ZG）。


    第一类卖点：某级别上涨趋势中，一个次级别走势类型向上突破最后一个缠中说禅走势中枢后形成的背驰点。


    第二类卖点：某级别中，第一类卖点的次级别下跌结束后再次上涨的那个次级别走势的结束点。


    第三类卖点：某级别下跌趋势中，一个次级别走势类型向下离开缠中说禅走势中枢，然后以一个次级别走势类型回抽，其高点不升破中枢下边缘的中枢破坏点（ZD）。


