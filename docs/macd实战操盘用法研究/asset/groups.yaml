    # 一、艾略特波浪进阶


    艾略特波浪理论三要素：浪型、幅度和时间。三者的重要性如排列顺序。在前面，我们已经将所有的型态都已作过讨论，上面，我们还列出一个理想化的艾略特波浪序列，以便让读者有一个较好的主观印象。波浪理论只是近似地表达自然界波动轨迹。既然无人能利用某种工具完全捕捉到自然界波动轨迹，那么，其波动的某一部分出现的幅度及所需时间，反而就变成次要的了。重要的是，当它的型态完全显现在我们的'
