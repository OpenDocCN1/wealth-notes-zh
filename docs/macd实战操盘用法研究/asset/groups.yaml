    # 9.1.1 五升三降是波浪理论的基础


    波浪理论认为：股票市场的发展遵循着五浪上升，三浪下降的基本型态，从而形成包含八浪的完整周期。前面五浪所组成的波浪是股市运行的主要方向，而后面三浪所组成的波浪是股市运行的次要方向。图中的第1浪，第3浪和第5浪称为推动浪，第2浪和第4浪则称为修正浪。


    ![](img/e00f2195878851621153c98be41c491d_208_0.png)


    经过第1浪至第5浪推动之后，又会受到 a、b、c 三浪的修正。在这个完整的八浪周期结束之后，随之而来的第二个类似的周期变动，如此不断地重复。这样，较小级别一波浪总是包含在较大的波浪中，或者说：波浪理论认为，任一序列中，任一級次的浪，均可被细分以及再'
