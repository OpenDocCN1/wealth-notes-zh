    # 三、参数的修改


    从 RSI 指标的计算方法可以看出 RSI 指标是以时间为参数，构成参数的时间周期可以是日、月或周、年、分钟等，而这些时间周期又根据股票上市时间的长短和投资者的取舍，理论上可以采取任意的时间长度，但在大多数股市分析软件上，各种时间周期的变动范围又大多数都被限定在
    1～99 内，如 1～99 日、1～99 周等。


    从 RSI 指标的实际运用来看，大多数投资者所选择的时间周期参数为日，而日 RSI 指标参数的使用，又大多局限在 6 日和 12 日等少数几个参数上。如果按照这些短期时间参数来分析股票走势，其
    RSI 指标所得出的数值的变动范围大部分是在 40～80 之间，而且波动频率过于烦琐。在这么一个狭小空间里想用 RSI 曲线来比较准确地研判行情走势实属不易，因此，投资者应充分利用各类股市分析上所提供的各种短中长期日参数，结合
    K 线、均线等股市理论来综合研判股票走势。下面章节中就试着通过运用不同的指标参数对应不同的买卖时机的方法来解决这一问题。


