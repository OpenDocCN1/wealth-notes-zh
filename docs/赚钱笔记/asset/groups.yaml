    # 節約術 10

    改用自動儲蓄！

    ——不需毅力，月光族最適用！


    讓支出低於收入，多餘的錢就能存起來。你們可能覺得我在講廢話，偏信這種理所當然的事情很多人都辦不到！


    相信不少人和我以前擔任講師一樣，明明薪水不錯，卻完全存不到錢對吧？


    我建議那些月光族，使用銀行的「自動定存」服務。


    每個月銀行會把你設定的金額，「強制性」自動轉換成定存。


    任何一家銀行都能幫你用現有的戶頭辦理，不需要特地開設新的戶頭。


    自動定存是一種在無形中，往同一個戶頭裡定期儲蓄的系統。


    一旦設定以後，每個月就會強制扣掉規定的金額。但是額度千萬不要設定太高，否則生活費不足，就難以持續下去。'
