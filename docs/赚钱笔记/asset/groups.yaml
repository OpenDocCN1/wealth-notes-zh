    # 用13萬輕鬆賺到1千萬的最強筆記術


    常人隻讀過經，錢省了，屌腰傷，如何從答應翻身的


    低收入、長工時、無殼蝸牛、無法結婚生子……我們都是「貧困世代」！


    面對不知何時會降臨的自然災害和事故，以及隨之而來的金融波動，想必大家都會覺得這是一個前途無「亮」的時代吧？


    最近還多了政治與年金問題，煩惱簡直沒完沒了。


    上班族的平均年收逐年下滑，當今的年輕人已經被稱為「貧困世代」。


    問題來了，當人生跌落谷底，你最需要什麼？'
  - '[PAGE 24]


    答案很簡單。


    那就是「錢」。


    另外還有一點，就是在任何狀況下都能「東山再起的能力」。


    「錢」和「東山再起的能力」……


    你是不是很想這麼說：


    「這不是廢話嗎？兩樣都有的話哪還需要煩惱啊！」


    是的，很多人都以為只有特別的人才兼具這兩樣東西。


    你是不是想闖上這本書了嗯？


    修但 〽〽〽！


    因為我要教你如何輕易得到「錢」和「東山再起的能力」。


    賺錢筆記１天１分鐘，賺進１千萬的最強筆記術１６０ お金の不安心が消えるノート 60日でお金が貯まる日１分の習慣'
