    星期日的午後時光……


    各位可能會坐在沙發上，悠閒地閱讀這本書。


    當你讀完以後，說不定會迫不及待想成為一個有錢人。


    然後，你會關上書本，以為自己已經是個人了，還躺在沙發上睡午覺。


    等你醒過來，「賺錢筆記」大概也被你拋到腦後，你又開始過著以往的浪費生活……


    很遺憾的，這是常有的事情。一本書的內容再怎麼豐富精彩，各位不實踐的話一點意義也沒有，這簡直是浪費時間和金錢的行為。


    我拜託各位，一定要立刻實踐書中的內容，按照預定計畫，開始存錢。所以，請馬上開始記錄「賺錢筆記」！


    但有一點要特別注意——不要因為「賺錢筆記」而成為一個斤斤計較'
  - '[PAGE 192]


    的人。記錄「賺錢筆記」最大的用意，是了解自已花錢的方式，把「浪費」轉換成「投資」。也就是說，重點不是「不花錢」，而是「改變花錢的方式」。存到目標額度後，你可以從事嚮往已久的海外旅行，或是繳納買房的頭期款。例如，你事先在筆記寫下「存到五十萬（約新臺幣十四萬元）就要去海外旅行」，如此一來你就不會和過去的我一樣，动不动就把錢拿去喝酒或衝動購買名牌貨。你再從儲蓄中抽一部分出來投資，總有一天就會得到「經濟自由」。到時候，你一整子都不用為錢煩惱，哪怕遇上天災人禍，至少不會受錢所苦。倘若你不幸身無分文，只要利用「賺錢筆記」過上勤儉節約的生活，'
  - '[PAGE 193]


    他日你必會像我一樣東山再起。


    話雖如此，「成為有錢人」本身並不是特別有價值的事情。


    「成為有錢人以後你想幹什麼」才是重點。


    就算你有錢可以自由過活，每天卻只顧吃喝玩樂，這種生活大概一個月就膩了吧？


    事實上，我在獲得「經濟自由」後，有整整半年的時間終日無所事事。


    我完成獲得了「經濟自由」的大目標，生活頓時失去重心。說真的，那一段日子對我來說很痛苦。


    明明獲得了「經濟自由」，我卻迷失自己的夢想，不知該如何是好。


    於是，我再次反問自己：


    「我到底是為了什麼要得到『經濟自由』？」


    我從小就很喜歡旅行，打算總有一天要環遊日本。況且，我當過補習'
  - '[PAGE 194]


    班老師，我也知道傳道授業的喜悅。結果我頓悟了，我決定把自己脫離負債，獲得「經濟自由」的經驗告訴社會大眾，盡量減少「為錢所困的人」。


    重新找到目標後，我又過上如魚得水的生活。這次我是為了「自己的夢想」工作，而不是為了「錢」。能夠幫上別人的忙，是一種至高無上的喜悅。


    因此，請各位從今天開始記錄「賺錢筆記」，獲得自己的「金錢」與「夢想」。


    在實踐目標的過程中，你一定會獲得在未來世界生存下去的實力。


    最後，我想藉這機會，感謝協助本書出版的各方大德。在我以前負債累累時就一直支持我的好伙伴中野真理小姐、在我寫作時提供莫大協助的和田秀子小姐、出版社的森下裕士先生和其他編輯同仁，最後是來參加我的演講會的全國來賓，多虧有你們，我才能順利出版這本書。'
