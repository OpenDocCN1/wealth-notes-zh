    ※ お金の不安が消えるノート\n60日でお金が貯まる1日1分の習慣\n\n### 風險極小化、利益極大化的建議\n\n看到這一章的讀者，想必都決定要掌握「經濟自由」了吧？\n\
    對於這樣的讀者，我要告訴你們一些關於金錢的基礎知識，算是一點建議和提醒。\n\n讀過這一篇〈特別附錄〉後，相信大家會想盡量降低風險，來獲得最大的利益。\n\n\
