    ### 「賺錢筆記」進化版「投資筆記」


    有意投資的人，請先上網開設證券戶頭。


    申請手續從各券商的首頁就能進行，光是開戶也不用花錢。


    不同公司的手續費和金融商品也不一樣，請參考網路上的比價網站，選擇適合自己的券商。


    總之，要讓錢財幫我們工作，達到錢滾錢的效果。


    各位是不是開始了解投資的魅力了？


    現在請各位學習投資用的筆記術，你要寫在原本的「賺錢筆記」上，或是另外拿一本投資用的筆記都可以。


    我個人是和「賺錢筆記」寫在一起，反正也沒什麼記錄規則，以方便自己記錄或審閱的方法寫下來就行。


    那好，我來說明投資時該寫下的項目：


    - 第一點：金融商品的購買日期

    - 第二點：購買的商品名稱和購買時的價格

    - 第三點：購買時的心情

    - 第四點：預計可以賺多少


    第一點「金融商品的購買日期」和第二點「購買的商品名稱和購買時的價格」，是要避免你自己忘記自己購買的商品、價格、時間。投資的項目愈多，就愈容易搞混，事先記錄下來是很重要的。而且，你要確認自己保有這項商品的時間。


    至於第三點「購買時的心情」，事先記下購買時的心情，遇到價格波動時就不會動搖。換句話說，不會有倉皇殺出或小賺即賣的問題。


    第四點「預計可以賺多少」的用意，在於確認結果是否符合自己的預期。若結果與預期完全不符，該商品就要立刻脫手變現。另外，也請事先預測多久時間能賺到多少報酬。


    ### 「賺錢筆記」進階為「投資筆記」的記錄法


    **重點提示 TIPS**


    投資用的筆記上，事先寫下這四點：


    1. 金融商品的購買日期

    2. 購買的商品名稱、購買時的價格

    3. 購買時的目標

    4. 預計可以賺多少


    在①寫下預計時間會更有效，例如○個月後等等。


    **筆記例**


    ○月○日


    豐田股票 ＿＿＿＿＿＿

    3,000×100股 = 300,000


    長期持有，靜待獲利……


    1年後每股漲為360，確實獲利，得到60,000收益。


    可能有人覺得我在講廢話，可是偏偏這麼簡單的事情很多人都做不到。


    同樣是投資，商品種類卻不勝枚舉，有股票、不動產、外匯、債券、黃金等等，而這些類別又各自有許多金融商品。


    這些商品的特徵容我稍後說明，每一樣的風險、報酬、趨勢都不同，要特別留意。


    我一開始投資時，正值「IPO泡沫時期」，我也靠IPO賺到龐大的利益。


    不過利潤再怎麼高，只投資IPO的風險太大。事實上IPO的泡沫崩潰後，很多投資客一夜之間傾家蕩產，生活頓失著落。


    好在我沒有蒙受太大的損失，原因在於……


    我有「分散投資」。


    在投資的世界裡有一個說法：


    ### 不要進行「獲勝的投資」，而要進行「不敗的投資」！


    「分散投資」就是避免失敗的大前提。投資的目的，不在於發一筆橫財，而是以長遠的視野，有效率地增加資產。


    再怎麼安全的投資標的，背後都隱藏著風險。請各位切記，分散投資是把風險壓到最低的唯一方法。


    ### 什麼是 最理想的 投資方式？


    那麼，該如何分散才好呢？首先，請分別投資股票、不動產、債券等各種商品。既然要分散投資，就不要投資同一種類，否則就沒有分散風險的效果。


    接著「分散領域」。同樣是購買股票或債券，請分別投資國內外。種海外請分別投資美國、歐洲、澳洲、中國等地區，這樣就不會受到經濟情勢的劇烈影響。


    一般來說，風險愈大的投資，報酬（收益性）愈大。當然，風險愈小的投資，報酬也愈小。


    過去在 IPO 鼎盛時期，有所謂低風險高報酬的商品。當然能找到這類商品是再好不過，但是現在世界各國的股價下跌，要找到不是一件容易的事。


    因此，你可以投資外匯這種「高風險、高報酬」的商品，同時也投資基金這種「低風險、低報酬」的商品，來平衡投資風險。


    投資分為「短期獲利」的類型與「長期持有慢慢產生日益」的類型。


    資金少的時候，就多投資一些「高風險、高報酬」的商品；等資金增加到某個程度，就增加「低風險、低報酬」的投資比例，這是我個人採用的方法。


    以我個人來說，我一開始入市時，持有資產還很少，幸虧我找到當時還不受矚目的IPO，才在短期內獲得龐大的利益。


    有了一定程度的資金後，我開始接觸基金和不動產，增加這一類「長期持有、穩定獲利」的投資標的比例。


    一旦成功獲得龐大的資產，就算放著不管，錢也會自動增加，沒必要刻意進行高風險的投資。


    以錢滾錢的方式增加資產，光靠資產生出的利益就能過活。


    至於投資能否大賺，這要看當時的趨勢。我個人算是非常幸運，但沒有做任何研究和行動，是不可能增加資產的。


    要事先做好準備，時時刻刻蒐集情報，尋找機會，在關鍵時刻迅速出手投資，這樣才可以掌握良機。


    現在開始也不算太遲。世界即將改頭換面，這時候才有新的商機誕生。希望各位好好把握，千萬不要放過大好良機。


    再來我簡單說明具體而言有哪些金融商品。了解每一種金融商品的優缺點，挑選適合自己的種類投資吧。


    ### 小資族變有錢的零股


    股票是認同該公司事業的出資者而購入的東西，萬一公司倒閉就血本無歸；但是業績上揚的話就有利益產生，股東會獲得配股或配息。股價會依照該公司的業績或經濟狀態而變動，風險當然是有的。


    一倒閉，股票就變壁紙。


    另一方面，低買高賣也能獲得利益，但投資股票，在公司業績不好時也必須有支持到底的氣魄才行。


    一般來說，股票是以張數購入，這對資金較少的投資者來說，難度比較高。


    因此，我建議新手投資「零股」，在日本，零股交易的最小單位只有普通交易的十分之一，交易起來風險較小。


    在買賣股票之前，別忘了先到券商開戶。


    ### 分散風險的外幣存款


    要分散風險，除了使用本國貨幣以外，以海外貨幣持有資產也是有必要的。


    「外幣存款」顧名思義，是以外國的貨幣儲蓄。依照當天的匯率將本國貨幣換成外幣，存款就適用該國貨幣的利率。


    這一招在國內貨幣升值時有利，當然匯差損失在所難免，也有侵蝕本金的風險。再者，換匯時有手續費用，因此長期持有是基本的。


    巨型銀行、都市銀行、地方銀行、網路銀行都有外幣存款服務，每一家銀行的手續費和匯率都不一樣，請評估後再行選擇。


    #### 外匯投資的 3 大注意事項


    「外匯」是用保證金進行交易的新式金融商品，將保證金付予交易業者，就能操作好幾倍的金額來交易。


    等於利用槓桿原理，掌握些許的匯率波動來換取龐大的利益。相反的，也有蒙受巨額損失的風險，是一種高風險、高報酬的商品。


    因此，建議各位遵守以下三點來操作：


    - 第一：槓桿操作維持在三倍就好

    - 第二：事先設定停損

    - 第三：選擇大型的交易業者


    ### 懶人適用！低風險的基金投資


    買「基金」是把金錢託付給別人操作的投資方式。等於投資客集資，交由基金經理人運用和投資的系統。基金經理人都是投資專家，沒有投資知識的人也很容易上手。基金包含了股票或債券等各種金融商品，比例也分配得相當均衡，具備有效分散投資的優點。股票要透過券商才能交易，基金則能透過銀行或保險公司購買。而且基金和定期存款一樣，能夠使用定期定額的「自動購買服務」。


    ### 海外基金可以投資廣受矚目的國家


    這是一種分散風險，以長期持有的方式著實增加資產的低風險、低報酬手段。


    這是基金投資的海外版，繼金磚四國（巴西、俄羅斯、印度、中國）之後，還有展望五國（越南、印尼、南非、土耳其、阿根廷）等新興國家廣受矚目。


    話雖如此，調查陌生的海外市場，對投資新手來說難度太高。因此，購買海外的基金，即可有效進行海外的分散投資。


    ### 指數基金和主動式基金


    基金的運用大致分為「指數基金」和「主動式基金」。

