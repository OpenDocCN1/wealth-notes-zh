    類似的無用經驗重複幾次之後，我開始厭惡這種空有一堆名片的狀況，因為我不僅遇不到有意義的邂逅，甚至連對方的長相都記不住。


    於是，我改變交換名片的方法。


    我不再像個「名片交換機」那樣到處發名片，而是認真傾聽對方的談話，並且仔細介紹自己。我成功打開話匣子，常常就和一個對象聊超過十分鐘。


    回到家裡寄送郵件時，我回憶起那些人的長相，一一傳送真誠的感謝文字給他們。


    不可思議的是，我工作的機會開始增加。


    如今，我有機會從事出版工作，也是在異業交流會上遇到臭味相投的編輯。


    所以我不希望各位當一個「名片交換機」。


    交換名片的時候，要好好和對方交流，至少在你回到家以後，要想得起對方的長相和談話內容才行。


    不是蒐集到愈多名片愈好。


    還有一點，把你當天遇到的人也記錄在「賺錢筆記」裡。


    記下對方的名字和對話內容，下次見面時就容易打開話匣子。


    當你提起上一次的話題內容，例如對方說過某本書讀起來非常有趣，那個人會很高興你真的記得他，同時增進彼此的依賴關係。請各位務必嘗試看看。


    ## 有錢人的好習慣 7：運用特長


    你的特長是什麼？


    不少人都說，自己並沒有特長。


    其實，每個人都有兩樣特長。


    例如，有的人很會做模型、有的人煎蛋技術非常好。


    過去我擁有一堆名牌精品，換個角度來說也是一種特長吧？


    有句成語叫「暴殄天物」，難得有不少的特長卻不懂得如何活用，就不上特長。


    沒錯，就像我過去把一堆名牌精品放在衣櫃裡生灰塵一樣……


    之前我也說過，有一天我覺得讓這些東西積灰塵太可惜，因此把所有名牌精品放在網路上拍賣，結果立刻有人高價競標。


    多虧網路拍賣，我獲得了幾十萬的額外收入。


    各位若將收藏的模型拿去網拍，說不定也會有人高價競標喔。


    另外，把你擅長的菜色每天公佈在部落格上，好比「特製軟嫩蛋包飯」，搞不好會有出版社找你出書呢。


    發掘自己的特長，稍微動點頭腦，就有成為金雞母的可能。


    請試著發掘你的「特長」吧！


    ### 沒有肚子


    以前我體重將近九十公斤的時候，當然過著與運動無緣的生活。


    別說運動，我胖到連走路都很辛苦。


    不過，自從我決定獲得「經濟自由」後，我改掉暴飲暴食壞習慣，開始自己煮飯來吃。


    我必須節省生活開銷，所以不再去便利店商店，每天早上也不再買罐裝咖啡。


    每天記錄「賺錢筆記」，同時達成減肥和節省開支的功效。


    當時我過著節儉的日子，也沒辦法花錢去健身房，只好戴著計步器死命健走。


    我不再搭乘愛用的小黃，有時間的話就走一到兩個車站的距離。


    然後，我會在「賺錢筆記」的空白處，記下今天走了多遠。


    寫下自己吃的東西和步行公里數，有提升幹勁的效果，我的體重也愈來愈低；相反的，我的存摺金額愈來愈高。


    其實金錢和運動有密切關係，懂得管理資產的人也懂得管理健康。


    據說在美國，有人被企業解聘的理由是過胖，因為大家認為胖子不懂得自我管理。


    ### 賺錢筆記


    1天1分鐘，賺進1千萬的最強筆記術


    お金が“不安が消えるノート 60日でお金を貯める1日1分の習慣


    有錢人都賴在這些習慣


    有錢人的好習慣


    不會空有夢想卻沒資金


    所以，美國能幹的商業人士，下班都有勤上健身房的習慣。


    想養成存錢的習慣，就要有管理健康的意識。


    我也没叫各位練得滿身肌肉，重點是在日常生活中，「持續」進行適當的運動就好。


    記錄「賺錢筆記」兩年後，我還清了所有欠款。


    到了第六年，我獲得不必工作也能生活的「經濟自由」。


    這對我来说，是帶給我極大信心的人生逆轉勝。


    之後，我在四十歲時開設經濟獨立股份有限公司，達成筆記上的目標——「不為五斗米折腰，而是從事自己真心想做的工作」。


    現在，我忙著寫作和舉辦演講座談會，盡量把自己的經驗傳遞出去。和客戶或來賓相處久了，我發現那些不會存錢的人，都有一些共通的特質和思維。


    > 其中一句就是：

    > 「我有想做的事情啦！可是就沒有錢啊……」


    很多人都說，他們不想永遠當個上班族，總有一天要自立門戶，而且他們也有經商的好點子。


    然而他們卻異口同聲地說，要是自己有資金就好了。


    講句難聽一點的，「沒有資金所以無法實現夢想」純粹是藉口罷了。


    我敢講這種話是因為，我自已以前就是這樣子。過去我擔任講師且債務累累時，也常常感嘆自己缺乏資金，只會嘴砲，完全沒有付出行動。


    真正有心的人，會認真而具體地思考創業需要多少資金與集資的方法。


    反過來說，會用沒資金當藉口的人，其實並不是真心想創業。


    現在是沒資金也能創業的時代。


    如果你希望有一天能建立自己的事業，那麼請訂立集資方法、進度表、人才延攬等具體的計畫。


    訂好後，寫在「賺錢筆記」裡，「夢想」終將成為「現實」。


    ### 有錢人的好習慣 10：景氣不好，愈要行動


    投資是有風險的，你可能獲得巨大的利益，也可能蒙受損失。


    在「熱錢流入」時期，外行投資客一夜致富的情況所在多有。


    相對的，在「雷曼風暴」時期，大家應該都還記得，全世界許多投資大戶都蒙受不小的損失。


    日本長年來經濟不景氣，二〇一一年又發生東日本大地震，加上匯率創下歷史新高，完全看不到復甦的徵兆。今後股價會跌到什麼地步，沒有人料得到。


    這種時候，不想「積極投資」也是情有可原。


    然而，聽到有些投資講座的來賓說，現在景氣不好應該減少投資，或是現在不適合從事新事業，我都替他們感到惋惜。


    切記「危機才是最大的轉機」。


    景氣回溫，人人瘋狂投資的時候，股價早已飆高。


    「低買高賣」是投資的鐵則，現在全球股價便宜，正好是「逢低買入」的時機。


    經商也是同樣的道理，任何時代都有把危機化為轉機的企業或高人。


    怪罪景氣不好，就和怪罪沒有資金一樣，都是藉口罷了。


    不要怪罪「景氣」或「世道」，快點行動吧！


    「不肯安於現狀」是成長不可或缺的條件。


    這是我在辭去補習班工作，繼承保險代理店時領悟的道理。


    過去在補習班工作真的很開心，不僅人際關係暢達，下班後幾乎每晚都和同事去玩，而且一定要續攤，玩到通宵達旦才甘心。


    這種生活害我負債累累，更糟糕的是我再也無法成長。


    每天見到的人都一模一樣，我對人際關係和工作也沒有任何不滿。長期待在這樣的舒適圈裡，意志變得薄弱，於是喪失「改變自己」的氣概。


    我剛開始從事保險工作時，幾乎每天參加異業交流會。我在那裡遇到的人，擁有我從來沒接觸過的經歷和思維。


    他們身上的本領與知識，確實幫助我成長。


    如前述，我現在有機會出書，也是因為在異業交流會遇到相關人士。


    喜歡自己目前的工作環境並不是壞事，職場的人際關係良好更是值得慶幸。


    不過，如果你想成為「有錢人」，就不要安於有限的人際關係。試著多和工作圈以外的人士交流，順便把那些人的名字寫在「賺錢筆記」裡。


    嶄新的邂逅，會讓你擁有全新的可能。


