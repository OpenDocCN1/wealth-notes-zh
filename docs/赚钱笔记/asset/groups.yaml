    他們都過著早睡早起的生活。


    我的投資伙伴和作家好友，也都過著規律的生活。


    依照我的經驗，人類腦袋最清醒的時間，是清醒後的兩小時左右。


    尤其在大家還沒起床的寧靜早晨工作，不用擔心被電話或電子郵件打擾，工作處理起來非常迅速，好點子也特別多。


    所以我現在清晨四點就起床。


    首先我會沖一杯熱咖啡，慢慢品茗著咖啡，打開電腦。然後確認股價'
