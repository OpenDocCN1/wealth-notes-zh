  - '[PAGE 5]


    为何我们总是感到如此不安？

    问题就出在……「钱」！！


    请教各位一个问题，你知道人类最大的「慾望」是什麽吗？

    答案就是「追求稳定」。


    人活著是为了得到稳定的收入、环境，以及舒适的场所。因此，工作和人际关系不稳定就会感到恐惧。

    在眾多恐懼之中，有一項嚇壞了大多數人。

    那就是對「錢」的恐懼！


    请試著回想一下，你是不是有以下的煩惱？

    擔心每個月入不敷出'
  - '[PAGE 6]


    +   擔心收入變少

    擔心無法維持現在的生活水平

    擔心以後錢不夠用

    擔心沒錢給孩子接受良好教育

    擔心沒錢找不到好伴侶

    擔心被房貸壓得喘不過氣

    擔心政治不穩，經濟前景不明


    不只上述這些例子，人類對於錢的恐懼可是沒完沒了。而且這些對錢的恐懼，很難找出有效的改善方法，幾乎會把人逼瘋，有些人連健康都受到影響。


    不過，從來沒有人教我們該如何消除對錢的恐懼。


    我們從小就被父母和師長灌輸「錢＝惡」的觀念，因此才會時時刻刻與錢的恐懼為伍。換言之，我們從小到大，對錢都是一無所知。'
  - '[PAGE 7]


    「整天想著賺錢的人一定不是什麼好東西！」


    這種形同放棄思考的鬼話，相信你聽過不少吧，請不用擔心。


    # 「1 天 1 分鐘，60 天內絕對進帳的『賺錢筆記』」


    本書介紹的「賺錢筆記」，保證可以解決所有關於錢的煩惱。不但如此，還能幫你創造出必要的財源。


    因為我要介紹的方法，不需要具備多麼專業的知識，只要做到基本的「儲蓄」「節約」「投資」就能成功。任何人在任何情況下，都有辦法輕易實踐。


    再者，這種筆記一天花一分鐘記錄就行了，絕對可以持之以恆。實際上，超過一千二百人曾接受我的理財諮詢，我整理出那些經驗'
  - '[PAGE 8]


    # 如向從負債 500萬，躋身為有錢人？


    又賭又嫖又一個股債……我曾經一度瀕臨破產


    證的有效知識，各位只要靠這一本筆記就能運用自如。


    我自己寫了這本筆記後，財務狀況也大有改善。


    本來我負債五百萬日圓（約新臺幣一百四十萬元）。


    但是沒多久，我就存到一千萬日圓（約新臺幣二百八十萬元）。


    更棒的是，我獲得了「經濟自由」，也就是隨時都能痛快花錢！


    有了這本筆記，各位絕對能在六十天內存到錢。


    柏青哥、賭馬、麻將、酒店、名牌貨……曾使我淪為卡奴，年僅


    二十八歲就負債五百萬日圓（約新臺幣一百四十萬元），幾乎瀕臨破產。


    最慘的是，我收入不佳的時候，每個月只有十三萬日圓（約新臺幣三萬


    六千元）。'
  - '[PAGE 9]


    多虧這本筆記，如今我過著隨心所欲的生活，所有負債也在兩年內還清，還創造了豐厚的資產。


    對錢的不安，已經與我無緣了！


    一旦學會記錄筆記的方法，在任何狀態下都能輕易東山再起。


    實現「經濟自由」對我來說猶如探囊取物，而且這些記錄筆記的方法一點也不困難。


    連我這種一開始經濟狀況糟糕透頂的人，都成功獲得「經濟自由」了。


    所以，各位一定更能輕易成功。


    請踏出第一步，邁向不愁錢的舒適生活。


    這本書是我理財之道的精髓，有了這一本保證萬事OK！


    我寫過不少理財書籍，而這一本堪稱是汲取所有精髓的佳作。


    照著本書的章節讀下去，即可消除對錢的不安，順利增加自己的財富：'
