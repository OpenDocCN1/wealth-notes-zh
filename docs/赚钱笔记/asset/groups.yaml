  - "[PAGE 202]\n\n# 你這麼會, 也不會比作者還麼。\n\n日本暢銷財經書作家田口智隆，30歲前是個負債500萬圓的窮學生，他公開親身實踐的「賺錢筆記」——1天限1分鐘寫下筆記，自動構築出一套自己專屬的「生財」「理財」「投資」系統，還清債務又賺進1千萬。\n\
