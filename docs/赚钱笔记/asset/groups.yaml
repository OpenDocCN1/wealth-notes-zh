    在投資的世界裡有一個說法：'
  - '[PAGE 150]


    # 不要進行「獲勝的投資」，而要進行「不敗的投資」！


    「分散投資」就是避免失敗的大前提。投資的目的，不在於發一筆橫財，而是以長遠的視野，有效率地增加資產。


    再怎麼安全的投資標的，背後都隱藏著風險。請各位切記，分散投資是把風險壓到最低的唯一方法。


    # 什麼是 最理想的 投資方式？


    那麼，該如何分散才好呢？首先，請分別投資股票、不動產、債券等各種商品。既然後要分散投資，就不要投資同一種類，否則就沒有分散風險的效果。


    股錢筆記 1 天 1 分鐘，股進 1 千萬的最強筆記術


    お金のが不安が消えるノート


    60日でお金貯まる! 日 1 分 習慣'
  - '[PAGE 151]


    從小散戶到投資高手都必備的投資筆記簿 150 「投資筆記」的金錢配鑲法


    接著「分散領域」。同樣是購買股票或債券，請分別投資國內外種海外請分別投資美國、歐洲、澳洲、中國等地區，這樣就不會受到經濟情勢的劇烈影響。


    一般來說，風險愈大的投資，報酬（收益性）愈大。當然，風險愈小的投資，報酬也愈小。


    過去在 IPO 鼎盛時期，有所謂低風險高報酬的商品。當然能找到這類商品是再好不過，但是現在世界各國的股價下跌，要找到不是一件容易的事。


    因此，你可以投資外匯這種「高風險、高報酬」的商品，同時也投資基金這種「低風險、低報酬」的商品，來平衡投資風險。


    投資分為「短期獲利」的類型與「長期持有慢慢產生日益」的類型。'
  - '[PAGE 152]


    資金少的時候，就多投資一些「高風險、高報酬」的商品；等資金增加到某個程度，就增加「低風險、低報酬」的投資比例，這是我個人採用的方法。


    以我個人來說，我一開始入市時，持有資產還很少，幸虧我找到當時還不受矚目的IPO，才在短期內獲得龐大的利益。


    有了一定程度的資金後，我開始接觸基金和不動產，增加這一類「長期持有、穩定獲利」的投資標的比例。


    一旦成功獲得龐大的資產，就算放著不管，錢也會自動增加，沒必要刻意進行高風險的投資。


    以錢滾錢的方式增加資產，光靠資產生出的利益就能過活。


    至於投資能否大賺，這要看當時的趨勢。我個人算是非常幸運，但沒有做任何研究和行動，是不可能增加資產的。


    要事先做好準備，時時刻刻蒐集情報，尋找機會，在關鍵時刻迅速出'
  - '[PAGE 153]


    手投資，這樣才可以掌握良機。


    現在開始也不算太遲。世界即將改頭換面，這時候才有新的商機誕生。希望各位好好把握，千萬不要放過大好良機。


    再來我簡單說明具體而言有哪些金融商品。了解每一種金融商品的優缺點，挑選適合自己的種類投資吧。


    # 小資族變有錢的零股


    股票是認同該公司事業的出資者而購入的東西，萬一公司倒閉就血本無歸；但是業績上揚的話就有利益產生，股東會獲得配股或配息。股價會依照該公司的業績或經濟狀態而變動，風險當然是有的。'
  - '[PAGE 154]


    一倒閉，股票就變壁紙。


    另一方面，低買高賣也能獲得利益，但投資股票，在公司業績不好時也必須有支持到底的氣魄才行。


    一般來說，股票是以張數購入，這對資金較少的投資者來說，難度比較高。


    因此，我建議新手投資「零股」，在日本，零股交易的最小單位只有普通交易的十分之一，交易起來風險較小。


    在買賣股票之前，別忘了先到券商開戶。


    # 分散風險的外幣存款


    要分散風險，除了使用本國貨幣以外，以海外貨幣持有資產也是有必要的。'
  - '[PAGE 155]


    「外幣存款」顧名思義，是以外國的貨幣儲蓄。依照當天的匯率將本國貨幣換成外幣，存款就適用該國貨幣的利率。


    這一招在國內貨幣升值時有利，當然匯差損失在所難免，也有侵蝕本金的風險。再者，換匯時有手續費用，因此長期持有是基本的。


