    \n話雖如此，「成為有錢人」本身並不是特別有價值的事情。\n\n「成為有錢人以後你想幹什麼」才是重點。\n\n就算你有錢可以自由過活，每天卻只顧吃喝玩樂，這種生活大概一個月就膩了吧？\n\
    \n事實上，我在獲得「經濟自由」後，有整整半年的時間終日無所事事。\n\n我完成獲得了「經濟自由」的大目標，生活頓時失去重心。說真的，那一段日子對我來說很痛苦。\n\
    \n明明獲得了「經濟自由」，我卻迷失自己的夢想，不知該如何是好。\n\n於是，我再次反問自己：\n\n「我到底是為了什麼要得到『經濟自由』？」\n\n我從小就很喜歡旅行，打算總有一天要環遊日本。況且，我當過補習班老師，我也知道傳道授業的喜悅。結果我頓悟了，我決定把自己脫離負債，獲得「經濟自由」的經驗告訴社會大眾，盡量減少「為錢所困的人」。\n\
    \n重新找到目標後，我又過上如魚得水的生活。這次我是為了「自己的夢想」工作，而不是為了「錢」。能夠幫上別人的忙，是一種至高無上的喜悅。\n\n因此，請各位從今天開始記錄「賺錢筆記」，獲得自己的「金錢」與「夢想」。\n\
    \n在實踐目標的過程中，你一定會獲得在未來世界生存下去的實力。\n\n最後，我想藉這機會，感謝協助本書出版的各方大德。在我以前負債累累時就一直支持我的好伙伴中野真理小姐、在我寫作時提供莫大協助的和田秀子小姐、出版社的森下裕士先生和其他編輯同仁，最後是來參加我的演講會的全國來賓，多虧有你們，我才能順利出版這本書。\n\
    \n在最後我想誠心向各位道謝。\n另外，拿起這本書讀到最後的讀者，我也衷心感謝你們。\n希望你們看完本書後，人生都能變得精彩豐富。\n\n田口智隆\n\n\
