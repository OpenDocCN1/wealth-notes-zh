    +   1. 金融商品的購買日期

    2. 購買的商品名稱、購買時的價格

    3. 購買時的目標

    4. 預計可以賺多少


    在①寫下預計時間會更有效，例如○個月後等等


    筆記例


    ○月○日


    豐田股票 ＿＿＿＿＿＿

    3,000×100股 = 300,000


    長期持有，靜待獲利……


