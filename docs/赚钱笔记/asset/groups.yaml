    \n## 「投資筆記」的最大功效 —— 獨立思考、冷靜判斷、有效佈局\n\n在記錄投資項目時，不要只記錄金融商品的種類與購買時間，購買的理由也請記下來。當你選擇某項商品，背後一定有你自己的想法或理由。\n\
    \n例如，你買某家公司的股票是出於支持、買外幣則是期待某個國家未來的發展性。\n\n有時候一些小道消息或新聞，也可能成為投資的契機。\n\n假設你看到新聞報導，有愈來愈多家庭組裝太陽能發電系統，於是決定購買太陽能發電的相關企業股，這時請在「賺錢筆記」下面畫一條線，並於橫線下方寫下「期待太陽能」等字樣。\n\
    \n把這些心得記下來，日後必有幫助。\n\n錢有時會奪走我們冷靜的判斷力。\n人類在投資得利或虧損時，可能會一時衝動，做出冒險的投資決策。\n這種情況下，重新看看筆記找回初衷，即可恢復冷靜。\n\
    我的「賺錢筆記」無所不包，舉凡我以前揮霍無度時的支出紀錄、「投資組合」的變化、人生的目標或夢想、當下的感想或領悟等等，我都記錄下來。\n所以，在工作快要失敗，或是投資即將虧損，想要兵行險著的時候，我會翻閱以前的「賺錢筆記」，找回「自己為何存錢」的初衷。\n\
    如此一來，亢奮的情緒就會平復下來，以冷靜的思維審視現狀。\n現在，我重新翻開二十八歲時寫下的筆記，看到數字還會想起當時的心情呢。\n這本筆記不只記錄了金錢，也記錄了我自己的成長。\n\
    所以，請把你的每日支出、夢想、投資統整在「賺錢筆記」裡。\n\n### 記下自己的投資契機\n\n**重點提示 TIPS**\n\n碰巧聽到的新聞或小道消息，有可能成為投資契機\n\
    請畫一條橫線，在下方記錄你感興趣的消息\n\n**筆記例**\n\n| 日期 | 內容 |\n| :--- | :--- |\n| 9 月 1 日 | 索尼股\
    \ |\n| | 1,700 × 100 股 = 170,000 |\n| | 值得期待，故長期持有。 |\n| | 1 年後漲到 1,900，確定賺。 |\n\
    | | 獲利 20,000。 |\n\n新聞說遊戲產業爆紅！\n之後要多關注遊戲產業！\n（像這樣寫下自己感興趣的資訊）\n\n## 縮小範圍，創造驚喜！都能必備的「賺錢筆記法」\n\
    \n**SUMMARY**\n\n- 用三十萬（絕對只花八百圓!）基金獲得「經濟自由」。\n- 使用「賺錢筆記」，即可冷靜行動，不會受情緒波動影響。\n-\
    \ 區分「被投資種類領域」，將風險降到最低。\n- 被投資要成功，重點在於利用「PDCA」循環修正軌道。\n- 看到感覺超熱情報，簡單記在「賺錢筆記」裡，財源自然增加。\n\
