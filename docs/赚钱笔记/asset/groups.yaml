    ## 有錢人都贏在這些習慣


    有錢人和窮人哪裡不一樣？


    在第3章精神無負擔！徹底消除浪費的驚人節約術中，我們討論過有效的省錢方法。


    不過，各位不是為了過上勤儉生活才購買本書的。我相信你們對錢都有夢想，也想成為有錢人。


    問題是，要當上有錢人並不容易。


    畢竟有錢人的行爲和思考，與普通人大相徑庭。


    所以我在這一章，要告訴各位有錢人的想法和行動習慣。當然，我也會介紹一些馬上就能實踐的內容。


    在舉辦財經講座和出版書籍的過程中，我認識不少有錢人。我學了很多，這些習慣也是我實際試過的有效方法，請各位信任我繼續讀下去。有的東西你們可能會覺得和錢沒關係，但其實那都是有錢人共通的習慣。


    ## 懂得真正有價值的事物


    前面也說過很多次，記錄「賺錢筆記」讓我還清欠款，並在經濟上享有餘裕。換句話說，我從人生的谷底往上爬，成功東山再起。


    現在的我不用擔心金錢問題，也有些人很好奇我是怎樣花錢的。基本上我不會浪費，當然偶爾會花點小錢放鬆一下，但已經根深柢固的金錢觀念，是不會輕易失去的。


    過去，我不惜欠債也要花錢買自己喜歡的東西，那時候的我和現在的我有個決定性的差異。


    這份差異就是「只把錢用在真正有價值的事物上」。


    現在的我看到再貴的東西，只要確信「對自己有必要，而且有價值」，我就會毫不猶豫地買下。


    相對的，再怎麼便宜的物品，若是「對自己沒必要」，我絕不會購買。也就是說，我以自己的判斷基準做選擇，不會受價格擺布。


    以前的我似乎太拘泥「高價就是好」的價值觀，崇尚名牌也是這種觀念作祟吧。


    如今，我只買自己需要的東西，無關高價或低價，這是因為我內心已經有無可動搖的價值基準。


    「這對我真的有必要嗎？」


    ## 「有錢人的好習慣2」

    ### 從來不會捨不得


    在用錢的時候，請養成這麼反問自己的習慣。


    花錢後記錄「賺錢筆記」，就能反省是否為必要花費。


    等你懂得用自己的價值觀來選擇物品，就不會被流行影響或是打腫臉充胖子，購物反而會更有樂趣。


    現在很流行「斷捨離」。


    我發現這個觀念對存錢意外的有幫助。


    我還是先說明一下「斷捨離」的觀念。所謂的「斷捨離」是指捨去不必要的東西，減去身邊的累贅，獲得精神上的富足生活。


    以前我也是一個「不懂得丟東西的人」。


    狹窄的房間裡，放了一堆根本沒在穿的衣服。奇怪的是，同款不同色的衣服竟然多達五件……


    另外還有不看的 DVD 和書堆，我的房間就是典型的「連走路空間都沒有的倉庫」。


    因此，我完全不知道真正重要的東西放在哪裡，這種人是不可能成為有錢人的。


    根據我的經驗，擁有財富的人都擅長整理東西，也懂得「斷捨離」。


    他們的桌面、書架、腦袋裡，不會有多餘的東西，一切都整理得井然有序。


    「井然有序」是指在必要的時候，可以馬上拿出必要物品的狀態。


    所以他們才能抓準時機、把握機會。


    那麼該如何整理得「井然有序」呢？


    答案很簡單！


    想也知道，丟掉不要的東西就行了。


    - 請打開衣櫃，丟掉一整年都沒在穿的衣服

    - 順便看看書架，把那些沒在看的書拿去舊書店賣掉

    - 最後打掃書桌，丟掉不必要的文件


    這樣一來，周圍有什麼東西就變得一目瞭然，關鍵時刻即可找到必要的東西。


    當然，腦袋裡也要整理乾淨，才不會放過千載難逢的機會。


    「捨不得丟東西的人」，請一天捨棄一樣多餘的物品。


    然後記錄在「賺錢筆記」上，腦袋裡的思緒也會變得愈來愈清晰。


    ## 11種思維和行動模式


    ### 有錢人的好習慣3

    #### 不吃漢堡


    懂得理財的人很少吃外食，這是我從個人經驗學到的教訓。前面也提過，我在十年前負債累累，體重將近九十六公斤。那時候我的飲食習慣很糟糕，晚上和朋友喝酒都要喝個兩三攤才肯罷休，半夜兩點還跑去吃拉麵，當然早餐吃不下，中餐就吃漢堡之類的速食解決。傍晚補習班快要開始上課時，就和同事一起吃高卡路里的垃圾食物。這種生活持續好幾年，體重逼近九十八公斤也是理所當然。自從記錄「賺錢筆記」，我才知道吃速食有多花錢。例如，我在某漢堡專賣店點一份套餐，少說就要花掉六百日圓（約新臺幣一千六十八元）。


    相對的，去超級市場買東西，比漢堡更健康的小菜用二百日圓（約新臺幣五六元）到三百日圓（約新臺幣八十四元）就買得到。


    自己在家煮飯，遠比每餐吃速食套餐便宜，對身體也比較健康。


    晚餐的話，趁晚上七點以後的減價時段去超市買東西，還能用低價買到豪華生魚片。


    幸好我當時一心想還清債務，所以改成自己煮飯，完全不吃外食。因此我減去三十公斤的肥肉，也成功存了筆錢。如果我繼續吃外食，不但債務還不完，說不定還要花錢治療代謝症候群吧。


    我建議各位盡量自己煮飯。是說，最近懂得煮飯或自備茶水的男人很受歡迎喔！


    自己煮飯有減少體重和節省開銷的雙重效果，請務必嘗試。


    ### 有錢人的好習慣 4

    #### 早睡早起


    會存錢的人，就是「懂得管理自我」的人。


    想當然耳，懂得管理自我的人，不會一直看電視看到深夜，也不會假日睡到中午還不肯起床。


    他們都過著早睡早起的生活。


    我的投資伙伴和作家好友，也都過著規律的生活。


    依照我的經驗，人類腦袋最清醒的時間，是清醒後的兩小時左右。


    尤其在大家還沒起床的寧靜早晨工作，不用擔心被電話或電子郵件打擾，工作處理起來非常迅速，好點子也特別多。


    所以我現在清晨四點就起床。


    首先我會沖一杯熱咖啡，慢慢品茗著咖啡，打開電腦。然後確認股價和新聞，接著回覆電子郵件。


    等頭腦清醒後，就開始揣摩下一次演講的題目，或是撰寫文章。


    我的工作大約從早上六點開始，忙到上午十一點結束。


    繼續忙下去太過疲勞，也想不出什麼好點子，因此下午我主要安排開會或會客。


    到了下午五點就去吃晚餐，偶爾找朋友喝點小酒，晚上十點準時就寢。


    簡直就是健康乖寶寶的生活是吧？


    自從我養成早睡早起的習慣，存款愈來愈多，工作機會也增加了。


    早睡早起的人身心健康，也比較容易想出好點子，我想這也是儲蓄增加的一大原因。當然，沒有浪費錢參加續攤也是原因之一啦！


    既然都開始記錄「賺錢筆記」了，乾脆也記錄一下起床和就寢時間吧！


    你一定會發現早睡早起的日子活動量特別高。


    俗話說：「時間就是金錢。」


    時間是無可取代的貴重資產。


    能否善用時間，幾乎決定了人生的成敗。


    例如，每天花五分鐘背三個英文單字，一年下來就背了一千零九十五個單字。


    背下這些英文單字後，說不定就能發揮英文特長，結交外國朋友，從事一些服務國外客戶的生意，你的世界肯定會變得更寬廣。


    當然現實沒有那麼簡單，我指的是你可以更容易抓住機會。


    相較之下，整天傻乎乎地看電視又如何呢？


    看個節目五分鐘很快就過去，一年下來還是什麼收穫也沒有。


    電視的確會提供一些有益的訊息，但要留意的是，毫無節制地一直看下去，只會剝奪你寶貴的時間。


    如果你真的很想看電視，請錄下你需要的節目，這樣就不會毫無節制地看下去。


    戒不掉這種壞習慣的人，把自己每天看電視的時間記在「賺錢筆記」的空白處。


    如此一來，你就會清楚知道自己被電視奪走多少寶貴的時間。


    千萬不要小看區區五分鐘。


    別整天待在電視機前面，好好把時間用在生財之道上吧！


    ### 有錢人的好習慣 5

    #### 不亂發名片


    要度過充實的私生活，或是在商场上獲得成功，拓展人脈都是不可缺的。


    過去，我常常參加異業交流會，尋求有意義的邂逅。我就像一臺「名片交換機」一樣，到處和別人交換名片。


    最誇張的時候，一次交流會能換到一百張名片。


    「不錯喔！今天認識這麼多人，或許能得到什麼工作機會！」


    我興高采烈地回到家裡，準備立刻聯絡對方。可是當我打開電腦，卻連一個字也打不出來。


    看著那一疊名片，我完全想不起對方的長相，也不記得他們的工作和對話內容。

