    ## 懂得真正有價值的事物


    前面也說過很多次，記錄「賺錢筆記」讓我還清欠款，並在經濟上享有餘裕。換句話說，我從人生的谷底往上爬，成功東山再起。


    現在的我不用擔心金錢問題，也有些人很好奇我是怎樣花錢的。基本上我不會浪費，當然偶爾會花點小錢放鬆一下，但已經根深柢固的金錢觀念，是不會輕易失去的。


    過去，我不惜欠債也要花錢買自己喜歡的東西，那時候的我和現在的我有個決定性的差異。


    這份差異就是「只把錢用在真正有價值的事物上」。


    現在的我看到再貴的東西，只要確信「對自己有必要，而且有價值」，我就會毫不猶豫地買下。


    相對的，再怎麼便宜的物品，若是「對自己沒必要」，我絕不會購買。也就是說，我以自己的判斷基準做選擇，不會受價格擺布。


    以前的我似乎太拘泥「高價就是好」的價值觀，崇尚名牌也是這種觀念作祟吧。


    如今，我只買自己需要的東西，無關高價或低價，這是因為我內心已經有無可動搖的價值基準。


    「這對我真的有必要嗎？」


    ## 「有錢人的好習慣2」

    ### 從來不會捨不得


    在用錢的時候，請養成這麼反問自己的習慣。


    花錢後記錄「賺錢筆記」，就能反省是否為必要花費。


    等你懂得用自己的價值觀來選擇物品，就不會被流行影響或是打腫臉充胖子，購物反而會更有樂趣。


    現在很流行「斷捨離」。


    我發現這個觀念對存錢意外的有幫助。


    我還是先說明一下「斷捨離」的觀念。所謂的「斷捨離」是指捨去不必要的東西，減去身邊的累贅，獲得精神上的富足生活。


    以前我也是一個「不懂得丟東西的人」。


    狹窄的房間裡，放了一堆根本沒在穿的衣服。奇怪的是，同款不同色的衣服竟然多達五件……


    另外還有不看的 DVD 和書堆，我的房間就是典型的「連走路空間都沒有的倉庫」。


    因此，我完全不知道真正重要的東西放在哪裡，這種人是不可能成為有錢人的。


    根據我的經驗，擁有財富的人都擅長整理東西，也懂得「斷捨離」。


    他們的桌面、書架、腦袋裡，不會有多餘的東西，一切都整理得井然有序。


    「井然有序」是指在必要的時候，可以馬上拿出必要物品的狀態。


    所以他們才能抓準時機、把握機會。


    那麼該如何整理得「井然有序」呢？


    答案很簡單！


    想也知道，丟掉不要的東西就行了。


    - 請打開衣櫃，丟掉一整年都沒在穿的衣服

    - 順便看看書架，把那些沒在看的書拿去舊書店賣掉

    - 最後打掃書桌，丟掉不必要的文件


    這樣一來，周圍有什麼東西就變得一目瞭然，關鍵時刻即可找到必要的東西。


    當然，腦袋裡也要整理乾淨，才不會放過千載難逢的機會。


    「捨不得丟東西的人」，請一天捨棄一樣多餘的物品。


    然後記錄在「賺錢筆記」上，腦袋裡的思緒也會變得愈來愈清晰。


    ## 11種思維和行動模式


    ### 有錢人的好習慣3

    #### 不吃漢堡


    懂得理財的人很少吃外食，這是我從個人經驗學到的教訓。前面也提過，我在十年前負債累累，體重將近九十六公斤。那時候我的飲食習慣很糟糕，晚上和朋友喝酒都要喝個兩三攤才肯罷休，半夜兩點還跑去吃拉麵，當然早餐吃不下，中餐就吃漢堡之類的速食解決。傍晚補習班快要開始上課時，就和同事一起吃高卡路里的垃圾食物。這種生活持續好幾年，體重逼近九十八公斤也是理所當然。自從記錄「賺錢筆記」，我才知道吃速食有多花錢。例如，我在某漢堡專賣店點一份套餐，少說就要花掉六百日圓（約新臺幣一千六十八元）。


    相對的，去超級市場買東西，比漢堡更健康的小菜用二百日圓（約新臺幣五六元）到三百日圓（約新臺幣八十四元）就買得到。


    自己在家煮飯，遠比每餐吃速食套餐便宜，對身體也比較健康。


    晚餐的話，趁晚上七點以後的減價時段去超市買東西，還能用低價買到豪華生魚片。


    幸好我當時一心想還清債務，所以改成自己煮飯，完全不吃外食。因此我減去三十公斤的肥肉，也成功存了筆錢。如果我繼續吃外食，不但債務還不完，說不定還要花錢治療代謝症候群吧。


    我建議各位盡量自己煮飯。是說，最近懂得煮飯或自備茶水的男人很受歡迎喔！


    自己煮飯有減少體重和節省開銷的雙重效果，請務必嘗試。


    ### 有錢人的好習慣 4

    #### 早睡早起


    會存錢的人，就是「懂得管理自我」的人。


    想當然耳，懂得管理自我的人，不會一直看電視看到深夜，也不會假日睡到中午還不肯起床。


    他們都過著早睡早起的生活。


    我的投資伙伴和作家好友，也都過著規律的生活。


    依照我的經驗，人類腦袋最清醒的時間，是清醒後的兩小時左右。


    尤其在大家還沒起床的寧靜早晨工作，不用擔心被電話或電子郵件打擾，工作處理起來非常迅速，好點子也特別多。


    所以我現在清晨四點就起床。


    首先我會沖一杯熱咖啡，慢慢品茗著咖啡，打開電腦。然後確認股價和新聞，接著回覆電子郵件。


    等頭腦清醒後，就開始揣摩下一次演講的題目，或是撰寫文章。


    我的工作大約從早上六點開始，忙到上午十一點結束。


    繼續忙下去太過疲勞，也想不出什麼好點子，因此下午我主要安排開會或會客。


    到了下午五點就去吃晚餐，偶爾找朋友喝點小酒，晚上十點準時就寢。


    簡直就是健康乖寶寶的生活是吧？


    自從我養成早睡早起的習慣，存款愈來愈多，工作機會也增加了。


    早睡早起的人身心健康，也比較容易想出好點子，我想這也是儲蓄增加的一大原因。當然，沒有浪費錢參加續攤也是原因之一啦！


    既然都開始記錄「賺錢筆記」了，乾脆也記錄一下起床和就寢時間吧！


    你一定會發現早睡早起的日子活動量特別高。


    俗話說：「時間就是金錢。」


    時間是無可取代的貴重資產。


    能否善用時間，幾乎決定了人生的成敗。


    例如，每天花五分鐘背三個英文單字，一年下來就背了一千零九十五個單字。


    背下這些英文單字後，說不定就能發揮英文特長，結交外國朋友，從事一些服務國外客戶的生意，你的世界肯定會變得更寬廣。


    當然現實沒有那麼簡單，我指的是你可以更容易抓住機會。


    相較之下，整天傻乎乎地看電視又如何呢？


    看個節目五分鐘很快就過去，一年下來還是什麼收穫也沒有。


    電視的確會提供一些有益的訊息，但要留意的是，毫無節制地一直看下去，只會剝奪你寶貴的時間。


    如果你真的很想看電視，請錄下你需要的節目，這樣就不會毫無節制地看下去。


    戒不掉這種壞習慣的人，把自己每天看電視的時間記在「賺錢筆記」的空白處。


    如此一來，你就會清楚知道自己被電視奪走多少寶貴的時間。


    千萬不要小看區區五分鐘。


    別整天待在電視機前面，好好把時間用在生財之道上吧！


    ### 有錢人的好習慣 5

    #### 不亂發名片


    要度過充實的私生活，或是在商场上獲得成功，拓展人脈都是不可缺的。


    過去，我常常參加異業交流會，尋求有意義的邂逅。我就像一臺「名片交換機」一樣，到處和別人交換名片。


    最誇張的時候，一次交流會能換到一百張名片。


    「不錯喔！今天認識這麼多人，或許能得到什麼工作機會！」


    我興高采烈地回到家裡，準備立刻聯絡對方。可是當我打開電腦，卻連一個字也打不出來。


    看著那一疊名片，我完全想不起對方的長相，也不記得他們的工作和對話內容。

    '
  mdcn: '

    借現金都用上了。


    後來我發憤節省，只留下一張不用繳年費的信用卡，剩下的全部解約。現在我也還是只用一張而已。


    舉凡購買日常生活用品，乃至旅行之類的大開銷，我都用那張信用卡支付。水電費之類的費用，也是信用卡支付。


    不過有一個原則是，全部開銷一次付清，絕不用分期付款。


    只用一張信用卡，每個月光看一張寄來的明細表，就能掌握所有支出，管理金錢也變得很輕鬆。


    已經出社會的人大概都有信用卡吧？有些人可能和我一樣，大多數的支出都是用信用卡付款。


    可是，請各位小心分期付款。


    例如你買了十萬的東西，隔月就必須支付一萬和每月的利息，這種付款方式會讓你以為支付起來沒壓力。


    然而，你必須支付十個月的利息。


    尤其是這種分期方式讓每个月的支出難度相對變低，因此很多人都不懂得節制。


    當支付的款項變多，你就搞不清楚每月要付多少錢、自己在哪裡買了什麼、還有多久才會付清。


    萬一你用了分期付款，請盡快付清款項，並且在日後都使用一次付清的方式吧。


    另外請各位留意信用卡的張數，控制在三張就好。


    否則，你可能會忘記自己在哪裡買過什麼東西，甚至連要支付的金額都不曉得。


    然後每一家銀行的扣款時間又不一樣，你會更加一頭霧水。


    只留一張信用卡的好處是，可享有積點和其他優惠。


    反正同樣是付款，以信用卡付款積點，就能將「消費」變成「投資」。


    有些信用卡辦理後就能享有特殊的優惠。


    每一家銀行所提供的積點和優惠各不相同，請選擇適合自己生活風格的吧。


    如果各位有常光顧的店家，辦理該店家發行的卡特別有利。常出差或喜歡旅行的人，辦一些航空公司發行的卡，累積飛行點數兌換機票也好。搭配電子貨幣還能存到更多點數，很多財經雜誌都有相關報導，各位不妨參考看看。


    ## 節術 9

    ### 手機通信費和學費

    #### 檢視你的通話月租、健身房月費


    報章雜誌的訂閱費、健身房或英文補習班的月費，這些東西要是沒在利用，根本是浪費錢而已。


    報章雜誌這種東西，訂一份自己真正需要的就好。手機也很容易害我們多花不必要的金錢。尤其和好友聊天時，一個不小話題扯遠，通話時間就會變很長。


    講電話要盡量言簡意賅，事先思考一下自己可能長談的對象是誰，然後用電子郵件與對方聯絡。


    更計較一點的話，變更資費方案，重新檢討過多的網路費，也能省下不少開銷。


    節省，請從檢討多餘的固定開銷做起。


    ## 節約術 10

    ### 改用自動儲蓄！

    #### ——不需毅力，月光族最適用！


    讓支出低於收入，多餘的錢就能存起來。你們可能覺得我在講廢話，偏信這種理所當然的事情很多人都辦不到！


    相信不少人和我以前擔任講師一樣，明明薪水不錯，卻完全存不到錢對吧？


    我建議那些月光族，使用銀行的「自動定存」服務。


    每個月銀行會把你設定的金額，「強制性」自動轉換成定存。


    任何一家銀行都能幫你用現有的戶頭辦理，不需要特地開設新的戶頭。


    自動定存是一種在無形中，往同一個戶頭裡定期儲蓄的系統。


    一旦設定以後，每個月就會強制扣掉規定的金額。但是額度千萬不要設定太高，否則生活費不足，就難以持續下去。


    儲蓄，要持之以恆才有意義。


    一開始存個一萬日圓（約新臺幣二七八八元）左右就好，先從輕鬆的金額開始存起。


    等你進一步開始投資的時候，再利用網路券商或網路銀行的「定期定額投資服務」。


    這種服務與銀行的自動定存一樣，每個月會自動購買你所指定的投資額度。


    如果你是抱著「先省錢，有多的錢再拿來儲蓄或投資」的想法，那你永遠都存不了錢。


    除非你收入豐厚，或是非常勤儉持家，否則不可能會有多餘的錢。


    自動定存會在無形中，幫你「保管」一部分的收入。


    想存錢的人，請積極利用這項服務。


    ## 節約篇

    ### 薪水一口氣全領出來

    #### ——筆記本加信封就可以幫你一鎖錢！


    有些人可能很困惑，明明自己不久前才領到薪水，怎麼不知不覺間就用光了？


    這是常有的事情，並不是多光怪陸離的現象。


    縱使你有心想省錢，但是只要你的錢包裡有放錢，就很容易不假思索地花掉。


    那麼，該如何預防自己亂花錢呢？


    唯一的方法是「分配預算」。


    亦即預測自己每個月要花多少錢，事前分配好不同用途的款項。


    我知道有人會想立刻吐槽：


    - 「哪有辦法預測自己每個月要花多少錢啊？」


    放心吧，記錄「賺錢筆記」就很容易預測了。


    持續記錄開銷一個月以後，你大概就能了解自己每個月需要多少錢。


    等薪水入帳後，請先全部領出來，以「伙食費」「交通費」等項目分類管理，並且放到不同的信封裡。


    如果信封空了，那個月就不能再多花錢。這種方法持續幾個月，你就會分配預算，懂得有計畫地用錢。


    方法本身很原始，但絕對可以幫你養成分配資金和省錢的習慣。


    有了閒錢以後，請確保投資的預算吧。


    關於投資，我會在「第5章 從小散戶到投資高手都必備的投資筆記術」說明，光是存錢無法增加財富。不過我建議各位有了某種程度的資金再來投資。


    投資，得先到券商開設證券戶頭。領到薪水後，請匯入投資的預算吧。


    ## 節約術 12

    ### 「消費」和「浪費」

    #### 都能化為「投資」


    我在上一章已提過把支出分為「消費」「投資」「浪費」的方法。


    在「賺錢筆記」裡記錄每一筆開銷時，養成分門別類的習慣，就會自然掌握金錢觀。


    不消說，想存錢，就要盡力降低「消費」和「浪費」，增加「投資」的比例。


    這裡我們要更進一步，思考將「消費」轉換成「投資」的方法。所謂的「消費」是指維生的「必要經費」，因此進行某種程度的節儉後，很難再節省開支。


    不過，稍微改變一下觀念，就能將「消費」轉換成用在自己前途上的「投資」。


    例如每天的午餐錢，一個人獨自用餐就是純粹的「消費」，但商務性的餐會或交流就算得上「投資」。喝酒的花費也是一樣。去參加酒會不要只顧喝酒，要懂得交換對自己有前途有利的情報，這也是一種很棒的「投資」。不是只有金錢才能分為「消費」「投資」「浪費」，時間也可以。通勤時間對那些只會發呆的人來說，純粹是一種「消費」。相對的，會利用通勤時間學習英文或讀書的人，那段時間就是對未來的「投資」。改變自己的思維，就能將「消費」轉變成「投資」。『這筆錢（或時間）有沒有辦法轉換成『投資』呢？』養成這種勤加思考的習慣，你的行動自然會有所改變，再也不會浪費金錢或時間。


    ## 不要去太遠的超級市場


    前面已經寫過許多有利省錢的情報，但有一點要請各位留意。那就是，不要為了省錢浪費寶貴的時間。時間是非常重要的資產，有時間就可以思考賺錢的方法，或是去認識一些能夠帶給你商機的人。


    浪費金錢的人，通常也不懂得珍惜時間。過去我債務累累時就是這樣，和別人約定好碰面時間，我會沒理由地遲到兩三分鐘。去參加酒會時，也一定要喝到深夜才甘心。自我開始記錄「賺錢筆記」，對金錢和時間的觀察都改變了。


    當你有自覺地使用金錢和時間，自然會產生「捨不得浪費」的心情。錢這種東西有心就賺得到，時間可就不行了。再怎麼有錢的人，一天也還是只有二十四小時。


    浪費時間的人絕不會是有錢人。


    當你赴約遲到，你也等於在浪費別人的時間，這種人在商場上得不到信任。


    我一開始用「金錢記錄法」節省開銷的時候，有一陣子只要買東西多省一塊錢，就會感到非常開心。我經常比較好幾家超市的傳單，刻意跑去便宜一點的店家購買，路途遙遠也在所不惜。


    然而，這很明顯是「失敗的方法」。乍看之下是省錢的做法沒錯，但爲了省一點小錢浪費寶貴時間，完全是本末倒置。


    為了買到便宜的東西，花一整天時間去郊外的商場也沒好到哪裡去。


    把來回的時間用在其他地方，絕對可以更有效率地賺錢。


    學習技能或許不會馬上反映在你的薪水上，但學習語言或考取工作上的證照，也都需要充分的時間。


    使用時間也請精打細算。


    ## 薪水不漲的時代，

    ### 一樣有辦法存錢！


    各位讀到這裡，大概都知道省錢的竅門了吧？我再提供各位一個建議。


    大幅降低生活水平，對精神的打擊非常大。就算成功省下了錢，然而失去生存的意義和樂趣是得不償失的事情。


    像我是因為債務纏身，在兩害相權取其輕的状况下，才有辦法忍耐那種生活。如果各位情況沒有我嚴峻，在不會造成壓力的範圍內重新檢討就夠了。


    在檢討生活的同時，也得摸索增加收入的方法。


    現在景氣不好，有本事轉職增加收入的人也不多吧？所以請各位思考看看，是否能從事什麼副業。


    聽到「副業」這個字眼，各位可能以為難度很高。其實利用網路拍賣，販賣自己不用的東西也是一個辦法。


    我就趁搬家的時候，賣掉過去亂買的名牌服飾，還有堆積如山的書和DVD。


    我不但賺回了一百萬（約新臺幣二十八萬元）左右，狹窄的房間也整理得乾淨淨，還養成了捨棄多餘物品的好習慣。


    如今回想起來，我很佩服自己撐過那段艱苦歲月。過去我的生活放蕩揮霍，不是酗酒就是賭博，這兩種生活的反差實在有夠大。


    當然，我也好幾次差點放棄。


    「賺錢筆記」是支持我撐下去的好伙伴。


    記錄開銷，你每天的努力就會化為明確的數字表現出來。當你看到債務愈來愈少，簡約就會是一件很愉快的事情。


    把「將來的夢想」寫在筆記上，也帶給我不小的鼓勵。多虧有「賺錢筆記」，我才能順利達成目標。


