    請各位看著筆記，思考自己的開銷應該歸在哪一類。一開始不必想太多，憑直覺判斷也沒關係。


    過程中你可能會注意到，有些支出你以為是「投資」，其實是「浪費」；或者你以為自己的生活開銷很基本，沒想到花費卻高得嚇人。


    用心思考這三大支出的區別，持續記錄金錢流向，沒多久你就能立刻判斷自己的開銷該在哪一類，這樣一來你就成功了。


    有了這種精打細算的「金錢觀」，你再也不會隨便亂花錢了。


    ## 「賺錢筆記」第 2 階段記錄法


    ### 重點提示 TIPS


    - 從第三十天開始，把開銷分成「消費」「投資」「浪費」來記錄

    - 其他部分的記錄法同第一階段


    ### 筆記例


    | O月O日 | O月O日 | O月O日 |

    |---|---|---|

    | **消費** | **投資** | **浪費** |

    | 便當 480 | 商業書 1,365 | 雜誌 980 |

    | 茶 135 | | |

    | 水 100 | | |

    | 午餐 700 | | |

    | | | 總計：3,760 |


    畫兩條直線，將開銷分成「消費」「投資」「浪費」三大種類


    ### 區分開銷的標準


    - 消費：房租房貸、水電費、交通費、伙食費等等

    - 投資：儲蓄、股票、學費等用在自己前途上的開銷

    - 浪費：賭博、酗酒、名牌貨等等


    # 1天1分鐘，60天內存到錢的財務記術（三）「賺錢筆記」的金錢記錄法


    ### 終極比例


    這裡要留意的是，千萬不要太勉強自己。


    「金錢記錄法」開始上軌道後，個性認真的人會盡量抑制「消費」，徹底減少「浪費」。這樣可以把錢挪到「投資」項目，存到更多的金錢。


    不過，這就和減肥一樣，太勉強自己會累積壓力，很容易再次復胖。要持之以恆地記錄下去，偶爾也需要放鬆一下才行。有時候小小浪費一番，不用太斤斤計較省錢。


    然而，沒有自覺的花錢方式是不行的。這樣說好了，就算要浪費，也得精打細算才行。


    以我個人的經驗來說：


    消費占七〇%，投資占二〇%，浪費一〇%。


    保持這樣的比例是最理想的，可以輕鬆地持續下去。


    話雖如此，也許有人覺得一開始「投資」要花二〇%太辛苦。若是這樣的話，用階段性的方式達成這個比例也行。


    ### 偷偷挪動10%，保證不會半途而廢


    我在提供財務諮詢的時候，都會建議大家，先用「消費七〇%、投資一〇%、浪費二〇%」的比例生活一段時間，然後再慢慢調整到理想的比例。


    很多人原本在「浪費」的項目就占了三〇%，因此先減去一〇%，把這一○%挪到「投資」——若能做到就很了不起了！


    總之，不要太勉強自己，否則半途而廢就沒意義了！


    我剛開始記錄「賺錢筆記」時，是以「消費八○%，投資二○%，浪費零」的氣勢猛衝，徹底節省開銷。


    應該說，我也只能照這個比例。


    相信各位都知道，我把「消費」提升到八○%，是要還債的關係。總之我想盡快還清債務。等我還完債後，又調回輕鬆的比例。


    現在，我偶爾會用一○%的「浪費」來「發洩壓力」，同時持續管理自己的金錢。


    各位千萬不要省過頭，變成一個「小氣鬼」，刪減到必要開支可就本末倒置了。


    例如，整天比對不同賣場的傳單，為了省一塊錢跑去較遠的地方買東西，這根本就是浪費自己的時間。


    有那個時間的話，還不如多讀一本書，或是參加有興趣的講座，這樣對自己反而比較有幫助。


    要懂得把金錢和時間，花在自己的前途上。


    ### 你自以為的「消費」，其實都是「浪費」


    等你花錢會考量「開銷比例」以後，請每個星期統計一次「賺錢筆記」，更詳細地確認自己的花錢方式。


    重點是回顧自己花的每一筆錢，好好反省需要改進的地方。凡有任何領悟都寫下來，填滿筆記本空白的地方。


    例如，你可能会發現，某些酒會你應該拒絕參加，不該被可愛的妹誘惑；或是在晚輩面前打腫臉充胖子，點了很貴的午餐來吃……就連記錄這種無聊瑣事，都能幫助你了解自己的用錢傾向。在記錄的過程中，反思那些開銷是否真有必要的必要。很多情況下，你自以為是「消費」的項目，其實是「浪費」。


    ### 籌開「賺錢筆記」空白處


    **重點提示 TIPS**


    - 在筆記的空白處寫下自己的省思

    - 可掌握自己用錢的傾向

    - 防止一些看似「消費」實為「浪費」的開銷


    **筆記例**


    | | **消費** | **投資** | **浪費** |

    |---|---|---|---|

    | **〇月〇日** | 便當 480 | 商業書 1,365 | 雜誌 980 |

