    \n## 「投資筆記」的最大功效 —— 獨立思考、冷靜判斷、有效佈局\n\n在記錄投資項目時，不要只記錄金融商品的種類與購買時間，購買的理由也請記下來。當你選擇某項商品，背後一定有你自己的想法或理由。\n\
    \n例如，你買某家公司的股票是出於支持、買外幣則是期待某個國家未來的發展性。\n\n有時候一些小道消息或新聞，也可能成為投資的契機。\n\n假設你看到新聞報導，有愈來愈多家庭組裝太陽能發電系統，於是決定購買太陽能發電的相關企業股，這時請在「賺錢筆記」下面畫一條線，並於橫線下方寫下「期待太陽能」等字樣。\n\
