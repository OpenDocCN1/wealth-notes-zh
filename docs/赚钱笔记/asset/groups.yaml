    無論如何，投資不動產需要相當程度的知識和資金，最好等你有了一定的資產，再以長遠的計畫進行挑戰。


    # 交給專家的不動產投資信託


    缺乏購買不動產的資金或貸款能力，卻依然想投資不動產的人，不妨試試不動產投資信託〔REIT〕（Real Estate Investment Trust）。


    和股票或基金一樣，在證券交易所掛牌的稱為「J-REIT」，同樣能透過券商交易。


    不動產投資信託的原理與基金相同，同樣是由投資客集資，交給經理人投資不動產，然後將賺到的租金或轉賣利益分配給投資客。


    最大的優點是，一戶十萬日圓（約新臺幣二萬八千元）就能開始投資。個人難以購買的大型商業大樓，也能輕易投資。'
