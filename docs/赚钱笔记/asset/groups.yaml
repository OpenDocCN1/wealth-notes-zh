    # 將「浪費」變成「投資」的方法


    自己負擔不起的高額房租，或是久久才開一次的汽車修理費，也都屬於「浪費」。在第3章 精神無負擔！徹底消除浪費的驚人節約術~我會告訴各位，很多時候審視自己的生活水準，就能抑制多餘的開銷。反之，有些支出你以為是「浪費」，其實與「投資」有關，像這種良性的修正也是有可能的。


    例如，我們和朋友去喝酒，喝完以後常常續第二攤，浪費不必要的金錢。我過去也常參加不必要的酒會，續了兩三攤才肯罷休，結果沒車可搭，只好浪費錢搭計程車回家。


    自從開始記錄「賺錢筆記」後，我決定不再參加續攤，但難免會有例外狀況。


    基本上，對我來說參加續攤的費用都屬於「浪費」。當然參加續攤很開心，也有放鬆心情的效果，不能說完全沒有意義，但是在金錢分類上仍屬於「浪費」。


    不過，有些情況下，可能第一攤大家談得很熱絡，因此決定再續一攤深入長談，最後發展成工作上的話題。


    像這就不是「浪費」，應該歸納為「投資」才對。


    在酒會上認識可愛的女孩子，為了想和對方多聊聊而參加續攤，這種情況嘛⋯⋯假如結果不錯，歸納為「投資」也不打緊。


    偶爾為之無所謂啦！


    當你懂得控管那些不假思索的開銷，節省對你來說就不是一件困難或痛苦的事情。


    花錢的方式相當於你的消費行為，有本事管理自己「行為」的人，也能管理自己的錢包。有本事管理自己的金錢、體重、時間。


    透過記錄「賺錢筆記」，我還清五百萬（約新臺幣一百四十萬元）債務。


    多虧我會學會掌管自己的行為，九十公斤的體重減到六十公斤。夜貓子的生活型態也恢復正常，家裡不必要的東西也全部清掉，外觀和生活方式都變得簡約俐落。


    我不只存到大錢，還得到了理想的自己和生活方式。


    # 擁有很多錢後，你要把它拿來做什麼？


    記錄「賺錢筆記」兩個月後，你大概也養成了記錄金錢的習慣，懂得控管自己的花錢方式。


    到了這個階段，請設定自己想達成的目標。


    ### 你存錢想要做什麼？你想實現怎樣的人生？


    請務必思考一下。


    沒有任何夢想或目標，純粹把存錢當成目的，這種人生未免太無趣。


    第一，這樣無法提升「節省儲蓄」的熱忱，甚至會有反效果。


    請先設立一個平實的目標。


    以我來說，我的首要目標是「還清債務」，當然「出國玩」或「買車」也可以。有一個能夠「激勵自我」的目標，管理金錢會更加容易。


    ### 關於金錢與人生，你應該知道的事


    再小的目標也要寫在「賺錢筆記」上，這是非常重要的事情。


    當你遭遇人生低谷，快要放棄的時候，偶爾重溫筆記內容，就能找回當初寫下目標的初衷。


    我之所以建議各位用普通冊子來寫「賺錢筆記」，就是因為可以隨個人喜好調整。


    你要在上面畫圖或貼貼紙都沒關係，反正不是要給別人看的，不妨多下點工夫提升自己的幹勁。


    再怎麼微不足道的目標，達成以後都會有很大的喜悅和成就感。達成的目標愈多，新的展望也就愈壯大。


    當你達成幾個平實的目標後，「人生的夢想和目標」自然會納入你的眼界中。


    像我在二十八歲時接觸了「經濟自由」的價值觀，這個價值觀從此變成我的人生目標。


    我想得到「經濟自由」，不願再受金錢擺布；我想做自己有興趣的工作，不必為五斗米折腰。


    那時候，我不但連「經濟自由」的邊都沒碰到，甚至還有五百萬（約新臺幣一百四十萬元）的債務，這種生活無疑是痴人說夢。


    可是，我把目標寫進「賺錢筆記」以後，六年內培養出一筆資產，還成功實現了自己寫下的生活方式。


    過去對我來說遙不可及的演講和作家事業，如今也實現了。


    為了達成「得到「經濟自由」」的夢想，我持續記錄「賺錢筆記」，同時改掉好幾個壞習慣，不斷身體力行。


    最重要的是，了解自己究竟為何要成為「有錢人」。要是連自己的目標都不曉得，也就無從前進。請先決定一個簡單的目標，踏出第一步。


