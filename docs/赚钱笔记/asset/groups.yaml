    \n![](img/72afc1c3acfb74ce3d14d0f5ea098dd5_173_0.png)\n\n### 什麼是賺錢的架構？\n\n想成為一個有錢人，就得了解錢的本質。\n\
    \n有錢人和普通人到底哪裡不一樣？\n\n答案就是，有錢人帶給許多人影響，讓許多人幸福美滿。\n\n以汽車製造商豐田為例，他們帶給許多人很棒的汽車，豐富大眾的生活，讓更多人享受到便利的生活和幸福。\n\
    \n此外，豐田還提供全世界就業機會和薪資。\n\n企業經營者帶給許多人幸福，並得到高額的報酬作為代價。\n\n相反的，免洗的小角色又是如何呢？\n\n那種人就算少了一個，公司還是照樣可以運轉；既沒有帶給多數人影響，也不容易被替代。\n\
    \n影響，也沒有提供大家幸福，難怪他們得到的代價不高。\n如果你做的是時薪幾百日圓的工作，我希望你能找出不屬於你的商機。\n記住一點，想成為有錢人，就要有辦法影響更多人才行。\n\
    \n你對別人有多少影響，就能得到多少代價。\n\n不懂這一點的人，很難賺到錢。\n\n### 「有錢 ≠ 邪惡」的洗腦方式\n\n由於工作的性質，我常在全國各地舉辦關於財富的座談會或演講，有許多機會聽到大多數人對於金錢的觀念。\n\
    最令我訝異的是，時至今日，「有錢 = 邪惡」的錯誤觀念還是深植人心，這樣是沒辦法帶給多數人幸福的。\n\n而這主要來自父母或師長的洗腦，說來也是挺無奈的事情。\n\
    \n「錢是辛苦賺來的！」\n「錢多的人絕對幹不出什麼好事！」\n\n類似這種價值觀，大概就是來自於長期的錯誤觀念。相信這些說法，各位也聽過才對。\n\n不過，賺大錢和成為有錢人絕不是壞事！\n\
    \n有賺錢能力卻不發揮，這才叫壞事。實際上，你錢賺得愈多，就有愈多人因你而受惠。\n\n因為你提供的商品、服務、勞動力，其代價都是金錢。\n\n請各位謹記一點，你賺錢會刺激經濟運作。如此一來，當你在實現「經濟自由」的過程中內心有所芥蒂，也能好好處理這種心理障礙。\n\
    \n### 成為有錢人的黃金方程式\n\n前面也說過很多次，我在三十四歲時獲得「經濟自由」。自从我決定要掌握「經濟自由」後，我的觀念有很大的改變。這也難怪！畢竟我以前太揮霍無度了……\n\
    \n我參加許多的財富座談會，也看過大量的投資和理財書籍。到頭來，我學會一個很重要的道理。\n\n我能得到「經濟自由」，也是多虧這個道理。什麼道理呢？就是成為有錢人的方程式。\n\
    \n只要理解成為有錢人的黃金方程式，並付諸實踐，任何人都能得到「經濟自由」。這個方程式真的十分有效。\n\n那好，我來介紹這個黃金方程式：\n\n**資產形成\
    \ = (收入 - 支出) + (資產 × 運用報酬率)**\n\n我再詳細說明一下這個方程式的內容。\n\n想要建立資產，實現「經濟自由」，就得從每月收入扣除生活費、交際費、還款等支出，好好活用剩下的金錢。\n\
    \n這時候，收入扣除支出後的金額與運用的報酬率愈高，愈能建立龐大的資產。\n\n換句話說，掌握以下三點任何人都能得到「經濟自由」。\n\n- ① 增加收入\n\
    - ② 減少支出\n- ③ 提高運用報酬率\n\n如何？是不是很簡單呢？\n\n### 資產倍增的「72 法則」\n\n實際上，成為有錢人的方法並不複雜。逐步實踐一些理所當然的道理就行了，而這才是快速成為有錢人的訣竅。\n\
    \n前面稍微提到了資產的報酬率，現在我就來說明資產倍增的方法。當你剛開始投資，可能會略感焦躁，不知道自己什麼時候會得到「經濟自由」。\n\n投資的原則是「莫慌、莫亂、慢慢來」，但是花太多時間達成目標也不好。\n\
    \n畢竟等到七老八十才得到「經濟自由」，能做的事情也很有限。\n\n要趁你還年輕有活力的時候達成金錢目標，就得先知道一項法則。那就是讓財富倍增的「72 法則」。\n\
    \n**72 ÷ 復利率（%）≒ 金錢成為 2 倍的所需年數**\n\n這個法則是基於「市場逐步上揚」的原理訂立，自古以來就有。\n\n以複利率去除七十二，就能算出金錢倍增所需的年數。\n\
    \n例如，你現在擁有一百萬（約新臺幣二十八萬元）的資產，如果十年內想要讓資產多一倍，算法就是：\n\n72 ÷ 10 年 ≒ 7.2\n\n換言之，套用「七二法則」的話，只要你\
    \ 7.2% 的複利率操作十年，就會得到二百萬（約新臺幣五十六萬元）的資產。\n\n如今要以 7.2% 的複利率操作是有點困難，只是希望各位善用這項法則，作為達成金錢目的的指標。\n\
    \n是否了解這個法則有很大的區別。一旦了解這個法則，即使你的資產暫時減少，也能夠冷靜面對問題。\n\n### 其實，你已經有 2 億了…\n\n覺得成為有錢人很困難的人，我有一個好消息要告訴你。\n\
    \n現在的你也許離富裕的目標很遙遠，完全沒有加薪的可能，假日搞不好還得加班，過著與優雅無緣的生活……\n\n也難怪你會覺得，成為有錢人是一件遙不可及的事情。\n\
    \n不過，其實你已經擁有資產了！\n\n光是你沒注意到的資產，就有二億（約新臺幣五千六百萬元）左右。\n\n所謂的資產，不光是指金融資產。\n\n各位應該都聽父母說過，健康是最重要的，身體是最大的資本對吧？這句話說得沒錯，「人」才是未來創造財富的資產。\n\
    \n### 當然，你也是寶貴資產！\n\n假設你年收有四百萬日圓（約新臺幣一百十二萬元）好了。\n\n請你把這四百萬（約新臺幣一百十二萬元），當成未來創造的財富利息。\n\
    \n假設定存的利率是二%，你存入二億（約新臺幣五千六百萬元），一年就等於有四百萬（約新臺幣一百十二萬元）的利益。\n\n這也代表，即使你是一個普通上班族，也相當於擁有一億日圓的資產。\n\
    \n尤其在年輕的時候，最大的資產就是你自己。請多多投資自己，提升自己的資產。\n\n多讀一點書、多參加幾場座談會、多接觸成功人士，努力投資自我是很重要的。\n\
    \n總之，把槓桿原理用在「自己」這個人才資產上，追求最大的報酬。\n\n### 快速成為有錢人的聰明捷徑\n\n請各位思考一個問題。\n\n你在什麼時候最能發揮自己的能力？\n\
    \n我想，答案應該是從事自己喜歡的事情吧？相信你也同意這個答案。\n\n我的投資伙伴也一樣。喜歡投資事業、熱衷於操作的人，其投資績效也特別好。\n\n相對的，擔心蒙受損失，投資膽戰心驚的人容易錯失良機。\n\
    \n如果你未來打算投資，那就請你享受投資。\n\n投資不是你為了得到「經濟自由」而「非做不可的事情」。當你嘗試投資，發現投資並不適合自己，摸索其他方法成為有錢人就行了。勉強自己是不會有好結果的。\n\
    \n### 金錢會遵循市場法則\n\n開始投資後，有件事情千萬要記得，那就是投資和儲蓄不一樣，「不保證你的本金不會遭受侵蝕」。因此，我們容易被眼前的股價變動影響。景氣一變差，害怕虧損的投資客就會開始瘋狂賣出持股。當然，有時候早點認賠殺出是正確的，但這種人不是成功的投資客。成功的投資客，多半具備「不慌、不亂、冷靜」的特質。要避免投資失利，就得擁有這樣的心態。確實，光看短期的市場變動，資產隨著每日股價而增減。不過，以十年、二十年、三十年的長期眼光來看，除非國家崩潰瓦解，否則股價在反覆的漲跌中依舊會緩步上揚。投資客只要秉持「不慌、不亂、冷靜」的方式操作，就算短期內無法大賺，至少也不會蒙受虧損。\n\
    \n無奈，現實是殘酷的！有許多人經歷重大虧損，連生活都有困難。\n\n理由在於市場一下跌，他們就嚇得認賠殺出。如果持續保有手中持股，根據市場法則，股價總會慢慢漲回來。換言之，他們等不到股價回升，就在最低點殺出大賠。投資需要耐心，請好好觀察市場再來行動。\n\
    \n### 資本所得與利息所得\n\n關於投資有個最基本的知識，各位知道什麼是「資本所得」與「利息所得」嗎？\n其實，靠投資獲得的收益主要分為兩種：\n\n\
    - 資本所得：你保有的資產，因價格變動而獲利\n- 利息所得：你保有的某項資產，提供持續而穩定的收入\n\n那我們分別來說明一下。\n以資本所得為例，當一千日圓的股票漲到一千五百日圓，就多了五百日圓的利益。資本所得指的正是這五百日圓的利益。\n\
    反之，當一千日圓的股票跌到八百日圓，就等於產生二百日圓的資本淨損。\n\n至於利息所得，最好懂的例子就是銀行存款利息。以股票投資來說，股東獲得的配股配息也屬此例，基金的收益分配也是利息所得。\n\
    \n各位覺得哪一種比較好？\n利息所得似乎比較穩健安定是吧，但你要有有一定程度的龐大資產，才能享受到利息所得的好處。\n\n最近有些大銀行常打著這樣的招牌：\n\
    「每月自動匯入九千（約新臺幣二千五百二十元）的利息！」\n那些銀行用這種話術，替每月配息的人氣基金宣傳；相形之下，銀行的存款利息根本不夠看。\n\n可是，請各位注意一點。\n\
    基金也是投資價格會變動的股票或債券，其價格也會變動。\n就算每個月都有配息，萬一你持有的基金跌掉配息的額度，你的本金就等於減少了。\n更何況，配息是要扣稅的。\n\
    請各位以長遠的觀點投資，不要被眼前的蝇頭小利迷惑。這樣一來，才能穩健獲得龐大的資產。\n\n薪資不漲……\n每個月的生活艱難……\n很多人都有類似的危機意識，因此才會購買像本書一樣的理財書籍。\n\
    然而，不付出行動，你永遠是錢的奴隸。\n\n有些人不敢付出行動。缺乏行動力是實踐「經濟自由」的一大障礙。首先，請正視不敢行動的自己，這才是成為有錢人的第一步。\n\
    相信各位閱讀至此都已經知道，連我這種廢物也獲得「經濟自由」。換言之，行動才是最重要的！\n\n光是看幾本書，這連小學生都辦得到。請不要忘記，實踐本書的知識才有真正的意義。\n\
    假設有十個人購買書籍，只有三個人會讀到最後，一個人付出行動。希望各位就是那一個人，而這也是贏家和普通人的區別。\n"
  mdcn: "\n## 長期挑戰：不動產投資\n\n主動式基金，是由基金經理人完全操持投資標的和投資比例。\n而指數基金，是與日經或東證這一類特定指標（Index）進行運動操作。換言之，主動式基金的績效有大幅超越市場的可能；反之，也有大賠的風險，手續費之類的成本也很高。\n\
    \n指數基金的變動一向貼近市場平均收益，雖沒有龐大的利益，卻也不會有太大的損失，手續費也相對便宜。\n\n若要長期持有，我建議各位買風險較小的指數基金。\n\
    \n購買土地、公寓、商業大樓等「收益不動產」，再租給別人獲得租金，最大的好處是每個月都有穩定的收入。\n\n我個人認為自住的房子不該貸款購買，但收益不動產就另當別論。\n\
    \n只要把每月的租金收入，設定得比貸款繳納額更高，多的錢就能用來投資。等貸款全部繳完，所有的租金就是你的收入。\n\n然而缺點也不在少數。\n\n例如，有租不出去、租金下滑、建築老舊劣化等風險。如果貸款是浮動利率，也同樣有利息上升的風險。\n\
    \n再者，地震等天災的影響，也可能導致不動產的賣價下跌，造成損失。\n\n若要盡量降低風險，購買時講究以下幾點：\n\n- ① 詳查地段和建築物設備\n-\
    \ ② 預估整修的費用\n- ③ 以長期持有為前提，進行固定利率貸款\n\n這幾項都是必要措施。\n\n無論如何，投資不動產需要相當程度的知識和資金，最好等你有了一定的資產，再以長遠的計畫進行挑戰。\n\
    \n### 交給專家的不動產投資信託\n\n缺乏購買不動產的資金或貸款能力，卻依然想投資不動產的人，不妨試試不動產投資信託〔REIT〕（Real Estate\
    \ Investment Trust）。\n\n和股票或基金一樣，在證券交易所掛牌的稱為「J-REIT」，同樣能透過券商交易。\n\n不動產投資信託的原理與基金相同，同樣是由投資客集資，交給經理人投資不動產，然後將賺到的租金或轉賣利益分配給投資客。\n\
    \n最大的優點是，一戶十萬日圓（約新臺幣二萬八千元）就能開始投資。個人難以購買的大型商業大樓，也能輕易投資。\n\n購買不動產需要實地走訪調查，也必須和不動產業者溝通談判，十分費力耗時。\n\
    \n買到以後光是放著也不會有租金收入，對幫忙的人來說，建築物的管理修繕、與房客交流的「包租公業務」也是一大負擔。REIT 購入以後有專人負責，所以可以放膽嘗試。\n\
    \n各位覺得怎麼樣？\n\n前面介紹的這些金融商品，有特別感興趣的嗎？\n\n學業、工作、投資都是同一個道理，找到自己「喜歡」的項目才是通往成功的捷徑。\n\
    \n只要你認為「有趣」，求知慾自然會愈來愈強，學習投資也一點都不覺得辛苦。\n\n在不斷嘗試的過程中，你一定會發現「適合自己」的投資方式。\n\n## 「PDCA」循環結合「賺錢筆記」，將風險降到最低\n\
    \n決定好要投資的金融商品後，再來要考量「投資組合」。投資組合一聽就很困難是吧？其實很簡單的。\n\n首先，我來說明什麼是投資組合。\n\n一個人的資產以何種形式構成，這就是所謂的投資組合。專業的投資者一定會設立投資組合計畫，加以檢討修正，絕不會隨意運用資產。\n\
    \n我們這些個人的投資客在開始投資後，最好也自行管理投資組合。投資標的愈分散，愈該好好考量投資組合，否則你會搞不清楚自己有多少資產。\n\n接下來要介紹幾個步驟——「計畫」（Plan）、「行動」（Do）、「確認」（Check）、「改善」（Act）。請各位依照這幾個步驟來考量投資。\n\
    \n1. 計畫（Plan）\n    先拿筆記本或一張紙，畫一個圓形圖表，寫下自己理想的投資組合。\n    例如股票三成、基金五成、不動產二成，用這樣的方式寫個大略的比例即可。\n\
    2. 行動（Do）\n    寫好投資組合後，就依照計畫開始投資。\n3. 確認（Check）\n    資產是每日變動的東西，請定期確認（每週或每月）一次。\n\
    4. 改善（Act）\n    順利的話就增加投資額度，遇到意外的損失，就從資產中除去該項投資標的。\n\n### 規劃出完美的投資組合\n\n**重點提示\
    \ TIPS**\n\n- 「投資組合」又稱為「資產構成」\n- 先在紙上畫圓，寫下自己的投資組合\n\n**錯誤例**\n\n![](img/72afc1c3acfb74ce3d14d0f5ea098dd5_164_0.png)\n\
    \n以符合理想投資組合的方式開始投資！\n\n好好檢視自己的投資，就能輕易維持計畫（Plan）、行動（Do）、確認（Check）、改善（Act）這四大「PDCA」循環。\n\
    \n只要「PDCA」發揮機能，就算投資失利，也能馬上進行修正。\n\n我個人反覆實踐「PDCA」循環，將損失的風險降到五成以下。\n\n最大的成果是，我學會了「計畫↓行動↓確認↓改善」的做事方法。\n\
    \n萬一我的人生再次面臨重大失敗，不幸背負龐大的債務，我也一定有辦法東山再起，重獲「經濟自由」。\n\n因為，好好遵守「計畫↓行動↓確認↓改善」的步驟，遲早都能重振雄風。\n\
    \n請各位務必要學會「PDCA」循環。\n\n### 用「PDCA」循環降低風險\n\n**重點提示 TIPS**\n\n在思考資產構成的時候，最講求投資的「PDCA」循環\n\
    「PDCA」循環是一種將風險最小化、利益最大化的指標\n\n**步驟 step by step**\n\n- 1) 計畫 (Plan)\n    先拿筆記本或一張紙，畫一個圓形圖表，寫下自己理想的投資組合。\n\
