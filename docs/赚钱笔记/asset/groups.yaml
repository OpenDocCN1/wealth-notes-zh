    \n決定好要投資的金融商品後，再來要考量「投資組合」。投資組合一聽就很困難是吧？其實很簡單的。\n\n首先，我來說明什麼是投資組合。\n\n一個人的資產以何種形式構成，這就是所謂的投資組合。專業的投資者一定會設立投資組合計畫，加以檢討修正，絕不會隨意運用資產。\n\
    \n我們這些個人的投資客在開始投資後，最好也自行管理投資組合。投資標的愈分散，愈該好好考量投資組合，否則你會搞不清楚自己有多少資產。\n\n接下來要介紹幾個步驟——「計畫」（Plan）、「行動」（Do）、「確認」（Check）、「改善」（Act）。請各位依照這幾個步驟來考量投資。\n\
    \n1. 計畫（Plan）\n    先拿筆記本或一張紙，畫一個圓形圖表，寫下自己理想的投資組合。\n    例如股票三成、基金五成、不動產二成，用這樣的方式寫個大略的比例即可。\n\
    2. 行動（Do）\n    寫好投資組合後，就依照計畫開始投資。\n3. 確認（Check）\n    資產是每日變動的東西，請定期確認（每週或每月）一次。\n\
    4. 改善（Act）\n    順利的話就增加投資額度，遇到意外的損失，就從資產中除去該項投資標的。\n\n### 規劃出完美的投資組合\n\n**重點提示\
    \ TIPS**\n\n- 「投資組合」又稱為「資產構成」\n- 先在紙上畫圓，寫下自己的投資組合\n\n**錯誤例**\n\n![](img/72afc1c3acfb74ce3d14d0f5ea098dd5_164_0.png)\n\
    \n以符合理想投資組合的方式開始投資！\n\n好好檢視自己的投資，就能輕易維持計畫（Plan）、行動（Do）、確認（Check）、改善（Act）這四大「PDCA」循環。\n\
    \n只要「PDCA」發揮機能，就算投資失利，也能馬上進行修正。\n\n我個人反覆實踐「PDCA」循環，將損失的風險降到五成以下。\n\n最大的成果是，我學會了「計畫↓行動↓確認↓改善」的做事方法。\n\
    \n萬一我的人生再次面臨重大失敗，不幸背負龐大的債務，我也一定有辦法東山再起，重獲「經濟自由」。\n\n因為，好好遵守「計畫↓行動↓確認↓改善」的步驟，遲早都能重振雄風。\n\
