    12超不用意な考え方


    ## 精神無負擔！徹底消除浪費的驚人節約術


    ### 負債500萬的敗家子也做得到的節約術


    - 又花了不該花的錢……

    - 想省錢，但總是撐不了幾天就破功……

    - 已經極限，沒辦法再存更多了……


    相信不少讀者都體會過上述的挫折感吧？


    強迫自己不花錢其實不太能達到省錢的效果，也無法持之以恆。換言之，勉強自己才是無法節省開銷的癥結。


    光憑一股毅力，很難戒除浪費的習性。這一章我將介紹輕鬆省錢與減少開銷的法門。連我這種揮霍無度的人都辦到了，各位一定也辦得到！


    請務必實踐看看。寫在「賺錢筆記」上的每日支出紀錄，絕對會比日記更加客觀地反映自己的真樣貌。一個人花錢的方式，會反映出他的價值觀和習慣。


    每天在「賺錢筆記」上記錄花費，你一定會清楚發現自己「存不了錢的原因」。


    其實這才是「賺錢筆記」的最大效果。我也是用「金錢記錄法」持續記錄每筆花費後，才發現自己過去有哪些毫無自覺的「壞習慣」。


    例如，參加酒會續攤、花在檢定考上的錢、多餘的保險費、一時衝動購買名牌、動不動就去便利店買東西……


    ### 12 招不用強意志力的省錢法


    要改變自己的習慣不是件容易的事情。


    不過，當你有了自覺以後，有些浪費的習慣可以馬上改掉。以我的經驗來說，九成的浪費習慣「在我有自覺以後」就改掉了。剩下那一成就需要意志力了……


    我在記錄開銷的過程中，發現自己浪費的原因和價值觀，「賺錢筆記」幫助我確認這些問題的癥結。


    好比說上述的參加酒會續攤、花在檢定考上的錢、多餘的保險費……這些都是寫下來後就能馬上改掉的問題；當然，也有多次經歷挫折和反省，才慢慢改掉的壞習慣。


    最後，我不但還清債務，還把自己存錢的方法和心得歸納成一套系統。任何人都能輕易實踐，請各位務必參考看看。


    接下來就要介紹具體方法了！


    ### 節約術 1

    ### 可大幅調降的保費 你的保險真的買對了嗎？


    前面也多次提過，我在開始記錄「賺錢筆記」後，立刻發現自己的保險費太高了。


    當時，我是二十八歲的單身上班族，卻保有高額的死亡保險，每個月保險開銷高達四萬五千日圓（約新臺幣一萬二千元）。


    保險的受益人是我父親。就算我死後父親能領到大筆保險金，但是讓白髮人送黑髮人實在太不孝了。


    為什麼我會買那種保險呢？


    其中一個原因是缺乏知識，我對保險完全沒有任何了解。


    另一個原因（這才是主要原因），當時來我公司拉保險的女業務，正好是我的菜。


    在她的推薦下，我買了自己根本不需要的保險：……


    考量過和她交往的可能性之後，我發現自己的保險開銷太多餘，馬上果斷解除所有的保險契約。


    後來，我加保外資壽險公司販賣的無退保住院險。光是這樣，我一個月就省下四萬日圓（約新臺幣一萬二千元）以上的開銷。


    每個人的年齡、家族成員、生活方式不同，需要的保險也不一樣。


    如果我未來有需要保護的家人，說不定我也需要人壽保險。到那時候，我就得重新審視自己的保險。


    常常把保險買了就放一邊的人，極有機會大幅降低保險開銷。請不要怕麻煩，重新檢討自己的保險吧。


    ### 「你以為改掉便宜的就能省錢嗎？」


    我第二個砍掉的開銷，就是香菸的費用。


    過去我是個重度老菸槍，每個月花在香菸上的費用高達三萬日圓（約新臺幣八千四百元）。


    開始記錄「賺錢筆記」後，我注意到一件事情，那就是與其減少某種東西的花費金額，不如完全斷乾淨還比較輕鬆。


    香菸就是如此，要戒不戒的反而會增加壓力，適得其反。況且香菸一直在漲價，再怎麼減少支出也難以節省開銷。


    直接戒掉比較爽快，節約效果也特別好。當然，還可以預防抽菸造成的疾病治療開銷，從長遠的角度來看，也能節省醫藥費。另外分享一下，


    ### 節約術 3

    ### 別去續攤 浪費了錢，又賠上了人生！


    我是以戒菸＋香糖成功戒菸。


    戒酒也是一樣的道理。


    話雖如此，酒這種東西真的沒辦法完全不碰。對我來說，酒會不但是重要的社交場合，也是放鬆身心的方法之一。


    因此，我決定不參加續攤。


    我本來就喜歡喝酒，意志力也稱不上堅定。


    以往我去參加酒會，總會續個兩三攤，喝到沒電車可搭，改搭計程車回家，結果又增加不必要的開銷。


    有一個好處是，花在續攤上的時間可以用來做其他事情。


    時間就是金錢，省錢也有活用時間的效果。


    有些人可能會想，不參加續攤太寂寞了啦！但參加第一攤也能充分享受到酒會的樂趣，而且你會更珍惜有限的時間，讓酒會的內容更加充實。


    ### 節約術 4

    ### 占最大開銷的房租 ——租個好房？真的沒必要！


    儘管我利用「賺錢筆記」努力省錢，遺憾的是負債並沒有馬上減少。


    正好那時候我的父親病倒，我必須辭掉補習班的工作，繼承家中的保險代理店。


    在保險公司研修的那幾個月，我的薪水只有區區十三萬日圓（約新臺幣三萬六千元）……


    這樣別說還債了，我連每月的生活都有問題。


    注意到這一點後，我就把自己的生活水準降到最低。


    本來我住在月租八萬（約新臺幣二萬二千四百元）的公寓，後來搬到月租二萬五（約新臺幣七千元）的小雅房。


    那是一間屋齡二十年的三坪小雅房，沒有浴室。雖然生活上有許多不便，但我每月省下五萬（約新臺幣一萬四千元）以上的開銷。


    在一消費一項目之中，房租房貸佔的比例大概是最高的。都市和郊區的租金不同，地區差異也有影響，基本上租金最好不要超過薪水的三成。租金超過三成以上就很難存錢，生活也會變得困苦。


    真的很想住在都市的漂亮公寓的話，請和朋友或戀人一起合租吧。


    另外，我也不建議各位頻繁搬家。搬家的費用、押金、仲介費也是很大的開銷。


    ### 寵物 養車驚驚人！！ 晚個幾年買車，改變你下半生


    由於我大幅刪減租屋費，很多人都問我這樣不辛苦嗎？當時我非常想得到「經濟自由」，所以也就不怎麼覺得痛苦了。


    車子我也不要了，養一輛車很花錢。


    養車必須支付停車費、汽油錢、牌照稅等等，維持費用並不低。更計較一點的話，還有高速公路的過路費、車檢費、承載費、保險费等，開車真的要花上不少錢。


    換言之，在創造資產的階段，不要開車可以發揮比較好的效果。


    如果只是假日要用車，有需要時再去租一輛就夠了，這樣反而比較有效牽。過去租車的費用不便宜，不過現在租車公司林立，競爭十分激烈，租金也便宜許多。


    規定自己只並在必要的時候用車，生活就會變得簡練，多餘的錢也能存起來。


    最近還有汽車共享的服務，請各位利用看看。


    ### 節約術 6 一時衝動買下的衣服——你的衣櫃真的少一件衣服嗎？


    自從決定節省開銷後，我就再也沒買衣服或鞋子。


    追求時尚的人，總是不惜砸大錢購買新衣服。另外，有些興趣確實會造成很大的開銷。


    尤其服飾類的東西，很難克制衝動的購買慾望，錢一下子就花掉了，請務必小心。


    喜歡追求時尚的人，先確認自己有哪些衣服和鞋子。也就是先仔細確認自己到底有哪些東西，如果你想買的衣服與原有的很類似，那就別浪費錢了！


    只買真正需要的就好，光是這樣即可省下一大筆開銷。盡量不要買高級的名牌服飾，買價格適中的就好。


    ### 不容輕忽伙食費、便利商店花錢 三餐都在超商解決，一點也不精打細算


    重新檢討相對「大條」的固定花費，能夠省下不少金錢。


    不過，各位千萬不要大意，日常生活中的小額開銷積少成多，也會變成「大條」的開銷。


    過去我還是個負債累累的敗家子時，每一餐都買外食來吃。基本來說，每天晚上下班後去便利商店已經是我的習慣。


    單身的讀者特別需要留意這一點。


    當你去便利商店，絕對不可能只買一個便當。你可能還會買雜誌、甜點、啤酒等其他的東西，金額高到出乎你的意料。


    便利商店有很多陷阱，會引誘你購買好吃的甜點、雜誌、果汁等物品。每一項小東西也才數十塊、數百塊，你會不自覺地拿去做銀檯結帳……


    我在記錄「賺錢筆記」後，發現自己在便利商店的花費驚人，甚至影響到每月的家計。


    於是我不再去便利商店，改去超級市場購買每天的食物和日用品。便利商店的便當沒在降價的，超級市場的菜色在特賣時間用半價就能入手。


    我也靠自己煮飯，徹底省下伙食費。


    衛生紙之類的日用品也是一樣，趁著超級市場降價的時候多買一些，即可省下不少錢。


    如果你下班後一定要來罐啤酒，至少改喝便宜的發泡酒省點錢吧。


