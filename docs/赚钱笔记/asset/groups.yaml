    從小散戶到投資高手必備的投資筆記術 「投資筆記」的金錢記錄法 182


    1. 計畫（Plan）


    先拿筆記本或一張紙，畫一個圓形圖表，寫下自己理想的投資組合。


    例如股票三成、基金五成、ㄅㄅ二成，用這樣的方式寫個大略的比例即可。


    2. 行動（Do）


    寫好投資組合後，就依照計畫開始投資。


    3. 確認（Check）


