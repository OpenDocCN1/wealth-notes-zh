    天坐在柏青哥的機臺前，就這樣燒掉了好幾萬……除了酗酒和賭博以外，我還很喜歡買東西。現在回想起來，我買了很多自己根本用不起的進口服飾，還自以為穿戴那些東西可以提高身價。


    不用想也知道，我每個月是入不敷出的。


    我用光了五張信用卡的額度，連分期付款和預借現金也用上了。


    後來，我甚至搞不清楚哪一張信用卡花了多少額度，也不知道自己總共欠下多少債務。


