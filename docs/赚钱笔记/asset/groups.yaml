    請各位看著筆記，思考自己的開銷應該歸在哪一類。一開始不必想太多，憑直覺判斷也沒關係。


    過程中你可能會注意到，有些支出你以為是「投資」，其實是「浪費」；或者你以為自己的生活開銷很基本，沒想到花費卻高得嚇人。


    用心思考這三大支出的區別，持續記錄金錢流向，沒多久你就能立刻判斷自己的開銷該在哪一類，這樣一來你就成功了。


    有了這種精打細算的「金錢觀」，你再也不會隨便亂花錢了。


    ## 「賺錢筆記」第 2 階段記錄法


    ### 重點提示 TIPS


    - 從第三十天開始，把開銷分成「消費」「投資」「浪費」來記錄

    - 其他部分的記錄法同第一階段


    ### 筆記例


    | O月O日 | O月O日 | O月O日 |

    |---|---|---|

    | **消費** | **投資** | **浪費** |

    | 便當 480 | 商業書 1,365 | 雜誌 980 |

    | 茶 135 | | |

    | 水 100 | | |

    | 午餐 700 | | |

    | | | 總計：3,760 |


    畫兩條直線，將開銷分成「消費」「投資」「浪費」三大種類


    ### 區分開銷的標準


    - 消費：房租房貸、水電費、交通費、伙食費等等

    - 投資：儲蓄、股票、學費等用在自己前途上的開銷

    - 浪費：賭博、酗酒、名牌貨等等


    # 1天1分鐘，60天內存到錢的財務記術（三）「賺錢筆記」的金錢記錄法


    ### 終極比例


    這裡要留意的是，千萬不要太勉強自己。


    「金錢記錄法」開始上軌道後，個性認真的人會盡量抑制「消費」，徹底減少「浪費」。這樣可以把錢挪到「投資」項目，存到更多的金錢。


    不過，這就和減肥一樣，太勉強自己會累積壓力，很容易再次復胖。要持之以恆地記錄下去，偶爾也需要放鬆一下才行。有時候小小浪費一番，不用太斤斤計較省錢。


    然而，沒有自覺的花錢方式是不行的。這樣說好了，就算要浪費，也得精打細算才行。


    以我個人的經驗來說：


    消費占七〇%，投資占二〇%，浪費一〇%。


    保持這樣的比例是最理想的，可以輕鬆地持續下去。


    話雖如此，也許有人覺得一開始「投資」要花二〇%太辛苦。若是這樣的話，用階段性的方式達成這個比例也行。


    ### 偷偷挪動10%，保證不會半途而廢


    我在提供財務諮詢的時候，都會建議大家，先用「消費七〇%、投資一〇%、浪費二〇%」的比例生活一段時間，然後再慢慢調整到理想的比例。


    很多人原本在「浪費」的項目就占了三〇%，因此先減去一〇%，把這一○%挪到「投資」——若能做到就很了不起了！


    總之，不要太勉強自己，否則半途而廢就沒意義了！


    我剛開始記錄「賺錢筆記」時，是以「消費八○%，投資二○%，浪費零」的氣勢猛衝，徹底節省開銷。


    應該說，我也只能照這個比例。


    相信各位都知道，我把「消費」提升到八○%，是要還債的關係。總之我想盡快還清債務。等我還完債後，又調回輕鬆的比例。


    現在，我偶爾會用一○%的「浪費」來「發洩壓力」，同時持續管理自己的金錢。


    各位千萬不要省過頭，變成一個「小氣鬼」，刪減到必要開支可就本末倒置了。


    例如，整天比對不同賣場的傳單，為了省一塊錢跑去較遠的地方買東西，這根本就是浪費自己的時間。


    有那個時間的話，還不如多讀一本書，或是參加有興趣的講座，這樣對自己反而比較有幫助。


    要懂得把金錢和時間，花在自己的前途上。


    ### 你自以為的「消費」，其實都是「浪費」


    等你花錢會考量「開銷比例」以後，請每個星期統計一次「賺錢筆記」，更詳細地確認自己的花錢方式。


    重點是回顧自己花的每一筆錢，好好反省需要改進的地方。凡有任何領悟都寫下來，填滿筆記本空白的地方。


    例如，你可能会發現，某些酒會你應該拒絕參加，不該被可愛的妹誘惑；或是在晚輩面前打腫臉充胖子，點了很貴的午餐來吃……就連記錄這種無聊瑣事，都能幫助你了解自己的用錢傾向。在記錄的過程中，反思那些開銷是否真有必要的必要。很多情況下，你自以為是「消費」的項目，其實是「浪費」。


    ### 籌開「賺錢筆記」空白處


    **重點提示 TIPS**


    - 在筆記的空白處寫下自己的省思

    - 可掌握自己用錢的傾向

    - 防止一些看似「消費」實為「浪費」的開銷


    **筆記例**


    | | **消費** | **投資** | **浪費** |

    |---|---|---|---|

    | **〇月〇日** | 便當 480 | 商業書 1,365 | 雜誌 980 |

    | | 茶 135 | | |

    | | 水 100 | | |

    | | 午餐 1,200 | | |

    | | 總計：4,260 | | |


    在晚輩面前點了太高檔的午餐，好像有點打腫臉充胖子……（死）……………像這樣寫下自己的省思


    # 將「浪費」變成「投資」的方法


    自己負擔不起的高額房租，或是久久才開一次的汽車修理費，也都屬於「浪費」。在第3章 精神無負擔！徹底消除浪費的驚人節約術~我會告訴各位，很多時候審視自己的生活水準，就能抑制多餘的開銷。反之，有些支出你以為是「浪費」，其實與「投資」有關，像這種良性的修正也是有可能的。


    例如，我們和朋友去喝酒，喝完以後常常續第二攤，浪費不必要的金錢。我過去也常參加不必要的酒會，續了兩三攤才肯罷休，結果沒車可搭，只好浪費錢搭計程車回家。


    自從開始記錄「賺錢筆記」後，我決定不再參加續攤，但難免會有例外狀況。


    基本上，對我來說參加續攤的費用都屬於「浪費」。當然參加續攤很開心，也有放鬆心情的效果，不能說完全沒有意義，但是在金錢分類上仍屬於「浪費」。


    不過，有些情況下，可能第一攤大家談得很熱絡，因此決定再續一攤深入長談，最後發展成工作上的話題。


    像這就不是「浪費」，應該歸納為「投資」才對。


    在酒會上認識可愛的女孩子，為了想和對方多聊聊而參加續攤，這種情況嘛⋯⋯假如結果不錯，歸納為「投資」也不打緊。


    偶爾為之無所謂啦！


    當你懂得控管那些不假思索的開銷，節省對你來說就不是一件困難或痛苦的事情。


    花錢的方式相當於你的消費行為，有本事管理自己「行為」的人，也能管理自己的錢包。有本事管理自己的金錢、體重、時間。


    透過記錄「賺錢筆記」，我還清五百萬（約新臺幣一百四十萬元）債務。


    多虧我會學會掌管自己的行為，九十公斤的體重減到六十公斤。夜貓子的生活型態也恢復正常，家裡不必要的東西也全部清掉，外觀和生活方式都變得簡約俐落。


    我不只存到大錢，還得到了理想的自己和生活方式。


    # 擁有很多錢後，你要把它拿來做什麼？


    記錄「賺錢筆記」兩個月後，你大概也養成了記錄金錢的習慣，懂得控管自己的花錢方式。


    到了這個階段，請設定自己想達成的目標。


    ### 你存錢想要做什麼？你想實現怎樣的人生？


    請務必思考一下。


    沒有任何夢想或目標，純粹把存錢當成目的，這種人生未免太無趣。


    第一，這樣無法提升「節省儲蓄」的熱忱，甚至會有反效果。


    請先設立一個平實的目標。


    以我來說，我的首要目標是「還清債務」，當然「出國玩」或「買車」也可以。有一個能夠「激勵自我」的目標，管理金錢會更加容易。


    ### 關於金錢與人生，你應該知道的事


    再小的目標也要寫在「賺錢筆記」上，這是非常重要的事情。


    當你遭遇人生低谷，快要放棄的時候，偶爾重溫筆記內容，就能找回當初寫下目標的初衷。


    我之所以建議各位用普通冊子來寫「賺錢筆記」，就是因為可以隨個人喜好調整。


    你要在上面畫圖或貼貼紙都沒關係，反正不是要給別人看的，不妨多下點工夫提升自己的幹勁。


    再怎麼微不足道的目標，達成以後都會有很大的喜悅和成就感。達成的目標愈多，新的展望也就愈壯大。


    當你達成幾個平實的目標後，「人生的夢想和目標」自然會納入你的眼界中。


    像我在二十八歲時接觸了「經濟自由」的價值觀，這個價值觀從此變成我的人生目標。


    我想得到「經濟自由」，不願再受金錢擺布；我想做自己有興趣的工作，不必為五斗米折腰。


    那時候，我不但連「經濟自由」的邊都沒碰到，甚至還有五百萬（約新臺幣一百四十萬元）的債務，這種生活無疑是痴人說夢。


    可是，我把目標寫進「賺錢筆記」以後，六年內培養出一筆資產，還成功實現了自己寫下的生活方式。


    過去對我來說遙不可及的演講和作家事業，如今也實現了。


    為了達成「得到「經濟自由」」的夢想，我持續記錄「賺錢筆記」，同時改掉好幾個壞習慣，不斷身體力行。


    最重要的是，了解自己究竟為何要成為「有錢人」。要是連自己的目標都不曉得，也就無從前進。請先決定一個簡單的目標，踏出第一步。


