  md: '# # 3 股價X線簡介


    # ## 3-1 何謂股價X線


    **股價X線** 被視為近數十年來，最具創見的股票技術性分析法，是國內 **許金華** 先生於 **1979** 年所發明。


    **股價X線** 是一條畫在**半對數股票圖**上的直線。


    當股價上漲碰到 **上升X線** 時，會在當天或第二天下跌；而當股價下跌碰到 **下降X線** 時，會在當天或第二天上漲。並且約有 **99%** 準確性。


    **股價X線** 是一條直線，畫法簡單。


    股價上漲碰到 **上升X線** 即下跌；股價下跌碰到 **下降X線** 即上漲，時間不會超過第二天。


    29'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 3-2 如何命名


    股價 X 線 命名的理由有二：


    +   （1）股價 X 線 具有神秘的力量，能精確透視股價反轉位置，彷彿 X 光可以透視肉眼所看不到的地方。


    +   （2）股價 X 線 作圖時，係以頂和底，或底和頂連接，和股價趨勢交叉畫出，類似英文字母 X（畫法詳見後面數章）。


    # 3-3 股價 X 線的區分


    股價 X 線 分為 上升 X 線 和 下降 X 線 。


    上升 X 線 畫法是底連頂，但是至少間隔一個頂和底；


    下降 X 線 畫法是頂連底，但是至少間隔一個底和頂。


    以上這樣講，讀者當然不明白，本書目的乃是針對讀者的困惑，加強投影解說，直到讀者完全明白且熟練為止。


    讀者若能畫出權威的 股價 X 線，並據以買賣股票，十次有九次成功的機會。這一點筆者是敢肯定的。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 3-4 股價 X 線的作用


    一條 上升 X 線 畫出後，下一次股價上漲，碰到這一條 上升 X 線，會在 當天或第二天 回跌。


    周線則會在 當周或下周 回跌。 月線則會在 當月 或 下月 回跌。


    一條 下降 X 線 畫出後，下一次股價下跌，碰到這一條 下降 X 線，會在 當天或第二天 上漲。


    周線則會在 當周或下周 上漲。 月線則會在 當月 或 下月 上漲。


    # 3-5 上升 X 線的使用


    在多頭市場，股價碰到 上升 X 線，會在當天或第二天 回跌，通常回跌 5~10%。周線則會在當周或下周回 跌。月線則會在當月或下月回跌。 上升 X 線用於賣出。


    在空頭市場，上升 X 線是反彈的極限。


    在多頭市場或空頭市場不明時，股價碰到 上升 X 線 賣出股票，必然沒錯，回檔後再補回。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 3-6 下降 X 線的使用


    在多頭市場，下降 X 線是回檔的最低價。在空頭市場，股價碰到下降 X 線，會在當天或第二天反彈，通常反彈 5～20 % 。周（月）線則會在當周（月）或下周（月）上漲。下降
    X 線用於買進。在多頭市場或空頭市場不明時，股價碰到下降 X 線買進股票，必然沒錯。


    # 3-7 股價 X 線投影如何使用


    股價 X 線投影乃配合 股價 X 線 這一本書而作，讀者欲更了解 股價 X 線，購買 股價 X 線 一書是必要的。


    或是優先購買 股價 X 線 一書，回去讀了以後，認為有需要，再購買 股價 X 線投影。當然，兩本一起購買更好，兩本售價合起來，可能不及他人一本。


    何況 股價 X 線 是股價技術性分析非常有用的方法。


    想作股價技術性分析，從 股價 X 線 開始，您已經邁出正確的第一步。


    股價 X 線投影 也有電腦輸出列印本，圖大好看好練習，詳細請看書後簡介。


    請看以下投影片，從投影片中，哪怕寥寥數語，可領略要點，獲得啟發，加速學習。'
