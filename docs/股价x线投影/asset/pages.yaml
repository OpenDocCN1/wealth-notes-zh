  md: '雖然第一類比第二類權威，但是，第一或第二類 股價 X 線都可用來買賣股票。至於第三類只要 AB：BC 的比不要太大，例如 5：3 而已，仍然可用。若比達到
    5：1 就不好了，達到 10：1 則不能用。


    以上 AB 或 BC 至少有 12 天（週線圖上 12 週，月線圖上 12 月，圖上 12 根線就是）


