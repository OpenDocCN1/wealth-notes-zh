- pgno: 182
  md: '# **7 股價X線**

    **權威性試驗**


    **股價X線**的最大好處，是碰線即回跌或漲升。


    但是，用以連成**股價X線**的**頂點**和**底部**，是否具有代表性，這兩點和碰線位置三點之間的關係，我們仍要加以討論，以免囫圇吞棗。


    權威性試驗就是指這條**股價X線**有多大的**權威**，有多**少的可靠性**。和趨勢線一樣，**股價X線**也必須經過權威性試驗，以確認它的可靠性，進而執行買賣。


    一條權威性**股價X線**，可以幫您賺到錢，而不權威或錯誤的**股價X線**，可能會導致虧損，豈能不慎。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 7-1 剪刀原理


    剪刀是一種槓桿工具，槓桿構造有三點：


    +   * 施力點（A）：剪刀把手施力的地方

    * 支點（B）：螺絲固定處

    * 受力點（C）：剪刀刀口


    剪刀有三類型： 中等的（一般用的，$AB=BC$），


    省時的（如剪布的，$AB<BC$）。

    省力的（如剪鐵皮，$AB>BC$），


    這分類是和 $ABC$ 三點位置有關。


    假如，有三條不一樣的**股價 X 線**，它們用以連線的 **AB** 兩點和碰線的 **C** 點之間的關係和三種剪刀相比擬，那麼可以分成三類 **股價
    X 線**（見圖 7-1）：


    +   * 第一類 **股價 X 線**：$AB$ 長度等於 $BC$ （$AB=BC$）

    * 第二類 **股價 X 線**：$AB$ 長度小於 $BC$ （$AB<BC$）

    * 第三類 **股價 X 線**：$AB$ 長度大於 $BC$ （$AB>BC$）


    它們權威性依次排列： 第一類 **股價 X 線** 最好

    第二類 **股價 X 線** 次之

    第三類 **股價 X 線** 最差'
  merge: -1
  img_proc: true
