  md: '# 4 畫線的基本點


    初中學幾何時，老師開宗明義說，兩點可以連一直線，而且還說直尺不一定直，要翻轉再畫一次，檢驗直線是否重疊，若重疊，尺才算直。畫圖工具有一定精度，早年我畫圖的三角板，直角不是正好
    90 度。設計半對數圖紙要很精密，畫了很久，覺得有某種問題，經查明三角板直角只有 89 度，原來毛病在此。


    股票圖畫直線主要有二種：趨勢線和股價 X 線。電腦上畫線就不用尺了，只要找連線的二點連起來即可。


    所以畫股價 X 線，只要找對二點。看似簡單，其實要相當經驗。畫對了買賣會賺，畫錯了錢會溜走，豈可大意。


    股票圖上連線的二點稱基本點，有頂點和底部，是股價趨勢轉變地方，股價轉折很明顯的基本點，畫股價 X 線特別權威，買賣賺錢機會大。股價轉折不明顯的基本點，畫股價
    X 線不權威，弄錯會虧錢，不可不慎。


    電腦圖基於視窗要填滿，有些股價變動不大，但看起來好像波動很大，誤解基本點好像很權威。當發現股票目標時，最好用標準半對數圖紙自己再畫一張。尤其是周線和月線。如何選半對數圖紙，本書有介紹，請看第
    9 章。'
  merge: -1
  img_proc: true
