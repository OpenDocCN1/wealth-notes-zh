    我們有沒有辦法避開恐慌下跌？


    # 11-5 何謂恐慌下跌


    恐慌下跌是指股價迅速滑落，好像沒有人願意買進似的，其實仍有成交，只是賣壓比買氣超出實在太多，股市多頭充滿恐懼、怨恨和傷心，空頭則暗自叫好。


    一段恐慌下跌的幅度至少三成以上，比較投機的股票下跌幅度可達到五成（例如100元跌成50元），下跌時間，以台灣為例，大約在一個月左右。'
  merge: -1
  img_proc: true
- pgno: 300
  md: '在美國或其他沒有漲跌限制的地區，一旦發生恐慌下跌，一天可以把股價跌掉數成。前面的例子是在 1929 年 10 月 29 日，95 元一股的電燈公司股票，一天就跌了
    45 元；1987 年 10 月 26 日香港恆生指數一天暴跌 1120.7 點（或下跌 33%）。


    這樣激烈的變化，曾經使多少人，一夜之間破產，為了免於遭到破產，技術性操作者，必須在買進之後，設立停止損失委託，股價跌到某一價位時，賣出了結，防止更大損失。


    # 停止損失委託是緊急時的滅火器！


    在台灣，政府限定跌停板為 10%，1974 年曾經把跌幅縮小為 0.2%（一個喊價單位），造成有行無市，後來還是放鬆了，股價要跌，什麼也擋不住。


    如果每天跌 10%，一個禮拜你就受不了了。而這種跌法，在空頭市場是很普遍的，一再發生的。股票投資人要小心啊！


    空頭市場初期，只要肯以少許的損失了結，都可以脫手。但是，空頭市場末期，利空頻傳，有時會造成賣不出的現象。'
  merge: -1
  img_proc: true
- pgno: 301
  md: '是不是要等到恐慌下跌，賣不出時才哀哀求救呢？當然不是，在恐慌下跌之前，都有一段醞釀時間，這段時間有時長達一個月。


    任何有研究的股友，大多可以避開恐慌下跌。


    # ## 11-6 恐慌下跌發生時機


    恐慌下跌容易發生在空頭市場，多頭市場不易見到恐慌下跌，除非有突發事故。


    恐慌下跌容易發生在空頭市場第一階段及第三階段，空頭市場第二階段下跌速度，通常比較緩和，但是，有時利空來襲，也會恐慌下跌，空頭市場本來就非常容易下跌，買進股票要非常小心。


    # ## 11-7 恐慌下跌區分


    空頭市場的恐慌下跌分成

    初期恐慌下跌和末期恐慌下跌。


    空頭市場初期的恐慌下跌，也就是多頭市場結束後 的反'
