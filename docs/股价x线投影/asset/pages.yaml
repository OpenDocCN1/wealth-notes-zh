  md: '# 表 9-1 畫圖工具表


    欲畫股票圖需要一些工具，表列如下，酌量選用。


    | 編號 | 工 具 | 數 量 |

    | :--- | :--- | :--- |

    | 1 | B 硬度畫圖鉛筆 | 半 打 |

    | 2 | 30 公分三角板 | 1 組 |

    | 3 | 45 公分透明直尺 | 1 支 |

    | 4 | 30 公分透明直尺 | 1 支 |

    | 5 | 紅藍兩用原子筆 | 2 支 |

    | 6 | 色筆（橘色） | 4 支 |

    | 7 | 橡皮擦 | 2 個 |

    | 8 | 美工刀 | 1 支 |

    | 9 | 鋼捲尺（2 米） | 1 個 |

    | 10 | 筆記本 | 1 本 |

    | 11 | 修正液 | 1 瓶 |

    | 12 | 口紅膠（圖紙粘接） | 1 條 |

    | 13 | 兩頭黑色簽字筆（細與極細） | 1 支 |

