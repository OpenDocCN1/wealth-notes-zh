- pgno: 242
  md: '# ## 9 股票圖作法


    **股價 X 線** 必須在**半對數圖紙**上畫出。


    如果您已經有股票圖，那麼，只要在圖上加上**股價 X 線**即可。若是您未曾作圖，而必須從現在做起，或是您原來用方格紙，現在想改用**半對數圖紙**，以便更精確畫出
    **股價 X 線**，積極從事股票投資，本章對您有幫助。


    # ### 9-1 方格紙有缺點


    幾乎想畫股票圖的股友，一開始便會想到方格紙。因為它好買，且很多人使用。其實，方格紙並不是最好的工具，方格紙只適合於畫一些變化簡單的圖表，如溫度變化、生產量及學生人數統計等。'
  merge: -1
  img_proc: true
- pgno: 243
  md: '用方格紙分析股票並不科學，很顯然，一檔股票從 10 元漲到 15 元，差價 5 元，漲了 50 % 。有一天該股票漲到 100 元，再從 100 元漲到
    105 元，差價也是 5 元，漲了 5 % 。同樣上漲差價 5 元，前者漲了 50 % ，後者只漲 5 % 。如果這 5 元的差價，在方格紙上取相同長度，便無意義。而方格紙不管任何價位，這
    5 元的差價在方格紙上的垂直高度是一樣的。


    說明白點，5 元差價對於市價 10 元股票非常重要，但是，對於市價 100 元股票，5 元的差價並不很重要。


    方格紙不能把這樣的特點表現出來。


    總之，方格紙的缺點如下：


    +   （1） 一檔股票快速、大幅度上漲時，每日價格變動愈來愈大，每天在圖上的高度愈來愈長，結果整個圖被拉長。


    +   （2） 一檔股票快速、大幅度下跌時，每日價格變動愈來愈小，每天在圖上的高度愈來愈短，結果整個圖被壓扁，看不出什麼型態。


    +   （3） 由於上下變動不一致，趨勢線及 股價 X 線不準確失去意義。'
  merge: -1
  img_proc: true
- pgno: 244
  md: '+   (4) 每檔股票不能作漲幅的比較。


    +   (5) 大小不一，保管困難。沒有紙邊，不美觀，沒有成交量刻度，沒有日期線，完整性差。


    # 9-2 選用半對數紙


    針對方格紙的缺點，美國股市前輩設計了一種叫做 TEKNIPLAT 圖紙，即俗稱半對數圖紙，在美國已沿用了數十年，這是分析股價最有效的圖紙，本書很多股票圖都是使用這種圖紙。


    早年，以自製這樣多半對數圖作技術性分析，在台灣是一種創舉。


    本書大多採用半對數圖。各國指數圖底圖取材雅虎香港財經版，筆者細心畫上股價 X 線，感謝雅虎


