- pgno: 248
  md: '# 9-4 半對數圖紙說明


    半對數圖紙分三部分，最下面是**日期線**，上來一點是**成交量**刻度，最上面佔最大面積的，當然是畫股票**價格變動**區域。


    現在，先來談價格刻度的訂法，初學者是有一點困難的，我們詳細討論。


    **日線圖半對數圖紙**，整個價格區域，分成上、下二大部分（上、下半邊），中央以較粗的線分開，**上半邊**和**下半邊**，格線完全一樣。當以後需要往上或往下接圖紙時，都是用這**半邊**作基礎的。


    每一**半邊**先分成 **10 個大格**，每大格的格距逐漸縮小。每個大格又分成 **8 小格**。每個小格也是逐漸縮小。越過中央線以後好像放大了？不！只是用**半格**代替下半邊的一格。半對數圖紙上同樣價格愈往上則價格刻度愈小。


    半對數圖紙每一**半邊**圖紙的**頂價是底價的 2 倍**，整個價格區域，最上面的價格為中央線的 **2 倍**，是底線的 **4 倍**。也就是最底線如果設定
    10 元，**中央線**（較粗者）是 20 元，最頂線是 40 元。上、下兩半邊再各分 10 大格，下半邊每'
  merge: -1
  img_proc: true
- pgno: 249
  md: '大格 1 元，上半邊每大格則是 2 元。同樣的格線，上半邊的價錢都是下半邊的 2 倍。


    整張圖紙由下到上變動 400 % (4 倍)，如果，再往上貼半張，則最頂價變為為 80 元，而變成整張圖紙由下到上變動 800 % (8 倍)。


    周線圖半對數圖紙 須重新設計，因為有些股票一周變動比較大，股票垂直高度頗長，用日線圖半對數圖紙畫周線時，股價趨勢會很陡。在美國是以日線圖紙跳一行去畫，否則股票圖會太緊密而太陡。


    如今，筆者設計一款 週線圖半對數圖紙。畫出後趨勢線角度不會太陡。且由下至上，可以容許 16 倍( 1600 % )變動。這樣的設計是特別的，趨勢角度適當，長時間不必往上面，或往右邊貼圖紙。就是在美國可能也沒有這樣的设计。


    一張日線圖半對數圖紙可畫 7 個月，另有一種加長型日線圖紙可畫 14 個月，省去常要貼一張的麻煩。


    一張週線圖半對數紙可畫 3 年，對於比較沒時間畫圖者，可以畫周線圖，一周才畫一次。


    凡是在周線圖上，能畫出下降 X 線者，碰線後買進股'
  merge: -1
  img_proc: true
- pgno: 250
  md: '票，非常可能會賺錢，而且會大賺，不必靠內線交易也能大賺。反之，周線圖上有上升X線，則是融券賣出的好機會，這一點筆者是有 99 % 信心的。


    # 9-5 半對數圖紙價格刻度劃分


    以日線圖為例子，用簡單的數學來訂價格刻度。


    設定價格：


    +   底 線 價格 =X

    中央線 價格 =2 X

    頂 線 價格 =4 X


    下半邊的 10 大格，從底線起往上分別為：


    +   1. 0X（底線） 1.1X 1.2X 1.3X 1.4X 1.5X

    2. 1.6X 1.7X 1.8X 1.9X 2.0X（中央線，2 倍）


    上半邊的 10 大格，從中央線起往上分別為：


    +   1. 2.0X（中央線） 2.2X 2.4X 2.6X 2.8X 3.0X

    2. 3.2X 3.4X 3.6X 3.8X 4.0X（頂線，4 倍）'
  merge: -1
  img_proc: true
- pgno: 251
  md: '以上X代表底線價格：


    X=1.25 2.5 5 10 20 40 80 160 320 等或 1


    2 4 8 16 均可。電腦圖上半對數只顯示用到的部分，而且自動調整到滿視窗，未顯示整張半對數圖紙。


    依上面說明，您就可以訂出一張半對數日線圖常用六種價格刻度（圖 9-2）。週線圖訂法則是加倍再加倍，總共 16 倍就對了（圖 9-3）。


    請您務必依照上面規定，訂價格刻度。不可以隨意訂，否則圖形會失真，股價X線碰線時間不對，買賣時間就不對了。


    # # 9-6 決定成交量刻度


    成交量和價格是並存的，缺一不可。


    成交量不採用半對數刻度，而採用相等刻度或方格紙刻度。請參閱下面二圖來訂價格和成交量刻度。如果股票圖只是用來畫股價X線，成交量不必畫出也沒關係，可以節省時間。不過極高成交量或極低成交量，有它技術性的意義。在頂點，高成交量是反轉信號之一。'
  merge: -1
  img_proc: true
