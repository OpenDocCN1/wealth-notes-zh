    # ——今日内容小结——


    我们先说到这里，你从中能得到什么科学方法呢？


    那就是怎么陈述一个现象的出现会带来多严重的后果，要把这个后果让人清清楚楚地认识到，需要从两个方面来陈述：


    第一，反差极为强烈的对比。


    那对比什么呢？就是这个现象出现前那里是什么样的，和等到这个现象出现之后，那里又是什么样的，然后你再把前后两个结果左右并肩放在一起，反差越大，对比就越鲜明，给人的感官的体验就越直接。


    怎么做到反差大呢？就是你要控制住绝大部分的因素不变，而只让其中一个因素变，这样做的结果就是产生出一个黑，一个白。那你说如果一定要怀疑到底是什么因素导致的从黑到白，或者从白到黑，那不用考虑太久吧？大概率说，就是那个发生变化的因素导致的由黑到白，所以我们才要控制只有一个因素变化。


    比如说我刚刚举例的那几张图，海还是那片海，只不过珊瑚被腐蚀得白花花的了。但如果你只放白花花的珊瑚，没有对比，那人家以为这个品种可能就是这个颜色，还觉得挺好看的。所以要呈现海水变酸，一是需要极大反差的对比。


    第二，要展现事情的全貌。


    也就是你要聊的这个因素可以影响到它的范围，把这个范围尽量周全地框出来，这样好能让人知道事情的影响的数量级。


    比如说海底的火山口喷发，周围影响的范围也是几十平方公里，也不大。那片水域的珊瑚礁也会遭殃的，因为硫化氢融在水里，对海里生物的腐蚀可比海水的酸化带来的危害大得多，也剧烈得多，用不了10个月，可能几天就变白了。


    但是如果你只把这个局部弄出来对比，这个效果看起来虽然很明显，但是有脑子的人都会经不住多问一句，整个海洋都是这样吗？还是说只有一小片区域出了事故呢？


    你看，咱这节课说到的珊瑚变白，一定要说明有多大的区域变白了，是大堡礁的2/3已经变白了，而大堡礁又占全世界珊瑚礁的41%的面积，也就是说，就算全世界其他地区的珊瑚礁全都是健健康康的（当然，这种可能性微乎其微，因为酸化，大家都是一起酸化的，这是全球性的变化。）但就算我们往最好的情况去估计，全球也会有23.7%的珊瑚礁就在今后的10年里将要消失。


    所以，整幅图景摆在你的面前，就知道它是不是个案，是局域范围的还是全球范围的。然后再结合一下规律，0.1%的珊瑚礁海域养育着全球21%的海洋生物，那这些绿洲就极为珍贵了，但它们正在快速消亡。


    这就是第二个方法，我们把全景说了，把个例的对比凸显出来了，这个因素的影响有多严重，谁都可以理解得很透了。到了这儿，想把这个影响说出来，让人警醒的目的就达成了。


    珊瑚礁整个变白，这个变化当然很突出，后果当然很严重，但我们并不需要煽情地对个体进行渲染，我们更需要是一种理智思考的约束，我们需要通过这种科学方法把事情的全貌展现出来。


    # ——今日思考题——


    在你的生活和工作中，有没有遇到过有人想说明一个道理，但他只顾着煽情，最终的效果却没有什么说服力呢？或者他只顾着强调个案，而忽略整体？


    欢迎你留在评论里。


    # 划重点


    想让人清楚地认识到现象带来的后果：一是需要反差极为强烈的对比，把现象出现后的情况与出现前进行对比；二是要展现事件的全貌，把现象会影响的范围展现出来。

    对比：因为海水变酸，仅用了12年的时间，占据全球珊瑚礁总量41%的大堡礁，有2/3已经白化或死亡；

    全貌：最乐观的预估，10年后全球23.7%的珊瑚礁会消失，虽然全球珊瑚礁海域仅为海洋面积的0.1%，但却养育着全球21%的海洋生物，它们也会大量死亡。


    卓克

