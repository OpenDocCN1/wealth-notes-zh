    # ——▸ 其他问题引发的口臭 ◂——


    口臭还不一定非得是口气造成的臭，鼻子里喷出来的气如果臭的话，也会表现出出口臭。


    # 划重点


    > 1. 食物残渣、唾液少、舌苔是引发口臭的主要原因，解决办法就是用牙线、合理喝水、刷牙时要刷舌苔。 2. 说口臭是胃火导致的是没有科学依据的，大部分的气味就是口腔部位产生的，把对应的问题解决了，一切就解决了。


