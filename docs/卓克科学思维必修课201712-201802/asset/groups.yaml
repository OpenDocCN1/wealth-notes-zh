    ### —— 本周课程复习 ——


    ### 概念11：发展


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    121 | 发展：史上最严重的一次流感


    + 1. 1918年的大流感杀死了4000-5000万人，它含有的NS1毒蛋白会让免疫反应持续增强，因此免疫系统完善的青壮年死亡率反而更高。H5N1禽流感让世界各国极为紧张，因为它也含有NS1毒蛋白，一旦它能在人与人之间传播，那将会是一个世界人口3年里减半的威胁。

    2. 要评价一个重大事件的影响，一定不能始终埋头在细枝末节上，一定要尽力去找它在全景上的统计数据。


    122 | 发展：伟大的艺术作品离不开“梅毒”？


    + 1. 梅毒侵袭大脑会引发各种神经疾病，人会出现间歇性的暴怒、狂喜、多疑，或者是反方向的极度抑郁。

    2. 梅毒一定程度上塑造了近代文明，贝多芬、舒伯特、舒曼、梵高、尼采、海涅等众多伟大的音乐家、画家、哲学家、诗人都是梅毒患者，免不了有很多精神失常时期的创作。

    3. 传世作品无需过度解读和过度神话，科学证据给我们提供了一种更客观公立的角度，让我们变得更理智。


    123 | 发展：梅毒，种族歧视与道德底线


    + 1. 对600个黑人长达40年的突破道德底线的梅毒人体实验，一方面展现了种族歧视的普遍存在与严重性，另一方面，这次医学伦理危机，让全球的医学伦理规范得以建立和完善。

    2. 虽然美国政府做了后续赔偿，总统进行了国家级的道歉，但美国黑人群体自此之后对国家的公共卫生系统极为不信任。


    124 | 发展：大脑的寿命和身体不一致？


    + 1. 医学界的共识：人类平均寿命会继续提高，癌症死亡率会持续下降，但大脑的使用寿命跟不上身体寿命的增长。

    2. 当下的观察与发现，总结的规律与经验，总会有它的局限和范围，科学方法之所以是人类知识迭代最好的方法，就在于它总是能不断的进行更新，不断的纠错。


    ### 答疑时间


    125 | 问答：怎么提升免疫力？


    + 1. 免疫力是防御动作，只要能正常的保护身体就好了，过敏性哮喘和红斑狼疮就是防卫过当造成的。

    2. 任何宣称“增强免疫力”的产品，都是无效的。

    3. 顺产可以帮助婴儿建立自身的免疫系统，10岁之前接触各式各样的人、多接触大自然、养宠物等都有利于训练孩子的免疫系统，应避免过度清洁。

    4. 让免疫力正常发挥就三条：充分休息、合理运动、均衡饮食。

    5. 普通感冒、流行感冒，都是自限性疾病，是否治疗都是一周左右好。


    126 | 问答：家长怎么帮助孩子学习？


    + 1. 从人的身高发育和脑的发育的规律来看，成年之前的孩子都需要充足的睡眠。

    2. 教育的本质是以提升学生能力为第一要务的。

    3. 应试教育对两类学生不利，一类是学习能力非常强的，一个是非常差的。强的是吃不饱，牵制了他的成长；差的是跟不上节奏，白浪费时间。

    4. 家长的素质越高，投入参与设计孩子的教育方案的时间越多，教育效果越好。


