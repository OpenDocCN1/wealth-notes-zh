    ## 163 | 泡沫：这世上的“神药”会越来越少


    ### ——► 概念15: 泡沫 ◄——


    一项新的科研成果出现，总会引发很多人的热情，有些人是为了科学欢呼，有些人则希望从中渔利，于是是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    这节课我们下一个判断，这个世上的神药会越来越少。


    那神药是什么呢？


    它指的就是药效覆盖很多疑难杂症，号称可以治疗一些现代医学不能治疗的疾病，其实说白了就是骗子的假药。


    举个例子：


    比如像什么什么掺子粉，说是抗癌、防癌、治疗慢性病的诸多领域的当之无愧的明星，提高免疫力，清除自由基，提高 DNA、RNA 和蛋白质的能力，提高肝脏排毒解毒的能力，提高血液供氧能力，降低血液粘稠度，增加心肌收缩能力，抑制肿瘤生长，降低血糖。


    ### ——► 值得信赖的FDA ◄——


    之前我们提到过，如果一个人在这3份杂志上，《科学》《自然》《细胞》任 cabin 一个发过论文的话，那他起码是一位科学家，这篇文章起码是受其他科学家高度认可的。国内高校给员工评定科研成果的时候，这3份杂志也是权重最高的好像这3份杂志已经占据了科学领域的绝对话语权。


    ### —— 严厉的监管与惩罚 ——


    也许大家觉得，故意隐瞒有效成分，或者标签里带着误导的词汇，这是要小滑头。

    可是 FDA 的惩罚是非常严厉的，比如说：


    2013年，强生公司的医药代表收受回扣，被罚了23亿美元。

    2012年葛兰素史克被罚了30亿美元。什么原因呢？就是有一款上市的抗抑郁的药，说明书什么的都正规，但是销售代表夸大了效果，把它描述成是一个让人快乐、威猛、苗条的小药丸，结果被
    FDA 抓出来了，最终葛兰素史克以30亿美元跟美国政府达成了赔偿和解协议。


    2008年，辉瑞制药虚报药物的疗效被罚了10亿美元的刑事赔偿，加13亿美元的民事赔偿，合起来23亿美元。而且这个虚报疗效，还不是说在药品的包装盒或者说明书里头夸大，而是一
    些销售偷偷摸摸地在给医生提供资料的时候，他故意筛选的是实验效果比较好的，更有利于体现这个药的效果好的内容，实验不好的那些数据他们没有提供给医生。


    稍微想一下就知道，刚才我说的这几种都不是很好找到证据的，它并不是在说明书里或者电视广告里头已经印刷出来了、已经播出来了，没法悔改了，一抓一个准，并不是这样的证据。

    其实 FDA 的监管，发展到现在也根本就没有大药企敢明目张胆地这么做了。要的这些滑头都是属于公司运营环节中的一些不正规，但是只要被抓出来了，那也罚到公司肉疼。

    这些可不是什么小企业，就拿刚刚咱们说的一个药企来说，上世纪40年代，第一款青霉素上市，还有后续第一款土霉素上市，还有大家都熟悉的“伟哥”，都是这家药企研发出来的。

    但即便这么大一个巨头，一样处于高压监管之下，而且美国司法部负责调查那次事故的人就说，它是个惯犯，惯犯说明什么呢？就是利益的丰厚。


    有监管的情况下都尚且如此，更何况没有什么是实质性的监管环境下，那些地方的药企是根本不可能自觉自愿地遵守规定的。

    我之前说过比较多跟 FDA 药物实验的内容，那些都是属于上市之前的环节，严格程度已经是令人发指了。从申请做实验，到完成3期的临床试验、最终上市，平均需要10年跟10多亿美元的成本。

    今天，我们讲的是上市之后的环节，你发现没有，一点都不比上市之前宽松。也正是因为整套流程的漏洞很少，对 FDA 的授权很大，美国又有 着全球最好的科研环境，比如学术期刊的高水平、丰富程度，所以
    FDA 在全球医药行业享有绝对权威的发言权，它是一个榜样。


    其他国家也效仿它建立起自己国家的食品药品管理部门。比如咱们国家对应的部门，最早是1978年成立的国家医药管理总局，后来在1998年跟卫生部的药政司合并成立了国家药品监督管理总局。

    欧洲每个国家之前都有自己的监管部门，后来随着欧盟的成熟，欧洲药品管理局也在1995年成立了。

    像美洲、亚洲的一些小国，自己根本就没必要花大笔的费用建立这么完善的管理系统的时候，往往就会直接采纳 FDA 的药品目录跟召回的指令。实际上它们是更完整地继承了
    FDA 的工作成果。

    可是，你知道吗？

    就是药品监管的鼻祖FDA，也是到了1962年的时候，才在监管权限上有了实质性的改变。


    比如说现在要求的每款药上市之前要做完3期的临床实验，是1962年才强制实施的。对已经上市的药物作严密的监管还要更晚，甚至可以说，直到最近几年，有了详细的电子病历，有了医学院、医院、疾控中心的数据联网，有了大数据的处理分析技术之后，药品上市之后的监管措施才能实施到位。

    药品监管这些方面是美国首创的，到现在依然还是超级领先。中国，也或早或晚地一定能够追平美国现在的程度。其他国家也是这样的，所以真到了那个时候，这个世界上的神药会越来越少的，带着欺诈性质的药品生存空间也会越来越小。


    ### —— 今日思考题 ——


    中间我提到过，已经批准上市的药，又出现了安全问题让它下市，把这些细节事无巨细地公之于众，这件事初看起来对药企跟 FDA 都没有什么好处，一个是损失钱，一个是打自己脸。

    那是什么因素的驱动，让这套流程执行得这么彻底呢？

    如果你想到了，就留在评论中。


    ## 划重点


    +   1. 一种药物，药效覆盖很多疑难杂症，号称可以治疗一些现代医学不能治愈的疾病，均是骗人的假药。

    +   2. 现代社会，信息越来越透明，科学越来越发达，监管起来就更方便、更高效，骗子的空间越来越少。

    +   3. 在全球医药领域，异常严格的新药审批流程，以及上市后的持续监管，让FDA有着绝对权威的发言权。


    卓克

