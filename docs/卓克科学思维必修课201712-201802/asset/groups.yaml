    ## —— ◆ 本周课程复习 ◆ ——


    ### 概念12：旁证


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    127 | 旁证：寻找衣服的历史


    - 1. 要证明一个事情的事实，最理想的是能够找到直接的证据，但很多时候，会因为各种原因导致缺少这种证据，用旁证来进行证实，虽然是一种无奈，但是使用科学的逻辑和方法，就能够得出相对最为接近真相的答案。

    - 2. 通过 DNA 技术研究猬子的进化史，人类衣服出现的时间被定格在了17万年前，科学技术在历史研究中的应用，让历史更加坚实。


    128 | 旁证：黑猩猩还有机会变成人吗？


    - 1. 现存的任何一种猩猩都没有机会再进化为人类，因为早在几百万年前，它们与人类的祖先在演化路径上已经分道扬镳。

    - 2. 生物演化的道路上，是环境的随机变化在对新的性状进行筛选，那些能够适应的生存下来，不能适应的就走向灭绝，其中的生命个体，是无法判断哪些性状在未来会是一种优势的。


    129 | 旁证：日本人是中国人的后代吗？


    - 1. 通过基因测序分析，日本人、朝鲜人、中国北方人都是3万多年前亚洲祖先的共同后代。

    - 2. 来自东西伯利亚的阿伊努人是日本的原住民，他们的基因广泛分布于全日本，来自中国大陆与朝鲜的移民，大约是从15000年前到2500年前陆续到达日本，形成了后来大和民族的主力。

    - 3. 回答一个问题之前，想清楚问题里每一个元素都是什么意思，然后再考虑要不要回答。着急回答是或不是，都有一种不健康的思考习惯。


    130 | 旁证：家猫是什么时候出现的？


    - 1. 通过对世界各地猫的 DNA 进行分析发现，全世界所有的家猫都源于一个品种的野猫，叫非洲野猫，也叫非洲斑猫。

    - 2. 家猫跟非洲野猫的 DNA 从遗传学上几乎无法区分，因为突变量的积累还太少，少到无法测量。因此，要确认家猫的驯化史，考古遗迹这种更粗糙的证据反而更有效。

    - 3. 在有些特殊的场景下，一个技术更先进的工具反而不好用，还需要传统粗糙的手段配合使用才行。


    ## 答疑时间


    131 | 问答：家鸡是怎么被人类驯化出来的？


    - 1. 家鸡的野生祖先来自两种原鸡，大部分基因是从一种叫红原鸡那里取得的，少部分基因从灰原鸡那里得到的，比如家鸡现在黄色的脚就是灰原鸡中得到的。

    - 2. 鸡是一种智力水平比较高的鸟，它们有时间观念和自控力，也有一些逻辑判断能力。


    132 | 问答：感冒药怎么选，怎么吃？


    - 1. 流感一共有170多种，而每年的疫苗只能针对其中的4到5种做预防，平均来说，每年的命中率是在30%到50%之间浮动。

    - 2. 感冒药不能杀灭病毒，它只是让免疫系统在战斗中尽量温和一些、克制一些，让人体不太难受。

    - 3. 家长把胶囊拆开、把药片磨粉喂给孩子，这些手法或多或少地削弱了药效。

    - 4. 虽然茶水可能对药物几乎没影响，但吃药最好用白开水。


