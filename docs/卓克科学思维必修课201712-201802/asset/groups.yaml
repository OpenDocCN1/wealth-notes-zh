    ## 161 | 问答：换硬盘增加工作效率


    161 | 问答：换硬盘增加工作效率…


    有同学问到了电脑运行非常慢的问题，那借助这个问题，我们说怎么提高电脑的速度来增加工作效率。


    ## ——► 机械硬盘的工作方式 ◄——


    电脑慢有一半以上体现开机过程中，影响最大就是机械硬盘的性能，机械硬盘指的是那种磁介质的硬盘。


    大概的样子咱们这个课第3节就说过，是一个机械臂，最顶端安装一个读写的磁头，所有的数据都是以南北极小磁条的方式码放在磁盘的盘面上，需要读哪儿的数据，就需要确定那个数据在哪儿，然后给机械臂一个信号，告诉它应该伸到哪儿去读或者去写，等到机械臂落位之后，再把那的磁条信号读出来，转化成电信号，最终给了处理器。


    你听这个过程是不是够复杂的？


    所以机械硬盘只适合当仓库，不太适合频繁地读写。


    ## ——► 机械硬盘不总是慢 ◄——


    电脑使用的时间越久，就越有可能有大量的东西需要在开机的时候准备好，这需要硬盘在开机的时候做大量的工作。所以说电脑开机慢，大概率都是卡在硬盘的这个瓶颈上了，但是硬盘不一定总是这么慢。


    ## ——► 机械硬盘慢的原因 ◄——


    好，如果刚刚的过程你都听懂了，你对机械硬盘大致的工作方式也就可以了解了。


    但是我们一直在用快慢这些形容词，我们是科学课的答疑，所以到底有多快、有多慢，我得给你量化一下。


    我最早说的快慢就是，说很多程序都留在内存里，它嫌硬盘慢，那么内存有多快呢？


    大概能达到 30000MB/s 这种传输速度，也就是像那种 1080p 的高清电影，它一秒钟可以传输10部，而且内存中的数据无所谓排列整齐不整齐，假如说全都是零散着，大概也是这样的吞吐速度。


    那硬盘里的速度呢？


    大约是 0.6MB/s-200MB/s 的速度。


    ## ——► 固态硬盘SSD ◄——


    于是2008年之后，在家用电脑的市场里就出现了一种叫做固态硬盘的新品种硬盘，缩写叫SSD。


    这个硬盘里就没有飞速旋转的碟片了，也没有机械臂，所有的數據都存在一个微小的半导体单位中，叫做 NAND，这里保存着一定量的电子来标记它自己是0还是1，也就是以一个没有机械活动部件的一种新结构来存储数据。

    '
