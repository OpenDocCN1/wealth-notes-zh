    技术刚刚诞生太近了，所以结果放在现在是比较粗糙的。


    在2015年，佛罗里达大学自然历史博物馆的副馆长又用了同样的办法重新采集了数据，得到了更精确的结果，这次的结果发表在《分子生物学与进化》这个期刊上，结果是体虱是从17万年前进化出来的。也就是说，人类从17万年前就已经开始经常穿衣服了。


