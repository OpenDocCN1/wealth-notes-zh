    ## 162 | 问答：什么硬盘用起来最爽？


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_205_0.png)


    162 | 问答：什么硬盘用起...


    上次答疑说到了 SSD 会大幅提升使用体验，有同学问了很多使用中的问题，这次我再更全面地介绍一下。


    它尤其适合笔记本，笔记本对工作的人来说，很多时候已不是游戏机了，就是一个出差途中的办公工具，所以笔记本总是拿来拿去，免不了颠簸，这个时候换一个 SSD 硬盘上去就很稳妥，因为它不怕颠。


    除此之外它更省电，比如说你原来的笔记本用的机械硬盘，假如续航时间是4小时，换成 SSD 之后，大约可以增加到5小时。


    结合我们上一节课说的优点，SSD 已经越来越普及了，现在的比例大概是每卖出10块硬盘，其中2块是 SSD。所以虽然电脑发烧友可以享受它带来的便利已经8、9年了，但实际上这个东西对至少一半的用户来说还是陌生的。


    这些就是它的优点，但是缺点也有。


    第一个就是，贵。


    你看看现在在笔记本的配置就知道，4000多块钱的笔记本配 1000GB 以上的硬盘那多得是，但是8000块钱以下很少见到有用的 512GB SSD 的型号，当然我们也可以买一个便宜的笔记本，自己换一个
    SSD 上去。


    还有一个缺点就是它的寿命是有理论上限的。


    这个上限是由它的物理结构决定的，具体来说就是每一个最基础的单元到底能写入多少次数据，这个是有次数限制的，它有点像轮胎的寿命，它总跟地面摩擦就会报废。


    那一共能写入多少次呢？


    这个得按类型分，但是我们不说得那么专业，最牛的 SSD 是可以重复写入10万次每一个单元，但这是给企业级用户用的，同样容量的价格可能是民用产品的5-10倍。我们能用到的
    SSD 大都都是1000-3000次这个范围，但是这个只是理论值，实际上还跟很多因素有关，比如说主控芯片的算法，还有硬盘已经事先留出的保留空间的大小等等。


    那具体能写入多少的量，硬盘大部会在自己的产品上有一个最大写入量的标签，比如以 Intel 3 系列的 SSD 为例，240GB，它标称写入量最大的是2.2万
    GB。


    那我们怎么合算它的寿命呢？


    比如说我们如果知道一个硬盘能在一天里大概写多少数据，除一下就知道它的寿命了。


    平均是多少呢？


    大概一个硬盘每天是 5GB，所以2.2万除以5，天数正好是12年，也就是说这个 SSD 用12年之后才有可能坏。


    但是这个只是普通的工作强度，如果我们考虑一种日常使用中比较极端的情况，比如说拿它当下载盘，下载速度是每秒钟10MB 的速度，每天24小时不停地下，那我帮大家算完，这个就是26天寿终正寝，当然这么下载的用户实在是罕见，你要是真不知道
    SSD 有这么一个隐患，有那么一天你一冲动，以比较高的网速连续下了10个小时的电影，然后把这个硬盘给满了，那就相当于用掉了这个硬盘1/60的寿命。


    这些是从理论值上算的，那实际情况是不是这样呢？


    测完了还真不是，国外有几个硬件测试的网站真做过长测，就是把 SSD 买来之后，一直给它写入数据，直到它挂掉，看看它在寿命周期中一共写入了多少。


    我查到的是 Hardware.Info，还有 TechReport 一直在做的长期测试，比如说刚刚那个 Intel 3 系的 SSD，它标称是22TB，但竟然是在
    750TB 的情况下才崩溃的，实际寿命超过了标称值的30倍。


    那你可能都不理解，Intel 干嘛标得这么保守呢？


    估计是因为怕承担责任，所以还是少说为妙，说得谨慎一些。实际情况这么好的话，那我们再来看，假如当初真拿这块硬盘做下载盘，一刻不停地以 10MB 每秒的速度就这么下下去，估计也要连续不断地下两三年这个硬盘才会坏。而且
    SSD 产品中，只要是大品牌的产品都出现这个情况，就是标称值远远小于实际崩溃的量，大概都是几倍到10几倍的范围，所以如果我们买到的不是假冒伪劣的东西，只要不特地拆磨它，这个
    SSD 的使用寿命我们还是不用担心。


    ### —— 不一样的崩溃特征 ——


    机械硬盘也有寿命，但是它们在临近报废的时候，表现出来的特征是特别不一样的。


    这个特征不一样就导致了数据有可能会在 SSD 报废之前丢失。我自己就用坏过两块 SSD，当然我是运气不好，我遇到了恶劣的厂商，用的是残次品的芯片，但是就是这两次让我有了警惕，SSD
    的坏掉就是突然坏掉，上—秒还跟翔一样跨栏，下—秒就完全废了，弹出出现各种错误提示，然后再怎么重启都启动不来了，而且里面的数据就完全丢了。


    传统机械硬盘不是这样，它在寿命的末期开始出现坏道了，虽然还是可以使用，但是总是奇奇怪怪地老出错提示，或者是响应变得越来越慢，稍微有一点经验的人，这时候就会把重要的资料往导出于了，之后再用几个月，这个问题越来越严重、越来越多，最后这块机械硬盘才算寿终正寝。


    但是正因为之前有那么几个月的种种迹象，很多重要资料我们已经备份出来了，能给我们一个提示，给我们时间窗口把更重要的资料备份出来。


    SSD 在这点上是非常非常突兀的，为了防范这一手，每家品牌都会给他们的产品配一个专用的软件，它可以监控 SSD 的健康状态，看看已经有多少不可修复的错误了，它会在临界值到来之前提醒用户备份数据的。


    ### —— 硬盘技术突破 ——


    以上就是 SSD 的优缺点大全，这些知识其实在2015年之前就早有定论了，此后的 SSD 基本只是在存储密度上继续提升，并没有出现让人们眼前一亮的技术大爆炸。


    这种状态持续了两年多的时间，一款新的硬盘横空出世了，完全解决了 SSD 的寿命隐患，它就是 Intel 从2010年开始研发的，叫做 3D XPoint 闪存，寿命是现在
    SSD 的1000倍，速度也是1000倍，存储密度是现在的10倍。


    实际中，Intel 已经推出了基于这个技术的实体产品，中文名叫做腾。相同容量的产品价格大约是 SSD 的4-5倍，价格还是比较高的，性能大约是它的2-3倍，寿命只有现在的10倍，所以距离理论上限才说的1000倍还差太远。


    什么时候可以做到现在 的50倍到100倍的时候，我们再出手不迟，所以现在不用考虑，那一天应该就在几年之后到来。


    如果一定想尝尝鲜，我们可以先试试它16GB 的版本，价格是199，跟咱们得到的专栏一样，只不过是需要非常强的动手能力，把它现有 的硬盘组做阵列，并且设置成一种比较特殊的开机启动方式。


    这个 16GB 版本的傲腾可以带来最大的提升，就是如果用它配合一块传统的机械硬盘一起使用，最终表现出来的效果就跟一块高性能的 SSD 是一样的，可是价格却比传统的机械硬盘贵了199，等过几年傲腾真的值得买的时候，我也会在答疑中告诉大家。


    ## 划重点


    +   1. SSD硬盘的优点除了快，就是不怕颠簸，也更省电，非常适合笔记本电脑使用。

    +   2. SSD硬盘的缺点是价格贵，寿命有理论上限，在临近报废的时候会在某一刻突然崩溃，造成数据丢失，而机械硬盘会在寿命末期一点点损坏，有经验的用户能够抓住时间窗口提前导出数据。

    +   3. 最新的闪存技术已经解决了SSD的寿命隐患


    山双点。

    3.最新的闪存技术已经解决了SSD的寿命隐患，但距离理论性能还有距离，普及应用还需要数年时间。


