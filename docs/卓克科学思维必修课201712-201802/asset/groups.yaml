    # 112 | 发展：天花是如何塑造了人类史的？


    # ——► 概念11：发展 ◄——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光观测曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    天花诞生了1万年，感染的人不计其数，但其中有这么几个人，如果他们不幸成为了那35%死亡的人，历史可能就要大变了。


    比如说顺治帝自己就是感染天花死的，去世前传位给谁，作为决策的一个重大影响因素，就是二儿子福全没有得过天花，今后万一得了，死了的话，皇权就不稳。而三儿子康熙小时候已经出过天花了，最终就让康熙继了位。


    得过天花幸存的还有斯大林，如果你看他的照片，斯大林开会的时候，左手经常戴着一只皮手套，看着挺精神的，实际上是因为他年轻的时候得天花，当时引发了病毒血症，左臂的肌肉萎缩严重，他不想让别人看到这只不正常的手，他平时接受外交的时候这只手也经常缩在袖子里。假如当年他没有逃过病毒血症的话，这个世界一定会大不同的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_50_0.png)


    # ——► 英国首相的起源 ◄——


    天花还无意中让英国诞生了新的政体，这段机缘巧合发生在18世纪的神圣罗马帝国，这片国土对应现在的地图就是中部的欧洲，当年一共零零散散由70多个国家组成，其中北方有一个比较大的公国叫汉诺威。汉诺威的国王乔治一世当时已经54岁了，有一天突然收到一个消息，说自己的大姨夫去世了，自己要去顶替大姨夫继承英国的国王。


    # ——► 天花大屠杀 ◄——


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_50_1.png)


    著兵也来一次天花呢，所以他就写信给他的上级，保证在自己士兵不受感染的情况下，他要把2条裹过天花病人的毯子跟几个病人用过它的手绢送给印第安人。


    结果等真的送去之后，大面积的感染就发生了，在10几年的时间里，迅速导致90%的印第安人死亡，2000多万的人口最终只剩下了100万幸存者。而就在这10几年中，阿姆赫斯特在官场上平步青云，先被提升为陆军中尉，过了几年又进了英国枢密院，两年之后被册封为男爵，再过两年升任将军，进入了英国内阁。他一辈子都没对这上千万人的死亡付出过任何代价。


    阿姆赫斯特死后22年，美国麻省以他的名字成立了一所学院，纪念他生前的战功。他在跟南美土著战斗中使用生物武器这段历史一直被当作传闻，唯一的证据就是学院里给学生提供午餐的盘子，这些都是一八几几年烧制的盘子，花边上有一个骑在马背上，挥舞着鞭子抽打奴隶的图案，有人说图案中马背上这个人就是阿姆赫斯特。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_51_0.png)


    但是到了1968年，新的证据被披露了，有历史学家深挖了当年的奴隶贸易，找到了1763年6月24号皮特堡军队医院的出库单，也找到了6月13号阿姆赫斯特写给上级要打生物战的亲笔信。这段从前只是传闻的恶性事件终于坐实了，阿姆赫斯特学院的学生听说以后愤怒地把餐厅里所有印着花纹的老盘子全都砸碎了，他们不愿意相信自己的学院的建立者是这样一个屠夫。


    这些比枪炮大屠杀还有效的微生物杀戮是殖民者都没有想到的，它就导致了后续的200年里，美洲大陆的殖民开发一直面临着一个困境，就是缺人，这就是后来非洲奴隶贸易的一个刚需。


    现在统计，在16世纪到19世纪，非洲运往美洲的奴隶总数也在千万这个级别，非洲奴隶不断地补充进来，来补充因为天花跟麻疹死去的美洲土著劳工。


    某种意义上来说，天花塑造了现在世界上民族分布的很大一块，不论是单个的历史人物，还是上千万的民族死亡，与另外上千万民族的苦难，和在这个苦难上建立起来的反对歧视跟反种族主义的思想。


    现在回看这些历史，感觉那种灾难已经离我们远去了，因为天花在37年前被宣布彻底消灭了。但最近几年，科学家们却发现，天花病毒有卷土重来的趋势，这些内容我放在下一节课里说。


    # —— 今日思考题 ——


    之前我说过，历史上出现的传染病大都有分布不平均的特性，要不就是集中在贫民区，要不就是集中在某一个时间段。可为什么天花却分布得如此平均呢，它不分高低贵贱呢？


    如果你想到了就留在评论中。


    # 划重点


    天花是人类史上造成死亡最多的疾病之一，它很大程度上塑造了人类文明史，影响最大的，可能就是重塑了美洲的人口分布。


    卓克

    我是卓克，咱们明天再见！


    # 113 | 问答：苹果有意降低老手机性能吗？


    113 | 问答：苹果有意降低...


    有同学问，苹果有意在新版的 iOS 系统里降低老的 iPhone 性能，是不是真的？


    简单回答，是。而且手法还比较隐蔽，它是通过判断电池的状态来实现降低性能的。


    其实苹果每一代的新手机发布之后，接下来的那一版 iOS 新系统就是一个地雷，都不用提什么老手机，只要不是最新版的手机，只要是一年以上版本的手机，更新了最新的系统，都会感觉反应变迟钝了。


    # —— 初步依据：相关性 ——


    首先，虽然我们已经听很多人都说 iPhone 变慢了，或者我们自己也感觉手里的机器变慢了，但理论上来说，iPhone6 以上的处理器性能还是不落伍的，比这个芯片算力更差的安卓手机多的是，可它们还能被当作终端机或者入门手机大卖特卖。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_52_0.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_52_1.png)


    # —— 寻找进一步的证据 ——


    # —— 靠近事件真相 ——


    延伸阅读：004 | 务实：手机的屏幕越来越大的真相


    依然也远远高于手机功耗的最大值。还有就是它电量降低得并没有那么快，即便是一天来一个完整的循环，容量要下降到80%也需要两三年的时间，而现在只有1年多的时间就开始人为地降低手机性能。


    另外再退一步说，就算容量降低了20%，不作任何的调整，反映在手机上也只不过是使用起来续航时间变短了，也不应该影响性能。


    因为你想，其他的手机品牌也在用类似规格的锂电池，同样在低温下或者在充电次数比较多了以后，电量也会下降，大电流放电的能力也有所下降，但并没有见到其他厂家做这种事，把性能调低这么多。


    相反，其他手机品牌在制作新版的操作系统的时候，会以让老版本的机器能够顺利更新，能够正常使用，尽量兼容，把这个当作最重要的设计目标。


    当前这个问题有没有解决办法呢？


    也有，就是你给老的 iPhone 换新的电池，换完了之后机器就是以芯片的100%的性能工作。现在，手机维修行业已经比较规范了，线上的关键词你去找，预约换电池、换屏幕，或者是扩内存，这些都已经很容易找到了。所以真的出现了变慢，又不想换手机，你就给它换个新电池就可以解决了。


    # ——◆ 今日内容小结 ◆——


    借这次答疑，我们实践了一下科学思考的习惯，就是：


    +   从我感觉、他感觉、有些人说、我同学说，就这些虽然算不上证据，但是它能给我们一个往哪个方向求证的提示，我们顺着这个方向就可以找到更大规模的统计上的相关性；

    更大规模的统计里出现了高度的相关，就能把它列为重点怀疑对象了；

    然后就可以对它做实验，求证。实验可以是自己做的，也可以是那个领域的专家做的，找到证据之后，怀疑就被证实了；

    被证实了之后，我们再聊感受、再聊策略、再聊商业道德之类东西。


    这个过程是一个探讨具体事物比较稳妥的方法。


    # 划重点


    +   1.一个现象或者问题的产生，绝大多数都存在诸多因素，很多看似明显的因果关系，往往只是相关而已，感觉联系紧密，其实经不过查证和检验。2.探讨具体的事物，最稳妥的就是使用科学的思维方法，从提出问题，建立假设，收集证据，再到检验，最终才能得出相对可靠的结论。


    卓克


    这次答疑就是这样，咱明天再见。


    # 114 | 问答：手机电池用不用维护？


    上次答疑说的是苹果借电池老化来降低手机性能的事，之后就有很多同学问，低温跟使用习惯对电池有什么影响吗？那这次答疑我们就说说电池方面的基础知识。


    先说个使用上的总原则，那就是：


    所有终端的用户问的关于电池保养、充放电的技巧上的问题，都属于是操心过度了。


    因为锂电池是一种非常脆弱的东西，每个有锂电池的设备都配有专门的保护芯片，完成所有呵护它的工作，用户额外的关心和操作只能增加自己的麻烦。


    # —— 典型的操心过度 ——


    +   1. 新手机来了，新电池来了，用不用完全充放3次把它激活呢？


    答案是，这是多余的步骤，白白浪费了3次循环寿命。手机电池真正的激活步骤叫做“化成”，化成的设备几十万或者上百万一台，一次激活的是一批电池，这设备谁家都没有，锂电池对用户来说根本没有激活这么一说。


    +   2. 快充的插头会不会减少电池寿命呢？


    也不会的，你根本就不用担心。会的话，手机厂商就不会用这个东西砸毁自己的产品了，他们本身就用了与之对应、可以适应大电流充电的电池，所以不会损坏电池。


    +   3. 手机电量是不是不能总维持充电的状态啊，这样对电池不好吧？


    这也不用操心，因为它设计出来就是给人用的，充到100%这属于正常功能，日常功能是不会损坏设备的。


    +   4. 广告宣传里说电池的寿命是800次循环，但是我最近经常是从20%充到70%就给拔掉了，那我这样是不是浪费了很多次循环呢？


    这个也属于操心过度了，一次的循环寿命指的是全部容量循环一次，那你单次只循环了0.5倍的容量，就相当于你只耗费了半次寿命的循环。


    # —— 电量与能量 ——


    接下来，我要说一点更深入的，那就是在完全没有保护芯片的情况下，一个电池的容量和循环又是什么样的呢？


    # —— 手机锂电池 ——


    # —— 电池容量的底层知识 ——


    电池容量是怎么规定的？


    它是通过一系列工作量巨大的实验来确定的。


    这个还有的搞，看来在充放电中，什么时候停止充电，什么时候停止放电，我们之前这两个电压点选取得有点太宽松了，浪费了材料的潜能。所以我们就可以把这两个点的电压的差距再给它拉大一点，刚才不是
    3.0 到 4.2 嘛，我们现在把它拉大到 2.8 到 4.4。


    这么改变一下就导致什么东西出现了呢？


    就是同样容量的电池，这次再循环，就能输出更多的能量了。假如调整到这么宽，发现还是需要 4500 次的充放循环才能让电池放出来的能量衰减到最初的 80%，就说明这次充放电的起始点的电压还是有点宽松了，还可以给它继续拉大。比如说从
    2.8 到 4.4 拉大到 2.6 到 4.6，然后我们再用同样的方法循环。循环测试一跑，发现这次 200 次循环就跌到了 80% 以下，就说明这次两个电压点设置得不合理了。就是这样来找它比较健康的放电起始点和充电起始点。


    我刚才只是举了一个虚拟的例子，在实际情况中，估计没有电池可以做到我刚刚说的那么宽的电压范围。


    比如说我们当前用在手机中的锂电池，到底该充到什么时候电压停止呢？到底该放电放到什么时候让放电截止呢？


    这些重要的参数都是通过大量实验已经测得非常完备的，而且这些点是极其关键的，一旦有一次没把控到，比如说你充电充到 6V 去 了，或者放电放到 1V 以下了，这个电池当场就报废了。所以，锂电池的充放电控制根本不能依靠人的经验来操作，只能由专门的控制电路来实现，所以人根本就不用操心。


    # —— 电池寿命无需担心 ——


    知道了这些电池的底层知识之后，你就知道，要保证电池的寿命，需要让它一直处于合适的压力之下。


    比如说 iPhone 的电池，如果你每次都是让电量控制在 20% 到 90% 之间循环，就相当于把它的充放电的两个电压点的间距给缩短了，电池如果长期在这种环境下循环，寿命是可能增加的，也许寿命是之前的
    1.5 倍呢，这说不准。但是你总是人为地控制在 20% 到 90% 这么循环，也就相当于你一直在用一个电量只有现在 70% 的一个小电池的手机，你自己用起来也不方便。


    另外，还有人担心，比如我这手机是不是不能用到电量为 0 啊，这手机已经显示只剩 10% 的电量了，对我手机是不是就有害了呢？


    这也没有害处，因为这并不意味着电池没电了，它只是告诉你系统显示没电了，这两个之间是有差距的。


    比如电池的特性上，它原本是 2.8V 是不能继续放电，但是在设计手机的时候，工程师会考虑把保护点设置得高一些，比如设置到 3.0V，因为它总要留出一些余量。在实际使用中，比如就会出现这种情况，有人把这手机用到自动关机了，又没有充电，就一直放了
    1 周的时间，这时候因为保护点设置得比较高，所以它总还是有一定的锂离子在负极中维持着平衡，负极是那些由碳组成“小房子”，因为有锂离子存在就不容易塌陷，所以尽管放了
    1 周，再充电，电池的容量也不会有损失。


    所以你看，不论是电池的设计，还是系统的设计、产品的设计，都在尽可能地留出余量保护着电池。所以原则上，我们拿到产品之后，我们对产品做的任何的动作都触及不到电池的重要参数，一切保护和设置都有保护芯片接管了，就算是有些技巧可以延长电池的寿命，这些技巧都是有代价的。就像我刚才说的，你用起来非常不方便，而且实际相当于你用了一个小电量的电池。


    锂电池虽然脆弱，但也正因为它脆弱，保护电路的各种功能才没有任何遗漏，已经形成产品的东西在电池功能上，用户使用的所有的动作都触及不到电池的实质。那些网上所谓的小贴士，只能给自己增加不便。最实际、最管用的做法，就是随心所欲地用，不行了就换电池。尤其像现在，iPhone
    换电池、扩内存的服务已经非常多了，非常稳妥了。


    # 划重点


    +   1. 作为普通用户，对于手机电池无需进行任何维护，各种关于电池保养、充电小技巧等，不仅几乎没什么用，反而给自己带来很多麻烦。

    2. 锂电池很脆弱，所以在形成产品前已经经过了非常稳妥的设计，它的充放电控制根本不能依靠人的经验来操作，只能由专门的控制电路来实现，所以人根本就不用操心。


    卓克


    这次答疑就是这样，我们明天再见！

