    # 133 | 旁证：猫为什么那么孤冷？


    133 | 旁证：猫为什么那么...


    # ——概念12：旁证——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    网上有很多讨论猫穿越生活的内容，猫好像对人并不怎么依赖，有的甚至把主人的家当成是临时的落脚点，天气暖和了就不辞而别。那些不离开家的猫也有很多不让人抱，抚摸也不能太久。像主人上了一天班，打开家门，很少很少见到一只猫热情地扑上
    来。人人们对它好，被它当作理所应当。


    但上节课我们已经严密地分析出，猫大约是在1万年前被驯化的。那么为什么这么久了，还是不能跟人建立起紧密的情感纽带呢？


    其实在人类驯化的所有动物中，猫确实属于一个特例，因为像猪、牛、羊、鸡、鸭、狗，它们要不就是能给人类提供蛋白 质，要不就是能给人类提供动力，反正总有一个很实际的用处。唯独是这个猫，好像并没有给人类带来什么直接的好处，反而是我们要为它付出很多，铲屎工这个职称就是这么来的。


    # ——猫在人类社会的位置——


    实际上，猫是这样获得自己在人类社会中的地位的。


    一万年前的谷仓给了老鼠机会，不夸张地估计，老鼠已经吃掉了人类粮食总产量的1/10，所以人类视老鼠为大敌。


    而猫的祖先，非洲野猫又是这样一种生物，它的体型不大，不是群居动物，像群居的食肉动物是可以通过协同作战，捕捉比自己体型大很多的食草类动物的，非洲野猫不是，它是单独行动的。所以对猫来说，老鼠那个尺寸的身材是刚刚好能猎物的，所以哪里的老鼠丰富，哪儿就有可能出现猫。


    而野猫又是这样一种生物，它虽然是纯食肉类动物，但是体型对人类又几乎没有威胁，这个猫小小的身材没法造成大规模的破坏，甚至连人类婴儿都不在它的食谱里。


    而且当人类发现，它们主要的食物就是那些糟蹋粮食储备的老鼠的时候，那就更不介意猫生活在他们周围了。


    于是，猫就成了一种可以在人类群落周围得到足够好处，又能避免被人类集中猎杀的食肉性动物。


    从我刚刚的描述，不知道你能不能体会出一种感觉，好像猫能够成为人类的伙伴是因为它找到了自己的定位，而且定位极准。


    当然，这么理解是错的，这并不是猫主动找的，而是人类在农业社会出现之后，制造出来一个稳定的生存机会，它能给一个生物提供稳定的食物来源和生存空间。这个生存机会有一个专有名词，叫做生态位。


    一个生态位就会有各方面的限制，比如说同是食肉类动物，像加拿大北部的城市里，现在也会在清晨发现有翻找人类垃圾箱、吃那些残羹剩菜的北极熊，但是它们就永远不可能成为人类驯化的对象。因为它虽然也是自给自足吃点垃圾，或者也能捕捉一些大老鼠，但是它对人类的威胁太大了，所以人类看到北极熊，下意识地就要把它赶走，如果赶不走，就要把它杀死。


    所以猫正好是在各方面的限制条件中满足了条件，占据了这个由农业社会创造出来的生态位。


    # ——猫孤冷的原因——


    但是猫仍然很孤冷，因为自从非洲野猫起，它们就是独居生活的，永远都是独来独往。


    而人类驯化的牛、马、羊、狗，它们在野生生物种的年代就是群居生活的，它们早就对拥挤的生活习以为常了，基本上生活对于它们来说只要有足够的食物，有地方可待就够了，生存空间狭窄一些这都不是问题，所以它们跟人住在一起也没有障碍。


    群居生活的动物还有一个特点，就是有鲜明的阶层结构，这个结构规定了在食物出现之后谁先吃、谁后吃，在队伍进行当中谁打头阵，在外敌入侵的时候谁首先出击等规范。在这些群居动物里，头羊、头牛、头马、头狼，在驯化之后，这个头领就都成为了人，于是从第一次它们误以为人是它们的头领之后，就开始对人产生了一种错位的信任和服从，这种生活习惯上的转移最终也是它们对主人出现感情依赖的基础。


    这种信任跟依赖的原形就是头领带着队伍在艰苦环境下讨生活的习性，这种习性不是能轻易丢掉的，因为它保证了这个物种在几百万年中一直存活到现在。


    所以对这些已经被驯化的动物来说，人一旦全部消失，它们如果不能马上找出来一个头领的候选人来，也许会在人消失后不久，因为其他的动物竞争而死去。


    但猫是不一样的，猫跟人共同生活的生存基础并不是建立在人一定存在的基础上，而是建立在老鼠足够多的基础上。所以环境中始终没有什么压力能让猫一定要对人产生出依赖的情感。


    所以我们甚至可以猜测，最早一批家猫只不过是当时那些胆子比较大的，不太介意在自己捕食的时候有人在旁边看着的那一群非洲野猫。


    所以说到这里，你就可以理解为什么猫总是那么孤冷了，因为它们的祖先是独居动物，后来的环境也没有出现让它们表现出忠诚跟依赖的压力。尤其是在现在，在到底是谁向谁献媚这个问题上，双方好像也已经谅解了一个儿，那今后就更难说猫会向着关心系主人这个方向演化了。


    让我们再回到一个关键问题上，那就是世界各地不都是有小型猫科动物吗？世界各地不都有人迁徙之后形成的农业社会吗？那么为什么全世界目前所有的猫都只有一个非洲野猫的祖先呢？


    其实简单地说是因为这一小撮非洲猫占得了先机，农业文明的火种最早在1万年前出现在新月沃地，之后由那儿的人带向了亚洲、欧洲。在早期农民出走的时候，那些刚刚习惯跟着人一起生活的野猫也随着迁徙了，于是这些被驯化的非洲野猫的后代也先占占据了每一片新区域中对应的生态位，非常有效地关闭了在那个新区域里本土野猫被驯化的大门，这个机会已经失去了。


    # ——家猫单一起源的原因——


    假如真的有一种机制，让非洲野猫没有跟随当时的农民迁徙的话，那其实到了现在，亚洲、非洲、美洲的小型型的本土的野猫，也一样有机率占据那个生态位，猫的祖先就可能有很多很多了。但是可惜，当初非洲野猫已经占得了先机。


    现在寻找各大陆最早的猫，时间顺序大约是这样的，新月沃地是在9500年前，巴基斯坦是在4000年前，埃及是在3600年前，希腊是在2500年前，欧洲中部跟亚洲大陆是在2000年前，美洲大陆证据不足，传说最早是哥伦布带过去的。


    说到这儿，可能还是有些同学想问，猫现在的品种差异挺大的，难道家猫真的是单一起源吗？


    关于宠物猫的育种专门有基因分析，国际猫协会现在认可的品种一共是58个，但通过基因分析可以发现，这58种猫，它们只在10几个基因点位上有改变，而这些位点控制的基因就是毛色、毛的长短、发质这些属性，它们之间的差异不足以把它们分成A、B、C、D这些不同的物种。


    这种差异之小，就跟中国人跟日本人的差异那么小一样。


    而且即使是这些毛色上的差异，也仅仅是在1400年之后才出现的，也就是说在明朝之前，在文艺复兴之前，全世界所有的家猫大致都是非洲野猫那个样子。


    # ——今日内容小结——'
