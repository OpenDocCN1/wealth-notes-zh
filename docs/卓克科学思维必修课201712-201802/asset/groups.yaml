    上周有很多同学看到一个报道，说世界上首例换头术成功完成了，希望听听换头术是不是真的。其实去年的专栏《阜老板聊科技》中我就回答过一次，这是一场披着医学外衣的个人秀，但是那个时候离他们操作手术还有一年多的时间，上周的11月17号手术终于实施了。


    两个核心人物：


    一个是意大利的神经外科专家赛吉尔·卡纳维罗；


    另一个是哈尔滨医科大学第二医院的骨科医生任晓平。


