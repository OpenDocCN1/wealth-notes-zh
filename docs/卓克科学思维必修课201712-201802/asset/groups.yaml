    ## 122 | 发展：伟大的艺术作品离不开“梅毒”？


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_76_0.png)


    122 | 伟大的艺术作品离不...


    ### ——► 概念11：发展 ◄——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光观察曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓宽了生命的范畴，缩小了死亡的边界。


    在之前的课里，我们几次涉及到15世纪末、16世纪初，欧洲人到了美洲大陆之后发生的事。这段历史对后世的影响有一个专有名词，叫“哥伦布大交换”。现在全世界非常主流的玉米、土豆、西红柿、烟草、可可、橡胶，都是在哥伦布大交换之后才从美洲流向世界的。而牛奶、大豆、小麦、甘蔗、大米、高粱、苹果，这些是从欧亚大陆流向新大陆的。这些是农作物上的交换，当然还有疾病的，比如天花、麻疹是欧洲人带过去的。


    那美洲人有没有当地特有的疾病传给欧洲人呢？


    有，那就是梅毒。


    最近两节课，我就要说梅毒这种传染病，因为它也是一种塑造了近代文明的传染病，尤其是对现代医学的影响更大，可以说，医学化理作为一个学科分支出现，跟它也是分不开的。


    ### ——► 探寻梅毒的起源 ◄——


    刚刚我们说梅毒是起源自美洲的土著，然后由水手带回欧洲，这种说法非常非常普遍，但是要下这种结论，起码你得有一些证据，就是得证明1500年之前，美洲大陆有梅毒存在，实际上并没有这种证据。


    另外，你还得找到当时某几个水手感染的证据，也没有有。


    实际上真正做医学史的考据研究，这些证据弱得很，只有两个间接证据：


    - 第一个，是两事件在年代上是吻合的；

    - 第二个，是在1500年之前，欧洲医学文献里没有类似病症的记载。


    最近几十年，也有些学者动过真格的，想学研究大流感的那批科学家那样，开挖古墓，不过当他们真的把欧洲的古墓挖开之后，想从尸身上找一点生物学证据，也都失败了。因为梅毒是非常脆弱的。


    几十年前，还有一种主流的猜测，就是梅毒一直小范围存在于欧洲的犹太人圈子里，而欧洲是在1490年开始有组织地驱逐犹太人，才让这种病在欧洲蔓延。但是这个证据也弱得很，尤其是最近几十年，这种带有特别明显种族主义的反犹太主义跟排外情绪就导致这种观点，就算是有一些证据也根本没法站住脚。


    还有就是说它源自于非洲。


    不管是哪种说法，大部分的人都不愿意承认梅毒源自他们自己家乡。所以当这种病在欧洲爆发的时候，意大利人管它叫法国病，法国人管它叫那勒斯病，俄罗斯人管它叫波兰病，波兰人管它叫日尔曼病，日本人管梅毒叫唐疮，而只有中国人管梅毒叫广州溃疡，只有中国人没往外推卸责任。


    ### ——► 梅毒与宗教 ◄——


    梅毒的正式名字叫 Syphilis，这个名字又是从哪儿来的呢？


    这是一个意大利医生在1531年写了一部长长的拉丁诗，名字就叫《Syphilis》，梅毒。因为这首长诗描写的就是梅毒爆发那个时期社会的情景，所以特别流行。


    这本书里，把梅毒形容成一种道德沦丧之后得到的报应，在这首长诗里，第一个患梅毒的病人，名字就叫 Syphilis，他是一个牧羊人。他当年在信仰上背叛了上帝，改信了一位国王，所以上帝知道之后，就让他生了一种怪病，浑身长疮，用这种方法惩磨他。


    别忘了，这个作者本身的身份是医生，所以可见那个时候就算 医生，对为什么发病基本不太可能有什么正确的理解。


    当然，他写这部长诗还有一个重要的原因，就是影射和攻击新教，马丁·路德因为受不了天主教的腐败，在1517年公开反对卖赎罪券，所以这部长诗发表在宗教改革之后14年，正是舆论风口浪尖上。


    这个意大利医生他自己不但是天主教的信徒，也是几个红衣大主教的私人医生，所以当时他这部长诗中也是在诅咒新教的人。这部诗的主人公是一个牧羊人，牧羊人 Shepherd，这个单词在拉丁文中也是牧师的意思。


    所以长诗的梗概也可以这么理解，就是一个不信仰上帝的人，把其他国王当作信仰的这么一个牧师受到了上帝的惩戒，浑身长疮，脚底流脓。梅毒之所以现在这么流行，就是上帝对新教徒的惩戒。


    ### ——► 脆弱的梅毒 ◄——


    而实际上梅毒到底是由什么造成的，直到第一次爆发过去400年之后才找到答案，就是一种细菌，叫梅毒螺旋体。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_76_1.png)


    它其实很脆弱，必须得在合适的体温、体液里才能生存，离开人体之后10几个小时就死亡了。比如说在有洗衣粉的水里，5分钟就全灭了，所以这也导致梅毒是极为依赖亲密的性接触来传播的，而且也因为它在体外太脆弱了，所以非常难做实验室的细菌培养，这就给研发药物造成了不少困难，就算是到了现在，梅毒也没有疫苗出现。


    它的感染跟天花类似，得这个病是不分高低贵贱的，发病也不急。第一次感染之后，生殖器上会出现圆形的溃疡，出现了之后并不觉得太疼，一两个月之后就消失了。很多人都会以为痊愈了，之后会有相当长的一段时间跟正常人一样，这段时间最短的一个半月，最长的能有一年的时间，这段时间也是传染性最强的，因为他可以传播疾病，但是他自己又可以正常地活动。


    但过了这段潜伏期，一旦发病了，就是全身皮肤的皮疹跟溃疡，这时会非常疼，而且还会发热。病症继续发展就会侵袭到身体的各个器官，最后器官功能衰竭，人就死了。梅毒患者的照片特别恐怖，我就只放了两张16世纪梅毒患者的头盖骨的图片，大家看着头盖骨可以想象一下这个病如果发生在身上会有多严重。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_76_2.png)


    从照片里大家可以看到，因为梅毒与死的人，连头盖骨都已经被梅毒螺旋体破坏到这种程度了，那身体其他地方也都遭了殃。


    而影响最大的就是神经系统，大脑受到侵袭之后会出现各式各样的神经疾病，人也会出现间歇性的暴怒、狂喜、多疑，或者是反方向的极度抑郁。患者前后完全是两种人格，甚至连宗教信仰，价值观都发生了180度大转弯。


    ### ——► 伟大作品的背后 ◄——


    很多同学从小上学就知道，贝多芬在耳聋之后还在坚持创作，但是只有少数人知道，他那会儿怎么创作呢？


    听不见声音，就是用一根根子抵在钢琴上，另一端抵住自己的下巴，然后钢琴的振动直接传到头骨上，这样他就能听得更清楚一些，这是很少人知道的。


    但是估计更少的人知道，为什么他在30岁之后会耳聋，后来在解剖中就发现，他的头骨上有明显的鼻梁凹陷和被侵袭的痕迹，而且他耳聋发病过程跟梅毒患者是一样的，就是先有一侧的耳聋，在30岁左右双侧耳聋，这些都是非常符合先天性梅毒的症状的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_76_3.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_77_0.png)


    在贝多芬的日记里还可以看出，他经常去妓院，还专门找过好几次医生治疗梅毒，所以很可能贝多芬是先天跟后天梅毒的同时感染者。诗人海涅曾经评价贝多芬的音乐里有股幽灵般的声音，带着死亡的印记，这些很可能都是在梅毒入侵神经系统的时候留下的作品。


    在贝多芬的葬礼上，举火炬的是舒伯特，但是他在第二年就去世了，原因也是梅毒。舒伯特从患了梅毒之后就很少踏出家门了，因为他非常怕别人看到自己的样子。但最终这个消息还是被他的家庭医生走漏出去。


    舒伯特去世那天晚上，死讯传到了音乐家舒曼那儿，舒曼抱头痛哭，这不完全是因为舒伯特去世了，也因为舒曼本人也是梅毒患者，他一直在用水银跟砷治疗，其实这种方法跟那个时候治疗天花差不多，浑身抹满水银，希望多出汗、多拉肚子、多放血、多排尿、多呕吐，但这些都没用。舒曼那时候已经因为梅毒侵袭大脑，间歇性的神经病发作了。


    当年凡是往外排泄的方法，都是医学界奉为规范的治疗方法，信奉的根源就是古希腊时期的“四体液学说”，认为病症源于体内的几种液体失衡了。


    梅毒的出现，实际上对当时的医学信奉的规则有很大的冲击，因为这个病它明显是人传人的，既然有传播的属性了，那逻辑上就应该是有一個对应的实体，在人与人之间传来传去。这就像一个煤球在传递过程中，大家手都会变黑那样，所以怎么可能是一些体液不平衡导致的呢？


    去世于梅毒的还有瞎子阿炳，他是梅毒性失明。除了他，还有更多的名人，比如说割掉自己耳朵的梵高，发狂的尼采，尼采的《查拉图斯特拉如是说》这种根本没有人看得懂的书，就是在梅毒入侵他神经系统的时候写下的。尼采很少服别人，但是他说过，世界上唯一一个可以跟他相提并论的就是诗人海涅，其实海涅也是梅毒患者。


    ### —— 今日内容小结 ——


    我们刚刚提到的一众音乐家、诗人、画家，你发现他们都有一个共同的特点了吗？


    就是他们的作品与作品之间，情绪起伏很大，都有可以称之为癫狂的作品。


    叔本华曾经评论，说近代欧洲的文明特点，第一就是梅毒。不过叔本华这句话也不能太过相信，因为叔本华本人也是梅毒患者。


    钱钟书在《围城》里也写到过，说梅毒在遗传上产生白痴、疯狂跟残疾，但据说也能刺激天才。


    这些历史翻出来也提示着我们，在我们感叹那些传世作品，甚至是令人费解的作品有多么伟大的时候，那里面固然有它的伟大之处，但也免不了存在这些作者在精神失常的时候创作出来的内容被后世过度解读跟过度神话的部分。


    在欣赏作品的时候，如果我们能有这样矜持的态度，也是科学证据给我们提供的一种更客观公立的角度，让我们变得更理智，这是拥有科学思维之后自然而然形成的思考习惯。


    ### —— 今日思考题 ——


    这节课说到，各国在给梅毒起名的时候，每个国家给梅毒起的名字都带着其他国家的名字，唯独中国，管梅毒叫广东溃疡。那这是为什么呢？而这又反映出当时中国什么历史背景呢？


    如果你有想法，就留在评论里。


    ### 划重点


    - 1. 梅毒侵袭大脑会引发各种神经疾病，人会出现间歇性的暴怒、狂喜、多疑，或者是反方向的极度抑郁。

    - 2. 梅毒一定程度上塑造了近代文明，贝多芬、舒伯特、舒曼、梵高、尼采、海涅等众多伟大的音乐家、画家、哲学家、诗人都是梅毒患者，免不了有很多精神失常时期的创作。

    - 3. 传世作品无需过度解读和过度神话，科学证据给我们提供了一种更客观公立的角度，让我们变得更理智。


    卓克

    我是卓克，咱们明天再见。

