    ## 130 | 旁证：家猫是什么时候出现的？


    130 | 旁证：家猫是什么时候…


    ### ——► 概念12：旁证 ◄——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    想知道猫为什么那么孤冷，我们得先知道猫是怎么来的，这是一种从演化的角度看问题的好习惯。


    ### ——► 家猫源于共同祖先 ◄——


    到现在为止，对家猫怎么驯化来的，最有依据的解释是这样的：


    目前全世界所有的家猫都源于一个品种的野猫，叫非洲野猫，也叫非洲斑猫。


    这个结论听着很普通，但仔细想一下，就会发现有点惊人，因为世界各地都有人类居住，养猫所需的条件也都满足，当地的小型猫科动物自然也都会成为后来家里的宠物猫，所以更自然的一种假设，应该是猫的祖先应该是多点起源的，更何况现在的宠物猫种类还特别多，有的脸特别扁，有的长耳朵，有的身上没毛，有的跟穿了一件猿皮大衣似的。这更预示着，家猫好像是从各种不同的野生种演化过来的。


    但其实，这些假设现在都已经被推翻了，猫是单一起源的，而且起源的时间点还不远，有多远呢？咱们先保密。


    家猫的祖先是哪种野猫呢？


    这个确认工作不太做好，但是科学家作为了假设，就是猫是这么一种动物，它并不是一种可以在几百公里上千公里的范围内随意迁徙的食肉类动物，在自然界里观察，野猫的生活方式也是在一片小小的领土上定居生活的，这片领土里的小动物就是它的食物范围。


    如果按照这个逻辑推演下去，假如世界各地的猫都是这么生活的话，时间拉长到几万年，它们一定会在各自的区域演化出不同的基因类型，甚至连外貌都会相差很多。可实际情况不是这样，它们确实演化出了不同的基因类型，但是外貌却都差不多。


    对世界各地猫的 DNA 分析工作是从2000年开始做的，牛津大学动物学的科学家卡洛斯·德里斯科尔花了几年的时间，收集了全世界各地野猫的 DNA 样本，同时也采集了许多地方家猫的
    DNA，一共是979个，然后作了详细的分析。


    2007年的時候，結果分析出來了，全世界的野猫一共有5大系列，欧洲野猫、荒漠猫、亚洲野猫、南非野猫和非洲野猫。虽然最后一个它名字叫非洲野猫，但实际它们生活的区域是中东和北非。


    知道了这几个野生种的基因分类，再把家猫的 DNA 跟它们挨个地作对比就发现，原来家猫的 DNA 跟非洲野猫的 DNA 从遗传学上根本没法区分。所以到此为止，终于找到了，全世界家猫的祖先，就是非洲野猫。


    ### ——► 家猫的历史 ◄——


    知道了家猫的来源，接着就要弄清它是什么时候被驯化的了，这就免不了要用分子生物钟。这个工具我们在之前很多节课里都介绍过，但是用在家猫身上竟然失效了，因为分子生物钟本质上是测量基因突变的积累量，然后再弄清单位变化量所需要的时间。知道这两个数，然后做一下乘除法，就能把积累量对应的时间算出来了。


    但是我刚才讲了，家猫跟非洲野猫的 DNA 从遗传学上几乎没法区分，也就是说突变的积累量实在太少了，少到无法测量。


    没有明确的结果，虽然让人挺失望的，但实际上没有差异也是一个结果，因为它预示着驯化发生在离现在很近的年代，大约也就是在三四千代繁殖周期之内。


    但具体是什么时候，就得用其它的工具来分析了，什么呢？


    就是考古遗迹。


    这节课出现的是一个跟之前课里相反的逻辑，从前的课里，考古遗迹总是提供更粗糙的细节，而分子生物钟总是提供更准确的信息，但是到了这节课，两个工具的精度竟然调了一个个儿。


    为什么会这样呢？


    因为分子生物钟如果真的把它比喻成一个钟表的话，不同物种，这个钟表秒针跳动得快慢是不一样的。就像微生物它上一代和下一代只需要间隔10几个小时，昆虫需要2个月，小麦需要大半年，那猫就需几几年，而人需要10几年或者20几年。但是每代需要的时间只是其中一个参数，如果遗传物质还是多倍体的話，那也更容易更新一些。还有影响因素，就是环境的剧变也相当于是加快了分子钟秒针的转速。这次发生在猫身上的事情就相当于说，分子生物钟那个秒针竟然还没有跳变一秒就要轮到我们开始研究了，所以没法研究，那我就只好从考古证据里找了。


    但也正因为它预示着发生的年代比较近，所以考古证据还是比较丰富的。


    最古最远的家猫的遗迹，是2004年巴勒史博物馆的科学家发现的，他们在塞浦路斯岛的一个洞穴里发现了一具9500年前的人类遗骨，在这个遗骨旁边40厘米，恭恭敬敬的，和成人的头跟脚的方向一致，还安放着一只小猫的遗骨，测算一下，这小猫还不到1岁。这个发现好得很，因为在塞浦路斯发现，就tested说明那就是一只家猫。


    为什么在塞浦路斯发现说明它是家猫呢？


    因为塞浦路斯是一个地中海的岛屿，岛屿上是没有野生猫的，一旦在这儿发现了猫，它一定是外来物种。那么你想，一个人能把猫专程跨海带进来，下葬的时候还把猫一起殉葬，那就足以说明这不是普通的野猫，这猫生前一定是跟主人相伴的，关系还不错。而且，能把心爱的小猫跟自己合葬，做到这种地步，其实已经说明在9500年前，人跟猫已经结成了一种特殊的关系了。


    除了这个考古证据之外，还有其它的，那就是人类最早谷仓的遗迹，那大约是在1万年前，而且在这个遗迹里还发现了小型啮齿类动物的遗骨，也就是说人类有了农业之后，在1万年前就开始有余粮了。


    余粮不但让人类过得更好，也让老鼠抓到了机会，找到了更稳定的食物来源。而且老鼠又是猫稳定的食物来源，于是猫就可以长期生活在人类附近了。也就是说在人类有了余粮之后，家猫出现了，这个时间点就是农业出现以后，大约距今1万年。


    这个时间点也跟我们之前课里讲过的新仙女木事件是吻合的。新仙女木事件发生在12800年前，后来在12000年前全球才逐渐暖和起来，也只有全球温暖起来之后，人类才有机会发展农业。


    在那次农业的爆发当中，改变的不只是人类，还有像原来只是狗尾草一样的那些植物变成了小麦的祖先，现在已经成了全球数量最多的植物。田鼠的野生种祖先也获得了巨大的优势，它们从前只是野外众多啮齿类动物的其中一种，跟其它的动物分享生物资源，并没有看出一丝一毫的优势来。但是现在，全球大约有200亿只到500亿只和人类一起生活的老鼠了，猫也是如此的。


    那猫为什么不能像狗一样对我们绝对忠诚，心系主人，而大都比较高冷的性格呢？咱们下节课再说。


    ### ——► 今日内容小结 ◄——


    这节课我们借“家猫最早是什么时候出现的”这个问题，和大家介绍了分子生物钟和考古遗迹作为考证的时候出现的一个反例。


    在这个特殊的场景下，一个技术更先进的工具反而不好用，还需要传统粗糙的手段配合使用才行。


    这种情况还可以在很多场景见到，比如说有经验的修理师可以通过听发动机的声音，看排气的状况来判断发动机故障点在哪。


    看排气的状态来判断引擎的故障点在哪。

    但如果只是让他使用各种检修设备，从最终测得的参数上找问题，虽然每一个数据都是准确的，但效果还真比不上经验。


