    这些东西的流动性，让亚洲人没有出现美洲那种文明因为缺少了某些重要元素被卡住不动的情况。所以之后我们赶上来了，参与到了整个文明的进程中。而且在这种趋势下，可以预测，今后全世界的人，因为流动性的增加，会趋向于向着抹平差异这个方向发展，通俗来说，就是今后各国人会越来越像。


