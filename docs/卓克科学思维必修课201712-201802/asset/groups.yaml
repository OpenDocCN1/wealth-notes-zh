    # 2018年，给你的第一封信


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_102_1.png)


    # 小师弟，你好！


    这是我在2018年给你的第一封信。


    首先我要感谢你的陪伴与信任。


    经过100多节课程的学习，相信你已经能感受到我们这套课程想要交付的价值是什么。


    就是用具体的科学知识点，讲解科学的工具和方法是如何在现实中应用的，希望你能跟着我系统化地掌握科学思维的模式。


    长久以来，人们对于科学产生了不同的认知，还由此产生了群体的分化，主要有三种：


    第一种，是有科学思考习惯，可以理智、客观讨论问题的人。他们认同科学，不断更新自己。


    第二种，是认可科技带来的发展，但缺少科学思考习惯，容易被披着科技外衣的话术忽悠到。


    第三种，是抵触科学，思维固化，崇古尚古。


    咱们专栏的同学都知道，当下具体的知识，不论多精尖，也都终究有它的局限和范围，新的科学研究，大概率也会颠覆过往的科学结论。


    而我最希望看到的，就是你能通过我的课，更深入地理解科学的价值，掌握科学的方法论，建立起科学思维，在生活中知道该怎么对陌生的知识做出正确的判断，不断地更新自己的知识体系。


    而我更希望见到的，就是我们这群人，愿意去将科学传播出去，让第三种、第二种群体的人们也进入我们的行列。


    # 所以，今天我发起一个活动：


    征集你在传播科学知识、科学思维过程中所获得的经验：


    +   成功的经验我们互相借鉴；

    失败的案例我们分析总结。


    无论是成功的还是失败的，我都希望你能分享出来，与大家进行交流，我们集思广益，一起来打磨一套传播科学知识的方法论。


    # 活动目标：


    我们一起打造一套“科普方法手册”，然后把它分享给所有得到用户。


    # 内容形式：


    内容形式不限，当然，我期待你的故事。


    # 活动奖励：


    我和得到准备了 5份 199元的《卓克·科学思维课》专栏的兑换码，送给留下优质内容的同学。


    下面，我先分享一些我在给我父母进行科普的过程中总结出的增加成功率的经验。


    # 供你参考：


    +   1 要针对具体的知识细节纠偏，保持交流的态度，而不是强势灌输，更不要去评价“人”。

    2 对中老年人传播时，不试图改变他们的价值观，体谅老人比纠正错误更关键。

    3 优先选择和对方切身利益紧密的问题说，慢慢养成他对你的信任。


    非常期待你来分享你在科普过程中的故事、经验、收获和感受。


    此致敬礼


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_102_2.png)


    2018年1月17日


