    # 154 | 流变：煤和石油挽救了森林？


    154 | 流变：煤和石油挽救...


    卓克


    今天是大年三十，恭喜你快乐的度过鸡年的最后一天，迎接新的一年。


    咱们的课上线到现在已经180天了，课程过半，我自己对内容的满意度也在不断的提高，不知道大家听完科学思维的前半程，有没有感受到这种思考方式的味道？


    比如像把事实跟观点区分开，或者学会看着坐跟图表，或者在讨论问题的时候把每个词的含义都界定清楚再讨论，而且讨论的时候不掺杂情感的因素。还有在讨论问题的时候，这些问题中是不是有没法证伪的部分呢？如果有的话就不能讨论了。还有像用模型或者是公式来理解决复的事务，还有就是要求技巧比较高的灵活地运用数学工具，这些都属于科学思维中的方法。


    我在春节期间也会回看这些在去年夏天列下来的课表，把我在这一半年中遇到的更好的素材替换上优化上，希望你听完全年的科学思维课之后，会对这个世界和周围的人有理智客观地思考。


    除了你自己学到了很多科学知识，锻炼了科学思维以外，你有没有对家人朋友产生哪些好的影响呢？他们有没有在你的影响下也越来越靠近科学呢？


    欢迎你在今天的留言区分享你的故事。


    不过今天晚上正是放炮竹，吃饺子，看春晚的时间，陪伴家人最重要，如果你有什么想分享的故事，几天之后再来都不迟，千万不要因为自己掌握了一些具体的科学知识和科学思维方式，和家里人辩论中医和转基因之类的话题。


    # ——► 概念14：流变 ◄——


    一个事物所表现出来的样子，源于方方面面的积累，在复杂系统里，下一步如何发展，只能是建立在原有的基础上，几乎无法推倒重来。


    虽说新能源这个词喊了10几年，但是2017年《财富》杂志统计下来，世界500强前12名里还是有5家石油企业，但是这个也只统计了财务状况透明的上市公司。像中东地区，还有一些非常神秘的石油巨头没有上市，比如沙特的阿美石油，现在猜测它的估值至少是2万亿美元，这是苹果公司规模的4倍。


    尽管如此，在人类历史上，使用时间最悠久的能源却是生物能源，而不是这些化石能源。


    人类祖先有意识地使用火加工食物、取暖可以追溯到100万年前，从那么久远的过去到200多年前Boat的1800年，我们基本只烧树干、树枝、树叶，或者加工成木炭再用。


    这之前，在人类文明史上已经出现过多次因为森林面积大幅减少导致的人口大幅减少。环境破坏的问题其实早在工业革命出现之前就已经出现过很多次了，但科技打开了人类的一项新技能，就是人类知道怎么利用上大规模的能源。


    # ——► 煤炭的使用 ◄——


    在19世纪的时候，人们终于找到了替代品，那就是煤炭。


    煤炭作为燃料，其实早早就出现过几千年了，考古发掘，在不列颠岛上，那里比较冷，早在4500年前就有古人烧煤，像古希腊、古中国在2000年前也有人烧过煤，但那个时候的煤几乎都是暴露在地表的，很浅，煤大部分在很深的地层中，所以始终没有成为主流。


    因为从非常深的地下挖煤这种活，它的复杂程度跟直接砍倒树去烧的复杂程度是不可同日而语的。所以长久以来，人类只砍树而不怎么挖煤。但也正是因为科技在200年前推进到了某一步，就是从地下大规模地取出煤的花销已经和砍树差不多
    了，所以能源终于有了机会切换。


    而且煤这种东西好得很，它的热值高。


    热值是什么呢？


    就是1公斤这种东西烧完之后能放出多少能量。煤一挖出来，大约就是2000万焦耳每公斤的程度，处理成标准煤之后大约就是3000万。但是树木砍倒之后，那个树干、树枝算在一起，大约是500万焦耳每公斤，只有煤的1/4。


    所以，只要解决了怎么把煤便宜地挖出来，挖出来的成本足够低，那烧木头就很不划算了。


    # ——► 石油的使用 ◄——


    但是，就在煤成批成批地从深层的地下取出来之后，人们又把注意力转移到了石油上，发现这个东西更好。


    首先，就是热值更高，烧起来大约是4300万焦耳每公斤，是煤的2倍。


    其次是杂质容易提炼，提纯之后，石油烧起来不呛人。


    所以1908年，福特生产的第一批汽车，它选用的就是热值更高的，更适合轻巧发动机柴油做能源。


    汽车出现之后，能源的切换速度非常快：


    1908年才第一批车下线，这个时候绅士约有10万匹马车。


    仅仅4年之后，其中就有一半变成了汽车。


    又过了5年，纽约最后一辆马拉车在曼哈顿停运了，这一天可以算作是石油登上了能源舞台的第一天。


    到离现在正好101年。


    到了今年，全球使用的能源里头大约有90%是化石能源提供的，剩下10%主要是核能和太阳能，植物作为燃料几乎不再用了。


    化石燃料的储量远远多于森林资源，这可以从两方面理解：一个是时间方面的，一个是空间方面的。化石能源是那些生物资源在几亿年中积累出来的，而森林资源是在最近几十年积累下来的，总量上一定是相差很多的。那第二是从空间角度，化石能源它分布在这个三维空间里，高度至少堆积了几公里，而森林资源只是在一个几十米高的范围里头分布的。


    所以从这两个角度看，化石能源一定会比森林的资源丰富得多得多。从这个角度来说，化石能源也拯救了地球上的森林。


    我们很幸运，能在森林大规模地消失前发展出一个能低成本地挖出煤，和低成本地使用化石能源的技术出来。否则地球的生态估计早就不法支撑人类的生存了。


    # ——► 石油的形成过程 ◄——


    石油是怎么形成的呢？


    这个问题最早猜是恐龙的尸体形成的，因为当时很多大油田的地层是1-2亿年前形成的，而这个年份刚好跟恐龙兴盛的年代重叠。


    石油是恐龙赠给2亿年后人类的礼物，这种说法听起来也很科幻，不过在上世纪80年代之后，这种带有传奇性的说法就被否定了。


    现代主流科学界认为，石油来源是远古时水生的动物、植物的尸体形成的，其中以水生植物为主，煤主要是陆生植物的尸体形成的。


    我们先说石油，它不太可能是由陆生生物形成的，主要就是因为陆生的生物一旦死去，它会直接暴露在空气中，氧化得比较充分，其他动物跟微生物也会把它吃得比较干净。


    而化石能源里，石油的热值是最高的，所以它更有可能是在没有跟空气充分接触的环境下产生的。石油里头含有相当多本来可以作为其他生物吃下去的东西，而却没有被分解，还保留着。


    深入到化学结构，就是指这些碳氢元素之间压缩到化学能，其实它就表征着今后这石油的热值。


    你甚至可以把碳氢元素手牵手中蕴含的化学能理解成一个被压缩了的弹簧，只要弹簧的根数特别多，而且每根弹簧还是被压缩的，那么它总有机会今后舒张开来。一旦舒张开来，能量就释放出去了。碳跟氢分别跟氧结合变成了二氧化碳跟水之后，弹簧就彻底松开了，能量就被全部释放出去了。'
  - '[PAGE 183]


    了。


    知道这个过程，你就能理解，石油为什么是海洋动植物形成的。


    那就是因为，它们死后会沉到海底，氧气虽然溶于水，但也只是溶在表面。再往下，比如说2000米以下 thaw海底，就没有什么氧气了。所以，碳氢都不跟氧牵手。并且海底几千米也没有生物去吃它们，去分解它们，它就可以顺利地保存很多年，沉积得越来越多。


    在地质运动中，有些沉积就被周围的岩层压住了，这些尸体也慢慢地跟岩石融为一体，变成像岩石一样的东西，这个过程叫做岩化。


    最终，这些尸体看上去跟石头就没有区别了，只不过它这里边包含着很多没有分解掉的有机物。这些岩石如果拿到了，是可以直接烧的，跟烧煤是差不多的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_183_0.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_183_1.png)


    上面两图是最近几年著名的油页岩，美国已经掌握了从油页岩里头采集大量石油的技术，简单说就是用高压水注入到岩石里头，让岩石裂开，这样它缝隙里的那些有机物，那些油和气就飘出来了。


    油页岩这种石头是石油的初步形态，这种形态继续沉积很久，有些石头裂开了，一些小分子量的碳氢物质因为密度比较低，会慢慢地飘出油页岩，顺着地层的缝隙一点一点地往上漂。


    假如遇到了一个空间比较宽敞，那 Veel聚集在那儿，这个空间有时候会比较大，比如它会是一个比立体的工人体育场还大的空间。如果是那样的话，那经过百万年的积累，这个空间里就全都是这种碳氢化合物了，这里就形成了油田。开采这里的石油是最方便的，远比页岩油方便得太多得多。


    煤炭也是化石能源，为什么它的热值只有石油的一半呢？


    就是因为它是陆生的植物沉积下来形成的。陆生植物总是是有充分的机会跟氧接触，比如说一棵参天大树倒下了，这虽然是一个令人惋惜的事情，但其实对树下的其它的生物来说，简直是一片新的乐土。


    比如说树干上会生满真菌、长蘑菇，这些蘑菇又给其它的昆虫提供了食物，昆虫的聚集又给植物的生长提供了机会，有植物，有昆虫，很多小动物都会来这吃饭。这样，动植物、微生物就会围绕着这棵倒下的树，在之后的10几年形成一个小的生态系统。直到有那么一天，连大部分的树干都被消化掉了才算完结。


    这些煤炭都是机缘巧合，没有被这些小生命体完全分解掉就被深埋的植物。


    # —— 今日内容小结 ——


    这节课我们最先说到了，我们很幸运，找到取代木头的更好的燃料，森林保住了一命。


    之后又说了，煤跟石油都是怎么来的。


    整节课背后都有一个标尺，那就是热值。


    我们更喜欢使用石油，一部分原因就是它的热值更高。我们用煤取代木头也是这个理由。不但如此，为什么陆生植物形成煤，海洋动植物形成石油，而不是反过来呢？


    也可以依照热值这个理论来理解。


    # —— 今日思考题 ——


    这节课开头我给过大家煤、石油的热值，那么现在新能源汽车它使用的是锂电池，如果我们也把这个电池从单位质量提供的能量这个角度去考虑的话，新能源汽车使用的锂电池的热值大约是多少呢？


    我先给大家一个参考值，就是现在新能源车里头使用的电池的密度大概是250瓦时每公斤。


    如果你算出来了，那我再多问一句，就是除了这个热值，我还想问你，它跟煤还有石油的热值的差距反映出一个什么问题呢？


    好，今天的问题可能略有点难，希望你能把答案留在评论中。


    # 划重点


    +   1. 在人类文明史上，曾多次出现因为森林面积大幅减少，缺少了燃料，导致的人口大幅减少。\n2. 人类找到了煤和石油，一方面找到了可靠的能源，另一方面也避免了大量森林的砍伐。\n3.
