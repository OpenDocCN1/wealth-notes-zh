    说的就是在灾难之前，不是曾经有过一阵子全球变暖嘛，就是这段变暖破坏了维系已久的海洋环流。曾经北大西洋的海水因为温度低，所以浓度比较高，它就会沉到海底，在海底有一个巨大的流动的趋势，它趋向于往赤道附近扩散。那么海底有这个方向的流动，海面就有一个反方向的补充的趋势，所以就会把温暖的赤道的海水补充到北大西洋去。


    从另一个角度看，这就相当于用大量的海水把赤道温暖的热量送到极地附近，但因为全球变暖的趋势，让北大西洋的海水盐分没有那么高了，于是从海底流向赤道的这个趋势逐渐就弱下来了，底下不流了，赤道表层的水也就不再补充过去了。所以赤道洋流不再流到其他地方去，热量就过不去了。所以别看全球是在变暖的趋势，极地反而是更冷的，这个是一种假说，现在也
