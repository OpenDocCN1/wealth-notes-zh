    ## 概念13：边界


    人类观察世界的边界，是由所能使用到的最好的工具决定的，面对任何问题，只有尽可能多找一些可验证的细节，不过度地理解，不过度地解读，才可能了解真相。


    151 | 边界：为什么没有绿色的恒星？


    + 1. 恒星在发光的时候，尤其是那些发白光、发蓝光的恒星，一样也在发射着绿光，只不过绿色光被淹没在各种其它颜色的光里了。

    + 2. 有些看似简单的问题，背后的答案触碰到的是整个世界的框架是什么样的，这样深邃的内容。


    152 | 边界：人会疼死吗？


    + 1. 疼痛属于情感体验，它并不一定是客观的神经刺激，即使没有发生实际损伤也可能产生疼痛，这也就预示着它很难准确测量。

    + 2. 极端剧烈的疼痛虽然不会直接导致死亡，但是如果没有及时终止的话，会间接导致死亡的。


    153 | 边界：从科学角度理解情感


    + 1. 持续地刺激的情绪表达，停不下来就会影响到控制心跳、血压、呼吸的植物性神经，大笑、伤心、惊吓都可能造成死亡。

    + 2. 昏倒在统计规律上是一种更有可能让物种活下来的策略，因为可以帮助躲过捕猎者。

    + 3. 从科学角度理解情感，不是唯科学主义，而是在文化的基础上增加一个维度，寻找更多实物证据，得到更准确的解答，更为理解情感。


    ## 概念14：流变


    一个事物所表现出来的样子，源于方方面面的积累，在复杂系统里，下一步如何发展，只能是建立在原有的基础上，几乎无法推倒重来。


    154 | 流变：煤和石油拯救了森林？


    + 1. 在人类文明史上，曾多次出现因为森林面积大幅减少，缺少了燃料，导致的人口大幅减少。

    + 2. 人类找到了煤和石油，一方面找到了可靠的能源，另一反面也避免了大量森林的砍伐。

    + 3. 现代主流科学界认为，石油来源是远古时代水生的动物、植物的尸体形成的，其中以水生植物为主，煤主要是陆生植物的尸体形成的。


    ## 答疑时间


    155 | 问答：补钙很难，但也有办法


    + 1. 骨头中的钙极少能溶于水，通过喝骨头汤补钙从根本上就是没有希望的，而且99%以上的其他营养物质也都在肉里。

    + 2. 虾皮虽然含钙量比较高，但盐含量过高，用其补钙得不偿失。

    + 3. 人体的骨密度处于动态中，钙只是其中一种原料，单纯吃钙片补钙，或者添加维生素D，对中老年人预防骨质疏松、预防骨折没有用。

    + 4. 通过喝牛奶，以及适量的运动，是最好的保持骨密度的方式。


    156 | 问答：贫血了怎么补？


    + 1. 全球统计，世界人口中1/5的人有贫血，主要集中在6岁以内的儿童以及妇女，只有成年男性的贫血率是比较低的。

    + 2. 贫血最常见的种类叫做缺铁性贫血，还有少量是严重疾病和基因缺陷导致的。

    + 3. 几乎所有植物性食物含铁都是非常低的，大枣、花生皮、菠菜等都不能补铁，阿胶则完全不含铁。当归、何首乌等中草药不仅不能补血，而且对身体有害。

    + 4. 食物中真正好的能补铁的只有动物的肉和肝脏，血豆腐则可能造成补充过多。


