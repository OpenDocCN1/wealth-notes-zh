    识别跟普通人是不一样的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_60_0.png)


    我们先来看资料中 HIV 病毒的一个放大图。普通人的免疫系统识别 HIV，靠病毒外壳的那两种蛋白，就是 gp120 跟 gp41。这两个蛋白质在图中就是大头钉的圆帽儿跟大头钉的这个针。可是艾滋病难治就是因为这两个蛋白质太容易变异了，免疫系统刚刚识别出来，刚叫来大批的士兵打算围剿，它换衣服了，免疫系统又不认识它了，于是它就能反复复杂逃过免疫系统。


    抗病毒的药物也特别难设计，因为药物一旦设计出来，它的分子结构就固定了，它也只能固定地消灭某一种类型的外壳，这个外壳一变，药物也就失效了。


    而非凡控制者的免疫系统好像不管外壳怎么变，总能识别它的芯儿是 HIV，就好像它们可以透过外壳，能直接识别到病毒的内部那几个不变的蛋白质一样。


    但是这说不通啊，免疫系统是不可能隔着好几层还能识别一个东西内部蛋白质的特性的，因为说到底，识别过程是什么呢？


    就是一个化学结构表面的电特性的吻合与不吻合的判断，吻合就咬住你，就吞掉你。而内部的电特性不会隔着好多层膜还表现出来的。


    那么是怎么认出来的呢？


    在2010年的时候，找到了更多非凡控制者，一共是974位，对他们就作了基因测序，把他们的基因跟那些正常的艾滋病患者的基因作了详细的分析，这一次初步筛选出130多万个基因上的多态位，这些都是怀疑对象了。虽然嫌疑犯多了点，但总归是从30亿个碱基序列中筛选出来的，已经削减了不少了。


    后来又经过几年的分析，定位在300个基因上，最终就发现了非凡控制者的一个蛋白质的突变，它跟其他的艾滋病患者不一样。这个蛋白质影响的就是病毒进入细胞膜时的大门，在非凡控制者身体中，病毒进入之后，变异后的门会在门口留下一滩标记物，这滩标记物是稳定不会变的，是它引起了免疫系统的注意。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_60_1.png)


    那团紫色的弹簧你就可以看作是病毒进入之后留在门外的。


    # —— ◆ 今日内容小结 ◆ ——


    我们现在用演化的眼光来看看 HIV 感染这件事。


    假如在人类远古时期就有过大规模的 HIV 的感染，结果造成大面积的死亡，最终留下来的是这类非凡控制者。那么到了今天，所有人都是非凡控制者的后代了，而 HIV
    病毒的几个基因片段在很多人的辅助 T 细胞里都有。


    当我们对 DNA 测序的时候，发现这段 HIV 序列了，这段序列也跟现在 DNA 中另外98%的序列一样，是处于静默状态的，根本不表达成蛋白质。


    那个时候作为拥有非凡控制者基因的我们，估计是很難猜出这段最初源自 HIV 病毒上的序列是有什么功能的，我们可能也不知道这段片段来自于哪。而这种情况不也正是我们当前看
    DNA 序列时出现的情况吗？


    我们当前看，那上面就有98%的序列都不表达成蛋白质，这里的一小部分我们知道它们起了调控作用，但更多的部分我们根本也不知道起了什么作用。


    所以从这个角度上看，也许我们累积了很多静默的 DNA 序列，都是由其他的，也不知道具体位置在哪的基因抑制住的，它们很可能都是曾经我们身体被入侵过的痕迹。


    # —— ◆ 今日思考题 ◆ ——


    为什么在最初研究非凡控制者的时候，这类人特别难找到呢？这个答案你需要设身处地地想临床跟研究时遇到的情景。


    如果你想到了，就把思考留在评论中。


