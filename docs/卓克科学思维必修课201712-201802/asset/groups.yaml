  md: "\n# 101 | 问答：基因检测值得做吗？\n\n101 | 问答：基因检测值得...\n\n很多同学都问到，基因检测是不是骗人的，是不是忽悠人的，这次答疑我们就说说基因检测值不值得做？\n\
    \n我先说总的原则，对一个性状，或者对一个疾病，相关基因的外显子的测序，凡是这个级别和这个级别以上的测序是可以做的，但是现在做并不值。凡是在这个级别之下的都属于是泡沫，根本不用去做。凡是在这个级别之下，如果你做了，它的价值大概跟算命、相面是差不多。\n\
    \n那么我们要仔细解释一下上面这段话，这句话的背后好像暗示着基因检测是分级别的，虽然大家都叫“基因检测”这4个字，但真正干的事情有高有低，有优劣之分。\n\n\
    # —— 值得做的基因检测 ——\n\n我们先说说值得做的那些基因检测，它们的共同特征就是真实地去测了大段大段的ATCG碱基的排序。你可能听了都觉得奇怪，基因不就是ATCG这些碱基的序列组成的嘛，基因检测难道不是去测这些具体的序列的排布吗？\n\
    \n![](img/8bedc5a33d556c033f724cd3fbb47d99_27_0.png)\n\n是的，只有极少部分的基因检测才会去测这个，剩下的都不测，因为测这个成本比较高，也因为测得太美，所以肯定不是一测就把人体的31个碱基序列全都测出来，而是只针对高度怀疑有可能致病的那些基因序列做了测，它可能是一段几千或者几万个碱基序列的数据，而不是30亿个。\n\
    \n比如说安吉丽娜·朱莉在2015年做 WOW 基因检测，后来就根据检测结果切除了双侧的乳腺。她当年就是对 BRAC1 和 BRAC2 这两个基因的全长作了检测，两个基因分别是有8万多个碱基和7万多个碱基。\n\
    \n![](img/8bedc5a33d556c033f724cd3fbb47d99_27_1.png)\n\n大家知道，人体的基因一共是31个碱基，其中只有2%是外显子，剩下的98%都内含子。外显子和内含子的差异就是外显子最终会表达成蛋白质，内含子不会。而生物实现功能靠的就是蛋白质，所以只测外显子也等于说抓住了主要部分，测序的工作量也能减少98%。\n\
    \n# —— 不值得做的基因检测 ——\n\n下面我来说说大多数基因检测，也就是那些不值得做的检测，为什么不值得做。\n它们都是基于 SNP 的技术，SNP\
    \ 是单核苷酸多态性的缩写。\n\n什么意思呢？\n比如说有一段基因，基因中有一个片段，这个片段叫 AAGCCT，这是大部分人的情况，结果发现有少部分人这一片段是\
    \ AAGCTT，倒数第二个从 C 变成了 T，那么这俩个就称作是一对具有多态性的等位基因。\n\n大约是每1000个碱基，有1个多态位。所以人体一共有300万左右的多态位，这一下就比全基因组测序这30亿个要少太多太多工作量了。而且，即使是多态位，80%的多态位都是处于那些非编码区，所以真正有可能去测的位点也就只有60万个。\n\
    \n就可以在宏观上像数学函数一样，一一映射出一个性状来。在SNP位上的绝大部分的不一样是很难以从宏观上看出有什么差异的，但是我们也有办法，因为现在的大数据应用让科学家们对这些多态位有了新的分析方法，那就是我们不那么费劲地非得从分子生物学的机理一点一点分析，这些不同的分子层面上导致蛋白质水平上的什么不同，然后又从蛋白质的不同再分析出在组织器官上能发挥出什么不同，这么做基本是行不通的。\n\
    \n那我们现在就是通过大数据直接找不同的SNP位和不同人群的特质的相关性，所以这就需要两个大数据库了。一个就是对从前测过的SNP的一个积累，还有一个是人的特质的一个大库。希望能从SNP组合出来的图样的特征对应到人的特征，找到这些对应特征之后，再有人来测试的时候，发现他的SNP的图样跟某个已经总结好的特征是高度吻合的，那么在检测报道里就会给你写，你在某某方面比46%的人更强，这些基因检测的解读报告就是这么生成的。这些相关的映射，小公司很多都是从公开的数据库或者论文里找些资料当作依据，大公司才会自己积累足够多的数据作分析，因为他们测试的人多，所以分析也有可能做得会更好一些。\n\
    \n但即便是更好，测出来的结果本质上都是一些在自己定制的规则下的相关性统计，可是这些公司全都把这些相关性用了一种看上去好像是因果关系的逻辑表述了出来。\n\n\
    比如说某个人患某某病的概率比其他人高了75%，或者是某个人有弹钢琴的天赋，或者数学逻辑能力强、记忆能力强，或者睡眠需求强等等等等，就这些预测。\n\n那这些预测的准确率有多高呢？\n\
