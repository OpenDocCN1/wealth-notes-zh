    ## 126 | 问答：家长怎么帮助孩子学习？


    126 | 问答：家长怎么帮...


    今天的答疑，专门给很多私信问我孩子应该报什么班，和应该怎么学习的家长们。


    虽然我自己还没有孩子，但是作为一个旁观者我也有一些看法，今后如果我要有了孩子，相信一起走的时候也会按照这些方法走的，之后随机应变地调整。


    先说两个在教育过程中出现的不利于孩子的局面。


    ### —— 保证孩子的充足睡眠 ——


    首先一个就是上课时间太早了。


    从人的身高发育和脑的发育的规律来看，成年之前的孩子都需要充足的睡眠。而现在很多学校早上8点上课已经是很早了，有些所谓的名校还要在这第一节课之前弄一个早读，也就是从7点20开始上课，可是7点20还不够，因为有的时候还要轮到孩子做值日。可是大城市拥堵啊，路上咱们少算30分钟可以到，然后再留出10分钟的余量。那么这个孩子至少6点20出门，因为出门前，你得穿衣服、洗漱、吃早点，就算他20分钟完成，所以最晚最晚6点起床。


    父母为了照顾孩子，还要比他起得更早才行。父母的发育已经结束了，累一点这是应该的，这个咱不多提。但假如那个学校优秀是靠高强度的训练堆起来的，那学校有一个惯性，就是留很多作业，就是孩子早上6点起，可是头天晚上也许多作业都写到11点了。


    所以，他们有可能会在这种环境下从小学开始，就长期地没有保证充足的睡眠，就算不顾家长怎么辛苦吧，只从孩子这个角度出发，我都觉得上课时间应该缩短，比如我要是教育部长，我就规定，孩子最早到校时间都不能早于8点半，现在7点就开始了这种模式，实在是不科学，也不利于健康。


    ### —— 应试教育的历史 ——


    健康方面可能还其次，更多的方面是来自于应试教育那种军事化的大班上课。虽然各国的中小学都是这个模式，这也是无奈之举，因为老师跟教育资源是有限的。


    我们虽然不能改变什么，但是起码心里要明白。这种模式的来源，像公立学校的统一服装、统一鞋、统一发型、统一课程内容、统一上课时间，这个方式是要追溯到1860年，把拿破仑都干掉的普鲁士军队训练方法。


    在那个之前，国家出钱设立大批的公立学校的模式是不存在的。谁想上学就自己花钱供孩子去读书，学校要不是教会的，要不是私人盈利性质的。


    但是，战争让普鲁士军队发现了一个问题，就是素质太低的兵听不懂战术，说几遍跟没说一样，战场上还是乱跑，不能严格执行命令。后来就发现，原因是说的太多了，士兵理解不了，记不住，脑子记不住，那写在本上，但是因为不认识字，也没法写。为了提升战斗力，就要给他们补上，同时还要兼顾战斗训练。


    所以你看，为什么上下课那个铃打得那么刺耳，为什么要求在课堂上手背后坐好，有问题要举手，不能随口问，举手那个姿势都贴在墙上，还要统一作息，等等等等。这样大家都认字，都听指挥了，做训练有素的士兵，这样训练的效果确实好，后来把拿破仑都给干掉了。


    这种模式在一八四几年被美国人学去了，一八八几年又被英国学去了。实际上英国在大量地实行公立学校的时候，他们国家识字率都超过90%了。政府把公立的教育作为一个专门的项目来运营，而且为此制定了很多法律，一般来说，政府强制性的规定限制操作的内容大多是运营起来效率比较低的，不如自发生长出来的那些东西健康，但是没有办法，现在已经立法了。


    这样一来，其实教育的本质就逐渐丢失了，很少有中小学是以提升学生能力为第一要务的，分数才是关键。所以中学的六年，你看，实际上初三跟高三几乎就是在大量地浪费时间，做高强度的重复性训练，就不考虑这两年，其它的四年时间里，大部分时间全体同学都都是在做统一的同一种训练动作，一个节奏的学习。


    这样的教育对两类学生是最不利的，一个是学习能力非常强的，一个是非常差的。强的吃不饱，牵制了他的成长；差的是跟不上节奏，白浪费时间。


    所以对孩子的教育，最好的方式其实是私教，就是个性化的方案。


    ### —— 个性化教育方案 ——


    咱就以踢足球为例，来说说什么是个性化的定制方案。


    可能有些人觉得踢球是一种头脑简单、四肢发达的人才干的事。其实不是的，这项活动里，大脑参与的内容特别多。比如咱们设置几个级别的任务，这个级别从低到高。


    L1级别的任务：让一个球员在左前锋的位置，带球往球门方向内切，这个是需要带球能力的，比较简单。


    L2级别的任务：就是让他内切跑动的过程中，尽量只用左脚带球，而大部分人都是右脚右手，所以这就需要左脚带球的能力，这就比L1的要求更高了。


    L3级别的任务：就是在左脚带球、内切跑动的过程中，要求他尽量不看球，你看这个要求更高了，他需要娴熟的左脚带球能力，因为不看球了。


    L4级别的任务：比L3还要高，就是再多设置一个中锋球员，这个中锋跟左前锋完成一个穿插跑位，而且是在禁区弧顶这个位置，两个球员完成穿插，这个要求比L3高在呢？就是他不光需要不看球能把球带到位置，还得需要根据对方中锋的位置跟速度，调整自己的位置跟速度，这还不是最高的。


    L5级别的任务：就是在有对位防守的情况下，完成跟中锋在弧顶的穿插跑位。


    不知道我说完这5个级别，大家是不是能略微体会一些，足球其实很不容易。要想把L5都顺利完成，你的脚必须是已经技术很娴熟了，而且你脑子里必须一直想着教练才布置给你的那个任务，就是完成一次穿插，同时你眼睛不能总是看着球，大部分时间你还要盯着几秒钟后，要跟你完成穿插的那个中锋，看他跑到哪了。这样你才能调整速度，好能在预定的位置完成穿插。除此之外，你还得兼顾着别让那个防守队员把你的球破坏掉。


    在公立学校统一教育是怎么一种情形呢？


    就相当于让所有人都在反复练习左脚带球，也就是L2这个级别的任务，实际上上学里总会有一些好苗子，只用了15分钟就能完成不看球，在禁区弧顶跟中锋完成无人盯防下的穿插跑位，也就是L4级别的，他可以完成了。但是这些好苗子，他的问题在于，只要一出现对位的防守，脚下节奏就乱。他实际上已经超越了绝大多数人，绝大多数人还在L2呢，但是他也有他的瓶颈，他需要反复训练的是L4到L5这个过度。那在这里练上一个小时，估计他就能达到在有人盯防下，还能实破。


    但是可惜，公立学校没有资源给他这些东西，他只能跟着大家一起练L2的这些东西。确实他左脚带球会越来越娴熟，但是他的上限被人锁住了。


    可是人怎么学习才能提升更快呢？


    就是如果把自己掌握的内容画成一个圈，圈里的是自己掌握的，圈外的是没有掌握的，那就时刻把自己一脚踏在圈里，一只脚踏在圈外。每当自己掌握了新的内容，两只脚都在圈里的时候，再把一只脚踏在圈外，这样圈子逐渐地扩大，你掌握的东西更多，而且这样的速度更快。


    一只脚在里，一只脚在外，就保证不会因为早就掌握了这些技术而感到无聊了，也不会因为一直学不会，一直没法突破，感觉压力特别大，所以成就感跟挑战感是频繁交替出现的，这样的训练效果最好。


    怎么才能有这样的训练效果呢？


    那就得需要专业的教练，对学生来说，就是专业的老师。他不但在知识上是专业的，而且对这个孩子知道了什么也是专业的，他通过长期地跟孩子接触，准确知道那个圈已经扩展到什么程度了，那么这个老师就总在根据孩子的反馈调整已知圈未知圈扩展的速度，让孩子总是处于一会儿有压力，一会儿又能克服困难有收获感这个状态中。


    可是想摸清一个孩子的知识边界不是那么简单的事，这知识边界本来就是动态的，需要时间积累你才能了解。而且还要求老师得随时根据孩子的变化设计新的教学方案。所以因材施教是一个高成本的事情，一个班40多个学生，可是只分配一个老师，他根本顾及不到。


    公立教育中，要说最吃香的就是成绩处于班里中位数arithmetic median的那些孩子，他们就是一会儿跟不上了，一会儿又感觉学会了。所以他们的时间倒是一点没浪费。越是处于能力两端的同学，浪费时间越严重。


    明白了这个道理，你就知道，那些绝对顶尖的社会精英，他们的孩子不参加应试教育，因为他们也不需要用分数来争取更好的优质教育资源，他们可以通过捐款成为校董，让自己的孩子长大了以后能直接进入最顶级的高等学府。直接进入。这些孩子在上大学之前，就专门请人给孩子定制教育方案，那这些孩子的时间利用率就会比接受公立教育的孩子高很多了。


    另外就是，家长的素质越高，投入参与设计孩子的教育方案的时间越多，这效果就越好。因为你都是一路学过来的，你也知道学习中每个坎儿在哪儿，就能对孩子的已知圈把握得更准。


    一个社会能不能产生精英，对社会进步是很重要的，所以应该有一个机制鼓励小部分有条件的家庭，就这样定制化地培养孩子。


    不过，对于绝大多数的老师来说，还有反方面的一个规律，就是一位好的大学教授，也许只有1%的把握说，他能为世界培养一位真正的科学家。但是位好的中小学校老师，却有百分之百的把握为世界减少成百上千的愚昧者。


    ## 划重点


    - 1. 从人的身高发育和脑的发育的规律来看，成年之前的孩子都需要充足的睡眠。 2. 教育的本质是以提升学生能力为第一要务的。 3. 应试教育对两类学生不利，一类是学习能力非常强的，一个是非常差的。强的吃不饱，牵制了他的成长；差的是跟不上节奏，白浪费时间。
    4. 家长的素质越高，投入参与设计孩子的教育方案的时间越多，教育效果越好。


