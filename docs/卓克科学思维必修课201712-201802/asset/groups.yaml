    # 复习+预告｜用发展的眼光纵观人类疾病史


    # ——本周课程复习——


    # 概念10：起源


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    103｜起源：保护动物的意义是什么？


    生命的演化史非常漫长，一个物种的出现，有些长达数千万年，没有技术能缩短这个过程，多样性一旦被毁，就是彻底被毁掉，新物种形成的时间远比人类的整个历史还要长，每一个物种就代表着一种可能性。


    # 概念11：发展


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    104｜发展：人人天生都是远视眼？


    +   1. 人类天生都是远视眼，随着眼球的发育，视力会逐渐恢复正常，但很多人的发育没有停止，继续下去就发展成了近视。 2. 虽然发现了16个近视易感基因，但医学研究上依然缺少决定性的发现。
    3. 11岁以下的小孩要配眼镜，一定<|message|>


    105｜发展：近视眼的危害只有看不清吗？


    +   1. 人类身体的“健康”与“不健康”，大多时候并没有清晰的界限，只要不影响寿命，对正常生活影响不大，就不在疾病的范畴之内。 2. 超过600度的高度近视要避免头部做剧烈运动，比如拳击、�蹋、赛车、跳水等，因为会增加视网膜脱离的风险。
    3. 在18岁前，有三种医学界公认有效的减缓近视眼发展的方法：每天在户外待2小时、使用阿托品类的眼药、使用OK镜。


    106｜发展：从统计数据了解最危险的癌症


