    # 复习+预告 | 新的一年，面向科学，看透世界


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_172_0.png)


    下周就是春节了，在这里先恭祝你新春快乐，在假期里吃好、喝好、玩好，当然，咱们科学思维课的同学可能比普通人要多一项，那就是“学好”。


    对于一些同学来说，很可能下周的课，都是在过年回家的路上听完的，一定要注意安全。


    过节了，咱们回到家里，就要开开心心的，照顾好家人，多和家人交流。可不要因为学了科学思维课，掌握了很多科学知识，就和家里人在一些传统观念上产生分歧，科学知识和科学思维的传播，在于日常的多交流，不急于这一时。


    我在这里真心的祝愿你，在新的一年里，学到更多的科学知识，能够更了解这个世界，当然，更重要的，是建立起自己的科学思维。


    # ——● 本周课程复习 ●——


    # 概念13：边界


    人类观察世界的边界，是由所能使用到的最好的工具决定的，面对任何问题，只有尽可能多找一些可验证的细节，不过度地理解，不过度地解读，才可能了解真相。


    145 | 边界：钢铁侠会成真吗？


    +   1. 科技路径上每一个推进，都是跟经济利益挂钩的需求推动的，科技选择往哪个方向突破，背后是成本的考量。 2. 数学等极少数的纯粹的智力挑战，是人类文明的资本。


    146 | 边界：电影为什么每秒只有24帧画面？


    +   1. 帧频越高，就要耗费更多的胶片，高昂的成本形成了巨大的约束，让电影的帧频维持在最低限度的能够满足观影需求的水准。 2. 数字时代，胶片的成本约束消失了，但使用高帧频的电影并没有带给观影者显著的视觉冲击，影院缺少升级设备的动力。
    3. 一个事物所表现出的现状，源于方方面面的积累，看似不合理，存在提升空间，但只要没有遇到危机或者强大的需求，大多就是很难改变。


    147 | 边界：恐怖记忆也能遗传吗？


    +   1. 基因序列不变，但表现出的特征却不一样，而且这种特征还能遗传给下一代，就叫做表观遗传。 2. 每个细胞中都拥有完整的DNA图纸，却能分化出几百种不同的细胞，是因为很多基因被“甲基化”锁住了。
    3. 小鼠实验中，“恐惧”能够遗传，是负责苯乙酮受体的基因的甲基化变弱了，让小鼠对苯乙酮变得更为敏感，过度的反应，被人理解为恐惧记忆遗传了。


    148 | 边界：为什么镜子里的像不是上下颠倒的？


    +   1. 镜子里的像既没有上下颠倒，也没有左右颠倒，而是前后颠倒了。 2. 自然界并没有哪个因素限制了生物在前后左右方向上的挪动，所以不只是人，连其他动物的视觉也是更习惯处理这几个方向上的运动。
    3. 我们感受到、看到了什么，并不是最初眼睛收集到那些粗糙的原始信息，所谓的我们看到的东西，已经是大脑深加工后的内容了。


