    # 132 | 问答：感冒药怎么选，怎么吃？


    # ——关于流感疫苗——


    今年流感比往年严重很多，很多生了病的同学都后悔没打疫苗，一般来说，疫苗接种以后要有2周左右时间，保护性的抗体才能达到足够的浓度，所以现在已经是1月下旬了，就算ικοί听了近期答疑马上上去打，最少也要2月份才能生效。但那个时候，今年的流感高峰期已经过去60%多了，算起来就有点晚了。


    但其实订购咱们栏目同学，很多都已经占得了先机，避免了这次流感。


    最早是在9月12号那节课一一《鸡蛋还能预防流感》中，我就提醒过大家，今年的流感疫苗马上就要上市了，可以趁着秋天接种。而且我提醒了不止这一回，后续说到感冒时也推荐大家接种疫苗。


    不过也一定有不少人接种了疫苗之后还是得了流感，为什么呢？


    这是因为，流感一共有170多种，而每年的疫苗只能针对其中的4到5种做预防。


    # ——怎么选药、吃药？——


    首先，感冒药不杀灭病毒，它只是让免疫系统在战斗中尽量温和一些、克制一些，这样我们人体就不太难受了。


    市场上的感冒药非常多，非处方的药应该选哪种呢？


    虽然我仔细说过不同的成分起了不同的作用，比如：


    +   - 扑尔敏是阻止鼻分泌的；

    - 右美沙芬是抑制咳嗽的；

    - 对乙酰氨基酚是降体温、减少头疼的；

    - 伪麻黄碱是让鼻子通气的。


    但是我们没必要针对每一个功能换成成分地去买对应的药，因为这个市场上像白加黑、泰诺、康泰克、芬必得，这些药大都同时含有这些成分，他们早已经帮咱们混合好了。他们的配方其实也都是大同小异的，买什么都差差不多，所以买这些药就足够了。


    # ——良药苦口利于病？——


    有人说这老话叫“良药苦口利于病”，这药就得是苦的才能治病呢。'
  - '[PAGE 111]


    这句话是古人对古代药物的描述，它离科学理智客观都比较远，除了没有科学依据之外，它还包含了一些隐含的逻辑，就是说病让你受苦，但是治愈你必须得付出点什么，而药材的苦到极致就是治愈过程中你的付出，所以越苦就相当于在吃的时候付出的越多，那付出的越多，这病不就越容易好嘛。


    但是这些顶多只能当作一个地理观点去对待，在“良药苦口利于病”这句话流传的年代里，人们不知道病因跟治疗的过程。


    现在有了现代医学，虽然我们始终不能对某个病的发病原因说彻底地了解了，但是我们已经有了务实的理念跟证实的手段，治疗的目标就是尽量追求好的药效，让那些咀嚼片更好看，吃起来更美味，就会导致小孩服药的效果提升。


    既然提高药效是目标，就不要用什么“良药苦口利于病”这样模糊的文化观点削弱本该不错的药效了。


    # —— 吃药能用茶水吗？ ——


    影响药效的还有饭前吃或者饭后吃，但是我查了一下，感冒药大都没有标注这一项，也就是说饭前吃、饭后吃影响不大，只要按量吃就行。


    吃药能不能用茶水呢？


    其实，最好是用白开水，茶水中成分太多太复杂，不能一概而论，但是理论上说，这些复杂的物质就有可能跟药物分子发生作用，影响药效。


    但这个只是理论上的，实际况因为浓度很低，反应物之间的混合度很难说有多充分，所以实际的影响也几乎没有。


    # —— 哪些药不要吃？ ——


    以上是针对已经经过严格的安全认证跟药效验证的感冒药而言的。


    而这个市场上还有一些感冒药，我们是应该拒绝吃的，它们的特征就是这个药名里已经包含了暗示的药效。


    举例来说：


    比如像感冒什么什么颗粒，或者感什么什么康，或者感冒什么什么胶囊，或者感冒什么什么冲剂，这些药首先是不便宜；


    其次，它之所以能够起效是因为它加入了本身就有效的，像扑尔敏、右美沙芬、对乙酰氨基酚、伪麻黄碱等等这些已经证明有效的西药成分。但问题是它加了这些有效成分，很多并不标注出来，你不知道它加了什么。就算有少部分标注出来了，也是只标注名称，没有含量，容易出现服用过量的情况。


    这些药除了刚才说的这些标注不清，还加了很多古代人认为有效的成分，这些成分安全性不明，没有做过严格的科学实验。


    本来感冒就是一种不用药都能好利索的病，所以吃这种药的风险就太高了，所以这些药都不要吃。


    # —— 今日内容小结 ——


    有人问我在这次流感爆发之前打没打疫苗，我其实没打，原因是根据自己的情况。


    因为我每天写稿查资料，不用去其他地方，我在公共场合待的时间，我估计是普通人群平均值的1/50，甚至1/100。而去医院接种疫苗也是有一定百分比交叉感染的，我觉得就这个交叉感染的风险值已经高于我接种疫苗获得的收益了，所以我没有接种。


    但我这么选择是依据我自身的情况。


    如果我是一个银行柜台的工作人员，或者我家里有老人，有孕妇，有儿童，那我一定会接种的。在接种的同时，我也清楚地知道，我最多只是把风险值降低了50%，我接种了疫苗我还感冒，我也不会抱怨。你别看我不接种流感的疫苗，但是我根据自己情况也会特地地补充一下维生素D。


    你看，科学地根据自身情况设计一套健康的生活方式，不但有必要，而且有成就感。我在咱俩专栏的评论里已经看到很多同学都体验过这一点了，他们的一致感觉就是对生活更有把控感了。


    好了，最后祝大家身体健康。


    # 划重点


    +   1. 流感一共有170多种，而每年的疫苗只能针对其中的4到5种做预防，平均来说，每年的命中率是在30%到50%之间浮动。\n2. 感冒药不能杀灭病毒，它只是让免疫系统在战斗中尽量温和一些、克制一些，让人体不太难受。\n3.
    家长把胶囊拆开、把药片磨碎喂给孩子，这些手法或多或少地削弱了药效。\n4. 虽然茶水可能对药物几乎没影响，但吃药最好用白开水。


    卓克

    我是卓克，咱们明天再见。'
