    # 120 | 问答：反季节蔬菜水果有害吗？


    有同学问了，冬天了，能不能吃反季节蔬菜水果呢？


    我的回答是：


    听了这么多科学思考的课，我们应该怎么面对这样的问题呢？


    那就是什么是反季节蔬菜跟水果，先要把这个问题弄清楚。比如说北京的冬天，室外温度那么低，大部分的蔬菜、水果都没法生长，那我把福建、浙江这些温暖的地方种的蔬菜、水果都运到北京来，这算反季节蔬菜、水果吗？大多数人觉得这都不算。因为它是在它可以自然生长的环境中长大的。


    那么还有另一种情况就是，在室外条件不能满足生长的情况下，利用农业技术长出来的蔬菜、水果，这个就是大家通常以为的反季节蔬菜水果的概念了。


    人们对它们的恐惧有两个级别的认识。


    ## —— 过于保守的错误认知 ——


    比较浅的认识，就是一种过古典的、古代思辨的哲学，就是这个东西从前长不出来，现在不管你用什么方式让它长出来了，那它就是不自然的，不正常的，不健康的。


    像南橘北枳，这个成语就是对这种想法的精炼跟总结。实际上，南橘北枳是一个常识性错误，它们本来就是两种不同的植物，只是古代人植物学知识实在不足，观察工具又不行，以为北方那个小的是南方橘子的干瘪版，北环境不合适，所以就不行了。


    其实，它们一个是芸香科柑橘属的，一个是芸香科枳属的，同科不同属，橘子在北方种，结出的果子也是大橘子，枳子树在南方，结出的果子也是小枳。


    这就有点像南豹北猫一样，人们认知水平不行的时候，就发现这两长得挺像的，那猫是这豹的低配版，所以就认为这南方环境不好，把豹子活生生做成了猫。


    持这种观点的人占比较多的，这种观点属于特别保守的，对一切新的事物都恐惧。


    尽管像蔬菜大棚早就广泛应用了几十年了，但是在他们的概念里，这东西还是陌生的、令人恐惧的存在，过分保守就会让自己越来越封闭，容易被淘汰，更容易上当。


    对他们来说怎么办呢？


    就是可以去参考国家有关部门，或者你信不过咱们国家，你觉得哪个国家可信，你就参考那个国家对同类食物采取的措施。如果它们都在广泛地接纳，就说明在这些专业部门的担保下，这些反季节的东西是没有问题的。


    具体是怎么没有问题的，这些更深入的技术细节也不用关心了，法律监管下允许卖，也允许吃，很多人也吃，那咱们跟着吃就没问题。


    ## —— 关于植物激素 ——


    另一个级别的认识就有一些技术含量了，因为他们听说反季节的蔬菜、水果都是催熟的，而催熟用的是生长激素。而激素这个词在中国跟辐射这个词一起，可以算是最顶级的老冤家了，好像它们天生就是有危险有毒的。


    其实它们都是各自指代一大类的事物，这一大类里只有比例极少的是有毒的。比如像激素的激素字，它是引起兴奋的意思，那素就是物质的意思，合起来激素是引起兴奋的一种物质。


    那你这么理解的话，好多东西都是激素，比如像你暗恋的女生，给你一个吻，这也是激素，因为你就兴奋起来了嘛，但是这个可不危险呀。而且既然引起兴奋了，那它就是一个约束很强的条件，必须是你暗恋的那个女生吻到你，才能让你兴奋。停车管理员吻你就不起作用，虽然都是吻，也都对健康无害。


    所以那些让西红柿长得更快的兴奋的物质，很难让人也长得更快，因为生物种类划分中，从上到下分别是界、门、纲、目、科、属、种，西红柿从界开始就跟人不一样了，我们跟西红柿、跟扁豆、跟西瓜的差异实在太大了，比我们跟犀牛的差异大得多得多。那你想，不论谁亲吻犀牛，犀牛也不会激动的，就更别提一个吻能让扁豆激动起来。所以同样的道理，让扁豆快速生长的激素，对人是没有用的。


    比如说，催熟的水果用的是乙烯，但乙烯并不是我们实验室里研发的一种让植物快速生长的药物，它是植物果实成熟过程中自己本身就分泌的。


    但是因为现在在冬天温度不够，或者说没有昆虫在冰天雪地里来下来去给它们授粉，那既然我们掌握了这个知识，我们就人工地按照植物的生长规律喷洒定量的乙烯，就当是弥补它的缺憾了。


    如果有人担心，这个量的乙烯对你，或者是对你的孩子有害，那么到了夏天，到了秋天，果实收获的时候，你也别买水果，因为那里头也有乙烯，说不定买回家放了几天，浓度还更高呢。


    其它的所谓植物激素，也都是各种植物在各项条件满足的时候自身分泌的物质，现在通过人工给予了，它们在正季节的时候，果实里也包含这些激素的。


    ## —— 对反季节的误解 ——


    但有人说呀，反季节的蔬菜味道淡了，反季节的水果不甜，缺乏营养。


    这是因为它们确实生长期短，光照的时间短，自然积累在植物体内的养分就少，吃起来就是淡淡无味的，就是比正季节的食物缺少10%的养分。


    好，那我就因为这个原因坚决不吃反季节蔬菜了，那结果是什么呢？


    那就是连另外90%的营养物质也都一起不吃了。这就有点像为了不错癌症，40多岁就自杀了一样，这么做确实是可以彻底杜绝营养物质很低的食物，当然，这是玩笑，没人会这么做。


    实际上，一个粗壮的反季节西红柿包含的营养物质远比一个玲珑剔透的小的正季节的西红柿里包含的营养物质要多得多多，你要是真觉得营养不够的话，那你吃两个西红柿就行了。况且现在关心反季节蔬菜水果该不该吃的人里，有几个是不想减肥的呢？那现在就属于每辆卡车都超载了，司机们还担心没装满呢。


    刚刚我们说的只是一些知性跟规律性的内容。那下面我说明几种常见的东西，蔬菜有胡萝卜、菠菜、苋菜、洋葱、青椒、卷心菜、芹菜，水果像草莓、猕猴桃、西瓜、芒果、菠萝。这些蔬菜水果的老祖宗都不是中国，有些是1493年哥伦布大交换里从南美先带到欧洲，然后再传到中国的，有些源自于中亚、北非，有些甚至在几十年前都还没有出现在中国的种植品种中，它们当年在原产地的条件跟现在在中国生长的环境是截然不同的，所以严格说，它们何止是反季节，简直都是反环境，反时差，反土壤。如果你发现身边真有人担心反季节蔬菜水果的话，那你就可以把我刚才说的那些名单给它列出来，告诉他们，这些比反季节还严重，那这些吃不吃呢？


    而真正声嘶力竭抵制反季节蔬菜水果的人，要不就是想借此赚流量，就是微哏发一篇10万+，要不就是想借此卖他的养生保健产品。生活在现代社会的我们，咱们不应该让这些人蒙蔽到了。


    ## 划重点


    - 1. 催熟水果用的是乙烯，它是植物在成熟过程中自身会分泌的一种激素，因此正季节的蔬果都有，现在人工地按照植物的生长规律喷洒定量的乙烯，相当于在冬季弥补了它的分泌不足。

    - 2. 人类与植物之间存在着巨大的物种隔离，植物激素很难对人体起到同样效果。

    - 3. 反季节蔬果在营养上比正季节蔬果低约10%，原因是生长周期短，因此积累的养分少。真觉得营养不够，多吃一些就可以了。


