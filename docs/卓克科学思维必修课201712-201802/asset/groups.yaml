    \ 本周课程复习 ——\n\n# 概念10: 起源\n\n一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。\n\
    \n097 | 起源：海洋越来越酸，生物越变越白（下）\n\n人类进入工业文明后，排放了大量温室气体，大量的二氧化碳融入海水，使海水迅速变酸，海洋生态走向崩溃，地球上85%的光合作用由海洋中的藻类承担，当它们走向绝灭，地球将失去绝大部分氧气，而人类的身体来不及适应这种变化。\n\
    \n098 | 起源：原始人现代人谁更聪明？\n\n把原始人定义成2万年前的人类,把聪明定义成对语言和抽象化的符号的应用的能力，原始人的聪明程度是远不如现代人的。讨论一个问题或一件事儿，首先要将问题定义清晰，因为即便是同样的文字和词语，在不同人的脑子里也存在认知差异。\n\
    \n099 | 起源：物种大灭绝中的科学思维\n\n提倡保护动物，将人文关怀用在动物身上，不仅无法让人们认识到保护动物的意义，还会造成资源的浪费。人类作为占据绝对优势的物种，也是自然的一部分，自然界曾经在多样性上出现的规律，一样也会发生在我们的身上。\n\
    \n100 | 起源：全球物种大灭绝为什么会发生？\n\n物种大灭绝，是地球上最显着的事件，6500万年前是陨石撞击，2亿年前是地壳运动火山喷发，但3.6亿年前没有发生任何大灾难，只是陆地和海洋都被几个少数\
    \ 的物种霸占，它们迁徙到哪，其它物种就慢慢灭绝，所以，我们也许正在走3.6亿年前的老路。\n\n# 答疑时间\n\n101 | 问答：基因检测值得做吗？\n\
    \n现阶段廉价的基因检测都是不靠谱的，几乎没有参考价值，而数万元的全基因组序列的检测现在做还为时尚早，因为我们还没有有效解读的能力，而且随着技术发展，未来几年的检测费用会大幅下降。\n\
    \n102 | 问答：吃大蒜真的能杀菌吗？\n\n“什么食物可以治什么病”的说法是一种误导，不只是大蒜，其他任何食物都不可能对某种疾病有疗效，原因就是即便存在有效成分，在食物里的含量也必定是极低\
    \ 的，只有提取之后才有机会发挥药效。\n\n# —— 下周课程预告 ——\n\n103 | 起源：保护动物的意义是什么？\n\n104 | 发展：人人天生都是远视眼\n\
    \n105 | 发展：近视眼的危害只有看不清吗？\n\n106 | 发展：统计观点下什么是最危险的癌症\n\n卓克\n\n我是卓克，明天我们开始进入第十八周的课程，明天见。\n\
    \n用户留言\n\n# 103 | 起源：保护动物的意义是什么？\n\n# —— 概念10：起源 ——\n\n一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。\n\
    \n# —— 上节思考题解答 ——\n\n上一节课最后，我给大家留了一个思考题，那就是我们一直说的物种大灭绝，它的特征表现是物种数量的急剧减少，但如果从反方面容许，也可以说成是某个物种形成了绝对的生存优势，所以物种大灭绝可不等与那个优势物种灭绝。\n\
    \n那么问题就是，失去了物种的多样性，对那个优势物种来说，是增加了它的生存可能性呢，还是减少了呢？\n\n我的答案是，减少了它的生存可能性。\n\n可能很多人都觉得，没有大熊猫、扬子鳄、白鼬羚，我们生活不是也没受影响吗？如果要是再没有蚊子、苍蝇，那人类的身体可能就更健康了。\n\
    \n没错，也许减少一两个物种，咱们不会察觉出有什么的，但是如果物种是全景式的灭绝，这影响就像链式反应一下进行下去了。\n\n# —— 应该抛弃世俗的价值 ——\n\
    \n有些媒体为了宣传保护生物多样性，就从价值的角度去考量。\n\n我估计你也见过这样的说法，比如说药物有很多原材料就是取自于植物，物种丰富的热带雨林就有着更多的机会从中找到有效的药物，而且还有科学家对现有的药物作了统计，大约有一半最初就是从动物和植物体内提取的，这里就包括最著名的阿司匹林，这个是从柳树皮里得到的，还有治疗疟疾的奎宁，除此之外，镇静剂、利尿剂、止痢药、抗生素、避孕药，很多很多都是从植物中提取出来的，甚至抗癌的明星紫杉醇也是从紫杉的树皮里提取出来的。\n\
    \n# —— 无法承受的代价 ——\n\n那不是世俗价值的观点是怎么看待这个问题呢？\n\n要说明这种价值观，我得先介绍一种对热带雨林树蛙的研究：这个研究发表在2011年5月份的《生态学通讯》上，作者约翰·恩斯就回答了一个看上去不太跟眼的问题，那就是为什么亚马逊的热带雨林里树蛙的种类那么丰富，可是对照东南亚跟美洲的其它热带雨林里，树蛙的种类就那么少呢？\n\
    \n现的。\n\n这个世界上没有任何牛人、神人，也没有任何神奇的技术可以缩短这个时间。那么这个多样性的图景一旦被毁掉了，也就彻底被毁掉了。哪怕再过6000万年的时间，能不能恢复成这样都难说。\n\
    \n所以最终，我们要说的，重视物种的多样性，它的价值何在呢？\n\n因为要形成多样性的时间代价是我们没法承受的，一批新物种的形成需要的时间远比人类整个历史加起来还要长，所以一个物种灭绝的损失也根本不是几亿美元能衡量的。一个物种存在的价值不是因为它的皮毛有多贵，或者某个器官提取出来的药能治病，那是它们死后尸体的价值。而物种的价值指的是，它们几百或者几千万年以来，依然存活在地球上，是这种可能性延续下来的价值。所以任何一个物种因为人类活动灭绝了，这个损失大了去了。可是很少有人从这个角度考量物种的多样性，所以这也是为什么到现在很多人的态度还是：反正也不剩多少了，救不救都得灭亡。\n\
    \n这节课我们提到的新的视角，其实也是用一种演化的视角看事物，而这次我们看的是它的价值，演化的视角看问题也有其它方面，比如说看原因。之前举的例子，大熊猫为什么没有灭绝，不是因为四川卧龙繁育基地的功劳，当然也不是化肥和农药节省出来的土地的功劳，那是什么原因呢？其实它还尚存的原因是它全部历史的加和，它不好用一句话概括。\n\
    \n# —— 今日思考题 ——\n\n比如现在我们已经确认了蚊子一共18个属，其中有3个属，伊蚊、库蚊、按蚊，这是和人类传染病关系最密切的，我们被叮咬，99%都是这3个属的蚊子下的嘴。那如果现在我们把它们全部消灭了，像疟疾、丝虫病、乙型脑炎、登革热、黄热病等等，这些疾病全都能消失，那我们要不要把这些蚊子全消灭干净呢？\n\
    \n如果你心里有了答案，就留在评论里。\n\n# 划重点\n\n> 生命的演化史非常漫长，一个物种的出现，有些长达数千万年，没有技术能缩短这个过程，多样性一旦被毁，就是彻底被毁掉，新物种形成的时间远比人类的整个历史还要长，每一个物种就代表着一种可能性。\n\
    \n卓克\n\n我是卓克，咱们明天再见！\n\n# 用户留言\n\n# 104 | 发展：人人天生都是远视眼？\n\n104 | 发展：人人天生都是...\n\
    \n# ——► 概念11：发展 ◄——\n\n科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。\n\
    \n从今天起，我们进入医学类的话题。凡是跟医学相关的内容，大都是跟每个人的生活密切相关的细碎的知识，想从中找出科学思维并不容易。但仍然有两个方面明 显地体现出科学思维对平日思考方式带来的影响：\n\
    \n一个就是通过比较古代医生跟现代医生是怎么描述、研究同一种疾病的。通过这种对比，就能发现assion科学方法出现之后，思想的哪个方面进化了。\n\n# ——►\
    \ 人类天生是远视眼 ◄——\n\n我们先从眼睛说起。\n\n就像标题里说的那样，每个人出生之后都是远视眼，而且远视的情况会维持10几年，具体\"的统计数据是这样。比如4岁的时候，平均值是远视300度，6岁是远视200度，8岁远视150度，12岁远视100度。所以一般情况下，家长带着孩子去眼科，孩子假设是在13岁以下，他的远视在均值附近，医生是不会给什么治疗方案的，因为也不用治，长大了自然会好。\n\
    \n![](img/8bedc5a33d556c033f724cd3fbb47d99_33_0.png)\n\n为什么会出现远视，后来又变成近视呢？\n\n\
    看上面这张示意图，你一看就能明白，问题就出在眼球的形状上。\n\n# ——► 眼睛的焦距调节 ◄——\n\n视力问题对医生来说，他们是这样看的。医生最关注的不是裸眼的视力，而是戴上眼镜之后的视力。因为这个代表着一个人的眼睛性能的上限。\n\
    \n![](img/8bedc5a33d556c033f724cd3fbb47d99_33_1.png)\n\n这个调节功能可以依赖两个部件：\n\n第一个叫做晶状体。\n\
    \n样，但是基本成年以后就不会再变了，可以把它当做是一种固定的东西。\n\n固定就谈不上自动调节了，但是自从近视眼手术出现之后，我们可以通过手术调整这里的厚度。关于激光手术的部分，我在去年的《卓老板聊科技》中详细说过，简单来说这是一个已经经过了长期验证、比较可靠的手术，手术的分类比较多，但是原理大致类似，主要的区别就是价格和操作的细节，价格越高，手术效果越好，并发症也越少，但它们都是合格的手术。手术之前医生也会作详细的测试，如果眼睛条件不合适，就算你想做，医生也不会同意给你做的。在《科学思维课》的答疑中，我也仔细说过另外一种叫做佩戴\
    \ OK 镜的方法，它也是通过临时调整角膜的形状来减缓近视的发病。当然，还有一些其他可靠的方法，我会放在下一节课里细说。\n\n# —— 富贵病：近视眼 ——\n\
    \n如果要问为什么现在这么多近视，这个答案非常令人失望，因为科学界虽然已经做了大量的研究，但是还没有什么决定性的发现，在基因方面也找到了一些有共性的近视眼易感基因。\n\
    \n| 基因名称 | 位置 | 发表者 | 近视眼种类 | 遗传方式 | PMID编号 |\n|---|---|---|---|---|---|\n| MYP1\
