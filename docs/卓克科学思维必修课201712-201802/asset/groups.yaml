    ## 160 | 泡沫：怎么识别伪科学？


    ## —— 概论15：泡沫 ——


    一项新的科研成果出现，总是会引发很多人的热情，识别泡沫，不但有助于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    伪科学是什么？


    这个问题如果细究起来，是很容易陷入到严肃的分析当中，可是我们不这么做，我们用最通俗的话说，就是：


    自己不是科学，却硬要标榜自己是科学，这个就叫做伪科学。


    ## —— 科学理论与伪科学 ——


    怎么辨识伪科学？


