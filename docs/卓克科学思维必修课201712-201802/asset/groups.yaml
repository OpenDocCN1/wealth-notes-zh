    ## 164 | 泡沫：放血疗法也不是全都不靠谱


    ### 概念15：泡沫


    一项新的科研成果出现，总会引发很多人的热情，有些人是为了科学欢呼，有些人则希望从中渔利，于是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    今天我们说的是“放血疗法”，它曾经是人类医学史上使用时间最久的治疗方案，后来在现代医学逐渐成熟之后，在新的评价体系里被发现，几乎对任何的症状都没有任何的疗效。


    到如今，除了一些医疗监管有问题的地 方，已经没有医生使用放血疗法了。


    但放血疗法真的到了“过街老鼠人人喊打”的地步吗？


    也不是，其实还是存在几种病症需要用到它。


    这节课，我们通过放血疗法的兴衰，来看看同一款药物的有效性是怎么被否定，又是怎么被承认的。承认与否定的标准其实就体现着科学的思考方式。


    ### 放血疗法的理论基础


    放血疗法可不是我们中国独有的，它从2500年前就是古希腊治病的常用方法，希波克拉底的四体液学说里，血液就是其中一 种，另外三种是粘液、黄胆汁、黑胆汁。


    这四种液体分别对应着气、水、土、火，这四种是古希腊认为最重要的组成世界的元素，一切疾病都是这四种体液失衡造成的，哪个体液过多，那就把它放出来一些，放出来的方法就有几种：


    +   小便能排出黄胆汁、呕吐可以排出粘液、大便可以排出黑胆汁、放血就可以放出血液，只要想法让多余的部分排出体外，就能重新恢复四体液的平衡，恢复健康。


    所以当年除了放血以外，怎么让人拉肚子，怎么给他催吐，怎么找到最有效的利尿剂，这些方法就是当时医学治疗中的核心方法。


    站在当今，我们可以说这样的逻辑太荒谬了，但是2500年前，希波克拉底的先进之处还是有的，那就是，终于是有一个人承认疾病是由人体自身导致的问题，比如说多吃了什么，少喝了什么，这个体液才失衡的，而不是由厄运、诅咒、天谴导致的疾病。


    希波克拉底这套理论在500年后发扬光大，盖伦着重发展了血液部分的说辞，认为血液是提供“活力”的一种物质，它会被创造，然后在人体活动中被消耗，重点是它并不是循环的，所以如果耗散不完，就会在“瘀滞”在身体各处，产生血液过多的问
    题，血液过多，发烧、头疼、中风就会相继出现。


    具体什么病该怎么放血，那也是一套非常烦琐复杂的理论，要根据星象的位置，根据病人体现，根据患病地点，来决定在身体哪个部位放血，比如说：


    +   金星出现的时候，要放右手动脉的血来治疗肝脏的问题；

    火星出现的时候，放左手静脉的血可以治疗脾的问题。


    疾病越严重，放血量就应该越多，当年欧洲的医书拿来一看，一两百种疾病的治疗方法，全都是放血。


    可现在说起这些理论，我们很多人听着不觉得很远古，那是因为直到现在，咱们国家还有一些悬味的东西没有从医疗体系中清扫出去，他们的理论一样是复杂琐碎的，但是水平跟2000年前对医学几乎一无所知的古人是一样高的。


    文明的程度并不是一直增长的，古希腊之后达到过一次巅峰，之后在古罗马就慢慢地衰退，直到公元4世纪，东西罗马帝国分裂了，文明开始断崖式地下跌。这次跌落总共经历了1700年，才又重新涨回了古希腊巅峰时期的高度。在这种大的文化背景下，医学也不例外，盖伦的那一套关于血液的理论，在之后1000多年的时间里，一直大行其道。


    ### 放血疗法的残留


    那些年放血用的不是针管，针管这种东西是在1853年之后才开始使用的，那个时候放血用的是带弹簧的小刀片儿。放血的手法就是顺着血管的走向划一道，这个方向是不能错的，因为如果要是垂直地割血管，把血管割断了，那就会出现生命危险。


    这个小刀片的形状像柳叶，后来改名，就管这种刀叫柳叶刀，千年来一直用的这个名字，以至于柳叶刀就像征着放血，放血就像征着医学，所以柳叶刀自然而然也就象征着医学。


    长久以来的关联后来延续到了1823年，医学期刊《柳叶刀》创刊发行了。这本刊物在医学界的影响力那可是要超过《Nature》跟《Science》在科学界的影响力的。但谁能想到，当初它是用來给病人施行放血疗法出名的呢？


    身体上有某些地方用柳叶刀割起来方便，有些地方不那么方便，但是也要放血，怎么办呢？


    就用吸血的水蛭，《柳叶刀》创刊那年，仅仅法国的医生用掉的水蛭就有几千万只，以至于水蛭也很出名，它的英文 leech 和古英语中的“医生”是一个词。所以假如当年还有一本著名的医学期刊能够活到现在的话，那大概率说，这份期刊的名字叫《水蛭》的可能性就非常高。


    放血疗法广为流传到现在，还有一个痕迹残留着，那就是在理发馆的门口都竖着一个红白条旋轉的圆筒，这其实就是中世纪的时候给人们提供放血服务的地方，当年那里主营的业务是两个，一个是理发，另外一个是放血。理发师的刮刀正好可以给病人放血用，理发师对刀的运角也比较到位，所以自然而然放血也就理发馆里。红色的代表着绷带上的血迹，白色的代表还没染上血迹的绷带。


    ### 放血疗法失去市场


    历史上当然有相当多的案例记载着，某个病人得了什么怪病，疑难杂症，然后经过放血痊愈了。这样的例子可以说要多少有多少，但从现在的眼光来看，它们只是前后发生的事情。


    先得了病，后放了血，然后恢复了，这个病症痊愈跟放血是不是因果关系呢？


    没有机会证明了，因为没有人愿意再得一次病。所以如果愿意，我们可以找出无数这样的貌似治愈的例子出来。


    但同样，也有因放血疗法死掉的，但是死掉的那些人也一样没法确认是放血放死的，还是病入膏肓，无药可医死的。


    最著名的要属美国第一任总统华盛顿，他当年就是死在放血疗法上的。1799年12月14号，华盛顿生病了，发烧之外还有呼吸困难，他的管家跟医生在一日之内先后4次给他放血，总共放掉了3.5升血，这大约就是华盛顿体内血液总量的60%，当天晚上华盛顿就死于失血性休克了。后来的人研究华盛顿当时候的病，大概是普通的咽喉部分的感染，要不是放血过多，肯定是不会送命的。


    放血疗法到底疗效怎么样，想确切地知道这一点，是需要迈过一个认知门槛的，这个门槛的核心就是有“量化的对比实验”。


    我们可不是因为一个东西使用的时间久，就会对它有深刻的认识，相当多的东西都是我们跟它认识很久了，但仍然停留在浅薄的认识层面上，像跳大神、赌博、巫术，这些都是我们认识了几千年的活动，但真正认识它们本质，也才是最近100年才发生的。


    其实在一六几几年，就已经有医学界的人质疑放血疗法了，那算是最早的试图通过迈过认知门槛的尝试。最早质疑放血疗法的数字对比中，接受放血疗法后死亡的人数是不采用放血疗法的10倍到20倍之多，这在当时属于非常反常识的结论。


    “最聪明的医生都用的方法难道错了吗？怎么可能？”或者“已经使用了上千年的治疗方法，怎么可能是错的？”


    这些质疑在当年都是经常听到的。

