    艾滋病难以治疗，是因为 HIV 病毒的外壳蛋白容易变异，免疫系统难以识别。\n3. 感染了 HIV 的全部患者中有1/300不进行任何治疗也不会发病，他们被称为“非凡控制者”，HIV
    病毒会在他们的细胞膜上留下 一滩标记物，免疫系统可以识别。


