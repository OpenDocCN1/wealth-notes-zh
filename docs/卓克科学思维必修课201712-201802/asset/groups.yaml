    # 096 | 问答：冬季皮肤瘙痒怎么办？要不要坐月子？


    冬季皮肤干燥瘙痒怎么办？


    我的回答是：


    入冬之后有不少人都问我怎么止痒，就是浑身瘙痒，这其实是一个很普遍的问题，尤其...只有到了冬天才明显。


    这个原因直接回答就是因为皮肤干燥，解决办法就是让皮肤多一层保护。不论你是用自己皮肤产生的油，还是用护肤品里的油，涂上一层就好了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_16_0.png)


    上面这一张图就是正常的皮肤与过于干燥皮肤的对比。


    这图中最上一层是角质层，右边干燥的皮肤已经翘起来了，这种状态的皮肤就容易刺激下面的神经末梢。因为这种刺激也不太剧烈，身体感受到的也就是痒痒了。


    角质层为什么翘起来了呢？


    因为在角质层上面还有一层叫皮脂膜，这个皮脂膜是由汗腺分泌的汗水，还有皮脂腺分泌的油脂混合组成的一层油膜，...这样角质层就不会翘起来了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_16_1.png)


    冬天空气干冷，所以我们出汗少，皮脂膜就不容易积累足够的厚度，所以更容易干燥，但这个只是其中一个原因。另一个原因就是洗澡太勤了...


    皮脂膜是皮肤的一层保护，我看过一些流浪汉，或者是专门吉他的 人，他们徒步去西藏的路上，没有洗澡的条件，他们原本又都是城市的白领，每天都习惯洗澡，所以刚开始是很不适应的。但是这种不洗澡的情况只要持续10天以后就不会有什么感觉了，也不会觉得难受，这个时候皮脂膜已经积累得很厚了，反而是一种很好的保护。


    所以每天都要彻底地浑身涂一遍去油的肥皂，这个对皮肤其实是掠杀恐的。另外还有一些家长，他可能是给孩子洗澡的时候搓得特别狠...


    那怎么办呢？


    程度最轻的就是在洗澡的时候用一下乳液，这个乳液用水冲掉之后，它总是有一层油膜留在皮肤上，起到保护作用。洗澡的时候别只用那种去油的肥皂或者香皂，如果你觉得用乳液太麻烦了，你也可以只用清水冲一冲，这就算洗澡了，不要涂任何的香皂和肥皂。如果还是不能解决问题，那你就每两天洗一次澡，每次洗的时候什么都不涂，或者是洗完了之后专门在身上涂一些油。


    这些小问题都可以通过科学客观的方法得到大幅的改善，不要听信什么血热、血虚，或者滋阴润肺之类的说法，然后吃一大堆补药，或者去风的药，那些都是完全没有根据的。


    # 生完孩子，到底要不要坐月子？坐月子的各种禁忌对不对？


    我的回答是：


    坐月子的禁忌各地都不同，细节划分还特别多。有规定不能见风的，就是家里窗户一直都不开，还有规定不能刷牙的，不能洗头洗澡的，不能吃寒性食物的，不能喝凉水的，不能下地运动的，还有专门喝鲫鱼汤，吃老母鸡之类的。


    实际上，中国在最近10年，真的按照刚才说的那种坐月子的方法坐月子的人太少了，真的做的也都是那些老少边穷地区的产妇，这说明人们还是进步了。从前那种禁忌也不是完全无脑糙的规定，也都是在100多年前有根据地结合当时的环境想出来的。


    不能喝凉水和吃所谓寒性食物，主要就是因为古代农村没有干净的饮用水，直接喝生水容易被微生物感染，这对正在伤口恢复的孕妇就很不好了。


    不能洗澡，它也是出于预防感染，因为我们现在洗澡都用花洒的喷头，从前不是这样，大都是坐在盆里洗，下水泡在水里就增加了感染的机会，所以不能洗澡。


    不能见风，可能就是因为从前冬季取暖本身就挺困难的，房屋的密封性也差，平时正常人都觉得这房子四里漏风，冷得不得了，那更何况身体虚弱的产妇了。


    不能下地活动，就是因为从前都是农民，下地活动都是农业重体力劳动，干这些就不利于腹腔附近的肌肉恢复。


    但这些都是适合100年前生活条件下的做法，现在这些风险都不存在了，就不用再遵守这些繁文缛节了。冬天生的孩子还好，每年夏天6、7月份，还是有不少报道可以看到，就是说产妇中暑了，甚至都有热死的消息。


    现代生活中，产妇真正要注意的只有6周之内不要行房，和不要完全躺在床上不下来。不行房这个大家都可以理解，伤口都还没长好。


    不能长期卧床主要是防止血栓的形成，因为在生产的过程中会有出血，无论是顺产还是剖腹产都有不小的伤口，愈合的时候凝血的成分就比较多，如果长时间不动，血液流动得比较慢，就会在血管里出现很多血凝块，这些结痂要是顺着血管流到了心肺，或者是肺的主动脉上，一旦堵住了，那就有可能动脉栓塞出现生命危险。所以，产科大夫也会专门叮嘱产妇，生产后一天之内一定要下床活动，不能躺在床上。


    虽然产妇生产之后消耗很大，身体很虚弱，但是也不能乱吃补品，或者吃很多特别油腻的，打乱平时的习惯。现代这个年代，几乎没有人营养缺乏，所以根本用不着特别补充很多肉，很多糖，只要保证饮食均衡，饿了就吃就好了。


    有人说，国外的女人就不坐月子，这个也得看哪些国家，比如说受中国文化影响大的日韩，也有坐月子的说法，欧美的产妇虽然不说坐月子，但是身体毕竟都是人类的身体，他们管生产后的6周时间叫做产后恢复期。


    这42天并不是只是找一个休息的借口，而是身体器官的恢复期。比如下怀孕期，身体的总血流量是普通时候的1.4倍到1.5倍，还有很多激素水平也和平时不一样，对糖的代谢也是孕妇状态，产后凝血的程度也比普通的时候更高。这些指标都是为一个女人再加一个婴儿的模式设定的，孩子出生之后，这些指标要慢慢地调成一个正常女人的情况。


    产后恢复期，孕妇身体就是在自发地调整这些参数，所以它并不只是一个体力的调整期，也包括各项参数的正常化。所以网上有些论调说欧美女人产后多邋遢形变了一番，也是有点过了。人和人的个体差异就是很大，比如像有的人喝了一瓶白酒都没事，可有的人喝了半瓶啤酒就醉倒了，所以不能一概而论，要根据自己的身体安排活动。


    听上去这都不是什么复杂和难以理解的方法，但实际上却有很多做不到。'
