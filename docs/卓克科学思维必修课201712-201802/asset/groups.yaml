    ## 概念10：起源


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    103｜起源：保护动物的意义是什么？


    生命的演化史非常漫长，一个物种的出现，有些长达数千万年，没有技术能缩短这个过程，多样性一旦被毁，就是彻底被毁掉，新物种形成的时间远比人类的整个历史还要长，每一个物种就代表着一种可能性。


    ## 概念11：发展


