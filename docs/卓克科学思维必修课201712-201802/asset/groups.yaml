    # 117 | 发展：HIV和白血病都杀不死的人


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_62_0.png)


    117 | 发展：HIV和白血病...


    # —— ◇ 概念11：发展 ◇ ——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓宽了生命的范畴，缩小了死亡的边界。


    # —— ◇ 上节思考题解答 ◇ ——


    昨天的课最后我留了一个小问题，就是非凡控制者最初为什么非常难找呢？


    这个是需要设身处地考虑的，因为，你想本身感染 HIV 的人占的比例就不高，凡是感染之后能让医生接触到的，那几乎都是去参与治疗的。


    那非凡控制者是什么人呢？


    他是不做任何治疗，也不发病的人。既然不做治疗，医生跟研究者就很难接触到他们了，而且不治疗也不发病的人，他自己可能都意识不到自己是感染者。你想没事Από去找医生，去查自己是不是
    HIV 感染者呢？所以，虽然这类人一直以一个稳定的比例存在，但是研究艾滋病10几年来，人们才注意到了这类奇人的存在。说这个其实也在提示我们，选取科研对象的时候是存在选择偏差的。


    # —— ◇ 感染 HIV ◇ ——


    上节课我们说的是非凡控制者，他们即使感染了 HIV 病毒都不会发病，只不过比例很小，300个感染者里才有1个是这样的，但其实还有一个人比他们所有人都要幸运，因为这个人在治疗艾滋病的过程中还查出了白血病，但后来两种病全都治好了。


    我们今天就来谈谈这个人，叫提摩西·布朗。


    他是一个男同性恋，刚刚成年的时候，艾滋病也刚刚开始在美国爆发，也刚刚被国际医学界重视，年近30的时候，曾经同志圈里的人有不少都因为艾滋病去世了。1995年3月份，他的前男友也去世了，他怀着悲痛的心情参加葬礼，悲痛不只是因为失去了前男友，更因为他的前男友是因为艾滋病去世的，所以他自己也危险了。去医院一检查，真是
    HIV 阳性。之后，他的反应跟其他的患者很不一样，他把消息尽量广泛地公开了出去，包括他的家人、同事、朋友，全都知道了，甚至连他现任的男友也都知道了。


    提摩西感染确诊的时候是1995年，而人类对艾滋病开始有了比较有效的控制手段，最早出现在1996年，也就是说提摩西的运气还不错，那个时候采用的方法大家可能都听说过，叫做鸡尾酒疗法。NBA
    著名的aturi后卫“魔术师”约翰逊也是因为这种疗法的出现，所以到了今天还没有发病呢。


    这种疗法并不是喝鸡尾酒，而是因为鸡尾酒的那种方法，就是把几种混合物都放在一起的形式，跟治疗的方法很像，这种治疗用的是好几种抗逆转录病毒的药，有的是降低 DNA
    的复制，有的是降低 RNA 的转录，有的是降低对应蛋白酶的活性。


    如果简单地说，就是把 HIV 病毒复制的过程中的很多环节的蛋白质工人都给它们停工了，工人不干活，HIV 病毒复制就很慢。但这些药也并不只是针对 HIV 病毒，也多少作用在人体细胞上，所以人体细胞的更新换代、修复也会减缓，所以多少也会有些副作用。


    上节课我们说过，HIV 病毒经常变异，它的变异是在药物环境跟免疫环境的双重压力下呈现出来的选择性，这种环境压力的演化跟细菌产生抗药性是差不多的，比如说一次大规模的杀伤性攻击，总会有十亿分之一的病毒因为结构上的优势活下来了，那之后的一两个月里，这个新外壳的
    HIV 病毒就成了主力军，上一次使用的药跟免疫系统的记忆对它就都没用了。


    面对这种困难怎么办呢？


    就是同时使用3到4种抗病毒的药物，虽然病毒针对其中任何一种药物都有十亿分之一的存活率，但假如4种药一起上，那它几乎就逃不过去了。


    但病毒还是会有一些一直蛰伏在细胞内部，随时等待时机，所以即使使用了鸡尾酒疗法，病人也最终带着比较低量的病毒。提摩西就这样吃着药，定期去检查身体，以为就会这样此一生。


    # —— ◇ 患上白血病 ◇ ——


    没想到11年后的2006年，在他的又一次体检中，医生告诉他了一个更坏的消息，他患了白血病，而且还是生存率不太高的，骨髓移植效果不太好的那种分型。


    白血病分类

    急性白血病 | 分型 | 亚型 | 备注

    急性淋巴细胞白血病(ALL) | ...


    目前给白血病按照癌症细胞分类的方法，其中只有标注了红块的这部分白血病是有高治愈率的，一般是发生在几岁的儿童身上。发达国家针对红块类这种白血病是有90%以上的治愈率的，其他的白血病在去年出现CAR-T疗法之前，治愈率都是很低的。


    提摩西患的白血病就是这个表格里的第一行，也是成年人白血病最常见的类型，存活率非常低，叫急性髓细胞白血病，当时在美国即便做了骨髓移植，5年生存率也是25%。


    本来自己就是 HIV 的感染者，现在又得了白血病。


    # —— ◇ 骨髓移植 ◇ ——


    不过这个人独特的性格让他坚持下来了，比较乐观。11年前他感染了 HIV 的时候，他就跟其他的患者不一样，他到处公布自己的患病消息。这次他跟他的男朋友商量好之后，就决定按部就班地做治疗。


    治疗要冒很大的风险，首先就是得把鸡尾酒疗法停掉，然后再做几个月的化疗，结果白细胞的数量根本就没有控制住，后来又调整了治疗方案，就想尝试骨髓移植，即便移植，复发率也有50%，但是他还是做了。


    骨髓移植是什么呢？


    这个我要多说两句，骨髓就是骨头里中空的那部分，填充的那些东西。有地方还会把骨头专门敲碎了，吃里面的骨髓，像烤骨髓，这是世界各地都有的名菜。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_62_1.png)


    骨髓是一个重要的免疫器官，人体血液中的很多细胞，比如像红细胞、粒细胞、单核细胞、巨噬细胞、血小板、淋巴 T 细胞跟淋巴 B 细胞，它们的早期发育都是在骨髓里完成的，然后才进入了血液，骨髓移植就是要把这里的细胞全部换掉。


    既然说换掉，首先就得把从前的骨髓清理干净，一般是用大量毒素加上放射性的照射，让它们尽量彻底地死亡，这个时候病人的免疫力就相当于<|message|> 零了。这也等于把病人推上了死亡的边缘，然后再把配型合适的骨髓输进来，让新植入的骨髓产生病人血液里所需的各种细胞，等这些量再稳定了，这次骨髓移植就算大功告成。


    除了要迈过这个恢复的门槛，还有一个更关键的，就是能不能有合适的配型呢？有很多病人最终等了几年都没有合适的配型，就这么死了。


    但提摩西是很有幸的，德国当时有非常完善的骨髓信息库，对他来说配型合适的当时就找到了260多个人，那选谁呢？他的'
  - '[PAGE 63]


    时就找到了260多个人，那选谁呢？他的主治医生就突然灵机一动，他就想既然治疗白血病是骨髓的重建，那这样一来，免疫系统就相当于重建了，而提摩西从前身体里常的那些
    HIV 病毒，它们本质上就是免疫系统上的缺陷，就是辅助 T 细胞有毛病了。


    现在骨髓移植，辅助 T 细胞是不是也有机会重新换掉呢？


    而且，他在治疗艾滋病的这些年，还听说过几种类型的患者是不会发病的，他们是基因变异类型的病人，如果用这些人的骨髓给他移植，那说不定白血病跟艾滋病就一起治好了。


    # ——♦ 消灭 HIV ♦——


    我们上节课说的非凡控制者是其中一种，就是说接触了病毒，但不会感染。


    其实还有一种，叫做 632。


    这种变异者，他们携带了一种突变基因，就会导致辅助 T 细胞的细胞膜上供 HIV 病毒结合的那个位置总是结合不牢，总会是松动的，HIV 病毒的膜总是还没来得及跟细胞膜融合，这两者就脱离开了，所以
    HIV 病毒总是没法进到里面去感染它。


    而且很巧的是，产生这个突变的人虽然身体上缺少了一种蛋白质，但是并不会出现什么病症，所以是可以尝试的。


    # ——♦ 幸运的提摩西 ♦——


    但是，现在还不能高兴太早，因为还得担心他白血病的部分，因为这种骨髓移植5年的生存率只有25%。结果过了10个月，真的出状况了，提摩西的白血病复发了。从医学统计上看，这个类型的白血病如果再做第二次骨髓移植，那他之后的5年生存率就只有10%了。


    那他做不做呢？


    # ——♦ 今日内容小结 ♦——


    我们对比来看，在学校阶段，我们遇到的各种安排都是教学体系，按照学生认知发展的规律定制的，所以你只要是按部就班地进行，不特地跟学校对着干，大部分的体验是成功的、是顺利的，只要脱离了这个体系就会有短暂的不适应。


    # ——♦ 今日思考题 ♦——


    在你的生活中可有没有哪些事是这样的呢？就是有人一直依据科学精神、科学规律做事情，最后把一个不可能的事做成了呢？


    如果你想到了，就留在评论中。


    # 划重点


    +   1. 研究艾滋病10几年后科学家们才发现“非凡控制者”，这就提示我们，选取科研对象的时候，是存在选择偏差的，所以得出的结论也是相对准确的。因为，在科学研究中，水准最好的，也只是尚未被证明存在错误而已。
    2. 仅仅因为理论上的成功概率不为0，科学家们就会做出努力和尝试，而这其实就是科研的常态。


    卓克

