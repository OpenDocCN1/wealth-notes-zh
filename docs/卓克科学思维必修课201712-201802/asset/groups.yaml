    ## 124 | 发展：大脑的寿命和身体不一致？


    124 | 发展：大脑的寿和...


    ### ——► 概念11：发展 ◄——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光(min)观察曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    很多医学界的人展望行业未来都有几个共识：


    - 第一，今后四十五年里，人类的平均寿命还会继续提高；

    第二，可以被治愈的癌症会越来越多，癌症的死亡率也会持续下降，甚至有可能它变成一种慢性疾病来控制。


    但是也有不乐观的方面，就是大脑的使用寿命可能跟不上身体寿命的增长，在身体不行之前，大脑就会先挂掉。


    ### ——► 阿尔兹海默症 ◄——


    以阿尔兹海默症来说，表现出来的最初一两年是频繁地忘事儿，这会影响到的是短期记忆，比如说出了门就忘了自己要出去干什么，或者刚刚装好一个东西又想不起来放哪儿了，这是因为阿尔兹海默症起源于海马体，这里是负责记忆功能的。


    ### ——► 血脑屏障 ◄——


    但是为什么会发病？


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_82_0.png)


    ### ——► 踪入未知领域 ◄——


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_82_1.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_82_2.png)


    根，带电的特性就因为磷酸根一多，变了。这一变，神经纤维的微细结构也就散落一地，本来做加固用的τ蛋白相互手拉手自己拧成了一团。


    这个变化有一个专有名词叫做τ蛋白的过度磷酸化。这个是最早被当做阿尔兹海默症发病原因的一种解释。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_83_0.png)


    但对病人脑组织的切片仔细观察的时候，还有另外一种发现，就是神经元上会沉积着很多不该出现的东西，像淀粉糊一样的東西，这也是一种蛋白质，叫做β淀粉样蛋白。


    它有比较强的神经毒性，附着在神经细胞上就会干扰神经细胞正常的工作。最后这个神经元就会报废了，然后就会被胶质细胞清除掉。所以阿尔兹海默症的患者大脑后期都会萎缩很多。


    沉积τ蛋白是一个很微观的变化，我选了下面这张示意圖，大家可以看看，阿尔兹海默症患者的神经元很多都被这种蛋白质糊住了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_83_1.png)


    如果你仔细听过我去年的专栏《卓老极聊科技》的话，那里面用了一系列大概几个小时说过大脑，其中说到了睡眠的作用。β淀粉样蛋白其实在大脑中，它是时不时就会产生一些，大脑是需要及时把它们清理掉的。


    在新陈代谢的过程中产生的蛋白质废物，在身体的其他部分也是需要清除的，它们是靠淋巴系统负责运输的，那些废的蛋白从淋巴管汇入血管中，最终排出体外。


    可是很久以来，科学家们在大脑中一直没有找到淋巴系统，后来才发现，脑部清除废弃的蛋白质是由血脑屏障外层的星形胶质细胞完成的，而且它只在我们睡眠的时候工作，深度睡眠之后胶质细胞的间隙就会增加，脑脊液会以清醒的时候10倍、20倍的效率流速，把不该出现在大脑中的蛋白质清理出去，其中就包含β淀粉样蛋白。


    所以患神经性退行疾病的人，往往也是发病之前长年睡眠有问题的人。所以说睡好觉也是非常重要的，当然这些只是相关因素。


    那现在已经发现有2个发病嫌疑犯了，其实它们在病人脑中总是同时出现的，那到底是τ蛋白过度磷酸化导致 δημοσ 阿尔兹海默症，还是β淀粉样蛋白沉积导致的阿尔兹海默症呢？


    这两方最初谁也说服不了谁。


    但是到了二零零几年，更有力的证据出现了，它的大概意思是说：


    是因为先出现了β淀粉样蛋白的沉积，这个沉积的毒性后来才引发了τ蛋白成团纠结在一起。


    在研究跟论证的20年里，世界上知名的药企都尽了最大努力推出过阿尔兹海默症的药物，但非常可惜，从1998年到现在，一共有123款申请上市的药物，但到现在只有3种通过批准了，通过率只有2.4%，非常非常低。而且就算这是3种，治疗的效果也非常差。


    但是在2016年，阿尔兹海默症为什么会出现，理论上有了新的突破。


    哈佛大学的一个团队在科学子刊《科学-转化医学》上发表了对β淀粉样蛋白的研究，简单地说：


    这种蛋白质在脊椎动物体内早就有了，但它们一般都是以溶于水的形式存在，只有这个蛋白质异常折叠的时候才会凝结成淀粉样的斑块。


    你还记得我之前说的''occasion 脑颗粒''吧，它也是一种蛋白质异常折叠之后成团的情况。


    人们最初以为这些斑块就是致病原因，是不好的，其实并不是，因为哈佛这个团队发现，异常折叠之后，它表现出了很强的抗菌性，这种杀菌效果甚至比青霉素还要好。于是怀疑点这次就到了血脑屏障上了。


    所以这节课开始，我才要详细地介绍一下血脑屏障是什么。


    理论上它是不应该有漏洞的，但实际生活里，就算是ApoE基因表现正常的人，上了岁数之后，都难保这一辈子屏障都能固若金汤，说不定就会有微生物冲破封闭进入大脑。


    而β淀粉样蛋白就是在应对大脑的细菌或者病毒感染的时候才出现了所谓的错误折叠，其实人家根本就没有错误折叠，人家是自动生成的抗菌结构。


    之后这组科学家拿小鼠做了实验，他们用的是沙门氏菌感染的小鼠大脑，凡是在48小时里大脑出现了β淀粉样斑块的小鼠，它们最终的寿命比那些始终在大脑都没有出现斑块的小鼠寿命长得多得多。然后他再把斑块拿出来，显微镜下一看，每一个斑块的中心都是一个微生物。


    这一下就解释了很多问题，一个就是我们很可能错怪了β淀粉样蛋白，因为如果完全没有它们的话，一次大脑的细菌感染，如果在没有任何对抗机制的情况下，一个人两到三个星期，整个大脑就会被微生物毁掉，人就没有命了。但是就因为有了β淀粉样蛋白的存在，虽然血脑屏障出现了漏洞，但是微生物还是被糊住了，我们的命保住了。


    也许因为β淀粉样蛋白的出现大脑会逐渐地退化，10几年中人就渐渐地不行了，但是这起码比几个星期人就挂掉好得多得多，它实际上可能保护住了我们的大脑。


    当然也有另外一种作用，就是大脑对入侵的过度反应，比如说并没有实际的入侵发生，但是就好像过敏一样，β蛋白自己已经开始自顾自地错误地折叠起来形成了斑块，久而久之，它好心办错事的次数太多了，大脑神经元被它熏得差不多了，人也就不行了。


    ### —— 今日内容小结 ——


    所以今天这节课，我们可以感受到，一个不知道结果的问题，同时出现了两种可能的答案，到底哪一个是正确的呢？还是说都是正确的呢？


    在猜测的过程中发现，原来其中一个现象是另一个现象之所发生的原因。于是这两个嫌疑犯终于可以合并了。


    但就算是按照这个理由研发药物，效果也很差，后来竟然从“血脑屏障并不一定一直几十年如一日这么坚韧”这个角度出发，发现原来那些斑块并不是造成病变元凶，如果没有斑块，人死得更快，斑块有可能还是英雄呢。


    但是从免疫的角度看，这个英雄也会防卫过当，会过度反应。这个算是阿尔兹海默症发病原理上最近10年来最大的突破，也许之后会根据这个原理研发出更多的新药，效果会比从前好很多。


    ### —— 今日思考题 ——


    每节课开始都有这么一段，“知识这东西就得经常地核实和订正……”“那么我给你留一个思考题，你能不能想到在自己的学习经历中遇到过一个问题的答案反复更新过很多次的例子呢？


    如果你想到了，就留在评论里。


    ### 划重点


    - 1. 医学界的共识：人类平均寿命会继续提高，癌症死亡率会持续下降，但大脑的使用寿命跟不上身体寿命的增长。\n2. 当下的观察与发现，总结的规律与经验，总会有它的局限和范围，科学方法之所以是人类知识迭代最好的方法，就在于它总是能够不断的进行更新，不断的纠错。


    卓克 我是卓克，咱明忖天再见。


