    # 147 | 边界：恐怖记忆也能遗传吗？


    # ——►概念13：边界◄——


    人类观察世界的边界，是由所能使用到的最好的工具决定的，面对任何问题，只有尽可能多找一些可验征的细节，不过度地理解，不过度地解读，才可能了解真相。


    2013年，《自然·神经科学》上登了一篇文章，题目还挺有文采，叫：来自父亲的原罪。


    这篇文章一登出，马上就被各大媒体给转载了。其实文章里说的是小老鼠父亲的原罪，这个原罪指的就是对苯乙酮的恐惧，这种恐惧居然还传给了自己的儿子、孙子们。


    # ——►基因序列异常◄——


    事情是这样的，科学家们想弄清楚到底哪些东西能遗传，像我们听说过的遗传病就可以遗传，地中海贫血、色盲等等，那就是上一代的 DNA 上某个基因序列异常导致 的。


    具体什么意思呢？


    就拿地中海贫血来举例：


    指导如何生产血红蛋白的这个基因，它就有一个氨基酸，按3个碱基排1个氨基酸这个规律来说，这里本该是CTT，对应的是缬（xié）氨基酸。但是不幸，这些地中海贫血的患者在这个位置上，这3个碱基从CTT
    变成了CAT，于是最后表达的就不是缬氨基酸，而是谷氨酸，这就是序列不同。


    # ——►表现遗传◄——


    但是在上世纪90年代之后发现了越来越多的反例，就是像 ATCG 这些序列没有变，但是表现出来的特征截然不同，而且这种特征还能够遗传给下一代，所以这一下就让科学家们意识到，基因并不是把上一代的特征传递给下一代的唯一途径，还有其他的途径。


    于是，专门研究这些途径的学科就诞生了，这个现在叫做表现遗传。


    我们回到《自然》上那篇<|start|>文章“父亲的原罪”。


    具体电击是这样的：


    +   就是3天的时间里，每天电5次，先释放香味儿，然后就电击小老鼠的脚丫，电击比较轻微，就是会疼一下。3天过后，这批小老鼠只要再闻到苯乙酮，那就是一副担心受怕的样子。看来这种恐惧已经烙印在它的脑子里面。


    结果等第二代小老鼠长大了之后，各方面都发育完全之后，第一次实验让它们闻了一下苯乙酮，这个味道刚一出现，它们就高度紧张。如果在释放香味的同时，周围还很嘈杂的话，那它们就已经叫得不行了。


    # ——►DNA的甲基化◄——


    那么小老鼠这个貌似看上去<|message|> 恐惧被遗传的现象，更细节一些的道理是什么呢？


    这就要钻到它们的鼻腔里去了。


    # ——►今日内容小结◄——'
  - '[PAGE 162]


    # ——◈ 今日内容小结 ◈——


    这节课讲到现在，我们能得到什么科学的思考习惯呢？


    就是在感慨一件事之前，多找一些可验证的细节，不要过度地理解，不要过度地解读。这种事情经常发生在我们看到了一个舅人听闻的标题，或者听谁说了一个新奇的观点，之后我们就忍不住大谈特谈。


    我们再回头来对比一下，这个深入科学细节的研究成果，跟我们刚刚知道这个研究成果之后的感觉，这两种感觉差别是挺大的。


    最开始，我们可能看了标题，可能感觉就是，哦，天，恐怖记忆可以遗传了。


    而实际上，所谓的恐怖的记忆仍然是落实在生物实体上的，它先发生在甲基化变弱了，结果解放了苯乙酮受体蛋白质的表达，让受体大量地出现，然后才让这些小老鼠对苯乙酮超级敏感，过度的刺激让它们的表现在人类的眼中看着好像是恐惧被遗传了那样。


    # ——◈ 今日思考题 ◈——


    如果我们仅仅把目光集中在第一代闻香味儿后遭电击的小老鼠身上，经过了3天折磨之后，它们表现出的恐惧，表现出的惊慌失措，一般人的理解甚至可能拟人化，把它作为小老鼠的一种心理状态，是一种恐惧的心理状态。


    但是有科学思维的人，应该多想一步，就是这样的状态背后能落在哪些生物实体上呢？


    当然，这些细节也许会涉及一些比较专业的知识，但就算你没条件去细查，你能不能大概说说，假如往落在生物实体上这个方向去想的话，有什么好的想法吗？


    如果有，就请你留在评论中。


    # 划重点


    +   1. 基因序列不变，但表现出的特征却不一样，而且这种特征还能遗传给下一代，就叫做表观遗传。

    2. 每个细胞中都拥有完整的DNA图纸，却能分化出几百种不同的细胞，是因为很多基因被“甲基化”锁住了。

    3. 小鼠实验中，“恐惧”能够遗传，是负责苯乙酮受体的基因的甲基化变弱了，让小鼠对苯乙酮变得更为敏感，过度的反应，被人理解为恐惧记忆遗传了。


    卓克


