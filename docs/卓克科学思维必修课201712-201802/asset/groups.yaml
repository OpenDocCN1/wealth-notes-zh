    # 090｜问答：从换头术了解“科学共同体”


    090｜问答：从换头术了解"..."


    上周有很多同学看到一个报道，说世界上首例换头术成功完成了，希望听听换头术是不是真的。其实去年的专栏《阜老板聊科技》中我就回答过一次，这是一场披着医学外衣的个人秀，但是那个时候离他们操作手术还有一年多的时间，上周的11月17号手术终于实施了。


    两个核心人物：


    一个是意大利的神经外科专家赛吉尔·卡纳维罗；


    另一个是哈尔滨医科大学第二医院的骨科医生任晓平。


    不过他们对换头术这样的叫法不认可，他们总要纠正每一个记者，说这不是换头术，这是“异体头身重建术”。不论叫什么，他们都属于是偏离了主流科学观点之外的另类科学家、另类手术，而而且他们还有意地借助媒体喜欢追热点的这种特点来炒作自己，等大这件事。


    这件事最早是在2015年，卡纳维罗在TED的演讲中说自己要在2017年的时候完成人体头部移植手术，所以现在已经是2017年11月底了，他现在就是要兑现之前在媒体上的承诺了，只不过11月17号他们做这个手术是在两具尸体上完成的一次试验，手术一共进行了18个小时。


    那完成的是什么呢？


    就是把最大的血管与最大的几根神经接起来了，于是他们就宣布，成功完成这一阶段的任务。然后，马上就被一些喜欢追热点的媒体解读成换头术成功了。你要是拿一个尸体做试验就算成功的话，那一个手术做完了，病人不幸去世了，你要是出去跟人家家属说，我这手术成功完成了，你说对方家属能答应吗？


    而从他们之前对外宣传看，他们做的事情最终要达到的效果可不是这样的，而是要把头部移植给一个新的身体之后，这个身体可以受头的支配，这个新头和身体最后可以正常地生活、工作。他们在之前的描述中，说了很多美好的，比如像很多人身身体有问题，可头脑是健康的，就像霍金那样，那给他一个年轻的好身体，这个宝贵的大脑是不是又可以思考几十年了，还有像脊椎受损、高位截瘫的患者，也都是可以从中受益的。


    这些宣传当然很诱人，但它离实现太远了。这就像一个9岁的孩子，他说要努力学习，一定要刻苦用功，要在3年之内证明爱因斯坦想。这句话里包含了许多积极的词汇，但实际上却是一种不务实的妄想，是应该制止他的。


    所以，虽然媒体报道很积极，但科学界内部几乎没有人支持，甚至不太愿意公开负面评价同行的科学家们，也都纷纷站出来抵制这个所谓的换头术。


    中国华山医院神经外科主任，也是中国工程院院士的周良辅对这个手术的评价，很简单，两个字，乱来。


    卫生部副部长黄洁夫的评价是，从科学上讲不可实现，伦理上讲也不合情理。


    当然，某位科学家怎么说，某位官员怎么说，就算他的名气再大，也只能是作参考。一个科学观点是不是该被接纳，简单的方法就是直接听取科学共同体的意见。


    那什么是科学共同体呢？


    那就是一个组织，它代表了一大群科学家的意见，它公开发表的任何观点都是这群科学家的共识，对这个事，世界神经外科联合会发表了一个严肃的声明，大致的意思就是说，头颈移植技术具有一定的可能性，但目前不但在伦理学上不可接受，在科学方面也毫无意义。


    卡纳维罗这个人是从5年前就靠宣传这个手术出名的，不过出名也只是在媒体圈，在科学界的内部，凡是有名望的期刊杂志，对他提交的关于换头手术的论文一律都是退稿。而且因为涉及人体实验，所以他是要通过各国和各机构的伦理审查的。卡纳维罗想在欧美做实验根本就没法通过这种审查，最终就找到了中国。中国在手术伦理审查方面明显要求弱得太多太多了，否则你想，连卫生部副部长都已经在批评他了，“伦理上不合情理”，可是手术仍然能在中国继续开展。


