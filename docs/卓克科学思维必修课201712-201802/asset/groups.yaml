    # 100 | 起源：全球物种大灭绝为什么会发生？


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_25_0.png)


    100 | 起源：全球物种大灭绝...


    # —— 概念10：起源 ——


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    上节课最后我们留的那个问题，类似物种灭绝的事件研究，再怎么收集数据也是很难还原那个时期的原貌的，就连描述我们当前生物界的物种分布和数量，科学家都难以做到。也就是说，这类研究得出的结论，不能像物理实验那样能重复做，找规律，去验证它。


    那么这些科学研究跟科幻小说有什么区别呢？


    其实区别就在于，使用的研究方法和研究设备。因为有些研究就是天生触碰到了这些极限，没办法对证据求全备齐，也没办法反复地验证，虽然我们明知自己手拽着很少一部分可供研究的素材，但我们还是要以最大的可能性，从这一小点的证据出发作逻辑判断。


    比如说我们使用最先进的仪器，利用最合理的数学模型等等，这里每一步仍然是可以验证的，这样做起来就可以得到一个有依据的观点。


    也许这个观点不能推导出几亿年前旧世界是一个什么样子，但如果这样做事情的科学家多了，等到积累到几十万个可靠的小结论之后，也许拼凑在一起，就能多少让我们看到旧世界的样子了。但是科幻小说不是这样的，它每一个逻辑不需要验证，它只是为了故事情节服务的。


    这个问题回答完之后，今天这节课我们要说说大灭绝是怎么发生的。


    之前5次大灭绝，大家都记得最后一次，那就是小行星撞击地球造成的，而且这个研究到现在结论是板上钉钉的，因为科学家们已经在墨西哥的尤卡坦半岛找到了那次撞击之后留下的海底的大坑，直径180多公里，深900多米。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_25_1.png)


    比这次绝灭再往前那一次，发生在2亿年前，是三叠纪的末期，70%的物种灭绝了。那一次在现有的研究中也找到了一个特殊的原因，是因为盘古大陆的裂解。


    什么叫盘古大陆呢？


    就是在2亿年前地球上的大陆只有完整的一块，但是就在2亿年前的时候，完整的大陆开始分裂了。比如咱们现在可以看到，南美洲和非洲都是弯弯的形状，那是可以很好地拼合在一起的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_25_2.png)


    为什么呢？


    就是因为当初它们就连在一起，后来被撕开了。这次的地壳板块巨大的撕裂也让地球上到处都是火山喷发，可能一说起火山喷发，大家印象中最著名就是埋没了庞贝城的那次维苏威火山的喷发。假如说那次的喷发剧烈程度是1，那么三叠纪末期几乎每次火山喷发的剧烈程度都是100到2000这个范围，当时板块断裂的地方，在地表上都分布着几十公里，甚至几百公里长的熔岩的河流，这你敢想象吗？火山喷发，喷岩浆。这个当然是局域性的，但是它喷出的气体影响是深远的，影响最大的就是二氧化碳。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_25_3.png)


    上面这张图，是最近4.5亿年来，地球上二氧化碳含量的变化。你看，绿色的点是我们采集到的数据，这个数据一共831个，红色的是对应该一时期，对数据取的平均值。


    大家注意，在2亿年那个时候，出现了一根巨高无比的绿色的柱子，最高点对应的二氧化碳含量已经是5700ppm了，就算取了均值也是接近3000ppm，而现在是多少呢？大约是400ppm。也就是说在三叠纪末期，二氧化碳的浓度大约是现在的10多倍。


    二氧化碳这种温室气体就导致了当年全球的高温炎热，大约比现在高了8到10摄氏度。这个高温最终导致爬行动物遭了殃。


    还记得我之前说过的那节课——各式各样的性别吧？


    那到底是什么影响爬行动物的性别，起码现在来看很多爬行动物生出来是男是女，要看孵化时的温度。假如假设2亿年前的爬行动物也是这个规律的话，就会因为升温造成很多种爬行动物当年生出来，要不就全都是雌性，要不就是全都是雄性，这当然就没法延续了。


    就算生出来的是有男有女，而且还能交配，还能下蛋，但是那个时候的氧气含量也突然降到了历史最低，只有现在的70%，这跟现在在3000米高原上的氧气含量是一样的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_25_4.png)


    所以在2亿年前，那个时候生物是活在一个天气干热得没法忍受，而且还喘不上气的环境里。已经成年的动物还好说，它可以张开口，多呼吸，少活动，勉强强撑维持。但是它们生的蛋就难了，因为蛋的孵化也是需要氧气的，那这个蛋上就需要更多的孔可是孔多了，水分蒸发也快，这个蛋就会在还没孵化之前就干掉了。


    你看，环境对蛋的孵化是两头儿堵，所以在那个时期，生物迅速地灭亡，最先灭绝的是陆生的动物，接下来是海生的动物。


    上几节课我们也说过，越来越酸的海水在三叠纪末期就发生了，那个时候海洋的pH值迅速地低于7，一切珊瑚礁全都消失了，大部分鱼类也消失了，留在海中的只是微生物。


    上面我就简单说了最近两次的大灭绝，一次是小行星撞击造成的，一次是大陆板块裂解造成的。


    # —— 生物多样性危机 ——


    但是再往前，3.6亿年前，那次大灭绝的原因，它就完全不一样了，因为它根本不存在这种典型的巨大的灾难。详细统计当时空气中的各种成分，还有气温，海洋的pH值，就发现在3.6亿年前，那一次75%的物种都灭绝了，是发生在一个风平浪静的环境里的，甚至连旧的物种的消失的速度都跟其它的时候没有太大的差别。


    那你说它为什么灭绝呢？


    其实就一个原因，新物种生成的速率几乎是0。所以你看，只要保持这种只减不增的态势，让它保持个一二百万年，然后再从全景上看过去，它就是一场大灭绝事件。而且当年身处其中的任何物种在它们寿交流史中，都完全没法感受到灭绝这个事儿已经在发生了。所以科学家也把3.6亿年前这次大灭绝叫做生物多样性危机。


    那为什么会不产生新物种了呢？


    这个就要说一下新物种是怎么诞生的，它必备的条件就是要跟旧有的物种形成隔离。'
  - '[PAGE 26]


    离。


    比如像澳大利亚大陆，它是5000万年前跟南极大陆彻底分开的，然后它跟其它的大陆也没有任何连接，这样就形成了一个很好的隔离。在澳洲大陆演化出的动物就只有澳洲大陆才有，代表性的就是有袋类的动物。隔离就限制了基因混合，所以物种就会越来越不一样。当不一样的程度足够大的时候，就能形成新的物种。


    3.6亿年以前之所以大灭绝，就是因为隔离的作用消失了，在那之前全球的大陆是东一块西一块的。但是在3.6亿年前，温度上升，海平面上升，最后竟然地球上只剩下 一块陆地了，那就是上节课我们说的盘古大陆，那个时候整个地球上所有的生命都在这一块大陆上竞争，所以最终只有少数几个强者胜出了，它们迁徙到哪儿，哪儿就成了它们的家，其它物种就灭绝。


    在那个时代，海洋里也出现了单一物种独霸天下的情况，从现在的化石上看，占据海洋的是 一种叫做海百合的动物，以至于现在挖出来的那个时代的石灰岩几乎全都是海百合的化石，找不到任何鱼类。可是，鱼类是专门吃海百合的，也就是说海百合在那个年代完全没天敌，所以在3.6亿年前，在那100万年左右的时间里，陆地跟海洋都被几个少数
    的物种霸占了，就这样平平静静的，几年灭绝几个物种，100万年过去之后，地球上75%的物种全都消失了。


    以史为鉴，这不就是我们现在的地球吗？


    虽然现在五大洲板块是分开的，但是科技发展了，就导致它分开跟没分开差不多。现在坐飞机横跨半个地球，已经不再是少数高收入人群的特权了，谁都可以买得起票。所以地理隔离对人类来说已经失效了。


    # —— 今日内容小结 ——


    那么这节课中，我们从中收获了什么科学方面的思考呢？


    就是：一个看上去非常显著的事件，它不一定有什么特定的显著的原因。


    # —— 今日思考题 ——


    不知道你注意到没有，我一直说的是物种大灭绝，它的特征表现就是物种数量急剧减少，专业术语叫做“失去了物种的多样性”。


    划重点


