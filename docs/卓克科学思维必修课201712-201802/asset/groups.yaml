    就是把最大的血管与最大的几根神经接起来了，于是他们就宣布，成功完成这一阶段的任务。然后，马上就被一些喜欢追热点的媒体解读成换头术成功了。你要是拿一个尸体做试验就算成功的话，那一个手术做完了，病人不幸去世了，你要是出去跟人家家属说，我这手术成功完成了，你说对方家属能答应吗？


