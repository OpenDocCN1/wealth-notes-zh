    # 129 | 旁证：日本人是中国人的后代吗？


    129 | 旁证：日本人是中国...


    # —— ◄概念12：旁证► ——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    日本人是中国人的后代吗？


    这个问题想要回答正确，可不是简单的一句是或者不是，因为什么算中国人，什么又算日本人，这就已经很难清楚了，这两个问题没有标准答案。


    比如说，人类祖先6万年前走出非洲，那次算是真走遍了世界，其中走向亚洲的一支是从南亚进入到了中国大陆的，但是他们并不是像现在一样，80%的人口分布在中国东部，而是往东北方向走到了蒙古、俄罗斯，甚至更北。


    这些经过了东亚大陆的人算中国人吗？


    历史上我们曾经只管在中原腹地居住的人才叫中国人，这批祖先后来又南下再进入了中原腹地，但他们后来又南下到很南方的地区，可中国有了文字之后，管这些地方叫做蛮夷，那么他们算中国人吗？


    每个历史变点上都存在这样的疑问，所以什么人属于中国人，这要说起来估计能写一本书了。同样，什么算是日本人，也存在这样难以一句话说清的问题。


    所以今天这一节课，我们借这样一个标题来提醒大家：


    要回答一个问题之前，想清楚问题里每一个元素都是什么意思，然后再考虑要不要回答。看急回答是或不是，那都是 一种不健康的思考习惯。


    倪 Pp 尔斯


    北海滩


    想说清这个问题，我们只能从根上倒，上  是一张简化地图，这是现在在亚洲东北部 分的样子，日本整体被海水包围了，最北 边的叫做北海道，比较南端一些的叫九州 岛，它跟朝鲜半岛大略隔着150公里的海
    峡。最南的是琉球群岛，它甚至快延伸到 台湾岛了，但这张图里并没有画出来。这 个就是现在日本的样子。


    但是10多万年前日本不是这个样子的，因为那个时候还处于离现在最近的末次冰期，海平面很低，现在不少海底的部分在那个时候都是陆地，所以大家可以看看下面两张图。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_99_0.png)


    这是2万年前的地图，其实不只是2万年前，从10万年前到1.5万年前这次冰期结束，差不多都是这个样子。日本最北边的北海道跟亚洲大陆连为一体，而且连南方的九州岛也几乎快跟朝鲜半岛接壤了，虽然没有完全接上吧，但相隔也就四五十公里的样子。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_99_1.png)


    上面这张图就是1.8万年前陆地的样子。


    红色部分那会儿都是大陆，但是现在都是海洋。这张图里，如今的东海、黄海的海底，在那个时候都是可以徒步走过去的。日本最南端的琉球群岛，在那个时候是一片大陆，根本也不是什么群岛。


    所以从直觉上我们就能知道，从石器时代开始，到最后次冰期结束，亚洲人都有机会去日本。


    # —— ◄日本人的祖先构成► ——


    实际上是这样的呢？


    实际上第一批进入日本的人类大约是在35000年前，这批人在之前几万年里一直生活在东南亚大陆上，当时没有海水，但海平面开始上升之后，这批皮肤棕黑色的东南亚人开始北上，有的就定居在中国大陆南方了，有的直接走到了琉球，他们于是成为了第一批日本人。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_99_2.png)


    现在日本把那一股祖先叫做绳文人，他们世世代代生活在日本的南方，创造了绳文文化。这里出现了日本最早的居民很好理解，因为至少这块还是温暧潮湿，气候还不错，大陆也还连着。现在你也可以看到日本人里确实有一些皮肤颜色非常深的人，他们就是绳文人的后代，以这些人的来源看，日本人、菲律宾人、马来西亚人他们拥有共同的祖先。


    但是日本人不止这一个来源，因为在这期间，从日本北方也不断地进人，他们是从西伯利亚南下的，叫做阿伊努人，他们到了日本定居在北海道跟本州岛的北部，从北方进入的阿伊努人在1.5万年前就终止了，因为在那之后大陆桥消失了，中间就是一片海洋。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_99_3.png)


    阿伊努人长的跟亚洲人差异非常大，他们眼窝深、鼻腔宽大，毛发非常浓密，皮肤非常白，跟欧洲人的特征有点像。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_99_4.png)


    上面这张是阿伊努人皮肤的样子，这体毛浓密到有一点像猿人了。以这些人的来源来看，日本人、东西伯利亚人拥有共同的祖先。


    可是日本人还不止这两个来源。


    因为九州岛跟朝鲜半岛中间虽然有海，但是很长一段 时间里它只有几十公里宽。如果 你还记得复活节岛的故事，你就能理解，这个距离对于生活在海边的人来说，跨越它的宽度简直易如反掌。


    所以日本人还有一个来源，就是从朝鲜半岛迁徙过来的 人，这些朝鲜人从前也都是从中国来的，可以算是中朝人。但中朝人来得比较晚，大约是从15000年前到2500年前陆续到达的日本。他们形成了后来大和民族的主力。以他们的来源来看，日本人、朝鲜人、中国北方人拥有共同的祖先，他们的样子跟中国人差不多。


    所以到了这里，日本人的三大来源就清楚了，他们的差异比较大。所有这些清晰的差异都是通过分析父系遗传的 Y 染色体 DNA 跟母系遗传的线粒体 DNA 分析出来的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_99_5.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_100_0.png)


    大家可以上面这张图，它把一张复杂的表格可视化了，每个地区都有一个饼图，它代表着对那个地区很多人 DNA 测序之后 的分析结果，饼图中，每种颜色都代表着一种基因类型。


    中国大陆人的类型都是以 O 开头的，比如 O1、O2、O3，当然 O 只是大类，里面还有更细分的小类，比如 O1a、 O1b、O1c，当然还有更细致的，比如
    O1a1，这个是爱新觉罗这个姓氏后面专有的基因型。


    我们可以明显地看到，日本最北方的阿伊努人群，饼图里只有两种基因，一个就是浅绿色的 D1b，一个是土黄色的 C2a。


    日本从北到南几乎每一处的人都携带浅绿色跟土黄色的类型，也就是说，从几万年前从东西伯利亚南下的阿伊努人和日本全国范围都有着广泛的通婚。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_100_1.png)


    所以这样就可以看出，日本原住民的基因是 D 开头的，就是那些浅绿色跟深绿色。


    # —— 原住民：阿伊努人 ——


    如果只从基因类型上看，我们会觉得拥有 D 型的阿伊努人应该是日本一股很强的势力吧？


    但实际上查看日本历史，你就会知道，阿伊努人是惨遭荼毒的。本来很久以前，从朝鲜涌来的人跟他们是相安无事的，但是随着中朝移民逐渐壮大，开始他们还是原始社会的模式，但是逐渐地，中朝大陆那边产生了农业社会，有了种子跟铁器，从中朝移民的人也一并带来了，这一下就建立了食物充足的优势。


    几百年上千年之后，中朝移民逐渐形成了今天的大和民族，人口越来越多，需要的地盘越来越大，在无数次的摩擦跟战斗中，逐渐把那些早就广泛分布在日本领土上的阿伊努人往北方挤，凡是保持着原始生活方式的阿伊努人就只能节节地败退，直到他们退守到北海道岛上，继续以捕鱼为生。


    但即便这样，他们的生活还是不能安稳，比较大的战争有1457年的渡岛半岛战役，还有1795年阿伊努人反对大和民族统治的战斗。


    最后一场大战70年之后，明治维新开始了，这对阿伊努人更是灭顶之灾，因为从前的大家族只是把他们当作低劣的人种，奴役他们，压迫他们。但是明治维新中颁布了法律，禁止他们使用阿伊努语，禁止狩猎跟打鱼，禁止阿伊努传统的祭祀活动，强制他们学习日语，强制他们把名字改成日语的姓名。所以，这支来自于西伯利亚的曾经的多数民族的文化在之后被系统地消灭掉了，唯独能让21世纪的我们清晰辨认出来的，只有那些绿色的
    D 型基因。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_100_2.png)


    二战以后，阿伊努人的后代积极开展传统文化的拯救工作，日本政府直到1997年才颁布了一系列的法律保护当地的人权跟文化，2008年的时候日本政府才第一次承认了阿伊努人是日本的原住民。


    # —— 今日内容小结 ——


    那这节课我们能学到什么科学思维呢？


    就是我是谁，我是从哪来，我要到哪去，这三个基本的哲学问题在2005年之前，对世界上很多民族都是空白的，没法回答清楚。


    直到基因技术成熟了之后，现在每个人都 可以用几毫升的唾液或者一棉花梗的口腔上皮细胞就能测出来我是从哪来的。这个问题搞清楚之后，往往会让人陷入沉思。


    以日本为例，日本人一直存在一种优越感，就是我们日本一直都是跟亚洲大陆分离的，四周被海隔开，所以我们的人种跟亚洲人是在不同地区分别进化的，我们的更优秀。他们也把这种差异当作是日本经济发达、国民纪律严整、素质高的原因，而且还引以为豪，甚至当作了侵略的理由。


    不过现在来看，日本真正区别于亚洲大陆人种的就是阿伊努人，他们更像欧洲人，只不过这些人在日本的历史中，上千年以来一直受到了压迫跟欺负，以至于100多年前，连历史文化都被彻底地消灭了。那些引以为豪的民族差异并不存在，因为大和民族基本上来自于中国跟朝鲜。


    我们自己也可以反思，当问出这个问题，日本人是中国人的后代吗？是不是也有一些人希望从肯定的结果中找到一些自豪感呢？这种自豪感就好像我们的辈分更高一样，其实我们跟日本人都是3万多年前亚洲祖先的共同后代。


    # —— 今日思考题 ——


    为什么世界各地原住民的命运总是很不幸呢？


    如果你有想法就留在评论中吧。


    # 划重点


    +   1. 通过基因测序分析，日本人、朝鲜人、中国北方人都是3万多年前亚洲祖先的共同后代。\n2. 来自东西伯利亚的阿伊努人是日本的原住民，他们的基因广泛分布于全日本，来自中国大陆与朝鲜的移民，大约是从15000年前到2500年前陆续到达日本，形成了后来大和民族的主力。\n3.
