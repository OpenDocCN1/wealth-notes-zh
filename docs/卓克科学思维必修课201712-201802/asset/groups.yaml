    # 098 | 起源：原始人现代人谁更聪明？


    098 | 起源：原始人现代人...


    # —— 概念10：起源 ——


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    原始人比现代人更聪明吗？


    这个问题听上去很好回答，大部分人 пусть出，当真是我们更聪明。但实际上运用我们的科学思维的习惯再重新想一想，这个问题是没法直接回答的。


    首先，什么叫原始人呢？其次，聪明是什么意思？你只有把这两个概念都划定清晰了才能讨论。


    我们现在就来规定一下，这个问题中的原始人指的是就跟现代人的基因几乎没有 LKTV 差异的那些人类祖先，大约可以划定是2万年前的人。如果我们能够乘坐时光机器回到那个时代，比如说在黄河流域，我们抱回了一个婴儿，在现代社会养大，这个婴儿只要接受了现代化的教育，一样可以成为律师、运动员、医生、教授，都没有问题。因为那个孩子跟我们的基因差异也许比我们跟一个当代的非洲人的差异还要小。


    接下来我们要定义什么是聪明，这倒是有难的。用智商测试来代表聪明不聪明行么？不行，因为智商测试是1950年之后才逐渐成熟的，人类已经存在了几万年了，所以不能拿智商测试来衡量原始人。


    那么什么算作聪明呢？我们先不忙下定义，我们先来看一种说法，它说的是原始人不一定比现代人笨，这个理由就是我们跟原始人因为生活环境不同，掌握的技能也不同。


    比如说你让一个原始人玩《王者荣耀》，他表现一定是很迟钝的。但如果让我去砍树，去搭帐篷，其实这都太难了。就算是仅仅让我们在丛林里行走20公里，咱们现代人几乎都做不到。所以在这种观念中，原始人的笨跟现代人的笨在环境大变了之后，这个笨的程度也是一样强烈的。


    可是我不太同意这样的观点，因为原始人的大脑如果跟我们有同样的能力，那么他们大概率说也会在几百年之内展现出截然不同的能力。在几万年前就出现了现代社会了，可是他们为什么没能抓住上百个几百年的机会？


    我们当然不能乘坐时光机器去找原因，但是依然还能在现代社会中找到一些证据。


    # —— 达尔文见闻 ——


    最早的描述就是达尔文1833年到了南美洲最南端的火地岛，在那里看到当地的土著居民的情况。这里的土著居民虽然是已经到了现代了，但还保留了原始人的生活方式，所以是一个非常好的例子。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_21_0.png)


    火地岛是南美洲的最南端，已经算得上是极寒之地了，但是那儿的人最好的情况就是往身上披一张海狮皮，晚上睡觉的时候大都是躺在潮湿、阴冷的地面上，什么覆盖物都没有，就蜷着身子。


    吃的东西主要就是从海滩上捡回来的，有的时候也会用头发做钓鱼线穿上一些小鱼饵去捕鱼。最好最好的食物就是偶尔能碰到一只海狮，把它打死。就算是那些已经死亡已久的，腐烂的鲸鱼的尸体漂到岸上，这些人也会当作盛宴一起吃。


    他们也没有什么工具来运输这些鲸鱼肉，只能是割下一大片，然后在这片肉的中间钻一个窟窿，把木钗进去，把肉挂在身上，就像披斗篷似的。运回去之后，那儿的人用火烤上几分钟再吃，这还是食物丰富的时候。


    如果遇上了冬天食物短缺，实在没有东西吃了，那怎么办呢？先杀掉部落中的老女人，如果老太太杀完了还不够的话，再杀掉狗。那为什么不先杀狗呢？他们的理由就是这些狗还能捕猎用。


    达尔文跟小猎犬号上的船员登岛之后，最初火地岛的居民是有浓重的敌意的，一群人在岸边上冲着小猎犬号是“嗷哩哇啦”一通乱喊，虽然听不懂，但知道差不多就是骂人或者是威胁。


    但后来船员们就拿出一些东西，比如说系在头上的红色的头带，还有饼干，这些人一下就非常感兴趣了，故意这样慢慢地消去了。再之后，一群大胆的人就跟着他们，嘴里不停地喊着“亚麻苏娜，亚麻苏娜”，嘴里喊着，手就指着船员们身上。后来这些船员就猜，大概的意思应该就是“把这东西给我”。船员们把身上一些零碎，甚至连扣子都揭下来给他们，他们就(call)不喊了。


    达尔文观察，这些人大多数的时候看着都很郁郁，精神萎靡，但是拿到了船员的东西之后就非常兴奋，怎么表达这种兴奋呢？就是发出像鸡一样的“咯咯”的声音，然后与此同时，像拍实心馅饼一样，双手大力地同时拍达尔文的前胸和后背，拍完了之后也敞开胸膛等着达尔文去拍他。达尔文注意观察土著居民之间的交流，就发现他们有类似语言的东西，但是很难算得上口齿清晰，比起哑人来说，含糊多了。


    # —— 脑区分层 ——


    我看到达尔文描述的这群人的情绪表达，一下就让我想起一个脑科学的实验。


    在说这个实验之前，我们先补充一些脑科学的知识，如果按功能的高低分，大脑是可以理解像一个鸡蛋似的，它可以一层一层地剥开，最外层覆盖着很多褶皱的，这个叫做新皮质，大概是几毫米厚，它是负责所有高级的思考能力，比如像语言、计算、分析、逻辑。新皮质只在哺乳类动物的大脑中发现。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_21_1.png)


    如果把新皮质剥开，内层有一个叫做边缘系统的，它更多的是负责情绪的表达，比如像恐惧、兴奋、担忧、自我压抑、攻击。再把这层剥开，最核心的一处叫做原始脑，也叫做爬行动物脑，这是所有大脑形态中最早形成的，这里负责肌肉的收缩、身体的平衡、心跳和血压，这里控制的那些功能，就是那些即使你在睡熟的时候，它也(never)不会停止工作的。而且这里的工作几乎不受你的意志控制，比如说我想主动地把血压往下降一降，这件事谁也做不到。


    我说的这个实验就是在新皮质区上，在1860年到1870年这10几年的时间中，人们首先发现了这个区域上的两个语言区，一个叫做布洛卡区，一个叫做威尔尼克区。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_21_2.png)


    从一些脑部受伤的患者身上就发现一个特有意思的情况：


    威尔尼克区受损的患者，他也可以说话，但是他说出来谁也听不懂，而且这个病人也听不懂其他人在说什么。


    布洛卡区受伤的人，假若他的威尔尼克区保存完好的话，这种病人可以听得懂别人说的是什么，但是自己心里的 话却说不出来。


    后来在更详细的大脑的扫描中就发现，人类大腦新皮质上几乎每一个区域都和这 两个语言区有联系，所以也侧面上反映了那么一句话，说的是“语言的边界就是人类思想的边界”。


    而更有意思的是，那些布洛卡区受损的病人，他虽然没法说话，没法讲故事，但是他骂起来来，尤其是在骂那 种最脏的骂街的...'
  - '[PAGE 22]


    骂起人来，尤其是骂那种最脏的骂街的话，还有那些骂来喝去的，或者是表达发怒发狂的语言，表达起来非常流利，所以这就表明，人类有两套表达语言的神经通路。


    一套是随着人类社会演化出来的，它主要聚集在新皮质层，而另一套是哺乳类动物的时候就可能有了，你看布洛卡区受损的患者，他表现出来还真有点像火地岛的居民，这些人在表达原始冲动的时候，你看他看到船员的时候那种威胁，那种大骂，还有收到礼物之后高兴地“哈哈哈”学鸡叫，这些语言表达更多体现在情感冲动驱使下。而布洛卡区受损的那些病人，你看他虽然不会叙述故事，但是他骂街完全没问题。


    # ——◆ 聪明的标准 ◆——


    所以现在，我要说的就是这节课开头那个问题，聪明不聪明，我们是可以找到一个标准的，就是应用语言能力的高低。人类语言和原始人用的语言还有一个不同，就是人类用象征性的符号来沟通，所以可以进行抽象思维。


    什么叫象征性的符号呢？


    那就是一个语音、一个图标、一个字，它代表一类的事物，就是这样一对多，或者是一对一的映射关系。如果这些映射关系对于生活是至关重要、不能丢、必须存在脑子里的，那我们也必须相信它是肯定要占据一定存储空间的，而且这个空间指的是物理实体的空间。如果这种映射关系越来越多，那么需要的物理实在的空间也就越来越大，这就是人类的脑要比猿猴的脑大得多的原因。


    把很多对象符号化还有一个缺陷，就是不同历史文化区域长大的人不容易沟通，同一个发音，不同的人脑子里映射出来的那个对象有可能不一样，所以再下一步进展就是文字的产生。


    从这个角度来说，文字的作用就不只用于记录过去的历史了，它还有一个重要的功能就是有可能让我们实现客观的思考，任何想法、任何发音只要能够记录在纸上固定下来，才有进一步确认它是哪个东西的可能，才有进一步把它提炼成一个其它概念的可能。但是有的文字，依然没能排除不同区域文化的人对同样字的理解。甚至一个单位，一个机关里的人对同样的字的理解都是不一样的。


    那你说现在为什么重要领导讲完话之后，一定要组织大家开会反复学习呢？


    就是要把那些语言重新捋一遍，领导说的 ABCD 跟你之前脑子里的 ABCD 是不是都映射到同一个对象上了。如果你不了解这个道理，那你看新闻联播就是一个局外人，你就会以为新闻联播都是千篇一律的东西，其实它这里每个字都是有讲究的。


    文字出现之后，映射的对象固定了，哲学思考，甚至数学和科学都可以在这个基础上诞生了。所以文字可以说是脑的一种扩张，让映射关系更简洁、更准确。这个时候抽象化的价值就更大了，这会儿的抽象就不是古人对宇宙、对存在的胡思乱想了。当数学和科学出现了之后，它甚至是不需
    要翻译的。


    所以到了这儿，让我们再回到这节课开头说的，原始人比我们更聪明吗？


    我们把原始人定义成2万年前的人类，把聪明定义成对语言和抽象化的符号的应用的能力，那么答案实在是太明确了，原始人的聪明程度还差我们太远了。


    # ——◆ 今日思考题 ◆——


    一个当场语言表达比较混乱，但是文字却能写得很清晰、很有条理的人，对比一个面对面的时候能说善辩，但是写出的文章一团糟的人，这两个人哪个更聪明一些呢？


    希望你把想法留在评论中。


    # 划重点


    讨论一个问题或一件事儿，首先要将问题定义清晰，否则很可能最后就是鸡同鸭讲，因为同样的文字和词语，在不同人的脑子里映射的认知存在差异。比如“原始人现代人谁更聪明？”这个问题，就需要先给“原始人”和“聪明”做定义，50万年前的也是原始人，2万年前的也是原始人，差异巨大，对于“聪明”的认知更是千差万别。


    卓克


