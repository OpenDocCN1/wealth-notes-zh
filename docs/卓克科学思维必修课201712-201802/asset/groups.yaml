    # ——► 识别内容可信度 ◄——


    今天有同学问，深圳公交车无人驾驶已经出现了，怎么看这个事情。那我就正好利用这次答疑来教大家怎么识别一篇文章的内容是不是可信的，或者说是不是过于夸张的。


    第一个方法，就是从标题中筛选。


    80%内容有问题的文章，在标题上都可以看出来，如果你熟悉这类文章的标题特征，那就用不着费时间点开看这些内容了。这个新闻在周一刷屏的时候，题目用的是《别了司机，刚刚，深圳正式宣布！》。


    从标题上分析，首先来数一数他用的感叹号的个数，如果用了一个，那就先列入嫌疑的对象，如果标题里出现了两个感叹号，那都可以直接不用看了。对一个作者来说，标题里如果出现两个感叹号，就说明这个人在写作的时候已经不能控制住自己的情绪了，这种连情绪都控制不住的人，他写出的内容也可能有理有据。


    # ——► 事实查证动作 ◄——


    再往下看，就是这篇文章内容说到的事实的查证了。


    # ——► 挖掘事件的真相 ◄——


    那么事实又是什么样子呢？


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_14_1.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_14_2.png)


    从今天开始，就让我们一起来验证这个时间表：


