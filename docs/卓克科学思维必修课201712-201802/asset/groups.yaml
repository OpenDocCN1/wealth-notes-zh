    # 159 | 泡沫：怎么识别民科？


    159 | 泡沫：怎么识别民科？


    # ——►概念15: 泡沫◄——


    一项新的科研成果出现，总会引发很多人的热情，有一些人是为了科学欢呼，有一些人则希望从中渔利，于是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    怎么识别民科？


    这个问题答案简单来说：


    就是用学术门槛来识别。


    听完这节课，你就会知道，在今天，科学家已经是一个职业了，就像任何职业一样，都有行业内部的从业资格，甚至有些职业已经设置了硬性的门槛。


    比如，没有律师资格证，就不可以成为律师，没有执业医师资格证，也不可以成为医生。


    科学家这个职业虽然没有国家颁发的证件，但一样有严格的内部评定。


    # ——►民科的定义◄——


    什么才算民科，在中文世界里有一段说得不但全面，还特别逗，说：


    民科泛指民间科学家，多含有贬义。一般没有受过科学训练，也无意接受科学训练。不懂科学理论，而对科学研究感兴趣，并致力于研究。在一些民间科学家对科学发现起到正面作用的同时，大部民民间科学家成了伪科学理论的创造主体。


    # ——►科学家的门槛◄——


    这个关键的判据对现在的标准来说是什么呢？


    就是，一个正经的科学家至少应该具有博士学位，并在国际公认的学术期刊上发表过论文。


    # ——►学术期刊◄——


    学术期刊是在学科分类之后出现的，最早是一些大学内部的研究者相互分享研究成果的刊物。后来，逐渐发展到整个行业的期刊。


    随着期刊数量增加，它们之间也有激烈的竞争，就像现在微信公众号一样，虽然号称2500多万个，但活跃的，每周至少有一篇更新的，估计也就100万左右。这100万里，还能继续分出优劣。'
  - '[PAGE 197]


    给科学家们发表预印本的平台，甚至在互联网都不存在的时候它就出现了，它的优势就是快和门槛低。


    最早谁都可以把自己写的东西入库，并没有谁来审稿，有些科学家为了赶时间，正式的论文审稿可能会非常久，比如说稿子寄过去之后，3个月到1年之后才能刊登，他怕首先发现的荣誉被别人抢走了，所以在他提交正式论文的时候，也一并存一份在arXiv上，今后就来证明他做出发现的时间点。


    而且最近20年里，论文库被商业机构操纵了之后，不论是刊登还是阅读，费用是非常非常贵的。不少科学家为了省钱，所以大段的证明过程，或者是彩色的图片就都往 arXiv
    上放了，而最终往那些期刊上放的也许只是一个 arXiv 上的链接。


    但是别忘了，科学家这个职业是有门槛的，所以到了现在，就连 arXiv 上也有变化了，它不是像初期那样谁都可以发了。


    到了现在，要提交论文是需要提交者做认证的，认证的方式就是邮件，而且要求你的邮件地址是大学的邮箱，这个地址往往都是以 edu 为后缀的那么一个邮箱。


    而且到了2004年，这个要求就更严格了，它要求首次提交论文的人必须要有 一个已经在 arXiv 上活跃的人来推荐才可以。


    谷歌学术也很有可能是打破纸质期刊速度慢跟垄断的一个很有希望的平台，虽然它现在绝大部分的数据还是基于已有的纸质期刊，但是很多地方都可以利用网络的优势。


    比如说它创造出一个新的评价体系，除了传统的引用数之外，还有另外两个标签，一个叫做 Highly Cited Paper，这个代表的是当年引用次数进入前1%的文章，另外一个叫做Hot
    Paper，这个标签代表的是过去两年引用次数排在前千分之一的文章。


    # —— 今日内容小结 ——


    那听完这节课，你能知道什么呢？


    就是科学家是一个独立专业的职业，这个职业的门槛比较高，需要有博士学位，在优质的期刊上发表过论文。


    虽然职业标准会随着年代变化，但趋势是越变越严的，越变越让外行难以冒充。


    这个越来越难、越来越严格的趋势并不特殊，在高度分工的社会中，任何一个能做大做强的行业都具有这个特征。


    比如像物流行业中，如果现在还没有高度自动化的分拣机器，没有强大的数据库跟庞大的客服来支撑的话，只靠聘用大量的快递员，你是没法进入这个行业的。


    所以在现代社会中，一个外行想伪装成哪一行都更加困难了。


    # —— 今日思考题 ——


    在你从事的行业里，职业门槛有哪些呢？尤其是那些国家没有颁发职业资格的行业。


    如果你想到了，请把答案留在评论中。


    # 划重点


    +   1. 没有受过科学训练，不使用严格的科学方法进行科研的人，称为民科。\n2. 现在，一个正经的科学家，至少应该具有博士学位，并在国际公认的学术期刊上发表过论文。\n3.
    科学家是一个门槛比较高的“职业”，发展趋势是“职业标准”越来越严格，外行越来越难以冒充。


    卓克


    我是卓克，咱明天再见。'
