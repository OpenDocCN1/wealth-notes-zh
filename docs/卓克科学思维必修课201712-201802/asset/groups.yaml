    # ——►概念14：流变◄——


    一个事物所表现出来的样子，源于方方面面的积累，在复杂系统里，下一步如何发展，只能是建立在原有的基础上，几乎无法推倒重来。


    # ——►上节思考题解答◄——


    上节课的最后我留的那个问题是，如果从单位质量可以放出多少能量的角度去看锂电池的话，那这个理解角度就跟评价化石燃料的热值很像了。


    树木大约是500万焦耳/公斤，标准煤是3000万，汽油是4300万。锂电池除了必不可少的那些配套设备加一起，大约算是完了是90万焦耳/公斤，也就是说，它大约只有树木的1/6，只有汽油的1/47，这是通过瓦时跟焦耳的转换可以知道的。


    一般来说，在同一类事情中，如果A跟B的效果相差了50倍，像47倍也差不多了。那么A跟B就属于是完全两个阶层的东西了，或者是两个时代的东西。


    # ——►石油终究会用光◄——


    我们说回石油，自从我们广泛使用石油之后，对石油会不会用光的讨论一直存在，最早的讨论甚至是1930年的时候，因为那会儿汽车大量出现了，油价大幅提高。


    # ——►严重的环境问题◄——


    那无论是50年用光，还是永远都不会用光，现在新的问题出现了，那就是碳从固体里跑出来了，以二氧化碳的形式释放到空气中，这种气体对地球的气候影响实在太大了。


    第一种途径，是想方设法地把已经排到空气中...'
