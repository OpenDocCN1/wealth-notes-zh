    # 089 | 问答：晒太阳少，吃点维生素D


    089 | 问答：经常头疼和过... ↓


    在《人类肤色起源》的那节课，我提到了维生素D，这次答疑我就仔细说说。


    它是一种强烈依赖皮肤产生的维生素。具体地产生过程是这样的，皮肤先把胆固醇的结构稍微改变，改变之后的物质就特别容易在一种光线下发生反应，从胆固醇变成维生素D的前体。这个维生素前体跟真正的维生素就好像速冻饺子跟煮好的饺子，那种区别是差不多的，长得都像饺子一样，但是一个是可以吃的，一个不能吃。


    那么刚才说的特定的光线是什么光线呢？就是波长在290到310纳米之间的，这个就属于紫外光。你看，人眼可以看到的范围是400到700纳米，它是300左右，所以距离我们可见的范围并不太远。


    像太阳这种处于中年的质量比较小的恒星，它向四周空间散发能量的时候，这个能量的分布是这样的，一段阳光穿过大气层照到了地表，那所有紫外光只占了全部光能的7%，但是就是这部分紫外光才是合成维生素D
    Separates了，


    通过阳光，大约能产生多少的量呢？


    有专门的研究测量过，比如说夏天中午日照最强烈的时候，一个皮肤白皙的人穿泳装照15分钟的话，可以产生10000到25000个国际单位的维生素D，这个是估算的上限。那如果冬天阳光强度减少了75%，而且还穿上了各种衣服，戴上了帽子，裸露出来的皮肤只有穿泳装时候的1/30，那上面这个数字就得再除以120了，也就是15分钟产生80到200个国际单位的维生素D。


    这就少得太严重了，因为维持一天的维生素D的消耗，最少也需要800个国际单位，那么冬天就需要你在户外在有阳光的地方待上1个小时到2个半小时，这才不会缺，可是这条条件要求太苛刻了。


    维生素D的前体在体温下需要经过10几个小时才会变成真正的维生素D，它们都是临时存在肝脏里，需要的时候拿出来用。这种微量元素对身体的作用非常大，现在已知，对30多种器官上的细胞生长都有影响。统计下来，大约10%的基因表达是不是正常，都跟维生素D够不够有关系，所以真的要在好几种维生素中选一个最重要的出来，那我想维生素D应该是拿第一的。


    如果维生素D缺乏，那就不是对应某一比如几十种器官工作都不太正常。我们最常听老人说的维生素D缺乏就是骨骼发育不好，佝偻病，罗圈腿。其实还有肌肉退化，神经发育不正常，癫痫病，免疫系统,对巨噬细胞量偏少，皮肤细胞更新不足等等，这些疾病全都是维生素D不足造成的。


    那怎么办呢？通过日常的饮食补充吗？


    很可惜，因为日常饮食里很少有食物中维生素D的含量特别高，国际营养学会推荐的成人摄入量是每天400到600个国际单位，70岁以上的中年人因为更容易发生骨质疏松，所以推荐值是1000个单位。


    再看看营养成分非常合理的，我经常说的是鸡蛋，还得是那种比较大的鸡蛋，那一个鸡蛋才包含40个单位，也就是说纯靠吃鸡蛋的话，要满足每天维生素D的需求，需要10到25个鸡蛋才可以，那没有人可以这么吃的。


    植物里就几乎没有什么是维生素D了，猪、牛、羊肉里的维生素D也很少，比例上还不如鸡蛋高。不过如果你一直认真听就会抓住我刚才说的一个重点，就是维生素D合成好之后，都会储存在肝脏中，所以大部分动物的肝脏里的维生素D含量都是提高的，吃2两猪肝、羊肝，那就足够一天的量了。


    那你说我长期靠吃肝来补，可以吗？


    这个可以，但是不好。对于吃动物的内脏来说，如果非要长期吃，最优的选择是什么？就是心脂，因为心脏几乎就是一团肌肉，那最末的选择是什么呢？最不推荐的就是肝脏跟肾脏，也就是俗称的肝和腰子，因为这两个内脏每天都需要过滤大量的血液，把有害的成分分解掉。可是环境污染本身就很严重，动物饲养的时候还有很多添加剂和药加到饲料里，所以大规模饲养的动物中，尤其是那些活得比较久的动物，它们的肝脏和肾脏往往都是有害物大量聚集的地方，只是为了补充维生素D就大量地吃肝得不偿失。


    但是我们观察，很多地方小吃里，内脏都是一个特色，比如像北京的卤煮，还有烧烤店的腰子，这些能少吃尽量少吃，实在不行换成心也可以。


    那是不是就没有什么是食物维生素D含量多了呢？


    其实也有，就是深海的鱼，像鲭鱼，金枪鱼，同质量下的含量都是鸡蛋的10倍。如果你刚刚认真听了维生素D的产生过程，你应该能分析出为什么鱼肉里头维生素D含量高了。


    首先，维生素D是生命的基础物质，人需要它合成骨头、肌肉、神经，需要维护免疫系统，鱼也一样需要的。但是深海的鱼比人更难照射到阳光，所以它们势必有更强的能力来合成维生素D，否则就活不下去了，所以它们的体内存货就特多。吃深海鱼是可以大量补充维生素D的，不过饱嗝就是价格太高了。


    我再举一个现实中的例子，那就是偏头疼。


    我在几年前刚刚开始做内容的时候，就仔细说过这个病，这也是很多文字工作者、科研工作者的困扰，严重的偏头疼在发作之前，在视野中会出现亮线、闪光，然后才会出现视野的缺失，然后会感觉恶心，干呕。


    发作起来之后，从功能性核磁共振看，动态的效果就是硬脑膜上的血管过度充盈的这种情形，是从前到后以大约每分钟几厘米的速度，最终蔓延到整个大脑的。这种血管的过度充盈，就挤压了硬脑膜上的神经，产生了剧烈的头痛。但是这种头疼的事就算去了医院也很出原因。


    我自己曾经也是一个典型的患者，要不我也不会在刚刚开始做内容的时候就说这些。而我自己也是一样，很长时间都找不到原因，但是后来我仔细看过维生素D的产生机制之后，我突然就意识到，我是典型的缺乏者。


    那怎么办呢？去买鱼吗？那太麻烦了，我就直接买了维生素D的补充剂，这个最经济高效，自从吃了之后就再也没有出现过那么剧烈的疼痛了。科学知识给我自己的生活质量带来的很多大幅的提升，这次可以算是非常大的。


    所以各位，如果你符合这样的特征，比如说早出晚归，太阳没出来之前就到单位了，或者太阳落山之后才离开公司，中间回家路上还是在地铁或者车里头，一天很少能够保证胳膊腿都暴露在阳光之下1小时之上，平时是宅男宅女，不愿意出门，愿意出门，但总是等到太阳落山之后，才跟朋友一起去吃晚饭，吃宵夜，或者是作家、程序员，晚上才有灵感，所以晚上工作，白天睡觉。


