    ## 131 | 问答：家鸡是怎么被人类驯化出来的？


    131 | 问答：家鸡是怎么被...


    ### ——概念12：旁证——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    回答一些有意思的问题，moonmyth 是咱们档的老用户，每天内容下面前15个留言一定有他的，最近他在很早之前说鸡蛋可以做流感疫苗的内容下留了一个问题，看来是回顾的时候想到的。


    鸡蛋实在太有用了，很想知道人类驯化鸡的过程，怎么就找到这么优良而又高产的蛋白质来源了呢？


    仔细回答是这样的：


    家鸡的野生祖先来自两种原鸡，大部分基因是从一种叫红原鸡那里取得的，少部分基因从灰原鸡那里得到的，比如鸡现在黄色的脚就是灰原鸡中得到的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_107_0.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_107_1.png)


    它们长得都有点像硬硕版的，更加色彩缤纷版的公鸡。这两种鸡主要生活在热带森林，是杂食，成群活动，而且飞行能力还很强，晚上在树上睡觉。


    这么一种鸡鸡类的鸟类是什么时候被驯化的呢？


    从考古的证据中可以发现，它们在8000年前就已经经常出现在印度跟东南亚的人类居住地了，在基因技术诞生之后，我们测序了很多不同动物的基因，在2004年，国际鸡基因组测序协会完整地测到了原鸡的序列，之后雏科类的鸟类不少都做了测序，也包含了家鸡。


    在2010年，人们分析出家鸡跟原鸡有一个非常显著区别的基因突变，叫做促甲状腺激素受体，这个蛋白质对应的基因在家鸡跟原鸡上有着巨大的差异，甚至可以作为原鸡被驯化成家鸡的标志。


    因为这个基因变化之后，原鸡就不是季节性的交配了，而是什么时候都可以。也因为这个基因的变化，母鸡全年都可以下蛋。一种鸟一旦可以整年下蛋，它一定是会被圈养起来的，这可比杀掉它，吃它的肉划算得多。从基因树上看，这个基因突变发生在58000年前，所以很可能早在人类出现文字之前5万年原鸡就被驯化成家鸡了。


    除了这个基因之外，还有一个基因 TBC1D1 也发生了突变，它是影响胰岛素信号通路的一种蛋白质，变异之后对糖的吸收率有提高。


    通俗来说，就是一种容易让它长胖的基因。


    这个基因在有胰岛素的动物体内都有，包括家养的其他用来吃的猪、牛、羊，这个基因的突变应该是鸡被驯化之后逐渐筛选出那些容易长胖的个体得到的。


    ### ——鸡蛋争夺战——


    自从鸡被驯化之后，大多数的时候都是用它产蛋，那时候农村为了让母鸡多下蛋，会用很多方法骗它。


    比如它不是下一个蛋就开始孵，而是一窝凑够了5、6只蛋以后，你如果再不干涉它的話，它就开始一起孵。20多天之后就能有很多小鸡出生来。但是在这20多天之内，它可是一个蛋都不下的。


    为了让它总下蛋，人们可以在母鸡下了蛋“咯咯咯”叫的时候，拿一把米出去，引诱母鸡到院子里吃米，然后趁其不备去窝里偷偷拿走几个蛋，但是你不能拿光，总得让窝里保持有一两个，这祥等母鸡回来之后它才会发现，还差3、4个蛋才能开始孵呢，于是又努力下蛋，这样蛋就每天每天一直有。


    有的时候，也可以把蛋都拿走，然后放进两个颜色跟形状都差不多的鹅卵石，母鸡也会把它当蛋孵，这算是一种骗母鸡的规矩。


    人是不能当着鸡的面从它窝里拿走蛋的，尤其是Cond public...


    ### ——一种聪明的鸟——


    后来科学研究发现，鸡是一种智力水平比较高的鸟，说它们是像鸟有点冤枉它们。


    比如现在发现，鸡有时间观念和自控力。


    这实验是这么做的：


    鸡会看到一个触摸屏，只要它触摸到了，屏幕就出现一个鲜明的画面提醒，同时秒表开始计时。如果它能等待6分钟以上，第二次啄那个触摸屏，就能获得食物奖励，几次实验之后，鸡就逐渐明白了这个规律，之后就能发现它确实有意识地等很久才会第二次啄触摸屏。最后的统计是，它从第一次啄了屏幕之后，等待超过6分钟以上再第二次啄屏幕的行为是越来越频繁了。


    所以你看，它对6分钟这个时间是有观念的。


    架，分出输赢，另一只旁观。等前两只打完了分出胜负，就看这只旁观的鸡它怎么选择，就发现它肯定去选那个刚刚战败的鸡去过招，因为它可能知道自己这一仗胜算的比例比打另外一只更大。


    你看，这种对胜负关系跟等级高低的判断，它是不是一种逻辑分析能力呢？


    现在全世界数量最大的脊椎类动物就是鸡，大约有200亿只，比全球人口还多了2倍。虽然数量这么庞大，但是非常可惜，它们现在99%都生活在大型 的养鸡场里，关在只有一个身位的笼子里，一辈子都在下蛋，甚至都还没来得及回头看一眼自己下的蛋是什么样，这些蛋就被流水线给运走了。


    我刚刚说的人跟鸡的斗智斗勇，还保留的原始天性，这些鸡都不具备了。也许科技发展到一定程度，我们可以通过人造方式产出各种低成本的蛋白质，到那个时候，猪、牛、羊、鸡的命运就有机会改变了。


    好，关于鸡是怎么驯化来的，这个问题就回答到这里。


    ## 划重点


    - 1. 家鸡的野生祖先来自两种原鸡，大部分基因是从一种叫红原鸡那里取得的，少部分基因从灰原鸡那里得到的，比如家鸡现在黄色的脚就是灰原鸡中得到的。

    - 2. 鸡是一种智力水平比较高的鸟，它们有时间观念和自控力，也有一些逻辑判断能力。


    卓克


    我是卓克，咱们明天再见！


