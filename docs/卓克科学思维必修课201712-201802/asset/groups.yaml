    这周我留了一个稍微复杂一些的问题，都说猩猩跟人在基因上高度类似，有99%都类似，这个真假对很多人是拿不准的。


    但是如果你细心的话就会发现，往往还有这样的后续内容，就是说猩猩跟人基因的相似度是90%，实验中小老鼠的基因跟人类相似度都有80%。


    好，确实，猪比小老鼠更像人一些，所以相似度一个是90%，一个是80%。我们也默认这个是的，矛盾并没有出现。


    但是我们还能见到有一些介绍遗传病的科普里是这么说的：


    异卵双胞胎拥有50%相同的基因，因为兄弟间每个人都各自从父母那里取得了一半的染色体，相当于两个人各做了46次二选一，所以最终总体上看来，大约有50%是相同的。


