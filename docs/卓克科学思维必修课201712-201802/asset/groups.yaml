    +   1. 处于这个时代科学圈边界的理论，处于有待突破、找到新证据的理论，都有可能被扣上一顶“伪科学”的帽子。 2. 生活中那些围绕着疾病和死亡展开的内容，而且还在制造恐慌和焦虑的，往往就是伪科学。
    3. 伪科学在声称自己是科学的方式上，往往通过名人、名言来背书，而不是在有美誉度的学术期刊上发表论文。 4. 越是惊世骇俗的言论，就越是需要坚实可靠的证据。


