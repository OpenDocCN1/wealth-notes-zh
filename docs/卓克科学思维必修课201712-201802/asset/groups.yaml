    \n![](img/8bedc5a33d556c033f724cd3fbb47d99_172_1.png)\n\n卓克\n\n我是卓克，明天我们开始进入第二十六周的课程，明天见。\n\
    \n## 151 | 边界：为什么没有绿色的恒星？\n\n151 | 边界：为什么没有绿...\n\n### ——► 概念13：边界 ◄——\n\n人类观察世界的边界，是由所能使用到的最好的工具决定的，面对任何问题，只有尽可能多找一些可验证的细节，不过度地理解，不过度地解读，才可能了解真相。\n\
    \n为什么没有绿色的恒星？这个问题怎么回答呢？\n\n首先我们得意识到这个问题本身就包含了 一个预设的前提，就是没有绿颜色的恒星，如果这个前提是对的，才值得我们寻\
    \ 找它的原因。\n\n那这个前提对不对呢？\n\n它确实是对的。\n\n### ——► 没有绿色的恒星 ◄——\n\n有这么一张图可以说明，叫做赫罗图，全称就是赫茨普隆-罗素图。这两位，一个是丹麦天文学家，一个是美国天文学家，他们独立地发现了恒星光谱和光度之间的关系，在之后的100年里不断地有科学家把测到的恒星填在这个表格里，就更加印证了赫罗图的规律。\n\
    \n刚刚那句话有一点专业，那什么叫做恒星的光谱和光度呢？\n\n为了大家能听懂，不很严谨地说，就是赫罗图研究了恒星的颜色和亮度的关系。\n\n![](img/8bedc5a33d556c033f724cd3fbb47d99_174_0.png)\n\
    \n![](img/8bedc5a33d556c033f724cd3fbb47d99_174_1.png)\n\n上面两张赫罗图，一张是示意图，一张是真实测到的。\n\
    \n真实测到的图把上百颗有名有姓的恒星按照光谱跟光度的关系标注在图中，可以看到图表中从左上角到右下角有一道银河一样 的带状物，这条带状物上布满了各种恒星，其实我们目前发现的大约90%的恒星都处于这条带子上。\n\
    \n你可以简单理解成凡是处于这条带上的恒星，它一生的命运都是按部就班的，从诞生到壮年，整个过程不论是几万年还是几十亿年，对我们来说规律都不陌生，我们的太阳也在这条带中。\n\
    \n这条带的上方出现了一大堆红色的恒星，它们叫红巨星，凡是从壮年往衰老发展的恒星都在这里。如果继续变化，从衰老走向死亡，那就就要跃到这条带的下方了，就是发白发蓝的白矮星。\n\
    \n就是这张赫罗图，让我们确认确实没有绿色 的恒星，所有恒星都是红色、黄色、白 色、蓝色的。\n\n### ——► 恒星是理想的黑体 ◄——\n\n但为什么会这样呢？\n\
    \n这背后的原因如果用一句话解释，就是恒星在发光的时候，尤其是那些发白光、发蓝光的恒星，它们一样也在发射着绿光，只不过绿色光是淹没在各种其它颜色的光里了，我们看到的总是混合的光线，这种混合光看上去都是白发发蓝的，所以才没有绿色的恒星。\n\
    \n这个解释貌似是很好理解，但是更深层的道理是，每个恒星都是一个理想的黑体。\n\n你说那么耀眼的光芒还能是黑体吗？黑体应该 是黑的吧？\n\n这就是因为语言文字中出现的黑体两个字，跟物理意义中的黑体不是一样的东西，物理中的黑体指的是：\n\
    \n+ 对任何射向它的电磁波都能完全吸收，不产生任何反射的东西，也就是把任何射过来的电磁波都转化成自身热能的一个物体，这样的物体就叫做黑体。\n\n这种特征一说出来，最容易让人想到的就是黑洞，因为你想，连光线都跑不出去黑洞了，当然不会有什么反射了。\n\
    \n它吸收了所有外来的电磁波，凭借的是什么呢？\n\n就是它巨大的质量。\n\n那恒星凭什么也是黑体呢？恒星凭什么让射来的电磁波没有反射呢？\n\n它凭借的就是体内巨量的气体。\n\
    \n就以太阳为例，它的核心在发生着大规模的核聚变，如果追问细节，那就是在1/4半径以内的这个球体发生着核聚变，这之外因为温度压强不足，就没有核聚变发生了。\n\
    \n核聚变的时候会射出光子，从这些光子中我们甚至可以解读出内部发生的核聚变是怎样的过程。但是这些光子并不是顺利地射向宇宙空间里，而是一步一个坎儿，这个坎儿还特别的密，特别的多，平均来说是每走1微米就会被其它的气体原子吸收，跟那个气体原子中的电子纠缠一番之后又被释放出来。\n\
    \n这种1微米一个坎儿的艰难旅途持续了多长呢？\n\n整个行程是52万公里，中间大约需要耗费20万年，光才能从太阳的核心抵达太阳的表面。从核聚变的核 心射出的光至少经历了5000多亿次的转变，每次转变都是把它转化成热。\n\
    \n所以最终我们从外部看到的太阳，它放出的光几乎只体现了它温度的属性，已经看不到核心处的核聚变的信息了。\n\n正是黑体这个假设一下把不同物体之间的差异抹平了，我们根本不用操心物体是什么材料做的，反正一切可供观测的电磁波都不会回馈给我们。\n\
    \n### ——► 量子力学诞生 ◄——\n\n但是黑体还是有一个特征是可以观测到的，就是因为它具有一定的温度，所以虽然它不会反射电磁波，但是它会根据自己的温度向外发射电磁波。\n\
    \n发出的电磁波是什么呢？\n\n就是多种颜色的光混合。\n\n当然，为了理解，我特意说成是光，实际上有相当一部分光因为频率太低或者频率太高，人眼是根本看不到的。如果要定量地描述一个黑体放出的光在不同颜色下分别有多强，这种描述光强的分布就叫做光谱。\n\
    \n光谱可以把它简单理解成一种混合颜料的配比，就像太阳这样的恒星，它表面是5900多摄氏度，那对应的颜料可能就是30%的蓝、15%的绿、10%的黄、5%的红等等等等。\n\
    \n离我们最近的比邻星就不是这种配比了，它可能是黄色要多一点，绿色要少一点，温度就是这样跟光谱扯上关系的。\n\n这个对应关系从一八九几年开始就有人研究了，当时研究它是为了生产出更好的灯泡，灯泡在那个年代几乎是唯一的家用电\
    \ 器，电费在那个时候也是高得离谱，只有最富的家庭才用得起电灯泡。所以，如果谁能提高灯泡的发光效率，那更省电的灯泡就是超级大的卖点。虽然灯泡不是理想的黑体，但是它还是比较接近了。\n\
    \n1893年，维恩对光谱和温度的规律提出了一个经验公式，用它来预测温度比较低的物体放出的光谱比较准。\n\n1900年，瑞利跟金斯秀出了另外一个公式，用它预测温度比较高的物体放出的光谱比较准，但是不能混用。\n\
    \n1901年的时候，普朗克只是通过一些数学技巧把这两个公式糅合在一起，写出了普朗克公式，效果却出奇的好，跟实测的情况高度吻合。\n\n普朗克公式成立的前提条件有一个就是粒子携带的能量总有一个最低值，能量的增减最小台阶都是这个最低值。于是，就在这个洞见的基础上，量子力学诞生了。\n\
    \n### ——◆ 今日内容小结 ◆——\n\n当我们重新回头看那个问题，为什么没有绿色的恒星，完整的答案应该是什么呢？\n\n听完上面的内容，它应该至少回答出3个层级：\n\
    \n+ 第一个层级：恒星可以看作是一个黑体，它只通过温度向外散发它的电磁辐射。\n+ 第二个层级：某一种温度的黑体对应的电磁波是一个光谱，俗话说就是一组各色光的混合。恒星的光谱有的时候是包含绿色的，但只不过因为还混合了其它的颜色被盖住了，所以眼睛看不到绿色的恒星。\n\
    + 第三个层级：恒星是什么颜色，可以用普朗克公式精确地描述，而普朗克公式最精髓的洞见就是能量变化有最小的台阶，但并不是连续的。\n\n大部分人对量子力学是没有任何了解的，这确实也不是作为现代人必须要懂的知识细节。但是我们至少要知道，整个半导体工业，也就是我们手机电脑里的处理器，全都是基于这个学科的基础知识。\n\
    \n### ——◆ 今日思考题 ◆——\n\n之所以挑这个问题来回答，就是想说，有些看似简单的问题，背后的答案它触碰到的是整个世界的框架是什么样的，这样深邃的内容。\n\
    \n比如今天我们问到的恒星为什么没有绿色的，它背后触及到的是，恒星是黑体，能量是量子化的。类似的问题还有为什么夜空是黑色的，那背后的答案是宇宙在膨胀。\n\n\
    表面上看过去，这两个问题只不过是问了问颜色为什么是这样，为什么不是这样。但相比其它问颜色的问题，比如说白天的天空为什么是蓝色的呢？可能回答就没有这么深邃了。\n\
    \n这样问出来是平淡无奇的，但背后却包含着深邃道理的问题，你在生活中遇到过吗？\n\n如果想到了，就留在评论中。\n\n## 划重点\n\n+ 1. 恒星在发光的时候，尤其是那些发白光、发蓝光的恒星，一样也在发射着绿光，只不过绿色光被淹没在各种其它颜色的光里了。\n\
    + 2. 有些看似简单的问题，背后的答案触碰到的是整个世界的框架是什么样的，这样深邃的内容。\n\n卓克\n\n我是卓克，咱们明天再见。\n\n## 152\
    \ | 边界：人会疼死吗？\n\n152 | 边界：人会疼死吗？\n\n### ——概念13：边界——\n\n人类观察世界的边界，是由所能使用到的最好的工具决定的，面对任何问题，只有尽可能多找一些可验证的细节，不过度地理解，不过度地解读，才可能了解真相。\n\
    \n牙疼、急性阑尾炎、带状疱疹、骨折、分娩痛，这些都是人一辈子能够遇到的最疼的事了。\n\n我也经常听人说“疼死了”，就像这节课的标题，那么真的能疼死人吗？\n\
    \n答案是，可以的。\n\n但那是一种极端的长时间的疼痛，它会导致神经性休克，这种休克状态发生之后，如果一直得不到改善，就有可能因为心脏、大脑缺血而死亡。所以，极端剧烈的疼痛虽然不会直接导致死亡，但是如果没有及时终止的话，会间接导致死亡的。\n\
    \n所以说，还是会疼死人。\n\n### ——疼痛的定义——\n\n我们先说说疼痛是怎么感觉到的，才能知道神经性休克是怎么出现的。\n\n比如当我们切菜的时候，不小心切到了手指头，当然切得不严重，就是那种创可贴裹一下，几天之后就能好利索的那种伤口。\n\
    \n除了出血，你会马上感觉到疼痛，而且疼痛是在不断变化的：\n\n+ 最开始会立刻感觉到尖锐的疼痛；\n几秒钟之后，疼痛就没有那么剧烈了，稍微缓和了一些，但是它是持续的；\n\
    等你把伤口冲洗干净，再用创可贴贴好了之后，一般3分钟已经过去了，这个时候疼痛就已经很微弱了。\n\n这个过程在每个人的身上都发生，每次的进度大概也都是这样的规律，不论是磕到了头，还是咬到了舌头。\n\
    \n但你发现没有，想准确地描述疼痛到底有多疼，还是一个挺难的事，以至于到现在，疼痛研究国际协会对疼痛的定义还是：\n\n与实际或潜在的组织损伤相关联的不愉快的感受跟情感体验。\n\
    \n这就是疼痛的定义。\n\n### ——疼痛的传递——\n\n![](img/8bedc5a33d556c033f724cd3fbb47d99_177_0.png)\n\
    \n### ——疼痛导致的休克——\n\n再醒过来。\n\n但有的时候，剧烈的疼痛或者受伤出血比较多，会让休克的人在血往哪流、血该不该凝固这些基本问题上乱成一锅粥，时间拖长了，一个长时间剧烈的疼痛导致的休克就有可能让人再也醒不过来，这就是人会疼死的原因。\n\
    \n### —— 今日内容小结 ——\n\n那知道了这些科学知识，对我们有什么用呢？\n\n这个用处可大了。\n\n我们刚刚说过，在疼痛这个问题上，信号进入脑皮层之后，具体的处理细节我们就很难研究了，这涉及到很多高级复杂的思维活动。\n\
    \n但也正是因为有了这个特性，也能让我们知道一个伤口会让你有多疼，可不是一个客观的不变量，在一定程度上说，你认为它疼它就会更疼，你的注意力不在伤口上，也许晚上洗澡的时候你才发现，手指头上怎么破了一个口子呀。\n\
    \n知道了这些，再受伤的时候，你就有可能不那么疼了。\n\n你可能会说，我受的不是物理损伤，是我的心受伤了，我的心都碎了，这种伤痛是你这种科学思考习惯没法抚平的。\n\
    \n其实这种观点也不一定，抚平不敢说，但是减轻还是可以做到的。因为说到底，疼痛是一种不愉快的感觉跟情感体验，所以情感伤害中的那些伤痛，还说不定真有疼痛的成分。情感上遭到重挫，一样可以休克过去，但这种高级的思维活动一样可以在注意力转移，或者有更加美好的自我暗示之下，把感受到的痛苦体验弱化一些。\n\
    \n听完今天这节课，我们不但能增加一些物理防御，也能让情感更加强壮。\n\n### —— 今日思考题 ——\n\n你觉得人能不能笑死呢？\n\n如果你想到了，就留在评论中。\n\
    \n## 划重点\n\n+ 1. 疼痛属于情感体验，它并不一定是客观的神经刺激，即便没有发生实际损伤也可能产生疼痛，这也就预示着它很难准确测量。 2. 极端剧烈的疼痛虽然不会直接导致死亡，但是如果没有及时终止的话，会间接导致死亡的。\n\
    \n卓克\n\n我是卓克，咱们明天再见。\n\n## 153 | 边界：从科学角度理解情感\n\n### ——►概念13：边界◄——\n\n人类观察世界的边界，是由所能使用到的最好的工具决定的，面对任何问题，只有尽可能多找一些可验证的细节，不过度地理解，不过度地解读，才可能了解真相。\n\
    \n### ——►上节思考题解答◄——\n\n上节课我留的那个问题是，人真的能笑死吗？\n\n如果那节课你听懂了就知道，真的是有可能的，持续地刺激情绪表达，停不下来就会影响到控制心跳、血压、呼吸的植物性神经。同样，伤心死了，吓死了也都会真实地发生。\n\
    \n### ——►没有痛觉的孩子◄——\n\n在医学记录中，世界上曾经出现过100多个没有痛觉的孩子，他们大都沒有成年就夭折了，这些患者大部分身体功能都正常，冷暖也可以感知，但就是不知道疼。\n\
    \n### ——►人出生前就会晕厥◄——\n\n那疼得昏过去，或者吓昏过去，气晕过去有没有必要呢？这是否是作为人类，拥有一种高级的情感体验才出现的昏死过去的情况呢？\n\
    \n### ——►晕倒是一种技能◄——\n\n其实昏过去的这种模式，在很多动物身体上也有。\n\n### ——►今日内容小结◄——\n\n这周连续几节课，我们讲的内容都是同一个科学思考，就是那些看上去应该是归于纯粹思维活动，或者是那些好像应该只有人类这种高级智能生物才会有的情感体验，它们背后都是有实实在在的生物基础的。\n\
    \n个恐怖的记忆遗传了下来那样。\n\n高强度持续的神经刺激导致的植物神经紊乱，血都流出了心脏跟大脑之后导致的休克，旁观者的解读可能就是伤心欲绝，或者哀大莫过于心死，这些带着文化的理解。\n\
    \n我们的记忆，我们对事物的判断，我们的喜怒忧思悲恐惊，是不是也能看作为多种激素、神经传导、信号处理、蛋白质参与调控的一个综合在一起的电学过程，化学过程，催化过程呢？\n\
    \n而我们一直以来，一直习惯用文化角度去理解这些情绪表达，这些高级的思维活动，它们是不是也能解释成是这些化学现象、电现象的一种外部特征的抽象呢？\n\n我偶尔会看到有些人把这样看问题的方式说成是机械论或者是唯科学主义，其实并不是，机械论或者唯科学主义的典型特征，是排斥或者拒绝接受除了科学角度以外的其它所有的解释，甚至对所有东西的变化都要套用公式。\n\
    \n而我们科学思维，是在原有的文化理解上增加一个维度，这个维度提供了更多实物证据上的落脚点，把这些内容跟我们从前情感的体验相印证，可以对我是谁，我从哪来，我要到哪去有更丰富的回答。\n\
    \n### ——◆ 今日思考题 ◆——\n\n你能不能举出一些例子，它表面上看上去是一种情感的释放和表达，但其实背后的主导是一些具体的生理过程？\n\n如果你想到了，就留在评论中。\n\
    \n## 划重点\n\n+ 1. 持续地刺激的情绪表达，停不下来就会影响到控制心跳、血压、呼吸的植物性神经，大笑、伤心、惊吓都可能造成死亡。 \n2. 昏倒在统计规律上是一种更有可能让物种活下来的策略，因为可以帮助躲过捕猎者。\
    \ \n3. 从科学角度理解情感，不是唯科学主义，而是在文化的基础上增加一个维度，寻找更多实物证据，得到更准确的解答，更为理解情感。\n\n卓克\n\n我是卓克，咱们明天再见。\n"
