    # 091 | 起源：人类祖先曾经经历过极端气候？（下）


    # ——◆ 概念10: 起源 ◆——


    种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看出生命的诞生，一样可以体会物种的灭绝。


    上节课留下的问题是，为什么科学界这么重视这次地球冰冻的事件呢？


    原因有两个：


    第一个，就是它发生的时间点与太多学科有结合点了，你想1万年前出头，这个年代地球上还有其他的人种呢，那这之后是不是在dn了呢？那他们的灭绝是不是因为这次事件呢？所以你看考古学家、生物学家、人人类学家都涌出来了。这之后人类文明又开始出现了很多连今天都能见到的活动，比如像定居、耕种、飞缎、绳子、历法、酒，这些活动都是在那个年代之后广泛出现的。这一下又跨越到文化和历史当中了，所以又能吸引一批不同领域的学者。


    第二个，就是这次的冻结和降温的剧烈程度太厉害了，虽然温度统计上也能看出  来，8200多年前或者6300多年前也出现过明显的降温，但是程度都远不及这次，所以1万年前出头的这次新仙女木事件自然而然受到特别强烈的关注。


    # ——◆ 格陵兰冰盖计划 ◆——


    当时启动的一个计划叫格陵兰冰盖计划，就是从格陵兰取冰芯。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_6_0.png)


    我从这个计划的官网找到了一些图，你可以感受一下用这种方法把几千年前的天气研究到多么细致的地步了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_6_1.png)


    上面这张图是一个冰柱的其中一段，我用红色框出来的那部分是1870米深的其中一小段冰芯，框出来的那些是有明显灰尘的，其实那就是几千年前冰岛火山喷发，在冰芯上留下的痕迹。


    除了那几年火山灰的影响，你还可以明显地从这段冰芯上，这个密密麻麻的竖条上看出来，其实每一个小条都是 一年，这一年里的冰芯除了有气体，还会有花粉，还会有灰尘，所以这一小段冰芯简直就是那些年里自然环境的目录和简史了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_6_2.png)


    但是这个计划很快就没钱了，下一次挖掘就要等到上世纪80年代末了，那次是美国和欧洲的科学家联合花了5年的时间，挖得特别深，挖出了两段3000多米深的冰芯。当当然这个冰柱可以信赖的时间跨度不是无限长的，比如说南极的冰盖它是3000万年前形成的，南极的冰盖厚度是4000多米深，但是冰层有时候到了最底下的时候会因为压力产生切向的滑动，就会导致年岁的错位了。所以这冰柱现在最长的可信年岁大约是在13万到15万年左右。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_6_3.png)


    我也找了一些最近几年在南极挖冰芯的开挖的场景，大家可以感受一下这些科学家的执着。


    # ——◆ 新仙女木事件起因 ◆——


    这次剧烈的灾难为什么发生呢？


    现在有两种说法：


    第一种，叫做温盐环流理论。


    说的就是在灾难之前，不是曾经有过一阵子全球变暖嘛，就是这段变暖破坏了维系已久的海洋环流。曾经北大西洋的海水因为温度低，所以浓度比较高，它就会沉到海底，在海底有一个巨大的流动的趋势，它趋向于往赤道附近扩散。那么海底有这个方向的流动，海面就有一个反方向的补充的趋势，所以就会把温暖的赤道的海水补充到北大西洋去。


    从另一个角度看，这就相当于用大量的海水把赤道温暖的热量送到极地附近，但因为全球变暖的趋势，让北大西洋的海水盐分没有那么高了，于是从海底流向赤道的这个趋势逐渐就弱下来了，底下不流了，赤道表层的水也就不再补充过去了。所以赤道洋流不再流到其他地方去，热量就过不去了。所以别看全球是在变暖的趋势，极地反而是更冷的，这个是一种假说，现在也
    没法证实。


    第二种，是假设一颗彗星撞击到北美大陆，导致冰川融化，消失之后影响了环流，然后环流的理论和刚才还是一样的。


