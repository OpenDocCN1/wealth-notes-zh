    # 099 | 起源：物种大灭绝中的科学思维


    # ——► 概念10：起源 ◄——


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    如果要说动物保护的话题，关注度都是非常低的，因为连科普杂志都知道，“动物保护”这关键词一出，这期准卖不好。但是最近两天，我要重说说“保护生物多样性”这个话题，因为它关我如何看待生存价值这个问题。


    我们先来说一个典型的误区，那就是有人认为保护生物多样性跟保护动物，那不是一样的吗？


    有这种观点的人，大多数都把人跟自然分开了，所以他们会对动物怀有一种人文主义的关怀，认为鸟被猫吃了，猫就残忍；人和狗有亲密的情感，所以不要吃狗肉。可是自然界，随时都发生着你吃我，我吃你的事儿，从微生物到大型的哺乳类动物都有，这种情感因素加入之后，动物保护行为最后大都是对资源的浪费，其实也保护不了动物，顶多是喂饱了不少流浪的宠物。


    而我们这两天要说的是保护生物多样性的意义和价值在呢儿？


    我们作为一种现在占据绝对优势的物种，也是自然界的一部分，自然界曾经在多样性上出现的规律一样也会发生在我们身上的。


    现在，我们从大灭绝开始讲起。


    考古学家对地球上曾经出现过的物种做过一个大致的估计，就是曾经有40亿个物种在不同阶段生活在地球上，但是现在99%都灭绝了。


    当然，这种估计只能当作定性的参考，不能用定量的要求去卡它，因为谁也没有见过几亿年前的情景。而且这个结论的证据也只是从化石中来的，大家知道，化石保留的都是曾经比较结实的部分，比如说它有一个硬硬的外壳，或者有大块大块的骨头，这就容易留下来。可是大量的昆虫、植物、软体动物，还有那些占据物种绝多数的微生物，它们根本没有机会在化石上留下痕迹，所以我们从化石上得到的结论一定只是冰山一角。


    可是，我们现在也没有除了化石之外更可靠的素材，所以暂且用定性的程度去参考这些结论就可以了，不能去较真儿。


    化石证据上还有这么一个规律，就是凡是5.5亿年之前的生物化石就非常少了，这个也可能是因为留下的化石非常少，当然也有可能就是因为历史上5.5亿年之前生物密度确非常低，所以科学家对大灭绝事件的研究也集中在5.5亿年之内。


    # ——► 什么是灭绝？ ◄——


    如果你习惯科学思维，你就会问，灭绝是什么意思？如果你刚刚在心里问过，就说明科学思维已经逐渐在你心中培养起来了。


    我说一下灭绝，灭绝是通过统计化石中物种的数量减少的剧烈程度来判断的，比如有一些时期里，化石中出现的物种的数量比前一个时期化石里物种的数量减少非常多，那就说明灭绝发生了，灭绝发生了。


    如果全球范围的化石一统计，原来都在同一时期里物种的数量减少了75%以上，那就可以把这个时期定义为大灭绝。而且这个时期还不能特别长，比如说2亿年的时间里减少了这么多，这不能算数，必须得是比较短的时间迅速的灭绝。比较短是多短呢？就是一两百万年之间突然减少，这就算比较短的时间的灭绝。


    如果按照这个标准，地球最近5.5亿年，生命史上共发生了5次大灭绝：


    +   1. 4.4亿年前死了86%的物种；

    2. 3.6亿年前死了75%的物种；

    3. 2.5亿年前死了96%的物种；

    4. 2亿年前死了80%的物种；

    5. 6500万年前死了76%的物种。


    而我们最最熟悉的就是6500万年前那一次，因为恐龙这种最吸引人的物种灭绝了，而且还是在小行星撞击地球下灭绝的。这个在动画片，电影里描写得特别多。但实际上，那次只有76%的物种灭绝了，远远比不上之前我说的二叠纪和三叠纪之间那次更迭96%的灭绝，差一点地球的生命就重新来过了。


    # ——► 第6次大灭绝 ◄——


    我之前也提过几次，第6次大灭绝，也就是人类出现后造成了生物灭绝，有科学家认为这次都堪比二叠纪和三叠纪那次。当然，也有科学家认为，这种说法是危言耸听。


    那到底有多严重呢？咱只能参考那些可依据的部分。


    加州大学伯克利分校的科学家在2009年统计出一个结果，我觉得值得参考，这篇研究最终发表在2011年3月份的《自然》上。说它值得参考，是因为它并没有去碰那些数据上头可能会非常大的化石。


    最后得出的结论就是：最近500年里，一共有80种哺乳类动物灭绝了。可是对比历史上，除去这最近的500年，在过去的6500万年里，平均每1000万年灭绝17个哺乳类动物，所以两个数据一对比，也就是自打人类出现之后，哺乳类动物的灭绝速率增加了9.4万倍。


    动物为什么会灭绝？我们脑子里最先出现的一定是那种捕猎的场景，实际上更多的是来自于资源竞争导致的饥饿，饿死了，或者是引入了新的微生物，病死了。或者是我之前说的，人类活动引发了气候剧变，导致很多生物不适应。


    那么，这个速率不能称之为第6次物种大灭绝已经开启了呢？


    在这篇研究中还是挺乐观的，它觉得现在地球上仍然剩下了足够多的物种，但是它也提示了，如果现在列在联合国国际自然保护联盟中濒危动物列表里那些极危、濒危、易危，这3个档次的物种，如果在今后1000年里全部灭亡的话，那就可以肯定，第6次物种大灭绝开启了。


    它说的是什么意思呢？


    联合国国际自然保护联盟有这么一个濒危物种的名录，这个是从1963年就开始编写的，总是不断地更新内容，起码到现在为止是全世界动植物，真菌保护情况最全面、最权威的统计。现在目录里一共有9万多个物种，按照濒危的程度分成了6个级别，最严重的是灭绝，然后是野外灭绝、极危、濒危、易危、近危，最后还有3个等级是物种没有受到威胁的，分别是没有危险、数据缺乏和不评估。


    这其中刚才它说的，说这1000年中，假如极危、濒危、易危，这3个等级全部灭绝的话，第6次大灭绝就开启了。


    这3个等级占了多少呢？


    大概占了这个名录中20%的物种数量，自然保护联盟对这个目录也有一个解释，说它最多只统计到了地球上5%的物种。假如说没有统计的那些物种在濒临灭绝的程度上分布也跟这个列表里是差不多的，那么我们最低的底线就是1000年内如果消失了1/5以上的物种，第6次大灭绝就是板上钉钉的事了。


