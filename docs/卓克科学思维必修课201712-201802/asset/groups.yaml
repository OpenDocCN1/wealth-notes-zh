    ### 097 | 起源：海洋越来越酸，... ↓


    ### ——◈ 概念10: 起源 ◈——


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    ### ——◈ 海洋变酸的真相 ◈——


    上节课我们说到海洋中的珊瑚礁大面积变白，那它们为什么会这样呢？其实根源就是一个，二氧化碳的排放增加了，而且还是增加太多多导致的。


    你还记得前几节课我说的关于冰芯挖掘然后研究的那一个例子吗？挖那个就是为了找到地球过去大气的状态，我找到一张最近40万年以来二氧化碳在大气中含量的变化图。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_19_0.png)


    这是一条起起伏伏的线，大部分的时候都是低于250ppm的。曾经在32000年前达到过300ppm，但最近200年来直线飙升，2016年的值是403ppm。其实这张图表是为了展现起来比较协调，实际上在可测的最近300万年里，地球上的二氧化碳含量从来没有今天这么高，而且从现在的煤炭、原油的储量来看，如果把它们再开采出来燃烧掉，大气中的二氧化碳最终会达到1500ppm。


    ### ——◈ 验证因果关系 ◈——


    上节课我们讲了一种科学方法，就是你要想说明一个因素的影响的时候，要用好对比，也要用好全局的展现。通俗地说就是这个因素改动了，我们就会看到完全不同的景象，而且还是全世界范围内的。把这个方法掌握了，这样显现出来以后就告诉人一个道理，就是这个因素最好不要这么动，否则影响太大了。


    但你发现没有，这里用到的只是相关关系，就是一个因素出现了，一个结果发生了而已，它并不能证明有什么因果关系。

    但是我们的科学家这么费劲地申请科研经费，然后专门跑到格陵兰去，挖出几十万年前的冰芯，分析里面的气泡，他们可不是只为做一个数字游戏。他们是确实严重怀疑二氧化碳的增加，跟生物的白化、贝壳的软化是有因果关系的，他们怀疑这一点了。


    它究竟有没有因果关系呢？

    其实这个道理化学上就说得通，而且也可以用实验来做，我们先来说说化学上的道理。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_19_1.png)


    你可以看到，上图在左上角，第一个是刚放进去的时候，之后每隔8天拍照一次，到了第45天，外面的串壳已经基本上溶解掉了，所以海水的pH值如果真的从8.06降到7.8，那时候就不要说珊瑚礁了，很多带壳的动物都要遭殃的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_19_2.png)


    结果在pH值等于7.8的水域里，那些从前适应性特别强的，世界各地海水中都能看到的，海边石头上的，船底的，甚至鲸鱼的皮肤上都有的某种贝类，叫赭藤壶，还有地中海鲍贝、方舟贝都没有出现。但是这儿也不是完全的死亡地带，这里还有生物，统计下来在pH值等于7.8的水域中，这里生存的生物种类是正常水域中的1/3。


    ### ——◈ 问题的严峻性 ◈——


    可能有人觉得不用担心，到时候动物会自然演化出更加坚硬的外壳，这个是不可能的。因为科学家们预测，如果按照现在碳排放增加的速度，在2100年的時候，海水的pH值就会达到7.8，可是现在距离这个年份只差80多年了。


    它们想变更一个特别大的特征，咱们就按1000代来算，也需要3到5千年才能来得及演化出这些抗拒的特性来。但是现在只有80年，顶多只能更新三四十代，所以速度是远远赶不上上海水变酸的速度的，而且海水变酸的趋势属于势不可挡的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_20_0.png)


    上面这张统计图，是1988年到2007年，大气中二氧化碳的含量与海水 pH 值的对照测试。随着二氧化碳浓度增加，海水的 pH 值在降低，而且从曲线上看吻合度非常高。你要仔细看这个红色线段或蓝色线段，都能从细节上看出来它都是波浪线，这就导致一个问题，比如说你看二氧化碳那根红色的曲线，你随便于取一个年份，它的波浪的顶部，然后再往后数6年，你再看那一年的底部才刚刚超过了6年前的顶部，也就是说如果在这6年的时间段里，你是可以轻松找到很多的时间段，二氧化碳的含量是比6年前还低的。


    那么能不能根据这种办法，就说二氧化碳的含量没有增长呢？当然不能。


    同样的道理，我们再来看图表的下半部分，是海水的 pH 值，它的波动没有二氧化碳红色那根线那么规律，因为影响海水的还有其它因素，二氧化碳是其中一个。我们选最左边，1989年这个值，8.11，因为它是比较高的。然后我们再另外选一点，就选这个最右侧的，它是2006年的冬天比较高的部分，它也是8.11。那么你只选取这两个数据，你能得出结论说海水的pH值没有任何下降吗？当然也不能。因为我们作了详细的数据统计，海水pH值是起起伏伏变酸的，这个大趋势没有一丝一毫的改变。


    那么可能有人要问，为什么会有起起伏伏呢？


    那是因为地球的大陆主要集中在北半球，所以植物也大都分布在北半球。到了冬天，北半球的植物叶子都落了，光合作用就降低了，于是二氧化碳浓度升高。到了春夏季，叶子长出来了，二氧化碳的浓度又会被吸收，所以它会有小幅的下降。就是这样，才造成了每年都有一个波浪线。只不过这种波动是远不及逐年增加的这个趋势的。


    刚才说，我以现在测到的数据作估算，人类在2100年的时候，海水 pH 值将下降到7.8，也就是比工业革命前海水中多了2.5倍的氢离子，说得直白一点，就是从前合适你口味的一锅鸡蛋汤加一勺盐就够了，但是现在出了事故，汤锅里头加了两勺半的盐。


    ## —— 今日内容小结 ——


    这就是这节课我要说的科学思维最重要的一点，那就是我们从感官上体验到的东西对科学结论来说是不值一提的，哪怕有数据的情况下，通过直觉作的判断也是不值一提的，尤其是出现了大量的数据的情况下，如果不专门分精力做好数据分析的工作，我们即便有一些零散的数据也无法利用它，也得不出什么有价值的结论。


