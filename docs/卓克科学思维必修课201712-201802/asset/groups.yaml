    历史记录中第一个天花患者是公元前1149年登基的古埃及法老拉美西斯五世，这位3100年前的君王留下了一份草图文稿，上面记录了他 Наконец时的财政状况，除此之外还记录了他在当时发病的情况，浑身起了红色的丘疹，几天之后丘疹破裂了，拉美西斯五世疼得昏不过了。很多医生给他治，治不好，这些医生也没见过这种病。后来拉美西斯五世一怒之下杀掉了好几个医生，但是也沒有用，几天之后连他自己都死了。在被制成木乃伊的脸上，脖子上，还有肩膀上你都可以看到非常明显的被天花感染之后的痕迹。'
