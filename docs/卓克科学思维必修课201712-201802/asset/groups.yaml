    # 135 | 旁证：乌龟为什么长寿？


    135 | 旁证：乌龟为什么长...


    # ——► 概念12：旁证 ◄——


    对历史事件的研究很少有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。


    这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    中国有千王八万年龟的说法，国外也有龟的寿命能活过一个世纪的说法，看来全世界各地的人都注意到龟是一种寿命比较长的动物。


    所以自然有这个问题，龟为什么长寿？


    但听了这么多节科学思维课，我们应该对提问跟回答都设置一些门槛：


    +   对提问来说，门槛在于，只有陈述上没有错误的问题才值得回答。

    对回答来说，门槛就在於，只有找到依据之后才能再回答。


    那你仔细想过什么是寿命吗？


    对人类来说，因为有高水准的科技跟社会的合作关系，所以最近200年来，我们可以详细地统计大多数个体的寿命，记住他们的出生和死亡日期，然后统计寿命用。


    但是动物界是没法这样做统计的，那寿命又是什么呢？是找到一个更长的寿命就把它当作这个物种的寿命吗？那这种寿命叫做最大值。但这样的做法是不是太极端了呢？有些比较常见的动物，我们能不能统计一个群落里活得最长的前10%的个体的平均寿命呢？


    这两个数字是不一样的，前者要比后者大得多。


    比如以人来说，吉尼斯世界纪录里寿命最长的是法国的一个老太太，123岁，但如果统计中国寿命的前10%，那估计也就是90岁，这两个数字相差了1/3呢。


    那么乌龟是不是长寿呢？


    按照刚才的思路，具体查一查，乌龟是有很多种的：


    +   寿命比较短的像麝香龟、钻纹龟、西部锦龟、巴西龟、猪鼻龟，它们的寿命都是10几年20多年，它们肯定算不上长寿；

    中等寿命像红腿象龟、苏卡达龟、鹰嘴龟、锯缘龟、小鳄龟，寿命在40岁左右，也算不上长寿；

    只有那些象海龟、大鳄龟、加拉帕戈斯象龟，它们的寿命在80岁到180岁之间，这个算是长寿的。


    如果真的有人问这个问题，我们就得帮他梳理好各种补充条件，在他问完之后可以补充上一句，你要问的是不是那些寿命超过100岁的龟为什么长寿？


    可是我们往往见到的回答问题的人也没有这个意识，通常能见到的貌似有科学味道的答案就是这样的，说：


    科学家们发现，生物的寿命跟端粒紧密相关，端粒是一种在真核细胞里，位于线状染色体最末端的特殊的重复序列，每次细胞分裂复制 DNA 的时候，端粒都会减少一分。直到最后一分也用光的时候，细胞就不再分裂了。那不再分裂就意味着没有继续生长和修复受损地方的可能性了，所以寿命就终止了。人类细胞的端粒可以使用50次，乌龟拥有得天独厚的长寿基因，它们的端粒可以支持细胞分裂110次以上，所以乌龟天然比其他的动物寿命更长。


    大约就是这样一段解释。


    虽然咱们这个专栏的同学对这种级别的描述，我估计是不太会满意的。但不得不说，这种级别的描述对很多中老年来说都是一听就懂、一学就会，而且还记得通。


    这样传播具体知识有什么坏处呢？


    就是说我们已经知道了具体的科学知识，但是没有科学思想。


    那生活中最常见的是什么什么生物科技公司生产的端粒酶保健品，389块钱一瓶，产品介绍里还会有，比如说2009年诺贝尔生理学医学奖的支持，功效是癌症、三高、慢性病、细胞衰老，几大问题一并解决。


    如果中老年人听完之前的谬误感觉收获到了什么知识，那么接下来对这些长寿功效的药就很难抵御了。这就是只有一些不扎实的科学知识而没有科学思想带来的弊端。


    实际上海龟、象龟为什么长寿，和熊猫为什么还没灭绝是属于一个性质的问题，它就涉及到乌龟的祖先是从什么动物演化来的，它新陈代谢的特点跟其他爬行动物有什么不同，尤其是能表现为寿命更长的那些特点又是怎么产生的。


    这非但不是一篇 stal... ...甚至是一个目前为止也没有完美答案的问题。


    众多研究内容里也只能是在 N 种因素里，对其中一个因素的其中一个方面作一些深入分析。


    比如说大体上的规律是这样的，寿命跟体型是正相关的，体型越大的生物寿命越长，体型越小的寿命越短。它们在环境压力下被筛出不同的生存模式，比如像小虫子，几乎就是所有比它大的动物的晚餐，随时面临着死亡。今天不抓紧时间把卵尽猃多地撒播出去，明天就有可能会被自己带一肚子富有营养的卵被小老鼠吃下肚子了，所以快长多生，一年产下几十个卵，这里只要有两三个今后能长成大虫就算赚到了。


    可制造这么多富有营养的卵也是一个耗费巨大的任务，所以长寿命是难以维持的，它只能在长寿跟体型大而不被别人吃掉两者之间择一头。择子孙满堂这个选项，体型小的动物寿命一般短暂。


    反过来，蓝鲸那么大尺寸的动物，寿命能到200岁呢，呱呱出生的第一天，刚从妈妈肚子里游出来就是7米长，6吨重，比世界上绝大部分的动物都大很多，根本不愁被人吃掉。所以几年才生一胎，一胎只生一条，怀孕一年多的时间，这对它来说不是问题。它要慢慢长到30米才开始生产，这是非常耗时间的。但是因为它不会被人吃掉，所以无所谓。这是一种完全不同的生存策略，而寿命就是不同生存策略中的其中一个属性。


    当然也有特例，比如像裸鼹鼠，它的寿命有30岁，虽然这个岁数不长，但是跟它同一个尺寸的，跟它同一个科的动物的寿命大都只有它的1/10。还有北极圈的贻贝，叫明，最老的有400多岁，300多岁以上的明比比皆是。


    对种种个案的研究，也有科学家们试图找出关键的因素。


    比如像端粒酶的结构是不是能有效防止自由基泄漏啊，或者细胞膜被氧化的难度啊，还有端粒缩短的速度啊，DNA的修复速度啊，新陈代谢的速度啊，等等等等，都是关键的影响因素。'
