    ## 148 | 边界：为什么镜子里的像不是上下颠倒的？


    ## —— 概念13：边界 ——


    人类观察世界的边界，是由所能使用到的最好的工具决定的，面对任何问题，只有尽可能多找一些可验证的细节，不过度理解，不过度地解读，才可能了解真相。


    为什么镜子里的东西都是左右颠倒的？


    这个问题可能很小的时候大家都遇到过，你举起右手，镜子里的人举起的是左手，你衣服胸前如果印着一段字，那从镜子里看每个字都是反着的，都很难认出来。


    但是你想过这个问题没有？为什么镜子没把我们上下颠倒一下呢？


    ## —— 方向上的优先级 ——


    ## —— 人的视觉盲点 ——


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_164_0.png)


    射过来了，射到了这部分，也不会引发任何的神经信号。


    所以，如果我们原原本本地把视觉信号导出出来，视野的下侧是应该有一个黑色的圆点区域是什么都看不到的。


    但是你见过有谁说自己发现了视觉盲点吗？


    没有，所有健康人看到的图像都是完整的，哪怕我们闭上了一只眼睛，只用一只眼睛看，视野里也依然没有这个盲点。


    这是什么原因呢？


    就是因为，我们感受到、看到了什么，并不是最初眼睛收集到的那些粗糙的原始信息，所谓的我们看到的东西已经是大脑深加工后的内容了。


    盲点对应的区域可以通过另一只眼睛看到，然后补充上去。就算是我们只有一只眼睛，大脑也会想方设法把缺失的内容补上，让图像看上去是连续的，不出现那个黑点。


    我们既没有办法阻止大脑把镜中的像左右颠倒，更没有办法阻止大脑对视觉进行深度加工。


    而我们看对比图中，章鱼的眼睛，它的视觉细胞就暴露在最外层，根部才连着神经纤维。光线是直接照在视觉细胞上的。如果我们是章鱼的话，这个世界看起来图像应该清晰很多，因为视觉细胞就在最外侧，而且到了眼球的根部，并不需要断开，让神经纤维先走，不需要的。所以章鱼的眼睛没有盲点。


    那你说，是不是章鱼这种软体动物的眼睛比人类更先进呢？


    其实也好说，只能说更适合它生存的环境。因为不只是人，几乎所有脊椎类动物的视觉细胞都被神经纤维挡在后面了，这样做也有好处，因为视觉细胞在这种结构下离血管比较近，也许视觉效果上好像是手机贴了膜，没那么清晰，但是供血快就导致了视觉反应速度快。


    这么一想，你就可以知道，脊椎类动物在生命史上经历的竞争起码在动作频率上要远快于生活在水中的章鱼。所以最终这个特性它保留下来了，甚至还进化出脑补盲点的功能。


    ## —— 今日内容小结 ——


    这节课，我们能得到什么科学思考呢？


    就是我们是不是能时刻意识到现象和我们看到的现象并不一致呢？因为这个现象被我们看到的时候，它至少已经被大脑深加工过了。


    当然，因为我们都是人类，所以在最最最基础的层面上，基础到我们的意识都无法控制的地步上，即便大脑对原始素材进行了深加工，全人类至少说还得有一个共识，这个共识可能是在跨物种的时候，比如我们跟章鱼对比的时候，它就已经不是共识了。


    但是你想，假如不是那么底层的情况，我们一样会有大脑参与的深加工，比如说我们本人的性格，我们的精力、体力的情况，接收信息的时候，我们情绪出一种什么状态，甚至接收信息之前我们吃了什么，喝了什么，是不是也不可避免地影响到对一个事物的理解呢？


    刚才我们从最底层的角度看，我们可以站在章鱼的视角假想，它们的世界中应该是一个什么样子。


    那当我们不站在那么底层的视角去看，是不是也能从别人的角度出发看问题，而发现在其他人眼中不同的世界呢？


    也许我们这样的念头在别人看来就属于是体谅别人，或者有同理心的一种表现。这个也许是科学思考的一个副作用，就是让你具有更多的视角，别人眼中的你更加具有同理心了。


