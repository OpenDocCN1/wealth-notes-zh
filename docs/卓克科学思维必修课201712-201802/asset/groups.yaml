    # 111 | 发展：天花，富人比穷人死亡率更高


    111 | 发展：天花，富人比...


    # ——◄概念11：发展►——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    # ——◄上节思考题解答►——


    上节课最后我留了一个问题是，病毒到底算不算生命体这个争论，你是怎么看待的？


    实际上科学界相当多的人对这个问题不感兴趣，因为这本质上是在已知的信息上贴一个标签的行为，这类讨论并不能增加我们对病毒的认知。我们对病毒的认知如果能增加一分，那只有可能是源自具体的观察。所以，算不算生命体这类问题还是别在个人喜好里更合适。


    # ——◄天花发病过程►——


    对绝大部分当代人来说，天花的发病全过程完全可以用恐怖片来形容，连经历过那个年代的医生都是这么评价的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_48_0.png)


    天花病毒<|message|>多数是经过空气吸入，在身体里潜伏12天，尤其是潜伏的后期，病人自己察觉不到有什么异常，还可以正常地工作、生活，但这个时候病人已经具有很高的传染性了，这个也是病毒进化出的一個赖以生存的绝招。假如是某个病毒一被感染就爬不起来了，那这个病毒就没法散播到各地了。


    等潜伏期过后，病毒就会出现在表皮下的血管中，假如病人最终也没有死，那么为期大概1个月的剧烈的持久的疼痛就要拉开序幕了：


    +   病人这会儿开始发烧，前胸跟后背剧烈地疼痛，头也一样疼；

    持续3天之后，典型的天花的脓包就出现了，脓包最先出现在舌头跟喉咙里；

    在之后的1天里全身都会出现，从脸一直到脚底板，这个时候的疹子是硬硬的块，病人感觉皮肤就像烧伤了一样；

    出疹子5天之后，它会慢慢地变软，而且从硬变软，圆形的疹子中心凹陷下去，颜色从红变紫


    变软持续3天之后，病人的喉咙就会被大的疹子堵住了，吞咽跟说话都很困难，更不要提吃晚饭；


    等到疹子都变软之后，有一些会被抓破，于是皮肤上就会出现各种细菌感染，这个时候病人的体温已经超过40摄氏度，这个时候是最危险的，大部分的病人在这个时候就会死于病毒血症。就算是那些没有出现并发感染的人也会极度消瘦，你想这个时候隔离却卧床已经有1周的时间了；


    出疹10天之后，疹子会慢慢地变干、变瘪，骸开始发出恶臭，成年人的体重至少会减30斤，儿童就更加严重了。这个病虽然总体的死亡率是35%，但是对儿童来说超过50%的死亡率。在脸上起满了疹子，有的时候会感染到眼睛造成失明，皮肤在这10几天里一直有焚灼感，甚至连指甲盖下面的肉都会感觉在燃烧，被单跟身体的摩擦也会造成剧烈的疼痛。


    出疹子14天之后，疹子里的液体开始慢慢地被吸收，疹子干瘪下来脱落了，脱落之后，皮肤深层的嫩肉也会暴露出来，每一个脱落的丘疹都是一个伤口，这个时候的疼痛除了病毒对神经刺激产生的那种焚灼感之外，还会有伤口造成的疼痛。如果这之前脸上的疹子特别多，这个时候脸就像毁了容一样。


    等到所有的疹子都干瘪了，伤口都长好了，病人这次灾难就算过去了，就会慢慢地开始恢复，经此一役，他也会获得对天花病毒的终身免疫。


    # ——◄人类与天花的战争史►——


    如果得了这个病怎么办呢？


    我们先来说说现代人是怎么治疗天花的。其实直到现在，我们也仍然没有治疗天花的特效药，如果今天真的有人患了天花，治疗都是辅助性的，比如说尽旱保证全身皮肤的清洁、减少皮肤的破损、通过静脉补充营养、补充水、㤗抗生素防止结痂之后的细菌感染，也就是这些手段，本质上要想好，还得等待自身免疫起作用。


    那么400年前的欧洲人是怎么治疗天花的呢？


    有些听上去非常惊人，几百年前的医生曾经相信过红色会让病人镇静。于是病人的家里会把屋子里的家具全换成红色的，窗帘也换成红色的，甚至还特地在病床前挂起红色的帘子，有的人还会用红色的毯子把病人裹起来。


    除此之外，还会用针把疹子挑破，把内容物都挤出来，有的时候甚至用烙铁去烙疹子，那就更是焚烧之刑了。


    而且那会儿的医生认为，阳光是导致疹子消退之后留下疤痕的原因，所以病人从发病之后就要被关在一个暗不见天日的屋子里，还会往病人身上抹芥末膏、水银、弱酸、硝酸银、碘等等等等，甚至把所有知道的能调成膏状的东西都糊在病人身上，再用纱布把病人整个包起来。在结痂的几天就用夹板把病人固定起来，限制他们手脚的活动，防止他们挠来挠去留下疤痕。


    那时候人们相信，要把体内的病灶排出去才能恢复，于是就用厚厚的被子把病人裹住，让他尽量多地出汗，多多地把毒汗排出去就会恢复。


    从这个逻辑出发，大家也能想到，让病人拉肚子，给病人放血这些方法也都在所难免。但是所有这些放在现在都是没有科学依据的，可那时候患者家里越是富有越舍得用这些方法。


    最终，1682年，第一个理性思考的医生出现了，他叫玛斯·西得汉姆，他后来被称为“英国的希波克拉底”、“英国医学之父”。


    他当时详细统计了所有患天花的患者，然后把他们按照贫富分成两类，统计结果显示，那些花大钱请医生，用尽了各种治疗手段的富人，死亡率还明显高于负担不起医疗费，也请不起医生，只能期待病人痊愈的穷人。


    所以他就提出，对付天花尽可能不要干预病人，只保持房间凉爽、空气清新就够了。


    这之后又过了几十年，天花和人的命运就发生了根本性的逆转，因为疫苗出现了。欧洲人跟亚洲人当时分别采用了不同的措施，他们分别用人痘和牛痘做了疫苗，虽然直到现在，真的患了天花仍然没有特效药，但是天花疫苗已经足够了。


    1950年，全世界有5000万的病例，1967年下降到1000万，又过了11年的1978年，一个英国的医学摄影师叫珍妮特·帕克，她在实验室拍摄素材的时候被研究用的天花感染了，后来马上被治愈了，她就是全世界最后一个人患天花的人。


    1980年5月8号，世界卫生组织在肯尼亚内罗毕宣布，危害人类数千年的天花已经被根除，它也是世界上第一个和唯一一个依靠人类自身力量消灭的传染病。


    下节课我会给你讲讲天花给人类文明带来的影响，因为一个如此广泛、持续传播的疾病，我们已经不能仅仅把它视为一个医学疾病了。


    # ——◄今日思考题►——


    英国的“希波克拉底”出现之前，那些富人患了天花，他们有条件花大钱请医生，有资源把病人照顾得更好，但最终统计下来，这么治疗的死亡率却更高，可是为什么这些有权有势，可能接受更好的教育的人，却没有能力发现自己这边死亡率更高的这个事实呢？


    希望你把思考留在评论中。


    # 划重点


    1.天花病毒能广泛的传染人类，在于它能通过空气传播，而且在潜伏期就...'
