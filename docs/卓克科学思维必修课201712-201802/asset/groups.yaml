    ## 116 | 发展：感染HIV却不发病的人


    ### ——► 概念11：发展 ◄——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光观察曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    ### ——► 开外挂的HIV病毒 ◄——


    之前课里我提到过病毒，说到一个观点——什么才是最有害的病毒？

    就是那种能感染人，但是又不会马上让人失去活动能力，这样这个人就可以作为传染源到处去传播，保证传染性足够强，和保证这个人还能爬起来到处走。这两者其实是一对矛盾，当病毒的传染性足够强的时候，那也就是说病毒的数量足够多了，病毒数量足够多的时候，就会引发足够的症状，让人爬不起来。所以，生物界的平衡，即便是在病毒的身上也有充分的体现。


    依照这个逻辑，假如有那么一种病毒，如果能在长达几年的时间里都不会让宿主察觉，而且这几年里还一直带着高传染性，那这种病毒是不是有点强得开了外挂呢？


    这样的病毒是真实存在的，它就是 HIV 病毒，人类免疫缺陷病毒。由它带来的疾病叫做艾滋病，也就是英文的写法 AIDS 的音译，AIDS 全称叫“获得性免疫缺陷综合征”。


    把词语拆开就能理解这是一个什么病了：获得性是跟先天性相对的，因为也有婴儿一出生，免疫系统就有缺陷，这一类一般都是基因上的问题，那这种就叫做先天性免疫缺陷。出生没问题，后来出的问题，那就叫做获得性缺陷。


    综合征就是各种症状在一起出现，综合征 3 个字的背后意思就是艾滋病患者身上的伤害不是由于 HIV 病毒造成的，而是由其他各种各样的微生物跟病毒一起造成的。


    ### ——► 艾滋病的发病原理 ◄——


    HIV 病毒外壳有一种像大头针一样的蛋白质，它钉满了整个 HIV 病毒的外观，它的头朝外，针扎在病毒身上，这个大头针一样的蛋白质头部的形状，跟我们身体里一种免疫细胞叫“辅助性
    T 细胞”，跟这个细胞膜上的一个受体正好可以配对。这个就有点像六角形的大头钉正好可以镶嵌在一个内六角的凹槽里那样。所以 HIV 病毒盯上的靶子实际上就只有一种细胞，就是辅助性
    T 细胞。


    这种细胞是 N 多种免疫细胞里的其中一种，它平时的工作像一个将军，发号施令，而不是冲杀在一线的士兵，这个将军就负责下令攻击还是不攻击，攻击的话是伏击还是全线压上。所以如果将军被搞定
    的话，士兵再多也没有战斗力，也就没有免疫力了。


    HIV 病毒就是感染将军的。


    但 HIV 病毒刚刚进入辅助 T 细胞后，并不是马上发作，它要沉寂一段时间，几个星期或者几个月都有可能，但它总归要借一次机会激活自己，这种机会一般都是患者的身体出现了一次感染，接着
    HIV 病毒就开始在辅助 T 细胞里大量地复制自己。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_59_0.png)


    上图是电子显微镜下辅助 T 细胞正常状态和被 HIV 病毒感染之后的样子。


    被感染之后的辅助 T 细胞，表面上那些黄色的 小点点就是刚刚造出来的 HIV 病毒。再下面这张图，是一个刚刚造好的 HIV 病毒从受感染的辅助 T 细胞的细胞膜里钻出的过程。在电子显微镜下，这些过程都可以被清楚地看到。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_59_1.png)


    只要被感染之后，辅助 T 细胞就不再是什么“将军”了，它此后的一生的任务就是按照 HIV 病毒里的 RNA 的指令制造出更多的病毒。它作为将军的本职工作，就那些指挥士兵攻击还是防守，伏击还是突击，已经完全忘在脑后了。所以人体虽然还有免疫细胞，但数量上跟活动能力上都完全应付不了外界微生物的入侵。


    刚才说过，接触了 HIV 病毒之后，几个星期之内，只要遇到一次感染，病毒就会被激活开始大量地繁殖了，这个时候会出现一次像流感一样的症状，就是浑身肌肉疼，头也疼，有时候还会起疹子。不过，这些症状两周左右就会过去，然后一切又归于平静，就好像一次流感恢复了一样。


    这个平静的时期就是 HIV 病毒的潜伏期，典型的潜伏期是几个月，有的最长的能潜伏 10 年，这段潜伏期病毒并不是睡着了，而是一直在繁殖，它在摧毁每一个辅助
    T 细胞，等到大部分辅助 T 细胞被干坤之后，身体对大部分的入侵反应都是有失准的，这时候大部分患者就会反复地出现酵母菌的感染，还有皮疹，还会生疮。


    每毫升的血液中，T 细胞的数量从正常时候的1000亿下降到只有200亿，也就是减少了80%。这是个标志点，如果到了这种程度还不做任何治疗的话，大部分病人在再拖两年左右就会出现精神失常、失明、吞咽困难，这些都是典型的神经系统遭受感染的情况。


    最后，病人就会死于一连串的感染，这些感染有可能是念珠菌，有可能是各种细菌的孢子导致的肺炎。因为咱们呼吸的空气就算是清洁的，每立方米都有几百上千个细菌呢，还有可能出现球菌腐膜炎，或者是结核杆菌的感染。当然，更有可能是很多种感染一起发作导致的死亡。所以艾滋病患者到末期都是因为各种微生物入侵导致的死亡。


    这个事实从另一个角度也可以看出，就是平时守护我们身体的免疫系统，它时刻都遭受各种攻击，如果其中有80%的工人罢工了，人就会在3年之内死亡。而绝大多数人体 的免疫系统都是100%正常工作的。可是我们在健康的时候，很少有人能够感觉到有这么一个精密操作跟强大的保障时刻都在我们体内正常工作。


    ### ——► 非凡控制者 ◄——


    艾滋病在全球流了35年了，一直挑战着科学家，也挑战着人体的免疫系统，直到最近几年才能做到通过药物，尽量推迟艾滋病的发作，不过到现在为止，仍然没有有效的药物能完全去除病毒。在几十年的研究里，竟然发现了一些特例，这种特例大约占全部患者的1/300，他们被称为“非凡控制者”。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_59_2.png)


    上图中的这些患者，他们都是积极参加各种医学研究的非凡控制者，患病时间最长的30多年，到现在也没有做任何的治疗，还没有发病。


    这些感染了 HIV 的人为为什么不患病呢？


    这个研究非常不好做，因为这样的患者太难找了，但大量罕见的个例集合起来，还是让一个嗅觉灵敏的团队找到了，他们在一次大型的艾滋病学术会议上提出了非凡控制者的概念，结果现场1000多名常年研究艾滋病的专家有200多人都举手表示，自己在过去的临床经历中，貌似见过这样的患者，就是他感染了病毒却怎么都不发病。


    会后，这个团队就挨个地去跟每个专家联系，再找到患者资料，然后花几年的时间去世界各地亲自上门找这些患者。功夫不白费，几年中迅速确认了其中60多个人，然后就发现他们的免疫系统对
    HIV 病毒的识别跟普通人是不一样的。


    识别跟普通人是不一样的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_60_0.png)


    我们先来看资料中 HIV 病毒的一个放大图。普通人的免疫系统识别 HIV，靠病毒外壳的那两种蛋白，就是 gp120 跟 gp41。这两个蛋白质在图中就是大头钉的圆帽儿跟大头钉的这个针。可是艾滋病难治就是因为这两个蛋白质太容易变异了，免疫系统刚刚识别出来，刚叫来大批的士兵打算围剿，它换衣服了，免疫系统又不认识它了，于是它就能反复复杂逃过免疫系统。


    抗病毒的药物也特别难设计，因为药物一旦设计出来，它的分子结构就固定了，它也只能固定地消灭某一种类型的外壳，这个外壳一变，药物也就失效了。


    而非凡控制者的免疫系统好像不管外壳怎么变，总能识别它的芯儿是 HIV，就好像它们可以透过外壳，能直接识别到病毒的内部那几个不变的蛋白质一样。


    但是这说不通啊，免疫系统是不可能隔着好几层还能识别一个东西内部蛋白质的特性的，因为说到底，识别过程是什么呢？


    就是一个化学结构表面的电特性的吻合与不吻合的判断，吻合就咬住你，就吞掉你。而内部的电特性不会隔着好多层膜还表现出来的。


    那么是怎么认出来的呢？


    在2010年的时候，找到了更多非凡控制者，一共是974位，对他们就作了基因测序，把他们的基因跟那些正常的艾滋病患者的基因作了详细的分析，这一次初步筛选出130多万个基因上的多态位，这些都是怀疑对象了。虽然嫌疑犯多了点，但总归是从30亿个碱基序列中筛选出来的，已经削减了不少了。


    后来又经过几年的分析，定位在300个基因上，最终就发现了非凡控制者的一个蛋白质的突变，它跟其他的艾滋病患者不一样。这个蛋白质影响的就是病毒进入细胞膜时的大门，在非凡控制者身体中，病毒进入之后，变异后的门会在门口留下一滩标记物，这滩标记物是稳定不会变的，是它引起了免疫系统的注意。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_60_1.png)


    那团紫色的弹簧你就可以看作是病毒进入之后留在门外的。


    ### —— ◆ 今日内容小结 ◆ ——


    我们现在用演化的眼光来看看 HIV 感染这件事。


    假如在人类远古时期就有过大规模的 HIV 的感染，结果造成大面积的死亡，最终留下来的是这类非凡控制者。那么到了今天，所有人都是非凡控制者的后代了，而 HIV
    病毒的几个基因片段在很多人的辅助 T 细胞里都有。


    当我们对 DNA 测序的时候，发现这段 HIV 序列了，这段序列也跟现在 DNA 中另外98%的序列一样，是处于静默状态的，根本不表达成蛋白质。


    那个时候作为拥有非凡控制者基因的我们，估计是很難猜出这段最初源自 HIV 病毒上的序列是有什么功能的，我们可能也不知道这段片段来自于哪。而这种情况不也正是我们当前看
    DNA 序列时出现的情况吗？


    我们当前看，那上面就有98%的序列都不表达成蛋白质，这里的一小部分我们知道它们起了调控作用，但更多的部分我们根本也不知道起了什么作用。


    所以从这个角度上看，也许我们累积了很多静默的 DNA 序列，都是由其他的，也不知道具体位置在哪的基因抑制住的，它们很可能都是曾经我们身体被入侵过的痕迹。


    ### —— ◆ 今日思考题 ◆ ——


    为什么在最初研究非凡控制者的时候，这类人特别难找到呢？这个答案你需要设身处地地想临床跟研究时遇到的情景。


    如果你想到了，就把思考留在评论中。


    ### 划重点


    - 1. 艾滋病之所以危险，是因为 HIV 病毒感染的是辅助 T 细胞，它是负责指挥其他免疫细胞的“将军”，一旦它出现问题，免疫系统就会失去了战斗力。

    - 2. 艾滋病难以治疗，是因为 HIV 病毒的外壳蛋白容易变异，免疫系统难以识别。

    - 3. 感染了 HIV 的全部患者中有1/300不进行任何治疗也不会发病，他们被称为“非凡控制者”，HIV 病毒会在他们的细胞膜上留下 一滩标记物，免疫系统可以识别。


    卓克

