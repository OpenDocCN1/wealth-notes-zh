    - 1. 通过对世界各地猫的 DNA 进行分析发现，全世界所有的家猫都源于一个品种的野猫，叫非洲野猫，也叫非洲斑猫。

    - 2. 家猫跟非洲野猫的 DNA 从遗传学上几乎无法区分，因为突变量的积累还太少，少到无法测量。因此，要确认家猫的驯化史，考古遗迹这种更粗糙的证据反而更有效。

