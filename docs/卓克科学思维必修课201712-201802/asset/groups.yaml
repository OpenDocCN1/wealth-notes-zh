    ## 复习+预告 | 实事求是的科学思考习惯


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_208_0.png)


    ### ——♦ 本周课程复习 ♦——


    ### 概念14：流变


    一个事物所表现出来的样子，源于方方面面的积累，在复杂系统里，下一步如何发展，只能是建立在原有的基础上，几乎无法推倒重来。


    157 | 流变：石油什么时候用光？


    +   1. 二氧化碳过量排放，造成的效果是地球的冷热不均、降水不均、极端天气密集、海冰酸化、全球平均温度升高，这些变化会威胁每一个物种。

    +   2. 降低碳排放量有两种方法：一种是想办法将二氧化碳固定下来，比如植物中的淀粉和糖；另一种就是减少化石能源的使用，比如发展新能源汽车。

    +   3. 曾经的清洁能源，在被巨量使用后，那些观察不到的副作用开始显现，带来严重的环境问题，这需要我们对新能源进行新的思考。


    ### 概念15：泡沫


    一项新的科研成果出现，总会引发很多人的热情，有些人是为了科学欢呼，有些人则希望从中渔利，于是泡沫从中诞生。识别出泡沫，不但有利于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    158 | 泡沫：尼斯湖到底有没有水怪？


    +   1. 科学素养的高低，决定着一个人会对什么东西好奇，会对什么东西无感。

    +   2. 从科学角度分析，尼斯湖不仅小，而且非常冷，鱼类稀少，最多只能满足几只水怪的食物需求，但一个大型物种的延续，至少需要几百只的规模。


    159 | 泡沫：怎么识别民科？


    +   1. 没有受过科学训练，不使用严格的科学方法进行科研的人，称为民科。

    +   2. 现在，一个正经的科学家，至少应该具有博士学位，并在国际公认的学术期刊上发表过论文。

    +   3. 科学家是一个门槛比较高的“职业”，发展趋势是“职业标准”越来越严格，外行越来越难以冒充。


    160 | 泡沫：怎么识别伪科学？


    +   1. 处于这个时代科学圈边界的理论，处于有待突破、找到新证据的理论，都有可能被扣上一项“伪科学”的帽子。

    +   2. 生活中那些围绕着疾病和死亡展开的内容，而且还在制造恐慌和焦虑的，往往就是伪科学。

    +   3. 伪科学在声称自己是科学的方式上，往往通过名人、名言来背书，而不是在有美誉度的学术期刊上发表论文。

    +   4. 越是惊世骇俗的言论，就越是需要坚实可靠的证据。


    ### 答疑时间


    161 | 问答：换硬盘增加工作效率


    +   1. 电脑运行慢，有一半以上体现在开机过程中，影响最大的就是机械硬盘的性能，因为它是靠磁头在盘片上寻找磁条读取数据的，数据越分散，速度就越慢。

    +   2. 固态硬盘SSD是将数据存储在微小的半导体中，没有机械结构，速度比传统的机械硬盘快多了。


    162 | 问答：什么硬盘用起来最爽？


    +   1. SSD硬盘的优点除了快，就是不怕颠簸，也更省电，非常适合笔记本电脑使用。

    +   2. SSD硬盘的缺点是价格贵，寿命有理论上限，在临近报废的时候会在某一刻突然崩溃，造成数据丢失，而机械硬盘会在寿命末期一点点损坏，有经验的用户能够抓住房时间窗口提前导出数据。

    +   3. 最新的闪存技术已经解决了SSD的寿命隐患，但距离理论性能还有距离，普及应用还需数年时间。


