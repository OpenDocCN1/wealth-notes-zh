    # ——◆ 今日内容小结 ◆——


    这节课我们说了一个貌似很简单的问题，用科学的思考习惯仔仔细细地分析了一番。


    有些人可能觉得，这么做太较真了，如果你平时跟别人聊天都是这么说的话，那活得太累了。


    这个说得很对，所以，这只是一种思考习惯，我们并不是要在生活里，每一次遇到类似的，连门槛都没有迈过的问题，都要跳出来指出其中 N 个方面的概念定义不清，事实陈述错误，或对象指代不明。通常情况下，我们一听就知道对方真正要表达的意思，或者要问的问题是什么。在实际的交流场景中，我们只要去体谅对方的本意，尽量领会内容里的核心就好了。


    这个道理很简单，像刘翔在生活中，他上下台阶的时候也不会使用标准的跨栏动作，但是这个动作他是掌握的；还有像一个外科医生，在家里补袜子的时候也不会用持针器配合5×12的针头去用，他也不会用那种手法，他们都是跟普通人一样正常地走路，正常地补袜子，掌握科学思维习惯的我们也是应该这么做的。


    但是我们拥有科学思维的好处很多，因为你脑子里已经对那些逻辑关系了然于胸，知道有些内容想完全没有问题地描述出来，其实门槛挺高的。


    那么一旦在平时听人讲话的时候，你听到一个人在演讲或者在文章中，他没有被任何一个门槛绊倒，那这个人就是高人，所以我们关注一下他的微博，这起码是一个高质量的信息来源，你甚至可以在私下跟他进行观点的交流，也许就能结交到一个知识渊博的兄弟。


    同样的道理，一个人在陈述内容的时候，很低的门槛都没有迈过去，那他还在десят不绝，那这种人就应该敬而远之了。


