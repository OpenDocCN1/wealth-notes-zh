    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    很多疾病都一直伴随着人类文明的进程，比如鼠疫、流感、天花，从中世纪的资料里就可以统计出，那个时候的欧洲居民每两个人中就有一个脸上有着天花留下来的麻点，虽然不太好看，但也象征着他们是幸存下来的、今后不会再被这种病毒威胁到生命了。我们接下来就会用四节课详细讲讲天花这种疾病。


    在第一节、第二节课里，你要注意对比古代人跟现代人是怎么理解疾病的发生，是怎么确认什么是致病因素的。


    第三节课里，你将会听到一种病毒是怎么塑造一个民族，乃至左右整个人类文明的过程的。


    第四节课里，你将会知道，被我们消灭的天花是有可能卷土重来的。


    ## —— 古代人对疾病的认知 ——


    我们先来看着，古代人是怎么看待这种微生物引发的传染病的。


    最早有文字记录、详细描述病症跟手术的是美索不达米亚人，距今有5000年。那时候的楔形文字还描述过其他很多病，比如中风、血吸虫、心脏病、肺炎、风湿，还有这些病的治疗方法。别看它是5000年前的，但认知逻辑跟现代医学竟然是一个路数，都是详尽地作出客观描述。


    不过，也夹杂了不少纯思辨出来的逻辑。


    比如美索不达米亚人就认为每一个人都有一个小宇宙，而天是一个大宇宙，大宇宙上的星象变化分别就代表着不同的寓意，它又跟个人的小宇宙遥相呼应。一个人生病与否就和这种对应关系是不是妥贴相关，这种天人合一的理论你是不是很熟悉呢？所以在5000年前，人对我们为什么生病这件事情的看法是看天。


    而“病毒”这个词出现得比较晚，直到公元前400年，古希腊后期的时候才出现，当时希波克拉底的“四体液学说”就把各种病症看作是一种外部的脏东西的入侵，它破坏了人体本身的多种体液的平衡，所以环境里的脏东西是主要的致病因素，尤其是那种泛着臭气的空气，或者呕气，这里就包含着某种毒素，而这种毒素的概念在古希腊的时候就被称作是病毒，也就是
    Virus 这个词的来源。


    那个年代是咱俩的战国时期，诸子百家争鸣，扁鹊就是那个时候的人。非常巧合，中医理论的基础也是在这个时候初步形成的，也就是在美索不达米亚人完整详细的古代医学已经出现了2600年之后才出现的中医，而在这2600多年里，古巴比伦人、古埃及人、古印度人、古阿拉伯人、古罗马人也都纷纷建立起来自己的一大套医学理论。


    那个时候的古人不论是东方还是西方，都已经开始认识到病是来源于外邪入侵，这个算是一种认识的进步，因为它多少已经脱离了纯思辨，倘若星空去琢磨病因这种方式已经不流行了。


    但尽管如此，认为病症来自于外邪入侵，这种看法还是很粗糙的，比如说癌症，它一定也是从古至今一直广泛存在的，最早我们在某一种恐龙、鸭嘴龙的大腿骨的化石上看到了癌症的痕迹，但古人对癌症的病因是直到最近100年才发现的，因为它是源自自身细胞的，是我们身体自己产生的，而不是外邪入侵。


    能够认识到这一步，可以算是认知的又一次升级，但如果只把病症按阴阳内外分，仍然过于笼统。比如拿病毒引起的疾病来说，它既有外因也有内因。


    ## —— 对病毒的认知升级 ——


    虽然研究医学史的人可以看到人类在2500年前就使用病毒这个词了，但这个词跟现在词义还是不同的。


    现代医学中，病毒的词义要从1903年才开始使用，因为那个时候人们刚刚认识到有那么一种致病的微生物，它比能过滤最小细菌的过滤网的孔还要小很多，但具体小多少，不知道，因为显微镜下看不到。1903年，我们起码已经知道有这种东西的存在了。


    后来又过了30年，电子显微镜出现了，人们才知道，原来那种极小的过滤网的网孔比这种极其微小的致病的微生物大约大了几百倍。


    再过了20年之后，DNA 的双螺旋结构被发现了，人们才知道病毒是怎么让人生病的，才发现病毒原来是一种半死性的生命体，它只有一个蛋白质做成的外壳，外壳里装着一些遗传物质，它里面缺少各种各样的工人帮它执行复制生命的工作。


    所以，它光凭自己是不能繁殖的，它必须钻到其他细胞里面，去劫持细胞里面的工人，让它们去做病毒做不了的事情。所以，病毒实际上只是一个给细胞下达指令的入侵的指挥官，它把细胞变成了专门制造病毒的工厂。


    等到什么时候，它入侵的细胞已经不能完成这个细胞本身应该完成的工作了，这个细胞就废掉了。当病毒摧毁的细胞越多，给人体造成的影响就越严重，最后就是从宏观上能看到各种功能的丧失。如果免疫系统能够及时赶到，把病毒清除掉，可能给人体带来的就是一场像重感冒一样的几天或者10几天的难受，这几天可能会发烧、起痧子，但是并不危及生命。如果来不及清除的话，人就会死亡。


    我刚才说的这些，就是在现代语义下，病毒是怎么发病原理。你看，它算不上是完完全全的外邪入侵造成的疾病，因为病毒可能只需要几粒进入身体就足够了，它们之后就能指挥身体造出几十亿、上百亿个病毒个体来，而这个时候体内所有的病毒差不多都是人体利用体内的原材料帮助病毒打造出来的。


    那么，在现代医学的观测水平下，我们已经用不着把疾病的原因扣上一个外邪入侵，或是内裹发作的帽子，它在最先进的观测下是什么样子，就是什么样子。那种脱离了观测的思辨式的抽象化思维是有害无益的。


    ## —— 最严重的疾病-天花 ——


    从现在的 DNA 分子中来分析人类的天花病毒，可以猜测，大约是在1万年前，这种原本只在猩猩、牛，或者老鼠身上的病毒发生了一次重大的变异，于是它跨越了种间的隔离，可以开始感染人体细胞了。


    发病的只要吸入飘在空气中的病毒颗粒，就会在身体各处长满皮疹，发高烧。皮疹后期还会长得又厚又裂，密密麻麻的丘疹，最后破裂。有1/3的人会在出现症状之后3个星期内死亡。我本来想找一个天花患者典型的图片，后来发现这类图片杀伤力实在太大了，所以找了一个南瓜的示意图，大家感受一下就好了，没事千万不要自己搜索天花患者的图片。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_46_0.png)


    天花至少出现了1万年的时间，仅仅在1900年到1999年这100年间就造成了3亿人以上的死亡，这算得上是历史上最严重的疾病了。


    历史记录中第一个天花患者是公元前1149年登基的古埃及法老拉美西斯五世，这位3100年前的君王留下了一份草图文稿，上面记录了他临终时的财政状况，除此之外还记录了他在当时发病的情况，浑身起了红色的丘疹，几天之后丘疹破裂了，拉美西斯五世疼得昏不过了。很多医生给他治，治不好，这些医生也没见过这种病。后来拉美西斯五世一怒之下杀掉了好几个医生，但是也没有用，几天之后连他自己都死了。在被制成木乃伊的脸上，脖子上，还有肩膀上你都可以看到非常明显的被天花感染之后的痕迹。


    感染之后的痕迹。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_47_0.png)


    天花病毒只有2种，我们只说其中最致命的大天花病毒，这个病毒也是所有病毒中体型最大的，有300多纳米长，包含了18.6万个碱基序列，比其他那些病毒几十纳米长，几百上千个碱基序列来说要太太多了。


    天花病毒是危险级别很高的，因为它可以通过空气传播，可以通过说话、咳嗽、打喷嚏时的飞沫传到各处，可以通过脓疮结痂之后掉落的皮屑飞到各处来传播，而且病人就算没有死亡，从出疱子之前的十多天潜伏期开始，一直到出疱之后三个多星期结痂掉落，都是具有高传染性的。


    从前还发生过非常有意思的事，就是研究中世纪历史文化的考古学家在研究一本书的时候，翻呀翻翻到一页，突然发现这一页还夹着天花患者皮肤上掉落的结痂呢。当时给他吓坏了，赶紧去接种疫苗，还把结痂送去化验。好在这块700多年前的天花结痂上面的病毒已经没有活性了。


    统计概率是这样的，家里如果有天花患者的时候，其他健康人被感染的几率是50%，其中有一些人吸入了病毒也能躲过这次灾难，很可能就是因为他们的鼻涕多，病毒刚到鼻涕里就会被黏黏糊糊的蛋白裹住，又因为鼻涕特别多，所以这个人总是往下咽，病毒还没有来得及大量繁殖就被吞到胃里了，胃酸一上，一切都安全了。


    所以这也是为什么冬天才更容易感冒的原因，感冒也是因为各种病毒。空气干缩放失效的时候，鼻腔里鼻涕也少，病毒进入鼻腔就不容易被鼻涕裹住吞到肚子里，所以维持住一个湿润的鼻腔对防御那些可以通过空气传播的病毒也是很有帮助的。关于天花的其他细节知识，我们放在之后的课里说。


    ## —— 今日内容小结 ——


    这节课我们描述了天花病毒古今的观察和描述，也知道了病毒是怎么导致疾病的，这些具体知识可能对30岁以上的同学来说，只有大学里是学这个专业的才会遇到，但实际因为分子生物学的发展，这些内容现在10几岁上高中的同学应该正在学习，所以我们即便谈科学思维，也一点都不能脱离具体的知识细节。


    这节课的科学思维点，就是要借古人描述疾病是怎么产生的说明一个道理，那就是：


    如果脱离了实际的观测，对那些本来是具体的现象却只作思辨式的推演跟思考，那这些思考花再多的精力都是缺乏讨论价值的。


    ## —— 今日思考题 ——


    现在对病毒属不属于生命还是有争议的，认为不属于生命的人，他们的观点是，病毒缺少工具和工人来读取DNA，也缺少蛋白质进行新陈代谢，而且还没有任何的活动能力，所以它不是生命。还有一部分人认为它属于生命，因为它能传播生命最关键的遗传物质。


    那么我的问题就是，你怎么看待这种争论呢？


