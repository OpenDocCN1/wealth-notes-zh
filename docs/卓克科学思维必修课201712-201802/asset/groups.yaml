    # 105 | 发展：近视眼的危害只有看不清吗？


    # ——►概念11：发展◄——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    # ——►上节思考题解答◄——


    我们上节课留下的问题是，为什么医生不去追求裸眼视力高低，而只是把矫正后的视力仍然不足0.8的人当作是弱视来对待？


    原因就是，如果眼球只存在规律性的趋光度的偏差，戴一副眼镜就可以长期稳定达到很好的视力水平，那其实跟一些病被治愈是一样的。


    # ——►视网膜脱离◄——


    所以在这节课中，我们要说的近视主要是针对600度以上的高度近视，中国是全世界近视眼的人口大国，而且比例也是最高的国家。而与这个数据极不相配的是，很少有人知道近视眼除了看不清东西以外，还有什么其他的坏处，很少有人知道有哪些方法可以有效减慢近视的发展。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_35_0.png)


    在上面这张图中等你就可以看到，它是紧紧贴在眼球内侧的，我在图中还标了3个红圈，这3个地方是最容易脱落的地方。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_35_1.png)


    什么人最容易脱落呢？就是那些眼轴被拉得特别长的人。


    那什么人的眼轴拉得特别长呢？就是那些高度近视的，比如说800度，1000度的人，对这些人来说，半年检查一次眼底的情况是非常有必要的，一旦出现了视网膜脱离，危险还是挺大的，只有手术可以解决，否则就是用激光在脱离的位置重新沿着边缘烧一圈，把视网膜固定住。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_35_2.png)


    上面这张图叫做阿姆斯勒方格，这张表格里横平竖直密密麻麻排了许多方格，但这...如果当你现在看到的格子是有着扭曲的，就说明你已经发生了视网膜脱离的情况。


    # ——►减缓近视加深的方法◄——


    # ——► 减缓近视加深的方法 ◄——


    那近视了怎么办呢？


    之前我们详细说过的激光手术，它只是能让人看得更清楚，但是完全没有去除视网膜脱离这个风险。但是现在医学界还存在另外三个确认有效的方法，可以大幅减缓近视眼的发展进程。


    请注意，因为现在已经涉及到近视眼的发展进程了，也就是说明这些方法只在18岁之前坚持做才有好的效果，超过18岁也没有任何作用了。


    # 第一，在户外待足够长的时间


    这个并不是要求你在户外运动，而是保持在户外的时间足够就行，你坐在台阶上不动也一样有这样的效果。实际上户外的环境它能提供给眼睛一个完全不同的大幅度变化的动态光照环境，一般室外光线要比室内强得多，而且强度是来回来去变化的。


    虽然医学界不知道这种光照环境到底是因为什么基理预防了近视，但是统计学中，长时间的户外光线能够明显地防止近视的发展。


    长时间的户外活动，这长时间是多久呢？


    国际医学界的建议值是2小时，但实验中最短到40分钟也是有效果的。可是再看，咱们在城市生活的人，不管是学生还是上班的人，一般人很难保证每天有2小时的室外光线的环境。我们上下班都是地铁、公交车，对上班族来说下班的时候天也黑了，所以这一条听上去很普通，实际却很难做到。


    # 第二，使用阿托品类的眼药


    最早的实验是用斑马鱼做的，你别看是鱼，通过筛选，也能从中找出一些患了近视眼的鱼，然后就把一定量的阿托品加到鱼缸里，观察不同浓度下，鱼眼睛的凸出程度，凸得越厉害就表明它的近视程度越严重。后来就发现，加了阿托品药水之后，鱼眼凸的程度减缓了。这个实验后来也在人体上做过，经过了10年的观察，是安全有效的，哪怕是浓度降到很低很低，也是有效的。


    不过，这个眼药水是存在一些问题的，它能达到减缓近视发育的浓度是1%，这样的效果非常好。可是一个人是不能长期用1%这个浓度的，因为上节课我们说过散瞳的过程，散瞳就是1%的浓度连续滴3天。那现在用来减缓近视的发展，结果天天都是散瞳的状态，哪哪都看不清，还怕光，这都影响正常生活了。


    所以，真正长期用药的时候，用的阿托品的浓度是0.01%的浓度，这个浓度也依然有效果，但是仍然存在一个问题，就是一旦停药，近视的情况会反弹的，而且反弹起来会比之前不用药还严重。所以一旦使用阿托品的药物，要有毅力，坚持点。


    # 第三，使用OK镜


    OK镜的问题我曾经回答过，在这儿就不多说了，欢迎你点击下面的附加资料进行复习。


    附加资料：078 | 问答：近视怎么治疗？带病痊愈怎么处理？


    所以综合起来，对一个还没有成年的孩子来说，假如偏巧父母全都是双眼600度以上的高高度近视，那么大概率说，孩子是高度近视的可能性是非常非常高的，如果父母懂得以上这些知识，让孩子从3、4岁开始，每天都佩戴OK镜，而且注意多安排他一些室外的运动。比如说参加足球队的训练，而且还能天天点阿托品的眼药，坚持15年之后，可能在这个孩子成年之后，度数仅仅增加了200度，而不是1000多度。这个就等于是用知识跟毅力尽最大的努力，把度数增长的趋势减缓了。这种持续不懈的防治工作只能够坚持到20岁，眼睛定型了就算是大功告成了。


