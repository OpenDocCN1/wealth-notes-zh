    但是这个计划很快就没钱了，下一次挖掘就要等到上世纪80年代末了，那次是美国和欧洲的科学家联合花了5年的时间，挖得特别深，挖出了两段3000多米深的冰芯。当然这个冰柱可以信赖的时间跨度不是无限长的，比如说南极的冰盖它是3000万年前形成的，南极的冰盖厚度是4000多米深，但是冰层有时候到了最底下的时候会因为压力产生切向的滑动，就会导致年岁的错位了。所以这冰柱现在最长的可信年岁大约是在13万到15万年左右。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_6_3.png)


    我也找了一些最近几年在南极挖冰芯的开挖的场景，大家可以感受一下这些科学家的执着。


    ### ——◆ 新仙女木事件起因 ◆——


    这次剧烈的灾难为什么发生呢？


    现在有两种说法：


    第一种，叫做温盐环流理论。


    说的就是在灾难之前，不是曾经有过一阵子全球变暖嘛，就是这段变暖破坏了维系已久的海洋环流。曾经北大西洋的海水因为温度低，所以浓度比较高，它就会沉到海底，在海底有一个巨大的流动的趋势，它趋向于往赤道附近扩散。那么海底有这个方向的流动，海面就有一个反方向的补充的趋势，所以就会把温暖的赤道的海水补充到北大西洋去。


    从另一个角度看，这就相当于用大量的海水把赤道温暖的热量送到极地附近，但因为全球变暖的趋势，让北大西洋的海水盐分没有那么高了，于是从海底流向赤道的这个趋势逐渐就弱下来了，底下不流了，赤道表层的水也就不再补充过去了。所以赤道洋流不再流到其他地方去，热量就过不去了。所以别看全球是在变暖的趋势，极地反而是更冷的，这个是一种假说，现在也
    没法证实。


    第二种，是假设一颗彗星撞击到北美大陆，导致冰川融化，消失之后影响了环流，然后环流的理论和刚才还是一样的。


    既然说彗星撞击，那起码得找到撞击的大坑和彗星上遗撒的物质，也确实找到了，北美的很多地层在那个时期都有薄薄的一层纳米金刚石，这种物质是在以碳为主要元素的彗星撞击后才能形成的，地球上通过自然环境自然形成的压力不会出现这种纳米金刚石，所以这也算是一个不小的证据，现在在科学界信第二种说法的占多数。


    ### ——◆ 事件的后续影响 ◆——


    这次事件发生之后，冻了1300多年，但是它的终结也同样剧烈，现在可以统计到的数据终结的数据也是通过深挖格陵兰地区的冰芯，统计冰芯中氧同位素含量得到的。


    它的恢复虽然没有冻结那么快，冻住只用10年就冻上了，但是相比冻结1300年，恢复期只用了大概不到100年，几十年就完成了，这几十年温度又提升了8度。


