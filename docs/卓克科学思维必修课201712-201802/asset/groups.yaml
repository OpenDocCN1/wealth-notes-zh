    ## 复习+预告 | 人类祖先的故事


    ## ——◆ 本周课程复习 ◆——


    ## 概念12: 旁证


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    133 | 旁证: 猫为什么那么孤冷?


    - 1. 猫以糟蹋粮食的老鼠为食，体型小对人类不构成威胁，因此在人类群落周围获得了稳定的食物来源和生存空间，这种生存机会的专有名词，叫做生态位。

    - 2. 家猫的祖先非洲野猫是独居动物，与人类共同生活时也依赖于自己捕食，因此没有形成对人类的忠诚和依赖，这可以理解为猫总是那么孤冷的原因。

    - 3. 非洲野猫最早占领了与人类共同生活的“生态位”，它们跟随人类祖先迁徙到全球各地，让其他野猫没有了机会。


    134 | 旁证: 狗是怎么出现的?


    - 1. 人和狗是在互惠互利的关系中“共生进化”的，人为狗提供食物，而狗提高了人类的狩猎成功率、休息时的安全性、放牧的生产率等。

    - 2. 人委派给狗的任务多种多样，为了执行不同的任务，在优选的过程中造成狗的差异越来越大。

    - 3. 在驯化狗的过程中，展现出幼态延续的个体被保留下来，它们对人类既忠诚又依赖。

    - 4. 幼态延续，是指因为环境改变和基因突变，狗中的有些个体即使到了成年，幼年的特点不会消失，而且还非常明显。


    135 | 旁证: 乌龟为什么长寿?


    生活中的一些问题存在“错误的题设”，比如龟为什么长寿？这个问题，实际上龟有很多种，有些寿命短，有些长。这种问题看似无需深究，但只有掌握了科学的思考习惯，才能更好地察觉常见问题中的错误，获取有价值的信息和知识。


    136 | 旁证: 人类是怎么分布到全球的?


    - 1. 曾经广泛分布在地球表面上的生物，都曾经大幅改变地球表面的化学成分，造成气候变化，带来灭顶之灾。

    - 2. 大气环境和海平面的大幅度变化，是一种天然的物种大过滤，元谋人、蓝田人、北京猿人都是这样走向灭绝的。

    - 3. 通过DNA分析技术，科学家们确认了人类起源于非洲。

    - 4. 科学研究中应该排除情感因素，科学的价值在于它的结论源于有事实的基础。


    ## 答疑时间


    137 | 问答: 人和黑猩猩的基因只有1%差异?


    - 1. 人跟黑猩猩有99%的相似度，说的是“人跟黑猩猩体内多肽的检测发现，平均来说，有99%以上都是相同的”，但这是1975年的研究结论，当时只比较了40多个多肽，而人体至少有不低于10万种。

    - 2. 在不同的对比方法下，基因相似度的弹性空间比较大，比如现在的研究结果，是人跟黑猩猩在基因序列上相似度在72%到89%之间。

    - 3. 一个问题要有像样的答案，就要仔细琢磨问题中出现的每一个词语的含义。


    138 | 问答: 献血对身体有害处吗?


