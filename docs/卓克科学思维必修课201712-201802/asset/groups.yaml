    比如过快分布就会导致什么呢？冰和水重新分布，直接导致微生物的种类和数量剧烈变化。微生物的剧变直接就导致植物的剧变，植物的剧变又导致食草性动物的剧变，然后就是那些食肉性动物和杂食性动物的剧变。


