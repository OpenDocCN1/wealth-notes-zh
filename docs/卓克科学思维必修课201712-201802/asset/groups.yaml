    # 117 | 发展：HIV和白血病都杀不死的人


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_62_0.png)


    117 | 发展：HIV和白血病...


    ## —— ◇ 概念11：发展 ◇ ——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓宽了生命的范畴，缩小了死亡的边界。


    ## —— ◇ 上节思考题解答 ◇ ——


    昨天的课最后我留了一个小问题，就是非凡控制者最初为什么非常难找呢？


    这个是需要设身处地考虑的，因为，你想本身感染 HIV 的人占的比例就不高，凡是感染之后能让医生接触到的，那几乎都是去参与治疗的。


    那非凡控制者是什么人呢？


    他是不做任何治疗，也不发病的人。既然不做治疗，医生跟研究者就很难接触到他们了，而且不治疗也不发病的人，他自己可能都意识不到自己是感染者。你想没事跑去找医生，去查自己是不是
    HIV 感染者呢？所以，虽然这类人一直以一个稳定的比例存在，但是研究艾滋病10几年来，人们才注意到了这类奇人的存在。说这个其实也在提示我们，选取科研对象的时候是存在选择偏差的。


    ## —— ◇ 感染 HIV ◇ ——


    上节课我们说的是非凡控制者，他们即使感染了 HIV 病毒都不会发病，只不过比例很小，300个感染者里才有1个是这样的，但其实还有一个人比他们所有人都要幸运，因为这个人在治疗艾滋病的过程中还查出了白血病，但后来两种病全都治好了。


    我们今天就来谈谈这个人，叫提摩西·布朗。


    他是一个男同性恋，刚刚成年的时候，艾滋病也刚刚开始在美国爆发，也刚刚被国际医学界重视，年近30的时候，曾经同志圈里的人有不少都因为艾滋病去世了。1995年3月份，他的前男友也去世了，他怀着悲痛的心情参加葬礼，悲痛不只是因为失去了前男友，更因为他的前男友是因为艾滋病去世的，所以他自己也危险了。去医院一检查，真是
    HIV 阳性。之后，他的反应跟其他的患者很不一样，他把消息尽量广泛地公开了出去，包括他的家人、同事、朋友，全都知道了，甚至连他现任的男友也都知道了。


    提摩西感染确诊的时候是1995年，而人类对艾滋病开始有了比较有效的控制手段，最早出现在1996年，也就是说提摩西的运气还不错，那个时候采用的方法大家可能都听说过，叫做鸡尾酒疗法。NBA
    著名的控卫“魔术师”约翰逊也是因为这种疗法的出现，所以到了今天还没有发病呢。


    这种疗法并不是喝鸡尾酒，而是因为鸡尾酒的那种方法，就是把几种混合物都放在一起的形式，跟治疗的方法很像，这种治疗用的是好几种抗逆转录病毒的药，有的是降低 DNA
    的复制，有的是降低 RNA 的转录，有的是降低对应蛋白酶的活性。


    如果简单地说，就是把 HIV 病毒复制的过程中的很多环节的蛋白质工人都给它们停工了，工人不干活，HIV 病毒复制就很慢。但这些药也并不只是针对 HIV 病毒，也多少作用在人体细胞上，所以人体细胞的更新换代、修复也会减缓，所以多少也会有些副作用。


    上节课我们说过，HIV 病毒经常变异，它的变异是在药物环境跟免疫环境的双重压力下呈现出来的选择性，这种环境压力的演化跟细菌产生抗药性是差不多的，比如说一次大规模的杀伤性攻击，总会有十亿分之一的病毒因为结构上的优势活下来了，那之后的一两个月里，这个新外壳的
    HIV 病毒就成了主力军，上一次使用的药跟免疫系统的记忆对它就都没用了。


    面对这种困难怎么办呢？


    就是同时使用3到4种抗病毒的药物，虽然病毒针对其中任何一种药物都有十亿分之一的存活率，但假如4种药一起上，那它几乎就逃不过去了。


    但病毒还是会有一些一直蛰伏在细胞内部，随时等待时机，所以即使使用了鸡尾酒疗法，病人也最终带着比较低量的病毒。提摩西就这样吃着药，定期去检查身体，以为就会这样此一生。


    ## —— ◇ 患上白血病 ◇ ——


    没想到11年后的2006年，在他的又一次体检中，医生告诉他了一个更坏的消息，他患了白血病，而且还是生存率不太高的，骨髓移植效果不太好的那种分型。


    白血病分类

    急性白血病 | 分型 | 亚型 | 备注

    急性淋巴细胞白血病(ALL) | ...


    目前给白血病按照癌症细胞分类的方法，其中只有标注了红块的这部分白血病是有高治愈率的，一般是发生在几岁的儿童身上。发达国家针对红块类这种白血病是有90%以上的治愈率的，其他的白血病在去年出现CAR-T疗法之前，治愈率都是很低的。


    提摩西患的白血病就是这个表格里的第一行，也是成年人白血病最常见的类型，存活率非常低，叫急性髓细胞白血病，当时在美国即便做了骨髓移植，5年生存率也是25%。


    本来自己就是 HIV 的感染者，现在又得了白血病。


    ## —— ◇ 骨髓移植 ◇ ——


    不过这个人独特的性格让他坚持下来了，比较乐观。11年前他感染了 HIV 的时候，他就跟其他的患者不一样，他到处公布自己的患病消息。这次他跟他的男朋友商量好之后，就决定按部就班地做治疗。


    治疗要冒很大的风险，首先就是得把鸡尾酒疗法停掉，然后再做几个月的化疗，结果白细胞的数量根本就没有控制住，后来又调整了治疗方案，就想尝试骨髓移植，即便移植，复发率也有50%，但是他还是做了。


    骨髓移植是什么呢？


    这个我要多说两句，骨髓就是骨头里中空的那部分，填充的那些东西。有地方还会把骨头专门敲碎了，吃里面的骨髓，像烤骨髓，这是世界各地都有的名菜。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_62_1.png)


    骨髓是一个重要的免疫器官，人体血液中的很多细胞，比如像红细胞、粒细胞、单核细胞、巨噬细胞、血小板、淋巴 T 细胞跟淋巴 B 细胞，它们的早期发育都是在骨髓里完成的，然后才进入了血液，骨髓移植就是要把这里的细胞全部换掉。


    既然说换掉，首先就得把从前的骨髓清理干净，一般是用大量毒素加上放射性的照射，让它们尽量彻底地死亡，这个时候病人的免疫力就相当于零了。这也等于把病人推上了死亡的边缘，然后再把配型合适的骨髓输进来，让新植入的骨髓产生病人血液里所需的各种细胞，等这些量再稳定了，这次骨髓移植就算大功告成。


    除了要迈过这个恢复的门槛，还有一个更关键的，就是能不能有合适的配型呢？有很多病人最终等了几年都没有合适的配型，就这么死了。


    但提摩西是很有幸的，德国当时有非常完善的骨髓信息库，对他来说配型合适的当时就找到了260多个人，那选谁呢？他的主治医生就突然灵机一动，他就想既然治疗白血病是骨髓的重建，那这样一来，免疫系统就相当于重建了，而提摩西从前身体里常的那些
    HIV 病毒，它们本质上就是免疫系统上的缺陷，就是辅助 T 细胞有毛病了。


    现在骨髓移植，辅助 T 细胞是不是也有机会重新换掉呢？


    而且，他在治疗艾滋病的这些年，还听说过几种类型的患者是不会发病的，他们是基因变异类型的病人，如果用这些人的骨髓给他移植，那说不定白血病跟艾滋病就一起治好了。


    ## ——♦ 消灭 HIV ♦——


    我们上节课说的非凡控制者是其中一种，就是说接触了病毒，但不会感染。


    其实还有一种，叫做 CCR5-Δ32。


    这种变异者，他们携带了一种突变基因，就会导致辅助 T 细胞的细胞膜上供 HIV 病毒结合的那个位置总是结合不牢，总会是松动的，HIV 病毒的膜总是还没来得及跟细胞膜融合，这两者就脱离开了，所以
    HIV 病毒总是没法进到里面去感染它。


    而且很巧的是，产生这个突变的人虽然身体上缺少了一种蛋白质，但是并不会出现什么病症，所以是可以尝试的。


    ## ——♦ 幸运的提摩西 ♦——


    但是，现在还不能高兴太早，因为还得担心他白血病的部分，因为这种骨髓移植5年的生存率只有25%。结果过了10个月，真的出状况了，提摩西的白血病复发了。从医学统计上看，这个类型的白血病如果再做第二次骨髓移植，那他之后的5年生存率就只有10%了。


    那他做不做呢？


    ## ——♦ 今日内容小结 ♦——


    我们对比来看，在学校阶段，我们遇到的各种安排都是教学体系，按照学生认知发展的规律定制的，所以你只要是按部就班地进行，不特地跟学校对着干，大部分的体验是成功的、是顺利的，只要脱离了这个体系就会有短暂的不适应。


    ## ——♦ 今日思考题 ♦——


    在你的生活中可有没有哪些事是这样的呢？就是有人一直依据科学精神、科学规律做事情，最后把一个不可能的事做成了呢？


    如果你想到了，就留在评论中。


    ## 划重点


    + 1. 研究艾滋病10几年后科学家们才发现“非凡控制者”，这就提示我们，选取科研对象的时候，是存在选择偏差的，所以得出的结论也是相对准确的。因为，在科学研究中，水准最好的，也只是尚未被证明存在错误而已。
    2. 仅仅因为理论上的成功概率不为0，科学家们就会做出努力和尝试，而这其实就是科研的常态。


    卓克

    我是卓克，咱们明天再见！


    # 118 | 发展：可以和植物人交谈吗？


    ## ——►概念11：发展◄——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    ## ——►植物人有很多种◄——


    植物人在大家印象中都是那些已经被宣布脑死亡的，或者已经失去了高级思考活动的，但是身体器官还能自己维持，或者是通过医疗器械正常工作的那些人，他们的心跳和血压还有。


    但这些已经是过时的知识了，因为植物人这个形容实在是太笼统了，植物人与植物人之间的差距，就好像足球运动员跟棋迷选手之间的差距那么大。


    植物人中有非常严重的，举个例子，比如以色列的此前理沙龙，他在2006年因为脑血管的中风倒下了，到了2014年才去世，中间这7年多的时间里他一直处于深度的昏迷，只能靠插着各种管子，人工补充养分。


    他之前是因为中风昏迷的，所以大脑供血受损了，所以在漫长的7年多时间里，绝大部分的脑已经萎缩了，留下来正常的部分只有脑干。也正因为脑干负责了最基础的生理功能，比如控制心跳快慢、呼吸的节奏、还有基础体温等等这些功能，所以沙龙这种就属于是最严重的植物人。


    还有一些植物人从外观上看起来就跟沙龙不太一样，他们好像没有遭受过重创，躺在床上还可以睁眼、闭眼，有时候眼球还会环视四周，但是他们却完全没有任何内心的活动迹象，你跟他说话，你摇晃他，你摇晃他的手，他都没有任何的回应，也就是对外界的刺激完全失去反应了。


    ## ——►大脑清醒的植物人◄——


    他们之间到底有什么区别呢？


    1997年的时候，神经科学家艾德里安·欧文对一个病情较轻的植物人患者凯特·班布里奇做了研究，这个女生在26岁之前一直是剑桥的一位老师，后来因为一次病毒感染就昏迷了，昏迷之后就再也没有醒过来，就成了植物人。但是她躺在病床上，眼球就可以动。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_64_0.png)


    科学家们就看看她的大脑是不是一点反应都没有了，就采用了正电子发射断层扫描这种技术，观察她大脑各个区的活动。


    这个技术实际测的是葡萄糖代谢速度的高低，一般来说代谢速度高的那些地方，就代表那里正在活跃。因为这是动态实时显示的，所以侦测大脑的变化很合适。


    从前的脑科学家也做过很多的测试，比如说读经思维的时候哪个脑区更活跃呢，或识别面孔的时候哪儿更活跃呢，或者恐惧的时候哪儿更活跃呢，这些结果都是从正常人的反应中收集过来的。


    当把凯特送进去检测的时候就发现，如果在她面前的屏幕里显示出她的家人，或者是她从前养过的那只猫的照片的时候，凯特的大脑活动跟正常的人看到爱人的时候大脑活动的迹象惊人地相似。


    为了彻底弄清，艾德里安又给凯特设计了一个实验，在监控她大脑的同时，给她念两段文字：


    + 第一段文字是一篇散文；

    第二段文字是一些单词任意拼凑出来的，没有任何意义。


    我给大家举个例子，比如就是这样的：


    > “通想话地刷，否则能人病京法，零对令指区脑床。”


    就是这样无意义的话，结果发现凯特的大脑只在听到散文的时候语言区才会异常活跃，而听到无意义的话的时候是不会有任何变化的。


    难道这说明她只是肌肉不能活动，人却是清醒的吗？


    艾德里安后来又设计了一个验证的实验，他征集了几个麻醉师，给他们麻醉，让他们完全失去意识之后再给这些麻醉师念了同样的两段文字，一段是散文，一段是毫无意义的文字，结果就发现，这些麻醉师跟凯特的反应也是高度一致的，也是念散文的时候语言区高度活跃，念无意义的文字的时候他们没有反应。


    这就挺让人失望的，因为他已经让麻醉师失去意识了，这就说明人的大脑都是这样的，语言区会自动地对语言产生应答，不论这个人是否清醒，是否意识到这段语言文字的意义了。所以，凯特也许只是一个完全失去意识的人。


    但是这位神经科学家还没有放弃，他想再试试。


    比如有些渐冻人，他的肌肉已经不能动了，只能眨眼，和他交流就可以用一些特殊的方式。比如告诉这个渐冻人，我一会儿要问你两个问题，如果你想回答是，你就眨一下眼，如果你想回答不是你就眨两下眼。


    那么现在他就要把凯特当做是这个渐冻人。


    但是凯特比渐冻人还要严重得多呀，她眨眼都不能眨了，那怎么办呢？


    艾德里安的团队用的方法就是，让凯特分别想象两种活动：


    + 一种是在脑中想象激烈地打网球；

    一种是在脑中想象在家里各个屋子里闲逛。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_64_1.png)


    大家现在也可以自己来设想一下自己在打网球的时候，比如怎么挥的球拍，怎么发球啊，怎么追这个球啊，也可以想想自己在家里闲逛的时候是怎么从厨房游逛到卧室的。其实当你在这么想的时候，你大脑中分别有两个独立的区域开始高度地活跃了：


    + 打网球能激活运动皮层，因为这里负责运动；

    闲逛的时候会激活顶叶跟海马旁回，因为这里负责导航。


    那么艾德里安这种方法就是：


    + 让病人想象自己在打网球，来表示病人要回答“是”；

    让病人想象自己在家里闲逛，来表示病人要回答“不是”。


    结果他们一共试了23个植物人，其中有4个人能顺利地完成任务，他们能达到什么程度呢？


    比如问他，你父亲的名字是不是叫爱因斯坦呢？病人的顶叶跟海马旁回就活跃了，那就像代表不是。然然后问，你父亲的名字是不是叫雷华德呢？结果运动皮层开始活跃起来，也就意味着他回答是。


    有些人还能回答类似这样的问题，就是你上一次度假去过的最后一个地名是不是某某某，他也能回答是与不是。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_64_2.png)


    上面是一张核磁共振的图，大家可以看看这两个区域分别在什么位置，跟对应的反应是什么样的。这张图上面一组是正常人对实验的反应，下面一组是病情较轻的植物人的反应，因为这两个区域在大脑里的


    植物人的反应，因为这两个区域在大脑里的物理空间上差着一定的尺寸呢，所以不会弄混。


    植物人的这些反应让艾德里安的团队很震惊，比如就拿上一次最后在哪度假这个问题来说，实际它已经很复杂了，因为它涉及到判断、记忆、选择，好几种思维能力，而且这些病人很多都是失去意识几年了，但他们还能清晰地记得几年之前的事。


    艾德里安在整个研究中接触了很多植物人，统计之后就发现有这样程度反应的病人大约占总数的1/5，他也发现在实验之后，医生跟护士也明显对这样的病人照顾得更好了，不再把他们当做是一具只有生命体征的身体了，而是更主动地跟病人有了更多的交流。


    ## ——♦ 让植物人与外界沟通 ♦——


    每次实验，艾德里安都小心翼翼地把病人用救护车运到研究室，因为只有在这儿才能做核磁共振，或者正电子断层扫描。之后再给运回去。但是非常遗憾的是，只要送回到病房，这个病人就再也不能通过这些昂贵的仪器跟外界有什么交流了。


    艾德里安的团队就在想，能不能设计一种便宜的方法，让病人在病房或者家里休养的时候，也能跟外界沟通呢？


    其实脑电图是最好用的，它就是用好几个电极贴在头上，然后来检测10几个区域的电信号。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_65_0.png)


    但是因为测量脑电波，这实在是比前两种测量太间接了，所以要想确认某种波形的组合，确确实实代表打网球，某种波形组合确实实代表在家里闲逛，这误差特别大。而且这种识别是需要很专业的知识才能办到的。


    后来艾德里安的团队专门为此还设计了一套算法，电脑通过这些图形可以直接输出结果，就不用再凭借个人的经验来识别了。至此，很多植物人的家属跟医生都可以独立使用了。


    ## ——♦ 科学的作用 ♦——


    中国今天一共有40万的植物人，全世界有150万左右，如果按艾德里安长期实验中测到的这个结果，那中国应该有8万人，全世界有30万人，他们实际上是有意识的。


    但是，他们的灵魂被锁在自己的身体里了，他们在那个身体里是清醒的，可以听到朋友们的告别，亲人们的呼唤跟哭泣，但是作出任何的回应。久而久之，医生、护士、家人朋友也会逐渐失去希望，就好像对待一株植物一样对待他们。这种巨大的精神折磨甚至比蹲监狱还要难过，可以想象其中不少人已经被折磨出精神疾病了，但即便他们精神分裂了，也没有人知道。


    还有一些植物人是因为车祸或者外伤导致的，他们除了脑部受伤，身体其他部位也有伤。身上会有长期剧烈的疼痛，但也只有他们自己知道。哪怕只是翻一下身就能舒服一些的小事，他们可能都要忍耐很久很久才能等待下一次机会，护士帮他翻身，这种疼痛才能缓解。


    还有一些植物人就更悲惨了，因为长期被困在这个躯壳里，实在难以忍受精神上的折磨，希望家人停止供氧系统，帮他放弃生命。我们暂且不论这种想法在伦理审核上能不能通过，但是现在，这些信息我们已经可以跟患者交流了，能更好地安抚他们的精神世界。


    人们常问科学有什么用，在这个例子里，我们能说有了科学技术之后，用处就在于能跟植物人沟通了吗？


    这确实是其中一个作用，但这弱化了科学的用处。在这个典型的案例里，科学实际上拓展了生命的范畴，缩小了死亡的边界。从前虽然有些家属坚持不懈地跟植物人讲话、聊天，但那更多是出于情感因素。现在家属已经确切地知道病人可以听懂，可以理解他的话了。于是，这个人就不再被列为脑死亡了。


    之前的课对大脑性别的研究，可以让我们更理智地看待跨性别别人，那今天这节课对大脑活动的探查，让我们有机会更公平地对待植物人，我想这就是科学的作用吧。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_65_1.png)


    最后，我给大家看一个 GIF 的动图，就是这节课开头我们提到的那个英国女教师凯特，她在昏迷了大半年之后才参与了这个项目，她的意识在研究过程中也逐渐地变强，最终在研究结束之后的3个月醒了过来。


    她虽然到现在还不能说话，但是已经可以用手指着字母，把要说的内容表达出来了。这张 GIF 图就是她协助 BBC 拍摄的一部关于植物人的纪录片中介绍自己的部分。如果大家感兴趣，可以去搜索‘Kate''s
    Story’这个关键词，那里她描述了自己变成植物人之后的感受。


    ## ——♦ 今日思考题 ♦——


    我之前提过，人失去意识的时候，比如说被麻醉了以后，大脑的语言区仍然会对语言激活作出反应，那你对这个事实有什么想法吗？比如说你可以往这个方向想想，我们作出的任何判断是基于哪些素材呢？


    如果你有什么想说的，就留在评论中。


    ## 划重点


    + 1.很多人常问科学有什么用？在植物人这个典型案例里，科学实际上安抚了被禁锢的灵魂、拓展了生命的范畴、缩小了死亡的边界。

    2.中国的40万植物人中，预估有约8万人是有意识的，但他们的灵魂被身体锁住，无法与外界交流。科学技术的进步给他们带来了希望。


    卓克

    我是卓克，咱们明天再见。

