    ## 121 | 发展：史上最严重的一次流感（有福利）


    ### ——►概念11：发展◄——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    ### ——►青壮年的高死亡率◄——


    前几节课，我们详细说过天花这种病，它是一种在时间分布跟空间分布上都非常平等的传染病，1万年来一直跟随着我们，今天我们要说的不是它，它是一种典型的分布不均的疾病，这次流感从1918年初开始到1920年末结束，接近3年的时间里，大面积地流行，染病总数一共5亿到10亿人，占当时全球人口的30%到60%，爆发的
    前半年就死了2500万人，3年下来的总死亡数是4000万到5000万人。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_73_0.png)


    有流行病学家作了一个很好的对比，这次流感在前24个星期里造成的死亡数比艾滋病在24年里造成的死亡总数还要多，所以可以这样说，这次的流感凶猛程度是艾滋病的50倍。这次流感的死亡率是5%左右，而普通流感的死亡率是千分之一。整个第一次世界大战的伤亡总数是3700万，死亡1600万，而且在一战的死亡人口中还有一半左右是因为大流感死亡的，所以这场大流感至少相当于打了三次一战导致的军民死亡。


    这场流感还有一个不同，就是年龄在20岁到40岁的青壮年的死亡率是非常高的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_73_1.png)


    虚线是同一时期普通流感在不同年龄阶段的死亡率，每10万人的死亡情况，大家可以看到，凡是4岁以下，70岁以上这都是很高的，这跟绝大多数的疾病特征都是吻合的，因为刚出生的婴儿免疫系统还没有建立完善，对疾病的抵抗能力差，70岁以上的老人，身体功能已经开始衰退了，对疾病的抵抗力也不好，所以死亡率高。


    但我们来看实线，在25到34岁这个年龄阶段形成了一个高峰，而一般来说，这个年龄段都是身体最棒的时候，免疫力也是最好的时候，疾病的死亡率本来应该最低才对。


    这节课，它就是我们的主线，我们最终要回答这个问题。


    这个原因从表面上看可以归结为一战中因为士兵的召集、集结，所以更有利于病毒感染年轻的士兵，所以这部分贡献是士兵产生的。可实际统计下来就发现，在平民中，年轻人的死亡率也有这个趋势，所以虽然士兵聚集是其中一个因素，但这次的流感确实更容易导致年轻人的死亡，这个问题我们之后来解释，为什么在这次流感中，免疫系统更完善的人死亡率更高。


    以上这些就是俯瞰这次灾难全局得到的情况，这个也是一种理性看问题习惯。如果你要评价一个重大事件的影响，一定不能始终埋头在细枝末节上，一定要尽力去找它在全局上的统计数据。


    我们再列举几个人类历史上巨大的传染病，咱们可以跟这次大流感对比一下：


    14世纪爆发的黑死病，它在4年的时间里造成了2500万欧洲人死亡，并且在全世界其他地区造成了3700万人的死亡，甚至因此还动摇了欧洲的宗教信仰，产生了文艺复兴的思想基础。


    公元542年的东罗马帝国查士丁尼大瘟疫，这个大约在50年里造成了1亿人口的死亡。


    但是大流感相比它们都更猛烈，因为它在出现之后的120天就造成了2000万人死亡。


    ### ——►1918大流感病毒◄——


    究竟是什么导致这次大流感呢？


    想查清这件事情还真是费了极大劲，这次疫情在1920年就差不多过去了，虽然在一战之前人类就知道有一种病原体比细菌小得多得多，但那个时候没有电子显微镜，所以看不到这种病原体。直到1933年，三位英国科学家第一次分离出流感病毒，才知道原来过往历史里让我们鼻塞，发低烧，1周左右就好的那种病是由这个东西引起的。


    当时在实验室里就给这株病毒起名H1N1。


    - H就代表病毒外壳中的其中一种蛋白质，叫血凝素；

    - N代表外壳上另一种蛋白质，叫神经氨酸酶。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_73_2.png)


    到现在为止，人类一共发现了16种血凝素和9种神经氨酸酶，第一种被发现的流感就叫H1N1，按序号排，像H16N9这种流感病毒一定是最后期才发现的。


    外壳上那些绿色的小蘑菇就是血凝素，红色大头针一样的就是神经氨酸酶。


    当人们第一次分离出病毒之后，就开始有人利用新的工具去查1918年流感中传播的那个病毒到底是什么样的。但大流感发病的时候，人们不知道怎么保留病毒的原体，今后好研究用。当时都担心尸体引发继续的感染，所以一律是火化处理，就算那些没火化的，病毒过了这几十年也早就没有活性了。所以这也导致后来70多年里，医学进展虽然很大，但是对这次的灾难没有任何进一步的了解。


    第一步的推进发生在80年后的1998年，美国国防病毒中心在 阿拉斯加分部的研究人员就向当地爱斯基摩人的市政府争取到了一个批文，什么批文啊？就是打开一个墓穴的批文，那里埋着1918年因为大流感去世的一家三口，科学家们就想从他们身上取一些样本。


    当年这个流感几乎是蔓延了全球，死亡率最高地区就是爱斯基摩人这里，统计是25%的死亡率，当时全球死亡率是5%左右。那么希望采集活体的样本，这个事还真得在北极圈干才行，因为这里气温低，坟墓都在冻土层里，这冻土层也不是一年四季都冻，它大部分时间是冻上的，但是爱斯基摩人住的地方也有短暂的夏天，这个墓穴深埋地下，就有可能没腐烂。


    结果把墓穴掀起来的时候就发现，三具尸体，其中两具早就腐坏了，只剩下了骷髅骨架，你想毕竟80年过去了。但是另外一具仍然保持得很好，这具是一个胖女人，她去世前非常胖，在体内堆积了大量的脂肪，特别厚，这个就可以隔热，就
    可以防止她在短暂的夏天脂肪下面的组织腐烂。于是就取出了她肺部的一些组织回来分析，最终目标就是要把这个流感的RNA片段给测序出来。


    分析的过程那就漫长了，因为那是1998年，你想人类基因组测序是1990年才启动的，几乎动用了全世界所有重点的分子生物实验室的力量才能测完。所以测1918流感RNA的测序用了9年的时间。


    - 2000年，测出来了神经氨酸酶对应的序列；

    - 2001年，测出了非编码区的序列；

    - 2002年，测出了基质部分的序列；

    - 2004年，测出了核蛋白部分的序列；

    - 2005年，测出来了三种聚合酶的序列。


    至此，90年前让几千万人死亡的病毒元凶长什么样终于一探究竟了。


    ### ——◄ 凶手：NS1毒蛋白 ►——


    兜了这么一大圈，我们才回到了起点，才开始着手解决那个问题，就是病毒为什么会导致年轻人的高死亡率？


    在2007年的时候，加拿大公共卫生署的科学家卡巴萨重建了1918年的病毒，用它来感染了7只猩猩，又用2007年流行的H1N1的流感病毒感染了另外3只猩猩，作为对照组。


    把这两个组一对比就发现，这10只猴子在初期都激起了它们免疫系统的强烈反应，但是3天之后，感染了现代这个H1N1的流感病毒的3只猴子体内的病毒慢慢就减少了，症状逐渐减轻，慢慢就恢复了。


    可是，另外7只感染了1918年大流感病毒的猴子，免疫反应的强烈程度是不可抑制地增长，它们的肺部组织都出现了严重的损害。


    进一步分析就找到了原因，1918年大流感病毒里，包含了一种编号是NS1的病毒蛋白，它能调控人体对病毒的免疫强度，调整免疫强度像HIV这个病毒也可以，它是让我们失去保护，是反方向的，把免疫强度调弱。


    可是NS1毒蛋白，是让免疫反应持续地增强。那些青壮年之所以死亡率很高，就是因为他们的免疫系统功能完善了，比较强，被病毒蛋白给利用了，所以免疫系统在发病之后非但没能保护住身体，反而成为了致死的原因。


    ### ——◄ 危险的H5N1禽流感 ►——


    所以，一旦这种类型的病毒再出现，正确的治疗方法也应该至少包括从一开始就要抑制住过度兴奋的免疫系统，如果不知道这一条，百年前的 大流感一旦复活，杀伤力依然是很大的。


    其实这个病毒的表亲已经来过了，加拿大这组科学家之所以研究1918年的大流感病毒，就是因为他们发现07年出现的H5N1禽流感跟1918年大流感在病情描述上非常相像，虽然外壳的血凝素这两种不一样，但是它不重要，重要的是2007年H5N1禽流感中也存在NS1这种偷偷调控免疫强度的毒蛋白。


    现在的统计是，从2003年到2017年这14年里，全世界一共出现了859个病例感染了H5N1禽流感，它们都是鸟传染给人的，但是死亡率超高，有53%，是欧洲大流感死亡率的10倍。


    所以，这也是为什么H5N1禽流感感染的人数如此之少，可世界各国都极为重视的原因，因为它一旦在基因上突变，或者说平移，产生了能在人与人之间传播的特性，那将会是一个世界人口3年里减半的威胁。


    ### ——◄ 今日内容小结 ►——


    听过这节课跟这一阶段的医学相关的课，不知道你发现了没有，医学跟生物学在2000年以后就进入了一个新的阶段，不论是我们对文化历史证据的深究，还是对某个传染病致死原因的研究，或者是对治疗方法的改进，都已经离不开遗传物质里的信息了。而能更方便、更低成本地测序，这还是2015以后的事。


    在一九九几年的時候就聽人說，21世紀是分子生物學的世紀，當年我高考的時候，有不少成績最好的同學報考的都是清華、北大的生物工程，但是他們在2010年之前拿到了很高階的學位，卻找不到工作了，其實這並不代表21世紀不是分子生物學的世紀，而是這前10年可能還不是。


    現在，越來越多的中小規模的生物科技公司可以借助一個狹窄領域的研發優勢成為獨角獸公司，這方面的內容我也推薦咱們得到的王煜全老師的專欄，他就有一個系列介紹最新的生物科技公司。我想這些觀念上的提升，不論是對正在上學的你選專業，還是對正在投資的你選股票都有直接的好處。


    ### ——◄ 今日思考题 ►——


    从1918年之后，世界上就没有再出现过全球性的、短时间内、导致大量死亡的传染病。比如说 什么叫大量呢，就是在几年内全世界5%以上的人口全都死亡了，那你说这是因为我们的幸运呢，我们正好生活在两次大灾难之间，还是因为人类掌握了自己的寿命呢？


    如果你有什么想说的就留在评论中。


    ### 划重点


    1.1918年的大流感杀死了4000-5000万人，它含有的NS1毒蛋白会让免疫反应持续增强，因此免疫系统完善的青壮年死亡率反而更高。H5N1禽流感让世界各国极为紧张，因为它也含有NS1毒蛋白，一旦它能在人与人之间传播，那将是一个世界人口3年里减半的威胁。


    2.要评价一个重大事件的影响，一定不能始终埋头在细枝末节上，一定要尽力去找它在全景上的统计数据。


