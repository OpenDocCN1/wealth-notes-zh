    ## 145 | 边界：钢铁侠会成真吗？


    145 | 边界：钢铁侠会成真...


    ## ——►概念13：边界◄——


    人类观察世界的边界，是由所能使用到的最好的工具决定的，面对任何问题，只有尽可能多找一些可验证的细节，不过度地理解，不过度地解读，才可能了解真相。


    大脑控制的假肢可以让人成为钢铁侠吗？


    答案是，除了那些战斗功能以外，助力功能部分是可以实现的。


    ## ——►工业用外骨骼◄——


    而且现在已经有产品可以在市场上买到了，比如说福特汽车公司在福特律的总装车间就给一些装配工买了外骨骼背心，叫做 Ekso，这里没有没有任何电子设备，只是弹簧式的机械连杆，可以让人抬手的时候更轻松，弯腰的时候背部更有外力支撑。这套背心的价格是6500美元，有8斤沉，到现在已经很多人穿了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_155_0.png)


    可能你忍不住要问，这是否是一个临时作为实验用的背心呢？不会是真打算给每个工人都配一套吧？


    还真不是，福特确实有计划给每个人都来一套，这背后的原因就是钱。


    因为仔细核算下来，徒手操作的工人出现的背伤、腰伤、肩伤很多，尤其是那些老员工，一旦受伤之后，一两年都难以恢复正常，在这期间工作效率低不说，还有大把的医药费要掏。而使用这套背心，可以让装配车间的伤病指数降低80%，算下来比给工人掏医药费划算多了。


    所以不止福特，还有一些大型的零售商，他们也给自己的仓库人员配了外骨骼。


    当然，比钢铁侠那套还是差距很大的，因为这里连电子设备都没有，只能让人的上半身活动起来更省力。如果需求只是大幅地减少员工伤病，类似福特这样的企业是不可能订购更复杂的外骨骼设备的。比如说带力度传感器，可以放大每个动作的力量，真的像钢铁侠那样能够举起一辆汽车。因为在福特的总装工厂里，举起一辆汽车这种动作早就有完善的机械臂实现了。而且，为了保证一套外骨骼背心能穿戴多年，随意随用，不需要每天专门地维护，这东西还就得设计得越简单、越轻便、越可靠，没有复杂的电子器件才好。


    一项科技选择往哪个方向突破，背后就是成本的考量。


    ## ——►军用外骨骼◄——


    比这个更高级的外骨骼是用在军事上的，希望能在战场上发挥作用，比如说提升士兵的作战能力跟生存机会。而一般来说，进化到军用了，也就到了这个技术的最高峰。


    比如现在美国洛克希德·马丁公司开发的通用型负载外骨骼，它可以在负重45公斤的情况下，让士兵以4公里每小时的速度行走20公里，最快的冲刺速度可以达到每小时16公里，这个速度大概跟咱们中跑速的速度是差不多的。这个机械外骨骼就有液压的零件了，能够增加人体力量，它甚至还配备了可携带的燃油发电机器，如果抽油加满了，这套设备可以提供24小时的助力。现在，这套外骨骼的设计目标是把负重提升到100公斤以上。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_155_1.png)


    研发这个档次的产品背后最大的动力依然是金钱，因为军方的要求高，费用也多。


    ## ——►医用外骨骼◄——


    而比这个更高级的外骨骼也还有，那就是用在医疗上的。


    终极目标就是让那些高位截瘫的人恢复正常行走能力，可以上下楼梯、可以下跨起立，这背后的动力也依然是钱。因为这样的病人买轮椅可能都要花一万多块钱，如果一套设备可以让他们恢复行动能力，那十几万到几十万块钱的价格应该还是值得的。


    不过，到了这里，难度就大了，因为有的人只是关节或者软组织受损，力量不足，这些可以通过之前介绍的两个设备改进。但更多的人是因为脊柱神经受损，导致大脑没法控制肢体了。


    脊柱一共有31对神经，从上到下是颈椎、胸椎、腰椎、骶椎、尾椎，每一段都分别控制身体的一个区域，从哪断开了，断裂处以下就失去了控制，也失去了知觉。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_155_2.png)


    对于完全不能活动的肢体来说，助力是不够的，而是要求外骨骼全面接管所有的动作。如果只是单纯地完成双脚行走，像波士顿动力这样的公司研发出来的两足机器人也能完成。


    但行走的过程中，细节怎么决定呢？


    比如说步幅有多大，走多快，往哪个方向走，如果出现障碍物，腿是不是要迂得高一些。这些就都需要大脑参与了。虽然健康人完成这些微调，甚至连自己都察觉不到，但是能正确地行走，大脑跟神经无时无刻不在做细微的调控。而这种程度的人机结合就比钢铁侠还要复杂了，因为实际上这属于是脑机接口。


    我们曾经在之前的课里说过，被宣布脑死亡的患者其实里面还有1/5的人是有意识的，只不过是因为无法沟通，被困在躯壳里了，他们的思想是可以通过近电极断层扫描跟外界沟通的，甚至后来还可以通过脑电波跟外界沟通。


    尽管是沟通，但是信号非常简单，只有 Yes 和 No，我们已经可以把它看做是脑机接口最简单的形式。但是要控制行走这个动作，光有 Yes 和 No 是没法完成的，它需要更多的细节。


    于是，脑机接口就瞄准了运动皮层，负责运动的神经主要分布在额叶跟顶叶。额叶曾经咱们在诺贝尔奖里提到过，前额叶切除术说的就是那个额叶，顶叶就是头顶处的皮层。


    最初的实验是把猴子的颅骨打开，用电极直接采集这两个区域的信号。让猴子反复地完成规定动作，然后记录 N 多次动作之后产生的信号是什么样的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_155_3.png)


    实验的目标是争取找到一种算法，把运动描述输入进去，从另一端输出的是对应的皮层的脑电图。或者反过来，在计算机里输入皮层的脑电图，经过算法处理之后，另一端输出的是动作描述。如果这一步真的实现了，那我们就能把编码好的信号输入进猴子的大脑，也许它就能在信号的驱动下伸手去拿桌子上的坚果。或者是让猴子的大脑想象这个过程，把皮质脑电图的信号传输出去，操纵真正的机械手臂动作。


    这一步实现的难度非常大，这个问题就好


    这一步实现的难度非常大，这个问题就好比你看到资料中猴子行走的时候，皮层那8路像噪音一样的信号，你光看这8路信号，你怎么确定它是一只正在爬行的猴子呢？


    这个问题卡住了科学家很久，不过，最近两年，随着机器学习的出现，这类工作已经可以做得比较好了，因为人工智能最擅长于这种抓取特征的任务了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_156_0.png)


    上面这张图，是正在实验的一只猴子，因为它的脊柱曾经受过伤，右腿已经残废得不能自由活动了，但是通过运动皮层神经信号的输入，可以调整这只残废的腿的步伐，如果关闭了皮层的脑电波信号，这只猴子走起来又成了残废的样子。


    当然，想要完成复杂的活动，绝不只是8根线就能描述清楚的，在2009年的时候，科学家已经可以在猴子的脑皮层植入1000根微线，他们同时监控着大约6000个左右的神经元的电活动。做这项研究的人是杜克大学医学院神经科学家米格尔·尼可莱里斯，他在2012年的时候向巴西政府申请做人体的实验，并且从那时候开始，面对各大媒体都公布，自己的团队要选一个高位截瘫的患者，让他在2014年世界杯，巴西对克罗地亚的首场比赛上穿戴着他们研发的外骨骼，从轮椅上站起来走到球场的中间，给两队开球。


    不得不说，这是一个非常棒的宣传方案，各大媒体都翘首期待着世界杯开幕式上由一个机械外骨骼支撑的残疾人开球的那一刻。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_156_1.png)


    可是到了2014年6月12号下午，真正的这一幕只持续了3秒钟，摄像机镜头从全场的开幕式突然就切到了场边，一个人穿着比宇航服还重2倍的所谓的外骨骼，左右还分别由一个工作人员扶着着，地上还蹲着一个工作人员，好像是用手把足球撞在那个外骨骼的腿部，然后球就弹开了。马上一个球童就把球捡起来，跑进了场内。这个隆重的仪式就这样尴尬地一闪而过，甚至绝大部分国家的电视解说员都不知道这个场景是干什么的，观众也没有反应过来，一切就结束了，比赛就开始了，后来也没有人追问这一步到底是什么。


    实际上，这套设备在世界杯开打的时候根本没法顺利工作，只好把平时用到的设备都吊在一个高尔夫球车上，现场让几个工作人员假装模拟一下，在球被弹开的时候，赶快把电视转播信号切过来。看上去就好像在开球一样，其实根本连草坪都没走进来，那个患者也根本不能从轮椅上站起来走到球前。


    可能有人就要问了，实验失败为什么还硬上呢？


    对 FIFA 这个组织有了解的同学一定知道，能让他们把世界杯开幕式的一个转播信号专门切换到指定的对象，这都是真金白银已经花出去的，所以就算是不成功，牛已经吹出去了，钱已经花出去了，也不得不上。实际上，到现在也还没有哪个机构能让高位截瘫的患者通过脑机接口操控机械外骨骼做的假肢。


    ## —— 今日内容小结 ——


    这节课我们看到的是一个什么规律呢？


    那就是，科技路径上每一个推进都是跟经济利益挂钩的需求推动的。


    那些企业购买昂贵的外骨骼，不只是为了提升工作效率，更多的是因为买外骨骼省下的钱可以给员工缴纳医药费划算得多。


    有些企业研发可以续航24小时、负重45公斤的外骨骼，是因为军方的财力雄厚。


    在世界杯开幕式上，宁可演砸了也要硬上，也是因为掏了钱，也是因为看好今后医疗设备销售的前景。


    就连量子力学创立的第一步，那个描述了光的能量是不连续的的普朗克公式，背后的需求也是提升灯泡的发光效率。


    其实除了数学以外，很少有什么重大的科学突破是纯粹的智力挑战，很少有重大的研究，当时是脱离了实际利益的环境下研究出来的。也正是因为有了真金白银的驱动力，才有了源源不断的突破出现。而也正是因为仍旧存在着极少数的纯粹的智力挑战，人类才有了文明的资本。


    ## —— 今日思考题 ——


    你能不能举出一些例子，就是一些重大的科学突破是在脱离经济利益的情况下做出来的呢？


    如果你想到了就留在评论中。


    ## 划重点


    -   1. 科技路径上每一个推进，都是跟经济利益挂钩的需求推动的，科技选择往哪个方向突破，背后是成本的考量。

    -   2. 数学等极少数的纯粹的智力挑战，是人类文明的资本。


