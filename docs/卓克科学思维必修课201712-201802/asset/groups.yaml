    ## 094 | 起源：海洋越来越酸，生物越变越白（上）


    094 | 起源：海洋越来越酸，...


    ## ——► 概念10：起源 ◄——


    一种事物或规律的出现，或者是因有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    如果你认真听前几个星期的课——复活节岛，一部浓缩的人类史。你应该记得有一个知识点，就是那座岛上的居民和其他波里尼西亚的居民吃的东西不太一样，那就是他们不太吃鱼，鱼肉只占日常饮食10%都不到，而其他的岛民吃鱼肉超过80%，这是为什么呢？因为复活节岛周围没有珊瑚礁，而有珊瑚礁的地方才会聚集。


    其实大海和沙漠在某种意义上是同义词，一望无际的沙漠和一望无际的海水都意味着死亡，沙漠中只有绿洲附近聚集着大量的生物，海洋中也是这样的，只有珊瑚礁附近才能聚集大量的海生物。


    统计数据是这样的，拥有珊瑚礁的海域的面积占整个海洋的千分之一，而仅仅这千分之一的面积，却聚集了21%的海洋生物。所以，没有珊瑚礁分布也就没有鱼吃了。


    现在世界上珊瑚礁的健康状况是什么样的呢？咱们来看看下面几张图。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_12_0.png)


    第一张照片，海水不是很深，左右两张图只隔了一年多的时间，但是右边珊瑚全都变成雪白色的了。那它是不是意味着更纯洁，更少受污染了呢？其实不是，因为它被漂白了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_12_1.png)


    第二张照片也是左右对比，两张照片拍摄的时间相隔了5年，都是同一个地点，可以看到，2005年的时候，珊瑚还是各种颜色都有，但到了2010年的时候，也以白色为主了。


    ## ——► 珊瑚礁=生命岛 ◄——


    其实珊瑚是这样的，它是一种复杂的混合物，主体是珊瑚虫的大量聚集，每一个有几毫米的直径，长有的几厘米，有水管一样的身材，就像摆动的树枝一样，看上去又有点像植物，又有点像动物，它这一辈子就随着生长，随着分泌碳酸钙的骨骼，所以会越长越长。分泌出来的东西沉积起来也是硬邦邦的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_12_2.png)


    因为它们聚集起来往往是几十亿或者上百亿的规模，最终能在海底形成一个岛，所以也就叫珊瑚虫了，而叫它珊瑚礁。很多海洋动物也是借着这里的缝隙躲避天敌，或者在这里做窝、捕食、吃喝拉撒。


    澳大利亚的科学家曾经研究过一个排球大小的珊瑚礁，就发现里面生活着1400多只多毛纲的虫子，它们分别属于103个物种。他们还仔细研究了一个面积是1平米的珊瑚礁，这里生活着100多种甲壳纲的动物，所以珊瑚礁是一种混合物，很多不同种类的生物跟它们的食物、粪便、卵还有微生物全都聚集在这里，它是一个生态系统。


    珊瑚虫是活的，它每天过滤海水，吃进去浮游生物，净化自己的身体，排废物，它也是有免疫系统的。所以当珊瑚虫还是活着的时候，珊瑚礁是一座有生命的岛。


    ## ——► 走向崩溃的珊瑚礁 ◄——


    但如果因为什么事故，比如海底火山喷发了，把这部分珊瑚虫毒死了，虽然它形成的那么一大块硬邦邦的东西还在，但是由它主导的生态系统就会崩溃了。现在全球的珊瑚礁正在大跨步地往崩溃的方向奔跑，你刚刚看到的很多图，都是珊瑚虫从健康状态走向白化状态的样子。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_12_3.png)


    我们再来看两张照片，这张照片上侧是一个珊瑚虫从健康到白化，最后走向死亡这三个阶段。


    白化是因为海水变酸引起的，这个道理很好理解，比如说你把一个红色的鸡蛋壳泡在醋里，过了3天，你就会发现鸡蛋壳颜色发白了，而且还变软了。


    珊瑚虫也是在酸化的环境里变白变软的，但变白还不意味着没救了，它的生命力也是非常顽强的。如果这个时候，海水能够恢复，只要继续繁衍几代，又能恢复到从前健康的状态。但是如果海水没能缓解，一直就这么泡在酸的环境里，不久之后，珊瑚虫就会死亡。这个时候，就是图中最右边这个状态了，这块珊瑚礁就彻底没有生命了。


    它这个时候，成分和岩石是差不多的，但是因为活着的时候，里面生活了大量的生物，也微生物，珊瑚虫死后它们也逃不去，于是就只能在这里继续吃喝拉撒睡，整个环境里的毒素积累得就越来越多了，它们最终也得死掉，最后只有极少部分的细菌蚕食着这里的尸体和残渣。


    我们注意看，最左边这个是2014年12月的，中间这个是2015年2月，最右边是2015年8月。


    ## ——► 被重创的大堡礁 ◄——


    刚刚我放的珊瑚礁的图都是来自大堡礁，它在澳大利亚的东北角，有2000多公里长，100多公里宽，是条带状。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_12_4.png)


    这个图中，右上角阴影的部分就是大堡礁的分布情况，它是世界上最大的珊瑚礁，仅仅这一部分就占了全世界所有珊瑚礁的41%。所以这里的总体情况变化趋势就足以代表全世界珊瑚礁的总体变化了。


    但是这里的总体情况是非常不好的，2004年的时候的统计，说有一半的珊瑚礁受到威胁，但是到了2016年，12年过去之后，统计结果是2/3的珊瑚礁已白化或已经死亡。


    不知道大家还记不记得去年的大洪水，它实际上是历史上最严重的一次厄尔尼诺现象常带来的。从我们统计厄尔尼诺开始，它呈现出一个规律，就是每7年出现一次，每次大约持续8到10个月。但上次的厄尔尼诺是从2014年5月份持续到2016年2月份，还差3个月就到两年了。而珊瑚礁也是在这次长时间的温度异常中严重受损，到现在大半已经成了死亡的石头了。


    再下面这张图是澳大利亚研究理事会对大堡礁健康情况的统计。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_13_0.png)


    红色的是已经发生白化的，这些不出意外将会在5到10年内全部死亡。绿色的是还活着的，可以看到大堡礁从整体情况上看已经受到重创了。关于海水的酸化和动物的变白我们暂且举这么多例子，它的形成原因，我放在下一课里继续说。


    ## ——今日内容小结——


    我们先说到这里，你从中能得到什么科学方法呢？


    那就是怎么陈述一个现象的出现会带来多严重的后果，要把这个后果让人清清楚楚地认识到，需要从两个方面来陈述：


    第一，反差极为强烈的对比。


    那对比什么呢？就是这个现象出现前那里是什么样的，和等到这个现象出现之后，那里又是什么样的，然后你再把前后两个结果左右并肩放在一起，反差越大，对比就越鲜明，给人的感官的体验就越直接。


    怎么做到反差大呢？就是你要控制住绝大部分的因素不变，而只让其中一个因素变，这样做的结果就是产生出一个黑，一个白。那你说如果一定要怀疑到底是什么因素导致的从黑到白，或者从白到黑，那不用考虑太久吧？大概率说，就是那个发生变化的因素导致的由黑到白，所以我们才要控制只有一个因素变化。


    比如说我刚刚举例的那几张图，海还是那片海，只不过珊瑚被腐蚀得白花花的了。但如果你只放白花花的珊瑚，没有对比，那人家以为这个品种可能就是这个颜色，还觉得挺好看的。所以要呈现海水变酸，一是需要极大反差的对比。


    第二，要展现事情的全貌。


    也就是你要聊的这个因素可以影响到它的范围，把这个范围尽量周全地框出来，这样好能让人知道事情的影响的数量级。


    比如说海底的火山口喷发，周围影响的范围也是几十平方公里，也不大。那片水域的珊瑚礁也会遭殃的，因为硫化氢融在水里，对海里生物的腐蚀可比海水的酸化带来的危害大得多，也剧烈得多，用不了10个月，可能几天就变白了。


    但是如果你只把这个局部弄出来对比，这个效果看起来虽然很明显，但是有脑子的人都会经不住多问一句，整个海洋都是这样吗？还是说只有一小片区域出了事故呢？


    你看，咱这节课说到的珊瑚变白，一定要说明有多大的区域变白了，是大堡礁的2/3已经变白了，而大堡礁又占全世界珊瑚礁的41%的面积，也就是说，就算全世界其他地区的珊瑚礁全都是健健康康的（当然，这种可能性微乎其微，因为酸化，大家都是一起酸化的，这是全球性的变化。）但就算我们往最好的情况去估计，全球也会有23.7%的珊瑚礁就在今后的10年里将要消失。


    所以，整幅图景摆在你的面前，就知道它是不是个案，是局域范围的还是全球范围的。然后再结合一下规律，0.1%的珊瑚礁海域养育着全球21%的海洋生物，那这些绿洲就极为珍贵了，但它们正在快速消亡。


    这就是第二个方法，我们把全景说了，把个例的对比凸显出来了，这个因素的影响有多严重，谁都可以理解得很透了。到了这儿，想把这个影响说出来，让人警醒的目的就达成了。


    珊瑚礁整个变白，这个变化当然很突出，后果当然很严重，但我们并不需要煽情地对个体进行渲染，我们更需要是一种理智思考的约束，我们需要通过这种科学方法把事情的全貌展现出来。


    ## ——今日思考题——


    在你的生活和工作中，有没有遇到过有人想说明一个道理，但他只顾着煽情，最终的效果却没有什么说服力呢？或者他只顾着强调个案，而忽略整体？


    欢迎你留在评论里。


    ## 划重点


    想让人清楚地认识到现象带来的后果：一是需要反差极为强烈的对比，把现象出现后的情况与出现前进行对比；二是要展现事件的全貌，把现象会影响的范围展现出来。

    对比：因为海水变酸，仅用了12年的时间，占据全球珊瑚礁总量41%的大堡礁，有2/3已经白化或死亡；

    全貌：最乐观的预估，10年后全球23.7%的珊瑚礁会消失，虽然全球珊瑚礁海域仅为海洋面积的0.1%，但却养育着全球21%的海洋生物，它们也会大量死亡。


    卓克

