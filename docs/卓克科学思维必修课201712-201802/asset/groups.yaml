    80%口臭的人都是口腔里的问题，而不是胃里的问题，其中绝大多数都应该马上去看看牙医。


    绝大部分牙齿问题都会导致口臭的，比如像牙周炎、智齿、牙龈炎，而且大部分都是那种恶臭的味道。


