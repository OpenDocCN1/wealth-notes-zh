    ## 123 | 发展：梅毒，种族歧视与道德底线


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_79_0.png)


    123 | 发展：梅毒，种族歧视...


    ### ——概念11：发展——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    ### ——上一节思考题解答——


    在昨天的课里，我留了一个问题，其他国家都给梅毒起了其他地区的名字，为什么只有中国叫它广东烂疮呢？


    其实就是因为闭关锁国之后，只开放了广东的港口，那个时候清朝人甚至说不出任何欧洲国家的名字，所以我们没有把这个病的名字往国外推，没有什么谦虚，而是因为我们封闭。


    ### ——严重的种族隔离——


    今天我们说的是一个真实发生在1931年阿拉巴马州梅肯县的事，它促成了现代医学伦理准则的建立，因为这次事故突破了当时人们的道德底线。


    这是美国东部的一个黑人比例很高的地方，当年美国的种族隔离制度非常严重，黑人的公共福利很低，比如就以梅肯财政来说，它给每个白人学生投入的资源是每人每年65块钱，给黑人的学生是不到7块钱。


    当时有一个组织叫罗斯沃尔德，发起了 一个慈善项目，就是希望在全国范围根除梅毒，这个项目要分阶段进行：


    - 第一阶段，统计梅毒发病的范围和严重程度；

    第二阶段，根据统计结果制定治疗和教育大众的这些策略。


    第一阶段统计下来，美国全国梅毒感染率是4%，但黑人的感染率就高多了，是7.2%。阿拉巴马州是最高的，主要原因就是梅肯县高，梅肯县多高呢？是360%。你真别以为是我说错了，就是三个人里得有一个多感染了梅毒，它比全国的平均值高了90倍。


    但这个项目只进行了一年就停摆了，因为美国遇到了经济大萧条，没钱了，等到萧条期过去之后，项目再重新启动的时候，美国公共卫生部提供了一份资金，也参与了其中，梅肯县被当作重点的考察目标。


    他们先默认：


    - 黑人跟白人是两种不同的物种，就认为白人的梅毒发作主要损害神经系统，而黑人因为脑的灰质非常少，智力低下，所以梅毒螺旋体应该对他们的智力伤害不大，主要造成的伤害是出现在肢体上的。


    公共卫生部在这个项目中也只关注那些完全不治疗的情况下，黑人能病成什么样，所以实验的主要目标是在黑人死后检查他们的身体情况，病人不死就没有价值。


    ### ——长达40年的人体实验——


    另外一个目标是有商业价值的，那个时候美国已经颁布了法令，在结婚前、入伍前，体检项目都必须得有梅毒检查，凡是染了梅毒的不能结婚，也不能入伍。但当时检测手段很落后，急需找到另外一种灵敏又准确的方法。


    之前我说过，梅毒螺旋体太脆弱了，很难在体外培养，给研发带来了很大的麻烦，现在梅肯县的黑人实际上在研发人员的眼里，就是梅毒螺旋体的活体培养皿，随时需要用的时候就随机抽他们的血。


    后来还真的是在这一阶段的研发中上市了两种新的检测方法：


    - 一种是性病血清测试；

    另外一种是荧光螺旋体的免疫吸收测试。


    参与实验的黑人能得到什么呢？


    这个得分开说，在公开资料里，当年公共卫生部在梅肯县教堂贴的告示说的是：


    - 征集那些认为自己有坏血的人，Bad Blood，坏血的人来接受新药治疗，但需要志愿者必须接受一个条款，就是要接受政府免费安排的有特殊仪式的葬礼，这特殊仪式指的就是尸检。


    当时能认字的黑人就不多，更没有什么是法律意识，只觉得有机会治愈，这是天大的好事，只要能参与到其中，自己的病就有治了。


    在公开资料中承诺给黑人的还有什么呢？


    就是从实验中心到他们家免费车接车送，如果赶上中午了，还可以吃一顿免费的午餐，要赶上下午就没有，这些是公开的。


    而实际上，真正能够得到的，就是在刚刚承诺的那些项目里，减去接受新药治疗这一项，因为实际给这些黑人吃的就是一种粉红色的小药片，这个药片实质是阿司匹林。


    后来一共有600个年轻人被选中了，其中399个人感染了梅毒，被分到A组，201个人没有感染，被分到B组。


    实验进行了6年多，二战开打了，征兵工作开始了。在实验项目里就有250个人在征兵的名单里。刚才我说过，入伍之前是要体检的，如果发现有梅毒，政府会插手治疗，这一治疗就破坏了这6年的实验结果了，所以公共卫生部的人特地找到了当时梅肯县负责征兵的人，就把凡是参与这个实验的黑人给免除了兵役。


    那个时候是1938年、1939年，那个年代就算事正规的医院按正规的方法治疗梅毒，也就是给患者涂上水银和砷剂，根本也不管什么用，所以在这几年，实验方法虽然是故意不给他治疗，但跟正式给予治疗的效果其实是差不多的，没有什么人能够被治好。


    医学界是在1936年就已经确认了，青霉素对治疗梅毒是有奇效的，但是因为那个时候青霉素成本太高了，根本不可能用于临床。青霉素的价格直到二战结束之后才降低到普通人能用得起的地步，也就是1947年之后，这些参与实验的患者是有机会痊愈的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_79_1.png)


    但是从1947年到1972年，这25年的时间里，公共卫生部的人专门给梅肯县的每一个医生都发了一份名单，要求他们凡是在名单上的患者，即便来找他们看病，也不准给他们使用青霉素。到了1972年，当年399个年轻的梅毒患者只有74个人还活着，病死的还不少325人，因为他们还传给了自己的妻子，另外还有19个孩子出生就是先天性梅毒。


    这个就是最终的结果。


    但是这可并不是一项秘密的研究，实验小组每隔4、5年就要发一篇论文，公布他们的研究成果，前后8篇的研究报告，凡是研究这个领域的科学家都应该看过，但是40年来没有任何人觉得有什么不正常，也就是说当年人们对黑人的歧视有多自然而然啊。


    直到1965年，公共卫生部入职了一个27岁的新员工，叫彼得巴克斯顿，他当时负责统计这个项目中梅毒感染的情况，结果当他第一次接触到这些档案，他就不干了。当时他给部门写抗议信，要求停止这项实验，结果被驳回了。


    第二年，他又继续写，被人无视。4年之后，他精心收集了完备的证据，给《华盛顿星报》的记者透露了消息，第二天《纽约时报》就在头版头条刊登了，之后一切终于停止了。


    有律师牵头，控告美国政府三项罪名：


    - 第一，是开展这种纳粹式的人体实验；

    第二，是滥用国家权力；

    第三，是种族歧视。


    但最后这个案子竟然是庭外和解的，和解的条件就是给在世的这74个人做免费的治疗。并且每月赔偿4万美金。这实在是一


    疗，并且每人赔偿4万美元，这实在是一笔非常可怜的钱。


    ### —— 今日内容小结 ——


