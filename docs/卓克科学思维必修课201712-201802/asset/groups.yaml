    # 106 | 发展：从统计数据了解最危险的癌症


    # —— ► 概念11：发展 ◄ ——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光观测曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    最早人们注意到癌症的时候，不论中国还是外国，都以为这些肿瘤是外来的异物，比如中国的说法就是邪气入侵。


    后来是从医学进展到仔细观察胚胎细胞的增殖跟分裂，这个观点才IW转 ... 才发现，原来这些异常肿大的东西是由身体自己的细胞变化得到的。在去年的专栏里，我曾经用了一系列4小时左右详细说过癌症的细节。


    但是，在这节课里，我们要从统计数据的角度去了解癌症。


    # —— ► 最危险的癌症 ◄ ——


    中国人最容易患的癌症一共有6种，发病率从高到低是肺癌、胃癌、肝癌、直/结肠癌、乳腺癌。癌症按照这种器官分类，虽然有好几百种，但仅仅就这6种已经占据了60%以上的患者。除了乳腺癌以外，其他5种也都是死亡率排名最高的癌症类型，所以最危险的癌症可以说就是这以上5种。


    虽然在统计数据里胰腺癌的死亡率更高，但是因为它的发病率低，这类小众但高危的疾病是不能被评为最危险的癌症的。知道这一点，我们如果能够避免胃癌、肺癌、直/结肠癌和肝癌的话，健康水平就能大幅地提升。


    咱们仔细来看，这5个器官分别属于两个系统，一个是呼吸系统，一个是消化系统。我们吸入了什么，直接影响到的就是呼吸系统的癌症。我们吃进去什么，直接影响到的就是消化系统的癌症。


    最新的医学结论是：


    +   2/3左右的癌症都是因为细胞复制过程中的随机错误一步一步地积累出现的。


    请大家注意这个重要的结论，一会儿我们就会用到这一点。


    +   除了随机错误之外，还有1/3的癌症是生活习惯造成的。


    # —— ► 用统计数据分析癌症 ◄ ——


    那么我们举一个统计学上的结论来看 Kilocalorie... 比如，食道癌在中国...的发病率是广东地区的11倍，数据上这么明显的差异一定是因为某种因素在两个地区不同导致...
    所以我们就可以初步地去想象它到底是什么因素呢？


    我先来作一个有错误的示范：


    首先，我们知道，去年世界卫生组织更新了致癌物的分级表，其中把65摄氏度以上的热饮列入了2A级致癌物，因为它直接危害的就是食道。除此之外，甲醛、紫外线也都是这个级别里的致癌物，也就是说它们的致癌效果是有高度统一相关性的。


    我们再来看中国的西南，它最爱的就是川菜中的火锅，很多... 所以西南地区有些省份的食道癌的发病率在100/10万以上... 平均的发病率都是73/10万。


    我们可以再参考一下，那些基本不吃滚烫食物、不喝滚烫水的人，食道癌的发病率是多少呢？


    我们就用美国白人的统计结果来看，他们食道癌的发病率是6/10万。一个是100，一个是6，那他们这一项的发病率只有我们西南部分地区的1/10。


    好，那我是不是大致就能开始怀疑，我已经找到了中国西南省份食道癌高发的病因了呢？


    不是的，因为我刚刚说过，这里要演示的是一个错误，因为我并没有从导致癌症影响因素最高的那一项开始分析，而是从其次的一些因素开始的。


    最高得因素是什么呢？


    就是我之前说的，2/3左右的癌症都是细胞复制过程中随机错误一步一步积累导致的。


    那么什么能代表一步一步的积累呢？


    这个参数就是年龄，年龄是影响癌症最主要得因素。


    我们举一个例子... 那大概率来说，老龄化严重的那个省份癌症发病率很可能就是那个年轻省份的6、7倍。但其实这种巨大的发病率的差异体现的仅仅是年龄上的差异。


    所以当我们要确认是不是中国西南省份饮食不健康的时候，应该先去查一下西南省份的人口结构，如果那里的老龄化真的非常严重，那我们就应该先评估一下西南地区因为人口老龄化而造成的癌症高发影响能有多重，那里如果是食道癌高发，就不全都是生活习惯造成的。


    那么我们查到的最新的人口数据，是2015年全国1%抽样人口调查的结果，四川跟重庆很不幸，都是65岁人口比例非常高的：


    +   四川排第一是13.33%；

    重庆排第五是12.17%；

    全国的均值是10.47%，广东省是8.48%，还是一个年轻的大省。


    所以即便生活习惯、饮食完全一样，四川和重庆的食道癌发病率都要比全国均值高个20%到30%的程度，比广东省大约也得高40%到50%的样子。


    这个重要的因素确定了，我们才可以把食道癌发病率西南地区是广东地区11倍这个数据拿来作参考，我们要把这个11倍除去年龄的因素，也就是大约除以一个1.5，它仍然还是高了6到7倍，所以依照这个逻辑，我们才能判断西南地区的饮食习惯确实有需要注意的地方了。


    火锅和热茶都是非常受欢迎的，所以如果平时嗜火锅如命的话，还建议晾凉了再吃。


    如果再看肝癌呢？


    西南地区仍然是全国最高的，肝癌的人为致病原因就是两个：


    +   一是乙肝这种疾病；

    二是饮酒。


    四川省是全国酒产量最大的省份，像茅台、五粮液、泸州老窖都是西南地区的酒品牌。而中国西部的酒精消费也主要是以白酒为主，而不是啤酒或者葡萄酒。


    # —— ► 正确看统计数据 ◄ ——


    所以这节课我们从统计数据就可以看出，长期不健康的饮食带来的效果是什么。从统计数据看问题虽然可以让问题自己冒出来，不需要反复做实验去找疑点，但是统计数据也会带来一些障眼法。


    比如说下面这张表格，它就统计了全世界各国癌症发病率的情况。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_37_0.png)


    我们只看发病率这一条，中国是209/10万，日本是中国2.3倍，是483/10万，意大利更是高得离谱，是571/10万，加拿大是500/10万，德国差一点是最高是...'
  - '[PAGE 38]


    大是500/10万，德国差不多是最高的，是581/10万。


    看到这样的数据，你一定很惊讶，这都是最顶尖的几个发达国家了，癌症发病率纷纷都是中国的2到3倍，所以他们的生活方式应该是 有严重问题了吧？


    其实这就是没从最主要因素去考量问题，我们不能只关心统计数据，这样会造成误读的。


    这个最主要因素还是年龄，癌症2/3以上都是随机突变积累造成的，积累时间越长，癌症就越容易发展出来。


    # 部分国家和地区人均寿命对比


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_38_0.png)


    而我刚刚说过的，日本、意大利、加拿大、德国，都是人均寿命排名世界最靠前的几个国家，像不丹、老挝、越南、朝鲜这些地区的很多人，他们赶不上癌症发展成熟就已经因为其他疾病死了，所以他们的癌症发病率才低很多。


    而且除了年龄以外，医疗发达也是一个因素，可能有人会感觉奇怪，医疗发达怎么癌症发病率还那么高呢？


    那就是因为诊断手段精确了，诊断普及了。太贫穷的国家，那里的人得了癌症也没有确诊，自己也不知道，所以并不在统计数据之内。于是，当我们仔细了解统计数据是怎么生成的之后，才能避免被统计结果蒙蔽双眼。


    # —— 今日思考题 ——


    你能不能也举出一些不了解事件背后的原理，而只看统计结果，最终被统计数据带偏的情况呢？


    如果你想出来了，就留在评论中，你写下的例子对其他人也会是很好的提醒。


    # 划重点


    +   1. 统计数据是非常好的分析工具，但分析问题不能只关心统计数据，要先从问题中最主要因素去考量，在了解了统计数据是怎么生成的之后，才能正确使用，避免发生数据正确，但结论错误的情况。\n2.
