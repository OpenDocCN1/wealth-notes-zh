    ## 133 | 旁证：猫为什么那么孤冷？


    # ——概念12：旁证——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    网上有很多讨论猫穿越生活的内容，猫好像对人并不怎么依赖，有的甚至把主人的家当成是临时的落脚点，天气暖和了就不辞而别。那些不离开家的猫也有很多不让人抱，抚摸也不能太久。像主人上了一天班，打开家门，很少很少见到一只猫热情地扑上来。人对它好，被它当作理所应当。


    但上节课我们已经严密地分析出，猫大约是在1万年前被驯化的。那么为什么这么久了，还是不能跟人建立起紧密的情感纽带呢？


    其实在人类驯化的所有动物中，猫确实属于一个特例，因为像猪、牛、羊、鸡、鸭、狗，它们要不就是能给人类提供蛋白质，要不就是能给人类提供动力，反正总有一个很实际的用处。唯独是这个猫，好像并没有给人类带来什么直接的好处，反而是我们要为它付出很多，铲屎工这个职称就是这么来的。


    ## ——猫在人类社会的位置——


    实际上，猫是这样获得自己在人类社会中的地位的。


    一万年前的谷仓给了老鼠机会，不夸张地估计，老鼠已经吃掉了人类粮食总产量的1/10，所以人类视老鼠为大敌。


    而猫的祖先，非洲野猫又是这样一种生物，它的体型不大，不是群居动物，像群居的食肉动物是可以通过协同作战，捕捉比自己体型大很多的食草类动物的，非洲野猫不是，它是单独行动的。所以对猫来说，老鼠那个尺寸的身材是刚刚好能猎物的，所以哪里的老鼠丰富，哪儿就有可能出现猫。


    而野猫又是这样一种生物，它虽然是纯食肉类动物，但是体型对人类又几乎没有威胁，这个猫小小的身材没法造成大规模的破坏，甚至连人类婴儿都不在它的食谱里。


    而且当人类发现，它们主要的食物就是那些糟蹋粮食储备的老鼠的时候，那就更不介意猫生活在他们周围了。


    于是，猫就成了一种可以在人类群落周围得到足够好处，又能避免被人类集中猎杀的食肉性动物。


    从我刚刚的描述，不知道你能不能体会出一种感觉，好像猫能够成为人类的伙伴是因为它找到了自己的定位，而且定位极准。


    当然，这么理解是错的，这并不是猫主动找的，而是人类在农业社会出现之后，制造出来一个稳定的生存机会，它能给一个生物提供稳定的食物来源和生存空间。这个生存机会有一个专有名词，叫做生态位。


    一个生态位就会有各方面的限制，比如说同是食肉类动物，像加拿大北部的城市里，现在也会在清晨发现有翻找人类垃圾箱、吃那些残羹剩菜的北极熊，但是它们就永远不可能成为人类驯化的对象。因为它虽然也是自给自足吃点垃圾，或者也能捕捉一些大老鼠，但是它对人类的威胁太大了，所以人类看到北极熊，下意识地就要把它赶走，如果赶不走，就要把它杀死。


    所以猫正好是在各方面的限制条件中满足了条件，占据了这个由农业社会创造出来的生态位。


    ## ——猫孤冷的原因——


    但是猫仍然很孤冷，因为自从非洲野猫起，它们就是独居生活的，永远都是独来独往。


    而人类驯化的牛、马、羊、狗，它们在野生生物种的年代就是群居生活的，它们早就对拥挤的生活习以为常了，基本上生活对于它们来说只要有足够的食物，有地方可待就够了，生存空间狭窄一些这都不是问题，所以它们跟人住在一起也没有障碍。


    群居生活的动物还有一个特点，就是有鲜明的阶层结构，这个结构规定了在食物出现之后谁先吃、谁后吃，在队伍进行当中谁打头阵，在外敌入侵的时候谁首先出击等规范。在这些群居动物里，头羊、头牛、头马、头狼，在驯化之后，这个头领就都成为了人，于是从第一次它们误以为人是它们的头领之后，就开始对人产生了一种错位的信任和服从，这种生活习惯上的转移最终也是它们对主人出现感情依赖的基础。


    这种信任跟依赖的原形就是头领带着队伍在艰苦环境下讨生活的习性，这种习性不是能轻易丢掉的，因为它保证了这个物种在几百万年中一直存活到现在。


    所以对这些已经被驯化的动物来说，人一旦全部消失，它们如果不能马上找出来一个头领的候选人来，也许会在人消失后不久，因为其他的动物竞争而死去。


    但猫是不一样的，猫跟人共同生活的生存基础并不是建立在人一定存在的基础上，而是建立在老鼠足够多的基础上。所以环境中始终没有什么压力能让猫一定要对人产生出依赖的情感。


    所以我们甚至可以猜测，最早一批家猫只不过是当时那些胆子比较大的，不太介意在自己捕食的时候有人在旁边看着的那一群非洲野猫。


    所以说到这里，你就可以理解为什么猫总是那么孤冷了，因为它们的祖先是独居动物，后来的环境也没有出现让它们表现出忠诚跟依赖的压力。尤其是在现在，在到底是谁向谁献媚这个问题上，双方好像也已经谅解了一些，那今后就更难说猫会向着关心主人这个方向演化了。


    让我们再回到一个关键问题上，那就是世界各地不都是有小型猫科动物吗？世界各地不都有人迁徙之后形成的农业社会吗？那么为什么全世界目前所有的猫都只有一个非洲野猫的祖先呢？


    其实简单地说是因为这一小撮非洲猫占得了先机，农业文明的火种最早在1万年前出现在新月沃地，之后由那儿的人带向了亚洲、欧洲。在早期农民出走的时候，那些刚刚习惯跟着人一起生活的野猫也随着迁徙了，于是这些被驯化的非洲野猫的后代也先占据了每一片新区域中对应的生态位，非常有效地关闭了在那个新区域里本土野猫被驯化的大门，这个机会已经失去了。


    ## ——家猫单一起源的原因——


    假如真的有一种机制，让非洲野猫没有跟随当时的农民迁徙的话，那其实到了现在，亚洲、非洲、美洲的小型本土的野猫，也一样有机率占据那个生态位，猫的祖先就可能有很多很多了。但是可惜，当初非洲野猫已经占得了先机。


    现在寻找各大陆最早的猫，时间顺序大约是这样的，新月沃地是在9500年前，巴基斯坦是在4000年前，埃及是在3600年前，希腊是在2500年前，欧洲中部跟亚洲大陆是在2000年前，美洲大陆证据不足，传说最早是哥伦布带过去的。


    说到这儿，可能还是有些同学想问，猫现在的品种差异挺大的，难道家猫真的是单一起源吗？


    关于宠物猫的育种专门有基因分析，国际猫协会现在认可的品种一共是58个，但通过基因分析可以发现，这58种猫，它们只在10几个基因点位上有改变，而这些位点控制的基因就是毛色、毛的长短、发质这些属性，它们之间的差异不足以把它们分成A、B、C、D这些不同的物种。


    这种差异之小，就跟中国人跟日本人的差异那么小一样。


    而且即使是这些毛色上的差异，也仅仅是在1400年之后才出现的，也就是说在明朝之前，在文艺复兴之前，全世界所有的家猫大致都是非洲野猫那个样子。


    ## —— 今日内容小结 ——


    这节课我们说到的科学思维就是生态位。


    这个概念跟现代商业竞争下的环境中出现的机会也很像，公司跟企业不是非要在核心城市才能有的经营。作为比喻，像商业环境中的那些沼泽、沙漠，一样有资源跟需求，把它们匹配在一起就是一种商业生存模式，就是一种生态位。


    而一旦这种模式在那里出现了之后，后来者，即便自身条件完全满足，也很难跟第一个竞争了，这也是为什么小米可以活，小辣椒、大米、大麦这些手机活不下去的其中一个原因。


    ## —— 今日思考题 ——


    为什么同样是驯化的动物，狗在体型上、外观上差异那么大，远比猫要大得多呢？


    如果你想到了就写在评论中。


    ## 划重点


    - 1. 猫以糟蹋粮食的老鼠为食，体型小对人类不构成威胁，因此在人类群落周围获得了稳定的食物来源和生存空间，这种生存机会的专有名词，叫做生态位。

    - 2. 家猫的祖先非洲野猫是独居动物，与人类共同生活时也依赖于自己捕食，因此没有形成对人类的忠诚和依赖，这可以理解为猫总是那么孤冷的原因。

    - 3. 非洲野猫最早占领了与人类共同生活的“生态位”，它们跟随人类祖先迁徙到全球各地，让其他野猫没有了机会。


    卓克


    我是卓克，咱们明天再见。


    ## 134 | 旁证：狗是怎么出现的？


    ## ——◈概念12：旁证◈——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    ## ——◈上节思考题解答◈——


    上节课留下的问题是，为什么同是驯化的动物，猫的差异基本只体现在毛色上，而狗的差异却有那么大呢？


    有像大丹犬那样站起来接近2米高的狗，也有比老鼠大不了多少的那种小狗。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_118_0.png)


    其实根源就是人委派给狗的任务多种多样，有些需要放牧，有些需要猎捕，有些需要拉雪橇，有些需要看家护院，有些需要做陪伴，有些只是为了欣赏。执行不同的任务，需要的特点不一样，在优选中筛出来的差异就会越来越大。


    ## ——◈模拟狗的驯化过程◈——


    狗为什么会心系主人？


    这个问题上节课已经有答案了，那就是因为它们自古以来就是一种群居的、带有阶层的动物，中层跟下层都严格遵守纪律，听头领的指挥。人类驯化它们的过程，就是让人代替它们心中头领位置的过程。


    ## ——◈幼态延续与共生进化◈——


    那用不了多久，到底用了多久呢？


    这个还真有前苏联的科学家做过一个长达40年的实验，他们想看野生狐狸还原灰狼被驯化成狗的过程。


    人不再踩了，可是这个狗很想吃肉啊，但是它只是乖乖地坐着，用热切的眼神乞求人再给它踩一下。


    如果这个实验把狗换成成年的狼，它只要看过一次装置是怎么出肉的，之后就自己踩了起来，直到把肉吃光，根本不在乎人的看法。


    在幼年时期的狼跟狗，都会产生对人的亲近感，尤其是人离开几天之后再回来，小狗跟小狼都高兴得不得了。但是等它们成年之后，人如果再离开几天再回来的时候，狗还是跟小时候一样冲过去扑进人的怀里，但是狼对这个消失了几天的人已经不太在意了，它这时候甚至已经在自己的小群落选出一个新的头领了，而且这个头领还会对回来的主人怀有敌意，甚至试图攻击他。


    这个就是狗展现出幼态延续，而狼没有的最好的例子。


    人把灰狼驯化成狗，影响了狗的发育模式，产生出幼态延续的特征。


    而反过来，因为狗的出现，人的生存质量也大幅提升，在原始社会恶劣的条件下，又经历了像新仙女木事件，同是智人的其他物种都有冻死了，但是人类这一支还幸存，这里多少有狗的贡献，它们能帮助人类提升狩猎的成功率，提高了休息时候的安全性，还能提高放牧的时候的生产率，像北极圈以内的环境，如果没有爱斯基摩狗存在的话，人类只有死路一条，但是有了狗，人们生活得还挺安逸。


    所以实际上，人跟狗在1.6万年的时间里，是共生进化的。有的时候我们甚至可以把带着一队狗的原始人，看作是一个由两个物种组成的新物种，他们在互惠互利的关系中一起进化，而不是像分离的物种那样，总是在你死我活的竞争关系中一起进化的。


    ## —— 今日内容小结 ——


    那这节课我们得到的科学思维点就是共生进化。


    演化的过程中，个体间的关系不都是你死我活的挤压，还有大量手牵手共赴美好生活的方式。


    在自然界里，这样共生进化的物种有很多，比如像吃动物身上寄生虫的那种鸟，它们自己得到了食物，也给那些大型食草动物提供了危机预警，一有狮子接近，它们就叫唤。还有植物根系上的根瘤菌，它借根系延伸，在土壤中找到食物，同时也把自己的养分一部分匀给植物。更加基础的就像叶绿体、线粒体，它们曾经都是原核生物，就像一些单细胞生物那样。但是入侵到其他真核生物体内之后，竟然机缘巧合，没有被免疫系统干掉，也没有干掉宿主，反而成了宿主的一部分，给宿主提供能量，宿主也给它们提供庇护。


    ## —— 今日思考题 ——


    如果我们把 AI 当作是一个物种的话，那参考曾经猫、狗和人类的互动，你觉得我们今后跟AI会是什么关系呢？


    如果你想到了，就留在评论中。


    ## 划重点


    - 1. 人和狗是在互惠互利的关系中“共生进化”的，人为狗提供食物，而狗提高了人类的狩猎成功率、休息时的安全性、放牧的生产率等。

    - 2. 人委派给狗的任务多种多样，为了执行不同的任务，在优选的过程中造成狗的差异越来越大。

    - 3. 在驯化狗的过程中，展现出幼态延续的个体被保留下来，它们对人类既忠诚又依赖。

    - 4. 幼态延续，是指因为环境改变和基因突变，狗中的有些个体即便到了成年，幼年的特点不会消失，而且还非常明显。


    卓克


    我是卓克，咱们明天再见。


    ## 135 | 旁证：乌龟为什么长寿？


    ## ——► 概念12：旁证 ◄——


    对历史事件的研究很少有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。


    这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    中国有千王八万年龟的说法，国外也有龟的寿命能活过一个世纪的说法，看来全世界各地的人都注意到龟是一种寿命比较长的动物。


    所以自然有这个问题，龟为什么长寿？


    但听了这么多节科学思维课，我们应该对提问跟回答都设置一些门槛：


    - 对提问来说，门槛在于，只有陈述上没有错误的问题才值得回答。

    对回答来说，门槛就在於，只有找到依据之后才能再回答。


    那你仔细想过什么是寿命吗？


    对人类来说，因为有高水准的科技跟社会的合作关系，所以最近200年来，我们可以详细地统计大多数个体的寿命，记住他们的出生和死亡日期，然后统计寿命用。


    但是动物界是没法这样做统计的，那寿命又是什么呢？是找到一个更长的寿命就把它当作这个物种的寿命吗？那这种寿命叫做最大值。但这样的做法是不是太极端了呢？有些比较常见的动物，我们能不能统计一个群落里活得最长的前10%的个体的平均寿命呢？


    这两个数字是不一样的，前者要比后者大得多。


    比如以人来说，吉尼斯世界纪录里寿命最长的是法国的一个老太太，123岁，但如果统计中国寿命的前10%，那估计也就是90岁，这两个数字相差了1/3呢。


    那么乌龟是不是长寿呢？


    按照刚才的思路，具体查一查，乌龟是有很多种的：


    - 寿命比较短的像麝香龟、钻纹龟、西部锦龟、巴西龟、猪鼻龟，它们的寿命都是10几年20多年，它们肯定算不上长寿；

    中等寿命像红腿象龟、苏卡达龟、鹰嘴龟、锯缘龟、小鳄龟，寿命在40岁左右，也算不上长寿；

    只有那些象海龟、大鳄龟、加拉帕戈斯象龟，它们的寿命在80岁到180岁之间，这个算是长寿的。


    如果真的有人问这个问题，我们就得帮他梳理好各种补充条件，在他问完之后可以补充上一句，你要问的是不是那些寿命超过100岁的龟为什么长寿？


    可是我们往往见到的回答问题的人也没有这个意识，通常能见到的貌似有科学味道的答案就是这样的，说：


    科学家们发现，生物的寿命跟端粒紧密相关，端粒是一种在真核细胞里，位于线状染色体最末端的特殊的重复序列，每次细胞分裂复制 DNA 的时候，端粒都会减少一分。直到最后一分也用光的时候，细胞就不再分裂了。那不再分裂就意味着没有继续生长和修复受损地方的可能性了，所以寿命就终止了。人类细胞的端粒可以使用50次，乌龟拥有得天独厚的长寿基因，它们的端粒可以支持细胞分裂110次以上，所以乌龟天然比其他的动物寿命更长。


    大约就是这样一段解释。


    虽然咱们这个专栏的同学对这种级别的描述，我估计是不太会满意的。但不得不说，这种级别的描述对很多中老年来说都是一听就懂、一学就会，而且还记得通。


    这样传播具体知识有什么坏处呢？


    就是说我们已经知道了具体的科学知识，但是没有科学思想。


    那生活中最常见的是什么什么生物科技公司生产的端粒酶保健品，389块钱一瓶，产品介绍里还会有，比如说2009年诺贝尔生理学医学奖的支持，功效是癌症、三高、慢性病、细胞衰老，几大问题一并解决。


    如果中老年人听完之前的谬误感觉收获到了什么知识，那么接下来对这些长寿功效的药就很难抵御了。这就是只有一些不扎实的科学知识而没有科学思想带来的弊端。


    实际上海龟、象龟为什么长寿，和熊猫为什么还没灭绝是属于一个性质的问题，它就涉及到乌龟的祖先是从什么动物演化来的，它新陈代谢的特点跟其他爬行动物有什么不同，尤其是能表现为寿命更长的那些特点又是怎么产生的。


    这非但不是一篇...甚至是一个目前为止也没有完美答案的问题。


    众多研究内容里也只能是在 N 种因素里，对其中一个因素的其中一个方面作一些深入分析。


    比如说大体上的规律是这样的，寿命跟体型是正相关的，体型越大的生物寿命越长，体型越小的寿命越短。它们在环境压力下被筛出不同的生存模式，比如像小虫子，几乎就是所有比它大的动物的晚餐，随时面临着死亡。今天不抓紧时间把卵尽可能多地撒播出去，明天就有可能会被自己带一肚子富有营养的卵被小老鼠吃下肚子了，所以快长多生，一年产下几十个卵，这里只要有两三个今后能长成大虫就算赚到了。


    可制造这么多富有营养的卵也是一个耗费巨大的任务，所以长寿命是难以维持的，它只能在长寿跟体型大而不被别人吃掉两者之间择一头。择子孙满堂这个选项，体型小的动物寿命一般短暂。


    反过来，蓝鲸那么大尺寸的动物，寿命能到200岁呢，呱呱出生的第一天，刚从妈妈肚子里游出来就是7米长，6吨重，比世界上绝大部分的动物都大很多，根本不愁被人吃掉。所以几年才生一胎，一胎只生一条，怀孕一年多的时间，这对它来说不是问题。它要慢慢长到30米才开始生产，这是非常耗时间的。但是因为它不会被人吃掉，所以无所谓。这是一种完全不同的生存策略，而寿命就是不同生存策略中的其中一个属性。


    当然也有特例，比如像裸鼹鼠，它的寿命有30岁，虽然这个岁数不长，但是跟它同一个尺寸的，跟它同一个科的动物的寿命大都只有它的1/10。还有北极圈的贻贝，叫明，最老的有400多岁，300多岁以上的明比比皆是。


    对种种个案的研究，也有科学家们试图找出关键的因素。


    比如像端粒酶的结构是不是能有效防止自由基泄漏啊，或者细胞膜被氧化的难度啊，还有端粒缩短的速度啊，DNA的修复速度啊，新陈代谢的速度啊，等等等等，都是关键的影响因素。

