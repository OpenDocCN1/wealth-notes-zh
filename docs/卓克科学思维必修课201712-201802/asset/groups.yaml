    # 119 | 问答：你为什么会晕车？


    119 | 问答：你为什么会晕...


    有同学问晕车、晕船是怎么发生的？怎么避免？


    我的回答是：


    这个问题应该是很普遍，连我自己也有轻微的晕车，而且我只是在坐别人车的时候晕车，我自己开车从来不晕，这是怎么回事呢？


    另外还有，有的人是晕车越来越轻了，长大了慢慢好了，有的是反过来越来越重，开始的时候是车行驶的时候才晕，结果到后来，车都没发动，往车里一坐就开始吐了，这又是怎么回事呢？


    咱们来细说说。


    ## ——► 晕车的原因 ◄——


    人体在左右耳朵里都有一个叫做前庭的器官，前庭里面有一个“陀螺仪”，就像手机里那个似的，有 X、Y、Z 这三个轴。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_66_0.png)


    这三个轴特有的名称叫做半规管，它们三个是互相垂直的，真的就像 X、Y、Z 轴那样。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_66_1.png)


    每一个半规管都是一个闭合的腔体，腔体里还有液体，而且液体还不是完全全装满的，它是一瓶子不满，半瓶子晃荡，所以头部有晃动，这液体就在半规管里晃动。


    这一晃，就冲刷了腔体内壁的绒毛，说是绒毛，其实它不过是长得有点像，实际上是神经末梢，液体冲刷的方向实际就是运动的反方向。一冲刷就产生了一个神经刺激，通过三个相互垂直的轴的信号强弱，X、Y、Z
    三个方向一叠加，就能给大脑传递一个信号，这个信号就是告诉大脑头部现在在往哪个方向运动。


    我们是非常需要这个信号的，视觉信号需要跟它匹配，然后再让大脑协调全身的肌肉，最终就能做到站稳或者走一条直线，还有就是将要摔倒的时候做出补救的动作。当然，这些复杂的神经调控还有肌肉的调控，等我们长大了之后就根本不会进入意识了，它会自然而然地完成。


    但是汽车出现了以后，这个天生进化完备的功能也带来了一些麻烦，就是车辆的颠簸给你的前庭带来的刺激，会让你的眼球也跟着动，可是你视觉捕捉到的信号，因为车辆的减震设计得好，悬吊系统设计得好，结果眼睛看到的景象并没有跟着那么颠簸，这两个信号就错位了，错位之后马上就能体会到不舒服。


    有些同学很自豪，说自己从来没有这方面的错位体验，那是因为你的前庭跟视觉信号匹配得不那么精确。


    但是，我这仍然有一个游戏可以让你深刻体会到这种错位，现在听问答的同学回家可以试试，但是你必须得保护好自己，旁边不能有障碍物，否则到时候做的时候就碰到了，一定要找一个人在旁边保护住你，准备在你摔倒的时候扶住你。


    怎么做呢？


    就是你左手先从脑后抓住右边的耳朵，然后不要松开，右手高高举起，指向天，慢慢地弯下腰，指向你的鞋尖，眼睛也要准你的鞋尖，然后你就开始弯着腰转圈，往哪个方向转都可以，连续转10圈，然后停下来，直起腰，试着往前走两步。


    我见过的95%的人都会在第一步就摔倒了，所以旁边一定要有人保护，就是在他转到第10圈，准备起身的时候，你就得上去准备扶住他了。


    这个就是典型的视觉信号跟平衡信号不匹配，因为当你转了10圈之后，前庭里的液体正在剧烈地晃动中，旁边扶你的人，你也可以让他看看你的眼珠，一定是滴溜溜地乱转，因为在神经的调控下，眼球往哪个方向看，就是要积极配合前庭液体给到大脑的信号。所以现在你刚直起身，前庭液体不断地乱撞，你这眼球也不断地乱转。我们平常看动画片，一个小人儿晕倒在地上了，那个眼球也是一圈一圈地转，其实就是这个样子。


    到现在为止，我们只解释了晕车的第 一步，简单来说就是：


    耳朵告诉大脑，比如说现在我们左倾8度，下倾13度，后倾6度，现在又变了，左倾3度，上倾20度，前倾10度，前庭不停地告诉大脑各种变化；


    与此同时，眼睛却告诉大脑，说现在角度没有变，现在角度还是没有变，还是没有变；


    结果大脑就晕了，不对呀，你们告诉我的应该是大致相同的信息。


    这就是晕车的第一個层次。


    ## ——► 恶心和吐的原因 ◄——


    下面我们说第二个层次，为什么会恶心、为什么要吐呢？


    这个是在神经调控下的一种保护机制，这部分的神经就叫做植物性神经，它负责很多根本不由意识控制的东西。


    比如说我们闻到了酸辣粉的味道之后，这口水就流下来了、我们看到美女、看到帅哥，心跳就加速、一激动眼泪就流出来了。


    像流口水、心跳加速、流眼泪，这些几乎都是不由自主意识控制的，它实际就是植物性神经在调控。调控的功能里不光包含刚才说的，也包含很多肠道的神经，比如说腹腔的神经节，还有胃的蠕动。


    那保护作用指的是什么呢？


    就是当你看到跟平衡信号不同的东西的时候，你已经感觉很不舒服了、很晕了，这种晕跟不适也被植物性神经传递给肠胃，肠胃对出现的不适状态，保护机制就是一个，就是吐。


    因为一般来说，只要身体不舒服了，那很可能就是吃了什么有毒的东西，所以赶紧给它吐出去。但实际上这次晕得很要命，这次的身体不适，不是由于那些毒蘑菇造成的，而是由于一种1950年之后才出现的新品种的怪兽造成的，它叫做汽车。


    我们的植物性神经哪知道这么多，反正先吐了再说，于是晕车的人不但晕得很要受，还会吐，吐是一种保护机制。


    第二个层次的原因我们说完了。


    ## ——► 对晕车的恐惧 ◄——


    接着我们说第三个层次，就是为什么有些人坐车都没开，车门一关、一落座就开始吐呢？


    其实这第三步的原因跟我们之前讲的，就是为什么有些人一喝凉白开就拉肚子，但是喝凉饮、喝凉可乐却没事，有那么一点像。


    就是因为这些人很可能之前吐得非常严重，连胆汁都给吐出来了，这些经历给他 的刺激太深了，于是他就对汽车产生了无穷的恐惧，下一次跟他说要长途车了，他就可以跳过晕的步骤，直接吐给你看。


    这种条件反射也有些像巴甫洛夫那个狗，那个狗还没见到肉，但是因为训练多次之后，只要听见铃了也是哈喇子流一地。


    ## ——► 晕车的方方面面 ◄——


    对于晕车怎么办呢？


    有人说这晕车药可以吃，比如像茶苯海明、苯巴比妥，简单说这些药起了轻微地麻痹神经的作用，让跟前庭相关的、跟肠胃蠕动相关的神经不那么敏感。


    这些药最初有些是抗过敏药，跟其它最早的抗过敏药一样，就是吃完了之后容易犯困，犯困其实就是神经被抑制住了，它是这种药的副作用。后来就发现，它抗过敏的效果不太理想，反而是那种让人犯困的副作用很大，这副作用能利用上，能让那些晕车的人不那么敏感。还有像苯巴比妥这种是镇定剂，也是让人安静下来，不要神经那么兴奋。


    但是这些药的效果都不太强，因为从根儿上说，你真的能抑制住神经功能才能不晕车，但是神经功能多重要啊，抑制住了没准就闹出人命来了，所以这些药顶多就是上车之前吃，然后开始犯困的时候赶紧找一个座位睡，睡这一路，眼睛也不用东瞧西看的。


    还有人说，我上车就闭上眼呢？


    这个对于晕车特别严重的人来说效果也不太好，因为就算是把眼睛闭上了，眼球依然是按照前庭传给大脑的信号滴溜溜乱转的，这种转也会带来不舒服，所以最好最好的办法也就是熟睡。


    还有那个问题，就是开车的人为什么不晕车呢？


    首先开车的人不是全不晕车，只有那些坐车才晕车、开车不晕的那些轻度晕车的人才这样，那些特别严重的，站在大巴车旁边，还没上车就开始吐的人，他开车也是要吐的。


    那些轻度晕车的人本来就不那么严重，而且车还是由他开，所以他的精力、他的神经活动是不由自主地集中起来了。


    集中在哪呢？


    就是手脚的配合，眼观六路、耳听八方，虽然老司机自己不觉得需要多少调控了，那只是因为你熟练了，你不信你开四个小时，你看你困不困？你肯定非常困，那就说明你之前经历了一阵很长时间的神经高度兴奋，所以就是这样高强度的、丰富的神经活动，抑制住了植物性神经作出的保护，实际上就是通过转移注意力，让晕车部分的神经安静下来了。


    所以如果你要是那种晕车不厉害的人，假如你不开车，上车之后先把眼睛闭上，然后戴上耳机，认真地听咱们得到上的专栏课，集中注意力思考讲的内容，永远不要轻易地睁开眼睛，如果你按照我说的这种方法做，绝大部分轻度晕车的人是完全可以消除难受的感受的。


    说了方法，我再说几个瞬间让你晕车的感觉加倍的坏习惯，那就是在车上看书、看手机。


    因为你的书、你的手机，它也在晃动，它晃动的幅度跟耳朵给到的平衡信息基本不可能同步的，你目力所及的所有东西都在持续传输错位的信号，这比你看窗外那种错位的信号还要丰富、还要强烈，所以晕得更快。


    以上，就是晕车的方方面面，知道了这些你也能知道，为什么有些人玩电脑游戏，就是第一人称视角的射击游戏，如果游戏的视角设计的晃动不合理，就让人恶心。


    这些你也能知道了，它就是反过来，前庭平衡的信息没有改变，你脑袋没动，但是视觉信号里不停地传达头部晃来晃去的动作，这两个信号又不匹配了，于是大脑就下令保护自己——吐。


    ## 划重点


    - 1. 人会晕车，是因为人耳内部负责平衡的器官“前庭”采集的移动信号与眼睛采集到的视觉信号不匹配造成的。

    - 2. 植物性神经控制着人体不由意识控制的部分，比如闻到香味流口水、激动了流眼泪。一般来说，人体的不舒服很有可能是吃了有毒的食物，所以坐车觉得“晕”的时候，植物性神经会启动保护机制，赶紧把食物吐出去。


    卓克


    好了，晕车的问题就是这样，希望大家都能掌握好技巧，长途路上舒舒服服，我们明天再见。


