    ## 今日内容小结


    这节课我们通过分析如何找到最古老的衣服，告诉大家一种找旁证的思考方式：


    要证明一个事情最理想的当然是找到直接证据，但是很多时候，尤其是阻碍太多，或者历史太久的缘故，直接证据已经消失了，所以不得不去找旁证。


    那旁证怎么找呢？


    就是首先找到最早、最晚两个时间点，然后再在这个区间段里，寻找跟直接证据最紧密的事物，然后把它当作是旁证。


    ## 今日思考题


