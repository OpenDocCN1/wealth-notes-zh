    # 160 | 泡沫：怎么识别伪科学？


    # —— 概论15：泡沫 ——


    一项新的科研成果出现，总是会引发很多人的热rä...识别泡沫，不但有助于保护我们自己，也能在识别的过程中进一步理解科学的本质。


    伪科学是什么？


    这个问题如果细究起来，是很容易陷入到严肃的分析当中，可是我们不这么做，我们用最通俗的话说，就是：


    自己不是科学，却硬要标榜自己是科学，这个就叫做伪科学。


    # —— 科学理论与伪科学 ——


    怎么辨识伪科学？


    其实是一个大过宽泛的问题，因为曾经有不少惊世骇俗的科学理论，在它们最初诞生的时候，是被那个领域的一部分科学家称之为伪科学的。


    # —— 识别伪科学 ——


    所以我下面来说说普通人在生活中能遇到事情上，怎么识别伪科学。


    # —— 学术期刊背书 ——


    识别伪科学，我们主要说第二种方法，因为它需要的能力比较高，符合咱们专栏同学的特点。'
