    ## 136 | 旁证：人类是怎么分布到全球的？


    136 | 旁证：人类是怎么分...


    ### ——► 概念12：旁证 ◄——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    这个系列会给大家讲人类祖先的历史，并且从中归纳出一些科学思维的要点。你可能觉得，这是太过久远的事情，跟我们涨工资，分股票没有关系。但当你知道我们的祖先是怎么一点一点分布到全球的，那么以大见小，你也多少能用科学的视角来看待人口流动、或者农民工进城这些当代社会的现象，也能从历史的角度看待一个政策规定人口必须来或必须走，会产生什么影响。


    我们当前所在的地质年代，细说起来属于是显生宙的新生代的第四纪的全新世，比较复杂。


    全新世是从11700年前到现在，也就是我们之前课里讲过的，从那个仙女木事件之后几百年，全球暖和起来开始算的，这叫全新世。在全新世晚期，智人就只有我们人类一种了。


    不过在第四纪有两个世，一个叫全新世，一个叫更新世。


    更新世可就比较长了，它是从259万年前到11700年前，这个跨度中间出现了很多的直立人，尤其是晚期智人，有些甚至跟我们一样也产生了语言和原始的绘画艺术，不过最终他们都灭绝了。


    ### ——► 大气环境的影响 ◄——


    其实不只是人类，其他类型的生物历史大致也是这么过来的，几百万年下来，大多数都灭绝了，只有少数幸运地留了下来。


    之所以会这么动荡，大环境，主要就是气候变化，尤其是冰期跟温室期的交替，造成温度几十摄氏度上下浮动，造成海平面1、2百米的起伏。


    这些剧变对有腿有脚的动物当然不是立即致命，但是对那些不能活动的植物，就是灭顶之灾了。而植物属于食物链的底层，它们大面积遭殃之后，上层的食草动物和吃食草动物的食肉动物也会在后续的几百年里陆续遇难。


    而地球为什么会一会儿冻住，一会儿冰又融化了呢？


    你别以为大幅改变地球表面化学成分的只有人类，所有曾经广泛分布在地球表面上的生物都干过这件事。


    比如说几十亿年前那个藻类，就把地球大气层的化学性质完全颠倒了一次，从还原性变成了现在的氧化性。用“颠倒”可能还是个好词，我们也可以换一种说法，叫做向大气层中疯狂地排污，最终改变了大气层的性质，把它们自己也都毒死了。


    改变大气层成分的事，在植物大量出现之后也出现过，比如氧含量的剧烈浮动。


    像7亿年前，地球的氧含量只有3.5%，那现在是多少呢？现在是21%。后来就开始慢慢攀升，到了3亿年前，浓度已经是35%了，这一下就是4亿年前的10倍。但是35%的浓度维持了很短的时间，到了2.5亿年前，突然又减少了60%。在9000万年前又恢复到30%，这是两次大波动，现在是稳定在21%。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_124_0.png)


    大气环境跟海平面的这样大幅度的波动，天然就是一种物种大过滤的机制，就像一篦（pó）窝豆子，你一个劲儿地筛，凡是那些不满足条件的，没几下全都被筛出去了。


    被筛出去的就包括170万年前的元谋人，110万年前的蓝田人，和50万年前的北京猿人。他们和晚期的智人都不是一种种，这种差异有点像猫跟狗子似的。


    我们的祖先可以追溯到12万年前，或者现在最新的结论是20万年前，生活在东非的那群智人的身上。他们后来分了好几次走出非洲，在他们第一次走出非洲之前的几十万年，我刚说过的那些被海汰的元谋人、蓝田人、北京猿人早就灭绝了几十万年了，根本就没有后代留下来。


    不知道现在的中小学历史书上是不是还把北京猿人写成是中国人的祖先，那就是非主流科学观点了。


    ### ——► 人类起源于非洲 ◄——


    人类起源于非洲，这家伙什么就是主流观点呢？


    首先，它使用了最先进的工具，就是 Y染色体 DNA 的分析技术，科学家们最开始只用它作依据，因为它的稳定性好，它能追溯是因为只有男人才有 Y染色体，所以它的传承就是一条父系的脉络。


    你可以把它当作是一个世世代代记录的公司的账本，这个账本里只记录了一个公司款项的进出。那我们人类这个公司一直运营至少12万年都没有倒闭过。


    但如果再往前追溯，比如说13万年前，那个账本就已经丢了。我们12万年前那个人类的公司是之前几个断掉的公司重组过来的，所以我们分析人类祖先先走出非洲的，走的哪条道，后来怎么分叉，就全凭这些证据了。


    但是，在传播的过程中，每个员工抄写的账本都会以很小的概率抄错个别地方，谁也免不了啦。只要你抄错了，那从你之后接你班的人，等他抄你的账本的时候，他不知道你哪里抄错了呀，所以大概率说，他也会把你抄错的那个地方照单全抄，于是他的账本天生就带着有你的错误的标签。可惜他自己也是人啊，他大概率也会发生点错误，这个错误就是发生在其他地方，这个错误可以代表他自己的标签。


    那么，当我们沿着这些标签倒回去的时候，就能知道不同标签是谁先谁后，谁是从谁那儿抄的呀，谁没抄谁的呀，这种标签，就叫做人类遗传树状图里的单倍型。


    比如说，我们现在花几百块钱上千块钱弄点唾液，或者口腔上皮细胞做的基因检测，里面肯定有一项是你祖先的来源，那里使用的不是这么通俗的词语，而是用了单倍型。


    Y染色体 DNA 的单倍型从大类分有 A、B、C、D、E、F、G，一直 到 T，然后每个字母下面还有子型，比如说 A1型、A2型、A3型，B1型、B2型、B3型。A1下面还有更小的子型，比如说
    A1a、A1b、A1c，而且还能继续往下分，只要这个类型还有后续分叉，就可以一直这样分下去。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_124_1.png)


    除了父系的 Y染色体 DNA，还有母系这一单链的粒线体 DNA，它也有自己的一套命名方法，它使用的字母跟 Y染色体还有重复的，所以分析或者展示人类基因图谱的时候，得说清是在哪个方法下的分析结果。


    之所以叫做单倍型，这个单倍是因为这些数字只来自于父系的一支，或者母系的一支，是单条 DNA链上的数据。但是像我们普通人身上的体细胞，这个 DNA都是双链互补的，这叫做双倍体。


    虽然现在对古人类的研究中，对于人类到底起源自哪，还有争议，还有新的发现。比如最近就发现很可能不是源自于东非，更有可能源自于西非，是20万年前的。


    但是人类祖先是单一起源，这个反对的声音几乎没有，即使是反对的，就是支持非单一起源的科学家，他们的观点大都可以简化成一种意愿：


    就是他们希望发现，至少有一支是从自己的故乡起源的，这类情绪左右科研的例子


    己的故乡起源的，这类情绪左右科研的例子不但使得科研结果做不好，甚至连情绪表达的初衷都难以满足。


    这就好像一个1米65的男生，他走哪都穿一个10厘米高的厚底的鞋，步态都有点不稳了，可是走哪都跟人特别强调说自己的身高是1米8，这非但不会让人觉得他个子高，反而会引来更多的嘲讽。而对比来看，你就像足坛巨人马拉多纳，他就是1米65，他从来说自己1米7，任何比赛他都是对方盯防的重点。


    做研究也是这个道理，你如果能用最完备的数据用最先进的工具把人类祖先是怎么去怎么去的给分析出来了，不论这个结论是在哪起源的，今后凡是你的研究被提到了，都难免是这样的介绍：


    某国科学家谁谁谁的研究显示，人类祖先起源自哪哪哪，在这种评论中出现的国名，那不是更荣耀嘛。


    不过，愿意往自己脸上贴金的国家还挺多的，比如对于印欧语系这种语言到底是哪儿起源的，德国语言学家就有很多坚信是日尔曼起源的。


    这种情绪是一种不自信，而且就算表达出来之后，效果也适得其反，别人非但不信，反而知道你是不容置疑的。就像我们听到韩国人说，秦始皇跟孙悟空都出自他们那儿是一样的，我们的第一反应跟其他国家的科学家听到我们说人类至少有一支是起源自中国的，听后感是一样的。


    ## —— ◆ 被迫走出非洲 ◆ ——


    说到人类是怎么分布到全球的，起始点要从11万年前说起，因为那个时候，人类的共同祖先被末次冰期逼得不得不大批出走了。


    末次冰期也是距离现在最近的一次，它是从11万年前开始变冷的，到了3万年前达到了最冷，最终在1.1万年前暖和起来了，新仙女木事件就是包含在这个冰期里最剧烈的一次波动的时间。


    11万年前，最原始的两个类型，A跟B出现了，它只是在非洲内陆移动了一下，一个去了非洲的西南，一个去了非洲的中部。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_125_0.png)


    接下来就过了5万年的时间，出现了第一种突变，叫做M168。


    M168的突变包含了C跟D两个型别。


    C从东非大裂谷的最南端沿着海岸一直往东北走，可能一路上的东西也都是海味。过了阿拉伯半岛之后，在中亚继续沿着海，然后沿着印度海岸线绕了一圈，到了孟加拉。在这里，C分成了两路：


    - 一路从孟加拉北部进入云南，然后沿着长江走到了中国沿海，然后继续北上，到了蒙古；

    - 另外一路在孟加拉继续沿着海岸线走，这个规律还没破，在冰期从印尼走到了澳大利亚。


    还有一路是D，是从东非大裂谷的最北端走的，没沿着海岸线走，一直在内陆走，到了孟加拉以后，才开始沿着海岸线走，然后也是在冰期，从印尼走到了澳大利亚。


    C、D这两支就是后来东亚跟澳洲人种血脉的最初来源，这发生在6万年前。涉及到中国的部分咱后面细说。


    ## —— ◆ 今日内容小结 ◆ ——


    这节课我们得到的科学思考习惯是什么呢？

    就是排除情感因素的研究是什么样的。

    首先你看，怎么走出非洲的？

    就算那些祖先是有早有晚，那个时间点距离现在总是两三千代人之前发生的事了，跟现代人的利益毫无关联，这就是一个很好的时间间隔，这基础不错，它天然有一个属性，就是我们在分析研究的过程中，并不会先预设一个答案，再想法从茫茫的素材里拼凑出一个能圆满解释心中期望的那个答案的那一部分证据。

    另外一个就是我们使用的素材好，像历史素材，不论是口述的，还是笔记的，甚至文物的，它总有篡改，总有造假的机会。但是，基因起码到现在为止，还不方便篡改。假设说100年后，连中学生都可以做基因编辑，这事咱不提，起码现在是没有篡改过的。

    所以，有这两个属性在，拥有科学素养的人天然就会被它吸引，就能利用更良好的素材基础得到更好的科学结论。


    ## —— ◆ 今日思考题 ◆ ——


    其实在11万年前，还有一批人类祖先就在冰期到来的时候，他就先穿越了现在的撒哈拉沙漠，走到了欧洲东部，就直接往北去了。他从南到北，贯穿了整个撒哈拉沙漠。其实你想这件事到现在都很少有人能做到，那11万年前的祖先是怎么做到的呢？

    如果你想到了答案，就留在评论中。


    ## 划重点


    - 1.曾经广泛分布在地球表面上的生物，都曾经大幅改变地球表面的化学成分，造成气候变化，带来灭顶之灾。

    - 2.大气环境和海平面大幅度变化，是一种天然的物种大过滤，元谋人、蓝田人、北京猿人都是这样走向灭绝的。

    - 3.通过DNA分析技术，科学家们确认了人类起源于非洲。

