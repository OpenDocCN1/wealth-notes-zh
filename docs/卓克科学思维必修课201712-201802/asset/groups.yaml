    # 149 | 问答：男人的Y染色体要消失了？


    149 | 问答：男人的Y染色色...


    # ——◆ 今日内容看点 ◆——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. Y染色体为何会越来越短？

    2. 没有了Y染色体，雄性会消失吗？

    3. 我们有必要担心Y染色体消失吗？


    有个同学问到一个听上去挺恐怖的问题，就是Y染色体会不会消失？


    他最近看过一篇文章，叫做《留给男人的时间不多矣》，这篇文章说的是男人的性染色体是XY的组合，结 vs 果照片拍出来一看，Y染色体明显比X染色体小好多好多。而且更让人担忧的是，人类按照现在的趋势发展下去，460万年以后，Y染色体可能会完全消失。他就想问问，这是不是危言耸听啊？


    简单一句话回答：不是危言耸听，这种观点叫做“Y染色体退化论”。


    # ——◆ Y染色体退化 ◆——


    最近是2015年10月份的时候，澳大利亚的La Trobe大学分子科学研究所的科学家，在国际基因组学会上发表一个演讲的时候公布的研究成果，这个研究结果通俗地说就是Y染色体在萎缩。


    其实这已经不是这个团队第一次发表这样的观点了，最早在2002年的时候，他们就在《Nature》上发表过一篇文章，叫做《人类精子：性别的未来》，那个时候他们预测，在1000万年内，人类的Y染色体会完全消失。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_167_0.png)


    我们先来看一张图，这个是在显微镜下，男性第23对染色体的样子，可以看到Y是明显小的，大约只有X的1/3。


    但从前不是这样的情况，XY系统确定性别的这个事大约是在1.66亿年前出现的，当时出现在一些叫做单孔目动物的身上，单孔目简单地说就是大便、小便、生殖细胞都从一个窟窿出来。比如说现存的鸭嘴兽就是单孔目的代表。


    单孔目动物再往后发展一步就出现了哺乳类动物。叫它XY系统也并不是因为染色体在显微镜下的形状有点像X或者Y的字母，不是这样的，而是最早的人们不知道X染色体能不能被染色，所以先给它一个名字叫“未知元素”，X
    element，和它紧跟的就顺着字母排下去了，叫做Y了。


    对哺乳类动物的分析可以知道，X跟Y最初的大小是一样的，比如说人类X染色体上有1438个基因，但是现在通过显微镜看，Y只有X的1/3大小，按理说，那就应该是1438除以3那么多，大约是480个基因。但实际上，人类的Y染色体上远没有这么多，只有45个基因。


    哺乳类动物的性别和人是一样的，不论有多少对染色体，总有一对是决定性别的。


    实际上，目前全世界所有雄性哺乳类动物的Y染色体都在缩小。当然，大家的程度是不一样的，人类男性退化的程度属于是居中的，因为现在已知，已经有几种哺乳类动物的Y染色体已经先于人类消失了。比如说南高加索的鼯形田鼠，还有日本两种刺鼠，它的性染色体只有一个X了。


    那没有了Y染色体之后，雄性会不会消失呢？


    不会的，现在的研究发现，决定性别的基因会从Y迁移到其他的染色体上，但是具体是怎么迁移的，迁移之后是由什么决定性别的，这个还在研究当中。


    为什么Y染色体会越来越短呢？


    这个答案是，Y染色体会跟X染色体上的基因发生重组。


    重组是另一个概念，重组的方式挺多的，最常见的是在有性生殖的时候，精子跟卵子从单倍体组成多倍体的过程。但是造成Y染色体变短的基因重组不是在这个过程发生的，是它形成了体细胞之后才发生的。如果他不是男性，她是女性，两个X的话，那一个上面发生了损坏，那它得修复啊。


    怎么修呢？


    就是通过另外一条上的复制版给它修复一下。这个过程有点像Ctrl+c再Ctrl+v这个过程。但是如果是雄性的话就修复不成，Y染色体只有单边一条，它没有形成对，所以一旦损坏就不好修复。不太好修复也不是说完全不能修，它可以通过在Y染色体自己这条上重复的序列把它Ctrl+c，再Ctrl+v一下。


    可是毕竟不是每个片段都有重复的备份，所以还真的就有一些在丢失之后彻底丢失掉了，这样的速度大约是每100万年损失掉5个基因的速度。但是最核心表达男性功能的基础基因没有跑走，而且这个基因附近还发展出抑制重组发生的机制。所以这个机制就保护着最后45个基因。


    # ——◆ 性别的价值 ◆——


    那我们用不用担心Y染色体消失呢？


    从自然发展的角度来说，不用担心，因为就算Y染色体消失了，也要460万年的时间。退一步说，就算Y染色体消失了，性别照样还会存在的。


    我们之前的课里也讲过三节跟性别有关的内容，这个问题带着我们从另外一个角度来认识性别。性别是在严酷环境跟激烈的物种间的竞争下，展现出的一种更有优势的繁衍跟生存的策略，对复杂的动物来说，性别是一定不会消失的。


    那些消失了Y染色体的鼹鼠，它们不是也在一直传宗接代嘛，只不过我们不知道它们是怎么表现性别的。


    Y染色体的消失只会让性别从其他的渠道表达出来，至于是什么渠道，我们现在还在观察那些已经消失了的鼹鼠们，也许这就是今后雄性哺乳动物的未来。所以从自然发展角度，我们不用担心Y染色体消失。


    # ——◆ 吸烟的又一大危害 ◆——


    可是还是要担心一下的，那就是从健康的角度，在2014年，《Science》上就刊登了一篇瑞典乌普萨拉大学的研究：


    他们在10几年中跟踪了1153名老男人，定期采集他们的血液，就发现年齡超过80岁的人，有8%的男性的白细胞会有不同程度Y染色体丢失的情况。


    而且那些长期吸烟的男性Y染色体丢失更严重，最高是普通人的4倍。


    最严重的情况是，有2%的长期吸烟者，他们的血液中有1/3的白细胞里压根就没有任何Y染色体。统计中，Y染色体丢失的男性平均寿命比正常人要少5.5年，死于癌症的风险是正常人的3倍。这些是统计学上相关的因素。


    初步的因果关系也可以发现，很多血液中的免疫细胞在缺少Y染色体的时候没法正常发挥自己免疫的功能。可是99.99%的癌细胞其实都是靠我们自身的免疫系统杀死在摇篮里的，所以这个研究成果可以算吸烟的又一个崭新的重大危害了。


    一个吸烟的人，基因会存在异常的甲基化的特征，而且就算是这个人戒烟之后生的孩子，体细胞上，一样也带着这样异常的甲基化的特征。有些可能需要戒烟很多很多多年，然后再出生的孩子才能正常。


    所以，如果你担心Y染色体今后可能会消失的话，那不如抓紧先把烟戒掉，因为这个会让它立刻消失。


    呃唉再说回调节性别跟调控它表达的Y染色体上的基因。


    如果我们在中小学的时候能从生物的角度理解性，对今后树立一个稳定可靠的人生观跟世界观处就非常大。性爱只是性现象中的沧海一粟，多从基因的角度了解性'
