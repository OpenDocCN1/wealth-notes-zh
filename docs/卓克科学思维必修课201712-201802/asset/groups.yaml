    ## ——►概念11：发展◄——


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    啤酒肚是因为啤酒造成的吗？


    答案是，有可能。


    ## ——►啤酒引发肥胖的原因◄——


    因为啤酒本身就包含了一定的热量，而且爱喝啤酒的人，很少是只喝啤酒同时不吃其他零食，所以就着啤酒吃下去的加餐更是雪上加霜。本来，大部分人一日三餐已经摄入了不少能量，再因为晚上看电视、或者看比赛，多吃了一顿，那肯定是要发胖的。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_44_1.png)


    具体能胖多少呢？我们可以算一算。我们按一个人在一顿啤酒加餐里能喝到的感觉是，再喝就喝醉的地步，那么什么叫喝醉呢？


    我们可以简单假设，喝进去100克酒精就算醉了，以一般啤酒3.4度的度数来看，需要2944克的啤酒才能醉。


    那么喝下这么多啤酒，摄入了多少能量呢？


    美国农业部曾经给出过单位容量，啤酒和常见饮料的热量，其中牛奶、可乐、啤酒是三个比较高的，它们每百毫升的热量分别是60.8、43.7、38.9，单位是千卡。


    所以，按这个热量来估算，把人喝到醉，摄入的啤酒包含的热量是1118千卡。而一般来说，成年男子一天需要摄入2200千卡热量的食物，那现在一顿啤酒就已经到了1100多千卡，相当于喝酒就多摄入了一天50%的热量。


    ## ——►能减肥的“食物”◄——


    之前也有人问过，这个世界上有没有吃了以后能减肥的食品呢？


    确实有，那就是冰水。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_44_2.png)


    ## ——►苹果型和梨型身材◄——


    我们说回啤酒肚到底是什么原因造成的，因为我们刚刚只解释了发胖的原因，可发胖不一定都变成啤酒肚啊，大家可以看看下面这张对比图。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_44_3.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_44_4.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_44_5.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_44_6.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_45_0.png)


    虽然看着视觉效果不好，但是现在很多医学研究都观察到，就算肥胖不是什么好事，但是梨型身材的肥胖也比苹果型的肥胖风险更低。而且临床上也观察到一些人，一看就是个胖子，可是体检各项指标又都正常，这种人基本全都是梨型身材。


    ## 为什么会有梨型身材？


    这就要说到人体脂肪的三种类型了：


    - 一种是表皮皮下脂肪；

    - 一种是深皮皮下脂肪；

    - 一种是内脏脂肪。


    表皮皮下脂肪在全身的皮肤下面都有，分布最多的就是两条大腿上，深皮皮下脂肪分布在皮肤下比较深的地方，主要就是上半身的躯干部分，虽然比表皮的深，但是仍然属于皮肤下面覆盖着的一层脂肪。而内脏脂肪就不一样了，它主要挂在内脏上、大网膜上跟肠系膜上，这两种膜的作用就有点像固定的网，把内脏的位置固定住，把肠子的位置固定住，如果没有这些膜，肠子这种又细又长的东西就很可能像耳机线一样打结，那就危险了。


    当人们发胖的时候，内脏脂肪如果堆积，脂肪也都会挂在这些膜上。一旦营养过剩，营养物质会纷纷转化成脂肪。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_45_1.png)


    刚才说的这三类脂肪其实是一起积累起来的，没有谁先谁后的问题，但是区别就在于分布有差异。


    对亚洲人来说，更多的人脂肪分布在深皮下脂肪跟内脏脂肪上，欧洲人表皮脂肪分布得更多。


    表皮和深皮下脂肪并没有太大的危害，你甚至可以理解成它就是披在身上的一层棉被，或者是挂在四肢上的沙袋，夏天会感觉非常热、非常沉，看上去不太美观。但是内脏脂肪就有明显的害处了，比如在流行病学的统计中，内脏脂肪更多的人在心血管疾病、中风、糖尿病、关节炎上的患病率明显要高。


    咱们之前说过，流行病学观察到的是一些可疑的迹象，致病原因是属于因果关系的，而内脏脂肪高的人，患病率也更高，这个在病理学上也有解释，因为大量的脂肪覆盖在内脏上，所以更容易向靠近内脏的血管里释放脂肪酸，这样就会给血管引入更高的坏的胆固醇和产生胰岛素抵抗。


    而且上上个月，在《致癌基因》这个期刊上的研究也证实了，人体的内脏脂肪细胞会比其他部位的脂肪细胞释放更多的成纤维细胞生长因子2，这是一种蛋白质。这种蛋白质是需要跟受体结合作用的，但一旦缺乏这种受体，就容易导致细胞的癌变。当然，这种癌变是不能用人来做实验的。科学家们就把这种蛋白质植入到小鼠体内，确实导致了实验鼠体内更多数量的癌细胞产生。


    ## —— 今日内容小结 ——


    所以最终我们总结一下，总是习惯把啤酒小菜当加餐，会导致过度的肥胖，而过度肥胖的人中，有一部分胖起来之后是苹果型的肥胖，他们会出现啤酒肚，这样的身材，貌似四肢跟脸的比例很协调，看不出肥胖的丑，但实际却是肥胖中的高危类型，如果别无选择，一定要变胖的话，我们还是希望能够胖成梨型，就是脂肪主要堆积在屁股跟腿上的那种肥胖，这种肥胖给身体带来的危害小。而啤酒肚是一种典型的高危标志。


    有的时候科学结论会改变一个人的审美取向，比如我20多岁的时候，如果非要从梨型身材跟苹果型身材中选，我肯定毫不犹豫地选择苹果型，因为我觉得梨型身材太难看了。但现在，我会毫不犹豫地选择梨型。


