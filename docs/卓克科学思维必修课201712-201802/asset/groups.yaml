    血液总是短缺，所以用血也有一定的规则，原则上是这样的，它是按照紧急程度分。


    最紧急的就是急诊里的大出血需要输血，这个是最优先保障，基本上当地的血库有多少血都优先保障急诊手术。你说这也太浪费了，但是没办法，全球的规则都是这样，否则公民对整个国家医疗体系的信任就崩溃了。


