    # 108 | 问答：喝一碗姜糖水大姨妈就不疼了？


    108 | 问答：喝一碗姜糖水...


    # —— 安慰剂效应 ——


    每周两次答疑之后，我总收到一些这样的问题，比如：


    你说葱姜蒜这种东西没有疗效，那为什么我每次大姨妈难受的时候，喝一碗姜糖水就不疼了呢？


    还有人说，自己海鲜好几次就看着大蒜吃就不拉肚子。


    我的回复是：


    都是安慰剂效应。


    这个词很常见，它是一九五几年才提出来的，因为那个时候全球的药械行业正是规范化起步的时候，各种法律也出台了，FDA 开始对市场上出现的各种药跟健品动真格地监管了。


    药企在研发的过程中就会遇到病人就算是没有吃上那些有效药物，吃的是跟那些有效药物外观一样 的假药，他们吃假药并不是药企专门坑害他们，而是为了做对照实验，他们作为对照组，必须就得把假药跟真药外观做得一模一样，比如说都得是菱形的外观，上面假如有字母，那字母都得是一模一样的，裹的糖衣的颜色都得一模一样，比如说都是亮晶晶的蓝色。结果很多药企就发现，那些吃到假药的患者一样也出现了病痛缓解的情况，比那些完全不吃药的还要好一些，这种现象就叫做安慰剂效应。


    # —— 不可靠的主观判断 ——


    我就找了一篇2011年在新英格兰医学期刊上发表的关于安慰剂的研究。


    在国际医学界有四个最顶级的期刊，它们分别是柳叶刀、新英格兰医学期刊、美国医学期刊和英国医学期刊。这四份期刊，假如说是一个985大学的研究者，要是在这四个期刊里一年至少都能发上去一篇文章的话，过不了5年，准是教授了。所以上面的内容都属于质量很高的，可信度很高的。


    那这篇文章研究的是对于哮喘来说，正经的药、安慰剂、假针灸、不治疗，这四种方法产生的效果到底谁强谁弱，而且重点要评估的就是安慰剂效应。


    这里正经药指的是沙丁胺醇，这是一款成熟的药，专门用来防止支气管痉挛导致的哮喘和肺气肿。安慰剂用的是普通的淀粉的成分，这个就多说了。


    假针灸是什么呢？


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_41_0.png)


    也就是说使用的针灸的针头不是那么一根小银针那样，而是外面是一层中空的塑料组管，管里才是针头。但是如果是真的针头它应该是带尖儿的，但假的针头的头部是平的。


    在扎针灸的时候是这样操作：


    先把套管扎到皮肤上，这已经有刺痛感了，然后再把针头往下推，但是病人不知道这针头是平的。跟病人解释，这就是为了医疗的卫生措施做的一个新型的针，当把这一头平的针往下推的时候，扎到皮肤上，也有刺痛感，就用这种方法来迷惑实验对象，让他们以为是正在做针灸，其实针根本就没有扎到皮肤里，所以叫假针灸。


    第四组不做治疗的，这也用多解释。


    这个实验的设计细节很专业，咱们也不多说，就说一下最后的评判结果。


    通过一周多次治疗以后，对治疗效果作评估，评估分成两种：


    一种是来自医学上的客观评估，它是来测量患者肺活量的改变；


    另一种评估是患者自己对一周之后身体情况的自我评估，这就是一种主观的评估了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_41_1.png)


    在客观医学评价中，使用了一个星期沙丁胺醇的人，改善指标是20.1%，这是改善最多的。使用安慰剂，使用假针灸和不做治疗的，这三组人的改善指标分别是7.5%、7.3%，7.1%，也就是说这三个没有做正经治疗的改善的情况几乎是一样的。


    你说没做正经治疗怎么还改善了呢？


    答案是：我们作为一个生物，身体出现了疾病，它自然会往自愈的方向发展，所以大约还是有7%的人好转了。


    在这个例子中，客观医学评估下，安慰剂效应并没有出现，但是在之后病人主观的自我评估中，这个效应一下就蹦出来了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_41_2.png)


    上图就是病人自我感受的评估，使用沙丁胺醇觉得自己好转的人提升到50%，吃安慰剂觉得有效的人提升到45%，扎了假针灸觉得自己好转的人是46%，不做任何治疗也觉得改善的人都有21%，都赶上在客观评价中效果最好的那一组了。


    这有好几个方面挺有意思的，你可以看着：


    第一个就是安慰剂效应产生于心理，也作用在心理，在生理指标上可以完全看不到，但是心理上已经觉得很有效果了。所以那些在私信中问我，说我吃了什么、我喝了什么、我做了什么，我就感觉好了。你们是不是属于这类呢？


    第二个有意思的点就是，因为病人总还是希望自己能更健康，所以即使加这个实验被分到了不做治疗那组，在自己身体评估里也有21%的人觉得自己好转了，而实际上这个数字比这个组真正好转的人数多了2倍。


    第三个有意思的点是，服用安慰剂的效果和假针灸的效果是一样的，所以假针灸也是一种安慰剂。而且因为它确实实在治疗过程中采用了一次医疗措施，而且还是盲测的，患者自己并不知道吃的是安慰剂或者是做的是假针灸，所以这一做带来的误解的效果是最大的。自己感觉好转的人数比真实好转的人数多了5倍。


    第四点比较有意思的是，就是那些吃了真药的人在自我评估中感觉自己好转的人也比真实发生好转的多了1.5倍。


    所以从这组实验中，我们就能总结出，安慰剂效应可能是这么一种存在：


    它更多体现心心理作用上，更少体现在生理指标上，而且它是在任何情况下都存在的，不管是吃了真药还是吃了假药。


    而且尤其值得关注的，是那些已经进行了医疗措施，就是吃了淀粉片的人，扎了假针灸的人，感觉好转的人里，只有17%是真正生理指标上好转的，剩下83%的人都是被自己的愿望误导而不自知的人。


    你可能最初想象不到心理安慰有这么大的比例误导人，所以每当我看到有人问我，说为什么我每次大姨妈难受的时候喝一碗姜糖水就不疼了，为什么吃海鲜我每次吃大蒜就不拉肚子，为什么我被风吹到了就感冒，就这些问题，我其实更想问的是，你怎么能证明自己不是那83%被自己的美好愿望误导而不自知的人呢？


    当然，我至今还没有问过任何人，因为想清楚这个问题，需要前面一大套的逻辑，实在太费事了，没法解释。所以你也能在大医院见到，那些知识过硬的、经验丰富的老夫遇到病人问这些问题的时候，只要病人的做法不是自伤、自残，那病人愿意喝点糖水，愿意春天也穿个羽绒服，愿意夏天也不开空调，愿意多吃好多蒜，毕竟不是什么明显的危害性的做法，那医生都由着病人去做，他也不拦着，他也不给你

