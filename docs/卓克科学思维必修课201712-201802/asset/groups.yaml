    # —— 概念10：起源 ——


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    # —— 上节思考题解答 ——


    上一节课最后，我给大家留了一个思考题，那就是我们一直说的物种大灭绝，它的特征表现是物种数量的急剧减少，但如果从反方面容许，也可以说成是某个物种形成了绝对的生存优势，所以物种大灭绝可不等与那个优势物种灭绝。


    那么问题就是，失去了物种的多样性，对那个优势物种来说，是增加了它的生存可能性呢，还是减少了呢？


    我的答案是，减少了它的生存可能性。


    可能很多人都觉得，没有大熊猫、扬子鳄、白鼬羚，我们生活不是也没受影响吗？如果要是再没有蚊子、苍蝇，那人类的身体可能就更健康了。


    没错，也许减少一两个物种，咱们不会察觉出有什么的，但是如果物种是全景式的灭绝，这影响就像链式反应一下进行下去了。


    # —— 应该抛弃世俗的价值 ——


    有些媒体为了宣传保护生物多样性，就从价值的角度去考量。


    我估计你也见过这样的说法，比如说药物有很多原材料就是取自于植物，物种丰富的热带雨林就有着更多的机会从中找到有效的药物，而且还有科学家对现有的药物作了统计，大约有一半最初就是从动物和植物体内提取的，这里就包括最著名的阿司匹林，这个是从柳树皮里得到的，还有治疗疟疾的奎宁，除此之外，镇静剂、利尿剂、止痢药、抗生素、避孕药，很多很多都是从植物中提取出来的，甚至抗癌的明星紫杉醇也是从紫杉的树皮里提取出来的。


    # —— 无法承受的代价 ——


    那不是世俗价值的观点是怎么看待这个问题呢？


    要说明这种价值观，我得先介绍一种对热带雨林树蛙的研究：这个研究发表在2011年5月份的《生态学通讯》上，作者约翰·恩斯就回答了一个看上去不太跟眼的问题，那就是为什么亚马逊的热带雨林里树蛙的种类那么丰富，可是对照东南亚跟美洲的其它热带雨林里，树蛙的种类就那么少呢？'
