    ## 复习+预告 | 拓展生命的范畴与安抚被禁锢的灵魂


    ## —— 本周课程复习 ——


    ### 概念11：发展


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    109 | 发展：啤酒肚是啤酒造成的吗？


    - 1. 喝啤酒很可能会引发肥胖，因为啤酒是饮料中热量比较高的一种，大约是普通可乐的90%，而且很少有人在喝啤酒的同时不吃其他食物。

    - 2. 喝1L的0摄氏度水相当于减了约4克脂肪，大约相当于跑步500米。

    - 3. 梨型身材的肥胖比苹果型的肥胖风险更低，因为苹果型身材很可能意味着内脏脂肪较多，患各种疾病的概率更高。


    110 | 发展：古代人和现代人是怎么看待同一种病的？


    - 1. 人类对于疾病的认知，建立在不断的真实观测所获取的具体知识之上，随着观测手段的进步，对于同一种疾病的认知逐渐升级。

    - 2. 在现代医学的观测水平下，我们已经用不着把疾病的原因扣上一个“外邪入侵”的帽子了，在最先进的观测下，疾病是什么样子，就是什么样子，脱离了观测的思辨式的抽象化思维，是有害无益的。

    - 3. 保持鼻腔湿润，对于防御那些可以通过空气传播的病毒是很有帮助的。


    111 | 发展：天花，富人比穷人死亡率更高


    - 1. 天花病毒能广泛的传染人类，在于它能通过空气传播，而且在潜伏期就具有很高的传染性。而那些让宿主很快就不能移动与死亡的病毒，大多在演化的过程中已经灭亡。

    - 2. 人类不仅是对于治疗天花没有特效药，而且是针对绝大多数病毒都没有，被病毒感染后的痊愈，几乎都是等待自身免疫系统起作用。


    112 | 发展：天花是如何塑造了人类史的？


    - 1. 天花是人类史上造成死亡最多的疾病之一，它很大程度上塑造了人类文明史，顺治帝死于天花，康熙帝因为得过天花继位。斯大林、华盛顿、林肯均得过天花。

    - 2. 天花曾杀死了英国本土的所有王位继承人，最后只好让欧洲大陆的汉诺威国王去继位。他的懒政让英国出现了新的政体，诞生了首相。

    - 3. 天花造成美洲印第安人的大量死亡，让后来美洲大陆的殖民开发缺少劳动力，进而导致了奴隶贸易的兴起。


    ## 答疑时间


    113 | 问答：苹果有意降低老手机性能吗？


    - 1. 一个现象或者问题的产生，绝大多数都存在诸多因素，很多看似明显的因果关系，往往只是相关而已，感觉联系紧密，其实经不过查证和检验。

    - 2. 探讨具体的事物，最稳妥的就是使用科学的思维方法，从提出问题，建立假设，收集证据，再到检验，最终才能得出相对可靠的结论。


    114 | 问答：手机电池用不用维护？


    - 1. 作为普通用户，对于手机电池无需进行任何维护，各种关于电池保养、充电小技巧等，不仅几乎没什么用，反而给自己带来很多麻烦。

    - 2. 锂电池很脆弱，所以在形成产品前已经经过了非常稳妥的设计，它的充放电控制根本不能依靠人的经验来操作，只能由专门的控制电路来实现，所以人根本就不用操心。


