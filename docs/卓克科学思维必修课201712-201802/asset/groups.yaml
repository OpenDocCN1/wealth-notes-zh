    这些宣传当然很诱人，但它离实现太远了。这就像一个9岁的孩子，他说要努力学习，一定要刻苦用功，要在3年之内证明爱因斯坦想。这句话里包含了许多积极的词汇，但实际上却是一种不务实的妄想，是应该制止他的。


