    ## 150 | 问答：口臭怎么办？


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_170_0.png)


    150 | 问答：口臭怎么办？


    ## ——▸ 今日内容看点 ◂——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    - 1. 人为什么会口臭？

    - 2. 如何解决口臭问题？


    有听众问到为什么会口臭，怎么办？


    简单回答：

    80%口臭的人都是口腔里的问题，而不是胃里的问题，其中绝大多数都应该马上去看看牙医。


    绝大部分牙齿问题都会导致口臭的，比如像牙周炎、智齿、牙龈炎，而且大部分都是那种恶臭的味道。


    ## ——▸ 食物残渣引发的口臭 ◂——


    凡是牙齿出现这些问题，要不就是食物残渣经过细菌分解之后产生的臭味，要不就是牙龈组织化脓了，那些臭味主要就是硫化物、嘌呤之类的。


    ## ——▸ 唾液少引发的口臭 ◂——


    当然，80%都是口腔里的问题，它不只集中于牙齿，因为口腔里还有其它东西，比如像舌头，粘膜。


    ## ——▸ 舌苔引发的口臭 ◂——


    除了口水少，另外一大原因，就是舌头臭了也会口臭的，那怎么办呢？

    就是在刷牙的时候顺便刷刷舌头。刷舌头这事好像很少人做，但其实正确的刷牙方法里就是包含刷舌头的。


    ## ——▸ 其他问题引发的口臭 ◂——


    口臭还不一定非得是口气造成的臭，鼻子里喷出来的气如果臭的话，也会表现出出口臭。


    ## 划重点


    > 1. 食物残渣、唾液少、舌苔是引发口臭的主要原因，解决办法就是用牙线、合理喝水、刷牙时要刷舌苔。

    > 2. 说口臭是胃火导致的是没有科学依据的，大部分的气味就是口腔部位产生的，把对应的问题解决了，一切就解决了。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_170_1.png)


    好了，关于口臭的问题我就回答这些。我是卓克，咱们明天再见。

