    除了这两大列表之外，最高水平的还有一个EL，这个是工程期刊的评价体系，不过伪科学一般还是跟理论相关的内容，工程细节方面伪科学几乎是不涉及的，所以这个咱们就一部了。


    # ——核心期刊——


    门槛最高的说完，那门槛降低一些呢？


    就是咱们国家称之为核心期刊的那些刊物。这里我并不是贬低咱们自己，因为像SCI有3500多种刊物，只有120多个是中国的期刊，占比是3.4%，这个比例放在这儿。我们再来看，咱们国家拿出任何一个数据，比如像经济总量、人口数量、科研人口的数量，反正是任何一个项目，在世界上的比例都远远超过3.4%这个数值。


