    \ 2004 | 近视 |  | 660... |\n| MYP8 | 3q26 | Hanaoka, 2004 | 近视 |  | 990... |\n\
    | MYP9 | 4q12 | Hanaoka, 2004 | 近视 |  | 990... |\n| MYP10 | 8p23 | Hanaoka, 2004\
