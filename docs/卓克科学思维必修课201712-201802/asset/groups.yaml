    ## 127 | 旁证：寻找衣服的历史


    ### 概念12：旁证


    对历史事件的研究很难有直接证据，所以旁证和考据就是很重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    有过之前科学思考训练的同学们，如果看到这节课的题目——寻找衣服的历史，应该多少会想到，这个追根溯源的过程一定少不了使用DNA分子钟。没错，这次依然是少不了它，而且还是好几个分子钟一起使用的。


    那这节课我们也随着科学家的逻辑判断思路一起来想一想，怎么来判断最早的衣服是什么时候出现的呢？


    ### 褪去体毛的人类


    首先，在前面的课程里你知道，发热跟散热的能力，它的变化是根据尺寸的三次方跟二次方变化的。如果一个物种发热猛增、散热跟不上，它就会死亡。


    人类的祖先曾经就面临过这样严酷的现实，东非的森林大面积减少，森林里能容纳的猩猩就少了，有一些能力差的，或者运气差的，它们必定失去了领地，失去领地就意味着失去食物跟交配权，那就不留下后代了，所以被迫出森林的猩猩大部分是惨遭不幸，但还是有一小撮猩猩幸运地活了下来。它们得想办法在干旱的非洲大草原上讨生活，后来，也就是这一小撮幸运的猩猩成了我们的祖先，反而是那些把我们祖先挤出森林的，当时生存能力更强的猩猩，它们如今成了濒危保护动物。


    在草原上讨生活指的就是猎杀其他的动物，可人类始终都没有演化出时速50公里以上的奔跑能力啊，始终也没有演化出食肉动物的利爪跟牙齿，所以单对单，个对个，我们谁也追不上，谁也打不过。


    那凭什么能吃到草原上的动物呢？


    靠的就是集体的智慧跟坚韧不拔的耐力。几十个人对一群羚羊长时间地跟踪、包围，有的时候是几小时，有的时候甚至是几天。高耗能的体力活动在没有树荫的遮蔽下就需要想办法散热了，所以人类的祖先褪去了体毛，这一下在慢跑的耐力赛中，人类可以战胜很多动物，追击猎物的时候胜算就大很多了。


    但是褪去体毛会带来两个问题：


    + 第一个是皮肤容易感染；

    第二个是容易被太阳晒伤。


    第一个问题在潮湿闷热的丛林里是很难解决的，但是在干燥的大草原上，找一个泥塘滚一滚就能起不小的作用。


    第二个问题晒伤，我们之前说过，它是通过产生大量的黑色素来解决的，大部分动物的表皮都是粉嫩的，动物身上的颜色都是毛发的颜色，比如象猪，无论是黑猪、白猪还是花猪，它的肉都是粉嫩的，所以这一路下来，你就可以知道，我们是为了散热才褪去的毛发。


    所以在此之前，我们是不会发明衣服的。


    但是现在我们从 DNA 分子钟里可以发现，调控人类肤色的 6 个基因里，SLC24A5 发生了变异，大约在距今100万年以前的时候，皮肤变成了黑色，那时候的人类祖先就是光溜溜的黑漆漆的，所以这个时间点，也就是人类最早有可能发明衣服的时间点。因为体毛没有了，天气如果大降温就有可能感觉冷，所以就有可能性上衣服。


    ### 寻找最古老的衣服


    那我们再来分析衣服出现最晚的证据，那就是找到那件最古老的衣服。


    可是衣服大都是兽皮或者是织物做的，不可能保留太长的时间。现在我们发现的最早的缝纫工具是用象牙跟其他的兽骨做成的骨针，而且这骨针上还有针眼呢。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_93_0.png)


    就这种精致的程度，完全可以确认，它是专门用来做针线活的，这些骨针是在斯洛文尼亚的一个山洞里发现的，这个山洞原来住的是丹尼索瓦人，还不是我们人类的祖先，距今有4.7万年。


    所以通过实物证据把衣服出现最晚的历史定在了4.7万年前。


    ### 虱子DNA与衣服历史


    那么到底是这个区间里哪个时刻出现了衣服呢？


    最早是100万年前，最晚是4.7万年前。


    这时候 DNA 就要登场了，这次立功的是虱子，它不是非洲草原上狮子王的那个狮子，而是藏在头发里吸血的那个虱子。


    德国马普人类研究所的科学家马克·斯克金在1999年的时候正在研究人类体毛的消失，有那么一天儿子学校通知家长，说近期年级里出现了虱子，请家长注意孩子的个人卫生。


    他虽然也像其他家长一样有点担心自己的儿子也会被传染上，但是作为一个人类学家，他也敏锐地想到，虱子一旦脱离了体毛，在野外是活不过24小时的，所以虱子的历史跟衣服的历史会不会是紧密绑定的呢？


    但跟人类一起生活的虱子可不一定非得要生活在衣服上哦，头发上也可以啊，阴部也可以呀，这两个地方的虱子是不会在意有没有衣服的，所以这两个地方的虱子是干扰因素。


    那么干扰因素能不能去除呢？


    阴部的虱子马上被排除了，因为它们长期在这个部位演化，长得圆圆的，有点像螃蟹，跟其他另外两个类型的虱子非常不一样。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_93_1.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_93_2.png)


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_93_3.png)


    把这三种虱子对比一看，也能发现它们也是一种很可怜的虫子，因为体毛褪去之后，竟然就足以让它们困在一个小小的区域里，不能爬过无毛的皮肤在其它地方生存了。


    那我们再来推想，既然虱子是一种这么容易困在一个体毛孤岛上的虫子，那么生活在头发上的虱子和生活在衣服上的虱子实际也隔着很远的距离呢，它们应该相当于在不同的大陆各自演化了很久，所以它们应该也有差异吧。可是把外形拿过来对比，发现差异并不大，但是没关系，我们还有
    DNA 分子钟这个工具呢。


    衣服上的虱子起名叫体虱，头发上的虱子起名叫头虱，于是就通过 DNA 的测序，研究它们是从什么时候分道扬镳的。


    2003年，马克·斯克金得到了结果，生活在衣服上的体虱是在10.7万年前从头虱群里分开的。但是这个研究离 DNA 测序的技术才刚刚诞生太近了，所以结果放在现在

