    # 139 | 旁证：最早的语言听上去什么样？


    # ——概念12: 旁证——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我介绍衣服、猫、狗、人起源，就是利用了旁证。


    # ——上节思考题解答——


    上节课最后留的问题是，就算我们以现在的技术保障也难说能让一批人从南到北活着穿越撒哈拉沙漠，那11万年前的祖先是怎么做到的呢？


    其实11万年前，撒哈拉沙漠如果真的是沙漠的话，他们一样也穿不过去。


    原因就是，当年还处于冰期，就是玉木冰期的初期，两极地区普遍冰冻了，赤道附近就会暖和，有水，所以撒哈拉沙漠不像现在这么大范围的干燥、炎热，沙漠面积最小的时候只有现在的1/3。


    # ——给“迁徙”下定义——


    另外一个要强调的是，在这一系列课中，凡是我们提到穿越、走到或者到达这些词语，都是属于在几千或者上万年的跨度上看到的一种全景的效果，而实际在那个时候，古人并不是那种拖家带口、逃荒类的日夜奔奔，往一个目的地去，不是这样的。


    # ——走出非洲——


    11万年前，第一次去欧洲的人类应该也没想到，他们竟然在那儿遇到了另外一种人，那儿的人皮肤颜色比他们浅，个子比他们矮，但是四肢粗壮得多，肌肉也发达得多，这些人说的话，他们基本听不懂。其实他们遇到的这些人，是在50多万年前趁着撒哈拉沙漠还不是沙漠的时候迁走过去的，后来几十万年时间就一直生活在那儿，他们就是大名鼎鼎的尼安德特人。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_135_0.png)


    # ——祖先的语言——


    那语言又是什么样的呢？我们虽然不能准确知道语言是什么样，但是大致听上去就是这样的：


    （请听音频）


