    # 088 | 起源：人类祖先曾经经历过极端气候？（上）


    # —— ◇ 概念10：起源 ◇ ——


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以体会物种的灭绝。


    人之所以明显地感觉自己与其他生物不那么一样，也和人作为一个物种来说，在分类上太孤单有关。按界、门、纲、目、科、属、种来分的话，人科没有亚科，而且下面就1个属，那就是人属，人属下面就1个种，人种。简单地对比一下，像猫科，活着的，下面有3个亚科，15个属，37个种。


    不过咱们人科不是自从一开始就是这么孤单的，因为至少在距离现在1.2万年前，人科里还有3个物种，他们都是什么呢？就是刚刚跨过了白令海峡到达美洲的克劳维斯人，还有生活在云南的马鹿洞人，以及生活在印尼的佛罗勒斯人。但是他们都在一次极端的气候中灭绝了。可能有人还听说过名气更大的丹尼索瓦人、尼安德特人，但是他们都没有赶上这次灾难，在这次极端天气出现之前的1、2万年前就都已经灭绝掉了。他们曾经也是人科下面的另外2个种。


    关于人科的其他物种，我放在其他的课里讲，这节课咱们重点说这次极端的气候。


    我在《地球曾经全部被冰雪覆盖》这节课里说到了最近一次小冰期，是属于第4纪冰期的第7个小冰期，它是从1.8万年前开始的，到达顶点的时候，北半球1/5的面积全部冻住了，这之后缓慢地过了大约3000年的时间，在距今1.5万年前逐渐又暖和起来了，南极、北极的冰盖现在又差不多了。


    可是好景不长，只暖和了2200年，在距今12800年的时候，突然又冷起来了，这次变冷的速度堪比我们上节课说的地中海恢复原貌的速度，只用了10年的时间，全球平均气温下降了8摄氏度，甚至比1.8万年前，就第7次小冰期最冷的时候还要冷，全球又冻住了。这次极端气候维持了1300年的时间。地质学家们管这段时期叫做“新仙女木事件”。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_0_0.png)


    在这次事件中身亡的，甚至都不能叫身亡了，可以叫做灭绝，主要是美洲绝大部分体型比较大的动物，比如像猛犸象、剑齿虎、大树懒、洞狮、巨型袋鼠、巨型河狸、短面熊、骆驼、马。


    所以公平地说，如果把美洲大型动物的灭绝都怪在人类身上还是有点冤枉的，因为事后证实绝大部分是天气造成的。在那次大灾难之后，美洲只有一种大型的哺乳类动物幸存了，就是美洲野牛。而这个美洲野牛后来濒临灭绝才可以把罪归到人类身上。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_0_1.png)


    上图就是新仙女木事件影响的范围，北美洲受到了最主要的影响。其实新仙女木事件是一场全球气温的降低，所以在这个主要影响区之外，继之前广泛分布在中国北方的大熊猫都给冻死了，像大熊猫的骨骼化石曾经在北京的房山区都发现过，但是之后大熊猫就只生活在中国四川那部分了。


    新仙女木事件是怎么发现的呢？


    那还是全球科学家在考古的时候，他们就高度一致地在温带，甚至在热带地区，在那些古老的沉积物里发现了仙女木的花粉。仙女木这种植物现在还有，但是它只出现在很冷的地方，比如到了南极、北极的夏天的时候，它们就会在刚刚融化的初雪的旁边开出小白花来，
    Constantly... 非常好看。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_0_2.png)


    它是不可能生长在湿热的地方的，所以现在全球的科学家在赤道附近，在温带比较热的地方都发现了它从前的花粉，而且还是在全球范围很广泛的地区都发现了，那就说明地球曾经有过很广的寒冷天气，都冻到了赤道附近了。


    地球曾经寒冷，这一点也不稀奇，因为地质学家们知道地球曾经一度被冻成一个雪球。可是这次不同，因为从花粉的放射性年代的测定发现，这次寒冷发生的年代非常近，只有1万年出头的样子，这就很值得深入研究了。


    研究的下一步推进大约是在1954年左右，那是另外一些关注气候变化的欧洲科学家，就认为冻得死死的冰层里应该保留了大量可靠的气候变化的证据，而这些证据远比树的年轮要可靠得多。因为年轮不能记录太久远的过去，而且在南方甚至都没有明显的年轮。而且从年轮再导到温度，这又是一个间接证据了。从前要想分析古代的气候，还可以从河里的淤泥里找些花粉的分层来推断那会儿气候的变化，其实也存在这两种不利因素。


    但冰层一旦形成，这个结构是非常稳定的，冻得死死的，冰层是随着时间顺序，最下面的就是最原始的冰，冰块里的小时泡就有了那个时代大气中的各种成分，如果再配合放射性同位素的测年法，就能把那个年代对应的温度数据重新挖掘出来。这个念头从产生到第一次动手用了12年，在上世纪70年代，分别在格陵兰和南极挖了几个冰芯，可是深度只有300多米，最深的也就400米。但仅仅就这么浅浅地一挖，一看这个冰芯每年变化的温度，发生了什么？就发现这个分辨率实在是太高了，都可以精确到季度。


    所以自从上世纪90年代之后，各国只要有钱都去南极，去格陵兰挖一挖。现在针对古代气候研究最好、最大的样本就是世界上最大的两个冰盖，南极和格陵兰。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_0_3.png)


    上图是一张目前已经挖了冰芯的地图分布，甚至在上世纪90年代初，中国南极科考队在南极站也挖了一下，只不过挖得挺浅的。


    分辨率高有什么好处呢？


    比如说同位素测年法，测出来的结果很可能是这样的，比如鉴定结果是2.3万年前，正负15年，这个误差就比较大了，这还比不上连季节都能看出来的冰芯。对这些数据用得比较得心应手的就是现在研究温室气体变化的。


    下面这张图就截取了最近1000年以来世界上5个分得 Wesen 地点的，从这5个地点采集到的空气中的二氧化碳含量的变化。那各位可以看看，也可以顺便反思一下人类对地球的影响。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_0_4.png)


    # —— ◇ 今日内容小结 ◇ ——


    这节课关于新仙女木事件，我们先说到这里。我们从中能得到什么科学思维呢？


    就是生命史是偶然铸就的。


    就是生命史是偶然铸就的。


    在距今1.8万年前，冰河时期来了，大部分生物都是要倒霉的。可是有毫不一部分人是受益的，就是那批先走到美洲的克劳维斯人。他们为什么能到达美洲呢？像哥伦布去美洲，那需要大航海，需要船。可是在当年克劳维斯人不用，因为现在的亚洲与美洲之间的分界叫白令海峡，但是在冰河时代，那里是没有水的，那会儿的海平面低，所以那里那会儿应该叫做大陆桥，直接走着就可以过去了。


    美洲是人类最后到达的大陆，克劳维斯人作为第一批抵达者，还有更偶然的事情发生，就是他们刚刚通过了白令海峡，刚走过去几百年，白令海峡就因为全球变暖，重新被海水淹没了，这中间就隔着几十公里的汪洋。所以亚洲再有人想过来都不容易了，就等于说占世界陆地一半面积的美洲就归克劳维斯人享用了。


    克劳维斯人咱们开头说过，他不是人科人种人属的，他跟我们的关系就好像猫科中的狮子和老虎一样，甚至有可能是狮子和豹子一样的关系，就没法产生后代。如果大陆就这样被白令海峡分开了，克劳维斯人在一个独立的，占有这个世界一半资源的地方发展下去，大概率地说，经过1万年，也会出现高智能的文明。


    因为从考古发掘中看到他们制作的工具已经很精良了，武器中的枪头都是双面打磨、双面加工的。美洲大陆这种人种和除美洲之外的这些人种各自发展几千年，那之后谁输谁赢真是说不准。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_1_0.png)


    但是一个偶然事件，就是新仙女木事件的出现，让之前积累的所有的运气都化为灰烬了，这个就是从千年为跨度的视角去看的，它从一个具体的物种，一次灾难，我们可以理解生命史是偶然造就的。


    那如果我们把时间拉得更久呢？比如地球的生命史接近40亿年的时间里，它也是偶然事件决定物种的存、留。


    生物在地球上的生存可以分成两个明显不同的时段，一个时段是平安无事的阶段，一个时段是大灭绝的阶段。平安无事的阶段占比时长90%以上，在这些时段里，只要那些生物存在，就会以一个非常稳定的趋势，就是新物种诞生的速度略微高于已有物种灭绝的速度，就这样维持下去，几乎不会产生什么变化，大概几百万年灭绝一种生物。


    可是历史上总共发生过5次大灭绝，每次都更新了80%以上的物种，甚至90%以上，可是这种灾祸又没法预测。


    我们明天会继续说新仙女木事件，再说说后续出现的偶然。


    # —— 今日思考题 ——


    科学家第一次从沉积物的花粉中发现了距今1万年的时候曾经出现过全球全面冻结的情况，那之后为什么这么重视这次变冷呢？而实际上地球大小冰期经历过太多太多次了，为什么却对这次产生这么浓厚的兴趣呢？


