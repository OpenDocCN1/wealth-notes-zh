    ## 概念11：发展


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。用发展的眼光纵观曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    115 | 发展：已经灭绝的天花，卷土重来


    - 1. 人类能消灭天花，还能对没开始流行的猴痘做好应对准备，正是因为遵循了科学的思考和行事方式，这远远比“我觉得”“我猜”“我估计”要更为靠谱与可信。

    - 2. 天花分布得比其他传染病更平均，是因为它是凭借空气传播的，所以流动性比通过接触、水源这些介质的传染病更加宽泛。


    116 | 发展：感染HIV却不发病的人


    - 1. 艾滋病之所以危险，是因为 HIV 病毒感染的是辅助 T 细胞，它是负责指挥其他免疫细胞的“将军”，一旦它出现问题，免疫系统就会失去了战斗力。

    - 2. 艾滋病难以治疗，是因为 HIV 病毒的外壳蛋白容易变异，免疫系统难以识别。

    - 3. 感染了 HIV 的全部患者中有 1/300 不进行任何治疗也不会发病，他们被称为“非凡控制者”，HIV 病毒会在他们的细胞膜上留下一滩标记物，免疫系统可以识别。


    117 | 发展：HIV和白血病都杀不死的人


    - 1. 研究艾滋病 10 几年后科学家们才发现“非凡控制者”，这提示我们，选取科研对象的时候，是存在选择偏差的，所得出的结论也是相对准确。因为，在科学研究中，水准最好的，也只是尚未被证明存在错误而已。

    - 2. 仅仅因为理论上的成功概率不为 0，科学家们就会做出努力和尝试，而这其实就是科研的常态。


    118 | 发展：可以和植物人交谈吗？


    - 1. 很多人常问科学有什么用？在植物人这个典型案例里，科学实际上安抚了被禁锢的灵魂、拓展了生命的范畴、缩小了死亡的边界。

    - 2. 中国的 40 万植物人中，预估有约 8 万人是有意识的，但他们的灵魂被身体锁住，无法与外界交流。科学技术的进步给他们带来了希望。


    ## 答疑时间


    119 | 问答：你为什么会晕车？


    - 1. 人会晕车，是因为人耳内部负责平衡的器官“前庭”采集的移动信号与眼睛采集到的视觉信号不匹配造成的。

    - 2. 植物性神经控制着人体不由意识控制的部分，比如闻到香味流口水、激动了流眼泪。一般来说，人体的不舒服很有可能是吃了有毒的食物，所以坐车觉得“晕”的时候，植物性神经会启动保护机制，赶紧把食物吐出去。


    120 | 问答：反季节蔬菜水果有害吗？


    - 1. 催熟水果用的是乙烯，它是植物在成熟过程中自身会分泌的一种激素，因此正季节的蔬果都有，现在人工地按照植物的生长规律喷洒定量的乙烯，相当于在冬季弥补了它的分泌不足。

    - 2. 人类与植物之间存在着巨大的物种隔离，植物激素很难对人体起到同样效果。

    - 3. 反季节蔬果在营养上比正季节蔬果低约 10%，原因是生长周期短，因此积累的养分少。真觉得营养不够，多吃一些就可以了。


