    是这样的，老年人髋骨骨折之后，一年生

    存率是50%。也就是说70岁的老人如果发

    生了髋骨骨折，有一半人会在一年之内去

    世了。这个情况甚至比大部分晚期的癌症

    还要可怖。


    很多中老年人也是听说过这样的说法才养

    成了持续补钙的习惯。但可惜的是，这么

    补，无论中间环节是怎样干扰的，最终是

    不能达到目的的。


    虽然到现在为止，主流的科学界仍然是推

    荐吃钙的补充剂，但是我刚才说的这个结

    论随着这个方向的研究越来越多，证据越

    来越确凿，关于怎么补钙的建议很可能

    会被这类研究在今后大幅更改的。


    但如果一定要问原因，为什么吃了钙片还

    是缺钙呢？


    我们可以这么理解：


    人体的骨密度它是处于动态中的，一边是

    通过成骨细胞生成骨头，这个时候就需要

    钙作为其中一种原料。


    那另一边还有 N 种机制，骨头会损失掉

    的，比如说破骨细胞就是一种分解骨头的

    细胞。女性的雌激素对破骨细胞是起到抑

    制作用的。在更年期之前，骨密度是可以

    维持正常的，但是更年期之后，雌激素大

    幅下降了，破骨细胞的抑制作用已经没有

    了，所以破骨细胞活跃起来了。


    所以，这边虽然补充着钙，那边流失更多

    的骨质，就会造成补钙仍然没有什么用。


    ## —— 正确补钙的方法 ——


    首先从吃来说，牛奶是补钙最好的方法，

    牛奶大约是每1毫升就有1毫克的钙，一袋

    鲜奶有200多克，一天早上 一袋奶就相当

    于补充了200多毫克的钙。人一天需要的

    量是1000到1300毫克，实际上补充了200

    已经不少了。如果觉得不够，下午或者晚

    上再来一袋。


    食物中的钙吸收率就比较高，比如最大众

    的那种钙片，都是碳酸钙的形式，这个吸

    收率只有30%左右，可是牛奶中的钙吸收

    率就有80%左右了。


    要在这一 步提升，就只有靠运动了。


    这其中过程很复杂，涉及到很多原理，简

    单说：运动带来的效果就是给骨骼高于常

    态的压力，这种压力就会刺激成骨细胞的

    工作，骨骼频繁受到这样的刺激，就倾向

    于积累骨的密度，这是身体的正常反馈。

    这样的话，身体才能适应更为负重的生活。


    ## 划重点


    + 1. 骨头中的钙极少能溶于水，通过喝骨头汤补钙从根本上就是没有希望的，而且99%以上的其他营养物质也都在肉里。

