    哺乳类动物的前肢演化出分叉式的、带指头的手大约是在4000万年前，那个时候灵长类最早一批动物出现了。而和现阶段人类很像的那种手，就是拇指跟另外四指可以垂直的手是在200万年前才出现的。而可以自由灵活转动，拇指跟小指、无名指对拇的手是在20万年前才出现的。


    除了手跟脚上的简单特征，还有很多部分也是因为人类祖先经历的环境跟黑猩猩原本的环境相差太远，也有了大幅的变化。而要让环境筛选出这些特征，只能靠时间，可时间只能朝一个方向流动，所以错过了这个村就没有这个店了。


    # —— 今日内容小结 ——


    那通过这节课的知识，我们能知道什么呢？


    就是这样错过这个村就没有这个店的现象还有很多：


    比如身体发育，如果超过了16岁，再怎么用生长激素挽救都来不及了，能长多高这件事在这个时间点之前努力才有效。


    还有控制近视眼也是这样的，假如夫妻双方都是近视眼的话，想让孩子的近视度数尽量小也只能在18岁之前努力。


    还有恒牙长全了之后尽早地矫正到位就可以得到一副能健康用到80岁的好牙。


    性格跟习惯的养成也是这样的，一个人到了30岁总是怯懦不自信，那就很难调整了。


    除了个体发育，社会文明程度的提升也是这样的，如果我们也把自由、公正、民主、法治看成是一种演化中的性状，那它们并不是凭空出现的，它们之所以能出现，也是从之前的一些性状演变而来的。


    那它们之前都是哪些性状呢？这些在得到的专栏《刘苏里·名家大课》里都有详细的讲解。


    # —— 今日思考题 ——


    你能不能也举出一些因为发展路径导致的不可能再退回去挽救的例子呢？


    不论是收获还是遗憾，都可以留在评论中，优质的评论也是好内容的一部分。


    # 划重点


