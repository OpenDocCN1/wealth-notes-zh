    # 134 | 旁证：狗是怎么出现的？


    # ——◈概念12：旁证◈——


    对历史事件的研究很难有直接证据，所以旁证和考据就是重要依据。基因技术的出现，让历史研究中的旁证更加坚实，很多从前打嘴仗的内容，现在变得无可争议。这一系列我们介绍衣服、猫、狗、人的起源，就是利用了旁证。


    # ——◈上节思考题解答◈——


    上节课留下的问题是，为什么同是驯化的动物，猫的差异基本只体现在毛色上，而狗的差异却有那么大呢？


    有像大丹犬那样站起来接近2米高的狗，也有比老鼠大不了多少的那种小狗。


    ![](img/8bedc5a33d556c033f724cd3fbb47d99_118_0.png)


    其实根源就是人委派给狗的任务多种多样，有些需要放牧，有些需要猎猎，有些需要拉雪橇，有些需要看家护院，有些需要做陪伴，有些只是为了欣赏。执行不同的任务，需要的特点不一样，在优选中筛出来的差异就会越来越大。


    # ——◈模拟狗的驯化过程◈——


    狗为什么会心系主人？


    这个问题上节课已经有答案了，那就是因为它们自古以来就是一种群居的、带有阶层的动物，中层跟下层都严格遵守纪律，听头领的指挥。人类驯化它们的过程，就是让人代替它们心中头领位置的过程。


    # ——◈幼态延续与共生进化◈——


    那用不了多久，到底用了多久呢？


    这个还真有前苏联的科学家做过一个长达40年的实验，他们想看野生狐狸还原灰狼被驯化成狗的过程。'
  - '[PAGE 119]


    人不再踩了，可是这个狗很想吃肉啊，但是它只是乖乖地坐着，用热切的眼神乞求人再给它踩一下。


    如果这个实验把狗换成成年的狼，它只要看过一次装置是怎么出肉的，之后就自己踩了起来，直到把肉吃光，根本不在乎人的看法。


    在幼年时期的狼跟狗，都会产生对人的亲近感，尤其是人离开几天之后再回来，小狗跟小狼都高兴得不得了。但是等它们成年之后，人如果再离开几天再回来的时候，狗还是跟小时候一样冲过去扑进人的怀里，但是狼对这个消失了几天的人已经不太在意了，它这时候甚至已经在自己的小群落选出一个新的头领了，而且这个头领还会对回来的主人怀有敌意，甚至试图攻击他。


    这个就是狗展现出幼态延续，而狼没有的最好的例子。


    人把灰狼驯化成狗，影响了狗的发育模式，产生出幼态延续的特征。


    而反过来，因为狗的出现，人的生存质量也大幅提升，在原始社会恶劣的条件下，又经历了像新仙女木事件，同是智人的其他物种都有冻死了了，但是人类这一支还幸存，这里多少有狗的贡献，它们能帮助人类提升狩猎的成功率，提高了休息时候的安全性，还能提高放牧的时候的生产率，像北极圈以内的环境，如果没有爱斯基摩狗存在的话，人类只有死路一条，但是有了狗，人们生活得还挺安逸。


    所以实际上，人跟狗在1.6万年的时间里，是共生进化的。有的时候我们甚至可以把带着一队狗的原始人，看作是一个由两个物种组成的新物种，他们在互惠互利的关系中一起进化，而不是像分离的物种那样，总是在你死我活的竞争关系中一起进化的。


    # —— 今日内容小结 ——


    那这节课我们得到的科学思维点就是共生进化。


    演化的过程中，个体间的关系不都是你死我活的挤压，还有大量手牵手共赴美好生活的方式。


    在自然界里，这样共生进化的物种有很多，比如像吃动物身上寄生虫的那种鸟，它们自己得到了食物，也给那些大型食草动物提供了危机预警，一有狮子接近，它们就叫唤。还有植物根系上的根瘤菌，它借根系延伸，在土壤中找到食物，同时也把自己的养分一部分匀给植物。更加基础的就像叶绿体、线粒体，它们曾经都是原核生物，就像一些单细胞生物那样。但是入侵到其他真核生物体内之后，竟然机缘巧合，没有被免疫系统干掉，也没有干掉宿主，反而成了宿主的一部分，给宿主提供能量，宿主也给它们提供庇护。


    # —— 今日思考题 ——


    如果我们把 AI 当作是一个物种的话，那参考曾经猫、狗和人类的互动，你觉得我们今后跟AI会是什么关系呢？


    如果你想到了，就留在评论中。


    # 划重点


    +   1. 人和狗是在互惠互利的关系中“共生进化”的，人为狗提供食物，而狗提高了人类的狩猎成功率、休息时的安全性、放牧的生产率等。 2. 人委派给狗的任务多种多样，为了执行不同的任务，在优选的过程中造成狗的差异越来越大。
    3. 在驯化狗的过程中，展现出幼态延续的个体被保留下来，它们对人类既忠诚又依赖。 4. 幼态延续，是指因为环境改变和基因突变，狗中的有些个体即便到了成年，幼年的特点不会消失，而且还非常明显。


    卓克


