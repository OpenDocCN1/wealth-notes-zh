    +   1. 悲剧本身并不一定会导致心理问题，它之所以令我们陷入困境，常常是因为我们想否认人生的悲剧性，最终在我们精神中竖了一堵墙，将我们的心与人生真相隔离起来，而且这堵墙会越来越厚，心理问题也由此而生。

    2. 哀伤过程是告别悲惨过去的必经之路。必须是那种真切而纯粹的悲伤，不是表演出来的悲伤，不是为了获得什么好处，比如别人的可怜与同情的悲伤，而仅仅是直面自己的不幸时带来的自然而然的难过。

    3. 当悲伤自然流动时，必然会泪如泉涌，而泪水就像是心灵的洪水，会冲垮我们在心中建立的各种各样的墙，随着心灵之墙的一一倒塌，你将能坦然接受悲惨的人生真相，不再去否认，也不再去和这注定不可能改变的事实较劲，心理能量就获得了解放，重新回到了自己身上。


