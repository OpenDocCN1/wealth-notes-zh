    书讲了一个关键点，自控力高的人，挫败发生后，归因但不归罪，并且会安抚自己，然后重新上路；自控力低的人，挫败发生后，容易自我攻击，却没意识到，这个时候，他最需要的是寻找安抚。


    # 今日得到


    +   1. 衡量挫折商的第一个因素是控制，也就是你在多大程度上觉得自己能控制局势。斯托茨认为，一个人的控制能力来自于他的控制感，控制感和挫折商呈正相关。


    +   2. 控制感高的人即便面临重大挫折，也总能看到积极、自己可以做主的地方，相信自己能控制局势；控制感低的人一旦遭遇挫折很容易觉得“大势已去”。


    +   3. 衡量挫折商的第二个因素是归因，也就是挫折发生了，我们要分析挫折发生的原因。低挫折商的人倾向于外部归因或消极自我归因，高挫折商的人容易内归因和积极归因。


    +   4. 高挫折商和低挫折商的人对归因和控制的关键区别是，高挫折商的人有抽象的内源性自我。结果高挫折商的人是在归因，也就是找出导致挫折的原因，改善它，且会很好地安抚自己；低挫折商的人是在归罪，要么严厉攻击别人，要么严厉攻击自己，却会忽略改进的努力。


