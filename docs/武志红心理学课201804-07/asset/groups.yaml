    # 问答：不做选择，就别追问意义


    > 问答：不做选择，就别追问意义


    武志红


    这节课是专栏的问答篇，我先谈一个节点，再回答一些用户的追问。


    ## 我想讲的这个观点是关于悲剧的


    在无常面前，我们容易感受到自我的虚弱，而且无力太找替，我们也容易觉得自己的人生因为无常而像是悲剧一样。


    可是，如果你没有做主动的选择，那你的人生悲剧就都没必要了。


    这是古希腊哲学中的一个表述，古希腊传说中有很多悲剧英雄，例如《俄狄浦斯王》就是古希腊三大悲剧之一，故事的主人公俄狄浦斯就是个主动做选择的人。


    他被视为英雄，因为虽然世事无常，但他一直在主动地尝试去做正确的选择。


    在这个故事中，当俄狄浦斯听说他的未来是弑父娶母时，他就逃离了柯林斯王宫，而想去躲避来自天神的预言。


    可是，造化弄人，他其实是普洛柯尔斯国王夫妇收养的，他亲生父亲是科林斯国王。


    俄狄浦斯无路可走的路，也是回家的路。受命途的驱赶，他流浪到科林斯，而在路上，他受到了一次仇人的欺辱。


    为了保护自己的尊严，他杀死了仇人，还死了四个手，却有了他的亲生父亲。


    弑了国王之后，打败国王后，娶了王后，而王后就是她真正的母亲。


    而这也没法阻止了灾难发生，他成了自己的敌人。


    俄狄浦斯不畏艰难地杀死了斯芬克斯，而且终于破译了她的谜语的方式，这意味着他也是最具有智慧的人。


    可是，他的智慧还达不到最终得救的地步。


    随后，他成为忒拜国王，兼备智慧、勇敢与力量的他，是一个很作为的好国王，将王国治理得很好。


    但接下来，他的王国遭受瘟疫，他也于是为了拯救他的王臣，因为发现了自己父母犯下的罪行，于是，他刺目双珠，再次主动选择流浪。


    虽然无命命途的驱使，而俄狄浦斯一直在主动做选择，他虽然有破碎自己的命运，他却也是悲剧英雄。


    所以，这个虚构故事让我感受到，如果一个人从未做过选择，那只是觉得自我的人生悲剧，因为那其实不过是虚无主义的笑话而已。


    ## 单元问答


    **问：** 请问武老师，我们平时理解的无常不就是不确定吗？


    **武志红：**

    是的，我觉得无常的确是不确定性，而人性为恐惧、抵御不确定性，是因为惧在不确定性中藏着死亡，就藏着能量，就威胁。


    所以，这个单元其实是说死亡，上一节我们主要讲的是头脑里的“死亡”，这一单元讲的是肉身里的“死亡”。


    全面咨询。


    **问：** 吃东西很快，总是吃很多东西，会不会是因为孩童时期太过于压抑自己的攻击哭哭？


    **武志红：**

    有可能，但也只是可能。我们不能轻易用理论去推导出底是怎么回事，但理论可以用来指路。如果你是这养的，那有一条比较简单明确的路，你可以试着去觉知吃东西的时候的各种情绪情感和身体感受，例如吃的速度很快的时候是什么感受，慢的时候是什么感受？吃太多的时候是怎样的，吃少了又会怎样？


    **问：** 近来越来越对“吃”有一种那恶恐怖的感觉。现在我自已住，常常也感觉不到饿。但是一旦感觉到饿之后，就会吃很多零食，或者吃觉得也继续啃零食。想要把东西吃干净。然后又觉得自己这个行为很坏。也有不吃零食的时候，但是多是克制，稍后吃起来一收不可收拾。这种感觉挺糟糕的，想求助老师怎么正常地面对吃呢？


    **武志红：**

    一是带着觉知去吃，二是可以看到，你讲到“我自己住”，那么你会不会很孤独，不会不会在其他一些高级需要，例如性关系的需要上处于匮乏状态，如果是，那么这时就容易上逆行，退行到吃的口欲里去寻求满足。我们还可以说，当一个人这样不加节制地吞吃时，就好像是一个小婴儿在找妈妈。


    但更为具体地情况到是如何，如果你觉得有必要，还是要寻求专业的心理咨询师助。


    **问：** 有些女孩子一生气就大块脆，是不是可以解释为愤怒激起了她的破灭欲呢？


    **武志红：**

    我个人认为这应该有着双重含义：一是寻满足，因为愤怒也意味着，她很可能是被拒绝了，而吃是在寻求口欲的满足；二是通过吃表达破灭，不过这种吞吃，容带来消化系统的问题，因为有愤怒，是“消化不了”的。


    **问：** 说到吃这个事情我就想起了自己：无论怎么吃，体重都基本不会增加。这有什么心理原因吗？


    **武志红：**

    有一个理论是这样说的，每个人都有一个“体重的心理平衡点”，如果没有重大事情发生，这个平衡点是不容易被打破的，但一个人的生存状态一旦有重大变化，体重也容易变化。例如结婚后，男人容易长胖，可能就是所谓的“心宽体胖”。不过，关于体重的问题，我觉得当然也不能忽略在生理上科学解读。


