    这门课程的主要内容已经完全更新完毕，这是一份学习攻略，能够帮你更好地理清课程的内容逻辑，不管你最初为什么来到《武志红的心理学课》，这份攻略都可以对你有所帮助。


    这份攻略也可以说是一份地图，带你看看课程的整理面貌，然后你就可以开始一节一节认真学习。


    攻略主要分两个部分，第一部分学习方法，基于课程的内容，给你完整的图，让你心中有数；第二部分学习工具，是将得到APP的一些功能介绍给你，将这些功能和课程内容结合起来，成为一些高效的学习方法。


