    \n## 武志红\n\n我觉得你可以试试，看看让孩子在某些时刻彻底自由时，会是什么样子。实际上，我们每个人自己也可以试试，如果你彻底自由，会如何。\n\n\
    首先，我相信每个人都会看到自己的理性存在。\n\n其次，我们会感觉到任何一个动力，真正寻求的是被看见，而不是彻底的为所欲为。\n\n再者，我个人认为，也许《天才向左疯子向右》这本书中所讲的那种故事是可能的：一个人隔一段时间就会把自己关家中几天，这几天，完全信任自己的自发性，任何念头出现就去追随，结果到了最后，他的感官敏感度可能会拨到不可思议的高度。\n\
