    # 问答：流动是一种什么样的体验


    这是课里我们心理课程的问答时间，我先给举例来说一谈流动是一种什么样的体验，然后再来回答一些用户的问题。


    我先举一个例子，这是一个一直可能是大家分享9个月的例子，但一直没有上，但是能这个故事会被理解为急袭暴力，但我觉得它的确并没能说明白，所以要先给做个打预防针，讲这个故事只是为了让你理解故事背后的心理逻辑。


    我有一位朋友，他是典型的高富帅，只是有一个小缺钱，长得太富了。他身高一米78，体重能到二一百斤，但是他是一个爱打架的人，而且是高手，好几次打架都是以一对多，而且几乎每次都占了上风。


    他打架的原因不是有针对性的，每次都是一眼被别人惹起的圈地，这个时候他都会一股怒气升起，然后就想打架。关于他的"别人看不起我"这件事，我一次听他说时，就看不对不对，我对你说"你从小家里有钱，你爷也是天生的，你穿衣名牌衣服、开昂贵的车，到哪里都很有型，谁会看不起你？"


    我这个问题有点反问他，他想想说：“是啊，好像这个想法是 不对，可是就是 有这种感觉。”


    过了两年后，我想起他的事，才突然明白，这是一个话全能能自恋的的家伙，他所说的"别人看不起他"的意思是：他觉得自己是神，别人必须得像他当神那样一样尊敬，这才叫看得起他，否则就是看不起。


    所以 他真 的是在 看 某方面 有点问题，但 这个问题 年 轻，在 打架 的 时候 会 进入 一 种 境界，他的 全身 都 是 成为 一 个 整体， 有一种
    六 识 在 自然 流动 的 状态， 这个 时候 他 简直 是 眼 光 八方，世界 好像 变得 非 常 安静， 时间 变 慢， 空间 感 也 变 了， 而 在
    他 打 架 过程 中 完全 透 过 他 的 本 能。 所 以， 这个 案例 不 是 告诉 你 打 架 是 对 的， 而 是 想 让 你 理解， 看 上 去
    这 个 人 是 最 打 架， 其 实 是 他 爱 上 了 这种 流动 的 感觉。


    我 再 讲 一 个 普 通 的 例 子。 我 的 一 位 女 性 来访 者， 她 是 个 好 人”， 和 丈 夫 吵 架 时， 一 直 都 是 在 忍， 为
    她 总是 忍 让。 但 经 过 咨询， 她 的 勇气 越 来 越 大， 终 于 有 一 次， 在 吵 架 中 她 发 火 了， 对 着 老 公 说了 两 个
    小时， 整 个 过程 中 她 的 头 越 来 越 清 醒， 她 老公 说 出 一 句 反 驳 的 话， 她 都 能 立 即 回 去， 而且 不 是 无 理
    取 闹， 有 理 有 据 地 反 驳， 她 的 老 公 被 她 反 驳 得 哑 口 无 言。 架 吵 过 去 以 后， 她 觉 得 非 常 舒 服， 仿 佛
    痛 快 万 分。


    她的 某种 感觉 在 自然 表达， 然 后 你 体验 到 了 它的 流动， 这 种 体验 叫 做 流动。 流动 的 体验， 意 味 着 看 着 攻 击 住
    你 的 生命力， 就 像 水 一 样 在 你 的 身上 自然 流 动， 这 时候 你会 有 各种 感觉 畅快 的 体验。


    # 单元咨询


    > 当 你 自 自然 然 流 动 时， 必 然 会 坦 如 如 泉 涌， 而 你 心 就 像 是 心 灵 的 洪 水。 这 样 你 们 在 心 中 建 造
    的 各 种 各 样 的 阻 力， 凭 借 这 自然 的 流动 只 要 一 种 就 完 了， 而 且 不 需 要 你 去 如 果 只 要 流 动？ 对 别 人
    毫 无 保留 的 坦 率 不 绝 的 倾 诉， 莫 不 语 盲 目的 流动， 不 会 达 到 这 样 的 效 果？


    我 觉得 一 次 情 感 的 流 动 是 远 远 不 够 的。 一 次 流动， 只 是 让 你 体 验 到 生 命力 流动 的 感觉， 仅 此 而 已。


    怎样 才 能 触发 流动？ 上 一 单元 我 们 讲 心 流 的 时候， 讲 了 普 通 意义 上 的 触发 条 件： 在 一个 稳定 的 容 器 里， 你
    发 出 了 你 的 动 力， 然后 不 断 到 正 反 馈， 最 终 你 的 生命 力 被 确 认 是 好 的， 于 是 就 可 以 流 动 了。


    滔滔 不 绝 的 倾诉， 如果 是 思 维 过 程、 情 绪过 程 和 身 体 过 程 同 时 发 生， 那 是 流 动 的 体验； 但 如果 是 停留 了
    情 绪 过 程 和 身 体过 程， 仅仅 停留 在 语言 层 面， 也 就是 思 维过 程 的 表达， 那 就 不 会 有 流动 的 体验。


    如果 是 有 意识 地 觉 知 愤 怒 的 情 绪， 让 其 流动 直至 消失， 是 否 可 理 解 为 表达 情绪， 还是 一 定 要 在 关系 中 去
    表达？


    你 可以 在 自己 体内， 去 体验 愤怒 的 情 绪 的流动， 当 然， 你 要 知道， 这 只 是 发 生 在 你 自己 内部的 一 次 体验。'
