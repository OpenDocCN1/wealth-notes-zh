    +   1.  人会面临着冲突的两条道路：到底是继续停留乃至滑入到和母亲的粘稠过渡世界，还是进入到现实世界。前一种道路会让你越活越简单，越活越封闭；后一种道路会让你越活越复杂，意味着开放和宽广。


