    武志红


    这是非常好的问题，这也显示，理论也是有边界的，并不是所有的共生关系都会损害挣钱或强大的动力。


    夫妻这种关系不太一样，一个健康幸福的家庭，彼此有很深的情感，在奋斗的时候，就显得是为全家人奋斗。不过这也建立在一个基础上，大家都有很深的情感，这时一个男人就会心甘情愿地去奋斗。如果没有情感基础，一个男人挣钱的动力就会急剧下降，除非他挣的钱主要是他自己支配的。


    武老师，我看到别人做了一个我不认可但是可能赚钱的事，我一方面很想跟他们一样去赚钱，一方面又觉得自己这样做跟自己的本心违背，不应该这么做。也就是说价值观不同，别人走的是短平快路线，而我不认可却又很羡慕嫉妒。我又做不到。实际上比我还不够级别的人利用一些技巧可以达到赚钱的能力，也就是说投机倒把可以赚钱。我很想去，又怕不能长久、会失去，反倒如不要开始。这么做是虚弱的表现么？我道德的纯净也是虚假的么？如果我的内驱性自我还不是“我是好的”的时候，是不是我就没有办法解决这个矛盾的情绪？


    武志红


    首先我看到了嫉妒的存在，他们挣到了钱，钱比你多，你可能有点儿嫉妒。接下来，我还想谈谈三种可能：


    第一种，别人的确干了违背良心的事，是恶的，是在通过掠夺别人的东西，而增强自己，这一点你不想认同。


    第二种，他们干的事并不违背良心，也没违背法律，只是方法出乎你预料，他们能想到这些，能做到，而你做不到，你一样嫉妒，而你了安抚自己，于是说他们是在投机倒把、为非作歹。


    第三种，你怕只是一时拥有，而不能长久拥有。所以这是嫉羡的表现，你觉得这个好东西你拥有不了。其实钱这个东西，你挣到了，不就是拿到了吗？


    综合来讲，我个人认为这很可能是明显的嫉羡心理。


