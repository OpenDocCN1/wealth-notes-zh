    # 将创作过程切割


    迪尔茨分析了很多天才，认为他们的创造力是有关系的，那就是他们的工作模式。迪尔茨认为迪士尼的创始人华特·迪士尼，他的策略是“将创作过程切割”，给每个关键部分一个单独的空间。


    后来，在创作演讲中，迪士尼把迪士尼团队的工作流程分成了三个阶段：梦想家、现实主义者和批评家。在想象家阶段，大家可以无拘地启动想象力，并且不必考虑是否实际，也不允许有批评；到了现实主义者阶段，才开始考虑如何实施的问题，同样也不允许批评；直到批评家阶段，才开批有批评。


    实际上，我们每个人得思维过程都包含着这三个部分，只是普通人的这三个部分经常是混在一起的。导致我们每一个部分都没有充分发展的空间，例如你设置一个梦想，可现实主义者的小偷同时担心，这能实现吗？甚至不能被批评者的那部分，你根本没实现了你的梦想。


    同样的，你也很想做一个尽兴的批评家，你这时的梦想家角色可能会跳出来发，你可以这样想象，你可以没有想象力的家伙，你可以知道你在我冷漠没劲，而现实主义者就会说，你如不知道我有多辛苦等等。


    这三个角色混在一起，一个人的思考就会变得混乱，一个人团内的焦虑与思考是混乱，而将这三个部分切开，使每个角色有独立的空间，这种混乱就会大为改观，并且在每个独立的范围内，这个空间负责的那一部分就会充分发挥。


    现实中，迪士尼公司也是这样工作的，专门设置有一个“梦想家”，在这个房间工作人可以尽情想象，而不允许有任何批评。


    # “迪士尼的策略”练习


