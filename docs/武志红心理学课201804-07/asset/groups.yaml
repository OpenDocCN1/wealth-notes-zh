    - 加餐：听话、叛逆、感恩与背叛\n- 问答：成年人可以健康共生吗？\n\n![](img/1c8805f81e6502071128412767cb1966_2_0.png)\n\
    \n# 预告：创造，来自臣服\n\n武志红\n\n这是我们专栏的第四十周，这周我们进入新的大主题模块“创造”。第一周主题是“创造，来自臣服”。\n\n在之前一起的预告中我讲过，我研究生时编过7本书。其中一本是讲创新思维的。依照这本书的基本逻辑，创新可以有一个固定的思维模型，按照这个模型去思考，就可以产生创新。\n\
    \n据说这本书当时卖了50万册，但我作为编者实在不服。不服，首先是一种感觉，我很抵触这种说法。其次，我有个人的例子为证。心理学中有一些关于创造力的测验，不管哪个测验，我做测试的时候，我的创造力都是满分或接近满分，然而我实在不觉得我是按照一个思维模型去思考的。\n\
    \n我上学时，有一位老师曾说，她认为任何一种心理疾病的治疗，都可以找到一套行之有效的模式，她的愿望就是找到这些模式。当时听她这么说，我就想如果有一天，我的思想和生活都模式化了，那还不如死去。\n\
    \n虽然对些说法很抵触，但我并不清楚创造力到底从何而来。直到在广州日报开始写心理专栏后，我逐渐认识到创造力是因为臣服。\n\n我个人觉得，创造力并不是你的大脑强大思维的结果。实际上，思维能力再厉害，也没有创新能力。人一旦爱上自己的思维，以及一些固有想法，这就是“向思维认同”，很可能就失去了创造力。\n\
    \n那么臣服是向什么臣服呢？我认为是向超越头脑自我的伟大存在臣服。我觉得在任何一个领域有创造力的人，都是因为他们臣服了这个领域，因此捕捉到了这个领域内的存在本身。\n\
    \n我们一再谈到自恋，但创造力其实常常发生在自恋破损的时候，因为那时候你的心灵有了裂痕，而光，就可以照进来了。\n\n我们来分享一首鲁米的诗：\n\n> 鸟儿的歌声纾解了\
    \  \n> 我的思念。  \n> 我像它们一般狂喜，  \n> 却苦不懂得倾吐。  \n> 宇宙的灵魂，求求你，  \n> 让歌声或什么东西，  \n>\
    \ 自我体内流泻。\n\n本周的洞点是：你如何看待创造力？你最有创造力的时刻是怎么发生的？你会有意识地制造条件去展现自己的创造力吗？欢迎你将观点写在留言区。\n\
    \n- 推荐阅读：\n  - 思维12｜向思维认同\n  - 思维06｜重塑非理性信念\n  - 思维03｜你的想法真是你的？\n\n![](img/1c8805f81e6502071128412767cb1966_3_0.png)\n\
    \n# 创造01 | 如何有创造力地写作\n\n武志红\n\n我这周末的主题是\"创造，来自直觉\"，\"今天是第一讲\"\"如何有创造力地写作\"。\n\n\
    今天我就先分享一下我的写作技巧吧。首先真正要自诩一下，我不觉得我的写作技巧有多高，也不觉得那是种什么天才般的写手，我的写作之所以带来了一些影响，不是因为我写作技巧，而是因为我直接触碰了一些东西。\n\
    \n直觉，就是存在，而最深的存在，就像是潜意识深处的水流一样。你要深入其中，就像双手去触及那流水，这时，你的文字才有直击人心的力量。\n\n这是我一直以来的一个认识，现在这个认识又进了一步：当能用双手触摸深层存在的\"\
    水流\"时，你能写、做，散，或其他的直觉的形态；但当你只是期待这股水流，甚至成为它时，你才能写透，得真痛一下，我甚至是很真切的，像荷马的那种诗歌，像孟子、李白、苏轼的诗，但丁诗篇，但都不算，太用逻辑的那种诗也不算。\n\
    \n我是虽常在心理咨界面，但实际上心理咨咨者们的身份我人让我很佩服，例如沙弗因泰老师也许不那么让我服气，不是因为他不厉害，他真是太厉害了，而是因为他还不能够真，还没有做到像鲁米那样直接触碰存在本质。\n\
    \n不说鲁米，那境界太高，实际上我很容易佩服艺术的、画家、舞蹈家、音乐家和诗人，他们一旦会酣畅淋漓表达而被我感动时，我会瞬间泪流而下。\n\n说这些，是在表达我对那些能直接触碰存在的人的敬佩，同时也可以说这是我的渴望，也是我写作的宗旨。说了这么多，那我到底是如何写作的？我先来讲个故事。\n\
    \n2013年，撒切尔夫人去世后，一家杂志找我，请我写一篇撒切尔尔夫人的心理画像，精确说出他们杂志社的最新标准。我后来写了一篇，他们非常喜欢，想一直约写对各种人物的心理画像，被我拒绝了。\n\
    \n为什么拒绝呢？因为我的写作方式吓到了我自己。在主持广州心理报社专栏前，我就当几年的国际新闻编辑，我对\"撒切尔夫人\"的\"铁娘子\"有所了解，但真要让我去写写一篇文章，我对自己的要求是这样的：我能触及到她内在的存在，并且这份感知要有一种完整感。\n\
    \n为了实现这种感知，我花了3时间，找各种关于撒切尔夫人的资料，最终直到形成了一种一种完整感知后，才动手写了这篇三千字的稿件。杂志社编辑，编辑咨询的收费不上讲，所以这种写作的成本太高。\n\
    \n同时，我也不是国际新闻编辑，我现在在平时的工作中可以掌握很多撒切尔夫人的各种信息，可以积累很多东西，而现态都需要花三天时间才形成她的一种完整感知。\n\n\
    写撒切尔夫人的这篇故事时，这种写作方式还不够经典，最经典的是我主持心理专栏时，写对红极一时的一位大红红的分析。\n\n当时，我花了两三时间搜集她的各种资料，每天工作10到11小时，搜集了几天资料。之所以形成这样，是因为我一直在感觉我还没有对她有足够完整的感知，我总觉得还缺少什么，而且还是缺关键的那种信息。\n\
    \n有一天深夜，还在投入地找资料时，突然一个声音在脑中响起：\"够了！\"这个声音表达的不是厌恶或不满，而是说足够了。并且这个在脑海中是这种碎片就像一团真水存在，它们本来是碎片，突然间很有秩序地形成一个整体，而且就好像是自动的。\n\
    \n同时，脑海中升起一个画面：一个小孩在爬一块墙，不过一米墙，但她撑了下来，说她非常难受；可爬下来的选择是\"继续爬什么了不起，我把下来爬去爬高是\"，\"\
    让你看我多下来\"可是，她墙爬的本没增强，却挑战了更高的事，我选择得那么厉害；可她选择下来的选择的是\"我爬不起来，爬不起来爬去爬爬，给你看看...\"\n\
    \n因此，我的文字中也像是有一股水流，它的影响力因此而来。\n\n希望我的这篇文章，能对你的写作或其他方面有所启发。没有也没关系，当做我在真诚地讲述就好。\n\
    \n# 今日得到\n\n- 1. 真相就是存在，最深的存在就像是潜意识深处 的水流。你要深入其中，双手碰触到这股水流，你的文字才有直击人心的力量。\n- 2.\
    \ 有效投入极为关键，当水流积攒得非常充沛时，写作真的可以一气呵成，而且写完后会觉得非常完美。\n- 3. 好的写作必须的品质是真实。真实的东西必然符合逻辑，我一直是真实的，我文字中也像是有一股水流，它的影响力也因此而来。\n\
    - 4. 顶尖高手之所以顶尖，主要不是因为高智商，而是因为他们直接碰触了自己所在领域内的存在，即碰触到了那股水流。\n\n# 划重点\n\n![](img/1c8805f81e6502071128412767cb1966_5_0.png)\n\
    \n推荐阅读：\n- 思维02｜为什么要讲感受\n- 思维03｜你的想法真是你的？\n- 思维12｜向思维认同\n\n![](img/1c8805f81e6502071128412767cb1966_5_1.png)\n\
    \n# 创造02 | 容忍模糊\n\n武志红\n\n我们这一周的主题是“创造，来自征服”，今天是第二讲“容忍模糊”。\n\n昨天我分享了自己的写作方式，这是一篇感性的文章，没有讲理论，今天我们讲一点理论知识。\n\
    \n各种关于创造力的理论，多会谈到创造力强的人有一个特点：容忍模糊的能力很强。我们再讲控制欲，并讲到宅人之所以宅，是为了追求控制感和确定感。控制感和确定感会带给人安全感，可是，当太追求控制感和确定感时，也意味着你容忍模糊的能力比较差，因此会失去创造力。\n\
    \n这一点逻辑上不难理解：创造，意味着创新，新的灵感自然要从“我不知道”的模糊中升起，而如果你太喜欢说“我知道”，太喜欢你已有的想法，那么就很难有强创造力了。\n\
    \n当然，很多宅人有创造力，那是因为他们在宅的方面没有创新，但他们的生活方式变得简单，提供了一种容器的功能。而相对稳定的容器中，另一方面的模糊感却被容忍了，然后这一方面就有了新事物从模糊中诞生。\n\
    \n我的写作方式就是不至于用头脑去找到答案，而是让这个答案从感觉中从心中自然升起，在答案没有形成之前，自然是处于一种“我不知道”的模糊状态里。\n\n众所周知，苏格拉底认为自己是一个有点智慧的人，因为别人太喜欢说“我知道”，而他则知道“我无知”。\n\
    \n我们还讲过催眠大师米尔顿·艾瑞克森的故事，他的弟子斯蒂芬·吉与根冈老师，你的催眠秘诀是什么？有画符吗？有乌龟吗？有一些神奇的东西吗？结果艾瑞克森回答说，他的秘诀是他确定地知道一点“我不知道”，既然我不知道个案的答案是什么，那我就可以邀请个案进入到潜意识状态，让答案从深渊一般模糊的潜意识世界中升起。\n\
    \n我们一再讲过提摩西·加尔韦的自我理论，自我有两个，头脑和意识层面的自我1，身体和潜意识层面的自我2，运动员要想达到身心合一的境界，就要离开自我1，进入自我2。进入自我2后，运动员不仅自己身心合一，也能非常好地感觉到整个场域，同时时间好像变慢了，而空间变大了。\n\
    \n这些概念可以糅合在一起，如果你想想创造力，就要承认你的头脑和意识层面的自我1不知道答案是什么，然后学习进入到身体和潜意识层面的自我2中，这时你会发现好像你的自我与外部世界的那种割裂感减弱甚至消失了，这时你就能触碰外部事物的本真，而所谓创造力就是你触碰到了这个本真。\n\
    \n我继续讲进昨天讲到的我写的那篇为一位大网红文的分析文章。实际上，我一开始就可以用专业知识给她下一个诊断，她很可能就是表演型人格障碍，或表现型人格障碍在临床上的表现有一些典型症状，她基本全中，我可以一一列举出来。\n\
    \n这样的文章，读者不爱看，而更重要的是我觉得这样的认识没有什么意义。是，准确的诊断是可以把一个人分门别类，但对于这个特殊的个案，我不觉得我这样做算是了解了她，相反我觉得这时我根本就没有触碰到对方。\n\
    \n所以，我的分析是抱着这样一个假设，“我不知道她是什么样的人，我愿意深入了解她。”这是我对一个人做心理分析时的一贯逻辑，一开始就抱定这个人我是 不了解的，然后我才能放下我的头脑，用我的感觉去感受他。\n\
    \n接下来的问题是你如何才能尊重你的感觉？答案是你必须忠于你自己。\n\n每一个在某一方面臻于一流的人，都是因为至少在这个方面，他是忠于自己的。所谓忠于自己，就是在这里要忠实其自我，追随着自己的心，而不是按照头脑而活，因为所谓“我的头脑”，实际上装着的是个人意识和各个层面的集体意识的内容。\n\
    \n例如迈克尔·杰克逊，他说最重要的是忠于自己：\n\n> *唱歌是我所热爱的，我选择它是因为我能从中得到乐趣，演唱对我来说就像呼吸一样自然。我歌唱是因为我必须唱，不是为了父母或家庭的缘故，而是由于我的全部内心生活都溶化在了音乐的世界中。*\n\
    \n然而，到底什么是“忠实于自己”呢？理论阐述可以满足我们头脑对知识的需求，但不如那些超一流才华的人给出的解释更直观地更有说服力。例如约翰·列农的一段话：\n\
    \n真正的音乐，是来自宇宙的音乐，是超越人们理解的音乐，当它走到我的心中的时候，它们与我本人无关，因为我仅仅是一...\n"
  mdcn: "\n# 预告：臣服的动力\n\n武志红\n\n这是我们专栏的第四十一周，“创造”主题第二周，本周的主题是“臣服的动力”。\n\n上周我们谈到创造力的奥秘，在于碰触你所从事领域的存在本身，而不是用你的头脑去套用认识。前者是臣服于存在，后者是陷入了头脑自恋。创造力和创造本身是很伟大的事，它们会让你意识到臣服是一种根本动力。\n\
    \n然而，为什么人容易陷入在头脑自恋中？\n\n因为头脑与意识层面的自我1，是一种自我保护。当我们觉得活在一个不够安全的世界时，就得构建一堵防护墙，将自己与外部世界切断，也因此切断了与其它存在乃至根本存在的连接。\n\
    \n相反，当外部世界让我们觉得安全、值得信任时，我们就会愿意把自我保护拿掉，那时，“我”愿意臣服于“你”，这就是依恋。\n\n自恋是依恋的对立面，人本能上追求一出生就有的全能自恋，但当自己真能控制一切时，其实会很累。所以，一旦遇到值得信任的“你”，我愿意把自己交付出去。这时，自我保护的这堵墙就没了，一个人就容易碰触到存在本身了。\n\
    \n创造力还有另一种常见的可能，你的自我1太破烂了，构建不了一套完整的自我保护系统，这个时候你很痛苦。但你的自我有裂缝的地方，能量可以喷溅而出，而光也可以照进来。\n\
    \n我们当然希望创造力是前一种可能，作为内部世界的“我”，能充分信任外部世界的“你”，这时我卸掉了自我保护，而创造力也由此而来。\n\n本周的内容中，我会重点介绍罗伯特·迪尔茨分析的迪士尼的策略。我们都知道，迪士尼公司的出品和游乐园项目都是极具创造力的，而这些创造力的产生，和创始人华特·迪士尼开创的工作方法有很大关系。在迪尔茨分析的迪士尼的天才策略中，我认为关键是迪士尼的工作方式，在很长的阶段里将批评的声音拿了出来。\n\
