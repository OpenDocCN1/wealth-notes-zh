    等她以后再表达愤怒时，孩子们会说，噢，是妈妈的小怪兽释放出来了。


    还要补充一下，在父母与孩子力量不对等的情况下，父母需要知道，应该去做孩子情绪的容器，而不是相反。


    武老师在课程中说“理解愤怒，问问它向你传达的是什么意思”，怎么理解这句话呢？我们感到愤怒，难道不是因为自己觉得受到了侵犯吗？难道愤怒还会有什么更加深层的意思吗？


    **武志红**


    不一定都是因为受到了侵犯，也可能是“恼羞成怒”，还可能是反向形成，就是自己体验到了虚弱感，为了防御这种虚弱感，而去愤怒，因为愤怒给了人一种强大的感觉。


    愤怒常常是伴随着期待和控制而产生，放下期待和控制，愤怒自然而然也就不再出现了。卸下防御的盔甲，成为真实地自己，会不会减少很多愤怒情绪的产生呢？


    **武志红**


    情绪都是因为有“我”而产生，让“我”感觉好的，就是正面情绪，伤害了“我”的，会导致负面情绪，如果放下了“我”的控制和期待，那自然就没有了愤怒。别说愤怒，可能各种情绪都没有了，那个时候只会体验到合一感，以及合一感带来的各种感觉。


    不过这个境界太高了，对于我们绝大多数人而言，还是需要去直面自己的各种感受，包括愤怒，然后试着让这些真实感受，在“我”自己内部，以及在“我和你”之间，去流动，并在流动中体验和修炼真实性。


