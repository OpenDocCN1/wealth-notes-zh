    **后续段落处理：**


    关于头脑和身体、意识和潜意识、思考和被思考之物，我想都得有一个基本逻辑，那就是身体、潜意识、被思考之物在先，而头脑、意识和思考在后，前面是存在之物，思考只是符号系统，我觉得这个不能颠倒，颠倒了，就没有创造力了。


    简单地说，你不能轻易拿你头脑已有的判断，去套用在一个事物上，你必须把头脑的判断和知识拿掉，先去深入这个事物，让判断和思考从你和这个事物的深度关系中自然升起。


    我再来举个例子。有一次，我和一家做心理测量的公司合作，负责做这个测量的一个研究生刚毕业的小伙子，但缺乏对心理学的理解，人生阅历也相当匮乏。


    然而，我看到这个测量是他用自己的头脑去设计的。他根据自己对主题的理解，认为这个主题有几大因素，每个因素下面又有几个小因素，然后根据这些因素，设计了一些测量题。


    我觉得这太糟糕了，因为他的头脑中，根本没有关于这个主题的真知识，那最终肯定会是个很牵强的测量。因此我给他提了新的建议：


    - 1、花至少一两个月的时间，好好去研究这个主题，并且首先要断定自己对这个主题实在不了解，得带着这份诚意去学习，特别是学习那些大牛们的理论和知识。

    - 2、先做一些访谈，就像我提到的这位精英企业家一样，深入了解所测量对象的真相，然后再根据这些了解，去设计测量题目。


    实际上，我对这个主题有非常真切的了解，因为我从事多年，并且在不断学习和这个主题建立起了超深度的关系，我甚至觉得我已经把握住了这个主题的完整逻辑框架。当我把我对于这个主题的完整逻辑框架讲出来之后，他有一种震撼感，因为我的逻辑非常完整，而且有一种美感，我提炼的因素也非常简练。


    但是，假设是我主导策划这个测量，我仍然会先假定我对这个主题是无知的，然后再去通过各个方面去了解。我认为这是一开始必须要做的事情，它不能省略。


    我们很容易对自己的头脑产生自恋，认为自己的头脑已经什么都知道了，当持有这种态度时，我们就容易陷入到孤独的自恋中，而不能看到真相了。


    这也是做心理咨询的一个基本假设。越是资深的咨询师，越有这种一种基本态度：我不知道来访者是怎样的，我只能根据我的理论、知识和经验，去做一些猜测，但关于来访者是怎样的，只有来访者才是权威。


    当抱着这种态度时，咨询师就会看到一个不可思议的世界，原来这个人是这样的，原来人性能是那的（能是那的 -> 可能是“能是那的”指“能是那样子”，或者OCR错误“能是那的”应为“能是那的”？原文应为“原来人性可以那样”或“原来人能是那的”。武志红常用“人性能是那的”表示“人的潜能/本性可以是那样子”？
    不，应该是“原来人能是那（个）的”。 修正为“原来人能是那的”或保留“那的”作为口语化表达。结合语境，“原来人能是那的”意思是“原来人可以成为那个样子”。），这该是一个惊喜的旅程。相反，如果咨询师对自己已有的东西太自恋，他的世界也会变得封闭和无聊起来，所谓的“一万小时定律”也会失去效果。


    我们业内都在说，心理咨询师是一个越老越值钱的行业，但它必须建立在刚才这个前提之上，如果一位咨询师越老越自恋，那对不起，他的职业可能不会随着年纪变大而更值钱，相反可能不值钱了。


    愿我们始终保有一份无知的好奇心，在模糊中，你会看到奇迹升起。


    ### 今日得到


    - 1. 不能轻易拿你头脑已有的判断，去套用在一个事物上，必须把头脑的判断和知识拿掉，先去深入这个事物，让判断和思考从你和事物的深度关系中自然升起。

    - 2. 头脑和身体、意识和潜意识，思考和被思考之物，都得有一个基本逻辑，那就是身体、潜意识、被思考之物在先，而头脑、意识和思考在后，如果颠倒了，就没有创造力了。

    - 3. 我们很容易对自己的头脑产生自恋，认为自己的头脑已经什么都知道了，当持有这种态度时，就容易陷入到孤独的自恋中，而不能看到真相。


    ### 划重点


    > 创造，来自于臣服于真实。把头脑的判断和知识拿掉，先去深入了解一个事物，让判断和思考从你和这个事物的深度关系中自然升起。我们很容易对自己的头脑产生自恋，认为自己的头脑已经什么都知道了，当持有这种态度时，就容易陷入到孤独的自恋中，而不能看到真相。


