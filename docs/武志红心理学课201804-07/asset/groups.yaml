    \n## 创造08 | 创造和扩容\n\n武芷红\n\n我们这一周的主题是“臣服的動力”，今天第四讲“创造和扩容”。\n\n今天我分享的基本观点是：我们的内在生命力，要跟随着我们所创造的一个外在之物去修炼。这个外在的被创造之物，它的生死存亡牵动着内在生命力的生死，它的品质昭示着我们的内在生命力的品质。\n\
    \n在不断创新的过程中，我们自己的容器，或者叫空间，也会不断地扩大，我把这一概念标为“扩容”。当生命横向成长时，你的一生必然是不断扩容的过程。\n\n被创造的外在之物，可以是一件很实际、很真实的事物，例如房子、公司，也可以是一件有点抽象的想象之物，例如一部作品，一个理论，或者一件美妙的艺术品。\n\
    \n要做到这并不容易，因为这个世界上有伟大创造功的人都是少数。更为重要是，人类的所有外在创造，最后都会毁灭，都会归于无常。并且你可能会亲眼看到，你所创造的事物将不属于你，甚至被毁灭。\n\
    \n这一切，都非常考验人的心灵。如果看充满着你的心血的外在创造物，在经历生老病死的轮回，而且这一切沧海桑田没有冲垮你的心灵，相反，你的内在心智在这个过程中变得愈坚固、更有力量更圆满，那就很好了。\n\
    \n在我所了解的事物中，最能浓缩地体现这个过程、是慈济佛陀的“坛城沙画”，是非常令人震撼的图景。\n\n我来给你简单介绍一下。坛城沙画是一种宗教艺术，具体来说就是喇嘛们会用彩色的沙粒“画”出异想天开的佛国，这个过程非常辛苦，制作出来的坛城沙画色彩绝伦，绝对可以做艺术品来收藏。\n\
    \n![](img/1c8805f81e6502071128412767cb1966_21_0.png)\n\n但是，这个艺术活动最后一步，是将这个嘛嘛们沥血沥心、极其辛苦才创作出的惊人作品，毫不留情地打掉，把沙子倒入流水中。这个活动的寓意，就是无常。\n\
    \n在我的理解中，已经知道自己的所创之物会毁灭，归于无常，但仍然能全情投入，去创造最高水平的作品来，并且这份毁灭是自己亲手去实施，这个过程实在太磨炼心性了。\n\
    \n由此我反思自己，我1974年出生，到现在已46岁，除了写了几十万字书，构建了一个自认为还算独特的思想体系，我在现实中什么都没创造。\n\n## 今日得到\n\
    \n- 1. 我们的内在生命力，需要借助我们所创造的外在之物去修炼。如果想有一个很大的心理空间，需要通过创造外在现实之物去拓宽，也就是“扩容”。当生命指向成长时，我们的一生必然是不断扩容的过程。\n\
    - 2. 只有真正达成的成就才能拓宽你的空间，想象中的世界大小不能起到这个作用。你的心理空间有多大，需要现实作为去检验，也需要现实就去扩容。\n- 3. 太多人不敢去做事不敢去爱人，不敢去创造不敢生出渴望，几乎都是因为担心自己会失败，为了避免受挫后的羞耻感。\n\
    - 4. 心理扩容的最佳时期是孩童时，因为年龄越小，达成夸张目标所需要的现实资源越少。成年人如果想扩容，最好的方式是去创造你真心想创造的事物。\n\n##\
