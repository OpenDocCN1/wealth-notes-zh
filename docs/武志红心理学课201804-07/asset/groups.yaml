    # # 分离与个性化


    玛格丽特·马赫


    儿童在三岁左右，这一时间被命名为“分离与个性化”阶段。分离就是身体上的再次明确分离，而出个体就是心理上的分离。'
  - '[PAGE 157]


    个性化就是心理上的分离。


    在儿童“分离个体化”时期，所经历的从“完全融化”到“全能感摧毁”的成长过程。


    > 参考课程：《空间11|心理混乱的预言》


    阿尔伯特·班杜拉 (Albert Bandura, 1925 -)，美国当代著名社会心理学家、新行为主义的主要代表人物之一，社会学习理论的创始人。班杜拉对心理学的最大贡献就是提出了社会学习理论与行为矫正技术。他认为源于直接经验的一切学习现象实际上都可以依据观察学习而发生，其中替代性强化是影响学习的一个重要因素。


    # # 自我效能感


    班杜拉


    所谓自我效能感，就是一个人知道自己，能，一个人会，能，一个人知道，我可以利用我的能力把事情做好。


    孩子越小，越是培养自我效能感的好时机。两个提高自我效能感的方法：


    +   1.  做好一些我能做的事，不断升级事情的难度，先在头脸上知道过往同情的直接体验，他的经验和能人都会增长，事情实现在的规模会持续扩大。

    2.  头脑上告诉自己有信心，只要不断坚持下去，胜利就可能到来，并且寻求大家的支持、鼓励和认可，将死本能转换成生命力。


    > 参考课程：《动力12|自我效能感》


    威尔弗雷德·比昂 (Wilfred Bion, 1897 - 1979)，英国著名精神分析学家，英国精神分析学会重要成员，后克莱因学派最重要的分析家，团体动力学的先驱，被誉为精神分析界最深邃的思想家。比翁颠覆了精神分析的理念和实践，是后现代精神分析的先驱和代表。其核心思想是“用自己的心灵思考并行动”。


    # # 爱恨的理论


    比昂


    人和人之间的连接有三种状态：我爱你，我恨你，我想了解你。用符号来表示：


    爱是 L，love；

    恨是 H，Hate；

    了解是 K，know。K既是动态的“了解”，也是静态的“心爱”和知识，Knowledge。


    L的对面是 H，即爱的对立面是“负爱”；恨的对立面是负恨，了解的对立面是负了解，即爱的对立面是“爱看着”，恨的对立面是“恨看着”。


    > 参考课程：《预言：依恋意愿与纠结》


    罗伯特·斯滕伯格 (Robert Sternberg, 1949 -)，20世纪美国心理学家和认知心理学家，智力三元理论的构建者，也是首倡人类智慧三元论的心理学家。


    # # 爱情三角理论


    斯滕伯格认为爱情由三个基本成分组成：激情 (passion)、亲密 (intimacy) 和承诺 (commitment)。


    完美爱情=亲密+激情+承诺，这是“爱情三元理论”。


    激情是欲望和需要的表达方式，多维性的感受和激情欲望、亲密是激情和亲近中那些感觉表达为亲近，志同道合又十分愉悦，承诺是短期内想要爱一个人，而长期承诺是维持这段关系，会为你彼此的负责态度。


    > 参考课程：《动力16|无处不在的性》


    埃克哈特·托利 (Eckhart Tolle)，生于德国，从伦敦大学毕业后，在剑桥大学担任研究员和导师。29岁那年，一次意外的经历彻底改变了他的生活。在接下来的几年里，他致力于理解、整合和消化这种变化。他的作品《当下的力量》和《新世界》均为《纽约时报》畅销书，中文版在国内畅销。


    # # 向思维认同


    埃克哈特·托利


    思维这个词是抽象、概括性的，人们很容易做一个个一个的活控制活。


    如果你认同了这个想法，就会把它们当成真正的，就会认这个“我”就是“我的”，这就是埃克哈特·托利所说的“向思维认同”。


    认同了就会形成执着，也不会思想放下它们，因为想法就像是“我”被消灭了一样。


    > 参考课程：《思想12|向思维认同》


    # # 自恋


    心理学重要名词


    自恋分为两层：


    第一层：我是对的，我说了事情是怎样的，就会把事情都朝向我的方向推动。我去证明，我就在。在关系中，这个自由叫做自我抬高。所以，我地位高，你地位低，格局才会让你自自在舒服。


    第二层：我自己。我在关系中，


    > 参考课程：《希望22|什么是我自实现的预言》


    # # 全能自恋


    心理学重要名词


    全能自恋，就是一个人觉得自己就是，可以支配，外界都会按照自己的意愿给予自己，如果外界不符合自己的意愿回应，“神”就会变成“魔”，恨不到得了外部世界，这就是全能自恋。全能自恋的表现有：


    +   1.  超级自恋：不优秀，不配合。

    2.  行动困难：想太多，行动慢。

    3.  执迷不悟。

    4.  在关系受伤后，会进行到自虐的全能自恋中。


    > 参考课程：《动力04|全能自恋与自恋性格》


    # # 反向形成


    心理学重要名词


    反向形成 (Reaction Formation) 是一种自我防御机制。


    将事物其实真而为之，相反的反向形成包含负负相乘后的假性转变，例如，由恨变爱。持续变成过度补偿或变成溺爱。


    常用于转化愤怒、嫉妒与攻击冲动。尤其当这些情绪被视为为失控而恐惧时。


    > 参考课程：《动力19|从遗憾到到希望》


    # # 回避型人格障碍


    心理学重要名词


    回避型人格障碍 (Avoidant Personality Disorder)，即胆道社会性精神障碍。临床表现有：


    +   1.  自感脆弱，情感退缩，自我评价低，有强烈的紧张、忧虑感、不安感和自卑感。

    2.  现实生活中存在危险意象。


    对回避型人格障碍而言，焦虑是核心因，回避他人和人从人际关系和暴露感中减少，这是要从很不舒服的激情中“躲避”起来。


    > 参考课程：《动力15|警惕心灵陷阱》


    # # 现实检验能力


    心理学重要名词


    当你的想象和现实发生矛盾时，你能考量现实，而不是执着于你的想象。'
