    \n武志红\n\n## 专业类\n\n### 《动机与人格》 马斯洛\n\n![](img/1c8805f81e6502071128412767cb1966_166_0.png)\n\
    \n马斯洛在书中提出了需要层次理论、自我实现理论、高峰体验理论等。本书是一部经典的、解读“人性”的著作。阅读本书，就如同在倾听自己内心的声音。它并不晦涩难懂，适合我们心理学课每一位想了解自己、了解人性的同学阅读。\n\
    \n### 《心灵的面具》 布莱克曼\n\n![](img/1c8805f81e6502071128412767cb1966_166_1.png)\n\n\
    布莱克曼结合自己30多年临床和教学工作经验，以及其自身曲折传奇的个人经历，理出了101种心理防御，完成这样一本既有教育性又富有阅读乐趣的书，讲解了人们发展某些防御的原因并提供了识别无意识防御的技巧，使无比复杂的概念和内容变得平易近人。\n\
    \n# 学习攻略 | 心理学课的学习方法与工具\n\n![](img/1c8805f81e6502071128412767cb1966_167_0.png)\n\
    \n武志红\n\n你好！欢迎来到《武志红的心理学课》。\n\n这门课程的主要内容已经完全更新完毕，这是一份学习攻略，能够帮你更好地理清课程的内容逻辑，不管你最初为什么来到《武志红的心理学课》，这份攻略都可以对你有所帮助。\n\
    \n这份攻略也可以说是一份地图，带你看看课程的整理面貌，然后你就可以开始一节一节认真学习。\n\n攻略主要分两个部分，第一部分学习方法，基于课程的内容，给你完整的图，让你心中有数；第二部分学习工具，是将得到APP的一些功能介绍给你，将这些功能和课程内容结合起来，成为一些高效的学习方法。\n\
    \n## 学习方法\n\n### 1. 从「发刊词」、「亲爱信」开始，找到坐标\n\n如果你是刚刚来到这门课程，我给您一个小建议，你可以点击下方链接，先来看一看「发刊词」，从中你会明白开设这门课程的发心和目的，以及学习课程后会为你带来怎样的收获，然后带着明确的目标开始学习。\n\
    \n一键查看：发刊词｜拥有一个你说了算的人生\n\n此外，建议你也看一看写给心理学课同学们的长信，里面系统地梳理了所有300多讲课程的结构和逻辑，你可以知道每一主题的特殊意义。\n\
    \n一键查看：亲爱信｜心理学课同学们的长信\n\n### 2. 拿好两张「地图」，理清脉络\n\n心理学课共13个主题，它们之间有着不同的承接和主题关系，所以，为你准备了一张结构图。\n\
    \n![](img/1c8805f81e6502071128412767cb1966_167_1.png)\n\n如果你是刚刚加入心理学课，可以带这张图，理解不同主题的关系，展开学习；如果你已经学完了主体课程，也可以根据这张图，去回顾复习不同主题下的具体内容。\n\
    \n此外，你还可以查看心理学课的图表（请在文末查看），主题、章节、每一讲都一览无余，有计划地开始学习或者复习。\n\n### 3. 以「复盘」为抓手，时常回顾复习\n\
    \n课程每一个主题结束后，都会进行复盘总结，可以通过复盘内容，去重温自己学到的一些知识，每一个主题都在“打包”，内化成自己的学问。\n\n如果你对某个知识点掌握不够透彻，复盘里面包含了主题中所有文章的链接，你可以去复习巩固。\n\
