    \ 加餐：升级你的生命尺度\n\n## 第四单元的主题：从分裂到整合\n\n弱小时，要切割并投射“坏”；强大后，就吸纳并整合“坏”。这是第四单元的核心观点。\n\
    \n在《偏执、分裂与整合》这一节课中，我介绍精神分析大师克莱因的位态说，这也是精神分析中最重要的理论之一，这个理论是讲婴儿三个月前处于偏执分裂位，三个月后会进入抑郁位。\n\
    \n在偏执分裂位上，人会觉得自己非好即坏，好坏、善恶、黑白、强弱等等维度，是截然对立的，只有两极存在，不存在中间地带，并且一个人不能同时又好又坏。到了抑郁位上，就有了整合能力，就会发现人是同时拥有两种矛盾的对立面的。所以有了接下来的两节课程《你可以好，也可以坏》和《你可以执着，也可以放弃》。\n\
