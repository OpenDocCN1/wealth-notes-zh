    \n> 金钱最重要的隐喻是力量，钱多的人可支配的资源更多，力量更强。力量的强弱可以延伸出谁高谁低这个维度，越是活在全能自恋中的人越容易在乎关系中谁高谁低。力量强弱这个维度关乎竞争，金钱恐惧症可能是惧怕自己特别有力量、特别有地位时，会被嫉妒、被惩罚。金钱恐惧症，其实是强大恐惧症。\n\
