  md: "\n可以说是一种地地道道的“输在起跑线上”。单纯的脸，常常就是一张顺从的脸。顺从的人，必须简单，因为一旦有了复杂的智慧和力量，就不可能再去顺从了。\n\
    \n## 划重点\n\n> 如果生命一开始，就被教导顺从，可以说是“输在起跑线上”。所谓叛逆，其实是孩子想做自己，想按照自己的意愿去行动，这个时候如果大人利用自己的力量去压制孩子，那就会破坏孩子的意志。如果在任何关系中，都无法做自己，都太考虑别人，那就会选择内向与封闭，任何关系都会成为巨大的挑战。\n\
    \n- 推荐阅读：\n  - 创造 07 | 内在的批评者\n  - 关系 08 | 世界的本质，是关系\n  - 复盘：关于“创造”主题的回顾\n\n![](img/1c8805f81e6502071128412767cb1966_54_0.png)\n\
    \n# 加餐：中国式关系中的“葵花宝典”\n\n**武志红**\n\n这是“现实”主题下的第一单元“单纯”，这一讲是加餐，题目是“中国式关系中的葵花宝典”。\n\
    \n这一讲我们也是从一个故事开始。\n\n有一位非常有力量、也很有魅力的女士，她有一个憨厚有魅力的丈夫，同时她也和一个她一样复杂有魅力的情人。在这个三角关系中，她一直很少照顾自己的丈夫，觉得自己很爱也很在乎情人。\n\
    \n在一次咨询中，我请她谈谈，她理想中的爱人是什么样的，可以用欣赏观也可以用管理道，我请她谈一下，这位女士本来是想谈一个超级完美的人，所以这份自画像很容易。几秒钟内，她就一一列举了以下几个条件：\n\
    \n1. 要帅，要有肌肉感；\n2. 要像白马王子一样，对我好，其实是黑又王子都接受；\n3. 要有社会地位，要有很多钱；\n4. ……\n\n她列了很多条件，最后列出的条件是“愿意做家务”。\n\
    \n这些条件中，“做家务”是最不起眼的条件了。但接下来，我请她一一删除这些条件，也就是当她不得不放弃某些一个条件时，哪些条件是最愿意放弃的。然后很有信息的矛盾发生了，她发现最愿意删除的条件，其实是“愿意做家务”。由此她明白，她老公的实际重要性远远超过她的想象，而表面上符合她条件的情人，其实只是一道配菜。\n\
    \n说到最后，我对她说：看来你想找一王子，而她愿意为你做家务。她若有所思地说，她丈夫其实也很对她，但在两人所说的关系中，逐渐变成了一个二十四孝老公，实际上，在谈恋爱时，他就是这样。\n\
    \n这样的故事可多了，我逐渐总结出这样一个说法：中国式恋爱的绝招是把对方当婴儿一样照顾，当神一样崇拜。\n\n然后我也发现，互联网上流传的各种迎合女人发疯梦的文案，其实都是在讲这个东西。现在中国，也的确承认认可进进的男人，他们极善于照顾女人，但同时他们也花心至极。\n\
    \n我下的观念不断延伸，后来我总结出，这个现象中国式恋爱中的绝招，也是中式关系，或中国式存之道的绝招，只是刚才这两点还不够，如果再加点一点就以达到葵花宝的级别了。这一点就是：有一张愚忠的脸。\n\
    \n这样一来，我认为中式关系的“葵花宝典”的完整神就是：把对方当婴儿一样照顾，当神一样崇拜，同时自己有一张愚忠的脸。\n\n单纯，是一个很好的词，简单，就是一个中性词，而一旦变成“愚忠”这个词，这个人很难接受了，可思虑太多了，这三个词在一定程度上是一脉相承的。\n\
    \n上一讲课程中我们谈到，我们在社会中，无论家长是如小儿童，都希望孩子能长大成人，因此婴孩期不余地希望孩子的。逼迫和顺从，也就是中式关系的一个基本特征，也知道，强迫的目的是希望他顺从于我。\n\
    \n那反过来，如果我们表面上去顺从大家的这份需求，然后我从中等挑人，也就会得到所谓顺从的中式关系中的人的绝招的信悟，并把这种使用得淋漓尽致，因此获得了成功。\n\
    \n为什么有一张愚忠的脸呢？因为逼迫和顺从中最有的一类，忠是一种顺起，就会不愿意顺从，顺就顺从，那是压抑和屈辱，所以你必须要有方面是愚蠢的，这样才可能顺从他人。这种算计，在中式关系中也太常见了。\n\
    \n例如明朝的大太监魏忠贤，我们的影视作品中描绘他，你看他极易会刻画出他极聪明狡黠又智极高的人，但很可能最重要的特征不是智智，而是完美地实现了这三点：他不敢当人一样暴躁，当神一样崇拜，同时又有一张愚蠢的脸。\n\
    \n我们容易攻击吕布顺忠的人，但这的人如果更多一些可能更好，因为这样一个社会就可以明白这种式的人到底是怎么回事了，然后去寻求追求“你要心甘情愿地顺从于我”这种东西。\n\
    \n同样的，我们还可以做一个推理：一个人既顺从，又愚忠像心甘情愿一样，那很有可能又因的是他自己的智商。\n\n用稍神分析的模式来说，就是他启动了“自我功能的中断”这种自我防御机制，而即抑制的，就是自己的智商。\n\
    \n> ※《加微8》: 一些常见的防御机制\n\n我再来讲一个经典的故事，这也是曾经轰动一时的新闻，也许你听说过，有一夏天，汛期将至，有一个村庄有很大可能发大水。一个年轻的村民，他本是在市里打工，却因为担心家里老父母家，于是特意开车赶回了老家。他的父母可能是有一些矛盾，所以爸爸妈妈住在村子西边，而爸爸、妻子和两个幼小的孩子住在村子里东边。爸爸是腿脚不便，两个孩子一个两岁，一个四岁。\n\
    \n他本来的计划是接先去妈妈，再接上一家三口，这样都可以顺顺当的。但是他到了妈妈家门口，不想顺顺当当。然后坐在家门口，在门口等了一到两个多小时，发现大水和妻子来了，救自己的担心。回到家后，他妻子孩子了了自己的担心，然后因为太累就睡着了，可妻子一直喊，就没醒着。后来，洪水真的来了，都水进到他们家院子，妻子及时唤醒他。\n\
    \n接下来这位小伙子的选择非常耐人寻味，他立即跑去救门，去救他妈去了，等他妈叫醒并带上到房顶上后，他大，没法回去，和妻子和两个孩子在村子里东边，也都没有安全地放在了房顶上了，都没事。\n\
    \n可妻子从此后不再和他说话，来向他提出离婚。\n\n这件事被报道后，轰动一时，这位年轻人，绝对是孝顺的化身了，如果放到十多年，那肯定是一奖，可公子的认识发生了转变，他是懂的善良少了很多，很多人觉得他很愚蠢，这时对的选择简直是不可能。\n\
    \n在那样的急时，人很难有两个选择，这种忠心的做法让人很难得，都可以理解，我认为真正的问题就既然已经预判到了洪水要来，他为什么不亲妈妈门口等个几多小事，这些要求在婆婆家里，如果他能叫醒妈妈，让妈妈先准备，然后提早联系父亲和妻子做好准备，安全效能会提高很多，同时财物的损失也可以降低很多。\n\
    \n我觉觉得那个时刻，他的智商是关闭了一样，在妈妈门口等个三小个时的愚蠢行为，也许本质就是一种顺从。太听见的，很容易出现一种思维，在根大上都想你什么，而所想的也不得不根据这上放弃这根本动力，那如果把自已再慢一下，是没办法这样做的。\n\
    \n如果你在养育一个根为，你一开始就让他顺从，还是希望给他这种感觉：世界有足够好的他的本能嗨响而做，这句话也是心理学派尼斯特说的，我在中国的课中中提过它，我现也在逐渐形成了自己的表达，在这里分享给你：\n\
    \n当一个人感觉到，他的生命能够按照他的自自由意志来展开，他将会被关爱、困难、拒绝、封闭和消解将他折磨他，每一时刻的孩子都想被爱，一个被爱和自由意志的孩子，常常会像一个文心机一样，同时又能专注地投入在他们正在做的事情中。\n\
    \n如果你正在养育一个孩子，你可以给他需要这种感觉。同时你也别忘了，你也可一样需要这种感觉。\n\n1. 如果一个人顺从了，又愚的像心甘情愿一样，那很有可能启动了他的智商，抑制的就是自己的智商。\n\
    2. 太听话的人，容易出一顺，因为人根本上想都做放弃，而听话的人不得不放弃这些。\n3. 在相当程度上放弃这一个根本动力。心理学家温尼科特说“世界准备好接纳你的本能喷涌而出”，在养育孩子时，我们希望给孩子这样的感觉，而不是顺从。同时，还要谨记，作为成年人的自己一样需要这种感觉。\n\
    \n## 划重点\n\n> 如果一个人既顺从，又真的像是心甘情愿一样，那很有可能是启动了“自我功能的抑制”这种自我防御机制，抑制的是自己的智商。心理学家温尼科特说“世界准备好接纳你的本能喷涌而出”，在养育孩子时，我们希望给孩子这样的感觉，而不是顺从。同时，还要谨记，作为成年人的自己一样需要这种感觉。\n\
    \n推荐阅读：\n\n- 自我06 | 让你的本能喷涌而出\n- 自我14 | 真自我和假自我\n- 复盘：关于“创造”主题的回顾\n\n![](img/1c8805f81e6502071128412767cb1966_56_0.png)\n\
    \n# 问答：幼稚、单纯、世故和成熟\n\n**武志红**\n\n这一讲是我们专栏的问答时间，我先分享一下我的感悟，再回答一些用户的问题。\n\n我的这个感悟来源于我仅有的一次相亲经历。说实话，我有点点头约，我感觉自己条件说得还过去，但是不知道为啥，没有人给我介绍相亲，这是我仅有的一次。\n\
    \n在这次相亲中，我讲了一句很有感受的话：成熟有两种，一种是掌握了现实规则的成熟，一种是人生性的成熟。\n\n我就不给大家讲有秘密的相亲故事了，我要说明，毕竟没有秘密的人是长不大的孩子。\n\
    \n我想继续给你谈简单和复杂。很多用户在留言中提到，如何定义单纯、简单、幼稚和复杂这些词。\n\n这是一个好问题，就用我刚才这句话感悟，和管理学院中向向东老师不断使用的‘四象限坐标图’来区分下简单与复杂。\n\
    \n点击试听：宁波大学·海洋学院管理理学·《学术领导的极简指南》\n\n制作一个四象限坐标图，需要有两个维度，结合本单元的‘复杂与单纯’这个主题，以及我刚才说到的感悟，我认为可以有两个维度：一个是内在人性的幼稚与成熟，另一个是外在规则的无知与掌握。\n\
    \n这样一来，就可以区分出四种模式和我的定义：\n\n1. 内在人性幼稚，同时对外在规则无知，这是幼稚；\n2. 内在人性成熟，同时对外在规则无知，这是单纯；\n\
    3. 内在人性幼稚，同时掌握了外在规则，这是世故；\n4. 内在人性成熟，同时掌握了外在规则，这是成熟。\n\n![](img/1c8805f81e6502071128412767cb1966_57_0.png)\n\
    \n世故和成熟的人，都是复杂的，而幼稚和单纯的人，都是简单的。\n\n四象限坐标图是很有用的工具，我觉得可以在这个坐标图上继续发挥一点创造性，我们可以在坐标图上坐标的原点，也就是在内在人性和外在规则都为零的这个位置上，这是一种原始的合一，而在内在人性和外在规则得分都很高的位置上，也会存在合一的可能。\n\
    \n这样的人，就可以达到王阳明的境界，不仅证悟到天道即理心“致心”之外，则无它了。而且悟得‘此心无’，随缘而应。到了这种境界，就是最简单，也是最复杂，简单和复杂由此统一了起来。\n\
    \n## — 单元问答 —\n\n**复杂的人会被简单的人吸引吗？如果每个人都是复杂的，就像世界里面只有男人，也是不符合 A 与 A 吗？**\n\n**武志红**\n\
    \n复杂的人，当然会被简单的人吸引。特别是有些地方，会被幼稚的人吸引。我认为在这有两个原因，一是幼稚的人容易被掌控；二是幼稚的人有一种简单的美好，这给了世故的人一种对美好的想象。\n\
    \n**电影《阿甘正传》里的阿甘，就是一个智商不高极其简单的人，阿甘的简单和单纯却带给了他巨大的幸运。无论独舞，电影多数场景或艺术作品中，都会有类似的形象，甚至是中国古语里都有‘傻人有傻福’。这样的作品常让人觉得单纯是人生至高的精神财富，武老师是怎么看待这种简单的呢？**\n\
    \n**武志红**\n\n我也非常喜欢《阿甘正传》这部电影，我觉得在一个规则基本公平合理的社会，这是一种真实的可能性。\n\n然而我很好奇的是，如果我们观察自己的周围，会有这样一个阿甘吗？阿甘实际上没有世俗的成功，而郭靖不同，他最后成了武林至尊。\n\
    \n如果用这节课所讲提到的四象限图，可以那种‘生辰成而对外规则无知’的人，他们的单纯性是容易被赞许的，同时也可能会获得成功，如幼稚的人难以做到。\n\n此外，当所有人都是世故时，看似单纯的人也容易出，因为他们代表了大家都不敢做的事。例如埃及前总统穆萨德，他是埃及传奇总统赛菲的副手，在纳赛尔去世后，各方派系斗非常厉害，可他一直很老实，被称为‘土推上校’，大家觉得他好控制，于是为一致推他继任总统。谁想到，他的老实装傻为厉害，一上台总选党之后，他立即变成了杀死法哈斯非常厉害的角色，而且表现得非常正确。\n\
    \n简单的人会因为对简单的人提防他，而获得生存空间，但也只是仅此而已。\n\n**武老师，你之前专栏中说的孙博不就是一个纯粹又活得简单的人吗？那样的人不是那么人好向往的生活状态吗，他命运又怎么就那么凶？他不就是那种一直活非常的高尚且从来不去复杂，却一直走来都很幸福的人吗？**\n\
    \n**武志红**\n\n我认为只有一种简单是可以的，就是你一直在做自己，这个点你本来通过，这时你有一个强大的内在，同时也可以适应外在。也就是说外在不是偶合适，而是你常常会让外在为你改变。\n\
    \n孙博是一个真正纯粹的人。同时，他也是一个非常复杂的人，他对复杂世界的真实世界的规则简直看得真真切切。因此他可以保持简单且活得幸福。\n\n**简单的人选择复杂的人生，是强化自体之道，那么复杂的人，最简单地人生是如何？个体经常追求关系中的简单，比如我想见到我对象就是对她亲热也少要玩手段，就会担心孩子将门铃按到母亲人未来婚姻关系中，这样我对亲密关系中自体虚弱导致的吗？**\n\
    \n**武志红**\n\n世故的人，在最亲密关系中都较比对待别人，去控制，去控制，这也是一种自虐的表现，觉得为了增强自己，而必须去剥削别人，就像婴儿觉得必须吸吮妈妈的乳汁一样。\n\
    \n简单且自体虚弱的人会通过接触复杂的人和世故且自体虚弱的人，又被对方报复。那么今我理解了这份自体虚弱，又该如何主动改变，从而不报也能增强自体呢？\n\n\
    **武志红**\n\n通过你的内心，按照你的感觉去活，去这个世界里。在这些感受中，至少有两个东西是增强自体的关键。\n\n1. 反脆弱：你的身体和心灵都是一个反脆弱系统，可以在打击中不断强大起来，而不是从承受打击，但是强大。用我的一再强调的话来讲，就是你要不断去尝试死，能量死不死不死，而且你常常能到死就能强化生命本能。\n\
    2. 关系的深度：自体强大的人，是你在唤醒自己，发掘被激活了，你的生命力没有带来灾难性后果，相反还加深了你们的关系，这是根本的自体强化之路。\n\n**老师，我们看到很多同学的攻击性，都是听了老师讲的课之后，原本没有活出自己的，渐渐开始活出自己了，有没有新的，渐渐都开始活出自己了。有没有那种本身就活出自己的人，不知道自己已经活出了自己，听了老师的课之后，却认为自己没有活出自己，然后更加努力去活出自己、展现自己攻击性的人呢？**\n\
    \n**我觉得您是这种人。起初心也认为我没有活出过自己，要努力去活，做自己。后来我才发现有点不对，我本身就是按照本心做事，再“活出”自己的话，就会变得“自私”。我开始批判性的看老师的文章，或许老师说的不是全部对的，不适合所有人。但是我也太不自信，毕竟老师只看专业。我是真的活出了自我，还是只陷入了自己的幻想中？其实还没活出自我？**\n\
    \n**武志红**\n\n这是很好的问题，回到你的这个问题，我们可以有两个层次：第一是，关于观点；第二是你这段描绘中所呈现出来的模式。\n\n至于观点，当然我不是全对的，任何老师都不可能全对，我们需要批判对待这些观点\n\
    \n至于模式，也许可以说，当你看到很多人讲到他们逐渐活出攻击性时，我个人认为，你可能会觉得他们是好学生，而不是，所以你想向他们认同，但真要认同时，你会发现这带来了一些问题，于是你怀疑你的观点是否正确。所谓问题，那肯定是你的关系中了一些问题，就是你使用新方法时，不被人接纳。那么，这两个地方都可以看到，你很想得到大家的认同，当得不到时，你会怀疑自己是否是对的。\n\
    \n**我有一个疑惑，我在家庭生活中就是一个十足的好人，完全没有攻击性，但是在工作中却相差甚远，和我的先生正好相反。不知道习惯了做好人的我为什么在工作中却能较好的展开攻击性，而在工作中和对待家庭以外成员完全是好人的先生，在家庭里却会随意展开自己的攻击性呢？**\n\
    \n**我自己尝试回答这个问题，而在我的原生家庭里，这种好人是被贴了无比正确合理标签的，我也因为好人的形象在原生家庭里获得更多的爱。而一开始先生在我面前时表现出的好人形象就像他在面对家庭以外的人一样，所以这种形象自然就吸引了我。而当进入婚姻生活后，先生发现我是个好\
    \ 人，所以很自然地就把他在原生家庭中坏人的一面毫不费劲的展示出来，不知道我的理解是否正确？但是对于为什么长期以来我在工作中之能展现坏人的一面，先生在工作场合却一直给人好人形象还是没有找到合理解释，可否请教老师呢？**\n\
    \n**武志红**\n\n你们是如此不同，但综合到一起，你们就可以比较好地面对整个世界了。所以可以说，你们都需要向对方很深地学习。\n\n这时可以看到一个完整的部分，你能对外人发起攻击，而你的先生能对家人发起攻击，综合起来，就意味着，你们两个能对整个世界发起攻击，也许这是你们需要完整学习的部分。\n\
    \n### 本单元内容回顾\n\n### 预告：单纯与复杂\n\n- 现实01|越简单，越复杂\n- 现实02|“好人”逃避了什么\n- 现实03|输在起跑线上\n\
    - 加餐：中国式关系中的“葵花宝典”\n\n人性无比复杂，任何人都没有简单活着的福气。追求人性完整的 力量，要远胜过追求幸福快乐的动力。\n\n![](img/1c8805f81e6502071128412767cb1966_58_0.png)\n\
    \n每个人的行为都是在追求好处。\n\n# 预告：从想象世界到现实世界\n\n**武志红**\n\n这是“现实”主题下的第二单元，本单元的主题是“从想象世界到现实世界”。\n\
    \n“现实世界是有疗愈性的”，最近两年我常常在我的文章中使用这句话。这是什么意思呢？\n\n这首先是来自于我对一些问题很严重的来访者的观察。这些来访者，他们通常看上去非常简单，但同时他们是封闭的。有的来访者，他们可以看到自己内在有非常黑暗可怕的想象，而有的来访者，他们意识不到这种内在，但随着咨询的深入，这份黑暗可怕的想象会呈现出来。\n\
    \n对于这些来访者而言，现实世界的美好程度，要远远多于他们的内在，所以当他们逐渐走出来后就会发现，现实世界是有疗愈性的，他们变得更好了。\n\n其次，“现实世界是有疗愈性的”，这句话还来自于理论。每个人都需要把自体的生命力，展现在与客体的关系中，只有这样，生命力才会被驯服。这意味着我们必须进入现实世界，真实地呈现自己并与各种存在去碰撞，这虽然会显得非常复杂，但却可以让我们变得更好。\n\
    \n第三，在精神分析理论看来，人的发展是需要经历这样的阶段：最初每个婴儿都活在孤独的幻想世界中，然后进入妈妈或其他抚养者构建的过渡世界，在这个过渡世界中初步走出幻想世界，整个家庭都像是一个过渡世界，孩子在这个世界中学习如何展现自体，并与客体相处，最终，孩子进入到现实世界。\n\
    \n第四，在我看来，即便非常成功地完成了社会化过程，非常好地进入了现实世界，这个过程并未结束。按照英雄之旅的概念，整个家庭和社会构成的现实世界，都可以理解为过渡世界，一个人在这世界中不断学习，最终发现，自己的内在想象和外部现实，竟然是一回事，由此证悟到了合一。\n\
    \n我们这一单元就来谈谈这个过程。本单元的调查是，你在什么时候有发现过，更深地融入社会让你变得更好？\n\n分享两段鲁米的诗，先来给你读读第一段：\n\n\
    渴望是神秘的核心\n渴望本身就可以疗愈\n忍受痛苦，这是唯一的法则\n\n下面是第二段：\n\n你必须训练你的愿望\n如果你想要什么\n那就先奉献什么\n\n\
    我个人认为，这真是妙不可言的两段诗句，这的确是一个人的内在想象与外部现实之间的根本规律。\n\n- 推荐阅读：\n  - 空间07｜个性化、社会化与体系化\n\
    \  - 现实02｜“好人”逃避了什么\n  - 复盘：关于“创造”主题的回顾\n\n![](img/1c8805f81e6502071128412767cb1966_59_0.png)\n"
  mdcn: "\n可以说是一种地地道道的“输在起跑线上”。单纯的脸，常常就是一张顺从的脸。顺从的人，必须简单，因为一旦有了复杂的智慧和力量，就不可能再去顺从了。\n\
    \n## 划重点\n\n> 如果生命一开始，就被教导顺从，可以说是“输在起跑线上”。所谓叛逆，其实是孩子想做自己，想按照自己的意愿去行动，这个时候如果大人利用自己的力量去压制孩子，那就会破坏孩子的意志。如果在任何关系中，都无法做自己，都太考虑别人，那就会选择内向与封闭，任何关系都会成为巨大的挑战。\n\
    \n- 推荐阅读：\n  - 创造 07 | 内在的批评者\n  - 关系 08 | 世界的本质，是关系\n  - 复盘：关于“创造”主题的回顾\n\n![](img/1c8805f81e6502071128412767cb1966_54_0.png)\n\
    \n# 加餐：中国式关系中的“葵花宝典”\n\n**武志红**\n\n这是“现实”主题下的第一单元“单纯”，这一讲是加餐，题目是“中国式关系中的葵花宝典”。\n\
    \n这一讲我们也是从一个故事开始。\n\n有一位非常有力量、也很有魅力的女士，她有一个憨厚有魅力的丈夫，同时她也和一个她一样复杂有魅力的情人。在这个三角关系中，她一直很少照顾自己的丈夫，觉得自己很爱也很在乎情人。\n\
    \n在一次咨询中，我请她谈谈，她理想中的爱人是什么样的，可以用欣赏观也可以用管理道，我请她谈一下，这位女士本来是想谈一个超级完美的人，所以这份自画像很容易。几秒钟内，她就一一列举了以下几个条件：\n\
    \n1. 要帅，要有肌肉感；\n2. 要像白马王子一样，对我好，其实是黑又王子都接受；\n3. 要有社会地位，要有很多钱；\n4. ……\n\n她列了很多条件，最后列出的条件是“愿意做家务”。\n\
    \n这些条件中，“做家务”是最不起眼的条件了。但接下来，我请她一一删除这些条件，也就是当她不得不放弃某些一个条件时，哪些条件是最愿意放弃的。然后很有信息的矛盾发生了，她发现最愿意删除的条件，其实是“愿意做家务”。由此她明白，她老公的实际重要性远远超过她的想象，而表面上符合她条件的情人，其实只是一道配菜。\n\
    \n说到最后，我对她说：看来你想找一王子，而她愿意为你做家务。她若有所思地说，她丈夫其实也很对她，但在两人所说的关系中，逐渐变成了一个二十四孝老公，实际上，在谈恋爱时，他就是这样。\n\
    \n这样的故事可多了，我逐渐总结出这样一个说法：中国式恋爱的绝招是把对方当婴儿一样照顾，当神一样崇拜。\n\n然后我也发现，互联网上流传的各种迎合女人发疯梦的文案，其实都是在讲这个东西。现在中国，也的确承认认可进进的男人，他们极善于照顾女人，但同时他们也花心至极。\n\
    \n我下的观念不断延伸，后来我总结出，这个现象中国式恋爱中的绝招，也是中式关系，或中国式存之道的绝招，只是刚才这两点还不够，如果再加点一点就以达到葵花宝的级别了。这一点就是：有一张愚忠的脸。\n\
    \n这样一来，我认为中式关系的“葵花宝典”的完整神就是：把对方当婴儿一样照顾，当神一样崇拜，同时自己有一张愚忠的脸。\n\n单纯，是一个很好的词，简单，就是一个中性词，而一旦变成“愚忠”这个词，这个人很难接受了，可思虑太多了，这三个词在一定程度上是一脉相承的。\n\
    \n上一讲课程中我们谈到，我们在社会中，无论家长是如小儿童，都希望孩子能长大成人，因此婴孩期不余地希望孩子的。逼迫和顺从，也就是中式关系的一个基本特征，也知道，强迫的目的是希望他顺从于我。\n\
    \n那反过来，如果我们表面上去顺从大家的这份需求，然后我从中等挑人，也就会得到所谓顺从的中式关系中的人的绝招的信悟，并把这种使用得淋漓尽致，因此获得了成功。\n\
    \n为什么有一张愚忠的脸呢？因为逼迫和顺从中最有的一类，忠是一种顺起，就会不愿意顺从，顺就顺从，那是压抑和屈辱，所以你必须要有方面是愚蠢的，这样才可能顺从他人。这种算计，在中式关系中也太常见了。\n\
    \n例如明朝的大太监魏忠贤，我们的影视作品中描绘他，你看他极易会刻画出他极聪明狡黠又智极高的人，但很可能最重要的特征不是智智，而是完美地实现了这三点：他不敢当人一样暴躁，当神一样崇拜，同时又有一张愚蠢的脸。\n\
    \n我们容易攻击吕布顺忠的人，但这的人如果更多一些可能更好，因为这样一个社会就可以明白这种式的人到底是怎么回事了，然后去寻求追求“你要心甘情愿地顺从于我”这种东西。\n\
    \n同样的，我们还可以做一个推理：一个人既顺从，又愚忠像心甘情愿一样，那很有可能又因的是他自己的智商。\n\n用稍神分析的模式来说，就是他启动了“自我功能的中断”这种自我防御机制，而即抑制的，就是自己的智商。\n\
    \n> ※《加微8》: 一些常见的防御机制\n\n我再来讲一个经典的故事，这也是曾经轰动一时的新闻，也许你听说过，有一夏天，汛期将至，有一个村庄有很大可能发大水。一个年轻的村民，他本是在市里打工，却因为担心家里老父母家，于是特意开车赶回了老家。他的父母可能是有一些矛盾，所以爸爸妈妈住在村子西边，而爸爸、妻子和两个幼小的孩子住在村子里东边。爸爸是腿脚不便，两个孩子一个两岁，一个四岁。\n\
    \n他本来的计划是接先去妈妈，再接上一家三口，这样都可以顺顺当的。但是他到了妈妈家门口，不想顺顺当当。然后坐在家门口，在门口等了一到两个多小时，发现大水和妻子来了，救自己的担心。回到家后，他妻子孩子了了自己的担心，然后因为太累就睡着了，可妻子一直喊，就没醒着。后来，洪水真的来了，都水进到他们家院子，妻子及时唤醒他。\n\
    \n接下来这位小伙子的选择非常耐人寻味，他立即跑去救门，去救他妈去了，等他妈叫醒并带上到房顶上后，他大，没法回去，和妻子和两个孩子在村子里东边，也都没有安全地放在了房顶上了，都没事。\n\
    \n可妻子从此后不再和他说话，来向他提出离婚。\n\n这件事被报道后，轰动一时，这位年轻人，绝对是孝顺的化身了，如果放到十多年，那肯定是一奖，可公子的认识发生了转变，他是懂的善良少了很多，很多人觉得他很愚蠢，这时对的选择简直是不可能。\n\
    \n在那样的急时，人很难有两个选择，这种忠心的做法让人很难得，都可以理解，我认为真正的问题就既然已经预判到了洪水要来，他为什么不亲妈妈门口等个几多小事，这些要求在婆婆家里，如果他能叫醒妈妈，让妈妈先准备，然后提早联系父亲和妻子做好准备，安全效能会提高很多，同时财物的损失也可以降低很多。\n\
    \n我觉觉得那个时刻，他的智商是关闭了一样，在妈妈门口等个三小个时的愚蠢行为，也许本质就是一种顺从。太听见的，很容易出现一种思维，在根大上都想你什么，而所想的也不得不根据这上放弃这根本动力，那如果把自已再慢一下，是没办法这样做的。\n\
    \n如果你在养育一个根为，你一开始就让他顺从，还是希望给他这种感觉：世界有足够好的他的本能嗨响而做，这句话也是心理学派尼斯特说的，我在中国的课中中提过它，我现也在逐渐形成了自己的表达，在这里分享给你：\n\
    \n当一个人感觉到，他的生命能够按照他的自自由意志来展开，他将会被关爱、困难、拒绝、封闭和消解将他折磨他，每一时刻的孩子都想被爱，一个被爱和自由意志的孩子，常常会像一个文心机一样，同时又能专注地投入在他们正在做的事情中。\n\
    \n如果你正在养育一个孩子，你可以给他需要这种感觉。同时你也别忘了，你也可一样需要这种感觉。\n\n1. 如果一个人顺从了，又愚的像心甘情愿一样，那很有可能启动了他的智商，抑制的就是自己的智商。\n\
    2. 太听话的人，容易出一顺，因为人根本上想都做放弃，而听话的人不得不放弃这些。\n3. 在相当程度上放弃这一个根本动力。心理学家温尼科特说“世界准备好接纳你的本能喷涌而出”，在养育孩子时，我们希望给孩子这样的感觉，而不是顺从。同时，还要谨记，作为成年人的自己一样需要这种感觉。\n\
    \n## 划重点\n\n> 如果一个人既顺从，又真的像是心甘情愿一样，那很有可能是启动了“自我功能的抑制”这种自我防御机制，抑制的是自己的智商。心理学家温尼科特说“世界准备好接纳你的本能喷涌而出”，在养育孩子时，我们希望给孩子这样的感觉，而不是顺从。同时，还要谨记，作为成年人的自己一样需要这种感觉。\n\
    \n推荐阅读：\n\n- 自我06 | 让你的本能喷涌而出\n- 自我14 | 真自我和假自我\n- 复盘：关于“创造”主题的回顾\n\n![](img/1c8805f81e6502071128412767cb1966_56_0.png)\n\
    \n# 问答：幼稚、单纯、世故和成熟\n\n**武志红**\n\n这一讲是我们专栏的问答时间，我先分享一下我的感悟，再回答一些用户的问题。\n\n我的这个感悟来源于我仅有的一次相亲经历。说实话，我有点点头约，我感觉自己条件说得还过去，但是不知道为啥，没有人给我介绍相亲，这是我仅有的一次。\n\
    \n在这次相亲中，我讲了一句很有感受的话：成熟有两种，一种是掌握了现实规则的成熟，一种是人生性的成熟。\n\n我就不给大家讲有秘密的相亲故事了，我要说明，毕竟没有秘密的人是长不大的孩子。\n\
    \n我想继续给你谈简单和复杂。很多用户在留言中提到，如何定义单纯、简单、幼稚和复杂这些词。\n\n这是一个好问题，就用我刚才这句话感悟，和管理学院中向向东老师不断使用的‘四象限坐标图’来区分下简单与复杂。\n\
    \n点击试听：宁波大学·海洋学院管理理学·《学术领导的极简指南》\n\n制作一个四象限坐标图，需要有两个维度，结合本单元的‘复杂与单纯’这个主题，以及我刚才说到的感悟，我认为可以有两个维度：一个是内在人性的幼稚与成熟，另一个是外在规则的无知与掌握。\n\
    \n这样一来，就可以区分出四种模式和我的定义：\n\n1. 内在人性幼稚，同时对外在规则无知，这是幼稚；\n2. 内在人性成熟，同时对外在规则无知，这是单纯；\n\
    3. 内在人性幼稚，同时掌握了外在规则，这是世故；\n4. 内在人性成熟，同时掌握了外在规则，这是成熟。\n\n![](img/1c8805f81e6502071128412767cb1966_57_0.png)\n\
    \n世故和成熟的人，都是复杂的，而幼稚和单纯的人，都是简单的。\n\n四象限坐标图是很有用的工具，我觉得可以在这个坐标图上继续发挥一点创造性，我们可以在坐标图上坐标的原点，也就是在内在人性和外在规则都为零的这个位置上，这是一种原始的合一，而在内在人性和外在规则得分都很高的位置上，也会存在合一的可能。\n\
    \n这样的人，就可以达到王阳明的境界，不仅证悟到天道即理心“致心”之外，则无它了。而且悟得‘此心无’，随缘而应。到了这种境界，就是最简单，也是最复杂，简单和复杂由此统一了起来。\n\
    \n## — 单元问答 —\n\n**复杂的人会被简单的人吸引吗？如果每个人都是复杂的，就像世界里面只有男人，也是不符合 A 与 A 吗？**\n\n**武志红**\n\
    \n复杂的人，当然会被简单的人吸引。特别是有些地方，会被幼稚的人吸引。我认为在这有两个原因，一是幼稚的人容易被掌控；二是幼稚的人有一种简单的美好，这给了世故的人一种对美好的想象。\n\
    \n**电影《阿甘正传》里的阿甘，就是一个智商不高极其简单的人，阿甘的简单和单纯却带给了他巨大的幸运。无论独舞，电影多数场景或艺术作品中，都会有类似的形象，甚至是中国古语里都有‘傻人有傻福’。这样的作品常让人觉得单纯是人生至高的精神财富，武老师是怎么看待这种简单的呢？**\n\
    \n**武志红**\n\n我也非常喜欢《阿甘正传》这部电影，我觉得在一个规则基本公平合理的社会，这是一种真实的可能性。\n\n然而我很好奇的是，如果我们观察自己的周围，会有这样一个阿甘吗？阿甘实际上没有世俗的成功，而郭靖不同，他最后成了武林至尊。\n\
    \n如果用这节课所讲提到的四象限图，可以那种‘生辰成而对外规则无知’的人，他们的单纯性是容易被赞许的，同时也可能会获得成功，如幼稚的人难以做到。\n\n此外，当所有人都是世故时，看似单纯的人也容易出，因为他们代表了大家都不敢做的事。例如埃及前总统穆萨德，他是埃及传奇总统赛菲的副手，在纳赛尔去世后，各方派系斗非常厉害，可他一直很老实，被称为‘土推上校’，大家觉得他好控制，于是为一致推他继任总统。谁想到，他的老实装傻为厉害，一上台总选党之后，他立即变成了杀死法哈斯非常厉害的角色，而且表现得非常正确。\n\
    \n简单的人会因为对简单的人提防他，而获得生存空间，但也只是仅此而已。\n\n**武老师，你之前专栏中说的孙博不就是一个纯粹又活得简单的人吗？那样的人不是那么人好向往的生活状态吗，他命运又怎么就那么凶？他不就是那种一直活非常的高尚且从来不去复杂，却一直走来都很幸福的人吗？**\n\
    \n**武志红**\n\n我认为只有一种简单是可以的，就是你一直在做自己，这个点你本来通过，这时你有一个强大的内在，同时也可以适应外在。也就是说外在不是偶合适，而是你常常会让外在为你改变。\n\
    \n孙博是一个真正纯粹的人。同时，他也是一个非常复杂的人，他对复杂世界的真实世界的规则简直看得真真切切。因此他可以保持简单且活得幸福。\n\n**简单的人选择复杂的人生，是强化自体之道，那么复杂的人，最简单地人生是如何？个体经常追求关系中的简单，比如我想见到我对象就是对她亲热也少要玩手段，就会担心孩子将门铃按到母亲人未来婚姻关系中，这样我对亲密关系中自体虚弱导致的吗？**\n\
    \n**武志红**\n\n世故的人，在最亲密关系中都较比对待别人，去控制，去控制，这也是一种自虐的表现，觉得为了增强自己，而必须去剥削别人，就像婴儿觉得必须吸吮妈妈的乳汁一样。\n\
    \n简单且自体虚弱的人会通过接触复杂的人和世故且自体虚弱的人，又被对方报复。那么今我理解了这份自体虚弱，又该如何主动改变，从而不报也能增强自体呢？\n\n\
    **武志红**\n\n通过你的内心，按照你的感觉去活，去这个世界里。在这些感受中，至少有两个东西是增强自体的关键。\n\n1. 反脆弱：你的身体和心灵都是一个反脆弱系统，可以在打击中不断强大起来，而不是从承受打击，但是强大。用我的一再强调的话来讲，就是你要不断去尝试死，能量死不死不死，而且你常常能到死就能强化生命本能。\n\
    2. 关系的深度：自体强大的人，是你在唤醒自己，发掘被激活了，你的生命力没有带来灾难性后果，相反还加深了你们的关系，这是根本的自体强化之路。\n\n**老师，我们看到很多同学的攻击性，都是听了老师讲的课之后，原本没有活出自己的，渐渐开始活出自己了，有没有新的，渐渐都开始活出自己了。有没有那种本身就活出自己的人，不知道自己已经活出了自己，听了老师的课之后，却认为自己没有活出自己，然后更加努力去活出自己、展现自己攻击性的人呢？**\n\
    \n**我觉得您是这种人。起初心也认为我没有活出过自己，要努力去活，做自己。后来我才发现有点不对，我本身就是按照本心做事，再“活出”自己的话，就会变得“自私”。我开始批判性的看老师的文章，或许老师说的不是全部对的，不适合所有人。但是我也太不自信，毕竟老师只看专业。我是真的活出了自我，还是只陷入了自己的幻想中？其实还没活出自我？**\n\
    \n**武志红**\n\n这是很好的问题，回到你的这个问题，我们可以有两个层次：第一是，关于观点；第二是你这段描绘中所呈现出来的模式。\n\n至于观点，当然我不是全对的，任何老师都不可能全对，我们需要批判对待这些观点\n\
    \n至于模式，也许可以说，当你看到很多人讲到他们逐渐活出攻击性时，我个人认为，你可能会觉得他们是好学生，而不是，所以你想向他们认同，但真要认同时，你会发现这带来了一些问题，于是你怀疑你的观点是否正确。所谓问题，那肯定是你的关系中了一些问题，就是你使用新方法时，不被人接纳。那么，这两个地方都可以看到，你很想得到大家的认同，当得不到时，你会怀疑自己是否是对的。\n\
    \n**我有一个疑惑，我在家庭生活中就是一个十足的好人，完全没有攻击性，但是在工作中却相差甚远，和我的先生正好相反。不知道习惯了做好人的我为什么在工作中却能较好的展开攻击性，而在工作中和对待家庭以外成员完全是好人的先生，在家庭里却会随意展开自己的攻击性呢？**\n\
    \n**我自己尝试回答这个问题，而在我的原生家庭里，这种好人是被贴了无比正确合理标签的，我也因为好人的形象在原生家庭里获得更多的爱。而一开始先生在我面前时表现出的好人形象就像他在面对家庭以外的人一样，所以这种形象自然就吸引了我。而当进入婚姻生活后，先生发现我是个好\
    \ 人，所以很自然地就把他在原生家庭中坏人的一面毫不费劲的展示出来，不知道我的理解是否正确？但是对于为什么长期以来我在工作中之能展现坏人的一面，先生在工作场合却一直给人好人形象还是没有找到合理解释，可否请教老师呢？**\n\
    \n**武志红**\n\n你们是如此不同，但综合到一起，你们就可以比较好地面对整个世界了。所以可以说，你们都需要向对方很深地学习。\n\n这时可以看到一个完整的部分，你能对外人发起攻击，而你的先生能对家人发起攻击，综合起来，就意味着，你们两个能对整个世界发起攻击，也许这是你们需要完整学习的部分。\n\
    \n### 本单元内容回顾\n\n### 预告：单纯与复杂\n\n- 现实01|越简单，越复杂\n- 现实02|“好人”逃避了什么\n- 现实03|输在起跑线上\n\
    - 加餐：中国式关系中的“葵花宝典”\n\n人性无比复杂，任何人都没有简单活着的福气。追求人性完整的 力量，要远胜过追求幸福快乐的动力。\n\n![](img/1c8805f81e6502071128412767cb1966_58_0.png)\n\
    \n每个人的行为都是在追求好处。\n\n# 预告：从想象世界到现实世界\n\n**武志红**\n\n这是“现实”主题下的第二单元，本单元的主题是“从想象世界到现实世界”。\n\
    \n“现实世界是有疗愈性的”，最近两年我常常在我的文章中使用这句话。这是什么意思呢？\n\n这首先是来自于我对一些问题很严重的来访者的观察。这些来访者，他们通常看上去非常简单，但同时他们是封闭的。有的来访者，他们可以看到自己内在有非常黑暗可怕的想象，而有的来访者，他们意识不到这种内在，但随着咨询的深入，这份黑暗可怕的想象会呈现出来。\n\
    \n对于这些来访者而言，现实世界的美好程度，要远远多于他们的内在，所以当他们逐渐走出来后就会发现，现实世界是有疗愈性的，他们变得更好了。\n\n其次，“现实世界是有疗愈性的”，这句话还来自于理论。每个人都需要把自体的生命力，展现在与客体的关系中，只有这样，生命力才会被驯服。这意味着我们必须进入现实世界，真实地呈现自己并与各种存在去碰撞，这虽然会显得非常复杂，但却可以让我们变得更好。\n\
    \n第三，在精神分析理论看来，人的发展是需要经历这样的阶段：最初每个婴儿都活在孤独的幻想世界中，然后进入妈妈或其他抚养者构建的过渡世界，在这个过渡世界中初步走出幻想世界，整个家庭都像是一个过渡世界，孩子在这个世界中学习如何展现自体，并与客体相处，最终，孩子进入到现实世界。\n\
    \n第四，在我看来，即便非常成功地完成了社会化过程，非常好地进入了现实世界，这个过程并未结束。按照英雄之旅的概念，整个家庭和社会构成的现实世界，都可以理解为过渡世界，一个人在这世界中不断学习，最终发现，自己的内在想象和外部现实，竟然是一回事，由此证悟到了合一。\n\
    \n我们这一单元就来谈谈这个过程。本单元的调查是，你在什么时候有发现过，更深地融入社会让你变得更好？\n\n分享两段鲁米的诗，先来给你读读第一段：\n\n\
    渴望是神秘的核心\n渴望本身就可以疗愈\n忍受痛苦，这是唯一的法则\n\n下面是第二段：\n\n你必须训练你的愿望\n如果你想要什么\n那就先奉献什么\n\n\
    我个人认为，这真是妙不可言的两段诗句，这的确是一个人的内在想象与外部现实之间的根本规律。\n\n- 推荐阅读：\n  - 空间07｜个性化、社会化与体系化\n\
