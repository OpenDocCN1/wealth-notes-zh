  md: "\n# 直播回顾 | 如何拥有自己说了算的人生\n\n![](img/1c8805f81e6502071128412767cb1966_163_0.png)\n\
    \n武志红\n\n7月14日，我在得到直播间做了一场心理学年度直播课，大约用了一小时的时间，将心理学的相关认知知识做了一次大串讲，触碰了“如何拥有自己说了算的人生”这样一个大主题。\n\
    \n这场直播课，从清华有书没有对好自己，到心理学怎样培养攻击性，如何活出真正的自我，如何在关系中撑住主动权，自我边界，帮助别人清晰到底什么是自己说了算的人生，并且真正成为一个能自主选择的人。\n\
    \n你可能因为各种各样的原因错过了这场直播，或者，你看懂了直播，但是需要对其中的内容进行加深巩固，所以，我将直播的内容整理成了文字版，方便你回顾、学习。\n\
    \n希望这一场年度大课能够让你有所收获，如果你有新的感悟体会，欢迎你留言给我。\n\n## 内驱性自我\n\n今天的主题，就是“内驱性自我”。\n\n我在这一年的课程内容生产过程中，逐渐意识到我们的核心内容其实就聚焦在讲如何形成一个内驱性的自我。\n\
    \n我们讲“拥有一个自己说了算的人生”，这个听起来很简单，可能很多人认为自己早已经想清楚了，可是，自己准备做，这辈子最宝贵的就是我自己，我就是要为自己而活，就要拥有对自己说了算的人生，甚至会因此感到有点斗志昂扬。\n\
    \n结果当你在真的战斗的时候，最赢的时候，发现总是做不到，为什么呢？用今天的讲来，就是因为你缺少一个非常有凝聚力的自我，我们把它称之为内驱性自我。\n\n\
    个人成长史上，内驱性自我的形成是一个里程碑事件。在内驱性自我没有形成之前，经常被起哄，经常打骂的这种自我，是内驱性自我没有形成的状态，这种状态下的内心体验是分裂的、混乱的，这种体验就是被撕碎的感觉，一旦产生这种体验，你就再也没办法集中注意力做事，感觉就要被撕碎。\n\
    \n但是，当你形成内驱性自我之后，情绪的惊涛骇浪会穿过你的身体，穿过你的自我，穿过你的核心。你会发现，即便遇到了再大的冲突，再激烈的争吵，你能感觉到自我是稳定的，是坚实的。同时有个自我稳稳地站在那，你会更清晰、更准确地表达自己。\n\
    \n有破碎自我的时候，会出什么事情呢？在任何事件，你的注意力都会紧紧盯在某个东西，就是希望被肯定，希望获得一个好评。你的视野会变得非常狭窄，不能够考虑到大局，不能够完整的思考。\n\
    \n因为如果我是破碎的，那就没办法管理精力和注意力，没办法选择怎么说，首先需要从破碎的自我中取得进步，虽然很痛一下子进入到内禀性自我，但可以先进入到头脑自我。\n\
    \n你可能会觉得破碎自我太糟糕了，但是我必须要强调一下，其实有很多天才都是破碎自我。\n\n比如很多艺术家，演员，特别是敏感型的天才，我们很多人都是破碎自我。为什么呢？假如说完整的头脑自我包在我，这时候有好坏，能够被接受了，能够选择了。但是同时也小心了，头脑自我就像一堵墙，一个完整的防御，它切断了你和外部世界的联系。\n\
    \n而没有破碎自我的人经常活在感觉中，因为没有和外部世界切断，结果外部世界很多信息非常直接进入到内在世界里，内在世界很多东西也能够淋漓尽致地表达出来。所以破碎自我的人经常显得非常有魅力。\n\
    \n## 第二层次：头脑自我\n\n多数时候，你看到有人跟你说我的时候，他们讲的都是头脑自我。\n\n为什么这样讲呢？自我就是头脑自我，我要强调一下，这不是指个体，而是那个核心。把self翻译成自我，强调的就是像你的身体一样真实。\n\
    \n弗洛伊德把人格分为三部分，本我、超我和自我。本我就是本能，按人的本心，想怎么快乐，想实现自我的一切欲望，想怎么着就怎么着，这是本能。\n\n超我其实就是道德和规则，想管理本我，本我想乱来，所以就构成了一个直接的冲突。然后ego\
    \ 就在这儿起了一个协调的作用。\n\n我们可以大致来理解自我或者头脑自我，就是在协调本我和外部世界的关系。\n\n头脑自我是个巨大的能量，如果你有一个稳定的头脑自我，你就可以比较安定地处理各种各样的东西。\n\
    \n我常学着阅读，大家不要觉得读书写作为了一个学25年内心理学，而且写了四五十万字了，应该也是个心理很健康的人，在教大家如何活得更健康，其实根本就不是这么回事。\n\
    \n我自己问题也很多，但是我不断地在思考，我自己在认识自己，所以在认识自己的过程中，也把这些东西跟大家分享。而且，我并不认为我现在已经成了一个特别好的内秉性自我，其实在相当大的程度上，我还在头脑自我的层面上。\n\
    \n很多来访者会说自我我有很多各样的形容，有来访者说自我经常感觉自己在铁桶里躺着。如果一个人感觉像是铁桶里盖着的，他的内和外部世界的连接非常弱，会有一系列负面表现。头脑自我像是外壳，切断了你和生命力的连接，你会有一种感觉：我活得很好，我活得很安全的感觉，甚至我觉得活得很好，但是我其实处在一种僵凝的状态里。\n\
    \n最好是这样，你的头脑自我感觉像皮肤一样，很灵活，是有比较好的和外部世界沟通的一个部分。\n\n## 第三层次：形成内秉性自我\n\n我们常说“面子很硬”，因为我们很多人都是头脑自我，现在很多人都是破碎自我，一旦你他说你那是真，那就是面子了。\n\
    \n不知道大家身边有没有这样的人，他能够聆听你的信息，向你传递很糟糕的感觉，他就能走得走，又给你传达一个很好的信息，这个叫去毒化。\n\n父母对孩子、咨询对来访者、老师对学生、好的人都应该有这样的功能，有很好的内秉性自我的人基本上具备这一种功能。\n\
    \n自我发展需要一个过程，如果一个人真的是破碎自我，那你是不是能够指望那个人去承受你自己，一个没有头脑自我，他貌似接受了批评，但是内心并不能承受得了。所以，我们要对周边世界稍微保持一种宽容的态度。\n\
    \n我们会见到大量这样的事情，当遇到事情的时候，我们首先去找一个责任人，到底是错的，我们不敢有一种为归罪心理是我要把不是我的责任甩出去，为了保护这种感觉：我基本上是好的。\n\
    \n在好的关系中，如果你有幸碰到一个有内秉性自我的人，这个人比较成熟，她更愿意帮你承受一些东西，你发现他能够把这种坏信息，再还给你一个好的东西。这就是成熟的标志，一个有成熟的人，他是一个有内秉性自我的人，他能够接受自然的惊涛骇浪，接受你的“坏”。然后又经过他的处理，这个信念变成一种相对来说更好的信息，在这个关系里得以呈现。\n\
    \n## 内秉性自我如何形成？\n\n只有一种东西可以形成内秉性自我，就是真实。\n\n你必须真实地活着，除了真实，再也没有别的道路，真实意味着你要真实地展开你的生命力。\n\
    \n精神分析常见的动力是三个：自恋、性和攻击性。很多时候分析师说这些东西都挺为攻击性，就是你必须带着攻击性展开你真实的生命。\n\n你有点任性地看着，按照你的感受呈现最真实的自我。只有当呈现最真实自己的时候，你才会获得一种感觉，说这是可以的，这是好的。这样才能形成这个真实的东西在核心里，才能形成坚定的内核，除此之外没有别的道路。\n\
    \n所以如果你想这一辈子都想活得很善良，活得很非好，非常礼貌，这可不可以形成一个成熟人格？对不起，我说得这不可能。\n\n只有真实地展开你带着攻击性的生命力，你才可能形成一个内秉性自我。\n\
    \n我再讲一个基本模型：想象一下你是一个能量体，把它想象成圆形的，甚至想变成一个能量点，像一个能量点，这个能量点不断地对这个世界发出攻击性，发出你的能量触角。\n\
    \n什么叫做攻击性呢？我想获得爱，我想吃饭，我想做事业，我想展现我的自恋，这都是叫你的能量触角。\n\n当你伸出能量触角之后，会有两种可能：\n\n一种是关系中被接住了，一旦被接住，你的能量触角被照亮了，接住你能量的人就向你传达了一个信息：你是好的。当你的能量被照亮了，就意味着它从灰色变成白色或者彩色，被照亮了。\n\
    \n另外一种可能性是被拒绝或者被抽手，不想接住，就是托拒绝，有一种拒绝是，你伸出去，没有人理你，没有人看见。\n\n前面我们叫积极回应，后面叫做消极回应，无论是直接被拒绝，还是冷漠，都是一种很深的拒绝。这种情况下，灰色的中性的能量触角都会变成黑色。\n\
    \n如果大多数黑色能量，不断地回到你的身上，在你的内心感受到，你会发现他无论外表面上怎么样，其实在内心深处总觉得自己像是有一部分是黑色的。\n\n如果你通过各种的部分发现内在住着大量的黑色，怎么办？天塌嘛？其实不是，我们要想着办法，不要那么有破坏力地活出来。\n\
    \n当真实呈现这个黑色的生命力，在世界呈现出来的，才有机会获得救赎。如果你一直这样封闭地着，活成一个好人的样子，这个世界就变放弃了，说你没有选择接纳，这也没了世界失去你，这是非常非常可惜的部分。\n\
    \n我们经常说要求懂事，乖巧地活着，但是我们很敏感，活得任一些活着，我们要得太多一些。活得任性一些，活得放肆一些，当然也要注意，没有人有伤害别人的权力，所以你要真的构建一些伤害性别人，你还是需要强大，合理地表达。无论如何，只有在这个基础上，你才能够活得更好。\n\
    \n所以，我们说你要展开你带着攻击性的生命力。\n\n## 第四层次：做自主性选择\n\n世界真的是无常的，一切都在变化中。在所有的无常和复杂里，都有一个非常简单的东西，我暂且把它称为恒常，即选择。\n\
    \n当我做一个选择的时候，作为自体的我就和外部世界建立了一个关系，这个关系会形成一个图景内化到我心里，成为我心里的一部分。成为一个什么样的人，都是由你的选择所组成的。\n\
    \n但是选择会有冒险的成分，当你真的做选择的时候，你要负责。\n\n最原始的心理叫做全能自恋，是觉得自己是神，觉得自己无所不能。而做选择不可能做一做选择却获得四面八方的好处，所以一选择就有破绽，选择越多，破绽越多，漏洞就越多。所以存在当你做选择的时候，你的全能自恋感就被破坏了。\n\
    \n其实你做任何一个选择时，同时都在做着一些破坏，多少会有愧疚感产生，所以你一做选择，你会觉得好像没有那么清白了，没有那么好了。所以如果你这辈子都没有做过重大的选择，那么很可能你就是为了获得这么两个好处：我还可能是全能的，我还可能是超厉害的人，我之所以没有那么厉害，就是因为这辈子还没有做过真正的选择，如果我一做选择，我就非常了不起。\n\
    \n另外，不怎么做选择的人可能是想保留这么一种感觉：我是一个好人，我没有伤害这个世界。但是同时，你也没有真的对这个世界有所贡献，所以，你可以问问自己是不是在回避做选择，如果你想成为你自己，如果你想成为一个强有力的人，或者你想体验到这个世界是怎样的，你必须做各种各样的选择，而且一定要拿出这样的勇气：这是我的选择，我想这么做，我想要这个，这是我的选择，所以我要为此负责。\n\
    \n选择，非常奥妙，就像我们前面讲到的能量体这个模型，你不断地伸出你的能量触角，才有机会跟这个世界建立大量丰富的连接。当你不断这样做的时候会有这么一种可能性：你作为一个能量体，你和这个世界的连接越来越多，被照亮的时候也越来越多，最后你可能作为一个整体的存在，你就被照亮了，这时候你会体验到人性好像是一种光明。\n\
    \n如果你通过不做选择来显示“我是好人”，其实是不可能的，因为你内在会藏着很多黑暗，你甚至会怀疑自己是不是一个很黑暗的人。所以我个人认为这个光明通常是经过各种各样的自主意识的选择而构成的。无论如何，选择决定了你是谁，如果你没有做过真正的选择，如果你没有做过大量的选择，你的人生可能还没有真正展开。\n\
    \n- 推荐阅读：\n  - 亲笔信｜心理学课同学们亲启\n  - 辞典｜心理学课核心知识（一）\n  - 辞典｜心理学课核心知识（二）\n\n![](img/1c8805f81e6502071128412767cb1966_165_0.png)\n\
    \n![](img/1c8805f81e6502071128412767cb1966_165_1.png)\n\n# 书单 | 心理学课推荐好书\n\n请选择音频文件\n\
    \n武志红\n\n## 专业类\n\n### 《动机与人格》 马斯洛\n\n![](img/1c8805f81e6502071128412767cb1966_166_0.png)\n\
    \n马斯洛在书中提出了需要层次理论、自我实现理论、高峰体验理论等。本书是一部经典的、解读“人性”的著作。阅读本书，就如同在倾听自己内心的声音。它并不晦涩难懂，适合我们心理学课每一位想了解自己、了解人性的同学阅读。\n\
    \n### 《心灵的面具》 布莱克曼\n\n![](img/1c8805f81e6502071128412767cb1966_166_1.png)\n\n\
    布莱克曼结合自己30多年临床和教学工作经验，以及其自身曲折传奇的个人经历，理出了101种心理防御，完成这样一本既有教育性又富有阅读乐趣的书，讲解了人们发展某些防御的原因并提供了识别无意识防御的技巧，使无比复杂的概念和内容变得平易近人。\n\
    \n# 学习攻略 | 心理学课的学习方法与工具\n\n![](img/1c8805f81e6502071128412767cb1966_167_0.png)\n\
    \n武志红\n\n你好！欢迎来到《武志红的心理学课》。\n\n这门课程的主要内容已经完全更新完毕，这是一份学习攻略，能够帮你更好地理清课程的内容逻辑，不管你最初为什么来到《武志红的心理学课》，这份攻略都可以对你有所帮助。\n\
    \n这份攻略也可以说是一份地图，带你看看课程的整理面貌，然后你就可以开始一节一节认真学习。\n\n攻略主要分两个部分，第一部分学习方法，基于课程的内容，给你完整的图，让你心中有数；第二部分学习工具，是将得到APP的一些功能介绍给你，将这些功能和课程内容结合起来，成为一些高效的学习方法。\n\
    \n## 学习方法\n\n### 1. 从「发刊词」、「亲爱信」开始，找到坐标\n\n如果你是刚刚来到这门课程，我给您一个小建议，你可以点击下方链接，先来看一看「发刊词」，从中你会明白开设这门课程的发心和目的，以及学习课程后会为你带来怎样的收获，然后带着明确的目标开始学习。\n\
    \n一键查看：发刊词｜拥有一个你说了算的人生\n\n此外，建议你也看一看写给心理学课同学们的长信，里面系统地梳理了所有300多讲课程的结构和逻辑，你可以知道每一主题的特殊意义。\n\
    \n一键查看：亲爱信｜心理学课同学们的长信\n\n### 2. 拿好两张「地图」，理清脉络\n\n心理学课共13个主题，它们之间有着不同的承接和主题关系，所以，为你准备了一张结构图。\n\
    \n![](img/1c8805f81e6502071128412767cb1966_167_1.png)\n\n如果你是刚刚加入心理学课，可以带这张图，理解不同主题的关系，展开学习；如果你已经学完了主体课程，也可以根据这张图，去回顾复习不同主题下的具体内容。\n\
    \n此外，你还可以查看心理学课的图表（请在文末查看），主题、章节、每一讲都一览无余，有计划地开始学习或者复习。\n\n### 3. 以「复盘」为抓手，时常回顾复习\n\
    \n课程每一个主题结束后，都会进行复盘总结，可以通过复盘内容，去重温自己学到的一些知识，每一个主题都在“打包”，内化成自己的学问。\n\n如果你对某个知识点掌握不够透彻，复盘里面包含了主题中所有文章的链接，你可以去复习巩固。\n\
