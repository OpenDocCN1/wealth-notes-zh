    人同时还有开放的心态，能和事物本质建立连接的话，那就更难得了。


    保罗·斯托茨提出的挫折商是一个很好的概念，而他提炼出的关于挫折商的四个因素：控制、归因、延伸和耐力，也非常有说服力。不过我认为，挫折商的内核是一个人自我发展的成熟程度。


    # 今日得到


    +   1. 延伸，就是你是否会自动将一个挫折的挫败感延伸到其他方面。高挫折商的人是低延伸，他们知道一个挫折事件只是一个挫折事件；低挫折商的人是高延伸，他们会因为一个挫折而否定自己的一切。


    +   2. 挫折商高的人，即便灾难连连，也能看到生命中积极的部分，不被挫败感击垮，还可以超越挫折。挫折商低的人不能控制延伸，会把一件事情上的冲突和挫败延伸到其他领域，最终制造了严重的污染。


    +   3. 斯托茨认为，耐力是挫折商最重要的因素，高耐力是高挫折商的最明显特征。高挫折商的耐力是富有智慧的忍耐，是建立在洞察力、希望和乐观主义之上的。


    +   4. 格局，就是一个人的自我所构成的内在空间。一个有着坚韧的内聚性自我的人才能承受巨大压力，如果同时还有开放的心态，能和事物本质建立连接，那就更难得了。


    # 划重点


    衡量挫折商的第三个因素是延伸，指的是你是否会自动将一个挫折的挫败感延伸到其他方面，低挫折商的人是高延伸，他们会因为一个挫折而否定自己的一切。衡量挫折商的第四个因素是耐力，这是挫折商最重要的因素。高挫折商的耐力，是富有智慧的忍耐，是建立在洞察力、希望和乐观主义之上的。


