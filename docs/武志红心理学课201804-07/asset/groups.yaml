    # 创造05 | 迪士尼的策略


    **武志红**


    我这一周的主题是“征服的活力”，这是我们讲的“迪士尼的策略”。


    先要说明一下，今天的内容主要是我在美国培训师罗伯特·迪尔茨《天才的策略》课程上学习到的，并加入了我自己的一些理解。


    关于罗伯特·迪尔茨我们在之前的内容中讲到过，他是国际级的NLP大师，NLP是神经语言程序学的缩写，简来说就是关于人类行为与沟通模型的一套详细可行的模式。虽然它本身不是一套心理疗法，但常被用来了解人类的经验和行为。


    ## 将创作过程切割


    迪尔茨分析了很多天才，认为他们的创造力是有关系的，那就是他们的工作模式。迪尔茨认为迪士尼的创始人华特·迪士尼，他的策略是“将创作过程切割”，给每个关键部分一个单独的空间。


    后来，在创作演讲中，迪士尼把迪士尼团队的工作流程分成了三个阶段：梦想家、现实主义者和批评家。在想象家阶段，大家可以无拘地启动想象力，并且不必考虑是否实际，也不允许有批评；到了现实主义者阶段，才开始考虑如何实施的问题，同样也不允许批评；直到批评家阶段，才开批有批评。


    实际上，我们每个人得思维过程都包含着这三个部分，只是普通人的这三个部分经常是混在一起的。导致我们每一个部分都没有充分发展的空间，例如你设置一个梦想，可现实主义者的小偷同时担心，这能实现吗？甚至不能被批评者的那部分，你根本没实现了你的梦想。


    同样的，你也很想做一个尽兴的批评家，你这时的梦想家角色可能会跳出来发，你可以这样想象，你可以没有想象力的家伙，你可以知道你在我冷漠没劲，而现实主义者就会说，你如不知道我有多辛苦等等。


    这三个角色混在一起，一个人的思考就会变得混乱，一个人团内的焦虑与思考是混乱，而将这三个部分切开，使每个角色有独立的空间，这种混乱就会大为改观，并且在每个独立的范围内，这个空间负责的那一部分就会充分发挥。


    现实中，迪士尼公司也是这样工作的，专门设置有一个“梦想家”，在这个房间工作人可以尽情想象，而不允许有任何批评。


    ## “迪士尼的策略”练习


    迪尔茨把迪士尼的这个策略进一步细化，提出了一个非常有操作性工作方式，也非常简单。


    这里要介绍一下迪尔茨的基本工作方式。作为培训师，他在做培训时的技巧可以是把我们的内心形象外化，接收到空间，然后在这个空间里内，并得以改变。这里的空间，就是实实在在的物理空间。


    他的工作中，常用纸巾来标记空间的名称，之所以用纸巾，是因为纸巾到处都有，很好找。例如，我们在学习“迪士尼的策略”这个练习中，如果每个人接受迪尔茨他训练时，他会选一块空旷的空间，然后拿四张纸巾，放在地上，并且纸巾之间取大约一步的距离。


    是非常棒的练习，如果你是一名培训师，或者是老师之类的角色，你可以试试去做这两个练习。


    我们也可以掌握其中的精髓，今天的精髓就是如果在梦想的阶段，把批评的声音彻底拿开，那会是一种什么样的体验呢？


    迪士尼公司有一个“梦想室”，这个办法你是否也可以借鉴呢？例如，给自己一个“梦想日”，在梦想日里，你不允许任何批评，就是天马行空地去放纵你的梦想。


    ## 今日得到


    - 1. 迪尔茨认为迪士尼的创始人华特·迪士尼的策略是“将创作过程切割”，分割成梦想家、现实主义者和批评家三个阶段，给每个关键部分一个单独的空间。

    - 2. 全然地投入到自己的梦想中，现实层面的收获如钱权名利，都会像副产品一样自然而然涌来。而如果试图把它们变成主要目标，会感觉通向更大存在的通道被卡住了。

    - 3. 最重要的一环是“梦想家”这一角色。如果我们的梦想真正能与更大的存在相连，便会产生匪夷所思的动力，创造力也由此而生。精髓就是在梦想的阶段，把批评的声音彻底拿开。


    ## 划重点


    > 迪士尼创始人华特·迪士尼的策略是“将创作过程切割”，分割成了“梦想家”、“现实主义者”和“批评家”三个阶段，并给每个关键部分一个单独的空间。如果梦想真正能与更大的存在相连，那时便会产生匪夷所思的动力，所谓创造力也会由此而生。


