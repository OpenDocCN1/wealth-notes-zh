    # 创造04｜最朴素的创新方法


    ![](img/1c8805f81e6502071128412767cb1966_10_0.png)


    **武志红**


    我们这一周的主题是“创造，来自臣服”，今天是第四讲“最朴素的创新方法”。


    本周的前三篇内容都非常走心，从留言中可以看出很多用户受到了触动，今天这篇内容我来给你们讲一种最朴素的工作方式，它最容易掌握，但也最容易被忽略和偏离。当你能在一个领域使用这种朴素的工作方式时，相信你会受益匪浅，甚至可能会成为伟大的人。


    此前，在专栏之前的问答《身心合一是一瞬间，准备是王道》中，我讲过仅次于巴菲特的另一位“股神”彼得·林奇，他说过一句很嚣张的话：


    > 即便格林斯潘告诉我明天的财政政策，我也不会丝毫调整我的选择。


    他提到的这位格林斯潘是美联储前主席，这么嚣张的话越是建立在非常朴素的工作方式之上的。每当林奇对一支股票感兴趣，他就会花大量时间做丰富的调查研究，要全面了解这家公司，然后才会做决定。


    创造，来自于臣服于真实。彼得·林奇的这种朴素的做法，意味着他的决定都建立在对真相的了解之上，因此他和他的公司都有了伟大的创造力，能创造出巨大的财富。


    彼得·林奇毕竟是离我们太远的事，我讲一个真实故事。去年下半年我认识了一位精英企业家，去年他的企业营业额50亿，纯利润5亿，并且他的公司蒸蒸日上，近几年的增长率都在40%以上，在所在的细分领域也是当之无愧的国内市场No.1。


    他的公司正好是十年前创办的，当时他们有三个合伙人。这其中起到关键作用的是他和另外一位合伙人，他们谈了一次话就决定创办这家企业，两个人都有闪电般的行动力，所以迅速就注册了公司。


    接下来，他们干了一件很慢、很朴素的事，他们三个合伙人花了一个月的时间，对一百个他们认可的潜在客户做了深度访谈，并对深度访谈做了统计分析，最终发现这个市场有四个核心需求，然后他们就围绕着这四个核心需求，设计了公司的各个层面。现在十年过去，大量事实显示这个市场的准确（需求）就是这么四个核心需求。


    必须要交代的一件事是，这三位合伙人当时都是业界大牛，在各自领域都有非凡的影响力，他们的时间可以说是很值钱，但他们硬是慢了下来，花了一个月时间做这样一个调查，并通过这个调查，抓出了事情的本质。


    他们这种做法让我佩服之至。该快时，他们迅速如闪电；该慢时，他们也能这样慢下来。


    创造力，或者说伟大，需要建立在真相之上。有的人是通过天才的洞察力，洞察到了所在领域的真相；有的人是因为正好他的个性化生命体验，和一个时代的机遇体验联系在一起，因而也就触碰到了所在领域的存在；像这位精英企业家，是通过这种朴素的调查抓住了真相，他们的这种做法我们都可以学习。


