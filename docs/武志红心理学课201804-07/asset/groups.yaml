    +   2. 弗洛伊德认为人有两个思维过程：初级思维过程和次级思维过程；初级思维过程的 语言是图像，次级思维过程的语言是文字；图像可以视为存在，而文字则是存在
    的符号系统。


    +   3. 初级思维过程的问题是难以沟通，如果 一个人陷在这个状态，就可能会出现精神问题；次级思维过程可以很好地和其他 人沟通，但问题是它其实是符号系统，
    而不是存在本身，太依赖它，思考就可 能会缺乏生命力，甚至都不能触碰到真实存在。


    # 划重点


    罗伯特·迪尔茨认为天才们的思维模式 是可以模仿的，虽然模仿者未必能 达到他们的级别，但使用他们的思维模 式会让人受益。以图像为主的初级思 维过程会导致难以沟通，以文字为主
    的次级思维过程可能会导致思考缺 乏生命力，不能触碰到真实存在。头脑 和思维层面的自我1，会将我们切割 开来，但身体和潜意识层面的自我 2，可以产生连接。


