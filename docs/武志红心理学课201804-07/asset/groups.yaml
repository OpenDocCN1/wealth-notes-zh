    # # 复盘：关于“自由”和“无常”主题的回顾


    武志红


    我们的心理学课从第一讲到现在，讲述了十三个主题，分别是“命运”、“自信”、“关系”、“动力”、“思维”、“身体”、“情感”、“觉知”、“空间”、“创造”、“现实”、“自由”和“无常”，这节课我们来一次复盘。


    我之所以把“自由”和“无常”两个主题放到一起来说，主要是因为这两章的内容很接近，其实其可以合为一个大主题叫做“流动”。


