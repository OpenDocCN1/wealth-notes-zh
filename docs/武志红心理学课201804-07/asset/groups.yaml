    之所以如此，我个人认为从心理学的角度


    来看，是因为头脑和思维层面的自我1，将我们切割开来，但身体和潜意识层面的自我2，或者更深 的部分，我们都是可以连接在一起的。爱因斯坦对此也有深刻的表达：


    一个人是被我们称为所谓"宇宙"的一 部分，受时空限制的一部分。他会觉得他 的思想与感受和世界其他部分是割裂 的，这是他的意识的一种错觉。这种错 觉是我们的牢笼，将我们的欲求和情感
    限制在少数一些和我们亲近的人当中。 我们必须将自己从这个牢笼中解放出 来，拓宽我们的胸怀，去拥抱所有生灵 和整个世界的美，这是我们的使命。


    所以，当我们将自己限制在自我1 的范畴 时，我们就像是切断了和整个宇宙 的联 系，因此创造力也会受损，但当我们 将自己打开，与其它存在乃至整个宇宙连 接时，更多的水流就会经由你而来，我愿意将这个称为创造力。


    # 今日得到


