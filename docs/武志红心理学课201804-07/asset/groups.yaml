    \n在问答中，我特别强调了偏执分裂位不等于低级错误。在我们整个心理学课程中你都可以看到这种哲学：没有哪一种人性，是错误、糟糕、低级、该被消灭的，它们实际上都是完整人性的一部分。只有在这种理解下，我们才能自由地让生命力流动。\n\
