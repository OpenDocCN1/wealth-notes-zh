    \n### 自由01 | 自我实现者的人格特征（上）\n\n武志红\n\n我们将这一讲的主题是“自我实现”，人们给你讲一讲最近“自我实现者的人格特征”，这一讲是第一讲。\n\
    \n我首先来介绍一下人本主义心理学家马斯洛的研究方法。\n\n与精神分析一开始接触的多是心理问题患者不同，马斯洛多是直接研究478位杰出人物，比如林肯、杰斐逊和爱因斯坦。马斯洛认为他们就是自我实现者，他的研究对象也包括一些普通人，被称为自我实现者或可能的一些真实者，马斯洛的具体研究方法会分析他们的来信、作品等各种资料。\n\
    \n讲到这里必须要澄清一下，有不少人认为精神分析治疗的是病人，但即便在弗洛伊德那个时代，也不完全是这样，而现代社会能够接受功能欠缺的经典精神分析治疗的人多是高收入人群，弗洛伊德的来访者有很多成功人士，他们中至少有十多位，将他们接受弗洛伊德分析的过程写成了书。读取他们的书，你会发现有的病情不轻，但还真不能诊断出他们有什么严重的心理疾病。\n\
    \n同样的，像林肯、杰斐逊和爱因斯坦这些人，如果给他们做深度精神分析，他们一样是有各种问题。可以说，每个还没有像毛姆那一半开悟的人，都必然有各种各样的心理问题，而且仔细研究的活述都不同。\n\
    \n像日本一位精神分析大师，他始终认为精神分析是放羊的人，他一生中也只接受了几百位来访者，其中十几人坚持了他一辈子，到了后来，这些来访者也没有达到诊断标准心理疾病，还继续接受精神分析，就是为了更正面深入地解问自己。\n\
    \n再回到马斯洛这里，我们先界定一下什么是自我实现，也就是那些成为了自己的人。不过这个说法还是容易引起误解，我们比较容易说的是一个更简单的理解，就是拥有自主人格的人，他们自己决定自己，自己为自己负责。\n\
    \n自主人格，能一方面活在实中，他们生命力会充分看见，这部分生命力也因而更成熟，这会带来一些好处，让他们既能深入地理现实界，又能真诚地看待自己，他们的自我和谐，具备B认知的人，他们与世界的关系更为密切。马斯洛则认为，真正自主的人具备14个明显的人格特征，我们一一讲述下，这节课先讲前七个特征。\n\
    \n#### 一、准确和充分地认识现实\n\n马斯洛将人的认知能力分为两种：B认知，也就是存在认知（Being Cognition）；D认知，也就是匮乏认知（Deficiency\
    \ Cognition）。\n\n具备B认知的人，是现实怎么发展，就怎么认识，不会按照自己的想象，想象或愿望去认识现实。不自卑是具备B认知的人最明显的特点。相反，具备D认知的人，是按照自己的需要、想象或愿望去认识世界。\n\
    \n我们之前在课程中讲过“花轿子摸黑的信号”，这是讲的一位只听到消息的国王，这个故事是经典的B认知。这位国王有一种天真的逻辑：如果大家报的都是好消息，那么就会有好事情发生。\n\
    \n我再来举一个真实的案例。有一位大学生，毕业后没有找到工作，到一个偏僻山区的伐木场做工人。他发愤图强，每年都考研究生，可每年的学校和专业，北京大学、人民大学、吉林大学，都不一样在变化。他几乎考得非常多，但学业成绩不升反跌，关键的科目竟然一年比一年分数低。\n\
    \n为什么会这样？因为他对考研一信心都没有，他只是借考研这种事情让自已和身边人知道，他是有上进心和远大理想的人。但他不清楚他的D认分形势，按实力报学名，而且每年都不切实际地报学名，名专业，甚至在复习时也毫无方法。他甚至不查他所报专业今年的参考书是什么。\n\
    \n这是典型的D认知，因为内心想什么，就会是什么，而且会根据自己的想法来行动，而不是根据现实来行动。因为需要自信，所以他对别人和自己说，他一定能行。\n\n\
    寓言故事《皇帝的新衣》中的小男孩，到了宣传现实者，这是最能识B认知的，有B认知的人不会因为任何原因改变自已对事物的原认识。所以，可以说B认知是自主人格的基石。\n\
    \n#### 二、宽容而又嫉恶如仇\n\n具备这种人性格特征的人能看到事物的两面性：一方面，他们深刻地理解人性的善弱，具备高度的宽容；另一方面，他们对人性中的恶意有高度敏感和抵触。\n\
    \n例如王小波，他的作品既幽默又性弱态描写得入木三分，善或似恶似悲无人留下。但同时，他的作品中又有无限尺的宽容。\n\n#### 三、对自己的体验全然敞开\n\
    \n具备这种人性格特征的人，对自己的内心体验全然敞开，自然地表达情绪和思想。他们坦率，自然，也不落入俗套，而且按照本心去行动。\n\n#### 四、以问题为中心，不以自我为中心\n\
    \n具备这种人性格特征的人，他们为工作而工作，而那些非自我实现者，是为生活而工作。\n\n以问题为中心的人在做事时，非常投入，把事业，为业自身而吸引，而不是当把事业当成职业，或者赚钱权力者相当主要目标。非自我实现者则正好相反，他们也也许会热爱事业，但求去的是非事业本身，而且是了产品目，比如说别人，赢取社会经济地位，甚至变态地要求其他人服从自己。\n\
    \n在工作中，自主者总是新息不断，创新仿佛总是信息来自，这也是因为B有B信念，而不是D认知。\n\n#### 五、超然独立的性格\n\n是指具有独处与独立的强烈需要，自己就判断，不依赖别人。\n\
    \n#### 六、不迷信权威和文化\n\n是指权威和文化对他们没有压力，不随大流，不受制于文化环境、权威而被动选择。\n\n#### 七、清新隽永的鉴赏力\n\
    \n具备这种人性格特征的人像是没有“审美疲劳”，能永恒地，惊奇和愉悦的心情体验并鉴赏一生中所遭遇到的各种事情，并频频产生“高峰体验”。\n\n在这里简单解释一下高峰体验（Peak\
    \ Experience），这是马斯洛在他的需要层次理论中创造的一个名词，是人类最需要的需求，人类在越接近自我实现的高处体验越迷人。这是越主要和愉悦的情感。高峰体验指在人在追求自我实现的过程中，基本需要的短暂、满足到，自我实现时那种感受到的短暂、满足、极乐的感觉。这是一种始于顶端、超越时空、超越自我的满足与完美体验。\n\
    \n在高峰体验时，人会产生一种存在认知，这与一般的认知不同。这种体验仿佛与宇宙融合了，是人类自觉的顶点时刻，是超越自我的，忘我的、无我的状态。\n\n马斯洛归纳了高峰体验的六个特征：\n\
    \n1. 产生的突然性；\n2. 程度的深刻性、强烈性；\n3. 感觉的审美性；\n4. 存在的普遍性；\n5. 结构的一致性；\n6. 时间的同一性。\n\
    \n高峰体验其实是“我的品质与其它重要的高B本质的联系”。马斯洛对此提出了B价值和D价值的概念。\n\n所谓B价值，就是存在价值。自主者既理解自己，又理解别人和自然，他们能以孩子般的心态欣赏一切，可以看一看日日落而不厌倦。\n\
    \nD价值，就是匮乏价值。非自主的人需要别人和物品满足自己，我们根据这些需要给他人和对象定义上了一些意义。当需要消失时，别人或物品对其而言具备的价值也就消失了，“审美疲劳”也心而生。\n\
    \n**今日得到**\n\n1. 自我实现就是那些成为了自己的人，自我实现者是拥有自主人格的人，他们自己决定自己，自己为自己负责。\n2. 自主人格者是充分把自己活出来的人。当“我”被充分看见后，也就能看到“你”的真实存在了，可以很好地看见别人和外部世界。马斯洛认为，真正自主的人具备十四个明显的人格特征。\n\
    3. 自我实现者与非自我实现者的最大差别是，前者可以臣服于其他人和其他存在的真相，而后者则陷入在自己自恋的想象中。\n\n**划重点**\n\n![](img/1c8805f81e6502071128412767cb1966_95_0.png)\n\
    \n![](img/1c8805f81e6502071128412767cb1966_95_1.png)\n\n### 自由02 | 自我实现者的人格特征（下）\n\
    \n武志红\n\n我们再一单的里主想是“自我实现”，我们分两次讲自讲和自实现者的人格特征，这是第二讲。\n\n上以讲中，我讲了马斯洛自我实现者人格特征的前七种，这节课将讲讲后七种。\n\
    \n之前我讲到，马斯洛的七层需要分为两大类，较下层的前四层称为基本需要，也称为匮乏性需要。关于匮乏性需要，我再多为你讲一点。\n\n在马斯洛的需要层次理论中，当基本需要没有得到满足时，人的心理能量会集中在追求这些基本需要上，如生理需要、安全需要等重复重现，对它们的追求就成为第一位的，生存便没有到生所存性。也就是说，当死生成或压力或张力后，对生存资源需求就成为最渴求的东西。\n\
    \n需要层次理论没有解释力，那也也从精神分析的角度来说，匮乏需要、匮乏认知和匮乏价值。我做咨访者以后发现，一些心理和现实功能发展程度很低来访者，会存在这个问题。他们认为这个世存在符合他们的想象，由于他们不能现实，总是把自己的想象加在现实之上。\n\
    \n例如，有一位女士，她的人际关系一直糊态，因为她有着这样的心理逻辑：\n\n1. 我需要爱，所以别人必须要我；\n2. 不爱你，我就恨你；\n3. 恨一个人，我表达愤怒；\n\
    4. 我不表达不，因为人人都应该爱我，他们不需要，我就爱伤去。\n\n想信你可以一眼看出这个逻辑里的问题，别人没有爱你的义务，而你动不动就愤怒，很容易破坏人际关系，刚才这个例子中女性来访者就没有朋友。她能是认知现实是是么回事，不然就没有咨询的问。她知道，自己总不动就爱愤怒攻击别人，导致人际关系实在太太，而问题了一系列问题，每当谈到这个问题，她就会说：“我不是需要爱吗？什么他们就是不能满足我呢？”\n\
    \n马斯洛将匮乏定义基本需要的匮乏，基本需要有：生理需要、安全需要、归属与爱的需要等归属。这位来访者所匮乏的，可以说是自由需要。不过，我认为是马斯洛调查研究法并不能解释其中的匮乏或现，而精神分析可以出很精确解释。\n\
    \n在精神分析理论看来，这位来访者或处在最原始的未自态之中，她认为自我需要获得满足，否则就会生出负性情绪。同时，她觉得世界应该有一个可以满足的客体，就像婴儿幻想应该有“完美乳房”，可以满足他的所有需求。\n\
    \n这位来访者最开始得到的满足太少，于是她不能从现实中，而必须活在自己的想象中生存，幻想可以满足，而现实只会让她感到绝望般的匮乏。\n\n从这个角度讲，那些能活在认知和存在价值中的人，因为他们的基本需要满足，于是不再执着。当然，很多人处于一种临界点上，这时，爱和适度的满足，可以帮助他们从匮乏认知和价值，过渡到存和存在的价值中来。\n\
    \n讲这些，也想对还不是自我实现者用户说：别着急，慢慢来。\n\n好，接下来我们将讲马斯洛总结的自我现者十四个人格特征的后七个特征。我写一下，分别是：\n\n\
    1. 准确和充分地认识现实\n2. 宽容但又顺从\n3. 对自己验全自然开\n4. 以问题为中心，不以自我为中心\n5. 强烈独立的性格\n6. 不迷信权威和化\n\
    7. 清新完整的鉴赏力\n8. 真切的社会情感\n9. 深厚的人际关系\n10. 民主风范\n11. 高度的道德感\n12. 批判精神\n13. 接受模糊状态\n\
    14. 高创造力\n\n样子，他们就看到什么样子，这是自主者之所以有创造力的最根本原因。\n\n马斯洛认为，他们之所以如此，多半要追溯到他们无畏的性格。这要分两个方面：\n\
    \n一方面是对外界：自主者既不随大流，也显然缺少对文化的顺从态度。他们不害怕别人会说什么，要求什么，笑话什么。因为他们不太需要依赖别人，所以也较少被他人所左右。并且，他们不敌视他人，相反会理解他人。\n\
    \n另一个方面是对体验：更重要的是，自主者不害怕自己的内部世界。他们的自我更和谐，更能接受自我。他们敢于直面内在自我，同样也敢于直面外在现实，这使得他们的行为更有自发性，而比较少控制、压抑、规划与设计。\n\
    \n自主者不怕自己的思想，即便它们是“古怪的”、糊涂的或疯狂的。他们不怕被笑话，不怕得不到赞同。他们能让他们的自我通过情绪流露出来。相反，普通人和神经症患者用围墙挡住危险，并控制、抑制、压制、镇压他们的自我，他们苛责自己的深邃自我，并且期望他人也这样做。\n\
    \n对自主者的这种特质，马斯洛曾做过以下描绘：\n\n> 自主者并不忽视未知的东西，不否认它或躲避它，也不力求制造假象好像它是已知的，他们也不过早地组织它、分割它或对它分类。他们并不依赖熟悉的事物。他们对真理的探索，也不强求确定、保险、明确和有条理……\n\
    \n当整个客观情境有这种要求时，自我实现的人们可能安于无秩序的、粗线条的、混乱的、混沌的、模糊的、有疑问的、不确定的、不明确的、近似的、不严格的、不准确的状态。\n\
    \n我认为这就是自在，也是对自发性的信任与尊重。\n\n**今日得到**\n\n1. 马斯洛将匮乏定义为基本需要的匮乏。当基本需要处于匮乏时，人的心理能量就会集中在追求这些基本需要上。\n\
    2. 那些能活在存在认知和存在价值中的人，多是因为其基本需求被满足了，于是未必再执着。很多人处于临界点上，认知和适当的满足就可以帮助他们从匮乏认知和匮乏价值，过渡到存在认知和存在价值中。\n\
    3. 自我实现者能看到自己、他人和世界本相，事实是什么样子，他们就看到什么样子，这是自主者之所以有创造力的最根本原因。马斯洛认为这多半要追溯到他们无畏的性格。\n\
