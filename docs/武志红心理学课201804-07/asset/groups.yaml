    ## 问答：胃部的隐喻


    这一节我要回答一个比较麻烦的问题。


    我想说，关于这个问题，有很多复杂的、微妙的面向。


    首先，我希望大家能够记住：我们身体的任何一个部位，都不只是一个物理意义上的“器官”或“组织”。


    它们同时是我们情感的“容器”和“表达者”。


    比如，我们经常说“我胃不好”，这句话背后的潜台词往往是“我承受不住了”或者“我很焦虑”。


    胃部位于我们身体的“中心”，是消化食物的地方，在心理层面上，它对应着我们的“接纳”与“消化”能力。


    我们每天都在“消化”各种信息、情绪、人际关系、工作压力……


    当我们摄入的信息太多、太复杂，或者是我们内心对某些事情感到“无法消化”时，胃部就会发出信号，比如胃痛、消化不良、胃胀等。


    举个例子：如果你在工作中总是被迫接受自己并不认同的观点，或者在人际关系中一直在“吞咽”委屈，你的胃就可能“抗议”。


    所以，下次当你感到胃部不适时，除了去看医生，也请试着问问自己：


    > “最近有什么是我‘吃不下去’或者‘无法消化’的吗？”


    可能是某段让你痛苦的关系，可能是某个你不想面对的任务，也可能是某种你压抑的情绪。


    胃部的隐喻提醒我们：真正的健康，不仅是生理的通畅，更是心理的“畅通”。


    只有当我们学会选择性地“摄入”、勇敢地“拒绝”、有耐心地“消化”时，我们的身心才能真正地和谐共生。


    处于不错的状态，但始终有一种空虚感，最近看到这么一句话"成功的反义词不是失败，而是平庸"，就让自己更焦虑了，兴趣爱好很多，而且热衷于不同生活体验的人，如何发现自己内心深处的好并专心不移把它做成一个不枉此生的作品呢？还是可以不出做出一个作品，活着开心舒服就好呢？


    我的另一个问题是，我有一位师姐是一个很有主见的人，想结婚但不肯将就，单身很多年，前几天告诉我肯做好准备好自己一个人过以后的生活了，她也很耿直，喜怒都写在脸上，也顶撞过领导，按理说应该就是内心开放活出自己的人，但在我眼中她也没活出精彩，活出很有创造力的人生，这是为什么？


    武志红


    我想先说第二个问题，你的师姐很可能是惧怕关系，于是不敢进入到婚姻中，如果真的是这样，那就是一种巨大的空虚。


    再说第一个问题，既然你都感觉到空虚了，那你可能需要为这个做点什么了。幸福是投入地去爱一个人，投入地去做一件事的副产品。如果我们直接追求幸福，而不敢投入，那就会有种空虚感。


    每到过年，老人就会生病住院。想到去年也是这个时间节点，也是这个病征，结果很多亲戚朋友来探病。老人很满意，觉得大家没有忘记自己，很有存在感。那么，今年老人又是在老时间旧病复发，难道是缺乏安全感，导致以躯体不适的方式来增加自己的控制感吗？


    武志红


    我个人认为你的判断是正确的，这位老人很有可能是不能直接用语言去说，表达他希望对过年的时候得到陪伴，于是用生病去表达这个意思。


