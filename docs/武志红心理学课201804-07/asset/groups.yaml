    # 预告：创造，来自臣服


    预告：创造，来自臣服


    武志红


    这是我们专栏的第四十周，这周我们进入新的大主题模块“创造”。第一周主题是“创造，来自臣服”。


    在之前一起的预告中我讲过，我研究生时编过7本书。其中一本是讲创新思维的。依照这本书的基本逻辑，创新可以有一个固定的思维模型，按照这个模型去思考，就可以产生创新。


    据说这本书当时卖了50万册，但我作为编者实在不服。不服，首先是一种感觉，我很抵触这种说法。其次，我有个人的例子为证。心理学中有一些关于创造力的测验，不管哪个测验，我做测试的时候，我的创造力都是满分或接近满分，然而我实在不觉得我是按照一个思维模型去思考的。


    我上学时，有一位老师曾说，她认为任何一种心理疾病的治疗，都可以找到一套行之有效的模式，她的愿望就是找到这些模式。当时听她这么说，我就想如果有一天，我的思想和生活都模式化了，那还不如死去。


    虽然对些说法很抵触，但我并不清楚创造力到底从何而来。直到在广州日报开始写心理专栏后，我逐渐认识到创造力是因为臣服。


    我个人觉得，创造力并不是你的大脑强大思维的结果。实际上，思维能力再厉害，也没有创新能力。人一旦爱上自己的思维，以及一些固有想法，这就是“向思维认同”，很可能就失去了创造力。


    那么臣服是向什么臣服呢？我认为是向超越头脑自我的伟大存在臣服。我觉得在任何一个领域有创造力的人，都是因为他们臣服了这个领域，因此捕捉到了这个领域内的存在本身。


    我们一再谈到自恋，但创造力其实常常发生在自恋破损的时候，因为那时候你的心灵有了裂痕，而光，就可以照进来了。


    我们来分享一首普米的诗：


    > 鸟儿的歌声纾解了

    我的思念。

    我像它们一般狂喜，

    却苦不懂得倾吐。

    宇宙的灵魂，求求你，

    让歌声或什么东西，

    自我体内流泻。


    武志红


    本周的洞点是：你如何看待创造力？你最 有创造力的时刻是怎么发生的？你会有意识地制造条件去展现自己的创造力吗？欢迎你将观点写在留言区。


