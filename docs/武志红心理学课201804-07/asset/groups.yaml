    \n## 现实 10 | 金钱与嫉妒\n\n武志红\n\n我这个单元的主题是“金钱的隐喻”，这是第三讲，题目是“金钱与嫉妒”。\n\n这本书讲到一个很重要的概念“嫉妒”。琼森，是我奥林匹亚精神分析师兰尼·克里斯提出的概念，她有一本书，书名就叫做《嫉妒与思考》，专门来论述这个概念，这本书是一本极好的书。不过对于非专业人士而言，可能太艰涩了一些，所以不是特别推荐。\n\
    \n嫉妒，听上去很像我们所说的“羡慕嫉妒恨”，但它其实有很特定的含义。它的英文是 envy，意思就是我有个东西，我也想要拥有，可我想要那个东西我也没有，所以只能跟剥夺它，可惜嫉妒存在，于是觉得拥有了它，于是想毁灭它。它带有破坏性，同时它也把自己给毁坏了。\n\
    \n昨天讲的故事中，其实都是在讲嫉妒的故事。如果嫉妒在现实世界中不是那么常见的存在，那么，在潜意识里对拥有物的人会很嫉妒，担心别人会过来掠夺它，毁掉它，同时它也把自己给毁坏了。\n\
    \n“嫉妒是深刻、最根本的一种死能量”\n\n嫉妒的根本在于我觉得我创造不了也拥有不了好東西，同时，受全能感受的支配，我不想落后，那怎么办？办法是光嫉妒你好东西不行，因为光嫉妒仍然感觉有所不如，那就最好把你好好东西夺过来，连同创造好东西的东西一并毁掉，这样我就比你高，比你强了。\n\
    \n原来我一直理解不了，为什么历史上改朝换代的时候，项羽一定要毁掉宫殿？当理解了嫉妒这个概念后，我觉得自己找到了答案，这应该算是嫉妒。你创造了宫殿，不厉害？不，就是我想我本就能创造这个宫殿，看你拥有它，我就有自卑，觉得你比我强，严重伤害了我的“全能感”，那干脆就毁了。\n\
    \n原始的嫉妒必然是发生在母亲与婴儿之间，精神分析家认为，母亲有一个丰盛的乳房，才是“真正的嫉妒的对象”。这个说法源自弗洛伊德，这里的意味就是极为美好的地方。当婴儿与母亲不能建立起连续时，母亲的这份丰盛与强大产生严重威胁，伤害了婴儿的全能自尊。\n\
    \n常与嫉妒相伴的是贪婪。不过，贪婪还是要比嫉妒专一一点的属性，因为贪婪的意思就是要抢夺占有你的好东西，所以我并不想毁掉它。\n\n羡慕，更是一种高级层次的人性了。你有好东西，我在另一方面却强于你，我羡慕，但多少知道我和你有边界，我不会去毁掉它。\n\
    \n如果一个社会和文化中，嫉妒过于浓烈，金钱恐惧或者说强大恐惧症就会很常见。至于一个群体或个体，拥有强烈的嫉妒，即会导致这种恐慌症。\n\n例如，嫉妒、吃醋等故事似乎是关于女人的，看起来，好像女人的嫉妒更强厉害，但这是错的。我们承认嫉妒的根本原因是，现在基本上还是男性社会，女性还没有完全真正得到平等的待遇，还有一些女性在金钱获取上受到压迫。相对而言，男性被允许拥有“强大”这个最美好的东西。\n\
    \n而且，在某些情况下，女性对财产权也不能很好地掌握，例如女性没有拥有土地的权利，也许是因为自己母亲的影响，于是，嫉妒的本身使“我的创造也拥有了好东西”，在女性身上不会强过男性，但也显得比男性的“羡慕嫉妒恨”要柔和一些。但是，不可忽视的是，最原始的嫉妒就是婴儿对母亲乳房的嫉妒。\n\
    \n我在和我的精神分析师说我的金钱恐惧症时，我需要谈到我的收入、影响、名和地位，这时他会问我：“你谈这些的时候，在我和你之间，也显现了你比我有钱，你比我强这种感觉，这带给你什么感觉？”\n\
    \n最初这样回答他的时候，我全觉得自己像“性心理”这种感觉，我全觉得不像在谈数字和客观事实。后来我逐渐看到，其实这些有时是有一些不安的，再后来看到这些不安背后是一些恐惧，当我意识到我也在我的分析面前争什么，而一旦涉及到金钱名利这些现实世界的东西，我即退缩了，我觉得这些都是假的。\n\
    \n我会注意到——当谈到这些东西，我就会屏蔽掉情绪感受，也就是三种心理过程，情绪过程，貌似只剩下理性的思维过程，可是我的身体就“出卖”了，这个时候，我的身体都会显得有点僵化，这是一种自动的举动，这样是在向他表达距离。\n\
    \n因为对钱这种恐惧，金钱或利益打击就是一种很高级的谋杀。我们看互联网上流行的一句玩笑话：“何以解忧，唯有暴富。”但我觉得实际上暴富未必是一种祝福。\n\n\
    我们上一节课程中讲到，美国的一项调查显示那些在彩票中大奖的人，75%的人五年内破产，这方面的故事和研究有很多。例如个别方面的农民因为中彩票获得巨额奖金，却因暴富后的后半生，因自杀和患重病的人就高达21%还死了一百多人的案例。有些人觉得算是暴富的一种“诅咒”，钱真的是可以毁害人的力量的东西，可一下子暴富的人，还没有学会如何和金钱打交道，驾驭不了，反而被它控制住。\n\
    \n嫉妒的根本在于将创造不了也拥有不了好东西，连同创造者一并摧毁掉，以此显示自己的力量。暴富未必是一种祝福，因为它突然增强了人的自恋，也引发了自己内心对嫉妒的恐惧。所以一下子暴富的人没有学会如何和金钱打交道，驾驭不了它，反而会被它所控制。\n\
    \n- 推荐阅读：\n  - 现实 09 | 金钱恐惧症的核心恐惧\n  - 现实 08 | 金钱恐惧症\n  - 现实 07 | 强与弱、善与恶\n\n\
    ## 加餐：升级你的生命尺度\n\n我讲这个单元的专题是“金钱的陷阱”，这是个非常著名的加餐课程，题目是“升级你的生命尺度”。\n\n人，是万物的尺度。古希腊哲学家普罗泰戈拉如是说。而有这样一句话：你的感知，就是丈量你自己命运的尺度。\n\
    \n我来先给你讲一个故事。我的一位来访者，是个超级宅女，她有一些轻度的强迫症。例如，有一次她在淘宝上看到 2.9 元一打的圆珠笔，感觉两打，还都有几支笔真是超值，非常划算，可以，她本来十块圆珠笔都没用完。然后她买不买呢？所以她再考虑了一整天，会怎么样？但就是，她想：“我的钱太少了，花了两块九就少了两块九，万一下周急需买笔的时候呢？”她就这样思考了一整天，最后才出了一个最佳的选择。必须要交代的是背景，她没有工作，家庭也比较不富裕，她是在花自己积蓄，并且积蓄也确实不多了。\n\
    \n在我们的咨询中，她特别想和我探讨怎样才能是一个最优化的选择。可是只要她一和我探讨，所谓最佳决策已经荡然无存。因为，她只要不便宜，一分价格就远超 2.9\
    \ 元。如果待时间过长的话，这样探讨也有价值，以了解她的心理机制，她就可以在未来以后的类似情境中做出更好选择了。\n\n和她探讨了许久之后，我发现她没把“时间是否值得的”这个因素考虑进去。我仔细一想，我的确是不值的，因为她一工作就一星期的时间确是少值的，哪能花一整天时间思考一块\
    \ 2.9 元人民币的选择，有一定合理性。\n\n和她继续探讨时，我想到了“选择尺度”的概念。继续选择时，我们自然都有各自的尺度。而这些尺度，有源于自己的生存体验和认知的，不同的生命感受不同和不同的认知导致的尺度感不同，然后在做选择时就会有不同的选择，因此也导致了不同的人生命局。\n\
    \n像我的这位来访者，她曾经考虑过一份工作，月薪为 3000 元，她觉得太少，不足以改变她的人生格局。可是，一旦她有了这样一份工作，考虑到每月一般会有 22\
    \ 个工作日，那意味着她一天会有一百多元的收入，而那边再遇到 2.9 元一打的圆珠笔时，她的选择尺度就会发生变化。\n\n有些人有清晰的变化，会这样思考：我一天都会挣一百多元，所以我拿一天去思考一个\
    \ 2.9 元的选择就是，非常不值的。即使没有这样的清晰概念，你也不是在这个框架下产生的，你仍然会有不同的选择尺度。\n\n这样说，还因为这个来访者不是典型的强迫症，她的思考只是一种现实性焦虑，如果是典型的强迫症，那么控制性的不安感，而不是她自己认知不到的潜意识，这样分析就意义不大了。\n\
    \n从 2015 年下半年起，我坐飞机时，差不多就只坐头等舱了。讲清楚的是五星酒店店，这点令我无法去讲座的标配。刚开始这样做时，我一样有焦虑，觉得自己自己在浪费钱，虽然我身形有点胖，但我感觉我基本那个胖乘客的形象就要消失了吧？下，我坐了几次头等舱后，我就接受了这件事，因为它的确有几个真实的好处：\n\
    \n- 1. 空间：头等舱有专门通道，排队快；\n- 2. 去早了，有专门休息区；\n- 3. 舒服，可以好好打电话：2016 年我做得疯狂一半，经常在全国甚至国外飞来飞去时，在飞机上就已经完成了一件重要的事。\n\
    - 4. 宽敞，可以非常方便地读书，或使用笔记本电脑。\n\n体验到这几个好处后，即便我自己掏钱，也一样会坐头等舱了。这就是衡量选择时的尺度变了。\n\n\
    形成选择尺度这个概念后，我想影响选择尺度的因素有两大类，有理性因素和心理性因素。其中的理性因素有以下几个：\n\n- 1、时间的尺度，你单位时间创造的价值越大，时间的尺度就是重要。\n\
    - 2、空间的尺度，你进入到空间越大，空间就是越丰富，这个能会你有很强的阅历与体验，这会很大地改变你的尺度。\n- 3、关系的尺度，你愿意为不同性质的关系，付出什么样的努力？这一性质我己深有体会，我见过太多，但作为“好人”，我很依赖绝人的，所以在很多方面别的要关系的时上，消耗了大量的时间金钱。现在各种事各种关系，如湖水一滴滴水，通过我不断升级拒绝别人的能力，越来越重视到底要让自己生活在什么样的关系中。\n\
    - 4、身体的尺度，还是以我自己为例，我作为“好人”，做出前端的选择不算少，其中一个因素在时是太复杂了，身体有一个轻度的肠道，让我醒悟过来，发现事情必须做出改变。\n\
    - 5、金钱的尺度，之所以把这个尺度放到最后，并非是因为它不重要，它其实是一个根本性的尺度，前几个尺度，都是和这个尺度联系在一起的。你拥有和处理金钱尺度越大，对你人性考验也就越大。\n\
    \n金钱、时间、空间、关系与身体，这是考量选择尺度的一个思想框架，它们可以合起来理解其的尺度的概念，你想改变你的人生格局，就可以在这几个因素上努力。\n\n\
