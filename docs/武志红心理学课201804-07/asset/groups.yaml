  - "[PAGE 36]\n\n# 问答：内聚性自我如何形成\n\n问答：内聚性自我如何形成\n\n+   1.  **武志红**\n    今天是我们专栏的答疑时间，我先来解释一个概念，再来回答一些用户的问题。\n\
    \n这个概念是内聚性自我（Cohesive Self），这是美国心理学家科胡特提出的概念，也有人翻译为“核心自我”，但我觉得更准确的翻译还是直译为“内聚性自我”。\n\
    \n所谓内聚性，意思就是自我的各组部分向心聚合，可以保证心灵的各个组成部分内聚合，而构成一个整体。关于内聚性自我，科胡特有这样一句话描绘：在情感的原我漩涡中，有一个内聚性自我稳稳地在那里。\n\
    \n意思就是，当一个人形成了内聚性自我后，就可以经受情绪惊涛骇浪一般地拍打。\n\n我有一个说法是，在内聚性自我形成前，一个人就像是环境的响应器，对别人的评价超在意，而努力响应自己，以争取做到环境认同和魅力。形成内聚性自我后，你仍然会对环境敏感，环境的变化会激发你的反应，但难以动摇你的根基。由此，你就可以从环境中抽身观察，抽离出一种能力。\n\
    \n内聚性自我是怎样形成的呢？它必须建立 在“我是好的”这种感觉上。这种自信态，是一种内聚力，可以将你关于自我的各种素材粘在一起。\n\n比如，对于还没有形成稳定自我的孩子来说，好父母的容错功能非常重要。所谓容错功能，就是孩子把事情做好后，认可他，孩子遇到挫败后，支持他，这也会在说你是好的。\n\
    \n反过来说也可以说，对于一个孩子动不动就进行批评，甚至一味挑错的父母，这种挫折教育，根本上会摧毁路致，会不会提高孩子的挫杵商，实际上恰恰会降低孩子的挫折商。\n\
    \n真要提升一个孩子的挫折商，就需要保护 孩子的这种基本感觉一“你是好的”。\n\n前两天，我在微博上发了一句话说：你事情做不好，都不是因为你。\n\n这个简单的句子，击中了很多大，大家纷纷感慨这句话中包含的感觉，在各种环境中太难得到了。但这其实是高挫折商的精髓。\n\
    \n# —— 本周问答 —\n\n高挫折商的人是不是更容易成为高创造性的人呢？因为背后要有个牢固的自我和足够大的容器，去承接外界三元关系的变化和各种挑战，并且可以接受汹涌而来的情感的冲击。\n\
    \n+   1.  **武志红**\n    之所以把挫折商这一周四篇放到“创造”这个大主题下，就是想把高挫折商和高创造关系有一定关系。不过，我必须先说我没做过实验研究，目前这样说只是一种假设和推想，或者说是一种个人理解。\n\
    \n更为精细地理解的话，我认为高创造力的人未必有高挫折商，但高创造力的人，如果不仅仅是靠灵光一闪，而是要完成一个产物，那么高挫折商就很重要。\n\n请问积权和消极归因是否与全能自恋有关呢？当人形成了“我是不可能”“我无能”的思想时，会更加认同世界有其有序的规律，而当遇到了存在“规律”这个框架下可以解释的攻击时，就会减少自己与外界的攻打。相反的，具有全能自恋的人，在遇到挫折时，会错误地、责任性地归因到自己，或是外部。可以这样理解吗？\n\
