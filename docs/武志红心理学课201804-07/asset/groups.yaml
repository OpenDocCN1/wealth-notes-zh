    \n武志红\n\n从这单元开始，我们的心理学课进入了一个新的主题“自由”，这是“自由”主题下的第一单元，本单元的主题是“自我实现”。\n\n我们的心理学课一直在讲“拥有一个自己说了算的人生”，从业以来我也一直在讲“成为你自己”，那么，成为自己的人，会是什么样的人呢？\n\
