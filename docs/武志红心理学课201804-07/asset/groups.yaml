    # 预告：创造与枯竭


    武志红


    这是我们专栏的第四十三周，“创造”主题的第四周，本周的主题是“创造与枯竭”。


    我在准备这一周稿件时，有着满满的表达热情，但发现很难形成一个特殊的、理性的主题。“创造与枯竭”这个主题听上去实在是有点干巴巴，稍微热情一点的话，我觉得应该是“唯有创造，才不枯竭”，或者是“让自己拥有一个持续创造的人生”，但我觉得这些表达都还不够。


    其实我想跟你谈的内容是比较常见的，一个是中年危机，另一个是职业枯竭，这两个常见的社会现象讲的其实就是枯竭。


    如何让自己不处于人生或职业的枯竭中呢？答案是让你的生命一直有创造的感觉。


    枯竭，是死能量；创造，是生能量。


    创造和枯竭是如何转化的呢？相信很多人有这种经验，一件你很热爱的事，一旦变成一份正式工作或正规学习后，你逐渐失去了热情。为什么会这样呢？


    我 觉 得 是 因 为 你 找 不 到 创 造 的 感 觉 了。从 更 深 层 次 看，之 所 以 找 不 到 创 造 的 感 觉，是 因 为 在 这 件
    事 上 失 去 了 话 语 权。所 以 实 质 上，想 要 拥 有 一 个 持 续 创 造 的 人 生，先 要 拥 有 一 个 自 己 说 了 算 的 人
    生。


    本 周 的 调 查 是，你 是 否 有 过 这 样 的 体 验？有 一 件 事，你 本 来 充 满 热 情，但 最 终 走 向 枯 竭？或 者 你 有 相
    反 的 事 例 吗？一 件 你 本 来 厌 烦 的 事，最 终 却 对 它 充 满 了 热 情。欢 迎 你 留 言，请 多 讲 一 讲 这 个 过 程 是
    如 何 发 生 的。


    好，我们再来分享一首鲁米的诗：


    > 让你的智慧保持炽热，

    让你的泪水保持闪耀，那么

    你的生命就会日新月异。

    不要介意像小孩般爱哭。


