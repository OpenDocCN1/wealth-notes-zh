    # **武志红**


    自己逼自己，这句话的准确含义是‘内在的父母’内在的小孩’。当父母严重强迫孩子时，就在孩子制造了严重失控，并且，会把一些重要的内容屏蔽到潜意识中，就是‘内在小孩’对‘内在父母’的恨意和报复。


    具体表现是你表现得非常努力，非常勤奋，可其实你恨得该死，于是会有一堆莫名其妙的事情，让努力的效果大打折扣，这都来自于对被强迫的恨意和报复。


    我认为关键是看到这些恨意和报复。当父母大强迫孩子时，实际上是在攻击自己，这时候孩子就会打造一 个强自我保护的自我1，结果因为堵堵的存在，孩子就难以深入自我1，以增和也存在，直接连通。


