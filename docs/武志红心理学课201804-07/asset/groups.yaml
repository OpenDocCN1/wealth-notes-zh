    05-17 02:41\n\n## 问答：从嫉羡到感恩\n\n**问：嫉羡到感恩**\n\n**武志红**\n\n这个课是我们专科的问答时间，我先讲一个重要的知识点，再回答一些用户的问题。\n\
    \n《现实 10》嫉羡与金钱》这篇文章引起了很多同学共鸣，现在我讲一下嫉羡的对立面—感恩。\n\n嫉羡的根本，是一个人觉得自己创造了好的东西，也拥有了好东西，是他感觉好的存在有好东西的感觉。所以，他觉得自己好，因而生生羡羡，接着会产生了毁灭欲，想毁好东西和拥有好东西的人。\n\
    \n而感恩的根本，是一个人深深地体验到自己可以彻底有存在，有自己强大责任，而这些东西，实际上是那些更的存在带来的，因此感恩这个善意的存在，并愿意向这个善意的存在低头。\n\
    \n最初在婴儿那里，婴儿感受到母亲拥有幸福的乳汁，母亲会心甘情愿地哺育自己，满足自己，这是没有条件的，不需要自己低头，不需要自己屈从或拿什么去交换。这种原始的感恩让自己可以肆无忌惮地吮吸母亲的乳汁，将这个最原始的好东西吸纳进来，增强自己，当深切感知到母亲的善意后，婴儿也会愿意承让母亲的强大，并向母亲低头，这就是我们一再说的依恋的完成。\n\
    \n一旦依恋形成了，事情会变得非常简单。\n\n我们很容易感恩教育，然而我认为感恩是更甘心彻底存在，孩子充分体验到母亲乃至其他养育者对它们的养育后，自然发生的。而感恩教育更多是补偿性，让孩子看到母亲或其他养育者多么累，多么疲惫，付出多少辛苦，然后他们可能会感动，可能会觉得幸运活下来了，所以要感恩。\n\
    \n这样的感恩有强烈的匮乏感，充满痛苦的“母亲”，充满着愧疚的孩子。在这样感恩之后，许感激巨大的债务，母亲像欠债的，孩子像债主，而这样欠债的、巨大的债务会让孩子觉得母亲对自己的牺牲很大。母亲像个大债主，孩子像个小债务人，孩子觉得自己欠母亲很多，所以不敢活，不敢去拿，不敢去爱，甚至不敢去想。这种巨大的债务感让孩子对生命本身都产生了恐惧，所以，感恩教育往往是孩子痛苦的开始。\n\
