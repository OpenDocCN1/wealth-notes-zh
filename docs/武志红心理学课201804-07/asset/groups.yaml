    # 问答：偏执分裂位不等于错误


    这是课里我们专列的问答时间。先来回答一个观点，再来回答一下大家的问题。


    我解释的观点是偏执分裂位并不等于错误，也不等于错误的位置。当一个愿望发起时，总是在偏执的位置，这时候要做一些偏执分裂的工作，例如把自己和自己的愿望差异化，并且把“坏”分裂投射出去，这样才能比较好地追逐并且达到这个愿望。如果一个人一开始发起愿望就是反思，就相当于郁位，伤害到别人，那就很难追逐愿望了。


    在这一单元的课堂留言中有用户问，“情人眼里出西施”是偏执分裂位吗？我觉得这就是以“做”情人的，的确是偏执分裂位，把“坏”从情人身上分离出去，于是在觉得情人美妙西施。


    我和很多投资人聊天，他们在总好的投资对象时，会说到“疯态的天才”这个词，因为觉得很多好的投资人对对象上，都带着一股子偏执劲，有这一股劲，才更有可能把企业做好。有研究显示，那些善于为自己辩护、不容易自我批评的人，更容易成功。这也是同样的道理。


    一个愿望就如同一个新婴儿，在它稚嫩的时候，需要呵护，而不是各种批评和打击，即使是自我批评，而等它强大壮了，就可以进行更好的反思了。


    当然，事情是有限度的，如果始终处于偏执分裂位，不能进入到郁位，那么可能会产生不好的结果：第一，郁位会树亡很多人，忽略很多陷阱；第二，不承担失败，可能太多精力会耗在“沉淀成本”上。


    所以，克莱因因素，人经常是处于偏执分裂位发起一个动力，逐渐达到去偏位，再回到偏执分裂位发起一个新的动力，生命就是这样的不断的轮回。


    # 单问问答


    有没有只做到分裂做到投射的情况？如果有，这是什么状态呢？之前我们讲过快意恩仇，要痛快地去爱，要痛快地去恨，这与郁位的状态矛盾么？还是说快意恩仇是为了达到郁位呢？


    我认为应该不太可能只切割而不投射。投射有两种方式，一种是攻击地损坏投射到别人身上，而去抹攻击别人的行为，但我心里觉得外部世界很坏，这也是投射。


    快意恩仇，这是跟安全建立连接，在这种情况下到的真实，更为强大且真实的快意。如果只是长在头路上去整合，这就是虚性的，遇到很多头脑认识着起来很明显的人，一遇到就容易被抓住，这是因为没有经历真正的历炼。


    快意恩仇这个词容易给人偏执的印象，但在精神分析对象界那里，不是这个意思。快意恩仇的对立面，也不是整合，而是我们前面课程多次谈到的“心灵解结”。


    如果一直处于郁位，不能发怒，不轻易投射自己的坏，会不会让自己起来想抑郁呢？


    从你的表述来看，这种情况可能是处于郁位，更像是偏执分裂位。


    偏执分裂位，会在头脑上各种投射“坏”，但你的成功对外界发起攻击，哪怕是适度、合理攻击，因为偏执分裂位的人会想象，自己的攻击是全能的，一旦表达就会导致毁灭。


    偏执分裂位的人，如果心中积攒了太多的坏，也世界看待都很坏很可怕，以至于不敢表达攻击，那就引起很严重的抑郁症。不过，这个时候的抑郁症，并不是郁位的意思。


    武老师之前《本我，超我和自我》这节课讲到，本我是野性的，超越自我理性，自我是调节。我想问婴儿时期的孩子，在两个位时，它们是否看的本我，自我。它们又是怎么形成的呢？


    这是个很好的问题。


    虽然婴儿一开始处于元一的全能自恋中，但克莱因等客体关系学家认为，婴儿一开始就在寻找客体，就像在关系中，于是能意识到寻求存在，意味着这个时候就是最初的本我超我。并且，婴儿也会有一个头脑的自我，也代表超我和超我的关系，所以自我应该很早就开始运作了，围绕着偏执分裂位在一些原始的自我防御机制，这意味着婴儿是有一定意义上的自我能力。当然，同时也意味着有一定分裂双能力，毕竟语言是符号，而不是存在本身。


    心智的发展非常重要，精神分析中有一个术语叫“心智化”，意思是养育者需要能够幼儿语言行为，把自己的心理活动用语言表述出来，当孩子能用语言来表达情感情感时，他们就有了一种分裂双能力。当然，同时也意味着有一定分裂双能力，毕竟语言是符号，而不是存在本身。


    如果不做到切割和投射的工作，人性就是一直单纯完整的，要么也就无法产生。那可不可以说，其他动物动物性或者说，就是更单一完整的？因为它们不做到切割投射，因为它们不具备这种从，从这个角度来说出发，可不可以说人类比动物高级的也正是因为有这个能力和需求？


    依我的经验，动物一样会做到切割和投射的。例如，我养了一只鹦鹉，它非常霸道，攻击性很强，攻击过我家所有它熟悉的鸟朋友，谁没攻击过我。它咬到了我这个“老外”不咬其他的饭。我一天，它在饭桌上想吃我碗里的饭，饭我喂了一下，结果它转身离开我，走到我一位到访的朋友那里，就啃咬了一口。


    延伸阅读：《空间04|修复掌控力》


