    # 预告：自我实现


    预告：自我实现


    武志红


    从这单元开始，我们的心理学课进入了 一个新的主题“自由”，这是“自 由”主题下的第一单元，本单元的主题 是“自我实现”。


    我们的心理学课一直在讲“拥有一个自己 说了算的人生”，从业以来我也一直在 讲“成为你自己”，那么，成为自己的 人，会是什么样的人呢？


    特别是，这样的人会成为自我中心、自私 自利的人吗？在我最初倡导“成为你自 己”时，总有人会问这个问题。


    我想，学习了心理学课的用户应该不会问 这个问题了，因为我们都知道带着攻击性 的生命力一旦被发现，就会成为白色的、 好的生命力，所以真正成为自己的人，他 们的生命力的品质，也就是人性化程度，
    会是最高的。只有那些没有被发现的生 命力，尤其是黑色的生命力，在展现时 才会是自我中心、自私自利的。


    我这是主要根据精神分析理论做的一个理 论构建和推导，然而，理论还需要证明， 关于这个理论的一个最好的佐证，应该是 人本主义心理学家马斯洛对杰出人物做的 研究。


    亚伯拉罕·马斯洛（Abraham H. Maslow, 1908-1970），美国著名 社会心理学家，第三代心理学的开创 者，和心理学家罗杰斯并称为心理学第
    三 大 势 力——人本主义心理学的两位大 师，提倡自我实现，代表作品《动机与 人格》等。


    马斯洛根据对杰出人物的研究，在1943年 在《人类激励理论》论文中提出了极具影 响力的需要层次理论。马斯洛认为人有七 种需要：生理需要、安全需要、归属与爱
    的需要、自尊需要、认知需要、审美需要 和自我实现的需要。


    七层需要分为两大类，较低的前四层称为 基本需要（basic needs），较高的后三层 称为成长需要（growth needs）。其中基 本需要的共同性质是由于生理上或心理
    上有某些欠缺而产生，所以又被称为匮乏性 需要（deficiency needs）。


    ![](img/1c8805f81e6502071128412767cb1966_94_0.png)


    需要层次论是马斯洛心理学中影响最大的 理论之一，至今仍在多个学科领域和实际 工作中发挥着巨大的影响力。


    我们所说的自我实现者，就是那些真正成 为自己的人。马斯洛研究总结说，这些人 会有一些共同的人格特征。本单元我就来 介绍一下马斯洛的相关理论，并阐述一下 马斯洛对自我实现者的认识。


    本单元的调查是，你认为自己是自我实现 者吗？你身边有自我实现者吗？请介绍一 下他们的人格特征。或者你可以讲一下你 认识的人中人性成熟程度高的人物，并说 说他们的人格特征是怎样的。


    好，我们再分享一首鲁米的诗：


    > 我看上去如此脆弱

    而这里，就在我手里

    是永恒的保证。


