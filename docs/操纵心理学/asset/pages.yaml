- pgno: 113
  md: '对直接质问时，往往都会说谎，否认他们的动机、意图或是目标。因此，天真的被操纵者想要从操纵者那里寻求解释，证明操纵确实存在，是不可能的。


    你很快就会知道，唤起别人的特定反应来实施操纵的人，更不可能承认他们的操纵手段或操纵目标，因为他们普遍不清楚他们的行为会给他人带来何种影响。你不能让操纵者承认他们的动机和目标。这样做只会让你更深地陷在操纵之中。但是，这意味着你必须或应该糊里糊涂地接受自己在这段操纵关系中“配合”操纵者（尽管你是无意的）这一事实。这恰恰意味着认清现状、停止操纵者、让操纵失效，这些都取决于你自己。你必须为自己负责，因为操纵你的人是不可能帮助你逃脱困境的（即使他有这个能力）。


    只要你对于这段关系的运作方式依旧是云里雾里，你的行为、思维和感觉就越是会被控制，你也就越无法成功抵挡操纵者对你的负面影响。这种云里雾里的心理状态，非常像在大雾天开车。你能这么做吗？可以。但这样做安全吗？不。为了保护你自己，拨开心中的迷雾非常重要。


    第二个目的则是帮助你提升识别与鉴别技巧。换言之，通过学会鉴别那些可能会将操纵作为常规手段的人的特点与风格，你就能建立一个早期警报系统来武装自己。一旦你意识到操纵可能会发生，你就能够提前制订抵抗策略，在操纵'
