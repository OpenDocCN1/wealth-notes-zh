  md: '钱来招待“朋友”。然而她所谓的朋友并不邀请她参加周六晚上的派对，卡拉的母亲不忍心告诉女儿，她只是被利用了，而是极力鼓励卡拉去和其他女生交朋友。遗憾的是，卡拉觉得太晚了。的确有一些女生之前试图和她交朋友，但是由于她们并不是潮人组的成员，卡拉对待她们的态度很糟糕，拒绝了与她们吃午饭、在放学后喝苏打水的邀请。卡拉觉得自己已经彻底毁了友谊之桥。


