- pgno: 255
  md: '通过阅读本书前面的部分，你知道了某些错误的思维方式（尤其是关于你在一段关系中的情况）会让你十分容易被操纵者盯上。在第 2 章，你已经测量了自己的脆弱程度，并且清楚了对于潜在操纵者而言，你是否是一个容易得手的目标。


    你也知道了成为操纵的受害者，也会发展出脆弱点。允许其他人来控制你，会让你变得不自信，不再将自己视为自己生活的主角。结果就是，你的自尊降低了，你的自我意识模糊了，你对核心自我的内在关注也变得模糊起来。


    如果你有取悦他人的倾向、对肯定上瘾、恐惧他人的怒气症，或是有自信问题，这些按钮就反复会被操纵者利用，从而让操纵更加根深蒂固。


    简而言之，让你成为软柿子的脆弱点，就是被操纵的起因，也是陷入一段或多段操纵关系的结果。


    只要你开始实施抵抗策略，你就迈出了让自己脱离操'
  merge: -1
  img_proc: true
- pgno: 256
  md: '纵性控制的第一步。通过改变自己的行为，你已经开始纠正让你容易成为目标的想法与认知。


    现在，是时候向那些思维定式发起直接攻击了，这样你就能将自己变成难以攻克的目标，而不是轻而易举就能拿下的目标。操纵关系给你带来的艰难与痛苦的经历，是你做出改变的最大动力。你比任何时候都更清楚，继续这样的思维方式只会将你引入又一个操纵陷阱，而这对于你的心理与生理健康都是极大的伤害。


    要实现感知与行为发生更深远、更具建设性的改变，你就需要改变思维方式。从心理学角度上看，你的思维方式、行为和感觉以一种脆弱的平衡联结在一起。如果其中一部分与其他部分不协调，你就会觉得十分不舒服。形容这种不平衡的术语来就是认知失调。我们可以将这种不平衡看作三项心理元素（思维方式、行为与感觉）中的任意两种发生了冲突。


    认知失调会冲击我们的心智，因此我们一般都不喜欢做一套，思考或感觉的却是另一套。如果发生这种情况，我们会觉得虚假、不真实或疑惑混乱。这种失调或不适的感觉会驱使我们去重新排列、尽力去使它们和谐相容，用这些方法来使系统恢复平衡。


    当我们被操纵，脆弱的思维方式会引发受害者行为，负面情绪也会随之而来。而使用抵抗策略，就在用杠杆调'
  merge: -1
  img_proc: true
- pgno: 257
  md: '整你的想法与感觉。换言之，让自己的行为不再屈服于操纵者，你开始引导自己的思维与感觉向非受害者、更健康的方向转变。记住这条告诫：改变你的行为，你的心（比如说你的想法与感觉）也会跟着改变。


    以相同的方式纠正自己错误的思维与认知，也会 对行为与情绪产生有益的影响。因此，像一个难以攻克的目标那样思考，你也会变得难以攻克。


    你已经尝到了操纵的苦涩。现在，你已经准备好接受认知疗法的良药。这种方法已经被证实，能够有效纠正那些驱使人屈服于操纵者的错误思维方式。


    # 清除你意念中的病毒


    自我挫败的思维与认知方式让你在面对面操纵时格外脆弱，它们就像病毒，感染了你的意念。要清除这些病毒，在操纵者面前表现得更加强硬，你需要遵循以下三条基本步骤：


    +   1. 书写下你“无意识的”、没有修饰过、没有约束过的想法。


    +   2. 扫描你的思维库，找到所有让你容易被操纵的认知与态度。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '+   3. 以修正过的强硬诉求来取代每一条软弱的想法，或者说病毒。


    认知疗法教会你要站在检视者的角度来看待自己的思维流。心理学家经过长期研究发现，仅仅让病人写下他们“无意识的”或没有修饰过的想法，就能够启动改变的过程。这是因为写下自己的想法极大地增强了你对心理活动的意识程度。


    以敏锐的眼睛观察造成你软弱的那些思维错误，你就会发现错误的想法是如何将你变成了操纵者的合作者的。最终，通过更健康、更能保护自我的想法取代错误的想法，你就能够更好地控制由思维创造的心态与感情。当然，最重要的是你会让自己成为一个操纵者难以攻克的目标。


    # 将你的想法记在笔记中


    为了消除你意识中的病毒，你需要定期从思维中提取样本。你拥有越多思维方式的样本，你让自己变得强硬的**努力**就会越有效。


    你应该着眼于生活中最困难或问题最多的关系。任何让你有不舒服或不开心的接触与场景，都值得记录下来。你的情绪触发器可能会包括焦虑、恐惧、内疚、义务、疑'
  merge: -1
  img_proc: true
- pgno: 259
  md: '惑、悲伤、怒气、失望或任何给你带来负面感觉的经历。


    当然，每一次感觉被操纵时，你都应该记录下来。


    试着在事件发生之后尽快写下自己的想法。你也许有好几个小时都无法记笔记，因此立刻做一些速记能够帮助你回忆起当时的感觉。


    你的笔记应该包括日期、时间以及对所发生情况或问题的简要描述，同时再加上对感觉的描述。关键是下一步：你必须像做听写一样，按照心中的想法，直接写在笔记本里。


    你必须记录下你“无意识的”想法，对这些自然出现在你的思维中的内容不做任何编辑、修饰或改变。记录下你对于这一情况的想法、你与其他人的关系，以及你的情绪反应。


    因为你是寻找那些让你容易被操纵的软弱想法，因此你应该利用下面这7个情绪按钮（或脆弱领域）作为提示或线索。写下你关于这些话题的想法：


    你取悦他人的习惯与心态


    你对于肯定与接纳的需求；以及你逃避拒绝、批评与抛弃的需求


    你对于怒气、冲突与正面对抗的恐惧与回避


    你无法拒绝别人'
  merge: -1
  img_proc: true
- pgno: 260
  md: '你模糊的自我意识


    你对自己的信赖程度很低


    你的外控型人格——你倾向于认为其他人需要为你身上发生的事负责


    # # 如何识别软柿子思维？


    阅读你的笔记寻找错误思维之前，你需要花一些时间做一些家庭作业。家庭作业是认知疗法的一个重要部分。


    你的任务是学会识别软柿子思维，并且理解它为何，又如何让你容易被操纵。为了帮助你，我已经在 7 个脆弱领域都提供了一些软柿子思维的例子。


    我提供的软柿子案例并不包括所有的情况，也没法囊括每一个人独特或精准的想法。当然，那也不现实。这些例子是为了让你对自我挫败思维的风格、类型和内容有一个比较好的认识，因为正是它为操纵者打开了一扇门。


    我建议你大声念出每一个例子。询问自己是否在自己的思维流中意识到了这种类型的思维模式（尽管措辞与表达上会有所不同）。如果你直觉上同意任何一条论述，你就找到了思维方式中的一个错误。（回过头看看你在第
    2 章测试中的答案。在这 40 个“软柿子”描述中，你选择的肯定回答有多少个，你的总分就是多少。）'
  merge: -1
  img_proc: true
- pgno: 261
  md: '你在阅读下面分类中列举的软柿子案例时，试着设想操纵者的立场观点。这样的思维方式究竟哪里吸引了操纵者的注意力与兴趣？操纵者会如何利用这一思维模式来达成他们的利益与目的？他们又会怎样利用你的按钮？


    # 取悦他人的习惯与心态


    这种思维模式，以及它所催生与支持的行为模式，被自我认为的“我应该如何”所污染与扭曲。如果你有取悦他人的认知习惯，你的自尊就会与你为他人做了多少以及你在多大程度上取悦了他人这样的事联系在一起。结果就是你为了照顾到所有人的需求，自己做出了牺牲。你为了自己做好人需要付出代价，其他人会利用你想要取悦他们的意愿操纵与剥削你。


    下面我们列举一些例子说明取悦他人的思维让你变成操纵者眼中的软柿子：


