- pgno: 299
  md: '# **结 语**


    现在，你已经掌握了必要的手段、策略和心态，来帮助你应对生活中的操纵者。你已经了解了如何让自己成为难以攻克的对象，来威慑那些想要控制你的潜在操纵者。


    你意识到了操纵者利用操纵给你的心理状态与身体健康带来的巨大伤害。幸好，你感受到的压抑能够成为你行动的动力。记住，如果你无法下定决心改变与纠正行为，操纵关系就会一直持续下去。毕竟，操纵者为什么要改变呢？


    带着有效工具与武器的武装，你几乎已经有了所有必要的、让你能够在与操纵的战役中赢得胜利的东西。但是，有一样关键的东西我无法给你，而正是这样东西，能够让这本书不再只是一本你随手放上书架的自助指南，这样东西能够让你真正拥有改变人生的力量。


    这—样最重要的东西，就是勇气。


    勇气，是能够引燃改变的火花。因此，你必须深入内心，寻找你自己的勇气。你的自由也源于它。'
  merge: -1
  img_proc: true
- pgno: 300
  md: '拥有勇气并不等同于毫不畏惧或全无焦虑。恰恰相反，带着勇气，你就能够在感觉到焦虑甚至致命恐惧时，依旧勇敢前行。在面对、抵抗操纵者时感到紧张是非常自然的。取胜的关键，就是寻找你内心的力量，并让它们指引你，不要让你的恐惧决定你的命运。


    下定决心，脱离操纵：找到你的勇气；使用你学到的策略，在此过程中保持耐心。改变，尤其是那些影响深远的改变，不会发生在一朝一夕之间。只要坚定而努力，你最终一定能成功。


    在合上本书之前，花一些时间，想想这些话：


    > 若我不为己，谁又为我？


    若我只为己，我为何物？


    若不在此时，更待何时？


    ——希勒尔，十二世纪'
