    # 用纠正过的强硬思维取代软柿子思维


    通过前面提到的指南与例子，相信你已经做好了准备去对抗自己的软柿子思维。你已经找到了那些让你容易被操纵的思维方式。最后一步，就是用纠正后的强硬想法，来取代每一种错误的认知。你可以借鉴我们介绍的例子，或是写下你自己的强硬想法。


    在写下每一条纠正过的想法之后，大声念出来，朗读自己改变后的全新心态，默默积蓄力量与自信。注意看看这些想法坚定了多幺，又让你感觉到了怎样的力量。


