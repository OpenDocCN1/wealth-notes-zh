    # ### 三个重要的目标


    在这一章，我的目的分为三个部分。首先，是帮助你更好地理解、看准、认清所处的关系，尤其是这些关系中权力与控制的运作方式。在一段关系中始终被操纵的人，会产生一种失控感，会感觉对自己的动作、行为甚至想法与感觉都失去了控制。伴随着这种失控感而来的是迷惑、不适，以及无法掌握操纵者动机与行为的痛苦情绪。讽刺的是，操纵者手段越熟练、操纵越有效，你就会越弄不明白你是在何时、以何种方式被操纵的，甚至于是会怀疑自己究竟是被操纵了。


    被操纵者总是想要了解操纵者的动机，来搞清楚现在究竟是什么状况。但是，你必须记住，熟练的操纵者在面'
