    边缘性人格很害怕会被抛弃，他们愿意付出一切代价来避免分离。他们对于任何拒绝的信号都会产生歇斯底里的反应。当他们感觉自己的安全感受到威胁时，会爆发出怒火。面对拒绝或被抛弃的威胁，他们会大发脾气，或表现出失望，但是他们在情绪失控后，又会觉得内疚羞愧。


