    取悦他人的习惯与心态完全就是在泄露自己致命的秘密。如果你有“取悦症”，操纵者远远地就能盯上你。


    # ## 第二个按钮：你沉迷于获取他人的认可与接纳


    当你“上瘾”后，你会感觉自己必须努力获取其他所有人的认可与接纳。更甚者，无论代价为何，你都需要避免任何批评、拒绝与抛弃。


    你的与人为善，核心其实是对拒绝与抛弃的深深恐惧。取悦他人者往往相信，只要待人友善，总是为他人付出（即使以牺牲自己的利益为代价），就能够避免拒绝与抛弃的恐惧感。


    重视他人的认可并没有错，尤其是重视你所爱、所尊敬的人的认可更是人之常情。想要被他人喜爱是人的天性。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '然而，当这种渴望变成了强制，也就是说，你将它们视为情感维系的核心，并将不认同、拒绝或批评的后果视为灾难，你就进入了危险的心理误区。你会发现你进入了操纵的世界，并且会受到操纵者的胁迫控制。


    当他人的认可不只是一种愿望，而是一种强制时，你就成了操纵者的目标。如果你沉迷于此，你的行为就和瘾君子一样容易被控制。操纵者只需简单两步：给你渴求的东西，威胁要拿走你渴求的东西。


    毒贩都是这样做的。你若是对别人的认可上瘾，就要永远面对失去别人认可的恐惧。


    首先，操纵者会让你获得他（她）的认可与接纳。但是，请牢记，就像任何上瘾者一样，你会消费掉所有你收到的认可、接纳与积极反馈。在你的心理经济世界中，并没有储存或是保管认可的概念。无论你今天收获了多少喜爱与认可，它都不会延续下去；明天你会再次感受到对获取认可的渴望。无论你今天已经收获了多大的认可，明天你依然要面对失去认可与接纳的深刻恐惧。这是一个恶性循环，也是操纵者驾轻就熟的手段。


    这样，第二步也就很清晰了：一旦你迷上了操纵者的认可与接纳，他（她）所需要的仅仅是威胁你会收回他们对你的认可。实际上，鉴于你是一名对别人的认可上瘾的患者，他们甚至不必直接说出威胁不再认可你的话。换'
