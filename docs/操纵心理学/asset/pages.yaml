    +   4. 有时候我感觉自己是个隐形人。


    +   5. 我常常感觉自己的个性是由别人的信仰、特点与价值观所塑造的。


    # 低自我依赖性


    这一脆弱点往往和模糊的自我同时出现。如果你的自我意识没有了焦点，那么你依赖自己判断的能力也会被损'
