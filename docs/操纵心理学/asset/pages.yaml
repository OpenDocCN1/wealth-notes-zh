  md: '# 用强硬的信念来纠正软柿子思维


    要将自己变成难以攻克的目标，让操纵者知难而退，你就需要用更健康、更能保护自己的思维来取代错误的思维。为了能够在制止操纵者时有坚定的心态，你的强硬思维就必须是准确、合适与可信的。如果你不信任自己的新思维，别人也不会相信。


    对你自己的力量与权力做出连你自己都不相信的夸大描述，会让这一道保护你的防线像纸牌屋一样脆弱。仅仅将软柿子思维替换成没有实际支撑的乐观空话，是不会起任何作用的。


    但是，当你用现实、健康的思维方式来修复与武装自己的心时，它就会对操纵者起到有效的威慑作用。大部分操纵者都会找最容易下手的目标。你纠正过的强硬信念会筑起一道抵御之墙，让操纵者觉得难以下手。


    我的一位同事将操纵比作机会性感染——它们会传染给抵抗力最差的目标。如果你的新思维能够让你从软柿子变成难以攻克的目标，操纵者很可能就会跳过你，选择更容易上手的受害者。


    为了帮助你形成强硬的信念，我将针对所有脆弱的领域，为你提供了一些例子。在每个部分开头的“调试指南”，我将帮助你清理意念，形成更健康的心态。'
