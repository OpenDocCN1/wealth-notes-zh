  md: '# 对自我的模糊意识


    对自我没有清晰的意识——不知道从哪里开始到哪里结束，不确定要满足谁的需求，也不清楚自己最核心的价值观是什么，这些弱点会强化操纵。从一方面看，缺乏清晰的自我意识会让你十分容易在操纵关系中成为被支配与操纵的一方。而当你变成其他人权力游戏的掌中之物，你的自我意识又会变得更加薄弱、更加模糊。


    下面是一些模糊自我思维的例子：


    +   1. 我觉得很难不考虑他人对我的看法，也很难在这样的情况下描述出我究竟是一个怎样的人。


    +   2. 我对自我没有清晰的认识。


