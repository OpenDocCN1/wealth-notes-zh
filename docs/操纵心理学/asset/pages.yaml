  md: '在此之后，只要瓦莱丽稍稍提到婚姻或孩子的话题，她就会看到杰伊下颌收紧。她知道，如果她不立刻放弃，转换话题，杰伊一定会爆发，他们又会开始吵架。杰伊的怒火也给她留下了伤痕。讽刺的是，瓦莱丽并不是喜欢吵架的人。她不喜欢与人发生冲突与对抗，并且会竭尽全力去避免发生争吵。


