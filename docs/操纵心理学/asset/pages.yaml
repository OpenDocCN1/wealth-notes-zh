    # 如何给你的回答打分？


    首先，将你的得分加总起来。你的总得分分会在 30~150 分之间。


    # 如何解读你的回答？


    如果你的分数在 120~150 分之间，那么你很可能处在一段操纵关系中。你的分数越接近 150，这段关系给你带来的负面情感就越大。你的行为模式实际上就是在奖励操纵者，并且他（她）对你的控制会继续下去，甚至会增加。


    如果你的分数在 100~119 分之间，那么你已经展现出了被操纵的信号。记住，除非受害者能够不再让这个过程继续下去，否则操纵关系很难改变。


    如果你的得分低于 99 分，那么你在这段关系中就不太可能是操纵的受害者。你在这段关系中遇到的困难可能有其他原因和解释。


    如果你的分数在危险的区间内，那你应该明白：操纵者基本不可能会在这段关系中第一个做出改变。操纵的矛盾性就在于，感觉最无力的那个人，也即受害者，实际上'
