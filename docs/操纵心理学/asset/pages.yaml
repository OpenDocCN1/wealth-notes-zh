- pgno: 137
  md: '你是否曾经被魔术把戏所迷惑，看到一个人被锯成两半时感到很神奇？你是否曾经看到魔术师从他的帽子里变出一只兔子，然后心想：“他是怎么做到的？用的是什么方法？”


    我女儿大概三岁时，我丈夫教给了她一个叫作“黑魔法”的小把戏。它是这样的：先让我女儿离开一个有很多人的房间，然后由某个人随意指房间内的一个物件或一个人。比如说选中的是一个碗。当我的丈夫把女儿重新叫回房间时，他会问她：“选中的是沙发吗？是椅子吗？是地毯吗？是画吗？”而她则会很确定地说“不是”，直到被问到是不是碗时，她会很自信地说：“是的。”


    这个游戏中的物件，就是让人们来猜这个小把戏是如何完成的，几乎从没有人猜到过！无论这个小把戏重演多少遍，我女儿总是能够选对。而其他孩子或成年人则会提一大堆问题（“是因为你的语调有变化吗？你是不是在偷偷指着那样东西？是不是永远是你问的第四样东西？”），'
  merge: -1
  img_proc: true
- pgno: 138
  md: '但这些怀疑都是徒劳的。他们被难住了。过了一会儿，一些成年人就会开始觉得沮丧，因为困住他们的居然是个小孩儿。


    尽管我现在不应该戳穿这个小把戏，告诉你是如何做到的，但我可以告诉你它十分简单，也是应该这么简单，毕竟我女儿三岁时就能做到了。（她也可以像我丈夫那样提问，由我丈夫离开房间，然后回来由我女儿来问问题）。对我来说，这个把戏也十分明显。但是我看着他们玩过许多次这个游戏，总是会很惊讶人们居然会忽略最明显的线索。但是，如果你知道某些事的运作方式，那么当别人玩把戏时你就能够很容易地看出来了。


    简单来说，操纵，很像一个魔术把戏。如果你花时间去了解操纵是如何进行的，那么在面对它时你就不太会感觉毫无保障，因为你知道会发生什么。它的神秘性将不复存在。


    # 你是如何被操纵的？


    操纵关系依赖于两种基本的人类驱动力：收获（或回报）和损失（或逃避）。这是驱动操纵的两个引擎。不用再费心去找其他比这更复杂的了：操纵往往能够归结为获得净收益的承诺和（或）遭受净损失的威胁。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '在一些操纵关系中，通常都存在对获取一些珍贵收益的承诺，这也是被操纵者愿意参与这一项目的原因。或是操纵者承诺会回报给配合或顺从的受害者他们想要、需要、渴求、偏好的东西。


    在一般的工作场所中，包含上级要求下属去做一些令人不快的事，比如说加班到很晚或在周六加班。他会暗示，甚至是明确说这就是人们在公司获得晋升的方式。目标会被告知：“如果你想要晋升（或涨工资），你就该周六出现在这里。当然，选择权永远在你自己。”老板会加上这么一句，说明整件事存在选择余地。


    这很露骨，但有些时候，行为会更微妙，从而很难看出或感觉到操纵的存在。关键点就是，在这个例子中，操纵者会承诺给顺从的受害者一些他们想要的回报。


    另外我们还需要理解的一点就是，在很多类似的情境中，受害者并不一定知道自己正在被操纵。有时它听起来更像是影响或建议。但是，当我们检视另一面，也就是如果受害者没有按照“要求”或“建议”执行的话，它就不再只是影响，而是赤裸裸的操纵行为了。


    这样的情况发生在可能会失去珍贵之物或想避开某些事的时候。一名熟练的操纵者会利用受害者的恐惧，来承诺只要受害者展现出顺从与合作，就让他们免受损失或是避开惩罚性的结果。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 控制杠杆


    但是，驱动者无法自我驱动。他们还需要某些关键的控制杠杆来让操作运作起来。


    所有操纵关系都取决于特定的控制杠杆，也就是对于获益的承诺，对于损失的恐惧或对于不想面对的事情的回避。举个例子，获益或回报的常见杠杆包括：


    +   - 钱

    - 权力

    - 地位（比如说头衔、晋升，或某个学校、俱乐部的录取通知）

    - 性

    - 允许

    - 爱

    - 接纳

    - 承诺（比如说某段关系）

    - 表扬

    - 保证

    - 物质礼物

    - 陪伴'
  merge: -1
  img_proc: true
- pgno: 141
  md: '可以看看这个列表，你也许就更容易回忆之前有人在你身上利用这些控制杠杆了。当你正渴望金钱、权力、晋升或进入某个高档俱乐部，有人用这些东西诱惑你，你可能还没意识到你正在被操纵就扑上去了。因为他（她）提供的正是你想要的东西，并且你将他（她）说的话视为影响而非直接的操纵。


    如果对获益的承诺是控制杠杆，操纵看起来可以是软性、微妙的。但是，强硬、直接的操纵就是这枚硬币的另一面。看看下面这个列表，它包含了一些常见的损失、回避或恐惧的杠杆：


    +   损失金钱

    损失权力

    失去地位

    失去工作

    失去晋升机会

    失去其他奖励回报

    失去能够得到回报的机会


    当操纵者突然将杠杆从承诺获益转向损失威胁时，你就知道这是操纵，你会意识到你正在被操纵。这就像是你正在外面享受一个美丽秋日的阳光，突然一片乌云遮住了'
  merge: -1
  img_proc: true
- pgno: 142
  md: '太阳，空气突然变凉，迫使你拢住自己的领子。承诺的收益突然转变成损失威胁，你就会感受到这样的战栗。操纵突然就变得压迫紧张起来。


    记住，操纵往往开始于承诺回报，换来的却是丧失回报的威胁。换句话说，如果有人承诺给你某种收益，这种收益或承诺若其中之一没有满足操纵者的动机，那么你接下来可能要面对的就是会失去收益或其他能够导致操纵的损失。


    但是，涉及威胁损失、回避和（或）恐惧的控制杠杆就更多了：


    +   对冲突的恐惧

    对怒火的恐惧

    对拒绝或是抛弃的恐惧

    对失去爱的恐惧

    对失败的恐惧

    对暴露的恐惧（比如说秘密、缺点、不足）

    对丢脸的恐惧

    对内疚的恐惧

    对批评的恐惧

    对失去沟通的恐惧（比如说冷暴力，拒绝谈某一问题的心态）

    对无法做爱的恐惧'
  merge: -1
  img_proc: true
- pgno: 143
  md: '花点时间再看看控制杠杆的列表。你越熟悉，你就会越敏锐，对于即将到来的操纵越能保持警觉。后面我会讲到，当你被操纵时应该做些什么，但是眼下最重要的是你要意识到发生在你身上的操纵。就棒球比赛来说，提高你的意识就像是在投手投出球时，击球手就能够意识到这是一个曲线球。即便是经验丰富的击球手，也只能偶尔击中一个曲线球。但是，想一想，如果捕手在他们耳边低语“下一个投是曲线球”击球手的安打率会高出多少。


    这些表单的作用就是如此：让你意识到操纵这个曲线球。很快我就会检查你的得分。


    # 操纵者想要什么？


    简单来说，操纵者想从你身上得到这两个结果：


    +   * 他想要你做某事。


    +   * 他想要你不再做某事。


    用心理学术语来说，操纵者在试图：


    +   * 煽动你去做某事。换言之，他在试图让你去做某些符合他个人利益，却不一定对你自己有利的事。记'
  merge: -1
  img_proc: true
- pgno: 144
  md: '住，操纵者总是会将他自己的个人利益放在你的利益之前。重点：总是。


    或者她会阻止你去做某事。她希望能够中止某些你正在做，但她想要你停止的行为。


    正如你现在以及之后将会看到的，尽管程度不深，但操纵者总是会走迂回路线。这就意味着，只要你知道自己身处被操纵的环境之中（意识到投手的行动），你就能更好地在操纵出现时发现它。


    关于获益或损失的承诺（要么是煽动，要么是中止）也许会公开的（比如说承诺会有感激或肯定，会有物质奖励等）；也许会暗示的，没有说出口的（比如说否定，失去获取晋升或其他奖励的机会，或是害怕这些事会发生）。


    # 哪些类型的关系容易被操纵？


    正如我在前面提到的，操纵可以发生在每一种类型的关系中。操纵是由获益或避免损失的承诺及相关手段以及可预见的结果所定义的。因此，任何对你的身份、安全感、地位、自我价值或自我满足感有潜在影响的关系都很有可能隐藏着操纵，因为你会从中获取或损失最多的东西。'
  merge: -1
  img_proc: true
- pgno: 145
  md: "因为这些原因，操纵往往会发生在：\n\n+   家庭关系（包括婚姻关系、亲子关系以及和其他亲戚的关系）  \n性/恋爱关系（包括前配偶）  \n工作关系（同事或非同事）\
    \  \n朋友关系  \n学术关系（老师和学生）  \n专业关系（比如说医生和病人，律师和客户）\n\n# 操纵者使用的是什么手段？\n\n操纵者会使用多种手段来让你服从，以满足他们煽动或阻止你的需求，但这些手段通常不是同时使用的，因为这样做太明显了。一般来说，他们会先试一种手段，如果失败了，再加\
    \ 大筹码。\n\n使用的手段会根据你与操纵者之间建立的关系而有所不同。比如说，你的配偶或爱人使用的方式，与你的老板或上级使用的方式肯定会不同。同样，家庭成员使用的手段，与朋友或同事使用的手段，肯定也会不一样。\n\
    \n由大卫·巴斯（David Buss）与他的同事在1987年进行了一项研究，找到了正在约会的情侣试图操纵彼此行为"
  merge: -1
  img_proc: true
- pgno: 146
  md: '的手段。这些研究者找到了六种主要的操纵手段，情侣利用这些手段来实现煽动或中止对方行为的意图。


    有一点需要重点关注，被研究的情侣并不是临床样本，他们之间的操纵没有产生问题。相反，这些研究者想要了解的是情侣之间彼此影响和（或）操纵的行为有哪些主要方式。最后的结果十分有趣，对于我们而言也十分有用，因为研究找到了六项在很多不同关系中都会出现的重要手段。


    意识到以下六种手段也是操纵方法，能够再次帮助你对于别人的操纵意图保持敏感。你用过下面哪些手段，又有哪些手段被别人用在了你身上？


    研究发现的第一个手段就是利用魅力。魅力策略的例子包括：


    +   我赞美了她，所以她会做某事（或不再做某事）。


    +   我表现出了自己的魅力，所以他会做某事（或不再做某事）。


    +   当我询问她时，我试图表现得亲密浪漫。


    +   在被问到之前，我就送了他小礼物或是卡片。


    +   我告诉她，如果她做某事（或不做某事）我就帮她个忙。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '第二种被情侣用来操纵对方的手段是沉默以对。例子包括：


    除非他做了某事（或是不再做某事），否则我不会理他。


    除非她做了某事（或是不再做某事），否则我会一直忽视她。


    我会一直保持沉默，直到他去做某事（或是不再做某事）。


    我拒绝做她喜欢的事，除非她做了某事（或是不再做某事）。


    第三种手段则是胁迫。例子包括：


    我要求她去做某事（或不再做某事）。


    我对着他叫喊，直到他去做某事（或不再做某事）。


    我批评她做某事（或不做某事）的行为。


    我会咒骂她，直到她去做某事（或不再做某事）。


    如果他做某事（或不做某事），我会用某些东西来威胁他。


    第四种手段是讲道理。例子包括：'
  merge: -1
  img_proc: true
- pgno: 148
  md: '我告诉她为何她应该去做某事（或不再做某事）的原因。


    我问他为什么不做某事（或停止做某事）。


    我指出了所有能够从做某事（或不做某事）中获得的益处。


    我解释了为什么我想要她去做某事（或不再做某事）。


    我展现给他看了，我很愿意为他做某事。


    第五种手段是倒退。例子包括：


    我会一直嗍着嘴生气，直到她去做某事（或不再做某事）。


    我会一直生闷气，直到她去做某事（或不再做某事）。


    巴斯与他的同事找到的第六种，也是最后一种手段，则是贬低。例子包括：


    我可以被贬低，没有关系，这样她就会去做某事（或不再去做某事）了。


    我放低了自己，这样他就会去做某事（或不再做某事了）。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '我表现得很谦逊，所以她会去做某事（或不再做某事）。


    这六种操纵手段并不只存在于情侣之间。实际上，你很可能在许多关系中都见识到了这些手段。但是，还有其他一些手段，虽然不太可能会被情侣用到，但在某些特定的关系中却很常见。比如说，工作中虽然有很明晰的权势感（老板或上司与你，你与你的下属），但操纵很可能就是以权势感作为手段，比如说你会被直接命令或引导去做某事（或不再做某事）。


    在家庭关系中，引出内疚感是一种常见的手段。它可能会被归结于胁迫这一分类，但是这里值得一提的是许多人尤其擅长在家庭操纵中利用内疚感。计算好自己的语音语调，有时候足以将合理直接的诉求变成一场内疚。母亲说着：“亲爱的，我们真的都很希望你能在假期回家，而不是和朋友出去。”只要用对了语调，就可以引发强烈的内疚感。


    手段通常一项接一项，有着固定的模式，就像等待降落在繁忙机场的飞机。比如说，如果魅力没有效果，那么接下来就会用到沉默以对或胁迫。同样，如果讲道理不起作用，那么魅力与倒退就可能会被接着用到。但是，操纵者很少将手段组合起来使用，因为它们可能会相互冲突。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '想想你生活中的人，试试将他们在让你去做或不再做某事时使用的手段进行分类。


    # 你在什么时候对操纵最没有抵抗力？


    操纵性关系可能发生在你生活中的任何时刻，但在这些情况中，你是最脆弱的：


    +   处于转折期时——从一个发展阶段到另一个（从童年到青春期，从青春期到成年人）。

    生活出现重大转变时——积极或消极，比如说结婚、生孩子、晋升或是失业。

    你在考虑生活上的改变（比如说考虑离婚）。

    你遭受了重大损失。

    你正处于一段极度不稳定、不确定的时期。


    你在这些时期会对自我重新定义，承受着非常大的压力与焦虑，有可能获得重大的收益，但也可能损失惨重。因为这些原因，你设想的获益和损失的范围与影响都会在很大程度上被强化。


    这意味着你需要在这些最脆弱的时期加强对操纵者的抵御。真正熟练的操纵者就像秃鹫，能够感觉到最弱小的'
  merge: -1
  img_proc: true
- pgno: 151
  md: '猎物在哪里。比如说，在第一份工作或新工作中，你需要的收益和回报是晋升、上级的肯定与同事的接纳，而你对此都没什么经验，这会让你很容易成为同事或老板这类操纵者的目标。


    第 2 章中的弗朗辛，对于阿尼来说就是这样一个目标。或者说，一名刚回到单身状态，但又觉得“时间不等人”的男性或女性，会十分渴求一段能够走向婚姻的关系。因为这样的需求十分强烈，因此这样的人很有可能被手握承诺的人所操纵。


    在第 8 章，你将有机会检视自己目前的需求系统。很快你将会看到，你认为自己最有可能获益或最害怕遭受损失的领域，正是最可能将你引入操纵关系的钓钩。'
