    瓦莱丽让自己慢慢平静下来。她很爱杰伊，并且很害怕逼得太紧，杰伊会离开自己。她告诉自己，再给杰伊多一点时间，她劝告自己，再耐心一些。几个小时后，杰伊回家了。瓦莱丽向他道歉，说自己不应该让他心烦，并请求他的原谅。杰伊冷淡了她好几天，才最终恢复原来的样子，于是他们又回到了正常的快乐生活。'
