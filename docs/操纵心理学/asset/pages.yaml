- pgno: 17
  md: '你是否曾经被当作牵线木偶操纵，被强迫去做自己不愿意的事，或是被强制放弃自己想要继续的事？你是否曾经试图挣脱束缚，却发现每一次徒劳的挣扎都只能让自己越陷越深？


    操纵不在乎任何关系的边界。它能够侵入你与配偶或爱人最亲密的个人关系中。它也会发生在工作伙伴与非工作伙伴之间。操纵关系会出现在家庭、组织、友谊、工作交际，甚至教堂等场合中。


    操纵亦无关年龄或性别。任何年龄、任何性取向的男性女性都可能成为操纵者与被操纵者。在人生转折点，压力、不确定性与焦虑往往会同时出现，无论转变是积极的还是消极的，都是操纵关系蠢蠢欲动、极易形成的时机。


    讽刺的是，操纵往往占据着你能从中收获最多也能失去最多的关系。包括对你来说最具意义的情感纽带，比如家庭、婚姻、爱人、同事、朋友，甚至于你的导师与建'
  merge: -1
  img_proc: true
- pgno: 18
  md: '议者们。


    如果有人正在操纵你，那么这本书就是为你而写的。


    如果你正是或曾是操纵的受害者，你很可能会感到困惑、憎恨、沮丧、无助、束缚与（或）气愤。你同样也很可能会觉得内疚、焦虑与失落，尤其是当这样的操纵已经持续了很长一段时间后。


    你可能想要知道，你是因为什么原因，又是如何被诱捕进这一段令人抓狂、毫无益处的关系之中的，这样你就不会再误入歧途。最重要的是，你想要知道，如何才能停止被操纵。这本书将会回答你的问题。


    # 控制与反控制


    当你陷入一段操纵关系之中，你其实是在不知不觉中与试图控制你的人达成了共谋。你的每一次顺从、屈服、让步，你每一次满足操纵者的愿望与意图，都让贬低自尊、人生虚无、腐蚀情感的恶性循环更加根深蒂固。


    被操纵，是一段让人高度紧张的经历。它让人不快，有损人格，使人烦扰。确切地说，它对你的身体健康也有害。


    我写这本书，是为了那些被操纵者盯上、剥削、控制的人。我不是为了启发操纵者意识到他们的伎俩与意图中'
  merge: -1
  img_proc: true
- pgno: 19
  md: '的不公平性。我也不指望直接控诉操纵者就能改变他们的想法或手段。这些都是徒劳无功的。


    相反，我写这本书，是为了让你和其他被操纵的受害者意识到你们的反控制能力，并且帮助你们掌握这样的反控制力。我意识到，被操纵者在操纵关系中将感到无能为力，然而这都是操纵者强加于你的。事实上，决定操纵者成功或失败的钥匙握在你自己手中。


    操纵能够付诸行动，是因为它有效果。只要你一直允许操纵者剥削你、控制你，那么操纵就会继续下去。然而，如果你改变自己的行为，让操纵失效，操纵者就不得不改变策略或另寻目标。


    仅指出操纵者行事不公或表达自己的不快，可能无法改变操纵者的操纵行为。直白地说，操纵者根本不关心你的感受。他们只有一个意图：追求自己的利益与目标，而这往往需要你付出代价。如果你能从一段操纵关系中获益，那仅仅是偶然。


    但是，你能够使用反控制能力来改变这段关系的权力平衡。当你不再配合、不再屈服、不再一味取悦他人、不再沉默接受、不再道歉、不再理会恐吓或威胁，不再对操纵手段有所反应，你也就单方面地改变了这段操纵关系的性质。然后，你就能停止或开始扭转操纵关系带来的情感伤害。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 操纵 VS 影响


    在韦氏词典中，“操纵”的含义是：“运用狡猾、不公、伺机欺骗的手段，控制或利用（某人某事），尤其是为了个人利益；通过狡猾或不公的方式改变别人，以满足自己的意图”。


    基于本书的写作目的以及让读者能够自我保护，我们默认被操纵是一段负面、有害的经历。操纵会加深依赖性、无助感与欺骗性。反过来，这些固化的角色也限制了这段关系以健康与平衡的方式运作与发展。在操纵的重负之下，关系会被禁锢在高度的权力不平衡之中。


    只要操纵继续下去，操纵者也会在手段上越来越强势、大胆，即使他们也会有不安全感与恐惧；受害着则会变得更弱势，甚至更顺从，即使他们会产生越来越重的敌意。


    操纵与合理、直接、光明正大的影响无关，我们也不应该将之混淆。我们都想影响他人。在某些关系中，比如说父母与孩子、老师与学生，或医生与病人，为了目标的最大利益与需要，我们会有意地影响他人，这一点对于定义操纵与非操纵来说是至关重要的。


    健康、合适的影响，往往有回报过程。它由开放、坦诚、直接的沟通引领，而不是使用威胁与胁迫的手段。而且影响的过程和意图是公开的，参与都知情。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '相反，操纵兴盛于隐晦、迂回甚至是欺骗性的交流氛围中，往往过程隐秘，意图含糊。威胁、恐吓与胁迫是其偏好的手段。操纵者会寻找诱捕、困缚受害者的机会。他们以微妙、迂回或隐蔽的方式行事，在受害者还未反应过来时就早早建立起关系中的操纵性本质。


    有些操纵者完全知悉自己的行为，而且往往是有意为之。他们能熟练使用胁迫与控制手段，以扭曲他人意愿来满足自己的企图为傲。但是，也有一些操纵者没有意识到自己的动机，他们的操纵行为不是出于刻意，而是出于恐惧、不安或其他情感因素，他们可能并不完全知悉自己行为的操纵性。但是，他们依然会运用一些手段，向操纵对象施压，让操纵对象顺从。并且他们会不断利用胁迫手段来满足自己的利益。


    无论他们的操纵是有意还是无意，操纵者一旦尝到了甜头，就会将同样的负面影响施加于受害者。在这两类案例中，受害者的顺从与妥协“奖励”了操纵者的“付出”，并刺激了胁迫与控制循环不断持续。


    # 本书的三个目的


    本书的第一个目的是帮助你更好地了解操纵是如何运作的。当你对操纵者的动机和手段有了更深入的了解，你'
  merge: -1
  img_proc: true
- pgno: 22
  md: '就能够熟练地指出周围的潜在操纵者，并在他们将你推入控制网之前避开他们。


    你会更加清楚地了解到，你在无意中与为一己之私操纵你的人形成了合谋者，而这往往以你个人的个人利益为代价。你也会发现自己的个性与心态中让你极易被操纵的那些部分。


    其次，本书将帮助你强化自己的性格，改变容易让你成为攻击目标或操纵“记号”的部分。通过让自己强硬起来，深入了解操纵者的动机与手段，你就能在现在以及未来面对操纵控制时不再脆弱。


    第三，也是最重要的一点是，本书将教给你必要的规避方法，帮助你摆脱操纵。这些规避方法适用于任何操纵关系。了解了都有哪些可行方法，你就能够选择应对方式、深入程度与对象。


    你同样还会面对一个困难但关键的问题：何时留、何时走，也就是何时改变自己的行为来修正这段关系，何时应该全神贯注于彻底离开这段操纵性关系与操纵者。


    # 谁最容易受操纵所害？


    简单来说是每个人。具体来说则是，有一些人会比其他人更容易被操纵。这些容易被左右的人或容易被攻击的'
  merge: -1
  img_proc: true
- pgno: 23
  md: '目标，对于操纵者来说就像猫薄荷一样诱人。容易受影响的人在习惯与心态上向别人暴露出了脆弱的一面，这虽然不是故意的，但是操纵者却能抓住这些线索，被这些个性中的弱点和“触点”吸引而来，继而肆无忌惮地压迫被操纵者。


    在第 3 章，你可以评估自己对操纵的敏感程度。但是首先，我希望能够带你看看五个案例分析，给冰冷的操纵算计增添一些鲜活的颜色与真切的感觉。'
  merge: -1
  img_proc: true
