  md: '操纵者认为，权力是有限的。换言之，他不会承认与尊重你自己做决定、自己控制自己人生的权力，因为他将其观点你分走了他的权力，稀释了他手中的权力。无论你留有多少权力，他都会将其视为自己的权力受到了损失。


