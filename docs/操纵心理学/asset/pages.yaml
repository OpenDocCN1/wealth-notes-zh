  md: '些重复的鬼东西吗？”


    目标：“我知道现在你很生气，但我确实需要一些时间考虑。”


    操纵者：（沉默了。）“好吧。你为什么就是不做呢。之后找我的时候告诉我你会组织这个活动。说再多也没有意义了。再见。”


    目标：“再见。”


    正如这个案例所体现的一样，这一方法对于那些坚定的操纵者也很有效果。在对话的最后，我们注意到，目标没有因为让操纵者生气而向她道歉。她也没有回应操纵者的任何问题。她只是先尽可能准确地描述了操纵者的情绪（“我知道你现在的感觉”）；然后她就像坏掉的唱片一样重复拖延时间的那些句子。


    练习这一方法的最好方式，就是你自己写脚本。你会发现，写下那些在你的生活中可能会出现的脚本，能够帮助你做好准备，并且提高你的控制能力。通过预测操纵者会说些什么（你有能力做出预测，因为你已经和她打过很多次交道了），你就能够做好回应的准备。


    你可以向支持你的朋友、家人或医师寻求帮助，让他们与你一起练习角色扮演。你可以利用你写好的脚本，也可以和你的同伴即兴创作，让你的同伴扮演操纵者。你不'
