  md: '# 第二幕：母亲家的晚餐


    萨莉来找我时，已经怀孕 8 个月了。我们在她生孩子之前一起进行了一个月左右的治疗。在这段时间中，萨莉决心学会有效的抵抗手段，来应对玛莎的操纵与吉姆的消极对抗。


    重大突破出现在孩子出生 6 周之后。她恢复了治疗，并且决定开始行动。在治疗过程中，她意识到，她应该优先考虑自己的家庭，也就是她的丈夫和孩子，然后才是她的原生家庭。她也意识到，吉姆的父母、兄弟姐妹与其他家人，对她的宝贝女儿也很重要，他们是她的祖父母、姑姑、叔叔和表亲。


    萨莉不希望自己的女儿和吉姆家庭的联系被 “切断”，因为玛莎就是这样切断了萨莉与苏西和他们父亲亲戚之间的关系。因为玛莎和她的公公婆婆关系不好，所以她根本不让他们的孙女接触，以此来惩罚他们。然而，萨莉意识到这让她和苏西失去了宝贵的家庭关系。


    我建议萨莉将苏西拉入这场与玛莎的固执对抗的战役，成为她的战友。一天晚上，她邀请苏西和她的家庭共进晚餐，就是在那时，她告诉苏西，承认与包容吉姆的家庭有多么重要，尤其是在她的孩子出生以后。


    苏西完全支持她。一天，她和萨莉一起去到玛莎家，'
  merge: -1
  img_proc: true
- pgno: 294
  md: '告诉玛莎新的安排。为了延续家庭传统，她们很愿意一个月有两个周五与玛莎共进晚餐。而在另外两个周五，会由萨莉来组织晚餐，她会邀请玛莎、她们的父亲和吉姆的家庭成员。


    萨莉和苏西一起练习角色扮演，熟悉抵抗手段，准备好应对玛莎的反应。当玛莎哭泣时，她们告诉她，她们很遗憾玛莎将这一改变视为负面的，但这是她自己的选择。她可以来参与萨莉家的晚餐，或是待在自己家里。这完全由她自己选择。


    当玛莎在几天之后给萨莉打电话，表达她的失望与怒气时，萨莉指出了玛莎的行为是在操纵，并且说明玛莎想让她感到内疚，还告诉玛莎用怒火威胁她的行为再也不会 有用了。萨莉还使用了“坏掉的唱片”这一策略，无论玛莎说什么，她都只是重复邀请她参加新的周五晚餐，来
    见她新出生的外孙女。


    玛莎并没有立刻转变自己的态度。萨莉组织的前四个周五晚餐，她都和丈夫一起待在自己家里。但萨莉一直在邀请她，并且不屈服于她激发内疚感的手段。


    最终，当萨莉的父亲决定加入抵抗战线时，玛莎屈服了。萨莉的父亲说无论玛莎去不去，他自己都会去萨莉家加入晚餐，并且他告诉玛莎，他不会忽视吉姆的家庭，切断外孙女与他们的联系。'
  merge: -1
  img_proc: true
- pgno: 295
  md: '玛莎依旧试图去操纵他们。但萨莉现在已经难以攻克了。通过改变思维方式，萨莉已经让自己不再有多余的内疚感，而正是这样的内疚感让玛莎的操纵持续了这么多年。


    现在，周五晚餐一次在玛莎家，一次在萨莉家。萨莉正在与玛莎协商，给假期和特殊的活动排个日程。


    # 第三幕：地位，地位，地位


    弗朗辛意识到阿尼的真实性格，她开始考虑自己是否依然能将他视为一名可信任的同伴。谈论正式合作协议的时刻也来临了，弗朗辛被阿尼的决定震惊了。


    阿尼说六个月的试用期结束了，他觉得弗朗辛的“才智、动力或职业道德”还无法打动他，所以他不能写下正式的合作协议。而对于弗朗辛遇上的麻烦，阿尼愿意在她今年经手的每一桩任务上都给她
    20% 的费用。除此以外，他也“没有其他办法”了。


    弗朗辛从阿尼的操纵中学到了惨痛的一课。弗朗辛实际上将这段糟糕的经历视为天真与不成熟的终结，在此之前，她软弱、取悦他人的习惯与想法，让她成为操纵者的目标。她努力地改变自己的思维模式，让自己强硬起来。并且发誓，在工作与个人生活中都要对操纵者保持警觉。


    三个月之后，弗朗辛被邀请加入一个由成功女性经记'
  merge: -1
  img_proc: true
- pgno: 296
  md: '人形成的团队。现在，她是公司最杰出的人才之一。


    阿尼的妻子提出了离婚。一年之后，阿尼被迫离开公司，他由于性骚扰而被起诉，公司为此赔付了 100 万美元。


    # 第四幕：可怕的青少年


    在那个可怕的周一之后，卡拉陷入了巨大的恐慌。她甚至有三天没去上学，并患上了神经性胃痛。


    卡拉和她的母亲接受了几个疗程的治疗。通过角色扮演，卡拉意识到那些“受欢迎的”姑娘并不是她想要的那一类朋友。她开始转变自己的思维方式，她不再为自己被利用而感到尴尬与羞耻，她相信是那些做事很坏的姑娘应该为她们的行为感到羞愧。


    “应该让她们在看到我校觉得尴尬，”卡拉说道，“我比她们强多了。”


    在父母的帮助下（他们承认自己帮助卡拉“收买”朋友的方式是错误的），卡拉转移了她的重点。她决定认真对待学习，因为十年级对于大学来说十分关键。她爱上了打排球，在来到加州之前她从未接触过这项运动。


    卡拉加入了大学排球队，很快与队友成为朋友。她意识到，搬家到加州以及青少年时期迫切的友情渴望让她成了操纵者眼中最好利用的人。'
  merge: -1
  img_proc: true
- pgno: 297
  md: '现在，卡拉已经能够带着笑容回顾初入校园时最痛苦的这一个月了。“我算是‘苦尽甘来’了，”她骄傲地说，“但我还是需要小心操纵者们。”


    # 第五幕：双重挤压


    第二年杰伊依旧没有求婚，瓦莱丽决定改变，她选择离开。在一些集中的疗程之后，瓦莱丽决定重新夺回自己生活的控制权。她意识到，只要自己一直以这种不结婚的状态和杰伊在一起，她就会一直被操纵。最终，她到达了一个临界点，继续生活在这种边缘的恐惧，已经远远超过了失去这段关系的恐惧。


    瓦莱丽给杰伊写了一封信，她告诉杰伊她决定明天就搬回自己的公寓。她告诉杰伊她不会改变自己的决定。她不会再因为自己想要结婚或组建家庭的想法感到焦虑或内疚。她再也不会忍受他的脾气以及他抛弃自己的威胁。


    她告诉杰伊，她爱他，也依旧想和他结婚。但是杰伊需要先处理好自己的恐惧。她说她真心希望杰伊能够在她遇到其他人之前做到这一点。


    最开始，杰伊气疯了，并且感觉非常受伤。他告诉瓦莱丽，她的决定正是她不是理想的结婚对象的铁证，她最终一定会像他前妻那样离开他。'
  merge: -1
  img_proc: true
- pgno: 298
  md: '瓦莱丽与杰伊分开了 3 个月。两周之后，杰伊就开始给瓦莱丽打电话，希望能看看她。但是，瓦莱丽坚守了立场。她说她唯一有兴趣和杰伊保持的关系，就是婚姻关系。否则，他们根本没有再继续下去的必要。


    离开杰伊之后，瓦莱丽经历了非常痛苦与孤独的时期。但是她已经学会了忍受这些不适，而不是屈服于杰伊的恐惧带来的“双重挤压”操纵。


    “如果杰伊真的爱我，”瓦莱丽每天都这样对自己说，“他就会娶我。否则，我就只能这样心碎与痛苦下去。”


    还好，结局是圆满的。在瓦莱丽的下一个生日时，杰伊向瓦莱丽求婚了。一个月之后他们结婚了。'
