- pgno: 160
  md: '其他（请注明）：


    再一次，对于得分超过3分的选项，写一到两段话描述自己的担心或恐惧是怎样的。


    # 保护你的脆弱点


    现在，你对自己最深层次的需求与最强烈的恐惧与忧虑都有了更好的理解。这样，你就能够知道操纵者是如何控制你的。当然，最关键的是你能够从操纵者之中找出“好家伙”，也就是真正把你的利益放在心上的非操纵者。基本原则是这样的：爱、友谊与好意往往会让你有安全感，并且不复杂，而操纵则会让你觉得被胁迫、被限制，十分复杂。


    如果一名熟练的操纵者对你承诺，能够给你最渴望的东西或让你避开最希望避开的东西，他（她）很可能会向你的需求系统扔出诱饵。如果你咬了饵，就会上钩愈深。


    如果操纵者之后表示，你的行为与行动将会决定收益是否能实现或损失能否避免（这就是诱饵），操纵的种子就已经播下了。除非你采取行动抵抗他（她）的控制，否则你的个人自由将岌岌可危。你最想要的东西和最害怕失去的东西正是操纵者会扔出钓钩，试图操纵你的领域。'
  merge: -1
  img_proc: true
- pgno: 161
  md: 记住，最开始操纵会伪装成“良性的影响”，但是一旦操纵转向胁迫，压力慢慢累积，操纵者就能够完全控制你。因此，这也是为何你在阅读前面两个列表时要对自己保持诚实。只要了解你自己真正的渴望与最害怕失去的东西，你就能够比那些想要利用你的渴望的潜在操纵者更胜一筹。知道他们是谁，让你能够保持敏感，在操纵来临时更好地发现它。
