  md: '# 找出你们之中的操纵者


    将这一章当作了解操纵者的指南。我会为你写明几种操纵型人格最核心的特点与风格。


    谁是最常见的犯罪嫌疑⼈？他们⼀般都出现在哪里？


    第⼆个问题的答案是，操纵者就存在于你的⽣活半径内。他们就在你平时接�触的⼈之中，既可能是与你⼗分紧密、亲密切系关系的⼈，也可能是与你有着更加正式、组织关系的⼈（比如说在⼯作上认识的⼈）。


