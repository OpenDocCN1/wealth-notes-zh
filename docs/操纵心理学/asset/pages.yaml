- pgno: 59
  md: '觉到某些或所有这些脆弱点，因为它们正是你生活中的压力或问题的来源。但是，你可能并没有完全认识到，也正是这些脆弱点在让你反复成为操纵的受害者这件事上扮演了怎样的角色。


    # 第一个按钮：


    # 你有取悦症——取悦他人的习惯与倾向


    有“取悦症”的人习惯或倾向于取悦他人，而这样的习惯倾向并不是好事。取悦他人是一个奇怪的问题。乍一看，它似乎根本不像个问题。实际上，“取悦他人者”这一标签看起来更像是称赞或讨人喜欢的自我描述，你会很骄傲地将它作为一种荣誉勋章。成为取悦他人者不是很好吗？它难道不应该是一件好事？


    真相是，取悦他人是对一种思维、感知、行为模式的美化，它可能会发展成严重而影响深远的心理问题。“取悦症”，或者说取悦他人综合征，是一种强迫性（甚至上瘾性）的模式。取悦他人的人会感觉被取悦他人的需要所控制，并且习惯于获取别人的允许。与此同时，一味取悦他人会给你的生活带来压力与要求，而这些压力和要求会不受你控制。


    如果你有“取悦症”，你会极力取悦他人，而并不只局'
  merge: -1
  img_proc: true
- pgno: 60
  md: '限于不拒绝别人或过于优先为他人服务。如果你是一名取悦他人的人，你会常常感到别人需要你，或对你有所期待，而你的情感仪表盘会因此卡住。只是感知到“也许有别人需要你的帮助”，就足以让你不停地取悦他人，形成压力。


    问题在于，当你患有“取悦症”时，你的自尊完全建立在你是为他人做了多少事、你在取悦他人时做得有多成功之上。你也许会认为，满足了他人的需求，你就掌握了神奇公式，能够用它来获得爱与自我价值，使自己免于被抛弃和拒绝。然而，事实上这一公式具有严重的缺陷。它并不起作用。此外，取悦他人会让你受到伤害，因为你在照顾他人需求时，往往会牺牲你自己的需求。


    取悦他人者为了善待他人，付出了太大的代价。如果你是一名货真价实的取悦他人者，你就会知道“友善”这个概念对于你的自我认知来说有多重要。取悦他人者深深希望他们能被看作好人。他们的身份认知取决于他们有多好。


    然而，做好人的代价就是人们可以操纵并利用你想要取悦他们的意愿。你的善良会让你对正在被操纵和利用的事实视若无睹。毕竟，对你正在拼命取悦的人的动机提出质疑是不好的，不是吗？


    更糟的是，即便你感觉到了自己正在被操纵，可是你实在太善良了，所以不想直接对抗、批评或开展直接、直'
  merge: -1
