  md: '人物不情不愿地挪了挪位置，让卡拉坐在他们吃午饭的长椅末端。其中一个女生称赞了她的穿着，这让卡拉感觉好了些。这就像是一次破冰。另一个人问卡拉她的父母是做什么的，卡拉大肆宣扬了一番她父亲的名气。她还让大家知道她们家很有钱。当她打开钱包付饮料钱时，这些人也能看见里面一叠一叠的钞票。女生们于是有了兴致，开始讨论去哪里买衣服、鞋子和化妆品。午饭后，卡拉相信她在人际交往方面迈出了切实的一步。


