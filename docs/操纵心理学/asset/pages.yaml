- pgno: 57
  md: '本章我们将开始更深入地研究那些让你被操纵者盯上的个性与倾向。我希望帮助你更加清醒地认识，你无意间暴露在别人眼中的那些让你容易成为操纵者目标的敏感点“按钮”。后文我们还会讨论你能够做些什么来让自己不那么容易成为操纵者的目标，以使你尽量避免被控制。


    我的目的不是解释你为什么以及如何形成了这些脆弱点。真意义上讲，探讨“为什么”是一个很奢侈的问题。探索你为什么会成为重点目标也许很有趣，但是更重要的是改变你的思维方式与行为，从而降低你受影响的程度。因此，你为什么会形成这些易受操纵的脆弱点并非本书的主要目标，本书最看重的是你能够更有效地意识到这些弱点，并且最终找到保护自己不受操纵的方式。


    我必须要重申这一点：任何人、每个人在面对经验丰富的操纵者时，都可能会受影响，尤其是当操纵者小心伪装与掩盖自己的动机、意图与手段的时候。如果你是一名受害者，那么你不是一个人。然而，你也要了解某些特定'
  merge: -1
  img_proc: true
- pgno: 58
  md: '的人非常容易被操纵者盯上。在第 3 章中，你已经知道了自己的脆弱点得分。鉴于你有可能就是容易被操纵的那一类人，让我们先看看，潜在的操纵者是如何盯上你的。


    # 你的按钮是什么？


    操纵者是通过哪个按钮来向你施加压力的？操纵者盯上的目标，会在他们的个性中展现出这全部七种或某几种脆弱点。这些个性化的思维方式、感受方式和行为方式让他们很容易中操纵者的招。


    想一想这七种构成你按钮的脆弱点。无论你是否意识到了它们，你的按钮正暴露在外。操纵者往往在控制他人以满足自身需求与目的上很有经验，也就在识别目标上有着自己的第六感。他们通过寻找人们个性中容易被他们利用的地方，来选取目标。通常他们很轻松就能做到这些，因为一般人都毫无戒备，将自己的按钮暴露在外。而对于你来说，这就如同在广而告之自己的秘密。


    你很有可能会发现自己有好几个方面的脆弱点，因为你所有或绝大部分的按钮都和我描述的一样。这是可以预见的，因为这些按钮之间从心理学角度看都是相互联系的。


    远离操纵关系、迈向安全地带的 第一步，取决于你发现、识别与理解自身按钮或脆弱点的能力。可能你已经感'
  merge: -1
