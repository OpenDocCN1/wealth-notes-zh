    # 第五幕：双重挤压


    瓦莱丽感到岁月不等人，这让她十分紧张。瓦莱丽现在 37 岁，至今未婚。她和杰伊交往了三年，两年前开始同居。杰伊曾经结过一次婚，没有孩子。


    这段关系开始的时候，瓦莱丽就很清晰地说出了自己的渴望，她想结婚生下孩子。杰伊则说他喜欢孩子，只要他确定自己找到了对的人，他很乐意成为一位父亲，也相信第二段婚姻会成功。杰伊经历过父母婚姻破裂，所以他说绝不希望自己的孩子经历这样的伤痛。


    杰伊的第一段婚姻以激烈的纷争告终。他为此付出了很多钱，也很伤心。这也给他留下了很深的伤痕，让他很难做出承诺，以避免再一次失败。


    瓦莱丽确信，她就是杰伊的“真命天女”。她搬去和杰伊一起住，虽然没有得到杰伊的承诺，但她感觉结婚已经近在眼前了。然而，她把行李卸下的瞬间，这种感觉就消失了。


    他们同居后不久，瓦莱丽就提起结婚。杰伊解释说，'
