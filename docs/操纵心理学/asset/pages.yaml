  md: '# 序言 你并不孤独


    纵观我的职业生涯，我一直对人们出于善良（却往往误入歧途）的初衷而形成的心理问题很感兴趣。20世纪80年代中期，妇女运动的浪潮改变了美国劳动力与美国式生活的根基，我就是在那时写下了《E型女性：如何克服想要取悦所有人的压力》（E
    即 Excel 的首字母，指意图在各个领域都出类拔萃的女性——编者注）。此书对比了男性与女性面对的不同类型的压力。更明确地说，它研究了女性以牺牲自己的健康与福利为代价，试图满足所有人的要求与期待，以及这种想要做到“十全十美”的徒劳尝试所引起的持续不断的压力循环。


    近20年后，全美乃至全世界的高成就女性，如今仍与E型这一概念契合。她们雇用我为她们的事业提供咨询服务，邀请我做主旨发言，并且成了我的广播与电视节目的最棒受众，她们也是我临床实践的案例。


    无论多有权势、多成功，E型女性总会告诉我，她们想要让其他人更快乐，以及这种渴望如何将她们变成破坏性'
  merge: -1
  img_proc: true
- pgno: 10
  md: '操纵关系中的牺牲者。


    就在几年前，在另一部名为《取悦症候群：治愈取悦他人综合征》的书中，我重新审视了 21 世纪风格的取悦他人这一话题。这一次，我创立了一个网站 www.DiseaseToPlease.com，让读者能够和我，以及其他取悦他人者沟通交流，并从这样的线上互助社区中受益。


    从 2001 年《取悦症候群》出版以来，我就不断在网站留言簿收到来自受此问题困扰的男性、女性发来的邮件与信息。这些信息的主題无一例外是：这些取悦他人者的好心，让他们成了操纵者眼里的冤大头。当操纵者剥夺他们的自由、自我方向与自我控制时，他们表现出的受害者状态，又会造成更深、更具破坏性的情感问题。


    这些信息对我来说明确且振聋发聩：我的读者确实能够借助一部好的自助书籍冲破操纵者制造的迷惑之雾。他们需要更好地理解，他们是为何、由谁、在何时、以何种方式被操纵的。当然，最重要的是他们需要知道如何行动才能停止这样的被操纵。


    然而，不要误会，取悦他人者绝不是唯一容易被操纵的群体。经历了近 30 年的临床心理学与管理咨询顾问的工作，我对此深有感触。我亲眼见证了不同背景、个性迥异、年龄不一、经济教育状态与社会地位截然不同的病人与客户，如何因操纵而受到痛苦且极具破坏性与摧'
  merge: -1
  img_proc: true
- pgno: 11
  md: '毁性的影响。


    有些人的确会比其他人更容易成为目标，但是在技巧纯熟的操纵者面前，没有人能够真正完全免疫。我曾经与一些病人以及企业客户接触，他们从未觉得自己需要看心理医生，直到他们发现自己正被别人捏在手心，无法从操纵心爆表的配偶，控制欲超强的领导，野心勃勃的下属，手段卑鄙、与自己竞争的同事，让人产生负罪感的母亲或是不可靠的朋友手中将自己解救出来。而操纵者远不止这些人。


    我自己对操纵关系的经验远不止是职业兴趣。我曾经亲身体会受到被操纵给自尊、幸福感、情感与心理健康带来的巨大伤害。我曾经卷入胁迫与操纵的阴暗之网，而我再也不想有这种经历。


    为了保护自己，也为了那些向我寻求专业帮助的人，我努力开发技巧与策略来抵御操纵。我写下本书，与广大读者分享这些技巧。我的目标很简单，就是帮助读者打破被操纵的枷锁，重掌对生活的控制权。


    对于本书的读者，我有几条重要的告诫。本书讲的是情感或心理操纵。那些用身体暴力或是威胁进行身体暴力作为控制手段的关系，并不适用本书。


    身处身体暴力关系的受害者根本没有闲暇来阅读这本书，至少不是现在。你必须马上行动起来，从生理与心理'
  merge: -1
  img_proc: true
- pgno: 12
  md: '上与虐待你的那个人保持尽可能远的距离，以此来保护自己与他人。


    这本书同样不适用于那些被酗酒以及（或）嗑药的人操纵的人。酒鬼和瘾君子受摄入的迷醉品影响，心智状态极不正常。除非他们能控制自己的成瘾问题，否则你根本没法和他们有效沟通。只要他们继续酗酒或吸毒，问题就会继续存在。操纵是他们病症的一个核心症状，你需要成为解决方式的一部分，而非问题的一部分。


    最后，这本书也不适用于那些受强迫而违法的人。无论是工作中想让你“做假账”的无良老板，欺骗他人却想让你对此缄口不言的男友或女友，还是其他强迫你违反法律的人，你都必须立刻离开这名操纵者、结束这段关系，不留任何协商空间。


    除去这些例外，这本书适合所有人。我为什么确信这点？因为我还未曾遇到过从未在生活中被别人操纵的人。因此，所有人都能够学会抵制操纵，并让自己因此获益。如果你现在恰好是操纵关系的目标或受害者，希望你能够宽慰自己并不孤独。数以百万计的人都有被操纵造成的不良感受——无法减轻伤害或打破这种恶性循环的无力感。


    而这正是操纵者想要你感受到的。


    我强烈希望本书能使你更清楚自己面临的问题，改变'
  merge: -1
  img_proc: true
