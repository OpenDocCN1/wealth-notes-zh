- pgno: 65
  md: '言之，他们都不需要说出来或者十分直接地威胁你要拒绝你，不再认可你、接纳你。对你来说，这种威胁无言地存在于各处。


    矛盾的是，你越是待人友善、取悦他人，以保证他们对你的认可与接纳，你就越没有安全感。你越是想表现得友善而不是表露真情实意，你就越是会被反复出现的疑虑、不安全感与持续的恐惧所困扰。


    如果你的认可上瘾症状由来已久，那么在操纵者眼里，你最暴露在外的按钮，就是你愿意做任何事，来避免不被认可、拒绝，以及最糟糕的，被抛弃。


    在逐渐成为操纵性的恋爱关系或是情感纠葛中，害怕被抛弃这一想法，正是控制的关键杠杆。


    # ### 第三个按钮：

    ## 你有“情绪恐惧症”——你害怕负面情绪


    认知行为治疗学家大卫·伯恩斯（David Burns）提出了“情绪恐惧症”这一名词，用来指称对于负面情绪的过度或非理性恐惧。具体来说，恐惧的对象包括怒火、侵犯、敌意以及引起这些情绪的冲突与对抗。如果这就是你的敏感按钮，那么你会愿意付出一切代价来避免怒气、冲突与对抗。'
