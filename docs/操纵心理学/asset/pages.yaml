  img_proc: true
- pgno: 301
  md: '# 出版后记


    操纵关系是一种有毒的关系，它会侵蚀自尊，摧残心灵，虚耗人生。操纵关系也是我们如今要面对的一种心理疾病。


    哈丽雅特·B·布瑞克博士是美国著名的临床心理医生，拥有30年临床心理和管理顾问的经验，长期的执业经历让她观察到普通人生活中形形色色的心理问题。人们要么忽略这些心理问题，要么无计可施。而布瑞克博士从心理理论、研究和临床技能等方面着手，通过案例分析了人们在生活中不以为意的心理问题，比如受人操纵、取悦症、E型女性。在《操纵心理学》一书中，布瑞克博士分析的就是操纵和被操纵的扭曲关系。这种关系不论是谁都会遇到，而操纵者也可能是身边的任何人，比如野心勃勃的下属、好发号施令的上司、爱暗中较劲的同事、好指使人的配偶、总是抱怨的朋友、激起你愧疚心理的父母。


    对于这一关系，布瑞克博士没有简单地将责任归咎于操纵者或受害者，她认为操纵关系的存在，操纵者和受害者都有责任，双方都需要正视自己的心理问题。因此她详'
  merge: -1
  img_proc: true
- pgno: 302
  md: '细解释了操纵者有哪几种类型，容易受操纵的受害者又有哪些人格特质。比如必须防范的9种操纵类型：马基雅维利型、纳西索斯、边缘型、依赖型、表演型、被动攻击型、A型、反社会型、成瘾型；以及容易被人得寸进尺的7种人格特征：取悦症、赞同瘾、负面情绪恐惧症、无法说不，没有存在感，自尊心低、认为自己无法控制生活。


    一旦我们明白自己的哪些想法和行为会让操纵者钻空子，致使自己陷入受人摆布、压力顿生的被动境地，就可以学到许多有效的对策，也能够识别操纵者的图谋，从控制网中逃脱。而无意识的操纵者也可以明白自己的哪些行为已经形成操纵，并了解到怎样做能纠正自己的心理问题。摆脱操纵的7个诀窍就是：缓兵之计、磨练话术、钝化焦虑、有勇气揭露操纵事实、锻炼妥协和协商技巧、冷静的力量、对时间有耐心本书所阐述的分析和对策，是为了帮助深陷操纵泥淖的人，受人操纵感情的人，被拖拽进操纵游戏的人，也是为了让普通人建立更健康更舒适的人际关系。


