  md: '任何人、每个人都抵挡不住一名技巧纯熟的操纵者，尤其是那些能够很好地伪装或掩盖自己动机、意图和手段的操纵者。然而，尽管在特定的情境下，任何人都可能被操纵，可是有些人如同行走的靶子：他们看起来就像是会被操纵的对象。


