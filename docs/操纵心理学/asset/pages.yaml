- pgno: 233
  md: '舒服的情绪。到目前为止，你负面情绪的导火索都太短了。结果就是，当操纵者点燃了你的焦虑、恐惧或内疚之后，它很快，有时甚至是立刻，就会蔓延开来，从而催发了强化操纵循环的屈服与顺从。


    你接下来将学到的脱敏技巧，能够帮助你忍受一些负面情绪，让你不会像之前的老习惯那样，向操纵者的需求屈服。


    首先，让我们给名词下个定义。焦虑是一种没有客体的恐惧。这意味着焦虑更多的是一种抽象的、广而泛之的恐惧。和直接的恐惧不同，焦虑并不与某个特定的结果相连。当你觉得焦虑时，你可能是在担心许多不同的事。对一件事的担心会引发连锁反应，从而导致极大的焦虑。焦虑会让你觉得格外紧张，有压力，却没有具体的焦点。


    操纵者会通过触碰你的安全感按钮或激发你的自我怀疑来触发你的焦虑。焦虑的等级会随着不确定性提高。操纵者会用模糊不清的语言来描绘未来可能会发生（或不会发生）的事，引发受害者的焦虑。能伤害你自尊的负面反馈与批评，将你与别人放在一起做微妙而恶意对比，这些都是操纵者喜欢的手段，而它们都会增长你的焦虑。


    恐惧则与具体的结果相关。操纵者通过唤起目标的恐惧，来恐吓他们服从于自己的需求。操纵者使用的恐惧一'
  merge: -1
  img_proc: true
- pgno: 234
  md: '般包括：


    对否定的恐惧


    对抛弃的恐惧


    对生气的恐惧


    对冲突与正面对抗的恐惧


    对改变或犯错的恐惧


    对拒绝的恐惧


    对被孤立的恐惧


    恐惧和焦虑都很容易形成习惯。这意味着操纵者让你感觉到这些负面情绪之后，即使当他不是在刻意激发这些情绪，你也会因为他的存在而觉得恐惧或焦虑。


    内疚，是一种人类特有的情感。它源于对他人感情或经历的过度责任感。如果你很脆弱，或很容易感到内疚，熟练的操纵者就会乘虚而入，利用你的这一脆弱点，让你走上顺从之路。


    操纵者会向你表露出自己有多不快乐，从而让你觉得他的不开心都是你的责任。操纵者可能会哭，会生闷气，会面露不悦，或扮演受害者、殉道者的角色。他可能会抱怨自己因为压力而产生的痛苦与问题，而你需要为此负责，因为你做了（或没做）某些事，让他失望了。某个特定的'
  merge: -1
  img_proc: true
- pgno: 235
  md: '表情（比如说看起来很受伤）或特定的语调变化都可能会引发内疚感。


    如果你是一名取悦他人者，仅仅是考虑拒绝别人请求，都可能会感到内疚。一旦操纵者找到你的情感热键，他就能轻而易举地通过你的内疚感控制你。操纵者甚至什么都不用做，你已经都为做好了一切。


    生活中的操纵者也许会使用一两种或所有这三种负面情绪来恐吓你、胁迫你、控制你。无论他们如何利用焦虑、恐惧与内疚，你在面对自己的负面情绪时的做法都是有缺陷的。简单来说，你无法忍受这些负面情绪，因此你会将它们看作需要立刻消除，或至少尽快制止的东西。


    当你感到焦虑、恐惧或内疚，你的反应机制会自动调整到紧急状态，就像是三起火警突然爆发一样。操纵者仅仅将消防水带递给你，指给你的却是顺从他需求的方向。但是，你所感受到的急迫感，来源于操纵者给你的压力与你对负面情绪的过度反应，紧急状态并不真的存在。


    要抵抗操纵，你就需要改变自己应对负面情绪的反应。事实是，即使你没有立刻安抚操纵者带给你的焦虑、恐惧与内疚，你也不会就此自我毁灭。这些情绪肯定会让你觉得不舒服，但这样的不舒服是能够容忍的。实际上，你越是让自己长时间暴露在负面情绪中，这种不适感就越可能会减少。心理学家将这种现象称为习惯化。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '但是，要习惯你的恐惧、焦虑或内疚，让它们的强度降低，你就必须抑制自己穿过白门，获取暂时舒缓的冲动。记住，如果你每一次应对恐惧、焦虑或内疚的方法是服从操纵者的要求，你就是在强化操纵的循环。


    随着你训练自己忍受不适感，从而在行为上做出积极、健康的改变，你的容忍度也会提高。面对操纵者制造的负面情绪时，不再恐慌或过度反应，而是将它们重新定义成为了实现建设性的改变必须付出也值得付出的代价。


    改变自己的反应，让自己在应对负面情绪时不再恐慌、忙乱，还有另一个原因。紧急状况会造成一种被称为情感推理的思维误区。它发生在你将负面情绪与某些坏事正在发生或将要发生的思维混淆在一起的时候。负面的感觉越强烈，它对你的思维方式产生的影响就可能越大。


    比如说，你虽然害怕操纵者的怒火，但是这件事并不一定意味着真的会发生什么致命的结果。操纵者很可能最终会消除他的怒火，而你也能够容忍自己的恐惧，尤其是在下面这些脱敏手段的帮助下。你因为没有立刻满足家庭中操纵者的需求而导致的内疚感，并不一定就会导致你们之间的关系被彻底摧毁，也不意味着你会失去他们的爱。


    当你应对负面情绪时，降低紧急程度，或降低这些情绪的程度，都能够有效矫正强化操纵循环的情感推理。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '你并不仅仅是靠自己的意志力来改变你应对恐惧、焦虑与内疚的反应。相反，你会因为脱敏这一有力的心理学技巧而获益。它是这样的：


    脱敏的基本原则是你在感觉害怕、焦虑或内疚时，不可能会同时觉得放松。你肯定会同意这一点，它在表面上看来完全符合逻辑。然而，当你回忆起操纵者给你带来的强烈负面情绪之时，你可以通过行为调节，用深呼吸让自己调整到放松的状态。


    要实现调节，你需要回想一下操纵者的行为给你带来 的恐惧、焦虑或内疚，从而被迫服从操纵者需求的场景，至少回忆三个场景，多多益善。使用你脑中的鲜活记忆。写下每一个例子，尤其注意描述让你觉得不适的操纵者的语言与行为。同时，也尽可能细致地形容你自己的恐惧、焦虑与内疚。


    然后，将这些描述念出来，用一台录音机把这三个例子都录下来。当然，加上更多润色或修饰会更好。只有你自己可以听这些录音。这样做的目的是重塑焦虑、恐惧或内疚的经历。


    你可以将脱敏的要素这样组合在一起：躺在一张舒服的床或沙发上，将准备好的播放器放在身边。首先鼻子深深吸气，然后等上一到两秒，再从嘴巴完全把气呼出去。持续缓慢、有节奏地呼吸。很多人都发现，这样的深呼吸'
  merge: -1
  img_proc: true
- pgno: 238
  md: '可以帮助他们想起海浪冲上海滩又退去的过程。


    当你呼吸时，将注意力放在你的胳膊与腿上。你在深呼吸的时候专注于这个念头：“我的胳膊和腿正变得温暖而沉重。”让身体慢慢陷入柔软的床铺或沙发时，注意你的四肢究竟感觉有多沉重。


    完成两到三分钟的放松呼吸之后，就可以准备打开播放器了。听第一段录音时，保持深呼吸，继续放松身体，在心里清晰地再现正在描述的场景。你要一边聆听自己描述的这些负面情绪反应，一边将你自已放置在的那个场景，试图体验到相同的感觉。


    现在，脱敏的关键就在于尽可能地保持身体放松，与此同时，再现那些让你产生负面情绪的场景。在让自己重新感到焦虑、恐惧与内疚的同时，关注自己是如何通过深呼吸与身体放松控制自己的感觉的。


    在第一段录音结束之后，关上播放器。牢牢记住重现的场景。尝试真正感觉你记忆中留存的那些负面情绪。再次注意你的呼吸节奏。现在对自己说：“我可能会觉得焦虑、害怕或内疚，但是我能忍受它们。我很好。”继续深呼吸，让你的四肢觉得沉重、温暖。


    播放另外两段录音时，继续这样的练习。每一次，都注意让自己深呼吸、肌肉放松，你就能够应对恐惧、焦虑或内疚带来的不适。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '结合放松与场景重现，用这一方法至少每天练习两次，并持续一周到两周的时间。随着你的每一次练习，你都能更容易地实现将负面情绪与身体放松的结合。你的脱敏工作越熟练，在真正将它应用于抵抗策略时就会越有效果。


    在操纵的实际设定中，脱敏是一种安静但有力的抵抗方式。当操纵者通过施加压力的方式，试图唤起那些你现在已经很熟悉的焦虑、恐惧与内疚感，你会立刻反应过来：“我现在觉得害怕（或是焦虑、内疚），但是我能够容忍它。我很好。”随着你通过深呼吸练习让自己的呼吸有了规律的节奏，你还能够回想起放松的感觉。


    抵抗，就来自你不去做的事：你不会再急匆匆地去顺从操纵者的需求，因为你急切地想要安抚坏情绪的习惯已经被打破了。你能够忍受那些强度会降低的负面情绪，因为你进行了脱敏训练，并且你已经实践了自然的习惯化过程。


    # 步骤 4：给操纵贴标签


    只要你与操纵者之间的默认协定没有改变，操纵的权力也不会发生改变。然而，当你能够清晰、直接地将这段关系定义为操纵，打破这一“共谋”，揭露出被隐藏起来的议题，权力平衡就会重新开始偏向你这
    一边。


    这一抵抗的核心，是你能够用直接的语言准确地说出操纵者究竟在做什么。大声将操纵形容出来，你就迈出'
  merge: -1
  img_proc: true
- pgno: 240
  md: '了一大步，开始扰乱并最终阻止操纵。直接、清晰的沟通（尤其是当这段沟通是关于操纵本身时），就像对吸血鬼直接举起十字架。大多数操纵者都会因为被“戳破”而选择退缩，他们施加的压力瞬间就会干瘪下去了，就如同被戳破的气球一样。


    如果你准备直接在操纵者面前给他贴上操纵标签，你需要一些准备与练习。首先，从最近的记忆中选择一个例子。你也可以选择脱敏疗法中出现的例子，或其他任何操纵者通过胁迫手段让你服从他的例子。


    分析操纵的最佳方式就是运用我教给病人的“ABCD公式”。这一模型将会帮助你找到操纵者使用的手段与你的感觉之间的联系。重要的是，它能指出现行操纵手段的替代方法。


    回想一下你被操纵的一次经历，完成下面这些句子：


    （行为 A）“当你做（描述操纵者让你觉得不高兴、受伤或不适的行为），


    （感情 B）我感觉（说明你的感觉）。


    （可以替代的行为 C）如果你可以停止（行为 A），并且（描述另一种非操纵性的行为），


    （感情 D）我就会觉得（说明你希望的情绪）。”'
  merge: -1
  img_proc: true
- pgno: 241
  md: '下面这个例子来自我的病人，她有一位操纵欲十分强的丈夫。她说的是：


    +   （A）“当你抬高声音对我吼叫时，


    +   （B）我觉得很害怕，很焦虑。


    +   （C）如果你能够停止吼叫，用冷静的声音说出你的需求，


    +   （D）我会感觉被尊重、被珍惜。”


    让一位支持你的朋友或医师帮助你完成角色扮演。设定好场景，请一位同伴像操纵者那样行动。让同伴按照操纵者惯常的方式做事或说话。然后，你就可以演练给操纵贴标签来进行抵抗的方法了。


    利用ABCD模型，列出操纵行为、你的反应、更好的取代方式和随之的新反应。尤其注意对情感的描述。通过使用“我感觉（感情）”而非“你让我感觉（感情）”，你就是在为自己的情绪负责任，而非指责操纵者。尽管你可能会觉得实际上操纵者的确要为你的坏情绪负责，但为自己的感觉指责他人其实是操纵者的风格，而不是你的。我们推荐的方式会更有效果。


    练习让你的声音低沉有力。坚持ABCD模型。你不需要再解释或说些什么。记住，这一步仅仅是给操纵贴上'
  merge: -1
  img_proc: true
- pgno: 242
  md: '标签。


    你需要学会最后一句话来完成这一步。回到行为 A, 然后以直接但不激动的方式说：“我理解做出（行为 A）是你自己的选择。现在你知道，当你做（行为 A）的时候我是什么感觉了。”


    从某个意义上说，这一句结束语是对操纵者的“疑罪从无”。如果你没有向操纵者解释过你的情感反应，也许他并不知道他的行为对你有怎样的影响，这一句陈述能让以往的借口都失去效用。


    一旦你给操纵贴上榜标签，并且告知操纵者你的感受，球就被传回到了他那里。现在，如果操纵者的行为继续下去，你就能够判断，他的意图就是让你感受到那些驱使你屈服的不适情绪。


    当你进行了足够的练习之后，下一次你就能够在操纵者运用施压手段时准备好用贴标签这种方式抵抗。你也就为下一步抵抗做好了准备。


    # 步骤 5：让操纵失效


    步骤 5 是你迈向自由的关键。你可以用一种安静的方式告诉操纵者，他们的手段不再能够让他们实现自己的目的了。


    回忆你最近几次经历的例子。找出一个操纵者在你'
  merge: -1
  img_proc: true
- pgno: 243
  md: '身上寻求的特定目的。操纵者想让你做什么？说什么？如果你无法定义一个固定的目的，可以看得更宽泛一些（见下）。利用操纵者的目的来完成下面这个句子：“我知道你想要我（操纵者的目标）”或是“我知道你想要你做你希望的（不固定的大类）”。


    现在看看下面这个列表，圈出操纵者为了实现她的目 的会使用的手段。如果有其他手段，还可以增加。


    +   沉默以对

