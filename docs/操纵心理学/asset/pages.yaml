    利用外控型思维来看待生活还有一些其他缺点。外控型的人会比内控型的人自尊更低。并且当你不觉得自己能够有效改变你的生活时，那么你可能根本不会去尝试或有动力将随机的运气转化为能够抓住的机会。


    外控型人格会让你更容易抑郁，因为它会产生习得性无助——也就是坏事还会发生，而你无能为力的感觉。除此之外，外控型思维甚至还可能损害你的生理健康，因为它会制造出一种“放弃”的心态，阻碍你从大病中恢复过来的进展。


    纠正这种软柿子思维的方法很直接：改变自己，以内控型的思维看待这个世界。你要真的相信你能够改变，你就是自己生活的主角，像这样去思考与行动。


    要转化成强硬的、内控型的思维心态，你并不需要相信自己能够控制所有的事。但是，你必须着眼于生活中那些你确实能够施加控制的事，并且行动起来（这是关键）。


    随着你将思维转向内控型，你将会收获自我满足这样的心灵益处。而当你用软柿子、外控型的思维看待世界时，你认为其他人比你自己对发生的事影响更大。因此，当你成为操纵的受害者，你会强化并延续外部力量拥有控制权'
