    软柿子思维：“友善待人常常让我不会向他人表露负面情绪。”


    纠正过的强硬思维：“我会意识到，有时直接说出心里的真实想法会更好，即使会有负面的情绪，也比闷在心里，导致抑郁、焦虑或不健康要强。”


