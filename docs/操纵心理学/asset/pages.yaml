    # 如何纠正“优先满足他人”的思维？


    调试指南：如果你总是将他人的需求放在你自己的前面，没能好好照顾自己的需求，那么很可能最终你会无法照顾到那些对你来说最重要的人的需求。在满足他人需求的同时也照顾你自己的需求，这是完全可能的。自私与争取自身利益有着很大的不同。后者是一个健康、人人都有的目标。


    如果你没能告诉身边的人，你也有自己的需求，他们也有责任像你满足他们的需求那样满足你的需求（在适度的基础上），你就很可能会被看作容易被操纵的人。一昧给'
