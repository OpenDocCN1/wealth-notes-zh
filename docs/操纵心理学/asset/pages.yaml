- pgno: 67
  md: '完全避免负面情绪，既不值得，也不可能。


    怒火，并不一定是不好或不健康的。极力掩饰、伪装、忽略或避开怒火，来抑制或长期压制怒气才是不健康的。你是否发现自己在表面上否认对另一个人的怒火与愤恨（尤其是当那个人在操纵与控制你时），但内心却深感焦虑、恐慌与压抑？


    根据心理学上的定义，沮丧来自你对自己的愤怒。在沟通不足、无法直面问题来加深相互理解，以及无法获得解决措施的关系中，焦虑、失眠、易怒的症状就会伴随而来。


    我们能够也应该以建设性的手段来处理冲突。只有这样 做，我们才能够从人际关系中获益。避免冲突并不能证 明关系良好。恰恰相反，它意味着严重的问题与沟通不畅。


    # 第四个按钮：缺乏魄力，无法拒绝别人


    如果你是一名取悦他人者，并寻求所有人的认可（也就是按钮一和按钮二），那么你很可能也会是一个无法对别人说“不”的人。“好”这个词也许是对取悦他人者个性的最好描述，“不”这个词则基本不会出现在他们的生活中。如果你是一名取悦他人者，那么十有八九，你很难拒绝来自任何人的直接或间接要求、需求、欲求、邀请或请求。


    拒绝他人会让你感到内疚或自私，你将拒绝他人等同'
