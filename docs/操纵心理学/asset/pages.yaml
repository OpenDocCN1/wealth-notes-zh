  md: '害。如果你无法依靠自己的判断与价值观来引导你的决策，那么你就必然会倾向于依靠别人的判断与指引。如果你不能成为自己的可靠咨询师，那么你很容易被操纵者盯上。


    低自我依赖性的软柿子思维就像是这样：


