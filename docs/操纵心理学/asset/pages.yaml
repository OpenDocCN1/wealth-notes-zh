- pgno: 228
  md: '的喘息时间永远是短暂的。很快，他（她）就会制造出相同的不适，让你服从于他（她）的另一个要求。


    只有你自己能够打破这样的恶性循环。你必须下定决心，改变自己的行为，从顺从走向抵抗，割裂已经形成的负强化联系。正如你很快将学到的，除了向操纵性压力屈服，还有其他更多能够改变负面情绪的有效且长期的办法。


    相信这一事实：当你的行为改变，你的感觉也将改变。但你必须先行动做起，然后你的心就会跟上。随着你不断抵抗操纵，你的负面情绪最终会转变成快乐，甚至是轻松感、有力感，以及重获自由感。


    # 步骤 2：坏掉的唱片


    自然地，操纵者可能会反对你拖延时间的行为。毕竟，你正和一名精通施压与胁迫的大师打交道。但是，因为是你控制在这样的反对或挑战，你就能够在不解释、不放弃的情况下做好应对的准备。


    关键的一点是，你不要和操纵者说明你为什么需要时间思考，你要思考什么，也不要说明你究竟何时才会做出回应并按照操纵者想要的方式去做。一旦你陷入了这一沼泽，你又会失去控制权。


    操纵者必然表示反对，因为他希望你自动顺从，但是你却没有按照他设想的情况做出回应。但是，你需要某些回'
  merge: -1
  img_proc: true
- pgno: 229
  md: '应方式，因为操纵者很可能会利用压力手段来强迫你服从。


    你将要用到的回应技巧被称为“坏掉的唱片”。这是坚守立场的一个简单却有力的方法。它有两个组成要素：


    +   1. 说明你听到并且理解了操纵者的意思，准确地讲出他所表达的情感或感觉。


    +   2. 像是坏掉的唱片一样，重复你用来拖延时间的那些句子。


    就是这样。你不要（也不应该！）解释、询问或讨论任何具体内容。记住，如果你开始说太多话，你就会失去控制权。抵抗，就是这个游戏的主题，无论你的感觉是怎样的，都不要就你的角色进行辩论或争吵。


    但你心里要记住，你是完全有权力陈述自己想要在行动前先思考。操纵者可能已经控制了你很长时间，但你不是一个木偶。你是一个有自我意识的人类，并且你现在已经决定要剪断操纵你的线。


    坏掉的唱片听起来就是这样的。下面这个故事实际上来自我的一位病人。她有一位好友，一直在操纵她，让她女儿的学校组织慈善活动，而她成功地运用了这个方法来抵抗操纵。这个例子就展现出两个基本要素是如何组合在一起，成功避开顺从的压力的。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '操纵者：“你的组织能力太出色了，我决定让你来组织整个活动了。”


    目标（我的病人）：“你可能需要稍等一会儿。不好意思。”（给自己一点时间，快速回顾拖延时间的手段。）


    目标：（回到电话对话中。）“谢谢等待。你知道我需要一些时间来考虑一下。我想好了会告诉你的。”


    操纵者：（听起来难以置信似的。）“思考什么？你是在告诉我你不会组织这个活动吗？”


    目标：“我知道你会觉得惊讶（承认操纵者表现出来的感情），但我需要考虑一下，我之后会找你的。”


    操纵者：“好吧，我不会等太久。实际上，也没多少时间了，这也是我想让你来组织的原因。我现在就需要一个答复。”（听起来已经被激怒了。）


    目标：“我知道你现在很焦虑，但是我需要一些时间考虑，考虑好了我会找你的。”


    操纵者：（已经生气了，声音也抬高了。）“你就和平时一样不可理喻。我真的很需要你的帮助，而你就这样冷淡地对待我。你究竟怎么了？你到底需要考虑什么？我想知道！”


    目标：（深呼吸冷静下来）“我知道你现在很失望，但我要之后才能给你答复。”


    操纵者：（已经是在喊叫了。）“你就打算一直说这'
  merge: -1
