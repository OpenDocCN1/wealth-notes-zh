  md: '观点会以独特的方式转化为他们自我实现的预言。操纵者在看待其他人的世界时，会利用心理投射这一防御机制。


    操纵者相信，只要有机会，其他人的想法和他是一样的。换言之，其他人眼中的世界，也同样是非赢即输。他感觉其他人也相信做人要么是操纵者，要么是被操纵者，而且只要有机会，其他人也肯定会选择成为控制或操纵方。他觉得其他人也只在乎他们自己的需求，他很难想象别人的想法与自己的根本不一样。最终，他会觉得其他人也和自己一样以自我为中心，觉得自己理应得到一切。


    鉴于这样的心理倾向，即认为其他人在人际交往中的动机和信仰与自己相同，操纵者无法信任他人。当某一情境需要在信任他人、合作共赢与不信任他人、相互竞争两者之间做出选择时，他会本能地选择后者。


    操纵者总会率先迈出不信任的一步，因为他认为其他人的行为也只是为了争取自己的利益，所以他应该先发制人。


    # 囚徒困境


    社会心理学中一个经典研究展现出了这一人际交往策略的自我实现式预言的影响。它的参与者是两个人，被称为囚徒困境博弈，有时也被称为社会支配权的博弈。


    已故的伟大数学家阿尔伯特·W.塔克（Albert W.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'Tucker）在 1950 年提出了这一博弈理论。在最初的情境中，他创造了鲍勃与阿尔这两名窃贼的故事。这两个小偷在犯罪现场附近被抓，并且被送到了警局。他们被分开关押在独立的隔间内，并且被分别审讯。警察告诉他们，如果他们承认罪行，事情就好办了。是这样的吗？


    两名囚犯现在需要决定，是否要承认罪行并将伙伴供认出来。警察告诉他们，如果他们都认罪，那么他们都会因为携带违禁武器而被关押 1 年。如果他们都认罪，并且供认出彼此，那么他们都会被关押
    10 年。但是，如果有一个人认罪并且供认出了另一个人（另一个人不认罪），那么认罪的人就能够被无罪释放，而另一个人则需要面临最长 20 年的监禁。他们会如何决定？


    选择只有两种：认罪或不认罪。再无其他选择。塔克第一个提出囚徒困境矩阵或支付矩阵，在下面这个矩阵中你能够看到每个囚犯可能的选择，以及与另一个囚犯的选择对比之后的后果。


    |  |  |  | 阿尔 |  |

    | --- | --- | --- | --- | --- |

    |  |  |  | 认罪 | 不认罪 |

    | 鲍勃 | 认罪 | 10，10 年 | 0，20 年 |  |

    |  | 不认罪 | 20，0 年 | 1，1 年 |  |'
  merge: -1
  img_proc: true
- pgno: 95
  md: '鲍勃可能的结局在表格左侧，阿尔的则在右侧。如果鲍勃与阿尔都认罪，并且供认出彼此，他们都会被判 10 年。如果他们都拒不承认，他们都会被判 1 年。但是，如果阿尔认罪，并且供认出鲍勃，而鲍勃却没有认罪，那么阿尔无罪释放，鲍勃会被判
    20 年。如果是鲍勃认罪而阿尔不认罪，那么鲍勃就会被释放，而阿尔则会被判 20 年。


    多少年来，研究人员已经构想出了很多形式的囚徒困境，以研究社会环境中人与人之间是如何合作或不合作的。我们也可以从这个角度来看操纵者。


    我们可以改变矩阵中的内容，将“认罪/不认罪”改为“合作/竞争”。根据每一个选择的结果，参与者能够获得金币或美元。


    每个人在每一步都可以选择合作或竞争。在游戏设置中，如果两个人都选择合作，那么他们都能得到一定的收益（10 美元）。然而，如果一个人选择了合作，另一个人选择了竞争，选择合作的人就输了（无收益）；竞争者则赢了大头（20
    美元）。这就是零和游戏的结果：一个赢家、一个输家。最终，如果两边都选择竞争，他们都只能获得很小的收益（1 美元）。


    真正的操纵者在对待这个游戏时，永远会假设他（她）的对手会选择竞争。竞争对抗是操纵者的天性。'
