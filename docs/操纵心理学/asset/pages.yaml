  md: '克里斯蒂研发出了一个测试，来衡量一个人成为马基雅维利主义者的倾向性。在这一测试中得分高的人会被认定为“马基雅维利主义倾向者”。他们选择的场景往往架构松散、不受“管控压榨手段”的规则所限制。他们会唤起其他人的特定反应，比如说怒火和对被压迫的报复。他们会以可预见的方式来影响或操纵他人，他们的手段是剥削性的、自私的，并且几乎永远是欺骗性的。


    马基雅维利主义源于马基雅维利的观点，即统治者不受传统伦道德所限，君主的唯一关注点应该是权力，并且为达成功可以不择手段。马基雅维利的这些法则，来自他所处时代的政治形势：


    > 谦逊踪迹难寻；在与别人打交道时，展现出傲慢的态度更有效。

