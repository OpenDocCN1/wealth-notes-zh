- pgno: 103
  md: '几乎在每一段关系中都存在影响力和说服力。这是可以预料到的。这些情况都稀松平常，比如丈夫试图让妻子去他最喜欢的餐厅用餐，或妻子试图说服丈夫去看她选择的电影。另一方面，运用影响力的手段可能会被加强，乃至于变成胁迫，上升到情感要挟。比如有男性威胁他的女朋友，如果不服从他的性癖好就和她分手或在情感上冷待她。这是滥用影响力手段的一个例子，也是一种典型的让人厌恶的操纵方式。


    所以，操纵是被心理学家称为社会影响的这个广义术语的子类别。换言之，即人们有意地去尝试改变其他人的方式。想要影响其他人，从本质上来说并不是错的，也没什么不健康。比如说，医生想要改变我们的健康习惯。好的老师会运用说服手段（有时会以奖励糖果的方式）来驱动与激励学生。家长也会在必要时在孩子身上施加影响，这也是他们应该做的。的确，养育与教导孩子，很大程度上也是在长年积累影响的过程。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '然而，任何事都有边界，都有健康与否、合适与否的限制。决定社会影响是健康的，还是不健康的操纵，有两种因素，一是施加影响者对目标对象的动机与态度，二是在尝试改变他人行为或转变他人想法与感觉时使用的手段。


    如果施加影响者清楚并且尊重他人的人格完整与权力（包括其他人选择不听从其说服的权力），并且使用的方式是合适、成熟、不冒犯他人的，那么这样的影响即使不是慷慨无私的，至少也是良性无害的。然而，当他们的动机转为剥削他人，手段变得具有胁迫性，那么结果就从影响变成了操纵。


    而这就是麻烦的开始。


    # ## 越 界


    在心理学词典中，操纵这个词是贬义的，其内涵亦是负面的。毕竟，你上一次听到别人把操纵这个名词用在积极的事上是何时？思考一下，两位女性正在进行一番谈话，其中一个人试图为另一个人安排一次相亲约会，对话听起来像是这样：


    “哦，你肯定会爱上鲍勃的。”


    “他是什么样的人？”'
  merge: -1
  img_proc: true
- pgno: 105
  md: '“他又高又英俊，喜欢跳舞，还是个很棒的操纵者。”


    一般而言，操纵指的是试图利用剥削、迂回、欺骗性、狡诈或是不公平的手段来改变别人。并且，操纵在动机上总是单方面、不对称、不平衡的。操纵只能够实现操纵者自己的利益与目标，对于被操纵者的需求和利益则毫无助益，而且被操纵者往往还要付出代价。


    适当的影响与操纵之间的界线一旦被跨越，人与人之间的关系就会变得困扰重重，麻烦多多。


    因此，尽管几乎所有人都会在某种程度上试图影响他人，但是否将操纵手段作为处理人际关系的长久方式却因人而异。事实上，从互相尊重的影响，越界到简单粗暴的剥削，以及无视其他人权利的倾向，正是判断人格是否健全的决定性因素与重要诊断标准。


    简单来说，个性是心理学家给一个人长久以来的思维、行为和感知模式所起的名字。在某种意义上，我们每个人都有 一种个性“指纹”，它有一半来源于基因，还有一半则来源于周围环境，先天与后天的影响各占
    50%。


    在第 3 章与第 4 章，你理解了自己个性中容易对操纵者的手段中招的方面。在本书的后文部分，你会学习到抵御操纵者手段的策略，从而让你能更好地控制自己的行为、思维与感知模式，简而言之，就是让你可以控制自己的人生走向与解决问题的方法。'
  merge: -1
  img_proc: true
- pgno: 106
  md: '然而，要建立起有效的防御策略，你首先要能意识到，你是在何时以何种方式被何人操纵的。你需要对你正在被操纵这个事实与正在操纵你的人有一个清晰确定的理解与认识。


    找出生活中的操纵者并不总是轻松的任务。正如我之前警告的那样，有经验的操纵者最核心的技巧之一，就是让你失去平衡，怀疑甚至质疑你自己的观点与判断。但是，通过充足的培训与练习，你就能够学会利用自己的心理学雷达找出操纵者，即使他们行事隐秘也没有问题。


    操纵的证据在三个主要领域最容易被察觉到：（1）操纵者的个性；（2）操纵者施加在你身上的负面情绪影响与令人厌恶的控制欲；（3）这段关系的动态机制本身，即这段关系对于单方或双方来说，是否能够带来满足感与（或）喜悦感。


    正如我之前所提到的，没有人对于操纵是完全免疫的。同样，我们每个人都有能力去操纵（或至少试图去操纵）其他人。但是，某些个性类型的人会比其他人更可能与操纵联系在一起。更甚者，我在下面要概述的个性模式中，那些具有其中一项或几项个性类型的人，更容易在不同情况、不同时间与一系列不同的人际关系（比如说家庭、工作等等）中利用操纵手段。'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 直接控制 VS 唤起行为


    只要与操纵型人格的人共事过，你就会明白，操纵关系中占据最高地位的主题就是权力与控制、不平衡与不公正、剥削压迫与无法或不愿改变。然而，尽管与操纵者的关系都会给被操纵者带来类似的体验，但是操纵者特有的性格特点决定了他会使用何种手段（比如说诱惑、抱怨、冷暴力等）来操纵他人。第
    7 章我将带领大家探索操纵的手段。


    不同个性的人基于他们对于自己影响力的了解程度，会选择不同的操纵方式。你将看到，有些人格类型十分清楚自己的目的。这些任性的操纵者从不会对他人感到抱歉，也完全不关心他人的权利与人格，他们只会去做一切能让他们实现自身利益的事。简单来说，具有这些人格特征的操纵者通过直接控制来实现自身目的。


    举例来说，一位公开操纵员工去做某些事情的老板，使用的就是直接控制。在这样的案例中，操纵很容易就能被识破。但是，其他人格类型的操纵者则会利用不那么明显的方式来操纵他人。在操纵者中间具有代表性的强硬、顽固性格特点会引发其他人的负面情绪和不情愿的反应。从这个意义上来说，操纵者通过唤起方式来控制其他人的感情与行为反应，意味着他（她）的个性或行为会唤起其'
  merge: -1
