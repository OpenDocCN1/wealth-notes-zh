    +   4. 很难控制自我毁灭的冲动。


    +   5. 会有自杀或自残的冲动（比如说在胳膊或其他身体部位自残）。


    +   6. 经常在伤心、烦躁与焦虑等情绪之间迅速转变。


    +   7. 深深地觉得一切都是虚无的。


    +   8. 与实际情况不相称的怒火。


    +   9. 在压力来袭时会有妄想或脱离感（比如说感觉像是在梦里）。


    边缘型人格障碍的人操纵他人，主要通过唤起负面情绪反应这一方式。那些与边缘型人格障碍者打交道的人，很快就会知道，长期的不确定感、焦虑、沮丧与敌意，正是他们不稳定爆发行为的典型反应。


    那些与边缘型人格障碍者相处的人往往会感觉自己被威胁、陷入双输困境、遭到冷暴力、怒火等他们认为不公平的方式所控制或利用。


    边缘型人格障碍者倾向于利用一种被称为“情绪勒索”的操纵手段，这种手段由苏珊·福沃德（Susan Forward）'
  merge: -1
  img_proc: true
- pgno: 122
  md: '在 1997 年出版的同名书籍中提出。情绪勒索的定义是，如果他们不按照勒索者的意愿行事，勒索者就会以直接或间接的方式威胁施以惩罚。情绪勒索最基本的威胁方式都很直接：如果你不按照我希望的方式做事，我就会让你不好过。年龄小的孩子时不时地脾气暴发正是这种类型的完美例子，不过通常来说他们的年龄还不足以让他们被划分为边缘型人格障碍。然而实质就是这么回事。


    和边缘型人格障碍者打交道，就像是被困在情绪过山车上一样，永远是戏剧性与混乱的循环，恰如狂飙运动，往往要承担他们情绪上的每一次剧变，从正常到低落、从开心到烦躁、从看似平静到爆发怒火，这些在一瞬间就能发生，一方不仅无法预期，甚至也根本无法理解。


    随着时间过去，边缘型人格障碍者善变的心情和永不满足的要求，会让另一方体验到持续的沮丧。最终，沮丧会积累成怒火甚至拒绝，而这正是边缘型人格障碍者最害怕，但却是他们自己亲手造成的。


    所有与边缘型人格障碍者相处的人，几乎都会觉得自己被操纵了。从边缘型人格障碍者最初的想法来看，他的行为可能是源于恐惧、孤独、绝望甚至是无助，而非恶意或残忍。但是，尽管边缘型人格障碍者也许不是有意去控制或影响他人行为，但最终结果以及他们对他人极度负面的影响与其他操纵者并无二致。'
  merge: -1
  img_proc: true
- pgno: 123
  md: '# 依赖型人格障碍


    有依赖型人格障碍的人都存在着一种想要被关心的过度需求，这让他们格外顺从与黏人。依赖型人格总是需要他人的关心，他们顺从、无助，除非能持续获取培育、肯定、保证和情感支持，否则他们就无法行动。因为无论决定是大是小，他们都无法自己做决定，所以其他与他们相处的人会因此被操纵，承担起为他们或帮助他们做决定的责任。实际上，是其他人承担起了依赖型人格的人生活的控制与责任。


    由于依赖型人格实在太依赖他人了，导致他们没能学到符合年龄的决策技巧。反过来，这又延续与强化了他们的不足、幼稚与依赖性。为了降低他人对他们的期待，依赖型人格往往会假装无能，让其他人来做他（她）原本能自己做的事。


    被单独丢下时，依赖型人格会表现得十分焦虑，因为他们实在太过依赖别人了。他们需要别人来告诉他们应该和谁在一起，在哪里生活，找什么样的工作（如果可能的话），穿什么衣服，去哪里吃什么，去哪里度假，怎样花钱，甚至是如何养育孩子。


    批评只是表面现象，因为这符合他们的负面形象，因为他们觉得失去他人的指导非常可怕，所以即使不同意别'
  merge: -1
  img_proc: true
- pgno: 124
  md: '人的意见，他们也不会表现出不同意或分歧。更甚者，即使被激怒，他们也不会表现出任何怒火，因为他们被关怀的需要至高无上，当被他们操纵的人来关心他们时，他们无法承受拒绝或抛下被操纵者的风险。


    根据《精神障碍诊断与统计手册》的定义，如果一个人有过度的被关怀需求，并因此过度顺从或黏人，那么他就患有依赖型人格障碍。这一人格模式至少具有下面提到的不良特点中的5项：


    +   1. 没有他人的建议与肯定，就无法做出决定。


    +   2. 依赖他人承担起自己的大部分生活的责任。


    +   3. 因为需要他人的支持与肯定而很想向他们提出不同意见。


    +   4. 在没有他人帮助的情况下，很难自己着手开始做新项目、新任务或其他事。


    +   5. 为了不惜一切获取他人的支持与帮助，不再愿意自己去做不想做或不能做的事。


    +   6. 因为觉得自己照顾不了自己，所以在独自一个人时会觉得不舒服或很无助。


    +   7. 在一段亲密关系结束之后立刻迫切地寻求一段新的关系来取代它（比如说反弹式的爱情关系）。


    +   8. 会过度思虑如果没有人照顾自己了会如何。'
  merge: -1
  img_proc: true
- pgno: 125
  md: '依赖型人格的操纵手段很明显，尽管他们和边缘型人格一样，并不一定清楚实情，也不是故意的或是计划好的。无助感、服从感、需求感和对自己生活的放弃，这些都让依赖型人格去操纵他人照顾自己，为他们做决定。


    依赖型在人格中的体现具有性别差异。女性会将服从作为操纵他人、让别人照顾自己的一种手段；而男性则会将自己的要求与需求表现得更加明显。然而，即使如此，这些男性实质上和表现出服从的女性一样，具有很强的依赖性。


    # 表演型人格障碍


    表演型（histrionic）这个词的意思是“戏剧化或演戏型”。有这种人格障碍的人会试图以不寻常的奇怪方式获取他人的注意。这些人的基本特征是寻求他人的关注，并且过分情绪化。


    表演型人格的过分情绪化往往会表现为感情上的快速变化浅薄而造作。这样的人往往会反应过度。


    表演型人格十分渴求他人的注意，当他们不是别人关注的中心时，就会觉得很不舒服。他们往往穿着浮夸，或留个非常奇特的发型，以此来赢取关注。他们还会以媚态来不断吸引他人的注意与好感。因为他们必须一直是注意的焦点，表演型人格会变得十分具有操纵性，并常会以情绪爆发的方式来实现自己的目的。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '表演型人格的人也非常敏感。也因此他们非常容易轻信别人。他们会追逐最新的时尚、音乐等潮流，即使他们的兴趣并不符合他们的年龄（比如说，他们会努力让自己看起来比实际年龄更年轻）。


    表演型人格的人是虚荣，并且固执己见的。他们与别人的关系往往都只停留在表面，而且他们的情绪表达与言语总是看起来很假或是缺乏感知的深度。


    根据《精神障碍诊断与统计手册》的定义，具有需求注意力、过度情绪化的人是具有表演性人格障碍的。这一人格模式至少具有 5 项以下这些不良特点：


    +   1. 当自己不是注意力焦点时，会显得不舒服。


    2. 总是会表现出不适合当前情况的媚态或是挑逗行为。


    3. 表现出来的感情在他人看来非常善变、空洞与浅薄。


    4. 总会利用自己的外表打扮来吸引他人注意。


    5. 说话方式过度夸张，且缺少特定的细节。


    6. 在表达自我或讲述故事时，会表现得过分戏剧化。


    7. 非常容易接受别人的建议，被他人的观点影响。


    8. 总是会以为自己与别人的关系很亲密（实际上并没有）。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '表演型人格往往会扮演两个角色，操纵者与被操纵者。就像前面描述的边缘型人格与依赖型人格一样，表演型人格的操纵手段基本上也是唤起，她会唤起别人的消极反应。


    她挑逗露骨的行为（在她自己看来更像是社交手段，而非直接的性挑逗），很容易就会操纵别人以同样的方式对待她。这就会导致一些尴尬的情况，甚至引发性骚扰这样严重的情况。表演型人格容易遭到强暴，或是控诉他人强暴，或是在性行为之后，威胁要控诉他人强暴。


    表演型人格最明显的操纵手段，源于他们想成为注意力焦点。比如说，在组织设定中，表演型人格会试图抢走任何一个正在讲话的人的风头，或是吸引群体中所有人的注意。通过过度的情绪表达（哭泣、怒气爆发等），表演型人格会以此操纵其他人注意到他（她），即使其他人并不想这么做。


    # 被动攻击型人格


    尽管被动攻击型人格已经不再被《精神障碍诊断与统计手册》收录为一种可诊断的人格障碍，但表现出这一人格特点的人可能会极具操纵欲。


    理解被动攻击型人格的关键，在于意识到他们通过被动而非明显的、极具侵略性的方式来展现自己的敌意或侵'
  merge: -1
  img_proc: true
- pgno: 128
  md: '略性。但是，用这样对他人要求或需求的被动抵御，他们往往会引出别人的沮丧情绪，并最终唤起他人的敌意。


    被动攻击型人格最常见的手段就是拖延、懒散、顽固、故意的低效率与健忘。通常来说，被动攻击型人格会向别人抱怨上级给自己的任务。比如说，如果老板布置了一个项目，被动攻击型人格不会直接抵抗。相反，他们会发牢骚、生闷气，并且向同事或家人抱怨老板给他们施加了过度与“不合理”的要求。


    抵抗的常见做法，就是“忘记”死线、错过会议，并且一直拖延到让需要他们工作成果的人感到失望或生气。


    在人际关系中，被动攻击型人格会以消极的方式抵御他人的需求。比如说，如果被要求出席社交场所，被动攻击型人格会听从这一要求，但会通过沉默、缩在角落、闷闷不乐的方式表现出自己的抗拒。当另一方因为他拒绝沟通的行为烦躁时，被动攻击型人格会因为他（她）的反应而感到惊讶与迷惑。


    总而言之，被动攻击型人格正是通过消极来操纵他人的。不去做别人要求他们做的事，或看似配合要求，却以消极抵抗来搞破坏，被动攻击型人格会用这些方式唤起失望与敌意，以此来操纵他人。他们很难改变，也不怎么知道他们的消极抵抗是如何影响到别人的。


    当然，最终被动攻击型人格会操纵别人，让他们对自'
  merge: -1
  img_proc: true
- pgno: 129
  md: '己的要求越来越少，因为依赖被动攻击型人格所要付出的情绪成本实在是太高了。


    # ## A型人格


    A 型是对高压力人格及其行为模式的描述。在 20 世纪 70 年代中期，当最初的 A 型研究完成时（仅仅针对男性），研究者认为有 A 型性格特征的男性，会比其他男性有更大的风险罹患心血管疾病。


    A 型人格的核心，就是“匆忙症”。这样的人关注如何用更少的时间完成更多的事。用今天的说法，他们是典型的多任务工作者。如果他们碰上了堵车、排队，或必须等他人说完话或整理好思绪的情况，都会变得很紧张、很生气。


    除了由于匆忙症而引发的自我压力，A 型人格具有很强的竞争意识，关注能够量化的成功（赚多少钱、晋升了多少次、拥有多少财富），而非生活品质（有多幸福或多健康，有多满足或多充实）。A
    型人格也十分注意保持对周遭环境以及身边人的控制。


    通过多年对于高压力 A 型人格的研究，我们已经能够判断，让 A 型人格更容易得心血管疾病及其他疾病的真正原因，那就是他们随时可能爆发的怒气与他们展现出来的敌意。对于
    A 型人格，敌意永远一触即发。他们的紧张状'
  merge: -1
  img_proc: true
- pgno: 130
  md: '态会让他们与周围的人都处于持续的压力之中。结果，任何破坏了他们的计划、打乱了他们的日程，或让他们的控制欲受挫的事，都会让他们生气。也正是这样的怒气与敌意对他们来说是有毒的，甚至转变成了生理上的疾病。


    自然，尽管大多数分析都建立在男性样本的基础上，A 型人格的紧张、压力、竞争意识和脾气并非只有男性才有。数年前，我意识到 A 型人格研究基本都是针对男性之后，写了一本名为《E
    型女性》的书。我的议题是（并且现在依然是）许多女性都身兼数职（比如说职员、母亲、司机、厨师、管家、志愿者、女儿/姐妹/朋友等），她们的生活就和 A 型人格的男性一样充满压力，甚至可能比他们压力还大，但压力的类型是不一样的，因此也需要不同的对待方式与解决办法。


    A 型人格极具控制欲、易怒、令人畏惧。他们通过直接的控制手段来操纵他人。但是，他们也会通过唤起那些不希望成为其敌意目标的人的逃避策略来间接地操纵他人。


    结果就是，那些为易怒的 A 型人格工作或与他们共事的人，或是与他们有私下接触的人，总是会为了避免激怒他们而“如履薄冰”。如果那些与 A 型人格打交道的人都是冲突规避者，害怕正面对抗，他们很可能会被死死控制住，仅仅是对抗或脾气暴发的威胁就足以吓到他们了。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '易怒、有控制欲的人格也能用其他方式操纵身边的人。在这些人周围往往都充满压力。换言之，他们的压力等级让周围的每个人都会感受到压力和焦虑。


    # # 反社会人格障碍


    有这种人格障碍的人，终其一生都会实行不负责任的行为模式，并且毫不关心他人的权利、社会规范、良心指令或法律。这一人格障碍具有显著的性别差异，被诊断出来的男性远远高于女性。


    反社会人格很早就显现出来。他们在少年时代会在合适的时机说谎，并且会在相信能够逃脱惩罚的时候偷东西。在成年之后，他们会转向更严重的“对抗行为”。反社会人格往往会有跌宕起伏的人生，他们的人际关系、工作和居住地都会有突然的变化。他们可能会参与违法活动，包括欺诈、偷窃、职务犯罪或贩卖毒品。他们的容忍力很低，而且如果事情没有按照他们设想的发展，他们很容易烦躁甚至变得具有攻击性。


    这一人格让他们对自己与他人的安全置之不理。他们总是会做出极端的选择，比如说没有防护的性行为、大手大脚花钱、重度酗酒，甚至于危险的犯罪行为。


    反社会人格自私傲慢。他们都是伶牙俐齿的健谈者，相信人就应该并且只会为自己着想。他们的决定往往是'
  merge: -1
  img_proc: true
- pgno: 132
  md: '冲动、不负责、自发的，完全不考虑自己行为的后果。他们在经济问题上毫无责任心，只会开空头支票、抵赖债务，并且对他们的行为会给别人造成的影响无动于衷、麻木不仁。


    他们熟练地使用魅力与气场来欺骗、操纵、对抗他人。他们毫不内疚地撒谎，炉火纯青地使用假姓名，欺骗他人以获取利益或单纯找个乐子。他们相信所有人都会攻击、剥削他们，因此他们觉得自己先动手修理别人是十分合理的做法。他们能够熟练地利用花言巧语合理化自己的行为，他们会怪罪其他受害者太蠢、太容易上当，或认为其他人活该没人帮助。他们认同的信仰是，即使他们不利用这些受害者，其他人也会的。


    反社会人格没有道德感。正因为这样，他们对伤害他人或他人因他们的行为而受苦几乎没有内疚感。如果你不幸认识，甚至成为他们的猎物，你就会明白反社会人格是最具操纵欲也最危险的人。无论如何，要不惜一切代价躲开他们。


    # 成瘾人格


    根据定义，成瘾意味着将某种物品或某件事（比如说酒精、毒品、赌博）置于首位，而其他人必然被排在后面。尽管成瘾人格没有被收录在《精神障碍诊断与统计手册》'
  merge: -1
  img_proc: true
- pgno: 133
  md: '的人格障碍名录中，但成瘾人格确实给同处一段关系中的人带来了生理与心理的巨大痛苦。只要花一晚上和戒酒互助会的配偶、孩子与其他依赖者（比如说那些依赖成瘾者的人）相处，你很快就会意识到成瘾者的瘾头给他们带来的伤害。


    成瘾者几乎是臭名昭著地会说谎、抵赖、剥削别人，并且会对他们的家庭关系、工作关系和社会关系造成严重破坏。酒鬼和瘾君子通过他们的习惯与他们的不良人格特点与行为来操纵别人。


    那些上瘾者的亲人几乎会想尽一切办法让他们不再喝酒或吸毒，让他们戒断、清醒。然而，随着成瘾渐深，酗酒者与瘾君子的生活质量会一落千丈，他们的习惯会操纵其他人，让其他人感到内疚、压抑、羞愧、生气、沮丧、不安、自尊受损与其他有毒的情绪。而这些都是成瘾者与他的瘾头造成的。


    成瘾者的极端需求，会随着瘾头渐深、愈加乏力而更加过分，这也让依赖者牺牲自己的健康与幸福来满足他们过度的需求。因为成瘾者的问题不仅对他自己有害，也会深深伤害到他的依赖助成者。


    除非酗酒者或瘾君子自己决定改变，没有人能够改变这一现状。'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# **找出操纵者的练习**


    回到第 2 章，看五个案例研究的内容。你是否能够识别出案例中所描述的人的不同人格类型。然后看看你自己的生活。你能找出潜在的操纵者吗？


    # **你是如何被操纵的？**


    在这一章，你已经知道了身边最有可能的操纵者。这些人格类型往往会将操纵作为常规且有效的处理人际关系的手段。


    在你阅读这些人格描述的过程中，你可能已经看到了某些你平常觉得很难相处的人的影子。意识到这些人格特点与行为模式能够让你在操纵可能发生时保持敏感。


    操纵是如何实施的？他们使用的手段与策略都有哪些？这就是第 7 章的主题。'
