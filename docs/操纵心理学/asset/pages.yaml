- pgno: 61
  md: '率、坦白的对话，而这些都是阻止操纵者、保护你个人利益所必需的手段。


    “我应该做什么”，这样的思维是有毒的，且是自毁性的，而正是这样的思维污染扭曲了取悦他人的者的思维方式。一味遵守你认为自己应该做的事，正是取悦他人的压力来源。这些存在于认知中的应做之事，让你始终很容易被别人操纵。


    取悦他人的心态能够被归结为两类“教义”，第一类我称之为“取悦十诫”：


