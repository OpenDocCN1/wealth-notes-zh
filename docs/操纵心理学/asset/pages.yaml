  md: '# 如何纠正“取悦他人应该这样做”的思维？


    调试指南：当思维被“应该”这个词污染，它就会变得固定、僵化与极端。另一方面，合适的思维则是有弹性、适度与平衡的。取悦他人的这些“应该”，是胁迫与控制性的。说出你自己的偏好与喜好则要合适得多。试着在你的新思维中使用“选择”这个词。并且软化“一直”与“从不”这种词，让自己的思维不那么极端。


    你施加给自己的“应该”是僵化的，而且基本不可能实现。它们不会让你快乐，只会让你觉得不足、失望或生气，也会让你容易被操纵者盯上。


    下面是一些错误的软柿子思维以及纠正它们、让你变得强硬的建议方法：


    软柿子思维：“我应该一直做别人想要、需要或期望我去做的事。”


    纠正过的强硬思维：“当我愿意时，我会选择去满足对我来说很重要的人的想法、需求与期望。”


    软柿子思维：“我应该一直取悦他人，让他们开心。”


    纠正过的强硬思维：“我知道我不可能同时取悦所有人、让每个人开心。给自己设置不可能完成的任务只会让我觉得不满足与不快乐。”


    软柿子思维：“其他人应该感激我、爱我，因为我'
