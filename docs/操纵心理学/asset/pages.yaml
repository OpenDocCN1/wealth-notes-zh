- pgno: 245
  md: '通过重塑权力平衡，有效地阻止操纵者的胁迫手段，你就能够建立起新的个人边界。


    这一步抵抗措施，能够让这些边界变得清晰。正是在这一步，你会直接、清晰地告诉操纵者，你再也不愿意被操纵了。这一步的要素包括：


    +   1. 宣布你想自己做决定，在有关你自己和其他人（包括操纵者）的需求与利益的关系中，你愿意和不愿意做什么。


    +   2. 告诉操纵者，你想被如何对待——比如说，你需要尊重，需要作为人的价值与完整，需要被当作成年人或平等的人来看待。直截了当地说你不会允许自己被伤害。


    +   3. 建立清晰的边界与限制。说明你不再能接受操纵手段（比如说，不能有冷暴力，不能故意引发内疚感，不能恐吓，不能威胁说要抛弃）。不接受威胁的方式。就是澄清你不会再参与任何包含这些越界手段的对话。


    +   4. 要求操纵者承认你也有自己的需求、价值与意见，有自己的行为偏好。尽管可能会和他（她）的不一样，但它们不是坏的，也不是错的。


    +   5. 告诉操纵者，你相信设定边界、重塑个人完整'
  merge: -1
  img_proc: true
- pgno: 246
  md: '性，有助于你们提升这段关系的整体质量。


    你自然需要练习这些陈述，最理想的方法也是角色扮演。直接地说出每一点，不修饰、也不解释。这就是你自己的解放宣言。


    当然，操纵者也不太可能会顺从地回答一句“哦，好啊”。但是，如果你已经使用了之前所提到的抵抗策略，操纵者就不会真的因此感到惊讶。从某种意义上说，你只是在直接地告诉他，你正在展现你新发现的力量，来抵抗操纵性控制。


    做这些陈述可能会让你觉得十分焦虑。不要让你的焦虑逼退你。继续这样被操纵者控制，失去自我，失去自己的价值、独立性与完整性才是真正会让你更焦虑与恐惧的东西。


    你能预料到的还有这么做的副作用。最开始，操纵者的应对方式是将压力与胁迫提高好几个等级。而你绝不能屈服。不断使用抵抗手段，一遍遍强调你的诉求。如果他开始接纳一段更健康、更快乐的关系，那也是因为你的力量，而不是你的弱点。


    你也要面对这一可能，就是操纵者只希望按照自己的方式继续这段关系。并且你最好现在就开始做好准备面对这一可能。从现实意义上讲，你的诉求变成了测试这段关'
  merge: -1
  img_proc: true
- pgno: 247
  md: '系的价值的试纸。如果你发现操纵者维持这段关系的唯一目的就是继续他的操纵与剥削，那你就必须痛下决心了。抽身而出也许是最好也最健康的选择。


    即使操纵者表现出改变的意愿，你也不应该期望这段关系会在一夜之间就实现自我矫正。操纵者需要时间来学习新的行为方式，以及表达需求的更好方法。但是，你的耐心、坚持与决心会带来新的希望。


    # 步骤 7：妥协与协商


    尽管操纵者使用的手段从来没有妥协与协商的空间，但为了实现你的需求与偏好，理应有更加健康的“付出与收获”的模式。正如你所想到的，一名冷酷的操纵者只关心他自己的兴趣与利益。操纵者不会主动地考虑你的需求与渴望。


    但是，如果操纵者已经准备好适应，接受你们之间的关系朝健康的方向转变，那么你们双方的利益也就有了同时实现的可能。最后一步抵抗策略会向你展示用妥协与协商来解决冲突的基本模型。


    我在这里使用冲突这个词，指的并不是争吵或正面对抗，尽管没有处理好的冲突的确会升级为争吵和正面对抗。在这个语境中，冲突仅仅意味着你和（曾经的）操纵者在涉及你们俩的事情或在需要你们进行合作时，有不一样的'
  merge: -1
  img_proc: true
- pgno: 248
  md: '倾向与需求。


    鉴于操纵者现在已经不能够再做出单方面的要求，向你施加压力强迫你服从而了，这就要求有新的、更具建设性的方式。以下就是在面对利益、偏好、价值冲突时，进行协商、共同找出解决方法的基本步骤：


    +   1. 以清晰、确定的方式形容另一个人目前的立场：

    “我知道你想要 / 喜欢 / 倾向于____。”


    +   2. 确定你理解他人的立场。在必要时请他澄清。


    +   3. 以清晰、确定的方式说明你的立场与偏好：“我更喜欢 / 倾向于____。”


    +   4. 允许彼此通过直接的问答来确定彼此的立场，尤其是了解彼此对于替代方法的态度与对这一问题重要性的等级排序。


    +   5. 将（曾经的）操纵者纳入需求妥协的队伍中来：“是否还有我们都能够接受的第三条路？我们来想想吧。”


    +   6. 让（曾经的）操纵者进行公平但随机地选择：“因为我们无法达成一致意见，让我们来丢硬币吧。谁赢听谁的。”


    +   7. 或是与（曾经的）操纵者进行交换或轮流做主的方法：“如果我为你做____，我就会为你做____”或是“这一次听我的，下一次听你的（或是相反）”。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '这里的关键点，在于妥协与协商是有可能的。


    最后的这一步抵抗策略，实际上就是对操纵的完全取代。你新定义的关系拒绝操纵手段。当彼此都能够倾听与理解，当他们解决问题的方法能够为双方都带来利益，而非只有一方是至高无上，操纵循环就结束了。


    这些年来，我的许多病人来找我时，都深陷于棘手的操纵关系中。他们中的很多人都成功让曾经的操纵者做出了妥协。但是，他们首先学会了如何选择战斗。


    # ### 选择你的战斗


    前面讲到的策略能够帮助你展开全面的抵抗，结束操纵，重掌生活的控制权。但是，你必须小心明智地挑选你的战斗。


    有选择地使用这些步骤，评估操纵者的反应。有一些操纵关系确实改变了，变得更积极、更健康。但是可悲的是，其他一些，甚至是大部分操纵关系都没有发生改变。你可以将这些策略视为一种测试，来观察你所处的操纵关系是否有转变的弹性与可能。


    你清楚自己所处关系的情况与复杂性。是留是走，是抵抗还是屈服，是满足于削弱伤害与提升环境还是进行全方位的复原与改变，有很多因素会影响你的决定。'
  merge: -1
  img_proc: true
- pgno: 250
  md: '比如说，如果你在工作中被操纵了，你也许就需要小规模的抵抗，小心翼翼地选择能够帮助你寻找自我、同时保住工作与生计的手段组合。你也许永远不会用正面对抗的方式面对控制欲强且不可理喻的老板。然而，以小小的努力夺回控制权，并且尝试去寻找新的工作环境，都能够削弱你现在的压力，并且让你在逐渐安全地将自由付诸行动时留有自尊。


    或是说你也可能像我之前的病人那样，以自我革新来取代微小的每一步。他是洛杉矶一家大型公关公司的副总裁。他收入很高，但工作环境让他很不快乐，而这基本都是因为他的老板。当他第一次来见我时，他没有将自己负面的工作体验认定为他被操纵了，但是逐渐地，他开始看清，他老板操纵式的工作风格以及缺乏职场伦理的行为对他产生了影响。一天早上，他从车库乘坐电梯去办公室，一名身穿制服、在楼梯守岗的警卫看着他说：“我还没见过比你看上去更不开心的人。”这句评论来自一个完全的陌生人！我的病人坐电梯到了31层的办公室，立马开始列计划脱离这个痛苦的工作环境。两周之后，他走进了总裁办公室，说出了他的计划。在他做出决定的那一刻，他感觉好多了，辞职更是让他觉得彻底放松了。他从没后悔过这个决定。


    无论你是采取小规模抵抗，还是选择自我革新，现在'
  merge: -1
  img_proc: true
