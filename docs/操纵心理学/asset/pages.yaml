    # 如何纠正“缺乏自信、无法说不”的思维？


    调试指南：清晰有效地说“不”，是你应对操纵的第一条防线。除了保护你免受操纵，它对于避免压力、精力消耗与抑郁十分关键。你需要在某些时候对某些人说“不”，让你能有精力服务那些对你来说真正重要的人。


    如果你在拒绝的时候觉得内疚，那么你的思维就被“应该”这个词所传染了，它会让你屈从于所有人对你的要求。纠正思维，就需要有选择地说“不”，来保护自己的心理与生理健康，重新掌控自己的时间与精力。


    你作为人的价值，并不取决于你为他人所做的事。在某些时候对某些人说“不”，尤其是对操纵者说“不”，并不会削弱你在他人眼中的价值。实际上，你新发现的自信会强化你的价值。


    软柿子思维：“我担心如果我拒绝别人的要求，别人会对我生气。”'
