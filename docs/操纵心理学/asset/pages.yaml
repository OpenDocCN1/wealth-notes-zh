  img_proc: true
- pgno: 96
  md: '# 囚徒困境的变种


    |  |  | 阿尔 |  |

    | --- | --- | --- | --- |

    |  | 合作 | 竞争 |

    | 鲍勃 | 合作 | 10, 10 美元 | 0, 20 美元 |

    | 竞争 | 20, 0 美元 | 1, 1 美元 |


    但是，如果你仔细思考这个游戏，你会意识有一种最佳的方法能够最大化双方利益，就是他们信任彼此，在每一步都选择合作。如果双方都选择合作，那么每一次他们都能获得
    10 美元。然而，风险就是如果你选择合作而另一个人选择竞争，那么你就会一无所获，而对方能获得 20 美元。


    拥有操纵者心态的人相信，每个人为了能赢、最大化自己的收益、最小化损失，都一定会自动选择竞争。但是，这个选择只有在对方选择合作时才能为选择竞争的人带来最大收益：也就是竞争者赢得
    20 美元，而合作者一无所获。


    操纵者永远会选择竞争。他们从第一次开始这个游戏时，就会选择竞争。有时候他们的对手会在第一步选择合作，有时则不会。但是，考虑到操纵者一直会选择竞争，那么最开始选择合作的人也别无选择，只能改变策略，变成不信任对方的竞争者。这样，他就能将收益从
    0 提高到 1 美元，并且将操纵者的收益也降到 1 美元。'
  merge: -1
  img_proc: true
- pgno: 97
  md: '另一方面，想想那些在第一步选择合作的人，他们相信另一个玩家也会选择合作，这样他们每一步都能获得10美元。如果两方都选择合作，那么10步之后，他们都能累积到100美元。只要双方都信任彼此，继续选择合作，那么他们在整个游戏当中都一定能获得收益。


    然而，如果选择合作的人在最初几轮都被选择竞争的人祸害，那么选择合作的人也只能转变策略，选择竞争，将竞争作为一种防御措施。


    对囚徒困境博弈中各方行为的研究表明，合作者在这个游戏中会有不同的经历。有时候他们会碰上其他合作者，从而都满意地获得收益。但有些时候，他们也会遇上多疑、自我的竞争者，从而不得不选择竞争作为防御手段。在整个游戏过程中，只有很少的人会在面对竞争者时依然继续选择合作。在与不同的人玩过几轮之后，当被要求概括他们的感觉时，合作者也许会耸耸肩，说这就和人生一样，总会有不同类型的人。


    另一方面，竞争者从游戏中得到的感觉则是双方总是在竞争。因为竞争型（操纵型）玩家让他的对手转化为了竞争者（但他不会让自己以同样的方式被转化为合作者，因为合作需要彼此信任），所以他在游戏中的经历总是这样。他自己的行为导致别人都变成了竞争者，又因此验证了他最初的观点，即他人都是不可信的。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '将囚徒困境作为人生模型，你会发现，根本不信任他人、将他们自己的竞争心态投射到其他人身上的操纵者，实际上会创造出他们设想的那种社会环境。他们的生活经历会不断证实他们的信仰系统，尽管他们往往不知道，他们自己不信任他人的行为，是如何导致其他人对他们的不信任、竞争与敌对的。


    这一博弈模型的本质反映出来的模式，说明了操纵者为何又如何将他们自己的观点合理化（即人生就是一场残酷的游戏，每个人都必须不顾一切，实现自己的个人需求，即使需要别人付出代价也在所不惜）。操纵者认为这样的行为是合理的，因为他们相信其他人也会这样对待他们。


    思考一下，这样的心态会如何影响并且毒害人际关系。能够信任他人的人，对于建立起相互信任的关系持开放态度，因为他们相信其他人有时是无私慷慨的，正如在囚徒困境中一样，其他人可能会选择合作，因为这才是明智而合适的做法。如果你相信这个世界上既有可信赖的灵魂，亦有仅仅关心自己的竞争者，用这种开放而现实的态度来看待世界，那么你的经历也会符合你的预期。这两种人你都会碰到，你也有机会与他人建立相互信任、合作，且被彼此所珍惜的关系。


    合作与信赖带来的是相互尊重、以健康的方式相互依赖的氛围，正是这样的自主权与相互依赖意识的协调，让'
  merge: -1
  img_proc: true
- pgno: 99
  md: '亲密的感情意识、高度的自尊意识、强烈的自我意识与坚定的自我信任意识成为可能。


    但是，现实的合作者也知道，世界上还有竞争型的操纵者。当他们遇上了竞争型对手，他们会相应地改变、调整自己的行为。你并不需要一味满足操纵者，让他们的行为和手段奏效。


    # 概括总结


    操纵源于心态和价值观，而心态和价值观既能合理化操纵，也能彻底否认操纵。试图树立典范来让操纵者改变，任凭自己被操纵者摆布，这类做法只会让他（她）的操纵手段愈演愈烈。


    你能改变操纵者的最好办法，就是不再让他的手段奏效。操纵之所以继续下去，是因为它能够奏效。它有效果。只要操纵者可以让你服从他的需求、臣服于他的控制，他就会继续以这种方式对待你。


    要改变一名操纵者，你必须先改变自己的行为。操纵者想要实现自己的利益，他完全不关心这是否会牺牲你的利益、幸福、内心的安宁、心理或生理的健康。当你学会利用自己的行为（阅读本书之后你会学到）来有效阻碍他的手段，你就能阻止操纵者，逐渐让自己不再被操纵。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '当操纵不再奏效，操纵者为了满足自己的利益，就会选择改变手段或彻底脱离这段关系，关于后者，你必须事先接受这一可能性。阻碍操纵者的手段也许不会导致你失去这段关系，但是你必须直面这一可能，才能拥抱自由，逃离你可能浸淫已久的充斥着剥削与操纵的有害模式。如果你不愿意失去这段关系，即使你会在这段关系中失去自我，你也不会放弃，也就是说你还没有做好让自己不再成为受害者的准备。


    最后，人们在人际关系中扮演的角色并不总是一致的。许多操纵者都是从他们作为受害者的关系中学到控制他人的技巧。有时，对他人的操纵反感至极的人会发誓再也不做受害者；而在他们的下一段关系中，他们成功地将自己塑造成了操纵者。


    在这一章中，你了解了操纵者背后的很多动机。在第6章，我们会看看操纵者最典型或最常见的性格特征。换句话说，谁是最容易被怀疑的对象？'
  merge: -1
  img_proc: true
