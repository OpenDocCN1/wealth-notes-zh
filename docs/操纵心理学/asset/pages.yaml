  md: '尽管他很爱瓦莱丽，但是他经历过一段失败的婚姻，他希望在做出另一个“最终”决定前，能更肯定一些。他对瓦莱丽说：“相信我。给我点时间。我只是需要再确定一些。现在，让我们换个话题吧。”然后，他就拒绝再讨论结婚相关的话题了。


