- pgno: 79
  md: '既然你现在已经知道了操纵者如何利用你的敏感点，那么就让我们反其道而行，来看看操纵者最常见的动机。这个方法能够帮助你和那些想要操纵你的人处在公平竞争的环境中。毕竟，如果你暴露在外面的按钮让你更容易被操纵者盯上，难道你不应该学一下如何识别动机，认出操纵者吗？这样的话，你也许就能够在这段操纵关系开始之前就切断它。


    然而，找出操纵者往往并不简单。即使你特意去探寻他们的动机，中途也会有诸多阻碍。比如说，你要意识到，技巧熟练的操纵者往往很擅长掩饰或伪装他的动机。他很可能会故意歪曲在某段操纵关系中或或做特定事情的原因，来伪装自己。


    有时候，操纵者甚至可能对他们自己都隐瞒了真正的动机。这就增加了发现操纵者的难度。揭露对你说谎的操纵者是一回事，但当他们对自己都说谎，他们的谎言就更具说服力的。'
  merge: -1
  img_proc: true
- pgno: 80
  md: '无论操纵者对于自己的动机清楚与否，从本质上来说，他们对于受害者的负面影响是相同的。


    # 是什么让操纵者做出他们正做着的事？


    操纵能够存在是因为它能产生效果。阻止操纵者的最佳方式，就是让他的手段失效，不再服从他的需求、期望、要求与（或）微妙或过度的压迫，从而让他的操纵失灵。


    当操纵技巧不再有效，不再满足操纵者的需求，也就是当你开始改变自己，让操纵者没那么容易控制你时，操纵者的手段也会发生改变。操纵者很可能会脱离这段关系，寻找新的目标或受害者。操纵者就像顺流而下的水一样，永远在寻求最通畅无阻的道路。


    原因毫不复杂，仅仅是因为操纵者希望操纵能够不费力。对他们来说，操纵必须既简单又自然。他们会这样做是因为这样做简单，而且正是你让操纵变得简单。


    这一章的目的，不是要给操纵者以启发。我不认为操纵者会有兴趣阅读这本书。除此之外，我也不会欺骗自己，认为只要操纵者意识到他们对他人的伤害，他们就会“幡然醒悟”，从而改变他们对待他人的方式。我很清楚这是不可能的，因此你也同样不不该欺骗自己。


    我的目的是描述出操纵者的动机与心态，从而让你更'
