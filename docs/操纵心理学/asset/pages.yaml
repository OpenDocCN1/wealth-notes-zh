- pgno: 165
  md: '任何受过操纵关系之害的人都明白，操纵是一个过程，它跨越较长的一段时间。如果它很快出现在一段新关系中，那么目标很快就能发现，并且这段关系可能会在开始之前就结束了。“慢而稳”是许多操纵者的信条。


    正如之前的章节指出的，操纵者在目标身上使用的控制杠杆，既可能是获益的承诺，也可能是避免损失的承诺。他们会告诉受害者，除非服从于他们，否则这些都无法实现。


    操纵法则的核心相对简单。操纵者的获益承诺，最基本的公式就是“如果你按照我想要的方式做，我就会回报给你（获益承诺）”，或是“如果你不按照我的要求做，你就得不到你想要或需要的东西”。在这两种情境中，目标目前都没有自己想要的东西。这就是谚语中众所周知的胡萝卜。


    然而，当控制杠杆是损失威胁时，公式则转变成了胁迫式的控制：“如果你不按照我想要的方式做，你就会失去你珍惜、渴望或已经拥有的东西，甚至可能还会有其他的'
  merge: -1
  img_proc: true
- pgno: 166
  md: '负面结果。”这就是大棒。


    操纵者并不一定需要公开地说出这一公式，它的展现方式往往是隐蔽的威胁。但是，无论是不是明示，胡萝卜（获益）或大棒（损失或惩罚或结果）都是每一段操纵关系的核心。如果你觉得自己如今身处一段操纵关系，问问你自己：“掌控这段关系的法则是什么？（操纵者）是如何控制我的行为的？”换言之，问问你自己：“我在这段关系中，做这些事（某些行动或行为）是出于我自己的个人意愿，还是因为我害怕失去现在拥有的东西？”


    # 操纵转移


    通常来看，操纵者会同时或有顺序地使用这两种控制杠杆。比如说，操纵关系的初期，操纵者一般会获益承诺来诱惑目标。随着操纵过程的进展，控制杠杆可能会悄悄或私下转移为失去获益或失去获益机会的威胁。一旦操纵控制转向损失威胁，被操纵者就会感受到胁迫感与不断增加的压力。


    一般来说，获益承诺与损失威胁代表了这段关系的终点与目的。在通向这一目的的路上，无论是为了获益还是为了避免损失，操纵者都会以更小、更频繁、更常规的操纵手段来控制他的受害者。也正是通过这些高频率的操纵'
  merge: -1
  img_proc: true
- pgno: 167
  md: '手段，受害者逐渐失去了对自己的控制，感觉到被操纵，并在最终感觉到胁迫感与高度压力。如果承诺的获益从未变成现实，受害者会觉得被欺骗了，尤其是他一直服从操纵者对他的任何要求。


    比如说，如果承诺的获益是工作上的晋升，一名操纵性的上级会对下级施加控制，可能会表现为要求他加班或在周末工作，也可能表现为要求他帮助自己或为自己完成任务，或是要求他违反公司纪律、监视同事。所有这些对个人的操纵，都是通过对服从与不服从的直接奖励或惩罚来控制的。但是，操纵者对于受害者整体的控制杠杆是一致的：‘“如果你按照我想要的方式做，你才能得到晋升，在这家公司走得更远。如果你不这样做，不取悦我，你就不会得到晋升（甚至还会阻碍你）。”’
    后一句话中暗示的威胁包括降职、开除、负面的绩效反馈、批评或是在其他员工面前遭到公开羞辱。


    我们在第 2 章看到，弗朗辛最初受控于自己想要成功与赚钱的欲望。随着操纵的加深，控制杠杆变成了可能会失去这段能够带来利益的合作关系的恐惧。


    # 操纵过程


    操纵是一个随时间变化的过程，这一事实意味操纵者'
  merge: -1
  img_proc: true
- pgno: 168
  md: '会用一系列获益承诺与损失威胁来控制目标行为。操纵很少是个别的单独事件，它是一个横跨一段时间的全面过程。


    操纵者控制目标的方式是利用正面与负面的回报或强化效应，以及实际或威胁会发生的负面结果与惩罚。操纵的隐藏过程往往开始于操纵者利用微妙、间接甚至欺骗性的手段设下陷阱，或是利用令人愉悦、适宜或良性的奖励信号。


    操纵者会先唤起目标的兴趣，利用看似无害或不重要的要求来引出目标的顺从与合作。通常来说，在操纵关系的开始阶段，潜在操纵者的要求看起来完全符合目标自身的利益。实际上，当目标看见了操纵者与自已之间的利益联系（他还没有意识到自己可能成为操纵的受害者），操纵者与目标之间建立起信任感的关键一步就开始了。


    当然，随着操纵的本性不断暴露，这样的信任感也会不断被腐蚀。


    在引起目标的兴趣之后，操纵者开始利用自己的要求与需求来寻求目标的顺从与配合。此时目标还未变成完全的受害者，他们会因为操纵者的注意与兴趣而感到受宠若惊，甚至因此而被诱惑。


    这段关系最初看上去是一段双方需求都能得到满足的积极关系，然而它会逐渐发展为彻底的操纵陷阱。比如说，一名潜在的操纵者男友，起初会表现得符合他女朋友的要'
  merge: -1
  img_proc: true
- pgno: 169
  md: '求，如爱恋、口头表扬或其他肯定的暗示。随着时间推移，回报可能会转变成长期的承诺或结婚组建家庭，就像第 2 章中的瓦莱丽与杰伊那样。


    当男朋友开始使用分手威胁作为手段，表现出他突然“需要个人空间”，或是谈起他对于这段关系的不确定，看似良性无害的影响就转变成了胁迫性的控制，操纵就出现了。现在，比起获益承诺（比如说婚姻），女朋友被失去的恐惧操纵，害怕会失去这段关系、失去他的爱、失去结婚与组成家庭的可能。仅仅是失去威胁，就足以让他能够控制女朋友的行为、思维、观点与自尊。如果在她心里，她认为自己做了让操纵者不开心的事，她会毫不犹豫地服从他之后的要求，因为她害怕男友可能会离开。


    这就是典型的操纵。


    现在，让我们看一看操纵者用来获取权力、控制目标的五种主要方式。


    # 操纵性控制的方式


    操纵关系看起来往往错综复杂，尤其是对被操纵者而言。但是，操纵者用来控制受害者行为的方式，实际上很好理解。


    一旦你理解了控制的基本手段，你就能够冲破操纵者'
  merge: -1
  img_proc: true
- pgno: 170
  md: '的复杂言语与情感圈套，清晰简单地看到操纵者是如何施加他（她）的控制的。这对于打破操纵者对你的控制格外重要，即使这样的操纵已经有些时间了。


    操纵者控制受害者的五种基本方式如下：


    +   1. 正强化


    2. 负强化


    3. 间断强化


    4. 惩罚


    5. 创伤型一次性尝试学习


    在心理学术语中，这些都是学习的基本模式。因此，它们也并不局限于操纵关系中。实际上，这些基本的学习模式，会在所有的关系与情境中被用来影响、教授、教练、激励、规范、鼓励与操纵他人。


    无论你是否清楚这些模式，你肯定使用过它们来矫正、影响、塑造或控制其他人的行为，而其他人也同样用过这些方式来影响、塑造或控制你的行为。我们正是利用这些基本的模式来教授小孩，培训员工，改变配偶以及鼓励或贬低朋友与家庭。


    那么，在操纵方面又有什么不同呢？在回答这个问题之前，我们先来看看这每一条实现控制的基本方式。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 正强化


    这一方式是回报奖励的基本原则。如果你喜欢别人现在的行为，并且希望增加他（她）这么做的频率，你就会提供回报奖励，这就是正强化。这样的强化形式包括表扬、金钱、肯定、感情、礼物、注意、表示肯定或愉悦的面部表情（比如说微笑或大笑）、公开认同以及其他物质与非物质奖励的混合，也可以是其他奖励，比如说加薪、头衔和晋升。


    举个列子，正强化是最快让狗学会坐下或不动的方法。正强化意味着在训练过程中，只要狗做出符合期待的行为，就能获得一次奖励，比如说轻拍或是一块狗饼干。


    我们所依赖的人、所爱的人、所尊敬的人，以及能够满足我们欲望的人和帮助我们避免损失的人，他们的奖励与强化将影响我们，人类终其一生都逃脱不了这种影响。在每天成百上千次的接触中，我们都因为自己所做的事而强化他人以及受到他人的强化。正强化增加了期待的行为再次发生的可能。


    需要重点说明的一点是，正强化一般来讲都是感觉比较好的体验，对于目标来说这是一种愉悦的经历。这也正是它有用的原因。我们喜欢获得老板的肯定或表扬，喜欢被别人喜爱，或是仅仅喜欢看到我们所爱的人面露幸福，'
  merge: -1
  img_proc: true
- pgno: 172
  md: '我们喜欢被别人欣赏与珍视，喜欢看到自己的努力卓见成效。熟练的操纵者也知道这些，他们会利用正强化来让目标感觉良好（从而让他们偏向于带来奖励的操纵者），并且增强他们想要的行为与习惯。


    操纵者会使用正强化吗？当然，尤其是在关系发展的早期阶段。如果他们仅使用正强化手段，尤其是奖励如果都是你渴求的东西的话，那这段关系就不是操纵关系了。实际上，基于正强化的关系往往都是怡人的。


    主观上看，反馈就是目标会发现他们的行为能够取悦操纵者。对于取悦他人者，这本身就是巨大的回报奖励了，因此他们会多次重复这样“取悦”的行为。


    然而，在操纵者利用持续的正强化将目标诱入这段关系之后，“游戏”通常会走向另一个方向。比起频繁、微小的奖励，摆在目标面前的是长期且更具诱惑的收益。它看上去就在目标触手可及的地方。最初，目标会有很强的动力去获取这一收益。目标愿意先苦后甜，不惜一切代价，并且会耐心地等待“极大收益”实现的时刻。


    但是，这就是摩擦所在：在操纵关系中，获益一直是虚幻而无法实现的。然而，操纵者仍然会继续用获益承诺激励目标。最终，随着操纵的动态逐渐清晰，目标会开始怀疑无论他们多努力，承诺的收益都永远不会成真。


    因此，当目标挣扎着想去理解目前的状况时，另一种'
  merge: -1
  img_proc: true
- pgno: 173
  md: '微妙的转向将强化机制或控制杠杆从积极变成消极。在操纵者的控制之下，目标感觉自己更多是被也许永远也得不到利益的恐惧所迫，而非实现目的的动力。现在，避免损失（现在还没得到的收益）的需求成了最主要的动机。


    # ## 负强化


    许多人会将负强化与惩罚混淆，但它们其实很不一样。理解负强化效果的最佳方式，就是使用实验室样本。比如装在笼子里的小鼠（学习心理学家会用这类小型生物做研究）。笼子被分成两个隔间：一个隔间除了一扇白色的门都被刷成了黑色，另一个隔间全部刷成了白色，两个隔间相连。为了同时体现正强化与负强化，我们假设研究目的就是教会（影响、教练、操纵？）小鼠尽可能快地从黑色隔间跑到白色隔间。


    小鼠1被放在黑色的隔间。我们在白色隔间最远的角落放了一小块奶酪。小鼠会先观察黑色的隔间，直到发现了白色的门，它有可能出于好奇心推开它，也有可能是因为它嗅到了芝士的味道。然后进入白色的隔间，吃上奶酪。这就是正强化。小鼠很快乐。


    第二次，同样的小鼠又被放在了黑色的隔间。这一次，它会更快地推开白色的门，并且吃上奶酪（正强化）。现在，小鼠既快乐又聪明。'
  merge: -1
  img_proc: true
- pgno: 174
  md: '我们再做几次这样的试验。每一次，小鼠都会以比上一次更快的速度进入白色隔间。即使我们不再放奶酪，小鼠也依旧会以很快的速度从黑色隔间跑到白色隔间，因为对于小鼠来说，芝士与白色隔间的联系让它觉得白色隔间更好。


    到这一步，我们已经展现了如何利用正强化教会小鼠从黑色隔间移动到白色隔间，也就是小鼠做出我们所期望的行动（从黑色隔间到白色隔间）之后立刻给予奖励。


    现在，让我们将小鼠 2 放在黑色隔间中。我们的目的是一样的，看它多久能学会从黑色隔间移动到白色隔间。但是，这一次，白色隔间里没有奶酪，相反，我们在黑色隔间通了电，一有轻微的压力，就会产生有痛感但不强烈的电流。小鼠
    2 被放在黑色隔间，立刻就能感觉到不舒服的电击。短短几秒，小鼠就开始撞墙、震颤、小便，表现出高度紧张的举动。但是，在撞墙的过程中，小鼠或早或晚都会发现白色的门，从而进入没有电击的白色隔间。那里没有奶酪，但是只要一进入这个隔间，痛苦不快的体验就能够停止。


    小鼠 2 经历的是负强化，也就是做出我们所期望的行为时，痛苦、不快或其他负面的体验就能够停止与打断。


    另外，小鼠 2 会比小鼠 1 更快地学会从黑色隔间转移到白色隔间，这个事实可能并不会让你惊讶。一旦小鼠习'
  merge: -1
  img_proc: true
- pgno: 175
  md: '得这一行为，即使黑色隔间的电流已经关闭，小鼠也会立刻跑到白色隔间去。如今，黑色隔间已经因为电击而有了负面的意义。


    负强化有时也会被称为厌恶疗法，“奖励”就是当目标（在我们的案例中是小鼠）符合实验者的期望时，就能够避开或停止不舒服的体验。


    现在，让我们思考一下人类世界的正强化与负强化。在我们举例的过程中，操纵者的形象逐渐成形。


    正如我之前所解释的，在我们的日常生活中有无数正强化的例子。当我们的孩子做了好事、得了高分或在运动中特别努力的时候，我们会表扬他们。当我们的员工做了我们期望的工作，我们会感谢、赞扬他们。我们会感谢朋友的帮忙。当家庭成员展示出慷慨、慈爱、体贴和其他我们渴望的行为时，我们更是会格外感谢他们。


    正强化的例子很多。大体上来说，受到正强化激励的人会在未来重复相同或类似的行为，只要他们觉得这样的强化对于他们的努力是匹配或合适的，他们就会维持相对开心、满足的状态。


    那么像小鼠 2 一样的人又是怎样的呢？想一想一位母亲，她有一个 12 岁的熊孩子，在她眼前是一个乱糟糟的房间。她不断告诉孩子应该打扫房间，当孩子不去打扫，她会开始发火，威胁他如果他不把那些不知道是什么的鬼东'
  merge: -1
  img_proc: true
- pgno: 176
  md: '西移开，把房间搞干净的话就惩罚他。而当小男孩听话之后，唠叨、叫喊与威胁都会停止。她没有告诉他一个好男孩是怎样的，也没有奖励他。她仅仅只是不再发火。瞧！这就是负强化。


    唠叨之于人，就如同电击之于小鼠。拒绝沟通（沉默以对）也是一种负强化。打破沉默就需要有人顺从地做出被期望的行为（道歉是去做他被要求做的事）。无论是什么时候，当一个人要求另一个人，直到他服从自己的要求、需求才会停止这样痛苦、不快的负面体验，就是负强化在起作用。


    还有一些行为，效果也和电击一样，包括生闷气、唠叨、抱怨、哭泣或指责他人。这些技巧奏效时，会唤起人们的内疚感、羞愧感、未达成的义务感和逃避的责任感。


    另外，操纵者也可能会使用恐吓手段，比如说叫喊、诅咒或发怒，唤起目标对否定、对正面对抗、对拒绝或抛弃的恐惧，以此来控制他们。或者说操纵者会将目标与其他人（比如说其他亲戚或同事）进行令人不适的对比，来激发目标的自尊受挫感、自信受挫感与不足感。


    最终，操纵者会通过质问（“你真的知道你想要的是什么吗？”）或是表达出不确定性（“你永远没法完全确定什么事。”）来煽动目标的迷茫、对改变或做出坏选择、犯错的恐惧。'
  merge: -1
  img_proc: true
- pgno: 177
  md: '操纵者用这些手段唤起的负面情绪（内疚、恐惧和不安感），就像电击一样，让人非常不舒服。而顺从与配合操纵者的要求与需求，目标能够立刻（但也只是短期的）从这些痛苦或不适的感觉与恐惧中脱离出来。按照操纵者的要求去做，让不适、不快、痛苦的感觉停止（尽管只是暂时的），目标的行为被负强化了。


    现在，你能看清楚操纵者的手段了。对于潜在损失或其他负面结果的担心或恐惧（比如说，“如果我这个，我就会失去工作。”“如果我 把作业给这个人抄，我就会被排挤。”“如果我不让他来操纵这段关系，他就会离开我。”），当你做出期望行为之后，这些负面的体验就能停止或至少是暂时性地停止。


    负强化是操纵者经常使用的手段。记住，小鼠 2 随时顺从，但它一点也不快乐。被负强化手段控制或操纵的人通常会感到厌恶、生气、沮丧，并且开始感觉到抑郁、低自尊、焦虑以及其他负面症状，这些负面情绪又会延续不快的体验。


    回到第 2 章，我们再看一看那些案例。你是否能够辨识出其中的正强化与负强化例子。


    # 间断强化


    正强化与负强化既可以是持续一致的，也可以是间'
  merge: -1
  img_proc: true
- pgno: 178
  md: '断的、分部分的，且是随机与无法预测的。强化的两个维度——频率模式和强化行为的可预测性，会很大程度影响目标对施加强化的人的感觉，以及对强化引发的行为的感觉。


    部分或间接地施加正强化时，很可能会引致成瘾行为。随机式的强化则可能引发沮丧与强迫行为，因为目标一直在寻求预期的奖励。在包含间断强化的操纵关系中，目标很难分辨出何时他们的行为被间断强化，何时则根本没有任何强化。


    当我面对操纵关系中的病人时，常常会给他們讲“鸽子的故事”。实际上，这是另一项实验，能够展现出持续的强化与间断强化效果的区别。


    这一次，实验样本是鸽子而非小鼠。这次的笼子（有时也会因为行为学家斯金纳而被称为斯金纳之箱）中，只有一套杠杆和食槽，鸽子能用鸟喙戳动杠杆，通过杠杆给食槽加饲料。我们先来看看持续性的正强化是怎样的。


    鸽子 1 进入笼子，它已经饿了一段时间，非常饥饿。它会在笼子里啄来啄去，直到它好奇或碰巧戳中杠杆。一旦它戳中杠杆，鸽饲料就会被传送到食槽里，鸽子 1 立刻就能饱餐一顿。


    鸽子 1 戳动杠杆的行为被正强化了。我们的目的是教会它戳动杠杆，因此我们采用的是被心理学家称为 100% 持'
  merge: -1
  img_proc: true
- pgno: 179
  md: '续的正强化节奏。简单来说，它意味着每一次鸽子 1 戳动杠杆，它都会得到食物。一次戳动，一次食物。很快，鸽子 1 就会培养出戳动杠杆的习惯。


    接下来我们把目光从鸽子 1 转向鸽子 2。它在笼子里的生活一开始和鸽子 1 一样。大约经过 10 次，它就养成了戳动杠杆的习惯。这时我们突然改变了游戏规则。我们不再每次都提供食物，而是变成随机发放。只会在它戳动杠杆的某些时候，以完全随机的方式提供食物。这有时也被称为赌博式节奏，这就是间断强化。


    因此，鸽子 2 可能戳动了 6 次杠杆都没有食物，但第 7 次又有了；之后的 19 次没有，紧接着的 6 次又有了；再之后的 15 次没有，然后又有了 1
    次。关键在于，强化是难以预计的，只有某些时候会有效果。整个过程没有节奏，没有原因。


    为了展现这两种强化节奏的效果，我们不再给两只鸽子任何奖励。它们都不再得到食物。我们会计算在没有任何正强化的情况下，鸽子戳动杠杆的行为会持续多久。因为没有报酬或奖励，心理学家将其视为强迫行为。


    鸽子 1 只持续了很短一段时间。因为此前它每一次都能戳动杠杆获得食物，因此它更容易理解好事已经结束。它很快就慢下来，最终不再去戳动杠杆。毕竟，现在这样做还有什么意义呢？'
  merge: -1
  img_proc: true
- pgno: 180
  md: '然后，在另一个笼子，鸽子 2 依然会在没有任何奖励的情况下持续戳动杠杆，直到筋疲力尽。为什么呢？因为奖励是无法预计的，鸽子 2 根本不知道间断的奖励已经变成了没有奖励。实际上，鸽子
    2 已经对戳动杠杆这种行为上瘾了。以人类的角度来看，习惯间断强化的人心中永远存有望。


    心理学家已经证明，被间断强化的鸽子、小鼠与人类都会养成上瘾、强迫性的行为习惯。想象一个不断玩着老虎机的人。这名赌徒不停地摇动拉杆，大部分时间都在输钱，只有在非常偶尔的情况下能中个奖。这个奖励就是一种“修正”，它让人能够持续这种强迫性的行为到下一次赢。


    人类世界中，操纵情况下的间断强化又是怎样的呢？想象一名女性，她有一位操纵者伴侣，但是她沉醉在这段爱情关系中。这段关系开始时，每一次她做出伴侣期望的行为（性诱惑或帮助他），他都会给予她许多关注、感情与礼物。然而，随着时间过去，他越来越少表现出这些行为。实际上，他的反应变得越来越难以预料了。她会继续对他好，但他的反应十分冷淡，或表现得仿佛这是他应得的。然而有些时候，他又会突然奖励她，说他爱她。他一直以间断强化的方式吊着她。这名女性就像是鸽子
    2。


    再想想一名总裁助理（假设他是一名年轻男性），他为一名女性总裁工作。这位总裁十分出色，但却有着难以捉'
  merge: -1
  img_proc: true
- pgno: 181
  md: '摸的暴脾气。为了得到晋升机会，这位助理十分努力地取悦他龟毛的老板。刚开始，她经常表扬他。然后她会完全忽视了他的努力。但是，有时候，她在办公室的心情会特别糟糕。她会骂他一整天，直到他去做那些能够取悦她的事，辱骂才会停止。他开始被间断负强化所操纵。


    因此，无论是正强化还是负强化，强化的节奏是建立起对他人控制的一个关键因素。持续一致的强化，即使是负面的，也会比间断强化给接受者带来的焦虑与压力小得多。


    实际上，如果你想要煽动他人的焦虑与压力，最有效的方式就是随机、没有规律地给他（她）造成痛苦或不快的经历。想想 911 恐袭之后全国的焦虑感。我们总是在等待着“另一只靴子”落地。


    有些操纵者是彻底的心理恐怖分子，他们会让自己的受害者永远处于危险边缘，时刻担忧下一次不快的经历何时会发生。正是这样的不确定性，而不是坏事本身，滋养着焦虑与压力。


    # 惩 罚


    负强化与惩罚唯一的区别，就是负面体验的时机。在负强化中，令人不快的刺激会发生在目标做出期望行为之前，这种不快的刺激（强化）是否会持续，取决于目标的服从程度。尽管使用负强化的操纵者很少会说出这一手段'
  merge: -1
  img_proc: true
- pgno: 182
  md: '背后的公式，但它实际上很清晰：“除非你按照我想做的，否则我就会一直以这种不快的方式对待你。如果你服从，我就会让你不再受这种折磨。如果你不服从，那么这种糟糕的体验就会继续下去，甚至可能还会有更差的事。”


    而在惩罚中，负面的体验则是目标做出不被期望的行为承受的直接后果。这一手段的法则是：“如果你做了我不喜欢的事，我就会伤害你。”


    惩罚被广泛地作为一种规范或控制机制。然而，大部分人没有意识到，惩罚在控制行为方面远没有正强化与负强化有效。实际上，比起彻底消除不被期望的行为，惩罚往往只会导致不稳定的行为——有时不被期望的行为会继续，有时会暂停，但之后又会以相同或不同的形式出现。


    有趣的是，惩罚奏效时，往往是因为目标已经意识到了负面行为与负面结果之间的关系。结果就是，目标学会了应对惩罚的恐惧，而这一恐惧本身就成了负强化。由于存在这样的恐惧，目标试图通过停止不被期望的行为，做出期望的行为来避免惩罚或负面的结果，这反而削弱了目标对于实际的负面惩罚的恐惧。


    操纵者通常结合使用惩罚与其他强化手段来建立起对受害者的胁迫控制。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 创伤型一次性尝试学习


    操纵者控制目标的第五种方法，就是创伤型一次性尝试学习。这一控制行为的手段就是众所周知的“手放热炉上才知道痛”。换言之，如果你体会过一次被烫的疼痛，你就不会再去做第二次了。


    一次可怕的经历或留下创伤的经历，会持续很长时间，并产生泛化效果。比如说，一名曾经被比特犬攻击咬伤的孩子，很可能一辈子都会害怕狗。泛化效果意味着孩子的害怕不只针对比特犬，也有可能是与比特犬相似的东西，让他（她）能够想起比特犬，甚至是所有的狗。


    当一个人经历了一件非常可怕的事（可能亲眼看到或亲身体验到严重的受伤或死亡，或是感受到自身可能死亡的巨大恐惧），就可能出现创伤后应激障碍（PTSD）的症状。PTSD
    受害者会感觉到无助、受打击与恐惧。这一症状的一个特点就是未来的相似事件，会再次激发受害者的这种恐惧反应。


    “911 恐怖袭击”事件几乎让全美国的人都遭受了一种创伤感。仅仅是观看电视上一遍遍播放的可怕影像就足以让纽约和其他地方的人体会到创伤。创伤感让千里之外的人也感觉自己似乎亲身经历了这一事件。


    但操纵者是如何利用创伤型一次性尝试学习的呢？比'
  merge: -1
  img_proc: true
- pgno: 184
  md: '如说，有身体或精神暴力倾向的丈夫第一次施暴就会让受害者建立起害怕与不安的情绪。在那之后，受害者会一直害怕，并且采取避开再一次暴力的应对方式。不幸的是，几乎所有施暴者都会重复施暴，从而让受害者最初的创伤体验越来越深。


    我有一位病人，是一名初入公司正在接受培训的年轻女性。她很有野心、聪明、有进取心，刚进公司时，就被看作销售界的未来之星。


    在入职培训中，她几乎获得了所有导师的好评，随后她被指派了一名新导师。过了一周，她的新导师把她叫进办公室，关上门对她进行了刻薄的语言人身攻击。新导师的长篇大论持续了整整十分钟，都是在贬低、批评、斥责她，并伴以捶桌子、吼叫与红脸。


    这次经历之后，年轻的姑娘陷入啜泣、颤抖，甚至不得不早退，请假在家度过了这一周。当她回来完成三个月的培训项目时，她依然对新导师充满恐惧。尽管她想从导师的批评中找到有用的东西，但她发现他的话完全没有指向，也没有逻辑。并且他的这次爆发使她陷入焦虑与震颤，影响了她在未来倾听导师建议的能力。


    她不再像之前那样活力十足、有动力，而是开始“放低姿态”，避免被导师注意到。这样“低调”的模式让她的销售数据一落千丈。更甚者，她的焦虑与压力影响了她的'
  merge: -1
  img_proc: true
- pgno: 185
  md: '表现，降低了她的自信。仅仅一次暴怒指责，导师就完成了他的任务：对年轻的女培训生情绪与行为的操纵和控制。


    尽管语言乃至身体攻击是操纵者常用的手段，极端的情绪化与情绪失控也有着非常强烈的冲击。


    我的一名男性病人，和一位女性开心地相处了好几个月，直到有一天，她突然完全“失去控制”并且爆发了“情绪飓风”。他说她开始语无伦次地痛骂，她哭泣、尖叫、啜泣并在最终升级成了“恐怖袭击”。最糟糕的是，她把原因都怪在他身上。


    在这一插曲之后，他还和她约会了几个月。但是他说：“感觉再也不一样了。我总是小心翼翼，害怕会引发另一次情绪崩溃。我再也不想经历那种疯狂了。”


    心理学术语称之为“一次性尝试学习”，是因为它对于受害者的冲击实在太大了，足以实现对受害者的行为控制。但是，那些突然爆发的人往往不会只有这一次的失控，他们的自我控制能力不太好。换言之，如果情绪爆发发生过一次，第二次爆发是早晚的问题。


    # 多手段操纵


    大多数操纵者都会使用大部分乃至所有上面提到的方式来控制受害者的行为。这些手段不是互斥的，操纵者可'
  merge: -1
  img_proc: true
- pgno: 186
  md: '能会改变手段与方式，让自己的行为没有规律可循，以此混淆目标。


    # 弥天大谎


    操纵者的最终手段，就是“弥天大谎”。正如我们之前讨论的，操纵者的控制往往是建立在获益承诺以及规避损失、恐惧或其他坏事上的。一旦受害者被这样的承诺诱骗，操纵者的游戏就开始了。操纵者可能会利用所有强化手段和之前说到的控制方法让受害者为了获益或避开损失而持续地服从自己的需求。


    受害者常常会发现，即使他们的服从堪称完美，承诺的获益也根本不会实现。正如一名操纵者老板的受害者所说的：“我永远无法得到那个晋升机会。无论我做什么都一样。他一直在对我说谎，让我甘愿被他控制。在我经历生命中最糟糕也最艰难的两年之后，我被解雇了。这就是我最后得到的！我只希望能早点意识到这一切就是个大骗局。”


    恋爱操纵的受害者相信，如果他们按照操纵者的要求做，他们就能够赢得他（她）的爱和承诺，反过来，如果他们没能取悦操纵者，他们就会失去他（她）的爱，并最终被抛弃。不幸的是，受害者会发现，操纵他们的人其实'
  merge: -1
  img_proc: true
- pgno: 187
  md: '根本就不爱他们，因此威胁他们会失去他（她）的爱根本就是个大话话。


    发现自己长期以来深陷在一个大骗局中，有一点好处，就是这样的意识能够帮你走出脱离操纵、迈向自由的第一步。


    # 受害者的反控制


    最后，在结束本章之前，我还要解释一下，操纵的受害者有能力对操纵者实现反控制。它是这样实现的：


    一旦胁迫操纵的模式建立起来，操纵关系中的受害者会体验到极度的压力、焦虑、内心冲突与压抑。受害者很少意识到，他在这段操纵过程中也是合谋者。更甚者，受害者会觉得自己受到控制，毫无力量，所以往往也看不到自己的反控制杠杆在哪里。


    记住，要形成操纵关系，就必须有（至少）两个人。在这一章，我们已经看到了操纵者是如何利用看似良性或愉悦的正强化与获益承诺将目标引诱进操纵关系中的。


    我们还看到，随着时间流逝，控制手段往往会从正强化转为负强化。持续与间断强化、惩罚和创伤型一次性尝试学习也都会被用上。


    但是，关键的一点是要意识到，尽管远没有操纵者那么刻意，但受害者也正在控制操纵者。受害者的每一次顺'
  merge: -1
  img_proc: true
- pgno: 188
  md: '从、做出期望的行为（或改正不被期望的行为），操纵者使用的操纵手段都被强化了。还记得在本章关于正强化奖励的讨论吗？每一次受害者服从操纵者的“要求”，操纵者就得到了他的奖励或被正强化了。


    日复一日，受害者会开始觉得自己在操纵者的“五指山中”。可以预见这种压力对于目标的认知、判断与自尊会产生扭曲的影响。最重要的是，压力限制了受害者寻找其他可能，也限制了他们认识到自身权利与自由的能力。结果就造成了操纵的进一步深化，以及彻底的抑郁、焦虑与低自尊。


    因为受害者在操纵者的控制下变得更弱更屈服，后者又更强了，并且更加确信自己的手段是有效的。操纵是情感勒索的一种形式。一旦你屈服于这种勒索，你就强化了勒索者的手段。


    脱离操纵、获得自由的第一步，就是意识到你并不像你以为的那样无力。允许操纵者控制你，是你对自己施加的一种控制。如果你不再服从这样的胁迫，你就能打破操纵手段的有效性。你的服从只会强化操纵。但是，正如你很快将学到的，你的抵抗最终将削弱操纵者的能力，并且松绑那些控制你的情感纽带。


    抵抗是否意味着你就会经受你所害怕的负面结果呢？胁迫性的操纵者是否会更加严苛，迫使你屈服于负强化的'
  merge: -1
  img_proc: true
- pgno: 189
  md: '策略？是的，最开始操纵者很可能会拒绝接受你的抵抗，甚至增强他（她）的胁迫手段。但是，随着持续抵抗，操纵者不得不改变策略或改变目标。操纵只有在有效果时才会继续下去。


    在接下来的几章，我们将会看到，屈服于操纵者的胁迫控制的受害者，心理健康会遭受多大的影响。彻底理解操纵的影响能够帮助你回答下面这些重要的问题：


    +   1. 你允许操纵者控制自己，为此付出情感代价真的值得吗？


    +   2. 配合操纵者的操纵，真的让你避开了更坏的结果（巨大的损失或失去获益的机会）吗？


