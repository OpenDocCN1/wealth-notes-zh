- pgno: 68
  md: '为让他人失望。而长期的不拒绝，则让他人习惯了你的顺从。甚至你自己也会觉得，有求必应是你的唯一选择。


    显然，你表现出的不设限制与边界，以及无法在某些时刻拒绝某些人的行为，让你很容易被操纵。毕竟，如果你无法说“不”，无论是谁，让你按照他们的意愿行事，又有多难呢？缺乏自信，让你被经验丰富的操纵者玩弄于股掌之中。


    仅仅想到要说“不”或可能要说不“不”，就足以让你觉得紧张和焦虑了。你每一次败给自己的恐惧，答应别人“好的”，来减轻自己暂时的焦虑，都强化了无法拒绝他人的习惯。然而，你下意识的顺从，长期来看只会让你付出沉重的代价，并且会被操纵者利用。


    如果你和其他取悦他人者一样，那么你不愿意说“不”的心态，可能是因为你预计拒绝他人会引发他人负面、生气的回应。这样看来，缺乏自信这一按钮，与害怕负面情绪、极力想要避免冲突与对抗是紧紧相连的。


    如果你害怕拒绝会引发他人的怒火或造成你们之间的冲突，如果你倾向于极力避免冲突与对抗，那么你无法拒绝他人的习惯就会被不断强化，你每顺从一次，它就会变得更顽固。那些操纵你的人总能因为你自愿的顺从而乐此不疲。


    拒绝他人也许会让你觉得内疚、焦虑以及不适，因为'
