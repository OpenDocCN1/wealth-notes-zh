- pgno: 193
  md: '现在，你可能正在高度怀疑身边就有一名操纵者，甚至可能不止一个。你可能已经意识到了比较危险的人格特点和操纵者正在使用的手段与策略。你也已经深入观察了自己的性格，你的按钮和你的钩，也就是那些让你容易被操纵者利用的地方。


    理想情况下，这些认知与信息已经能够帮助你在某些人将你诱入陷阱之前就远离他们。但是，现实中，你可能已经被引诱了，甚至可能正被他人以一种让你觉得不适的方式控制着。


    操纵的受害者会从这种有毒的动态中发展出一套对他们自己的感觉。好消息是，你可以用自己的内在寻找线索，判断自己是否正处于一段操纵关系中。最好的检验方式，就是看看你自己对这段关系的感受与反应。


    下面有一个小测试，能够帮助你检验自己是否深陷一段操纵关系之中。首先，找到你感觉相处有问题、很困难，很可能是操纵信号的人。记住，那些对于你最想要的东西'
