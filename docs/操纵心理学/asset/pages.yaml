- pgno: 232
  md: '断练习，使用这一方式抵抗操纵性压力的次数越多，在正式实践之前的准备就做得越充分。


    在练习过程中，从你的同伴那里获取反馈，了解你的姿势、眼神接触、声音的平稳度、音量与音调以及整体的表现。努力让你表现得有力、有自信。不要担心你内心的想法，现在你的目标是提升自己的表现，让自己能够为了实现抵抗目标而表演得像一个自信的人。


    练习、排练以及角色扮演，用这些手段来锻炼抵抗行为还有一个好处。让自己暴露在练习环境中，你就能够适应和真正的操纵者接触时可能会产生的压力。练习的情境越真实，适应与减轻压力的效果就会越好。


    然而，你不应该期望练习能够消除所有的紧张。这样做不仅不现实，还会产生反作用。你的练习让你能够在与操纵者进行直接对话时更好地应对随之而来的紧张情绪。实际上，心理研究表明，一定程度（不太高也不太低）的紧张情绪能够让人表现得更好。


    理想状况下，练习让你能够做好准备。与此同时，适应的效果让你不至于过于紧张而无法有效地思考与说话。通过练习，你能够更好地衡量对你来说合适的边界在哪里。


    # 步骤 3：降低自己对焦虑、恐惧与内疚的敏感程度


    要有效地抵抗操纵，你必须学会容忍某些让人非常不'
