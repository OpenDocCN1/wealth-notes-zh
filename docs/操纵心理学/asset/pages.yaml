- pgno: 69
  md: '经年累月压制自己说“不”的渴望，让你的挫败感不断累积。一旦有发泄的机会，这样的挫败感就可能爆发为怒火。无怪乎取消说“不”的禁令会让你满怀焦虑。你的恐惧，更多是因为你长期压抑的愤恨以及你最终说“不”的极端方式（尖叫着说“不”），而非对“不”这个词本身。


    但是，正如你可能已有所知，当你总是说“好的”（尤其是当你其实真心是想拒绝时），最终你会发现，你只是在无趣地混日子，无论是谁提出要求，你都会将自己宝贵的时间和资源花在他们身上。实际上，你的唯命是从会让你臣服于那些想要控制与操纵你的人。


    你拒绝说“不”的心态，可能也和你的自尊有关，你认为自尊源于为他人付出。按照这样的观点来看，拒绝别人的要求，你就无法为他人完成任务、给他人提供帮助，也就失去了为他人付出的机会。如果你是一名典型的取悦他人者，你的自我价值取决于你为他人所做的事，那么你不愿意放弃一个让自己的成果更多一项的机会，也是可以理解的。


    然而，如果你一直是一名取悦他人者，不够自信，也无法在某些时候拒绝某些人，那么你终将会面临这样的困境：尽管至少迄今为止，你都在全心全意、尽全力去满足几乎每个人的要求，但你的精力终将耗尽。与此同时，你也在不断将自己的控制，拱手让给需要你时会对你提出'
