- pgno: 155
  md: '这一章主要是给你写的，我希望你可以在生命的这个阶段，理清自己的需求。根据操纵的机制，一名操纵者会将钓钩放在你最想获益（即在生活的这个阶段你真正想要或最需要的东西），或最害怕遭受损失的地方。熟练的操纵者似乎有很强的第六感，能够嗅到他们可以从哪里最大化地利用你对获益的渴望与你对损失的恐惧。但是有时候，正是你自己让这样的观察变得简单。


    比如说，你对某些人可能特别坦诚，会告诉他们你的志向、需求、渴望、梦想，以及你对失去的恐惧。另一方面，你可能不会对很多其他人这样公开地说出你最深的渴望与担心。但实际上，你可能完全没意识到你的需求已经完全暴露了。


    对自己坦诚以待，理解自己的需求系统，是非常重要的一步，能够让自己在面对操纵者时更加强韧。记住，操纵者会在目标身上使用不同的控制杠杆，他们可能会手握获益的承诺，激发被害者对损失的恐惧，或是提供避开某'
  merge: -1
  img_proc: true
