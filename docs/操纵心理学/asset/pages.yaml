- pgno: 63
  md: '从而被操纵。对他人福利与幸福怀有的过度责任感，会成为操纵者可以利用的杠杆，他们会以此来引出你的内疚感与义务感，并控制你的行为。更糟的是，仅仅感觉自己会内疚，以及想要避免内疚感，就会成为操纵者的一件武器，被操纵去做自己并不想做的事。


