    # 第一幕：两个辛迪的故事


    从开始接受治疗，鲍勃就学得非常快。他有勇气直接面对我与我自己。作为一名医生，他知道自己与辛迪的关系带来了压力，并且已经让他觉得不适，他需要做出一些重大的改变来实现健康与情感的平衡。


