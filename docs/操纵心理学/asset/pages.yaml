    当然，我不是在说你生活中的每个人（或是几乎每个人）都在操纵你，尽管有时会有这样的感觉。我也不是在建议你要拒人千里或从此拒绝任何紧密亲近的关系。恰恰相反！我们对于爱、联系、意义与安全感的需求，正是从健康的亲密关系中得到满足的。


    但是，这段关系究竟能够帮助你还是伤害你，取决于你与另一方是否能够保持这段关系的平衡，承认并尊重彼此的个人权利与需求。而这当然也需要你自己是一个心理健康的人，另一方也需要有健康、非操纵型的性格。


    这是一个相当难的任务，不是吗？尤其是因为你并不总能够控制或选择你必须接触的人。你无法选择你的家庭。你也基本没办法控制你的同事是谁或你要向谁汇报工作，而这个人却能够向你的职业生涯或经济保障施加控制。


    事实上我从未见过没有遇到过这种事的人。无论是私人事务还是工作事务，无论是家庭还是朋友，每个人都有过被困在一段关系中，被一个性格上有问题的人操纵的经历。


