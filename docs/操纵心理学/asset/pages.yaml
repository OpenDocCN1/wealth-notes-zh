- pgno: 217
  md: '操纵者会入侵你几乎所有的私人领域。如果你是（或曾经是）操纵者的目标，你就会惨痛地意识到，服从操纵者的控制只会让你陷得更深。


    只要操纵开始运作，你对操纵者意愿的每一次屈服，都是在强化操纵。没有反抗，操纵者将践踏、限制你的自由、自主权、人格完整，甚至是你的自尊。


    操纵中那些阴险的本性会给受害者带来无助、失控与需要依赖于他人的感觉。你必须准确地将这些负面的情绪独立出来，意识到它们是感觉，而非事实。


    事实上，在操纵关系中，即使你是被盯上的目标，你也并非毫无力量。下面讨论的这些方法将帮助你打破并最终摧毁操纵者控制你的能力。这些措施将会告诉你有效反对操纵者控制的手段与方法。


    别想着如何直接地改变一名操纵者，这不由你控制。那些厌倦了操纵者圈套的人总会犯这个错误，省省力气吧，这是没有用的。你要做的是着眼于改变自己，这是你能力'
  merge: -1
  img_proc: true
- pgno: 218
  md: '范围内可以做到的。永远记住，操纵存在的原因是它有效果。因此，阻止操纵者最有力的手段，就是改变你的应对方式，让操纵者的手段不再有效。


    你一直都有能力抵抗住压力，阻挠操纵者实现其目标与意图。现在是时候结束你与操纵者的“共谋”了。


    # ## 抵抗或离开，这是个问题


    陷在一段操纵性关系之中，你的首要目的就是不再扮演一名顺从的受害者，不再因此服从于欺骗、胁迫或不公平的控制手段，不再给自己带来压力。要实现这一目标，有两个方式：（1）抵抗，（2）脱离（完全离开这段关系）。这两种方式都是你能够施加于操纵者的反控制手段。


    # ### 抵抗


    抵抗策略就像是黏性糖浆，能够让操纵机制慢下来、给操纵机制制造问题，并且最终使它彻底停滞。如果一开始碰上坚决的抵抗，操纵者首先会加大操纵的强度。然而，如果你面对增加的压力依然不屈服（之后你会学到如何抵御压力），操纵者就只有两条路可走：要么适应你的变化，从而将关系调整为更健康、更尊重、更平衡的形式；要么选择去操纵其他更脆弱的目标，因为脆弱的目标更好控制。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '当你能够成功抵抗住操纵压力，你就能够重建这段关系中的权力平衡。你必须意识到，权力平衡的变化必然会导致这段关系以及参与者的行为。别害怕这种改变。


    因为是你主动改变，并且立场坚决，操纵者只能选择适应你的主动，或困在已经没有效果的策略中，至少在对待和你的关系时只能如此。你必须着眼于自己想要的奖励：通过继续坚决地“保障一致策略”，使以前的操纵手段再也无法有效地控制你，你就能够重获自由、自主权、自尊与人格完整。这无疑是一场值得斗争，并最终胜利的奋斗。


    但是，记住，这对你来说也许是一段可怕的时期。即使你的抵抗策略成功地让其他人给予了更健康，不再具有操纵性的反应，这也将会是一段很难适应的时期。任何关系根本上的运作机制如果出现变化（即使改变的方向是好的），适应时期也会有些艰难。要相信，这样的艰难最终能够带来更加健康与平衡的独立。


    现实中，抵抗在使用时有很多限制。如果抵抗措施没能改变操纵者的行为怎么办？有些操纵关系实在太根深蒂固，太不健康，太难以改变了。而且许多操纵型人格，尤其是前面所说的那样，有着人格障碍的人，根本就不会也不愿意改变。


    对于这样的人，操纵别人就是他们的行为方式：无法'
  merge: -1
  img_proc: true
- pgno: 220
  md: '改变的运行方式。当你运用有效的抵抗措施应对胁迫与压力，争取独立自主时，操纵者的反应很可能是改变目标，然后继续操纵。如果你不愿意玩这个游戏，那么操纵者就会去寻找另一个愿意的目标。


    记住，操纵者使用操纵手段，是因为这些手段有效果。不要助纣为虐。


    # 脱离


    在考虑再三后，你可能会觉得对你来说最好也最健康的方式，就是彻底从操纵关系中抽身而出。操纵带来的情感伤害可能已经无法修复。无论是否重塑，这段关系都不值得你去抵抗修正了。


    在这样的例子中，脱离，或是从这段关系中抽身而出，就是最有效的抵抗。斩断一段关系（即使它是一段不健康的关系）总是会带来悲伤与其他痛苦的感情。但是，如果这段关系始终要求你做一名顺从的受害者，那么结束这段关系，导致的痛苦就会大大降低。很明显，一段要求你放弃自尊、自由与人格完整的关系，并不符合你的个人利益。无论情感纽带如何，无论是家庭、朋友、老板还是爱人，始终陷在一段要求你服从操纵的关系中，对你来说都是无益的。


    比起离开或失去这段关系，继续留在这段关系中，还'
  merge: -1
  img_proc: true
- pgno: 221
  md: '会导致更糟糕的结果。在操纵的迷雾中彻底失去自我，失去你的自我认知、你的价值观、你的需求以及你的信仰，这才是真正致命的灾难。为了这段看似能够带来虚无安全感的关系，继续做操纵的受害者，削弱你的人格完整，失去你的自尊，这样的代价实在是太大了。


    最后，还有一点很重要，你不想被操纵的意愿可能会让你失去这段关系，你会优先选择什么？


    # ## 小规模努力


    如果操纵关系或操纵者不配合你的行为改变，或是这段关系根本不值得你维系，脱离很可能是结束被操纵的最好方式。


    但是，在另外一些操纵关系中，你的反控制能力会受环境所限。在某些环境中，比如说亲戚关系，血缘纽带十分紧密而复杂；或工作关系，你的生计和未来职业发展会受到影响，脱离就不太可行了，至少在短期内是不可行的。


    当你不可能脱离这段关系，而操纵者的性格又不可能出现很大改变时，你就需要将自己的抵抗方式集中在小规模努力上。在这样的环境中，你的自主权与自尊会慢慢恢复，以一小步一小步的节奏，用安静的抗议方式实现一个又一个小小的胜利。如果彻底脱离这段关系不太可能，或'
  merge: -1
  img_proc: true
- pgno: 222
  md: '是说不太合适，你摆脱操纵关系重获自由的路途可能会被推迟甚至重新定义。但是你可以按照自己的节奏来做。


    我的一位病人和她的母亲正处于一段恶性循环的操纵关系中。她与母亲所有的沟通都以失败告终。我的这位病人是一名成年人，有着三个孩子，但她的母亲却一直以待孩子的方式来对待或是说操纵她。在这个例子中，完全的脱离是不可能的。但是，通过学习与应用关键的抵抗技巧，我的病人能够重新定义这段关系，从而使得操纵（虽然她母亲依旧试图操纵她）在大部分时间都是无效的。使用我之后将会讲到的抵抗策略，我的病人打乱了她母亲操纵她的意图，并使操纵变得无效。母亲仍然试图操纵她的女儿，有时候她女儿也会选择服从，但每一次操纵都比之前要困难了。不久，操纵的频率就慢下来了，虽然操纵还没有完全消失。但我的病人已经重新定义了她母亲的关系以及她母亲的操纵，将它限制在自己的容忍范围内。


    # 抵抗操纵的关键七步


    现在，是时候学习抵抗策略来反控制了。在着手改变你的思维方式，并最终改变导致操纵恶性循环的负感觉之前，你要先改变你的行为。


    正如你将看到的，这些步骤是渐进的，而且是相辅相'
  merge: -1
  img_proc: true
- pgno: 223
  md: '成的。你在对操纵者进行反控制时利用的步骤越多，抵抗就越有力。但每一个步骤都有自己的效力，而且仅仅采取其中一种抵抗方式就足以增强你的自我控制感，减轻你作为受害者的感觉与无助感。记住，当你开始采取措施让操纵不再有效，你就会将自己的压力施加在操纵者身上，让他们不得不改变策略或寻求另一个操纵目标来取代你。无论是哪种方式，你都会变得更健康、更快乐。


    有些步骤对于特定的关系或环境来说可能不太合适。这需要你自己决定。重点是，你有可行的方法用来打断操纵，而非只能屈服或强化操纵的毒性模式。


    # 步骤 1：缓兵之计


    操纵者会通过不同的方式向你施加压力，让你按照他的想法行事。他们可能会通过生气、叫喊、点名、摔门以及其他激进的欺凌手段来向你施加压力。他们也可能会选择消极的方式，比如说生闷气、唠叨、哭泣、沉默以对、忽视或其他安静的方式。


    你可能都已经习惯于很快甚至是立刻服从于这些要求，以此逃避操纵者的压力手段。或者说你在操纵者使用这些手段之前，就会先屈服，因为这些手段会给你带来伤害或不适的体验，并且你已经通过负强化，习得了当你放弃抵抗，按照操纵者的意图去做时，这样的痛苦立刻就会消退'
  merge: -1
  img_proc: true
- pgno: 224
  md: '（叫喊会停止，冷暴力会结束）。


    问题在于，当你这样做时，不只是你的服从行为被强化了，操纵者的施压手段也被强化了，因为你屈服于他想让你做的事。这样的情况产生了持续的权力失衡，而这正是操纵者想要的。


    抵抗的第一步是打破这一模式，并且用抵抗来重塑这段关系的权力平衡。你可以在操纵者提出要求和自己做出反应之间空出一段时间。只要你学会留出时间来思考自己的选择，你的自我控制感就能立刻增强。当你能够让操纵者按照自己的时间表行事而非操纵者的，你就能够夺回力量。


    你可能已经形成了自动服从或顺从操纵者要求的坏习惯，会想都不想就直接对操纵者说“好”。你需要打破这个习惯，最好的方式就是在操纵者表达出他的要求之后，给自己留出一点时间，用于思考。


    使用电话沟通，很容易就能实现短时间的喘息。如果操纵者（或潜在的操纵者）在电话里要求你去做某事或去某地，你应该给出这样的反应：


    > “你可能需要在线上稍等一会儿。不好意思/谢谢。”


    > “我可能需要你稍等片刻。谢谢。”


    > “我可能需要暂时离开一会儿。不好意思。”'
  merge: -1
  img_proc: true
- pgno: 225
  md: '“我会在几分钟之后给你打回去。谢谢。”


    注意你并不是在请求他们的许可。你是在告诉操纵者你将会离开一小会儿。这样的短暂时间让你可以准备之后的回应，这也正是缓兵之计（见以下内容）。


    面对面的场合则需要举止更得体一些，但你仍然需要给自己一点时间来打破自动顺从的习惯。给自己几分钟的时间，就能够打破立刻说“是”的习惯或是接受自己不愿做的事的习惯。只要能脱离操纵的情景，即使只是几分钟的时间，也和让打电话的人等一会儿的效果是一样的。


    在操纵者提出要求之后，你做出回应之前，给自己几分钟，去上个厕所、打个紧急的电话、从车里或办公室里拿个东西、倒一杯咖啡或水，或是做一些任何你能想到的事，只要能让你离开操纵者和他的要求几分钟时间。


    无论你是让打电话的人稍等，还是离开面对面的场景，你的目的是让自己有喘息的时间。用鼻子深吸气，再从嘴里呼出来，做20次深呼吸。不要呼吸得太快，你的目的是让自己冷静下来，着眼于下一步行动，也就是拖延时间。


    下面是一些能够拖延操纵者要求的样本回答：


    “我需要一些时间来思考你刚刚说的话。一旦想清楚了我就会来找你。”'
  merge: -1
  img_proc: true
- pgno: 226
  md: '“这件事需要详细的思考，所以我还需要一点时间来考虑，我会尽快告知你结果。”


    “我没有办法现在就给你答复。我需要思考一下。我会尽快告诉你。”


    “我现在没有立场回答这个问题，一旦我有了，我会告诉你。”


    “这是一个重要的问题，我需要花一些时间思考。当然，想好之后我会告诉你。”


    你应该记下这些句子，并且至少复制两份，一份贴在电话上，一份放在钱包里。这样，你就能在喘息的时间里回顾这些句子。


    你可以活用这些答复，也可以增加一些符合你风格的句子。关键点就在于，你在告诉操纵者，你没有遵循他的时间表。同样，你也不是在请求他的允许。请求也许会显得比较有礼貌，但是这样做只会让你将权力与控制拱手让给操纵者。你的目的是重塑权力平衡，让它更平等。


    重要的是，在说出这些话时，你应该是平静温和的。你需要在镜子前大声练习这些句子。在你开始实践之前，给自己几秒钟专注于这一念头：“在我承诺帮助任何人做任何事之前，我有权力先进行思考。”


    在说每句话时，都保持怡人的微笑，这样能够帮助你'
  merge: -1
  img_proc: true
- pgno: 227
  md: '始终保持坚定但愉悦的语调。每句话至少念五遍，每天重复练习三次，直到你的声音听起来笃定、直接而自信。记住，你不是在请求别人给你更多时间，你是在知会别人你需要花一些时间来思考，然后再做出回应。所以不要在每句话结尾都用升调，弄得像在提问似的。


    当你练习过所有这些句子之后，选择至少两句你觉得最合适的。把它们背下来。不断在镜子前大声读出来，如果可能的话，让一名能够给你力量的朋友或医师参与这一过程。你练习的次数越多，真正向操纵者说出这些话时就会越简单。


    当你第一次在操纵者面前实践拖延时间，讲出这些句子时，即使没有达到完美的冷静与坚定也不要紧。在现实情况中，你很可能会觉得焦虑，甚至害怕。不要在意这些情绪，随自己的节奏说出这些句子。将注意力放在说出的句子上，完成自己的抵抗行为。


    在这个阶段，不要担心你的内心想法。感觉到不舒服很正常，因为你正在改变一种根深蒂固的模式，正在面对给你的生活带来巨大困难和压力的人。最重要的是，不要让你的感觉驱使你
    的行为。这正是你一直以来的习惯，你一直因为那些令人不快的操纵手段所带来的恐吓、恐惧与压力，而选择顺从操纵者的需求。


    现在，你已经知道了，当你表现顺从时，操纵者给你'
  merge: -1
