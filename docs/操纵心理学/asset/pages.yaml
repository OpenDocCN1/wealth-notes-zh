- pgno: 66
  md: '如果你害怕冲突、对抗与怒气，那么这就是你暴露在外的按钮，操纵者要做的就很简单了。操纵者能够用恐吓轻易地控制你的行为，比如说抬高声音和（或）暗示你他（她）的怒火已经在爆发边缘了。当这个按钮表现出来，操纵者只需让你感觉到怒气或冲突可能要爆发就可以了。你很可能
    会屈服于他人的操纵，以避免可能会出现的怒火或冲突。


    你甚至可能会为操纵者完成他的工作：你会在心里构想出操纵者生气的场景，即使他暂时还没有怒气爆发的迹象，你也会先退一步，努力避免这样的情况。操纵者有可能根本不在现场，但你的“情绪恐惧症”越发严重，你甚至可以在心里模拟出操纵者的反应，并且最终让自己乖乖屈服务于操纵。


    害怕负面情绪，真正的危险是你越想避免去处理它们，它们看起来就越可怕、越难以控制。你越是避免去面对负面情绪，你就越是无法有效、合适地处理它们。


    讽刺的是，尽管你可能没有完全意识到这种联系，但你越是让操纵者控制你的行为，你就会变得越愤怒。


    那么，我们能够或者说需要避免怒气、冲突与对抗吗？事实上负面情绪内置于人类天性之中。这意味着我们所有人在生理设置上自然就会感觉到怒火，并且会在别人伤害我们或伤害我们所爱、所关心的人时予以反击。想要'
