  md: '要求的操纵者们。


    学会说“不”，是增强自己对操纵的抵抗力的必要步骤。


    # 第五个按钮：湮没的自我


    有些人深陷“湮没的自我”，对于自己的身份、源于何处、终于何处、感觉与满足谁的需求、灵魂深处最优价值的东西，只有模糊的认识。你是这样的吗？


    这个按钮，既是被操纵的起因，亦是被操纵的结果。你越是让自己成为他人手中的棋子，在你自己与他人眼中，你自己的身份个性就越不明晰。


    如果你同意这一论述，即“除掉那些你为他人所做的事，你不知道自己究竟是谁，又究竟为谁”，那么这一按钮就是你的脆弱点。有些人感觉自我在逐渐模糊，他们将这种经历形容为隐形，他们有着与他人不同的需求与特点，却往往被无视。甚至你也许会在梦里或半梦半醒间感觉自己真的在缩小。


    模糊的身份意识与自我感知，往往根植于童年经历中，这些经历会干扰、阻碍自我的健康发展。这可能来自父母的负面反馈，也可能来自其他在儿童生活中扮演着重要角色的人的负面反应，孩子们反复听到负面反馈，并最终'
  merge: -1
  img_proc: true
- pgno: 71
  md: '“了解到”他们自己的意见根本不重要，认为自己不够聪明或不够能干，这些儿童一直被要求顺从更有权势、更具权威的人的意愿。


    当你的身份模糊而失焦时，你会感觉自己与真正的自我产生了异化，和他人产生了疏离。当你没有清楚地向别人展示自己，设定合适的界限、说“不”、为自己争取权利，定义出你的边界，其他人就会将他们的意念强加于你，用他们的想法定义“你是谁”，或者更准确地说，就是他们他们用他们需要你成为的样子，强加于你的身份个性之上。


    心理学家有一种传统的测试来分析人的个性，即罗夏墨迹测验（Rorschach）。它包含了一系列卡片，每张卡片上都有模糊不清的墨迹，测试对象会被要求将它们当作画来“看”。这项测验的理论是：每个人都会将自己“需要”看到的东西投射到模糊不清的墨迹上去。


    当你展现给世界的是一个身份个性模糊不清的自己时，你就是在邀请其他人根据他们的需求和意念来塑造你。我将其称为罗夏现象。


    身份个性模糊、自我意识逐渐湮没的人，是操纵者的猎物。日积月累，操纵关系只会越来越严重地削弱侵蚀受害者的个性与身份。


    如果你对自己的身份个性没有肯定且清晰的认识，就很容易被操纵，而且几乎肯定会被操纵者盯上。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 第六个按钮：自我信赖意识低


    自我信赖意识低，意味着你不相信自己的判断与反应，以及由此导致的对自我引导能力的损害。这一按钮与第五个按钮紧密相连。


    对自己的认知模糊不清，会削弱你对自己判断能力的信任。如果你无法依靠你自己、你的判断和你的价值观来做决定，那么你必然会更倾向于依靠别人的判断与指引来解决问题。当这个决定与人际关系有关时，这种情况尤甚，而别人会希望能够在这段关系中操纵你。


    如果你不想成为操纵者的目标，就要成为一个自我导向的人。如果你不能自我疏导，不相信自己的判断与价值观，你就会越来越依赖他人，这样你必然会受到他人的控制，满足操纵者的目的与利益。


    自尊心强的人，比起自尊心不那么强的人，一般会更加信赖自己，所以在人际交往中更多按自己的意愿来做决定的人，会因此变得自尊心更强，这并不奇怪。简而言之，如果你不把自己当回事，尤其是如果你甚至没法看清你自己（第五个按钮），你就很难在人际交往中展现出独立、自主、自我信赖的一面。


    这种情况下，你会严重依赖他人的判断、意见与决策，甚至胜过自己，而这样做只会招惹来各种类型的操纵者。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '自我信赖程度低的人，总是倾向于询问其他人（几乎是他们认识的每个人）的意见和建议，无论是做决定、解决问题，还是购物、换发型、找娱乐方式、做生意，或几乎任何需要他们做主的事情，他们都要问别人。往往询问了太多人的意见，让事情变得更复杂。而且自我信赖程度低的人往往也不相信自己有能力整理和吸收自己苦苦寻求来的多方面意见，这就需要其他人来帮助他们理解别人说的话。只要需要决定，他们就会觉得焦虑犹豫。


    增强你做决定的能力，尤其是消除决策后的懊悔（也被称为“买家的懊悔”）的技巧，对提高自我信赖十分有帮助。无法依赖自己的判断力、无法自己指引自己做出选择，你就始终都是操纵者的主要目标。


    # 第七个按钮：外控制点


    控制点（locus of control，简称 LOC）是一个心理学名词，指的是你如何以及在何种程度上将事件发生（或未发生）的原因归咎于自身。外控型的人普遍认为他们生活中发生的事，更多是由别人或外部因素引起，而非自己所能控制的。相反，内控型的人则相信，发生在他们生活中的事，主要是由自己控制的。


    控制点（LOC）反映了你的生活经历以及你习得的理'
  merge: -1
  img_proc: true
- pgno: 74
  md: '解与看待世界的方式。内控型性格并不意味着你认为自己能够控制所有的事情，也不意味着你不相信自己有更高的力量，或是你没有意识到自己能够控制的范围。比如说，相信自己能够控制天气，就不是一个健康的内控点，而仅仅是一种妄想。


    另一方面，相信自己的成功很大程度上是自己努力付出的结果，相信自己在学校获得的成绩来自自己的能力与努力，则是正确健康的内控点的例子。


    研究表明，内控型的人会比外控型的人拥有更高的自尊。结果就是，内控型的人不那么容易成为操纵者的猎物。


    心理学家有一个专门的词，用来指称个性中的这一方面，即个人效能，它是一个重要的变量。个人效能高的人相信自己能够掌控周围的环境，拥有实现自己想法的能力。个人效能低的人则没有这种掌控感。他们在生活中不能有效促使事情发生，从而导致他们无法像拥有高个人效能的内控型人士那样，做出相同程度且方向明确的主动努力。


    如果你相信对于你的生活，其他人比你自已更有影响力和控制力，那么毫无疑问你会更容易受到他人的影响，乃至于被他们操纵。更甚者，基于你默认被他人操纵、成为受害者的程度，你
    “被自我以外的力量所控制 ” 这样的观念会被不断增强与持续。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '通过发展自己的内控点、提高个人效能，你能够尽量降低受制于操纵者的概率。换言之，当你成为操纵者眼里的“硬骨头”，你就能够更好地控制自己的生活。


    当你认为你的生活大都不由你自己掌控，而是被其他人控制或觉得其他外部力量比你自己更强大，你很有可能会感到抑郁。


    外控点与抑郁的联系建立在习得性无助之上。习得性无助是一种思维定式，也就是你认为有严重后果的负面之事终究会发生在你身上，并且你几乎没有任何办法来影响或改变这些事。当你相信坏事恒总会发生，而自己的行动无法控制、预计、避免、减弱或逃脱这些负面后果，你就陷入了抑郁的心态。


    因此，外控型人格会让你更容易抑郁，而抑郁的心态，则会吞噬任何你还保有的想要改变生活的动力、活力与乐观。很明显，这是一个恶性循环。外控型人格还会影响你的身体健康，因为“屈服/放弃”的心态，已经被证明是降低免疫系统能力、损害身体健康的风险因素。


    内控型人格的人则不那么容易抑郁，因为根据定义，他们没有习得性无助的心态。他们相信，他们所做的一切能够（很大程度）影响到他们生活中发生的事。


    现在，你已经知道了操纵者会利用的按钮，也就是你性格中让你容易被操纵的七个方面。后文你还会学习如何'
  merge: -1
  img_proc: true
