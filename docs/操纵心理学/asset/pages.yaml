- pgno: 201
  md: '在我实践临床心理学的这 25 年时间里，从没有见过有人来找我是希望能够停止操纵别人。而另一方面，操纵的受害者却常常会寻求心理咨询，来帮助他们处理这段给他们带来巨大失落与压力的关系。


    一般来说，当受害者的抑郁强到需要寻求帮助时，操纵者的控制信号就很明显了。“蜜月期”或最开始的良性影响早就过去，操纵者开始拉紧胁迫控制的绳索。有时，受害者完全明白自己正被操纵，被困在了一个网里。然而，还有些时候，受害者对他（她）所陷入的操纵毫无知觉。


    # # 雪中足迹


    不管怎样，受害者通常会抱怨，他们不知道操纵者真正的欲望和动机究竟是什么。在这段关系中，受害者常常会 说他们觉得不开心、高度紧张、充满担心与焦虑。根据'
  merge: -1
  img_proc: true
- pgno: 202
  md: '个人情况不同，受害者会觉得对他们自己的行为与感情完全“失去控制”，只有在某些时候才能意识到操纵者真的在控制他们。


    尽管目标或受害者目前还不清楚操纵以及他（她）自己在其中扮演的角色，经验丰富的医师能够找到操纵者在受害者心理上留下的“脚印”。在这个意义上，尽管操纵者不会出现在诊疗室（虽然他之后也许会无奈地加入治疗过程），他（她）的个人身份能够通过“雪中足迹”，或更准确地说，通过受害者的心理状态被识别出来的。


    # 默认协定


    在操纵者与受害者之间，往往有彼此默认的协定，不会直接说出这段关系的“法则”。操纵者控制的某个部分就是在这段关系中能沟通和不能沟通的部分。这往往还伴随着不愿意或不能参与某段对话的心态（比如说“我现在没有谈这个的心情”或“我现在没有时间讨论这个”）。


    不必开口，操纵者就能够通过完全忽视某条评论或问题、走开、挂电话或表明他（她）不接受讨论等形式来表示不悦。


    默认协定很容易就能确定下来。沟通，尤其是关于这段关系中权力与控制动态的沟通，是被限制或是禁止'
  merge: -1
  img_proc: true
- pgno: 203
  md: '的。对于受害者而言，即使只是提到操纵正在发生这一事实也有可能会引发冲突与正面对抗的威胁。因此沉默就这样继续下去了。


    我从沮丧的病人那里听到了很多类似的故事，他们最终都觉得自己被困在操纵之墙中。然而，要让受害者意识到这段关系现在处于何种情形，还需要一段时间。


    当威胁是暗示性质的，就不会有直接的回应。实际上，暗示性威胁、胁迫与恐吓的效能，正源于受害者的无能（或是看起来的无能），因为他们甚至不敢说起他们感觉正在被操纵这一事实。


    只要操纵者的真实意图始终被隐藏或是模糊不清，这样的模式就会继续下去。通过控制与限制沟通，操纵者会让受害者不断累积沮丧，并最终转换成敌意。然而，如果没有表达这些负面情绪的渠道，这些感觉往往会内化，从而导致受害者的情感伤害。


    # 操纵带来的情感重创


    在第 10 章，你已经评估了自己成为操纵关系的受害者的可能性。如果你的分数处于危险区间，你很可能正在经历操纵带来的负面情绪影响。


    被操纵意味着你将自己的感觉、行为甚至思维的控制'
  merge: -1
  img_proc: true
- pgno: 204
  md: '权让渡给了其他人。尽管操纵关系在开始时可能具有巨大收益，但控制带来的积极性几乎毫无疑问会转化成胁迫或负面影响。一旦操纵成立，控制杠杆就会更偏向于恐惧与威胁。


    回想第9章中操纵的机制，尽管负强化在控制行为方面非常有效，但它的目标是不快乐、不适应。大体上来说，负强化、惩罚与创伤型一次性尝试学习，根本上都是胁迫性的。很少有人会喜欢被胁迫的感觉。


    如果操纵还包括间断强化，也就是你永远无法确定何时会出现奖励，那么受害者就会体验到非常强烈的焦虑。缺乏规律会导致高度的不确定性，而它反过来又会导致焦虑。


    因此，操纵既是胁迫性的，也是令人焦虑的。它还非常容易让人沮丧，并会促发敌意与怒火。这些就是让受害者持续受到情感重创的毒性感觉。


    然而，操纵关系的受害者还会发展出其他信号与症状。受害者往往感觉需要为自己心中的负面情绪与反应负责任。自我谴责变成了受害者心理的一个主要特点。


    但是，更深入地了解操纵的运作方式，能够帮助你了解到，这些负面情绪是能够被理解的，甚至是不可避免的，因为它们是对操纵造成的压力与沮丧的反应。


    我们来看看操纵的其他受害者会有哪些情绪反应。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# ## 对操纵者的真实动机产生疑惑


    受害者对操纵者动机的疑惑，往往是操纵性控制的一个重要部分。记住，操纵者的最终目的就是毫不在意其他人，仅仅提升自己的利益，实现自己的目的。然而，一名熟练、精明的操纵者，会伪装他的真实动机。他通常会用消除警戒心或做保证的方式，比如说“你知道我只是想让你开心”或“我的心里只有你的最高利益”，或是“我站在你这一边，我在试图帮助你”。


    当操纵发生在家庭／婚姻／爱情关系中，受害者的疑惑会被放大许多倍。在这样的关系中，人们总是期望爱与利他主义会胜过操纵的自私目标。你不会想到，那些说爱你的人会操纵你、压迫你，因此你可能会启动防御机制，不承认这一点，让自己逃避痛苦的认知。然而，我见过的操纵关系中最痛苦的经历，实际上都发生在家庭中。


    有时候，受害者产生疑惑是因为操纵者精心伪装了自己的动机。另外一些时候，受害者的否认与恐惧让他无法意识控制自己的操纵手段。在这样的例子中，受害者在完全发现操纵对他的情感与身体健康造成的负面影响之前，往往深陷于某种操纵模式中。


    比如说，在家庭关系或婚姻关系中，对于爱的期待与假设往往会蒙蔽受害者的准确认知，让他们对真实存在的'
  merge: -1
  img_proc: true
- pgno: 206
  md: '操纵视而不见。“我知道我的丈夫真的很爱我，”在某次疗程中，一名经受了数年情感虐待与操纵的抑郁妻子这样对我说，“但我总是让他失望。”


    这样的受害者同样反映出了操纵对自尊的腐蚀性影响。通常来看，就像这个例子一样，这些腐蚀性影响会让受害者将指责内化，并将自己看作这段关系出现问题的原因。与这一类病人打交道时，帮助他们重建自信，往往是最优先的治疗选择，甚至比帮助他们处理生活中的操纵关系还要靠前。


    默认协定与隐藏意图不可避免地会让受害者对于操纵者的“真实手段”与“真实需求”产生疑惑。如果操纵者回避直接的沟通，尤其是回避关于关系中的权力与控制动态的沟通，那么被操纵者也就失去了澄清事实和释疑的最有效手段。


    有些操纵会颠覆原本的权力结构，而在这样的操纵关系中往往也存在着疑惑。比如说，父母常常意识不到他们的孩子正在操纵他们；上级或老板也许很慢才能意识到实际上是他们的下属在掌握控制权。


    只要操纵者利用间断强化的控制手段，疑惑、压力与焦虑就会因为强化节奏的不确定性和不规律性而增强。


    最终，一定要记住，操纵者大多很擅长说谎。只要对他们有利，他们就会用说谎来伪装自己的动机。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 对这段关系的失望与不满


    随着操纵的不断加强与失望。受害者常会说，无论自己多么努力，似乎都无法让操纵者开心。


    当然，根据定义，由于操纵关系是为了满足操纵者的需求，受害者会逐渐变得失望与不满，因为时日一长，被操纵者的未满足需求与日俱增。当需求没有得到满足，他们就会变得更加具有压迫性。


    有些受害者想要改变这段关系却没有成功，我们能够理解他们的失望之情。如果受害者将自己的自我价值与操纵者的改变意愿联系在一起，自尊就必定会被侵蚀。比如“如果他真的爱我、珍惜我，他就会改变的”以及“如果我向她展示了自己的工作有多么出色，她就会以不同的方式对待我”。这么多年来，我从病人那里得到的典型例子都是这一类的。


    从心理学角度上说，就像白天之后会有黑夜一样，沮丧失望必然会带来敌意与攻击性。即使受害者抑制自己累积的怒气，担心如果自己直接表达出来会导致负面的结果，但是这样有毒的情绪与高度敌意造成的健康受损依旧会让他痛苦。研究已经标明，持续的敌意对心血管健康有着巨大的损害，会提高中风、心脏病与动脉硬化的风险。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 不平衡的权力与控制感


    虽然受害者常常会对操纵者的动机与手段感到疑惑，他们也能够很清晰地感觉到这段关系中的权力与控制机制非常不对称、不平衡。他们通常都会承认，另一个人，也就是操纵者掌控着这段关系。即使是最开始没有意识到这一点的病人，也几乎本能地知道这段关系有点不正常，更准确地说，是失衡。


    受害者往往会发现，操纵者的需求支配了这段关系，而他们自己的需求却是无处表达、不被承认，从而无法得到满足的。


    受害者的这种失衡感，反映了操纵的现实。需要重点说明的是，最开始让受害者容易被操纵的按钮，实际上都强化了操纵者具有支配地位的观点与事实。


    比如说，有取悦症或对获取他人肯定上瘾的人，首先就会把别人的需求放在前面。外控型的受害者或不愿意依靠自己独立判断的人，会提前设想或创造出别人比他自己更具控制权的关系。实际上，他们的做法也是对自己的操纵。


    无论受害者是否明白自己是在配合操纵者的支配，负面情绪带来的影响本质上都是一样的。除了前面提到的疑惑、失望、敌意与不满，受害者还会感觉自己受到剥割、'
  merge: -1
  img_proc: true
- pgno: 209
  md: '不被理解、被贬低或被忽略。他们往往也会觉得被控制或完全失去控制。最终，他们会感到抑郁、不安、紧张、忧虑与焦虑。


    # 低落的自信与自尊


    操纵关系满足了操纵者自己的需求，却削弱了受害者的自尊。随着操纵的持续，受害者原本健康的自主意识会被逐渐侵蚀。


    受害者越是屈服于操纵者的控制，他就越难将自己视为自主、独立、自信的成年人。结果导致受害者的自尊和自信在持续的操纵中不断被削弱。


    尽管受害者的需求依旧被掩藏在这段关系的深处，但在这个过程中他会变得越来越依赖操纵者，或这段关系及其所代表的东西（比如说他的工作与职业发展、家庭，或是对这段关系的承诺）。


    受害者低落的自尊会强化依赖性、无助感与失控感，而这些感觉组成了抑郁症的危险公式。


    # 对操纵者的怨气与怒火


    在政治史中我们常常看到，操纵、控制、剥削他人的'
  merge: -1
  img_proc: true
- pgno: 210
  md: '人（尤其是不愿意分享权力的独裁者）最终会引发愤怒与反抗。然而，愤怒以战争或抗议的形式公开爆发之前，会在很长的时间内默默累积，并培育着抵抗的计划与激情，以及革命的斗士。


    放在人际关系的操纵中，剥削、控制以及对自由与独立的限制是共通的。当你的自由与自主权被操纵者紧紧控制时，必定会产生失望的情绪，怒气与攻击性也会随之而生。


    然而，正如革命斗士最初都以地下组织的形式进行活动，受害者的怒气最开始也是隐藏起来的。换句话说，受害者很可能会抑制自己因为被操纵的怒气，而不是直接打破默认协定，冒着与操纵者正面对抗的风险。


    允许他人对你施加高度压力是最可怕的风险。现代医学压力理论之父汉斯·西利（Hans Selye）博士认为，最危险的压力是由他人所导致的压力。实际上，西利建议你应该切断自己与造成你压力的人之间的联系。


    操纵者导致的有害压力的核心部分是被激起的怒火，但它却没有直接的方式能够发泄出去，至少无法对造成这样的失望与敌意的人发泄。由于缺乏直接表达的机会，受害者可能会将压力导向其他方向，并因此带来更多的有害结果。


    比如说，我的一位病人将怒火转向了自身，这让她产生了自我谴责、内疚与抑郁。另一名病人则将怒气变成了'
  merge: -1
  img_proc: true
- pgno: 211
  md: '危险的生理冲动，从而导致他更容易出现身体问题与疾病。而对于你，你可能会将脾气转移到其他关系中（与操纵者之外的关系），将压抑的怒火变成烦躁、没耐心、过度苛责等其他坏脾气。


    # 圈套与受害者思维


    正如我们看到的，操纵关系会在很多方面给受害者带来压力。无论原因为何，每日与高强度的有害压力为伍，结果就是助长了压力不断延续的恶性循环。


    由于其胁迫性与无规律性，操纵会带来焦虑与抑郁等压力。压力会扭曲受害者的认知、思维与判断。尤其是压力杜绝了受害者寻求其他方法、找到出口以及改变现状的能力。受害者只能看到两种行为方法：要么我按照他想要的做，要么我就要面对无法容忍的糟糕结果。


    受害者感觉被某种操纵模式困住了，他们看不到逃脱的方法。实际上，受害者只能看到自己被困在操纵关系中，这是因为他自己的负面思维困住了他。负面思维扭曲与放大了结果的负面性。


    此外，受害者也被困在自己扮演的受害者形象中。受害者觉得自己就是受害者，对于那些将受害者身份纳入自我意识的人来说，受害者思维是一种有害的思维与行为模式。'
  merge: -1
  img_proc: true
- pgno: 212
  md: '而且你将自己视为受害者也会给你的情感带来有害影响。


    受害者思维的心理表现包括无助感、被动感和失控感；悲观主义与负面思维；强烈的内疚感、羞愧感、自责与抑郁。这种思维方式可能会导致失望、绝望，甚至会让受害者放弃在未来做出改变，努力变得更好的可能。


    简而言之，操纵会损害受害者的心理健康，因为它导致并且延续了受害者作为受害者的感觉与认知。你越觉得自己是个受害者，你就越会觉得自己无法逃脱这个有毒的模式。你服从操纵者的要求与需求时间越长，你就越会觉得自己被困在操纵者的控制之网中。


    操纵延续下去的方式还有一条。还记得你在第2章与第4章中了解到的让你容易被操纵的七个按钮吗？简单来说，它们包括：


    +   1. 取悦他人的习惯与心态

    2. 对获得肯定上瘾

    3. 害怕怒气、冲突与正面对抗，并且想要避开它们

    4. 无法坚决地拒绝

    5. 消失的自我：模糊的个人身份与不清晰的个人边界

    6. 低自信

    7. 外控型人格：一个人相信，在他（她）身上发'
  merge: -1
  img_proc: true
- pgno: 213
  md: '生的事，更多的是由于别人的控制或外部因素（比如说运气），而非他（她）自己


    这些特殊的需求与人格特点让你很自然地就会变成操纵者的目标。而且，很可能你也已经意识到了，如果你成了操纵关系中的受害者，这些按钮很可能还会发展成最终的结果。


    它的意味很清楚：当你持续作为操纵关系的受害者，你在感情上就会更加脆弱，就会在现在与未来更容易被操纵关系所控制。


    # ## 逃脱操纵：相信你自己


    作为一名受害者，你可能已经有了惨痛的教训，操纵会削弱你的自主意识、激发你的恐惧以及让你的思维方式走向负面。要重新掌控自己的生活，逃脱这一操纵模式，你就需要依赖你自己，而这正是操纵者极力避免的。


    这需要努力与决心。只要你还在取悦操纵者，想要获得他的肯定，不惜一切代价想要避免怒火与正面对抗，你的自我信赖意识就始终会受到伤害。而这正是操纵者想要的结果。如果你不相信自已，你很可能会继续被操纵者控制。操纵者希望变得无力，变得去依附他。操纵者想要'
  merge: -1
  img_proc: true
- pgno: 214
  md: '你继续去做他希望的事。


    但是，阅读完本书，你能发现一个非常不一样的自我，一个想要推翻或改变有害操纵，重获自尊与主动权的自我。你想要消除压力、焦虑、抑郁这些被受害者思维引发与延续的负面情绪。


    在长期的无力感之后，你怎样开始相信自己？信任，是信仰上的一次飞跃。你必须实现它，决定相信自己，因为你就是改变的主角。


    只要操纵始终有效，无论你是否用顺从或抵抗来强化操纵者的手段，操纵者都没有动力，也不需要改变这段关系的运作模式。但你有意。


    现在你知道，不改变自己，就会促使操纵者更加牢固地控制你。你甚至还会引来更多的操纵者。你已经意识到了现在忍受的压力给你的心理与生理健康以及其他关系带来了多大的负面伤害。


    但是你现在还不知道如何改变自己。本书剩下的部分就是教会你逃脱控制的方法。从这一刻起，将你自己作为一名前受害者，一个曾经被操纵过的人。


    从现在开始，你接受的培训会让你成为强硬的战士，对抗生命中的操纵者。你是为自己的个人自由、心理与身体健康以及你的自尊与人格完整而战。


    大胆进发，翻开下一页。'
  merge: -1
  img_proc: true
