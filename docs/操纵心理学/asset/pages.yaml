  md: '处负强化的循环中。他发现取消计划、买礼物，屈服于辛迪的情绪（生气、哭泣、尖叫），都只会强化操纵本身。他意识到他在强化与奖励辛迪依赖他、黏着他的行为。


    真正的转折点出现在鲍勃将他自己视为鸽子 2 时。他被间断强化所诱惑，期待那个与他陷入爱河的“以前的辛迪”再次出现。鲍勃意识到，每一次当他感到“以前的辛迪”可能重现时，他就被“定住了”，并且对这个病态循环更加上瘾。


    鲍勃要求辛迪一起加入治疗，但她拒绝了。她继续指责鲍勃让她搬离了有安全感的家乡。讽刺的是，辛迪指责鲍勃操纵她，变成了一个她认不出来的人。


    而这正是鲍勃需要的开端。他告诉辛迪，他觉得他们都对彼此很失望。他说他已经决定在他们给彼此带来更深伤害之前结束这段关系。在几次哭泣与发火之后，辛迪同意了。


    鲍勃给辛迪买好了回纽约的机票，并帮助她找到了新房子。他向辛迪原来的老板建议，请他们重新雇用辛迪，因为她是“最好的会议组织者”。


    辛迪在一周之内离开了。鲍勃的胃不痛了。辛迪干回了自己的老本行。10 个月之后，鲍勃与他同一栋楼工作的儿科医生结婚了。'
