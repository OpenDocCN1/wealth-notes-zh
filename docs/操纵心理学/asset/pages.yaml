- pgno: 27
  md: '操纵有多种多样的形式与伪装。如果将我职业生涯中遇到的所有操纵关系案例都记录下来，没有数千页，也有数百页，对于一本书而言，这样的篇幅实在很巨大。为了符合本书的写作目的，我选择了五个故事，他们代表性地展现了操纵带来的胁迫性控制与无助感。


    在接下来的案例中，你会看到我的一些病人与他们生活中的某些人——配偶、爱人、父母、兄弟姐妹、同事。他们面对的操纵情景会展现在你眼前。如果你正处于或曾经处于一段操纵关系中，你很可能会对这些人和他们面对的场景感到非常熟悉，请你牢记这些案例，因为你在阅读本书时会不断看到这些案例。我会后文时不时地回溯这些案例，来阐释操纵的关键点。


    在阅读过程中，你可以一边学习操纵的动态机制与有效打断操纵进程的规避方法，一边思考你会如何处理我的病人们面临的困境。在后面的章节，我们会回顾这些故事，找出每一个案例的解决方法。'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# 第一幕：两个辛迪的故事


    鲍勃是一名十分成功的医生，他居住在加州比弗利山，常常被邀请去全国各地做演讲，并受邀成为医学会议的荣誉委员会成员。在前往纽约的一趟旅程中，他遇见了辛迪。辛迪的工作是为大型医药公司、大学与其他客户协调与组织医学会议。鲍勃与辛迪很快就彼此吸引，不久就开始了一段热烈的恋爱。


    鲍勃的家与工作在西海岸，而辛迪的家与工作则在东海岸，这段异地恋既兴奋刺激，亦有重重困难。随着恋情不断升温，鲍勃几乎每周都要飞到纽约，度过激情却短暂的周末时光。


    鲍勃第一次来找我时，我问他最开始辛迪究竟具有何种特质吸引了他。他毫不犹豫地告诉我，他爱辛迪的自信。辛迪美丽、淡定、自信，她是一个健谈的人，也是一位热情似火的爱人。但除此之外，鲍勃最欣赏辛迪表现出来的独立。辛迪事业成功，鲍勃也参加了很多由辛迪组织的医学会议，他感觉辛迪在工作上十分出色。


    经历了三个月的异地恋之后，鲍勃和辛迪认为这样异地对他们来说都太辛苦了，他们开始讨论同居与结婚事宜。他们在搬家问题上没什么争论，都认为让鲍勃放弃兴旺的医疗工作，在纽约重新开始，是不理智也不实际的。所以，'
  merge: -1
  img_proc: true
- pgno: 29
  md: '辛迪很高兴地自愿搬到西部。在下定决心的一个月之内，辛迪就收拾妥当，搬到了鲍勃在洛杉矶西部的豪宅。


    起初，这对于他们而言是极乐之境。辛迪对鲍勃可谓百依百顺，她很爱为鲍勃下厨，并且对他体贴入微。而鲍勃也很享受这样的关注，并努力以同样的态度回报辛迪。


    这样的新生活持续了数周，有一天鲍勃说周六要和朋友去打网球。辛迪对此特别不快。她的反应让鲍勃十分震惊。


    辛迪面露不悦地抱怨，她“放弃一切”搬到加州，却被“抛弃”了。辛迪说她在加州没有亲朋好友，而“鲍勃要在外面待一整天，她留在家里应该干什么呢”，种种类似的埋怨。


    就这样，辛迪在鲍勃眼中的形象似乎变了。曾经独立、自信的纽约客，如今看起来更像个困苦、怨怼的普通女人。


    辛迪的这一面，鲍勃从未见过，他也不喜欢。但是，鲍勃承诺网球活动一结束就赶回家，取消与朋友共进午餐的计划，辛迪的心情因此有所恢复。


    在这瞬间，“曾经的”辛迪似乎又回来了。


    然而，网球事件只是一个开始。每一次鲍勃要独自去某个地方，辛迪都会抱怨，并且这种怨怼与日俱增。最初，她嗷嗷生气、闹别扭、哭泣、沉默、假装痛苦、拒绝做爱，以此来给鲍勃施压、惩罚鲍勃。而且她这样做往往能够成功地操纵鲍勃，让鲍勃改计划或偶尔也带上她一起出门。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '辛迪十分擅长让鲍勃因为留下她一人而感到内疚。


    时日一长，辛迪闹别扭的方式转变成了怒吼和尖叫。鲍勃不喜欢争斗与情感纠结，因此他不得不陷入扯线木偶的境地。他取消了自己的活动计划，拒绝了网球与高尔夫的邀请，缩短了在健身房锻炼的时间。辛迪的怒气让鲍勃身心俱疲，他发现只要辛迪开始对着他尖声发怒，他就会立刻妥协。他想要找到一个能够尽快规避“这种痛苦”的方式。辛迪则发现，抬高声音是她“军火库”中的致命武器，她开始以惊人的频率毫不迟疑地使用它。就这样，鲍勃只要一想到辛迪的脾气可能会爆发，就会立即投降，对她百依百顺。


    有时，鲍勃道歉并且承诺绝不会“抛弃”她之后，至少在短时间内，辛迪又会回复到“曾经的”状态。但是鲍勃却由于他的纵容陷入麻烦。他最主要是被自己的行为所困扰，他看不起那些被女人操纵的男人，可是“现在的”辛迪却以黏人、反复无常的举动让他身心俱疲。无论何时，只要他和男性友人有出游计划，辛迪就会哭泣或发怒。更糟的是，当鲍勃在周末“被喊出去”时，辛迪会以冷暴力或拒绝做爱来惩罚他。


    鲍勃对于辛迪的惩罚性情感摧毁实在是太过恐惧，每当鲍勃打算与朋友外出打网球或高尔夫时，就会剧烈胃痛。辛迪则会抓住一切机会提醒鲍勃，她是放弃了一切搬到加'
  merge: -1
  img_proc: true
- pgno: 31
  md: '州的。但是辛迪从不努力去交新朋友或找点有意义的事做，鲍勃对她这样的态度很失望，不过辛迪在撩动鲍勃的内疚感方面堪称专家。鲍勃会扪心自问，辛迪为自己牺牲了这么多，他怎么能够抛弃她呢？


    鲍勃开始给辛迪买昂贵的礼物，来抚慰自己的良心，而辛迪十分鼓励这一行为。如果鲍勃在家里接了朋友的电话，他就会感觉到辛迪开始拉下脸，一想到接下来肯定会发生的场景，他就开始胃疼。


    鲍勃感觉，他就像在和两个辛迪一起生活：一个是六个月前与他坠入爱河，自信又能给予他帮助的辛迪，另一个则是利用情绪化手段，强迫他顺从的辛迪。更大的问题是，他不喜歡，也看不起被第二个辛迪引出的“现在的”自己。


    在辛迪搬过来与他同住的六个月后，鲍勃找到我。鲍勃的医生曾委婉地指出鲍勃的胃痛可能是由于他生活中的“两位”女性，建议他来向我咨询。


    # 第二幕：母亲家的晚餐


    吉姆和萨莉最开始来找我，是要进行情侣共疗。他们交往了很久，想在结婚前再确认一下两人之间的关系还有哪些小问题。那次治疗很成功，婚礼也如期举行。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '一年多之后，我在预约名单上再度看到他们俩的名字时，很是惊讶。这一次，他们要咨询的是家庭问题。


    萨莉来自一个小家庭。家庭成员只有父母和一个姐妹，苏西。苏西已经结婚了，并且有两个年幼的孩子。


    吉姆的家庭则要大多了。除了父母，还有四个兄弟姐妹——两个兄弟和两个姐妹。吉姆的兄弟姐妹都已经结婚了，并且有很多孩子。


    新问题出现在萨莉的母亲玛莎身上。玛莎一直将周五晚上视为家庭晚餐时间，也就是说苏西夫妇与他们的两个孩子，还有萨莉，都要出席。萨莉与吉姆结婚时，玛莎就希望萨莉和吉姆也能在每周五晚上来吃晚餐。母亲已垂垂老矣，萨莉于是依从了母亲的要求。


    然而，与玛莎共进了几个月的周五家庭晚餐之后，吉姆表示希望某几个周五能和他自己的家庭一起度过。萨莉觉得吉姆的要求很合理，因此她告诉母亲下一个周五晚上她和吉姆不会去吃晚餐了。但她的母亲没法接受这个消息。


    她质问萨莉怎么能打破周五晚上家庭聚餐的传统。萨莉解释，吉姆也有和自己的家庭共度时光的权利。但是她立刻就感受到了让母亲失望的那种熟悉的内疚感。玛莎轻声啜泣着说，如果萨莉和吉姆打破这个传统，周五晚上去其他地方，父亲和苏西会伤心。“我们是一个小家庭，如果你不来的话，我们会觉得很孤独。你的姐妹也没机会再看'
  merge: -1
  img_proc: true
- pgno: 33
  md: '到你了，你知道你们的关系有多好，她和她的孩子有多期待在每周能见到你。”


    满内心疚的萨莉说，下一周与吉姆的父母共度周五的计划已经确定了，没办法再改。她真挚地道歉，请求母亲能够原谅她这一次。然而，在那长长的一周，萨莉受到了母亲的冷待。每一天的母女通话没有了。萨莉给母亲打电话也只能被转接到答录机上。尽管她留言了，但从没有接到回复电话。当萨莉最终给母亲打通电话时，她只能得到简短、单音节的回答。萨莉感觉到了冻死人的寒意。


    周五早上，在内疚感的重负之下，萨莉屈服了。她恳求吉姆取消与他父母的碰面，去她母亲那里吃晚餐。她害怕如果不这样的话，她的母亲就再也不和她说话了。萨莉说：“我真的受不了这样的沉默。”吉姆同意了，因为他不能看着萨莉身处如此巨大的烦恼中。但他对于玛莎的不满加深了。


    萨莉和吉姆重新开始每周五去玛莎家里吃晚饭。然而，吉姆日渐不满他的岳母对自己以及萨莉的操纵。他每周五去吃晚饭的时候脸色很阴沉，并且拒绝参与任何对话。


    对于萨莉而言，事情变得更糟了。她感觉到了母亲和丈夫在同时操纵她。为此她进退维谷，一边是吉姆的愠怒、惩罚性行为，一边是母亲极富技巧的内疚感诱导。


    萨莉甚至想过让玛莎也邀请吉姆一家来加入周五晚餐。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '玛莎说她很愿意，但是“他们家人太多了，而我们家只有一张小小的餐桌”。萨莉主动提出在某些周五晚上由她自己下厨，邀请双方的家庭。但玛莎立刻就拒绝了这个提议，因为“这种感觉就是不一样”。除此之外，她并不想“打破传统”。


    与此同时，吉姆也开始承受来自他家庭的怒火。尽管没有玛莎那么根深蒂固的周五晚聚餐传统，但他们也喜欢周五聚在一起，享受一顿轻松的晚餐，开心开心。更糟的是，他的一些家庭成员开始觉得也许是萨莉不喜欢他们，所以妨碍吉姆与他的家人见面。


    玛莎的操纵之钩在萨莉身上埋藏得很深。内疚感以及和吉姆之间的矛盾，让这段新婚关系十分紧张纠结。当萨莉宣布她怀孕时，玛莎将她的控制行为上升到了新的水平。无论萨莉和吉姆说他们想要做什么，玛莎似乎都会凌驾于他们的意愿之上，操纵萨莉，满足她自己的要求，而这往往是以牺牲吉姆和（或）萨莉的个人想法为代价。


    焦躁的吉姆和怀孕的萨莉就是在这时走进了我的办公室。


    # 第三幕：地位，地位，地位


    弗朗辛来找我，我们聊了五分钟，我就已经知道了后'
  merge: -1
  img_proc: true
- pgno: 35
  md: '续的情节。她的故事，或者说，她这个类型的故事，对我来说十分熟悉。


    弗朗辛是一名很有魅力的26岁女性，她在一家优秀的企业做商业地产经纪人，她在这家公司工作的第二年，一位名叫阿尼的资深经纪人接近她，邀请她共进午餐。阿尼是公司里的业务精英之一，而阿尼居然知道自己名字，这让弗朗辛受宠若惊。更让她激动的是，阿尼是带着商业提议来的，并且对她来说，这个提议堪称奢侈。


    两名经纪人一起工作形成合作关系，这在经纪人事务所非常常见。一名经验丰富的经纪人将一名年轻的后辈纳入自己的羽翼之下，指导她工作上的窍门，也是十分常见的事。但是，这样一位顶级的经纪人会主动提议来指导她，还是让弗朗辛很惊讶。


    阿尼的提议是有理由的。他解释，他的妻子现在怀上了第二个孩子。他与妻子刚结婚的时候，一直忙于工作，常常周末加班，想要建立自己的事业。而就在追求经济安全的同时，却错过了儿子的成长时光。他很后悔错过了那些足球赛、小联赛、音乐演奏会和学校表演。


    如今，他将要有第二个孩子，他想要缩减自己繁重的工作，花更多时间陪伴妻子与家庭。实际上，如果可能的话，他再也不想周末或深夜加班了。阿尼给弗朗辛的合作提议很简单，也很常见。考察期为六个月，然后他们会'
  merge: -1
  img_proc: true
- pgno: 36
  md: '将这段合作关系以书面形式敲定。阿尼会让弗朗辛参与到自己的每一笔交易中来，以此为交换，外出调研、研究、深夜与周末的加班工作则主要由弗朗辛来做。她会学到很多东西，并且最终（阿尼从没明确说过是何时）获得更多报酬。


