- pgno: 2
  md: '# 带薪养生的7个黄金法则：


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_2_0.png)


    # No.2 每1小时远望5分钟


    用眼时间太长会造成近视、视力模糊、眼干等多种问题。建议大家每1小时远望5分钟，或者每20分钟远望20秒，最好每天能做一次眼保健操，也可以把掌心搓热，放在眼睛上面，反复做5-10次。


    在这里推荐给大家一个应用软件：“放松双眼”。它会根据20-20-20法则：每用眼20分钟就应该看20英尺（6米）以外的东西20秒；通过发送手机通知的方式提醒大家该休息休息眼睛啦。


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_2_1.png)


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_2_2.png)'
