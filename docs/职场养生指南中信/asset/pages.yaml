- pgno: 8
  md: '# 五脏养生——心


    +   ■ 食养：西红柿、山楂、苹果、莲子、红枣


    +   ■ 穴位——内关穴：宁心安神，调补阴阳气血，疏通经脉


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_8_0.png)


    宜：放松心情，休息充足


    ■ 心主血脉，是身体的发动机。只有心脏健康，才能使机体发挥正常的生理功能。


    +   ■ 抗议信号：

    1、舌头溃疡

    2、额头长痘

    3、失眠，心悸，焦虑

    4、胸闷或刺痛'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# 五脏养生——脾


    ■ 食养: 山药、芡实、燕麦、胡萝卜、黄豆


    ■ 穴位——三阴交:健脾化湿，疏肝益肾


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_9_0.png)


    ■ 宜: 饮食清淡，多做运动


    ■ 脾主运化，是人体的免疫器官，本身的疾病较少见，一旦出现问题，人体整体健康都会亮起红灯，所以平时不能忽略保养脾脏。


    ■ 抗议信号:


    +   1. 思虑重，睡眠差


    +   2. 脂肪堆积


    +   3. 口气明显，唇周长痘或溃疡'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 五脏养生——肺


    +   ■  食养：薏仁米、茯苓、高粱米、梨、百合


    +   ■  穴位——太渊穴：调和营血，促进气血运行


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_10_0.png)


    +   ■  宜：少吸烟，多喝水


    +   ■  肺主气脉，在所有器官中，肺的自我保护能力最差，可以说是最容易受到伤害的一个器官。


    +   ■  抗议信号


    +   1. 肤色晦暗，面容憔悴


    +   2. 干咳，便秘


    +   3. 多愁善感，容易悲伤


    +   4. 气短胸闷'
