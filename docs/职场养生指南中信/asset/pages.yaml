- pgno: 11
  md: '# 五脏养生——肝


    ■ 食养：荞麦、核桃、决明子、青笋、菠菜


    ■ 穴位——太冲穴：缓解情绪，疏通郁结


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_11_0.png)


    ■ 宜：少熬夜，少喝酒


    ■ 肝主疏泄，参与人体内部调节，是负责排毒功能的。人们常说“养颜先养肝”，有一副好肝，才会有好皮肤。


    ■ 抗议信号


    +   1. 指甲表面有竖纹

    2. 易怒，有色斑

    3. 眼睛干涩，偏头痛，脸颊冒痘'
