- pgno: 4
  md: '# 带薪养生的7个黄金法则：


    # No.4 保证睡眠时间，提高睡眠质量


    尽量提高白天的工作效率，在非密集工作执行期的时候努力保证每天7-7.5小时的睡眠时间。大脑在睡眠状态中耗氧量大大减少，因此睡眠有利于脑细胞储存能量、恢复精力，从而提高脑力效率。俗话说“养生睡觉第一功，精气神足百事通”，很多健康问题，在我们戒掉报复性熬夜的时候，说不定就迎刃而解了。


    睡觉也是补肾最好方法，肾藏精，精神、精彩、精进，都得靠精。肾是千里马，精是能量源。


    睡眠时，身体会自动调节成腹式呼吸，正是肾在纳气生精。睡眠深，纳气多，精力自然充沛。倒头就睡、深度睡眠，是最好的补肾法。


    另外，凡是养肾的方法，如搓脚心、揉涌泉穴、泡脚，都对睡眠有益。


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_4_0.png)'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 带薪养生的7个黄金法则：


    # No.5 每半小时揉揉手腕、甩甩手指


    长时间敲键盘、点鼠标可能会得“鼠标手”、“键盘腕”等，手指手腕等部位可能会疼痛。工作的时候，每半小时揉揉手腕、甩甩手指，休息几分钟，就能起到很好的预防效果。所以也建议大家没半、一个小时站起身来，一边去洗手间/打水，一边甩甩手腕，一边看看远处。


    3招改善腱鞘炎：

    -握拳运动：轻轻握起拳头，然后张开，将手指伸直即为一组，平时闲下来就可以做几次。

    -使用护具：鼠标护腕、人体工学鼠标都能让手部得到保护和放松。

    -放松肌肉：严重的时候，热敷是很有效的方法。每天温热水泡手，或是热水袋热敷手掌手指，每天2次，每次30-45分钟。


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_5_0.png)'
  merge: -1
