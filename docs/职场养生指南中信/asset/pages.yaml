- pgno: 7
  md: '# No.7 内调养生


    当我们长期处于一个不规律的生活状态中时，身体会释放抗议的信号，五脏六腑就像我们身体中的滤水芯，帮我们过滤这些干扰健康的信号。但随着身体的抗议越来越强烈，五脏六腑也会劳累过度，身体健康就出现了问题。


    所以当我们收到身体的“抗议信号”时，说明五脏已经很虚弱了。想要身体健康，得先让五脏的状态恢复正常。就像滤水芯需要清洗一样，我们的五脏也需要“清洗”。


    《黄帝内经》中道：“以五色命脏，青为肝，赤为心，白为肺，黄为脾，黑为肾。”；“毒药攻邪，五谷为养，五果为助，五畜为益，五菜为充，气味合而服之，以补精益气。”'
