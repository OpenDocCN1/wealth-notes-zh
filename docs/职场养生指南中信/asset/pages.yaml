  md: '# 带薪养生的7个黄金法则：


    # No.3 注意膳食平衡


    上班族更应该注意膳食平衡、规律用餐。点餐时应保证食物的丰富多样。多吃谷类、蔬果、肉类、豆类和奶类。少吃煎炸菜品，多吃蒸煮菜品。


    ![](img/afde719f9a4fe89eeca2413d6fa7cc59_3_0.png)


    好吃又健康的食谱：


