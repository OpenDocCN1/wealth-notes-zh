  md: '# 带薪养生的7个黄金法则:


    # No.6 摆放绿植或装饰品


    摆放绿植,不但能调节视线,缓解眼睛及身体的疲劳,还能调节心情,释放工作的压力。另外,绿植也可以吸收空气中的二氧化碳,释放氧气,改善空气质量,减少上班族因在办公室吹空调常见的感冒发烧等空调病。


