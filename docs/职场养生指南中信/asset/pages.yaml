- pgno: 12
  md: '# ### 五脏养生——肾


    +   ■ 食养：黑芝麻、黑桑葚、黑米、黑豆、枸杞


    ■ 穴位——关元穴：大补阴阳，温肾，散寒


    ■ 宜：少熬夜，多喝水


    +   ■ 肾主藏精，主要功能是排泄和内分泌。一旦肾功能出现问题，会导致排水不畅，毒素出不来。


    ■ 抗议信号

    1. 水肿，腰酸

    2. 下颌长痘，黑眼圈

    3. 容易疲倦，记忆差


