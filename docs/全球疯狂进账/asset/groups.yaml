    真正能创造奇迹的人，即便在濒倒时也非常注意衣着、谈吐，出门前会对着镜子端详，目的就是在脑海中确认自己的尊贵与成功，要相信自己本来就是富贵之人，当你活出这份富贵之气时，外在的财富就显化了！如果一时半会儿没有这种气质怎么办？那就去扮演有钱人，演久了就会有这份贵气！


