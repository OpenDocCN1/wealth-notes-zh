    ## 1、种福报的种子！


    财富是福报的显现，功夫在诗外，当局者迷旁观者清，人往往因各种因素无法看清自己的问题症结所在，更谈不上拿出解决问题的方案与方法，但在解决相同或类似的人的问题时，就会因为我们的客观、理智找到走出迷宫的出路！正所谓观自在，何谓观，就是跳出自己，以第三人称来着自己，只有观才会从各种各样的情绪中走出来，才能真正地看到问题所在，才能获得解决问题的智慧与方法，才能获得自在！这是根本的做法！比如


    在处理债务，盘活资产时，当事人对已经营的企业、所住的房都倾注了很多的情感，比如是自己和爱人的第一套房，花了很多心血的设计与日日夜夜精雕细琢的成果，别说卖，连出租都不肯，导致资产闲置，而且为此资产每个月的按揭还要不断偿还……而这些情感往往障碍他们处理、盘活这些资产的勇气与速度，导致明明可以早点盘活的资产错过一个又一个的时机，到了最后不得不忍痛低价出手。因此，在课堂里海洋教练在做解决债务个案时，采取的做法就是找几个相同或类似的人让他们组队，彼此帮对方解决问题！最终也因解决别人的问题找到解决自己问题的方案与方法，当年海洋教练面临人生挫折与低谷时，去福国寺发露忏悔，被告知要去种财富的种子，帮别人解决债务之苦，因此全国各地去做此事，结果就是当不断帮助别人解决问题时，自己也成为这个领域的高手，最终也顺利地化解了自己的债务危机！


    ![](img/aaee69e438e31531c7ebcfea62770bd6_82_0.png)


    ## 2、原则：处理债务先止血，高息变低息，低息变信用。


    处理负债需要的是时间，不是钱。这就是说先停掉让债务进一步扩大的业务或贷款，再去融低息的资金去替换掉高息的贷款，最后用几乎不用还的信用去替换低息的贷款，从而使自己走出负债的迷局！同时债务危机之所以会压垮人，是因为时间紧迫所致，因此可以在时间这个方面下功夫，拉长还贷的时间，从而赢得解决的机会，最终翻盘！


    比如在处理负债个案中，如果是一直负债的企业或夕阳产业的项目，海洋教练会建议案主结束经营，先立马止血，停止再向项目中注资以免债务进一步扩大，同时通过股权融资、股份融资、合伙人融资、存兑融资、信用融资、发行购物卡、发行股权卡…..等方法去融低息、无息的款项去替代原来高息借款，从而打破僵局！


    在面对高额还贷压力时，有个思路是必须明确的，就是利息与还款时间是可以谈判的！在常人的思维里，与银行等金融机构的利率是不能更改的，一旦签约就要执行下去，是的，这是普遍的情况，但如果压力过大，导致最终破产的话，是两败俱伤，因此负债者是可以去找这些金融机构去谈判，以降低还贷压力度过难关，通常谈判是会有成效的，因为这些金融机构目的在于盈利，他们不愿看到企业、个人破产导致他们的损失，他们宁可赚少，也还要赚！


    置于死地而后生，生与死是相对的，也是可以相互转化的！


    比如有个个案让案主破产、破信用，在宣布这个方案前，可召集所有债权人宣布这个最终的结局就是置于死地，虽然各债权人与案主之间存在着千丝万缕、错综复杂的利益关系，但是所有人之间有着共同的利益——让案主存活下去，并且恢复造血功能，最终偿还债务，皆大欢喜！这是关键所在，正是这个共同利益的存在，案主具备了生存、翻盘的希望所在！让各方债权人互相交流、共同面对、群策群力，让各种债权关系相互交融、取舍，这样就把原来的敌人化为盟友，在死地里求取生存！债权人、债务人既有利益的对立，也有共同的利益，因此看清这点，对于债务人翻转债务会多条解决问题的道路！


    ![](img/aaee69e438e31531c7ebcfea62770bd6_85_0.png)


    ## 3、具有离开问题的能力。


    道法自然，你看自然界的河流都不是笔直向前的，而是蜿蜒曲折奔向大海的，这是因为河流在前进中，会遇到各种各样的障碍，有些障碍是无法逾越的，所以它只有绕道而行，也正因为走弯路，让它避开了一道道障碍，最终抵达了遥远、浩瀚的大海！面对债务问题同样如此，我们可以不与之硬碰硬地对抗、拉扯，我们可以开辟新的疆域，可以带着问题前行，在发展中解决问题，让进账成为我们的关注点，让进账成为我们的主旋律！就像我们每个人身上都有癌细胞，但只要我们正常细胞活跃并且免疫力正常的话，癌细胞是无法演变为癌症！负债就是癌细胞，只要保持不断的进账，就相当于维持正常的免疫力，那么负债就无法演变成债务危机！


    ![](img/aaee69e438e31531c7ebcfea62770bd6_86_0.png)


    负负债的死穴就是负债务感，负债务感体现为恐惧、焦虑、愧疚、自责、无力、绝望…… 负债人因欠债往往被追债、恐吓、辱骂，又或者因担心还不上债导致自己失信于人、社会形象受损，活在无尽的痛苦中，陷于无边的负面情绪中。人在遭受攻击（无论是外在还是内在的攻击）无论身体还是心理都处在紧绷、防御、封闭的自我保护状态，这种封闭的状态会隔绝外来新的机会与信息，从而造成恶性循环：负债——负债务感——封闭——没出路——负债加深……
    在负债务感里是无法看到机会与出路的，而且会越陷越深！负债会越滚越大，在课堂里常常看到有的学员从最初几十万的负债最后滚到几百万的负债，在负债务感的驱使下，整个人处于崩溃的状态，除了机械式的拆东墙补西墙，或者饮鸠解渴式地不断挖新坑填旧坑让自己泥足深陷外，别无出路！负债感就像一片树叶尽管不大，却能在负债者眼前遮住宽广的世界！让负债人在债务危机的道路上一路狂奔直至家破人亡，在课程里看到了很多这样的悲剧，有的学员甚至因负债曾经自杀三次、人未死家已破！幸运的是他们有缘来到课堂，由此重获新生！是什么样的法宝让这些学员逃出生天、从负债的泥潭里挣脱而出的呢？是用进账感取代负债感！这是海洋教练借鉴灵修的方法，并将之发扬光大的解决债务危机的重要心法！


    ![](img/aaee69e438e31531c7ebcfea62770bd6_87_0.png)


    写进账感就是记录每时每刻的进账（在附录中有写进账感的范例供大家参考），记录每个当下的进账带来的高涨情绪，这些情绪包括喜悦、希望、兴奋……当我们处在这种状态时，身体、心理会呈现出开放、舒展的状态，这种状态能更好地吸收新的信息、把握新的机遇，随之而来的所有问题会迎刃而解！


    这不是心灵鸡汤，而基于人脑的构造进行的调整，人的很多行为习惯、反应模式都是大脑神经元的一种联系，就如世界本无路，走多了就有路，负债务感只是原来的老路，这条路充满荆棘与陷阱，让我们不断在原地打转迷失方向；要走出困局，我们要用进账感来替代，即


    不断持续关注生命中、生活中喜悦、进账的一面，强化这种大脑神经元新的神经回路，久而久之新的反应模式与行为习惯就会调整过来，就如我们开辟了条新路，一开始还不是很开阔、很成形，但走多了、走久了，新路就越走越开阔，而原来的老路因长期不走就会荒掉！此时，我们就脱胎换骨了，尽管还是那副皮囊！


    能量不同——境界不同——格局不同——方法不同；站得高才能看得远，打个比方通常来说，五楼的人看到的东西，二十楼的人也能看到，而且看得更加的全面和完整，而五楼的人怎么也看不到的风景，二十楼的人往往可以轻而易举的看得真切，五楼的人看到一条小河，被一座大山挡住，到了尽头，于是一声悲叹，谁料二十楼的人的视线足以超过五楼看到山的那边，他欣喜地发现那条小河，没被大山阻隔，而是绕过了大山，继续绵延流淌，流向远方，于是当五楼的人在为小河的命运而悲叹时，二十楼的人却充满希望与乐观。


    ![](img/aaee69e438e31531c7ebcfea62770bd6_90_0.png)


    同理，有时觉得一件事，无论如何都做不下去，因为那困难貌似灭顶之灾，就像阴沉的大山，死死地挡住小河的去路，无法克服，难以翻越，但是那些能量高的人却可以从容应对，举重若轻，这倒不是因为他们有更强的，更大的能力，而是因为，他站真的比我们更高，看到的也自然比我们更远、更全。


    对待债务问题就是如此！海洋教练是站在更高维度去看待债务与财富的关系，因此能举重若轻！比如课堂里有位负债1亿2千万的一位山西煤老板，有85套房产，一个运输队，有一座矿山，但近年来国家能源政策的调整，矿山不盈利，房产也很难脱手，为了还贷，借了小贷公司及其他高利贷，在高息下举步维艰，海洋教练在看完她整个资产表后，指出必须盘活资产，盘活那85套房，采用送房借钱的方式盘活资产，同时多管齐下，用传兑汇票、信用的方式结算，很快就帮助到这位煤老板就走出债务困境，还包括很多做法，比如：


    变出入。债的产生源于入不敷出，解决之道在于开源节流。具体方法有：


    - （1）优化不升值的。

    - （2）优化赶不上成本的。

    - （3）优化没盈利的。

    - （4）把负数的转换正收入。


    其具体操作要来到课堂才能传授。


    关于翻转债务，海洋教练还有他的绝活——《债务翻转宝典》，这个宝典会提供更多方案、方法、思路。如果能来到课堂的，海洋教练都会出针对性的解决方案。很多负债人是哭着来到课堂的，但最后都会笑着离开。当人具备勇气与信心时，面对同样的困难却能升起无穷的智慧与方法，正是这些变化创造着一个个奇迹！


    ![](img/aaee69e438e31531c7ebcfea62770bd6_92_0.png)


    当人在债务坑里迷路时，做什么事都不对，做什么事都不顺，做什么判断都是错的，所有的钱都会出问题。在这个时候，只有来到我们平台，来到我们的课堂，才能解决这些问题。在目前中国没有任何一个人敢处理负债问题，敢开负债班，只有我们能做到，市面上的灵性课程，只是在感觉上处理，根本没有在实在的问题上处理，如果你的负债没有从钱上、从数据上去解决，你永远解决不了，感觉是永远解决不了负债问题的！你再交几百万的学费都是没用的，来我们的平台只需要交不多的服务费，就能搞定！找对专业的人非常的重要，负债的人就看你有没有缘分，有没有福报来到我们的课堂。没福报的，可能十年、二十年，甚至一辈子都没碰上高人指点他，现在只有我能做到！钱很重要，但比钱更重要的是时间，因为这意味着时机、意味着生命！


    ![](img/aaee69e438e31531c7ebcfea62770bd6_93_0.png)


    在债务翻转的个案中，有种极为特殊的做法，就是破产、破信用。有些人不解，来到课程不就是翻转债务吗？为何却是这个结局？这种不解源于我们不能设身处地、感同身受地去理解这些特殊的案主，这些案主其实已积重难返、回天乏术，在这种情况下已苦苦支撑很长时间，犹如重病卧床，在急症监护室里身体插满各种管和仪器的病人，这时对他们最大的慈悲是让他们安然离世，而不是再强行救治！这些特殊的案主面对巨额负债，身体、精神几近崩溃，无论是自己还是家人都深受其苦，此时的破产是让他们凤凰涅槃！这些会案主虽然会失去外在的财富与名声，但在精神上获得一次解脱与重生！因为他拥有了宝贵的经验、教训，更拥有一份淡定与智慧，在这种情况下，假以时日这些案主一定会东山再起！就如二战后重新站起的德国、日本，虽然这些国家在战争中被炸成一片废墟，但那些经验、技术、精神还在，而且接受了教训，再重新发展的过程中会更有力量！美国现任总统特朗普就是一个例子，他破产四次，最终柳暗花明，对此他说过一句话：“很多朋友破产了，再也没见过他们，跑路了。但幸运的是，我没有选择他们的路，我一生中走错了不少路，看错不少人，承受了许多的背叛，我落魄得狼狈不堪，但都无所谓，只要我还活着，坚持下去，总会有希望，余生很长，何必慌张。”


    ![](img/aaee69e438e31531c7ebcfea62770bd6_95_0.png)


    这些特殊的个案让人们对什么是勇气有了更深的理解：勇气不是好勇斗狠、不是强撑硬顶、不是有泪不轻弹；勇气是敢于面对自己，哪怕是面对黑暗、丑陋的自己，敢于承担应负的责任，敢于认识自己的脆弱与无助，一旦这样开始时，心底反而踏实，因为生命拥有一份臣服与柔韧！


    感恩这些案主，是你们像镜子一样呈现出我们未知的自己，是你们提醒我生命的需要珍惜与反思！感恩！

    '
