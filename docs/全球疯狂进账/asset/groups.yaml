    ## 四、关于聚焦


    ## 成功从目标开始


    成功是行为，行为源于思维，思维决定命运 有一个目标，就有一切


    ![](img/aaee69e438e31531c7ebcfea62770bd6_57_0.png)


    金融当中有个词叫杠杆，而杠杆原理是古希腊科学家阿基米德发现的，他有一句流传千古的名言：“假如给我一个支点，我就能撼动地球！”传说雅典被罗马攻陷之日，有两个士兵闯入阿基米德的房间，看见他还在桌前整理几何手稿，拔剑便刺，他的最后一句话是：等等，让我算完这个算式。直至生命的最后一刻，这位伟大的发明家、哲学家一直还在聚焦他的目标：揭示宇宙运行的真理，这一如他的另一个发明——让近千名如女用镜


    子聚焦一点，点燃敌人的风帆，这恐怕是最早的光学武器了。


    聚焦就是专注的意思，当我们专注做某事的时候，其结果是完全不同的，比如在生活中，你会碰到这样那样的問題，当你聚焦在你的问题时，你的时间与精力都耗在问题上，此时你是无法看到生活里充满着奇迹与转机的一面，也无法让各种各样的机会进入你的世界，就像一片叶子遮住了你的双眼，让你无法看到美丽的景色，尽管那片叶子只有巴掌那么大。这让我想起一句话：当你错过太阳时你流泪，你将错过月亮，当你错过月亮的时候流泪，你也会错过星星，这啥意思？就是当你专注在你的问题时，你不但不能够从问题当中抽身出来，反而会错过各种各样摆脱困境的机会。


    在第四期海洋富足人生面授课当中，我就看到这样的一个案例，有位老板，他看上去满面愁容，从上课开始，一直到第二天做个案之前，都一筹莫展，下课也急着找打电话，基本上看不到一丝的笑容，直到做个案的时候，我们才发现，原来他负债300万，当他将整个人资产状况，列明出来之后，海洋教练就针对这样的一个资产负债状


    况，进行了个案的处理：盘活资产、放大信用、股权融资、融低息的款……给出了很多处理债务的方法和技巧，最后还给出解决债务问题时的心态。


    ![](img/aaee69e438e31531c7ebcfea62770bd6_59_0.png)


    在解决债务问题的时候，如果你的关注点仅仅是在债务时，你整个人都处于抓取的状态，担心债务会把你吞没，你会像抓救命稻草一样的，把身边的各种各样的机会都抓个遍，但是在这种状态下，你的每一个决定都将是错的，即便是同样的一个项目，别人能赚到钱，但你却赚不到钱，别人在危机来临之前都抽身而出大赚一笔，但你却因为迟迟不能够收手，或者是把握住机会，在债务的泥潭里越陷越深。


