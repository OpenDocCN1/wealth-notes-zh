    课程中有个学员想买一座豪宅作为自住，以方便工作和孩子未来的就学，但首付压力巨大，此时海洋教练再三追问（他的追问很有力度，有时甚至会让人难堪，毕竟面对真实的动机，人们有时是羞于启齿或自己也模糊不清，这种紧逼式追问能让你真正看到问题所在），一一打破该学员固有的思维框架，比如方便工作，难道一辈子就在附近的公司上班？再比如自住，花与首付相比如少的租金就可租到同样房子，为什么要执着于房产证上写谁的名字？孩子就学，难道只有按学区入学这一条道路？更何况今后这孩子万一像比尔盖茨、马克.扎格伯格一样中途辍学创业而成为首富，再不然就像海洋教练那样，初中没读完，就开始了自己商业道路的探索，


    现在身家过亿……人总是被自己的观念、视角所束缚，面对这些种种可能性，为什么不把资金集中去买升值快、回报多的工具呢？我们的目的是增加财富，买房只是目标而已。


