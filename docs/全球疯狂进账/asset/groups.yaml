    难得的微笑！在海洋富足人生面授课当中，我就看到了大量的奇迹：有没钱的小白通过挖掘信用、扩大信用，然后财产都在相当大的丰盛；还看到了负债的人，因为拿到了解决方案，看到了希望而整个人面貌焕然一新！


