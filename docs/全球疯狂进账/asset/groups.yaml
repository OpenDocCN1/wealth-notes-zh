    一朵花，当你拿去送给爱人的时候，它代表的是那份爱恋、爱慕之情；如果这朵花是在小狗的嘴里呢，那可能是一个玩具；如果把这花买来插在家里，它是一个装饰物；如果做玫瑰精油的话，它是原材料；但如果这朵花，就是长在野外，没有任何人看见过它，请问它是什么？它可以是一切，也可以一切都不是，花所代表的意义是你赋予给它的，花如此，财富金钱也一样，也是你给它赋予的意义，财富不是你想象的那么实实在在、牢不可破的一个东西，它是空性的！


    空性并不是说这个世界不存在，或一切都是虚无的，空性的意思是：世界与你认识的并不相同，没有任何事物是你所认为的那个样子，你一直都在误解这个世界。


