  md: '# 问答：红皮鸡蛋更有营养？


    最近家里长辈总是买红心的鸡蛋，学校食堂的鸡蛋的蛋黄是淡黄色 的，长辈买的蛋黄偏橘黄色。问之，曰：“这种是农村鸡下的蛋，是吃五谷杂粮和虫子长起来的，可有营养喽！”
    吾不信，怕只是得了输卵管炎的鸡，营养没啥区别，所以，来找卓老师求证。谢谢。


    卓克


    这位同学说的没错，认为红皮鸡蛋和橘色蛋黄鸡再有营养是一个大误解。


    红皮鸡蛋更有营养？


    听众·李雨桐·说，家里长辈偏爱红皮鸡蛋。还说鸡蛋好坏的判断有一个依据，就是蛋黄颜色的深浅程度，如果很浅就是没营养的鸡蛋。比如农村鸡下的蛋比超市里买的更黄，原囚是农村的鸡吃的五谷杂粮和虫子，更有营养。


    +   • 李雨桐·不相信，想求证一下。


    其实认为红皮鸡蛋更有营养，是一个由来已久的误解。


    首先，蛋壳的颜色是由一种叫做卟啉的物质形成的。


    卟啉是鸟类体内血红蛋白代谢的产物，不过有些品种的鸟在体内不产生卟啉，所以它们下的蛋不是红色、褐色的。如果鸟的子宫分泌胆绿素，那下出来的蛋就是绿色的，比如像鸭蛋很多就是绿色；如果什么色素都没有，就是白皮的鸡蛋。


    具体下出什么颜色的蛋完全是基因决定的，而且这些不同颜色的蛋的成分差异只体现在蛋壳上，即便是那种深褐色的蛋，你煮熟了以后剥开，鸡蛋也是白白的，没有一丝一毫红发褐的递迹。


    卟啉或者胆绿素这些东西不是人体必需的，有一种罕见病就是人体无法分解卟啉，结果在体内积累过多还会产生卟啉病。


    通过蛋的颜色来评价鸡蛋营养价值的高低是没有根据的，就像通过头发颜色判断一个人的财富状况一样不靠谱。但是人权有人维护，鸡权就没有那么受人尊重了，很多商家发现了消费者的这种喜好，就只培育下红皮蛋的鸡。这也是一种盲从和歧视吧。


    另外一个误区就是蛋黄越黄越有营养。


    鸡蛋白之所以黄是因为这里有叶黄素，叶黄素在鸡的体内是没法自行合成的，只能从日常食物里得到。大多数植物都有叶黄素，它属于胡萝卜素的一种。


