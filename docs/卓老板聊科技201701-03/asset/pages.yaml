    # 免疫力过分的强会怎样？


    1.免疫工作的强度突然提高的后果就是B细胞开始胡乱释放抗体，杀手T细胞开始胡乱杀死正常体细胞。


    2.红斑狼疮就是一种非常凶险的免疫力过分提高后的疾病，这种病人最初可能是在皮肤上有些创伤，之后会在大部分内脏中都出现免疫系统攻击正常细胞的情况，肾、心脏、肝、脑、肺都会逐渐受损，直到衰竭。


    3.重症肌无力也是免疫系统攻击肌肉细胞上的神经，最终让肌肉无法收缩的疾病。风湿性关节炎，就是免疫系统攻击关节部位的结缔组织，造成类似发炎一样的现象。I型糖尿病也是免疫系统攻击胰岛细胞造成的。


    —— 7 ——


    # 过敏是怎么回事？


    1.哮喘和荨麻疹有一个共同的病因：不明物质刺激了肥大细胞，释放了组织胺，导致血管壁通透性增加，组织液外溢，皮肤、粘膜隆起，隆起发生在气管上就是哮喘，隆起发生在皮肤上就是严重的瘙痒，鼻粘膜隆起就是过敏性鼻炎。如果发生在脑部血管，就是组织液外溢刺激到硬脑膜上的神经造成偏头疼。一些过敏体质的人容易头疼就是这个道理。


    2.吃抗组胺药物可以抑制过敏。药物的原理就是通过人为方式设计一种分子，它和组织胺长得很像，会先和粘膜上的H1受体结合，结合后却不发生过敏反应，点位被占据后就不会再和真正的组胺结合了，过敏的过程就被抵制住了。


    3.组织胺是细胞间化学信号的传递物质，所以最初的抗组胺药穿过血脑屏障后也会抑制脑神经的信号传递，最终造成嗜睡的副作用，不过后来的药物已经添加了带电成分，不会再通过血脑屏障了。


    4.开瑞坦是先灵葆雅这家美国药企做出来的，效果很好，但专利保护期已过了，仿制药的杂效很多不如原研药，尤其在药物溶出特性上和原研药相差比较远。对开瑞坦的仿制药来说，最好在饭的时候吃，因为测试中发现仿制药只有在胃酸环境下和原研药溶出曲线相似。


