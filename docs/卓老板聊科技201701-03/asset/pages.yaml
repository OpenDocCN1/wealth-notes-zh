  md: '# 问答：全人类DNA的质量只有一粒米那么多？


    卓克，一直很想请教一个问题：人体内的DNA真实重量是多少？比如，稻盛和夫《活法》中《伟大之物向一切事物注入生命》中提到：“人类的一个细胞中，写入了多达30亿个遗传基因的信息。这些信息量换算成书的话，相等于1000本，每本厚达1000页的书。具备如此庞大信息量的基因，就记录在构成人体的60亿个细胞的每一个之中。更令人惊奇的是，记录这些基因信息的DNA全部集合在一起，其重量仅仅相当于一颗米粒。”如果人体的DNA重量真的这么少，我怀疑人体真的需要补充那么多的蛋白质吗？但是，搜索DNA重量，网上各种说法都有，不知道该相信哪个说法？如方便，烦指点，谢谢！


    卓克


    本期问题的答案明显是：否。


    全人类DNA的质量只有一...


    听众·高传法·问了一个有意思的问题，他最近在看稻盛和夫的一本书《活法》。


    有一章说，人类的一个细胞中写入了多达30亿个遗传基因的信息，把它们换算成书的话，相等于1000本，每页厚达1000页的书。


    具备如此庞大信息量的基因，就记录在构成人体的60亿个细胞的每一个之中，更令人惊奇的是，记录这些基因信息的DNA却是那么微小，把地球上60亿人的DNA全部集合在一起，其重量仅仅相当于一颗米粒。


    读到这里咱俩这听众实在忍不住要问一问了，果真人体DNA重量真这么小吗？他带着疑问也搜了搜，在网上各种说法都有，想问问我DNA的质量是多少。


    其实这个问题并不复杂，而且也已经有定论很久了，直接回答呢就是：


    以平均值来说，1个脱氧核糖核酸碱基对的分子量是650道尔顿。道尔顿呢，是氨基酸分子量的单位，因为很小，所以表示像碱基的重量就很合适，几十，几百，几千，这样用起来方便，如果非要核算成公制呢，650道尔顿是1×10^(-24)次方千克。


    这是一个非常小的单位，每个完整的人体遗传物质都包含了大约30亿个碱基对，我们再假设人体中每个细胞都包含一套完整的遗传物质，当然，实际上是有很多例外的，比如生殖细胞中就是一半，还有线粒体中也有少量DNA，但是我们只是算一个大概数量级，这些微扰就先不考虑了。


    那么人体细胞数量是多少呢，·高传法·留言中说是60亿，我也特意查了一下，在他的书中确实是60亿，但可惜的是正确数字是40万亿-60万亿。


    最后算完，一个成年人体内DNA碱基对的全部质量就是194克。


    全世界按他说的60亿人，人类DNA碱基的总质量就海了去了，1百多万吨吧。一粒米大约是0.02克，所以这位日本企业家在感叹的时候至少差了12个数量级。


    但其实还不止，因为我们刚刚算的一直是DNA中的碱基对的重量，DNA全称叫做脱氧核糖核酸，它是由三部分组成的：碱基、糖基、一个或者多个磷酸基团。咱俩刚刚只算了碱基的重量，核糖核酸嘛，糖基也有重量的，磷酸基团也有，而且这两部分才是占质量大头的，这些加一起才叫做DNA的质量。


    当然，这些重量的分类情况也很多，咱俩就不一一计算了，反正大约是错了13个数量级吧。就相当于因为你去年业绩表现特别出色，奖励你中国一年财政税收那么多人民币，结果弄错了，只发了1块钱，这样大的区别。


    我没听说过这本书，看着书名《活法》，以为是一本生命科学的科普书，后来一查才发现是一系列企业管理和个人修养的书。这人的简介查一下，是一个日本著名企业家，哲学家。企业家倒是真的，哲学家嘛，不知道哲学家圈内认不认。


    这套书是2005年出版的，那大约在2005年之前就写出了这句话。人类基因组计划是从1990年开始的，那会不会是后来新进展呢，也不是，实际上人类发现核酸结构是1871年的事儿，知道DNA是遗传物质是1944年的事儿，知道DNA测序方法是1977年的事儿，最起码在1990年基因组计划启动之前就知道工作量是多少了。


    那时就可以通过查阅资料知道DNA的重量。所以数量级上差这么多主要还是没有核实查证造成的。也许作为企业家他经验老道，成绩斐然，但既然出版了，这样明确的和数字相关可以查证的内容还是核对准了再写出来才好。


    我查的时候还发现他引用了很多物理学的研究 đương素材发挥，也要小心核实。这也是我为什么比较喜欢看物理学家或者数学家写社科类内容的原因，因为他们已经训练出，只要有一点拿不准，就不写出来的思维习惯，所以他们写下的东西我们可以放心大胆的看下去。'
