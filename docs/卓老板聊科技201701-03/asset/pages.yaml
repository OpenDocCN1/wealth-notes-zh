  md: '# 问答：杨振宁提出的宇称不守恒定律是什么？


    宇称不守恒，第一次听到这个理论是高中的时候，一直费解到现在，求卓老板解答，哈哈


    # 卓克


    科学界在1956年前一直认为宇称守恒，是杨振宁验证了宇称不守恒定律。

    那这个烧脑的定律究竟怎么回事儿呢？

    今天就给大家伙儿讲讲。


    杨振宁提出的宇称不守恒定...


    上期回复听众听到了杨振宁变成中科院院士，我后来也八卦了一下，看了看“杨溯访谈录”里他和翁帆的采访，我第一感受就是他们的生活真平静安详，我也推荐大家看看，搜下关键词就能找到了。


    那期节目还有更多的问题就是，什么是宇称守恒？


    其实这都是很专业很专业的领域了，涉及很多一辈子都不会遇到概念，但我也试着给大家翻译一下，说的不对也请指正。


    我先从宇称不守恒的前一年说起，在1956年的时候，核物理界主要内容就是让各种粒子撞击，撞完了去找找有没有新的粒子。就在那一年，有粒子新发现了，一个叫theta，一个叫tau。但，凑巧的是，它们长得太像了，自旋数、质量、寿命、带电量，在当时最精确的实验下测完，完全相同。那你说完全相同干嘛还要起俩名字？那就是因为后来发现了一个不同，就是它们经历衰变后的产物不同。衰变大家可以理解成一个粒子的能量很高，很不稳定，很容易变成其他更稳定的粒子，一个衰变后变成2个π介子，一个衰变后变成3个π介子。


    如果它们本就是同一个东西，那衰变后也应该产生一样的东西，现在衰变后的产物不同，所以尽管怎么多方面测完都一样，物理学家们还是给它们各自起了一个名字，一个叫theta，一个叫tau。


    当时物理学家面临两种选择，如果承认它们是两种粒子，那就很难解释为什么在已经非常精确的测量下，它们在所有方面的值都是一样的。第二种选择就是，如果它们是一种粒子，就需要先打破一个物理界的共识，那就是宇称守恒。


    宇称是什么呢，它是用来描述对称性的一个量，比如对单个粒子它只能有两个值+1和-1，如果是一个体系，多个粒子，也有计算方法。像theta和tau，它们发出的π介子都不一样，所以宇称值也一定不一样。


    那到底哪个假设是对的呢？杨振宁和李政道就是支持打破宇称守恒规则的。


