- pgno: 20
  md: '和这个功能类似的还有水牙线，有的叫做冲牙器，就是用一股特别细的水流冲走牙齿缝隙的脏东西，这个清洁单颗牙齿的能力没有牙线强，但是全面清洁的效果更好。


    还有人说，洗牙后觉得牙齿缝隙变大了，这其实是一种典型的误解。有时候牙周病比较严重，牙龈发炎红肿很厉害，牙齿根部也都包裹了厚厚的牙结石，让你感觉牙没有缝隙的原因就是这些发炎，甚至发脓的牙龈，还有牙缝里填充的牙结石。这些东西只能让牙周的状况变得更差，牙槽骨吸收更快。消炎，消肿，清除结石后当然会有缝隙了，但这时才是牙齿真实的情况，也就是说如果有人洗牙后觉得牙缝变大了，实际上那才是牙的真实状态。


    有这种感觉也算是個提示，就是这些人的牙齿状况已经不太好了，并不是洗牙造成的，洗牙只是把真实情况暴露出来了。如果牙周病比较重的时候洗牙就不光是清洁牙龈上的结石了，还会清理牙龈下侧的结石，用一种刮刀探入牙龈袋内，健康人的牙龈袋深度只有2mm，但是牙周炎患者的可能有7-8mm，甚至1cm，刮刀在下面刮掉一些牙菌斑和结石。这种治疗还会出一些血。为了避免后续感染，医生还会围着牙龈给病人上一圈抗菌的药，比如像派力奥。


    普通的洗牙，医生有时也会建议你做一下抛光，就是用类似牙膏一样的东西，用抛光头把牙齿打磨光滑。这并不是变相多收费，其实一次完整的洗牙应该包括抛光，因为牙菌斑、牙结石之所以能附着在牙齿上，就是因为牙齿的坑点多，凹槽多，适合附着。洗牙把结石和牙菌斑去掉了，但这里的物理光滑程度依然没有改善，洗完后不过了几天细菌还是从这些地方开始附着，反反复复。


    抛光是把牙齿上不平整的地方都磨掉，这样能让洗牙的效果维持更久。抛光的轻柔有点像给车漆上光打蜡，抛光头都是橡胶质地的，不会伤牙。除了抛光外还有牙齿增白服务，这就属于锦上添花了，对牙齿健康不会有提升，只是让颜色变白一些，是可选的。


