  md: '# 问答：放烟火会污染环境吗？


    卓老板，你好。我和我老公都爱听你的节目，我们六岁的女儿也是你的粉丝。她让我们问两个问题。一是前不久我们去上海迪士尼，她看到烟火表演时就一直担心那些烟火冒出的黑烟，她想问问那些烟火会对空气产生多大的污染？第二个问题是她现在在幼儿园学手风琴，她说到了天冷的时候手风琴会变声，就像生病了一样，想问问为什么？本来我想在百度或者知乎上给她查查的，但是她说你讲的很有趣，不仅能解答问题，还能扩展很多。所以很期待您能给这个小听众解答一下。


    卓克

    一个6岁小姑娘的问题，我得用孩子能听懂的方式告诉她。


    放烟火会污染环境吗？


    咱们的听众宋宋说，经常和老公一起听节目，她六岁的女儿也喜欢听，女儿提问两个问题给我，第一个是前不久去迪士尼玩儿，看火焰表演的时候就一直有黑烟冒出来，她想问问那些焰火对空气会产生多大的污染呢？第二个问题是她现在在幼儿园学手风琴，说天冷了以后手风琴会变声，就像生病了一样。


    哎，就这么两个问题，我不是从前还说做个小卓卓的节目给我的孩子嘛，但是没经验，不知道把话说给孩子们用什么方式最好，那我就先试试回答这两个问题。


    先回答小朋友那个迪士尼的焰火表演是不是会污染环境？


    直接回答，这属于短时间小范围的污染。一场迪士尼焰火表演大概会让迪士尼乐园里的PM2.5和PM10上升几十，但对整个上海的空气质量影响几乎可以忽略，所以国家对焰火表演并没有特别严格的管控。之所以影响小是因为燃放的量少，如果是每个上海市民都这么玩儿，那就是一个恐怖的状况了。


    这不马上就要过年了嘛，从前过年都要放花放炮的，那不夸张说，连六岁的小姑娘都得点几颗烟，放几支花，所以就真是上千万的人一起玩儿焰火。北京去年春节有过统计，大年三十晚上这么一放，北京的PM2.5从200多升到400多，这还是放炮的习俗已经很淡的情况下的数字，从前上世纪九十年代，我估计从几十升到六七百都有可能。现在因为大城市雾霾严重了，所以有一些焰火表演在没有风的情况下，气象局已经发出雾霾橙色预警的情况下，那焰火表演大都将被取消。


    咱们再说说黑烟，小朋友观察挺细，其实焰火表演大都是花花绿绿的，她却注意到黑烟。那些黑烟之所以那么黑，其实是因为它是碳的小颗粒，你平时用的铅笔，写出的字为什么是发黑色的呢，就是因为那是碳的颗粒，所以你看到的黑烟是那些非常非常细小的颗粒被风吹起来的效果。当然你还会看到很多其他颜色，那是因为烟花里还有其他金属粉末，比如最亮的白色通常是镁和铝的粉末，黄色主要是钠，绿色主要是钡，红色主要是锶，蓝色主要是铜。所以焰火表演的附近空气如果收集起来，里面除了有很多没充分燃烧的黑火药，还会有很多金属粉末，这些也一样是污染，只不过不严重。小朋友如果觉得哈，就戴上口罩看。其实呢，你看到的焰火表演稍微有些落后了，视觉效果想做得比迪士尼的焰火表演好看，可以用激光实现，很多重要的演出和体育大赛的开幕式都使用了激光，这个设备当然比焰火贵得多，但不污染环境，小孩子也不用戴口罩看。


    那第二个问题是手风琴变声了，像生病一样。


    我觉得很可能是因为手风琴的音准出问题了，不如你听听这段钢琴，这就是很多键都不准了，弹出来就像生病了。钢琴跑音了是非常常见的，因为它是由好几百根钢线组成的，气温下降，弦就会拉得更紧，音就会变高，湿度也会影响琴体的尺寸大小，一般钢琴每3个月得调一次。


    但手风琴和钢琴不一样，它是靠簧片震动发声的，音高基本就由簧片的薄厚、材质决定的，它不太受环境影响。所以很多人没太听说过手风琴还有调音一说。其实手风琴用久了也会跑音，尤其是在南方潮湿的环境，簧片上会生锈，这就对它的薄厚材质有影响了。还有可能是这琴摔过，结果簧片错位，或者松动，拉起来就会刺啦刺啦地响。如果这位小朋友的琴是那种拉了一会儿音高都正常的情况，那可能琴没有什么问题，就是天气突然变冷，热胀冷缩导致的暂时性的变化。


    我比较喜欢音乐，所以能感觉到这位小朋友的耳朵很敏感，想起在我弟弟3年级的时候，他好奇，听我的CD，那是一张摇滚乐队的演出，他那么小当然是不知道，看他听得越来越认真，我还问他听什么呢，他摘下耳机问我，哥，为什么会有嗞嗞很大的声。我很奇怪，哪儿有啊，我们一人戴上一个耳机，我让他agli出现嗞的时候指出来，原来他指的是弹吉他换把位时手指蹭琴弦的声音，我当时一惊，这么小的孩子对这个细节能这么敏感，大家可以来听听，看看到你对这段音乐中换把位时蹭弦的声音敏感不，其实开头第一下就蹭了。


    所以我觉得这位小朋友可以认真学学音乐，你比其他小朋友对音乐更敏感，说不定可以体会出更多音乐里的情绪和美。


    给想抓个机会的聪明人


