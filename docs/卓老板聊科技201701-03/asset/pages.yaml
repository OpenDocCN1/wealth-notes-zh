  md: '# 问答：水土不服是怎么回事？


    卓老板，我经常出差到外地就会水土不服，老是往厕所里跑，这个有根据吗，是不是心理作用？


    卓克

    这还真不是心理作用。


    水土不服是怎么回事？


    午夜列车向，他到了外地就会水土不服，老是往厕所跑，这个有根据吗？是不是心理作用？


    这个直接回答，不是心理作用，是有根据的，主要是因为消化道微生物菌群的变化导致的。但是随着全国饮食行业互通有无越来越频繁，所以2017年的水土不服远不如1987年的水土不服那么严重。


    从前我在微生物的节目里仔细说过肠道菌群，我们消化道可能有好几种细菌，它们的种类和分配占比每个人都不同。菌群的来源主要是两个，一个是刚刚出生时吞下的母亲产道的酸性溶液里带的菌群，和最开始母亲口中的微生物；另一个就是后来吃的食物在消化道形成的环境适于哪些微生物生长，就有那些微生物。


    因为母亲传给孩子的微生物也由母亲的母亲和母亲平时吃什么决定的，所以这就是一方水土养一方人。


    你喜欢吃鸡蛋西红柿面的同时，你肠道的微生物其实也喜欢吃，吃完了你们一起感觉舒服。让习惯这样饮食结构的人去西藏，吃半生不熟的羊肉，就着酥油茶，就算是你喜欢吃肉，你消化道的细菌们也会提意见的，你吃下的东西对它们可能不是有营养的物质，它们就在你的肚子里挨饿，死亡。


    主要菌群的数量减少，也会让从前被压制的非主力菌群增殖，所以出差的前几天，如果饮食差异很大，最明显的表现就是闹肚子，这个过程比较久，比如说一个意大利年轻人，吃惯了橄榄油、蔬菜、火腿、pizza，然后去美国念书，刚去了吃麦当劳，BURGER
    KING，也一样可能闹肚子。但过了几个月后，他就不再拉了，因为他肠道的菌群已经换过来了，更适合消化美国的食物。


    等他暑假回到意大利，吃回奶酪、pizza、橄榄油、海鲜，他也一样会拉肚子，因为暑假时他肚子里的菌群是适合美国快餐的细菌。


    如果照这个经验，有的家庭非常讲究，尤其是家里父母是医生的，根本不让孩子在外面吃零食，也从不吃外面饭馆的东西，只能吃自己家做的干净安全的食物。这些孩子等上了大学，不住在家里，即便大学离家只有2公里，那他的肚子也一样会出现水土不服，别看还是在家乡。


    尤其是中国食品安全管理不力，地沟油、过期的食物、病菌污染的食物，在饭馆很常见，所以常吃这些的人，他们肚子里的菌群其实弹性空间比较大，吃不同的食物反而不会老闹肚子。


    另外还有一种水土不服，那真就是去了穷地方，比如印度，喝了恒河水洗的菜，煮的饭，那里有害菌就是高到致病，几乎是很麻烦适应的，有研究显示，在这样的地区生活可能要几年时间才能让肠道菌群完全适应，不再拉肚子，就像本地人那样。


    有的时候肠道菌群失调是个很麻烦的事儿，就是习惯性的严重腹泻，如果去了一个新地方，出现长时间腹泻后，肯定是先按部就班的服抗生素，先是比较柔和的抗生素，如果不管用，甚至会用到万古霉素，甚至还不好，那就会考虑采用粪便移植的方法，就是从健康人粪便里提取菌群，制作汁液，然后再倒灌进病人体内，灌几次后往往会出奇效，那些什么药都控制不住的腹泻之后就渐渐停止了，然后就会好了，尤其是对婴儿，还不能大量服用抗生素的时候，用母亲的粪便移植到肠道，就能解决腹泻的问题。


    但是现在中国各地的饮食已经不再像100年前，那真的是隔了500里就是另一个口味了，现在川菜馆子到处都是，东北乱炖在深圳也不少，在大城市更是想吃哪种地方菜都能找到，所以水土不服情况远不如从前那么明显。


    像你如果非常敏感，出差就跑厕所，可以选一些不是那么刺激的东西吃，比如去了成都，就别吃那种红油火锅了，有正经事儿要办的话，吃个麦当劳、吉野家，或者干净饭店里普通的炒饭之类那种常见的食物。实在忍不住就少买点当地特色，当调料和配菜尝尝就完了。那种本来就是当地刺激食物，还是街边的摊位，那真的是比较考验肚子里的兄弟们啊。好了，这个问题就回答到这里。


