  md: '# 问答：为什么人会上火？


    想问个跟耳机无关的问题，上火是怎么回事？吃辣椒为什么会上火？


    卓克

    其实正统医学上压根儿就没有“上火”这个说法。


    为什么人会上火？


    有听众问，能不能说说上火，为什么吃辣椒会上火？


    辣椒是刺激性食物，辣椒素会刺激粘膜上的受体，进而刺激神经，产生灼烧的感觉，但实际上并不存在高温，这和我们吃薄荷糖，感觉凉，而并不存在低温的道理是一样的。原因是某种化学元素欺骗了我们的大脑，又因为灼烧感很强烈，大脑按照正常规律运行，会分泌一些缓解疼痛的物质，比如多巴胺，这也会附带产生一些愉快的感觉，所以很多人爱吃刺激性食物。


    但食物残渣如果残留在嘴里，里面还含有辣椒素的话，比如在牙龈里，会持续刺激粘膜，再加上没注意口腔卫生，就会有牙龈发炎的情况，我猜大伙儿管这叫上火吧。


    实际上，现代医学的手册里根本就没有上火的概念，它只存在于替代医学里，或者养生保健里，但又因为后两者在实际生活里呈现的面貌都很难严正的违背科学准则，所以也不被各国主流科学界接纳。如果硬要往现代医学上贴，牙龈炎、牙周炎、龋齿、咽部感染，甚至各种原因引起的便秘、结膜炎、各种唇炎，身体上各种疮疹病毒感染，身体缺水等等一切，全都被冠名上火。这是一种过于笼统的说法，上火几乎等同于感觉不舒服。


    这么一说我想起自己前一阵子了，也“上火”了。我养成了一个坏毛病，边看书边嗑瓜子，大家一定常听说说瓜子上火吧，我的情况是，连嗑了2天后，喉咙就开始肿，疼，甚至有点头疼，体温37度多，我能隐隐察觉就就是瓜子造成的，而且我还能大概猜出什么原因，就是瓜子太脏了，我每次嗑完瓜子，右边脸上都有一片黑，第一次我还以为是我做笔记时签字笔的笔油不小心蹭上去的，但后来发现不是，就是当我嗑开每个瓜子时都有小股灰尘崩到我脸上，那就可想而知了，必然也有不少崩到我咽喉部分，我甚至都被呛得咳嗽。


    解决办法也有，把瓜子洗干净，我爱人呢就帮我洗，我好奇，跟旁边看着，一袋瓜子的水洗出来跟黄河水一样，洗三遍后才干净，然后再给焙干，这样再吃，连手都是干净的，再吃多少，喉咙都没有不舒服，吃完以后再注意漱口，就都解决了。


    所以，瓜子又被冤枉了，是太脏了引起细菌感染导致的，不信你买那种纯的剥好的瓜子吃吃，绝对不会难受。话说我买的也是大牌子的瓜子了，都还这么脏，商家对产品的态度也真是很不认真了。


    # 为了避免各种不舒服，怎么做最有效呢？


    你只要避免身体的粘膜不接触脏东西，差不多就可以几年都健健康康的，比如下楼拿了快递上来，进门洗手，敲完键盘后不抠耳朵，去街边小店买东西，手碰过零钱了，就不要再碰头部的任务区域了，手机屏幕每几天用湿纸巾擦擦，这些都是好办法。


    但就因为上火被传的那么广，喝牛奶上火，吃麦当劳上火，炒股上火，所以去火就好像成了每个人的需求，那些没有经过验证的保健品和不合格的药就来了，比如像牛黄解毒片里的雄黄，成分就是四硫化四砷，而且中国药典要求这个成分的含量不得低于90%，可是砷化合物不论里面的砷是不是容易发生反应，都不应该以任何方式入口，况且雄黄去火，这放在现代科学范畴等同于雄黄治疗各种不舒服。世界上有什么药有这么神么？


    砷化合物不但无效，反而有害。有害的数量咱们之前说大米中含砷的时候就说过，普通人一天不要超过120微克砷，但是要吃牛黄解毒片的话，一片药的砷含量就是300000微克了，超过上限2500倍。对方的解释是，没事的，我们这雄黄里的四硫化四砷中的砷是非常非常稳定的，在人体内，哪怕是胃酸里都不会分解，所以真正流出去的砷几乎没有。


    超标这个咱不提，就看这个解释也说不通啊，既然这个成分这么霸气的稳定，和谁都不会发生反应，怎么吃下去就怎么排出去了，为什么要加这种东西进去呢？吃它干什么用呢？所以今后我们再遇到“上火”二字，注意务实的找原因解决，随便吃去火的药不但没用，反而有害。


