  md: '我再来说说这件事，信里提到了鲁迅的“救救孩子”，不知道大家还记得不，那是狂人日记里最后一句，那文章里记述的是一个迫害妄想症的人眼中的世界，到处都是吃人的人，自己也要被改造成吃人的人，他到处奔走希望劝说周围的人不要吃人肉，但是人们把他当做病人关起来，后来他真是发现自己可能就在无意中吃过自己妹妹的肉，然后就疯了，喊出救救孩子。


