  md: '问在这个方面，该如何投资自己的人生？


    卓克


    我们专栏终于有人问情感问题了，我用理科那一套思路来解答一下。


    科技可以用在找男友上吗？


    节目播了这么久，听众提问越来越像求医问药了，终于迎来一位问感情问题的了。


    Joy说，不知道爱情择偶能不能用科技解答，既然科技的发展是为了改变和提高人生体验，应该不仅仅限于物质，择偶应该超越所有物质，也是对人生的最重要的科技之一，我已经到了择偶年龄，身边多少有可以选择的男生，同时我也看到了很多因为选对或者选错了对象，对往后自己的家人和人生有非常大改变的例子，所以很困惑这个问题，这个方面，如何投资自己的人生？


    这方面的科技还真有，但是你必须集中精力听，因为我要介绍两个已经研究得很透彻的数学模型了，第一个是多对恋人的配对组合，是否存在稳定关系。


    比如说100个男，100个女，每个女生都对每个男生的基本情况有了解，而且心中有一个排序的先后，谁是最爱的，谁是最不爱的，男生也是这样。好，现在他们开始相亲，稳定关系指的是，当这100对男女全部配对结束后，不存在两个在非伴侣关系
    obed... 的异性对彼此的评价比各自已经配对的伴侣要高，也就是说我选的就是最好的。


    我在重复一次，为什么达到这个要求就算100对伴侣是稳定的呢？这很好理解，因为这样就保证了，也许有男人更喜欢另外的女人，但可惜，凡是他更喜欢的女人全都更喜欢她们自己的老公，而这个男的排不上号。对女生也是这个道理，所以一个巴掌拍不响，就不会让2个非伴侣的异性出现劈腿。


    这个数学问题就是，是否存在一种配对方法，形成这样的稳定组合呢，如果存在，应该怎么配呢？


    数学家不是吃素的，这个答案是存在，而且也把配对方法也找到了，咱不细说。咱对现实现说说，实际生活中，男女配对确实都是在往这个方向努力的，谁都希望自己和自己认识的人里最好的那个异性配对。所以人群中的配对过程也倾向于接近稳定配对生成的方式。但是这个方式有一个弊病，就是对女人不利。虽然同意不同意，点头的是女方说了算，但最终的结果是这样选下去，男人虽然得不到他的女神，但依然可以得到所有看得上他的女人中在男人心中排位最靠前的。而女人得到的却是所有看得上她的男人中，在女生心中排位最靠后的。


    刚好中国女生在配对中就是倾向于被选择，所以结局往往令女生更望，所以你的问题是，科技能不能指导恋爱，那么第一个指导方案就是，用男人选女人的方式选择男友，你要主动出击才能和看得上你的男生中选在你心中排位最靠前的。

    而且如果从你所说投资的角度，一旦你心中第一个不行，最有效率的方式就是马上征询排位第二的男生的意见。


    那么第二个指导方案就是37%法则了，这也是经过数学验证的，简单来说就是在选男友的时候，前37%的人不论有多好，都不选，从第38%开始，只要遇到了一个比之前那37%的男友们里最好的还要好的，就选择他。如果一直没有遇到更好的，就选择最后一个。


    有人用计算机大规模模拟过，在1万次这样类似于招聘选择中，每次从30个人里选一个，每次这30个优秀程度不同的人是随机排序，结果有4200多次选中了30个人里最出色的那个，也就是命中率42%，但如果是随机选的话，命中率只有可怜的3.3%了。


    可能大家说了，这不可能，我怎么可能有30个男朋友，但标准放宽点嘛，不是非得接吻才算。喜欢的，可以交往的都划进来，你自己心里比量一下嘛。


    以上呢就是两个科学对选择上的帮助，第一个，主动出击，第二个37%法则。


    不过生活中的细节太多，往往会打破这些数学规律，或者让真正的道理中只有一部分是数学规律发挥了作用。尤其我们刚刚说的规律都更关注统计规律，而不是单个个体就会怎样，只不过会增加你选对的概率。


    另外决定恋爱幸福的因素就是你怎么给可进的男生排序了，你的规则是什么，是什么决定他排第一，排第二呢？还有脱不花（罗辑思维CEO）每天写的小纸条里也有这样一句，就是当你恋爱的时候，脑中浮现的形象是今后孩子他爸爸，当前这个人，你觉得是不是可以胜任这个形象，也有助于做出更好的判断。


    当然，年high的时候，遇到真爱，拼命爱上一场，把结婚、房子都抛开对大部分人都是有条件的，现在生活优越了，敢爱敢恨的代价小了，错了也不会伤筋动骨。最后希望这些建议能帮到你。


