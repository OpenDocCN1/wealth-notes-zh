  md: '# 问答：入耳式耳机对听力有损伤吗？


    卓老板，我同事说入耳式耳塞，对耳朵伤害比较大，这个有科学依据吗？


    卓克


    应该很多人都这个问题感到困惑，其实用对了耳机，对听力是有保护作用的。


    入耳式耳机对听力有损伤吗？


    橙子问了一个问题，他听说入耳式耳机对听力的损伤比较大，问是不是真的这样。


    这个问题很有代表性，因为咱们节目就是听的，不知道大家平时都是用耳机听，还是用外放听的。这个问题简单回答，看你用的是不是得法，如果用对了入耳式耳机更保护听力。


    具体来说呢，听力的自然衰减是每个人从出生开始就不断发生的不可逆的变化，这种损伤其实就是内耳中的耳蜗里的听毛细胞的损伤，是它最终把振动转化成电信号给大脑的，而听毛细胞不可再生，出生时多少，总数就那么多了，死一个就少一个，过大的音量，药物等等都会造成它的死亡。


    它死亡后不但听不到高音，震动小的音量也听不到了。比如说10岁的孩子，可以听到2万赫兹频率的声音，但是我自己试过，似乎1万2以上我就完全没感觉了。不过大家也不用担心，因为语音这类最核心的声音信号，几乎不会超过1500Hz，女高音能唱出的最高频率也就5000Hz，所以即使我们7、80岁了，只能听到6000Hz的声音了，也不会妨碍语言交流。


    为什么说入耳式耳机用对了更保护耳朵呢？


    因为它可以隔绝外界噪音，而我们使用耳机的时候往往是坐公交，坐地铁的时候，这时候外界噪音本来就很大，大到面对面说话都不一定能听清，这种环境噪音本来就在损害听毛细胞，这时候你塞入入耳式耳塞，就算什么音乐都不放，都是对听力的保护。


    我们经常有这样的体验，下班时坐地铁听歌的音量，临睡前再戴上准备睡前听听歌睡，结果就发现音量大的吓人，在嘈杂环境中为了把噪音压过去，只好开更大音量，这对听力损伤就大了，入耳式耳机隔绝了外界噪音，你即使听音乐也不会像用平头耳机时把音量开那么大，所以从这个角度说，入耳式耳机更保护耳朵。


    另外一个要说的是听的内容是什么影响也很大，音乐对耳朵的损害大于语音，因为音乐中从40Hz-10000Hz的频率都有丰富的表现，但听音乐时环境噪音会干扰到某些频段，尤其是低音部分，所以你可能为了更清晰的体会低频，会把音量开特别大。


    但如果你听的是我这种语音节目，我的嗓音可没有那么丰富的变化，各位又更多关注的是说的内容而不是嗓音本身，所以即使我嗓音中不少低频损失了，你也不在意，于是音量就会小很多。


    戴耳机时，只把音量调整合适还不够，耳机还会带来一个副作用，就是耳道内的出汗，细菌增生，这个影响对咱们中国人还轻一些，因为咱们分泌的都是干耳屎，咱们有了ABC11的基因突变。


    但欧美人90%还是油性耳屎，所以入耳式耳机一戴上，汗液再多，更容易滋生细菌。所以首先要选好合适的胶套，然后准备好经的医用棉签，不用什么金属的耳挖勺，甚至用钥匙掏耳朵。


    不过我们也不要以为耳朵是那么脆弱的，如果就按iPhone6的音量输出功率看，用它的默认耳机，用最大音量输出，在100秒内，耳朵是安全的。不过我手头也没示波器，看不到iPhone6耳机音量对应的输出功率的变化，比如说我把音量调整到一半，输出功率是降到一半呢，还是分贝值降到一半呢。


    最后再补充另外两种耳机，一个是头戴式耳机，这个就几乎避免了耳道内的细菌增生，也营造了一个比较隔音的环境，只是携带不方便，有些人习惯在电脑前听点什么，那我就推荐头戴式耳机，它唯一的坏处就是夏天戴着热。


    另外一个要说的是骨传导耳机，这种耳机是利用颅骨的震动接受声音信号的，比如我们自己说话听着和录音就差别很大，差就差在我们自己说话时，不但听到空气传播到耳朵中的震动，同时也叠加了颅骨震动的部分，而听录音回放时只有空气震动的部分，所以听着就那么不同。


    骨传导耳机并不塞到耳朵里，所以也没有耳道细菌滋生问题，而且也不像头戴式那样，揽着耳朵特别热，所以挺适合运动时带，这种耳机和耳朵后面的头骨贴紧，当然这也一样涉及音量的问题，不要开太大，不过我试过，这种耳机听音乐根本谈不上音质，改变太大了。所以更适合语音类节目。


    好，最后总结一下，音量是产生伤害的关键，听歌时注意耳道清洁，担心耳朵健康可以试试其他形态的耳机。


