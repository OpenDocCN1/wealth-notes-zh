  md: '# 讨论：Master团灭人类围棋


    Master团灭人类围棋


    关于Master在弈城上下棋这件事情必须得说说了，也有听众催我赶紧说。这篇内容的素材是咱们「得到」上老熟人怀沙撰写的，怀沙你不知道的话，那万维钢老师的节目音频你听过吧，还有《三体》的缩编版你听过吧，那都是他的声音。


    怀沙帮咱们回顾了事情的前后：2016年12月29号，在弈城上出现了一个叫Master的ID，头像是弈城上几个默认的动物头像，一只小狐狸，结果到了30号的时候它已经打败了N多高手，这些高手里还有不少是职业棋手的马甲。


    先剧透，它就是阿尔法Go的升级版，来自谷歌，这已经不是传言了，是今年3月份阿尔法Go和李世石大战时，代表阿尔法Go，替它落子的黄世杰公布的。


    Master在29号晚上连下10场，5个是不入流的，但是还有3个四段，1个五段，1个六段。这些段都是职业段位的，有段位就有江湖，这也是棋界吸引人关注的最大规则。就像金庸小说为什么好看，因为他规划了一个中原武林版图和等级。一般来说围棋爱好者最最顶级的程度也就是入了职业初段。所以能接连战胜4、5、6段的人可算人类精英了。谁知道30号它又来了10场，这次干俱下的都是6、7、8段的，还有一个是九段，而且还不是一般的九段，是在九段中水平顶尖的，这人就是韩国围棋第一人朴廷桓，他下的这局在中盘就大幅落败了，结果冥思苦想的时候竟然超过了读秒时间，超时输了。


    这里补充一下，在弈城上Master跟人下的都是快棋，它有时候选择30秒，有时候选择60秒，就是每走一步的时间不能超过这个时间，像金庸小说里那种一步棋考虑几天的下法在现代商业社会已经消失了，1930年时还有，比如吴清源和人下十番棋，那整个过程需要3-4个月呢。所以弈城上下的棋和去年年初李世石下的那种还不太一样。但是论实力呢，朴廷桓相当于七龙珠里的青年时期的孙悟饭，是一个非常厉害的角色，甚至略微胜过他爸爸孙悟空。


    第三天，也就是31号，Master又上线了，继续连胜，连胜场数到了41胜0负，这一天死在它刀下的是中国的李钦诚九段、古力九段，韩国的姜东润九段、朴永训九段，日本的井山裕太，这几个名字全都是各国最当打的主力军，全是世界冠军，战斗力爆炸，全都是青年的孙悟饭这个级别的，而且所有这些人全都是中盘告负，还不是打到最后数点输的，是半截就知道无望，然后认输的。很多人这时就猜Master就是阿尔法Go，因为人类最顶尖高手中一大半已经出场了，都输了，能有这种实力的只有非人类了。


    2016年12月31日11点半，在即将进入新年的半小时前，被认为最有希望战胜Master的中国小将，世界围棋第一人柯洁发了条微博，原文称：“新的风暴即将来袭”，柯洁说，我从3月份开始到现在研究了大半年围棋软件，无数次的理论、实践，就是想知道计算机究竟强在哪里。昨晚辗转反侧，不想竟一夜无眠。人类千年的实战演练进化，计算机却告诉我们，人类全都是错的。我觉得，甚至没有一个人沾到围棋真理的边。新的风暴即将来袭，我将尽我所有的智慧终极一战。


    同时，来自中国的江湖威望最高的古力连发四条微博说：不管这个Master是谁，它都已经成为围棋界的“公敌”，希望明天有我们真正的勇士来终结它的连胜！


    似乎就是为响应中国棋手的挑战，Master在横扫了弈城围棋之后，主动来到了中国的野狐围棋平台，继续扩大战果。这次，它几乎就是冲着中国棋手来踢馆的。


    当天，古力在微博发出悬赏，谁能斩杀Master，以10万黄金各奖这位勇士。


    2017年1月3日晚，被认为最有希望的柯洁出战Master，行棋至178手，柯洁中盘认输。柯洁赛后接受采访，称败得心服口服。


    到此，江湖一片寂静，人类千年以来的围棋格局，已经完全被这个来路不明的Master打破。就在这个时候，石破天惊，棋手之中站出一人，中国围棋棋圣，最负盛名的中国棋手，65岁的聂卫平先生，决定挑战Master。


    当年聂卫平曾经在中日最高水平的擂台赛里，在中方只剩他一个人的情况下，面对日本三位超一流选手，一个人完成了三连杀，直接击败了日方大将藤泽秀行先生，最终中国战胜了日本，聂卫平也成了全国人民的偶像。


    聂卫平在围棋界的地位就相当于亵仙人的角色，当年也是拯救过这个世界的老英雄。现在看江湖危机，山河震动，他决定站出来，和Master一战。但英雄迟暮，估计凭他的功力，面对Master也是希望渺茫。


    而聂卫平这次对战的人，和龙珠里另外的一个角色沙鲁也非常像。Master身上流着中日韩三国几千年来围棋名士的血，有吴清源的血，有藤泽秀行的血，甚至也有聂卫平自己的血。因为Master的学习方法，就是把大量的名人棋谱输入电脑，加以不断的吸取和演绎，它不是一个人在战斗，它是人类围棋文化的总和。


    聂卫平先生于1月4日下午出战，开局之后，Master一度领先55目，形成巨大的优势，但聂卫平顽强追赶，一度把局面搬回，最终以7个子落败。像聂卫平这样的高手，如果落了7个子，是肯定知道的，所以可以非常确定的是，他在明知将败的情况下，战斗到了最后一刻。赛后，Master打出了几个字：谢谢聂卫平老师。这是之前所有棋手都没有的待遇。'
