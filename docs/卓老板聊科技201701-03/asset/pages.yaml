    口腔护理是硬需求。


    有听众评论说，刷牙这件事是卖牙膏的人硬造出来的概念，结果现在却成了保护牙齿的必要功课，也许流行、科学和时代就是这么发展的。


    这还真不是这位朋友想的那样，我专门查了查这方面的资料，关于古代人的牙齿健康状况，大致有这么一个规律：'
