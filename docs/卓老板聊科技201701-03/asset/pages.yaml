  md: '# 视觉竟然进化出了障眼法


    视觉竟然进化出了障眼法


    要点：


    +   - 为什么左脑控制右侧身体，右脑控制左侧身体？

    - 脸盲症患者的体验；

    - 什么是祖母细胞？

    - 海马回不止有记忆功能；

    - 人类女性为什么会完全隐藏排卵信息？


    # 知识清单：


    ——♦ 1 ♦——


    # 为什么左脑控制右侧身体，右脑控制左侧身体？


    +   1. 身体肌肉和神经的交叉控制源于视神经的交叉。最早的视觉只能感知敏感刺激，环境变暗说明捕食者接近，这时对侧身体的肌肉收缩会让身体远离捕食者一些，所以在左侧感光，右侧收缩成了有利于进化的模式。


    +   2. 当视感光神经发展成视神经，眼睛就出现了，围绕视觉产生的处理信息的神经元也都按这个规律分布，此后的高等生物在神经与身体肌肉的控制上就形成了交叉的结构基础。


    ——♦ 2 ♦——


    # 脸盲症患者的自述


    +   1. 人对正立的脸识别速度很快，对倒立的脸识别速度降低很多，我们识别人类不是从五官细节上分辨的，而是从所有器官在脸上分布的整体搭配来分辨的。


    +   2. 人脸识别的功能在脑中处于梭状回面孔区，能定位这里靠的是功能性核磁共振，它可以监控人脑血流变化，这是基于神经兴奋对应供血量增加的模型。


    +   3. 脸盲症严重的人结婚10年不认识妻子，电视看不懂，心中也没有偶像。他们只能通过一些局部特征，或者声音认别人。


    ——♦ 3 ♦——


    # 祖母细胞假设


    +   1. 在1969年有神经生物学家提出了祖母细胞假设，他认为在人脑中会有特定区域存储着某个特定人的记忆，要抹去他的记忆只要摧毁这个区域中的神经细胞即可，比如抹去关于祖母的一切记忆。当时这个理论被学术界当作无稽之谈。


    +   2. 2005年，加州理工大學的神经科学家部分证实了祖母细胞功能的存在，他们在研究一群癫痫病患者时发现了一些形象真在患者脑部对应了某一个单个的神经元。


    +   3. 要想具体定位到某个神经元，还需要依靠后面出现的微电极技术，它可以精确观察某个细胞，甚至某个细胞内部离子浓度的变化，属于精确观察的手段。


    +   4. 祖母细胞处于海马回中，在大脑的中心，人们之前认为这里就是记忆的中心。


    ——♦ 4 ♦——


    # 海马回不止有记忆功能


    +   1. 海马回的后续研究发现，它不只有记忆功能，还有定位和导航的功能，这些也都是借助功能性核磁共振与微电极技术发展得出的结论。


    +   2. 在海马回中还发现了定位细胞、网格细胞、边界细胞、头部位置细胞。在2015年时还发现了速度细胞，它们综合在一起形成人类在空间中导航定位的能力，这一序列研究获得了2014年的诺贝尔生理学或医学奖。


    ——♦ 5 ♦——


    # 视觉处理之后就是欺诈


    +   1. 利用视觉信息的高级形式就是欺诈。雄乌贼在求偶时遇到其他雄乌贼，会把朝向其他雄乌贼的身体花纹变成雌性的样子，这样可以免受其他雄乌贼的攻击，而朝向雌乌贼的一侧依然是雄乌贼的花纹。


    +   2. 当水域中只有一只雄乌贼和一只雌乌贼时，雄乌贼从來不会这么做。在水域中存在其他雄乌贼时，它们伪装体色的几率是40%。


    ——♦ 6 ♦——


    # 排卵期要不要告诉TA？


    +   1. 大部分动物的交配期就是排卵期，这时候雌性身体会有明显的特征改变，比如某些器官的颜色和尺寸变得凸出。


    +   2. 但这里有一个例外就是人类，人类的排卵期信息几乎全都隐藏起来，男人不知道，女人自己也无法知道。甚至用现代医学手段也难估测排卵期。


    +   3. 女性一般在月经前14天排卵，排出后卵子可以存活1-2天，如果在这个期间遇到精子会怀孕，但实际经验医学中把前5天、后4天都计算作为容易受孕的时间，就是因为女性排卵日期浮动非常大。


    +   4. 普通家庭妇女通过日期的推算、基础体温的推算都很算准排卵期，在家里可以实现的方法中只有排卵试纸的准确度最高，但操作复杂，条件要求苛刻，即使是都按照要求做，准确率也只有75%。


