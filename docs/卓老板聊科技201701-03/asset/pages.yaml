    飞船爆炸还有救吗？


    # 阿波罗13号在月球附近爆炸


    +   1. 阿波罗13号的飞船指令长是 Jim Lovell，他差一点就入选了第一次登月，这次作为第三次登月的指令长终于如愿。指令舱驾驶员在上天之前3天患了麻痺，遗憾退出，由Jack
    Swigert接替，谁都以为他是最幸运的，但其实是九死一生。


    +   2. 经过2天飞行，当阿波罗13号接近月球，宇航员准备睡7小时之前，NASA发现氧含量的指针读数超过100%，于是要求Jack Swigert拨动一下氧舱的扇叶，但这时电力系统开始报警。之后3个燃料电池中的两个也报警，还听到了一声巨大的爆炸声。


    +   3. 地面中心重启了电脑，问题依旧。Jim Lovell已经从舱窗看到了剥落在外的氧燃料，他们确定飞船尾部已经爆炸了，两个氧舱一个彻底炸废了，另一个在快速泄漏中。Jim
    Lovell向休斯顿的火箭发射中心报告，“Houston，we’ve had problem here.” 这句话后来成了NBA其他球队给休斯顿火箭队嘲倒彩的经典名句。


    +   4. 出事故的时候飞船和地面都没有惊慌失措，在之前几年的训练中他们都演练过发生这种情况下的处理办法。虽然情况很紧急，但仍然有应对措施，就是通过登月舱返回。电影《阿波罗13号》中描述了宇航员之间互相争吵的情景，其实是导演安排的俗套桥段。


    +   5. 爆炸发生在登月之前，如果登月后发生爆炸，就没有任何生还的机会了，另外这次登月任务也是三次里最重的，所以登月舱中带的氧气，水和食物都完全够2个人2天的用量，但是回程使用登月舱需要3个人4天的用量，所以依然非常紧张。


    # 利用登月舱回家


    +   1. 登月舱里的温度设置在1℃，虽然很冷，但比起指令舱全部断电的-270℃要暖和多了。阿波罗13号需要继续前进，绕过月球，利用月球引力给飞船调头才能回程，这时飞船已经没有燃料先刹车，再返航了。


    +   2. 飞船需要在摆脱月球轨道的时候加速，否则宇航员将会8个小时的氧气空缺，而加速后将以更快的速度进入地球，最终NASA选择让宇航员加速返程。


    +   3. 登月舱中的二氧化碳会导致死亡，所以宇航员需要利用氢氧化锂材质的过滤器来处理呼出的二氧化碳，但当时登月舱里只有2个过滤器，还有一个因为没用，导致舱内二氧化碳浓度不断升高，他们后来按照NASA的土办法，在指令舱找到一个接口不对的过滤器，利用袜子、硬塑料、纸片和管子做了一个临时的适配器，最终让二氧化碳浓度控制在安全限内。


