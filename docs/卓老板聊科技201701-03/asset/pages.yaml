  md: '# 我的节目为什么不做的有感情些？


    我的节目为什么不做的有...


    有一封听众来信，讲了家里人迷信偏方保健品，所以耽误了他治疗十几年的事，他虽然心里清楚但无能为力。就是我讲这件事的那一期，听众胡梦卜问，为什么你没有对这封信本身给予评价或者说说想法呢？请不要那么理性，为什么做节目不能有些感情呢？


    我刚看到这封信时很受触动，跟各位第一次在节目里听到时受到的触动一样深，但是咱们这个节目好像就是和情绪、情感剥离的。而且这可能和科学精神的属性关系密切。如果多说一点就是，在人类有文字记录以来的万年历史中，科学如果算作一种文化类别，它和其他类别最大的区别就是剥离了情绪的部分，这里掺杂的和情绪相关的内容越少，价值就越高。是这样一种文化。


    典型的现代科学是从1700年以后《自然哲学的数学原理》这本书出版后开始算的，按一般人的推断，那人类文明应该是最开始离科学最远，然后逐渐靠近了科学，出现了锥形，然后在1500年后慢慢孕育，最终诞生了标志性的牛顿的那本《原理》的书。其实不是的。


    科学的出现走过了一个过山车的过程，离1700年现代科学最近的文化氛围是在公元1、200年时达到高峰，然后就一落千丈，往越来越愚昧、野蛮的文明中坠落去了，所以才有黑暗的中世纪一说嘛，从公元300年到1700年的1400年里，人类文明经过了一个先崩溃，再慢慢恢复的长久过程。


    那你说为什么人类文明一下崩溃了呢，如果从情感上看，对单一神的崇拜和这些崇拜背后的宗教是分不开的，在那些岁月里人们的一言一行，如何思考判断全都有单一神和各种条文约束。关于为什么会天黑，为什么太阳东升西落，人从哪里来，等等问题都掺杂着人们对神的崇敬。有吃什么东西一旦不符合他们的情感体验，那是根本没机会存在和发展的。


    这种对单一神的崇拜直到大规模鼠疫爆发，欧洲人口1/3死亡后，才让人们对那个神和跟那个神有关的一大套说法产生怀疑，情感上的枷锁才松动。如果对比古希腊时期的文化，那时相比中世纪就更接近1700年的思考方式，那时的数学对人们认识自然帮助非常大，因为数学里没有情感，能推导出来只是因为存在逻辑运算或者几何变换的关系，并不因为某些神说过什么而改变。


    古希腊也有对神的崇拜，不过是很多很多神，而且并没有规章制度一样的教条，那时候的神往往可以看成是大自然中某种物体背后的规律，月亮之神、太阳神、火神、农神、海神等等。所以那时对自然规律的思考束缚少，就能多一些可能，出现某些类似于科学思维方式的文化。


    就算是在现代科学成熟后，它的发展也是要把情感放在很次要的位置，因为科学结论往往会因为证据不断丰富，观察不断细微而改变，旧有观点能成为一时的主流，在当初也是很牛的，提出它的人也因此受益，获得了名和利。


    如果所有人都带着情感，那科学结论的更新就相当于对人心的背叛，就没法改进了，幸好，绝大部分搞科学研究的人都默认这种规则，剥离情感的部分，所以总是 trunc


    但是我说的

    不掺杂情绪和情感只是在科学研究过程中，科学家们愿意付出几年时间废寝忘食的搞一项研究，推动他们这么做一定有一个因素是对科学的巨大热情，对未知的巨大好奇，甚至是一种牺牲精神，是这些强烈的情感推动他们在研究中摒弃情绪，只做分析和推理。


    另外，他们在生活中也一样可能是情感丰富的人，也一样可能是麻木的人，这和普通人没有什么区别。我做节目情感少，可能因为它科普的属性吧，冷静、平静时才能思考更多有价值的东西。


