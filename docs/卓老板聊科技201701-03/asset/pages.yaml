  md: '# 影响细胞寿命的端粒


    本期你将听到↓↓↓


    影响细胞寿命的端粒


    # 本期知识清单 ↓↓↓


    —— 1 ——


    # 内质网是蛋白质的质量检员


    +   1.绝大部分蛋白质是由内质网上的核糖体制造出的，少数才是飘浮在细胞质中的核糖体制造出来的。


    +   2.内质网内部连通，里面有些区域很粗糙，分布着密密麻麻的核糖体，还有一些区域是光滑的。粗糙的区域负责制造蛋白质，光滑的区域负责储存脂类和糖分。


    +   3.比如血红素是有2个α蛋白+2个β蛋白组成，它们就是在内质网上拼装起来的，但如果蛋白质组装出错了，这些错误的蛋白质就会被扣留在内质网里，被消化掉。


    +   4.检测蛋白质的单元是重链结合蛋白，简称BiP，它只检测蛋白质的疏水基，因为蛋白质暴露在外的基本都是亲水基，所以一旦有疏水基暴露出来，就说明这个蛋白质出现了严重的结构问题。


    +   5.但是内质网里的BiP只能检测这类出错严重的蛋白质，还有很多错误不太严重的蛋白质就检测不出来了，那些就是基因病来源。


    —— 2 ——


    # 镰刀型细胞贫血症的治疗


    +   1.人类身体制造两类血红素，一类只在胎儿时期制造，它负责跟母亲血液中的血红素抢夺氧，所以它的携氧能力超强，但出生以后就逐渐停止制造了，只制造普通的血红素。


    +   2.镰刀型细胞贫血症患者，他们胎儿时期制造的血红素是没有问题的，所以可以用药物重新启动胎儿时期的血红素制造。之后患者血液里就拥有两种血红素，一部分很强，一部分很弱，平均来看就正常了。


    —— 3 ——


    # 高尔基体——蛋白质的运输车


    +   1.高尔基体是用意大利生物学家高尔基的名字命名了，它由4-8层膜构成，蛋白质从内质网运过来以后会通过层层过滤，去掉身体上的磷水化合物，最终被囊泡包住送去目的地。


    +   2.被高尔基体送出去的蛋白质有3种命运：去细胞膜上，去细胞膜外，留在细胞质里。


    +   3.去细胞膜上的蛋白质就作为膜上的受体，去细胞膜外的就像血红球、白血球、血小板，留在细胞质里的就是各种酶了。


    +   4.高尔基体不断生成囊泡把蛋白质送到细胞膜上，或者膜外，但有时候囊泡会和细胞膜融为一体，成为细胞膜的一部分，细胞膜就是这样增大面积的。


    —— 4 ——


