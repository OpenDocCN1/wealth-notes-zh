  md: '# 预告：大脑的永生


    预告：大脑的永生


    下一系列我来讲讲“大脑和神经”。


    有听众张帮友说，能不能讲一期关于宇宙起源演化、地球生命起源演化的节目？


    怎么说呢，这些都属于终极问题，世上几乎没有比这更宏大的话题了。要真有谁有能力讲，我觉得怎么也得讲上个几年吧。但每个人都对这些问题好奇，这才有的各种宗教 obce，各种巫术和科学。


    ![](img/88a2e7350b5d225f1589c8824d43c46d_13_0.png)


    这应该是我们还没怎么涉及到的内容。大家都看过理查德·道金斯的《自私的基因》吧，没看过总听人说过吧。那本书实际已经出版了40年了，这本书的影响力之大，可以说任何一个生物学家，甚至任何一个对生物感兴趣的人都把这本书当做必读书目。《自私的基因》的核心观念是，在演化过程中，互相竞争的个体看上去是那些独立的动植物或者微生物，但真正的幕后主角是基因。像体细胞啊，器官啊，只不过是基因创造出来的工具，或者是创造出来用于竞争的武器，这些外围设备最核心的功能就是保护基因，帮助基因延续。虽然我们不知道第一个生命体是怎么形成的，但现有的证据让我们知道，地球上出现过的生命体在基因上都有联系，所以基因占据了核心地位。


    好，我们再来说另一方面。基因的竞争非常激烈，N多场血雨腥风后，演化到了一个关键节点，那就是神经细胞的出现。甚至有个别物种从神经细胞更进一步演化出了大脑。凡是有大脑的生物，你看，都给大脑享受了大多数身体资源，比如心脏搏动时15%的血液给大脑，肺呼吸时25%的氧气提供给大脑。缺个肾，切块肝，少了胳膊腿，这都能活。要是说人体有一个东西只要不工作了，这个人就不能称之为活着了，那就是大脑。有些国家规定，脑死亡就是人死亡的标志。还有一些国家没有这样的规定，那些植物人，大脑已经死亡了，但身体其他器官还通过设备维持着，这些人之所以还活着，是因为他的亲朋好友们对他生命的脑补，依然是通过别人脑中的记忆对他的存在做补充。


    ![](img/88a2e7350b5d225f1589c8824d43c46d_13_1.png)


    再活五百年，这都不是梦。↓↓↓


