    # 新刊：14年后虚拟、现实边界模糊


    14年后虚拟、现实边界模糊


    卓克

    我关注VR设备，是想看看虚拟现实状态下的科普节目应该怎么做。


    我觉得评价虚拟现实设备最重要的维度就是拟真程度。这是由3部分组成的，分别是传感器部分、软件部分、硬件部分。


    咱们先说第一个传感器方面，比如Oculus Rift，最开始只用Xbox的手柄实现控制，这明显就是最低档次的VR，等2016年12月份才有了左右手持的touch，这才算达到了VR的及格线。


    这个及格线对应一个头戴眼镜的俯测和左右手动做的俯测，它能给到的回馈就是手柄的震动。现在还有很多公司在做身体其他部位的俯测，比如腿部、躯干部位的。最复杂的方式是穿上一套有点像运动轨迹俯测的衣服，身上有好几个俯测点，挺麻烦的，但也可以简化，比如就有厂商把另外两个手持的touch绑在腿上，身体其他部位的运动通过算法来预测，这样还是可以勉强完整的把一个真人的动作实时呈现游戏。


    比如两个人一起进入游戏，A在游戏中看到B做的各种动作，和B在真实世界中做出的动作基本一致。这是对人物动作的采集，但回馈部分就很少了，比如说怎么才能让玩家在游戏中感受到我是在涉水前行和普通行走呢，这阻力是完全不同的，或者开飞船的时候，游戏中实际玩家已经头下脚上了，但现实中我们是牢牢的坐在椅子上的。


    完成这些可能需要一套机械外骨骼一样的东西，按照游戏中发生的事情给四肢和躯干一些力回馈和触觉上的回馈。或者配一个可以3轴转动的椅子等等，这些回馈上的模拟都比较难实现，比如现在有些电单车，就能通过传感器识别你踩踏踏子时脚踏的力度，不论你是上坡还是下坡，它都能让你感觉用的力是一样大的，这样一套传感器实现的功能其实就是今后机械外骨骼中众多关节处的一个关节上的组件。


    以现在的价格，全身7对儿，一共14个关节的外骨骼，说不定价格是Rift的七八倍，所以在我看来，为VR游戏真实感做贡献的部分中，传感器部分不会是重点，让游戏更真实都要依赖于软件硬件上的提升。'
