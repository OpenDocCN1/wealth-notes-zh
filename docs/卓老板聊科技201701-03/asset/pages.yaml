  md: '# 哈勃望远镜辉煌的一生


    哈勃望远镜辉煌的一生


    # 大型轨道天文台计划


    +   1. 天文台计划是NASA规划的一项在地球轨道部署4架天文望远镜的计划，他们四个分别观察四个不同波段的电磁波信号，第一颗上天的就是哈勃望远镜。\n2.
    康普顿伽马射线望远镜由亚特兰蒂斯号航天飞机运上天，它负责的波段是波长最小的伽马射线的波段。钱德拉X射线望远镜负责的波段是X射线范围的，最后一个上天的是2003年发射上去的斯皮策空间望远镜，它负责的波段是红外长波的部分。这四个望远镜观察的频率范围几乎覆盖了绝大部分电磁波频谱。


    # 人类相继睁开了第三只眼、第四只眼


    +   1. 人类第一次向太空睁开双眼是望远镜发明的时候，1600年，之后过了400年哈勃才上天。\n2. 哈勃与大型轨道天文台计划作为人类的第三只眼让我们对这世界看得更清楚。之后30年，引力波探测器就出现了，这是人类的第四只眼，可以看到非电磁波的信号。


