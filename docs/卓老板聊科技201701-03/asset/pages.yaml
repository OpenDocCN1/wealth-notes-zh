    现在流行轻断食主要是受4年多前BBC拍的一部纪录片《进食，断食和长寿》引发的。其实它播出已经很久了，但最近又开始在国内传开了。


    纪录片里列举了非常多轻断食的好处，比如说采访了一个跑马拉松比赛的老爷爷，101岁了，8个小时竟然跑完全程，没做过手术，平时候也不吃药，他说自己的长寿秘诀就是吃饭量少，差不多正常人的一半。


    纪录片还列了一个统计，30年代美国经济大萧条，生活质量大幅下降，但美国人平均寿命反而增加了6岁。这片子里还有禁食的实验，让一位主播开始3天4夜不吃东西，实验前血糖28。熟悉医学常识的知道，他这个血糖值够高的。禁食后只能喝水喝茶还有每天一袋热量是正常每天热量1/40的速溶汤。结果86小时的禁食后，他体内葡萄糖消耗光，开始消耗脂肪了，血糖变成14。＝＝然后就建议大家每几个月这么来一次。


    轻断食的好处还有很多，但直到最近才有一个在《Cell》上发表的，是让小鼠吃低蛋白低糖的饮食，后来小鼠的胰岛β细胞出现了往干细胞那个方向回退的现象，假如说这类情况发生在人身上，也许糖尿病说不定可以通过这种方式大幅改善。不过这仅仅是小鼠体内，换到人以后的实验虽然也有，但像《Cell》这么牛的杂志是不登的，主要是研究质量和重要性还不够。也正是因为当前的研究状态，英国的国家健康服务部对轻断食的评论是，暂时还没有可验证的安全性和改善疾病的有效性。


    那不安全性体现在哪些方面呢？


    比如孩子、老人这么突然血糖大幅波动，不进食，有可能对身体是有害的。还有身体不适的人这么做会不会病情更严重，还有会不会引发厌食症，或者断食后那几天会不会狂吃？结果体重没减下来，身体反而更糟，因为吃起来更嗜命，饿起来更极端。这些都不是什么很奇特的害处，很可能发生的，但是当前的实验里没能排走这些危害。


    另外一点就是有效性，比如对胰岛细胞的好处，就有实验没有发现有任何效果。即使是在减轻体重上也需要长期观察，比如1年以上的实验，因为可能刚刚执行时真的减了，之后身体会作调整，可能吸收更好。


    但我们还得看看另一个方面，就是一天三顿饭这个事儿是不是健康的准则，我感觉不是。


    因为人类10万年历史只有在最近几十年才能保证一天三顿饭定时按时，绝大多数是一顿饱一顿饿的，所以大概率说，我们身体是可以应付随饿随吃的，而不必每天定时非得吃，尤其是不是饿的时候硬吃，很多病就是这样积累的。


    对于轻断食，或者短时间禁食，这种方法我觉得至少可以在体重超标的人身上是好处多于坏处的。但我们也要注意的是，轻断食或者辟谷已经成为一种营销标签，一种噱头，它带来的效果，普通减肥一样可以达到，也许是因为5天吃饱2天吃少听着比较容易实现，所以才容易被人们接受，也因为BBC专门做了这套的纪录片，才让这种概念突然流行开来。


    减肥是一个长期坚持的结果，就算轻断食在开始2个月有明显效果，你也多留意在时间更久之后，松懈带来的反弹。最稳妥的来看，轻断食，或者我定义的辟谷应该只能算作一种减肥方式，在健康上的其他益处有一些迹象，但是是不是如此，还需要更强的证据。当前不要给孩子、老人、病人试。


    还有在这个噱头上继续增加了什么增强免疫力，抗癌防癌，减少细胞老化，延长寿命等等，还有采日月精华这些说法，基本就都是吹牛的部分了，不用为这些劳民伤财。


