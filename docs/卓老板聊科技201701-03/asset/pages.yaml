  md: '# 提前坠落的太空实验室


    提前坠落的太空实验室


    # 美国花不起钱继续登月了，那就做空间站吧


    +   1. 苏联在1964年ef底部放弃了登月计划，之后通过“礼炮计划”实现了空间站的建设。美国动手比较晚，在1972年底才开始进行空间站的规划之所以这样做，是因为NASA的经费大幅削減了。
    2. 美国为空间站做的准备性实验是“太空实验室”，实验室是由土星五号火箭的三级火箭改造而来的，空间比较宽松，这个计划中使用的很多设备和技术都是沿袭自阿波罗计划。这个太空实验室也只用了5个月就仓促上天了。


    # 太空实验室一上天就出现了严重问题


    +   1. 土星五号起飞的时候震动非常剧烈，刚飞出8分钟左右就把隔热板震掉了，到达轨道后太阳能光电板还无法展开。6片电池板中最大的2片，其中一片在冲出大气层时颤飞了，还有一个无法展开对着太阳。
    2. 隔热板丢失造成了舱内高温，电池板无法打开造成了电池能量不足，所以太空实验室最早的10天，几乎无法启动任何测试项目，需要等待地面派第二批宇航员上来维修。来维修的宇航员共3位，也是乘坐阿波罗飞船上来的。
    3. 除了上面出现的问题，阿波罗飞船和太空实验室对接时也遇到了困难，好不容易对接成功后，宇航员才把从地面上带来的遮光罩铺在太空实验室的表面。 4. 维修太阳能电池板需要事先在地面上做模拟训练。模拟训练是NASA在水中进行的，这涉及到出舱维修，所以每个动作都要排练周全，最终在太空实验室上，宇航员爬出舱，用长柄剪子把卡在电池板轴上的金属片剪断，这片太阳能电池板才终于在10天后顺利展开。


    # 太空实验室里的生活是什么样子的？


    +   1. 宇航员生活在350立方米的空间，相当于125平米，高2.8米的房间，所以还是很宽敞的，宇航员在这次实验中吃的是更接近普通食物的食品，在这之前的宇航员吃的饭都是装在牙膏里的糊糊状食物。
    2. 宇航员吃的饭需要加热，菜样丰富，饼干、牛排、龙虾、冰淇淋都有。在太空中因为失重，唾液分泌减少，鼻腔粘膜充血，所以宇航员吃什么都没味道，食欲不好。 3.
    在太空实验室里洗澡需要在封闭的罐子里进行，先固定脚部避免被水冲到乱转，然后戴好呼吸面罩和护目镜，否则水会糊住口鼻造成危险。使用喷头淋浴时会造成脏水和干净水乱窜，身上的水只能通过毛巾擦，底部的水由吸收孔吸收。洗澡需要15分钟，清理需要1小时，所以之后NASA取消了洗澡设备，采用湿毛巾擦拭的方式了。
    4. 太空实验室的马桶是抽气马桶，马桶中间有一个10cm的孔，宇航员如厕时需要对准孔排便。大便时需要固定双脚，双手抓住把手后把屁股紧贴在马桶上，抽气作用才管用。抽到马桶里的排泄物还会剧烈震动，打散，液体、固体分离，液体回流到储液罐，进行水处理，变成饮用水，固体则自动打包扔到太空中，但后来也不扔了。


    # 太空实验室的悲剧：提前坠落


    +   1. 太空实验室由火星五号改造而来，所以没有动力，它的动力由后续飞上去的阿波罗号的燃料提供，但阿波罗号燃料不多。NASA计划使用太空实验室到1984年，结果因为错误估算太阳风，导致1979年就坠落了。
    2. 当年NASA和NOAA同时观测太阳风对大气层的影响，太阳风剧烈时会把地球大气吹起，飘到435公里高度的轨道，这会导致飞行轨道高度损失。NASA对此建立了预测模型，分析了21个太阳黑子周期的數據。NOAA的模型和NAS不同，但比NASA更准确。
    3. NOAA提醒NASA注意太空实验室的高度，有可能飞船会在1981年坠落。但NASA对此类多管闲事的举动很反感，所以并没有回信，也没有理会这个提醒。1977年NASA委托北美防空司令部测量太空实验室的高度时才发现，轨道高度损失的程度甚至比NOAA预测的还糟糕。
    4. 当时所有发射计划都已经执行完，没有谁能再带燃料上去了，所以NASA意识到他们已经没有机会调整了。到了1979年夏天，太空实验室提前5年坠毁在澳大利亚西南角帕斯外。
    5. 帕斯当地居民把这当做一件趣事，在“宇宙小姐”选美大赛上还运来飞船残骸到比赛现场助兴。


