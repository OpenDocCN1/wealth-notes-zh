  md: '# 情人节特辑 I

    Valentine''s Day的由来


    卓克


    今天是情人节，我也应景出一个情人节特辑，大脑与神经的内容就顺延一期，希望大家喜欢今天的内容。


    Valentine''s Day的由来 ↓


    情人节来源于欧洲，和爱情相关的情人节正式名称为Saint Valentine''s Day，简称Valentine。


    这其实是一个人名，在人名前加Saint是很多宗教中对高尚德行并追随主的人或舍身取义的殉难教徒的一种荣誉，所以情人节字面的意思是圣徒瓦伦廷纪念日。


    瓦伦廷是一位生活在罗马的基督教牧师，在他生活的年代（公元3世纪），基督教是非法组织，公开基督教徒身份是会被剿灭的。


    实际上关于瓦伦廷的事迹在公元303年基督教史上最残酷的迫害时期已经被系统的销毁了。一百多年后公元五世纪一部名为《Passio Marii et Martha
    e》的著作才重新把瓦伦廷为基督教殉难的历史介绍给公众。


    在《Passio Marii et Martha e》这本著作中关于瓦伦廷事迹是这样写的：


    > “他因为信奉基督教接受审判，罗马皇帝劳迪乌斯二世亲自审，期间施加心理压力、促膝长谈软硬兼施，希望他放弃基督教信仰，但遭到瓦伦廷的拒绝，所以最终被处决。


    > 在关押期间，他奇迹般地治好了狱卒Asterius女儿的眼病，让她重见光明，此后狱卒全家包括仆人在内的44人全部在监狱内秘密接受了洗礼，皈依了基督教。”


    从描述中可以推断瓦伦廷这人当时的社会影响力非常大，否则不可能由皇帝亲自出马审讯，而且能在监狱中说服狱卒全家改信当时还是异教的基督教，而不利用这些机会逃跑，也可以看出瓦伦廷具有非凡的人格魅力。


    他在入狱前一定也为基督教做出了不可磨灭的贡献。


    也可能是因为瓦伦廷在举行基督教婚礼上做出了很多勇敢的行为，所以他的殉难史比其他圣徒更带有浪漫色彩，瓦伦廷对基督教做的贡献反而没有这些浪漫的爱情传说更广为流传。


    流行最广的传说是这样的：


    瓦伦廷私下为士兵们举行基督教式的婚礼，而当时劳迪乌斯二世在位认为士兵牵挂妻子不利于征战，所以禁止士兵结婚，举行婚礼本来就是违法的，更何况举行的还是异教式婚礼。


    据说瓦伦廷在行刑前还向士兵和遭受迫害的基督徒们散发心型的羊皮纸，这也是后来情人节男女互赠心型礼品的起源。


    这也是现在网上介绍情人节传说的原形。


    没想到这种浪漫传说在公元8世纪竟然被写进了圣徒殉难史中。又过了500多年的13世纪，连同他的功绩一起被收录进《Legenda Aurea》（英文出版物的名字为Golden
    Legend）。


    这是一本记录中世纪以前圣徒事迹的书，这本书第一次把瓦伦廷的殉难日定在2月14日，并且对殉难者的事迹做了进一步的润色，书中说瓦伦廷在临刑前把一张示爱的卡片给了复明的狱卒儿女，卡片落款儿：From
    your Valentine。


    时至今日西方男女情人节送卡片时落款有时也不写自己名字，而用 “From your Valentine” 代替。


    也正是这本书把2月14日和示爱联系在一起。中世纪盛期的著名诗人乔叟（Geoffrey Chaucer）在自己的交际圈和自己的诗歌里介绍了这个带有浪漫色彩的殉教故事，于是圣徒瓦伦廷的故事逐渐传播开来。


    乔叟为英国国王理查德二世的订婚仪式上作诗《Love Birds》这样描述的Valentine Day：


    For this was on seynt Volantynys day, Whan euery bryd comyth there to chese his
    make。


    > “因情人节到来，鸟儿们都来这里选择配偶。”'
