    # 问答：该不该买电动牙刷？


    卓老板，我提一个和生活联系紧密的问题，聊聊电动牙刷吧，要怎么样，谢谢。


    卓克

    如果你不会好好刷牙，买个电动牙刷也是不错的。


    该不该买电动牙刷？


    沉默问了一个我自己也遇到过的问题，就是用电动牙刷刷牙效果会不会更好？


    简单回答，“大概率”说会更好。


    “大概率”说的是一个统计学意义，比如100万用电动牙刷的人和100万用普通牙刷的人连刷几个月后，对比他们的效果，用电动牙刷的人的牙菌斑面积比用普通牙刷的人少20%，牙龈炎发生的概率少10%。


    这只是从统计角度看，你要是找平常一直用电动牙刷刷牙，最后还是有龋齿的人，那也大有人在。非洲特别穷的地方，连牙膏都没有的地方，一辈子没刷过牙的人，一笑，满口整齐白牙的黑人兄弟也有人在，所以看总体的回答就是这样。


    那么一定要买电动牙刷吗？


    也不一定，如果用普通牙刷，只要你掌握巴氏刷牙法，效果也能很好。这个方法我大致说一下原则，就是你刷牙时并不把重点放在牙面上，而是更多的放在牙齿根部和牙龈上，所以刷的时候，牙刷一半盖住牙齿的部分，另一半盖住牙龈的部分。清洁时，每次牙刷覆盖两颗牙齿，反复刷上4秒钟，然后换到另外外两颗牙齿上，内侧和外侧都刷到。这样刷完最少也得需要3分钟了，但实际情况是很少有人能保持正确方式刷这么长时间，绝大部分人从牙刷开始到漱口都在1分钟左右。即便是这些人知道巴氏刷牙法，知道时长对效果的巨大影响，也还是如此。所以基于这种现状，电动牙刷还是值得推荐的。


    大家都知道，人到老了就掉牙了，这和我们老了，皮肤上长老年斑不一样，它并不是一个衰老的特征，而是牙齿被细菌常年侵袭，最后保不住才掉的。


