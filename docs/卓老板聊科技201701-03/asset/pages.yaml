  md: '# 讨论：聊聊华为的石墨烯电池


    庞志刚：卓老板谈谈华为的石墨烯锂电池吧。


    聊聊华为的石墨烯电池


    石墨烯的话题曾经在听众答疑里详细说过。在那期节目中我们仔细介绍过目前市场上泡沫严重，过量宣传、虚假宣传盛行的情况。最近很多人听说华为的手机采用石墨烯电池了，想知道这是怎么个技术，你不是说是骗子嘛，怎么华为都用上了？


    那么我们这期就来谈谈华为的石墨烯电池。首先肯定性，华为石墨烯电池不是骗子，不是虚假宣传，他们是在日本电池大会上宣布的石墨烯电池，而且明确说明，石墨烯在电池中起到的是增强散热的作用，而不是在电池负极里添加石墨烯，所以这个电池中的石墨烯并没有提升充电速率，也不能提升能量密度，更没有增强导电性，它实际上还是一个锂离子电池。很多人听说的类似华为正式发布石墨烯电池，这类新闻大都是一
    些不懂电池的公众号和科技媒体为了蹭热点标题党的，再加上石墨烯行业本来就是虚假宣传的重灾区，所以不少人被误导了。对这件事正确的理解应该是，华为生产出一种散热增强型锂离子电池，故然是靠石墨烯层实现的。


