  md: '# 最新科学研究：人造生物DNA


    最近有一条挺牛的新闻，就是《Science》这本著名的期刊，发行了一期专刊，而且这期的封面是中国科学家做的合成酵母的文章。


    不知道大家看过《三联周刊》这样的杂志没有，它每一期的封面对应的文章是整期最重要的 一篇大稿子，可能篇幅比其他文章要长个4、5倍，而且这还是《Science》发的关于合成生物学话题的专刊，也就是这期整本没有别的，就是合成生物学方面的，重点核心就是中国科学家做的一系列关于合成酵母的研究，一共是4篇文章，这一期整本一共7篇文章。


    咱们知道，世界最顶级的学术期刊，《Science》、《Nature》、《Cell》，经常听说的是《Nature》，因为《Nature》的子刊太多了，比如《自然-生物技术》、《自然-遗传学》、《自然-材料学》、《自然-医学》等等，十好几本。但《Science》就一本，而且咱们还在专刊里霸屏了，这几乎是从没有过的事情。


    为什么《Science》这么激动弄了专刊呢，就是因为合成 了酵母的部分染色体。酵母是生物学家非常爱的一种生物，自从人类基因组测序开始后，它是第一个被完整测序的生物，它一共有12000个碱基对，16条染色体，咱们中国科学家在这几年用人工方式合成了其中4条染色体。


    简单的说，就是给这些科学家一些原材料，核酸啊，蛋白质啊，反正都是一些化学试剂吧，他们用这些东西制造出来一种生命体的染色体。很多文章评论说，这就快要人工制造出生命了啊，确实有那么一点。


    合成生物的染色体这件事曾经不是没人干过，但合成的都是原核生物的，大家知道，原核生物和动物植物什么的就差太远了，那只是一种原始的，简单的生命形式。但也因为它简单，所以染色体合成的难度小很多。如果能合成真核生物的染色体，那理论上来说，任何生物的细胞我们都有可能合成出来了，人的也可以。你想，买回一些化学试剂，制造一个活的体细胞出来，有点不可思议。


    制造过程呢，当然也不是凭空搭积木，是把原有的酵母的染色体上的东西拆下来，然后换个换上我们人工合成的小积木上去。我们还是用了原来酵母染色体的框架结构。只不过我们可以按照人类已经测序的结果，已经知道哪些序列会产生哪些功能的基础上，把我们想要的序列填入框架里。


    这次科学家就在里面加入了一个基因重组的开关，开关闭合的时候，跟普通酵母一样，开关打开时，这个酵母就比普通酵母更容易发生基因重组，变异就更快。这样一个新物种酵母菌就诞生了。所以新制造出的酵母菌没有父母，如果说有，那就
    是化学试剂，实验人员和计算机。


    可能有人想知道为什么要合成酵母，是不是因为酵母很有用，比如这次用的就都是酿酒酵母，那我们自己就可以指定啤酒或者面包的口味、颜色，或者利用酵母为我们制造药物。比如说青蒿素是从一种叫黄蒿的植物里提取出来的，屠呦呦就是因为这个获得2015年的诺贝尔医学奖，但是从植物中提取的效率极低，大约也就是2%的含量，但如果用重组的酵母菌把黄蒿产生青蒿素的部分植入，酵母菌产生青蒿素的量就很惊人了，一个普通的药企一条普通的产线，通过这种技术就能超越全球青蒿素需求总量的35%以上。


    当然，这些都可以称之为用处，也许可以产业化，但选酵母做实验的根本目的还是因为它是一种同源重组能力最强的生物，什么 意思呢，就是当你把用化学方法得到的碱基加入的时候，酵母是很乐意让这些原材料替代自身原有碱基的。


    其他真核生物就不是这样了，你要拿个 人的体细胞做，起码用当前的方法做替换，效率可能只有酵母的百分之一，千分之一。但即便用了重组能力最强的酵母，这也是一项工作量超大的任务。这其实是一个大项目，叫做合成酵母基因计划，简称
    Sc2.0，最终目标就是把16条染色体都完成，很多个国家合作完成这个项目。


