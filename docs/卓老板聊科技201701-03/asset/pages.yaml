  md: '1.人体有上百万种抗体，抗体是蛋白质，蛋白质的复制需要基因，但人类基因只有2.5万个，所以人体内几百万种抗体都是人类基因合成的吗？


    2.其实人类基因组里只有几百个基因是用来合成抗体的，合成的都是些基础片段，真正的抗体是这些片段的排列组合。


    3.B细胞诞生时会随机出现抗体的排列组合，然后这个B细胞在血液中碰运气，如果一直没有遇到抗原，会在一段时间后自己死去。


    4.如果碰运气时遇到了抗原，就会被激活，加速复制抗体，又因为它的后代产生的抗体在父代抗体基础上有些微改变。所以有些B细胞会更加适合与抗原结合，于是就会产生更大强度的激活。


    # 疫苗是怎么工作的？


    1.最早期的疫苗是死亡的细菌和病毒，把它们注射到人体后，外壳上的蛋白会让身体产生抗体，但风险在于，有些致病物质没有被杀死，就会导致真正的感染，另外有可能抗体没有被激活，或者量不够多。


    2.后来出现的疫苗是改造过的致病物，它们是活的，也在复制自己，所以不会产生抗体产生量不够的问题。但也有可能致病物改造不到位，仍然有致病性。


    3.最新的疫苗里只有那些有害物质的外壳上的抗原，没有活的细菌和病毒。所以即使产生抗体失败，也不会造成真正的感染。


    4.接种疫苗虽然有风险，但它带来的风险远小于不接种疫苗带来的危害。尤其是像狂犬病病毒，感染的是脑细胞，神经元是不可再生的，所以一旦大面积感染，就不可能再恢复，唯一生还的希望就是狂犬病疫苗。


