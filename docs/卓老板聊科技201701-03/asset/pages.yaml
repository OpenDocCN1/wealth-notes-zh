  md: '# 讨论：雾霾口罩你选对了吗？


    春晓: 卓老板，今天雾霾好大，我忽然有个问题，pm2.5的定义是小于等于这个量级的颗粒，这个小于是什么概念？0-2.5吗？感觉口罩防了2.5，防不了氮氧化物或者更小的颗粒吗？空气污染中戴着防pm2.5的口罩以前是放心的，现在觉得是不是调节心情的成分更大了…谢谢


    雾霾口罩你选对了吗？


    # 卓克


    防雾霾大家都带口罩，但这里也有很多细节，如果没注意到，跟没带差不多。首先是几种根本防不住雾霾的口罩，防不住的原理是一样的，那就是孔隙太大，远大于PM2.5颗粒。这样的口罩都有哪些呢，比如医院里医生护士带的
    divina,一一次性护理口罩，那个只能防飞沫、防花粉过敏；还有印着各种可爱个性图片的棉布口罩，那个防风沙还可以，防不了雾霾；还有多层的纱布口罩；还有略带灰色的活性炭口罩。可能您不敢相信都上了活性炭了，竟然还过滤不掉雾霾。没错，活性炭之间的间距远大于雾霾颗粒，去除异味适行，雾霾不行。还有各种所谓的运动口罩，鹿晗同款，柴静同款，那些也都没用。


    不行的就是这么多，不知道您戴错了没有。下面咱们说应该戴什么，就是专业的过滤颗粒物的那些口罩。颗粒物也分不同性质，油性的、非油性的，咱们国家的雾霾几乎全都是非油性的，有这么几个关键词，GB2626，N95，EN149
    FFP1，他们分别是国标，美标，欧标在过滤PM2.5上的规范。正规雾霾口罩一定会在明显的位置标注上这些字样的，你一定能找到，在口罩上如果没有这些字样，又说自己是防雾霾，那基本就是没认证过的小品牌。


    口罩上有了这些标识，我们再看买哪种。最便宜的口罩上是没有其他小配件的，还有一种是带一个小塑料盒的，小塑料盒是呼吸阀，有了它呼气的时候就顺畅多了，相比较没有的来说，就不那么闷，对戴眼镜的人来说也更不容易在眼镜片上喷出很多雾气。外出活动戴防雾霾口罩您就不用想了，一定得用戴呼吸阀的，不然根本喘不过来气，你一着急，把口罩往下一拉，防护效果就全没了。


    另一个关于买哪类的选择，就是头戴式还是耳带式？头戴式是勒在后脑勺上，耳带式就挂在耳朵上，从非常可靠的实测结果看来，头戴式的效果要远好于耳带式。因为后脑勺几乎没有活动的肌肉，所以勒上以后密封性好。挂在耳朵上的虽然方便一些，但耳朵还是能动的，这一动，口罩那边就有松动和缝隙出现，防护效果就不好了。头戴式的一般略高5毛钱，而且对戴眼镜的人来说头戴式的更舒服些，眼镜腿，口罩带全都勒在耳朵上也不舒服。


    最后就是佩戴方式了，关键您就记住一个词，密封。正确的口罩戴法是上下左右，全都严丝合缝的贴合在脸上，时时刻刻都没有缝隙，所以吸进来的空气全部都只能通过一种途径进入肺，那就是经过你口罩的过滤。但这只能是理想状态，很多时候没那么理想，都有什么因素会造成不理想呢？比如口罩生产商，为欧洲脸型设计的口罩给亚洲人戴，就容易偏大，侧面的缝儿就漏了。还有就是鼻夹的部分你没有夹紧，可能就一个小口，但你想，所有都需要过滤后才能费劲的进来，你只要留了一个小口，就有成倍的未经过滤的空气从鼻夹的地方进来了，所以任何小缝小孔都不要忽视。


    说半天规则了，数据有没有呢？是有。 大致假设一个场景，外面PM2.5是500，屋里在关窗的情况下，大约是300，这个您可能没想到，确实就是这么高。你戴一个我刚刚说的没用的口罩，口罩内的空气大约也是300，但是戴了N95这个标准的口罩，大约在20-30之间。但如果因为佩戴不合理，有漏缝的情况，口罩内空气大约是180。所以想防雾霾，不但要买对还要戴对。戴对不止密封一点，还有定期更换，如果拆封了，戴2天差不多就该扔了，如果是一场400以上的霾，戴一天你会看到口罩已经全黑了。而且口罩就是用完丢弃的，没法洗。价格和品牌咱们也不避讳了，也没有广告，买就买大牌子的，比如3M，霍尼韦尔，UVEX，童松。带呼吸阀的3M卖的量最大的是9502V，头戴式6块钱一个，更好的10块钱，12块钱的也有，大家在淘宝的那些品牌官方旗舰店买就可以买，不会是假货。


    好，这个问题就说到这儿，希望大家都选对、用对防雾霾口罩。您是怎么用口罩的呢，咱们可以在1917小组里聊聊，看看多少人用对了。


