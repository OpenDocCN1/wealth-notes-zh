  md: '更要命的是VR眼镜要求的刷新率是90帧，也就是一秒钟要输出90幅画面，一般来说，为了保证画面流畅，电视机是29帧，游戏里达到60帧就很流畅了，但60帧给VR设备就容易晕，所以只能继续增加到90帧。这样一来每秒要渲染的像素数是4.5亿，如果再考虑到抗锯齿采样，还会翻倍。这对一个只有2.44TFLOPS运算力的显卡已经很吃力了。


    现在VR上能用到的最好的显卡是GTX1080，算力是9TFLOPS，是最低要求的3.7倍。但这也只能保障在现有分辨率下，光影特效非常负责，抗锯齿特效开特别高时一直流畅。这样一款设计精良的游戏大概可以提供一个和真实环境80%模拟真的效果。


    想继续大幅提升逼真的效果，分辨率势必要继续提升，保守的大致计算一下，想让人眼在这么近的镜片下看不出像素的小格子效果，至少长宽上的分辨率需要都乘以3，也就是每个镜片竖着3600像素，横着3240像素。这样一个改动，运算量就提升到原来的9倍。


    以摩尔定律的发展看，按最快每一年半性能提升一倍，也就是在满5年后，2022年市面上卖4500块钱的显卡可以提供VR眼镜足够清晰度和拟真感觉。到时候戴上眼镜，如果买的还是优质的游戏大作，那不太留意，赛车游戏中坐在你驾驶舱旁边的导航员，你扭头一看，差不多就是一个真人的样子。


    再往后发展呢，就是芯片的移动化，小型化。2022年装在电脑里那个提供非常接近真实感的运算能力是一个200瓦的显卡提供的，但想戴在头上能移动，随时拿出来享受，不用6-7根线和电脑插着了，那时还要求一样的拟真度，就要求一样的算力，但是功耗要缩小到从前的70分之一。那还要经历至少6次的1年半，也就是9年后，我们制造的芯片就是一个功耗和现在手机芯片差不多，但是提供的算力可供一个虚拟头戴式可移动眼镜。装一块几十克重的锂电池，续航3-4个小时不成问题，还能提供几乎和周遭环境拟真度90%以上的效果。


    那时候的发展也许就不是虚拟现实了，因为你已经可以带着它到处动了，所以增强现实的功能也许更有意义。本来每个人应该用肉眼看到的东西都先用摄像头捕捉下来，再通过芯片渲染得更精致，都是帅哥美女向你走来。但是这最近也要先经历一个5年，再经历一个9年，最快是14年后达成。


    2031年的時候，各位可以算算那时自己的年龄。当然科技发展很难预测这么远的今后，但更科幻的，什么中枢神经开个槽，脑机接口的数据线插上，直接从视神经提供图像信号，听神经提供声音信号等等，我不相信这个会实现，因为生物学方面的基础理论还没出现。现在通过头戴一个300多克的眼罩来模拟一个很棒的效果已经是成本很低的选择了。


    当然，14年后买这个设备，用起来也根本不会像我前几天那么费劲了，肯定可以做到买到手撕开包装就能用。现状，凡是买VR设备的人肯定都是好奇心的驱使，并且会在5年后，现在这套15000块（一套还不错的VR设备的价格）的东西会完全过时。这也算一种科技体验成本吧。


    我买VR设备的初衷，除了好奇心，我也想借体验它想想，如果全方位的提供代入式的体验做科普的话，需要准备哪些内容。做科普内容，有些部分如果能提供身临其境的方式肯定效果更好，那这种效果一定是VR设备提供的了。


