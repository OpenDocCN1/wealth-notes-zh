    # 用户留言


    徐一1 2 这期卓老板块了我们如何处理谣言的办法。一是追溯溯源，比如这次福岛核电站谣言，是从微博大V和公众号中先流传开来；二是探究原因，原来是东京电力公司在调查原子炉压力容器损坏的具体细节时候，谣言中用的图片是真的，但有句话“钢结构被烧”其实是当时核泄漏时候的事，核辐射值也是当时测的。三是表明真相，除了上述之外，我们得到的信息是不必恐慌，真实的核辐射范围一直被监控且未有增加。四是经验教训，东京电力公司反应太迟钝，以至于本来5级核事故变为7级，事故的真相虽然不像谣言那样令人恐慌，但具体细节告诉我们的比想象中要严重太多，以至于这就是一个核弹在福岛潜伏。02-06
