  md: '# 问答：火是什么？


    卓老板，请问一下火是什么？


    # 卓克


    我挑选了1个小朋友问的很有意思的问题。我相信那些问题很常见，但在相当长的一段 tratti 里没能找到答案。


    火是什么


    火是什么？


    直接回答就是，火是气体，而且是温度很高的气体。


    如果是对孩子回答的话，我觉得到这一步就足够了，让小朋友们知道，火不是什么奇特的物质，而是一些我们熟悉的气体在高温下的状态。


    如果给成年人讲呢，就用化学反应解释，化学反应可以在不同的场所发生，一般来说反应物分得越散、越开，反应强度就越强。所以在溶液里，反应物都分散得很开，反应就会很充分。


    在空气里也想充分反应，就不容易了，因为反应物大都是些固体，没有充分混合。但某些初始条件会引发反应发生，比如划火柴时的瞬间燃烧，但其实这个过程有好几步，先靠划火柴摩擦生热，再让火柴头上的氯酸钾分解产生大量热点燃火柴盒上的红磷，红磷再点燃火柴头的硫。


    家里天然气灶台也是这样，你在空气中随意混合甲烷是不会燃烧的，必须有个电打火的装置，点燃最初的一点点甲烷和氧气，后续的发热才能维持更多的甲烷和氧气参与进来反应。


    以天然气燃烧为例，已经烧起来的时候，火焰外围的温度大约800℃，这时候不论是附近的氧气，还是甲烷、氧原子、碳原子、氢原子的电子都处于一种激发态，温度高就会让电子更活跃。


    但也因为火焰毕竟有一个边界，边界之外是低温，所以原子处于激发态后总有机会遇到给予降温的因素，只要一降温，不少电子就从蹦蹦跳跳变成懒惰动的状态，这个状态转变就放出一份光，这份光是什么颜色取决于从刚刚那个激发态降落到低一些的状态上，能量差值的大小。


    有些差值对应的能量很弱或者很强，发出的光，我们眼睛看不到；有些处于中间，我们就可以看到。


    在反应物充足的地方反应更剧烈，所以发热更多，温度更高。


    一团火焰哪里具备这样的条件呢？


    就是火焰的外沿。火焰的内部因为接触不到比此沿更丰富的氧气，所以反应没有那么剧烈，温度就低很多。所以火的本质就是一个发生剧烈反应的区域，这里原子中的电子不断从激发态降落到低能级，放出光。


    这个是给成年人的版本，实际上甲烷的燃烧就是一个非常复杂的过程，有专门的科学家做详细的分析，比如研究化学发光机制的科学家们。


    甲烷在氧气中燃烧有300多个步骤，我们中 学 学 到 的 公 式 ，CH4+2O2=CO2+2H2O，只是这300个步骤里的初始态和终止态。中间错综复杂的过程我们都当作一个黑箱子了。


    人类对火的好奇和崇拜有很久的历史，每个文化中都有火神这种东西。甚至在现代科学刚刚诞生后，还出现过燃素说理论，这个理论作为化学领域的主流理论流行了大约200年，到1890年才彻底被证伪了。


    这个理论就认为：


    火是由无数细小而活泼的微粒构成的物质实体。这种火的微粒既能同其他元素结合形成化合物，也能以游离方式存在。


    大量游离的火微粒聚集在一起就形成了明显的火焰，它弥散于大气之中使给人以热的感觉，由这种火微粒构成的火的元素就是“燃素”。


    物质在加热时，燃素并不能自动分解出来，须额外加空气将其Π中燃素吸取出来，燃烧才能实现。


    上好的空气是具有吸收燃素的性质的。


    最终燃素说的灭亡是因为拉瓦西精确测量了氧气的质量，确定了这种物质的存在。通过燃烧后坩埚增加的质量其实是氧气的质量，而且测试中，氧气减少的量也是这么多。


    讲这个故事你也能体会到“可测量”这个属性是多么重要了。不可测量的东西必然会沦落到充斥着神论的地步，我当然相信存在很多以理想为至高无上的思考者，分析着那些不可测量的东西，但我更相信有千倍万倍的，以赚钱为目的的人渗到其中，蛊惑人心。


    ![](img/88a2e7350b5d225f1589c8824d43c46d_25_0.png)


