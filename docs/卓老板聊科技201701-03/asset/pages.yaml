    2.世界都是藏在大脑之后的一组映射。但好在，这个映射是极其稳定的，只要是人类，对同一个物体，经过不同大脑加工后，在哪怕极其细微的方面，我们的感知都是高度吻合的，否则故宫的收藏珍品，毕加索的名画就不值钱了。


    3.我们脑中的世界比真实世界的映射还要广阔的多，而这些多出来的部分就是大脑超越基因，可以把控的部分。有些个体甚至为了这部分虚幻的概念牺牲了生命。


