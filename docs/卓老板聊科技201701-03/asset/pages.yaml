    # 恐龙为什么有的两只脚，有的四只脚？


    为什么大部分四脚着地的恐龙是吃植物的，而两脚着地的恐龙是吃肉的呢？


    卓克


    我又要给孩子们回答问题了，这回我决定回答两个版本。


    恐龙为什么有的两只脚，有...


    有听众说自己家孩子5岁，非常喜欢恐龙，最近也常问他一些恐龙的问题，比如为什么大部分四脚着地的恐龙是吃植物的，而两脚着地的恐龙是吃肉的呢？


    我又要给孩子们回答问题了，这个问题用最简单的方式回答就是，恐龙从2亿3000万年前出现，那第一批能称之为恐龙的生物就是双脚站立的物种，体型跟哈士奇狗差不多。它们都是肉食性的。后来在残酷的捕食、被捕食过程中，那些被捕食的恐龙想办法增加防御措施，其实咱们节目从前说过，最好的办法就是长成一个大块头，变成重量是捕食者的50倍，到了那个吨位，就什么烦心事儿都没有了。


    但变大的后果就是太沉了，两条腿已经不能保证顺利活动了，所以进化出四只脚爬行，甚至还有泡在水里的，让浮力承担一部分重力。但这也不是绝对的，比如禽龙10米多高，3吨多重，吃植物的，它前肢有点短，既可以四足行走，也可以两足行走，砂龙也是这样，可以自由切换的。好，这就是给小朋友们的版本。


    但这个版本太粗糙、太鲁莽，实际情况是，这个问题我们也许很难有什么可靠的答案。这是因为恐龙化石并不能反映那个时代的全貌，最多能从一个具体的化石做进一步的推论，像这样很大范围的问题就只能靠马后炮来凑了。所以在下面的时间里，我凑一凑现在已经通过化石确认了的关于恐龙的结论。


    恐龙是2亿3000万年前出现的，在它们出现前，地球上也是非常热闹的，爬行类还有很多分支，对应恐龙的祖先就是兔鳄这一支，兔子的兔，鳄鱼的鳄。但是在恐龙出现前的1000多万年里发生了二叠纪-三叠纪的大灭绝事件，95%的地球生物都灭绝了，一种两足行走，又跑又跳，大小跟狗差不多的爬行动物幸存下来了，这就恐龙的祖先。


    从这句话你可以听出，这是指恐龙是单一起源的。也就是后来1亿5000万年的恐龙都是从这一个枝儿上分化出来的，对，这是在1990年后基本成为主流观点的，从前的考古学家认为现在发现的恐龙化石的祖先是很分散的。


    能形成这样的主流观点和1970年后爆发的一次恐龙文艺复兴有关，在那个年代前后，对恐龙的传统认知有多少条基础理论被颠覆了，比如我刚说的共同祖先的理论，还有恐龙是温血动物，而不是像现存的爬行动物那样是冷血的。


    那个时期还出现了对恐龙行为的新描述，比如有些恐龙会花很长时间育儿，有些恐龙会筑巢，如果非要说的话，恐龙的行为可能更像哺乳类动物和鸟类的混合，而更不像爬行动物。恐龙文艺复兴的最后一个重磅炸弹就是小行星撞击地球导致恐龙灭绝论。当时这几个假设都是从化石证据里推断的，但没想到都在之后20年左右时间里被主流科学界认可了。所以像我们小时候看的动画片《恐龙特急克塞号》那里描述的恐龙实际上是按照恐龙文艺复兴之前的观点刻画的。


    咱们说回恐龙，它刚出现的时候地球上还有其他竞争物种，比如坚蜥目、劳氏鳄目、鸟鳄科、喙头龙目、二齿兽下目等等，那时一点也看不出恐龙有成为霸主的苗头，你想，跟狗差不多大，数量上大约占所有陆生动物的1%左右。但是这些竞争对手都在三叠纪末尾的两次大灭绝中彻底消失了。之后留在地球上的主要就是鳄鱼的祖先，老鼠大小的哺乳类祖先，跟现在差别不大的乌龟，天上飞的翼龙，还有地上跑的恐龙。


    而这时恐龙的数量已经占了50%-90%，绝对多数，而且块头也开始长大。现在发现的体型最大的完整化石是地震龙，33.5米长，还有一种可能更大，是双腔龙，但是化石已经遗失了，从残存的化石图释可以推断，伸长可能有58米。而最大的食肉性恐龙身长18米。有这么个规律，食肉动物不会长得比它同时代的食草类动物更大，否则那么大体型要想活下去，食物就很难充足。


    像电影里那样从琥珀里抽取龙血，对DNA测序，用克隆技术培养出活恐龙，这对恐龙是不可能的。一般来说化石中，就算那些最最不容易被分解掉的牙齿、指甲、毛发之类的东西，就算在琥珀中，就算保存再好，1000万年也足够让任何DNA信息荡然无存。我们现在研究恐龙化石只能通过断层扫描技术，从比较完好的化石中分析它们的生理结构，推测恐龙的生活习性。


