  md: '# 问答：如何挑选中空气净化器？


    鹅：卓老板，能讲讲空气净化器吗？我个人感觉净化器就好像一般的口罩，对雾霾作用不大。


    如何挑选中空气净化器？ ↓


    # 卓克


    上周佬细说了防雾霾口罩应该怎么买，怎么戴？相信不少人都已经买了正确的型号，也都会正确佩戴了。这期我们顺着说说怎么选空气净化器。


    首先是需要不需要买？结论是当然需要，因为雾霾越来越严重，每个大城市都出现了雾霾，冬天时更严重。当然如果您家装修时就有新风系统，那就不用单买空气净化器了。


    雾霾这个观念很多人没有明白，以为说外面雾蒙蒙的都是霾，把屋里头门窗紧闭就没有，所以屋里就没有霾。其实测数数据挺高的，大致均摊一下就会发现如果外面雾霾是500，看不同的室内条件，从家居环境到候机大厅，大约是250到400之间。所以关门窗对降低雾霾没有本质的改善，空气净化器是必须的。尤其是家里有小孩的，雾霾对孩子的影响比成年人更大。打开正规的净化器，屋里的PM2.5就能一直维持在50以下了，如果买特别好的，甚至可以一直维持在10以下。


    空气净化器的结构是类似的，滤网配风扇，然后用一套外壳把它们罩起来，一个口吸风，一个口出风。滤网呢，这已经是一个标准规范很明确的行业了，因为工业、企业、医院的一些无尘室对空气质量是有要求的，现在过渡到民用而已。空气净化器用的滤网是HEPA网，这是高效空气过滤网的缩写，有不同的等级，市面上销售的低端净化器大都用的是H9和H10，七八千块钱的用的至少是H12的，还有H13的。这些在净化器的参数介绍中都能找到，想要好效果就买等级高的，当然，一定也会贵，而且滤网是定期更换的，所以后期维护的价格也高一些。其实H10的标准是小于0.5微米的颗粒过滤掉95%，这已经很好了，追求H13那个滤掉99.95%的效果没有太大必要。


    空气净化器除了这张网还有一张活性炭网，过渡异味儿有用的，还有一张去甲醛的滤网，这些滤网过滤PM2.5是行不的。多说一句，装修家里去甲醛唯一可用的方法就是通风，净化器的滤网只会把甲醛聚集到网上，它依然在家里，还是会慢慢挥发的。另外甲醛也没有证据明导致白血病，甲醛如果能造成癌症，也是先造成鼻咽呼吸道上的癌症。


    另一个重要的参数叫净化速度，参数表里写的是CADR值，指的是工作一小时可以净化空气的体积。客厅如果是20平方米就选CADR200的，30平方米就选CADR300的，40平方米就选CADR400的，这样递推下去。如果按房高2.5米算，那就是它工作15分钟可以吹出这间房子空间这么大的空气量。但这不代表说15分钟能把房间里的空气过滤一遍，因为离净化器远的地方的空气还没轮到过滤呢，离净化器近的空气可能都已经过滤两三遍了。所以想让空气净化器一开就快速产生效果，就要配合家里电风扇一起用，把整个室内空气搅动起来，让过滤后的更洁净的空气尽快分布在每个角落。但雾霾不像炒菜，铲锅的时候只需开一会儿排风扇，雾霾一来就是2、3天，所以正常的使用方法是打开以后，直到这场雾霾过去就不再关了，这方面很多中老年人做不到，因为他们想省电，或者觉得没必要，往往是买了以后跟家里摆着。


    正规的净化器可以轻松把屋内PM2.5浓度降低一个数量级。净化器工作的效率和风扇转速直接相关，一些小众品牌用的风扇不好，连续用了几个月轴承就磨损了，开始出现各种怪声。或者早期有些型号设计不合理，最低转速的噪音也很大，导致这种净化器没法拿到卧室睡觉的时候用。但现在正规品牌的净化器差不多都不存在这个问题了。那么哪些品牌净化器可以买呢？咱们也不避讳，国产的像格力、海尔、美的、TCL以及亚都，日韩系的有夏普、大金、松下、三星和LG，互联网新生的像小米、玖米，还有欧美高端的有blue
    air、戴森、霍尼韦尔及飞利浦等，这些都没有问题，我自己买的是小米的，原因是性价比高。


    刚刚说的是最主流的一种，利用滤网净化空气，还有利用静电吸附方式净化空气的，让微小颗粒带电后吸附，这也是一种可行方案，但副作用就是静电场会产生臭氧，臭氧氧化性强，太多就对身体有害，FDA规定是不得超过50PPB，也就是十亿分之50的浓度，这是最严格的标准，我国的标准是不得超过十亿分之100，接触时限是8-10小时。十亿分之50听着够稀释了吧，但我们的鼻子可不是含糊的，比较敏感的人在臭氧浓度到了20PPB时就已经能闻到了，最不敏感的人到了150PPB也能闻到了。如果这类净化器是卡着国家上限走的，100PPB，家里人再都是鼻子灵的，那就经常能闻到家里臭氧的味道，大概就是类似于草坪割过以后那种味儿，肯定不是硫化氢臭鸡蛋味儿。这个问题导致静电吸附式净化器还没有滤网式的普及。但好处是不用换滤网了，省下了后续费用。空气净化器的滤网不像净水器，几个月就得换，大约用上1-2年换一次都可以，价格大都在100-400块钱之间。


    再总结一下，买净化器看两个重要指标，滤网等级是H几的，看净化量CADR的数据，雾霾来了要一直打开，几天后雾霾过去了再关，还可以配合电风扇一起使用效果更好，大概就是这么多了。好，这个问题就回答到这。


