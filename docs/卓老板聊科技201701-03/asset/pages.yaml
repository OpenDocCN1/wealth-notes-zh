    假如有一间铁屋子，是绝无窗户、万难破毁的，里面有许多熟睡的人，不久就要闷死了，是从昏睡到死亡的，并不会感到死的悲哀。现在你大嚷起来，惊起了几个较为清醒的人，使这不幸的少数者来受这无可挽救的临终痛苦，你倒认为对得起他们么？


