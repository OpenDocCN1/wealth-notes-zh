    # 问答：吃燕窝对身体有益吗？


    认真听了卓老板的所有中医话题的节目，很震惊！有一些问题，希望卓老板来回答：燕窝这么贵，真的能美容吗？燕窝酸是不是对宝宝的脑发育有好处？外国人吃燕窝吗？


    卓克

    燕窝其实真没那么有营养。


    西方国家的人也吃燕窝吗？


    有位听众问我，燕窝到底对身体有没有好处？我先说一个总的纲要，所有你遇到的保健品，不管是超市买的，京东上卖的，朋友送的，都要先看它有没有保健食品批准证书，简称国食健字。


    这个国食健字的格式是G开头，代表国家食品药品监督管理局；然后四位是年代号，比如今年批的就是2017；然后再接4位，是顺序号。这个证书的有效期是5年，如果你买的保健品连这个号都没有，那就根本不是合格产品。或者这个号是G1990几开头的，都过期好久了。


    保健品的这个号不光要有，而且还得是真的，现在随便编一个印上去的占位也不少，我们可以在食药监局的官网上查询一下，名称和证书是不是对应的。


    如果现在真要给这个行业打分的话，满分100 肯定是不及格的，大概也就20、30分吧。因为保健品市场太乱了，从2016年7月1日起，也就是刚刚开始施行的，咱们国家新版的《保健食品注册与备案管理办法》中，第五十五条规定，保健食品的标签、说明书主要内容不得涉及疾病预防、治疗功能，并声明“本品不能代替药物”。这一招是效仿FDA（美国的食药监局）对保健品的管理办法。


    其实，业内对FDA管理保健品的评价是，他们在保健品的监管上已经吃瘪了，他们最早的想法就是<|start|>着拖杀保健品去的，要像药一样管理，严格再严格，但是无奈，行业利益盘根错节，FDA愣是没有管得了，最终妥协的结果就是FDA只能提出，你们卖保健品的不能有任何内容宣传东西可以治病。其实就这一招也能大幅遏制住保健品商的忽悠了。


    但是这事儿到了中国就变味儿了，你可能没仔细听刚刚那第55条，它说的是，保健食品的标签、说明书主要内容不得涉及疾病预防、治疗功能，咳，妙就妙在主要内容这四个字上。那我不在主要内容上涉及，我另外弄一张纸，印在包装上，印在瓶盖上，印在盒子底下，这些位置就不能算主要内容了吧，所以主要两个字加上是很讲究的，像青海春天这样生产虫夏草保健品的，就可以继续堂而皇之的在非主要内容里宣传疗效，其实跟没规定也差不多。


    这方面美国是很严格的，什么标签啊，广告啊，瓶盖啊，药片上啊，说明书里，反正是涉及这个保健品的任何地方，都不许出现任何跟疗效有关的内容，发现了就撤销保健品的批文，然后巨额罚款，这种大力惩罚的事儿FDA没少干。之所以这样做，就是因为所有保健品确实没有疗效可言，能保证安全就已经谢天谢地了，更别提疗效了。


    所以我们第二条纲要就是，看保健品的包装、宣传资料，包括广告、说明书、标签，凡是带有任何跟疗效有关的，比如缓解高血压，降低血糖，那都都可以归入骗子系列，不论这些内容出现在包装纸上，还是出现在CCTV黄金时段的晚会里。


    但是中国还有一个更说不清道不明的存在，那就是中医的话术，比如滋补阳，理气舒心，补肝护肾等等，你说这算疗效吗？这要看药监局怎么评定了。


    说到燕窝有没有益处，咱们也得分情况，因为确实市场中绝大多数所谓的燕窝根本不是金丝燕的燕窝，而是用树脂、食用明胶做的。


    咱们就按全部燕窝都是金丝燕的燕窝，那怎么才算有营养价值呢？


    理性地说，所有事物，营养价值就是碳水化合物、脂肪、蛋白质、矿物、维生素这5类物质的比例。如果都包含，各类占比都还合适，那就是好营养。除此之外并不存在任何有特别功效的营养成分了，就算是，吃到身体里也要先分解成这5种。


    正经的燕窝是50%左右的蛋白质，30%的碳水化合物，剩下是一些水分、矿物质和一些微量元素。而且这里的蛋白质还不是优质蛋白，因为不包含人体所需的8种氨基酸，营养不如鸡蛋或者豆腐。


    而且更重要的是吃燕窝不是生嚼，所以别看50%的蛋白质挺高的，但水一泡发，1克燕窝泡出10克来，蛋白质含量立刻变5%，快接近牛奶了。这世上没有天然形成的神奇物质，所有稀奇古怪的东西就算没有害处，营养成分也很难比得上鸡蛋+蔬菜沙拉+面包。但价格却很可能是上几百上千块。这钱花出去就是把挣来的钱交税，很很多时候还搭上了健康身体。


    像这样的保健品问题还可以延伸很多，比如人参、鹿茸、熊掌、虎骨、犀牛角、血蛤等都没有益处。直说，没什么特别的益处，但却害了很多动物的命。


    最后一对对等待保健品的纲要就是，完全可以把所有保健品，包括美国的，澳洲的，苏格兰的，全世界所有的保健品都当作安慰剂对待，完全不吃，这么做几乎就是最正确的。


