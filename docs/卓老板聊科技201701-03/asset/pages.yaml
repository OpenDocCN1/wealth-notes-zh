    # 新刊：杀不尽的网络谣言


    杀不尽的网络谣言


    # 卓克


    对于猖獗的网络谣言，我聊聊自己的想法。


    今年我发现不约而同的，有很多不经的公众号都发布了怎么给父母微信破解谣言的话题。这也是因为最近两年来中老年人微信谣言传播的大盛了。我也出了一个系列内容，跟大家分享下。


    首先可以趁着在家 N 这一周把父母的微信订阅，尤其和养生、健康、疾病相关的，给他们更新换代一下，关注上那些优质的号，删掉谣言号。


    然后就是心理预期，通常大部分人定的预期都远高于实际情况，比如我们家，经我净化科普后达到了一个什么效果呢？就是不会转发特征明显的，从标题就可以看出是谣言的劣质文章，也不会相信宣传不吃药降血压、降血糖，花上千块钱买保健品的内容。


    我觉得能到这一步就可以算达到目标了，虽然他们还是去三甲医院开中药什么的，也没法把控，能扼御大部分谣言就是成功，父母一辈人是做不到完全粉碎谣言的。


    # 网络谣言背后的利益


    在看了几十个垃圾公众号以后，我心里也有个怀疑，因为不确定，所以也没有在文章里具体写。我从那些文章标题，标题中的特殊符号，标题中的错别字，到内容的重复度来看，肯定有几个机构在批量制造劣质文章和谣言，手中有几十或者几百个号，然后大面积散播，互相带流量，大号养小号，这样借流量盈利。而且很有可能是用钱买的刷流量服务，因为他们大多数文章都是10万+的流量，还都不开评论。


    微信是这样的，文章被投诉后，自己不删，而被官方删了，就会扣一些分，分扣多了就不能发文章了。号就废了。如果是真实流量的 话，留言也是价值的一种体现，干嘛不开呢？如果是真实流量的
    话，号的主人难道不珍惜这个有价值的号吗？就任由今天被删一篇，明天被删一篇，最终落个封号处理？我不相信，所以我严重怀疑这是刷流量出来的。


    这就有点像PC时代的垃圾邮件，比如曾经的垃圾软件之王的Robert Soloway，它在电脑性能还不济，网络带宽还不高的2005年，15天里就能发出超过2000万封垃圾邮件，这些邮件里很多中奖信息，诈骗理财的内容。你当然觉得正常人怎么可能相信呢，但是人家玩的就是概率，当1000个人里没有一个相信，无所谓，10万人里有1个相信就行，如果当被骗100块钱，那么他发的垃圾邮件盈利的效率就是15天里有200个人被骗走100块钱，这就是月收入四万的买卖。


    况且中老年用户对微信谣言的抵抗力远不如垃圾邮件。所以这个行业存在非常丰厚的利润。而且我怀疑很可能这些制造微信谣言的人从前也从事过垃圾邮件、诈骗信息的分发，因为他们深谙此道。刚刚那个垃圾邮件大王在2005年就赚了30万美元，后来被捕了，判了26年。


    # 低水平的网络内容


    中国这方面的处罚力度很弱，写一篇谣言文章成本很低，甭说写一篇了，就算是上百个造谣号握在手中，每天批量发谣言被处罚的几率也近乎为零，只要不碰政治，其他领域的谣言，有关部门不会制裁。只有微信官方能出一些惩治，也只是不让他们继续发布而已，这都算不上惩治。


    没有监管环境是微信谣言散布一个原因，还有就是造谣者有一块肥沃的盈利土壤，也就是有大批的人信谣，传谣，这和文明程度、受教育程度、信息开放程度紧密相关。常年以来youku上的视频就是网络视频平均水准的代表了，各种文化出版内容的排名中TOP10都是什么质量，电影、电视剧的水平如何，这些大家都有感触。没有高水平的内容引导大众口味，大众自然就把次一档的内容当作顶级内容去欣赏，次一档的内容再为了追求销量把质量再放低一个层次，劣质的东西就这样出来了。


    我突然想起方舟子以前写过的一个生物界的现象，说的是大象体型变小的例子，几万年前陆地上生活的大象那是真的大象，4-5米高，十几吨重，但是在地中海上有些孤岛，比如西西里岛、马耳他岛，在这些岛上发现的大象化石体型就很小，1米多高，100多公斤重，大象还不如一头牛大。


    结合地质学的证据，我们知道了，这些岛屿曾经是和大陆相连的，后来海平面上升，岛屿才和曾经的主要大陆完全隔离。那些大象从原来巨大身材进化到矮小身材，是因为曾经在广阔大陆上求生一个好手段就是尽量长大长，大到是它们天敌体重的几十倍时，天敌们就放弃捕食它们了。


    体型大保住了它们在食物链上的优势，但维持大体型需要很多食物，它们每天要吃2百公斤的植物。后来岛屿和大陆彻底隔开了，岛上的狮子老虎逐渐灭绝了，岛上的食物又很有限，食量小的象更不容易被饿死，所以缓慢进化到后来，体型也不要那么大了。


    一个岛屿上的新生植物如果能满足500头象进食的需求，那么甚至能计算出每头象每天吃多少，这么算完每头象也就100多公斤重。


    所以，一个没有激烈竞争的孤岛上，不会出现大型动物，文化上也是这样。


    官方封这个封那个，还要继续加强管制，最终效果就是赶走竞争者、捕食者，剩下 来制作文化内容的机构没有了压力，就不用挑战更棒的内容了，所以在一个封闭的墙内不会诞生文化巨作。


    同样道理，动物学家们在这些孤岛上还发现了啮齿类动物体型变大的趋势，那就是因为没有强有力的捕食者。所以一个文化孤岛上，那些制造劣质内容的人反而有更好的生存环境。文化氛围影响着每一个参与其中的人，文化内容劣质化，畸形巨型化就是这种封闭环境的最
    终形态。如果这种封闭锁一直加强，也许2010年以后出生的孩子长到20多岁还不知道Google和Facebook，那就糟糕了。


    说回谣言，微信官方起码还是可以在平台上更有作为的，比如进行更严格的流量审核制度，利用深度学习识别谣言特征，甚至可以给受害者提供法律援助和诉讼援助，这相当于人为的增加了一种生存竞争压力，让硕鼠们很难长大。


