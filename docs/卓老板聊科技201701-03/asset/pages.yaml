    1月4日晚，谷歌Deepmind发出公告，宣布Master就是升级之后的阿尔法Go。同时，将战局锁定在了60胜0负上，并告知人类棋坛，阿尔法Go将休战一段时间，继续优化进步。等它再修炼出山的时候，不知道会厉害成什么样子。李世石，很可能是这个世界上，唯一一个战胜过阿尔法Go的人类棋手。


