  md: '# 讨论：比喻的害处


    风拂水漾：卓老板，这不正是可以证明中医的“固本培元”理论，只有自身处于平衡强健“虚邪”才不得入体吗？


    比喻的害处


    最近有听众在咱们早期关于抗生素和人体健康的节目内容下留言，他是这么说的，“卓老板，这不是正好可以证明中医的‘固本培元’理论，只有自身处于平衡强健，“虚邪”才不得入体嘛”。大家知道我是非常不认同中医理论的，选条这留言并不是要说中医怎样怎样，只是这条留言让我想起了一个有意思的话题，叫做比喻的害处。为什么想到这个呢，因为前一阵子我花了3个小时看了饶毅和朱冰在北大的公开辩论，主题是：表观遗传学及其在细胞命运决定中的作用。题目有点很逗哈，表观遗传指的就是那些不是由DNA变异而导致的可以遗传给后代的遗传现象。我曾在吸烟有毒健康的内容里说过一次，DNA序列没变，但是常年吸烟导致了1/3的基因甲基化了，甲基化就是表观遗传的一种机制。


    这论题简单来说，就是两个人辩论表观遗传对细胞的命运起到辅助作用呢，还是决定性作用呢？饶毅是大科学家，朱冰是后起之秀，估计20年后也能成为饶毅那样的科学家。他们争论的内容对非生物专业的人来说大都是天书一样，中间涉及太多人名、实验名、缩写之类的，但我一场听下来之后，对比喻的应用触最最多。你仔细读一读辩论题目就能发现，题目是什么什么什么在细胞命运决定中的作用，在外人看来，题目中其实已经蕴含了一个借喻，那就是细胞命运，借喻就是比喻的一种手法嘛，其实这是一个生物学的专有名词Cell
    Fate，所以饶毅开始就注意到了这个问题，把细胞命运先划定了范围，经典的定义就是细胞发育成某种特定类型细胞的过程，最近新进展中命运也应该包括细胞死亡和重编程。


    咳，在我看来辩论中第一个地雷就算标出来了。因为有太多的辩论题目都是含义模糊的，不适合辩论。饶毅的观点表达完毕后，朱冰上来了，朱冰一看就是有丰富辩论经验的，但是他为了强调表观遗传的重要性，用了非常多的比喻，比如，他说表观遗传和转入因子对细胞的命运就像五官争功一样，少了哪个都不行。还用摘了眼镜就看不到黑板上的字和根本就没有眼睛才看不到黑板上的字，用两个对应的状态来比喻表观遗传和转入因子。还举了四个个人打麻将，三缺一，最后一个人来牌就有可能打开了，但是没有前面3个人先到场，最后一个人来也沒用，这样来比喻表观遗传对细胞命运的决定性。还用了方向盘比喻表观遗传，用发动机比喻转入因子。整场下来，可能前后用了10多中比喻。


    各位听了朱冰的那些比喻可能觉得，那些涉及生物的知识我不懂，但打麻将三缺一，戴眼镜看东西更清楚，五官争功，这些我能听懂。但我要说的是，这些比喻在要弄清一个具体问题时是有害的，比喻并没有加深细节的描述，那些比喻仍然只能停留在，方向盘对方向起作用，发动机对行驶起作用；只停留在三缺一时最后一个来才可能打；只局限在眼睛的存在比眼镜更重要等，这些比喻的事物身上。在比喻中逻辑关系的成立99%是不能嫁接在被比喻的事物身上的。因为在分子生物的具体细节上，不是表观因子先到还是转入因子先到，这个过程，也不是方向盘和发动机的连接关系。饶毅反复让朱冰给出一个真实的例子，就是一个细胞经过表观因子的修饰变成<|start|>了另一类细胞，或者干脆什么都不变，自己凋亡了之类的例子，但朱冰始终没有给出案。


    那么翻过头再说这位听众留的评论：中医的固本培元，虚邪不能入体。你再反复读这句话，固本培元，因为古汉语的表达习惯，导致了连动词“固”都有很多种解释，然后就是“本”，严格来说“本”是一种借喻，培元的“元”也是一种借喻，具体把什么东西比喻成“本”和“元”，肯定每个中医有每个中医的解释，但编码在涉及如何处理体内微生物的知识细节上，我们就不该碰比喻，更何况在中医文化中，不但用了比喻，而且其中每个字都是千人千面的解释。虚邪也一样是比喻的手法，在可以验证的知识细节上，应该采取的态度就是，直接讨论你研究的对象，直接说细节，比喻手法是多余甚至是有害的。


    当然，我不是全面否定比喻，因为至少我自己就很多次在节目里用比喻这个工具，对于另一方很难理解的情况下，可以用比喻搭个桥，让不懂的人感受到事物间那种隐藏的逻辑关系，这时候用一下是有价值的。但是在真对真、硬碰硬、实打实的讨论中，出现了一个又一个的比喻是有害的。这个话题不知道大家怎么看，如果想感受一下，可以在搜索朱冰、饶毅、辩论这些关键词找到现场视频，同时也希望大家把对比喻用法的讨论留在1917小组里。


