    如果用这个比，大约就是天文数字，30万倍。


    这方面谷歌没有给出具体答案，但是谷歌给出了一个侧面的信息，就是每场棋局要花3000美元电费。按10美分一度电算，这就是3万度的能量消耗，一盘棋按4个小时算的。


    咱们再来算人这边的，正常成年人日均消耗2000大卡的热量，大脑要占其中的20%，这个咱们节目里反复说过，那就是167万焦耳热量。然后除以一天86400秒，算完，人脑的能耗就是19瓦，但是李世石在拼命思考，所以还往上抬，但是大脑的总体能耗在睡眠和清醒时浮动不是很大，我们就按20瓦算。


    计算完成，AlphaGo的能耗是李世石大脑的37万倍。


    但是这里肯定还有其他耗能，比如这套超级计算机的水冷系统、风扇以及维护系统运行的其他部件，比如主板、存储系统、网络系统的运行，供电上的转化效率等也在耗能，所以还有一个参考就是谷歌给出的AlphaGo的配置。


    跟李世石大战的那个Alphago的配置是1200个核心CPU+170个GPU，我们大约就每个CPU功耗150瓦算，每个GPU功耗200瓦算，这就是21.4万瓦。用这个数字除以人类大脑的功耗20瓦，倍数就是10700倍，虽然没有30万那么夸张，但是还是差了4个数量级的。


    这是人类最顶尖的精英在这方面和计算机的挑战比例。


    如果对比更一般的情况，一颗8核心16线程的CPU，肯定可以在各种棋类运动中搞定99%的人，而这样的CPU才150瓦，所以仅仅在棋类运动上，计算机的耗能效率可以做到只是人类大脑的7倍多。


    当然，人类大脑还可以干更多的事情，相当多的方面计算机都没有成熟的算法，这些维度如果也一并算入，那人工智能还是完败，输得跟渣一样。


    这些方面的对比就不继续了，我们倒是可以留意一下，要搞定在围棋上人类最顶尖的人物需要的耗能和搞定99%的普通人需要耗能的对比，这之间差了1400多倍。


    也就是说我们普通人在围棋上的实力和李世石差了这么多，你也可以多少体会到职业和业余之间的差距了吧。术业有专攻就会造成这样大的差距。


    我觉得研究脑科学，像围棋九段这类棋手的大脑结构是一个很好的例子，他们是如何在耗能基本不变的情况下把计算效率提升了1000多倍的？


    这是由神经元连接结构产生的差异吗，这样差异可以遗传吗，可以通过一种超级高效的训练方法让大脑自组织生成这样的连接吗？


    我还忍不住想，现有的医学证据中得到的结论，除非发生了脑部疾病，比如脑膜炎，大脑的功率即使是处于深度思考，也和平常放松状态时是差不多功耗。人们在深度思考的时候，脑部出现了怎样的变化？而这种变化显然和功耗无关，也许这些都是脑科学家们正在研究的范畴。


