    |---|---|---|

    | w_D | Cov(r_D, r_D) | Cov(r_D, r_E) |

    | w_E | Cov(r_E, r_D) | Cov(r_E, r_E) |


    B. Border-multiplied Covariance Matrix

    | Portfolio Weights | w_D | w_E |

    |---|---|---|

