    +   （3）通过合理确定国债规模，吸纳部分社会资金，列入中央预算，转作政府的集中性投资，用于能源、交通的重点建设。

    +   （4）调整和改革整个税制体系，或者调整部分主要税制，以实现对收入分配的调节。'
