- pgno: 147
  md: '# 4.1 风险与风险厌恶


    # 4.1.1 风险、投机与赌博


    **风险：** 不确定性


    **投机：** 承担一定风险(**considerable risk**)，获取相应报酬(**commensurate return**)


    **赌博：** 为一不确定结果下注


    **赌博与投机的关键区别：** 赌博没有相应报酬'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 4.1.2 风险厌恶与效用价值


    +   - 如果证券A可以无风险的获得回报率为10%，而证券B以50%的概率获得120%的收益，50%的概率的收益为-100%，你将用全部资金1000万元投资于哪一种证券？

    +   - 对于一个风险规避的投资者，虽然证券B的期望收益为10%，但它具有风险，而证券A的无风险收益为10%，显然证券A优于证券B。

    +   - 结论：风险厌恶型的投资者会放弃公平博弈(fair play)或更糟的投资组合。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 投资者的风险态度


    +   - 风险厌恶(Risk aversion)

    +   - 风险中性(Risk neutral)

    +   - 风险爱好(Risk lover)'
  merge: -1
  img_proc: true
- pgno: 150
  md: '+   - 从风险厌恶型投资来看，收益带给他正的效用，而风险带给他负的效用，或者理解为一种负效用的商品。

    +   - 根据微观经济学的无差异曲线，若给一个消费者更多的负效用商品，且要保证他的效用不变，则只有增加正效用的商品。

    +   - 根据均方准则，若均值不变，而方差减少，或者方差不变，但均值增加，则投资者获得更高的效用，此即风险厌恶者的无差异曲线。'
  merge: -1
  img_proc: true
