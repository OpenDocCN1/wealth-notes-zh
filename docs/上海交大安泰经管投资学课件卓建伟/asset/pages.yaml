- pgno: 221
  md: '# 7.4.3 分散化的力量


    n项资产组合的方差： σ_P² = Σ_{j=1}^n Σ_{i=1}^n w_i w_j Cov(r_i, r_j)


    不妨设： w_i = 1/n, i = 1,2,⋯,n


    则有： σ_P² = 1/n² Σ_{i=1}^n σ_i² + 1/n² Σ_{j=1}^n Σ_{i=1, j≠i}^n Cov(r_i, r_j)


    定义： σ̄² = 1/n Σ_{i=1}^n σ_i², Cov̄ = 1/[n(n-1)] Σ_{j=1}^n Σ_{i=1, j≠i}^n Cov(r_i,
    r_j)


    ⇒ σ_P² = 1/n σ̄² + (n-1)/n Cov̄


    当 n → ∞ 时，有： σ_P² → Cov̄'
  merge: -1
  img_proc: true
