- pgno: 4
  md: '# 投资学（Investments）：


    研究投资行为及均衡定价的科学。


    +   - 微观金融学(finance)

    +     - 包括公司金融、投资学、证券市场微观结构

    +   - 宏观金融学(macro-finance)

    +     - 包括货币银行学、国际收支理论、金融体系稳定性研究、微观金融学的自然延伸。

    +   - 交叉学科

    +     - Financial Engineering；Law and Finance'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 二、学科地位


    作为一门学问，投资学就是对投资进行系统研究，从而更科学地进行投资活动。本投资学主要研究证券投资。旨在培养具备当代世界政治、经济视野，了解中国证券投资生态，能够胜任在银行、证券公司、保险公司、投资公司、投资咨询公司、资产管理公司、基金管理公司及信托公司等金融机构从事投资管理、投资咨询工作的高素质的投资专门人才。投资学不仅要学习经济学的基础知识，更要有扎实的专业知识基础做后盾。既要熟悉宏观的投资政策背景，又要精通各种投资的微观技巧。'
  merge: -1
  img_proc: true
- pgno: 6
