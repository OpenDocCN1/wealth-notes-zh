- pgno: 187
  md: '设某一风险资产组合P由长期债券组合D和股票基金E组成

    则有：$E(r_P)=w_D E(r_D)+w_E E(r_E)$

    $\sigma_P^2 = w_D^2 \sigma_D^2 + w_E^2 \sigma_E^2 + 2 w_D w_E Cov(r_D, r_E)$

    又：$Cov(r_D, r_E)=\rho_{DE} \sigma_D \sigma_E$

    $\Rightarrow \sigma_P^2 = w_D^2 \sigma_D^2 + w_E^2 \sigma_E^2 + 2 w_D w_E \sigma_D
    \sigma_E \rho_{DE}$

    $\because -1 \le \rho_{DE} \le 1$

    $\therefore \rho$越大，组合P的方差越大'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# Two-Security Portfolio: Risk Continued


    +   - Another way to express variance of the portfolio:

    +     σ²_P = w_D w_D Cov(r_D, r_D) + w_E w_E Cov(r_E, r_E) + 2 w_D w_E Cov(r_D,
    r_E)


    电子表格计算依据'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# 协方差


    Cov(r_D, r_E) = ρ_DE σ_D σ_E


    ρ_D,E = Correlation coefficient of returns


    σ_D = Standard deviation of returns for Security D


    σ_E = Standard deviation of returns for Security E'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# Correlation Coefficients: Possible Values


    # Range of values for ρ₁,₂


    + 1.0 ≥ ρ ≥ -1.0


    If ρ = 1.0, the securities would be perfectly positively correlated


    If ρ = - 1.0, the securities would be perfectly negatively correlated'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 特例一：


    若 ρ_DE = 1,

    则有： σ_P² = (w_D σ_D + w_E σ_E)²

    即： σ_P = w_D σ_D + w_E σ_E

    结论： ρ = 1 时组合 P 的风险并未降低'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 特例二：


    若 $\rho_{DE}=-1$，


    则有：$\sigma_P^2=(w_D\sigma_D-w_E\sigma_E)^2$


    即：$\sigma_P=|w_D\sigma_D-w_E\sigma_E|$


    令 $w_D\sigma_D-w_E\sigma_E=0$


    $\Rightarrow w_D=\frac{\sigma_E}{\sigma_D+\sigma_E},\;w_E=1-w_D=\frac{\sigma_D}{\sigma_D+\sigma_E}$


    结论：$\rho=-1$时组合 $P$ 的风险可降至零


    ![](img/55da7dc2df4a6500ba1969b246646278_192_0.png)'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 正常情况：


    若−1 < ρ_DE < 1,

    则有：σ_P < |w_D σ_D + w_E σ_E|

    结论:|ρ| < 1时组合P的风险可有一定程度降低'
  merge: -1
  img_proc: true
