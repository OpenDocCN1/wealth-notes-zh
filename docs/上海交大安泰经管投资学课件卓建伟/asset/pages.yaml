- pgno: 106
  md: '# 税收与实际利率


    +   - 税赋是基于名义收入的支出

    +     - 假设税率为 (t)，名义利率为 (R)，则税后实际利率是：

    +       $R(1-t)-i = (r+i)(1-t)-i = r(1-t)-it$

    +   - 税后实际利率随着通货膨胀率的上升而下降。'
  merge: -1
