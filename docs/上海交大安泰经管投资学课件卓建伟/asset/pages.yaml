- pgno: 95
  md: '+   - 例1：某个交易日某投资者以10000元认购某基金，费率为1%，前端收费。次日，确定前一个交易日该基金单位净值为0.99元。请确定该投资者认购基金的份额数量。

    +   - 申购日：认购费用=10000×1%=100（元）

    +   - 申购日：认购金额=10000−100=9900（元）

    +   - 次日：认购份数=9900/0.99=10000（份）'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 份额赎回：


    +   - 投资者目的要知道能赎回多少资金，但赎回的时候价格未知，所以投资者只能申请赎回多少份额。

    +   - 赎回日：提出赎回数量

    +   - 次日：赎回金额＝赎回总额－赎回费用，其中：

    +     - 赎回总额＝赎回数量×赎回日基金单位净值

    +     - 赎回费用＝赎回总额×赎回费率'
