- pgno: 84
  md: '# 延时交易和市场择时


    +   - 延时交易 – 是指收市且资产定价已经确定之后接受买入指令或卖出指令的行为。

    +   - 市场择时 – 快进快出，允许以逾期资产净值的价格交易。

    +   - 净效应是将价值从普通股持有者手中转移到拥有特权的交易者手中。

    +   - 共同基金的这种不正当交易行为受到了处罚。新法规的实施制止了这种非法行为。'
