- pgno: 14
  md: '# 三类：


    +   1. 固定收益型或债务型证券

    +   2. 普通股或权益型证券

    +   3. 衍生证券'
  merge: -1
  img_proc: true
- pgno: 15
  md: '+   - 承诺支付固定的收益流，或按某一特定的公式计算的现金流。

    +   - 货币市场上的债务型证券：期限短、流动性强且风险小

    +   - 资本市场上的固定收益型证券：长期证券，这些证券有的违约风险较低相对比较安全，有的风险相对较高。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '+   - 普通股证券代表了证券持有者对公司的权益或所有权。

    +     - 证券持有者的收益并不固定, 权益投资的绩效取决于公司运营的成功。

    +   - 衍生证券

    +     - 其收益取决于其他资产（股票和债券）的价格。

    +     - 通常用来规避风险。'
  merge: -1
  img_proc: true
