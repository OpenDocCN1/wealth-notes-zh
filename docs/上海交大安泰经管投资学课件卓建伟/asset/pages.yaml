  md: '# （二）行业集中


    行业集中包括两个方面的含义：一个是指骨干企业规模的扩大即行业的绝对集中；另一个是指骨干企业在整个行业规模中的比重增大，即行业的相对集中。


    1. 行业绝对集中的衡量指标，它既要考虑行业内企业个数的多少，又要考虑行业内企业的大小分布。设某行业有n个企业，各企业产量为Xi，行业总产量为∑Xi，第i个企业的市场占有份额为Si，即Xi/∑Xi，则有以下主要绝对集中衡量指标。


    +   （1）企业数的倒数。1/n

    +   （2）集中比。最大r个企业所占市场份额。'
