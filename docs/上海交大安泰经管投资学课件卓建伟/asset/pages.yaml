  md: '# 表24.3的解释


    +   - 如果 P 或 Q 代表了所有的投资基金，Q 更好，因为 Q 具有更高的夏普值和更大的 M2 测度。

    +   - 当 P 和 Q 只是所有投资中的一部分时，Q 也更胜一筹，因为它有更高的特雷诺测度。

    +   - 我们如果将积极投资组合与消极的指数投资相结合，由于 P 的信息比率较高，P 要优于 Q。'
