- pgno: 484
  md: '# 贡献公式


    r_B = Σ_{i=1}^{n} w_{Bi} r_{Bi} & r_p = Σ_{i=1}^{n} w_{pi} r_{pi}


    r_p - r_B = Σ_{i=1}^{n} w_{pi} r_{pi} - Σ_{i=1}^{n} w_{Bi} r_{Bi} =


    Σ_{i=1}^{n} (w_{pi} r_{pi} - w_{Bi} r_{Bi})


    这里B是资产组合的基准收益，是管理投资组合。'
  merge: -1
  img_proc: true
