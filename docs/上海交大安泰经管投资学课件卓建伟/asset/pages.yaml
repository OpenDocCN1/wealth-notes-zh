- pgno: 290
  md: '# 证券市场线与证券均衡定价


    +   - 前述分析是针对单个证券，在市场均衡时得到的SML；同样可以证明，在市场均衡时：

    +     - 由单个证券构成的任一证券组合P位于SML上；

    +     - 由无风险资产与市场证券组合构成的有效投资组合也位于SML上。


    +   - SML实际上揭示了市场上所有风险性资产的均衡期望收益率与风险之间的替代关系。

    +     - 这些风险资产包括单个证券、无效证券组合以及有效证券组合。

    +     - 即每一种证券或证券组合，无论它们是否有效，都将位于SML上。'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# CML和SML的区别


    +   - CML和SML都描述了风险资产均衡期望收益率与风险之间的关系，但明显两者明显存在区别。

    +     - 度量风险的指标不同

    +       - SML用协方差或β值测度风险

    +       - CML用标准差测度风险

    +     - CML只描述有效投资组合如何均衡地被定价，而SML描述了所有风险资产（包括无效组合与有效组合）如何均衡地被定价；

    +     - 有效投资组合既位于资本市场线上，同时也位于证券市场线上；而单个证券与无效投资组合只位于证券市场线上；'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# CAPM的理论意义


    +   - 决定个别证券或投资组合的预期收益率及系统风险，是证券估价和资产组合业绩评估的基础；

    +   - 用来评价证券的相对吸引力；

    +   - 用以指导投资者的证券组合：

    +     - 消极的投资组合。选择一种或几种无风险证券与风险证券构成组合；

    +     - 积极的投资组合。投资者必须充分考虑证券实际价格是否被高估或低估，从而选择有吸引力的证券构建证券组合。同时还应根据市场的趋势调整资产组合。

    +       - 当预测到市场价格呈上升趋势时，可增加高β值证券的持有量；

    +       - 当市场价格呈下降趋势时，则应减少高β值证券的持有量。'
  merge: -1
  img_proc: true
- pgno: 293
  md: "# 证券均衡定价\n\n+   - SML为我们提供了一种方便地判断证券是否合理定价的标准。  \n+     - “合理定价”的证券一定位于SML上；\
    \  \n+     - “错误定价”的证券则分布在SML上方或下方。\n\n+   - 证券实际期望收益率与均衡期望收益率之间的差额称为证券的α值。  \n\
    +     - 根据α值的正负及大小，可以判断证券是否定价合理以及定价偏离的程度。  \n+     - α > 0，证券定价偏低；  \n+     -\
    \ α < 0，证券定价偏高；  \n+     - α的绝对值越大，证券定价越不合理。"
  merge: -1
  img_proc: true
