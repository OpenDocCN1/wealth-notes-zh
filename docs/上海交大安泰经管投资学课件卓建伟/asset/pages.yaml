- pgno: 295
  md: '# 证券均衡定价


    # – 为什么会出现证券定价不合理现象？


    +   - 交易成本的存在。使得投资者不能积极地交易采取措施以纠正证券与SML所发生的微小偏差。因为这时调整组合的成本可能等于甚至高于由此而带来的收益；

    +   - 资本利得税的存在。可能阻碍投资者买卖证券实现利润的行为。因为账面上的资本增值不需要支付税金，一旦抛售证券使其转化为资本利得，则应该纳税；

    +   - 不完全信息会影响证券的估价。如果投资者的信息不够完全，他可能无法观察到错误估价的证券，从而也就不可能通过交易来消除错误的估价。'
  merge: -1
  img_proc: true
