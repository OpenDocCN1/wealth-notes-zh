- pgno: 271
  md: "# 分离定律（Separation Theorem）\n\n+   • 当用风险资产与无风险资产进行组合时，所有投资者都会选择相同的风险资产组合，然后将它与无风险资产进一步进行组合。\n\
    +   \n+   • 投资者的整个最优选择过程可以总结为如下两个步骤：\n+     (1) 寻找合适的风险资产组合，这时不必考虑投资者效用的无差异曲线；\n\
    +     (2) 确定风险资产与无风险资产的投资比例，这时必须结合投资者的无差异曲线。\n\n![](img/55da7dc2df4a6500ba1969b246646278_271_0.png)"
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 分离定律（Separation Theorem）


    +   - 分离定律的意义

    +     - 所谓分离定理，指的是投资者在进行风险资产与无风险资产组合的选择时，可以按上述两个步骤进行。这意味着投资者的收益与风险偏好与其风险资产组合的最优构成无关。

    +     - 分离定理由托宾(J. Tobin)于1958年建立，它告诉我们，无论投资者是保守型的，还是敢于冒风险的，在他们选择的投资组合中，都应当持有或多或少的风险资产——最优风险资产组合。'
  merge: -1
  img_proc: true
- pgno: 273
  md: '# 市场证券组合


    +   - 市场均衡时最优风险证券组合T的特征

    +     - 根据分离定理，切点证券组合T就是最优风险证券组合。无论投资者的偏好如何，在他们选择的最优投资组合中，都包含最优风险证券组合T。

    +     - 在市场均衡时，最优风险证券组合T具有以下特征：

    +       - T中必须包含市场上所有风险证券；

    +       - T中不可能包含负比例的证券；

    +       - T中各证券的资金分配比例必等于各证券总市值与全部证券总市值之比。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '# 市场证券组合


    +   - 市场证券组合（M）的含义

    +     - 将由市场上所有证券组成，并且各证券组合权数与证券的相对市场价值一致的证券组合称为市场证券组合（M）；

    +     - 在市场均衡状态下，最优风险证券组合T与市场证券组合M一致，投资者选择市场证券组合就等价于选择了最优风险证券组合；

    +     - 在现实中，一般用市场上某种指数所对应的证券组合作为市场组合的近似替代。

    +     - 总市值变动与个别公司市值变动的解释（IPO，存量资金，漂亮50和要命3000，炒地图等）'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# 资本市场线（Capital Market Line）


    +   - 资本市场线（CML）方程的推导


    $$E(R_p)=wR_f+(1-w)E(R_M) \tag{1}$$


    $$\sigma_p^2=w^2\sigma_f^2+(1-w)^2\sigma_M^2+2w(1-w)\rho\sigma_f\sigma_M=(1-w)^2\sigma_M^2$$


    $$\sigma_p=(1-w)\sigma_M \tag{2}$$


    $w$－投资者在组合P中无风险证券的投资比例


    $w<0$，表示投资者卖空无风险资产


    $R_f,\sigma_f$－无风险资产的收益率和标准差，显然 $\sigma_f=0$


    $R_M,\sigma_M$－风险资产组合M的预期收益率和标准差


    $\rho$－为无风险资产和市场组合M的相关系数（假设为0）


    ![](img/55da7dc2df4a6500ba1969b246646278_275_0.png)'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# 资本市场线（Capital Market Line）


    +   - 资本市场线（CML）方程的推导


    E(R_p) = w R_f + (1 - w) R_M  (1)

    σ_p = (1 - w) σ_M  (2)

    将方程（1）、（2）联立可得

    E(R_p) = R_f + [E(R_M) - R_f] / σ_M · σ_P'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 资本市场线（CML）


    +   - CML的实质就是在允许无风险借贷下的新的有效边界，它反映了当资本市场达到均衡时，投资者将资金在市场组合和无风险资产之间进行分配，从而得到所有有效组合的预期收益和风险的关系。

    +   - 位于CML上的组合提供了最高单位的风险回报率。

    +   - CML指出了用标准差表示的有效投资组合的风险与回报率之间的关系是一种线性关系。


