  md: '# 债券交易


    +   - 债券交易商之间的债券交易大多发生在场外交易市场。

    +   - 许多债券发行市场都很小。

    +   - 纽约证券交易所将其债券交易系统的交易范围进行了扩大。

    +     - 纽约证券交易所债券系统是美国所有交易所中最大的集中化债券市场。'
