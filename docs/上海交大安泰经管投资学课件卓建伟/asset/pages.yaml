    | w_E | w_E w_D Cov(r_E, r_D) | w_E w_E Cov(r_E, r_E) |

    | w_D + w_E = 1 | w_D w_D Cov(r_D, r_D) + w_E w_D Cov(r_E, r_D) | w_D w_E Cov(r_D,
    r_E) + w_E w_E Cov(r_E, r_E) |

    | Portfolio variance | w_D w_D Cov(r_D, r_D) + w_E w_D Cov(r_E, r_D) + w_D w_E
    Cov(r_D, r_E) + w_E w_E Cov(r_E, r_E) |'
