  md: '# 造成行业零散的原因主要有：


    +   1. 进入壁垒低；

    +   2. 不存在规模经济或经验曲线；

    +   3. 高运输成本；

    +   4. 高库存成本或不稳定的销售；

    +   5. 多种市场需求；

    +   6. 高度的产品歧异化；

    +   7. 退出壁垒高；

    +   8. 地方法规或政府禁止；

    +   9. 新行业。


    如果一个零散的行业变成一个集聚的行业，那么必然会产生一家或几家在行业中占据绝对优势的企业，这就蕴含着巨大的投资机会。'
