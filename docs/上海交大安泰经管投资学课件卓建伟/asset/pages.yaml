- pgno: 97
  md: '• 例2：某投资者以10000元申购某基金，申购日该基金单位净值为1元，申购费率为5%。且规定赎回费率为3%，每年递减1%。假设该基金扣除运作费用后年净收益率为10%（且等于赎回日的净值）。

    问题：投资者在持有1年后申请全部赎回，能赎回多少资金？

    申购净额＝10000×0.95＝9500（元）

    申购份数＝9500/1＝9500（份）

    赎回总额＝9500×（1＋10%）＝10450（元）

    赎回费用＝10450×2%＝209（元）

    赎回金额＝10450－209＝10241（元）'
