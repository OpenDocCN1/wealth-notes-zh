- pgno: 297
  md: '# 9.2.2 指数模型和已实现收益


    R_i = α_i + β_i R_M + e_i

    Cov(R_i, R_M) = Cov(β_i R_M + e_i, R_M)

    = β_i Cov(R_M, R_M) + Cov(e_i, R_M) = β_i σ_M²

    ⇒ β_i = Cov(R_i, R_M) / σ_M²

    即指数模型得到了与CAPM一样表达式的贝塔。'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# 9.2.3 市场指数模型和期望收益-贝塔关系


    比较CAPM： E(r_i) − r_f = β_i [E(r_M) − r_f]


    与指数模型的期望形式：

    E(r_i) − r_f = α_i + β_i [E(r_M) − r_f]


    可知二者差别在于，CAPM认为所有的α_i都为0。


    市场模型： r_i − E(r_i) = β_i [r_M − E(r_M)] + e_i


    如果CAPM有效，则市场模型等同于指数模型。'
  merge: -1
  img_proc: true
