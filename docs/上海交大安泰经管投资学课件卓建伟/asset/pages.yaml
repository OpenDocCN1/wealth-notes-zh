- pgno: 94
  md: '# 金额申购：


    +   - 由于申购时，基金资产净值未知，故确切的购买数量在申购的时候未知，只能实行金额申购。

    +   - 计算方法

    +     - 申购日：净申购额＝申购金额－申购金额×申购费率

    +     - 次日：申购份额＝净申购额/申购日基金单位净值'
  merge: -1
