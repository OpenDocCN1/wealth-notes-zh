- pgno: 280
  md: '# 9.1.4 单个证券的期望收益


    市场组合M的收益率： $r_M = \sum_{k=1}^{n} w_k r_k$


    则通用电气(GE)与市场组合的协方差为：


    $Cov(r_{GE}, r_M) = Cov\left(r_{GE}, \sum_{k=1}^{n} w_k r_k\right) = \sum_{k=1}^{n}
    w_k Cov(r_{GE}, r_k)$


    则通用对市场组合的风险贡献为： $w_{GE} Cov(r_{GE}, r_M)$


    又风险溢价贡献为： $w_{GE}[E(r_{GE}) - r_f]$


    则其收益-风险比率为：


    $\frac{w_{GE}[E(r_{GE}) - r_f]}{w_{GE} Cov(r_{GE}, r_M)} = \frac{E(r_{GE}) - r_f}{Cov(r_{GE},
    r_M)}$'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# 9.1.4 单个证券的期望收益


    市场组合M与CML相切，其收益风险比率为：


    E(r_M) - r_f / σ²_M (风险的市场价格)


    则均衡时，存在：E(r_GE) - r_f / Cov(r_GE, r_M) = E(r_M) - r_f / σ²_M


    ⇒ E(r_GE) - r_f = Cov(r_GE, r_M) / σ²_M [E(r_M) - r_f]


    令：β_GE = Cov(r_GE, r_M) / σ²_M ⇒ E(r_GE) - r_f = β_GE [E(r_M) - r_f]'
  merge: -1
