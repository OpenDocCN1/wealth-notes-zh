- pgno: 379
  md: '# 17.5 行业分析


    单个企业的命运总是和它所从事行业的命运息息相关，因而深入的行业分析是证券分析取得成功的先决条件。行业是指一个企业群体，在这个企业群体中，各成员企业由于其产品（包括有形与无形）在很大程度上的可相互替代性而处于一种彼此紧密联系的状态，并且由于产品可替代性的差异而与其他企业群体相区别。'
  merge: -1
  img_proc: true
- pgno: 380
  md: '# 17.5.1 行业分类


    （一）按行业生命周期分类


    行业生命周期是最常用的划分依据，它能够反映出一个行业发展历程。在这种方式下，行业被从始到终划分为初创期、成长期、成熟期和衰退期4个阶段。


    +   > 初创期是行业生命周期中风险最大的阶段。初创期的行业正在努力为它的产品建立市场，对流动资金和固定资产有大量的需求，但经营仍处在亏损阶段或只是稍有盈利。'
  merge: -1
  img_proc: true
- pgno: 381
  md: '+   > 第二阶段是成长期。典型的成长期行业都能刺激出消费者尚未意识到的产品需求。成长期的企业能够脱离经济周期的影响而独立趋向繁荣。

    +   > 成熟阶段是行业发展的巅峰阶段。在这一时期，通过激烈的市场竞争和优胜劣汰而生存下来的少数大厂商基本上垄断了整个行业的市场，每个厂商都占有一定比例的市场份额，由于彼此势均力敌，市场份额比例发生变化的程度较小，因此，成熟阶段也是行业发展的稳定阶段。

    +   > 生命周期最后一个阶段是衰退期。该阶段行业产品的需求稳步下降，剩余的竞争者在缩小的市场上相互争夺，销售下降，价格下跌，利润降低。'
  merge: -1
  img_proc: true
