  md: '# 4.4 单一风险资产与单一无风险资产的资产组合


    记风险资产组合P的期望收益率为E(r_P),标准差为σ_P,


    无风险资产组合F的收益率为r_f,


    则由y份风险资产和(1−y)份无风险资产组成的新组合C：


    E(r_C) = yE(r_P) + (1−y)r_f = r_f + y[E(r_P)−r_f]


    σ_C = yσ_P


    ⇒ E(r_C) = r_f + [E(r_P)−r_f]/σ_P σ_C


    由该式得到图6-4可行投资组合(investment opportunity set)'
