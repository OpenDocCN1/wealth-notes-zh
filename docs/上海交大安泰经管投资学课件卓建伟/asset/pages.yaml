- pgno: 230
  md: "# 单因素模型\n\n$r_i = E(r_i) + \\beta_i m + e_i$\n\n$\\beta_i$ 表示证券的系统性风险。$\\beta$\
    \ 表示系统风险。  \n$m$ 是影响所有证券收益的宏观经济变量。标准普尔500指数通常被作为$m$的代表。  \n$e_i$ 衡量特定公司的不确定性"
  merge: -1
  img_proc: true
- pgno: 231
  md: "# 收益分布的正态性和系统风险\n\n+   - 假设某一宏观因素影响着整个证券市场，除此外，公司所有剩余的不确定性都是公司特有的，则证券持有期收益为：\n\
    +   \n+     $r_i = E(r_i) + m_i + e_i$\n+   \n+     其中 $E(r_i)$ 为基于可得信息的期望收益\n\
    +   \n+     $m_i$ 为未预期到的宏观事件的影响\n+   \n+     $e_i$ 为未预期到的公司特有事件的影响\n+   \n+  \
    \   于是：$E(m_i)=0, E(e_i)=0, \\sigma_i^2 = \\sigma_m^2 + \\sigma^2(e_i)$\n+   \n\
    +     $Cov(r_i, r_j) = Cov(m + e_i, m + e_j) = \\sigma_m^2$"
  merge: -1
  img_proc: true
- pgno: 232
  md: '# 单因素模型


    进一步的，


    考虑不同企业对宏观经济事件有不同的敏感度，

    证券 $i$ 对宏观经济事件的敏感度为 $\beta_i$，

    则证券 $i$ 的宏观成分 $\beta_i m_t$，

    并有：$r_i = E(r_i) + \beta_i m + e_i$

    此即单因素模型（single factor model）


    并有：$\sigma_i^2 = \beta_i^2\sigma_m^2 + \sigma^2(e_i)$


    $Cov(r_i,r_j)=Cov(\beta_i m+e_i,\beta_j m+e_j)=\beta_i\beta_j\sigma_m^2$'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# # 单指数模型


    假如将市场指数视为宏观因素的有效代表，则有单指数模型(single index model):


    $r_i-r_f=\alpha_i+\beta_i(r_M-r_f)+e_i$


    令：$R_i\equiv r_i-r_f,\ R_M\equiv r_M-r_f$


    $\Rightarrow R_i(t)=\alpha_i+\beta_iR_M(t)+e_i$'
  merge: -1
