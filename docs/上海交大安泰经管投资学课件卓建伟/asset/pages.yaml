  md: '# 时间加权收益率与美元加权收益率


    # 时间加权收益率


    +   - 几何平均收益率又被称为时间加权收益率。

    +   - 每一期的收益率权重相同。


    $$(1+r_G)^n=(1+r_1)(1+r_2)\cdots(1+r_n)$$'
  merge: -1
  img_proc: true
- pgno: 452
  md: '# 时间加权收益率与美元加权收益率


    # 美元加权收益率


    +   - 考虑向投资组合注入或抽出资金的内部回报率。

    +   - 每一阶段投资收益的加权：


    $$PV = \frac{C_1}{(1+r)^1} + \frac{C_2}{(1+r)^2} + \cdots \frac{C_n}{(1+r)^n}$$'
  merge: -1
  img_proc: true
