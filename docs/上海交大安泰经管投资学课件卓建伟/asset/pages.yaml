- pgno: 215
  md: '# 7.4 马科维茨的资产组合选择模型


    均值-方差（Mean-variance）模型是由Harry Markowitz于1952年建立的，其目的是寻找投资组合的有效边界。通过期望收益和方差来评价组合，投资者是理性的：害怕风险和收益多多益善。


    因此，根据投资组合比较的占优原则，这可以转化为一个优化问题，即


    +   - （1）给定收益的条件下，风险最小化

    +   - （2）给定风险的条件下，收益最大化'
