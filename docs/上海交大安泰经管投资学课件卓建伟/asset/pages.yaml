- pgno: 278
  md: '# 9.1.3 市场组合的风险溢价


    投资者投资于最优资产组合M的比例：


    y = \frac{E(r_M) - r_f}{A \sigma_M^2}


    由于ȳ = 1，


    市场组合的风险溢价为：


    E(r_M) - r_f = \bar{A} \sigma_M^2'
