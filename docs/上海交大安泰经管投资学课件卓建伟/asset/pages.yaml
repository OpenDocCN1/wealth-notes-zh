- pgno: 374
  md: '# 17.4 经济政策分析


    # 17.4.1 货币政策


    中央银行主要通过三大货币政策工具来实现对宏观经济的调控，即存款准备金率、再贴现率和公开市场操作。


    从总体上来说，松的货币政策将使得证券市场价格上扬，紧的货币政策将使证券市场价格下跌。松的货币政策主要体现为货币供应量增加：


    +   （1）为企业生产发展提供充足的资金，利润上升，从而股价上升。

    +   （2）社会总需求增大，刺激生产发展，同时居民收入得到提高，因而对证券投资的需求增加，证券价格上涨。

    +   （3）银行利率随货币供应量增加而下降，部分资金从银行转移出来，流向证券市场也将扩大证券市场的需求；同时利率下降还提高了证券价值的评估。

    +   （4）货币供应量的增加将引发通货膨胀，适度的通货膨胀或通胀初期有利于证券价格上涨，持续的通胀将恶化经济环境，令证券价格下跌。'
  merge: -1
  img_proc: true
- pgno: 375
  md: '# 四 经济政策分析


    # 17.4.2 财政政策


    财政政策是通过财政收入和财政支出的变动来影响宏观经济活动水平的经济政策。财政政策的主要手段有三个：一是改变政府购买水平；二是改变政府转移支付水平；三是改变税率。


    松的财政政策及其对证券市场的影响是：


    +   （1）减少税收，降低税率，扩大减免税范围。

    +   （2）扩大财政支出，加大财政赤字。

    +   （3）减少国债发行。

    +   （4）增加财政补贴。


    紧的财政政策的经济效应正好相反。'
  merge: -1
  img_proc: true
