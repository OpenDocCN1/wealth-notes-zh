- pgno: 359
  md: '# 17.1.2 基本分析的内容


    基本分析方法认为证券的内在价值表现为向投资者提供未来的收益，因而这种方法完全建立在对未来的基本经济要素及其供求关系的预测基础上。基本分析方法认为公司的业绩取决于公司运营的经济环境，取决于各种投入资源的供求价格，取决于公司产品或服务的供求价格。因此，基本分析的内容包括宏观经济、行业和公司三个层次的系统分析。'
  merge: -1
  img_proc: true
- pgno: 360
  md: '# 17.2 宏观政治经济分析


    # 17.2.1 政治因素分析


    政治不但是经济的集中表现，而且还深刻影响着经济。一国的政局是否稳定对证券市场有着直接影响。一般而言，政局稳定则证券市场稳定运行；相反，政局不稳则常常引起证券市场价格下跌。政治因素对证券价格带来的影响往往具有突发性，它们来得突然，变化迅速，很难预测。政治因素包括的内容十分广泛，诸如政府更迭、国内战争、民族冲突、国内罢工、政治丑闻、重要政府官员的更换等。'
  merge: -1
  img_proc: true
- pgno: 361
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 362
  md: '# 二 经济因素分析


    # （一） 国内生产总值变动对证券市场的影响


    GDP是一国经济成就的根本反映，持续上升的GDP表明国民经济良性发展，制约经济的各种矛盾趋于或达到协调，人们有理由对未来经济产生好的预期；相反，如果GDP处于不稳定的非均衡增长状态，暂时的高产出水平并不表明一个“好的经济形势”，不均衡的发展可能激发各种矛盾，从而导致一个大的经济衰退。证券市场作为经济的“晴雨表”，对GDP的变动的反映是敏感而复杂的。


    +   1. 持续、稳定、高速的GDP增长有利于证券市场的持续上升。

    +   2. 高通胀下的GDP增长不利于证券市场。

    +   3. 宏观调控下的GDP减速增长。

    +   4. 转折性的GDP变动。'
  merge: -1
  img_proc: true
- pgno: 363
  md: '# （二）通货膨胀对证券市场的影响


    通货膨胀的原因以及它对经济的影响是一个十分复杂的问题，而政府对通货膨胀进行控制的宏观政策往往只能以一定的代价（比如增加失业率）来实现。


    +   1、通货膨胀对股票市场的影响。

    +   （1）温和的、稳定的通货膨胀对股价的影响较小。

    +   （2）如果通货膨胀在一定的可容忍范围内增长，而经济处于景气（扩张）阶段，产量和就业都持续增长，那么股价也将持续上升。

    +   （3）严重的通货膨胀导致股价下跌。

    +   （4）政府对通货膨胀的干预导致股价下跌。

    +   （5）通货膨胀时期并不是所有股票价格都下跌。

    +   （6）通货膨胀不仅产生经济影响，还可能产生社会影响，并影响公众的心理和预期，从而对股价产生影响。

    +   （7）通货膨胀使各种商品价格具有更大的不确定性。

    +   （8）通货膨胀对企业（公司）的微观影响。'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# 2、通货膨胀对债券市场的影响


    +   （1）通货膨胀提高了对债券收益率的预期，从而引起债券价格下跌。


    +   （2）适度通货膨胀下，人们企图通过投资于债券实现资金保值，从而使债券需求增加，价格上涨。


    +   （3）未预期的通货膨胀增加了企业经营的不确定性，降低了还本付息的保证，从而债券价格下跌。


    +   （4）过度通货膨胀，将使企业经营困难甚至倒闭，同时投资者将资金转移到实物资产的交易上寻求保值，债券需求减少，债券价格下跌。'
  merge: -1
  img_proc: true
- pgno: 365
  md: '# （三）利率对证券市场的影响。


    +   1. 利率上升，公司借款成本增加，利润率下降，股票价格下跌。

    +   2. 利率上升，将使得负债经营的企业经营困难，经营风险增大，从而公司债券和股票价格都将下跌。

    +   3. 利率上升，债券和股票投资机会成本增大，从而价值评估降低，导致价格下跌。

    +   4. 利率上升，吸引部分资金从证券市场转向储蓄，导致证券需求下降，证券价格下跌。

    +   5. 实行保值补贴储蓄政策，大量资金将流向储蓄，证券市场特别是股票市场倍受冷落。'
  merge: -1
  img_proc: true
- pgno: 366
  md: '# （四）关于汇率对证券市场的影响。


    （1）汇率上升，本币贬值，本国产品竞争力强，出口型企业将增加收益，因而企业的股票和债券价格将上涨；相反依赖于进口的企业成本增加，利润受损，股票和债券价格下跌。


    （2）汇率上升，本币贬值，将导致资本流出本国，导致证券价格下跌。


    （3）汇率上升，本币表示的进口商品价格提高，带动国内物价水平上涨，引起通货膨胀，要具体分析。


    （4）汇率上升时，政府可能利用债市与汇市的联动操作，达到既控制汇率的升势，又不减少货币供应量，即抛售外汇，同时回购国债，则将使国债市场价格上扬。'
  merge: -1
  img_proc: true
- pgno: 367
  md: '# 17.3 经济周期分析


    宏观经济周期一般经历四个阶段，即复苏、繁荣、衰退、萧条。证券市场综合了人们对于经济形势的预期，这种预期较全面地反映了有关经济发展过程中表现出的有关信息，特别是经济中人的切身感受，这种预期又必然反映到投资者的投资行为中，从而影响证券市场的价格。'
  merge: -1
  img_proc: true
- pgno: 368
  md: '# 经济周期对投资的影响


    +   - 经济增长由于投资等因素的影响会呈现出周期性的变化。当经济处于经济周期的不同阶段时，不同行业的业绩可能会有很大的差异。

    +   - 一般的说，需求弹性较小的行业对周期的敏感程度较低，需求弹性较大的行业对周期的敏感程度较高。

    +   - 当宏观经济从繁荣步入萧条或衰退时，那些对经济周期敏感程度较低的行业受影响较小，这些行业的公司股票价格的变化相对会较小。那些对经济周期敏感程度较高的行业会受较大的影响，这些行业的公司股票价格的变化会大得多。'
  merge: -1
  img_proc: true
- pgno: 369
  md: '# 经济周期的指标体系


