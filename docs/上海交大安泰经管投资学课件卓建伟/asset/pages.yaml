- pgno: 286
  md: '# 资本资产定价模型（CAPM）


    +   - CML揭示了在资本市场均衡状态下，有效投资组合的期望收益率与风险之间的关系，其中风险是以有效投资组合的标准差来度量的；

    +   - CML方程描述了有效投资组合如何按其风险的大小均衡地被定价的；

    +   - 由于只有有效投资组合位于资本市场线上，单个证券或无效组合分散位于资本市场线下方，因此资本市场线提供的定价关系不适合单个证券及无效组合。

    +   - 对于单个证券及无效组合，需要寻找适合它们的定价关系。CAPM就是寻求任一证券或无效组合的收益与风险之间关系的模型。'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 证券市场线与证券均衡定价


    +   - 证券市场线（SML）

    +     - CAPM告诉我们，在市场均衡状态下，证券期望收益率与证券风险之间存在正相关线性关系，风险大的证券将具有较高的期望收益率，而风险低的证券其期望收益率也低。

    +     - 将CAPM所遵从的关系式，如果以协方差（或β）为横轴、期望收益率为纵轴在平面坐标图中用图示法将各证券期望收益率与协方差（或β）之间的关系表示出来，则所有证券将位于同一条直线上，这样一条描述证券期望收益率与风险之间均衡关系的直线常称为证券市场线（Security
    Market Line，SML）。'
  merge: -1
  img_proc: true
