- pgno: 175
  md: '# 4.5 风险容忍度与资产配置


    投资者效用函数：

    $U = E(r) - \frac{1}{2} A \sigma^2$


    $A > 0$：风险厌恶者


    $A = 0$：风险中性者


    $A < 0$：风险爱好者


    求解效用最大化问题：


    $\underset{y}{Max}\; U = r_f + y\left[E(r_P) - r_f\right] - \frac{1}{2} A y^2
    \sigma_P^2$


    $\Rightarrow$ 最优风险资产配置比例

    $y^* = \frac{E(r_P) - r_f}{A \sigma_P^2}$'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 无差异曲线


    投资者效用函数：$U = E(r) - \frac{1}{2} A \sigma^2$


    其中$A$为外生变量。

    如此，为保持U不变，可调整$E(r)$和$\sigma$的组合

    在$E(r)$和$\sigma$空间中，为一系列的点。

    连结各点得到投资者的无差异曲线。

    其中U为无差异曲线的确定等价收益率

    投资者无差异曲线簇与资本配置线相切的点，

    为与投资者风险厌恶程度相应的最优资产配置水平'
