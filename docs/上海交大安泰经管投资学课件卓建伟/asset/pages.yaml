  md: "# 信息处理过程中的错误：错误的估计真正的概率和相关收益率\n\n+   1. 预测错误：过于依赖近期经验。\n+   \n+   2. 过度自信：投资者高估自己的信念和预测的准确性。\n\
    \n+   3. 保守主义：投资者对最近出现的事件反应太慢，对新发布的消息反应不足。\n+   \n+   4. 忽视样本规模和代表性：投资者基于小样本过快地推出一种模式，并推断出未来的趋势。"
