- pgno: 328
  md: '# K线的几种常见形态


    1.光头光脚小阳线


    此形态表示最低价与开盘价相同，最高价与收盘价相同，上下价位窄幅波动，表示买方力量逐步增加，买卖双方多头力量暂时略占优势。此形态常在上涨初期、回调结束或盘整的时候出现。'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# 2、光头光脚小阴线


    此形态表示开盘价就是最高价，收盘价就是最低价，价格波动幅度有限，表示卖方力量有所增加，买卖双方空方力量暂时略占优势。此形态常在下跌初期、横盘整理或反弹结束时出现。


    ![](img/55da7dc2df4a6500ba1969b246646278_329_0.png)'
  merge: -1
  img_proc: true
- pgno: 330
  md: '# 3、光头光脚长阳线


    没有上下影线，表示多方走势强劲实力占绝对优势，空方毫无抵抗。经常出现在脱离底部的初期回调线结束后的再次上涨，及高位的拉升阶段，有时也在严重超跌后的大力度反弹中出现。


    ![](img/55da7dc2df4a6500ba1969b246646278_330_0.png)'
  merge: -1
  img_proc: true
- pgno: 331
  md: '# 4、光头光脚长阴线


    没有上下影线，表示空方走势强劲，卖方占绝对优势，多方毫无抵抗。经常出现在头部开始下跌的初期，反弹结束或最后的打压过程中。


    ![](img/55da7dc2df4a6500ba1969b246646278_331_0.png)'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 5、带上影线的阳线


    这是上升抵抗型，表示多方在上攻途中遇到了阻力。此形态常出现在上涨途中、上涨末期或股价从底位启动遇到密集成交区，上影线和实体的比例可以反映多方遇阻的程度。上影线越上，表示压力越大,阳实体的长度越长，表示多方的力量越强。


    ![](img/55da7dc2df4a6500ba1969b246646278_332_0.png)'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# 6、带上影线的阴线


    表示股价先涨后跌，庄家拉高出货常会出现此种形态。黑色实体越长，表示卖方实力越强。常出现在阶段性的头部，和震仓洗盘中。


    ![](img/55da7dc2df4a6500ba1969b246646278_333_0.png)'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 7、带下影线的阳线


    这是先跌后涨型，反映股价在低位获得买方支撑，卖方受挫。常出现在市场底部或市场调整完毕。


    ![](img/55da7dc2df4a6500ba1969b246646278_334_0.png)'
  merge: -1
  img_proc: true
- pgno: 335
  md: '# 8、带下影线的阴线


    这是下跌抵抗型，表示空方力量强大，\n但在下跌途中一定程度上受到买方的抵抗。\n常出现在下跌途中、市场顶部或振荡行情中。


    ![](img/55da7dc2df4a6500ba1969b246646278_335_0.png)'
  merge: -1
