- pgno: 40
  md: '# 证券如何交易


    # 市场的类型:


    +   - **直接搜寻市场**

    +     - 买方和卖方需要直接相互搜寻

    +   - **经纪人市场**

    +     - 经纪人搜寻买方和卖方'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 证券如何交易


    市场的类型：


    +   - 交易商市场

    +     - 交易商买入这类资产，再从他们的库存中卖出这类资产。为市场提供即时性和流动性，并通过买卖价差实现一定利润。（看新三板行情表解释）

    +   - 拍卖市场

    +     - 交易商集中在同一场所进行交易。'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# # 买入价和卖出价


    # ## 买入价


    +   - 买入价就是购买的价格。

    +   - 在交易商市场，买入价就是交易商愿意购买的价格。

    +   - 投资者出售给出价方。

    +   - 买卖差价是在这一证券市场的利润。


    # ## 卖出价


    +   - 卖出价代表销售时的报价。

    +   - 在交易商市场，卖出价就是交易商愿意卖出的价格。

    +   - 投资者必须支付卖出价才能买入证券。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 交易指令的类型


    +   - 市场委托指令：立即执行

    +     - 交易者接受当前的市场价格

    +   - 限价指令：

    +     - 交易商指定买卖证券的价格

    +   - 一个大的指令可以包括多个交易价格。'
  merge: -1
  img_proc: true
