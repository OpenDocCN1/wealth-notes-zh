- pgno: 82
  md: '# 费用与共同基金的收益：

    例如


    期初资产净值 = $20


    获得的收入分配 $.15


    资本利得 $.05


    期末资产净值 = $20.10:


    Rate of return = (NAV₁ − NAV₀ + Income and capital gain distributions) / NAV₀


    Rate of Return = ($20.10 - $20.00 + $.15 + $.05) / $20.00 = 1.5%'
  merge: -1
  img_proc: true
