- pgno: 105
  md: '# 名义利率均衡


    +   - 当通货膨胀率增加时，投资者会对其投资提出更高的名义利率要求。

    +   - 如果我们假设目前的预期通货膨胀率是 E(i)，那么我们将得到费雪公式：

    +   - 名义利率 = 实际利率 + 预期通货膨胀率


    R = r + E(i)'
