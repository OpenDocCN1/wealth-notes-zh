    馬基維利的寫作主題包羅萬象，從個人感受、政治到宗教皆有。雖然這些是從他生活中的特定事件浮現出來，但它們所提出的問題，即使到了現代依然能引發熱烈討論，並不亞於五百年前。為什麼人總是被花言巧語與美貌所矇？教育的意義是什麼？勝者為何要在乎正義？何謂真正的偉大？什麼時候你該為自己的信念奮戰至死，而何時又該停止戰鬥？在一個由少數強權，以及極端不公平主導的世界中，人們該如何獲得自由？


    馬基維利給的問題與答案，通常都很驚人。當我們傾聽他自己的聲音，而不過度相信他惡名昭彰的「馬基維利主義」⒉，就能看到一位更堅毅的角色，展現在我們眼前。他對自己的同胞總是忍不住關心，卻又常跟他們意見不合；抱有鋼鐵般的決心，想改變這個腐敗的世界；相信任何人，不管多軟弱、被壓迫的多嚴重，都能盡一己之力，讓事物變得更好。他畢生都在鼓勵大家當個自由人，也希望能影響事件的演變。


