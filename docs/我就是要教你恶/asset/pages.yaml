  md: '# 你對世界的憤懣質疑，答案可以找馬基維利


    元一一五三八年冬天，一位住在義大利的英格蘭人，旅行到佛羅倫斯來。當時英格蘭的宗教改革，即將撕裂天主教會，極機主教賴因哈德·波爾（Reginald Pole）反對英王亨利八世（King
    Henry VIII）與亞拉岡的凱薩琳（Catherine of Aragon）離婚，所以就從英格蘭海岸自我放逐，並在義大利定居下來。


    在遠赴放逐之旅的十年前，他與湯瑪斯·克倫威爾（Thomas Cromwell）會談過。克倫威爾出身寒微，當選議員後，受亨利八世重用成為國王最親密的顧問，他完全縱容亨利淫欲與縱欲行為（起碼在波爾看來是如此）。這位野心勃勃的顧問，在幕後策劃國王的離婚，讓英格蘭與天主教會陷入戰爭局面，神父與貴族慘遭謀殺——而且這些犯行，都能找到正當的藉口來粉飾。


    波爾掛念著讓他遠離家園的邪惡力量，渴望能讀到一本談論治國的書籍——波爾與克倫威爾會面時，克倫威爾對此書讚不絕口。這本書的作者是佛羅倫斯人，已經去世十年了，所以波爾無法親自見


    基曾數於十六至十七世紀的教派分裂及改革運動，也是形成新教的開始。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '他一面。但波爾如果能讀到這本書，或許就能了解克倫威爾的想法，以及李利的行動，也就能搞懂他可憐的祖國到底出瞭什麼事。


    拿到書之後，波爾一開始很陶醉的讀著，但後來越讀越害怕。「我才剛讀沒幾句，就感受到撒旦向我伸出魔掌，很顯然他是假借人類之手，用人類的風俗寫出來。」他之後寫道。


    這本書字裡行間透露的一切主張，似乎就是克倫威爾的政策指南。這本書說，君王必須將國家建立於恐懼之上，而非愛之上；因為他們活在充滿謊言與暴力的世界中，所以別無選擇，只能採取表裡不一的態度。的確，越懂得欺騙的君王就越成功。波爾用簡單一句話，形容這本克倫威爾讀不絕口的書：「整本書都散發出撒旦的邪惡臭味。作者簡直就是人類公敵！」這本讓波爾膽戰心驚的書籍，叫做《君王論》（Il
    Principe），而作者的名字，叫做尼可洛．馬基維利。


    # 一本《君王論》，搞垮（或拯救？）整個英格蘭


    波爾怕歸怕，但還是被迷住了，決心多加研究寫出這個東西的人。波爾認為他某些格言「蠢到極點」。對波爾來說，靠恐懼贏得權力，顯然無法保住自身與國家的安全。


    《君王論》主張冷硬的政治事實，必須優先於道德理想。但作為一本教人保住權力的手冊，他的建議實在太不切實際了。波爾堅信，克倫威爾只看到《君王論》的表面價值，並吸收其邪惡的主張、相信它們是掌權者應遵守的最審慎原則。這本書造成的後果一點都不好笑，波爾覺得西元一五三九年英格蘭正加速毀滅，而其他基督教國家的君主或其顧問，只要中了馬基維利的魔咒，很快就會步上亨'
  merge: -1
  img_proc: true
- pgno: 15
  md: '利的後塵（政教分離的民族國家）。


    「統治者，眼睛放亮點！小心這個雙面作家！」波爾如此「警告」。」「這傢伙的主張就像一種毒藥，讓君主深陷瘋狂，接着用獅子的殘暴、狐狸的狡猾，攻擊自己的人民。


    克倫威爾藉著主政英國，依靠議會的支持，以宗教改革為突破口，巧妙的把國王的個人動機融入到民族國家的整體利益當中，並且頒布一系列的法案，打破教皇對世俗國家的控制，建立起國家的對外主權。克倫威爾還把教會的司法權和徵稅權也轉移到了國家手中，可以說，貧寒出身的克倫威爾既偉大、手段也決絕，讓英國成為歐洲第一個真正獨立的自由的國家。


    # 世人只記得他嚇人的格言，沒注意「但書」


    十年前，我第一次動筆寫關於馬基維利的事情時，對於這些早期的辯論所知甚少。就像大多數的現代讀者一樣，我假設《君主論》的作者是一位現實主義者與愛國者。而近期的學者都再三告訴他獻身拯救自己的城市——佛羅倫斯，以及他的國家義大利；義大利在那個時代，被內戰亂搞到分崩離析。如果他替暴力與偽善做辯解，那也是出自我愛國心，希望有好的結果。


