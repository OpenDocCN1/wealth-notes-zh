  md: '記述）（Description of the Method use by Duke Valentino at Sant''Agata）；內容提到切薩雷想前往烏爾比諾、還有其他幾座盟友替他奪下的城鎮，並跟這群難以控制的盟友談判。


    「他的掩飾技巧非常高超，而且努力說服他們：他們正在對抗的人，其實想把自己得到的好處分享出去；就這種手段而言，他已經夠格坐擁君王的頭銜。」雖然切薩雷這樣說，卻持續增兵，並獲得五百名法國長槍手的支援。「顯然他現在很強大，可以公開向敵人宣戰、藉此復仇，但他卻擇用騙的，因為這樣比較有用、也比較安全。」所以，當歷下顧問在構思條約時，切薩雷則在靜待佳機、進行報復。


    十二月底，奧西尼家族、維特羅佐以及他們的人馬，替切薩雷拿下了塞尼加利亞；切薩雷決定率軍前往該地（顯然沒先問過他的主要顧問），說要借助盟友的武器與計畫。十二月三十一日，他進城會見維特羅佐、帕歐羅、格拉維納、奧西尼（Orazi
