- pgno: 10
  md: '# 我就要教你惡


    不可能置外於政治人物的勢力範圍，所以更要了解這些人的簽算、把戲跟內心世界。


    因此，我們不能不認識马基維利。如果你查 Macchiavelli 這個字的同義字典，前十個可能出現的字是『 immoral』、『 shameless 』、『
    treacherous 』、『 trick 』、『 cunning 』、『 hypocritical 』、『 opportunist 』、『 crafty
    』、『 sinister 』、『 calculating 』，而這些意思幾乎是不道德的、詭計多端的、奸詐的……講白一點，幾乎沒一句好話。


    從馬基維利的同義字來看，他的江湖地位與其說毁譽參半，不如說貶大於褒。他究竟所圖為何？他支持共和國體制多時，後來卻甘心臣服於復辟的梅迪奇家族政權下？他寫的書真的有散旦臭味嗎？


    這本《我就要教你惡》用相對客觀的角度，保持距離的側寫馬基維利，從他所處的環境理解他，從他的際遇同理他。在那個時代，義大利尚未統一，城邦分治，列強環伺。如果我們用更多角度、用更長的時間去咀嚼馬基維利的思想，而非只用雙字片語論斷他，就會得到更多啟發，也自然而然會放棄醜化他。


    馬基維利曾被梅迪奇家族惡整，西元一五一二年，梅迪奇政府免他職務，拉他入獄，扣他顛覆政府的罪名，但他念茲在茲的，是一個統一的義大利，而他把實現義大利統一的希望求之於霸主，所以在西元一五二六年獻上《君主論》，給梅迪奇的當家羅倫佐。


    他並不是為了吹捧君王而書寫，有時他刻意冷血，教導統治者怎麼滿足自己的野心；有時他描寫自由人民如何對侵犯者復仇，卻又熱情滿溢，激昂奔放。他雖讚美君王，卻陰暗的提出遲疑與警告。我認為盧梭對他的評價最為公允：「馬基維利自稱為君王講課，其實他是為人民講課。」


    馬基維利絕對不甘於臣服狡猾的狐狸跟勇猛的獅子，他展現的智慧，其實是馭獅惡狐。


    010'
