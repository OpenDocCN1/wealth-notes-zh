  md: '記；出差跟教宗、教宗的兒子對談；在安靜的書房裡讀季維與普魯塔克；或是在寫書、寫喜劇時，馬基維利其實都在參政，而他也從未放棄建立一個共和國──比他之前效力的那個更持久、更繁榮。他總是為了自己的城市而努力，幾年前還寫信給圭恰迪尼：「我會盡可能幫助她（佛羅倫斯）。如果實際行動辦不到，就用文字；文字辦不到，就用暗號。」


