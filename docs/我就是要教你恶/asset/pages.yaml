  md: '# 後續發展


    府聲稱他是自殺的，不過很多人都抱持懷疑。至於維托利與圭恰迪尼，也在接下來的三年內，相繼去世。


    馬基維利死後，就沒有人知曉瑪莉塔的動向，關於孩子們的訊息也少之又少。桂多擔任神職，繼續研究文學（或許是因為小時候讀了奧維德的著作，並以父親為榜樣）；據說他寫過喜劇，但沒有留存至今。至於，馬基維利那個比較不乖的二兒子盧多維科，雖然之前在信件上給人的感覺，實在不像個英雄，但他卻在佛羅倫斯的包圍戰中，為了守護共和國而亡。而巴奇娜的兒子——朱利亞諾·德·李奇（Giuliano
    de’ Ricci），則負責保護爺爺的著作。


    西元一五五七年，由教宗保祿四世（Paul IV）領導的天主教教廷，為了對付被宗教改革煽動的異教徒暴動，頒布了《禁書目錄》（Index of Prohibited
    Books）；不久之後，馬基維利的所有著作皆列入其中。朱利亞諾努力說服梵蒂岡的審查員，請他們允許爺爺的著作出版，並願意刪掉比較敏感的一段落。但他的努力還是全部白費了——直到西元一八九〇年，馬基維利的著作才解禁。


    《論李維羅馬史》中，有幾個段落（或許就是遭到查禁的元凶）提到，基督教這個「派系」，總是對它無法掌控的思想與著作宣戰——尤其是主張「私人與政治生活的最佳指南，不該藉由神職人員的權威得知，而是靠凡人的論證」那些敘述。


    早期瘋狂信奉教廷的人，會無情迫害異教徒與其聖賢、燒毀詩人與史學家的著作、破壞其雕像；


    +   1. 指統治者不經議會同意自行條款。


    +   2. 為馬基維利擔任共和國第二總理時，被軍事處死的傭兵隊長，之後政府也因此案受污名。詳見第九章。


    ```

