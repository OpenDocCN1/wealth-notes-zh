    馬基維利去拜訪桂里諾的家，準備來打探一下。結果他不在家，倒是他的老父親貝羅·德爾·貝羅（Paolo Beiò），邀他進房裡坐坐，並且願意回答他所有問題。他將馬基維利帶進一間涼爽的房間，雖然裡頭簡樸，卻布置得十分典雅。他們互相客套了一番、抱怨一下酷熱的天氣，而一位女僕拿着一瓶酒進來。兩人坐下之後，馬基維利直接說明來意。


    他友善的說：「據我了解，當佛羅倫斯的長官拜訪此地時，令郎似乎邀請了許多親朋好友，在您府上吃晚餐。根據我們接獲的情報，這些客人當中，有人與納迪家密謀作亂。而且長官的報告還說，桂里諾先生把家門關上，不讓警察逮捕這幫人。」


