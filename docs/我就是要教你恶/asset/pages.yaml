  md: '![](img/ba47fb6ad5010d8e0ea610613a83cd5b_382_0.png)


    只要稍微傳達一點古代思想的事物，全部會被毀掉。而馬基維利的作品，就是想恢復與基督教成立前，古人的智慧與道德標準（這也是他的最愛），所以它們也遭到類似的命運。


    不過，馬基維利總是有一小群擁護者，會為「該如何替他辯護」與「該替他辯護到什麼程度」傷透腦筋，而且就算住在反對羅馬教廷權威的國度，他們仍舊小心翼翼。西元一五四九年，逃出義大利的新教徒——亞伯利可．詹提利（Matteo
    Gritho）之後成為牛津大學的民法「欽定教授」（Regius Professor），主張：「在談論道德與政治的哲學分支當中，同階級的現代作家相比，就屬馬基維利最與眾不同。」馬基維利的惡名，早已傳遍佛羅倫斯與義大利，不管是天主教徒如波爾，還是新教徒如伊諾森．詹提雷特（Innocent
    Gentile），都公開辱罵馬基維利不虔誠、沒道德。


    然而，詹提利反駁：「在我公正的評估他著作背後的目的是为了用比較明理的詮釋，來強調他的字句後，我認為可以無視眾人加諸於這位逝者的臭名。如果我們的目的是要善意詮釋作者的用意，那就不能太強調他的過錯，至少要以容忍柏拉圖、亞里斯多德等人心胸，來容忍他——畢竟這些哲人的冒犯之詞，可不比他少！」


    自從西羅馬帝國亡於哥德人之後，義大利半島在接下來的十四個世紀都處於分裂狀態，一直到十九世紀才完成統一。西元一八七七七月，政府由佛羅倫斯遷至羅馬，在此之前一直是列強勢力瓜分，城邦林立。


    3 指牛津大學、劍橋大學中，由國王設立的神學、希臘文、希伯來文、法學、醫學五種教授或講師的教席。


    4 詳見前言。


