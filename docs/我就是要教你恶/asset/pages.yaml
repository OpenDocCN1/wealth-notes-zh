  md: '# 前言 你對世界的憤憑質疑，答案可以找馬基維利


    宗、義大利其他城市的君主，改變他們思考與行動的方式。


    其中，他可以對有些聽眾直言不諱，但對另一些就必須多加防備。從馬基維利的外交信件中可以看出，他處理細膩而危險的「政治遊戲」時，才華可說展露無疑。他身為國家公僕，必須與國王、伯爵夫人、教宗、佛羅倫斯貴族周旋，還要學會如何走得小心，用正確的措辭對特定人士說話、提出批評，卻又不能像在批評。所以，當他利用這些技巧來寫《君王論》與其他作品時，也不讓人心意外。


    我希望大家盡可能親身體會馬基維利的語言，以及他的寫作、談話、思考與判斷模式：簡言之，就是由他親自說給讀者聽。


    因此接下來，我會盡可能以馬基維利的視點來列舉事件，而這個視點，是從他諸多作品中建構出來的。為達到此目的，我用瞭兩個方法：第一個是把馬基維利自己說的話，編入我對他生平的描述之中，這樣我們就能聽據他對這些事件有何高見；第二個方法是偶爾插入一些對話。雖然這就違反了傳記的傳統寫法，但從我手上的素材來判斷，用這種方式來忠實呈現書中的主人翁，會比較自然。


    馬基維利喜愛有內容的對話，而且他可以跟任何人對話：他書信往來的對象，包括朋友與敵人、酒吧的磨坊工人與鐵匠，以及他那個時代最強大的君王。此外，還有其他資料來源——他父親貝納多、馬基維利的日記、朋友寄給他的信、佛羅倫斯政治會議的紀錄（讀起來宛如刺激的戲劇）等，也提供了本書人物對話的細節紀錄。我把他們的對話紀錄直接化作對白，藉此闡明他們是怎麼交談、開玩笑、批評與掩飾的，應該沒有其他方法比我還直接吧？


    這些對話，全都忠於原始資料，有時候我會濃縮原文，或是稍微改寫，但不會改動主旨或措辭。雖然大多數的對話，都是直接節錄自談話紀錄，不過少數场合我會採用書信或其他著作來呈現。


