  md: '不久之後，馬基維利就想像出一段對領主的演說，而演講者或許就是他自己，這樣他就能暢所欲言，不用顧慮到自己的使者身分——畢竟有些事情不能寫在信上。「所有觀察過公爵的人都知道，他從未打算要靠固與義大利人之間的友誼。從他一切行動就可以明顯看出，他只想在義大利境內，為自己建立一個大國，而且理所當然的，下一個就輪到了托斯卡尼。至於，時局演變能否容許他的行為、讓他繼續粉飾自己的企圖，目前還有待觀察。」


