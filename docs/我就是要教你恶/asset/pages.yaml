    # 卸君王鎧甲，掀權力面紗


    ## 酆獅惑狐的馬基維利


    ○○○，這個人和他的哲學的真意實義，一直是臺灣近代史上的一個謎。他被視為玩世不恭、滿懷激情、一個強烈的民族主義者、一個政治陰謀家、一個道地的民主主義者、一個吹捧暴君的無恥之徒。對他的這些評價儘管互相矛盾，卻也許有一定的道理。「那三個字，我相信每個人心中都會浮現一個人選，我有的朋友填柯文哲，有的則堅持是李登輝，你心中的答案又是誰？臺灣兩字其實是我添上的，其實這是喬治·霍爾德、薩賓恩（G.
    H. Sabine）教授筆下的馬基維利。


    很多人覺得自己上上班族錢，下班追劇就好，管他什麼政治，偏偏政治人物每次院會表決的結果，決定我們出生後打什麼疫苗、大眾運輸系統的前路，決定我們在通勤上得虛擲多少生命。除此之外，政治人物還決定我們要繳多少稅金、多少國民年金，以及多少遺產稅……從我們出生管到死後。我們


    醫師、臺灣菲斯特公司顧問／楊斯梧'
