  md: '# 我就是要教你惡


    再美的道德，只不過是思考遊戲。後人遂將馬氏的學派稱為「現實主義」。


    事實上，英文「權術」（Machiavellian）一字，就是引用馬基維利之名。這個字最終被染上負面色彩，給人「不擇手段以達目的」之隱喻。然而根據馬氏所言，倘若一個君王不諳權力法門，後果將是生灵塗炭、國破家亡。如此的君王，又何來道德之有？因此馬氏不學柏拉圖談理想、至善、形式，不受亞里斯多德講邏輯三段論、Ones
    點。也不希罕阿奎納（St. Thomas Aquinas）的上帝本質等虛無縹緲的哲學術語。馬基維利認為「一個好君主，也是要「掌權」，並穩定國家，其他全是空談。


    馬基維利認為「個好君主，須具備兩種動物的特質，他要有狐狸般的狡猾，以及獅子般的凶狠，缺一不可。馬氏認為君主如果缺缺狐狸的特質，而僅有獅子般的殘酷，那麼他會被貶為暴君，最終慘遭殺生之禍；倘若僅一路狡猾，缺之獅子般的暴力，也只落於紙老虎之流。他認為統治人民最快速的方式，必須靠暴力所引發的恐懼。


    被問到君王是否該有道德時，這位馬雄國師認為學學狐狸就對了！也就是說，君主主要表德性，可是不見得一定要有，因為道德主要目的是哄騙老百姓，讓他們歌功頌德。


    或許很多人不屑馬氏的論述，但美國就是最經典的案例，它擁有好萊塢與主流媒體的「狐狸伎倆」，同時間掌握上于顆核彈與航母的一「獅子暴力」，使美國成為全球最強大的國家。俄羅斯、中國僅握有獅子，但缺狐狸；日本、德國僅有狐狸，但沒獅子，因此均無法擔任世界霸權；反觀西藏、東地汶、伊拉克、阿富汗、巴勒斯坦，這些國家既沒狐狸，也無獅子，就成了其他獅子的俎上肉。


    馬氏的觀點不見得能讓人立即下嚥，但值得細細咀嚼，本書就是極佳的參考讀物。但要記住，看完後，不要放在書架顯眼處，那是放《論語》的地方；《我就是要教你惡》是要藏在心中的。'
