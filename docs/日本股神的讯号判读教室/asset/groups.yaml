    至於獲利了結的時機，不妨在上漲結束、K 線以黑線收場的地方趁早逃走。只要 K 線還在 5 日線之上，即使是黑線仍持續買進。按照 9 日法則，直到 K 線往下穿破
    5 日線為止，仍能保有可觀的獲利。


    分歧發生後的股價漲勢當然也可能很快就結束，然而，分歧訊號的優點就在於能夠有效指示「上漲趨勢當中，跌下來就買，漲上去就'
