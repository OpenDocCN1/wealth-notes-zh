    圖 21一③則是在整體持續上漲的走勢當中，由「（緩緩的上漲 趨勢後）盤整 3 個月→上漲 3 個月（其中有 2 個月略顯盤整）」的期 間所構成。


    「趨勢的壽命大概是 3 個月，股價的循環約莫是 6 個月」，若能 明白這樣的「壽命長度」，就可以在意識到「日子」的前提下判斷： 「這波上漲趨勢還很年輕。」「這波下跌快過保存期限了。」藉此進
    行交易。但遺憾的是，我們畢竟不是預言家，不可能做出「哪年哪月 哪日，股價會從盤整轉為下跌」這種精準預測。不過，若只知道「大 概」「約莫」「整體來說」各個局面會在多久之後結束，就已經相當
