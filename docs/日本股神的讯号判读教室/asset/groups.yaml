    ## 勢還會再維持幾天，因此更容易獲利。


    ![](img/fb5596eb257d02539bd30843d1962796_76_0.png)


    不過，無論是下半身或反下半身，最重要的是以 5 日線為首的均線方向與排列方式。不只是 5 日線的傾斜度，7 日線、10 日線是否也都從盤整轉為往上了呢？20
    日線是向上還是向下？20 日線位在 5 日線上方還是下方？如果不逐一留意均線的狀況，失敗率就會提高。總結來說，可整理如下：


    - 即使 K 線以紅線形式穿越往下走的 5 日線，也不是下半身。

    - 即使 K 線以黑線形式跌破往上走的 5 日線，也不是反下半身。


    根據下半身／反下半身訊號進場卻統統失敗的你，是否一看到紅線穿越往下走的 5 日線時就不假思索地亂買一通？那可不符合相場式訊號中的下半身！


    此外，K 線以黑線形式往上突破 5 日線、以紅線形式往下跌破的現象，也都不屬於下半身、反下半身。K 線的顏色也很重要。


    雖然最好把這些成立條件嚴加記牢，但是初學者只要老老實實地在訊號發生時持續買賣，就能夠賺取大筆獲利，這就是下半身／反下半身最大的魅力。這項訊號的絕佳效果，我完全可以掛保證。


    圖 29 是相當簡單且基本的下半身具體案例。MonotaRO 線圖中，長期線 20 日線、60 日線非常整齊地往上走。均線的排列方式也是 5 日線＞7 日線＞10
    日線＞20 日線＞60 日線，短期線在上面率先追著上升的股價，長期線則在下方較晚上升。


    這是相場式當中典型的上漲趨勢均線排列——「PPP」。這個過程中，K 線會暫時下跌、突破 5 日線，5 日線也被帶動突破 20 日線之後，K 線再次以紅線形式向上突破
    5 日線，點亮上漲的下半身訊號（圖中的①、②）。


    ## 圖 29 上漲趨勢中的下半身訊號


    ![](img/fb5596eb257d02539bd30843d1962796_78_0.png)


    ### 圖 29 的簡單解說


    藍色的 60 日線是往上走的，距離 20 日線以下的短期線相當遠，這就是強勁上漲趨勢持續的證據。這時候，5 日線即將跌到 20 日線的地方，是絕佳的搶進地點。具體來說，不妨在
    K 線穿破 20 日線後反轉上漲、對 5 日線出現下半身訊號①、②的紅線買進。除了以均線來確認氣勢之外，若能利用下半身訊號趁早買進，初學者也能安穩獲利。


    均線排列呈現 PIP 的時候，股價位於強勢上漲趨勢。此時暫時出現的下跌趨勢，稱為「暫時性下跌」。圖 29 中的下半身訊號，就能夠準確指示從暫時性下跌轉為再次上漲的走勢。長期的
    20 日線與 60 日線也一貫向上走，這正是上漲趨勢的典型案例。


    再怎麼完美的上漲趨勢，也會出現股價暫時下跌的時候，因為已經靠做多賺到錢的部分投資人會獲利了結。這就是在上漲趨勢中一定會發生的「暫時性下跌」現象。此時由於「股票變便宜了」，所以會有不少想要買進的新買方加入，當下半身訊號在股價轉為上漲的瞬間亮燈時，某種意義上可說是最強的訊號，不妨放心買進。


    獲利了結的時機則是在那之後，也就是在連續出現紅線後第一次登場的黑線處。直到 K 線穿破 5 日線，或是 5 日線、7 日線、10 日線這些短期線排列潰散為止，都可以繼續買進。除此之外，還可以利用
    9 日法則進行買賣判斷。


    ## 圖 30 靠反下半身在下跌趨勢中賣出


    ![](img/fb5596eb257d02539bd30843d1962796_80_0.png)


    相反的，均線由上到下的順序為 60 日線＞20 日線＞5 日線的排列形式時，就形成強勢下跌的「反 PPP」（圖 30）。在這種狀況下，雖然 K 線暫時反轉上漲，飛越
    5 日線，來到 20 日線、60 日線附近，卻因為「下跌力道過強，無法違抗趨勢」而再度下跌。瞄準再度下跌的瞬間做空，就稱為「反彈脫手」。K 線以黑線形式向下穿刺
    5 日線的「反下半身」亮燈的話，就是一個絕佳的賣點。圖 30 的反下半身（①、②）即為典型案例。特別是②的反下半身，是在 20 日線、60 日線以相當陡峭的下坡角度進行強勁的下跌趨勢當中，K
    線雖然向上穿越 5 日線，但氣勢無法持續，轉為盤整推移。之後②的大黑線就像是宣告投降似的，不只是 5 日線，也對 7 日線、10 日線、20 日線都點亮了反下半身訊號，隨後急速下跌。


    股價向上超越均線時，已經持有部位的買方損益就會成為正數。此時請務必注意：「這不代表上漲的氣勢會加強。」當下半身訊號形成的時候，這些買方已經買完了，因此他們會成為「旁觀者、持有者」。


    會使股價氣勢增強的，只有「新的買家」。也就是說，一旦股價超越均線，不少投資人就會認為上漲氣勢增強，判斷「這個個股可以買進」，於是越來越多投資人紛紛進場。


    構成下半身訊號的紅線越長，氣勢就越強，新的買家一定會一擁而上。數量增加得越多，股價漲勢就越強勁。因此，K 線柱體很長的 下半身／反下半身雖然是強烈的漲跌訊號，但是期待越高，也會有失速的可能性，這一點要記住。


    ![](img/fb5596eb257d02539bd30843d1962796_82_0.png)


    ![](img/fb5596eb257d02539bd30843d1962796_82_1.png)


    ### 圖 31 的簡單解說


    圖中呈現相當典型的完美上漲趨勢，但是該趨勢的形成契機，在於先前密集聚攏的 20 日線以下的均線穿越了藍色的 60 日線，形成 5 日線＞7 日線＞10 日線＞20
    日線＞60 日線的 PPP 排列。那麼，該在哪裡買進呢？此時出現了下半身①。從突破了之前盤整趨勢高點的大紅線氣勢看來，此处是一個相當完美的買點。之後，股價輕鬆衝破
    2000 日圓關卡，也加速了強勁漲勢。


    ## 下半身／反下半身是趨勢轉換的訊號


    堪稱比上漲趨勢中的暫跌買進、下跌趨勢中的反彈脫手還要更「好賺」的情況，就是像上一頁的圖 31 那樣，在盤整走勢下，因下半身／反下半身訊號亮燈而一口氣急漲、急跌的情況。圖
    31 從下跌走勢開始緩緩持續上漲，均線也由綠色的 20 日線向上穿越藍色的 60 日線，完成了 PPP 排列。在那之後，出現一根突破了纏鬥至今的高點的大紅線❶。不僅突破
    5 日線，也突破了 7 日線、10 日線，點亮完美的下半身。如同這則案例所示，下半身❶成了正確掌握上漲趨勢初始階段的訊號。股票市場的風景瞬息萬變，若能趁早搭上影響力強大的下半身／反下半身訊號，就能賺取全壘打等級的豐碩獲利。


    圖 32 是持續以上漲趨勢推移的 AEON 股價，隨著一口氣突破 5 日線、20 日線、60 日線的反下半身（圖中❷）出現，進入下跌趨勢。股價的特性就在於上漲時多半慢慢吞吞，下跌時卻是撲通一聲往下跌。若能運用這樣的性質，趁著急跌走勢做空，便可以靠股票穩定獲利，甚至還能享有富足的老年生活。股市中雖然不常發生像圖
    32 那樣，因衝破多條均線的強烈反下半身出現而展開的急跌走勢，但一年也會有個兩、三次。若要達成靠股票賺進數千萬乃至上億資產的夢想，就不要錯過這個機會。


    ## 圖 32 連動強勁下跌趨勢的反下半身


    ![](img/fb5596eb257d02539bd30843d1962796_84_0.png)


    ### 圖 32 的簡單解說


    股價轉為盤整，紅色的 5 日線一度跌破綠色的 20 日線、藍色的 60 日線後，即可做好準備：「可能要轉換為下跌趨勢了。」在反下半身①出現之前，從 5 日線到
    60 日線都密集聚集在這狹窄的範圍裡。如果你已經在腦海中牢記「均線密集聚攏後，容易往上或往下大幅變動」這條原理，當黑線①一口氣穿破從 5 日線到 60 日線的均線時，就會知道正確答案是「賣就對了」。之後在超過
    9 日法則的第十根 K 線上出現了紅線，停止急跌走勢。


    至今為止的交易中，或許有人曾經按照下半身或反下半身訊號進行買賣，最終卻失敗了，就一口咬定「這個訊號不管用，算了」，但其實只是搞錯方法罷了。如果能確實將訊號亮燈的條件牢記腦中，就沒有比下半身／反下半身更簡單、直截了當，並且更能賺大錢的訊號了。**成功的關鍵字就是「PPP」「K
    線的顏色」「超越多條均線」。**


    此外，當一根 K 線一口氣穿越 5 日線、20 日線，甚至 60 日線時，這根 K 線要不是長度驚人的大紅線、大黑線，就是必須符合「5 日線到 60 日線等均線全部集中聚攏在相當狹窄的範圍裡」這項條件，**圖
    32** 的情況屬於後者。均線密集聚攏，是因為五天內的股價平均值跟二十天、六十天的平均值幾乎集中在同一個價格區間。也就是說股價持續盤整，缺乏變動，多方跟空方的勢力正處於抗衡狀態。


    這樣的無趨勢狀態中，如果出現了強勁的下半身或反下半身，在膠著的走勢中打盹的投資人也**會**突然驚醒，股價多半會朝著訊號出現的方向急遽變動。**在突破了多條均線的強勁下半身及反下半身出現之前，整體趨勢反而多半處在舉棋不定、上下變動猶豫不前的狀態中——這點也要記住。**


    此處就來介紹一個有點不尋常的模式吧，請看**圖 33**。


    ## **圖 33** 預告上漲趨勢將再次加速的下半身


    ![](img/fb5596eb257d02539bd30843d1962796_86_0.png)


    所謂的 PPP，是均線完成了 5 日線＞20 日線＞60 日線這種由短到長的順序排列，顯示出強力上漲的趨勢。然而在達之前的排列必定是 20 日線＞5 日線＞60
    日線，或是 5 日線＞60 日線＞20 日線等均線排列轉為 PPP 之前的狀態。在相場式交易中，我們稱這樣的排列為「**PPP 前夕**」。瞄準均線形成「PPP
    前夕」時買進，等到真正的 PPP 黎明到來時，已經可預見非常美好的投資結果了。


    圖 33 即符合這樣的情形。上漲趨勢潰散，均線排列變成 20 日線＞5 日線＞60 日線，若就此持續下跌、5 日線來到 60 日線下面的話，就有可能轉為下跌趨勢。然而①的大紅線同時穿破了位於上方的
    5 日線、20 日線，呈現出強烈的下半身訊號，上漲趨勢復活。此外，因為大紅線①的出現，使接近藍色 60 日線的紅色 5 日線、綠色 20 日線再次離開 60
    日線，轉為上升。這就是「分歧」（請參照第六章），是趨勢再次加速的訊號。大紅線①是從 PPP 前夕開始順利發展為 PPP 時出現的下半身。


    同為圖 33 的情況，可以把大紅線①想像成差不多大小的黑線：K 線不但往下穿過 5 日線，還跌到 60 日線以下，進入下跌趨勢……延續這樣的情節發展，總之就是大幅往上或往下變動的走勢。事實上，這張線圖最後的結局是下跌，圖中冒出了黑線②，一口氣向下穿破了從
    5 日線到 60 日線的均線。


    ## 比下半身更強勢的「加強版下半身訊號」


    ![](img/fb5596eb257d02539bd30843d1962796_88_0.png)


    ### 圖 34 的簡單解說


    下半身、反下半身會頻繁出現在趨勢持續時的暫時下跌或反彈走勢，也會發生在趨勢的轉換點，指示決定性的買進或賣出時機。而能夠告訴我們趨勢轉換點的相場式訊號，除了圖中的
    N 大及屁股之外，還有「突破前一波高低點」「鳥嘴」「嘗試攻頂失敗」等多種訊號。這些訊號若是伴隨著下半身或反下半身一起出現，不僅更能放心進場，訊號的準確度也會提高。


    「要忠於均線排列所顯示的趨勢方向性！」這是運用下半身／反下半身時的規則，不過就如同我在過去著作中曾介紹過的，在多種相場式訊號與下半身／反下半身同時出現的情形下，會形成「加強版」效果，因而成為準確度更高的訊號。


    上一頁的圖 34①的 K 線是向上穿破 5 日線的下半身，同時點亮了下跌趨勢轉為上漲時經常出現的「N 大」（參照第七章）訊號。由於 N 大訊號和下半身訊號的加強效果，讓之後的股價氣勢強勁地反彈上漲。接下來②的下半身又稱為「屁股」，K
    線的收盤平均線及 5 日平均線呈現「W」字型的形狀，也就是雙底部訊號的多重型態。


    兩個低點的情況下，股價在穿過途中創下的高點③後觸及底部，點亮了「趨勢轉為上漲」的訊號。K 線在②的下半身邊增強了氣勢後，於下一根紅線④完美地往上越過高點③。屁股加上下半身，再加上兩個低點，三個上漲訊號都湊齊了，堪稱是所向披靡。在那之後，股價也確實順利地持續上漲。


    就像這樣，下半身／反下半身訊號的鐵律即為：「迷惘的時候，就找一下是否出現了其他訊號！」


    光是漫無目的地看著股價線圖，就算出現了明確的相場式訊號，也難以發現。牢記訊號發生的條件固然重要，但是當已經熱習的訊號出現在實際的股價線圖上時，就要立刻想到：「啊！這就是相場師朗曾說過的訊號！」這樣的觀察能力也是很重要的。


    為此，還是得老老實實詳讀過去的歷史線圖。一定要親自看圖，並且學會自行判斷：「此處形成『屁股』，所以這個下半身訊號將會帶動急漲走勢！」或「N 大與大行情連動，但是實際指示趨勢開始變動的訊號，是同時亮燈的下半身。」


    ## 股票投資就像考大學，記得要先看答案


    常有人說，面對大考時，在解題前要先看答案，掌握出題者的思維及正確答案的模式，這是提高學習力與成績的祕訣。


    股票投資不像入學考試那樣有「100%的正確答案」，但是依然具有相當於考古題的事物，那就是股價線圖。正因如此，投資人必須反覆觀看線圖，靠自己的力量一一確認：「線圖中是否出現了自已剛學會的相場式訊號？」


    如前所述，股票投資就跟準備考試一樣，「學習方法」很重要。如何在不安焦慮、疑神疑鬼的股票交易實戰中面對多種訊號齊聚的場面，並成功找出足以信賴的買賣訊號，即是重點所在。如此一來，才能夠緩和每天交易中的不安，進而形成在正確地點扎實獲利的原動力。反過來說，如果能在圖中湊到兩種相場式訊號，那就沒什麼好怕的了！


    忠實反映趨勢的下半身／反下半身，若再加上加強版效果的話，就是由 PPP 走勢開始，5 日線一時之間接近 20 日線，但是再度「告別」離去的「分歧」（請參照第六章）——像這樣的多重訊號相當常見。


    > 不妨一併記住這條法則：「分歧發生的時候，K 線容易形成下半身／反下半身。」


    圖 35 的左邊出現了明顯的下半身①，氣勢強勁地上升。然而在那之後便持續下跌，股價一時之間碰到 60 日線，隨後更低於 60 日線，上升的氣勢趨緩。


    這時候，K 線突然飛越了 5 日線，又進一步飛越到 20 日線之上，出現紅線，形成下半身②。由於這個下半身的發生，5 日線、20 日線都同時往上，5 日線與
    20 日線若即若離，雖然越來越近，眼看就要碰到了，卻又再度離開，往上升。原本靠近 60 日線的 20 日線也很快地離開，轉為向上。這種長短均線暫時靠近又分開的動向，就稱為「分歧」。


    ![](img/fb5596eb257d02539bd30843d1962796_92_0.png)


    而且，5 日線對 20 日線的分歧、60 日線對 20 日線的分歧是雙重發生，同時紅線對 5 日線與 20 日線都出現下半身，因此有「加強版」的加倍效果，成為強勢上漲的訊號。


    只要看 K 線與均線，每個人都可以找出下半身／反下半身，真的是非常簡單的訊號。但因為簡單就小看它的話，很可能會吃大虧。


    首先要注意均線的排列（是否為 PPD）及傾斜度，請練習判斷目前是上漲趨勢、下跌趨勢或盤整。


    **上漲趨勢的時候只瞄準下半身。將上漲趨勢中的反下半身當作獲利了結的訊號，在初學者的階段不要用逆向操作賣出手法。下跌趨勢時只瞄準在反下半身賣出。**


    在下半身／反下半身訊號發生時，也要注意「5 日線是否大幅飛躍／跌破」「是否穿越了多條均線」「是否與其他訊號重疊」這幾點。


    把這樣的對策深植腦海，是充分運用下半身／反下半身的鐵律，請務必謹記在心！


    # 第 5 章


    ![](img/fb5596eb257d02539bd30843d1962796_94_0.png)


    ## 相場的獨創訊號②：鳥嘴


    ### ⊙ 用鳥嘴察覺趨勢轉換與加速


    股價會反覆地上下變動，但是當你綜觀整體股市時，就會發現偶爾有持續上漲或持續下跌的情況。觀察整體價格變動時的股價方向性，就稱為「趨勢」。股票投資的重要關鍵就在於跟隨趨勢交易，也就是上漲趨勢時以做多為主，下跌趨勢時以做空為主。


    那麼，趨勢改變的話該怎麼辦呢？這時候，我希望大家將相場式獨創訊號「鳥嘴」謹記在心。


    說到顯示趨勢轉換的均線訊號，最有名的即為黃金交叉和死亡交叉。持續下跌的股價轉為上漲，而至今位於長期線下方的短期線被股價帶動，轉為向上後由下往上突破長期線——此現象就稱為黃金交叉。反之，短期線由上往下穿破長期線，則稱為死亡交叉。


    然而，如果遵照「在黃金交叉時買進」原則的話，會出現很多案例是以為趨勢轉換而買下，但股價其實已經開始下跌，導致交易失敗。即使成功，股價在黃金交叉發生的時間點上多半已經漲了很多，能賺取的價差有限，非常可惜。這一點在「死亡交叉時賣出」情形中也一樣。


    「像黃金交叉這種舉世聞名、新手最早學會的訊號，居然反應這麼慢，準確度又低，這樣完全不行！」抱持著這樣的危機感，我因而創造出更好用的趨勢轉換、加速訊號——鳥嘴。


    紅色的 5 日線與綠色的 20 日線交叉，形成尖尖的鳥嘴形狀時，即為準確度高的趨勢轉換與加速訊號（圖 36）。


    ![](img/fb5596eb257d02539bd30843d1962796_96_0.png)


    黃金交叉的情形下，當幾乎呈現盤整的短期線與接近盤整的長期線交叉時，也視為「買進」的時機，但是說到底，均線盤整的情況本來就表示上漲趨勢很弱。以趨勢轉換而言，近乎盤整的均線彼此交叉，顯示股價的動力不足。正因如此，我建議在短期線與長期線兩者都維持上漲（下跌）的趨勢狀態下，只嚴選出短期線凌厲穿越長期線的「氣勢強勁模式」。為了讓人立刻想到尖銳的形狀，因此命名為「鳥嘴」。


    除了紅色的 5 日線之外，線圖上也會顯示黑色的 7 日線、淺綠色的 10 日線等短期線。所以除了 5 日線與 20 日線的交叉之外，我們也可以將更短期的 5
    日線與 10 日線、5 日線與 7 日線的鳥嘴交叉狀態，視為「副訊號」。首先來看看最正統的趨勢轉換模式吧。


    圖 37 的任天堂股價，乍看呈現「下跌→盤整→上漲」的 L 字形變動，同時由下跌趨勢轉換為上漲趨勢。


    在相場式投資術中，下跌走勢稱為 A，盤整稱為 B，上漲則稱為 C，但是股價的變動並不是在下跌之後立即轉為上漲，大都是暫時以貼著底部的 B 走勢進行推移，其後緩慢爬升，最後才轉入上漲趨勢。圖
    37 的鳥嘴，顯示股價從 A 進入 B 之後，伴隨著鳥嘴訊號進入華麗的上漲趨勢 C。圖中特別要注意的地方是，在鳥嘴 a、b 形成之前，K 線①和②從下方突破了
    5 日線，呈現下半身狀態。尤其是在形成鳥嘴 b 之前的下半身②，是一根從 5 日線一口氣突破到 60 日線的大紅線。


    # 第 5 章 相場獨創訊號②：鳥嘴


