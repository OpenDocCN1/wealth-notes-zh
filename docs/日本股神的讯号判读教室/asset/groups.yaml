    ## 烏嘴形成之前，發生下半身的機率極高，這就是「烏嘴前夕」


    不妨牢記這則相場公式。特別是上頁圖 37 的烏嘴 b，隨著大紅線②上漲，原本盤整的 20 日線也轉為向上，而 5 日線更進一步以相當陡峭的上升角度追過這條
    20 日線，形成烏嘴。可以判斷兩者的角度越尖銳，股價的氣勢就越強。


    接下來，也一併看看**顯示趨勢轉為下跌的訊號——「反烏嘴」**典型案例吧。圖 38 的 SUMCO 股價從左側的上漲走勢 C，經由短期的盤整 B，完成了典型的「反烏嘴進入下跌趨勢」。


    ③的形狀看起來像是反烏嘴，但是在這個時間點，仍在藍色的 60 日線上方推移。之後股價跌破了 60 日線，以一種像是抓著往上走的 60 日線的形式反轉上升後，碰到綠色的
    20 日線，再次下跌。這時候，請注意不只是 5 日線，20 日線也已經往下走了。


    ### 轉為下跌趨勢的轉換訊號——反烏嘴


    ![](img/fb5596eb257d02539bd30843d1962796_100_0.png)


    ### 圖 38 的簡單解說


    20 日線跌到 60 日線之下後發生的反烏嘴訊號，不僅角度很尖銳，在此之前也出現了反下半身①，令人強烈預感到要進入正式的下跌趨勢了。這時候請看 5 日線的動向，會發現在跌破
    60 日線後短暫靠近了 60 日線又離開，這就是我們會在第七章解說的趨勢轉換訊號——反 N 大。再加上 5 日線對 20 日線出現的反烏嘴、對 60 日線出現的反
    N 大訊號，可說是一則顯示下跌趨勢變強的好例子。


    這樣的傾斜度，才是反烏嘴形成的前提條件。作為「反烏嘴前夕」的訊號，反下半身①以穿越 5 日線的黑線形式出現，「靠反下半身訊號做空」→「反烏嘴形成後進一步追加做空（或是繼續賣出）」這樣的買賣戰略是有效的。


    ### 均線的反應較遲緩，所以更容易預測


    均線是多個收盤價的平均值，因此其變動勢必會比 K 線遲鈍。很多人認為「反應較慢」是 K 線的缺點，不過我的想法不同。均線的反應比 K 線更為遲鈍，因此一旦趨勢往下走，即便最新的一根
    K 線呈現略微往反方向推移（向上）的變動，均線整體的趨勢依然是持續往下。


    也就是說，相較於隨心所欲的 K 線，均線在某種程度上更容易預測未來的走勢發展。


    根據這樣的性質，在烏嘴前夕的反下半身處於股價下跌之時，就可以事先預測「接下來，位於 20 日線上方的 5 日線也會被股價帶動，一口氣往下跌，這就表示將會形成反烏嘴訊號，該賣出了！」於是進場做空。實際上，一旦趨勢如同預測般持續下跌，形成反烏嘴，已經持有做空部位的你，只需要盡情欣賞線圖走勢就好。


    圖 39 是任天堂的「考古線圖」。此圖並不是按照標準模式的「上漲→盤整→下跌」，而是上漲後休息一陣子，盤整推移後上漲趨勢再次加速時，出現烏嘴。


    ![](img/fb5596eb257d02539bd30843d1962796_102_0.png)


    請務必記住以下這條「均線公式」：


    **從短期線到長期線，當不同期間的均線集中聚攏在同一處時，之後大多會向上或向下大幅變動。**


    **圖 39** 左側顯示股價大幅急漲後暫時略微向下、盤整推移，隨後又急速上漲的變動情況。觀看急漲前的均線會發現，從紅色的 5 日線到 20 日線都集中擠在狹窄的範圍內，每一條均線都微微往下推移，令人忍不住猜測「是否會跌？」的時候，就急速轉而上漲了。這波急漲的開端，始於一口氣從
    5 日線穿破到 20 日線的下半身①。


    這根紅線①形成了烏嘴前夕，之後紅線②、③登場，點亮烏嘴訊號。20 日線雖然看似盤整，但這時候，紅色的 5 日線與黑色的 7 日線、淺綠色的 10 日線在形成更短期的烏嘴的同時依序上漲，可以藉此推測上漲的氣勢強度。


    接著也一併看看相反的情形「下跌→盤整→下跌」吧。**圖 40** 的 AEON 在持續大幅的下跌趨勢後，打底反轉。然而，往下走的 60 日線在成為阻礙上升的壓力線的同時，逐漸轉到盤整走勢。在那之後，出現了①的反下半身。在這個時點，均線從
    5 日線到 20 日線為止幾乎重疊成一直線，密集聚攏在一起。如果記住了剛才的「均線密集後會有大動作」的法則，就會懂得在①的反下半身迅速做空，在之後的連續黑線處獲利。


    在下跌的過程中，從綠色的 20 日線到紅色的 5 日線為止，所有均線都已經朝下，5 日線與 20 日線以形狀銳利的烏嘴形式交叉。從此處開始「只要欣賞就好」，你已經在初期階段就做好準備，將此連續出現黑線的下跌趨勢收入囊中了。


    ### 圖 40 轉換成下跌趨勢的訊號——反烏嘴


    ![](img/fb5596eb257d02539bd30843d1962796_104_0.png)


    稍稍把話題岔開一下，圖 40 的急跌局面中連續出現黑線，從形成反下半身的大黑線①開始數起，直到第九根結束，第十根就出現了紅線。雖然之後又再次出現黑線，稍稍下跌了一些，但是幾乎吻合我們在第三章看過的
    9 日法則。如同第三章解說過的，9 日法則確實是一種非常活躍優秀的價格波動指標，請絕對不要忘了養成習慣，時常細數線圖上的 K 線根數。


    ### 烏嘴在暫跌買進、反彈脫手時也能派上用場


    5 日線與 20 日線的交叉，並非只會發生在趨勢轉換時。當原本持續上漲的股價下跌，帶動 5 日線暫時跌到 20 日線下方，再急轉而上，由下往上突破 20 日線的時候，也會發生交叉現象（圖
    41）。與其說是趨勢轉換，不如說是原本的趨勢暫時失速之後再度加速，因而出現「暫時性下跌或反彈」中的烏嘴訊號。


    此訊號和第六章將要介紹的分歧模式相當類似，若能靈活運用這類型的烏嘴，就能趁早搭上「趨勢暫時停歇→再次加速」的列車，是一種可以迅速指示「暫時性下跌搶進買點」或「反彈脫手賣點」、獲利率很高的訊號。


    ### **圖 41  烏嘴使上漲趨勢再次加速的案例**


    ![](img/fb5596eb257d02539bd30843d1962796_106_0.png)


    ### **圖 41  的簡單解說**


    如圖所示，在上漲趨勢持續的過程中，發生好幾次股價暫時下跌的買點。畫面左側出現了紅色的 5 日線接近綠色的 20 日線之後又離開的「分岐①」（參照第六章）。之後畫面右側顯示，5
    日線不只接近 20 日線，還一度跌破了 20 日線，之後再轉為上漲，形成「趨勢再次加速型」的烏嘴。在烏嘴形成前夕，對 20 日線出現下半身的大紅線，就是絕佳的暫跌買進點。


    由於上漲趨勢還在持續中，因此 20 日線依然向上。5 日線以比 20 日線更陡峭的角度上漲，點亮趨勢加速型的烏嘴訊號，是相當強勁的上漲趨勢。


    趨勢加速型的烏嘴發生前夕，大都會出現紅線、點亮下半身訊號。在烏嘴發生之前，5 日線與 20 日線當然勢必會接近到幾乎快要交叉，因此該下半身訊號大都不僅向上穿破
    5 日線，還會以強勁的力道延長氣勢，完美穿破綠色的 20 日線。


    當下半身／反下半身不只突破 5 日線，同時還突破了多條均線時，表示訊號相當強勁——線圖走勢往往會按照這條法則展開。


    ### ● 烏嘴前夕的下半身是最佳買點


    下頁圖 42 是在下跌趨勢加速時出現的反烏嘴案例。藍色的 60 日線緩緩下降，綠色的 20 日線從略带下跌意味的盤整走勢轉為下跌，由此可知下跌趨勢依然持續。但是在圖中的
    A 區，K 線暫時飛越了 20 日線，之後雖然嘗試漲到 60 日線附近，卻失速下墜。5 日線被 K 線帶動而向上穿越了 20 日線，隨著形成反下半身的大黑線①一起急速下跌，接著與往下走的
    20 日線交叉，一個漂亮的銳角反烏嘴便完成了。


    如同圖 42 所示，在下跌趨勢持續的過程中，均線由上到下的排列順序經常會是 60 日線 > 20 日線 > 5 日線，呈現反 PPP 的狀態。但是在反烏嘴形成之前，該排列就變成了
    60 日線 > 5 日線 > 20 日線。


    # 110 日本股神的訊號判讀教室


    ### 圖 42 反烏嘴使下跌趨勢加速的案例


    ![](img/fb5596eb257d02539bd30843d1962796_109_0.png)


    ### 圖 42 的簡單解說


    線圖趨勢雖然加速下跌，但圖中 A 區曾一度反轉上漲。不過，在 A 區中依然下跌的 60 日線，形成阻礙上漲的壓力線，不妨在無法突破 60 日線之處，做好賣出的準備，在反下半身①放空。之後，5
    日線與 20 日線完成反烏嘴，可以繼續賣出，同時運用 9 日法則找出獲利了結的時機——這就是相場教室諄諄教誨的買賣戰略。即便反 PPP 崩壞，只要尚未轉向盤整，股價就還不會馬上轉而上漲。


    之後，此均線排列再度回到 60 日線＞ 20 日線＞ 5 日線的反 PPP 狀態之際，就形成了下跌趨勢再次加速的明確訊號，幾乎可以肯定將會發生反烏嘴。把這套流程牢記在心，碰到烏嘴前夕的反下半身訊號時，就可以毫不猶豫地賣出了！


    5 日線與 20 日線交織而成的烏嘴／反烏嘴角度越大，其下方的 K 線氣勢就越強，獲利也會不斷向上累積。當你持有多方部位，且 K 線在 5 日線之上氣勢如虹的往上漲；或是持有空方部位，且股價直直往
    5 日線下方跌落時，只要在一旁欣賞股市變動就能賺錢，沒有比這還要更幸福的時刻了，簡直是投資人享盡便宜的大好光景。


