    # 相場獨創訊號③：


    # 分歧


    ![](img/fb5596eb257d02539bd30843d1962796_112_0.png)'
  - '[PAGE 113]


    # 藉助分歧，把趨勢加速變獲利


    強勁的上漲趨勢持續時，線圖就會呈現 K 線＞短期線＞長期線的 PPP 排列狀態。即便股價稍微下滑，只要期間最長的藍色 60 日線仍然向上，次長的 20 日線也維持向上的話，就可以視為長期的上漲趨勢。


    只是，上揚趨勢長期持續的話，累積了未實現利益的多方買家就會開始結清、獲利了結，通常會發生暫時性的股價下跌。


    就像被股價的跌勢帶動似的，當向下走的 5 日線接近 20 日線後，再次往同一個趨勢方向變動的情況，就稱為「分歧」。重點在於兩條均線僅是接近，並沒有交叉。如同圖
    43 的概念圖所示，上漲趨勢中的「分歧」，是 5 日線向下接近位於下方的 20 日線附近，但並沒有碰到 20 日線、也並未穿過去，而是說聲「再見！」後又再轉為向上，離開
    20 日線。下跌趨勢的情況則相反，持續向下推移的 20 日線位在 K 線與 5 日線的上方，此 20 日線雖然一度往 5 日線靠近，卻沒有交叉，而是揮揮手再度離開、繼續下跌的變動模式。


    無論什麼樣的上漲趨勢，都還是會擔心買在高點。這時請務必記住「相機式暫跌買進」手法——在暫時降到位於股價下方的均線之後，再次上漲之時，即可便宜買進。一般的暫跌買進都是買在下跌的'
  - '[PAGE 114]


    黑線處，但是在相場式中，會在「暫時下跌，又要開始漲的時候」買進。反彈脫手的情況則相反。


    下跌趨勢的狀態下，在股價漲到往下走的 20 日線及 60 日線等上漲壓力線的位置後，趁著反轉下跌的時機「反彈脫手」，這是正統派的做法。當需要預測暫跌買進或反彈脫手的時機，決定實際進場點時，「分歧」即為相當有效的訊號。名字聽起來帶有一絲哀愁，但是威力與準確度可是出類拔萃。初學者也可以在不知不覺間乘著趨勢買賣，提高獲利。


    ![](img/fb5596eb257d02539bd30843d1962796_114_0.png)'
  - '[PAGE 115]


    某種意義上，**分歧就像是矯正石膏，幫助你學會股票投資最基本的「跟隨趨勢」技巧**。當你根據分歧訊號亮燈而進行暫跌買進或反彈賣出時，就能自然學會如何沿著趨勢的走向買賣、在哪裡進場較容易成功、該在哪條線上獲利了結或停損等。那麼具體來說，要在哪裡進場，又該在哪裡獲利了結呢？


    分歧就如同第五章解說過的鳥嘴，屬於紅色 5 日線在接近綠色的 20 日線後，再度離開 20 日線的形式。這個過程中，K 線大都會突破 5 日線，點亮下半身或反下半身訊號。


    圖 44 是 SUMCO 的股價，圖中呈現漂亮的上漲趨勢。如果分歧訊號出現在這樣的上涨走勢中，就要瞄準**下半身且 K 線跨越 5 日線的紅線處買進**。不過，即便在
    5 日線上方再度跳出的 K 線是黑線，只要持續上漲的 5 日線看似即將離開 20 日線，則買進也 OK。'
