    ## 下墜趨勢中的分歧判讀更簡單


    言歸正傳。分歧是指示目前為止的趨勢暫時停歇後，再次加速的訊號。既然股票的價格變動為「上漲慢吞吞，下跌砰一聲」，看準更加強勁的下墜趨勢，就更能讓獲利幅度增大。


    圖 47 中，持續下跌的 AEON 雖暫時轉為盤整，但 20 日線、60 日線都往下走，再次進入下墜趨勢。


    在這當中，股價雖然嘗試反彈，但是 A 區的紅線①未能達到 60 日線，第二天黑線②向下突破 5 日線，點亮反下半身訊號。曾經一度接近綠色 20 日線的 5
    日線，也快速跌到 20 日線下方，從紅線①開始算起，到第七根紅線出現為止，下墜趨勢一直持續。


    這就是在下墜趨勢中的分歧訊號。若想算下墜趨勢中的王道買賣手法——反彈脫手來瞄準獲利，那麼②的反下半身就是不容錯過的重要訊號。


    ## 圖 47 暗準下跌趨勢中的分歧訊號，反彈脫手


    ![](img/fb5596eb257d02539bd30843d1962796_124_0.png)


    ### 圖 47 的簡單解說


    股價的下跌劇烈快速，所以開始下跌的時候，通常很難掌握賣出時機。因此趁著股價暫時反轉上漲、隨後失速的時機脫手賣出，會是比较聰明的戰略。原本向下的 5 日線朝著
    20 日線開始往上升的時候，就要考慮「說不定會變成分歧」，理想情況是事先預測下一步與下下一步。不妨在反下半身訊號位置賣出，並透過第八章將會說明的「淺線黑紅訊號」處增加空方部位，把分歧之後的加速跌勢轉換成獲利。


    B 區的黑線③的反下半身訊號，因下一根紅線④的出現，而以騙線告終。不過，隨著又一根跨過 5 日線的下跌黑線⑤出現，原本盤整的 5 日線再度轉為向下。藉著在黑線⑤做空，從該處算起到第九根
    K 線為止，就能把相當大幅的下跌轉換成獲利。


    圖 47 的情況下，因為下跌速度急遽，K 線及紅色 5 日線位在距離綠色 20 日線相當遠的地方，很難運用分歧等藉由 20 日線來判斷買賣的訊號。此時能夠派上用場的，就是黑色的
    7 日線及淺綠色的 10 日線。一旦發現股價以「5 日線接觸 10 日線之後跳水，再接觸之後再跳水」的節奏持續下跌時，不妨搭上 5 日線對 10 日線的上下變動，更容易賣出。


    圖 48 的 MonotaRO 的股價也是典型的下跌趨勢。


    看到大黑線出現，正以為會大幅下跌時，股價卻反彈了，A、B 區的 K 線碰到了位於上方的藍色 60 日線。但是只要 K 線並未明確地往上突破那條從盤整轉往下走的
    60 日線，就不要緊。


    A、B 區都在 K 線以黑線碰到 60 日線後反彈的隔天轉為下跌，分歧訊號亮燈，是絕佳的放空時機。以 A 區而言，黑線①在碰到 60 日線之後的反下半身②即為賣出時機；B
    區的話，在③的黑線之後大幅跳空跌破 5 日線的反下半身黑線④是賣點。


    ## 圖 48 劇烈震盪的下跌趨勢中的「分歧」


    ![](img/fb5596eb257d02539bd30843d1962796_126_0.png)


    黑線④之後雖然暫時轉為盤整，但是秉持「只要沒有明確向上穿過 5 日線，就繼續交易」的方針，從黑線③開始數到第九根 K 線都繼續賣，就能擴大獲利。在那之後雖然反轉上漲，但是被綠色的
    20 日線阻擋，在黑線⑤又下跌。即便賣在下一個下半身⑥，也能成功交易。考慮目前為止的走勢，在黑線⑤賣出也是可行的。


    趨勢再次加速的訊號——分歧，會在線圖的中長期均線（20 日線、60 日線）以 45 度傾斜推移的時候頻繁出現。請將本書介紹過的線圖烙印在腦海，當感覺到「45
    度傾斜」的時候，請反射性聯想到「要搭上分歧訊號，在下半身處趁下跌買入、反下半身處反彈脫手」。請務必熟習強勁趨勢的波動模式。


    **然而，買了股票的人，總有一天會為了獲利了結而化身為賣方；如果是做空，也會為了把股票買回來而搖身一變成為買方。** 買股票的人大都是中長期投資人，做空的人則大都是想在短期內賺錢的人，因此回補的時間也往往會是短期的。故而下跌趨勢中就容易發生股價的劇烈震盪，請務必記住這一點。


    # 第 7 章


    ## 相場獨創訊號④：N 大


    ### 能駕馭 N 大就能駕馭大行情


    我說過很多次，股票總是漲了又跌，跌了又漲。如果用英文字母來表現這樣的走勢，那就是大寫「N」。N 字形的股價波動為「上漲→下跌→再上漲」。更嚴謹一點地定義 N
    字形波動的話，即為「股價上漲後雖然暫時下跌，但並未回到起始的低點，又轉為上漲」的變動情形。股票為了持續上漲，大前提就是「不跌到之前的低點」。也就是說，正因為有
    N 字形價格波動的累積，股價才能夠持續上漲。此 N 字形的變動模式，並不僅限於股價。


    第六章曾解說的「分歧」訊號，是原本與 20 日線朝著同樣方向的 5 日線反轉，接近 20 日線後，再次與 20 日線說「再見！」並離開 20 日線的情況，整體看起來就是一個大寫
    N 字形。在這當中，**5 日線與 20 日線交叉、趨勢轉換之後立刻發生的 N 字形變動，很容易引發股票整體的大行情**——這是我在巨細靡遺觀察眾多線圖之後，確切得出的結論。


    因此，我為該訊號取了一個有別於分歧的名稱：「N 大」。N 大和第六章解說過的分歧很接近，但是 N 大會發生在趨勢轉換或漲跌趨勢加速的起始階段，正因如此，才更容易掌握獲利幅度，能夠幫助投資人大賺一筆。為了強調這一點，於是取名「N
    大」。


    圖 49 是此訊號的概念圖。


    ![](img/fb5596eb257d02539bd30843d1962796_130_0.png)


    紅色的 5 日線由下向上穿越綠色 20 日線，但又暫時下跌到接近 20 日線，但是並未穿破，隨後反轉上漲的情況，就是「N 大」。


    5 日線由上往下穿破 20 日線後，反轉上漲到 20 日線附近，但是沒有再往上突破，而是再度下跌的情況，就是「反 N 大」（當股價變動沒形成 N 字形，而是呈現
    W 或 M 的形狀時，也可以稱為「W 大」「M 大」）。


    N 大、反 N 大有時也會發生在趨勢轉換的最早階段，之後經常會連動大行情。不過，乍看之下，很容易發生「趨勢轉換看似要以失敗告終，結果卻沒有結束，形成小幅震盪走勢，因而錯失訊號」的情況，必須特別留意。N
    大是反映趨勢轉換的大賺機會，錯過的話就太可惜了。


    圖 50 的 MonotaRO 線圖中，從高價圈開始，股價伴隨著反 N 大訊號跌破藍色的 60 日線，均線的排列也一瞬間就湊齊了 60 日線＞20 日線＞5
    日線，呈現反 PPP 狀態。但是股價隨後便在圖中由長下影線黑線①創下低點，反轉上漲。5 日線立刻就向上穿越了 20 日線，不上也不下，小幅震盪了一陣子後，又暫時跌到
    20 日線下方，紅線②創下了最低點，接著轉為華麗的上漲。5 日線往上突破了朝下走的 20 日線，雖然不是最典型的模式，但是以②的紅線為起點，③的紅線突破了
    5 日線，形成下半身，從②開始數到第九根黑線為止，都完全符合 9 日法則，接連反轉上漲。


    ## 圖 50 趨勢轉為上漲時的「N 大」訊號


    ![](img/fb5596eb257d02539bd30843d1962796_132_0.png)


    ### 圖 50 的簡單解說


    股價有一種習性，就是會測試「原本的壓力線，往後是否會成為支撐線」。5 日線在向上穿過 20 日線後暫跌到 20 日線附近，再次轉為上漲——此現象即為 N 大訊號，也是符合此習性的訊號。如圖所示，股價以反
    N 大形式急跌之後，從最低點①反轉上漲，在紅色虛線框框內的盤整期間中，發生 N 大訊號。股票實戰中難免容易漏看，但是一旦發現在②的紅線、③的下半身訊號後連續出現紅線，就要想到「這可能是
    N 大」。請務必注意 5 日線的 N 字形曲線。


    或許這麼說有點奇怪，不過請你只看均線就好。5 日線穿過 20 日線後雖然暫時下跌，卻沒有低於 20 日線，而是描繪出大寫 N 字形後上升。如果要在②的紅線處試探性買進，即是把第二次回到
    2500 日圓之處作為依據。接著在有預感將會形成 N 大訊號的③下半身處追加買進，來到下一根紅線④附近時，N 大就完成了。接下來，紅線⑤突破了最近一次小幅震盪的高價圈，並且持續上升，進一步突破藍色
    60 日線，不妨在這裡再次追加買進。第二章曾解說過股價關卡的模式：一開始原本具備壓力線的作用，後來變身為股價下跌時的支撐線。若換成均線的版本，即是 N 大訊號。


    下跌趨勢持續，過去一直阻礙著股價及 5 日線漲勢的 20 日線，被 5 日線突破。之後，當你開始考慮「20 日線至今一直是壓力線，但接下來會不會變成上漲的支撐線呢？」時，5
    日線跌到 20 日線附近。就在你覺得「果然變成了支持上漲的支撐線了！」之時，轉為反彈上升。透過 5 日線可以確認，過去原本是壓力線的 20 日線，也能夠發揮支撐線的功能，這樣的變動也可以稱為
    N 大。


    股價的大幅變動基本模式，是從下跌趨勢經歷盤整，再轉換為上漲趨勢。在這層意義上，我們也來看看從盤整走勢開始發生 N 大訊號，進而轉換成上漲趨勢的模式吧。


    ## 圖 51 從盤整定勢到形成 N 大，再轉換為上漲趨勢


    ![](img/fb5596eb257d02539bd30843d1962796_134_0.png)


    上頁的圖 51 的任天堂在下跌趨勢之後，一直呈現盤整，但是 5 日線不再更新低點，散發出打底的气息。這時候，①的紅線雖然由往上穿破 5 日線、20 日線，形成下半身，趨勢卻並未上漲。由此可知，相場式訊號中的傳家寶刀——下半身，在
    5 日線呈現近乎平坦的盤整時，也有可能發揮不了作用。


    之後，②的黑線向下穿破了 5 日線、20 日線，看似即將再度下跌，結果在③的地方，以一根大紅線形式成功反轉，完全抵消黑線②的跌幅，挑戰了最新的高點，並且完全貫穿
    5 日線到 20 日線等均線，形成下半身。受到此現象影響，原本下跌到 20 日線附近的 5 日線再度轉為上升。


    隔天，向上跳空、穿破盤整高點線的紅線④登場，5 日線也往走，雖然有點不容易看出來，但是 N 大訊號已亮燈。之後雖然仍有下跌走勢，但也持續創新高點，發展出大行情。


    進行實戰時，我建議在③的下半身試探性買進，接著在④的紅線增加買單，突破了 60 日線的⑤的紅線再追加買進。然後在⑥的黑線先暫時把部位清空，這樣的買賣策略是有效的。


    ## 反 N 大更容易形成大行情


    以「上漲慢吞吞、下跌砰一聲」的意義來看，反 N 大所連動的大行情威力，可說是相當驚人，因此當盤圖看似將要進入下跌趨勢時，就要虎視眈眈地觀察是否發生反 N 大訊號。如下頁圖
    52 的 SUMCO 所示，股價從下跌走勢暫時轉為盤整之後，再度大幅下滑。這個時候出現的就是反 N 大訊號。


    圖中的 A 區，一群密集的均線被黑線①以反下半身穿過。然而股價並沒有就此急速下跌，而是在有長下影線的黑線②止跌，轉而反彈上漲。雖然持續上漲，但是 K 線③、④、⑤全都留下了長長的上影線，股價看起來很難拉抬。這個時候，請務必想到：「股價已經跌破
    20 日線、60 日線，可能會形成反 N 大訊號。」


    看到 K 線③、④、⑤氣勢低落的樣子，就可以預測到接下來黑線⑥或許會往下穿破 5 日線，形成明顯的反下半身。這樣一來，便能自信判斷：「這表示反 N 大訊號可能會亮燈，要乘勝追擊。」就此賣出。


    後續發展就如你所見，從⑤的紅線開始，到第九根的紅線出現為止，股價遵循 9 日法則持續下跌。


    ![](img/fb5596eb257d02539bd30843d1962796_137_0.png)


    ![](img/fb5596eb257d02539bd30843d1962796_137_1.png)


    ### 圖 52 的簡單解說


    5 日線與 20 日線交叉之後，一開始發生的分歧訊號就成了顯示趨勢轉換後加速價格波動的訊號——N 大／反 N 大。圖 52 是反 N 大連動大行情的絕佳實例。用更宏觀的角度來看，綠色的
    20 日線向下穿破藍色的 60 日線之後，隨著紅線⑤反彈而接近了 60 日線，接著再度以⑥的反下半身離開，20 日線對 60 日線也發生了反 N 大訊號。這則案例讓我們看到，在紅線及黑線不斷連續發生的大行情中，用
    9 日法則獲利了結的買賣策略更能派上用場。


    在訊號點亮後才猛然察覺買賣機會，以及在訊號點亮前就發現並做好準備，兩者的投資成績將有天壤之別。


    **在訊號出現前就事先預測，做好應對的準備。** 以考大學來比喻的話，這就跟事先購買考古題庫，不斷練習解題、做好準備一樣，是基本中的基本。


    在反 N 大訊號中，經常出現「暫時下跌後又反轉上漲的走勢，在持續相當長的時間之後，依然下跌」這種費時很長的模式。這一點在 N 大訊號時亦然，會發生「暫時上漲後，花了很長時間才下跌並轉為盤整，最後還是上漲」這種模式。


    下頁的**圖 53**的 AEON 就屬於這種「反轉上漲走勢持續很久」的反 N 大訊號。而且不只是 20 日線，連 60 日線也形成了反 N 大訊號。


    ## 圖 53 60 日線出現反 N 大訊號的案例


    ![](img/fb5596eb257d02539bd30843d1962796_139_0.png)


    首先，股價以大黑線①的形式華麗穿越 60 日線後，在有下影線的黑線②暫時止跌，反轉上漲。③的大紅線飛越 5 日線形成下半身，就這麼超越 60 日線，恢復上漲趨勢——這樣的劇情發展，非常有可能發生。


    然而，下一根大黑線④碰到 60 日線便無力下跌。此處也請將「因反 N 大訊號亮燈而導致的加速下跌」當成其中一種可能發生的劇情走向。


    之後，股價卻並未如預期般馬上發生波動。股價在圖中 A 區雖然無法越過 60 日線，卻也沒有下滑，持續盤整狀態。打破此僵局的是跌破 5 日線、點亮下半身訊號的黑線⑤。原本盤整推移的
    5 日線，也因黑線⑤的出現而無力下滑，讓人強烈意識到：「反 N 大訊號可能差不多要亮燈了！」於是在這裡嘗試性賣出，然後在下一根黑線⑥的地方增加賣單。這之後雖然出現了紅線⑦，但是根據其他均線的排列角度，此時仍應忍耐持股，等到反下半身⑧的地方再追加賣出也無妨。另一個正確的考量是，由於紅線⑦並未越過
    5 日線，所以不要賣完，靜心等待下跌即可。


    圖 53 帶來的啟示是，反 N 大訊號不只局限於「5 日線對 20 日線畫出反 N 字形」，有時候也會發生在「5 日線對 60 日線」的情況。不要受困於固有想法，要隨時臨機應變、彈性思考，當下的判斷，也會影響獲利或損失，這在股票投資上是非常重要的。


    股價的暴跌經常被比喻為「尼加拉瀑布」，但是在瀑布般的暴跌發生之前，經常會出現 N 大訊號，就像是最後的掙扎。下頁圖 54 的 AEON 股價即是在往上走的
    60 日線上方持續緩慢地上漲，卻在①的黑線形成反下半身時穿透了 60 日線。即使在上涨趨勢持續的過程中，也經常會有 K 線跌破較低價均線的情況。


    ## 圖 54 反 N 大走向暴跌的模式


    ![](img/fb5596eb257d02539bd30843d1962796_141_0.png)


    實際上，在①的反下半身之後，股價在十字線②創下低點，以收盤價來看，足足漲了六根 K 線。再次越過 60 日線後，持續漲到③的紅線處。


    在這樣的狀況下，也可以判斷「這是上漲趨勢中的暫時下跌，可以買進」，但令人在意的是①的大黑線出場，導致 5 日線不只跌破了 20 日線，更跌破 60 日線。由於上漲趨勢中的暫跌買進訊號——分歧，是指「5
    日線並未接觸下方的長期線，就反彈上漲」的情況，因此圖中的走勢並不是分歧。這時不免感覺「怪怪的」，仔細觀在線圖，會發現反下半身④出現，一口氣打破了從 5 日線到
    60 日線都密集聚攏的區域。


    在此區域中，雖然還存有回歸上漲趨勢的可能性，但我希望可以想到，這也有可能是隨著反 N 大訊號亮燈，導致大暴跌即將來臨的劇情發展。


    接著，從反下半身④開始大幅跳空下滑的黑線⑤登場，正式宣告反 N 大訊號亮燈。在這個時間點上，雖然仍無法判斷之後是否會發生尼加拉瀑布般的暴跌，但是一看到黑線⑤，即可完全拋下目前為止關於上漲趨勢的記憶。讓腦袋歸零、煥然一新，扎實展開做空策略。


    最後要介紹第 145 頁圖 55 的 N 大訊號，此圖屬於「原本隨著股價一起越過 20 日線的 5 日線，因為股價的盤整、下跌而暫時跌破了 20 日線，隨後卻急速轉為上漲」的模式。如圖所示，下方的
    60 日線始終往上走。也就是說，即便是在上漲趨勢持續中的暫跌買進場面，也可能會發生 N 大訊號。


    如圖所示，①的紅線讓 5 日線上升到 20 日線之上。略微上漲後，持續了一段長時間的盤整狀態，隨後因②的黑線，導致 5 日線跌到 20 日線之下。在這層意義上，此現象雖有別於典型的模式，但是自此開始，③的大紅線形成下半身，轉換為上漲趨勢。大紅線③也超越了自從
    5 日線越過 20 日線以後的最新高點。下一根紅線④的地方，5 日線也越過最新的高點往上升，這個時候，N 大訊號即可判斷亮燈。


    股價的波動模式中，除了「單純的持續上漲、持續下跌」之外，「看似上漲，卻又下跌，最後還是上漲」「看似下跌，卻又上漲，結果還是跌了」這種「怪胎似的波動」反而更接近股票的本質。這也是理所當然的，畢竟股價若是上漲，一定會有多方獲利了結；從投資人心理的角度來看，趨勢會轉換或是持續，端看投資人在生死關頭時的猶豫不決：「究竟該如何行動？」而能夠將投資人的迷惘心理，以及甩開迷惘、斷然交易後的價格波動加以具體呈現、萃取精華的訊號，即為
    N 大與反 N 大。


    ## 造成上漲趨勢加速的不規則 N 大訊號


    ![](img/fb5596eb257d02539bd30843d1962796_144_0.png)


    ### 圖 55 的簡單解說


    圖 55 中，從 5 日線到 20 日線的均線皆密集聚攏，並往 60 日線靠近，因此可判斷趨勢將轉為下跌。乍看紅線①的下半身，會誤以為「接下來要上漲了」，結果卻再度進入盤整。在黑線②穿破了
    20 日線之處，雖然可判斷「之後可能就止下跌」，但看到下半身訊號③後，就該確信「依然會是上漲趨勢」。5 日線幾乎要碰觸到 20 日線，卻也因紅線④而轉為急速上漲，因而形成了兼具鳥嘴型態的不規則
    N 大訊號。


    # 第 8 章


    ## 相場獨創訊號⑤：淺綠黑紅


    ### 六、靈活運用淺綠黑紅，就能安心放大獲利


    「淺綠黑紅」是相場式訊號中的全新發明。光聽名字的話，感覺像是某種馬飼料，不是的！在相場式線圖判讀技巧中，「淺綠色」是指 10 日線，「黑色」是 7 日線，「紅色」則是
    5 日線。只要活用 5 日、7 日、10 日這三條短期均線，初學者也能夠扎實且安心地買賣，還能夠不斷放大獲利。「淺綠黑紅」，是我所研發的提高獲利訊號。


    剛開始投資股票的人，一想到「賠錢」就害怕，對交易本身感到恐懼與焦慮，經常錯過難得的機會。一旦開始獲利，又會因為害怕獲利減少而快速獲利了結，錯過大筆財富——這樣的情況也屢見不鮮。


    在恐懼與不安當中進行股票交易，勢必將造成精神負擔，交易成績也無法進步。對於這樣的初學者，我想告訴你們，世界上其實存在著一種神奇的訊號，「只要訊號出現就買賣，不需要為了多餘雜訊而感到猶豫，就算完全只靠這個訊號，也可以不斷累積獲利」。引導你們飛向獲利天堂的訊號，就是淺綠黑紅。


    在三條短期均線重疊，形成一條線的狀態之後，以紅（5 日線）＞黑（7 日線）＞淺綠（10 日線），或淺綠（10 日線）＞黑（7 日線）＞紅（5 日線）的順序排列，隨後分別向外分別擴散，同時上漲或下跌的時候，就表示淺綠黑紅的訊號完成了（圖
    56）。

