    再加速」，在能夠獲利的期間內，通常會發出許多訊號，就像在呢喃私語：「接下來股票會漲哦、會漲哦。」「接下來會跌唷、會跌唷。」這些聲音絕對不是幻聽，請放心。千萬別漏聽了相場式訊號發出的各種聲音，就算無法達到「耳聽八方」，但請你盡量別遗漏眾多訊號的各自主張，要練到能夠自然看懂線圖的境界，因為那才是讓投資成績飛猛進的王道之路。


