    ## 烏嘴形成之前，發生下半身的機率極高，這就是「烏嘴前夕」


    不妨牢記這則相場公式。特別是上頁圖 37 的烏嘴 b，隨著大紅線②上漲，原本盤整的 20 日線也轉為向上，而 5 日線更進一步以相當陡峭的上升角度追過這條
    20 日線，形成烏嘴。可以判斷兩者的角度越尖銳，股價的氣勢就越強。


    接下來，也一併看看**顯示趨勢轉為下跌的訊號——「反烏嘴」**典型案例吧。圖 38 的 SUMCO 股價從左側的上漲走勢 C，經由短期的盤整 B，完成了典型的「反烏嘴進入下跌趨勢」。


    ③的形狀看起來像是反烏嘴，但是在這個時間點，仍在藍色的 60 日線上方推移。之後股價跌破了 60 日線，以一種像是抓著往上走的 60 日線的形式反轉上升後，碰到綠色的
    20 日線，再次下跌。這時候，請注意不只是 5 日線，20 日線也已經往下走了。


    ### 轉為下跌趨勢的轉換訊號——反烏嘴


    ![](img/fb5596eb257d02539bd30843d1962796_100_0.png)


    ### 圖 38 的簡單解說


    20 日線跌到 60 日線之下後發生的反烏嘴訊號，不僅角度很尖銳，在此之前也出現了反下半身①，令人強烈預感到要進入正式的下跌趨勢了。這時候請看 5 日線的動向，會發現在跌破
    60 日線後短暫靠近了 60 日線又離開，這就是我們會在第七章解說的趨勢轉換訊號——反 N 大。再加上 5 日線對 20 日線出現的反烏嘴、對 60 日線出現的反
    N 大訊號，可說是一則顯示下跌趨勢變強的好例子。


    這樣的傾斜度，才是反烏嘴形成的前提條件。作為「反烏嘴前夕」的訊號，反下半身①以穿越 5 日線的黑線形式出現，「靠反下半身訊號做空」→「反烏嘴形成後進一步追加做空（或是繼續賣出）」這樣的買賣戰略是有效的。


    ### 均線的反應較遲緩，所以更容易預測


    均線是多個收盤價的平均值，因此其變動勢必會比 K 線遲鈍。很多人認為「反應較慢」是 K 線的缺點，不過我的想法不同。均線的反應比 K 線更為遲鈍，因此一旦趨勢往下走，即便最新的一根
    K 線呈現略微往反方向推移（向上）的變動，均線整體的趨勢依然是持續往下。


    也就是說，相較於隨心所欲的 K 線，均線在某種程度上更容易預測未來的走勢發展。


    根據這樣的性質，在烏嘴前夕的反下半身處於股價下跌之時，就可以事先預測「接下來，位於 20 日線上方的 5 日線也會被股價帶動，一口氣往下跌，這就表示將會形成反烏嘴訊號，該賣出了！」於是進場做空。實際上，一旦趨勢如同預測般持續下跌，形成反烏嘴，已經持有做空部位的你，只需要盡情欣賞線圖走勢就好。


    圖 39 是任天堂的「考古線圖」。此圖並不是按照標準模式的「上漲→盤整→下跌」，而是上漲後休息一陣子，盤整推移後上漲趨勢再次加速時，出現烏嘴。


    ![](img/fb5596eb257d02539bd30843d1962796_102_0.png)


    請務必記住以下這條「均線公式」：


    **從短期線到長期線，當不同期間的均線集中聚攏在同一處時，之後大多會向上或向下大幅變動。**


    **圖 39** 左側顯示股價大幅急漲後暫時略微向下、盤整推移，隨後又急速上漲的變動情況。觀看急漲前的均線會發現，從紅色的 5 日線到 20 日線都集中擠在狹窄的範圍內，每一條均線都微微往下推移，令人忍不住猜測「是否會跌？」的時候，就急速轉而上漲了。這波急漲的開端，始於一口氣從
    5 日線穿破到 20 日線的下半身①。


    這根紅線①形成了烏嘴前夕，之後紅線②、③登場，點亮烏嘴訊號。20 日線雖然看似盤整，但這時候，紅色的 5 日線與黑色的 7 日線、淺綠色的 10 日線在形成更短期的烏嘴的同時依序上漲，可以藉此推測上漲的氣勢強度。


    接著也一併看看相反的情形「下跌→盤整→下跌」吧。**圖 40** 的 AEON 在持續大幅的下跌趨勢後，打底反轉。然而，往下走的 60 日線在成為阻礙上升的壓力線的同時，逐漸轉到盤整走勢。在那之後，出現了①的反下半身。在這個時點，均線從
    5 日線到 20 日線為止幾乎重疊成一直線，密集聚攏在一起。如果記住了剛才的「均線密集後會有大動作」的法則，就會懂得在①的反下半身迅速做空，在之後的連續黑線處獲利。


    在下跌的過程中，從綠色的 20 日線到紅色的 5 日線為止，所有均線都已經朝下，5 日線與 20 日線以形狀銳利的烏嘴形式交叉。從此處開始「只要欣賞就好」，你已經在初期階段就做好準備，將此連續出現黑線的下跌趨勢收入囊中了。


    ### 圖 40 轉換成下跌趨勢的訊號——反烏嘴


    ![](img/fb5596eb257d02539bd30843d1962796_104_0.png)


    稍稍把話題岔開一下，圖 40 的急跌局面中連續出現黑線，從形成反下半身的大黑線①開始數起，直到第九根結束，第十根就出現了紅線。雖然之後又再次出現黑線，稍稍下跌了一些，但是幾乎吻合我們在第三章看過的
    9 日法則。如同第三章解說過的，9 日法則確實是一種非常活躍優秀的價格波動指標，請絕對不要忘了養成習慣，時常細數線圖上的 K 線根數。


    ### 烏嘴在暫跌買進、反彈脫手時也能派上用場


    5 日線與 20 日線的交叉，並非只會發生在趨勢轉換時。當原本持續上漲的股價下跌，帶動 5 日線暫時跌到 20 日線下方，再急轉而上，由下往上突破 20 日線的時候，也會發生交叉現象（圖
    41）。與其說是趨勢轉換，不如說是原本的趨勢暫時失速之後再度加速，因而出現「暫時性下跌或反彈」中的烏嘴訊號。


    此訊號和第六章將要介紹的分歧模式相當類似，若能靈活運用這類型的烏嘴，就能趁早搭上「趨勢暫時停歇→再次加速」的列車，是一種可以迅速指示「暫時性下跌搶進買點」或「反彈脫手賣點」、獲利率很高的訊號。


    ### **圖 41  烏嘴使上漲趨勢再次加速的案例**


    ![](img/fb5596eb257d02539bd30843d1962796_106_0.png)


    ### **圖 41  的簡單解說**


    如圖所示，在上漲趨勢持續的過程中，發生好幾次股價暫時下跌的買點。畫面左側出現了紅色的 5 日線接近綠色的 20 日線之後又離開的「分岐①」（參照第六章）。之後畫面右側顯示，5
    日線不只接近 20 日線，還一度跌破了 20 日線，之後再轉為上漲，形成「趨勢再次加速型」的烏嘴。在烏嘴形成前夕，對 20 日線出現下半身的大紅線，就是絕佳的暫跌買進點。


    由於上漲趨勢還在持續中，因此 20 日線依然向上。5 日線以比 20 日線更陡峭的角度上漲，點亮趨勢加速型的烏嘴訊號，是相當強勁的上漲趨勢。


    趨勢加速型的烏嘴發生前夕，大都會出現紅線、點亮下半身訊號。在烏嘴發生之前，5 日線與 20 日線當然勢必會接近到幾乎快要交叉，因此該下半身訊號大都不僅向上穿破
    5 日線，還會以強勁的力道延長氣勢，完美穿破綠色的 20 日線。


    當下半身／反下半身不只突破 5 日線，同時還突破了多條均線時，表示訊號相當強勁——線圖走勢往往會按照這條法則展開。


    ### ● 烏嘴前夕的下半身是最佳買點


    下頁圖 42 是在下跌趨勢加速時出現的反烏嘴案例。藍色的 60 日線緩緩下降，綠色的 20 日線從略带下跌意味的盤整走勢轉為下跌，由此可知下跌趨勢依然持續。但是在圖中的
    A 區，K 線暫時飛越了 20 日線，之後雖然嘗試漲到 60 日線附近，卻失速下墜。5 日線被 K 線帶動而向上穿越了 20 日線，隨著形成反下半身的大黑線①一起急速下跌，接著與往下走的
    20 日線交叉，一個漂亮的銳角反烏嘴便完成了。


    如同圖 42 所示，在下跌趨勢持續的過程中，均線由上到下的排列順序經常會是 60 日線 > 20 日線 > 5 日線，呈現反 PPP 的狀態。但是在反烏嘴形成之前，該排列就變成了
    60 日線 > 5 日線 > 20 日線。


    # 110 日本股神的訊號判讀教室


    ### 圖 42 反烏嘴使下跌趨勢加速的案例


    ![](img/fb5596eb257d02539bd30843d1962796_109_0.png)


    ### 圖 42 的簡單解說


    線圖趨勢雖然加速下跌，但圖中 A 區曾一度反轉上漲。不過，在 A 區中依然下跌的 60 日線，形成阻礙上漲的壓力線，不妨在無法突破 60 日線之處，做好賣出的準備，在反下半身①放空。之後，5
    日線與 20 日線完成反烏嘴，可以繼續賣出，同時運用 9 日法則找出獲利了結的時機——這就是相場教室諄諄教誨的買賣戰略。即便反 PPP 崩壞，只要尚未轉向盤整，股價就還不會馬上轉而上漲。


    之後，此均線排列再度回到 60 日線＞ 20 日線＞ 5 日線的反 PPP 狀態之際，就形成了下跌趨勢再次加速的明確訊號，幾乎可以肯定將會發生反烏嘴。把這套流程牢記在心，碰到烏嘴前夕的反下半身訊號時，就可以毫不猶豫地賣出了！


    5 日線與 20 日線交織而成的烏嘴／反烏嘴角度越大，其下方的 K 線氣勢就越強，獲利也會不斷向上累積。當你持有多方部位，且 K 線在 5 日線之上氣勢如虹的往上漲；或是持有空方部位，且股價直直往
    5 日線下方跌落時，只要在一旁欣賞股市變動就能賺錢，沒有比這還要更幸福的時刻了，簡直是投資人享盡便宜的大好光景。


    <!-- no content -->


    第6章


    # 相場獨創訊號③：


    # 分歧


    ![](img/fb5596eb257d02539bd30843d1962796_112_0.png)


    ### 藉助分歧，把趨勢加速變獲利


    強勁的上漲趨勢持續時，線圖就會呈現 K 線＞短期線＞長期線的 PPP 排列狀態。即便股價稍微下滑，只要期間最長的藍色 60 日線仍然向上，次長的 20 日線也維持向上的話，就可以視為長期的上漲趨勢。


    只是，上揚趨勢長期持續的話，累積了未實現利益的多方買家就會開始結清、獲利了結，通常會發生暫時性的股價下跌。


    就像被股價的跌勢帶動似的，當向下走的 5 日線接近 20 日線後，再次往同一個趨勢方向變動的情況，就稱為「分歧」。重點在於兩條均線僅是接近，並沒有交叉。如同圖
    43 的概念圖所示，上漲趨勢中的「分歧」，是 5 日線向下接近位於下方的 20 日線附近，但並沒有碰到 20 日線、也並未穿過去，而是說聲「再見！」後又再轉為向上，離開
    20 日線。下跌趨勢的情況則相反，持續向下推移的 20 日線位在 K 線與 5 日線的上方，此 20 日線雖然一度往 5 日線靠近，卻沒有交叉，而是揮揮手再度離開、繼續下跌的變動模式。


    無論什麼樣的上漲趨勢，都還是會擔心買在高點。這時請務必記住「相機式暫跌買進」手法——在暫時降到位於股價下方的均線之後，再次上漲之時，即可便宜買進。一般的暫跌買進都是買在下跌的黑線處，但是在相場式中，會在「暫時下跌，又要開始漲的時候」買進。反彈脫手的情況則相反。


    下跌趨勢的狀態下，在股價漲到往下走的 20 日線及 60 日線等上漲壓力線的位置後，趁著反轉下跌的時機「反彈脫手」，這是正統派的做法。當需要預測暫跌買進或反彈脫手的時機，決定實際進場點時，「分歧」即為相當有效的訊號。名字聽起來帶有一絲哀愁，但是威力與準確度可是出類拔萃。初學者也可以在不知不覺間乘著趨勢買賣，提高獲利。


    ![](img/fb5596eb257d02539bd30843d1962796_114_0.png)


    某種意義上，**分歧就像是矯正石膏，幫助你學會股票投資最基本的「跟隨趨勢」技巧**。當你根據分歧訊號亮燈而進行暫跌買進或反彈賣出時，就能自然學會如何沿著趨勢的走向買賣、在哪裡進場較容易成功、該在哪條線上獲利了結或停損等。那麼具體來說，要在哪裡進場，又該在哪裡獲利了結呢？


    分歧就如同第五章解說過的烏嘴，屬於紅色 5 日線在接近綠色的 20 日線後，再度離開 20 日線的形式。這個過程中，K 線大都會突破 5 日線，點亮下半身或反下半身訊號。


    圖 44 是 SUMCO 的股價，圖中呈現漂亮的上漲趨勢。如果分歧訊號出現在這樣的上漲走勢中，就要瞄準**下半身且 K 線跨越 5 日線的紅線處買進**。不過，即便在
    5 日線上方再度跳出的 K 線是黑線，只要持續上漲的 5 日線看似即將離開 20 日線，則買進也 OK。


    ### 上漲趨勢加速的「在分歧點暫跌買進」


    ![](img/fb5596eb257d02539bd30843d1962796_116_0.png)


    至於獲利了結的時機，不妨在上漲結束、K 線以黑線收場的地方趁早逃走。只要 K 線還在 5 日線之上，即使是黑線仍持續買進。按照 9 日法則，直到 K 線往下穿破
    5 日線為止，仍能保有可觀的獲利。


    分歧發生後的股價漲勢當然也可能很快就結束，然而，分歧訊號的優點就在於能夠有效指示「上漲趨勢當中，跌下來就買，漲上去就賣」的時機，幫助我們扎實操作、累積小額獲利。


    如同圖 44 所示，當位於股價下方、支撐上漲趨勢的綠色 20 日線及藍色 60 日線呈現美麗的上升曲線，且上漲趨勢確實持續時，這樣的狀態更能提升分歧訊號的準確度。圖
    44 中，暫時下跌的 K 線必然會朝著 20 日線下跌，但隨後止跌回升，若能在此處以下半身形式飛越 5 日線，便足以確信「即將回歸上漲趨勢」，趁著暫跌買進。


    圖 45 是 MonotaRO 的股價，看下方的藍色 60 日線就會知道，圖中顯示持續平緩上漲的趨勢，這時候正是趁著股價稍微下跌時搶進、期待再次上漲的區域。如圖所示，從
    A 到 C 區，向下走的 5 日線來到綠色的 20 日線附近後，再次轉為上漲，發出分歧訊號。這時候的 K 線時而輕觸 20 日線，時而稍稍跌破 20 日線。


    以 A 區來看，具體的買點是在紅線突破 5 到 20 日線、形成下半身之處的「前一天」的①。之後受到③的紅線影響，5 日線也轉為朝上，分歧訊號亮燈，可以繼續買。從最下面的紅線開始數起，會發現雖然價格變動幅度很小，但是連續出現十根以上紅線，不妨按照
    9 日法則進行獲利了結，把在紅線①買進的部分，在第九根紅線的時間點獲利了結。在這個例子裡，後來也仍維持紅線，因此若想再進場一次，就在紅線與紅色的 5 日線開始接觸的那一帶買進。在這之後，在黑線向下穿破均線的黑線③賣出。


    ### 圖 45 上漲趨勢持續時的「相場式暫跌買進」戰略


    ![](img/fb5596eb257d02539bd30843d1962796_118_0.png)


    ### 圖 45 的簡單解說


    藍色的 60 日線、綠色的 20 日線往上走，很明顯是上漲趨勢。利用暫時性下跌買進，是最有效的戰略，而能夠告訴我們正確買點的關鍵，就是分歧訊號。圖中 A 至
    C 也是分歧，雖然在 D 發生了烏嘴訊號，但無論何者，買點都是股價轉為反彈上漲、以下半身往上穿破 5 日線的地方。被股價漲勢帶動 5 日線必然再度轉為上升，5
    日線與 20 日線之間發生分歧訊號。不妨在分歧點追加買進。


    接下來的 B 區，買點位在從④的黑線開始大幅越過 5 日線的紅線⑤之處，但是第二天之後持續冒出兩根黑線，以失敗告終。


    股票跟入學考試不一樣，沒有百分之百的正確答案。雖然很困難，但是一旦發現失敗，就要當機立斷，準備迎戰下一個訊號。這時候，C 區的上漲機會馬上就來了。C 區的紅線⑥是下半身，很明顯是買點。在那之後，從最下面的紅線（下半身⑥的前夕）開始數到第八根的黑線⑦，即可在此獲利了結。


    D 區之中，5 日線穿過了 20 日線，所以並不是分歧。5 日線反彈後與 20 日線以強勁的銳角交叉，形成了在第五章看過的烏嘴訊號。D 區中，大紅線與大黑線以交互跨越
    5 日線的方式出場，形成小幅上下震盪之後，在下一根紅線⑧的地方穿越 5 日線，點亮強勁的下半身訊號。不妨在這根紅線⑧買進，5 日線與 20 日線的烏嘴如果持續，就繼續買。


    目前為止的兩個例子，都是非常漂亮的上漲趨勢，但是也有 K 線突破 20 日線、往下跌到 60 日線附近的案例。圖 46 的任天堂股價線圖中，畫面左邊的下跌趨勢開始稍稍盤整一陣子，之後在①的紅線形成下半身，更突破了最新的高點線，雙重點亮了上漲的訊號。如圖所示，趨勢由盤整轉為上漲的時候，股價必定突破原先盤整走勢的上限，也就是高點線。像紅線①一樣以下半身形式突破最新一波高點的情況，其後多半會持續上漲。請務必記住這樣的場面。


    ### 圖 46 在分歧訊號時，趁暫跌買進的實戰範例


    ![](img/fb5596eb257d02539bd30843d1962796_120_0.png)


    實際上，股價在①的下半身位置往上彈，突破了往下走的 60 日線後又持續上漲。在綠色 20 日線越過藍色 60 日線的②點上，均線的排列為 5 日線＞ 20
    日線＞ 60 日線，也形成了 PPP 狀態。


    之後，有著長下影線的小紅線③雖然朝著 60 日線推移，但是 60 日線的支撐作用，擋住了這波下跌。


    在小紅線③之後，很有可能再次出現黑線、跌破 60 日線，因此不在此買進。不過，圖中的止跌走勢顯示了「60 日線是擋住股價下跌的緩衝（支撐帶）」，在實戰中經常出現這種模式，所以當看到③的止跌後，就要很自然地在腦海裡浮現這樣的劇情發展：「接下來也許會以
    60 日線為支撐線，反轉上漲。」


    ## 從 K 線的起點預測股價的壽命


    在那之後連續出現紅線，在 A 區形成了紅線④越過 5 日線的下半身訊號。5 日線跟 20 日線也在若即若離的微妙時刻反轉上漲，點亮分歧訊號。這時在下半身④買進，在紅線持續出現的過程中持續買進，從最低點的長下影線小紅線③開始算起的第八根黑線，以
    9 日法則來看，即為獲利了結的時機。


    我說過很多次了，在考慮獲利了結時機的時候，請不斷留意 9 日法則。計算「哪根 K 線開始是上漲趨勢的起點，從該起點計算目前漲到第幾根」，然後預測漲跌的「壽命」。


    在 B 及 C 的區域中，也發生了分歧訊號。C 區的分歧雖然接續著大紅線⑤、⑥，但是第二天就大幅跳空下跌，跌破 5 日線，來到黑線⑦。這根黑線⑦是由上往下穿破
    5 日線的反下半身。一旦分歧之後的上漲期間變短，或是 K 線看似將大幅向下跌破 20 日線，就要意識到「上漲的態勢趨緩了，接下來有可能下跌」。


    在這之後，股價沒有再回到 5 日線之上，5 日線往下穿過了 20 日線。接著，黑線⑧大幅跳空、在藍色的 60 日線下方登場。黑色的 7 日線、淺綠色的 10
    日線也都穿破了 20 日線，形成反烏嘴訊號。此處可以判斷「上漲趨勢已經結束」，暫停做多。相反的，由於明顯將進入下跌趨勢，不妨在反下半身的黑線⑦做空。


    稍微岔開一下話題，若說到「錢跟股票哪個重要？」答案當然是錢。人們在認為股票會下跌的時候，都不希望損失比股票更重要的金錢，因此會急著把股票換現。


    日常生活中，很少人會覺得股票是絕對必要的東西。因此，即便在股價上漲、能夠賺錢的走勢中，投資人也會仔細考慮：「要買還是不買？該怎麼辦？」再謹慎行動：「就稍微買一點吧。」也許是因為人類心理所產生的作用，股價傾向「上漲慢吞吞，下跌砰一聲」。請將此變動模式視同基本原則，牢記在心。


