    以 A 區來看，具體的買點是在紅線突破 5 到 20 日線、形成下半身之處的「前一天」的①。之後受到③的紅線影響，5 日線也轉為朝上，分歧訊號亮燈，可以繼續買。從最下面的紅線開始數起，會發現雖然價格變動幅度很小，但是連續出現十根以上紅線，不妨按照
