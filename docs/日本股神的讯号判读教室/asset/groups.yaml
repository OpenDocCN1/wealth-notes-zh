    ![img/fb5596eb257d02539bd30843d1962796_148_0.png](img/fb5596eb257d02539bd30843d1962796_148_0.png)


    當三條短期均線重疊成一條線時，代表什麼樣的狀況呢？那就是上漲或下跌的股價開始往反方向移動，且三條均線被股價帶動、陸續交叉的時候，又或者是股價在十天內都在同樣的價格區間中盤整推移。那麼，從這樣的狀態開始，三條均線會在什麼時候以淺線（10日線）、黑（7日線）、紅（5日線）順序整齊向外擴散呢？沒錯！就是股價開始強勁上漲或下跌，並且持續勢不可擋的時候。


    在三條均線以紅（5日線）> 黑（7日線）> 淺線（10日線）的順序整齊排列時，股價在紅線之上不斷上漲。此時若持有多方部位，什麼都不用做就能不斷擴大獲利，只要旁觀欣賞即可。相反的，當此訊號由上到下的排列順序是淺綠（10
    日線）＞黑（7 日線）＞紅（5日線）的時候，股價應我會快速跌到 5 日線下方。如果持有空方部位，就無須多想，靠賣出就能放大獲利。當淺綠黑紅聚集在同一個地方時，就要開始留意。而當均線維持這樣的排列狀態時，只要看準三條線分開擴散之處，即可安心進場。此外，在淺綠黑紅的排列尚未潰散之前，都可以穩穩地放大獲利。


    圖 57 的 SUMCO 日線圖即為典型的例子。股價原本長時間持續在底部盤整推移，隨後緩緩轉為上漲，淺綠黑紅三條短期線因而攀升到藍色的 60 日線上方。


    接著在 A 區中，三條線幾乎重疊成一條線似地密集聚攏，暫時形成盤整狀態。之後，大紅線①上升，一口氣同時穿過淺綠黑紅，強勢點亮下半身訊號，並進一步持續上漲。最後，在②的十字線出現之處，紅（5
    日線）＞黑（7 日線）＞淺綠（10 日線）三條線終於清楚地分散開來，在維持此排列順序的狀態下，均線與股價開始同步上漲！


    ![img/fb5596eb257d02539bd30843d1962796_150_0.png](img/fb5596eb257d02539bd30843d1962796_150_0.png)


    這樣一來，無論何時做多做多完全不必害怕，只要淺線黑紅的排列持續下去，繼續買進，就可以不斷放大獲利。途中股價曾暫時盤整，在③的黑線處，紅與黑好像即將重疊。然而紅黑最終並沒有黏在一起，依然勉強維持著淺線黑紅的排列，不妨按捺住賣出的想法，繼續買進。如此一來，直到圖中的紅線④到達3000日圓關卡為止，就能成功賺取到
    1000 日圓以上價差的獲利。


    如何？很簡單吧？只要檢查淺綠黑紅的排列是否潰散，就能穩穩賺。找到點，即可輕鬆得到大筆獲利，這就是淺綠黑紅訊號的魅力。


    圖 57 的情況下，淺綠黑紅的短期線有綠色的 20 日線、藍色的 60 日線在下面支撐，形成了上漲趨勢中的均線 PPP 排列狀態，讓人交易時更加安心。以訊號來說，**淺綠黑紅的優點就在於，只要均線的排列順序尚未潰散，就不需要為了
    K 線每天隨心所欲的變動而驚惶失措。** 一天只要檢查一次即可，例如在公司上廁所的時候，瞄一眼淺綠黑紅的排列，就能期待豐碩的成果。


    除了上漲趨勢之外，也一併看下跌幅勢中的淺綠黑紅案例吧。圖 58 是下跌幅勢中的 SUMCO 線圖，股價下跌的趨勢增強，在淺綠（10 日線）＞黑（7 日線）＞紅（5
    日線）的排列完成之時，趁股價反彈賣出，然後暫時放一陣子，等到排列潰散就獲利了結，如此反覆操作。雖然並不是所有的下跌幅勢都能完全適用於淺綠黑紅訊號，但大多數的情況下，都能夠藉此確實掌握，這則案例也是一樣。**特別是當綠色的
    20 日線、藍色的 60 日線支撐著淺綠黑紅的時候，訊號的可信度更高**，不妨把這項條件當成輔助規則，牢記在腦中。


    # 圖58 靠下跌趨勢中的淺綠黑紅反彈脫手


    ![img/fb5596eb257d02539bd30843d1962796_152_0.png](img/fb5596eb257d02539bd30843d1962796_152_0.png)


    # 圖58的簡單解說


    60日線、20日線皆已完全向下移動，觀看這兩條線的傾斜度可以判斷，下跌趨勢仍會持續，因此必須搜尋反彈脫手的賣點。做空的時機最好看準反下半身之處，但是觀察之後淺綠黑紅分散開來的狀況，便繼續在反下半身賣出，這可說是能夠穩定放大獲利的訊號。在淺綠黑紅擴散的地方可以考慮追加賣出。當淺綠黑紅再次逆向相交時，也可以用來作為可靠的獲利了結訊號。


    # 趨勢轉換時，靠淺綠黑紅輕鬆搭上升鳳車


    淺綠黑紅會從三條線聚攏於同一個地方的狀態，瞬間擴散開來、像開花一樣。這種「開花現象」，並不是只會發生在趨勢暫跌或反彈後再度加速的狀況中。


    舉例來說，淺綠黑紅訊號也會伴隨著我們在第五章看過的烏嘴、反烏嘴訊號，在趨勢從上漲轉為下跌、下跌轉為上漲等轉換過程中亮燈。


    圖 59 是 MonotaRO 的線圖。股價從下跌趨勢開始轉為盤整，並以 1500 日圓的股價關卡作為支撐，之後變動為上漲趨勢。圖中的大紅線①對淺綠黑紅形成下半身訊號後，開始上漲。以收盤價的基準來看，紅色虛線區域中的股價持續上漲，聚攏在同一個地方的淺綠黑紅，以紅色（5
    日線）＞黑色（7 日線）＞淺綠色（10 日線）的排列方式逐漸分散，拉開間隔距離。不妨在淺綠黑紅完全分散開來的小紅線②進場。圖中向下走的 60 日線看似將要形成阻礙上漲的壓力線，雖然有點令人在意，但是股價在反覆上下變動的同時突破了
    60 日線的障礙。接下來，可以從①開始算起第九根的紅線□處暫時撤退。


    之後，由於淺綠黑紅再度發生聚攏→擴散的情況，因此在④的前兩根紅線（已形成下半身）的地方進場買進。這次淺綠黑紅順利地持續分散，在圖中最後的大黑線為止，成功賺取了將近
    150 日圓的價差。


    # 圖 59 趨勢轉換中的「淺綠黑紅」訊號範例


    ![img/fb5596eb257d02539bd30843d1962796_154_0.png](img/fb5596eb257d02539bd30843d1962796_154_0.png)


    在突破 60 日線的位置附近，剛好是 1600 日圓，發揮了股價關卡的壓力線功能，股價因而劇烈震盪。黑線③暫時跌破了 60 日線，這對初學者來說是很困難的發展情況。不過，請仔細看一下此時
    5 日線與 20 日線的位置關係。如果你能想到：「咦？之前曾看過這樣的形態。」那麼，非常感謝你這麼認真地閱讀本書。沒錯，乍看之下，黑線③附近似乎將出現小幅震盪的情形，因為
    5 日線跌到 20 日線之後成 N 字形反轉上漲，也就是 N 大訊號。**越多複合式訊號亮燈，就表示訊號越強**——相場師朗講的話，請一定要好好聽進去喔。


    # 別漏掉多重訊號


    之後，在反映大行情的訊號——N 大的助攻之下，淺綠黑紅訊號持續漲到股價 1800 日圓的位置。簡直就像搭上頭等艙一樣安心，買進之後就只要一直旁觀便能成功地放大獲利。讀到這裡，你發現了嗎？在圖
    59 轉換到上漲趨勢的過程中，許多訊號同時登場。除了 1500 日圓止跌的整數股價之外，還有下半身、一開始的淺綠黑紅、位於上方的 60 日線形成壓力線、N
    大、第二次出現的淺綠黑紅等。


    圖 60 是從上漲轉換到下跌趨勢的 MonotaRO 日線圖。原先位於 60 日線上方的淺綠黑紅三條線跌破了 60 日線，之後 A 區中的黑線①


    # 圖 60 轉為下跌趨勢的訊號——淺綠黑紅


    ![img/fb5596eb257d02539bd30843d1962796_156_0.png](img/fb5596eb257d02539bd30843d1962796_156_0.png)


    同時穿破了淺綠黑紅三條線，點亮反下半身訊號。接著，隔了兩根紅線之後，淺綠黑紅在黑線②的地方開始拉開距離，在下一根黑線③的地方分散開來。在黑線③的地方做空，就可以在下根跳空登場的大黑線④開啟的急跌走勢中成功獲利。


    黑線③，是從反下半身訊號①發生前的最新高點開始算起的第六根 K 線。按照 9 日法則，第九根 K 線（即為黑線⑤）的下一根黑線⑥，以收盤價來看已經轉為上漲。也就是說，如果只用
    9 日法則來判斷，就會選擇在這裡獲利了結。不過，由於淺綠黑紅的間隔距離仍然很大，不妨繼續持有賣方部位。股價就此持續下跌後，在紅線⑦由下往上突破 5 日線、形成反下半身訊號的地方獲利了結，這也是一個選擇。由此可知，**淺綠黑紅也跟
    9 日法則一樣，可以當作「把獲利擴展到最大極限的指標」，加以充分運用**。


    在這道「考古題」中，若多加注意 5 日線與 20 日線的形狀，會發現圖中也出現了 N 字形反轉下跌，形成反 N 大訊號。在淺綠黑紅的上半部，綠色的 20 日線、藍色的
    60 日線扮演了阻擋上漲的壓力線角色，且黑線②出現，形成反 PPP 訊號。由此看來，不妨放心賣出。此外，黑線③也跌破了 1800 日圓的股價關卡。


    這張圖中，眾多相同場式訊號像是和聲伴奏般在你耳邊異口同聲地高唱：「賣吧，賣吧。」可別錯過這樣的呼喚。


    下頁圖 61 的 AEON 股價上漲趨勢持續，在 A 區之前，股價暫時跌破了持續往上走的 20 日線，趨勢暫時停歇。


    接下來，大紅線①出現，對 5 日線、7 日線、20 日線形成下半身訊號。A 區的紅線②、③連續出現，5、7、10 日線轉而分散，淺線黑紅訊號亮燈。紅線③越過了最新的高點，因此是上漲趨勢中趁勝追擊買進的機會。在紅線③買進，從前一波低點的紅線①開始算起，直到第八根
    K 線的黒線④，都持續買進，即能成功賺取數百日圓的價差。若不按照 9 日法則，而以淺綠黑紅的排列為優先判斷依據的話，在紅色的 5 日線與黑色的 7 日線接觸的黑線⑤附近為止，想必都能成功放大獲利。**若能遇到力道強勁的上漲或下跌，就可望大有斬獲，這是淺綠黑紅訊號的優點。**


    ![img/fb5596eb257d02539bd30843d1962796_159_0.png](img/fb5596eb257d02539bd30843d1962796_159_0.png)


    此外，在圖 61 中也發生了淺綠黑紅以外的多重訊號，是什麼訊號呢？趨勢暫停停歇後，再度加速時經常出現的訊號，就是分歧了。圖中的 A 區前方，因股價下跌而一度掉到
    20 日線附近的 5 日線，被紅線②、③拉開，未觸及 20 日就離開了，完全是分歧訊號的型態。不論是「趨勢轉換」，又或是可望暫跌買進或反彈賣出的「趨勢再加速」，在能夠獲利的期間內，通常會發出許多訊號，就像在呢喃私語：「接下來股票會漲哦、會漲哦。」「接下來會跌唷、會跌唷。」這些聲音絕對不是幻聽，請放心。千萬別漏聽了相場式訊號發出的各種聲音，就算無法達到「耳聽八方」，但請你盡量別遗漏眾多訊號的各自主張，要練到能夠自然看懂線圖的境界，因為那才是讓投資成績飛猛進的王道之路。


    **本書介紹了各種不同的相場式基礎訊號，但是線圖中很少有單一訊號獨自出現的時候。** 下頁圖 62 中，淺綠黑紅訊號總計出現了四次。同時還有其他相場式訊號亮燈，請你找找看有哪些訊號，答案就寫在下半頁，請先遮蔽起來作答再翻開來看。


    **在相場式訊號發生的當下，下半身或反下半身訊號多半早已在那之前亮燈。** 趨勢暫時停歇之後再次加速（暫跌買進或反彈賣出）的场面中，很容易出現分歧、淺綠黑紅、鳥嘴；趨勢轉換的場面中，則頻頻發生鳥嘴、N
    大、淺綠黑紅訊號。


    趨勢再次加速或反轉的場面中，經常碰到整數的股價關卡；9 日法則在數到第八或第九根 K 線時，經常又跟其他關卡糾纏在一起，類似情況非常之多。請你確實學好各種不同訊號，好好加油吧！


    # 圖 62 尋找加強版淺綠黑紅等多重訊號！


    ![img/fb5596eb257d02539bd30843d1962796_161_0.png](img/fb5596eb257d02539bd30843d1962796_161_0.png)


    ![img/fb5596eb257d02539bd30843d1962796_161_1.png](img/fb5596eb257d02539bd30843d1962796_161_1.png)


    # 圖 62 的簡單解說


    無論盤整的股價將會轉向向上或向下，淺綠黑紅都會出現在趨勢再度增強的時候。


    在那之前，通常會出現下半身/反下半身或其他訊號，宛如淺綠黑紅的綜合技法，請千萬別漏看。


    # [結論]


    不斷練習，讓勝利成為習慣！


    早上起床，即便還在睡眼惺忪、恍恍惚惚，也能夠下意識進行：①關掉鬧鐘、②刷牙、③洗臉、④上廁所這一連串動作。不妨用這樣自然而然的感覺去觀看股價線圖，確認：①股價狀態是上漲、下跌還是盤整、②均線的排列狀態、③最近的高點、低點位置、④目前股價附近是否形成整數的股價關卡。這些都是相場師傅親自傳授的「作業流程」，請牢記在心。


    如果能夠自然進行「作業流程」①到④，那麼下一個目標，就是學習充分使用本書介紹的下半身、反下半身、鳥嘴、分岐、N大，以及淺綠黑紅這些「技術」。接下來，唯有當你能夠立刻察覺多重訊號亮燈現象，並且靈活運用，才能說是真正開啓了獨當一面的股票職人之道！這一切都需要不斷地練習再練習、鍛鍊再鍛鍊。


    我無意讓你感到不安，不過股票投資與日常生活不同，是一個充滿危機的冒險世界，就像是身懷巨款在國外治安不良的地區迷路一樣。為了避免遭遇損失，必須拋下觀光客的心態，備妥周全的風險管理策略。我所指導的技術，不單只是創造獲利的泉源，更是極力降低風險、減少損失的盾牌。


    相場式訊號不只傳授「在這裡買賣的話，獲利的可能性很高」，更教你「在這裡交易的話，損失的可能性很高，所以最好不要交易」。股票投資並不像考大學那樣，具有百分之百的標準答案，但是只要拚命努力地練習考古題，技術自然會進步。如果題目太難，不知道從何解起，不妨就先看答案（也就是歷史線圖），然後把解答方式整個背下來。


    考試之後，反省失敗的原因也很重要。在相場式股票投資裡，所謂的「考試」，就是用線圖軟體把 K 線一根一根顯示出來，猜測「接下來會如何發展」「在這裡應該買還是賣」，認真進行沙盤推演。接著，就是正式實戰了！很多考試題目，其實都是各種知識的多重組合，股票投資中的實戰也是一樣的。


    祝你勝利！希望能聽到各位投資開花結果的好消息！


    終生股票職人 相場師朗


