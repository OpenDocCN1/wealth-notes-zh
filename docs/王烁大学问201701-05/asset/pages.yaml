  md: '# 一文说尽房地产（续）


    不久前发了《一文说尽房地产》，这标题起大了。午夜梦回，想起房地产的事还是没说尽，少了一环。


    少了人。


    只好犯疴自续。


    每次资产泡沫涨起来破下去，都有三个因素：


    第一是有坏人。金融家太坏，内部人太黑，官员太腐败。


    第二是监管没跟上。监管者不知道市场在干什么，哪怕知道一点也管不了，哪怕能管一点也没管好。


    都是事实。每次都有许多坏人，每次都有监管不力，too soft too little too late，太弱太少太晚。甚至监管与坏人合谋的情形也不是没有过。


    如果你跟着本专栏一路看下来，就知道这两个因素以前讲过不少，人们特别愿意谈这些因素，除了他们确实存在之外，还因为人们不愿意审视自己。


    第三个因素就是买家自己。


    虽然讲人，我却不是要介绍罗伯特·希勒的行为金融，人确实有非理性一面，但是，哪怕从微观主体的角度解释房价剧烈上涨，也并不是定需要说人的非理性，比如下面这个极简模型。


    假设潜在买房者有两种，一种看多，一种看空：房价只有一个价，不可能说看多者买房是一个价而看空者买房是另一个价。总之就是一个价格水平，谁来决定？


    先说一堆如果：


    如果允许信贷，如果无法做空房价，如果监管放行……


    那么，房价由看多者决定；如果进一步聚焦，还可以说，在看多者中，房价由最看多的那些人决定。


    这些可以是极少数。相对于社会整体来说的一小撮人就可决定房价。


    结论很惊悚，道理却很简单。


    看空的人把钱放在哪里？


    银行里。


    银行把钱贷给谁？


    看多房价的买家。


    你看空房价，就等于通过银行向看多者提供融资，全社会房地产购买力并没有因为许多看空房价而减少。你的购买力没有消失，只是被人借走了。


    看多阵营内部当然也是程度不一。房价涨涨，温和看多者也许就停下来了；猛涨以后，强烈看多者多半也停下来了；但同样地，他们也不能决定价格，决定价格的是那些疯狂看多者——同样逻辑，停下来的人实质是向继续做多的人提供融资。


    虽然很简单，这个模型是不是很贴近中国今天的房市？


    最疯狂看多也借钱最多的那些买家决定房价，而不是基本面决定房价，不管基本面指向哪个方向。


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_70_0.png)


    这个模型出自我勒的同事、耶鲁大学经济学教授 John Geanakoplos（约翰·吉那科普洛斯）。约翰教授既是耶鲁经济学系镇镇，提出了杠杆周期（leverage
    cycle）理论。友人大王秋教授在耶鲁也在哈佛和MIT经济学系学过，闻人太多，于是与我最聪明的校友吉那科普洛斯。听说我参加耶鲁世界青年项目，嚷我一定要见见，可惜没成。我在他的学期他没开课，也没投联系，估计休学度假云游去了。我只好去看他的耶鲁公开课视频，管中窥豹。


    杠杆周期理论从前面个极简模型中可见一斑，我接着展开：


    吉那科普洛斯说，资产价格不是基本面决定的，不存在基本面价格这件事，只存在不同人的不同看法，源自风险容忍度不同，源自人跟人不相同有些人就是比另一些人天生爱玩，源自有些人更偏好某些特定资产，也源自有些人更知情。等等。


    人与人不同，决定价格的是边际买家（marginal buyer），其杠杆也得用最大。


    利率很重要，人人都重视；杠杆率同样重要，但长期被监管者忽视。哪怕利率不变，杠杆率趋近，资产价格就越高，反之亦然。标准金融理论认为这是供需决定，但杠杆周期理论认为供需同时决定杠杆率和利率。抵押品如房地产内置了正反反馈机制。市况好时，房地产价格上升，作为抵押品更值钱，而且杠杆倍数也会变大，利少，利率低；市况坏时反之，利少，利率高，抵押品不值钱，杠杆倍数低。


    吉那科普洛斯发现，杠杆的变动总是先于价格的变动：杠杆变大，资产价格上涨；杠杆变小，资产价格下跌；美国房市2000年以后的繁荣和泡沫破灭，不用非理性因素来解释，用杠杆变动就够了。


    杠杆周期的后果是用最大杠杆的极少数买家实际上控制了价格，成为边际价格决定者；高杠杆推动劣质资产也受到追捧；一旦杠杆周期逆转，损失外部化，就是说，全社会承担损失；危机如漫延到实体经济，影响“真实”信息需求，从金融危机变成经济危机；大量资产成为僵尸，买家无力为维护资产，比如或负资产的房地产，谁愿意为负债还货呢？


    2008年结束的这轮杠杆周期如果如此，原因一是上轮的平稳长期积累过多泡沫，二是资产证券化打包太多表面优质其实劣质的资产，三是房地产的杠杆和证券化资产的杠杆都太高，恰逢双高周期下行，四是CDS兴起提供了做空工具。


    监管者必须识透房地产问题和证券市场的杠杆率问题，必须问这个问题：“正确”的杠杆率水平是什么？这跟“正确”的利率水'
