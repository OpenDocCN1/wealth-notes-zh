  md: '第六，耶鲁校产基金的目标是与外部管理人保持几十年的关系，而不是短期关系。如果基金管理人的薪酬跟基金表现关系不大，而跟上市公司股份的关系很大，这种关系就是不稳定的。斯文森希望这些机构有长期发展的人才结构和激励机制，希望他们与耶鲁共同投资，不论投什么，把钱一起放进来。


    第七，耶鲁着眼真正长期的投资周期，不在乎季度或者年度表现。绝大多数基金的时间观不是这样的，这给耶鲁以机会，是市场无效性的一部分。斯文森选择的几乎所有外部管理人都认同这个看法，给他们的报酬也不按年度考核，基于长期表现，比如五年。


    第八，耶鲁校产基金经常是刚刚设立的基金的第一个投资者，以便一起打造结构，创造文化，这些刚刚设立的基金也是最饥渴最有激情的，虽然没有历史表现记录。有趣的是，耶鲁校产基金外部管理人表现最好的那些往往属于这一类，比如张磊的高瓴资本。张磊原本在耶鲁校产基金做分析师，成立高瓴资本时毫无投资记录，斯文森拍板投资1000万美元。今天高瓴资本管理200多亿美元资金，只花了十余年时间。


    第九，没有最低投资额。


    第十，要求很高透明度。如果外部基金经理不准备提供有关全部投资对象的信息，斯文森就不会投资；如果外部基金经理偏离原来的投资风格，一定要沟通；不过，如果其表现低于基准，本身倒不一定是坏事，肯定要沟通，但沟通完了说不定会追加投资。


