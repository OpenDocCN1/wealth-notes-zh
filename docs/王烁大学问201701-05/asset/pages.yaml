    ![](img/d0b39398554e3d9ba7f47bdd8890a825_32_0.png)


    认识何帆好些年。某年我入选达沃斯世界经济论坛的世界青年领导人 (Young Global Leader, YGL) 名单。这个名单每年大概会在全球范围内新增上百人，中国大概十余人。通知同时带着提醒，你想对世界青年领导人这个群体了解更多的话，建议去找找何帆，他是北京一带YGL群体中的活跃分子。


    我与何帆从此相识。他是经济学家，我是记者，但是除了这点，我们有很多共同点，最主要是都兴趣广泛且喜欢读书。我看过无数人开的书单，与我趣味相投者却无几。一个书单，如果百分之三四十的荐书你有兴趣读，就非常不错。目前我关注的书单中，个人的话，何帆的书单，机构的话，《经济学人》的年度书单，能达到。其他著名书单都离得远。当然这不是谁的错，兴趣不同而已。


    《大学问》和何帆在得到上的专栏《大局观》是邻居，而且同是“大”字辈。前阵他来问我，能不能推荐我的一篇文章，当然可以。


    我发现这个交流方式很好，跨界何不从身边开始？于是我也选了他的一篇文章，推荐给你们，也把何帆推荐给你们。


    # GDP是怎么计算出来的


    作者：何帆


    一个职业太太，在家里做家务、带孩子、照顾老人。请问，她对GDP的贡献有多大？


    如果你愿意和我一起修炼大局观，不妨自己先花半分钟思考一下这些问题，再看本文。


    历史学家黄仁宇总是不厌其烦地讲一个观点：中国之所以没有和西方国家一起进入现代化，是因为无法实现“数目字管理”。没有“数目字管理”，什么都是稀里糊涂的。民国期间，有位赫赫有名的奉系军阀叫张宗昌，号称“三不知将军”。一是不知道自己有多少钱，二是不知道自己有多少条枪，三是不知道自己有多少个姨太太。一个军阀头子一问三不知倒也罢了，要是整个社会的资源没有办法被如实地测量并记录下来，那明晰的产权保护就无从谈起，市场交易会寸步难行，有效的资源配置只是痴人说梦。


    市场经济的演变就是一部逐渐实现“数目字管理”的历史。文艺复兴时代，出现了现代的簿记制度，这一发明对人类社会发展的影响，不亚于车轮和印刷术。我们以后可以专门谈谈复式簿记的意义。大略来说，有了这一发明，各项交易活动、借贷关系才能了然于胸，这大大便利了商业活动，公司管理才能够有可靠的基础。


    把公司的账目整理清楚还算容易，要是把一个国家的经济活动都能用“数目字管理”，就难多了。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '的好听的。20世纪30年代，爆发了一场前所未有的大萧条。有了这么多的事，政府才发现自已手中根本就没有能够准确掌握经济形势的宏观经济数据。当时的美国总统是胡佛，危机都已经到了眼前，胡佛还居然认为不可能有大萧条。这是因为他认为关注了股票价格和物流运输。股票那时候涨得疯狂，谁能说得清到底是经济繁荣呢，还是出现了泡沫？


    胡佛下台之后，罗斯福当上了总统。他希望能有一套清晰、可信的数据，以便及时做出反应、避免危机的重演。美国有个经济学家叫尤金·凯茨，他自个儿做了个研究课题，对美国的国民收入进行了测算。1934年，库兹涅茨公布了他的第一份报告，指出美国的国民收入在1929年到1932年期间下降了将近一半。罗斯福总统如获至宝，马上在自己的经济复苏计划中引用了这一数据。


    著名经济学家凯恩斯为GDP核算立下了汗马功劳。1940年，凯恩斯发表了《如何为战争信贷（How to Pay for the War）》，他尖刻地指出，缺乏可靠的宏观经济数据，会严重地影响到有效的战时动员和战争筹款，很可能会带来严重的战争。甚至输掉战争。凯恩斯的好友奥斯卡·罗宾逊（Austin
    Robinson）是战时英国决策圈的一位核心人物，在内阁、生产部、财政部等部门任职过。他对凯恩斯的观点深以为然，于是，他邀请了两个年轻的经济学家，理查·斯通（Richard
    Stone）和詹姆斯·米德（James Meade），一起编制第一个现代版本的国民收入核算，国民收入核算就是要估量GDP以及相关的数字。1941年，他们的报告和政府的预算报告一起公开发布。后来，斯通和米德都拿到了诺贝尔经济学奖。对这个故事，我们能够看出，催生GDP的主要原因就是战争，为了战胜敌人，必须提高对国民经济的管理水平，这是生死存亡的大事。


    打完第二次世界大战，国民收入核算体系正式确立。过去都是经济学家们的“私学”，如今成了政府的“官学”。过去公布GDP数据的是经济学家，现在则是政府统计部门。


    你可能会觉得，这不就是件算活儿吗，虽然工作量很大，但也不是什么高深的学问。不就是把一个国家生产的所有东西都加起来吗？其实真没有那么简单，怎么算，很多经济学家都捋不清。


    经济学中的奇葩是亚当·斯密。亚当·斯密有一个奇怪的观点，他坚持认为，只有制造业才能被计入国民收入，服务业不应该被计入。在斯密看来，只有制造业才创造价值，而服务业是消耗价值的。他说，如果一个企业家雇用了10个工厂工人，他们能让企业家赚钱，但如果他摆排场，雇的是10个仆人，那么他们只能让企业家败家。如今，在英国各国，服务业的比重比制造业的比重大得多，要是按照斯密的观点，服务业的企业和工人该都不乐意了，发达国会“一夜间回到解放前”，变成欠发达国家。我们得承认，大部分服务业是有利于效率的提高的。我猜想，要是斯密能雇一个研究助理，他可就不会再说风凉话了。


    好，我们把服务业也算进来。那么，政府部门要不要算进去呢？在凯恩斯经济学出现之前，当人们谈论“国民经济”的时候，指的只是私人部门的活动。这让你很不爽，比如，在战争期间，政府需要投入大量的资源用于军工生产，成批成批的枪支弹药、一队一队的飞机大炮经常不付钱生产出来，私人企业能拉动经济，创造就业，但在传统的国民收入核算中，这不是私人部门的经济活动，因此不被计算进来；政府白忙活了。你想想，GDP是谁算出来的，不是政府官员出的码，那政府会把自己做出的贡献计算在内吗？于是，公立医院，公立学校，派出所、消防队、城管、统计局、信访办，都能创造出GDP。


    凡事就怕认真，很多事情经不起推敲。既然我们承认服务业也有价值，那为什么最重要的服务没有被统计进GDP呢？律师帮人离婚打房产、金融交易员搞投机、擦鞋小童把鞋子擦亮，这些容易看成是为GDP做出了贡献，唯独十月份晒、甘蔗饲养、做饭扫地、操持一家所需的各种劳务劳动，不被算成GDP。这是对家庭妇女最大的歧视。如果想提高GDP，倒是一个最简单的方法，就是各家都到邻居家吃饭，然后把钱交给邻家的主妇，GDP马上就增加了。


    如果服务业能够被计算进来，那么，色情行业、赌博和走私是不是也该被计入GDP呢？考虑卖淫和吸毒等非法经济活动纳入GDP统计，预计这一调整将把英国2009年的GDP规模提高2.3%！如果你保住青山绿水，那就要有GDP；如果采煤挖青绿水破坏，开矿办工厂，不管污染多么严重，GDP数字照样会增加。这又算不算合理呢？


    总结一下。GDP有用吗？当然有用。用“数目字管理”是很重要的，没有统计，就无法改善对国民经济的管理。但我们还必须澄清一件事情：这个世界上并没有一个实在的GDP等着我们去测量，GDP不过是出自经济学家的虚构。什么东西在GDP里面，什么东西不算在里面，经常变来变去。


    +   1. 只有用“数目字管理”经济活动，一国才能实现现代化。

    2. GDP核算原来是由民间的经济学家自己算的，第二次世界大战之后才变成了“官学”。

    3. 什么东西算在GDP里面，什么东西不算在里面，经常变来变去，而且充满争议。


