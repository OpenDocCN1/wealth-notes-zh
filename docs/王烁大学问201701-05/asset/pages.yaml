  md: "# 第22周问答｜做智识的游牧民族，竞争力在哪里\n\n在加州大学圣迭戈分校（UCSD）里的星巴克，一位小朋友问，我的兴趣广泛，但很多前辈跟我说必须专精一门才有竞争力。你说做智识的游牧民族，随时准备转场，那竞争力在哪里？\n\
    \n# 王烁\n\n是这样的，第一，如果竞技场稳定，大家争尺寸之短长，则专精一门以求精进，可能带来很大收益。如果体育场中只知道冠军，谁知第二名是谁？尽管只差0.01秒。不过，如果竞技场随时在变，则专精一门，付出极大时间精力努力，有可能付诸东流。今天是哪种情况？说实话难讲，各有各判断，有这框架会好一些。\n\
