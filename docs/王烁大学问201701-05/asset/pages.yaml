  md: '# # 最高法院大法官的智慧


    在美国，谁说了算？


    总统吗？


    总统经常说了不算，很简单，美国不是一个靠总统令治国的国家，而是宪法国家，在宪法授权的范围内，总统说了算；这范围以外的一切就都得商量着来。总统的想法如果不能变成法案，如果变成法案而国会不给通过，就等于零。


    那国会说了算吗？也不一定。国会通过的法案，如果总统拒绝签署，这时国会就得2/3票数再通过一次才行。就算是这样，如果有人认为国会通过的法律违宪，打官司，层层往上打，打到最高法院，而被裁定违宪，那法律就作废了。


    美国体制中最后说了算的，就是最高法院。9位大法官投票决定，多数票终局。


    斯蒂芬·布雷耶（Stephen Breyer），这9人之一，坐在耶鲁法学院斯特林楼129教室讲台上，离我5米远，掏出了随身带着的美国宪法小册子，提了个问题：


    某国最高法院首席大法官来到布雷耶的办公室，问他：为什么美国人听最高法院的？你们不就9个人吗？


    这位法官的意思很清楚，你们不是选出来的——美国最高法院法官是由总统提名、国会通过、终身任职，你们没钱，连工资都不太高，你们也没枪，那为什么要听你们的？


    现代国家三权分立的模板出来后，许多国家都建有宪法法院，专司宪法审查之责，理论上也是终局决定，但实际远非如此。批判的力量一旦遇到力量的批判，往往溃不成军。宪法只是一张纸，法官只是几个人，有何作为？


    布雷耶，1938年生，就读于斯坦福大学、牛津大学、哈佛大学法学院，曾长期'
