  md: '# 美国衰落？


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_11_0.png)


    # 一、破脸


    每次你觉得川普已经彻底面哀尽，总有一些新东西出来刷新下限，比如最近流传的川普莫斯科奇幻之旅。真假确实不知，只知道美国情报部门把故事在流传这件事，给川普本人做了简报。如果你想知道是什么，搜川普，莫斯科，golden
    shower。


    川普就任前主要在推特上治国。一次发得性起 ， 本 想 表 达 “ 没 有 先 例 （ unprecedented ） ， 误 作unpresidented，于是发明了一个新词。笔误谁没有过呢？这个词错得太巧，“没有总统相”，简直一语成谶，立成美国网络热词。


    人都有两面，美国总统也不例外。没人指望美国总统洁白无瑕，要真是洁白无瑕，选民还不一定放心。但像川普这样公认人品堪忧、体面无存，还能被选为总统，在美国历史上没有先例。专治美国当代政治史的耶鲁大学历史系教授贝弗利·凯茨说，川普的政纲在美国政治上不算独特，更敢干的还有，不体面倒真是刷新了纪录。


    美国总统最后被发现不是个体面人的不止一个，但川普当选总统，不是因为这些选民不相信他不体面，人们自欺没有到这种地步，而是尽管不体面仍然选他。选他的选民们确实与现体制撕破脸了。这事能发生，重塑许多美国人对国家和人民的自我认知，玫瑰色褪去了。


    我赴美游学之前，川普还只是共和党候选人，一位深谙美国的学者跟我说，在那边如果遇到关于中国的问题不好回答，有人对中国有啥不理解，你就跟他说，川普还能当总统候选人呢，中国发生点啥还有什么奇怪的吗？


    我如法炮制，果然好用，川普当选之后就更好用了。


    # 二、两个预言


    预测是件不靠谱的事，但预测者总是前赴后继。没有办法——如果没有预测，人无法往前走哪怕一步。统计学家说，模型都是错的，还好有些还有用。预测同样。


    在耶鲁的亨利·卢斯中心大讲堂上完课，保罗·肯尼迪给我拿来的书签了名，《大国的兴衰》（The Rise and Fall of the Great Powers），他出版于上世纪80年代的名著。书的框架简单有力：现代大国兴起总是经济与军事同步，两者都依托于技术进步与组织创新，财富有利于扩充军力，而军力总会用来获得和保有财富。大国兴起之时，这一切都在向上的正反馈之中；大国衰败时，这一切陷入向下的正反馈。向下的节点何时到来？扩张过度。可惜，肯尼迪依托这个框架作出的预言却是错的，因为它认为美国将衰落，结果成为反向指标，80年代末出书，美国却在90年代后再攀顶峰。'
