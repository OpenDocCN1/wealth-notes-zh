  md: '# 第23周问答 | 斯文森：未来会有更大的波动率


    往下读这篇与耶鲁学校基金管理人、传奇投资者大卫·斯文森的对话之前，请先转到《大学·问》上篇文章《斯文森：识人方有阿尔法》。


