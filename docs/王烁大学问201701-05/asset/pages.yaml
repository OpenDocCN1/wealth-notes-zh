  md: '那又怎么样？虎妈认为值得。论钢琴，女儿最终在林肯中心上台演奏；论学业，女儿今个在哈佛法学院读法预科；论亲情，“女儿整年给我发短信，还表示也要做虎妈”，蔡美儿说，“不过第三代我不管了。”


