    不一一细讲了，基本判断如下：


    +   第一，中美战事不会有决定性后果，没有清楚的胜者，不会有哪方获得绝对胜利而另一方遭遇完败。


    第二，如果战事于近期爆发，美国军力会实质性受损，如于远期爆发，损失会更大上很多，因为中国军力在迅速成长；但无论近期远期，中国军力损失会更大。


    第三，战争激烈与否取决于领导人在战事开始时所下决心，战争长度取决于双方何时丧失继续作战的意志。


    第四，东亚海空成为战区，不论在哪种情形中，中国经济都将遭受重创，战事变得漫长更是灾难性后果；美国经济当然也受冲击，但相对小，主要限于双边贸易损失；此外，如果战事变得漫长，国际形势对中国会进一步恶化。


    第五，战事爆发最可能的原因是一方误判，以为可以通过一场短促战争达到目的。一战前德法俄决策者就出现过这种误判，以为战争只会持续几个星期，结果是持续4年，一代精英丧失，当时的世界中心地带焦土化。为防止这种误判，报告认为必须向对方清楚地表明自己已做好长期激战的准备。


    以激烈的长期战争的后果作威慑，杜绝另一方通过短促战争获胜的幻象，使战争爆发的可能性最小化，要打就打到底，所以最好不打。这就是这篇兰德报告的博弈论内核。如何使长期激战的威慑变得可信？政策建议由此鱼贯而出。兰德建议美国应适度整军，加强其盟友的军事能力和准备程度，在经济层面作好产业链被战事扰乱的后果等。


    不过，如果这些动作来临，必然会传递出另一种信号：美国封锁中国。而它会增加还是降低冲突的可能？兰德报告对此没有多讲。已知假设能减少误判，然而如何其难！这世上没有完全透明的信号、单一后果的行动，推动历史之轮转动的，往往
    是 意 外 ( unintended consequences )。


