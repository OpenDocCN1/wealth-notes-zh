  md: "下面是我读《活出意义来》一书的摘记。弗兰克尔所著与伊格尔所说，完全一样。在人生的绝地，也许只有一种皈依。\n\n集中营里的生存竞争，一半从党卫军的爪下活下来，另一半是与其他囚徒相争。人人都被一个念头占据：要活着回去。当挑选谁被送进肉体消灭时，一个囚徒把别人顶上大会不会有一丝犹豫。那些幸存的人，则计划着有用任何方法逃出来，不管是暴力、偷窃、出卖。我们活下来是个奇迹，那些真正最好的人，没有回来。\n\
    \n集中营里，一个人是卫兵还是囚徒，并不能告诉我们他们是什么人，燕愁在哪个群体里都存在。一个卫兵把他的面包省下来给我，我泪湿满面，这远不只是一小片面包，他也自有一只些只有才有的东西。世界上只有两种人，一种正常，一种不正派。两种人到处都有，分布于社会所有群体之中，没有一个群体只有一种人。\n\
    \n哪怕在集中营里，人仍然可以有选择。在可怕的心理和身体折磨下，还有人保有一丝精神的自由、心灵的独立。他们从一间监室走向另一间，安慰他人，分享自己的最后一片面包。虽然人极少数。他们证明，什么都可以夺走，惟有意愿中一种由属于自己：在任何情况下，选择自己的态度，选择自己的道路。\n\
    \n这样的选择无处不在。每天，每时，都要做决定，决定要不要向那些夺走我的力量低头，决定要不要放弃自由与尊严。尽管缺少睡眠，食物不足，精神受折磨，一个囚徒最终变成什么样的人，取决于内心决定，并不仅是集中营环境的影响。集中营里，你也可以决定保持尊严。那些不能控制的力量可以夺走你所有的东西，除了一样，就是决定如何面对这些力量的自由。你无法控制生活中什么最临到你自己身上，但总是可以控制你的感受和行为。\n\
    \n> 尼采要斯夫斯基说过： “我只怕配不上自己的苦难。”一个人既可以选择保有勇气、尊严和无私，也可以选择生存竞争中像动物一样无所不为。你是把苦难当作磨刀石找到只属于自己的内心力量还是放弃？决定你是否配得上自己的苦难。\n\
    \n要给内心以力量，就必须帮助他们找到向前生活的目标。向前看才能活下去，这是人的特质，也是渡过最艰难时刻的救赎。\n\n有人说： “我对生活已经全无指望。”我们必须告诉自己，也告诉别人，我们对生活有什么指望也不重要，重要的是生活对我们还有什么指望。我们得放弃问生活的意义，而把自己放在被拷问的位置，每天，每时。回答不是笑话也不是冥想，而是行为和举止。生活最终意味着承担寻找正确答案的责任，并履行它持续加诸于自己的任务。\n\
    \n生活不是像弗洛伊德所说是追求快乐，也不是像阿德勒所说是追求权力，而是追求意义。意义来自有用的工作、爱，以及艰难时刻的勇气。\n\n从集中营归来，幸存者最光辉的体验，就是懂得，在承受所有痛苦之后，再也不用恐惧任何东西，除了信仰。\n\
