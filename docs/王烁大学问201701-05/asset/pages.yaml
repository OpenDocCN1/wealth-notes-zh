    # # 写作最重要的事


    讲个笑话，三个人来求职，其他条件都差不多，一个颜值高，一个关系广，一个套路深，你选哪个？


    选那个会写文章的。为什么？慢慢你就懂了。


    在此前本专栏的周末问答中，我曾经简单提到过写作，这里展开讲。


    写作是件难事，统合自然状态下的发散性思维，依次表达为词汇-句子-段落-文章，谈何容易！但它又不是难到不可及，而是只要训练必有所成。把好作者变成天才作者是不可能的，但不用绝望，我们又不吃天才这碗饭；把坏作者变成好作者是**完全可能的，这就要训练**。


    第一，写作训练没秘密，就是要写，而写的第一步是马上写。这说起来像是废话，然而并不是，是关键中的关键。


    下笔千言倚马可待的传说太多，使得大家想到写作就头疼：如果必须事前都想明白打好腹稿一气呵成才能开始写的话，写作就太难。


    还好，也许有人真这样写文章，但我很幸运还没见到过。只是这套路太吓人，绝大多数人一想起写作就害怕。


    怎么克服害怕？


    马上写，多写。


    我自己的体会是这样的，思路本来是发散的、断片的、随机游走的，文章则该吻合。怎样才能把发散变成吻合？别指望在自己的大脑中完成这过程，对普通人来说，更好的办法是在随时随地的写作中将断片落于纸上，再在纸上完成整合，为大脑减负。


    在耶鲁世界学人的写作培训课上，讲课老师给出克服写作畏难症的独门秘诀：“告诉自己，坐下来，只写5分钟就好。”'
