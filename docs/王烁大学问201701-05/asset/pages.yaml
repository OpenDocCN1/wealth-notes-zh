  md: "# 第34周问答丨概率没有那么简单\n\n> **上善若水**：想犯罗牌的概率权，给你两个按钮，按第一个，可以直接拿走100万美元，按第二个，有一半的机会拿走1亿美元，正确答案是有半的第二个按钮。如果没有背后的一整套概率知识，很多人都会做出错误的选择。\n\
    \n**王烁**\n\n在专栏文章后面的留言中，经常看到读者谈到罗振宇讲的这个例子。如果概率这么简单就好了，情况不同，选择不同。\n\n第一，如果这个游戏可多次重复，按第二个按钮。\n\
