    2017年做好以下几件事：1、坚持在公众号发表文章，坚持写作，每周不低于四篇；2、坚持锻炼身体，坚持跑步，全年不少于八公里；3、坚持学习一门网络语言，能够自己动手写程序；4、坚持每天阅读一篇英语文章，做到以后能看英文原版书；5、在得到上，专注好伙伴，每天能够有所收获；6、多做好笔记，和孩子一起成长，做好她的榜样。


    1分 8

    足够理性的人不许愿，但我们绝大多数人达不到，当然达到足够理性往往并不是一件好事，很可能产生有如高端脑的偏执。那么正确的许愿姿势就很重要了。

    一是要求切实，二是目标具有两回事，成长的感觉和成长的努力是两回事，三是许愿既然是契约，就要有第三方反应的东西。


    我的思考，说了这么多，其实还是我对自己在成长问题。从小里说，是我如何自律。我们，卡理维说道：“我、任何事可事、决定、出自本能、兴趣、含能可得到有出心。我相信缓慢、平和、细水长流的力量，踏实，冷静，不急于抵达自我理想，不自我建设，不欠我，但过度的欲望吞噬你内心，不必畏惧，但过度的欲望吞噬你。从生活的角度，一定要懂得节制，不要肆意的放纵欲望。


    那么，怎么做到自律？首先是尊重事实，是自律的核心原则。但最，最苦而复杂的事，你需要拥有足够的勇气和判断力。尊重事实，就意味着如实看待现实，杜绝理想，因为理想与事实完全，绘制人生地图的感觉，不在于我们要人生从头开始，而是有不断修正，才能把地图内容变真实和准确。


    第二是专注。每个人的天里都有懒惰，惰性是无法不刻除在。《太吾自传》书中也说过，“集中注意力，拒绝诱惑，控制冲动，克服拖延是非常普遍的个性挑战。


    最后就是坚持。优秀的人是通过磨练意志，持续战胜些弱点，达到自己的目标。其实多很简单，真的不可到拼天能如何，坚持到自律是最有贵的品质，也是最难做到的。自以是现目标的方法，永远只有持久力几千人，自律的人，一生可以有成其他人一辈子都做不到事情，他的生活富态，轻松，时刻充满自信和掌控感，别人眼的苦行僧，拥有的却是人生终级的自由。

    啥自律都有自由。


    年似水 5

    得到的读者看看，请记住我这句话，不要沉浸在成长的感觉之中，却忘记了为成长而努力。这句话听到得到了许少听，会让人沉浸在成长的感受之中，毕竟，成长是需要起吗的努力的。


    少华 2

    特别同意老师本篇立意：

    不要沉浸在成长的感觉中，却忘了为成长而努力；不要把一些新知当做精神鸦片，更重要的是要用这些新知去指导自己生活，改变自己；其实这篇文章经济已经被很好地示范，之前AT文章，中约理论，实际上已经使用在本篇文章中。个人发现，成长不仅在与另外我时刻刻画契约，读到第三，我是和未来的我签约，第章篇篇篇，我是在与时间契约承诺给，去帮助自己去正实现时承诺。老师可以知识使用在本篇文章中，这才叫做事，新知得重要分量所在。将别提醒着自己。


    分享我自己的一个计划：2017.1.1许愿完成我人生中的一个半马。昨天上午完成，时间小1分7分，过程真是很不容易的，想要美好，越到后面越需要坚持，当真的完会，那小小的幸福感是别人无法体会的。


    2017，以半马奠基固，努力执行原量，继续前行。


    500页 1

    许愿的执行和不我是不是一个我，我的验验结果，不过这也终于让我自己清晰地为什么对于这种达到事利感不不感兴。我的每一个目标都系在每一个目标执行完成的或上目标开始设定的时候被设定好，全年有他多时间都在许愿，'
