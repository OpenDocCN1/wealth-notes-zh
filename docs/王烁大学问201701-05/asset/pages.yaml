  md: '难在开始，其实只要开始写，5分钟之后，你有八九忘记了害怕，也许已经写得停不下来了。


    各有各的办法。这是一法，还有人的办法是每天早上不查电子邮件，晨起第一件事就是写作，不写够多少字不许自己站起来。


    只要有用，怎么都行。


    第二，我用中文写作，但却从英文学习写作。中文世界里关于写作的书，太强调才能这类因素，不够实用。英文世界里的写作书则相反，从选择词汇开始，生成句子，构建段落，处处讲透，落到实处，至于谋篇布局做文章之类，反而讲得很少。想想也对，写得多，可见其抱负，基础有了，搭出高楼不会有多大问题，至于搭出来的是火柴盒还是大楼，那是每个作者自己的风格。


    我看过许多英文世界里的写作教程，下面拉个单子，其共通之处是推崇简明：能一个词说清的事，不用两个词；能一句话说清的事，不用两句话；能用通俗的话说清的事，不用术语……如果说中文写作强调加法，英文写作则是强调减法，把不需要的都去掉，剩下的就是合格文章。


    Style Guide of The Economist


    这是《经济学期人》杂志的写作指引，我曾经作过篇幅介绍和分析，有兴趣的可去搜《经济学期人写作法》。


    On Writing,《关于写作》, by Stephen King


    对，你没看错，作者就是那位惊悚小说大家之手。他20年前车祸重伤，术后用写作疗伤，其心得不仅适用于写小说。我印象最深的一句话是：“写作开始于作者的想象，完成于读者的想象。”一定要多品品。


    The Elements of Style,《风格的要素》, by E. B. White and William Strunk


    这是英文写作的圣经，中国人第一次读的话会受震动，原来人家的写作观是这样朴素的。这本书很短小，其中相当部分涉及英文字本身的分析，略过这些部分的话，两个小时能读完。


    The Sense of Style,《风格的感觉》, by Stephen Pinker


    斯蒂芬平克是进化心理学家，这本书用心理学和认知科学的新成果重新审视现代人的写作，书前借用了前代经典 The Elements of Style 书名，可见其抱负。我觉得它达到了预期。如果关于写作只读一本书的话，我推荐这本，原因见下。


    第三，推荐一种文体。


    在本专栏文章中，我有意识地全部采用一种写法，在《风格的感觉》中，斯蒂芬平克称之为经典文体。所谓经典文体，跟经典无关，指的是作者采取与读者对话的姿态；所谓对话，不是用对话体，而是对话姿态。


    # 如何理解？


    用经典文体写作，好比博物馆的解说员向游客介绍藏品，作者向读者讲他想传达的内容。文章制造出作者与读者的共同想象空间，作者引导读者的视线，在观念、物体、事件之间流动。


    有几个关键：


    **首先，作为表达，写作是作者与读者的对话，而不是作者的独白（again，天才除外），作者要相信读者的想象力，所以不必事事点透，但又理解读者毕竟不是作者，凡有需要就应细细讲解。**


    **其次，强调视觉。**所谓视觉，指读好文章时，不论内容是什么，读者跟随作者的指引一路走来，时常会有历历在目的感受。与此相应，作者在人称选择上非常自由，时而你我相信，时而跳出去切换到上帝视角。


    **再有，注重省听。**但凡好文章，必是可读的，不仅是指可阅读，且指可朗读。选词时，意义相近的话，尽可能选上口的那个词；造句时尽可能用短句，如有长句，首先要想如何转换为短句。长句不用则罢，要用则留到有人来听有新鲜感为止。如果文章全是一口气读不完的长句，我早就把它放下了；但如果多是短句，偶尔读到长句，我会知道这是作者给我发信号，我会停下来，接收。


    **第四，最后讲词汇。**语言是活的，它每天都在被创造出来，没有语言的纯洁性这回事，所以好作者总要留意新词，但是，把眼光放得稍微长一点点来看，会发现新词的存活率极低，绝大多数会在一年内死去，经得起时间考验的才能流传下去。好作者必须对哪些新词能够存活下去有判断，如果没有把握，则要首先选择旧词，以我自己为例，每年进入我的语汇集的新词不会超过十个。


    奥威尔和邱吉尔都说过类似的话，用新词是冒险，如果用得极为贴切还好，否则不如用老词，因为后者在无数人数百年使用中早已千锤百炼过，最无聊是用半新不旧的词，连冒险都不是，就是赶时髦了一步而已。


    最后的最后，回扣主题，关于写作如果只记一件事，记住这一件：


    马上写。'
