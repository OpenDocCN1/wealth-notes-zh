  md: '# # 中学问


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_111_0.png)


    本专栏名为《大学·问》，想不到我从中学毕业马上就要满30年，却坐回到中学课堂。


    这也没有什么可难为情的。我听的这堂课，吴敬琏先生也来听过，大为钦服：原来中学也能上经济学，原来中学老师讲经济学讲得这么好。


    这里是Bishop’s School，圣地亚哥地区排名第一的私立中学。在朋友的安排下，我在这里听了一天，4堂课，颇受震动。


    这里不是没有应试教育，事实上我当天所听课中有一堂就是老师讲如何应试。这是堂AP（Advanced Placement）课，简而言之，就是把大学课程拿到中学来教，学生所获学分进入大学有效，不用再修一次。学生们上AP课，一是为了提前拿学分，也证明学习能力，对进入一流大学有利。久而久之，有能力开出多少门AP课，就成了一所中学实力与水平的标志之一。


    这堂经济学AP课已经讲完，两周后统考。老师给学生们作简单总结和应试指引。过程跟国内差不多，学生们领到模拟试卷，老师逐一讲来：如何理解题意；如何准备工具；过程远比结论重要；解题一般有三种方法，列式子、画图、文字陈述，其中画图最受阅卷者欢迎。讲到这里，老师强调：“图一定要画得大大的，千万不要在螺蛳壳里做道场，你麻烦是一回事，阅卷者看不清怎么办？”


    朝向考试当天的调整同样重要：保持正常生活学习节奏，不要刻意调节；考前一天晚上不要再学习了，去看场电影，看完回家睡觉；充足睡眠但不要过多睡眠。等等等等。这些告诫与中国老师差不多，无所不包，不厌其细。我印象深刻的是这节对话：


    > > 老师：“考前不要吃辛辣食物，不然考试时放屁，影响整个考场。”'
