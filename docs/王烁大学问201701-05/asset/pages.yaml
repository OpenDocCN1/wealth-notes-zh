  md: '美国曾经是难民的天堂。


    刚到耶鲁时，IRIS负责人克里斯·乔治向我们介绍，在欧洲向东中东难民打开大门之前，美国多年来是全球世界接收难民最多的国家，超过所有其他国家接收难民的总和。


    每年，美国允许85000名难民入境，审核挑选由国土安全部负责，不分种族、健康情况、宗教信仰、性别、年龄，一句话，没有歧视。乔治说，美国如何对待难民，体现了这个国家精神中最美好的那
    一面。


    美国的政策是只接收难民家庭。把难民一家从机场接出来，送到当地难民安置组织租好的公寓里，所有家具都必须是二手的。同时，要在社区里找来自同一国的家庭，为难民一家做顿家乡饭。让他们在最彷徨无助的时候，闻到令人安心的熟悉味道。


    第二天一早，难民会被请到办公室，当面跟他们说所有事项：医疗、子女上学等等，然后会尽快给他们找到工作。当然不会是什么好工作，基本是低级工作，无论薪酬还是地位，往往远低于难民们在母国原来的工作。


    对难民来说，这一刻回到现实，很难接受，但最终都会接受。


    “当看着孩子背着新书去学校上学的时候，一切都值得呢。”孩子们融入美国社会的速度，会远远超过其父母。一般来说，难民一年内能获得绿卡，五年后可申请入籍。


    乔治说，美国难民政策既宽又严，宽在接收数量多，标准无歧视，严在难民别指望入境后靠山吃山，只能靠自己。给难民的补助水平不仅远低于欧洲国家，还远低于北欧归加拿大——那里新来的难民可以公费学一年语言。美国呢，乔治说，联邦政府给每位难民的经费只有不到三百美元。


    “当初设计这政策的人效仿美国立国之初的精神，你一无所有来到这里，从头做起，但只要努力，有可能，你能实现梦想。”机会给谁，有移民先辈们吃过的苦走过的路，你得再走一遍。也许在母国是大学教授，但在这里得从清洁工做起，一点点往上攀爬，但至少你有了这个机会。


    近年中东战乱，难民骤增。欧洲打开大门，前任美国总统奥巴马表示美国会增加难民接收数量，但有30多个州的州长表示不欢迎难民，都是共和党州长。好在这些在当时不过是政治表态，没有什么用，因为各地法院均判决其违宪，国家该去还是能去。


    康尼迪格州不大，但欢迎难民，2016年安置了500个难民家庭。2015年底，现任副总彭斯暂且担任印第安纳州州长，表示拒绝难民。当时正有一家叙利亚难民，已经在飞越在大洋的航班上，即将到达纽约肯尼迪机场，原准备转机去印第安纳州，现在逼进，难民组织打电话问乔治，你们愿意接收这家人吗？


    欢迎！


    乔治的善举上了《纽约时报》：被印第安纳州拒绝的难民，康尼迪格州欢迎。


    时隔一年，当天此时，全美国有多少个难民家庭滞留机场，面对被遣返的命运？又有谁能帮助他们？


    耶鲁大学偏在纽黑文，世界学人们来往各地通常需要经纽约肯尼迪机场，而交通不便。世界学人项目主管艾米雅推荐我们用一位Uber司机。为什么用他？我们问。首先，他比市场价便宜一点，艾玛说，其次，他原来是位伊拉克难民飞行员，以难民身份来到美国，幸获签证，现已立足，还买了两套房子。你们不想与这个美国梦故事发生点关系吗？


    我们当然都愿意。


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_21_0.png)


    美国本是移民国家，特朗普却在该国。他跨过了开放包容的美国立国之本，而向更古老更动物本能的历史看齐：地盘我先入为主，后来者都是入侵者。这历史贯穿整个动物界和人类历史，只有美国曾经与众不同。每一个国家都可以自居为古有独特，但实际上他们都是一回事，只有美国曾经真正有所不同：人们祖整乘船踏波而来，以理念立国，共遵一个契约，各自实现梦想。


    这样独特的美国，不应毁在特朗普手上。'
