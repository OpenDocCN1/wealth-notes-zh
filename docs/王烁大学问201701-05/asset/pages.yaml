  md: '# 第21周问答 | 贝叶斯对付不了黑天鹅


    **刘婧：**你在《怎样形成有效的判断系统》中推荐贝叶斯方法，动态调整一群人的预期权重，加权平均，形成预测。如果大家的方向都是错的怎么办？就像大空头里面绝大多数金融从业者不觉得楼市会崩。


    **王烁**


    你说到了贝叶斯方法的软肋，就是它无法对抗黑天鹅。这是没办法的事情，**黑天鹅的定义就是无法预测之事**。现在动不动就黑天鹅成稀事，这至少不是黑天鹅的原意。大概率事件，不是小概率，**不在概率集合里的事件才是。或者换句话说，一个是known
    unknown（已经知道不知道），一个是unknown unknown（还不知道不知道）。**


    贝叶斯方法不怕跳跃，再大也不怕。比如，假如一个黑只有两个原因，一个是太阳爆炸了，一个是太阳在地球的另一侧。如果我们有绝对可靠的证据证明太阳并不在地球另一侧，那么，无论太阳爆炸的可能性本来是多么微乎其微，我们只能接受这个解释。正如阿尔摩斯所说，When
    you have eliminated the impossible, whatever remains, however improbable, must
    be the truth. 排除掉所有不可能之后，剩下的就是事实，无论多不可思议。翻了一遍，卷版福尔摩斯第四集全部看完了，终局之作，值得去目送一程。


    但贝叶斯方法对付不了未来的大转折大断裂。太阳每天升起，贝叶斯方法预测明天太阳继续升起这个预测的信心会越来越大，直到不可思议的事情发生，那时只好重置。


    运用贝叶斯方法时，下面两则寓言，一个也不应该忘。


    # **寓言一：亚当夏娃摸石头**


    在伊甸园的第一个晚上，亚当和夏娃不知道太阳第二天会不会升起。但人是人，情况不明也要行动，不能困在无知的情绪里。


    亚当和夏娃作贝叶斯推理，既然不知道会是哪个，那就假设太阳明天升起和不升起的机会各占一半。他们拿出一堆石子，里面放了一块白石头一块黑石头，并决定，如果明天太阳升起，就往里面放一块白石头，如果不升起，就放一块黑石头。第二天早上，太阳升起了。亚当和夏娃往罐子里放了块白石头。


    亚当和夏娃在伊甸园的第二个晚上，还是不确定太阳第三天会再次升起，但是他们对这件事不一无所知。这个晚上，他们从罐子里随机摸出一块石头，以此来猜测明天太阳是否升起，摸出白石头的概率是2/3。第三天早上，太阳又升起了，亚当和夏娃又往罐子里放了块白石头。


    亚当和夏娃在伊甸园的第三个晚上……摸出白石头的概率是3/4。第四天早上，太阳又升起了，亚当和夏娃往罐子里又放了块白石头。


    每天升


    每天放






    太阳每天升高升起，白石头越来越多，黑石头还当初那一块，用摸石头预测次日太阳升起，机会始终是n/n+1，n越大就越接近于1，亚当和夏娃对次日太阳升起的信念会越来越高。


    太阳还在升。


    # **寓言二：饲养员爱我**


    一只猪养在圈里，关心自己的命运，不知道饲养员爱不爱自己，听说了亚当和夏娃摸石头，认为是个好办法。猪也搞了个罐子，白石头代表爱，黑石头代表不爱，各放一块进去。次日要是饲养员来喂食，就再放一块白石头进去。


