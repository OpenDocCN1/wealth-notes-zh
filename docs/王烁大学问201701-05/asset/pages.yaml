  md: '2008年结束的这轮杠杆周期后果如此惨，原因一是此前的平稳期太长积累太多泡沫，二是资产证券化打包太多表面优质其实劣质的资产，三是房地产的杠杆和证券化资产的杠杆都太高，恰逢双重的周期下行，四是CDS兴起提供了做空工具。


    监管者必须监控房地产市场和证券市场的杠杆率，必须问这个问题，“正确”的杠杆率水平是什么？这跟“正确”的利率水平是什么同样重要，但后者美联储做了80年，前者却几乎是空白：管理杠杆的第一步是掌握数据，但2008年以前，美联储没有金融市场杠杆率变动数据，到现在也并不完整。


    为什么？


    因为过去几十年，影子银行占据了美国金融业的半壁江山。影子银行要多复杂有多复杂，原理却很简单，就是金融机构做许多新业务，实际上还是但表面上不是信贷业务，不体现在资产负债表上。何必这么麻烦？因为不想让监管者知道和限制自己的杠杆率水平：移出表外，好把杠杆加上去。这是监管者与业界的猫鼠游戏。


    中国金融监管者也面临相似处境。影子银行过去几年火山爆发，占据了金融业小半壁河山。还记得2015年股灾吗？实质就是高估值的股票加高杠杆，突然逆转，杀到不可收拾。高杠杆怎么加上去的？影子银行也是主力。以场外配资为例，高到1:10的杠杆当时很常见。不过，在股灾之前，证监会、银监会、央行，没人掌握这部分数据，后果大家都看到了。


    中国金融监管改革势在必行，无论未来采取什么形式，要不要成立一个超级机构统一多个监管部门，最关键的第一步，是必须有人能看到整体信息，要了解金融杠杆的总体水平，更要了解激进玩家真实杠杆水平，这里也恰是金融体系的最薄弱环节，多米诺骨牌总是从这里倒下的。


    最后回扣主题，讲人。巴菲特讲过一个笑话：


    天堂很挤，聪明人想出一招，大喊：“地'
