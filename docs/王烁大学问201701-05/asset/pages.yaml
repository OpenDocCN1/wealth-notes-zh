  md: '# ## 全市场通吃的人


    读了本新书，《全市场通吃的人：从拉斯维加斯到华尔街，我怎样战胜庄家和市场》（A Man for All Markets: From Las Vegas to
    Wall Street, How I Beat the Dealer and the Market）。这本书是索普（Edward Thorp）的自传。


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_73_0.png)


    索普是什么人呢？他早年跟信息论发明者、大数学家香农同在MIT学数学。他出身贫寒，特别喜欢动脑筋，又特别喜欢把动脑这事用去挣钱。


    到赌场去算21点挣钱的人很多，索普最早从数学上证明过算牌，玩家可以根据胜率变化相应下注，战胜赌场。


    他还真跑去无数拉斯维加斯去赌，后来把心得写成了《战胜庄家》，成为21点算牌的圣经。再后来他当上数学教授后，发现股市是更大的赌场，既然概率拳能抄到战胜庄家的办法，那为什么不用来抄到战胜市场的办法呢？于是成为最早用数学建立模型的期权对冲基金。这次赚了很多钱，然后又写了本书《战胜市场》。再后来，除了自己赚钱之外，还把钱交给其他Citadel的第一个投资人，他在股价不到1000美元的时候投资贝非特的贝克斯尔哈撒公司，我刚查了一下，现在的价格是24.627万美元一股。


    总之，这是一个人生赢家的故事，脑袋好使，学以致用，钱袋很鼓。


    # ### 讲讲他怎么战胜赌场。


    21点的规则变化很多，核心是这样的：一副牌去掉大小王，剩下52张，1到9分别按面值算，J、Q、K都算10点，A根据情况可以算成1点也可以算成11点。第一轮玩家和庄家都得到两张牌。玩家可以选择不再要牌还是继续要牌，庄家则没有限制，如果两张牌加起来小于17点，则必须继续要牌。21点最大，超过21点则爆牌。庄家的优势是最后一个亮牌，如果他亮牌之前玩家已爆牌，则庄家赢。


    跟赌场所有赌局一样，21点庄家有优势，但其优势在所有赌局中最小，精精计算得出的庄家优势是0.4%，也就是说其胜率略微超过5成，是50.2%。


    但庄家的胜率不是固定不变的，会随发牌变化。一副扑克牌发掉发掉，如果先出来的都是小牌，大牌剩下较多，那么在小剩余的牌堆里大牌较多，而大牌多对庄家不利，因为17点以下他必须要牌，容易爆。这时胜率就倾向于玩家一方，剩下的大牌越多，玩家的胜率就越高。


    所有21点算牌术，都是基于上面这个逻辑。但算牌有个问题，人脑不是计算机器，庄家不可能让你在牌桌上长考。你的玩法再精妙，还得在桌面上能用，在精准度与简便性上得有得兼。


    索普推荐高-低（High-Low）算牌法。小牌2、3、4、5、6是1分；中牌7、8、9是0分；大牌和10分牌（J、Q、K）是-1分。每发一轮牌算一次总分，为正则对玩家有利，为负则对玩家不利，如果剩下的牌越少则相应得分的影响越大，依次下注。


    关键是，玩家要根据胜率变化调整下注，在胜率对庄家有利的时侯，不下注不行，会被赶下牌桌，所以最低限度下注减少损失；在胜率对自己有利的时侯，增加下注，胜率越高，下注越高。'
