  md: '与此对应的，是一场空前的金融自由化。


    过去几年，中国发生了未经宣布的金融管制大爆炸。表面上，中国金融业仍然是分业监管，银行、证券、保险各有一个监管机构，实际上，中国金融业已经进入全面的混业经营。


    2012年以来各监管机构展开了一场监管放松的竞赛。原因很简单，谁放得越宽松，哪个行业就能在这场大潮中受益最大。为什么？因为中国金融监管机构的使命是双重的，监管只是其一，而且不是最重要的使命，最重要的使命是发展。在这场宏大的监管套利面前，监管不光是通常问题如太少太慢，而首先是有意识地为监管套利赋能（enabler）。


    # 刚兑套利与国有信...


    影子银行确实使信贷进一步市场化。对普通人来说，今天中国事实上存在两套利率系统，一套是官方公布的存贷款利率；另一套是投资者获得的理财产品利率，后一套利率系统毫无疑问更加体现市场供需，而影子银行在其中有关键角色。


    但是，在中国，市场从来不是纯粹的，影子银行在中国发展如此迅速，除去监管套利驱动外，还有另外两重套利驱动。


    第一，刚兑套利。对投资者来说，过去在银行存款，现在变成通过银行买投资产品，理论上风险自负，其实是刚性兑付，就是最后你得把钱还给我。银行表面上把信贷业务变成中间业务，不承担风险，其实如果出现风险事件，仍然承担兑付责任。在刚兑延续的情况下，它本质上仍然'
  merge: -1
  img_proc: true
- pgno: 98
  md: '任，是在刚才延续的情况下，它本质上仍然是信贷，但却在监管之外。


    第二，部有信用套利。较高的理财产品利率，一部分原因是市场均衡利率可能高于官方存款利率，另一部分原因则是对国有部门的信用套利。影子银行资金投向与传统信贷资金投向高度重合，主要意愿者仍然是地方政府和国有企业。他们愿意以较高利率获得资金，而银行认为没有违约风险。


    统而言之，影子银行在中国兴起，基于两个重要假设：散户投资者/储户指望刚性兑付；银行指望国家和地方政府不会违约。总的来说，这个重要假设还没有被打破。


    # —— 风险放大器 ——


    今天的中国影子银行是这样的：


    第一，企业任何融资需求都可以设计成产品，通过影子银行系统，销售给投资者，无论风险高低，惟一的限制是想象力；


    第二，如果需要，融资链条可以很长，穿越银行、保险、证券，而每个金融监管者只能看到一段，无人掌握整体信息；


    第三，提供资金的仍仍然是散户，过去是储户，现在是散户投资者。和他们唯一关心的是收益率，因为他们指望刚兑；


    第四，融资来源短期化，多为一期以内，最迟到三个月，高度依赖滚动融资；


    第五，没有信息透明可言；


    接下来我们会看到，姚振华怎样将影子银行的能量用到极尽，撬开了万科大门。


    # —— 姚振华打法 ——


    > “给我一个支点，我能撬起整个地球”——阿基米德


    影子银行给了姚振华需要的支点。他把敌意收购万科这件事做成固定收益产品，然后通过影子银行体系，把它卖给了散户投资者。


    请记住，杠杆敌意收购，是你在资本市场能做风险最高的事情。成功的机率不高，而且一失败，你无法获得被收购公司的资源来再做融资，那么你怎么还收购融资？卖掉刚收购的股票是绝对不行的，那样股价会崩溃，把你埋进去。


    姚振华的融资分成三部分。


    第一部分，金字塔式多层公司结构，层层股权抵押融资。


    姚振华个人控制的公司采用金字塔式结构，公司股权层层抵押，规模总计200亿元，这部分算是相对传统的股权抵押融资。


    其余融资均通过影子银行体系。


    第二部分，控制前海人寿，发行短期工具融资。这家寿险公司几乎没有寿险业务，绝大部分业务是万能险（Universal Life Insurance）。万能险的英文名里虽然有人寿两个字，但跟寿险没什么关系。所有保费进投资保户，几乎不保障保户。保户提前退保费也没有惩罚，最迟三个月后即可无手续退保，保本质上是短期融资工具。姚用它筹了104亿用来买万科。


    姚振华把万能险用到极致，但这不是他发明的。整个中国保险行业都陷入了万能险狂飙。中国寿险公司2016年保费投款新增1.12万亿元，比上年增长超过100%，绝大部分来源于万能险。


    第三部分，通过影子银行体系循环杠杆融资。大体上这样：把收购万科作为一个投资产品，拿出部分资金劣先后，通过影子银行体系，把优先级销售给散户，然后散户与优先级资金加上下轮带新资金的后部分，去获得更多的优先级融资。层层放大，总计筹得大约276亿。


    所谓劣后，就是出现亏损的话先亏劣后，以此来保障优先级资金的安全。问题是，层层最后，下层的优先级无非是上层的劣后级，所谓的保护只是幻影。


    综上，宝能过股权投资、保险产品、银行资金以及券商融资计划，总计筹资逾600亿元。最终，姚振华收购万科25%股权，成为第一大股东。


    这就是中国版“门口的野蛮人”标准模式：以银行庞大的表外资金池为终端募集来源，聚沙成塔，通过持股金机构搭建复杂的架构，举牌、控股境内外标的公司，全面重组公司，使其成为下一轮加杠杆的基础——极少的自有资金，极高的杠杆，极度的不透明，做风险极大的敌意收购。'
