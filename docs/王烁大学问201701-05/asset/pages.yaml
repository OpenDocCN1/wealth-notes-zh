    我建议，未来看两个指标。


    **第一，房贷负担达到居民收入所能承担的极限。** 前面引用用来衡量美国买房收入要求，房贷占收入的 1 / 4，中国人们不用想了。现在一般人的情况是还完房贷后只顾得上温饱。房价涨到什么地步这两者才不能兼顾？房贷总量
    / 居民可支配收入这个指标，要盯住。


