  md: '# 第19周问答 | 税收是怎么回事


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_7_0.png)


    > **静姝：为什么越说减税税负反而越高了？什么是死亡率？**


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_7_1.png)


    **王烁**


    **税收是一个正常国家最大的政治。** 国家是无数人的集合，有人穷有人富，大家在一起过日子，出钱一是要办公共服务，二是扶助穷人，维持起码的社会凝聚力。谁多出钱谁少出钱？谁多受益谁少受益？就算在一个家族里，这也是最敏感最有争议的主题，更何况一个国家这么多人。更何况，税收是由政府来收的。作为一个国家内部最强大的力量，政府事实上是个独立的主体，税收取之于民用之于民，但不是简单穿透过去的。


    两只小熊分饼，不知道怎么分合理。狐狸说我来帮你们，一掰两半，咦，怎么一边大一边小；公平；为了公平，狐狸咬一口大的；咦，怎么现在另一半变大了，再咬一口；咬咬咬，最后还剩点渣，公平地分给了两只小熊。


    现在是税务局说减税了，企业家说税负重。谁说得对？


    我觉得一个类似的指计，是看财政收入每年增长的比例与GDP增速之间的关系，具体你自己去查。有几点要注意，中国公布的GDP增速是实际值，财税收入是名义的，你要把GDP增速换算成名义值以后再比；第二是财税收入数据与统计局的经济数据两者可靠程度不同。尽管有这些提醒，但这个指标总是比税务局和企业家口舌之争强。


    死亡率这个词令人惊心，实质指的是税负太高，使得企业没有动力从事生产经营。用《大学问》刚更新文章里的话说，就是**过高税率导致税基急剧收缩**。文章里讲，想征收同样的税，拉弗曲线点有两个点，一个是高税率低税基，一个是低税率高税基。后者对社会有利，而在不少国家，前者有可能对征税当局有利：征税的主体少，省事；高税率使整个社会普遍偷税，增加了官吏的自由裁量权和选择性执法能力。16人笔记


    国家、纳税人、政府、征税机关、征税官吏，不同的主体激励约束各自不同。


    欢迎留言提问，每周六我会作答。


