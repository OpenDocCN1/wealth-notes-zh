  md: "# 第18周问答 | 怎样形成有效的判断系统？\n\n陈琪：中央经济工作会议召开了，这对我们大多数人来说有哪些指导意义？\n\n王烁\n\n挑你这个问题来答，不是想要回答这个问题本身，而是想借机介绍一种分析框架。\n\
    \n第一，分析中央经济工作会议的内容本身，其实意义不大。如果会议真有用，就不用开这么多会了。中国经济改革该怎么做，早就有很好的方案，就是三年前三个全会通过的全面深化改革决定，那是个很好的方案，不如观察执行。文件已经太多了。\n\
    \n第二，不过，文件事实上对市场是有影响的。市场开了一会之后，会一会儿炒那个，其驱动力的重要来源之一就是这些文件。这倒不是说市场，而是驱动市场的力量在短期是凯恩斯所说的选美逻辑。\n\
    \n什么是选美逻辑呢？\n\n选美比赛，观众投票，选中那个最赢得比赛的选美女的观众获胜。这个博弈中，你自己觉得谁最美是没用的。有用的是选中那个觉得谁最美最准确的选手。这样靠猜，你猜大家，可大家也在做同样的事，每个人都猜猜猜大家，就成了这么个你情我侬情猜大家无穷反复的游戏。非事实上最美是无意义的，这个无穷反复的游戏谁选美最准确谁最美。\n\
    \n文件就是给市场提供了这么个猜来猜去的契机。你猜到别人怎么猜别人怎么，别人猜你怎么，你怎么看文件，你猜别人怎么猜你看到这个文件。在无穷尽、往复互嵌的猜测链中，市场动了。\n\
    \n巴非特说市短期中是选美比赛，就是这个意思。当然，他还有下半句：长期中，市场是体重计。就不在这里讲了。\n\n第三，如果你一定要分析这些东西，推荐个办法，简单的贝叶斯推理实用。\n\
    \n无论哪个问题，关于未来你设定三种可能情形：上、中、下。哪种发生的可能性各是多？如果你已有一个初步判断，就给上中下以相应的概率；如果你还没有判断，就给他们相同的概率。接下来，有人会告诉你会发生新的事情带来新信息，这会影响到你判断，那你就相应调整概率。这是个简单的个人判断系统，肯定比每次临时拍脑袋想更靠谱。\n\
    \n接下来，找一群你觉得靠谱的人，每个人用这套系统，形成、更新各自判断，然后简单平均，会产生一个更好的判断系统。\n\n再进一步，时间过去，这群人不断地产生判断与检验，你会发现不必对所有人的判断作简单平均，因为有些人比另外一些人更靠谱，于是你对判断者的权重作调整，靠谱的人权重逐渐增加，不靠谱的人权重逐渐下降，然后根据权重组，加权平均形成判断，获得更高的准确度。\n\
    \n这时你已经获得了两样东西：不仅获得了一个判断者的评价系统，还获得了一个预测系统。它们的效力远超绝大多数所谓专家。\n\n试试吧。\n\n欢迎留言写下你的问题，每周六我会作答。\n\
    \n![](img/d0b39398554e3d9ba7f47bdd8890a825_3_0.png)\n\n![](img/d0b39398554e3d9ba7f47bdd8890a825_3_1.png)\n\
    \n# 用户留言\n\n+   1.  **christina** (5)\n    感觉有迹象像古代军师给与的上中下三种情景，选择哪种最合适。而现代是自己当成军师去培养来判断然后给出上中下三策，然后再参考其他军师，然后再选出一些水深高用的军师参考，嘿嘿\U0001F604\
