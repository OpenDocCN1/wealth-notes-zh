  md: '# # 第30周问答 ｜ 关于指数

    ## 知道这些就行了


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_75_0.png)


    **人生美好**：1. 标普500指数和纳斯达克指数哪个更有活力？哪个更优质？2. 国内各种股指沪股、深股、沪深300、中小板、创业板指数，哪个相对能代表最好的上市公司？为什么会有这么多指数？


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_75_1.png)


    **王烁**


    你这些问题基本是错的。指数本身谈不上好坏，一定要谈好坏，要看是否达到了编制指数的目标。比如说，道琼斯30种工业股指数、标普500指数，都致力从上市公司中挑出一个子集，又能代表股市整体情况，甚至能代表美国经济体表现。30家道指公司和500家标普指数公司对美国股市和美国经济的代表性怎样，存在好与坏的问题。


    但是，大量指数，比如纳斯达克指数、上证指数等，只要是在该市场上市，满足最低条件，就统统纳入指数，你说这类指数的代表性如何？代表本市场肯定是够了，因为它就是全市场指数；对经济表现的代表性如何呢？未必。比如纳斯达克大公司很大部分权重是信息技术，纳指就主要代表这类公司的市场表现，对美国经济代表性并不充分；而上证指数按市值权重编制，大市值公司对指数的影响较大，翻译过来也就是说，央企对指数的影响较大。许多人因此认为，它对中国经济表现的代表性较弱。


    一般人，对于指数关心这么几点就够了：


    **第一，用什么标准选择加入指数的股票？**比如标普指数公司500家在纽交所和纳斯达克上市的股份公司，其中40家制造业公司、20家交通运输类公司、40家金融公司、40家服务类公司，被认为比道指和纳指更能代表美国经济，道指30家太少了，纳指过度倾向于信息技术。对冲基金经理要想对冲市场风险的时候，会用标普500指数作标的，不会用道指或者纳指。


    **第二，采用什么方法确定权重？**一般是两种之一，价格或者市值。前者的话，小市值但高股价公司对指数影响大；后者的话，大市值公司对指数影响大。没有什么指数是完美的，但你得知道它是往哪个方向不完美。


    **第三，指数除了反映市况之外，还能帮助投资者更准确地勾勒出风险/收益。**比如说，如果看好科技股，可以做多纳斯达克指数，但市场整体下跌怎么办？有些投资者就会做细做，做多纳斯达克指数，做空标准普500指数，其逻辑是市场整体下跌没关系，只要信息科技类表现强过市场整体表现就行。这想法是对是错？市场最后给出答案，但至少你作出了更精确的表达。指数及其组台帮助你更精确地表达看法，拥抱你想拥抱的那些风险，而不是打包全给你。


    **第四，我们提到这些中国市场上的指数，有些很有问题，但问题主要不在编制方法，而在于许多指数其实并不反映不同的风险/收益。**比如说，请问中小板指数和创业板指数有什么不同？两个市场上的上市公司们，除了代码字头不同，还有什么不同？当然，这不是指数本身的问题，而是中国证券市场本身的扭曲。好的指数，要么能代表市场整体的风险/收益，要么能代表某类独特的风险/收益，中国市场上的指数，两边都不靠的有点多。


    以后有机会讲讲指数基金。


