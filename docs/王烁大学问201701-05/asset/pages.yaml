  md: '# 第32周问答｜怎样选择指数基金


    上期问答讲了普通投资者对指数需要知道什么，这期接着讲**指数基金**。


    如果你想用指数基金来做投资组合，记住下面这些：


    **第一，投资于指数基金意味着你只想抓住贝塔（市场收益），放弃对于阿尔法（超额收益）的妄念。**只要我读过本专栏的极简直金课，就知道，这是对的。


    **第二，不要买杠杆类指数基金。**


    许多人买指数基金，但想用杠杆来放大收益。这对普通人杠杆很贵，时间对你不利。对于普通人来说，面对专业投资者是处处不利，惟有一点占上风，就是比专业投资者更有时间，专业投资者必须每个季度都战胜基准，他们没有时间。普通人买杠杆指数基金，等于自断一臂。


    以国内的分级基金为例，本质上是A类向B类贷款，B类投资者向A类投资者付固定回报，还要负担整个基金的管理费和其他成本。整个结构类似于赌场，赌场方面对着手已本利的概率，预期收益显著为负，有越玩玩得越多，结果就越稳定地亏损。现实中，分级基金B类投资者基本是散户，A类基本是以保险公司为主的机构投资者，正说明了这一点。B类没有A类情。


    **第三，要了解指数基金相对于指数的跟踪误差。**


    指数基金等于在市场上重新复制指数所代表的策略，往往存在误差，越小越好。如果一个指数基金表现长期显著低于所跟踪的指数，当然不行；但即使是显著好于所跟踪的指数，同样不行，因为你想要的是与特定指数对应的风险/收益，而基金经理肯定要背着你去追逐了其他风险/收益，对你说和他自己干的不是一回事。


    **第四，低成本为王。**


    指数基金的收益是市场收益，天花板已经看见了，而且收益的方法很简单，复制而已，所以投资者没有为指数基金付高成本的理由。在跟踪误差最小化的前提下，低成本为王，越便宜越好。


    而且，低成本与指数基金的另一个重要标记高流动性往往在，你要选成本低、规模大的指数基金。


    可惜，用上面这几把简单的尺子去度量中国基金市场，会发现很不尽如人意。杠杆市场太多，跟踪误差不小，而且成本太高。


    放眼全世界，这类问题同样存在，但找到合适的指数基金的机会就大多了。比如，先锋基金（Vanguard Group）以极低成本著称，旗下绝大多数ETF（在交易所上市的指数基金）每年的佣金水平在0.05%到0.10%之间。多年以前，先锋基金开创了面向大众的第一只指数基金，今天已经管理着4万亿美元资产，规模超过中国中外，仍然主打低佣金，业界良心。


    国内有哪些跟踪误差小、成本低、所跟踪指数也合理的指数基金？欢迎在下面留言。


    **最后，推荐先锋基金创始人约翰·博格（John Bogle）的一本小书，《常识投资红书：获得属于你那份市场收益的唯一靠谱办法》（The Little Book
    of Common Sense Investing: The Only Way to Guarantee Your Fair Share of Stock
    Market Returns）。我上面所讲的，这本书里讲得更好。**


