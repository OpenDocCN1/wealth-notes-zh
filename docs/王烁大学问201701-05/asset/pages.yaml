    # 第29周问答 | 给世界学人荐书


    收到同期耶鲁世界学人坎巴（Kanbar）来信：“亲爱的王烁，你能给我推荐些书吗？”


    当然可以。


    多说几句坎巴，他是贝鲁奇人，居住在伊朗东北的少数民族；9岁时他被族人带走，跋山涉水，徒步越过边境，然后辗转来到英国，与先期到达的母亲会合。在英国长大，受教育，进入外交部，现已进入高级外交官序列。他的人生小目标是在40岁前成为正式大使，我看实现并无问题。


    坎巴喜交际，拥抱各种热闹，是同期16位世界学人的粘合剂。他给大家留下深刻印象，不论在什么场合是对谁，都能提出非常独特且有趣的问题。身为新闻工作者，我很羡慕这本事，问他怎么来的，他说，因为对每个人都感兴趣。


    这种人不做外交官简直可惜了。


    他另外还有个本事，他是那种思路转得比说话快的人。这种人我倒见过一些，因为思路转得太快，说话跟不上，所以说断断续续，因为说着说着思路就跳到后面去了，如果说说的话原样整理出来，简直不成句。但坎巴不同，出口成章，他要不说法，我无论如何猜不到他也是思路快过说话的人。问他窍门何在，他说，很简单，第一，你要意识到自己有这个问题；第二，意识到之后，就控制住自己，压住，慢慢说。


    坎巴说来简单，其实需要很多训练，没有足够强大的自控能力是做不到的。


    下面是我给坎巴的荐书，引号内是坎巴的要求，后面是我的相应推荐。


    “关于哲学的书——如何理解现代世界的复杂性”


    《概率和归纳逻辑导论》，An Introduction to Probability and Inductive Logic


    by Ian Hacking


    《与天斗》，Against the Gods: The Remarkable Story of Risk


    by Peter L. Bernstein


    这两本书都相当老，一本出自哲学家、逻辑学家Hacking之手，一本出自金融学家兼作家伯恩斯坦之手。前者既是概率、归纳推理的入门，又有惟大才能达到融会贯通；后者是金融世界以实践认知风险的史。这两本书我认为都强过Nassim
    Taleb的黑天鹅。


    “关于管理焦虑的书”'
