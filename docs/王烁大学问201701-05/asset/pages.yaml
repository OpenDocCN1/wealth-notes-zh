  md: '尺；好坏善恶忠奸好没有。大家一起做蛋糕，这是非和博弈。彼此会倾向于合作，合作就有蛋糕不合作就无，合作得好就大大好则小。分蛋糕就不一样。是非和博弈，你多多我少，我多你少，是零下没有只放不分的蛋糕，也没有不用做就能分、凭空掉下来的蛋糕。合作与背叛交织，共存于包包创造与偷窃而有的人际协同之中。如果你为合作愉快而忘却了背叛就在转弯处，因为被背叛过就对一切合作丧失信心，结果都很惨。


