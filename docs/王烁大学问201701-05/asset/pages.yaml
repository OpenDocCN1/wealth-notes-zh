- pgno: 18
  md: '布雷耶，1938年生，就读于斯坦福大学、牛津大学、哈佛大学法学院，曾长期执教哈佛法学院，治民事、行政和检察制度，曾出任过“水门事件”的特别调查官助理，1980年成为美国联邦第一巡回上诉法院法官，1994年成为联邦最高法院大法官。许多人认为，在目前的9人之中，布雷耶智慧最为超群。


    布雷耶这么回答：


    如果只是文本，那么宪法没有任何用处。如果没有人遵从宪法，其下场就是放到博物馆里而已。那怎样才能才使人遵从宪法呢？总要有人来做这件事啊。


    政府三权分立，一个个说起来。


    总统做行吗？总统无非是说他做的一切都是对的。


    国会行吗？国会是选出来的。那好，听国会的，但国会有个大问题，就是只做受欢迎的事，因为国会议员都是选出来的，全是怎样才能受欢迎这件事的专家。


    不受欢迎的事情谁来做？


    那就法官吧。可是，法官既无名，又无钱，还没枪。哪里都一样。


    最高法院的权威也不是从天上掉下来的。


    1830年，佐治亚州发现金矿，州长要把金矿所在地上的印第安人赶走。印第安人走诉讼程序，打到最高法院。著名首席大法官约翰·马歇尔执掌的最高院裁决州政府无权强行迁移印第安人。


    但是，时任总统安德鲁·杰克逊总统说，马歇尔的裁决，让他自己去执行吧。


    于是，最高法院裁决事实上成为一纸空白。印第安人被遣离家园，走上血泪之路，一直通到俄克拉荷马。


    法治真是颁布一部宪法的事。


    再过100多年，1954年，美国最高法院判决种族隔离违宪。阿肯色州小石城学校招收9名黑人小孩入学，但遭到州长派国民卫队制止。你有判决，我有军队。


    但是，时任美国总统艾森豪威尔签署法案，接管了阿肯色州国民卫队，并派去101空降师1000名老兵，一群经战场的老兵，全副武装，护送黑人小孩入学。这是美国历史上最令人难忘的时刻。


    然后呢？


    过了几个月，黑人小孩又没学上了，因为州长一计不成再生一计，干脆把学校给关了。


    种族隔离的真正废除，要等到多年之后，要经过马丁·路德·金和民权运动，也不再仅仅是军人、律师、法官、州长的游戏，而是全社会力量的凝聚。


    “美国有3亿多人不是律师呢！”布雷耶说。法治能凝聚社会，不过，当法治对你有利时，你守法很容易；法治对你不利的时候呢？你会遵守不认同的判决吗？不是那么容易吧？更何况，法官也会犯错误。


    怎么办？没有简单的答案。


    布雷耶对这位外国首席大法官说，到最后，就是慢待来，法官与法律共同体以及整个社会对话，解释、解释、解释。


    他说，2000年美国总统大选，共和党候选人布什与民主党候选人戈尔对决，差距极小，计票纠纷打到最高法院，最终以5:4作出对布什有利的判决。布雷耶说，这个判决是个试验石：它可能是美国历史上最不受欢迎的判决；它极其重要，因为关系到总统的归属；它还很可能错了，布雷耶当时投的就是反对票。


    但是，大家接受了判决，没有上街，没有扔石头，没有开枪。因为，说到底，不尊重法治的后果是什么呢？想知道后果很容易。“打开电视看新闻，看那些来自没有法治的国家的新间，看那里的人如何决定事情。”


    很惨。


    所以呢，美国就好好在，三亿多人，想法不同，信仰不同，族群不同，利益不同，但被宪法绑在一起往前走，大体都听法官的，大体都尊重法治。


    只是必须得清醒，“法治需要很长时间才能稳固，而且永远在悬崖边缘，所以我们需要法学院、律师、法官，整个法律共同体与社会的对话。”


    布雷耶对年轻人的期待，就是不要陷入犬儒主义（cynicism）。


    “我不能告诉你怎么过日子。我希望你能找到爱人，找到喜欢的工作，还希望你能参与所在地的委员会，到图书馆当义工，到社区公园管管事，或者竞选公职，至少去投票吧！愤世嫉俗无用。如果别人不同意你，那去说服他呀。如果你不想做这些，那宪法就真的只是一张纸，帮不了你。宪法只是告诉你什么不能做，并不能告诉你做什么。怎么做，在你自己。”


    最后，附一段关于学习的话，来自诗人、政治学家Michael Oakeshott，布雷耶在自己的新书《法庭与世界》中转引，并在今天的对话中朗诵：'
