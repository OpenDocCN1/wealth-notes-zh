  md: "# # 第35周问答 | 得到的竞争力\n\nJeff. Qin: 怎样才能比较清晰地研究透彻一个产业?\n\n我从来不去研究透彻一个产业。如果需要研究，我只会去了解大概八成。怎么了解到八成，我倒是有个建议。\n\
    \n第一，这个行业 / 公司靠什么赚钱。这个不用过多解释。\n\n第二，用波特的竞争五力模型看得细一点。看一个行业 / 公司，看五种力量:\n\n+   1、上游，就是供应商;\n\
    2、下游，就是买家;\n3、看已存在的竞争者;\n4、看潜在的竞争者，就是谁有可能进入这个市场;\n5、最后看整个行业面临什么样的替代品威胁。\n\n对每家公司来说，对于上游的压价能力，对于买家的要价能力，对于竞争者的竞争能力，阻止潜在竞争者进入的能力，以及无可替代的能力，决定了其地位；\
    \ 如果已知主要玩家在五力作用下所处的位置，你对行业已就了解得差不多了。\n\n我一般到这里就结束。如果你还想了解得更微观一点，那么可以用杜邦分析法来分析行业、企业的财务特点。\n\
    \n第三，杜邦分析法 出自杜邦家族派到通用汽车的前财务总监，从商务角色指导通用汽车改进管理，成为20世纪中最成功的商业准则。出发点是净资产收益率，就是净利润\
    \ / 净资产，也是企业利润的最终落脚点。\n\n净资产收益率 = 利润率 × 资产周转率 × 权益乘数\n\n又可以进一步分解为：\n\n净资产收益率=(净利润\
    \ / 销售收入) × (销售收入 / 总资产) × (总资产 / 净资产)\n\n其实这串式子是恒等式，为什么能用来管理企业呢？因为它标出了利润的三大来源：利润率如何提高，周转率够不够，有没有借钱？如果每笔赚得多，卖得快，又不需要花自己的钱，那净资产收益率就高上去了。正因为它是恒等式，所以管理上可以根据要求突出任何一个环节来查看问题与机会，重新理一下式子就可以了。\n\
    \n不同行业在这个式子中强调不同要素，比如零售最重视周转率，银行最核心的是杠杆率。\n\n第四，我小试牛刀，现卖现用，来看看得到这个产品。\n\n# ###\
    \ 得到怎么赚钱？\n\n一句话，得到靠内容容器包销售赚钱。所谓背包，是打包的过程。传统媒体是一层一层地打包。首先是内容与广告的打包，其次是内容的打包，把报道与观点打包，把不同内容的打包，把不同平台打包。如果你只要在手机上消费内容，你是不会接受打包的。得到是反过来的，是把包拆开来。我想包，同一支出得到20多位作者的全部专栏，总支出4000多块钱，比订阅一份份报纸贵得多。而后者是面向大众媒体提供新闻、言论、知识的全世界最高水平内容，层层打包了不知道多少珍宝。移动阅读时代，背包能赚钱，打包比较难。\n\
    \n# ### 得到的杜邦分析\n\n这个没法分析，没数据。\n\n# ### 得到的五力分析\n\n上游：就是作者，好作者当然有议价能力，但有个情况是好作者并不缺。这条得到可以的。\n\
    \n下游：就是买家，也就是你们。我觉得得到的用户群相当特殊，忠诚度较高，支付意愿高。这条得到可以。\n\n已有竞争者：看起来，竞争者还不多。看起来，跟竞争者相比，得到比较克制也比较竞争。这条得到可以。\n\
    \n潜在竞争者：如果微信会启动收费阅读模式，那么头部内容竞争会加剧。这条不确定性很大。\n\n替代品威胁：什么能够替代内容容器包销售呢？不知道，肯定会有。\n\
    \n总结：从五力分析看，能看清的地方，得到的竞争力处在不错和很不错的中间，问题在于看不清的地方，这是移动互联网时代内容行业的特点，一切都**在迅速改变**。最后胜出的，要么千里眼，要么幸运儿。\n\
