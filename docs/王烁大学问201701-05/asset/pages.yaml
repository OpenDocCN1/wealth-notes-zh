    \    无论什么问题，在未来无非有中下三种结果，这三种可能性分别是多少，如果已经有了判断，你可以给出概率；如果没有判断，就假定概率发生是一样的，静等新闻出现后，再调整相应概率，然后再找到一组人，都用这个判断系统，根据新闻各自调整自己的概率来判断，然后所有人的平均值形成一个算法。随着时间推移，每个人的判断准确率也不一样的，给与不同的人算法，给予算法，不断优化。这个时候，这个评价系统也具备预测功能了。\n\
    \    贝叶斯分析的思路对于由证据的积累来推测一个事物当下的概率有重大作用，它告诉我们当发生前预测一个事物，我们需要的首先根据已有的经验和知识推断一个先验概率，然后在证据不断更新的情况下调整这个概率，整个通过概率来得到下一个事件发生概率的过程我们称为贝叶斯分析，贝叶斯定理正在变得如此流行，纽约时报，贝叶斯研究，从生物学到心理学，更不要说人工智的学学了。物理学家提出了量子版本的贝叶斯解释，以及贝叶斯推广了弦和多重宇宙理论。哲学家主张作为一个整体的科学可以被规为一个贝叶斯过程，还有Karl\
