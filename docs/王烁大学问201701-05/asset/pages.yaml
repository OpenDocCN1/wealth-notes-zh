    \n+   - 活水清零：\n  您今天的观点，同以前说的一致性很强，即知识的游牧民族，用百分之八十了解一个专业。\n\n  五力分析，也需要对该行业有足够的了解，这个理解和掌握，是靠清源数据得到，对吧？\n\
