  md: '# 斯文森：识人方有阿尔法


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_28_0.png)


    我见过不少投资机构的办公室，大卫·斯文森 (David Swensen) 的办公室最简朴。


    从纽黑文惠特尼街55号上到5层出电梯，前台就是这个氛围，看样子来自官寨。斯文森的个人办公室同样宜家风。


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_28_1.png)


    斯文森是耶鲁校友基金管理人，活着的传奇。耶鲁校友基金管理260多亿美元资金，仅次于哈佛，而斯文森在业界的影响力更大。


    校友基金 (University Endowment) 既不特殊也特殊。不特殊在于校产基金管理的也是资金，是资金就要有回报；特殊之处在于大学是永续的所以校产基金是永续的，它有超长的投资视野。


    有多长呢？


    耶鲁大学建校时间比美国建国还要长70年。校产基金运营的目标是支持大学延续到无尽的未来。


    校产基金主要来自捐赠，在一流大学的资金来源中占有越来越重要的位置。耶鲁大学每年预算中有近一半总预算、十多亿美元来自校产基金。许多人认为，对耶鲁大学贡献最大的就是斯文森。


    以耶鲁世界学人项目为例，大概一半预算来自校方拨款，一半来自捐赠。去年获得国际保险巨头约翰格伯的1500万美元捐赠，加上现有的捐赠资金，保证项目得以永续。这些钱会到校产基金里，哪怕校方拨款出现什么不测问题，来自校产基金投资的收益也足以保证项目不受影响。


    你看到的所有冠名讲座席，无不如此。


    斯文森是真正的学院派投资人。他在耶鲁求学，师从诺奖得主托宾，其职业生涯的绝大部分都在耶鲁校产基金度过，把安邦、陈旧、保守的校产基金带入了新时代。


