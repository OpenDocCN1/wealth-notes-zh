  md: "张磊说，今天高瓴投资首重研究，而研究中则重视将同理心由个人的素质变成机构的制度（institutionalized empathy）。保持住这个能力，才能把握变化，前瞻未来，从中找到价值复合增长的路径。\n\
    \n同理心重要还是自己的判断重要？张磊没有直接回答这个问题，但席间有学生问到他在高瓴做不做宏观对冲（global macro）类的投资，他说不做，其实张磊在耶鲁时同时修了国际关系和MBA两个学位，“我对宏观当然有看法，但这根本不重要，因为它并不体现在我们的投资里——我们总是自下而上投资，关注一家企业、一门生意本身的潜质。”\n\
    \n如何理解张磊所说的同理心？其实很简单，就是跳出自己，站在别人的角度思考。这就是策略思维，也就是博弈论的研究对象。策略思维天然假设有同理心，博弈论说到底，不外乎常识，就是策略性思考：要根据对方策略的预测相应采取行动，当然别人也是这样。\n\
    \n可惜，大多数人并不作策略性思考，而是被己心所困；正因如此，那些能站到自己之外站在对方角度看问题的人，在漫长的博弈中占到先机。\n\n![](img/d0b39398554e3d9ba7f47bdd8890a825_68_0.png)\n\
    \n恰好最近看到一本奇书，《简·奥斯汀是博弈论专家》，（Jane Austin, Game Theorisit），作者详解简·奥斯汀六本小说，一一与博弈论的经典场景对照，非常有趣。作者认为奥斯汀最大贡献在于讲明为什么太多人从不做策略性思考。她把这种称为没头脑（c1uelessness），有五种原因：一是智商欠费；二是不了解对方；对三是过于自我中心，以为自己怎么看别人也怎么看；四是地位差别，在上位者认为根本没必要了解在下位者的必要；五是过度自信，觉得反正能改变对方，何必修他原来想什么？\n\
