    \n第三，如果游戏是一次性的，这个问题没有标准答案。钱对每个人的效用不同，100万美元对普通很重要，1亿美元（或者的例子5000万美元预期收益）对王健林来说只是完成个小目标。对同一个人来说，100万美元和1亿美元的效用也不是线性递增的。否则怎么会有“第一桶金”的概念？如果线性递增，则一百桶金的话都应该是一样的。而对于要饿死的人来说，确定的一百万比不确定的1亿重要，一百万就能活下来，博一亿可能死。\n\
    \n不幸的是，人生百年，许多事是重复发生的，或者至少是许多人可用可重复的眼光来对待他们。所谓把眼光放长，不执着于一事一地一事，即指此。\n\n不幸的是，越重要的选择越难为重复，最重要的选择往往不可重复。我们应该作何选择？\n\
