  md: '旁边测量轮盘的速度，然后脚跟趾头踩发出信号，索普用耳机接收，根据庄家转动轮盘的情况可预测球最终落在哪些区域的概率偏高。


    他们乔装打扮去拉斯维加斯实操，证明有眼，但那毕竟是可穿戴设备的史前时代，玩起来很累，因为耳机线要使得很细，太容易坏，经常得维修，结果玩着玩着就算了。这套设备至今还放在MIT的计算机博物馆里。


    # ——三——


    他发现了将概率、数学和发财梦用于现实的更好也更大的赌场：金融市场。


    索普跟巴菲特有过深谈，觉得自己与巴菲特完全不同，他不想去判断一门生意的优劣，更想发现同一家公司不同证券之间的错价，做对冲，控告交易，买卖卖，不受市场上下影响。


    他第一步做涡轮与正股套利，然后做可转债与涡轮套利，然后把心得写了本书《战胜市场》。


    他早在1967年就发现了期权定价方法，当然他没吭气，闷声发大财。1973年，费什·布莱克（Fisher Black）给他寄来一篇论文，介绍他与合作者发现的期权定价公式，并感谢索普《战胜市场》中介绍的对冲方法的启发。索普一看，这不跟我这几年实操的方法一样吗？


    期权定价公式最终为其发明人带来了诺贝尔经济学奖，布莱克因早逝没有等到那一天。


    索普与布莱克交好，但与公式的另一位发明者罗伯特·默顿和斯科尔斯打了多年笔仗，互为对方是愚不可及。在学界，索普无法与对方的威望对抗，但赌博这种事件由实践证明。默顿与斯科尔斯参与创立长期资本管理公司，结果爆仓，因为持仓巨大还引得美联储牵头干预。索普等来了市场的裁决：“默顿这帮人没按凯利判断下注，赌得太大。”


    # ——四——


    在自序中，索普说，自己基本靠自学，所以想得跟人大不同。


    +   1. 第一，不盲从常识，比如大家都说不能战胜赌场，那得自己试试。


    +   2. 第二，习惯将纯粹思想变成盈利工具。


    +   3. 第三，设定目标，制定可行计划，坚持到底。


    +   4. 第四，努力做到一贯理性，不是只在某个专业领域里而已，而是在与世界打交道的所有方面。


    +   5. 第五，在基于证据作出决策之前，保留判断。


