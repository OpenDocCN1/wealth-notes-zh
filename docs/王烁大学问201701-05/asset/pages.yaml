    Institutional Investing），一本是《不寻常的成功》（Unconventional Success），前一本是机构投资，后一本是给普通投资者的。


    其实我真想写的是后面这本，但出版商跟我说，你的声誉是在机构投资领域里，所以必须先写前一本，我才能给你出后一本。这其实，于是我就两本都写了，但我的激情是在后一本上。


    我知道，机构投资这本书出了中文版，给普通投资者的书在中国大概不会很受欢迎，因为他们只关心趋势投资，想尽快发财。但想尽快发财的话，结果是尽快变穷。世界不是这样的。


    有趣的是，我刚开始写时想的是告诉普通投资者，我们在耶鲁做的投资中，他们可以做什么。我把我们的各种投资工具看了看，像LBO、风险投资、房地产这些追求绝对回报的投资工具，普通投资者无法获得。


