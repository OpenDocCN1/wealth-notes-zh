  md: '# 进阶金融课（6）：杠杆的“野蛮人”玩法


    下篇来自我在UCSD二十一世纪中国中心所作讲座“杠杆故意收购与中国影子银行的兴起”。


    上一篇讲巴菲特玩杠杆的方法，到今天基本已成绝响，就是告诉你，你也很难玩。一般人当然就不是不允许你，但就算你掌握了一家保险公司，恐怕也很难复制巴菲特打法。无他，诱惑太大。你只有像巴菲特一样敬畏风险，才会像他一样小心地驾驭杠杆。


    我来介绍另一种杠杆玩法，出自枭雄之手，与中国资本市场上最大一宗敌意杠杆收购案有关。有三点使它重要。


    第一，它带来了中国资本市场上从未见过的新潮流，敌意杠杆收购，有可能像1980年代美国资本市场上用垃圾债敌意杠杆收购一样，带来系统性冲击。


    第二，它是中国今天典型的造富故事。一位成而不知名的房地产商人，经过起杠杆收购，成为中国著名的地产人之一，在最新的富豪榜上排名第四，至少在纸面上。


    第三，可能是最重要的一点：它是中国正在兴起的影子银行一次极限的能量释放，也正因如此，它震动金融界、实业界以及政策制定者，直接接动了金融监管改革加速。


    # — 主人公姚振华 —


    故事的主人公叫姚振华。他创立了房地产公司宝能，销售一般、土地储备质量一般，在中国的房地产行业中大概位于三四线之间。从2012年到2014年，年销售额从20亿下滑到10亿以下。跟许多房地产公司一样，姚振华有苦恼：高负债，永远缺钱。怎样能触到更多的钱？


    他瞄定了万科，一个年销售额是其200倍的行业巨无霸。


    # — 目标万科 —


    如果说房地产行业是中国过去20年最成功的行业，那么万科就是这个行业里最成功的公司，皇冠上的明珠。万科是真正的巨人，深圳证券交易所最大的上市公司之一，但下面这几个特点使其成为潜在的收购目标：


    第一，万科股权分散，第一大股东持股不过15%左右；


    第二，万科管理控制在职业经理人团队手中，但他们持股比例很低；


    第三，万科现金流充裕，负债率很低。正常情况下这是优势，但万科成为潜在的敌意收购目标时，却成为弱点——一旦收购成功，即可以用万科自己的资源来收购本身做再融资。


    这些情况与美国杠杆收购年代的目标公司有很多相似之处，不同的地方主要在于成。美国的一类公司是控股股东股权逐渐稀释，最终改为分散，没有控股股东。万科其实就是典型股权结构图成因非常中国化，这类是由经理层或内部团队，而不是意义上属于国有或集合所有，多年演下来形成平衡：公司由创始人内部人控制，股权分散，第一大股东持股不多，且不寻求控制权。


    这个平衡是脆弱的，姚振华将用敌意杠杆收购暴力地打破它。


    问题是，要成为万科第一大股东，至少要获得20%股权，至少需要四五百亿资金。姚振华已经负债很高，钱从哪里来？


    他赶上了好时候，中国的影子银行正在兴起。'
