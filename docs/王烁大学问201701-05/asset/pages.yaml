  md: '# # 设想不可设想的事


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_79_0.png)


    《对华之战》(War with China)出自兰德公司之手。


    兰德是家了不起的智库，在中国人心中更有神话流传。比如朝鲜战争爆发后，美国参战前，据说兰德公司出了份只有一行字的报告：中国必出兵。


    这个故事当然是假的。因为兰德公司不是算命先生，不会给你个结论后，问他“为什么”，说天机不可泄露。兰德出报告，得有调查分析对策，就以这篇《对华之战》为例，前后一百多页，光资料目录就几十页。


    类似的兰德神话太多，但兰德不需要这些，因为真实故事更神奇。


    兰德的英文名称是RAND，缩写展开来是Research And Development，即研究和发展。作为现代智库之祖，兰德这名称塑造了当今全世界各类研发机构的取名规范，甚至影响到中国国务院下属的国务院发展研究中心，发展研究，development
    & research，其实就是德兰啊。


    兰德几十年来声名显赫，在美国军事、外交决策中享有独特地位。比如，是个研究机构就有专页列出其成员获得的学术荣誉，但兰德这个页面令人震撼，光诺奖得主就有31个，横跨经济学奖、物理学奖、化学奖还有和平奖。而且，与许多机构的诺奖得主是功臣就是在这里出事后来奖的不同，诺奖得主主名就是在这里做出来获奖的成就。诺贝尔经济学奖得主威廉·夏普（William
    Sharpe）说：“想做既有美感又有用处的研究，兰德是个好地方。”


    比如刚刚去世的托马斯·谢林，在这里作博弈论研究，直接服务于美国冷战策略：怎样威慑或可信？充分沟通能否能使美苏两大阵营至少免于相互误解？怎样才能最有效地释放可信的信号？冷战结束后拿到了诺贝尔经济学奖。我在的专栏文章《新年许愿的正确姿势》里说到，许愿之我与执行之我不是同一个我，两个我之间的博弈决定许愿结果，直接出自他的文章。


    兰德原属美国空军和一些大防务公司创设的智库，发端于研究核战争的可能及策略，使命即是think about the unthinkable，设想不可设想的事，自然是博弈论研究应用的重镇。除谢林外，博弈论的创始人冯·诺伊曼在这里做过研究；听说过博弈论的人也肯定都听说过纳什均衡，纳什在这里呆了4年。除这几位之外，拿过诺奖的博弈论大家还有奥曼、夏普利、维克里、威廉姆森。


    可想而知，博弈论思维贯穿了《对华之战》报告。第一作者大卫·康伯特（David Compert）曾任美国国家情报常务副总监，曾代理过总监一职，绝对的内部门人。《对华之战》标题抓人，但并非主张对华动武。中美关系极为复杂，哪里是一份报告说得完的？所以它只取一瓢饮：如果中美开战，战事可能会怎样展开？怎样避免开战？


    比如，它没去估计开战的可能性有多大，这种预测费力不讨好。别预测，做准备。它并不认为中美开战不可避免，也不认为可能性很高，但认为哪怕可能性极低也须直面，因为开战后果太严重。报告副题为Think
    Through the Unthinkable，与兰德的使命陈述仅一字之差，显示了作者上承兰德研究传统的自我期许。设想不可设想的事，这是分析师的使命。


    报告基于一系列假设：如果中美开战，战区主要在东亚海空，包括海上、海底、空中、太空；除网络战以外，总体是场地性和常规性战争，中国不会攻击美国本土。


    这些假设是否成立其实很难讲，但分析总要从什么地方开始，这组假设就是报告的起点。如果把假设改成全面战争和核战争，那是真正不可想象之事，让我们还是先不去想它吧。


    基于以上假设，如果战事于近期爆发，是什么结果？如果战事于远期爆发，又是什么结果？这是时间维度；另两个维度是激烈程度和战争长度。三组维度组合出八种可能情形：'
