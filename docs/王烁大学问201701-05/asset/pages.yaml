  md: '释。抱数学写难准有点,清楚就。建议仔细看看,初中数学程度而已。


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_77_0.png)


    同一组数字算平均值,既可以算算术平均值,就是简单加总再平均;也可以算其几何均值,就是相乘再开方。说不上哪个更好,哪个对你有用。如果对你真正重要的是几何均值,就不能被那些用算术均值来忽悠你的人蒙住。


    买手机是小事,厘清不同的均值概念,对你的人生决策很关键。


    比如下面这个问题:


    两个基金经理都说自己的年收益率是25%,第一个第一年盈利100%,第二年亏损50%,第三年盈利100%,第四年亏损50%;第二个每年都盈利25%。你该选哪个?


    这道题本身是太简单,一算就明了,但现实中没想明白的人却很多。


    你当然该选那个每年都盈利25%的。因为前面那个是在坐过山车,算术平均年收益率是25%,真实收益率则是0。第四年结束,你放在他那里的钱,原来是多少,现在还是多少。


    即使这位基金经理在盈利年份表现再好的。盈利200%,又怎样呢?其算术平均的年收益率还是225%。凭借这个惊人表现,他会成为明星基金经理,广受追捧,人们会拿钱来求他管理。第四年结束,他管理的资金净值增长到原来的225%。


    不过,就算是这样,你还是应该选择那个每年25%的,因在第四年结束时,他管理的资金净值增长到了244.1%,仍然表现更好。


    到这里,你应该已经明白了,第二个基金经理是巴菲特,是一个专寻找几年有市场明星,来去不去,要寻找几年时,你得忽略算术平均的收益率,转而留意收益率的几何均值即复利复合增长率,这是起点。


    # 再来个难点的问题:


    人生机遇摆在你面前,输赢概率五五开,输则输光,赢则盈利10倍,你最该应投入本金的多少比例?如果盈利100倍呢?如果盈利10000倍呢?


    前面是人生漫步,前面不止有一个而是有连续串机遇。你要明白,你说的投入不止是钱,说的只是为了方便。


    机会太好,算术平均的预期收益分别是5倍、50倍、500倍,你是不是想要All in? All in的话,迟早坐光。


    算一下All in的几何平均收益,列式子很简单,就是赢赢两种情况相乘再开平方根,以赢10倍输则赔光为例,即得[(1+10Q)*(1-Q)]^1/2,其中Q为下注比例。如果你All
    in, Q=1,则几何平均收益是0。无论你盈利多少,每次是赢10倍、100倍还是1000倍,只要你总是All in,最后都逃不掉一赔光。


    下注太大,久赌必光。机会再好,与你无关。


    上面的算式对应着这条曲线,随着下注比例上升,先上升后下降。不下注是不亏不赚,全下则迟早坐光。


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_77_1.png)


    与曲线最高点相对应的模横位置,就是你的最优下注比例。按这个比例下注,有两大好处:理论上收益增长最快,而且不会发生本金赔光的悲剧。


    其实,本专读文章《全市场吃透的人》里已经提到过最优下注比例的公式。主人公秦普吃过赌、市场、学术场,除了自己发明盈利方法外,还借用了贝尔实验室同事利维发明的最优下注公式:最优下注比例=预期收益/净收益/净亏损。秦普是赌场和跑马场常客,实战中进一步简化成:


    > 最优下注比例=预期收益/赔率(Expected return/odds)


    这里所说的赔率就是博彩公司开出来的那个,无论赔马也好赔球也好,输则赔光,赢得博彩公司按赔率赔给你。在这种赔率下,两者等价,因为赔光时的净亏损是1。


    套用公式,前面的问题有了答案:赢则盈利10倍输则下注赔光的游戏,你每次最多只能投入(10-1)*0.5/10也就是45%的本金,如果盈利上升到100倍、1000倍,投入本金上限也只是分别略微上升到49.5%和49.95%。输则赔光的赔率制约着你,你永远不应下注超过一半本金。


    如果盈利10倍,输只亏掉50%呢?这时最优下注比例急上升,你可以每次下注高达全部本金的95%。输不赔光你就可以大大增加下注。保留坐在桌子上继续玩下去的机会,人生就是这回事。


    牢记住预期收益/赔率这个式子。秦普说得很透彻:就是edge/odds。任何选择面前,首先看有没有edge(优势),如果预期收益为负,说明无edge(优势),在这个赌局里你为劣势,绝不能玩;只有预期收益为正且有优势时才能玩;这时再看优势除以赔率是多少,edge/odds决定了你最大下注比例。


    人生说到底还可以还原为一连串选择,你用的是已有的资源下注,无论是钱、时间、劳动力还是知识,每次下注前,想想秦普的判断,吃透其含义,运用其力量。富道思考题给你们:在预期收益相等时,赔率越大,则最优下注比例应该越低。为什么?'
