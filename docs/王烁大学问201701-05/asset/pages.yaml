  md: '自动化取决于三大要素：数据、算力、算法。今天深度学习脱胎于1980年代的神经网络，有点意思；数十年来摩尔定律持续有效，保证算力爆炸；最后是大数据的还在数据的进一步突破。重新表达自动化问题：有多少人类行为能以可处理的数据来表达，在持续按摩序定律扩展的算力中，用深度学习来找到决策？


    可以肯定的，比我们要以以为的多得多。相对规模、有特征、可重复的数据来表达人类各种行为，灰盒子正一个个被打开。


    那么，依据复杂、无特征、难以重复的数据做决策，人和机器比怎么样？到目前为止，机器显然还不行。但人也没法自豪，因为在些情境中人的决策质量也不高，人和机器比烂而已。


    机器崛起，从近到远依次带来三个问题：


    +   - 机器从来不是资本。机器崛起会不会进一步增加资本的权力，压缩劳动在蛋糕中的份额，进一步加剧贫富分化？


    +   - 今天的自动化会不会与历史上的技术步本质不同，即不再是创新工作取代旧工作，而是消灭人类工作？


    +   - 机器会不会最终获得意识，摆脱作为资本工具的地位，转而成为人上？


    对这 3个问题现在不存在可靠回答，只能是带着这些问题开始未来不可测的航行。我的初步判断先写在这里：


    第一，没有什么能保证机器不会最终获得意识，但那一天还很早，也不知道会怎样发生，先不管它。


    第二，在那一天到来之前，机器崛起带来的主要问题不是人与机器的竞争，而是人与人之间机器人的竞争。从竞逐到来现在，人的主要竞争对手就是其他人。在另一种智慧获得自我意识之前，这一点不会改变。


    第三，就算最，能给机器写代码成为带资的也只由极少少数，普通人对的只能选择本。你只是普通人中高于平均的，有财务资本的用电表来对冲，没什么人有人力资本的，尽快把人力资本转化为财务资本，然后用来应对不好。为什么不要保险呢？因为有的人力资本搞不好根本就不值什么，而且面临人力资本贬值很快预测难，没有什么稳如泰山。


    当然，由人际竞争遏生出来的这个机器崛起时代的生存策略，增大了那天到来的可能。


