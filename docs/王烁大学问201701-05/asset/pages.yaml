  md: '# 谁都不是普通人


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_88_0.png)


    我在极简金融课里提到，对于普通投资者（average investor）来说，要尽早放弃追逐阿尔法（超额收益），但一定要抓住贝塔（市场收益），办法是多伦多+指数化+定期再平衡。如果你已经忘记，现在就出去，翻到本专栏最前面，再读一遍。


    什么是普通投资者呢？


    看这尊像。


    ![](img/d0b39398554e3d9ba7f47bdd8890a825_88_1.png)


    它叫作“平均的美国白人男子”。一战结束，美军士兵退役体检。根据10万名白人性兵的身体数据，全部取平均值，Jane Davenport造出了这尊平均的美国白人男子雕像。


    这是第一位“平均人”。再往前百年，大数学家Quetelet发明“社会物理学”，测量大量人体之后，由符合正态分布的各项身数据取均值，也向公众展示出“平均人”长什么样子。


    所谓普通投资者，即市场里的“平均人”。


    只不过，没有哪个活人是“平均人”，也没有谁是你的普通投资者，因为没有谁是在所有指标的平均值上，因为“平均”和普通投资者的距离很重要。普林斯顿大学教授谢宇将变异度原理列为社会科学三原理之一，他认为变异度均值同样重要，而且可能更重要。


    你与普通投资者必然不同，在构建服务于你的需求的资产组合时，这点差异很重要。贾宝玉说，弱水三千，只取一瓢。他说的虽是林黛玉，也可借用来反思你的资产组合逻辑：你从市场大河里偏偏只取这一瓢，凭的是什么？


    你与普通投资者的差异，不要从主观上去找，比如不能是因为你比一般人更想发财，市场不关心你想不想发财。相反，斯文森说，“想尽快发财的话，结果往往是尽快光光。”


    同样地，差异最好不是你的市场判断。市场之河永远淌满，你在此时此刻取其一瓢，如果是因为你认为此时此刻时机最好（择时，timing），且这一瓢会涨（择股，securities
    selection），那么想法很自然，但大多分已证明，收益的三个来源中，资产配置决定了90%，择时加选股加起来只有10%。着力于此，事倍功半。


    你与普通投资者的差异不要放在愿望和判断这主类观因素，它们靠不住；差异要客观方可把握：你能承受的风险种类和程度；与普通投资者有何不同？选择承担的风险总会有糟糕时刻到来，会不会与你人生的糟糕时刻同步？


    刚刚播出的《傲骨之战》（The Good Fight）是大热美剧《傲骨贤妻》的衍生剧。首播两集，川普上台，自由派律师Diane决定要投更多退休。她有条件退休，毕生积蓄放在朋友管的基金里头，收益惊人。于是，她与瑞士一家律所法律所签下退出协议，在欧洲买下豪宅过子首打。然而传来噩耗，管理的朋友被拘留了是另一个妻夫，玩了多年旁氏游戏。Diane的养老钱全没了！不仅如此，因为Diane多年来从基金中取过利息，还面临看回滚风险（clawback），个人账户要被法纳交需要被托管。奋斗一辈子，从顶底捋到底，Diane重新开始一场奋斗。她但凡有选择，不会想要掉入这个困境。'
