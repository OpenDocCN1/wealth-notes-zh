    ## 4.6 | 学习的方法


    ![](img/ff6d53d744fd4f083763c0ec24c93c33_11_0.png)


    4.6 | 学习的方法


    ## —— 知识笔记 ——


    以前我们讲到过曾国藩的读书方法，他说读书一定要攻城掠地，不要一个村庄、一个小镇地那样去打仗，那样是不可能最终取胜的。该攻的据点你一定要攻，该打长沙就打长沙，该打安庆就打安庆，你才可能赢得最终的胜利。


    他的意思是说，读书一定要读那些让你望而生畏，但是你必须要读的那些书，你读完这些书的时候，其他的小村庄、小城镇根本不在话下。有的人一辈子也读了不少书，但是他遇到据点型的书的时候，他往往是绕道而走，总是让自己的智力与那些小村庄、小城镇式的书相处，那样你是不可能成为一个真正的读书人。


    曾国藩的很多学习理论都跟他打仗的经历有关，曾国藩是一个天资很低的人，他自己都认为自己的资质是中等偏下，我们也这么认为。但是他在仕途、在军事上取得了很多智力高超的人难望其项背的奇迹，具体我们就不说了，我们只说他打仗的六字诀，“扎硬寨、打呆仗”。


    扎硬寨，就是每到一个地方，第一件事情就是扎寨，动员所有的兵力挖战壕，你就是千军万马，你就是天兵天将，我不在乎，我只要把我的寨子扎稳，你就拿我没办法，他常常也用这种方式把对手给耗死。


    打呆仗，就是我不给你玩什么花活，我就是用最简单的方法跟你打，你还以为我在搞什么高明的战略战术，就像美国人打伊拉克的时候，发现伊拉克毫无抵抗的时候，觉得可能是里头有一个巨大的阴谋，以为萨达姆在玩空城计什么的。


    曾国藩就是用最简单的方法来对抗你，结果就是用他的呆、用他的垒来稳扎稳打，步步为营。


    今天我之所以要说到曾国藩打仗，是因为我想到了学习这件事情。前几日我提到有同学在“得到”上订阅十五个专栏，这样的学习精神真的是很值得佩服。但我要做一个提醒，这个提醒就跟我们今天的话题有关，学习就有点像打仗，首先你要问你现在的核心知识是什么，你要给自己做一个知识清单，这个核心知识也就是你的知识大本营。


    每一个人都有自己的知识大本营，那么如何打仗呢？就是从自己的大本营出发，去进攻对手。你之所以能够去出征，是因为你有一个根据地，你有一个大本营，而且你打着打着还要回到你的大本营休息，补充给养，以逸待劳，然后再出击，这是一种学习理论。


    我们经常把学和习连在一起，但是学和习是很不一样的。


    所谓的学就是从一个领域的核心知识出发，向外探索并接触新事物。但是随后你要返回你的知识大本营，重新整合你已经了解的新的片段，然后再次出去探索新的东西，一次次地来来回回，你能够将已经接触的新的知识归入到你拥有的核心知识的大本营当中。简单地说，是你要
    在你的核心知识内部建立一种连接，你的内部连接把一个个碎片化的新的信息，用你原来的知识系统进行连接，这里头还有一个非常重要的过程，就是通过不断地重复已经知道的东西，让你的大脑，让你的新知逐渐地下沉，到你的下丘脑，进入下丘脑以后，不断重复的过程就不再是学，而叫习。


    通过学而时习之，你的新的知识就会变成一种意识自动化，什么叫意识自动化？老司机开车就是意识自动化，甚至在接电话的时候一点儿都不耽误。他的开车的行为已经是受他的意识自动化的控制。


    再比如我们经常会出现这种情况，一出门怀疑自己没锁门，然后“噔噔噔”爬上去，发现门已经锁得好好的。为什么会出现这种情况？就是你多次地重复以后，你的知识和技能已经变成意识自动化了，下丘脑所有的意识活动，它是不上报到大脑皮层的，所以你就根本没有意识到你已经干过了。


    我们说学学学习，不是为学习而学习，首先是从学接触陌生的、新鲜的，具有挑战性的，让你感到不适的信息，然后将通过多次的重复，也就是习，将新的知识内化为你的意识，变成一种意识自动化，你的专业技能也就形成了。所以不在于积累新的知识，而在于内化信息的片段。当然我们说我学会了一个什么东西，常常表现为记住了，你记住了没有？当我说记住的时候，就意味着我学会了。


    其实记忆有不同的层面，最高的记忆是你不知道你自己已经记住了的那样一种状态，这种记忆不是一种简单的记忆。


    ### 实验：构造记忆


    一个什么东西，吊吊表现为记住了，你记住了没有？当我说记住的时候，就意味着我学会了。


    其实记忆有不同的层面，最高的记忆是你不知道你自己已经记住了的那样一种状态，这种记忆不是一种简单的记忆。


    ### 实验：棋谱记忆


    将一张一个个的棋谱分别展示给专业棋手和非专业棋手，每次展示的时间大约是五到十秒，然后收回，再展示一个新的棋谱。连续展示几次以后，就问受试者能否把刚才的棋谱记下来。专业棋手能够完整地把棋谱说出来，而非专业棋手能记住其中的四五个棋子的位置就已经不错了。


    这是否意味着专业棋手比非专业棋手的记忆力强呢？并不是如此。当专业棋手看到一个棋谱的时候，他已经形成了一整套的信息的网络，他的大脑当中有整套的信息的网络，新动物一旦进入的时候，他立即将这些信息置放到一个网络，或者类似于图书馆的这样一个结构当中，迅速地编目，存在确定的地址，这个过程非常短暂，但是又非常的准确，也就是说他迅速地存储在自己的记忆区了。


    而非专业棋手由于他大脑当中没有这么一个图书馆，没有这样一套编目体系，所以当新的信息出现的时候，他没办法存储在既有的编目系统里头。所以一旦棋谱从他眼前拿走的时候，他就记不住，所谓记不住是他找不到存储的方法。如果换一种情况，这是否说专业棋手的记忆力比非专业棋手的记忆力好呢？不是这样的，如果我们再拿几张图，不是棋谱，就是由大大小小的各种点，在他们面前展示五到十秒钟，然后让他们说出刚才看到的图形，这时候专业棋手和非专业棋手完全没有区别。


    这个时候你就完全分不清谁是专业棋手，谁是非专业棋手，甚至会出现非专业棋手记图形的能力更强。原因是什么？因为专业棋手已经有一个棋谱的思维了，如果那个图形跟棋谱没有什么关系的话，他往往内心里头是抗拒的，找不到存储的地方。非专业棋手反而是因为没有这么一个成见在里头，他反而能够记住这个图形。


    从这个例子我们就能看出学和习的差别在哪里，以及学习的真正目的是什么。在《哈佛幸福课》里头有一段给我印象很深，这个老师讲了三个词，Information、transportation还有Transformation，第一个词叫信息，第二个词叫搬运，第三个词叫转型、蜕变、转化。我们很多人把学习误解为尽可能多地接触新的信息，或者说尽可能地把新的信息搬运到我们的头脑中来。


    大家想想，如果你的门口停了一列的货车，但是你的屋子只有九平米，这个东西你是装不来的；或者说一个所谓的图书馆，它没有编目的方法，不停地把新的书装进这个图书馆，最后这个图书馆是没用的，因为当你觉得要找某本书的时候如同不存在，说到底那就是一个装旧书的仓库而已。所谓图书馆一定要有编目系统，任何新的书来的时候，它迅速地对它进行分类，然后各就各位，放在不同的位置，当你要调用这本书的时候，它能够以最快的速度再把这本书找到。


    #### 所谓学以致用：


    + 1. 要存储知识；

    + 2. 当一个场景出现的时候，我们迅速地能调用这个知识。


    你只有有这个编目系统，你新进来的信息 Information才能够成为你的图书馆的一部分，你从一个小图书馆变成一个大图书馆，从一个空的图书馆变成一个藏书量很丰富的图书馆，最重要的是它是图书馆，而不是仓库。


    所以孔子说学而时习之不亦乐乎，习就是重复，在重复的过程当中建立新的连接，把新的信息植入到已有的知识网络当中，家里一种内部连接，让一个新的知识汇入到一种内在的信息网络当中，以备随时调用。


