    两位老师还讲过用电脑程序模拟进化，各种不同的程序在一代一代地“繁衍”中，竟然涌现出了类似于生命智能的程序。

    生命本身就是一种涌现，最初的生命原型“复制子”，就是有机分子在成千上万代的迭代之后，涌现出来的奇迹。

    薛兆丰老师常说的柏拉图式的讨论，和头脑风暴等学习和创意方法，之所以效果神奇，其中也有涌现现象的存在。

    从信息的角度来看，个体聚集起来常常造成更多的“无序”，但在无序之中，往往又因为负负得正，而出现了有序，就像茫茫的大海上逆流而动的洋流。

