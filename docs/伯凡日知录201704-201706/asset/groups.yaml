    ## 6.21 | 管理亚自我


    —— 第147天的知识笔记 ——


    在美国有这么一个实验：有两个从事公益事业的团队，他们都要完成一件事情——如何募集到更多的善款。


    主持这场活动的人当中有两派的意见，所以，他们对A团队采取的是你募到多少钱就是多少钱，没有任何的奖励；而对于B团队则有一个物质奖励，你募到的这些钱当中20%你是可以留存下来的，相当于B团队的佣金。于是，这两个团队分别去募款，最后得到的结果大出意外。两个团队募到的款项，A团队比B团队募到的款高出了几倍。


    照说，B团队是跟个人利益挂钩的，大家更有动力去工作。但最后为什么会出现这样一个结果呢？这是管理学家们特别感兴趣的一个话题，就是一种激励手段在什么样的场景下它会成为负激励。我们激励团队、激励员工的时候到底在激励什么？或者反过来，到底是在负激励什么？


    ### 亚自我


    这里头就引出了一个概念，叫亚自我。


    所谓亚自我就是每一个人表面上是一个自我，但是，我的下面还有7个亚自我。这7个亚自我相当于7个轮值CEO，它是在不同的场景下发挥作用的。所以，当一个人做出一件什么事的时候，我们通常以为这是这个人做出的，其实不是，是这个人的自我下面的某一个亚自我做出的。当然，从整体上来说那就是这个人做出来的，这就好比一个国家它有一届又一届的政府，每届政府做的事情都会记到这个国家的账上。但实际上，这些事情是由一届一届的政府做出来的。我做出一件事情并不是由一个抽象的“我”做的事情，而是由我下面的某一个亚自我做出来的事情。


    有时候我们经常会有这种印象，这个人好像换了个人，他怎么会这样。我在网上听过一个耶鲁大学的公开课，讲了这么一个例子。某大公司的高级职业经理人，仪表堂堂，温文尔雅，有一个幸福的家庭。工作上的业绩也非常的突出。突然有一天，他在跟同事谈话的时候，用拳头猛击同事的胸膛。过了……


    听起来很怪异，但是如果我们了解亚自我的理论的话，可能就不怪异了。我们通常认为的这个人是什么样子，是因为他在一个比较恒定的环境，这个环境包括家庭环境、工作环境、他人的人际关系，整个的这个稳定的环境下，他一直在值班的那个自我是那个样子的。突然有一天这个场景在别人不知道的情况下发生了改变，我们仍然认为那个人还是那个人，实际上他已经由另外一个亚自我在那儿值班了。


    ### 管理人，真的是在管理一个人吗？


    再往前推，又是一个管理学的问题。当我们说在管理人的时候，我们真的是在管理一个人吗？


    对于一个聪明的领导者来说，当一个人向他走来的时候，一种认知是他其实不是一个人，而是一堆反应模式；第二，迎面走来的这个人他其实是一个由七个人组成的联合政府。而今天是谁在执政，你不知道。你要管理这个人，首先要知道今天是谁值班，或者这一段时间是谁在值班，或者是你创造一种场景，让潜伏在他身上的某一个亚自我自动地走出来，由那个亚自我说了算。所以，我们管理一个人实际上在管理一个人的背后的某一个亚自我，或者是一群亚自我。


    当你要实现你的目标的时候，首先要做的不是用一种自己觉得无比强大的力量去控制，去操作，去操纵这个人。而是用一种场景去调动他身上的某一部分，或者说某一个亚自我。


    当春姑娘来的时候，万物生长。显然不是春姑娘用自己的巧手造出了一朵朵的花，春姑娘其实只是一个场景的提供者。它通过这个场景就创造了一个现实。


    这就回到那句老话了，你作为领导者是 make things，还是 make things happen？你是制造某种场景和情景让这个结果发生。如果我们要给这两种管理方式进行分类的话，那么我们可以说第一种
    make things，叫有为的方式，make things happen叫无为的方式。所谓无为不是无所作为，而是通过间接的，不易觉察的，迂回到让你看不见的方式，让一个你期待的结果悄悄地发生。


    ### A组为什么比B组成绩好？


    我们回到前面说的那个对比实验。


    A组没有激励，可是它的绩效明显高于B组。原因是什么？原因是A组受到了……


    有时，一个我们认为坏人的人，他也能做好事。原因可能恰恰是因为他遇到了一种特殊的场景，他的那个通常值班的自我不知不觉隐退了。那个不怎么出现的亚自我突然在这种场景下来主持工作了。他就做出了一个让我们觉得大跌眼镜的事情。


    第一个团队，他们之所以那么努力地去募捐，是因为他们觉得他们在做一件很有意义的事情。他们突然发现，他们做的这件事情跟他们平时做的事情是不一样的。他们体会到了一种尊严，体会到了一种他们从来没有的那种献身感，或者说激发了团队里头的每一个人身上的一个亚自我。那就是不计功利，但是要寻求意义，寻求尊严，寻求被他人和自己认可的那样一个亚自我。所以，他们在没有任何物质利益的情况下，还能勤奋工作。


    第二组为什么业绩那么差？是因为这种激励方式，将那一个非功利的、具有利他倾向的、具有献身倾向的亚自我关闭了。或者说这个亚自我正好要出场，结果你用这样一个手段让他淹没在众多的亚自我之后，让一个常见的亚自我，那也就是追求利益最大化的亚自我来主持工作了。这个亚自我的思维方式跟那个亚自我是很不一样的，这个亚自我本来是一个道德行为，一个公益行为，但他就不知道不觉转化成一场商业行为。既然是商业行为，他就一定考虑成本和效益的问题。这个团队的成员一算，跑那么一天，得到的钱其实他很少。或者说，他们如果不干这个事情，他们去干另外的事情，比如说去一个咖啡店打工，他一天挣的钱可能比他通过捐款的提成要多得多。这样很多人就觉得在做一个不划算的买卖。所以，他们的工作热情就很低，最后的绩效很差，那自然是在情理之中的。


    ### KPI与魔鬼


    当我和大家分享完这个案例的时候，我突然想到了那句话，‘每一个KPI的背后都藏着一个破坏这个KPI本来想实现的目标的魔鬼’。就像我们在第二个团队里看到的，你本来是想通过一个KPI，通过一种激励手段来实现更高的绩效。结果，你发现它严重地破坏了你的绩效。无论是在生活中还是在工作中，常常会出现那种事与愿违的现象。而这种事与愿违的现象的背后有可能是KPI，也就是关键业绩指标制定得不正确，有可能是激励方式导致了适得其反的效果。


    我在《活出生命的意义》里看到一个例子，有个口吃的人，有一天他坐公共汽车的时候，他想逃票。结果，售票员来查票的时候，他马上想到他是一个口吃的人，他要用他的口吃让售票员根本听不懂他在说什么。当售票员跟他纠缠不休的时候，可能就把他放过了。所以，他要尽量表现出自己是一个口吃的人。
    这个时候，奇怪的事情发生了，他不口吃了。当他努力想成为一个口吃的人的时候，他反而没法口吃了。


    这里头的道理其实很简单，这个时候那个不口吃的自我开始接管他了。所以，我们看到的自己，只是我们众多面相当中的一个自己。


    吴伯凡


    我希望大家思考这样一个问题：我们在管理自己、管理别人的时候，是否做到了创造性地制造各种各样的场景，让自己和别人身上的不同的亚自我现身，达成


    己和别人身上的不同的亚自我现身，达到我们所要的目标呢？可以在留言区记下来，和大家一起分享。


    自我之下包含7个亚自我。管理一个人，实际上是在管理一个人的背后的某一个亚自我，或者是一群亚自我。


    当一个人向你走来的时候，你要知道他今天是哪个亚自我在执政；或者，你可以创造一种情景，让潜伏在他身上的某一个你需要的亚自我自动走出来，执掌大权。


