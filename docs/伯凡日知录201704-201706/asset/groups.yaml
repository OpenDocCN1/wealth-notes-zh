    ## 5.22 | 掌握社会兴趣不等式，看清真正的起跑线


    5.22 | 掌握社会兴趣不等式...


    ### —— 知识笔记 ——


    ### 一、什么是真正的起跑线


    有一句话我们听的都有点厌烦了，所以我说起来都要鼓起勇气，但是今天还必须要提到这句话，那就是——“不要让孩子输在起跑线上”。这句话我们已经听了太久了，所以出现了那样的段子：在医院的产房里有一个小朋友的背后贴着一张纸，上面写着距高考还有多少天。


    由于有这样一种意识，导致父母从孩子出生的那一天，就被迫卷入到了一场巨大的竞争比赛中。所以他们就要让孩子尽可能上最好的幼儿园、最好的小学、最好的中学、最好的大学等等。以前我们在阶段性目标和长期目的中（见本专栏5月8日内容《中年危机根源：现代教育的目标阉割》）谈到过这个事里。


    今天我要说的是，到底什么是孩子的起点。


    有人说你就是起点，家长就是孩子的起点，家长的起点很低，孩子的起点不可能高。这叫智力多余，听起来很惊奇、很巧妙，但是它不解决问题。孩子的起跑线到底是什么？如果他输的话是输什么？当家长带着孩子加入到我们称之为短跑式马拉松的这样一场竞争时，父母可能忘了一个特别重要的事情，就是父母所有的努力，都可以概括成让孩子拥有一份有竞争力的无形资产。


    既然是资产，就需要管理；既然是资产管理，就要明白我们在管理任何一个资产的时候，一定要对这个资产进行详细的分析，看其中哪些是正资产、哪些是负资产。


    很多不会理财的人，常常没有意识到负资产在其中扮演的角色，所以自己觉得自己很努力，最后发现效果很差。这种努力有点像我们经常做的一道无聊的小学算术题，就是一个水池有一个进水管、有一个出水管，两个管子同时开开，什么时候这个池子能够注满水。在现实生活中我们会觉得这很荒诞，为什么同时要开排水管和进水管？但实际上我们每个人的资产都是这样的。


    我们常常没有意识到在资产池里隐藏着一个我们不知道的排水管，而且那个排水管的直径很大，当那个排水管的直径大于进水管直径的时候，或者哪怕是两个直径相同的时候，你要想注满这个水池都很困难。只能够当排水管的直径小于进水管的直径才能办到，最好是排水管干脆没有或者给它堵上。


    我们对孩子进行教育，就是对他进行一种资产管理。所谓输在起跑线，就是孩子的人生资斧中，出现了致命的、我们没有意识到的“排水管”。我们给孩子不停的报班，我们把我们仅有的积蓄拿来换来孩子进到名牌小学、名牌中学、名牌大学的时候，我们只是在做同一件事情，就是提高孩子的认知类技能。但最近国外心理学家提醒我们，真正决定一个人的幸福和事业成就的往往是那些非认知技能。


    ### 二、社会兴趣：合作、给予与共情


    什么是非认知技能呢？简单地说，就是包括了一些无法轻易辨认和测量、但确实对人的幸福和事业有潜在巨大影响的东西。我们可以列举不少非认知技能，但其中有一个非常重要、同时也常常被我们忽视的，那就是社会兴趣或者叫社交兴趣。


    简单地说，如果孩子的社会兴趣或者社会性愿望不足，会对孩子将来的生活和事业产生巨大的、但常常又被我们忽略的影响。我们可以把社会兴趣的缺乏看作是一个巨大的价值黑洞，这个价值黑洞在不停地吞噬从正面进行的种种努力、和所造成的所谓那些正面的结果。


    当你忽略这个价值黑洞存在的时候，或者怨天、或者尤人，尤其是父母觉得特别不公平，我付出了那么多的努力，我的孩子也很努力，但是为什么效果就那么差呢？我们要经常提醒自己“点背不能怨社会、命苦不能怨政府”，问题的根还得从我们自身找。


    现在我们就看一看什么叫社会兴趣、它的特征是什么，以及为什么缺少了这种东西，就会对我们的个人形成巨大的、又是隐性的伤害和损害。


    所谓社会兴趣，就是对他人总是保持一种合作与建设性的姿态，对与他人的交往、融入到一个群体当中怀有深厚的兴趣。如果说我孩子也有几个知心朋友、跟我们关系也很密切，这叫不叫社会兴趣呢？这不叫。所谓社会兴趣是，不仅是对所爱的人、亲密的人有直接的感情，而且是对周围的，包括陌生人都有一种不抱直接目的的、不会因为某个直接的原因而具有的那种感情，还有他对现存状况的认可、和对未来状况乐观的憧憬。所有这些加起来才叫做社会兴趣。


    怎么来衡量一个人的社会兴趣是否健全和充分呢？早在20世纪初心理学家阿德勒就给出了三条标准：


    - 第一，合作。

    当他面对一个问题的时候，他常常想到的是跟别人去合作；当别人遇到困难时，他保持一种习惯性的帮助他人的准备状态。


    有一个小细节跟这个东西有关，比如说你从一个门出去的时候，你是不是习惯性的把手往后推，让后面的 elegance 这个门。有一个测试很有意思，60后、70后、80后、90后，不同年份的人愿意做这个动作的明显不一样，这个动作就反映了社会兴趣。因为你帮的人往往你不认识，即使你不认识也保持一种帮助他人的准备状态，这就是社会兴趣。


    - 第二，给予。

    在与他人交往的时候一直保持着“给多于取”的倾向或者是习惯，即使是在日常平等的交易交换中，他也习惯于让自己付出的大于自己所得到的，也就是说他始终保持一个人生的不等式，那就是让自己的给予大于自己的所得。


    - 第三，共情。

    衡量社会兴趣是否健全和充分的第三个特征，表现为对他人的思想、感情、体验，希望给予理解的能力和愿望，也就是一种共情力。就是他在与人交往的过程中，总是试图让自己的频道跟别人的频道合在一起，总是试图保持同频共振，而不是自说自话。


    这三点说起来是三点，其实就只有一点，那就是给予大于索取。


    ### 三、社会兴趣与幸福感


    大量的统计表明，如果一个人的社会兴趣和愿望充分的话，他的幸福程度和他的事业成就远大于那些社会愿望不足的人。即使有些人凭借某个认知上的特长、自己的专业能力取得了显而易见的成就，社会也给予他很大的回报，比如说你成为了富豪、你成为了一位高权重的人，但是如果你的整个思维和行为模式当中没有这样一个不等式，或者完全是一个相反的不等式，那即使你事业有成，你都很可能陷入到痛苦的境地。因为人的幸福感的主要来源是人际关系，这已经成为一种共识。


    人际关系糟糕的人很难有实质性的幸福，这是一种兴趣，也是一种愿望，更是一种能力，也就是我们前面说的一种非认知技能。在一个幼儿园里，你发现用这样一个标准都可以把一个班的孩子分成两类人，一部分是社会兴趣充分的人，另一部分是社会兴趣不充分，甚至是严重不足的人；同样我们在一个大学里或者是在一个博士里，也可以用这个标准把人分成两类。这个跟人接受多高的教育关系不大，因为教育常常只是提供认知技能，而不是非认知性技能。


    衡量一个社交兴趣就是三点：合作的愿望、给予的愿望和是否拥有共情力，这才是社交的本质。我们经常说社交就是认识不同的人，就是拿着手机不停地去扫别人微信，前几天有人告诉我真希望腾讯开放5000人的限制、达到1万人，我就开玩笑说，这5000人里到底能记住多少人？关键还不是你记得多少人，而是多少人记得你。比多少人记得你更重要的是，有多少人认可你。


    那到底如何才能够得到别人的认可呢？答案就是这三点：合作、给予、共情力，如果你不能同时做到这三样的话，你认识再多的人...


    若你不能同时做到这三样的话，你认识再多的人都是无用功，而且甚至是起相反的作用。


    在一个屋子里头温度是一定的，但是我们摸木头和摸铁感受是很不一样的，摸铁觉得很凉，摸木头觉得不凉，原因就在于热量的不等式。当我们与铁接触的时候，铁作为热的良性导体，它会将我们手的热量迅速的吸纳，而木头是热的不良导体，所以我们之所以觉得它不凉其实是它没有索取的倾向，所以我们不会感觉到它冰凉。


    我们跟人打交道的时候，如果你拥有了合作、给予、共情力，你会给人一种温暖的感觉。相反你不具备这种能力，或者说你拥有一个相反的不等式，在与人打交道的时候习惯性的让自己的所得大于自己的付出的时候，别人会迅速的感觉到你的身上散发的一种冰凉气息，这其实就是气场。


    看到一个数字我都很惊讶，就是我们对一个人形成判断，只用十分之一秒。为什么会是这样呢？是因为你的行为模式和思维模式已经固化，别人在一瞬间就能识别你的模式，如果你是一个温暖的人，别人会在一瞬间感受到你的这种温暖或者说感受到了你的气场。相反你可能在完全没有意识到的情况下，别人已经识别了你的模式，同时已经悄悄地把你屏蔽和拉黑，这就意味着你已经在最初的十分之一秒，就已经给自己设下了重重障碍，而且你完全意识不到。


    这种模式一旦固化起来，它就会形成我们人生巨大的负资产，关键在于这一笔负资产是有高额的利息，恰恰地在吞噬你整个的无形资产。所以如果在社会兴趣这一点上输掉的话，你就输在了人生的起跑线上，父母在考虑孩子教育的时候千万不要忘记这一点。


    微信好友里，

    你还记得多少人，

    多少人还记得你？

    更重要的是，多少人认可你？


    — 吴伯凡《掌握社会兴趣不等式，

    看清真正的起跑线》

