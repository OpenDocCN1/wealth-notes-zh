    4.25 | 学习 的本质之一：认清...


    ## —— 知识笔记 ——


    ## 富兰克林：从学徒到传奇


    很久以前我读《富兰克林自传》的时候，有一个细节印象非常深，因为那个时候也在做自己的文学梦，想在写作上有作为，所以看到这一细节时很有感触。


    富兰克林说来是个传奇，又是科学家，又是文学家，又是美国的国父，参与了《独立宣言》的起草。


    ![](img/ff6d53d744fd4f083763c0ec24c93c33_51_1.png)


    ## “知识囤积”不是学习


    这几天我在读《学习的本质》，作者是法国人安德烈·焦耳当。读这本书时，我时不时回想起富兰克林的这个故事。作者在这本书里做了几件事：第一，他重新定义了所谓学习到底是什么；第二，学习需要有什么样的前提条件；第三个是我们如何学习。


    他认为没有危机感就没有学习，我们通常所说的学习不过是一种信息和知识的被动囤积，你之所以学习，是因为你觉得应该学习。


    但是当我们拿着手机躺在床上，浏览朋友圈的时候，你也会时不时发现新鲜的东西，其实那是旅游的心态，这个不错、那个也不错怎么办？你自然会有一个将它纳入你的记忆中的欲望，当然其实你用不着，你只需要把它Mark一下，存到你的手机里，这个时候你获得了某种快感。


    为什么会有快感？是因为你有知识焦虑，你有对新的知识、新的信息的匮乏感，你也有一种隐隐的恐惧，这样一种收藏行为只是缓解了你的焦虑而已。严格地说这不叫学习，因为你现在并没有体会到一种危机感、挫败感，你没有在做一件事情、解决一个问题，你只是觉得新鲜而已。你把这种东张西望，以及在东张西望当中获得的某种新鲜感当成是学习，你以为你收藏下来了，但收藏的过程就是遗忘的过程。


    一段时间下来，你发现你收藏了几千条这样的信息和知识。实际上这些东西回头看时，都不知道是什么时候收藏的，这些东西看似跟你相关，实际上跟你毫无关系。这有点像女士们买衣服，不停地购置，不过就是让自己的衣柜增加了一些你几乎从来不会穿的衣服。有理由你...
    有一天你打开衣柜时，都会吃惊，我什么时候买的这件衣服？


    ## “无限准备”又名拖延症


    书到用时方恨少，我们常常会有这样的感受。我们觉得自己也好像读了不少书，但真正想解决一个问题，或者写一篇文章，写一个文案时，发现过去积累的东西像是“七宝楼台，拆之不成片瓦”。


    还有一种类似的情况是，当我们想写一篇文章时，不愿意马上动手，很自然的陷入一种无穷准备的状态中，总是指示自己，我还要准备，我还要积累，我还要收集各种各样的材料。这是一种什么样的状况？以前我讲到过，这就叫做拖延症。


    拖延症的第一个特征就是无穷准备，而无穷准备的背后是回避反馈。当我们真正开始操作的时候，已经获得的东西立即就得到了反馈。面对这种反馈，我们有一种挫败感。这样我们很自然的就去回避这种挫败感。


    我们以囤积、准备，造成一种获取了的假象，让自己继续滞留在舒适区，而不肯跨进学习区。因为只要跨入学习区，就会面对反馈，就会面对自己的不堪。


    所谓进入学习区，就是要体会恐慌。与此同时，你原有的知识模型被打破，打破以后你还要努力地去构建。在这个过程中要付出很多的努力，最要命的是，看到了自己的浅陋。所以我们总是本能的规避这种状态，刚想要踏进那个区域，马上又缩回来。


    对稳定性的迷恋，对知识上的舒适和安乐的迷恋，这是在进行所谓的学时经常陷入的状态，这种状态我们以前讲过，是一种伪学习的状态。


    那么到底怎么才算真正的学习呢？你想开始学习，需要做哪些真正有效的准备工作呢？一个就是要进入持续的不均衡。第二，学习的时候要找到一种想象物。就像军人在训练和演习时，要有一个假想敌。


    关于如何打破均衡，如何用假想物作为抓手进行真正的学习，我们明天再讲。


    大家在留言当中记下今天的知识账本，让我们一起自我迭代。


