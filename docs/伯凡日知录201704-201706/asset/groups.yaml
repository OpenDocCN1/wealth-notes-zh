    非本店铺购买，不更新\n\n6.8 | 以“反常识”对“黑…”\n\n## —— 第140天的知识笔记 ——\n\n## 引子：当你身处黑天鹅湖\n\n我们昨天讲到了卷柏和水熊虫两种奇特的物种。它们的生命力、生命轨迹对我们是一个很好的提醒。尤其是在一个黑天鹅天天飞，甚至出现很多“黑天鹅湖”的时代，我们如何面对外界的这种突变。\n\
    \n我们当然很难实现基因突变，一下子让自己成为卷柏和水熊虫，但是我们是不是在制定选择商业模式、成长路径、战略时，多想一想如何让自己的路径具备一定的弹性。否则，就会在突变的情况下，无所措手足，甚至黄金而亡。\n\
    \n卷柏、水熊、海星、蚯蚓等物种，它们的生存方式都有些反常识。可以说，在一个黑天鹅事件越来越多的世界，我们需要一种反常识的意识和能力。\n\n我们曾经讲到过反本能（见本专栏10月23日内容《你深信不疑的东西，正在欺骗你》），其实很多本能跟常识是连在一起的。真正有效的措施、路径、手段往往都具有一个特点，那就是反常识、反本能。\n\
    \n我今天要跟大家讲的就是一个与反常识、反本能相关的案例。\n\n## Zappos反常的“离职奖金”\n\n有一家公司，大家也许听说过，叫Zappos，现在这家公司已经被亚马逊收购了，它是由华裔美国人谢家华先生创办的一家专门在网上卖鞋的企业。亚马逊以超过10亿美金的价收购了这家公司，可以说是一家真正的独角兽。\n\
    \n有意思的是，亚马逊收购它以后，这家企业获得了更快、更高质量的增长。这家被收购来的公司的管理理念、管理方法已经成了亚马逊整个公司的管理手段和文化的一部分，在全公司开始推行。\n\
    \n这家公司除了业绩骄人外，还有一种管理方法特别引人注目。听起来有点匪夷所思，或者说很反常识，但同时它又非常的有效。这个管理措施就是在公司设立“离职奖金”——当你要从这家公司离开的时候，公司为你提供高达4000美元的奖金。\n\
    \n这家公司选人是很严格的，选完人以后，它要对这些选进来的员工进行差不多一个月的培训。当培训结束以后，公司给这些员工提供两种选择：一，留下来；二，你可以离开这家公司，但如果你决定离开这家公司，公司会给你4000美元的奖金。\n\
    \n这听起来真的有点荒唐。按常理，如果一个员工经过了一段时间的培训，他发现他跟这家公司的文化、管理方式不兼容的时候，他会产生生气。那你要走就走就得了，为什么还要给4000美金的奖金。这听起来显然花的是笔冤枉钱。但是，很多特别有效高妙的手段，恰恰都是听起来有点荒唐的。\n\
    \n- 1、面对沉没成本，敢于割肉\n\nZappos公司之所以采取这个措施，是因为他们看到了并且承认一个事实，是有些公司可能已经看到但不愿承认的：新来的员工当中，总有一些是要离开这个公司的。很可能在半年之内就有一些员工离开。很多公司没有注意到这样一个事实，那些不太情愿但又不想离开的员工，如果留在这个公司的话，他对公司产生的作用可能很小。\n\
    \n在很多情况下，一个人不在一个组织里头起好作用，常常就会起坏作用。这些员工可能会很长时间在这个公司混，他给公司造成的损失除了可以计算出来的薪酬、福利之外，他给工作造成的隐性的破坏、他对公司文化的负面的影响等等，我们很多公司是不会去算那笔账的。\n\
    \n如果对员工做一个简单的分类的话，其实只有两种员工。一种是围绕事情来赚钱的员工；还有一种是围绕钱来做事的员工。这样的员工他每天头脑当中大部分时间想的是我得到了什么，而不是我为这个公司贡献了什么。如果这样的员工留在公司的话，整个公司就会出现那些小小的价值黑洞。它会悄悄的吞噬公司的价值。\n\
    \n而Zappos公司用4000美元就将那些围绕钱做事，或者为了钱来混事的人一下子给引蛇出洞了。这里包含一种对沉没成本的认识，就是首先只要你雇人就免不了会雇佣那些价值观、性格、技能都有问题的人，总有一个百分之存在。与此同时既然他们存在，他们就一定对公司造成损失。这个损失可以理解为沉没成本。\n\
    \n所谓智慧的人首先是能够面对沉没成本敢于割肉的人。在股市上，如果你在心理上过不了这个关，别说办企业，你炒股都会出大问题。所以设立离职奖金这样一个看起来有点荒唐的举措，其实是一个相当有效，又相当省钱的办法。有意思的是，最终拿了离职奖金离开的人，只占总人数的2%~3%。\n\
    \n- 2、用好“文饰效应”\n\n这个措施还包含着一个我们常常忽略的巨大好处，那就是它会悄悄地，但又很有效地去影响留下来的员工。这里也涉及到心理学上的一个现象。这个现象有人称之为认知失调的平衡，也有人称为选择当中的文饰效应。\n\
    \n在生活中日常有一种常见的现象：一个人新买了一种东西，他会向旁人不断的强调这个东西是何其的好，如何的物有所值，甚至物超所值。尽管他心里可能觉得买这个东西有点不值，但恰恰是当他心里头越觉得有点不值，或者说付出的成本越高，就越有冲动去合理化他的这个选择。\n\
    \n甚至有的人交了一个女朋友以后，他心里头有点心虚，他会用各种方式向别人彰显他的选择是对的。这是人性的普遍规律，我们都具有一种冲动，将自己的选择合理化，合法化，甚至会继续投入成本，告诉自己，也告诉别人自己的这个选择是对的。\n\
    \n我们回过头来看留下来的员工。当他们拒绝了4000美元的奖金留下来的时候，也就是说他在这个问题上已经付出了4000美元的成本，他会在心里有意无意的强化自己这个选择的合理性。用《怪诞行为学》的作者艾瑞里的话来说，一个员工在拒绝了4000美元的第二天，他醒来会说，天啊，我那么多钱都不想要了，我肯定是超级热爱这个公司。\n\
    \nZappos公司在培训后给新员工提供离职奖金，不仅让潜在会离职的员工在发生重大的损失之前离开，更让留下来的员工更加投入的工作。不接受这笔钱无论对公司还是对员工来说都意味着他对该工作的重视，因此会全力的投入工作。\n\
    \n大家可能说，这么一个小小的举措就能解读出那么多的道理来。事实上，谢家华当年采取这个措施就是因为他全盘考虑了利害得失，不按常理出了一张很妙的牌。可以说这个措施对于Zappos公司的成长到了相当明显的作用。\n\
    \n如果大家对这个案例感兴趣，想了解这个案例的详情，请大家读一本中信出版社出版的《新管理革命》。这本书有一个特点，就是它提出了很多让我们觉得匪夷所思的管理理念。但同时，又是卓有成效的管理方法。\n\
    \n## 总结：超越常识\n\n我们今天之所以讲到这个案例，不仅仅是为了让大家了解Zappos的这个很有用的管理方法，而且也是对大家的一种提醒。真正的妙招往往都是险招，如果你的招数路径听起来四平八稳，就别指望超出预期的效果。无论是管理个人还是管理一家企业，我们都要学会超越常识，超越本能，努力的去寻找那些听起来匪夷所思，但是卓有成效的理念和方法。\n\
