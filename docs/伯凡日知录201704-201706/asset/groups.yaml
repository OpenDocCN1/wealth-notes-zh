    ## 5.9 | 从王阳明，看如何用“志业”超越苟且


    5.9 | 从王阳明，看如何用...


    ### ——知识笔记——


    ## 一、“职业”与“志业”


    我们昨天讲到了target和purpose，也就是具体的短期的目标、和长期的远大的目的使命之间的差别。我们现在的教育越来越远离purpose，越来越靠近target，说白了现在的教育越来越像是一个职业教育。为了将来能够在社会上有一碗好饭吃，就不停的完成一个个阶段性的目标，最终换来一个好饭碗。所以现代的教育培养出来越来越多的第一个石匠而不是第三个石匠。


    这一对概念，让我想起德国社会学家、被称为是“德国的亚当斯密”的马克思·韦伯提出的一个概念叫“志业”。这个翻译很妙，因为我们汉语中还有一个字叫“职业”，谐音，但是意思正好相反。所谓职业就是job，就是一份工作。所谓志业就是志向和使命之所在，一辈子要为之而努力、而奋斗的那样一种事业。


    马克思·韦伯说现代的专家越来越有更多的知识，但是没有灵魂。我们的理性，或者说我们的心思都越来越偏重于工具性的的，而不是一种真正的求知的理性。


    这话听起来有点抽象，我今天想用一个大家可能都有所耳闻的一个人，以及他的一生的故事，来讲一讲职业和志业之间的差别到底何在，以及它之间好像不大的差别最终会导致差之千里后其。我们要讲的这个人就是王阳明。


    ## 二、王阳明的立功、立德、立言


    王阳明很火，现在很多场合大家都在讲王阳明，讲他的心学，讲他的知行合一的理论。有很多人即使对他的理论并不感兴趣，或者看不懂，但是对他也很有兴趣，原因就是这个人干的事很了不起。


    中国有一句俗话叫“有钱道真语，无钱语不真”，说的是在一个很市侩的社会，你想让别人相信你的话就最好多挣钱；“不信但看锺中酒，杯中先劝有钱人”，在商业社会里，你要是有了钱，你说的话就有可能是真理，哪怕是一句平平淡淡的话。


    钱钟书先生说，“名人才能说名言”，名人哪怕只说一句很普通的话，但是因为他是名人，那句话就成了名言。据说拿破仑有一句名言，叫“请客菜要好”。我们之所以记得这句名言只是因为它是拿破仑说的。


    可是王阳明却真不是这样。虽然有很多人之所以对他的理论产生勉强的兴趣，就是因为他做了很了不起的事情。


    先说说他到底做了哪些事情。这个人活的时间不长，只活了57岁，但是他做的事，成功学大师们都能够看得上。在这57年的短短的一生当中，他做官做到了什么地步？做到了在明朝能够封侯。做官做到多大、几品几品其实也不是特别难，但是做官还能够让皇上给你封一个侯爵，那是一件非常难非常难的事。据说明朝只有两个人是因为文官立下武功而被封侯的，明朝二三百年的历史当中只有两个人。按照儒家的价值标准，王阳明可以古今之完人。因为他实现了儒家所说的三不朽。什么叫三不朽？就是立功、立德、立言。


    ### 立功


    作为一个读书人他打了三大战役，这三大战役：


    - 一是平定了宁王朱宸濠的叛乱。这个朱宸濠也是朱元璋的后代，他觉得台上的皇帝不如他，想自己夺了皇帝千千，然后后心积虑准备了15年，凭借着手中的10万大军发动叛乱，按照当时的情况他胜算的把握其实是很大的。但是王阳明手里没有一兵一卒，在知道朱宸濠发动叛乱之后几天的时问召集了3万乌合之众，最后把朱宸濠的10万人给灭了，活捉朱宸濠。


    - 二是平定匪患。在江西、湖南、福建、广东那一带有着严重的匪患，这个匪患让明朝政府苦不堪言，而且其中已经有人有明确的政治主张，并不是打家劫舍，可以说这些人是有可能颠覆明朝政权的。明朝政府用七八十年的时间，一直在剿匪，结果这些被剿的势力越剿越大。而王阳明用了一年零四个月的时间消除
    了这个地方的匪患。那 个地方是多省交界三不管的地段，江西剿他逃到湖南，湖南剿他逃到福建。就在那样一个地方，他用了一些匪患所思的手法，最后把他们全部剿灭。


    - 第三次是在他生命接近尽头的时候，清除 了广西的匪患。


    也 就是说王阳明一辈子很重要的成就就是打了这三场役，这是他的立功。


    ### 立德


    我只说一个数字，在那个没有互联网、没有任何现代的传播媒介的情况下，他拥有忠实的弟子两万多名。


    他在那个时代已经有那么大的影响力，而且在他死后影响一直在发酵，一直在蔓延，甚至是扩散到日本。有人认为日本之所以出现明治维新，与王阳明的心学引入日本有很大的关系。今天有数不清的人也认为自己是王阳明的信徒，可见他的感召力。


    ### 立言


    我们现在的企业家们，赚了钱以后就做慈善，做完慈善就还要写书嘛，无非就是立功、立德、立言。王阳明作为一个思想大家，他在中国哲学史上的地位是不言而喻的。


    ## 三、“志业”牵引的一生


    他为什么能做出这么大的成就，尤其是在世俗的这些功名利禄之外，能够成为国家的脊梁，能够在历史 上，在思想上 有那么高的地位？我觉得原因可以用我们前面提到的那个词——“志业”来解释。


    愿。


    从王氏父子不同的经历，我就想到一句古话，叫“取法乎上仅得其中，取法乎中仅得其下”，如果没有一个长远的目标，你仅仅是奔着一个浅近的目标，你最后达到的结果往往是大打折扣的。


    ## 四、成大事者不纠结


    当然，王阳明也清楚，在那个年代，只有通过科举你才能够做官，你才能够为老百姓做事情，你才能够谈得上为生民立命，为万世开太平，所以他也去应试。头一年，没考上。王阳明与他父亲相比，他父亲就是一苹果，他就是一生姜（注：见本专栏4月27日内容《90前是苹果，90后是生姜》一文），很有个性的，不太符合当时的规范。所以他答题的时候乱答，不按照标准答案，不按照朱熹的那套说法去答题，头一年就落榜了。


    但他当时说，别 以落榜为耻，我以落榜动心为耻。自己落榜了，如果觉得很羞耻，就觉得别人的眼光让我承受不起，这才是可耻。但他也没有拒绝科举。第二年他考上了，然后走上了仕途。


    从王阳明整个一生来看，他的仕途很坎坷，因为仗义执言挨了廷杖，差点被打死，打入刑部大牢。后来出来回老家，在一路上面对追杀，最后勉勉强强做了一个小的不能再小的官，发配到贵州去一个叫龙场驿的地方，用我们今天话说就是一个政府招待所的一个小接待员。即使他后来立下了那么大的武功，也总是招人暗算。从他一生的仕途来看，他的最后的结果是不错的，但是过程非常的坎坷，非常的不幸。


    但他为什么能在那种被排斥、被打压、被陷害的情况下还能做那么多的事情呢？原因就是三个字，不动心。


    他在年轻的时候有一个高人见了他以后，说此人必成大事。别人问说为什么？那个人说，我跟他说话的时候，他能够做到不动心，宠辱不惊，这是很少有人能够做到的。


    我们今天来问，为什么他能够做到宠辱不惊？我觉得就是因为他心里头有一个 purpose，有一个远大的目标，有一种天职，我干这份小职业不是我的目的，虽然我也必须得干这件事情；你们用各种方法整我的时候，我是不走心的，因为我想着别的事情，能应付过去就应付过去；你说要科举我就科举，但是我不会把自己的定位搞的很
    low，让自己升官发财。


    因为他总是在想着一件事情，就是成为圣人。为往圣继绝学，为万世开太平。由于他心里一直有这个目标，他面对阶段性不顺的时候，有一种居高临下的包容和忽视，不会因为眼前种种纷扰让自己忘记那个目标。


    王阳明临终的时候，他的弟子问他说，先生，你还想留下什么话？他的话只有八个字，但是流传至今。这八个字是——“我心光明，夫复何言”。我的心是光明的，用不着再说什么。


    今天流行的那句话：彷徨的人生无需解释，是不是这个东西的一个比较低的版本，我不知道。但是他就是因为心里头有一个 purpose，所以他能够完成立功、立德、立言。即使他被迫去面对一个一个的
    target，但是他始终是把自己定位于一个有志业的人，而不是一个有职业的人。


