    ## 一张便签纸，一本畅销书


    在二十多年前，有一本商业的畅销书叫《追求卓越》。当然这本书我们今天读也已经过时，但它的确曾经影响很大。我现在想讲的是，这本书是如何写成的。


    它的作者汤姆·彼得斯原来是麦肯锡的顾问，对新的商业趋势和管理趋势有很多想法，后来他就成了一个著名的演说家。


    有一天他受邀去做一个非常正式的演讲，以前他演讲都是即兴式的，凭他卓越的口才，就能够轻松应对一场演讲。但是，他这一次的演讲是一个非常正式、而且时间很长的演讲。他觉得，仅仅是靠过去那种口若悬河的演讲，不足以应对底下的听众，他就做了较为充分的准备。


    ## “学习肌肉”的训练方法


    ## 学习的起点：找不自在


    个认知的循环。


    但这不是终极的状态，他重新将自己写的东西跟原文进行对照时，他又发现了这种不均衡，然后他开始了又一次的维稳。


    维稳的结果，就是你获得了暂时的稳定和均衡状态，如果你不接受新的挑战的话，你会停留在这

    种稳态中，这其实已经远离学习的状态了。


    所以他才又一次的学习、又一次地让自己失衡，在一个参照系上映照出自身的缺陷，重新产生期望，重新放弃原有的系统、原有的知识点，留出空位让新的知识和信息进来。这就是富兰克林学习的过程，他的这个过程暗合了焦耳当说的学习的本质，以及真正有效的学习方法。


    说到这里，我们对学习有了一个跟以前不一样的认知：所谓学习，说到底就是找不自在，让自己深切地意识到让原有解释系统的缺陷和不完备，然后产生强烈的期待和渴望，给新的知识和信息留出位置。危机感是学习的起点。


    大家可以反省一下，我们的学习当中除了那种笼统的焦虑感之外，有没有具体的、场景化的危机感？以及我们在这个危机感中，是否遵循了一个有步骤、有程序的自我更新和自我蜕变的过程？


    我们以前提到过，日语里的学习叫“勉强”，也就是勉励而为，强迫自己从认知的舒适区推到认知的恐慌区、焦虑区，同时用具体的步骤让自己一步一步地消除这种恐慌、焦虑和威胁，这个状态就叫学习区。


    在《伯凡时间》一开始，我就提到了一个概念，叫知识账本。记账是一件很麻烦，同时也是很痛苦的事情，它能够让我们从一种虚幻的获得感中，直面自己认知的资产。当我们直面这种认知时，我们会感受到一种威胁和创伤，而这种威胁感和创伤感才是我们学习的起点。


    所以我建议大家在留言当中记下今天的知识账本，让我们一起自我迭代。


