    # 4.24｜一万小时定律的真相


    4.24｜一万小时定律的真相


    —— 知识笔记 ——


    # 一万小时定律真的成立吗？


    这些年，有一种学习理论非常流行，叫一万小时定律。和很多流行的理论一样，普通人对这种理论的了解不过就是一句话，一句听起来特别简单、特别容易理解的话，要不它也不会流行。


    我们对一万小时定律通常的理解是：你想成为某个领域的高手，就要在这一上花一万小时的时间。一万小时到底多还是少，我们是没有概念的。


    # 主宰你的是哪个神？


    # 产品快速迭代的本质


    王尔德说过一句话：


    人都在世上，但是严格地说，很多人只是在世上，并没有活。


    # “认知利息”的秘密'
  - '[PAGE 49]


    的12次方，最后算下来的利息是13%。如果1%是周息的话，就是1.01的52次方，最后的结果是1.68，就是说利息是68%。当然如果1%是年息的话，他就是1%。


    为什么有的人的认知长期处于停滞的状态，因为他的循环周期太少，周期持续的时间太长。如果你每年的知识增长1%，那就比较危险了；如果一个人的学习收益是按一辈子计算的话，也就是说你一辈子都没有完成一个完整的循环，那就很可惜了。


    我们现在再看一万小时定律，关键是这一万小时里，认知循环周期的多少。如果这个周期的数量多，每一个周期持续的时间短，那么你获得的认知的量就会很大；如果循环周期很少，或者说迭代次数很少，那即使花上两万个小时，你的收益仍然是很少的。所以我们要破除对一万小时的迷信，要从关注时间的量转向关注时间的质，无论是挣钱还是认知，都要关注一个非常重要的点，那就是循环周期。


    # 记录你的“知识账本”


    听完这期节目，我希望大家做两件事。


    第一，问一问自己，你的生命是被哪个神所主宰的，是克洛诺斯，还是凯洛斯？


    第二，听完我上面说的这一段话，大家可以拿一张纸、拿一支笔，把自己刚刚领会的东西写下来，你会立即发现一个反差，就是你听的时候觉得获得的东西，和你写在纸上的东西之间有巨大的反差，这其实是一种即时反馈，一种强制审计，面对这种审计的时候，我们是不是有一点挫败感？


    这有点像做生意的人，老不太认真地算账，一算账，发现自己觉得得到的东西和实际得到的东西之间，存在很大的反差。


    以后我特别希望同学们能够给我这样的反馈，听完一期节目的第一时间写下自己的认知，有多少字算多少字，作为留言发给我，我就可以针对大家的反馈给出我自己的回应，这样也能够让我和大家一样保持一份清醒，也让我自己的迭代速度更快。


