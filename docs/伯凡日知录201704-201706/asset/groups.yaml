    ## 5.8 | 中年危机根源：现代教育的目标


    ### 引子：为什么美国教授不爱招中国博士？


    前不久跟北师大的钟伟教授聊天，他说了一句话让我特别讶异——如果讲学生的素质，南昌大学毕业的学生比哈佛大学毕业的学生要好。我觉得很奇怪，但他接着说第二句话的时候我听明白了。他说如果作为一种就业前的准备，你上南昌大学比上哈佛大学要好。


    哈佛大学不是一个就业前的培训基地，它的目的要培养对某种知识、思想的持续执着。所以这两个学校毕业的学生，如果到同样一个公司里，你发现往往哈佛大学的学生还不如南昌大学的学生。但是如果是要比创新精神、比未来的增长潜力，哈佛大学的学生要好的多。


    ## 一、我们被威胁驱动的一生


    上述现象不知有多少的普遍性，但想一想它是有情理的。因为我们中国的教育一直是“威胁性的教育”。上幼儿园的时候家长就会告诉你，你要好好学习，像史家胡同小学、中关村一小，到时候会要考试的。小孩心里就被注入了一个目标，其实是被注入了一种恐惧。因为父母在给你设定目标的同时，也给你设定了一个恐惧，你要是上不那样的学校，你将来考考不到好的初中、好的高中、好的大学，你就只能去干什么，而不能去干什么。


    ## 二、靶子教育（Target）与目标教育（Purpose）


    斯坦福大学教育研究所的威廉·戴蒙教授，通过长期研究发现，优秀的、真正有创新潜力的学生，学习动机往往不是由阶段性目标外在驱动的，而是由内在目的驱动的。前者可以叫要学习，后者叫我要学习。


    这对应英文当中的两个词，一个叫target，一个叫purpose。Target就是一个具体的目标，本意是靶子，确切的阶段性的目标。Purpose是目的，做事的内在原因和企图。


    ## 三、常见的故事，不常见的“大教堂思维”


    很多人都听说过“三個石匠”的比喻：一个人遇到三个石匠，问他们在干什么？其实他们三个表面上干的都是一样的，但是三个石匠的回答是很不一样的。第一个石匠说，我终于找到一个不错的饭碗，第二个石匠说我做的是方圆几十里数一数二的石器活。他问第三个你在干什么？第三个说我在建大教堂。


    ## 四、绩效主义教育、目标阈割与三种中年危机


    问题。


    第一个石匠的思维方式很务实，我们可能都觉得那样很靠谱，但是他不靠谱的地方在哪儿呢？一旦你形成了一种用阶段性目标作为行动驱动力的习惯，当这些目标差不多都实现的时候，它有两个结果：


    第一，当这些目标都实现的时候，比如说你博士都毕业了，然后又找到了一份很好的工作，然后就是平庸、就是无聊、就是中年危机。你选择这条道路、这种思维方式的时候，你已经把很多的可能性悄悄蔽了，不知不觉给自己做了一个你不知道的手铐。


    在这一点上有点像吸毒和服用兴奋剂。吸毒和服用兴奋剂都是用一种外在的东西来给你制造驱动力，但一旦这个东西不存在的时候，自己产生快乐的能力就被废除了。如果我们总是用阶段性的目标，也就是用target作为我们努力和行动的目标，那么就会出现一个结果，叫不可持续。


    假如你在阶段性目标都实现以后，你得到的最大感受就是“不过如此”，与此同时又没有别的动力让你去想干什么，你会陷入到一种挥之不去的迷惘和厌倦状态，这是很多成功者的中年危机状态。


    第二，上述还是比较幸运的，大部分人没那么幸运，总是在某一个阶段目标、在通某个关的时候，一下子命都全丢了，死在某一个关口上。


    这个社会其实分成了三类人：


    - 1. 一类就是连初期的阶段性目标都达不成的，心态就可以用一个词来描述，习惯性愤怒。


    - 2. 如果幸运一点，你通过了初期的目标，已经达到了中期的目标、开始向后期的目标进发，就进入了所谓的中产阶级。这个时候你的状态其实：一方面，意识到自己的状态很脆弱，弄不好随时有可能掉到习惯性愤怒的状态里；另一方面，你又始终无法继续往前走，所以就会陷入到一种所谓中产阶级的习惯性焦虑当中。


    - 3. 就是上述的不知道干什么，“成功者的中年危机”。


    我们发现这就很滑稽了，要不就是习惯性愤怒，要不就是习惯性焦虑，要不就是习惯性迷惘，这就是你选择这条路径的三个结果。


    假如不选择这样一种路径，你是按照威廉·戴蒙教授说的，用一种内在的目的驱动你自己，这个目标也许是遥不可及的，但是它永远牵引着你，即使你到不了大海，只要你一直向着大海的方向，你就既不会愤怒、也不会焦虑、也不会迷惘。原因是你努力奋斗的动力，是自内而外的，你学习不是要我学习，而是我要学习。


    ## 五、目标设置的“重孙辈法则”


    按照威廉·戴蒙教授的说法，你的purpose/内在动机/长远目标，是由三部分组成的：


    第一，我最感兴趣的是什么，从幼儿园你可能就开始被问这个问题，当然你可能会有调整，但是不变的是我真正感兴趣的是什么。什么是我即使没有得到回报、不能马上得到回报，我还乐此不疲的那个东西。


    第二，我擅长的是什么，有的都是我很感兴趣，但是事实证明我不擅长。比如说我很想成为一个钢琴家，但是我的听力有问题，那这就是你不擅长的，你要调整。


    第三，这个世界到底需要什么，也就是说这个世界到底有哪些问题，有哪些问题是真正需要解决的，这些问题里包含哪些机会，我做什么时候能够帮到别人、帮到世界。


    如果你觉得这个问题抽象的话，还有一个标准，叫“重孙辈法则”，也就是说一百年以后你的孙子的儿子还能够很自豪地谈起你，他一定不会因为你赚了多少钱，你曾经成为国民老公，你曾经拥有多少跑车，而是你在世界到底留下了什么，我能否做出一件自己觉得拿得出手的东西。


    ## 最后，“还有件事儿”


    乔布斯每年在苹果大会上的演讲，最后15分钟都会说到一句话，“还有件事儿”，说的就是苹果公司赚了多少钱。这既是他的一种表达方式，也是他的一个思维方式，那就是你干了些什么事儿，钱是一个自然的结果。


    所以我们就能理解乔布斯干的最辉煌的事情，是在他知道自己得了癌症不久于人世，他挣的钱根本没办法花的那八年里干的事情，或者说他干的其实就是一件事儿——“拿得出手”，面对这个世界我拿得出手的一件事儿。


    如果我们的行为动机是由这三个圆，我最感兴趣的是什么、我最擅长的是什么、这个世界最需要的是什么，这三个圆重叠的那一个小部分，成为你的行为动机的时侯，你为了实现这个长远的目标，即使也会要解决各种阶段性目标，但你不会因为这个阶段性的目标实现了而懈怠，也不会因为这个阶段性的目标不实现而沮丧愤怒和焦虑。


    威廉·戴蒙教授认为，我们现代教育的通病就是用阶段性目标作为我们学习和努力的动力，而造成了我们没有意识到的一个重大缺失，那就是我们学习努力的动机丧失了，而这样一种丧失可以说是一种致命的丧失。


    我们今天在提倡终生学习，那终生学习的动力到底来自于哪儿？如果我们从小到大没有在内心培植一种强烈的动机，那么我们终生学习可能就丧失了真正的动力，我们可能在学习的时候悄悄地在自废武功。


