    +   1、衡量钻石的指标非常明确：明、坚、利。


    # 2、玉是中庸的石


    我们中国人为什么如此痴迷于玉？玉本身就是一种石头，一种特殊的矿石。在《说文解字》里对玉的解释就是“石之美者”，就是石头里的比较好看的东西就叫玉。还有一种简化的解释就是温润而有光泽的美石。


    # 3、玉的温、润、软


    # 二、中庸是一种审美


    儒家的这种价值观既是一种伦理观，也是一种审美观。在儒家看来，美的东ש就是体现了中庸之道的东西。这种审美观在儒家的文学经典《诗经》里体现的特别明显。我说它是文学经典是我们今天的说法，在古代它可不...'
