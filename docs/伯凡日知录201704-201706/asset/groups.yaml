    - 2. 注明你的职业、所在城市和手机号。


    大家可以不用急着回复。正好周末两天可以有时间思考，在周二前回复在这篇文章的下面，得到的工作人员会联系你。我们的规模也有 ADS 可能只会联系小部分的同学。没有联系到的同学也不要失望，我们会在见面会后把内容整理出来，发在专栏里。


    今天的《伯凡日知录》就聊到这里。我们下周见！


    人对外界的依存度越大、协作度越高，就越是以个体的身份，而不是以小共同体，或家庭的身份跟社会打交道。


    构造个人生活意义世界的源代码，开始被篡改。


    不适者生存。


