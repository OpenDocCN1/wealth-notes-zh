    今天，我尝试一下比较完整地和大家分享《道德经》当中的一个片段，这个片段是《道德经》的第五十五章。


    ## 一、关于《道德经》第五十五章的理解


    含德之厚，比于赤子。蜂虿虺蛇不螫，猛兽不据，攫鸟不搏。骨弱筋柔而握固。未知牝牡之合而偃作，精之至也。终日号而不啼，和之至也。和而日常，知常日明，益生曰祥，心使气曰强。物壮则老，是谓不道，不道早已。


    > （注：文中生僻字较多，可配合音频阅读）


    ## 1、含德之厚，比于赤子。蜂虿虺蛇不螫，猛兽不据，攫鸟不搏。


    这一段话的关键词首先是赤子。什么叫赤子？就是赤条条的孩子，也就是婴儿。我们常常说大人不是赤子之心，就是这个赤子。在老子看来，德的最高的象征是赤子，是一个赤条条的、不穿衣服不寒暄的那样一个孩子。


    ## 2、未知牝牡之合而偃作，精之至也。终日号而不啼，和之至也。


    ## 3、物壮则老，是谓不道，不道早已。


    ## 总结：失控者的强大


    ## 二、萌是一种竞争力


    我为什么今天要跟大家分享《道德经》里的这么一段？几个星期以前，我曾经讲到萌态的动物，说的是动物出生之后它需要它的母亲来比较长时间的呵护抚养的话，它长的样子常常是很萌的（见本专栏5月1日内容《大自然的首席营销官》）。如果一出生它就能自由的行动，比如说昆虫、鱼，不过是一个小板的成虫、小板的成年的鱼而已。因为它不需要它的母亲来呵护它抚育它的话，那它就没必要表现出萌态来赢得母亲的呵护和关爱。


    从这个现象里我们引申出一句话，萌是一种竞争力。


    ![](img/ff6d53d744fd4f083763c0ec24c93c33_129_0.png)


    ## 例子：郭靖的“幼态延续”


    《射雕英雄传》里有两个人物，郭靖和杨康。郭靖的特点也可以概括成四个字：幼态延续。当我们说郭靖傻的时候，其实是相对于他的年龄来说的。如果一个1岁的小孩有郭靖的那个智力，你会认为他是个天才。郭靖，我们之所以觉得他傻是因为他的智力、他的行为方式、他的思维方式与他的年龄严重的不符合。


    相对于他的年龄来说的。如果一个1岁的小孩有郭靖的那个智力，你会认为他是个天才。郭靖，我们之所以觉得他傻是因为他的智力、他的行为方式、他的思维方式与他的年龄严重的不符合。


    照说，智商不够，比较吃亏，甚至可能活不下去，我们通常的方式就要在这个世界上谋求认知优势。谁在谋求认知优势呢？就是杨康嘛。这个精得像猴的杨康，那是无所不用其极。用一对管理学的术语来说，郭靖是刺猬型人格，杨康是狐狸型人格。刺猬啥都不会，就会一样，当对手来攻击它的时候，它缩成一团，什么样的动物都奈它不何。狐狸它非常的聪明，无所不用其极，我们以前讲过，它长了一条大尾巴就是边走边扫除它后面的脚印，这个用心之良苦大家可想而知。


    古希腊有一句话，叫“狐狸千伎百俩而有限，刺猬无一技之长而无穷”。结果，我们也看到了，幼态延续的郭靖最终成为了战无不胜的大侠。而那一个不断的谋求认知优势，人人都觉得他聪明绝顶的杨康最后为自己自掘坟墓。


    从这个郭靖和杨康的例子里头我们已经明白了“含德之后，比于赤子”的道理，也明白了“终日号而不嘘，和之至也”，也明白了“物壮则老，是谓不道，不道早已。”无论是做人也好，还是经营企业也好，我们都要学会幼态延续。或者说你要学会做刺猬，不要去做狐狸。或者说我们要记住乔布斯最欣赏的那一句话：Stay
    hungry，Stay foolish。当然不能搞笑地译成做个傻子，做个吃货。他是说要保持一种充满好奇心，有一种饥饿感，让自己的心智像婴儿一样的简单，也有像婴儿一样的战无不胜。


    ### ——♦ 延伸思考 ♦——


    听完今天的课，同学们不妨做一道思考题。在生活当中，在我们见到的各种各样的案例当中，有哪些让你印象很深的，因为幼态延续而赢得意想不到的竞争优势的例子。大家把这些例子分享出来，我们在下周的节目里进一步跟大家互动。


    在老子看来，

    德的最高象征是赤子，

    是赤条条的、不穿衣服不寒暄的孩子。


    成年人做事情，

    有很强的指向性和刻意性，

    一旦刻意就意味着用力偏颇，

    有偏颇就会有伤害。


