    一个什么东西，吊吊表现为记住了，你记住了没有？当我说记住的时候，就意味着我学会了。


    其实记忆有不同的层面，最高的记忆是你不知道你自己已经记住了的那样一种状态，这种记忆不是一种简单的记忆。


    # 实验：棋谱记忆


    将一张一个个的棋谱分别展示给专业棋手和非专业棋手，每次展示的时间大约是五到十秒，然后收回，再展示一个新的棋谱。连续展示几次以后，就问受试者能否把刚才的棋谱记下来。专业棋手能够完整地把棋谱说出来，而非专业棋手能记住其中的四五个棋子的位置就已经不错了。


    这是否意味着专业棋手比非专业棋手的记忆力强呢？并不是如此。当专业棋手看到一个棋谱的时候，他已经形成了一整套的信息的网络，他的大脑当中有整套的信息的网络，新动物一旦进入的时候，他立即将这些信息置放到一个网络，或者类似于图书馆的这样一个结构当中，迅速地编目，存在确定的地址，这个过程非常短暂，但是又非常的准确，也就是说他迅速地存储在自己的记忆区了。


    而非专业棋手由于他大脑当中没有这么一个图书馆，没有这样一套编目体系，所以当新的信息出现的时候，他没办法存储在既有的编目系统里头。所以一旦棋谱从他眼前拿走的时候，他就记不住，所谓记不住是他找不到存储的方法。如果换一种情况，这是否说专业棋手的记忆力比非专业棋手的记忆力好呢？不是这样的，如果我们再拿几张图，不是棋谱，就是由大大小小的各种点，在他们面前展示五到十秒钟，然后让他们说出刚才看到的图形，这时候专业棋手和非专业棋手完全没有区别。


    这个时候你就完全分不清谁是专业棋手，谁是非专业棋手，甚至会出现非专业棋手记图形的能力更强。原因是什么？因为专业棋手已经有一个棋谱的思维了，如果那个图形跟棋谱没有什么关系的话，他往往内心里头是抗拒的，找不到存储的地方。非专业棋手反而是因为没有这么一个成见在里头，他反而能够记住这个图形。


    从这个例子我们就能看出学和习的差别在哪里，以及学习的真正目的是什么。在《哈佛幸福课》里头有一段给我印象很深，这个老师讲了三个词，Information、transportation还有Transformation，第一个词叫信息，第二个词叫搬运，第三个词叫转型、蜕变、转化。我们很多人把学习误解为尽可能多地接触新的信息，或者说尽可能地把新的信息搬运到我们的头脑中来。


    大家想想，如果你的门口停了一列的货车，但是你的屋子只有九平米，这个东西你是装不来的；或者说一个所谓的图书馆，它没有编目的方法，不停地把新的书装进这个图书馆，最后这个图书馆是没用的，因为当你觉得要找某本书的时候如同不存在，说到底那就是一个装旧书的仓库而已。所谓图书馆一定要有编目系统，任何新的书来的时候，它迅速地对它进行分类，然后各就各位，放在不同的位置，当你要调用这本书的时候，它能够以最快的速度再把这本书找到。


    # 所谓学以致用：


    +   1. 要存储知识；

    2. 当一个场景出现的时候，我们迅速地能调用这个知识。


    你只有有这个编目系统，你新进来的信息 Information才能够成为你的图书馆的一部分，你从一个小图书馆变成一个大图书馆，从一个空的图书馆变成一个藏书量很丰富的图书馆，最重要的是它是图书馆，而不是仓库。


    所以孔子说学而时习之不亦乐乎，习就是重复，在重复的过程当中建立新的连接，把新的信息植入到已有的知识网络当中，家里一种内部连接，让一个新的知识汇入到一种内在的信息网络当中，以备随时调用。


