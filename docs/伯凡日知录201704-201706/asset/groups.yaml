    # 本周问答 | 碰到“磨人精”怎么办？


    本周问答 | 碰到“磨人精”...


    遇到那种不知回报，一味索取的人怎么办？（针对《人生基本功：如何建设社会兴趣》的知识账本留言）


    怎么办其实很简单，不要理这样的人就够了。但是你要把握一个原则。


