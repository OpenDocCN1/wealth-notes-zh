    大家学习柳比歇夫，不光是给时间要记账，给自己的知识也要记账。我们的印象笔记、微信收藏、“mark一下”，有多少是后来从没打开过的。伯凡日知录里每天都有“知识账本”，如果你没有自己的思考，没有自己的记录，知识没有穿过你的身体，知识就不是你的。如果刻意也是柳比歇夫的践行者，你翻开自己的知识账本，也会感到无比充实，无比幸福。


    有一次陪朋友去八宝山，领骨灰盒的时候，上面写着“最终的平等，永恒的宁静”。这种极限场景中，我们才能把当下看得更清晰。


