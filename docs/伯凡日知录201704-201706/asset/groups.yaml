    ### 1、非认知优势，与人际交往不等式（两期内容）


    大家可能都听腻了一个说法，“不要让孩子输在起跑线上”。不管谁谈论与这个话题相关的事情的时候，我们心里可能都会把他拉黑，因为这是一个典型的陈词滥调。但是大家有没有想过，如果孩子输在起跑线的话，他输掉的到底是什么？什么叫起跑线？


    “不要输在起跑线”的说法里有一个前提，就是让孩子通过各种的方法增加认知优势。但这种教育方式存在着一个我们没有意识到的bug，就是非认知性优势往往比认知优势重要得多。如果在孩子的教育当中缺少一样东西，很可能是一种结构性的、基础性的、甚至可以说是致命性的缺陷，这就是我本周想和大家分享的一个概念，叫社会兴趣或者叫社交兴趣。


    一个健全的人格意味着健全充分的社会兴趣，它包含三个特征：合作、给予和共情力。这三个特征的背后其实有一个在社交中至关重要的不等式：给予 > 索取。几乎所有的精神疾病和不健康人格都和一个与此相反的不等式有关，那就是索取
    > 给予，也就是说在交往的过程当中习惯性的让获取大于给予，这可以说是在人格中一个极易被忽略，但是至关重要的bug。


    从这个不等式出发，我还谈到了暖男。暖男的本质到底是什么？我们在与人交往的过程当中会瞬间识别一个人的气场，这个不等式跟这个气场到底有什么关系？请大家收听本周的《伯凡日知录》。


    ### 2、岩石逻辑、水的逻辑与实用主义（两期内容）


    本周我们还讨论了一个与口令思维（见本专栏5月10日内容《公关危机、婚姻生活都适用的“口令思维”》）相关的话题，那就是岩石逻辑和水的逻辑。


    这一对正好相反的逻辑也可以表述为男人逻辑和女人逻辑，为什么在沟通交往过程当中，水的逻辑相对于岩石逻辑有无可比拟的优越性？当我们被岩石逻辑所绑架的时候，将会造成怎样的沟通障碍甚至沟通灾难。从岩石逻辑和水的逻辑，我们引申出了一个哲学上的问题，那就是到底什么叫实用主义。


    我讲到了一个场景，在森林里头夜色降临的时候，你在森林里迷路了，你如何才能够走出这片森林？在你没办法拥有一张地图的时候，如何走出这片黑暗的森林？如果我们理解了实用主义的行为逻辑，我们也就明白了所谓的认知升级到底是在什么意义上升级，我们也就能回答那个很流行，但是又很难回答的那个问题，为什么你明白了那么多道理却依旧过不好这一生？


    如果你对以上问题感兴趣，请听本周的《伯凡日知录》。


    ## 5.23 | 人生基本功：如何建立社会兴趣


    5.23 | 人生基本功：如何建…


    昨天我们讲到了社会兴趣。这个概念也可以译成社交兴趣，或者叫社交利益、社会利益。


    一个人有没有社交兴趣，可以从三个点来判断：有没有合作的习惯，有没有给予的习惯，有没有一种对他人的思想感情和体验保持理解和同情的这样一种习惯。


    ### 一、“卖惨”为何物


    前两天我听到一个小小的演讲，其实是一个人面对一群人讲讲自己的故事。他的整个演讲可以概括成一句话：我很牛，我很苦，但是有那么多的人不愿意帮助我，社会跟我作对。


    其实这些人都很像。


    从这类人的谈话内容里，你能够明显感受到他的社会兴趣严重不足，而且他也现身说法告诉我们：一个人社会兴趣不足，将会导致什么样的结果。他会持续一种处于生活和事业上的困境，而且他不知道导致这种困境的原因。当然，他会为自己找到原因，这个原因就是5个字——别人的原因。


    ### 二、你见过“精神乞丐”吗？


    由于社会兴趣的不充分、不健全而导致的一种精神状况，我们也可以把它称为“精神乞丐”。或者说没有建立这样一个健康的人生不等式，让自己的给予大于自己的所得。


    在职场上，我们经常会遇到这样的精神乞丐。他有很多症候，比如说领导不和我沟通，我就不和领导沟通；领导不认可我，我就不好好干；领导不鼓励我，我就不好好干；我不开心都是因为领导不会哄我；完不成任务都是别人的原因；做错事希望大家不要小题大作；不上进，抱怨公司氛围不好等等。这个症候的背后是因为精神乞丐的心智模式里头存在着一个不等式，就是他始终希望所得大于自己的给予。


    ### 三、“暖男”的本质


    前两年流行一个词叫“暖男”。所谓暖男就是给予别人温暖的人。如果说的学术一点，就是那种能够持续的制造热辐射的人。相反的，所谓精神乞丐就是那些不断的制造冷辐射的人。


    什么叫冷辐射呢？简单的例子，在冬天，北方的冬天，如果你是单层的窗户，你站在这个窗户面前，你就能感受到一种寒意。这种寒意就是冷辐射。


    我们昨天也讲到了，一个人对于另外一个人的印象往往是在1/10秒就能够感受到的，或者说一个人所散发出的气场，别人能够在1/10秒的时间里就能感受到。


    如果一个人从小就培养了一种社会兴趣，我们可以说他就是具备了一种童子功。具有这种童子功的人就是那些在早年就能够形成社会兴趣的人。


    ### 四、多子女家庭的经济差异


    在一个多子女家庭当中，常常伸手索取帮助的那个人，往往是经济状况不好的人。表面上看是因为他经济状况不好，所以他寻求索取，实际的情况是因为他经常索取，所以经济状况不好。或者说，由于他缺乏合作的愿望和能力、缺乏给予的愿望和能力，更缺乏共情的能力，使得把成为一个冷辐射的人，或者说是一个吞噬能量的人。他的这种心智模式和行为模式使他陷入到他自己完全意识不到的、由他自己制造的困境当中。


    反过来，多子女家庭当中，经常出手帮助兄弟姐妹的那一个常常是最有钱的。这里头我们也不能把因果关系颠倒过来了，不是因为他有钱他会帮助别人，而是因为他具有一种散发能量的习惯和能力，所以他就成为一个广义的暖男，一个具有热辐射能力的人，或者说他具有一种社会兴趣的童子功。


    我们在给孩子实施教育的时候，可能会在大量的认知性技能上添砖加瓦。但是恰恰是忘记了这样一种非认知技能，在一个人的个人幸福和事业成就上具有决定作用的因素，那就是社会兴趣。


    那大家肯定会问，如何才能够培养这种社会兴趣呢？首先第一点，就是要意识到这是一种非常重要，又常常被我们忽略的能力。如果在这一点上出现缺失的话，那就是一种结构性的，基础性缺失，它造成的危害远远大于我们的想象。


    我们说，社会兴趣是一种非认知型技能，当我们这样说的时候，我们其实在说一种认知，一种关于社交的新认知。我们有了这种认知以后，就会有意识的培养这种能力。这其实是一种心智上的建模，这种模式的核心就是我们前面说的那个不等式，永远要让给予大于自己的所得。


    ### 五、爱因斯坦、范仲淹、曾国藩的共同点


    我反复引用过爱因斯坦的一句话，这是他在“一封信托里提到的一段话。


    > 爱因斯坦说：“我每天上百次的提醒自己，我的精神生活和物质生活都依靠别人，包括生者和死者的劳动。我必须尽力以同样的分量来报偿我所领受了的和至今还要领受的东西。”


    爱因斯坦的这句话说的其实就是那个不等式。


    这种观念并非只是西方有，中国历史上有一个很了不起的政治家、军事家、文学家叫范仲淹。我们中学就读过他的那篇《岳阳楼记》，“先天下之忧而忧，后天下之乐而乐”，其实他这句话里头也隐含着那个不等式。不过，他有一句话更加明确地表达了这种不等式。


    > 范仲淹说：“吾遇夜就寝，即自计一日饮食奉养之费及所为之事，果自奉之费与所为之事相称，则衿鼻熟寐；或不然，则终夕不能安眠，明日必求所以补之者。”


    意思就是说，他每天晚上睡觉的时候，他要算一笔账，就是自己所得到的与自己所做的事情之间是否对称。如果相称的话，他就会安然入睡；否则，他会整夜不能安眠，第二天一定要想办法补回来。


    酣然入眠，睡个安稳觉。如果发现不对称的话，他就会整晚睡不好，老想着明天一定要让自己的所为与自己的所得能够相称。这可以说是爱因斯坦那段话的中国版。


    其实，在中国有很多人都表达过这样一种人生不等式。


    > 曾国藩说：“每遇幸事，常念天之过厚于我。”


    每遇到幸运的事情，总是在想老天对我过于优待了。这句话的背后当然还是那个不等式。


    ## 总结：人生的基本功


    父母在教育孩子的时候，如果从一开始就有意识的让孩子建立这样一个不等式，那实际上是在做一件很了不起的工程。那就是建立一种确保他今后能有一个良好的气场，或者说是能够制造热辐射的、能够让人在一瞬间就能够感知到的好气场。至于他具有什么样的认知技能，倒是其次的。


    反过来，他拥有了各种各样的认知技能，由于他缺乏这一点，他日后就会成为一个自带冷辐射的人。一个自动的将别人排斥在外、别人也会自动的将他排斥在外，时时处处被拉黑、被屏蔽而不自知的一个人。无论是对他的个人生活的幸福还是对他的事业将会产生持续的消耗和损害。


    这是人生的基本功，对于一个人来说，也是他的最重要的童子功。


    > 曾国藩说：

    > “每遇幸事，常念天之过厚于我。”


    每遇到幸运的事情，总是在想老天对我过于优待了。


    这句话揭示了社会兴趣的关键：希望自己的给予大于所得。


    来源 人生基本功：如何建立社会兴趣

    伯凡·日知录


