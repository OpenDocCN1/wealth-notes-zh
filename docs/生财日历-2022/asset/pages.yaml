    # 赚钱这件事上，

    人与人的差别究竟在哪里？


    刘小排

    “猎豹移动”前产品总监


    很多人以为，赚钱没有结果，是因为天赋、执行力、资源、运气的不同。但更根本的差别，是有的人对赚钱没有很大欲望，却对机会有很多要求。


    没时间，文笔不好，看不懂，懒得学，不想露脸，觉得技术含量低、觉得 LOW（低端）的不想做……这就导致面对很多机会却最终“过滤”到没有机会可做。


    认识自己比改变自己更重要，如果真的想改变，建议使用“小闭环、正反馈”的方法，即做一个相对容易赚到第一块钱的事情，用很短的时间，哪怕是一个周末，也能给自己创造一次关于赚钱的新经验。


    “出来混”，最重要的，是“出来”。


