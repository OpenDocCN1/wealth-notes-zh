    发现蓝海市场，在我看来，核心问题就在于你是能够满足客户更深层次的需求。


    根据不同的对象或场景，进行客户分层，在细分领域里，把产品包装成与客户需求匹配度最高的产品，并打磨到在细分领域里拥有绝对的竞争力，做到价值超越。


    比如，你家的冰箱是西门子的，当冰箱的灯泡坏了，你在网上寻找新的灯泡，会搜出两个结果，一个叫“冰箱灯泡”，一个叫“西门子冰箱专用灯泡”，即使后者价格稍高，你也会为了避免买回来装不上的风险，而选择它。


    蓝海就是如此，通过降低产品的受众面积，来提高对精准客户的吸引力。


