    # ## 如何放大社群的价值赚到更多钱？


    闫寒

    餐饮服务机构“闫寒餐饮智库”创始人


    放大社群价值，简单说就是在有限的群体中创造更多的财富。汇聚在社群里的人的属性，决定了这个社群能帮你赚到多少钱。


    所以，想要放大社群的价值，最重要的是做好社群定位。筛选一批精准的人进来，形成更加精细的聚集效应，提供针对性的服务。


    随机从朋友圈拉进来的500个人，大家都知道没什么价值。但是如果是500个宝妈，就可以做母婴用品；如果是500个创业者，就可以卖课程、搞峰会；再极端一点的情况，如果是500个宾利车主，想象的空间就更大了。


