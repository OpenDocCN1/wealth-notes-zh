  md: '# # 创业者如何提升自己的格局？


    子柳

    投资人，淘宝技术大学前校长


    创业路上，优秀的CEO既要对行业有通盘的视野，又要对具体的细节有所掌握。这就像脑海中有一张“大图”，而且“分辨率”极高，以便大处着眼、小处下手。


    创业的进程就是这张“大图”不断被细化和深化的过程，在增加通盘视野和细节把控的过程中，探索事物和人性的本质，在不断的求索中，成就自然会高于常人的格局。


    还有另一个维度，看懂宏观趋势：学会理解《新闻联播》和《人民日报》的导向，提高政策敏感性，有必要学习一下政治经济学，把企业的格局放入国家的大格局里面。'
