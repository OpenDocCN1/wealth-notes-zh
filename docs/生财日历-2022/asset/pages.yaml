  md: '# 怎样避免社群


    逐渐失去活跃度？


    陈霏


    社群运营，副业培训领域创业者


    社群不单单是将一群人拉到一个群里，它是一个具有社交属性的场景化概念。因此，社群稳定活跃的关键因素有两个：情感绑定、利益关联。主要方法如下：


    +   1. 打造情感氛围，需要在前期就思考清楚，希望社群成员建立怎样的情感关系，明确社群成员角色。

    2. 利益关联，即设立可量化的目标，并明确社群成员可以得到的实际利益。


    设计好这两个指标，就可以将社群和群友的关系调整到平衡的状态，有明确的关系和明确的期待值，这样就会更稳定，社群也会很活跃。'
