    个人成长教练，在线教育创业者


    使命和热情，有两个要素，第一是我们真心喜欢，第二是能帮助们赚到钱。


    判断是否真心喜欢的两个角度:


    +   第一，从你的爱好里筛选，找到你最感兴趣、坚持最久的事情。

