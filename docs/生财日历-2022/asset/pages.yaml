    一个人的持续成长，不会自然地发生，它是一种主观的选择。因为持续的成长，一定伴随着痛苦甚至风险。

    持续地成长需要你具备这样三种能力：


    +   1. 开放的心态。世界的变化是非常大的，我们可以不理解它，但是一定不要去抵触新鲜事物，不然你就会失去机会。

    2. 智商和情商。这里智商指的是解决问题的能力，或者说是思考能力，情商指的是沟通与协同的能力。

    3. 强大的抗压能力。'
