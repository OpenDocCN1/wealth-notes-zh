    # 如何通过算账做出商业决策?


    海程

    个人财务管理专家


    决策的本质不是拍脑门和分析，而是算账。能赚钱，生意自然可以做。


    我在研究喜茶、星巴克时用过这个“七步算净利”：1. 连续一周，早晨7点到，晚上10点走，工作日、休息日分开，晴天、雨天分开；2. 开门时买一杯，收摊时买一杯，记住流水号；3.
    在1小时里，每隔10分钟记录分男女的人流量、到店数，并拍视频留档；4. 蹲店里看，一单一般是几杯，客单价是多少；5. 估算所有原物料成本，倒推毛利率；6.
    找物业问店租和物业费；7. 计算这家店能赚多少(利润 = 单量 × 客单价 × 毛利率 – 各项费用)，风险点在哪儿。


