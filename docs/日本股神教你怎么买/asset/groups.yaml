    ## 圖 3-4 要記住經常出現的股價變動型態


    ![](img/deba46b3116904b5339032f4dcd528a1_62_0.png)


    「由於是在看得到的狀態下做的，可以知道做了會變成這樣」。一再重複才能學會就算在伸手不見五指的狀態下，只要這麼做，應該可以變成這樣。就像是在大腦裡建立了「正確的迴路」般的感覺。


    例如，在圖 3-4 當中，股價一路跌，在①處出現長長的下影紅線後止跌，其後出現漲勢驚人的②長紅K線。自③的黑線起，雖然暫時下跌，但其後再度翻漲，最後完成了「第二次上漲」的型態。


    反之，要是在已經得知會有「第二次上漲」的答案之下，回頭試著去看「那，它是怎麼漲的？」就會發現到，在④的黑線後，雖然有連續的黑線，但原本可能跌得更急也不奇怪的股價，卻沒有再跌的時間點，會發現底部的籌碼是很堅實的。


    再來，在⑤的紅線那裡展開了第二次的上漲。此時可做出「當時在這裡應該老老實實賭在買進上會比較好，不是嗎」的判斷。


    但是在⑥的黑線處，K線再次跌破 5 日線與 20 日線。這時就要想到「但 5 日線與 20 日線看起來快要交叉，而且⑥處的K線也還沒有整條跌到 5 日線以下。這會是繼續買進要索」。


    再來在⑦的黑線處，5 日線往上穿過了 20 日線。這時可以觀察出，像是「其後股價也繼續持平，上漲與否尚不確定，但只要K線不跌破 5 日線，若繼續買進，應該可以獲利更多」之類的心得。


    由於實際的股票投資是在「眼前一片漆黑」之下進行的，在做出買賣的判斷時，根本完全不知道自己的預測是否正確。不過，在知道正確答案的狀態下，就能夠以自己的方式設想各種「在⑤的紅線處買進，並持續買進的原因」了。


    像這樣事後諸葛也無妨，只要多去思考「在這裡買進的原因」「在這裡繼續買進的原因」之類的議題，腦中就會形成「第二次上漲的型態」這樣的迴路。這不折不扣就是一面看著眼前的啤酒杯，一面把啤酒倒進去的狀態。


    等到培養起絕不會濺出任何一滴的自信後，這次改為瞇著眼睛倒啤酒，再接著下來就可以閉眼把啤酒逐一倒進啤酒杯中。只要反覆做同樣的事，過一陣子，應該就能學會在一片漆黑當中把啤酒倒進啤酒杯裡了。再回到第
    61 頁圖 3-4 的例子去，在實戰中，自然能夠擁有「一路跌，暫時漲後又跌，第二次上漲的型態」的能力。


    以「作弊」的方式，去察看對過去的某個時間點來說，依然算是「未來」的部分，再事後設想，有什麼因素可以預測出那樣的未來，也是很有效的練習法。


