    #### 5 了解何時該買賣的相場式訊號


    日線，完成「下半身」的線型。如果是相場式做法，就會毫不猶豫在①的紅線時買進。


    接著，當①的「下半身」完成時，原先持平的 20 日線轉為上揚。5 日線雖然在 20 日線下方，但也以急勢上漲。也就是說，來到了差不多多能確定，再出現下一根紅線，應該就接近完成「鳥嘴」的相對位置。如果能這樣密切監看，在實際完成「鳥嘴」線型的③出現之前，也就是在②的長紅線就能加碼買進。


    技術性指標中的買賣訊號，通常是「尋找已完成的訊號」，但這樣太慢了。相場式的做法是找出「即將就要出現的徵兆」。當然，萬一遇到「即將就要出現，最後卻不如預期」的狀況，也事先想好要如何因應。多多累積練習的經驗後，自然而然就能看出「快形成鳥嘴」的動靜。所以，我才說「練習、練習、再練習」很重要。


    ### 非常容易賺錢的訊號——分歧


    「分歧」是個聽起來就很有感覺的詞吧？其具體的線型有兩種。


    #### 圖 5-4 持續走勢中最重要的訊號


    分岐 往上漲或下跌走勢的回歸訊號！


    ![](img/deba46b3116904b5339032f4dcd528a1_99_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_99_1.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_99_2.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_99_3.png)


    ①和上漲的 20 日線並行的 5 日線一度下跌，雖然靠近 20 日線，卻沒有交集，呈現「分歧」後再次上漲。


    ②和下跌的 20 日線并行，且同樣下跌的 5 日線，在一度上漲後，靠近 20 日線，卻沒有交集，而在「分歧」訊號後再次下跌。


    分歧有這兩種模式（圖 5-4）。雖然解說得很簡單，但這是相場式幾個訊號中特別容易賺錢的線型，請各位千萬別忘記！


    無論持續上漲或下跌的行情，當走勢一度趨緩，之後再次回歸同樣走勢的瞬間，就是「分歧」。


    一般的股票用語為「逢低買進」或「反彈賣出」，不過逢低買進指的是「在下跌的低檔期間買進」（反彈賣出剛好相反）。


    至於「分歧」，則是在一度下跌，卻再次上漲的時候買進。


    ### 探討「N大」「反N大」


    ![](img/deba46b3116904b5339032f4dcd528a1_101_0.png)


    股價波動時經常出現「上漲，下跌，又上漲」的走勢，此時線型就會呈現「N」字型，一般市場上稱為「N字波動」或「N波」。


    我在意的不是股價波動本身，當5日線的線型出現N或反N型時，就是準備進行買賣的訊號。


    - 1. 20日線、5日線原先都朝同一個方向下跌，但5日線卻以突擊的走勢，由下往上穿過20日線。5日線一時下跌到接近20日線，卻沒有持續跌破20日線，反而反彈上漲＝N大。

    - 2. 20日線、5日線而都朝同一方向上漲，但5日線卻以突襲走勢，由上往下穿過20日線。5日線一時上漲到接近20日線，卻沒有持續漲破20日線，而跳回下跌＝反N大。


    ### **圖 5-5 容易連帶出現大行情的徵兆**


    ![](img/deba46b3116904b5339032f4dcd528a1_102_0.png)


    原先朝同一個方向變動的 5 日線與 20 日線，5 日線卻突破這個走勢。這是行情可能往另一個方向波動的「第一個訊號」。


    突破走勢之後，即使 5 日線看似轉回原來的方向，卻在小幅返回後反彈＝強烈的走勢轉換訊號。


    就我 36 年的股票投資經驗來看，N 大與反 N 大的線型完成時，很容易出現一波大行情，是下手的好時機。實際的買賣時機，是在 5 日線往先前的反方向波動，穿過
    20 日線後，看似返回原本的方向，卻又再次反彈時。


    ### 解讀「高中生時間」來追蹤走勢


    在「分歧」與「N 大」出現後，5 日線和 20 日線再次同時上漲或下跌，以親近的姿態強勢並行的線型，我取名為「高中生時間」（圖 5-6）。


    這類線型，可說是上升或下跌走勢的「青春時期」。何時買進或何時賣出都能賺錢的寶貴時光。


    在「高中生時間」出現後，能多早搭上車，就會直接影響到股票投資的成果。走勢持續，在高中生時間的線型下，不斷增加獲利。這可說是股票投資裡最幸福的一段時光。


    到這裡一共介紹了「下半身」「鳥嘴」「分歧」「N 大」「高中生時間」這幾個我獨創的買賣訊號。只要能熟練運用這些，就能大幅提高股票投資的實力。


    #### 圖 5-6 持續最棒走勢的訊號


    ![](img/deba46b3116904b5339032f4dcd528a1_105_0.png)


    前面也稍微提過，相場式的做法不是乾等著這些訊號完成才有動作，而是鍛鍊注意力，觀察線圖，將自己的程度提升到「覺得快要完成時開始密切監看，準備好可以隨時買賣」。股價的走向、價格流動，對我們這些投資人來說就像「神」一樣，無論頭腦再聰明的投資人，面對股價變化只能跪倒在地。


    股價說上就是上，說下就是下。在這個領域中，必須時刻提醒自己別只會空談大道理。


    ### 相場的精髓——不看必要的地方


    各位了解使用均線的基本買賣訊號了嗎？接下來，就說明一下我平常進行價格波動分析的方式。


    其中的精髓就是「不看必要的地方」。股價有走勢，但每天的股價不見得會依照走勢變動。股價簡直就像個暴怒的人。以數學的型態來看待這個暴怒的傢伙，加以「緩和」，就成了均線。


    如果被由煩惱構成的股價牽著走，本來賺得到錢的也賺不到了。因此，先消除這些發狂不受控的K線，只留下顯示均線的線圖來大致分析整體走勢——這就是我發明的「不看必要的地方」。


    請先看看圖5-7。這是將JSR這家公司的線圖中，去掉K線，只留下5日線到300日線的均線線圖。


    #### 圖 5-7 只顯示均線


    ![](img/deba46b3116904b5339032f4dcd528a1_107_0.png)


    怎麼樣？是不是變得很簡單明瞭呢？線圖中從左側持續上漲的走勢，來到中間變得疲軟，20 日線到 100 日線從上漲變成持平。不過，在最右側的 5 日線從下方突破了
    20 日線。


    以我而言，在圖中①的時間點，5 日線一度下跌，碰到往下走的 20 日線之後，再次上漲到越過 20 日線，抵達②的時間點之前，就會想到「持續這個走勢應該會完成『鳥嘴』」。既然如此，就買進吧。


