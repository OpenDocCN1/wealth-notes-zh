    # 第 10 章

    # 實戰訓練！

    # 一生可用的散彈槍投資法


    ### 何謂散彈槍投資法？


    ![](img/deba46b3116904b5339032f4dcd528a1_221_0.png)


    場式交易的最高精髓，就是採取「信用交易」，搭配買進與放空的部位操作，在漲勢時追加買進，在跌勢時加碼放空，也就是無論股價怎麼變動都能賺錢的「部位操作」。


    不過，若是剛入門的投資人一下子想嘗試需要高度技巧的多空對沖，很可能明明是上漲局面，卻錯失買進部位，而造成鉅額虧損。因此，初始還是先單純一點，只考慮遇到買點就買進，遇到賣點即賣出，以熟練相場式交易為主。


    為此，我建構了一套「散彈槍投資法」。前面陸續介紹過「下半身」、「鳥嘴」、「分歧」、「Ｎ大」、「高中生時間」等幾個買賣訊號。還有「7 日法則」以及整數關卡股價、突破前一波高價點與低價點等，觀察股價動向的「指標」。我所謂的「散彈槍投資法」，就是將這些工具使用得淋漓盡致的短期買賣。


    以日本股市為例，大約有三千八百檔個股，其中可以現股交易，也可自由放空的融資融券個股，加上一天成交量將近兩百萬股，又符合獲選「JPX 400」及「日經 225」個股條件的，有好幾百檔。


    有了這幾百檔個股為目標，其中必有亮起相似式買賣訊號的「好賺錢個股」。不用拘泥於特定的個股，只要鎖定「現在處在的局面，似乎能充分發揮自己擅長技巧的個股」，不須太久，你也可以在股市中有一台自己專用的「提款機」。


    夫妻之間絕對不容許花心、搞外遇，不過在股票交易上盡量三心二意，左擁右抱也沒問題。多選幾檔股票是可行的，但擅長的技巧就算只有「分歧」一招也是沒問題的。


    拿出 JPX 400 的個股——研究線圖，只要找出目前 5 日線與 20 日線並列上漲（或下跌），而且 5 日線持續接近 20 日線的個股就行了。每天密切觀察這檔股票，在
    5 日線一度接近 20 日線又再次遠離，並且在 5 日線上方出現「下半身」的紅線就立刻買進，等到「反下半身」的黑線出現賣出，這樣就行了。


    這種操作方法應該連入門者也做得到吧？練習的天數依照「 7 日法則」，差不多就是一星期。一週一次賺點小錢，剛剛好。


    ### 圖 10-1 觀察線圖寫下相關的技巧、指標


    ![](img/deba46b3116904b5339032f4dcd528a1_223_0.png)


    ### 寫下相場式的技巧


    ![](img/deba46b3116904b5339032f4dcd528a1_223_1.png)


    ### 散彈槍投資法的基本策略


    - 持有期間為 1～7 天，速戰速決。

    - 順應市場走勢，記得只是跟著短期的股價走勢，取得一波段獲利。

    - 在紅線時買進，在持續開出紅線的期間內持有，一旦出現黑線就獲利了結。

    - 即使持續出現紅線，但收盤價低於前一交易日，也該獲利了結。


    以上，非常簡單易懂。話說回來，採取散彈槍投資法想要獲利，就必須在觀察線圖時發現關鍵的買賣訊號或指標，腦中能想到「啊！可以在這裡使用這一招！」否則，一切都沒意義。


    圖 10-1 標示的是相場式平時練習使用的訊號。請各位先不要看下方的答案，從上方沒有任何說明的線圖裡自行找出訊號及指標。總之，「發現」是投資股票想要獲利的第一步。


    要是能夠像圖 10-1 這樣，練習個三千張的話，相信進入實戰交易也不會失敗。練習過一萬張的話，成為億萬等級投資人不奇怪。等到變得能在觀察線圖時發現很多訊號與指標後，接下來就可以像圖
    10-2 這樣，進入想像訓練，「那麼，利用已出現買賣訊號的線圖，實際上又該如何買賣呢？」接下來，請準備好進入實戰。


    ### 圖 10-2 以「反覆假想買賣」實戰磨練


    ![](img/deba46b3116904b5339032f4dcd528a1_225_0.png)


    在線圖左側，「分歧」出現了兩次。在①的「反下半身」放空，到②的紅線獲利了結。③的黑線雖然收在 5 日線的下方，但由於下影線長，並沒有形成反下半身，不過此時卻亮起了「分歧」的訊號。因此，再次放空。接下來大幅下跌，中間雖然出現紅線，但收盤價跌個不停，因此從③的「反下半身崩解」起算，在第
    10 天的紅線⑤獲利了結。這次的下跌維持長達 9 天，從「7 日法則」來看，要在之前④的紅 K 線就獲利了結，或者因為「高中生時間」持續，也可以忍到⑤。


    接下來止跌，並漲過 5 日線的低價點，或是以「下半身」為題材在⑥的紅線買進。⑦的紅線完成了「鳥嘴」訊號，此時加碼買進。


    漲勢持續一段時間，在股價觸及到往下走的 60 日線附近，就要有心理準備，「可能差不多要跌了」。在⑧的「反下半身」之後，轉換成賣出放空。就像這樣，只要能從線圖裡的買賣訊號想像，「如果我的話會從哪裡開始進場，然後在哪裡獲利了結，再鎖定下一波。」這就跟實際交易沒兩樣。因此，即使是使用在股市交易實戰中「沒有正確答案的實際線圖」也能有很高的勝率。


    ### 只靠下半身／反下半身也可使用散彈槍投資法


    要買進就專注買進，要賣出就專注賣出，這種單純的性質就是散彈槍投資法吸引人的地方。不過，如果能搭配多種買賣訊號及指標，加上相場式的各種技法來判斷是否交易，應該會提高致勝率。


    ### 圖 10-3 下半身散彈槍投資的規則與獲利


    ![](img/deba46b3116904b5339032f4dcd528a1_227_0.png)


    不過，一開始還是有些難度。首先，就專心使用「下半身」與「反下半身」，以得到高勝率為目標吧。


    「下半身」是當原本在 5 日線下方的股價，以紅線穿過 5 日線上方，且 K 線超過一半時完成。以能順勢搭上短期性的價格強烈變動，並且持續上漲幾天來獲利的角度來說，這是對散彈槍投資法而言，是最適合、最好、也最理想的買賣訊號。


    相場式交易要等到該日的K線完成才開始買賣。有時候也會等到隔天開盤價出現才開始，但只要在下午兩點半之後，一看到當天K線很可能形成「下半身」，在收盤前掛出限價單，以收盤價確買賣進，就能以「剛出爐熱呼呼」的狀態買進。


    「下半身」的規則就是一定要有紅線才行，因此，買點就會在當天K線（紅線）的上方。


    除非隔天的收盤價低於前一天的收盤價，否則就續抱買進部位。如同圖 10-3 所示，一旦出現黑線就獲利了結。不須太堅持鎖定一檔個股，多找幾檔安全的股票比較保險。另外，即使K線收了紅線，但當天的收盤價比前一天來得低時，我也建議可以先結算一波。


    在這一章的開頭已經提過，散彈槍投資法基本上就是「反覆短天期」的交易。紅線連續出現期間續抱，一旦收了黑線就賣出，如果當天收盤價低於前一天就賣出。只要僅記這些規則，進行單純的交易就沒問題！盤中不必緊盯著盤勢也無所謂，上班族也沒問題。不需要一看到股價波動，就提心吊膽或感到苦惱。


    ### 圖 10-4 勝率 7 成。光靠下半身與反下半身也能充分獲利


    三井住友金融集團（東證 1 部：8316）線圖


    ![](img/deba46b3116904b5339032f4dcd528a1_229_0.png)


    散彈槍投資法的交易時間點會是這樣


    ![](img/deba46b3116904b5339032f4dcd528a1_229_1.png)


    圖 10-4 是三井住友金融集團的日線圖，先看看上方什麼都沒標註的線圖。


    - 5 日線上方的紅線＝「下半身」買進，持續買進到收盤價下跌。

    - 5 日線上方的黑線＝「反下半身」賣出，持續賣出到收盤價上漲。


    請遵循這套規則，作為依據來自己摸索買進和賣出的時機看看。


    下方的線圖是前半段的答案，各位認為如何？


    由此可知，即使是很短時間的價格變動，光靠「下半身」與「反下半身」的訊號也有很多交易的機會，實際上也能確實獲利。


    散彈槍投資法的交易時間點會是這樣：


    - ①～③持續買進後，結算

    - ④～⑤持續賣出後，結算


    圖 10-5 是圖 10-4 的日線圖後半段，從下跌行情經過整理行情，轉入反彈上漲的型態。


    ### 圖 10-5 利用其他訊號來增加獲利


    ![](img/deba46b3116904b5339032f4dcd528a1_231_0.png)


    在價格波動過程，找到「反下半身」或「下半身」時買進，要看這股走勢能持續多久時，例如像(A)區所示，雖然①的黑線大幅度跌破 5 日線，形成「反下半身」，但②的小黑線的開盤、收盤價都比①的「反下半身」的收盤價來得高，依照嚴格的規則來說，會發現②是個停損的局面。


    然而，在這個局面中 5 日線與 20 日線在下跌趨勢形成「高中生時間」，並且②的黑線有種被持平的 100 日線壓著頭的感覺。如果能判斷出「現在結算放空位置還太早」，之後就能持續獲利到③的黑線。接下來④的黑線比⑤還高，照理說應該在這裡獲利了結，但這裡遇上了「高中生時間」的巔峰期。如果能在④也忍住不結算，持續放空到⑤的紅線出現，那麼就能獲利更多。


    在這段期間的交易，雖然也有訊號失誤的 K 線，在圖表上標上失敗的文字，但相對於成功的交易而言，失敗的訊號不到一半，仍然留下很優秀的勝率。


    順帶一提，從線圖畫面中央的結果看得出來，「下半身」與「反下半身」訊號在 5 日線持平，短期性的價格變動趨緩後就連續失敗。察覺到這項缺點之後，就能在規則上補充一點——
    5 日線持平之後就要暫且觀望。如此一來，下半身 ＋ 散彈槍投資法應該會更周全嚴謹。


    ### 「下半身」比「反下半身」更能準確獲利的原因


    那麼，「下半身」與「反下半身」哪一個比較能準確獲利呢？忽然想到這個問題，覺得有點難為情，但讀到這裡的讀者應該都知道，這是個很認真的問題。


    先說結論。依照我個人專業見解，在鑽研過 10 萬年份的股票線圖後，我認為「下半身」訊號的準確度比較高。


    「反下半身」是在行情的高價區，或一度上漲後又下跌時出現的訊號，但即使出現「反下半身」，還是會有不少投資人覺得「跌了仍然想買」，因此在訊號亮起後，買氣與賣壓抗衡之下，很有可能會進入整理行情。


    股價通常漲到高檔區之後，多半不會一下子急跌，而是經過「箱型整理」再下跌。因此，很多例子是在「反下半身」出現黑線之後，5 日線上會再次出現紅線。換句話說，「想要再買進」的投資人与「已經想賣出」的投資人進入反覆拉鋻戰，難以確定將會進入何種行情。


    相對地，「下半身」的出現經常是在股價急跌或是在低價區持續震盪之後。由於沒有人會抱著股票進棺材，相較於買進股票，投資人在賣出時比較沒那麼多顧慮。「反正賣了再說！」多數人都這麼想，因此股市出現暴跌的頻率比暴漲來得高。


    換句話說，相較於在諸多考量，一點點緩步上攻的上漲行情，下跌行情的特質是劇烈的加速度及下跌強度。因此，一度止跌後再反彈上漲的過程也快一些。「下半身」就是止跌的明顯訊號，所以才比反下半身更能準確獲利。


    此外，有時股價一度以「下半身」高過 5 日線之後，會拉出一根黑線下跌，但只要忍過這波下跌，通常會再漲起來，非常值得忍耐。接下來，再遇到一波下跌的話就要停損，不過，由於一開始是以「長紅線」漲起來，先漲後跌，損失也不會太大。


    相對地，若出現「反下半身」訊號卻也沒有急跌，而是在高價區形成箱型整理，通常就會盤整很長一段時間。這種狀況下，會有「看到出現反下半身的訊號就賣出，結果竟然繼續漲！」這種現象。在箱型整理中很容易上當，來回挨耳光，要特別留意。


    ### 散彈槍進化版——相場式短線交易


    在第8章最後介紹採用「部位操作」的「相場式短線交易」，堪稱散彈槍投資法的進化版。


    短線交易的基本概念，就是當股價的大方向是上漲時就以持有買進部位為主，當股價出現震盪，除了買進部位之外，也要有放空部位，多空對沖，以買進來守住先前累積的獲利。等到「已經沒問題」的局面，立刻結算掉放空部位，恢復單一買進部位，目標放在比散彈槍投資更多的獲利。


    圖 10-6 · A 是 KOMATSU（小松製作所）的日線圖，在線圖左側持續一段整理行情，來到右側才轉為上漲行情。


    在整理行情階段，股價在 5 日線到 100 日線的狹窄區間來回，根據「一度集中的均線，之後會往上或往下再度分開」的經驗法則，在持續整理行情的這段時期，就可以準備鎖定接下來的大行情。


    在股價和 5 日線沒有下跌到前一波低價點的①試探性買進 100 股（0→1）。到了②的「下半身」追加 200 股，部位設定為「0→3」。


    「下半身」出現的隔日，股價以小黑線收在 5 日線上方，但是在這種先忍住。到了再隔一天，開了一扇大窗出現紅線，持平的 60 日線觸及到 100 日線。從隔天到再隔一天，60
    日線雖然成功超越 100 日線，但這樣的上漲太急了點。由於已經到達前一波高點，有種預感認為從這裡可能會開始回跌。因此，在 3 以「避險目的」放空 200 股，部位成為「
    2−3 」，接下來即使下跌，也能保住先前上漲時的獲利，買個保險（圖 10-6 · B）。


    ### 圖 10-6·B 以「部位操作」來保住最大獲利


    ![](img/deba46b3116904b5339032f4dcd528a1_237_0.png)


    結果，④的長紅線一出現，輕輕鬆鬆突破前一個高價點。這時，注意 5 日線與 20 日線，發現同樣都是上漲狀態下，5 日線超越了 20 日線，完成「鳥嘴」。這下子可以判斷「走勢很強、很強、強得不得了！」於是將放空的
    200 股全數結算，再加碼買進部位 200 股，以「0—5」進入完全戰鬥模式。


    這種狀況下，要先想好的「下一步的下一步」，就是股價一旦觸及到上方的 300 日線後下跌，就要獲利了結。不過，實際上股價的漲勢比預測更強，即使觸及 300 日線後也沒有任何抗力，一路持續上漲。


    股價強勢上漲之時，5 日線與 20 日線的間隔也逐漸拉開。至少在 5 日線與 20 日線的距離沒有拉近之前，可以繼續抱住買進部位，以追求最大獲利。


    然而，在⑤時出現一根將 5 日線大幅下拉的黑 K 線。


    ### 圖 10-6・C 以部位操作保住最大獲利


    ![](img/deba46b3116904b5339032f4dcd528a1_239_0.png)


    由於不是黑K線，並沒有形成「反下半身」，且在300日線的輔助之下止跌，走勢並沒有變得太弱。話說回來，暫時性下跌的基調很強烈，為了保住先前的獲利，暫且放空300股，部位操作為「3－5」，觀望一下。


    接下來雖然不斷出現紅線，但收盤價也一點一點在走跌。在這裡沒有獲利了結的原因是，雖然連續幾天小幅下跌，但「股價的生活圈」上揚，就長時間來推測會在 60 日線、100
    日線的上方持平緩步推移。


    股價在均線上方的時間愈久，均線也會逐漸上攻。60 日線與 100日線也從持平轉為完全上揚，再這樣下去股價應該會突破 60 日線與 100 日線。這麼一來，就會完成「股價＞
    5 日線＞ 20 日線＞ 60 日線＞ 100 日線」的上漲趨勢排列，能夠期待股價繼續上揚。「這樣的話就會變成那樣」「變成那樣之後就會這樣」，事前從股價的走勢來倒推均線接下來的動向，這就是相場式的做法。


    之後，在⑤出現「下半身」（圖 10-6 · C），提高了均線完美排列的可能性，因此在這裡將先前避險的放空部位全數結算，只留下買進部位以「0-5」來鎖定下一波的上漲行情。往下走的
    5 日線，雖然在⑥觸及到 20 日線，卻沒有跌破反倒再次轉為上漲，又出現了「鳥嘴」！


    在鳥嘴實際完成的⑦這根紅線，追加買進 300 股，增加為「0 - 8」。預測到真正的上漲趨勢後就能這樣大手筆投入，但之所以能辦得到，也靠先前以賣出部位採取多空對沖的操作，保住買進部位的獲利。否則，絕對沒辦法在來到⑦的紅線時直接一口氣買進
    800 股來進場。正因為這段時間一邊摸索，一邊少量加碼買進，累積獲利，才能在⑦這根紅線完成時，持有「0—8」，也就是沒有避險賣空下持有大量買進部位。


    以上就是為各位「稍微」介紹一下採取「部位操作」的相場式交易法。如果各位在只有買進或賣出的「散彈槍投資法」上已經戰無不勝，那麼接下來也可以挑戰「部位操作」。


    有一位職業網球選手說過，「我總是樂在其中且全力以赴練習」。我非常喜歡這句話。希望各位從練習階段就愛上股票，實際投資時更是保持笑容滿面，樂在其中。這才是身為股票專家能一生持續獲利最需要的條件。


    ![](img/deba46b3116904b5339032f4dcd528a1_241_0.png)


