    整理行情的最後一段，和接下來趨勢行情的開端，兩者一定會有一段重疊期。要養成習慣，一旦股價突破整理行情的上限或下限，就開始懷疑「這是不是趨勢行情一開始的階段？」因為，畢竟最容易賺錢的不是整理行情這一段，而是之後進入的「趨勢行情」。


