    **相場式的股價五階段變化**


    ![](img/deba46b3116904b5339032f4dcd528a1_109_3.png)


    > 〈股價從下跌轉到上漲的過程〉


    - ①收盤線反彈上漲

    - ②收盤線碰到5日線

    - ③收盤線超越5日線

    - ④收盤線碰到20日線

    - ⑤收盤線超越20日線


    #### 5 了解何時該買賣的相場式訊號


    就要開始懷疑「走勢是不是差不多該變了呢？」現在正好就在第五階段的狀況。用這套「股價五階段變化法則」來看，圖 5-8 的上方線圖在②的時候就是第二階段。如果是我，就會思考「應該在這時候買進吧」。


    到這裡整理一下狀況，漲勢一度停歇後維持平穩，而 5 日線、20 日線在下跌過程中，收盤線轉而朝 5 日線上漲。這麼一來，收盤線在碰到 5 日線且突破的③時，很明顯打底反彈，就能預測到股價多少會上漲一些。


    #### 最後，來看 K 線揭曉答案


    在考量這些狀況的同時，再放上 K 線的圖（圖 5-9）。①的時間點，就相當於圖 5-8 中收盤線碰到 5 日線後突破的②→③這一段。但是，紅線竟然有超過一半往上方突破了
    5 日線！依照相場式「下半身要買進」的做法，這裡應該要先買進。


    接下來，前面的「股價五階段變化法則」裡的第四階段（收盤線碰到 20 日線），就是圖 5-9 裡的④。在這裡或許可以加碼買進。


    #### 圖 5-9 加上 K 線後進入實際買賣


    ![](img/deba46b3116904b5339032f4dcd528a1_111_0.png)


    看看圖中的 K 線就能清楚了解，如果能在(A)的時間點買進固然最好，但即使到了(B)才買，也能賺到一定的價差。


    #### 5 了解何時該買賣的相場式訊號


    至於獲利了結的時機，最好是在上漲的收盤線上方出現黑線的◎點。


    就像這樣，「不看不必要的地方」，就會「看到要看的地方」。再提醒各位一次，記得「不看不必要的地方」，一開始只看均線即可。好好思考「該買進還賣出？」「要買的話是什麼時候下手？」


    接著加入收盤線，「該在哪個階段交易呢？」進一步鎖定目標後再思考。


    到了最後加入 K 線，試著驗證實際上該在何時買進。反覆多次嘗試這套練習法，就能愈來愈感覺到得心應手！


