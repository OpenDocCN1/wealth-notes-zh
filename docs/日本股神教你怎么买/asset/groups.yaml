    # 首先要察覺到「整理行情」的狀況


    續看過上漲、下跌，最後剩下的就是「平盤整理」時的價格變化。


    我們投資人都是在無法預料明天的狀況下交易。為了鎖定「平盤整理時的動態」，就得事先了解此刻整理行情（也稱為「箱型整理」或「震盪行情」）究竟是什麼狀況。


    如果事先告訴你，走到對面牆壁之前會有三處陷阱，只要小心翼翼走過去，或許就有辦法順利避開陷阱。不過，若是完全沒有事先提醒陷阱一事，再厲害的行家也會一不小心掉進去。


    換句話說，及早察覺到現在的走勢可能是平盤整理，就能避免在整理行情這個陷阱中造成損失的風險。意思是說，整理行情時的買賣策略和上漲行情、下跌行情時有著一百八十度的天差地遠，要是不小'
