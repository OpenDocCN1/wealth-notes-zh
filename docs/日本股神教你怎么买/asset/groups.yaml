    # 探討走勢持續的信號「鳥嘴」


    接下來是用傳家寶刀「均線」實作的相場式投資法基本訊號之二——「鳥嘴」。這是以短期與長期均線交織出的線型，用來當作買賣的依據，但即使連入門者也很容易發現。


    「鳥嘴」出現在走勢要出現重大轉變之前，類似「黃金交叉」或「死亡交叉」。


    +   ①在下方往上揚的5日線突破上漲的20日線，形成「鳥嘴」，的線型，就是要轉為漲勢的訊號，應該進場。


