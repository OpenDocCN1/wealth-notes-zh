    重點是，人想要得勝，就得檢視面對事情的態度。


    投資股市最大的理由，或許的確很單純，就是想要賺錢。不過，就像人家說的做出興趣，才會愈做愈好。想要學好股票交易，成為一流的股票專家，最好還是能真正熱愛股票投資。觀察股市中即時的價格變化，實際投入資金，能夠準確預測這個行情該買還是該賣，這些都令人開心得不得了。


    股票投資的確是一大樂事，讓人有這種感覺。


    提到股票投資，難免牽涉到金錢。確實有不少人會因為欲望及資金進出感到心煩意亂，也有人為了擔心虧損或恐懼而飽受折磨。'
