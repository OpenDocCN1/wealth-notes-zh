    # 結語


    世界第一的天才跳台滑雪選手高梨沙羅，在 2016 年的世界盃奪回后座之後曾說：


    > 這次重新回頭練習基本功，改善了助跑姿勢。上一屆因為在助跑時沒有抓好節奏，錯失在個人綜合項目上三連霸的機會。「因為要面臨太多課題，不知道該從哪一項下手，頭昏腦脹。」在這種狀況之下，春季決定先認真改善助跑姿勢。利用震動的機械或是踩在下方有小鋼珠的扳子上，刻意營造出不穩定的助跑環境。（中略）再以「辛苦到讓人想逃跑」的核心肌群訓練來讓基礎穩固。以能夠完全保持助跑速度的狀況之下在跳台起跳，大幅增加了飛行距離。

    >

    > （節錄自《日刊體育》2016 年 2 月 20 日）


    就像這篇報導中講的一樣，當問題多到不知道該如何是好時，首先找出其中一項課題，設法好好解決。


    以高梨選手的狀況來說，就是「改善助跑姿勢」。在股票投資方面也是，只要找出課題，一項項解決，投資也會得心應手。千萬別有悲觀的想法，認為「我就是沒有靠股票賺錢的才華」，或是「自己的投資能力真的太差」。


    重點是，人想要得勝，就得檢視面對事情的態度。


    投資股市最大的理由，或許的確很單純，就是想要賺錢。不過，就像人家說的做出興趣，才會愈做愈好。想要學好股票交易，成為一流的股票專家，最好還是能真正熱愛股票投資。觀察股市中即時的價格變化，實際投入資金，能夠準確預測這個行情該買還是該賣，這些都令人開心得不得了。


    股票投資的確是一大樂事，讓人有這種感覺。


    提到股票投資，難免牽涉到金錢。確實有不少人會因為欲望及資金進出感到心煩意亂，也有人為了擔心虧損或恐懼而飽受折磨。


    想要成為股票專家，就要不斷磨練自己增加資金的技巧，否則無法在這個冷酷無情的股市中生存。


    但是各位也別忘了，這世界不是只有金錢。滿腦子只想著錢，只為了錢殺紅眼，在殺氣騰騰的狀態下投資股票，一定不會有什麼好結果。努力必然獲得回報。真心誠意認真努力，就能成功。我認為，股票投資就是這麼一回事。


    「行動起來！天道酬勤！」希望在閱讀本書之後，你也能不斷修練、磨練，成為獨當一面的「股票專家」！


    股票專家 相場師朗


