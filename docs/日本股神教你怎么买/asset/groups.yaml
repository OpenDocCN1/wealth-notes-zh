    # 練熟四招就夠了


    第 5 和第 6 章是相場式投資法的精髓，介紹了各式各樣的投資訊號。每個訊號都是股市中的必殺招式，一旦站上股價摔角的擂臺上，管他是摔角選手巨人馬場還是安東尼奧·豬木，保證都會大喊投降。


    幽默開玩笑似地說，我平常傳授他人大概會收取一千万日圓的報酬，現在雖然不是「跳樓大拍賣！」但本書這次仍不惜完全大公開。「下半身、反下半身」「高中生時間」這些講出來有點令人難為情的名稱，不覺得更敢發出「祕傳、精髓」的感覺嗎？另外，像是「鳥嘴」「巴爾坦星人」則有種驅使猛獸的印象，威力十足。


    「分歧」有股濃濃的傷感，反過來說，「反 N 大」這又太寫實，馬上就能記得。還有，one、two、three……之後的「7 日法則」十分重要，而整數關卡以及過去的高價與低價更是基本中的基本。


    ![](img/deba46b3116904b5339032f4dcd528a1_140_0.png)


    不過，雖然用了非常簡單明瞭且易懂的說明，但初學者要完美運用所有的技巧，得花個十年的時間吧。因為每一種訊號仔細鑽研起來都是大學問哪。


    畢竟，人都有擅長及不擅長的領域。首先，就從這些介紹過的訊號中，挑一個自己擅長的開始練習，哪怕只有一種也無妨。要是覺得我對「下半身」比較擅長，就鎖定股價在紅線完美穿過
    5 日線的「下半身」訊號，就算只是在短期間精準掌握到股價上漲一開始的波動，也能讓你賺到退休之後不愁生活的養老金。


    如果打算只靠「高中生時間」鎖定漲勢順利持續的這一段，風險也不會太高，可以在上漲行情最精華的階段穩當獲利。總之，一開始先徹底鑽研一項擅長的招式，每個月設定兩次左右的實戰交易，以能使用這項招數獲利為目標。成功之後，可以多加入另一項新招數做備援，不需要實際投入資金，先以測試即可。


