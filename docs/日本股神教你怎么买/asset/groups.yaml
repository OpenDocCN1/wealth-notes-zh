    ![](img/deba46b3116904b5339032f4dcd528a1_142_0.png)


    # 請愛上股票的走勢


    我之所以為股票的買賣訊號取了異想天開的名稱，用「趣味」的方式來說明股價變動，純粹是我對於股價的變動樂在其中。股價波動真的很好玩！有時候像是奧斯卡金像獎等級的精彩，暴跌時又宛如恐怖片，或者如同青春勵志片中歷經的苦澀挫折等等。對我來說，股價變動本身就深具娛樂性，實在可愛得不得了！


    或許，投資股票的理由確實只是單純「想增加財富」。不過，想要巧妙操作，成為一流的股票投資專家，我認為最好還是要真心愛上股票交易。能夠預測到在這個狀況下該買進或賣出，就覺得開心得不得了。深深愛上股票，到甚至想贈送傳承投資方法給你愛的人生日禮物的程度，例如我的著作，這就是股票投資更上一層樓的祕訣。


    ![](img/deba46b3116904b5339032f4dcd528a1_143_0.png)


    > 只要專精任何一個買賣訊號，生活費就不用愁。精通四個更能保此生安康，穩賺一輩子。


    # 第 7 章


    # 上漲行情的教戰守則


    - 一要率先看到答案

    - 用逆向投資法很簡單


    # 該如何解讀上漲行情


    對入門者來說，「股票投資就是買進」。買了股票之後，獲利來自於股價必須「上漲」。用 100 日圓買到的股票變成 101 日圓、102 日圓，不知不覺漲到 200
    日圓……股價要這樣上漲，是買股票獲利的必要條件。那麼，要在什麼狀況下股票才是「完美」上漲呢？


    就像前面看到的，K 線、均線的 5 日線、20 日線、60 日線、100 日線、300 日線全部上漲，而且 K 線 > 5 日線 > 20 日線……到 300
    日線由上而下依序並列的狀態，就是完美的上漲局面。


    相場式投資法是先從「結果」或「答案」切入，反向推出「原因」或「問題」的手法，我們藉此來尋找出最佳的買進交易時機。請想像一下股價上漲時的狀況。想像一下，這時候均線會朝什麼方向移動，以什麼型態排列。想要投資股票獲利，不是做白日夢就好，但發揮想像力是很重要的。


    「所有均線都上漲，股價更是強勢上揚的狀態，這就是上漲行情，只要買進都是大賺特賺。」這道理每個人都懂。不過，最好是當個及早發現這狀態「前一刻」的人吧！


    知道「完成型」的狀態下，要是在前一刻下手進場就行了。換句話說，就是在已知答案的狀況下，推衍出上漲前時間點的技巧。這頗像是一種作弊行為。無論多麼完美的上漲行情，股價本身都會像脫韁野馬，上上下下。這是要讓我們有種「揣測不安的心情」，擔心「搞不好馬上就要跌了」。這往往也是投資人錯失良機的原因。


    其實，遇到這類狀況更需要像無人飛機一般，俯瞰全局，掌握神的視角。首先，單看均線來認真尋找出走勢，從下跌轉往上漲的瞬間。接著，只呈現股價和 5 日線，虎視眈眈等待著短暫下滑的時刻來臨。


    圖 7-1 是將從 2015 年 8 月到 2017 年 5 月的日經平均指數的變動，僅顯示出均線的圖表。可以清楚看到由於均線全部上漲，因此股價在(A)區大幅提升。


    # 圖 7-1 光從均線可看出進入完美的上漲行情


    ![](img/deba46b3116904b5339032f4dcd528a1_147_0.png)


    那麼，在這之前發生了什麼事呢？回溯到過去來檢視一番。「回到未來」這句話正是為了股票交易而在。


    仔細觀察均線的排列，會發現除了 300 日線之外，均線依照 5 日線＞ 20 日線＞ 60 日線＞ 100 日線的順序排列的時期，就是在 5 日線成功超越持平的
    300 日線時，也就是①的時間點。


    ![](img/deba46b3116904b5339032f4dcd528a1_148_0.png)


    換句話說，可以視為從①的時間點開始，就開啟了④區的上漲行情。在①的時間點，上揚的 5 日線，超越同樣上揚的 20 日線，在線型上，完成了相場式中絕佳的購買訊號——「鳥嘴」。


    此時應該會發現接下來會再持續一波上漲行情吧！而出手買進。想要在上涨行情中爭取最大獲利，最重要的就是「在價格波動初期出手」。①正好就是上漲行情一開始的階段。


    不過，難道不能更早開始布局嗎？以這種角度來思考，回溯到更早的時間點來考慮的話，整體看來均線走平盤的 B 區，其實已經開始透露出「上漲行情的前兆」。


    要展開上漲行情，必須是先前的指數持平，或是下跌。這聽起來很理所当然。不過，價格變動的基本是「下跌→持平→上漲」，因此在即將上漲之前，絕大多數的狀況都是「先前下跌的指數轉為持平，來到再也
    不會下跌的局面」。


    圖 7-2 是將前面的圖 7-1 的 B 區放大後呈現。圖中在原先的下跌行情上出現明顯變化徵兆的是①的時間點。5 日線的低價上揚，不僅突破 20 日線，20
    日線也轉為上揚。想必在②前後的 K 線是令人著迷的長紅線，且出現完整的「下半身」線型。手上有資金的人，不妨在這個時候買進。


    # 如何事先預測 100 日線的動向


    話說回來，原先下滑的 5 日線轉為上漲還超越 20 日線，光是這樣還不能肯定的說平盤行情結束了。


    事實上，接下來在 ② 的這段時間，5 日線頻頻上下震盪，一度轉為上漲的 20 日線也回到平盤。20 日線持平，而 5 日線在其周邊像心電圖一樣上上下下的線型，就是典型的整理行情。


    然而，在 ② 這段期間的 5 日線，已經不會跌到 ① 的價位。在比前一波高價的範圍持平。


    這個狀況持續下去時，均線會怎麼樣？在下跌行情中往下走的 60 日線或 100 日線，連這些中長期均線都轉為持平，最終會轉為上揚。


    事實上，在 ③ 的時間點轉為上揚的 60 日線，突破了 100 日線。計算期間更短的 60 日線，來到 100 日線上方，且依然正在上漲的這個時間點 ③，可視為正式要進入上漲走勢的明確前導訊號。


    完美的上漲走勢線圖，由上而下的排列是股價、5 日線、20 日線、60 日線、100 日線，更理想的話最後是 300 日線，在進入無可挑剔的穩定上漲模式之前，一定會出現長、短期均線排列的變化。


    把這個道理牢牢記住後，若在線圖上看到 60 日線在 100 日線下方，雖然還沒真正上漲，但感覺到 60 日線似乎快要突破 100 日線時，就能事先預測到馬上就要進入真正的上漲走勢啦！這就是
    在圖 7-2 中 ② 的 5 日線、20 日線的持平走勢，事實上，到了③ 時 60 日線就突破了 100 日線。這才是相場地「如果出現這個就會變成那樣」的預測法。


    在看到答案的狀態下鑽研 3000 次線圖，持續「練習、練習、再練習」之下，不僅能知道「如果變成這樣，再來就會那樣」，還會了解「該怎麼樣才會變成這樣？」


    代表大約半年股價平均水準的 100 日線仍然維持下跌，就表示有些持股想賣出的人，手中持股還沒賣完。正因為在高檔時還有賣出，目前的股價才會比 100 天前低。因此，100
    日線才會持續往下走。


    如果在這時要轉換為上漲走勢，無論如何要先讓 60 日線突破 100 日線才行。60 日線要成功超越 100 日線，需要什麼條件呢？那就是往下走的 100 日線要「躺下來，持平」。


    那麼，要怎麼樣才能讓 100 日線躺下來呢？必須讓股價及 5 日線不再有大幅下跌，至少得在比最低價高一點的範圍內持續走平。


    # 從指數的「生活圈」來判斷均線的變化


    這完全就是圖 7-2 中的 5 日線、20 日線的持平走勢。接著如果股價再拉高一段，60 日線上揚，不僅突破 100 日線，連 100 日線也會從持平轉為上漲。這些都可以預測到。


    進入完美上漲走勢最明顯的訊號，就是股價與均線的排列由上而為：股價 ＞ 5 日線 ＞ 20 日線 ＞ 60 日線 ＞ 100 日線。既然這樣，在這之前就先好好閱讀行情，當
    60 日線眼看就要超越 100 日線時，就想到「要鎖定接下來的一波上漲行情」！


    圖 7-3 是在前面的圖 7-2 加上「期待已久」的 K 線圖。總算能用到一般的股票線圖了。


    前面提到的 100 日線也一樣，要判斷均線接下來是往上走，還是往下走時，留意股價的位置是一個重點。在均線中連帶觀察股價的變化，就會發現「股價的生活圈變了」。


    # 圖 7-3 加入 K 線後看到的具體價格變動


    ![](img/deba46b3116904b5339032f4dcd528a1_154_0.png)


    圖中在 A 區時股價始終在 100 日線的下方。不過，到了 B 區已經竄到 100 日線的上方，再也不會跌破 100 日線。這就是「股價的生活圈」變了。股價也有它的「生活圈」，從原先在
    100 日線下方生活的時代，雖然生活水準稍微降低，但至少在站上 100 日線之後，100 日線本身終於也轉為上漲。


    再加入 K 線之後，先前看到準備進入上漲走勢前一刻的⑪和⑫，以及正式進入上漲走勢的⑬，明顯出現了 K 線成為紅線，並有一半穿過 5 日線的「下半身」訊號。


    祝「下半身」幸福！各位要牢牢記得，在股價動向出現變化時，可以說幾乎一定會出現「下半身」及「反下半身」的訊號。


    # 記得也該關注「超長期」的 300 日線


    即使同樣的上漲走勢，也必須判斷出是「長期走勢中的上漲」或是「長期性下跌走勢中的一時上漲」。


    這時候，代表大約一年半平均股價的 300 日線便派上用場了。就算 300 日線下跌，但就像先前看到的 2015 年到 2017 年的日經平均指數一樣，100
    日線持平，漲勢就持續大約三個月。


    當然，要在這三個月裡買進，趁上漲獲利。如果這波漲勢持續超越長期上漲的 300 日線，就能有信心確定這波漲勢是貨真價實，而進場投資。


    # 圖 7-4 長期走勢要以 300 日線來判斷


    ![](img/deba46b3116904b5339032f4dcd528a1_156_0.png)


    這麼一想，300 日線的動向和位置就能用季節來比喻。300 日線上揚，股價（K 線）也在 300 日線之上的話，季節是春天。股價也會像氣溫上升一樣上漲。300
    日線下降，股價要是也在 300 日線之下，就算一時上漲，也會立刻「變冷」而降溫。


    仔細看圖 7-4 的線圖，可了解股價在 300 日線上方與下方時，上漲期間明顯不同。如果是在 300 日線上揚時上漲，漲勢能持續超過六個月也不奇怪；反之，如果是在
    300 日線下跌時上漲，了不起也就維持三個月。在這種局面下，不只買進，也要想到趁下跌時利用賣空來獲利。


    300 日線展現的季節感，便是股價走勢。就像生活在四季分明的環境中的人們一樣，投資人也該在「有行情時」才投資。


    # 請好好了解什麼是「大行情」


    經常聽到有人說，「有一波大行情」。這句話用均線來表示，就是 300 日線上漲、100 日線上漲、60 日線上漲、20 日線上漲、5 日線也上漲，也就是「全體上漲」的狀態。


    所有的均線上漲，由上而下排列為股價、5 日線……最後是 300 日線。這就是所謂的「大行情」，觀察過去三十年來的每次線圖皆是如此，到本書讀者全都上天堂時應該都是如此！


    圖 7-5 是稱為「安倍經濟學*」行情的一波「大行情」開始前夕，也就是 2012 年 8 月到 2014 年 5 月的長期日線圖，可看到(A)這段時間(約
    6 個月)，從股價到 300 日線圖全數以完美上漲模式排列。這就是大行情的具體實例。


    > 註解：日本首相安倍晉三於 2012 年 12 月 26 日就任後，為擺脫日本長達 15 年的通貨緊縮困境，並重振國內經濟，提出安倍經濟學的三箭計畫，推動寬鬆貨幣政策、擴大財政支出，以及結構性經濟改革與成長策略三大政策，此即所謂「安倍三箭」或「安倍經濟學」。


    # 圖 7-5 大行情的發展模式與形成前夕


    ![](img/deba46b3116904b5339032f4dcd528a1_159_0.png)


    是沒能在還沒買過股票的人，都後悔「那時應該要進場！」的大行情中確實獲利，說是掌握你投資人生成敗的關鍵，一點都不為過。首先，就將能帶給你幸福的「大行情」的架構、發展模式牢牢記在心中。


    從這個線圖可以發現，在 2012 年 11 月安倍經濟學行情啟動的前夕，長短期均線幾乎都聚集在同一個價格區段，在很窄的範圍內「上下扭動」（圖中的⑧區）。長短期均線糾纏在一起，表示行情已經醞釀到一個程度。300
    天之內的平均指數，和 5 天的平均指數在同一個範圍內，這狀況說明了就某種程度上而言，沒人賺錢也沒人賠錢吧。


    均線糾結到這種程度，接下來的股價變動不是大漲，就是大跌。圖 7-5 告訴大家長短期均線集結在一處時，代表是大行情來到的前夕。這種「完美無缺的大行情」每十年會出現兩、三次，各位記得要仔細盯緊，千萬別放過！


    # 出現下半身訊號時，即使違背心意也要「買進」


    來看看個在「下跌→持平→上漲」這個基本的價格變動過程中，從持平階段準備周全，趁在進入上漲行情前進場買進的實例。


    圖 7-6 是 2011 年 3 月在日本 311 大地震之後，日經平均指數跌到 8000 日圓低點時的線圖。


    最初該考慮「買進」的時間點，是股價沒有跌到①的低點，而在②、③擺脫低點時。這時候的 60 日線、100 日線也從下跌轉向持平。接著出現的就是④的「下半身」。


    由於是之前一直跌，好不容易持平之後剛看到的紅線，在心情上或許會覺得還不是買進的時機。不過，很可能就從這裡開始 V 型反轉上漲。當「下半身」訊號一出現，就算心情上不想買進，還是要趁早出手。這就是相場式及早進場的基本概念。


    # 圖 7-6 止跌破持平後的後半身訊號是買點


    ![](img/deba46b3116904b5339032f4dcd528a1_162_0.png)


    在人類生活中，「下半身」訊號往往也會違反理性與知性。股市不是靠知性與理性能百分之百獲勝的世界。正因為如此，即使違背心意，「K線都站起來了也沒辦法」，乖乖買進才是明智的決定。


    # 圖 7-7 真正進入上漲前要考量的因素


    ![](img/deba46b3116904b5339032f4dcd528a1_163_0.png)


    圖 7-7 中①的紅線不僅對於 5 日均線，對 20 日均線來說也形成「下半身」訊號。「下半身」與「反下半身」是短期性股價動能強度的象徵，通常會以 K 線和
    5 日均線之間的關係來看，但出現在 20 日均線上的「下半身」也是充分該買進的證明。當「下半身」一出現，無論在什麼樣的下跌行情中，也會連續拉出兩、三天的紅線，果然到了隔天出現②的紅線，碰到
    60 日線。接著又出現③的紅線，進一步突破 100 日線。


    下跌行情之後的持平局面中，長短期均線聚集在很小的範圍內，因此只要稍微上漲，股價很容易超越中長期的均線。這就是「長短均線聚集在一起，代表是大行情的前夕」這句話的意思。之後，股價連續上漲七天，直到④的紅線。從「7
    日法則」來看，即使一度下跌也很正常。


    事實上，先前一直處於下跌行情，在這個狀況下不太會出現股價突然從呈一直線，像是變了個人似的進入上漲模式的情形。


    觀察後就知道，會先下跌一波，然後上漲，如果不再回檔一波，就很难真正漲上去。


    不過，圖 7-7 的狀況在「7 日法則」之下漲勢小幅暫停之後卻也不輕易下跌，維持了一段平盤（⑤）。繼 5 日線之後 20 日線也完全轉為上揚。


    # 入門者在真正進入上漲的「前一刻」買進


    在「打底」的持平局面下，預料下一波的漲勢而買進，這需要很大的勇氣，以及一定程度的資金。對於入門者或是手中資金不多的人而言，在確定上漲走勢之後再買進就行了。但，那是什麼時候呢？


    以圖 7-8 來說明的話，就是在 5 日線與 20 日線都轉為上揚之後，5 日線一度下跌到接近 20 日線，接著再次遠離時。換句話說，建議等到「分歧」的局面時進場。


    每次有入門者問我：「我對股票還不是很懂，手上也沒多少資金，這樣到底該在什麼時候買進才好呢？」我推薦最能穩定獲利的訊號就是「分歧」。


    回到線圖上，上漲到①的紅線後，依循「7 日法則」一度下跌，5 日線上再次出現紅線的②或③，也就是完成「分歧」的訊號。

