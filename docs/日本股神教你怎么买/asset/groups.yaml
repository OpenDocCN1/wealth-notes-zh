    #### 5 了解何時該買賣的相場式訊號


    至於為什麼不把②稱為上半身，而要叫反下半身呢？原因可能只是相場式特別愛強調下半身而已（笑）。下半身、反下半身是能夠簡單了解並掌握到股價初期變動的重要訊號。也就是說從古至今東西方的線圖中不斷出現「買進時機」、「賣出時機」的決定關鍵。


    根據我自己 36 年的股票投資經驗，當 5 日線上揚時，紅線有超過一半冒出头呈現「精神飽滿」的「下半身」時，幾乎都會持續上漲好幾天。


    > 反過來說，「反下半身」是在 5 日線下跌時，黑線有超過一半在下方的線型。一出現這個訊號，就能判斷還會持續下跌幾天，或至少漲勢稍休維持平盤。


    圖 5-1 介紹概念圖與實例，請各位一定要牢牢記住。除了下半身、反下半身之外，K 線發出的訊息還有「持續下跌後的長下影線紅線」代表要轉為上漲行情，及「漲勢持續後的長上影線黑線」代表要轉為跌勢等等。將這些一併記下來，總會有派上用場的時候。


    ### 探討走勢持續的信號「鳥嘴」


    接下來是用傳家寶刀「均線」實作的相場式投資法基本訊號之二——「鳥嘴」。這是以短期與長期均線交織出的線型，用來當作買賣的依據，但即使連入門者也很容易發現。


    「鳥嘴」出現在走勢要出現重大轉變之前，類似「黃金交叉」或「死亡交叉」。


    - ①在下方往上揚的5日線突破上漲的20日線，形成「鳥嘴」的線型，就是要轉為漲勢的訊號，應該進場。

    - ②在上方往下跌的5日線跌破下滑的20日線，形成「反鳥嘴」的線型，就是要轉為跌勢的訊號，應該賣出。


    根據線型做出這樣的判斷（圖 5-2）。


