    # 第 6 章


    ## 得知何時該買賣的相場式訊號


    - 7 日法則

    - 股價的整數大關

    - 漲破最近高點

    - 嘗試攻頂失敗

    - 巴爾坦星人


    ### 均線加上「指標」是最厲害的！


    場式的作法是在「下半身」時買進，到了「鳥嘴」加碼，看到「分歧」後繼續加碼。交互使用這些名稱特殊且容易觀察的買賣訊號，反覆進行交易。


    另外一項我很重視的，就是能夠預測股價變動的「指標」，這就像是股票交易香料。在這一章裡，就來好好說明「指標」。


    「下半身」「鳥嘴」「分歧」等，很容易偵測到股價走勢最初的變動。相對於這些「訊號」，在本章中要介紹的「指標」，可以察覺到股價的轉換點，除了買進，據以判斷獲利了結以及賣出的時機也非常有效。前面也曾提過，所謂的股價，就是由買進的人和賣出的人雙方，透過「多少錢的話我就買」「不是這個價格的話我不賣」這樣的交涉而定出來。


    換句話說，在股價的背後有交易股票的投資人，但人往往會受到情感與欲望的控制，因此人類的行為模式會有其「週期或慣性」。觀察這些行為模式，留意人們在買賣股票時，在股價上偷偷留下的「指標」，即使面對像野馬一般的股價，也能精準預測到某種程度。


    ### 價格變動在時間循環上的「週期」


    人類會下意識將時間分成一個月、三個月、半年、一年的區間。這一點在股票投資的領域可見端倪。股價的變動通常會有「到了一月就上漲，在春分左右到達高點，邁向夏天時就下跌」這類季節性，或是「上漲行情走一個月的話還早，通常第三個月進入最熱絡的時期，持續六個月也差不多會疲軟」這類在時間上的循環。股價總是受到這些因素控制，非常奇妙。


    相場式股票投資法中最重視的，首先就是「三個月」和「六個月」這類循環。假設有一檔股票在持續下跌一陣子後，終於打底反彈，開始上漲。第一個月還在摸索的階段，但到了第二個月、第三個月，「哇！看起來是真的漲上來了耶！」投資人也紛紛關注，股價隨之強勢噴出。


    ![](img/deba46b3116904b5339032f4dcd528a1_116_0.png)


    雖然進入第四、第五個月仍持續漲勢，但到了這個時候，先前在第一、第二個月，也就是波動初期買進的投資人會開始心想「差不多該獲利了結」，於是開始出售股票，容易出現震盪行情。


    「沒這回事，還會繼續漲！」在這樣的預期心理下，股價繼續上漲，到了第六個月來到最高點，但此時會開始進入一種，大家都在觀望「何時會開始下跌呢」，這樣類似試膽大賽的狀況。


    「再怎麼說都漲太多啦，差不多該趕快獲利了終了。」投資人大舉賣出後，股價大幅下跌，然後結束「一波行情」，大多情況都是如此。


    其他更小規模的上漲、下跌行情，不會走到六個月，大概三個月就很容易來到「轉折點」。


    因為某些題材使得股價開始上漲（或開始下跌），經過的天數或期間，在股市就稱為「週期」。各位是不常看到股票相關報導中出現「週期性盤整」的詞。這指的就是當利空題材出現後，股價下跌的天數。


    #### 圖 6-1 留意時間循環的「週期」！


    ![](img/deba46b3116904b5339032f4dcd528a1_118_0.png)


    ### 看線圖時也要留意「3 個月」、「6 個月」的循環


    ![](img/deba46b3116904b5339032f4dcd528a1_118_1.png)


    出現利空題材後還沒經過多久，我們會形容這是「這檔股票盤整週期淺」。股票用語有時候會顯得困難，為何不直接就講「利空出現之後没多久」就好了呢？


    話題岔遠了，回到正題。為何「六個月」的週期會是個重要關鍵呢？理由會在之後詳細說明，因為股票的融資融券交易也會影響。


    融資融券交易，也就是信用交易，有個必須結算持有部位的日期，這個期間就是「半年＝六個月」。也因爲這樣，六個月的週期很容易成為轉折點。


    圖 6-1 下方的線圖是 NTT Docomo 的週線圖，可以清楚了解就長期性的上漲或下跌看來，「三個月」「六個月」的週期帶來很大的影響。換句話說，「股價上漲。持有這檔股票會持續賺錢，不過經過三個月之後要稍微留意一下。結果竟然仍然上漲。終於漲了六個月，已經賺了不少。」來到「關鍵」的六個月時，就要非常注意了。


    別貪心，這是個整理持股的最好時機。反過來說，無論再好的上漲行情，或再差的下跌行情，經過差不多六個月，也會一度趨於平穩。這是鎖定之後下一波新股價變動的好機會！因此，進入股市時，留意「週期」也是件很重要的事。


    ### 「7日法則」可助你採取最佳策略


    思考更短期的股價上下波動時，「週期」一樣很重要。我親身體會到股價的節奏有所謂「7日法則」。意思就是「無論什麼樣的走勢，上漲或下跌只要維持七天，就會一度稍微停歇」。


    股價就是反覆上上下下，持續波動。不管看哪一檔股票的線圖都能了解，沒有任何一檔股票從上市以來持續上漲從不下跌，或是呈一直線下跌完全沒漲過（除非該公司已破產）。


    在這樣的背景下，只要股價上漲，在低點買進的人就會賣出；股價下跌時，在高點放空的人就會回補。這就是投資人的行為。


    股市裡常聽到有句話說，「沒有人會長抱著股票進棺材」。別說是進棺材，「獲利的股票很少人抱著超過七天」這句話確實沒錯，而且道盡了股市本質。因此，one、two、three、four、five、six……到這裡時，股價走勢差不多就會失去了原先的力道。


    #### 圖 6-2 薩莉亞日線圖呈現的「7日法則」


    ![](img/deba46b3116904b5339032f4dcd528a1_121_0.png)


    聽起來可能有點鬼扯，但我是認真的。我認為光靠這個「7日法則」就能在股市中持續得勝，賺得飽飽的。


    圖 6-2 是薩莉亞的日線圖，這檔股票的線圖經常會出現 7 日法則。當出現紅線上漲之後，算算收盤價比前一天上漲的天數，大多在七天內漲勢就告一段落。在這期間就算出現黑線，只要收盤價仍比前一天高的話，當作一天來算也無妨。


    #### 圖 6-3 使用「7 日法則」的買賣實戰


    ![](img/deba46b3116904b5339032f4dcd528a1_122_0.png)


    我看了大約二十年份的薩莉亞股價波動資料，最多的上漲、下跌都是四天。長的也不過五、六天，要維持七天以上的漲勢或跌勢真的很少見。用圖 6-3 來說明的話，①是上漲第四天，紅線有一半通過
    5 日線，也就是「下半身」完成，是買進的點。接下來，依照法則在七天上漲到②的紅線，到了第八天果然在③的黑線下跌。如果留意「7日法則」，在②的紅K時就能在獲利更多的狀況下順利脫手。


    ④的黑線是「反下半身」，這裡放空。這個階段在連續四根黑線下告一段落。然後在上漲第二天，也就是⑤的紅線形成「下半身」買進，又漲到⑥的紅線為止，依照法則連續七天出現紅線。


    隔天，⑦的K線是帶有長長上影線的十字線（開盤價與收盤價相同的K線），到此告一段落。這樣的價格變動果然是上漲很難超過七天的「標準範例」。


    接下來⑧的K線是黑線，有一半穿過5日線，因此「反下半身」完成。這一天是開始下跌的第三天，之後在下跌的第七天出現紅線。若以「從7日法則來思考，跌勢差不多也要結束了」來預測，就能在這根紅線出現前的黑線，也就是在⑨獲利了結，得到好結果。


    「7日法則」之所以非常實用，就在於「雖然預測準確賺了錢，但已經上漲到了第五天，差不多是脫手的時機」，像這樣能在不貪心之下確保獲利。


    道理就是「無論再強勁的漲勢或跌勢，都很少持續超過七天」。


    ### 週線圖、月線圖也適用於「7 日法則」


    坦白說，光看 5 日線和 K 線在「下半身」時買進（或在「反下半身」時賣出），再依照「7 日法則」反覆確保獲利，其實就能賺到不少錢了。


    在「7 日法則」中有個重點，就是無論上漲或下跌，就是要趁早發現用來數 1、2、3……作為起點的 K 線。


    在判斷出遵照「7 日法則」開始有漲勢出現後，實際上可以買進的點，通常是在第二天或第三天出現的紅線，有一半超過 5 日線，也就是「下半身」完成的時候。這樣思考之下，假設在第二天買進，剩下的上漲期間最多就是五天。像這樣可以在某種程度上，事先預測上漲期間，可說就是「7
    日法則」的最大優點。


    至於該怎麼數，**遇到上漲時，要是收盤價低於前一天，不只是收黑線，就算是紅線，也要就此喊停**。此外，碰到先前在高價走跌的均線後維持平盤時，也要喊停。喊停之後會再次持續上漲，或是持續下跌，就要再觀察。


    事實上，「7 日法則」也適用於週線圖。例如，在週線圖上開始上漲第三根的「下半身」時買進，到了「反下半身」賣出。這麼一來，用 7 日法則來看，非常可能走勢能持續到第四、第五週。兩根週線算起來就是
    5 個交易日乘以 2，也就是十天。


    換句話說，接下來很可能還能持續賺個十天左右，可以比日線圖找出更大的價格波動。


    #### 圖 6-4 在週線圖上的「7 日法則」


    ![](img/deba46b3116904b5339032f4dcd528a1_125_0.png)


    第 128 頁的圖 6-4 是薩莉亞的週線圖，算一下紅線與黑線連續出現的次數，和日線圖相較之下，連續的狀況比較少，了不起就連續三週。在這兩年左右，連續六週出現同樣顏色的
    K 線，在線圖上就只有①和②兩次而已。


    「明明說是 7 日法則結果根本沒有到 7 嘛！」可能有人會來跟我抱怨，但由此可知，在週線圖上要看到同樣顏色的 K 線連續出現有多難得。


    使用週線圖時，雖然有些不按常規，但以「5 週均線」來表示會比較容易找到初期的變動。紅線或黑線連續出現的一開始（或是第二週），相對於 5 週均線大多是形成「下半身」或「反下半身」時。也就是說，當
    K 線有一半往反方向突破 5 週均線，而且是出現在週線基準時，代表這個方向性很可能持續下去！


    話說回來，由於看的是週線圖，一根 K 線代表可以吃五天。若是能記住週線圖上的「發現」，同時再配合日線圖中「7 日法則」來買賣，就能達到準確度更高的交易。


    這不僅限於「7 日法則」。比方說，在週線圖上找到股價快要碰到往下跌的均線的個股時，我會判斷要等到再漲上來還要一番工夫。不如改以放空來進攻。如果能找到適合放空的個股後，就能更有信心在日線圖上看出交易的時機。


    像這樣，在週線圖上出現珍貴的買賣訊號時，挑選出適合的個股，然後回來觀察日線圖，根據訊號指出的方向性，找出理想的買賣時機。這種靈活運用週線圖的方法非常有效。能以更大規模的時間範圍得知股價的走向之後，去進行每日交易的話，大概是所向無敵了吧。


    ### 注意股價的整數關卡


    「3 個月」「6 個月」或是「7 日法則」，這類在時間指標固然重要，但股票要進行交易，必須要先有股價。


    因此，像 300 日圓、500 日圓、1000 日圓、1500 日圓這類，也就是「整數的股價大關」就會是非常重要的區間指標。


    例如，股價下跌來到 400 日圓左右止跌，接下來超越 5 日線之後，就要開始想到接下來差不多該打底反彈了，可以進入準備的時期。


    #### 圖 6-5 「整數股價」以及日經平均指數的區間


    ![](img/deba46b3116904b5339032f4dcd528a1_128_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_128_1.png)


    要是前面一段下跌完全符合「7 日法則」，在 one、two、three、four、five、six，來到 seven 時，更有可能會反彈上漲。


    一心一意專注於眼前的股價變動時，就容易被瞬息萬變的股價搞得頭昏腦脹，一下子就忘了要注意股價的區間關卡。


    股價長期下跌時，很容易心浮氣躁，心想「就算人家說『股價會在整數區間止跌』，但這種話怎麼能信囉！」


    不過，事後再來觀察，股價真的很容易會在 500 日圓、1000 日圓這種整數的區間關卡止跌或停漲。特別是來到整數的股價附近時，先前的價格變動停止，或是股價變動速度或方向開始產生不同後，希望大家能一起心有所感。


    平常在超市計較 1、2 日圓價差的世界，和股市完全是天差地遠。高麗菜的价格不會有令人頭昏腦脹的波動，但股價會隨著經濟環境以及投資人的買賣瞬息萬變。


    雖然這是個「似乎無法預估價格」的世界，但投資者畢竟也是人，難免對 100 日圓、500 日圓、1000 日圓這類「整數大關」特別有感覺，忍不住在這些價格區間交易。


    第 131 頁的圖 6-5 是日經平均指數的動向，以及股價區間。


    ### 探討前一波高價與低價


    從培養行情大局觀的角度來說，「整數的股價關卡」非常重要，除此之外，站在投資人「口袋深度」的立場，另一個不得不關注的重點就是「近期的高價、低價」。


    所說的上漲走勢，指的是股價雖有上上下下的變動，但整體看來是上漲的波動。要出現這樣的狀態，就是股價必須超越前一個高價，來到新高點。此外，下跌時也不能跌破前一個低價，要擺脫低價區後繼續上漲。反過來說，下跌走勢就是高價與低價屢屢跌破，股價持續往下的狀況。當股價持平，進入箱型整理的狀況，代表股價沒有漲破前一波高價，但也沒跌破前一個低價，就維持在固定的範圍內持平。


    要掌握股價的動向，最重要的一點就是關注「走勢是上漲還是下跌，或是持平。」在觀察線圖時，前一波的高價、低價就是要留意的重點。


    #### 圖 6-6 過去的高價、低價容易成為重要關卡


    ![](img/deba46b3116904b5339032f4dcd528a1_131_0.png)


    當股價來到前一波高價附近時，一些買了股票的投資人看到高價會想賣出，股價很難對抗這股賣壓逆勢上漲，如果突破先前的高價，近期也不會有投資人以比這個高點更高的價格買進。因此為了打消潛在虧損而拋售的投資人也會變少，股價在沒有賣壓之下變得容易上漲。「突破近期高點」很容易會成為股價強勢上漲的信號。


    反過來說，當跌破前一個低價後，在這個低價附近買進，先前好不容易保住潛在獲利的投資人要面臨出現潛在虧損。原本在低價附近買進的投資人拋售，加上新的放空投資人加入戰局，使得股價容易加強力道下挫。綜合前一波高價、低價的相關思考，整理歸納後就是這樣：


    - ★「前一波的高價很容易成為之後上漲的阻礙。不過，一旦突破這個高點，之後就會立刻轉變為防止下跌的緩衝。」

    - ★「前一波的低價很容易成為防止之後下跌的緩衝。不過，一旦跌破這個低點，很容易成為阻礙上漲的關卡。」


    圖 6-6 也能清楚看出過去的高價或低價，經常會阻止股價波動。此外，一旦突破前一個高點，就會強勢上漲。尤其「前一波高價、低價」是整數區間的股價，威力更是強大。


    ### 「嘗試攻頂失敗」的訊號


    之所以要注意前一波的高價、低價，是因為一旦突破這個高價與低價後，很容易加速股價變化的走勢。話說回來，常見的狀況是沒有突破前一波高價與低價，而像是撞上透明關卡又回檔。兩者以比率來說，大概是能突破的占三成，無法突破的占七成。


    換句話說，比起突破前一波高價、低價，氣勢如同迸發的青春一般加速的波動，嘗試挑戰前一波高價、低價，卻遭到挫折回到先前的方向，更是獲利的時機。我把這一瞬間稱為「嘗試攻頂失敗」，可說就像苦澀青春受挫的片刻。


    第 130 頁的圖 6-6 中也有無法突破高點而下跌的價格波動，但第 133 頁的圖 6-7 裡位於高點範圍的股價無法突破前一波高價，形成「嘗試攻頂失敗」的線圖。在這個範例中，股價之後急速下跌。


    #### 圖 6-7 用收盤線來看「嘗試攻頂失敗」


    ![](img/deba46b3116904b5339032f4dcd528a1_134_0.png)


    將這樣的價格波動去除K線之後，光以「收盤線」來表示，就會成為左（右）側的線圖。收盤線也能看出高價和高價之間的點連起來，呈現下跌的趨勢，完成「嘗試攻頂失敗」的線型。


    在收盤線的線圖中1的時間點，收盤線低於5日線，5日線與20日線也完成了「反鳥嘴」線型。到這裡應該會想到該要賣出了吧！再加入K線（右側的線圖）一起看，果然在1完成了「反下半身」。像這樣先從大局看收盤線及均線，接著再以實際的K線找出具體買賣時機點，就是相場式的操作方式。


    ### 關注收盤線的外星人身影


    收盤線圖裡也有許多我珍藏的相場式買賣訊號，在此稍微介紹一下。我現年五十多歲。現在的年輕人或許不知道，但我們這個年代的人，從小就是看著《超人力霸王》長大的。在《超人力霸王》中有個很厲害的外星人，一出場就會發出特殊的笑聲，但觀察收盤線圖時，我突然發現好像冒出了一大群這個外星人的身影！


    外星人的名字叫做「巴爾坦星人」。長相就如圖 6-8 的 5 日線波動一樣，有兩隻角。因此，我將這樣的收盤線訊號稱作「巴爾坦星人」或「反巴爾坦星人」。


    - ① 收盤線上漲到行情的高檔→下跌→上漲→下跌，出現像是「M」字，也就是頭上長兩隻角的線型，這就是行情反轉下跌的前兆＝巴爾坦星人。（台灣股市常用的「M 頭」）。

    - ② 收盤線下跌到行情的低檔→上漲→下跌→上漲，出現像是「W」字，也是台灣股市常用的「W 底」，也是行情即將反彈上漲的信號＝反巴爾坦星人。


    ![](img/deba46b3116904b5339032f4dcd528a1_136_0.png)


    由此可知，「巴爾坦星人」與「反巴爾坦星人」就某種程度上代表股價反覆上漲→下跌，處在搞不清楚究竟要漲還是跌的狀況。但一旦突破這陣子上下震盪之後，就會出現明顯的價格變動，對此要特別留意。


    在行情持續過程中出現「巴爾坦星人」或「反巴爾坦星人」時，接下來經常是一掃震盪，朝下一波行情的方向加速變動。在趨勢盤一開始波動的階段，很容易出現加速變化，因此最好記住這個模式。


    ### 要注意均線的高價與低價！


    前面說明了「前一波高價、低價」作為價格波動指標的重要性，但在相場式股票投資法中，均線在過去創下的高點和低點也值得注意。


    尤其期間最短的 5 日線，很容易配合股價變動，而反覆上下震盪，下跌到一個低點後，又上漲來到高價，然後再下跌到低價，線型很容易出現「扭動」的型態。


    在這種狀況下，5 日線新低價要是比前一波低價還低，就證明了下跌行情繼續；如果來到新的低價，卻比前一波低價還高，代表價格變動的底部比想像中穩固，應該會持續反彈上漲……可這樣判斷。


    5 日線不容易出現收盤線的銳角線型，因此很少會有「巴爾坦星人」或「反巴爾坦星人」，但關注 5 日線上，前一波的高價與低價，就能早一步掌握到行情轉換。在行情持續的期間，上漲行情時
    5 日線的高價與低價會同時攀升，下跌行情的話會同時降低。


    #### 圖 6-9 5日線的高價與低價更新也要關注


    ![](img/deba46b3116904b5339032f4dcd528a1_138_0.png)


    行情最後的局面會是：


    - 在高檔時 5 日線的高價下跌，就是反轉下跌的信號。

    - 在低檔時 5 日線的低價上漲，就是反彈上漲的信號。

