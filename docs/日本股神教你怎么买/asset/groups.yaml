    之 所以要注意前一波的高價、低價，是因為一旦突破這個高價與低價後，很容易加速股價變化的走勢。話說回來，常見的狀況是沒有突破前一波高價與低價，而像是撞上透明關卡又回檔。兩者以比率來說，大概是能突破的占三成，無法突破的占七成。


