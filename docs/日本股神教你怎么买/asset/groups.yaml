    相場式使用信用交易，並採取部位操作，反覆買進賣出，有時 候還同時買進和放空，多空對沖。目的就是將股價的動向從 「點」延伸到「面」，一網打盡。


    實際進行股票交易的人一定了解，股價不是用知識、道理或是掛 保證就行，股價的波動永遠不可能百分之百依照預測變動。


    然而，坊間充斥的「股市投資必勝書」裡，只會告訴你鎖定單一 時機買賣，例如「等到這個訊號燈亮就買進，到了這個時候全部獲利 了結，出清之後大賺錢！」


    但真實世界的行情變動幾乎不會像教科書上的一樣，常讓入門者 感到很錯愕，「就算讀了書也完全派不上用場！」'
