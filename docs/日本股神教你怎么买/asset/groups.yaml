    ## 圖 8-8 同時持有買進與賣出雙方的多空對沖操作法


    ![](img/deba46b3116904b5339032f4dcd528a1_193_0.png)


    # 8

    下跌行情教戰守則：放空最好賺！


    在 100 日線、60 日線下跌時，看到股價稍微上漲之後，耐心等待「最後又會受到 60 日線壓抑而下跌吧」的演變，或者趁這波短期上漲時獲取一些利益，也是一種做法。


    那麼，具體來說該怎麼在這個從平盤到下跌走勢的行情中操作放空呢？可用圖 8-8 來驗證。


    首先，在①黑線跌破 5 日線，出現「反下轉身」訊號。即使接下來仍持續平盤行情，或是進入下跌行情也好，①都是個賣出的時機。


    這時，假設在①的「反下轉身」出現時賣出一百股。在相場式交易上以「1-0」標示。「1」是放空的部位，之後的「0」是買進部位。換句話說，「1-0」的意思就是，如果最低買賣單位是
    100 股的個股，就代表以「放空」交易了 100 股。


    接下來，②的紅線高點在碰到 100 日線之後，成為「上影線長的紅線」，判斷力道疲軟，持續放空。到了③的紅線出現後，一度將先前放空的量獲利了結，紀錄為「0-0」。


    然後縱使跌破 300 日線，卻沒有一口氣往下跌，而是在 300 日線下方小幅來回，但在④或⑤的「反下半身」時，就一定要下單放空。比方說，在⑤的「反下半身」下單兩百股，就紀錄為「2—0」。


    之後逐漸下跌，在⑥的紅線出現時確定獲利，但這裡刻意不要出清「賣出部位」，反倒買進 100 股，接著到了⑦的紅線（下半身）再加碼買進 100 股，紀錄為「2—2」。


    買進部位與賣出部位兩者持有相同數量時，就稱為「多空對沖」。由於買進與賣出的持有數量相同，無論股價上漲或下跌，損益抵銷之下為零。有人問：「為什麼要這樣？」因為這個局面明顯是從平盤轉下跌行情，不確定什麼時候會暴跌。因此，最好還是能繼續抱著賣出部位，先不急著脫手。


    不過，短時間內在⑦出現了「下半身」，非常可能漲個兩、三天。這時候持有等量的賣出與買進部位，在損益平衡的狀態下，就能仔細觀望。然後，等到⑨出現了明顯的賣出訊號「反下半身」時，就將買進的「2」脫手，再以僅有賣單
    200 股的「2—0」部位等候下跌。


    既然出現了明確的賣出訊號，也可以不要只是維持「2—0」，能夠更有自信增加空頭部位到「3—0」或「4—0」，在此決一勝負也不錯。這裡只是舉個例子說明，同時持有買進與賣出兩者部位，因應局面來調節持有量，這就叫做「部位操作」。


    ## 相場式股票投資法的精髓—— 部位操作


    相場式使用信用交易，並採取部位操作，反覆買進賣出，有時候還同時買進和放空，多空對沖。目的就是將股價的動向從「點」延伸到「面」，一網打盡。


    實際進行股票交易的人一定了解，股價不是用知識、道理或是掛保證就行，股價的波動永遠不可能百分之百依照預測變動。


    然而，坊間充斥的「股市投資必勝書」裡，只會告訴你鎖定單一時機買賣，例如「等到這個訊號燈亮就買進，到了這個時候全部獲利了結，出清之後大賺錢！」


    但真實世界的行情變動幾乎不會像教科書上的一樣，常讓入門者感到很錯愕，「就算讀了書也完全派不上用場！」


    # 8

    下跌行情的教戰守則：放空最好賺！


    因此，和集中一點交易完全相反的就是「部位操作」。


    股價的動向不外乎就是上漲、下跌、持平這幾個方向，但其間也會上上下下反覆震盪。就算能預測到股價的大致走向，這樣的震盪也會讓好不容易的獲利有所減損，這些都是家常便飯。


    ![](img/deba46b3116904b5339032f4dcd528a1_198_0.png)


    ## 以「多空對沖」避險，擴大獲利


    設股價的變動如圖 8-9 所示。整體來看，股價從①到③上漲，但在這段時間內上下震盪幅度很大。看了圖之後說「在②買進，到③時賣掉就賺了一筆」！這只是紙上談兵。當還沒看到未來時，到了⑥點比買進價格下跌許多時，難免會擔心莫非預測不準？也有人會在此認賠停損。


    要是運氣好一點，等到股價從⑥又漲上來，雖然抵銷了潛在虧損，但股價上下震盪的結果，從④到⑤只能賺到微幅的價差。相對地，藉由買進與放空的「多空對沖」，一顆心不必跟著震盪的股價七上八下，這就是將獲利擴大到極限的「部位操作」。


    例如，在④時買進，之後當股價跌到前一波高價的⑤時放空相同的數量。這麼一來，在⑥之後的下跌走勢中，買進的潛在虧損雖然增加，但相同數量的放空出現了潛在獲利，損益打平。


    ![](img/deba46b3116904b5339032f4dcd528a1_200_0.png)


    之後，等到股價漲過前一波低點時，在②先結算放空的部位，只留下買進部位的話，從②到⑨股價一路飆漲後就能再賺一大筆。股價下跌時以多空對沖來避險，這麼一來，相較於從⑨到⑩抱著買進部位不放苦守，可以獲利的幅度更大。


    只要採取「部位操作」，就能將獲利擴大到極限。不過，有時候明明只靠買進就能賺錢，卻胡亂放空，因為多空對沖而損失獲利；或是多空對沖之後，一旦結算放空部位後，股價卻繼續下跌，而導致買進部位的潛虧損擴大。由於也有這些狀況，多空對沖也可說是一把雙面刃。


    採取「多空對沖」，在降低風險的同時利用股價震盪的波段來獲利，這種手法就稱為「波段操作」。這是我每天鑽研的精髓，想要熟練，除了「練習、練習、再練習」、「磨練、磨練、再磨練」之外，別無他法。


    剛入門的投資人，對於「信用交易」或「多空對沖」心懷恐懼的話，可以只挑上漲走勢時「先買進 100 股*試水溫」，等到股價超越高點確認漲勢貨真價實之後，「再追加買進
    100 股」，等到一度下跌再漲上來後「再追加 100 股」。接著，等到多少有些獲利之後，先將 200 股獲利了結。剩下 100 股續抱，盡量擴大獲利。光憑「買進交易」也能做到很好的「部位操作」，請各位一定要勇於嘗試！


    註解：各國股市有所不同，有以 1 股、2 股為單位購進的，以台股為例，1000 股為一張股票，不足 1000 股則屬於零股。


    # 第 9 章


    ## 持平行情的教戰守則


    - 一面避免雙重受創

    - 一面賺點零用錢


    # 首先要察覺到「整理行情」的狀況


    續看過上漲、下跌，最後剩下的就是「平盤整理」時的價格變化。


    我們投資人都是在無法預料明天的狀況下交易。為了鎖定「平盤整理時的動態」，就得事先了解此刻整理行情（也稱為「箱型整理」或「震盪行情」）究竟是什麼狀況。


    如果事先告訴你，走到對面牆壁之前會有三處陷阱，只要小心翼翼走過去，或許就有辦法順利避開陷阱。不過，若是完全沒有事先提醒陷阱一事，再厲害的行家也會一不小心掉進去。


    換句話說，及早察覺到現在的走勢可能是平盤整理，就能避免在整理行情這個陷阱中造成損失的風險。意思是說，整理行情時的買賣策略和上漲行情、下跌行情時有著一百八十度的天差地遠，要是不小心誤判，採取「漲上來了買進」「看到下跌賣出」這種趨勢行情的交易手法，很可能會變成「以為要上漲了而買進，結果下跌」或是「以為要跌了賣出卻又上漲」，簡直就像狼狽地來回挨了好幾記耳光。


    在上漲行情中，理論上是該一旦上漲就買進，但在整理行情中上漲之後會立刻下跌，應該上漲就賣出。下跌行情，理論上是要一旦下跌就賣出，但在整理行情中，下跌之後會馬上上漲，原則就要變成一旦下跌就買進。要是誤判現在是趨勢行情或是整理行情，就會落入陷阱。


    首先要了解這個道理。那麼，整理行情究竟是什麼時候會出現呢？就在股價一下上漲，一下下跌之後的時間點。先要有價格大幅波動，股價上上下下的時期之後，才会有像是風暴過後的風平浪靜般，進入稱為「整理行情」的小幅震盪。


    股價要是上漲或下跌得太快，違反速限，就會有交通警察鳴笛要求停下來。如果懂得這個道理，在上漲或下跌行情的過程中，就能及早以「終究會出現整理行情」的角度，去觀察價格變動。


    ## 圖 9-1 5日線「上下扭動」是整理行情的特徵


    ![](img/deba46b3116904b5339032f4dcd528a1_205_0.png)


    就均線來看，20 日線上漲，加上 5 日線也上漲，是上漲的走勢。上漲持續一段時間後，5 日線終究會下跌，觸及到下方的 20 日線。


    這樣的觸及不僅一次，接連出現兩、三次之後，也就是 5 日線頻繁接觸到 20 日線時，就可以開始懷疑是不是出現整理行情了？5 日線一旦開始上下小幅震盪持平，先前上漲的
    20 日線也會從上漲轉為持平。這麼一來，5日線夾著持平的20日線，像心電圖一樣上上下下，就會形成整理行情中特殊的「上下扭動」的動態。


    將這一連串的過程用圖9-1做個整理，若是最後的「蠕動」「扭動」持續下去，就會是很明顯的「整理行情」。


    一旦形成「整理行情」，「一上漲就買進」這套在上漲行情中的成功模式就不適用了。若以為股價超越了前一波高點，應該還會繼續強勁上漲吧而買進，結果力竭轉為下跌就虧了。因此，這裡必須先將思考方式做個一百八十度的大調整，切換到整理行情特殊的買賣策略，也就是雖然稍微超越了前一波高價，但一旦出現黑線就賣出。


    尤其從趨勢行情剛轉入整理行情時更是道難關。接下來會持續強力的趨勢行情，或是上上下下的整理行情呢？在這個階段，由於狀況曖昧不明，經常就連股市裡的老手也會受騙。


    ### 5 日線觸及 20 日線是最初的訊號


    主要以均線來參考時，可以懷疑之前的上漲行情搞不好已經轉為整理行情了，就是在 5 日線與 20 日線都上漲的狀況下，先是 5 日線轉折，然後一次、兩次、三次，一而再、再而三地觸及到
    20 日線。


    圖 9-2 是 Oriental Land 的日線圖，線圖左側持續上漲的股價到了圖表中間時進入整理行情。


    以均線的動向來找尋變化的「前夕」，發現在圖上的①先看到 5 日線逐漸接近又遠離 20 日線。這是上漲行情中的「分歧」訊號。換句話說，在這個階段懷疑是整理行情還言之過早。


    不過，5 日線並沒有漲破前一波的高價，接著又跌破 20 日線，在②時就該懷疑「這搞不好是整理行情？」但結果，這也是一場白操心，股價持續上漲，而下一個強力的整理行情前夕的訊號，就是在下一個高價沒能突破前一個高價的③。接下來的④，5
    日線跌破 20 日線，終於連 20 日線本身也從上漲「躺下」，轉為持平。


    來到這個狀況，任誰都看得出來是整理行情了。「5 日線多次觸及甚至跌破 20 日線」→「股價沒有突破高點」→「終於連 20 日線也轉為持平」，這就是股價從漲勢轉為整理行情的步驟，請務必牢牢印在腦中。


    所謂「整理行情」，指的是股價在「一定範圍內」上上下下的狀況。要進入整理行情，首先，必須要出現「股價無法突破前一個高點，但也不會跌破前一個低點」的現象。在定出「上漲到這裡一定會下跌」的「上限」，以及「跌到這裡就會很奇妙地反彈上漲」的「下限」之後，這才算是真正進入整理行情。來到這裡，就可以擬定買賣策略，也就是達到上限就賣出，跌到下限就買進。


    ## 圖 9-3 找出整理行情上限、下限的方法


    ![](img/deba46b3116904b5339032f4dcd528a1_209_0.png)


    圖 9-3 跟前⾯⼀樣，是 Oriental Land 的⽇線圖。要找出整理⾏情，建議養成以⾼價點或低價點為起點畫橫線的習慣。1的⾼價在之後⼜被打破紀錄，因此還是在上漲⾏情。不過，2的⾼價之後並没有創⾼，就結果⽽⾔成了整理⾏情的上限。當然，在2的時間點還不能確認這⼀點。不過，當4的黑線出現⽽且沒能突破2的⾼價點時，就可以將2的這條線視為上限。


    3的低價被刷新之後依然在上下震盪，因此這裡並不是下限。不過，到了5的低價點反彈上漲，有機會成為接下來整理⾏情的下限。然後，6的黑線剛好在5這條線⽌跌，這下⼦就能確定低價點5是整理⾏情的下限。


    只要定出了上限、下限，接下來就簡單了。只要反覆接近下限就買進，接近上限就賣出的操作⾏了。在圖中7的「下⾝⼦」訊號買進，雖然8是長紅線，但到了2的上限，可以先賣出⼀點試⽔溫。果然，接下來跌到5的低價點，策略成功。總之，進⼊整理⾏情後，暫時性的也⽆所謂，趁早找出股價的上限、下限，就能當作獲利的根本。


    ## 整理行情「下一步」的交易技術


    整理行情不僅會出現「上漲→平盤」的高價區，也會出現「下跌→平盤」的低價區。此外，也會出現「上漲→平盤→再上漲」這類趨勢行情的過程。


    無論如何，在整理行情之後，上限或下限一旦遭到突破，必定會出現上漲或下跌行情。而接踵而來的上漲或下跌行情，真的很好賺！


    因此，緊接著整理行情後必定會出現的趨勢行情，在交易時也該納入考量。圖 9-4 是 Oriental Land 的線圖，跟先前相反，在持續下跌後，止跌形成整理行情，接著再打底後反彈上漲。


    從下跌行情轉為整理行情前夕的時間點，就是在❶時 5 日線與 20 日線交錯，一度止跌的地方。接著，❸的低價並未跌破❷的低價；相對地，❺的高價也沒有超越❹的高價，在此定出了下限與上限，正式進入整理行情。在❻的長黑線雖然跌破❷的低價點，但到了❼又再次回歸。考慮到整理行情還在持續，記得「一下跌就買進」的話，在❸這根長紅線之前的整理行情範圍內都能夠順利獲利。


    ## 圖 9-4 下跌後的整理行情與接下來的上漲行情


    ![](img/deba46b3116904b5339032f4dcd528a1_212_0.png)


    在⑧突破了整理行情的上限後，就該想到「這下子要轉為上漲了？」一下下跌後，⑨的長紅線突破整理行情的上限，對 5 日線形成了「下半身」的線型。沒錯，這是很明顯要進入上漲行情的訊號。到了⑨的時間點，勝負關鍵不在於賣出，而是買進。


    整理行情和單向不斷上漲或下跌的趨勢行情不同，股價只會在小範圍中上下震盪。因此，要以在整理行情的上限賣出，下限買進的原則，採取多次來回買賣的策略。基本上像是第一批的下跌賺星期天去外面吃大餐的錢，下一波下跌是兒子的補習費，下一次上漲是……類似這樣每次賺點小錢，積少成多，來作為此時交易的基本策略。


    圖 9-5・A 是圖 9-4 Oriental Land 日線圖的放大圖。當下頹行情即將轉向整理行情時，首先，就從股價沒有跌破前一跌低點，反而上漲開始。圖
    9-5・A 中(1)根長紅線對 5 日線形成「下半身」訊號，在心情上即使不想買進，依照相場式的交易法就是該買進的時機。


    下限定出來之後再來尋找上限，由於在(2)的小黑線下跌，可以判斷來到(3)的上影線最高點附近可能就是整理行情的上限。這麼一來，在(3)的「反下半身」應該要積極賣出。


    到這裡一直是下映行情。因此，即使股價一度止跌反彈上升，也很可能還沒進入整理行情，而是持續下跌行情。換句話說，在(3)的「反下半身」也可能是再次進入下跌行情的訊號。因此，從下跌行情轉向整理行情時，相較於「跌下來就買進」，反倒是「漲上去就賣出」是更安全的交易方式。如果下限買進的部位是「0—1」，上限賣出就以「2—0」來布局，也就是保持放空是買進的兩倍數量來交易，針對上漲與下跌採取強度不同的交易方法。


    ## 圖 9-5・A 下跌後的整理行情以買進 1：賣出 2 來決勝負


    ![](img/deba46b3116904b5339032f4dcd528a1_214_0.png)


    接下來，看下一頁的圖 9-5・B 會看到在整理行情中下限的稍微上方出現了❷的黑線。在這裡試探性的買進，等到❶的「下半身」出現後可以繼續加碼買進。


    ## 圖 9-5·B 箱型整理中「下半身」與「反下半身」仍有效


    ![](img/deba46b3116904b5339032f4dcd528a1_215_0.png)


    定出整理行情的上限與下限後，接下來就重複這些基本原則來交易，像是「股價一旦達上限，即使收紅也試探性賣一點，之後在『反下半身』出現時追加賣出」、「股價一旦達下限，即使收黑線也試探性買一點，之後在『下半身』出現時加碼買進」。


    繼續看下去，⑥雖然有一根長紅 K 線，但上影線接近高價點的上限，可以試探性的賣出也無妨。或是到了隔天確認開盤價下跌再賣，等到⑦這根大黑 K 線時脫手。


    接下來，⑧的紅 K 線出現在整理行情的下限，即使沒有出現「下半身」的訊號也要買進。


    ⑨的黑線是股價沒有上漲到箱型整理的上限，卻再次下跌的局面，但這是「反下半身」訊號，可以毫不猶豫賣出。


    雖然是整理行情，股價也未必會走到箱型整理的上限或下限之後再反轉。事實，多半是在箱型範圍中上上下下，這時候就倚賴對 5 日線出現的上「下半身」及「反下半身」訊號，來找出適當的買賣時機。


    來到⑩稍事停歇，回到低價點，理論上即使收長黑線也要買進。豈料接下來繼續下跌，終告失敗。人生漫長，畢竟有成功也會有失敗。


    ## 圖 9-5·C 即使失敗仍能靠「部位操作」來彌補


    ![](img/deba46b3116904b5339032f4dcd528a1_217_0.png)


    失敗時設法停損也是做法之一，但此時以「多空對沖」觀望也可以。在⑩的大黑線買進，設定「0—1」的部位，在⑪的黑線發現「啊，失敗了！」時，再重新放空，設定部位為「1—1」。這麼一來，即使股價在整理行情的下限連收幾根黑線，也可以在損益平衡下暫且觀望後再做決定。


    有時，股價會在⑦的黑線出現「反下半身」，並明顯跌破整理行情的下限及 5 日線，如果認為「可能會再次從整理行情回到下跌行情」而追加放空，部位定位為「2－1」也可以。


    結果，並沒有出現預期的「進入下跌行情」，⑫的紅線形成「下半身」（圖 9-5·C）。在這裡，因為「果然沒有進入下跌行情」而先將部分追加實空的大量出清，部位操作為「1－1」。


    接下來，股價竟然在⑧突破了整理行情的下限，出現紅線。


    「這下子整理行情的反彈上漲復活了！」判斷之後立刻將先前試水溫的放空部位結算，成為「0－1」，切換為只有買進的部位。總之，在實戰交易時最重要的就是，不要執著於一時的失敗，變得過度悲觀而陷入無法思考的窘境。想想「失敗為成功之母」，採取相場式「部位操作」來彌補失敗的損失，以多空對沖的做法來等候下一個機會。


    結果持續反彈上漲之下，在⑫終於出現了精彩的長紅線。


    這時在下一個黑線時，暫且脫手，以「0－0」來稍微觀望，不需要隨時持有部位也無妨。股價已經突破了整理行情的上限，而且不僅

    '
  mdcn: '

    然後進入真正的下跌走勢。


    在③之後完成了「300 日線 > 100 日線……> 股價」的完美下跌行情排列。當顯示過去五個月平均股價的 100 日線，以及顯示過去三個月平均股價的 60
    日線都下跌時，即使股價出現短期的上漲，一樣是「逃不出如來佛的手掌心」。當股價上漲來到接近 60 日線、100 日線時，開始進場放空就能獲利。


    ## 圖 8-8 同時持有買進與賣出雙方的多空對沖操作法


    ![](img/deba46b3116904b5339032f4dcd528a1_193_0.png)


    # 8

    下跌行情教戰守則：放空最好賺！


    在 100 日線、60 日線下跌時，看到股價稍微上漲之後，耐心等待「最後又會受到 60 日線壓抑而下跌吧」的演變，或者趁這波短期上漲時獲取一些利益，也是一種做法。


    那麼，具體來說該怎麼在這個從平盤到下跌走勢的行情中操作放空呢？可用圖 8-8 來驗證。


    首先，在①黑線跌破 5 日線，出現「反下轉身」訊號。即使接下來仍持續平盤行情，或是進入下跌行情也好，①都是個賣出的時機。


    這時，假設在①的「反下轉身」出現時賣出一百股。在相場式交易上以「1-0」標示。「1」是放空的部位，之後的「0」是買進部位。換句話說，「1-0」的意思就是，如果最低買賣單位是
    100 股的個股，就代表以「放空」交易了 100 股。


    接下來，②的紅線高點在碰到 100 日線之後，成為「上影線長的紅線」，判斷力道疲軟，持續放空。到了③的紅線出現後，一度將先前放空的量獲利了結，紀錄為「0-0」。


    然後縱使跌破 300 日線，卻沒有一口氣往下跌，而是在 300 日線下方小幅來回，但在④或⑤的「反下半身」時，就一定要下單放空。比方說，在⑤的「反下半身」下單兩百股，就紀錄為「2—0」。


    之後逐漸下跌，在⑥的紅線出現時確定獲利，但這裡刻意不要出清「賣出部位」，反倒買進 100 股，接著到了⑦的紅線（下半身）再加碼買進 100 股，紀錄為「2—2」。


    買進部位與賣出部位兩者持有相同數量時，就稱為「多空對沖」。由於買進與賣出的持有數量相同，無論股價上漲或下跌，損益抵銷之下為零。有人問：「為什麼要這樣？」因為這個局面明顯是從平盤轉下跌行情，不確定什麼時候會暴跌。因此，最好還是能繼續抱著賣出部位，先不急著脫手。


    不過，短時間內在⑦出現了「下半身」，非常可能漲個兩、三天。這時候持有等量的賣出與買進部位，在損益平衡的狀態下，就能仔細觀望。然後，等到⑨出現了明顯的賣出訊號「反下半身」時，就將買進的「2」脫手，再以僅有賣單
    200 股的「2—0」部位等候下跌。


    既然出現了明確的賣出訊號，也可以不要只是維持「2—0」，能夠更有自信增加空頭部位到「3—0」或「4—0」，在此決一勝負也不錯。這裡只是舉個例子說明，同時持有買進與賣出兩者部位，因應局面來調節持有量，這就叫做「部位操作」。


    ## 相場式股票投資法的精髓—— 部位操作


    相場式使用信用交易，並採取部位操作，反覆買進賣出，有時候還同時買進和放空，多空對沖。目的就是將股價的動向從「點」延伸到「面」，一網打盡。


    實際進行股票交易的人一定了解，股價不是用知識、道理或是掛保證就行，股價的波動永遠不可能百分之百依照預測變動。


    然而，坊間充斥的「股市投資必勝書」裡，只會告訴你鎖定單一時機買賣，例如「等到這個訊號燈亮就買進，到了這個時候全部獲利了結，出清之後大賺錢！」


    但真實世界的行情變動幾乎不會像教科書上的一樣，常讓入門者感到很錯愕，「就算讀了書也完全派不上用場！」


    # 8

    下跌行情的教戰守則：放空最好賺！


    因此，和集中一點交易完全相反的就是「部位操作」。


    股價的動向不外乎就是上漲、下跌、持平這幾個方向，但其間也會上上下下反覆震盪。就算能預測到股價的大致走向，這樣的震盪也會讓好不容易的獲利有所減損，這些都是家常便飯。


    ![](img/deba46b3116904b5339032f4dcd528a1_198_0.png)


    ## 以「多空對沖」避險，擴大獲利


    設股價的變動如圖 8-9 所示。整體來看，股價從①到③上漲，但在這段時間內上下震盪幅度很大。看了圖之後說「在②買進，到③時賣掉就賺了一筆」！這只是紙上談兵。當還沒看到未來時，到了⑥點比買進價格下跌許多時，難免會擔心莫非預測不準？也有人會在此認賠停損。


    要是運氣好一點，等到股價從⑥又漲上來，雖然抵銷了潛在虧損，但股價上下震盪的結果，從④到⑤只能賺到微幅的價差。相對地，藉由買進與放空的「多空對沖」，一顆心不必跟著震盪的股價七上八下，這就是將獲利擴大到極限的「部位操作」。


    例如，在④時買進，之後當股價跌到前一波高價的⑤時放空相同的數量。這麼一來，在⑥之後的下跌走勢中，買進的潛在虧損雖然增加，但相同數量的放空出現了潛在獲利，損益打平。


    ![](img/deba46b3116904b5339032f4dcd528a1_200_0.png)


    之後，等到股價漲過前一波低點時，在②先結算放空的部位，只留下買進部位的話，從②到⑨股價一路飆漲後就能再賺一大筆。股價下跌時以多空對沖來避險，這麼一來，相較於從⑨到⑩抱著買進部位不放苦守，可以獲利的幅度更大。


    只要採取「部位操作」，就能將獲利擴大到極限。不過，有時候明明只靠買進就能賺錢，卻胡亂放空，因為多空對沖而損失獲利；或是多空對沖之後，一旦結算放空部位後，股價卻繼續下跌，而導致買進部位的潛虧損擴大。由於也有這些狀況，多空對沖也可說是一把雙面刃。


    採取「多空對沖」，在降低風險的同時利用股價震盪的波段來獲利，這種手法就稱為「波段操作」。這是我每天鑽研的精髓，想要熟練，除了「練習、練習、再練習」、「磨練、磨練、再磨練」之外，別無他法。


    剛入門的投資人，對於「信用交易」或「多空對沖」心懷恐懼的話，可以只挑上漲走勢時「先買進 100 股*試水溫」，等到股價超越高點確認漲勢貨真價實之後，「再追加買進
    100 股」，等到一度下跌再漲上來後「再追加 100 股」。接著，等到多少有些獲利之後，先將 200 股獲利了結。剩下 100 股續抱，盡量擴大獲利。光憑「買進交易」也能做到很好的「部位操作」，請各位一定要勇於嘗試！


    註解：各國股市有所不同，有以 1 股、2 股為單位購進的，以台股為例，1000 股為一張股票，不足 1000 股則屬於零股。


    # 第 9 章


    ## 持平行情的教戰守則


    - 一面避免雙重受創

    - 一面賺點零用錢


    # 首先要察覺到「整理行情」的狀況


    續看過上漲、下跌，最後剩下的就是「平盤整理」時的價格變化。


    我們投資人都是在無法預料明天的狀況下交易。為了鎖定「平盤整理時的動態」，就得事先了解此刻整理行情（也稱為「箱型整理」或「震盪行情」）究竟是什麼狀況。


    如果事先告訴你，走到對面牆壁之前會有三處陷阱，只要小心翼翼走過去，或許就有辦法順利避開陷阱。不過，若是完全沒有事先提醒陷阱一事，再厲害的行家也會一不小心掉進去。


    換句話說，及早察覺到現在的走勢可能是平盤整理，就能避免在整理行情這個陷阱中造成損失的風險。意思是說，整理行情時的買賣策略和上漲行情、下跌行情時有著一百八十度的天差地遠，要是不小心誤判，採取「漲上來了買進」「看到下跌賣出」這種趨勢行情的交易手法，很可能會變成「以為要上漲了而買進，結果下跌」或是「以為要跌了賣出卻又上漲」，簡直就像狼狽地來回挨了好幾記耳光。


    在上漲行情中，理論上是該一旦上漲就買進，但在整理行情中上漲之後會立刻下跌，應該上漲就賣出。下跌行情，理論上是要一旦下跌就賣出，但在整理行情中，下跌之後會馬上上漲，原則就要變成一旦下跌就買進。要是誤判現在是趨勢行情或是整理行情，就會落入陷阱。


    首先要了解這個道理。那麼，整理行情究竟是什麼時候會出現呢？就在股價一下上漲，一下下跌之後的時間點。先要有價格大幅波動，股價上上下下的時期之後，才会有像是風暴過後的風平浪靜般，進入稱為「整理行情」的小幅震盪。


    股價要是上漲或下跌得太快，違反速限，就會有交通警察鳴笛要求停下來。如果懂得這個道理，在上漲或下跌行情的過程中，就能及早以「終究會出現整理行情」的角度，去觀察價格變動。


    ## 圖 9-1 5日線「上下扭動」是整理行情的特徵


    ![](img/deba46b3116904b5339032f4dcd528a1_205_0.png)


    就均線來看，20 日線上漲，加上 5 日線也上漲，是上漲的走勢。上漲持續一段時間後，5 日線終究會下跌，觸及到下方的 20 日線。


    這樣的觸及不僅一次，接連出現兩、三次之後，也就是 5 日線頻繁接觸到 20 日線時，就可以開始懷疑是不是出現整理行情了？5 日線一旦開始上下小幅震盪持平，先前上漲的
    20 日線也會從上漲轉為持平。這麼一來，5日線夾著持平的20日線，像心電圖一樣上上下下，就會形成整理行情中特殊的「上下扭動」的動態。


    將這一連串的過程用圖9-1做個整理，若是最後的「蠕動」「扭動」持續下去，就會是很明顯的「整理行情」。


    一旦形成「整理行情」，「一上漲就買進」這套在上漲行情中的成功模式就不適用了。若以為股價超越了前一波高點，應該還會繼續強勁上漲吧而買進，結果力竭轉為下跌就虧了。因此，這裡必須先將思考方式做個一百八十度的大調整，切換到整理行情特殊的買賣策略，也就是雖然稍微超越了前一波高價，但一旦出現黑線就賣出。


    尤其從趨勢行情剛轉入整理行情時更是道難關。接下來會持續強力的趨勢行情，或是上上下下的整理行情呢？在這個階段，由於狀況曖昧不明，經常就連股市裡的老手也會受騙。


    ### 5 日線觸及 20 日線是最初的訊號


    主要以均線來參考時，可以懷疑之前的上漲行情搞不好已經轉為整理行情了，就是在 5 日線與 20 日線都上漲的狀況下，先是 5 日線轉折，然後一次、兩次、三次，一而再、再而三地觸及到
    20 日線。


    圖 9-2 是 Oriental Land 的日線圖，線圖左側持續上漲的股價到了圖表中間時進入整理行情。


    以均線的動向來找尋變化的「前夕」，發現在圖上的①先看到 5 日線逐漸接近又遠離 20 日線。這是上漲行情中的「分歧」訊號。換句話說，在這個階段懷疑是整理行情還言之過早。


    不過，5 日線並沒有漲破前一波的高價，接著又跌破 20 日線，在②時就該懷疑「這搞不好是整理行情？」但結果，這也是一場白操心，股價持續上漲，而下一個強力的整理行情前夕的訊號，就是在下一個高價沒能突破前一個高價的③。接下來的④，5
    日線跌破 20 日線，終於連 20 日線本身也從上漲「躺下」，轉為持平。


    來到這個狀況，任誰都看得出來是整理行情了。「5 日線多次觸及甚至跌破 20 日線」→「股價沒有突破高點」→「終於連 20 日線也轉為持平」，這就是股價從漲勢轉為整理行情的步驟，請務必牢牢印在腦中。


    所謂「整理行情」，指的是股價在「一定範圍內」上上下下的狀況。要進入整理行情，首先，必須要出現「股價無法突破前一個高點，但也不會跌破前一個低點」的現象。在定出「上漲到這裡一定會下跌」的「上限」，以及「跌到這裡就會很奇妙地反彈上漲」的「下限」之後，這才算是真正進入整理行情。來到這裡，就可以擬定買賣策略，也就是達到上限就賣出，跌到下限就買進。


    ## 圖 9-3 找出整理行情上限、下限的方法


    ![](img/deba46b3116904b5339032f4dcd528a1_209_0.png)


    圖 9-3 跟前⾯⼀樣，是 Oriental Land 的⽇線圖。要找出整理⾏情，建議養成以⾼價點或低價點為起點畫橫線的習慣。1的⾼價在之後⼜被打破紀錄，因此還是在上漲⾏情。不過，2的⾼價之後並没有創⾼，就結果⽽⾔成了整理⾏情的上限。當然，在2的時間點還不能確認這⼀點。不過，當4的黑線出現⽽且沒能突破2的⾼價點時，就可以將2的這條線視為上限。


    3的低價被刷新之後依然在上下震盪，因此這裡並不是下限。不過，到了5的低價點反彈上漲，有機會成為接下來整理⾏情的下限。然後，6的黑線剛好在5這條線⽌跌，這下⼦就能確定低價點5是整理⾏情的下限。


    只要定出了上限、下限，接下來就簡單了。只要反覆接近下限就買進，接近上限就賣出的操作⾏了。在圖中7的「下⾝⼦」訊號買進，雖然8是長紅線，但到了2的上限，可以先賣出⼀點試⽔溫。果然，接下來跌到5的低價點，策略成功。總之，進⼊整理⾏情後，暫時性的也⽆所謂，趁早找出股價的上限、下限，就能當作獲利的根本。


    ## 整理行情「下一步」的交易技術


    整理行情不僅會出現「上漲→平盤」的高價區，也會出現「下跌→平盤」的低價區。此外，也會出現「上漲→平盤→再上漲」這類趨勢行情的過程。


    無論如何，在整理行情之後，上限或下限一旦遭到突破，必定會出現上漲或下跌行情。而接踵而來的上漲或下跌行情，真的很好賺！


    因此，緊接著整理行情後必定會出現的趨勢行情，在交易時也該納入考量。圖 9-4 是 Oriental Land 的線圖，跟先前相反，在持續下跌後，止跌形成整理行情，接著再打底後反彈上漲。


    從下跌行情轉為整理行情前夕的時間點，就是在❶時 5 日線與 20 日線交錯，一度止跌的地方。接著，❸的低價並未跌破❷的低價；相對地，❺的高價也沒有超越❹的高價，在此定出了下限與上限，正式進入整理行情。在❻的長黑線雖然跌破❷的低價點，但到了❼又再次回歸。考慮到整理行情還在持續，記得「一下跌就買進」的話，在❸這根長紅線之前的整理行情範圍內都能夠順利獲利。


    ## 圖 9-4 下跌後的整理行情與接下來的上漲行情


    ![](img/deba46b3116904b5339032f4dcd528a1_212_0.png)


    在⑧突破了整理行情的上限後，就該想到「這下子要轉為上漲了？」一下下跌後，⑨的長紅線突破整理行情的上限，對 5 日線形成了「下半身」的線型。沒錯，這是很明顯要進入上漲行情的訊號。到了⑨的時間點，勝負關鍵不在於賣出，而是買進。


    整理行情和單向不斷上漲或下跌的趨勢行情不同，股價只會在小範圍中上下震盪。因此，要以在整理行情的上限賣出，下限買進的原則，採取多次來回買賣的策略。基本上像是第一批的下跌賺星期天去外面吃大餐的錢，下一波下跌是兒子的補習費，下一次上漲是……類似這樣每次賺點小錢，積少成多，來作為此時交易的基本策略。


    圖 9-5・A 是圖 9-4 Oriental Land 日線圖的放大圖。當下頹行情即將轉向整理行情時，首先，就從股價沒有跌破前一跌低點，反而上漲開始。圖
    9-5・A 中(1)根長紅線對 5 日線形成「下半身」訊號，在心情上即使不想買進，依照相場式的交易法就是該買進的時機。


    下限定出來之後再來尋找上限，由於在(2)的小黑線下跌，可以判斷來到(3)的上影線最高點附近可能就是整理行情的上限。這麼一來，在(3)的「反下半身」應該要積極賣出。


    到這裡一直是下映行情。因此，即使股價一度止跌反彈上升，也很可能還沒進入整理行情，而是持續下跌行情。換句話說，在(3)的「反下半身」也可能是再次進入下跌行情的訊號。因此，從下跌行情轉向整理行情時，相較於「跌下來就買進」，反倒是「漲上去就賣出」是更安全的交易方式。如果下限買進的部位是「0—1」，上限賣出就以「2—0」來布局，也就是保持放空是買進的兩倍數量來交易，針對上漲與下跌採取強度不同的交易方法。


    ## 圖 9-5・A 下跌後的整理行情以買進 1：賣出 2 來決勝負


    ![](img/deba46b3116904b5339032f4dcd528a1_214_0.png)


    接下來，看下一頁的圖 9-5・B 會看到在整理行情中下限的稍微上方出現了❷的黑線。在這裡試探性的買進，等到❶的「下半身」出現後可以繼續加碼買進。


    ## 圖 9-5·B 箱型整理中「下半身」與「反下半身」仍有效


    ![](img/deba46b3116904b5339032f4dcd528a1_215_0.png)


    定出整理行情的上限與下限後，接下來就重複這些基本原則來交易，像是「股價一旦達上限，即使收紅也試探性賣一點，之後在『反下半身』出現時追加賣出」、「股價一旦達下限，即使收黑線也試探性買一點，之後在『下半身』出現時加碼買進」。


    繼續看下去，⑥雖然有一根長紅 K 線，但上影線接近高價點的上限，可以試探性的賣出也無妨。或是到了隔天確認開盤價下跌再賣，等到⑦這根大黑 K 線時脫手。


    接下來，⑧的紅 K 線出現在整理行情的下限，即使沒有出現「下半身」的訊號也要買進。


    ⑨的黑線是股價沒有上漲到箱型整理的上限，卻再次下跌的局面，但這是「反下半身」訊號，可以毫不猶豫賣出。


    雖然是整理行情，股價也未必會走到箱型整理的上限或下限之後再反轉。事實，多半是在箱型範圍中上上下下，這時候就倚賴對 5 日線出現的上「下半身」及「反下半身」訊號，來找出適當的買賣時機。


    來到⑩稍事停歇，回到低價點，理論上即使收長黑線也要買進。豈料接下來繼續下跌，終告失敗。人生漫長，畢竟有成功也會有失敗。


    ## 圖 9-5·C 即使失敗仍能靠「部位操作」來彌補


    ![](img/deba46b3116904b5339032f4dcd528a1_217_0.png)


    失敗時設法停損也是做法之一，但此時以「多空對沖」觀望也可以。在⑩的大黑線買進，設定「0—1」的部位，在⑪的黑線發現「啊，失敗了！」時，再重新放空，設定部位為「1—1」。這麼一來，即使股價在整理行情的下限連收幾根黑線，也可以在損益平衡下暫且觀望後再做決定。


    有時，股價會在⑦的黑線出現「反下半身」，並明顯跌破整理行情的下限及 5 日線，如果認為「可能會再次從整理行情回到下跌行情」而追加放空，部位定位為「2－1」也可以。


    結果，並沒有出現預期的「進入下跌行情」，⑫的紅線形成「下半身」（圖 9-5·C）。在這裡，因為「果然沒有進入下跌行情」而先將部分追加實空的大量出清，部位操作為「1－1」。


    接下來，股價竟然在⑧突破了整理行情的下限，出現紅線。


    「這下子整理行情的反彈上漲復活了！」判斷之後立刻將先前試水溫的放空部位結算，成為「0－1」，切換為只有買進的部位。總之，在實戰交易時最重要的就是，不要執著於一時的失敗，變得過度悲觀而陷入無法思考的窘境。想想「失敗為成功之母」，採取相場式「部位操作」來彌補失敗的損失，以多空對沖的做法來等候下一個機會。


    結果持續反彈上漲之下，在⑫終於出現了精彩的長紅線。


    這時在下一個黑線時，暫且脫手，以「0－0」來稍微觀望，不需要隨時持有部位也無妨。股價已經突破了整理行情的上限，而且不僅

