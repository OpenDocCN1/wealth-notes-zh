    # 5種常用的相場式「均線」


    與其近看，還不如從某種程度上較遠的地方看事情，還看得較清楚些。


    股價漲漲跌跌，時而劇烈震盪，時而呈現複雜的變動，但是卻有「飛行工具」可以像無人機那樣，從高處俯瞰。「**均線**」就是這樣的**工具，它也是相場式股票投資法中不可或缺的武器**。


    就像壽司師傅全心貫注在生魚片菜刀上，或職棒選手感謝棒球手套一樣，我們也要多加演練「均線」這工具，將它愈磨愈利。


    **要使用的均線至少有五種**。


    首先是「5日線」。股市於週一至週五進行交易，一共五天。而5日線是一條把「一星期」這個段落的股價平均值連結起來的線，因此是把短期的股價變動給抽象化，是極其重要的線。


