  - '[PAGE 152]


    # 如何事先預測 100 日線的動向


    在看到答案的狀態下鑽研 3000 次線圖，持續「練習、練習、再練習」之下，不僅能知道「如果變成這樣，再來就會那樣」，還會了解「該怎麼樣才會變成這樣？」


    代表大約半年股價平均水準的 100 日線仍然維持下跌，就表示有些持股想賣出的人，手中持股還沒賣完。正因為在高檔時還有賣出，目前的股價才會比 100 天前低。因此，100
    日線才會持續往下走。


    如果在這時要轉換為上漲走勢，無論如何要先讓 60 日線突破 100 日線才行。60 日線要成功超越 100 日線，需要什麼條件呢？那就是往下走的 100 日線要「躺下來，持平」。


    那麼，要怎麼樣才能讓 100 日線躺下來呢？必須讓股價及 5 日線不再有大幅下跌，至少得在比最低價高一點的範圍內持續走平。'
