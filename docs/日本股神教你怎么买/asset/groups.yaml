    # 相場式訊號——

    「下半身」「反下半身」


    用均線作為買賣時機參考的理論中，最有名的就是「葛蘭威爾法則」，以及短期均線與長期均線交叉的「黃金交叉」與「死亡交叉」等。不過，聽到「葛蘭威爾」大多數人應該會只有「一頭霧水」的反應。而「黃金交叉」「死亡交叉」感覺也文謅謅的。


    取名字呢，最好是簡單易懂！


    因此，我將使用均線觀察到的各種買賣時機訊號，用相場式自創的名稱來稱呼，讓各位感覺更親切、更易懂，立刻就知道該怎麼運用。


    這些名稱都是我個人原創，如果各位在其他地方聽到，我保證一定是「抄襲」。'
