    ## 圖4-3 趨勢轉換與買賣方式


    ![](img/deba46b3116904b5339032f4dcd528a1_84_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_84_1.png)


    有些股價像「定價」一樣，價位完全動也不動，這種狀況下，股票投資永遠都不會賺。變化固然令人害怕，但股價要有變化才會賺也是事實。


    例如，20 日線朝上時，5 日線暫時跑到 20 日線的下方，就代表著股價逆著 20 天平均這條河的水流，想要朝著反方向（下跌）而去。


    相反地，要是疲於逆流而行，原本下跌的股價反彈上漲，就要注意。由於這一瞬間代表著股價朝著 20 日線的方向回歸，因此可以做出「買進」的判斷。


    在 20 日線朝上的時候，一般來說，5 日線會在 20 日線上方。20 日線在朝下的時候，一般來說，5 日線會在 20 日線下方。假如不是這樣，那就是變化的徵兆。像這樣學會光是看到均線的排列方式，就能察知股價走勢的持續或是變化，是很重要的。


    「20 日線朝上時，位置比它還高的 5 日線往下來到 20 日線附近之後，股價若強勢轉漲，漲破 5 日線的話，就買進」；「20 日線朝下時，位置比它還低的
    5 日線往上來到 20 日線附近之後，股價若失速下跌，跌破 5 日線的話，就賣出」（圖 4-3）。這些都是利用趨勢的買賣手法。


    ### 均線的「方向」與「排列方式」是獲利關鍵


    相反地，也有另一種手法是利用趨勢的轉換而趁機買賣股票的。「當股價與5日線往下穿過朝上的20日線，又持續再跌的話，就賣出」；「當股價與5日線往上穿過朝下的20日線，又持續再漲的話，就買進」。


    5日線與20日線一起上漲時，除非5日線先開始跌，否則20日線是不會跌的。由於均線是這樣子設計的，百分之百會如此。只要20日線維持朝上，在5日線暫時下跌又復漲時賭在買進上，是極其正確的做法。


    等到5日線朝著20日線的下方而去，20日線又轉為朝下時，再來考慮壓在賣出上，而非買進上。


    股票投資不用勉強逆勢操作，而是要輕鬆地看待事情，才會成功。


    > 藉由只鎖定在「均線」上，就能催生出不管誰來做，不管在哪種狀況下做，都能成功的「可重現性」。


    ## 第5章

    ## 了解何時該買賣的相場式訊號


    ### 相場式訊號——「下半身」「反下半身」


    用均線作為買賣時機參考的理論中，最有名的就是「葛蘭威爾法則」，以及短期均線與長期均線交叉的「黃金交叉」與「死亡交叉」等。不過，聽到「葛蘭威爾」大多數人應該會只有「一頭霧水」的反應。而「黃金交叉」「死亡交叉」感覺也文謅謅的。


    取名字呢，最好是簡單易懂！


    因此，我將使用均線觀察到的各種買賣時機訊號，用相場式自創的名稱來稱呼，讓各位感覺更親切、更易懂，立刻就知道該怎麼運用。


    這些名稱都是我個人原創，如果各位在其他地方聽到，我保證一定是「抄襲」。


    #### 5 了解何時買賣的相場式訊號


    在這一章裡，主要會介紹能夠掌握到股票初期變動的訊號。由於能夠「掌握到初期變動」，對於買進股票（或許也有人是從賣空進場）特別有益。


    首先要介紹的是，相場式股票投資的真諦，堪稱是精髓中的精髓，即為我稱作「下半身」「反下半身」的買賣訊號。


    這是 K 線和 5 日線交織出的特殊形狀，正如其名，出現於股價一舉突破 5 日線的時候。這也是股價波動上最為激情的瞬間。


    這好像是文學性的呈現，不過，若是以文字來表達這樣的線型，就會如下列所示：


    - ❶「5 日線持平或轉向上漲之處，被下方的紅線向上穿過，並且超過棒身的一半＝下半身完成」。

    - ❷「5 日線持平或轉向下跌之處，被上方的黑線朝下穿過，並且超過棒身的一半＝反下半身完成」。


    #### 圖 5-1 要加速上漲或下跌時最初的訊號


