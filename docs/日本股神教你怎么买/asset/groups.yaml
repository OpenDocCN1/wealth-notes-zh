    此時應該會發現接下來會再持續一波上漲行情吧！而出手買進。想要在上涨行情中爭取最大獲利，最重要的就是「在價格波動初期出手」。①正好就是上漲行情一開始的階段。


    不過，難道不能更早開始布局嗎？以這種角度來思考，回溯到更早的時間點來考慮的話，整體看來均線走平盤的B區，其實已經開始透露出「上漲行情的前兆」。


    要展開上漲行情，必須是先前的指數持平，或是下跌。這聽起來很理所当然。不過，價格變動的基本是「下跌→持平→上漲」，因此在即將上漲之前，絕大多數的狀況都是「先前下跌的指數轉為持平，來到再也
