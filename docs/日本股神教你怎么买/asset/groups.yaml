    重點是 5 日線與 20 日線兩者必須都呈漲勢（或跌勢），意即走勢要一致。若是 5 日線穿過持平的 20 日線，這種線型就不是「鳥嘴」了。


    不僅 5 日線，連 20 日線都上揚時，代表股價的漲勢已經很強勁。在上揚 20 日線下方的 5 日線，一度沉寂後接著又轉為上漲，形成尖銳的「鳥嘴」線型，氣宇軒昂地突破
    20 日線，代表了接下來的漲勢更為加速。


    鳥嘴線型會出現在持續上漲趨勢稍作休息後，回歸漲勢的瞬間。也會出現在股價跌到近期低點後再度強勢反彈上漲時。如果能及早搭上這波轉換趨勢，在漲勢一開始出現波動時就買進，大幅獲利根本不是夢。


    同樣地，當 20 日線轉為下跌，進入跌勢時，原先在 20 日線上方的 5 日線急速下跌出現「反鳥嘴」線型，則是代表強烈跌勢將加速的最初信號。


    ![](img/deba46b3116904b5339032f4dcd528a1_96_0.png)


    #### 了解何時該買賣的相場式訊號


    ### 鳥嘴與黃金交叉的差異


    說到這裡，或許會有些人感到失望，「結果那個什麼『鳥嘴』，不就是黃金交叉嗎？」就線型來說確實相同，但想法差異與涵義可大了。


    在相場式股票買賣法之中，隨時優先考量「觀察未來的未來」「預測下一步的再下一步」，緊盯著買賣的訊號。


    並不是等到鳥嘴線型出現後，才開始準備心想，「好吧，該買進了」。而是在這之前就要關注 K 線、5 日線以及 20 日線的走勢，「K 線這樣，5 日線這樣走，接近
    20 日線時就會出現『鳥嘴』線型。」類似這樣，也就是將重點放在「事先尋找快要形成鳥嘴線型的徵兆」。


    常聽到有人說，「當黃金交叉完成後，股價已經漲上去了，結果大多數情況下是訊號達成後就下跌。」


    如果自己是沒投入資金買這檔股票的評論家，當然可以馬後砲說「因為這裡是黃金交叉……」，但在實戰中，經常為時已晚。因此，相場式的做法會找出「鳥嘴」即將形成的前兆，建議及早做好準備。


