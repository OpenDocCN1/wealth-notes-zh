    ## 圖 7-8 進入上漲走勢後的買賣時機


    ![](img/deba46b3116904b5339032f4dcd528a1_166_0.png)


    在一度跌破 5 日線之後，強力反轉上漲超越 5 日線的紅線④和⑤，之後 5 日線與 20 日線同時強勢上漲，形成「高中生時間」的線型。這時候買進是明智的選擇。在第二次「分歧」（突破）完成的紅線⑥時，下手也可以。


    總之，當第一次進入上漲走勢之後，注意「分歧」「N 大」「高中生時間」這些訊號出現，同時觀察 K 線與 5 日線，當 K 線超越 5 日線就買進，光是持續這個模式就能確實獲利。


    反過來說，始終保持買進部位，直到出現「反下半身」或「7 日法則」看似大幅下跌之前，都還不能獲利了結（這時候需要耐性子），記得要盡可能提高獲利。


    ![](img/deba46b3116904b5339032f4dcd528a1_167_0.png)


    ## 何謂相場式買賣法的基本原則？


    相場式股票投資法，有時候不看 K 線，單純只以「均線」來推測股價的動向，判斷股票買賣的時機。


    話說回來，實際上真要下單買賣時，還是得要回來參考 K 線才行。包括 K 線突破 5 日線的「下半身」「反下半身」訊號，在股價碰到均線，或是超越、遠離時，都要以
    K 線的「線型」來做最後買賣的判斷，由此可知，K 線仍是重要依據。


    那麼，實戰上，要在何種時機下單交易呢？相場式的原則是盤中，也就是在股市進行買賣的交易時間中不做交易！


    在盤中反覆交易的當日沖銷方式，不適合那些整天要工作，忙著做家事、帶小孩的人。不在盤中交易，而以「收盤價」確定後看看收紅線或黑線，或是出現什麼樣的線型，好好思考，這就是相場式交易中很重要的關鍵。等到下午三點股市收盤（台灣則是下午一點三十分收盤），當天的
    K 線線型確定之後，才要來思考「要不要交易，要買進還是賣出」。


    意即，當天出現的 K 線是買賣訊號的關鍵所在，若等到隔日早上，很可能已漲上去，好不容易預測正確，卻又錯失獲利良機。


    近年來，不只可用電腦，還可用智慧型手機下載 App，不但能夠隨時掌握股價、看線圖，了解當天的 K 線線型，當然還能隨時隨地下單交易。使用手機交易的話，不管再怎麼忙碌，用三十秒時間看看股價和
    K 線，確認買賣訊號，再花三十秒下單，總共只要在廁所裡蹲上一分鐘，就能完成交易。


    沒辦法趕上廁所下單時，也可以使用「盤後交易」（等到收盤之後無論股價多少都買進或賣出）的方法，指定以當天收盤價來交易。即使沒以剛出爐熱騰騰的 K 線來交易，等到隔天早上一開盤，再開始交易也無妨。但是，由於前一天就出現了買進或賣出的訊號，相較之下，的確會比照訊號出現就立刻交易時錯失一小部分獲利，但實際上並不會相差太多。


    我通常一次下單都是二十萬股、三十萬股的大單交易，因此當我進場買進一檔新股或賣股出場，確定獲利等賣出時，多半是在成交量大的隔天早晨一開盤時。


    隔日交易的優點，就是有時間仔細研究。如果前一天在收盤時出現的訊號「貨真價實」，也就是「預料正確」的話，這個訊號不會隔了一夜就失效，請各位放心。將前面介紹的這些均線和
    K 線組合後的買進訊號（或是賣出訊號）融會貫通後，打造出一套適合自己的劇本來交易，更能提高投資的精確度。


    **總之，重點是自己要清楚了解到「為什麼要在這個時候交易」的原因**。


    「總之就是想賺點錢，就進場了。」這種理由可不行。除非能清楚明瞭說出像是「均線這樣走，K 線是這樣，因為所以我才決定買賣」，才能真正出手。正因為理由很明確，才會出現能夠進行下次交易的「可再現性」。


    ## 上談行情的教戰守則


    怎麼樣？相場式投資法與其他投資股票的書籍不同，針對該在什麼時候買賣？連下單的時機都毫不保留地傳授。


    要是對於真正投入資金交易時的具體進場方式隻字不提，只列出一大堆包著糖衣的紙上談兵，在實戰時根本派不上用場。會打戰爭遊戲，跟實際與敵人搏命對抗，是完全兩回事。


    ![](img/deba46b3116904b5339032f4dcd528a1_170_0.png)


    交易可挑選當天收盤之前，或是隔天早上一開盤時。重點在於自己能明確了解為何進出場，做這筆買賣交易的「理由」。


    # 第 8 章 下跌行情的救戰守則：放空最好賺！


    ## 股票就是反覆「上漲，持平，下跌」


    股價指數只會朝上漲、下跌或持平的某個方向動。換言之，持續上漲後，不是持平就是下跌；持平一陣子後就會上漲或下跌，下跌之後，又會持平或上漲。如果只顧著追逐眼前的價格變動，就會被搞得團團轉。沒辦法判斷出「接下來的動向」，在股票投資上便無法獲利。


    相場式的做法，把目標放在掌握「下一波再下一波的動向」，但至少要養成習慣，在目前持續的走勢中隨時思考「接下來會怎麼樣？」


    入門者有時會好運而瞌到，買進的股票強勢上漲，很容易開心到昏了頭，一心想著「還會繼續漲，絕對會再漲」。只是，令人難過的是股價不可能永遠上漲。即使是從五年、十年長時間觀察，持續長期走上漲行情的厲害個股，在上漲的過程中也會多次遇到「上漲→持平」這樣波段的變化。想要獲取更高的獲利，就必須敏銳察覺到這些細微變化。


    ![](img/deba46b3116904b5339032f4dcd528a1_174_0.png)


    這時，如果能了解代表股價的一生，價格變動的基本型就很方便。雖然未必百分之百依照這個模式，但一般來說，股價的變動都會有個「如果這樣，接下來就會那樣」或是「這樣之後，就會那樣」的基本走勢。這樣的變動就像圖
    8-1 呈現的「上漲→持平→下跌」的動向。


    要是用日本股市中上市的將近 3800 檔個股乘以過去 30 年份，也就是總計 10 萬年份的線圖，一一驗證價格變動的模式，等於回到石器時代人或長毛象生存的時代了！


    如果只知如何「買股票」，在股價變動時就只有在「上漲」進場時才能獲利。然而在「持平整理」的局面中，小幅震盪中的「上漲」雖然也不是沒辦法獲利，只是這對於入門者而言實在是非常困難。


    反過來說，如果能扎實建立「從股票賣出進場」的做空觀念，那麼在三種價格變動中的「下跌」局面也能精準獲利。


    這真的很重要。首先，再也不必每天求神拜佛祈求「股價漲吧，漲吧，往上漲」！如果能善加運用「放空」的做法，面對下跌的局面也能獲利，機會一下子就增加為兩倍。


    換句話說，只要上漲的話就「買進」，下跌時「放空」就行了。這麼一來，股價的任何變動都是賺錢機會，的確是將股市變成隨時都能提領現金的提款機。


    ## 放空股票更容易獲利的原因


    我有超過一半的交易是「放空」構成的。由此可知，從個人的喜好來說，比起買進我更是太愛放空投資標的了。「為什麼人會這麼想要買進股票？」這真的太深奧了。這麼富有哲學性的問題，答案究竟是甚麼呢？


    很簡單，「股票是為了賣出獲利而買進」。沒有人買股票是為了抱著股票進棺材，股票是為了賣出而買進。換句話說，百分之百確實會被賣掉。


    股票在何時會被買進，就連在股市裡打滾 36 年老資歷的我也摸不清。這跟在超市裡每天都有人買牛奶、白米的狀況很不一樣。股票「什麼時候有人買」，別說是專家，包括無論使用多精密的電腦來分析，也難得到結論。


    正因如此，賣出才比較容易獲利。人既然是為了賣出股票而買進，等到股價上漲、獲利了結之後，股價一定會下跌。要不是有很多投資人一時興起「想買股票」的想法，股價就不會上漲。想耐著性子等股票漲，有時候甚至得花上五年、十年的時間。簡直就像不小心打開寶盒的浦島太郎。


    這個趨勢在安倍經濟學行情之後，以年金資金買進股票的情形下，會更顯著。過去，我也在金融機構從事運用年金投資的工作，對此十分清楚。年金資金，代表著要是不賣出股票，就無法支付重要的年金。


    以一般年金基金正常的投資循環來說，買進股票之後大概經過五年，就必須一度將「資金變現」，用來支付年金。由於年金資金大規模投入股市已經快經過五年，差不多該是要賣出股票支付年金的時期。換言之，放空股票獲利的機會也隨之增加。


    ## 放空需要先開立「信用交易帳戶」


    不少入門者心中應該會有這樣的疑問吧。「要是手上沒有股票，該怎麼賣出獲利呢？」首先，就來說明一下所謂賣出手中沒有的持股，也就是「放空」是怎麼一回事。


    要在股市放空，趁著下跌時獲利，必須要在證券公司開設一個交易現股之外的「信用交易帳戶」。信用交易的制度，就是以「保證金」的方式在證券公司存入一筆資金，證券公司以這筆資金作為擔保，借貸投資人資金，可以進行價值大約保證金三倍的股票交易。在日本，一般來說保證金的最低金額為
    30 萬日圓（依證券公司而異）。


    站在投資人的立場，信用交易制度等於是向證金公司貸款來交易，要是交易之後損失擴大，就必須支付「追加保證金」，風險隨之提高，要先做好心理準備。


    只是，開立信用交易帳戶之後，不僅是能向證券公司（融資），也可以藉由證券金融公司（融券／借券）股票。在持股人之中，也有些持有證券金融公司的相關企業，或是相關的銀行、保險公司等等的股票，卻完全沒打算出售的長期投資人。以這些投資人的角度來說，將持股借給證券公司或證券金融公司，如果能再藉此賺些利息，也是令人樂見的事。


    一邊是想要售出股票獲利的投資人，另一邊則是想出借股票賺取利息的「長期投資人」。信用交易制度，就是為兩者的需求搭起橋樑。正因為有這樣的機制，交易者才能在手中沒有持股的狀況下借股票出售，也就是「放空」。


    ![](img/deba46b3116904b5339032f4dcd528a1_179_0.png)


    ## 能夠放空的只有「得融資融券交易股票」


    使用信用交易放空時，一開始是「賣出借來的股票，之後再買進回補」。因此，股價愈跌，你賺得愈多。


    比方說，在五百日圓時放空一千股，當股價跌到四百五十日圓的話，就獲利五萬日圓；相反地，要是股價上漲到五百五十日圓，就等於損失五萬日圓。


    不過，並不是所有股票都能放空。


    可以使用信用交易來放空的個股稱為「得融資融券交易股票」，在日本總共大約 3800 檔的股票中占了六成左右（如果是直接從證券公司借貸股票、資金來投資的「一般信用交易」，適用的個股範圍會比較大，但多數成本較高，因此不推薦）。


    ## 圖 8-2 下跌行情之前，一定會有一段持平整理


    ![](img/deba46b3116904b5339032f4dcd528a1_180_0.png)


    可以用來放空的這些「得融資融券交易股票」，當然就會成為相場式交易的標的。不過，這些個股中有些在一個交易日當中的成交量非常少，買賣困難，不易成交。因此，市值總價達五千億日圓，一天成交量最少在一百萬到兩百萬股，而且能夠放空的個股，就會成為相場式的「主菜」。


    了解到要挑戰放空前必須先開立信用交易帳戶之後，接下來說明關鍵的「那麼，該如何靠放空獲利呢？」的基本操作手法。


    圖 8-2 是日本雅虎大約十個月之中的價格變動線圖，看得出來，比起上漲的時期，①或②下跌的區段更能獲利。


    上漲的波段看似漲上來了，結果再次下跌，震盪得相當頻繁；但下跌的①和②拉出連續黑線，一路加速往下。


    看看 5 日線與 20 日線，兩者並排往下走的「高中生時間」比上漲局面維持得更久，連入門者也能非常輕鬆地靠賣出獲利。


    再進一步觀察，你會發現線圖上頻繁出現前面提過的價格變動模式，也就是「上漲後持平再下跌」，以及「下跌後持平再上漲」。


    初入門的投資人之所以會忍不住放空，而造成重大虧損，都是因為看到以不可能的速度急漲的個股後，認為「已經漲過頭，接下來一定會跌」而賣出。


    但價格變動基本上就是一再反覆「上漲之後持平再下跌」。要是能牢記這個原則，就會知道急漲的個股不會馬上下跌，哪怕只是短時間，上漲後會先有一段持平的走勢，要等到這段持平走勢確立後，再準備賣出而獲利。


    圖 8-2 也可看出，從上漲轉為持平之後，一定會出現灰色的「ㄇ字型」的價格變動，然後股價才開始下跌。換句話說，雖然股價上漲，在近期卻沒有締造新高，而是在同一個價格區段來來去去，呈持平走勢，這種個股就是容易以「放空」來獲利的類型。聽起來有點可憐，但操作起來差不多就像「打落水狗」一般。


    根據我多年經驗，上漲後持平的個股，之後會繼續上漲的有三成，下跌的約七成，就把目標鎖定在「下跌的那七成」個股。


    ## 該如何「預測下跌」？


    股價下跌之前，勢頭會變得愈來愈弱。以人類來比喻的話，就是先前很有精神，後來變得愈來愈虛弱，逐漸失去動力。最能看出「股價疲軟程度」的，就是 5 日線與 20
    日線。把前面圖 8-2 上的 K 線消去，只留下 5 日線和 20 日線，就成了圖 8-3。


    首先看到線圖中央的①，5 日線下跌，一度跌破 20 日線之後又上漲，呈現這樣的走勢。但 20 日線始終是上揚的動向。不過，這還不是再次下跌的前兆。這裡 5
    日線的下跌，是因為部分獲利了結的賣單，因此無論這一波漲勢多強，持續得再久，都是會自然發生的正常現象。


    接下來，到了②時 5 日線再次下跌，嘗試第二次觸及 20 日線。從第二次之後 5 日線可能跌破 20 日線，進入「下跌」的局面。這個概念最好能記住。


    ## 圖 8-3 20 日線持平，5 日線小幅震盪下準備賣出


    ![](img/deba46b3116904b5339032f4dcd528a1_184_0.png)


    不過，5 日線在這裡站穩腳步。「5 日線夾著持平的 20 日線，上下扭動，像蟲子一樣開始扭來扭去就進入平盤整理」，可以這種想法來分析局面。


    但到了線圖中的③，5 日線突然急漲，接著又暴跌。5 日線暴跌時 20 日線還在上漲，但既然 5 日線暴跌，20 日線的走向遲早也會由持平轉為下滑。如果能事先預測到這一點，代表你已經能獨當一面。


    5 日線與 20 日線在④交叉後，20 日線也如同預期轉為下跌。在這裡出現了相場式訊號——「反烏嘴」，是下單賣出的好時機。


    回顧一連串的股票動向會發現，要在下跌局面進場時，首先要察覺到股價走平。在股價走平之後，等到出現將開始下跌的徵兆後，便開始做放空的準備。然後緊盯著走勢，等待出現像④這種「反烏嘴」的買賣訊號。


    圖 8-4 是在圖 8-3 加入 K 線後的放大圖。


    在圖中的⑥連續拉出多根紅線，光看 K 線會覺得還會持續上漲，但其實就算連續出現紅 K，收盤價仍是下跌的。


    不過，要是看看先前只有 5 日線與 20 日線的線圖，就會知道股價已經從上漲轉為持平的局面，不會因為在此處看到紅線而上當。果然，到了②時 K 線跌破 5 日線，完成「反下半身」訊號。如果是我的話，在這裡就會早一步下單賣出。


    接下來到了⑤，連對 20 日線也出現了「反下半身」，5 日線與 20 日線形成「反烏嘴」，就連入門者也可以在這裡開始放空。


    ![](img/deba46b3116904b5339032f4dcd528a1_186_0.png)


    ## 圖 8-4 「反下半身」、「反烏嘴」訊號是最佳賣出訊號


    ![](img/deba46b3116904b5339032f4dcd528a1_186_1.png)


    之後的 K 線連續出現幾根黑線，先前做「放空」的話，此处就會大豐收。


    這裡要注意！從④的黑線往上算，到②的黑線是第七天。沒錯，以第 6 章說明過的「7 日法則」可知，此時可以做一次獲利了結。


    事實上，接下來的❄是一根短紅 K 線。不過，由於 5 日線與 20 日線的「高中生時間」還在持續中，繼續放空也無妨。雖然是結果論，但可以持續走到❈的長黑線，而荷包賺飽飽。


    接下來在❋、❋、❋的黑 K，對 5 日線也全是「反下半身」訊號，只要 20 日線持續下跌，賣出就是明智的選擇。來聽我的講座的多歲入門女性投資人說她擅長鎖定「反鳥嘴之後的分歧」，指的就是像❋的黑
    K 線。


    剛入門的投資人，可以在看到「反下半身」「反鳥嘴」的線型後，等到股價開始下降，賣出也無妨。不過，想要多賺一點、貪心一點、賺到進棺材的人，就要在開始下跌之前做好賣出的準備。


    ## 仔細觀察上漲之後的走勢變化


    再來看另一個例子。圖 8-5 是 LAWSON 的日線圖，在持續上漲很長一段時間後，股價漲不太上去，又經過一段很長的持平後轉為下跌。平盤維持了約長達三個月。從線圖看起來，之後回顧會發現下一個高點②並沒有創新高突破原先的最高價①，下一個低價④又跌破前一個低點③，大約從①到④這段時間都算是持平，期間達三個月。


    同樣都是平盤的行情，走平的時間愈長，之後下跌的幅度也愈大。為什麼會這樣呢？因為平盤行情持續得久，從 5 日線到 300 日線都會往同一個價格區段集中，即使是微幅下跌，也很容易造成股價或短期均線穿破到長期均線的下方。


    圖 8-5 也一樣，300 日線從下方逼近，一舉超越股價及短期均線。接下來股價下跌，完成了照「300 日線＞100 日線＞……＞5 日線＞股價」排列的 perfect
    下跌走勢。


    ## 圖 8-5 平盤行情愈久下跌愈劇烈


    ![](img/deba46b3116904b5339032f4dcd528a1_189_0.png)


    這個排列方式一旦完成，之後就很可能持續長期的下跌趨勢，即使和往常一樣賣出，也能賺取大幅價差。就跟水果一樣，也就是平盤行情成熟到了不能再熟的階段，最後落下來的下跌行情，還真美味。


    ## 圖 8-6 以忍法隱藏 K 線來觀察細微的變化


    ![](img/deba46b3116904b5339032f4dcd528a1_190_0.png)


    光看均線的話，不僅 5 日線，20 日線的高價③也沒有超越前一個高點①，而④的低價跌破了②的低價，能夠很清楚了解到，股價的動向是從上漲逐漸轉往下跌。


    ③的高點有點被 60 日線壓著頭的感覺。在⑤時 100 日線發揮了阻擋 20 日線上漲的功能。果然，在⑥和⑦時 5 日線、20 日線雙雙跌破 300 日線。這正是從平盤行情轉為下跌行情最初的訊號。接下來，5
    日線上漲到③的高價，成功碰到 300 日線後，說了句「不好意思～」又反轉下跌。到了這個地步，只能以「賣、賣、狂賣」來應對。


    ## 圖 8-7 頻繁出現「看似要下跌了卻又上漲」的模式


    ![](img/deba46b3116904b5339032f4dcd528a1_191_0.png)


    像這樣只看均線的話，20 日線碰到 60 日線後下跌，而 60 日線本身也反轉下跌到③時，應該就會想到，「啊，會從平盤轉為下跌吧」。沒錯，這就是「忍法・隱藏
    K 線之術」的效果。藉由消去 K 線，反倒容易看出股價的走勢變化，很能夠清楚的明白。


    圖 8-7 是前面圖 8-6 加上 K 線之後的線圖，看得出來股價本身也沒有創新高，而是持續下跌。


    雖然在①的時間點跌破了 300 日線，之後在 300 日線下方持續小幅高低震盪，卻沒有明顯下跌，讓人看了非常不耐煩。不過，「在維持這麼長一段時間的上漲和平盤行情後，很少會一口氣暴跌。大概會一度上漲，然後下跌，然後漲一波後才終於下跌。差不多這樣剛好。」


    事實上，只要看過大概一萬年份各檔個股的線圖，就可發現各種動向。「看似要往下跌，結果又漲上來」「感覺要上漲了卻又一度下跌」等等。


    圖中在②時股價一度漲破了 300 日線，但因為收一根長上影線的黑線，成了明顯的回落高峰。「上影線長的 K 線」是很強烈的下跌訊號。接下來，股價從②的高點急跌，跌破過去的低價帶③。

