    # 該如何解讀上漲行情


    對入門者來說，「股票投資就是買進」。買了股票之後，獲利來自於股價必須「上漲」。用 100 日圓買到的股票變成 101 日圓、102 日圓，不知不覺漲到 200
    日圓……股價要這樣上漲，是買股票獲利的必要條件。那麼，要在什麼狀況下股票才是「完美」上漲呢？


    就像前面看到的，K 線、均線的 5 日線、20 日線、60 日線、100 日線、300 日線全部上漲，而且 K 線 > 5 日線 > 20 日線……到 300
