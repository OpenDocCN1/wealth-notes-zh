    ## 前言


    ### 相場式的交易密技


    拿起這本書的你，或許是一位雖然從未投資過股票，心裡卻打定主意「既然都決定投資了，當然希望能夠獲利」的新手。


    應該也有些朋友是「雖然曾經投資過股票，但成果不是太好」，甚至於也有人「虧過大錢」，或是「其實現在我有些股票都還套牢在股市，無法停損」的人。


    我有些話要先向這樣的朋友們說：「歡迎來到相場師朗的股票世界。請各位放心！不用擔心。只要讀了這本書再多加練習，就能靠股票獲利到某種程度。」


    若是你問我「某種程度是到哪種程度？」我的答案應該是這樣的：


    「對相場師朗來說，某種程度就是一億日圓以上！」


    一講到「靠股票賺一億日圓」，各位或許會覺得是個遙不可及的遠大目標，但是和花式滑冰的羽生結弦選手一再創下四周跳加速，以及錦織圭選手在網球四大公開賽中拿下冠軍比起來，這還是很簡單的。


    只要能學會在股市裡持續獲利的「技術」，就能一直賺到死為止。


    「股市會成為一台隨時都能提領現金的自動櫃員機！」聽起來不是很美好呢？


    那麼，要如何才能股票投資上持續獲利呢？


    在本書當中，我，相場師朗，要把我的 36 年股票投資資歷中累積起來的精粹、精髓中的精髓，全都毫不保留地傳授給各位。


    為此，各位必須每天「練習、練習、再練習」，「鍛鍊、鍛鍊、再鍛鍊」。


    你或許會覺得「什麼啊，還要練習喔？」


    羽生結弦選手假如只用「口頭」告訴你怎麼在花式滑冰中跳躍，難道你就馬上可以跳出四周跳來嗎？


    錦織圭選手如果告訴你如何像他一樣單腳跳起來，以正手拍把對手時速兩百公里的發球打回去，你馬上能夠學會這樣的招式嗎？


    就算你腦中理解了，但是這和你實際做得到與否，完全是兩回事。就算你覺得自己懂了，你的身體還是無法照著自己的理解去動。


    要想把「懂」和「做得到」之間的落差補上，還是得靠「練習」。就像是壽司師傅拜師學藝後學會捏出厲害的壽司一樣。各位也得歷經鍛鍊再鍛鍊，持續練習的過程，才能成為獨當一面的「股票專家」。


    我能夠教給各位的，只有「如何藉由股票投資，持續而經常地獲利」而已。


    要是有人說「只要聽完我的話，你就能成為大富翁！」那他不是在瞎扯，就是想詐騙你。市面上充斥的股票書籍或雜誌，淨是談些「買這檔股票會賺」「只要使用這套必勝法，就一定能賺」之類的內容。一旦所列的個股退了燒，或是必勝法變得不適用於當下股市狀況時，馬上就會失效而行不通。


    但相場式的教導，不是臨時抱佛腳式的內容，而是講究於教你一生受用的「練習法」。


    「股票投資會獲利還是虧損，全看你怎麼練習。」拙劣的練習做再多，投資也不可能順利。在傑出的老師或教練的門下好好地一再練習，才是股票投資進步的祕訣。


    相場式的股價分析與股票買賣術十分獨特，是坊間那些「股票教科書」所缺乏的。不過，只要每天努力運用我祕傳的練習法，一再地練習、鍛鍊、實踐、反省，力求進步的話，在那之後，各位就能得到足以一再穩定地，看得見成果的「可重現性」。


    不是只有一次有成果而已，而是兩次、三次……不，只要各位能學會，不管重複再多次，都一樣能夠可靠股票投資獲利，習得「具有可重現性的技術」的話，就沒什麼好害怕了。


    各位可以靠股票賺來的錢，過上快樂、光明、幸福的人生。


    在本書中，我會注入我對於股票的愛，把「一生受用的股票教戰守則」教給各位！


    股票專家 相場師朗


    ### 從實戰交易磨練出來的職人魂


    我認同相場的理念，因為我也是這樣操作的。


    做股票和切高麗菜絲一樣，要不斷的練習，練習、練習、再練習。投資是一項技能，熟能生巧。相場分享他對股票操作的方法，從用均線判斷行情的方向，到用 K 線和型態找買賣點，到如何用部位操作賺錢，用加碼放大獲利、用多空對沖避險兼能抱住部位。這一切，都是有豐富實戰經驗人會說出的方法。在我的著作《順勢交易、贏在加碼》也不約而同地闡述相同的觀念和交易方法，讀者與投資人可用這樣的方法來交易股票，你也可以用這樣的方法來交易期貨和選擇權，交易各種衍生性金融商品，走上你的人生財富勝利大道。


    商品種類雖然不同，但「賺錢的道理」都相同。我們都可以單純的看線去操作。因為，不管是經濟面、消息面、基本面、籌碼面，所有影響行情漲跌的因素最後都反映在「價格」上。


    為什麼會長紅 K ？因為有人買進，為什麼會上漲？因為買的人比賣的人多。不管公司有任何好壞消息，總是有些聰明錢將會進場和出場，這些買賣行為終將反映於價格上。交易其實很單純，不問漲跌原因，只看價格操作。只要設法讓我們的部位跟上行情的腳步，行情上漲有多單，行情下跌有空單；跟反方向就會虧損，跟行情同方向，我們就獲利。輕鬆、自律的操作，盡心盡力當個「走勢」的跟班。市場會給你回報的。


    其次，我們要拿歷史線圖練習。在課堂上，我都會使用歷史線圖來教同學們，並模擬操作；我的觀念是，你若要做一檔股票，先練習看完這檔股票十年來的走勢圖。在模擬交易中，你要練習預測下一根K
    棒會怎麼走，練習判斷行情的方向，練習進場、設停損、練習移動停利。透過歷史行情的模擬練習，你可以在最短時間內「閱讀」大量的K 線，透過歷史K 線圖的練習，你會更了解對這檔股票的股性。股票像人一樣，是有個性的，每支股票股性不同，走勢和長相都不太一樣，這些練習一定會對你有幫助。


    交易無它，熟能生巧。誰練習的多，誰的反應迴路就快，誰就贏者全拿。同樣的動作練習一萬次，你就是專家，我跟相場師朗先生想對投資人說的都是同一句話：「上戰場之前，請先大量模擬練習。」


    接著，到市場實戰，把練習的各種技術運用在實戰上，此時，當損益發生，人性就浮現，擊敗大盤之前，你要練習打敗人性。因為透過模擬練習盤，你知道賺錢和賠錢的情況，你不容易一遇到挫折就大驚小怪，心理素質穩定，技術高超，你在千次、萬次的模擬交易中，對各種情況早已嫺熟，你要做的事是平常心看待，並且將你的訓練全用在交易場上。就像選手上場比賽一樣，做好準備，交易、檢討、形成自己的觀點和風格，找到最容易得分，最輕鬆獲利的方式。最後，你會發現，透過練習而來的獲利，會讓你感到快樂和滿足。


    知名暢銷書作家·專職交易者

    獨狐求敗


    ## 第 1 章

    買股就像切菜，勤練是不二法門


    ### 聰明不夠，持續練習才是王道


    這個社會上，充斥著「股票好可怕」「股票好危險」「一般人玩股票一定會虧錢」這樣的印象。


    應該也有很多朋友覺得，「股票這東西要看運氣」「再怎麼努力也賺不了多少的」「只有天才才可能靠股票賺一億日圓吧」。一般而言，人們在工作或讀書時，只要拚命努力去做，就能得到相當的成果。


    但在股票投資中，就算是頭腦好、高學歷、高年薪、高社會地位的人，都有可能三兩下就失敗，是一個「好可怕」的世界。據說，創辦現在 Panasonic 的松下幸之助先生曾說：「我也非常擔心，要是公司規模變大了，導致東大或京都大學或早稻田那些很會讀書，偏差值高的學生開始進我們公司服務，那該怎麼辦？」


    ![](img/deba46b3116904b5339032f4dcd528a1_20_0.png)


    原因在於：「頭腦好的人，一旦懂得基本知識後，馬上就會覺得自己已經全都懂了，就不再做練習，或是不再鍛鍊自己。結果等到實際上場做時，卻是什麼也做不出來」。股票投資就是這樣的世界。


    我認為頭腦好的人，不，自以為「頭腦很好」的人，絕對不可能進步！


    只要頭腦好，只要有知識，就自然而然能在大學入學考試得到成果，或是在公司裡出人頭地。但股票投資，完全是不一樣的世界。


    若要問它是個什麼樣的世界，其實就像壽司師傅，為了把壽司捏好而拜師學藝，或是像職業棒球選手每天跟著總教練或教練，磨練自己的球技一樣，是一個「職人的世界」。


    在股票世界裡「不斷摸索、反覆試驗」達 36 年的我，所抱持的論點是「投資股票是一種技術！」


    在股票世界裡，最重視的是「技巧」與「技術」，而不是知識與道理。為此，就只能「練習、練習、再練習」「鍛鍊、鍛鍊、再鍛鍊」了，別無他法。


    ### 股票投資的基本功就像切高麗菜絲


    我常在研討會中提起「切高麗菜絲」的事。


    我自己很不會切高麗菜絲，但如果有一所「切高麗菜絲」學校，學生在學會把高麗菜絲切好之前不准回家的話，我想大家一定會拚了命地去切高麗菜絲吧。


    不只是在腦中想如何切高麗菜絲比較好，而是實際切五百、一千顆高麗菜絲，讀過這本書的所有人，一定都能把高麗菜絲切得很棒吧。也就是說，要想成為身懷技術的職人，總之就是要擁有「實戰經驗」就對了。


    我的座右銘是「行動起來！天道酬勤！」


    一起床，已經在看顯示股價動向的「線圖」，分析股價變動型態了。上廁所也帶著筆電進去，一直不走出來，其實我是在裡面看線圖。


    正因為連吃飯的時候，洗澡的時候，晚上睡覺前，都一直在切高麗菜絲……不，都一直在持續使用線圖分析股價的動向，家人都覺得我「是不是有病」。不斷地研究再研究，我才得以變成一個能調動幾十億日圓資產的股票交易員。


    ### 思考要「窄而深」而非「廣而淺」


    ![](img/deba46b3116904b5339032f4dcd528a1_22_0.png)


    抱持耐心拚命努力，反覆不斷地練習，為了切身學到股票的投資技術與知識，遵循以下步驟是很重要的：


    - ①要大量練習

    - ②要深入思考

    - ③要多花心思


    首先，多看一些線圖就對了。多了解「原來那個時候是這樣變動的」，徹底把過去的股票變動型態記在腦子裡。


    這麼一來，就會開始有一些「發現」，像是「奇怪，這樣的股價變動型態，在別的地方也出現不少！」


    針對「發現」再深入思考後，就會促成「既然這樣，只要這麼做就能獲利」「進入這個波段後，勝率似乎會很高，不如就來研究一下進入該波段前不久的價格變動情形吧」之心態產生。


    假如想當個正牌的專家，或是大家稱之為大師般的職人，針對狹小的範圍逐步做深入的研究，也很重要。**即便是獲得諾貝爾獎的學者們也是如此，為了成為某個領域的專家，必須謹記著要走「窄而深」的路線。**


    也就是說，在股票投資中，不應該毫無篩選什麼都試，而應該只做「一件事」，不斷地做，徹底地鑽研才對。


    當然，一開始會不習慣，沒辦法做得很好，但只要同一件事重複做幾千次、幾萬次，就會慢慢變厲害。即使是已經喝到酩酊大醉，爸爸還是能夠找到回家的路。這是因為他已經「練習」過好幾千次「怎麼回家」了。


    ![](img/deba46b3116904b5339032f4dcd528a1_23_0.png)


    > 股票投資中，最忌光說不練。沒必要當個萬能的人。工具只要一種就夠，然後要在狹窄的範圍內，深入挖掘下去。


    職人固然也需要出色的「工具」，但並不表示手邊有很多工具的人，就一定能成為傑出的職人。


    為了把工具當成身體一部分般運用自如，工具的數量當然是愈少愈好。這一點在股票投資上也是一樣。我在股票投資中用到的工具，就只有「 K 線圖與均線」而已。


    就是這麼單純，單純到大家都驚訝地表示，「哇，只要那樣就夠了嗎？」


    ### 不要仰賴股票專家推薦個股


    在這個世界上，有數不清的股市評論家或投資顧問活動，他們會用「言詞」告訴我們「這麼做就會賺」「這檔股票絕對會漲」，卻沒有連如何持續賺下去的「股票練習法」也教給大家。


    市場上沒有百分之百必漲的個股，也沒有永遠持續漲不停的個股。


    即使如此，在雜誌或網絡上，卻還是有自稱是股票「專家」的人，向人家收取貴得嚇人的投資顧問費，再告訴你，他們推薦的個股。


    但他們的推薦個股卻是時中時不中，根本說不準；就算推薦個股暫時有利可圖，下次如何就很難說了。明明付了他們高額的投資顧問費，買進推薦個股後，卻虧了比投資顧問費還多的錢，這種「悲劇」一再重演。


    也就是說，一套投資方法，假如沒有伴隨著「具有可再現性的技術」，無法做到「不管任何個股出現任何價格變動，都照賺不誤！」而只是「這檔個股會漲」這種一次就沒了的「預言」或是「胡謊」之類
    的東西，那就稱不上是「正經」的手法了。


    這個世界上，到處充斥著「過去」在股票投資上有斬獲的人所傳授的「必勝法則」或「成功法則」。


    就算真的有「百分之百必賺的必勝法則」好了，想當然耳，所有投資人 都會想照著那套必勝法則去做，藉以獲利，因此這套必勝法則本身很快就會過氣，而變得不再適用了。


    股市行情是活的。「必勝法則」就算在某個上漲行情的某種狀況下能適用，等到轉為下跌行情，一定也會很快變成虧錢的「必敗法則」。也就是說，只要不是「不管在任何行情下都能獲利」，就稱不
    上是出色的投資手法。


    ### 相場式練習法的關鍵字是「3000 次」


    無論這個世界發生什麼事，股市基本上都是不會關閉或消失的。


    這樣來想的話，「無論在任何種行情下，任何個股都能獲利的技 術」，才是在股票投資中大家最想學的。這才是一生受用的股票教戰 守則。


    就算還年輕，存款還少，還是能透過股票投資累積資產。即使是 只有年金收入的高齡朋友，一旦有什麼狀況，只要買賣股票，就能確 保在年金之外還能夠有一筆額外收入——只要能學會這樣的技術，
    即使是在已經好幾十年都處於接近零利率時代的當代，也一樣能夠自 己守護自己。雖然過去大家都說「股票投資是不能保證有回報的世 界，不像只要努力就能通過大學入學考試，或是就能在公司裡出人头
    地那樣」，但這並不表示它是一個「努力與鍛鍊完全派不上用場的世 界」。在股票的世界裡，問題其實在於，諸如「推薦個股」或「必勝 法則」這樣的「錯誤努力」太過氾濫了。


    「靠股票賺錢確實並不輕鬆，但任何人都能透過不斷的練習，逐 漸能確實賺到錢。股票投資是一個只要努力就會有回報的世界。」


    讓各位能夠抱持著以上信念，並真的在股票投資上創造獲利—— 我的股票投資法，就是為此而存在的。


    首先，來介紹一下相場式股票投資練習法的第一個關鍵字。那就 是「3000 次！」

