    相場式交易要等到該日的K線完成才開始買賣。有時候也會等到隔天開盤價出現才開始，但只要在下午兩點半之後，一看到當天K線很可能形成「下半身」，在收盤前掛出限價單，以收盤價確買賣進，就能以「剛出爐熱呼呼」的狀態買進。


    「下半身」的規則就是一定要有紅線才行，因此，買點就會在當天K線（紅線）的上方。


    除非隔天的收盤價低於前一天的收盤價，否則就續抱買進部位。如同圖 10-3 所示，一旦出現黑線就獲利了結。不須太堅持鎖定一檔個股，多找幾檔安全的股票比較保險。另外，即使K線收了紅線，但當天的收盤價比前一天來得低時，我也建議可以先結算一波。


    在這一章的開頭已經提過，散彈槍投資法基本上就是「反覆短天期」的交易。紅線連續出現期間續抱，一旦收了黑線就賣出，如果當天收盤價低於前一天就賣出。只要僅記這些規則，進行單純的交易就沒問題！盤中不必緊盯著盤勢也無所謂，上班族也沒問題。不需要一看到股價波動，就提心吊膽或感到苦惱。'
