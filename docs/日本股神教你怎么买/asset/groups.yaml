    ## 一天一分鐘，以 100 檔個股為目標


    大多數朋友或許滿腦子都是問號吧。所謂「3000 次」，指的是各位至少要針對個股，看過去的價格變動軌跡 3000 次。


    例如，只要每天針對 100 檔個股，各花 1 分鐘時間，去看能夠顯示它們過去十年份價格變動軌跡的線圖，每天，十年乘以 100 檔個股，等於總共鳥瞰了「1000
    年份」的價格變動軌跡。只要持續 30 天，各 100 檔個股，乘起來等於累計看了 3000 檔個股、高達三萬年的分量！


    這樣等於回溯到舊石器時代，不，回溯到日本還有長毛象的時代去了！


    這就是「3000 次」代表的意思。


    相較於切高麗菜絲 1000 次，3000 次確實多了點。但是一開始只需要大略從頭到尾看過十年間的線圖就好，不會花太多心力。


    ### 鎖定成交量大的大型股


    職人需要的是「過去的經驗」。


    最近，在日本象棋界，14 歲的棋士藤井聰太創下破紀錄的 29 連勝，一躍成為當紅炸子雞。日本象棋是我另一個喜愛的「職人世界」。他們會觀看過去對弈的「棋譜」，磨練自己的技術。


    對股票投資而言，過去的股價線圖就相當於「棋譜」。任何人都可以去看，而且最近真正為投資人著想的股價線圖真的變多了。


    要是能夠帶著線圖，搭乘時光機回到過去，由於早已知道「答案」是什麼，別說是一億日圓了，就算是賺一兆日圓都不奇怪。


    雖然這個世界上還沒有時光機，但既然有「過去的線圖」這把「通往寶藏的鑰匙」，沒有理由不加以活用。


    因為，線圖當中出現的各種價格變動型態，今後還是會再出現與之類似的狀況。身為股票投資人，我們當然要藉此獲利。


    ### 1 買股就像切菜，勤練是不二法門


    那麼，應該找什麼樣的個股，看它的線圖 3000 次才好呢？什麼樣的線圖適合拿來練習呢？相場式股票投資法追求的是「無論在何種行情下，任何個股都能獲利」，但要想藉著股價的變動獲利，有一個大前提是，它必須是有許多投資人買賣的個股。


    價格變動不規則的個股，交易就沒有「可重現性」。所謂的「可重現性」就是指「一直都能做同樣的事」。而買賣很少成立，價格不太有變動的個股，或是突然急漲後又暴跌的個股，就屬此類。


    為此，相場式交易所鎖定的個股，是有「篩選標準」的。這標準是「總市值在 5000 億日圓以上，一天成交量在 200 萬*註股以上的個股」。


    所謂「總市值」是用「股價乘以已發行股票數」計算的。若把所有已發行股票都買下來，就等於把整家公司買下來了，所以總市值可以說就是「公司的價格」。


    > *註：台股股票以 1000 股為一張，不足一張的，視為零股。零股也可買賣或用於存股。 日本股市的 200 萬股，等於台灣股市一日 2000 張的成交量。


    總市值太小的話，就算只是少量交易，也會導致股價劇烈變動。總市值若達一定的規模，尋常的交易也不會造成股價劇烈震盪。當股價較為穩定時，就會變得很容易交易。


    所謂「成交量」是用於顯示交易量的數字，顯示的是該股在市場中被買賣了多少的量，成立了多少交易的量。一檔股票若有愈多投資人進行交易，等於買單賣單容易成立，隨時都能自由交易，也會變得更容易反映出市場整體意向。


    在股票投資當中，一切全看價格的變動。挑選價格變動穩定、容易從過去的價格變動結果，推未來動向的個股交易，可以說是在股市中持續獲利的必要條件。


    ### 大型股是相場式投資的主要目標


    總市值在 5000 億日圓以上的個股，在日本股市裡目前有 250 檔以上。


    以日本為例，即使是在股市不那麼熱絡的時期，成交量一天在 200 萬股以上的股票，也有約 200 檔左右。


    各國的主要交易市場有各自的規則和特色，但只要是「日經平均指數」或「日經 400 指數（正式名稱：JPX 日經指數 400）」等股票指數選用計算的成份股，交易永遠都源源不絕，股票的趨勢也因此變得容易理解。


    「日經平均指數」是由日本經濟新聞社選出 225 檔可以代表日本的個股，並將其股價動向指數化後所得出的資料。由於在每天的新聞報導中常被提到，我想聽過日經平均指數的人應該也不少。


    「日經 400 指數」是 2014 年起開始公開的新股價指數，它是根據「總市值與營業利益成長幅度」「是否善用股東投資的錢以創造足夠獲利」等標準，挑選出 400
    家優良企業，再把它們的股價化為指數。雖然是新出現的指數，但就連年金或機構投資人等投資專家也都加以認同。


    由於挑選的是業績暢旺，財務體質又良好的公司，我每天都會監看日經 400 指數，重視程度更甚於日經 225 指數。


    當個股的股價發生變動，出現「現在該買！現在該賣！」這樣的訊號時，我會選出 10 檔左右集中監看。其中有 4 到 5 檔個股我每天都會投資幾十萬股，穩健獲利。


    由於日經 400 指數的成份股，價格很容易呈現教科書上所教的那種變動，因此也很適合應用「相場式 3000 次練習法」。


    你可以選擇只看自己知道公司名的企業的股價圖表，也可以把重點放在投資金額較低，看起來易於買進的個股上，要怎麼挑選練習用的個股，都隨你開心！


    ### 看線圖的心態是很重要的


    至於要怎麼看圖表，我會從第 2 章開始說明。但基本上，請各位在看線圖時，設定優先看以一根 K 線代表一天價格變動的「日 K 線圖」，以及 5 日線、20 日線、60
    日線這三條均線，一般系統是設定為 5 日、25 日、75 日線，所以必須調整設定。


    圖表還另有以一根 K 線代表一星期價格變動狀況的「週線圖」，以及以一根 K 線代表一個月價格變動狀況的「月線圖」，但我们暫時只用日線圖就很夠了，因為光是這樣，就會是很可觀的練習量了。


    **在練習時，有一件事情很重要。那就是，充滿期待地去看這些圖表。要是不情願地去看的話，那就毫無意義了。**


    從過去線圖上的某個點為基準，在那之後走勢，對它來說算是「未來」。請各位就當成是自己搭著時光機回到過去「某個時間點」，一面以自己的想法想著「接著下來，行情會變成怎樣呢？」預測在那之後會有什麼樣的變化，並一面觀察實際上的狀況。以驚奇與好奇心的目光看待圖表是很重要的。


    只要反覆練習，光是得知「股價會超過這條均線！」「短期均線與長期均線的排列方式與動向會變成這樣！」之類的狀況，也能讓各位在今後自然而這對股價的變動了然於胸。


    股票投資的關鍵在於，能在腦中記住多少價格變動的模型。


    ![](img/deba46b3116904b5339032f4dcd528a1_34_0.png)


    > 相場式的股票投資練習法會找成交易多、頻繁有人買賣的個股。日經 400 指數成分股會主要標的！


    ## 第 2 章


    ### K 線圖是投資人情緒的集合體


    #### 一魚四吃的萬用 K 線


    這本書的動機，是要教各位一套能夠自由地把股市當成提款機一樣領出錢來的「功夫」，連左右都還搞不清楚的新手也能學會。學會如何觀看「K 線圖」，是投資人必須踏出的第一步。


    一日股價變動的變動 K 線是為了顯示股價的變動來而設計的圖表，可以一眼就能看出單純的折線圖，所看不出來的價格變動態勢。


    可以類比為喊一聲「好，開始！」的「開盤」，然後在一定期間內持續交易，稱為「盤中」，最後在一聲「好，結束！」之下結束交易，稱為「收盤」。在這種價格變動情境下，首先會產生兩個東西：


    - 交易開始時的價格

    - 交易結束時的價格


    #### K 線的紅線與黑線


    ◇當天（或是當週、當月）的「收盤價比開盤價高」的時候稱為


    **紅線**


    ![](img/deba46b3116904b5339032f4dcd528a1_38_0.png)


    ◇當天（或是當週、當月）的「收盤價比開盤價低」的時候稱為


    **黑線**


    ![](img/deba46b3116904b5339032f4dcd528a1_38_1.png)


    剛開始交易時的價格稱為「開盤價」，交易結束時的價格稱為「收盤價」。


    K 線分為白色棒身的「紅線」與黑色棒身的「黑線」。期間股價上漲時，也就是收盤價比開盤價高時，就以「紅線」顯示之；相反地，期間股價下跌，開盤價高於收盤價時，就用「黑線」顯示之。


    K 線光是看顏色，就能得知在這段期間，股價的上漲與下跌。


    K 線是以開盤價與收盤價為上下兩端的長方形，在棒身的上方與下方，又有兩條細細的線往外突出，它們稱之為「影線」，上方的「上影線」的最頂端，代表著這段期間當中的最高價，「下影線」的最底端，則是這段期間當中的最低價。


    這就是一根可以四吃的 K 線。


    光是粗略看一眼，就能在一瞬間得知：


    1. 這段期間當中，股價從多少錢開始？

    2. 股價漲到哪裡？

    3. 其後又跌到哪裡？

    4. 最後是股價以多少錢作收？


    一次看懂這樣的價格變動過程，真的是太划算了！


    讓我們一起愛上 K 線吧！就當成是在鑑賞畫展中的畫作般觀察 K 線，因為感動於它的姿態與形狀，而失神都沒關係。


    雖然我不是什麼宗教家，但是我卻經常覺得，「K 線是由諸多煩惱所構成的，」它可以鍛鍊我們的感性，它的形狀很性感，有時甚至還會懷抱情慾的想像。


    交易一開始，就一直線上漲的「長紅 K 線」，以及交易開始後，就一口氣暴跌的「長黑 K 線」，是最讓人煩惱的。當股價出現朝著一個方向變動的訊號時，就是該好撈一筆的時候了。


    ![](img/deba46b3116904b5339032f4dcd528a1_40_0.png)


    上影黑線出現在高股價區的燭形，代表著雖然努力漲到了最高點，但後續無力而失速，是行情下跌的前兆；反之，下影紅線則代表著雖然股價大跌，但已經止跌、大幅反彈的型態。出現在行情的低股價區時，就是反彈上漲的訊號。


    總之，股票交易的基本操作就是，根據每天變化的 K 線形狀，感受價格變動的強弱、解讀股價的走勢，再逐步安排如何買進與賣出。


    不過，K 線本身是很隨興的，可能黑線與紅線交互出現，讓人分辨不出「到底是上還是下」，或是時而如脫韁野馬般，時而歇斯底里，時而又有些神祕，變化無窮。


    而股票投資的使命就在於，如何巧妙地騎在脫韁野馬身上，買進時就看紅線，賣出時就看黑線，逐一善用。


    #### 為 K 線的價格變動構思故事


    首先重要的是，在看過各種線圖後，根據 K 線微妙的細微變化以及強弱、勢頭，設想一個故事來理解價格的變動。


    絕對做不得的事是「參考新聞」。我要教導各位的是「絕不要去當什麼評論家或是批評家！」


    在 K 線圖上，只要股價變動大，報紙或網路各種頻道就會大量釋出像是「由於美國就業統計數據出色，日經平均指數上涨了」這樣的新聞。


    對投資股票的人來說，他們最純粹的感想，應該會是「可以的話，真希望在前一天就告訴我這個新聞」吧。


    例如，某家企業就算公布了讓人眼睛為之一亮的出色財報數字，該企業的股價，仍可能漲，也可能跌。


    在新聞當中，可以把股價上漲解釋為「獲利出乎意外增加，股價急漲！」也可以把其股價下跌解釋為「投資人原本就預期業績會很好，現在題材出盡，股價暴跌！」但這完全是事後諸葛。股價每天都會漲漲跌跌，難不成每次的漲跌，都和公司業績變好或變差有關嗎？


    現在人工智慧很發達，已經進化到連日本象棋或圍棋高手都打不過的地步了。不過，就算使用再怎麼傑出的人工智慧，把外部的經濟狀況或特定公司的業績資訊輸入進去，還是沒辦法精準預測股價吧？


    #### 價格變動就是一切，愈多人買的股票愈會漲


    為何股價會變動呢？所謂的股價，有人買股就會漲，有人賣股就會跌。也就是說，股價是出於人類的情感、欲望或是盈虧得失這樣的「煩惱」而動起來的。


    一家業績再好的公司，它的股價也可能因為持有股份的投資人急需現金、大量賣股而暴跌。


    相反的，一家業績慘不忍睹的公司，只要有投資人堅信「今後，該公司的業績應該不會再更差了吧」而買進，要連續漲停也不是不可能。股價會因為「人類的欲望與情感」而變動。即使是極其擅長運算的人工智慧，目前尚無法預測股價，也是理所當然。例如，要預測雅虎今後的股價，其實沒有必要特地去看法報。該看的只有股價的變動狀況而已。


    #### 從線圖中解讀股價的走勢與行情強弱


    ![](img/deba46b3116904b5339032f4dcd528a1_45_0.png)


    解讀投資人的心理是最重要的。比如說：最近一星期，雅虎的股價若上漲，那就要思考「買盤似乎很強，要來賭在買進上了」。若還繼續漲，那就要去想，「在較為低檔時買進的投資人，也差不多要獲利了結了，股價似乎會暫時下跌……不然，來下個賣單好了」。


    在股價的背後湧動的買方與賣方的力道強弱，投資用語稱之為「供需」，股價的變動，百分之百就是供需造成的。


    想買進的人多，股價就漲。這時會出現想賣出的人，股價就會上下小幅震盪。賣股的人比買股的人多的話，股價就跌。就是這樣的狀況而已，非常的簡單。


    總之，別去想業績，別去想匯率，別去過度思考經濟環境。請專心觀察 K 線圖做股票交易就好。


    好的職人要有好的工具。而且，愈是出色的職人，持有的工具就愈少，就算只用一種工具，也一樣能夠創造出有如神蹟一般的成果。請相信線圖。從價格變動中學習，提高買賣的精確度，是通往成功的最短捷徑。


    ![](img/deba46b3116904b5339032f4dcd528a1_46_0.png)


    > 無須在意經濟指標及評論家的觀點。相關場式的手法是，只要徹底鑽研「線圖上的價格變動」，就能賺一輩子。


    ## 第 3 章


    ### 以移動平均線為作戰武器


    #### 只需要同線就能攻守有據


    缺「乏好工具，工作就做不好」——這是真理。身為股票投資專家的我在和難纏的股市交戰時，所持有的「武器」，也就是「工具」，就只有「均線」而已。


    **利用均線預測行情——這才是弔場式交易的精髓。**


    首先，為了新手朋友們，我來介紹一下移動平均線（均線）的機制。


    所謂移動平均線，正如「平均」一詞所顯示的，就是把每天在變動的股價的平均值，全都連在一起所構成的線，簡稱均線。


    均線既然是平均值，在此，就需要計算平均值的「期間」。


    ![](img/deba46b3116904b5339032f4dcd528a1_50_0.png)


    例如，在相場式股票投資法中，大家已經聽到耳朶都長繭的「5日線」，顯示的就是過去五天內股價的平均值。


    要計算均線的數值時，取用的股價只取當天的收盤價而已，不必去管 K 線所提供的四項資訊中的開盤價、最高價與最低價。


    ##### 圖 3-1 線圖變動劇烈，如脫韁野馬狀態的案例


    ![](img/deba46b3116904b5339032f4dcd528a1_51_0.png)


    若為 5 日線，只要把四天前的收盤價＋三天前的收盤價＋兩天前的收盤價＋一天前的收盤價＋當天收盤價，把這五個股價加起來，再除以期間天數 5，就能算出當天的 5
    日移動平均。隔天的 5 日移動平均，則要排除掉四天前的收盤價，以新產生的當天收盤價取代之，再除以 5 就能計算出來。


    像這樣每天計算 5 日移動平均，再連成一條線，就是 5 日線。


    均線不是只有 5 天的而已，也有些平均線是以再長一點的期間計算而得的。不過，在相場式手法中，會把 5 日線和 20 日線組合起來使用（細節將在第 4 章中解說）。


    均線的最大優點在於，它可以想像脫韁野馬般，由於人們的煩惱而激烈變動的股票所構成的 K 線動向，都匯總到一條簡單的線上。


    也就是說，均線所扮演的角色，就是要把分開來看時或漲或跌，動得教人眼花撩亂的 K 線的價格變動給「抽象化」。


    均線就是，從乍看之下像是亂無章法的股票變動當中，只抽取「精華」或「精髓」而得的東西。


    只要去看均線，就不會每每看到股價的變動就感到迷惑。


    來看個具體的例子吧。圖 3-1 是將某檔股票的價格變動，再加上 5 日線與 20 日線而得的圖。


    從 K 線看來，能得知有長黑 K 線頻繁出現，股價上下激烈震盪的情形。再仔細一看，畫面左側的①那個區塊處，股價一面劇烈震盪，一面大致持平推移後，雖然跌到②的最低價那裡，但從那裡開始，畫面右方的③那個區塊處，連續出現紅線，形成漲勢。


    ##### **圖 3-2 何謂忍法・K 線隱藏之術？**


    ![](img/deba46b3116904b5339032f4dcd528a1_53_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_53_1.png)


    #### 以移動平均線作為戰鬥武器


    不過，光是粗略一看，會發現價格變動太過劇烈，完全就是脫韁野馬的狀態。應該會「讓人摸不著頭緒」吧。


    「假如只看 K 線，股價是在漲沒錯，但中間又存在著劇烈震盪，很難掌握方向性」——很難理解吧！因此，就試著移除 K 線，試著只顯示出 5 日線與 20 日線（參見圖
    3-2。本書，均把「○○日均線」略稱為「○○日線」）。


    圖 3-2 是 5 日線急跌，一度反彈，但撞到 20 日線後再度下跌的情形。其後又反彈上漲，穿過 20 日線續漲。


    藉由把 K 線移除，就能像無人機那樣從高處鳥瞰，掌握股價變動的全貌——這正是均線的「俯瞰力」。


    只看均線，而不因為 K 線的價格變動而感到迷惑的話，正如圖 3-2 下方圖表所示，在①那一區時，股價一直跌，因此持續有人賣股。


    股價在②那一區處一度上漲後，受阻於 20 日線，再次開始下跌。因此，假如是也做融資融券交易的朋友；從這裡開始追加賣出。


    ③那一區處，5 日線轉為向上，其上方出現紅線時，可以買進。如上，可以做這樣的買賣判斷。這就是「忍法・K 線隱藏之術」（我剛剛才幫它取的名字）！


    這是其中一種使用均線的相場式股票投資術。


    #### 解讀股價走勢時，必做的事


    用均線的相場式分析法或是買賣時機訊息，會在後面第 4 至第 5 章介紹。但在此我就再多說明一下練習觀看圖表的流程吧。


    **練習時，K 線圖以及均線都要使用。**


    首先，在第 1 章也提到過，觀看幾千、幾萬張的圖表是很重要的。主要的練習法是，把到圖表最右側的部分，也就是在這段期間裡到時間最新的部分為止都顯示出來，然後逐步預測「隔天的股價（K
    線）會如何變動？」


    這時，充當「工具」的是，沿著股價移動的 5 日線與 20 日線的「排列方式」、趨向，以及與股價間的位置關係。


    例如，在圖 3-3 最左邊那張圖的時間點，股價穿過 5 日線上漲，但在漲到 20 日線處後失速。黑線跌破持平的 5 日線。


    ##### 圖 3-3 連環漫畫式未來預測法


    ![](img/deba46b3116904b5339032f4dcd528a1_57_0.png)


    好了，接下來會怎麼走呢？在圖 3-3 正中央那張圖的時間點下，①的那根 K 線出現，股價大跌。一般的想法是「股價一旦撞到往下的 20 日線而下跌，就會持續下跌」。

