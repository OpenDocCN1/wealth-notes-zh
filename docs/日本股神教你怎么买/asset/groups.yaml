    ## 圖 3-5 作弊察看未來，做「穿鑿附會練習」


    ![](img/deba46b3116904b5339032f4dcd528a1_65_0.png)


    這和把過去的圖表中未來的部分隱藏起來，再去預測隱藏起來的部分會發生什麼事相反，而是先去看過去圖表中的所有「結果」之後，再回頭來試著揣想「為什麼會發生那種結果呢？」


    我稱之為「穿鑿附會練習」。這個詞語「穿鑿附會」，難免給人一種負面的感受，但請各位安心。這種穿鑿附會只不過是要在察看圖表後，找出「真可惜，當時要是是在這裡買進的話就大賺了」那種「早知如此」的時間點，再找出在那個時間點應該進行交易的原因，不過是在訓練絞盡腦汁的思考而已。


    在穿鑿附會練習當中，除了 5 日線和 20 日線外，也可以把 60 日線、100 日線等長期均線也全都顯示。在相同式的訓練法當中，會要大家觀察不同期間的均線方向，以及它們和K線之間的關係，逐步培養觀看行情的眼光（參見第
    68 頁，圖 3-5）。


    例如，第 64 頁的圖 3-5 左邊部分，固然是由持平轉上漲的狀況，但和前面的圖 3-4 一樣，也是一個「第二次上漲」的型態。


    在①的紅線處會讓人想要買進，但在這裡買進的話，接下來的長黑K線處可就要吃大虧了。「畢竟是 5 日線往右下走的狀況，K線就算以紅線漲破 5 日線，也很難就這樣再漲下去吧」。由於結果已知，就能夠這樣子去思考了。


    「那我在一根K線的點可以買進呢？」像這樣進一步假設，等到②的紅線出來，K線不但漲破 5 日線、20 日線，連 100 日線也漲破，強勢上漲之類地方，應該就會想到「如果是我，我那時一定會買進的吧，這樣等到後面急漲時，至少就可以賺個一百萬了吧？」


    在上漲的過程中，③的黑線處，股價暫時大幅跌破 5 日線。此時要做出「賣出」的判斷固然可行，但也可以刻意試著想想看「有沒有在此繼續買進，不先獲利了結的理由呢？」


    這麼想的話，應該會察覺到「因為 5 日線、20 日線、60 日線、100 日線全都往上」這樣的「答案」吧。由於已經知道結果，要找答案也容易。


    在圖 3-5 的右側部分，一直不時有一些零星的下跌狀況。


    「K線在此變成長黑K線，因此在 5 日線跌破 20 日線的④那裡賣出才是正解吧。其後，撞到往上的 60 日線，出現⑤的紅線時獲利了結。這種事真簡單。」反正都已經知道結果了，只是在穿鑿附會，所以話可以講得滿一點。


    「其後，在⑥的黑線處再次賣出。由於是向下的 20 日線撞K線，而且還在跌，所以是個很好發現的賣出點。」像這樣享受打如意算盤的樂趣，就能自然而然地把股價變動的型態記到腦子裡了。


    ## 學會推敲「變成那樣的話，再來就會變成這樣」


    回顧了過去的圖表，把股價的動向故事化，接著把圖表的右半邊像「連環漫畫」般隱藏起來，試著逐一預測接下來的股價會如何變動。


    接著我們藉由觀看已成過去的圖表，以「穿鑿附會練習」試著想像在「當時要是買進，早就賺了」的狀況下買進股票，且實際在股價上漲後賺到錢的情形。


    做過 3000 次這樣的訓練後，由於股價變動有其型態，只要套用型態思考，就能漸漸懂得如何解讀未來。


    我已經提過好幾次，重要的是，不要只練習一下就自以為是，覺得自己「已經搞懂了」。在你實際投入資金之前，一而再、再而三地不斷「練習、練習、再練習」「訓練、訓練、再訓練」，是很重要的。


    例如，像圖 3-6。均線的 5 日線與 20 日線，一開始二者都往上，後來 5 日線暫時下跌到靠近 20 日線，又再次轉為往上後，就一直上漲，所以買進。


    ![](img/deba46b3116904b5339032f4dcd528a1_69_0.png)


    若檢視累計一萬年份的各種個股的圖表，看看是否有這種型態的存在，應該就能把「變成那樣的話，再來就會變這樣」的各種型態，深深刻印在腦海中。像是「5日線再次轉為上漲時，若出現紅線，急漲的機率就會變高呢」，或是「5日線靠近20日線兩次，會比只靠近一次更容易形成大行情呢」等等。


    總之，股票投資需要的是，在腦中建立「如果那樣的話，再來就會變這樣！」「變成這樣的話，接下來就會變那樣！」之類的迴路。


    ## 成長就是擴大優勢、克服弱點


    例如，假設在看過某檔股票的圖表後，你正在思考該在哪個時間點買進才好。這時出現了一根黑線，你「啊」的一聲，恍然大悟。


    這個「啊」的一聲就是重點所在。


    「原來如此！我懂了。你（對於股價變動）的感覺，就是會從這裡開始下跌對吧？」要把這樣的預測說給自己聽。


    對自己說了幾千次之後，腦中就會形成「迴路」，你就會學到，在這種黑線出現後，股價往往就會開始跌，而講出「啊，我已經懂了，我懂了」。


    等到那時，以我而言，只要有一支智慧型手機在手，再連上證券公司的帳戶，就能光靠滑手機，一個月賺一億日圓。


    以移動平均線為作戰武器


    已經不必再用電腦的大螢幕逐一檢視圖表了，只要用智慧型手機得知股價的變動，就能清楚看穿接下來的走向。


    因為，腦海中已經確確實實建立了「迴路」了。


    例如，我想請各位試著看看各類大型股30年份的圖表。


    只要持續做「解讀」「連環漫畫」「穿鑿附會」等練習，就能了解到自己的優點與弱點，即使尚未投入資金交易也一樣。


    等到建立起確切的自信，覺得「假如是這樣的狀況，那我已經能預測到如此的精確度了」之後，就可以等自己擅長的項目出現在圖表上，展開股票投資的實戰。


    但另一方面，有意識地正視自己的弱點，也是很重要的。像是「一旦碰到這種狀況，預測就容易不準。」


    在這樣的狀況下，就不進行實際交易，而是繼續多加練習，找尋克服弱點的方法。只要再多練習，不但能克服弱點，還能夠再發現到要處理的新課題。


    有弱點，那就克服它就好了。只要持續此一流程十年，應該就能變成技術穩定、能獨當一面的專業股票投資人。


    > 透過不斷的練習，等到出現自己特別有自信的型態，就來進入實戰！此外也要多努力克服弱點！


    ## 第4章 均線的「方向」與「排列方式」是獲利關鍵


    ### 5種常用的相場式「均線」


    與其近看，還不如從某種程度上較遠的地方看事情，還看得較清楚些。


    股價漲漲跌跌，時而劇烈震盪，時而呈現複雜的變動，但是卻有「飛行工具」可以像無人機那樣，從高處俯瞰。「**均線**」就是這樣的**工具，它也是相場式股票投資法中不可或缺的武器**。


    就像壽司師傅全心貫注在生魚片菜刀上，或職棒選手感謝棒球手套一樣，我們也要多加演練「均線」這工具，將它愈磨愈利。


    **要使用的均線至少有五種**。


    首先是「5日線」。股市於週一至週五進行交易，一共五天。而5日線是一條把「一星期」這個段落的股價平均值連結起來的線，因此是把短期的股價變動給抽象化，是極其重要的線。


    ### 均線的「方向」與「排列方式」是獲利關鍵


    **相場式均線重點在日線！**


    | 一般的日線圖 | 相場式的日線圖是這樣的期間！ | 週線圖 | 月線圖 |

    | :--- | :--- | :--- | :--- |

    | 5日 | 5日 | 13週 | 9月 |

    | 25日 在星期六也交易的時代，25個交易日＝約1個月 | 20日 (約1個月) | 26週 (約半年) | 24月 (2年) |

    | 75日 在星期六也交易的時代，75個交易日＝約3個月 | 60日 (約3個月) | 52週 (約1年) | 65月 (約5年) |

    | 100日 在星期六也交易的時代，100個交易日＝約4個月 | 100日 (約5個月) | 78週 (約1年半) | 84月 (7年) |

    | 200日 在星期六也交易的時代，200個交易日＝約8個月 | 300日 (約15個月) | 100週 (約2年) | 100月 (約8年3個月) |


    接著是一個月。除了星期六日外，一個月的交易日約為 20 天，因此若要顯示一個月間股價變動的平均值，「 20 日線」會是一條必須重視的線。


    在相場式股票投資中，星期六休息，所以要使用 20 日線。


    接著是三個月。這是一年的四分之一，若以季度決算來說的話，相當於「一季」，時間長度來說是中期，而「 60 日線」正可用於了解這樣的中型趨勢。一般使用 75 日線比較多，但相場式重視的是「
    60 日」（約莫是三個月）。


    「 100 日線」約為五個月，「 300 日線」則約為十五個月的股價變動之平均值。雖然剛好是一個大段落的三位數期間，但這是用來顯示長期股價走向的線。


    均線也可以看成是在那段期間裡，投資人買賣該股票的「平均買賣成本」。5 日線代表一星期，20 日線代表一個月，60 日線代表三個月，100 日線代表五個月，300
    日線代表十五個月不同期間的「成本線」。


    ### 均線最最重要的是「方向」


    股價的大走勢，會用「趨勢」表示。在英文中，這個字代表著「潮流」或「河的水流」，但均線，其實正代表著各段期間內股價的趨勢。


    各位實際做看看就會知道，逆著河的水流方向游泳，是極其費力的事。逆勢游泳是非常辛苦的。


    反之，若是順著水流的方向游泳，就能輕鬆快樂地游了。不過，像鮭魚要產卵時，會在自己出生的故鄉河裡捨命地逆流而上，這或許才是生物的本能也說不定。股票投資也是這樣，順著趨勢就能輕鬆賺，逆著趨勢就容易吃大苦頭。


    股價會乘著均線這條河的水流，也因為多半會向著和水流相同的方向走，因此順著均線顯示的趨勢走向進行買賣，就成了股票投資的基本做法。


    #### 圖 4-1 股價基本上會沿著均線的方向動


    均線的「方向」最重要


    「往上」則處於上漲趨勢


    ![](img/deba46b3116904b5339032f4dcd528a1_79_0.png)


    「往下」則處於下跌趨勢


    ![](img/deba46b3116904b5339032f4dcd528a1_79_1.png)


    均線的「方向」與「排列方式」是獲利關鍵


    這稱為「跟隨趨勢」，但股票只要看均線的「方向」與「斜率」「排列方式」，就能得知股價的趨勢。


    均線最重要的是「方向」。


    股價這種東西，不是漲就是跌，再不然就是持平，沒有別的了。顯示出股價變動狀況的圖表，縱軸是股價，橫軸是時間。因此在圖表上，不是往上漲，就是往下跌，再不然就是往橫向走，只會是這三個方向之一。


    當均線往上時，代表著這段期間股價的平均值一天比一天愈來愈高。


    例如，今天的收盤價比 5 天前的收盤價還高，今天的 5 日移動平均，就會比昨天的 5 日移動平均要來得高，5 日線是往上的。


    再接下來，只要明天的收盤價比 4 天前的收盤價高、後天的收盤價比 3 天前的收盤價高……像這樣當天的股價比 5 天前的收盤價高的話，5 日線的方向就能維持往上。


    假如目前的股價和 5 天前比起來是急漲的，5 日線的角度會變陡，本來平緩往上的話，其角度及斜率也會隨之改變。


    無論多長期間的均線都一樣，均線的「角度」代表著上漲或下跌幅度及加速程度。


    由於股價由諸多煩惱構成的，如脫韁野馬般漲漲跌跌，但大走勢是無法違逆的。


    假如股價是小孩，那麼均線就是媽媽。正如小孩回到媽媽那裡一樣，股價會有被均線吸過去的傾向。因此，「只要均線朝上，整體是走漲的話，就算股價暫時下跌，過一陣子又會再復漲」；反之，「當均線朝下，整體走跌的話，就算股價暫時上漲，過一陣子往往又會復跌。（圖
    4-1）」


    以上是均線的基本觀察與使用方式。


    ### 注意均線的排列方式


    均線是特定期間的平均值，但股價是不斷朝著未來而動的，因此期間較短的均線，會比較容易因為反映出股價的變動，而受到股價的影響。只要股價持續上漲，最先受到帶動而方向朝上的會是
    5 日線，接著是 20 日線，其後是 60 日線、100 日線、300 日線，依序反映了股價的變動。


    ![](img/deba46b3116904b5339032f4dcd528a1_82_0.png)


    均線的「方向」與「排列方式」是獲利關鍵


    也就是說，股價長期持續上漲時，均線的排列，由上而下的順序會是股價→5 日線→20 日線→60 日線→100 日線→300 日線這樣的次序，若持續下跌，則是相反的順序。


    例如，來思考一下 20 日線朝上的狀況看看。


    20 日線朝上的意思是，20 天期間的股價平均值不斷上漲。也就是最近的股價一直都在漲的意思。


    這樣的話，比 20 日線還更容易受到股價影響的 5 日線，理當會漲得比 20 日線還更為朝上。再從均線的特性來看，以下的描述是成立的。


    - 當 20 日線朝上時，5 日線必定位於 20 日線的上方

    - 當 20 日線朝下時，5 日線必定位於 20 日線的下方


    當然，股價一變化，也有可能明明 20 日線還是往上的，5 日線卻跑到了它的下面，或是當 20 日線朝下時，5 日線卻跳到了它的上面（圖 4-2）。


    其實，「排列方式」出現這種變化時，正是絕佳的賺錢之時。


