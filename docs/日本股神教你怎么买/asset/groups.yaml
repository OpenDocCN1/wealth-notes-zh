    # 得知名時該買賣的相場式訊號


    節錄一段曾經參加過我的講座，就此認識股票投資的一投資人的來信內容：


    > 我已經將「N大」還有「鳥嘴」及「下半身」和其他變形組合成最強的絕技。這兩個月來大獲全勝。


    真是厲害啊！真不愧是 我的徒弟！協助我舉辦講座的一名女性工作人員，是個「菜鳥級」的新手，但連她也像隻小雛鳥眉飛色舞說著：


