    ## 圖4-3 趨勢轉換與買賣方式


    ![](img/deba46b3116904b5339032f4dcd528a1_84_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_84_1.png)


    有些股價像「定價」一樣，價位完全動也不動，這種狀況下，股票投資永遠都不會賺。變化固然令人害怕，但股價要有變化才會賺也是事實。


    例如，20 日線朝上時，5 日線暫時跑到 20 日線的下方，就代表著股價逆著 20 天平均這條河的水流，想要朝著反方向（下跌）而去。


    相反地，要是疲於逆流而行，原本下跌的股價反彈上漲，就要注意。由於這一瞬間代表著股價朝著 20 日線的方向回歸，因此可以做出「買進」的判斷。


    在 20 日線朝上的時候，一般來說，5 日線會在 20 日線上方。20 日線在朝下的時候，一般來說，5 日線會在 20 日線下方。假如不是這樣，那就是變化的徵兆。像這樣學會光是看到均線的排列方式，就能察知股價走勢的持續或是變化，是很重要的。


    「20 日線朝上時，位置比它還高的 5 日線往下來到 20 日線附近之後，股價若強勢轉漲，漲破 5 日線的話，就買進」；「20 日線朝下時，位置比它還低的
    5 日線往上來到 20 日線附近之後，股價若失速下跌，跌破 5 日線的話，就賣出」（圖 4-3）。這些都是利用趨勢的買賣手法。


    ### 均線的「方向」與「排列方式」是獲利關鍵


    相反地，也有另一種手法是利用趨勢的轉換而趁機買賣股票的。「當股價與5日線往下穿過朝上的20日線，又持續再跌的話，就賣出」；「當股價與5日線往上穿過朝下的20日線，又持續再漲的話，就買進」。


    5日線與20日線一起上漲時，除非5日線先開始跌，否則20日線是不會跌的。由於均線是這樣子設計的，百分之百會如此。只要20日線維持朝上，在5日線暫時下跌又復漲時賭在買進上，是極其正確的做法。


    等到5日線朝著20日線的下方而去，20日線又轉為朝下時，再來考慮壓在賣出上，而非買進上。


    股票投資不用勉強逆勢操作，而是要輕鬆地看待事情，才會成功。


    > 藉由只鎖定在「均線」上，就能催生出不管誰來做，不管在哪種狀況下做，都能成功的「可重現性」。


    ## 第5章

    ## 了解何時該買賣的相場式訊號


    ### 相場式訊號——「下半身」「反下半身」


    用均線作為買賣時機參考的理論中，最有名的就是「葛蘭威爾法則」，以及短期均線與長期均線交叉的「黃金交叉」與「死亡交叉」等。不過，聽到「葛蘭威爾」大多數人應該會只有「一頭霧水」的反應。而「黃金交叉」「死亡交叉」感覺也文謅謅的。


    取名字呢，最好是簡單易懂！


    因此，我將使用均線觀察到的各種買賣時機訊號，用相場式自創的名稱來稱呼，讓各位感覺更親切、更易懂，立刻就知道該怎麼運用。


    這些名稱都是我個人原創，如果各位在其他地方聽到，我保證一定是「抄襲」。


    #### 5 了解何時買賣的相場式訊號


    在這一章裡，主要會介紹能夠掌握到股票初期變動的訊號。由於能夠「掌握到初期變動」，對於買進股票（或許也有人是從賣空進場）特別有益。


    首先要介紹的是，相場式股票投資的真諦，堪稱是精髓中的精髓，即為我稱作「下半身」「反下半身」的買賣訊號。


    這是 K 線和 5 日線交織出的特殊形狀，正如其名，出現於股價一舉突破 5 日線的時候。這也是股價波動上最為激情的瞬間。


    這好像是文學性的呈現，不過，若是以文字來表達這樣的線型，就會如下列所示：


    - ❶「5 日線持平或轉向上漲之處，被下方的紅線向上穿過，並且超過棒身的一半＝下半身完成」。

    - ❷「5 日線持平或轉向下跌之處，被上方的黑線朝下穿過，並且超過棒身的一半＝反下半身完成」。


    #### 圖 5-1 要加速上漲或下跌時最初的訊號


    **下半身** 看到加速上漲訊號就買進！


    ![](img/deba46b3116904b5339032f4dcd528a1_91_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_91_1.png)


    **反下半身** 看到加速下跌訊號就賣出！


    ![](img/deba46b3116904b5339032f4dcd528a1_91_2.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_91_3.png)


    #### 5 了解何時該買賣的相場式訊號


    至於為什麼不把②稱為上半身，而要叫反下半身呢？原因可能只是相場式特別愛強調下半身而已（笑）。下半身、反下半身是能夠簡單了解並掌握到股價初期變動的重要訊號。也就是說從古至今東西方的線圖中不斷出現「買進時機」、「賣出時機」的決定關鍵。


    根據我自己 36 年的股票投資經驗，當 5 日線上揚時，紅線有超過一半冒出头呈現「精神飽滿」的「下半身」時，幾乎都會持續上漲好幾天。


    > 反過來說，「反下半身」是在 5 日線下跌時，黑線有超過一半在下方的線型。一出現這個訊號，就能判斷還會持續下跌幾天，或至少漲勢稍休維持平盤。


    圖 5-1 介紹概念圖與實例，請各位一定要牢牢記住。除了下半身、反下半身之外，K 線發出的訊息還有「持續下跌後的長下影線紅線」代表要轉為上漲行情，及「漲勢持續後的長上影線黑線」代表要轉為跌勢等等。將這些一併記下來，總會有派上用場的時候。


    ### 探討走勢持續的信號「鳥嘴」


    接下來是用傳家寶刀「均線」實作的相場式投資法基本訊號之二——「鳥嘴」。這是以短期與長期均線交織出的線型，用來當作買賣的依據，但即使連入門者也很容易發現。


    「鳥嘴」出現在走勢要出現重大轉變之前，類似「黃金交叉」或「死亡交叉」。


    - ①在下方往上揚的5日線突破上漲的20日線，形成「鳥嘴」的線型，就是要轉為漲勢的訊號，應該進場。

    - ②在上方往下跌的5日線跌破下滑的20日線，形成「反鳥嘴」的線型，就是要轉為跌勢的訊號，應該賣出。


    根據線型做出這樣的判斷（圖 5-2）。


    #### 5 了解何時該買賣的相場式訊號


    #### 圖 5-2 加速&轉換走勢的完成訊號


    **鳥嘴**


    看到加速上漲或轉換走勢的訊號，買進！


    ![](img/deba46b3116904b5339032f4dcd528a1_94_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_94_1.png)


    **反鳥嘴**


    看到加速下跌或轉換走勢的訊號，賣出！


    ![](img/deba46b3116904b5339032f4dcd528a1_94_2.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_94_3.png)


    重點是 5 日線與 20 日線兩者必須都呈漲勢（或跌勢），意即走勢要一致。若是 5 日線穿過持平的 20 日線，這種線型就不是「鳥嘴」了。


    不僅 5 日線，連 20 日線都上揚時，代表股價的漲勢已經很強勁。在上揚 20 日線下方的 5 日線，一度沉寂後接著又轉為上漲，形成尖銳的「鳥嘴」線型，氣宇軒昂地突破
    20 日線，代表了接下來的漲勢更為加速。


    鳥嘴線型會出現在持續上漲趨勢稍作休息後，回歸漲勢的瞬間。也會出現在股價跌到近期低點後再度強勢反彈上漲時。如果能及早搭上這波轉換趨勢，在漲勢一開始出現波動時就買進，大幅獲利根本不是夢。


    同樣地，當 20 日線轉為下跌，進入跌勢時，原先在 20 日線上方的 5 日線急速下跌出現「反鳥嘴」線型，則是代表強烈跌勢將加速的最初信號。


    ![](img/deba46b3116904b5339032f4dcd528a1_96_0.png)


    #### 了解何時該買賣的相場式訊號


    ### 鳥嘴與黃金交叉的差異


    說到這裡，或許會有些人感到失望，「結果那個什麼『鳥嘴』，不就是黃金交叉嗎？」就線型來說確實相同，但想法差異與涵義可大了。


    在相場式股票買賣法之中，隨時優先考量「觀察未來的未來」「預測下一步的再下一步」，緊盯著買賣的訊號。


    並不是等到鳥嘴線型出現後，才開始準備心想，「好吧，該買進了」。而是在這之前就要關注 K 線、5 日線以及 20 日線的走勢，「K 線這樣，5 日線這樣走，接近
    20 日線時就會出現『鳥嘴』線型。」類似這樣，也就是將重點放在「事先尋找快要形成鳥嘴線型的徵兆」。


    常聽到有人說，「當黃金交叉完成後，股價已經漲上去了，結果大多數情況下是訊號達成後就下跌。」


    如果自己是沒投入資金買這檔股票的評論家，當然可以馬後砲說「因為這裡是黃金交叉……」，但在實戰中，經常為時已晚。因此，相場式的做法會找出「鳥嘴」即將形成的前兆，建議及早做好準備。


    #### 圖 5-3 預測鳥嘴即將形成的技巧


    ![](img/deba46b3116904b5339032f4dcd528a1_97_0.png)


    請看圖 5-3 左側到中央的這段線圖。


    股價雖然持續下跌，但 5 日線出現在 20 日線上方，可感受到「止跌徵兆」。尤其在圖中的 ㊀ 區，連續兩根長紅線，打底反彈的動向強烈。如果考量到「下一步的再下一步」，就能看出「止跌」到「打底」之後的反彈急漲徵兆，準備買進。從這個角度來觀察
    K 線，會發現 A 的上漲最後失敗了，又一波跌勢之後，在 ① 的長紅線穿過 5


    #### 5 了解何時該買賣的相場式訊號


    日線，完成「下半身」的線型。如果是相場式做法，就會毫不猶豫在①的紅線時買進。


    接著，當①的「下半身」完成時，原先持平的 20 日線轉為上揚。5 日線雖然在 20 日線下方，但也以急勢上漲。也就是說，來到了差不多多能確定，再出現下一根紅線，應該就接近完成「鳥嘴」的相對位置。如果能這樣密切監看，在實際完成「鳥嘴」線型的③出現之前，也就是在②的長紅線就能加碼買進。


    技術性指標中的買賣訊號，通常是「尋找已完成的訊號」，但這樣太慢了。相場式的做法是找出「即將就要出現的徵兆」。當然，萬一遇到「即將就要出現，最後卻不如預期」的狀況，也事先想好要如何因應。多多累積練習的經驗後，自然而然就能看出「快形成鳥嘴」的動靜。所以，我才說「練習、練習、再練習」很重要。


    ### 非常容易賺錢的訊號——分歧


    「分歧」是個聽起來就很有感覺的詞吧？其具體的線型有兩種。


    #### 圖 5-4 持續走勢中最重要的訊號


    分岐 往上漲或下跌走勢的回歸訊號！


    ![](img/deba46b3116904b5339032f4dcd528a1_99_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_99_1.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_99_2.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_99_3.png)


    ①和上漲的 20 日線並行的 5 日線一度下跌，雖然靠近 20 日線，卻沒有交集，呈現「分歧」後再次上漲。


    ②和下跌的 20 日線并行，且同樣下跌的 5 日線，在一度上漲後，靠近 20 日線，卻沒有交集，而在「分歧」訊號後再次下跌。


    分歧有這兩種模式（圖 5-4）。雖然解說得很簡單，但這是相場式幾個訊號中特別容易賺錢的線型，請各位千萬別忘記！


    無論持續上漲或下跌的行情，當走勢一度趨緩，之後再次回歸同樣走勢的瞬間，就是「分歧」。


    一般的股票用語為「逢低買進」或「反彈賣出」，不過逢低買進指的是「在下跌的低檔期間買進」（反彈賣出剛好相反）。


    至於「分歧」，則是在一度下跌，卻再次上漲的時候買進。


    ### 探討「N大」「反N大」


    ![](img/deba46b3116904b5339032f4dcd528a1_101_0.png)


    股價波動時經常出現「上漲，下跌，又上漲」的走勢，此時線型就會呈現「N」字型，一般市場上稱為「N字波動」或「N波」。


    我在意的不是股價波動本身，當5日線的線型出現N或反N型時，就是準備進行買賣的訊號。


    - 1. 20日線、5日線原先都朝同一個方向下跌，但5日線卻以突擊的走勢，由下往上穿過20日線。5日線一時下跌到接近20日線，卻沒有持續跌破20日線，反而反彈上漲＝N大。

    - 2. 20日線、5日線而都朝同一方向上漲，但5日線卻以突襲走勢，由上往下穿過20日線。5日線一時上漲到接近20日線，卻沒有持續漲破20日線，而跳回下跌＝反N大。


    ### **圖 5-5 容易連帶出現大行情的徵兆**


    ![](img/deba46b3116904b5339032f4dcd528a1_102_0.png)


    原先朝同一個方向變動的 5 日線與 20 日線，5 日線卻突破這個走勢。這是行情可能往另一個方向波動的「第一個訊號」。


    突破走勢之後，即使 5 日線看似轉回原來的方向，卻在小幅返回後反彈＝強烈的走勢轉換訊號。


    就我 36 年的股票投資經驗來看，N 大與反 N 大的線型完成時，很容易出現一波大行情，是下手的好時機。實際的買賣時機，是在 5 日線往先前的反方向波動，穿過
    20 日線後，看似返回原本的方向，卻又再次反彈時。


    ### 解讀「高中生時間」來追蹤走勢


    在「分歧」與「N 大」出現後，5 日線和 20 日線再次同時上漲或下跌，以親近的姿態強勢並行的線型，我取名為「高中生時間」（圖 5-6）。


    這類線型，可說是上升或下跌走勢的「青春時期」。何時買進或何時賣出都能賺錢的寶貴時光。


    在「高中生時間」出現後，能多早搭上車，就會直接影響到股票投資的成果。走勢持續，在高中生時間的線型下，不斷增加獲利。這可說是股票投資裡最幸福的一段時光。


    到這裡一共介紹了「下半身」「鳥嘴」「分歧」「N 大」「高中生時間」這幾個我獨創的買賣訊號。只要能熟練運用這些，就能大幅提高股票投資的實力。


    #### 圖 5-6 持續最棒走勢的訊號


    ![](img/deba46b3116904b5339032f4dcd528a1_105_0.png)


    前面也稍微提過，相場式的做法不是乾等著這些訊號完成才有動作，而是鍛鍊注意力，觀察線圖，將自己的程度提升到「覺得快要完成時開始密切監看，準備好可以隨時買賣」。股價的走向、價格流動，對我們這些投資人來說就像「神」一樣，無論頭腦再聰明的投資人，面對股價變化只能跪倒在地。


    股價說上就是上，說下就是下。在這個領域中，必須時刻提醒自己別只會空談大道理。


    ### 相場的精髓——不看必要的地方


    各位了解使用均線的基本買賣訊號了嗎？接下來，就說明一下我平常進行價格波動分析的方式。


    其中的精髓就是「不看必要的地方」。股價有走勢，但每天的股價不見得會依照走勢變動。股價簡直就像個暴怒的人。以數學的型態來看待這個暴怒的傢伙，加以「緩和」，就成了均線。


    如果被由煩惱構成的股價牽著走，本來賺得到錢的也賺不到了。因此，先消除這些發狂不受控的K線，只留下顯示均線的線圖來大致分析整體走勢——這就是我發明的「不看必要的地方」。


    請先看看圖5-7。這是將JSR這家公司的線圖中，去掉K線，只留下5日線到300日線的均線線圖。


    #### 圖 5-7 只顯示均線


    ![](img/deba46b3116904b5339032f4dcd528a1_107_0.png)


    怎麼樣？是不是變得很簡單明瞭呢？線圖中從左側持續上漲的走勢，來到中間變得疲軟，20 日線到 100 日線從上漲變成持平。不過，在最右側的 5 日線從下方突破了
    20 日線。


    以我而言，在圖中①的時間點，5 日線一度下跌，碰到往下走的 20 日線之後，再次上漲到越過 20 日線，抵達②的時間點之前，就會想到「持續這個走勢應該會完成『鳥嘴』」。既然如此，就買進吧。


    #### 收盤線與均線合奏的「五階段變化」


    在分析只有均線的狀況後，再檢查收盤價。因此，接下來要看的是在均線上加入「收盤線」（將每日收盤價連起線後畫出的線）的線圖（圖 5-8）。


    在看顯示收盤線的這張圖時，要將之前以 5 日線與 20 日線的關係來觀察的價格波動，改成以收盤線和 5 日線的關係來看。


    先看上方的線圖，收盤線在①由下跌反轉上漲，在②與 5 日線交集。這裡會成為近一波反彈上漲的起點。


    原先下跌的股票轉為上漲時，最先出現的狀況就會像下方的線圖所示，原本下跌的收盤線反轉往上的瞬間。把這個當作第一階段，接下來碰到上方 5 日線就是第二階段，超越
    5 日線是第三階段，然後再碰到上方的 20 日線是第四階段，突破 20 日線成為第五階段。這時，


    #### 圖 5-8 加入收盤線，來看價格的變化


    ![](img/deba46b3116904b5339032f4dcd528a1_109_0.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_109_1.png)


    ![](img/deba46b3116904b5339032f4dcd528a1_109_2.png)


    **相場式的股價五階段變化**


    ![](img/deba46b3116904b5339032f4dcd528a1_109_3.png)


    > 〈股價從下跌轉到上漲的過程〉


    - ①收盤線反彈上漲

    - ②收盤線碰到5日線

    - ③收盤線超越5日線

    - ④收盤線碰到20日線

    - ⑤收盤線超越20日線


    #### 5 了解何時該買賣的相場式訊號


    就要開始懷疑「走勢是不是差不多該變了呢？」現在正好就在第五階段的狀況。用這套「股價五階段變化法則」來看，圖 5-8 的上方線圖在②的時候就是第二階段。如果是我，就會思考「應該在這時候買進吧」。


    到這裡整理一下狀況，漲勢一度停歇後維持平穩，而 5 日線、20 日線在下跌過程中，收盤線轉而朝 5 日線上漲。這麼一來，收盤線在碰到 5 日線且突破的③時，很明顯打底反彈，就能預測到股價多少會上漲一些。


    #### 最後，來看 K 線揭曉答案


    在考量這些狀況的同時，再放上 K 線的圖（圖 5-9）。①的時間點，就相當於圖 5-8 中收盤線碰到 5 日線後突破的②→③這一段。但是，紅線竟然有超過一半往上方突破了
    5 日線！依照相場式「下半身要買進」的做法，這裡應該要先買進。


    接下來，前面的「股價五階段變化法則」裡的第四階段（收盤線碰到 20 日線），就是圖 5-9 裡的④。在這裡或許可以加碼買進。


    #### 圖 5-9 加上 K 線後進入實際買賣


    ![](img/deba46b3116904b5339032f4dcd528a1_111_0.png)


    看看圖中的 K 線就能清楚了解，如果能在(A)的時間點買進固然最好，但即使到了(B)才買，也能賺到一定的價差。


    #### 5 了解何時該買賣的相場式訊號


    至於獲利了結的時機，最好是在上漲的收盤線上方出現黑線的◎點。


    就像這樣，「不看不必要的地方」，就會「看到要看的地方」。再提醒各位一次，記得「不看不必要的地方」，一開始只看均線即可。好好思考「該買進還賣出？」「要買的話是什麼時候下手？」


    接著加入收盤線，「該在哪個階段交易呢？」進一步鎖定目標後再思考。


    到了最後加入 K 線，試著驗證實際上該在何時買進。反覆多次嘗試這套練習法，就能愈來愈感覺到得心應手！


    ![](img/deba46b3116904b5339032f4dcd528a1_112_0.png)

