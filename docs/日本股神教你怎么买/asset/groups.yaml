    # ## 整理行情「下一步」的交易技術


    整理行情不僅會出現「上漲→平盤」的高價區，也會出現「下跌→平盤」的低價區。此外，也會出現「上漲→平盤→再上漲」這類趨勢行情的過程。


    無論如何，在整理行情之後，上限或下限一旦遭到突破，必定會 出現上漲或下跌行情。而接踵而來的上漲或下跌行情，真的很好賺！


    因此，緊接著整理行情後必定會出現的趨勢行情，在交易時也該 納入考量。圖 9-4 是 Oriental Land 的線圖，跟先前相反，在持續下跌 後，止跌形成整理行情，接著再打底後反彈上漲。


    從下跌行情轉為整理行情前夕的時間點，就是在❶時 5 日線與 20 日線交錯，一度止跌的地方。接著，❸的低價並未跌破❷的低價；相 對地，❺的高價也沒有超越❹的高價，在此定出了下限與上限，正式
