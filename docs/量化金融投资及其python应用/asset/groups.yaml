    \  #matrix区分 int 和 double,数字后要加强小数点  \n**q** = matrix([3.0,4.0])  \n**G** = matrix([[-1.0,0.0,-1.0,2.0,3.0],[0.0,-1.0,-3.0,5.0,4.0]])\
