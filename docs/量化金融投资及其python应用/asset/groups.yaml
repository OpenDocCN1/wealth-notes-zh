    # 9.3 BP神经网络的学习程序


    BP神经网络的学习程序分为两大步，第一步是从网络的输入层逐步向输出层进行计算；第二步是对连接权和阈值进行修改，即反向从输出层向输入层进行计算和修改。根据输出层的误差修改与输出层相连接的权值，然后按照式(9-14)、式(9-15)修改各层的连接权值，直到满足要求为止。具体的学习流程步骤如下。


    +   (1) 初始化网络及学习参数：初始的权值 $W$ 和阈值 $\theta$、学习因子 $\eta$、动量项 $\alpha$。


    +   (2) 在已知 $p$ 个学习(训练)样本中按顺序抽取学习样本 $x_{1}^{1}, x_{2}^{1}, \cdots, x_{t}^{p}$
    输入到网络输入层。


    +   (3) 按式计算 $z_{j}$ 和 $y_{k}$：


    ```

    $z_{j} = f\left(\sum_{i=1}^{n} w_{yi} x_{i} - \theta_{j}\right)$

    ```


    ```

    $y_{k} = f\left(\sum_{j=1}^{l} w_{yk} z_{j} - \theta_{k}\right)$

    ```


    式中，$n$ 为输入的样本个数，$\theta_{j}$ 为输入层与隐含层之间的阈值，$\theta_{k}$ 为隐含层到输出层的阈值，$l$ 为隐含层的神经元个数。


    +   (4) 求出各层的误差，对已知样本的教师 $t$，有：


    ```

    $\delta_{k}^{k} = (t^{k} - y^{k}) y^{k}(1 - y^{k}) \quad (9\text{-}18)$

    ```


    ```

    $\delta_{j}^{j} = z_{j}^{f}(1 - z_{j}^{f}) \sum_{k=0}^{m} \delta_{k}^{k} w_{jk}
    \quad (9\text{-}19)$

    ```


    式中，$m$ 为输出层的神经元个数，本问题取 $m=1$。


    +   (5) 记下学习过的样本个数，即计数为 $p_{1}+1$，看 $p_{1}+1$ 是否达到了设定的学习样本数 $p$，如果没有达到 $p$，返回步骤(2)继续运算；如果达到了，再从第一个学习样本开始让
    $p_{1}=1$，进行下一步骤。


    +   (6) 按式(9-18)与式(9-19)修改各层的权值和阈值。


    +   (7) 按新的权值计算 $z_{j}$、$y_{k}$ 和 $E$。


    +   (8) 计算网络的均方根误差 $E(\mathbf{W})$：


    ```

    $E(\mathbf{W}) = \sqrt{\frac{\sum_{p}\sum_{k=0}^{m}\left(t_{pk} - y_{pk}\right)^2}{pm}}$

    ```


