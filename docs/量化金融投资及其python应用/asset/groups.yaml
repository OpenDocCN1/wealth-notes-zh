    $E_{p} = \frac{1}{2}\sum_{l=0}^{m}\left(t_{l}^{p}-y_{l}^{p}\right)^{2}$ (9-4)


    则网络总误差为


    $E = \sum_{p}E_{p} = \frac{1}{2}\sum_{p}\sum_{l=0}^{m}\left(t_{l}^{p}-y_{l}^{p}\right)^{2}$
