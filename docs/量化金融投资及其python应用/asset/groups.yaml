    ## 练习题\n\n对本章中例题的数据，使用 Python 重新操作一遍。\n\n# pandas的基本数据结构\n\n## 第5章\n\n### 5.1\
    \ pandas 介绍\n\npandas 是 Python 在数据处理方面功能最为强大的扩展模块。在处理实际的金融数据时,一条数据通常包含了多种类型的数据,例如,在一条股票数据中,股票的代码是字符串,收盘价是浮点型,而成交量是整数,等等。在\
    \ C++ 中可以实现以一个给定结构体作为单元的容器,如向量(vector, C++ 中的特定数据结构)。在 Python 中, pandas 包含了高级的数据结构\
    \ Series 和 DataFrame,使得在 Python 中处理数据变得非常方便、快速和简单。\n\npandas 不同的版本之间存在一些不兼容性,为此,需要清楚使用的是哪一个版本的\
    \ pandas。查看 pandas 版本的操作如下:\n\n```python\nimport pandas as pd\npd.__version__\n\
    Out[27]: u'0.18.1'\n```\n\npandas 最主要的两个数据结构是 Series 和 DataFrame, 5.2 节和 5.3 节将介绍如何由其他类型的数据结构得到这两种数据结构,或者自行创建这两种数据结构。首先导入\
    \ Series 和 DataFrame 以及相关模块:\n\n```python\nimport numpy as np\nfrom pandas import\
    \ Series, DataFrame\n```\n\n### 5.2 pandas 数据结构: Series\n\n从一般意义上来讲,可以简单地将 Series\
    \ 视为一维数组。Series 和一维数组最主要的区别在于 Series 类型具有索引(index),可以和编程中常见的另一个数据结构——哈希 (Hash)\
    \ 联系起来。\n\n#### 5.2.1 创建 Series\n\n创建 Series 的基本格式是\n\n```python\ns = Series(data,\
    \ index=index, name=name)\n```\n\n以下给出几个创建 Series 的例子。首先介绍如何从数组创建 Series:\n\n\
    ```python\na = np.random.randn(5)\nprint \"a is an array:\"\nprint a\ns = Series(a)\n\
    print \"s is a Series:\"\nprint s\na is an array:\n[  1.5708724  -2.51990028 -0.8213732\
    \  0.28692464 -1.72725827]\ns is a Series:\n0     1.570872\n1    -2.519900\n2\
    \    -0.821373\n3     0.286925\n4    -1.727258\ndtype: float64\n```\n\n可以在创建 Series\
    \ 时添加 index，并可使用 Series.index 查看具体的 index。需要注意的是，当从数组创建 Series 时，若指定 index，那么\
    \ index 的长度要和 data 的长度一致。例如：\n\n```python\ns = Series(np.random.randn(5), index=['a',\
    \ 'b', 'c', 'd', 'e'])\nprint s\ns.index\na    0.059366\nb    1.232519\nc    0.318299\n\
    d    1.083609\ne    0.732492\ndtype: float64\nOut[30]: Index(['a', u'b', u'c',\
    \ u'd', u'e'], dtype='object')\n```\n\n创建 Series 的另一个可选项是 name，可指定 Series 的名称，可用\
    \ Series.name 访问。将 5.3 节要介绍的 DataFrame 中每一列的列名单独提取出来就成了 Series 的名称：\n\n```python\n\
    s = Series(np.random.randn(5), index=['a', 'b', 'c', 'd', 'e'], name='my_series')\n\
    print s\nprint s.name\na    0.428730\nb   -0.896439\nc   -1.988758\nd   -0.581281\n\
    e   -0.373745\nName: my_series, dtype: float64\nmy_series\n```\n\nSeries 还可以从字典(dict)创建：\n\
    \n```python\nd = {'a': 0., 'b': 1, 'c': 2}\nprint \"d is a dict:\"\nprint d\n\
    s = Series(d)\nprint \"s is a Series:\"\nprint s\nd is a dict: \n{'a': 0.0, 'c':\
    \ 2, 'b': 1}\ns is a Series:\na     0.0\nb     1.0\nc     2.0\ndtype: float64\n\
    ```\n\n下面是使用字典创建 Series 时指定 index 的情形(index 的长度不必和字典相同):\n\n```python\nSeries(d,\
    \ index = ['b', 'c', 'd', 'a'])\nOut[33]: \nb     1.0\nc     2.0\nd     NaN\n\
    a     0.0\ndtype: float64\n```\n\n从中可以观察到两点: 一是在使用字典创建的 Series 中,数据将按 index 的顺序重新排列;\
    \ 二是 index 长度可以和字典长度不一致, 如果 index 更长, pandas 将自动为多余的 index 分配 NaN(Not a Number,\
    \ pandas 中缺失值的标准记号), 反之就截去一部分字典内容。\n\n如果数据就是一个单一的变量, 如数字 4, 那么 Series 将重复这个变量:\n\
    \n```python\nSeries(4., index = ['a', 'b', 'c', 'd', 'e'])\nOut[34]: \na     4.0\n\
    b     4.0\nc     4.0\nd     4.0\ne     4.0\ndtype: float64\n```\n\n#### 5.2.2\
    \ Series 数据的访问\n\n访问 Series 数据可以像数组一样使用下标, 也可以像字典一样使用索引, 还可以使用一些条件过滤:\n\n```python\n\
    s = Series(np.random.randn(10), index = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h',\
    \ 'i', 'j'])\ns[0]\nOut[35]: 0.31498252804717486\ns[:2]\na     0.314983\nb   \
    \  0.927704\ndtype: float64\ns[[2, 0, 4]]\nc    -1.687516\na     0.314983\ne \
    \   -1.081195\ndtype: float64\n\ns[['e', 'i']]\nOut[38]:\ne   -1.081195\ni   -0.284862\n\
    dtype: float64\ns[s > 0.5]\nOut[39]:\nb    0.927704\nd    0.620080\nf    1.434256\n\
    h    0.512448\ndtype: float64\n'e' in s\nOut[40]: True\n```\n\n### 5.3 pandas\
    \ 数据结构: DataFrame\n\n在使用 DataFrame 之前,先说明一下 DataFrame 的特性。DataFrame 是将数个 Series\
    \ 按列合并而成的二维数据结构,每一列单独取出来是一个 Series,这和 SQL 数据库中取出的数据是很类似的,所以,按列对一个 DataFrame 进行处理更为方便,用户在编程时注意形成按列构建数据的思维方式。DataFrame\
    \ 的优势在于可以方便地处理不同类型的列,因此,就不要考虑如何对一个全是浮点数的 DataFrame 求逆之类的问题了,处理这种问题还是把数据存成 NumPy\
    \ 的 matrix 类型比较便利。\n\n#### 5.3.1 创建 DataFrame\n\n首先来看如何从字典创建 DataFrame。DataFrame\
    \ 是一个二维的数据结构,是多个 Series 的集合体。首先创建一个值是 Series 的字典,并转换为 DataFrame:\n\n```python\n\
