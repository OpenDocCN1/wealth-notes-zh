    # ## 7.7 广义自回归条件异方差模型 GARCH 及波动率预测


    虽然 ARCH 模型简单，但为了充分刻画收益率的波动率过程，往往需要很多参数，例如上面用到 ARCH(4)模型，有时会有更高阶的 ARCH(m)模型。因此，Bollerslev
    于 1986 年提出了一个推广形式，称为广义的 ARCH 模型(Generalized ARCH, GARCH)。


    令 $a_t = r_t - \mu_t$ 为 $t$ 时刻的信息。若 $a_t$ 满足下式：


    $$a_t = \sigma_t \varepsilon_t, \sigma_t^2 = \alpha_0 + \sum_{i=1}^m \alpha_i
    a_{t-i}^2 + \sum_{j=1}^s \beta_j \sigma_{t-j}^2, \alpha_0 > 0, \alpha_i, \beta_i
    \geqslant 0, \alpha_i + \beta_i < 1$$


    其中，$\varepsilon_t$ 是均值为 0、方差为 1 的独立同分布的随机变量序列。通常假定其服从标准正态分布或标准学生 t 分布；$\sigma_t^2$
    为条件异方差。则称 $a_t$ 服从 $GARCH(m,s)$ 模型。可以发现该模型与 ARMA 模型很相似。


