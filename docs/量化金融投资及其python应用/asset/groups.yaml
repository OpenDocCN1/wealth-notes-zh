    7-1 第 4 张图所示，可以看到二阶差分得到的序列比一阶差分效果更好。


    #### 7.1.3 相关系数和自相关函数


    ##### 1. 相关系数


    对于两个向量，如何确定它们是不是相关？一个很自然的想法就是用向量之间的夹角作为距离的定义——夹角小，距离就小；夹角大，距离就大。


    在中学数学中，经常使用余弦公式来计算角度：


    $$\cos \langle a, b \rangle = \frac{a \cdot b}{\|a\| \|b\|}$$


    $a \cdot b$ 称为内积。例如：


