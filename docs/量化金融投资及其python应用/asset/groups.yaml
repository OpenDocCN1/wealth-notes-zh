    # 3. 牛顿共轭梯度法


    用到梯度的方法还有牛顿共轭梯度法（Newton-Conjugate-Gradient algorithm，简称牛顿法）。牛顿法是收敛速度最快的方法，其缺点在于需要求解
    Hessian 矩阵（二阶导数矩阵）。牛顿法大致的思路是采用泰勒展开的二阶近似，可使用共轭梯度近似 Hessian 矩阵的逆矩阵。下面给出 Rosenbrock
    函数的 Hessian 矩阵元素通式：


    ```

    $$ \begin{aligned} H(i, j)= \frac{\partial^{2} f}{\partial x_{i} \partial x_{j}}
    &= 200\left(\delta_{i, j}-2 x_{i-1} \delta_{i-1, j}\right) - 400 x_{i}\left(\delta_{i+1,
    j} - 2 x_{i} \delta_{i, j}\right) - \\ &400 \delta_{i, j}\left(x_{i+1, j} - x_{i}^{2}\right)
    + 2 \delta_{i, j} \\ &=\left(202 + 1200 x_{i}^{2} - 400 x_{i+1}\right) \delta_{i,
    j} - 400 x_{i} \delta_{i+1, j} - 400 x_{i+1} \delta_{i-1, j} \end{aligned} $$

    ```


    其中 $i, j \in[1, N-2]$。其他边界上的元素通式为


    ```

    $$ \begin{aligned} &\frac{\partial^{2} f}{\partial x_{0}^{2}} = 1200 x_{0}^{2}
    - 400 x_{1} + 2 \\ &\frac{\partial^{2} f}{\partial x_{0} \partial x_{1}} = \frac{\partial^{2}
    f}{\partial x_{1} \partial x_{0}} = - 400 x_{0} \\ &\frac{\partial^{2} f}{\partial
    x_{N-1} \partial x_{N-2}} = \frac{\partial^{2} f}{\partial x_{N-2} \partial x_{N-1}}
    = -400 x_{N-2} \\ &\frac{\partial^{2} f}{\partial x_{N-1}^{2}} = 200 \end{aligned}
    $$

    ```


    例如，当 $N = 5$ 时的 Hessian 矩阵为'
