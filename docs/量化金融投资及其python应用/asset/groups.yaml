    b = Series(np.linspace(4, 20, 5))\ndf = pd.concat([a, b], axis=1)\nprint df\n\
    ```\n\n```\n   0    1\n0  0  4.0\n1  1  8.0\n2  2  12.0\n3  3  16.0\n4  4  20.0\n\
