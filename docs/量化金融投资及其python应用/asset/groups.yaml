    \n## 2.4 Python 条件与循环\n\nPython 用缩进来标识出哪一段代码是循环体。\n\n### 1. if 语句\n\n注意：循环体的代码要缩进；条件后面有冒号“：”。例如：\n\
    \n```python\nj = 2.67\nif j < 3:\n    print('j < 3')\n# j < 3\n```\n\n对于多条件 if\
    \ 语句，注意其中的 elif 不要写成 elseif，标准格式为：\n\n```python\nif 条件1:\n    执行语句1\nelif 条件2:\n\
