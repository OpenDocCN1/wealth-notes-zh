    本章将介绍如下内容：\n\n- （1）如何使用 Python 内置的数学函数计算期权的价格。\n- （2）利用 NumPy 加速数值计算。\n- （3）利用\
    \ SciPy 进行仿真模拟。\n- （4）使用 SciPy 求解器计算隐含波动率。\n- （5）使用 matplotlib 绘制精美的图形。\n\n###\
    \ 11.1 期权定价公式的 Python 函数\n\n例如，要知道下面一只期权的价格：\n\n- 当前价(spot)：2.45。\n- 行权价(strike)：2.50。\n\
    - 到期期限(maturity)：0.25。\n- 无风险利率(r)：0.05。\n- 波动率(vol)：0.25。\n\n关于这样的简单欧式期权的定价，有经典的\
    \ Black-Scholes 公式：\n\n$$Call(S, K, r, \\tau, \\sigma) = SN(d_1) - Ke^{-\\tau}N(d_2)\
    \ \\quad (11\\text{-}1)$$\n\n其中：\n\n$$d_1 = \\frac{\\ln(S/K) + (r + 0.5\\sigma^2)\\\
    tau}{\\sigma \\sqrt{\\tau}} \\quad (11\\text{-}2)$$\n\n$$d_2 = d_1 - \\sigma \\\
    sqrt{\\tau} \\quad (11\\text{-}3)$$\n\n在上面的公式中，$S$为标的价格，$K$为执行价格，$r$为无风险利率，$\\\
    tau=T-t$为剩余到期时间，$N(x)$为标准正态分布的累计概率密度函数，$Call(S, K, r, \\tau, \\sigma)$为看涨期权的价格。\n\
    \n设置初始参数如下：\n\n```python\nspot = 2.45\nstrike = 2.50\nmaturity = 0.25\nr = 0.05\n\
    vol = 0.25\n```\n\n观察式(11-1)至式(11-3)，需要使用一些数学函数，这些数学函数分为两部分：\n\n- (1) log, sqrt\
    \ 和 exp，这 3 个函数可以从标准库 math 中找到。\n- (2) 标准正态分布的累计概率密度函数，使用 SciPy 库中的 stats.norm.cdf\
    \ 函数。\n\n基于 Black-Scholes 公式的期权定价公式，编制 call_option_pricer(spot, strike, maturity,\
    \ r, vol) 函数如下：\n\n```python\nfrom math import log, sqrt, exp\nfrom scipy.stats\
    \ import norm\ndef call_option_pricer(spot, strike, maturity, r, vol):\n    d1\
    \ = (log(spot/strike) + (r + 0.5 * vol * vol) * maturity) / vol / sqrt(maturity)\n\
    \    d2 = d1 - vol * sqrt(maturity)\n    price = spot * norm.cdf(d1) - strike\
    \ * exp(-r * maturity) * norm.cdf(d2)\n    return price\n```\n\n可以使用这个函数计算我们关注的期权的价格：\n\
    \n```python\nprint '期权价格：%.4f' % call_option_pricer(spot, strike, maturity, r,\
    \ vol)\n期权价格：0.1133\n```\n\n### 11.2 使用 NumPy 加速批量计算\n\n大多数情况下，我们不止关心一个期权的价格，而且关心组合（成千上万）的期权。随着期权组合数量的增长，计算时间也会快速增长。本节就来讨论计算时间增长的问题。\n\
