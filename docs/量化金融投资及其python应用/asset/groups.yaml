    \ T$\n$C(x, 0)=\\operatorname{max}\\left(e^{x}-K, 0\\right)$\n$C\\left(x_{\\max\
    \ }, \\tau\\right)=e^{\\tau_{\\max }}-K e^{-\\tau}$\n$C\\left(x_{\\min }, \\tau\\\
    right)=0$\n\n# ### 16.2  偏微分方程隐式差方法\n\n为说明这种方法，本节考虑一个不支付红利的股票期权，期权价格所满足的偏微分方程为\n\
    \n$\\frac{\\partial C(S, t)}{\\partial t}+r S \\frac{\\partial C(S, t)}{\\partial\
    \ S}+\\frac{1}{2} \\frac{\\partial^{2} C(S, t)}{\\partial S^{2}} \\sigma^{2} S^{2}=r\
    \ C(S, t) \\tag{16-1}$\n\n假设现在是在0时刻，把0时刻至期权的到期日$T$分成$N$个等间隔的时间段，每段步长是$\\Delta\
    \ t=T/N$，这样总共有$N+1$个点：\n\n$0, \\Delta t, 2 \\Delta t, \\cdots, T$"
  - "[PAGE 173]\n\n假设 $S_{\\max}$为股票价格所能达到的最大值，定义价格步长为 $\\Delta S = S_{\\max}/M$,\
    \ 其中 $M$ 为价格步数。这样就有 $M+1$ 个股票价格点：\n\n$$0, \\Delta S, 2\\Delta S, \\cdots, S_{\\\
    max}$$\n\n上面的价格点与时间点构成了一个共有 $(M+1)\\times (N+1)$ 个坐标点的方格。任意点 $(i, j)$ 对应的时间是 $i\\\
    Delta t$, 股票价格是 $j\\Delta S$。\n\n用 $C_{i,j}$ 表示点 $(i, j)$ 的期权价格，这样就可以用离散算子逼近 $\\\
    frac{\\partial f}{\\partial t}, \\frac{\\partial f}{\\partial S}, \\frac{\\partial^2\
    \ f}{\\partial S^2}$ 各项，从而把上述偏微分方程转化为离散方程。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_173_0.png)\n\
