    \ `b` 仍在原来的地址：\n\n```python\na = np.array([[[3.2, 1.5], [2.5, 4]]])\nb = a\na\
    \ = np.array([[[2, 1], [9, 3]]])\nprint \"a:\"\nprint a\nprint \"b:\"\nprint b\n\
