    # 3.1 NumPy 概述


    量化金融投资分析的工作涉及大量的数值运算，一个高效便捷的科学计算工具是必不可少的。Python 语言一开始并不是为科学计算设计的，随着越来越多的人发现 Python
    的易用性，逐渐出现了关于 Python 的大量外部扩展模块，NumPy（Numeric Python）就是其中之一。NumPy 提供了大量的数值编程工具，可以方便地处理向量、矩阵等运算，极大地便利了人们在科学计算方面的工作。另一方面，Python
    是免费的，相比于费用高昂的 Matlab，NumPy 的出现使 Python 得到了更多人的青睐。


    首先简单看一下如何开始使用 NumPy：


    ```

    import numpy

    numpy.version.full_version

    ''1.11.1''

    ```


    使用 import 命令导入了 NumPy，并使用 numpy.version.full_version 查出了 NumPy 版本为 1.11.1。在后面的介绍中，将大量使用
    NumPy 中的函数，每次使用都在函数前添加“numpy。”作为前缀比较费劲，2.1 节介绍了引入外部扩展模块时的小技巧，可以使用 from numpy import
    * 解决这一问题。


    Python 的外部扩展模块成千上万，在使用中很可能会导入几个外部扩展模块，如果某个模块包含的属性和方法与另一个模块的同名，就必须使用 import module
    来避免名字的冲突。这种情况即所谓的名字空间（namespace）冲突了，所以前缀最好还是带上。


    那么有没有简单的办法呢？办法是在导入扩展模块时给模块定义在程序中使用的别名，调用时就不必写出全名了。例如，使用 np 作为别名并调用 version.full_version
    函数：


    ```

    import numpy as np

