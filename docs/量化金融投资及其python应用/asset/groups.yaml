    \ 3 方面的优化。\n\n- 1. 找到有效边界(或有效前沿)，在既定的收益率下使投资组合的方差最小化。\n- 2. 找到夏普比(Sharpe ratio)最优的投资组合(收益-风险均衡点)。\n\
    - 3. 找到风险最小的投资组合。\n\n该理论基于用均值方差模型来表述投资组合优劣的前提。本章将选取几只股票，用蒙特卡洛模拟来探究投资组合的有效边界。通过夏普比最大化和方差最小化两种优化方法来找到最优的投资组合配置权重参数。最后，刻画出可能的分布、两种最优组合以及组合的有效边界。\n\
