    acf, q, p = sm.tsa.acf(data, nlags=m, qstat=True)  # 计算自相关系数及 p-value

    out = np.c_[range(1, 11), acf[1:], q, p]

    output = pd.DataFrame(out, columns=[''lag'', ''ACF'', ''Q'', ''p-value''])

    output = output.set_index(''lag'')

    ```


