    \n# ## 6. 夏普比最大的投资组合优化\n\n建立 statistics 函数来记录重要的投资组合统计数据（收益、方差和夏普比），通过对约束最优问题的求解得到最优解。其中约束是权重总和为\
    \ 1。\n\n```\ndef statistics(weights):\n   weights = np.varray(weights)\n   port_returns\
    \ = np.sum(returns.mean() * weights)\n   port_variance = np.sqrt(np.dot(weights.T,\
    \ np.dot(returns.cov(), weights)))\n   return np.varray([port_returns, port_variance,\
