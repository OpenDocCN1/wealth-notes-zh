    在中学数学中，经常使用余弦公式来计算角度：


    cos < a, b > = a · b/||a||||b||


    a · b 称为内积。例如：


    (x₁, y₁), (x₂, y₂) = x₁x₂ + y₁y₂


    再来看相关系数的定义公式。X 和 Y 的相关系数为


    ρXY = Cov(X,Y)/√(Var(X)Var(Y))


    而根据样本的估计计算公式为


    ρXY = Σ(xᵢ - x̄)(yᵢ - ȳ)/√(Σ(xᵢ - x̄)²Σ(yᵢ - ȳ)²) = (X - x̄) · (Y - ȳ)/||(X -
    x̄)|| · ||(Y - ȳ)||


    可以发现，相关系数实际上就是向量空间中两个向量的夹角，协方差是去掉均值后两个向量的内积。


    如果两个向量平行，相关系数等于 1 (同向) 或者 -1 (反向)。如果两个向量垂直，则夹角的余弦就等于 0，说明二者不相关。两个向量夹角越小，相关系数的绝对值越接近
    1，相关性越高。只不过这里在计算的时候对向量做了去均值处理，即中心化操作，而不是直接用向量 X,Y 计算。减去均值并不影响角度计算，是一种“平移”操作。通过如下代码得到如图
    7-2 所示的图形。


    ```

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    a = pd.Series([9,8,7,5,4,2])

    b = a - a.mean() # 去均值

    plt.figure(figsize = (10,4))

    a.plot(label = ''a'')

    b.plot(label = ''mean removed a'')

    plt.legend()

    ```


