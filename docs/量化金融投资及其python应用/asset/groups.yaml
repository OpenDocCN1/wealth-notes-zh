    \n## 第 10 章 机器学习支持向量机及其 Python 应用\n\n本章先介绍机器学习支持向量机的原理，然后基于机器学习支持向量机进行大盘预测，主要针对的是以前几日的蜡烛图形形态来预测未来\
    \ $ n $ 天的大盘走势。当然，不可能用图像处理方法来识别大盘前几日的走势，而要使用开盘价、收盘价、最高价、最低价这 4 个价格之间的距离百分比作为特征，选取前\
    \ $ m $ 天这 4 个价格之间的距离百分比，预测未来 $ n $ 天的涨跌幅。\n\n### 10.1 机器学习支持向量机原理\n\n要将两类分开，需要得到一个超平面。最优的超平面是到两类的边缘达到最大，边缘就是超平面与离它最近的一点之间的距离。如图\
    \ 10-1 所示，$ z_{2} > z_{1} $，所以 $ z_{2} $ 代表的超平面比较好。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_130_0.png)\n\
    \n将这个超平面表示成一个线性方程，位于线上方的一类都大于或等于 1，另一类都小于或等于 $-1$，如图 10-2 所示。\n\n点到超平面的距离根据图 10-3\
    \ 中的公式计算。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_130_1.png)\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_130_2.png)\n\
    \n由此得到计算总边缘的表达式如下：\n\n$$\\frac{1}{\\|\\mathbf{w}\\|}+\\frac{1}{\\|\\mathbf{w}\\\
    |}=\\frac{2}{\\|\\mathbf{w}\\|_{\\min}}$$\n\n目标是最大化总边缘，这就需要最小化分母，于是该问题就变成了一个优化问题。\n\
    \n例如，在图 10-4 中有 3 个点，找到最优的超平面，定义了权向量为 $(2,3)-(1,1)$。\n\n得到权向量为 $(a,2a)$。将两个点代入方程\
    \ $ g(\\boldsymbol{w}) = \\boldsymbol{w} \\cdot \\boldsymbol{x}^{T} + w_{0} $：代入\
    \ $(2,3)$，令其值为 $ 1 $；代入 $(1,1)$，令其值为 $-1$，求解出 $a=2/5$，截距 $w_0=-11/5$，进而得到超平面的表达式，如图\
    \ 10-5 所示。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_131_0.png)\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_131_1.png)\n\
    \n$a$ 求出来后，代入 $(a, 2a)$ 得到 $(2/5, 4/5)$，这就是支持向量。\n\n将 $a$ 和 $w_0$ 代入超平面的方程 $g(\\\
    boldsymbol{w}) = \\boldsymbol{w} \\cdot \\boldsymbol{x}^{\\mathrm{T}} + w_0 =\
    \ \\frac{2}{5}x_1 + \\frac{4}{5}x_2 - \\frac{11}{5}$，就是支持向量机 (Support Vector Machine,\
    \ SVM)。\n\n### 10.2 机器学习支持向量机的应用\n\n代码如下：\n\n```python\nimport numpy as np\nimport\
    \ pandas as pd\nfrom matplotlib import pyplot as plt\nfrom CAL.PyCAL import *\n\
