    \n# ### 3.8 一元线性回归分析的NumPy应用\n\n一元线性回归分析模型是最基本的回归模型，其数学表达式是\n\n$$ \\hat { y }\
    \ = a + b x + \\varepsilon \\tag { 3 - 1 } $$\n\n式中：ŷ——预测对象，因变量或被解释变量的预测值。"
  - '[PAGE 39]


    $x$——影响因素，自变量或解释变量的相应值。


    $a,b$——待估计的参数，称为回归系数。


    $\varepsilon$——偏差(或估计误差、残差)。


    为了估计 $a,b$ 参数，最常用的方法是最小二乘法。首先，要收集预测对象$\hat{y}$及相关因素$x$的数据样本$n$对(实际值)：


    ```

    $$(y_1,x_1),(y_2,x_2),..., (y_n,x_n)$$

    ```


    再将其描绘在坐标图上($x$为横轴,$y$为纵轴)。当这$n$对数据点近似呈直线分布时，则可以应用一元线性回归模型，即式(3.1)。式中$a+bx=y$应是预测对象
    的实际值，因而对应样本中的每一个$x_i$都有一个$y_i$的估计值$\hat{y_i}$, $i=1,2,...,n$；$y_i$与$\hat{y_i}$之间存在着偏差$\varepsilon_i$，于是有


    ```

    $$\varepsilon_i = y_i - \hat{y}_i = y_i - a - bx_i;$$

    ```


    设


    ```

    $$Q = \sum_{i=1}^n \varepsilon_i^2 = \sum_{i=1}^n (y_i - a - bx_i)^2$$

    ```


    可见,$Q$是参数$a,b$的函数。为了求$Q$的最小值，可利用极值原理：


    ```

    $$\frac{\partial Q}{\partial a} = 0, \quad \frac{\partial Q}{\partial b} = 0$$

    ```


    即


    ```

    $$\begin{cases}\frac{\partial Q}{\partial a} = -2 \sum_{i=1}^n (y_i - a - bx_i)
    = 2 \sum_{i=1}^n (a + bx_i - y_i) = 0 \\ \frac{\partial Q}{\partial b} = -2 \sum_{i=1}^n
    x_i(y_i - a - bx_i) = 2 \sum_{i=1}^n x_i(a + bx_i - y_i) = 0 \end{cases}$$

    ```


    求解此联立方程可得


    ```

    $$b = \frac{\sum_{i=1}^n x_i y_i - \left(\sum_{i=1}^n x_i \sum_{i=1}^n y_i\right)}{\sum_{i=1}^n
    x_i^2 - \left(\sum_{i=1}^n x_i\right)^2} \bigg/ n, \quad a = \frac{1}{n} \sum_{i=1}^n
    y_i - \frac{b}{n} \sum_{i=1}^n x_i$$

    ```


    令


    ```

    $$\bar{x} = \frac{1}{n} \sum_{i=1}^n x_i, \quad \bar{y} = \frac{1}{n} \sum_{i=1}^n
    y_i$$

    ```


    则


    ```

    $$a = \bar{y} - b \bar{x}$$

    ```


