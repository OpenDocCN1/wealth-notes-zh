    endDate=u"20140801", field=u"tradeDate,closeIndex,CHGPct", pandas="1")

    IndexData = IndexData.set_index(IndexData[''tradeDate''])

    IndexData[''closeIndexDiff_1''] = IndexData[''closeIndex''].diff(1)  # 1 阶差分处理

    IndexData[''closeIndexDiff_2''] = IndexData[''closeIndexDiff_1''].diff(1)  # 2
    阶差分处理

