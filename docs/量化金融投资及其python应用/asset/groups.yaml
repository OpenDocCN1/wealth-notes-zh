    # 2.1 Python 的两个基本操作


    本节介绍 Python 的两个基本操作。


    +   1. 四则运算


    可以在 Python 中使用＋、－、＊、/直接进行四则运算。


    ```

    ```

    1+3*3

    10

    ```

    ```


    +   2. 导入模块


    使用 import 命令可以导入模块，随后就可以使用这个模块下面的函数了。例如，要导入 math 模块，然后使用 math 模块下面的 sqrt 函数，则执行以下命令：


    ```

    ```

    import math

    math.sqrt(9)

    3.0

    ```

    ```


    > **注意：** 上面的语句直接输入 sqrt(9) 是会报错的，前面要带“math.”前缀。那么有什么办法可以不用每次都带前缀呢？解决办法是用“from
    模块 import 函数”命令先导入函数。


    ```

    ```

    from math import sqrt

    sqrt(9)

    3.0

    ```

    ```


    这样每次使用 sqrt 函数的时候就不用再加“math.”前缀了。然而 math 模块下面有很多函数，是否可以写一个语句使 math 下面的所有函数都可以直接使用？下面的办法可以一次导入模块中的所有函数：


    ```

    ```

    from math import *

    print sqrt(9)

    print floor(32.9)

    3.0

    32.0

    ```

    ```'
