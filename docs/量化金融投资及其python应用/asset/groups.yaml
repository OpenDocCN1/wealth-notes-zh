    \n首先，再次强调一下 DataFrame 是以列作为操作基础的，全部操作都可以视为先从 DataFrame 里取一列，成为一个 Series，再从这个 Series\
    \ 中取元素。可以用 `dataframe.column_name` 选取列，也可以用 `dataframe[]` 选取列，前一种方法只能选取一列，而后一种方法可以选取多列。若\
    \ DataFrame 没有列名，在 `[]` 中可以使用非负整数，也就是通过“下标”选取列；若有列名，则必须使用列名选取，另外 `dataframe.column_name`\
    \ 在没有列名的时候是无效的：\n\n```python\nprint df[1]\nprint type(df[1])\ndf.columns = ['a',\
    \ 'b', 'c', 'd', 'e']\nprint df['b']\nprint type(df['b'])\nprint df.b\nprint type(df.b)\n\
