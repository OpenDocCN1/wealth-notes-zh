    pandas 是基于 NumPy 的数据分析工具，主要用于解决数据分析任务。pandas 提供了大量能帮助用户快速便捷地处理数据的函数和方法；提供了高效操作大型数据集所需的工具。可查看
    pandas 官网的帮助文档(http://pandas.pydata.org/pandas-docs/stable/10min.html)。


