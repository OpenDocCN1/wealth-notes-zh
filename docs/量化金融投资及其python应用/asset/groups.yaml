    \ = featureOriginal[i - lag:i]\n    temp = list(itertools.chain.from_iterable(temp.values.tolist()))\n\
    \    features.append(temp)\n\n#形成 label\nlabel = pd.rolling_sum(index.sort_index(ascending\
