    \ 3 个参数决定：\n\n- up：标的资产价格上涨的比例，必大于 1。\n- down：标的资产价格下降的比例，必小于 1。\n- upProbability：标的资产价格上涨的概率。\n\
    \n这里用一个具体的例子来说明如何使用 Python 实现二叉树算法。以下为具体参数：\n\n- ttm 为到期时间，单位为年。\n- tSteps 为时间方向步数。\n\
