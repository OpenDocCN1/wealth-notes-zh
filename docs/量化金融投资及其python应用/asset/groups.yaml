    - \bar{x}\| \cdot \|Y - \bar{y}\|}$$


    可以发现，相关系数实际上就是向量空间中两个向量的夹角，协方差是去掉均值后两个向量的内积。


    如果两个向量平行，相关系数等于 1 (同向) 或者 -1 (反向)。如果两个向量垂直，则夹角的余弦就等于 0，说明二者不相关。两个向量夹角越小，相关系数的绝对值越接近
