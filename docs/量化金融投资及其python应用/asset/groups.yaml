    # 4.3.3 利用 CVXOPT 求解二次规划问题


    在 Python 中除了可以使用 opt. minimize 工具处理优化问题外,也有其他专门的优化扩展模块,例如 CVXOPT(http://cvxopt.org)专门用于处理凸优化问题,在约束优化问题上提供了更多的备选方法。CVXOPT
    是著名的凸优化教材 Convex Optimization 的作者之一,加州大学洛杉矶分校 Lieven Vandenberghe 教授开发的,是处理优化问题的利器。


    SciPy 中的优化模块还有一些特殊定制的函数,专门处理能够转化为优化求解的一些问题,如方程求根、最小方差不拟合等,可到 SciPy 官方网站关于优化部分的页面查看。


    在实际生活中经常会遇到一些优化问题,简单的线性规划可以作图求解,但是当日标函数包含二次项时,则需要另觅其他方法。在金融实践中,马科维茨均方差模型就有实际的二次优化需求。作为金融实践中常用的方法,本节对
    CVXOPT 中求解二次规划的问题通过'
  - "[PAGE 52]\n\n举例详细说明。\n\n# **1. 二次规划问题的标准形式**\n\n二次规划问题的标准形式如下：\n\n```\nmin 1/2**x**^T*Px*\
    \ + **q**^T**x**  \ns.t. **Gx** ≤ **h**, **Ax** = **b**\n```\n\n上式中,**x**为所要求解的列向量,\
    \ **x**<sup>T</sup>表示 **x** 的转置。\n\n上式表明, 任何二次规划问题都可以转化为上式的结构，事实上用 CVXOPT 的第一步就是将实际的二次规划转换为上式的结构,\
    \ 写出对应的 **P**, **q**, **G**, **h**, **A**, **b**.\n\n目标函数若为求 **max**, 可以通过乘以−1\
    \ 将最大化问题转换为最小化问题。\n\n**Gx**≤**b** 表示所有的不等式约束，同样, 若存在诸如 **x**≥0 的限制条件, 也可以通过乘以\
    \ −1 转换为≤的形式。\n\n**Ax** = **b** 表示所有的等式约束。\n\n# **2. 求解过程示例**\n\n二次规划问题如下：\n\n\
    ```\nmin 1/2*x*<sup>2</sup>+3*x*+4*y*  \ns.t.  *x*,*y* ≥ 0, *x*+3*y* ≥ 15, 2*x*+5*y*\
    \ ≤ 100, 3*x*+4*y* ≤ 80\n```\n\n在此例中, 需要求解的是 *x*,*y*, 可以把它写成向量的形式, 同时, 也需要将限制条件按照前面介绍的标准形式进行调整,\
    \ 用矩阵形式表示, 如下所示：\n\n```\nmin(*x*,*y*) 1/2 [ 1 0 ; 0 0 ] [ *x* ; *y* ] **x**^T\
    \ [ 0 0 ; 0 0 ] [ *x* ; *y* ] + [ 3 ; 4 ]^T [ *x* ; *y* ]  \n[ -1  0  -1  2  3\
    \ ] [ *x* ; *y* ] ≤ [ 0 ; 0 ; -15 ; 100 ; 80 ]  \n[ 0  -1  -3  5  4 ]\n```\n\n\
    如上所示, 目标函数和限制条件均转化成了二次规划问题的标准形式, 这是第一步, 也是最难的一步, 接下来就简单了。\n\n对比上式和标准形式, 不难得出\n\
    \n```\n**P** = [ 1  0 ; 0  0 ],  **q** = [ 3 ; 4 ],  **G** = [ -1  0  -1  2  3\
    \ ; 0  -1  -3  5  4 ],  **h** = [ 0 ; 0 ; -15 ; 100 ; 80 ]\n```\n\n接下来就是几行简单的代码,\
