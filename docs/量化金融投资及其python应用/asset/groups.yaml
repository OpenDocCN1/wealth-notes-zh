    本节介绍 Python 的两个基本操作。\n\n### 1. 四则运算\n\n可以在 Python 中使用＋、－、＊、/ 直接进行四则运算。\n\n```python\n\
    1 + 3 * 3\n10\n```\n\n### 2. 导入模块\n\n使用 import 命令可以导入模块，随后就可以使用这个模块下面的函数了。例如，要导入\
