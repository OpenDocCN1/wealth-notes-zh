    \ 偏微分方程隐含差分法、优矿平台的量化金融投资、Alpha 对冲模型、Signal 框架下的 Alpha 量化金融投资策略、量化金融投资组合优化等问题的\
    \ Python 应用。\n\n本书内容新颖、全面，实用性强，融理论、方法、应用于一体，可以供金融学、投资学、金融工程、保险学、经济学、财政学、财务管理、统计学、数量经济学、管理科学与工程、金融数学等专业的高年级本科生、研究生和金融专业硕士使用。\n\
