    # **2. 自相关函数**


    相关系数度量了两个向量的线性相关性，在平稳时间序列 $\{r_t\}$ 中，我们有时候很想知道 $r_t$ 与它的过去值 $r_{t-l}$ 的线性相关性。为此把相关系数的概念推广到自相关系数。$r_t$
    与 $r_{t-l}$ 的相关系数称为 $r_t$ 的间隔为 $l$ 的自相关系数，通常记为 $\rho_l$。具体定义为


    $$\rho_l = \frac{\text{Cov}(r_t, r_{t-l})}{\sqrt{\text{Var}(r_t)\text{Var}(r_{t-l})}}
    = \frac{\text{Cov}(r_t, r_{t-l})}{\text{Var}(r_t)}$$


    这里用到了弱平稳序列的性质：


    $$\text{Var}(r_t) = \text{Var}(r_{t-l})$$


    对一个平稳时间序列的样本 $\{r_t\}, 1 \le t \le T$，则间隔为 $l$ 的样本自相关系数的估计为


    $$\hat{\rho}_l = \frac{\sum_{t=l+1}^{T}(r_t - \bar{r})(r_{t-l} - \bar{r})}{\sum_{t=1}^{T}(r_t
    - \bar{r})^2}, \quad 0 \le l \le T - 1$$


    则函数


    $$\hat{\rho}_1, \hat{\rho}_2, \hat{\rho}_3, \dots$$


    称为 $r_t$ 的样本自相关函数 (Autocorrelation Function, ACF)。


    当自相关函数中所有的值都为 0 时，则认为该序列是完全不相关的。因此，经常需要检验多个自相关系数是否为 0。


    混合检验 (Ljung-Box) 如下：


    原假设：$H_0: \rho_1=\rho_2=\dots=\rho_m=0$  备择假设：$H_1: \exists i \in 1,2,\dots,m,
    \rho_i \neq 0$  混合检验统计量：


    $$Q(m) = T(T+2)\sum_{i=1}^{m}\frac{\hat{\rho}_i^2}{T-i}$$


    $Q(m)$ 渐进服从自由度为 $m$ 的 $\chi^2$ 分布。


    决策规则：


    $$Q(m) > \chi^2_{\alpha} \quad \text{拒绝} \ H_0$$


    即，$Q(m)$ 的值大于自由度为 $m$ 的 $\chi^2$ 分布 100(1-$\alpha$) 分位点时，拒绝 $H_0$。


    大部分软件会给出 $Q(m)$ 的 p-value，则当 p-value 小于等于显著性水平 $\alpha$ 时拒绝 $H_0$。


    下面给出示例：


    ```

