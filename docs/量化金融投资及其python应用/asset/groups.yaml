    infty} \\psi_i a_{t-i}$$\n\n其中，$\\mu$ 为 $r_t$ 的均值，$\\psi_0=1$，$\\{a_t\\}$ 为白噪声序列，则称$\\\
    {r_t\\}$ 为线性序列，称 $a_t$ 为在 $t$ 时刻的新信息 (innovation) 或扰动 (shock)。\n\n很多时间序列是线性的，即是线性时间序列，相应地有很多线性时间序列模型，例如接下来要介绍的\
    \ AR、MA、ARMA 都是线性模型，但并不是所有的金融时间序列都是线性的。\n\n对于弱平稳序列，利用白噪声的性质很容易得到 $r_t$ 的均值和方差：\n\
    \n$$E(r_t) = \\mu, \\quad \\text{Var}(r_t) = \\sigma^2 \\sum_{i=0}^{\\infty} \\\
    psi_i^2$$\n\n其中，$\\sigma_a^2$ 为 $a_t$ 的方差。因为 $\\text{Var}(r_t)$ 一定小于正无穷，所以 $\\\
    psi_i^2$ 必须是收敛序列，由此满足当 $i \\to \\infty$ 时，$\\psi_i^2 \\to 0$。\n\n即随着 $i$ 的增大，远处的扰动\
    \ $a_{t-i}$ 对 $r_t$ 的影响会逐渐消失。\n\n到目前为止介绍了一些关于时间序列的基本知识和概念，如平稳性、相关性、白噪声、线性序列。下面介绍一些线性模型。\n\
    \n## 7.2 自回归模型\n\n在 7.1 节中，计算了上证指数部分数据段的 ACF，看表可知间隔为 1 时自相关系数是显著的。这说明在 $t-1$ 时刻的数据\
    \ $r_{t-1}$ 在预测 $t$ 时刻时的 $r_t$ 时可能是有用的。\n\n根据这一点可以建立下面的模型：\n\n$$r_t = \\phi_0\
    \ + \\phi_1 r_{t-1} + a_t$$\n\n其中 $\\{a_t\\}$ 是白噪声序列，这个模型与简单线性回归模型有相同的形式，也称为一阶自回归\
    \ (AR)模型，简称 AR(1) 模型。\n\n从 AR(1) 很容易推广到 AR($p$) 模型：\n\n$$r_t = \\phi_0 + \\phi_1\
    \ r_{t-1} + \\dots + \\phi_p r_{t-p} + a_t$$\n\n### 7.2.1 AR($p$) 模型的根及平稳性检验\n\
    \n先假定序列是弱平稳的，则有\n\n$$E(r_t) = \\mu, \\quad \\text{Var}(r_t) = \\gamma_0, \\quad\
    \ \\text{Cov}(r_t, r_{t-j}) = \\gamma_j$$\n\n其中 $\\mu, \\gamma_0$ 是常数。因为 $\\{a_t\\\
    }$ 是白噪声序列，因此有\n\n$$E(a_t) = 0, \\quad \\text{Var}(a_t) = \\sigma_a^2$$\n\n所以有\n\
    \n$$E(r_t) = \\phi_0 + \\phi_1 E(r_{t-1}) + \\phi_2 E(r_{t-2}) + \\dots + \\phi_p\
    \ E(r_{t-p})$$\n\n根据平稳性的性质，又有 $E(r_t) = E(r_{t-1}) = \\dots = \\mu$，从而有\n\n$$\\\
    mu = \\phi_0 + \\phi_1 \\mu + \\phi_2 \\mu + \\dots + \\phi_p \\mu$$\n\n$$E(r_t)\
    \ = \\mu = \\frac{\\phi_0}{1 - \\phi_1 - \\phi_2 - \\dots - \\phi_p}$$\n\n对于上式，假定分母不为\
    \ 0，将下面的方程称为特征方程：\n\n$$1 - \\phi_1x - \\phi_2x - \\cdots - \\phi_{px} = 0$$\n\n\
    该方程所有解的倒数称为该模型的特征根。如果所有的特征根的模都小于 1，则该 AR($p$) 序列是平稳的。\n\n下面就用该方法检验上证指数日收益率序列的平稳性。通过如下代码得到图\
