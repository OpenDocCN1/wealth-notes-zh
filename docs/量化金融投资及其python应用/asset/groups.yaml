    # 内容简介


    本书全面介绍 Python 在量化金融投资中的应用。全书共分 20 章，主要内容包括：量化金融投资平台与 Python 工作环境、Python 基础知识与编程基础，量化金融投资程序包
    Python-NumPy 和 Python-SciPy 的应用，量化金融投资程序包 Python-Pandas 的基本数据结构及其在金融数据处理中的应用，金融时间序列分析、中国股市分析、机器学习神经网络算法、机器学习支持向量机
    SVM、欧式期权定价、函数插值、期权定价二叉树算法、偏微分方程显式差分法和隐式差分法、Black-Scholes 偏微分方程隐含差分法、优劣平台的量化金融投资、Alpha
    对冲模型、Signal 框架下的 Alpha 量化金融投资策略、量化金融投资组合优化等问题的 Python 应用。


    本书内容新颖、全面，实用性强，融理论、方法、应用于一体，可以供金融学、投资学、金融工程、保险学、经济学、财政学、财务管理、统计学、数量经济学、管理科学与工程、金融数学等专业的高年级本科生、研究生和金融专业硕士使用。


    本书封面贴有清华大学出版社防伪标签，无标签者不得销售。


