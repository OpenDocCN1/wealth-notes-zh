    # 4.3 优化知识


    优化问题在投资中可谓是根本问题。如果手上有众多可选的策略，应如何从中选择一个最好的策略进行投资呢？这时就需要利用一些优化技术针对给定的指标进行寻优。随着越来越多的金融数据的出现，机器学习逐渐应用于投资领域，在机器学习中，优化也是十分重要的一个部分。以下介绍一些常见的优化方法。虽然其中的例子是人工生成的，没有直接应用实际金融数据，但是足以展示优化方法。希望读者在实际中遇到优化问题时，能够基于这些简单的例子迅速上手。


    # 4.3.1 无约束优化问题


    所谓无约束优化问题指的是一个优化问题的寻优可行集合是目标函数自变量的定义域，即没有外部的限制条件。例如，求解优化问题


    Minimize  $f(x)=x^{2}-4.8x+1.2$


    就是一个无约束优化问题，而求解


    $$\begin{array}{l}\min \quad f(x)=x^{2}-4.8x+1.2\\\mathrm{s.~t.}\quad x \geqslant
    0\end{array}$$


    则是一个带约束的优化问题。本节更进一步假设考虑的问题全部是凸优化问题，即目标函数是凸函数，其自变量的可行集是凸集(关于凸优化问题的详细定义可参考斯坦福大学Stephen
    Boyd 教授的教材Convex Optimization，下载链接：http://stanford. edu/～boyd/ cvxbook)。


    下面以 Rosenbrock 函数


    $$f(x)=\sum_{i=1}^{N-1}\left(100\left(x_{i}-x_{i-1}^{2}\right)^{2}+\left(1-x_{i-1}\right)^{2}\right)$$


    作为寻优的目标函数来简要介绍在 SciPy 中使用优化模块 scipy. optimize 的方法。


    首先需要定义 Rosenbrock 函数：


    ```

    def rosen(x):

    """The Rosenbrock function"""

    return sum(100.*x[1:-1]-x[:-1]**2.0)***2.0 + (1-x[:-1])* *2.0)

    ```


    # 1. Nelder-Mead 单纯形法


    单纯形法是运筹学中求解线性规划问题的通用方法，这里的 Nelder-Mead 单纯形法与其并不相同，只是用到单纯形的概念。设定起始点 $x 0=[0.5,1.6,1.1,0.8,1.2]$，并进行最小化的寻优。这里''xtol''表示迭代收敛的容忍误差上限：


    ```

    x_0 = np.array([0.5, 1.6, 1.1, 0.8, 1.2])

    res = opt.minimize(rosen, x_0, method=''nelder-mead'', options={''xtol'': 1e-8,
    ''disp'': True})

    ```'
