    # 11.4 计算隐含波动率


    作为 Black-Scholes 期权定价最重要的参数，波动率 $\sigma$ 指的是标的资产本身的波动率。但是我们更关心的是当时的报价所反映的市场对波动率的估计，这个估计的波动率称为隐含波动率
    (Implied Volatility)。这个过程实际上是在 Black-Scholes 公式中假设另外 4 个参数是确定的且期权价格已知，反解 $\sigma$。


    对于欧式看涨期权而言，其价格为对应波动率的单调递增函数，所以这个求解过程是稳定可行的。一般来说可以用类似于试错法的方法来实现。在 SciPy 中提供了很多高效的算法，例如
    Brent 算法。代码如下：'
