    \ \"a:\"\nprint a\nb = np.array([[3.2, 1.5], [2.5, 4]])\nprint \"b:\"\nprint b\n\
    print \"a+b:\"\nprint a + b\n```\n\n```text\na:\n[[ 1. 2. ]\n[ 2. 4. ]]\nb:\n\
    [[ 3.2 1.5 ]\n[ 2.5 4. ]]\na+b:\n[[ 4.2 3.5 ]\n[ 4.5 8. ]]\n```\n\n这里可以发现，`a`\
    \ 中虽然仅有一个元素是浮点数，其余均为整数，但在处理中 Python 会自动将整数转换为浮点数（因为数组元素必须是同类型的），并且，两个二维数组相加要求各维大小相同。当然，在\
    \ NumPy 里这些运算符也可以对标量和数组进行操作，结果是数组的全部元素分别把这个标量进行运算。例如：\n\n```python\nprint \"3\
