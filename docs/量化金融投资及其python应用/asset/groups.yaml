    # 1. ARCH 模型的思想


    ARCH 模型的思想如下：


    +   (1) 资产收益率序列的扰动 $\{a_t\}$ 是序列不相关的，但是不独立。


    +   (2) $\{a_t\}$ 的不独立性可以用其延迟值的简单二次函数来描述。


    具体而言，一个 ARCH($m$)模型为


    $a_t = \alpha_m \sigma_t^2 = \alpha_0 + \alpha_1 \alpha_{t-1}^2 + \cdots + \alpha_m
    \sigma_{t-m}^2 > 0 \quad t > 0, \alpha_i \geqslant 0$


    其中，$\varepsilon_t$ 是均值为 0、方差为 1 的独立同分布 (Independent Identically Distributed, IId)
    的随机变量序列。通常假定其服从标准正态分布；$\sigma_t^2$ 为条件异方差。


    # 2. ARCH 模型效应


    从 ARCH 模型的结构看，过去的大大的平方扰动会导致信息 $a_t$ 出现大的条件异方差。从而 $a_t$ 有取绝对值较大的值的倾向。这意味着：在 ARCH
    的框架下，大的扰动会倾向于紧接着出现另一个大的扰动。这与波动率聚集的现象相似。


    所谓 ARCH 模型效应也就是条件异方差序列的序列相关性。


    # 7.6.3 ARCH 模型的建立及预测


    上面简单介绍了 ARCH 的原理，下面主要介绍如何在 Python 中实现。ARCH 模型的建立大致分为以下几步：


    +   (1) 通过检验数据的序列相关性建立一个均值方程，如有必要，对收益率序列建立一个计量经济模型（如 ARMA）来消除任何线性依赖。


    +   (2) 对均值方程的残差进行 ARCH 效应检验。


    +   (3) 如果具有 ARCH 效应，则建立波动率模型。


    +   (4) 检验拟合的模型，如有必要则进行改进。


    Python 的 ARCH 库提供了现成的方法（后面会介绍）。这里为了理解 ARCH，还是按上述流程来建模。


