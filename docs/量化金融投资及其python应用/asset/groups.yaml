  md: "\n# 约束是所有参数(权重)的总和为1。这可以用 minimize 函数的约定表达如下\n\n```python\ncons = ({'type':'eq',\
    \ 'fun':lambda x: np.sum(x)-1})\n# 将参数值(权重)限制在0和1之间. 这些值以元组的形式提供给最小化函数\nbnds =\
    \ tuple((0,1) for x in range(noa))\n# 优化函数调用中忽略的唯一输入是起始参数表列表(对权重的初始猜测). 本例使用简单的平均分布\n\
    opts = sco.minimize(min_sharpe, noa * [1./noa], method = 'SLSQP', bounds = bnds,\n\
    constraints = cons)\nopts\n```\n\n运行上述代码，得到如下结果：\n\n```\nOut[90]:\n      fun:\
    \ -1.8705646746229059\n          jac:array([[ 2.87091583e-02, 4.62549537e-01,\
    \ -4.63277102e-05,\n                2.12848186e-04, 0.00000000e+00]])\n      message:\
    \ 'Optimization terminated successfully.'\n      nfev:37\n      nit:6\n      njev:6\n\
    \      status:0\n      success:True\n          x:array([[ 8.45677695e-18, 0.00000000e+00,\
    \ 8.21263786e-01,\n                1.78736214e-01]])\n```\n\n输入如下代码：\n\n```python\n\
    opts['x'].round(3)\n```\n\n得到的最优组合权重向量为\n\n```\nOut[91]: array([0. , 0. , 0.821,\
    \ 0.179])\n```\n\n```python\n# 预期收益率、预期波动率和最优夏普比\nstatistics(opts['x']).round(3)\n\
    ```\n\n得到夏普比最大的组合的3个统计数据分别为\n\n```\nOut[92]: array([0.903, 0.483, 1.871])\n```\n\
    \n## 7. 风险（方差）最小的投资组合优化\n\n下面通过方差最小化选出最优投资组合：\n\n```python\ndef min_variance(weights):\n\
    \    return statistics(weights)[1]\noptv = sco.minimize(min_variance, noa * [1./noa],\
    \ method = 'SLSQP', bounds = bnds,\nconstraints = cons)\noptv\n```\n\n运行上面的代码，得到如下结果：\n\
    \n```\nOut[94]:\n          fun:0.14408796305920866\n          jac: array([[ 0.14040739,\
    \ 0.14094629, 0.15554342, 0.15803597, 0. ])\n      message: 'Optimization terminated\
    \ successfully.'\n      nfev:36\n      nit:6\n      njev:6\n      status:0\n \
    \     success:True\n      x:array([ 8.50485211e-01, 1.49514789e-01, 6.07153217e-18,\n\
    \                6.07153217e-18])\n```\n\n方差最小的最优组合权重向量及组合的统计数据分别为\n\n```python\n\
    optv['x'].round(3)\n```\n\n得到如下结果：\n\n```\nOut[95]: array([ 0.85, 0.15, 0., 0.\
    \ ])\n# 得到的预期收益率、波动率和夏普比\nstatistics(optv['x']).round(3)\n```\n\n得到如下结果：\n\n```\n\
    Out[96]: array([ 0.04, 0.14, 0.283])\n```\n\n## 8. 投资组合的有效边界（前沿）\n\n有效边界由既定的目标收益率下方差最小的投资组合构成。\n\
    \n在最优时采用两个约束：一是给定目标收益率，二是投资组合权重和为 1。\n\n```python\ndef min_variance(weights):\n\
    \    return statistics(weights)[1]\n# 在不同目标收益率水平 (target_returns) 循环时，最小化的一个约束条件会变化\n\
    target_returns = np.linspace(0.0,0.5,50)\ntarget_variance = []\nfor tar in target_returns:\n\
    \    cons = ({'type':'eq', 'fun':lambda x:statistics(x)[0] -tar},{'type':'eq',\
    \ 'fun':lambda x:np.sum(x)-1})\n    res = sco.minimize(min_variance, noa * [1./noa],\
    \ method = 'SLSQP ', bounds = bnds,\n    constraints = cons)\n    target_variance.append(res['fun'])\n\
    target_variance = np.array(target_variance)\n```\n\n在优化结果的图形中，以叉号表示构成的曲线是有效边界（目标收益率下最优的投资组合），以红星表示夏普比最大的投资组合，以黄星表示方差最小的投资组合。\n\
    \n```python\nplt.figure(figsize = (8,4))\n# 圆圈：蒙特卡洛随机产生的组合分布\nplt.scatter(port_variance,\
    \ port_returns, c = port_returns/port_variance,marker = 'o')\n# 叉号：有效边界\nplt.scatter(target_variance,target_returns,\
    \ c = target_returns/target_variance, marker = 'x')\n# 红星：标记夏普比最大的投资组合\nplt.plot(statistics(opts['x'])[1],\
    \ statistics(opts['x'])[0], 'r * ', markersize = 15.0)\n# 黄星：标记方差最小的投资组合\nplt.plot(statistics(optv['x'])[1],\
    \ statistics(optv['x'])[0], 'y * ', markersize = 15.0)\nplt.grid(True)\nplt.xlabel('expected\
    \ volatility')\nplt.ylabel('expected return')\nplt.colorbar(label = 'Sharpe ratio')\n\
    ```\n\n运行上面的代码，即得到如图 20-6 所示的图形。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_207_0.png)\n\
