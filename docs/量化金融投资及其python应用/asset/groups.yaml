    \ as sco\n# 最小化夏普比的负值\ndef min_sharpe(weights):\n   return - statistics(weights)[2]\n\
    # 约束是所有参数 (权重) 的总和为 1. 这可以用 minimize 函数的约定表达如下\ncons = ({'type':'eq', 'fun':lambda\
