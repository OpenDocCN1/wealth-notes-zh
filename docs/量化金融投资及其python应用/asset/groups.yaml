    \ 1.0\nrho = kappa * dt / dx / dx\n```\n\n### 15.1.1 矩阵求解\n\n虽然看上去形式只是变了一点，但是求解的问题有很大的变化。在每个时间点上，需要求解如下的线性方程组：\n\
    \n$AU_{k+1} = U_k$\n\n这里矩阵 A 为\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_165_0.png)\n\
    \n幸运的是，这是一个三对角矩阵，可以简单地利用高斯消去法求解。这里不详细讨论算法的步骤，细节可以在下面的 Python 类 TridiagonalSystem\
    \ 中了解到。\n\n```python\nclass TridiagonalSystem:\n    def __init__(self, udiag,\
    \ cdiag, ldiag):\n        # 三对角矩阵：\n        # udiag -- 上对角线\n        # cdiag --\
    \ 对角线\n        # ldiag -- 下对角线\n        assert len(udiag) == len(cdiag)\n    \
    \    assert len(cdiag) == len(ldiag)\n        self.udiag = udiag\n        self.cdiag\
    \ = cdiag\n        self.ldiag = ldiag\n        self.length = len(self.cdiag)\n\
    \n    def solve(self, rhs):\n        # 求解以下方程组\n        # A \\ dot x = rhs\n \
    \       assert len(rhs) == len(self.cdiag)\n        udiag = self.udiag.copy()\n\
    \        cdiag = self.cdiag.copy()\n        ldiag = self.ldiag.copy()\n      \
    \  b = rhs.copy()\n        # 消去下对角元\n        for i in range(1, self.length):\n\
    \            cdiag[i] -= udiag[i - 1] * ldiag[i] / cdiag[i - 1]\n            b[i]\
    \ -= b[i - 1] * ldiag[i] / cdiag[i - 1]\n        # 从最后一个方程开始求解\n        x = np.zeros(self.length)\n\
    \        x[self.length - 1] = b[self.length - 1] / cdiag[self.length - 1]\n  \
    \      for i in range(self.length - 2, -1, -1):\n            x[i] = (b[i] - udiag[i]\
    \ * x[i + 1]) / cdiag[i]\n        return x\n\n    def multiply(self, x):\n   \
    \     # 矩阵乘法\n        # rhs = A \\ dot x\n        assert len(x) == len(self.cdiag)\n\
    \        rhs = np.zeros(self.length)\n        rhs[0] = x[0] * self.cdiag[0] +\
    \ x[1] * self.udiag[0]\n        for i in range(1, self.length - 1):\n        \
    \    rhs[i] = x[i-1] * self.ldiag[i] + x[i] * self.cdiag[i] + x[i+1] * self.udiag[i]\n\
    \        rhs[self.length - 1] = x[self.length - 2] * self.ldiag[self.length -\
    \ 1] +\n        x[self.length - 1] * self.cdiag[self.length - 1]\n        return\
    \ rhs\n```\n\n### 15.1.2 隐式格式求解\n\n代码如下：\n\n```python\nfor k in range(0, M):\n\
