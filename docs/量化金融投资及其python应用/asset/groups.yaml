    \ = font, fontsize = 15)\n```\n\n运行上述代码，可以得到如图 11-3 所示的图形。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_138_0.png)\n\
    \n## 11.3 使用 SciPy 做仿真计算\n\n期权价格的计算方法中有一类称为蒙特卡洛方法。它利用随机抽样来模拟标的股票价格随机游走，以计算期权价格（未来的期望）。假设股票价格的随机游走满足以下公式：\n\
    \n$$ dS = rSdt + \\sigma S dW(t) $$\n\n利用仿真的方法可以模拟到期日的股票价格：\n\n$$ ST = S_0 \\\
    exp((r - 0.5\\sigma^2)T + zM\\sqrt{T}) $$\n\n这里的 z 是一个符合标准正态分布的随机数。这样就可以计算最后的期权价格：\n\
    \n$$ price = \\exp(-rT) \\sum \\max(ST_i - K, 0) $$\n\n可以利用 SciPy 库获取标准正态分布的随机数：\n\
    \n```python\nimport scipy\nscipy.random.randn(10)\n# array([ 0.48589959, 0.01139189,\
    \ -0.07989112, 0.83710622, -0.39082336, -0.07745921,\n# -0.38757171, 0.38351784,\
    \ 0.92320854, 0.33467714])\n\npylab.figure(figsize = (12, 8))\nrandomSeries =\
    \ scipy.random.randn(1000)\npylab.plot(randomSeries)\nprint u'均值：%.4f' % randomSeries.mean()\n\
    print u'标准差：%.4f' % randomSeries.std()\n```\n\n运行上面的代码，可以得到如下结果和如图 11-4 所示的图形。\n\
    \n![](img/123c8fbcf9c4e19d1d2636062a3e4340_139_0.png)\n\n均值：0.0171\n标准差：0.9825\n\
    \n结合 SciPy 和 NumPy 可以定义基于蒙特卡洛方法的期权定价算法：\n\n```python\n# 期权计算的蒙特卡洛方法\ndef call_option_pricer_monte_carlo(spot,\
    \ strike, maturity, r, vol, numOfPath=5000):\n    randomSeries = scipy.random.randn(numOfPath)\n\
    \    s_t = spot * np.exp((r - 0.5 * vol * vol) * maturity + randomSeries * vol\
    \ * np.sqrt(maturity))\n    sumValue = np.maximum(s_t - strike, 0.0).sum()\n \
    \   price = np.exp(-r * maturity) * sumValue / numOfPath\n    return price\n\n\
    print('期权价格(蒙特卡洛): %.4f' % call_option_pricer_monte_carlo(spot, strike, maturity,\
    \ r, vol))\n```\n\n代码运行结果如下：\n期权价格(蒙特卡洛)：0.1142\n\n下面看一看从 1000 次模拟到 50000 次模拟的结果，每个模拟次数运行\
    \ 100 遍。代码如下：\n\n```python\npathScenario = range(1000, 50000, 1000)\nnumberOfTrials\
    \ = 100\nconfidenceIntervalUpper = []\nconfidenceIntervalLower = []\nmeans = []\n\
    \nfor scenario in pathScenario:\n    res = np.zeros(numberOfTrials)\n    for i\
    \ in range(numberOfTrials):\n        res[i] = call_option_pricer_monte_carlo(spot,\
    \ strike, maturity, r, vol, numOfPath=scenario)\n    means.append(res.mean())\n\
    \    confidenceIntervalUpper.append(res.mean() + 1.96 * res.std())\n    confidenceIntervalLower.append(res.mean()\
    \ - 1.96 * res.std())\n\npylab.figure(figsize = (12, 8))\n# 绘图\ntabel = np.array([means,\
    \ confidenceIntervalUpper, confidenceIntervalLower]).T\npylab.plot(pathScenario,\
    \ tabel)\npylab.title(u'期权计算蒙特卡洛模拟', fontproperties = font, fontsize = 18)\npylab.legend([u'均值',\
    \ u'95% 置信区间上界', u'95% 置信区间下界'], prop = font)\npylab.ylabel(u'价格', fontproperties\
    \ = font, fontsize = 15)\npylab.xlabel(u'模拟次数', fontproperties = font, fontsize\
    \ = 15)\npylab.grid(True)\n```\n\n运行上述代码，可以得到如图 11-5 所示的图形。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_140_0.png)\n\
    \n从图 11-5 中可以看到，随着模拟次数的上升，模拟结果逐渐收敛，模拟结果的置信区间也在逐渐收敛。\n\n## 11.4 计算隐含波动率\n\n作为 Black-Scholes\
    \ 期权定价最重要的参数，波动率 $\\sigma$ 指的是标的资产本身的波动率。但是我们更关心的是当时的报价所反映的市场对波动率的估计，这个估计的波动率称为隐含波动率\
    \ (Implied Volatility)。这个过程实际上是在 Black-Scholes 公式中假设另外 4 个参数是确定的且期权价格已知，反解 $\\\
    sigma$。\n\n对于欧式看涨期权而言，其价格为对应波动率的单调递增函数，所以这个求解过程是稳定可行的。一般来说可以用类似于试错法的方法来实现。在 SciPy\
    \ 中提供了很多高效的算法，例如 Brent 算法。代码如下：\n\n```python\nfrom scipy.optimize import brentq\n\
    \n# 目标函数, 目标价格由 target 确定\nclass cost_function:\n    def __init__(self, target):\n\
    \        self.targetValue = target\n\n    def __call__(self, x):\n        return\
    \ call_option_pricer(spot, strike, maturity, r, x) - self.targetValue\n\n# 假设使用\
    \ vol 初值作为目标\ntarget = call_option_pricer(spot, strike, maturity, r, vol)\ncost_sample\
    \ = cost_function(target)\n\n# 使用 Brent 算法求解\nimpliedVol = brentq(cost_sample,\
    \ 0.01, 0.5)\nprint u'真实波动率: %.2f' % (vol*100,) + '%'\nprint u'隐含波动率: %.2f' %\
    \ (impliedVol*100,) + '%'\n```\n\n运行上面的代码, 可以得到如下结果：\n\n真实波动率：25.00 %\n隐含波动率：25.00\
    \ %\n\n# 练习题\n\n对本章中的例题数据, 使用 Python 重新操作一遍。\n\n# 第 12 章 函数插值的 Python 应用\n\n本章将介绍量化金融投资的常用工具——函数插值，然后将函数插值应用于一个实际的金融建模环境中，即构造波动率曲面。\n\
    \n通过本章的学习，可以掌握以下知识：\n- 如何在 SciPy 中使用函数插值模块 `interpolate`。\n- 波动率曲面构造的原理。\n- 将\
    \ `interpolate` 应用于波动率曲面构造。\n\n## 12.1 如何使用 SciPy 做函数插值\n\n函数插值，即在离散数据的基础上构造连续函数，以估算出函数在其他点处的近似值。在\
    \ SciPy 中，所有与函数插值相关的功能都在 `scipy.interpolate` 模块中。首先导入模块：\n\n```python\nfrom scipy\
    \ import interpolate\ndir(interpolate)[:5]\n```\n\n可以得到如下结果：\n\n['Akima1DInterpolator',\
    \ 'BPoly', 'BarycentricInterpolator', 'BivariateSpline', 'CloughTocher2DInterpolator']\n\
    \n本章只作一般性介绍，只关注 `interpolate.spline` 的使用，即样条插值方法。先来看一下样条插值的版本：\n\n```python\n\
    print interpolate.spline.__doc__\n# Interpolate a curve at new points using a\
    \ spline fit\n# ...\n```\n\n样条插值方法的主要参数如下：\n- (1) `xk` 为离散的自变量值，是一个序列。\n- (2)\
    \ `yk` 为对应 `xk` 的函数值，是与 `xk` 长度相同的序列。\n- (3) `xnew` 为需要进行插值的自变量值序列。\n- (4) `order`\
    \ 为样条插值使用的函数基的阶数，为 1 时使用线性函数。\n\n先用一个实际的示例来说明如何在 SciPy 中使用函数插值。这里的目标函数是三角函数：\n\
    \n$$ f(x) = \\sin x $$\n\n假设我们已经观测到 $f(x)$ 在离散点 $x = 1, 3, 5, 7, 9, 11, 13$ 的值。代码如下：\n\
    \n```python\nimport numpy as np\nfrom matplotlib import pylab\nimport seaborn\
    \ as sns\nfrom CAL.PyCAL import *\nfont.set_size(20)\n\nx = np.linspace(1.0, 13.0,\
    \ 7)\ny = np.sin(x)\npylab.figure(figsize = (12, 6))\npylab.scatter(x, y, s =\
    \ 85, marker = 'x', color = 'r')\npylab.title(u'$f(x)$ 离散点分布', fontproperties\
    \ = font)\n```\n\n运行上述代码，可以得到如图 12-1 所示的图形。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_143_0.png)\n\
    \n首先使用最简单的线性插值算法，这时只要将 `spline` 的参数 `order` 设置为 1 即可：\n\n```python\nxnew = np.linspace(1.0,\
    \ 13.0, 500)\nynewLinear = interpolate.spline(x, y, xnew, order = 1)\nynewLinear[:5]\n\
    ```\n\n运行上述代码，可以得到如下结果：\n\narray([ 0.84147098,  0.83304993,  0.82462888, 0.81620782,\
    \ 0.80778677])\n\n阶数更高时即为样条插值，也是 `spline` 函数默认的方法，这里将 `order` 设置为 3 即可：\n\n```python\n\
    ynewCubicSpline = interpolate.spline(x, y, xnew, order = 3)\nynewCubicSpline[:5]\n\
    ```\n\n运行上述代码，可以得到如下结果：\n\narray([ 0.84147098, 0.86598588, 0.88928385, 0.91138025,\
    \ 0.93229042])\n\n最后获得真实的 $\\sin x$ 的值：\n\n```python\nynewReal = np.sin(xnew)\n\
    ynewReal[:5]\n```\n\n运行上述代码，可以得到如下结果：\n\narray([ 0.84147098, 0.85421967, 0.86647437,\
    \ 0.87822801, 0.88947378])\n\n把所有的函数曲线画到一起，看一下插值的效果。对于这个例子中的目标函数而言，由于目标函数曲线是光滑的，则越高阶的样条插值的方法插值效果越好。\n\
    \n```python\npylab.figure(figsize = (16, 8))\npylab.plot(xnew, ynewReal)\npylab.plot(xnew,\
    \ ynewLinear)\npylab.plot(xnew, ynewCubicSpline)\npylab.scatter(x, y, s = 160,\
