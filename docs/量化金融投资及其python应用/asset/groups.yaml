    3.0\n```\n\n> **注意：** 上面的语句直接输入 sqrt(9) 是会报错的，前面要带“math.”前缀。那么有什么办法可以不用每次都带前缀呢？解决办法是用“from\
    \ 模块 import 函数”命令先导入函数。\n\n```python\nfrom math import sqrt\nsqrt(9)\n3.0\n```\n\
    \n这样每次使用 sqrt 函数的时候就不用再加“math.”前缀了。然而 math 模块下面有很多函数，是否可以写一个语句使 math 下面的所有函数都可以直接使用？下面的办法可以一次导入模块中的所有函数：\n\
    \n```python\nfrom math import *\nprint(sqrt(9))\nprint(floor(32.9))\n3.0\n32.0\n\
    ```\n\n## 2.2 Python 容器\n\n### 1. 什么是容器\n\nPython 中有一种名为容器的数据结构，顾名思义，容器就是装数据的器具，它主要包括序列和词典，其中序列又主要包括列表、元组、字符串等。\n\
    \n- 列表的基本形式示例：[1, 3, 6, 10] 或者 ['yes', 'no', 'OK']。\n- 元组的基本形式示例：(1, 3, 6, 10)\
    \ 或者 ('yes', 'no', 'OK')。\n- 字符串的基本形式示例：'hello'。\n\n以上几种属于序列，序列中的每一个元素都被分配一个序号，即元素的位置，也称为索引。第一个索引，即第一个元素的位置是\
    \ 0，第二个是 1，依此类推。列表和元组的区别主要在于，列表可以修改，而元组不能（注意列表用方括号“[]”而元组用圆括号“()”）。利用序列的这个特点，就可以通过索引来访问序列中的某个或某几个元素，例如：\n\
    \n```python\na = [1, 3, 6, 10]\na[2]\n# Out[2]: 6\nb = (1, 3, 6, 10)\nb[2]\n#\
    \ 6\nc = 'hello'\nc[0:3]\n# Out[2]: 'hel'\n```\n\n与序列对应的字典则不一样，它是一个无序的容器，它的基本形式示例：d\
    \ = {7:'seven', 8:'eight', 9:'nine'}。这是一个“键-值”映射的结构，因此字典不能通过索引访问其中的元素，而要通过键访问其中的元素：\n\
    \n```python\nd = {7: 'seven', 8: 'eight', 9: 'nine'}\nd[8]\n# Out[2]: 'eight'\n\
    ```\n\n### 2. 序列的通用操作\n\n列表、元组、字符串等有一些共同的操作。\n\n1）索引\n\n序列的最后一个元素的索引也可以用 -1，倒数第二个元素可以用\
    \ -2，依此类推。\n\n例如：\n\n```python\na = [1, 3, 6, 10]\nprint(a[3])\nprint(a[-1])\n\
    10\n10\n```\n\n2）分片\n\n分片操作用来访问一定范围内的元素，它的格式为：\n\n```text\n序列名[开始索引:结束索引:步长]\n\
    ```\n\n表示在从开始索引所指的元素到结束索引所指的元素之间，以指定的步长访问该序列中的元素。步长可以省略，默认步长为 1。\n\n```python\n\
    c = 'hello'\nc[0:3]\n# Out[2]: 'hel'\n```\n\n这就像把一个序列分成几片，所以叫作分片。\n\n3）序列相加\n\n\
    序列相加即两个序列合并在 一起，相同类型的序列才能相加。例如：\n\n```python\n[1, 2, 3] + [4, 5, 6]\n# Out[2]:\
    \ [1, 2, 3, 4, 5, 6]\n'hello,' + 'world!'\n# Out[3]: 'hello,world!'\n```\n\n4）成员资格\n\
    \n为了检查一个值是否在序列中，可以用 in 运算符。例如：\n\n```python\na = 'hello'\nprint('o' in a)\nTrue\n\
    print('t' in a)\nFalse\n```\n\n### 3. 列表操作\n\n以上是序列共有的操作，列表还有一些自己独有的操作。\n\n1）list\
    \ 函数\n\n可以通过 list 函数把一个序列转换成一个列表：\n\n```python\nlist('hello')\n# Out[6]: ['h',\
    \ 'e', 'l', 'l', 'o']\n```\n\n2）元素删除、赋值\n\n元素删除命令格式：del 列表名[索引号]。\n\n元素赋值命令格式：列表名[索引号]\
    \ = 值。\n\n例如：\n\n```python\na\n# Out[8]: 'hello'\nb = list(a)\nb\n# Out[10]: ['h',\
    \ 'e', 'l', 'l', 'o']\ndel b[2]\nb\n# Out[12]: ['h', 'e', 'l', 'o']\nb[2] = 't'\n\
    b\n# Out[14]: ['h', 'e', 't', 'o']\n```\n\n3）分片赋值\n\n命令格式为：\n\n```python\n列表名[开始索引号:结束索引号]\
    \ = list(值)\n```\n\n分片赋值为列表的某一范围内的元素赋值，即为从开始索引号到结束索引号区间内的几个元素赋值。例如，把 hello 变成\
    \ heyyo：\n\n```python\nb = list('hello')\nb\n# Out[16]: ['h', 'e', 'l', 'l', 'o']\n\
    b[2:4] = list('yy')\nb\n# Out[18]: ['h', 'e', 'y', 'y', 'o']\n```\n\n> **注意：**\
    \ 虽然 ll 处于 hello 这个单词的第 2、3 号索引的位置，但赋值时是用 b[2:4] 而不是 b[2:3]（即“含头不含尾”）；另外，要注意 list\
    \ 后面用圆括号。\n\n4）列表方法\n\n上面介绍的 list 是一个函数。函数在很多语言中都有，例如 Excel 里面的 if 函数、vlookup\
    \ 函数，SQL 里面的 count 函数，以及各种语言中都有的 sqrt 函数，等等，Python 中也有很多函数。\n\nPython 中的方法是与某些对象有紧密联系的函数，所以列表方法也就是属于列表的函数，它可以对列表执行一些比较深入的操作。方法的调用格式如下：\n\
    \n```text\n对象.方法(参数)\n```\n\n列表方法的调用格式如下：\n\n```text\n列表.方法(参数)\n```\n\n下面介绍常用的列表方法，以\
    \ a=['h','e','l','l','o'] 为例来说明。\n\n```python\na = ['h', 'e', 'l', 'l', 'o']\n\
    a\n# Out[20]: ['h', 'e', 'l', 'l', 'o']\n```\n\n在列表 a 的索引 2 位置插入一个元素 t：\n\n```python\n\
    a.insert(2, 't')\na\n# Out[22]: ['h', 'e', 't', 'l', 'l', 'o']\n```\n\n在列表的最后添加元素\
    \ q：\n\n```python\na.append('q')\na\n# Out[24]: ['h', 'e', 't', 'l', 'l', 'o',\
    \ 'q']\n```\n\n返回 a 列表中元素 e 第一次出现的索引位置：\n\n```python\na.index('e')\n# Out[25]:\
