    DataFrame values:\n[[nan nan]\n [4.0 nan]\n [1.0 nan]]\n```\n\nDataFrame 也可以从值是数组的字典创建，但是各个数组的长度应相同：\n\
    \n```python\nd = {'one': [1., 2., 3., 4.], 'two': [4., 3., 2., 1.]}\ndf = DataFrame(d,\
