    text{-}11)$$\n\n式中 $\\eta$ 为学习因子。\n\n从式(9-10)可知，$w_{jk}$ 是 $j$ 个神经元与输出层第 $k$ 个神经元之间的连接权，它只与输出层中的一个神经元有关，将式(9-5)代入式(9-10)，并利用式(9-3)，有\n\
    \n$$\\frac{\\partial E}{\\partial w_{jk}} = \\sum_{p} \\frac{\\partial E_p}{\\\
    partial y_k^p} \\cdot \\frac{\\partial y_k^p}{\\partial u_k^p} \\cdot \\frac{\\\
    partial u_k^p}{\\partial w_{jk}} = \\sum_{p} (t_k^p - y_k^p) f'(u_k^p) z_j^p \\\
    quad (9\\text{-}12)$$\n\n式中，$u_k^p = \\sum_{j=0}^{l} w_{jk} z_j^p$, $z_j^p$ 为样本输入网络时\
    \ $z_j$ 的输出值。\n\n$$f'(u_k^p) = \\frac{e^{-u_k^p}}{(1+e^{-u_k^p})^2} = f(u_k^p)[1-f(u_k^p)]\
    \ = y_k^p(1-y_k^p) \\quad (9\\text{-}13)$$\n\n将式(9-13)、式(9-12)代入式(9-10)，有\n\n\
    $$w_{jk} (g+1) = w_{jk} (g) + \\eta \\sum_{p} \\delta_{jk}^p z_j^p \\quad (9\\\
    text{-}14)$$\n\n式中，$\\delta_{jk}^p = (t_k^p - y_k^p) y_k^p (1-y_k^p)$。\n\n同理可得\n\
    \n$$w_{ij} (g+1) = w_{ij} (g) + \\eta \\sum_{p=1}^{P} \\delta_{ij}^p z_j^p \\\
    quad (9\\text{-}15)$$\n\n式中，$\\delta_{ij}^p = z_j^p (1-z_j^p) \\sum_{k=1}^{m}\
    \ \\delta_{jk}^p w_{jk}$\n\nBP算法权值修正系数可以统一表示为\n\n$$w_{ij} (t+1) = w_{ij} (t) +\
    \ \\eta \\delta_{ij} x_i \\quad (9\\text{-}16)$$\n\n对于输出层：\n\n$$\\delta_{kj} =\
    \ (T_{kj} - y_{kj}) f'(u_{kj})[1-f(u_{kj})]$$\n\n对于隐含层：\n\n$$\\delta_{ij} = f(u_{ij})[1-f(u_{ij})]\
    \ \\sum_{k} \\delta_{kj} w_{jk}$$\n\n在实际应用中，考虑到学习过程的收敛性，学习因子 $\\eta$ 取值越小越好。$\\\
    eta$ 值越大，每次权值改变越剧烈，可能导致学习过程发生振荡。因此，为了使学习因子取得足够大同时又不产生振荡，通常在权值修正公式(9-16)中再另加一个动量项\
    \ $\\alpha$，得\n\n$$w_{ij} (t+1) = w_{ij} (t) + \\eta \\delta_{ij} x_i + \\alpha\
    \ [w_{ij} (t) - w_{ij} (t-1)] \\quad (9\\text{-}17)$$\n\n式中，$\\eta$ 为学习因子，$\\\
    alpha$ 为动量项，它决定上一次学习的权值变化对本次权值更新的影响程度。通常取 $0<\\eta<1, 0<\\alpha<1$。\n\n通常用网络的均方根误差定量地反映学习的性能。其定义为\n\
    \n$$E(W) = \\sqrt{\\frac{\\sum_{p} \\sum_{k=1}^{m} (t_{pk} - y_{pk})^2}{pm}}$$\n\
    \n式中，$p$ 表示输入学习样本数，$m$ 表示网络输出层单元数。\n\n在BP网络学习过程中，按梯度最速下降法，均方根误差应逐渐减小。由于网络输入、输出都是实数值，网络学习能否满足性能要求不是一个简单的二值判断能确定的，而是由网络的实际输出与期望输出的逼近程度决定的。一般地，当网络的均方根误差\
    \ $E(W)$ 值低于 0.1 时，则表明给定输入样本学习已满足要求。当然，$E(\\mathbf{W})$ 的上限可以根据具体应用灵活设置。\n\n###\
    \ 9.3 BP神经网络的学习程序\n\nBP神经网络的学习程序分为两大步，第一步是从网络的输入层逐步向输出层进行计算；第二步是对连接权和阈值进行修改，即反向从输出层向输入层进行计算和修改。根据输出层的误差修改与输出层相连接的权值，然后按照式(9-14)、式(9-15)修改各层的连接权值，直到满足要求为止。具体的学习流程步骤如下。\n\
    \n- (1) 初始化网络及学习参数：初始的权值 $W$ 和阈值 $\\theta$、学习因子 $\\eta$、动量项 $\\alpha$。\n- (2)\
    \ 在已知 $P$ 个学习(训练)样本中按顺序抽取学习样本 $x_1^1, x_2^1, \\cdots, x_t^p$ 输入到网络输入层。\n- (3)\
    \ 按式计算 $z_j$ 和 $y_k$：\n\n  $$z_j = f\\left(\\sum_{i=1}^{n} w_{ij} x_i - \\theta_j\\\
    right)$$\n  $$y_k = f\\left(\\sum_{j=1}^{l} w_{jk} z_j - \\theta_k\\right)$$\n\
    \n  式中，$n$ 为输入的样本个数，$\\theta_j$ 为输入层与隐含层之间的阈值，$\\theta_k$ 为隐含层到输出层的阈值，$l$ 为隐含层的神经元个数。\n\
    \n- (4) 求出各层的误差，对已知样本的教师 $t$，有：\n\n  $$\\delta_k^p = (t_k^p - y_k^p) y_k^p(1 -\
    \ y_k^p) \\quad (9\\text{-}18)$$\n  $$\\delta_j^p = z_j^p(1 - z_j^p) \\sum_{k=1}^{m}\
    \ \\delta_k^p w_{jk} \\quad (9\\text{-}19)$$\n\n  式中，$m$ 为输出层的神经元个数，本问题取 $m=1$。\n\
    \n- (5) 记下学习过的样本个数，即计数为 $p_1+1$，看 $p_1+1$ 是否达到了设定的学习样本数 $P$，如果没有达到 $P$，返回步骤(2)继续运算；如果达到了，再从第一个学习样本开始让\
    \ $p_1=1$，进行下一步骤。\n- (6) 按式(9-18)与式(9-19)修改各层的权值和阈值。\n- (7) 按新的权值计算 $z_j$、$y_k$\
    \ 和 $E$。\n- (8) 计算网络的均方根误差 $E(\\mathbf{W})$：\n\n  $$E(\\mathbf{W}) = \\sqrt{\\\
    frac{\\sum_{p}\\sum_{k=1}^{m}\\left(t_{pk} - y_{pk}\\right)^2}{pm}}$$\n\n其学习流程图如图\
    \ 9-2 所示。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_126_0.png)\n\n### 9.4 BP神经网络算法股票预测的\
