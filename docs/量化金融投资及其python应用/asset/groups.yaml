    现在问题来了，明明改的是 a[0][1]，怎么连 b[0][1] 也跟着变了？这个陷阱在 Python 编程中很容易碰上，其原因在于 Python 不是真正将
    a 复制一份给 b，而是将 b 指向 a 对应数据的内存地址。想要真正将 a 复制给 b，可以使用 copy 函数：


    ```

    a = np.array([[[3.2, 1.5], [2.5, 4]]])

    b = a.copy()

    a[0][1] = 2.0

    print "a:"

    print a

    print "b:"

    print b

    a:

    [[ 3.2  2. ]

    [  2.5  4. ]]

    b:

    [[ 3.2  1.5]

    [  2.5  4. ]]

    ```


    若对 a 重新赋值，则会将 a 指向其他地址，而 b 仍在原来的地址：


    ```

    a = np.array([[[3.2, 1.5], [2.5, 4]]])

    b = a

    a = np.array([[[2, 1], [9, 3]]])

    print "a:"

    print a

    print "b:"

    print b

