    Rosenbrock 函数的性能比较好，简单的优化方法就可以处理了，还可以在 `minimize` 中使用 `method='powell'` 来指定使用\
    \ Powell 方法。这两种简单的方法并不使用函数的梯度，在稍微复杂的情形下收敛速度比较慢，下面介绍利用函数梯度进行寻优的方法。\n\n#### 2. Broyden-Fletcher-Goldfarb-Shanno\
    \ 法\n\nBroyden-Fletcher-Goldfarb-Shanno (BFGS) 法用到了函数梯度信息。首先求 Rosenbrock 函数的梯度：\n\
