    \n### 7.2.4 拟合优度及预测\n\n#### 1. 拟合优度\n\n使用下面的统计量来衡量拟合优度：\n\n$$R^2 = 1 - \\frac{\\\
    text{残差的平方和}}{\\text{总的平方和}}$$\n\n但是，对于一个给定的数据集，$R^2$ 是用参数个数的非降函数，为了克服该缺点，推荐使用调整后的\
    \ $R^2$：\n\n$$R^2_{Adj} = 1 - \\frac{\\text{残差的方差}}{\\text{总的方差}}$$\n\n它的值在 0、1\
    \ 之间，越接近 1，拟合效果越好。\n\n下面计算之前的上证指数日收益率的 AR 模型的拟合优度：\n\n```python\nscore = 1 - delta.var()/temp[17:].var()\n\
