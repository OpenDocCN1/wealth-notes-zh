    \n## 第9章 机器学习神经网络算法及其 Python 应用\n\n### 9.1 BP神经网络的拓扑结构\n\n人工神经网络是在生物神经系统的启发下发展起来的一种信息处理方法。它不需要构建任何数学模型,只靠过去的经验来学习,可以处理模糊的、非线性的、含有噪声的数据,可用于评价、预测、分类、模式识别、过程控制等各种数据处理的场合。人工神经网络理论研究发展相当迅速,据统计,到目前为止已经提出了\
    \ 30 多种神经网络,其中最流行的有十几种。BP 神经网络(Back Propagation,反向传播)是当前应用最为广泛的一种神经网络,它的结构简单,工作状态最易于硬件实现。其应用范围主要有识别分类、评价、预测、非线性映射、复杂系统仿真等。因此,本章应用\
    \ BP 神经网络来研究现金流因素分析的分类问题。\n\nBP 神经网络是典型的多层网络,分为输入层、隐含层和输出层,层与层之间多采用全互连方式,同一层单元之间不存在相互连接,BP\
    \ 神经网络的拓扑结构如图 9-1所示。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_123_0.png)\n\n\
    设输入向量为 $X \\in R^n, X=(x_1, x_2, \\cdots, x_n)^T$; 隐含层有神经元 $Z \\in R^l, Z=(z_1,\
    \ z_2, \\cdots, z_l)^T$; 输出层有神经元 $Y \\in R^m, Y=(y_1, y_2, \\cdots, y_m)^T$。设输入层与隐含层之间的连接权为\
    \ $w_{ij}$,阈值为 $\\theta_j$; 隐含层与输出层之间的连接权为 $w_{jk}$, 阈值为 $\\theta_k$。各层神经元的输出满足\n\
    \n$$z_j=f\\left(\\sum_{i=1}^{n} w_{ij} x_i-\\theta_j\\right) \\tag{9-1}$$\n\n\
    $$y_k=f\\left(\\sum_{j=1}^{l} w_{jk} z_j-\\theta_k\\right) \\tag{9-2}$$\n\n函数\
    \ $f(\\cdot)$ 满足\n\n$$f(u_j)=\\frac{1}{1+e^{-u_j}} \\tag{9-3}$$\n\n如果近似映射函数为 $F,\
    \ X$ 为 $n$ 维空间的有界子集, $F(x)$ 为 $m$ 维空间的有界子集, $Y = F(x)$ 可写为\n\n$$F: X \\subset\
    \ R^n \\rightarrow Y \\subset R^m$$\n\n通过 $P$ 个实际的映射对 $(x^1, y^1), (x^2, y^2),\
    \ \\cdots, (x^p, y^p)$ 进行训练, 目的是获得神经元之间的连接权 $w_{ij}$、$w_{jk}$ 和阈值 $\\theta_j$、$\\\
    theta_k$ $(i=1,2,\\cdots,n; j=1,2,\\cdots,l; k=1,2,\\cdots,m)$，使其映射获得成功，即寻找一个\
    \ $F$，进行 $n$ 维输入向量到 $m$ 维输出向量空间的变换：\n\n$$F:R^n \\rightarrow R^m \\quad Y = F(x)$$\n\
    \n训练后获得连接权，对其他不属于 $P$ 个样本的 $X$ 子集进行测试，使其结果仍然满足正确的映射。\n\n### 9.2 BP 神经网络的学习算法\n\
    \nBP 神经网络学习是典型的有导师学习，其学习算法是对简单的 $\\delta$ 学习规则的推广和发展。设输入学习样本为 $p$ 个，即 $x^1$，$x^2$，$\\\
    cdots$，$x^p$，已知与其对应的教师为 $T^1$，$T^2$，$\\cdots$，$T^p$，学习算法是根据实际的输出 $y^1$，$y^2$，$\\\
    cdots$，$y^p$ 与 $T^1$，$T^2$，$\\cdots$，$T^p$ 的误差来修改其连接权和阈值，使 $y^p$ 与要求的 $T^p$ 尽可能接近。\n\
    \n为便于讨论，将阈值写入连接权中，约定：$\\theta_j=w_{0j}$，$\\theta_k=w_{0k}$，$z_0=-1$，$x_0=-1$，则式\
    \ (9-1) 和式 (9-2) 可改写为\n\n$$z_j = f\\left(\\sum_{i=0}^{n}w_{ij}x_i\\right) \\quad\
    \ (9\\text{-}1a)$$\n\n$$y_k = f\\left(\\sum_{j=0}^{l}w_{jk}z_j\\right) \\quad\
    \ (9\\text{-}1b)$$\n\n当第 $p$ 个样本输入到图 9-1 所示的网络时得到输出 $y_k$，$k=1,2,\\cdots,m$，其误差为各输出单元误差之和，满足\n\
    \n$$E_p = \\frac{1}{2}\\sum_{k=1}^{m}\\left(t_k^p-y_k^p\\right)^2 \\quad (9\\\
    text{-}4)$$\n\n则网络总误差为\n\n$$E = \\sum_{p}E_p = \\frac{1}{2}\\sum_{p}\\sum_{k=1}^{m}\\\
    left(t_k^p-y_k^p\\right)^2 \\quad (9\\text{-}5)$$\n\n设 $w_{sh}$ 为图 9-1 所示的网络中任意两个神经元之间的连接权，$w_{sh}$\
    \ 也包括阈值在内，$E$ 为一个与 $w_{sh}$ 有关的非线性误差函数。\n\n令\n\n$$\\varepsilon_p = \\frac{1}{2}\\\
    sum_{k=1}^{m}\\left(t_k^p-y_k^p\\right)^2 = E_p \\quad (9\\text{-}6)$$\n\n$$E\
    \ = \\sum_{p}E_p = \\sum_{p}\\varepsilon(W, t^p, x^p) \\quad (9\\text{-}7)$$\n\
    \n$$\\mathbf{W} = (w_{11},\\cdots,w_{sh})^T \\quad (9\\text{-}8)$$\n\n$\\delta$\
    \ 学习规则的实质是利用梯度最速下降法，使权值沿误差函数的负梯度方向改变。若权值 $w_{sh}$ 的修正值记为 $\\Delta w_{sh}$，则\n\n\
    $$\\Delta w_{sh} \\propto -\\frac{\\partial E}{\\partial w_{sh}} \\quad (9\\text{-}9)$$\n\
    \n令 $g$ 为运算的迭代次数，由式 (9-5) 和梯度最速下降法，可得到 BP 网络各层连接权的迭代公式：\n\n$$w_{jk}(g+1) = w_{jk}(g)\
    \ - \\eta\\frac{\\partial E}{\\partial w_{jk}} \\quad (9\\text{-}10)$$\n\n$$w_{ij}\
    \ (g+1) = w_{ij} (g) - \\eta \\frac{\\partial E}{\\partial w_{ij}} \\quad (9\\\
    text{-}11)$$\n\n式中 $\\eta$ 为学习因子。\n\n从式(9-10)可知，$w_{jk}$ 是 $j$ 个神经元与输出层第 $k$ 个神经元之间的连接权，它只与输出层中的一个神经元有关，将式(9-5)代入式(9-10)，并利用式(9-3)，有\n\
    \n$$\\frac{\\partial E}{\\partial w_{jk}} = \\sum_{p} \\frac{\\partial E_p}{\\\
    partial y_k^p} \\cdot \\frac{\\partial y_k^p}{\\partial u_k^p} \\cdot \\frac{\\\
    partial u_k^p}{\\partial w_{jk}} = \\sum_{p} (t_k^p - y_k^p) f'(u_k^p) z_j^p \\\
    quad (9\\text{-}12)$$\n\n式中，$u_k^p = \\sum_{j=0}^{l} w_{jk} z_j^p$, $z_j^p$ 为样本输入网络时\
    \ $z_j$ 的输出值。\n\n$$f'(u_k^p) = \\frac{e^{-u_k^p}}{(1+e^{-u_k^p})^2} = f(u_k^p)[1-f(u_k^p)]\
    \ = y_k^p(1-y_k^p) \\quad (9\\text{-}13)$$\n\n将式(9-13)、式(9-12)代入式(9-10)，有\n\n\
    $$w_{jk} (g+1) = w_{jk} (g) + \\eta \\sum_{p} \\delta_{jk}^p z_j^p \\quad (9\\\
    text{-}14)$$\n\n式中，$\\delta_{jk}^p = (t_k^p - y_k^p) y_k^p (1-y_k^p)$。\n\n同理可得\n\
    \n$$w_{ij} (g+1) = w_{ij} (g) + \\eta \\sum_{p=1}^{P} \\delta_{ij}^p z_j^p \\\
    quad (9\\text{-}15)$$\n\n式中，$\\delta_{ij}^p = z_j^p (1-z_j^p) \\sum_{k=1}^{m}\
    \ \\delta_{jk}^p w_{jk}$\n\nBP算法权值修正系数可以统一表示为\n\n$$w_{ij} (t+1) = w_{ij} (t) +\
    \ \\eta \\delta_{ij} x_i \\quad (9\\text{-}16)$$\n\n对于输出层：\n\n$$\\delta_{kj} =\
    \ (T_{kj} - y_{kj}) f'(u_{kj})[1-f(u_{kj})]$$\n\n对于隐含层：\n\n$$\\delta_{ij} = f(u_{ij})[1-f(u_{ij})]\
    \ \\sum_{k} \\delta_{kj} w_{jk}$$\n\n在实际应用中，考虑到学习过程的收敛性，学习因子 $\\eta$ 取值越小越好。$\\\
    eta$ 值越大，每次权值改变越剧烈，可能导致学习过程发生振荡。因此，为了使学习因子取得足够大同时又不产生振荡，通常在权值修正公式(9-16)中再另加一个动量项\
    \ $\\alpha$，得\n\n$$w_{ij} (t+1) = w_{ij} (t) + \\eta \\delta_{ij} x_i + \\alpha\
    \ [w_{ij} (t) - w_{ij} (t-1)] \\quad (9\\text{-}17)$$\n\n式中，$\\eta$ 为学习因子，$\\\
    alpha$ 为动量项，它决定上一次学习的权值变化对本次权值更新的影响程度。通常取 $0<\\eta<1, 0<\\alpha<1$。\n\n通常用网络的均方根误差定量地反映学习的性能。其定义为\n\
    \n$$E(W) = \\sqrt{\\frac{\\sum_{p} \\sum_{k=1}^{m} (t_{pk} - y_{pk})^2}{pm}}$$\n\
    \n式中，$p$ 表示输入学习样本数，$m$ 表示网络输出层单元数。\n\n在BP网络学习过程中，按梯度最速下降法，均方根误差应逐渐减小。由于网络输入、输出都是实数值，网络学习能否满足性能要求不是一个简单的二值判断能确定的，而是由网络的实际输出与期望输出的逼近程度决定的。一般地，当网络的均方根误差\
    \ $E(W)$ 值低于 0.1 时，则表明给定输入样本学习已满足要求。当然，$E(\\mathbf{W})$ 的上限可以根据具体应用灵活设置。\n\n###\
    \ 9.3 BP神经网络的学习程序\n\nBP神经网络的学习程序分为两大步，第一步是从网络的输入层逐步向输出层进行计算；第二步是对连接权和阈值进行修改，即反向从输出层向输入层进行计算和修改。根据输出层的误差修改与输出层相连接的权值，然后按照式(9-14)、式(9-15)修改各层的连接权值，直到满足要求为止。具体的学习流程步骤如下。\n\
    \n- (1) 初始化网络及学习参数：初始的权值 $W$ 和阈值 $\\theta$、学习因子 $\\eta$、动量项 $\\alpha$。\n- (2)\
    \ 在已知 $P$ 个学习(训练)样本中按顺序抽取学习样本 $x_1^1, x_2^1, \\cdots, x_t^p$ 输入到网络输入层。\n- (3)\
    \ 按式计算 $z_j$ 和 $y_k$：\n\n  $$z_j = f\\left(\\sum_{i=1}^{n} w_{ij} x_i - \\theta_j\\\
    right)$$\n  $$y_k = f\\left(\\sum_{j=1}^{l} w_{jk} z_j - \\theta_k\\right)$$\n\
    \n  式中，$n$ 为输入的样本个数，$\\theta_j$ 为输入层与隐含层之间的阈值，$\\theta_k$ 为隐含层到输出层的阈值，$l$ 为隐含层的神经元个数。\n\
    \n- (4) 求出各层的误差，对已知样本的教师 $t$，有：\n\n  $$\\delta_k^p = (t_k^p - y_k^p) y_k^p(1 -\
    \ y_k^p) \\quad (9\\text{-}18)$$\n  $$\\delta_j^p = z_j^p(1 - z_j^p) \\sum_{k=1}^{m}\
    \ \\delta_k^p w_{jk} \\quad (9\\text{-}19)$$\n\n  式中，$m$ 为输出层的神经元个数，本问题取 $m=1$。\n\
    \n- (5) 记下学习过的样本个数，即计数为 $p_1+1$，看 $p_1+1$ 是否达到了设定的学习样本数 $P$，如果没有达到 $P$，返回步骤(2)继续运算；如果达到了，再从第一个学习样本开始让\
    \ $p_1=1$，进行下一步骤。\n- (6) 按式(9-18)与式(9-19)修改各层的权值和阈值。\n- (7) 按新的权值计算 $z_j$、$y_k$\
    \ 和 $E$。\n- (8) 计算网络的均方根误差 $E(\\mathbf{W})$：\n\n  $$E(\\mathbf{W}) = \\sqrt{\\\
    frac{\\sum_{p}\\sum_{k=1}^{m}\\left(t_{pk} - y_{pk}\\right)^2}{pm}}$$\n\n其学习流程图如图\
