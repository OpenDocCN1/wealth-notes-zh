  mdcn: '

    当前一切可利用的信息作为条件，并采用某种自回归形式来刻画方差的变异，对于一个时间序列而言，在不同时刻可利用的信息不同，而相应的条件方差也不同，利用 ARCH
    模型，可以刻画出随时间而变异的条件方差。


    ## 1. ARCH 模型的思想


    ARCH 模型的思想如下：


    - (1) 资产收益率序列的扰动 $\{a_t\}$ 是序列不相关的，但是不独立。

    - (2) $\{a_t\}$ 的不独立性可以用其延迟值的简单二次函数来描述。


    具体而言，一个 ARCH($m$)模型为


    $$ a_t = \varepsilon_t \sigma_t, \quad \sigma_t^2 = \alpha_0 + \alpha_1 a_{t-1}^2
    + \cdots + \alpha_m a_{t-m}^2 > 0 \quad t > 0, \alpha_i \geqslant 0 $$


    其中，$\varepsilon_t$ 是均值为 0、方差为 1 的独立同分布 (Independent Identically Distributed, IID)
    的随机变量序列。通常假定其服从标准正态分布；$\sigma_t^2$ 为条件异方差。


    ## 2. ARCH 模型效应


    从 ARCH 模型的结构看，过去大的平方扰动会导致信息 $a_t$ 出现大的条件异方差。从而 $a_t$ 有取绝对值较大的值的倾向。这意味着：在 ARCH
    的框架下，大的扰动会倾向于紧接着出现另一个大的扰动。这与波动率聚集的现象相似。


    所谓 ARCH 模型效应也就是条件异方差序列的序列相关性。


    ### 7.6.3 ARCH 模型的建立及预测


    上面简单介绍了 ARCH 的原理，下面主要介绍如何在 Python 中实现。ARCH 模型的建立大致分为以下几步：


    - (1) 通过检验数据的序列相关性建立一个均值方程，如有必要，对收益率序列建立一个计量经济模型（如 ARMA）来消除任何线性依赖。

    - (2) 对均值方程的残差进行 ARCH 效应检验。

    - (3) 如果具有 ARCH 效应，则建立波动率模型。

    - (4) 检验拟合的模型，如有必要则进行改进。


    Python 的 ARCH 库提供了现成的方法（后面会介绍）。这里为了理解 ARCH，还是按上述流程来建模。


    #### 1. 均值方程的建立


    这里的均值方程可以简单地视为 ARMA（或 ARIMA）模型，ARCH 其实是在此基础上的一些修正。下面的过程以上证指数日涨跌幅序列为例。


    arch 库均值方程只支持常数、零均值、AR 模型，这里建立 AR 模型以便对照。


    首先导入相关库：


    ```python

    from scipy import stats

    import statsmodels.api as sm #统计相关的库

    import numpy as np

    import pandas as pd

    import matplotlib.pyplot as plt

    import arch #条件异方差模型相关的库

    ```


    ```python

    IndexData = DataAPI.MktIndexGet(indexID=u"", ticker=u"000001", beginDate=u"20140101",
    endDate=u"20160101", field=u"tradeDate,closeIndex,CHGPct", pandas="1")

    IndexData = IndexData.set_index(IndexData[''tradeDate''])

    data = np.array(IndexData[''CHGPct''])  # 上证指数日涨跌

    IndexData[''CHGPct''].plot(figsize=(15, 5))

    ```


    结果如图7-19所示。


    ![](img/123c8fbcf9c4e19d1d2636062a3e4340_99_0.png)


    首先检验这个序列的平稳性，以决定是否需要差分。


    原假设 H0：序列为非平稳的。

    备择假设 H1：序列是平稳的。


    ```python

    t = sm.tsa.stattools.adfuller(data)    # ADF检验

    print "p-value: ", t[1]

    # p-value: 7.56217111771e-10

    ```


    p-value小于显著性水平，拒绝原假设，因此序列是平稳的。接下来建立AR(ρ)模型，先确定阶次：


    ```python

    fig = plt.figure(figsize=(20, 5))

