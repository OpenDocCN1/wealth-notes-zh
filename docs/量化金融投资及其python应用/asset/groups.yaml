    \n令 $a_t = r_t - \\mu_t$ 为 $t$ 时刻的信息。若 $a_t$ 满足下式：\n\n$$\na_t = \\sigma_t \\varepsilon_t,\
    \ \\sigma_t^2 = \\alpha_0 + \\sum_{i=1}^m \\alpha_i a_{t-i}^2 + \\sum_{j=1}^s\
