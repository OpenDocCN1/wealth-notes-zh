    利用前面的金融时间序列中的混成检验，检验序列 $\{a_t^2\}$ 的相关性，以判断是否具有 ARCH 效应。


    计算均值方程残差：


    $$ a_t = r_t - \mu_t $$


    画出残差及残差的平方图（图 7-21）：


