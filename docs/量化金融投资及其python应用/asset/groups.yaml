    \ {'age': 27, 'name': 'jiayounet'}\n```\n\n2）基本操作\n\n字典的基本操作与列表在很多地方都相似，两者的对照如表\
    \ 2-1 所示。表中以序列 a=[1,3,6,10] 和字典 f={'age': 27, 'name': 'shushuo'}为例。\n\n| 功能 |\
    \ 列表操作格式 | 列表操作例 | 字典操作格式 | 字典操作例 |\n| :--- | :--- | :--- | :--- | :--- |\n| 求长度\
    \ | len(列表) | len(a) 4 | len(字典) | len(f) 2 |\n| 找到某位置上的值 | 列表[索引号] | a[1] 3 |\
    \ 字典[键] | f[\"age\"] 27 |\n| 元素赋值 | 列表[索引]=值 | a[2]=1 a [1,3,1,10] | 字典[键]=值 |\
    \ f[\"age\"]=28 f {'age':28, 'name':'shushuo'} |\n| 删除元素 | del 列表[索引] | del a[1]\
    \ a [1,6,10] | del 字典[键] | del f[\"name\"] f {'age':28} |\n| 成员资格 | 元素 in 列表 |\
    \ 1 in a True | 键 in 字典 | \"age\" in f True |\n\n## 2.3 Python 函数\n\n函数可以由用户自己定义，格式如下：\n\
    \n```python\ndef 函数名(参数):\n    函数代码\n```\n\n函数代码中，return 表示返回的值。例如，定义一个平方函数 square(x)，输入参数\
    \ x，返回 x 的平方：\n\n```python\ndef square(x):\n    return x * x\n\nsquare(9)\n# Out[33]:\
    \ 81\n```\n\n又如，定义一个两数相加的函数：\n\n```python\ndef add_2int(x, y):\n    return x +\
