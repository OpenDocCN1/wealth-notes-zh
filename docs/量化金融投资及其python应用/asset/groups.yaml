    # 14.2 显式差分格式


    这里的基本思想是用差分格式替换对应的微分形式，并且期盼两种格式的“误差”在网格足够密的情况下会趋于 0。分别在时间方向以及空间方向对式(14-1)做差分：


    $$\frac { u ( x , \tau + \Delta \tau ) - u ( x , \tau ) } { \Delta \tau } = \kappa
    \frac { u ( x + \Delta x , \tau ) - 2 u ( x , \tau ) + u ( x - \Delta x , \tau
    ) } { ( \Delta x ) ^ { 2 } }$$


    整理得


    $$u _ { j , k + 1 } = u _ { j , k } + \kappa \frac { \Delta \tau } { ( \Delta
    x ) ^ { 2 } } \left( u _ { j + 1 , k } - 2 u _ { j , k } + u _ { j - 1 , k } \right)$$


    到这里得到一个迭代方程组：


    $$U _ { j , k + 1 } = \rho U _ { j - 1 , k } + ( 1 - 2 \rho ) U _ { j , k } +
    \rho U _ { j + 1 , k } , \quad 1 \leqslant j \leqslant N - 1 , 0 \leqslant k \leqslant
    M - 1$$


    其中 $\rho = \frac { \kappa \Delta \tau } { ( \Delta x ) ^ { 2 } }$ 。


    下面使用 Python 代码实现微分到差分的格式替换过程。


    +   首先定义基本变量：

    N为空间方向的网格数。

    M 为时间方向的网格数。

    T 为最大时间期限。

    X 为最大空间范围。

    U 为用来存储差分网格点上的值的矩阵。


    ```

    ```

    N = 25              #x 方向网格数

    M = 2500            #t 方向网格数

    T = 1.0

    X = 1.0

    xArray = np.linspace(0, X, N+1)

    yArray = map(initialCondition, xArray)

    starValues = yArray

    U = np.zeros((N+1, M+1))

    U[:, 0] = starValues

    ```

