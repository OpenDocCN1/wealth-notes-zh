  mdcn: "\n# 第 1 章 量化金融投资平台与 Python 工作环境\n\n## 1.1 国内外量化金融投资平台概述\n\n国外比较著名的量化金融投资平台有\
    \ Quantopian (https://www.quantopian.com/)、Quantspedia (http://www.quantpedia.com/)\
    \ 等。如果是普通用户，不懂编程，建议使用国内的果仁网 (http://www.guorn.com/)。目前，国内专业性强、需要用户懂编程的量化金融投资平台主要有优矿\
    \ (https://uqer.io/home/)、聚宽 (http://www.joinquant.com/)、米筐 (http://www.ricequant.com/)\
    \ 和量化京东平台 (http://quant.jd.com/)。米筐和量化京东平台都支持 Python 3 和 Java，而优矿和聚宽使用的都是 Python\
    \ 2。Python 的两个版本功能大致类似，Python 3 现在基本上已经支持量化金融投资工作能用到的各种程序包，并且在中文支持、数据类型以及很多其他细节上有所优化，这也是长期发展的方向。目前国内量化金融投资平台方兴未艾，都采用了\
    \ Quantopian 的模式，先从工具下手，推广到社区，最后采用众筹策略。优矿和 Ricequant 是走在前面的，也是相对完善的两个平台。国内的 4\
    \ 个量化金融投资平台比较类似，本书以优矿平台为例来介绍。\n\n## 1.2 优矿平台界面\n\n优矿量化金融投资平台（以下简称优矿平台）界面如图 1-1\
    \ 所示。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_10_1.png)\n\n图 1-1 优矿量化金融投资平台界面\n\
    \n## 1.3 优矿平台提供的服务\n\n优矿平台为用户提供如下服务。\n\n- **高质量大数据免费使用（研究数据）**\n  优矿平台免费提供沪深股票、港股、基金、期货、债券、期权、指数、板块、宏观等海量数据。具体参见\
    \ https://uqer.io/data/browse/0/?page=1 。\n\n- **专业、高效的量化研究工具（“开始研究”模块）**\n  利用优矿平台可以快速获取海量数据，使用其定制的\
    \ Python 量化分析环境。优矿平台采用虚拟机技术，安全、稳定、强大。具体参见 https://uqer.io/labs/ 。\n  > **注意：**\
    \ 本书的大部分 Python 代码都是在此环境中调试通过的。\n\n- **策略回测**\n  优矿平台提供高效、专业的 quartz 交易回测框架，使用户可以专注于描述交易算法逻辑，而不必关心底层的实现细节，同时快速获得策略表现评估。目前支持股票、场内\
    \ ETF/LOF 基金的分钟线和日线回测。具体参见 https://uqer.io/labs/ 。\n\n- **模拟交易**\n  将“开始研究”模块中的策略一键发布，进行实盘模拟。目前支持股票、场内\
    \ ETF/LOF 基金的日线和分钟线模拟交易。具体参见 https://uqer.io/trade/strategies/ 。\n\n- **实盘大赛**\n\
    \  优矿平台举办了 500 万实盘量化大赛，参与大赛就有资格获得百万实盘奖励，收益全归参赛者，亏损优矿担。具体参见 https://uqer.io/contest/home/\
    \ 。\n\n- **量化社区**\n  优矿平台聚集了一批量化金融投资从业者和爱好者，他们在社区发布各种想法、算法、策略，共享思维碰撞带来的灵感。具体参见\
    \ https://uqer.io/community/list 。\n\n## 1.4 优矿平台的 Notebook 功能\n\n在优矿平台中进行的所有金融研究都可在\
    \ Notebook 中实现。Notebook 文件采用输入与输出混排的交互方式，让研究过程所见即所得。用户可以在“开始研究”中新建 Notebook，如图\
    \ 1-2 所示。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_12_0.png)\n\n图 1-2 新建 Notebook\n\
    \n可以在该单元的左上方将单元切换为不同的模式，如图 1-3 所示。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_12_1.png)\n\
    \n图 1-3 切换单元模式\n\n在不同的单元模式间切换，可以在 Notebook 中实现各种丰富的研究。\n\n- **股票/基金策略模式与期货策略模式**：内嵌了策略回测框架，可以用程序化的方法定义每个交易日在某种条件下买入、卖出一定数量的股票，并进行策略表现评估。\n\
    - **文档模式**：可以在这个模式下编写文档。\n- **代码模式**：可以在这个模式下进行各种数据的研究分析、金融建模、定价分析等操作。\n\n将单元切换为代码模式后，可以在这个模式下编写任何形式的\
    \ Python 代码，并且调用优矿平台提供的数据和定制函数库。在代码模式中输入代码后，按 Ctrl + Enter 组合键运行即可。\n\n## 1.5\
    \ 优矿平台支持的 Python 程序包\n\n优矿平台支持的 Python 程序包如下。\n\n1. **DataAPI 程序包**\n   优矿平台提供的所有数据都可以通过这个模块获得。它是优矿平台内置函数库，无须导入(import)即可使用。可查看\
    \ https://uqer.io/data/browse/0/?page=1 了解详细信息。\n\n2. **quartz 程序包**\n   quartz\
    \ 程序包是优矿平台的回测框架。它是优矿平台内置函数库，无须导入即可使用。可查看“https://uqer.io/help/faqApi/# 策略 API\
    \ 文档”了解详细信息。\n\n3. **CAL 程序包**\n   CAL 是优矿平台为固定收益及衍生品建模定制的金融模块。可查看 https://uqer.io/help/faqCAL\
    \ 了解详细信息。\n\n4. **NumPy 程序包**\n   NumPy 是 Python 的数值计算扩展程序包，能够高效地存储和处理大型矩阵。可查看NumPy\
    \ 官网的帮助文档(http://www.numpy.org/)。\n\n5. **SciPy 程序包**\n   SciPy 是基于 NumPy 的更为丰富和高级的功能扩展程序包，在统计、优化、插值、数值积分、常微分方程求解器等方面提供了大量的可用函数，基本覆盖了基础科学计算相关的问题。可查看\
    \ SciPy 官网的帮助文档(http://www.scipy.org/)。\n\n6. **pandas 程序包**\n   pandas 是基于 NumPy\
    \ 的数据分析工具，主要用于解决数据分析任务。pandas 提供了大量能帮助用户快速便捷地处理数据的函数和方法；提供了高效操作大型数据集所需的工具。可查看\
    \ pandas 官网的帮助文档(http://pandas.pydata.org/pandas-docs/stable/10min.html)。\n\n\
    7. **matplotlib, seaborn 程序包**\n   matplotlib 是 Python 的图形框架。可查看 matplotlib 官网的帮助文档(http://matplotlib.org/1.3.1/contents.html)。\n\
    \   seaborn 模块自带许多定制主题和高级接口，用于控制 matplotlib 图表的外观。可查看 Seaborn 官网的帮助文档(http://seaborn.pydata.org/)。\n\
    \n8. **sklearn 程序包**\n   sklearn 是 Python 的机器学习和数据挖掘模块，可以用于模式识别。可查看 sklearn 官网的帮助文档(http://scikit-learn.org/stable/)。\n\
    \n9. **SQLite 程序包**\n   SQLite 是一个软件库，实现了自给自足的、无服务器的、零配置的、事务性的 SQL 数据库引擎。SQLite\
    \ 是在世界上部署最广泛的 SQL 数据库引擎。可以在“开始研究”的 Notebook 中创建 SQLite 数据库，并且存储在 Data 目录中。\n \
