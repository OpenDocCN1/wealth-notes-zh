    \ = font)\n```\n\n运行上述代码，可以得到如图 12-2 所示的图形。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_144_0.png)\n\
    \n图 12-2 不同的插值方法拟合效果的比较\n"
