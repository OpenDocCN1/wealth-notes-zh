    train = temp[:-10]\ntest = temp[-10:]\noutput = sm.tsa.AR(train).fit()\noutput.predict()\n\
    \npredicts = output.predict(355, 364, dynamic=True)\nprint len(predicts)\ncomp\
    \ = pd.DataFrame()\ncomp['original'] = temp[-10:]\ncomp['predict'] = predicts\n\
    comp\n```\n\n| | original | predict |\n| :--- | :--- | :--- |\n| 0 | -0.00223\
    \ | 0.000908 |\n| 1 | 0.01022 | -0.001473 |\n| 2 | 0.00145 | -0.002109 |\n| 3\
    \ | 0.01278 | -0.002158 |\n| 4 | 0.01024 | -0.000216 |\n| 5 | 0.02414 | 0.000116\
    \ |\n| 6 | 0.00241 | 0.001476 |\n| 7 | -0.00089 | -0.000119 |\n| 8 | 0.00932 |\
    \ -0.000520 |\n| 9 | -0.00739 | -0.000162 |\n\n该模型的预测结果不太好。是不是可以通过其他模型获得更好的结果呢？有关方法将在后面的几节介绍。\n\
    \n## 7.3 移动平均模型及预测\n\n这里我们直接给出移动平均 (Moving Average, MA) 模型 MA(q) 的形式：\n$$r_t =\
    \ c_0 + a_t - \\theta_1 a_{t-1} - \\cdots - \\theta_q a_{t-q}$$\n$c_0$ 为一个常数项。这里的\
    \ $a_t$ 是 AR 模型 $t$ 时刻的扰动，可以发现，该模型使用了过去 $q$ 个时期的随机干扰或预测误差非线性地表达当前的预测值。\n\n###\
    \ 7.3.1 MA(q) 模型的性质\n\n- 1. 平稳性\n\nMA(q) 模型总是弱平稳的，因为它们是白噪声序列 (残差序列) 的有限线性组合。因此，根据弱平稳的性质可以得出两个结论：\n\
    $$E(r_t) = c_0, \\quad \\text{Var}(r_t) = (1 + \\theta_1^2 + \\theta_2^2 + \\\
    cdots + \\theta_q^2)\\sigma_a^2$$\n\n- 2. 自相关函数\n\n对 MA(q) 模型，其自相关函数 ACF 总是 $q$\
    \ 步截尾的。因此 MA(q) 序列只与其前 $q$ 个延迟值线性相关，从而它是一个“有限记忆”的模型。\n这一点可以用来确定模型的阶次，后面会介绍。\n\n\
    - 3. 可逆性\n\n当满足可逆条件的时候，MA(q) 模型可以改写为 AR(p) 模型。这里不进行推导，只给出 1 阶和 2 阶 MA 模型的可逆性条件。\n\
    1 阶：\n$$|\\theta_1| < 1$$\n2 阶：\n$$|\\theta_2| < 1, \\quad \\theta_1 + \\theta_2\
    \ < 1$$\n\n### 7.3.2 MA(q) 模型的阶次判定\n\n通常利用上面介绍的第二条性质“MA(q) 模型的 ACF 函数是 $q$ 步截尾的”来判断模型阶次。下面使用上证指数的日涨跌数据\
    \ (2013 年 1 月至 2014 年 8 月) 来进行分析，先取数据，取数和绘图代码如下：\n\n```python\nfrom scipy import\
    \ stats\nimport statsmodels.api as sm            # 统计相关的库\nimport numpy as np\n\
    import pandas as pd\nimport matplotlib.pyplot as plt\nIndexData = DataAPI.MktIdxGet(indexID\
    \ = u\"\", ticker = u\"000001\",beginDate = u\"20130101\",\nendDate = u\"20140801\"\
    ,field =u\"tradeDate,closeIndex,CHGFct\", pandas = \"i\")\nIndexData = IndexData.set_index(IndexData['tradeDate'])\n\
    data = np.array(IndexData['CHGFct'])                 # 上证指数日涨跌\nIndexData['CHGFct'].plot(figsize\
    \ = (15,5))\n```\n\n生成的图形如图 7-8 所示。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_88_0.png)\n\
    \n可以看出，序列看上去是弱平稳的。下面画出序列的 ACF：\n\n```python\nfig = plt.figure(figsize=(20,5))\n\
    ax1 = fig.add_subplot(111)\nfig = sm.graphics.tsa.plot_acf(data,ax=ax1)\n```\n\
    \n可以发现，图 7-9 所示的 ACF 在 43 处截尾，之后的 ACF 均在置信区间内，由此可以判定该序列的 MA 模型阶次为 43。\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_88_1.png)\n\
    \n### 7.3.3 建模和预测\n\n由于 sm.tsa 中没有单独的 MA 模块，因此利用 ARMA 模块，只要将其中 AR 的阶 $p$ 设为 0\
    \ 即可。\n"
