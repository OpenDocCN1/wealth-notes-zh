    # 第1章

    量化金融投资平台与Python工作环境


    # 1.1 国内外量化金融投资平台概述


    国外比较著名的量化金融投资平台有 Quantopian(https://www. quantopian. com/)、Quantspedia(http://www.
    quantpedia. com/)等。如果是普通用户，不懂编程，建议使用国内的果仁网(http://www. guorn. com/)。目前，国内专业性强、需要用户懂编程的量化金融投资平台主要有优矿(https://uqer.
    io/home/)、聚宽(http://www. joinquant. com/)、米筐(http://www. ricequant. com/)和量化京东平台(http://quant.
    jd. com/），米筐和量化京东平台都支持 Python 3 和 Java，而优矿和聚宽使用的都是 Python 2。Python 的两个版本功能大致类似，Python
    3 现在基本上已经支持量化金融投资工作能用到的各种程序包，并且在中文支持、数据类型以及很多其他细节上有所优化，这也是长期发展的方向。目前国内量化金融投资平台方兴未艾，都采用了
    Quantopian 的模式，先从工具下手，推广到社区，最后采用众筹策略。优矿和 Ricequant 是走在前面的，也是相对完善的两个平台。国内的 4 个量化金融投资平台比较类似，本书以优矿平台为例来介绍。


    # 1.2 优矿平台界面


    优矿量化金融投资平台（以下简称优矿平台）界面如图 1-1 所示。


    ![](img/123c8fbcf9c4e19d1d2636062a3e4340_10_1.png)


