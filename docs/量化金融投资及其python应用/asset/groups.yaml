    d = [ {'a': 1.6, 'b': 2}, {'a': 3, 'b': 6, 'c': 9}]\ndf = DataFrame(d)\nprint\
    \ df\n```\n\n```\n     a    b    c\n0  1.6  2.0  NaN\n1  3.0  6.0  9.0\n```\n\n\
    在实际处理数据时，有时需要创建一个空的 DataFrame，方法如下：\n\n```python\ndf = DataFrame()\nprint df\n\
    ```\n\n```\nEmpty DataFrame\nColumns: []\nIndex: []\n```\n\n另一种创建 DataFrame 的方法十分有用，那就是使用\
    \ `concat` 函数基于 Series 或者 DataFrame 创建一个 DataFrame：\n\n```python\na = Series(range(5))\n\
    b = Series(np.linspace(4, 20, 5))\ndf = pd.concat([a, b], axis=1)\nprint df\n\
    ```\n\n```\n   0    1\n0  0  4.0\n1  1  8.0\n2  2  12.0\n3  3  16.0\n4  4  20.0\n\
    ```\n\n其中的 `axis=1` 表示按列合并，`axis=0` 表示按行合并，并且 Series 都处理成一列，所以这里如果选 `axis=0`，将得到一个\
    \ 10×1 的 DataFrame。下面这个例子展示了如何将 DataFrame 按行合并成一个大的 DataFrame:\n\n```python\n\
    df = DataFrame()\nindex = ['alpha', 'beta', 'gamma', 'delta', 'eta']\nfor i in\
    \ range(5):\n    a = DataFrame([np.linspace(i, 5 * i, 5)], index=[index[i]])\n\
    \    df = pd.concat([df, a], axis=0)\nprint df\n```\n\n```\n        0     1  \
