    \ 期权定价最重要的参数，波动率 $\\sigma$ 指的是标的资产本身的波动率。但是我们更关心的是当时的报价所反映的市场对波动率的估计，这个估计的波动率称为隐含波动率\
    \ (Implied Volatility)。这个过程实际上是在 Black-Scholes 公式中假设另外 4 个参数是确定的且期权价格已知，反解 $\\\
    sigma$。\n\n对于欧式看涨期权而言，其价格为对应波动率的单调递增函数，所以这个求解过程是稳定可行的。一般来说可以用类似于试错法的方法来实现。在 SciPy\
    \ 中提供了很多高效的算法，例如 Brent 算法。代码如下：\n\n```python\nfrom scipy.optimize import brentq\n\
    \n# 目标函数, 目标价格由 target 确定\nclass cost_function:\n    def __init__(self, target):\n\
    \        self.targetValue = target\n\n    def __call__(self, x):\n        return\
    \ call_option_pricer(spot, strike, maturity, r, x) - self.targetValue\n\n# 假设使用\
    \ vol 初值作为目标\ntarget = call_option_pricer(spot, strike, maturity, r, vol)\ncost_sample\
    \ = cost_function(target)\n\n# 使用 Brent 算法求解\nimpliedVol = brentq(cost_sample,\
    \ 0.01, 0.5)\nprint u'真实波动率: %.2f' % (vol*100,) + '%'\nprint u'隐含波动率: %.2f' %\
    \ (impliedVol*100,) + '%'\n```\n\n运行上面的代码, 可以得到如下结果：\n\n真实波动率：25.00 %\n隐含波动率：25.00\
