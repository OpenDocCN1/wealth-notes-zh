    的联合分布相同，就称时间序列 $(r_{i})$ 是强平稳的。即 $(r_{t_{1}}, r_{t_{2}}, \cdots, r_{t_{k}})$ 的联合分布在时间的平移变换下保持不变。这是一个很强的条件，而我们经常假定的是平稳性的一个较弱的方式。


    若时间序列 $(r_{i})$ 满足下面两个条件：


    $$E(r_{i}) = \mu, \quad \mu \text{ 是常数}$$


