    \   self.r = r\n        self.sigma = sigma\n    def log_expectation(self, T):\n\
    \        return self.x0 + (self.r - 0.5 * self.sigma * self.sigma) * T\n    def\
    \ expectation(self, T):\n        return math.exp(self.log_expectation(T))\n  \
