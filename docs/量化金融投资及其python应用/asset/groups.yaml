    \ MA 的内容在上面只做了简单介绍，下面主要介绍 ARMA 模型。\n\n## 7.4 自回归移动平均模型及预测\n\n在有些应用中，需要高阶的 AR 或\
    \ MA 模型才能充分地描述数据的动态结构，这样问题会变得很复杂。为了克服这个困难，提出了自回归移动平均 (Auto-Regressive and Moving\
    \ Average, ARMA) 模型。其基本思想是把 AR 和 MA 模型结合在一起，使所使用的参数个数很小。\n\nARMA(p,q) 模型的形式为\n\
    \n$$ r _ { t } = \\varphi _ { 0 } + \\sum _ { i = 1 } ^ { p } \\varphi _ { i }\
    \ r _ { t - i } + a _ { t } + \\sum _ { i = 1 } ^ { q } \\theta _ { i } a _ {\
    \ t - i } $$\n\n其中，$\\{a_t\\}$ 为白噪声序列，$p$ 和 $q$ 都是非负整数。AR(p) 模型和 MA(q) 模型都是 ARMA(p,q)\
    \ 模型的特殊形式。利用向后推移算子 $B$，上述模型可写成\n\n$$ ( 1 - \\varphi _ { 1 } B - \\varphi _ { 2\
    \ } B ^ { 2 } - \\cdots - \\varphi _ { p } B ^ { p } ) r _ { t } = \\varphi _\
    \ { 0 } + ( 1 - \\theta _ { 1 } B - \\theta _ { 2 } B ^ { 2 } - \\cdots - \\theta\
    \ _ { q } B ^ { q } ) a _ { t } $$\n\n(后移算子 $B$ 即回到上一时刻。)\n\n再求 $r_t$ 的期望，得到\n\
    \n$$ E ( r _ { t } ) = \\frac { \\varphi _ { 0 } } { 1 - \\varphi _ { 1 } - \\\
    varphi _ { 2 } - \\cdots - \\varphi _ { p } } $$\n\n和前面 AR 模型一样，因此有着相同的特征方程：\n\
    \n$$ 1 - \\varphi _ { 1 } x - \\varphi _ { 2 } x ^ { 2 } - \\cdots - \\varphi\
