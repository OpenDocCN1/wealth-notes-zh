    \n#### 2. 用信息量准则确定 $p$\n\n现在有以上这么多可供选择的模型，在选择模型时通常采用 AIC。增加自由参数的数目能提高拟合的优良性，AIC\
    \ 鼓励数据拟合的优良性同时又能尽量避免出现过拟合 (overfitting) 的情况。所以优先考虑的模型应是 AIC 值最小的那一个。赤池 (Akaike)\
    \ 信息准则的方法是寻找可以最好地解释数据但自由参数最少的模型。目前在选择模型时常用以下 3 个准则：\n\n- (1) AIC (Akaike Information\
    \ Criterion, 赤池信息量准则)：\n  $AIC = -2 \\ln L + 2k$\n- (2) BIC (Bayesian Information\
