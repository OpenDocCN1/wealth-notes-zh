    #### 7.1.4 白噪声序列和线性时间序列


    ##### 1. 白噪声序列


    随机变量 $X(t)(t=1, 2, 3, \cdots)$ 如果是由一个不相关的随机变量的序列构成的，即对于所有 $s$ 不等于 $t$，随机变量 $X_{t}$
    和 $X_{s}$ 的协方差为 0，则称其为纯随机过程。


    对于一个纯随机过程来说，若其期望和方差均为常数，则称之为白噪声过程。白噪声过程的样本称为白噪声序列，简称白噪声。之所以称为白噪声，是因为它和白光的特性类似，白光的光谱在各个频率上有相同的强度，白噪声的谱密度在各个频率上的值相同。

