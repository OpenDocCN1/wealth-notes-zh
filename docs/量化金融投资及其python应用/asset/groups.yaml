    \ndata = index\nfeatureOriginal = pd.DataFrame()\nfeatureOriginal['high_low']\
    \ = (data['highestIndex'] - data['lowestIndex'])/data['lowestIndex']\nfeatureOriginal['high_close']\
    \ = (data['highestIndex'] - data['closeIndex'])/data['closeIndex']\nfeatureOriginal['close_low']\
