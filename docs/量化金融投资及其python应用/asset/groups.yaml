    # ## 19.1 为什么选择 Alpha 对冲模型


    # ### 1. 有效市场假说


    20 世纪 70 年代，尤金·法玛提出了有效市场假说，根据市场的不同情况，又可以分为 3 种不同的状态：弱式有效、半强式有效和强式有效。


    在弱式有效下，市场价格已充分反映出所有过去历史的股票价格信息，这种情况下，股票价格的技术分析失去了作用，基本面分析还能帮助投资者获得超额收益。


    从现有的情况看，成熟的美国市场也仅仅处于弱式有效和半强式有效之间，众多学者研究表明，A 股市场由于散户参与量大；目前处于无效和弱式有效之间，价格和价值往往偏差较大，非常适合用
    Alpha 对冲模型来投资。


    # ### 2. 主动投资与被动投资


    究竟是主动投资好还是被动投资好？主动投资一定会比被动投资能够获得更多的收益吗？这是很难回答的问题。


    有众多学者做过相关研究，大多学者发现，从长期来看，被动投资甚至比主动投资表现还要好（虽然总有那么一小部分主动投资产品的表现是超过基准的），主动投资并不一定能带来超额收益。这里不一一列举学者们的文献，只介绍一下近几年来风靡美国的机器人投资顾创业公司，比如
    Wealftront，它们的兴起就是从实际上证明有时候被动投资并不像大家所想的那么不堪一击。


    Alpha 对冲模型虽然属于主动投资范畴，但从风险和收益的角度来看，它更像有主动管理的被动投资，Alpha 对冲模型的目标就是稳健地获取相对于基准指数的超额收益，例如每天比基准指数多
    0.1% 的收益。


    主动管理的被动投资，低风险下稳健的超额收益，这也是 Alpha 对冲模型的优势之一。'
