    \ 3., 4.], index=['a', 'b', 'c', 'd'])}\ndf = DataFrame(d)\nprint df\n    one\
    \  two\na  1.0  1.0\nb  2.0  2.0\nc  3.0  3.0\nd  NaN  4.0\n```\n\n可以指定所需的行和列,若字典中不含有对应的元素,则置为\
