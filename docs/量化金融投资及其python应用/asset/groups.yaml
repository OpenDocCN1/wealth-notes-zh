    \ 而是在于将实际优化问题转化为标准形式的过程。\n\n在上面的例子中并没有出现等号, 当出现等式约束时, 过程是一样的, 找到 A、b, 然后运行代码 sol=solvers.qp(P,q,G,h,A,b)\
    \ 即可求解。\n\n上面定义各个矩阵参数用的是最直接的方式, 也可以结合 NumPy 来定义上述矩阵。\n\n```python\nfrom cvxopt\
    \ import solvers, matrix\nimport numpy as np\n\nP = matrix(np.diag([1.0,0.0]))\
    \ # 一些特殊矩阵用 NumPy 创建更方便 (在本例中区别不大)\nq = matrix(np.array([3.0,4.]))\nG = matrix(np.array([[\
    \ -1.0,0.0],[0. -1],[-1. -3],[2.5],[3.4]]))\nh = matrix(np.array([0.0.0. -15.100.80]))\n\
    sol = solvers.qp(P,q,G,h)\nprint sol['x']\n```\n\n得到如下结果：\n\n| pcost | dcost |\
    \ gap | pres | dres |\n| :---: | :---: | :---: | :---: | :---: |\n| 0: 1.0780e+02\
    \ | - 7.6366e+02 | 9e+02 | 1e-16 | 4e+01 |\n| 1: 9.3245e+01 | 9.7637e+00 | 8e+01\
