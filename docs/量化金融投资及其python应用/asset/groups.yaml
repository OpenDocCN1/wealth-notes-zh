    ```\n\n```text\n(array([2]), array([1]))\n11\n```\n\n## 3.6 矩阵操作\n\n首先来看矩阵转置：\n\
    \n```python\na = np.random.rand(2,4)\nprint \"a:\"\nprint a\na = np.transpose(a)\n\
