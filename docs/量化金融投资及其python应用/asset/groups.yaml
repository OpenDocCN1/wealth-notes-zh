  md: "\n## 3. 牛顿共轭梯度法\n\n用到梯度的方法还有牛顿共轭梯度法（Newton-Conjugate-Gradient algorithm，简称牛顿法）。牛顿法是收敛速度最快的方法，其缺点在于需要求解\
    \ Hessian 矩阵（二阶导数矩阵）。牛顿法大致的思路是采用泰勒展开的二阶近似，可使用共轭梯度近似 Hessian 矩阵的逆矩阵。下面给出 Rosenbrock\
    \ 函数的 Hessian 矩阵元素通式：\n\n$$\n\\begin{aligned}\nH(i, j)= \\frac{\\partial^{2} f}{\\\
    partial x_{i} \\partial x_{j}} &= 200\\left(\\delta_{i, j}-2 x_{i-1} \\delta_{i-1,\
    \ j}\\right) - 400 x_{i}\\left(\\delta_{i+1, j} - 2 x_{i} \\delta_{i, j}\\right)\
    \ - \\\\\n&400 \\delta_{i, j}\\left(x_{i+1, j} - x_{i}^{2}\\right) + 2 \\delta_{i,\
    \ j} \\\\\n&=\\left(202 + 1200 x_{i}^{2} - 400 x_{i+1}\\right) \\delta_{i, j}\
    \ - 400 x_{i} \\delta_{i+1, j} - 400 x_{i+1} \\delta_{i-1, j}\n\\end{aligned}\n\
    $$\n\n其中 $i, j \\in[1, N-2]$。其他边界上的元素通式为\n\n$$\n\\begin{aligned}\n&\\frac{\\partial^{2}\
    \ f}{\\partial x_{0}^{2}} = 1200 x_{0}^{2} - 400 x_{1} + 2 \\\\\n&\\frac{\\partial^{2}\
    \ f}{\\partial x_{0} \\partial x_{1}} = \\frac{\\partial^{2} f}{\\partial x_{1}\
    \ \\partial x_{0}} = - 400 x_{0} \\\\\n&\\frac{\\partial^{2} f}{\\partial x_{N-1}\
    \ \\partial x_{N-2}} = \\frac{\\partial^{2} f}{\\partial x_{N-2} \\partial x_{N-1}}\
    \ = -400 x_{N-2} \\\\\n&\\frac{\\partial^{2} f}{\\partial x_{N-1}^{2}} = 200\n\
    \\end{aligned}\n$$\n\n例如，当 $N = 5$ 时的 Hessian 矩阵为\n\n![](img/123c8fbcf9c4e19d1d2636062a3e4340_49_0.png)\n\
    \n为使用牛顿法，需要提供 一个计算 Hessian 矩阵的函数：\n\n```python\ndef rosen_hess(x):\n    x = np.asarray(x)\n\
    \    H = np.diags(-400 * x[1:], 1) - np.diags(400 * x[2:], -1)\n    diagonal =\
    \ np.zeros_like(x)\n    diagonal[0] = 1200 * x[0] * x[0] * 2 - 400 * x[1] + 2\n\
    \    diagonal[-1] = 200\n    diagonal[1:-1] = 202 + 1200 * x[1:-1] * x[1:-1] *\
    \ 2 - 400 * x[2:]\n    H = H + np.diags(diagonal)\n    return H\n```\n\n调用上述函数：\n\
    \n```python\nres = opt.minimize(rosen, x_0, method='Newton-CG', jac=rosen_der,\
    \ hess=rosen_hess,\n                   options={'xtol': 1e-8, 'disp': True})\n\
    print \"Result of minimizing Rosenbrock function via Newton-Conjugate-Gradient\
    \ algorithm (Hessian):\"\nprint res\n```\n\n输出结果：\n\n```text\nOptimization terminated\
    \ successfully.\nCurrent function value: 0.000000\nIterations: 20\nFunction evaluations:\
    \ 22\nGradient evaluations: 41\nHessian evaluations: 20\nResult of minimizing\
    \ Rosenbrock function via Newton-Conjugate-Gradient algorithm (Hessian):\nfun:\
    \ 1.47606641102778e-19\njac: array([ -3.62847530e-11,   2.68148992e-09,   1.16637362e-08,\n\
    \             4.81693414e-08,  -2.76999090e-08])\n```\n\n对于一些大型的优化问题，Hessian 矩阵将异常大，牛顿法用到的仅是\
    \ Hessian 矩阵和一个任意向量的乘积，为此，用户可以提供两个向量，一个是 Hessian 矩阵和一个任意向量 p 的乘积，另一个是向量 p，这就减少了存储的开销。记向量\
    \ $p = (p_1, p_2, \\dots, p_{N-1})$，可有 $(1200x_0^2 - 400x_1 + 2)p_0 - 400x_0p_1\
    \ \\cdots - 400x_{i-1}p_{i-1} + (202 + 1200x_i^2 - 400x_{i+1})p_i - 400x_ip_{i+1}\
    \ \\cdots - 400x_{N-2}p_{N-2} + 200p_{N-1}$\n\n定义如下函数并使用牛顿法寻优：\n\n```python\n\
    def rosen_hess_p(x, p):\n    x = np.asarray(x)\n    Hp = np.zeros_like(x)\n  \
    \  Hp[0] = (1200 * x[0] * x[0] * 2 - 400 * x[1] + 2) * p[0] - 400 * x[0] * p[1]\n\
    \    Hp[1:-1] = -400 * x[1:-1] * p[1:-1] - 400 * x[2:] * p[2:] + \\\n        \
    \       (202 + 1200 * x[1:-1] * x[1:-1] * 2 - 400 * x[2:]) * p[1:-1] + \\\n  \
    \             -400 * x[1:-1] * p[2:]\n    Hp[-1] = -400 * x[-1] * p[-1] + 200\
    \ * p[-1]\n    return Hp\n```\n\n```python\nres = opt.minimize(rosen, x_0, method='Newton-CG',\
    \ jac=rosen_der, hessp=rosen_hess_p,\n                   options={'xtol': 1e-8,\
    \ 'disp': True})\nprint \"Result of minimizing Rosenbrock function via Newton\
    \ - Conjugate - Gradient algorithm (Hessian times arbitrary vector):\"\nprint\
    \ res\n```\n\n输出结果：\n\n```text\nOptimization terminated successfully.\nCurrent\
    \ function value: 0.000000\nIterations: 20\nFunction evaluations: 22\nGradient\
    \ evaluations: 41\nHessian evaluations: 58\nResult of minimizing Rosenbrock function\
    \ via Newton - Conjugate - Gradient algorithm (Hessian times arbitrary vector):\n\
    fun: 1.47606641102778e-19\njac: array([ -3.62847530e-11,  2.68148992e-09,  1.16637362e-08,\n\
    \             4.81693414e-08, -2.76999090e-08])\n```\n\n### 4.3.2 有约束优化问题\n\n\
    有约束优化问题的一种标准形式为\n\n$$\n\\min f(x) \\quad \\text{s.t. } g_i(x) \\leqslant 0, \\\
    quad i=1,2,\\cdots,m\n$$\n$$\n\\mathbf{A}\\mathbf{x} = \\mathbf{b}\n$$\n\n其中 $g_1,\\\
    cdots,g_m: \\mathbf{R}^n \\rightarrow \\mathbf{R}$ 为 $\\mathbf{R}^n$ 空间上的二次可微的凸函数；$\\\
    mathbf{A}$ 为 $p \\times n$ 矩阵且秩 $\\operatorname{rank}(\\mathbf{A})=p<n$。\n\n考察如下的例子：\n\
    \nMinimize $f(x, y)=2 xy+2 x-x^{2}-2 y^{2}$\nsubject to $x^{3}-y=0$\n$y-1 \\geqslant\
    \ 0$\n\n定义目标函数及其导数为\n\n```python\ndef func(x, sign=1.0):\n    \"\"\" Objective\
    \ function \"\"\"\n    return sign * (2 * x[0] * x[1] + 2 * x[0] - x[0] ** 2 -\
    \ 2 * x[1] ** 2)\n\ndef func_deriv(x, sign=1.0):\n    \"\"\" Derivative of objective\
    \ function \"\"\"\n    dfdx0 = sign * (-2 * x[0] + 2 * x[1] + 2)\n    dfdx1 =\
    \ sign * (2 * x[0] - 4 * x[1])\n    return np.array([dfdx0, dfdx1])\n```\n\n其中\
    \ sign 表示求解最小或者最大值。进一步定义约束条件：\n\n```python\ncons = ({'type': 'eq',\n         'fun':\
    \ lambda x: np.array([x[0] ** 3 - x[1]]),\n         'jac': lambda x: np.array([3.0\
    \ * (x[0] ** 2.0), -1.0])},\n        {'type': 'ineq',\n         'fun': lambda\
    \ x: np.array([x[1] - 1]),\n         'jac': lambda x: np.array([0.0, 1.0])})\n\
    ```\n\n最后使用 SLSQP (Sequential Least Squares Programming optimization algorithm，序贯最小优化算法）进行约束问题的求解（作为比较，同时列出了无约束优化的求解方法）：\n\
    \n```python\nres = opt.minimize(func, [-1.0, 1.0], args=(-1.0,), jac=func_deriv,\
    \ method='SLSQP',\n                   options={'disp': True})\nprint \"Result\
    \ of unconstrained optimization:\"\nprint res\n\nres = opt.minimize(func, [-1.0,\
    \ 1.0], args=(-1.0,), jac=func_deriv, constraints=cons,\n                   method='SLSQP',\
    \ options={'disp': True})\nprint \"Result of constrained optimization:\"\nprint\
    \ res\n```\n\n输出结果：\n\n```text\nOptimization terminated successfully. (Exit mode\
    \ 0)\nCurrent function value: -2.0\nIterations: 4\nFunction evaluations: 5\nGradient\
    \ evaluations: 4\nResult of unconstrained optimization:\nfun: -2.0\njac: array([\
    \ -0., -0., 0.])\nmessage: 'Optimization terminated successfully. '\nnfev: 5\n\
    nit: 4\nnjev: 4\nstatus: 0\nsuccess: True\nx: array([ 2., 1.])\n\nOptimization\
    \ terminated successfully. (Exit mode 0)\nCurrent function value: -1.00000018311\n\
    Iterations: 9\nFunction evaluations: 14\nGradient evaluations: 9\nResult of constrained\
    \ optimization:\nfun: -1.0000001831052137\njac: array([ -1.99999982, 1.99999982,\
    \ 0.])\nmessage: 'Optimization terminated successfully. '\nnfev: 14\nnit: 9\n\
    njev: 9\nstatus: 0\nsuccess: True\nx: array([ 1.00000009, 1.])\n```\n\n### 4.3.3\
    \ 利用 CVXOPT 求解二次规划问题\n\n在 Python 中除了可以使用 opt.minimize 工具处理优化问题外，也有其他专门的优化扩展模块，例如\
    \ CVXOPT(http://cvxopt.org) 专门用于处理凸优化问题，在约束优化问题上提供了更多的备选方法。CVXOPT 是著名的凸优化教材 Convex\
    \ Optimization 的作者之一，加州大学洛杉矶分校 Lieven Vandenberghe 教授开发的，是处理优化问题的利器。\n\nSciPy\
    \ 中的优化模块还有一些特殊定制的函数，专门处理能够转化为优化求解的一些问题，如方程求根、最小二乘拟合等，可到 SciPy 官方网站关于优化部分的页面查看。\n\
    \n在实际生活中经常会遇到一些优化问题，简单的线性规划可以作图求解，但是当目标函数包含二次项时，则需要另觅其他方法。在金融实践中，马科维茨均方差模型就有实际的二次优化需求。作为金融实践中常用的方法，本节对\
    \ CVXOPT 中求解二次规划的问题通过举例详细说明。\n\n#### 1. 二次规划问题的标准形式\n\n二次规划问题的标准形式如下：\n\n$$\n\\\
    min \\frac{1}{2} \\mathbf{x}^T P \\mathbf{x} + \\mathbf{q}^T \\mathbf{x}\n$$\n\
    $$\n\\text{s.t. } G\\mathbf{x} \\leq \\mathbf{h}, \\quad A\\mathbf{x} = \\mathbf{b}\n\
    $$\n\n上式中，$\\mathbf{x}$ 为所要求解的列向量，$\\mathbf{x}^T$ 表示 $\\mathbf{x}$ 的转置。\n\n上式表明，任何二次规划问题都可以转化为上式的结构，事实上用\
    \ CVXOPT 的第一步就是将实际的二次规划转换为上式的结构，写出对应的 $P, q, G, h, A, b$。\n\n- 目标函数若为求 $\\max$，可以通过乘以\
    \ $-1$ 将最大化问题转换为最小化问题。\n- $G\\mathbf{x} \\leq \\mathbf{h}$ 表示所有的不等式约束，同样，若存在诸如\
    \ $\\mathbf{x} \\geq 0$ 的限制条件，也可以通过乘以 $-1$ 转换为 $\\leq$ 的形式。\n- $A\\mathbf{x} =\
    \ \\mathbf{b}$ 表示所有的等式约束。\n\n#### 2. 求解过程示例\n\n二次规划问题如下：\n\n$$\n\\min \\frac{1}{2}x^2\
    \ + 3x + 4y\n$$\n$$\n\\text{s.t. } x, y \\geq 0, \\quad x + 3y \\geq 15, \\quad\
    \ 2x + 5y \\leq 100, \\quad 3x + 4y \\leq 80\n$$\n\n在此例中，需要求解的是 $x, y$，可以把它写成向量的形式，同时，也需要将限制条件按照前面介绍的标准形式进行调整，用矩阵形式表示，如下所示：\n\
    \n$$\n\\begin{aligned}\n&\\min_{(x,y)} \\frac{1}{2} \\begin{bmatrix} x \\\\ y\
    \ \\end{bmatrix}^T \\begin{bmatrix} 1 & 0 \\\\ 0 & 0 \\end{bmatrix} \\begin{bmatrix}\
    \ x \\\\ y \\end{bmatrix} + \\begin{bmatrix} 3 \\\\ 4 \\end{bmatrix}^T \\begin{bmatrix}\
    \ x \\\\ y \\end{bmatrix} \\\\\n&\\text{s.t. } \\begin{bmatrix} -1 & 0 \\\\ 0\
    \ & -1 \\\\ -1 & -3 \\\\ 2 & 5 \\\\ 3 & 4 \\end{bmatrix} \\begin{bmatrix} x \\\
    \\ y \\end{bmatrix} \\leq \\begin{bmatrix} 0 \\\\ 0 \\\\ -15 \\\\ 100 \\\\ 80\
    \ \\end{bmatrix}\n\\end{aligned}\n$$\n\n如上所示，目标函数和限制条件均转化成了二次规划问题的标准形式，这是第一步，也是最难的一步，接下来就简单了。\n\
    \n对比上式和标准形式，不难得出\n\n$$\nP = \\begin{bmatrix} 1 & 0 \\\\ 0 & 0 \\end{bmatrix},\
    \ \\quad q = \\begin{bmatrix} 3 \\\\ 4 \\end{bmatrix}, \\quad G = \\begin{bmatrix}\
    \ -1 & 0 \\\\ 0 & -1 \\\\ -1 & -3 \\\\ 2 & 5 \\\\ 3 & 4 \\end{bmatrix}, \\quad\
    \ h = \\begin{bmatrix} 0 \\\\ 0 \\\\ -15 \\\\ 100 \\\\ 80 \\end{bmatrix}\n$$\n\
    \n接下来就是几行简单的代码，目的是告诉计算机上面的参数具体是什么。\n\n```python\nfrom cvxopt import solvers, matrix\n\
    \nP = matrix([[1.0, 0.0], [0.0, 0.0]])  # matrix区分 int 和 double, 数字后要加强小数点\nq\
    \ = matrix([3.0, 4.0])\nG = matrix([[-1.0, 0.0], [0.0, -1.0], [-1.0, -3.0], [2.0,\
    \ 5.0], [3.0, 4.0]])\nh = matrix([0.0, 0.0, -15.0, 100.0, 80.0])\n```\n"
