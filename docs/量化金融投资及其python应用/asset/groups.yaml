    ```\n\n完整的隐式差分格式 BSMScheme 定义如下：\n\n```python\nclass BSMScheme:\n    def __init__(self,\
    \ model, payoff, T, M, N):\n        self.model = model\n        self.T = T\n \
    \       self.M = M\n        self.N = N\n        self.dt = self.T / self.M\n  \
    \      self.payoff = payoff\n        self.x_min = model.x_min(self.T)\n      \
    \  self.x_max = model.x_max(self.T)\n        self.dx = (self.x_max - self.x_min)\
    \ / self.N\n        self.C = np.zeros((self.N+1, self.M+1)) # 全部网格\n        self.xarray\
    \ = np.linspace(self.x_min, self.x_max, self.N+1)\n        self.C[:,0] = map(self.payoff.ic,\
    \ np.exp(self.xarray))\n        sigma_square = self.model.sigma * self.model.sigma\n\
    \        r = self.model.r\n        self.l_j = -(0.5 * sigma_square * self.dt/self.dx/self.dx\
    \ - 0.5 * (r - 0.5 * sigma_square) * self.dt/self.dx)\n        self.c_j = 1.0\
    \ + sigma_square * self.dt/self.dx/self.dx + r * self.dt\n        self.u_j = -(0.5\
    \ * sigma_square * self.dt/self.dx/self.dx + 0.5 * (r - 0.5 * sigma_square) *\
    \ self.dt/self.dx)\n\n    def roll_back(self):\n        for k in range(0, self.M):\n\
    \            udiag = np.ones(self.N-1) * self.u_j\n            ldiag = np.ones(self.N-1)\
    \ * self.l_j\n            cdiag = np.ones(self.N-1) * self.c_j\n            mat\
    \ = np.zeros((3, self.N-1))\n            mat[0,:] = udiag\n            mat[1,:]\
