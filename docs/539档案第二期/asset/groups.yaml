    In the business boom of the fifties, a new crop of all-purpose household cleaners,
    many much higher priced, began to displace ammonia on the housewife''s cleaning
    shelf. Why?


    The reason was obvious. Ammonia had one objectionable feature: its strong, pungent
    odor made it unpleasant to use.


    In Scranton, Pennsylvania, the problem threatened the livelihood of two ex-GI''s,
    Alvin and Leonard Stahler, who had invested all their savings after the war in
    a chemical plant whose major product was household ammonia.


    They asked themselves. "Could this odor be changed and a more pleasant odor substituted?"


    The problem was not an easy one. The new fragrance had to integrate perfectly
    with the atomic structure of ammonia. It had to have a "clean smell," light and
    fresh, with no cosmetic heaviness.


    The brothers went to work with perfume houses both here and abroad, and, after
    testing almost one hundred fragrances, discovered an essence from Switzerland''s
    famed pine trees which ideally fulfilled both requirements.


