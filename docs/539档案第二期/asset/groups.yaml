    looking for. Without the experience of a watchmaker it is hard to judge various
    special features in today''s watches. Style and design are important but in no
    way do they relate to the quality of the movement. A long-lasting timing-control
    center (jeweled-lever escapement) is the important difference in a good watch...and
    the key to this difference is the Incabloc shock absorber.


    Although most parts and features are common to all watches, there is one — INCABLOC
    — which is found only in watches manufactured with jeweled-lever timing-control
    centers. Incabloc is the protective system that maintains the accuracy and quality
    of these watches and reduces repair costs to a minimum. Its characteristic easily
    recognized lyre-shaped spring can be seen at the center of the moving balance
    wheel.


