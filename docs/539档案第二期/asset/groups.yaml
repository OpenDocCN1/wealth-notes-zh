    Family


    ![](img/8c476e4069f376783468eec04da603b3_140_0.png)


    > Research shows how you can help your children avoid many childhood ailments


    A report in a Medical Journal illustrates how important it is that every parent
    understand the vital role that protein plays during the “growing” years.


    This report, based on observations of hundreds of children, indicates that even
    a mild protein deficiency may result in a number of childhood ailments.


    Poor appetite, failure to gain weight, decreased resistance to many infections,
    persistent boils and sores, all were observed in children where diets were deficient
    in protein. But “prompt and dramatic response” followed when these children ate
    meals that supplied plenty of top quality protein—the kind you get in meat.


    Significant as they may be to parents, these observations were not surprising
    to nutritionists, for it is well known that meat provides essential nutritive
    values that are beneficial to everyone, at every age, and especially to growing
    children.


    Life-giving protein. Meat is one of our richest natural sources of complete, top-quality
    protein—the kind your body needs every day to build blood and muscle, maintain
    resistance to an infection, nourish nerves and tissues.


    B-vitamins, iron and other important minerals. Meat goes a long way toward meeting
    the body’s requirements of these necessary nutrients.


    The fat in meat, too, plays a helpful role. Easily digested, and not too excessive
    in amount, it contributes not only to the joy of eating, but also to the energy
    we need.


    Protein, B-vitamins, minerals, energy — meat provides them all so abundantly (and
    so deliciously!) that it is little wonder people often speak of it as “Meat —
    the Great Provider.”


