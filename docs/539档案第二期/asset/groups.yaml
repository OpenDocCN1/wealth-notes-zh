    # How many

    home accident

    hazards can

    you find here?


    ![](img/8c476e4069f376783468eec04da603b3_48_0.png)


    Look closely at the picture above and you’ll find some potentially dangerous situations
    that could cause accidents in your own home.


    Notice the turned-up corner of the rug, the skates on the floor and the books
    on the staircase. These are invitations to fall—and falls cause over 13,000 home
    fatalities a year.


    Always keep stairways free of obstructions, provide a storage place for toys—and
    teach children to keep them there. Rugs, of course, should be made trip and slide-proof.


    See the open fire without a screen? It’s estimated that over 1,500 homes are attacked
    by fire each day. Every fireplace should be screened—especially for the safety
    of toddlers.


    Did you spot the frayed electric cord leading to the table lamp? It could cause
    severe shock, or a painful burn. Be sure that all the cords and electrical outlets
    throughout your home are always in good repair.


    Notice the heavy vase on the table? A youngster could reach it easily . . . and
    pull it over on himself. Keep heavy objects centered on tables.


    What about other potential "danger spots" in your home? The bathroom can be especially
    dangerous—if medicines are left where young children can get at them. All medicines
    should be kept in a secure storage place. And so should bleach, lye, insecticides
    and cleaning fluids.


    > Poisoning from such substances is now a common medical emergency among young
    children.


    Last year home accidents took the lives of 28,000 Americans and caused over four
    million disabling injuries. Why not inspect your home for potential sources of
    accidents—and make necessary repairs or arrange for their removal?


