    # 5、令人讨厌的人：值得你为他们花费精力吗？


    # Troublesome People:


    # Are they worth your trouble?


    ![](img/8c476e4069f376783468eec04da603b3_22_0.png)


    Why should you help people who cause trouble for you? And even if you want to
    help them, do you know how?


    Doctors know troublesome people are often people in trouble. The person who causes
    trouble for you may be in trouble himself—bad trouble! He may be mentally ill.
    Today, one in every 10 Americans suffers from mental illness. Why does he cause
    trouble? As irritating and annoying as this person’s behavior is to you, it is
    immeasurably more of a problem to him. Actually, he may want to get along with
    other people. But something inside him keeps forcing him to act in a manner that
    upsets others. Can you help? Of course you can help. Although your first natural
    impulse may be to fight back, experience shows that this seldom if ever accomplishes
    anything. Actually, the help you can give is so simple that it’s hard to believe
    it will work at all. What these people need is understanding…your understanding
    that they have a problem.


    Sympathize…don’t criticize! Lend a friendly ear. Let them know that you are interested
    in what they feel…what they think…what they say! Help them realize that everyone
    is not against them. Let your own interest prove this. Is it worth your trouble?
    When you give your understanding to a troubled person, suspicion and mistrust
    begin to fade. Life becomes more livable for him and more bearable for you, and
    those others who must live, work and be around him. If you can help one troubled
    person, it is certainly worth your trouble to try


