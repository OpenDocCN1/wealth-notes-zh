    # It is Due to Film


    TARTAR shows that teeth are not kept clean. The basis is a slimy film. If you
    removed it daily tartar would not form. That film on your teeth causes most tooth
    troubles. It is ever-present, ever-forming. You can feel it with your tongue.

    The film is what discolors, not the teeth. It holds food substance which ferments
    and forms acid. It builds the soil in contact with the teeth to cause decay.

    Millions of germs breed in it. They, with tartar, are the chief cause of pyorrhea.


    This film is invisible, so it clings. It gets into crevices and stays. The ordinary
    dentifrice does not dissolve it. The tooth brush leaves much of it unused. That
    is why the best brushed teeth so often discolor and decay.

    Every dentist knows this. Dental science has for years sought a way to eliminate
    that film. That way has now been found. And, for daily use, it is embodied in
    a dentifrice called Pepsodent.

    We ask you to write for a free 10-Day Tube and learn what it means to your teeth.


