    ![](img/8c476e4069f376783468eec04da603b3_124_0.png)


    # How the switch of a horse tail helped bring eye comfort to millions


    This story dates back to America’s "gay nineties" era and involves a Spokane banker,
    a horse and a Chicago eye specialist. In a freak accident, a spirited horse swung
    its tail and the coarse hairs cut the cornea of Otis F. Hall’s eye. When specialized
    medical care was needed, Hall went to Chicago. Accompanied by his son Frank, who
    was also troubled by an eye irritation, he sought out Dr. James B. McFatrich.


    Within weeks their eye ailments were cured. Also Hall made an astonishing discovery.
    It was a special eye preparation which Dr. McFatrich compounded and regularly
    prescribed for his patients. Hall found it amazingly soothing and comforting for
    regular use after his eye ailment had been cured.


    Why couldn’t it be made available to persons outside the McFatrich practice, the
    banker asked. The physician was reluctant, but eventually agreed. A larger number
    of persons could be served than by limiting the preparation only to his practice.
    And so the Murine Company was founded August 11, 1897, taking its


    ![](img/8c476e4069f376783468eec04da603b3_124_1.png)


    name from the first and last syllables of a basic ingredient, muriate of berberine.
    Dr. James McFatrich was the Murine Company’s first-president.


    Today, Murine eyedrops are stocked in 99 percent of all drug stores throughout
    America and in thousands of other retail outlets, as well as in more than 60 countries.
    Murine is an isotonic fluid which means it blends perfectly with the natural,
    alkaline fluids of the eye. Thus it adds to nature’s system for cleansing the
    eyes by reinforcing the natural action of the tears. Murine washes away the discomforts
    of dust, smoke, dirt or wind. The eyes respond with a feeling of cool refreshment.
