    小男孩儿还记得上次在揭包扎纱布的时候，那种剧烈的疼痛。


    现在，他能感觉到医生慢慢松开伤口上的纱布。“好的”他说。“揭下来吧，我能忍住”


    “揭下来？已经揭下来了啊！”


    皮特坐了起来。“但是 一点也不疼啊！”他喊道。


    在伊利诺斯州医院，临床研究医师碰巧遇到了这样的情形。


    但是，这样的情形全国所有医院，每天都会遇到。因为，那些著名的医院对烧伤，还有切伤都开始使用一种全新的伤口敷料了。他们把传统的纱布，换成了 TELFA 无菌纱布垫——这种纱布垫，在揭下来的时候，伤口不会有疼痛。


    到目前为止，你在家里还用不到 TELFA 无菌纱布垫，因为医生和医院采购了全部的货物。但是，现在我们提高了生产量。这是有史以来第一次，你可以在急救用品店买到它。


    如果你用纱布包扎过大伤口，你肯定知道，在伤口愈合后，它会粘到伤口上。所以，当你揭开纱布时，会扯掉伤口结疤。不仅伤者会感到很疼痛，而且会降低伤口愈合速度——本来已经快愈合的伤口，又被撕裂了。


    但是 TELFA 无菌纱布垫不会粘到伤口上。这就意味着你在揭开纱布的时候，不会感到疼痛，因为结疤不会被撕裂。所以，用 TELFA 无菌纱布垫，伤口愈合得更快。


    ## 孩子受伤包扎后，再也不会害怕揭纱布了

    ——因为在你揭纱布时，一点也不疼。


    TELFA 无菌纱布垫，就像一个极薄的三明治。它外面是两层塑料打孔薄膜“皮肤”——中间是特殊无纺棉。无纺棉不会接触伤口，所以不会粘到上面，揭开的时候，不会感到疼痛。其中一个塑料面接触伤口，所有的液体，都会通过上面的无数小孔，被吸附到无纺棉上。另一个塑料面则会把细菌、灰尘等挡在外面，保持伤口，以及纱布的清洁。


    TELFA 无菌纱布垫吸收能力强，不粘伤口——总之，是一款完美的包扎带。


    有多完美？医生们经过两年临床测试，发现：


    在两个著名医院中——一个在芝加哥，另一个在另外一个州——TELFA 无菌纱布垫在超过 1000 位病人身上进行临床测试。结果发现：所有测试都表明，TELFA
    无菌纱布垫比普通纱布好。


    难怪所有医院都换了 TELFA 无菌纱布垫！现在你也可以用到了。TELFA 无菌纱布垫有两个型号，你可以根据伤口大小，任意裁剪。


    下次在给孩子包扎膝盖时，记住，你还要把它拿下来。所以，一定要使用 TELFA 无菌纱布垫——不会带来疼痛的纱布垫。


