    It must be downright embarrassing for a watch when it fails to keep good time.
    And it’s somewhat embarrassing for you, too, as well as being constantly annoying.


    But what actually makes a watch keep true time for years and years? Workmanship
    and materials. Many screws in a fine watch are so small 50,000 can fit in a thimble,
    yet they, too, must shine with pride.


    So at Bulova we produce, fit, polish and hone the most microscopic parts with
    the exquisite care an Oriental might give to engraving a prayer on a pin. It is
    a leisurely, unhurried process. It actually takes about 6 months to fashion one
    Bulova—and as many as 30 different teams of experts may work on the watch. Yet
    when the movement is completed, the parts whisper past each other smoothly, glossily—like
    silk.


    But there are further points of wear where pivots move back and forth…back and
    forth…18,000 times an hour. These we guard with jewels—jewels drilled with holes
    as fine as a human hair. Unlike cheaper


    bearings, these will literally never wear away. In fact the whole assembly has
    so much sheen and luster, you could wear the watch inside out with pride.


    Then we do something rather shocking. We take this beautifully precise instrument
    (with more than 125 parts) and do our best to break it. We’ve thrown our watches
    from roofs, tied them to water skis, strapped them to record-breaking speedboats,
    sent them over Niagara Falls. But we know, as you should know, that the greatest
    torture test of all is time. You don’t have to baby a fine watch. It’s the roughly
    made cheap watches that can’t take it…for long.


