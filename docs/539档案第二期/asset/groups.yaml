    ### Now It''s Easy to

    Stay on Your Diet!


    ![](img/8c476e4069f376783468eec04da603b3_67_0.png)


    THE HUMAN URGE for pleasure is strong, and has long been a part of the ritual
    of eating. Little wonder, then, that many a would-be reducer has resorted to unwise
    snacks or abandoned his reducing program altogether, after days of dietary exile.


    In an effort to deceive his normal appetite for tasty foods, he turns to "reducing
    pills" which, by increasing basal metabolism rate, may make him nervous and irritable.
    To supplement the loss of food nutrients, he puts himself to the expense of vitamin
    pills. And meanwhile, he is confronted daily with the palatable meals of the rest
    of the family who eat as they please.


    For millions of Americans who really want to be slim, there is now an answer.
    It is the Diet-Master method of cooking foods so that they are colorful, palatable,
    and nutritious without addition of weight-producing condiments.


    The Diet-Master by Presto retains natural salts and sugars, reducing craving for
    high calorie sweets. Foods cooked this way have a high satiety value — because
    they are flavorful, it is unnecessary to eat so much to feel comfortable.


    Whole meals may be cooked in minutes in this one cooker because food flavors do
    not mix. And the owner of a Diet-Master may prepare a complete and appetizing
    diet meal with his own personal cooker without disrupting the food pattern for
    the entire family.


    An infinite variety of foods is available to the dieting individual who follows
    the Diet-Master method of cooking; this is true whether his diet is low-caloric,
    bland, or the low-fat, low-cholesterol diet which many doctors now feel may be
    of high importance in preventing heart disease.


    Calorie count, in all cases, should be followed carefully as recommended by your
    doctor. Would you like a comprehensive palm-size calorie chart to carry with you?
    It will be mailed to you, along with facts about the Diet-Master by Presto, if
    you send 10c to cover handling charges to National Presto Industries, Dept. R,
    Eau Claire, Wisconsin.


