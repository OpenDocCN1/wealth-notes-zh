    > A hurricane changed its course and disaster struck a sleeping town . . .


    ## It Came Without Warning


    By Gene Wilburn, Medical News Writer, Houston Chronicle


    It was a dark and wretched day when Hurricane Diane ripped through a small New
    England town — lashing its trees and swelling its river into a raging torrent.
    As night fell, sudden hills became great waterfalls . . . gullies became rivers
    . . . and valleys became lakes. The floods had begun—and within minutes, the nation
    was alerted to a great disaster.


    Then came the awful aftermath . . . The waters receded, leaving death and debris
    in their wake. Slowly the dazed evacuees returned to face the task of restoring
    their homes. Neighboring towns rushed to their aid—with food, clothing, medicine,
    including Lysol to help protect the people from spread of contagious disease.


    Because silt and debris make perfect havens for deadly disease germs, public health
    notices often include the caution to wash down stricken houses with a solution
    containing an efficient germicide like Lysol.


    But disaster conditions are not the only times when Lysol is needed in the home.
    One of the critical areas for spread of infection can be the bathroom. For, dangerous
    disease germs (like "staph" which is currently making medical news headlines)
    are readily deposited by carriers on bathroom surfaces.


    Lysol Brand Disinfectant kills disease germs on contact—even resistant "staph"
    germs and many deadly viruses. In laboratory tests, its anti-germ action was found
    to last 7 full days.


    That is why housewives should use Lysol for weekly bathroom cleaning. A few drops
    in cleaning solution will disinfect from one cleaning to the next as nothing else
    can.


    Here are 3 basic steps for weekly bathroom cleaning:

    1. Add Lysol to solution as directed.

    2. Wipe floors, walls, basins, fixtures with this solution.

    3. When laundering bath mats and lid covers, soak in Lysol solution before adding
    detergent. Note: If anyone in your home has a boil (a direct source of "staph"
    contamination)—disinfect basin, bowl, seat with Lysol after every use.


    There is now a pine-scented form of Lysol too. Regular or pine Lysol costs as
    little as 20¢.


    ## 它悄然来袭，没有一点预警


