  md: "\n# 沉睡了数年——某些细菌又重新苏醒了——它在浴室找到了自己的天堂\n\n来自：吉因·威尔伯恩\n休斯敦纪事报、医疗新闻撰稿人\n\n虽然现在许多引发疾病的细菌都被抗生素消灭了——但是，原来的某些细菌，在和我们的器官和腔相处数年后，又以新的摧毁力量重新出现了。\n\
    \n这些细菌——包括大肠杆菌，变形杆菌和气杆菌——之前一直帮助清除人体肠道的废物。\n\n这些“肠道”细菌一直被某些疾病细菌（如链球菌和肺炎球菌）的分泌物所抑制。这些疾病细菌在抗生素的控制下，使得一些毒性肠道细菌有机会引发严重的系统性感染。因此，最近增加了一些因新出现的抗生素耐药细菌“葡萄球菌”引发的问题。\n\
    \n所有这些细菌，都会通过表面直接接触而感染——比如，当浴室地板，以及浴室用品上沉积这些细菌，人接触就会感染。事实上，浴室有可能成为疾病传播的关键区域。\n\
    \n这就是为什么说，浴室清洁剂一定要能杀死“葡萄球菌”，以及其他潜伏在浴室里，可能引发疾病的细菌。据相关实验室测试表明，肥皂，以及一般的松油洗涤剂，都无法杀死“葡萄球菌”——所谓的“消毒液”不是清洗剂的那种……也可能无法杀死它们接触到的所有病菌。\n\
    \n现在又一款家用产品，已经被证明是一种有效的杀菌剂。那就是来苏尔牌消毒剂，它能杀死它接触到的所有病菌——包括致命的肠道细菌，“葡萄球菌”，以及其他许多致命病菌。实验测试发现，它的杀菌威力能持续7天。\n\
    \n下面是每周浴室清洁的3个基本步骤：1、直接把来苏尔添加到常用洗涤液中。2、用添加了来苏尔的洗涤液擦地板、墙壁。3、在清洗浴垫和各种盖子时，先把它们在添加了来苏尔的洗涤剂中浸泡几分钟。注意：如果家里有人感染了病菌（“金黄色葡萄球菌”的直接来源），那么，病人每次使用过的浴缸、盆、碗、座位，都要用來苏尔进行消毒。\n\
    \n来苏尔的消毒效果能从这个周末清洁后，持续到下个周末清洁时，这是其他任何消毒液都无法做到的。对于那些喜欢飘满松木香的产品，我们还研发了松香型来苏尔消毒液。原味型和松香型，价格均为29美分。\n\
    \n## 笔记\n\n## 22、\"谁需要股票方面的建议？\"\n\n![](img/8c476e4069f376783468eec04da603b3_87_0.png)\n\
    \nSure as thing about investing in stocks is this: you just can't afford to \"\
    hide\" from the facts and figures. But neither do you have to dig to get them!\
    \ Fortunately, the kind of information you'll want is easily available—and free.\
    \ Simply visit a Member Firm of the New York Stock Exchange.\n\nWhat will they\
    \ do for you? Well, a Partner or Registered Representative will sit down with\
    \ you and discuss, first of all, just what your investment goal is. Maybe you're\
    \ eager for a \"second income\" to sweeten the regular one you get from your job.\
    \ In that case, he may suggest common or preferred stocks or bonds which he thinks\
    \ will continue to show a good record of return.\n\nOr you may be looking for\
    \ a place to put some of your capital where it may grow and help offset rising\
    \ prices. In that case, he may recommend stocks that he considers have good possibilities\
    \ for growth.\n\nIn any case, once your Member Broker knows what you're after,\
    \ he'll give you facts and figures about the companies behind the securities you're\
    \ interested in. It's plain as the nose on your face—there's the sound way to\
    \ do your investing. Never trust tips, rumors or hunches!\n\nAnd, of course, use\
    \ only the money which you have left over after regular expenses and emergencies\
    \ are provided for. As you know, stock and bond prices go down as well as up—and\
    \ there's also the risk that some companies may not pay dividends or interest.\n\
    \nBy all means, inquire about the convenient Monthly Investment Plan. You may\
    \ find it to your liking because it lets you pay as you go. You can select from\
    \ some 1,500 stocks listed on the New York Stock Exchange and start your investing\
    \ with as little as $40 every 3 months. Later, if you wish and can afford it,\
    \ you can increase your amount up to as much as $1,000 per month. And you can\
    \ start or stop a Plan any time you wish.\n\nTalk things over with your Member\
    \ Firm.\n\n# Members New York Stock Exchange\nOwn your share of American business\n\
    \nFor offices of Members nearest you, look under New York Stock Exchange in the\
    \ stock broker section of the \"Yellow Pages.\"\n\nSEND FOR FREE PROSPECT. Mail\
    \ to a Member Firm of the Stock Exchange, or to the New York Stock Exchange, Dept.\
    \ P-12, P.O. Box 1575, New York 1, New York. Please send me, free, \"PROFITS OVER\
    \ THE YEARS, a basic guide for common stock investment.\" NAME ______ ADDRESS\
    \ ______\n\n## \"谁需要股票方面的建议？\"\n\n股票投资中，有一件事是非常肯定的，那就是：如果有些信息或数据你不了解，你就会损失惨重。不过，你完全不用亲自去挖掘这些信息！访问纽约证交所的会员事务所，你就可以免费，轻松地得到它们。\n\
    \n他们帮你做什么呢？你来到公司，会有公司合伙人，或注册代表接待你，首先，和你讨论你的投资目标。也许，你是除了本职工 作收入，想多一项收入，让生活更滋润。这种情况下，他可能建议你投资普通股，或优先股或债券，这些都可以让你持续获得返利。\n\
    \n或者，你是想找一个地方，存放你的资金，通过产生的利息，抵消上涨的物价。在这种情况下，他可能会推荐他认为增长可能性很大的股票给你。\n\n无论什么情况，一旦成员代理了解了你的需求，他都会为你提供你感兴趣的公司证券的幕后信息和数据。很明显——这是你最理想的投资方式。永远不要相信技巧，谣言或直觉！\n\
    \n当然，只用你日常开支，预留的紧急开支之后剩下的资金。你也知道，股票和债券价格有上涨，也有下降——而且面临某些公司可能不会支付股息或利息的风险。\n\n\
    不管怎样，咨询方便的月度投资计划准没错。你会发现你非常喜欢这种方式，因为它是现收现付。你可以从纽约证券交易所上市的 1200 支股票中，任选一个，每 3 个月最低只需投资\
    \ 40 美元。以后，等你有更多资金了，如果你愿意，你可以把每月投资额增加到 1000 美元。你可以在任何时候启动或停止你的投资计划。\n\n立刻去会员事务所协商投资事宜吧。\n\
    \n## 纽约证券交易所会员事务所\n\n这里有你的美国企业股票\n\n去离你最近的纽约证券交易所下的会员事务所，\n查看纽约证券交易所黄页中的“股票经纪人”吧。\n\
    \n发邮件给证券交易所的会员事务所，\n纽约，纽约证券交易所，9-RL 部门，\n1070 邮箱，  索取免费小册子。 \n\n请寄给我一本免费的普通股投资指南\n\
    《红利年刊》。”\n\n姓名 ________________\n地址 ________________\n经纪人 ________________\n\n\
    ## 笔记\n\n## 23、医生帮助我们设计，并检验了我们最新的护背床垫\n\n![](img/8c476e4069f376783468eec04da603b3_91_0.png)\n\
    \n公众微信：LBC333\n\n# Doctors helped us design and prove our new Back Care mattress\n\
    \nRECENT RESEARCH shows that 1 out of 3 people has a \"problem\" back. Some require\
    \ special medical care, but in many cases a mattress causes their problem.\n\n\
    Doctors agree that one cause of the most common type of backache, or so-called\
    \ \"low-back syndrome,\" is inadequate mattress support. It affects the small\
    \ of the back, the part most subject to stress.\n\nMany \"modern mattresses\"\
    \ with routine construction still sag. They fail to give support where it’s needed\
    \ most. Simply adding a bedboard underneath won’t prevent center sag because it’s\
    \ outside and too far from the top of the mattress.\n\nNew Back Care – first and\
    \ only mattress with bedboard built into the mattress. The new mattress design\
    \ was performed at the request of doctors and under the supervision of a panel\
    \ of orthopedists.\n\nNew Back Care helps prevent back aches. The upper layer\
    \ of 312 coils adjusts to body contours for comfort. The built-in bedboard is\
    \ in the center, up close to your back where support is needed. The bottom layer\
    \ of 512 springs equalizes weight and prevents sag.\n\nThe result: firm but gentle\
    \ corrective action all night long.\n\nNo extra cost for Back Care. In spite of\
    \ its superior, costly construction, Back Care retails at only $70.50—same price\
    \ as other well-known mattresses.\n\nIf you suffer from backache, see Back Care\
    \ at your store selling Simmons. Insist on the genuine Back Care.\n\nWrite for\
    \ an informative free booklet called \"The Prescription Mattress.\" Address your\
    \ card to Simmons Co., Dept. AA, Merchandise Mart, Chicago, Ill.\n\n![](img/8c476e4069f376783468eec04da603b3_91_1.png)\n\
    \n## 医生帮助我们设计\n## 并检验了我们最新的护背床垫\n\n最近调查显示，每3个人中，就有1个背部有“问题”。有些需要特殊医疗，但是大多数人的背部问题，都是床垫引起的。\n\
    \n医生也认为最常见的背痛，或者所谓的“腰背综合征”，都是由于床垫支撑不足引发的。它会影响下背部，这里是承受压力最大的地方。\n\n许多普通构造的“弹性床垫”，睡下去依然会凹陷。他们无法给最需要支撑的部位以足够的支撑。仅在下面简单地加一块床板，无法阻止中心凹陷，因为它和床垫顶部隔得太远。\n\
    \n全新护背床垫——第一款，也是目前唯一一款在床垫里加了床板的护垫。这种全新的床垫设计，完美地满足了医生的要求，得到了很多外科医生的支持。\n\n全新护背床垫有助于防止背痛。床垫上层312个线圈，能根据身体轮廓而改变，极为舒适。中间内置的床板，给你的背部以必要的支撑。底层的312根弹簧，能支撑重量，防止凹陷。\n\
    \n结果：给你整夜强力，但温和的支撑。\n\n购买护背床垫，不用多加额外费用。尽管这个床垫、高级，造价昂贵，但是，它的零售价只有79.50美元、和其他知名床垫的价格一样。\n\
    \n如果你也遭受着背痛的困扰，快去你喜欢的商店里，看看席梦思护背床垫吧。一定要购买真正的护背床垫。\n\n你可以写信给我们索取免费小册子《处方床垫》。来信请寄：\n\
    \n芝加哥商品市场 AA.部门，席梦思公司\n\n![](img/8c476e4069f376783468eec04da603b3_93_0.png)\n\n\
    专利©1959 席梦思公司 商品市场 芝加哥\n\n## 笔记\n\n## 我为什么为蓝十字会无偿服务！\n\n来自：乔治·A·纽伯里\n制造&贸易信托公司总裁\n\
    蓝十字计划董事会会长 纽约布法罗\n\n我必须承认，14 年前，当有人请我为布法罗蓝十字会服务时，我尚未真正意识到我的工作都包含什么。\n\n当然，我知道我必须参加会议，协助制定政策。我以为就这些。我从来没有想到这个“业余”活动，会成为我生活中极其有趣，且非常重要的一部分。\n\
    \n从开始工作，我就发现，我身在一个工作严肃认真、努力勤葳的一个团队——他们分别代表着红十字的会员，雇主，医生以及医院工作人员。在遇到我所处行业，以及法律相关问题时，他们都会寻求我的建议，弥补自己的不足。在这里的每一个会议，每一次讨论，都会加深我对蓝十字成员的责任感，以及团队合作意识。\n\
    \n我对蓝十字的了解不断增加。例如，全国有超过 80 个蓝十字计划。全部依赖于像我这样的董事会成员和志愿者，帮助他们为 5100 万个成员尽可能提供最好的服务。\n\
    \n我也越来越意识到蓝十字会在他们社区的重要性。它是需要住院治疗的人，以及提供相关治疗服务的医院之间的重要纽带。它使得让美国人享受到比历史上其他民族更高水准的健康关怀成为可能。\n\
    \n如果你知道仅去年一年，美国蓝十字就为它的成员提供了超过十亿美元的医疗费用援助，你就知道此言不虚了。\n\n有时，回顾蓝十字董事会会议的议程时，我会问自己：“为什么要我承担这个本不属于我的责任？”年复一年，答案逐渐变得清\
    \ 晰。“它给我提供了一个为社区服务的特殊机会。”\n\n我不得不承认，这不是一项轻松的任务。而且我没有任何酬劳。我们董事会成员从未收到过任何酬劳。也没有为我们做过任何宣传。蓝十字会志愿者很少出现在印刷媒体上。\n\
    \n它成了我更深一层的信仰。我相信蓝十字。我相信它为改善我们的社区，以及美国人生活方式做出了独特贡献。我相信蓝十字会能够，也将会在未来做出更多贡献。我想，成为蓝十字志愿者，是我一生中最有价值的成就之一。\n\
    \n本文属蓝十字协会公益广告，位于纽约市34大街55号\n\n## 笔记\n\n## 25、干燥肌肤的新希望\n\n# World-famous cosmetologists\n\
    reveal the beauty secret\nthat was kept for centuries\n\n# New Hope for Dry Skin\n\
    \nON a 10th-century battlefield a corpsman ministers to a wounded Saracen. In\
    \ the 18th’s a Scots woman uses a \"comfort\" potion. Centuries and continents\
    \ apart, these two primitive healers rely on the curative powers of the same root:\
    \ comfrey. Was it superstition? Or did the famed healing powers of the root have\
    \ a scientific basis? Modern medical men thought they did. And the search went\
    \ on till the 20th century when comfrey’s secret was finally extracted and proved\
    \ to have amazing power to rebuild tissue. But it remained for Pond’s research\
    \ chemists to see the cosmetic value of this remarkable \"rebuilder\"... to repairing\
    \ dry skin! Pond’s christened it \"Stimulin\" and started the search for a way\
    \ to add it to Pond’s Dry Skin Cream’s world-famous Moisturized Lanolin formula.\
    \ Now that way has been found. The key to this cream’s restorative powers is simply\
    \ that it encourages skin to behave naturally. The skin is always renewing itself:\
    \ young cells push upward, dry lifeless surface cells flake off. But dry skin\
    \ is \"lazy\" skin. It just can’t seem to discard those dry, lifeless cells fast\
    \ enough.\n\nThey accumulate on the skin surface. Of immediate benefit to dry-skin\
    \ sufferers is the way Stimulin in Pond’s Dry Skin Cream starts to disperse this\
    \ accumulation within 10 minutes of the first application. As the dry, lifeless\
    \ cells are gently cream away, the skin begins to \"breathe\" normally again.\
    \ Stimulin literally \"opens the door\" for Pond’s Moisturized Lanolin formula\
    \ to penetrate faster, restoring the balance necessary for the skin’s freshness,\
    \ vigor, tone. But it is the long-range benefits of the cream which seem to be\
    \ most remarkable. Continuous use of new Pond’s Dry Skin Cream with Stimulin retains\
    \ dry skin to function as nature intended, i.e. regularly discarding its dry,\
    \ flaky cells and producing fresh, well-lubricated young tissue. Treatment may\
    \ be started immediately since new Pond’s Dry Skin Cream with Stimulin is now\
    \ available wherever cosmetics are sold, priced at 45¢ to $1.00 plus tax. For\
    \ write for sample trial size jar and explanatory booklet \"The Beauty Secret\
    \ that Kept for Centuries.\" Send 25¢ to Pond’s Dry Skin Cream, Box 657, New York\
    \ 46, N.Y.\n\n![](img/8c476e4069f376783468eec04da603b3_99_0.png)\n\n#59001\n"
