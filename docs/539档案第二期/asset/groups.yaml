    ## 37、血液中的抗感染战士


    ### Infection Fighters in your blood


    Research has demonstrated that the foods we eat, especially protein foods, play
    a very important role in building the body''s ability to fight infection.


    One reason is that antibodies in the blood (which actually do the "fighting")
    are made of protein—the kind you get in meat.


    The body''s ability to produce these antibodies decreases when meals provide too
    little protein over a period of time. A good diet containing adequate protein
    keeps the body in "fighting form."


    This is just one of many reasons why a good, nutritious diet is vitally important—so
    important that "Food Comes First" was the general theme when famous scientists,
    educators and medical authorities, plus leaders in commerce and industry, met
    last month in a great National Food Conference at Washington, D. C.,


    ![](img/8c476e4069f376783468eec04da603b3_143_0.png)


    keynoted by the President of the United States.


    Their aim: to re-awaken America to the fact that good food means better living
    and to set forth urgent need for correcting the inadequacy and imbalance of many
    family meals.


    Good food, naturally, includes plenty of good meat, for meat provides so many
    necessary nutrients in such generous amounts. It is one of our richest natural
    sources of complete, top-quality protein—an every day essential. It goes a long
    way toward meeting the body''s requirements of B-vitamins, iron and other important
    minerals. And the fat in meat—easily digested—contributes not only to the joy
    of eating, but to the energy we need.


    Protein, B-vitamins, minerals, energy—meat provides them all—so deliciously—that
    it is little wonder people often speak of it as "Meat—the Good Provider."


    The nutritional statements made in this advertisement have been reviewed by the
    Council on Foods and Nutrition of the American Medical Association and found consistent
    with current authoritative medical opinion.


