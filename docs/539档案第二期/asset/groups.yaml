    ## 21、沉睡了数年，某些细菌又重新苏醒了——它在浴室找到了自己的天堂


    ![](img/8c476e4069f376783468eec04da603b3_83_0.png)


    Miracle drugs open Pandora''s box of infections...


    ## ASLEEP FOR AGES—GERMS AWAKEN—FIND HAVEN IN TODAY''S BATHROOMS


    By Gene Wilburn,

    Medical News Writer, Houston Chronicle


    While many of man''s disease germs are being destroyed by the antibiotics—old
    germs with new destructive powers are arising, after ages of virtually peaceful
    existence within our organs.


    Some of these organisms—Colibacillus, Proteus and Aerobacter, by name—have been
    helping to clear the body of waste matter in the intestines.


    These "intestinal" germs have been held in check by secretions from certain disease
    germs like streptococcus and pneumococcus. With control of these disease germs
    by the antibiotics, some virulent intestinal germs are causing serious systemic
    infections. This adds to the problem recently created by the emergence of antibiotic
    resistant germs known as "staph."


    All these germs can be picked up by direct contact with contaminated surfaces—for
    example, when deposited on bathroom floors and fixtures. Indeed, the bathroom
    can become a critical area for spread of disease.


    That is why the bathroom cleanser should have the power to kill both "staph" and
    the other disease-bearing germs that may lurk in the bathroom. Published laboratory
    tests show that


    neither soap suds nor usual pine oil solutions have the power to kill "staph"—that
    so-called "sanitizers" are not germicides... that is, they may not kill all the
    disease germs they touch.


    One household product has proved to be an efficient germicide. Lysol Brand Disinfectant
    kills disease germs on contact—including virulent intestinal germs, "staph" and
    many deadly viruses. And, in laboratory tests, its germicidal action was found
    to last 7 full days.


    Here are 3 basic steps for weekly bathroom cleaning:

    1. Add Lysol to regular cleaning solution as directed.

    2. Wipe floors, walls, fixtures with this solution.

    3. When laundering bath mats and lid covers, soak in Lysol solution before adding
    a detergent. Note: If anyone in the family has a boil is direct source of "staph"
    contamination—disinfect bathtub, basin, bowl, seat with Lysol after every use.


    > Lysol disinfects from one cleaning to the next as nothing else can. For those
    who like a pine-scented product, there is now a pine-scented form of Lysol. Regular
    or Pine Lysol costs as little as 29¢.

