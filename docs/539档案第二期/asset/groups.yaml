    ## 20、他们除去了氨的气味


    ![](img/8c476e4069f376783468eec04da603b3_79_0.png)


    ## They took the odor out of ammonia


    and created a new, pine-fragrant formula that is changing the housecleaning habits
    of American homemakers


    ![](img/8c476e4069f376783468eec04da603b3_79_1.png)


    FOR GENERATIONS, no American homemaker considered her home really clean without
    the aid of household ammonia. Any grandmother will recall that in her day it was
    as necessary to household cleanliness as soap to personal cleanliness.


    In the business boom of the fifties, a new crop of all-purpose household cleaners,
    many much higher priced, began to displace ammonia on the housewife''s cleaning
    shelf. Why?


    The reason was obvious. Ammonia had one objectionable feature: its strong, pungent
    odor made it unpleasant to use.


    In Scranton, Pennsylvania, the problem threatened the livelihood of two ex-GI''s,
    Alvin and Leonard Stahler, who had invested all their savings after the war in
    a chemical plant whose major product was household ammonia.


    They asked themselves. "Could this odor be changed and a more pleasant odor substituted?"


    The problem was not an easy one. The new fragrance had to integrate perfectly
    with the atomic structure of ammonia. It had to have a "clean smell," light and
    fresh, with no cosmetic heaviness.


    The brothers went to work with perfume houses both here and abroad, and, after
    testing almost one hundred fragrances, discovered an essence from Switzerland''s
    famed pine trees which ideally fulfilled both requirements.


    They named the new product "Sea Mist" suggesting the clean, fresh smell of the
    sea. At the same time, they set out to see if ammonia could be made even faster-acting
    than before. In February, 1955, they achieved a new detergent formula that works
    this way:


    (continued next page)


    ![](img/8c476e4069f376783468eec04da603b3_79_2.png)


    ## 他们除去了氨的气味


    研发了一种全新的松香味消毒剂配方

    改变了美国家庭主妇清理房间的习惯


    世代以来，美国的家庭主妇们都认为，如果没有家用氨水，家里就不能真正清理干净。老人称记得，以前家里做清洁，家用氨水和香皂一样，是必不可少的。


    五十年代商业逐渐繁荣，许多新型多用家用清洁剂开始取代家用氨水出现在货架上，其中大多数价格都要高于家用氨水。为什么？


    很明显，家用氨水有一种令人讨厌的特点：它有股强烈，刺鼻的气味，用起来很难闻。


    这个问题威胁到了宾夕法尼亚州斯克兰顿两个退役军人的生计——艾尔文和伦纳德斯特尔。战后他们把所有积蓄都投资到了一家主要生产家用氨水的化工厂。


    他们在想，"是否可以改变这种气味，用更好闻的气味取代它呢。"


    这个问题很难。新香味必须和氨的原子结构完美结合。它必须“清新”，要有香味，但还不能太浓。


    为了研究怎么能让清洁后的房间空气清新，他们兄弟两个开始在圈内外进行探索。在测试了将近 100 款香水后，他们终于发现，来自瑞士的一种著名的松树，能同时满足清


    洁和清新两种要求。


    他们把这款新产品命名为“海雾”，寓意来自海洋的干净，清新的味道。同时，他们还着手研究如何让家用氨水的清洁速度更快。1955年2月，他们终于研发出了一种洗涤剂新配方：（未完待续）


