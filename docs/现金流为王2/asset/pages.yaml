    # 資產輕重看效率


    要判斷輕資產還是重資產的商業模式較好，首先我們需要思考一下哪種模式的創造價值能力、效率比較高，當中我們需要同時考慮資本投入的因素。一個特別重要的指標就是「資產產生價值」的能力。從經濟、財務的角度，一般會以經濟附加值（Economic
    Value Added，EVA）作為判斷資產創造價值能力的指標。


    經濟附加值是企業在一段時間內的稅後營業淨利潤（NOPAT）與投入資本的資金成本之差額。也就是說，價值一元的資產所產生的淨利潤，與相同金額的銀行存款或債券利息相比，如前者較後者低，那就不如把錢'
