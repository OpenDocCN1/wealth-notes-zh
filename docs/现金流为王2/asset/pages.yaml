- pgno: 74
  md: '資與投資之間嚴重輸掉了時間值。長期下去，兩者的差距會大到難以想像。


    # 分清三種「資產」


    作為一個投資者，必須將自己的思維和層次提升。因此，在執行理財計劃或資產配置前，首先要將「資產」的定義界定清楚，深入了解「資產」的概念，才能作出理性而全面的投資決定。


    筆者「資產」的概念大致可分為三種：


    +   1. 廣義資產


    又稱會計資產（Accounting Assets），指會計學上對資產的定義：一個人所擁有的所有經濟物品／資源，並能以貨幣單位衡量的，均稱為資產，如銀行帳戶上的現金存款、樓宇住宅物業、一張桌子或椅子。只要產權能清晰界定，都能稱為一個人／一間企業的資產。


    +   2. 有效資產


    廣義指凡能於一段時間內持續地產生經濟收益的資產，均能稱為有效資產（Effective Assets）。從資產配置的角度，筆者一向要求收益是能具體地「計到數」的，因此筆者將有效資產定義為凡能在一段時間內持續地產生現金流收益的資產，才稱為有效資產。正如《富爸爸，窮爸爸》'
  merge: -1
  img_proc: true
- pgno: 75
  md: '作者羅伯特．清崎對資產的定義是：當持有一項物品，這物品會自動使現金流向你的口袋，就是資產。債券這種「工具資產」便是一例。


    # ### 3. 值得累積的資產


    除於指定時間內產生現金流收益外，其產生的整體收益會隨時間有所增長，且增長速度比通貨膨脹快，這才是我們長遠值得累積的資產。還記得前文提到投資或資產配置的最終目標並不是「金錢」，而是「資產」？投資過程中，資產價格上升，沾出資產所賺取到的「金錢」並非投資的最終目的，因為投資是長途賽，你不會賺了一次錢後就停下來永遠不再


    ![](img/28586c71c5408626f3973d2458a73d64_75_0.png)'
  merge: -1
  img_proc: true
- pgno: 76
  md: '投資，而由於銀紙長遠貶值，資產長遠升值，投資賺錢後必須將沽套現的資金重新投入其他資產，才不會被時間將你的資產購買力吞噬。不論是新投資或再投資操作，投資項目的投資比例也應儘量投入值得累積的資產為主，從而實踐投資是為了「賺資產」而非「賺錢」。投資要認清「目的地」。


    # 自行構建完美的「資產」組合


    以上概念十分重要，投資者很多時候以為自己知道，實際上可能只是知半解。有些人或會認為這些概念不重要，無須過分嚴謹，就由得它含含糊糊就算了，十年過去後，可能會發覺自己明明投資有「技術」，為何身家就是給懂得累積「資產」的普通人比下去，甚至遠遠拋離。


    這單純是 2. 有效資產 和 3. 值得累積的資產 在市場上並不難找到，然而同時具備兩者特質的資產卻不容易找。雖然要找到能定期產生高現金流回報，同時其整體收益
    (Total Return，包括現金流和資本增值) 的資產項目不容易，但我们卻可通過精明的資產配置方式，結合不同資產的特性，自行構建能同時滿足 2 和 3
    的投資組合。


    筆者提出的「REITs + Bond」投資組合就是一個例子。會選擇以 REITs 和槓桿債券去建立自己的投資組合，是基於兩種資產的不同特質性，而兩者的優劣能夠做到有機互補。


    ![](img/28586c71c5408626f3973d2458a73d64_76_0.png)'
