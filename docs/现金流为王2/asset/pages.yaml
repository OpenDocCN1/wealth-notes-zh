- pgno: 63
  md: '# 第一單：建立有效「系統」的考慮


    首先，美國券商平台一般會將優先股和 ETD 歸為一類，統稱特別股。然而，雖然兩者都會穩定派息，但要留意兩者在本質上是不一樣的。優先股是股票，派發的是股息（Dividend），而且條款中訂明公司有權基於營運上的考慮而選擇不向投資者派息，即派息並不保證。此外，優先股在受債權的順位上雖優先於普通股，但次於債券。ETD
    本身是債券的一種，在發行人的資產負債表上亦列為債務，因此投資者所收取的是債券利息（Bond Interest），對於投資美國證券的投資者而言，這點十分重要，原因是息息並不涉及高達
    30% 的股息預提稅(Withholding Tax)，這是為何筆者會優先考慮 ETD 多於優先股。


    ETD 全名為交易所買賣債券，顧名思義是在交易所進行交易的債券。傳統債券的交易方式是櫃面交易（Over-the-counter，OTC），買賣雙方通過證券經紀進行，雙方均可議價，情況與物業買賣類似，交易速度與市場資訊透明度較低。ETD
    是「再證券化」下的債券產物，債券在主要的交易平台如紐交所（NYSE）、納斯達克（Nasdaq）上市，買賣如股票交易一樣，流動性與市場價格的透明度均較高。


    ETD 本身是債券的一種，但大家要留意 ETD 的最終到期日一般比較長，但在到期日前大多會有所不同贖回日，意思是發行人有權在債券到期前，於指定的贖回日後提早回收債券。因此，投資者投資
    ETD 時除了看 Yield to maturity（YTM），同時亦要留意或自行計算債券的 Yield to call（YTC），特別是如果你是以溢價買入債券（ETD
    的收回價一般為發行時的面值，即 par value = 25），更需要留意 YTC，因為這才能真正反映債券於中途被收回時投資者最終所獲得收益率。


    ![](img/28586c71c5408626f3973d2458a73d64_63_0.png)


