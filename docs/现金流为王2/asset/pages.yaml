- pgno: 66
  md: '# 投資為「賺資產」

    而非「賺錢」


    在構建一個良好的理財和資產配置系統之前，大家首先要明白投資不是為了「賺錢」，而是「賺資產」。意思是說，**投資的終點站永遠都是資產，並不是金錢**。原因是資產長期會升值，而金錢長期會貶值，在長期的時間裏，你會選擇累積長期升值的資產，還是長期貶值的現金？精明的投資者會想盡辦法盡量可能縮短持有現金的時間，盡可能將現金盡快轉化為資產，避免現金的購買力被時間噬食。當明白此道理，大家便會明白**金錢只不過是「中轉站」，資產才是「終點站」**。


    # 「金錢」本身沒有意義


    一般人每日營營役役工作的目的是為了賺錢，投資的目的也是為了賺錢，可是這概念是不正確的，大家有這種概念，是因為


