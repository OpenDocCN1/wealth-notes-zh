    # **資產「升值」的**

    **意義何在？


    不論是個人理財、投資、資產配置，抑或營運一間公司，現金流都是最重要的元素。對一個企業而言，不論該公司每年有多豐厚的盈利，年賺純利以十億計，帳面擁有過百億元資產，只要沒有持續穩健的現金流入，就代表沒有良好的資產流動性。當市場系統性風險（Systematic
    risk）來臨時，儘管實力強橫的大企業也有可能周轉不來，當資金鏈斷裂，企業便面對破產倒閉的風險。


    # 盈利非一切  現金流如血液


    這現象在金融海嘯時頻頻發生，世上沒有大得不會倒的大企業，只有穩健的現金流才能令一家企業永遠立於不敗之地。舉個例，假設一家企業年賺純利過億，但由於帳期愈長價格愈'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/28586c71c5408626f3973d2458a73d64_129_0.png)


    好，公司的收入95%以上都是應收帳款，帳期都在六至九個月以上，以極大化利潤為目標。


    為了壓縮採購成本，上游供應商基本上沒有給予長的帳期，公司唯有透過銀行借貸去填補資金缺口。由於資金成本不高，透過借貸等同運用槓桿，公司的ROE（Return
    on equity）非常高，股東們都非常滿意，因為他們只用了極少的資本（Equity）就能賺到這樣豐厚的回報。


    好景不常，有一天供應商由於水緊，通知縮短帳期，與此同時銀行又突然收水，減少融資金額。即使公司盈利沒有問題，帳面上仍然賺大錢，但由於現金流不足，以上的市場變化導致公司的資金鏈即時斷裂，面臨倒閉危機。'
