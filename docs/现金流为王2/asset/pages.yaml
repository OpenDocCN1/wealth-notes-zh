  md: '# 4.7 「動態」與「靜態」的投資思維


    上文講到使用槓桿的前題和條件：在運用槓桿前，先要確定三件事：1、利差要有一定的空間；2、利差要有穩定性和可持續性；3、資產價格具良好穩定性。如果三點都能同時滿足，則任何時候都應該利用槓桿增加回報率。本篇將進一步探討運用槓桿應持有的心態和目標。


    槓桿是一種「套息差」的操作，是一種將回報和風險同時放大的工具，是基礎投資以外的另一門技術，因此槓桿投資比一般的純投資操作，技術要求更高，除此以外，心態亦相當重要。


    # 投資最理想狀態是「靜」


    投資是長途賽，應以長遠穩健的投資回報為目標，以資產的現金流去作為再投資的新資本，賴以複式的力量去累積資產。'
  merge: -1
  img_proc: true
- pgno: 123
  md: '因此，在管理投資組合時以極大化槓桿後資本回報率（ROC）是不切實際的，因為用槓桿極大化的ROC只能是短暫，長遠其他外部因素（如低息環境持續的時間、其他宏觀經濟因素等）的轉變都會為帶有槓桿的投資組合帶來不確定性，這就是風險。舉例說，投資者預期短期內市場不會大幅加息，經濟發生大問題的機會率不高，但長遠而言，God
    knows ？The world is ever-changing。一個投資組合長遠利用槓桿極大化ROC，名義上的預期回報（Nominal Expected
    Return）雖高，惟實際上是以風險來換取高回報。須知道凡用槓桿都會帶來不確定性，該不確定性在組合內長遠隨時間應該是不斷下降而不是增加，這是一種「動態」（Dynamic）的概念。


