- pgno: 173
  md: '外擔保登記的情況下，這種所謂「擔保」實際上只等同「口頭承諾」，講個情字。這些境外融資平台實為新成立的特殊目的公司（SPV），本身並沒有還款能力，倘若發債主體違約，提供「偽擔保」的內地母企儘管有能力償還貸款，但到時又是否能獲得外管批准，順利將資金從內地匯出至境外還債？這是一個問號。因此，大家投資債券時不得不留意發債之結構，以及資金用途是否用於再融資，更重要的是其還款來源。


    以上這類結構的債券，真正的還款來源實質上只依靠發新債再融資。大家不難發現近年不少內企在境外新發行的債券之發債用途為「再融資」（Re-financing），说白了就是「以新債還舊債」，性質等同續用貸款（Loan
    rollover）。若市場繼續有債券違約事件發生，令債券市場情況轉差，加上市場加息因素，企業若未能發行又或者需要以更高的成本去發行新債再融資，資金鏈一旦斷裂所引發的連鎖市場反應，將使債價進一步受壓，繼而觸發債券市場去槓桿，加速債市崩盤的骨牌效應。以上的市場傳遞反應將會非常迅速，一旦來臨的時候才意識到，要走幾乎是不可能的事，因為債券二手市場已即時失去流動性。


    除這類「偽擔保」債券以外，近年市場多了很多「偽國企」跑出來境外發債，更令筆者震驚的是不少香港大型私人銀行更會為這類「偽國企」提供高成數的融資率。所謂「偽國企債券」，是指一些擁有中國地方政府背後的企業所發行的債券。由於地方政府要爭取政績，必須要「修橋補路」，而這都牽涉到龐大的政府財政開支，但地方政府發債有規模限制，有見及此，地方政府唯有成立城市投資建設公司（簡稱「城投公司」），再將土地及政府的資產或一些特殊權益注入這些城投公司作擔保，然後利用城投公司進行發債（城投債），從而取得資金。'
