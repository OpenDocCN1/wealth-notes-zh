- pgno: 46
  md: '這好比當投資組合經過一段時間的操作後，除了利用再投資的複利效應去維持一定的車速外，更重要的是利用再投資去做好穩健的資產配置，不用槓桿地運用新動力（新增的現金流）再投資長遠值得累積的資產，專注自己的投資方向，並在面對不同的路面情況（市況）時，去控制和調節車速。


    大部分的投資者「駕駛」投資組合時，只注重速度（預期投資回報），而忽略了風險因素，如方向錯誤或遇上突發事件如黑天鵝等。事實上，投資的關鍵是要方向正確，盡量避免走錯路，不然只會想快得慢，更浪費了燃油。投資如駕駛，在有了一定的速度後，穩健和方向比起純粹的速度更重要。


