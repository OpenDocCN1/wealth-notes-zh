  md: '# 1.1 你想得到何種「收入」？


    ![](img/28586c71c5408626f3973d2458a73d64_26_0.png)


    股神巴菲特（Warrant Buffett）曾經說過：「如果你沒有找到一個當你睡覺時還能賺錢的方法，你將一直工作到死。」


    內地有一名詞叫「睡後收入」，意思是指睡一覺醒來就有的收入，概念與被動收入一樣。其實內地和香港的打工仔普遍都一樣，窮一生精力，以努力換取收入，以時間換取金錢，大部分人都不能做到「時間」和「金錢」兩者兼得。要做到兩者兼得，收入長遠必須透過構建一個「系統」而產生，而非單純以勞力和時間來換取。「系統」可以是一個商業模式（Business
    model），或者是一個投資組合（Investment portfolio）。以下看看不同人擁有的不同收入種類：


    +   1. 擁有「系統」的資本家：睡後收入（睡眠後就有的收入）

    2. 一般打工仔：稅後收入（賺到錢還要繳足稅後才屬於自己的淨收入）'
  merge: -1
  img_proc: true
- pgno: 27
  md: '+   3. 持有債券、房託和股票的投資者：免稅收入（免繳稅的投資收入）

    4. 親身參與營運的老闆：免睡收入（24小時工作來換取的收入）

    5. 打兩份工的打工仔：睡眠收入（以睡眠時間來換取的額外收入）


    你又屬於哪一種？


    # 你清楚遊戲規則嗎？


    人生需要規劃，而且需要很有系統地去規劃，原因很簡單，世界上所有的事情都有門檻，包括投資，以至生活、結婚、生小孩、買車買樓、換樓等等。正如打機一樣，撇除「父幹」因素，每一個人一開始都是Level
    1，然後需要不斷努力「升呢」，在每一關卡完成某項特定任務後才能過下一關。


    遊戲的創造者很清楚地預先設定了不同關卡和一系列的特定任務。而事實上，我們的人生也一樣，只是沒有人幫我們去預先設定關卡。某些父母、師長們嘗試為我們設定過關要求，如「讀好書、升班、考學校、考公開試、上名牌大學、揼份好工／做專業人士」，完成以上要求就可以如願地高人一等、買車買樓，做人上人。甚至公司老闆都一樣告訴我們：「做份好工，努力加班，你便會升職加薪，然後便可以買車買樓，做人上人……」


    ![](img/28586c71c5408626f3973d2458a73d64_27_0.png)


    29'
  merge: -1
  img_proc: true
- pgno: 28
  md: '然而，社會真的這樣運作？由我們踏入社會的一刻，才知道原來事實並非如此，此刻驚覺被欺騙了二三十年。是師長和老闆們存心欺騙？還是他們真的這樣認為？我不知道，我只知道他們所灌輸的傳統思維，在今時今日已經不適用，大家所信奉的「過關要求」與現實社會的要求愈來愈不符合。如只按上述方法，在今天的市場，莫說是買車買樓，連買一間新樓劏房也遙遙無期。對某些人來說，排隊申請公屋可能比買樓上車更快、更實際。這是為何有些大學生尚未畢業就先申請公屋，比起求職申請的準備來得更早。當大學生都要與低收入家庭爭上公屋時，我們需要想想這個社會，以至整個經濟結構正在發生甚麼轉變。


    # 人生不應只為「被補償」


    在作出財政規劃之前，我們需要清楚明白何謂「收入」。大家最為熟悉的收入概念是各位打工仔上班每月所收到的「工資」。然而，這份「工資」正確來說應該稱為「補償」(Compensation)。打工出賣最寶貴的人生、時間和心力予公司，當中包括被上司無理訓話、受氣、承受工作壓力等等，每月的工資就是對你作出的應得補償。


    但是人生不應只為了「被補償」而生活，打工的意義不應單純為了每月工資，而應該是為了脫離窮忙生活而努力儲備足夠的彈藥。當然，工作中賺取的人生閱歷也非常寶貴，羽翼豐滿的一天就是脫離現在崗位，去做自己真正想做的事情的時候，至少也應該以此作為目標，人生才能活得多姿多彩。事業、家庭、成就、理想在人生中應該取得平衡。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '因此，對於人生，我們需要很有系統地去規劃，而首要的是預先設定人生不同階段的目標，這樣才知道現時自己正在朝著的那個方向，是否能夠如願地達到預設的目標。


    作者在《現金流為王》中提到，人生可分為三個十年：第一個十年是 22-32 歲（即畢業前就應該著手規劃）；第二個十年是 32-42 歲（在第一個十年累積得愈多，才是真正的「贏在起跑線」）；第三個十年是
    42-52 歲，應該開始計劃並準備退休或退而不休的生活，原因很簡單，這階段已經過了精力最旺盛的時期，不應再依靠勞力賺取金錢，被動收入應該為最主要的收入來源。


    ![](img/28586c71c5408626f3973d2458a73d64_29_0.png)


    # 第一章：如何構建收入系統'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 收入必須依賴「系統」


    主動收入是靠勞力和時間賺取，而勞力和時間都是有限的資源，以有限的資源去換取的收入也自然是有限的。而且，隨著年紀漸長，以上兩種資源便愈來愈缺乏。因此，結論是：收入並不應該單靠勞力和時間去換取，長遠應該透過構建一個「系統」，為我們產生源源不絕的收入。如果不希望收入是一種補償，收入就必須是依靠一個「系統」產生出來。


    一個「系統」是由多條收入「管道」建立出來。要構建一個「系統」，我們首先要建立不同的「管道」，使經由「管道」流入的被動收入多元化。如本書開首所說，「系統」可以是一個商業模式，或者是一個投資組合，更可以是兩者的結合。


    筆者的收入「系統」分為兩個「子系統」，一個是由不同金融資產組成的投資組合，一個則是由生息系統所組成：前者屬於「防守系統」，後者屬於「進攻系統」。


    ![](img/28586c71c5408626f3973d2458a73d64_30_0.png)'
  merge: -1
  img_proc: true
- pgno: 31
  md: '「防守系統」中的金融資產如房託基金（REITs）和債券（Bond），每月穩定地產生現金流回報，以支持家庭的日常生活開支。這個系統不求爆炸性回報，只求穩健現金流，以「時間來累積資產」為宗旨，使「進攻」的一方沒有後顧之憂，同時為「進攻系統」提供流動性支援和補充。


    「進攻系統」的收入是由生意和公司業務所產生。生意和公司業務同樣講求現金流，但角度和概念並不一樣。「防守系統」中的金融資產組合，要求能夠定期產生穩定現金流，並以產出的現金流進行再投資，概念是「以時間累積財富」。而「進攻系統」中的生意／項目投資，則是以現金流作為起點，主動提升資產價值，是「創造價值」的概念。雖然不論是「防守系統」或是「進攻系統」，兩者均十分注重現金流，但當中現金流的角色和概念截然不同。


    前者是純投資，是收割別人創造的價值，以現金流方式體現回報，再以反覆再投資的操作去累積資產和財富；後者則是投資加經營，是主動創造價值，以現金流為起點，通過強化資產（Asset
    enhancement），增加資產所能產生的現金流回報（Yield enhancement），從而提升資產項目的估值，其過程稱為「估值資本化」（Capitalization），再體現於資產價格的上升，最後可以沽售資產獲利，或通過再融資（Re-financing）的方式套現，然後進行再投資，是為「產融結合」累積資產的方式。本書的後半部將會作詳細解釋。


    ![](img/28586c71c5408626f3973d2458a73d64_31_0.png)


