    # 1.3 利用管道建立系統


    成功建立了一條管道後，你就會擁有一項被動收入，但這是不足夠的，因為若管道淤塞了，收入就會停止繼續流入。一項收入，不管是主動還是被動，比例過分集中便是風險，財務上稱為集中風險（Concentration
    risk）。因此，人有需要建立多條管道，使被動收入多元化。


    然而，建立一條管道所耗費的精力、時間和資本太高了，要獨立地建造多條管道所犧牲的成本實在巨大。因此，我們必須好好利用第一條管道去建立第二條管道，再利用已建的管道去建造更多的管道，前題是管道與管道之間必須全部接通，意味著管道之間的結構是互相關連，互相補充。一個結構上互相關連、互相補充的多元管道，是為一個「系統」。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 以管道建立管道


    由於建造一條獨立管道的成本浩大，若我們能夠利用第一條管道的基礎，包括已建管道分佈的地理位置，和已創造的流水（被動收入）去建立另一條管道，所開拓的新管道就能去到更遠，且能到達其他人更難去得到的新領域，建造時間和成本亦能大大減低。做事實懂得善用手中已有的資源，而所得的成果必須能夠累積。這將大大節省一個人努力所需付出的時間，達到事半功倍的效果。


    此外，能利用已建管道的這流水，亦有助降低建造新管道的資本開支（Capex）。利用投資收入再投資，這就是再投資操作（Re-investment），當中的複息效應應大大加快「系統」建立的速度。當你的管道愈來愈多，「系統」就會逐漸形成，你更可利用新增的流水收入，直接收購別人的獨立管道，然後與自己的管道「系統」接上，用最短的時間將規模擴充。由於它在別人手中只是一條獨立管道，但落入你手中卻是「系統」一部分，能收到
    $1+1=3$ 之效，這就是協同效應（Synergy Effect）。


    # 「系統」的堡壘效應


    在系統結構上，多元管道之間的互相關連和互相補充，充分發揮了互助互補的功能，即使其中一條管道淤塞了，其他管道亦能提供即時的補充。正如集團內一家子公司出現了財政周轉問題，其他子公司能提供即


    ![](img/28586c71c5408626f3973d2458a73d64_37_0.png)'
  merge: -1
  img_proc: true
- pgno: 38
  md: '時的流動性，大大降低了整個集團資金鏈斷裂的風險。另一方面，若其中一條管道有良好的拓展機會，其他管道亦能提供及時和靈活的資金支持。


    簡單而言，一個「系統」比多條獨立的管道更優勝，其優勝的地方在於前者擁有更大的「流動性緩衝」（Liquidity buffer），使管道能經得起市場波動所帶來的考驗。與此同時，波動亦代表著機會。由於「系統」擁有多元的流動性互補機制，使其更有條件在波動的市場中抓緊突如其來而且難得的投資機會。


