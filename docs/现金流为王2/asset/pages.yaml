  md: '債券加槓桿的好處是能即時產生高現金流回報，債券每天計息，時間便是金錢，惟其最大的缺點是回報並沒有任何增長，長遠欠缺對抗通脹的能力，因此債券並不是最終的目標，也並非投資者值得長遠去累積的資產項目。


