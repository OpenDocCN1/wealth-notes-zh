    # 7.5 加息的根本與邏輯


    在後景寬年代，面對著龐大的資產負債表和巨額的銀行儲備，傳統利用公開市場操作去調控美國聯邦基金利率（FFR）已經失效。情況猶如下完一場大雨後，水塘滿瀉，你要用一個水桶將水塘內的水抽出來，結果很明顯——無論你怎樣用力去抽，水塘內的水也好像沒有減少。這很正常，水桶如果是用來抽一個浴缸內的水，抽它一到兩桶，效果已很明顯，但對於一個水塘來說，一桶桶的抽，根本是個不可能完成的任務，而大家都清楚，如強行將堤壩毀掉，只會造成另一種災難。'
