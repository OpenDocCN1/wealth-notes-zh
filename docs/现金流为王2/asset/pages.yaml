  md: '資產高。儘管今天可能並非大幅使用槓桿的最佳時機，但這不代表資產的槓桿選擇權沒有價值。如果使用槓桿的時機未到，你可以保留使用的權利，待日後時機來臨時，這個選擇權能給你即時的流動性，讓你迅速把握一瞬即逝的市場機會。財務槓桿，不只是讓投資者放大總投資額，更重要的是它給你一個選擇權，在任何時候去購買流動性。因此，財務槓桿所涉及的利息成本就是流動性的價格，只要流動性為你得來的得益高於你需要付的流動性價格，你便有誘因使用槓桿套取差價，而這個差價就是槓桿的價值。


