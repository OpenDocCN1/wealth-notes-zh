  img_proc: true
- pgno: 100
  md: '是重點，也就是我們投資的「重點」。這個槓桿後回報的回報率，我們稱之為資本回報率，從而反映投資者使用了多少自有資金去獲得最終的實際回報。從企業家的角度，公司就是支點上的棍子，公司每月所支付予員工的薪金就是力點，而員工為公司所創造的價值就是重點。


    事實上，不論是投資者、企業或是普通上班一族，任何人其實每天都在接觸槓桿，分別只在於你是使用槓桿，還是「被使用」槓桿的那位。投資者在本金有限的情況下，為了增加回報，會借取別人的資金去投資，在資金回報率比資金成本高的前題下，資本回報便能極大化，這就是利用了OPM（Other
    people''s money）進行槓桿。


    企業家任你再能幹都只有一對手，沒有三頭六臂，而一天只有24小時。企業家要提高公司的效率，會聘請不同的專業人士和員工每週五天、每天朝九晚六為公司賣命，這就是利用了OPT（Other
    people''s time）進行槓桿。


    槓桿是相對的，在槓桿的棍子上，只有力點和重點，你不是主動舉起槓桿的那位，便是被槓桿舉起的另一位。作為投資者或手持資金的人，你不去投資，便只能將錢存入銀行或基金，讓別人利用OPM槓桿：作為上班一族，你不利用別人的時間為自己工作（老闆），就得將自己的時間出賣給公司，去換取每月薪金（打工仔），讓別人利用OPT槓桿。你會選擇主動舉起槓桿，還是被槓桿舉起？人各有志，每人有不同的考慮，但這是你的選擇。在計及風險因素後，何時、怎樣、如何使用槓桿便是一門藝術。'
