    # 在「非主流」市場尋寶


    一般人沒有「現金流資本化」和「產融結合」的概念，即使資產的潛在回報高，他們都不敢冒險買入一些表面上缺乏流動性或沒有市場參考價格的重資產，主要是擔心即使價值能夠提升，若未能成功將資產在市場出售，也是沒有意義，資金也會因此被單一重資產鎖死。然而，投資者若懂得以上兩種概念，便能夠在「非主流」的市場上尋寶，發掘真正有潛力的「另類投資」（Alternative
