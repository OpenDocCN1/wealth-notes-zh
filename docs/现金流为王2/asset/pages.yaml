  img_proc: true
- pgno: 169
  md: '# 第七章：宏觀拆局與投資部署


    業等保留在美國本土，遠就催生了美國對中國等發展中國家物美价廉產品的旺盛需求，造成今天的龐大貿易逆差。這正是經濟學中，傳統國際貿易理論所提出的「比較優勢原則」（The
    Principle of Comparative Advantage）。


    根據「比較優勢原則」，一個國家是否生產蘋果，並不是看該國是否有絕對優勢（Absolute advantage），而是看該國生產蘋果是否存在比較優勢（Comparative
    advantage）。要看它是否有比較優勢，就必須要看其生產蘋果的機會成本，而非金錢成本。美國的比較優勢在於高科技、高技術含量的生產，這也代表美國從事低端製造工序的機會成本較發展中國家高。撇除政治及戰略層面的考慮，單純從經濟利益角度看，美中之间存在貿易逆差是再合理不過的。各國各司其職，各取所需，這正是全球供應鏈（Global
    supply chain）的運作。


    任何貿易戰的發生，原因只會是基於政治及國家戰略層面的考慮。就國家之間的經濟利益而言，雙方都會是輸家，長遠影響全球供應鏈的正常運作，拖累環球經濟。從投資者的角度，不論中美貿易戰哪一方較有優勢，事情發展到最後都不會有「贏家」，埋單的都只會是兩國的經濟和國民。


    作為投資者，筆者一直以來比較擔心的其實是中國本身的內在經濟問題。事實上，貿易戰只是造成了中國內憂外患的局面，加速了內部經濟問題、債務問題、資產泡沫和貨幣泡沫問題的浮現，縮短了中央針對性解決以上問題的時間。


    ![](img/28586c71c5408626f3973d2458a73d64_169_0.png)


