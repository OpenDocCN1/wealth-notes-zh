- pgno: 8
  md: '運作多年的生意作為平台，把自己的頭頭資產注入以得到較高成數的按揭融資機會，聰明非常。完成一個成功例子後，再引來其他類似生意及其他物業投資者的合作機會，做到多贏。這是一個令我查看初稿時「眼定定」的篇章，大家不妨再三細讀該篇，了解其背後理念，高到不得了。


    一路看，著作的前半還好，說說買贛、買 REITs、買工廈，正如之前那位飯局讀者所說，至少都還能做到。然而，到第四章開始，所提到的是愈來愈「離地」的操作。例如，買生意、租上租、買地皮、資本化與證券化等，上億元的利潤，太誇張了吧。有多少人會想到港美兌換匯率保證（7.75~7.85）可以有機會以
    33.3 倍槓桿來賺錢？人民幣在岸及離岸價又可以拿來賺大錢？不要說做出來，單是想一想也覺「離地」。


    我很慶幸自己認識一位如此「離地」的朋友，好讓我不用到過「井底」。而我更慶幸的是這樣「離地」的人竟會花時間把思路寫出來分享，好讓大家開開眼界。這本書一定會在我的書櫃裏，實在太珍貴了。最後，恭喜
    Starman 兄再次出書，祝這書大賣（雖然我知道這書必大賣，no doubt!）。


