    # 推薦序


    止凡 著名財經 Blogger、《財富未來》作者


    近期正在看《商戰道》一書，這是小弟於 2018 年書展買回來的書：這本書本來早已絕版，但 2018 年發生了一件事之後，這本書復活了。主因是 Starman
    兄於 Facebook 出了一個 post，指多年前看過這本書有很大啟發，及後，圖書館立時出現數以百計的預約申請，預約讀者大概要等數年才有機會借閱。該著作的出版社見狀立即推出再版，並邀請
    Starman 替其寫序。由此可見 Starman 兄的叫座力有多誇張。


    平日會有讀者約小弟食飯，閒談時會說說其他作者，我發現大多數讀者都會提起 Starman，可見他的確相當多 fans。曾有一位讀者於飯局中提過自己特別喜歡看我們這類
    blogger 的文章，因為內容夠貼地，能夠寫出中產階級的心境。他的經驗是於內地談生意的，一開口就是賺個億，賺過億再說吧。


    我立即問：「Starman 不離地嗎？」


    讀者：「離地呀，不過至少都還做到，如買債券與 REITs……」


    未知這位讀者看完這本著作之後會否改觀呢？


    我認識 Starman 兄已有一段時間，知道他是大忙人，極之佩服他如此忙碌都有心機再多寫一本新書出來。普通人，莫講話寫，睇本書都未必得。加上他於財務知識上已達如此級數，費盡心力去寫一本書出來把財富帶給讀者，這近乎無私分享，實在功得無量。'
  merge: -1
  img_proc: true
- pgno: 7
  md: 'Starman於書中提及過他不想寫工具書，但上一本仍有不少讀者誤以為那是一本工具書，把「招式」都照抄一遍。而這本書更加強一點思路哲學，把他的投資理念解釋得更透徹。我十分喜歡這類書籍，我特別喜歡看別人的思路，自己寫作時也儘可能少談操作，多談理念。


    認識Starman兄以來，一直有追看他的文章，亦久久不敵局面面，對他的動作理念都略有概念。然而，翻閱一下這本書的初稿，仍有不少驚喜，Starman於我心目中，又跳進了另一個層次，又拋離我們更加之遠。


    說回這著作的內容，有幾個點我特別印象深刻。首先不少人都十分關心的加息問題，全球金融環境轉變，Starman一直運用債券收息，對利率極之相關，如何應對呢？他於書中帶出一個非常重要的理念：世上沒有一套投資方法是永恆的，需要因時制宜，作出改變，所以他應對加息也作出了一些變動。


    在《投資是為「賺資產」而非「賺錢」》的篇章中提到一個有趣例子：買入一支股票，定期拿股息再投資，我們總以為股價一直上升，得到的回報一定較高。Starman做了一些簡單的列表，拿20年來看看，原來股價一直下跌著，一直拿股息再投資，會賺得比較多，這結果令我有點意料之外，亦能帶出篇章想說的思想。


    有篇章談到一個零成本的融資平台，這是Starman看中的一個機會，別人做得意興闌珊的生意，找出其致命傷後，與其合作解決問題，再以這'
