  md: '聯儲局在08年後的後量寬年代發明IOER，吸引銀行將資金存入聯儲局，目的是避免印出來的海量資金同一時間湧入經濟實體，造成嚴重的惡性通貨膨脹，這是為何印了4.5萬億美元，多年來美國經濟也未見有多大的起色，通匯率目前也只有約2%左右。這正如開餐廳，客都未有，就怕太多客招待不來，思想是否太「敏捷」了？


