  md: '距地鐵站僅一至兩分鐘步程，地理位置相當優越，是不可多得具高可塑性的工廈地廠。


    得悉美心遷走的消息，連忙命座產同事不要對外宣揚，同時讓同事立即聯繫業主。剛好原來業主也在荔枝角辦公室，筆者急不及待直接上其辦公室與業主即時見面。由於同事認識該位業主，事前也先向筆者簡介了一下業主背景，原來他本身是一名會計師，會計師特性是數口精，但計的一般都是死數，也聞說業主知道美心要遷走，曾嘗試調低租金挽留但不果，由此可知業主的心思，並嘗試根據其人物性格代入其角色——業主必在想物業若空置一個月就是廿幾萬，每一天都是錢，相當肉痛。


