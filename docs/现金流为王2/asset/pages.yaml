  md: '# 6.4 提升估值產融結合


    有了現金流資本化的概念，便會明白投資除了簡單地買入資產賺取現金流，更可主動提升資產產生現金流的能力，從而達到提升資產價值和價格的目的。從此，我們便無懼投資一些「非大路」或缺乏市場參考價格的項目，因為我們知道資產的價值能夠從資產的現金流計算出來。


    好了，我們知道資產的估值能夠透過強化現金流的手段提升，但如果資產在市場上鮮有交易，缺乏流動性，在沒有市場參考價格下，即使估值提升，也可能「有價無市」，最終未能出售項目來賺取利潤。


    # 借再融資套現


    首先，正如前文解釋過，投資的目的並不是為了賺取金錢利'
  merge: -1
  img_proc: true
- pgno: 160
  md: '潤，而是為了賺得資產。我們需要解決的問題是如何將提升了的資產價值釋放，並轉化為現金流，成為「再投資」(Re-investment)的新資本。最簡單的方法，當然是直接將資產在市場出售，但在缺乏流動性的市場下，有價無市，最終可能令資產需要折讓出售，浪費了提升了的資產價值。在這情況下，不出售資產同時又能夠套現，只有一個方法，就是「再融資」(Re-financing)。


    2015年中，筆者在新界上水購入了一幅九萬呎的倉地，計劃興建一個現代化有蓋的物流貨倉。在工程接近完工時，整個貨倉已經全部租出，平均呎價約12.5元 / 呎。


