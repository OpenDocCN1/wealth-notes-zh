- pgno: 146
  md: '# 投資講資產配置 企業講整合發展


    投資講求資產配置，特別是當投資組合去到一定規模時，必須要有合理的資產配置，長遠而言才能立於不敗之地。何謂有效、合理的資產配置？即投資組合內，資產與資產之間的關連性低或是呈負關係，從而達到風險分散（Diversification）或自然對沖（Natural
    hedging）的效果。這是為何筆者公司業務以房地產投資、開發、代理、管理公司、建築工程、測量師行的垂直產業鏈模式為主軸，再橫向分散至凍品貿易、外國護理產品貿易、大馬建材貿易、大宗商品貿易，以至近一年做得比較成功的貿易業務。


    生意的發展除了傳統的垂直整合（Vertical integration）擴張（即本業的上、下游整合發展），還有橫向整合（Horizontal integration）。傳統的橫向整合一是指收購同業，從而收到協同效應和經濟規模的效果。然而，在現時成熟的市場上，傳統的外部整合（External
    growth）模式基本上只屬於巨企的世界，要在今時今日的新經濟世代尋求機會，已不一定要跟從傳統的垂直或橫向發展。相反，筆者認為業務的發展根本無須要強求業務與業務之間的必然關連性去收協同效應之效。意思是說，不同業務性質、類型的生意整合一起，一樣能夠收到協同效應的效果，這就是平台商業模式（Platform
    business）。


    # 成功的平台商業模式


    一個成功的平台，是能夠做到完美的資源整合，前提是平台規模要夠大。如投資一樣，要平台規模做大必須要使用「槓桿」：1、OPT'
  merge: -1
  img_proc: true
- pgno: 147
  md: '(Other people''s time)，利用別人的時間；2、OPM（Other people''s money），利用別人的資金，而當中尤以 OPT
    最為重要。一個人任你怎樣能幹，也只有一對手，在人生有限的時間內，可以做到的其實非常有限，因此必須要懂得「槓桿」別人的時間，其次才是資金。


    筆者從來不吝嗇分享自己的投資和經營生意的模式，原因是筆者認為只有「做大個餅」才是真正能夠長遠持續的經營模式，而市場上大部分傳統企業只是在同一塊餅上互相瓜分，俗稱「分餅仔」，當新的市場出現時，它們的優勢便會慢慢沒落。


    要經營好一個平台，講求的是資源整合，首要是必須懂得去找對的合作伙伴，而找到好的合作伙伴的關鍵，在於你是否擁有長遠的視野，懂得慷慨地與伙伴分享利潤。只有你賺，別人沒賺或賺得少，你認為這種合作關係能夠長遠嗎？只有良好的利潤分享機制才是吸引人才、資源和機會的關鍵，然後平台才有機會做資源整合，才能做大。


    # 零成本收購平台 產融結合


    筆者目前經營得最好的貿易業務都是一種平台業務，而筆者的第一間貿易公司是在零成本下收購回來的。當年，跟幫忙核數的核數師閒談，知道他有一個客戶，公司有有一定的營業額，但盈利虧損，仔細了解下，主原因是供應商在有得選擇之下，傾向供货予即時付款的批發商，價格亦較優惠；對於要求有帳期的批發商，傾向只發較少的貨，且貨價亦較貴。由於該貿易公司的老闆缺乏資金，公司只能入較少的貨，同時要求供應商給予帳期，價格成本亦較高，毛利進一步收窄，慢慢地生意愈來愈難做，正打算結業，要求會計師為其註銷公司。


    ![](img/28586c71c5408626f3973d2458a73d64_147_0.png)'
  merge: -1
  img_proc: true
- pgno: 148
  md: '![](img/28586c71c5408626f3973d2458a73d64_148_0.png)


    靈機一觸，這間貿易公司正合我意，可以合作，並要求約見該公司老闆，表示我可出資繼續營運他的貿易生意，他一分錢都不用出，利潤五五分成。他即時一口答應。事實上，除了貿易本身的利潤以外，我看中的是公司的三年track
    record和營業額，可有助我進行產融結合。當時我投資了不少工廠，一般的按揭最多只可做五成，然而只要有營運公司（Operating Company），在有抵押品的情況下，公司最多可融資八至九成商業貸款。


    在具備足夠資金下，貿易公司不用要求供應商給予帳期，貨價成本較低，令貿易存在利潤空間，同時貿易額可做大數倍，在利潤五五分成的機制下，原先該公司的老闆比以前賺的更多，而我則只是將額外融資出來的資金去做這盤貿易生意，空手入白刃。不足一年的時間，貿易生意'
  merge: -1
