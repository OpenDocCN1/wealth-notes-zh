  md: '不過不同的是，我始終認為，資本市場雖然是由1%的人制定規則及壟斷財富，但99%的人不必灰心，更不用去佔領街頭，只要學會正確理財方式，每個人都有達到財務自由的機會。而本書《現金流為王2》，就是一個值得大力推薦、可以幫助大家翻身的最佳利器。


