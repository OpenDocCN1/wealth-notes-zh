  md: '# # 美國券商買ETD較佳


    大部份優先股和ETD都在美國上市，要投資這些美國上市的證券，一般可以通過美國券商，如盈透(Interactive Brokers)、嘉信證券(Charles
    Schwab)、第一證券(Firstrade)、TD Ameritrade和E-trade等，而香港本地除了私人銀行外，做得比較好又親民的就只有中銀國際(BOCI)，但交易佣金就比一眾美國券商要高，一般為0.25至0.5%，而且融資率亦較低。因此，想投資美國證券，需要先掌握以上券商平台的操作。


    ![](img/28586c71c5408626f3973d2458a73d64_62_0.png)'
