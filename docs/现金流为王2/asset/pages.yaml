  md: '![](img/28586c71c5408626f3973d2458a73d64_138_0.png)


    # 資產證券化的

    終極操作


    明白「現金流資本化」的概念後，下一步需要知道如何去釐定不同資產的 Cap rate。不同資產有不同的特性，有些較具流動性，有較好的再融資能力；有些銀碼較大，市場交易較少，但長遠較具升值潛力。因此市場對不同特性的資產有不同的要求回報率，亦即
    Cap rate。資本化概念亦可應用於分析房地產相關的股票，如一些房地產投資／開發商和 REITs。


    有了「現金流資本化」的概念，便能得出「先現金流，後價值，再價格」邏輯的結論，同時亦能對缺乏流動性的資產（特別是一些非主流資產例如商铺、工廠、倉地等）進行較準確而「有數得計」的估值，而現金流就是一個重要的「標」，Cap
    rate 則是一個對資產進行資本化估值的工具。明白上述後，大家在投資時便不再被資產本身的流動性問題所限，因為只要有現金流，我們便能將現金流資本化，從而得出資產的估值。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '任何資產都有流動性溢價，特別在投資選擇不多、政府限制多多（如買樓按揭限制、DSD、SSD等）、資產流動性差的市場下，資產的流動性溢價便更見明顯。這解釋了為何住宅市場上的細價樓映價反而比大價樓貴；新樓比二手樓貴，除了較新外，主要其實是因為買新樓有發展商貨款；工業折售比原則大碼工業貴上三成，其租金也一樣。以上種種都反映了流動性（當中亦包含了資產的再融資能力）有價，市場需求會考慮資產的流動性溢價而自動調節。


    ![](img/28586c71c5408626f3973d2458a73d64_139_0.png)


    # 有現金流 就能證券化


    承接上文的重點「強化資產－強化現金流－提升資本化估值－產融結合」，本篇會將「資本化＋產融結合」概念進一步強化，將這概念推向極至便是「證券化」（Securitization）。


    簡單而言，由於資產的流動性是有價值的，因此要做強化資產，除了實體上將資產的條件優化外，也能從資產的流動性上著手。產融結合利用銀行將資產再融資，將資產的資本增值部分具現化為現金流，從而提升投資資產的流動性。產融結合其實只是初級版，而證券化就是進階版，'
  merge: -1
  img_proc: true
- pgno: 140
  md: '其將資產的流動性完全釋放，讓本身缺乏流動性的資產的潛在價值完全體現。


    資產證券化是以特定資產組合或現金流為支持，發行可交易證券的融資方式，是通過提升資產流動性體現資產最大價值的最有效方式。簡單而言，只要能在一段時間內持續產生穩定現金流的資產，我們就能把它證券化。看通這一點，我們便知道資產的最大upside
    potential。


    證券化最早源於美國，目前不少國家如新加坡、澳洲已經發展得相當成熟，而香港則顯得非常落後。較為人所熟悉的傳統證券化產品如商業抵押擔保證券（CMBS）、住宅抵押擔保證券（RMBS）和資產擔保證券（ABS）、按揭擔保證券（MBS）等等。以往傳統證券化產品的特徵是以債務進行證券化，而事實上最大的市場其實是將實體資產證券化，大家最為熟悉的產品就是REITs。REITs是一種能幫助資產持有人釋放其資產價值，以及為REITs投資者提供高流動性房地產投資方式的金融產品，為對房地產投資有興趣的投資者，提供更多的投資選擇。


    # 可換「資產」債券的實驗


    筆者早年已醉心研究資產證券化，除了個人投資組合有不少證券化產物（如REITs）外，也一直研究如何進行將具有良好現金流、高內在價值（資本化價值）但缺乏流動性的資產進行證券化，如筆者的倉地項目（詳見第6.4章）、馬來西亞吉隆坡與發展商合作的酒店公寓項目等。要證券化資產，必先要有一個上市平台。'
