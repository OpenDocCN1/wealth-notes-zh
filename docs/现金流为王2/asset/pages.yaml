    # 聯匯制度下的無奈


    當世界資金流向都湧向美元，美元變得十分強，在聯繫匯率的機制下，港元亦只能無奈地變強，港元匯率的強弱，事實上一直都並非出於本身的經濟情況。面對這個局面，作為香港的小市民其實相當無奈。2008年金融海嘯後，美國數次量化寬鬆（Quantitative
    Easing，QE）救市，市場過度充裕的流動性令大量資金湧入本港，加上內地海量資金同時湧入，造成了香港近十年的資金氾濫、銀紙貶值、資產價格暴升的局面，通脹率平均每年維持在4至5%，但銀行存款利率不足0.5%，出現實際負利率（不是名義負利率），直至近來才開始有所收窄。


