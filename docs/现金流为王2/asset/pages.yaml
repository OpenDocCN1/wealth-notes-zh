  md: '# 第四篇：法律神話的祕密哲學導論


    # 4.2 槓桿的藝術


    古希臘物理學家阿基米德曾經講過：「給我一根槓桿，一個支點，我就可以舉起全世界。(Give me a lever and a place to stand and
    I will move the earth.)」


    槓桿不單只是一種物理學原理，看得通透的話，槓桿其實是一門哲學，而槓桿的使用則是一門藝術。


    槓桿，原理上需要一根棍子，再加上一個支點、力點和重點，使用槓桿的目標是利用最小的力量去挑動最大的重量，簡單而言，槓桿哲學的目標是要收「事半功倍」之效。


    # 你站在槓桿的哪一邊？


    從投資或財務的角度，一根有支點的棍子是一個融資平台，而投資的資本（Equity）就是力點，槓桿後放大了的投資回報就


    101'
