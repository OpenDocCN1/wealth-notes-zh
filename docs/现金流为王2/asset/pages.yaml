- pgno: 44
  md: "# ### 2.2 「REITs＋Bond」組合的五個重點\n\n筆者必須再三強調的是，這是一個組合系統。單獨地投資REITs或單獨地以槓桿方式買債券，基本上已與「REITs＋Bond」投資組合提出的核心理念和背後的營運管理哲學完全不同。\n\
    \n「REITs＋Bond」投資組合的投資操作中，提出的重要投資理念包括：\n\n+   *   槓桿：以槓桿方式投資有效資產\\*，從而帶來高現金流回報；\n\
    \n+   *   再投資：現金流是再投資的條件，再投資含復利力量和分散投資的機會；\n\n+   *   累積資產：以槓桿投資產生的現金流，長遠不用槓桿去累積「值得累積的資產」**；\n\
    \n+   *   \\*有效資產：指能於一段時間內持續地產生現金流收益的資產。詳情請見第三章。\n    \\*\\*值得累積的資產：指能於指定時間內產生現金流收益、其產生的整體收益會隨時間有所增長，且增長速度比通貨膨脹快的資產。詳情請見第三章。"
