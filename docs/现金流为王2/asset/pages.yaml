  md: '# 6.3 空手入白刃的地產項目


    話說數個月前，筆者在荔枝角路經一處，發覺原本是美心餐廳一直租用的工業大廈地廠圍上了街板，連忙問身邊的地產經紀同事，美心遷走了嗎？同事說是的，由於美心正進行品牌提升（現稱美心MX），分店選址首選商場，工業地廠租金雖便宜，惟工業食堂牌照限制食肆對外不可掛上招牌，故美心最終放棄此工業地廠，轉到大商場去。


    # 物色具潛力資產 機會就在身旁


    筆者立時精神為之一振，原因是筆者一直心儀該工業地廠的位置。按筆者對荔枝角的了解，該地廠位置堪稱全荔枝角最具商業價值的工業地廠。地廠位於青山道與大南街交界，十字路口，人流極盛，十字路口有紅綠燈位，人流匯聚於此，且該位置'
  merge: -1
  img_proc: true
