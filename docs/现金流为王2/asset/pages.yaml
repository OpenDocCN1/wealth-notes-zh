  md: '通脹、經濟前景不明朗的情況下，大家所期待的真正「加息周期」（非利率正常化）將可能遙遙無期。


    事實上，在金融海嘯後，世界宏觀經濟出現了一個新經濟常態，傳統的經濟思維模式已不合時宜。現時全球信貸系統出現了一個結構性的問題：銀行有錢但不願貸款，特別是貸款予中小企做生意；想借貸的中小企又借貸無門。銀行體系資金充裕，平錢周街都是，銀行出現水浸，因為印出來的新錢全部留存於銀行體系。量寬印錢只能增加貨幣基礎，並不是M2，而只有M2增加才是真正可以令貨幣供應上升。沒有銀行體系的乘數效應（Multiplier
    Effect），流入實體經濟的貨幣供應實際上也沒有大幅增加。


    # 流動性陷阱 貨幣政策失效


    以目前情況來看，市場是處於流動性陷阱（Liquidity Trap）—— V處極低水平。流動性陷阱是經濟學家凱恩斯（John Maynard Keynes）提出的一種假設處境，指當一定時期的利率水平降低到不能再低時（即像目前情況），人們就會產生利率上升而債券價格下降的預期，貨幣需求彈性就會變得無限大，即無論增加多少貨幣，都會被人們儲存起來，或是銀行不願貸出資金，以致資金鎖死在銀行體系。發生流動性陷阱時，再寬鬆的貨幣政策也無法改變市場利率，使得貨幣政策失效。


    沒錯銀行體系資金十分充裕，但未能有效推動經濟，主因是資金沒能有效投入實體經濟。銀行只願貸款予有頭頓抵押的按揭貸款（Mortgage Loan），借業者用之來買樓自住或投資，間接又推高樓價；銀行又十分


