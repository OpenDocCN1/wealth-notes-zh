- pgno: 124
  md: '槓桿投資應該分「動態」和「靜態」兩種狀態去分析。隨時間不斷的投資操作（包括再投資操作）是一種「動態」的概念。那麼，「靜態」的概念是甚麼？「靜態」是指在一個靜止的時點下，投資組合的狀態。而筆者想強調的是所謂投資組合的「最終理想狀態」（Optimal
    status），是一種「靜態」的概念。


    首先，投資組合帶有槓桿的狀態，從來都不是「最終理想狀態」，即「最終理想狀態」下的投資組合不應帶有任何槓桿，這是一種「靜態」的概念。提出「靜態」下的「最終理想狀態」的意義是甚麼？其意義就是讓投資者以此作為一個目標。我們日常操作的投資行為是一種「動態」行為，而「靜態」的最理想狀態是讓投資者望著作為目標去跑，跑是「動態」，而跑的方向相當重要。組合的槓桿長遠隨時間應該是不斷下降而不是增加，組合在動態下必須要不斷自我優化。凡使用槓桿的投資者都必先要有以上這種心態。前文多次所講的“Leveraging
    today is to achieve deleveraging tomorrow”，其實就是貫穿了上述概念的一句總結，筆者提出的「REITs＋Bond」組合，事實上正是在實踐這個理論。


    槓桿只是在新資金／資本加入投資組合時才會使用，用以提升短期的預期回報（注意並非長期），新資金的槓桿投資產生出來的高現金流回報用作再投資時並不應繼續使用槓桿，讓組合自然去槓桿（Natural
    deleveraging）。投資者要分清新資本和再投資資本的分別。'
  merge: -1
  img_proc: true
- pgno: 125
  md: '![](img/28586c71c5408626f3973d2458a73d64_125_0.png)


    # 慣性槓桿的危機


    在現時的情況下，投資者特別是多年來慣常使用槓桿的投資者，必須好好讓腦袋清醒一下，強如資深的專業投資者、大型對沖基金都需要留意，切勿墜入「慣性槓桿」的陷阱。所謂慣性槓桿，是指慣性地把注意力集中在槓桿後的資本回報率，而忽略長遠平衡槓桿風險的投資策略。


    有人會問，為何保守如一些家族基金，投資時仍會使用槓桿？為何大型對沖基金都使用槓桿？因為基金成立的目的是要「跑」，生生不息，停下來基金就會失去本身作為「投資機器」爭取投資表現的功能。基金是沒有選擇，我們是個人投資者，卻有得揀。零/
    低槓杆狀態可以為自己保留實力，待機會來時再啟動槓杆投資。既然如此，投資者又何必急於無時無刻保持高速的「動態」？


    筆者夠膽說，目前市場大部分使用槓桿的投資者，當中不乏私人銀行的一眾「貴客」，都是槓桿上癮，沒有「靜態」理想狀態的目標思維。這班投資者會令市場加速進入非理性的資產追逐狀態，當經濟危機到來時，便會加大市場去槓桿時的影響和痛楚，大家不得不小心。


