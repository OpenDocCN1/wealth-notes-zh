  md: '金，就可以買到 100% 面值的債券，其餘 80% 由銀行融資，計算槓桿比率就是 1 / 20% = 5 倍，淨回報率超過 18%。當然，筆者一向不建議用盡槓桿，但即使不用盡槓桿，要做到淨回報
    10% 以上也不難。以上做法就等同套息交易 (Carry Trade)，借入低息資金，買入高息資產，從而套取當中的息差。有關槓桿操作，會於稍後篇章作更深入講解。


    至於筆者的 REITs 組合一般不做槓桿，因為想利用其價格波動性 (Volatility) 較低及高倉值（即高融資率）的優勢，作為槓桿債券組合的有效緩衝 (Buffer)，並作為滿足臨時現金需要的「提款機」，提升整個投資組合的資產流動性及穩健性。


    要做到「REITs + Bond」組合有足夠的防守力，首要記住債券組合槓桿不用盡，REITs 組合的緩衝要充足，這樣才能令組合立於不敗之地。


    基於債券一般每半年只派息一次，因此債券組合本身設計是分散買入最少六隻不同派息月份的債券，使債券組合每月均會收到債券利息，達至每月出糧的效果。債券利息每月有多有少，筆者會用於再投資優質、前景看好且平穩增長的
    REITs 組合，如領展 (0823)、置富 (0778)、越房 (0405) 和持有又一城的新加坡豐樹信託 (Mapletree Greater China
    Commercial Trust ; SGX : RWOU) 等，而 REITs 組合亦會定期每半年派息一次，因此整個組合便形成了一個擁有穩定現金流的投資組合系統。'
