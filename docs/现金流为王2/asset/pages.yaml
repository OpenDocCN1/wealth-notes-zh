  md: '假設初始投資金額為50萬港元，派息每年增長5%。若股價每年上升5%，20年的總收益(包括派息及股價升幅)為619萬；相反，若股價每年下跌5%，總收益為1,636萬，較股價每年上升的情況高出1,000萬。當大部分人都認為當然是股價一直上升的回報會更高的時候，結果剛好相反，「股價一直下跌＋現金流再投資」竟比股價一直上升的財富增長更大，還大很多倍。雖然一直有派息增長的股份，其價格長遠不可能一直下跌，這可能是不現實的假設，然而這個測試相當有啟發性，同時亦展示了現金流再投資的力量。


    這實驗的結論說明了在未找到其他更好的投資選擇前，而手上持有股份的基本面長遠來看仍然是非常良好，而該公司亦是再投資的第一目標時，其價格急升其實不是值得投資者興奮的理由，更可能會令投資者有感謝復，迫使投資者只能持有現金等待。


    當然，以上理論是有前提的，就是假設了其他因素不變，包括該股的基本面往後不變、往後沒有更多其他更好的投資出現等。如果該股往後因為其他因素如管理層變動而轉差，即往後再投資的價值便會下降，以上理論便不一定成立。此外，如果往後有其他更好的投資機會出現，再投資的選擇可能會更多。


    因此，當股價大幅上升，只有兩個原因對投資者來說是值得高興：


    +   1. 價格上升，能為我們提供更多日後抵抗風險的緩衝 (包括該股份的基本面突然轉差，而需要換馬其他資產)，即一個令你獲利離場的選項 (離場的原因是基本面改變，而不是為了take
    profit)；'
