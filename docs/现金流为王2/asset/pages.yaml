  md: '故事尚未完結，假設筆者每月淨租金收入為36萬，一年為432萬，十年為4,320萬。按現時的二房東運作，要收到這4,320萬需十年的時間。簽下租約後，筆者曾問過業主有沒有興趣出售物業，當時業主說到價可考慮，開價一億以上才考慮。明顯地，此開價是按我與他之間的租約的租金水平來釐定，每月租24萬，一年租金288萬，以3%左右的Cap
    rate計算，資本化估值就是大約一億。然而，現時筆者將項目的租值提升至每月60萬，物業的估值以相同的Cap rate計算，資本化估值便上升了1.5倍，即約2.4億。儘管保守地以較高的Cap
    rate去做估值，相信估值仍能在兩億以上的水平，若能以一億買下項目，帳面仍能賺一倍以上，這才是筆者最想做到的。由於估值主要是基於物業租值以資本化率推算，只要能提升租值，便能提升物業估值及價格；當估值提升，除了出售資產，亦能透過再融資將帳面的資本增值部分釋放，轉化為現金流再投資。


    當然，當業主知道項目最終能租到這個租金水平時，又不願意出售了，然而業主亦被我的租約鎖死了十年，除了出售物業給我，我們也能合作出售，然後將資產增值部分作利潤分成分成。'
