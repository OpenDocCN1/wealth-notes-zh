  md: '# ## 2.4 浮息債券

    ### 應對利率上升


    市場利率風險上升，債券價格就會下跌，原因是現有債券的相對回報（Relative return）下降，但也不代表所有債券下跌的幅度都會一樣，例如年期短的債券、浮息債券所受的影響相對會較少。所以在預期利率將會開始回升時，選債技巧十分重要。專業投資者會分析浮息曲線（Yield
    curve）、預測利率走勢、加息幅度、分析加息對經濟的影響、通脹預期等因素。因此，利率風險同時會導致債券價格的波動。


    利用槓桿投資債券，先天結構上有一個問題——利率和收益不匹配。由於融資利率一般為浮動利率（以COF / Libor / Hior 為基礎利率），而市場上大部分債券為固定收益債券，因此，當利率上升時，套息空間便會收窄。在面對利率正常化的加息環境，除儘量挑選年期較短的債券外，槓桿投資債券時一般可採取兩種方法，對沖利率上升的風險：'
  merge: -1
  img_proc: true
- pgno: 52
  md: '+   1. 買入利率掉期，鎖定融資利率（固定融資利率 vs. 固定收益回報）；


    +   2. 投資浮息債券（浮動融資利率 vs. 浮動收益回報）。


    以上兩個方法實際上都是解決「利率和收益不匹配」的問題，將利率和收益變為匹配，而無論利息上行或下行，息差依然不變。


    # 何謂利率掉期？


    利率掉期交易（Interest rate swap，IRS）是掉期交易最常見的一種。利率掉期交易合約首先確定一個名義本金（Nominal principal），在合約時間段中，其中一方同意定期支付另一方以固定利率（Fixed
    rate）計算的現金流，另一方則同意定期支付以現時浮動利率（Floating rate）計算的現金流；浮動利率一般以倫敦同業拆借利率（Libor）作為基準。


    假設槓桿債券的貸款利率是Libor+1%，由於Libor是浮動的，如果市場加息，Libor會上升，借貸成本就會上升，但息差1%是不會改變，變的只有Libor。為對沖Libor上升風險，投資者可買入利率掉期。根據利率掉期協議，投資者會定期以固定利率去換取浮動利率的現金流。投資者所收取的浮動利率現金流，就會用來支付銀行貸款的浮動利率貸款。因此，對投資者而言，無論市場加息與否，投資者實際只需要支付一個定息的貸款成本，因此期內的利率風險可以說是完全對沖，浮動的貸款利率得以鎖定。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '當然，買入利率掉期是有成本的，特別是在市場預期加息的情況下，溢價便會愈高，但其好處是讓投資者「計到數」。若融資利率加上利率掉期溢價，相對於債券的固定收益回報仍然有一定空間，那麼投資者在預期加息的環境下，仍然可考慮是否以掉期投資債券。


    # 浮息債券操作示範


    在加息的環境下，債券的價格會受到不利的影響，然而浮息債券能為投資者提供與市場利率掛鉤的利息回報，當參考市場利率（一般為Libor）上升，利息回報便會同步增加。因此，浮息債券類別可以對沖利率波動風險，適合有意投資債券、同時希望避開利率風險的投資者。


    以北大方正集團屬下子公司所發行的浮息債券為例：


    | 發行人 | 坤智有限公司 |

    |---|---|

    | 擔保人 | 香港方正集團有限公司 |

    | Keepwell | 北大方正集團有限公司<br>Peking University Founder Group Company Limited |

    | 總發行金額 | 3.1 億美元 |

    | 票面利率 | 3M Libor + 4%p.a. |

    | 到期日 | 2021年5月21日 |


    * 先言聲明：筆者對該公司未作深入研究，此例子僅作解讀投資浮息債券的實戰操作，僅作參考，並非投資建議。'
