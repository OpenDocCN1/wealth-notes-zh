    # ## 3.5 輕資產／重資產 的投資模式


    筆者經常說「重資產、輕資產」，其實是形容一個商業模式。在新經濟模式的趨勢下，輕資產遠比重資產的商業模式「值錢」，從資本市場的市盈率 (P/E ratio)
    便能夠反映出來。


    事實上，「重資產」、「輕資產」並不是一個財務概念，財務中只有固定資產和流動資產、有形資產和無形資產的概念，輕資產和重資產其實是一個「策略性」(Strategic
    level) 的概念。一般而言，重資產主要是指固定資產集中、資本密集 (Capital intensive) 的商業模式，如機械、鋼鐵等行業，這類行業需要大量的資本投入；而互聯網、電子商貿、中介代理等領域的固定資產相對較少，資本投資入亦相對較低，其營運模式我們稱為「輕資產模式」(Asset-light
    Strategy)。'
