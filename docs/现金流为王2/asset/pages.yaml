- pgno: 130
  md: '# 以融資將「升值」轉化成現金流


    以上的故事是真人真事，筆者初出茅廬時正值金融海嘯，親眼看見不少盈利沒問題的巨企倒閉，死因都是資金鏈斷裂，轉不動。盈利不是一切，現金流如血，沒有現金流會令巨人倒下。個人理財或投資跟經營企業一樣，都不能忽略現金流的重要性。看盈利或回報應該從Total
    return的角度，Total return =資本增值（Capital gain）＋現金流入（Cash flow）。


    要留意的是，所謂的資本增值如果不能有效地轉化成現金流，只代表純粹的帳面升值、是未實現的盈利（Unrealized gain），亦即缺乏資產流動性（Liquidity）。盈利一天未「落袋」都是虛無的，只有口袋中的現金流才最實在。


    銀行／融資機構的角色便是將未實現的盈利，以再融資（Re-financing）的方式具現化為現金流。沒有再融資能力的資產，就代表資本增值的部分一日不出售也只會一直停留在未實現盈利的層面，沒有流動性，一點作用也沒有，只會帶來自欺欺人的財富效應（Wealth
    Effect），是心理的層面。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '# 樓市的購買力來自再融資


    正如今天香港的樓市，金管局再次出招限制按揭成數，其實最大影響的是再融資。金管局的出招是有道理的，在住宅供應不足的情況下，市場的潛在參與者要買樓都是鬥購買力，而現時今日鬥購買力已經不再是講人工的高低，也不是講儲了多少錢。


    由於香港樓價多年來不知上升多少倍，大部分香港人的購買力其實是透過再融資去釋放物業的資本增值部分，使未實現的盈利轉化為現金流，然後現金流成為新資本，再投資買入其他物業資產。遊戲規則已變成「在資產不停升值的情況下，擁有愈多資產的人就能融資更多的資金去買入更多的資產，然後資產繼續升值」。無窮的「升值＋再融資」的購買力，不停去追逐有限供應的住宅物業，結果會如何，應該不用我多說。


    # 追逐資產升值 忽略資產重量


    香港入憑投資住宅賺過錢的人不計其數，他們甚至身邊的人都受到了根本性的影響，在他們眼中投資的邏輯就如他們買樓一樣，「買入資產等升值，加按套現再投資」，時間長了，他們便愈儲愈多「重資產」，但都忽略了現金流的重要性。筆者一位讀者曾經郵寄諮詢意見，其手持的八個物業總資產達八至九千萬，但每月淨現金流入竟不足兩萬元。這是典型的重資產格局，重磅到勁都動不了。


    ![](img/28586c71c5408626f3973d2458a73d64_131_0.png)'
  merge: -1
  img_proc: true
- pgno: 132
  md: 市場上大部分投資者 / 散戶投資股樓，大多只追逐不停的資產升值，而忽略了現金流的重要性。在富人 / 專業投資者的眼中，這種邏輯是剛剛好倒過來，他們注重現金流，不追求爆炸性的資本增值（俗稱「搏升值」）。相反，他們會選擇想辦法去提升資產或組合的現金流收益（財務上稱為“Yield”），去將估值資本化
    (Capitalization)，從而達到資本增值的目的。前者（搏升值）是被動的，後者（現金流）則能主動提升。這是為何普通人只會買樓（期望升值後再買），富人會做好資產配置，注重現金流。哪一種更為穩健，留待看官自行判斷。
