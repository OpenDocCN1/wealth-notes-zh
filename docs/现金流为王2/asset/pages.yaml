    第四童：槓桿的應用與歷史


    投資應該注重現金流，因為這是「有數得計」的投資，而且只有現金流才能做到「現金流再投資」，而「再投資」有複息的力量，能為投資雪球注入動能。但是，若只依靠現金流「再投資」的力量，在抵銷了通脹因素後，預期財富累積的速度將會大幅減慢。


    不用槓桿而致富的例子不是沒有，但大部分他們本身都已經富有，擁有雄厚的資本，full pay不是問題，不影響投資選擇。對於他們而言，即使只有5至6%的年回報，已經可以穩定產出強大的現金流回報去進行再投資，同步地去買入「值得累積的資產」，前後兩者可以同時進行，互不耽擱。此外，由於他們所及的投資門檻較高，投資選擇眾多，投資項目的回報率相對較高，通脹因素影響亦相對較小。相反，對於一般資本不多的大眾投資者而言，單純依靠現金流投資累積資產，很大程上只能在對抗通脹的同時，一點一滴的去累積財富。


    # 善用槓桿 須考慮時機及比例


    想要更上一層樓或致富，整個長時間的投資過程中就必須懂得善用槓桿，合理地提升名義資本回報率（Nominal ROC），以抵銷通脹因素拖延財富累積速度的時間成本。因此，我們投資時必須要找能槓桿的投資目標，長遠累積的資產也必須要有「潛在使用槓桿的可能性」。要留意的是，投資能使用槓桿的資產，並不等於投資者投資時要立即使用槓桿，更不等於投資者要用盡能用之槓桿去投資。


    槓桿，是一種選擇（Option），所有選擇本身都有價值，而附有槓桿選擇權（Option of leveraging）的資產，其價值遠比沒有槓桿選擇權的


