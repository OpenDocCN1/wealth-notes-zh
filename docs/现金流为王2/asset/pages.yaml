- pgno: 77
  md: '# 第三章·勇讀財富的密訣


    雖然同時能滿足2和3的資產項目選擇不多，但能分別滿足2或3的，市場上卻有不少選擇。又以「REITs + Bond」投資組合為例，債券能滿足2的條件，能定期產生高現金流回報，若使用槓桿，資本回報率
    (ROC, Return on Capital) 會更高，但債券的特質是「保本」（若發行人不違約），即到期日能全數收回本金，而期間收取穩定的債息，然而其「保本」的好處真正就是壞處。因此，筆者透過房託這種「值得累積的資產」來彌補債券的不足，兩者結合起來，正是同時滿足2和3的投資組合。


    《現金流為王》中亦曾提到：


    > 債券最大的缺點是持有債券至到期並沒有資本增值的效果，因為債券只能做到保息保本（債券到期取回本金），這是優點同時也是缺點。在不斷量化寬鬆的大時代下，銀紙長達會以高速貶值，沒有資本增值的力量實在難以抵抗通貨膨脹。要做到投資組合產生穩定現金流，而又能收得像實物資產/磚頭般的長遠資本增值，將債息再投資
    REITs 是最穩健之選，同時 REITs 亦具有高倉值的特點，也具有高而穩定現金流的特點，因此兩者除了互補，亦能夠相互作用再投資的操作，優化整個投資組合，使雪球愈滾愈大。


    由可見，不同資產有不同的特質，通過資產配置的方式能將不同性質的資產有機結合，做到優劣互補，使資產組合能有高現金流，又能收長遠資本增值的效果，對沖通脹和銀紙貶值的風險。


    ![](img/28586c71c5408626f3973d2458a73d64_77_0.png)


