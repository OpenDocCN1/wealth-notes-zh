    + 1%（不同銀行的COF有異，但大致與Libor相若），可選擇7天 / 14天 / 1個月 / 3個月的利息期，利息期愈短，利率愈低。為了對應該浮息債券的利率重置日，投資者可選擇同為三個月的利息期。債券的下一次定息日為8月21日，假設投資者於同一天買入債券，同時選擇三個月的利息期，債券下一次的利率收益重置日與貸款的利率成本重置日，將會為同一天。融資成本為3%
    + 1% = 4%，而債券收益率為7%，槓桿操作下的套利息差將會固定為3%。


