  md: '然而，城投公司所投資的公共建設項目大部分都沒有盈利能力。這些城投債作為地方政府爭取政績的工具，卻沒有想過還款能力的問題，爆破是遲早的事。最近一兩年，大量內地城投公司跑出境外尋求發債渠道，筆者也曾接獲不少城投公司的邀請作為其境外發債的融資顧問，可以說，他們甚麼也不懂，只想趁境外債券市場火熱時圈錢。偏倆就有不少私人銀行客戶貪其高息，又有「國企」背景，以為相當安全，加上銀行又願意配合給予高槓桿，令這些債券近年都十分暢銷。


    說到國企背景的債券，不得不提中國國儲能源化工集團。2017年底，國儲能源曾革頭合組財團向長實以402億港元收購中環中心。然而不久後，國儲能源退出了交易，並在2018年5月份出現一系列美元債券違約。事實上，金融海嘯後，中央開閘放水，實施寬鬆貨幣政策，擁有國企背景的企業以及大型上市企業如萬達、海航等，都極容易從銀行取得大額貸款。然而，他們都明白到內地的資產和人民幣都存在著泡沫。引述賀江兵的說法，人民幣事實上是「超額增發」的。根據人民銀行資料顯示，2018年3月，人民幣廣義貨幣供應量高達約174萬億元，這個數字比美元和歐元的M2貨幣供應量之總和還要高。這是為何國儲能源、萬達、海航等大型企業要在內地借取大量銀行貸款、發債用於海外併購，因為他們都意識到將資產配置海外的安全性，同時清楚明白人民幣存在泡沫的問題。然而，這些不惜通過高負債去境外進行瘋狂併購的行為令中央非常關注，當中央針對這些高負債的企業實施融資限制，流動性便會即時出現問題，這些企業在境外發行的債券便會面臨違約危機。'
