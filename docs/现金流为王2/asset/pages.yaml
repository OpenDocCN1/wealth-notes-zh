  md: '整個貨倉項目建築面積約九萬呎，分拆成 11 個獨立架小型貨倉，筆者公司同時提供物業管理。由於市場對物流貨倉需求旺盛，新界洪水橋發展計劃及東北發展計劃上馬，使新界倉地及貨倉的供應嚴重不足，預計未來情況將會更加嚴重。事實上，筆者早已透過與市場研究公司合作，收集了大量有關新界供應及需求預測的數據，斷定了這個方向沒有錯，因此立即大規模投資倉地發展。市場的反應證明筆者當時的推斷正確，更可能是低估了。目前有蓋貨倉的市場租金已達到
    13 至 15 元／呎。


    # 產融結合的力量


    該項目還未完全完工之際，已由四個獨立用家全部承租，平均租金約 12.5 元／呎，每月收租 110 萬，全年租金收入 1,320 萬。測量師行根據市值租金水平，以
    5% 左右的 Cap rate 進行估值推算，目前估值已大幅提升至 2.53 億，呎價約 2800 元／呎。


    在短短不足一年的時間裏，資產價值提升超過一倍。銀行則根據測量師估值報告，能夠提供最高四成的按揭貸款，而透過銀行承做四成按揭，筆者已接近取回全部投入的本金。假設供
    20 年，每月供款約 50 萬，其中 33 萬為本金，17 萬為利息，租金收入足以覆蓋供款有餘，每月有正現金流 60 萬，還未計算 33 萬本金供款部分。


    透過強化資產，現金流收益資本化令資產估值提升，再通過產融結合，將資產價值提升部分成功轉化為現金流，現金流再成為新資本進行再投資。本個案將一幅沒有太大價值的倉地，改造成一個現代化的有蓋貨倉，同時將現金流和資產估值大幅提升。最後，通過再融資從銀行套現'
