  md: '一般而言，筆者會直接設計一個proposal，向私人銀行建議整個操作方案。首先，筆者提出的要求是美元貸款和港元存款（或其他港元固定收益產品）的息差要接近相同，第二是槓桿比率的要求。筆者好奇致電某專門做結構性產品的大投行詢問，第一個反應是：「陳生，乜又係你呀？」。經過一輪內部商討，該行產品部的初步回覆是：第一個條件基本上可以做到，但行方並不願透露以何種產品操作：至於融資比率最高則可能只有95%（待定），即20倍槓桿。最後，當然是行方對投資者的要求——一般tailor-made的投資盤均會對投資者設定最低的投資金額要求。


    市場不時會出現一些短期的套利操作空間，筆者對上一次操作已是數年前人民幣存款證借美元、CNY / CNH等的操作了，當時回報非常瘋狂，現在回想起亦津津樂道。現時除了市場的套利機會和空間愈來愈少，感覺上金融機構們亦沒有當年般進取，這當然也跟監管機構的政策收緊得愈來愈嚴格有關。'
