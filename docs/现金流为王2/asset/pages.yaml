- pgno: 192
  md: '# 「加息」反令資金更泛濫？


    原因是並非所有金融機構存款在聯儲局均可以賺到IOER，舉例如房利美和房地美等政府資助金融機構（GSE）就不符合資格，但他們在QE後擁有大量剩餘儲備，既然他們存款於聯儲局無利息可賺，因此願意以FFR或更低利率借出予其他銀行。但在市場資金充裕的情況下，銀行的儲備都滿滷，有誰還需要拆借？答案是所有銀行都爭著去借，原因是只要GSE的借貸利率比IOER低，市場便有套利空間。銀行們紛紛向GSE以FFR或更低的利率借入資金，然後存於聯儲局賺取更高的IOER，基本上是無風險套利（Risk-free
    arbitrage）。


    因此，儘管IOER實際上未能作為「利率通道」的下限，通過市場的套利行為，IOER和EFFR之間的利差也是有限的，聯儲局依然可以利用IOER作為「加息」的工具。然而，為了解決「利率通道」下限設定的問題，從而更精準地「加息」，聯儲局發明了另一種「加息」工具——隔夜逆回購計劃（Overnight
    Reserve Repo Program，ONRRP）。聯儲局以各大銀行存入的儲備作為「抵押品」（實際上應為保證），進一步向銀行及其他金融機構借入更多的儲備。這種方式的分別在於參與的金融機構將更多，由於房利美和房地美等GSE和貨幣市場基金（MMF）等其他金融機構均合格資，自由參與市場逆回購，比起IOER以銀行參與為主，這種方式的規模更大，且加強了「加息」的市場傳遞力量。


    由於MMF等市場參與機構借錢予聯儲局是零風險，因此ONRRP必然低於FFR，ONRRP於是便成了「利率通道」的下限。IOER和ONRRP分


