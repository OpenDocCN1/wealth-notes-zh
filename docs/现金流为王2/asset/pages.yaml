  md: '![](img/28586c71c5408626f3973d2458a73d64_185_0.png)


    # 7.4 認清何謂「加息」


    分析加息對經濟，以至資產市場的影響前，我們需要先知道所謂「加息」，實際上是加甚麼息？美聯儲又是通過甚麼手段達到「加息」的效果？儘管大家每天都在談論「加息」這個議題，但相信大家對以上兩個問題都未必清楚。


    所謂「加息」，其實加的是美國聯邦基金利率（Federal Funds Rate, FFR），亦即是美國銀行隔夜同業拆息（銀行與銀行之間互相借貸的利率）。有別於中國對利率的直接操控（直接對市場給予一個指導利率），聯儲局開會決定的其實是
    FFR 的目標，說是一個「目標」，是因為聯儲局一般會透過市場操作去影響銀行體系儲備（Reserves），以確保 FFR 實際水平與目標相若，因此多年來美聯儲的零息目標其實是0%–0.25%的區間。'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# QE後 傳統加息操作失效


    簡單而言，如果聯儲局決定加息，理論上必須減少銀行體系的儲備，令銀行體系內的資金頭寸相對緊張，從而推升市場利率。操作上，聯儲局會在市場沽售債券或證券，如美國國債、按揭抵押證券（Mortgage-backed
    security，MBS）等，從而抽走市場的流動性。相反，若聯儲局決定減息，則會在市場上購買美債，目的是向市場注入資金，增加市場流動性，在市場資金充裕下，利率自然下降。利率就是流動性的價格。傳統以來，聯儲局都是通過向銀行買賣國債的方式調控FFR至貼近目標水平，這種操作方式稱為公開市場操作（Open
    Market Operation，OMO）。


    然而，2008年一場席捲全球的金融海嘯，美國為挽救經濟推出三次史無前例的大規模量化寬鬆，通過多次在市場大量購買美債、MBS等證券資產，向市場注入數萬億美元資金，使美聯儲的資產負債表規模擴大至4.5萬美元。面對數萬億美元的資產規模，如果通過OMO在市場收緊流動性以達到加息的目的，就必須要在市場上沽售數以千億美元計的債券，這必然會對金融市場造成巨大衝擊，更甚可能會引發另一場金融海嘯。面對著市場海量的資金規模，以OMO去調控FFR水平，可以說是被廢了武功。


    傳統公開市場操作失效，聯儲局唯有通過其他手段去達到提升FFR的目標，其中一種方法同時亦是現時聯儲局加息時所採用的方法，就是提'
  merge: -1
  img_proc: true
- pgno: 187
  md: '![](img/28586c71c5408626f3973d2458a73d64_187_0.png)


    高額外存款準備金利率（Interest on Excess Reserves，IOER），以吸引銀行將多餘的儲備存入聯儲局。對銀行而言，將資金融借予同業是有風險的，而將資金存入聯儲局則沒有風險，因此當IOER提升至高於FFR，銀行必然會將多餘的儲備存入聯儲局，從而達到收水的效果。現時聯儲局就是利用這種方法去「加息」。


    放棄公開市場操作，而改用提升IOER的方法去加息，有個很大的問題。大家別忘記聯儲局之前三輪大規模QE是通過OMO向市場注入資金，使市場的資產規模膨脹至數萬億美元。然而，如今聯儲局希望「加息」收緊市場流動性時，卻放棄OMO的方式，改以提升IOER來達到「加息」的效果。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 真正加息 不能不縮表


    有趣的問題來了，當IOER提升至高於FFR，銀行當然減少將多餘的資金拆借予同業，而傾向將資金存入聯儲局收取更高的利息，需要拆借資金用於臨時周轉的銀行，唯有開出更高的利率向同業拆借資金。理論上，市場的流動性應該會被收緊，「加息」的目的亦看似達到。但事實並非如此，銀行存入聯儲局的資金仍然是屬於銀行的流動資產，銀行體系的貨幣基礎實際上並沒有因為「加息」而減少。


    要知道銀行體系在資金充裕的情況下，銀行又不想將資金借出去，雖然理論上同業拆借成本高了，但銀行根本沒有需要向同業拆借資金，銀行實際上並無加息壓力。因此，以提高IOER來「加息」的效用可謂名存實亡，實際上根本無助收緊流動性。


    由此可見，在後量寬年代，「加息」不是主菜，縮表才是關鍵，大部分人的焦點都放錯在「加息」之上。另一方面，以提升IOER來「加息」只會抽高短息，這也解釋了為何長債息率仍然長期維持於低水平，升的只是短債利率。現時兩年和十年期息率之差降至只有39.1點子，美國國債孳息率曲線（Yield
    curve）是自2007年以來最為平坦。


    倘若聯署局繼續單靠提升IOER去「加息」，美國國債孳息率曲線有機會出現「倒掛」（Inverted yield curve），即短債息率高於長債息率，歷史告訴我們這是經濟衰退的先兆。繼續這樣「加息」只會消耗持續再加息的本錢，而「加息」的實際效用卻成疑。'
  merge: -1
  img_proc: true
- pgno: 189
  md: '# QE 毒癮難戒又危險


    因此，不論聯儲局以何種方法去加息，也必須配合縮表來同時進行，貨幣政策正常化的過程必須與減少資產規模來配合，否則聯儲局加多次息也無助收緊市場的流動性，資產價格只會一直繼續上升，製造真正的資產泡沫。當經濟衰退來臨時，資產價格和息口均處於高水平，資產泡沫在高位爆破，到時所造成的影響更嚴肅。


    筆者很早之前的文章也曾說過，QE 猶如吸毒，很難回頭，要回頭過程亦相當痛苦。這三輪 QE 的影響，除了完全改變了聯儲局一直以來慣常的貨幣政策操作，亦扭曲了全世界經濟體的金融生態系統，同時亦使聯儲局難以用傳統
    OMO 的方式去調控市場利率。當資產負債表過分吹大了，所有傳統的貨幣政策都已經難以產生效用，想再以傳統的貨幣政策去正常化已扭曲的金融生態系統，難矣，要做卻必須要用新藥。正如長期吸毒的癮君子想戒毒，絕非易事。


