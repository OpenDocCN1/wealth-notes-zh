    # 以槓桿投資思維 營商


    筆者是一個投資者，也是一個企業家，而我發現投資就如營商，兩者有著十分微妙的關係，分別只是站在不同的層次和角度去看同一件事。


    先講營商，筆者營運生意的理念是「寓投資於生意」，意思是以投資的理念去經營不同的生意。而以投資模式去經營生意，在理念上的最大分別在於「單一投資」（Single
    investment）思維和「持續投資」思維。前者是散打式，特別注重個別項目的一次性收益（One-off gain），後者則著重持續盈利（Sustainable
    gain）。後者考慮的因素當然與前者截然不同，後者的視野需要比前者遠得多，而只有「持續盈利」的投資思維，再加上經營模式，才能稱得上是營商（Running a
    business）。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '+   1. 單一投資：注重一次性收益

    2. 持續盈利投資：著重長遠持續收益（因此會考慮如何使今次的投資對下一次的投資有利）

    3. 持續盈利投資＋商業模式＝營商


    對於一般投資者而言，投資有長線和短線之分，而營商只有長線，這就是營商與投資的最大分別。正如筆者經常說，投資應該是長途賽，心態決定命運，視野決定成敗。做生意要長遠成功，必先要有正確的投資思維／價值觀，培養良好的財商後再談創業，因此也不是人人都適合營商創業。


