- pgno: 149
  md: '愈做愈大，銀行給予的融資額按年增加，同時也包括多種能夠放大使用的融資額度，包括信用證和發票融資等。


    該老闆以前的貿易合作伙伴知道後都相繼前來找我合作，希望利用我的平台做大其貿易生意，我同樣採取五五分成得機制。另一方面，有不少合作投資磚頭的投資者知道貿易的回報高，也主動找我談合作投資。他們不用拿資金出來，只需要將磚頭放入來，利用我的貿易平台便能如提款機一樣提取低成本資金投資，使貿易業務愈做愈大、愈大愈有市場優勢，平台同時被養大，銀行愈願意支持，平台的價值就愈高。這就是平台商業模式的雪球運作。


    當擁有一個良好的平台，你將不愁沒項目，也不愁沒資金，平台亦懂得自動運作。當知道平台長遠爆發性的價值後，你還會以短線得投資思維去經營你的生意嗎？投資和警商一樣，嘗試將眼光放遠、視野擴闊，你看到的將不一樣。


    # 真正的成功 須懂得成就別人成功


    有一個值得大家參考的故事：


    「在一個有 50 人參加的研討會上，演講者給在座每個人派發一個氣球，並要求每人在氣球上寫上自己的名字，然後收集所有氣球，並放進另一個房間。然後讓大家進入房間，並要求在五分鐘內找回寫了自己名字的氣球。每個人都瘋狂地尋找，大家互相推擠和碰撞，場面一片混亂。五分鐘過去了，沒有人能找回自己的氣球。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '演講者改了一下遊戲玩法：大家都隨機獲派一個氣球，並要求大家將之交給氣球上寫上的那個人。一兩分鐘內，每個人都成功取回自己的氣球。演講者說：「這正是我們每日生活中發生的事情。」


    每個人每日都非常努力地想辦法令自己成功，卻不知如何做到。其實很多時候，我們的成功也取決於別人的成功。幫助別人取得成功，同時你也將獲得成功。時代轉變，我們生活在一個「共享的年代」，就必須要懂得怎樣運用共享的方式營商。


    公司只是一個共享平台，老闆只是平台的發起人，平台應以創造最大價值為目標，利潤是市場對你創造價值的回報。所得的回報要與你的團隊共享，這樣才能吸引更多擁有不同才能的人加入平台，平台才能不繼壯大。一個平台創造價值的能力遠比老闆今天自己總共賺了多少個銅板重要。想得到真正的成功，我們必須懂得如何成就別人取得成功。


    ![](img/28586c71c5408626f3973d2458a73d64_150_0.png)


    152'
