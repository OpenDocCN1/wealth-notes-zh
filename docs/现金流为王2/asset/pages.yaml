    # 5.2 現金流資本化


    筆者一直強調現金流的重要性，其實有多少人真正明白現金流的意義？現金流的重點並不僅僅在於它的多與少，更重要是它的穩定性及可持續性，在穩定及可持續的基礎上再談增長。對一件資產而言，如果現金流是前傳，那麼資本化
    (Capitalization) 和證券化 (Securitization) 便是結局。「現金流為王」去到最終、最極至便是資本化和證券化，從而去完美體現一件資產的真正價值，或者說完全發揮一件資產的潛在價值。


    # 現金流是資產價值的基石


    現金流回報是反映及量度一件實物資產，特別是本身缺乏流動性的資產，例如一般非上市資產和房地產（俗稱「磚頭」）的最佳工具。世界上有不少資產不具備良好的流動性，市場上沒有'
  merge: -1
  img_proc: true
- pgno: 134
  md: '市價，其原因可能是因為其本身不是大眾所熟悉的資產，又或是因為它本身的金額 (Lump-sum) 較大、難融資等等，導致該資產在市場上鮮有交易，甚至可能從未發生過交易，因而沒有一個市場「公認」的市價。


    然而，因缺乏流動性而沒有市價並不代表該資產一文不值，而是大家不知道應如何去定價。要對該類資產定價，必先要對該資產進行估值，在估值的過程中，資產本身所能帶來的潛在現金流收益，便起著決定性的作用。


    在明白如何利用可持續的現金流去對一件缺乏流動性的資產進行估值前，必須要明白資本化的概念。簡單而言，每一種資產 (如住宅、工廠、商鋪等) 都有不同的特性，市場對不同資產都有不同的回報率要求
    (Required rate of return)，例如香港本地市場上，商業辦公室和零售商鋪的年回報率要求分別為 2.9% 和 2.5%，我們對這市場要求的回報率稱為資本化率
    (Cap rate)。有了 Cap rate，我們便能將資產目前和將來能產生的現金流收益進行資本化 (Projected cash flow / Cap rate)，最後便能得出該資產的估值，亦即是資產價格。


    # 資本化與資本化率


    對於能持續產生物現金流的資產，特別在市場缺乏市場價格參考的情況下，最有效評估其價值的方法就是「現金流資本化」。除了一般房地產投資者需要對不同資產進行資本化以評估其價值，一些股票投資者亦會以同樣方法，評估股票的內在價值。由於投資股票的現金流收益為股息，該現金流資本化模型稱為股息貼現模型
    (Dividend Discount Model, DDM)。'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# 第五章：現金流的極至──資本化與證券化


    除了從投資者的角度，一些持有房地產物業的上市企業，亦需定期對旗下未出售的資產進行價值評估，並以「按市值計價」(Mark-to-market)的方式入帳，評估出來的資產價值稱為公平值（Fair
    value）。當中不少房地產企業、房地產信託基金也是採用「現金流資本化」的方法去評估其「市值」。


    資本化率可以理解為市場對某種資產的要求回報；從財務的角度，可以理解為折現率 (Discount rate)，將未來產生的持續現金流折現為現值，從而得出資產的估值。兩者的概念其實是類似的。


    不論從企業或投資者的角度，如何定立資本化率可以說帶點藝術。資本化率定立時，需要考慮企業或投資者本身的資本／資金成本（Capital cost）、內外部融資成本、資產折舊（導致貶值）、資產產生現金流的穩定性和增長能力等內部因素。外部因素則包括加息預期、通貨膨脹等等。


    我們投資一隻房地產股票或 REITs，不得不看其使用的 Cap rate（不同的 REITs 在進行估值時所採用的 Cap rate 也有分別）。由於資本化率具有很高的敏感度，在估算房產價值時對結果會產生乘數效應，採用不同比率所得出的結果將會相差很遠。如果一間企業透過調低
    Cap rate 去提升資產的估值，從而粉飾業績，大家要留意。


    例如，新鴻基地產（0016）評估落成的投資物業所用的 Cap rate 是 5.2%，相信也是考慮了上述的因素。由於旗下大部分是已改造的商場物業，增長較尚有改造空間的展展（Cap
    rate 4.8%）低，因此亦較為合理。


    ![](img/28586c71c5408626f3973d2458a73d64_135_0.png)'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# 先現金流，後價值，再價格


    當大家清楚了解將實物資產資本化的過程和原理，便明白現金流是體現資產價值的重要「支持因子」（Supporting factor)。當一件資產大家都不熟悉，因缺乏流動性而沒有市場價格時，我們稱之為「市場失效」，我們只能back
    to the basic，以現金流作為推算資產估值的基礎。


    這是為何專業投資者都會注重資產（特別是非流動資產）的現金流，因為我們都明白這是資產價值的基礎。一件資產如果不能在現在或將來產生可持續的supporting
    cash flow，該資產的價值便沒有支持。先現金流，後價值，再價格。


    一般大眾投資者的邏輯卻剛好相反：先價格，後價值，才現金流。他們只著眼於資產價格的升跌，並花大量精力嘗試不停預測該資產將來的價格，「價格上升是貴，要沽售；價格下跌是便宜，要買進」，並不是一種正確去評估資產價值的概念。這就是富人与大眾散戶在思維上的分別。


    # 強化價值的手段


    有了「資本化現金流」的概念，便明白為何「先現金流，後價值，再價格」的邏輯。要提升資產的價值 / 價格，便要從現金流入手，這種方法稱為現金流強化（Yield
    enhancement)，又或是資產強化（Asset enhancement）。以投資鋪位為例，要知道鋪位的銀碼一般較大，資產流動性一般較低，鋪位的價值一般由其租金所支持，而鋪位租金的高低


    ![](img/28586c71c5408626f3973d2458a73d64_136_0.png)'
  merge: -1
  img_proc: true
- pgno: 137
  md: '非常重視租戶是甚麼行業：做甚麼生意和可負擔租金的能力。因此，同樣的鋪位，你租給一間文具店和租給一個品牌連鎖店是可以有很大分別，這也視乎該鋪位的條件，以及你如何打造這個鋪位去凸顯該鋪位的優勢。


    假如你自己本身是一個品牌零售商，有吸引人流的能力，你便能將一個人流不多的死舖帶旺，如果鋪位是自己的，便能成功做到Asset enhancement。更甚的，如果你們是一班「品牌新派飲食聯盟」，將一條人流不多的街舖帶旺，將租金（Yield）提升，便能成功推升鋪位的估值。估值高了，透過銀行融資便能夠將資產的增值部分（Unrealized
    profit）具現化為現金流 / 新資本，再投資買入其他資產，然後重複上述動作。這是筆者經常說的「產融結合」概念。


    ![](img/28586c71c5408626f3973d2458a73d64_137_0.png)'
