- pgno: 67
  md: '# 第三章：影響資產的祕訣


    沒有了解清楚何謂「金錢」。 「金錢」本身是虛無的，只是一種交易媒介（Medium of Exchange）, 「金錢」如果沒有資產背後支持，則甚麼都不是。


    要知道，目前全世界最大的貨幣系統「美元」，背後其實並沒有任何實質資產支持。以往的金本位制度已不存在，因此「美元」不應再稱作「美金」，它只是一種單純得到國際認可的交易媒介。背後支持「美元」不停大規模發行的其實只是信貸（Credit），再白一點說，是一種債務「美債」，亦即是說美元是根據「美元本位制」發行的，很可笑吧？而世界大部分貨幣都是以美元作為「錨」去支持其貨幣的發行，即全世界也在實行「美元本位制」，這不是霸權是甚麼？


    透過這個不平等的機制，美國更可突破傳統的國際收支平衡理論，以資本和金融帳（Capital and Financial Account）的順差來彌補經常帳（Current
    Account）的逆差，從而無限量地支持美國人多年來揮霍無度的消費。這種揮霍無度的消費模式，再加上金融海嘯後的多次量化寬鬆（QE），就如「染上毒癮」的癮君子，已不能逆轉頭。由此可知道「美債」對美國人來說是何等重要，因此很難相信美國會在「染上毒癮」的情況下持續或大幅加息，因為債務需要支付利息，而加息只會增加美國的財政負擔，令財赤問題更嚴重，試問新政府又如何減稅？加息只有一個邏輯：只有經濟增長和通脹才是長遠加息的理由／條件，加息幅度不可能高於通脹率，否則經濟會一沉不起。（關於美國加息的分析，詳見第七章。）


    聽完以上危言聳聽的論述，大家會開始清楚知道「金錢」的本質是虛無，而且對此資產遠會不斷貶值。因此，大家工作和投資的目的便需要更'
  merge: -1
  img_proc: true
- pgno: 68
  md: '正——工作和投資不是為了「賺錢」，而是「賺資產」。這是為何每個人都需要做好理財和資產配置，而並不是每天只僅盲目地去賺取虛無的「金錢」。


    # # 股票上升值得高興嗎？


    投資是為了「賺資產」而不是「賺錢」的概念相當重要。有了這個概念以後，你便不會再過分注重每天資產價格的波動，或每天看著股票機留意股價，反之，你只會關注所持有資產的質素有沒有改變，以及身邊有沒有更好的投資機會。因為當資產價格上升了，你不會純粹為了take
    profit（「賺錢（價）」）而去沽售手上資產，而是會考慮take profit後賺了的錢要配置到哪裡這個問題更重要的問題。最後，你便會真正明白到「更好的投資機會」才是take
    profit沽售資產的唯一動機／原因。


