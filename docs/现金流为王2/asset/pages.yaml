  md: '![](img/28586c71c5408626f3973d2458a73d64_56_0.png)


    # ### 2.5 浮息基金比高息債基可取


    不少讀者朋友都詢問應否投資「高收益債券基金」，筆者一向並不建議投資這類專為「吸引投資者投資的產品」。筆者不想「一竹篙打一船人」，只想指出該類型產品在結構上有以下一些問題，投資者在投資前宜先多了解。


    市面上大部分「高收益債券基金」均會定期（一般為每月）向基金投資者派發固定息率。驟眼看來，固定的現金流收益看似吸引，但世上沒有免費午餐，想享受固定息率，投資者其實要付出代價。最理想的情況當然是基金經理使用實際持有債券所產生的收入派息，但如基金息率固定，實際持有債券產生的息率低於基金承諾每月派發的固定息率，基金便被迫從資本中支付派息，令基金資產淨值下跌，意味基金經理用投資者原先的投資資本作股息。'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# 高息債基或賺息蝕價


    同時，因基金需要應付每月的派息予投資者，基金會預留一定比例的現金持倉，這會造成額外的成本。此外，基金的高收費（這也解釋了為何某些銀行並不意提供極低借貸利率予投資者，以「鼓勵」其增大投資金額，因銀行佣金收入更高）、不定期的資金流入和贖回也會造成額外的成本，而該等成本亦會間接轉嫁予投資者，影響基金的表現，出現「賺息蝕價」的情況。這為何「高收益債券基金」的總體收益表現往往遜於直債（Straight
    Bond）。


    由於債券基金沒有最終到期日（Final Maturity Day），投資者不應以投資債券的心態去投資債券基金。債券基金的好處是門檻低、風險分散、可槓桿操作、每月固定派息。然而，高息債基以高派息回報為招徠，為了抵銷上述結構帶來的高成本，同時又要提供較高的收益回報予投資者，高息債基一般都會通過高息債券配置帶來額外的孳息率和回報。高收益債券，說白了就是低評級或垃圾債券，這樣的配置也增加了本金的波動性和風險，降低了資本保值的要求，最後較高的債券違約率當然也會直接影響基金的表現。


    # 浮息基金 能調節利率變動


    浮動利率基金（簡稱浮息基金）則與市場上一般的「高收益債券基金」不同。首先，浮息基金的收益來自實質持有的應收利息，而利息為浮動性'
  merge: -1
  img_proc: true
- pgno: 58
  md: '質。因此，基金收益與市場利率基本同步。此外，浮息基金在結構上也相對穩健，這與其投資標有直接關係。


    浮息基金一般為投資於槓桿貸款相關債務資產的基金。已發展國家的貸款市場成熟，商業銀行等金融機構借貸予有需要企業進行資本重組、收購、再融資、重籌資本架構及槓桿收購等交易，而銀行借予企業的貸款多為浮動息率貸款，一般以同業拆息為基準。為降低資本成本，銀行會通過將企業的浮息貸款出售予投行或基金，將企業貸款「表外化」。然後，投行或基金將企業貸款證券化成浮息基金，出售予國際投資者。因此，浮息基金項下的資產實質為浮息貸款。


    在預期加息的環境下，又希望投資能產出穩定現金流的債務資產，筆者認為投資組合內應儘可能置換一些能對沖利率風險的資產，除浮息債券外，浮息基金也是一項比較可取的投資配置，達到分散投資風險的同時，又比高息債基更可取。浮息借貸的票息根據普遍市場認可的基本借貨利率（一般為三個月Libor），再加上一個固定息差（Fixed
    interest spread）而有所變動，並且定期重新調整，以反映目前的利率走勢。因此，與無法對任何利率走勢作出調整的固定利率債券或債券基金相比，利率走勢對這資產類別所造成的價格波動相對較低。


    # 具抵押品擔保 復原率較高


    基本上，浮息貸款沒有利率風險，風險主要為企業的違約風險。然而，浮息貸款多數為優先有抵押貸款，享有優先償還本金和利息，且有抵押品擔保，例如公司的廠房、設備、房地產，因此當公司違約時，浮息貸款的復原率相對較高。'
  merge: -1
  img_proc: true
- pgno: 59
  md: '![](img/28586c71c5408626f3973d2458a73d64_59_0.png)


    這類貸款的優先、有抵押地位，可為貸款方或投資者提供較高的信貸風險保障，儘管抵押品的價值不一定足夠抵銷所有應付債務，惟一旦企業違約事件發生，抵押品可被即時出售來償還貸款，使浮息貸款／基金的復原率大大提高，投資者的資本也有更大的保障。


    除此之外，浮息基金下的大部分槓桿貸款普遍均有「財務狀況條款」（Financial covenants），借貸企業必須達到或維持這些財務狀況條款，而貸款機構亦會對借貸企業進行動態監察，因此借貸企業的負債比率一般受到限制，保障貸款機構的同時，也保障了基金投資者。


    在風高浪急的市場下，投資者宜因應動態的市場情況，調整投資策略，在繼續追求穩健現金流收益的前提下，重新部署投資雪球的移動方向，優化組合結構和動態投資運作。


