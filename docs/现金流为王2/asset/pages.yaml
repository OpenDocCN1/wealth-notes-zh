  md: '# # 「貪心」與「知足」的藝術


    《現金流為王》出版後，一直收到不少讀者的問題，比較常見是「現在美國已進入加息周期，債券和REITs 都是對息口敏感的投資產品，現在才入市是否已經水尾？」、「在進行REITs
    + Bond 投資時應該用多少槓桿？」等。


    看到這些問題，令筆者感覺到部分讀者都將焦點放在「招式」上，因為大家都希望從書中得到即時的「成效」，急急腳要抓緊時間投資，部分讀者甚至只希望筆者提供一個最佳的投資平台和提供自己的portfolio，讓其可以即時複製，然後便大功告成。當然筆者並不會答應，如果投資是這樣簡單，筆者根本用不著花時間和心機，用不同的層次和角度去講解組合設定背後的理念，倒不如直接將自己的portfolio資訊和各個投資平台資料清楚寫出來，然後在博客定時更新就可以了。投資是一門學問，同時也是一門藝術，「招式」（投資工具）需要配合「心'
  merge: -1
  img_proc: true
- pgno: 119
  md: '法]，並不是如此簡單。只學「招式」或「照抄」去學投資，還要使用槓桿，風險相當高。


    前文提到一個重要的概念：「財務自由」最重要的元素並不單單請求今天的被動收入的多與少，更重要是被動收入的**可持續性**和**增長能力**。即使你今天的每月被動收入數字達六位數甚至七位數，如果不能持續或不能增長，也是沒有意義的。


    # 運用槓桿前的三件事


    為了使投資組合的現金流具有長時間的可持續性和增長能力，關鍵便是要做好資產配置，如在投資組合中使用槓桿（如筆者REITs+Bond投資），更需要有收放自如的能力。在投資使用槓桿前，必先要清楚何謂槓桿和明白槓桿的意義。槓桿是利用不屬於自己本身的資金（如借貸的資金）去作出投資，使總投資額增加，總投資額除以自己本身的資金（Equity）是為槓桿的倍數。由此可見，槓桿是一面放大鏡，放大回報的同時也放大了風險。清楚何謂槓桿後，便要明白槓桿的意義，即為何要槓桿投資？


    槓桿投資操作簡單而言就是「套取利差」——項目回報率和借貸資金成本之差。槓桿投資操作成立的前提是項目回報率必須要大於借貸資金成本。如果利差不存在或具有不確定性，那就根本沒有使用槓桿的理由。因此，在運用槓桿前，必先要確定三件事：'
  merge: -1
  img_proc: true
- pgno: 120
  md: '+   1. 利差要有一定的空間；

    2. 利差要有穩定性和可持續性；

    3. 資產價格具良好穩定性。


    如果以上三點都能同時滿足，則任何時候都應該利用槓桿增加回報率。然而，要滿足條件 1 不難，但同時要滿足 2 和 3 便並不容易。不要忘記，投資是長途賽，我們投資的目的是長期產生穩定現金流，並不是今天財務自由，明天突然打回原狀，後天又再次回復財務自由，這樣一點意義也沒有。因此，既然條件
    1 至 3 不容易同時滿足，筆者給結論是槓桿的操作是不能長遠的。槓桿雖能夠使組合的回報增加，但同時會令組合長遠存在不確定性，凡投資組合使用槓桿，都必須要有自我優化（隨時間自動去槓桿和分散投資）的能力，這一點才是整套投資理論的核心關鍵。


    「REITs ＋Bond」投資組合只是「招式」，不是沒有替代品，最重要的是其背後的理念。不同投資者都會有不同的投資／風險喜好，有些投資者可能會以優質高息股／價值股替代
    REITs，有些會以其他固定收益投資替代債券。


    # 加息需要恐懼嗎？


    至於大多數人關心美國進入加息周期的問題，簡單而言，大家要明白利率正常化和進入加息周期的分別。利率上升是短息上升，還是長債息升？大家應該要留意長短債的息差（Yield
    spread），目前息差正在收窄，是十數年來最窄，這正反映了這是利率正常化的過程而不是真'
  merge: -1
  img_proc: true
- pgno: 121
  md: '正進入加息周期。若然趨勢持續，市場如出現孳息曲線倒掛（Inverted Yield Curve）的情況（即短債息高於長債息），這反映美國經濟可能開始陷入衰退（Recension）。加息周期下，加息目的是控制因經濟過熱帶來的通脹升溫，衰退的情況下又何來加息的需要？若然經濟轉好，又何懼加息？這就是加息的邏輯，切忌人云亦云，要有自己的獨立思考判斷。


    在利率正常化的過程中，利率短期內有機會上升，投資債券要選短期債券，價格波動性較低。債券價格自2017年急升，債券的息差已經低得可憐，整體回報要求需要不停降低，若不自我調整回報要求的話，就是以風險換取高回報，這是市場大家都瘋狂在做的事情，也解釋了為何近期的高息債被搶高至如斯田地。


    從來，真正最佳、最安全的賺錢時機，應該是在市場恐慌時的跌市時間。投資者應該將關注點放在研究如何在風和日麗的時間養兵，同時累積和保存實力，在「恐慌時間」進攻。筆者只能說，目前市場不是投資者應該「貪心」的時間。早五至六年前，筆者也非常貪心，現在愈來愈「知足」，同時等待「貪心時機」的再次來臨。記得當年，市場第一次發iBond，香港不多人明白債券，機構又不能大手一手買入，絕對是時機。懂得債券的人會以無風險利率去比較，便知套利空間有多少。這是市場的asymmetric
    information/market ignorance，可以盡情進取，抽他30幾手，再用97% LTV槓盡也能安睡。應該貪心的時間應該使用槓桿，盡情貪心；應該知足的時間應該養兵保存實力，採最低槓桿／去槓桿策略。


    以上講很容易，做很難。試問要定一套完整的投資策略談何容易？如果有初哥以為自己學會一些招式便進取，風險相當高。大家請謹記。


