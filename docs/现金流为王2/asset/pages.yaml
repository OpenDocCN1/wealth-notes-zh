  md: '# 產融結合釋放資產流動性


    既然流動性有價，而大部分房地產均為「重資產」，流動性偏低，只要我們能夠盤活資產的流動性，便能主動為資產創造價值、提升資產的價值和價格。


    價格只是價值體現的其中一種形式。資產價值（估值）的提升，不一定體現於資產價格，也可透過產融結合，利用融資釋放資產流動性，令升值部分轉化為現金流，讓現金流成為新資本，再投資其他資產，然後再產生新增的現金流收益。新增的現金流收益便是價值體現的另一種形式。


    為了能隨時隨地運用槓桿，盤活資產的流動性，有效發揮資產「槓桿選擇權」的價值，我們必須要有多個「融資平台」。至於運用槓桿的時機、比例和技巧則是一門藝術。能否在對的時機有條件適當運用槓桿進行投資，除了取決於你投資的資產本身是否有槓桿空間，更重要是你是否擁有合適的「融資平台」。


    # 自己就是一個融資平台


    其實每個人自己都是一個「融資平台」，只要闔下未曾宣布過破產，則每個人本身都有融資能力。例如，未畢業的大學生都可以申請信用卡，而信用卡都有一個信用額，信用額一般有數萬元，這個數萬元的信用額也就是你個人的融資能力。至於一般在職人士或專業人士的信用額則由數萬到數十萬元不等；高資產淨值人士的信用額甚至高達過百萬元。


    ![](img/28586c71c5408626f3973d2458a73d64_105_0.png)'
  merge: -1
  img_proc: true
- pgno: 106
  md: '首先，筆者不是鼓勵大家「碣卡」消費。相反，筆者希望在此提醒大家，槓桿從來都有成本。信用卡借貸的成本非常高，而消費是沒有回報的行為，如果透過借貸去消費，先使未來錢，實屬不智。信用卡的發明是為了促進消費者去消費，對象不是投資者。如果有人告訴你「碣卡」借錢去投資，他不是騙你便是推你去死。即使訪問一些類似私人貸款性質的「信用卡貸款」，由於年期短，期間每月償還本金比例高，投資者容易墮入現金流錯配（Cash
    flow mismatching）的問題。


    從來只有用於投資時，才會考慮借貸，但即使如此，借貸成本亦不宜過高。透過借貸去投資，實際上是一種「套息差」（可理解為「回報率差」，即投資回報率與融資利率的差距）的行為。換言之，投資收益必須高於借貸成本才化算。


    如果借貸成本過高，投資者對於投資收益的要求也必然更高，而投資回報高的項目也可能伴隨著高風險。風險是一種變數，計及風險因素後的預期投資回報也自然存在較大的變數，而風險愈高變數愈大，預期投資回報的變數便愈大，但借貸成本卻是固定。因此，儘管投資項目存在「息差」，即所謂「計到數」，借貸成本過高亦不宜進行槓桿操作，否則風險相當高。因此，信用卡不是一個良好有效的「融資平台」。


    ![](img/28586c71c5408626f3973d2458a73d64_106_0.png)'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 投資需要「不記名」融資平台


    舉信用卡的例子是想說明任何一個人都擁有信貸額，亦即是個人的融資能力。而香港的金融機構在決定是否借錢給你之前，會先審查你的信貸紀錄，包括審查你的環聯信貸報告
    (TransUnion，簡稱TU)，而每一個借過錢的人，理論上都有一份TU。當你申請貸款時（例如樓宇按揭或汽車貸款，甚至是新信用卡），銀行或財務機構會參考你的TU內的信貸評分，以評估你個人的「財務誠信」和了解你的借貸情況，包括你的信用卡借貸、私人貸款、按揭、車會等所有借貸項目均一目了然。在金管局嚴格收緊信貸的今天，過度信貸的情況相信難再出現。


    除了個人TU，個人借貸能力主要取決於個人的入息水平。在金管局收緊信貸下，入息供款比率的壓力測試十分嚴緊。年青人要買樓上車，前題是對先搞好自己的信貸記錄和提升自己借貸能力。


    對於已買樓人士，在現今世代想靠靠不斷買樓，然後以一折二、二折四的傳統方式致富已不可能，原因是政府推出的辣招稅和金管局對非首置的信貸收緊。投資，我們需要尋找「不記名」（不記錄在TU）、沒有壓力測試的「融資平台」，為我們的投資更有效地釋放流動性。想獲得槓桿的選擇權，又要控制使用槓桿時的借貸成本，我們必須準備多個不同的融資平台。


    第四章：槓桿的應用與技巧


    ![](img/28586c71c5408626f3973d2458a73d64_107_0.png)'
  merge: -1
  img_proc: true
- pgno: 108
  md: '![](img/28586c71c5408626f3973d2458a73d64_108_0.png)


    # 4.4 實戰需要的融資平台


    要突破每一個財富階段的財富極限，我們必須因應自己不同的財富水平，應用不同的投資方式，提升自己的投資層次。不同的投資層次有不同的門檻要求，當你滿足到門檻要求，投資者一定要勇於跨開去，改變從前的投資思維。財富十萬是一個層次，一百萬是另一個層次，一千萬又是另一個層次，三種不同的財富階段不可能運用同一種投資策略和方式。


    當財富累積到一定水平，我們必須擁有不同的「融資平台」，幫助我們實現不同的投資策略。不要少看「融資平台」的價值，這決定了你的財富終點是百萬、千萬甚至更多。以下為大家介紹一下不同財富層次所需的實戰「融資平台」及其操作。


    ![](img/28586c71c5408626f3973d2458a73d64_108_1.png)'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 盈透證券（Interactive Broker，IB）


    對於一般大眾投資者，筆者建議大家可以先開一個盈透證券戶口，開戶口基本上沒有門檻，存入數萬港元便可開戶。盈透證券是一個自動化的證券戶口，可供交易的產品種類眾多，交易覆蓋全球24個國家共100多個市場中心。通過一個IB全能賬戶，即可進入股票、期權、期貨、外匯、債券、交易所指數基金（ETF）及差價合約（CFD）的交易。


    其最大優勢在於融資利率超低，主流貨幣歐元、美元、日元，也只要1%多一點的年化利息。不管你買的是甚麼股票，不管你借的是甚麼貨幣，都可以外匯操作換成利率超低的貨幣，以便投資者以最低的融資成本進行槓桿投資。


    操作方面，在盈透證券買入股票，如果本幣不足就會自動融資，融資額會變成負債，這些負債按照當天盈透證券的利率來計算，按天計息，一月一結算，也是一個月的利息滾存到總負債裏面，自動展期，相當方便。


    盈透證券另一個優勢是交易手續費便宜，每股只需0.005美元。唯一缺點是它比較少亞洲區的證券選擇，例如內房債券就未能在盈透買入。


    # 私人銀行（Private Bank）


    私人銀行是一個高門檻、但非常有用的個人融資平台。對大部分私銀客戶來說，私人銀行是一個高級理財平台，原因是私人銀行提供360度多元化、多功能的理財服務。


    ![](img/28586c71c5408626f3973d2458a73d64_109_0.png)'
  merge: -1
  img_proc: true
- pgno: 110
  md: '然而，筆者卻將私人銀行定位為融資平台，原因是其最大功能之一（對筆者而言）是其低廉的融資成本，一般為資金成本（Cost of Fund，COF）+1%左右，all-in
    融資利率則低至大約 1.X% 左右，比銀行按揭利率更低。每間銀行的 COF 也不同，一般與同業拆息（Hibor/Libor）差不多或略高。投資者一般可選擇低至七天、高至一年的利息期，當然在正常情況下，愈短利息期利率愈低，反之亦然。


    私人銀行這個融資平台非常靈活，對大部分常規證券如股票、債券、基金等，會因應其特定的「融資率」（LTV）提供額資額度。舉例，假如你持有 100 萬元債券，而該債券的
    LTV 為 70%，這意味著你可以隨時以 1.X% 的融資成本提款 70 萬元，用於再投資或套現作其他用途。這貸款額是備用的，使用才會計息，償還後就不計息，而由於債券的收益是每天計息的，因此槓桿投資債券是比較匹配的套息組合。


    相對於一般銀行及證券行，私人銀行的交易手續費較高，一般為 0.3 至 0.5%。因此，投資者可考慮從其他證券行買入債券或股票，然後轉倉去私人銀行戶口（俗稱「射倉」），省卻交易成本。私人銀行是一個綜合的證券戶口，所有存入私銀戶口的證券，只要有
    LTV，都可以隨時提取低息貸款。這優勢為整個投資組合提供了極佳的備用流動性，創造了進一步提高收益的條件。


    私人銀行的另一個優勢，是其包羅萬有的投資產品選擇，而有相當一部分是一般零售銀行沒有的。此外，私銀更能因應客戶的要求度身訂造投資方案，有些專業的投資者客戶更會主動向私銀提出投資方案，私銀往往都能配合，彈性相當高。'
  merge: -1
  img_proc: true
- pgno: 111
  md: '例如，債券投資客戶為了鎖定利率風險，向私銀買入利率掉期（Interest rate swap）。由於利率掉期需要交易對手，如市場沒有合適的交易對手，私銀會自己「坐盤」，為客戶提供配對特定債券組合的利率掉期產品。無論到期日、金額及利率等都能做到完全匹配，讓利率風險得以成功對沖。私銀更能为客戶提升整個投資組合的LTV，非常靈活。


    # 投資貸款（Investment Loan）


    香港不少人喜歡投資住宅物業等重資產，貪其能夠承造長年期供的按揭。但隨著政策和按揭成數收緊，加上租金回報率已下跌至較低水平，住宅物業的投資吸引力開始下降。物業升值，想套現再另覓投資，增加被動收入，傳統方法是將物業加按或轉按予另一間銀行。然而，受按揭成數的限制，投資性質的收租物業最高只能做五成按揭，加上借款人及擔保人需要做壓力測試，令個人的借貸力收到限制，想利用銀行按揭的低成本低金去投資高回報項目，似乎已不容易。


    由於金管局重點限制的是銀行的個人按揭業務，因此要避開按揭的限制借款，方法是公司以公司名義向銀行申請貸款。如目的是將物業升值的部分套現並用於投資其他資產，包括債券、房託基金、高息股等，以增加現金流投資收入，可申請投資貸款。要以公司名義申請投資貸款，當然首先要有
    一間公司。一般而言，針對投資貸款的申請，銀行並不要求申請人必須是一間成熟的營運公司，可以是一間全新的公司，亦無須公司財務報表，但會要求遞交一份簡單的業務計劃書，內容包括公司的業務性質、營運計劃等。


    ![](img/28586c71c5408626f3973d2458a73d64_111_0.png)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '由於投資貸款有抵押品，銀行對公司的要求不高。只要公司有營運的計劃，已符合基本要求，至於公司業務是否成功、財務是否健康等，基本上並非主要的審批考慮，也無須進行負擔力測試，更重要的是相關貸款並不會紀錄在
    TU。


    投資貸款的融資成數最高可做到物業估值的八成（比一般人能夠申請到的五成按揭高出三成），包括住宅、工廈及商用物業等資產，惟套現出來的資金只可在該銀行內進行投資。申請人也可以選擇先做五成按揭，然後才申請投資貸款，將餘下的三成也借出，用於投資穩健的債券或房託等類固定收益回報資產套取息差，增加每月的被動現金流收入。此外，通過投資貸款，亦能增加組合的流動資產水平，有助進入私人銀行的門檻。


    # 商業貸款（Commercial Loan）


    商業貸款與投資貸款都是以公司名義借款，惟商業貸款的要求較高。商業貸款的借款用途為營運資金貸款（Working capital loan），因此申請公司需要為營運公司，並需要遞交公司的審計財務報表。


    與投資貸款一樣，由於商業貸款有抵押品，銀行對公司的財務實力要求不高，一般銀行只會審視公司的營業額（Turnover），對利潤要求並不高，但最好不要虧損。貸款額最高可做到物業估值的八至九成，惟基於貸款性質是公司營運資金貸款，貸款額一般不能高於公司營業額的五至七成。


    ![](img/28586c71c5408626f3973d2458a73d64_112_0.png)'
  merge: -1
  img_proc: true
- pgno: 113
  md: '商業貸款最大的優勢，在於所借的資金可以較自由地運用，無須被限制在貸款銀行內進行投資。而且，貸款一般為循環貸款 (Revolving loan)，貸款期內只需還息，無須還本，貸款可以較彈性地使用，用才計息，償還後便不會再產生利息。因此，商業貸款能為申請人提供非常靈活且低成本的備用流動性。


    最有利申請商業貸款的公司是貿易性質的公司，因為貿易公司的營業額一般比較容易做大，儘管利潤較薄，但銀行審批商業貸款一般只關注公司的營業額，利潤能負擔到利息支出就可以。這是為何在筆者的眾多生意中，最看重就是貿易業務。除自己經營的貿易業務外，也會與其他貿易伙伴合作，更會主動收購別人做得不好、打算放棄的貿易公司。因為擁有龐大營業額的貿易公司，就是一個絕佳的「融資平台」，貿易公司最大的價值並非其本身的利潤多少，而是其融資能力。


    筆者公司的主力業務為投資房地產相關項目，儘管房地產項目回報高，但房地產最大的短處是重資產，缺乏高流動性，必須配合「產融結合」的手段才能將升值的房地產轉化為現金流，在無須出售資產的同時能夠套現進利「再投資」，實現長期累積資產的目的。'
