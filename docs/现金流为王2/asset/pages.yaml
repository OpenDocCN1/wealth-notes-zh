  md: '![](img/28586c71c5408626f3973d2458a73d64_168_0.png)


    # 貿易戰下

    中國債市的隱憂


    近日，市場最關注的問題相信離不開中美貿易戰。美國以與中國之間國際貿易長期處於龐大逆差為由，向總額340億美元中國進口貨徵收25%關稅，而後續的徵稅或使涉及商品總額超過5,000億美元，即基本上相當於2017年美國從中國的進口額。而事實上，是甚麼造成貿易逆差？而貿易逆差對一個國家而言是否有這樣的迫切性，要使用這樣強硬的行政措施去禁止？確實值得商榷。


    首先，美國貿易逆差的根本原因，在於美國「高消費、低儲蓄」的經濟結構，而美國逆差問題不是中美貿易特有，目前美國對全球貿易普遍都存在逆差。或者應該這樣說：美國企業為追求利潤最大化，在全球尋求廉價勞動力和低成生产成本地，轉移低端製造業去發展中國家，同時把研發中心和高端製造'
