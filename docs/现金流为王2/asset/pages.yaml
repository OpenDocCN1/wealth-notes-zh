    # ### 3.3

    投資「有效資產」

    的心態與考慮


    從「REITs＋Bond」投資組合的例子中，我們可以看到債券其實只是一個會產生現金流的「工具資產」（有效資產的一種），本身並沒有資本增值的作用，因此債券並非長遠值得累積的資產。


    對於投資「工具資產」如債券，投資者的目的必須十分清晰，就是要安全、穩健地賺取它的高現金流回報，取其風險低、高現金流回報的好處。因此，筆者認為投資債券一定要持有至到期的心理準備，不論你使用槓桿與否，總之投資者必須設定自己有能力持有債券至到期日取回本金，這是rule
    1。'
