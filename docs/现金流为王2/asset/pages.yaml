  md: '直接存入銀行或者購買國債算了，無需投入龐大的資本，辛苦經營，而只為換取較低的利潤。簡而言之，這是機會成本（Opportunity cost）的概念。


    因此，假設利潤相若，從資本密集性（Capital intensity）的角度，輕資產比重資產模式更有效率，原因是前者能以較少的資本投入換取相同的利潤回報。這是為何輕資產模式的企業在資本市場上較「值錢」，這同時也含蓄著輕資產企業的潛在增長能力更高，因為它的成長並不全純依靠資本投入，而主要是依賴非資本投入的經濟價值創造能力，這也就是營運模式本身的價值。


    作為資本家，除了企業營運團隊的營運能力，更關注的其實應該是企業的商業營運模式，因為這決定了一項投資的資本回報率。要極大化資本回報率，就是要在最短的時間內，以最少的資本賺取最高的回報，這也就是資本運作的真諦。


    同樣道理也可應用在個人投資。從資產配置的角度，也可分為輕資產和重資產的投資模式。重資產指資本密集、回報率和流動性偏低的投資物。所有資產都有「重量」，愈「重」的資產，就愈難轉身，意味著其流動性偏低，同時其現金流回報（Investment
    yieild）普遍也偏低。長時間累積重資產，最終會使投資組合的重量不斷增加，形成現金流黑洞，將資本和現金流都吸收，最終形成「死亡鏈結」（Hardcore），使投資齒輪停止轉動。這是大部分只會買樓收租的香港人面對的問題。隨著政府辣招和按揭成數的收緊，只懂買樓的投資者最終會陷入重資產的hardcore，而原因是他們根本沒有做好資產配置。


