  md: '![](img/28586c71c5408626f3973d2458a73d64_61_0.png)


    「現金流為王」是一種投資理念，事實上「REITs+Bond」組合正是體現著同一種理念——1、投資收益以現金流體現；2、收益持續穩定中帶增長。從單一投資的角度，「持續穩定」與「增長」往往是魚與熊掌，要兼得，不能依靠單一的投資工具，筆者多次強調REITs和債券只是眾多投資產品中的選擇，並不是唯一，投資者需要因應個人的情况和市場的變化去挑選最適合自己的投資工具。大家要明臼，REITs
    與 Bond 其實各自代表著不同種類的收益，前者是穩定收益，後者是固定收益。例子如下：


    穩定收益產品：高息股、封閉型基金、REITS、商業信託（Business trust）、業主有限合夥（MLP）等。


    固定收益產品：公司債券、交易所交易債券、優先股（或稱為特別股）等。


    固定收益投資（Fixed-income investments）能提供持續穩定的現金流，在組合中扮演著十分重要的角色。不少投資者在組合配置固定收益資產時，往往遇到一個難題——投資門檻高。傳統公司債券的入場門檻為十到二十萬美金，而且一般人（非專業投資者）只能購買投資級別的債券。面對高門檻，投資者不容易入場，即使能入場，亦不容易做到分散風險，從資產配置的角度上是一個負擔。事實上，固定收益投資除了大家較為熟悉的定存和傳統債券，市場上還有其他選擇，當中包括交易所買賣債券（Exchange-Traded
    Debits, ETD）和優先股（Preferred stocks）。


    ![](img/28586c71c5408626f3973d2458a73d64_61_1.png)'
