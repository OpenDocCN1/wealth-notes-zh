    傳統經濟學認為 V 和 Q 一般在短期的變化不大，可視為 constant，因此當實施量化寬鬆，銀紙不斷增發，M 的增長率會上升，在 V 和 Q 不變的情況下，P
    的增長率必然會上升，因此大家都很怕惡性通膨的來臨，亦做定了加息對抗通膨的心理準備，認為不久將來進入加息週期是必然的事。然而，事隔多年後的今時今日，我們所見到的情況並非如此——錢印了許多，惡性通膨卻沒有到來。


    原因是 V 和 Q 並非永恆不變。以目前世界宏觀經濟情況為例，產能過剩的情況嚴重，令 Q 處高水準，未能有效消化，因此過往幾年 Q 一直在上升軌中，而並非不變。而更重要的是，海嘯後全球信貸收縮，V
    相比以前大幅下降。根據 MV = PQ 的公式，V 的下降實際上抵銷了 M 的上升，加上 Q 上升，因此 P（普遍物價，並不代表資產價格）很難會上升。在低'
