  md: '# 中國的「明斯基時刻」來臨？


    內地經濟學家賀江兵引用已故美國經濟學家海曼．明斯基（Hyman Minsky）提出的「明斯基時刻（Minsky Moment）」，來形容目前中國經濟面對的問題。該理論指出，一個國家在長期的經濟繁榮中，資產價格上升，人們對資產價格產生了上升預期，當市場資產價格普遍反映了升值預期，這反映了資產價格其實已透支了未來的經濟增長因素。為了追逐不斷升值的資產，人們開始透過借貸去購買資產，這進一步實現了市場對資產升值的預期。資產升值產生的財富效應，加上金融機構包括銀行和影子銀行的再融資，使資產升值部分有效地轉化為新增的購買力。當市場的需求主要來自升值預期下的投機需求，而購買力主要來自融資借貸，與此同時一個國家的經濟去到一個較為成熟的槓頭，經濟增長開始放緩，經濟增長遠落後於已透支未來經濟增長因素的資產價格，資產泡沫便開始形成。


    事實上，在中國成為「強國」的近十多年來，中國的經濟增長並不是穩定增長，而是比較大上大落。中國的國民生產總值（GDP）由高峯期每年增長超過10%以上，除了金融海嘯時中央放水四萬億（人民幣，下同）救市令GDP增長短暫反彈回升，GDP增長（當中也可能含有不少水份）一直下跌，因此事實上中國的經濟基本面，特別是內需，並非如大家想像中強。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 房地產泡沫與內債危機


    中國建行董事長田國立估算中國目前的房地產價值總達 400 萬億元，是一個天文數字。中央當然也知道內房市場存在的泡沫問題，而對付泡沫問題最有效徹底的解決方法就是讓它爆破。然而，房地產市場是中國經濟增長的火車頭，股市是二號列車，在現時股市不會好到哪裏去的情況下，如果
    400 萬億的房地產市場爆破，對中國的經濟將會造成非常沉重的打擊。因此，中央近年的主調是「去槓桿」，減低泡沫真的要爆破時對市場造成的影響。現時，中國的房地產泡沫也開始有破裂的跡象，2017
    年北京房價已明顯出現下調，特別是二手房，價格由高位下跌幅度達 20%。


    ![](img/28586c71c5408626f3973d2458a73d64_171_0.png)'
  merge: -1
  img_proc: true
- pgno: 172
  md: '為免「去槓桿」會刺破泡沫，影響經濟增長，人民銀行今年以來已經第四次實施降準，累計降準幅度達3至4%，總放水規模已達2.5萬億元，支持高負債企業「債轉股」項目和小微企業融資，儘量針對性維持寬鬆的貨幣政策。中央所做的都是「緩衝式去槓桿」政策。


    除房地產泡沫以外，中國另一大危機是內債問題。雖然中國國債（中國政府發行的債券）僅為十萬億元；相比其他主要經濟大國不算高水平。然而，根據人民銀行公佈的資產負債表顯示，截至2016年底，中國內債竟高達244萬億元，當中主要是家庭和企業債務。相比中國僅約75萬億元的GDP，中國的總負債比率高達350%。在經濟學上，一個國家的負債比率接近200%已是警戒線，而中國目前的內債水平已超過警戒線1.75倍。


    2018年以來，國內的債券違約問題嚴重，不論是地方政府、上市公司、民間企業、甚至中大型國企均存在債務和流動性的問題，當中尤以內房企業的問題最為嚴重。中央「去槓桿」的意志十分堅定，自2017年底再次限制內地房地產企業於內地發債融資，因此有不少內房公司、國企急急來港進行境外發債。


    # 「偽擔保」與「偽國企」


