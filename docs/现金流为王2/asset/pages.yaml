- pgno: 115
  md: '# 資產配置 對沖市場風險


    要加強被動收入的可持續性和增長能力，關鍵就是資產配置。只有做好資產配置，才能在逆市的情況下經得起考驗，才能有效對沖市場系統性風險。股神巴菲特有一句名言：「潮退後便知誰沒穿泳褲」。要知道，作為一般投資者的我們，並不能像對沖基金一樣能主動造短倉對沖風險，既然如此，我們只能專注做好投資組合裏的資產配置。


    要令被動收入可持續，投資組合最終不能大幅使用槓桿，意思是說槓桿投資只是一個開始，前題是你要找到一條長斜坡，然後用一根棍子，令你能利用較少的力量（資本）去挑起較重的石頭（大額投資和回報）。


    ![](img/28586c71c5408626f3973d2458a73d64_115_0.png)


    第四篇：禪神的投資方法與理念


    117'
  merge: -1
  img_proc: true
- pgno: 116
  md: '推動石頭在長斜坡向下開始滾動。當投資組合產生「動能」（現金流）後，依靠的就不再是那一根幫你挑起大石的槓子（槓桿），因為你不再需要主動利用槓桿去幫助石頭加速，而是需要令石頭滾得穩定，on
    the right track，令石頭得以持續地滾動。因此，對投資組合而言，再投資和資產配置才是關鍵，純粹去追求單項投資的槓桿後回報是虛無的，因為用槓桿去提升的回報率，並不是有效可持續的真實回報率。


    以筆者的「REITs+Bond」組合為例，以槓桿買入債券，再利用債券產生出來的高回報現金流再投資REITs，事實上就是以槓桿提升暫時性的高回報現金流，並以此作再投資和資產配置。這個過程之中，投資組合正不停「去槓桿」和分散風險，令組合能不停自我優化。“Leveraging
    today is to achieve deleveraging tomorrow”簡單的一句話說，實在形容得再貼切不過。


    良好的資產配置，能產生可持續並穩定增長的被動收入，箇中的關鍵便是現金流。只有不停產生的現金流，才能長期賦予你充足的子彈，不停作出再投資行為，而只有再投資才能令你的投資組合風險有效分散，而只有分散風險，才能在不主動造短倉的情況下仍能有效降低市場的系統性風險。'
