- pgno: 155
  md: '# 知己知彼 掌握心理


    一向隨身帶備支票的筆者當然早有準備，一面見二話不說單刀直入談條件，每月23萬租15年（比美心原來的租金還高，而之前的租約是12年），隨即準備好支票。業主一聽到15年便說太長了，不可能！筆者為不讓他有太多時間考慮，速戰速決：立即開另一張支票遞向他：「24萬一個月，十年約。」業主聽到後，表情開始有點軟化，但仍搖頭晃腦說十年太長了，卻一邊伸手接過支票，明顯是難抵金錢的誘惑。支票是三按一上（按金加上期）合共96萬，準備充足的經紀同事早已在旁準備好臨時合約，即時簽署成交。就這樣，這一宗十年租約的deal僅用了20分鐘便完成了。一步出大門口，落到樓下，同事即問時間我為何這麼有信心，大拿拿廿幾萬一個月，你不用先回公司計計劃？我說不用，我心裏有數。


    青山道與大南西街交界人流極旺，原來的美心餐廳佔地約8,000呎，包括了座位及廚房，但門口僅在青山道的一小角，其他對外全部密封。筆者一直認為若將青山道一排非結構牆身全部打開，將之變成數個小街鋪，其價值和租金定必大大提升，而將工業地廠改為街鋪，只需向地政總署申請短期豁免書（Short-term
    Waiver）即可，每月僅需按改變用途單位的地面面積（Floor area）補回差價費用，然而工業變成零售街鋪的價值提升，以建築面積計算遠比只按地面面積補價的費用高，從而能做到強化資產（Asset
    Enhancement），從而提升租金（Yield Enhancement）的效果。


    ![](img/28586c71c5408626f3973d2458a73d64_155_0.png)'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 現金流算盤 空手入白刃


    不足兩個月，筆者分開的六間街鋪已全部租出，每月淨租金已超過30萬，已完全覆蓋每月24萬的租金支出，同時後面的三個食肆鋪位是淨賺的了，這段時間已不乏多間大型連鎖品牌食肆有興趣，如翠X、大XX、吉XX等，預計租金25至30萬。該地廠項目的總租金收入預計約60萬，短時間內已翻了1.5倍，每月淨現金流收益可達36萬。


    該地廠項目的投資成本，主要為改建的工程費用約150萬，當然也不是一次過支付。對於以現金流為王的筆者，計數也是算得很盡的，由於項目分開後的租金水平比原先的租金水平上升了1.5倍，所收的按金也就上升了1.5倍，以三按一上計算，筆者合共能收回240萬按金及上期，扣除支付予大業主的96萬按金及上期，正現金流為144萬，足夠支付工程費用所需。因此，本項目近乎是空手入白刃。


    對於該項目淨賺回來的4,000呎食肆鋪位，本來大可直接租出收租，但多日來反覆考慮，反正該食肆面積是淨賺回來的，筆者希望可以自己搞一個food court。荔枝角本身食肆供應極度稀缺，而該區是一個即將變天的商業區，加上項目本身位置好，因此筆者希望藉此機會建立一個屬於自己的food
    court品牌，以匯聚一班品牌食肆，以作為日後強化資產的一種利器 / 工具。


    ![](img/28586c71c5408626f3973d2458a73d64_156_0.png)'
  merge: -1
  img_proc: true
- pgno: 157
  md: '當擁有自己的品牌，就等同擁有一項強化資產的利器，可應用至不同的地產項目，有助日後收購其他地廠／物業／舖位後，主動提升租值，做到強化資產，從而提升租值，然後是估值（Valuation）的提升，最後是資產價格的體現。


    可參考前文：


    > 「假如你自己本身是一個品牌零售商，有吸引人流的能力，你便能將一個人流不多的死舖帶旺，如果舖位是自己的，便能成功做到Asset Enhancement。更甚的，如果你們是一班「品牌新派飲食聯盟」，將一條人流不多的街舖帶旺，將租金（Yield）提升，便能成功推升舖位的估值。估值高了，銀行融資能夠將資產的增值部分（Unrealized
    profit）具現化為現金流／新資本，再投資買入其他資產，然後重覆上述動作。這是筆者經常說的「產融結合」概念。」


    ![](img/28586c71c5408626f3973d2458a73d64_157_0.png)


