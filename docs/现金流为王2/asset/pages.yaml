  md: '蚊資產的投資方式只會永遠落後於大市。在有門檻的投資市場上，更甚的情況是，你持有現金，但在市場上最終甚麼也買不到。道理有如你要full pay買樓，你所能買到的物業選擇自然大幅減少，到最後你會發現很難買到心目中的物業，原因是當其他市場參與者（你的對手）都在使用槓桿買入物業，物業價格自然被推高。當然，大部分不使用槓桿的人會希望這是一場泡沫，期望泡沫爆破後資產價格終有一日回落，但若然這不是一場泡沫呢？你便會輸掉一輩子。從這角度看，missing
    out的風險可不低。


    因此，我們不應懼怕槓桿所帶來的風險，而是要去認識槓桿的潛在風險，想辦法將風險歸邊，再進行對沖，或是透過資產配置平衡相關風險。真正善於運用槓桿的人，是懂得以「去槓桿」（Deleveraging）為目標。


