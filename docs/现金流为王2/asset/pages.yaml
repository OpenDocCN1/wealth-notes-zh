  md: '# **美國聯邦基金圖表 FEDERAL FUNDS CHART**


    ![](img/28586c71c5408626f3973d2458a73d64_191_0.png)


    承上文，自2015年起，美聯儲每一次「加息」實際上主要是提升額外存款準備金利率（IOER）以達到表面「加息」的效果。IOER是金融海嘯的新產物，為吸引聯邦銀行將多餘的超額儲備存入聯儲局的儲備戶口，IOER會高於FFR，而銀行們亦會因為存款於聯儲局是零風險，且收益更高，都會傾向將額外儲備存入聯儲局。因此，理論上IOER應為「利率通道」（0%-0.25%的區間）的下限，即聯儲局要加息的話，只需直接調升IOER即可。同時，如銀行如需要向聯儲局借貸以滿足法定儲備的要求，則會以貼現窗利率（Discount
    Window Rate）計算，因此，貼現窗利率理論上為「利率通道」的上限。


    然而，事實並非如此，從上圖我們可以發現IOER竟然並非「利率通道」的下限而是上限。從2008年到2015年，「利率通道」為0%-0.25%的區間，而IOER為0.25%，有效聯邦基金利率（Effective
    FFR，EFFR）則比IOER為低。原因是甚麼？'
