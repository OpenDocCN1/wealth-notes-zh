    loan卻又十分願意做。Investment loan借貸資金高達物業抵押品的八成，但用途僅限於該銀行內之證券投資，最後又推高資產價格。新增的資金並沒有有效投入實體經濟，反而去了投資，結果是資產價格不停被推高。在市場普遍物價沒有大升而資產價格卻持續上升的大環境下，有錢的人會愈有錢，貧窮的人會愈貧窮，中產階層繼續窮忙，無產階層被市場懲罰。


    # ## 不能再用傳統思維看楼市


    其實以上的MV＝PQ公式，可以同樣套用股票或住宅市場，結果也是一樣。以香港住宅市場為例，M＝住宅市場內的資金；V＝住宅市場內的資金周轉率；P＝樓價；Q＝預期住宅供應。根據傳統分析，M上升所以P上升，但以目前來說卻不一定對。自政府推出一系列辣招後，市場交投跌了很多，即V大幅下跌，表面上抵銷了流入市場的資金增長，預期樓市會因而冷卻。這是政府的算盤，而普遍市民當時都是這樣想，故樓價在辣招推出後曾短暫出現調整。


    然而，香港住宅市場的關鍵其實在於Q。首先，一系列辣招的推出雖令V大幅下跌，但V的下跌同時鎖死了二手市場供應，Q因此也下跌。在房屋本身已潛在供應不足的情況下，辣招再鎖死二手供應，Q下跌的幅'
  merge: -1
