  md: '# 客座教授 | 传统行业如何拥抱电商时代？


    ![](img/111c10f049a8af8b2b739d47aff317cd_73_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这一周，我们迎来了一位独角兽公司的掌门人，王东，钢铁全产业链电商平台找钢网创始人兼CEO。


    他把互联网模式接入传统的钢铁领域，创造了一套钢铁交易系统，3年交易总额突破900亿元，并引领了B2B电商领域的创业潮，塑料、化纤、棉纺、煤炭等领域众多创业者都在模仿他的套路。


    很多人都想找他请教，传统行业如何才能成功拥抱电商时代。这一周，我们请他来分享一下其中的门道。


    ![](img/111c10f049a8af8b2b739d47aff317cd_73_1.png)


    钢铁不像快消品，有一定的技术门槛，客户如何通过网络了解并信任您的产品？您又是如何推广网络渠道，说服传统客户尝试使用的？


    # | 本周客座教授答疑


    首先，绝大多数钢材是标准化的产品，国家规定有相应的生产标准，其标准化的程度和图书、3C相同。所有购买钢材的买家，都是纯粹的理性消费，是因为有具体且清晰的需求才去购买，没有人没事干了买点钢材放家里玩的，这是找钢网与京东、天猫等2C电商有极大区别的地方。同时，绝大多数购买钢材的买家，都很清楚自己要购买什么品种、规格、材质的钢材，如果对具体技术性能不了解，那也会通过咨询的方式获取准确信息后再进行购买。也就是说，购买钢材的买家是专业买家，作为电商，不需要再进行相应的市场培养。


    在找钢网率先崛起之前，大量购买钢材的群体就已经习惯了在网上查价格、搜索现货和看各种与钢材有关的消息，事实上找钢网的创始人团队在早期就是开发和运营钢铁搜索引擎的。同时QQ群也是钢材买家习惯的集中报价的场所，通过QQ、微信议价及传递提货函等文件也是非常常见的方式。


    找钢网是顺应这样的行业互联网应用趋势而发展起来的，我们把一个买家从诞生一笔钢材交易到整个完成的流程，拆分为13个环节，深入到每一个环节去研究，探寻哪些环节是互联网可以进去的。比如询价，过去的询价环节很繁杂，需要客户一个个打电话去问，而互联网能够简化这个步骤，登陆找钢网的平台，每一家的报价及库存都显示得清清楚楚，这样一来，连比价这个环节都省略了。再比如，每一个买钢材的人第二件事就是找货车，找钢网“顺手”就把找车的事解决了。有人想用车，只要在胖猫物流上选择目的地，输入什么货，验证真假过后，每个货车报价、竞价，最终由货主选择，有点类似“滴滴打货车”。


    一句话，找到哪个环节可以用互联网替代，切中需求。


    在整个钢铁行业低迷、亏损的产业背景下，找钢网如何实现盈利？如果盈利的点是规模、增值服务、延伸服务等，那么长久的竞争优势和盈利模式是什么？


    # | 本周客座教授答疑


    任何一个行业，只要消费者无法直接去制造厂家拿货，那么零售企业和电商都有盈利点。因为信息虽然透明，但把厂家的货物与消费者对接起来，是一件非常不容易的事情。有兴趣的话，你可以亲自跑到青岛海尔去厂家买一台冰箱试试看？消费者亲自去厂家买一台冰箱的难度与成本，就是京东、苏宁这些零售企业的价值点。


    电商的本质是零售，是一种采用电商方式运营的零售业态。比如美国有了世界第一的传统零售企业沃尔玛，但沃尔玛帝国的存在也没阻挡亚马逊的崛起。传统零售和电商零售有相同点，也有不同点。相同点是他们都要计算毛利率、费用率、周转率、人均销量、风控等等指标，不同点主要来自团队、技术、运营思维等方面。有兴趣的朋友可以研究一下亚马逊与沃尔玛的财报，能够看出很多很有趣的东西。


    找钢网一直在做“一站式”的零售模式。我们进入到交易、仓储、加工、物流，这样的话买家用户体验极高，我们的壁垒也越来越高。当然，在这个过程中也会出现很多很复杂的地方，比如技术开发、财务体系怎么贯通等，这些问题解决了，我们就给下游买家提供了一种供应链管理服务。


    这个世界上是没人会免费帮别人卖东西的，只要不免费提供服务，那么就会有利润点，当你建立起大型的零售渠道后，就会自然有持续性的盈利。对零售企业来说，他不在乎这个行业是否低迷，往往行业低迷的环境恰恰是大型零售企业崛起的最佳时机，比如当年苏宁国美在家电行业的崛起，在这个时代背景下，大型零售企业最方便建立起自己的竞争优势和筑高竞争壁垒。


    而且过去，钢厂卖货是论船、论车卖的，比如一条船客单价几百万、上千万元，现在通过找钢网平台销售，客单价只有五六万元。从批发制造转成以零售为主的模式之后：第一钢厂的毛利高了，批发和零售肯定不一样；第二渠道更安全了，以前看起来钢厂很牛，千万吨级、几百万吨级，事实上只是面对几十个大的代理商而已，根本搞不清楚这些货最后卖给谁了，任何一个代理商造出了问题钢厂就会很麻烦。现在通过入驻找钢网平台，钢厂可以直接面对众多的买家资源，我们的数据会反馈给他，他会根据情形进行产品改良，定制化生产成为可能。这对上游的价值就高了。


    所以，提醒有兴趣创业的朋友，当你发现某个行业陷入所谓低迷，恰恰是在该领域创业的最佳黄金时机，因为这个行业需要变革，无数大企业都是在这个阶段发展起来的。'
