  md: '# 客座教授 | 小众市场如何实现持续增长？


    ![](img/111c10f049a8af8b2b739d47aff317cd_49_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这一周，我们迎来了一位经历丰富的客座教授：曲向东，玄奘之路发起人，极之美旅行机构创始人、极地旅行专家。


    他曾经是中央电视台《经济半小时》、《对话》栏目的主持人，辞职后自己创业，把兴趣做成了事业，创办了中国第一家专业的极地旅行机构——极之美极地旅行机构，成功把极地旅行做成了生意。这个春节，他还会和刘润老师合作，带企业家一起去往南极进行商业问道。


    他同时策划发起了“商学院戈壁挑战赛”、“戈壁成人礼”等高端赛事和领导力培训活动，成为了国内面向EMBA商业精英最有影响力的文化体验赛事。


    很多人羡慕他，说他一边玩着一边就把钱赚了，也有很多好inet,


    这一周，我们请他来分享一下：像极地旅行这样一个小众市场，如何才能实现持续增长？


    ![](img/111c10f049a8af8b2b739d47aff317cd_49_1.png)


    一般人会觉得南极北极一辈子去一次就够了，那么在小众化的市场里，用户量肯定会萎缩，曲总您是如何解决后续发展这个问题？


    （请这位学员在本文下方留言，填写自己的姓名、通讯地址和能联系到你的电话号码，得到APP的工作人员将为你送上一份神秘礼物。）


    # | 本周客座教授答疑


    极之美的创办最早是因为我的个人爱好，第一个客户就是我自己。


    我曾多次乘坐世界上最大马力的核动力破冰船去北极点，一路上始终有种很神奇的感觉，似乎时间是停滞的，心里总是ien...


    回来后，我很想把自己的感受分享给更多人，于是按照自己的兴趣爱好去设计了一个行程，邀请身边的朋友同行，收集大家的反馈再来完善，这就是这个项目的由来。


    ![](img/111c10f049a8af8b2b739d47aff317cd_49_2.png)


    # 1、在一个领域内做出特色


    最初创办极之美的时候，我就希望它能有自己不同的调性，把传统的旅游服务和自然、人文的学习结合在一起。所以每次行程我们都会组织一支专业的探险队，包括在极地方面具有很深研究功底的地质、生物、动物学专家，熟悉这一领域的翻译团队，专门负责管理队员情绪、身体等具体工作的领队。


    我们会邀请不同国籍的专家为旅客做系统的课程讲授，让大家能够多维度地了解南极北极，还会策划一些互动性的活动，比如邀请于丹、王小丫、野生动物摄影师奚志农、美国国家地理摄影大师弗兰斯·兰廷等来做“南极大学”的讲师，不断地提升用户的产品体验。至今，我们已带领过1500多位国内外探险爱好者到达南北极地区，口碑非常好。


    我们的很多客户都去过南极北极不止一次，比如刘润老师，2012年和2013年，他曾经和我们一起去过南极北极，今年春节，刘润老师还会再次回到南极。


    当然，我们也会不断开拓新的线路，刺激原来客户的兴趣。比如达尔文写出《物种起源》的地方——加拉帕戈斯群岛，有很多奇异的古老动植物，那里几乎是欧美大中学生和自然爱好者的生物课堂，但中国游客极其罕见，我们就把它介绍给了中国的旅行爱好者，非常受欢迎。


    # 2、用品牌区隔拓展更多客户


    ![](img/111c10f049a8af8b2b739d47aff317cd_49_3.png)


    推广方式上，我们之前做的还是比较传统，主要通过客户的口碑传播，以及圈子、展会、渠道、网络等，比如与银行、高端俱乐部等机构合作举办极地旅行分享沙龙。但这两年，我们也有意识地开始和互联网做了一些结合，比如成功利用聚划算销售南极和北极包邮。通过和品牌厂商的合作，将原本八九万的南极船票，从最低价8811元开始销售，结果一艘船不到一天就销售一空，创造了聚划算的纪录。


    在2015年，我们还和淘宝联合举行了一张北极游船票的拍卖，这张起拍价1元的产品共获得22人36次出价，最后成交价格为10.1万元。通过这样的方式，扩大了极之美的品牌影响力，也吸引了更多人的注意力。


    我一直认为，高端旅游这一类的体验产品是最注重品牌和客户区隔的，所以我们针对不同的客户群体和产品类型，使用了不同的品牌，这样才有可能针对不同的客户需求都能深入的“做到位”。比如，极之美主要负责南极北极旅行、行知探索主要做戈壁挑战赛，这就如同全球最大的精品集团，法国LVMH，他们从未考虑要把旗下五十多种奢侈品牌变成一个品牌，甚至也不会在任何品牌中明显标识LVMH的品牌，目的就是为了制造品牌区隔，用不同的品牌调性抓住不同的客户体验。


