  md: '# 周末小结｜拷问CEO、精选留言分享


    ![](img/111c10f049a8af8b2b739d47aff317cd_7_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    开课第一周，我们分享了消费心理学的5个概念：心理账户、沉没成本、比例偏见、损失规避和价格锚点，我深深感受到了大家的学习热情。5000多条留言之中，同学们贡献了很多有价值的思考、也分享了不少精彩的商业套路案例。我们还特别邀请了罗辑思维、得到APP创始人罗振宇，从这些留言中挑选出了一个问题进行回答。


    现在利用周末小结的时间，把这两块内容集合放出来，供大家琢磨再学习。


    开始吧。


    罗胖，过去一般都认为，在互联网时代，所有的内容都应该免费。为什么你做“得到APP”却主张收费？这背后的商业逻辑是什么？


    ![](img/111c10f049a8af8b2b739d47aff317cd_7_1.png)


    过去的商业世界，最主要的变量是——金钱。


    现在的商业世界，有一个变量越来越重要——时间。


    有两个方面的趋势值得我们关注：


    首先，所有的上升型产业都在抢夺用户的时间。比如，媒体、出版、教育、影视、游戏、旅游、健康。时间是未来一切商业的共同战场。行业边界日趋模糊。从用户的角度说，消费一个产品，支付的越来越不是金钱，而是时间。


    其次，人们因为对时间的使用方式不同而分层。越是社会上层，时间越不够用。越是社会底层，就越拥有大量闲暇。


    因此，为用户省时间，价值将越来越大。


    从这个角度，你就可以理解为什么我们判断“内容收费”将是一个趋势了。


    +   1. 内容收费，不是因内容而收费，而是为在海量的信息中做了精选、优化的服务而收费。内容服务，实际上转化成了时间服务。比如刘润老师的这个“5分钟商学院”的产品，不仅是为用户省了上商学院的钱，更重要的是大大提升了大家的时间使用效率。它的价值，不仅在内容，更在时间。


    +   2. 内容收费是社会分层工具。

    当然会有大量的人不愿意为内容付费。尤其是知识性的内容。这意味着他看不到精选的资讯、优质的分析、高手的洞察。

    有一个很粗暴的逻辑认为——人的财富和认知水平是他的朋友圈水平的平均数。

    大体确实现如此。

    内容收费，其实是为那些愿意付费的用户在升级朋友圈。大家不妨再看一眼那些开订阅产品的老师。我们的目标是，把中国所有能提供高水平、可持续知识服务的老师都请到“得到APP”里来。这样的人构成的朋友圈，每天尽心尽力为我们的用户提供尽可能省时间的高质量交流。这是我们身边的密友也做不到的。

    朋友圈不同，用户的水平自然也就不相同。这可能是最便宜的突破社会分层的工具。


    +   3. 内容收费可以构建更好的社群。

    大家可以对比一下得到APP里的评论质量和其他免费内容平台的评论质量。对比效果一目了然。

    社群自治和价值认同，是未来商业最稳固的底盘。


    # | 精选留言分享


    举几个例子，商业行为利用人类对沉没成本心理偏见的：


    +   1. 购买车子时，销售人员会陪你花很多时间，观看、试车、并收取一部分预付款。


    +   2. 很多网游的设定，不断举办各种活动让你在其中投入的精力和钱越来越多，让你不愿意离开。


    +   3. 公司设定年终奖的时间，比如每年7月份，造成无论什么时候，都至少有半年终奖的沉没成本来稳定员工。


    要想避免当这种沉没成本谬误的受害者，首先我们要了解这个概念，在平时做决策的时候反思、训练：股票赔了并且判断该抛的时候就抛；男女朋友没感情了该分就得分；不喜欢的、没有成长性的工作就离开吧‘当你感觉到不是你在玩游戏，而是游戏在玩你的时候，就不要再玩了。


    ![](img/111c10f049a8af8b2b739d47aff317cd_7_2.png)


    刘润

    透彻。都是你这样，经济学就要重新研究了。


    现在的网游就非常好地利用了沉没成本：


    +   1. 会在较短的时间内用引导的方式（就是跟着指示走）让玩家比较快速地升级到一定的级别，并获取一定量的游戏内物资；


    +   2. 以阶梯式的资金投入获取vip等级，每级对应稀缺资源的获取，但是前一二的vip等级价格一般都较低。通过玩家的少量资金投入，以及短期获取大量（感觉上）游戏资源，让玩家不忍放下，即使游戏玩的时间长了、感觉并不是那么好玩的时候，也会有人因之前投入的资金和已经获得的等级与游戏物资而持续玩下去。


    ![](img/111c10f049a8af8b2b739d47aff317cd_7_3.png)


    刘润

    怎么解决？如果有一个“网游交易所”，把一个网游里的价值（等级、装备）交易成另一个网游里的等值价值，可以解决这个问题吗？谁要据此创业，记得分我股份。'
