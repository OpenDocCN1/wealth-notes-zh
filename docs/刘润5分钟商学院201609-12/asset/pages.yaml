  md: '# 客座教授 | 不搞电商也能赢


    ![](img/111c10f049a8af8b2b739d47aff317cd_149_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这一周，我们请到了新实体零售代表，名创优品全球联合创始人叶国富。他用了两年时间，在全球开店1400多家，2015年营收突破50亿，2016年预计销售100亿，被无印良品、优衣库和屈臣氏列为“全球最可怕的竞争对手”。


    很多人都想找他讨教，名创优品把商品价格定得和出厂价一样，真的可以赚钱吗？电商业务席卷全国的当下，继续大规模开实体店究竟是不是明智之举？


    这一周，我们请他来分享一下其中的门道。


    ![](img/111c10f049a8af8b2b739d47aff317cd_149_1.png)


    能以比竞争对手低的成本得到货源，然后以竞争对手不能接受的价格吓退竞争对手，确实是一招不掏的棋。但现在中国市场已经不像前几年对价格那么敏感了，低价产品甚至被一些人视为次品、低档品，那如何保证消费者接受你这产品？同时，如何保证产品的质量呢？


    不要说目前还处于发展中阶段的中国，即使是已经处于发达阶段、十分富有的欧美国家，消费者对于价格都一样敏感。在这个世界上，不管是有钱人还是没钱人，都想买到便宜好用的产品。而且越是有钱人，就越会精打细算，让每一分钱都花费物有所值。


    如果只是把低价产品视为次品、低档品的话，那只能说明你的产品是真的没有做好。我们要相信，消费者的眼睛都是雪亮的，谁的产品好、谁的产品差，谁的产品值得购买、谁的产品不值得购买，他们内心都一清二楚。


    名创优品敢这么讲，是建立在产品质量绝对优质的基础之上的。之所以价格便宜，名创优品做到了四步：第一，严选优质供应商；第二，大批量全球化采购；第三，买断制供货；第四，明确自己的战略方向，用真材实料的同时不追求暴利。而且最关键的是这些都是被我们真正落到实处的。124人笔记


    我们所选择的供应商，遍及国内外。国外的，像茹特丽、奇华顿，是在整个国际行业内都鼎鼎大名的领头羊，本身就是质量的保证；国内的，则是以前只做日本、欧美等发达国家外贸单、有实力雄厚的大加工厂。大家都知道出口商品的条件很严格，尤其是外商对产品质量要求更是严苛。能够接这样单的加工厂，自身实力不用多说。


    为了和这些以前只肯做外贸单的工厂合作，初期我们是花费了很多心血打进去的。一方面，我们采用买断制供货，让他们能够无后顾之忧的为我们生产产品，因此供应商愿意给出最低出厂价——常规出厂价的50%。一方面我们尽量用规模化采购下单，力求从数量上升降低成本，全力做到产品在出厂时能够既保质又保价。而我们自身的毛利率则只控制在8%左右，再通过在全国和全球各地的仓库将产品直接发货到门店销售，门店只加价32%—38%，最终我们的零售价只有别人出厂价的90%—97%。相比传统实体店，名创优品不仅出厂价低，还去掉了省级代理和市级代理两个传递价值的环节，因此成本大幅降低。这块还要特别提一下名创优品在全国的七大仓库，供应商把产品直接送到中央仓库，再由仓库直接给周边门店配货，新货从仓库到门店通常只需一两天，降低成本之外还大大提高了配货效率。


    而现在，名创优品越做越大，不仅立足于中国的市场，更是成功进军了国际市场，在越来越多的国家安家落户。良好的发展不仅让名创优品的销量节节攀高，也要求名创优品对产品质量的把关更上一个层次。而越来越大的需求量也让我们有了更充足的资本和底气去和加工厂谈价格、谈质量。这是一个首尾衔接的良性循环，互相要求、互相促进、互相提升。


    曾听叶总谈到未来零售是“新零售”模式，不只是简单的“线上+线下”，叶总能否具体谈谈未来“新零售”模式新在哪些地方？目前开辟“新零售”模式的条件是否成熟？


    新零售这个概念自从被马云提出出来之后，一直都特别的火，而且大多数数人在探讨这个概念的时候，差不多默认的都是以马云提出来的模型为蓝本来开展，甚至在百度百科上，新零售的定义就是“未来电子商务平台即将消失，线上线下和物流结合在一起，才会产生新零售”。


    对于这个观点，我是不同意的。“新零售”如果只是简单的线上线下和物流相结合，那么它根本不必被称为“新零售”，只不过是被盛装打扮而变得更好的O2O概念而已。马云提出“新零售”最大的意义就是否认了电商对传统零售的冲击，让原本在他影响下，认为线上、线下是互相独立、冲突关系的那批人和原本一ेक歌电商万岁、唱衰实体的那批人，都重新去审视线上、线下的关系，去反思零售的意义。


    我从进入社会，从事的就是零售行业，可以说是一个标准的“实践派”。经历过实体行业的繁荣，经历过不被人看好的“寒冬”，现在又迎来了所谓的“新零售”，算得上是三朝元老。实践经验告诉我，消费者并没有很清晰的线上、线下的认知区分，他们是根据需要，哪里性价比高就选择哪里。


    在我看来，所谓的新零售，不是一个简单的线上线下融合的问题，而是利用各种工具和载体同步提升用户体验和运营效率，甚至深度整合到供应链里面去，为客户提供他们真正需要的产品。新零售，应该是未来零售业的发展趋势，是更高效率的零售。


    在美国，COSTCO早就在这么做了，他们采用会员制，很大一部分收入来自于会员费，再利用这些消费需求垂直整合供应商，为消费者择优质低价的产品，甚至还参与产品的设计
    深度整合供应链的意义 名创优品也在'
