  md: '# 027｜张维迎和林毅夫在辩论什么？


    # 概念：看不见的手(市场) VS 看得见的手(政府)


    亚当·斯密认为，政府做好“巡夜警察”，防 cháy 暴力、偷盗、欺诈并保护履行合同和提供公共事业，就就可以了。至于经济，有一只“看不见的手”，会利用人的自私性、趋利性，最终有效地配置资源。


    凯恩斯认为，任由市场自我调节的代价是贫富差距悬殊，大量失业发生，社会不再安定。那只“看不见的手”很危险，需要国家调控这只“看得见的手”的控制，才能让经济走势不会脱离正轨，减少患“经济危机”这个癌症的风险。


    前段时间，中国经济学界有一场著名的辩论，同样是北京大学出身的林毅夫，和张维迎隔空交战，引无数人围观。他们讨论的是宏观经济学，大部分围观的吃瓜群众估计都听不懂，就是觉得，高手过招，我们过瘾。


    经济学界，是个很有趣的地方，经常辩论，但却总辩不出个结果。其实，林毅夫和张维迎已经辩论了近10年了，能有结果，早就有结果了。


    # 辩论：政府应不应该干预市场？


    正方：张维迎说，政府越少干预经济越好，最好不干预。


    正方：经济学的开山鼻祖，亚当·斯密补充说：政府？你做好“巡夜警察”，防范暴力、偷盗、欺诈并保护履行合同和提供公共事业，就就可以了。至于经济，别担心，有一只“看不见的手”，会利用人的自私性、趋利性，最终有效地配置资源。


    反方：林毅夫说，你太天真了。我从来不反对市场，但一个高质量的经济体系，应该是有效的市场加上有为的政府，二者缺一不可。


    # 小结：主持人又出来了


