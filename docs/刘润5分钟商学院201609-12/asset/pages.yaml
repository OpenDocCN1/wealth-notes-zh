    关于第一周消费心理的所有文章想问一个问题：所有这些心理选择是不是都就可以归结为消费者自己对投入产出比的决策呢？商家只是引导你走上了商家让你思考的道路。

    心理账户：你考虑了投入后，送情人比自己吃掉的产出要大。（自己解绸比不上让她开心）

