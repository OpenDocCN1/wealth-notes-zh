  md: '# 023 | 你到底是赚了，还是赔了？


    023 | 你到底是赚了，还是...


    # 概念：机会成本


    机会成本是指你做了某项选择，而不得不因此失去的其他利益。比如，如果做出选择A，就必须放弃B的话，B就是A的机会成本。


    对企业来说，最优方案的机会成本，就是次优方案可能带来的收益。


    我听到过最让人潸然泪下的创业故事，是10年前，一位创业者以80万元的总价卖掉自己深圳的房子去创业。几年白手起家的努力后，公司开始走上了正轨。辛苦打拼到去年，终于赚到了400多万元的利润。他非常高兴。最近他用这些钱做首付，把自己当初卖掉的那套房子又买回来了。


    很多人说，房地产已经成为中国经济的鸵片。为什么这么说？大家都能赚点钱，不...要理解这句话，你首先要理解经济学中的一个重要概念：机会成本。


    # 运用：场景


    场景1：


    如果，你卖的是相对较贵的东西，你可以通过强调便宜的东西隐藏的“机会成本”，来获得客户。比如你卖昂贵的西装，你可以告诉客户，如果你贪图便宜，买过于便宜的西装，你可能是因为穿着不讲究，无法赢得客户尊重，而丧失生意机会。丧失生意机会，是买过于便宜的西装的机会成本。


    场景2：


    对个人来说，时间，是最大的机会成本。建议你用自己的年收入，除以一年的工作时间，大约2000小时，看看自己一小时的“机会成本”是多...付费，就是赚钱。


    # 小结：如何善用机会成本？


    什么是机会成本？如果做出选择A，就必须放弃B的话，B就是A的机会成本。对企业来说，最优方案的机会成本，就是次优方案可能带来的收益。


    如何善用机会成本？


    第一，你要知道你每一项选择，都有机会成本，天下没有免费的午餐。


    第二，你要懂得计算机会成本，比如你的时间成本，替代方案的投资收益等，然后通过权衡收益和包括机会成本在内的各项成本，做出理性的决策。


    # 你到底是赚了，还是赔了？


    ![](img/111c10f049a8af8b2b739d47aff317cd_63_0.png)


    你的每一项选择，都有机会成本。要懂得计算机会成本，比如你的时间成本，替代方案的投资收益等，之后权衡对比，做出理性决策。


