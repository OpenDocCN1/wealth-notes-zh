    你意想不到的7款高品质水果，可能有来自日本青森县的水蜜桃苹果，可能有来自智利空运的比你头还大的蓝莓，可能有拥有神奇口感的西班牙脆柿，也有可能来自贵州修文的野生猕猴桃等等，只挑最新鲜、最好吃的水果，全程生鲜物流保鲜，24小时内港口直达。（每周新鲜直送，图片仅供参考，以实物为准。）


    希望拿到礼品的读者，能够在微博上晒一晒，顺便@一下我，让我和你们一起开心开心。


    祝大家周末愉快！


