  md: '前几个月下了一个免费的App，功能非常符合要求，可是频繁地出现广告，我不胜其烦，点选了付费去广告。点选的时候，我微笑着对自己说：二段收费。我也学进去了。一点点积累知识，不知不觉中提升认知，逐步改善生活。


    小米不仅使用了组合拳，而且还是七连击。


    产品线定价：同款手机有小屏、大屏，再分标配、高配。备选品定价：小米建设了小米之家、维修点，配件费用接近手机本身。


    分部式和互补品定价：假如手机成本较低，那么手机可以免费赠送给客户，然后以米币这样的虚拟货币来换取消费品，可事实上手机的费用就相当于门票。


    副产品定价：小米生态链就是小米亲自创造的副产品，它不像鱼头一样，本 Seo 身就存在。


    捆绑式定价：买手机时各种套餐、组合，都比单买一个手机要“划算”。


    单一价定价：这个要以时间的纬度来看，比如说红米，红米1卖699，红米2卖699，红米3卖699，到了红米4还是699，给人的感觉就是价格不变，越来越便宜，手机越来越好。这一套连击下来，你真的躲的过吗？


