    # 场景2：打分点评让服务更好


    在中国没有给小费的习惯。但是，我们有打分的习惯。你下了车，付了款，专车APP会要求你对这个司机做点评。因为这个点评，专车司机的态度特别好，你冷不冷啊，要不要喝水啊，车上还有WIFI你不要不要用啊。


    通过一个小小的点评，这个专车APP就“雇佣客户”来提升了司机的服务水平。代价，可能只是下次打车的红包。


    # 小结：与客户交易


    我们第25期讲的“交易成本”，当管理成本，大于交易成本的时候，这件事情应该交给市场，在企业的外部完成，而不是自己来做。


    雇佣客户，就是把对员工的管理，变成与客户的交易。


