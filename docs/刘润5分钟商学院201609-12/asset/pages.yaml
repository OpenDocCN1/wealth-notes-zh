  md: '# 周末小结｜在复杂世界里，学会说“看情况”


    ![](img/111c10f049a8af8b2b739d47aff317cd_137_0.png)


    《5分钟商学院》的同学们，


    周末好！


    本周，我们讲了很多看似矛盾、但底层逻辑是一样的东西。


    我们讲了长尾和爆款，看似矛盾，但其实是“边际成本”这枚硬币的两面。


    我们讲了爆款和用户代言人，看似又矛盾了，爆款是B2C模式，用户代言人是C2B模式，但实际是一条商业路径，从两头的走法不一样而已。


    我们还讲了集中资源做好一个产品、打造极致东西推出给消费者，又讲到了小步快跑、做一个最小试用品，结合用户反馈迭代更新，其实也只是不同场景的不同应用。


    在商学院学习时，很多人常会说的一句话就是“it depends（看情况）”。这三个字听上去像是搪塞糊，却是理解了商业世界的复杂度之后的新高度。


    学习的东西越多，你就越会感受到商业的复杂性。商业世界是被很多规律同时运作着，不同的商业逻辑底下经常有着相同的底层逻辑。所以遇到一个情况，究竟该怎么做好，还是那么办好，对商业知识了解越多的人，越会说“看情况”。120人笔记


    希望经过本周的课程，同学们都能学会这句话，“看情况”，那意味着，你们对复杂世界的掌握又进了一步。仅供社群内部学习交流请阅后删除，进社群加微信ccdd660


    ![](img/111c10f049a8af8b2b739d47aff317cd_137_1.png)


    # 精选用户留言


    如果把个人当做一个企业来认知，这个能量模型也是成立的，所谓的产品就是最大程度提升个人认知和能力，而营销就是学会表达与展示，而渠道就是个人社交网络，其中最根本还是产品，要想办法打造势能。


    品类就是让客户在做一件事情的时候，第一个想到你，甚至是直接用你品牌的名字来代替。最关键的就是细分市场，形成产品的差异化来树立产品感念，让人简易明了地看到你的特点。品味就是你能搭建的场景，也就是调性。什么人用你的产品，什么场景下人们会想到你的产品。这里就需要设计、艺术感等下功夫。品质就是你自己控制整个产业链的长度、力度、执行力等硬实力。


    克里斯安德森的长尾理论，最精华的部分应该是关注了互联网带来的产品销量和利润的关系，把产品分为三类：2%特别好卖的超级爆款、8%的一般爆款和90%的长尾产品。在利润贡献上，各占33%。


    如果，在普通产品中加入有趣的创意，形成众多的SKU，就可以一定程度上获得和爆款产品一样的利润。比如江森海的创可贴8，卖的都是普通创伤，像，但印上一些好玩的图案和文字，比如想吃点啥就吃点啥。哪凉快哪呆着，售价就可以高到每件168元。火了，要用爆款思维去运作，迅速满足尽可能多的同类需求。否则，竞争对手就会坐享其成，仿冒者会如雨后春笋。


    部分C2B的先行者都是类似于中介的机构，通过互联网最大程度地连接相同或类似需求的客户组成“联盟”，将分散于地理上各个角落的特殊需求集合成大笔订单，以提高买方的议价能力，并佐以平台的信用优势或者是信息优势筛选卖家，减少卖家的渠道成本和最大程度分摊卖家的固定成本（如模具）来降低商品价格。


    但海尔这样的却是另一种形式，通过技术手段将模块无限细化，细微的模块可以拼接成较大的模块，这样用户更加个性化更加细致的需求就可以被满足。


    它们并不一样，第一种，是传递价值的优化。第二种，进一步优化了创造价值。


    我们企业是一个建筑企业。适不适合最小可用品的原则，我觉得不能一概而论。从整体来说呢，建筑企业当然不适合最小可用品原则，必须跟大亚湾核电站一样，一次性把工作做对。但从管理细节来看，又可以用最小可用品原则。每一种创新项目管理方式的火花，都可以遵循最小可用品原则先拿一个试行办法，然后在项目实施的过程中，通过各个部门各个岗位所有人的协同联动，不断试错，不断去改进方法，最后达到提高管理效率的目的。没有这一次又一次毛细血管层面的新陈代谢式的管理创新，再大的国企也不可能做到基业长青。


