  md: '道不舒服吗？不环保吗？跑得不快吗？但记住千万不要试图让消费者全然了解你。

    你有很多卖点可以强调，但不能贪心，就抓住安全这一个点，就可以保持在美国乃至欧洲销量第一的位置。


    而当沃尔沃开始改变这个点，开始强调快乐驾驭，开始强调幸福和成功，这个时候你很快就会发现它被淹没在宝马奔驰里面。所以定位就是在消费者的 Texts 海当中准确的占据一席之地。人的大脑能记住的东西非常有限，所以切记少即是多。


    围绕饥饿营销，我试着把之前所学做个简单“串联”：


    +   1）前提。饥饿营销需要满足一定的前提才有效。例如产品不可替代（企业能量模型之产品）、消费者心智不成熟（消费心理学）、市场竞争不激烈（供需理论），甚至还需要特定的品牌或口碑（品牌容器）。


    +   2）关键。要洞察人性，抓住消费者心理（消费心理学之心理账户、价格锚点等）。例如求新心理、好奇心理、攀比心理（凡勃伦效应），以及鸡蛋理论（粉丝参与互动）、适应性偏差（意外幸福感、对比幸福感）等。


    +   3）实施。如果是新品，为了保障效果，“上市时机”和“吊胃口的度”都要拿捏好。如何通过媒体、社群、网络等各种渠道不动声色地造势，不断攻占消费者心智（定位理论），把消费者胃口吊起来。同时也要注意过犹不及。


    推荐《跨越鸿沟》这本书，从鸿沟理论来分析，整个过程分为5个阶段：创新者、早期采用者、早期大众、晚期大众、落后者。分别对应技术狂热者、远见家、实用主义者、保守主义者、怀疑论者。在早期采用者和早期大众之间有一个比较大的鸿沟。早期采用者是远见家，通常扮演着成了都是自己的功劳，败了拍拍屁股走人的形象，不可能直接和早期大众交互。早期大众是实用主义者，选择接受一个新高科技产品是考虑实际价值的。这两类人差异比较大，新产品一定要解决实用的问题，才能跨越鸿沟。


    一旦接到客户愤怒的投诉，你们的产品让我们设备停车了，耽误了生产……我们的处理步骤如下：

    销售第一时间冲到客户现场道歉，不管是不是我们产品的原因，先表明态度。到达现场之后，首先只听不说，让客户把情绪完全发泄出来。等客户情绪平静之后，再和客户一起探讨和分析可能产生的原因。根据反馈和生产自查，给出质量反馈，并提出相应的改进和对策。如果是很重大的事故，需要公司高层或者老外出马，表示重视。如果真是我们的问题，有时要进行商务赔偿。一般来说，这几部走完，就基本没什么问题了。一定不能去在客户有情绪时去反驳，在这种情况下，你表达的不是观点，而是情绪。


    独特销售主张就是在自己产品里的众多卖点中做减法，找到最与众不同、有最大价值的点。而定位就是在所有卖点中选择一个自己产品最相符的。


    以上5位同学请在本文下方留言，填写自己的姓名、通讯地址和能联系到你的电话号码，得到APP的工作人员将尽快把礼物，价值288元的人中龙凤水果礼盒，送给你们。


