    # 王建硕 百姓网创始人&CEO


    2005年创立国内第一家分类信息网站百姓网，成功将百姓网打造为月活跃用户数过亿、覆盖全国367个城市的本土分类信息网站，并带领百姓网于2016年成功挂牌新三板。


    你这位CEO有什么问题想问他，欢迎在留言区提出出来，我们将挑选一个最有价值感的问题，请王总认真回答，并在本周学习结束的时候，公布这个CEO问CEO的结果。


