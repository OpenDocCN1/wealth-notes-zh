  md: "# 周末小结 | 从站桩到出拳\n\n![](img/111c10f049a8af8b2b739d47aff317cd_76_0.png)\n\n《5分钟商学院》的同学们，\n\
    \n周末好！\n\n本周我们一起分享了微观经济学中的5个核心概念：\n\n+   1、供给和需求的相对稀缺性，决定了产品的价格和产量。如何利用供需理论获得更可观收益？\n\
    2、你每多消费一件商品，它带来的额外满足感是不断下降的。怎么利用“边际效用”卖出更多产品？\n3、为什么说房地产提高了中国经济发展 的“机会成本”？如何利用机会成本做出理性决策？\n\
    4、你拥有店面资产，是所有者，他拥有经营能力，是经营者。你总觉得经营者不够用心，他总觉得你不肯和他分享利润，如何解决“委托—代理”之间的矛盾？\n5、如何判断企业应该做大还是做小？\n\
    \n我们已经从站桩开始慢慢学习出拳、踢腿了，熟练了后，就可以进入到招式的学习阶段。招式熟悉了后，就可以自然而然使出变化，变化熟悉了后，就可以自然而然的无招胜有招了。这一年的修炼，刚刚开始，新加入的同学，快点跟上哦。\n\
    \n这一周，我还在留言区看到一些同学建议，把每堂课的内容和每期的精选评论，编辑成一本书，便于大家随时翻阅、复习巩固。还有人建议，一年后组织个测验或者论文考核，成绩好的发毕业证书。\n\
    \n同学们，你们觉得呢？\n\n# | 精选留言分享\n\n对于单一商品或服务，边际效用产生满足感降低，用户关注度下降，有几种方法补强。一种是消费积分，会员升级，增加身份认证等。打怪升级，将满足感无限放大。比如游戏，论坛等会员升级及相应特权，满积分置换礼品，另一种是增加品牌认同，社群特权，强化归属感。还有一种增加互动参与感。\n\
    \n朋友销售虚拟服务器，向顾客推销时强调软件部署快、维护方便、管理统一，说服力不是太好。我觉得他如果从机会成本的角度谈，效果会好很多：虚拟服务器虽然贵，但一台可虚拟出多台的服务器，两台普通服务器的价格就超过虚拟服务器了。若不用虚拟服务器，机会成本包括更新其他服务器的成本、等待更新的时间成本、重新调试的成本。\n\
    \n逼着让每个男足运动员拿出工资的三分之一买足球彩票，而且是买自己队伍赢，可以有效激励。\n\n工厂计件工种中，耗材不好用但还可以用的时候，工人往往丢掉，造成消耗很大，总体成本高。现在采用包耗材，根据订单量提供规定量的耗材，并告知单价。超过了用量需要自己班组购买，节省了有富裕可以卖给公司或者其它班组。这样员工会主动想法提高利用率，公司也控制住耗材用量。\n\
    \n日本有很多持续百年的小企业，比如专门做紧固螺丝的企业，做圆珠笔钢珠的企业。当年乔布斯推出iphone，就是在日本找到的固态存储硬件。除了日本人的传承精神之外，另外一个重要原因是日本的商社文化降低了小企业的交易成本。小企业只要集中精力把产品做好，销售的事情交给各个商社就行。这样一方面使得企业有更多时间创新，提高产品质量。反过来行业最好的产品又能使日本企业能参与像iphone手机这样世界级产品的生产协作。越有序的信任市场，企业平均规模越小。\n\
