  md: '# 小结：打开慧眼


    美国有没有互联网思维？如果你能拿起“商业兵器库”里的“流量之河，倍率之刀，价量之秤，信息对称，边际成本，机会成本，人口抚养比，全渠道营销”来分析，看清楚中美在“物流、地产、人口、效率”四个方面的不同，就有答案了。


    # 美国有没有互联网思维


    # 陪你成长的第04天


    ![](img/111c10f049a8af8b2b739d47aff317cd_226_0.png)


    商业的世界，被无数规律同时作用着。你学习的规律越多，眼中的世界就越清晰，你也越会说“看情况”，以不变应万变。


    # 得到专栏·5分钟商学院


    主讲人：刘润


    # 刘润


    每一件事情背后，都有其商业逻辑。基于前面12周，60课的学习，你有没有运用这些商业逻辑的有趣尝试呢？与大家分享分享？来和我一起过招吧。


    另外，我要宣布，在得到线下课程团队的帮助下，我们的线下大课，也终于确定于2017年1月14日，在我出发去南极前，在北京举办。


    这次大课，我将花一整天的时间，好好与大家分享我对商业世界的看法，以及如何抓住这个时代的商业机遇。我会从四个角度分享我的看法：


    # 第一，洞察变化：感知正在生成的未来。


    所有的商业，都是顺势而为，一定要理解时代的变化，才能正确抓住变化。到到底是什么在推动最近这几年商业世界翻天覆地变化的底层逻辑？我希望带领大家感受这个逻辑，并且根据这个逻辑，感知未来。


    # 第二，抓住不变：深刻回归商业的本质。


    看清变化的，是观察家，而看清不变的，才是战略家。我会在这部分把大家从变化中拉回来，回到商业的本质，找到那个没有变的基础，思考我们应该如何应对。


    # 第三，创造价值：必须脱离人口红利。


    回到一个企业的微观，任何一个企业，在商业大环境中都是微观个体。从个体角度看，我们如何做出改变？我会从创造价值的角度，分析我们看到的三个红利，其本质，是创新的机遇。


    # 第四，传递价值：尽量短路用户距离。


    互联网今天对传统行业到底产生了哪些影响，又给了我们哪些机遇？为什么互联网对中国线下机构势如破竹，但对美国影响不大？我们应该如何利用互联网，提升传递价值效率？我将好好分享我的观点。


    没有成功的企业，只有时代的企业。英雄造时势，更是时势造英雄。让我们一起抓住趋势的红利，成就更大的事业。


    期待在北京看到大家。感兴趣的同学可以在微信公众号搜索“得到”，关注“得到”公众号，回复“刘润线下课”即可弹出购买链接，订阅用户可享受八折优惠（12.26号零点起回复原价）。


    另外，在大课结束后的当天晚上，我还会在北京，和10名学员，有针对性地深入讨论你们自己企业的问题。这个名额非常少，先到先得。


    这是“刘润·5分钟商学院”在线下陪你成长的第一课，期待你的参与。


