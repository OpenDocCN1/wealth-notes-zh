  md: '# 050 | 只溶在口，不溶在手


    ![](img/111c10f049a8af8b2b739d47aff317cd_166_0.png)


    如果我的产品已经有了，而且至少短时间没法改了，我有什么办法，把它卖得更好呢？


    我要给你介绍一下“定位”的亲兄弟：USP，独特销售主张。定位从用户出发，独特销售主张从产品出发。


    # 概念：USP-独特销售主张


    独特销售主张，就是从你的产品里，找到一个有巨大说服力的、竞争对手不具备的、对消费者的好处。


    独特的销售主张，是20世纪50年代，美国Ted Bates广告公司董事长罗瑟·瑞夫斯提出来的。


    在瑞夫斯看来，一个“独特销售主张”必须具备三个突出特征：


    第一，不应该是“买我们的吧”，不应该是自吹自擂，我们最好，竞争对手最差。你必须向消费者提出一种主张，让他们能够意识到产品给他们带来的真正好处。


    第二，必须是竞争对手还没有提出来的，或者甚至无法提出来的。也就是说，它必须独特。


    第三，必须有巨大的说服力，能够让消费者立刻采取行动，成为你的客户。


    1995年，感冒药的竞争激烈，康泰克、 intersect... 康泰克、 rez... 1995年，感冒药的竞争激烈，康泰克、丽珠、三九等雄踞市场。这时，有一家叫盖天力的实力并不雄厚的药厂，也做了一款感冒药。但它想在感冒药这个用户的“心智阶梯”里，爬到第一、第二，比登天还难。


    盖天力苦苦寻找，终于找到了一个独特的销售主张：白加黑。这个理念其实很简单，它把感冒药分为白片和黑片，并把有可能导致人昏昏欲睡的镇静剂“扑尔敏”只加在黑片中。其他，什么也没做。


    但是，这个看似很简单的动作，却给盖天力找到了一个非常独特的销售主张：白天服白片，不嗜睡；晚上服黑片，睡得香。他们把这个销售主张，提炼成一句精炼的广告语：治疗感冒，黑白分明。


    这一下子，整个感冒药市场被震撼了。“白加黑”上市半年，就突破了1.6亿元的销售额，强行占领了15%的市场份额，获得行业第二的地位。这一现象，在中国大陆营销传播史上，堪称奇迹，又被称为：白加黑震憾。


    面对同样的市场，在消费者心中与其他感冒药几乎同样的定位，但是因为找到一个独特的销售主张，白加黑获得了巨大的成功。


    # 运用：场景


    场景1：M&M巧克力、劳斯莱斯


