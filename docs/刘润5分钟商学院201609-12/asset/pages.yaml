  md: '中国4000多家生鲜电商中，只有1%实现了赢利。虫妈邻里团现在几十个群，1.6万户人家，却已经赢利。赢利关键是，下了单再采购，库存时间最短；送到固定提货点，物流成本最少。


    # 运用：背后的商业逻辑


    我们知道，“销售=流量×转化率×客单价”。


    潜在客户通过某种渠道进入你的销售漏斗，比如进了你的门店，访问了你的网站，在微信里向客服咨询，就是“流量”。


    这个潜在客户可能会下单，也可能不会。有多少潜在客户，最后下单，就是“转化率”。你的商品，和客户需求的匹配度，很大程度上影响着转化率。


    下了单，会买多少东西呢？买完衬衫，有没有搭配一条领带？ py了领带，有没有配套一个袖扣？每一个客户，每一订单，消费的价格，叫做“客单价”。


    社群经济，为何让虫妈邻里团成为赢利的1%？不是因为它比天猫有更大的流量，而是因为，它卖的高品质生鲜水果，非常契合这个社群的共同点：追求安全、美味食品的邻居。所以在销售公式中，虫妈邻里团极大提高了转化率。


    同样的道理，这也是为什么罗辑思维能卖书。因为罗胖卖的书，契合了这个社群的共同点：求知好学的网友。你试试让罗辑思维卖水果，让虫妈邻里团卖书，效果可能都会大打折扣。


    # 小结：如何寻找社群经济呢？


    想要开始社群经济：


    +   第一，找到一个共同点；

    第二，用一个载体，比如微信群、公众号、网络论坛，聚集符合这个共同点的人群；

    第三，给这个人群提供最符合他们的共同点的商品。


