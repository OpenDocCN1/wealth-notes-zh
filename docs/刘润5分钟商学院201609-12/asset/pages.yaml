    # 小结：使用反向定制的几个建议


    第一，反向定制的 genshiqing，实行模块化。特别是3D打印之前，完全的定制，是无法工业化的。所以，所谓的定制，主要是基于对产品的模块化分解。你的产品，可以模块化吗？


    第二，反向定制的技术，是柔性化。所谓柔性化，就是通过改造生产线，能够实现小批量，最好是单件的生产，能够缩短生产周期，比如7天，甚至1天。小批量，短周期的柔性化，是反向定制的技术基础。


