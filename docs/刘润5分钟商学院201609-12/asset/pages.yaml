    # 客座教授 | 一切商业模式，都是为了赢得更好的性价比


    ![](img/111c10f049a8af8b2b739d47aff317cd_211_1.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这一周，我们请到了必要商城的CEO，毕胜。他曾就任于百度，历任总裁助理、市场总监等职务，2005年赴纳斯达克见证百度上市奇迹。2008年还曾创办乐淘网并任CEO。2014年创办全球首个C2M电子商务平台——必要商城，并担任CEO。


    必要商城采用的是用户直连制造的短路经济模式，它一头连着制造商，一头连着用户，去除所有中间流通加价环节，制造商按需生产，节约高额的库存成本，从而让用户只用平民价格就能买到顶级品质的商品。


    这一周，我们请他来分享一下必要商城这种新模式，究竟是如何做到高质、低价、零库存的？在提升用户满意度方面，他又有哪些解决之道？


    ![](img/111c10f049a8af8b2b739d47aff317cd_211_2.png)


    必要的销售主张是：以平民价格买到奢侈品的品质，我就是冲着这个在必要下了第一单。我想问的是：1）必要如何实现“奢侈品同等品质”？有驻厂代表吗？2）必要怎么说服奢侈品加工商腾出奢侈品生产线而来生产必要的订单？必要有哪些话语权来与厂商谈合作？


    必要的商业模式是平台模式，代表了大部分的互联网商业模式。我并不认为互联网背景的人去通过“驻厂代表”跨界做事情能够成功，每个领域都应该对其他的领域有着对专业的敬畏心，真正能保证产品品质的，有两部分，第一部分就是必要极度严苛的招商标准，它已经把生产工艺和技术以及背景不合格的制造商排除在外了。


    第二部分更重要的是这些符合标准的制造业的企业家都有着非常强的“工匠精神”，否则他们也不会在百万家制造业中被国际奢侈品牌选中，成为他们的OEM（俗称代工）或者ODM商（俗称贴牌）。他们不是作坊主，他们是有着很强前瞻意识的企业家，做经营方面，我们都是后辈。


    所以他们看到了给别人做代加工永无出头之日，他们拥有良好的背景，成熟的管理，强大的团队和技术能力，最终让他们决定做C2M的，不是必要，而是经济发展到今天的“必然”，把他们多年的管理，设计，制造经验来打造属于工厂自己的品牌，这是一条“必经”之路。必要团队只是做了这件事情的催化剂，而并不是说服他们来做这个模式。


    不可否认，必要上线初期用户很少，订单量的确非常小。当时必要就三个合作伙伴，大家本着对C2M，也就是“订单驱动反向生产”这个模式的憧憬，通过用户的订单反向驱动生产，所带来的上游供应链如原材料、配件等的整合无疑是一次对制造零售业的重构，但我们共同克服困难，熬过了最初的阶段，而现在必要的用户量所产生的订单对于制造商来说，已经不是小批量的概念了，必要绝大部分合作伙伴的产能都已经饱满，并面临着产能扩充的问题。


    至于你说的如何保证厂家的生产质量稳定方面，除了上述两条之外，我们会依靠数据，凡是退货率超过5%、差评率超过1%的产品系统自动下架。这个标准还在逐步收紧。顺便说一句，即便是反向生产，用户在必要上也享受七天无理由退换货服务。


    现在必要种类越来越多了，但是由于模式是订做的，等货周期比较长，是否考虑用什么手段来提高效率缩短生产周期？客服人员那块有点欠缺，采取什么措施提高客户满意度？


    必要之所以叫“必要”，就是我们在品类上选择“必要”的品类，覆盖用户80%的日常必需品，打造消费类目的头部。为了确保商品品质，商家一般设定生产周期的时候都相对保守，实际上没有在必要商城页面上标注的那么长，一般都能在7
    ~ 15天内完成。明年一季度生产周期还会再次缩短。


    客服问题确实是一个非常好的问题。必要上的商家均为制造业出身，在与必要合作做C2M模式前，没有对终端用户服务的经验。所以我们在客服问题上一直存在短板，制造商各自为战地分散式服务又存在服务界面不统一的问题。于是，今年10月份我们采用了集中“中央”客服的模式，由必要的客服团队统一对用户进行服务，因为刚刚上线，所以还存在客服和商家的磨合问题，不过会越来越好的。


    同时借5分钟商学院这个平台明确下，必要做的不定制，c2m的核心是反向生产，定制只是这里边很小的一部分。


    必要商城刚推出来的时候肯定是个新物种，而且必要商城的营销主要是口碑相传，那么必要商城的第一批用户是如何培养出来的？请问毕总介意把创业初期遇到的最大困难及如何解决的经验分享一下吗？


