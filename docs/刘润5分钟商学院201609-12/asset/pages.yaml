  md: '# 036 | 你陪客户喝酒，是因为做产品没有流汗


    接下来四周，我将从产品、价格、营销、渠道四个角度，系统性地破解一家企业的具体商业行为。


    # 概念：企业能量模型


    企业经营，就是一个能量生产、能量转化的过程。产品生产势能，营销和渠道，把势能转化为动能。


    想象一下，一个人正在推巨石上山。做产品，就是把这块千钧之石推上万仞之巅，获得尽可能大的势能，然后在最高点一把握推下去，用营销和渠道减小阻力，把势能转化为最大的动能，获得尽可能深远的用户覆盖。


    ![](img/111c10f049a8af8b2b739d47aff317cd_124_0.png)


    前段时间，在后台留言里，我看到一则提问，大意是这样：我在某个传统行业里，看不到前景。第一：原材料价格高，导致利润下降；第二，市场饱和，进入者太多，导致价格下降；第三，业务全靠关系，有时还拿不到钱；第四，人才很难找，工资高还没有责任心。请问，我应该如何借助互联网，找到出路？


    每次看到这样的问题，我都会深深叹一口气。很想帮助他，但不知道从何说起。他的问题是互联网可以解决的吗？商业的世界很美妙，但也有弱肉强食的残酷一面。可对不少弱肉来说，他们的问题首先不是弱，而是根本不知道自己弱在哪里。


    他的根本问题是产品势能不足。然后产品不足，营销补；营销不足，渠道补，最后只好陪客户喝酒、吃饭、搞关系，但还是卖不出去。喝酒、吃饭、搞关系都卖不出去的东西，互联网，也帮不上什么大忙。


    对“企业能量模型”不偏不倚的自我认知，是如此重要。弱肉必须知道自己弱在哪里，才能变强。


    # 运用：如何把企业做好？


    第一，把产品这块巨石，推得越高越好。产品的创意、独特性、品质，或者说它积累的势能，决定了它最高可以达到的销售量级。没有势能的产品，是卖不出去的。就算能卖几件，其实卖的不是产品，是人情。


    第二，然后你在山顶一推，巨石开始下滑，势能转化为动能。营销，就是用来减小下滑的阻力。广告、公关、线下活动、热点营销、加入行业协会，去拿各种奖项，都是为了提高客户对你的优先选择概率。


    第三，巨石开始水平滚动。这时，你用渠道继续减小阻力，通过大量铺设渠道的方式，线上、线下，电话、互联网、上门推销，甚至达到田间地头的方式，让消费者一旦有了购买欲望，你的商品就触手可及。


    产品、营销、渠道，这三件事情，哪一件最重要？其实这个问题是有问题的，我们只能问，这三件事情，哪一件“对你”最重要？


    # 小结：理解“企业能量模型”


    首先，你要有个不偏不倚的自我认知，理解自己的能量水平，和转化效率。


    接着，思考，产品、营销和渠道，到底哪个，对我来说是最重要的。


    然后，有目的地加强最重要的部分。


    ![](img/111c10f049a8af8b2b739d47aff317cd_124_1.png)


    # 得到专栏·5分钟商学院


    主讲人：刘润


    基于“企业能量模型”，对标业内在产品、营销、渠道分别做得最好的公司，假如满分100分，你会给你自己的公司，分别打多少分呢？这三件事情，哪一件“对你”最重要，值得大力提高呢？

    来和我一起过招吧。


    白鸥，有赞创始人兼CEO


    他创立的有赞是一个商家服务公司，通过产品和服务，帮助互联网时代的生活人管店、管货、管人、管钱，让生意更好做。目前有三百多万的商家正在使用有赞的服务，这些服务包括在微信和微博开网店、线下门店的收银和会员管理、优惠和营销、库存管理等等。除了有赞，白鸥还是有UCDChina的发起人，一个专注研究和深入探讨“以用户为中心的设计”的组织。


    你这位CEO有什么问题想问他，欢迎在留言区提出出来，我们将挑选一个最有价值感的问题，请白鸥认真回答，并在本周学习结束的时候，公布这个CEO问CEO的结果。


    ![](img/111c10f049a8af8b2b739d47aff317cd_124_2.png)


