  md: "# 周末小结｜谈一谈为什么是每天5分钟？\n\n![](img/111c10f049a8af8b2b739d47aff317cd_173_0.png)\n\
    \n《5分钟商学院》的同学们，\n\n周末好！\n\n不知不觉，我们已经一起学习了50期的内容，再有15期的内容，我们第一季商业篇的内容就要结束了。\n\n\
    今天我们来聊一聊，为什么是每天5分钟？\n\n先说下我的工作方法，我花了两周的时间，把多年的积累融汇在那张包含了260期内容的巨大课表中，这张课表，目前已经调整到了第14版，还在不断优化中。具体到每篇文章，我会先琢磨出大概200字的提纲和要点，然后整理出20000字的素材，之后，最花时间、也最痛苦的事，是不减内容、减字数，把20000字变成2000字的录音稿，这大概要花3~5个小时。最后，花1个小时进行录制，保证最好的效果。\n\
    \n我花那么多时间，就是为了帮大家省时间。\n做个巨大的挂钟不是本事，把挂钟塞到手表里，才是本事。名贵手表，比挂钟值钱得多。\n\n最近，我在录制商业篇内容的同时，已经开始第二季管理篇的内容筹备了，有了这50期的经验，我在原有课表的基础上继续深入优化内容，希望带给大家更多的收获。\n\
    \n这个过程确实不易，很辛苦，但我自己也迷上了和大家共同学习成长的感觉。每天花时间浏览回复大家的留言，与来自各行业的学员过招，对我也是一个很大的提升。\n\n\
    很多同学留言说，某期的内容被用在他们的生意中，已经看到了明显的改善效果；还有同学说，从每天的学习中，感受到了自己的变化和长进。每每听到这些，我都像被充电一样，再忙也觉得精力满满。\n\
