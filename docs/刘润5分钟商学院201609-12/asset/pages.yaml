    # 苏伟 6


    如果无法在现有品类中成为第一，那就开创一个新品类并成为第一。比如汇源开创了高浓度果汁的品类，而鲜榨多就开创低浓度果汁的品类，美汁源开创果肉果汁（果粒橙）的品类。

    果冻品类的喜之郎，海带品类的美好时光都不是第一个进入市场的，但通过大量的广告宣传，成功成为消费者心智的品类第一。类似占据消费者心智阶梯首位的还有康师傅的方便面品类，瓶装绿茶、冰红茶品类，而康师傅推出的低浓度果汁品牌“鲜的每日C”，始终不如鲜橙多，因为鲜橙多已然占据了消费者心智的阶梯首位。所有的品牌，在消费者的认知里，并不是均等的，而是阶梯式的，在这个阶梯上，消费者会自动排序，排在第一位的，才会被消费者接受认可，排序的依据是品类。这样来看，营销抢占的不是市场，而是消费者的心智。

