  md: '# 068 | 把合适的人，放在合适的位置上


    # 概念：知人善用


    知人善用，就是清晰地认识到每个人都是不同的，要把合适的人，放在合适的位置上。


    有某公司营销部门的负责人A，手下有上百位员工。你知道，销售队伍，年龄不同，性格各异，但个个都是人精。直到有一次，他面试了一位下属B。


    这个B同志，从简历上看，真是很平庸，乏善可陈的几段经历，看上去也不是很顺利。很多面试者都自信心爆棚，滔滔不绝，但他总给人的感觉不自信。本来都要否掉了，但突然看到他的简历中有ylum一处很特别：高中复读了四年，最终考取大学。


    A决定录用了B，并对他说：“你一定能成功！” B很惊讶，A说，“你复读了四年，终于考上大学，说明你非常有毅力，非常执着，有这种精神，做什么都能成。”于是，A把最难啃、最难伺候的大客户都交给了B。后来，他几乎搞定了全部这些客户，还开发了几个很有价值的新客户。B的工作方法很简单，就是坚持不懈地去与客户沟通。甚至有客户说，每天他接到的第一个电话，都是B打的，被他的诚意和坚持打动，开始信赖公司。现在，这个B，已经是某分公司的副总经理了。


    A所做的，就叫做：知人善用。


    # 运用：洞察差异性


    第一，因人不同。


    人生来平等，但又生而不同。了解差异性，不要怕功夫袋，试着借助一些前人的思考，现在成的工具。比如MBTI。我在微软刚开始管理团队时，被要求在网上做了200多道关于判断和取向的题。拿到报告，我非常惊讶。我一直以为自己是外向的人，但其实不是，我的外向，是职业一刀一刀雕刻出来的有效行为，但我的能量，其实来自于安静地思考。


    第二，因时不同。


    不但人与人之间是不一样的，同一个个人随着时间的发展，也会变得不一样。刚进公司的时候，通常热情高涨，但能力不行。这时，不要急着对这个人下定论。随着时间的推移，他的能力可能会越来越强，但是热情会削弱。这时也不要急着对这个人下定论。作为管理者，你应该调整自己，学会在不同的时间，用不同的方法，管理同一个人。我们把这叫做：情景管理。


    第三，因地不同。


    这个地，指的是环境。他与直属老板是否相处和睦，直属老板是一个人工作状态的几乎决定性因素；他与周围的同事是否能力互补，这件事情的愿景、目标，以及对应的流程和管理方法，是否能释放他的能力。这种人和地的匹配性，可以通过有效的1:1沟通，来不断了解和磨合。


    # 小结：认识知人善用


    激发善意，设计系统，还是不够的。管理，要“知人善用”，就是把合适的人，放在合适的位置上。要理解“合适”，就要先理解“不同”，因人不同，因时不同，因地不同。


