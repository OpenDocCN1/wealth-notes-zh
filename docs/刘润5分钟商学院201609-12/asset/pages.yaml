  md: '# 026 | 居民越节约，国家越贫困吗？


    今天开始，我们将进入宏观经济学的领域。这个领域，比我们前面讲的所有内容都要更抽象、更复杂，让人费解。在这个领域，有些是知识，有些只是观点，甚至有些只能说是推测和猜想。所以，你会发现宏观经济学的世界里，抢架的特别多，再厉害的大师，都会被骂得狗血淋头。有人把宏观经济学和微观经济学的关系，比作中医和西医，许少年甚至直截了当地说：宏观经济学，就是伪科学。


    所以，这一周期我们讲的东西，都只是观点，不代表真理，你一定要批判地听。


    本周内容特别鸣谢：南京大学经济学吴清教授


    # 概念：节约悖论


    节约悖论就是，对国家来说，越节约越穷，越消费越富。


    为什么会出现节约悖论？


    宏观经济学中有一个重要的概念：GDP。


    GDP，它的中文名是：国内生产总值，是指在一个时间段内，一个国家生产的全 部产品和服务的总价值。它被公认为衡量国家经济状况和财富的最佳指标。


    # 辩论：正方 VS 反方


    正方：凯恩斯认为，越节约，越衰败。


    反方：居民不消费，把钱都用于储蓄，但储蓄的钱，也会被银行用贷款的方式，转移到企业手里，用于增加投资。投资也是GDP的一个部分，还顺便解决了就业。


    # 小结：认识几个基本概念


    +   1. GDP。GDP，就是国内生产总值，一个时间段内，一个国家所生产的所有产品和服务的总价值。它的计算方法通常是：消费，加政府采购，加净出口，加投资。
