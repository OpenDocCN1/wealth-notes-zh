    洁然自乐 4

    迄今为止，我同时接受了两种看似相互矛盾的思维方式。一种是思维方式是“最小可用品”，即以最小的代价不断试错、然后纠正、然后迭代升级；另一种思维方式是“尽可能一次性把对的事情做对，少犯错”。看似矛盾，实则在不同的阶段、不同的领域两种思维方式各自发挥着作用，并且两者殊途同归，都是以最小的成本和代价取得最大的功效。从人类个体成长为例如，在小孩年幼的时候，家长要允许他多探索、允许他犯错，因为这个时候犯错的代价和成本是最小的，当然，犯错后对其教育纠正，才能真正促进小孩成长。如果怕小孩犯错而禁止其这不能碰、那不能动，那小孩永远没有从犯错中吸取教训的机会，以后只会摔得更惨。而随着年龄渐渐增长，有了独立的思考、能够对自己行为负责，并且承担着越来越多的家庭责任和社会责任时，试错的成本和代价越来越高，所以要“尽可能一次性把对的事情做对”，但什么是对的事情？如何一次性把事情做对？那也是一次次学习、大脑升级过程中逐渐明白的道理。

