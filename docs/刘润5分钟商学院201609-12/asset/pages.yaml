  md: '# 周末小结｜10天，2万人入学，最大规模私人商学院在这里


    ![](img/111c10f049a8af8b2b739d47aff317cd_20_0.png)


    《5分钟商学院》的同学们，


    长假结束了，开工顺利！


    先分享一个消息：过去10天，《5分钟商学院》的订阅人数突破了2万人。


    你们中的每一个人，都参与创造了一个纪录。


    传统商学院，一个MBA班的规模是50人。《5分钟商学院》，相当于给400个MBA班同时上课。


    我们一起撑起了迄今为止最大规模的私人商学院，创造了商学院的教育历史。


    谢谢你们！


    # | 重磅预告


    索性再一起玩把大的，我们模拟下传统商学院的做法，一起来个专题讨论：


    结合前面两周学习的内容，如果你是小米生态链的战略指挥者，你觉得什么样的产品适合进入小米生态链？


    你对此有什么想法，欢迎在今天的留言区提出，我邀请了小米联合创始人兼生态链负责人刘德担第三周的客座教授兼本次讨论的评审，对提出有 обсу建议的同学，将送出小米充电宝一台。


    # | CEO问CEO


    这一周，我们特别邀请到了2015年最佳APP、移动健身工具Keep APP创始人王宁，他用了不到一百天的时间、接近零成本的运营，让一款垂直小众的健身应用迅速收获了200万量级的用户规模，如今这款APP的总用户量已经超过5000万。


    我们请他挑选了一个大家关注度最高的问题进行回答。


    如何在尽量花钱的前提下，实现APP用户规模的迅猛增长？


    这是我第一次创业，很难给出普适性答案，我就以自己在做的Keep为例，谈谈我们在发展过程中经历的三个标志性阶段：


    +   1、 上线初期冷启动 用户数从0到4000再到几十万


    首先从“简单”入手，在App上线前1、2个月，我们就开始运营新媒体账号。好的内容永远会得到好的传播。我们的内容编辑团队，每天绞尽脑汁地撰写优质的原创内容，目的就是希望得到用户的喜爱和传播，让自己的新媒体账号可以快速获取更多的曝光和关注，也为App上线做铺垫。


    开始要耐得住寂寞，因为早期的关注度不是很高，要慢慢沉淀内容和口碑，一点点积累，优质的内容一定会换取好的回报。我们差不多运营了2个月，App上线之初，新媒体账号已经累计积累10W+粉丝，在垂直领域有一定“声量”。


    紧接着，我们锁定了近百个目标用户关注和喜爱的垂直社会化媒体，比如百度贴吧（健身吧、减肥吧…）、豆瓣小组、微信减肥健身互助群、QQ减肥健身互助群，在这些地方密集“播种”，长期连载很多用户健身经验的干货内容，还是靠内容驱动，让优质内容汇聚人气，由此培养积累了一大批固定粉丝。


    当产品App正式上线时，我们将这些帖子同时引爆，几乎在一夜之间，告知读者这些饱含价值的经验都是通过一款名为Keep的App来维持的。那段时间，我们成了健身圈里大家热议的对象，Keep在iOS渠道的日下载量也达到了4万以上。这对一个刚刚上线的App来说是一个巨大的新增数据。


    同时，我们还举办了“首席内测官”的活动，让一部分活跃的核心用户得到优先体验机会，这些活跃用户也是得益于早期新媒体中活跃的粉丝群体，他们获得了“内测”的机会，会很积极地体验并且把口碑传播给其他用户，我们就这样快速获得了核心圈层的扩散。


    我们基本是用上述三个方法，让Keep在早期冷启动的时候，打下来坚实的基础、也获得了核心圈层用户的喜爱。


    +   2、 快速成长期 用户数从几十万到数百万


    这个阶段的心法是：要善于利用核心用户的自传播性，让产品快速获取第二圈层用户，继续扩大用户群体。


    “口碑传播”是最好成长方式。好的产品是根基，好的运营是加速器。健身和减肥的用户，本来就是一群愿意分享和传播的用户，利用最初期的用户来帮助我们做口碑传播，是这个阶段最重要的方法。


    在Keep的产品里，运动后用户是可以打卡并且分享到朋友圈的，我们通过对产品的设计，增加和刺激用户的分享热情，比如我们会在每次结束一节课程、你大汗淋漓的时候，LI促你分享到朋友圈中，找到和你一起流汗的同道中人。我们会增加滤镜的美观度，目的是可以分享更漂亮的运动图片到朋友圈等。同时运营方面也可以设计策划了很多刺激分享的小活动，花了很多心思来鼓励用户使用和分享到自己的社会化媒体中。这些方法都是一个目的，就是“借力打力”，借助活跃用户的力量，借助他们的朋友圈，来用口碑和实际行动来影响更多的新用户。


    +   3、 产品成熟期 用户数从数百万到6000万


    这个阶段，我们的用户规模已经超过了千万规模，其实产品已逐渐走向成熟期。首先我们需要找到增长的核心点在哪里？通过数据团队和产品团队的调查分析，我们发现： Keep在最近半年一直保持着日均近20万的自然新增用户，而这些新增的来源占最多的是“口碑”，即受到老用户的推荐而主动搜索下载。


    既然是老用户的口碑传播，那我们觉得一定是“品牌性”的影响，用户深爱这个品牌、这个平台、这个App，才会将它积极地分享到自己的社会化媒体中，让更多的人去关注。所以，为了让这些老用户更积极、更加深爱Keep，我们选择做了“品牌营销”，花费数千万来拍摄与投放广告片，目的是让老用户可以与我们有更多精神层面的共鸣，同时强调Keep“自律给我自由”这个品牌精神，即获得了用户新增又获得了品牌曝光，一举两得。'
