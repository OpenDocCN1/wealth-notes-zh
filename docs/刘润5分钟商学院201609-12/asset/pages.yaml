    我想，这个并不能单单就政府还是市场的单方面问题，就像目前以中国为代表的政府主导和以市场为主的美国，早就不单纯依靠政府或者市场发展至今的，政府和市场早就相互交融。所以，我认为真正应该具体问题具体分析，首先就优就劣，我们要分清着针对哪些产业哪些领域。从世界各地的经济发展经验上看,成功的产业政策通常发生在后发国家学习和模仿发达国家工业部门的过程之中,而失败的产业政策通常发生在那些新兴行业或者处于技术前沿的行业。为什么日本扶持汽车产业的政策比较成功,而扶持家电产业的政策比较失败?从历史和逻辑上讲,像汽车、轮船这样的传统工业具有比较稳定的产业发展和转移规律,甚至可以说发达国家的今天就是发展中国家的明天。对于工业部门来说,发展路径比较稳定,发展方向比较明确,但同时存在初始投资大、生产周期长、配套环节多的共同问题。这些问题恰恰都可以通过一个“集中力量办大事”的强有力政府来协调解决。在中央政府的产业政策干预下,政府可以集中有限的资本投入重点行业,可以通过建设基础设施解决企业发展所需的配套条件和外部性问题。因此,凡是模仿型产业政策,只要能够解决官员的激励问题,通常比较容易成功。符合这类产业政策的正面案例,除了工业部门,还有那些享受优惠政策的出口加工区、保税区和经济特区等。相反,如果政府想在那些快速变化的新兴行业或者处于技术前沿的行业推行探索型产业政策,就往往容易遭遇失败,不管是发达国家还是发展中国家都不例外。一旦产业发展的规律具有不确定性,技术变迁日新月异,连处于市场前沿的企业家都难以捕捉,都需要承担失败的风险,为市场运行提供后勤保障的政府官员可能更无法先知先觉。以彩电行业为例,关键的显示屏技术变化多端、竞争激烈。日本厂商开发等离子技术时,根本没有预料到液晶技术后来居上,以至于贻误了商机,错失了大片亚洲市场。所以我想对于模仿型产业政策,后发国家在追赶过程中仍然需要,但是对于前景不明的探索型产业政策,一定要慎重使用,应该将产业的选择权交给市场。

