  md: '# 客座教授 | 大数据时代最牛的“裁缝”


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们迎来了一位美女总裁，红领集团总裁张蕴蓝。她将原本传统的制衣流水线改造成为一座信息化的大规模定制工厂。顾客可挑选喜欢的服饰款式、工艺、风格、细节，通过技术手段完成流水线上不同数据、规格、元素的灵活搭配、自由组合，从而高品质、高效率地制造出灵活多变的个性化产品。


    很多人都想找她讨教，如何才能像红领集团一样，开创出一<|start|>智能生产的新模式，从而有效解决了库存和差异化的问题。这一周，我们请她来分享一下其中的门道。


    ![](img/111c10f049a8af8b2b739d47aff317cd_190_0.png)


    我有两个问题，第一，满足哪些特征才能像红领西服一样打造出一條柔性并智能化的供应链？第二，企业转型有时候更大的阻力是来自于企业内部管理和文化的变革，请问张总在红领转型时是如何解决的？


    红领的模式，是先把西服拆解成很多模块，领口是一个模块，袖口是一个模块，收不收身是一个模块，口袋是一个模块。每个模块提供很多选择，扣子有很多种，面料有很多种，面料裁剪的方法有很多种。消费者可以任意选择排列组合的方式，模块化越精细，排列组合就越多，个性化定制的程度也就越高。


    其实所有的企业都可以打造成为柔性智能的供应链，先对产品进行模块化分解，再通过技术改造，用工业化的效率完成大规模的个性化生产。尤其是那些供应链长、产品多样化、生产复杂、市场变化大的消费品行业，最适合也最需要做柔性的供应体系。因为这样的企业最需要流程再造、组织再造和数据驱动，也是最迫切需要解决的问题。而库存、设计、营销、成本、竞争力量等诸多问题只是表象。我们要从过去注重“提高生产效率”转向“提高全要素的效率”。


    的确，最大的阻力来自内部。我们的企业一直秉承源点论思想（源点在战略指愿景，在战术上指需求），所以，企业文化一直是延续的。在管理上的变革受到的阻力先通过思想工作，让大家明白我们做这件事情对员工一定是有好处的，不这样做早晚会没有出路；第二是要保障员工的利益不受损害，让大家没有顾虑，大家目标一致的共同努力去完成，而不能形成太多的对立面；第三是通过不懈努力让大家能看到改变的成果和成效。


    红领如何做到在个性化定制的同时维持和批量生产差不多的成本？


    C2M个性化大规模定制：以先卖后做的方式，解决了库存的问题；通过众包、众创的方式，以非常低的成本甚至免费的方式，解决了传统方式在设计、研发方面的高投入；


    通过数据驱动的方式，打通了C和M，可以让消费者和供应链直接交互、交换、交易，去掉了中间商、渠道商和代理，减少了渠道和推广费用；通过内部组织体系的变革，去科层、去部门、去审批、去领导化，大幅度减少了管理人员，降低了成本，提高了满足消费者需求的能力；


    通过工序、工艺、工时、工价的高度标准化、数字化，实现了生产过程的全数据驱动，员工变成了“机器零件”，降低了企业对熟练工人的依赖度；通过供应链体系的变革，提高了全要素的运行效率，实现了原辅料的实时管理和零库存。


    分享一本我最近正在看的书，黄冠华的《观念——一个第二代企业家的思维》，能从书里看到我个人成长的一些影子。


