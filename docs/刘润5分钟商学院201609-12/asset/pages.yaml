  md: '# 040 | 用最快的速度、最低的成本犯错


    # 概念：最小可用品


    最小可用品，是《精益创业》里提出的一个，通过做能满足最基本功能的产品，不断接受用户反馈，快速迭代，直到做出真正符合需求的好产品的方法论。


    小米公司2010年成立后，推出了一款基于安卓深度定制的智能手机操作系统，叫MIUI。因为MIUI很符合中国用户的习惯，推出后，在发烧友群体中，引起了巨大的反响。


    也因此，小米在推出手机产品的时候，使用了一个非常重要的策略：操作系统每周更新。周五，小米公司通过互联网推送更新。然后，狂热的发烧友们率先使用，并积极地和小米互动，提出很多修改意见。小米收到后，快速修改，第二個周五，再推送一个新版本，如此往复，似乎从不间断。今天的MIUI，不是小米工程师设计出来的，而是和用户共创，自然生长出来的。


    # 运用：“最小可用品”的逻辑


    场景1：甚至可以不是一个产品


    硅谷有一家做文件分享的云存储公司，叫做Dropbox。它的创始人有这个想法后，并没有立即组织团队把产品开发出来，然后到处宣传。创业非常大的一个忌讳，就是爱上自己的想法，而不是爱上用户需求。所以，他找人拍了一段3分钟的视频，他亲自做旁白，演示这个想法。这段视频，引起了几十万人的关注，大量的都还不能叫用户的关注者，给他提意见，让他了解用户的真实需求。产品公测版的排队名单，从5000人，一夜之间涨到了75000人。这段视频，就是“最小可用品”，用最经济的方式，最快速度的犯错，并且纠正。


    场景2：也可以尝试小范围的试用


    美国有一家叫做“桌上美食”的美食定制公司。他们打算通过系统，计算出最匹配每个家庭的食谱，然后，通过这些食谱，卖打折食材。你一眼就能看明白，这个商业模式最核心的地方在于，系统算出来的食谱，靠谱吗？


    在最开始的时候，公司好不容易找到一位早期使用者，CEO每周都亲自登门拜访，人肉分析其喜好，给他配食谱，然后听取反馈。这么看似很低效，但是却对这个“系统”的算法，起到很大帮助。随着顾客越来越多，团队无法人肉服务时，规模化、标准化才提上日程，最终打造出了一款影响力巨大的服务产品。


    明知会犯错，在少部分人那里，用最低的成本不断摔倒，再从用户的真实反馈里爬起来，才有机会做出真正受欢迎的产品。


    # 小结：两点要注意


    第一，不要认为你真的了解你的用户。乔布斯也许可以，但大部分人不是乔布斯。既然不了解，一定要犯错，就抛出最小可用品，最快地，最低成本地犯错，然后再最快地改正。


    第二，也不是所有行业都适合用“最小可用品”的逻辑。我给大亚湾核电站授课的时候，看到他们墙上贴着一张海报：一次性地把事情做对。说得好，我很难想象，大亚湾核电站用“最小可用品”的逻辑做核电站，是什么样的场景。


    ![](img/111c10f049a8af8b2b739d47aff317cd_131_0.png)


    明知会犯错，在少部分人那里，用最低的成本不断摔倒，再从用户的真实反馈里爬起来，才有机会做出真正受欢迎的产品。


