    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了百度副总裁、百度糯米公司总经理曾良。他曾任微软（Microsoft）大中华区副总裁，全面负责微软在大中华地区针对政府、教育、医疗等重点行业的战略、业务拓展和运营。现任百度副总裁、百度糯米公司总经理，致力于在移动互联网时代连接人与服务，打造O2O生活服务平台。


    这一周，我们请他来分享一下，在O2O全面渗透大众生活的今天，百度糯米是如何进行商业布局的？


    ![](img/111c10f049a8af8b2b739d47aff317cd_244_0.png)


    我对百度的了解基于互联网搜索，突然间有一天在大街小巷看到百度外卖，请问百度出于什么考虑？会不会让人感觉焦点模糊？和美团、大众点评的差异化在哪里？


    毫无疑问，百度搜索是全球最大的中文搜索引擎，但随着移动时代的到来，尤其是O2O市场的发展，让我们意识到，百度不仅仅能够连接人与信息，也能够连接人与服务。从搜索信息，到社交娱乐，再到服务消费，对于互联网，其实用户是有更多的期待与需求。


    举个例子，在搜索发展的过程中，我们发现用户在搜索完信息之后，还需要花时间去寻找更多能实现自己想法的渠道，比如你下班想找个餐厅聚会，在百度上搜索离公司最近的、比较好的饭店，找到了之后你还要打电话到店里询问，再上团购网站上去购买优惠券；再比如，你打算假期带家人出游，在百度搜索查了比较适合出游的目的地之后，你需要再登录旅游网站上去订机票、酒店，以及再到其他平台上去查看评论等，来回花费的时间和精力大家可能都深有体会。


    所以我们就在想，我们能不能让自己的用户“搜而有所得”成为新的突破点。正是基于此，百度糯米、百度外卖应运而生，现在你搜索附近的餐厅，可以直接下单，一键预订；搜索旅游目的地，同样可以直接订机票、酒店，查看相关评价和内容介绍。在O2O全面渗透大众生活的今天，应用大数据分析能力及技术优势，提供最“一站式”便捷生活服务成为百度的一个全新的、重要的使命，百度也从“连接人与信息”逐步升级到“连接人与服务”。'
