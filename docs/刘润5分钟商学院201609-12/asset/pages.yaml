    # 客座教授 | 做商家背后的服务者


    ![](img/111c10f049a8af8b2b739d47aff317cd_134_1.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这一周，我们迎来了有赞创始人兼CEO，白鸦。


    有赞是一个商家服务公司，通过产品和服务，帮助互联网时代的生意人管店、管货、管人、管钱，让生意更好做。目前有三百多万的商家正在使用有赞的服务，这些服务包括在微信和微博开网店、线下门店的收银和会员管理、优惠和营销、库存管理等等。除了有赞，白鸦还是UCDChina的发起人，一个专注研究和深入探讨“以用户为中心的设计”的组织。


    这一周，我们请他来分享一下，有赞是如何凭借强大的系统能力服务好微信商户的？


    ![](img/111c10f049a8af8b2b739d47aff317cd_134_2.png)


    微信商城中，体验最好的就是口袋通（现在的有赞）。我的问题是，做这种方案平台很多，有赞是如何杀出重围的？是靠精准的用户需求把握，还是靠快速的技术迭代？


    本质上“微商城”是一个企业服务项目，企业服务的核心目标是为客户创造价值，需要具备的核心能力有三个：打造足够强大系统的能力、足够好的服务能力、获取客户的能力。


    有赞最强的是“强大的系统能力”，因为“微商城”这个系统牵扯到一般企业服务没有的商品库存、交易订单、资金结算，这三东西比一般的信息系统要复杂很多，因为它在并发、系统交互、安全性、准确性、实时性的要求上是普通信息系统的百倍有余。这源于有赞的产品技术团队拥有极其丰富的电子商务和支付经验。


    在“服务能力”上其实并没有谁比谁天生更厉害害，它取决于这个企业的服务文化和整个企业的核心价值观取向，我们从第一天就非常重视这些“软性”的东西，也很擅长把它做实。比如，我们为每个客户配专门的“客户经理”，把客户经理的手机和微信给到客户；比如，我们要求客服的目标是不管能不能满足客户的需求，一定让客户满意，于是我们的不叫“客服部”而叫“客户满意中心”。很骄傲，这些小小点我们一直很坚持，而且做的比同行们好出很多。虽然我们一直觉得自己还不够好。


    事实上 有赞最不擅长的就是“卖”，我本人和我们整个团队都没有很好的销售经验，我们在边走边学习。非常幸运的是，我们面对的这些客户被“销售技巧”影响的并不大，他们更在乎同行和朋友们给他的“口碑评价”，当他们做类似的朋友“该选哪个微商城”的时候，大家都会推荐有赞，于是我
    们就这样获得了很多的客户，到今天为止我们有超过60%的客户来自于老客户的推荐。


    因为有赞的方便，我现在会经常在微信公众号上买东西。请问您对有赞未来定位是什么？是一个工具还是什么？


    感谢对于我们系统体验的肯定，这确实是我们擅长的地方（我脸没红）。


    我们对于有赞的定位一直都非常明确：“有赞是一个服务商家的公司，我们通过自己的产品和服务，帮助互联网时代的生意人，让他们的生意更好做”。


    和麦肯锡这些服务大企业的公司不同，有赞的客户主要以中小企业为主，大家的需求更加趋同。“范标标准化”是中小企业服务的趋势，就好像一个好的收银机可以满足所有小卖部需求一样。


    中国在线零售生态是整个宇宙最优秀的，我们有淘宝、天猫、京东、美团、饿了么、唯品会等等优秀的平台，我们不再需要多一个淘宝也不在需要多一个京东，因为他们已经足够强大了。但是这些优秀的零售平台，都是给商家带去订单和消费者的，商家还需要有人站在他们的背后给他们提供服务，帮助他们管店、管货、管客、管钱，有赞希望扮演这样的角色。


    推荐一本书，《清教徒的礼物》。这本书又名“硅谷前传”，它从二战后美国人帮助日本科技发展起来开始讲起，到美国清教文化的历史，很好诠释了硅谷英雄们之所以成为英雄的底层缘由。作者也深度剖析了“崇尚数字管理”如何令很多大企业奄奄一息，经理人和专家文化对企业发展的危害。


