  md: '# 059 | 像病毒一样传播


    ![](img/111c10f049a8af8b2b739d47aff317cd_205_0.png)


    059 | 像病毒一样传播


    # 概念：引爆点


    美国作家马尔科姆·格拉德威尔在2009年出版了《引爆点》一书。他在书中提到，想要引爆传播，有三个法则：个别人物法则、附着力因素法则和环境威力法则。


    个别人物法则，就是在社交网络的六度空间中，那些真正的超级传播者。这样的人有三种。


    第一种，叫联系员。你总有一些朋友，“什么人都认识”。他们像收集邮票一样的认识朋友，并且花费巨大的精力和他们保持联系。他们是六度空间中的重要传播节点，这个角色可以把信息最快地散布出去。


    第二种，叫内行。你也有些朋友，“什么事情都懂”。他们对某项知识特别有研究，也很乐于把这些知识与身边的朋友们分享。他们的朋友们在这一事情上，都非常信任他的判断。


    第三种，叫推销员。你估计还有一些朋友，“什么人都能说服”。他们也并没有很深的知识，但是就是有种神奇的能力，就是所谓“现实扭曲场”，总是能说服身边的每一个人。


    附着力因素法则，就是有一些特别的方式，能够使一条具有传染性的信息被人记住。只要在信息的措辞和表达上做一些简单的修改，就能在其影响力上收到显著的效果。


    环境威力法则，就是当你身处一个大环境的时候，你都不知道自己怎么就这样了。


    有一本著名的书，叫做《乌合之众》，它的核心观点是，虽然每个人可能都是理性的，但是个人一旦融入群体，他的个性便会被 Archivo ，群体的思想便会占据绝对的统治地位，而与此同时，群体的行为也会表现出排异议、极端化、情绪化及低智商化等特点。


    也就是说，人会被环境，在互联网时代，尤其是被“情绪环境”所影响，自己却不知道。


    每次互联网上出现热点事件，群众的关注度、事态发展、情绪走向，就相当于出现了一个不断变化的“环境威力”场，抓住公众热点和情绪的信息，特别容易获得传播。


    # 运用：案例


    运用1：个别人物法则


    今年罗永浩发布了最新款的锤子手机，整个发布会一如既往的精彩。但是，他的手机发布会，却意外捧红了一款应用：讯飞输入法。他在发布会上说，讯飞输入法，“由于一个错别字都没有，甚至显得有点假”，这就是“一个语音输入法正确率达到97%时的壮丽景观。”


    发布会后的一夜之间，讯飞输入法在应用商店里冲到了工具榜第三位，成为排名最高的第三方输入法！


    讯飞输入法之所以能引爆，不仅仅是因为产品好。产品好，从传播的角度来说，是不够的。或者说，至少是不够快的。想要快，就要找到类似于罗永浩这样“个别人物”。


    罗永浩是难得的三种特质兼具的人。他推荐的产品，能不引爆，都很难。


    运用2：附着力因素法则


    一位盲人，写了块“我是盲人，我需要帮助”的牌子，坐在路边等待施舍。路过的人，施舍非常少。有个女孩子路过，拿起牌子翻过来，重新写了一句话，再放回去。没想到，施舍的人突然开始么起来了，很多路人都会驻足，在口袋里翻找零钱。为什么会有这么大的变化？这个女孩子到底写了什么？


    她写的是：今天真是美好的一天，但，我却看不见。


    运用3：环境威力法则


    比如在移动互联网时代，像神一样存在的“杜蕾斯”，每次重大事件之后，它都能够用它巨大的脑洞，用自家的产品演绎这个事件。常常让人拍案叫绝。甚至于每出一件事情，都会有人主动上“杜蕾斯”的微博，看看他们是怎么说。


    # 小结：如何引爆传播？


    在移动互联网时代，引爆传播的三个方法：个别人物法则，就是找到超级连接者，联系员，内行，和推销员；附着力因素法则，就是让信息本身具有传播性；环境威力法则，在特定环境中，信息更容易被传播。


    用一句话来总结：在最合适的环境中，把最适合传播的信息，扔给最适合传播的人群，然后，就听“啪”的一声，引爆了。


