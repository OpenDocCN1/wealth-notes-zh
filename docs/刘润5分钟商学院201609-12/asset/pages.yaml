    # 客座教授 | 学做卓有成效的管理者


    ![](img/111c10f049a8af8b2b739d47aff317cd_121_1.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这一周，我们迎来了大名鼎鼎的德鲁克管理学院院长，王欣。他曾任微软中国前副总裁、曾在IBM和摩托罗拉等企业担任管理职务，有着丰富的管理实战和理论经验。


    王欣老师曾经帮助过很多个人和组织，激发自己和员工的小宇宙，让整个团队效率倍增，其中也包括我自己。这一周，我们请他来为我们大家答疑解惑。


    ![](img/111c10f049a8af8b2b739d47aff317cd_121_2.png)


    想请教王欣院长，现在有的公司组织结构是职能型组织，注重自上而下发命令式的管理，有的是去中心化的矩阵型组织，让听到炮声的士兵做决定。这两种管理如何拿捏，才能管理好一个企业？


    提到“管理”二字，很多任首先想到的就是“流程与控制”，那是工业文明早期对体力工作者管理的模式，典型代表是泰勒创立的“科学管理”。在今天互联网引领的知识经济时代，对大部分的人来说“操纵与控制”（或称胡萝卜加大棒）的管理效果越来越差。更多人的表现取决于他内心对目标的认同感、使命感以及激情和信念，这些用“胡萝卜加大棒”的管理模式是无法实现的。这是第一个变化。


    另外，随着技术的进步与融合，顾客需求的变化和市场发展的速度越来越快已经是企业今天要面对的事*****因此，工业时代广泛采用的金字塔结构组织，由于其信息传递和决策速度上存在一定局限，显然不能适应今天市场的高速度变化。以倒金字塔、矩阵式和网络状组织为代表的去中心化管理日趋流行。


    然而人们或许没有注意到，越是去中心化的组织，就越需要组织的每一个人都承担起责任，成为真正的领导者、管理者和决策者，而不仅仅是执行上级命令的“雇员”。如果说以前管理，例如制定战略、管理创新、领导团队等等是“高层管理者”的责任，今天在去中心化的组织中成为了每个人的工作。因此，很多曾经针对“高层”管理者和企业家的学习内容成为了广大创业者、中基层管理者和独立工作者们学习的三大目标，例如“管理者的八项基本技能”、“卓有成效的管理者”、“有效沟通”、“企业战略思考”、“创新与创业精神”、“领导力与激励”等著。而这些，都是“现代管理学之父”德鲁克早早就提出的管理理论精华所在。


    经常有朋友问我，德鲁克管理学说什么多内容从哪里开始呢？正如海尔集团首席执行官张瑞敏先生所说的，大部分的管理书是教大家如何管理别人的，而德鲁克的《卓有成效的管理者》是帮助大家学会如何管理好自己的。这本书和这门课是德鲁克先生留给我们进入管理之门的钥匙。


    在目前及未来的互联网浪潮中，作为“传统”管理学院是否倍感压力及挑战？未来是否也会转型？我们个人在思维方面怎样率先完成转变？


    正如前文中提到的，信息时代的网络化组织让每个人成为管理者，成为了创业者兼CEO。在传统的金字塔形的组织中，雇员们是“轻松”的，他们只要听命于“上司”就可以了。而今天的矩阵式或者网络化组织，员工不但要自行负责，而且要“管理上司”，上级不再是下级的指挥者，而成为了下级必须去调动和管理资源。这无疑为管理教育创造出巨大的需求，大家渴望知识和方法，渴望能够快速地成长，迅速地学会如何应对工作中不断变化的新挑战。


    如此规模和多元化的需求是以传统的教学方法和途径无法满足的。线上学习、碎片化学习、微课堂等等形式应运而生。然而，管理学有两大特点，一是系统性，二是实践性。


    就系统性而言，无论组织还是个人都是一个整体，中医讲究“头疼医脚”，上医治未病，管理也一样。我们遇到的问题，往往只是现象，而非问题的本质。在现象上忙活，通常是事倍功半，而切入本质则可以四两拨千斤，这种透过现象看本质的能力恐怕要花一段相当长的时间才能建立起来，急不来。


    另一个方面，管理是实践，不是科学也不是艺术，光靠知识和灵感，不能创造出有效的管理成果，至多是引人注目而已。你要一边看书、一边听课、一边分享、一边实践，不断地总结、循环，才能收获一个完整的管理的提升和成长。


    回到德鲁克管理学院，我们一直在探索一条线上与线下、系统与实践相结合的有效的管理学习途径。学院通过微信公众号——“德鲁克学院”和“博雅管理”一为大家提供了非常好的入口，也正在与几家合作伙伴一起开发线上课程，尝试突破传统的线上视频教学的模式，探索有效的移动互联学习方式。


