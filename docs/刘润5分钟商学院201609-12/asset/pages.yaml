  md: '我是一个保险行业的培训师，我发现，保险一般不会是一个保险设计完后保障很全面，一般都是一主险再附加一些附加险，附加险一般比主险便宜很多，但确是对主险的一种补充。比如一般的重疾险是保障重大疾病，年交保费费用固定，缴费20年。但是一般业务员会让客户附加医疗险，费用一般是重疾的1/5，但是会对非重疾治疗进行补充，这样就会给客户一种特别全面、感觉很踏实的感觉。其实这两个险种是可以分开买的，如果业务员先沟通医疗再反过来沟通重疾，基本上很多客户重疾是不会购买的。


    在商业的谈判中，先让对手得到一些甜头，然后利用“损失规避”的心理来达成我们要的目的。例如:商业合作中对方提出的条件是愿意出让10%的股权来取得技术合作，而我方心中的理想目标是20%股权。那么在谈判的过程中首先可以告诉对方，我们愿意大家一起努力，所以在事业发展前期(利润达到什么规模前)愿意只拿5%的股权，当利润额达到设定规模时，我想要额外10%的期权兑现，另外必须要求额外有5%的股权以协议价格让我方
    rischi购。这样的条件可以解决对手现阶段出让目前额外差距10%股权的“损失规避”问题，以这个方案撬动对手心中的“旧沙发”。之后合作中对方见到了利益，更担心会“损失”，更能够同意我方的要求。


    举例：1.经济学家杂志以前有个广告好像记得是这样，100元订电子版，150元订纸质版，150元订电子版+纸质版，结果第三种选的最多数，其实前两个都是诱饵。


    2.一个手机如果有16G、32G、64G三种，价格逐渐升高，选32G的会多点。


    应用：1.如果商家有特别想卖的产品款型，可以摆在柜台、货架上最显眼的位置，在旁边再摆一个比之低端和高端的两个款型。


    2.对于想提高定价的品类，可以切换产品定位，改变参照系，在一个更高的产品段位上找一个价格更高的产品进行对比。


    3.消费者要根据产品性能和自己实际的需求选择商品，不要被不同款型产品的不同定价所欺骗。


