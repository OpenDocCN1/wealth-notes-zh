    今天，在《5分钟商学院》开学的第94天，我们的学员正式突破5万！这在商学院的教育史上堪称奇迹，而创造了这个奇迹的，正是你们。是每一位学员的勤于学、勇于行，共同创造了这所最大规模的私人商学院。


