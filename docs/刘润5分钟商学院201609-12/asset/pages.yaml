  md: '# 客座教授 | 如何打造一个经久不衰的IP？


    ![](img/111c10f049a8af8b2b739d47aff317cd_170_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们迎来了一位漫画界的大牛，慕容引刀，大名鼎鼎的漫画形象“刀刀狗”的创作者。


    他创作的这只卡通狗被称为“中国的史努比”，是很多人相伴多年的心灵伙伴，“朋友刀刀”的系列给本出了十几本，本本畅销。


    很多人都想找他请教，如何才能打造出一个经久不衰的经典IP。这一周，我们请他来分享一下其中的门道。


    ![](img/111c10f049a8af8b2b739d47aff317cd_170_1.png)


    不可否认，中国是文化资源大国，但不是文化强国。在文化品牌打造方面与美国甚至日韩都有较大差距。请问慕容老师，中国是否有机会创作出像好莱坞一样的国际动漫品牌，对中国动漫文化的品牌化和国际化您有什么思考和建议？


    ![](img/111c10f049a8af8b2b739d47aff317cd_170_2.png)


    想要打造出像好莱坞一样成功的国际动漫品牌，有几个方面要特别注意：


    +   1、用商业化的方式创作受欢迎的内容


    中国很多的漫画作者，在创作时还是原发性的，根据自己的生活体验创作。比如因为失恋，就创作一篇失恋的内容。但更有效、更吸引人的做法，是根据别人的经历，结合自己的体验和擅长，来创作某个主题，或者多个作者联合起来一起创作磨合某个主题内容，这样的效果差别，就好比公司盖建筑和小孩子搭积木，当然不能同日而语。


    另外，大家都提到美国、日本这些商业化成熟的发达国家，他们在创作开始时，就会先提供给创作者一个明确的市场，指向一个方向让创作这匹马在上面奔驰，比如迪士尼就因为合家欢的市场定位，对创作者有核心价值观的要求。


    +   2、要有一条高效运作的产业链


    一个个人作者，可以潜入内心创作，但如果只是他个人闭门自说自话，没有融入对应的这条有形无形的产业链，就好比是不联网的智能手机，怎么玩都是单机游戏。

    79人笔记


    所谓产业链，就是在作品诞生时就要考虑到周边衍生品的开发销售，创作时会有和整条产业链的互动。有关联的整条产业链比起创作者和分散的其他产品制作者，肯定是要有效率得多。


    高效运作的国际IP，其实跟任何一个成功的商业公司一样，每个条线上都有专业的人在分工做事。创作者知道如何讲好故事，打动人心。传播者知道怎样吸引眼球，销售者知道怎样实现获利。迪士尼的故事大家都很了解，只要去看看他们的运作就明白差距了。我们现在每个专业部分都还是割裂的，更别说每个部分有没有做到真正的专业还不好说。一个朋友跟我讲过他在美国见过舞台剧的换台过程，是国内剧团的四分之一时间，而且还更高质量。这个细节之完美才应该是专业。


    国内目前动漫产业已经越来越向着国际化模式的方向在整合，出现了类似奥飞动漫、翻翻动漫等专业公司。从投资者、整合者、还有内容创作这几个领域都有专业团队在努力。差距比较大的地方，还是在基础的内容创作这部分。毕竟内容产业，没有一个能打动人心的作品，是很难放大的。与此同时，要有意识地开发完善商业链条，只有商业，才能有效整合最大化的资源。


    如何平衡艺术创作与公司合伙人的身份？


    我理解的平衡，其实也只是动态的平衡。如果说创作者和合伙人都是我的人格分身的话，我对他们的要求也是不一样的。创作者就要敏感，对生活充满好奇和好胃口，要用意想不到的方式说出大家熟悉的体验和感情。


    而合伙人，就侧重在看清自己在产业链的位置，做好适合自己的角色。我不是公司主导运营的人，公司有合伙人在负责。我的角色是创作加合伙人。我要求自己是一个能理解公司方向、策略、愿景的创作者。


    很难有人真的能够分身做好这两个不同的角色，对于有才华的创作者，最好的选择是找到经营搭档，避免用弱项去勉强自己。挑选合伙人有点像婚姻，我的经验是，寻找价值观契合的，就是底层操作系统比较兼容的。表面的行事风格，反而是越不同越互补。


    ![](img/111c10f049a8af8b2b739d47aff317cd_170_3.png)


    刘阔'
