  md: '# 那些在人类的思想丛林里出没的犹太人


    如果我们打开近现代思想史，在许多最杰出的思想家中间细细地寻觅，我们会看到一系列闪烁着天才般炫目光辉的名字：马克思、弗洛伊德、胡塞尔、柏格森、卢卡奇、维特根斯坦、伯林、霍克海默、马尔库塞、阿多诺、弗洛姆、波普尔、哈耶克、施特劳斯——近现代的思想天空如果缺少了这些人，即使不陷入黑暗，也将黯淡许多。而不管这些人的思想造成了何种政治经济和社会心理的后果，他们之间又是如何地相互区别甚至相互敌视，他们都有一个共同的特征：犹太人。


    犹太民族的历史是一部耻辱与苦难的历史。这个原本居住在西亚两河流域的古老民族，在公元前一千年左右曾在巴勒斯坦建立过统一王国。但随着王国的分裂和相继被灭，他们的噩梦开始了。在埃及的做奴役构成了他们遥远而痛苦的回忆。而在中世纪的排犹浪潮中，他们甚至被基督徒描绘成畸形的人，是罪恶和下贱的化身。“排犹”成了一种“主义”，直到20世纪三四十年代德国法西斯集中营里被屠杀的600万犹太人的血泪控诉，它才在欧洲，以及整个世界的“良心发现”中被唾弃。随着1948年以色列的建国，犹太人终于再次拥有了自己的国家。


    让我们感到惊叹的是，尽管犹太人的灾难是如此的罕见，他们却向世界贡献出了那么多举足轻重的思想家。他们像被风吹散的树叶那样散居于世界各地，然而独特的宗教信仰、语言文字和生活习俗却顽强地




    ![](img/7e667f542e5175c06fc3833e30d0f27f_214_0.png)'
  merge: -1
  img_proc: true
- pgno: 215
  md: '保留了下来。即使他们已经从“隔都”里走出，融入了当地社会，作为一种“集体无意识”，犹太教里的教诲仍然或隐或现地回响在大多数人的心中。作为世界上最古老的宗教，犹太教的经书《旧约圣经》的诫命构成了犹太人存在的一种属性，以致即使是在流亡生涯中，他们也保持着自己精神世界的完整。信仰所产生的力量是无法低估的。犹太人自认为是上帝的选民，因此没有什么能够征服他们，当整个世界沉沦的时候，他们必须对人类的救赎担起责任。这种宗教上的“救世情结”几乎成了犹太思想家的思想的原型，无论他们是否意识到，他们都在自觉不自觉地阐释着这样的精神谱系。


    在摩西时代，犹太人的救世情结表现为对自身命运的责任，而耶稣时代则是以人类的宗教救赎为指向的。随着他们流散于世界各地，他们成了“世界公民”，“救世”思想由此向真正具有普适性的深度和广度延伸。


    欧洲的启蒙运动使中世纪走向终结。启蒙的一个结果是人类权利意识的苏醒，以及理性向自然界的开掘。资本主义由此获得其思想支持和技术依赖，其向下滚动的车轮获得了强大的势能。


    工业革命的过程是资本主义原始积累的过程。在血汗工厂里，工人以超强度的劳动和极为微薄的工资控诉着这种野蛮剥削的非人性性。到19世纪，资本主义原始积累的罪恶仍然在刺激整个社会的神经，终于激起了马克思的强烈抗议。这位出生在德国的大胡子犹太人每一次嘶哑的呐喊都像是刺向资本主义机体的一把利器。1848年发表的《共产党宣言》使脑




    ![](img/7e667f542e5175c06fc3833e30d0f27f_215_0.png)'
  merge: -1
  img_proc: true
- pgno: 216
  md: '满肠肥的欧洲资产阶级肝胆俱裂。埋葬这样一个吃人制度的设想使马克思主义实现了从“批判的武器”向“武器的批判”跃升的长征。69年后，以马克思主义的名义，资本主义制度终于在世界上最大的国家俄国被粉碎。马克思成为其思想对世界影响最大的“千年第一人”。


    马克思的思想针对的是“社会”，对具体的非阶级属性的个人本身并没有多大兴趣。而在欧洲，一直到19世纪末，维多利亚时代的性禁忌都在折磨着人们。人们在向自然和社会的探索上已经走得很远，但却很难走进自己神秘莫测的内心。尽管许多神经症和精神病的症状已经鲜明地提出了心理和精神的问题，但人们只能加以外在现象的描述，或神秘主义的臆想。弗洛伊德的出现根本性地改变了这一局面。这位出生在德语国家奥地利的犹太人在1900发表的《梦的解析》，就像它诞生的年份标明20世纪的开端那样，以科学的态度和有效的分析宣告了一个探索人类心灵世界的时代的开始。从此以后，许多折磨人的精神疾病都可以用精神分析来加以分析和治疗了。这是一颗敏感的心灵，通过《文明与不满》的言说，弗洛伊德揭示了一个秘密：“文明社会”是一个人类无法摆脱的“致病情境”。它使精神分析不仅风靡整个20世纪，而且引起了人们对犹太民族的“集体无意识”的注意。


    在这个世界上，许多理论或许可以不考虑心理真实而实现其逻辑上的自洽，但严格来讲，在心理上不能成立的理论，在实践上是必须打折扣的。任何社会条件的改变如果不能带来心理和精神结构上的相应






    ![](img/7e667f542e5175c06fc3833e30d0f27f_216_0.png)'
  merge: -1
  img_proc: true
- pgno: 217
  md: '改变,那么建立其上的“上层建筑”将摇摇欲坠。这一点已经通过 20 世纪初西欧无产阶级革命的失败得到了充分的说明。俄国与西欧革命的不同命运给许多马克思主义者以深深的刺激。一种正统的马克思主义和列宁主义的逻辑已遭到质疑。匈牙利的犹太人卢·卡奇为此写了一本名为《历史与阶级意识》的书。1955
    年，这本书被法国人梅劳一庞蒂称为“西方马克思主义的《圣经》”。正是这个犹太人的离经叛道引出了一个笼统地称为“西方马克思主义”、在整个 20 世纪几乎将资本主义的五脏六腑掏个干净的庞大的思想家群体。在这个思想家群体里，最有名同时批判也最为彻底的是
    一个叫“法兰克福学派”的学术团体——他们中绝大多数是犹太人。


    1923 年 2 月 3 日,由一个叫做弗里克斯·韦尔的德国犹太人出资,最初由同是犹太人的霍克海默、波洛克等组织的学术研究机构“社会研究所”在德国法兰克福大学成立。其后,同是犹太人的马尔库塞、弗洛姆、阿多诺、本雅明等纷纷加入,法兰克福学派,这个在整个
    20 世纪影响极大的左翼学派由此诞生。这些出生于中产或资产阶级家庭的富人了弟面对资本主义社会的意识形态奴役,发出了他们对堕人心和病态社会进行“救赎”的最强音。霍克海默的《批判理论》和马尔库塞的《哲学与批判理论》的发表使“批判理论”成为他们的理论的别名。这些哲学、社会学、心理学等多学科的协作研究,其全部指向都在于资本主义社会控制术的隐秘的暴政。几十年的批判呐喊,使这些思想家的经典著作成为破译现代文明秘密的“解码器”。20
    世纪 60 年代西方爆发青年造反运动,而思




    ![](img/7e667f542e5175c06fc3833e30d0f27f_217_0.png)'
  merge: -1
