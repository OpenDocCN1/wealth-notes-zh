    果地上没有我的父亲，那你就是我的父亲！"暴露出人类自我拯救和自我把持能力的严重衰竭。从骨子里，上帝在以撒心中仍然是一个拥有绝对权威的“父亲”。而他之哭喊饶命，仅仅是一种生物本能。杀死以撒的命令本由上帝发出，也即是说，是信仰对象的绝对权威需要以人来献祭。而为了证明自己对上帝的忠诚，亚伯拉罕刻意为上帝隐恶扬善。他不仅不对上帝叫他杀死自己的儿子这一举动产生对信仰和上帝的怀疑，反而为了证明自己信仰的合理性，将罪责仅仅推到自己身上，而且是作为“凶残之徒”的自己身上。如果没有他所谓的信仰，他怎么会变成“凶残之徒”呢？在此，一种行动和支配这一行动的指令被他巧妙地分割开了。而既然信仰本身已经“无限弃绝”，那么所有属人的东西都可以抛弃，所有的罪恶都可以获得赦免。其灵魂已经得到拯救，上帝的恩泽可以对他的凶残进行洗涤。


    在精神分析的框架内，我们已经可以将亚伯拉罕定位于一个十足的精神病患者了。但其精神的分裂已经因自我意识和对象意识的混同，也即因其主体性的丧失和他对其存在属性的弃绝而归于灭寂。这种人只剩下偏执和亢奋，不分青红皂白，不管善恶是非，信仰就是驱动他的指令。这是一种彻底被洗脑后的存在状态，其偏执已经使他活在虚幻之中，信仰就是他的生存世界。这个偶像崇拜者的主体性已被肢解，他所体验的仅仅是信仰所能给予他体验的。当任何一个权威、任何一种理论体系对信徒的灌输和操纵达到了这一步的时候，它就成功了。这种催眠的效果远远超过了暴力的威胁。它让我们想起了乔治·奥威'
