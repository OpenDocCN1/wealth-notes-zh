  md: '验也就不需要再做缩头乌龟而以症状的形式改头换面地发泄出来，而应光明正大地存在。精神的冲突消除，他的病也就治好了。这些被压抑的经验便代表了病人的真实想法、愿望，他之屈服于超人的异化实体和力量、观念表明一种对他的本真存在状态的歪曲。就此而言，病人的意识便是一种虚幻，远没有他的无意识内容对于他的存在价值来得重要。在这种意义上，他的意识内容便不是他的而是不可抗拒地受到“超我”的操纵。这种操纵将人灾难性地置入受奴役的存在困境之中。


    文明社会建立在对威胁文明的人的本能欲望的压抑的基础上。在弗洛伊德的三层人格结构中，“本我”居于最原始的一层，代表着一种原始的本能（特别是乱伦欲望和攻击性），这种“本我”只遵循“快乐原则”，其惟一的目的便是满足有机体的固有需要。然而人毕竟处于社会之中，他赖以满足需要的手段必须依赖于社会，至少以社会为中介而和他人发生关系。因此，不对人的破坏本能、乱伦欲望施行压抑而由这些最原始的非理性冲动加以发泄，文明的秩序将遭到破坏，人类赖以生存和发展的保障——社会组织将在一夜之间瓦解。因此必须有超然于个体之上的精神机构对这种原始的本能欲望进行惩罚，其结果是使“本我”产生变形、扭曲或升华。在强大的压抑作用下，它的发泄便必须依赖于一个中介，这个中介实施着对“本我”和“超我”的冲突的调解，使水火不容的它们得以在“现实原则”的内在指令下对人的思考和行为进行规划。在《文明与不满》中，弗洛伊德详细地讨论了文明对人的压抑。人类丧失掉与世界的直觉体'
