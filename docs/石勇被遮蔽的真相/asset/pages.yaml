  md: '# 断裂的逻辑：“公共知识分子”

    如何成为可能


    语言作为一种捕捉世界表层和探入世界内部的工具似乎已经具有了这样的特征：谁掌握一种语言技巧，或者说谁最擅长对语言“编码”，谁似乎就掌握了世界的秘密。在原始草棚里，巫师的念念有词可以让世界戴上吓人的面具。中世纪的教士把守着进入天堂的大门，一个人下地狱或上天堂，就由他们来进行“资格论证”。近现代，这些人不叫巫师，不叫教士了，他们叫“知识分子”。由于他们更多的是在“公共领域”发言，而不仅仅是在从事不为外行所知和感兴趣的知识产权生产，因此他们又叫做“公共知识分子”。


    国人对“知识分子”的理解有些纯事实判断的特征。一个人只要有“知识”，好像就是一个“知识分子”。或者拥有某种文凭，就可以叫“知识分子”。其实，这个词既然发源于近代西方，按西人的理解，“知识分子”就不仅是一种事实判断，它更是一种价值判断。一个有知识的恶棍，或者一个只是搞他的“学术研究”哪怕洪水滔天也不管的大学教授，这样的人也叫“知识分子”倒真是怪了。无论是发出“我控诉”怒吼的左拉还是俄罗斯的那些猛击专制的“有文化的贵族”，其背后都闪现出“道德”的身影。一句话，“知识”不仅仅是对世界的存在奥秘的一种洞悉，它更是与它的道德效用，与理性、良知、批判、正义等概念联系在一起的。正是这种知识的道德效用使“知识分子”的


    ![](img/7e667f542e5175c06fc3833e30d0f27f_35_0.png)'
