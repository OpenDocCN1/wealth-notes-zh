  md: '外部世界对他的威胁被他敏感地捕捉到,并移植在他的精神世界里。他每前进一步都要遭遇到外部世界的威胁。不管这种威胁内化不外化,是以生活的具体的形式,还是以精神的抽象的形式,或者是以存在的本体论的焦虑的形式出现,他都逃不过它的追杀。


    在这种存在的荒谬中,正如弗洛姆所揭示出来的,人最大的冲动便是“逃避自由”,即“信仰”某些东西,不让自身裸露在自然的威胁面前,千方百计与外界认同,将自身化为外界的一部分。一旦人变成了外界的一部分,那么外界的威胁也就消失了。这要通过这么一种意识机制进行:首先,人与外界认同,即接受其一套公开的指令并植入自己的意识结构中,从而培养出一种与外界相同的认知模式和情感模式,甚至连意识的指令都是一样的。这样,他与外界便因其对世界的共同看法而消除了陌生感。其次,如果仅仅是意识结构的变异,还不足以抵御外界的威胁,人此时还必须将外界原封不动地移植入自己的精神世界里,不仅在意识结构里,而且在家灵里供奉。这也就是说,外界对象的指令本身已经渗入了他的人格结构,即价值本体,成为他存在的价值依据。他的自我意识已经被挤压到极其狭小的边缘,从而瓦解了他的主体性。这样,他就实现了对自我的解构,他彻底变成了外界的一部分,与外界对象取得了共生态结构。如果外界足够强大不受威胁,他也就高枕无忧;相反,如果外界对象遭受到怀疑和攻击,他的安全感仍然是无法保障的,比如一个宗教徒面对宗教衰落时的心灵震荡。


