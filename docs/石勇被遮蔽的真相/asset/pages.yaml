  md: '群众运动由此具有了宗教狂热的特征。信仰开始脱离宗教的本义，不仅上帝是神，真主是神，连领袖也是神。意识形态体系与群众、领袖构成了“信仰”新的三位一体。没有什么比这种毁灭性的宗教狂热更不可战胜。在这帮“乌合之众”面前颤抖的不仅有托克维尔，另一位法国人古斯塔夫·勒庞也曾经肝胆俱裂。1848年，托克维尔43岁，而勒庞则只是个7岁的孩子。但“革命”的惨烈已经烙进了他幼小的心灵。47年后，他在他的名著《乌合之众——大众心理研究》里写到：“群体不善推理，却急于采取行动。他们目前的组织赋予了他们巨大的力量。我们目睹其诞生的那些教条，很快也会具有旧式的教条的威力，也就是说，不容讨论的专横武断的力量。群众的神权就要取代国王的神权了。”


