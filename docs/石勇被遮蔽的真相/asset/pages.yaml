- pgno: 170
  md: '下,一个人的痛苦能够引发另一个人的痛苦。从而,在最基本的层次上,一个人如果无法体验到自身的痛苦,别人的痛苦便已经和自的类的存在困境失去了联系,他也处于一种与自身的真实存在状态相疏离的状态中,从而也丧失了体验别人痛苦的能力。在这种意义上,一个没有同情心的人是一个已经物化的、丧失了人的属人本性并且切断了与他人的人性联系的人。他的存在由此远离人本身而展开为一系
    列被整个社会的技术一控制体系所编码的社会属性,这正是马克思论断的“人是一切社会关系的总和”的变味。


    # 三


    无论是正统的弗洛伊德主义者，还是新弗洛伊德主义的精神分析学家们，以及后现代精神分析学家、存在主义精神分析学家、宗教神学精神分析学家，这些人再怎么离经叛道，都没有背离精神分析的这一经典理论：童年的经验影响到了成人的种种行为，或者用很有精神分析风味的语言说：人的成长的过程是一个遭遇挫折的过程，从而引发了神经症；而童年的心理创伤则构成了成人的各种千奇百怪的症状的最终秘密。看得出，阿尔诺·格鲁恩对这一理论是运用自如的。事实上，他对童年的创伤，特别是对家庭的权威性结构对儿童的自由自发的生产性本性的扼杀所产生的心理创伤的强调，甚至比弗洛伊德有过之而无不及。准确地说，是家庭，而更不是社会的暴政以及人的存在的悲剧性，构成了他的理论的最终支持依据。


    这当然是有足够的理由的，精神分析的这经典理论到现在从未失去它的魅力，并且可以预想只要社


    ![](img/7e667f542e5175c06fc3833e30d0f27f_170_0.png)'
