  md: '这种指令通过一种无形中的价值判断体现出来。从这种意义上讲，文化批判中的文化含意大致指的是这样一些东西：一种弥漫于宗教、哲学、科学、政治、经济、教育等领域的渗透有统治指令的精神形态；一种被统治意识形态操纵或者说是它的另一种表达的大众生活方式、思维方式、价值观念、信仰方式、精神向度；一种体现于国家统治机构中的技术化、程序化的操作方式——而这三个方面又相互作用、相互渗透形成一个整体，即一种统治的文化机制，这种文化机制通过形形色色的诸如市场、学校、工会、宣传机构、官僚机构的运作而体现出来。它是一张无形的，渗透到人的生活、精神、存在内核的方方面面的天罗地网，将人网络进它的各种属性之中。对这种貌似文化、实则是弥漫于社会之中，并已在人的思维结构甚至人格结构中扎根的意识形态进行批判，怎么可能出现朱学勤所讲的“从常识上讲，文化批判越深刻，也越违背常理。追究一件事物的原因，如果不适可而止，那就会开启此事物原因的稀释过程。原因挖得越深，距离该事物就越远，与其他事物之原因的联系就越近，特定事物的原因分子随深入程度而稀释，直至稀释为零”？文化批判越深刻，不仅不是越背离常理，恰恰相反，它更能暴露出文化指令的秘密，进而暴露出操纵文化编码的实体的良苦用心，使奴役和控制的内在结构暴露无遗。而这恰恰是真正的现实。这不是使它距离“该事物”远，而是距离人的解放最近：不清除和修改操纵人的自由意志的指令，人的主体性、人的自由也无从谈起。


