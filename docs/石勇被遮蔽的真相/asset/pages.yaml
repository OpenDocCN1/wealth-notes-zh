    现在,无论是在学术界还是在一 般的“文化界”, “朱学勤”这个名字用“如雷贯耳”来表达已经不算夸张了。在许多人的眼里,特别是网上许多号称“自由主义者”的人眼里,他已经成为中国自由主义的一个著名品牌,其权威是毋庸置疑的。他所受到的偶像般的崇拜已经颇像同在沪上的曾经的“文化明星”余秋雨。网上就曾有好事者这样评论:朱学勤,“他的文风、姿态和学养,让我莫名其妙地打了一个比方:这是一个自由主义余秋雨”¹。


