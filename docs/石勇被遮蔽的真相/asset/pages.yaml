  md: '者的地位。因此，只要农村的贫穷与城市的富裕产生强烈的对比并使农民感到绝望，只要城市文化能渲染一种可以刺激农村的落后并作出价值判断的氛围，那么农民就会在羡慕、自卑的复杂心理中“接受”城市文化的那一套诸码，并反过来鄙弃曾给予自己安身立命的一个精神支点的文化。


    “分享”城市物质成果的幻觉使得这种被文化殖民的心态颇像中国人在强大的西方面前的一些“文化选择”。然而他们终究很难有机会成为城里人，或者因被歧视而难以融入城市生活，城市文化在对他们的文化殖民中更加刷了他们的精神焦虑，甚至摧毁了他们用来维护心理上的生存的依据。王晓明在《L·县见闻》中曾提到过许多学校教育向农村学生灌输逃离农村、向往城市的内容，事实上这早已是普遍的现象，只不过现在，在“义务教育”根本不“义务”，在许多农村孩子因高额学费而不得不辍学与农村已使他们感到厌恶而产生剧烈的精神冲突的今天，它表现得更为严重罢了。


    如果我们留心分析，那么就可以看到：从“文化”的分类上看，侵入农村领域的“城市文化”主要不是精神文化，不是制度文化，而更多的是物质文化。这种物质文化甚至与高品位的生活方式，开放、民主的思维方式等等深层次的“文化语码”没有关系，相反更多的是一种欲望的表达，一种感官的刺激，一种非理性的情感的放纵。它是文化工业粗制滥造的产物，是霍克海默、阿多诺等人多次批判过的具有奴役指令的意识形态的载体。它通过城市与农村的不言自明的等级界定和城市的“现代化”包装而大行其道。'
