- pgno: 171
  md: '会的一种权威性的结构的指令仍然渗透于家庭，并最终以家庭作为它施行控制的最小单位，它也永远不会失去它的魅力。弗洛伊德的这一理论并不是胡言乱语，而完全是建立在临床治疗和观察的基础上的。在这方面，继他之后，弗洛姆、霍妮等人已经用更多可信的例子对此进行了充分的论证。在这方面，甚至皮亚杰的发生认识论也从儿童的认知能力的结构的变化方面提供了有利于精神分析的信息。


    整个人类的文明史就是一部压抑的历史，在人类的童年，“文明”就已经让人的“本真存在状态”遭受创伤。这种创伤所折射出的原始经验就是荣格所揭示的“原型”。如果我们不认为这种社会化的过程同时也是一种奴役的过程的话，那么个体的社会化的过程同时也是一个儿童压抑自己的需要，逐渐把社会的需要化为自己的需要，并在社会的内在指令下接受社会的“编码”，取得社会属性的过程。而事实上，即使仅仅依赖于我们的直觉，我们也看到：童年的不幸即使不意味着一生的灾难，也至少意味着精神的不幸。在这方面，精神分析不可避免地要在气质上走向悲观主义，正如弗洛伊德所讲的，治疗患者的目的不过是为了将他从个人的不幸引入生活的普遍的不幸。这种“生活的普遍的不幸”在弗洛姆、贝克尔那里走向了存在主义，即人的存在的普遍困境，这种存在的普遍困境让贝克尔看到了人作为自然产物的悲剧，而更让弗洛姆看到了社会暴政的幽灵。如果不存在一个“健全的社会”或人不能在维持自己的自我系统的基础上健全信仰和理性，那么，这种“生活的普遍不幸”便是注定永远存在的。'
