- pgno: 60
  md: '的。政治革命只是它的扫路机，只能扫清一些障碍。用这一理论的实践者罗伯斯庇尔的话来说：‘世界上的革命已经摘了一半，另一半也应该完成。’这另一半革命则来自人最预料不到的角落——文明规范、文明程序、文明社会的解构与重建。朱学勤对卢梭的哲学思想的勾勒已经有了一个大致的轮廓：一种在价值原点上值得肯定的道德理想主义，一种只有文化批判——而不是政治建构——才能带来正效应的救赎热情；它对政治的越位是道德的专制主义，其结果将转化为全面的社会专制，从而使救赎转化为奴役：“卢梭观点的某些因素进入政治实践之后将会出现严重的消极后果。”由此，政治神学论得到清晰的表述：“当卢梭用此岸政治手段追求彼岸道德理想——‘什么样的政治性质能造成最有道德、最开明、最聪慧，总之是最好的人民’，他就跨过了宗教与政治的界限，从宗教救赎论中牵引出一个政治至善论（politicalperfectibilism），开启了一个历史性的转折……经此转折——神性赋予了人性，神学赋予了政治学，神的天国赋予了人的世俗王国，彼岸外部张力转化为此岸内部张力，神人之间的对抗，转化为人与人之间的对抗，彼岸神性救赎话语转化为此岸意识形态话语，所有被阻隔在彼岸的神性激情，从此破堤而出，汹涌灌入此岸属人的世俗世界。千年传统的神学政治论，转变为近代百年纷争的政治神学论，就是从这里迈出了冒险的第一步。”


