  md: '# 让人为难的康晓光


    在当今中国思想界,用“如雷贯耳”来形容康晓光毫不夸张,他的一系列头衔让人头晕目眩。这位与“新左派”和“自由派”都没有多少“共同语言”的特立独行的学者,注定了他在“民间”,乃至“学界”的孤独。


    朱学勤在《南方周末》发表的“盘点2004”的文章——《2004,传统文化思潮激起波澜》认为:“这一年文化保守主义思潮在中国方兴未艾,这其中有很多朋友,我本人乐观其成。”不知道康晓光是不是朱学勤的朋友,反正这“文化保守主义思潮”背后少不了领军人物之一的康晓光。2004年7月10日至17日,有“当代孔子”之称的大儒蒋庆邀请盛洪、康晓光、陈明会讲于贵阳阳明精舍,当代中国文化保守主义的几巨头集体亮相。11月24日,康晓光在中国社会科学院研究生院发表《我为什么主张儒化》的演讲,不仅严厉地批评了“自由民主主义”,而且明确地提出了“仁政”和“儒化中国”的主张。


    这篇文章一进入公众视野,网上立即骂声一片。修养好的还能压住自己的厌恶乃至愤怒以“商榷”的形式进行批评,而激动的则干脆破口大骂。诸如“昏话”、“真小人”、“理正气壮”、“丧心病狂”、“奴才”、“走狗”等词语一股脑罩到了他头上。在“政治民主化”这个世界潮流面前,在学界和民间普遍的民主化诉求面前,康晓光以“说不”的强硬方式表明了自己的“特立独行”,这种有点像是“找死”的“反潮流”姿态'
  merge: -1
  img_proc: true
- pgno: 143
  md: '确实需要一定的勇气。然而，特立独行并不总是正确和值得欣赏的，在许多人看来，康晓光的“独立思考”必须打个折扣：在一张嘴不要民主之前，他就已经错了。


    “政治民主化”是不是世界潮流无所谓，是不是为大多数人所认同无所谓，真理不一定在多数人的手里。但民主化的缺失正是中国的诸多危机问题的原因，这一点无可置疑。这样的“共识”虽然免不了多数人“跟着起哄”的嫌疑，但与它本身的性质却没有关系。在我看来，文化保守主义，或文化民族主义的合法性无需论证，但能否由文化保守主义推出以其为基点的政治安排，这之间并不存在一个逻辑的通道。文化与政治不仅是两个异构的领域，而且其规范的对象存在质的差异。而按康晓光的设想，行“仁政”，主张以“上道政治”、“精英联盟”取代“民主政治”，很难说不是一个越位。要避免这种错误，就必须实现文化逻辑与政治逻辑的同构，但显然儒家文化不经改造或不“创造性地转换”，在现代政治文明的规范下论证统治的合法性，是没有多大效力的。


    而在人们对康晓光嗤之以鼻的时候，眼中浮现出的可能只是一个“智彞”，一个“马基雅维利”似的人物，却不会想到他的许多研究成果都不能在中国大陆发表，这真是一个绝妙的讽刺。而人们更不会想到他是个好人，至少是一个有良知的人。这正是康晓光的令人困惑之处。在这样的事实中，许多人的“单向度思维”暴露无遗。2003年11月，他曾亲自到成都调查通过网络传播而震动全国的李思怡死亡事件。这位有良知的学者后来写了一本叫做《起诉——为了李思


