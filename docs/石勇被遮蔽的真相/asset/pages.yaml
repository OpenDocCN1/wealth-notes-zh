- pgno: 54
  md: '态，丧失了对官方决策的影响力。与经济自由主义的大行其道相呼应，政治自由主义在媒体上开始活跃，这在1998年和1999年的《南方周末》上达到极致。这期间在经济自由主义的鼓噪中，权力与资本相互勾结，许多国有企业纷纷破产，大量的国有资产被权力和资本瓜分。工人纷纷下岗，处于饥寒交迫的赤贫状态。而农村在城市的继续掠夺中，已普遍地衰败和破产。当历史的车轮进入21世纪，社会不公越发地剧烈。


    正是中国社会出现的严重的腐败和社会不公，权力和资本勾结对国有资产的掠夺，以及对国际垄断资本、霸权主义的态度，使原来曾经铁板一块的思想学术界出现了分裂。许多曾经鼓吹政治民主和经济民主的人转而对经济自由主义的逻辑提出质疑，并开始向强调公正和平等的左派理论靠拢。而代表权力与资本利益的经济自由主义者，以及更多地与经济自由主义有共同语言的政治自由主义者则不仅捍卫这种经济自由主义的逻辑，而且将它所造成的恶果只是归结于权力，从而将经济自由主义的责任推得一干二净。这样的分裂越发加剧，但开始还只局限在激进与保守，反思与继承，以及文化、思想、学术的研究这样一些相对来说具有争论性的有限性的话语。拉开公开争论序幕的是1997年王彬彬在《天涯》上发表的《读书札记：关于自由主义》这篇文章。随着李陀“让争论浮出水面”的呼吁，争论开始浮出水面。徐友渔对王彬彬的反驳文章《自由主义、法兰克福学派及其他》可以称为是自由主义与新左派的第一次正式交手。此后韩毓海在1998年《天涯》第5期上发表的'
