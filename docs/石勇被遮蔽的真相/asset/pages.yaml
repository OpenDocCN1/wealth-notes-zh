  md: '# 被遮蔽的真相


    行列中驱逐出去，他原本就不具有什么道德的特征。不管承不承认，一个“知识分子”发言的武器只能是“知识”，而不可能是“道德”或别的什么东西。道德、良知、理性，这些内在于人的心里的东西仅仅是发言时的一种内驱力或对发言的状态的说明，并不具有对知识的规范性：它们根本不可能使知识分子沾上自己的属性。知识乃在于对事实的一种说明、确认、规范和颠覆，不管它由此可以演绎出什么样的结论；而这些结论又是如何具有怎样的“公共性”特征，它都无法获得价值的属性。这样的知识只在事实领域里有效，而进入价值领域则是越位。事实与价值这两个不同的领域之间的结构上和功能上的歧异无法为知识与知识分子之间的基于价值判断基础上的对应关系提供任何说明。在一个领域里游刃有余的东西在另一个领域里将寸步难行，甚至其功能将遭到摧毁。因此，一位“知识分子”的呼啸呐喊，首先表征的只是一种对与错的事实判断，而不是善与恶的价值判断，后者的判断是不可能仅仅通过这种知识的表达就可以完成的，它必须与“公共领域”中的其他东西或普遍人性产生联系才能建构自身判断的合法性。而这种在“公共领域”中的知识及其表达更不可能使“知识分子”天然地拥有任何价值属性，以致成为道德的化身。


    这两种逻辑断裂的存在当然并不意味着“公共知识分子”的不可能，而是说：不消除这两个逻辑断裂，所谓的“公共知识分子”只是在自欺欺人，是在建立沙滩上的房子，其脚下并没有牢固的地基。而故意混淆“公共知识分子”的界定和无视它的严厉前提正是些卖身于社会强势集团的“知识分子”的惯技。萨特、




