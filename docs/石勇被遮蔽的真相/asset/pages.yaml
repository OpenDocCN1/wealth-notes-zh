- pgno: 164
  md: '内的政治体制来判断它的对外政策彻底失去了意义。取消了价值判断，并且在人种、文明、价值理念上的差异的客观存在的影响下的利益分野加剧了强者在内外表现上的分裂。一种仅能由国内政治体制所依恃的理念再也无法渗透入政府在国际关系上活跃的机体。它不再发挥制约能力，就像一个有素质的人面对妻儿温存无比，而对外人则恶言相向，面目狰狞。


    这就意味着，无论一个国家国内政治体制是专制还是民主，都已经不影响国际关系的政治体制中的性质。它们之间所遵循的不是同一机制，深刻地表现出某种异质异构的特征。从逻辑上讲，以一国的政治体制来判断它在国际关系中的作为出现了一个断裂，这种断裂宣告了国内和国际政治体制处于不同的领域和情境，并且遵循不同的指令。而国际关系由实力来划分不同的等级体系、由暂时的利益来划清暂时的敌友已经表明这种国际政治体制毫无自由民主可言，而赤裸裸的就是一个极权主义政治秩序。


    西哲有言：“绝对的权力导致绝对的腐败。”更言：“失去制约的权力将导致专制。”这意味着，自由民主或专制独裁仅仅出现于各权力之间的关系，与权力背后的“素质”、“修养”之类风马牛不相及。当某种权力失去制约，具有了横扫一切的力量时，基于“人性恶”（在国际关系上是追求国家利益最大化的排斥价值判断的狂热的民族主义或国家主义）的假设可以判断这种权力必然营造出一个极权主义秩序。表现在国际关系上，美国国内的自由民主和与它主宰的国际极权主义政治秩序毫无关系，没有任何有效的力量制约它，在国内它可以是一个文明人，在国际上它就可以




