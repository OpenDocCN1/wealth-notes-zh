  md: '而也恰恰因为概念和话语体系的所指捎带了理论原创者的信息，而后来者在他的解释中已经将它扬弃并纳入他所营造的语境，这带来了一定的信息失真。思想学说内部开始呈现多元化的倾向，具有不同的内容和属性，它们既可以相互印证，又有可能相互否定。它们日益多姿多彩同时也意味着在非核心价值上的相互背离。思想学说的外壳不断地变异，对环境的适应使这个思想学说抹上了不同时代的特征。故而，每一种有影响的思想学说在其历时性的演绎发展中都难免被扭曲变形，而意识形态化正是它最大的特征。一种思想学说在“主义化”的过程中一旦意识形态化，便不断地力图扩张自己，不断地越位，不断地以自身为标准发出指令，以致这种指令迅速地转化为奴役。这种思想学说在发展过程中出现的扭曲和价值失范既建构了批判的可能，又提供了保守的必要性。就此，对之进行“祛魅”乃是文化批判和文化保守在它的普适性只有建立于普遍人性的基础上才成立的共同确认。它深刻地说明，在变幻不定的历史时空中，对应于某一历史场景的话语指涉必须被加以重新界定：一方面是它意识形态化而侵入它没有作用的合法性的场域的危险，致使原本具有价值的话语指涉渗入恶的指令，另一方面是许多价值由此遭到遮蔽。比如，政治的伦理化仅仅意味着政治的伦理之维，换言之，仅仅是一种背后的理念而绝不能让它进行政治操作，而儒家文化长期侵入政治领域已经导致了伦理与政治的混淆不清。在批判和保守中使儒家文化守住自己的边界和价值，这正是“文化批判者”和“文化保守主义者”共同面对的课题。






