  md: '帝，可怜可怜我吧！如果地上没有我的父亲，那你就是我的父亲！’然而，亚伯拉罕却轻声地对自己说：‘尊贵的上帝，感谢你！他最好相信我是凶残之徒，而不要对你失去信念。’②


    这就是信仰异化之后的恐怖图景。在信仰面前，丧失人性之后的亚伯拉罕已经疯狂了。上帝的指令成为他行动的惟一依据，成为用来判断世间一切的标准，为了这种“信仰”，哪怕杀死自己的儿子也在所不惜。一切的恐怖和罪恶似乎在信仰面前都变得很纯洁，似乎都可以用信仰来作为借口，获得解脱和安慰。“傻孩子，你认为我是你父亲吗？”这句话透露出信仰异化的玄机：当一个人将信仰看成绝对，看成目的，看成他存在的惟一价值依据时，他的主体性、他的自我意识、他的作为人的各种社会属性皆已失去，他成了信仰对象的工具，其存在的意义仅仅是忠实地服从信仰对象的命令。由此，信仰对象本身在信仰的结构中颠覆了信仰本身的意义，也即是说，信仰实际上已经被取消，信仰对象与信仰者之间变成了一种操纵与被操纵、奴役与被奴役的关系，而后者不过是用来达成前者的目的。当信仰的体系需要有一个代表时，这个代表便成了绝对的权威，它便是凌驾于万人之上的拥有绝对权力的独裁君主的原型。


