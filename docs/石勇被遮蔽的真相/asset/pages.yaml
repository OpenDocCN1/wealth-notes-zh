  md: '多幻象掩盖了的残酷的世界。


    作为一条精神康复之路，精神分析显示出了无与伦比的魅力，但“文明社会”这个“致病情境”迫使它不得不与哲学、宗教发生联系。人的现实存在困境经过层层追索，最终直达本体论上的存在困境。意识的分裂使统一的世界分裂成只有借助神的力量才能回归和谐的各种碎片，使人与人之间异化成一种相互否定的存在。意识的分裂、人性的恶的潜能及统治建构出的逻辑，使哲学所论证的人的应然存在状态遥遥无期。人的存在困境不得不指向人心和人所建构的诸如制度、意识形态等社会工具。


    因此，寻找支配现实的观念法则则几乎是批判者的“本能反应”。


    # 三


    类的命运便是个体的命运，正如个体的命运就是类的命运。批判者努力将个体与类的命运进行艰难的统一。就此而言，逃避现实等于扯掉批判的严厉前提，即对某种价值理念的捍卫。但捍卫这种价值理念必须通过某个载体，只有当某个社会群体遭到了侵害，价值理念才与这种侵害的现象产生联系。于是，通过这种价值理念的规范，对这个群体的捍卫就可以被认为是对这种价值理念的捍卫。


    但是，批判者与这个社会群体存在着不可避免的歧异：后者基于自身的处境和利益，前者则基于价值理念自身的指令。后者如果实现命运的改变，是不在乎曾经造成对他们的侵害的制度、观念和实体是以一种怎样的方式存在的，或者说，他们看见的只是谁在


