- pgno: 137
  md: '人、70年代中前期的人所曾经共享的“国家培养一毕业后为祖国作贡献”的教育模式的终结。从此，一切都是金钱关系：学校，以及由学校所代表的国家的教育成了赚钱的商业化活动，而学生花巨资买到教育只是一种商业上的投资，彼此之间遵循着冷酷的商业关系。当这种“贵族教育”建立在80年代人普遍的不自立和家庭不富裕的基础上时，它遭到的心理抵触是不言而喻的。


    一代人的生活方式、个性特征、价值系统是特定时代环境在人的精神世界的投射。任何一种成长的时代背景都会内化入人的心里，沉淀到无意识深处而使时代精神和时代的文化逻辑成为自己存在的一部分。当60年代人再一次听崔健的《一无所有》、当70年代人再一次听黑豹的《无地自容》时，他们就已经返回了过去。这些曾经让他们激动、疯狂的歌曲虽然能穿越时空得以保存，但仍然是与当下脱离而与过去连在一起的，也只有与过去联系在一起它们才有意义。人与他的成长的时代，不可思议地融为一体。也正是从这种意义上讲，幸运地出生在80年代，没有苦难的记忆也没有经历过理想与现实的断裂的80年代人，与自90年代以来的中国社会变迁具有更深的同构性。这是他们的时代。这个时代背景既培育出他们所共享的一种亚文化碎片，又使他们具有一种共同的心理特征。


    理想主义总是天真的，它背后有一个抽象的、赋予它的存在以意义的实体。而现实主义则从历史的宏大叙事中抽身而退，只关注个人主义性质的人本身，并通过整个社会弥漫的商业逻辑而斩断了与这个


