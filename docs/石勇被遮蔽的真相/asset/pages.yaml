- pgno: 16
  md: '先性时，同时还有另一层含义，即先有良知，后有理论。有了对“悲惨世界”的目睹、感受和体验，有了对穷人、弱者的同情，有了对压迫、奴役、剥削的愤慨，有了对平等、正义的追求，有了对黑暗和罪恶的反抗冲动，总之，有了良知，才产生了要揭露、鞭挞、改造、推翻这个黑暗世界的想法，也才产生了思想。当这种思想被系统化地表达出来，并进行论证和提供支持依据时，才有了理论。而这样的理论，是良知的一种升华，本质上是批判性的，比如法兰克福学派的“批判理论”。


    从1923年2月3日开始，八十多年过去了，位于德国美茵河畔法兰克福的法兰克福大学社会研究所仍然存在，似乎在诉说近一个世纪的风风雨雨。虽然作为一个学派，严格来讲法兰克福学派已经解体，但是，它的第三代、第四代传人仍然在继承、发展先辈的批判理论。从当年论证资本主义的合法性危机到现在已差不多转变到论证资本主义制度的合法性的法兰克福学派第二代掌门人哈贝马斯，当他在研究所里霍克海默、阿多诺曾经的办公室里徘徊时，当他遥想远在美国的马尔库塞、弗洛姆是曾经怎样地在那片自由的国度里不停地批判和呐喊时，心中一定感慨万千，涌起无限的思绪。这些已经作古的伟大思想家获得了世界性的声誉，不仅是伟大的犹太民族的骄傲，更是德国这个以其哲学而傲立于世的国家的荣誉。而这些批判思想家们所缔造的批判理论，再清晰不过地显示出从良知到理论的轨迹。


