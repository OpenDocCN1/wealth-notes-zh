  md: '期,中国的经济得以高速增长,沿海地区的工厂星罗棋布,中国的城市化进程加快,而少数的大都市,则已出现了只有在西方的后工业时代的都市里才出现的后现代奇观。商品极大丰富,并出现剩余。各种形形色色的娱乐疯长,借助于现代化的传媒手段,迅速主宰了人们的灵魂。时尚不断地旋转变幻,速度越来越快,人们越来越兴奋地投入这种被制造出来的狂欢。90年代后期,电脑、网络成为新宠,到
    21 世纪初开始在城市普及,从而几乎历史性地改变了人们的存在状态。在这种物质化和虚拟性的狂欢中,一个个“物质女孩”,一个个网络商业、爱情、滥情的神话不断地被制造出来。


    然而就在这个时期,随着经济的高速增长,社会不公也越发加剧。社会分层越发明显,并迅速出现了深刻的社会断裂。如果说改革是一种利益的重新分配,那么,权力参与的市场运作还意味着资本和权力对公共资产的掠夺和瓜分。由于改革前对农村的掠夺,以及
    90 年代对城镇化、工业化的优先考虑,曾经被抽干了发展的血液的农村在工业化新的一轮盗剥中已经耗尽了发展的动力,农村普遍地衰败。而在多种因素的作用下,国有企业也普遍地陷入了困境,下岗而衣食无着的工人越来越多。与工人、农民的极度贫困对应,这个社会的既得利益者和精英阶层却越来越暴富,社会不公已经登峰造极。就像权力与资本的勾结构筑出一种掠夺的奇异模式一样,90
    年代末开始的教育产业化和大学扩招也在表象上植入了市场经济之中。再没有什么能比将教育当成·种产业对 80 年代人的影响更为深刻的了。它冷酷地宣告了 60 年代'
