  md: '旦先验的建构没有经验的积累，地狱之门也就已经打开。我们本来是可以通由改良、通过反对激的抛弃而走上这一条道路的，当初胡适等人的自由主义思想已经为此提供了机会，可惜被不断的文化革命、社会革命打断了。打蛇打准了七寸，接下来的就是在药方和病根之间进行论证。他的这种写作动机和思想观点在时隔多年后仍时有流露，比如在1999年1月17日接受记者李辉采访的一篇访谈《是柏拉图，还是亚里士多德？——关于知识分子的谈话录》中，他又旧事重提：“所以顾准梳理出这二百六十年有两个传统，一个就是英、美的革命传统，引导出宪政民主制和经济上的市场经济。还有一个是法国大革命，经过法国古典主义和俄国十月革命以至中国五四承接上去……”朱学勤对顾准推崇的一个重要原因是，在他对这两种模式尚还在比较、选择的时候，顾准在文革的时候就已经清醒地意识到并作出明确的，虽然并不公开的选择了。因此，他的这篇博士论文已经不是纯粹的学术研究，而是包含着强烈的现实关怀。言说彼地，目的却指向此地。


