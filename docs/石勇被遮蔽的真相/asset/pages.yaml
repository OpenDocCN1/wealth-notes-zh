    我的目光也一直追随着这些在中国相对封闭的思想生态系统中新崛起的网络知识分子。他们的存在，越来越引人注目。至少我，还有《天涯》杂志，就常常从他们那儿寻找资源。秋风、石勇、陈永苗等“国是文丛”的作者，在《天涯》上就发表过他们的言论或文章。


    此外，在网络上论说争鸣的知识分子还有一个有意思的特点，那就是由于他们往往更为直接、观点鲜明、文风活泼、个性突出，且笔底带有感情（比如他们论事，往往源于深感不平拍案而起；论人，常为不满僵化权威奋然挑战），因此，比起一贯恪守中庸之道，善于明哲保身，在任何问题上都含含糊糊、模棱两可的主流传统知识分子，他们反而更能令人印象深刻。甚至，他们还有点明星的味道，在网络上的号召力也远胜过传统知识分子，以至开始有人给他们冠以“网络民意的领袖”之类的封号。这一现象，对于他们来说究竟是喜是忧，目前定论还为时过早。


    《天涯》曾发表过石勇的两篇文章：《良知先于理论》和《被“文化殖民”的农村》。后一篇文章颇引起了一些反响，在有关“三农问题”的讨论中提供了一个新的视角，现在还经常被人引用。我个人很喜欢读石勇的文字，充满激情，态度鲜明，但又文思绵密，论断谨慎。收入北京大学出版社推出的“国是文丛”的这本《被遮蔽的真相》，可谓是石勇的思想的精华。他所关注的许多问题不仅是热点问题，而且因对“真相”的执着追问，角度独特，引人深思。这点他在《自序》中说得非常明白：“读过我的文字的读者或许会注意到，在


