- pgno: 135
  md: '中走出，在各种力量的推动下建构市场化和商业化的时代。80年代初，整个社会的一体化被打破，但由于多年的政治和意识形态惯性，这种一体化的被打破只是凸显了社会的分层。随着“实践是检验真理的惟一标准”和“解放思想”的意识形态地位的确立，旧的正统意识形态虽然还在继续它的惯性，但也留下了一种异质性的空间，使各种思想得以被引进并不可遏制地生长。从而，80年代掀起的文化热和“新启蒙”，实际上构成了在这个时代出生的人的先天性文化土壤，我们甚至可以说80年代人就是从这个文化土壤里破土而出的。在80年代，与文化热、“新启蒙”遥相呼应的是城乡经济的快速发展，整个社会弥漫在“实现社会主义四个现代化”的乐观主义之中。当父辈们在漫长的苦难中终于能收听到收音机时，这个仍然与父辈隔膜，就像是一个异质性的遥远的存在物已经植入了这些刚出生不久的80年代人的最初的无意识记忆。70年代人这时已经告别苦难的童年而使这些“现代化”的玩意所含的精神指令成为以后他们在一个商业社会中呼啸奔突的严厉前提，然而比之80年代人，他们的童年与少年、青年的断裂却是无法掩盖的。“一无所有”并不仅仅是60年代人的命运。


    当历史翻过80年代理想主义的一页而进入90年代，许多曾经熟悉的东西已经销声匿迹，而许多曾经躲躲闪闪的东西已经走向神圣。1992年邓小平南方谈话确立了市场经济的地位，从此它变成了一个全民性的意识形态。与之相应的物质主义、商业逻辑、个人主义、残酷竞争从此具有了政治一文化意义上的合理性，并被纳入整个社会的存在结构之中。这个时


