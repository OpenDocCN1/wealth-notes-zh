- pgno: 154
  md: '![](img/7e667f542e5175c06fc3833e30d0f27f_154_0.png)


    此熟悉的共同体中，并且这种“无争”乃是对人们趋之若鹜的对象的一种轻蔑，情况就完全不同了。


    一个已经丧失自我，并且是在争夺生存资源，或获取虚幻的安全感的情况下而对自我进行扼杀的人最害怕的就是他的自我魂归人间。这将产生致命的心理后果。一是对他背叛自我的行为进行严厉的谴责、控诉和审判，将他的灵魂抛进地狱，接受地狱之火的焚烧。二是对他现在的虚假的自我进行鞭策，以一种因其发源于生命特质而具有强大威力的力量质疑他现在所选择的存在方式和价值观念的合理性，并且使与这个虚假的自我、异化的存在方式和价值观念紧紧联系在一起的利益遭到毁灭性的威胁。而由于一个人已经扼杀自我，他的精神结构已经畸变，很难在一般的情况下重新获得理性的健全，因此自我的影子的出现很难让他克服深深的恐惧而“复归自身”。由于安全感的需要，以及利益的强劲呼唤，已经畸变的人格结构导致了这种新的心理防御机制的产生：只要自我的影子一出现，立即就要扼杀它、否定它，并且由于这种深深的恐惧，他必须对让他看到自我的影子的载体实施攻击。只有这样他才能确信，并不断强化自己当初扼杀自我的选择的合理性。由恐惧和不自信，以及负罪感而萌发的这种近乎条件反射般的反应，其力量恒久而又强大，只要外界的威胁不消失，它就不会熄灭。汉奸之所以有时比日寇还要凶残，甚至变态到不可理喻的程度，就在于他既然背叛了祖国，抛弃了“中国人”这个存在的属性，他就必须从心理上蔑视“中国人”，努力否定原来那个自我，并且消除一切让他看到原来那个自我的中国人，以此强化自己当汉




    ![](img/7e667f542e5175c06fc3833e30d0f27f_154_1.png)'
