  md: '# 自我的丧失与“常态下的癫狂”


    # ——读阿尔诺·格鲁恩《常态下的癫狂》


    # 一


    > “孩子为能参与要求他服从的权力，就要用听 从 和适应来取代对自己行为的负责。人一旦失去了 同 自己内心的关联，那他只能同一种虚假的自我发生关 系。这种虚假的自我就是面子，这种面子是以周围环
    境赞同的行为方式和事情为基准的。希望或必须维 持这样的面子主宰了人的行为方式，这样人就失去了 自己的感受、情感和同情心。”①


    说这话的人叫阿尔诺·格鲁恩，一位流亡于美国，后又居住在瑞士的德国人。


    阿尔诺·格鲁恩，这个名字对于许多人来说也许还相当陌生。的确，在精神分析领域，他在弗洛伊德、荣格、弗洛姆、阿德勒、霍妮、苏利文这些名字面前黯然失色。他似乎没有在精神分析领域独树一帜。但是，衡量一个精神分析学家的标准不仅是成体系的理论和高超的临床治疗，还有他在这个领域的真知灼见，这些真知灼见将我们的精神困境以令我们瞠目结舌的方式揭示出来。事实上，格吕恩写过几本重要的好书，如《背叛自我：男人和对独立的恐惧》（1984年）、《常态下的癫狂》（1987年）、《同情心的丧失》（1997年），但最重要的还是这本《常态下的癫狂》。这本书撕下了一些实际上已陷于癫狂的“正常人”的面具。




    ![](img/7e667f542e5175c06fc3833e30d0f27f_197_0.png)'
