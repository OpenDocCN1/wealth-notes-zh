  md: '就必然造就出一个虚假的现实，儿童置身于一个爱的幻觉之中，久而久之世界也成为一种幻象。就这样，无论是受到奖励还是惩罚，儿童都把它看成是自己的由意志支配的行为的结果，而不是由于符合或不符父母
    的意志。这是一种可怕的对权威屈服的习惯。这种习惯完全是建立在以自己的内心意愿和情感反应进行艰难的隔绝的基础上的。在成长的道路中，只要一个人屈服于权威并且被整合进一个社会的权力秩序，那么，他就已经切断了与自己的联系。在追寻自己的旅途中，真正的自我已遭扼杀，由社会所编码的一个假的自我系统就这样构成了他的存在。


    这样的一个假自我系统实际上是人已经物化的反映。如果像兰克所讲的，每一种人格系统都是防止人疯狂的保护装备，那么，每一个假自我系统同样是保证我们不被视为“有病”的装备，虽然在正常的名
    义下，它不可避免地走向了真正的疯癫。从某种意义上讲，人被物化是很难避免的。弗洛姆在他的名著《健全的社会》里指出，要充分而有效地联系主体体，既应该看到它的具体性，又应该看到它的抽象性。但在现代社会，许多东西，包括人，都已经抽象化了。我们习惯地说“一位医生”、“一位身家10亿的富豪”，这种思维只能告诉我们这个人的职业或财富，再不能告
    诉我们关于这个人的任何东西。很显然，在我们眼 中，他只是一个物而已，与我们所面对的物，是没有多 大区别的。而我们的社会化过程，本身就是一种最大 也最惨烈的物化。随着我们的物化过程，假自我系统
    逐渐成形，在本来属千和应该属千我们的东西远去， 甚至难以追忆时，由社会所灌输给我们的东西也变成




