  md: '# 被遮蔽的真相


    的作恶都认为是人与生俱来的本能，因这种本能，我们似乎可以不必对我们的残忍和血腥承担社会的、政治的、文化的责任。


    弗洛姆对破坏性的剖析已打开了研究常态下的癫狂的大门，但对破坏性本身的生理基础和背后的文化、政治、心理因素的更为强烈的理论兴趣使他在这一领域戛然止步，而阿尔诺·格鲁恩正好接手这项工作。在《常态下的癫狂》里，格鲁恩对那些“正常人”的心理世界和精神结构进行了微观的剖析。他指出：一个以权力秩序为基础的社会导致了人的服从，而服从必以丧失自我，必以人远离自己的内心为代价；这样，人实现了对自己——进而是对整个人类及人性的背叛。而自我背叛产生的负罪感又导致自我憎恨。这样，这种“癫狂”所导致的暴力无法避免：“在忽视内心生命的条件下，适应稳固的价值观和形式是日常生活暴力的永不枯竭的源泉。只要把成功定义为控制，再用成功定义自我价值，那么不同社会结构的区别就会毫无意义。不管怎么说，自我就永远是扭曲的。政治意识形态的改变既不能改变自我扭曲这一事实，也不能改变由此产生的暴力。”


    # 三


    “我们在不断地掩盖我们的病态，正是这一点比人类历史上的任何时候都更标志着现代生活。”的确，我们习惯将那些能履行社会职责，能扮演好他的社会角色的人称为“正常人”，而将那些不能适应这个社会，出现一些精神病症状的人称为“精神病患者”。我们津津乐道于“现实主义”，可是这种“现实”指的仅




    ![](img/7e667f542e5175c06fc3833e30d0f27f_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '仅是外在于人的东西，而人内心的现实则从来不在我们的视野之内。像格鲁恩所说的，我们的社会化过程就是一个对外部控制力量的“内在接受”的过程，通过“服从”我们实现了与外界的“共谋”，即共同将“自我”置于死地。


    那么这些以常态掩饰其真正癫狂的人是些什么人呢？是那些“无法忍受强加给自我的现实和内心世界的矛盾”的人。他们“因此逃遁到‘正常’行为中来”，格鲁恩继续写道：他们“不久就没有了真正的感受，取而代之的是他们认为符合社会规范的感受，而且也没有了感情方面的经验。他们把强加的感受当作是自己的感受来表现并摆脱了自己真正的感受”⑲。很显然，这些人所面对的只是一种幻觉，但他们必须将这种幻觉想象成是真的，并且让自己相信。因此，他们所服从的外部现实便成为他们生命意义的惟一源泉。实现对己的“谋杀”后，他们必须想尽一切办法不再让那个已死去的自己出现，他必须将自己所服从的各种观念模式想象成是符合人的生存模式的惟一标准。


    人类社会历史有无数的事例支持这种理论。宗教异端裁判所对“异端”的扼杀是因为“异端”所操持的观念与它所宣称的观念模式格格不入，“异端”威胁到了他们。同理，一个对权力规规矩矩地服从的集体会本能地仇视一个特立独行的个体，这是因为个体的行为与他们的行为构成了对比，对他们的存在的价值依据提出了质疑。一个背叛自我的人无法自信，他的存在必须依靠外在的标准来支撑，他必须强化他所服从的东西而取消对比，因为与内心背




