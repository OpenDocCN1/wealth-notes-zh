  md: '# 文化批判与文化保守


    今天，“启蒙”这个词伴随着“现代性”的危机已遭到了人们的质疑。它所预设的“前启蒙时代”的黑暗和蒙昧在某些局部上已被纠正。它建构的“启蒙者”、“启蒙话语”、“启蒙对象”的三位一体已因其话语霸权的特征而丧失了自身的一部分价值依据。然而，近百年来，中国知识分子的激进反传统和建构的一套启蒙话语在器物落后、制度落后到文化落后的反思中，因“现代化”的迟迟未降临而似乎没有丧失其合理性。强大的西方作为一种背景使其文化成了一种文化革新的参照系，以致在“启蒙”这头“现代性”怪兽的四处冲撞中，传统文化节节败退，甚至奄奄一息。而非常明显，因文化的内化特性，将落后追溯到文化落后便意味着一种文化批判的长征。鲁迅的“不读中国书”一直在勾勒着中国知识分子对西方文化奉若神明的精神轨迹。


    时光的流逝虽然留下了历史的痕迹，但场景的变异却抽去了这个痕迹背后的文化心理。“理解”失去了感知的支撑，对历史文本和事件的解读于是只有借助“想像”中的体认才能建构出一个共通的逻辑。如果说我们面对五四一代“打倒孔家店”的场景曾经拍手欢呼，希望将“吃人”的文化从心中彻底清除出去，那么在“文化保守主义”已经取得一定的声势，人们认识到文化传统对于民族共同体的存在意义的今天，我们已经无法理解他们的激进了。


