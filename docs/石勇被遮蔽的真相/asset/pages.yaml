  md: '变成了对我们这个世界的血泪控诉。


    似乎一些令人从梦中惊醒的声音都来自德国的那一片曾经以思想的密集而令世界震惊的土地。卡尔·马克思令脑满肠肥的资本家老爷肝胆俱裂的力量直到今天仍然没有从这个世界中消失，因为这个名字并不活在历史，而是活在资本主义机器的暴虐之中。一个叫海因里希·伯尔的德国人在一篇名叫《假如没有马克思》的著名文章中写道：“一部进步史乃是一部忘恩负义史。后生者只是一味地捞取和享用好处，至于曾为好处所付出的代价连想也没去想……没有工人运动，没有社会主义者，没有他们的思想家，他的名字叫卡尔·马克思，当今六分之五的人口依然还生活在半奴隶制的阴郁的状态之中。”②曾经在美茵河畔法兰克福活跃，并在美国留下他们足迹的那群被称之为“法兰克福学派思想家”的德国人以其无比深刻的哲学、心理学、社会学、经济学等多学科的综合批判几乎破译了资本主义社会的秘密，而其最初的动力则是被那个罪恶世界刺痛的不良知。


    今天的资本主义全球化以远远超出马克思、法兰克福学派思想家当初所看到的现象的广度和深度蔓延。对森林的砍伐、对河流的污染、对威胁到人类生存的粮食的染指、对发展中国家资源的掠夺、因掠夺世界上的稀缺资源而发动的野蛮的战争……这一切就像钱敏汝所讲的，都再次将资本的内在法则以只要人类的良知不灭便无法阻挡的形式送上了“历史的法庭”。在西方此起彼伏的反全球化的声音正如20世纪90年代初中国一个叫“黑豹”的摇滚乐队所发出的“别去糟蹋”的强烈抗议。“我要张开臂膀，挡住无知




