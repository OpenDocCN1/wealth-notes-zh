  md: '了我们的东西，并成为我们的价值观念、情感反应、思维方式的源泉。


    但这种生命的挫折并不会就此善罢甘休。被压抑的意识和情感固然已深入无意识深处，但它仍然在起作用，仍然在驱动着人们，告诉人们似乎只有失去的自己才是一种真正有价值的存在。人的自我在失去时，也带去了心灵的平静并造成一种情感的紊乱。人必然会惶惶不安，负罪感将他折磨得心力交瘁。这是因为，不管怎样，一个人背叛自己总是有知觉的，他必须经过一个内心动荡不安、矛盾剧烈的阶段，而在这个阶段人强烈地感到对不起自己，虽然必须屈服于外界的权力之中。


    这种对不起自己的意识也表现出了对自己的憎恨，这有两层意思：一是自己必须对自我的失去承担责任，并接受惩罚；二是用来构成自己的存在的自我系统本质上是社会的产物，是强加给自己的一种面具，因而对它的憎恨虽然作用于这个躯体以及这个躯体附带的一切，但严格来讲，这并不是对“自己”的憎恨。只有在假自我系统已经在他心里定型，并作为他的价值判断和情感反应的源泉发挥正常的作用时，他对原来的那个“自己”的憎恨才是真的，因为他必须通过憎恨原来的“自己”，借助于一种情感的欺骗来强化对现在接受的这个假自我系统对于他的存在的合理性的证明，否则在心理上他无法生存下去。正因为如此，一个人会“本能”地仇视一个看起来与己无关，但却具有他原来具有、现在却早已抛弃的种种自我特征的人，因为他从这个人身上看到了被现在的自己背叛的自己过去的影子，这是令人恐惧，并且难以忍受的。


