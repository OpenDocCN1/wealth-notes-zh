  md: '种形式的授权的情况下，就使私人意见获得公共属性。第二个逻辑断裂是：知识本身与价值无涉，一个“公共知识分子”如何能够自己的知识表达中获得在“公共领域”中存在的价值属性而成为道德的化身，以致连人格上也比不会或没有机会“表达”的“愚民”高一等？独断论基础上的“知识分子的神话”当然可以拒绝对此进行追问。但是，“公共知识分子”的神话却总是容易破灭的，因为任何一个拥有话语权力的人，都有可能卖身于社会强势集团，以“公共知识分子”的名义解构“公共领域”制约公共权力、为占人口多数的社会弱势群体“说话”的功能，滥用“公共”的名义操纵舆论，为强势集团的暴行进行辩护和论证，以致形成一种“知识的暴政”。特别是在权力精英、资本精英、知识精英已经结盟的今天，更应该要求“公共知识分子”提供其存在的理由和价值依据。


    看第一个逻辑断裂。首先，一个“知识分子”无论标榜自己如何地“公共”，他是一个个体。这个个体在进入“公共领域”时，并不可能就变成一个“公共人”，他仅仅是获得了“公共”的属性。而且这个属性是通过共同的利益诉求、共同面对公共权力所产生的态度时才获得的。一旦利益分殊，或对待公共权力的态度不同，一个人与另一个人之间马上就失去了“公共性”，他们相同的，仅仅是同在“公共领域”中而已。这就是说，私人的意志永远不具有天然的公共性，只有在私人的意志与公共意志重合的情况下，它才能反映或“代表”公共意志。而这也等于说，任何一个“公共知识分子”的意见仅仅能代表他本人，他代表自己不仅仅是从个体对自己的意见负责的意义。'
