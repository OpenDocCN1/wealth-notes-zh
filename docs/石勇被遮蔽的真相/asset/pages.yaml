  md: '美国家对富人课以诸如遗产税等高税的最终原因。


    既然拥有资源较多者通过其对公共资源的较多利用已经使自己的所获包含了拥有资源较少者（特别是罗尔斯语境中的“最不利者”）的一份，那么他就必须对后者进行“补偿”，即将这一份“返还”给后者；在德沃金的语境里，如果拥有这种较多资源的人已经给拥有较少资源的人造成了很大的、可以对后者进行剥夺的机会成本，那么就必须对资源进行重新分配以便彼此给对方造成的机会成本相等。然而我们万万不可忘记的是，这种分析完全是以“平等而自由的人”所订立的自愿契约，以及市场经济的分析手段为基础的。它是平等主义自由主义的最为关键的一环，没有它，后面的推论将不复存在。也就是说，所有这一切推论，都是在最基本的平等的自由权利处于优先地位的情况下作出的。如果一个政治共同体无法保证这种平等的自由权利，那么所谓的“平等”不仅不公平，而且将扭曲自由与平等的关系，最终使政治共同体对于平等的伤害以对自由的伤害，从而是以对人的基本人权的伤害的形式而表现出来。


    这是因为：平等而自由的人所订立的契约确认了他们在政治共同体中的最基本权利——基于自愿基础上的“同意”。这种“同意”是以他们的自由意志，以他们不受控制和压迫、强制的特征来支撑的。这个政治共同体是他们意志下的产物，每一个人对它的民主权利上都是平等的。也就是说，没有平等的自由，这个政治共同体不可能存在，即使存在，它也不再是人们意志下的产物，人们将无法对它进行支配。那么这个本来是所有人的贡献的产物，并且应该为所有人'
