  md: '调查表明，热爱传统文化的大有人大。不管是以以“汉服事件”等外在文化泡沫所构筑的表征，还是一系列仍然构成人们的精神生活的一部分的各种传统文化形式的存在，都证明了传统文化的内在生命力。特别是在“西化”波及生活的方方面面，而人们却并没有感到幸福的今天，传统文化成了一种形而上的终极关怀。西方对中国的“文化殖民”与中国的综合国力日益强大之间的反差导致的人们的文化心理危机越严重，传统文化越显出它的价值。也正因为如此，学界与民间、新左派、文化保守主义者、自由主义者，以及其他思潮流派在“文化保守主义”旗下的共识可以还原成褪去任何思想特征的共识：每一个中国人用自己所置身的文化系统来体现一个民族的存在尊严和文化竞争力的共识。


    # 三


    以外在的社会化的物质材料、符号工具等所营造的事件行为可以还原成深层次的思想文化心理。或者 说，在很多时候，用心理秘密可以揭示出一些社会现象的秘密。当前的“文化保守主义”的走出边缘，逐渐回归主流已经有论者将其看成是一种中国的“文艺复兴”迹象，这并不难理解。不过与西方曾经的“文艺复兴”的机动不同，当前对传统文化似乎是突然之间发现了它的巨大价值的社会心理背后是中国社会改革开放后的一个逻辑结果。


    生活在一个文化系统中的人，即使可以放弃某种文化形式和文化符号，也无法“放弃”这种文化内涵。文化已经不彼看见而内化成为他生命中的一部分。'
