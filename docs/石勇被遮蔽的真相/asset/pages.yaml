  md: '# 第三编 显现的他者


    隶主是结为一体的。一个癫狂的人一旦拥有权力，便会利用权力的合法性实施破坏。事实上，他一直有破坏欲，在这之前之所以未暴露和发泄出来只不过是因为他没有机会。我们常常可以看到那种似乎是被授权行使的“公务化的暴力”。一个城管在执法的名义下可以朝一个人拳打脚踢，一个警察同样在执法的名义下可以把一个人打死。他们一开始便是服从者，即受虐狂，而受虐狂一有机会便会变成施虐狂。自我的丧失和人格结构的被破坏、从服从外部控制的内在原则中产生的报复和控制外界的心理让人变成了一个破坏者，以致似乎破坏便是意义。他的生存意义似乎就是陶醉在破坏的快感之中。这种破坏的病菌蔓延于几乎所有的权力一控制体系中，并成为“文明社会”永不枯竭的罪恶的源泉。


    生存论哲学证明：存在感的确认无法通过外界对内心体验的编码来实现，一旦真的如此这种体验便不是真的，它只是外界所强加的一种幻觉。存在需要自我说话，但自我又只有在同外界的交流中才能不断存在和生成。因此，人与外界所发生的关系对于人的存在的意义便主要在于他所置身的是一个怎样的文明体系。而人类普遍的以权力压迫和意识形态奴役为特征的统治型文明体系的存在对人的自我无异于抽心一击。服从、控制是它存在的严厉前提，人的自我只能被谋杀于他的社会化过程（同时也是一个受奴役的过程）之中。权力的操作原则的内化成为人的真正癫狂和破坏性的另一种表达。因此，阿尔诺·格鲁恩的告诫在任何时候对于我们来说都是一个警醒：“纳粹的教训不仅仅是有关强权政策、贪婪、狂妄以及恶




