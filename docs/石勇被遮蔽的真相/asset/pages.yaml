  md: '及以这些概念为基础的理论体系,全有赖于无意识的发现作为支撑。对人的心灵的洞悉开辟了一个全新的时代。这本精神分析的“圣经”从解梦出发,逐渐渗透于文学、哲学、社会学、艺术、政治学等学科中,对人的心理构成了巨大的冲击,根本性地改变了世界。


