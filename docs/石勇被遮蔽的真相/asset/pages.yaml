    这种象征语言本质上是人类的意愿、幻想、需求的一种不需要经过技术处理的投射。它不加任何修饰和打扮地裸露。它不借助任何载体而以物的象征表达思想。世界自然地作为一种直接感观的图式存在于他的脑海之中。而非常明显,
    缺乏技术手段的对世界的把握在人已具有自我意识后, 在一种主客体相区别的情况下, 人只有通过物的象征意义才能获得对世界的理解。


    弗洛姆由此分出了三种象征。第一种是“习惯性象征”。习惯性象征实际上是理性的产物, 是一种人认知世界的技术性需要, 或是某概念用来代表某物, 或是某物用来代表某现象,
    而在它们彼此之间却没有相似点或其他自然联系, 而仅仅是一种“一个特殊词用来称呼一个特殊物的习惯”。人类所创造的语言概念, 几乎是这种“习惯性象征”, 比如用“文字”来称呼我们借此进行交流的语言的书面载体,
    这种密密麻麻的排在纸上的东西显然和“文字”这个词语并没有什么内在的联系。很显然, 这种象征不具有象征语言的功能, 它无法切入人的内在体验。第二种象征便是“像发性象征”。这种象征我们真是再熟悉不过了。多年前我声嘶力竭地狂吼一首暴烈的摇滚歌曲时,
    当时是谁和我在一起, 我在什么地方, 当时的情境又是怎样, 我又是什么心情等等——构成当时我吼出这首歌的环境并已随着这首歌内化入了我的生命体验。


