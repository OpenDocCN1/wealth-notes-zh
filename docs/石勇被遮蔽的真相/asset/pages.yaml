- pgno: 198
  md: '打开人类历史的画卷，我们惊异地发现人类历史就是一部癫狂史、破坏史：难以计数的杀人放火、拦路抢劫、打架骂娘；无法准确统计的局部冲突、战争；惨烈异常的两次世界大战……这使人不由得想发问：这些并不被认为是神经病而能履行社会职责的人为什么会变得那么疯狂？破坏性是不是人的一种本能？


    动物行为学家康拉德·洛伦兹怎样认为？他在1966年出版的《论侵犯》里认为：人类在战争、犯罪、争斗以及其他种种破坏行为和虐待行为中所表现出来的破坏性，是种族发生史演化出来的，是人与生俱来的本能。这样，破坏性便不是植根于人类的外在存在环境而是植根于人类的生理—心理结构，即生物学——而不是社会学结构中，人想搞破坏就像人想吃饭、做爱一样，是不可抗拒的。


    洛伦兹的“破坏本能论”遭到了人本主义精神分析的开创者弗洛姆的驳斥。弗洛姆正确地指出，洛伦兹将两种破坏性混为一谈。一种是人与其他一切动物都共有的破坏性（侵犯性）。这种破坏性表现为：当人的生存利益受到威胁时，他将产生逃走或攻击的反应，而这种反应纯粹是种族发生史演化出来的。它只起防卫功能，一旦外在威胁消失，它也跟着消失。另一种破坏性则是人类所独有的，它不是源于种族发生史中的独特生理—心理构造，也不是为了生存的适应性，它“无目的可言，除了满足（人）凶残的欲望之外，别无意义”。而洛伦兹的错误就在于不加分辨地将人'
