  md: '住这些价值而摒弃已不合现代文明的内容乃是它的问题中应有之义。其次，人是文化动物，一个民族是以其文化建构其存在的价值确证的，这种文化赋了它以自我认同，给个体的安身立命以一定的文化身份。这种文化的支离破碎也意味着个体的无家可归。抽空了这种文化属性，个体的存在实际上也分崩离析。


    一个民族若抽空了其文化传统，第一将丧失民族的自我认同，第二将导致外在文化的殖民，第三在一定时期内将使社会的精神层面出现混乱并且浅薄化和无聊化，使人仅仅是漂浮于转瞬即逝的物欲符号的表层。无论哪一种情况，都是危险的。自
    20 世纪 90 年代以来的中国人的道德失范已证明了这一点，我们甚至可以说是儒家文化的失落导致了中国人的精神的猥琐。


    再次，文化之为文化，便不仅仅是一套游离于人心之外而只在思维层面活动的精神符号，它不可避免地会内化入人的心灵深处，建构人的精神世界，培养人的人格，形成人的文化心理，使他们形成一定的价值观念和行为模式。这种内化的过程是缓慢的，但一旦定型，便很难改变。这昭示出文化的发展从来就是渐进的，从来不可能“建构”，非要如此则容易导致表层的文化断裂：一方面许多仍然有价值的东西被荡涤，另一方面似乎要被消解的东西仍然深藏于人的心里，它们之间的断裂使文化焦虑转化成了文化危机，最终将瓦解人们的理性。这种文化危机渗透进政治、经济领域，则非常容易导致“摧毁”和“重建”的过激行为，到头来人们面对的往往是废墟。因此，“保守”一个民族的优秀文化传统，乃是保住一个民族赖以站立的地基，并且这个“原型”在对现代普适性的价值的接






