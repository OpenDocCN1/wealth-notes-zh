- pgno: 132
  md: '# **80**年代人：登场和再生


    人对历史的记忆是模糊的，即使是曾经熟悉的昨天，也总会在不断流逝的岁月中被我们淡忘。然而，人又生活在自己和一个时代的历史之中，他的童年、少年和青年，一开始就为他的一生确立了一个永难摆脱的精神定向。当我们想到，一个人成长的历史境遇以及此境遇在他的精神世界的折射左右了他的未来选择和终生的价值观念时，我们就感到，代际之间的文化认同体系既是异质的，也是疏离的。老年人会本能地对青年人的生活方式和价值观念怀疑和拒斥，因为这颠覆了他的历史。


    因此根据成长的时代环境的不同，有了50年代人、60年代人、70年代人、80年代人的说法。这些说法当然不无夸张、渲染的成分，每一代人的成长虽然都有着共同的社会文化环境，但由于生存处境的不同、社会角色的殊异，由此而建构起来的精神结构是不同的，不是所有的人都能进入这样的一个文化体系，而一定有许多不能进入这个时代的失踪者。然而从抽象的文化共性和心理特征上讲，它大抵上是靠得住的。每一代人都有一个被放大了的集体性符号，这个符号通过歌曲、影视、时尚、娱乐，以及其他诸如政治信仰、文化消费的共性而体现出来。这就是矗立在一个时代荒野里的“文化上层建筑”。这个“建筑”的地基，就是一代人大致相同的“存在境遇”。它就像给一代人进行了不知不觉的“格式化”，并用一定的符'
  merge: -1
  img_proc: true
- pgno: 133
  md: '号而对这一代人进行“编码”。自然，精神结构大致相同的一代人，就被定格在一个交织着共同的希望、理想、梦幻、冲动的时代环境之中，并不断地向未来的合理性开放。


    现代化的历程是一种加速度的历史性延伸，而后现代的喧嚣则使时代的变幻加剧。碎片、旋转、时尚、光怪陆离的梦幻在媒体的炒作中使一代人迅速登场，又迅速逝去。60 年代人已经过去了，它的宏大叙事已经走向了历史性的终结。70
    年代人在前几年的喧嚣中曾经风头出尽，它的文化诉求曾引领了时代的风尚并力求成为一个时代的精神表征。然而短短几年间，似乎横空出世般的 80 年代人就已经迎头赶上，他们的闪亮登场使
    70 年代人不得不黯然退场。老去就意味着死亡。在商业社会的集体性符号的消费中，任何与众不同的代际特征的涂抹一旦被消费便实现了自身价值的消解。70 年代人只是长期被压抑的商业社会的欲望诉求的一次释放，当这种释放获得了合理性的承认并在商业社会的逻辑中迎来社会变迁的深化时，它就必须让位于更能与这个社会的特征契合的群体的出场。如果说中国版的“新人类”与一个物质化的时代曾经构成了同质同构的关系的话，那么，在这个越来越物质化、虚拟化、符号化、消费化、平面化的时代中，没有哪一代人比
    80 年代人更能契合它所培植出的社会欲望。


    80 年代人不是从黑暗和虚无中走来，他们大的 24 岁，小的还未成年。在都市光怪陆离的“后现代主义”大街上、在时尚的杂志封面中、在网吧里、在绿草如茵的校园里、在闪烁着缤纷色彩的舞台里啸聚，一呼百


