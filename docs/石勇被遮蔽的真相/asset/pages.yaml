  md: '指令，这些指令是一种“原型”，很难破坏；而另一层则是外层，指一些闪烁在政治、法律、道德、时尚等领域的符号。很显然，两者的目的和运作方式根本不同，而后者基本上只具工具性质。对后者的改变不会带来文化系统的危机，因为遭到改变的，主要是制度和程序。从某种意义上讲，让这些领域的工具属性得到价值上的认定的，虽然可能还体现为某一具体的文化理念，但它应该是具有普适性的。正如在现代，严格来讲支撑统治合法性的已不是一套特殊的文化观念，而是自然法。它虽源于西方，但并不是西方的专利。这种普世价值不应该打上某一个文化系统的烙印。


    在这个世界上，每一个东西都有它的论域，如果越位可能使其功能归于无效。理念不能取代程序，价值不能取代制度。“儒化中国”可以在文化、道德等观念领域说话，但却不能是政治安排。它可以培养人们的人格，但却不能规范人们的思考。它可以让人们获得自我的身份认同，但却不能取代人们的生活。因此，文化保守主义把握好自身的限度和边界相当重要。非如此，则可能招致更多的误解。


