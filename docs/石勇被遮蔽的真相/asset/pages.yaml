  md: '然而，这恰恰不是哈耶克的那种自由主义，而是属于罗尔斯和德沃金的自由主义。奇怪的倒是在“哈耶克主义”的鼓吹下，为了利润不惜将人的生命当成原料的野蛮资本主义早已在中国扎根并谋得了合法性。但若“干预主义”不出现，这种“合法性”终将也是脆弱的。而人们也终将发现，不首先解决市场环境问题，不重视福利主义和对自由竞争进行必要的干预，即不对权力寻租、官商勾结、侵犯劳动者权益等现象进行狙击，那个没有任何公平可言的“市场”终将是畸形而脆弱的，它的虚假性实质上是一个自由竞争的陷阱。哈耶克的经济自由主义理论只能变成一个圈套，这个圈套一直在恭恭敬敬地候着人们。


