  md: '# 信仰：救赎还是奴役？


    1843年10月，克尔凯郭尔出版了他的《恐惧与颤栗》。这本让海德格尔、萨特、加缪、蒂利希、卡夫卡等思想家着迷并从中汲取过养料的重要著作宣告了一个“信仰骑士”的诞生。借《旧约全书》对亚伯拉罕杀子献祭故事的叙述，他对一种“宗教人生”进行了阐述和捍卫。这本著作的出现是他思想的继续，我们宁可说，在他“别了蕾琪娜”之后，世俗的爱情、婚姻、人群、伦理、秩序在他眼里已如过眼云烟，他成了一个“无限弃绝者”。他从此成了一个彻底孤独的人，一个“生在后死”的人。正如他后来说的：“从童年起，我就已经成为精神。”


    当信仰与人生已经融为一体时，克尔凯郭尔笔下的亚伯拉罕杀子献祭获得了新的意义。在信仰的屋子里，世俗伦理遭到驱逐，惟一的判决者是信仰对象本身。这个对象就是上帝。他是万能的裁决者和爱的化身。他的话就是绝对的信仰的命令。在这里，一个横亘在人类存在的悲剧性面前的悖论不可思议地凸显出来：当信仰弃绝一切世间伦理（良知、理性、秩序、世俗之爱）时，它是否还有存在的价值依据？以救赎原罪为目的的信仰若以“犯罪”为手段，它是否实现了对自身的摧毁，从而使信仰本身、信仰者和信仰对象成为“恶”的化身？当这种信仰变成只依赖信仰对象的指令来规范万物的绝对时，这种信仰对人到底是'
