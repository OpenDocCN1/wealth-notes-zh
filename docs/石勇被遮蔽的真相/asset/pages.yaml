  md: '岛理论的背景支持它的论证。现在，他认为，为了解决这个问题，分配者需要某种形式的拍卖或其他市场程序……假设岛上有无数贝壳，谁也不认为它们有价值，分配者把它们平分给每个移民，用来充当接下来就会出现的市场中的钱币。这些可以衡量物品的价值而本身却没有价值的“钱币”出现了，显然，当所有的资源都可以按钱币来衡量，一个可以拍卖的市场程序也就可以启动了。德沃金假定：岛上每一件单独的物品，都被列出售的一份，除非有人通知拍卖者（此时分配者变为拍卖者了）他打算买一件物品的一部分（而在此时这一部分同样变成了单独的一份）。接下来拍卖者为每份物品定价，看这种价格能否清场。也就是说，在那个价位上是否只有一人购买，而且每一份都能卖出去，不然拍卖者就调整价格直到清场。最后，嫉妒检验得以通过，人人都表示自己满意，物品各得其所。


    现在，我们可以认为，通过每个人拥有相同货币在市场里购买不同的资源的拍卖程序，每个人所拥有的资源所给他人造成的机会成本，与他人所拥有的资源所给自己造成的机会成本都是相同的。因此，这种分配便是资源平等的分配。分配似乎已经结束了，每个人都可以利用他所掌握的资源，自由地去追求他的“成功”了。而且，许多看起来好像与福利平等关系密切的因素都被排除了。比如运气问题，如果他的嗜好相当古怪，而在拍卖的物品中又没有他想要的东西；再比如许多人都有同一嗜好，而这些物品却又不够等等。'
