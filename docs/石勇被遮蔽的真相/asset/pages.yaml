    # 一


    在《影响人类历史进程的 100 本书》里，弗洛伊德于 1900 年发表的《梦的解析》榜上有名。这一年，生命哲学的巨擘、“杀害”上帝的“凶手”尼采仙逝，而人本主义精神分析的开创者、20
    世纪重要的思想家之一的弗洛姆来到人间。从这一年起人类开始在理性主义的初步幻火中踉踉跄跄地走进 20 世纪，战争、混乱、屠杀、非理性的理性狂热正在不远处恭恭敬敬地等候着这些眼睛只习惯向外投射，却忘记了审视自己的人。正是这一年，《梦的解析》以严肃的科学研究的态度终结了人类用神秘主义来解释梦的历史，并将人类对自身精神奥秘的探寻推向一个从未到达，却让心灵的活动得以澄明的地方。行为的表象和非理性主义的直观性、猜测性解释烟消云散了，生命本身、人类行为的秘密在精神分析之光的照耀下，正越来越显现出自身存在的结构、本质和活动依据。《梦的解析》对无意识的发现奠定了精神分析的基业，人格的三层结构、压抑、内驱力、本能等精神分析的最关键性概念以


