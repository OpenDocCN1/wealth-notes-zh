- pgno: 139
  md: '物质主义的逻辑建构于一次性消费的基础上，因此它对于新奇的事物是非常敏感的。长期浸泡在这种氛围中的80年代人因此而具有了更多的可塑性，从而也使他们一开始就比60、70年代人更具有宽容精神，因为多元化的物质状态是变动不居的。但从一个人的精神结构上讲，恰恰也是这种不断地向外界开放而丧失一个精神中心的可塑性导致了人格结构本身的不稳定。因此，他们必然很欣赏前卫，不断地追逐时尚，以掩盖因人格结构不稳定和不成熟所带来的精神焦虑。也恰恰是因为不能从父辈的生活那儿获得意义，并且自己也从未能稳固地建立一个精神的中心，叛逆便成了80年代人确立自己存在的价值依据。而与此同时，虽然他们中有的还呆在校园里，尚未能全身进入这个在90年代已经断裂的贫富悬殊的社会，但残酷的竞争、社会的不公、普通人的生存的艰难也在他们心中投下了浓重的阴影。许多人普遍的安全感的缺乏必然也殃及到他们。这个社会诚信的缺失，以及意识形态的谎言与现实的对比给他们以深深的刺激。他们的脚下不是道德和价值的土壤，而是一片精神的废墟。在这种复杂的社会背景中，他们必然变得极为敏感、焦虑、怀疑、唯我独尊、富于竞争性，并比以往任何一个时代的人都更想出人头地。


    是“酷”、“哇噻”、“韩寒”、“春树”这些商业符号使80年代人从历史的地表中冒了出来。然而，在商业化背后，还存在大学校园中的80年代人所建构出的与历史的厚度和现实的深度相融合思想和理性。在思想与商业的内在逻辑中，80年代人特有的亚文化碎片随风飞舞，使这样的一个集体性的符号完成了确认








    ![](img/7e667f542e5175c06fc3833e30d0f27f_139_0.png)'
