    朱学勤一举成名，以强劲功力浮出学术界水面应该是他的博士论文《道德理想国的覆灭》发表之后。这本剖析卢梭哲学，以及法国大革命的负面影响的书实际上正式宣告他已在思想上走向了英美自由主义。一个似乎是天生的“右派”在经历过一些粗浅的实践演练和思想的探索后，终于在思想学术界登场了。而这时，正是中国开始建立社会主义市场经济，以哈耶克、伯林、弗里德曼为代表的英美自由主义大举进入的时期。而即使是放到现在，这本书的影响都是深刻的。我们完全可以想像到这本书对许多人的思想的震荡。曾经担任朱学勤的博士论文答辩委员会主席的王元化先生曾在2000年12月14日写就的一篇名为《一九九一年回忆录》的文章中回忆道：“主持朱学勤的学位论文答辩这件事，是导致我在九十年代进行反思的重要诱因。他的论文引发了我对卢梭《社会契约论》的思考。这一思考延续到本世纪末，直至一九九九年我才以通信形式写了长篇论文《与友人谈社约论书》，作为自己对这一问题探讨的思想小结。”就连德高望重的王元化先生都受这本书影响，这本书的学术价值几乎不用再加以评定。在此后的许多文章和结集出版的几本书里，对“先验”的鄙弃和对“经验”的推崇，对改良的热衷和对革命的厌恶，对自由主义的狂热和对左派理论的批判，几乎成为他不变的套路。这种套路在他的《五四以来的两个精神“病灶”》一文和2004年2月23日在凤凰世纪大讲堂的讲稿《文化革命与“文化革命”》中发挥到极端，不仅民族主义、左派理论，连一度让人激动的五四也遭到了他的质疑。至此，他完成了从潜在的“右派”到现实的“右派”、从自


