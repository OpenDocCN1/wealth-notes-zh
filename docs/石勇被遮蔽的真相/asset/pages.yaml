- pgno: 172
  md: '阿尔诺·格鲁恩的理论弗洛姆等人的大异其趣。他虽然看到“我们自豪地声称我们生活在‘文明’之中，但是控制这一文明的法律和权力已经发展成为一种危及我们身心健康的机制”，但是，他的重点仍然放在“家庭”和“童年史”，而不是“社会”，虽然“社会”仍然是他的理论旨归。的确，我们已经用不着证明：当一个孩子脱离母体后，他的存在仍然是同母亲的存在连在一起的，只是在他的逐渐成长中，他才彻底剪断同母亲相连的脐带。在这个过程中，母亲代表了世界，从而母亲对儿童的态度也等于世界对他的态度。这并不难理解：一个没有自我意识的人（幼儿）同时也是一个与世界（母亲）融为一体的人，只有当知性使他有了对象意识之后，他才从这个世界中分裂出来而踏上“追寻自我”的长征。那么在这种情况下，很显然情况正如埃里克森所讲的，母亲是孩子成长的背景，而孩子的最初关于自身是谁的建构以及自我的确认正是在这样的背景下进行的。“这样”，阿尔诺·格鲁恩补充道，“孩子赋予自己生命的意义的过程就反映了母亲对他的生命赋予的意义。孩子从他的生命对母亲的意义中吸取自我生命的意义和价值，所以孩子发展的可能性和方式也取决于父母是否承认他的发展。形成自我的道路在任何情况下都伴随着烦恼、恐惧和危险。在这方面，母亲以及后来的父母是否愿意伴随孩子走这条道路也起到重要的作用。只有通过父母充满爱心的陪伴，孩子以后才能脱离父母并发展成一个独立的自我”。


    话已经说得够清楚了，我们需要追问的是：如果一开始父母对孩子并没有“充满爱心的陪伴”，不仅不




