  md: '# 被遮蔽的真相


    接近上帝。”


    显然，这里问题再一次转到了亚伯拉罕杀子献祭的行为。亚伯拉罕在作出选择之前，不知痛苦和绝望到何种程度。或者说，其绝望已经导致疯狂而使除上帝以外的一切虚无化。但为什么这种信仰仍然是异化的，他仍然是一个偶像崇拜者，并且只是信仰对象的一种工具？答案是他丢失了自身，丢失了依赖于人性而成立的良知和理性。信仰对象无论怎样冠冕堂皇，都是一套外在于人内在的良知和理性的精神符号体系，因此根本不能获得优先性和对人本身的规范性。这种异化的信仰用弗洛姆的话说，便是一种偶像崇拜式的非理性的信仰。


    在弗洛姆看来：信仰是一个人的基本态度，是渗透在他全部体验中的性格特征，信仰能使人毫无幻想地面对现实，并依靠信仰而生活。很显然，这是一种“理性的信仰”。而非理性信仰则是以人对非理性权威的情感屈从为基础的。在这种“信仰”中，信仰的对象是第一位的，而人的信仰本身以及人本身则处于被支配的屈从地位。这种非理性的信仰实际上是一种“逃避自由”的信仰，最终走向奴役。而理性的信仰在于对人本身的肯定，对人的主体性的肯定。基于此，一个无论是否信仰的人，记住弗洛姆以下的话也许都是有益的：无论我们是否信仰宗教，无论我们相信一种新宗教，或一种无宗教的宗教，或继承犹太教、基督教的传统，只要我们关心的是核心而不是外壳，关注经验而不是语言，关注人而不是教会，我们就能共同否定偶像崇拜。




