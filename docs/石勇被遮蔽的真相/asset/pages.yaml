  md: '罗尔斯的“正义论”经过几次变化，变成了“万民法”： “运用于国际法与实践的原则与准则中权利与正义的一种特殊政治总念。”由此， “原初状态” 也从一个政治共同体内部扩展到了国际领域，“主权国家”
    消失了，“人民社会” 在理论的假设中产生。显然，他的正义论在一个有限范围（国内）的政治共同体里演绎时，从理论上到实践上都能保持逻辑的自洽，理论与实践之间存在一种逻辑的通道。第一个正义原则论证了一个政治共同体只有是民主和自由的才是合法的；第二个正义原则则确保弱者从政治共同体获得补偿的权利。非常明显，这两个原则都建立在“自由而平等”
    的人的基础上，如果其中的一个原则被否定，那么正义论就将被否证。


    但这种正义论适用于国际社会吗？首先，一种原则、标准、理论要扩大适用范围，最起码要保证两点：它的逻辑体系一以贯之，不舍弃自身的某些含义。其次，用哈贝马斯的话来讲，这两个“公共领域”要有同构性。而罗尔斯的“万民法”所提出的八条原则只有第八条“人民要有义务帮助其他生活于不利条件下的人民，这些条件妨碍了该人民建立正义或合宜的政治及社会体制”
    勉强符合他的第二个正义原则。但在“正义论”中，第二个正义原则（补偿原则）不是基于道德要求，而是权利保证。换言之，这种补偿不是体现了补偿者的道德光辉，而是他们过多地获取了属于最不利者的那一份资源后的偿还。它的内涵是对公共资源的基于权利的重新分配。


    但在这里，人民（某个国家）有义务帮助（援助）另一些人民（国家），并不是正义论的第二个正义原则在'
