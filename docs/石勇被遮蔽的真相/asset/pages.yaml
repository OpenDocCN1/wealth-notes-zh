  md: '而虚构了一个“荒岛”。通过对这个“荒岛”理论的分析,我们或许更能清晰地理顺平等主义、自由主义的逻辑。


    在德沃金的语境里,“平等”意味着政府对公民“平等的关切”,这种关切不仅体现在政治上,而且包括了生活处境、经济权利等与自由的价值有关联的东西。它指的不是福利平等,而是资源平等。换言之,在分配的平等中,没有伤害到公平的自由始终是一个高于平等的价值,而且它需要考虑与公平有关的人的
    贡献和创造。而福利平等因至少更多地要考虑人的主观感受,从而在真正需要与虚假需要之间无法划出一条明确的界限。甚至它有可能在面临实际的困难时滑入结果平等,这就不仅侵犯了自由,而且伤害了公平:用勤快人的成果去奖励那些能够工作却选择了游手好闲的人,这样的世界是相当荒唐的。资源平等可以克服这一状况。德沃金认为:资源平等主义者相信平等关切所要求的政策目标是,要使经济结构分配给每个公民的资源尽可能是平等的份额,其衡量标准,是每个人所拥有资源的价值确为此人给别人造成的成本。


    这就是德沃金津津乐道的“机会成本”,也就是说,如果每个人所拥有的资源份额给他人造成的机会成本,以及他人所拥有的资源份额给自己造成的机会成本相等,那么,我们的确可以说,在此时候,即使人们拥有的资源各不相同,但因是每个人的兴趣、特长等“选择”的结果,如果能够不让一个人嫉妒别人拥有的一份,人们就应该被认为获得了平等的关切。然后人们可以在此基础上追求自己的“成功”,虽然在结果


