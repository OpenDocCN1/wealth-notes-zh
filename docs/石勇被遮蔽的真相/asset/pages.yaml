- pgno: 112
  md: '# 被遮蔽的真相


    他对这种文化的否定有时候等于他的自我否定。作为一种“集体无意识”，文化以人们所无法意识到的方式和程度规范着人们的内在精神和外在行为。


    人的“存在”可以具体展开为一系列的属性和内容，诸如民族、性别、年龄、地位、价值观念、思想倾向、文化偏好，等等，但真正来讲，人的存在属性多是一种文化属性，正是文化属性使其真正成为“社会动物”，成为一个有自我身份的人。没有进入某个文化共同体，他的自我身份就无法获得确证。也就是说，他将无法确证自身的存在。


    这种确证自身的存在和存在的价值的最深远的内驱力意味着：如果一个人自我否定，接受外在文化的文化殖民，他就必定会出现一定程度的文化焦虑和心理危机。由于文化形式和文化符号内化入人的精神世界需要一个漫长的过程，在旧的文化形式被否定，而新的文化内涵尚未植入的这个断裂过程将摧毁个人的文化主体性，导致其精神上的紊乱和道德选择上的无所适从。而个人通过对文化母体的否定实际上已经造成了一种对自我身份认同的否定，这种自我否定一旦与对物欲或其他欲望的追逐相结合，就会导致他对自我存在价值的否定。表现在整个社会，就是极度的道德失范和人性沦丧。中国改革开放后直到今天的道德危机，其根正源于此。


    完全可以想像，如果中国社会仍然一穷二白，传统文化再有价值，它在人们心理上也不会有什么魅力。正是中国社会的这种严重的道德失范，它对精神家园和伦理秩序的摧毁，迫使人们对此进行追问。人们终于发现，以这种“欺师灭祖”的方式对待传统文'
