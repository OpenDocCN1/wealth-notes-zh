- pgno: 140
  md: '自我的长征。弥漫在商业社会和校园文化的80年代人的叛逆、张扬、宽容、竞争、前卫的亚文化碎片无疑与主流文化保持着一种冲突的异质性，但这些亚文化碎片只有使80年代人的唯我主义被修正，才能克服对历史和社会责任感的冷漠无情而成为个人独立的一个前提。而当商业化的逻辑与高昂的学费、残酷的竞争、就业的压力紧紧地结合在一起时，危机感导致的的精神焦虑已经掩盖了大学校园里理想主义死亡之后的爱情消费。与商业社会的同构性并行不悖的是知识结构的完善和一定程度的精神危机，它们在一个冷漠无情的社会里为80年代人未来的机会设置了一个从智力结构到精神结构都必须得到变异的严酷前提。因此，未来如果属于80年代人，那么他们一开始便已经经受了灵魂的洗礼。


    一代人一旦从现在进入未来，那么他们将是创造历史。时代向所有人开放，但更具有与之呼应的一代人的特征。因此，80年代人对社会结构的冲击，是显而易见的。如果说校园里游荡的80年代人只是用观念给这个时代制造出一种亚文化的噪音，那么他们踏上社会后必然使这种亚文化的指令渗透入整个社会结构的机体。而这种对社会结构的冲击实际上是一个讲究速度、竞争、多元、自由的时代对老一代人的旧观念的冲击——他们的存在必然会通过与之对应的商业化而使老一代人不适应于这个时代要求的旧观念而遭到无情的抛弃。没有谁比他们更拥有商业化社会的背景，而这就是未来的机会。在多元化的思维方式和竞争性的存在氛围中，他们的亚文化碎片将会对主流文化进行重新
    “编码”，从而使社会的各个领域逐


