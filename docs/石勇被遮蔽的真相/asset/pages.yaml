  md: '# 被遮蔽的真相


    应。他们中有的人已经离开了校园，或迷惘，或焦渴，或被动地投入了这个社会。而能表现这个群体特征的更多人则聚集在大学校园里。他们编织梦想，然而在商业社会的浮躁和压力中，在越来越高昂的学费和严酷的就业形势中，他们的浪漫和青春的张扬已经渗入了曾经的
    60 年代人、70 年代人所没有的焦虑。这是早熟的一代。如果说 60 年代人、70 年代人在大学校园里能更悠闲地保持一份单纯的理想主义和宁静心情的话，那么，这样的风景在
    80 年代人中已经没有多少踪迹。社会变迁和物质化的生活方式使一套曾经构成了一个时代的精神坐标的意识形态已经解体，而冷冰冰的商业逻辑与异化的物质化存在状态抽空了他们与历史深度紧密结合在一起的价值依据。因而，没有什么能比由这个时代所演绎的，由他们所创造、参与、认同的文化生活方式更能感动他们。没有谁比他们更能敏感地切入这个时代，通过过早的社会化而预先地踏入时代的轨迹。


    代际之间的区别便是成长的背景。如果说 60 年代人是理想主义的一代，70 年代人是信仰破灭的一代，那么 80 年代人则是现实主义的一代。他们没有父辈人上山下乡的痛切感受，也没有信仰的幻灭所导致的精神苦闷和无所适从。一句话，他们的内心挣扎不是历史的折磨而是现实的精神焦虑。他们也没有
    70 年代人夹在理想与现实、信仰与“反信仰”之间的断裂的那种悲剧。毋宁说，从一开始，他们与这个物质化的时代就是天然地契合的。不是生理年龄使他们出场，而是时代环境使他们存在。


    80 年代人出生的时代是中国开始从历史的黑暗




    ![](img/7e667f542e5175c06fc3833e30d0f27f_134_0.png)'
  merge: -1
