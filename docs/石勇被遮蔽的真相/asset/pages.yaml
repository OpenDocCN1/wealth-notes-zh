- pgno: 159
  md: '# 关于农村土地私有化争论的一种哲学审视


    徐友渔先生在《90年代的社会思潮》这篇文章中指出：随着市场经济方针的确立，经济自由主义的旗帜鲜明地亮了出来。就此，“经济发展”的内在逻辑最终使统治获得了合法性的保证。接下来的事情自然是权力通过私有化改革而变成“权力资本”。


    经济自由主义的话语霸权使私有化从一种技术手段一跃而成一种理念。在国有企业私有化走上不归路，国有资产流失成为一个极为严重的问题时，私有化的目光盯到了农村。“农村土地私有化”的喧嚣一度成为学界的话题。这个话题最引人注目的，莫过于秦晖和温铁军的交手。


    在资本主义原始积累中发生的“圈地运动”，使自由主义成为秦晖等人赖以主张农村土地私有化的理论依据。依据文本的演绎和现实的触痛，按照一种抵御国家暴政的产权理论的预设，这种主张似乎是无可疑疑的。但问题的复杂性在于其结果的多向度中可能产生的对目标的背离。换句话说，一种理论的预设不能抽空其时空环境，它的演绎在现实的各种因素的干预下无法通过其逻辑的建构而达到目的。在私有化对国家暴政的抵御和可以预见的在广大农民未能脱离土地而成为“城里人”所发生的土地兼并狂潮中，前者的价值将在社会动乱的可能后果中被消解得干干净净。


    ![](img/7e667f542e5175c06fc3833e30d0f27f_159_0.png)'
  merge: -1
  img_proc: true
- pgno: 160
  md: '![](img/7e667f542e5175c06fc3833e30d0f27f_160_0.png)


    即使是一种正确的理论，它也不能变成一种纯粹的“文本分析”而抽空赖以证明其存在意义的语境。温铁军反对农村土地私有化的要点也在这里：在土地仍然是农民的一种社会保障的情况下，进行农村土地私有化的后果将是一场悲剧。


    但是，这种“学者的理性”无法抗拒根据某种逻辑进行的理论演绎的咄咄逼人的反击。这种脱离现实的理论乌托邦使私有化的观念一跃而为一种理念，从一种技术手段变成一种目的。笔者认为：只要中国的农民在总人口中不变成绝对的少数，只要土地仍然是农民的社会保障，那么私有化就必须在农村止步。当理论与现实的呼应使理论获得了一定的支持依据时，在未来农村土地私有化也许可以考虑。在此笔者不想就农村的现状与私有化的后果之间的关系进行论证，这方面温铁军等人已经提供了丰富的、无可辩驳的论证。但笔者愿意从哲学的层面，从理念与观念的分析中为温铁军的观点提供一点支持依据。


    按照某些人的预设，私有化通过产权的界定似乎是通向人权的保障和自由的实现的根本途径。也就是说，私有化已经与人权、自由等普适性价值产生一种对应关系并成为它们的保证。但无论是从这里还是从别的方面分析，私有化都是手段，是工具性的，它不是一种理念而是一种技术程序。就它的功能而言，它可能在反复的阐述中变成一种意识形态，但无论如何它都是观念性的，它的工具属性决定了它不是理念。理念作为一种抽象的价值形态对事物具有规范性，它超越于特定的现实而适用于普适的语境。也即，即使现实的“实然状态”对其本身提出质疑和否




    ![](img/7e667f542e5175c06fc3833e30d0f27f_160_1.png)'
  merge: -1
  img_proc: true
- pgno: 161
  md: '定，它的内在指令也不受现实的支配，它本身因为建立在人性的基本诉求上而“先验”地为自己的存在提供了价值依据。而恰恰也正因为现实对其的否定，它反过来成为关于现实的价值判断的标准，使现实的“实然状态”被其“应然状态”所扬弃。理念与“应然状态”有关，并不断超越于现实的逻辑。正是从这种意义上讲，理念是一种目的，它的超越性和普适性使它可以不考虑现实所发出的各种指令。


    但观念却远非如此。它的属性不包含人性的基本诉求，因此无法超越于特定的语境。它只是一种技术程序、一种手段的抽象，而这种手段和技术程序，其内在指令都依赖于现实的各种条件，或者说，其内在指令本身对现实的“编码”必须依赖于现实提供的各种说明。在复杂的现实之中，各种因素的交错作用时时企图对它进行干扰和消解，它的作用本身只有在与现实取得同构的基础上才能不因异化而对目的产生背离。这里的逻辑困境是：在它利用自身的一套指令和技术程序对现实进行规范和作用时，它所作用的领域只是现实中的某个截面，它所利用的只是某些因素，而除了这些因素，其他诸多因素也对它产生作用，所有因素的最终合力在它与现实的非同构性中只能驱动它偏离其技术程序所指定的路径。因此，它最终受到现实的规范和支配，它无法通过理论的演绎建构一种不受现实的指令渗透的逻辑体系。而从它是一种技术程序上也可以看到，它的存在与一定的语境的存在不可分离，它不是高悬在天空中只顾发出指令的抽象体系，而是一个理论与现实的共生体。它存在的意义就依赖于这些语境，当这些语境还未出现时，它


    ![](img/7e667f542e5175c06fc3833e30d0f27f_161_0.png)'
  merge: -1
  img_proc: true
- pgno: 162
  md: '的作用将无法满足足够的支持依据而只能导致其存在意义的崩溃。

    理念和作为一种手段、技术程序的抽象的观念的非完全对应关系如果不能从将它们联系在一起的理论体系中加以界定，其结果将是这种理论体系的“碎裂”。社会主义的空想激励了许多人，但社会历史的局限性却使诸如计划经济、公有制等技术程序沦为笑柄。而人们犯下的最大错误是将这些技术手段变成了意识形态，赋予了它过多的价值判断，甚至无视其受语境的约束而将它按理念的标准来加以演绎。作为它的反动面的私有化若企图上升为一种理念，企图从技术程序的等级上向具有普适性语境的理念越位，同样将会异化得面目全非。没有语境支持的技术程序等于无源之水，而力图赋予技术程序以过多的价值属性将使它无法跳出乌托邦的旨归。在农村土地私有化的争论中，这种理念和技术程序的非完全对应也许可以告诉我们一点：农村土地私有化在未来条件许可时也许可以，但若是在现在，肯定是不行的。'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# 21 世纪，谁来制约美国


    经过科索沃战争和伊拉克战争，无论我们是支持还是反对，作为一种客观存在，弱国短时间内便在强大的军事侵犯中或跪地求饶或被摧毁，已经以平民的鲜血和民族的屈辱昭示出这一点：再也没有什么力量能制约美国，它已经可以为所欲为。


    20 世纪八九十年代之交的东欧“社会主义”政治秩序的崩溃，以及早先一步的庞大的华约集团的解体为美国鞭笞天下提供了天赐良机。力量均衡的打破呼唤出了霸权主义的魔鬼。失去制约以及威胁的现状则使强者在扩张和炫耀武力上呼啸奔突，高歌猛进。从此，具有原教旨主义特征的新保守主义在高度膨胀的国家利益的指令下为政客的嗜血渴望而涂脂抹粉。而无论是资本财团的利益还是仍然以国家利益、自身利益作为出发点的“民意”，皆成为战争机器的动力。这种以核力量做后盾，以激光制导导弹、战略轰炸机打头阵的民族主义狂热开始了新一轮的扩张的长征，而自由主义的理念之光早已被遮蔽。


    问题已经不在于野蛮的塔利班政权和罪恶的萨达姆独裁政权被一举抹平后的狞笑、狂呼、大哭和悲愤，而在于，平民的鲜血以及联合国阻止流血发生的无能又一次营造出了特立独行的弱者在恐惧中生存的情境，整个国际社会又一次被带回原始丛林。在这个惟蛮力是举的原始丛林里强者与弱者本身对内和对外关系出现了深刻的断裂，也就是说，用强者国


