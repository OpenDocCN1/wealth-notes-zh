  md: '# “乌合之众”:通往奴役之路的羊群吗


    1848 年 2 月 22 日,法国“二月革命”爆发。在 1789 年的“恐怖”幽灵复活中,巴黎街头一片混乱,国王路易・菲利普逃到英国。无法亲历 1789
    年的大革命却有幸目睹此情此景的亚历克西・德・托克维尔恐惧不已。他胆战心惊地写道:“在思想上我倾向民主制度,但由于本能,我确是一个贵族——这就是说,我蔑视和惧怕群众。自由、法制、尊重权利,对这些我极端热爱——但我并不热爱民主……我无比崇尚的是自由,这便是真相。”①


    当广场上黑压压的人群狂怒地发出炸雷似的吼声时,龟缩在“议会大厦”里的绅士们感受到了赖以保证他们的利益和“自由”的“上层建筑”的摇摇欲坠。地基撼动了。只有既得利益者——贵族们才想到要“保守”的统治秩序被“群氓”们不费吹灰之力地摧毁。社会的分层、上等人和下等人的“法定”和习惯的等级秩序在革命的狂潮中就此成为一片废墟。这些瑟瑟发抖地将硕大的脑袋伸出窗口惊恐地看着狂怒的人群的人们,一定感觉到了末日的来临。


    在蔑视和恐惧群体基础上的“自由”只是盘踞在社会上层的既得利益者的自由。它取消了自由的普适性,将它变成了一部分人的私有财产。没有谁不爱这种自由,甚至连最独裁的暴君也是如此。在同一片天空下,阳光是共享的,自由也不是一部分人的专利。托克维尔超出同时代思想家的一点就是预见'
  merge: -1
