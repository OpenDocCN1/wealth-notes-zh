  md: '# 一、


    作为人，我们不可能不思考，而只要追问我们思考、选择、行动背后的逻辑、依据和环境，我们就已经进入了“批判”的状态。而“批判”不是单纯的智力活动，它意味着思考与行动、精神与肉体的交融，意味着对世界真相的一种探索。它从形而下的生活状态出发，向上盘旋，与形而上的精神理念接壤。


    正因为如此，批判是对现实的一种超越，这种超越延伸到了支撑这种现实存在的观念和法则的层面。现实有时候在一个批判者眼里已经退化成一种载体。观念和法则本身可以衍生出诸形态不同的现实，但它们在逻辑上却多具有同构性。人们无论认同还是反对某种现实，它都可能是他们所反对或认同的观念和法则以其内在指令渗入而衍生的一个结果。就此而言，批判者相对于无法离开现实的社会大众来说，注定是孤独的。


    当苏格拉底衣冠不整地在大街上与人探讨什么是正义时，他对生活的伦理内涵充满了渴望。结果他被处死，而投票处死他的，多是那些眼神惊慌失措的人们。克尔凯郭尔终生无法融入这个世界，在哥本哈根阴郁的街道里，他艰难地挪动着步子。旁边是大人们的嘲笑，背后是一群孩子的石块追击。一直到死，他都逃不过恐惧和颤栗的狙击。尼采在他还未疯的时候便被视为疯子。他抱着马头痛哭的情景让我们穿过他对平等的诅咒和对超人向往的幻象，直抵他软弱的内心。在这一时刻还原出了一个真正的尼采：被抛弃的只是现实的幻觉，他一直在拥抱这个用许多...


