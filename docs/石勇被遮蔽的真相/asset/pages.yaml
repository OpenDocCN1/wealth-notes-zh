  md: '# 良知先于理论


    “良知先于理论”这个标题是从张汝伦先生那儿借来的。他那篇文章原先发表于《读书》上，后收入他于2003年8月由广西师范大学出版社出版的文集《良知与理论》。


    按张汝伦先生文中隐晦的表达，“良知先于理论”的意思大概是，如果将良知和理论当成两种相互联系的价值，那么，良知无疑具有优先性，因为“如果良知泯灭的话，那么理论的拙劣便会暴露无遗”⑴。没有良知或凌驾于良知之上的理论是虚伪的，“在这里，没有逻辑，只有利益，而理论不过是利益的工具”⑵。


    1998年，在全世界纪念《共产党宣言》发表150周年之际，既不是欧美新老左派，也不是第三世界的激进分子，更不是共产党员，相反，倒是“后现代资产阶级自由主义者”的美国哲学家罗蒂出人意外地在马克思的故乡——德国的《法兰克福汇报》上发表了一篇题为《失败的预言，光荣的希望》的纪念文章，向马克思的预言表示了崇高的敬意。张汝伦先生由此评论：“罗蒂在讲《新约》和《共产党宣言》的时候，心中洋溢的，一定是……人类平等的伟大理想。在嘲笑理想和热情成为一种时尚的今天……《失败的预言，光荣的希望》不是一篇理论文章，而是一个人良知的表白。”⑶


    理论是灰色的，生命之树常青。同理，理论是苍白的，良知更有永恒的魅力。当萨特这个干瘦的老头在1968年的“五月风暴”中走上巴黎街头散发传单，与学生一起抗议社会的压迫与黑暗时，当古稀之年的'
  merge: -1
  img_proc: true
- pgno: 15
  md: '罗素主持“审判”越南战争罪犯的“罗素法庭”，为和平与人道主义苦苦呼吁时，当弗洛姆这个理性、平和的老头参与人道主义组织“大赦国际”，用相当多的时间为人道主义和和平呼吁时，我们感到，他们的这些行为，比《存在与虚无》、《人类的知识》、《健全的社会》这些浓缩了他们思想的名著，无疑更有魅力得多，更能让我们触摸到良知、公正和希望。如果诗人海涅所指的这些平时沉默寡言的哲人的力量不仅包括他们的思想，还包括他们的人格，那么，他们的良知，便是一种“雷霆万钧的力量”。


    如果说在绝对正确的革命之上，在绝对正确的自由和绝对正确的民主之上，有着更加绝对正确的人道主义，那么，良知，便不是用工具性质的理论，而是用人的自然天性把握和关怀人本身。按人感知、认识能力的历史发展规律，这种把握和关怀便是人通过直觉、通过感情、通过心灵与心灵的直接沟通，而不是通过被物化的、具有人造出来的逻辑结构特征的理性能力，力求与世界达至和谐统一。在此，被理性压抑，只有通过外物的中介才能感知、认识、规范人的心灵与社会秩序的人类性恪被彻底砸碎。这是一种返回人存在的本真状态的努力，更是对物化的人类命运的抗议。理论作为已经物化的逻辑体系，并不能直接切入人的生命本体，因此，不管它是否自称或被称为错误或真理，它都必须遭受质疑。良知与人的价值本体同质同构，而理论则必须通过良知的指令、体系的真诚、实践的检验来获得证明。也正是在这种意义上，良知先于理论。


    然而，“良知先于理论”在说明良知对于理论的优


