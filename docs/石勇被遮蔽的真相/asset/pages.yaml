    的，莫过于一套能解释社会历史的规律、宇宙人生的奥义，为人的生活存在提供答案和终极关怀，为人的幸福和解放提供某种保证的理论或意识形态体系了。这些精神符号体系越是具有终极性，越是能逼近人的存在的内核，或是能为人提供强大的精神力量，就越能让人信仰，并且能成功地整合人心。在这方面的例子无过于宗教和类似宗教的意识形态体系。这些精神符号体系因其或者号称掌握真理，或自标代表正确和善，并且能提供一套自洽的逻辑，因而它一旦让人信仰，其信仰者从中所汲取的精神力量是相当强大的。这些信仰者也有可能用信仰对象的指令来作为判断事物的标准，从而成为偶像崇拜者。


    我们若是从人的存在困境和信仰的原始结构考察，可以发现信仰应该是精神上的，即它无关认知，只关价值，本质上是人的精神生活的需要，是人渴望救赎的证明，是人在绝望和痛苦中抓到的一根救命稻草。因此，并不是什么人人都可以成为信仰者。一个信仰者要么是一个充满爱的人，要么就是一个已经绝望的人，心灵没有震颤过的人实在谈不上什么信仰。关于这一点舍斯托夫有过精彩的分析，虽然已经走向极端：‘假如我弃绝一切（就像通过有限和辩证法‘解放’人的精神的思辨哲学所要求的那样）——这还不是信仰，这只是俯首听命……我有信仰，我什么也不会弃绝。相反，借助信仰我获得了一切……’他接着说：‘只有当人们看不到任何可能性时，人们才去信仰。上帝就意味着一切都是可能的，而一切都是可能的，也就意味着上帝。只有身心受过震颤、变成精神的人，才能理解一切都是可能的，也只有这样的人，才能


