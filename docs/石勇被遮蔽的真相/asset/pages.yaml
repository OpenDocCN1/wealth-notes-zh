- pgno: 131
  md: '义、后殖民理论多是一些解构性的、批判性的理论。即使到现在，新左派只能在局部问题上令人信服地论证其理论的成立，而无法提供一个可行性的总体理论对政治经济制度进行新的设计。


    但这还不是最致命的。有可能导致它的自我解构的是一些新左派人士对“毛时代”的美化。不管这是一种不是“权宜之计”，这样做都是给自己制造一个陷阱。崔之元对“鞍钢宪法”的吹捧曾产生很大的负面影响，道理非常简单：对一个事物的局部肯定不能推翻对它的总体性否定的结论。虽然对局部的肯定也是在还原事物真相，但只要出于“论证”的目的，对此进行美化的逻辑非常容易因理论自洽的需要而使被否定的总体重新具有合法性。站在弱者的立场上，新左派显示出了可贵的道德关怀的勇气，但一个显然的事实是，改革通过否定自身的合法性而催生的下岗工人等弱势群体对“毛时代”的怀念并不是真的想回到“毛时代”，而仅仅是通过“距离产生美”的效应，在一种心理幻想中借以鞭挞现实而已。这是一个无法回溯而且也不应该回溯的时代。特定的现实情境决定了少数新左派人士的某些不恰当的言论只能殃及整体，使本来思想资源极为复杂、更强调自由的普遍性和实质性的它因形象受损而导致某种危机。






