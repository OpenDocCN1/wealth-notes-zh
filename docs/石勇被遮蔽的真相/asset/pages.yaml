  md: '# 同情心是怎样丧失的


    # 一


    “同情心的问题与什么是人的问题和人的同一性问题有关， 同时也与下面的问题有关，即人在肉体和 精神上受到多大程度的伤害之后还仍然能够坚持人 性”。①


    在今天，阿尔诺·格鲁恩这个名字对于我们来说 已经不那么陌生了。在整个 20 世纪的精神分析大师 中，我们认识了弗洛伊德、荣格、弗洛姆、阿德勒、埃里 克森、霍妮、苏利文、拉康，也认识了已经将精神分析
    与存在主义、宗教神学联系在一起的兰克、布朗、贝克 尔等人，而同样作为精神分析学家的阿尔诺·格鲁恩， 则以其的一本惊世之作《常态下的癫狂》，让我们记住 了这个闪烁着天才般炫目光辉的名字。


    1987 年，在弗洛姆、霍妮等人已经走到研究常态 下的癫狂的大门却因对其他问题的更大的理论兴趣 无暇进入时，他走了进去，以一种惊心动魄的话语方 式向我们揭露了人的常态下的癫狂的秘密。这是对
    帕斯卡的“整个人类的疯狂竟然如此不可避免，以致 不疯狂也是另一种形式的疯狂”的杰出回答和天才论 证，而这种论证完全是精神分析意义上的。10 年后的 1997
    年，在《常态下的癫狂》里提出的关于人的同情心 问题的基础上，他又以一本《同情心的丧失》对同情心 问题进行了深入的研究。




    ![](img/7e667f542e5175c06fc3833e30d0f27f_168_0.png)'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# 二


    像《常态下的癫狂》产生的社会效果一样，《同情心的丧失》在给我们以强烈的震撼和极大的启发的同时，在某些方面是有些令人沮丧的。我们习惯认为：一个人之所以没有同情心，肯定是精神结构产生了病变，它是道德败坏的一种反映，却不一定与一个社会的隐秘的精神暴政有关。可以肯定的是：一个没有同情心的人，就像一个贪婪的人，是一种病态的特征，不过它是否与人的“创伤性的存在经验”联系在一起，是处于我们的视野之外的。然而一个精神分析学家与常人的不同就在于他能透过现实的帷幔而看穿现实的幻象。阿尔诺·格鲁恩认为：“我们失去了同情心，其原因是我们失去了同我们自己内心痛苦的联系。”②


    这个观点是一个严肃的精神分析学家通过长期的治疗和经验观察得出的，而且具有无可辩驳的实证性。在阿尔诺·格鲁恩表面上不动声色的描述中，我们恍如看到了那一个个扭曲的灵魂。一个丧失同情心的人也是一个极富破坏性的人，这种破坏性倒不像他所讲的只是为了在别人的身上制造痛苦来对自己已经无法体验的痛苦进行补偿，恰恰相反，正是为了彻底扼杀痛苦，因为通过人的普遍的存在困境的中介，别人的痛苦让他看到自己的危险的祸端。


    在生存论哲学的视野里，阿尔诺·格鲁恩的这个观点是不难解释的。人作为一种社会性的、具有自我意识和对象意识的类的存在物，其生理与心理结构都具有共通性，是紧密地联系在一起的。或者抽象地说，人的人性是相通的，在人与人之间未异化的状态




