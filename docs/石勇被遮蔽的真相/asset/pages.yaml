- pgno: 118
  md: '# 被遮蔽的真相


    此时改革的重点早已移向城市,农村成了一块被人遗忘的角落。农村改革中获得的收益,逐渐被各种坑农行为损耗殆尽,特别是中西部农村已全面败落。另一方面,城市高速发展,不断变幻的物质生活和文化享受形式形成了一种强大的、近乎不可抗拒的诱惑。它与贫穷落后的乡村的强烈对比,使本已日益衰弱、消失的乡土文化雪上加霜。这种现实的严重失衡造成了已经找不到一种可以在乡村中抵抗异质文化“入侵”的精神生活支撑的农民的心理恐慌。农村此时再也看不到希望,成了人人都想逃离的地方。大量的农村青年流向了城市和沿海发达地区。


    此时,许多在平时本来可以给农民提供劳苦之余的娱乐的文化形式似乎都在一夜之间消失了。而许多尚未消失的文化娱乐形式,也多在春节或非常重要的日子才能出现。然而即使是这样,它的形式意义也已经远远大于实质意义,在短暂的精神愉悦中无法掩饰已经被挤到一边的乡土文化在城市文化的殖民中所带来的精神困境。只要农村不能恢复或建构出自己的文化生态,只要城市文化在“入侵”中与城里人对农民的歧视相结合而附带了过多的价值判断,那么在一种“被殖民”的困境中,农民的文化心理将是极为脆弱的。


    在许多似乎已被“现代化”的进程所抛弃的中西部农村,不管曾经丰富活跃的文化娱乐形式如何令人怀念,如今似乎都已开始了一种乡土文化的冬眠。不仅“电影”这个概念已经从生活中消失,甚至龙灯、花灯、傩戏、对歌等等,即使存在也因文化焦虑而使“共同体的狂欢”魅力丧尽。由农民创造并表达农民劳动




    ![](img/7e667f542e5175c06fc3833e30d0f27f_118_0.png)'
  merge: -1
  img_proc: true
- pgno: 119
  md: '之余对爱和美的追求与表达的文化形式，在“现代化”的城市文化冲击中失去了价值。


    如果一种与土地的质朴和生命力紧密相关的文化生活不是一种“安慰”，不是一种对一个精神家园的“建构”，不是通向“终极关怀”的努力，而仅仅是一种“麻醉”，那么他们现在的“麻醉”也是令人心酸的。除了偶尔的赌博，他们的所有文化娱乐活动就是像王曉明在L县看到的那样看非常拙劣的电视肥皂剧。他们也会沉浸入剧情中，或欢笑，或悲叹，或过后津津乐道，但却绝对不会深思。从本质上讲，这种电视剧与他们隔膜，其剧情背后的生活和理念都与他们的生活处于一种异质的状态，不仅未能切入他们的生活，更未能直面他们的精神困境。他们在“看”电视时只是一个纯粹的旁观者、一个品头论足者，一旦有新的肥皂剧出现，给过他们娱乐的剧情马上便成为过眼云烟。越是沉浸在这样的肥皂剧中，农村的文化生态便越恶劣，或者反过来说，他们对肥皂剧的热衷仅仅是文化生态已经极端恶劣的自然反应。


    异质或异构的文化一旦碰撞总会发生较量。某一文化系统内的不同文化形式同样会相互渗透而出现文化殖民现象。按“强力者说了算”的规律，文化殖民背后必有强大的政治与经济力量支撑。权力、财富等稀缺社会资源与人的恐惧心理、享受心理结合，并通过它们所隐含的价值判断，非常容易摧毁没有这些稀缺资源的人的心理防线。而在共同的一个文化系统内，人们的心理防线主要并不是由各不相同的文化形式构成的。中国的农村与城市相比，除了人数外，在所有重要的资源方面都极不对等，农村绝对处于弱


    # 第一编 现实的审视


