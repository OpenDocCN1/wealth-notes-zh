- pgno: 126
  md: '传统文化的光辉再一次显现，它被看成是一剂解药。另一方面，中国的崛起迫切需要建构出一种文化—精神共同体，人们需要一种可以确证自己的存在价值的文化认同形式。如果说由于文化与政治经济等领域的复杂关系往往会牵一发而动全身，不自觉地演绎出一种政治经济的溃败要求文化负责的逻辑，那么，仅仅在政治经济上强大对于人的精神世界来说是远远不够的，没有独属于自己的文化来对此进行合理性的检验，人们就很难在自信的基础上获得生命的尊严。


    因此，不管文化保守主义者如何论述文化与政治的关系，不管“儒化中国”和“圣人教化”的主张具有何种逻辑上的合理性，文化保守主义一旦意味着向古典回归的“政治保守主义”，在目前的下它就很难获得公众的认同。人们对历史上的专制统治的痛苦记忆将被激发，并产生出一种对现实政治的担忧，从而导致一种本能似的反对。如果“政治”的所指压倒了“文化”的所指，那么它所获得的超越流派的广泛基础就有可能松动。这样的一种局面显然不利于文化保守主义的开掘，因此在言说时它不能不注意言说方式，考虑自身的限度和所指，以避开可能的陷阱。


    # 二、自由主义


    自1998年“浮出水面”以来，在七年时间的“公开言说”中自由主义已经占领了越来越多的思想地盘。虽然现在由于它的一些自我解构和极端化言论已经导致了它的分化以及许多原本支持它的力量的反弹，但不管怎样，起码到目前为止，它在民间和学界都居于主流地位。它的强劲势头甚至使我们不能不展开'
  merge: -1
  img_proc: true
- pgno: 127
  md: '这样的想象：它或许会主导中国未来的政治格局。相对于文化保守主义和新左派而言，它的优势是不言而喻的——既没有必须对过错和负面影响负责的历史包袱，又具有一个力量相当强大的国际背景。


    从思想的“接受”角度看，无论文化保守主义还是新左派都无法与自由主义相比。由于对传统文化已很隔膜，一般的人对文化保守主义的理解尚停留在像西方文化形式那样的“时尚”层面，只有学者和心灵敏感的人才能更深入地用精神和生命去参与。新左派由于被不公正地指责为必须对历史上的“左”的灾难负责，并且现行政治意识形态仍然以“左”的名义存在，这种与现实不符而通过“概念连坐”的方式进行判断的单维度思维使它似乎一开始在道德上就处于劣势。人本能似的情感反应常常容易导致一种在无知基础上的非理性偏见，以致许多人都不明白新左派在说什么就一概否定。这种简单的“刺激—反应”机制使许多人倾向于对“左”作出彻底否定的反弹而选择既没有历史包袱，又有强大国际背景，并且作出了“自由”承诺的自由主义。用新左派的一位学者韩毓海的话说就是：自由主义的得势是必然的。


    中国的自由主义是一个相当矛盾的东西。一方面经济自由主义成为官方经济改革的主流指导理论，而那些被称为是新左派的经济学者反而处于被排斥的“非主流”地位。而另一方面，政治自由主义虽然在民间获得了广泛的思想市场份额，许多商业媒体甚至学术刊物都有自由主义倾向，但它的激进主张却一直遭受官方打压。这种反差极富讽刺意味：一方面政治自由主义寄希望于经济自由主义的逻辑荡涤社会主




    ![](img/7e667f542e5175c06fc3833e30d0f27f_127_0.png)'
  merge: -1
  img_proc: true
- pgno: 128
  md: '义的体系以为自己准备社会和经济基础，另一方面经济自由主义不择手段的逻辑延伸却又解构了政治自由主义的逻辑。


    随着经济体制改革的日渐深入内核，经济自由主义日渐被公众视为一种抢劫理论。“改制”的结果是数千万工人下岗失业和极少数国家下部、国企负责人、私人企业家的一夜暴富。极大的社会不平等使这种改革越来越无法通过人们心理上合理性的检验。这种反弹的结果就是对指导这种“改革”的经济自由主义的拒绝。经济自由主义的这种连济齐克的“获得正义”底线都不要的“抢劫”木来就是
    对政治自由主义所含的价值理念的否定，并且一次次地通过人们的不满而破坏政治自由主义的基础。但奇怪的是，除了少数有良知的自由主义者外，多数自由主义者对此视而不见，甚至公开支持。也直到这个时候，许多为改革付出巨大成本的人似乎才发现原来自由主义是一种强者哲学，是精英们的一种工具，从而对中国特色的自由主义产生了深刻的反感和怀疑。


    在另一方面，自由主义者的“激进”立场和他们过度的媚美姿态使他们“脱离”了中国社会。他们不仔细地分析具体的情境，一概将人们对美日 的心理反弹斥为不可容忍的“民族主义”。他们不仅痛斥那些其实只是受到刺激才非理性地加以宣泄的“民族主义”，而且基于朴素的民族与国家认同的“爱国主义”也不放过。而更让人难以接受的是，在“自由”的名义下，他们对美国却媚态十足，并不时发表一些伤害中国人的民族尊严的极右言论。这样的表演只能让许多有民族自尊心的人与他们拉开距离。基于历史上深受




