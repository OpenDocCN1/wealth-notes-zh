  md: '# “人权”与“主权”之争背后

    断裂的普遍性话语


    后现代主义已把“现代”的许多东西变成了“文明的碎片”。在一片解构声中“主体”轰然倒地，“中心”颓然解体，“标准”成为梦呓。“普遍主义”似乎也已成功否证。


    这种泡沫化的学术时尚颇能迷惑人。事实上，它对“现代性”的解构只能解构其意识形态化的结构，而非现代性本身。解构之后并没有留下一片废墟。但许多东西却必须守好自己的边界，不能越位。


    但“解构主义”的极端化实际上也只能导致其自我解构。像费耶阿本德那样讲的“怎么都行”事实上只能是“根本行不通”。非常明显，没有一种标准、一个中心，理论视域将处于无序状态，在这种混沌状态中任何一个以其指令企图对世界加以重新解释的理论将无法确立一个逻辑基点建构自身。“相对主义”的盛行只能是“一切都是相对的”，从而取消包括“后现代主义”在内的任何一种解释和规范系统的合法性。


    这实际上是说，不管“后现代主义”多么夸张和激进，实质上它与“现代主义”的冲突并非处于同一层面。这种冲突不过是“现代性话语”在话语权力的内在逻辑下越出自身的适用界域，导致理论困境和现实灾难而被“后现代主义”加以解构、纠正、打击的结果。与保守主义所包含的“回归古典”不同，后现代主义对'
  merge: -1
  img_proc: true
- pgno: 205
  md: '现代性话语的否定并非整体否定，而是要把“现代性话语”的那些意识形态外衣剥去。不管怎样，保守主义的视域对应着一个传统和古典的世界，而“后现代主义”的脚下却是“现代性”坚实的地基。


    所以，“现代性”即使被解构，也只是话语的被解构，而非其价值的被解构。它所确立的诸多价值，事实上也没有被消解的正当性。诸如民主、自由、人权、平等、人道，等等，这些价值与其话语之间事实上并非一个完全融合的整体。不断扩大其能指的只是价值的表述，而非价值本身。因意识形态化的话语的被解构而导致价值的被否认，恰恰说明现代人的思维是何等的单向度。它也是“后现代主义”被误解，被滥用，以及现代社会价值无序、相对主义泛滥、道德沦丧的根源。


    与“后现代主义”相比，现代性话语的一个特征便是具有普遍化倾向。这也是它要被解构的一个重要原因。但我们必须看到，话语的普遍化是非法的，因为无限丰富和复杂的世界远非任何一种话语所能表述、解释与规范，显然任何一种话语都无法在其有效性和合法性的规约下越出其适用界域。但话语所表述的某些价值，诸如自由、民主，却是可以普遍化的，因为它的“存在理由”本来就是普遍化的：它与普遍人性或人的普遍意志对应。


    所以，“普遍主义”有可能是一种意识形态的扩张，也有可能是一种价值的普适性诉求：它既可能被强权实体所利用，也有可能摧毁另一些强权实体的统治逻辑。而普遍主义和反普遍主义显然都同样具有理论上的困境与被强权实体所利用的弱点。关键是




    ![](img/7e667f542e5175c06fc3833e30d0f27f_205_0.png)'
  merge: -1
  img_proc: true
- pgno: 206
  md: '什么样的普遍主义——价值的，或是价值的体现者、表述话语的？是基本价值还是派生价值？它的合法性对应于什么样的语境？当我们支持或反对美国以“民主”的名义进行征伐时，我们依据什么来对我们的选择进行合理性的论证？普遍主义在何种意义上才成立呢？


    从人的心理上看，似乎普遍化是标准、价值、理论、规范的一种“本能”，尽管它们的程度和范围不一。如果一种理论竟然只能被迫承认只在某个狭窄的范围和层面才能确立自己解释和规范权力，那么一定令人沮丧。古希腊的哲学家们眼光盯的是整个自然、宇宙，他们的哲学理论也总希望能将世界上的许多事物囊括其中，从一个基点出发，经过层层推演，达致与世界的同构。在现代，普遍化的“主义”特征已非常明显，一种政治制度或生活制度上的价值被认为是普适于全球的，而且具有不容置疑的正当性。最明显的两个事例是：哈贝马斯的“公共领域”概念经过扩展，已经适用于国际社会；而罗尔斯的“正义论”也从一国内的政治共同体走出进入全球，变成了“万民法”。


    当启蒙将神从人的世俗领域驱逐出去，人就是政治共同体的权力合法性来源。这时，政治、法律、伦理秩序背后就必须要有一个道德基础支撑，即必须证明自己的“正当性”。这是因为它们只是工具具价值，它们的逻辑体系只能论证自身的形式合理，而不能论证自身的实质合理，即自身并不是自身的价值依据。


    在这里，康德的普遍主义义务伦理学可以对普遍主义的分析提供一个说明。他曾说过一句有名的话：“你行动所依从的准则，需要同时使其自身成为像自




    ![](img/7e667f542e5175c06fc3833e30d0f27f_206_0.png)'
  merge: -1
  img_proc: true
- pgno: 207
  md: '然普遍规律那样的对象。”①因为一条规范、准则如果不具有普遍化的客观性，它就无法在价值上证明自身，就不能成为一种“可能的普遍立法的原则”。对此康德有过精彩的说明：“……虽然我愿意说谎，但我却不愿意（让）说谎变成一条普遍的规律。因为按照这样的规律，也就不可能作任何诺言。既然人们不相信保证，我对自己将来的行为，不论作什么保证都是无用的。即或他们轻信了这种保证，也会用同样的方式回报于我。这样看来，如若我一旦把我的准则变成普遍规律，那么它也就毁灭自身。”②


    从另一种意义上讲，伦理规范的普遍化尽管在形式上和逻辑上可以遭受种种或许是有力的质疑，但这的确是它的一个特征。一种需要考虑各种不同的场合而灵活变通的伦理规范只能归于无效。事实上在遇到复杂的情况时，显然不止一条规范可以起作用，而是根据实际情况使某条规范优先。但这一点也不意味着具有普适性的其他规范就“不在场”，作为一种命令，它仍然是存在的，只不过它此时并不需要对人的行为发号施令。


    这意味着，普遍化并非不可能。形式上的普遍化可以通过逻辑、数学等形式严密地建构出来，而实质的普遍化则以一些核心价值与人性、人的普遍意志对应。比如自由就是一个可以普遍化的价值。因为这个价值本身是人的存在的一个本体论维度，是对人的存在的一种确证。如果取消了自由，也就等于否定了人，从根基上也取消了一切后天的人为人而存在的规范。


    但作为自由的一种表述而构成一种话语体系的“自由主义”与普遍化之间却不存在逻辑上的对应，要


    ![](img/7e667f542e5175c06fc3833e30d0f27f_207_0.png)'
