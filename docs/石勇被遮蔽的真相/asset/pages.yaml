  md: '令植入人的无意识结构中，将人驯化成一只由它用香蕉引诱并控制的猴子。


    不管怎样，资本主义现代化的历史已经通过它所创造的巨大物质财富而让普通人也分享到了一些他们付出巨大的代价并且通过长期不懈的斗争才得到的甜头。几百年的时间已经够久远，它早期的野蛮和罪恶在那些不够敏感的心灵中已经激不起任何震荡。但是，当罪恶以并不令人感到深深的刺激并且似乎可以在它所产生的那个体制内解决的时候，已经用社会所强加的那套思维模式思考而无法想象出另一种生活可能性的人仍然没有忘记历史的资格，因为正是决定自己的生活和命运的那套已泛化成社会政治机器的资本法则决定了历史上的罪恶，以一些不同的形式将它带进现在，并且还要融入未来。而且，资本主义的野蛮本性并不因它掠夺对象的变化、扩大或转移而真的向人们叩响了天堂的大门，它的掠夺对象只不过是从本国的底层民众更多地转向了那些仍然有待发展，甚至极为贫方的国家和地区。资本主义全球化的摧枯拉朽背后不仅可以看到资本逻辑解构一切的魔力，更可以看到强大的政治和军事机器所决定的强者说了算的丛林法则的无比灵活的发挥。因此，罗伯特·库尔茨对资本主义几百年的发迹史和罪恶史的全面考察与批判即使不能向人们提供一条摆脱罪恶的途径，但也是以警示那些“沉溺于玩世不恭的现实主义的“市场人”不要在思维的“黑白不分”中导效心灵的“黑白不分”。人类的集体性记忆的沉寂只能让人类在某个野蛮体系的自律扩张中无奈地迎来生存基础的崩溃。'
