  md: '在一个整个社会秩序，以及其中的意识形态建立在权力和统治基础上的社会里，他首先置身于整个家庭从社会承袭而来的权力关系中。由于他无法自立，因而需要父母的照顾，这就逻辑地产生了对父母，特别是父亲意愿的服从。而在一个以服从为特征的环境里，服从成了判别美德的标准，它考虑的是施服者而不是服从者的意愿，或者说，是以施服者的意志为转移的。


    这样，儿童在服从便会受到奖励，而不服从则会受到惩罚的奖惩机制中便经过了长期的“训练”。一种重复的实践一操作原则久而久之便内化入了他的心里，成为他特定的思维定势和情感反应方式。而这个过程同时也是一个对自己的内心需要进行抛杀的过程，儿童离自己的应然的存在状态越来越远。家庭和社会都不需要不建立在“听话”基础上的个性，儿童就像是一个泥人，按照他们期待的角色进行塑造。一句话，儿童的存在本身已经具有了社会的属性，他已经具有用来控制他的东西的属性了。


    其次，虽然父母对孩子的爱、关心和照顾是实实在在的，而且也是真心的，但由于这种爱仍然是采用了社会的形式和遵从于父母而不是孩子的意愿，这就导致儿童的成长仍然是受到干预和被规定的成长，从儿童的精神健康的角度上讲，这种“爱”可以看成是在以爱的名义进行的一种“惩罚”。阿尔诺·格鲁恩说道：“孩子一生下来就面临各种禁令的骚扰。那些在自己的童年时代就饱受禁令之苦的成年人在把这些禁令传下去的时候感到满足。我们是以为孩子着想的名义来惩罚孩子的，当然我们自己对这一点不予承认。相反，我们觉得自己是关心孩子的好父母。”¹²'
