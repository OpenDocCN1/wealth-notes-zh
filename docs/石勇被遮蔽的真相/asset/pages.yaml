  md: '钠中，将获得新的意义。


    在这里，文化批判与文化保守终于相遇。正是对同一事物的不同内容和属性的扬弃与保守，使它们构成了相互促进，而不是相互否定的关系。如果说文化批判更着重对思维方式的抨击，那么文化保守更着重对价值的捍卫。在具体对象儒家文化身上，它们乃是对它的不同指涉所作出的反应。儒家文化作为一种思想学说，正如其他思想学说一样没有整体性，指涉和普适于任何一个人类活动的领域。因而，即使它一开始便具有严密的逻辑自治，建立于普遍人性且能在合理性的基础上以其指令渗入社会中建构出一个秩序，它也无法仅仅依靠其话语体系而克服不断的挑战所带来的理论困境。另一方面，任何一种思想学说在其萌发和阐述之初都不可避免地与其所处的时空环境发生联系。我们甚至可以说，它更多的是对当时的现实刺激所生发的一种“反应”。虽然作为一种理论，现实的材料一经摄取便已在它的语言游戏中被扬弃，最终因其抽象性和不断地放大谓符的指令而使其具有了超越时空的特性，但它仍然必须在当时的现实中获取合法性，即回答现实所提出的问题。


    在这种意义上，一旦时空环境在流动的历史中不断地变异，那么这种思想学说所剩下的并且有用的也只是它与普遍人性纠缠在一起，并形诸于抽象表述的理论文本和内在精神。这两个先在的理论困境不断地勾画出儒家学说的“发展”轨迹。在历史上，绝大多数有影响的思想学说总是在不断地阐述、修改、扬弃和添加其话语指令，这种“编码”的活动构成了思想学说在历史变迁中谋取适用的价值依据的严厉前提。


