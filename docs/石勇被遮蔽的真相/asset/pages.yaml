- pgno: 40
  md: '罗素之成为“公共知识分子”，不在于他们的知识和他们的表达，而在于他们的表达已经通过了“公共领域”的论证，即已经与“公共意志”具有了同一性，并获得了普遍人性的呼应。如果可以忽略“公共授权”的困境，那么它也必须置换成一个“知识分子”在“公共领域”的发言符合公共意志或普遍人性的问题。而这样的“公共领域”，并不意味着它就排斥了无法进入这个领域的人，在特定语境下，根据公共权力的侵害程度它倒恰恰是与广大弱势者相呼应的。因此，克服这种逻辑断裂而使“公共知识分子”的存在成为可能的是：一个“知识分子”必须与权势决裂，并在对抗公共权力中成为公共意志的传声器与广大弱势者的“代言人”。而即使是这样，他也不是真理的化身。他的“道德形象”不是与知识的参与同步产生，而是知识参与后留下的痕迹。


