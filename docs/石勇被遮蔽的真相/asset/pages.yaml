- pgno: 36
  md: '人格越过事实领域进入价值领域，拥有了一种道德的形象和其存在的价值依据。


    而“知识分子”—“公共”，更切入其“价值本体”。这样的“公共”必然是“公共领域”，即夹在公民的“私人领域”和国家之间相对独立，同时又以其舆论对公民个体和国家产生影响，甚至控制的一种公共空间、一种公共生活结构。按哈贝马斯的说法，这样的一个公共领域在人们“对普遍利益问题达成共识”时，可以“对国家活动进行民主的控制”。既然如此，这个“公共领域”针对的必然是公共权力。或者说，它的存在本身就是对公共权力的一种制衡。这样，一个人在公共领域的发言，只要针对的是公共权力和公共生活中的事物，便具有了“公共性”，已经与大众、整个社会，甚至与整个国家的政治经济体制和政策发生联系。这种知识生产由此成了拥有一定的知识、擅长“说话”的“公共知识分子”的“专业”。“知识”终于转变成权力。“公共知识分子”于是便代表了大众，他们的声音似乎已经成为大众意志的一种表达。而他们也因其批判性，无形中头上有了道德光环，知识通过表达获得了价值属性，成为一个社会的“良心”。


    然而，就在大众乐于将自己的意见交给“公共知识分子”，而“公共知识分子”也乐于收获话语权力所带来的利益和道德形象时，有一个问题被他们忽略了。那就是“公共知识分子”如何成为可能？换言之，作为“公共知识分子”的个体，与“公共领域”中的“知识分子”身份之间，实际上存在着一个逻辑断裂，而这断裂，仅仅依靠普适性的知识、理念消弭个体与共同体、类的鸿沟是远远不够的：一个人不能在未获某


