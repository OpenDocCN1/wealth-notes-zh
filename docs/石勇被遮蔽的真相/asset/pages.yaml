- pgno: 59
  md: '# 被遮蔽的真相


    已然状态抽象净尽而力图代之以一幅应然状态的图景的“道德理想国”。我们无法准确知道作为一个思想家而不是革命家的卢梭是不是罗伯斯庇尔所崇拜并力图将其政治理论加以全面推广的“教父”，这方面已经有人对朱学勤提出了质疑。但是，朱学勤将其恶果追溯到卢梭，却有其学理依据。正如海涅所说的，每个哲人都能爆发出雷霆万钧的力量，一个其思想能切入政治和文化建构的思想家同时也会在他的思想的未来中切入一个社会的现实，最终使思想沉淀入人们的心灵和制度的建构之中。革命不是平白无故地发生，它的发生一定有它的理由和支持依据。当一个社会的腐朽已经达到革命的临界点而仍然无法自我更新时，革命就拥有了合法性和合理性。朱学勤在此并不是泛泛地反对革命，他害怕的是政治革命演变为社会革命和文化革命。而卢梭的思想恰恰具有了这样的逻辑。这种逻辑在20世纪中国“画上最新最美的图画”的政治豪情中得到了呼应。


    在朱学勤看来，卢梭的哲学实际上是一种“政治神学论”。“卢梭的宗教改造工程中大的一个改造动作，是接过原罪、救赎概念，改换承罪载体。他创造了一个新的‘承罪者’——社会，而不是个人。”⁶所以，救赎意味着对社会的重新的改头换面：“卢梭之手，捏着文明生命的痛处。他不仅否定了伦理、政治、宗教、哲学、文学等一切文化积淀得以铸成的模式，而且如卡西勒所见，甘冒天下之大不，让世界重新沉沦至文明前的原始状态，沉回它的‘混沌’，沉回它的‘自然’，经过道德理想的洗礼后，再冒出水面，露出新的轮廓。对于这样的理论，仅有一场政治革命，显然是不解渴




    ![](img/7e667f542e5175c06fc3833e30d0f27f_59_0.png)'
