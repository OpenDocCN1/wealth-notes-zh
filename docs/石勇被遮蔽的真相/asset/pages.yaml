    Blake）的诗句将这种“工厂噩梦”形象地昭白于光天化日之下：“上帝的容颜/是否曾在阴云密布的厅门中显现？/你耶路撒冷/是否只在撒旦黑暗的磨坊中建造出来？”(7)为了追求利润最大化，不仅孩子，残残疾人被送入了这个人问地狱并进行永无尽头的劳作。马克思和恩格斯当初所痛斥的那些罪恶和野蛮使这个“魔鬼的磨坊”所具有的魔鬼特征成为后世有良知的人一个痛苦的回忆，但它所具有的噩梦性质仍然伴随资本主义生产机器的轰鸣进入了我们的时代。


