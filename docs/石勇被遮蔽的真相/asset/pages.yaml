- pgno: 114
  md: '西方文化二元对立的视角，避开“全盘西化”和“独尊儒术”这两个极端，在阐述传统文化经典的同时推动其“创造性转化”，使传统文化在一次次的劫难后浴火重生。


    从表象上看，一个具备儒家文化情怀的人，不可能在民主制度下感到不适。这有两点原因：一是他的文化情怀和人格素养与民主的运作程序并不矛盾；二是民主制度所要求的对多元化的宽容、尊重和平等待人不存在与他所置身的这个文化系统的分裂。也就是说，传统与现代、中西方文化的优秀成分，可以集于一身。这点昭示出，固守传统的优秀成分与吸收西方先进文化更多的不是在同一领域相遇，我们所吸收的，是我们本来没有，或者即使有也处于朦胧和混沌状态的东西。这些吸收的东西或许会遮蔽一些传统文化的形式，但却不可能解构掉它的内核。


    也正因如此，传统文化对于生命意志、生活方式、价值偏好等方面的意义作为一种深层次的基础，没有必要让其内容更多地漂浮于政治、经济等表层之上。这并不是说它不能关注政治、经济等领域，或者它在这些领域应该无所作为，而是说，它应该是价值的审视和理念的观照，而不是程序设定或内容规范性质的。德沃金曾阐述过法律的道德基础。但这也并不意味着，道德观点可以代替法律程序，它仅仅是法理的依据。同理，儒家文化的政治学功能也不能得出“王道政治”的结论。一个民主制度同样可以用儒家文化构筑它的“德性之维”。


    从文化的内涵上讲，大致可以分为两层：一是内层，它主要是一套作用于人的生命意志和价值本体的'
