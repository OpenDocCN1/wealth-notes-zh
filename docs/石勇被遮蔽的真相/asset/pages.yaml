- pgno: 234
  md: '服务的公共资源就不再属于没有自由，没有民主权利的人们。人们已经成为自己所构成的这个“社会”的客体。这种“异化”状态造成了他们与自己所创造的资源分离，由此剥夺了他们在公平以及权利意识基础上平等地分配公共资源的能力和权利。因此，没有自由，就不可能有真正的民主，基本自由的优先性无论是从人性的尊严，还是从一个政治共同体离开了民主便不可能真正合法的角度讲，都具有必须保证的优先意义。离开了基本自由优先的逻辑，那么公平的平等理论就无法论证。反过来讲，如果瓦解了平等的逻辑，那么从普遍主义的角度看，自由的形式与实质的冲突就已经违反了公平，违背了订立契约时“平等而自由”的人的先天权利，它的理论就是极为贫困和虚假的。也正是在这种意义上，德沃金以一种“平等主义自由主义”的语言说道：经济平等和传统的个人权利都起源于独立意义上的平等这一根本概念，平等是自由主义的原动力，捍卫自由主义也就是捍卫平等。






