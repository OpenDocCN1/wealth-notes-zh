  md: '伤害到了公平的不平等后，按照普遍主义规范的平等的自由权利，仍然要继续对资源进行有利于这种平等的分配。


    以社会契约论为方法的思想家总会虚构一个他语境中的“自然状态”，作为逻辑基点来对理论进行论证。如果说罗尔斯证明在“原初状态”下人们会选择他的正义原则，那么，德沃金也认为：在他的那个“荒岛”上，选择资源平等分配的方式是最为可取的。这样的一个“荒岛”德沃金“杜撰”如下：假设一条遇难的船只中的幸存者被海水冲到了一个荒岛上。岛上资源丰富，没有人烟，任何救援只能发生在多年之后。这些移民接受了一条原则：对于这里的任何资源，谁都不拥有优先权（其实我们也可以补充进独占权和多占权），而是只能在他们中间进行平等的分配。他们也接受（至少暂时如此）对资源平等分配的检验标准，即“嫉妒检验”（envy
    test）：一旦分配完成，如果有居民宁愿选择别人分得的那份，则资源分配就是不平等的。


    那么，岛上的“丰富资源”如何平等地分配？这些资源可能有奶牛、耕地、鸡蛋、森林、葡萄酒，等等。每一份资源本身都有好有坏，有优有劣，更重要的是它们既无法量化，更无法根据人头数平等地分成
    n 等份。在这个时候，分配是不可能让人们满意的，即总是由于缺少平等分配的可操作的手段而导致分配的不平等。很显然，这种状态有点像原始状态，没有一个媒介（比如货币）来衡量各种资源的价值，最终通过这个媒介，使分配趋于平等。由此，德沃金引入了经济市场这个分析手段，或者说，“荒岛”理论就建立在契约论和经济市场的基础上，它们共同作为荒




