  md: '烈强欺凌和汉奸肆虐的痛苦记忆，自由主义者这种民众中的“二鬼子”形象只能让他们亲手为自由主义的发展挖好陷阱。


    # ## 三、新左派


    新左派与自由主义原本是在新启蒙运动中并肩战斗的兄弟，他们的分道扬镳只能归结为中国社会转型刺激的结果。1992 年，邓小平的“南巡讲话”使市场经济获得了前所未有的合法性。改革的负效应日益凸显，“经济自由”和“政治专制”的结合终于形成了一种“形左（意识形态）实右（政策）”的格局。这种格局将一切原本似乎都可以作出准确判断的东西弄得畸形残缺、面目模糊而难以辨认。在这种资本主义与专制主义混淆不清、自由既可能是权力资本的自由而平等也被视为有回归“平均主义”时代倾向的混乱局面中，自由主义与新左派的对立格局应运而生。


    由于它们的重合面较多，这两个对手在 1998 年开始的那场公开较量产生了深刻的影响。它们用不同的理论解释而得出不同结论的共同问题，事实上正是中国改革的一些困境的反映。双方当时曾互相指责对方有官方背景，并且似乎自由主义者还有为资本鸣锣开道的嫌疑。惯于扩大自身的能指的逻辑甚至使它们在一些本来有共同语言的问题上进行无谓之争。


    表面上看来中国大陆新左派对平等、公正的强调符合传统左右分野所界定的标准，起码西方左派具有这些特征。但仔细剖析，实际上并不是谁都可以被称为新左派的。许多自由主义者喜欢将自己的对手称为新左派，但这些对手可能是权威主义者、国家主义






    ![](img/7e667f542e5175c06fc3833e30d0f27f_129_0.png)'
  merge: -1
  img_proc: true
- pgno: 130
  md: '者、民族主义者，而这些人都都是“右派”。现在自称“丐帮帮主”、只能靠“作秀”来诱出“主流经济学家”论战的杨帆从来不承认自己是新左派，并且说新左派是自由主义者给对手扣的一个帽子。原米在“新左派阵营”名单上赫然醒目的一些人也很少公开承认自己是新左派，甘阳甚至称自己是“自由左派”，而“自由左派”和“新左派”在西方具有明显的分野。这点或许并不太难理解：直到现在，“主要是反左”都代表“政治正确”，虽然现在要反的“左”已经“右”到诺齐克的那个“获得正义”，更不用说“自由左派”罗尔斯的“分配正义”了。


    从某种意义上讲，一个热爱自由的人并不一定是自由主义者，而某些自由主义者也不见得就尊重别人的自由。因此，新左派与自由主义所爆发的平等与自由之争其实主要指的是“谁的自由？”的问题。这种论争其实多不是在“自由或专制”的设定下发生，而是被置入一个“是否普适性的自由”的语境。对平等是自由的一种手段以及“积极自由”、“实质而且普适性的自由”的强调使新左派的理论似乎成了一种弱者理论，他们的立场无形中便成了一种与精英立场对立的大众立场。


    但弱者立场所强调的平等和公正必须获得可行性理论的支撑方能摆脱被人指责的道德批判的软弱无力而“想像”一个理论所指定的政治社会环境。与自由主义相比，这是新左派必须面对的劣势。自由主义主要是一种建构性的理论，而且其在西方国家有成功的样本，其经验和制度架构似乎可以直接搬用。而新左派的理论资源，诸如西方马克思主义、后现代主




    ![](img/7e667f542e5175c06fc3833e30d0f27f_130_0.png)'
  merge: -1
