- pgno: 180
  md: '了“民主时代”的来临，并在对群众的恐惧中为民主政治提供了理性的分析。然而，世界是复杂的。事物本身拥有无数甚至相互冲突的属性。民主政治的悖论在于：它固然可以为自由的普适性提供制度上的保证，却又有
    可能在涉及利益，即对社会公共资源的分配中侵犯到少数人的自由权利。在极端的情况下，这种为获取普适性的自由而作出的行为更有可能在一种意识形态的狂热鼓动中将人的非理性行为呼唤出来而冲破法律与理性的阀门，最终形成“多数人的暴政”。


    如果说少数人的暴政更多地求助于国家暴力机器，依靠他们所垄断的稀缺社会资源对大多数人进行奴役、压迫和宰制，那么“多数人的暴政”则更多求助于意识形态的狂热鼓吹。无论是“革命”还是对少数“异端”、“反动派”的“清洗”，其背后都有一套被奉为绝对真理的意识形态体系，并且这套意识形态体系以简单的口号和观念的形式出现。它与人长期被压抑的破坏性和因被压迫而萌发的耻辱感遥相呼应。一旦意识形态赋予人以发泄破坏性和耻辱感的合法性保证，它便将不可遏止地倾泻出来。这种非理性的狂热一呼百应，人多势众的群体便形成了一个强大的势能。融入群体之中的个人的软弱无力通过群体这个庞然大物的能量的灌注而勇气倍增，强大无比。通过一种“法不责众”的心理支撑，在意识形态的合法性保证中群体由此变成了一种通过暴力而确证的“正义统一体”。这个时候，谁能控制群体，谁就成了上帝。他登高一呼，强大的洪流便可以将一切障得之物荡涤而去。




