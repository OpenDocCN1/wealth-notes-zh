  md: '# 被遮蔽的真相


    在翻译的过程中那个语言所意指的体验和文化精神不一定能被准确地领会到。这就出现了思想的“失真”,许多往往是很重要的东西，被悲剧性地忽略了。而语言的可编码性更使它成为统治者实施统治的工具。统治者可以天衣无缝地将自己的统治指令嵌入语言之中，使使用这一语言系统的人只能体认到这些语言系统所意指的世界，其事实判断和价值判断无形中便受到统治者的支配。这种语言不是用来认识世界，倒恰恰是用来掩盖真相，因为它对应的是一个人造的由庞大的意识形态所编码的世界。自然，不符合这一语言系统的语法规则和意指的思想和体验都无法被表达出来，因为它丧失了语言的载体。说到逻辑，弗洛姆举了一个例子：亚里士多德的建立在同一律、矛盾律、排中律基础上的逻辑和辩证逻辑的冲突。按照亚里士多德的逻辑，一个人同时是他又同时不是他简直不可想像，这种通过摒除矛盾进行逻辑思维基点取消了人的复杂性，使一些体验无法进入意识。一个人如果长期受此逻辑训练，必然极大地忽略了人的悖谬、冲突的精神的那一面，一开始就将这些不符合矛盾律的东西过滤得干干净净。如果说语言和逻辑是人的体验、认知的一种结构、规则，不符合这些结构和规则的东西不可能被体验和认知到，那么社会禁忌表征的则是一种必须被过滤的内容。社会禁忌的内容比较复杂，但与压抑相对应，既是对威胁到文明存在的东西的禁止，同时也是对威胁到特定的统治秩序的东西的禁止，这些东西无论如何不准进入意识。很显然，过滤掉这些内容只能采取奖励—惩罚的手段：奖励忘掉这些内容的思想和行为，否则便对此作出惩


