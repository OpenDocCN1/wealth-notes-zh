  md: '# 哈耶克之套：“自由市场”的陷阱


    > “先知的命运是这样展开的：先被讥讽，后被冷落，人们直到山穷水尽，才再次想起他，而这恰恰是弗里德里希·冯·哈耶克一生的总结。”


    这是一篇文章中的一段话，作者是薛兆丰、尹忠东。在他们眼里，很显然弗里德里希·冯·哈耶克，这位出生在奥地利的经济学家、法学家、自由主义思想家、1974年诺贝尔经济学奖的得主已经可以与苏格拉底、耶稣、弗洛伊德等人比肩而立。这些先知都看穿了人性和世界的秘密，却在“受难”的“仪式”中完成了思想和人格的再造。最终，是他们的思想构筑了我们所置身的这个世界，并一次次地带领我们走出充满毁灭和灾难的“埃及”。


    的确，哈耶克的大名在当代如雷贯耳。在西方，凯恩斯主义早已遭到质疑，越来越多的国家又转而踏入那早在17世纪便已开始、曾带来毁灭性的灾难而在20世纪曾一度中止的遵循丛林法则的“自由资本主义”的长征。在效率与公平的二难选择中，他们选择了前者。经济发展似乎甩掉包袱了，因为“后腿”——一种对资本家的利润的较大幅度的社会再分配和“国家干预”——已大大减轻。以牺牲社会公平为代价，资本主义的生产机器以更强劲的动力疯狂运转。人类在弱肉强食的“现实”中又开始向那不可预知的未来迈进。


    在中国，大约从20世纪90年代开始，哈耶克开始




    ![](img/7e667f542e5175c06fc3833e30d0f27f_20_0.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: '拥有了无数忠实的信徒。他的理论被认为是“走向市场经济的金科玉律”。很少有西方思想家能拥有这种殊荣。如果你和一个并不那么“温和”的“自由主义者”交谈，那么你会发现他不是洛克、密尔、伯林、罗尔斯、德沃金的信徒，他仅是哈耶克的拥戴者。哈耶克的书藉，特别是《通往奴役之路》、《致命的自负》、《自由秩序原理》、《个人主义和经济秩序》像宗教书籍一样被许多信徒供奉着。许多“社会精英”无不以满口哈耶克为荣。新一轮的“两个凡是”又粉墨登场，思维方式的单维度使人们从一个极端走到另一个极端。有个“自由主义者”的话典型地表现出了哈氏在当下中国被神化到的程度：“攻击哈耶克，便是攻击自由！”


    确实，哈耶克可以被称为是自由主义的一代宗师。他复苏了古典自由主义。个人主义理论构成了他的“哈耶克似的自由主义”的严厉前提。从“经济决定论”出发他发现了“通往奴役之路”的秘密。他的经济理论与自由主义的政治哲学紧紧联系在一起。但他并不是自由的化身，自由也不是自由主义者的专利。在我的印象中，他首先是一个“批判理性主义者”。他和卡尔·波普尔所倡导的“批判理性主义”步休谟等人后尘，敲响了独断论和历史决定论的最后丧钟。一种与极权主义紧密相连的思维方式似乎在一夜之间消失了。


    然而这不是主要的哈耶克，毋宁说这项工作大部分是由波普尔完成的。哈耶克之为哈耶克，就在于他对具有集体主义特征的东西——他不分青红皂白地一股脑称之为“极权主义”——的最激烈的批判。在他的无论哪本书里，他都忘不了对集体主义进行攻


    ![](img/7e667f542e5175c06fc3833e30d0f27f_21_0.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '击。在他看来，集体主义必然导致一种政府干预。这将产生两个恶果：一是经济上的计划性和政府干预使经济活动偏离市场经济的基本路径，出现一个虚假的市场并耗尽竞争力，导致经济崩溃；二是出现政治的全面社会化，导致对人的奴役。因此集体主义性质的理论只能“通往奴役之路”。只有那看起来是原子，却又构成社会的形态结构的基础的“个人”，一种能对抗具有权力压迫特征的“集体主义”的“个人主义”，才能切入人类的现实并在一种历史性的合规律性中为人类开辟出一条自由的途径。


    然而，哈耶克似乎不想作出价值判断。当然也许他认为他作出了价值判断：工具性的个人主义的自由主义理论最终作为一种手段在于它能保证人类的自由。但问题是，正如罗尔斯所发现的，每个人所握有的社会稀缺价值资源是不同的，而竞争主要就是拥有这些价值资源的权利或能力的竞争。这样如何能保证公平呢？这将导致这样的结果，即从总体上讲，一定时期富人财富的增加，有一部分是从穷人身上通过合法或不合法的方式“转移”来的，而某些人的暴富，无论怎样都意味着这样的事实：钱从一些人的口袋流进了另一些人的口袋。而在批判集体主义的经济和政治架构时，哈耶克甚至不考虑它的性质或它的“实践”是否与它的经典文本表达存在巨大的差异。作为一种手段和功能的“干预主义”被他当成了集体主义本身，而追求一种建立于平等和正义基础上的，消除了异化和官僚统治、技术控制的正义社会的特征却被他忽略了。


    有人说哈耶克树敌太多，厉尽坎坷，好似一幅耶'
