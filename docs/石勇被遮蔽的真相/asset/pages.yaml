  md: '# 被遮蔽的真相


    上讲，是文化本身为人的奴役作出了说明，也为文化批判提供了一个先验的价值依据。从人的存在属性主要等同于文化属性中可以看出：我们要确定一个人，无论如何离不开各种文化的规定性；而我们想要改变一个人，必须改变他的文化属性。文化批判的可能性是：既然某种奴役人的文化意识形态可以以其指令控制人，那么同样，批判者可以在洞悉了这种文化统治机制的运作方式和内在逻辑后向人们昭示那已被压抑的人性的完整经验，以构筑一个抑制文化意识形态奴役的心理结构，冲破那一套阻止人们深入自己存在内核而只看见自己的文化属性的罗网，甚至在“文化创造”上有所建树，以一套可以让人返回自己的存在的本真状态的文化指令来重新对人进行“反洗脑”，将盘踞在人大脑中的奴役的文化指令清除出去。


    文化批判承袭20世纪80年代的“新启蒙”，至今 仍喧阗不已。然而就在今天，“文化保守主义”也日益获得影响力，不仅在学院，在那个“思想学术界”，而且更多是社会性、民间性的。早在五四一代要“打倒孔家店”时，“新儒家”们就在苦苦支撑，力图证明这个房子并不是一团漆黑，还有一些好东西，而且这些东西与现代文明结合，仍然具有它的不可忽略的意义。摧毁一个民族的传统文化无论以怎样的理由，都是自捣根底，从民族文化传统的接续来说，保守并发扬光大这些东西甚至是避免“建构”的政治文化断裂和“文化殖民”的严厉前提。从1994年开始，陈明主编的《原道》至今已整整十年，虽举步维艰，但仍然在不断地向传统文化的“复兴”掘进。这本辑刊虽然在民间社会尚未产生什么大的影响，但在思想界，它已备受瞩目。'
