- pgno: 208
  md: '使其普遍化,必须先进行论证,并看能否架设它们之间的逻辑通道。道理很简单,不管它具有何种逻辑体系,它都不是价值本身而只具有工具的价值。它只是一种思想体系、理论、主义,是一种看待、规范世界的角度、方法,不是以整体性的特征而是以某个角度切入世界。它与其他主义在“身份”上是平等的,没有谁有资格可以凌驾于别人之上而独自获得规范世界的权力。至于谁好谁坏,谁更好一些谁更坏一些,则需要通过比较,通过现实的检验才能得到说明。


    同理,民主一样也是一个可以普遍化的价值。因其社会维度与政治息息相关,它比自由似乎更应受现实条件的制约而不能绝对。但它的普遍化仍是一个标准。一个社会因各种条件所限不能实行民主并不足以证明民主不能实行,而只是说明:民主有不同涵义或层面,可普遍化和应实行的不一定就是某种已经确定的模式。模式不能普遍化,但民主本身的普遍化却是没有疑问的。某种民主模式或许可以根据实际情况被拒绝,但民主本身却没有任何理由被拒绝。


    自由、民主等都属于人的基本人权。它们是基本的价值。但关系性价值,也即不属于基本人权范畴的价值能否普遍化?像公正、平等这样的价值能否普遍化?很显然,它们作为一种形式,只要在普遍化的过程中能保持逻辑的自洽和不同领域中的同构性,仍是可能的。比如在一个社会内的公正同样可以推演于在不同社会之间的公正,只不过这种公正的表现形式必须随着关系的新的含义而改变。但真正的问题在于:在普遍化的过程中,形式与实质、价值与价值的体现者之间的关系如何界定?哪一种普遍化既在逻辑'
  merge: -1
  img_proc: true
- pgno: 209
  md: '上站得住脚，而又不带来比其不普遍化更多的问题？对此可以以“主权”、“人权”的关系来分析。


    “人权”、“主权”之争可谓是一个焦点。西方大国以“人权高于主权”，以“民主”的名义对别国指指点点，挥戈相向，而这些国家则以“主权高于人权”自卫。如果不考虑语境，很显然我们会脱口而出：“人权高于主权”——试想，在这个世界上，有什么比人权更具价值或价值的优先性？但实际情况却是人权已经被植入了主权的结构中。人权从根本上讲超越于主权国家的樊篱，但国家与国家之间的界限却使抽象的人权必须依附于具体的主权。换言之，一个主权国家的政府是否保障本国人民的人权，或者另一主权国家是否尊重别国人民的人权，从逻辑上都无法得到说明。


    而需要指出的一点是：某个主权国家不保障本国人民的人权，并不是主权对人权的侵犯，而是政府对人权的侵犯；而一个主权国家对别国主权加以侵犯，却没有什能够保证它会尊重别国人民的人权。有主权不一定有人权，但没有主权的人权却很难得到保障，或者说，没有什么力量保证它就一定能够得到保障。因此，可以普遍化的人权必须要求它的维护者超越于主权之上，即不是其中的主权一方而是一个客观公正的裁决者。因为主权的功能决定了没有一个主权国家有资格凌驾于另一主权国家之上。


    问题的核心就在这里：价值可以普遍化，但价值的体现者的身份如何确定？其资格如何论证？价值的裁决是否能使某个价值的体现者的裁决具有合法性？我们先来看罗尔斯的“普遍化”努力在理论上是否成功。'
