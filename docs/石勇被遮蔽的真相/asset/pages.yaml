  md: '实际上是一种异化的信仰。哲学认识论告诉我们:人类认识的一个最明显的思维误区是:往往将他的认识当成对象的客观存在本身。似乎世界就是他认为的那个样子。而实际上,任何一个人、一种主义、一种宗教仅仅是从某个层面、某个角度上去解释、描述、把握、评价、规范某个对象,而这些层面和角度是无穷的。从作为思考的主体和接受的客体的我们来说,每个人之间的经验和情感等东西也千差万别,因此,没有谁敢说他所信奉的东西就是真理,或是可以用来规范别的东西的至善。我们有的只是,谁在哪种角度和层面上更接近于对象的真实和善,谁在哪种角度和层面上错得更多和恶。但不管怎样,对此的认识和接受、体验和评价是无穷尽的。任何一种东西为某个人所信仰毫不奇怪,但若赋予这种信仰以规范万物的权力,则必定会走向信仰的异化。


    人需要信仰植根于人的存在困境。自然界原本是人类的家圆,但自我意识的觉醒使他被驱逐出去。从此他开始了流浪,开始了通向天堂的永远不可企及的长征。因此,他被夹在神性和兽性之间,从兽性向神性的运动成了一个不断扬弃既存状态的过程。而也因为他的自我意识与对象意识的分裂,他与自然界之间必然是一种异质同构的关系。这是一种荒谬的存在状态。他在偶然的时间,偶然的地点,偶然地被抛弃到了这个冷漠无垠的世界上,并将在死亡的确定性中以不确定的偶然的方式化为乌有。由于他与自然、他人和自身的分裂,从自然之家走出时他一开始便丧失了附着感与确定性,陷入与外部世界的矛盾、冲突和对立之中,并且不幸地通过意识的机制,这些


