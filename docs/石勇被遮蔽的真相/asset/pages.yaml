  md: '有独立价值、不能以物质利益衡量的文化生态的破坏，更重要的在于，它给欲摆脱困境的农民强加了一种精神的焦虑，一种对上地的厌恶，一种对有利于自己生活前景的制度设计的冷漠。它以隐秘的方式瓦解了人们的理性，使幻想中的“城镇化”生活与现实苦难的农村生活日益分裂。文化殖民使一种只满足感官欲望的一次性文化消费为城乡分享，但与这种文化殖民有着隐秘的联系的制度与意识的歧视却使农民应该享有的与这种文化消费同构的生活遥遥无期。因此，“三农问题”无法忽视农村被城市文化殖民的问题。在温铁军、李昌平、于建嵘、党国英等研究“三农问题”的学者作出了诸多可敬的努力后，文化学者应该在农村文化的这个领域进行有力的呼应。


