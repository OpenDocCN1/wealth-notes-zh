  md: '抽象实体的联系。因而，在许多人看来，80 年代人似乎更多地表现出一种自私的心理和对责任感的冷漠无情。这当然有些武断，不过一种物质主义和商业逻辑浇灌下的成长异质于精神信仰力量培育的人格结构，却是确定无疑的。80
    年代人是独生子女的第一代，他们从小就是“小皇帝”、“小公主”，整个家庭都围绕他们而旋转。他们是希望，是未来，就像是精心培育的温室里的鲜花，没有经历过生活的狂风暴雨。在
    80 年代先天的文化上壤中，乐观向上的父辈的存在状态使他们一开始便通过家庭的中介而远离了苦难的幽灵。在 90 年代经济发展导致的生活改善中，父母的溺爱使他们成为喝可乐、酸奶长大的一代。而用饮料喂养的一代也是心理脆弱、唯我主义特征明显的一代。在一个孩子的心灵里，父母就是世界，他从这个世界开始获得判断世界对于他的意义的最初心理印迹。因而，父母对他的溺爱就意味着这样的一个事实：在这个世界上，他是最重要的。随着他的逐渐成长，他的世界已经不仅仅局限于父母的世界。但如果他的成长的受挫不能使他修正与世界的关系，那么这种把自己看得最重要，而整个世界必须服从此意志的最初的无意识心理必然通过后天的社会实践建构起一种唯我主义的逻辑。这种逻辑具有两个极端：要么在受挫中培育自私和冷酷的心理，要么在受挫中走向精神崩溃。而大多数人则在物质化的成长中正常地转型，他将父母的溺爱移情到商业社会所提供的形形色色的娱乐和为应付踏上社会后的生存与发展的学习之中，从而与商业社会建立了一种可以说是原初性的同构关系。




    ![](img/7e667f542e5175c06fc3833e30d0f27f_138_0.png)'
