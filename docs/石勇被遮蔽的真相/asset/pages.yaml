  md: '# 被遮蔽的真相


    关系，也即我，以及无数人看到的世界并不是世界本身，我们仅仅是站在不同的角度、从不同的层面进行“观察”而已，从而没有谁能掌握真相，只能说是谁，并且不是他本身，而是他的看法，在哪种角度和层面上，更接近于事实的真相。这种哲学认识论的基础既破除了绝对论和彻底的相对论，同时也否决了有谁掌握真理。它为宽容、民主和言论自由提供了认识论的依据。拥有这种思维方式的人，久而久之便可以使它进入价值本体，并通过对文化语符的不断编码而形成一种文化自觉。从西方的自由民主制度背后可以看到这种哲学的身影。因此，当我们强调中国哲学的“合法性危机”时，不仅着眼于它在当下对于现实解释的无力，它对经典文本的解读的纯粹知识化、符号化方面的问题，更重要的在于一种思维方式、话语方式的转轨。同一种思维方式可以对不同的话语符号进行相同形式的“编码”，从而消解它们不同的价值信息而将它们纳入运行的同一轨迹，而在此基础上，文化是不可能实现价值上的应然性的证明的。因此，在文化复兴的背后实际上是哲学对“合法性危机”困境的不断应对。而一旦哲学能在思维方式、话语方式，以及背后的认识论基础上“编码”文化的指令，传统文化便可以在传统与现实的不断撞击中获得价值上的充分论证，并加快复兴的进程。


    （近年来，中国哲学的“合法性危机”成为学术界的一个话题。陈明老师在 2004 年 6 月 2 日的《读书时报》上发表了《中国哲学合法性危机：学科还是意义？》一文，阐述了他富于洞见的观点。本文受此启发，从文化入手表达了自己的看法。）




