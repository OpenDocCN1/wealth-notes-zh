- pgno: 155
  md: '好的选择的合理性，获得心理上的生存。


    一个“适应现实”的人与此具有相似的精神结构。从心理上和精神上进入已经异化的生活—工作共同体是以付出自我的被否定、用共同体里的一套指令来重新编码自身的存在方式的代价来实现的。在这样的一种异化中，原先的自我既无法获得共同体的认可，也无法捞取利益对应，而重新在人格结构中建构的那个虚假的自我与安全感，与能够获得社会认可的、可以确立一个人的“存在价值”的利益对应。它们不断地获得强化，久而久之这种经验上的确认便沉淀入无意识中，成为一个人的一种“先验”的“价值判断”。但是，由于这种在“逃避自由”基础上的自我的建构是虚假的，无论是群体认同的安全感还是利益保证的“尊严”都不堪一击。一且有外界的刺激出现，无论是让他们看到自己原先的影子还是对他们所趋之若鹜的东西，以及其存在方式的任何轻蔑，都会引发他们的恐惧。在这样的情况下，一个人保持心理上的生存的第一反应就是消除一切对于他的存在方式、所信奉的价值观念，以及所追求的东西的价值的怀疑。他们最受不了的就是怀疑，不管这种怀疑是以别人的发问，还是无形中的对比，或不经意的刺激的形式出现，只要怀疑出现，他们辛辛苦苦所建立起来的心理基础就会崩溃。


