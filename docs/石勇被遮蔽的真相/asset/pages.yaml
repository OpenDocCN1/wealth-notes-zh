  md: '# 序 点燃思想的烽火


    石勇是《天涯》的作者。与大多数《天涯》的作者稍有不同，我先是在网络上发现他并注意到他的文字的。


    说不清从什么时候开始，网络成了《天涯》也是我本人的一个重要的思想资源来源。也许是从开始创办“天涯之声”网站开始吧。大约是在2000年左右，我还是《天涯》杂志的兼职副主编的时候，就为《天涯》杂志建了一个网站，叫“天涯之声”，主要版块有最新论题、个人文集和BBS天涯纵横。当时我们有很多的狂想，诸如提出要成为“学术原创的基地，思想争鸣的发生地”，要在网络上点燃思想的烽火。当时，由于网络提供了一个新的自由空间，许多不便在公开媒体上讨论的问题，在网络上都讨论得热火朝天，我甚至乐观地预言：网络可以最大限度地容纳各种意见，获得充分的讨论、争辩，并最终达成某种共识，如此下去，网络将导致一个更为民主化的时代的到来。


    “天涯之声”、“天涯纵横”也确实大有反响，尤其是在“思想的境界”关闭之后，一度被香港的《明报》、《镜报》等誉为“中国学术思想龙头网站”。应该说，后来《天涯》上发表的一些关于现实问题的讨论，从网络上获取的资源还不少。可惜后来因种种原因，网站关闭了。但“天涯之声”、“天涯纵横”还是留下了一笔财富，由于“天涯之声”、“天涯纵横”的气氛，许多在此出没的知识分子和普通网友始终关注一些重大而严肃的话题。


