- pgno: 38
  md: '证，而且是从这种意见本身加以确证，因为任何意见，都不过是私人意志的结果。要使这种意见获得公共性，就必须进行确证，即检验这种意见的公共性。


    这种逻辑上的断裂，根本不可能用知识的普遍性或公共性加以消除。每一种知识都承载着社会、历史、人性等信息，超越于个体体验和诉求之上，从而具有公共性，甚至与普遍性联系在一起。但是，一个人在获得某种知识时，已渗进了个体的因素，他已经对这种知识进行了私人化的处理。而非常重要的是，他对这种知识的表达与这种知识本身并没有同一性，即根本不能从知识本身的性质推出他的表达与知识的这种性质的对应。他的知识表达的仅仅是他所看到或希望加以规范、控制、改变的世界，这个世界与真实的世界、其他人所看到的世界没有什么必然的对应关系。世界无论以什么样的方式在他的头脑中显现其“存在”，都是私人性的事情，只与他本人的智力结构、意愿、利益诉求等等有关。因此，知识本身的公共性根本不可能为他谋得任何公共性——他仅仅是知识的这种公共性的一个工具而已。一个“知识分子”在“公共领域”的表达，并不意味着是他参与进来，而表征的仅仅是他的知识的参与。在没有获得确证之前，他作为这种表达的载体之一永远只能置身其外，即根本不能为他本人的“公共性”提供任何说明。


    如果说第一个逻辑断裂可以“解构”“公共知识分子”话语霸权背后的“代表权利”，第二个逻辑断裂则可以将价值属性从“公共知识分子”的身上剥离。一个为虎作怅、拼命为强势集团的掠夺辩护的“公共知识分子”，不需要等到那一天才被人从“社会的良心”'
