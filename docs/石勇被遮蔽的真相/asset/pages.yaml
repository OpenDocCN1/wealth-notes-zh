  md: '人再也听不到自己的声音了。从此他依靠人造的庞大技术系统来面对世界。但外在的规范无论如何却不能切入他的生命本体。根据习惯，我们造出了许多语言，但这些语言真的能准确地表达我们的感受和体验吗？当我们的感受和体验找不到相应的词语加以表达的时候，会不会使它们所对应的那一面在我们面前消失？或者说，它同时是不是对发自我们内心而不是由外界所强加的需要的一种遮蔽？我们只有用语言来思维，我们的思想只有用可交流的语言进行表达才能为他人所理解，然而无论如何，我们的思想都掺杂有属于我们的个人体验，当这些具有个人体验的内容的思想传达给别人时，会不会歪曲它的原意呢？因为若我们采用语言来传达，我们的个人体验便将被排除在外而无法得到理解。我们借助仪器、工具来观察世界，久而久之，我们丧失了直接感知世界的能力。我们对工具的信任要远远大于我们对自己的信任。但是，如果这些仪器、工具出了错呢？“测不准原理”并不仅仅体现在微观世界，我们对世界的观察，实质上就已受到各种人际关系的干扰。在思考和判断时，我们习惯性地并不相信自己的直觉，而是相信各种看起来权威的意见。而从根本上，我们更是受到意识形态的操纵而成为它的应声虫。自然，我们所能看到的，也就是这个社会的统治秩序所允许我们看到的。这些虚假的、由人造出来的“客观存在”被我们当成了真实，而真实则无声无息地、神秘地消失了。


