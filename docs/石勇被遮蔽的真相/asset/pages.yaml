    其实，这种文化批判的困境，西方马克思者们一开始便有所洞悉。早在20世纪30年代初霍克海默就任法兰克福大学社会研究所所长时，就与阿多诺、马尔库塞、弗洛姆等人强调引入弗洛伊德的精神分析来补充马克思主义。这透露出一个信息：当“文明”的压抑灾难性地遮蔽了人的本真存在状态，并且使任何反抗冲动都不会被引入真正的基于人性基础上的否定性思维时，文化批判无疑是一种乌托邦的长征。非常明显，统治意识形态的指令已经渗入人的存在本体，灾难性地改变了人的本能结构而使大众对资本主义制度的认同成为一种本能反应，那么，所谓的“本能革命”、“绝对的否定”、“大拒绝”都仅仅是在不可能性中期待一种奇迹。这种“知其不可为而为之”的悲壮充分表现在马尔库塞晚年的著作《审美之维》中，它仿佛是对几十年前霍克海默和阿多诺的声音的回应：“我们所疑惑的并非遍布大地如同地狱一般的现实图景，而是没有冲破这种现实的合适机会。在今天，如果还存在着我们可以把传递讯息的责任交给他的人，那么，我们决不馈赠给那些‘大众’，也不馈赠给个人（他已无力），而是馈赠给一个想像中的证人——只要他不与我同归于尽。”


    而在中国，无论是胡适二十年不谈政治，只注重文艺的教育，还是鲁迅弃医从文，发誓要掀翻吃人的黑屋子，这两个20世纪中国的思想巨人和其他人所一手发动的“新文化运动”目的只有一个：重塑国民的灵魂，逼出几千年的专制毒素。它既是健全现代人格的




