- pgno: 148
  md: '哪种政治制度下，整个社会的基本权利、非基本权利的分配都是通过一个社会的基本结构进行的。这样，在社会公共领域所拥有的话语权力和政治权力等等“博弈能力”便直接决定了人们参与、影响、支配分配过程的机会。除非是在一个民主制度下，否则人们就没有权利合法地形成政治力量和利益代表以参与政治进程。


    被剥夺民主权利使社会底层成为整个政治系统的陌生人。被“集体缴械”的一个后果就是除非以肉体暴力的形式进行绝望的抗争，否则他们面对拥有巨大稀缺资源的社会强势集团的侵害，便永远地失去了反抗的能力。从这一点看，可以窥探到许多贵族自由主义者推崇自由而仇视民主，以及专制社会对民主无比恐惧的原因。民主制度能最大限度地保证自由，而且最能切入社会底层的生存困境。由将民众排斥在国家决策和制度设定进程之外的专制权力所主导的任何程序选择最终都会侵犯到民众的利益。从近年来国有企业的“改制”中我们看到，没有一个“公共选择程序”，所谓的“权利”是何等的不堪一击。本来完全有权决定企业是否改制或企业的改革路径的作为抽象的产权所有者的工人不仅被排除在企业改制的进程之外，而且随时被扫地出门。


    精神分析有一个这样的理论：施控者除非能符合受控者的心理期待，否则他很难使后者进入他所预设的心理情境而导致控制失灵。这与中国的改革何其相似。当权力、资本、知识精英结成一个利益共同体，主导改革路径并使这种改革渗透了它的利益诉求，通过一种近乎敲骨吸髓的掠夺已经使民众的生存资源'
  merge: -1
  img_proc: true
- pgno: 149
  md: '逼近枯竭时，它便再也不可能唤起民众继续接受掠夺的“良性预期”。民众的绝望背后就是权力的不受制约，以及规则的极端不公正。而任何人只要透过意识形态宣传的浓烟向中国大地望去，都会发现解决社会公正问题才是真正的，并且最为迫切的“现实主义”。企图用一些臆想中的替代方案来否定可以提供一个“公共选择程序”的民主化，以及无视社会公正背后巨大的社会断裂，都远离“中国问题”的语境。若“公共选择程序”无法建立而社会底层只能用肉体暴力的形式“说话”，其结果只能是一片废墟。


    （本文是对民主与公正缺失的困境，以及相关争论的一个回应。）'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# 敌视“异端”：对一种社会现象的精神分析


    曾经有人说过：对社会持批判立场，或游走于主流之外的人，恐怕在他踏上这条不归路的第一天起就得作好被整个社会所攻击、抛弃的心理准备。弗洛伊德对此曾感慨万千。


    我不知道作为一位作家，A是否想到这一点。在精神分析的视野里像A这样的人具有强大的“移情”和“升华”的本领，他可以再造出另一个世界。然而这样的一个只存在于他的精神结构中的世界与现实世界常常处于冲突之中，并置换为他的内心冲突。


    大约在半年前，在电话里 A 就给A说过他想去一个无人知晓的角落隐居。这样的角落大抵是在深山老林里。当时我以为 A 是说笑话。我的理由是，在现代社会，“隐士”早已成为一个笑柄。离群索居只是一种想像中的浪漫，根本不能当真。无论如何它面临两个问题：一是生活如何保证？二是如何能够克服已经与“文明社会”同构的心理，战胜“文明社会”的诱惑，忍受一种原始的生活？在深山老林里独自面对蓝天白云、林海风声的愿望曾经使我彻夜难眠，但第二天太阳升起使我明白这只是一个梦而已。而古代的“隐居”与现代的“隐居”是完全不同的两回事。古时人们的生活状态原始面貌要浓一些，“隐居”并不算是一种“异端”的生活，而是一种存在的常态。而现代“文明社会”早已将人“社会化”为一个主要用其社会属性来确认其存在的人，他已经无法体验到一种来自心灵深'
  merge: -1
  img_proc: true
- pgno: 151
  md: '处的呼唤了。现代社会早已粉碎了农业文明的神话，包括“隐居”、“隐士”，其“浪漫”已经灰飞烟灭。如果说古人的“隐居”因其是一种生活的常态而并不感觉到有什么心理上的恐惧的话，那么对于已经与现代社会取得精神和心理上的同构性的现代人来说，离群索居则是无法忍受的。除非已经彻底绝望，否则一个人无法通过斩断与社会的联系，而在一个对于心理来说完全陌生的环境里生存。


    A 在报社工作，他是分裂的，生活与生存被切为两半。A 在生活中没有几个朋友，独来独往，天马行空。他头上有各种各样的头衔，诸如什么作家协会会员、什么学会理事之类。如果按一种庸俗社会学的标准，这是很令人羡慕的，起码是一种地位和话语权的表征。至今我已忘记和
    A 熟悉的具体场景，我已经不明白他的沉默寡言与他的思想有何联系。


    两个月以前，A 和我进行了一次交谈。在这次交谈里他再次向我说他想离开。这是他最后一次与我通话。我希望他考虑到这样做的理由，以及是否为隐居提供了物质上、心理上，以及其他方面的准备。他说他已经无法忍受，否则他将发疯，而他对一些必要的事情都做了恰当的安排。我想：如果一个人有一点钱，足以支撑多年的生活费的话，那么选择一个人烟稀少的地方立一栋茅屋，再种一点菜，也未尝不是一种逍遥。在草长莺飞、花开花落中生活，也可以算是一种人与自然的和谐。但是，这仍然过分浪漫化了。在我们想像中简单的事情在现实中将变得极端复杂。隐居者即使能提供生活上的保证，这种保证即使能在他欲望不大的生活中不破坏隐居的精神愉悦，'
  merge: -1
  img_proc: true
- pgno: 152
  md: '但一种因远离“文明社会”而被忽视、弃置的感觉仍然是难以忍受的，特别是在一个人已经体验到了“文明社会”所提供的种种便利好处的情况下。隐居者从某种意义上看就像是一个出家人，已经跳出尘世之外。


    A 真能做到吗？


    一个人被逼疯、被逼走，背后必然有深刻的社会原因。许多老谋深算的人都这样说：如果你不能改变现实，你要适应它。这么说看起来有些道理，但却表现出对人性的惊人无知。他们不愿意看或看不到的是，在“适应现实”的背后，是各种各样的神经症、精神病状态，以及形形色色的施虐—受虐狂的出现。人性并不能适应于任何环境，在一个缺乏对人尊重的环境里，人健全的理性能力将受到伤害。一个人可以强迫自己改变，以适应环境，但这种适应将使他的自我被否定，在“超我”的高压下导致精神结构的畸形。这种畸形通过各种病态的行为和思想而表现出来。在这样的环境里，一个人的内心冲突似乎通过群体对他的接纳而掩盖了，与环境的同质性使他获得了一种安全感，而这个环境提供的生存资源，甚至稀缺的资源使他看到了希望，而这恰恰符合可以支持一个人的心理优势的、整个社会用以判断“成功”的标准。在这个时候，适应现实者已经变成现实的一部分。


    A 所在的生活—工作共同体像其他共同体一样可以让人们通过相互的比较而获得对自身存在价值的确认。争夺生存资源构成了共同体的人的自觉选择。无论是实际的利益还是他人的评价，以及根据占据稀缺资源的多少而获得的尊严，都与此密切相关。而占有稀缺资源似乎有条件的人都有机会，但数量上'
  merge: -1
  img_proc: true
- pgno: 153
  md: '却不够分配，由此产生了人与人之间的明争暗斗。但这种同质化的争斗再残酷也属于“人民内部矛盾”，在这个表象背后是大家不约而同对一套可以给大家带来获利机会的潜规则的默认和发挥，对这种粗鄙的拒斥形而上思考而汲汲于利的存在方式的认同，以及对与之配套的价值观念的捍卫。群体的力量加上生存资源的诱惑，使这个“现实”成了一块巨大的吸铁石。它就像是一杆旗帜，只需要轻轻一挥，便可将趋炎附势者裹挟而去。


    我们的谈话带着一种失败者的无奈和愤怒，以及一贯的轻蔑。不知不觉之间我们的角色已经变化，A成了一个迷惘的控诉者，而我似乎已是一个冷静的分析者。A不明白，为什么他选择自己的生活方式，他不跟着许多人吹牛拍马，他不和他们沉溺入一种斗鸡玩狗、搓麻赌牌的生活之中，立即就引来了这些人的似乎是永无休止的诽谤、孤立和攻击。他更不明白，何以在他对许多人所追求、热衷的东西从未表现出热情时，他们会以一种非要贬损他的面目出现。而实际上，A与世无争，从未在我们可以预见的一个自明的逻辑基础上为别人对他的损害提供一个前提。我告诉A这是他们的一种本能反应，其背后是无尽的恐惧和空虚。A显然并没有理解与世无争在不同的环境里的客观意义，以及将要遭受的命运是在怎样的一种情况下不同的。在一个陌生的、由临时性的群体组成的公共空间里，由于不存在多少心理上和利益上的联系，与世无争不会引起他人的注意，从而既不会引起他人的精神焦虑，也不会让他们感受到威胁而呼唤出他们的攻击性。但如果这样的一种与世无争出现在一个彼'
  merge: -1
