  md: '压迫他们，而不是有没有压迫和他们可不可以压迫谁。他们渴望对压迫者而不是对压迫的秩序和结构进行摧毁，甚至“取而代之”成为压迫者。而前者虽然对后者进行捍卫，但他不过是力图通过对后者的捍卫而对不允许压迫的价值理念进行捍卫，真正目的不是要摧毁压迫者而是要摧毁压迫的秩序。


    正是这种尴尬使一个批判者有必要在现实之中超越现实，努力将真相展现在这个残酷的世界中。当乌托邦远在天边时，批判的过程成了某种存在的证明，或某种价值的确证。这是一种虚幻的尊严，是主体性的一种凸显，虽然它很难避免沉沦。


    # 四


    这本小书是我近期思考的一个结果，也是我希望介入现实的某种尝试。其中有一些曾在《天涯》、《中国改革》、《读书时报》等主流媒体发表过，引起过一些反响。


    读过我的文字的读者或许会注意到，在分析一些问题时，我更正重于从“为什么”而不是“是什么”的角度来展开。换言之，我对思维方式、人们作出判断所依赖的逻辑更感兴趣。我一直认为，人们作出判断的环境或背景，有时候比判断本身更为重要。判断常常通过某种包装而制造假象，但洞悉了它的背景和逻辑，那么就可以将它的伪装剥去。


    这或许更有助于揭示真相。这也是我将书名取为《被遮蔽的真相》的原因。因为遮蔽真相的不仅有语言、现实背景等，还有人的思维方式、观念的逻辑演绎过程。'
