  md: '# 被遮蔽的真相


    作为他发展自我的“背景”，反而以自己（在很大程度上也是社会）的方式，在孩子成长的道路上不断否定他的自我建构，最终（通过与社会的“合谋”）把一个假自我系统植入孩子的精神世界，最终又会发生什么呢？一个人一旦被迫使放弃他的自由自发的成长，其结果就是生命的挫折，这是弗洛姆在修正弗洛伊德的破坏本能理论时的发现。弗洛姆正确地看到，“爱欲本能”与“破坏本能”是成反比的，一旦生命被挫折缠绕，它便通向了一条充满破坏性的道路：人被压抑的东西，总需要通过迂回曲折的途径发泄出来。而悲哀的是，造成这个灾难性后果的原因大多并非出于人的主观意愿，而是一种权威效应的产物，是被深深地植入权力结构中的一种“集体无意识”，并受到社会文化的支配。阿尔诺·格鲁恩以他自己独特的方式举了一个例子：当一只生下不久的黑猩猩受伤时，它母亲马上会抱起它并照顾它。但是，当一个小女孩在冰道上摔倒时，伤了脸，父母却非常生气，马上命令她回家，以示惩罚。“父母不去保护孩子”，阿尔诺·格鲁恩评论道，“他们不允许孩子表现出软弱无助的感觉”。⁵而这一切的原因仅仅在于，“父母把自己遭受到的痛苦强加在孩子身上，他们惩罚孩子的原因正是他们自己内心拒绝和憎恨的东西，即易受到伤害和软弱无助的感觉。这两种感觉都是痛苦的经验，但要表达这样的感觉就会被认为是在贬低自我价值……我们不断地寻找牺牲品，以惩罚当年自己扮演的牺牲品角色”⁶。


