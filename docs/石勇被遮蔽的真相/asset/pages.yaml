  md: '正是通过这样的一种心理机制，一个人关闭了通往自己的过去的大门。在成长的创伤性经验中，痛苦、个性、自我，凡是不符合社会的权力结构的整合要求的东西均遭到否认，并被重新编码。他不仅与自己失去了联系，也切断了与他人的联系。而一个与普遍性的人性没有联系的人，是不可能有对他人的同情心的。事实上，他甚至会憎恨他人，因为无论如何，他人的处境对于他的一直被否认的痛苦都是一种刺激。


    除了攻击，我们就是逃避。当我们无法与自己与他人产生人性上的联系时，物化了的我们只能将自己投向外部世界，“通过购买我们的消费社会提供的无数产品来制造自己的生活”。这使生活的目标“就是掠夺自我以外的东西，就是占有别的生命和物品”。这种存在方式实际上已经陷入了一种精神上绝望的境地。尽管在麻木之中，人是没有感觉的，一种自动性的生存程序控制了这一切，然而精神深处，人仍然能隐隐约约地触摸到自己的存在困境，虽然它仍然是病态的。因此，在丧失同情心之后，自我同情便取代了同情心。阿尔诺·格鲁恩讽刺道：“我们希望通自我同情来避免自己成为一个扭曲的人。自我同情可以用……来拯救我们。”
