  md: '了人的生活，以及人所熟悉并用来支撑自己的存在的时空秩序。梦更以各种最原始的恐怖形式将人对死的恐惧心理以最形象化的方式表达出来而给人造成一种威胁性的心理震荡。这样的噩梦常常将我们惊醒，使我们面对着虚无和恐惧而肝胆俱裂。幸好，我们只是做梦，就像弗洛姆所讲的，它使我们“醒来时无不感恩地发现这仅仅是一场梦”，否则，我们真不知道如何应对我们的生活。然而不管怎样，对梦的拒斥，对梦的意义的消解正意味着现代人已被遮蔽的真实深深地嵌入其生存困境之中，在无所不在的权力渗透和意识形态操纵下，那个实然的世界实际上已经消隐。


    # 三


    弗洛姆发现：梦是一种“被遗忘的语言”，这门语言在古代曾经辉煌一时。在古巴比伦、古代中国、古代印度、古希腊等，它都是人们交流的工具。它雕塑了那时人们的心灵世界和生活世界。这种已被“遗忘”的语言便是象征语言，一门现代社会每个人都应该学习的“外语”。象征语言取消了逻辑结构和我们所熟悉的时空秩序，它不需要借助一系列复杂的语言符号和技术规则而直接以内心的体验进行交流。这种语言存在于神话、童话、梦幻之中，存在于人们之间只可会意不可言传的体验中，这种体验打破了私人性而以公共体验的形式表现出来。这可能就是最本原的体验、认知、理解世界的模式了。就像一个电极一样，通过对梦的解析，通过深入人的无意识结构，弗洛姆的理论古代人类依靠直觉、体验而认识世界'
  merge: -1
  img_proc: true
- pgno: 97
  md: '的认知模式、理解模式接涵了。这是真正思想的火花，它使人不由得想间：理性对感性的遮蔽虽然表现为一种认知的进步，但真的是一种理解的进步吗？人在将自己的理性结构切入世界客观的逻辑结构中，洞悉它的秘密并以一种“理性的狡点”的方式利用世界的物质交流与能量转换创造出庞大的人工世界时，是否失落了一点，即人与自然的⽣命联系？感性的遮蔽是否又意味着人已不可能直观地把握那个本然的世界了，人所面对的是一个⼈工世界，一个由各种虚假的意识形态所编码好了的世界？没有敏锐的直觉，依靠一种被编码好了的认知和理解模式，人真能看穿这个世界的幻象而达至真实吗？


    ⼈的发展不等同于物的丰富，社会的进步也不等同于⼈控制⾃然⼒的提升。它们仅仅是⼿段，这些⼿段必须接受⼈性和⼈的⼼灵的检验。发展的指标只能是⼈的解放，⽽进步的指标同样只能是⼈性的进化。然⽽，⼈类发展到现在，尽管可以上天⼊地，却并⾏见得⼈性有⼤的进化。其⼼灵仍处于蛮荒状态之中。⽽⼈的解放更是⼀场骗局。⼈类也许曾经神话中迷失，他也曾跪拜在种超⼈的⾃然现象和物脚下乞求拯救和宽恕，然⽽到现，他却被拖进⼀个泥潭之中，难以从物对⼈的控制中拔出脚来。权⼒和意识形态之⽹、物化的⽣活⽅式和思维⽅式之⽹，牢牢地罩住了他。以⾄我们经常疑惑：我们是在同打交道吗？还是同种物的⼯具进⾏互相欺的游戏？已经⽤不着怀疑，科技理性的物化思维压了感觉和⼈类最本原的⽣命体验。对⼈的符号化表征和以物的意志对他进⾏编码修改了⼈性的指令。


