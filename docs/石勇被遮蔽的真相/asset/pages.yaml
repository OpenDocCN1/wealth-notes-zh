  md: '属性，却显然不构成他的观点的支持依据。这样实际上判断者已经使自己陷入了一个悖论：如果自己的观点成立，那么只要用这个整体性的事物的其他任一并其观点赖以获得现实的逻辑基点的属性相冲突的属性进行论证，就可以对之证伪。


    从这种意义上讲，任何一种“整全性”的判断都属于越过判断有效性的假命题。比如中国文化什么什么的，中国知识分子什么什么的，哲学什么什么的，伦理学又什么什么的，如果不能用它赖以成立的特定语境构筑一个限定的范围，即使它能实现逻辑的自洽，也不能获得它的有效性。这个语境之所以重要，乃在于它构成了 一种“理解的前结构”，没有大致相同的这个“理解的前结构”的人，根本不能进入他的语境，自然也不可能对他的观点作出符合其原意的正确的评论。当我们谈论鲁迅的“不读中国书”，谈论胡适的“二十年不谈政治”而专注于文化批判时，如果不能进入他们的情感世界，捕捉当时的文化心理，以及认识到语言在把握复杂事物时的无力，就不可能逃脱纯粹的“语言分析”的陷阱。如果不是这样，在文化保守主义抬头的今天，对于仍然具有极大意义的文化批判，我们就不可能给它一个合法的地位。


    文化批判的理论工具令人眼花缭乱，从精神分析、语言分析、结构主义、批判理论，到后现代主义、东方主义、后殖民理论，不一而足。它并不仅仅是一种文本的编码游戏。文化批判建立于这样的一个逻辑：人是文化动物，正是靠文化他才得以成为人，也正因此他被文化所规定。我们看见的已经不是“原来的那个人”，而是人的形形色色的文化属性。从这种意义


