  md: '由主义的追随者到自由主义在中国的领军人物的长征。


    我们现在所研究、认同或批判的朱学勤无论怎样都能与“自由主义”这个盛行于英伦三岛和北美新大陆的政治和经济思潮联系在一起。从学术创造活动的角度上讲，这是一种不幸。任何一种学术若与政治或利益纠缠在一起，其独立性和创造性都将大打折扣。但在中国，从来就没有独立于政治之外的学术。中国知识分子强烈的政治参与意识使任何一种土生土长或漂洋过海来的政治和社会理论都打上了“救国救民”、“富国强民”、缔造一个自由民主社会的烙印。而当中国的传统文化遭到一致谴责，计划经济背后的意识形态遭到“清算”时，在大洋那边已经绽放出自由花朵的自由主义成了许多知识分子崇奉的图腾。在所有的政治哲学中，在自由主义者看来再也没有任何一种理论能够比自由主义更为博大精深，并且具备现实的可操作性。


    20世纪80年代的中国思想学术界几乎还可以说是铁板一块，对启蒙的狂热和对改革开放的支持使学者们意气风发、高歌猛进。在这个洋溢着理想主义的时代里，自由主义思潮几乎席卷了整个思想界。1989年是一个分水岭。自由主义的政治激进使它遭受重大挫折。进入90年代后，1992年邓小平南巡讲话和“社会主义市场经济体制”的确立使经济自由主义思潮受到前所未有的欢迎，此后便占据了官方的决策层。从海外回归的大批持经济自由主义立场、鼓吹私有化的“海归”受到重用，相反，持马克思主义立场的经济学家则被排斥，已经处于一种“民间”的自发状






    ![](img/7e667f542e5175c06fc3833e30d0f27f_53_0.png)'
