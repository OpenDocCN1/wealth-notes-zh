  md: '# 被遮蔽的真相


    “万民法”的语境中的说明，这种“帮助”并不等于要对不平等的国际分配领域进行调整，即并不是说明在穷国、弱国接受“万民法”时，它们有权利要求富国、强国对它们进行补偿。罗尔斯在这里陷入了理论上的矛盾：既然从“原初状态”推出的第一个正义原则可以运用于国际社会（人民社会），那么第二个原则为什么不能运用呢？这种矛盾很容易被人质疑：按照“原初状态”的假设，如果国际社会按西方国家“民主”、“人权”的标准接受“万民法”，它们同时就必须至少使当前的国际社会经济秩序的不平等有利于这个世界上最贫穷的国家和地区。而这也
    在“人民社会”的语境中逻辑地推出：任何一个国家的人民都有权利自由地向民主的富强国家移民⁵，并且在全球层面要求对财富和资源进行再分配⁶。


    正是从这种意义上讲，国内领域与国际领域在结构上的不同已经决定了“正义论”在以“万民法”的含义普适于全球时，带来了普遍主义的贫困。要将全球变为“人民社会”，就要求在“原初状态”下的主权国家消失，而主权国家的消失既是第一个正义原则运用于国际领域的前提，同时也逻辑地证明了第二个正义原则的适用性。取消第二个正义原则就会逻辑地取消第一个正义原则的规范权力。或者说，如果第二个正义原则没有普遍性，那么第一个正义原则就没有普遍性。这时不同的“公共领域”的不同结构便表现为一种对“双重标准”的对抗，最终在理论上对其提出质疑。要避免这种理论内的撕裂，“人民社会”就必须有规范权力的“主权者”，这个“主权者”必须超越于任何一个具体的主权国家。也就是说，人权的维护者、裁'
