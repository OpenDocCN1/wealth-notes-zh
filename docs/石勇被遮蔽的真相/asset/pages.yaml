  md: '# 被遮蔽的真相


    感支离破碎，那么曾经具有合理性的东西似乎也丧失了合理性。一种文化化的判断在我们看来越来越没有意义。“不读中国书”的喧嚣让我们产生这样的一个意象，以为鲁迅真的是对传统文化要全盘打倒，无论儒、道、墨、法诸家，或仅仅是儒家文化本身的各种内容，是“一个也不宽恕”的。我们忘记了这是一个由情绪支持的偏激的文学化的判断。它针对的不是全体，但为了强调对这个事物的诸多内容的情感和摒弃它的合理性与紧迫性，采用了一种“整全性”的表达。如果我们注意不到这一点，就陷入了一种单向度的思维，以为对事物不是绝对肯定，便是彻底否定。如果是这样，文化批判与文化保守便陷入了非此即彼的无聊之争，作用在同一事物的不同领域的它们就有可能被拉到同一个领域和层面来检验它们的功能。这将使文化批判和文化保守越出它们的适用界域，不断地放大它们的所指，最终该摒弃的反而留了下来，而该保留的反而遭到摒弃。


    一种观点要想醒目，它就必须携带情感和价值判断的信息并不断放大自身的所指。在这个时候，它的表达越是有力，越缺少规范性和解释力，事实判断与价值判断之间也越脱节。判断者也许先在地设定了一个特定的语境而使他的观点获得意义，但由于主体的“认知图式”的不同，别人不一定能进入他的语境。每一种事物的属性是无穷多的，这些属性相互冲突，却又共同构成一个整体。换言之，他抽取事物的某一属性而对与之冲突的其他属性的舍弃非常容易陷入一种独断论。从某一属性出发，所发出的判断针对的却是事物的“整体”。而构成了这一事物的其他诸多




