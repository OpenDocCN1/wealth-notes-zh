  md: '# 第三编 显现的他者


    形形色色的“领袖”，都是无比杰出的“机器操作手”。他们都是天才的心理学家，非常善于在不同的情境中随机应变。他们所玩弄的一套词语，都是极为抽象，并且所指极为不明的，而它又与人内心的莫名的渴望产生联系。这些词语的威力只有在它所曾经对应的事物已因其现实的邪恶而臭名昭著时才宣告寿终正寝。这个时候，正如勒庞所指出的，如果词语的形象已经令人深感厌恶，那么，“一个真正的政治家的当务之急，就是在不伤害事物本身的同时赶紧变换说法”⁽⁵⁾。我们可以补充的是，当一套意识形态体系已经在心理上遭到了人们的抵触，那么这个时候群体的领袖只要一喊出另外的一套意识形态术语，哪怕这两套采用了相同的思维，并且可以预见也将产生类似的结果，它也会一呼百应。群体固然不会像勒庞所言的那样在意识形态的灌输中变成“动物、痴呆、幼儿和原始人”，但他们的批判意识的丧失，他们的极端轻信，他们的歇斯底里，他们对理性的排斥，他们的条件反射，则为领袖对他们的奴役、欺骗和操纵提供了天赐良机。任何一个领袖只要掌握了群体的心理，就可以成功地向他们发出控制的指令。


    于是这样的场景便非常富有讽刺意味：一群人聚在台下朝台上仰视，一脸虔诚；台上的领袖道貌岸然，他不断地进行鼓吹。群体在领袖的鼓吹中现出庄严的表情，并出现慷慨赴死的情绪；而领袖在台上则为群体的“愚蠢”而窃笑不已。这是一场由聪明人与头脑简单的人共同玩的游戏，然而后者对游戏规则是一无所知的。在原始草棚里，部落酋长的命令就是绝对真理，部落的勇士们除此之外是不知道什么是是非善




