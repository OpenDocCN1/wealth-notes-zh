  md: '# 写在前面


    主持《国是文丛》，对于我来说是一件“轻省的重负”。经各方的努力，第一辑十册“呕心”之作呈现在读者面前，我们心存惶恐。


    对于中国这样一个大国来说，所谓“国是”历来是掌权者把持的“千准万确”之最高国策，容不得“异论”相侵扰。《说文解字》中关于“是”的“直也从日正”之解释，并没有给出“口正”的正当性与合法性之来源。但毕竟时代不同了，在当今社会，“国是”再也不能是统治者们关起门来的一己之私事，而是公共之事，是全民参与的民主议事。记得我在《大国》第三期的“编者手记”中这样写道：近些年来，随着中国公共意识的发育成熟，人们的思想已经日渐摆脱陈旧的意识形态的束缚，关于国家制度和国家建设等问题，我们开始能够从一个政治体的本性出发考察它的利益得失、兴衰机制和战略构架。


    基于上述考量，《国是文丛》旨在展示目前人文社会科学领域的优秀青年学者对于国家事务和公共事务的认识、意见、观点和看法，通过他们的文粹，使广大读者对于社会与国家以及个人权利、责任等方面的知识有所提高，眼界有所洞开，思想有所深化，观点有所匡正。就内容来看，《国是文丛》力求涉及政治、法律、经济、社会、外交等中国社会的诸多方面，基本上以《大国》丛刊的视野为轴心，即内政外父的宏大叙事的思路框架。但与《大国》不同的是，《国是文丛》不属




