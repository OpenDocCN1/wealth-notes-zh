  md: '最基本面的人的所获的份额和他比他人多付出的成本的贡献所应获的份额的叠加对应，如果一些人的所获是通过挤占、剥夺他人的机会来实现的，那么这一“合作体系”便是不合理，不公平的。这就不是处于“原初状态”和“荒岛”上的人们根据契约的自愿选择。人们可以要求退出这‘社会合作体系’。那么说这种不合理、不公平又是什么意思呢？每个人的所获又如何有可能、有机会挤占、剥夺他人的机会呢？这是因为在一个政治共同体里，既然它是平等而自由的人们通过订立自愿的契约的产物，那么它是一种不能为少数人所独占或者多占而对其他人构成损害的公共资源。换言之，政治共同体不能成为少数人的私有财产。而很显然，在现实生活中，谁拥有较多的社会资源，比如权力、影响力、政治控制力、财产，谁就能对政治共同体实际的权力分配、对公共政策有较大的影响力，就能使这种本来应公平地为所有人服务的公共政策服务于自己的利益需要。这种对公共资源较多地使用以服务于自己利益需要的行为已经使许多没有机会利用它的人被剥夺了这样的机会，非常明显，这种机会是与每一个所实际拥有的资源对应的。因此，拥有较多资源的人所给他人造成的巨大的机会成本已经实现了他人应获得的资源份额向自己的转移。在他的所获中，实际上包含资源较少者的一份。


