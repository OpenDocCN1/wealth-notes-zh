- pgno: 218
  md: '想家已经老去。70年代末，马尔库塞接受英国BBC记者的采访，再一次透露了“批判理论”背后的“救世情结”的玄机。如果历史与未来具有同构的逻辑，那么，它将定格这一代犹太人的集体记忆。


    如果说左翼的犹太人曾让资产阶级心惊胆战，那么，与之相抗衡的，从来也不缺乏犹太人。这些分属于左右阵营的犹太人对世界的影响是如此之深，他们之间思想对抗背后的制度对抗的特征是如此的明显，以致让我们不得不想想，在这个世界上，这些较量背后实际上就是犹太人之间的头脑，以及指向不同方向的“救世情结”的较量。如果说资本主义的罪恶激起了左翼犹太人的批判，那么当“社会主义”以极权主义的形式出现时，哈耶克、波普尔等犹太人照样毫不客气。无论是波普尔对“历史决定论”的批判，还是哈耶克对集体主义、计划经济的否定，在其理论上都以标榜避免人类“通往奴役之路”为旨归。从某种意义上讲，在不同的阶段、不同的对象层面上面对不同的问题使他们的批判都具有一定程度的合理性。但追求自洽的思想却不可能不涉及整体，从而都在合理性中表现出了一定程度的不合理性。这种“相互否定”的错觉是犹太人给我们所设的一个思维陷阱。“单向度的人”只能掉进这样的陷阱，真正领会犹太人这种思想的魅力，只属于独立思考的人们。


    时代在历史中不断地旋转。当20世纪前半叶世界向左转时，人们没有想到，从20世纪70年代开始，世界已经开始了向右的偏离。东欧剧变、苏联解体，世界终于加快了向右转的步伐。激进已经遭到唾弃，人们选择了保守。一个此前一直沉默，并被美国学界'
  merge: -1
  img_proc: true
- pgno: 219
  md: '所不屑的犹太人终于成了耀眼的明星，他就是施特劳斯。美国的新保守主义背后，就是这位犹太人向古希腊的政治哲学的回归。这位犹太人的“救世情结”与左派和自由派都有很大不同，那就是认为“现代性”是祸根，他要将人们从政治哲学上拉回到那已经逝去的、异常遥远的年代。“现代派”的犹太人不管是左是右，看起来都像是一丘之貉。至今我们仍然不知道，这位犹太人的思想还会造成多大的影响，而这些影响又将会把这个世界带向何方。犹太人至今仍然以其在各个领域所占据的地位而让世界震惊，但是，在这个“全球化”的时代里，民族的通过流播已经成为世界的。不管犹太人的“救世情结”又将怎样的思想出现，在这点上我们的等待才刚刚开始，但从思想本身来说，我们已经无需等待。


