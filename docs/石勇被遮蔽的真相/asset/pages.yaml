    # ## 二


    《圣经旧约》记载：上帝为了考验亚伯拉罕对自己的忠诚，命令他带儿子以撒到摩利亚山上去作为祭品献祭。亚伯拉罕听从了上帝的命令，经过长途跋涉，带以撒到了摩利亚山上，筑起祭坛，准备杀死以撒。正当他举刀要杀死儿子的那一刻，上帝派出的使者制止了亚伯拉罕，而改用公羊献祭。以撒的命保住了，亚伯拉罕也没有“犯罪”，他证明了自己对上帝的信仰，于是皆大欢喜。


    上帝竟然要让亚伯拉罕采取这种杀死自己儿子以证明自己信仰的手段，来考验亚伯拉罕，可以说是够残忍的了。虽然最终一切都还没有发生，不过这是不能成为上帝“仁慈”的理由的。这就等于向亚伯拉罕明确提问：在人性、伦理与观念、信仰之间，你选择谁？进一步说，在人与神，观念上的虚幻的“原罪”与后天现实的“犯罪”之间，你选择谁？这简直就是一个“活着，还是死去”的极其严峻的问题。最终亚伯拉罕选择了“丧失人性”而力图用上帝的神性来拯救自己，投入上帝的怀抱而弃绝世间一切人的属性。可以想像得到，这必须经历多大的痛苦和精神的煎熬。克尔凯郭尔对此进行了仔细的描述和分析，他写道：“当以撒在亚伯拉罕离他片刻之后义重新见到他时，一切就都变样了：他日光狂野，神情恐怖。他当胸抓住以撒，将他扔在地上，说道：‘傻孩子，你认为我是你父亲吗？不，这是我自己的愿望。’以撒在地上颤抖不已，他急切地哭喊着：‘上帝，可怜可怜我吧！亚伯拉罕的上'
