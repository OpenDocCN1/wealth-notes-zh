- pgno: 201
  md: '离的一切在心理上随时都处于风雨飘摇之中。如果竟然有什么东西让被他所谋杀的自我起死回生，那么这个东西马上会成为唤醒他的仇恨和暴力的对象。格卢恩举了个例子：战后对纳粹分子的审判中，一个名叫克劳斯·巴尔比的当年里昂最使人惧怕的盖世太保头子提供了一份很能说明问题的供词。当法官问他是如何拷打和杀害法国抵抗运动战士让·姆林时，他说：“当我审讯让·姆林时，我的感觉是他就是我自己。”3很显然，他说的是大实话。他越是让让·姆林身上看到曾被自己“谋杀”的过去的自己的影子，他越不能确定他现在的存在价值和合理性，他也就越会被恐惧和无意义所摧毁。既然谋杀了自己，就必然要消灭一切痕迹。


    这些“常态下的疯狂”者既然体验不到自己的内心和感情而以虚假的想像出来的幻觉来把握自己和适应这个世界，他们便不仅没有同情心，变得残忍，而且必须不断地攫取财物和权力。因为他们的存在已变异为“占有”，只有“占有”他们才感觉到自己有力量和安全感。而且他们必须迫使他人服从他们同自己打交道的方式，否则这些权力和财物仍然无法消除他们的无意义的恐惧。“那些认为关键是找到权力的人，那些同镇压自己的权力保持一致的人以为他们能够通过参与权力从自己的弱者地位解放出来。”6而那些离内心最远的人“为了维持自我组织，越来越依靠于来自上部的操纵和控制，他们在推销他们看‘现实’的方式方面也最积极”。


    很显然，并不仅仅如此。服从权力的控制与拥有权力而成为权力本身是一种共生结构，就像奴隶与奴




