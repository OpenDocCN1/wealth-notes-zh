- pgno: 42
  md: '国哲学的“合法性危机”，必须抓住中国文化本身的价值依据、它失落的后果，以及它切入当代的语境。


    似乎正是预感到了这点，陈明在他发表于 2004 年 6 月 2 日《读书时报》的《中国哲学合法性危机：学科还是意义？》中强调：“我认为中国哲学合法性危机是意义危机，它指向的不是传统思想文本及其解读，而是当代‘哲学家’群体的工作及其产品，以及它们与民族生命/文化在精神上的自觉联系。具体来说，就是作为一个承担着特殊使命的学科的‘中国哲学’及其承担者的工作、劳动，不能如国人所期待的那样在当下与历史、未来之间建立起意义和精神上的联系，不能在时代条件下创造性地建构起基于民族生命的表达系统。它所关涉的，根本上是民族生命/意志/文化的自觉程度和实践力度的问题。”这无疑是一语中的。但显然，在此语境中的“合法性危机”与政治统治上的“合法性危机”不存在话语谱系上的一致性。如果说政治统治的合法性危机主要指其丧失了“正当性”，即一种伦理上的拷问，那么在此的“合法性危机”指的是
