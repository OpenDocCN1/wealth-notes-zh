  md: '尔所描述的《1984》的世界，让我们想起了形形色色的宗教的“圣战”，让我们想起纳粹德国和极权主义国家的意识形态狂欢。而这种“信仰”吞没良知、人性的现象仅仅是已经异化的人需要同、救赎的心理冲动的一种放大而已。多少年来，被“主义”所俘获的人，或多或少地具有这种可怕的特征。


    # 四


    克尔凯郭尔对亚伯拉罕的“灭绝人性”的美化是相当荒唐的。即使是一个人彻骨的绝望和痛苦的挣扎，亦不能让信仰就凭空不仅不受人性的约束，并且取得规范世间万物的权力。这个世界上不存在绝对的真理，也不存在绝对的权威。任何一种实际上由人所创造的东西，怎么可以在社会中以绝对的标准去和其他的事物发生关系？它如何来界定自身，并为自身的权力提供充足的支持依据？当左翼的乌托邦的信仰、右翼的新的“十字军东征”和法西斯暴政使信仰异化为绝对的并造成无穷的灾难时，我们不由得要问：肢解了人道主义的“神道主义”，离开了理性和良知支持的“主义”，其内在所演绎的逻辑和行为是否能够成立？


    这就迫使我们必须追问信仰的含义、结构和功能，以及人为什么需要信仰，在什么样的前提下，信仰才不被异化为一种否定性的力量，不被异化为一种意识形态狂热和一种杀人的工具。


