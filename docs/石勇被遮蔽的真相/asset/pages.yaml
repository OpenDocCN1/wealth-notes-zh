  md: '们确应该看到，这种“支持”更多的不是出于“儒化中国”的渴求，而是综合国力上升后，一个大国的国民希望以属于自己的文化资源来谋取自己独特的存在尊严和文化竞争力的自然反应。毫无疑问，2004年，文化保守主义的“存在”已经提出了这样的问题：存在者需要对其自身的定位，以及理顺在内容、属性或层面上与其相交或不相交的其他存在者的关系。那么，2005年，文化保守主义何为？


    # 二


    朋友陈壁生曾写了一篇《2004：文化保守主义的抬头》的文章，归纳了2004年的几个体现文化保守主义“抬头”的事件。其中的一句话相当有趣：“我们第一次看到一批自由主义知识分子的文化态度一反五四以来自由主义反传统的姿态，开始重视本土资源。”


    的确，如果说陈明、康晓光、蒋庆等在贵阳阳明精舍会议只被认为是“文化保守主义”阵营内的事情，那么秋风、刘海波等“自由主义者”支持“读经”，以及《原道》十周年会议在“共同的传统”的名义下让文化保守主义者、新左派、自由主义者都能够坐在一起则昭示出：“文化保守”绝不是哪一个“阵营”的事情，它是一个陈明所言的“基础平台”，是不论何种政治经济选择的共同的“文化选择”。“文化保守主义”的论域与新左派、自由主义的论域重合面并不多，要将它们对立起来实际上是一个误会。学界对它的“谨慎的欢迎”表明以往因文化焦虑而导致的非理性情绪已开始回落。


    而在民间，传统文化的复迹迹愈加明显。各种'
