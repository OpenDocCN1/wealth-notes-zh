  md: '# 平等主义自由主义的逻辑


    一


    怀特海曾经说过，两千多年的西方哲学不过是柏拉图哲学的一系列脚注，而近现代思想的诸多重要秘密，则出自康德之手。要想破译一些令我们百思不解的现象，必须从康德哲学那儿寻找原因。今天，康德哲学已经成为整个人类宝贵的精神遗产，成了一种可以“共享”的“公共资源”。


    也正是如此，左派和右派都希望能从康德那儿获得灵感，从他的论述中寻找支持自己政治立场的证据。对一种“整体理论”“解释”的多样化可以演绎成甚至有可能是相互对立的理论，这一点并不令人吃惊。但真正重要的是，即使如此，它也说明哪怕一个看起来在整体上可以自洽的理论体系，它们的不同内容实际上也是处于不同的领域、层面，并由只在这些领域和层面有效的逻辑支配。因此，最核心的问题已不再是左派和右派各自的“断章取义”，而是它们能否做到相互综合。


    从这种意义上讲，没有谁比作为自由主义左翼的约翰·罗尔斯、罗纳德·德沃金对康德的推崇更能深刻地反映出他的思想在现代政治哲学领域的意义。当以赛亚·伯林在1962年说“在20世纪，迄今尚无权威性的政治理论著作问世”时，他未免过于悲观了。仅仅九年之后，罗尔斯就以他的杰出著作《正义论》作出了回答。这本如罗尔斯的最强有力的对手'
  merge: -1
  img_proc: true
- pgno: 221
  md: '和反对者诺齐克所说“要么必须在罗尔斯的理论框架内进行思考,要么必须解释不这么做的理由”的书复苏了康德的社会契约论,并以和康德大致相同的伦理规范方法再次使“政治的德性之维”闪出夺目的光辉。而德沃金则在
    20 世纪 70 年代末与 BBC 主持人麦基谈话时说:自由主义的真正父亲不是边沁(事实上,边沁只能使自由主义者蒙羞),而是康德。康德关于人类本性的概念绝不是贫乏的。


    我们注意到,这两位对康德推崇备至的自由主义思想家都在确保基本自由的优先性时,力图破除几百年来自由主义史上自由与平等不相容的神话,将平等摆到了一个极为重要的地位。在他们的两本可以相提并论的著作《正义论》和《至上的美德——平等的理论与实践》中,在一开篇都分别开宗明义:正义是社会制度的首要价值,正像真理是思想体系的首要价值一样;平等的关切是政治社会至上的美德,没有这种美德的政府,只能是专制的政府。如果说从理论上讲,对平等的警惕和敌视已经成了许多“自由主义者”的一种“集体无意识”,并且在巨大的社会不平等使许多人的自由价值大打折扣而导致的“自由困境”中,平等的指令必须渗入自由主义的逻辑——那么,在罗尔斯和德沃金之后,人们已经无需等待。


    这是一种“平等主义自由主义”的逻辑。正如德沃金所说的,它是一条与老一代的平等主义者和新老保守主义者的错误选择所不同的、能够使平等和自由都得到维护的“第三条道路”。在人类历史上,思想资源的不同路径导致了历史的不同选择。自由主义的历史就是自由从它成为一部分占有最多社会'
