  md: '农村的文化等“上层建筑”摇摇欲坠。温铁军以其扎 扎扎实实的研究指出：土地是农村的社会保险。这不仅 使“农村土地私有化”的提法沦为书斋里的呓语，而且 还可以告诉我们：这样的一块土地在面临强大的外部
    压力的今天，已经不足以支撑农民在农村这样一个共 同体内的生活体系了。当苦难的生存已经使不再是一 个封闭系统内的生活失去从容不迫的氛围，那么想要 从乡土文化中再次发掘出一种安身立命的资源便是
    极为困难的。当农民在各种坑农行为的搜刮下深感 无力，当苦难的农村生活被充满诱惑力的花花绿绿 的城市生活笼罩上一层阴影，起码在许多青年人眼 里，这样的生活已经因为绝望和恐惧而变得陌生。贫
    瘠的土地使与土地联系在一起的一切都失去了魅力。 这种文化生态的恶化使他们挣扎在想逃离却又无法 逃脱、与苦难的生活联系在一起的暗无天口的精神煎 熬之中。


    农村的文化生态是一个自有其存在价值的独立 系统，它是农村共同体内的一个“精神家园”，人们从 这个“镜像”里可以看到自己本来的身影，并引发关于 自身来自何方的遥远的回忆。从本质上讲，它超越于
    感官的物质享受之上而不受农村的贫穷或富裕支配。 因此保持这种文化生态而拒绝城市的文化殖民并不 是要使农民永远保持在前现代的农村生活的状态。 恰恰相反，如果没有这种文化生态的支撑，农民相对
    于城里人便永远只是“二等国民”，而城里人也在这种 居高临下的文化奴役中永远保持一种高人一等的文 化心理，农村要想摆脱困境，就要困难得多。


