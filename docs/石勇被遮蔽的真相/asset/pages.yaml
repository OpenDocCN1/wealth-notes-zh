- pgno: 145
  md: '# 民主与社会公正


    复杂而敏感的中国问题正在困扰着以观念和思想介入世界，力图理顺逻辑、发现真相的人们。从历史的幽深隧道里驶出的中国改革的火车吸引了人们更多的注意力。各种价值、主义相继被提出。民主缺失的困境不断地变幻成许多危机深重的社会问题。而对于民主化的诉求，中国的一些“现实主义者”则对它进行了理论上的抗拒。这种“现实主义”的观点是：民主化会使中国的发展出现无可挽回的挫折，甚至导致社会崩溃。无论是潘维贬低民主抬高法治“权威”的高论，还是康晓光“民主化是祸国殃民的选择”的惊人之语，以及洗岩对“权威主义＋自由主义”（说白了是政治专制加昂贵资本主义）的推崇，都是黑格尔“存在即合理”的遥远回声。


    显然，民主对于社会存在和人的存在所具有的价值维度必须在理念与现实的逻辑之间获得更有助于证明它存在理由的同构性。反民主者对“现实”的强调遮蔽了民主的一个最基本也最重要的价值依据：民主是一项基本人权，任何非民主的统治都是非法的。这种理念向现实的延伸可以表现为如下两点：非民主制度不仅将权力、金钱等稀缺资源，而且将自由这种基本人权都进行极不平等的分配；与欣赏经济自由却排斥民主的“贵族自由主义”遥相呼应，这个专制卯翼的“社会存在”扼杀了底层的任何“良性预期”。


    能够表征平等分配基本权利和不平等分配非基'
  merge: -1
  img_proc: true
- pgno: 146
  md: '本权利的 socially 公正的日益恶化带来了某种社会危机。公平与效率之争不仅未能在一个缺乏“公共选择”程序的环境里获得它的语境，而且社会公正日益成为经济发展甚至社会稳定的一个前提。中国的资本原始积累是以权力、资本集团利用一套极不公正的规则对本国弱势阶层的掠夺为途径的，而在当前形势卜，能够被掠夺的弱势阶层的资源已逼近枯竭。它将使权力与资本集团更加疯狂，弱势阶层更加绝望。这意味着，这种极不公正的规则不仅已在理论上被判死刑，而且在対既存秩序的维护上，其功能也将寿终正寝。


    中国0.5以上的基尼系数、频繁的矿难、各地发生的冲突事件已经证明这种排斥民众参与改革失去了魅力。正如洗岩所说的，改革正在消解自身的合法性。规则的不公正已经使经济发展逐渐失去潜力，并萌发了普遍愤懑的社会心理。在这样严峻形势下，不要说“中产阶级社会”是梦中呓语，就是这样的“经济基础”，也已经让人看到了“上层建筑”的摇摇欲坠。


    社会公正由此成为一个焦点问题。在自由、民主、公正等处于不同层面，彼此联系紧密却很难通过比较确定的价值中，没有一个比公正更能切入一定时期的社会心理。正是处于公共社会领域内的这个社会(制度)基本结构的安排影响到了人们的利益和心理上的生存。而人们的社会心理不过是社会基本结构是否良性的一种反映。因此，强调社会公正乃是对政治、经济、社会、心理危机所作出的最为有力的反应。其他问题都以社会公正为基础或与之有千丝万缕的联系，没有社会公正，在当前的中国严峻形势下，它们的脚下将没有一个坚实的地基。


    ![](img/7e667f542e5175c06fc3833e30d0f27f_146_0.png)'
  merge: -1
  img_proc: true
- pgno: 147
  md: '更必须强调的是，社会公正同时具有形而上和形而下的特征。向上，它溯至人权，溯至统治的合法性；向下，它建构一套避免社会危机的规则，使既存秩序消除被内部解构的阴影。它消解了一个由民主来保证的“公共选择程序”与洗岩等“存在合理论者”所强调的社会结构刚性的对垒。它成为当前中国诸多问题的“语境中的语境”、“前提中的前提”，不仅可以“应然”的角度上证明自己的道德正当，而且更重要的是，这种“正当”背后恰恰隐含了现实的逻辑。在这种意义上，“公正”这个价值取得了一种优先性，讲“公正至上”绝不过分。


    正如洗岩指出的：公正论者“顺势推出”政治民主化主张是题中应有之义。一个“公共选择程序”就是一个民主程序，它必须由民主制度保证，否则只能是画饼充饥。事实显而易见：如果说社会公正是由民主制度提供条件和理由，那么民主制度的理由和条件则是基本人权与统治的合法性，以及现实的逻辑支撑。不进行政治民主化改革，社会底层永远没有参与博弈的机会，他们的生存资源被掠夺枯竭的那一天就是革命来临的一天。


    从抽象的层面上讲，人们在组成一个社会时就先验地对社会作出了最基本的贡献：正是社会的存在使一切成为可能。意志自由乃人之为人 的价值依据。如果一个超越于任何个人之上的政治共同体要施行统治，它必须要征得人们的普遍同意。这样的一个政治共同体必须是人们授权参与建构的。无论以何种统治方式出现，被统治者的自愿“授权”都是它建立在尊重基本人权上的合法性的一个前提。而不管是在


    137'
