- pgno: 56
  md: '一个学者更重要的特征是理性的思考而不是感性的经验沉淀，因此我们可以对此置而不论。我们可以只将他的思想回溯到他的学术生涯的起点或转折时期。对于朱学勤来说，文革的经历自然与他现在对社会革命和文化革命的厌恶有千丝万缕的联系，但这种联系只有在经历过了学理的梳理和论证，让这种情结获得一种证明和支持的价值依据后方能经受得起作为一个学者的理性的检测。在这里，为他的迄今为止的学术活动提供一个支点，给他指定好学术和思想路径的便是他的博士论文《道德理想国的覆灭》。这本他的成名作就像是打开他的思想大门的阿里巴巴的密令。


    朱学勤写这篇博士论文显然是意味深长的。经历过“文化大革命”和读过马迪厄的《法国革命史》的他，蓦然发现了文革和法国大革命的相似性。也许，就像他称“1968的一代”不是“学术中人”而是“问题中人”那样，当时解剖法国大革命的想法已在他心中萌发了。“我哪里是在批判卢梭，我是在我自己和同代人的心里剥离出另一个卢梭”③，这句话实际上已经说明了他思考这个问题的意义。他明显是在借他人的酒杯，浇心中块垒。在这本书的序言里他坦承：“法兰西风格的政治文化已经融进了中华民族的政治血液、政治性格。”④在他看来，20世纪中国的政治命运的灾难性后果与从俄国中转过来的法兰西政治文化有千丝万缕的联系，而抓住1789年的法国大革命，特别是抓住卢梭哲学的政治神学论可谓抓住了命根。中国之所以如此多灾多难，千错万错，就在于没能走上英美的宪政自由主义之路，而偏偏选择了法俄。一


