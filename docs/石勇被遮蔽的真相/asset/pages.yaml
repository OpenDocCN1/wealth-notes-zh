  md: '恶的。在现代，被领袖的意识形态“武装”起来的勇士们，照样认为他们永远与真理联系在一起。而在这种被洗脑后的简单的条件反射中，领袖成了他们永不质疑的教条的化身。领袖的心理学知识迅速转化成主宰他人的权力。这种权力确立了领袖凌驾于群体之上的地位。而这样的地位，又是与一个等级秩序，与为包括领袖在内的上等人提供的奢侈的享受紧密相关的。这样的一个等级秩序浸透了压迫、榨吸和奴役，实质上是对群体与领袖曾经慷慨激昂地否定的一切旧事物的承袭。在旧的东西换了一个包装又隆重上市后，这样的景象将变得清晰：所谓的“领袖”与“群体”不过是牧羊人与被牧的羊群，后者正在前者的吆喝声中向奴役之路狂奔。此情此景使哲学家仰天长叹，而历史则掉下无声的眼泪。


