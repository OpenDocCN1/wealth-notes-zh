  md: '# # 被“文化殖民”的农村


    在发表于 2004 年第六期《天涯》的《L县见闻》一文中，上晓明先生提到了农村被城市文化殖民的现象。他认为：“‘三农问题’并不仅仅是来自今日中国的经济和政治变化，它也同样是来自最近二十年的文化变化。这些变化互相激励，紧紧地缠绕成一团，共同加剧了农村、农业和农民的艰难。因此，如果不能真正消除‘三农问题’的那些文化上的诱因，单是在经济或制度上用力气，恐怕是很难把这个如地基塌陷一般巨大的威胁，真正逐出我们的社会的。”


    这样的表述，使人难免会认为或许文化学者更有一双容易看到“存在”背后的文化指令的眼睛。但不管怎样的描述，比之严峻的现实它都只是一个通往真相的入口。事实上，这已经是一个从90年代初便已经恶化，到现在已更为严峻的问题。城市对农村的文化殖民已经使农村文化生态处于一个极端恶劣的境地。而在三农问题中，很少有人讨论这种文化殖民问题。如果不是我孤陋寡闻，至少到现在，我所看到在“三农问题”视野里提出这个问题，并把它摆到一个重要地位的，也就上晓明一人。


    这样的事情是不言而喻的：现实可以被我们体验、感觉，乃至用语言捕捉到，但它遵循自身演绎的逻辑。只有在一种浸泡已久的麻木或完全想象不到的隔膜中，我们才需要用具体的事件，以及他人的话语表述来提醒，使我们睁开迷茫的眼睛。没有农村生活'
  merge: -1
  img_proc: true
- pgno: 117
  md: '体验的人,可以从经常听到的“文化下乡”中窥探到农村文化生态的恶化——它意味着乡上的文化形式基本上已被摧毁。而对于出身农民家庭,从小就有农村生活体验,到现在或在城市谋生或仍然在农村生活的人来说,感受农村文化生态的极端恶劣的一个明显例证便是发现过节和过年已经淡然无味。这不仅是一个乡土艺术的凋零、文化形式的被摧毁、远离农村生活的本真状态的娱乐形式已占据主流的问题,更重要的在于,在城市的文化殖民中,农村普遍出现了一种无意识的精神上的不安、文化上的焦虑。


    中国二十多年的改革史,也是二十多年的农村被文化殖民过程。改革初期的乡镇企业的异军突起使“城市化”成为一种朦胧的想像,成为农村的一种向往,由此使农民的精神生活开始遭到冲击。如果说在此以前对于城市、对于“公家人”和“非农业户口”的羡慕曾经使他们有一定的压力,产生一定的心理挫折的话,那么由于牢不可破的城乡二元体制,绝大多数人并不会出现因城市的诱惑而带来的巨大压力下的心理创伤。他们仍然是从容不迫的,贫穷的农村生活拥有发源于乡土,并可以用来构成他们的精神生活,给他们以一个精神家园的文化形式。而“乡镇企业”虽然给农村营造了“城市化”的前景,对他们的精神生活造成了冲击,但由于它的乡土性质,并没能在此产生出一种可以对农民的精神生活进行解构的异质文化形式。因此直到
    20 世纪 80 年代末,农村都没能出现因精神生活荒漠化而体现出来的文化焦虑。它一直持续到 90 年代初乡镇企业的“突然消失”和“打工热”的兴起。




    ![](img/7e667f542e5175c06fc3833e30d0f27f_117_0.png)'
