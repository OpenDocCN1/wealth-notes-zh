- pgno: 55
  md: '《在“自由主义”姿态的背后》招致了自由主义学者更大的反击。在接卜来的持续不断的争论中，自由主义者和新左派双方的人员也已经被划定。在自由主义这一方，较成系统、主要在于“建构”理论而不是驳斥对手的是朱学勤的文章《1998：自由主义学理的言说》。这篇文章和朱学勤在争论中的积极态度，以及他的功力和名气使他被看成自由主义的主要代表。网上的许多“自由主义者”对他的崇拜，大抵和这有关。这篇文章第一次公开对自由主义进行言说，从而在久违之后，树起了自由主义的旗帜。从此，自由主义者似乎已告别了散兵游勇的言说时代，开始成系统地阐述自由主义理论。而朱学勤在这其中所起到的作用是巨大的。可以这样说，无论是参与和新左派的论战还是树起自由主义旗帜，他的名字都必须被写进历史。而本文不打算也无法对他的思想作一个总体性的评论。综观他的整个学术之路和所持的观点，有两条线是贯穿始终的：一是英美自由主义所崇奉的经验理性和改良观点，对自由的热衷和对平等的恐惧；再就是对制度建构的推崇和对文化批判的轻视。在聚焦了他在学界活跃的身影后，本文打算从这两方面入手，对其观点作出一些大致的分析、辩护并予以质疑。


