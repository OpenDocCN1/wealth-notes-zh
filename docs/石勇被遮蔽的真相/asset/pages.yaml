  md: '稣受难图在叹息、激动、庄严中被勾勒出来。的确，在原始资本主义被马克思斥为人间恶魔后，在它因导致经济危机而被“罗斯福新政”式的国家干预加以遏止后，一种温柔化的、不那么带着冷冰冰的杀气的福利国家形式成了当时西方世界的主流，而他对此提出了强烈的“抗议”。循着他的逻辑，不仅福利制度，就连国家干预都成了他打击的目标，更不用说计划经济了。然而一种野蛮的“自由资本主义”所遵循的弱肉强食的自然法则，在施用于人类社会时真的不用遵守社会的某种秩序，而只能遵循它的逻辑，像机器一样自律运转下去吗？


    事实正是如此：任何一种自由竞争只有一个成熟的市场里才可能真正地按其存在目的进行。而这个“成熟的市场”便已包含了法律、道德、国家行政等对竞争行为的约束和对竞争后果的某种纠正。这实际上也是保证自由竞争的基本条件。如果不对自由竞争进行规范并对其后果进行某种纠正，则其后果产生的反作用将造成一种对自由竞争构成威胁的社会环境，比如垄断的出现和极度的贫富悬殊造成的下层人民的购买力的缺乏，甚至经济危机以及社会动乱。这时，如果还在想让弱肉强食的竞争法则主导社会经济运行，一系列它的副产品，即社会问题将积蓄起足够的力量朝它抽心一击。“赢家通吃”的最终结果是赢家也将被吃掉。


    这是一个“哈耶克之套”。如果说“自由主义”以自由为标准，那么从自由的普适性上讲，自由主义应该创造一个人人平等的自由，而不只是一部分人将自己的自由建筑在大多数人不自由的基础上的环境。




