- pgno: 88
  md: '而刚刚过去的贵阳阳明精舍的蒋庆、陈明、康晓光、盛洪等人的“文化保守主义峰会”与关于“读经”的争论，已无可置疑地证明了“文化保守主义”的地位。我们甚至可以想象，因在文化层面上它囊括了包括“新左派”和“自由主义”等流派的某些属性，并切入了一个民族的确认其存在的深层根基，它将会得到越来越多的呼应。而富有讽刺意味的是，由五四一代开始的文化批判到现在对儒家文化已经“失语”，批判的对象置换了，由文化领域切入到了政治和经济领域，或者干脆是对西方流行的文化理论的分析与解释。“文化保守主义”在中国经济高速发展、综合国力日益增强的今天的活跃，难免让人牵强地想到西方的“文艺复兴”。


    “文化保守主义”背后自有一套它的理据。任何一种东西都不会是一个拥有单一属性的载体。这些属性被纳入一个共同的结构之中，但它们却具有不同的指令。将这些指令从这个东西里解析出来并渗透进同一领域，所得的结果将是不同的。虽然我们在言说时很难避免一种整体性的称谓，即非常容易仅仅从某一事物的某一内容和属性出发而对其进行判断，但它先在的语境已告诉了我们它的具体指涉。比如说儒家文化“吃人”，并非指它本身如此，而指的是它这个体系中的某些东西如此。如果没有这个先在的语境限制，那么推出“文化保守主义”要把这个“吃人”传统发扬光大下去显然是荒唐的。


    儒家文化本身就是一个拥有共同结构的由不同内容和属性组成的复杂的复合体。在这个复合体里既有“君君臣臣父父子子”等这些不合现代文明的东西，也有“仁义礼智信”等超越时空的价值。保任、守


