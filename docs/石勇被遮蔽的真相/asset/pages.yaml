  md: '# 陷阱：中国思想界三个思想流派的问题


    反观现今中国思想界，自 1998 年后作为学界和民间的主导性思想流派而“二水分流”的自由主义与新左派二分法已被打破。2004 年文化保守主义的“言说”在获得广泛的支持后已开始摆脱边缘地位，而自由主义和新左派本身也随着政治社会环境的剧烈变迁而日渐分化，“三足鼎立”的格局已经形成。


    任何一种理论都具有放大其能指的内在逻辑。追求话语权力的指令更容易使它侵入许多它或许无法具有解释和规范力的领域，将许多东西席卷而去。而剧烈的政治社会变迁不断地为思想流派的裂变提供土壤，使无法跟上现实而改变其语境的思想流派异化或遭到抛弃。因此，无法正视自身的限度和极端地放大自身的能指而违反其理论体系的内在要求都有可能导致某个思想流派的自我解构和来自外部的否定。这样的陷阱是不能不引起重视的。


    # 一、文化保守主义


    文化保守主义长期以来举步维艰。由于自五四以来中国主流学界将中国失败、腐烂的账最终算在了中国传统文化，特别是儒家文化身上，以保住、守住儒家文化那些有价值的东西，并力图用它们来建构中国人的生命和意义系统为主要特征的文化保守主义长期以来一直处于边缘地位。虽然这种历史的原因只有返回到当初的特定情境中才能够客观地进行分析，


    ![](img/7e667f542e5175c06fc3833e30d0f27f_124_0.png)'
  merge: -1
  img_proc: true
- pgno: 125
  md: '但它的破坏力还是使文化保守主义背负了太多的历史包袱而备受不公正的责难。1994年陈明创办《原道》辑刊，虽然一直在以可敬的姿态坚持，但还是尝尽孤独，并先后换多家出版社。


    这一状况或许到2004年才算形式上的终结。文化保守主义引起整个社会的关注和支持，使反对者都不得不重视的几大事件意味着它已开始摆脱边缘地位。在西化已很严重的情况下文化保守主义的凝聚力表明了中国人维护自身文化传统的自觉意识。


    值得指出的是，在中国目前影响最大的三个思想流派中，自由主义与新左派的论域有相对较多的重合面，这似乎决定了它们的“对立”关系。而文化保守主义的论域与自由主义和新左派的重合面都不多，这使它和任何一派都可以拥有某些共同的语言。事实上，虽然它可以与自由主义和新左派相提并论，但主要并不是处于同一个层面上。它如其领军人物之一陈明所说的，是一个可以将其他思想流派包容在内的“平台”。《原道》十周年会议会聚了自由主义和新左派的一些代表人物，像著名的学者刘军宁和韩德强都列身其间，这本身证明了文化保守主义的包容性和平台性质。无论如何，作为一个中国人，对“文化身份”的认同是超越于政治经济立场与观点分野的共同需要的。


    但也正是这一点，说明了文化保守主义所获得的支持更多的是基于“文化”而非“政治”理由。一方面传统文化的失落导致的道德堕落与精神沦丧让人忧心忡忡，而那些西方的文化形式徒具表皮，无法切入中国人的生命本体而对此徒呼奈何。在这种情况下






