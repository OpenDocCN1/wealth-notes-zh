  md: '罚。这种奖励和惩罚作为一种“超我”，作用于人的精神世界之中，经过长期的重复性实践，使恐惧内化入人的本能结构之中而操纵了人。这种恐惧使人自动地将他的反社会性和统治秩序内容进行压抑。


    每个人都生存在特定的社会环境里。我们能否看穿这个世界的一些被遮蔽的真相，关键看的是我们以何种感觉和认知模式进行审视、观察、思考和判断，以及我们有没有批判意识和反思能力。然而无论如何，我们的觉知形式构成了我们认识的先决条件，正如弗洛姆对此曾精辟分析过的：“人的……任何经验要想被觉知到，它就必须在用来组织意识思维的范畴中得到理解。某些范畴，例如时间和空间，可能是普遍一致的，而且可能构成了一切人共同的知觉范畴。而另一些范畴，例如因果关系，可能对许多人（但却并不是对一切人）自觉的知觉形式是有效的……但不管怎样，经验要想被觉知到，只能是在它能够凭借一个概念系统及其范畴而得到理解、得到关联并变得合理有序的条件下才能办到。这个概念系统本身乃是社会进化的结果。每一个社会都通过其自身的生存实践，通过种种关系模式、情感模式和理解模式而形成一个范畴系统并以此决定其觉知形式。”$^{[1]}$
    决定我们的觉知形式的便是我们所操持的语言、逻辑、社会禁忌，以及文化精神、心理特征等等。而当这些觉知形式皆内含统治者的指令，具有了意识形态的功能的时候，能保证我们所看到的不是那个由意识形态编码的世界，而是那个真实的世界吗？被遮蔽的真实，以何种方式来还原，并以何种方式进行体验我们才能看到它的存在？我们能拒斥这样的觉知形式吗？纵然




