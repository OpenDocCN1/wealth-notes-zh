  md: '# 另一个世界的声音


    上帝的容颜


    是否曾在阴云密布的门扃中显现？


    而耶路撒冷


    是否只在撒旦黑暗的磨坊中建造出来？


    ——威廉•布莱克


    2002年4月，《资本主义黑皮书——市场经济的终曲》的主要翻译者钱敏汝以冷静得让人窒息的话语写道：“20世纪末，正当资本主义的缤纷色彩跨越了世界地图上越来越多的疆域的时候，德国的现代化和危机理论研究者罗伯特•库尔茨以《资本主义黑皮书——市场经济的终曲》这一著述提供了一个高倍数显微镜，让我们看到深嵌在五颜六色之中的霉点和黑斑。在罗伯特•库尔茨的笔下，这些霉点和黑斑不仅仅是资本主义在过去几个世纪里残酷发迹的血腥阴影的残余，而且也是其不可治愈的隐患的活性病源。”


    我马上想做进一步的补充：罗伯特•库尔茨所提供的高倍数显微镜让我们穿过“国有社会主义”（国家资本主义）与资本主义表面对立的假象而看到密布在资本主义机体里的病齿。罗伯特•库尔茨对几百年资本主义发迹史和罪恶史的生动描述浓缩成了我们所置身的这个无比堕落的世界。发自另一个世界的声音'
