  md: '# 什么语境下的中国哲学“合法性危机”


    黎鸣先生曾厉声疾呼：“西方哲学死了！”这有些耸人听闻了。一种建立在主客体的二元对立范式基础上的哲学话语走向分裂的极端并不能表明它的“终结”，而只能表明这种哲学自身的某个或多个维度的严重越位。对此的“消解”只能是重新界定这种哲学话语的各个维度的关系。如果说黑格尔的“异化规律”从哲学的高度对事物存在和发展的秘密进行了破译，那么，即使“理性主义”作恶多端，我们也只能从“价值理性”与“工具理性”的分裂以及后者所获得的它不应该具有的功能上进行纠正，换言之，对它的功能重新进行“资格论证”。


    在这种意义上，从来不会存在早先的季羡林、现在的黎鸣，以及许多有志于中国文化复兴的有识之士所预料或言说的，仅仅因为西方哲学、西方文化所导致的一战、二战、环境污染、人与人之间日益异化等等负面因素，就自行论证了中国哲学、中国文化在
    21 世纪复兴的可能性和它应该复兴的合法性。作为一种建构一个民族的精神共同体、一个精神家园，从而塑造国民健全的人格的民族文化，中国传统文化复兴的合法性基础不在于西方哲学的危机，而在于它自身存在的价值依据的证明，它对于一个无论如何都表现出最明显的文化属性的民族生存和发展的意义，以及它在当代文化言说中的缺位。因此，从文化复兴的角度上讲，西方哲学的命运只能成为我们的哲学文化阐释的参照系。追问中




