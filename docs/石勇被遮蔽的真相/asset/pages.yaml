  md: '# 三


    在“荒岛”上所进行的这种“自然状态”下的分配似乎大功告成了，这就是我们津津乐道的“起点平等”。但这种平等是相当短暂的。每个人拥有不同的资源（虽然是通过了嫉妒检验的平等的资源），这些资源可以创造出不同的价值，那么，每个人给别人造成的机会成本就不一样了。而且每个人不是一个模子里造出来的，他们有不同的爱好和不同的技能，这些因素都有可能让他们从同一起点出发，迅速拉开差距。一句话，拍卖完成后人们就受到了各种偶然或必然的因素的支配，如果他们卷入生产和交易，那么，可以预想只要差距一拉开嫉妒检验就会失效，其结果就会出现可以让资源平等分配毁于一旦的社会不平等。而在此基础上再次进行的不是人为的，而是由市场调节的资源再分配，这只能加重不平等。


    必须考虑的是：在这个时候，还存在一个“残疾人”和“运气”的问题：选择了某一种资源或生活，就意味着要承担一定的风险，而个人的先天“残疾”就限制了他的资源的意义。那么，如何使倒霉者和“残疾人”不受这种后天和先天的“运气”影响呢？德沃金想到了“保险”，即将“无情的运气”与“选择的运气”结合起来，从而使选择本身变成了一场赌博，如果处境不妙，那么保险就会给予补偿，从而，一个人的处境，仍然没有脱离资源平等的路径。这样，即使出现一些不平等，在德沃金看来，也没有理由反对：每一个人都必须为他的生活选择承担成本，一个不“赌博”的人，也即放弃了任何获益的机会，这种放弃导致的少得是没'
