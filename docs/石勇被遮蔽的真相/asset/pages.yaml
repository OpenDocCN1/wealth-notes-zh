  md: '验，他对自己的隔离和日益疏远，他对他人感到陌生，他产生神经病，他变得虚伪无耻，他斩断与自然相连的根，在很大程度上正是遭到文明压抑的结果。这种压抑开始也许只是一种马尔库塞意义上的“基本压抑”，即为了文明的存在而对人的能威胁到社会共同生活的动物性进行压抑，但由于权力的作用，压抑的惯性延伸进了人性的领域之中。不客气地说，压抑的日本本是为了维护对每个人的生存都有利的文明秩序，但在权力的作用下，不仅那些能破坏文明秩序的本能欲望被压抑，连那些对每一个人都普遍有效的、对人的自由和尊严有极大价值的东西都一起被压抑掉了。任何一个社会为了它的生存确实需要人作出一定的牺牲，但任何一个以权力压迫和意识形态奴役为特征的统治型社会必然是由社会既得利益集团控制的，他们为了他们的统治必然会以自己的意志冒充整个社会的诉求并运用得天独厚的控制手段对被统治者的反抗意识进行消解。这就逻辑地导出这样一个结果：统治的基础不仅在于社会秩序的稳⺌，更在于人必然认同这个统治秩序，它必须将它的意志变成人的判断以切进它的存在的合法性和合理性之中。于是那些威胁到统治本身的人的自发思考、人的批判甚至反抗意识、人最本原的对世界的直观体验都必须受到压抑，必须利用意识形态来编造出另一个世界，必须造出一套与这个意识形态的世界对应的认知和理解模式。这样人的存在属性便已被意识形态所规划，他只能透过这个意识形态的世界理解世界和确认自身。这就是马尔库塞所揭露的“额外压抑”。它使得人的存在维度“单向度化”，各种与他，与普遍性的




