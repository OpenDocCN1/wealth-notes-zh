  md: '上搔痒”的讽刺实只能称为浅薄之极。文化的本意便是对人的“规划”和“改造”。“自然人”不存在文化属性，而“社会人”则除了自然属性之外，更多地具有一种社会属性，而这种社会属性实质上是文化属性。因此，大致来说，一般有什么样的文化便能造就出什么样的人（尽管这种人与文化的作用是相互的），人与人之间的区别主要就是文化的区别。从“自然”走向“社会”的人其意识结构、精神结构可以说是一张“白纸”，你给他以什么样的“文化塑造”，他便能成为什么样的人。这也就等于说，他的思考材料、思维方式、行为反应、精神形态、人格结构等都必须依靠文化来支撑，或者说它们实质上是文化的另一种表达，可以被纳入统治一个社会的文化机制之中。因此，极端地说，驱动人思考和行动的指令便是他所接受的文化的指令，他对文化的认同是本能的（实际上这也是他的一种本能），能够操纵文化便也等于操纵了人。因此，文化的一大特征便是具有对人“洗脑”的功能：要么通过社会化在人的大脑里注入各种指令，要么通过隐含价值判断和统治强力的威胁的宣传灌输将人原本具有的内容洗得
