  img_proc: true
- pgno: 222
  md: '# 第三编 显现的他者


    资源的人的特权，到大多数人的权利得到真正保护的历史，正如古希腊时代的“民主”只属于成年自由民，而不属于奴隶妇女，直到现在这种可以决定统治合法性与否的基本人权才属于民主国家的所有成年公民一样。它所折射的不平等首先是自由的不平等，是对以普遍主义面目出现的自由主义体系的一个通过对平等加以否定的说明。这是一个奇怪的逻辑，它以殖民主义的血腥、血汗工厂的存在，以绝大多数人的饥寒交迫和少数人的穷奢极侈的对比激起了马克思主义的强烈抗议。


    历史的冷酷一直在拒绝乌托邦的逻辑，虽然从不拒绝乌托邦的理想，因为这是人类不灭的理想。两个“对手”的博弈只有让人类的共同理想渗入自己的逻辑体系才能走出“囚徒困境”。现实的危机使自由主义逐渐学会了对所有人的平等加以关切。事实上，只要承认民主权利在一个政治共同体里构成了它的合法性的严厉前提，自由与平等就密不可分，对自由与平等组成一个和谐结构的人为割裂、从理论上对它们的关系进行肢解的企图就无法让人容忍。这样的“焦虑”使自由主义在
    20 世纪 70 年代后出现了向它的道德基础的回归。它最集中地表现在德沃金以下的言辞之中：自由主义离不开平等，而平等不仅是经济权利的基础，而且也是政治权利的基础，这些更吸引人的结论，才是自由主义的真实结果。


    这就是罗尔斯和德沃金推崇康德的最终秘密：以普遍主义的形式出现的自由主义，必须真正具有普遍主义的特征，并且通过实践而得到论证。而从普遍主义的角度上讲，只有所有人都享有自由才真正符合自'
  merge: -1
  img_proc: true
- pgno: 223
  md: '由主义的精神，也即在自由的权力上，所有的人都是平等的。这种平等的自由的权力决定了：1. 所有人在政治上都必须 在自由的基础上拥有决定自己命运，以及自己所置身的政治共同体命运的权利，而民主制度正可以保证这种自由，并使民主和自由这两项基本人权得到捍卫；2.
    在一个社会各阶层所掌握的资源较为悬殊的社会里，占了较多资源的人必然比资源较少甚至没有什么资源的人有更大的政治影响力和控制力，在这样的情况下，不仅所制定的公共政策有利于他们，而且他们通过对资源较少者的政治影响力的相对剥夺实际上已经损及、降低了后者的自由价值，由此伤害了自由权力在政治上和社会上的平等。因此，从普遍主义的视角讲，自由也意味着平等，没有平等，自由便只属于资源较多者所垄断的东西。


    一


    不管遭受了来自左冀和右冀的多少攻击，罗尔斯《正义论》的巨大影响力至少已经表明：平等主义自由主义已经能够有能力从理论上对自由和平等加以平衡，并且这种平衡不是两个相互冲突的价值理念的妥协，而是通过分析，使本质上并不冲突的它们在尊重对方的价值时可以在价值上证明自身。这种突破使传统的左右分野的逻辑都失效了。紧跟罗尔斯之后，德沃金的权利理论，特别是专论平等问题的《至上的美德——平等的理论与实践》将这种论证推进了一大步，并试图把它与政治实践结合起来。或许是受罗尔斯“原初状态”理论虚构的启发，通过批判罗尔斯的一些不能成立的假设，德沃金为论证他的资源平等理论'
