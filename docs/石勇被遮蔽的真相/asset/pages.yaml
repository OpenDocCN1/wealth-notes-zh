  md: '# 被遮蔽的真相


    义上讲，“社会”是所有人的资源的最终来源，人们的资源不同，实际上就是通过自己相对于他人的机会成本对于这一共同的资源的瓜分。不平等首先是分配“社会”这一总资源的机会、力量的不平等。


    这里又有两层意思。一是“社会”是所有的人组成的，既然离开了人的构成社会就得土崩瓦解，那么不管他是穷人、富人，是老人还是孩子，他们的存在都是构成这一总资源的最基本单位，在这方面他们对于这一总资源的贡献是完全相等的。也就是说，作为最基本的组成单位，他们在“无知之幕”所遮蔽的情况下，在“荒岛”里，对于这个总资源都应该拥有完全相等的份额。因此，资源平等理论在“荒岛”上已经成立。第二，在这种最基本的贡献的基础上，只要分配结束而让人们去各自追求自己的“成功”，那么不仅“社会”这一总资源的数量已经发生变化，每一个人对于这一总资源的“贡献”，以及他对这一总资源的获取份额也发生了变化。在这个时候，“无知之幕”已经揭开了，“荒岛”也变成了一个政治共同体，一个国家。在这个时候，“社会”这一总资源的份额可以分解为两个部分：作为构成社会的基本单位的每个人的基本贡献；他的能力、努力等各种因素的创造。而每个人的所获则与此不同，它们可以分解为三个部分：他作为构成社会的最基本单位应获的与所有人都相同的份额；他通过能力、努力等比他人多付出的成本而在公平的意义
