  md: '疯狂”的吼声则以超越时空的形式在整个世界回响。在世界各地借助于强大的权力与资本的合谋而碾碎一切资本主义机器的内在指令所具有的不可抗拒的规范权力只因政治经济权力的保护才能够避免人性的人性内在法则的消解。但是，它的滚雪球式的体系扩张注定会在它的不可避免的雪崩到来之前就同时无情地遭受到良知和理论的鞭挞。


    与马克思、伯尔、法兰克福学派思想家一样是德国人的罗伯特·库尔茨的批判正像我们站在这个文明与野蛮已经交融而无法泾渭分明地作出判断的世界上对于现实无奈的审视和对于历史沉痛的回眸。他从资本主义的发迹史到现在资本主义在全球深入到了社会生活的方方面面的全面审视使他的历史分析变成了一本资本主义对自己的罪行无法抵赖的控诉状。这个以抨击在全世界所向披靡的资本主义制度和市场经济体制而闻名并一直在资本主义的心脏战斗的人物挖出了由“国有社会主义”和资本主义所共享的现代性背后所隐含的建立在抽象劳动法则和资本内在逻辑基础之上的祸根，并将对它们的分析变成了迄今为止资本主义的疯狂和“国有社会主义”失败的证据。正如马尔库塞运用精神分析方法所提出的“本能革命”那样，他对资本的内在逻辑对于人的无意识指令的重新编码并以一种固定的模式变成人们在这个基础之上的所有可能性选择的揭露打开了一个进入资本主义成功的密室的入口。这种深刻的洞察使其批判超越于意识形态之上而达至峰巅。


