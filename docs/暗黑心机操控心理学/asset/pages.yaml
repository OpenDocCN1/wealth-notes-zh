  md: '灑寫一封百頁情書、驚天動地的告白台詞，倒不如請兩人共同認識的朋友協助，透過友人婉轉表現愛意，這麼做不僅含蓄，也比較能夠抓住對方的心。


    ❏ 一開始先批評「其實他很普通」、「人很小氣、都不會提供什麼資訊」、「根本不會說話，不會看氣氛」等等，並且之後再說出一樣的稱讚。


    # 有效的稱讚法


    美國的心理學家阿隆索 (Elliot Aronson) 和林德 (Darryn E. Linder)，曾經共同執行一個統計調查計畫。


    他們觀察人在偶然聽見和自己有關的八卦時，會對談論自己的人抱有什麼樣的印象。


    在這個調查中，阿隆索和林德總共特別安排了下面四種類型的八卦──


    ❏ 從頭到尾沒改變地一直稱讚對方「他是很溫柔的人」、「很親切」、「是大人物」之類的好話。


    > 豆知識

    溫莎效應 (Windsor Effect)

    透過第三者聽來的情報或訊息，會比從當事人當面說出，令人覺得可信度更高，是一種常在行銷中應用到的心理準則。'
