    # 問得越清楚，越容易落入圈套


    小心謹慎也容易受騙？


    你生活周遭應該有這種人：不管做任何事，要是不做完整的事前調查，絕不善罷甘休。舉例來說，即使只是買一臺電腦，他們也會充滿熱忱地收集產品目錄和雜誌，研究規格，還會親自跑好幾趟3C賣場實際試用。


    這種類型的人小心謹慎，乍看之下好像不會輕易被詐騙，但事實上，這種人才容易受騙。


    他們好奇心旺盛，不深入了了解絕不停手，不會輕易鴻掉推銷人員提供的種種資訊，會非常實力地閱讀。這種習慣就正中詐騙分子的下懷，只要對方願意聽他們說話，詐騙成功的機會也會隨之提高。


    好奇心殺死一隻貓


    好奇心旺盛的人，也很容易被新話題吸引，他們會興致勃勃地聆聽，以至於不知不覺地深陷其中。


    不僅如此，這種類型的人對自己的分析能力和收集的資訊往往充滿自信，所以更有可能自掘墳墓，落入詐騙圈套。相反地，不太在意坊間流行的最新情報，只依循自己喜好過生活的人，由於對新話題本身也不怎麼感興趣，反而很難被詐騙分子騙上勾。


