  md: '# 前言


    毒草或良藥，在於你怎麼用


    ![](img/2018e93cfe67e2b8480702f5a6ffc9fe_3_0.png)


    毒草或良藥，在於你怎麼用


    有一種人，他們生來就是人生勝利組，無論求學或求職都一路順遂；找到所愛的人一同組成幸福美满的家庭，過著人人稱羨的生活。然而，這樣的人卻也容易街頭推銷員、新興宗教、通靈騙子等詐欺犯給騙上鉤。另外還有一種人，他們在一家公司上班，主管信誓旦旦地保證：『絕對不會安排調職！』他們也信以為真。沒想到某一天突然接到命令，立刻被調往偏遠的鄉下地方而求助無門，最後只能悲嘆：『被公司騙慘了！』上述這些例子，都不能單從表面來評斷：『誰叫他們人有機可趁，這都是自作自受啊！』我們應該如何客觀地分析外界的資訊，培養出無論'
  merge: -1
  img_proc: true
- pgno: 4
  md: '遇到什麼情況，都能夠保持疑慮、不輕易被欺騙的思考方式呢？


    透過本書，我想從心理學的觀點，一一列舉那些自認立場堅定、不隨風起舞以及擇善固執的人，卻仍受騙的各種案例；同時，我也會介紹詐騙惡徒、商業話術如何利用人類心理，設下陷阱請君入甕的例子。


    我把這樣的心理學觀點稱之為「暗黑心機操控心理學」，這個詞或許讓有些讀者覺得是教人為惡，多少讓人心生抵觸。不過，本書介紹這些說謊、欺騙的手法，是為了不讓你陷入「心靈陷阱」，而不是教導讀者懷著惡意來欺騙別人。


    現代社會充斥著詐騙陷阱，往往能巧妙攫住人性弱點，本書的目的就是希望各位讀者能看破這些技巧，保護自己，不受欺騙。另一方面，若能聰明運用人類心理'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# 前言


    毒草或良藥，在於你怎麼用


    來操縱他人內心的手法，只要用在正確的地方，也能有效改善溝通，使人際關係更加順遂。除此之外，磨練說客套話、表面話、小謊話，也可以幫助我們減輕日常壓力，讓生活過得更順利。


    無論是什麼樣的知識，都有可能因為「使用方法」的差異，從劇毒轉身一變為良藥。我誠摯希望各位將本書當作詐欺術解套範本，甚至能成為人際關係的潤滑油。


    樺 旦純'
