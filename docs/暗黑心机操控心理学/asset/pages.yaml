- pgno: 144
  md: '+   ① 從頭批評到尾。


    +   ④ 一開始先稱讚，之後再批評。


    # 棍子與紅蘿蔔，也講究順序


    這四種類型的八卦之中，讓當事人印象最差的就是 ④ 。


    從實驗結果得知，先稍微稱讚幾句之後，再一連串給予批評，會嚴重損害一個人的自尊心，所以帶來的傷害最大。


    另一方面，給人印象最好的八卦則是 ② 。也就是說，比起從頭一路稱讚到尾，先批評之後再稱讚的行為，比較能讓人虛心接納，甚至留下好印象。


    這是因為在一般人的認知中，先講一些批評的行為，可以為接下來的說話內容相對帶來客觀的感受，就不會給人「客套話」、「敷衍」的感覺。


    同時這麼做的效用也會進一步加強稱讚的部分，如此的做法不僅可以觸動人的自尊心，更能夠滿足虛榮感。


    不過，我在這裡也要特別提醒各位一件事，當人們湊在一起大伙兒分享八卦之時，這個聊天行為的用意本身就不是要認真地討論某件事，而只不過彼此解悶或吐苦水罷了。


    通常所謂的八卦不過就是說人閒話、宣洩偏頗的評價、看法或觀念，到了最後，可能就只有開頭的批評部分被傳開來，甚至加油添醋，不僅無法達到原先拉攏人心的目的，還把對方的心推得更遠了。


    因此要使用「先批評，後稱讚」的戰略時，你所批評的內容最好是些一無關緊要的小事會比較好。'
