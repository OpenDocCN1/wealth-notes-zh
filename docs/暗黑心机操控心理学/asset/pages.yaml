  md: '# 12


    # 間接稱讚最得人心


    # 讚美當面說，不如別人轉達更受用


    當我們與朋友有約時，對方忽然話題一轉，提起一件事：「前陣子和XX剛好碰面，我們聊了一些最近發生的事，然後他不停稱讚你，說你很棒耶！」


    人們聽到這些轉述時，想必當下都會覺得很高興吧。無論是誰都會因為受到別人的稱讚，打從心底感到高興、充滿自信。只不過，即使講的都是同樣讚美的話，假如是由當事人直接傳達給對方時，卻會讓人忍不住地懷疑或許只是「客套話」罷了。


    相反地，若是從不相關的第三者間接聽到同樣的稱讚，反而讓人覺得很真實，可信度相當高，滿意的心情加倍。


    艾琳·羅馬諾內斯伯爵夫人（Aime Grillau, Countess of Romanotes），在她的自傳式間諜小說《去跳舞的間諜》（The Spy Who
    Dancing、暫譯）中，其中有這麼一段精彩話：「不管在什麼時候，第三者的稱讚永遠都是最有效的，千萬別忘記這個準則，總有一天肯定能派上用場。」


    心理學中所謂的「溫莎效應」，正是從這段經典的台詞而來。


    人們從第三者口中間接聽來的話，永遠比當事人直接說出口還要來得有效許多，這就是「溫莎效應」。


    同樣的道理，如果你實在很想向喜歡的人表達自己心意時，與其費盡心思，大費周章洋洋灑灑'
