  md: '# 鬆卸戒心的「輕接觸」


    美國的選戰戰略 3 S，就是握手（S h a k eH a n d s ）、笑容（S m i l e ）、簽名（S i g ）。用握手來表達間候的作法──也就是輕度的身體接觸，就能卸下對方的警戒心，尤其平時沒有這種習慣的人，效果會更顯著。


    實驗安排受試者以三個方法和某位人物見面――(1)矇著眼，不握手只交談；(2)不交談也不握手，看著對方；(3)矇著眼握手，不交談。接著詢問受試者對這位人物的印象時，相較於(1)有距離感、很形式化，以及(2)很冷淡、很高傲等多數負面評價；(3)則是「充滿溫情」、「值得信賴」、「很成熟」等正面評價，而且將近半數的人都希望能和這號人物再次見面。


    # 牢牢「握住」人心


    你可別小看握手，這可是唯一能觸摸初次見面對象的方法。此外，握手時手部的狀態，也能清楚顯現對方的心理。


    當對方的手心潮溼，顯然是處於不穩定的狀態，內心相當緊張；用力回握的人，是代表積極且具行動力；而回握力氣微弱的人，則代表個性內向。


    握手時盯著對方眼睛，是試圖站在優勢立場的心理表現；至於還沒經人介紹就想跟人認識的人握手，則是顯現出自我表現欲。'
