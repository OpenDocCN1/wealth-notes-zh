  md: '# 後記


    # 萬般皆由心


    由地獄到天堂的分界線是人世凡間，這一關叫「心關」，萬般皆由心，通過「心關」的考驗，自能到達彼岸。


    股市是修煉人性的道場，任何一個能夠縱橫股市的投資人，都是歷經千錘百鍊，絕對沒有一步登天的神蹤。


    「技術分析」只是進入股市的基本知識，也是操盤的工具，僅有工具，並不足以自行，在具備技術分析的基礎之後，必須要在實戰中培養下面的5項能力，才能站穩腳步，成為股市長期贏家：


    # 能力1


    技術分析選好股的能力。


    # 能力2


    等待進場，守株待兔的能力。'
  merge: -1
  img_proc: true
- pgno: 326
  md: '# 能力3


    徹底執行停損的能力


    # 能力4


    紀律操作，獲利入袋的能力。


    # 能力5


    不貪不懼穩健獲利的能力


    以上5項能力的訓練，需要自我要求，堅持修煉，等到時機成熟，自然水到渠成。


    自從2011年5月我的第一本書出版之後，非常感謝這些年來讀者對我的鞭策及支持，雖然我把對股市所知道的一些淺學心得，盡心盡力分享給一般投資人（散戶大眾），但因個人才疏學淺，總有未全之處，尚祈讀者專家不吝指教。'
