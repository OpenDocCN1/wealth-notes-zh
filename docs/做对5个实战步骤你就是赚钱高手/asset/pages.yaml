  md: '# 步驟5

    停利


    俗話說：會買股票是徒弟，會賣股票才是師傅。經過漫長的選股，等待進場，投入資金，買進股票，再忍受可能停損的煎熬，終於如願上漲，開始嗅到賺錢的喜悅，最後的一里路，就是要何時停利賣出，收割豐碩的果實。


