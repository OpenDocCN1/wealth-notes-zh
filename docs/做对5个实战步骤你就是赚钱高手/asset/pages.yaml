- pgno: 47
  md: '# 投機賺價差


    # ○ 買股票的目的


    +   1. 不打算長期持有或不以獲取股息股利為目的。

    2. 在上漲或下跌發動時進場，賺取一段時期股價上漲或下跌的價差利潤。

    3. 走勢不理想或跌破進場時設定的停損，立刻出場。

    4. 基本面做參考，以技術面為操作依據，任何價位，只要有上漲或下跌的機會，都可以進場。


    # ○ 選股的標的


    全部上市上櫃的股票，只要符合投機的條件（技術分析看機會），基本上都是選股的標的。


    # ○ 選股的方法


    +   1. 以技術面為主

    利用走勢圖的波浪型態、K線、均線、切線、成交量、各種指標的技術分析數據，推測未來價格的轉折變動及趨勢的改變，以選擇股票。預測短期內股價漲跌趨勢，可以掌握具體的買賣時機，以股價本身的變動為主軸。


    +   2. 以投機獲利為主

    選擇有題材、當下主流、有轉 Cutting 的中小型股票，或者是有主力或法人介入操作的股票，以及技術線型好的強勢股。'
