- pgno: 316
  md: '# Part 3


    # 贏家策略


    本書在Part 2詳細介紹了買賣股票操作流程的5大步驟，讀者按照每個步驟認真執行，假以時日就能開始在股市賺錢。


    但是想要賺大錢，長期當贏家，單靠技術分析無法辦到。做股票不求每場戰役都贏，而是要贏得整個戰爭。學會贏家策略，才能成為股市贏家，永保甜美豐碩的果實。'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# Part 3 ▶贏家策略


    # 第1章


    # 順勢而為


    > 孫子兵法第1章《始計》第4條：

    計利以聚，乃為之勢，以佐其外。勢者，因利而制權也。


    用兵取勝的關鍵，除了要有正確的策略，因勢利導更讓事半功倍。因此，作戰是一種藝術，要隨時根據對自己最有利的條件，靈活機動，採取相應的權宜措施。


    股票市場變化快速，任何策略都必須順勢而為，永遠要在對自己有利的條件下去投資，同時要面對市場的變化隨機應變，千萬不能固守陳規，當市場方向（趨勢）改變，即使當初有再多看好的理由，都必須接受當下的方向，採取對自己最有利的行動。


    # 隨勢強弱 調整持股


    資金的控管絕非一成不變，勢強時可加碼，放大資金投入的成數，勢弱時則要審時度勢，減碼因應，如此在強勢上漲時可以大賺，轉弱時可以少賠。觀察波浪型態，只要相信它的走勢，調整策略去順應它，自然能夠趨吉避凶，大賺小賠。'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 第2章


    # 謀定後動


    孫子兵法第3章《謀攻》第7條：

    知勝有五：知可以戰與不可以戰者勝。識眾寡之用者，勝。上下同欲者，勝。以虞待不虞者，勝。將能而君不御者，勝。


    作戰要預知能夠勝利的情況，要先分析敵我條件，確認可以戰或不可以戰，如果條件不足，戰勝機率不高，不可求戰，否則萬一屈居劣勢，不但難以戰勝，反而易失敗折損。


    在商場上，與對手競爭，必須先衡量可戰或不可戰，否則未獲其利先遭其害，國際大企業同行之間的競爭更是如此。


    操作股票，更要小心謹慎，進場前必須充研判可買或不可買，成功的勝率如何？如果不符合進場條件、趨勢不明，必須戒急用忍。


    # 謀定而後動


    用兵之道，必須「謀而後戰」，戰前要算計自己的取勝條件，取勝的條件多，然後再出兵，才有獲勝的可能；反之容易失敗，僅憑匹夫之勇，毫無算計謀略就出兵，必遭戰敗。


    股票市場，更勝兵家爭戰，爾虞我詐，刃不見血，慘烈狀況'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# Part 3 ▷贏家策略


    不亞於商場上的競爭，因此沒有戰勝的準備及算計，絕對不要輕易把自己辛苦賺來的金錢投入，否則必然賠錢，不可不慎！


    # 進場前要研判什麼？


    毫無準備就下場，無法避免賠錢的命運，進場前要研判以下4點：


    # 研判1 這檔股票的「勝率」大不大？


    操作股票沒有百分之百的賺錢方程式，但有賺錢的勝率。贏面不大的戰爭，當然不要白白去犧牲（去賠錢）。就短線做多而言，日線多頭架構完成（頭頭高、底底高）趨勢確認，加上均線3線（MA5、MA10、MA20）多頭排列向上，這時順勢做多，成功賺錢的「勝率」大，賠錢停損的機率小。換句話說，不符合這樣條件的股票去做多，結果會剛好相反。


    # 研判2 這檔股票的「獲利率」高不高？


    買進的股票有多少可能的獲利空間，也要預估好，投資人不可能買進所有「勝率」大的股票，所以要選擇獲利空間較大的股票。獲利空間的大小，可以在日線看短線的壓力，在週線看中長線的壓力。'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# 研判3  預先估算資金分配


    準備進場買股票，要用多少資金操作？如果停損會賠多少資金？能否承擔這些風險？


    # 研判4  專注基本面或技術面


    如果投入一檔要長線操作的股票，當然要看基本面，如果只是在做短線的價差，那麼專注技術面就可以了。


    ![](img/eba4f38becd57965eb8bb34492948440_320_0.png)


    ①鴻準（2354）2003/6/5，「頭頭高、底底高」多頭架構完成，多頭趨勢確認，同時均級4線多排向上，大量長紅K線上漲，進場「勝率」很高，「獲利率」也很高。


