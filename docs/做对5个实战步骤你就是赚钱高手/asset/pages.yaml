  md: '# 用對指標 如虎添翼


    市場上還有許多指標，以市場魁值經驗，設定固定參數，反應當下市場的狀況。其中有一些是經過相當繁複的數學計算而來，一般散戶沒有必要去搞懂，只要了解指標的特性即可。善用指標，配合趨勢走向，就可以提高選股進場的成功機率。


    最常用的如MACD、RSI、KD等，只要精通1～2個指標，純熟搭配運用，就能掌握股價變化，在投資上具有加分的功效。


    ![](img/eba4f38becd57965eb8bb34492948440_22_0.png)


    +   ① KD指標在低檔黃金交叉向上，對應上面走勢圖，股價開始上漲。


    +   ② KD指標在高檔死亡交叉向下，對應上面走勢圖，股價開始下跌。


    +   ③ 股價連續上漲，KD指標在80之上，表示超買過熱，當上面股價出現下跌黑K線時，開始回檔修正。


    +   ④ 上面走勢圖的高點越來越高，可是對應下面的KD指標卻是高點越來越低（紅線轉折高點），這是指標出現高檔背離現象，走勢容易做頭，後續走勢轉为空頭。


    資料來源：富邦e01電子交易系統'
