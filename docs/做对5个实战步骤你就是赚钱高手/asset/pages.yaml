- pgno: 286
  md: '# 第1章


    # 停利的基本觀念


    俗 話說：「會買股票是徒弟，會賣股票才是師傅。」經過學習，一般人會曉得如何挑選股票，但通常沒有停利的規畫。換句話說，懂得買進，而不懂得賣出，只會看著股價上漲又下跌，或者抓到一支會漲的股票，但是漲一點點就賣掉，該賺的大錢沒賺到。


    股票賣出換成現金，結算有獲利，才是真正賺錢。沒有賣出前，股價隨時都在上上下下，如何拿捏該賣出的價格，的確不容易，賣得太早只能賺到一點小錢，該賣沒賣，股價又可能快速回跌，反而賠錢。


    如何賣出股票是獲利的關鍵，停利是每次交易的最後一個動作，如何劃下完美的句點，讓辛苦的付出有代價，是散戶必學的重要功夫。


    停利要有以下的正確觀念，否則永遠會琢磨不定，造成該賣沒賣，不該賣卻賣的情況：'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# 觀念1


    股價漲多會拉回，有獲利賣壓、解套賣壓、大戶調節賣壓、洗盤賣壓，因此，除非是飆股，否則即使是在上漲多頭，也是漲一段、回跌一段或盤整一段。


    # 觀念2


    切記！股票操作過程中，停利與該股的基本面無關，賣出的決策取決於價格走勢及成交量變化（見右頁的「大立光日線圖」）。


    # 觀念3


    操作股票時，好的進場點是成功的一半，好的停利賣出是成功的另一半。


    # 觀念4


    股價的起漲與起跌，不是個人能夠掌控，永遠不要想買在最低點，賣在最高點。想賣出時，往往因為覺得還有高點，而錯失相對最佳高點，反而下跌到低點。


    在操作中，達到自己設定的目標價，或者是出現賣出訊號，都應該斷然賣出。賣出後如果股價繼續上漲，不要覺得可惜，因為「十鳥在林，不如一鳥在手。」買賣股票的目的是獲利，如不能掌握賣出獲利的契機，到最後只是自我陶醉，空歡喜一場而已！'
  merge: -1
  img_proc: true
