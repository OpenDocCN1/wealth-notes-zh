- pgno: 254
  md: '# 第4章


    # 長線均線操作法


    小叮嚀：任何操作方法都要依據《步驟2：進場》的紀律進場，之後再根據自己的策略，採取不同的方法。


    長線均線操作法的原則是，符合趨勢進場後，設定均線為操作依據，而且又可區分為日均線和週均線做多兩種操作方式。


    # 日線波浪型態 + MA20日均線操作做多


    +   1. 波浪型態多頭完成。\n2. 股價突破MA20日均線，均線上揚。\n3. 進場停損守多頭轉折低點。\n4. 跌破MA20日均線出場。\n5. 多頭趨勢改變（日線趨勢出現頭頭低），停止操作。'
  merge: -1
  img_proc: true
