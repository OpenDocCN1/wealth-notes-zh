  md: "# 多頭進場位置4\n\n多頭向上跳空中長紅K線，股價維持在缺口上方整理，當出現整理末端的大量中長紅K線上漲時，是進場的位置。\n\n簡單回饋 缺口之上等買點\n\
    \n+   1. 上漲紅K線如符合「價漲、量增、線實」的訊號，買進上漲的機率很高。\n   價漲：收盤價上漲，收盤價突破整理的上頸線。\n   量增：成交量大於昨日成交量的1.3倍以上。\n\
    \   線實：K線收中長紅K的實體棒（上漲2.5%以上）。\n2. 日線進場的K線訊號是操作短線的買進位置。\n   週線進場的K線訊號是操作中長線的買進位置。\n\
    3. 當天上漲紅K線如果出現跳空上漲的K線，是主力強勢上攻，更要把握機會進場做多。\n4. 進場後要設定停損，並且嚴格執行停損。"
