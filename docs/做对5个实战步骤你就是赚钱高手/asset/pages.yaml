- pgno: 166
  md: '![](img/eba4f38becd57965eb8bb34492948440_166_0.png)


    ① 欣興（3037），週線空頭走勢下跌一段後盤整，等待盤整的跌破K線再進場做空。


    ② 2001/5/7，當週量縮約為前一天的二分之一量。空頭進場位置有量或無量都可以進場，設好停損即可。


    ③ 當週向下跳空長黑K線實體棒，收盤跌破盤整下頸線。收盤前確認，符合進場位置，進場放空做中期空頭。


    資料來源：富邦e01電子交易系統


    3. 當一檔股票空頭已經下跌過2波段，到相對的低檔位置，開始進入盤整時，這時可以鎖股追蹤觀察，等到大量長黑K線跌破時進場放空，但是要特別注意3天之內不可以出現反彈回到盤整區內，這容易是「假跌破、真上漲」。


    4. 盤整末端出現「假跌破、真上漲」，如果出現大量上漲的中長紅K，往上突破盤整區，後續要大漲，可以反手做多（這個盤整區稱為底部）。'
