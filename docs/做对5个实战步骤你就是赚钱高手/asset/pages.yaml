  md: '# 第3章


    # 預設獲利目標停利


    學 習完上一章的「依據操作紀律停利」之後，接下來要探討的是「預設獲利目標停利」：當達到預設獲利，出現K線轉折訊號時停利。


    +   1. 每次進場股價收盤到達獲利10%，出現股價不漲或下跌時，停利出場。\n2. 短線股價與月線乖離大於15%，股價不漲或下跌時，停利出場。\n3.
    到達型態目標價、V轉反彈目標價、波段預測目標價，股價不漲或反轉時，停利出場。'
