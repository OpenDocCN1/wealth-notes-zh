  md: "# 第5章\n\n# 短線K線及均線操作法\n\n小叮嚀：任何操作方法都要依據《步驟2：進場》的紀律進場。之後再根據自己的原則，採取不同的方法。\n\n\
    短線轉折操作法可以區分為K線操作法和均線操作法，其中又可細分為日線和週線操作，總計有10種操作法。\n\n# K線操作法\n\n以K線最高點被突破轉強、K線最低點被跌破轉弱做為操作的依據。\n\
    \n+   1. 日線操作\n  ○ 做多，每日收盤守前一日K線最底點。\n  ○ 做空，每日收盤守前一日K線最高點。 \n2. 週線操作\n  ○ 做多，每週收盤守前一週K線最底點。\
    \ \n  ○ 做空，每週收盤守前一週K線最高點。"
  merge: -1
  img_proc: true
- pgno: 258
  md: "# 均線操作法\n\n符合趨勢進場後，設定均線做為操作依據。\n\n+   1. 日線操作\n   ○ 波浪型態＋MA5日均線操作。\n   ○ 波浪型態＋MA10日均線操作。\n\
    2. 週線操作\n   ○ 波浪型態＋MA5週均線操作。\n\n逆勢操作屬於短線操作，適合用K線操作法或者MA3均線操作法。\n\n# 方法1：日線多頭「K線操作法」做多\n\
    \n+   1. 波浪型態多頭完成。\n2. 股價符合多頭進場位置進場。\n3. 進場停損守進場紅K線最低點。\n4. 收盤跌破前一日K線最低點出場。\n\
    5. 多頭趨勢改變（日線趨勢出現頭頭低），停止操作。\n6. 逆勢做多也可用此方法短線操作。"
  merge: -1
  img_proc: true
