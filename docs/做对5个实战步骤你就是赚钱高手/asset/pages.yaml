  md: '# 第2章


    # 看懂致勝數據

    再踏入股市


    《孫子兵法》第1篇〈始計篇〉說：「夫未戰而廟算勝者，得算多也；未戰而廟算不勝者，得算少也。多算勝，少算不勝，而況於無算乎？」


    這句話是在說明，用兵之道，必須「謀而後戰」，戰前要先算計自己的取勝條件，取勝的條件夠多，然後再出兵，才有獲勝的可能；反之則容易失敗。僅憑匹夫之勇，毫無算計謀略就出兵，必遭失敗。


    同樣的，在商場上，企業的成功建立在縝密的資訊蒐集分析、目標設定，以及達成策略，如果沒有遠見、沒有計畫，盲目投資，必會遭到重大的損失。在爾虞我詐、刁不見血的股票市場上，戰況之慘烈不亞於戰爭或商場的競爭，更要有充足的致勝準備及算計，再投入金錢，否則必定賠得血本無歸，投資人不可不慎。


    台股投資的致勝條件之一，就是要了解影響台股的因素。這'
  merge: -1
  img_proc: true
