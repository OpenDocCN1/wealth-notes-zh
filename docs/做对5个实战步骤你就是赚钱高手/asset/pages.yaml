- pgno: 280
  md: '# 如何提高操作勝率？


    在多頭走勢中，按照進場位置去做多（順勢操作），交易10次，有8次都能夠成功上漲賺錢，這樣的「勝率」高達80%。同樣一支股票，在多頭走勢中去做空（逆勢操作），交易10次，只有1次能夠成功上漲賺錢，這樣的「勝率」只有10%。


    # 順勢操作才有高勝率


    例如宏達電（2498），在多頭趨勢的向上長紅K線買進，都能夠成功，但是在空頭下跌中的長紅K線買進，卻都失敗，因為在多頭向上的時候買進做多，「勝率」會遠高於在空頭下跌中做多，這就是順勢操作的道理。因此，在空頭下跌時，當天即使大量上漲，去搶做多，10次大概只有1次會成功。'
  merge: -1
  img_proc: true
- pgno: 281
  md: "# Part 2 ▷5大實戰步驟\n\n![](img/eba4f38becd57965eb8bb34492948440_281_0.png)\n\n\
    ① 多頭上漲的轉折紅K做多4次，3次成功，只有最後一次上漲沒有過前高，出現「頭頭低」。 \n\n② 空頭下跌的轉折紅K做多4次，4次都失敗。\n\n# 停損才能避免大賠\n\
    \n股票市場變化很快，風險很大，執行停損是唯一避開風險的方法，也是避免大賠的唯一方法，該賠就賠，賠就是賺，俗話說：「不怕一萬，只怕萬一。」只要遇到一次因沒執行停損而慘賠，多年的努力恐怕都會付諸流水。"
  merge: -1
