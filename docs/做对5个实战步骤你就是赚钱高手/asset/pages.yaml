  md: '# 自序


    # 技術分析＋嚴守紀律

    ＝散戶致勝法寶


    「散戶」一般定義為「小額投資人」，在股票市場上，散戶永遠是弱勢族群，資金不多、資訊最少，想要戰勝大盤，的確不容易。


    # 散戶賺錢之道：技術分析


    作者也是散戶，從一開始進入股市，經歷20餘年的賠錢生涯，總是想在股海浮沉中，抓到一塊能賴以求生的浮木，可惜我只是從軍中退休的小老百姓，既不認識上市公司大老闆（應該說他們不認識我），也沒有主力大戶的朋友，更沒有什麼顯赫的家世背景，所以，想要做股票賺錢，真是不得其門而入。


    但是，從2006年開始學習技術分析之後，我才體悟到股票市場中沒有專家，只有輸家和贏家。許多人終其一生在求名師指導，其實股市真正的老師只有一個，那就是股票「大盤市場」，所有想戰勝大盤的技巧，都必須通過市場的考驗。透過對技術分'
  merge: -1
  img_proc: true
