- pgno: 284
  md: '短線操作時，要注意以下幾項重點：


    +   1. 每半年操作10次，平均1個月操作不到2次，一定可找到短線機會。\n2. 按照技術面順勢紀律操作，有時獲利超過5%，有時要停損，平均獲利為5%。\n3.
    複利操作，資金逐年增加，經驗也逐年增加，保持技術面順勢紀律操作，自然可以穩定獲利。\n4. 以趨勢方向盤為主要操作策略：\n   ○ 多頭順勢買進做多。\n   ○
    空頭順勢賣出做空。\n5. 不疾不徐，不貪不懼，忍耐堅持，看好才出手。\n6. 積沙成塔，自然能夠創造財富。'
