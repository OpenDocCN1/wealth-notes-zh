- pgno: 283
  md: '作，該賠就賠，該賺多少就賺多少，長時間下來，才能累積致富。其實，不要小看短線的績效，短線有以下4個優點：


    +   1. 短線的風險比較低。

    2. 短線的累積績效比較高（可提高資金運用效率）。

    3. 短線的實戰經驗比較多（如選股、進出場、操作）。

    4. 短線的賺錢機會比較多（在下跌趨勢仍有賺錢機會）。


    以下我們用30萬元資金，每半年短線操作10次，每次獲利率平均只有5%，運用複利模式運作，累積到第5年的上半年，財富就能累積上千萬元！


