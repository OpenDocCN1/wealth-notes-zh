  md: "# 多頭進場位置5\n\n多頭底部型態，出現大量中長紅K線向上突破，型態確認時，是進場的位置。\n\n簡要回顧 型態突破的買點\n\n+   1. 上漲紅K線如符合「價漲、量增、線實」的訊號，買進上漲的機率很高。\n\
    \   價漲：收盤價上漲，收盤價確認突破型態上頸線。\n   量增：成交量大於昨日成交量的1.3倍以上。\n   線實：K線收中長紅K的實體棒（上漲2.5％以上）。\n\
    2. 日線進場的K線訊號是操作短線的買進位置。\n   週線進場的K線訊號是操作中長線的買進位置。\n3. 型態突破確認之後，可以參考型態上漲的目標價，預估獲利空間及操作的目標。不同型態，達到目標價機率不同。\n\
    4. 當天型態突破確認上漲的紅K線，如果是跳空上漲的K線，上漲力道越強，更要把握機會進場做多。\n5. 進場後要設定停損，並且嚴格執行停損。\n6. 多頭底部反轉成功率高的幾個型態：頭肩底、複式頭肩底、N字底、三重底、圓弧底、一字底。（型態詳細說明參見《抓住飆股輕鬆賺》304頁附錄〈學會辨認型態\
    \ 股市無往不利〉）"
