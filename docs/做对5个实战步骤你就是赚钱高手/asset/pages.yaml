- pgno: 291
  md: '# 第2章


    # 依據操作紀律停利


    停利的方式有許多種，主要可區分為3大類：依據操作紀律停利、預設獲利目標停利、依據特定條件停利，在接下來的3章，將分別詳加敘述。


    依據操作紀律停利的方式如下：


    # 方式1


    用長線「趨勢操作」，當趨勢改變時停利出場。


    # 方式2


    用短線「K線轉折操作」，當K線收盤出現轉折時停利出場。


    # 方式3


    用短線「均線轉折操作」，當K線收盤跌破操作的均線時停利出場。'
  merge: -1
  img_proc: true
