  md: "# 第6章\n\n# 選股SOP：\n長線做空\n\n長線操作股票，當股票的月線完成下列幾項條件時，可以長線做空：\n\n+   1. 趨勢條件：\n\
    \   月線價量要有下列條件之一：\n   ○ 月線頭部出現長黑K線實體棒，同時放大量，跌破上升切線（此時週線要符合中線做空條件）。\n   ○ 月線頭部做頭盤整，出現頭頭低長黑K線實體棒，同時放大量（此時週線要符合中線做空條件）。\n\
    \   ○ 月線頭部完成「頭頭低、底底低」空頭趨勢，同時頭部放大量。\n\n+   2. 均線條件\n   月線的均線至少有2線（MA5、MA10）空頭排列，均線向下（注意：MA20、MA60如果還在股價下方，而且是上揚走"
  merge: -1
  img_proc: true
- pgno: 101
  md: "勢，當股價下跌靠近時，會有支撐產生）。\n\n# 3. 股價位置\n\n股價收盤在月線的均線2線（MA5、MA10）之下，同時看股價在整個下跌趨勢中，是位居初跌、主跌或末跌階段。\n\
    \n# 4. 成交量\n\n月線頭部做頭時有大成交量（代表有人在賣），發動攻擊向下下跌的K線不一定有大量。\n\n# 5. 指標參考\n\n月KD指標死亡交叉向下，MACD指標空頭排列向下，OSC紅柱轉綠柱。\n\
    \n# 6. 目標設定\n\nMA20、MA60均線支撐、前面頭部支撐、前面盤整區支撐、前面大量K線支撐、前面大量缺口支撐、型態目標價。\n\n# 7. 等待進場位置\n\
    \n+   ○ 週線空頭反彈後再下跌的中長黑K。\n○ 週線空頭盤整跌破下跌的大量中長黑K。（詳見〈步驟2：進場〉）\n\n# 長線做空重點提示\n\n+\
    \   1. 空頭向下會遇到下面很多的支撐，長線操作先以靠近股價最近的支撐，當作短期初步的獲利目標。 \n2. 空頭趨勢的特性為「見撐不是撐」，所以下跌到預定支撐"
  merge: -1
  img_proc: true
- pgno: 102
  md: '時，要觀察週K線的多空力量的變化，出現的K線是否有轉折的訊號，並且配合個人的操作紀律（例如做長線守週MA20均線）再決定是否出場，也可以根據到達支撐時的獲利率，以及MA20均線的乖離是否太大，決定是否要出場。（詳見〈步驟5：停利〉）


    +   3. 週線合乎條件進場，獲利出場後，只要空頭走勢沒有改變，可以繼續做空。\

    4. 月線頭部合乎長期操作條件完成後，要回到週線，先依照中線操作方法進場操作，當獲利已經拉開成本區時，再用長線方法操作。\

    5. 在任何完美的條件進場，都有一定的失敗機率，所以每次操作都要控制好風險，依據個人資金分配，考慮買進的數量和個人所能承擔的賠錢風險，設定萬一失敗停損的位置。（詳見〈步驟3：停損〉）'
  merge: -1
  img_proc: true
