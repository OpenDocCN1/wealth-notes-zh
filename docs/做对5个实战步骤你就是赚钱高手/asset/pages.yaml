  md: "# 第2章\n\n# 長線趨勢操作法\n\n小叮嚀：任何操作方法都必須依據《步驟2：進場》的紀律進場，之後再根據自己的策略，採取不同的方法。\n\n\
    操作方法大致可區分為做長線及做短線兩種，至於長線多長，短線多短，則沒有一定的標準，做幾天就出場或是做當沖，都可叫做短線，守月線或守季線，都可叫做長線。\n\n\
    操作長線是用「趨勢」的概念，只做多頭趨勢的上漲及空頭趨勢的下跌，不做逆勢。趨勢沒改變之前，持股續抱，一直到趨勢改變才出場。\n\n+   1. 長線做多：從多頭趨勢的確認開始，一直做到空頭趨勢的確認。\
    \ \n2. 長線做空：從空頭趨勢的確認開始，一直做到多頭趨勢的確認。\n\n![](img/eba4f38becd57965eb8bb34492948440_239_0.png)\n\
    \n![](img/eba4f38becd57965eb8bb34492948440_239_1.png)"
