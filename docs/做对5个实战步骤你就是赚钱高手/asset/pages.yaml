    # 作者：朱家泓


    1985年進入股票市場，在股海中浮浮沈沈，始終賺少賠多。2007年，他從最基本的技术分析學起，運用飄股戰法及股票獲利目標管理法，達到每年賺1倍的投資目標。


    基於感恩當初良師傾毓相授，才得以頓悟股市操盤方法，他把技術分析的教學內容編寫成書，希望幫助想學好股票操作的有緣人。


