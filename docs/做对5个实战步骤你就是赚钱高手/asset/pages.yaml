- pgno: 75
  md: "# 中線做多重點提示\n\n+   1. 多頭向上會遇到上面很多的壓力，中線操作先以靠近股價最 近的壓力，當作短期初步的獲利目標。\n2. 多頭趨勢的特性為「見壓不是壓」，所以上漲到預定壓力\
    \ 時，要觀察週K線多空力量的變化，出現的K線是否有轉折 的訊號，並且配合個人操作紀律（例如做中短線守週MA5 均線）再決定是否出場，也可以根據到達壓力時的獲利率，\
    \ 以及MA20均線的乖離是否太大，決定是否要出場。（詳見〈步驟5：停利〉）\n3. 週線合乎條件進場，獲利出場後，只要多頭走勢沒有改變， 可以繼續做多。\
    \ \n4. 週線底部合乎中期操作條件完成後，要回到日線，先依照短 線操作方法進場操作，當獲利拉開成本區時，再用中長線方 法操作。 \n5. 在任何完美的條件進場，都有一定的失敗機率，所以每次操\
    \ 作都要控制好風險，依據個人資金分配，考慮買進的數量和 個人所能承擔的賠錢風險，設定萬一失敗停損的位置。（詳 見〈步驟3：停損〉）"
