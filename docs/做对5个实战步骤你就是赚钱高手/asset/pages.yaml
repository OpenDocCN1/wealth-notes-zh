- pgno: 224
  md: '# 方法4：固定停損比例法


    按照多空紀律進場後，依據風險容忍程度，設定固定比例停損，不失為簡單的方法。只是如果設太少，容易在次一、二日被洗出場；停損如超過10%，一次的賠償太大，容易因不願賠，反而不停損，以致被套牢。固定比例停損的原則如下：


    原則1


    以進場當天收盤價的2%～10%設定停損。


    原則2


    在底部盤整區突破或第一次回測再上漲的位置，或頭部跌破及第一次反彈再下跌的位置，停損設10%，由於股價在相對低檔打底初漲時或做頭初跌時，主力經常會洗盤消化賣壓，或誘多出貨，震盪幅度比較大。切記，在守10%停損時，趨勢不可改變，趨勢如果改變就要出場，否則只是多賠而已。


    原則3


    在一般多頭上漲或空頭下跌，固定停損設5%～7%即可。


    原則4


    在多頭高檔末升段或空頭下跌末跌段時，遇到大量長紅K線或大量長黑K線進場時，停損設2%～3.5%。


    原則5


    逆勢搶反彈做多或逆勢搶回檔做空，停損設2%。'
