- pgno: 229
  md: '# 步驟4

    操作


    不同的投資人，同時間買進同一檔股票，有人小賺出場，有人大賺才出場，有人甚至做到賠錢出場，其中的差別就是操作不同。操作有兩個層面：技術面和心理面，技術面講方法，心理面講紀律，兩者兼顧，才能操作好股票。


    +   - 第1章 做長線 vs 做短線

    - 第2章 長線趨勢操作法

    - 第3章 短線轉折操作法

    - 第4章 長線均線操作法

    - 第5章 短線K線及均線操作法

    - 第6章 長短線綜合操作法：趨勢＋均線＋量能

    - 第7章 如何提高操作勝率？'
