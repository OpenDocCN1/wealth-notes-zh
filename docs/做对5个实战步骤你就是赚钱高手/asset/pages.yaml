    # 影響台股走勢的4個內在因素


    # 內在因素1    法人買賣超


    投資人通常會藉由3大法人的買賣超，看法人對多空的看法，其中自營商、投信視為內資，外資及陸資視為國外資金。其影響台股的研判方式為：


    研判1：連續買超看多，連續賣超看空（連續3天以上買或賣）。


