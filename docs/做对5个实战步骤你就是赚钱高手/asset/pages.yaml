  md: '# 第5章


    # 武装自己

    变身股市赢家


    投 资人如果想要成为股市赢家，必须奉行「投资之道，趋势为师，顺势而为，坚守纪律」的赢家最高圭臬。


    投资之道：想走股票投资这条路，就要找到正确的方向，用正确的方法，做正确的事，才能到达成成功获利的彼岸，见到股市如来。


    趋势为师：大盘的趋势方向，就是引领我们前进的明燈，大盘的变化就是淬炼我们的导师，天大地大，趋势最大，投资时，要谦卑恭谨慎地跟随趋势。


    顺势而为：借力使力，顺水推舟，事半而功倍。顺天应势，得道者富，赚钱如反手折花。


    坚守纪律：股市狡诈，千变万化，迷惑股海眾生，人心善变，恐惧贪婪，无法自持，唯定法坚守，以不变之法，照股市眾妖，定法依法，去杂乱之源，归万念於一，此定心矣！'
  merge: -1
  img_proc: true
- pgno: 50
  md: "# 穿上贏家的戰鬥裝備\n\n請記住，「機會永遠留給準備好的人」。只要你準備好，股票市場永遠都有機會。\n\n# 準備1 下定決心 完成目標\n\n\
    +   - 目標：達到致富、悠閒、愉快的人生。 \n- 執行：學習專業知識、經營事業態度、尋找賺錢方法、累積操作經驗、擬訂資金計畫、訓練穩健獲利。 \n-\
    \ 堅持：堅持目標決不放棄、堅持每日做功課研究圖形、堅持守紀律操作能夠賺錢的方法、堅持每日進步。\n\n# 準備2 安排學習課程\n\n+   - 技術分析初階班（1.5個月～3個月）\
    \ \n- 技術分析中高階班（1.5個月～3個月） \n- 型態＋心法班（1.5個月） \n- 練功班（3個月～6個月） \n- 四大金剛專修班（視個人需要加強）\
    \ \n- 實戰操作經驗累積（1～2年）\n\n# 準備3 修練禪定心法\n\n+   - 按部就班學習及練功。 \n- 定法定心，等好機會才進場，做到股不動我不動，股一動我"
  merge: -1
  img_proc: true
- pgno: 51
  md: '# Part 1▶積極備戰


    即動。


    +   o 股票賺錢是「等」來的，機會錯過，等下次機會。

    o 股票賺錢是「忍」來的，停損要忍痛出場，停利未到要忍住續抱，趨勢不明要忍住不要進場。

    o 股票賺錢是「穩」來的，勝率高的股票才操作，有獲利空間的股票才操作，穩健獲利，累積財富。


    除了遵守「贏家圭臬」，投資人還必須做好上述幾項準備，武裝自己，才能成為股市贏家。'
