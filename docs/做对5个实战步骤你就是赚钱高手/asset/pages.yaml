    目、董監事、現金流量、營業額年增率及月增率、毛利率、淨利率、淨值比、近5年以上配股配息狀況及政策、財務結構、本益比、公司股東報酬率，並且考慮公司產業的穩定性及產業未來的發展。


    # 2. 以價值型投資為主


    研究公司基本面，評估應有的合理價值，例如中華電（2412），公司股本775億元，淨值為48元，近5年配息平均達5元，為國內電信業的龍頭么，未來發展4G業務，公司經營穩健，評估後合理的投資價值應在50～60元間。


    判斷股票現行價位是否合理，並研究未來經營發展空間，做長期的投資，賺取長期的報酬，股票在合理價位之下即可承接。例如上述的中華電，當價格回到60元之下，就可以考慮長期投資。近3年中華電股價都在90元之上，其實是不適合做長期投資的。


