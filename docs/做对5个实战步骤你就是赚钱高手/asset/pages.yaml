  md: '且配合個人的操作紀律（例如做短線守5日均線）再決定是否出場，也可以根據到達壓力時的獲利率，以及與月線的乖離是否太大，決定是否要出場。（詳見〈步驟5：停利〉）


    3. 日線短線合乎條件進場，獲利出場後，只要多頭走勢沒有改變，可以繼續做多，上漲一段之後，走勢合乎中長期條件時，可以改為中長期操作。


    4. 在任何完美的條件進場，都有一定的失敗機率，所以每次操作都要控制好風險，依據個人資金分配，考慮買進的數量和個人所能承擔的賠錢風險，設定萬一失敗停損的位置。（詳見〈步驟3：停損〉）


