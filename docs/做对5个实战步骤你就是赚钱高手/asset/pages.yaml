  md: '# 第1章


    # 熟悉技術分析

    善用4大金剛


    股票市場中的投資人有法人、外資、公司、主力、大戶、中實戶，以及散戶，每個人都希望賺錢，所以競爭激烈。散戶是其中最弱勢的投資人，擁有的資金最少，沒有第一手資訊，更不可能有研究團隊。在這麼差的條件下，要在股市賺錢，必須有一套完整的訓練計畫，包括學習專業知識，透徹了解操作流程，掌握策略方法，建立正確觀念，在對的時間做對的動作，才能戰勝股市，成為股市贏家。


    # 學會技術分析的「4大金剛」


    工欲善其事，必先利其器。技術分析是股市操作的工具，不但要學會、要熟練，更要爐火純青。說實在的，在股票市場上，散戶可以相信或依賴的東西實在不多，技術分析雖非百分百不會出錯（包括市場本身也一樣會出錯），但它的確是最值得信任的股市投資工具。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '基本的技術分析要學會「波浪型態」、「K線」、「均線」和「成交量」，這4項我稱為技術分析的「4大金剛」，每個皆有特定的用途，以下用圖例簡要說明，更詳細的內容可參考我另一本著作《抓住飆股輕鬆賺》。


    # 金剛1 波浪型態


    操作股票首先要看對趨勢方向，做錯方向怎麼可能賺錢？方向的判別，當然不能用猜的，依據「道氏理論」（Dow Theory），多頭、空頭或盤整都有一定的走勢型態，若學會了，就已具備能夠看出股票走勢的能力。


    ![](img/eba4f38becd57965eb8bb34492948440_16_0.png)


    圖中的箭頭顯示，每個轉折的高點越來越高，轉折的低點也越來越高，符合道氏理論的「多頭」趨勢，「順勢做多」就是正確方向。


    資料來源：富邦e01電子交易系統'
  merge: -1
  img_proc: true
