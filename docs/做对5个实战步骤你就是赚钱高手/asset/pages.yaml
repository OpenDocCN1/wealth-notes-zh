  md: "# 空頭放空位置5\n\n空頭頭部型態，出現大量中長黑K線向下確認型態跌破時，是放空的位置。\n\n簡單回說 型態跌破的空點\n\n+   1. 黑K線如符合「價跌、線實」的訊號，放空成功下跌的機率很高。\n\
    \   價跌：收盤價下跌，收盤價跌破K線整理的最低點。\n   線實：K線收中長黑K的實體棒（下跌2.5%以上）。\n   成交量：大量或小量都可以。\n\n\
    +   2. 日線進場的K線訊號是操作短線的放空位置。\n   週線進場的K線訊號是操作中長線的放空位置。\n\n+   3. 型態跌破確認之後，可以參考型態下跌的目標價，預估獲利空間及操作的目標。不同型態，達到目標價機率不同。\n\
    \n+   4. 當天型態跌破確認下跌的黑K線，如果是跳空下跌的K線，下跌力道越強，更要把握機會進場做空。\n\n+   5. 放空後要設定停損，並且嚴格執行停損。\n\
    \n+   6. 空頭頭部反轉成功率高的幾個型態：頭肩頂、複式頭肩頂、倒N字底、三重頂、一字頭（型態詳細說明參見《抓住飆股輕鬆賺》304頁附錄〈學會辨識型態\
    \ 股市無往不利〉）"
