  md: '# 多頭趨勢轉折低點停損


    +   1. 多頭出現轉折上漲之後，這個轉折低點不可被跌破，如果被跌破，走勢就會產生「底底低」的狀況，並破壞多頭的「頭頭高、底底高」架構，這樣自然不適合再做多，進場的多單要出場，因此可在轉折低點設停損。進場紅K線收盤價與停損點超過7%，停損設7%即可。


