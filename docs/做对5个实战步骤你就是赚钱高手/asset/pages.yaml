- pgno: 126
  md: '# 第1章


    # 選對進場位置


    不想發生一買就跌、一賣就漲的情形，一定要選對進場位置。研判最佳進場位置之前，應先建立下面幾項正確觀念。


    # 研判進場位置5觀念


    # 觀念1


    進場前對要做的股票，一定要先做好準備工作，同時預估可能承受的風險及可能的獲利空間。


    # 觀念2


    只問進場位置對不對，不要計較價格高低，不要因為想買低一檔的價位，而錯失一次進場機會。


    # 觀念3


    確認後再買，成功機率比較高，例如多頭回檔，要等到再上漲確認才買，而非出現支撐就買。一般投資人不可能買到最低'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Part 2 ▷5大實戰步驟


    點，即使買到最低點，失敗停損的機率也比較高。


    # 觀念4


    設定好進場條件，當條件都符合時，該買時就買，同時要規畫好資金分配，決定買進的數量，如果資金不多，採取一次買進，資金充足則可分2或3次買進。


    # 觀念5


    再好的進場位置，都沒有百分之百的成功率，因此，任何位置進場都要設定停損點，一旦跌破停損，要按照紀律停損出場。（詳見〈步驟3：停損〉）


    # 股票賺錢是「等」來的


    股票賺錢是「等」來的，所謂的「等」，就是「等」進場位置的K線訊號。簡單說，短線操作的投資人，要「等」日線進場位置的K線訊號；中長線操作的投資人，則要「等」週線進場位置的K線訊號。


    對於多頭走勢的股票，要在多頭買進；空頭走勢的股票，則要在空頭放空。如在盤整區操作，因為獲利不高，原則上不建議進場買賣股票。


    # 影響股票漲跌的外在因素


    每個人買股票都希望，做多買進能馬上漲，做空的股票則能'
  merge: -1
  img_proc: true
- pgno: 128
  md: '馬上跌，但股票漲跌的因素很多，除了股票本身基本面、技術面的好壞之外，還有許多外在因素必須考慮進去，然後再擬定整體的操作策略，這樣才能掌握賺錢機會。


    股票是一種投資操作商品，其實每檔股票都不是單獨存在，「個別股票」的上層是「類股族群」，再往上是「台股大盤」和「國際盤」。股票上層的每個環境，都會影響股票本身的漲跌和強弱。


    由上而下來看，「國際盤」不好會影響「台股大盤」，「台股大盤」不好會影響「類股族群」，「類股族群」不好會影響「個股」。


    因此，當大盤好、類股好，在這個類股中的強勢股做多，最容易賺錢。反之，當大盤不好、類股不好，即使做多這個類股的強勢上漲股，也不容易賺錢。


    例如2014年10月17，台股大盤空頭下跌120點（見次頁圖1），電子類股也是空頭下跌（見次頁圖2），股王大立光（3008）在前一天公布第3季超賺，單季EPS為39.4元，創台股新紀錄，前3季累積EPS為89.51元，可是2014年10月17當天，大立光卻是跌停鎖死（見次頁圖3），這就是受到類股及台股大盤的空頭趨勢影響。'
  merge: -1
