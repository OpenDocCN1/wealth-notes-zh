  md: '析的鑽研，我終於找到一條屬於「散戶」的賺錢道路。


    # 湘信技術分析 避開賠錢風險


    在股票市場，很多人「看它樓起，看它樓塌」，台股在1990年2月12日，指數從歷史高點12682，下跌到4450點，多少人葬身股海，從此退出股市。


    ![](img/eba4f38becd57965eb8bb34492948440_6_0.png)


    +   ① 1990/2/12，指數歷史高點12682，當天爆1991億元大量，KD指標高檔背離。 ② 1990/2/16，長黑K線跌破前波低點，跌破MA20均線，KD指標向下，方向出現改變，進入盤整。
    ③ 1990/2/22，黑K線跌破前一日低點，跌破MA5、MA10、MA20均線，且MA20月線下彎，空頭架構完成，當天收盤指數11749點。此時技術分析已經完成空頭架構，如果相信趨勢已經轉變，多單及時出場，當然不會慘賠到4450點。
    ④、⑤ 都是空頭反彈後的繼續下跌，開始做空，一路下跌大賺。


    資料來源：富邦e01電子交易系統'
