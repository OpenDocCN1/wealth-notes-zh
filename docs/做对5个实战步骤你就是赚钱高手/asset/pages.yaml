  md: '# 第6章


    # 長短線綜合操作法：

    趨勢＋均線＋乖離


    影響股票走勢的因索很多，即使一檔股票的基本面很好，技術面的月、週、日線都合乎多頭上漲的條件，仍不能保證一定會大波段上漲，可能上漲中波段或小波段，就結束多頭趨勢。


    為了解決上述的困擾，可以考慮採用以下的操作策略：


    # 策略1      長線趨勢操作


    長線趨勢操作，必須在底部多頭趨勢確認位置，或頭部空頭趨勢確認位置開始操作，如果位置在高檔的末升段或在低檔的末跌段，就不適合用長線趨勢操作。


    # 策略2      從短線開始操作


    剛進場操作時先從短線做起，當走勢持續時再做長線，例如日線底部多頭趨勢剛確認時，先做短線，當日線持續上漲一段，週線走勢圖也完成底部多頭趨勢確認後，再改做長線，這樣有週線多頭趨勢的保護，在日線做長線「趨勢操作」，成功的機會就很高。'
  merge: -1
  img_proc: true
- pgno: 275
  md: "# Part 2 ▷5大實戰步驟\n\n# 策略3 長短線綜合操作法\n\n用長短線兼顧的「趨勢＋均線＋乖離」綜合戰法，在日線操作採取下列做法：\n\n\
    +   1. 用趨勢進場\n   - 多頭趨勢做多，空頭趨勢做空，盤整趨勢退出操作。\n   - 多頭趨勢做多，用多頭做多的2個位置進場，多頭「回後買漲上」、「盤整的突破」（參見〈步驟2：進場〉第2章），停損用趨勢進場的轉折低點。\n\
    \   - 空頭趨勢做空，用空頭做空的2個位置進場，空頭「彈後空下跌」、「盤整的跌破」（參見〈步驟2：進場〉第3章），停損用趨勢進場的轉折高點。\n\n+\
    \   2. 用MA10均線出場\n   - 多頭用MA10、MA20兩條均線，收盤跌破MA10均線停利賣出，MA20均線的上揚角度，作為方向及多頭強弱變化的參考。\n\
    \   - 空頭用MA10、MA20兩條均線，收盤突破MA10均線停利回補，MA20均線的下彎角度，作為方向及空頭強弱變化的參考。\n\n+   3. 乖離過大改用MA3、MA5均線停利\n\
    \   多頭走勢，當股價出現急漲，股價與MA20均線乖離超過＋15％以上；或空頭走勢，當股價出現急跌，股價收盤與MA20均線乖離超過－15％以上，改用MA3或MA5兩條均線"
