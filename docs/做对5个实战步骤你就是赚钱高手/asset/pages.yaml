  md: "# 第5章\n\n# 選股SOP：\n長線做多\n\n長線操作股票，當股票的月線完成下列幾項條件時，可以長線做多：\n\n+   1. 趨勢條件\n\
    \   月線價量要有下列條件之一：\n   - 月線底部出現長紅K線實體棒，同時要放大量，突破下降切線（此時週線要符合中線做多條件）。\n   - 月線底部打底盤整，出現底底高長紅K線實體棒，同時要放大量（此時週線要符合中線做多條件）。\n\
    \   - 月線底部完成「頭頭高、底底高」多頭趨勢，同時底部要放大量。\n\n+   2. 均線條件\n   月線的均線至少要2線（MA5、MA10）多頭排列，均線方向向上（注意：MA20、MA60如果還在股價上方，而且是下"
  merge: -1
  img_proc: true
- pgno: 90
  md: '彎走勢，當股價上漲靠近時，會有壓力產生）。


    # 3. 股價位置


    股價收盤要在月線的均線2線（MA5、MA10）之上，同時要看股價在整個上漲趨勢中，是位居初升、主升或末升階段。


    # 4. 成交量


    月線底部打底時要有大成交量（代表有人在買），發動攻擊向上上漲的K線要有攻擊量（當月成交量比前一月成交量增加1.5倍以上，如果有2倍以上的量，攻擊力道更強）。


    # 5. 指標參考


    月KD指標黃金交叉向上，MACD指標多頭排列向上，OSC綠柱轉紅柱。


    # 6. 目標設定


    MA20、MA60均線壓力、前面頭部壓力、前面盤整區壓力、前面大量K線壓力、前面大量缺口壓力、型態目標價。


    # 7. 等待進場位置


    +   - 週線多頭回檔後再上漲的大量中長紅K。

    - 週線多頭盤整突破上漲的大量中長紅K。（詳見〈步驟2：進場〉）


    # 長線做多重點提示


    1. 多頭向上會遇到上面很多的壓力，長線操作先以靠近股價最近的壓力，當作短期初步的獲利目標。'
