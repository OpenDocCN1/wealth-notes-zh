    # 短線獲利5%即可致富


    大家都知道，做大波段的獲利很高，希望買進股票就一直上漲，可是大多數的股票不會如此。散戶做到一檔上漲的股票，往往因為貪心，該賣的時候沒有賣，而少賺很多，甚至倒賠。

    股票市場沒有一夜致富的童話故事，按部就班，遵守紀律操'
  merge: -1
