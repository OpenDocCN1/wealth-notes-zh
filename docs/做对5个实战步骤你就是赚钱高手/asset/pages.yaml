- pgno: 190
  md: '# 空頭放空位置6


    空頭下面的圖型，可以在當天收盤或次日開盤放空。做隔日沖或當日沖，賺取下跌的價差。


    +   1. 抓住次日開盤或當天收盤的機會放空，賺取下跌的價差。\n2. 以日線K線轉折或是續跌的訊號，做為放空的位置，與基本面無關。\n3. 次日或當天走勢很弱，可以看趨勢、價量配合及位置再留單一天。\n4.
    次日或當天走勢不理想，沒有價差就回補，因此沒有大賠的風險。\n5. 屬於超短線操作，獲利不大，要以量取勝。


    # 操作紀律：


    +   1. 選擇符合條件的強勢空頭股票做空，或多頭急漲的股票搶回檔做空。\n2. 盤中可以用5分K走勢圖操作。\n3. 此法獲利小，要以量取勝，資金要集中在1～2檔。不宜同時做太多檔股票，以免盤中無法照顧。\n4.
    操作必須看盤，並且嚴守停損及停利紀律。'
