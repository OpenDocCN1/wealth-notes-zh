- pgno: 163
  md: "# 第3章\n\n# 股票做空\n6個放空位置\n\n在本章所述的6個位置，投資人可以進場做空。從所舉的範例中，可以學會如何正確判斷放空位置。\n\n\
    # 空頭放空位置1\n\n盤整末端的向下跌破下頸線黑K線\n\n| 簡單回說 | 盤整的跌破 |\n\n+   1. 黑K線如符合「價跌、線實」的訊號，放空成功下跌的機率很高。\
    \ \n   價跌：收盤價下跌，收盤價跌破盤整的下頸線。 \n   線實：K線收中長黑K的實體棒（下跌2.5%以上）。 \n   成交量：大量或小量都可以。\
    \ \n2. 日線進場的K線訊號是操作短線的放空位置。 \n   週線進場的K線訊號是操作中長線的放空位置。"
  merge: -1
  img_proc: true
- pgno: 164
  md: '3. 黑K線實體棒越長，下跌力道越強。


    4. 跳空下跌的缺口越大，下跌力道越強。


    5. 進場後要設定停損，並且嚴格執行停損。


    ![](img/eba4f38becd57965eb8bb34492948440_164_0.png)


    ① 創惟（6104）2012/3/6，大量長黑K線跌破前面低點，空頭「頭頭低、底底低」確認，反彈不過高等做空。


    ② 空頭走勢下跌一段後盤整，等待盤整的跌破K線再進場做空。


    ③ 2012/3/29，當天放量約為前一天的1.9倍大盤。


    ④ 當天長黑K線實體棒，收盤跌破盤整下頸線。收盤前確認，符合進場位置，進場放空。


    資料來源：富邦e01電子交易系統'
