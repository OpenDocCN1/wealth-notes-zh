  md: '# 第7章


    # 選股秘笈：

    找出潛力強勢股


    前面幾章所列的短中長線選股條件，是做多或做空的基本條件。基本條件不足的股票，最好要忍住，不要太早進場，否則失敗的機率很高。


    除此之外，經由底部或頭部形成的型態或多空的力道表現，也可以推測未來走勢確認之後的強弱。我們在鎖股觀察時可以注意下面幾個型態或反轉的現象，藉以發覺未來的潛力股。


    # 空頭糾結轉多頭的強勢底部


    情況1 打底期間，出現大量的買盤，底部多頭確認時，放大量突破，為強勢上漲潛力股（出現在週線更好）。


    情況2 底部轉折前有2個月以上的均線糾結型態，當均線糾結底部出現大量突破，為強勢上漲潛力股（出現在週線的均線糾結更好）。'
  merge: -1
  img_proc: true
