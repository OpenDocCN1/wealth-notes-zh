- pgno: 125
  md: '# 步驟2


    # 進場


    散戶經常遇到一買就跌、一賣就漲，關鍵其實都在進場的位置。進場太早，被主力洗盤給洗掉，進場太晚，追在高點，一買就跌，所以進場是資金投入股市的第一步，更是賺錢與否的重要關鍵。


    +   第1章 選對進場位置


    +   第2章 股票做多6個進場位置


    +   第3章 股票做空6個放空位置


    ![](img/eba4f38becd57965eb8bb34492948440_125_0.png)'
  merge: -1
