  md: "# Part 2 ▷5大實戰步驟\n\n短線操作的次數同樣是10次，獲利卻不如長線，可是短線機會多，在一年中，長線操作10次，短線可以操作30次，這樣一來，獲利也可以達到120%，同樣十分驚人。\n\
    \n# 多頭、空頭和盤整趨勢\n\n無論做長線或做短線，都要知道什麼是「趨勢」。股價的走勢方向維持走多頭、走空頭或橫向盤整，這3個方向稱為「趨勢」。\n\n\
    +   1. 多頭趨勢：股票上漲時，維持「頭頭高、底底高」的圖形走勢。 \n2. 空頭趨勢：股票下跌時，維持「頭頭低、底底低」的圖形走勢。 \n3. 盤整趨勢：股票行進時，既非多頭的圖形，也非空頭的圖形走勢。\n\
    \n趨勢的詳細說明，參見《抓住飆股輕鬆賺》第1篇。\n\n![](img/eba4f38becd57965eb8bb34492948440_235_0.png)\n\
    \n![](img/eba4f38becd57965eb8bb34492948440_235_1.png)\n\n![](img/eba4f38becd57965eb8bb34492948440_235_2.png)"
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 多頭、空頭和盤整轉折


    除了趨勢之外，無論做長線或做短線，也要了解什麼是「轉折」。股價在走趨勢的時候，漲漲跌跌，每次的上漲轉向下跌，或者下跌轉向上漲，稱為「轉折」點。


    +   1. 多頭轉折：股票上漲一波到高點，轉向回檔的下跌；股票回檔結束後轉向的上漲。\n2. 空頭轉折：股票下跌一波到低點，轉向反彈的上漲；股票反彈結束後轉向的下跌。\n3.
    盤整轉折：股票在盤整區的上頸線轉向下跌及下頸線轉向上漲。


    轉折的關鍵在K線的變化，K線的轉折應用，參見《抓住K線 獲利無限》第3～4篇。


