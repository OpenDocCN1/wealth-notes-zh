  md: '# Part 2 ▷5大實戰步驟


    2. 多頭趨勢的特性為「見壓不是壓」，所以上漲到預定壓力時，要觀察週K線多空力量的變化，出現的K線是否有轉折的訊號，並且配合個人的操作紀律（例如做長線守週MA20均線）再決定是否出場，也可以根據到達壓力時的獲利率，以及MA20均線的乖離是否太大，決定是否要出場。（詳見〈步驟5：停利〉）


    3. 週線合乎條件進場，獲利出場後，只要多頭走勢沒有改變，可以繼續做多。


    4. 月線底部合乎做長期操作條件完成後，要回到週線，先依照中線操作方法進場操作，當獲利已經拉開成本區時，再用長線方法操作。


    5. 在任何完美的條件進場，都有一定的失敗機率，所以每次操作都要控制好風險，依據個人資金分配，考慮買進的數量和個人所能承擔的賠錢風險，設定萬一失敗停損的位置。（詳見〈步驟3：停損〉）'
