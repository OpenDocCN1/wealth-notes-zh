  md: '些因素分為外在及內在兩類，分別介紹說明如下。


    # 影響台股走勢的3個外在因素


    外在因素指的是國外股市的走勢，會對台股造成不同程度的影響。


    # 外在因素1 美國股市4大指數


    +   1. 道瓊指數（DJ）

    道瓊工業平均指數，反應美國30種主要製造業的股票行情。


    +   2. S&P500指數

    標準普爾500股價指數，從紐約股票交易所選出美國前500大上市股票而編製的股價加權平均指數，涵蓋範圍較廣，能精確反應美國市場狀況。


    +   3. 那斯達克指數（NAS）

    屬於美國的櫃台買賣中心，專門提供高科技股的交易市場，較容易影響台灣電子股的走勢。


    +   4. 費城半導體指數

    由美國費城證券交易所編製，取樣30檔半導體上游重量級公司組成，為半導體類股的重要指標。


    美國是世界經濟的龍頭，美股的漲跌，自然牽動國際股市，在平常，美股的漲跌與台股的連動性並不高，但是若遇到下面2種情況，對台股的當天走勢就會造成影響：'
