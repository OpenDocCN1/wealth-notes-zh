- pgno: 230
  md: '# 第1章


    # 做長線 vs 做短線


    再好的股票，不會操作，一樣賺不到錢。操作方法大致可區分為做長線及做短線兩種，至於做長線好，還是做短線好，那就因人而異了，因為每個人有不同的資金、不同的工作環境、不同的個性，採取適合自己的做法，就是好方法。


    # 操作的態度條件


    選股、進場之後，就要開始操作，操作的目的就是為了賺錢。達到下列基本條件後，開始考慮停利出場：


    +   1. 規畫資金分配、購買張數，依據進場條件及位置進場。\

    2. 進場後設好停損，並嚴格執行停損。\

    3. 未達停損及獲利未滿5%，繼續持股操作。\

    4. 獲利超過5%之後，依據個人做長線或做短線戰法，停利出場。\

    5. 操作短線，獲利超過15%以上，出現K線轉折訊號反轉'
  merge: -1
  img_proc: true
- pgno: 231
  md: '時，不可貪心，一定要按照紀律停利出場，獲利入袋，避免獲利回吐。


    # 長線操作優缺點


    # 長線操作優點


    +   1. 長時間操作一檔股票，不需要頻繁進出，適合無法看盤的投資人。\n2. 波段長線操作，獲利率高。\n3. 紀律操作，輕鬆抱股。


    # 長線操作缺點


    +   1. 操作機會比較少，鎖股等待時間比較長。\n2. 要考慮基本面、產業面、題材面。\n3. 整體大環境對股票能否維持長期趨勢影響很大，當大盤走波段方向時，個股長波段才容易維持長線走勢。\n4.
    長期持股需要忍耐回檔、反彈、盤整的過程，對操盤EQ是考驗。\n5. 有系統性的風險。


    # 短線操作優缺點


    # 短線操作優點


    +   1. 操作機會比較多。'
  merge: -1
  img_proc: true
- pgno: 232
  md: '+   2. 隨個股趨勢變化，可以多空靈活操作。

    3. 以技術面操作，操作紀律明確，容易遵守。

    4. 操作效率高，小資金可以快速累積財富。

    5. 風險比較小。


    # 短線操作缺點


    +   1. 頻繁進出，交易成本增加。

    2. 需要看盤，做當沖更要盯盤。

    3. 短線操作，每趟進出的獲利空間不大。

    4. 要精熟技術分析，嚴守停損停利，紀律操作。


    # 股市賺賠錢公式


    無論做長線或短線，都沒有百分之百的成功率，操作好壞，能否賺到錢，是以下公式中的因素所造成的結果：


    # 賺賠＝勝率×獲利率－敗率×停損率


    這4「率」的組合，決定了投資人在股市是贏家或輸家，以下說明這4「率」與賺賠的關係：


    +   1. 勝率：操作成功的比例。例如操作10次，其中有6次賺錢，4次賠錢賣出，勝率為6成。

    2. 獲利率：操作成功而賺錢的比例。例如買進一張100元的股票，賣出結算後賺10元，獲利率為10%。'
  merge: -1
  img_proc: true
- pgno: 233
  md: '3. 敗率：操作失敗的比例。例如操作10次，其中有6次賺錢，4次賠錢賣出，那麼敗率為4成。


    4. 停損率：操作失敗賠錢的比例。例如買進一張100元的股票，賣出結算後賠6元，停損率為6%。


    # 做長線成功關鍵：高獲利率


    操作多頭長線，要在底部多頭趨勢確認時開始，因此機會比較少，即使底部多頭趨勢確認，也沒有辦法保證一定會走出大波段，所以，由上面公式來看，長線波段操作賺大錢的關鍵在高獲利率。


    例如選了10檔股票，都是在底部多頭趨勢確認開始操作，後來只有3檔維持長波段趨勢發展，獲利率平均到50%，另外7檔，有的只走一個短波段就結束，有的停損出場，平均停損率為5%，10檔中有3檔成功，勝率為30%，敗率為70%，套入公式的結果為：賺賠＝3×50%－7×5%＝150%－35%＝115%。長波段的操作可能長達3個月到1年，但高達115%的獲利，十分驚人。


    # 做短線成功關鍵：勝率和操作頻率


    操作多頭短線，在多頭趨勢的起漲轉折位置都可以做，因此機會比較多，但同樣無法保證一定成功。由於短線的獲利有限，由上面公式來看，短線操作賺大錢的關鍵在高勝率及多次'
