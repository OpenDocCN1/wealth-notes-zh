- pgno: 321
  md: '# 第3章


    # 判別多空


    > 孫子兵法第4章《軍形》第2條：

    不可勝者，守也。可勝者，攻也。守則不足，攻則有餘。善守者，藏於九地之下；善攻者，動於九天之上。故能自保而全勝也。


    作戰時不想被敵人戰勝，防守要固若金湯；想戰勝敵人，進攻要勢不可當。善於防守者，如同隱蔽兵力於地下，深藏不露；善於進攻者，發動進攻如同神龍九霄而下。正所謂守能保衛自己，攻能一舉奪勝。


    在商場上，公司經營必須隨著市場的景氣變化調整，景氣不好時要能守成，不被打敗；景氣好時，要能開疆拓土，擴展業績。操作股票，要審時度勢，國際經濟衰退、國內景氣下滑、大盤趨勢不佳時，要保守應對，投入資金要減少；當大環境變好，趨勢成大多頭時，要抓住機會，全力做多。


    # 股票沒有好壞 只有多空


    再好的股票，在趨勢轉空頭時也會下跌，再差的股票，在趨勢轉多頭時也會上漲。以大立光（3008）為例，獲利創新高，可是趨勢轉空頭，股價照樣下殺。'
  merge: -1
  img_proc: true
