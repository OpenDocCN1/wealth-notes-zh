- pgno: 289
  md: '# 觀念6


    多頭股票強勢上漲，獲利達20%～25%時，要注意容易回檔做較長時間的整理。


    # 觀念7


    高檔壓區，K線出現帶大量的長黑、長上影線、十字線等變盤線訊號，次日轉折下跌的機率很高，準備隨時出場。


    # 觀念8


    飆股漲勢凌厲，必須盯住走勢，當出現爆大量股價轉弱下跌時，要立刻獲利出場，出場後如再出現繼續強勢上漲時，再介入操作。


    # 觀念9


    空頭下跌達15%幅度，低接或回補比較不明顯，獲利回補位置以K線止跌回升訊號為主。


    # 觀念10


    長期均線（月線或季線）在股價的上方向下彎，會帶來較重的壓力，當股價靠近均線時，要注意反壓的賣出訊號。


    # 觀念11


    分清停利點與加碼點，看清是有獲利幅度高點，還是盤整後的起漲點，有些人在盤整區買進後抱了好多天，結果開始突'
  merge: -1
