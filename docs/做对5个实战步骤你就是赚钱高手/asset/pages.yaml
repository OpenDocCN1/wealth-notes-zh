    重點3：高檔融券餘額增加，代表許多投資人認為股價會跌，所以借股票來賣，對多頭不利。


    重點4：下跌一段，融券餘額偏高，代表有更多人早晚要融券回補，所以反而會造成股價上漲，對多頭有利。


