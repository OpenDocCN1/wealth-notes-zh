- pgno: 204
  md: '# 第2章


    # 設定停損的認知


    學 習在買進股票後設定停損的方法之前，投資人要先有下面幾項認知：


    # 認知1


    買進一檔股票之後，立刻想好認賠出場的價位，即是設定「停損點」。股票千變萬化，而且變化快速，如果買進當天沒有設停損，很可能第二天就會出現反轉，這樣就會影響到你執行停損的決心。


    # 認知2


    設定好停損價位後不得更改，否則等於沒有設停損。散戶經常設了停損，可是跌破停損時，總是找理由不執行，或者更改停損價位，例如設跌破5日均線要停損，可是跌破後，捨不得賠錢賣，心想等真的跌破10日均線再出場好了。這種心態往往'
  merge: -1
  img_proc: true
- pgno: 205
  md: '會造成跌破10日均線時，因為已賠更多，而更捨不得賠錢賣，因此就被套牢。


    # 認知3


    嚴格要求自己，當天收盤價如果做多跌破（或放空突破）停損價位，要立即出場，必須絕對遵守，有壯士斷腕的決心及執行力。


    # 認知4


    為了減少停損次數，以順勢交易為主要操作方向，也就是多頭時做多，不做空；空頭時做空，不做多。遵循本書〈步驟1：選股〉的條件及〈步驟2：進場〉的位置，更能提高勝率，減少停損機率。


    # 認知5


    在下面的情形，即使沒有到達停損，也要出場，否則容易多賠或產生重大賠償：順勢操作時，無論做多或做空，如進場沒多久就發生趨勢改變，要立刻出場，否則等到停損時會賠的比較多。（見右頁「陽稜日線圖」）。逆勢交易時，只要走勢不對，就必須立刻出場，不可拘泥在停損價位，否則套牢無法解套，會損失慘重，切記！切記！（見P.
    208「力旺日線圖」）


    # 認知6


    停損最多10%，一檔股票，如果進場前，充分研判，符合進'
