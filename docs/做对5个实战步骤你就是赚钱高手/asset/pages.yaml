- pgno: 237
  md: "# Part 2 ▷5大實戰步驟\n\n# 何謂「長線保證短線」？\n\n在股票市場，我們常聽人說「長線保護短線」，指的是：\n\n+   1. 長線「趨勢」保護短線的「轉折」\n\
    \   ○ 在日線走勢圖中是多頭趨勢，可以保護做日線短線多頭的「轉折」方向。\n   ○ 在週線走勢圖中是多頭趨勢，可以保護做週線短線多頭的「轉折」方向。\n\
    \n+   2. 長線「趨勢」保護短線的「趨勢」\n   ○ 在週線走勢圖中是多頭趨勢，可以保護做日線短線多頭的「趨勢」方向。\n   ○ 在月線走勢圖中是多頭趨勢，可以保護做週線短線多頭的「趨勢」方向。\n\
    \n# 操作的終極目標是「賺錢」\n\n進出股市，無論做長線或短線，終極目標都是要「賺錢」。\n任何投資人或投資單位、外資，甚至國安基金，投入股市都是想賺錢。\n\
    \n2014年9月1日起，台股由9532點一路跌到10月17日8501點，下跌1031點，公營行庫配合政府護盤買進。當行情打底回升之後，在多頭放量上漲的10月31日，看到當初配合政府進場的公營行庫出現賣超，即使是下跌護短的救市資金，也會設法在賺錢時賣出。"
  merge: -1
  img_proc: true
- pgno: 238
  md: '我要特別強調的是，散戶要有一個觀念，把自己辛苦存的錢投入股市，目的是要「賺錢」，不是「賠錢」，保住資金才是你最重要的工作，股票只是用來賺錢的操作商品，不要眷念賠錢的股票。


    聰明的投資人絕對不是死多頭或死空頭，當行情不好，股票走勢不好，逆勢操作都很難賺錢，這時應該休息觀望，等待行情轉好，股票走勢變好，再順勢操作，這時就是很好賺錢的時候，才應該積極投入。


    掌握股市脈動，根據行情好壞做多或做空，並採用做長線或短線的操作策略，才能夠成為股市的長期贏家。'
  merge: -1
