- pgno: 247
  md: '# 第3章


    # 短線轉折操作法


    小叮嚀：任何操作方法都要依據《步驟2：進場》的紀律進場，之後再根據自己的策略，採取不同的方法。


    操作短線是用「轉折」的概念，可以做多頭趨勢上漲的一段、空頭趨勢下跌的一段，也可以做急跌的反彈和急漲的回檔逆勢。在趨勢行進時，由其中一個轉折的確認點，做到出現相反方向的轉折確認點時出場。


    +   1. 短線做多：從多頭轉折上漲的確認點進場做多，一直做到上漲一波段，出現轉折下跌確認時出場。


    ![](img/eba4f38becd57965eb8bb34492948440_247_0.png)'
  merge: -1
  img_proc: true
- pgno: 248
  md: '2. 短線做空：從空頭轉折下跌的確認點進場放空，一直做到下跌一波段，出現轉折上漲確認點時回補。


    ![](img/eba4f38becd57965eb8bb34492948440_248_0.png)


    # 長轉折與短轉折


    轉折本身可以分為長轉折和短轉折：


    +   1. 看「盤中分時圖」的走勢圖做「轉折操作」，可說是依據當天盤中的轉折變化進出。\n2. 看「日線圖」的走勢圖做「轉折操作」，可說是依據每天的轉折變化進出。\n3.
    看「週線圖」的走勢圖做「轉折操作」，可說是依據每週的轉折變化進出。\n4. 看「月線圖」的走勢圖做「轉折操作」，可說是依據每月的轉折變化進出。


    因此，用時間越長的趨勢圖做轉折操作，操作的時程就會比較長。'
  merge: -1
  img_proc: true
