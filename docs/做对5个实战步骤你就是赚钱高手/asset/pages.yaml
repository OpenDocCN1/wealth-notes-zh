  md: '# 第3章


    # 篩選好股票

    建立賺錢資料庫


    好的開始是成功的一半。如果能夠投資到好股票，成功獲利不但容易，而且也很驚人。不過，天下沒有白吃的午餐，想要選到強勢股，要有方法，然後加上不斷練習，選股功力就會日漸增強。選股是進場前的準備工作，也是每天要做的工作，這個步驟做得越好，進場賺錢的機會越大。


    我講授投資理財課程這幾年，經常有學生問：「台股有1千多檔，到底要怎樣才能選到會漲的股票？」其實，這也是一般散戶常常遇到的問題，因為每個時期都會出現不同的好股票，所以，選股便是投資人的日常功課。


    投資人平常就應該蒐集具有上漲或下跌潛力的好股票清單，當機會來了，自然就可以從容進場，正所謂：機會是留給準備好的人。


    我們可由下面幾個方向，逐步選出好的股票。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# 觀察強弱勢股 篩選潛力好股


    每日收盤後，投資人都可以透過券商的交易軟體，列出當天漲幅最大或跌幅最大的前100檔股票，只要持續追蹤，每天觀察（當然也要有技術分析的能力），很容易就能發現主流類股、近期的強勢股、弱勢股、走勢很好的波段股、短線轉強或轉弱的個股，以及日後的黑馬潛力股。


    篩選好股票有以下7個方式：


    # 篩選1：整理強勢和弱勢股


    每天收盤後，把當日上漲3.5%以上的強勢股票，以及下跌3.5%以上的弱勢股票，全部看一遍（至少前50檔）。


    # 篩選2：去除壞股票


    利用技術分析，去除線形不好、看不出方向、成交量太小（無法多買，買到之後不易賣出），以及價格太低（容易遇到地雷股）的股票。


    # 篩選3：做多潛力股


    +   1. 大盤在月線之上多頭，個股呈現多頭架構，股價在月線之上，月線上揚。 2. 類股必須是多頭，且比大盤強，如下頁3張線圖。 3. 在強勢類股中，找出1～3檔龍頭股或走勢較強勢的個股。
    4. 提前尋找未來將會發酵的題材，如4G、光纖、節能、智慧電視、物聯網、電動車、機器人……'
  merge: -1
  img_proc: true
