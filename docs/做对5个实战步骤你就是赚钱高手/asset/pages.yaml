  md: '# 步驟3

    停損


    股市是高風險的投資市場，散戶總是賠大賺小，賠大的原因是無法徹底執行停損，而遭套牢。只要預先設好停損，並嚴格執行，至少不會造成更大的損失。學會停損賠小錢，保住資金，就有機會再把錢賺回來。


    +   第1章 為什麼要停損？

    第2章 設定停損的認知

    第3章 設定停損4方法

    第4章 絕對停損的時機'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 第1章


    # 為什麼要停損？


    即使是股神巴菲特，在上次全球金融風暴中，他的波克夏公司仍虧損了17億美元。因此，散戶投資股市前要有認知，股市是高風險的投資市場，想要成為長期贏家，一定要先學會停損賠錢的功夫。換句話說，執行停損，是股市操作必備的能力。


    散戶賠大錢的最重要原因就是不肯賠小錢，做多進場後，如果走勢下跌，往往都抱著期望，希望股價能夠止跌回升。這樣的期望不切實際，經常事與願違，結果最後多被套牢，或者大賠出場。


    # 停損避開大災難


    股市操作不可能百分之百成功，我們看2011年的股王宏遠電（2498），即使買在最高點1300元，如果嚴守1275元的停損紀律，於第2天的大跌收盤1210元停損出場，只損失90元，賠了6.9%。'
  merge: -1
  img_proc: true
