- pgno: 54
  md: '# Part 2


    # 5大實戰步驟


    我們把每次進場買股票，當做一次交易，每次交易流程包含下面5個步驟，如果對每個步驟都能做好細部規劃，並採取正確的動作，在股市中賺錢就變得很 容易。能否徹底執行這些步驟，才是成功的關鍵。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# 操作流程5大步驟


    ![](img/eba4f38becd57965eb8bb34492948440_55_0.png)


    # 步驟1 選股


    +   - 從基本面、題材面、主流類股、強勢股選股。\n- 從技術面選股。\n- 建立資料庫鎖股。


    # 步驟2 進場


    +   - 做好資金分配，規畫進場數量，採取一次或分批進場。\n- 技術面符合條件，決定做多或做空，做長線波段，還是短線價差套利。\n- 在多空最有利的進場位置，於日線進場。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 步驟3 停損


    +   ○ 進場後立刻設好停損。

    ○ 停損設定後不能更改。

    ○ 嚴格執行停損。

    ○ 停損結束交易後，再回到步驟1選股。


    # 步驟4 操作


    +   ○ 依據短、中、長線，選擇固定的操作方法。

    ○ 定心定法，守紀律操作。


    # 步驟5 停利


    +   ○ 依操作定法的紀律停利。

    ○ 固定獲利目標的停利。

    ○ 支撐壓力的停利。

    ○ 型態目標的停利。

    ○ 重大突發危機停利。

    ○ 停利是全部交易的結束，停利結束後，交易再回到步驟1選股。


    # 操作流程小叮嚀


    +   ① 操作流程的5大步驟缺一不可，每個步驟同等重要，必須專心做好每個步驟，才能成功。

    ② 每個流程都是獨立運作，完成停損或停利後，都是另外一次交易的開始。

    ③ 任何交易無法百分之百成功，每次進場時，斷風險的控管永遠擺在第一位，要嚴格執行自己訂定的停損。'
  merge: -1
  img_proc: true
