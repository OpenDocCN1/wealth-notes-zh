- pgno: 203
  md: '# 該賠就賠 賠就是賺


    如果嚴格執行停損，正常情形下，損失大約7%，能將風險控制在這個範圍，我們可保有93%的本金，等待好機會，選擇強勢的好股票（不一定是原來賠錢的那檔），只要能獲利7.5%以上，就可以反敗為勝。


    反之，如果不停損，像宏達電、味全那樣造成巨大損失，之後就很難回本了。因此我說「該賠就賠、賠就是賺」——停損是該賠的，停損後避開的大跌，就是賺。停損後保留資金，才有反敗為勝的機會，想一想，是不是很有道理？'
  merge: -1
