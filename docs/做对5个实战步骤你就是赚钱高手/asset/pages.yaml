  md: '# ① 多頭總宗轉空頭的弱勢頭部


    情況1 盤頭期間，出現大量的出貨賣壓，頭部空頭確認，為弱勢下跌潛力股（出現在週線更好）。


    ![](img/eba4f38becd57965eb8bb34492948440_112_0.png)


    ① 日勝生（2547），週線頭部盤整期間，每個高點都出大量。


    ② 長黑K線跌破頭部盤整低點，一路弱勢下跌到9.75元。長黑K線下跌時，沒有爆大量也一樣會下跌，因為：


    +   • 空頭趨勢確認，趨勢就是力量。

    • 頭部盤整期間的大量K線，後來都被跌破，這些大<|message|>成為下跌的壓力。

    • 頭部大量下跌，這些大量為主力的出貨量，主力手中的股票賣出之後，股價自然會跌。有時空頭剛開始時，散戶還不自覺或抱持還能上漲的希望而沒賣出，所以不一定會出大量。


