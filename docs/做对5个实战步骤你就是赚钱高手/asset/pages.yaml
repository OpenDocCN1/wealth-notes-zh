- pgno: 240
  md: '# 長趨勢和短趨勢


    趨勢本身可以分為長趨勢和短趨勢：


    +   1. 看「盤中分時圖」的走勢圖做「趨勢操作」，是依據當天盤中的趨勢變化操作。 2. 看「日線圖」的走勢圖做「趨勢操作」，是依據每天的趨勢變化操作。
    3. 看「週線圖」的走勢圖做「趨勢操作」，是依據每週的趨勢變化操作（P. 235的「富晶通週線圖」就是週線圖的趨勢長線操作）。 4. 看「月線圖」的走勢圖做「趨勢操作」，是依據每月的趨勢變化操作。


    因此，用時間越長的趨勢圖做趨勢操作，操作的時程也就會越久。


    # 長線日線趨勢操作


    用「日線圖」的走勢圖做「趨勢操作」時，當日線符合多頭趨勢確認時進場，當日線趨勢變成空頭時出場。「週線圖」的走勢圖當時可能只是空頭的反彈，所以，只能在日線上做趨勢操作。'
  merge: -1
  img_proc: true
