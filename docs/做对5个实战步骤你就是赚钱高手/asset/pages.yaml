  md: '# Part 3 ▶贏家策略


    大立光在2014/7/17～10/27的3個月，股價由2640元跌到1950元，下跌26%。同時期的營業績效，第3季累計每股賺108.66元，持績成長70.6%，獲利創新高。


    至於玉晶光（3406），雖然營業賠錢創新高，可是趨勢轉多頭，股價照樣飆漲（見下頁圖）。


    玉晶光在2014/9/9～9/23的2週期間，股價由84.9元漲到123.5元，上漲45.6%。同時期的營業績效，第3季累計每股賠−7.98元，持續賠損。


    ![](img/eba4f38becd57965eb8bb34492948440_323_0.png)


    +   ① 玉晶光（3406），2014/9/9多頭確認，均線3線多頭排列，收盤84.9元做多。 ② 黑K轉折下跌，收盤110元賣出，獲利25.1元，獲利率29.5%。
    ③ 空頭確認，均線3線空頭排列，收盤100元做空。 ④ 紅K轉折上漲，收盤82.6元回補，獲利17.4元，獲利率17.4%。 ⑤ 多頭確認，均線3線多頭排列，收盤94.4元做多。
