  md: '# 第4章


    # 要投資穩穩賺

    別投機賺價差


    在一次退休同事聚餐上，我遇到一位昔日長官的夫人，她聽說我對股票略有研究，便問我，若是投資股票被套牢了，該怎麼辦？


    原來，長官於2007年退休時，領了一筆退休金，想說放在銀行利息很少，而去買股票，認為配股配息的獲利率較高，於是挑選了台灣資產最大、經營穩健的金融股國泰金（2882），並於2007年7月，國泰金股價由高點92元下跌到86元時買進；然而，國泰金卻從此一路往下，去年初聚餐時，股價已剩37.4元。一檔股票抱了6年，投入的資金就賠了56.5%，即使配了幾年的股利，也不够彌補賠掉的本錢。


    大多數散戶進入股市都有一個盲點，認為買股票是「投資」，但是真的買進股票之後，確是抱著「投機」的心態，總希望自己買的股票夠能快速上漲，如股價不漲或下跌，就賣掉；要不然，就是想投機買進，希望能夠快速賺錢，結果股價'
  merge: -1
  img_proc: true
- pgno: 44
  md: '下跌，又捨不得停損賠錢賣出，甚至覺得公司本質還不錯，所以改成長期投資，想分得股息股利，結果造成長期下跌套牢，本金損失慘重。其實，這些做法都不能算是投資。


    上面這些做法是投資與投機不分，操作腳步紊亂，當然不可能操作出好績效。所以，在準備一筆資金投入股市之前，應該要先想清楚，是要「投資」一檔股票，領取股息股利，還是「投機」一檔股票，賺取差價；這兩者的條件和操作方法、策略大大不同。接著，就把投資與投機的差異分別敘述如下：


    # 投資賺股利


    ○ 買股票的目的


    +   1. 打算長期持有。\n2. 以獲取穩定分配股息、股利為目的。\n3. 當股價大幅上漲時，也可賣出股票賺取價差，賺取獲利。


    ○ 選股的標的


    要投資好的股票，盡量在台灣100、台灣50、富櫃100中，挑選基本面好的標的。


    ○ 選股的方法


    +   1. 以基本面為主


    公司財務及營業狀況，包括公司股本、公司資產、營業項'
