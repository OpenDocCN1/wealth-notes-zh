  md: '# Part 1▶積極備戰


    # 金剛3 均線


    葛蘭畢（Joseph Granville）發明的均線，以不同期間的收盤平均值繪成曲線，是一種收盤平均成本的概念。觀察股價在均線之上或之下，可以看出股價的強弱走勢變化。


    ![](img/eba4f38becd57965eb8bb34492948440_19_0.png)


    觀察5日、10日及20日均線的變化，可以掌握股價方向。


    +   ① 3條均線相互穿梭交叉，行情上下振盪。 ② 3條均線排列整齊，同時向上，行情上漲。 ③ 3條均線又相互穿梭交叉，行情上下振盪。 ④ 3條均線排列整齊，同時向下，行情下跌。


