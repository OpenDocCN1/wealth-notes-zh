  md: '# 第3章


    # 選股SOP：

    中線做多


    中線操作股票，當股票的週線完成下列幾項條件時，可以中線做多：


    +   1. 趨勢條件

    週線波浪型態（趨勢）符合「頭頭高、底底高」的多頭架構。


    +   2. 均線條件

    週線的均線3線（MA5、MA10、MA20）多頭排列，均線方向向上（注意：MA60如果還在股價上方，而且是下彎走勢，當股價上漲靠近時，會有壓力產生）。


    +   3. 股價位置

    股價收盤在週線的均線3線（MA5、MA10、MA20）之上，同時看股價在整個上漲趨勢中，是位居初升、主升或是末升階段。


    +   4. 成交量

    週線底部打底時有大成交量（代表有人在買），發動攻擊向'
  merge: -1
  img_proc: true
- pgno: 74
  md: '上上涨的K線有攻擊量（當週成交量比前一週成交量增加1.2倍以上，如果有2倍以上的量，攻擊力道更強）。


    # 5. 指標參考


    週線KD 指標黃金交叉向上，MACD指標多頭排列向上，OSC綠柱轉紅柱。


    # 6. 可能的獲利目標


    +   ○ 上面MA60、MA125均線的壓力。\n○ 前面（由右向左看）轉折的低點（底部）和高點（頭部）的壓力。\n○ 前面盤整區壓力。\n○ 前面大量向下跳空，形成缺口的壓力。\n○
    前面出大量的K線被跌破之後，再上漲時前面的出大量的K線造成的壓力。\n○ 下跌趨勢形成的下降切線壓力。\n○ 如果是型態突破後的上漲，型態的目標價滿足點也會形成壓力。


    # 7. 等待進場位置


    +   ○ 週線多頭回檔後再上漲的紅K，在日線進場。\n○ 週線多頭盤整突破上漲的紅K，在日線進場。（詳見〈步驟2：進場〉）'
  merge: -1
