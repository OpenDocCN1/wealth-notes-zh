  md: '# 第3章


    # 設定停損4方法


    設定停損有4種方法：進場K線高低點、趨勢轉折高低點、均線停損法、固定停損比例法，以下將搭配範例詳細說明。


    # 方法1：進場K線高低點


    以進場K線高低點設定停損，可分為進場做多停損和進場做空停損。


    # 進場做多停損：守進場紅K線的最低點（含下影線）


    +   1. 進場紅K線若小於2.5%，停損可以由紅K線的最低點再向下放寬2碼，否則停損太小，容易被主力洗盤而賣出。例如停損紅K線的最低點是62元，向下放寬2碼是61.8元。紅K線的最低點是105元，向下放寬2碼是104元。
    2. 進場位置在走勢波段高檔，出現放大量的長紅K線（漲幅大於4.5%），停損可以改在長紅K線的二分之一位置（長紅K線'
