    日線KD指標黃金交叉向上，MACD指標多頭排列向上，OSC綠柱轉紅柱。


    # 6. 可能的獲利目標


    +   o 上面季線、半年線、年線的壓力。

    o 往上（由右向左看）轉折的低點（底部）和高點（頭部）的壓力。

    o 往上盤整區的壓力。

    o 往上大量向下跳空形成缺口的壓力。

    o 往上出大量的K線被跌破後，造成後來上漲的壓力。

    o 下跌趨勢形成的下降切線壓力。

    o 如是型態突破後上漲，型態的目標價滿足點會形成壓力。


    # 7. 等待進場位置


    +   o 多頭回檔後再上漲的大量中長紅實體K線。

