- pgno: 176
  md: '為何需要用到這麼多比喻呢？這是因為只用一個比喻的話，對方可能無法完全理解。


    # 對方能理解的比喻才有意義


    有些比喻可以配合對方的經驗來使用。


    以上述例子來說，如果對方有在踢足球，可試著將棒球改成足球；如果對方是業務員，可配合對方的職業改用「通常都是決定好要拜訪的公司，才會出辦公室吧？」


    無視對方的狀況、經驗和思維的比喻，毫無效果可言。


    舉例來說，「就像建構 I V R 的時候一樣」這種說法，能理解的只有極少數的人吧（順帶一提，IV R 是互動語音回覆系統）。


    如果能配合對方的狀況或經驗來做比喻，你說話的話就會變得非常好理解。'
  merge: -1
  img_proc: true
