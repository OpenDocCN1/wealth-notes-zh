  md: '「上次謝謝您，非常高興能與您碰面。我目前從事系統諮詢的工作，如果有我幫得上忙的地方，請隨時跟我說。如果您方便的話，我們能不能約下週或下週，讓我了解一下貴公司的系統狀況呢？再麻煩您確認時間。」


