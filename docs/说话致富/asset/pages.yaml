  md: '# 前言

    好好說話，能讓你致富！


    問你一個問題。


    > 「你想年收一億元(編按：本書中的幣值皆為日圓，一日圓約等於新臺幣○・二七元，若出現其他幣值，會特別標示)嗎？」


    其實，不管你想或不想都不是最主要的問題。因為工作關係，我常會遇見許多有錢人，「很少有人是因為想賺到一億元而賺到的」。這是我看過許多有錢人之後的真心話。


    他們不是因為「超想賺一億元」，所以想辦法達成目標」，而是「一心專註眼前的工作，結果達到了年收一億元」。


    請試著想一下，如果你看到一個人到處說：「給我一億元！」你會覺'
  merge: -1
  img_proc: true
- pgno: 12
  md: '得他很厲害嗎？反而會退避三舍吧。


    要成為一個能夠賺錢的人，關鍵在於「讓人聚集在自己身邊」。這是許多成功者的共通點。機會總是由人介紹的，眾人聚集在自己身邊才會迎來機會。換句話說，「年收一億元者」的說話術，就是讓眾人聚集在自己身邊的溝通術。


    美國普渡大學的一項研究，持續五年以上追蹤並記錄該大學的畢業生後，發現了一項驚人的結果。「擅長處理人際關係者，年收比學業成績異者多出約一五％，不擅長處理人際關係者多出了約三三％。」


    此外，美國《Wall Street》的總編輯威爾弗雷德·芬克曾對幾千名成功人士進行調查，結果顯示：


    +   「賺錢能力和表達技巧有很密切的關係，所以磨練語言使用技巧，收入就會增加。」換言之，說話術會直接影響到你的賺錢能力，想成為一個會賺錢的人，就必須磨練說話術。所以我将本書想傳達的溝通技巧和思維，命名為「一億元說話術」。'
