- pgno: 74
  md: '# 「有人望者」所擅長的事情


    「岡崎，如果你想成為大老闆，賺到年收一億的話，最重要的就是聚集人望。」


    這是我在集會上問導師「年收一億的人，都是些什麼樣的人」時，所得到的回答。


    **有人望者，做任何事情都會留下成果。**


    因為一般人不會想拒絕有人望者的要求，反而會想方法達成它。他們的腦中會受到驅使，就是想要為他盡一份力量。


    什麼是「有人望」呢？舉例來說，你遇到一位知識豐富，上知天文下知地理的人，你會覺得他是有人望的人嗎？很遺憾，就算知識豐富也不見'
  merge: -1
  img_proc: true
- pgno: 75
  md: '得能聚集人望。


    如果是賣弄知識，態度粗魯傲慢的話，別說是人望了，大家反而會覺得這種人「只是仗著自己的聰明罷了」。換句話說，有無人望和聰明與否無關。


    那工作能力強的人又如何呢？這也不見得能聚集人望。在你的職場上應該也有「工作能力强卻惹人厭」的人吧？職場上不見得工作能力强就會有人望。換句話說，能力高低也和是否有人望無關。


    當然，金錢、權力與權威也一樣無關。


    翻開字典，對「人望」一詞有以下釋：「眾人間的聲望，受到大家的推崇。」聚集人望最重要的關鍵字就是「受人期待（推崇）」。可說是愈受人推崇，就愈有人望。所以想聚集人望，重點在於是否受人期待，以及是否有回應期待。那麼，眾人會對你抱有什麽期待呢？


    眾人期待「你能增加他們的自尊心」。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '自尊心有就是「保持自己的尊嚴，不容別人歧視、輕蔑與侵犯的心理」。換句話說，對方如果感受到你尊重他，他們就會願意相信你。舉個例子，如果你身邊有個總是瞧不起你的人，你會怎麼想呢？應該不會想和他相處吧。因為他會貶低你的自尊心。


    反之，如果是非常關心你，總是願意傾聽你的聲音，而且會很高興，覺得你說的話很棒！身邊有這樣的人，你覺得如何呢？應該會想多與他相處吧。因為他讓你感覺自己說的話，甚至是你這個
    사람은有價值的。換句話說，他的存在提升了你的自尊心。


    # T—UP的能力會影響人望


    大家都說「成功人士擅長T—UP」。T—UP是指主動推崇他人。舉例來說，主持人在演講前介紹講師，這就是一種T—UP。如果是'
  merge: -1
  img_proc: true
- pgno: 77
  md: '本人自己介紹自己的經歷，或目前在哪個領域崭露頭角，聽起來會像老王賣瓜，但如果是透過別人介紹的話，感覺就會很自然。


    就算是一流的講者，少了T-UP，也會比較難吸引觀眾的注意。


    如果是藝人等超級有名的人物，即使什麼也不做，大家也會注意聽他說話；但如果是上市公司的董事長，大多數人也不會知道他的名字。在多數的情況下，可能連企業名也沒什麼人知道。因此，要是少了T-UP，介紹對方是「董事長」，想讓其他人聽他說話，相對來說比較困難。


    # 擅長T-UP的人容易聚集人望。


    > 我的導師說：「對方照顧過你，你這輩子都要感謝他。」


    > 「總之在人前，就算只是雞毛蒜皮的小事，也都要表達感謝之意。」


    如果是一年前受到對方的照顧，你可以這樣T-UP：


    > 「這位是○○，我以前有困難的時候，曾經幫助過我。當時受到他諸多的關照。」


    聽到你這番話，對方也會有好心情，就更想替你加油打氣吧。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '但希望大家注意一點，就是當別人推崇你的時候，如果總是拘泥於過去曾經幫過對方，因此與對方在��際關係上形成一種優越地位（上下關係），這將會讓你失去人望。


    所以，此時應該反過來推崇對方。


    你可以這麼回應：


    「沒有沒有，你太客氣了，是因為你的努力才會這麼順利。勤奮努力的人真的好厲害！」


    透過互相推崇能加深彼此的信任感，進而從周圍聚集人望。


    想要聚集人望，你的存在必須能提升周圍的自尊心想，特別是ＴＵＰ能力。讓自己成為擅長推崇對方的人吧。


    ![](img/1651471ea930b1a41ae8eb834ce80984_78_0.png)


    # 在溝通談話中提升他人的自尊心。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '# 提升對方「自我肯定感」和

    「自我重要感」的說話方式


    什麼是「提升自尊心」的說話術呢？簡單來說就是「讓周圍愉快的說話方式。」


    跟你見面時會覺得很開心，感覺自己非常有價值，所以會想要多與你見面，變得更加喜歡你。


    這種感覺稱為「自我重要感」或「自我肯定感」。


    +   - 「自我重要感」是指認為自己是重要的存在。

    - 「自我肯定感」是指能感受到自身存在的價值。


    這些「自我」相關的價值，是一種金字塔結構。

    如下頁圖所示，必須逐一提升自己的層級。只有滿足自我肯定感，才'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 「自我」相關的價值觀結構


    ![](img/1651471ea930b1a41ae8eb834ce80984_80_0.png)


    能往上升到自我重要感。


    那實際在會話中，該注意哪些地方，才能提升旁人的自我重要感或自我肯定感，也就是自尊心呢？


    這裡必須注意到下列所提出的「對話三訣竅」：


    +   **提升對方自尊心的對話三訣竅**


    **① 聆聽**


    要提升對方的自尊心，沒有比仔細聆聽對方說話更...'
  merge: -1
  img_proc: true
- pgno: 81
  md: '重要了吧。人類是一種想說話的生物，會希望對方能聽自己說話，但其他人也一樣都在主張自我，沒有幾個人願意認真聽別人說話。


    在這種情況下，如果能遇到願意仔細聽你說話的人，你會有什麼感覺呢？應該會很感謝對方願意聆聽。因為對方愈是聽自己說話，就會覺得自己愈有價值。換句話說，你會感覺自己是一個有存在價值的人。


    這就是一種提高自尊心的方式。願意傾聽的人很少，所以如果你積極擔任聆聽者的角色，對方就會覺得你是一個珍貴且值得尊敬的人。


    所以從結果來看，懂得傾聽的人會聚集人望。


    有人說：「說話是技巧，聆聽是器量」。說話方式能透過練習變得好，而聆聽則是一種心態，能展現器量。


    請試著回想今天或昨天的你，與周圍的人都聊了些什麼呢？你能記得多少內容呢？


    我猜想，你可能幾乎都沒記住。因為要聆聽別人說話，必須得集中意志力，而這並不是件簡單的事。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# ②稱讚


    我有一個朋友非常喜歡上酒店。先不評論愛去酒店是好還是壞，我曾經問他：「為什麼你那麼喜歡上酒店呢？」結果得到了一個有趣的回答。「因為酒店小姐會聽我說話，還會一直誇獎我，讓我心情很好，會想經常光顧。」


    男人為什麼會去酒店呢？有兩個最大的理由，就是想要有人聽他說話和誇獎他。


    酒保不是專業的調酒師，但一杯卻能賣到一千或兩千元。仔細想想，不覺得這很神奇嗎？男人會花這麼多錢，只是為了有人能聽他說話和誇獎他。


    不過相信女性也是一樣，在剪頭髮的隔天，如果有人對妳說：「妳剪頭髮啦」或「很好看耶」，應該不會有女性覺得討厭吧。


    不論男女，沒有人會因為被誇獎而感到不開心。誇獎別人時，使用下列三個關鍵字，就能巧妙的誇獎對方。'
  merge: -1
  img_proc: true
- pgno: 83
  md: '就是：「了不起」、「好漂亮」和「棒極了」。例如：


    +   「了不起！調整得很出色呢。」

    「好漂亮的領帶。非常適合你。」

    「○○說的話棒極了，我會馬上實踐。」


    這三句話是非常好用的稱讚詞彙。另外，希望大家注意「好優秀」一詞。這句話原則上是年長者對年幼者使用。在工作上是上司對下屬使用的詞彙。


    如果有小學生說：「你工作態度好優秀」，你會有什麼感覺呢？應該會覺得「為什麼我要被你打分數」吧。


    「好優秀」這句話在使用上可能會因為根據不同的對象，而不小心樹敵，要多加留意。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# ③ 傳達感謝


    「感謝」是指因受惠而表示謝意。


    那你知道感謝的相反詞是什麼嗎？答案是一理所當然。覺得理所當然就不會懷抱著感謝的心情。少了感謝的心，就不會尊敬對方，這會導致對方的自尊心低落。


    人不被感謝就會陷入自我否定感的世界，覺得「反正沒人需要我……」。


    很少被人感謝或主動感謝對方的人，就會活在自我否定感之中。要提升這些人的自尊心，最好的方法就是傳達感謝的心。


    傳達感謝之意，關鍵在於：感謝對方做了平常不會有人幫你做的事情。因為這樣能提升對方的自尊心。


    理所當然有人替你準備三餐；住在家裡的人，等你發現時已經有人幫你洗好衣服；在工作上即使失誤，公司也會如實撥付薪水，以及現在有許多方便的服務，讓你在生活上不太會有困擾。'
  merge: -1
  img_proc: true
