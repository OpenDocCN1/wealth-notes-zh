  md: '# （結論）


    「不管什麼事情都一樣，先決定目標，然後再選擇方法很重要。」「舉例來說，你想去大阪的話，應該會坐新幹線；如果是去東京車站可能會搭山手線；去附近的超市大概就是要腳踏車吧。每次都是先決定目的地，然後才選擇手段或交通工具不是嗎？」（比喻
