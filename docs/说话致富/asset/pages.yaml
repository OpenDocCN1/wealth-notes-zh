  md: '![](img/1651471ea930b1a41ae8eb834ce80984_183_0.png)


    記住，傳達时要落落大方和簡單明瞭。


    這跟告白一樣，拐彎抹角會被拒絕。想要拜託對方時，清楚傳達是最好的方式，例如：「請務必和我交往！」


