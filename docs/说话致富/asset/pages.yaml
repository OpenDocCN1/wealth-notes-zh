- pgno: 124
  md: '一定會有人覺得為什麼我要這樣被命令吧。詢問具有很大的力量。與其說「請數幾個「你」字」，不如說「你覺得有幾個「你」字」，這樣對方聽了才會想主動採取行動。所以，一旦被問「你覺得這件事情如何」，原本與自己無關的事情，就會逐漸變成自己的事情。想得到周圍的協助，請試著問對方：「你覺得如何」。


    # ③對我們來說（WE）


    進入二十一世紀後，「只要考量自己的事情就好」的時代已經結束了。前面的寓言故事也一樣，推大石頭的理由其實也是「為了眾人」。現在這個時代，會優先對應具有社會意義的事情，例如思考環境問題、消除種族和性別歧視，或給予弱勢族群平等的機會等。你想做的事情具有何種社會意義或價值呢？


