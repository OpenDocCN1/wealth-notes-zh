- pgno: 87
  md: '# 日本第一作家令人著迷的溝通訣竅


    事情是發生在作家永松茂久老師的百萬暢銷書慶祝派對上。


    那天我行程滿檔，但還是希望能出席，所以費了很大的功夫在調整行程。到了活動前幾天，我還是很難擠出時間，不過可喜的是，最後我還是出席了十五分鐘，盡可能的露面。


    當天不愧是永松老師的場子，到場來賓都是赫赫有名的人物。有幾位我見過很多次面，所以向他們打了招呼。


    其中有一位來賓是本田健老師。二〇一九年他用英文寫的商业書在美國出版，是日本商業書籍的頭號人物。


    說來不好意思，我因為當天前後行程的緣故，因此穿了較休閒的服裝'
  merge: -1
  img_proc: true
- pgno: 88
  md: '到場，本田老師問我：


    「岡崎，你怎麼穿得這麼休閒？」


    「其實是因為我前後還有其他行程，而且時間都排不開，所以今天只能參加十五分鐘，不好意思穿得這麼休閒。」


    對我來說，相較於盛裝打扮出席，反而是盡可能露個臉表達祝賀比較重要（先聲明一下，我的穿著沒有糟糕到不合時宜喔）。


    大致打完招呼後，我因為要趕下一個行程，所以先行離開了。


    由於大家都是難得才碰到面，於是我寄了封感謝信給所有人，後來得到本田老師的回信：


    「今天最讓我感動的，就是岡崎你專程趕來，只是為了能出席十五分鐘。真的是很了不起呢！」


    看到信我也嚇了一跳，因為我完全沒想到對方會回信，而且竟然還說那短短幾分鐘交談時間，是他今天最感動的地方，這讓我更加決定要成為本田老師的鐵粉了。'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# 人只要受到期待，就會產生符合期待的動力


    有人望著一定會用名字稱呼對方，這樣可提升親近感，對方也會很開心你記得他。對一個有人望，且善於和許多人交流的人來說，這是理所當然的事情。


    近年來默背能力不太受到重視，但要記住名字肯定要靠默背。順帶一提，日本前首相田中角榮，也說默背能力是必要的技能。聽說田中角榮忘記對方的姓名時會這樣問：


    +   「你叫什麼名字？」


    「我叫高橋。」


    「笨蛋！我知道你姓高橋，我是問名字。」


    回歸正題，用名字稱呼對方時，希望大家能注意一個重點。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '如果人很多的話，只有點頭打招呼也可以，或簡單說句「辛苦了」也沒問題。「感謝平日的關照」、「之前不好意思啊」等諸如此類都好，讓自己即使只有短暫時刻，也要稍微和大家交流一下。


    本田老師不管被多少人圍繞，都會有禮貌的逐一同大家打招呼。對一個人來說，這個「小小的招呼」非常重要。


    愈是有人望且忙碌的人，愈是沒時間，這點大家都心知肚明。但這樣的人卻願意在自己身上稍微花一點時間，這會讓人感到開心。


    如果對方是自己的下屬或工作相關人士，你就可以在言談之中，加上一點期待。


    人類在心理上，被賦予期望，就會想努力符合別人的期待。這稱為「畢瑪龍效應」，或是「期待效應」。


    舉例來說，在學校教育中，事先告訴老師說：「這名學生的成績進步可以期待」，該名學生的成績就會變好。因為老師對「學生的成績提升」抱有期待，而學生也會「想要回應老師的期待」。'
  merge: -1
  img_proc: true
- pgno: 91
  md: '![](img/1651471ea930b1a41ae8eb834ce80984_91_0.png)


    # 用名字稱呼對方並給予期待。


    人類會想要回應期待，而且如果你對一個人抱有期待，就會想協助對方達到目標。


    反之，如果你認為「反正這傢伙就是不會」，那你就不會想主動協助他，也不會想要教導他。對方也會覺得「反正你對我沒期待」，而不再採取行動。


    有人筆者總是會對人抱持期待。抱持著「你一定可以做到」和「有事請我會協助你」的態度很重要。'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# 超一流的人必定擁有幽默感


    回顧古今中外的歷史，有人望者都擁有幽默感。


    不知道是因為有幽默感才有人望，還是因為有人望才學會幽默感。但幽默感的確有聚集人望的能力。


    歷史上留下了許多名人的幽默語錄。


    > 「如果你打了半小時牌，仍然不知道誰是傻瓜，那麼你就是。」


    （華倫·巴菲特）


    「男人再怎麼親切也要有一定的堅持。金塊拿破布包裏還是金塊；石頭用錦緞包裏還是石頭。」


    （潿澤榮一）'
  merge: -1
  img_proc: true
- pgno: 93
  md: '> 「為什麼不搭頭等艙？因為頭等艙的抵達時間跟經濟艙一樣吧。」


    （比爾・蓋茲）


    > 「情敵送美女十朵玫瑰花，你就要送十五朵？當你這麼想的時候，你就已經輸了。」（史帝夫・賈伯斯）


    很有趣吧。這些人都有一個共通點，那就是：所述說的事情，都是出於自身體驗。


    有句格言說：「無魅力者述說知識，有魅力者述說經驗」。光說不練只會述說知識的話，就毫無魅力可言。


    你周遭有沒有這樣的人呢？非常博學，問什麼幾乎都能回答，可是卻感受不到人性魅力。


    大量知識卻感受不到魅力，原因在於裡頭缺少了體驗。


    說到體驗，失敗體驗比成功體驗更容易成為話題。所以只會挑安全路走的人，說話會很無趣。'
  merge: -1
  img_proc: true
- pgno: 94
  md: '有句話說：「成功的相反不是失敗，而是什麼都不做」，如果什麼都不做，就不會有成功和失敗。能夠失敗，就證明了你勇於挑戰了自己不會的事情。


    當然，一直重複相同的失敗那可不行，但挑戰後失敗了，沒什麼好丟臉的。失敗了反而應該開心，因為今後又多一個話題能與人交流。如此一來，失敗本身就會變成有價值的體驗。


    換句話說，不管挑戰的結果順不順利，都會為自己帶來幫助。所以害怕失敗而不敢行動，是最可惜的事情。


    # 準備自己獨特的必殺話題


    先準備幾個有幽默感，而且對方一定會好反應的話題吧。帶著幽默感說話時，最重要的是要有「標題」。


    單純用時間序列說話一點都不有趣，所以以下會吸引注意的標題很'
  merge: -1
  img_proc: true
- pgno: 95
  md: '重要。我有一個當老闆的朋友很有趣，他下標題的技巧很好，會用幽默的話題引人發笑，這邊容我來介紹一下他的故事。


    這故事的標題是「新橋的灰姑娘」。內容是，聽說有一次他在東京新橋喝酒喝到失憶，等他發現的時候，已經躺在馬路上。


    聽到這裡我忍不住笑他年紀一大把了，還睡在馬路上，但重點是接下來發生的事情。他的公事包、錢包、手機等，全部都不見了，甚至還少了一隻鞋子。


    當他到警察局詢問時，赫然發現局裡有一些遺失物品好像是他自己的。問題是他身上沒有身分證，所以警方不願意歸還。


    傷腦筋的他，一陣苦惱後，注意到了一件事：「有隻鞋子跟我的東西放在一起。如果那隻鞋子跟我腳上這隻一模一樣，那我就是本人吧。請讓我確認一下！」


    想當然，兩隻鞋子完全一樣。最後警方總算把所有東西交還給他。


    所以他將這個話題取名為「新橋的灰姑娘」。'
  merge: -1
  img_proc: true
- pgno: 96
  md: '他竟然能把遺失一堆東西的糟糕體驗，變成了一個笑話，可說是他的魅力所在。


    當然也要看時間、地點和場合。總而言之，可以準備一些「講這個大家一定會笑」的必殺話題吧。


    要準備話題時，最重要的就是用口語寫下來。


    專業的講者一定會寫講稿，不是因為他們是專家才寫稿，而是因為他們寫了稿，才變成專家。連專家都會寫講稿了，更何況是身為外行的我們，如果不寫稿，想到什麼就說什麼，那就更不可能說出令人會心一笑的內容了。


    寫講稿的訣竅是：務必一字一句的完整寫出。


    有人會用條列名詞的方式書寫，這種方法在說話時，完全派不上用場。可以的話，盡可能將「間隔時間」一併寫上。例如「這裡需間隔三秒……………」諸如此類。


    這樣一字一句寫出講稿後，就可以開始練習演講。光用頭腦思考，表'
  merge: -1
  img_proc: true
- pgno: 97
  md: '![](img/1651471ea930b1a41ae8eb834ce80984_97_0.png)


    +   用口語寫下講稿後，透過反覆練習準備好話題。


    達方式不會變好。應該實際發出聲音反覆練習。視情況還可以找人當聽眾，並進一步改善講稿。


    要讓說話方式有幽默感，最重要的就是講稿和練習。紮實且反覆練習，學會能聚集人望的說話方法吧。'
  merge: -1
