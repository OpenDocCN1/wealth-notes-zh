  md: '# 億萬富翁都懂得「體貼」和「貼心」


    人脈廣的人大多都懂得「體貼」和「貼心」。眼懂得體貼和貼心的人在一起會很舒服，所以眾人會聚集在他們身旁，這點無庸置疑。但意外的是，在這個時代有許多人做不到。


    你有想過體貼和貼心有多麼重要嗎？我和一位我尊敬的企业經營者一起吃飯時，第一個注意到杯子空了，並幫大家倒水的人，是我的直屬導師。他比店員和其他人早一步注意到這件事。


    能觀察四周環境並注意到身旁的人是否感到困擾，且適時的提供協助，這就是一種體貼的表現。


    體貼的程度會決定一個人是否成功。因為一帆風順的人也很擅長體貼'
  merge: -1
  img_proc: true
- pgno: 55
  md: '別人。由此可見，「覺察力」會成為工作或人際關係的必備能力。


    作家兼研究人員的山口周老師，在《成為新人類》這本書中提


    到，在現今社會，相較於「解決問題的能力」，會更需要「發現問題的能力」。他所謂的「發現問題的能力」，指的就是「覺察力」。


    那什麼是貼心呢？以刪才的飯局為例，假設大家聊得非常開心。在這種情況下，不去打斷談話，並且為了能讓對方暢所欲言，於是刻意集中精神聆聽對方說話，即使想去倒水也先忍住，這就是一種貼心。


    換句話說，貼心就是「替對方著想」的能力。推測對方的想法和感受，並做會使他開心的事情。懂得貼心的人，能得到所有人的尊敬。


    有一次，我的朋友舉辦出版紀念演講，他和牙科醫師兼作家的井上裕之醫師只見過一次面，但井上醫師卻專程送了大花圈來祝賀。這正是一種貼心的舉動。就算人不在現場，一樣會去思考怎麼做才會讓對方開心。所以井上醫師受到許多人的信任和支持。簡單來說：'
  merge: -1
  img_proc: true
- pgno: 56
  md: '「體貼」：考量現場狀況，減少困擾的事情。


    「貼心」：重視對方的行為。


    能一起做到體貼和貼心當然最好，不行的話，可以先從體貼開始學習。因為體貼是「去意識現場發生的事情」，所以任何人都做得到。為此，你需要具備「三種眼」。


    # 學習體貼應擁有的「三種眼」


    +   ① 鳥眼


    綜觀全局，試著去觀察「整體」該如何行動。先從掌握整體的狀況開始吧。'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# ②蟲眼


    要拘泥於細節，注意小地方。訣竅是：當你想體貼一個人，可先注意對方的視線或細微動作。


    舉例來說，水是否快喝完，可以用杯子的傾斜角度來判斷，就算用非透明的杯子也可以輕易觀察。另外，如果對方一直看時鐘，表示他很在意時間。從對方的言行舉止中，可以看出他的意圖和真正想做的事情。


    如蟲眼般觀察對方的視線和舉止，注意細微之處。


    # ③魚眼


    學會感受整體「潮流」的能力吧。我和關照我的人去吃飯時，會盡可能掏錢請對方。因為我從他們那裡得到了許多資訊或意見，所以請客這點小事也是理所當然。


    當我知道飯局差不多要結束時，確認沒有人要加點東西後，我通常都會用去洗手間的理由離開位置，其實是先去結帳。'
  merge: -1
  img_proc: true
