  md: '# 想成為億萬富翁，溝通能力很重要！


    我先來介紹一些年收一億元的成功人士吧。如果你想增加現在的收入，或者是賺到年收一億元，那就必須知道工作方式有種類之分。

    關於這點，詳細內容我已經在前一本著作《為什麼他有錢又有閒？上班族也能財務自由，人氣創業導師的最強富人法則》中提過，所以這邊就簡單介紹概要。


    以全球暢銷書籍《富爸爸，窮爸爸》聞名的羅勃特·清崎，在《富爸爸，有錢有理：掌握現金流象限，才能通往財富自由》一書中，提倡可將工作方式分為四個象限。

    首先，各象限沒有對或錯。'
