  md: '後來我們決定簽租賃契約。但我當時還是個菜鳥，所以沒把上述的話變成白紙黑字。


    結果你猜如何？


    我們樓下居然是黑道的辦公室！


    這我只能用訝異來形容。房仲明明說週末沒人，但「道上兄弟」週末也會進出，而且如果想用電梯的話，還會被他們閒言閒語。


    過了兩年重新簽訂契約時，租金還被大幅調漲，當時我們初期投資的資產還沒回收，所以只能忍氣吞聲掏錢，陷入悲慘的景況。


    # 重要的事情一定要白紙黑字，留下紀錄


    這讓我上了一課，知道在談生意時，不管你有多相信對方，都一定要簽約，包含口頭確認的內容都一定要留下紀錄。


    談生意時，有些人會說：「我們都相信對方，不需要簽約吧？」'
  merge: -1
