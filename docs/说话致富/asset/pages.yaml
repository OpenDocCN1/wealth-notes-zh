  md: '# 即使再信頼對方，

    也務必記得「存留證據」


    最好別和會引起問題的人有所瓜葛。但有時就是避免不了，所以我會告訴各位，和他們對話時該注意的事項。


    這是我以前做出租會議室事業的事情。我看了各種物件，終於找到一個適合當出租會議室的地方。


