  md: '# 麥拉實法則告訴你，溝通的關鍵在於「非語言訊息」！


    平常你會參加講座嗎？參加講座能得到的資訊應該會比讀書更多。


    但仔細想想，書本的內容其實有更多的資訊量。我自己也會以書籍當成演講的題材，每每講一章就得花費一個小時到一個半小時。因此在時間有限的條件下，說話內容的資訊量其實遠不如書籍。


    然而，在講座聽到的內容卻比較有記億點。這是因為「麥拉實法則」。


    「麥拉實法則」主要立論是說，人類傳達資訊的手段分為三類。


    ①語言訊息：內容、辭意'
  merge: -1
  img_proc: true
- pgno: 180
  md: '+   ③ 視覺訊息：外表、表情、儀態、眼神


    +   ② 聽覺訊息：音量、音調、語速、音質


    這三種傳達手段所占的傳達比重各是多少呢？答案如下：


    +   ① 語言訊息：七％


    +   ② 聽覺訊息：三八％


    +   ③ 視覺訊息：五五％


    想不到語言訊息所占的比重只有七％。


    # 使用肢體語言，簡單明瞭的傳遞訊息


    剩下九三％是非語言的「聽覺訊息」或「視覺訊息」。所以當你在傳'
