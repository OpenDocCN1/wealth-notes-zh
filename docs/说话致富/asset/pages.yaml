  md: '這樣的「人不管擔任多偉大的職務，你都不會信任他或替他加油吧。他的確有能力，可是卻很討厭又令人感到匪夷所思：愛擺架子又傲慢，給人不懂得體貼他人的印象。在這個時代，不會有人追隨這種人。因為，高度溝通能力的基礎在於尊敬他人。


