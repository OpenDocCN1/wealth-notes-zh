  md: '近現實並不重要。就算目標不切實際，只要讓計畫貼近現實就好。人生只能得到自己期望的東西。先試著從放大期望開始吧。「


    如果不是因為這場演講改變了我對金錢的觀念，恐怕我也不會真心想賺到年收一億元吧。當然我不會說以一億元為目標就是正確答案。再重新問你一次。


    你是「認真」想年賺一億元嗎？


