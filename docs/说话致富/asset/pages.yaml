  md: '# 為什麼億萬富翁不會說「下次再約」？


    「謝謝你。我們下次再約時間見面。」看著某位男性精神抖擻的離開後，我的導師對我說：


    「他還需要再磨練一段時間。」


    剛才我們明明聊得很開心，對方也沒留下半點不好的印象，所以聽到這句話，我感到很意外。


    「為什麼？」


    他離開前說：「我們下次再約時間見面」，對吧？沒有一種機會叫「下次」。有句話說：「明確就是力量」，用詞模糊可只會招來模糊的結果；反過來說，說話明確就會得到明確的結果。如果你真的想和對方再'
  merge: -1
  img_proc: true
- pgno: 60
  md: '次碰面，應該要說：『我希望還能與您見面，我可以調整一下行程後，晚點與您聯絡嗎？』或是問：『下個月有空嗎？』『諸如此類。如果想要藉助我的力量，那至少要當場約下次見面的時間，或是跟對方說好會另外約時間，讓雙方有下次見面的機會再離開才對。」


    你或許會覺得對方這麼忙，一直跟對方聯絡不太好意思。但成功者其實意外的有時間。甚至有時候你開口麻煩他們，他們還會爽快答應。


    會受人喜愛的人都有一些特質，那就是「開朗」、「坦率」、「有朝氣」和「厚臉皮」。


    總是很客氣的話，是不會受人喜愛的。因為成功者不會因為你在旁邊等待，就主動出手協助。你必須主動才能抓住機會。


    順帶一提，後來我聽說那位男性事後連一封感謝信都沒有寄。這樣的話，如此難得的緣分就會很難延續下去。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 延續良緣的兩個訣竅


    你結交了新朋友後，如果想延續這個緣分，請務必做到兩件事：


    +   ① 約下次見面的時間

    ② 傳送感謝訊息


    讓我來詳細說明這兩點。


    +   ① 約下次見面的時間


    要與一個人建立信賴關係，見面次數的多寡比時間長短更重要，這是人類的心理。別以為只見過一次面，雙方就能擁有深厚的信賴感，這種想法大錯特錯。所以一定要約下次見面的時間，這點相當重要。


    做事有一個所謂的「七十二小時法則」，意思是人必須在七十二小時'
  merge: -1
  img_proc: true
- pgno: 62
  md: '內，採取下一個行動，否則之後就不會再去做。可能的話，最好在交換聯絡方式後的三天之內碰面。雖然要在這麼短的時間做到可能很困難，但至少可以在三天內聯絡對方，約好下次見面的時間。對於想加深信賴關係的人，務必要約下次見面的時間。


    有人說：「糾纏不休超過一定的程度，就會變成熱誠」，但我不會要求大家做到那樣的地步。不過，如果是自己重視的缘分，就算是半年後也好，一年後也罷，至少要約好下次見面的時間。


    要是這麼提早約，也約不到對方的話，該怎麼辦呢？那也只能死心，當作彼此沒緣分了。重要的是，你要抱著「不惜久候也想再和對方見一面」的心情。


    # ② 傳送感謝訊息


    傳送感謝訊息非常重要，而且CP值相當高。因為有很多人連道謝這點理所當然的事情都不會。會這麼做的人很少，所以非常容易讓對方留下'
  merge: -1
  img_proc: true
- pgno: 63
  md: '深刻印象。


    傳送感謝訊息最重要的就是速度，請記住：速度遠比內容更重要。如果想傳送有禮貌的長篇文章，會比較花時間。要是一個不小心，等你寫完後，對方可能已經忘記你了。


    所以只要寫一篇短文就足夠了，先重視速度吧！


    「今天非常感謝，很榮幸能和○○見面。我想先嘗試一下您給我的××建議，結果請容我事後再向您報告。今後也請多多指教。」「這篇文章看似簡潔，但包含了以下三個重點：


    +   ① 已確實接納對方的建議

    ② 有意願執行該建議

    ③ 會再和對方聯絡報告結果


    一篇短文已經包含了這麼多的資訊，所以不需要拚老命花時間寫長篇'
  merge: -1
  img_proc: true
- pgno: 64
  md: '作文了。


    立場交換，如果在碰面後的幾分鐘內，你立刻收到這樣的感謝訊息，會有什麼感想呢？


    應該會留下正面的印象，覺得對方「很有禮貌」、「很認真」或「效率高」、「很能幹」吧。


    在任何事情上「速度∥熱情」，而道謝時「速度∥誠懇」。因此，與人見面後立刻傳訊息感謝，應該沒有比這更能留下好印象的方法，請務必實踐看看。


    # POINT 8

