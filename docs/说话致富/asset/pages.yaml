- pgno: 41
  md: '當然是珍惜舊朋友會輕鬆得多。所以在追求新人脈前，希望大家能先從珍惜舊朋友開始。人不是消耗品，請真誠的和每一個人相處吧。


    # 談賺錢以前，要先懂得多關心身旁的人


    父母和兄弟姐妹不用說，學生時代的朋友、出社會後的朋友……，隨著年齡增長，一定會遇見許多人。一般來說，在成長過程，我們邂逅的人數大約會是「年齡乘以十」的數值之多。


    那聽到「珍惜舊朋友」時，你腦中會浮現幾個朋友呢？在我二十六歲時，就知道人脈的重要性，因此創業初期，聽從了建議，嘗試列出「一百位朋友」清單。這份「百人清單」的好處在於：能明確實掌握自己至今的生活態度。


    說起來很不好意思，我立志創業時，我的導師對我說：「我們來確認一下岡崎你有多重視人際關係，先不要看你的手機，把你記得的朋友寫出'
  merge: -1
  img_proc: true
- pgno: 42
  md: '「來吧。」


    我遵照導師的建議試寫了一下，但居然連十個人都想不到！一般會遞返一年齡乘以十一的數值，但別說是百人了，我連十個人都列不出來。這件事讓我面對現實，了解到自己有多不重視朋友。


    在苦惱的同時，我寫下了哥哥和弟弟的名字，結果……我不知道他們的聯絡方式！這我也只能苦笑定了。如果對自己的親人都不關心了，怎麼可能還會關心朋友呢？


    我透過這份百人清單，察覺到自己迄今別說是朋友了，就連家人也沒有重視過。


    要是沒發現這個事實繼續過我的人生，隨著年紀增長，我會有什麼樣的人際關係呢……光想到這一點就覺得很可怕。


    百人清單絕對能讓你迄今的人際關係變得更加明朗化。但重點在於，這一百個人只是為了確認你至今的生活態度。列不到百个人你也不需强沮喪，也不要抱持著想對這一百個人推銷東西的意圖。'
