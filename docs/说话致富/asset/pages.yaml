- pgno: 135
  md: '前幾天我朋友出了一件莫名其妙的事情時，我說：「好像被狗咬了一口一樣」，他聽了回我：「為什麼會提到狗？」對於未知的語言，人類的理解力會跟不上。


    語言創造思考，思考成為行動的基礎。


    要從思考做改變會很困難，但只要「刻意」的去意識到，就能改變語言。所以改變行動的第一步就是改變語言。


    不過要你馬上改變已經使用相當習慣的說話用詞，應該會很困難吧。所以讓我來介紹幾個在掌握機會上「不應該使用的語句」。請避免使用這些詞彙。


    # 這樣說話，會讓你和「富有」失之交臂！


    不應該使用的語句有五個，下面會逐一說明。'
