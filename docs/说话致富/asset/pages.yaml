- pgno: 127
  md: '# 提升成交率的五大步驟


    想順利成交，可照著下列五大步驟進行：


    步驟一：成為最理解對方的人


    不论於公於私，良好的人際關係是一切的基础。建構良好人際關係的

    重要基础在於——給予對方所想要的事物。


    舉一個不好的例子，業績不好的業務不管遇到誰都會想推銷。這樣被

    推銷的人當然不會有好心情。


    愈是受人喜愛的業務，愈不會主動推銷。


    大家口中的頂尖業務都很清楚理解對方，而且只會向真的有需要的人

    提供商品。


    所以，清楚理解對方的需求，是最優先的目標。


    「對方真的有需要嗎？」這點得深入了解對方之後才會知道。不管他'
  merge: -1
  img_proc: true
- pgno: 128
  md: '會不會成為你的顧客，第一步都要讓自己成為最理解對方的人。


    # 步驟二：說話時，用「I↓YOU↓WE」或「I↓WE↓YOU」的順序


    再來最重要的就是——說話順序。基本上用「I↓YOU↓WE」的順序說話比較容易傳達給對方。但對於具有高度社會意義的事情，用「I↓WE↓YOU」的方式，也會有效果。


    不論哪種方式，剛開始說話時，都得以「對我來說」開頭。想要進到下一個階段，僅限於對方聽完後有所共鳴時。


    I 的內容讓對方有共鳴後，再說 YOU 的事情。


    如果 YOU 的內容也獲得對方肯定，再談 WE。


    假若對方對你說的話沒有共鳴，你就直接進到下一個階段，這樣就會變成強迫推銷。先理解順序的重要行吧。'
  merge: -1
  img_proc: true
