  md: '或許聽起來很蠢，其實這樣的體驗對建構人脈非常有幫助。請試著回想一下，當你想起一位朋友時，會先想到什麼事情呢？想的應該不是各式各樣的回憶，而是靠著印象中最深刻的一件事（頂多三件），就能回憶一個人吧。


    經歷會讓人留下印象的美好體驗，這在建構人脈上是非常強力的武器。我的座右銘是「創造人生的話題」，希望大家也能持續增加話題。


