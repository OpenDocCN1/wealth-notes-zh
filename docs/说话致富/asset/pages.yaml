  md: '法。但實際上，大家卻沒學會溝通的正確知識。換句話說，溝通能力不成熟是源於知識不足。


    今後的日本不再只是可以單純的一人獨立作業，需要與他人合作的工


    作會逐漸變多。也就是說，絕對會需要與他人進行溝通。因此，不管你願


    不願意，都一定有地方讓你練習溝通技巧。


    能實際練習的地方已經很充足，所以請多閱讀或參加講座，來增加自


    己的溝通知識。


    本次介紹了各種溝通時的重點，但還有許多內容無法一次傳遞。不


    過，坊間也有許多關於溝通的好書，在下一頁的參考文獻中，也會介紹幾


    本與溝通有關的書籍，有興趣的話，再請撥出時間好好閱讀。


    我可以百分之百保證，學習溝通絕對會讓你的變得更加強大。不用著


    急，循序漸進的慢慢學習，一定可以結出豐碩果實。


    最後，我想感謝總是陪我一同出版書籍的 KUNZA 出版社總編輯小


    寺、提供我許多學習機會的各位作家夥伴、各位前輩企業經營者，以及正'
