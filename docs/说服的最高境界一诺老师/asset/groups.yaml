    ## 第七节 降龙第七掌悬念降伏法


    人们对新鲜的事物、未知的世界充满好奇心，好奇心害死猫。人性总是对各种不知道的新鲜事物保持着好奇心。这是一个人人自称屌丝而又希望自己变成高富帅和白富美的时代。然而，一没有钱，二没有背景的屌丝逆袭谈何容易呢？


    所以他们更希望听到屌丝逆袭、白手起家、丑小鸭变白天鹅、癞蛤蟆吃天鹅肉、从弱小走向强大，而且容易做到。把这句话记下来：人们对新鲜的事物和世界充满着好奇心。


