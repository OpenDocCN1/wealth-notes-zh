    你可能会问：英诺老师，请问如何做到呢？记住四句话：第一句话，你很牛逼；第二句话，很多人说你很牛逼；第三句话，说你牛逼的人很牛逼；第四句话，跟你混的人都很牛逼。所以这是一诺老师常说的“四牛理论”。


