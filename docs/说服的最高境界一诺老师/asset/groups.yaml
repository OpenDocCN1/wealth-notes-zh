    各位，这就是原因和苦果。

    来，这堂课的作业：根据公式和实操模板完成以下作业：原因 横线，苦果 横线。

    如果你想一步一步引导别人说 “yes”，一定要好好做作业哦。等你把一诺老师的作业练习一百遍以上，你就能够拥有一切，包括幸福、快乐、自由、爱情、成功、财富等。一切的通道，叫做一步一步引导别人说
    “yes”。


    ## 第四节 虐心大法四：认同攀比法


    让对方立刻觉得渺小和痛苦的公式。大家有没有发现一个现象，就是中国人妒忌心和攀比心是全世界最强的。攀比心理，背后是什么呢？

    标准答案：想被认同。被认同的感觉是快乐的、喜悦的、开心的。反之，不被认同的感觉是痛苦的、郁闷的、失落的。

    把这句话记下来：用别人的快乐去对比他的渺小和痛苦。

    记这个公式：**别人快乐 横线 刺激痛苦 横线**

    来举个例子：为什么别人年入千万，你却连饭都吃不饱？这就是很明显的一个天一个地，对不对？先让之别。

    再来一个案例：为什么别人山珍海味，而你只配吃盒饭？很痛苦。本来他吃盒饭没感觉的，你告诉他：“为什么别人可以山珍海味，而你只配吃盒饭？”本来没感觉的，这样一对比，太痛苦了。原来别人比我强那么多。就是不比不知道，一比吓一跳。人比人气死人，就是一定要把它拉出来给别人做对比。

    再来一个案例：为什么别人好吃好住，你却只能住在豪宅的贫民窟？他本来住在贫民窟没感觉的，因为在他身边都是一样的人，他没有觉得他不好，甚至他有可能在贫民窟当中住的还算比较不错的一家。但是当他见识到什么叫做别墅、什么叫做豪宅，那感觉就不一样了。

    我记得在 15 年前，李云栎老师曾经开过一门课程，叫财富自由。不过这个课都没有讲了。当时第一件事我给所有学员布置的作业是什么呢？就是你一定要去看别墅。我记得我亲自带过几位终极地址去看别墅，1、2
    个亿 1 套的别墅。他们看完之后觉得自己太渺小了，回去之后发誓要努力。

    各位，你一定不要给乞丐去比。如果你是百万富翁，你要跟千万富翁去比。如果你想成为亿万富翁，你一定要跟亿万富翁去比。

    再来一个案例：为什么别人开豪车，你只能坐公交和地铁呀？

    再来一个案例：为什么别人能够呼风唤雨，而你却两袖清风、口袋空空、脑袋空空，继续打工？

    来，再来一个案例：凭什么别人可以成为老板，而你却只能努力地为别人打工？

    当你融会贯通，你就可以说：“难道我不会成为老板吗？难道你不配拥有最好的生活吗？你可以拥有最好的一切，包括成为一诺老师的终极地址，让一诺老师来帮助你，让你成为家族的荣耀，成为子女的榜样，成为国家的栋梁。把生意做到全世界，你愿意吗？哈哈，当然这是以后融会贯通之后，你就知道怎么衔接了。”

    现在还没有教大家组装，大家先去把每一个公式练一练，这个很重要。当一诺老师把所有的组件都拆解完毕之后，一诺老师就会让大家交作业，会给大家布置作业。现在的作业就是练习再练习，到时候我会让你哪一个组合跟哪一个组合，哪一个组合。

    刚开始是两个组合在一起，后来三个组合，后来五个组合。各位你想想 20 个组合就可以是三分钟演讲。以后我告诉你就是组合。

    结果你说：“一个老师怎么组？”那是怎么样的？我忘记了，你能不能再讲一遍？我呸，就你这个鸟样还想成功。你不要练习演讲了，真的，你不配。

    我见过太多的人，曾经他在讲师群里，他叫我九万八去学演讲，他都不说话。这个世界上，我也不想形容了，不过有的人他甘愿堕落，你有什么办法？

    子位，就连诸葛亮也扶不起阿斗，一个人除非他自己想要改变、自己想要成功，任何人都帮不了他。

    好了，再来几个案例：

    凭什么别人吃喝玩乐，还有花不完的钱，而你整天卖命的工作，却只能勉强糊口度日？

    再来一个：为什么别人可以站在讲台上发表魅力演说，而你却吓得两腿发软、语无伦次？

    再来一个案例：为什么别人家的孩子像块宝，你家的孩子因为你的无能，只能像根草？

    后面，当我们融会贯通之后，你会说：“这是你想要的吗？要不要改变？”

    简单，很多人让别人加盟说很赚钱的。来吧来吧，哎呀。你讲那些废话都没有杀伤力的话，有什么用？

    所以各位告诉大家，你千万不要把一诺老师这些模板给到别人。有些人他根本就不配学这些东西，他自己不愿意付出，自己总想不劳而获。

    来，这一堂课的作业：根据公式和实操模板完成以下作业：别人快乐 横线 自己痛苦 横线，别人的快乐来 PK 自己的痛苦。

    如果你想一步一步引导别人说 “yes”，一定要好好做作业。等你把一诺老师的作业练习一百遍以上，你就能够拥有一切，包括幸福、快乐、自由、爱情、成功、财富等。一切的通道，叫做一步一步引导别人说
    “yes”。


    ## 第五节 虐心大法五：激发潜能法


    想要实现梦想，我们要学会激发出听众内心的不甘心，激励他，告诉他，只要他努力，他也可以做到。我们要给对方希望，让他觉得他也可以做到。把这句话记下来。

    想要实现梦想，先把自己忽悠疯了再说。

    来记下这个公式：**逆境 横线 激励 横线**

    举个例子：牡丹花下死，做鬼也风流。一个是逆境，一个是好处的激励。好，再来一个案例。

    别人能够做到的事情，我也一定可以做到。这就是激励的。

    再来一个案例：不要觉得自己一无所有，你还有梦想。吉利是你还有梦想。

    我们再来一个案例：我们不是为了吃苦才来到这个世界上。我相信我们来到这个世界上一定可以创造奇迹。你已经是很多奋斗者正在吃苦，但是你要告诉他：我们不是为了吃苦才来到这个世界上，我相信我们来到这个世界上一定可以创造奇迹。这是激励的。

    再来一个案例：不要因为今天的渺小，还有往日碧波爷爷都是从孙子走过来的。对于很多人现在正在像孙子一样的觉得很累、没有尊严，就激励他。

    再来一个案例：当我一无所有的时候，我告诉自己，只要我有，就有千军万马。

    再来一个：当公司缺钱、缺资金、缺人才的时候，就好了。因为如果什么都不缺，还要你干嘛？

    这就是顺服那些缺钱、缺资金、缺人才的公司的老板，他们很痛苦，他们很迷茫，他们很无助。你告诉他：因为什么都缺，才显示你的价值。

    裴翔也对一个说服的高手先要说服自己。当你面对困境的时候，你不应该妄自菲薄，不应该抱怨，而应该哈哈大笑。为什么笑呢？这么难，说明竞争对手比我也好不到哪里去，只要我再坚持一下，竞争对手都纷纷死去，我就可以称霸整个行业，对不对？

    再来几个案例：遇到困难的时候，告诉自己能行不行也得行。

    大家知道保险公司业务员的压力非常大，他们出去拜访一大，所有人都对他说 “no”，是不是逆境？所以他们就委屈的回来的时候在那里喊：“我行，我行，我一定行！不行也行。”对，就是国内好几家公司都类似这种给业务员激励。大家知道这是一种说服的逻辑。保险公司就抓住这种说服的逻辑，逆境犀利，然后去给他的业务员打鸡血，去激励，去鼓舞士气。

    就好像有一部电视剧叫《亮剑》，其中李云龙在遇到鬼子的时候，李云龙说：“同事们，我们要冲锋。”李云龙命令部下要冲锋。他的部下说：“团长，这可是鬼子的精锐。”意思是他们太厉害了，可能我们不行。

    李云龙怎么说呢？面对逆境的时候，激励他的部下，他说：“老子打的就是精锐，都他娘的是两个肩膀，扛一个脑袋，我就不相信了。”对，这就是什么呢？在逆境的时候要激励，这是一种能力，大家一定要多多训练。你训练要在逆境的时候激励自己。当你不断的激励自己，你就可以激励别人。

    比如说之前有很多地址，我就不点名了，他们在逆境的时候都是我每一天给他们打气。如果不是我给他打气，哪有现在的那些商业模式大师、成交大师、营销大师？激励别人的能力，这是领导必备的。无论你是演讲家还是企业家，你都可以激励别人，激励自己。

    在二十多年前我遇到一个人，当时我一看这个人将来就能够成就大事。因为他做事非常执着，因为他非常能够激励自己。那个时候大家是看报纸的，当时我看到大街上有一个人再卖报纸，非常有激情的人在那喊，我就给他买了一份报纸。因为是下雨，我就很同情并欣赏他的激情，给他买了一份报纸，把他手上的报纸所有的每种买一个。后来我问他：“现在下雨，你为什么不躲一躲？”他说：“下雨算什么，就是天下刀子我也不怕。”我说为什么，他说：“因为我是曹刚。”后来叫曹刚的这个人，三年内就成为了千万富翁。因为他能够激励自己。

    再来一个案例：如果我不行，我就一定要；如果一定要，我就一定行。这就是当我们做市场的时候，激励团队；当我们遇到困难的时候，激励自己。

    各位，当我们做 100 件事情，成功可能就这么几件。很多人因为遇到了挫折就放弃了。因此在面对大多数的困难面前，如何激励别人，如何激励自己呢？在你不行的时候，你就告诉自己：如果不行，我就一定要；如果一定要，我就一定行。

    来，这一堂课的作业：根据公式和实操模板完成以下作业：逆境 横线 激励 横线。

    如果你想一步一步引导别人说 “yes”，一定要好好做作业。等你把一诺老师的作业练习一百遍以上，你就能够拥有一切，包括幸福、快乐、自由、爱情、成功、财富等。一切的通道，叫做一步一步引导别人说
    “yes”。


    ## 第六节 虐心大法六：情感冲突法


    在社交场合，人会顾及面子，去选择性的战队，每个人都在寻求与他人建立情感联系以及隶属于某个群体，习惯在群体中寻找存在感、价值感、安全感，并试图在群体中得到重要的地位。

    云柔老师研究发现，人是群体动物，习惯性的战队，而且总是喜欢站在正义的一边，特别是在公众场合、众目睽睽之下，更是需要一个大上正能量的情感归属。

    把这句话记下来：在社交场合，人因面子会选择性的战队冲突，制造战队 横线。

    什么叫冲突呢？比如说你想让他认为自己是好人，你要先说出一个坏人，让他去站队，让他证明他不是坏人。

    给大家演示一下，比如说我们在演讲的时候可以说：“孝顺父母的人请离开。”什么意思呢？就是留下来的都是孝顺父母的，对不对？那他肯定留下来。想走的，这时候也不走了。为什么不孝顺父母的才会离开，对不对？

    再来一个案例：“不认可、不相信伊诺老师的人请离开。”在众目睽睽之下，他离开，别人都会用异样的眼光看着他。

    再来一个案例：“行，远离那些不懂感恩、没有爱心的人。”

    再来一个案例：“认为自己不可能成功的、永远只配在社会最底层挣扎的，就不要浪费一诺老师的时间了。如果是这样的人请离开。”那别人就会站队，对不对？

    再来一个案例：“不想改变命运、不想成功的人、没有梦想的人请离开。”

    再来一个案例：“狼心狗肺、不知道回报社会的人请离开。”这是不是有点狠啊？

    来，再来一个案例：“不愿意让自己父母过上更美好生活的人请离开。”相当于你愿意让父母过上更好的生活，就要跟我一起，就要站队过来加入我们的行列，对不对？

    再来一个：“不想让自己孩子过上好日子的、没有责任感的父母请离开。”

    当你融会贯头之后，你就可以来说：“相反的认识为我是有孝心的、有爱心的、有人爱的、有格局的、想让自己子女和父母过上更好生活的人，请举手。”各位，这个时候不举手才怪。这就是用情感冲突让别人去战队，他自己都莫名其妙的就对你一步一步引导说
    “yes、yes、yes”。最后刷卡成交、交签单、签单，哼，他就交费了。

    我们再演示一个：“不爱父母的人，根本就不是人。像这种人，他不可能成功的。一个是不愿意帮助这种人。如果你是这种人，你就可以走了。”

    那留下来的：“如果你是愿意孝敬父母、愿意给自己父母更好生活的，请举手。”各位，这时候他不举手才怪，同意吗？

    再来一个案例：“没有素质、没有教养的人就可以走了。”

    当你荣沛贯通以后，你就可以加上：“认为是我是有教养、有素质、想要提高自己能力、让自己家庭更幸福更快乐的请举手。”这个时候他就举手了，对不对？这就是情感冲突。

    什么叫做情感冲突呢？你不用直接说明：“认为自己是孝敬父母的，请举手。”他有的人他就不举手。

    你说：“我这辈子里最看不起的就是那些不孝顺父母的一个，连父母都不孝顺的人，他会对你身边的人好吗？各位，如果你是一个有爱心、懂得感恩跟孝敬父母的人，请举手。”这个时候他就举手了。为什么？因为前面是冲突，坏人不举手的就是坏人，所以他不得不举手，对不对？因为前后左右身边有这么多人看着他。

    这堂课的作业：根据公式和实操模板完成以下作业：冲突 横线 战队 横线。什么战队呢？让他选择自己是好人还是坏人。先说一个坏人，然后有情感冲突的办法，让他战队。就管你想一步一步引导别人说
    “yes”，一定要好好做作业。赶紧把一诺老师的作业练习一百遍以上，你能够拥有一切，包括幸福、快乐、自由、爱情、成功、财富等。一切的通道，叫做一步一步引导别人说
    “yes”。


    ## 第七节 虐心大法七：情感共鸣法


    如果你能引发更多人的共鸣，就能得到更多人的支持。

    是人都很累，人类心更累，可谓是身心疲惫。世人都很苦，人苦心更苦，可谓是身心皆苦。

    何谓知音，就是你懂得他心里的苦闷累。有一个可以大道苦水的人，突然有一天你懂他，你就赢了。

    因为人为知己者死，客户为懂他的人买单。把这句话记下来。

    你能引发多少人的情感共鸣，就有多少人支持你。

    接下来这个公式：通过现象引发共鸣。

    举个例子：父母为你付出一生，而你为父母付出了什么？这是一个现象。共鸣就是作为子女的人会想：对哦，我为父母奉献了什么？

    再来一个案例：想做什么就做什么，趁年轻宁可做错，不能错过，这是现象，对不对？好，后面一句是“让人生没有遗憾”，这是引发的情感共鸣。

    再来一个案例：现在的老板被房租、水电、人工、税务、债务压得喘不过气来。各位做老板容易吗？前面是现象，房租高、水电贵、人工贵、税务债务压得喘过气是一种现象。共鸣做老板累不累？各位一下子说到他心里去了。

    再来意大利（案例），很多人被各种无良的培训机构忽悠的晕头转向，就像玻璃上的苍蝇，前途一片光明，可是永远找不到出口，这是一种现象。

    很多人参加各种培训，学完之后，试问在这个世界上有几个人能像伊诺老师一样教你的说服，能够真正拥有公式，真正的有模板帮助你，让你开口就能秒杀全场。三句话，晕倒一片，再也没有人能够手把手的这样教你一个步骤、一个公式的来拆解，再也没有人能够像一个老师一样，百分之百的复制自己的
    6 种能力。

    对，仅仅通过这二十多课的音频课程，即使你交的是 10 万，都值了。后面学的所有的东西都是赚的，同意吗？

    再来一个案例：本以为书中自有黄金屋，书中自有言如玉（颜如玉）。可是万万没有想到，我们被很多假书忽悠的晕头转向，买过来根本看不懂，甚至是越看越糊涂。各位，想成功法（方法）就这么难。

    有没有一种现象就是太多的假书为了凑字数就是卖钱的，就是忽悠人的。真正的好书像一诺老师这种书太少了。

    再来一个案例长一点的：我们在社会的最底层挣扎，渴望改变自己和家族的命运，于是到处寻找机会。本以为遇到的都是贵人，可是万万没想到，接二连三的都是资金盘、虚拟币、区块链等庞氏骗局。每到半夜，我就问自己：难道就没有一个真真正正能够帮助别人的机会吗？对，最后一句话是情感共鸣，前面是社会现象。

    来，这一堂课的作业：根据公式和实操模板完成以下作业：通过现象 横线 引发共鸣 横线。

    如果你想一步一步引导别人说 “yes”，一定要好好做作业。等你把一诺老师的作业练习一百遍以上，你就能够拥有一切，包括幸福、快乐、自由、爱情、成功、财富等。一切的通道，叫做一步一步引导别人说
    “yes”。


    ## 第八节 虐心大法八：天堂地狱法


