    \n我现在就为你破解，我现在立刻就帮助你。\n\n再给大家一个词，是一诺老师经常用的，一诺老师的弟子也经常用来：\n\n“现在就让一诺老师带你一起改变命运，来，现在就牵着因诺老师的手（注：此处OCR原文为因诺/英诺，结合上下文应为‘一诺’），就是这个类型。‘现在’、‘跟我一起’的意思，你可以说‘现在就让一诺老师带你一起’，‘现在就让一诺老师帮助你’，总之是一个类型的。”\n\
    \n来，我给大家布置作业，这一堂课就是把这 33 个催眠词抄写并朗诵 300 遍以上。如果你没有抄写或朗诵 300 遍以上，那你将来演讲的时候就会忘记，就使用不出来。到时候你不要说，“我忘记了，我都不记得了”，“到底有什么催眠词？”还有，“我演讲的时候，我突然想不到什么词了”。很多人站上讲台的时候都会词穷忘词，为什么？因为你不熟练。\n\
