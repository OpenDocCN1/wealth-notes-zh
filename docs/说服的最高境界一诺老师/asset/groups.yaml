    ## 第十二节 降龙第十二掌欲望降伏法


    人都有获得尊重的欲望、攀比、爱慕、虚荣的需求。人活在这个世界里，有对自己的价值追求、地位的追求。看到别人没有，自己有，这样的炫耀攀比心理。把这句话记下来：投其所好，满足对方的虚荣心。


    先写下这个公式：行动横线，满足（虚荣心）括号横线。那就是采取什么样的行动可以满足他的虚荣心，满足什么样的虚荣心。


    来，现在一诺老师给大家演示一下案例，你就会更明白：

