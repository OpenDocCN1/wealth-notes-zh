    我们来看第一个人背景，什么样的背景呢？假设我们讲一个王子的背景，一个公主的背景，一个富二代的背景。像王思聪的故事，像华为的女儿的故事。你觉得你想听吗？没意思，这给我们普通老百姓相差甚远。大家不感兴趣，大家感兴趣的是自己跟我很像的人，什么人可以屌丝逆袭，什么样的人可以实现白手创业，什么样的人可以实现空手套白狼成为千万富翁，亿万富翁命运发生改变，这个是大家感兴趣的。因此我们要讲什么样的故事呢？人生背景是什么样的背景下呢？贫穷迷茫，没有人脉，没有关系，没有靠山，没有背景，没有经验。就像银罗老师小时候，爸爸穷，爷爷穷，爷爷的爷爷也是穷人。而且在我小的时候，我家住的是草房子。


    长大了也没有住上什么好房子，是靠我自己的努力去买的房子，而且给父母亲都买了房子，而且给丈母娘都买了房子。这就是我可以说我的成功是被逼出来的，真的是被贫穷逼出来的。记得小时候睡在床上，都可以看到天上的星星。那个草房子烂了，洞，黄鼠狼和老鼠都从那个洞里钻来钻去，然后黄鼠狼去追那只老鼠，现在想想还蛮有意思，但是一到下雨的时候就非常痛苦。下雨的时候我家里地上接的都是盆，你床上都会淋到雨。以前想想，其实心是很痛的，现在想想还挺感激那一段岁月的。


    第二个人生低谷，你已经很惨了。想象一下，如果这么惨的人又发生什么意外事故重大疾病或者人生跌入了某种低谷，负债累累。比如说小时候我家里就吃不起饭，父母离离婚被人看不起，吃不饱，穿不暖，住不好，在学校被别人瞧不起。而且那个年代是交学费，我家里是交不起学费的，经常被老师赶出去。你想一想，在那种情况下，你想的是什么？肯定是想如何改变命运。所以这就是为什么因多老师一演讲能够讲出很多人的心声。因多老师体验过贫穷的滋味，很多人他是没有机会品尝这种滋味的。因为你看到的贫穷跟你体验体会到的贫穷是两种感觉。


    第三，个人生机遇，意外的收获，或者是自己努力的结果，或者是偶遇的机遇，或者是贵人相助。其实在我人生当中有很多位贵人都是在不同的阶段，也就是在我人生的低谷，向我伸出援手，或者是给我某一个信息、某一个资讯，某一个改变命运的机会。因为只有你真正的去经历过，你讲出来的才有感觉。


    人生本来就很贫穷，很凄惨了，然后又雪上加霜。在这个时候，你知道一个机会有多重要吗？第四个，华丽转身，物质上的可以是精神上的，可以是屌丝逆袭，可以是咸鱼翻身。所以你已经很惨，然后又雪上加霜，更惨。在这个时候遇到了你人生的贵人，或者是某一条致富的信息，某一条资讯，某一个机会。让你的人生华丽转身，其实这是大多数屌丝，也代表着大多数人的内心的某种渴望。人们感兴趣这样的故事可是有一句话说的很对，如果你在太年轻的时候就有钱，这个财富是不稳定的。为什么？因为你太容易就成功了。就像唐僰去西天取经，取完结之后，那佛祖一算，还少一难，又给他来了一难。


