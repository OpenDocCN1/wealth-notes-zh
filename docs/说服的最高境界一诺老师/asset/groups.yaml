    \n还有一些所谓的大师教别人成功：“你给我一份信任，我还你一个奇迹。”奇迹？你个鬼自己都没房没车，甚至都在靠信用卡套现过日子，居然还叫别人成功。太好笑了。\n\
    \n还有一些所谓的大师发布一些跟豪车的合影，就是说这辆车是他的；站在一栋别墅门前拍张照片，就是说别墅是他的。真不要脸。如果你站在和谐号车头拍照，和谐号也是你的。还有更不要脸的大师在网上花50块钱找PS的人，把自己的人头移花接木，PS一张跟某大师、某名人、某企业家的合影。其实明眼人一眼就看出来那是假的，那是PS的，因为PS的照片头像跟身子不一样。\n\
    \n各位大家记住一句话：炫耀什么就缺什么，若是狮子何必炫耀。所以你会发现，一诺老师讲课从来不拿房子和车子用来炫耀，这些都很低级，非常低级。\n\n这样的大师跟跑江湖卖大力丸、胸口碎大石的骗子有什么区别？那一诺老师靠什么征服听众呢？\n\
    \n1. 靠实战的案例。\n2. 靠催眠话术和带有病毒的语言。\n3. 靠征服性的演说公式。\n4. 靠一步一步引导别人说Yes的能力。\n5. 靠征服人心的勾魂话术。\n\
    6. 靠自动的营销系统。\n\n接下来，伊诺老师会非常系统地带着各位弟子来百分之百地复制伊诺老师的6种能力。\n\n还记得这6种能力吗？说服能力、演讲能力、营销能力、融资能力、顾问能力、领导能力。首先会复制你如何一步一步引导别人说Yes的能力，也就是第一个模块“说服的最高境界”。在这个模块，是把演讲时用来说服别人的语言逻辑、公式和模板进行拆解，把演讲的整体素质拆解成一个个的模块分开练习。就像汽车一样，不是一下子造出来的，是一个个的零件分开生产制造再组装在一起就是一部汽车。说服别人也是一样的道理。当你一步步地练习，把每一个模块，每一个公式和每一个模板都认真训练之后，在第二个模块里，伊诺老师教你How\
    \ to（如何）把每一个小的公式模板组装在一起。再教你如何训练一分钟演讲，三分钟演讲，五分钟演讲，十分钟演讲，半个小时演讲，一个小时演讲，循序渐进地分模块，一步一步地教会大家。\n\
    \n除此之外，第二个模块不只是组装，还要教你如何训练自己的声音，如何包装自己的形象，如何定位演讲方向，如何营销自己，如何设计PPT，如何录制演讲，如何组织一场收钱的商业演讲。各位，商业演讲不能收钱，那跟放屁有什么区别？所以在后面，一诺老师会教弟子商业演讲的前奏开场破冰，上半场洗脑，下半场收钱（原文为“收魂”，根据语境修正为商业闭环逻辑或保留原意“收魂”以保持风格，此处保留原意风格并稍作通顺）：非常系统的商业演讲模块。\n\
    \n先给大家介绍最近要教大家的演讲最高境界这个模块。第一章是收钱、收人、收心、收灵魂的终极密码，叫做“降龙十八掌”：好处降伏法、情人降伏法、时空降伏法、追求降伏法、贪婪降伏法、犯贱降伏法、悬念降伏法、渴望降伏法、权威降伏法、思想病毒降伏法、惰性降伏法、欲望降伏法、懂你降伏法、主见降伏法、授信降伏法、亲情降伏法、错过降伏法、情感炸弹降伏法。\n\
    \n第二章是瞬间引起注意力的九个公式和模板，叫做“魔力诱惑”，会教大家魔力诱惑原理、案例刺激法、因果关系法、设问引导法、悬念无果法、过程场景法、结果场景法、免费刺激法、时间价值法、结果保证法。\n\
    \n第三章是让人求生不得求死不能的虐心公式和模板，叫做“虐心大法”，会教你痛点放大法、严重警告法、激将法、认同攀比法、激发潜能法、情感冲突法、情感共鸣法、天堂地狱法。\n\
    \n第四章是瞬间激发人好奇本能的五个公式和模板，叫做“好奇悬念”，会教你好奇悬念原理、震惊型模板、神秘型模板、有头没尾型模板、有尾没头型模板、颠覆常规型模板。\n\
    \n真的是太多了，所以不能这样介绍了，直接念主题吧。\n\n第五章，教你如何收服懒人。\n第六章，教你如何讲故事：讲故事的五大要素，如何讲自己的故事，如何讲公司的故事，如何讲产品的故事，如何讲客户的故事。当你灵活掌握之后，你可以讲故事讲到让听众白天撞墙，讲到听众买你的产品，每天忏悔。\n\
    \n接下来第七章，一诺老师还要教你勾魂销魂，点燃客户激情，爆破客户欲望的最高境界，叫“葵花宝典”，说白了就是勾魂。学会这个之后，客户从今以后离不开你，对你欲罢不能。为什么？因为魂都被你勾走了。一诺老师会教你勾魂原理、勾魂基本功、勾魂的魔力场、勾魂的模板，以及如何每讲一句话都是在勾魂，甚至在一句话里可以放好几个勾魂的钩子。\n\
    \n第八章，一诺老师会教会你如何解决不信任的问题，叫做“画骨绵长”。客户不买单，不成交，不加盟，你就是不够信任。你如何快速解决信任感的问题呢？其实信任是一场布局。画骨绵长，就是教你信任布局。学会以后，你的客户会相信你，喜欢你，深深地爱上你。只要你发布产品，客户就直接买买买。为什么？因为他相信你。\n\
    \n以上八章只是第一个模块中的一小部分。为了保障质量，大部分内容还是留在弟子密训的课程当中讲。学习过程中请准备笔记本和笔。因为说服人是有逻辑的。一诺老师把这些逻辑变成可复制、可套用的模板。\n"
