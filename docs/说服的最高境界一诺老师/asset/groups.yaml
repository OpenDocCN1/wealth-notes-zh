    被欲望诱惑着。人存在于世上首先最大的诱惑是物质上的诱惑，然后 才是精神上的诱惑。精神诱惑是追求名利，执着于表现与突出自己， 或者是在知识领域的过度的探索和追求。普通人面对的诱惑是权力、
