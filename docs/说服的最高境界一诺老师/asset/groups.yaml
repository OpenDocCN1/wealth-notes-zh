    \ Yes。\n\n### 第二节 玉女心经 2：催眠口头语\n\n你看不出来，但绝对勾魂的 33 个说服力专家常用的催眠口头语。\n\n这个口头语将来也是你拿起麦克风站在讲台，说服听众，批量的给听众催眠的一种口头语。我们去听演讲的时候，会遇到系列的催眠，例如签到、挂胸牌、排队进场、分组喊口号、灯光、音乐、舞蹈等等。这些都是催眠，只不过普通人看不出来而已，这些只是前奏。更厉害的是，讲师在演讲的过程中，不断的给你催眠。\n\
