    \ Yes。\n\n### 第三节 玉女心经 3：听众心声\n\n我们要剖析听众的心声，罗列问题清单，编辑勾魂的话术。我们要进行市场调研，走到客户当中去了解客户的心声。他们有什么疑问、顾虑和不解，把这些问题罗列出来。\n\
