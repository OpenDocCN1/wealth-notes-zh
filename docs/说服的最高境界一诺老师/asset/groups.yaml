    再来一个案例：为什么别人好吃好住，你却只能住在豪宅的贫民窟？他本来住在贫民窟没感觉的，因为在他身边都是一样的人，他没有觉得他不好，甚至他有可能在贫民窟当中住的还算比较不错的一家。但是当他见识到什么叫做别墅、什么叫做豪宅，那感觉就不一样了。

