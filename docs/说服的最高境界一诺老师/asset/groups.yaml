    我们看一个案例。看过《猪买单》的人都知道，书里有讲到伊诺老师俄罗斯籍犹太弟子叫丹尼尔。在拜读伊诺老师书籍之后，不远万里从俄罗斯专程来到中国拜师学艺。丹尼尔认为，一诺老师的书籍堪称“东方塔木德”，甚至比《塔木德》更实战、更落地。大家在书里面或者在公众号也有看到德国总统佛朗克·霍普（注：原文“外敷”疑为人名或误识，此处保留原意逻辑）推荐一诺老师的照片；毛家饭店创始人，他妈妈88岁，今年已经九十多岁了，也推荐一诺老师的照片和媒体的报道；还有悉尼证券交易所的董事徐总裁，悉尼证券交易所相当于深交所这种主板上市机构，他也曾经和英诺老师合作过，并隆重地推荐英诺老师。


    还有大家听一诺老师音频的时候有听到：“大家好，我是志玲姐，对吧？”志玲姐都在推荐一诺老师，还有许少雄（许绍雄）也在推荐一诺老师。你包括之前的英诺老师的一些地址，大家也许看过之前的一些照片，我带着几十个地址跟明星合影的照片。比如说有跟主席的扮演者朱建华（注：原文“朱建平”可能为误识，根据语境推测为某位演员或人名，保留原音译逻辑）、北大的文艺院长、毛家饭店的创始人、著名香港影星许绍雄，还有很多的影星。推荐一诺老师的人非常多，在这里就不一一列出来了。彪悍的人生不需要解释，让更多人说你牛逼吧。


    有时候你自己有多牛逼，也许看不到，但是你跟很多牛逼的人在一起，那自然别人就会认为你很牛逼，对不对？很多很牛逼的人都在推荐你，那自然显得你很牛逼。所以当很多人都在说你很牛的时候，你就可以做到“彪悍的人生不需要解释”。


    是让更多人说你牛逼。留给大家的作业是：


    第一个作业，首先要让自己看起来很牛逼。来给大家举个例子，很多例子你去看看你的朋友圈，朋友圈当中也不一定是你自己，你看看你有没有坐过公交车去吃一个几块钱快餐，然后随随便便照一张相片，显得很low（原文“cow”疑为low之误），显得很低级，显得你很没趣。去炫耀一些物质上的东西。一个包包，一个品牌，一辆车或者是一瓶酒，一份菜，你都去炫耀，这是非常低级的。不要乱发那些垃圾的东西，你的朋友圈就把你出卖了。再看看你的形象照。


    有些人真的是没有形象可言。很多终极地址都有伊诺老师的微信，都知道伊诺老师从来不乱发朋友圈，就是跟名人合影都不发在朋友圈里，没必要炫耀。但是作为你们在创业阶段的人不一样，你们可以炫耀一下，但是你要值得炫耀。比如说你跟一些明星合影，那将来的话我们的弟子很多，我们可以组织活动。比如说我们邀请哪个明星，给他几万块钱喝茶费，这样的话100个人是，我们每人才出几百块，你们就可以跟一个名人合影，相当于我们吃饭了，对不对？那这样子的话，你可以跟很多名人合影。将来有一天你演讲的时候，你可以把这些照片发出来；你出书的时候可以发出来；你招商的时候可以发出来；你在展示你自己实力的时候，吸引团队的时候，你可以发出来。这对于你来说都是可以展示自己实力的。


    第二个作业是找很多人证明你很牛逼。比如说有人给你写感谢信，就像一诺老师写感谢信的人非常多，以前有送锦旗的，有写感谢信的。当然了，特别是送过锦旗的那些人，我都会回馈感恩他，比如说我会送给他一本从来不公开的一本书。他很开心，因为那一诺老师说好话的人太多了。如果我说“你帮我说一句好话，我就送你一本书”，这就没有意义了。很多别人送锦旗、录小视频都是主动的。然后还有很多助理告诉我，云朵老师，有一位你的铁粉，骨灰级的粉丝，他已经帮你转发几百条音频在他的朋友圈。后来他截图给我看，我非常感动。我说了他一年从来没有公开过的营销内幕，讲的全都是商业上根本不能说的话，连出版都出版不了的。


    之前我都是传给那些终极地址，但是我看到这个人实在是太认可一诺老师了，所以你不要去做任何东西给别人交换，我都看得到的。不要想着别人给你好处，你才去做。当然了，这是我因为现在英诺老师牛逼的人生不需要自我介绍了。有很多人在说我好话，有些只是说一句，但是有些人经常说、持续说，那么就会让我感动。


    还有在此的话，我提醒一下我们的弟子有奖学金，大家在分享、在朋友圈的时候一定要是公开分享的。你不要是只让一部分人可见，不让谁看见，只给谁看见，那样都不算数的。一诺老师能教你这么多勾魂的话术，降服人心的东西，心理学的东西、思想病毒以及催眠的语言。你想想英诺老师对人性非常了解，可以说在我面前最好是大家都以诚相待。不要刷小聪明，因为一诺老师睡着的时候都比你聪明。我希望我的诚心，我花的时间精力来整理这些演讲的绝学，可以帮助那些值得帮助、懂得感恩的人，而不是自作聪明去欺骗别人的人。


    我们再看下作业：


    - 第一个作业：让自己看起来很牛逼，就是一眼看上去就很牛逼。不管是照片也好，声音也好，新闻也好。

    - 第二个：找很多人证明你很牛逼。对，找一些人。

    - 第三个：你还要找一些已经很牛逼的人来证明你很牛逼。

    - 第四个：你要找一些跟你混的人，他已经混得很牛逼，这样能够衬托你更牛逼。


    听懂没有？这个4个作业大家一定要去完成。如果你想一步一步引导别人说yes，一定要好好做作业哦。等你把一诺老师的作业练习一百遍以上，你就能够拥有一切，包括幸福、快乐、自由、爱情、成功、财富等一切的通道，叫做一步一步引导别人说yes。


    ## 第十节 降龙第十掌思想病毒降伏法


    有话不能直说，直向曲中求。大家注意到没有？我们有时候下载一个软件，结果手机和电脑就会中病毒，但是这个病毒是经过伪装的，并不会直接写着“病毒”两字。编辑病毒软件的人如果这么弱智，你显然不会去点。因此这些程序会把病毒植入到某些看起来正常的软件里面。


    我们来看一下全球疯狂演说家108个思想病毒。这里面的一个公式，举个例子，正常的语言是OOAO，那病毒的语言应该怎么去伪装呢？OOXXOOOO是伪装，就让你看起来很正常，中间不是AA吗？AA就给它替换成XXXX，这就是病毒。另外结尾的时候继续用OO来伪装，所以高手做的病毒，连一般的杀毒软件都觉察不到。他是如何做到的呢？大家记下来这个公式：伪装横线，指令横线，伪装横线，访问横线。这个指令就是病毒，就是你想让他干什么。


    给大家举个例子，演示一下。如果你想让自己的父母晚年过得更有尊严，一定要成为云朵老师弟子。毕竟你是一个孝顺的儿子，难道不是吗？


    大家拆开来看一下：

    - 伪装：“如果你想让父母晚年过得更有尊严”，这是大家想的，那这就是伪装，他想要的东西。

    - 指令：“就一定要成为英诺老师的地址”，这是我们植入的思想病毒，也就是指令。

    - 结尾的时候我们要再伪装一下：“毕竟你是孝顺的儿子，难道不是吗？”他一听，是，我是孝顺的儿子。


    假设我们没有最后的伪装，只有伪装加指令。那就会变味了。比如说：“如果你想让父母晚年过得更有尊严，一定要成为一诺老师的弟子，难道不是吗？”他会说：“我为什么要成为？”但是我们在结尾的时候加上一个伪装：“因为你是一个孝顺的儿子，难道不是吗？”所以前面是好处，后面是事实伪装。我们可以用好处和事实伪装，前面是好处，让自己的父母过得更有尊严，是好处，是他想要的。那事实，比如说他是一个孝顺的儿子，他是一个有责任感的爸爸，他是一个爱老婆的丈夫，他是一个有责任感的人。那用这些事实是他不可否认的，所以用这些来进行伪装。在结尾的时候，别忘了加上一句：“难道不是吗？你难道不是一个孝顺的儿子吗？”


    我再给大家演示一个案例：

    如果你想让自己的爱人过上更有品质的生活，一定要成为一诺老师的终极地址。毕竟你是一位有责任感的人，难道不是吗？


    他一听：是，对，我是有责任感的。所以大家拆下来看一下：

    - 如果你想让自己的爱人过上更有品质的生活，这叫好处，伪装。

    - 一定要成为伊诺老师的终极地址，这叫指令。


    那只有好处、伪装加指令的时候，他说：“那我为什么要成为？我可以去做生意，我可以去干其他事情，我干嘛非要成为一个诺尔斯的终极地址呢？”


    我们还要再加一个伪装：“毕竟你是一位有责任感的人，难道不是吗？”我是有责任感的，给他加了一个标签。“难道不是吗？我是有责任感的人，对不对？”


    再给大家举一个例子：

    如果你想让自己的子女接受最好的教育，一定要成为一诺老师的终极地址。毕竟你爱你的孩子，对吗？


    很多人会停留在最后一句：“哦，毕竟我爱我的孩子，对对对，是。”

    如果你想让自己的子女接受最好的教育，这是好处伪装，谁都想让自己的子女接受最好的教育，这是好处。

    一定要成为一诺老师的终极地址，这叫伪装思想病毒植入。

    毕竟你爱你的孩子，对吗？他说，对，因为他爱。这叫事实伪装，爱他的孩子是事实。我们用事实来伪装。


    所以这个说话的逻辑大家掌握之后，你会发现非常牛，无形当中别人就被你洗脑了，无形当中别人就被你催眠了。他不知不觉就喜欢你，相信你，爱上你，离不开你，对你欲罢不能。最后就乖乖的交钱购买你的产品，加盟你的生意，成为你的合伙人。


    事实上很多人听了伊诺老师的演讲也是如此，你根本不知道为什么就相信、喜欢、爱上英诺老师的音频课程，然后不知不觉就买了课程，买了书籍，对不对？


    各位，你知道英诺老师是修炼来的，这个来源于20年前的英诺老师的一个研究。我把它称为思想病毒。这个思想病毒的语言逻辑，云朵老师是受一个人的启发，这个人叫希特勒。第一次世界大战之后，希特勒为了夺权武装政变，最后失败了，被抓了起来。在法庭上，搞笑的是，审判台变成了他的演讲台。希特勒用他充满魔性的演讲一场给所有人洗脑。


    最后，法官被洗脑到什么程度？本来是以卖国罪接受审判，可能会被告毙的，然而希特勒只被判了五年，所有人哗然。更不可思议的是，希特勒在服刑期间，面对所有的囚徒和狱警演讲，结果，监狱的犯人变成了他的信徒。他不仅可以在监狱里面四处走动，还有他的助理为他打字写书。他有独立的单间会客室，本来是来看管他的狱警，结果都被疯狂的洗脑，居然成为了他的警卫员。五年的刑期，最后像度假一样，六个月就被放了出来。


    希特勒出狱之后开始疯狂演讲，他的信徒自发组织起来，自己出钱买摩托车、买制服、买枪支、买武器、交会费。希特勒不仅不用给他们发工资，他们还要交会费。最后，希特勒疯狂的给德国人洗脑，成为德国总统并发动第二次世界大战，6000万德国人被希特勒洗脑并推向战场，被称为魔鬼的希特勒。你不得不承认他有独特的语言天赋。


    后来伊诺老师经过3785段希特勒的德语演讲，这些视频大多数是被禁止的，是特殊渠道获得的，网上你们根本就找不到。经过伊诺老师研究发现，原来希特勒演讲时，每句话都有病毒结构。通过伊诺老师1300多个日日夜夜的反复研究，将这些结构整理出108个思想病毒。


    今天教大家的只是这108个思想病毒中的一种，剩下的107个不能随便教。为什么不能轻易传给别人？因为如果让坏人学到了，世界文明有可能面临再次被摧毁的危机。这不是危言耸听。


    留给大家的作业：

    有好处伪装，加入病毒指令（也就是思想病毒指令），再用事实伪装，最后加一句反问句。大家用这个公式来完成这一堂课的作业。


    公式结构：

    伪装（好处）横线，指令（病毒）横线，伪装（事实）横线。

    我们要用好处来伪装，指令（病毒），我们要用来发布指令呢？思想病毒。

    伪装（事实）横线，我们要用事实来伪装，最后是一句反问句。比如说：“难道不是吗？”“对吗？”“同意吗？”“对不对？”


    好，大家一定要认真的完成这一堂课的作业，非常重要。如果你想一步一步引导别人说yes，一定要好好做作业哦。等你把一诺老师的作业练习一百遍以上，你就能够拥有一切，包括幸福、快乐、自由、爱情、成功、财富等一切的通道，叫做一步一步引导别人说yes。


