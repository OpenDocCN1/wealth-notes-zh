    ## 第七节 如何讲自己的故事终极弟子演示


    他是如何演讲的。大家不要着急，来，现在提醒一下大家，所有的演讲都可以写出来，它都是一个剧本，就像演员一样。你只要练习再练习，练习的次数多了，你就可以融会贯通。其实你站在台上就是在表演现在更好。因为现在是互联网时代，我们利用互联网演讲。因此这一个稿子是上一次伊诺老师的一个终极地址。在互联网上照着读就行了。各位，你背不出来，你读会不会，你读的次数多了，你就熟练了，对不对？所以说服的最高境界教大家的，我们在需要说服别人的时候，一些公式。演讲是一整套的说服逻辑，先用什么后用什么。


    就好像一辆车一样演讲就是组装起来的车。说服就是汽车的零件。如果你不去学演讲的最高境界，相当于你拿到了一堆汽车的零件。但是你想把它变成汽车有点难。因为说服教的你是一步一步引导别人说yes。而演讲是系统的说服的逻辑。比如说如何把一段组合在一起，形成一整套的演讲逻辑。两个小时三个小时讲完之后就能够收到钱。所以大家一定要系统跟着下一个课程演讲的最高境界来学习。


    如何组装这些话术？当然了，不止这些，还有更多比较长的说服的公式。比如说一个公式可能会写出上百字、几百字乃至上千字的这种演讲稿。就像演讲自己的故事一样的。很多人说我要学说服各位，你要记住讲道理不如讲故事，别人不喜欢听道理。但是人们从小就不抗拒故事，那么在后面的章节当中已经跟老师教大家的都是组合式的，甚至比这一个讲故事的逻辑还要长。所以他就属于演讲的范畴。如果你想改变自己的命运，如果你想通过互联网演讲，就能让他哭，让他笑，让他晚上睡不着觉。如果你想通过互联网演讲，就可以让别人疯狂的相信你，喜欢你，深深的爱上你，对你欲罢不能。如果你想通过演讲就能销售你的产品，让别人加盟你的项目，一定要学习。


    演讲的最高境界。来我们演示一下，36年前我出生在一个贫寒的家庭里，小时候的我是一个非常内向自卑的人，可能是穷人家的孩子成熟早的缘故，家里农活忙的时候总是帮助父母干一些农活，不忙的时候总是喜欢一个人静静的坐在山岗上眺望着远方。那个时候，爸爸总会用他那带着老茧的大手轻轻的拍着我的小脑袋说，孩子记住，人生不怕穷，但要穷得有志气，不管做什么事情，坚持到底，绝不放弃。我是家中的独生子女，一家人把所有的希望都寄托在我的身上，偏偏天公不作美，随着我高考三次落榜，我不忍看着父母失望的泪水。2010年的春天，我背井离乡，只身一人来到北京，在祖国的首都，这个人人都向往的繁华大都市里住在那个阴暗潮湿的地下室里，每天只能透过体力劳动来换取自己生存的资格。无数个夜不能寐的晚上，经常一个人爬到工地的楼顶，孤独的望着远方，思念着远方的故乡和父母。每当心急剧疲惫，快要撑不下去，想要放弃的时候，总会想起爸爸那句话，儿子啊不管做什么事情，坚持到底，绝不放弃。


