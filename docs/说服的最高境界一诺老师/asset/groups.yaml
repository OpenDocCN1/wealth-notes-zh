    ## 第十八节 降龙十八掌情感炸弹降伏法


    使用情感炸弹摧毁听众最后的心理防线。大家发现没有？在现实生活中，很多人被资金盘、比特币、区块链、非法传销、高利贷等搞得晕头转向。于是大家变得内心缺乏安全感，开始怀疑、猜测，神经过敏，不信任他人，事事捕风捉影，对他人失去信心，失去信任。在这个信赖感严重缺失的时代，想要别人相信你变得越来越难。每个人都把自己包裹得严严实实，别人接触他，他都认为对他有意图。


    你会发现，当你演讲的时候，客户也听懂了，也认可了，但就是不买单，不加入，不交钱，不刷卡。有时候你百思不得其解，很多签单环节就这样错过了。这时候使用普通的武器已经无济于事，怎么办？使用绝招：情感炸弹。使用情感炸弹摧毁听众最后的心理防线。


    情感炸弹。一诺老师曾经使用过，88个聪明人就会发现：云朵老师的五个英雄帖至少植入十个以上的情感炸弹，不然绝对不会“不见面”就有上千名弟子报名。但有的情感炸弹真的不能随意引用，使用不当就会走火入魔。


    记得十年前一诺老师的一场演讲，现场有1500位听众，四天时间30个讲师轮流上去讲，每个人只能讲8到45分钟。所有的讲师都讲得口干舌燥，嗓子冒烟，甚至有的讲师都使用了犯贱成交法，给予听众下跪。然而台下的听众已经有免疫力了，无论讲师如何拍胸口、喊口号、苦苦哀求都无济于事。几乎所有讲师都一致认为台下的是一群穷鬼。然而，当一诺老师出场之后，在45分钟内连续使用5颗情感炸弹，现场哭声一片，所有的人一边抹眼泪，一边刷卡排队交钱，当场成交3500万。但是因为一诺老师现场连续使用了5颗情感炸弹，导致内伤，三个月不能演讲。


    今天云朵老师就给大家公布一个最常见的情感炸弹公式，叫做小型炸弹。大家接下来这个公式：问话带入——画面带入——指令。


    来，我们再给大家演示一下。我们来点音乐。


    俗话说：“树欲静而风不止，子欲孝而亲不待。”孝顺不是义务，是机会啊。在做父母健在的举手看一下。刚刚没有举手的，你就知道现在就是想喊一声爸、想喊一声妈都没人应答了。


    2500年前，人们走进课堂，学的第一堂课不是ABC，不是一加一等于2，而是“首孝悌，次诚信，泛爱众而亲仁，有余力则学文”。意思是说让你先把人做好，有剩余的时间再学点文化。可是今天都学反了：小学生就开始学中学的课程，中学生学大学生的课程，大学读完了来干什么？再学小学的课程，学怎么做。


    复旦的投毒案，博士马加爵杀掉宿舍四名室友，为什么？都大学生了，做人还是失败。一个人连孝道的根基都没打牢，越聪明，才干越大，对社会危害也就越大。


    你们同意吗？去年云朵老师跟北大的教授一起探讨人生，聊着聊着就聊到了孝道。赵教授说：“我已经65岁了，我妈今年87岁。很多次想把她接到城里，妈却说：‘哎呀，阿娃，哪都不想去了。如果你要是想妈了，你就留下来住几个，跟妈说说话，妈给你做饭，妈给你煮面。’那天晚上，跟妈聊到了凌晨一点半。教授说：‘妈，您就睡，我要回城里了。’妈说：‘这么晚了，你就不要走了，要不你住一晚。’教授说：‘妈呀，真不行啊。明天还要工作，我很忙的。’”


    那天晚上下着倾盆大雨，平时一个小时的山路，那天车开得特别慢，走了三个小时。到了城里一看都快五点钟了。教授心里还在犹豫，心想要不要给妈妈打电话。教授犹豫再三，还是给阿婆通了电。刚一拨通，妈就接了。妈说：“你已经到家了吗？”教授说：“妈，你怎么这么快就接电话？你没睡。”妈说：“外面雨这么大，你一走来，妈就跪在菩萨面前，为你祈福，保佑你平安。听到你平安的消息，把心里的石头才落了地。”


    教授说：“挂完电话，我心里真的很难受。老母都快90岁的人了，冬天那么冷，妈在冰冷的地上跪了三个小时啊。这一幕我都想着，后面教授就补课。从那以后就是再忙，每周妈都会回家住一晚，陪妈说说话。教授说去年妈走了。我一辈子听过很多的故事，听到最动听的就是妈给我讲过的，几乎都能背下来的故事。我一辈子听到过很多的声音，最美的就是妈的唠叨声。但是妈不在了。原来我以为我的家是我的家，妈的家是妈的家。自从妈走了，我才发现妈在哪里，哪里才是家呀。”


    你的家在哪里？你家有爸爸妈妈吗？他们开心吗？他们快乐吗？他们的今天就是你的明天。可是有多少人做丈夫的为婆婆买件衣服，就在唠叨：“那得花多少钱。”做媳妇的给岳母买点东西，丈夫就在嘀咕：“你又花家里多少钱啊？”


    有人说：父母对孩子的爱，就好像是高山流水，总是那么的自然；而孩子对父母的爱，就好像是水往高处流，总是那么的困难。


    现在就加入云朵老师的终极弟子，让云朵老师帮助你，让你成为父母的骄傲，成为家族的荣耀，让父母过上更好的生活，更好的孝敬父母。你们愿意吗？


    看一下，有没有一种代入感。好，我们再来给大家演示一条。很多年轻李一诺老师看到过一条报道，在贵州六盘水，18岁的女孩因皮因为跟她男朋友分手，被硫酸泼在脸上，面部毁容，身上大面积烧伤。当爸妈赶到医院哭得泣不成声，医生说需要做植皮手术，爸妈跪在地上不停地磕头，说：“医生，就是砸锅卖铁卖血卖肾，我也恳求你把我的女儿救回来。”


    医生说：“重要的是准肯把皮肤割下来，换给你的女儿啊。”爹妈不停地抢着说：“医生跟我，医生跟我！”最后选中了妈妈。首先割妈妈背上的皮，再割妈妈手臂上的皮，再割妈妈大腿内侧的皮，然后再一点一点植在女儿的脸上和身上。


    手术持续了三个小时。为了保证皮肤的存活率，手术不能打麻药。三个小时啊，浑身是血的妈妈就像被剥皮了一样，昏死过去六次。最后一次昏死过去，只问了医生一句话：“医生，我的女儿疼不疼？”


    也就是受了一点委屈，当妈的都会心疼。可是如果有一天躺在病床上的是你的爸爸妈妈，各位请问问你自己，你能不能做到？一个三岁的小婴儿吃掉妈妈身上1500斤的乳汁，乳汁也被称为白血，是红色的血液变成的。很多男人去世的时候，留下又白又重的骨头；而一个母亲去世的时候，留下的是又黑又青的骨头。因为每个人我们都是吸着妈妈的血液长大的。


    各位，就冲这一点，我们能够不疼爱我们的妈妈吗？就从这一点，我们能够不孝顺我们的婆婆吗？就从这一点，我们能够不善待我们的妻子吗？就冲这一点，怎么能给天下所有的姐妹、所有的女性、所有的母亲一个最真、最爱、最诚挚的掌声呢？


    在这个时候，你记得会不会有掌声？肯定有。这就是代入感：先自己入戏，再引爆别人的情感。


    各位，一诺老师过去经常使用情感炸弹，最后总结出之所以情感炸弹能够有效，一个最重要的原因，那就是入戏。写下这句话，定位演讲的阵地。把这句话记下来：真感情胜过好文章，要想感动别人，先要感动自己。演说的最核心的成功秘密不是靠口才，而是靠演技。这就是一诺老师经常说的：人生如戏，全靠演技。


    一诺老师后面有机会会把88个情感炸弹整理出来。但是由于这个情感炸弹杀伤力太强了，因为之前无论是哪位终极弟子，在演讲时只要投入三个以上的情感炸弹，现场都能收到500万以上。因此，这88个情感炸弹价值一个亿。但是歼敌一千，自损八百。当你使用情感炸弹的时候，内功不够深厚的人可能会走火入魔，伤及自己。为了避免这种情况，88个情感炸弹只能将来有缘分传给见过

