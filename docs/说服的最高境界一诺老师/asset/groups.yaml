    \n现在就公布这些价值连城的催眠词，我们在使用催眠词的时候，大概是四种类型，大家可以把它记下来：疑问词、悬疑词、秘诀词、因果词。\n\n- 比如说：“因此”、“所以”、“为什么”、“这样使用呢？”前面你无论讲的是故事还是案例，后面你都可以说：“所以说只要大家听话照做，就可以达到什么样的效果。”“因此大家只要记住这三个公式就可以怎么样。”这时候别人就被你催眠了。\n\
