    ## 第六节 降龙第六掌犯规陷阱伏法（注：原文可能为“犯规/制造稀缺”，此处保留原意修正为通顺表达）


    越容易得到的东西越不珍惜，反之，越不容易得到的东西越珍惜。有句话叫做：妻不如妾，妾不如妓，妓不如偷，偷不如偷不着。不要觉得这是在开玩笑，这就是人性。把这句话记下来：人之初，性本贱，要学会设置障碍和增加难度。


