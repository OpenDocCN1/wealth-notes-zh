    ## 第四节 虐心大法四：认同攀比法


    让对方立刻觉得渺小和痛苦的公式。大家有没有发现一个现象，就是中国人妒忌心和攀比心是全世界最强的。攀比心理，背后是什么呢？

    标准答案：想被认同。被认同的感觉是快乐的、喜悦的、开心的。反之，不被认同的感觉是痛苦的、郁闷的、失落的。

    把这句话记下来：用别人的快乐去对比他的渺小和痛苦。

