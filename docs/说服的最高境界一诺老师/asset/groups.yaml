    围绕这三个万能公式去组织整个故事的逻辑，给大家演示一个案例，巴马水的故事。巴马瑶族自治县被誉为世界长寿之乡，类似于广西壮族自治区河池市在广西的西北部，根据第二次和第五次的全国人口普查，在巴马生活的百岁以上的老人占人口比例之高，居世界五个长寿区之首。说起巴马水有其独特的渊源，这还要从清朝说起。生于巴马的邓成才在大清朝廷为官，屡建军功，荣归故里。之后，他用自己的俸禄购买种子送给农民种植，造福百姓。1898年，光绪帝位于百岁高龄的邓成才新书四个大字为仁者寿。


