  - '[PAGE 4]


    # 第一章 说服降龙十八掌


    在这个世界上同样是老板，然而有些老板只能坐公交车吃快餐，住贫民窟，所以老板跟老板是不一样的。在这个世界上，同样是讲师，然而有些讲师只能收可怜的几块钱，像乞丐一样去忽悠一群穷鬼。所以讲师跟讲师是不一样的，也只有一个诺老师的演讲能够不见面，就可以把两本书卖到
    3980 元，不见面就能通过五个英雄帖招募上千位弟子，在这个世界上，再也没有人能量伊诺老师这样如水纯净的演讲。也只有伊诺老师的演讲能让你醍醐灌顶，茅塞顿开。也只有英国老师的演讲能让你哭，让你笑，让你晚上睡不着觉。也只有一路老师能做到，仅仅通过音频演讲，就能把自己的思想放进别人的脑袋。


    把别人口袋里的钱放进自己的口袋。你不得不承认，一诺老师不用跟你见面，也许一诺老师在环游世界，也许在钓鱼，也许在游泳，也许在睡觉。但是你却通过伊诺老师的音频课程开悟了，失眠了，报名课程并购买书籍了。有没有，你不得不承认，怜诺老师的演讲能让活人听了。有死亡的危机，让死人听了有复活的希望，在这个世界上再也没人能像殷诺老师一样，仅仅通过音频演讲，就能在一年内吸引千万粉丝。各位有时间你去看看那些所谓的大师，他们还在教别人营销和吸粉，结果自己的粉丝屈指可数，寥寥无几。公众号发布一条信息，一年的阅读量只有几百人。曾经有人说他能帮人吸粉学费只要
    99 块。


    李云东老师笑着说，大师啊，你不要这么贱卖自己好不好？什么


    1'
  - '[PAGE 5]


    99 块，我给你 99 万，你帮我吸粉，你帮我们改变世界 APP，吸 99 万的粉丝，我给你 99 万。但是如果你做不到，你赔我 99 万，你敢吗？大师懵逼了，直接无语了。


    很多人就是不会学习，整天被那些所谓的大师忽悠的晕头转向。如果你想跟他学营销，你看看他自己的平台营销的如何。什么是营销？营销不是推销东西，营销是让顾客主动的相信你，喜欢你，彻底爱上你，自己送上门主动购买你的产品或服务。当你看到那些所谓的大师还在到处推销，求别人买东西。请问你跟这样的人能学会营销吗？如果你跟他学习吸粉，你先要看看这位大师，他发布一条信息，有多少人浏览，你就知道了。这段时间很多奇葩很好笑，他教别人牛逼，营销万能吸粉。结果自己的公众号发布一条信息，半年才几百人的浏览量，一年后才一千多人的浏览量。可是这个世界就是傻子太多，聪明人明显不够用，居然这样低级的那骗术。还有人相信这些人的脑袋都被驴踢了。还有一些所谓的大师教别人实体店吸粉。


    说自己能给到实体店，每家 1000 个客户，十万个粉丝。当你看到这条微信公众号的信息左下角只有一百多的浏览量时，都不觉得打脸吗？这位大师都不害臊的，就是这样灼烈的忽悠，居然还有人相信还有一些所谓的大师教别人成功你给我一份信任，我还你一个奇迹。奇迹，你个鬼自己都没房没车，甚至都在靠信用卡套现过日子，居然还叫别人成功。


    太好笑了。还有一些所谓的大师发布一些跟豪车的合影，就是说这辆车是他的站在一栋别墅门前拍张照片。就是说别墅是他的，真不'
  - '[PAGE 6]


    要脸。如果你站在和谐号车头拍照，和谐号也是你的。还有更不要脸的大师在网上花 50 块钱找 PS 的人，把自己的人头移花接木，PS 一张跟某大师某名人某企业家的合影。其实明眼人一眼就看出来。那是假的，那是
    PS 的，因为 PS 的照片头像跟身子不一样的。各位大家记住一句话，炫耀什么就缺什么。若是狮子何必炫耀。所以你会发现一诺老师讲课从来不拿房子和车子用来炫耀，这些都很低级，非常低级。


    这样的大师跟跑江湖卖大力丸，胸口碎大石的骗子有什么区别？那一诺老师靠什么征服听众呢？靠实战的案例。第二靠催眠话术和带有病毒的语言。第三，靠征服性的演说公式。第四，靠一步一步引导别人说夜市的盈利。第五，靠征服人心的勾魂话术。第六，靠自动的营销系统。接下来伊诺老师会非常系统的带着各位弟子来百分之百的复制伊诺老师的
    6 种能力。


    还记得这 6 种能力吗？说服能力、演讲能力、营销能力、融资能力、顾问能力、领导能力首先会复制你如何一步一步引导别人。说 yes 的能力，也就是第一个模块说服的最高境界。在这个模块是把演讲时用来说服别人的语言逻辑、公式和模板进行拆解，把演讲的整体素质拆解成一个个的模块分开练习。就像汽车一样，不是一下子造出来的，是一个个的零件分开生产制造再组装在一起就是一部汽车说服别人也是一样的道理。当你一步步的练习，把每一个模块，每一个公式和每一个模板都认真训练之后，在第二个模块里，伊诺老师在教你
    How to 把每一个小的公式模板组装在一起。再教你如何训练一分钟演


    3'
  - '[PAGE 7]


    讲，三分钟演讲，五分钟演讲，十分钟演讲，半个小时演讲一个小时演讲循序渐进的分模块，一步一步的教会大家。除此之外，第二个模块不只是组装，还要教你如何训练自己的声音，如何包装自己的形象，如何定位演讲方向，如何营销自己，如何设计
    PPT，如何录制演讲，如何组织一场收钱的商业演讲。各位，商业演讲不能收钱，那跟放屁有什么区别？所以在后面一诺老师会教弟子商业演讲的前奏开场破冰。上半场洗脑中半场收魂，下半场收钱的非常系统的商业演讲模块，先给大家介绍最近要教大家的。


    演讲最高境界这个模块的第一章是收钱收人，收心，收灵魂的终极密码，叫做降龙十八掌。有好处，降伏法，情人降伏法，时空降伏法，追求降伏法，贪婪降伏法，犯贱降伏法，悬念降伏法，渴望降伏法，权威降伏法。思想病毒降伏法，惰性降伏法，欲望降伏法，懂你降伏法，阻降降伏法，授信降伏法，亲情降伏法，错过降伏法。情感炸弹降伏法第二章是瞬间引起注意力的九个公式和模板，叫做魔力诱惑，会教大家魔力诱惑原理、案例刺激法、因果关系法、社会引导法，悬念无国法。过程场景法、结果场景法免费刺激法时间价值法、结果保证法。


    第三章是让人求死不得求生不能的虐心公式和模板叫做虐心大法会教你痛点放大法严重警告法尊严、激将法，认同攀比法潜能，激大法情感冲突法情感共鸣法。第四章是瞬间激发人好奇本能的五个公'
  - '[PAGE 8]


    式和模板叫做好奇。悬念会教你好奇悬念原理，震惊型模板，水密型模板有头没味型模板有味，没头型模板，颠覆常规型模板。真的是太多了，所以不能这样介绍了，直接念主题吧。第五章，教你如何收服懒人。第六章，教你如何讲故事讲故事的五大要素，如何讲自己的故事，如何讲公司的故事，如何讲产品的故事，如何讲客户的故事。当你灵活掌握之后，你可以讲故事。讲到让听众白天撞毁，讲到听众买你的产品，每天忏悔。


    接下来第七章云朵老师还要教你勾魂销魂，点燃客户激情，爆破客户欲望的最高境界叫葵花宝典，说白了就是勾魂。学会这个之后，客户从今以后离不开你，对你欲罢不能。为什么？因为魂都被你勾走了。迪诺老师会教你勾魂原理，勾魂基本功，勾魂的魔力磁，勾魂的模板，以及如何每讲一句话都是在勾魂，甚至在一句话里可以放好几个勾魂的钩子。第八章，李云龙老师会教会你如何解决新未感的问题，叫做花鼓绵长。客户不买单，不成交不加盟，你就是不够相信你如何快速解决信任感的问题呢？其实信任是一场布局，画骨绵长，就是教你信任布局。学会以后，你的客户会相信你，喜欢你，深深的爱上你。


    只要你发布产品，客户就直接买买买。为什么？因为他相信你以上八章只是第一个模块中的一小部分。为了保障地址，的确。大部分内容还是留在弟子密训的课程当中讲，学习过程中请准备笔记本和笔。因为说服人是有逻辑的。椰糯老师把这些逻辑变成可复制、可套'
