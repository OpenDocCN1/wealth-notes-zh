    \ 30 岁负债千万，但是用了一诺老师五个步骤成为亿万富翁，屌丝逆袭，他是如何做到的呢？”来，想知道的请举手，想要了解这五个步骤的请举手。\n\n大家看到没有？催眠词可以连续用、组合用。当你融会贯通之后，来，我们再看几个：“你知道吗？”“你明白吗？”“听懂没有？”“有没有听懂？”各位，假设我们把前面的讲完之后，公布了三个秘诀，我们就可以问他：“来，听懂没有？”“来，听懂的请举手，还想不想要？”这就是后面内容之后了。\n\
    \n来，我们再看几个词：“到底”、“究竟”、“为什么”、“什么原因呢？”有一个穷困潦倒的屌丝只用了三个步骤，在三个月内成为千万富翁，他是如何做到的呢？到底用了什么步骤呢？是什么原因让他命运发生魔术般的改变呢？是的，这些词的用的方法很多。当你融会贯通，来，我们再讲几个词：“我将为你揭秘”、“我将为你破解”、“我将为你剖析”。\n\
    \n那怎么用呢？马云、孙正义只见了七分钟，说服孙正义投资几千万。现在我将为你揭秘这七分钟内发生了什么？究竟是什么原因？来，想要了解吗？想要知道吗？有没有这种感觉？\n\
    \n再来几个词：“我将告诉你”、“我将教会你”、“我将会让你明白”。各位，当你成为云朵老师的弟子，云朵老师将让你明白什么叫做演讲的最高境界，什么叫做说服的最高境界。看到没有？这是一种非常有魔力的催眠词。\n\
