    ## 第七章 故事共鸣法


    讲故事的五大要素及四个模板讲故事的五大要素。我们可以画一个五角星，第一个是主线，第二个是悬念，第三个是情景，第四个是冲突，第五个是感受讲道理不如讲故事。我们要学会通过故事在线客户的心路历程与客户产生情感的共鸣。然后通过故事主角帮助客户找到解决办法，把这句话记下来，讲故事比讲道理更有效。


    有一个驼背的小伙子叫莫西。有一天他去拜访一个商人，这个人有一个女儿叫弗西。墨西无药可救的爱上了伏羲。伏羲却因为他的驼背而拒绝了他。在准备离开的时候，莫西鼓起了勇气，到楼上伏羲的房间，把握最后和他说话的机会。伏羲有着天使般的脸孔，但让莫西十分沮丧的是，弗西始终拒绝正眼看他。经过多次尝试性的沟通，伏羲都不理他。最后莫西问道，你相信缘分天注定吗？伏羲眼睛盯着地板答了一句相信，然后又反问莫西，你相信吗？莫西回答道，我听说每个男孩出生之前，上帝便会告诉他，他将来娶的是哪一个女孩。在我出生的时候，未来的新娘便已许配给我了。上帝还告诉我，我的新娘是一个驼背。我立刻恳求上帝，上帝，一个驼背对女孩来说是一个悲剧。求你把驼背赐给我，再将美貌留给我的新娘。当时弗西看着墨西的眼睛，并被内心深处某些记忆所扰乱了。他把手伸向了莫西之后，变成了莫熙的妻子。


    把这句话记下来，故事一讲要啥有啥。莫西讲了一个故事，得到了自己梦寐以求的新娘。可口可乐讲了一个故事，成为世界第一。马云讲十八罗汉的故事，得到自己的商业帝国。香瑞米砸冰箱的故事，成就了海尔集团、百度的李彦宏、新东方的俞敏洪，小米的雷军，个个都是讲故事的高手。当今什么最值钱？标准答案，故事。放眼望去，现在信息爆炸广告是铺天盖地。酒香不怕巷子深的时代已经一去不复返了。王婆卖瓜的时代来临了。在琳琅满目的世界中，在产能过剩的时代，产品本身不再是消费者唯一关注的焦点。一个成功的品牌一定是一个会讲故事的品牌。把这句话记下来，卖什么都不如卖故事。马云、李彦宏、雷军、俞敏洪在卖励志的故事，史玉柱在卖华丽转身的故事，张瑞敏在卖质量的故事，德芙巧克力、玉兰油贩卖爱情的故事。怡云矿泉水在卖健康的故事，奔驰、宝马、宾利贩卖成功的故事。佛陀在卖极乐世界的故事，主耶稣在卖天堂的故事，老子在卖他的道，一诺老师在卖梦想，你的故事是什么？一个成功的企业，必须是一家拥有精彩故事的企业。一个成功的企业家，必须有一段励志的故事，现在就跟着伊诺老师的节奏学习如何讲故事。


