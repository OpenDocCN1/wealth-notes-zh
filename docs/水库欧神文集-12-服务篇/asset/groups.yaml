  md: "\n# 欧神文集（服务篇）\n\n![](img/c3fac56fec5f01299f526e037f388dbf_0_0.png)\n\n作者： yevon_ou（水库教主）\n\
    \n编辑：一笑加一笑（水库群主）\n\n版本：Ver6.0_2020.09.25\n\n## 欧神简介\n\n水库教主，中国房产投资体系开山鼻祖，人称欧神。博览群书，通晓古今。\n\
    \n网络常用名 yevon_ou。\n\n## 一笑加一笑简介\n\n自由意志主义者，奥地利经济学爱好者，自由市场经济支持者。2013 年，加入水库。\n\n\
    爱好：房地产投资和证券低风险投资。\n\n微信号（同 QQ 号）：150500211，邮箱：Shuikuers@gmail.com，此文集每月一更新。联系一笑加一笑，获取最新本文集。\n\
    \n以文会友，加微信，入水库微信群，共同学习房产投资知识。验证语：水库群。\n\n如果哪天水库失联，请联系 QQ 或邮箱，告诉大家大部队在哪儿。\n\n水库论坛公众号自\
    \ 2015 年 2 月 18 日首发文章，至 2020 年 9 月 25 日关闭。此电子文集为终极版，包含所有这段时间内：不外交文章、隐匿文章、被删除文章。\n\
    \n《楼市黄金十年》系列，写自 2003.6.9 至 2015.2.18 之间。很多文章并没有流传于世间，故不提供电子版本。若需要，请私聊一笑加一笑。\n\n\
    ## 前言\n\n水库目前提供各种服务。“只有大城市，才有房地产”，目前在各个一二线城市中，提供各种市面上稀有的服务，物美价廉。\n\n我的个人实战房产文章，可以看公众号：水库思维。\n\
    \n——老库友一笑加一笑\n\n## 水库存务 #80\n\n**一笑团队简介：**\n\n我们是只为买家提供买房服务的职业房产投资者。拥有专业的购房经验，擅长根据买家的资产、负债情况，进行房产配置规划、融资、破限购、破限贷、落户、选筹、谈判、贷款等一条龙服务。\n\
    \n从 2016 年开始，我们为近 300 位客户提供了上海买房服务；为 600 位客户提供了重庆、沈阳等城市的全国买房服务。\n\n我们可以帮您解决如下问题：\n\
    \n- 没有购房资格怎么办？\n- 没有钱怎么办？\n- 买哪里的房子？\n- 买哪种房子？\n\n一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……\n\
    \n## 一笑加一笑深耕如下业务\n\n- 1) 一手团购，二手淘笋：北京、上海、广州、深圳、沈阳、成都、重庆、郑州、南京、武汉、苏州、杭州。\n- 2)\
    \ 各大城市贷款业务（抵押，按揭）：\n  - (a) 一线城市：北京、上海、广州、深圳；\n  - (b) 二线城市：南京、苏州、杭州、武汉、重庆、成都、福州、厦门、天津。\n\
    \  - (c) 三线城市：沈阳、无锡、合肥、长沙、宁波、常州。\n  - (d) 其它：全江苏及浙江的大点儿的城市、赣州、石家庄。\n- 3) 落户：深户、南京户、重庆户、武汉户、苏州户、杭州、上海户。\n\
    - 4) 水库专用 POS（信用卡空当接龙专用）。\n- 5) HP 业务 (仅限上海、北京、深圳、杭州、成都。F,M 均有)。\n- 6) 学历提升：专、本、硕。\n\
    - 7) 装修：上海、深圳、沈阳。\n- 8) 法拍：北京、上海、杭州、沈阳、长沙。\n- 9) 沪牌代拍。\n- 10) 公司注册：上海、深圳、北京、重庆。\n\
    - 11) 入学：北京、上海、南京。大学、高中、幼儿园、小学、初中。\n- 12) 绿卡、$。\n- 13) 上海重病医疗。\n\n各种购房黑科技：限购、限贷、限售、限离；贷款融资（抵押贷款、信用贷、信用卡、民间），省税、首套资格等，均可咨询。\n\
    \n口碑需要时间浇筑，一笑从 2016 年开始服务库友，房产圈内信誉良好。\n\n我的微信：85503940，验证语：各业务名。\n\n- 买房过程中，想到的、想不到的窍门。都在这里！\n\
    - 我们是买房专家，谢谢信任。\n\n## 书库｜有房\n\n星主：一笑加一笑-购房\n\n![](img/c3fac56fec5f01299f526e037f388dbf_6_0.png)\n\
    \n![](img/c3fac56fec5f01299f526e037f388dbf_6_1.png)\n\n知识星球\n\n- • 有房知识星球\n\n\
