- pgno: 3
  md: '# 1.北京清吧分布概览


    +   朝阳区

    - 朝阳区为北京高品质清吧聚集区，且拥有较多的网红清吧，但同时朝阳区清吧基于地理位置和店面装修环境存在不同程度的溢价，消费价格相对较高

    - 朝阳区清吧主要分布在三里屯（那里花园、机电院）、亮马桥、世贸天阶、国贸及望京等区域。其中三里屯、世贸天阶片区清吧主要特点为清吧内环境装修较为特色；亮马桥片区清吧主要特点为沿河开店，户外环境较好；国贸片区清吧主要特点为所处地段繁华且部分清吧为高空酒吧，临窗视野开阔；望京片区清吧特点为拥有较多的啤酒吧，同时酒吧整体分布较为分散，拥有较多小而精致的清吧


    +   海淀区

    - 海淀区清吧的主要客户群体为海淀区高校学生，性价比较高，但海淀区清吧室内装修环境整体较为一般，且部分清吧酒水品质存在问题

    - 海淀区酒吧主要分布在五道口，其中华清商务会馆楼内有大量清吧，但品质良莠不齐；东源大厦周边清吧以超市型或餐酒吧为主，环境较为一般但性价比高；中关村东路16号院为五道口片区高品质清吧聚集区，但其价格高于五道口平均水平'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# 1.北京清吧分布概览（续）


    东城区


    +   - 东城区清吧主要为胡同清吧，极具北京特色和历史韵味，但由于部分胡同通车不便且部分清吧隐藏在胡同深处，东城区胡同内清吧不容易找到

    - 东城区清吧主要集中于南锣鼓巷、五道营胡同、东直门及安定门等区域。若选择南锣鼓巷片区清吧，要注意避开南锣鼓巷核心景区区域，该区域内清吧溢价高、品质低；推荐选择南锣鼓巷周边未进行商业化开发的胡同内清吧以及鼓楼周边清吧


    西城区


    +   - 西城区清吧除去同东城区的胡同清吧外，在金融街片区还有较多的高品质清吧，金融街片区清吧多为酒店配套酒吧，室内环境较为商务，但酒水品质较好

    - 西城区清吧虽然在后海一带高度聚集，但尽量避免后海沿线酒吧，该片区清吧溢价高、品质差，且存在较大概率的假酒风险'
  merge: -1
  img_proc: true
