    \ 第一，有什么要求，务必当面提\n\n人们接受当面请求的可能性要比通过电话、邮件等间接途径高出两倍。\n\n这符合我自己的体会。具体原因周依没展开说，我猜一是因为面对面说“不”很难，拉不下面子不就这么个理；二是当面对话没有留下反应时间，如果你不可能在一瞬间在是与否之间作一而从，说\"\
    是\"的可能性远远大于慢慢思忖并仔细权衡之后。\n\n那么，反过来讲，遇到别人当面提要求你感到为难呢？如果不想后悔你就不要当面同意，就说一句话，“给我点时间想想”，拖字诀，一定是千金。\n\
    \n### 第二，态度一定要好，立场坚决不变\n\n周依举了FBI谈判专家克里斯·沃斯例子。沃斯的书写名字就叫《不用分》，就是桌子上的蛋糕全拿走，啥也不留给对方。其实他也是没办法，因为他经常做人质谈判，什么也不能给劫匪，没得选，靠的就是一张嘴。\n\
    \n怎么做得到呢？\n\n沃斯去买车，一步到展厅，面带微笑，用理解的口吻，表示对方讨价很合理，但自己是出不了这个价。无论销售给什么理由要他加点钱，都这样，直到销售投降。当然，前提是研究透彻，准备充分，有备份方案，就是不行可以出门换一家。\n\
    \n### 第三，贴标签有魔力\n\n比如，“你是整洁的孩子。”这句话提升孩子收拾屋子的概率，比“你应该先做个整洁的孩子”要高，高出五倍。给标签魔力是70年代的心理学研究完成，今天已成为广告营销的支柱。你想卖什么东西，就把广泛投放的目标对象放到对应的那几个标签里，就是这么魔力。\n\
    \n《影响力》原意在于提醒读者，不要中了这些操纵术的招。结果发现，读他书的人都想知道怎么操纵别人！\n\n人心险恶啊。\n\n## 普通人怎么办呢？\n\n\
    - 第一，就是要对这一派有些了解，在下次遇到别人用这些招来对付你的时候，心中有数。不用多读，读《影响力》就可以了，这也是当代智者芒格极力荐的书。\n- 第二，掌握谈判的另一个流派，这一派重视理性，讲求原则，既不听图谋心理学技巧去操纵对方，也绝不吃套路试探。我在前面提到的巴里是在讲授这一派：谈判不应该是心理战，应该是解数学题。我比较喜欢这一派，接下来会推出极简谈判课系列。\n\
