    ## 耶鲁是这样的


    美国建国才240年左右，但耶鲁大学建校却有315年。没办法，北美大陆最早是西北部的英裔荷兰语移民地，先有文明，后有美国。这里和中国不一样，中国历史更久，现代人的历史观则更得多纠。


    历史很久，在这期间，校园不是老小城，但房子短了和大学一下，耶鲁大学靠森林车子就在市中心，后了一点的小社区，特别热闹，街道狭窄，登山上学山路，而闹市处的灯光学成整个校园的走廊30分钟，连个电影院在走廊两头就造了許多条街。


    耶鲁大学的建筑物大多有历史感，断然旧，也是最适合往风景静的地方画一下，代表系都爱研究生的住处。


    ![](img/4df33f9dae681a82a46724774851329a_7_0.png)


    但和麻省理工那样完全系冷白行怪的；


    ![](img/4df33f9dae681a82a46724774851329a_7_1.png)


    沉沉历史，耶鲁有14个学院，一个本科学院，两个研究生学院，一个医学院，职业学院，11个教学系，还有12个研究所，法学、法学第一个学院--- 因为耶鲁以法文之著名超级教育。


    制度自然会遇到矛盾，耶鲁虽自由，但也管得严格：14个学院的院长权力很大，每个学院自己决定选课，也是14位学长的支持时候，作为学院里学生有，我作为在校学长的在宿舍选举的时候，但学生这三个学生各自行选择事的事选。而且，伊丽莎白一任，但结果遇到下周一是节日，同时当天课程是上最后一周，9号5月是美国劳动节，课程提前完，下节课到下一周周五，我也一直没课。


    开学两周是耶鲁的选课课，耶鲁人称为shopping period，很形象，所有课程第一节都会教授教授同学课程，说要选课。学生这时感觉不再选择选什么课。


    耶鲁一年开多少课？有专门教世界人们消费技巧的教授说是3000门，马上涨到6500门！然后对这两个数字的说法是1000门，这两个数字！总之，对大学这种新兴趣随着课程增加，你会发现有了更多的课程和更丰富的一为经济学课的重要发威，完全是为了学生的课程开更大的这个中。


    令人头晕目眩的选课季下来，我有两点小小的体会。


    - 第一，**不是**在用学校的教授和现代化设备，上课法虽然几十秒个学院也提供这种小教室，教授在课上使用电子笔记本设备播放历史，气象台的信息，电脑只用于记笔记，**不建议的笔记，它们记请讲明。**


    写过《大国的兴衰》的著名教授保罗·肯尼迪就是这样。他在课上说，”绝对不许用电脑和手机。我们之前我忘记了，这位教授的课是全美国最著名的，肯尼迪除了5分钟笔记一记，把部份教授到美国国家图书馆，有论多少条笔记记录，希希望学生记得笔记和上课笔记：”不需要。”“无知识，有知识，可了。肯尼迪在地下写：你们不可能去听记的笔记，但是上课记住下在主任笔记本上，作为备用。我带几个做教，上校指我学校里，看到笔记不见了，校长这样，我，就，新观点，是”是学校学生坐的前半部分被教授们取消了，不知道怎么办，反正我听完课就想把笔记合了。


    不是每一位教授都让我把笔记写上，所以对教授用电子设备，主要还是为历史学教学保存。曾一位用教授用电脑记笔记有不安，教授说：“我需要每一页的脑子。”


    这里我要：最然我记的笔记是用横写惯写笔记，但提某一点课堂的效率，而从这来已得到奖，电脑。


    - 第二，**耶鲁本科生系统惊人。**


    一刚坐下，我在法学院，商学院就听不到了，典型的美式大课室，老师介绍自己，引导学生们走，但到了我主要是耶鲁本专科的课，耶鲁本科生的一堂大英语课，才真正感觉到。


    这是主科最值的第一堂课：讨论全球全球化，很幸，这个论题是我在求助耶鲁著名学者约翰·加迪斯时起的。我问他：


    ![](img/4df33f9dae681a82a46724774851329a_7_2.png)


    ![](img/4df33f9dae681a82a46724774851329a_8_0.png)


    ## 耶鲁怎么培养学生


    前一篇文章讲到，耶鲁施行通识教育，极重本科。本科生素质之高，惊吓了我。前两天请几位耶鲁高年级本科生吃饭，他们笑笑说：随时随地站起来，侃侃而谈，言则成理，这件事耶鲁学生最擅长。耶鲁学生的辩论水平在美国大学中也是翘楚。


    很自然地，其中一位讲起她的哥哥，她与哥哥都在耶鲁上学。为什么提到他呢？因为这位是个神人，最初为塞舌尔驻联合国使团做点事，然后因国际会，不明期成为其驻联合国代表，时年18岁而已，是联合国历史上最年轻的国家代表。


    塞舌尔虽小，但联合国是个大国小国都有机会发言的地方，而这位出自耶鲁，年纪虽轻，却有甘罗之风，特别能侃，依次得罪了伊朗、朝鲜，也曾被伊朗人在纽约大街上追逐，也曾被朝鲜放去终身禁止该国的黑名单。


    不去也罢。


    一边做联合国代表，他还一边在耶鲁当本科生。现在总算是不当了，今年毕业，拿到著名的罗德奖学金，即将去牛津呆一年。罗德奖学金是美国大学生的顶级荣誉之一，一年32个人有机会去牛津剑桥一到两年（插句话，这个奖学金的机会今年刚刚来到中国，第一年是10个人）。


    一个大写的服字。


    所以，我这篇文章准备讲讲耶鲁怎样培养学生。我到这里总共没几天，也还没来得及上过几堂课，有什么资格写这个话题？


    因为看了两个演讲。


    两个演讲都出自现任耶鲁大学校长萨洛维（Peter Salovey）之手，一个是今年秋季开学典礼发言，另一个更早些，是春未夏初时毕业典礼上的发言。一个迎来，一个送往，承载耶鲁这家300年名校对学生的期许。


    ![](img/4df33f9dae681a82a46724774851329a_8_1.png)


    在出任耶鲁校长之前，萨洛维担任过耶鲁本科生院院长、研究生院院长、大学教务长等职。他是著名社会心理学家，与他人合作提出了至今影响极大的“情商”理论，也曾为新生教过多年的心理学入门课。他懂耶鲁学生。


    耶鲁校长似乎没有什么任期一说，300多年校史至今，总共不过23任校长。你要是干得好身体又还能干，那就一直干下去。他的前任理查·列文就做了20年校长。萨洛维才三年，未来长得很。


    两篇发言，没有一篇讲学生具体应该学啥啥掌握什么技能，只讲一个主题：学生应该成为什么样的人。


    大学之道，在于树人。


    ### 先讲迎来


    今年秋季的开学典礼上，也就是前两天，对刚刚来到耶鲁的新生们，萨洛维讲了三点：


    - **警惕任何简单化的陈述**，特别是那些做法：夸大、扭曲、忽略关键事实，以煽起你的恐惧、愤怒和厌恶情绪；

    - 如果**这类陈述**与你的既有看法**特别吻合**，就要更加警惕；

    - **静态深密，保持怀疑精神，培养批判思维。**


    萨洛维说，耶鲁教育的价值，不仅在于扩展学生的想象力，增加其知识库，助力其职业生涯，更重要的是帮助他们在日益极化和碎片化的世界里，保有积极的领导性的角色。


    ![](img/4df33f9dae681a82a46724774851329a_9_0.png)


    ### 再讲送往


    往前几个月，春夏之交送别毕业生时，面对这群前往人生下一站的大好青年，萨洛维也讲了三点。


    - 无论何时何地，要**充分表达你的看法**，不论它是什么。充分表达看法，意味着不为从众而从众，也不要为了寻找认同和安全感而与看法相似的人抱团取暖。如果你的看法确实与众不同，一定把它说出去说清楚，这是你的权利，也是对社会的责任。


    与此相互为镜像，你得仔细倾听别人的声音，特别是那些与你不同的声音。萨洛维提出一个很有意思的看法，就是如果你要批评别人的看法，那么你要批评这个看法的最合理版本，而这一点你若不仔细倾听是做不到的。著名认知科学家丹尼尔·丹尼特也有类似看法：无论你要批评谁的**观点**，你要批评他观点中最棒的那10%，因为无论你是谁，其观点的90%都是没有价值的，要批评就批评有价值的那10%；此外，批评之前，你要把他的观点表达得比他本人更完整周到。


    这批评的门槛，你能越过吗？扪心自问，我还要努力。


    还不止此，萨洛维说，除倾听对方说什么之外，要付出更多努力，去了解他为什么这样说，理解其背后的个人经历和利益所在，而不能仅限于其观点的智识内涵。


    - 要**寻找共识**。如果你既全力表达自己，也仔细倾听他人，那么寻找共识就不是放弃原则，因为没有哪个社会经得起长时间的撕裂，要在多难之间为每个人都有份的社会创造性地寻求中庸之道。寻找共识的路上永远会有不同看法在对峙，但不要卡在对峙上。


    最后，萨洛维让毕业生们全体起立，训示：


    > 在你们踏出校门前往世界时，把耶鲁给你们的**全部带走**；

    > 寻找简单之道，但能理解复杂性；

    > 倾听，但保持批判精神；

    > 在人生际遇中找到快乐，但不忘**责任**。


    我当年走出校门的时候，何尝听过这样的训诫。


