    ## 战争没有离开过\n\n![](img/4df33f9dae681a82a46724774851329a_97_0.png)\n\n“中国为什么要掺合叙利亚的事呢？”手持一杯酒，穆斯塔法问我。穆斯塔法是同居耶鲁世界学人，来自叙利亚，被放逐多年。\n\
    \n我答不上来。我告诉他，我也不懂。如果一定要乱猜的话，就是中国跟俄罗斯在叙利亚问题上立场接近，并不是因为在叙利亚有多大具体利益，而是中俄接近大格局的一部分。\n\
    \n这不是什么好回答，大战略太空洞，叙利亚太悲剧。\n\n世界学人项目请来了纽黑文当地一些NGO组织负责人来作路演，其中的克里斯（Chris）来自当地难民接收机构，欢迎世界学人们去帮忙。\n\
    \n帮什么呢？\n\n他说，他们的规矩是，把难民从机场接出来，送到租好的公寓里，所有家具都是二手的，除了床垫，床垫必须新。同时，经办人要找义工，为难民一家做顿家乡饭，让他们在担忧、敏感、对未来最无把握的那一刻，闻到熟悉的味道。\n\
    \n你们谁愿意为难民做顿家乡饭？\n\n我举手，中餐有需要吗？\n\n克里斯摇头，我们缺做叙利亚家乡饭的人手。\n\n今天全世界有2000万难民，其中500万来自叙利亚。关于叙利亚之惨，不需要比这更多的话。\n\
    \n穆斯塔法在战争之前就离开了叙利亚。他早年参与成立NGO，上了阿萨德政府的黑名单，有数年东躲西藏，无门投止，托身于朋友之间。当时许多朋友莫名消失，再无消息，近来在网络流传的1500名叙利亚人被折磨的档案照片中找到。\n\
    \n阿拉伯之春传到叙利亚，出现了短暂的机会之窗。政府想把麻烦制造者们送走，于是送他一本护照：走可以，别回来。同样处境的不止穆斯塔法一人，有行者，有留者，各安其所安。\n\
    \n穆斯塔法选择离开，来到土耳其。随后，内战爆发，难民四起。穆斯塔法的NGO转而致力于帮助难民，帮助他们离开叙利亚，帮助他们通过中间国家，帮助他们到达目的地。在绞肉机下面，最重要的就是救人，能救多少是多少，人活着才有未来。\n\
    \n穆斯塔法来自伊德利卜。这个《圣经》中就有记载的历史名城此刻正在巷战之中。俄罗斯空军和叙利亚政府军正在空袭，联合国要求空袭停止。它是叙利亚今日的缩影，一台巨大的绞肉机，而在绞肉机上搭手的人越来越多，有阿萨德政府，有反政府武装，有IS，有基地组织，有库尔德人，有随时改换旗号形形色色武装，每一派势力都有对应的国际支持。这不仅是一场内战，还是一场代理人战争。\n\
    \n各方都在制造杀戮，问题是谁制造得最多？\n\n穆斯塔法给我看了一张图，叙利亚内战以来丧生人数及对应的死亡制造者，阿萨德政府远远地高居第一，占到95%，其他各方包括IS在内各在1%上下。当然IS只花了两年时间，就赶上其他派别四年的恶业。\n\
    \n我问他，今天的叙利亚内战各方，还有哪方算得上是世俗的民主派的力量？他说，没有了。恶与恶的螺旋把一切绞成了黑色。\n\n穆斯塔法不是穆斯林，他是完全的无神论者、绝对的世俗派，他喝酒，享受生活，对新奇的事情有天然的兴趣。一位世界学人将他的笑容最为温暖。\n\
    \n他活在当下，别无选择。\n\n他说，叙利亚内战没有军事解决方案，只能政治解决。代理人战争的最大问题就是无法结束，永远不会有决定性时刻，就是用人命来耗。虽然政治解决方案此刻看不到任何曙光，但谁知道呢？政治解决一定是无法预期的，因为叙利亚迄今发生的所有变局，事前都是完全没想到，如伊朗参与之深，如俄罗斯直接参战。\n\
    \n穆斯塔法与同事在自我怀疑与煎熬当中度日。许多同事虽然有申根签证，本可从土耳其坐飞机去欧洲，但还是上船，与难民一起偷渡，共担一点点风险，以略略平息幸存者中的内疚感。\n\
