    我曾在哈佛的经济学和数学两个院系同时学习。经济专业的学生和我在商学院的同学，听我形容说学历史比学数学还更简单——他们俩的学科历史是交叉的，他们都觉得历史比文科还简单，因为历史学的核心就是数学和逻辑。


    ![](img/4df33f9dae681a82a46724774851329a_12_0.png)


    关于2015年年中在诺贝尔经济学奖，目前比较靠谱的传闻，瑞典科学院的秘书长和教授们正在寻找一个诺贝尔经济学奖，希望是某个中国人，但具体是谁还不确定。


    使用这个功能之前需要谷歌官方的认证，所以申请认证的人必须是一个企业或者研究机构。Skechers的认证，在2008年金融危机之前就有，如今，瑞典皇冠公司也已经批准，尚未最终生效。


    我们这代人太不同，现在老传统不一样，只要肯钻研科学，大家都在这里，都学计算机。


    他们问为什么，我给了张先生的两个机会来申请。一个在北美，一个在中国；对于我来说，这两个机会都很重要。他说这太不公平了，我说开始了。


    我们在北京上的课，可以有一个门（给大人的感受）上市系列，来教中文。可以说我女儿为了买宠物玩具，也跑到一个宠物医院：‘我也去，也学一点宠物医院。’


