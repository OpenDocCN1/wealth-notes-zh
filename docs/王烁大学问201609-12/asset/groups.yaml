  md: "\n# 极简谈判课：有无选择决定拿到多少\n\n先复习一下极简谈判课迄今讲过的内容。\n\n谈判是做蛋糕和分蛋糕。\n\n蛋糕=双方谈拢的收益-双方谈不拢的收益。\n\
    \n谈不拢时双方各行其事的收益即各自的BATNA，就是各自底线，因为收益低于BATNA则谈判无意义，该干什么就干什么去更好。\n\n问题来了，BATNA确定了你的底价，但你可能只要底线。极简谈判第一课（首先，你得谈判！）讲清了只要底线的后果，就是谈成或谈不到就有限，谈不成就没有转圜空间。\n\
    \n在BATNA之上还有整个蛋糕在等着你，你要多少？\n\n至少有三种分法：\n\n- 第一，误导、忽悠、欺骗、恐吓对方，能弄到多少是多少，最好是全拿。许多人就是这样做，还有许多人认为人生赢家就该非得如此不可。\n\
    - 第二，按比例分，这是最常见的做法，双方各自投入多少资源，按比例分蛋糕。很合理吧？\n- 第三，平分。\n\n先来看第一种，事实上，以运用心理学技巧为核心谈判术，很容易走到这条路上来：\n\
    \n消除人性的弱点并利用它。没有证据显示这样不行，因为人生短暂，因为搞一票大的从此可以财务自由，因为许多人记忆力只有7秒钟，交情或笑话不笑。总之，成功有很多种，这也是一种，如果你有自信走这条路的话。\n\
    \n它的缺点是不好掌握，首先是没有普遍方法——每发现一个心理学就把心理改成心理术，但每一个心理学就有一个对应点，你使诈我使诈这个循环走不出来。谈判总要求止，知止而后有定，定而后能静，静而后能安，安而后能虑，虑而后能得。但心理底无止力的。\n\
    \n巴里说，谈判不必是心理战，可以变成似做数学题，我更喜欢这条路线。\n\n那么，第二种按比例分如何？\n\n按比例分蛋糕，最典型的就是股份分成，出多少分多少。不过先省着，下面再回来讲它。先再讲个巴里的故事。\n\
    \n可口可乐跟茶厂合作，因为可口可乐采购量大，让茶厂瓶成本从0.19美元降到0.11美元，假设采购1亿个瓶子，成本总共下降800万美元。怎么分？\n\n可口可乐说，成本下降主要来自于我的采购能力，对你也益处多多。第一个办法是销售法，可口可乐销售比茶厂多，可口可乐销售额比茶厂太大，你们分个几百万美元很不错了；第二个方法是简单切一刀，我要把分法写在了报表上是过了重要头的零头，零头分，没意思，咱们们分700万美元的，你们头100美元，100万美元对茶厂已经够意思了吧？\n\
    \n巴里不这样看。他说：你的采购能力是很强，但没有茶厂也不行，你既互不可缺；你说钱太少了你都没用，那800万对你也是太少，不如都给我吧。\n\n这些对话包含了两个关键原则：\n\
    \n- 1. 任何一方想多分的理由在谈判中都是对称的。以后面对对方多分蛋糕的理由，哪怕看似很合理，你总只要多想，都能找出恰当的回应，以子之矛攻子之盾。\n\
    这是因为，\n- 2. 在双方BATNA之上做蛋糕，缺哪方都不行。巴里举了个极端的例子：A、B两公司兼并后产生一大部分是由A公司收编B公司带来生产流程革新，这些收益该怎么分配？都给A？全给B？巴里说，B公司可以这样主张：如果不是我的生产如此落后，你A公司的技术就哪里能有这般大的改进收益？我的落后与你的先进，一起做大蛋糕，我落后我有功。\n\
    \n最后，可口可乐与茶厂平分了装瓶成本下降带来的收益，每家拿到400万美元。\n\n巴里认为，任一方放弃的话蛋糕都会消失，所以最好就是平分。合理、有原则的谈判好比做数学题，先确定每个人自己的BATNA，再定蛋糕有多大，最后平分。\n\
    \n回到前面提到的股份分，真的谁出资多少拿走多少吗？\n\n其实不是。\n\n你看马云在阿里巴巴搞的合伙人制度，且把当季、软钱在一股不变，只看作大股，当季软钱，雅虎人股中只投了钱，马云将支付宝走，释放强烈信号：越来最小的蛋糕哪一个呢？\n\
    \n类似的故事在中国商界天天都在发生，近年来效应公司因中国CITOD大离职潮，爆出期件争议，并使得互联网公司员工工期问题成为焦点，其本质是管理层与核心员工各自的BATNA发生剧烈变动，然后管理层重新蛋糕。\n\
    \n这个话题也有另一面，经济学家们通常说，\"人力资本是长着双翼的，\"指人力资本可携带，而它本质上就是的你的BATNA。无论如不能自己掌控自己的BATNA变小，在所谈利率中你首先得的是你自己的BATNA，然后再加你多得的蛋糕，你的BATNA越大，对等的BATNA越小，你就能拿走越多。\n\
    \n这些故事告诉我们，在中国这块大地上，法律不是挡箭牌。BATNA变了，谈判就跟着变。每个人为自己负责的最好办法就是增加BATNA。有选择权才能多拿。讲得已，最靠谱的走生策略。\n\
    \n前两天去见耶鲁法学院教授蔡美儿，就是《虎妈》、《虎妈战歌》作者——这个话题以后会单独写一篇，聊天中，她忽然说：\n\n> 你说什么使人幸福？我觉得是有选择使人幸福。\n\
    \n英雄所见略同。\n\n![](img/4df33f9dae681a82a46724774851329a_30_0.png)\n\n### 用户留言\n\n\
    - Apprentice胡铁元 5\n选择就是人生！首先人生的走向取决于大大小小选择的叠加，精讲读王老师的订阅读就比闲聊追剧多精进一分，选择学习如何谈判就比玩游戏在商业社会多一份适应性，就这么一个个的选择累积叠加，人生的方向就各不同。当精进到手里能够掌握足够的资源，那么就会拥有比资源少的人更优的选择，谈判主动权也是一样的道理，精进不已，真是唯一的策略。\n\
