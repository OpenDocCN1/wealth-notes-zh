    \ 问答 | 如何学习英语\n\n**一拉：** 请问您是如何提高英文的听说读写能力？对英文阅读，有什么好的建议？\n\n**王烁：** 我的英语水平没有我希望的那么好。我在听说读写当中，从强到弱依次是读听写说。近几年进步较大的是写作。如果是写文章的话，往往要自己用中文写一遍，然后又自己再改成英文。\n\
    \n说是我的弱项。一位英国语言学教授说，学语言要以写作为核心，我很同意。按说会写的话，说能有多难呢？但事实是近年我的口语并没有太大起色。\n\n本专栏刊发过极简谈判课系列，里面的主角巴里·巴教授教我怎么办。他说，你在家里，跟孩子只说英语，孩子要说中文的话，只能跟妈妈说，跟他说，你就不作反应，迫使他们只能跟你说英语。这样下来，很快孩子英语就很好了。\n\
    \n巴里是活用博弈论的高手，hack实际问题的聪明人，他的建议值得尝试。\n\n阅读方面，我近年来主要读的就是英文书，有价值的书一般是英文写就的。读书的时候，务必做到有生词必查，别溜过去。然后就是多读。\n\
    \n过去数年，平均自己一周上一本，去年做了一个微信号，把自己读后的感悟放在上面，也约请一些朋友在上面写文章。\n\n读英文书也不是完全没有捷径，可以先读读英文世界那些关于写作的书。比如《The\
    \ Elements of Style》（《风格的要素》），这是关于英文写作的经典，很小，忽略掉具体英文字词使用部分就更短，一小时读完。可借鉴英文世界对好文章的判断标准，有助于你更好更高效地读英文。\n\
