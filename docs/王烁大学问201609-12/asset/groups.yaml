    # 如何像黑心那个人的忠情


    我倒是觉得Bj是那种没有名字，罗伊·霍比和兰斯这两个名字都是取的很巧妙。Bj的名字在拉丁语里是‘圣徒’的意思，在中国的文化传统里，圣徒是...


