    # 第17周问答｜让孩子懂得这些关于钱的事


    黎兆生：我们70年代没有受过财商教育，我女儿高一，学校外的机构推销财商冬令营，作为家长怎样引导孩子的财商，和有哪方面的书籍作入门推荐给女儿？


    王烁


    首先，忘掉财商这个概念。在这商那商之中，只有智商（IQ，Intelligence Quotient）是有科学依据的。它可测量、可比较、可重复；情商（EQ）虽然已经进入心理学词汇，其提出者之一甚至已成为耶鲁大学校长，但在学术上仍有争议；至于财商，well，把它当个比喻就好。


    所以，我的建议就是：绝不要让孩子上什么财商冬令营，也不要让孩子去看什么有关财商的书。这些书和冬令营都不值一文。


    不过，应该让孩子懂得这些关于钱的事：


    第一，钱是好东西。


    每个人有自己定义的幸福与自由，但整个社会平均而言的幸福与自由，很大程度是由钱来衡量的，有钱才有幸福和自由。钱跟铜臭不铜臭无关，它是对资源的度量。资源可以是山川、大地、河流，可以是安宁、平静，可以是让陌生人为你做事。钱不是完美的度量，但现在惟一普通的度量就是钱。


    “44人笔记


    第二，钱总是有限的。


    稀缺无处不在。富到世界第一，盖茨的钱可也不是花不完的。因为一个人拥有的资源与其他抱负相比总是不足。所有人都缺钱，所以花钱就是取舍。让孩子建立预算，给自己的多重目标和需求排序，用钱来表达。


    第三，让孩子早点挣钱。


    早点挣钱，让孩子知道生活不易，没有人欠他们一个好生活，这是其一；其二是人生的错误要尽量犯在前面。犯在后面的错误你无法承受，少年则是最好的犯错时期，这时犯错的收益／风险比高到惊人，不犯错简直是虚度人生。


    我所知道的大多数传奇投资人物，不管出身什么家庭，都是从小就开始挣钱，在早早开始的成功和失败循环中不断学习，最终对钱所代表的一切产生持续终身的热爱。


    这比什么财商教育靠谱多了。


    欢迎留言写下你的问题，每周六我会作答。


