    # 极简金融课（中）：对你唯一靠谱的投资方案只有一个要求！


    交易环节是零和博弈，但市场还有正和博弈。这正是你可能在市场中战胜通缩的根本原因。


    长期中，股市参与者总以来的整体收益，并不都是正零，最终取决于上市公司效率提升业绩改善。所有历史数据以来，所有主要股市的代表性指数，在长期中看，穿过短期波动之后，都显示为一条向上攀升的线，就是斜率有所不同，因此存在所有人都获益的机会。这个正和博弈就是你作为普通投资者唯一应该参与的部分，透过市场赚企业成长和经济增长的钱。


    抓市场收益，就是抓市场的贝塔（beta，来源于希腊字母β），放弃战胜市场的执念，转而享受市场整体的风险报酬收益水平的回报。巴爷曾说过同理，风险如同河水吗？阿凡提说，如果飘飘石一样大。飘，阿凡提说的其实就是贝塔。


    不同市场的贝塔不同，最简单的方法就是股债混合。相对而言，股票长期收益率越高波动大，债券长期收益率低但波动小，互相补充，两者组合投资，能够在部分熨平波动地同时获得相对稳定的收益。


    # 举个简单例子：


    +   - 你有一笔工作收入，就开始建立股债投资组合，不要等。

    - 初始比例如为股债8:2，股8债2。

    - 每年或者平衡十一次：如果股票涨上所占比例超过80%，则卖出股票买入债券，把比例恢复到8:2，反之亦然。

    - 但是，每隔相当长一段时间后——般建议10到一年次——你需调整股债比例，逐步从8:2降到7:3降到6:4降到5:5...债所占比例逐渐来越高，最终到退休以后主要以债券为，即没有借收入，年轻人轻易承受股价波动风险，退休之后，因为没有工作收入，就应该承受投资上的一些险比例调整是为了匹配你的生命和收入周期。本内容仅供社群内部学习交流，切勿外传，人群群cccdd660道理就是这简，细节来说有无穷细节。


    +   - 股债初始比例8:2对你来说是合适？

    - 退休后全为债券对你来说是否过于稳健？


    每个人的生规划收入和投跨人生周各期分配情形都不同，只能是根据自己情况选择最适合自己的那个方案。大体而言，冒险期越率，退休后就必成守，这性格无关，关你的人生周期起点。


    至于买哪些股买哪些债？尽早忘掉这些问题，不要去赌你的眼光，也不要去博有眼光到合适的人帮你做决定。你得选择代表性为广的股票和债券指数，然后在与这些数对应的指教化投资工中，选择交易成本最低、成交量最大的那。


    这个思路放弃择股，几弃择债时，仅仅根据个人的生命周期和收入分配置最小风险的市场，最终把命运交给市场而不是自己的人博奕市场，对绝大数人来说是一种一靠的投资策路，选择不再试图战胜市场而是拥抱市场，才能免于被市场有针对性的伤害。


    之所以它靠谱，是因为长期中大体能躲战通胀。它能使你一生渐渐积累不被通缩所侵蚀，使你克制当下欲望把消费延期到未来的努力不致虚报。它不能实现你的发财梦，但能保护你。


    之所以如此，是为一系相关因素：从数十年的间维度来看，代表性最广泛的高债指数与市场通胀相关，市场与经济高度联。你看到越来越多的资产：房地产、大宗商品、海外资产、对冲基金、PE/VC等等。投资工具越来越复杂，但你的思路应当始终清如初：确定初始比例，中定期调期再平衡，长中定期调整比例，以配自己的生命周和收入分。


    它对你只有一个要求，而这个要求很高：克制自己的聪明主意，压制自己觉得市场是不可抗念头，放弃与市场博弈，转而以长打短，把投资当作为你工作生互补的另一面，把光阴岁月严丝合缝，相互对，阴阳对。


    把时间拉长到你的一生，视野从股债市场发致富转到利用市场保护自己，你会观地多市场长期波动，用更稳定的心态、更少的精力，更明确但长期中更有效的方法，来理自己的财富与人生。


    # 思考题：'
  - "[PAGE 3]\n\n# CAN YOU YES\n\n# 极高金融课（下）：终生投资是自己的事，别交给别人\n\n一生的投资安排这件事，无法外包。\n\
    \n首先，投资是你的人生，你的人生必须自己担道，无法交给别人。没有人能真正承担这个责任，翻翻书得得地抢着要指导的，都是骗子。\n\n其次，你只致力于获取市场收益，于是必须制定交易成本、交易中等与税务等约定这些要资是否可行，数十年的投资周期中，初始条件甚重，结果谬误无穷。\n\
    \n以今天中国金融市场上的投资工具为例，你去买个管产品，后是保险公司、银行、证券公司、信托公司等种种管道的层层嵌套，每一层都从你收益中分薄，但你确定的事是层层嵌套：要么，一毛出在半身上，羊毛出在猪身上，飞猪苦了！大半，你拿到一点，羊却一点不增加。要是你怎么不？\n\
    \n变了变一下巴菲特讲过的笑话：原来我自己买卖股票好好的，来了个投资银行家说给我出主意，给点好处就行；又来了个基金经理说你来找我就，给你好收益，再来了个保险公司的经纪人，说我没钱我管钱的人，给点好处就行；最后来了个要道夫。故事讲完了。\n\
    \n再次，需找人生约指数化组合长期投资，可别下雨，门槛不低，不需要更多的金融知识。专业的操作人员，那些属于大机构的秘密武器，你一样也不需要，只需要洞力与坚持黑黑的另以作管理，而且些只能管自己。如果这样做，别人有什么理由不鱼肉你一把呢？\n\
    \n最后，谈点你的事。\n\n你早早就做指，作指数化组合投资，短期内平衡，长期调配量比例，前面讲的你都做到了。那么，你一定能选择退保有自己人生努力所得税？\n\
    \n首先恭喜你，你可吗？大多数人答不一定，比他们更有机会保护自己？然后抱怨，答案还是一定。\n\n个人的人生线叠加到市场格局、经济起伏、全球兴衰多重体上，哪里还有你什么确定无误的事情？命运无常，会带来两件少见但关键的事情：泡沫和危机。\n\
    \n大抵法律规定，市场95%的时候是泡。可是，剩下那不正常的5%却是最关键的。如果剔除泡沫期约收益和危机期的损失，市场的能远定是惊人的，泡沫和高中的表现仍不是决定长期投资收益的重要因素。以倍得和耶鲁大学基金为例，这两个最优秀的买长期投机构投资者在2008年金融危机中损失了六成。那些没有这两家巨人的持久力被时间洗白的投资者，哪不非凡。\n\
    \n泡沫与危机，对应着机会，预测厄是人之常情，做这件事最精明的，是「愚人原著全是fool's gold，是英话，指像金子一样发光闪闪但没有价值的石头」，金闪闪闪光却不太值，好在，尽管不知道价是问处是，但总会知道大气身处哪种市场态：预测末来的天气不大可能，但为风天准备伞这件事都没有多难。别预测，就准备。\n\
    \n这里正不着意，你的责任：准备者其成本，市场既经时时候，你看你是最关键的，短期支付代价，有人为比高机构能承担支付代价，投资排你的事，机构不做一需战益基础是你对自己生对你那个基础外性，机构不会干，三个月期不在干个人扎线的行业，却做了这么多事情，因为机构总定了脑袋。\n\
    \n泡沫和机遇没有想象的多常见，仅仅过去数十年，几乎每十年就没有一场泡沫及其它带来的次生危机。投资有从20岁到70岁，你平均经历五次泡沫及危机。将视野拉到历史长河之后，你会发现它们在大绝大投资有有自身处到时感觉是可怕的，指数化再平衡组合投资在长期中能战胜通触的各种数据证明了这一点。\n\
    \n真正可怕的事是投资生涯经历乃那最后一轮泡沫-危机事件。好比有个人跟你要复一生，给爸爸万年，来借他，帮你，最后与你喝你，你一明光，还有下次个机会。整到人年，你不可能一泡大，你不能永远放弃情，不能放弃思考，不能放弃决断，哪怕你说再平衡组合长期投资，也要好好对抽身准备。\n\
    \n与此相对，对年轻人来说，如果一来就抄了个底不要绝望，也不必然有人抄到底部，投资人还有四五六七顶在未来等着你，慢慢来。\n\n要因斯坦说，要简单，但不要太简单。极高金融课，没有太最后的最后，推荐一本书。大卫新文森（David\
    \ Swenson）的《非常成功：个人投资的基本之道》（Unconventional Success: A Fundamental Approach to\
    \ Personal Investment）。斯文森是反对经济资本主义托邦的学生，长期持有股成长股票，以远低于市场水平的新解，获得高于市场水平的长期收益，并改变了美国大学校长们的投资组合风格，影响极大。这本书是新文森特投给散户的，核心告诫这二句：非专业投资者与市场作对手，最产品跨地域的多元化指数结合长期投，并梳理主要资产关别的期组进位、运动、资产特点，方便投资者根据自期合作出相应的方案。\n\
    \n如果说投资只读一本书，那就读这本。\n\n![](img/4df33f9dae681a82a46724774851329a_3_0.png)\n\n极高金融课到此告一段落。如果你对进阶金融继续兴趣，请留言，有兴趣的人够多的话，我会写进阶金融课，细致泡沫与危机。\n\
