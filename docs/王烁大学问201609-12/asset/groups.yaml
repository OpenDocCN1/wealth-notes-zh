    \n## 极简金融课（上）：别把市场当敌人，要当朋友\n\n你看到一篇文章的时候，别来个掰字斧字，不，别想一进去《玉篇玄阕》之前，先上个隔音墙吧；所以金融服务系列，不论你是什么学历，智商，收入多少，想做自己的现代牛，关于金融都最少必须知道下述这些。\n\
    \n不说废话，进入主题。\n\n### 不要指望炒股发财\n\n任何时刻总有炒股发财的人，但你炒股发财的机会微乎其微。这就是说发财，指获得超额收益在短期内既获取服务自由。不建议的对财务自定点的标准是什么。炒股则是泛泛。学“穷”而言，可以看看外汇、大宗商品、君子兰、普洱茶、艺术品、等等等等。\n\
    \n以股市而论，股票投资收益可分解为市场收益与超额收益两部分。超额收益即所谓的阿尔法（alpha，源于希腊字母α），它来自于你能比阿尔法的那些交易员的高超技能。是的，这是单一维才论述。但能理解死你，那都是后验的。\n\
    \n无论何时任何市场，总有一部分人获得阿尔法，但第一，几乎不可能事前估得出来；第二，整个市场的阿尔法是零和。因此阿尔法是争夺，阿尔法是零和游戏，阿尔法赚取市场中的丰者。\n\
    \n这个零和游戏你应该参加。比交易能力，你比得过专业机构吗？你有海量数据？你敢宣称公开信息，你的整合、分析能力比到大写12？你的反应速度你有超越快速调整在别人能做到的？你有超级计算机？你能持续获取阿尔法？极少有人拥有上面这些条件之一，而能连续拥有上面这些条件的，早就成为业内顶级机构。\n\
    \n市场没有固定之心，不知道你有多零和意识。想象市场当提款机的人，终将成为市场的提款机。\n\n更何况，如果仅从交易角度看，市场不仅是零和游戏，更是负和游戏。因为政策、交易所、中介机构要拿走各种费用，能活下来，越来越难。参加这个游戏，你就是任人割的鱼羊。别参加。\n\
    \n### 必须做一生的投资安排\n\n绝不能指望靠炒股发财，但你必须做投资安排，而且是一生的投资安排。你可能开始时是相互矛盾的，然而并不是。只有投资前情，才可能开拓着。\n\
    \n必须做一生的投资安排，是因为你的人生有有生到死的时间，有生来死有限，如朝阳升起，如夕阳落下。你要安好地死无遗朝夕，就必须做好一生的投资安排。\n\n假设生一生收入的和，相当于你的1000万元，但这些收入不会均匀地一生中取得。普遍的人生收入曲线是这样：20岁开始工作，获得收入，刚开始时挣得多少太多，收入几乎逐步上升，到25岁又达到顶峰，接着微松，然后收入速率变快，于60多岁退休，用青壮时的积蓄维持退休后的生活水平。\n\
    \n大多数人的一生，生不带来，死不带去。美国典型中产阶级家庭的收入与支出为结尾，就是把孩子送进大学，把自己养到死亡，用教育、医疗、养老，用于干净洁净，全部消耗完，这也将是中国家庭的典型轨迹。\n\
    \n在人生是上坡路的时候，你挣得花得多少，会有储蓄，你惜命，但不能停播得为它得是否尽尽，需要你的好伴侣，以便在你长大后变得得为你花得是否为花尽花得你的财富，它能变得住你的寿命。中产阶层，死时还是巨富是常事。但这恐惧独属于巨富，大多数人的恐惧是还没死，钱花光了--这才是人生第一大悲。\n\
    \n## 极简金融课（中）：对你唯一靠谱的投资方案只有一个要求！\n\n交易环节是零和博弈，但市场还有正和博弈。这正是你可能在市场中战胜通缩的根本原因。\n\
    \n长期中，股市参与者总以来的整体收益，并不都是正零，最终取决于上市公司效率提升业绩改善。所有历史数据以来，所有主要股市的代表性指数，在长期中看，穿过短期波动之后，都显示为一条向上攀升的线，就是斜率有所不同，因此存在所有人都获益的机会。这个正和博弈就是你作为普通投资者唯一应该参与的部分，透过市场赚企业成长和经济增长的钱。\n\
    \n抓市场收益，就是抓市场的贝塔（beta，来源于希腊字母β），放弃战胜市场的执念，转而享受市场整体的风险报酬收益水平的回报。巴爷曾说过同理，风险如同河水吗？阿凡提说，如果飘飘石一样大。飘，阿凡提说的其实就是贝塔。\n\
    \n不同市场的贝塔不同，最简单的方法就是股债混合。相对而言，股票长期收益率越高波动大，债券长期收益率低但波动小，互相补充，两者组合投资，能够在部分熨平波动地同时获得相对稳定的收益。\n\
    \n### 举个简单例子：\n\n- 你有一笔工作收入，就开始建立股债投资组合，不要等。\n- 初始比例如为股债8:2，股8债2。\n- 每年或者平衡十一次：如果股票涨上所占比例超过80%，则卖出股票买入债券，把比例恢复到8:2，反之亦然。\n\
    - 但是，每隔相当长一段时间后——般建议10到一年次——你需调整股债比例，逐步从8:2降到7:3降到6:4降到5:5...债所占比例逐渐来越高，最终到退休以后主要以债券为，即没有借收入，年轻人轻易承受股价波动风险，退休之后，因为没有工作收入，就应该承受投资上的一些险比例调整是为了匹配你的生命和收入周期。本内容仅供社群内部学习交流，切勿外传，人群群cccdd660道理就是这简，细节来说有无穷细节。\n\
    - 股债初始比例8:2对你来说是合适？\n- 退休后全为债券对你来说是否过于稳健？\n\n每个人的生规划收入和投跨人生周各期分配情形都不同，只能是根据自己情况选择最适合自己的那个方案。大体而言，冒险期越率，退休后就必成守，这性格无关，关你的人生周期起点。\n\
    \n至于买哪些股买哪些债？尽早忘掉这些问题，不要去赌你的眼光，也不要去博有眼光到合适的人帮你做决定。你得选择代表性为广的股票和债券指数，然后在与这些数对应的指教化投资工中，选择交易成本最低、成交量最大的那。\n\
    \n这个思路放弃择股，几弃择债时，仅仅根据个人的生命周期和收入分配置最小风险的市场，最终把命运交给市场而不是自己的人博奕市场，对绝大数人来说是一种一靠的投资策路，选择不再试图战胜市场而是拥抱市场，才能免于被市场有针对性的伤害。\n\
    \n之所以它靠谱，是因为长期中大体能躲战通胀。它能使你一生渐渐积累不被通缩所侵蚀，使你克制当下欲望把消费延期到未来的努力不致虚报。它不能实现你的发财梦，但能保护你。\n\
    \n之所以如此，是为一系相关因素：从数十年的间维度来看，代表性最广泛的高债指数与市场通胀相关，市场与经济高度联。你看到越来越多的资产：房地产、大宗商品、海外资产、对冲基金、PE/VC等等。投资工具越来越复杂，但你的思路应当始终清如初：确定初始比例，中定期调期再平衡，长中定期调整比例，以配自己的生命周和收入分。\n\
    \n它对你只有一个要求，而这个要求很高：克制自己的聪明主意，压制自己觉得市场是不可抗念头，放弃与市场博弈，转而以长打短，把投资当作为你工作生互补的另一面，把光阴岁月严丝合缝，相互对，阴阳对。\n\
    \n把时间拉长到你的一生，视野从股债市场发致富转到利用市场保护自己，你会观地多市场长期波动，用更稳定的心态、更少的精力，更明确但长期中更有效的方法，来理自己的财富与人生。\n\
    \n### 思考题：\n\nCAN YOU YES\n\n## 极高金融课（下）：终生投资是自己的事，别交给别人\n\n一生的投资安排这件事，无法外包。\n\
    \n首先，投资是你的人生，你的人生必须自己担道，无法交给别人。没有人能真正承担这个责任，翻翻书得得地抢着要指导的，都是骗子。\n\n其次，你只致力于获取市场收益，于是必须制定交易成本、交易中等与税务等约定这些要资是否可行，数十年的投资周期中，初始条件甚重，结果谬误无穷。\n\
    \n以今天中国金融市场上的投资工具为例，你去买个管产品，后是保险公司、银行、证券公司、信托公司等种种管道的层层嵌套，每一层都从你收益中分薄，但你确定的事是层层嵌套：要么，一毛出在半身上，羊毛出在猪身上，飞猪苦了！大半，你拿到一点，羊却一点不增加。要是你怎么不？\n\
    \n变了变一下巴菲特讲过的笑话：原来我自己买卖股票好好的，来了个投资银行家说给我出主意，给点好处就行；又来了个基金经理说你来找我就，给你好收益，再来了个保险公司的经纪人，说我没钱我管钱的人，给点好处就行；最后来了个要道夫。故事讲完了。\n\
    \n再次，需找人生约指数化组合长期投资，可别下雨，门槛不低，不需要更多的金融知识。专业的操作人员，那些属于大机构的秘密武器，你一样也不需要，只需要洞力与坚持黑黑的另以作管理，而且些只能管自己。如果这样做，别人有什么理由不鱼肉你一把呢？\n\
    \n最后，谈点你的事。\n\n你早早就做指，作指数化组合投资，短期内平衡，长期调配量比例，前面讲的你都做到了。那么，你一定能选择退保有自己人生努力所得税？\n\
    \n首先恭喜你，你可吗？大多数人答不一定，比他们更有机会保护自己？然后抱怨，答案还是一定。\n\n个人的人生线叠加到市场格局、经济起伏、全球兴衰多重体上，哪里还有你什么确定无误的事情？命运无常，会带来两件少见但关键的事情：泡沫和危机。\n\
    \n大抵法律规定，市场95%的时候是泡。可是，剩下那不正常的5%却是最关键的。如果剔除泡沫期约收益和危机期的损失，市场的能远定是惊人的，泡沫和高中的表现仍不是决定长期投资收益的重要因素。以倍得和耶鲁大学基金为例，这两个最优秀的买长期投机构投资者在2008年金融危机中损失了六成。那些没有这两家巨人的持久力被时间洗白的投资者，哪不非凡。\n\
    \n泡沫与危机，对应着机会，预测厄是人之常情，做这件事最精明的，是「愚人原著全是fool's gold，是英话，指像金子一样发光闪闪但没有价值的石头」，金闪闪闪光却不太值，好在，尽管不知道价是问处是，但总会知道大气身处哪种市场态：预测末来的天气不大可能，但为风天准备伞这件事都没有多难。别预测，就准备。\n\
    \n这里正不着意，你的责任：准备者其成本，市场既经时时候，你看你是最关键的，短期支付代价，有人为比高机构能承担支付代价，投资排你的事，机构不做一需战益基础是你对自己生对你那个基础外性，机构不会干，三个月期不在干个人扎线的行业，却做了这么多事情，因为机构总定了脑袋。\n\
    \n泡沫和机遇没有想象的多常见，仅仅过去数十年，几乎每十年就没有一场泡沫及其它带来的次生危机。投资有从20岁到70岁，你平均经历五次泡沫及危机。将视野拉到历史长河之后，你会发现它们在大绝大投资有有自身处到时感觉是可怕的，指数化再平衡组合投资在长期中能战胜通触的各种数据证明了这一点。\n\
    \n真正可怕的事是投资生涯经历乃那最后一轮泡沫-危机事件。好比有个人跟你要复一生，给爸爸万年，来借他，帮你，最后与你喝你，你一明光，还有下次个机会。整到人年，你不可能一泡大，你不能永远放弃情，不能放弃思考，不能放弃决断，哪怕你说再平衡组合长期投资，也要好好对抽身准备。\n\
    \n与此相对，对年轻人来说，如果一来就抄了个底不要绝望，也不必然有人抄到底部，投资人还有四五六七顶在未来等着你，慢慢来。\n\n要因斯坦说，要简单，但不要太简单。极高金融课，没有太最后的最后，推荐一本书。大卫新文森（David\
    \ Swenson）的《非常成功：个人投资的基本之道》（Unconventional Success: A Fundamental Approach to\
    \ Personal Investment）。斯文森是反对经济资本主义托邦的学生，长期持有股成长股票，以远低于市场水平的新解，获得高于市场水平的长期收益，并改变了美国大学校长们的投资组合风格，影响极大。这本书是新文森特投给散户的，核心告诫这二句：非专业投资者与市场作对手，最产品跨地域的多元化指数结合长期投，并梳理主要资产关别的期组进位、运动、资产特点，方便投资者根据自期合作出相应的方案。\n\
    \n如果说投资只读一本书，那就读这本。\n\n极高金融课到此告一段落。如果你对进阶金融继续兴趣，请留言，有兴趣的人够多的话，我会写进阶金融课，细致泡沫与危机。\n\
    \n## 精选留言\n\n- Apprentice·胡秋元 17\n  投资就知老师所说越简单越好，三大要素：复利、杠杆和风险，投资收益的高低就取决于这三只用涉及自白银金是得稍晚一些。再回学一下之，这个人可以运用到人生的方方面面，复利好处不必多说，体现在生活的每一个维度，核心和积，可以说终其一生，表现在生活的每一个维度，核心和积，可以说终其一生，也是最近人性的东西，不投也是投资人。\n\
    \n- 许江浩 5\n  大道至简，其实不易。古人有说，知易行难。世界5大语言难，何谓为人，总就是钱，一英二智，转头额大，生年有年，就比大危，有智慧，一体线行，简单重重，要受一生。泡沫危机，十年之期，如你激动，期待达到。\n\
    \n- 依然特梅 5\n  在订阅《顶级大学》之前有些想惴，其都是年，而你是只有五六个月。然而自从天连篇订阅现在看可以完三进，的确真的让我收益匪浅！谢谢你！如果你说这是，的确，的确是的，你的文章，你的栏自。过去我要补课，以后的事不说了。\n\
    \n- 夏小耳 5\n  对金融课很早兴趣，但一直不知道从哪里入手，觉得学好金融是实现个人财务自由的很好的一个手缘，希望王老师更多些相关知识。\n\n- 西东东西\
    \ 5\n  学的太好了，这个虽称高到为极高金融课，但是对于我这样一个外行来说，不理解高到极低金融，也对于一些金融和经济学的方面的介绍，但是还是没怎么来搞过，通俗易懂，非常谢谢！\n\
    \n- 经天 2\n  李老师写投资把自己一部分转到那个刑期，今年受大牛市的情绪之后，也进一步长恨谁也可慢高思”常人生”，以及大投信管理那里读说的”真，真是遇事常思人生，即使自己能够好的规避风险，正如三位老师（王炼、李笑来、万维钢）都提到的，努力让自己达到知识状态。\n\
    \n- E 1\n  明白期间，同感很高人定投但却能坚持超过三年的一个没有，成功的诱惑，低能、的德态，人性暴露无遗，希望都能认识到自己的力\n\n## 加速给我的三个惊吓\n\
    \n耶鲁开学第一天，我去拜访约翰·加迪斯（John Gaddis），受到了三个惊吓。\n\n加速是什么人呢？\n\n你要去见加速吗？就是那个加速？此话普遍放—百遍提高八百度？这是耶鲁学生向我所说的反应。\n\
    \n耶鲁有些怪台级者，加速是其中之一。他长冷战史。冷战史，选研究生大核器（Grand Strategy）。是的，你的报格，在冷战史学家中，加速最为先知，他著书带评，通晓冷战时局，冷战史，在《战略史》、《乔治·凯南传》本，本都是经典好读。\n\
    \n关于“凯南传”还有一点题外话。凯南本无未家简介，考虑到读者可能年纪较轻，没在加上那个时代，我多说几句。\n\n如果有人有一个，能称得上是美国冷战战略的总设计师，这个人就是乔治·凯南。1946年，他力推美苏使馆馆副馆长电报，以此改变了世界历史。电报核心内容解析了苏联对英法扩张的应对方式，苏式为以己为轴心，死命扩张。《铁幕演说》、《冷战史》、《乔治·凯南传》，本都是经典好读。\n\
    \n凯南说，美国不必击败苏联，只需它不再扩张就行。遏制与封锁（containment）而不是回滚（roll back），要在苏联扩张的任可地方予以坚决回击，但无须强行改变任在任时地。这一策略成功迫使苏联自我失败，而不是战而败之。\n\
    \n冷战据有然的就是结束得突然。多年后有一天，在问到美国对于苏联解体的这件事上，凯南为什么，凯南讲了一个俄罗斯富村，牛一富在穷村，于是两头牛牵上了这着，牛死后富村，穷村也变成牛做牛了，而穷村变成了一根牛，冷战就是这样。美国确实实现了我的部分，但我想说的是不但是不是，而是向另一个世界展现了由世界自己的样子。\n\
    \n回到来，回到来。\n\n凯南加迪斯写得好，加迪斯前事写包含他包，他所有精思都开放，前事加迪斯一个手就是，无名个有：死记心死也出能，在真实世界里面与作者相比都分可少活者，死名后出活，后也才可能以实。而且，加迪斯比加迪斯年少37岁呢？\n\
    \n只知道，出到凯南时，我写进了101页，他书里面有提到所有人，他凯南在“前头，没到凯南：凯南把地，出也凯南在他前事里，那你这么多？问人每次书信往返，凯南都表示我活得太久了很抱歉。\n\
    \n这好就没全没发生。2005年，凯南去世；2012年，《乔治·凯南传》出版，立即获布雷克立奖项，是为经典。\n\n我为什么见这么一个冷战史家学者呢，哪怕是天字第一号的冷战史专家加迪斯？\n\
    \n因为，我已看见，从中国、美国、欧共、中东，都传来信，世界各国进入冷战状态中。冷战略就类美苏二战世界大战和年代结束了。中国与世界越来越紧密，美国和日本越来越远，未来世界会不会进入冷战状态？我们如何应对其？\n\
    \n于是有了我的第一个惊吓。\n\n我问，加迪斯，从冷战到什么可教训对今天有益？教谕一，请用英文给我说lesson。\n\n首先，冷战比不让我冷。加速回答到。\n\
    \n我马上意识到，我接加速加迪斯开两杀系手平线上了。我根也以为冷战到冷战可能不了了，未想过这有平线了，他加迪斯为什么？冷战争不冷，至少冷战了，他有lesson一词的理解，不是教训，而是结论：美苏争年决定面打起来，这可是个大教训。\n\
    \n这样的啊，我消化一下。\n\n你的意思是，说现在已经处于事实上的冷战中了吗？\n\n不是，没有冷战。\n\n我长出了一口，但马上便又，第二个惊吓来了。\n\
    \n现在不是冷战，我有意思是今天不是冷战，而今天意识不是不是冷战国。我们冷战的意识界还存在回到第一次世界大战前那种那种力里平衡，of balance of\
    \ power，就是保持要反的平衡，美国、中国、欧盟、俄罗斯、欧洲，五大势力在很使平这种状态—全球的力量平衡游戏。\n\n力量平衡，这个词语听起来古老，但它对应的是下面这些东西：\n\
    \n- 第一，各国均是自私的社会本，借力混设，没有共同认可的规则、原则和价值观。\n- 第二，各国之间调用数据到敌我友的混合，弱者联合以制强者，但有时和强合，不受历史、文化、以鲜血流成的友谊关系，加迪斯提到了斯普利，而斯普利最著名的友就是：政治家能掌握原则，但俄手想要不受规则的约束，不能说俄国416特是强权区。\n\
    \n“天命不是强，福不是法。人言是自言，”一切基于主权国家利益，这就是力量平衡游戏的几个玩法。\n\n国际的力量平衡游戏主导了几乎整个人类历史，也最后导出现实结果。欧洲两度平衡的游戏体系主导了两次世界大战。\n\
    \n可以说，二战后美国的国际政治是依力量，联合国是世界性国际体系，国际关系的本质就是国际权力关系的互动，其内在逻辑是建各种类类的规则，共的价值及观其他国际多边机制，各自竞争获取优势。\n\
    \n我自问，问加迪斯对多边体系都回回去了？\n\n加迪斯有没有下我4想空间，是的，多边体系从来很脆弱，联合国从来没没超越过强国意志，现在变得更弱。问题是，国际关系的本质就是强国意志以实态论为主？如果是15年、20年看，从人类总体看也是。今天人类说碎片化，大强各显神，在分裂区竞争张力也已成为人。全球的力量平衡时代已经到来，而且各国各显其制，有的有权、有的制，并不共享同一体制。\n"
  mdcn: "\n## 发刊物：惟一靠谱的人生策略\n\n罗振宇\n\n我很想把把订阅产品定名为《王栋大学问》的时候，我是抗拒的。\n\n“不相当。”\n\n\
    “你想多了。不是大·学问，是大学·问。”\n\n“这样的啊。我这插。”\n\n提问是我的工作。如果有一件事是我的专业，就是它了。\n\n我新闻人从业20年，参与创办中国最出色的财经新闻周刊财新传媒，采访过的专业不在其多，刚过去这个夏天就有周小川、何首云、默茨写这些。采访多了，我便日个领语。记要是的内容，大多数人的话出过问题，使新闻人只给出高质量的回容，传达结论者，理解问题再思索，反复迭代。好记着理解两手，一边理解新闻人，一头理解读者需求，然后用我的理解把两边接在一起，成败道理。\n\
    \n我这次不是采访，是高强度学习，达成相遇。\n\n从9月7号，作为2016年度的耶鲁世界大，我注耶鲁大学世界人士计划由耶鲁大学前校长柯德·莱文创设，每年从世界上1千余名人中挑选出十余，在耶鲁大学学习一个学期，旨在培养明日领袖。明日领袖不事故，我把这当成难得的学习机会。\n\
    \n我见过的杰出人物太多了，不同是终身学者，在漫长的生命马赫拉中，渐渐把停止学习的时间不同，一隅他生。人生于他们是在常态。金亚衣群李落下，如今在下雪背词的时候，他不再汉译出什么用典，更是有到一冬会，在亚汉文片学用非古典没有太打没动人，是到不我实较深识的通感。学习不止于觉实习作者，或者并开始终解自名做到更好更是学习，有学新工作者，动并早已功成名就，却终能不一转线，实切更其音，达则兼天下，终身学习事在道场，与中国一起学到高峰。命运与个人努力，缺不可。\n\
    \n世事无常，精进不止，是一惟靠谱的人生策略。\n\n在学习的世界里，我是贪婪的游牧民族。看哪里里的草更肥美，我就为场地到里，很远，遥远，新知识了有比不停够有理由动员力。世事常，无是知，做了一件大事不每个领域发作，必须立即应反应，快学习，你的分极框架包容，有弹性，管，持续改良，还要得好到。\n\
    \n智识的游牧民族还没有，只需要一每到都有立之处。多年来，智识，我住里了三个学生位，是、商管理、国际关系，但除了人，我们有个何领域见都没有把握，不需是。我特合学发人，没有一个类二八大定律，就是出不努力，分一个领域不解学，不学不学，而首先八成就起用。因为为八学而学，而为学有用，八成就用起用；其效，也是更难。八定律项中获取的效益我对新领域的效，与其更注重的，八定有领域中获得效益。二定八定律的另一一半，是如要为克尽剩下的成，需要付出另外八成的努力，所以他们要努力用在别的处：跨界。\n\
    \n麻省理工学院媒体实验室主任托伊兰说，最有创新能力的那些人，在观的溪流中自得其样，获得一个新发现，就把它量入思想的溪流中，与他在大交换，碰撞，验证，证合，生发出新观念。何？不是学，但不浸着止，而是逐知识、观念、思想、技能各领城撞化的化学反应，不能自己。\n\
    \n世界人士项目很特别，它每年从全世界选择十余，成就不同，背景各异，把他们放在同，学，彼此影响，共同受一流学术环境的净化，让认知理念在学术熔炉里煅，为明日备。他们这样介绍和期许耶鲁人：\n\
    \n## 极简金融课（上）：别把市场当敌人，要当朋友\n\n你看到一篇文章的时候，别来个掰字斧字，不，别想一进去《玉篇玄阕》之前，先上个隔音墙吧；所以金融服务系列，不论你是什么学历，智商，收入多少，想做自己的现代牛，关于金融都最少必须知道下述这些。\n\
    \n不说废话，进入主题。\n\n### 不要指望炒股发财\n\n任何时刻总有炒股发财的人，但你炒股发财的机会微乎其微。这就是说发财，指获得超额收益在短期内既获取服务自由。不建议的对财务自定点的标准是什么。炒股则是泛泛。学“穷”而言，可以看看外汇、大宗商品、君子兰、普洱茶、艺术品、等等等等。\n\
    \n以股市而论，股票投资收益可分解为市场收益与超额收益两部分。超额收益即所谓的阿尔法（alpha，源于希腊字母α），它来自于你能比阿尔法的那些交易员的高超技能。是的，这是单一维才论述。但能理解死你，那都是后验的。\n\
    \n无论何时任何市场，总有一部分人获得阿尔法，但第一，几乎不可能事前估得出来；第二，整个市场的阿尔法是零和。因此阿尔法是争夺，阿尔法是零和游戏，阿尔法赚取市场中的丰者。\n\
    \n这个零和游戏你应该参加。比交易能力，你比得过专业机构吗？你有海量数据？你敢宣称公开信息，你的整合、分析能力比到大写12？你的反应速度你有超越快速调整在别人能做到的？你有超级计算机？你能持续获取阿尔法？极少有人拥有上面这些条件之一，而能连续拥有上面这些条件的，早就成为业内顶级机构。\n\
    \n市场没有固定之心，不知道你有多零和意识。想象市场当提款机的人，终将成为市场的提款机。\n\n更何况，如果仅从交易角度看，市场不仅是零和游戏，更是负和游戏。因为政策、交易所、中介机构要拿走各种费用，能活下来，越来越难。参加这个游戏，你就是任人割的鱼羊。别参加。\n\
    \n### 必须做一生的投资安排\n\n绝不能指望靠炒股发财，但你必须做投资安排，而且是一生的投资安排。你可能开始时是相互矛盾的，然而并不是。只有投资前情，才可能开拓着。\n\
    \n必须做一生的投资安排，是因为你的人生有有生到死的时间，有生来死有限，如朝阳升起，如夕阳落下。你要安好地死无遗朝夕，就必须做好一生的投资安排。\n\n假设生一生收入的和，相当于你的1000万元，但这些收入不会均匀地一生中取得。普遍的人生收入曲线是这样：20岁开始工作，获得收入，刚开始时挣得多少太多，收入几乎逐步上升，到25岁又达到顶峰，接着微松，然后收入速率变快，于60多岁退休，用青壮时的积蓄维持退休后的生活水平。\n\
    \n大多数人的一生，生不带来，死不带去。美国典型中产阶级家庭的收入与支出为结尾，就是把孩子送进大学，把自己养到死亡，用教育、医疗、养老，用于干净洁净，全部消耗完，这也将是中国家庭的典型轨迹。\n\
    \n在人生是上坡路的时候，你挣得花得多少，会有储蓄，你惜命，但不能停播得为它得是否尽尽，需要你的好伴侣，以便在你长大后变得得为你花得是否为花尽花得你的财富，它能变得住你的寿命。中产阶层，死时还是巨富是常事。但这恐惧独属于巨富，大多数人的恐惧是还没死，钱花光了--这才是人生第一大悲。\n\
    \n## 极简金融课（中）：对你唯一靠谱的投资方案只有一个要求！\n\n交易环节是零和博弈，但市场还有正和博弈。这正是你可能在市场中战胜通缩的根本原因。\n\
    \n长期中，股市参与者总以来的整体收益，并不都是正零，最终取决于上市公司效率提升业绩改善。所有历史数据以来，所有主要股市的代表性指数，在长期中看，穿过短期波动之后，都显示为一条向上攀升的线，就是斜率有所不同，因此存在所有人都获益的机会。这个正和博弈就是你作为普通投资者唯一应该参与的部分，透过市场赚企业成长和经济增长的钱。\n\
    \n抓市场收益，就是抓市场的贝塔（beta，来源于希腊字母β），放弃战胜市场的执念，转而享受市场整体的风险报酬收益水平的回报。巴爷曾说过同理，风险如同河水吗？阿凡提说，如果飘飘石一样大。飘，阿凡提说的其实就是贝塔。\n\
    \n不同市场的贝塔不同，最简单的方法就是股债混合。相对而言，股票长期收益率越高波动大，债券长期收益率低但波动小，互相补充，两者组合投资，能够在部分熨平波动地同时获得相对稳定的收益。\n\
    \n### 举个简单例子：\n\n- 你有一笔工作收入，就开始建立股债投资组合，不要等。\n- 初始比例如为股债8:2，股8债2。\n- 每年或者平衡十一次：如果股票涨上所占比例超过80%，则卖出股票买入债券，把比例恢复到8:2，反之亦然。\n\
    - 但是，每隔相当长一段时间后——般建议10到一年次——你需调整股债比例，逐步从8:2降到7:3降到6:4降到5:5...债所占比例逐渐来越高，最终到退休以后主要以债券为，即没有借收入，年轻人轻易承受股价波动风险，退休之后，因为没有工作收入，就应该承受投资上的一些险比例调整是为了匹配你的生命和收入周期。本内容仅供社群内部学习交流，切勿外传，人群群cccdd660道理就是这简，细节来说有无穷细节。\n\
    - 股债初始比例8:2对你来说是合适？\n- 退休后全为债券对你来说是否过于稳健？\n\n每个人的生规划收入和投跨人生周各期分配情形都不同，只能是根据自己情况选择最适合自己的那个方案。大体而言，冒险期越率，退休后就必成守，这性格无关，关你的人生周期起点。\n\
    \n至于买哪些股买哪些债？尽早忘掉这些问题，不要去赌你的眼光，也不要去博有眼光到合适的人帮你做决定。你得选择代表性为广的股票和债券指数，然后在与这些数对应的指教化投资工中，选择交易成本最低、成交量最大的那。\n\
    \n这个思路放弃择股，几弃择债时，仅仅根据个人的生命周期和收入分配置最小风险的市场，最终把命运交给市场而不是自己的人博奕市场，对绝大数人来说是一种一靠的投资策路，选择不再试图战胜市场而是拥抱市场，才能免于被市场有针对性的伤害。\n\
    \n之所以它靠谱，是因为长期中大体能躲战通胀。它能使你一生渐渐积累不被通缩所侵蚀，使你克制当下欲望把消费延期到未来的努力不致虚报。它不能实现你的发财梦，但能保护你。\n\
    \n之所以如此，是为一系相关因素：从数十年的间维度来看，代表性最广泛的高债指数与市场通胀相关，市场与经济高度联。你看到越来越多的资产：房地产、大宗商品、海外资产、对冲基金、PE/VC等等。投资工具越来越复杂，但你的思路应当始终清如初：确定初始比例，中定期调期再平衡，长中定期调整比例，以配自己的生命周和收入分。\n\
    \n它对你只有一个要求，而这个要求很高：克制自己的聪明主意，压制自己觉得市场是不可抗念头，放弃与市场博弈，转而以长打短，把投资当作为你工作生互补的另一面，把光阴岁月严丝合缝，相互对，阴阳对。\n\
    \n把时间拉长到你的一生，视野从股债市场发致富转到利用市场保护自己，你会观地多市场长期波动，用更稳定的心态、更少的精力，更明确但长期中更有效的方法，来理自己的财富与人生。\n\
    \n### 思考题：\n\nCAN YOU YES\n\n## 极高金融课（下）：终生投资是自己的事，别交给别人\n\n一生的投资安排这件事，无法外包。\n\
    \n首先，投资是你的人生，你的人生必须自己担道，无法交给别人。没有人能真正承担这个责任，翻翻书得得地抢着要指导的，都是骗子。\n\n其次，你只致力于获取市场收益，于是必须制定交易成本、交易中等与税务等约定这些要资是否可行，数十年的投资周期中，初始条件甚重，结果谬误无穷。\n\
    \n以今天中国金融市场上的投资工具为例，你去买个管产品，后是保险公司、银行、证券公司、信托公司等种种管道的层层嵌套，每一层都从你收益中分薄，但你确定的事是层层嵌套：要么，一毛出在半身上，羊毛出在猪身上，飞猪苦了！大半，你拿到一点，羊却一点不增加。要是你怎么不？\n\
    \n变了变一下巴菲特讲过的笑话：原来我自己买卖股票好好的，来了个投资银行家说给我出主意，给点好处就行；又来了个基金经理说你来找我就，给你好收益，再来了个保险公司的经纪人，说我没钱我管钱的人，给点好处就行；最后来了个要道夫。故事讲完了。\n\
    \n再次，需找人生约指数化组合长期投资，可别下雨，门槛不低，不需要更多的金融知识。专业的操作人员，那些属于大机构的秘密武器，你一样也不需要，只需要洞力与坚持黑黑的另以作管理，而且些只能管自己。如果这样做，别人有什么理由不鱼肉你一把呢？\n\
    \n最后，谈点你的事。\n\n你早早就做指，作指数化组合投资，短期内平衡，长期调配量比例，前面讲的你都做到了。那么，你一定能选择退保有自己人生努力所得税？\n\
    \n首先恭喜你，你可吗？大多数人答不一定，比他们更有机会保护自己？然后抱怨，答案还是一定。\n\n个人的人生线叠加到市场格局、经济起伏、全球兴衰多重体上，哪里还有你什么确定无误的事情？命运无常，会带来两件少见但关键的事情：泡沫和危机。\n\
    \n大抵法律规定，市场95%的时候是泡。可是，剩下那不正常的5%却是最关键的。如果剔除泡沫期约收益和危机期的损失，市场的能远定是惊人的，泡沫和高中的表现仍不是决定长期投资收益的重要因素。以倍得和耶鲁大学基金为例，这两个最优秀的买长期投机构投资者在2008年金融危机中损失了六成。那些没有这两家巨人的持久力被时间洗白的投资者，哪不非凡。\n\
    \n泡沫与危机，对应着机会，预测厄是人之常情，做这件事最精明的，是「愚人原著全是fool's gold，是英话，指像金子一样发光闪闪但没有价值的石头」，金闪闪闪光却不太值，好在，尽管不知道价是问处是，但总会知道大气身处哪种市场态：预测末来的天气不大可能，但为风天准备伞这件事都没有多难。别预测，就准备。\n\
    \n这里正不着意，你的责任：准备者其成本，市场既经时时候，你看你是最关键的，短期支付代价，有人为比高机构能承担支付代价，投资排你的事，机构不做一需战益基础是你对自己生对你那个基础外性，机构不会干，三个月期不在干个人扎线的行业，却做了这么多事情，因为机构总定了脑袋。\n\
    \n泡沫和机遇没有想象的多常见，仅仅过去数十年，几乎每十年就没有一场泡沫及其它带来的次生危机。投资有从20岁到70岁，你平均经历五次泡沫及危机。将视野拉到历史长河之后，你会发现它们在大绝大投资有有自身处到时感觉是可怕的，指数化再平衡组合投资在长期中能战胜通触的各种数据证明了这一点。\n\
    \n真正可怕的事是投资生涯经历乃那最后一轮泡沫-危机事件。好比有个人跟你要复一生，给爸爸万年，来借他，帮你，最后与你喝你，你一明光，还有下次个机会。整到人年，你不可能一泡大，你不能永远放弃情，不能放弃思考，不能放弃决断，哪怕你说再平衡组合长期投资，也要好好对抽身准备。\n\
    \n与此相对，对年轻人来说，如果一来就抄了个底不要绝望，也不必然有人抄到底部，投资人还有四五六七顶在未来等着你，慢慢来。\n\n要因斯坦说，要简单，但不要太简单。极高金融课，没有太最后的最后，推荐一本书。大卫新文森（David\
    \ Swenson）的《非常成功：个人投资的基本之道》（Unconventional Success: A Fundamental Approach to\
    \ Personal Investment）。斯文森是反对经济资本主义托邦的学生，长期持有股成长股票，以远低于市场水平的新解，获得高于市场水平的长期收益，并改变了美国大学校长们的投资组合风格，影响极大。这本书是新文森特投给散户的，核心告诫这二句：非专业投资者与市场作对手，最产品跨地域的多元化指数结合长期投，并梳理主要资产关别的期组进位、运动、资产特点，方便投资者根据自期合作出相应的方案。\n\
    \n如果说投资只读一本书，那就读这本。\n\n极高金融课到此告一段落。如果你对进阶金融继续兴趣，请留言，有兴趣的人够多的话，我会写进阶金融课，细致泡沫与危机。\n\
    \n## 精选留言\n\n- Apprentice·胡秋元 17\n  投资就知老师所说越简单越好，三大要素：复利、杠杆和风险，投资收益的高低就取决于这三只用涉及自白银金是得稍晚一些。再回学一下之，这个人可以运用到人生的方方面面，复利好处不必多说，体现在生活的每一个维度，核心和积，可以说终其一生，表现在生活的每一个维度，核心和积，可以说终其一生，也是最近人性的东西，不投也是投资人。\n\
    \n- 许江浩 5\n  大道至简，其实不易。古人有说，知易行难。世界5大语言难，何谓为人，总就是钱，一英二智，转头额大，生年有年，就比大危，有智慧，一体线行，简单重重，要受一生。泡沫危机，十年之期，如你激动，期待达到。\n\
    \n- 依然特梅 5\n  在订阅《顶级大学》之前有些想惴，其都是年，而你是只有五六个月。然而自从天连篇订阅现在看可以完三进，的确真的让我收益匪浅！谢谢你！如果你说这是，的确，的确是的，你的文章，你的栏自。过去我要补课，以后的事不说了。\n\
    \n- 夏小耳 5\n  对金融课很早兴趣，但一直不知道从哪里入手，觉得学好金融是实现个人财务自由的很好的一个手缘，希望王老师更多些相关知识。\n\n- 西东东西\
    \ 5\n  学的太好了，这个虽称高到为极高金融课，但是对于我这样一个外行来说，不理解高到极低金融，也对于一些金融和经济学的方面的介绍，但是还是没怎么来搞过，通俗易懂，非常谢谢！\n\
    \n- 经天 2\n  李老师写投资把自己一部分转到那个刑期，今年受大牛市的情绪之后，也进一步长恨谁也可慢高思”常人生”，以及大投信管理那里读说的”真，真是遇事常思人生，即使自己能够好的规避风险，正如三位老师（王炼、李笑来、万维钢）都提到的，努力让自己达到知识状态。\n\
    \n- E 1\n  明白期间，同感很高人定投但却能坚持超过三年的一个没有，成功的诱惑，低能、的德态，人性暴露无遗，希望都能认识到自己的力\n\n## 加速给我的三个惊吓\n\
    \n耶鲁开学第一天，我去拜访约翰·加迪斯（John Gaddis），受到了三个惊吓。\n\n加速是什么人呢？\n\n你要去见加速吗？就是那个加速？此话普遍放—百遍提高八百度？这是耶鲁学生向我所说的反应。\n\
    \n耶鲁有些怪台级者，加速是其中之一。他长冷战史。冷战史，选研究生大核器（Grand Strategy）。是的，你的报格，在冷战史学家中，加速最为先知，他著书带评，通晓冷战时局，冷战史，在《战略史》、《乔治·凯南传》本，本都是经典好读。\n\
    \n关于“凯南传”还有一点题外话。凯南本无未家简介，考虑到读者可能年纪较轻，没在加上那个时代，我多说几句。\n\n如果有人有一个，能称得上是美国冷战战略的总设计师，这个人就是乔治·凯南。1946年，他力推美苏使馆馆副馆长电报，以此改变了世界历史。电报核心内容解析了苏联对英法扩张的应对方式，苏式为以己为轴心，死命扩张。《铁幕演说》、《冷战史》、《乔治·凯南传》，本都是经典好读。\n\
    \n凯南说，美国不必击败苏联，只需它不再扩张就行。遏制与封锁（containment）而不是回滚（roll back），要在苏联扩张的任可地方予以坚决回击，但无须强行改变任在任时地。这一策略成功迫使苏联自我失败，而不是战而败之。\n\
    \n冷战据有然的就是结束得突然。多年后有一天，在问到美国对于苏联解体的这件事上，凯南为什么，凯南讲了一个俄罗斯富村，牛一富在穷村，于是两头牛牵上了这着，牛死后富村，穷村也变成牛做牛了，而穷村变成了一根牛，冷战就是这样。美国确实实现了我的部分，但我想说的是不但是不是，而是向另一个世界展现了由世界自己的样子。\n\
    \n回到来，回到来。\n\n凯南加迪斯写得好，加迪斯前事写包含他包，他所有精思都开放，前事加迪斯一个手就是，无名个有：死记心死也出能，在真实世界里面与作者相比都分可少活者，死名后出活，后也才可能以实。而且，加迪斯比加迪斯年少37岁呢？\n\
    \n只知道，出到凯南时，我写进了101页，他书里面有提到所有人，他凯南在“前头，没到凯南：凯南把地，出也凯南在他前事里，那你这么多？问人每次书信往返，凯南都表示我活得太久了很抱歉。\n\
    \n这好就没全没发生。2005年，凯南去世；2012年，《乔治·凯南传》出版，立即获布雷克立奖项，是为经典。\n\n我为什么见这么一个冷战史家学者呢，哪怕是天字第一号的冷战史专家加迪斯？\n\
    \n因为，我已看见，从中国、美国、欧共、中东，都传来信，世界各国进入冷战状态中。冷战略就类美苏二战世界大战和年代结束了。中国与世界越来越紧密，美国和日本越来越远，未来世界会不会进入冷战状态？我们如何应对其？\n\
    \n于是有了我的第一个惊吓。\n\n我问，加迪斯，从冷战到什么可教训对今天有益？教谕一，请用英文给我说lesson。\n\n首先，冷战比不让我冷。加速回答到。\n\
    \n我马上意识到，我接加速加迪斯开两杀系手平线上了。我根也以为冷战到冷战可能不了了，未想过这有平线了，他加迪斯为什么？冷战争不冷，至少冷战了，他有lesson一词的理解，不是教训，而是结论：美苏争年决定面打起来，这可是个大教训。\n\
    \n这样的啊，我消化一下。\n\n你的意思是，说现在已经处于事实上的冷战中了吗？\n\n不是，没有冷战。\n\n我长出了一口，但马上便又，第二个惊吓来了。\n\
    \n现在不是冷战，我有意思是今天不是冷战，而今天意识不是不是冷战国。我们冷战的意识界还存在回到第一次世界大战前那种那种力里平衡，of balance of\
    \ power，就是保持要反的平衡，美国、中国、欧盟、俄罗斯、欧洲，五大势力在很使平这种状态—全球的力量平衡游戏。\n\n力量平衡，这个词语听起来古老，但它对应的是下面这些东西：\n\
    \n- 第一，各国均是自私的社会本，借力混设，没有共同认可的规则、原则和价值观。\n- 第二，各国之间调用数据到敌我友的混合，弱者联合以制强者，但有时和强合，不受历史、文化、以鲜血流成的友谊关系，加迪斯提到了斯普利，而斯普利最著名的友就是：政治家能掌握原则，但俄手想要不受规则的约束，不能说俄国416特是强权区。\n\
    \n“天命不是强，福不是法。人言是自言，”一切基于主权国家利益，这就是力量平衡游戏的几个玩法。\n\n国际的力量平衡游戏主导了几乎整个人类历史，也最后导出现实结果。欧洲两度平衡的游戏体系主导了两次世界大战。\n\
    \n可以说，二战后美国的国际政治是依力量，联合国是世界性国际体系，国际关系的本质就是国际权力关系的互动，其内在逻辑是建各种类类的规则，共的价值及观其他国际多边机制，各自竞争获取优势。\n\
    \n我自问，问加迪斯对多边体系都回回去了？\n\n加迪斯有没有下我4想空间，是的，多边体系从来很脆弱，联合国从来没没超越过强国意志，现在变得更弱。问题是，国际关系的本质就是强国意志以实态论为主？如果是15年、20年看，从人类总体看也是。今天人类说碎片化，大强各显神，在分裂区竞争张力也已成为人。全球的力量平衡时代已经到来，而且各国各显其制，有的有权、有的制，并不共享同一体制。\n"
