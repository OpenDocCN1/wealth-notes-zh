    \n- **静妹** (2)\n  我只记得我们的新闻报道过一篇战争中逃亡孩子们的照片。铺了一张毯子睡在漆黑的树林里一个孩子的照片印象很深。还有那个海死在偷渡路上躺在沙滩上的小男孩，好像是睡着了，撼动了多少人的心。和前几天那个坐在椅子上半边脸都是血的孩子。可惜活着不足以让战争停止。为什么？打来打去都不知道在打什么？在争什么？人类每往前走一步都要伴随着战争和杀戮，从未离开。可为什么呢？\n\
    \n- **王彦宁** (2)\n  很多时候，我们身处其间，无论如何努力，也不能改变多少。对于穆斯塔法，包括之前的法蒂玛、德蔻，身处乱世，见识了周遭的残酷，依然勇敢的面对，虽如飞蛾扑火，但更令人唏嘘。和平时期的我们，面对更多的选择，是否可以做的更多？\n\
    \n- **二胡悠扬** (2)\n  大战略太空洞，叙利亚太悲剧。逆流而上太痛苦，会做家乡饭的人太少。战争为平民带来的苦难太多。实在不明白人类到底在干嘛！穆斯塔法身上有股浓浓的痛苦挣扎，同时也存在着永不放弃的精神与勇气。局外人或许很难体会到他们的苦楚，连找个会家乡饭的志愿者都那么困难。\n\
    \n- **人间游** (2)\n  世界还远未太平，战争、饥饿、瘟疫、死亡在地球的某地肆虐，珍惜现在、珍惜所有、永怀感恩之心。\n\n- **辛辟** (1)\n\
    \  看了穆斯塔法的经历，稍稍了解一点叙利亚状况的人都会感受到那种沉甸甸的压力和对命运前途的迷茫无奈。个人命运和国家紧密相连，失控的局势更容易被各方势力所利用，受摧残的永远是民众，在战争的绞肉机面前，有多少人拥有自信能幸免？又有多少人会为了家国情怀而飞蛾扑火，义无反顾？目前我们国家的发展势头比较迅猛，好不容易积累下的家庭正被群狼环视，作为一个平民，深深地知道和平的来之不易及弥足珍贵，祝愿祖国永远强盛，人民幸福安康！祝愿世界没有战争，所有的难民和无家可归的人都能早日摆脱困境，衣食无忧！\n\
    \n- **王实18301027163** (1)\n  只有了解战争的残酷，才知道和平的美好。\n\n- **味当家—晓几** (1)\n  哎，相比叙利亚，珍惜我们的和平生活！给身边的人和事更多的感恩和包容！\n\
    \n- **刘静** (1)\n  在这样的环境下，依然可以这么优秀，真是很难想象，至于战争的残酷，更是我们中国这些生活在这片土地上无法想象的。除了佩服之外，也只有祈祷了~\n\
    \n- **sandy** (0)\n  一旦发动战争，人类最后的自由就要被吞噬了。没有谁能控制战争，都只能沦为战争的奴隶。\n\n- **永恒之宇** (0)\n\
    \  美俄的较量是近乎无解的难题，最好的情况也就是暂时的利益妥协，中东国家真是悲惨，纵使拥有数派圣地，也无法阻止人性的丑恶。\n\n- **科比门徒** (0)\n\
    \  大国角力，小国成为牺牲品，和当年积累薄弱的中国何其相似，人类何时才能摆脱战争，和平发展呢？\n\n以上留言由 作者 筛选显示\n\n## 第15周问答\
    \ | 如何用经济学思维分析问题\n\nStone: 如何运用经济学思维去分析问题。\n\n**王烁**\n\n经济学的特点就是连回答这样一个无锁的问题都有可能吵翻天。我的回答只是各种可能回答中的一种。\n\
    \n经济学分析人类行为，它既是规范性的，又是实证性的。所谓规范性就是：人类应当这样行，如果一系列对人类行为的假设和前提出过法；所谓实证性就是：糟糕，这些假设和前提实际上不见得成立。那人类行为实际上是什么样的呢？\n\
    \n作为一门规范性科学，经济学依据的假设和前提很多，比如理性经济人假设人总能确定自己的偏好并为之排序；又比如公司金融的莫迪利安尼-米勒定理MM定理认为公司价值与其股权和债务所占比例无关，但却忘了它有十多个前提：不考虑税，不考虑是否破产，信息充分，市场有效，等等等等。\n\
    \n很明显，这些假设与现实不一定相符。但这不是理论本身的错。理论建个模型，谁保证它跟现实一定有啥关系呢？模型与现实发生关系时才有错可言。许多人要么忘记了模型的各种假设和前提，要么在假设、前提与现实不符导致测错时，说现实错了。这是过度沉溺于规范性的结果。其实，除了数学之外，其他学科都没有资格躲在假设与前提的框架里拒绝与现实打交道。现实是不会错的。\n\
    \n所以，经济学还是门实证科学，就是当假设、前提与现实不符的时候，研究人类行为事实上是什么样的，与基于那些假设、前提的模型预测相比有何不同。一方面，现实固然是不会错的，但也不是可以调整改造的；另一方面，改变哪些假设、前提会使模型的解释和预测力更强？\n\
    \n今天的经济学越来越重视实证。新生代的经济学家越来越倾向于这样定义经济学：用数据来研究激励如何影响行为。这是整个社会学科域共有的趋势，经济学跟其他社会科学的区分会越来越模糊。\n\
    \n我以前介绍过Steven Levitt，他是少壮派经济学家、芝加哥大学教授、克拉克奖得主、《魔鬼经济学》（Freakonomics）系列的作者。这段介绍用来回答你的问题很合适。\n\
    \n无论说到一个人、一个组织还是说到一级政府的时候，人们通常会说它应该做什么，很少说怎么做，几乎从不会说为什么这样做可行或者不可行。如果被问到这个问题，答案常常是：因为这样做是对的。\n\
    \n这与Steven Levitt的告诫恰恰相反：绝对、永远不要去为人们仅仅因为某件事是对的就会去做。这句话来自其《魔鬼经济学》（Freakonomics）系列的最新一本《不同凡想》（Think\
    \ Like a Freak）。\n\n激励被Levitt放到了最核心的位置。不考虑激励的公共政策是不可能有效的。他写的第一本书Freakonomics大热，第二本SuperFreakonomics开始吃老本，这本Think\
    \ Like a Freak写得不好，但读到Levitt列出的激励六要，也算是没有浪费时间。\n\n- 摘明白人们事实上重视是什么，而不是他们自己说重视是什么（Revealed\
    \ preference instead of stated preference）。\n- 激励要对别人有价值，同时对自己的成本低。\n- 要尽可能使用那些能使零和博弈转换成正和博弈的激励。\n\
    - 这条前面讲过了，在此重申：绝对、永远不要去为人们仅仅因为某件事是对的就会去做。\n- 如果别人对激励反应出乎你的意料，要从其反应中学习，并调整自己的方法。\n\
    - 总有一些人会祭出你无论如何也想不到的招，把激励拿走把成本留下。哪怕只是为了自己不被逼疯，就最好还是赞赏其天才，从教训中学习。诅咒别人贪婪没有用。\n\n\
    与此对照，官员总是懂得这六条，但政府出台的公共政策却往往与这六条相悖。为什么？\n\n欢迎各种留言提问，每周六我会作答。\n\n![](img/4df33f9dae681a82a46724774851329a_100_0.png)\n\
    \n### 用户留言\n\n- **刘静**\n  很多激励对于90后或者95后，好像完全不起作用，该如何调整心态和他们（她们）更好的协作？\n  **作者**\
    \ 回复：没有的事，不知道怎么激励别人，问题既不在那里，也不在别人，而是在不知道。\n\n- **孟晓晖**\n  从激励六要中学习到最后最重要根本的是：要了解与尊重人性（人性就是会希望得到激励，尤其是正向激励）\n\
    \n- **义有时**\n  个你知道怎么激励别人，问题既不在激励，也不在别人，而是在不知道。\n\n- **孟晓晖**\n  从激励六要中学习到最后最最根本的是：要了解尊重人性\
    \ (人性总是会希望用最小的成本去搏最大利益)，并不断学习和调整自己。\n\n- **静听花季**\n  【均衡镜子的两面】公共政策看起来总是有悖经济学理论的，而制定这些政策的又是深造经济学原理的。为什么？有意思的就是这个表面看起来向左的现象！我认为，这是制定政策者的一定义的“均衡”，就因为他们懂的经济学原理，更知道零和博弈变成正和博弈，而从整体来看，没有多余的能让零和变成正和。在经济总体上升的趋势下，让一部分分利在公共政策上，体现经济增长。公共政策的有序恰恰是镜子的另一面，看似相反，却只有这样才能在“均衡”状态下保证镜子另一面符合经济学原理。这是实证和规范的统一，理解实证的正确性，了解规范是有前提才成立。\n\
    \n- **王彦宁**\n  当前人类社会的运行逻辑以经济占主要支配地位，可能与互联网、全球一体化等密切相关。如果全球化紧缩、互联网节点之间竖起各种无形的墙，只是历史进程中的波动，不影响整个趋势，战争、贫富差距可能会有消失的一天。全球化的结局，必然会使地球上的每一个人与他人的交流、交易，变得直接、简单，那时，每个人博弈的底线都是摊开在对方那里的，信用变得极其珍贵，谁也不会只为了赢得一次博弈而输掉一生的交易。假设人类社会真要退回到荒野时代，商业逻辑将再也不起作用。\n\
    \n- **二胡悠扬**\n  激励要对别人有价值，同时对自己成本低。能做到这点的需要具备足够的智慧，我总觉得应该从社会心理学方面入手考虑这个问题，但是，一旦被激励的人明白其中道理的时候，采取的这些小招数又会被识破，或者遭到拒绝，因此还要另想办法。智慧或许是在这样的环境下逐渐累积起来的。\n\
    \n- **静姝**\n  我能理解的政府制定一个规范，让大家去实证。达到制衡各种利益关系的目的。\n\n- **自我管理的徐凌云**\n  我们使用最多的6个激励理论是需要层次理论、双因素理论、三种需要理论、期望理论、公平理论和强化理论，它们的提出者都是心理学家。这提醒我们，激励的对象是人，是有血有肉有感情有意志有灵性的人，先了解人的需求或期望，再选择合适的激励方法，才能起作用，否则适得其反。\n\
    \n## 学习大空头\n\n这期在耶鲁商学院选了门课，全球金融危机（*Global Financial Crisis*），之所以选这门课，主要是因为金融危机表现各有各的不同，但根源是相似的：比如说，亚洲金融危机表面上是场货币危机；东南亚国家货币汇率崩盘，引发外汇危机；这跟美国次贷危机确有不同，美元不存在货币危机。但两者的根本原因可都是负债过度，杠杆用得太过。\n\
    \n我上这门课，算是未雨绸缪。\n\n教授安德鲁·麦库翁（Andrew Metrick）之所以开这门课，是因为这事跟他有个私人关系，金融危机早期，在华尔街日报上看到报道说贝尔斯登可能要垮，打电话去问他啥理由：麦库翁。老麦库翁，老居民贝尔斯登核心层、时任CEO的左右手。老麦库翁说，别听报纸胡扯蛋，贝尔斯登有200亿美元流动性呢，没事。\n\
    \n那是周一，到周末老麦库翁又打电话给老麦库翁，老婆说，儿子，贝尔斯登不行了，我们明天就会申请破产。\n\n小麦克库翁惊呆了。老麦克库翁周一并没有自己的儿子，他确实认为不会有事，贝尔斯登确实有200亿美元流动性，但200亿美元不到一周就干掉了。作为一个金融经济学者，小麦克库翁无法理解到底发生了么，立志研究。\n\
    \n学派和监管界离业界太远了，这不。几个月后，他研究出了结果，准备出书。\n\n来不及了，雷曼垮台了，书不用写了，还是开门课吧。\n\n我在这门课上的收获，以后会慢慢道来。今天这篇，讲谁要鲁组织全班看的电影《大空头》（*The\
    \ Big Short*）。\n\n![](img/4df33f9dae681a82a46724774851329a_102_0.png)\n\n尔摩斯、天堂地狱、金钱不服，自20多年前写下开山名著《说谎者的扑克》以来，麦克尔·刘易斯（Michael\
    \ Lewis）就是华尔街一切与这些有关故事的首席作家。次贷危机以后，他的《大空头》当之无愧为这场危机投资者的扛鼎之作。这本书既让金融圈在大洋两岸都获得了同时来自普通观众和金融界的好评。\n\
    \n每次金融危机之后，那些抛掉的金融机构CEO，又或是监管部门头头，为了卸责，总会跳出来故，危机是无法预测的，自称预见危机的人不过是事后诸葛亮。他们装模作样地问：预言家们事前干什么去了？\n\
    \n答案：这些人在准备怎么从即将到来的危机中大赚一笔。\n\n《大空头》证明，危机无法预测这件事是胡说八道。早在次贷危机爆发前好几年，就有许多人发出了警示；而最晚在次贷危机前一年，《大空头》里提到的这一批人，有的在加州，有的在华尔街，有的在对冲基金之都格林威治村，种下了重注。\n"
