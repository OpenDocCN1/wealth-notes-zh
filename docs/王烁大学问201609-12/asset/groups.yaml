    \n一觉醒来，美元指数突破100大关。\n\n怎么会这样？\n\n川普当选美国总统，美国接下来何去何从的不确定性极大增加。美元反而连涨上涨，再度突破100大关。上一次突破100是在去年底，全球金融市场处于动荡当中，避险资金纷纷转入美元资产；这一次全球市场平静得很，如果有什么动荡可言，就是来自美国自己。\n\
    \n为什么美元涨势重现？\n\n一般的说法是对川普提5000亿美元基建，通胀预期上升，以及美联储加息时点和力度的预期都有上调，引发全球投资者买入美元。\n\n\
    这确实就是市场当下的预期，但与历史上出现过过多的类似情形一样，这背后还有更深层的原因：美元升值并不是尽管（despite）而是因为（because of）美国出现动荡的可能性增加。\n\
    \n近的如2011年，标准下调美国主权信用评级，从AAA降到AA+，并列入负面观察。如果是一般国家，下调信用评级，则其国债发行成本上升价格下跌，重则可能引发金融冲击。\n\
    \n美国不一样。标普下调美国主权信用评级后，全球债券市场作出激烈反应，以消化这一信息，大量资金从风险资产撤出转入安全资产。\n\n安全资产是什么呢？美国国债。\n\
    \n美国国债于是价格上涨，尽管其评级刚刚下调。\n\n远的如1971年，尼克松政府宣布黄金与美元脱钩。在此之前，布雷顿森林体系中，各国货币与美元挂钩，美元与黄金挂钩，构建二战结束以来以美元为中心的金融秩序。美元与黄金脱钩无疑是对这个体系最核心的冲击。然而美元怎么样了呢？\n\
    \n美元统治地位未受丝毫动摇。美元不需要黄金这个锚。\n\n你明白了为什么吗？\n\n> 每当世界金融体系发生动荡，避险资金就会从风险资产撤出，转入安全资产。而在今天这个世界上，最核心的安全资产是美元资产。这适用于冲击来自系统边缘的情形，如亚洲金融危机；也适用于体系核心有所动摇之时，如当年标普下调评级，如现在川普上台。\n\
    \n因为安全是相对的。核心感冒，边缘吃药。无论冲击发生于核心还是边缘，在范式变迁没有发生之前，总是边缘地带最终付出更大代价。皮之不存，毛将焉附？\n\n这不公平，但这就是事实，这就是美元特权。尼克松政府财长约翰·康纳利（John\
    \ Connally）曾说：“美元是我们的货币，但是你们的问题。”\n\n不过，美元特权不是什么阴谋，而是阳谋。对此研究最为深远的是艾青格林（Barry Eichengreen），加州大学伯克利分校教授，国际货币基金组织第二任研究者，也是财新网专栏作家。\n\
    \n范式变迁何时以及怎样发生？\n\n在数年前关于美元地位的专著《嚣张特权》里，艾青格林说：“一国货币的国际地位总是取决于该国是否大国，而非相反。大国才有国际货币，不存在货币强国这回事。美元地位取决于美国自己，取决于美国会不会出现重大经济和金融管理失败。什么是重大经济和金融管理失败？对外债务规模失控，对内通胀失控。只要这两种不失控，美元还会强大。”\n\
    \n![](img/4df33f9dae681a82a46724774851329a_68_1.png)\n\n川普当上总统对这两点有什么影响？现在不明，边走边看。\n\
    \n相反可推，如果美国衰落，那么或迟或早，美元会丧失其货币地位。根据艾青格林的竞争，现有的国际货币在未来的国际货币竞争中并不占绝对优势。许多人以为英国早就不是第一大经济体，但英镑直到二战才丧失统治地位，以此说明英镑地位在美国大国地位不再后还有一定粘性。实际上，美元在1920年代中期美股崛起仅10年后即与英镑比肩。\n\
    \n而且，除了二十世纪后半叶，历史上绝大多数时期不止一种国际货币并存。成为国际货币的竞争并不是一场不同货币间你死我活的战争。\n\nEichengreen\
    \ 另一本《Global Imbalances and The Lessons of Bretton Woods》最后一章“英镑的过去，美元的未来？”有专门分析：因为网络效应，作为贸易结算工具的国际货币确实强者恒强；但作为储备工具，多种国际货币完全可以共存。\n\
