    # 极简谈判课：会谈则生，不会则死


    巴里讲博奔论可不是纸上谈兵，在耶鲁商学院大牌教授身份之外，他还是连续创业者，其中创建茶饮企业“诚茶”（Honestea）并卖给可口可乐，已经成为他自己商学院授课时经常用到的案例。


    可口可乐想收购巴里的诚茶。巴里不想现在卖，诚茶还在高速成长，何必现在就把生鸡蛋的母鸡卖掉？


    但是，对方告诉巴里，可口可乐很雀巢的茶饮合资公司刚刚失败，这么大的饮料巨人不可能放着茶饮细分市场不管，产品矩阵中这个空白一定得填。最好的结果是收购诚茶，但如果诚茶不卖那会去收购的公司；这种情况对诚茶也很不利：多出一个很深的竞争对手这事，能免则免。


    而且，巴里也知道，收购带来合力，可口可乐又深又广的营销网络肯定能助力诚茶销售。


    情形与多年后Uber进中国之初与滴滴的谈判很相似。Uber创始人卡兰之尼对滴滴创始人程维说，Uber要入股滴滴40%，不然就进中国，碾压你。


    卡兰尼克还是太年青，结果遇到更年青的程维，威胁迫得其反，无非是激发了斗志。双方血拼，谁能预知结果呢？几年后，滴滴反过来收购了优步中国。


    其实，何必。传递实质上的同样信号，可口可乐做得到更到位更精准，而且还顺道，对谈判岂不是更有利？


    信号，巴里收到了。他还是不想现在卖，但也不想眼睁睁看着可口可乐去收购竞争对手。


    怎么办？


    # 博奔论登场。


    巴里对可口可乐说，这样做吧：且让我们先假设已置完成收购，现在就开始合作，你们现在就开像信诚茶是可口可乐产品一样销售它，但交易你们等三年，我们三年以后把诚茶卖给你。


    对方说，这怎么行？三年后的事，现在没法作价啊。


    巴里准备好了答案：


    +   假设1，没有可口可乐收购这件事，诚茶自然成长三年，销售额会达到某个水平A；

    假设2，可口可乐现在就完成了收购，诚茶与可口可乐结合，销售额会达到某个更高的水平B。


    这个框架你们同意的对吧？


    那接着往下说。


    三年后，交易这么定价：销售额A以内的部分，按市场正常溢价水平定价。销售额在A以上的部分，则按市场水平的一半定价。


    为什么要区间定价呢？


    因为要公平。


    销售额A以内的部分，没有可口可乐，诚茶自己也做得到，所以可以全拿。超出A的部分要依数与可口可乐的合力，所以可口可乐该拿走一半。


    谁做的蛋糕谁吃，如果蛋糕缺了谁都做不了，那就平分。


    是不是很简单很合理？


    巴里与可口可乐只谈了一个小时，就把交易结构确定下来，接下来无非是核算A和B之类的细节，虽然会花更长时间，但无碍交易大局。


    最初，巴里面临三个选择，从最好到最坏依次是：


    独立运作，且可口可乐不收购竞争对手；


    现在就卖给可口可乐；


    独立运作，但可口可乐收购竞争对手；


    可口可乐也面临三个选择，从最好到最坏依次是：


    现在就该诚茶；


    不买诚茶，但收购其竞争对手；


    不买诚茶，且不买其竞争对手；


    如果双方都在这三个选择里打转，其实谈不拢输赢的风险很大。


    通过合理切分未来的蛋糕，巴里把收购延期到将来，接下来的三年中，诚茶与可口可乐像收购已完成一样合作，迅速做大规模，充分释放价值。三年后，双方成功当合约约定的结构完成交易。


    对双方，这都是最优的结果。


    聪明人学以致用，效果就是这么显著。我去过巴里家，房子大得不像话。


    我对巴里说，金融学教授做投资的很多，但商学教授创业的就少多了，是因为创业还是更难呢？


    巴里说，“天气真好哈哈哈。”


    下期讲做蛋糕。'
