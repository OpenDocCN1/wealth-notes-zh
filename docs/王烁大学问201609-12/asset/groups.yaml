  - "[PAGE 34]\n\n# # 第6周问答 | 耶鲁大学的通识教育\n\nLens: 王老师，能否详细介绍一下耶鲁大学通识教育的理念和方式，对我们有什么参考价值？\n\
    \n王烁\n\n耶鲁最重本科教育，而本科教育的风格是通识教育。所谓通识教育，旨在为学生带来完整知的知识结构，养成能思考的通用智慧。学生们会有专业，但大量涉及本专业之外的知识。因此不同于职业或者技术教育，比如说，在耶鲁，本科生院和研究生院、医学院、法学院、商学院等等都叫作职业学院。\n\
    \n通识教育起源于古希腊，指公民所应当具备的知识与能力，要与公共生活社交完整的人。也就是，要会打扮，会闹，能打官司，在法庭上为自己辩护，所以得懂哲学、数学、语言、演讲术、音乐、天文、逻辑、等等等。\n\
    \n现代社会分工明细，古希腊的通识教育当然只能从精神上效仿；作为现代公民应当具备的知识，一般说来就是文学、哲学、数学、部分自然和人文的文科。你从大学毕业，应当具有现代公民的完整智能，而不仅仅是被打造只解决特定问题的工具。\n\
    \n最原本地保持通识教育的，是一些小型的文学院，规模极小，教学质量极高，散布在美国英格兰乡间，稍有点与外界隔绝。耶鲁早已走出这个模式，成为现代研究型大学，但还保留了通识教育的精神。\n\
    \n我看到的情况是：\n\n第一，本科生集中在住校，分成14个学院（college），每个学院都建古雅，四面团合，有广大的中枢，学生住在此食宿，娱乐。也有图书馆和体育设施，college\
    \ 在管教学，主要是住和生活设施，旨在让学生们增加交流，培养集体感。要么说，在现代社会会重兴一种中典风格。\n\n第二，所课老师，其多少大课，因为没有本科学开课太长，比如保，肯尼迪学系开课，年纪大了，站一会儿就坐下，所以专桌，就这样，还是开三门。\n\
    \n第三，耶鲁最大的系是历史，经济系届居第二，在圈内很难想象。因为耶鲁历史系水平极高，特别是古典部分，有希腊古希腊教历史学在Donald Kagan 专组，大量学生注册历史，同时学其他专业课。我一个学生联络就是历史学生，就计算机。通识教育体后让学生有自由的选择。\n\
    \n第四，大量本科目的课程并非关于技能和知识，而在于修养与思考。比如，耶鲁有一门课，‘值得活’（Life Worth Living），依讨论哲本人及其所处的哲学，探讨在这些哲人眼中对多生问题的回答：值得活？怎样才感觉？有何希望？失败怎么办？对有责？老师严据中引，引导学生。这门课师年，学生们成立了‘哲得活’协会，使命陈述是：‘让每个耶学生都要认真思考活为什么值得这个题目。’\n\
    \n第五，耶鲁通识教育，也有弱点，比如科学一偏弱。我耶听学生说，多年前，还曾议过撤除科学技术相关学，当然而成，但重时亦时，据是当下耶校最受关注的新道。\n\n\
