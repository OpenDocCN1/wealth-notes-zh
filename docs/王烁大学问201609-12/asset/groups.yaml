    \n以上留言由 作者 筛选显示\n\n## 一人一票？一美元一票？\n\n![](img/4df33f9dae681a82a46724774851329a_71_0.png)\n\
    \n《大学·问》前面文章讲到中位选民定理，留下一个未解之谜：\n\n穷人为什么没有投票分掉富人的财富？\n\n> 我们都知道，所有社会里的财富分布都很不均匀，实际呈幂律分布，形象地说就是金字塔，越往上人数越少而每个人所占财富越多。把所有选民按财富由少到多排成连续序列，平均值落的那个位置一定在中位选民的右边，谓之右偏，效果就是人们经常说的“被平均”。\n\
    \n假设盖茨有8个邻居，净财富分别是0、1万、10万、100万、1000万、1亿、10亿、100亿美元，盖茨自己是400亿美元。9家的中位数财富是第五名的1000万美元，但均值则是50多亿美元，被盖茨给平均了。\n\
    \n中位选民定理预测，既然中位选民决定选举胜败，那么民主制下，一人一票，会通过税收和转移支付，损有余以补不足，因为从均贫富政策中获益的总是占据多数，谁叫均值总是落在中位数的右边呢？\n\
    \n这就是自柏拉图《理想国》以来政治精英对民主制的最大担忧：一人一票岂不是导致“多数人的暴政”把富人的钱给分了吗？\n\n担忧事实上是落空了。在今天的主要民主国家里面，结果是这种事总的来说并没有发生。这就是民主制下的再分配之谜。别跟我说财产权神圣。财产权神圣是个神话，向谁征税征多少从来是群体选择。\n\
    \n为什么穷人没投票平分富人财富？\n\n这正是约翰·荣默（John Roemer）一篇论文标题。荣默是耶鲁大学政治经济学教授、美国艺术和科学院院士，研究分配、合作、政治竞争，还有马克思主义经济学。\n\
    \n作为耶鲁世界学人，我可以在各院系任意选课，前提是授课老师同意。看到荣默开一门关于政治竞争的课程，我去信申请。荣默说，建议你别修，全是数学。不如我们一起吃个午饭吧。\n\
    \n“我曾经是马克思主义者。”一见面，荣默就说。\n\n“现在呢？”\n\n“现在是社会主义者。”\n\n“那就好，在中国这是一回事。”\n\n扯远了。\n\
    \n荣默对民主制下选民没有借机均贫富的解释是这样的：假设两党相争，一个穷人党，一个富人党，如果只有对谁征税征多少税一个议题，那么中位选民定理预测的结果就会出现，穷人党会提出更平均主义的征税和分配方案，并且会赢得投票——因为穷人多。\n\
    \n但只要议题不止一个，那么即便是穷人党胜出，所主张的税率也会低于只有单一议题的情形。荣默论文举的例子就是富人党掺杂进来宗教议题。\n\n反观美国近年政治，我恍然大悟。历次大选都是多主题杂糅，共和党与民主党既在税上，也在堕胎、同性婚姻等宗教和社会议题上相争。我过去不太理解，在经济上主张自由选择的共和党，为什么在诸多社会问题上主张限制自由选择。跟荣默一席谈后，我有了新理解：复合立场客观上对缓解单一议题如征税的压力是有用的。俗话说，把水搅混，转移焦点，等等。\n\
    \n又过一星期，再见荣默，是在亚当·普泽斯基（Adam Przeworski）来耶鲁宣讲论文的教室里。\n\n普泽斯基就更厉害了。我们都知道民主制往往经不起经济危机的挑战，历史上出现过许多次新生民主政体被经济危机压垮的事情。但是，只要在立国家的人均年收入超过7000美元，就会很稳固，还没有出现过一例这种国家在经济危机后发生政变的情形——这就是普泽斯基的学术主义观。他在芝加哥大学执教多年，现为纽约大学政治学教授，也是美国艺术与科学院院士。\n\
    \n关于民主国家再分配远远偏离中位选民定理的预测，他有更系统发现。看这张图：\n\n![](img/4df33f9dae681a82a46724774851329a_72_0.png)\n\
    \n上图取自其论文《经济不平等、政治不平等与再分配》，横轴是再分配之前的基尼系数，代表初次分配差距，纵轴是再分配水平，每个圆点代表1960年到2008年间的66个民主国家，倒U型的红色曲线则是拟合结果。\n\
    \n这个图是非常惊悚的。\n\n倒U型红色曲线说明，66个民主国家中，在基尼系数超过0.4之后，初次分配差距越大也即贫富差距越大的国家，再分配水平越低，在最右方的极端情况下甚至为负，也就是劫贫济富！\n\
    \n这与中位选民定理预测完全不同。如果按照中位选民定理，图中这条红线应当是一条自左下往右上的直线：初次分配差距越大，再分配力度越强。\n\n现实完全不是这样。\n\
    \n为什么？\n\n普泽斯基指着下面的表说，“约翰，我知道你认为穷人没有投票平分富人的钱是因为富人有能力说，你我的权力是富人的。你的理论最能说明什么再分配力度不足，但不能解释我这条红线，贫富差距越大再分配力度越小。”\n\
    \n![](img/4df33f9dae681a82a46724774851329a_72_1.png)\n\n荣默笑笑，继续听讲。\n\n真相是什么？\n\
    \n普泽斯基说，一般认为民主制体下，一人一票，经济不平等，但政治平等，所以才会有再分配之议。但是，如果改变假设，承认政治不平等，现有数据就解释得通了。\n\n\
    简单说是这样：\n\n假如有五位选民，财富分别是1、2、3、4、5美元，投票表决征税。\n\n第一种情形，一人一票，经济不平等，但政治平等，那么无论穷人富人，争取到收入在中位数3美元的选民，就获胜，（1，2，3）或者（3，4，5）都是胜利组合。中位选民理论的预测成立。\n\
    \n第二种情形，经济不平等，且政治也不平等，不是人一票，而是一美元一票，那么胜利组合的位置就上移，无论穷人富人，争取到财富为4美元的一方获胜，（1，2，3，4）或者（4，5）都是胜利组合。\n\
    \n不幸的是，第二种情形更符合现实。\n\n普泽斯基进一步计算了财富对于权力的影响系数，假设一人一票时这为零，一美元一票时为一，那么，他发现，上图66个民主国家的贫富差距与再分配数据对应的系数是0.8。\n\
    \n这就是现实中民主国家财富与权力的转换公式。\n\n至于财富具体用什么方式转换成政治权力，这涉及经验问题，不属于普泽斯基论文的范围。他对我们说，“这是最不用担心的事情，富人在守住自己财富这件事上有无穷的创造力。”\n\
