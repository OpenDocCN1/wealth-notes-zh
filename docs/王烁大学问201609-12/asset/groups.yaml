    \n走进高瓴街55号香樟楼晚宴会场，迎面一位大美女士伸出手来，我握住：“你好，你一定是周依了。”\n\n![](img/4df33f9dae681a82a46724774851329a_18_0.png)\n\
    \nZoe Chen（周依）在耶鲁商学院教最受学生欢迎的课：影响力和说服力。来耶鲁商学院当教授前，她创业过，管过两亿美元的生意，拍过电影上过电视，跟谷歌合作过全球食物指南，TEDx常客，写过论文霸。在这一切之前，她是哈佛本科、博士毕业。\n\
    \n今晚，只有一小时，她要把我们速成为影响力达人。\n\n她做得利吗？我行吗？\n\n我问她，“周姐，你教的这门课跟巴里·纳莱博夫课有什么不同？”巴里是Bartley\
