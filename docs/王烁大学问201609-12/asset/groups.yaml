    \n## 叔季之世生存法则\n\n![](img/4df33f9dae681a82a46724774851329a_114_0.png)\n\n中国人眼中的历史是循环往复的，所以特长于生存智慧。合久必分分久必合，治久必乱乱久必治。天下得而一，失一则覆，虽夫子亦许之。古往今来哪一能安人则覆，被评注为治世也很乱些好端，以之为誉。\n\
    \n宋儒将这化些版反为家陈常言：治世用方，乱世用圆，叔季之世方圆并用。前两句好理解，天下有道则持表列直，天下无道则处世通圆。**叔季之世是什么意思？**\n\
    \n“叔季之世”出自《左传》。中国人兄弟排序为伯、仲、叔、季，叔季排行在后，叔季之世指治世将尽乱世将起之时。\n\n方圆并用是不是最多策略？可惜董根没设讲细节，方多是混合方多，可为方因还是为外内方多？前者优君子，后者与世浮沉而有所不为。运用之妙，在乎一心，在于每个人自己。\n\
    \n今天介绍一种学院派的生存法则，来自耶鲁大学教授。如果你把它当成书生之见弃置不理，自己负责。因为它出自专门治人类历史中最黑暗那部分的专家之手，它有理念，不天真。\n\
