    ## 有纪律地运用大拇指法则


    世界学人胡伦（Hrund）来自冰岛，花了六年时间、许多资源，拍纪录片Innsæi，副题为“直觉的力量”，她在耶鲁的讲座也是同一主题，邀我发言。我跟她说，你想清楚，你是艺术家，歌颂直觉；我跟不同，是另一种人：承认自己是凡人，但仰望理性。我会话两头说，不会与你的看法契合。


    不料胡伦大喜，“好极了，你想想怎么把这两块整合在一起。”


    这句话好似拨动了我的开关。


    越是重要的决定，我们越是依赖直觉。原因很简单：越重要的决定越可能针对一次性事件。一次性事件没有数据库，无法建模型。


    而且，越是重大决定，面对的就越是不确定性而不是风险。两者的区别在于一个是未知的未知（unknown unknown），一个是已知的未知（known unknown）；换句话说，一个不知道概率分布，一个知道；前者的例子是探索外头生命，后者的例子是赌场老虎机。


    那么临重大决定怎么办？


    不知道你们是怎样，反正我是这样：也会思前想后，做决定时则是拍脑袋（gut feeling），思前想后的过程必须有，不这样就不舒服，但思前想后并不能给出答案，最后还得一狠心一闭眼。


    问题是，直觉从哪里来的？


    我惟一能理解的直觉来源，就是长期经验、大量练习。比如说，我是个很不错的围棋手，看一眼围棋棋盘就大概知道下一步该走在什么地方，不需要把棋盘上361个选择全都跑一遍。


    的练习！最高水平，极大数量，不知疲倦。它每天创造的高质量对局都远远超过人类职业围棋手所有历史对局数量的总和。


    跟机器比练习、记忆以及基于这两者的直觉，人类没戏。


    怎么办呢？


    我无法给你们建议怎么对抗机器，不知道答案。毛估的估，估计答案在那些真正的一次性事件里，这类事件无法练习，没有先例，难以预测。人在真正一次性事件里的表现肯定得好不到哪里去，但好消息是机器也好不到哪里去。比如吧，人说，不一定有戏。


    好在，至少在相当一段时间内，我们不用跟机器比，而是跟其他人比。机器迟早会成为我们的主要竞争对手，但在那一天到来之前我们最大的竞争对手是彼此。


    要战胜别人，有没有一个办法，既利用我们的直觉，又有接近机器的可靠性？


    有的，诺贝尔经济学奖得主、心理学家卡尼曼说。他最近在哈佛商业评论上发表文章，讲如何减少决策噪音。


    什么是决策噪音？


    ![](img/4df33f9dae681a82a46724774851329a_105_0.png)


    上图摘自他在哈佛商业评论的文章，示例典型的决策噪音，就是表现随机性地偏离目标。与认知偏差 (bias) 不同，决策噪音 (noise) 是随机偏差，不是系统性偏差。


    卡尼曼发现银行审批员的决策噪音过大，对相似条件的贷款申请所作出的放贷决定偏差明显，东一下西一下。这种情形我们在别的决策情境中也常有。比如说，我当财新主编很多年，每年都要面试许多人。回忆起来，各人的决定很不稳定，可想而知失了许多遗珠。


    # 我们都是人，是人有随机性。


    卡尼曼给出了办法。


    第一，重视你的直觉，决策从直觉开始。


    以我面试为例，对我最终作出用人决定来说，哪些要素是重要的？列出六到八个，他们来自于我的直觉、经验、价值观：


    - 诚实

    - 好奇

    - 认真

    - 写作

    - 人际互动

    - 英语

    - 学历

    - 此前工作经历

    - ......


    卡尼曼建议，给这些要素配权重，根据结果动态调整权重对大脑要求太多——我们是人不是机器，——也没必要。


    第二，回溯数据。


    比如我把过去三年的所有面试回溯一遍，每个面试对象得出每个要素的单项打分，产生均值、标准差，得出单项标准分；然后每个面试者各项标准分加总求分值，得出其总标准分；根据总标准分划“录取”分数线。


    第三，有这基准，来面试就简单了，用同样方法得出面试者的总标准分，基于分数线录取。分数线可以根据用人需求、面试者的整体水平动态调整，如果想进来的人越来越优秀，分数线自然会越来越高。


    就是这么简单。卡尼曼称之为合理规则 (reasoned rule)，它其实就是有纪律的大拇指规则：植根于决策者的直觉，理解尊重重大决策的认知原则，用简单的人肉算法减少不必要的决策偏差。


    它多有用呢？


    卡尼曼说，用这套合理规则的话，日常决策中每个人心算即可，而效果不亚于机器根据海量数据机和统计推断作出的决策。


    拥抱直觉，同时对机器学习，有纪律的大拇指法儿我准备用起来。


    ![](img/4df33f9dae681a82a46724774851329a_105_1.png)


    ![](img/4df33f9dae681a82a46724774851329a_106_0.png)


    ## 2016年所读书●上篇


    每年年底，我会将当年读过的书整理回顾一下，对自己一年读书生涯做个交代。今年特别一些，在耶鲁大学读过秋冬两个学期，所读书中作者出自耶鲁大学的比往年多。跟往年一样，我读书不论新旧，涉猎亦广，照惯例先主观平星级评选，三星为不可不读，两星为不妨一读，一星为不如不读。


    **本期是经济、金融与商业类书单及简评，下期发政治类和方法与科学类书单及简评。**


    圣诞节到来，我在耶鲁大学的世界上项目也告完成。接下来我会在西岸的加州大学圣迭戈分校（UCSD）访学到明年春夏之交。耶鲁期间收获丰盛，远未消化完毕，会续撰写。UCSD群贤毕集，我非常期待即将开始的这个学期。但有所失，即行星上。


    新年快乐！


    ### 经济、金融与商业类


    **An Economist in the Real World: The art of policymaking in India \*\*\***


    **Kaushik Basu**


    世界银行首席经济学家突然出任印度总理经济顾问，直接参与政策制定。观察经济版的爱丽尔漫游奇境，真实世界的经济学。


    **Between Debt and the Devil: Money, Credit, and Fixing Global Finance \*\***


    **Adair Turner**


    作者特纳曾担任过英国金融服务局主席，这个机构是英国的金融综合监管机构，相当于中国的证监会、银监会、保监会合一。他为应对金融危机开出的药方是：第一，为了防止未来出现新危机，必须要降下来现阶段银行的杠杆率；第二，如果危机来临，那么央行应由极尽刺激政策，直开印机撒钱。这两个都是极端建议，出自老手之口。


    **The Euro and the Battle of Ideas \*\***


    **Markus K. Brunnermeier & Harold James & Jean-Pierre Landau**


    一个德国人，一个英国人和一个法国人写了这本关于欧元的书，本身就是一个象征。这书讲欧元今天的问题与观念息息相关，与德国和法国不同的经济观念息息相关。欧元未来取决于大经济体的观念对话与融合。


    **Rise of the Robots: Technology and the Threat of a Jobless Future \*\*\***


    **Martin Ford**


    在2015年出版的关于人工智能冲击现有经济和社交体系的书，这本书评宜最高。我印象比较深的是这一节：到目前为止，历次对技术进步的恐慌事后的看都是错误的，因为技术消灭了一些工作，会创造出的更多的工作。作者认为这次不同，因为人工智能打破了比较优势理论：以前是只要有比较优势，人们就可以分工生产。现在竞争者却是AI，随意复制，这头生产A，那头生产B，想要多少AI就复制多少。人哪里还有机会？这个看法对吗？


    本书已有中文版。


    **The Future of Law and Economics \*\***


    **Guido Calabresi**


    前耶鲁大学法学院院长卡拉布雷西是法律经济学的三位创建者之一，其余两位大名如雷贯耳，科斯和波斯纳。卡拉布雷西称法律经济学应法学和经济学，也就是说，法律经济学中，法学不是经济学的侍从。


    **Tragic Choices: The Conflicts Society Confronts in the Allocation of Tragically
    Scarce Resources \*\*\***


    **An Introduction to Investment Theory \*\*\***


    William Goetzmarr


    如果想了解投资理论，William Goetzmarr的投资理论入门是很好的选择。Goetzmarr是耶鲁商学院国际金融中心负责人，出身学术界，既通理论，又做实务，还精于金融史，实远胜于名。投资理论入门这个系列他直接放在网上了，可免费阅读。网址在此：http://viking.som.yale.edu/will/finman540/classnotes/notes.html


    **Only the Paranoid Survive \*\*\***


    Andrew S. Grove


    必须做到这三点，才能在新时代出头：


    第一，不要追求差异化，不要想着去造“更好电脑”——通往“更好电脑”的路上，到处都是先烈的尸体；


    第二，抢跑，抢跑，抢跑，重要的事情说三遍。先发优势至关重要，利润属于且只属于先发者；


    第三，按大规模生产预估产品可行的最低售价，剩下的事情就是把成本降到与之相符，一句话，血拼成成本。


    这是20年前的顶级商业智慧，凝聚在英特尔公司创始人安迪·格鲁夫这本《惟偏执狂生存》之中。20年后，格鲁夫去世，人们称他为硅谷教父、思想家。我则第一次读到这本1996年首版的书，仿佛挖出了时间胶囊——这些智慧已经走完一个周期：被证实，广泛接受，变成公理，然后褪色，被颠覆。


    我们会看到格鲁夫三原则卷土重来，再次成为主流商业智慧吗？


    **Concept of Corporation \*\*\***


    Peter Drucker


    **My Years With General Motors \*\*\***


    Alfred Pritchard Sloan


    1943年秋，二战犹酣，彼得·德鲁克接到了来自通用汽车公司的邀请，由此开始了对通用汽车长达18个月的调研，成果是1946年出版《公司的概念》（The Concept
    of Corporation）。这本书引爆了企业研究，不仅是有史以来第一次一位外人在企业内部的深度研究，还成为管理学的开创之作，甚至通用汽车传奇总经理阿尔弗雷德多年以后的自传《我在通用汽车的岁月》，也被视作关键内部人对这本书的系统回应。一宗事件，引出两本名著，成就一段佳话。


