    \n为什么会有谈判这件事呢？\n\n因为对双方来说，都是谈得拢比谈不拢要好，反之没得谈。谈得拢比谈不拢要好，多出来的那部分，就是双方合作创造的额外收益，也就是蛋糕，记住“额外”这两个字，关键全在这里。\n\
    \n每天你都与别人谈拢许多件事。早上在办公楼下17块人民币买杯咖啡，你就完成一次谈判：咖啡店要17块，你付款。\n\n店家只要17块，因为他认为值；你愿付17块，因为你觉得值。用经济学术语，卖得值说明有生产者剩余，买得值说明有消费者剩余，两边加起来就是这次谈判创造的蛋糕总量，作为价格，17块划分谁分到了多少。谈判就是交易，交易就是谈判。\n\
    \n假设，咖啡定价16块时，店家无所谓卖不卖（indifferent）；又假设，咖啡定价18块时，你无所谓买不买，那么，生产者剩余是17-16=1，消费者剩余是18-17=1，这单买卖创造的蛋糕总量是2，你们各分了一半。\n\
    \n每宗谈判都是两种博弈的复合体，做蛋糕是正和博弈，没有谈判就没有交易，没有交易就没有蛋糕；分蛋糕是零和博弈，总量是2，店家多分你就少分。\n\n任何谈判者都必须同时具备两样东西：\n\
    \n- 既要有正和博弈的胸怀，即谈判总比不谈判好；\n- 又要有零和博弈的警惕，因为零和博弈的世界里没有仁义礼智信。\n\n两重博弈叠加于每次谈判，谈判之难与谈判之必要都在于此。\n\
    \n接着买咖啡。\n\n如果世界上只有办公楼下这家咖啡店，而它是一口价，17块9毛5分一杯，你买就成交，不买就拉倒。\n\n你买还是不买？\n\n如果足够理性，你会买。因为你还有一分钱的消费者剩余，好过什么也没有。一分钱也是钱。于是蛋糕这样分：咖啡店拿走1.99元，你拿走1分。\n\
    \n公平吗？\n\n这是著名的心理学实验，最后通牒游戏，几十年来在全世界重复过无数次：最简单的形态是这样的：双方分100美元，一方出价，一方决定是否接受，接受则成交，不接受则双方什么也拿不到。出价方应该出多少？\n\
    \n理论值是1美分，因为对方拿到1美分好过什么也拿不到。当然，人性没有这么简单，从实际情况看，出价如果过低，往往会招致对方报复：宁可我也什么也拿不到，也要给你一个教训。从实际结果来看，一般出价低于标的30%则成交机会大减，但无论如何出价者确实能拿走大半蛋糕。\n\
    \n说到这儿你可能已经明白了，垄断生意就是最后通牒游戏。最大限定定价，考虑到消费者报复的风险，也许不是定到17.99元这么狠，而是17.33元一杯咖啡，把蛋糕拿走2/3，留给你1/3。你也知道他没什幺办法，因为就算这样，你买还是比不买要强。\n\
    \n忍气吞声，老板，来杯咖啡。\n\n其实，你走进任何商场，货架上就有无数个最后通牒等着你。你买则双方分蛋糕，你不买则双方各走各路什么也没发生，但为什么我们并不是生活在垄断者无缝蹂躏的世界里呢？\n\
    \n因为竞争。\n\n每个商家都在给你下最后通牒，还好给你下最后通牒的商家远远不止一个。现实中的咖啡店不止办公楼下那一家。\n\n如果隔壁楼下的咖啡店卖17块一杯，那么你与办公楼下那家咖啡店的谈判就完全变了。重新计算一下蛋糕大小，与楼下买卖达成的话，生产者剩余+消费者剩余还是2，那个没变，买卖失败的话情况就变了。你还能获得1，因为你去隔壁楼下买17块一杯的咖啡。所以，新的蛋糕总量变成了2-1=1，变小了，但你的地位却改善了，一杯咖啡成交的价格区间变成16块到17块之间。\n\
    \n谁都想全拿蛋糕，还好竞争限制了我们的贪欲。\n\n这个故事告诉我们几点关键信息：\n\n- 第一，蛋糕=达成交易时双方所得-不达成合作时双方所得，后者有个术语，BATNA，Best\
    \ Alternative To No Agreement（谈不成时的最佳选择），上例的实例中是蛋糕。\n- Best Alternative To No\
    \ Agreement（谈不成时的最优选择），在上面的案例中是去隔壁买17块的咖啡，你的收益也即BATNA是1；而楼下咖啡馆的BATNA是0，BATNA决定了各自谈判的底线。\n\
    \n所以，\n\n- 第二，蛋糕不是恒量是变量，在上面的案例中是变小，但也有变大的时候，有时变小对你有利，有时则是做大对你有利。\n\n而且，\n\n- 第三，没有人告诉你蛋糕总量是多少，你得自己认真思考计算，在谈判之前，一定要计算自己的BATNA和对方的\
    \ BATNA。孙子兵法说，多算胜少算，少算胜不算。BATNA以后我们还会遇到，非常重要。\n\n谈判无处不在，每宗买卖都是无声的谈判。\n\n下期讲怎么分蛋糕，这是巴里谈判法最反直觉也最有原则的那部分。你们可以想想，如果理解清楚蛋糕是什么，而双方对做成蛋糕都不可或缺，那么蛋糕“应该”怎么分。\n\
