    # 第2周问答 | 怎么做到写作上的简洁有力？


    穿夹克的jake：你的写作风格是极其言简意赅，没有一个字废话，请问要做到写作上的简洁有力，有什么诀窍吗？


    我写的时候比较随意，因为要憋着一股气，不能让它散了，要尽快写出来。但写出来之后，要修改，**主要**就是删。


    任何文章删掉30%都根本损害不到筋骨。比如说，你把“一个”删掉80%，一点问题没有；你把文章里的“的”字删掉90%，一点问题没有；你把“进行”全部删掉，一点问题没有。把这些删掉，文章自然就少了30%。这还没说如何精炼呢。冗字必去，从这里起步吧。


