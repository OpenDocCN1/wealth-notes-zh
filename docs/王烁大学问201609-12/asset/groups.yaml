    # 叔季之世生存法则


    ![](img/4df33f9dae681a82a46724774851329a_114_0.png)


    中国人眼中的历史是循环往复的，所以特长于生存智慧。合久必分分久必合，治久必乱乱久必治。天下得而一，失一则覆，虽夫子亦许之。古往今来哪一能安人则覆，被评注为治世也很乱些好端，以之为誉。


    宋儒将这化些版反为家陈常言：治世用方，乱世用圆，叔季之世方圆并用。前两句好理解，天下有道置则持表列直，天下无道则处世通圆。**叔季之世是什么意思？**


    “叔季之世”出自《左传》。中国人兄弟排序为伯、仲、叔、季，叔季排行在后，叔季之世指治世将尽乱世将起之时。


    方圆并用是不是最多策略？可惜董根没设讲细节，方多是混合方多，可为方因还是为外内方多？前者优君子，后者与世浮沉而有所不为。运用之妙，在乎一心，在于每个人自己。


    今天介绍一种学院派的生存法则，来自耶鲁大学教授。如果你把它当成书生之见弃置不理，自己负责。因为它出自专门治人类历史中最黑暗那部分的专家之手，它有理念，不天真。


    斯莱德（Tim Snyder）来给世界学人讲历史，他是耶鲁大学历史学教授，近作《黑》作为历史家，大学历史系影响力很大。在川普当选美国总统后，他在facebook上给出20条关于活着的建议，广为流传，我摘译如下，略作点评：


    +   1. 别望风而降


    独裁者的权力往往是免费渡的，别望风而降。


    +   2. 保卫制度


    因为制度本身是靠不住的，它不能保卫自己。


    +   3.保有职业伦理


    政治性荒谬，每个人就越有要保卫自己的防线。


    +   4. 警惕政治术语


    别一听到“恐怖主义”、“极端主义”就激动。


    +   5.哪怕极端事件发生，保持冷静


    独裁者总是利用极端事件集中权力。


    +   6. 重读经典


    读哈维尔的《无权者的权力》、奥威尔的《1984》、加缪的《局外人》、哈姆特的《极权论的起源》、波曼兰切夫的《一切都是假的，一切都有可能》。


    +   7. 站出来


    有些时候，总得有人站出来。


    +   8.相信事实


    放弃事实就是放弃自由。


    +   9.了解


    读长文章，订阅有操守的专业媒体，资助调查报道。


    +   10. 社交


    站起来，走出去，到没去过的地方，认识陌生人，交朋友，与他们携手。


    +   11.聊天


    与周围人聊天，看着他们的眼睛，要知道谁可以信任谁不能，如果社会崩坏，一切人彼此欺许，你得知道社会的心理地图。


    +   12.做点事


    如果看到纳粹标志，把它取下来，别光走开。


    +   13. 投票


    不要放弃投票机会。


    +   14. 资助


    资助你认同的公民组织。你不资助谁资助？


    +   15. 保护隐私


    少发邮件，多当面谈话。


    +   16. 学习别人经验


    交海外朋友。现在的挑战不是哪个国家的事，也没有哪个国家会单独拿出答案。


    +   17. 警惕带枪的人


    那些带枪的人，长期声称反体制，现在成为体制本身，这可不是好事。


    +   18.乱命不从


    如果你有公职，愿上帝保有你的良心，不从乱命。


    +   19. 保有勇气


    你如无勇气，谁有勇气？


    +   20. 留下榜样


    为后代留下真正爱国家的榜样。


    我问斯莱德，马克·吐温说，历史从不重复，但总是押韵。历史学家是不是比较能找到历史的韵脚？能不能更好地预测未来？


    斯莱德说，历史学家不能更好地预测未来，但有可能更好地理解未来作为准备。理由很简单，今天发生地的事，基本上历史上已经发生过。历史学家熟知历史，知道未来有各种可能，所以对未未来有更多的想象力，预作准备。


    普通人则忘记了历史。


