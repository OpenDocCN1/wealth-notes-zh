    # 从狗哨策略到广播


    ![](img/4df33f9dae681a82a46724774851329a_76_0.png)


    “我在耶鲁讲课时，特别提醒自己不要太讲究语法。”霍华德·迪恩说，因为学生一半以上来自非英语国家，都说英语但有各自的说法。今天世界上说英语的人当中，一半以上都在非英语国家，既使得英语成为事实上的世界语言，又使英语的“纯洁性”变成个笑话。英语属于全世界。


    我跟他恳说，我讲英语就是用自己的语法，很高兴他认为我用我自己的方式丰富了英语。迪恩大笑。


    霍华德·迪恩，美国民主党资深政治家。


    1991年到2003年连任佛蒙特州州长，2004年参选总统，开创基于互联网的草根动员模式和小额筹款策略，在党内初选中一度领先，惜败，但这套策略四年后被奥巴马用来打败了希拉里。


    迪恩后任民主党全国委员会主席，设计了50州全覆盖策略，认为统有共和党保集中资源不同，哪个州也不放弃，不管这个州有多么“深红”。这个策略奏效，两年后民主党在共和党统治中占点的多个州颇有斩获，拿下众议院多数。


    2009年退党时，迪恩还获得了荣休主席(Chairman emeritus)的头衔，以表彰其为民主党战略家之贡献。


    ![](img/4df33f9dae681a82a46724774851329a_76_1.png)


    除了这些，他还是个理想主义者，在民主党内有“Dreamer（梦想家）”之称。在耶鲁大学杰克逊研究所实习会里，他说，公干私当然支持希拉里，但“希拉里也会，我也好，我们这一代人应该尽量早退，美国急需能代表互联网一代的领袖。


    互联网一代，就是生长于互联网环境中的这一代，它早已溢出了特定阶层，进入社会草根，它与英语一样耸起并波入了全球化，重塑经济与政治。


    迪恩认为，把现在的各种问题归咎为贸易毫无意义。“降低贸易壁垒就能创造工作，句号。”迪恩认为，不光对发展中国家，这对美国也同样成立。贸易本身不是问题，它只是被卷进了政治之争。


    真正的问题是互联网兴起改变了组织的生产和生活方式，以及随之产生的工作。对受教育程度较低的人群来说，互联网会是机会；但对那些受教育程度较低的人群来说，完全不一样，它会让年轻人失业，甚至让自动化取代人类工作。在可见未来只会更严重。


    这也非是美国一家的。川普现象在全世界都出现。英国脱欧，欧洲极右派在法国日益强大，等等等等。美国白人的愤怒，已不再是在几十年重回一席位这种非政治能解决的。对于多数只想把事办成的美国人而言，是太宽了，白太穷了，觉得不公平，被精英欺骗，窃取。


    迪恩看来，川普的策略很简单，就是把人分群，然后把另外一群的人视作极值，在人群之间扇动仇恨。分而治之是自己以来的政治手法，因为人性如此。以前这手法玩得比较含蓄，迪恩以此以狗哨策略。


    # 第12周问答｜通货膨胀是常态


    **Damon 郭龙：世界越来越有不确定性，请问王老师，通货膨胀会到来吗？**


    自从进入法定货币时代，通胀就是常态而通缩是异常。我们几乎始终身处通胀之中，偶尔进入通缩，就意味着经济陷于很大困难之中。


    通胀常在，因为对一个经济体来说，最重要的事情之一就是保持足够高的就业率，或者反过来说，把失业率控制在足够低的水平。它跟提高生产率一样重要：生产率上不去，经济没有真实增长；失业率控制不住，社会要重来，一切都免疫。


    现代央行，不管其使命陈述写的是控制通胀单一指标，还是控制通胀和促进增长双重指标，其货币政策实际上长期都是偏通胀的。


    所有经济体都希望得到一定程度的通胀、接近充分的就业、稳定在自然水平上的长期增长。所以，管理得再好的经济体，通胀也常在。


    以美国为例，从未出现过恶性通胀，但自从美元于70年代与黄金脱钩以来，其真实购买力已经下降了95%。今天的一美元，相当于当年的五美分。


    通胀虽然两个字，却包含着多重含义。


    第一种是物价上涨和温和上涨。几乎所有经济体都欢迎这种情形。对温和上涨的定义，视乎各国的政治经济状况而不同。比如中国，5%以下就是温和的；比如德国，5%肯定难以接受。这个国家对于历史上恶性通胀的后果极为敏感。


    第二种是明显上涨。同样，各国人民耐受度不同，但不论哪个国家，通胀水平持续在两位数都是不可接受的。但凡央行履职，都会尽力把它压下来。


    第三种是恶性通胀。如1920年代德国剧烈通胀，货币贬值到如纸，悲惨纪录直到近年才被打破。这种情况一旦发生，明天没有意义，人人活在当下，社会礼拜乐崩，一切坚固的都烟消云散，国家倾覆。


    当然，恶性通胀从来不是因而果。它也几乎从来不是经济管理失败所致，它折射社会整体溃败，首先是政治失败。它是晴雨表，也是放大器。


    你的问题是：我们会不会进入这种状态？


    第一，离得还很远。历史没有方向也不会线性发展。过度沉迷于见微知著，结果往往是杞人忧天。


    第二，不过，正如去年诺贝尔经济学奖得主安格斯·基顿所说，过去几百年，人类逃离饥荒和疾病的速度与规模是从所未见的，也是偶然的，没有什么理由认为它一定会持续。


    第三，太阳底下无新事，这次不同。各有各的理，你怎么办？别预测，做准备。建议你再读一遍本专栏文章《黄金有何用》。


