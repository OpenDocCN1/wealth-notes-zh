    # 第1周问答 | 怎么摆脱拖延症？


    闪闪发亮：你是特别勤奋的人，通常勤奋的人时间利用效率都极高，请问有什么特别强力有效的方法能让人摆脱拖延症吗？


    # 王烁


    需要摆脱拖延症的，我看还是不够忙。够忙的话，你拖不起。


    习惯性地拖延坏处很多，至少在我犯这毛病的时候，一是浪费时间，因为拖延那段时间不会在于有用的事，而是纯拖延；二是消耗精神能量，因为拖延那段时间里，你不是看电视就是刷微博、朋友圈，而且为刷而刷。


    怎么办呢？


    我今天没有什么拖延症，因为太忙，你先忙起来。如果一时忙不起来的话，那就先做两件事。


    第一是想到什么马上做，一刻也别拖。耶鲁世界学人项目有专人来培训写作。写作指导老师对我们说，写这件事最容易拖延，所以要告诉自己，只写两分钟就好。这当然只是降低你开始写的心理焦虑，只要开始写起来就会写下去了。


    第二是把你大计划分解成多可以马上去做的小任务。别被自己的伟大目标吓住，总是走不出第一步。无须把目标变小，会分解就行。


    # 《王烁大学间》欢迎你向王烁提问


    yueyue 12


    还有一种说法是拖延症很多时候是因为太追求完美，我觉得可以作为老师第二条的延伸补充。因为太追求完美，而觉得自己无法做好一件很复杂比较复杂的工程，而进退两难或不敢开始（我自己写paper或写项目报告就会陷入这个圈子）。非常赞同老师讲的，将大计划分解成小目标，这个时候我们不要去订计划的金钱，只需按要求一步一步完成小目标，然后不知不觉，整个完成。目前做以上两件事基本都采取这种方法，确实也避免了总被大计划吓住而排斥和拖延。


