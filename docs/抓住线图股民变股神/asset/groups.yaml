    \n▲上圖說明：\n\n大盤自2008年1月23日的7384點一直漲到同年5月20日的最高點9309點。\n\n### ■汰弱換強是股市反敗為勝的唯一祕路\n\
    \n下面的實例是發生在2011年上半年（讀者可以看作者在第1本書《抓住飆股輕鬆賺》中第16頁自序：「不信技術分析的慘痛經驗」一文），一位朋友在2010年12月22日以92元買進宏碁（2353）被套牢，當時我告訴他要採取「汰弱換強」策略，\n\
    \n## 第四章 張炳雄「不該”投資：股票操作敗案例\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_48_0.png)\n\
    \n資料來源：富邦@01電子交易系統\n\n△上圖說明：\n\n大盤2008年上半年創9309點高點的同一時期，弱勢股華上（6289）股價由27.8元拉回整理，後來只上漲到28.3元，當大盤反轉之後，華上股價則一路大跌到10.2元。\n\
    \n趕快換股操作，否則難以解套，結果，他一直到2011年5月25日才願意以52.7元認賠賣出，轉進正在多頭上漲的股票基泰（2538），5月25日當天以17.5元買進基泰，截至6月20日以21元賣出，7月4日再用20.4元買進，到7月20日以23.5元賣出，一共操作兩趟。\n\
    \n我們檢視比較一下：\n\n- 1. 如果這位朋友套牢經抱宏碁，不換股操作，宏碁股價在2011年5月25日至7月20日間繼續下跌了12.8元，跌幅24.3%。同一時期換股操作基泰，獲利6.5元，漲幅達37%。\n\
    - 2. 宏碁92元買進，到52.7元認賠換股時，共賠了43%，後來換股操作的基泰漲幅37%，雖然整體結果仍然小賠約6%，但是已經接近回本解套，繼續去找一檔開始上漲的多頭股票，相信很快就能「反敗為勝」。\n\
    - 3. 如果一直抱牢不換強勢股操作，宏碁股票截至2011年8月26日，股價跌到27.3元的低點，之後股價至少要上漲3.3倍，才能回本解套。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_49_0.png)\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_50_0.png)\n\n### 改變自己 絕不擁有賠錢7%的股票\n\
    \n希望讀者看完這本書之後，能夠下決定心，以後手中絕不持有賠錢7%以上的股票（指收盤價）。\n\n傑西·李佛摩（Jesse Livermore）在談到資金管理時說：「請記好：投機客在出手交易前，一定要牢牢設好一個停損點，而且千萬不要讓自己承擔超過本金百分之十的損失！」\n\
    \n如果讀者再去看其他華爾街頂尖操盤高手，例如威廉·歐尼爾（William J. O'Neil）、伯納得·巴魯克（Bernard Baruch）等等，他們各有操作的絕技，但是都共同遵守停損出場的紀律，絕不容許損失擴大。\n\
    \n傑西·李佛摩（Jesse Livermore）說：「假如你損失了百分之五十，你必須賺百分之一百才能扳回失土。」下面是一張李佛摩提出的百分之十損失回本表，讀者一邊參考，一邊深入思考，就能體悟到停損的重要了。\n\
    \n#### 傑西·李佛摩提出的百分之十的損失回本表\n\n| 買進金額 | 賠錢金額 | 剩餘資金 | 損失 | 要回來須賺 |\n| :---: | :---:\
    \ | :---: | :---: | :---: |\n| 1000元 | 80元 | 920元 | 8% | 8.7% |\n| | 100元 | 900元\
    \ | 10% | 11.1% |\n| | 200元 | 800元 | 20% | 25% |\n| | 300元 | 700元 | 30% | 42.8%\
    \ |\n| | 400元 | 600元 | 40% | 66.6% |\n| | 500元 | 500元 | 50% | 100% |\n\n讀者看第49頁的標題，為什麼是寫7%呢？這是我個人的最大賠損幅度限額。根據自己多年的操作經驗，當停損來到7%時，實務上經常出現真正殺出股票時已賠到8～9%；如果設10%為停損，實際上會賠到12%以上。我最多停損7%，取回93%的資金，隨時可以找尋好的機會反敗為勝，而且操作股票能夠掌握主權，操作EQ才能保持穩定。\n\
    \n其次，現在股市操作環境與當年那些高手操作環境不可同日而語，現在一切都是電腦資訊，股價的判斷與反應非常快，因此風險的控制也要跟著提高。\n\n2011年3月15日，有位學生看到振維（3520），當天K線長黑跌破長期盤整區，立刻放空，結果第2天開盤下跌，收盤反而上漲。他問我：「不是盤整跌破，應該要下跌嗎？怎麼不跌反漲？」我問他：「是不是不正常？既然不正常，表示這次的跌破，可能是假的，如果明後天再上漲，要反向做多。」結果，振維股價在後面3天都上漲，而且第3天，3月21日拉出長紅突破盤整區，造成後面的飆漲。\n\
    \n我們學技術分析，由數據統計的圖形去對後面走勢的研判，當然有很高的準確性，我們可以在正常的情況下應該如此的表現去推論。學技術分析好比在校驗的課本，即使考試一百分，到了市場去不一定保證就是績優生，問題出在哪裏呢？其實問題出在市場經常不照著正常的邏輯理論去走，這樣一來，就把那些只會捧著課本的學生打敗了，要如何不被市場（主力大戶）玩弄呢？\n\
    \n各位要瞭解市場什麼情況是正常、什麼情況是不正常的現象，再針對不同的現象採取一些簡單的策略，就能輕鬆應付，\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_53_0.png)\n\
    \n慢慢熟悉市場的生態就是如此，你就會漸漸成為操盤高手了。\n\n### 二 不管市場反應正不正常，仍因應盤面跡訊\n\n以下探討市場出現正常與不正常的9個現象，讀者如能舉一反三，就能看出市場的變化萬千，其實萬變不離其宗，掌握當下出現不正常現象時，能夠按紀律處理，你就出師了。\n\
    \n- 1. 當利空消息出現時：\n    - （1）正常現象：股價下跌，例如宏碁宣布調降財測，股價應聲大跌。\n    - （2）不正常現象：股價不跌或反漲，例如宏達電股價在200多元時發布毛利減少、蘋果告侵權利空，但是股價卻不跌，反而從此往上漲。\n\
    \    - （3）因應策略：出現正常時，執行停損；出現不正常現象時，鎖股進場。\n\n- 2. 當利多消息出現時：\n    - （1）正常現象：股價上漲。\n\
    \    - （2）不正常現象：股價不漲或反跌。\n    - （3）因應策略：出現正常現象時，鎖股進場；出現不正常現象時，執行停損。\n\n- 3. 當大量長紅K棒出現時：\n\
    \    - （1）正常現象：股價上漲。\n    - （2）不正常現象：股價不漲或反跌。\n    - （3）因應策略：出現正常現象時，追進；出現不正常現象時，觀察或退出。\n\
    \n- 4. 當大量長黑K棒出現時：\n    - （1）正常現象：股價下跌。\n    - （2）不正常現象：股價不跌或反漲。\n    - （3）因應策略：出現正常現象時，出場或做空；出現不正常現象時，觀察或買進。\n\
    \n- 5. 盤整區或型態往上突破：\n    - （1）正常現象：股價上漲。\n    - （2）不正常現象：股價在3日內拉回盤整區或反向跌破盤整區（假突破真下跌、穿頭破底）。\n\
    \    - （3）因應策略：出現正常現象時，買進；出現不正常現象時，執行停損，反手做空。\n\n- 6. 盤整區或型態往下跌破：\n    - （1）正常現象：股價下跌。\n\
    \    - （2）不正常現象：股價在3日內反彈回到盤整區或反向突破盤整區上漲（假跌破真正漲、穿底破頭）。\n    - （3）因應策略：出現正常現象時，放空；出現不正常現象時，執行停損，反手做多。\n\
    \n- 7. 跌破重要均線支撐：\n    - （1）正常現象：股價下跌。\n    - （2）不正常現象：股價在3日內反彈再站上均線（跌破均線再站上均線）。\n\
    \    - （3）因應策略：出現正常現象時，空手觀望；出現不正常現象時，買進。\n\n- 8. 突破重要均線壓力：\n    - （1）正常現象：股價上漲。\n\
    \    - （2）不正常現象：股價在3日內拉回均線之下。\n    - （3）因應策略：出現正常現象時，持股續抱；出現不正常現象時，賣出持股或放空。\n\n\
    - 9. 島狀反轉：\n    - （1）正常現象：反轉向下或向上。\n    - （2）不正常現象：封閉缺口不反轉。\n    - （3）因應策略：出現正常現象，要改變操作方向，例如多轉空的島狀反轉，改變做空；出現不正常現象，則要立刻修正思維，該空不空反多力量強，做多。\n\
    \n## 第一章 會賣股票才是師傅 抓住停利點的12個關鍵\n\n2012年1月30日（星期一）新春開紅盤，當天大漲173點，2月1日（星期三）下午上課時，許多同學都很興奮的說，他們前天去買股票，今天賣掉，賺了幾千塊錢，我恭喜他們，龍年好兆頭，但是我問他們，為什麼要賣掉了？他們的回答都一樣，看到今天盤中在下跌，有賺先賣。\n\
    \n這就是一般投資人的心態，其實賣股票和買股票是一樣的，都要事先就規畫好，不是想賣就賣，否則會買不會賣，原本可以賺到3成的股票，結果只賺到1成，豈不是浪費了一次賺錢的機會。\n\
    \n俗話說：「會買股票是徒弟，會賣股票才是師傅。」經過學習，多數人曉得如何挑選股票，卻都沒有停利的規畫。換句話說，懂得買進，不懂得賣出，看到股價上漲，又看著下跌，或者抓到一檔會漲的股票，但是漲一點點就賣掉，該賺的沒賺到。\n\
    \n股票賣出換成現金，結算有獲利，才是真正賺錢。沒有賣出前，股價隨時都在上上下下，如何拿捏到應該賣出的價錢，的確不容易。賣的太早，只賺到一點點的小錢，該賣沒賣，又可能遇上股價快速回跌反而賠錢。\n\
    \n如何賣出股票是獲利重要的關鍵，也是每次交易的最後一個動作，如何劃下完美的句點，讓辛苦的付出有代價，是重要的功夫。\n\n### 精通這些觀念 保住獲利沒煩惱\n\
    \n首先，觀念要正確，否則在決定賣出的時候，永遠會捉摸不定，造成該賣沒賣、不該賣卻賣掉的狀況。\n\n- 1. 股價漲多會拉回，有獲利賣壓、有解套賣壓，有大戶調節賣壓、洗盤賣壓。因此，除非是飆股，否則即使是上漲的多頭格局，也是漲一段、回跌一段或是盤整一段。\n\
    - 2. 記得！股票操作過程中，停利與該股的基本面無關，賣出的決策取決於價格的走勢及成交量變化。\n- 3. 好的進場點是操作成功的一半，好的賣出點則是成功的另一半。\n\
    - 4. 股價的起漲與起跌，不是個人能夠掌控的，永遠不要想賣到最高點。一般人往往想說還有高點，卻因而錯失在相對最佳高點的賣出時機，最後股價反而下跌到更低。在操作中，達到自己設定的目標價、出現賣出訊號時，都應該斷然賣出。賣出後，如果股價繼續上漲，不要覺得可惜，「十鳥在林，不如一鳥在手」，買賣股票的目的是獲利，不能掌握賣出獲利的契機，只是自我陶醉、空歡喜一場而已！\n\
    - 5. 正常多頭股價上漲超過10%利潤時，就會引來獲利賣壓，如\n"
  mdcn: "\n## 第 1 篇 改變自己 才能改變股票賠錢的命運\n\n成自認為「應該」的判斷，經過多次的失敗，對自己所學的技能分析失去信心，因而會說技術無用的言論。\n\
    \n學富五車的投資人，經常對自己的判斷過於自信，這些朋友賠錢大多是當技術圖形發生改變的時候，太過執著於對其它的基本面、產業面或是消息面的自信而忽略趨勢改變的事實。\n\
    \n一般來說，這類的投資人不太會提出問題，他們經常表現出的是對自己的分析研判信心十足。另一方面，由於這類投資人所學太多，有時過多的考慮反而阻礙了對市場的判斷及應有的迅速反應。\n\
    \n### 以技術分析因應市場的變化\n\n股票市場的變化，對一般投資人而言，會感到千變萬化很複雜，其實股票的變化沒有那麼複雜，只是人心的變化太快，對股票一點點的波動，反應太靈敏，尤其對任何消息的反應，更是容易陷入情緒的反應。\n\
    \n美國道瓊指數發明人查爾斯・道（Charles H. Dow），早在1900～1902年發表道氏理論（The Dow Theory）就提出過對股市循環的看法，同時很明確的指出，贏家（他稱為「聰明資金」）與輸家（散戶）的區別就是，輸家很容易受到大眾情緒的影響，而贏家不受大眾情緒的影響，其中最重要的原因是，贏家知道如何利用技術分析來克服市場及個人情緒。\n\
    \n眾人皆知，股票市場的波動是正常現象，股市的走勢方向不是上漲的多頭，就是下跌的空頭，或者橫向的整理等3種，因此，對股票走勢的判別是技術分析的第一步工作。\n\
    \n我們把多頭、空頭、盤整這3種走勢分辨清楚之後，再分別對每一種走勢找出因應的操作對策，如此一來就把複雜的盤勢簡化了不少，至少不會做錯方向而遭受重大損失。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_39_0.png)\n\n▲上圖說明：\n\n- ① 一頭比一頭高、一底比一底高的多頭方向。\n\
    - ② 一頭與一頭同高、一底比一底高的盤整區。\n- ③ 一頭比一頭低、一底比一底低的空頭方向。\n\n用技術分析（參看作者第一本書《抓住飆股輕鬆賺》）很容易就能分辨出當下股票的走勢方向，一般散戶比較容易分不清的是如何區分短期、中期、長期的走勢方向。\n\
    \n其實用個簡單的方法就可以區分了，你用日線的K線走勢圖所看的方向，就是短期的走勢方向；用週線的K線走勢圖所看的方向，就是中期的走勢方向；用月線的K線走勢圖所看的方向，就是長期的走勢方向。\n\
    \n現在你也能像分析師一樣的說「現在大盤是短空、中期整理、長多格局不變」的專業話語了。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_40_0.png)\n\
