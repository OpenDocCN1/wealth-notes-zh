    ◎ 定義：多頭上漲一段後出現「頭頭低」現象，波浪轉折高點不過前面波浪轉折高點而下跌，下跌時沒有跌破前面波浪轉折低點就上漲，股價橫向發展成「高不過高、低不破低」的區間盤整。


    ◎ 動作：盤整時勿操作，「等到」盤整結束，股價大量突破盤整區時，做多買進；股價跌破盤整區，為做頭反轉，


    可以做空。


