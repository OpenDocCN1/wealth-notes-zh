    # 收盤價


    +   1. 當日多空雙方經過一天的決戰最後結果的價格。


    +   2. 可以看出當日多空的強弱，並可以預期明日開高或開底的意圖。


    +   3. 收盤價與昨日最高價及最低價比較，是否突昨高點或跌破昨日低點，是轉強或轉弱的重要觀察指標。


    # 子母K線透露多空角力的攻防


    當K線出現子（短K線）母（長K線）線並列時，透露出多空力道的角力，會影響後面的走勢表現。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_147_0.png)


    +   ① 長紅後小黑，大漲小回，多方力道強。


    +   ② 小紅後長黑，小漲大回，不過昨日高點又跌破昨日低點，空方力道強。


    +   ③ 小黑後長紅，小回大漲，翻股線形，多方力道強。


    +   ④ 長黑後小紅，大跌小漲，空方力道強，但在底部，如不再破底，可能止跌。


