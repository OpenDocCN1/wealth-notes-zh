    # 第 **4** 篇

    ## 第 **4** 章


    ### 長波段操作戰法 2

    5週均線 + 12週均線交易法


    前面提到的20週均線交易法要等到月線出現破切線的機會，有時要等很久。因此，我們可以把它波段的周期縮短一些，用5週均線及12週均線這兩條週線來操作，這樣做波段的機會比較多，同時具有賺大錢的優點，同樣是機會來時，就能夠操作一段時間，而且不必每天盯著盤面。


    ## 5週均線 + 12週均線交易法運用


    「5週均線 + 12週均線交易法」就是用週線的2條均線交易法，由於是依據週線操作，所以時間會比較長，可以做為長波段的操作方法。


    戰法優點：

    - 1. 規則簡單清楚，容易執行。

    - 2. 中波段操作，進出次數少，獲利高。

    - 3. 不需要看盤，盤後看收盤，次日交易。

    - 4. 操作簡單，參考成交量、基本面即可。

    - 5. 適合一般大、中、小額資金操作。

    - 6. 操作EQ高。


    基本功力：

    熟練技術分析的「四大金剛」，執行能力要100%。


    操作目標：

    走勢明確時，波段獲利能夠達到20%以上。


    交易條件：

    - 1. 以波浪型態為最優先考量，順勢交易。多頭做多，空頭做空，不逆勢交易。

    - 2. 採用技術指標：看過走勢圖，用5週均線及12週均線兩條均線，以5週均線做進出，以12週均線做趨勢方向判斷。

    - 3. 趨勢依據：股價在12週均線之上，而且該均線上揚，趨勢為多，操作只做多。股價在12週均線之下，而且該均線下彎，趨勢為空，操作只做空。

    - 4. 用週線選股，守週線紀律，在日線進出。


    ### 在多頭走勢做多操作定法


    用5週均線搭配12週均線的交易法在多頭走勢做多，要抓住進場時機，須配合波浪型態，看趨勢方向。主要操作方法說明如下：


    進場

    （1）週線低檔打底完成，盤整的波浪型態符合「底底高」格局。

    （2）週線連續長黑，出現突破下降切線的暴大量長紅K線，而且站上12週均線之上，或者突破底部盤整區上頸線（要等到星期五收盤才確認）。

    （3）均線走平或開始上揚。

    （4）低檔5週均線反轉向上穿過12週均線，產生黃金交叉，股價站在5週均線之上時。

    （5）股價跌破12週均線，均線維持上揚，當股價再次站上12週均線時買進。

    （6）符合前述（1）至（5）條件的個股，回到日線等到符合進場的位置進場做多。特別提醒讀者：週線確認長紅K棒突破底部盤整，日線可能已上漲一段來到高檔，這時即使週線大機會出現，但是仍然要等待日線出現正確進場位置時切入。

    （7）剛進場時，停損守20日均線。


    續抱

    股價未跌破5週均線時續抱。


    出場

    股價接近5週均線時，當日K線跌破5週均線的價位時出場。例如當日是星期二，當週的5週均價是98元，如當日收盤前股價跌破98元就要出場，而不是等到星期五收週線時才做處理，這是控管風險第一的觀念。


    續勢

    12週均線保持向上走勢，股價未跌破12週均線之前，繼續做多；股價站上5週均線時，進場繼續操作。


    ### 在空頭走勢做空的操作要點


    用5週均線搭配12週均線的交易法在空頭走勢做空，要抓住進場時機，須配合波浪型態，看趨勢方向。主要操作方法說明如下：


    - (1) 週線在高檔做頭完成，波浪型態符合「頭頭低」（峰峰低）格局。

    - (2) 週線連續長紅，出現跌破上升切線的暴大量長黑K線，而且股價在12週均線之下，或者跌破頭部盤整區下頸線。（要等到星期五收盤才確認）。

    - (3) 在高檔均線走平或開始下彎。

    - (4) 在高檔5週均線反轉下彎，向下穿過12週均線產生死亡交叉，股價跌落5週均線之下時。

    - (5) 股價突破12週均線，均線維持下彎，當股價再次跌破12週均線時，續空。

    - (6) 符合前述（1）至（5）條件的個股，回到日線等到符合進場的位置進場做空。

    - (7) 剛進場時，停損守20日均線。


    股價未跌破5週均線時，續抱。


    股價接近5週均線時，當日K線突破5週均線的價位時出場。例如當日是星期二，當週的5週均價是98元，如當日在收盤前股價突破98元時就要出場，而不是等到星期五收週線時才做處理，這是控管風險第一的觀念。


    12週均線保持向下走勢，股價未跌破12週均線之前，繼續做空；股價跌破5週均線時，進場繼續放空操作。


