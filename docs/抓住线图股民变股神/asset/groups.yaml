    +   - ◎ 定義：股市走勢不符合多頭定義，也不符合空頭定義，往橫向發展。盤整位置又分為底部盤整、續勢盤整與頭部盤整。


    +   - ◎ 動作：進入盤整區，建議退出觀察，因為盤整期間可以是一週，也可以長達數月之久，資金不宜留在盤整區。任何位置的盤整，都是另一次上漲或下跌的機會，最好的策略就是「等待」，「等到」盤整結束，向上帶量突破時，做多；向下跌破時，做空。


