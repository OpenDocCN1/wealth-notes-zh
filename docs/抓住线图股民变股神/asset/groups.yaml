    \ 1 天就趕緊賣掉，實在可惜。\n- 12. 綜合而言，停利點應該包含在自己操作策略的一環，當符合停利的現象出現，應依紀律停利，如此就能把握每次的獲利入袋。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_59_1.png)\n\n目標要達成，策略先擬好，最多做 5 檔，專心操作好。\n\
    \n長線要短做，風險自然少，紀律能執行，獲利不會少。\n\n58\n\n## 第1篇 第5章 把技術分析當信仰 可以實現你的夢想\n\n我跟一般散戶是一樣的，做人做事規規矩矩，只是一個自己操作的小額投資人，在以往做股票時，總是希望找到基本面很好的公司，這樣買進來比較放心，公司不會倒，股票應該不會變成壁紙，再看公司有沒有賺錢、本益比合不合理，如此一來，即使股票下跌，還能拿到一些股利。如果這支股票又有投顧老師推薦，那就一定不會錯，如此萬全的挑選應該萬無一失，可是結果總是令人失望。\n\
    \n當我學習技術分析，再分析研究過上萬張圖形之後，這才發現，股價任何的變動，在走勢圖上都一清二楚。\n\n2012 年龍年開紅盤之後，當時很多人一定感到年前、年後兩個樣，才放個春節，國際市場也沒有出現什麼大變化，怎麼台股大盤差那麼多，5\
    \ 天就漲了 441 點。其實，各位去看一看所有上漲的股票，早在 2012 年農曆年前，就已在低檔完成「底底高」的底部型態了。\n\n但是，大家公認最佳投資的公司——中華電（2412），在\
    \ 2012 年 1 月 9 日跌破盤整區，過了不久，農曆年開紅盤，別的\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_61_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n股票連續 3、4 天上漲，它卻往下跌，在這個農曆過年期間也沒有看到該公司有什麼壞消息，請問它為什麼這樣走勢？其實，不必問為什麼？技術圖形早就告訴你了，只是你信不信而已！\n\
    \n### 一 為什麼要用技術面操作股票？\n\n研究股票很複雜，包括基本面、消息面、技術面、產業面、經濟面、政治面、心理面……，要面面俱到可不容易，但是操作股票要簡單，只要用「技術面」就可以面面俱到，因為技術面充分反應所有影響股價的因素。\n\
    \n#### 1. 可以反應市場所有交易人的行為\n\n股價走勢包含著市場中理性與非理性交易的結果。其中，公司的基本面如資本額、本益比、淨值、財務報表、營收等經濟數據都是客觀的具體數字統計，可是，還有對產業的前景、產業的轉型、公司經營人的形象及國家經濟的現況等多空變數，這些都是主觀的判斷，屬於市場的心理面。\n\
    \n客觀的數據大家都看得到，所以決定要買或賣股票，都是在心理情緒的主導下進行交易，否則一家公司的基本面只有一個版本，市場怎麼有人會看好去買？同時有人看壞去賣呢？\n\
    \n無論交易人是以什麼方面去衡量股市，只有完成交易的股價、成交量等數據產生的技術分析圖，才足以衡量真實市場的現況。\n\n#### 2. 技術分析可以具體訂定交易方法\n\
    \n技術分析每天產生的數據，能夠讓我們訂定出一套可以具體研判及執行的操作方法，例如設定進出價位、停損停利的點位、研判未來的走勢方向、風險控管等。\n\n任何人還會受到情緒影響，對行情判斷容易陷入一些主觀的認定而做出錯誤的決策，技術分析可以避免這些情緒的干擾。\n\
    \n#### 3. 技術分析是散戶唯一可以依賴的市場訊息\n\n散戶是市場中資訊管道最弱的族群，幾乎不可能拿到第一手的內部或是外部的資訊，因此，學會技術分析更為重要，看得懂行情走勢及瞭解圖形發出的訊息，才能在詭譎多變的市場中確實掌握方向，而不會被周遭一堆的消息所迷惑，因為所有的消息面、基本面、心理面等，都會反應在當天交易的價格以及\n\
    \n成交量之中。\n\n#### 4. 學習技術分析的目的是看懂圖形語言\n\n股票走勢圖是每天交易結果出現的連續圖形，反應出所有交易人的想法及做法，我們學習技術分析就是為了能夠在圖形中去瞭解他們的想法及做法，以作為日後可能發展的研判及自己策略的擬定。\n\
    \n#### 5. 用技術面去操作，可改變散戶賠錢的命運\n\n散戶賠錢的原因很多，下列 6 點是最常見的原因，我們只要用技術面去操作，就能夠改變賠錢的命運。\n\
    \n##### 1. 做錯方向\n\n散戶賠錢的第一個原因是做錯方向，聽消息買股票，根本不知道大盤及個股現在走勢的方向或位置，例如個股正在中期回檔格局，前兩天的上漲只是反彈，今天追買到反彈高點，結果明天就下跌而套牢賠錢。\n\
    \n要清楚知道股票現在的方向，唯有技術面可以解決，基本面再好的公司，股價一定會有下跌的時候，所以基本面不能告訴你現在股價的方向。\n\n##### 2. 買高賣低\n\
    \n散戶賠錢的第 2 個原因是經常買到高點，這個原因很簡單，因為股價上漲的第 1 天，心理沒有準備，即使盤中看到它在上漲，由於前面走勢是下跌，心中不免會懷疑真的會再漲嗎？第\
    \ 2 天繼續往上，觀察後，大致確認應該是真的上漲；第 3 天看它還漲，趕快追進，往往就買到高點。你想一想，漲了 3 天，漲\n\n幅大致都有 10% 以上，第\
    \ 1 天買的人開始短線獲利賣出，股價自然要休息或回檔整理了。\n\n技術面可以看出第 1 天上漲的型態位置，是否符合買進的機會。如果是很好的買點，當然不會猶疑，立刻買進，如此買在低點，風險小，獲利機會高，當股票漲上去，別人追高時，你正可擇機賣出，獲利輕鬆入袋。\n\
    \n##### 3. 不知盤整是「整你盤」\n\n散戶賠錢的第 3 個原因是股價在盤整區上下震盪，仍然在買進賣出操作。盤整盤又稱「整理盤」，意即「整你盤」。散戶要不是看不出股價在盤整區，就是受消息面影響一直想操作這檔股票，結果不是兩頭被扒，就是資金套在盤整中。如果遇到一盤兩個月，鬥志消減殆盡不說，盤整結束是往下跌破，那可還要再賠大錢呢！\n\
    \n我們從技術面可以看出股價是否進入盤整，這時可以退出休息，或者把資金挪去買其他上漲的股票，等到該股盤整結束，往上或往下，方向明確時再來做它，不是很好嗎？\n\
    \n##### 4. 不會停利\n\n散戶賠錢的第 4 個原因是，買到一檔上漲的股票，到高檔該獲利了結時，因為貪婪而捨不得賣出；當股價回跌時不甘少賺，心想等到漲回上次高點時再賣出，結果股價一路往下，該賺的沒賺到，反而倒賠。\n\
    \n不會停利是因為不知道哪裡是高點，如果用技術分析，可以知道是否是高檔？是否出現賣出訊號？主力是否在出貨？自然就能夠即時脫的股票，賣到相對的高點。\n\n\
    ##### 5. 沒有耐心\n\n散戶賠錢的第 5 個原因是沒有耐心等待，隨隨便便就投入資金，憑感覺喜好或聽消息就介入，結果不是被套牢，就是賠錢出場。\n\n\
    在技術分析圖上，可以清楚知道何處是好的買點，當買點沒有出現時，要耐心等待，千萬不可浪費子彈（資金）。\n\n##### 6. 沒有定法\n\n很多散戶操作雜亂無章，一會兒想買，一會兒想賣；不知道為什麼要買，不知道為什麼要賣；賺了一點點就跑，賠了一大截卻死抱活抱。如此沒有定法，賠錢是必然，賺錢是運氣。\n\
    \n技術分析最重要的一項功能，就是可以訂定出一定條件下的交易規則，有了固定的交易規則，自然要比不切實際的胡思亂想操作的成功賺錢機會大得多。本書第 4 篇介紹的「長短線操作戰法」，特別介紹多種長短線的操作方法給讀者參考運用。\n\
    \n### 經營股票市場 最好的基本事業\n\n有一種事業沒有年齡的限制，沒有性別的區分，不必很高的學歷，不須姣好的外貌，不必投入很多的資金，不須昂貴的設備，不須很大的空間，不用面對老闆，不用僱用員工，不用開發客戶，不用拋頭露面，不用交際應酬，不須背景後台，不會風吹日曬，不必上班打卡，不用遠離家門，而且市場天天開門（双休二日及例假日休息除外），客戶數以百萬，交易金額日上千億……。真的有這種事業嗎？\n\
    \n有！那就是經營股票市場。\n\n## 第 1 篇\n\n### 323 把技術分析當信仰 可以實現你的夢想\n\n俗話說得好，「靠山山會倒，靠人人會跑。」經營股票市場，確實是個很棒的事業，不過，「天下沒有白吃的午餐」，經營股票市場要賺錢，如同熱滾滾的油鍋中撈黃金，看得到，卻不容易拿到，想要看得到又撈得到，是需要一些本事的。\n\
    \n要學撈黃金的功夫，要先過下面 3 關：\n\n- 1. 入門第 1 關：學習技術分析，改掉錯誤觀念。\n- 2. 進階第 2 關：學習操作方法，找到自己模式。\n\
    - 3. 賺錢第 3 關：修煉上乘心法，完全紀律操作。\n\n而且，把股票當成事業經營，你必須對股市要有以下 4 點基本認識：\n\n- 1. 操作股票的目的是從股市賺錢，但是想賺錢並不表示你就能賺到錢。你必須在正確的時間做正確的事，賺錢只是結果，做正確的動作比想賺錢重要。\n\
    - 2. 要有心裡準備，學股之路是艱難且漫長，要想從股票學校畢業，你必須具備一項特質，就是「堅持的毅力」，如此才可能熬過黑暗沮喪的日子。\n- 3. 操作股票是一種投機行為，投機本身是一門學問，既然是學問，那麼就有道理可循，股市中的投機行為要奉行兩個最高指導原則：\n\
    \    - (1) 能小賠不能大賠。\n    - (2) 大賺小賺都要賺。\n    \n    簡單的說，投機原則包括：\n    - (1) 要掌握主動權，小賠出場，擁有現金，才有主動權，如\n\
    \    - (2) 要掌握攻勢權，每次出手前做好進攻及撤退的策略。做對，追求最高獲利；做錯，按照策略撤退。\n- 4. 進場操作時注意兩種現象：\n  \
    \  - (1) 順著股票運動的方向操作賺錢，當方向改變時要出場。\n    - (2) 行進中注意危險訊號避險：任何時候，你手上持有的股票上漲機率必須大過下跌的可能，否則你就不該留在手中，即使是五五波也不該留。看到危險訊號，表示你獲勝的機率此時已不超過\
    \ 50%，這時要當機立斷，採取行動，千萬不要在鐵軌上，見到火車向你衝來，還漫不經心的散步。\n\n> 「股市即生活，生活即股市。」面對股市，接受當下走勢，處理手上持股，放下賺賠結果。\n\
    \n## 第 1 章\n\n### 股市賺錢的最高心法: 等、確認、集中火力、學到做到\n\n2011 年雙十節前一天，我參加師大附中的同學會，高中同學范同學說：「做股票好像在遊樂場中玩打土撥鼠一樣，一下子這隻探出頭，趕快去打，還沒打到，另外一隻又冒出头，想趕快打卻令人措手不及。股票也是，一下子這檔在漲，一下子那檔在漲，不知道到底要追哪一檔？追到的話，整天一顆心懸在那裡，害怕追到高點；沒追到的話，又眼睜睜看著股票漲上去，心有不甘啊！」\n\
    \n范同學說得一點都不錯，一般散戶做股票的心態就是如此，一顆浮動的心，始終無法安定下來，我建議他來上課，除了學習技術分析之外，學習正確的操作觀念及心法，瞭解做股票是怎麼回事，心自然就不會那麼亂了，後來，范同學不但自己來上課，還帶他的兒子一起上課。\n\
    \n股市瞬間千變萬化，心隨境轉誠屬必然，要想降伏不安定的心，無法外求，只能內省，看破股海紅塵，知其陰陽時序，順其多空輪迴，賞花折枝乃自然水到渠成，保持一顆平實有序的真心，股海揚帆頓時海闊天空。\n\
    \n在股市中要成功，除了技術、方法之外，最後也是最重要的階段就是「定心」，如何能夠降伏一顆不安定的心，是本章重要的內容。希望讀者閱讀同時能夠用心體會，當你一念不生，就是「開悟」之時。\n\
    \n### 二 股市賺錢是「等」來的不是「進」來的\n\n在我授課的股票教室裏有位黃同學，是一位知名的心臟科醫生，也是一位名攝影師。他說，為了要捕捉一個鏡頭，經常需要長久的等待，尤其是為了拍自然景觀，如果到達目的地時天氣不好，為了等天氣好轉，一等\
    \ 3、5 天是經常的事，至於翻山越嶺、酷熱寒冷，更是家常便飯。\n\n這讓我想起，每次到植物園時，都看到一些愛好攝影人士架好腳架及相機，為了等待而在聊天，他們無法追逐飛鳥，只有等待鳥兒的到來，捕捉完美的精彩畫面。\n\
    \n在股票市場，許多人終日在追逐明牌，追逐消息，追逐金錢，如同天氣的變幻無常般，也好像飛鳥的捉摸不定。其實，我們只要靜下心等待，強勢股票在技術圖形中自然會表態，只要按照規矩買進，上漲多時，日後好消息自會出現。定法定心，遵守紀律操作，金錢自然跟著來。\n\
    \n「等待」是完美作品的必然條件，卻是股票操作的至高心法。俗話說：「錢四隻腳，人兩隻腳。」到處去追明牌，想發財，往往追得筋疲力竭，仍然不可得。其實，股市要賺錢的第一心法就是「股市賺錢是等來的」，因此你一定要遵守以下\
    \ 6 個等待原則：\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_69_0.png)\n\n- 1. 當股票下跌時，不要猜底，要「等」到底底，出現「底底高、不破底」及大量上漲格局時，再考慮做多。\n\
    - 2. 當股票打底突破前波高點，出現「頭頭高、底底高」及多頭往上漲格局時，要「等」到拉回沒有跌破前波低點，再次往上升漲時，再進場做多。\n- 3. 當多頭行進連續上漲時，要「等」到回檔修正後再上漲時，才買進。\n\
    - 4. 遇到盤整時，要「等」到向上突破盤整區上頸線時，才做多買進。要「等」到向下跌破盤整區下頸線時，才做空。\n- 5. 高檔暴大量，不要猜是否頭頭部到了，要「等」到出現「頭頭低」及股價往下跌時，才可以考慮做空。\n\
    - 6. 股價空頭下跌，要「等」到反彈不過前面高點，再下跌時，做空。\n\n股票在進行時，除了上面的買賣位置之外，都是要「等」機會，只要會「等」，總是能夠等到賺錢機會的。\n\
    \n### 【小結論】「確認」是很重要的步驟\n\n操作股票除了訂好交易規則之外，「確認」是很重要的步驟。有一次，幾位股友一起討論股票，其中一位做長波段的鐵大師談到，他做大波段是看月線機會、週線有打底，然後在日線正確位置切入，然後沿著\
    \ 20 週均線操作，在整個操作過程中，每個地方要確認後才會進場。\n\n例如做多，必須月線確認突破下降趨勢線，週線確認打底上揚，日線確認多頭進場位置，他才會進場；比如週線是多頭回\n\
    \n檔、日線呈現 M 頭格局，即使月線、週線都確認是多頭走勢，他還是要等到日線轉成 W 底、確認再度走多時才進場。\n\n一位同學在 2011 年 9 月\
    \ 23 日那天，當晨星（3697）股價下跌，在盤中接近 20 日均線時，認為會像前兩次一樣有支撐，就進場去買，沒想到當天收盤價居然跌破月線，而且第 2 天又一根長黑，只好停損認賠出場。\n\
    \n我們看看這位同學的問題出在哪裡？\n\n問題是他沒有確認就出手，如果他能夠每次都確認之後才出手，就會買在右圖⑪、⑫、⑬、⑭的位置。各位看看，是不是每次都賺錢？所以，千萬不要去猜測股價的支撐何在，要等到確認\
    \ K 線是支撐且再上漲時才出手，你可能無法買到最低價，但是你一定是個贏家。\n\n買賣股票，懂得「確認」是很重要的！多多體會，不要急，不要慌，等到圖形確認再動作，這樣投資股票不是很輕鬆嗎？\n\
    \n> 聖嚴法師法語：「要能放下，才能提起。提放自如，是自在人生。」股市何嘗不是如此，買賣自如，自在股海。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_72_0.png)\n\
