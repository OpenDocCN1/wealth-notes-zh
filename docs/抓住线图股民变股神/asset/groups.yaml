    # 3. 操作時的重要觀念


    +   （1）空頭放空最佳賣點就是前述4個位置。我們在選好股票準備做空之前，必須看日線是否為放空位置點，如果不是，最好等到放空位置時再動作，否則進場容易短期套牢或遭到停損。


    例如做頭沒確認就去空、反彈尚未止漲回跌就去空、盤整還沒有結束就去空、下跌好幾天去追低空，結果造成操作困難而賠錢。


    +   （2）股價跌破前面低點的放空做法，前面說明只有兩個位置：一是頭部盤整完成的跌破確認，一是盤整末端的跌破。


    為什麼行进中反彈後再下跌的跌破前面低點時，不是最佳空點？理由是股價下殺時，往往走一段後因為散戶會認為價低而進場，造成跌多的反彈，所以連跌3～5天之後容易反彈，因此去空在下跌的第3天或第4天，正好處於隨時要反彈的狀況，因此盡量在反彈後再下跌的第一根黑K線去放空，既容易設停損，獲利空間又大。'
