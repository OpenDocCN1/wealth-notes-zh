    # 第 3 篇 第 2 章 波浪型態進階研究 2：底部及頭部的重要反轉型態


    ## 盤面波動型態常見之盤面反轉型態


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_120_0.png)


