    ## 第11章 質量關係的進階應用：高檔爆大量的因應策略


    成交量在技術分析中一直具有重要的地位，其代表的意義不只是交易的數量，更是籌碼與人氣的指標。價量的基本關係在作者第一本書《抓住飆股輕鬆賺》中已有詳細說明，本章就其他重要觀念及應用予以說明。


    ### 一、價是「體」量是「用」


    做股票的目的 是要賺到差價，所以「股價」的變動是「主體」，如果成交量的增減或其他基本面、消息面、技術面的變動不能造成股價的波動，對操作股票來說，那些變動都毫無意義，因此其他都是「應用」。


    所以，我們要先看股價有沒有變動，再看成交量是呈現什麼反應，代表的是什麼意義。例如今天股價一路上漲，收盤上漲 5%，就不必去介意今天成交量有沒有增加或減少？明天股價要是不漲或是下跌，那麼今天的成交量才會出現其背後代表的意義。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_188_0.png)


    ### 二、成交量是判斷趨勢的輔助指標


    不論是多頭走勢還是空頭走勢，在波動的每一階段，成交量都會出現相對應的波動。我們透過走勢圖上面價格與下面成交量的波動關係，推測這些階段的基本方向是否要反轉，因此成交量的變化，在關鍵轉折位置提供了重要的參考訊息。


    這裡再次強調，成交量能夠在關鍵的轉折位置提供重要參考訊息，通常是輔助性質，而非主角，主角是價格的波動，認真專注在價格是否上漲或下跌，同時掌握成交量的變動，才是正確的投資態度。


    ### 三、價與量同樣要看「位置」


    在研究價量關係時，股價目前所處於走勢圖的「位置」，才是重要關鍵。同樣是有價有量，在低檔反轉的位置是主力要發動攻堅的訊號，但是在大漲一段之後，在高檔出現有價有量，這就不要太樂觀了，主力可能拉高出貨，也可能是換手再攻。


    從看下面圖例可以看出，同樣是有價有量，在不同的位置，後續走勢不同。


    台稅(1101) 日線圖 2011/11/24 開 31.80 高 32.80 收 32.50↑ 元 盤 8330 張 +0.75 (+2.36%)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_189_0.png)


    資料來源：富邦e01電子交易系統


    ▲上圖說明：


    - ⑪ 股價走勢在低檔有價有量，為向上攻擊量。

    - ⑫ 上漲一段之後，股價在相對高檔有價有量，則容易拉回整理。

    - ⑬ 盤整後，有價有量，為突破的攻擊量。

    - ⑭ 在高檔有價有量，為出貨量，容易拉回。

    - ⑮ 在高檔下跌反彈，有價有量，反彈不過前面高點而下跌，為再次出貨量，容易反轉下跌。


    ### 四、假說：成交量有時會騙人


    一般人認為，成交量是每天實際交易的數量，是不會騙人的。實際上，純以數字來說，成交量是不會造假的，但是以實質交易的對象來說，就不一定是真實的。


    簡單說，主力在操控一支個別的股票時，大部分籌碼控制在主力手中，這時股價的漲跌就不一定呈現成交量的真實現應。例如在高檔要營造多頭強勢的氛圍，主力可以在甲帳戶掛出，而在乙帳戶買進，如此一來，成交量急劇增加，容易引誘散戶上當去追買。


    前迹說明主力可以營造大成交量，相反的，主力沒有辦法縮小成交量，當市場出現恐慌下跌的時候，主力的買賣只會讓成交量更大，所以在某方面來說，萎縮的成交量更加真貨。


    當投資人對股價看法趨於一致時，成交量會愈少。例如股價上漲到某一價位時，持有股票的投資人認為股價是高點，要獲利賣出，而空手投資人同樣認為股價是高點，不願買進，這時就會造成無量下跌；相反的，當投資人對股價看法愈分歧時震盪愈大，成交量就會愈大。


    ### 五、高檔暴大量，做價商的作崇


    多頭上漲一段基本波過後，出現一個特別突出的大量，可能是即將來臨的反轉訊號，或者是回撤修正的的訊號。


    凡是高檔暴出大量，大多不是什麼好事，在多頭結束的頭部發生前，共同的特徵就是「暴大量」，所以高檔暴大量不能輕忽。

