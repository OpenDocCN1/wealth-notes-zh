    ![](img/e6a266bab53ec29e9cf6f50724f4d142_126_1.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_126_2.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_126_3.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_126_4.png)


    2. 下面盤整型態，哪個容易往上突破？哪個會往下突破？


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_127_0.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_127_1.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_127_2.png)


    上面 3 種盤整型態，左圖會往上突破，右圖會往下突破。我們在觀察盤整後面走勢，如果往盤整區域的 1/2 位置上面發展，股價出量容易向上突破；如果往盤整區域的
    1/2 位置下面發展，股價不必要大量，就可以向下跌破。


    ## 1 從多頭的回檔幅態看股票強弱


    當股票是向上的多頭股票在上漲一段之後都會回檔修正，回檔的幅度只有本波上漲的 0.382 就止跌，繼續往上，為強勢回檔；回檔到上漲幅度的 0.5，為正常回檔；回檔到上漲幅度的
    0.618 或更低，為弱勢回檔。強勢回檔的股票走勢最強，正常回檔的股票次強，弱勢回檔的股票最弱，因此，同樣在走多頭的股票，當然要選強勢的股票進場。


    - 1. 股價回檔至 0.382 左右止跌回升，由於下跌幅度最小，因此上面下跌幅度小，壓力也最小，當往上攻擊時容易過前面的高點，繼續多頭走勢。另外，觀察回檔時的低點，沒有到達前面高點
    H 的支撐就再往上上漲，也是強勢多頭的表現。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_128_0.png)


    - 2. 股價回檔至 0.5 左右止跌回升，由於下跌幅度中等，因此上面下跌幅度造成些壓力，當往上攻擊時，容易在接近前面高點時，稍做盤整消化賣壓後再過前面的高點，繼續多頭走勢。另外，觀察回檔時的低點
    L，接近前面高點 H 的支撐就再往上上漲，也是一般多頭的表現。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_128_1.png)


    - 3. 股價回檔至 0.618 左右止跌回升，由於下跌修正幅度太大，因此上面造成很大套牢壓力，當往上攻擊時，前面高點不容易過，會橫向盤整時間比較長，或再下跌測前面低點支撐。另外，觀察回檔時的低點，跌破前面高點
    H 的支撐才止跌往上上漲，也是弱勢多頭的表现。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_129_0.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_129_1.png)


    資料來源：富邦 eO1 電子交易系統


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_130_0.png)


    科風 (3043) 日線圖 2011/11/23 開 152.50 高 155.50 收 151.50 5元 量 1238 乖 -0.80 (-6.61%)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_130_1.png)


    資料來源：富邦 eO1 電子交易系統


    經過上面的分析，你應該知道要選哪檔股票買進了，不是回檔最多、股價最低的最好，而是強勢最會上漲的最好。


    ## 從空頭的反彈強度看股票強弱


    走勢向下的空頭股票在下跌一段之後反彈，反彈 0.382 就止漲往下為弱勢反彈，反彈到 0.5，為一般反彈；反彈到 0.618 或更高，為強勢反彈。弱勢反彈的股票走勢最弱，正常反彈的股票次弱，強勢反彈的股票最強。因此，同樣在處於多頭的股票，當然要選最弱勢的股票做空。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_131_0.png)


    - ⑪ 強勢反彈：反彈到 0.618 再拉回到 0.5 有撐再向上，容易過 H2 高點。

    - ⑫ 一般反彈：反彈到 0.5，拉回做「底底高」是一個買點，回到 0.382 處，容易有支撐。

    - ⑬ 弱勢反彈：反彈 0.382，拉回容易再破 L2 底。


    經過上面分析，您應該知道要選哪支股票放空了，不是反彈最多、股價最高的最好，而是弱勢反彈最會下跌的最好。


    ## 波浪型態的角度與幅度


    我們觀察走勢圖時，除了波浪型態之外，走勢的角度與幅度，也透露出股票的強弱。


    - 1. 上漲角度愈大的股票愈強


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_132_0.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_132_1.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_132_2.png)


    - 2. 下跌角度愈大的股票愈弱


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_132_3.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_132_4.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_132_5.png)


    當大盤處於多頭格局時，大部分的股票都會上漲，這時要選擇上漲角度大的股票操作，因為，市場總是呈現「強者恆強、弱者恆弱」局面。


    因此，遇到股市大多頭時，要記得一定要挑強勢盤股操作，不但獲利大，而且時間短，不要做大型權值股，雖然會漲，總是慢慢的爬升。大盤下跌時，大部分的股票都在下跌，這時要選擇下跌角度大的股票放空，獲利快速。


    - 3. 上漲幅度漸大的股票愈好


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_133_0.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_133_1.png)


    上圖同樣角度上漲的股票，B圖比較好，因為觀察每次上漲的一段，A圖的❉<❉，B圖的 ❉ >❉。A圖的上漲幅度，後面比前面小，代表愈往上，走得愈短，多頭氣勢變弱，第
    ❉ 段漲勢容易結束，或者走不遠就要盤整了。B圖的上漲幅度，後面比前面大，代表愈往上，走得愈強，多頭氣勢更強，第 ❉ 段上漲幅度會更大，或者上漲的角度會變更大的急漲飆升。


    # 第四章 波浪型態進階研究：用過線控管依日線進場的風險


    在日線看到進場機會時，要看過線的方向及是否接近壓力，即使進場，也要做好風險控制。


    ## 用日線進場要注意的風險


    當你依股票日線看到進場點時，如果看到過線接近到壓力區，這種情況下股價容易遇壓回檔修正，因此如果進場後走勢不如預期，可以暫時出場，等待下次的進場機會。


    日線：看到多頭回檔修正後再上漲的買點，這時要去看一下過線目前的位置如何，如果接近壓力區，容易對股價多頭走勢造成阻力。


