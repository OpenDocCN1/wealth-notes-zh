    # 第一章


    # 想賭股票致富 進場前你必須做新的準備


    一般人總把股票交易看成是一件很簡單的事，認為只要在低價時買進、高價時賣出，不就成了。因此，總是很輕率的就投入資金，等到手上持有股票時，才發現股價上上下下，跌了要不要賣？漲了要不要跑？不知道如何是好。


    我們拿錢投入股市，如同投資其他事業一樣，要認真面對他，如果漫不經心，沒有整體規畫及策略，那麼一定會損失大筆金錢。


    其實，幾千年前的《孫子兵法》第一章「始計篇」中強調的「廟算」觀念，即說明了同樣的道理。孫子說：「夫未戰而廟算勝者，得算多也；未戰而廟算不勝者，得算少也。多算勝，少算不勝，而況於無算乎？吾以此觀之，勝負見矣。」


    孫子的意思是指，作戰之前，就預計可以打勝戰的一方，是因為在開戰前就已經分析過敵我的利弊條件，制定作戰攻防策略、籌劃周密的结果；作戰之前，就預計無法打勝戰的一方，則是因为在開戰前就欠缺戰勝條件、籌劃不夠周密的结果。作戰之前，條件具備、籌劃周密、策略完備的一方就能夠取勝；'
  - '[PAGE 88]


    條件不全、籌劃不周、策略錯誤的一方，就無法取勝，更何況是不做準備、沒有籌劃、毫無條件、沒有策略的人呢？


    股票市場就如同戰場，不瞭解敵人（市場），沒有經過準備訓練，又沒有做事先的評估，計算獲勝的機率，毫無章法就進場投入資金，無非是飛蛾撲火，屍骨無存，不可不慎！


    # 從學習到操作股票的完整流程


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_88_0.png)


    # 進場前 你該學習的專業知識


    做股票要學的專業知識很多，但是一定要先學會以下基本的重要知識：'
  - '[PAGE 89]


    # 1. 股票投資基本入門常識


    投資股票前一定要先了解什麼是開戶、買賣股票、交割集保、本益比、股票淨值、殖利率、股票分類、融資融券、上市上櫃、面值、市值、手續費、證交稅、違約交割、全額交割、市價限價、當日沖銷、除息除權等股市基本常識。


    # 2. 完整的技術分析專業知識


    技術分析是進入股市的基本專業知識，如同在學校所讀的教科書，任何人只要花時間用功學習，都能學會。技術分析是基本功，具有完整的技術分析能力，基本上，你已經可以判斷一支股票的好壞，但是這並不代表你真的能夠賺到錢，如同大學畢業後，不代表進入社會就會從此一帆風順。


    我在這裡特別強調「完整」兩個字，現代社會資訊發達，投資人都懂一些技術分析。問題是，大多數人只是知道一些片面的技術分析，就拿來分析研判，結果當然常常失敗。


    例如，上漲有量，追買力道強，可以買進股票，事實上一定是這樣嗎？如果沒有對股價位置、均線變化、K線型態、走勢方向、籌碼數量、指標現象等有完整的綜合考慮，就會經常判斷失誤，進場操作失敗。


    完整的技術分析包括：1.波浪型態、2.K線強弱、3.均線切線、4.價位關係、5.MACD、RSI、KD等指標，其中前4項，我稱為技術分析的「四大金剛」，在我的第一本書《抓住飆股輕鬆賺》中有詳細的介紹，讀者可以參考。


    # 3. 研究基本面的專業知識


    例如解讀公司的財務報表、財務結構、營運方向及未來發展'
  - '[PAGE 90]


    等等。


    # 想要靠股票致富的聰明方法


    很多人都會問：「做股票真的有賺錢的方法嗎？」答案是「有的」。


    早在1983年，美國芝加哥知名交易員理查·丹尼斯（Richard Dennis），當時他37歲，已經用幾百美元賺到數百萬美元。他認為，賺錢的操盤員不是天生的，只要經過適當的訓練，任何人都能學會如何交易。丹尼斯本身就是用技術分析操作的成功交易員。


    當時他的合夥人威廉·艾克哈特（William Eckhardt）並不同意丹尼斯的看法，艾克哈特認為，投機操作的能力是一種天生的感覺、主觀、直覺的天賦。


    為了證明各人的論點，他們倆在1983～1984年做了一個實驗，招募各行各業各個階層，不同年齡、學歷、生長背景的一群有意願學習交易的學員，花了兩個星期教導他們所需要知道的商品知識，以及一套簡單、易於遵守的交易規則，完成課堂學習指導之後，每個學生都分配到100萬美元資金以供交易。其中，許多學員每年獲利可達100%甚至更高。


    這個出名的實驗訓練，就是後人眾所周知的「海龜特訓班」。丹尼斯的實驗證明，在一切條件相同下，任何人都能學會股市賺錢的方法！


    每個投資人都有一套自己操作的方法，有些人憑感覺買股票也能賺錢，有人做當天沖銷賺錢，有人用基本面財報賺錢，'
  - '[PAGE 91]


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_91_0.png)


    有人等大機會做波段賺錢，方法百百種，能夠賺錢的就是好方法，怕就怕沒有方法就到股市亂衝，頭破血流事小，粉身碎骨也不意外。


    所以，一定要先學會幾種操作股票的方法，再到戰場練兵，本書第4篇介紹多種不同的操作方法，讀者可以選擇適合自己個性的方法，先用小錢（10萬元就夠了）開始練習，在實際操作中去感受，再用實際經驗去做修正，慢慢找到你可以信任的賺錢方法。


    # 培養操作功課必備的7種能力


    在股票操作過程中要具備一些能力，這些能力的強弱，直接影響操作績效的好壞。所以，我們一邊操作，一邊要在操作實際經驗中提升以下7種能力：


    +   1. 看圖選股的能力


    選股的能力不是單純指技術分析，技術分析固然可以幫助我們研判圖形的走勢，但是一些實務上的經驗，更能提高判別的準確度。例如，圖形無法看出這檔股票是否為主流類股，圖形無法知道股票的基本面，所以公司基本面、產業未來發展情形、當下主流股、熱門題材等等這些都是選股的能力範圍。


    看圖的能力是可以經由不斷的練習來提升！俗話說：「熟能生巧」，如同跳舞一樣，基本的舞步不純熟如何能夠跟上音樂？如何顧到姿勢？如何變換花式？更不可能做到行雲流水的動作了。


    +   2. 執行停損的能力'
  - '[PAGE 92]


    「停損」只有兩個字，能夠做到，可是一項不容易的能力，因為沒有經過一段時間的毅力、決心的訓練，一般凡人是很難每次都做到的，偏偏執行停損的能力是古今中外，任何成功投資者的必備條件。


    要在股市生存，一定不能大賠、慘賠到重傷不起，股市做到小賠的唯一方法只有「停損」這兩個字。股市中再大的風險，只要執行停損都能夠避開，這項「執行停損」的能力，就如同車子的煞車系統，不能沒有。


    # 3. 果斷停利的能力


    我們到股市投資，當然不是來停損消費或娛樂的，投入股市的目的是為了「賺錢」，操作的重點正在此處。無論要賺「大錢」或「小錢」，都要具有「停利」的能力。不會「停利」，如同入竄山，空手而回，難怪股市中說：「會停損是徒弟，會停利才是師傅。」


    許多人會選股、會停損，可是仍然覺得很難賺到錢，原因是欠缺「停利」的訓練。我追隨李大師學習的兩年期間，他曾經在技術分析教室告訴我們，停利要「狠」。該貪的時候要貪，不該貪的時候不能貪，到達獲利目標，在技術分析出現該賣的訊號，或者出現自己紀律交易的出場條件，就要狠狠的賣出股票，獲利入袋。


    「停利」有兩個重要的意義，第一當然是讓獲利入袋，第二是「避險」。該賣出卻不賣出，非但獲利被吐回（這就是賺不到錢的原因），如果行情是反轉，反而要賠錢。因此，沒有「停利」能力，在股市中是難以賺錢的。'
  - '[PAGE 93]


    # 4. 反敗為勝的能力


    固然「勝敗乃兵家常事」，股市中只有贏家與輸家，要成為長期的贏家，就必須要具備「反敗為勝的能力」。


    股市變化理由錯綜複雜，再厲害的高手也難免馬失前蹄，對瞬息萬變的股市要具備應變的能力，如果掉到敗部，必須能夠反敗為勝。


    例如2011年11月下旬，台灣股市低迷不振，大多數股票處在下跌的空頭，手中持空單的人很多，在11月30日晚上，中國突然發布調降存款準備率2碼，國際股市應聲大漲，美國道瓊指數更是大漲490點，這樣的突發性經濟利多，當然會立刻反應到第2天台股的走勢，這時必須採取斷然措施立刻回補空單，千萬不能漠視不管。


    股票「反敗為勝」最重要的方法就是「汰弱換強」，汰弱只是止血，還要「換強」才能反勝，當手上股票弱勢或賠錢時，要立刻「汰弱換強」。


    # 5. 操作短線或波段的能力


    股市賺錢終究是靠操作，同一檔股票，會操作與不會操作的结果差很多，由於市場的環境不會一成不變，所以要有短線操作的能力，當波段獲利的機會來時，要有操作波段的能力。本書第4篇分別介紹多種操作方法，當然讀者要自己經過實際操作，才能靈活應用。


    # 6. 守株待兔的能力


    讀者可能會認為「守株待兔」就是等待機會而已，哪裡需要什麼能力？如果你也這樣想，那可就大錯特錯了！守株不一定'
  - '[PAGE 94]


    # 第 2 篇


    第 1 章 想用股票致富 進場前你必须做好的準備


    就能等到兔子，看到兔子不一定就能抓到。


    守株待兔的能力就是鎖股追蹤的能力，鎖對股票，機會出現，要有勇氣立刻抓住進場的時機進場。


    # 7. 檢討改進的能力


    每一次的交易都是寶貴的經驗，對初學的投資人來說，每次交易無論賺或賠都要把圖印出來，把當初進場的理由、採用的策略、操作的過程、賣出的理由一一寫下，並且檢討這次的心得，不要嫌麻煩，這是自我成長進步的重要功課。


    以上每項能力都很重要，每天能夠要求做到，日積月累，自然能夠提升股市賺錢的功力。


    # 8. 做好情緒管理


    學習的最後一項，也是最難的一項，就是情緒管理。偏偏情緒又是決定操作成敗的關鍵，無法控制情緒，即使有很好的技術，也無法發揮，像曾雅妮打高爾夫球、王建民投球，臨場的抗壓、心情的起伏，絕對會影響比賽時的表現。


    人是情緒動物，任何人都会受到心理面的影響，我們要設法控制自己的情緒，使它的影響降到最低。


