    # ## 2. 多頭上攻階段


    **[經驗]** 在初漲期，跌深績優股或權值股會先開始表態，且利空鈍化，這時大盤剛突破底部盤整，成交量明顯放大，但是仍有部分弱勢股仍處於未跌段續跌的格局。


    +   **[經驗]**（1）在初升段，選擇物超所值的績優股，採取「價值型投資」策略，選取本益比低、殖利率高的股票，做定存式買進。'
