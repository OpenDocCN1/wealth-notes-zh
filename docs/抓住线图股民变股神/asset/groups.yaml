    幅大致都有10%以上，第1天買的人開始短線獲利賣出，股價自然要休息或回檔整理了。


    技術面可以看出第1天上漲的型態位置，是否符合買進的機會。如果是很好的買點，當然不會猶疑，立刻買進，如此買在低點，風險小，獲利機會高，當股票漲上去，別人追高時，你正可擇機賣出，獲利輕鬆入袋。


    # 3. 不知盤整是「整你盤」


    散戶賠錢的第3個原因是股價在盤整區上下震盪，仍然在買進賣出操作。盤整盤又稱「整理盤」，意即「整你盤」。散戶要不是看不出股價在盤整區，就是受消息面影響一直想操作這檔股票，結果不是兩頭被扒，就是資金套在盤整中。如果遇到一盤兩個月，鬥志消減殆盡不說，盤整結束是往下跌破，那可還要再賠大錢呢！


    我們從技術面可以看出股價是否進入盤整，這時可以退出休息，或者把資金挪去買其他上漲的股票，等到該股盤整結束，往上或往下，方向明確時再來做它，不是很好嗎？


    # 4. 不會停利


    散戶賠錢的第4個原因是，買到一檔上漲的股票，到高檔該獲利了結時，因為貪婪而捨不得賣出；當股價回跌時不甘少賺，心想等到漲回上次高點時再賣出，結果股價一路往下，該賺的沒賺到，反而倒賠。


    不會停利是因為不知道哪裡是高點，如果用技術分析，可以知道是否是高檔？是否出現賣出訊號？主力是否在出貨？自然就能夠即時脫的股票，賣到相對的高點。'
