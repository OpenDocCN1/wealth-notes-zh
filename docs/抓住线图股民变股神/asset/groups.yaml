    - 3. 第2次符合向上突破下降切線及高點的進場條件，買進。\n- 4. 做到第2段飆漲。\n- 5. 修正2天，股價又向上突破高點，抓住續勢機會，立刻買進，但是後面幾天沒有如預期上漲，會停損1次。\n\
    - 6. 第2次符合向上突破下降切線及高點的進場條件，買進。\n- 7. 股價再度突破回檔盤整的上頸線，為加碼點。\n- 8. 做到第3段飆漲。\n- 9.\
    \ 跌破上升切線，出現黑K線，出場。\n\n# 第章\n\nV形及倒V形反轉就是股票急速下跌後，突然出現一日反轉急速向上涨，或是股票急速上漲後，突然出現一日反轉急速向下跌，雖然這種情況並不是經常出現，可是每次出現都會在3～5天內出現很大的漲幅或跌幅，如果能夠掌握這種機會，就能夠快速賺到不錯的利潤。\n\
    \n以下說明V形、倒V形反轉戰法的重點：\n\n# 戰法優點：\n- 1. 規則簡單清楚，容易執行。\n- 2. 操作成功機率高，能夠快速獲利。\n- 3.\
    \ 看到急跌或急漲時，鎮住等一日反轉機會。\n- 4. 適合一般中、小額資金操作。\n\n# 基本功力：\n熟練技術分析的「四大金剛」，執行能力要100%，絕對遵守操作紀律。\n\
    \n# 操作目標：\n條件明確時，快速賺取一段急漲或急跌的利潤。\n\n# 交易條件：\n- 1. 完全以技術面操作，屬於逆勢交易。\n- 2. 以日線操作，專門鎖住急跌急漲或乖離過大的股票。\n\
    \n# 二、做空頭出現急跌時的發現及買法\n\n由於V形及倒V形反轉的速度很快，許多投資人常常無法在第一時間發現及介入，因而錯失賺錢的機會。\n\n事實上，只要瞭解它的特性，知道如何操作，大膽進場，果斷出場，要賺這種小飆一段的利潤，實非難事。\n\
    \n以下提供當空頭出現急跌時的操作定法：\n\n**買進** 一定要同時符合下列條件才可以買進。\n- 1. 出現連續重挫急殺3天或3天以上的長黑K線或跳空跌停。\n\
    - 2. 下殺出現暴大量的情況。\n- 3. 當天出現下列K線上訊號：\n    - 開低走高的長紅K線。\n    - 長下影線的紅K線或黑K線。\n \
    \   - 長下影線的十字線。\n    - 股價當天跌破昨日低點後，收盤時上漲突破昨日高點的吞噬紅K線。\n\n- （4）具備以上（1）至（3）項條件，以下兩個位置可以買進：\n\
    \    - ⑴ 積極型投資人：在當天收盤前出現（3）項K線上漲訊號，可以立刻搶進。\n    - ⑵ 穩健型投資人：次日開盤向上，突破下降急切線或股價突破昨日高點的紅K線時，可以立刻買進。\n\
    \n**停損** 停損點設在進場K線的最低點，最多不超過7%。\n\n**續抱** 股價未跌破上升急切線，續抱；或股價未跌破前日K線低點，續抱。\n\n**出場**\n\
    - （1）跌破上升急切線，立刻出場。\n- （2）出現黑K線，出場。\n- （3）收盤跌破前一日K線低點，出場。\n- （4）股價跌破3日均線時，出場。\n\
    \n**當多頭出現急漲時的抱操作定法**\n\n**放空** 一定要同時符合下列條件才可以放空：\n- （1）出現連續大漲急拉3天或3天以上的長紅K線或跳空漲停。\n\
    - （2）上漲出現暴大量。\n- （3）當天出現下列K線止漲訊號：\n    - ◎ 開高走低長黑K線。\n    - ◎ 長上影線的紅K線或黑K線。\n\
    \    - ◎ 長上影線的十字線。\n"
