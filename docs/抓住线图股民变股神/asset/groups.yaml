    - ⑫ 前一日出現大量急跌，今日拉出紅K線過昨日K線的高點，確認，可以搶反彈。\n\n我們在多頭回檔要買進股票的機會，是當回檔不跌、股價再向上上漲時才買進，為什麼要等到再上漲時？這就是等確認沒有跌破前面一天的低點。\n\
    \n同樣的，股價跌到支撐位置，要等到不跌再上漲時，才能確認\n\n### 股市賺錢的最高心法：等、確認、集中火力、學到做到\n\n認這個位置是有支撐的；多頭趨勢沒有改變前，不能自認為多頭趨勢結束，除非波浪型態經確認出現「頭頭低、底底低」格局時，才可以說趨勢改變。\n\
    \n### (二) 集中火力，才能操作\n\n分散風險好？還是集中風險管控好？這是每個投資人都會想的問題，這要回到你投入股市的目的是什麼，如果是作為長期投資，自然是分散風險較好，股票應該只是投資理財的一個選項，其它可以分散投資在不動產、基金、黃金等工具上。\n\
    \n如果你的資金不多，只是投入股票市場，希望能夠獲取高報酬，那麼就要集中火力，把雞蛋放在同一個籃子裏，全心全意地照顧好，如此才能達到高利潤的目標，原因如下：\n\
    \n- 1. 分散風險同時也會抵銷利潤\n\n    許多人覺得好股票太多，這個也買，那個也買，手中持股 10～20 檔，實際上，股票走勢不會都一樣，結果有的漲，有的跌，到最後，賺到的被跌掉的給抵銷掉了。\n\
    \n- 2. 同時持有多檔股票難以兼顧\n\n    當手中持股 10～20 檔，每天收盤後每檔股票的功課都做不完，盤中還要兼顧那麼多檔股票的漲跌，往往顧此失彼，要是遇到什麼大的變動，恐怕要緊急處理都來不及。\n\
    \n- 3. 持股 3～5 檔，專心操作\n\n    精選有題材、有趨勢、有發動的強勢股票買入，持股不超過 5 檔，集中火力及專注每一檔股票的走勢變化，更能隨時果斷執行停損及停利。\n\
    \n4. 汰弱換強，以保持獲利\n\n    手中永遠留著正在上漲的股票，盤整不漲或下跌的股票要換掉，保持利潤的延續性。\n\n### 學會以下操盤 EQ\
    \ 過 4 關\n\n- 第 1 關：起漲的買點\n    - ◎ 具備看圖正確選股的能力，清楚知道是否為正確的買進位置。\n    - ◎ 具備「敢不敢」的執行力，機會來了要敢買，猶豫不決，機會稍縱即逝。\n\
    - 第 2 關：停利的賣點\n    - ◎ 急漲時要抓住最佳賣點，本書後面篇章都有詳細說明。\n    - ◎ 遇歷不漲時，停利。\n    - ◎ 停利要「狠」。不該貪時，要捨得出場，才能保證獲利入袋。要記得！會賣才是師傅。\n\
    - 第 3 關：等殺低買點\n    - ◎ 第 2 關高檔停利之後，才能找殺低買點。\n    - ◎ 情緒快樂：在高檔停利賣掉的人，等殺低後找買點輕鬆買回，立於不敗之地。\n\
    \    - ◎ 情緒掙扎：第 2 關沒賣的人，殺低會想停損，每次耐不住就殺在最低點，常常會陷入追強勢股但是賺不到錢的困境。\n- 第 4 關：出現頭部結束\n\
    \n    出現高檔暴大量、量價背離、多頭不過前波高點、K 線反轉、均線死亡交叉等 5 種現象，拍拍屁股走人。結束多頭操作。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_75_1.png)\n\
    \n賺錢的關鍵是要會停利，不賠大錢的關鍵是要執行停損。\n"
