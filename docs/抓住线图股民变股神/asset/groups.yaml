    # 5. 沒有耐心


    散戶賠錢的第5個原因是沒有耐心等待，隨隨便便就投入資金，憑感覺喜好或聽消息就介入，結果不是被套牢，就是賠錢出場。


    在技術分析圖上，可以清楚知道何處是好的買點，當買點沒有出現時，要耐心等待，千萬不可浪費子彈（資金）。


    # 6. 沒有定法


    很多散戶操作雜亂無章，一會兒想買，一會兒想賣；不知道為什麼要買，不知道為什麼要賣；賺了一點點就跑，賠了一大截卻死抱活抱。如此沒有定法，賠錢是必然，賺錢是運氣。


    技術分析最重要的一項功能，就是可以訂定出一定條件下的交易規則，有了固定的交易規則，自然要比不切實際的胡思亂想操作的成功賺錢機會大得多。本書第4篇介紹的「長短線操作戰法」，特別介紹多種長短線的操作方法給讀者參考運用。


    經營股票市場 最好的基本事業


