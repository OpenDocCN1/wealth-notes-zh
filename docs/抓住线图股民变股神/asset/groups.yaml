    回檔的股票次強，弱勢回檔的股票最弱，因此，同樣在走多頭的股票，當然要選強勢的股票進場。


    +   1. 股價回檔至0.382左右止跌回升，由於下跌幅度最小，因此上面下跌幅度小，壓力也最小，當往上攻擊時容易過前面的高點，繼續多頭走勢。另外，觀察回檔時的低點，沒有到達前面高點H的支撐就再往上上漲，也是強勢多頭的表現。


