    # 作者◎朱家泓


    民國74年進入股票市場，股市經歷26年。前22年，在股海中浮浮沉沉，始終賺少賠多；6年前，他從最基本的技術分析學起，運用飜股戰法及股票獲利目標管理法，達到每年賺1倍的目標，飲水思源，基於感恩當初良師傾囊相授，他才得以頓悟股市操盤方法，因而把技術分析教學內容編書出版，希望幫助想學好股票操作的有緣人。


    學歷：

    中芷理工學院


    經歷：

    職業軍人22年（上校軍官退休）

    禮品印刷公司負責人（已結束）


    現職：

    股票專業投資人、

    「飜股學堂」股票技術分析專業課程講師、

    《Money錢》雜誌技術分析專欄作者、

    「理財學苑」股票學課程講師


    著作：

    《抓住飜股輕鬆賺》


