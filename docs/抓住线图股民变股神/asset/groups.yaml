    # (二) 集中火力，才能操作


    分散風險好？還是集中風險管控好？這是每個投資人都會想的問題，這要回到你投入股市的目的是什麼，如果是作為長期投資，自然是分散風險較好，股票應該只是投資理財的一個選項，其它可以分散投資在不動產、基金、黃金等工具上。


    如果你的資金不多，只是投入股票市場，希望能夠獲取高報酬，那麼就要集中火力，把雞蛋放在同一個籃子裏，全心全意地照顧好，如此才能達到高利潤的目標，原因如下：


    +   1. 分散風險同時也會抵銷利潤


    許多人覺得好股票太多，這個也買，那個也買，手中持股 10～20檔，實際上，股票走勢不會都一樣，結果有的漲，有的跌，到最後，賺到的被跌掉的給抵銷掉了。


    +   2. 同時持有多檔股票難以兼顧


    當手中持股 10～20檔，每天收盤後每檔股票的功課都做不完，盤中還要兼顧那麼多檔股票的漲跌，往往顧此失彼，要是遇到什麼大的變動，恐怕要緊急處理都來不及。


    +   3. 持股 3～5檔，專心操作


    精選有題材、有趨勢、有發動的強勢股票買入，持股不超過 5檔，集中火力及專注每一檔股票的走勢變化，更能隨時果斷執行停損及停利。'
