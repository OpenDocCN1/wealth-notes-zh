    # 4. 趨勢線的斜率強度


    趨勢線的上升斜率（角度）愈大，表示上漲強度愈強。趨勢線的上升斜率（角度）愈大，維持的時間愈短。


    趨勢線的上升斜率（角度）45度是價格與時間的平衡斜率。如果趨勢線斜率過大，表示上漲太快，趨勢難以持久，此時容易跌破上升趨勢線而回檔，回檔修正後的上升趨勢線會向45度斜率靠近。趨勢線斜率過小，表示上漲強度較弱、上升的趨勢不太可靠，此時最好等到上升趨勢線斜率改變，上升趨勢明朗時再介入。


    下降趨勢線的斜率（角度）45度是價格與時間的平衡斜率。如果趨勢線斜率過大，表示下跌太快，趨勢難以持久，此時容易突破上升趨勢線而反彈，反彈後的下降趨勢線會向45度斜率靠近。趨勢線斜率過小，表示下跌強度較弱、下跌的趨勢不太可靠，此時最好等到下降趨勢線斜率改變，下跌趨勢明朗時再介入。


