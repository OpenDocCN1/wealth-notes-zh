    # 均線糾結在操作上的應用


    移動平均線是平均成本的概念，因此當多條不同時期的均線糾結在一起，具有重要的意義。在實際操作中，均線糾結是觀察進場的機會。


    如果短、中、長期的5日、10日、20日均線糾結在一起，表示這些時期買股票的平均成本都差不多，因此，愈長期均線糾結，股價橫向盤整的時間愈長，累積的持股能量愈大。


    當股價往上突破上漲，短期均線最先反應向上，然後中長期均線依序上揚，造成均線上揚的多頭排列，形成強勢上漲的態勢。因此，一旦發現盤整中出現5日、10日、20日均線這3條均線糾結的股票，要抓住向上突破的買點；相反的，如果向下跌破，立刻產生多條均線空頭排列，也是抓住做空的機會。


    當多條均線多頭排列時，股價向上走勢中，回檔修正一段時間後再次出現3條均線糾結，並且出現向上紅棒（紅K線）時，是另一個進場的好時機，要把握賺錢的機會，買進。


    均線糾結的向上紅棒是起漲的開始。

    均線糾結的向下黑棒是起跌的開始。'
