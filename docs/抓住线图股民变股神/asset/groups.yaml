    # 5. 多頭反轉


    +   ◎ 定義：多頭上漲一段後出現「頭頭低」之後，又出現跌破前面低點，呈現「底底低」格局。


    +   ◎ 動作：符合空頭型態，思考做空，「等到」反彈不過前面高點，再往下跌時，做空單賣出。


