    # 我的經驗談①

    ## 相信技術分析

    ### 你也能成為股神！


    我，當了22年的股市菜鳥，在57歲的年紀才開始學技術分析，歷經3年克服人性弱點，在60歲時加倍收割，2009年、2010年股市操作每年獲利都能達到1倍的目標。


    當不少投資人才剛擺脫2008年金融海嘯險遭，卻又在2011年歐債風暴再次被燙傷時，我因為篤信技術分析會領先基本面，得以躲過歐債風暴。


    相信技術分析要像信「神」一樣！回想台股自2011年2月8日高點9220點開始連4天出現長黑日K線，讓我看到大盤多頭行情結束的徵兆；2011年6月10日，台股技術線型呈現三重頂頭部型態，令我再次確認多頭行情已經結束，因而得以及早降低手上的持股部位到最低，避免虧損，並且反多為空，跟著趨勢操作獲利。


    現在，來上我講授技術分析課的同學，場場爆滿，連走道上都排滿座位，擠得水洩不通；有人甚至從美國特地請長假回來上課，有人則每周從台中、桃園坐高鐵來上課；即使是技術分析基礎課程，有人一上就是2遍、3遍，甚至5遍以上，希望能邁向股票操作的致富之路。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_8_0.png)


    資料來源：富邦e01電子交易系統


    △上圖說明：


    1.  2011年2月8日大盤出現1636億元大量，加權指數創下9220點新高，收盤為下跌的長黑K線，是高檔轉折的訊號。

    2.  自2011年2月8日起，出現連續下跌4天長黑K線，跌破前面兩個底，是高檔吞噬的頭部型態。

    3.  之後大盤出現「頭頸低」下跌的局面，跌到2011年3月15日的8070點，共下跌1150點。

    4.  在2011年4月至6月反彈到高點，出現9099點、9082點、9089點的三重頂頭部型態，自2011年6月10日當天的長黑K線起，開始長達半年的下跌走勢，後來跌到2011年12月19日的6609點，一共下跌2228點。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_9_0.png)

    ![](img/e6a266bab53ec29e9cf6f50724f4d142_9_1.png)


    不過，在我過去27年的股市生涯中，前面的22年就如同大多數賠錢的股市朋友一樣，始終在追逐賺錢的方法，而忽略了「定心」的修養，因此，總是賺少賠多、賺多賠更多。


    直到6年前，我徹底覺悟到以前的股票投資觀念及做法一定不對，否則為什麼一直在失敗的路上輪迴？因此，我下定決心一切從零開始，毅然決然結束自軍中退休後獨自經營13年的印刷禮品公司，同時，到好友李大哥介紹的教室上課，一切從頭自技術分析的根基開始學起，經過整整一年的全心投入學習，終於能夠「跳出海面」，看清市場的波浪走向。


    離開教室後，因緣際會遇到「李大師」，聆聽他兩年的教導，學習他操作股票的風範。記得有一次，他說，如果自己操作錯誤賠錢，要站在電腦面前（現在都是用電腦下單）向圖形鞠躬認錯，並且檢討自己錯在哪裏？是該停損沒有停損？該買進沒有買進？該賣出沒有賣出？該等待沒有等待？還是該休息沒有休息……


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_9_2.png)


    對於上過的技術分析課程內容，我記得教導過我的老師所說的每一句話，同時自己慢慢建立了贏家必備的習慣。


    就像影印一樣，我都把所學的技術分析圖形深深地複製在腦海裡，同時進行圖形練習，台股的10年日線圖，每根K線，我都一根一根看，至少看過2遍以上；我會把各種多頭、空頭、盤底、頭部型態圖，全部背起來，背到不會忘記為止；而且，我養成了每天寫股票日誌的習慣，藉此持續掌握盤勢的感覺，再以技術分析為主軸，搭配基本面及題材面，進一步形成決策來操作股票。


    除了用上述的做法抓住線圖，我還搭配固定資金操作的安全投資措施，每年以賺1倍為目標，雖然2011年股市因歐債風暴關係，在股票操作的獲利不及1倍，但所採取的多空雙向操作策略，也讓我擁有約有4成的獲利。


    現在，除了每天該做的功課之外，晚上就寢上床之前，我都會坐在床邊，直立背脊，全身放鬆，兩手輕放在雙腿上面，輕閉雙眼，慢慢的、均勻的呼吸，讓一天忙亂的思緒沉澱下來，讓自己能夠回復原始的無我，用平靜的心結束今天，用平靜的心入夢，用平靜的心迎接明天。


    每天，我都用感恩的心面對股市，為自己的努力付出鼓掌，我堅信「天助自助者」，當你下定決心去做時，你會發現，前面一直有路可以走下去，只要持續努力，幫助你的貴人也會出現，相信自己，你就會看到奇蹟！


    # 我的經驗談②

    ## 要成為股市贏家

    ### 須做到4個「一定」


    最近有位年近60歲從美國回來的朋友問我，他從來沒有做過股票，現在想學，他問我可以嗎？


    我告訴他，當然可以！學習股票沒有年齡限制，沒有性別限制，沒有學歷限制，沒有貧富限制，沒有職業限制，任何人都是可以學，有些人反應快，吸收快，用功的時間比較多，比較快學懂技術分析。有些人可能學習比較慢，但是多學幾遍，一樣可以學會。


    一些投資朋友學了一大堆的理論、技術分析、指標、財務報表、操作戰法，可是操作績效卻始終不理想，檢討其中原因是，學到，但是沒有做到。


    由學習到使用，由使用到熟練，由熟練到精通，由精通到爐火純青，這些進階的過程都要付出努力和堅持，學習只是開始的第一步而已，在往後的股市路上，不要忘記自己所學的東西，把知識融入操作之中，才能真正發揮知識的力量。


    我們經常聽到或讀到股市前輩告訴我們要守紀律，紀律是我們學到的知識及經驗，然後有系統的整理出一些股市進出場的條件，依據這些規則，能夠讓我們在操作股票時不會雜亂無章、摸不到頭緒，不會受到一時情緒反應的影響，能夠嚴格遵守紀律，就是學到做到的最佳表現。


    ## 操作穩定及心法 散戶獲致穩定致勝


    許多投資人長期學習技術分析，尋找致勝操作方法，可是一直浮浮沉沉股海之中，無法掌握到賺錢的訣竅，所以覺得在股市中沒有陣亡就萬幸，要賺錢難若登天，其實，問題是出在你那顆「不稳定的心」。為什麼你的心無法安定？只因你一直身陷在股海當中，如果不能「跳出海面」，站在雲端高點綜觀全局，如何能看清前波後浪的起起伏伏？


    2012年12月31日星期六上午，我到「飆股學堂」授課，當天是歲末最後一天，報紙大幅報導「2011年買台股 每人賠掉57萬元」，我問同學是否有人賠這麼多，結果真的有學員舉手，我請他們自己說明原因，大多是沒有遵照技術分析的方法去買賣，不是進場位置不對，就是方向不對，或是沒有立刻停損。總之，就是操作沒有定法。


    如果，你以往操作股票一直賠錢，當然是有一些操作概念錯誤、操作方法不對、操作紀律沒有遵守執行的結果，想要成為贏家，必須自己經過徹底的檢討改進，才有可能達成夢想。


    股票市場要能夠長期穩定獲利，是需要長期的自我訓練及自我約束的，說得更明白一些，能否成為股市贏家，一切關鍵在你自己。


    任何事業要成功，都要經過許多的考驗，投入股票市場也不例外，除了基本的專業知識之外，還要具備超高的EQ管理能力，同時還要具備比常人更強的自制力與堅持力，具體歸納必須做到下面4個「一定」：


    **1. 一定要「充分學習」**


    我有位學生，從未學過任何股票的知識，一開始就投入3000萬元買股票，沒多久就賠掉500萬元，這時他才驚覺到股票不是想像那樣容易賺錢，經由朋友介紹到我講授技術分析的教室上課，他從最基本的技術分析學習，並且認真閱讀各種有關股票投資的書籍。


    經過一年的努力，現在，他已能掌握大盤及個股走勢方向，也懂得運用技術分析作為操作依據，不再憑空去猜測，雖然，他目前還不能賺大錢，但是已經知道控制投資風險，選出強勢股順勢操作，並建立了自己的操作模式，一步一步向贏家的目標邁進。


    想要成為股市贏家，你要學習以下的專業知識：


    *   看懂圖形走勢方向的能力，能夠研判大盤、個股的走勢，在選股操作不會做錯方向而蒙受重大損失。

    *   技術分析中的K線、均線、趨勢線、成交量要徹底學通，並且要能綜合應用。

    *   學習一些適合自己使用的技術指標，例如擺盪指標MACD、相對強弱指標RSI、隨機指標KD等等，以輔助走勢的研判。

    *   要學習看公司的基本面、財務報表、籌碼的流向及公司產業的國際現況。


    **2. 一定要「有自己獨特的模式」**


    有次在技術分析基礎班的最後一堂課，中場休息時，一位同學跟我說：「老師，今天是最後一堂課，我一定要把我的故事說給你聽。」他說，在十多年前，他拿了一千萬元給一位高手操盤，開始時，每月都有分到20萬元、30萬元的獲利，他的日子因此過得很愜意，常常遊山玩水、出國旅遊，直到半年之後，這個股票帳戶開始出現虧損，最後甚至全部賠光，從此他的人生由彩色變黑白，他也不再相信聽別人操盤這回事，現在，他立志要自己學會之後再進場。


    其實，這種拿錢給別人操作股票的例子實在太多，但是大多數結局往往都一樣慘賠，只有自己學會自己的操作模式，主動權掌握在自己手中，才能控制風險，贏得利潤。


    有了專業知識，並不表示在股票市場一定能夠賺錢，股票技術分析的專業知識好比在商學院學的經濟學、財務學、國際貿易等商業知識；股票市場就是社會的商業行為，千變萬化，看似傳統但又不斷創新，要用學校學的知識到社會去成功應用，還要經驗的磨練，才可能成功。


    學習股票專業知識並不難，認真用功學習，大概6個月可以學完，學會後能夠學以致用，就要經過市場經驗的歷練，後面成敗的關鍵，其實就是操作。


    操作的第一步要找到自己的方法，剛開始先參考別人的操作方式，例如有人用長線波段操作，獲利論倍計算，他的方法如何？有人用短線進出，累積獲利也很驚人，他又是如何操作的？有人當沖獲利，每天結算，一樣獲利，他的方法又是如何？股票市場高手如雲，個個武功不同，但是目的相同，都是要在股市獲利。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_15_0.png)


    既然你要闖蕩股市，光有基本馬步功，是不夠的，縱使是「一招半式闖江湖」，還是得有一招半式才行，股市朋友必須依照自己的個性、自己擁有的資源環境、自己能夠運用的時間多寡，選擇一種方式，擬定一些交易進出的條件及規則，開始投入小量資金，測試自己的方法成效如何？缺點在哪裡？用什麼方法改進可以提高勝率？經過實際交易的經驗，檢討精進，最終擁有一套自己固定的操作模式，才能達到穩定獲利的境界，也才能夠長久經營股市事業。


    **3. 一定要「膽心膽膽」**


    在股票市場有操作經驗的人都知道，股票操作是一種很奇特的瞬間心理反應，經常會發生不由自主的衝動或恐懼。


    例如，昨天信心滿滿的買進一檔看好的股票，今天開盤就下跌，心裡馬上就開始產生與昨日不同的想法；如果再往下跌一些，想法更悲觀，開始對這檔股票信心動搖，恐懼的陰影開始出現，心想是不是買錯了，要不要賣掉；沒一會兒，股價開始往上涨，逐漸到平盤，心裡的想法又開始改變，心想還好沒賣，自己昨天的判斷果然沒錯，結果一整天心情都在隨著股價的上下浮動，無法安定下來。


    有人說股市即道場，修行不夠的人是無法在股市立足的。股價上下波動是常態，如果自己的情緒不能穩定，那麼有再好的技術分析能力，再多的資金，學再多的操作方法，也是枉然。因為，市場中的主力大戶洞悉人性弱點，利用放假消息、拉高殺低等等各種手段方法，讓散戶貪婪或恐懼而操作自亂陣腳。


    保持身心的平衡，對一個專業的股市操盤手是非常重要的。一個人如果生活上不能保持最佳狀態，往往在股市中會犯下嚴重的錯誤，股市操盤本來就存在不小的壓力（說沒壓力是騙人的），而且經營股市要投入的時間、精力、金錢，絕不會比投入其他事業要少，要成為成功的操盤手，必須先要具備超人的EQ，否則在安靜無聲、殺人不見血的市場中根本無法存活。


    **4. 一定要「堅持到底」**


    和我一樣在同一教室中講授技術分析的王老師，即使擁有18年的業內資歷及操作經驗，她每天在收盤後，都要花好幾個小時研判大盤盤勢、分析個股、填入資料、手畫日K線，如此堅持的努力，才能掌握股市脈動，永遠領先大盤。


    股票市場的經驗要經過長期的累積，堅持的行為能夠產生習慣，習慣的力量可以創造奇蹟，這正是看圖千萬遍，方向自然現，心中無雜念，自然見如來。


    成功的過程要堅持「學中行、行中修、修中悟、悟中覺。」


    投資自己從學習開始，再把它學的東西到市場執行印證，從每次操中去做檢討修正，不斷的檢討、修正產生無數次的體悟，直到找到自己的固定操作模式，遵守自己訂定的交易規則，發揮簡單的力量，最終會覺醒悟透股市漲跌的循環，自有一定可以遵循的道路。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_16_0.png)


    在股市，我跟大家一樣被歸類為「一般投資人」，或者稱為「散戶」，是市場人數最多的最下層，上面有主力大戶、公司董事、法人、自營商、基金經理人、政府基金、外資、中資、金融巨鱷……
    這些人，大家的目的都一樣為賺錢。


    試問，你的財力比他們多嗎？你的消息比他們快嗎？你的操盤功夫比他們好嗎？你有研究團隊嗎？如果以上都沒有，那你憑什麼可以到股市來賺錢？上面的4個「一定」，就是我們要進入股市之前的認知，只要你有誠心，學習技術分析方法，改變投資股市的失敗習慣，克服貪婪與恐懼，一樣能夠達到股海撈金的美夢。


    # 我的經驗談③

    ## 股民要變股神

    ### 3大功夫缺一不可


    「市場為師、贏家為範、超越自己、追求卓越」，股票市場中沒有專家，只有輸家和贏家，許多人終其一生在追求名師指導，其實，股票市場的老師只有一個，那就是股票市場，所有想戰勝大盤的技巧，都必須通過市場的考驗。


    ## 沒有人能對抗市場趨勢


    要成為長期贏家，技術分析、基本分析都是必備的工夫，應用這些基本功夫到市場去學習賺賠的道理，股票市場是個很公平的老師，無論皇親國戚還是平民百姓，只要進到市場就要聽從市場，即使你是號令千軍萬馬的將軍，也無法指揮股市的趨勢方向。


    即使是富甲一方的華倫·巴菲特也說：「我也不能對抗趨勢」，股市才是所有投資人的老師。


    ## 一定要向贏家學習


    股市中有一句話說：「股票市場是有錢人買經驗，有經驗的人賺錢的地方。」這句話清楚的說明，股市經驗才是最可貴的

