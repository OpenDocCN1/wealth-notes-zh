    （3）均線走平或開始上揚。


    （4）低檔5週均線反轉向上穿過12週均線，產生黃金交叉，股價站在5週均線之上時。


    （5）股價跌破12週均線，均線維持上揚，當股價再次站上12週均線時買進。


    （6）符合前逓（1）至（5）條件的個股，回到日線等到符合進場的位置進場做多。特別提醒讀者：週線確認長紅K棒突破底部盤整，日線可能已上漲一段來到高檔，這時即使週線大機會出現，但是仍然要等待日線出現正確進場位置時切入。


    （7）剛進場時，停損守20日均線。


    續抱 股價未跌破5週均線時續抱。


    出場 股價接近5週均線時，當日K線跌破5週均線的價位時出場。例如當日是星期二，當週的5週均價是98元，如當日收盤前股價跌破98元就要出場，而不是等到星期五收週線時才做處理，這是控管風險第一的觀念。


    續勢 12週均線保持向上走勢，股價未跌破12週均線之前，繼續做多；股價站上5週均線時，進場繼續操作。


