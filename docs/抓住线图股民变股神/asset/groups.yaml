  md: "\n## 第3篇 波漲型態進階研究5：抓住急漲末端最佳賣點的方法\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_142_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n▲上圖說明：\n\n1. 股價出現連續跳空急漲，畫出上漲的急切線。\n2. 跌破上漲的急切線，出場。如果用K線戰法尚未跌破昨日低點，可以續抱。\n\
    3. 黑K線出現十字變盤線，注意次日走勢。\n4. 黑K線跌破昨日最低點，出場。\n\n### 以箱體底部跳空並出現急漲高台特寫\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_143_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n▲上圖說明：\n\n① 站上3日均線。\n② 股價出現連續大量長紅K線的急漲，畫出上漲的急切線。\n③ 股價跌破上漲的急切線，出場。\n\
    ④ (1) 黑K線跌破前一日低點，出場。\n(2) 黑K線跌破3日均線，出場。\n\n## 第3篇 第6章 K線賺錢密碼1：合併兩條K線的做法及判斷方法\n\
    \n股票K線最先反應一切，也是觀察股價轉折的位置，在實務操作時，K線隱藏著獲利的密碼，以下一一為讀者解碼。\n\n### 1 K線標準4＋1元素的意義\n\n\
    組成K線的基本元素有4個，分別是開盤價、收盤價、最高價、最低價，在電腦K線圖上都會標明這4個元素，這裡再加上另外一個重要的數據：1/2成本價，我稱為「第5元素」。以上「4＋1元素」代表不同的意義，在短線操作上的判斷很重要，分別說明如下：\n\
    \n#### 開盤價\n\n1. 反應開盤前利多或利空的消息面，至於國際股市的影響，主要是看美國、韓國、大陸股市的表現，例如美國股市大漲2%以上，韓國股市也往上開高，台股大盤也會開高。\n\
    2. 反應主力大戶的企圖，例如今日開盤跳空上漲，主力拉抬企圖明顯，股票強勢續多。如果昨日是長紅K棒上漲的局面，今日開在平盤或平盤以下，表示多方今日向上的企圖不強。\n\
    3. 反應變盤的先期徵兆，例如多頭走到高檔位置，昨日收盤出現十字線、墓碑線、吊人線等變盤K線是否代表真的要變盤，那麼，今日的開盤價就很是最重要的觀察指標。如果開高，化解變盤的疑慮；開低，多頭要小心真的要變盤了！\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_144_0.png)\n\n#### 最高價\n\n1. 當日多方力量所能攻到的最高價位。\n\
    2. 空頭抵擋反擊的價位，或是多頭開始撤退的位置。\n3. 與昨日最高價相互比較，是否已過昨日最高價？還是未過昨日高價即壓回？藉此察看主力是否有續多的企圖。\n\
    \n#### 最低價\n\n1. 當日空方力量所能到達的最低價位。\n2. 多頭抵擋開始反擊，或是空頭回補的位置。\n3. 與昨日最低價相互比較，是否跌破昨日低點為觀察重點。如果今日開高走低，最低價跌破昨日低點，多空激戰，則要密切注意收盤價的位置。\n\
    \n#### 1/2價\n\n1. 指當日（最高價＋最低價）÷ 2的價格。\n2. 1/2價代表當日多空交易的平均成本。\n3. 暴大量拉出長紅K線，日後回檔如跌破1/2價，表示多方氣勢轉弱；暴大量拉出長黑K線，日後反彈如突破1/2價，表示空方力道轉弱。\n\
    4. 股價漲到高檔，出現暴大量長紅K線，如果跌破該長紅K線的1/2價，高檔做頭的概率大增，要小心反轉。\n5. 股價跌到低檔，出現暴大量長黑K線，如果被突破該長黑K線的1/2價，低檔止跌回升的概率大增，可注意反轉。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_146_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ▲上圖說明：\n\n① 多頭上攻時，每次回檔都未跌破起漲處長紅K線的1/2價。\n② 高檔出現長黑K線時，日後反彈的收盤價一直無法收復長黑K線的1/2價，盤整最後再往下跌破，頭部就形成了。\n\
    ③ 空頭下跌時，每次反彈都無法往上突破長黑K線的1/2價。\n\n#### 收盤價\n\n1. 當日多空雙方經過一天的決戰最後結果的價格。\n2. 可以看出當日多空的強弱，並可以預期明日開高或開底的意圖。\n\
    3. 收盤價與昨日最高價及最低價比較，是否突昨高點或跌破昨日低點，是轉強或轉弱的重要觀察指標。\n\n### 子母K線透露多空角力的攻防\n\n當K線出現子（短K線）母（長K線）線並列時，透露出多空力道的角力，會影響後面的走勢表現。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_147_0.png)\n\n① 長紅後小黑，大漲小回，多方力道強。\n\
    ② 小紅後長黑，小漲大回，不過昨日高點又跌破昨日低點，空方力道強。\n③ 小黑後長紅，小回大漲，翻股線形，多方力道強。\n④ 長黑後小紅，大跌小漲，空方力道強，但在底部，如不再破底，可能止跌。\n\
    \n### 觀察合併兩條K線的8個重點\n\n股價每天交易時前後K線都會相互關連，單看一條K線就能知道當天多空的演變，從兩條K線就能看出股價前後的变化，例如股價是否繼續向上、還是停頓或是要轉向？因此，當兩條K線在一起判斷時，我們可以把兩條K線合併成一條K線來看，再從連續兩日的K線組合看出多空力道的狀況如何。\n\
    \n合併的方式是把第1天K線的開盤價、第2天K線的收盤價、兩天的最高價、兩天的最低價組成一條K線，這就是這兩天大盤的強弱表現。以下圖解合併兩條K線的做法及判斷強弱方法：\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_148_0.png)\n![](img/e6a266bab53ec29e9cf6f50724f4d142_148_1.png)\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_148_2.png)\n\n4. 右圖合併看是長下影線的小紅K線，在高檔出現是反轉訊號吊人線，在低檔是止跌訊號的錘子。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_149_0.png)\n\n5. 右圖的長黑K線一般稱為「吞噬」，合併2天來看，是長上影線的小黑K線，在高檔出現代表多方遇強大壓力，為反轉訊號。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_149_1.png)\n\n6. 右圖的長紅K線一般稱為「吞噬」，合併2天來看，是長下影線的小黑K線，在低檔出現是止跌反轉訊號，在高檔出現是可能變盤訊號，是否變盤要看次日走勢而定。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_149_2.png)\n\n7. 右圖合併看是長上影線的十字K線，代表可能變盤的訊號，是否變盤要看次日走勢而定。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_149_3.png)\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_150_0.png)\n\
    \n### 3條K線合併「夜星」的變盤訊號\n\n我們利用兩條K線合併的概念，同理可以推論出3條、4條……K線的組合概念，下面3條K線，一般稱為「夜星」，是高點轉折向下的訊號。如果把它組成一條K線的概念來看，就是基本技術分析單—K線高檔長上影線的變盤訊號。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_150_2.png)\n\n## 第7章 K線賺錢密碼2：8個K線攻擊及下跌訊號\n\
    \n### K線集錦盤礪 8個K線攻擊及下跌訊號\n\n同學經常會問，股價天天下跌，要如何知道是否已經止跌？甚至要上漲？其實，這在K線的變化上就可以看得出來，以下歸納出後市向上攻擊或是要向下下跌的訊號。\n\
    \n### 自低檔展開反轉的8個K線向上攻擊訊號\n\n當股價跌到低檔，以下8個K線向上攻擊訊號是多頭短線的強力表現。但是要注意，最低點的K線止跌訊號，必須要有過前面K線高點的確認紅K線出現。\n\
    \n1. **突破急切的長紅K線：**\n   低檔出現長紅K線，突破下降急切線，過前2日高點。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_151_0.png)\n\
    \n2. **出現地樁似的長下影K線：**\n   低檔出現長下影線的錘子，第2日要紅K線，過前一日高點才能確認止跌反彈。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_152_0.png)\n\
    \n3. **低檔出現十字K線：**\n   低檔出現十字或類似十字K線，是變盤訊號，第2日突破前一日高點的紅K線才能確認變盤。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_152_1.png)\n\
    \n4. **低檔出現倒鉗K線：**\n   低檔出現長上影線的K線，是止跌訊號，第2日開高向上，表示止跌，但是第3日要過前一日高點的紅K線，才能確認反彈。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_152_2.png)\n\n5. **低檔出現穿心紅K線：**\n \
    \  低檔出現長紅K線，突破前日長黑K線的1/2價，為多頭強勢止跌訊號；出現長紅K線後，次日要再過前日高點才能確認。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_152_3.png)\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_153_0.png)\n![](img/e6a266bab53ec29e9cf6f50724f4d142_153_1.png)\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_153_2.png)\n\n### 由高檔向下回檔的8個K線下跌訊號\n\n\
    當股價漲到高檔，出現以下8個向下回檔的K線訊號，是空頭短線的強力表現。但是要注意，最高點的K線止漲訊號，必須要有跌破前面K線低點的確認K線出現。\n\n1.\
    \ **出現跌破上升急切線的長黑K線：**\n   高檔出現長黑K線的「吞噬」現象，跌破上升急切線，跌破前2日低點。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_154_0.png)\n\
    \n2. **出現天線般的長上影K線：**\n   高檔出現長上影線的K線，第2天跌破前一日低點才能確認回檔。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_154_1.png)\n\
    \n3. **高檔出現十字K線：**\n   高檔出現十字或類似十字K線，是變盤訊號，第2日跌破前一日低點，才能確認變盤。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_154_2.png)\n\
    \n4. **高檔出現吊人K線：**\n   高檔出現長下影線的K線，是止漲訊號，次日開低向下，表示回檔，但要等到跌破前一日低點，才能確認回檔。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_154_3.png)\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_0.png)\n\n5. **高檔出現穿心黑K線：**\n \
    \  高檔出現長黑K線，跌破前日長紅K線的1/2價，為空頭強勢下跌的訊號，次日要跌破前日低點，才能確認。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_1.png)\n\
    \n6. **高檔出現陰包陽黑K線：**\n   高檔出現長黑K線的「吞噬」現象，當日創新高，收盤跌破前日低點，為K線單日穿頭破腳，是空頭強勢表態。次日跌破長黑K線低點，確認反轉。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_2.png)\n\n7. **高檔平低轉黑K線：**\n  \
    \ 高檔開盤為昨日最低點，一路往下拉出長黑K線。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_3.png)\n\
    \n8. **高檔出現連3根長黑K線：**\n   高檔出現連續3根長黑K線，為強勢空頭表現，可以鎖股，等待反彈後的做空點。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_4.png)\n\
    \n## 第8章 K線賺錢密碼3：判斷長紅K線、長黑K線的祕訣\n\n### K線賺錢密碼3 判斷長紅K線、長黑K線的祕訣\n\n當上漲趨勢行進時，突然出現下跌的長黑K線，把投資人給嚇壞了，到底出了什麼問題？同樣的，在下跌趨勢行進時，突然出現開低拉高的長紅K線，是不是要反彈回升了？\n\
    \n### 長黑K線及長紅K線在多頭、空頭趨勢的功能\n\n我們先要瞭解趨勢的力量，遠超過一根或數根K線的力量。當多頭趨勢形成，有往上助漲的力度，所以對在上漲的關鍵紅K線具有加強上漲的作用；對修正下跌的黑K線，反而有抗跌的作用。換句話說，多頭是上漲有理、下跌無理。\n\
    \n其次，上漲趨勢的特性本來就是緩漲急跌，所以上漲了一段之後，有一天突然出現大跌，這是主力一邊洗盤、一邊測試多頭散戶持股的信心。只要上漲趨勢沒有改變，長線可以保護短線，所以上漲趨勢中對於突然出現的長黑K線，不必過於恐慌。同樣的，下跌的時候，突然會出現反彈的長紅K線，遇到這種狀況，當然不要高興得太早，因為空頭趨勢並沒有改變之前的長紅K線，這只是跌深反彈而已。\n\
    \n以下歸納長紅K線及長黑K線在多頭趨勢及空頭趨勢的功能：\n\n1. 多頭趨勢的「長紅K線」，對向上攻擊有助漲的功能。\n2. 多頭趨勢的「長黑K線」，對向下跌的力道有減緩的功能。\n\
    3. 空頭趨勢的「長黑K線」，對向下跌有助跌的功能。\n4. 空頭趨勢的「長紅K線」，對向上漲的力道有減緩的功能。\n\n### 長黑K線在多頭趨勢中的支撐功能示意图\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_157_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ▲上圖說明：\n\n❶ 在多頭上漲走勢中出現長黑K線，由於處於多頭趨勢，且10日、24日均線持續向上，都會造成支撐助力。\n❷ 出現黑K線，由於處於多頭趨勢，且10日、24日均線發揮持續向上的支撐助力。\n\
    ❸ 出現高檔大量的十字變盤線，要密切注意日後走勢。\n❹ ❺ 連續出現大量變盤線，股價橫向盤整。\n❻ 盤中看到黑K線跌破9天的K線低點，要立刻出場。\n\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_158_0.png)\n\n資料來源：富邦e01電子交易系統\n\n▲上圖說明：\n\
    \n⑪ 在空頭下跌走勢中出現長紅K線，由於處於空頭趨勢，且10日、24日均線持續向下，都會造成下跌壓力。\n⑫ 出現暴大量且變盤的黑K線，由於24日均線向下的壓力，空頭續跌。\n\
    ⑬ 在空頭下跌走勢中出現中紅K線，由於處於空頭趨勢，且10日、24日均線持續向下，都會造成下跌壓力。\n⑭ 出現「底高」的長紅K線，24日均線仍然向下。\n\
    ⑮ 出現暴大量且變盤的十字黑K線，由於24日均線向下的壓力，股價續跌，進入盤整。\n⑯ 出現長黑K線跌破盤整及均線，空頭繼續下跌。\n\n### 不適合買進的5種暴大量長紅K線位置\n\
    \n當暴大量拉出長紅K線，代表當日多頭氣勢強勁，一般投資人看到K線這樣表現，很容易衝動買進。其實，在走勢中，以下5種位置如出現暴大量拉出長紅K線的情況，則不適合買進。\n\
    \n1. **在多頭高檔出現大量長紅K線**\n   這個位置出現的大量長紅K線，要小心主力藉機出貨。判別的方法要看次2日股價的表現，如果股價不漲或下跌，前面的那根大量長紅K線，就是主力出貨了。\n\
    \   操作策略很容易，當天大量長紅K線持股續抱，次日以後要注意不能跌破長紅K線的1/2價位，如果跌破，就要賣出離場，空手投資人，不要買進。\n\n   *多頭高檔出現暴大量長紅K線\
    \ 案例*\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_159_0.png)\n\n   資料來源：富邦e01電子交易系統\n\
    \n2. **連續上漲出現第3根或第4根的長紅K線**\n   當連續上漲出現3根或4根長紅K線，這時，獲利的人隨時要賣出，空手投資人不適合在此進場，因為多頭氣勢雖然強，但是極易追到高點而套牢，因此，要等到回檔修正後再買進。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_160_0.png)\n\n   資料來源：富邦e01電子交易系統\n\
    \n   ▲上圖說明：\n   ⑪ 上漲第3根的大量長紅K線，次日開高走低，連續回檔。\n   ② 高檔出現最大量紡錘紅K線，要有戒心。\n   ③ 高檔出現大量中紅K線，要以當日的1/2價為停利點，跌破1/2價要出場。\n\
    \   ④ 上漲出現第3根的長紅K線要小心，不能追買，次日如開高走低，要先出場。\n\n3. **接近前面重大壓力區的長紅K線**\n   當出現長紅K線又接近密集壓力區或是遢線壓力區時，空手投資人不適合在此進場，因為多頭氣勢雖強，但是容易受前面壓力而盤整或回檔。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_161_0.png)\n\n   資料來源：富邦e01電子交易系統\n\
    \n   ▲上圖說明：\n   ⑪ 密集盤整區。\n   ⑫ 高檔出現暴量長紅K線，接近前面密集盤整區壓力。1/2價認為停利點，跌破要出場。\n\n4. **空頭走勢反彈中出現大量長紅K線**\n\
    \   當空頭走勢時，突然出現暴大量的長紅K線，空手投資人不要心動隨便就進場，逆勢操作不容易獲利，往往容易套牢或者停損出場。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_162_0.png)\n\
    \n   ▲上圖說明：\n   ⑪ 空頭走勢中每次出現暴大量的長紅K線，次日都被套牢。\n\n5. **高檔出現長黑K線吞噬後又出現暴大量的長紅K線**\n\
    \   在高檔出現長黑K線吞噬現象，為反轉訊號，但是次日又出現暴大量的長紅K線，空手投資人不要隨便就追買，除非股價收盤突破吞噬長黑K線的高點。\n\n  \
    \ ![](img/e6a266bab53ec29e9cf6f50724f4d142_163_0.png)\n\n   資料來源：富邦e01電子交易系統\n\
    \n   ▲上圖說明：\n   ⑪ 上漲第4根的暴大量長紅K線，次日走低要出場，空手勿追。\n   ② 高檔出現長黑K線吞噬現象，為反轉訊號。\n   ③\
    \ 雖然出現紅K線，不能買進，除非股價突破吞噬長黑K線的高點65元。\n"
  mdcn: "\n## 第3篇 波漲型態進階研究5：抓住急漲末端最佳賣點的方法\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_142_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n▲上圖說明：\n\n1. 股價出現連續跳空急漲，畫出上漲的急切線。\n2. 跌破上漲的急切線，出場。如果用K線戰法尚未跌破昨日低點，可以續抱。\n\
    3. 黑K線出現十字變盤線，注意次日走勢。\n4. 黑K線跌破昨日最低點，出場。\n\n### 以箱體底部跳空並出現急漲高台特寫\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_143_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n▲上圖說明：\n\n① 站上3日均線。\n② 股價出現連續大量長紅K線的急漲，畫出上漲的急切線。\n③ 股價跌破上漲的急切線，出場。\n\
    ④ (1) 黑K線跌破前一日低點，出場。\n(2) 黑K線跌破3日均線，出場。\n\n## 第3篇 第6章 K線賺錢密碼1：合併兩條K線的做法及判斷方法\n\
    \n股票K線最先反應一切，也是觀察股價轉折的位置，在實務操作時，K線隱藏著獲利的密碼，以下一一為讀者解碼。\n\n### 1 K線標準4＋1元素的意義\n\n\
    組成K線的基本元素有4個，分別是開盤價、收盤價、最高價、最低價，在電腦K線圖上都會標明這4個元素，這裡再加上另外一個重要的數據：1/2成本價，我稱為「第5元素」。以上「4＋1元素」代表不同的意義，在短線操作上的判斷很重要，分別說明如下：\n\
    \n#### 開盤價\n\n1. 反應開盤前利多或利空的消息面，至於國際股市的影響，主要是看美國、韓國、大陸股市的表現，例如美國股市大漲2%以上，韓國股市也往上開高，台股大盤也會開高。\n\
    2. 反應主力大戶的企圖，例如今日開盤跳空上漲，主力拉抬企圖明顯，股票強勢續多。如果昨日是長紅K棒上漲的局面，今日開在平盤或平盤以下，表示多方今日向上的企圖不強。\n\
    3. 反應變盤的先期徵兆，例如多頭走到高檔位置，昨日收盤出現十字線、墓碑線、吊人線等變盤K線是否代表真的要變盤，那麼，今日的開盤價就很是最重要的觀察指標。如果開高，化解變盤的疑慮；開低，多頭要小心真的要變盤了！\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_144_0.png)\n\n#### 最高價\n\n1. 當日多方力量所能攻到的最高價位。\n\
    2. 空頭抵擋反擊的價位，或是多頭開始撤退的位置。\n3. 與昨日最高價相互比較，是否已過昨日最高價？還是未過昨日高價即壓回？藉此察看主力是否有續多的企圖。\n\
    \n#### 最低價\n\n1. 當日空方力量所能到達的最低價位。\n2. 多頭抵擋開始反擊，或是空頭回補的位置。\n3. 與昨日最低價相互比較，是否跌破昨日低點為觀察重點。如果今日開高走低，最低價跌破昨日低點，多空激戰，則要密切注意收盤價的位置。\n\
    \n#### 1/2價\n\n1. 指當日（最高價＋最低價）÷ 2的價格。\n2. 1/2價代表當日多空交易的平均成本。\n3. 暴大量拉出長紅K線，日後回檔如跌破1/2價，表示多方氣勢轉弱；暴大量拉出長黑K線，日後反彈如突破1/2價，表示空方力道轉弱。\n\
    4. 股價漲到高檔，出現暴大量長紅K線，如果跌破該長紅K線的1/2價，高檔做頭的概率大增，要小心反轉。\n5. 股價跌到低檔，出現暴大量長黑K線，如果被突破該長黑K線的1/2價，低檔止跌回升的概率大增，可注意反轉。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_146_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ▲上圖說明：\n\n① 多頭上攻時，每次回檔都未跌破起漲處長紅K線的1/2價。\n② 高檔出現長黑K線時，日後反彈的收盤價一直無法收復長黑K線的1/2價，盤整最後再往下跌破，頭部就形成了。\n\
    ③ 空頭下跌時，每次反彈都無法往上突破長黑K線的1/2價。\n\n#### 收盤價\n\n1. 當日多空雙方經過一天的決戰最後結果的價格。\n2. 可以看出當日多空的強弱，並可以預期明日開高或開底的意圖。\n\
    3. 收盤價與昨日最高價及最低價比較，是否突昨高點或跌破昨日低點，是轉強或轉弱的重要觀察指標。\n\n### 子母K線透露多空角力的攻防\n\n當K線出現子（短K線）母（長K線）線並列時，透露出多空力道的角力，會影響後面的走勢表現。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_147_0.png)\n\n① 長紅後小黑，大漲小回，多方力道強。\n\
    ② 小紅後長黑，小漲大回，不過昨日高點又跌破昨日低點，空方力道強。\n③ 小黑後長紅，小回大漲，翻股線形，多方力道強。\n④ 長黑後小紅，大跌小漲，空方力道強，但在底部，如不再破底，可能止跌。\n\
    \n### 觀察合併兩條K線的8個重點\n\n股價每天交易時前後K線都會相互關連，單看一條K線就能知道當天多空的演變，從兩條K線就能看出股價前後的变化，例如股價是否繼續向上、還是停頓或是要轉向？因此，當兩條K線在一起判斷時，我們可以把兩條K線合併成一條K線來看，再從連續兩日的K線組合看出多空力道的狀況如何。\n\
    \n合併的方式是把第1天K線的開盤價、第2天K線的收盤價、兩天的最高價、兩天的最低價組成一條K線，這就是這兩天大盤的強弱表現。以下圖解合併兩條K線的做法及判斷強弱方法：\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_148_0.png)\n![](img/e6a266bab53ec29e9cf6f50724f4d142_148_1.png)\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_148_2.png)\n\n4. 右圖合併看是長下影線的小紅K線，在高檔出現是反轉訊號吊人線，在低檔是止跌訊號的錘子。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_149_0.png)\n\n5. 右圖的長黑K線一般稱為「吞噬」，合併2天來看，是長上影線的小黑K線，在高檔出現代表多方遇強大壓力，為反轉訊號。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_149_1.png)\n\n6. 右圖的長紅K線一般稱為「吞噬」，合併2天來看，是長下影線的小黑K線，在低檔出現是止跌反轉訊號，在高檔出現是可能變盤訊號，是否變盤要看次日走勢而定。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_149_2.png)\n\n7. 右圖合併看是長上影線的十字K線，代表可能變盤的訊號，是否變盤要看次日走勢而定。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_149_3.png)\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_150_0.png)\n\
    \n### 3條K線合併「夜星」的變盤訊號\n\n我們利用兩條K線合併的概念，同理可以推論出3條、4條……K線的組合概念，下面3條K線，一般稱為「夜星」，是高點轉折向下的訊號。如果把它組成一條K線的概念來看，就是基本技術分析單—K線高檔長上影線的變盤訊號。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_150_2.png)\n\n## 第7章 K線賺錢密碼2：8個K線攻擊及下跌訊號\n\
    \n### K線集錦盤礪 8個K線攻擊及下跌訊號\n\n同學經常會問，股價天天下跌，要如何知道是否已經止跌？甚至要上漲？其實，這在K線的變化上就可以看得出來，以下歸納出後市向上攻擊或是要向下下跌的訊號。\n\
    \n### 自低檔展開反轉的8個K線向上攻擊訊號\n\n當股價跌到低檔，以下8個K線向上攻擊訊號是多頭短線的強力表現。但是要注意，最低點的K線止跌訊號，必須要有過前面K線高點的確認紅K線出現。\n\
    \n1. **突破急切的長紅K線：**\n   低檔出現長紅K線，突破下降急切線，過前2日高點。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_151_0.png)\n\
    \n2. **出現地樁似的長下影K線：**\n   低檔出現長下影線的錘子，第2日要紅K線，過前一日高點才能確認止跌反彈。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_152_0.png)\n\
    \n3. **低檔出現十字K線：**\n   低檔出現十字或類似十字K線，是變盤訊號，第2日突破前一日高點的紅K線才能確認變盤。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_152_1.png)\n\
    \n4. **低檔出現倒鉗K線：**\n   低檔出現長上影線的K線，是止跌訊號，第2日開高向上，表示止跌，但是第3日要過前一日高點的紅K線，才能確認反彈。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_152_2.png)\n\n5. **低檔出現穿心紅K線：**\n \
    \  低檔出現長紅K線，突破前日長黑K線的1/2價，為多頭強勢止跌訊號；出現長紅K線後，次日要再過前日高點才能確認。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_152_3.png)\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_153_0.png)\n![](img/e6a266bab53ec29e9cf6f50724f4d142_153_1.png)\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_153_2.png)\n\n### 由高檔向下回檔的8個K線下跌訊號\n\n\
    當股價漲到高檔，出現以下8個向下回檔的K線訊號，是空頭短線的強力表現。但是要注意，最高點的K線止漲訊號，必須要有跌破前面K線低點的確認K線出現。\n\n1.\
    \ **出現跌破上升急切線的長黑K線：**\n   高檔出現長黑K線的「吞噬」現象，跌破上升急切線，跌破前2日低點。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_154_0.png)\n\
    \n2. **出現天線般的長上影K線：**\n   高檔出現長上影線的K線，第2天跌破前一日低點才能確認回檔。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_154_1.png)\n\
    \n3. **高檔出現十字K線：**\n   高檔出現十字或類似十字K線，是變盤訊號，第2日跌破前一日低點，才能確認變盤。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_154_2.png)\n\
    \n4. **高檔出現吊人K線：**\n   高檔出現長下影線的K線，是止漲訊號，次日開低向下，表示回檔，但要等到跌破前一日低點，才能確認回檔。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_154_3.png)\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_0.png)\n\n5. **高檔出現穿心黑K線：**\n \
    \  高檔出現長黑K線，跌破前日長紅K線的1/2價，為空頭強勢下跌的訊號，次日要跌破前日低點，才能確認。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_1.png)\n\
    \n6. **高檔出現陰包陽黑K線：**\n   高檔出現長黑K線的「吞噬」現象，當日創新高，收盤跌破前日低點，為K線單日穿頭破腳，是空頭強勢表態。次日跌破長黑K線低點，確認反轉。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_2.png)\n\n7. **高檔平低轉黑K線：**\n  \
    \ 高檔開盤為昨日最低點，一路往下拉出長黑K線。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_3.png)\n\
    \n8. **高檔出現連3根長黑K線：**\n   高檔出現連續3根長黑K線，為強勢空頭表現，可以鎖股，等待反彈後的做空點。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_155_4.png)\n\
    \n## 第8章 K線賺錢密碼3：判斷長紅K線、長黑K線的祕訣\n\n### K線賺錢密碼3 判斷長紅K線、長黑K線的祕訣\n\n當上漲趨勢行進時，突然出現下跌的長黑K線，把投資人給嚇壞了，到底出了什麼問題？同樣的，在下跌趨勢行進時，突然出現開低拉高的長紅K線，是不是要反彈回升了？\n\
    \n### 長黑K線及長紅K線在多頭、空頭趨勢的功能\n\n我們先要瞭解趨勢的力量，遠超過一根或數根K線的力量。當多頭趨勢形成，有往上助漲的力度，所以對在上漲的關鍵紅K線具有加強上漲的作用；對修正下跌的黑K線，反而有抗跌的作用。換句話說，多頭是上漲有理、下跌無理。\n\
    \n其次，上漲趨勢的特性本來就是緩漲急跌，所以上漲了一段之後，有一天突然出現大跌，這是主力一邊洗盤、一邊測試多頭散戶持股的信心。只要上漲趨勢沒有改變，長線可以保護短線，所以上漲趨勢中對於突然出現的長黑K線，不必過於恐慌。同樣的，下跌的時候，突然會出現反彈的長紅K線，遇到這種狀況，當然不要高興得太早，因為空頭趨勢並沒有改變之前的長紅K線，這只是跌深反彈而已。\n\
    \n以下歸納長紅K線及長黑K線在多頭趨勢及空頭趨勢的功能：\n\n1. 多頭趨勢的「長紅K線」，對向上攻擊有助漲的功能。\n2. 多頭趨勢的「長黑K線」，對向下跌的力道有減緩的功能。\n\
    3. 空頭趨勢的「長黑K線」，對向下跌有助跌的功能。\n4. 空頭趨勢的「長紅K線」，對向上漲的力道有減緩的功能。\n\n### 長黑K線在多頭趨勢中的支撐功能示意图\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_157_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ▲上圖說明：\n\n❶ 在多頭上漲走勢中出現長黑K線，由於處於多頭趨勢，且10日、24日均線持續向上，都會造成支撐助力。\n❷ 出現黑K線，由於處於多頭趨勢，且10日、24日均線發揮持續向上的支撐助力。\n\
    ❸ 出現高檔大量的十字變盤線，要密切注意日後走勢。\n❹ ❺ 連續出現大量變盤線，股價橫向盤整。\n❻ 盤中看到黑K線跌破9天的K線低點，要立刻出場。\n\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_158_0.png)\n\n資料來源：富邦e01電子交易系統\n\n▲上圖說明：\n\
    \n⑪ 在空頭下跌走勢中出現長紅K線，由於處於空頭趨勢，且10日、24日均線持續向下，都會造成下跌壓力。\n⑫ 出現暴大量且變盤的黑K線，由於24日均線向下的壓力，空頭續跌。\n\
    ⑬ 在空頭下跌走勢中出現中紅K線，由於處於空頭趨勢，且10日、24日均線持續向下，都會造成下跌壓力。\n⑭ 出現「底高」的長紅K線，24日均線仍然向下。\n\
    ⑮ 出現暴大量且變盤的十字黑K線，由於24日均線向下的壓力，股價續跌，進入盤整。\n⑯ 出現長黑K線跌破盤整及均線，空頭繼續下跌。\n\n### 不適合買進的5種暴大量長紅K線位置\n\
    \n當暴大量拉出長紅K線，代表當日多頭氣勢強勁，一般投資人看到K線這樣表現，很容易衝動買進。其實，在走勢中，以下5種位置如出現暴大量拉出長紅K線的情況，則不適合買進。\n\
    \n1. **在多頭高檔出現大量長紅K線**\n   這個位置出現的大量長紅K線，要小心主力藉機出貨。判別的方法要看次2日股價的表現，如果股價不漲或下跌，前面的那根大量長紅K線，就是主力出貨了。\n\
    \   操作策略很容易，當天大量長紅K線持股續抱，次日以後要注意不能跌破長紅K線的1/2價位，如果跌破，就要賣出離場，空手投資人，不要買進。\n\n   *多頭高檔出現暴大量長紅K線\
    \ 案例*\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_159_0.png)\n\n   資料來源：富邦e01電子交易系統\n\
    \n2. **連續上漲出現第3根或第4根的長紅K線**\n   當連續上漲出現3根或4根長紅K線，這時，獲利的人隨時要賣出，空手投資人不適合在此進場，因為多頭氣勢雖然強，但是極易追到高點而套牢，因此，要等到回檔修正後再買進。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_160_0.png)\n\n   資料來源：富邦e01電子交易系統\n\
    \n   ▲上圖說明：\n   ⑪ 上漲第3根的大量長紅K線，次日開高走低，連續回檔。\n   ② 高檔出現最大量紡錘紅K線，要有戒心。\n   ③ 高檔出現大量中紅K線，要以當日的1/2價為停利點，跌破1/2價要出場。\n\
    \   ④ 上漲出現第3根的長紅K線要小心，不能追買，次日如開高走低，要先出場。\n\n3. **接近前面重大壓力區的長紅K線**\n   當出現長紅K線又接近密集壓力區或是遢線壓力區時，空手投資人不適合在此進場，因為多頭氣勢雖強，但是容易受前面壓力而盤整或回檔。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_161_0.png)\n\n   資料來源：富邦e01電子交易系統\n\
    \n   ▲上圖說明：\n   ⑪ 密集盤整區。\n   ⑫ 高檔出現暴量長紅K線，接近前面密集盤整區壓力。1/2價認為停利點，跌破要出場。\n\n4. **空頭走勢反彈中出現大量長紅K線**\n\
    \   當空頭走勢時，突然出現暴大量的長紅K線，空手投資人不要心動隨便就進場，逆勢操作不容易獲利，往往容易套牢或者停損出場。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_162_0.png)\n\
    \n   ▲上圖說明：\n   ⑪ 空頭走勢中每次出現暴大量的長紅K線，次日都被套牢。\n\n5. **高檔出現長黑K線吞噬後又出現暴大量的長紅K線**\n\
    \   在高檔出現長黑K線吞噬現象，為反轉訊號，但是次日又出現暴大量的長紅K線，空手投資人不要隨便就追買，除非股價收盤突破吞噬長黑K線的高點。\n\n  \
    \ ![](img/e6a266bab53ec29e9cf6f50724f4d142_163_0.png)\n\n   資料來源：富邦e01電子交易系統\n\
    \n   ▲上圖說明：\n   ⑪ 上漲第4根的暴大量長紅K線，次日走低要出場，空手勿追。\n   ② 高檔出現長黑K線吞噬現象，為反轉訊號。\n   ③\
    \ 雖然出現紅K線，不能買進，除非股價突破吞噬長黑K線的高點65元。\n"
