    「心」放在「股票」上，「股票」不放在「心上」。


    ### 「簡單」不代表「容易」


    2011年6月，報紙、電視都在報導陳文茜9個月成功減肥20公斤的新聞，也陸續報導其他人士減肥成功的消息，但是有更多的人每天都說要減肥，卻始終無法達到目標。


    我們看看那些減肥成功的人，他們使用的減肥方法五花八門，但是基本上來說，都是些老生常談的簡單方法，綜合起來只有8個字：「控制飲食、勤加運動」，再簡單說，只有4個字：「少吃多動」。


    既然方法那麼簡單，道理每個人都清楚明白，為什麼很多人始終減肥不成功，問題是「做不到」與「做不久」。根據國外曾經做過的一項統計，每100位減肥的人中有10人達到減肥成效，而能夠維持成效達一年的只有2人，由此可知，「簡單」並不代表「容易」，「堅持」更是「困難」。


    操作股票也是一樣，投資者終其一生，希望找到賺錢的方法，然而許多在股市中成功的人，早就告訴我們成功的方法，這些方法也很簡單，但是百分之九十的投資人還是賺不到錢，能夠維持長期穩定賺錢的大概也只有百分之五，原因是「知道」但是「做不到」與「做不久」。


    就拿「停損」來說，每位成功的前輩都告訴我們，在股市要控制風險一定要執行「停損」，華爾街大亨傑西．李佛摩在他對資金管理法則中特別強調：「千萬不要承擔任何一筆超出本金百分之十的損失。」這個道理清楚明白，可是在股市賠錢的朋友，許多人套牢的股票早就超過這個百分比了！


    ### 堅定毅力和自我要求 才能養成賺錢的習慣


    為什麼簡單的方法做不到？因為這些簡單方法「違反人性」，人性是「好吃懶做」，減肥要「少吃多做」；股票要「停損」會賠錢出場，人性是「不願賠」，股票要「停利出場」，人性是「貪婪」，還想賺更多而不賣，要克服這些人性的弱點，只有靠堅定的毅力自我要求，每天提醒自己要做到自己訂下的規則，經歷市場大盤的洗禮，慢慢養成賺錢的習慣。


    減肥成功看似容易，其實不容易，即使成功達到減重的目標，更大的挑戰才開始，那就是「維持戰果」。要維持體重，要有長久堅持的力量，如果放鬆自己設的原則，體重會說話，數字會告訴你放鬆的代價。


    股票市場也是一樣，想要維持长久贏家，自然不能輕易放棄讓你賺錢的方法及那些賺錢的原則，參透以上所說的道理，離股市成功指日可待。


    ### 向高層次高手學習成功的祕訣這麼難


    從事股票操作是一種自我挑戰，在這個市場中，那些大戶、法人、基金操盤人，都不是你的競爭對手，你，真正的敵人是你自己。


    股票操作得好不好？功力夠不夠？能不能賺錢？這些都跟其他投資人沒有什麼關係。操作股票就像打高爾夫球比賽，每位選手打自己的小洞，揮桿時別人也不能干擾你，對手打得好不好，跟你是沒關係的，基本上是你自己能打多少桿。


    世界知名的高球選手，例如美國的老虎·伍茲、臺灣的曾雅妮，他們的成功都有以下共同的特質：


    1. 高球是他們的終身事業，從小就以追求高球勝利為目標：臺灣的曾雅妮，5歲開始學球，小學時首次在美國觀賞了巡迴公開賽時，她就訂下「我也要參加這個比賽」的豪語，從此學球、打球、練球、參加比賽就成為她生活的全部，專注專一的奮鬥精神，17年的堅持努力，最後她終於站上世界球后的頂峰。

    2. 不斷超越自己，是他們維持巔峰的原因：每次比賽都會有失誤，每次的失誤都是再一次的經驗及檢討，每次的經驗檢討與修正，都是再一次的超越自己，追求完美是他們永遠的目標。

    3. 穩定的演出是致勝的關鍵：就技術層面來說，他們十多年的揮桿，早已技術純熟，但是每次比賽能否發揮，端賴臨場的穩定，決定成績的好壞，在於比賽時的精氣神能否保持在最佳狀態，穩不穩定才是致勝的關鍵。

    4. 永遠的學習是他們的內涵：即使他們登上了世界球王、球后的寶座，並不代表永遠能夠坐在寶座上，抱持永遠的學習精神，不斷自我要求，保有一直求進的態度，才可能維持長久的榮耀。

    5. 謙虛是他們的特質：由於謙虛，老虎·伍茲每一次打完後都會觀看自己比賽的紀錄片，同時請教練對不理想的揮棒給予修正；曾雅妮也一樣，對人態度可親，謙恭有禮，即使登上世界球后，並不以此驕傲，由於謙恭的態度，不但不會因驕傲阻擋了進步，同時也贏得他人的尊敬。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_31_0.png)


    ### 高爾夫球運動技巧 也是股票贏的祕法


    如果你把股票操作當成事業經營，就好比要當職業高爾夫選手一樣，要達到巔峰，同樣要具備下列打高爾夫球的技巧：


    1. 順勢而為：高球揮桿，要看風向，不是一味往正前方打就是正確，不考慮風向，很難順利打上果嶺。洞前推桿，要看草的紋路方向、地勢的坡度，順著這些方向，使出適當的力量，才能輕鬆推入洞。股票操作要順勢而為，看清趨勢，借力使力，搭順風車，才能輕鬆賺錢。

    2. 專一專注：高球比賽過程，每一揮桿和推桿都非常重要，而且前一桿揮得好，不代表後一桿一樣能夠揮好，因此每一次都要全神貫注，一個洞一個洞的累積，最後才能有好的成績。股票操作每一次的進場都要謹慎小心，這次買對股票賺錢，不代表下次買股就一定賺錢，每一次都是一個新的開始，專一專注在每一次的出手，累積賺錢的次數，減少賠錢的機率，如此才能成為長期贏家。

    3. 反敗為勝：再頂尖的高球選手，在比賽中都會出現失誤，可能揮球到沙坑、到池塘，但是他們擁有反敗為勝的能力，處理失誤的球，即使暫時落後對手，比賽結束前仍不放棄逆轉勝的努力。球后曾雅妮在球場上求勝的精神令人敬佩，這種旺盛的企圖心，使她常常在逆境中「轉敗為勝」，除了她具備一流的技術之外，更重要的是在比賽中情緒的控制，有穩定的情緒，才能發揮原有的實力。股票操作也是一樣，股市多變，萬一操作不順，遇到失誤，同樣要有反敗為勝的能力，知道如何處理失敗的股票，採取停損、反向操作或是換強勢股操作的措施，設法反敗為勝，長久還是贏家。

    4. 對準目標：高爾夫選手比賽是設法用最少的揮桿數把球打進目標的小洞內，無論球打到哪裏，下一桿揮球的方向仍然對準目標小洞，用專業的揮桿技術，穩定的情緒，在耐心與信心的堅持下，一桿一桿往前推進，直到小白球入洞為止。


    股票操作一樣要設定目標，依照自己資金的多寡，設定獲利的目標，不論多頭或空頭，都要以不同策略達成獲利目標。


    曾雅妮在一次記者訪問時說：「如果你成績很爛，沒有人會甩你！」這一句話，道盡了真實的人生。其實，股票市場何嘗不是如此，操作一直賠錢，相信你自己都會看不起自己！


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_33_0.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_33_1.png)


    欲知前世因，今生受者是， 欲知後世果，今生做者是。

    任何的對與錯、賺與賠，都是昨日的結果。


    ### 第二章 改變自己 才能改變股票賠錢的命運


    2002年2月，股市大盤正在走多頭，當時我聽朋友介紹說威盛（2388）會漲到 200元，我看當時的圖形，威盛由70元上漲到156元，回檔修正後又開始上漲，於是我在2月27日以143.5元買進了6張，成本約86萬元，股價經過6個交易日上漲到152元後就開始下跌，由於大盤繼續多頭，我認為威盛股價只是暫時回檔，後來威盛股價一路下跌，但是大盤指數卻繼續上漲，我想只要大盤維持多頭，股票一定能夠解套，一直到2002年10月11日，我再也無法忍受了，結果以40.2元賣出，慘賠62萬元收場。


    ### 股票套牢慘賠經驗：發現死循環的發展規律


    經過這次教訓（其實在這以前，同樣情形套牢後殺出大賠過好多次），我才發現：


    1. 原來大盤與個股不同，指數大漲，個股不一定同樣上漲。

    2. 股價跌深被套牢，大多數是無法解套的。威盛股價從2002年到現在，最低跌至4.89元，截至2012年2月29日股價才23.1元，請問，如果當時我沒認賠，要等到何時才能回本？


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_35_0.png)


    當我2006年下決定心學技術分析後，就不再發生股票套牢慘賠的情形了，現在只要買了股票，我一定以技術面出場。學會技術分析後，我檢討了當時買威盛的正確做法應該是：


    1. 看到威盛上漲到152元反轉下跌，表示無法突破前面的高點156元，當2002年3月15日跌破多日盤整的低點142元時，就要停損出場，那時如果出場，加上手續費用，每股才賠2.5元。

    2. 當時大盤處於多頭走勢，我應該採取「汰弱換強」的策略，立刻換一檔多頭上漲的股票操作。


    經過慘痛的經驗教訓，我現在的交易紀律中有一條鐵律，手中絕不持有賠錢超過百分之七的股票。


    ### 「80%的人，為什麼會賠錢？」


    西方有位大師曾經說過：「禱告並不能改變上帝，但是禱告可以改變禱告的人」。這是一句多麼有哲理的話。換句話說，如果禱告的人沒有做改變，上帝還是上帝，禱告的人還是原來的狀況，不會有什麼變化。


    股票市場中百分之八十的人在賠錢，這些賠錢的投資人，有些人是「一無所知」的進入市場，有些人是「一知半解」的進入市場，也有許多人「學富五車」的進入市場，但是共同的命運都是賠錢。


    我在與許多股友分享經驗的時候，發現無論哪個階層的賠錢投資人，在投資股票的觀念上都有或多或少的錯誤。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_36_0.png)


    資料來源：富邦e01電子交易系統


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_36_1.png)


    資料來源：富邦e01電子交易系統


    「一無所知」的投資人，對股票的看法都是建立在「感覺」上，因此他們提出問題時經常講到「我認為」這3個字。我最常聽到這些朋友說：「XX股票跌得很多了，『我認為』現在是買進的好時機。
    」


    這些朋友大多數是聽消息、找明牌做股票，有時運氣好，聽到的股票剛好正在上漲，讓他賺到錢，因此他會認為股市賺錢很容易。


    但是，運氣不是長久之計，當股價不是他預期的上漲，突然下跌時，由於自己看不懂行情走勢，而且當初消息來源只報好消息，會讓他下跌時不願賣出，結果股價一跌再跌，又是一個套牢長抱的投資人。


    這種「一無所知」的投資人，簡單的說，就是賺錢時不知道是什麼原因賺錢，賠錢時也不知道為什麼賠。


    「一知半解」的投資人，研判股票經常建立在「自以為對」的基礎上，事實上，他的看法欠缺了全盤的考慮，有時也突顯了他對技術分析沒有透徹的瞭解，因此他們在提問題時，經常講到「應該」兩個字。


    「一知半解」的投資人，經常拿了一張股票K線圖問我，股價今天大漲又出現大量，「應該」可以買進。事實上，那張走勢圖的股價表現根本是空頭的單日反彈，而且上面烏雲罩頂，哪裡是買進時機？別說做長期，即使做短期進出都不適合。


    由於對技術分析的一知半解，經常誤認一些技術圖形的訊號，自以為是好機會而進場，因此造成損失，這些投資人也許到處去學過技術分析，但是缺乏整合成完整有系統的應用，造

