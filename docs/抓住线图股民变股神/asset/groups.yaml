    #  二條均線戰法在多頭趨勢下的操作紀律


    採取二條均線戰法時，在多頭行進間也要注意以下的操作紀律：


    +   1.  當24日均線方向維持向上，持續做多。


    +   2.  當10日均線、24日均線同時向上呈多頭排列，股價在上方，依波浪型態回檔後上漲再買進，或盤整突破後再買進，持續做多。


    +   3.  股價收盤跌破10日均線一定要出場。10日均線持續上揚，股價收盤站上10日均線，再進場買進。


    +   4.  途中獲利超過10%以上，依K線出場訊號出場，遇到「頭不過前頭高」時，出場避險。


    +   5.  當股價回檔到24日均線有支撐，再上漲時買進。回檔跌破24日均線，如24日均線仍向上，要等到股價再站上24日均線時再買進。


    +   6.  不追第3根長紅K線，持股上漲到第3根長紅K線，觀察出場訊號，準備獲利出場。


    +   7.  當均線開始走平或10日均線下彎，K線出現該攻不攻時，要立刻出場，避免短期回檔的風險。


    +   8.  當波形進入盤整，退出，直到方向明確時再操作。


