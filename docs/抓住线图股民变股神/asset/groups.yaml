    K線賺錢密碼3：判斷長紅K線、長黑K線的祕訣


    # 第一章


    # K線賺錢密碼3

    判斷長紅K線、長黑K線的祕訣


    當上漲趨勢行進時，突然出現下跌的長黑K線，把投資人給嚇壞了，到底出了什麼問題？同樣的，在下跌趨勢行進時，突然出現開低拉高的長紅K線，是不是要反彈回升了？


    # 長黑K線及長紅K線在多頭、空頭趨勢的功能


    我們先要瞭解趨勢的力量，遠超過一根或數根K線的力量。當多頭趨勢形成，有往上助漲的力度，所以對在上漲的關鍵紅K線具有加強上漲的作用；對修正下跌的黑K線，反而有抗跌的作用。換句話說，多頭是上漲有理、下跌無理。


    其次，上漲趨勢的特性本來就是緩漲急跌，所以上漲了一段之後，有一天突然出現大跌，這是主力一邊洗盤、一邊測試多頭散戶持股的信心。只要上漲趨勢沒有改變，長線可以保護短線，所以上漲趨勢中對於突然出現的長黑K線，不必過於恐慌。同樣的，下跌的時候，突然會出現反彈的長紅K線，遇到這種狀況，當然不要高興得太早，因為空頭趨勢並沒有改變之前的長紅K線，這只是跌深反彈而已。'
