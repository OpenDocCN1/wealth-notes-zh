    ## 〕迴線\*、日線 M 頭\* 的風險


    股票在週線看到低檔\* 底，但是看日線卻呈現 M 頭部，這時該如何操作？


    - 週線：低檔出現\* 底。

    - 日線：呈現 M 頭。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_139_0.png)


    股票在週線看到低檔\* 底，中期的確是好買點，但是日線當時波浪型態是 M 頭，短線是空頭，買進容易套牢，因此，不能因為週線轉多而立刻買進，要等到日線止跌出現「底底高」向上的時候再買進，這時週線、日線同步向上，易漲難跌。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_139_1.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_139_2.png)


    # 第 5 章 波浪型態進階研究 5：抓住急漲末端最佳賣點的方法


    股票在行走時，經常遇到飆股起漲時、末升段噴出時、底部 V型反轉時或主力做價時的股價急速上漲走勢。遇到急漲的股票，可以採取下面4種方法出場，一般來說，都能夠賣到相對的高點。


    ## 急漲股票賣到最高點的4種方法


    - 1. 用K線戰法，只要收盤價沒有跌破前一日K線的低點就續抱，當收盤前股價跌破前一日K線的低點就賣出。

    - 2. 用急切線戰法，當股價開始每天上漲時，把日K線的低點連結往上畫出一條上升切線（稱為急切線），當股價出現黑K線跌破上升急切線時就賣出。

    - 3. 用K線出場訊號，當日出現大量長黑K線、長上影墓碑線、十字線、長下影線的吊人線、創新高收盤破低的黑K等K線訊號，當日可以先賣出，如果不賣，當第2天走勢不理想時，就要快速賣出獲利。

    - 4. 3日均線戰法，當股價跌破3日均線時就出場。


    基本上，股價急漲會立刻拉開主力成本區，同時造成遠離均線的乖離，當股價到一高點時，主力會藉由人氣追買而快速獲利了結，所以股價也容易快速回落，遇到這種走勢情況時，如果能活用上面的4種方法，就可以搶短獲利。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_141_0.png)


    > 資料來源：富邦 eO1 電子交易系統


    ▲上圖說明：


    - 1. ①站上3日均線。

    - 2. ②股價出現連續大量長紅K線的急漲，畫出上漲的急切線。

    - 3. ③（1）跌破上漲的急切線出場位置，出場。（2）K線前一日出現大量長紅K線，今日卻出現開低走低的黑K線出場訊號，出場。

    - 4. ④（1）黑K線跌破前一日低點，出場。（2）黑K線跌破3日均線，出場。

