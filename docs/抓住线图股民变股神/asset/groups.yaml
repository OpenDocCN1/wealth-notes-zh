    總結：19個交易日，交易2次，獲利12.36元，獲利率180%。\n\n## 1.2 無量飆漲無調整\n\n飆股人人愛，但是如果不是專業操盤的人，受限於個人環境條件，無法全程盯盤，或是個人操作習性無法符合快速、果斷進出的條件，則可在飆股戰法的精神架構下做一些調整，同樣能夠在飆股飆漲中獲取很好的利潤。戰術調整的重點如下：\n\
    \n- 1. 進場：盤前準備工作相同，進出場時機為當日開盤後30分鐘或收盤前10分鐘。\n- 2. 續抱及停利出場：除可參考飆股方式之外，可調整下列各種訊號出場：\n\
    \    - （1）未跌破上升趨勢線，可以續抱；跌破上升趨勢線，停利出場。\n    - （2）未破前一日低價（K線順勢法），可以續抱；跌破前一日低價，停利出場。\n\
