    # 線走均

    簡單的一條均線戰法


    操作要簡單而且容易執行，我們用一條均線做方向及進出的依據，同樣可以很容易操作，但是同樣要在規定的條件之下進行，否則容易失敗。一條均線戰法是根據「均線支撐的特性」，當價格在均線之上，均線方向向上，此時的均線就具有助漲的功能。


    # 一條均線戰法重點說明


    當然，採取不同週期的均線，會產生不同的績效，原則上，建議不要用太短期的均線，否則會頻繁的進出，而且趨勢方向也會變來變去，無法有效掌握。以下說明一條均線戰法的主要操作方法：


    戰法優點：


    +   1. 規則簡單清楚，容易執行。

    2. 不需要看盤，收盤前5分鐘看盤即可。

    3. 不會賠大錢，用長期均線可以做到波段。

    4. 不用顧及技術分析指標、成交量、基本面。'
  - '[PAGE 256]


    +   5. 適合任何資金操作。

    6. 解決盤中上下震盪的困擾。


    基本功力：

    熟練技術分析的「四大金剛」，執行能力要100%。


    操作目標：

    走勢明確時，每次獲利能夠達到10%以上。


    +   交易條件：

    1. 以波浪型態為最優先考量，順勢交易。不逆勢交易。

    2. 多頭或空頭走勢明確時可用此法，輕鬆操作。

    3. 採用20日均線為操作依據。也可自行調整使用其他均線，例如10日均線、24日均線、60日均線等。

    4. 跌深要經過打底、出現「底底高」現象，多頭走勢要確認。

    5. 漲多高檔要做頭下跌，出現「頭頭低」（峰峰低），空頭走勢要確認。

    6. 一條均線戰法適合用在一般上漲的多頭股票或空頭股票，不適合強勢上漲或在盤整區間使用。

    7. 此一方法屬於波段交易，因此要在走勢確認時介入，不適宜提前布局使用。無論進出，均以收盤價確認。

    8. 走勢明確時賺多賠少，而且可以大大減少近出操作的次數，容易控制操盤EQ。'
  md: "\n當然，既然要順著趨勢操作，必須對趨勢進行方向、趨勢改變訊號、趨勢反轉的型態要精練，讀者可以參看作者在第一本書《抓住飆股輕鬆賺》中第1篇所述之波浪型態變化。\n\
    \n## 戰法優點\n\n- 1. 規則簡單清楚，容易執行。\n- 2. 做長做短都可獲利，長線多頭可以保護短線的回檔。\n- 3. 可以看盤操作，也可以不要看盤。\n\
    - 4. 紀律守好，賺多賠少，趨勢走多遠，獲利走多遠。\n- 5. 適合一般資金操作。\n\n## 基本功力\n\n熟練技術分析中的「波浪型態」，執行能力要100%。\n\
    \n## 操作目標\n\n走勢明確時，隨趨勢操作，賺到趨勢改變為止。\n\n## 交易條件\n\n- 1. 以波浪型態為最優先考量，順勢交易，趨勢向上做多，趨勢向下做空，盤整或趨勢不明時則不做。\n\
    - 2. 進場前要先做好功課，慎選型態明朗、走勢清楚的標的，平日做好鎖股、研究產業及追蹤主流股等功課，準備要進場的股票，對進場位置的設定、停損價位的設定、操作策略及停利目標，都要在事先做好。\n\
    - 3. 做多，要等波段下跌之後，出現底部型態或反轉完成（至少出現底底高）、上升波確立（頭頭高、底底高）、續勢盤整突破等關鍵位置出現再進場。做空，要等波段上漲之後，頭部出現型態或反轉完成（至少出現頭頭低）、下跌波確立（頭頭低、底底低）、續勢盤整跌破等關鍵位置出現再進場。\n\
    - 4. 採用日線K線，再配合5日均線為操作依據。\n- 5. 順勢操作波浪型態戰法可用在飆股、強勢股、多頭股票，但不能在盤整區間使用。\n- 6. 無論進出，均以收盤價確認。\n\
    \n### 1. 在多頭走勢做多的操作要訣\n\n想用順勢操作波浪型態戰法在多頭走勢做多，必須配合波浪型態，看趨勢方向為多頭時才能進場。同時，一定要在回檔止跌再上漲時買進，以及在盤整末端向上突破時買進。主要操作方法說明如下：\n\
    \n**進場**\n（1）低檔打底出現底底高的第2支腳，暴大量拉出上漲紅K線，且股價站上5日均線。\n（2）低檔打底完成，出現突破底部盤整上頸線的大量上漲紅K線。\n\
    （3）上升一段後回檔，出現止跌回升的大量上漲紅K線，股價站上5日均線。\n（4）在盤整末端，股價向上，出現突破盤整的大量長紅K線。\n\n**續抱**\n\
    收盤沒有跌破5日均線時，續抱。\n\n**出場**\n收盤確認股價跌破上升切線，且股價跌破5日均線時，出場。\n\n**護盤**\n進場當日波浪轉折的低點，以及盤整突破上頸線的位置。\n\
    \n### 2. 在空頭走勢使用波浪型態戰法\n\n想用順勢操作波浪型態戰法在空頭走勢做空，必須配合波浪型態，看趨勢方向為空頭時才能進場。同時，一定要在反彈止漲再下跌時放空，以及在盤整末端向下跌破時放空。主要操作方法說明如下：\n\
    \n**進場**\n（1）股價高檔做頭，出現「頭頭低」（峰峰低）的第2個頭及下跌的黑K線，股價跌破5日均線。\n（2）下跌一段時間後反彈，出現止漲回落的黑K線，股價跌破5日均線。\n\
    （3）在盤整末端股價向下，出現跌破盤整的長黑K線。\n\n**續抱**\n收盤沒有突破5日均線時，續抱。\n\n**加碼**\n收盤確認股價突破上升切線，且股價突破5日均線時，回補。\n\
    \n**止賺**\n進場當日波浪轉折的最高點，以及盤整跌破的下頸線位置。\n\n### 3. 在盤整區間的順勢操作戰法\n\n前述有提到順勢操作波浪型態戰法可以用在飆股、強勢股、多頭股票，但不能在盤整區間使用。如果遇到盤整的情況，可以採取以下5種因應策略。\n\
    \n- 1. 進入盤整可以採取做或不做兩種策略，除非價差很大，否則不宜操作。\n- 2. 如果前波走勢是多頭，盤整區間以「低接高出」操作。\n- 3. 如果前波走勢是空頭，盤整區間以「高空低補」操作。\n\
    - 4. 盤整時要以單邊操作，避免兩頭被扒。\n- 5. 要把握盤整末端突破的方向，抓住進場機會。\n\n## 順勢操作波浪型態應知的8點提醒\n\n- 1.\
    \ 一般投資人比較偏向做多，前面說過要順勢操作，因此股票在走空的時候千萬不要做多，做多一定要等到打底，底部型態完成（至少出現底底高），上升波確立（頭頭高、底底高）後，再找做多進場時機。\n\
    - 2. 回後買上漲是指上升走勢中，在股價回檔修正後再次上漲時買進，而不是在回檔認為是低價就去買。\n- 3. 依據波浪型態操作，股價跌破5日均線時出場。但是下列情況可做調整：\n\
    \    - （1）在關鍵進場點進場，獲利未達5%且未跌破停損價位時，可暫不出場。\n    - （2）往上走出趨勢，且獲利達20%以上時，下列情況可先獲利出場：\n\
    \        - 當日出大量上漲到高點，股價折返下跌超過3%時。例如當日股價上漲到5%，然後回跌至漲幅只剩2%時，要先賣出一半；拉回到平盤時，要全部出清持股，將獲利先入袋為安。\n\
    \        - 當日暴量不漲，股價創新高之後，收盤跌破前日低點。\n        - 前面連續幾日是急漲，當日跌破上升趨勢線（急切線）時，先獲利入袋。\n\
    \        - 波形產生「頭頭低」的格局，股價不過前高往下跌時。\n        - K線出現長黑、長上影線、帶大量的十字線等出場訊號，先賣出一半，次日開盤不往上再攻，要全部出清持股。\n\
    - 4. 多頭就是不斷的在創新高價，回檔時不會跌破前面的低點，當多頭走勢不創新高就回檔，就是多頭改變的訊號，此時要密切注意手中持股，往後走勢不對時，要趕快出場避險。\n\
    - 5. 在多頭走勢中，長線會保護短線，回檔套牢時比較容易解套，但是遇到反彈沒有過前高時，即使小賠也要立刻逃命。像這種反彈沒有過前面高點就下跌的走勢，俗稱為「逃命波」。\n\
    - 6. 空頭就是不斷的創新低價，反彈不過前次高點，當空頭走勢不再破新低就回升，就是空頭改變的訊號，放空的股票要注意回補點，空手者觀察是否有做多的機會。\n\
    - 7. 在空頭走勢中做多，一旦套牢很難解套。所以在空頭走勢中做多，一定要執行停損。\n- 8. 多頭走勢的進場好時機，是買在回檔止跌再上漲的位置，而不是突破前面高點的位置。因為過高必拉回是多頭的特性。\n\
    - 9. 空頭走勢的放空好時機，是賣在反彈止漲再下跌的位置，而不是跌破前面低點的位置。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_241_0.png)\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_241_1.png)\n\n> 小不忍則亂大謀，股票方向不明、位置不好，都要忍住，不要隨意出手買進。\n\
