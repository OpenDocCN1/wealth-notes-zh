    +   4. 途中獲利超過10%以上，以K線出場訊號出場，遇到「底不破底」時，要出場避險。


    +   5. 股價反彈到24日均線遇壓力不過，再下跌時做空。反彈突破24日均線，24日均線仍向下彎，股價再跌破24日均線時，做空。


    +   6. 不追第3根長黑K線，手中空單如出現下跌到第3根長黑K線情況，觀察出場訊號，準備獲利出場。


    +   7. 當均線開始走平或10日均線開始上揚，K線出現「該跌不跌」時，要立刻出場，避免短期反彈的風險。


    +   8. 當波形進入盤整，退出觀望，直到方向明確時再操作。


    +   9. 波形出現「底底高」時，要結束空頭做空的想法。


    # 操作二條均線戰法的重要提醒


    操作二條均線戰法時，有以下4個選股時機：


    +   1. 收盤看每日強勢股。


    +   2. 盤中看強勢股訊息。


    +   3. 收盤前找明日攻擊強勢股。


    +   4. 開盤前以市價買進強勢股。


    不過，如遇到盤整期，則要注意以下2點：


