    +   1. 多頭趨勢的「長紅K線」，對向上攻擊有助漲的功能。


    +   2. 多頭趨勢的「長黑K線」，對向下跌的力道有減緩的功能。


    +   3. 空頭趨勢的「長黑K線」，對向下跌有助跌的功能。


    +   4. 空頭趨勢的「長紅K線」，對向上漲的力道有減緩的功能。


