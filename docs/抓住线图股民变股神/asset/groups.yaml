    # 1. 多頭走勢


    ◎ 定義：股價一直創新高，回檔時不破前面低點。


    ◎ 動作：做多買進，買進的位置請看第 3 篇「技術分析進階」。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_77_0.png)


    # 2. 多頭回檔


    ◎ 定義：多頭上漲一段後的下跌修正，回檔時不能跌破前面低點。


    ◎ 動作：回檔下跌時，不可預測止跌的位置買進，要「等到」出現止跌訊號，第 2 天不再跌破前一天低點，同時收盤前確認上漲過前一天高點的紅 K 線後買進，也就是「回後買上漲」。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_77_1.png)'
