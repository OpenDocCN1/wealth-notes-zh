    - 2. 連續往上跳空，出現突破盤整區上頸線的穿頸走勢，是突破買點。


    ## 1 頭部 3 種重要反轉型態


    股價漲到高檔，頭部經過盤整做頭，本章說明的 3 種頭部型態是最常見也最重要的頭部反轉型態。頭部的反轉不一定出現大量，讀者要把頭部的重要反轉型態看熟練，這些反轉型態是多頭的結束，是做空賺錢的機會，手中如有做多的股票則要出場，如果是在週線圖或月線圖出現這些反轉型態，極可能是大波段起伏的開始。


    ### 1. 平頭破底


    股價漲到高檔，出現 2 個或 3 個價位相近的頭部後，往下跌破前面的底點，是頭部完成的訊號，多頭要出場，做空可以鎖住該股票，等待放空的機會。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_121_0.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_121_1.png)


    ▲上圖說明：


    - ⑪ 高檔出現價量背離。

    - ⑫ 股價漲到高檔，頭部盤整做頭，出現兩個價位相近的高點，股價跌破前面低點，是跌破賣點。


    ### 2. 低頭破底


    股價漲到高檔，出現頭不過前面的高點，再往下跌破前面的低點，是頭部完成的訊號，多頭要出場，做空可以鎖住該股票，等待放空的機會。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_122_0.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_122_1.png)


    資料來源：富邦 eO1 電子交易系統


    ▲上圖說明：


    - (1) 高檔出現「頭頭低」現象。

    - (2) 股價漲到高檔，跌破前面低點，頭部確立，是跌破賣點。

    - (3) 股價跌破盤整低點，是跌破賣點。


    ### 3. 穿頭破底


    股價漲到高檔，出現繼續過前高後向下回檔跌破前面低點，這種假突破真破底的頭部型態，反轉成空頭走勢會比較強，我們無法賣到過前高的最高點，但是可以鎖住做空，等待放空的機會。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_123_0.png)


    資料來源：富邦 eO1 電子交易系統


    ▲上圖說明：


    - ⑪ 股價突破前面高點，盤中拉高突破前面高點，引誘看多的人買進，然後出大量主力賣出，留長上影線。

    - ⑫ 股價連續下跌兩天，跌破下顎線，穿頭破底頭部型態完成，後續容易大跌。

    - ⑬ 反彈不過前面高點，下跌繼續做空。


