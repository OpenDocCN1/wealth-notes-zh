    # ### 第十章


    # # 長期持股的

    ## 順勢操作波浪型態戰法


    有位劉同學，在上完技術分析的波浪型態課程之後，立刻利用波浪型態多頭的進場位置去買了一檔股票，經過兩、三天之後，賺到了錢，高興得不得了。她說，從來沒有這樣輕鬆的賺到股票錢，我告訴她，因為她是順著波浪的趨勢去做，所以很容易成功。


    # ### 順勢操作波浪型態戰法重點說明


    依據道氏（Charles H. Dow）的「股價理論」，多頭市場走勢會持續走一段時間，行進中每次都會繼續創新高點，每次下跌回檔的修正，都不會跌破前面的波底就往再上上漲，如此，股票趨勢就是上升的多頭市場。相對來說，股價往下走，每次下跌都一再破新低價，而反彈時無法過前面高點，繼續下跌，如此，股票趨勢就是下跌的空頭市場。


    我們利用道氏的多頭特性順勢做多、空頭特性順勢做空，如果股票趨勢沒有改變，就維持原來方向操作，做長或做短都可以的操作方法，這就是順勢操作波浪型態戰法。'
  md: '

    6. 操作次數少，持有時間長，獲利大。


    基本功力：

    熟練技術分析的「四大金剛」，執行能力要100%。


    操作目標：

    機會確認時，每次獲利50%，甚至數倍以上。


    交易條件：

    - 1. 以波浪型態為最優先考量，順勢交易。不做空頭反彈或多頭回檔的逆勢單。

    - 2. 採用月線、週線選股，看日線進場，守週線。

    - 3. 20週均線交易法以用在中大型股為原則，不適合小型飄股。


    波段操作的特質：

    - 1. 做多單，買進的股票要低，最好是底部反轉起漲的位置。做空單，進場的股價要高，最好是頭部反轉起跌的位置。

    - 2. 報酬率高。

    - 3. 做多時，在週線或日線要看到盤整的大底，且底部漸高，或是常見的多頭型態底部出現。做空時，日線要有明顯頭部、週線要跌破上升切線，或是出現頭部、月線跌破上升切線的現象。

    - 4. 底部盤整時，月線、週線會出現大量，或日線打底時出現草叢量，初升段時伴隨量增。頭部不一定會爆出大量才下跌。


    ## 在多頭走勢做多的操作方法


    用20週均線交易法在多頭走勢做多，要抓住20週均線交易法的進場時機，須配合波浪型態，看趨勢方向，主要操作方法說明如下：


    進場時機：

    - 在大盤空頭趨勢到達低檔時，大部分好股票物超所值。

    - 個股要經過過線打底，開始往上。

    - 過線續勢盤整完畢，股價向上突破盤整位置。


    交易規則：


    進場：股價在低檔打底，月線出現突破下降切線的大量長紅K棒，過線有「底底高」底部，當股價站上20週均線並且出大量，這時到日線適合的位置買進。


    續抱：在股價沒有跌破20週均線時，續抱。


    出場：在初升段、主升段，股價收盤跌破20週均線時出場；在未升段，股價在盤中跌破20週均線時出場。


    停損：剛進場時，以日線波浪型態的轉折低點作為停損，走出趨勢，拉開成本區時，開始以20週均線作為停利依據。


    加碼：（1）當續勢盤整的末端靠近20週均線，且乖離率在7%以內時，可以考慮加碼，這時靠近20週均線，即使停損，損失不會超過7%。（2）當續勢盤整的大量向上突破盤整上頸線時。（3）加碼的數量要小於原持有股票的數量。


    ## 在空頭走勢做空的操作方法


    用20週均線交易法在空頭走勢做空，要抓住20週均線交易法的放空出場時機，同時須配合波浪型態，看趨勢方向，主要操作方法說明如下：


    放空時機：

    - 1. 大盤多頭趨勢到達高檔，大部分股票呈現超漲現象。

    - 2. 個股要經過過線盤頭，開始往下。

    - 3. 過線續勢盤整完畢，股價向下跌破盤整的位置。


    交易規則：


    [進場] 股價在高檔做頭，月線出現跌破上升切線的長黑K棒，過線有「頭頭低」的向下頭部型態，股價跌破20週均線（不一定出大量），這時到日線適合位置做空。


    [續抱] 股價沒有突破20週均線時續抱。


    [出場] 在初跌段、主跌段，股價收盤突破20週均線時回補；在末跌段，股價在盤中突破20週均線時回補。


    [停損] 剛進場時用日線波浪型態的轉折高點作為停損點，走出趨勢，拉開成本區後，用20週均線作為停利點。


    [加碼] （1）當續勢盤整的末端靠近20週均線，且乖離率在7%以內。

    （2）當續勢盤整向下跌破盤整下頸線時（不一定要大量）。

    （3）加碼的數量要小於原持有股票的數量。


