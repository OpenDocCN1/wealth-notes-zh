    ## 趨勢線的進階應用：找買點、空點、目標價及看強弱


    趨勢線是最簡單判別趨勢的方法。多頭走勢的最低轉折點連接往上的切線稱為「上升趨勢線」，股價只要一直維持在趨勢線的上方，這條趨勢線代表的趨勢方向及支撐就一直有效。


    空頭走勢的最高轉折點連接往下的切線稱為「下降趨勢線」，股價只要一直維持在趨勢線的下方，這條趨勢線代表的趨勢方向及壓力就一直有效。


    不管是上升趨勢線還是下降趨勢線，有效的時間愈長，這條趨勢線就愈重要。趨勢線的重要意義並不是指它支撐或壓力一直有效，而是要注意這條重要的趨勢線一旦被跌破或被突破，趨勢改變的機率很大。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_176_0.png)


    ### 1. 從股價與趨勢線關係看趨勢是否改變


    趨勢的發展不會一路到底，多頭走勢開始會先走一段，一旦這一段的上漲產生的上升趨勢線被跌破，表示要回檔修正。


    當修正完畢繼續多頭的第 2 段走勢，這時會產生一條中期的上升趨勢線。


    第 2 段上漲本身有一條上升趨勢線，整個大趨勢由分段的中趨勢組成，一直到長期上升趨勢線被跌破，波浪型態趨勢改變為止。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_177_0.png)


    每一段中期上升趨勢線，對正在上方前進的股價提供往上的助力和支撐，所以當上升趨勢線被跌破，除了透露中期要回檔修正的訊息之外，同時因為股價跌破上升趨勢線，這條原本支撐的趨勢線就變成日後的壓力線。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_178_0.png)


    當每一段中期下跌趨勢線，對正在下方前進的股價提供往下的助跌和壓力，所以下降趨勢線被突破，除了透露中期要反彈的訊息之外，同時因為股價突破下降趨勢線，這條本來造成壓力的趨勢線就變成日後的支撐線。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_178_1.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_179_0.png)


    ▲上圖說明：


    - ① 多頭起漲第 1 段的第 1 條中期上升趨勢線被跌破時，回檔修正。

    - ② 股價碰到第 1 條上升趨勢線時遇到壓力，回檔修正，盤整。

    - ③ 第 2 條中期上升趨勢線被跌破時，回檔修正。

    - ④ 股價碰到第 2 條上升趨勢線時遇到壓力，回檔修正，盤整。

    - ⑤ 股價碰到第 2 條上升趨勢線時遇到壓力，回檔修正，盤整。

    - ⑥ 第 3 條中期上升趨勢線被跌破時，回檔修正。

    - ⑦ 包含前面 3 條趨勢線的長期上升趨勢線被跌破時，回檔修正。

    - ⑧ 再上漲時碰到長期上升趨勢線壓力回跌，這次的回跌在波浪型態上產生「頭頭低」現象，因此看出，時間愈長的上升趨勢線被跌破，趨勢改變的可能性愈高。


    ### 2. 趨勢線的買點、空點及目標價


    只要懂得運用趨勢線，就可以找到投資的買點、空點，並預估目標價，從趨勢線的斜率強弱判斷進場時機。


    - 在上升趨勢中的買點


    當兩個低點確立上升趨勢線之後，股價回檔尚未到上升趨勢線就止跌再上漲時，是股價轉強的買進點。股價回檔接近上升趨勢線不跌再上漲時，是好的機會買點。股價回檔跌破上升趨勢線，立刻再上漲站上趨勢線時，是好的買點。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_180_0.png)


    - 在下降趨勢中的做空點


    當兩個高點確立下降趨勢線之後，股價反彈尚未回到下降趨勢線就止漲再下跌時，是股價轉弱的做空點。股價反彈接近下降趨勢線不漲再下跌時，是好的做空點。股價反彈突破下降趨勢線立刻再下跌至趨勢線下方時，是好的做空點。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_181_0.png)


    ▲上圖說明：


    - ① ② 兩個高點確立下降趨勢線。

    - ③ 反彈接近下降趨勢線有壓力，為再下跌時的做空點。

    - ④ 反彈突破下降趨勢線，之後再跌破趨勢線下跌時，是做空點。

    - ⑤ 反彈尚未回到下降趨勢線就弱勢下跌時，是做空點。


    - 趨勢線可以估算目標價


    當趨勢線被突破或跌破也可以估算出目標價。當上升趨勢線被跌破時，股價通常會回落到前面修正後起漲的位置。當下降趨勢線被突破時，股價通常會上漲到前面反彈後起跌的位置。


