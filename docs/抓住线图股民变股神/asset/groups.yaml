    ## 利用長紅K線與長黑K線的走勢觀測漲跌


    K線充分反應多方與空方的企圖，以及企圖的成功與否，尤其是長紅K線或長黑K線代表的企圖最明顯。


    我們觀察多頭K線的走勢圖，幾乎任何型態突破的位置，如果是長紅K線，往上再漲的機率很高。長紅K線的最低點也就是買方的發動點，自然也是買方的防禦底限。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_164_0.png)


    資料來源：富邦e01電子交易系統


    我們觀察空頭K線的走勢圖，幾乎任何型態跌破的位置，如果是長黑K線，往下再跌的機率很高。長黑K線的最高點也就是空方的發動點，自然也是空方的防禦底限。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_165_0.png)


    資料來源：富邦e01電子交易系統


    基於前述的觀念，利用長紅K線及長黑K線，可以判斷多方是否有能力續攻或是空方是否有能力續跌。


    ## 第2章 移動平均線的進階應用：均線交叉及糾結的操作重點


    移動平均線是1960年由葛蘭畢（Granville, Joe）提出來的，中心論述是指一定期間內交易的平均成本構成的一條隨著股價變動的移動曲線。


    基本上，短期間的移動平均線振幅及方向變動較快，例如3日均線，是取最近3天的收盤價計算平均成本，因此，其中一天占有1/3的比重，當一日股價大漲或大跌，立刻對3日的平均價產生很大的變化。


    如果是長期的移動平均線，振幅及方向變動較慢，例如60日均線，是取最近60天的收盤價計算平均成本，因此，其中一天只占有1/60的比重，當一日股價大漲或大跌，對60日的平均價產生的變化比較小。


    我們在實際應用時，經常會有不知要用哪條均線較好的問題，事實上，刀有所短，劍有所長，在運用上最少要一條短期均線搭配一條長期均線使用，就能互取所長。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_167_0.png)


    ### 用月線及季線分析多空趨勢


    在應用移動平均線時，一般用短期均線操作進出，另外取一條較長期的均線當做多空方向的依據。


    在均線中，月線及季線是重要的趨勢參考線。用日線操作的短期投資人，必須要用月線研判多空的趨勢。過去台灣股市每週交易6天，月線採用24日均線，現在每週交易5天，用20日均線為月線。


    這兩種期間差別不大，主要是在操作上，股價在月線之上，而且月線呈現向上走勢，趨勢為多頭，只要股價沒有跌破月線之前，做多操作；一旦股價跌破月線下方，而且月線下彎，就視為空頭趨勢，做空操作。因此，月線是短期操作的多空分界均線。


    用波段操作的中長期投資人，必須要以季線研判多空的趨勢，過去通常用72日均線為季線，現在每週交易5天，合理的季線應該是65日均線（52週÷4×5）。


    季線作為中長期趨勢的參考，股價在季線之上，而且季線上揚，中期趨勢為多頭。只要股價沒有跌破季線之前，做多操作；一旦股價跌破季線下方，而且季線下彎，就視為空頭趨勢，做空操作。因此，季線是中長期操作的多空分界均線。


    無論投資人做短期用月線判多空，或者做中長期用季線判多空，原則上，順勢操作失誤的比率相當低，逆勢操作失誤的比率則相當高。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_168_0.png)


    資料來源：富邦e01電子交易系統


    ▲上圖說明：


    - ① 用 20 日均線為月線。

    - ② 股價站上月線，月線上揚，趨勢多頭，做多。

    - ③ 股價跌破月線，月線開始下彎，趨勢空頭，做空。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_169_0.png)


    ▲上圖說明：


    - ① 用 65 日均線為季線。

    - ② 股價站上季線，季線上揚，做多，後面出現將近 18 個月的多頭趨勢。

    - ③ 股價跌破季線，季線開始下彎，趨勢成為空頭，做空。


    前面說明在所有的均線之中，月線及季線是重要的趨勢參考線，月線及季線的交叉代表中長期趨勢的改變。當月線由下往上穿越季線產生「黃金交叉」，當兩條均線同時往上時為中長期走多的趨勢；當月線由上往下穿過季線產生「死亡交叉」，兩條均線同時往下時，中長期空頭趨勢形成。


    如果用週線來看，可用 4 週均線作為月線、12 週均線作為季線，進行這兩條均線的交叉研判。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_170_0.png)


    ▲上圖說明：


    - ① 20 日均線（月線）與 72 日均線（季線）死亡交叉，之後連續下跌 6 個月。

    - ② 20 日均線與 72 日均線黃金交叉，結束空頭趨勢。


