    \n# 基金贏家100招\n\n**創富系列4！**\n\n**定價**：280元  \n**作者**：趙靖宇\n\n本書作者趙靖宇擁有超過10年主跑基金新聞的經驗，以及長期持續觀察基金投資市場的心得及投資實證。她總是站在公正客觀第三者的角度，剖析為什麼基金投資會賠錢、如何才能賺到錢等投資人最關心的問題，在這個業者置入性行銷無孔不入的世界，她的見解絕對是你賺錢必看的重點。\n\
    \n---\n\n# 22年股市菜鳥  \n通曉定法交易獨門功 穩獲變股神\n\n股市菜鳥想要翻身在股市致富，只要用對方法，永遠不嫌晚，永遠都不遲！朱家泓就是最好的實例！2009年及2010年他每年從股市獲利逾1倍，2011年雖有歐債危機，他在股市獲利也有4成，同年從期指及選擇權交易則賺更多。\n\
    \n其實，在這之前，他曾当了22年的股市菜鳥，在股市賺少賠多、賺多賠更多！57歲那年，他徹底覺悟，從「心」開始，花了1年精通技術分析，花了3年時間克服人性，同時，做到相信技術分析就像信「神」一樣，因而發展出自己的一套每年看圖選股賺1倍密技，自此開啟他在股市的致富之門！\n\
    \n他的技術分析課，教室往往爆滿，連走道上都排滿座位，擠得水洩不通；有人甚至從美國特地請長假回來上課，有人則每周從台中、桃園坐高鐵來上課；即使是技術分析基礎課程，有人一上他的課就是2遍、3遍，甚至5遍以上，只為了能夠精通他的股市致富之道。\n\
    \n他的第一本技術分析基本工具書《抓住個股 輕鬆賺》，一上市即成為財經暢銷書，迄今已經9刷了！\n\n在上課學員及《抓住個股 輕鬆賺》讀者的催促下，而今，他再次無保留地推出技術分析操作進階工具書《抓住緣圖\
    \ 股民變股神》，希望讀者除了學到「技術分析基本功」之外，也能學到他的「定法交易獨門功」及「恪遵紀律無我功」，體悟出股票賺錢的道理，邁向股市高手之路。\n\n\
    已年過60歲的他堅信，「天助自助」，學習股票沒有年齡限制，沒有性別限制，沒有學歷限制，沒有貧富限制，沒有職業限制，任何人都可以學。想要擺脫在股市一直賠錢的輪迴、邁向股市致富之路，他的故事及定法交易獨門功，你一定必學必看！\n"
