    \n總結：27個交易日，交易4次，獲利65.1元，獲利率112%\n\n# 第4篇\n\n## 第12章 獲利目標達成利器2：短期賺高報酬的翻股戰法\n\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_296_0.png)\n\n資料來源：富邦e01電子交易系統\n\n▲上圖說明：\n\
    - ⑪ 互億（6172）股價在底部盤整2個半月，出現吸貨草叢量。\n- ⑫ 2010年4月19日，拉出紅K線突破盤整區，以6.84元買進。\n- ⑬ 2010年4月27日，打開漲停，回跌到漲幅剩5%時，以10元賣出。\n\
    - ⑭ 2010年4月29日，拉出紅K線過前日高點，以10.3元買進。\n- ⑮ 2010年5月13日，開高回跌到漲幅剩5%時，以19.5元賣出。\n\n\
    總結：19個交易日，交易2次，獲利12.36元，獲利率180%。\n\n## 1.2 無量飆漲無調整\n\n飆股人人愛，但是如果不是專業操盤的人，受限於個人環境條件，無法全程盯盤，或是個人操作習性無法符合快速、果斷進出的條件，則可在飆股戰法的精神架構下做一些調整，同樣能夠在飆股飆漲中獲取很好的利潤。戰術調整的重點如下：\n\
    \n- 1. 進場：盤前準備工作相同，進出場時機為當日開盤後30分鐘或收盤前10分鐘。\n- 2. 續抱及停利出場：除可參考飆股方式之外，可調整下列各種訊號出場：\n\
    \    - （1）未跌破上升趨勢線，可以續抱；跌破上升趨勢線，停利出場。\n    - （2）未破前一日低價（K線順勢法），可以續抱；跌破前一日低價，停利出場。\n\
    \    - （3）未跌破3日均線，可以續抱；跌破3日均線，停利出場。\n    - （4）未出現黑K線，持股可以續抱；出現黑K線下跌走勢，停利出場。\n\
    \    - （5）成交量研判重點：\n        - ◎ 無量飆漲，可以續抱。\n        - ◎ 量稍放大，價仍穩，可以續抱。\n     \
    \   - ◎ 量放大，價大幅震盪，可以先出一半。\n        - ◎ 量大增，價仍收紅，保守者先出場，或再看次日走勢而定。\n        - ◎\
    \ 量大增，開高走低，出現黑K線，代表高點已到，迅速賣出。\n\n獲利目標達成利器2：短期賺高額報酬的飆股戰法\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_298_0.png)\n\
