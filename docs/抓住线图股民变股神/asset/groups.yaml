    - 7. 收盤價跌破20日均線，賣出。\n- 8. 收盤突破20日均線，均線方向向上，買進。\n- 9. 收盤價跌破20日均線，賣出。波浪型態已出現「頭頭低」（峰低），股價盤整，停止操作。\n\
