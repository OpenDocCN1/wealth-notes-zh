    ## 第2篇


    ### 第1章 想用股票致富 进场前你必须做好的准备


    - 9. 台指期货的各项数据与台股指数的正负价差可能造成的影响。

    - 10. 审视当日强势股及弱势股，归纳发现主流类股、多头或空头刚发动的股票。


    ### 建立个人的选股数据库


    台湾股票上千档，不可能每档都做或每档每天都看，因此要选择一些有赚钱机会的股票，建立个人资料库以方便锁定它们，平日就注意它们的发展，机会一出现，能够在最短时间抢占先机，立刻买进。


    前述的每日资料分析中的第10条：“审视当日强势股及弱势股”，是发现好股票的重要功课，借用市场的自己表态，很轻松就能发现强势股、弱势股、主流股等股票。


    自己经过基本面、技术面的分析筛选，剔除一些股本过小、成交量过少、股价太低、基本面太差可能下市的股票之后，可以把下列股票纳入自己的选股数据库。


    - 1. 波浪型态明显，刚开始发动的股票。

    - 2. 正在底部盘整的股票。

    - 3. 多头回档或盘整等待续势再上涨的股票。

    - 4. 高档盘整，可能做头的股票。

    - 5. 中小型的强势飙股。

    - 6. 主流类股中的强势上涨股。

    - 7. 各类股的龙头股。

    - 8. 占大盘权重的指标股如台积电、鸿海，高价股如宏达电、大立光等，做为影响大盘指数的参考。


    ### 开盘前的准备工作


    “凡事预则立，不预则废”，操作股票每天要做好次日的准备工作，这样就不会慌慌张张的就上战场，有了规画，操作有所依归，可以大大减少受情绪的影响。


    例如，前一天就先分析好手上的股票走势，如果次日股价收盘前5分钟没有跌破10日均线，则继续持有，那么第2天盘中股价的上下波动就不会影响你的心情，到下午1时25分看看股价是否要处理就可以了。


    开盘前要先完成以下4项事情：


    - 1. 分析手上持股，如果手中有持股，分析持股是第一项工作，因为你已经投入了资金，关系到赚赔，一定要全神贯注你的股票，详细说明今天盘中的策略，是否要停损或要停利，还是要加减码或换股……
    。

    - 2. 对计划今天要进场的股票，要做好准备，什么价位到要进场或符合什么条件时就要进场。

    - 3. 对今天大盘可能的走势要有一个方向，作为行情背景的参考。盘中根据市场变化做调整。

    - 4. 上午开盘前要看一下韩国及日本股市状况以及期货开盘的情形，这些都可以提供你对今天大盘的修正参考。


    如果把做股票当做事业，那么每天的工作就像是公务员上下班一样，我就是股市公务员！每天早上8点上班，到我的工作室，在开盘前准备好今天工作的“备战表”，内容如下：


    #### 我操作股票的每日“备战表”


    | **步骤** | **说明** |

    | :--- | :--- |

    | **第1步** | 分析国际盘，包括美股、欧股、陆股及早上刚开盘的韩股及日股行情。 |

    | **第2步** | 对合资大盘的分析，包括研判今天可能的走势是开高走低、开低走高、还是上下狭幅震荡，预判可能的高点及低点、往上压力的位置及往下支撑的位置。
    |

    | **第3步** | 分析昨日台股K线、设定今日高低关卡的点位。 |

    | **第4步** | 分析昨日期货指数的走势、设定今日高低关卡的点位。 |

    | **第5步** | 分析手中持股，包括：上档可能的压力、走势是否保持原来的方向、今日可能来到要停损或停利位置的处置以及那些选股今日要观察的盘中现象（例如接近盘整末端的选股对象）。
    |


    ### 股票投资员的SOP作业流程


    上述5项作业完成，冲泡一杯香浓的咖啡，翻阅一下当日的财经报纸（只是参考），等待上午8：45分台指期货开盘，就正式展开给今天重要的工作了！


    - 8：45 台指期货开盘

    我的主画面是5分K线图，开始记录开盘点数。前面3根5分K线的收盘点数，可以作为现货可能开盘点位的参考。


    - 9：00 台股现货开盘

    记录开盘点位、上涨或下跌的%、成交量、委买/委卖比值、均买涨与均卖涨差数、委买卖张差、估计成交量。以上资料数据除了开盘记录外，还要记录9：05分、9：10分、9：15分及10点等4个时间的资料，同时观察这1小时盘面变化，大致掌握今日的概况。

    盘中同时也要浏览亚洲股市的走势状况，当然要看手中持股变化，是否来到“备战表”的停损停利位置，以及走势状况、成交量情形及盘中是否出现异常大量连续买单或卖单的情形，只要仍符合个人定法纪律的持股条件，原则观察就好，守纪律操作如同公务员依法行政一样，安稳行得百年船。


    - 10：00～12：00

    在这2小时的中间时段应多看少做，因为股票主力今天的策略动作在上午10点前就已完成，在10点至12点期间，大多是散户交易，或者是主力为配合期货的多空在做现货的调整。这段时间，除非手中持股有出现纪律要出场的状况必须处理，或者在盘中看到自己的选股已到进场机会点，才做动作，否则这段时间可以站起来活动一下筋骨或闭目养神一下。


    - 12：00～13：00

    通常这期间股市交易又开始活络，这时要观察是否有尾盘强势往上的股票，这些股票明日会有续涨的能力，检查线型后可以买进一些，进行短线获利。


    - 13：00～13：30

    要精神专注，注意自己手中持股的今日K线型态，预估收盘是否到自己订定的停损或停利价位，如果还在正常行进范围内，就放心持股怀抱。


    - 13：30 现货收盘～13：45 期货收盘后

    把今天大盘的走势图再看一遍，检讨是否与自己盘前研判的“备战表”一样，并且把大盘、期货、手中持股今天的价量、均线、高低价、买卖等资料登记在“股票日志”。哈哈！公务员今天准备下班啦！


    当晚上要利用时间写完“股票日志”，进行每日资料分析，建立及检视选股数据库，做好明日的准备工作。如此充实忙碌的一天，看来要做个称职的“股市公务员”，也实在不简单呢！


    ## 第3篇


    ### 4大技术分析的进阶应用


    技术分析除了是分析图形工具外，更是我们操作上的依据


    在面对股市变化时，技术分析可以提供即时的讯号，让我们能够评估机会、进场机制，或者是立刻出场离开


    本篇为技术分析的进阶应用，能够让熟练者对技术分析更进一步认识，在操作上更能够得心应手


    ### 第3章 波浪型态进阶研究 1：多头、空头及盘整图形及买卖位置


    在我这几年教课的经验中，发现同学的问题大多是看不出趋势方向，因此经常在下跌的时候做多，做错了方向。其次，是进场位置不对，自己认为股票好就赶快买进，结果往往买到高点；或是回档修正，自己认为股价低就去承接，往往股价继续下跌，这些问题再再说明波浪型态的重要，只要能够透视波浪型态的特性，就可以清楚看出趋势方向，同时也可以知道最佳的买卖位置，如此自然能够轻松操作。


    技术分析的“四大金刚”是波浪型态、K线、均线及成交量，其中以“波浪型态”为首 （“四大金刚”请参考《抓住飙股轻松赚》一书），因为波浪型态可以判别多头、空头或盘整的走势方向，同时发现方向的改变、确认方向的结束，并且能够有明确的进出位置，所以是学技术分析很重要的基础。


    本章进一步对波浪型态的角度、位置、回档及反弹的幅度、突破及跌破关键支撑或压力的型态、底部及头部的型态判别……等等做说明，帮助读者在实际操作中更能驾轻就熟。


    #### 多头波浪的完整走势及进场位置


    同学大多习惯做多，2011年大盘直直落，股票跌的多、涨的少，害得不少同学赔钱。如果对多头走势的特性充分瞭解，就不会在行情不好的时候一味做多了。


    1. 对多头波浪应有的重要认知


    - （1）转折高点（称头或峰），后面头比前面头高，股价一直在创新高（简称为“头头高”或“峰峰高”）。

    - （2）转折低点（称底或谷），也是后面底比前面底高，股价的低点一直在垫高（简称为“底底高”或“谷谷高”）。

    - （3）当股价回档时，要观察不能跌破前面低点，然后再继续上涨，如此波浪走势仍然维持符合多头“底底高”的条件。因此，回档要观察不能跌破前面低点是必要条件。

    - （4）当股价经过回档修正后，没有跌破前面低点再上涨，当上涨突破前面高点，走势继续创新高，确认波浪走势继续是“头头高”、“底底高”的多头。

    - （5）多头走势总是上涨的多、回跌的少，股价一步步往上推升。缓涨急跌，出现长黑不继续下跌的现象。

    - （6）价涨量增，价跌量缩。

    - （7）见压不是压，见撑多有撑。


    #### 以联华科为例说明多头抱枕的完整形态图1


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_105_0.png)


    资料来源：富邦@01电子交易系统


    ▲上图说明：


    - ① “底1”开始出现“底底高”，走多头，在“头1”回档到“底2”时没有跌破“底1”就往上涨。

    - ② “底2”上涨过前面“头1”的高点，确认多头走势。

    - ③ 往后一直是“头头高”、“底底高”的多头格局，直到“头8”出现无法过“头7”就回档的现象，表示多头趋势开始变化，多头可能要休息盘整或反转。


    2. 多头的金贵买点位置


    - （1）底部盘整，股价已向上突破下降切线，出现“底高”且带量拉出长红K线时。

    - （2）底部盘整完成，出现突破前面高点的带量长红K线时。

    - （3）回档出现没有跌破前面低点，且出现再向上拉升的红K线时。

    - （4）盘整末端，股价出现带量长红K线往上突破上颈线时。


    3. 操作时的重要观念


    - （1）多头进场，最佳买点就是前述的4个位置。我们在选好股票准备做多之前，必须看日线是否为进场位置点，如果不是，最好等到进场位置时再动作，否则随便进场很容易短期套牢或遭到停损。例如：没确认打底就去买、回档尚未止跌回升就去买、盘整还没有结束就去买、上涨好几天去追高买，结果造成操作困难而赔钱。

    - （2）股价突破前面高点的买进，前述说明只有两个位置：一是底部盘整完成的突破确认，一是盘整末端的突破。为什么行进中回档后再上涨突破前面高点时，不是最佳买点？理由是一般主力在往上拉涨走一段创新高后会洗盘，让过多的浮额卖压换手，所以连涨3～5天之后容易回档，因此当创新高时去追买，往往是买在回档后上涨的第3或第4天，正好处于过高要拉回的时候，随时会碰到拉回的状况，所以尽量买在回档后再上涨的第一根红K线，既容易停损，获利空间又大。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_107_0.png)


    ▲上图说明：


    - ⑪ 突破下降切线，是空头转弱的信号。

    - ⑫ 底部出现“底底高”，带量拉出长红K线。此处是空头的止跌，低点不再破前面的低点，先以盘整看待，是试单的买点。

    - ⑬ 虚线是盘整的上颈线。

    - ⑭ 突破盘整上颈线，带量拉出长红K线。波浪符合“头头高、底底高”的多头走势，是买进的位置。

    - ⑮ 回档修正结束，再带量拉出长红K线。是回档后再上涨的买进位置。

    - ⑯ 续势的盘整。

    - ⑰ 跌破上升切线，是多头转弱信号。

    - ⑱ 跌破盘整下颈线，带量拉出长黑K线，转为空头。


    #### 图示波浪型股票多头波浪的进阶技巧


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_108_0.png)


    △上图说明：


    - 1. 下降切线。

    - 2. 红K线突破下降切线，不是买点。

    - 3. 底部出现“底底高”，拉出长红K线，可以买进，请设定好停损点。

    - 4. 突破盘整上颈线，为买进位置。

    - 5. 突破盘整上颈线，为买进位置。

    - 6. 突破盘整上颈线，为买进位置。

    - 7. 回档修正后拉出上涨红K线，为买进位置。


    #### 多头回档后止跌上涨的买点


    在前面多头波浪进场买点，只有在底部盘整的突破前面高点，以及盘整平台突破高点时建议买进，在其它的上涨行进中，则建议买在回档止跌回升时的上涨位置，而不是突破前面高点的位置。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_109_0.png)


    #### 多头涨势需在前高做回档


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_109_1.png)


    #### 空头波浪的盘整走势及进场位置


    1. 对空头波浪应有的重要认知


    - （1）转折高点（称头或峰），后面头比前面头低，股价一直在破新低价（简称为“头头低”或“峰峰低”）。

    - （2）转折低点（称底或谷），也是后面底比前面底低，股价的低点一直在往下（简称为“底底低”或“谷谷低”）。

    - （3）在空头走势中，当股价反弹时要观察不能突破前面高点，且之后再继续下跌，如此波浪走势仍然维持符合空头的“头头低”的条件。

    - （4）当股价经过反弹没有突破前面高点再下跌，如果继续跌破前面低点，继续创新低，则可确认波浪走势继续是“头头低”、“底底低”的空头，因此，下跌继续创新低是确认的条件。

    - （5）空头总是下跌的多，反弹的少，股价一步步往下走。

    - （6）空头出现长红不继续上涨的现象。

    - （7）价跌量增，价涨量缩。

    - （8）见撑不是撑，见压多有压。


    2. 空头的黄金卖点位置


    - （1）头部盘整，股价已向下跌破上升切线，再出现“头头低”的长黑K线时。

    - （2）头部盘整完成，跌破前面低点的长黑K线时。

    - （3）反弹没有突破前面的高点，再向下下跌拉出黑K线时。

    - （4）盘整末端，股价带量拉出长黑K线往下跌破下颚线时。


    3. 操作时的重要观念


    - （1）空头放空最佳卖点就是前述4个位置。我们在选好股票准备做空之前，必须看日线是否为放空位置点，如果不是，最好等到放空位置时再动作，否则进场容易短期套牢或遭到停损。

    例如做头没确认就去空、反弹尚未止涨回跌就去空、盘整还没有结束就去空、下跌好几天去追低空，结果造成操作困难而赔钱。

    - （2）股价跌破前面低点的放空做法，前面说明只有两个位置：一是头部盘整完成的跌破确认，一是盘整末端的跌破。

    为什么行进中反弹后再下跌的跌破前面低点时，不是最佳空点？理由是股价下杀时，往往走一段后因为散户会认为价低而进场，造成跌多的反弹，所以连跌3～5天之后容易反弹，因此去空在下跌的第3天或第4天，正好处于随时要反弹的状况，因此尽量在反弹后再下跌的第一根黑K线去放空，既容易设停损，获利空间又大。


    以下图表为联华(2454)日线走势，用以说明空头“低”


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_112_0.png)


    资料来源：富邦e01电子交易系统


    ▲上图说明：


    - ① “头1”开始出现“头头低”现象，走空头，在“底1”反弹到“头2”时，没有突破“头1”就再往下跌。

    - ② “头2”下跌，跌破前面“底1”的低点，确认空头走势。

    - ③ 往后一直是“头头低”、“底底低”的空头，直到“头7”出现突破“头6”的高点，表示空头趋势开始发生变化，可能要盘整或回升。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_113_0.png)


    △上图说明：


    - ⑪ 跌破上升切线，是多头走弱的信号。

    - ⑫ 头部出现“头头低”的现象，且拉出长黑K线，是做空的试单位置。

    - ⑬ 虚线是头部盘整的下颈线。

    - ⑭ 跌破盘整下颈线的长黑K线，是做空位置。

    - ⑮ 反弹结束，再拉出长黑K线，下跌，是做空的位置。

    - ⑯ 续势的盘整。

    - ⑰ 突破下降切线，是空头走弱的信号。

    - ⑱ 突破盘整上颈线，带量拉出长红K线，反转为多头走势。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_114_0.png)


    资料来源：富邦e01电子交易系统


    ▲上图说明：


    - ① 跌破上升切线。

    - ② 头部出现“头头低”的长黑K线。

    - ③ 出现跌破盘整下颈线的长黑K线，空头确认。

    - ④ 反弹结束，再出现长黑K线，做空。

    - ⑤ 反弹结束，再出现长黑K线，做空。

