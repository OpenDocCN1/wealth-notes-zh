    # 沒有人能對抗市場趨勢


    要成為長期贏家，技術分析、基本分析都是必備的工夫，應用這些基本功夫到市場去學習賺賠的道理，股票市場是個很公平的老師，無論皇親國戚還是平民百姓，只要進到市場就要迎從市場，即使你是號令千軍萬馬的將軍，也無法指揮股市的趨勢方向。


