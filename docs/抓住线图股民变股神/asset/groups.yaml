    \n# 第 4 章\n\n# 輕鬆就能賺\n\n# 智慧K線戰法\n\n智慧K線戰法屬於短線操作法，擷取明顯上漲或下跌的一段，由於規則簡單，操作容易，又稱為「傻瓜操作法」。這種簡單的方法是根據「市場慣性原理」，當價格突破前一天的高點，買進力道大於昨日，依慣性股價會繼續往上；當股價跌破前一天低點，表示多方力竭，空方力道大於昨日，股價容易繼續往下。\n\
    \n## 智慧K線戰法重點說明\n\n我們利用「市場慣性原理」下單操作，是最省時間的下單選擇方式，也是最可能買在發動點的第1天及買在高點結束的第1天。主要操作方法說明如下：\n\
    \n### 戰法優點\n\n- 1. 規則簡潔清楚，容易執行。\n- 2. 短線即可獲利，停利明確。\n- 3. 不需要看盤，收盤前5分鐘看盤即可。\n-\
    \ 4. 不會賠大錢，獲利很好。\n- 5. 不用顧及技術分析指標、成交量、基本面。\n- 6. 適合一般資金操作。\n- 7. 解決盤中上下震盪的困擾。\n\
    \n### 基本功力\n\n熟練技術分析的「四大金剛」，執行能力要100%。\n\n### 操作目標\n\n走勢明確時，每次獲利能夠達到7%以上。\n\n\
    ### 交易條件\n\n- 1. 以波浪型態為最優先考量，順勢交易。搶空頭急跌的反彈做多，或是末升段急漲的回檔放空。\n- 2. 做多買進遇到走勢急漲、做空賣出遇到走勢急跌時，可立刻採取智慧K線戰法操作，找到最佳的停利位置。\n\
    - 3. 採用日線K線為操作依據。\n- 4. 智慧K線戰法可用在飆股、強勢股，但不能在盤整區間使用。\n- 5. 此一方法屬於短線交易，因此要在行情發動時介入，不適宜提前布局使用。\n\
    - 6. 無論進出，均以收盤價確認。\n\n## 多頭走勢做多的操作定法\n\n用智慧K線戰法在多頭走勢做多，要配合波浪型態、趨勢方向多頭及K線進場訊號。主要操作方法說明如下：\n\
    \n**進場時機**\n\n- 1. 低檔打底完成，出現暴大量上漲的紅K線，股價要突破前日高點，或突破底部盤整上頸線。\n- 2. 上漲途中回檔後，出現再上漲的紅K線，股價突破前日高點時。\n\
    - 3. 續勢盤整完畢，股價向上，出現突破盤整的暴大量長紅K線時。\n- 4. 強勢飆股的第1根上漲長紅K線高點，被第2根紅K線越過之後，可以買進。\n\n\
    **交易規則**\n\n- **進場** 收盤前確認股價，突破前一日高點時買進。\n- **續抱** 每天收盤前檢視股價，沒有跌破前一日的高點時，續抱。\n\
    - **出場** 收盤前確認股價跌破前一日低點時，出場。\n- **停損** 進場當日K線股價的最低點（不能超過7%）。\n\n## 1. 在空頭走勢空盤的操作定法\n\
    \n用智慧K線戰法在空頭走勢做空，要配合波浪型態、趨勢方向空頭及K線出場訊號，主要操作方法說明如下：\n\n**進場時機**\n\n- 1. 高檔出現不過前面高點的「頭頸低」下跌黑K線，以及確認頸部完成的下跌黑K線，股價跌破前日低點、跌破頸部盤整下頸線的位置。\n\
    - 2. 下跌途中出現反彈後再下跌的黑K線，股價跌破前日低點時。\n- 3. 下跌中，續勢盤整完畢，股價向下跌破盤整區時。\n- 4. 確認空頭的第1根下跌黑K線，第2根跌破低點的黑K線，可以放空。\n\
    \n**交易規則**\n\n- **出場** 收盤前確認股價跌破前一日低點時，放空。\n- **續抱** 每天收盤前檢視股價，沒有突破前一日的高點時，續抱。\n\
    - **進場** 收盤前確認股價，突破前一日高點時，出場（回補）。\n- **停損** 進場當日K線股價的最高點（不能超過7%）。\n\n## 遇到一日反轉的操作方法\n\
    \n當遇到一日反轉情況時，此時如要採取智慧K線戰法，必須配合波浪型態、看趨勢方向及K線進出場訊號，主要操作方法說明如下：\n\n**進場時機**\n\n-\
    \ 1. 出現跌深或急跌的一日反轉或V型反轉型態。\n- 2. 出現漲多或急漲的一日反轉或倒V型反轉型態。\n\n**交易規則**\n\n- **進場**\n\
    \    - （1）在前面急跌的前提下：\n        - 出現大量。\n        - K線呈現長下影線、十字線、墓碑線、錘子等止跌變盤線訊號。\n\
    \        - 第2天出現上漲的紅K線，股價收盤過前一日高點，進場做多。\n    - （2）在前面急漲的前提下：\n        - 出現大量。\n\
    \        - K線呈現長上影線、十字線、T字線、吊人線等止漲變盤線訊號。\n        - 第2天出現開低下跌，收盤跌破前一日低點的黑K線，進場做空。\n\
    - **停損** 每天收盤前檢視股價，做多的股票沒有跌破前一日低點時，續抱，做空的股票沒有突破前一日的高點時，續抱。\n- **出場** 做多，收盤前確認股價，跌破前一日低點，出場；做空，收盤前確認股價，突破前一日高點時，出場（回補）。\n\
    - **止損** 做多，以進場當日K線股價的最低點為停損點；做空，以進場當日K線股價的最高點為停損點。\n\n## 智慧K線戰法的7項重點注意\n\n- 1.\
    \ 如果想操作長波段，可採用個股的週線圖，以週線圖走勢按照紀律操作。\n- 2. 無論何時進場，必須遵守停損停利的紀律。\n- 3. 資金的分配投入要靈活，走勢明朗時可加大資金投入，走勢不明或有疑慮時，應小量資金投入或退出操作。\n\
    - 4. 如果行情走單邊市場（一直多或一直空）這個方法就很好用，但是遇到上下震盪盤整時就會經常停損，因此在選擇商品標的時要特別注意，要挑選走勢清楚的個股。\n\
    - 5. 走勢平緩時不易獲利，上升或下跌的角度低於45度的走勢，則不建議用此方法。\n- 6. 走勢強勁時，進行短線快速獲利的交易（上升或下跌的斜率在45度以上），往往能夠簡單輕鬆快速獲得最大利潤。\n\
    - 7. 在快速上漲或下跌時應用此一方法，能夠明確的停利，對不知道如何停利的投資人來說，是很好的方法。\n\n## **頭部漲達低點，底部盤整後上攻**\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_251_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ### ▲上圖說明：\n\n- ⒉ 出現「底底高」、暴大量突破底部盤整格局，看日線進場後，用週線的智慧K線戰法操作。\n- ⑳ 當週收黑K線，但是收盤價並未跌破前週的最低價，持股續抱。\n\
    - ⑳ ⑤⑺ 當週收黑K線，收盤價跌破前週的最低價，持股賣出。\n- ㉘ ⑥ ⑧ 趨勢維持多頭，收盤價突破前週高點，買進。\n- ⑲ 當週收黑K線，收盤價跌破前週的最低價，持股賣出。走勢繼續下跌，頭部形成，多頭結束。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_252_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ### ▲上圖說明：\n\n- ⑪ 跌深，出現長下影線、長黑K線的止跌訊號。\n- ⑫ 出現大量長紅K線，收盤價突破前面3天高點，同時突破下降切線，可以進場搶反彈。（此處是跌深的第1支腳反彈，並不是打底回升。）\n\
    - ⑬ 用智慧K線戰法操作。當日收黑K線，收盤價跌破前日的最低價，持股賣出。\n- ⑭ 收盤價突破前日高點，買進。\n- ⑮ 收盤價跌破前日的最低價，持股賣出。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_253_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ### ▲上圖說明：\n\n- ⑪ 高檔出現「頭頭低」的長黑K線，股價跌破前日低點，做空。\n- ⑫ 用智慧K線戰法操作。收盤價突破前日高點，回補。\n-\
    \ ⑬ 收盤價跌破前日的最低點，繼續做空。\n- ⑭ 收盤價突破前日高點，回補。\n- ⑮ 收盤價跌破前日的最低價，繼續做空。\n- ⑯ 收盤價突破前日高點，回補。底部出現打底的第2支腳，結束做空。\n\
    \n# 第 4 篇\n輕鬆就能賺 智慧K線戰法\n第 6 章\n\n# 當整體股價走平，出現連續K線急跌時，\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_254_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n### △上圖說明：\n\n- ⑪ 未跌段出現長黑K線，連續急跌。\n- ⑫ 後3日K線都沒有跌破前一日低點，但未出現過高的K線，不可搶反彈。\n\
    - ⑬ 底部出現破底穿頭的長紅K線，為止跌訊號。但是收盤沒有過前一日高點，觀察即可。\n- ⑭ 次日過前日高點，在7.35元處買進。\n- ⑮ 收盤跌破前日低點，在9元處賣出。\n\
