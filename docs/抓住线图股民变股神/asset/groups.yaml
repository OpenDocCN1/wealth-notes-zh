    聯電(2303) 日線圖 2011/11/10 開 12.75 高 12.80 收 12.55 s 元 量 37232 張 -0.50 (-3.83%)\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_266_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ▲上圖說明：\n\n1. 當波浪型態出現「頭頸低」，跌破3日、10日及24日均線這三條均線，做空。\n2. 當3日均線與10日均線出現黃金交叉，回補。\n\
    3. 當3日均線與10日均線出現死亡交叉，股價跌破3日均線，做空。\n4. 當3日均線與10日均線出現黃金交叉，回補。\n5. 當3日均線與10日均線出現死亡交叉，股價跌破3日均線，做空。\n\
    6. 當3日均線與10日均線出現黃金交叉，回補。\n\n# 第 一 章\n\n# 一年赚「倍获利方法」\n股票获利目标管理\n\n有制度、有企圖的公司，每年都會設定營業目標。有了目標即有中心方向，公司全體上下全力以赴，找方法擬策略，以完成目標為使命。不過，一般散戶在操作時很少會去設定獲利目標，做股票一切隨緣，能賺就賺，不能賺，賠錢就認命了，如此在股海中漂浮，因此很難有成就。\n\
    \n其實，剛開始進入股票市場，就要建立獲利目標管理的觀念。例如，要在多少時間學習完技術分析？要用多少資金操作？操作的獲利目標有多少？如此有計畫的去執行，才能作為後續檢討精湛的依據。\n\
    \n股票獲利目標管理，能夠避免對股價漲跌情緒的反應，訂定出目標，做好交易計畫，依據計畫執行，能夠冷靜的進行每一次交易，是在股市中勝出的重要功課。\n\n##\
    \ 股票獲利目標管理應以一年為周期\n\n股票獲利目標管理，可以年度計畫為周期，因為設定的目標時間如果太短，當遇到行情不好時就很難達成。因此，建議初\n\n\
    步目標設定一年獲利50%為目標，那麼，平均每月的獲利目標約4.2%，加上手續費支出，每月的獲利目標設定為4.25%，這樣去執行，比較容易。\n\n假設你用100萬元操作，全年獲利目標希望能夠賺到50萬元，那麼平均每月要獲利4萬2500元，這樣有金錢的具體數字，就容易管控你的資金了。\n\
    \n- 1. 目標設定，才能有目的執行動作。\n- 2. 目標設定能夠避免人性的貪婪。\n- 3. 做多，選股一定都是上升走勢的個股，會避開下跌或盤整的股票，賠錢立刻出場，因此風險相對最小；做空，選股一定都是下跌走勢的個股，會避開上漲或盤整的股票，賠錢立刻出場，因此風險相對最小。\n\
    - 4. 掌握波段趨勢方向，長線短做，短期累積獲利，一樣可以達到波段操作的效果結果。\n- 5. 以事業經營角度做股票獲利的目標管理，可長可久。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_268_0.png)\n\
    \n做股票不是賭博，是有技術、有方法、有策略、有規律的一項長久的事業經營。\n\n## 1.執行股票獲利目標管理必須注意的重點\n\n選股條件：以主流股、強勢股、開始發動的股票、快速上漲的股票、明日能續漲的股票為操作的標的。\n\
    \n集中火力：以3~5檔股票為原則。\n\n- 操作戰法：\n  - (1) 用智慧K線戰法、快進快出策略，快速達到獲利目標。\n  - (2) 採飆股戰法，條件符合、機會出現，立刻進場；出現虧損，立刻出場；達到獲利目標或出現出場條件，按紀律停利出場。\n\
    \  - (3) 採取短線攻擊戰法，利用二條均線選股進出，可以中小波段操作，並且達到獲利目標。\n\n- 其他要點：\n  - (1) 以題材面、主流面加技術分析進場，完全以技術面操作，並且依據智慧K線戰法的紀律出場。\n\
    \  - (2) 每月20個交易日，不在出手次數的多寡，而是以達每月獲利4.25%為最低目標，這樣認真選股，專注操作，如果一個月只等到兩次好機會，要達成每次獲利2.2%的目標，實非難事。\n\
    \  - (3) 要以長期穩定的態度經營股票操作。\n\n## 2.購買股票的黃金時段\n\n股票市場雖然每天開市交易時間4.5小時，但是交易熱絡的時\n\n\
    間是前後 1 個小時。\n\n早上9點開盤，大盤指數在反應昨天收盤後的國際股市情形，或是發生的重大利多或利空消息，股票則在反應主力大戶今天的企圖或策略。10點以後，交易比較緩慢，大多是散戶在動作。\n\
    \n到了收盤前 1 小時，一些當沖的單開始找機會出場，布局明天的單開始進場，或者主力決定是否要調節的動作，交易開始頻繁，因此我們買股的黃金時間是：\n\n\
    - 1. 開盤9:00~9:30，搶當日強勢上漲的多頭攻擊的股票。\n- 2. 尾盤13:00~13:30，觀察尾盤拉升次日會漲的強勢多頭股票。\n\n###\
    \ 6個進場位的黃金機會\n\n當我們看到強勢上漲的股票時，不能見紅就搶，比如是第3根的長紅K線，很容易引來獲利賣壓。在接近套牢壓力的位置，很容易遇壓折返修正。在空頭走勢中的突然大漲，也要小心切入。\n\
    \n以下6個位置是進場的黃金機會，一定要把握：\n\n- 1. 打底完成「底底高」後，回測不破低點的上漲位置。\n- 2. 多頭盤整完成的大量突破位置。\n\
    - 3. 均線糾結後的放量上攻位置。\n- 4. 強勢股回檔後強勢續攻的起漲點。\n- 5. 創新高後，回測有撐的再上漲位置。\n- 6. 未升段的噴出行情。\n\
    \n## 股票獲利目標管理的4個致勝關鍵\n\n股票獲利目標管理的成功關鍵，在於選股能力要強及百分之百的執行力。以下並提供4個致勝關鍵：\n\n- 1. 要達成目標→停利比停損重要\n\
    - 2. 獲利要有效率→短線比長線重要\n- 3. 注意時間成本→強勢比漲勢重要\n- 4. 紀律執行→執行與選股一樣重要\n\n要達成獲利目標，一定要執行停利，否則獲利回跌，浪費一次獲利機會及操作的時間。\n\
    \n短線能夠快速獲利，目標才易於掌握，除非等到大波段的機會，否則要抓住每個能夠快速獲利的機會操作。當買進後是飆股走勢，利用飆股戰法操作；如果是強勢波段股，可以長線短做，無論如何都要以獲利為第一目標。\n\
    \n由於股票獲利目標管理有時間上的限制，所以要選擇強勢股操作，一些緩慢牛步上漲的股票，一週半月上上下下漲不到5%的多頭股票，都要換成強勢股操作。\n\n選到好股票，要實現獲利必須執行操作的紀律，例如選股條件的紀律、進場位置的紀律、停損的紀律、持股續抱的紀律、停利的紀律，每一步都要執行紀律，如此才能順利完成每一次的賺錢交易。\n\
    \n## 第10章 認清短線操作的優勢及必備條件\n\n短線交易為交易策略的一種，一般包括當沖、隔日沖、2日到5日的交易。只要屬於短時間內完成進場出場的交易，都算是短線交易。無論是做長線波段，或是短線快進快出，只要方法正確，執行力百分之百，都能在股市中累積財富。\n\
    \n### 短線操作的6大優點\n\n短線操作戰法尤其適合一般金額不大的投資人，利用短線交易是最佳快速累積資本的方法。在後面文章介紹短線操作戰法之前，本章先說明短線操作的特性及重要觀念。\n\
    \n- 以下為短線操作的6大優點：\n  - 1. 任何趨勢、任何大小波段都有交易機會賺錢\n    - （1）多頭時，賺上升波或乖離過大的回檔。\n  \
    \  - （2）空頭時，賺下跌波或反彈波。\n    - （3）盤整時，賺高低差價。\n    - （4）以短線交易累積利潤的方式，往往績效比不長不短的操作更好。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_273_0.png)\n\n### 2. 資金運用效率更高\n\n資金效率是指在某一固定時間內的獲利率，也就是要加上時間成本的觀念。例如，甲股進場一個月時間獲利30%，乙股進場4個交易日獲利12%，以資金運用效率而言，乙股優於甲股。\n\
    \n### 3. 能夠快速累積交易經驗\n\n股市進出，無論是投資期間的長短，交易知識及方法大體相同。換句話說，如果短線做不好，中長線一樣也不會做好，因此，頻繁的短線進出，反而能夠快速累積經驗。\n\
    \n對於初進股市的投資人而言，最缺乏的就是操作經驗，短線交易正好可以練習自己的「定法」是否正確，當知道如何進出獲利之後，要不要做中期或長期操作，只是個人的選擇而已。\n\
    \n### 4. 更容易控制風險\n\n短線交易謀取短時間的利潤，當交易失敗時要立刻出場，因此交易風險反而控制在極小範圍。短期交易的進出點，不完全考慮公司的基本面，純粹以技術面為進出依據，反而交易紀律明確。\n\
    \n### 5. 最適合資金小的投資人快速累積第一桶金\n\n資金只有20萬元、30萬元的投資人，可以操作小型飆股，買進的數量不多，可以快進快出，適合利用短線交易的戰法，集中火力，專注在快速獲利的強勢股票進出，快速累積人生第一個一百萬。\n\
    \n### 6. 短線機會多\n\n經驗法則告訴我們，以下狀況都會造成短線股價的波動，對操作短線的人來說，都是值得注意的賺錢機會。\n\n- (1) 季報公布前，行情變動很大。\n\
    - (2) 台指期貨及摩台指期貨結算時，股價波動明顯。\n- (3) 明顯的利多不漲或下跌，明顯的利空不跌或上漲。\n- (4) 美國股市的大跌，市場容易反應開低走高。美國股市大漲，市場容易反應開高走低。\n\
    - (5) 一些季節題材，如節氣變盤說、寒暑假旺季的觀光股及遊戲股、年初的生技股、年底航運股旺、長假的消費性支出、選舉行情等等。\n- (6) 反應完突發性利空造成的恐慌下跌後的上漲，或是反應完突發性利多造成的急漲冷靜後的回跌。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_274_0.png)\n\n大賺小賠是股市致富的不變道理，要會「停利」才能大賺，要會「停損」才能小賠，因此「停利」及「停損」是股市操作必修的功夫。\n\
    \n## 短線交易的成本計算\n\n短線交易的次數比較頻繁，因此會造成交易成本的增加，以下舉例說明股票交易1次的成本計算方式。\n\n- 以某股票為例：買進50元，賣出53元，買5張\n\
    \  1. 融資買進：成交金額：50元×5000股=250,000元\n     買進手續費：50元×5000股×0.001425=356.25元\n  \
    \   應付券商款項：250,000元+356.25元=250,356元\n  2. 融券賣出：成交金額：53元×5000股=265,000元\n    \
    \ 賣出手續費：53元×5000股×0.001425=377.625元\n     交易稅：265,000元×0.003=795元\n     融券手續費：265,000元×0.0008=212元\n\
    \     投資人應收款項：265,000元-377元-795元-212=263,616元\n  3. 獲利：263,616元-250356元=13,260元\n\
    \n- 以上面股票為例：買進50元，賣出53元，買5張\n  簡便計算方式：一次當沖成本≒股價×1.007倍\n  成交金額：50元×5000股=250,000元\n\
    \  買進成本×1.007倍：50元×1.007=50.35元\n  獲利：(53元-50.35元)×5000股=13,250元\n\n## 短線操作的重點攻略\n\
    \n想要短線操作能夠成功，建議你要有以下4項基本功：\n\n**1. 掌握國際及大盤的趨勢方向**\n\n順勢操作永遠是事半功倍，短線操作的人更要注重趨勢的方向，從大環境評估目前的股票處在哪種市場氛圍中是很重要的。\n\
    \n**2. 精通技術分析具備選股能力**\n\n短線操作不能光靠感覺去判斷，必須熟稔技術分析所反應的股市真實心理狀態。技術分析約有數十種，基本上只要學好波浪型態、K線、均線、成交量、KD指標、RSI指標，就足以應付短線操作。\n\
    \n**3. 專注在1到3檔股票的操作，最多不能超過5檔**\n\n短線操作必須全神貫注，如果持股家數太多，往往無法面面俱到，一有風吹草動，將會手忙腳亂，而且過多的持股，會造成獲利及損失的互抵，降低獲利率。\n\
    \n**4. 百分之百的操作執行力**\n\n短線操作的成敗即在於果斷的執行力，否則機會往往稍縱即逝，因此，膽要大，心要細。\n"
  mdcn: "\n## 二、均線戰法做多規則\n\n想用一條均線戰法在多頭走勢做多，必須注意以下的交易規則：\n\n- 進場：低檔打底完成出現暴大量上漲的紅K線，股價站上20日均線之上，且均線走平或上揚，買進。上漲行進中，跌破20日均線後出場，當股價再站上20日均線，且20日均線仍持續向上時，繼續做多。\n\
    - 續抱：收盤股價沒有跌破20日均線時，續抱。\n- 出場：收盤前確認股價跌破20日均線時，出場。\n- 止損：進場後，守20日均線。\n\n## 三、均線戰法做空規則\n\
    \n想用一條均線戰法在空頭走勢做空，必須注意以下的交易規則：\n\n- 進場：高檔做頭完成的下跌長黑K線，股價跌破20日均線之下，且均線走平或下彎，做空。行進中，突破20日均線出場後，當股價再跌破20日均線，而且20日均線仍持續向下時，繼續做空。\n\
    - 續抱：收盤股價沒有突破20日均線時，續抱。\n- 出場：收盤前確認股價突破20日均線時，出場（回補）。\n- 止損：進場後，守20日均線。\n\n- 1.\
    \ 採用一條均線操作，固然方便，但是採用不同週期均線的差別很大。\n- 2. 採用短期3日或5日均線操作，股價與均線會出現頻繁交叉的現象，不斷地發出買進賣出訊號，因此，錯誤的訊號及騙線機會比較多。\n\
    - 3. 採用3日或5日短期均線，由於上下變化快速，均線方向忽上忽下，不易把握長期趨勢方向。這個問題可利用長短期不同的2根均線來解決，或者用3根均線來解決。讀者可以參看本篇第8章「穩健獲利方法：三條均線操盤法」或第11章「獲利目標達成功利器1：短線攻擊的二條均線戰法」。\n\
    - 4. 採用長週期的均線，例如20日、60日均線，所產生的錯誤及騙線的訊息及進出次數會少很多，但卻有緩不濟急的現象，因為，等待股價與均線交叉時，往往都是漲了一段或已下跌一段了，容易延遲進出場的時機。\n\
    - 5. 建議用一條均線時，不要用太短或太長的均線，採用10日或20日均線為宜。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_259_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n▲上圖說明：\n\n⑪ 20日均線。\n\n⑫ 出現一根長紅K線站上20日均線，但是多頭型態未打底，而且均線仍然下彎，觀察即可，不可動作。\n\
    \n⑬ 出現「底底高」的紅K線，而且站上20日均線，均線上揚，買進。\n\n⑭ 收盤價跌破20日均線，賣出。\n\n⑮ 收盤突破20日均線，均線方向向上，買進。\n\
    \n⑯ 收盤價跌破20日均線，賣出。波浪型態已出現「頭頭低」（峰峰低），股價盤整，停止操作。\n\n## 三、依均線或波趨勢多頭交易原則\n\n### 依均線或波趨勢多頭交易原則\n\
    \n# 第四篇 第2章 一線定江山 簡易的一條均線戰法\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_260_0.png)\n\
