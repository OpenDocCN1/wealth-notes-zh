    \ 量大增，開高走低，出現黑K線，代表高點已到，迅速賣出。\n\n獲利目標達成利器2：短期賺高額報酬的飆股戰法\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_298_0.png)\n\
