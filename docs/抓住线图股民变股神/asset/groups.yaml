  - '[PAGE 95]


    # 每日一定要做的分析研究


    現在資訊發達，網路盛行，每天可以看到許多的資料，當然，如果你是專業人員，分析的資料可能層次比較高，例如電子類股票，會分析國際上電子相關的產業公司的狀況。


    你也會收集國際主要國家發表的各項經濟數據做分析，對世界各地的政經政策也會提出看法，可是對一般投資小民，恐怕無法做到這些境界。但是，有些貼近台灣股市，短期會影響股市的資料，即使是一般投資人，還是要每天紀錄觀察，可以幫助投資人瞭解股市動盪的原因及可能對股市造成的影響。


    +   1. 國際股市要看美國、德國、法國、英國、中國、香港、韓國及日本的盤勢，這些國家的經濟都會影響台灣股市。


    +   2. 台灣股市每天要看走勢的變化，包括日線、週線，長期的方向則要看月線。


    +   3. 價量的變化要分析，尤其是轉折的位置、成交量的變化，能夠透露主力的企圖，必須列為每天一定要分析的資料。


    +   4. 現在外資對台股的影響很大，因此每天要紀錄外資的進出，另外，對外資在期貨上的多空布單也要認真看待。


    +   5. 要看國內前五大及前十大交易人及特定法人的期貨多空未平倉單變化。


    +   6. 每日三大法人的買賣超、市場融資融券的變化資料。


    +   7. 台股收盤後的各項數據，例如當天收盤價、開盤價、最高價、最低價、短中長期均線變化。


    +   8. 各類股的走勢狀況、交易資金分配狀況，以及對大盤的可能影響。'
  md: "\n# 第 1 篇\n\n## 股市賺錢的最高心法：等、確認、集中火力、學到做到\n\n### 學到、做到 才能勝過贏家\n\n很多投資人很努力，花錢買書來看，繳費上課學習，但是操作績效還是沒有改善，關鍵在於沒有「學以致用」。\n\
    \n說實在的，股票要學的知識真的不多，大概只要看不同的10本書就可囊括了，這些不多的知識，在操作時卻往往做不到，才是投資人一直不能成功賺錢的原因。由於股票市場不是個平靜穩定的市場，每天上下波動，深深牽動投資人那顆不安定的心，身在股海，心不由己。\n\
    \n大家都知道，軍隊訓練是為了要打戰，為了怕士兵真的上戰場時驚惶失措，所以在平時有所謂的「軍事演習」，操作股票的自我訓練，同樣要「股海操練」，把自己所學的實際應用，建立信心和習慣，才能改變賠錢的命運。\n\
    \n「一次完整賺錢的經驗」是非常重要的經歷，用少量的5～10萬元資金，根據所學的知識，挑選一檔當下有題材、符合技術圖形多頭起動的位置，買進一張股票，選擇一種固定的操作方法，然後要求自己絕對按照紀律進出，該停損時停損，該買進時買進，該停利時停利，一直做到趨勢改變為止，如此守紀律完整的操作一次，相信會有很大的收穫及體悟，下決定心試一次吧！\n\
    \n### 學到什麼就要做到什麼 才能致勝\n\n前面說明成為贏家，要把平常學到的知識在操作時做到。首先，各位要徹底瞭解技術分析上學到一些名詞的定義，然後要知道股票操作時做什麼動作，最後還要做到哪些動作。\n\
    \n1. 多頭走勢\n   - 定義：股價一直創新高，回檔時不破前面低點。\n   - 動作：做多買進，買進的位置請看第 3 篇「技術分析進階」。\n\n\
    \   ![](img/e6a266bab53ec29e9cf6f50724f4d142_77_0.png)\n\n2. 多頭回檔\n   - 定義：多頭上漲一段後的下跌修正，回檔時不能跌破前面低點。\n\
    \   - 動作：回檔下跌時，不可預測止跌的位置買進，要「等到」出現止跌訊號，第 2 天不再跌破前一天低點，同時收盤前確認上漲過前一天高點的紅 K 線後買進，也就是「回後買上漲」。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_77_1.png)\n\n3. 多頭休息\n   - 定義：多頭上漲一段後出現「頭頭低」現象，波浪轉折高點不過前面波浪轉折高點而下跌，注意！這與「多頭回檔」不同，多頭回檔是突破前面高點後才下跌。\n\
    \   - 動作：持有多單的要退出，避開股票進入盤整或反轉的風險。空手投資人不可有做多或做空的動作，要「等到」趨勢明朗時再說。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_78_0.png)\n\
    \n4. 多頭盤整\n   - 定義：多頭上漲一段後出現「頭頭低」現象，波浪轉折高點不過前面波浪轉折高點而下跌，下跌時沒有跌破前面波浪轉折低點就上漲，股價橫向發展成「高不過高、低不破低」的區間盤整。\n\
    \   - 動作：盤整時勿操作，「等到」盤整結束，股價大量突破盤整區時，做多買進；股價跌破盤整區，為做頭反轉，可以做空。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_78_1.png)\n\
    \n5. 多頭反轉\n   - 定義：多頭上漲一段後出現「頭頭低」之後，又出現跌破前面低點，呈現「底底低」格局。\n   - 動作：符合空頭型態，思考做空，「等到」反彈不過前面高點，再往下跌時，做空單賣出。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_79_0.png)\n\n6. 空頭走勢\n   - 定義：股價一直創新低，反彈時不過前面高點。\n\
    \   - 動作：做空賣出，賣出的位置請看第3篇「技術分析進階」。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_79_1.png)\n\
    \n7. 空頭反彈\n   - 定義：空頭下跌一段後的跌深短線反彈，反彈時不能突破前面高點。\n   - 動作：股價反彈上漲時，不可以預測會彈到哪個位置而去做空，要「等到」出現止漲訊號，不再突破前一天高點，同時第2天下跌，跌破前一天低點的黑K線確認後再做空，也就是「彈後空下跌」。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_80_0.png)\n\n8. 空頭休息\n   - 定義：空頭下跌一段後，出現「底底高」現象，波浪轉折低點不破前面波浪轉折低點而上漲。注意！這與「空頭反彈」不同，空頭反彈是跌破前面低點後才上漲。\n\
    \   - 動作：持有空單的要回補退出，避開股票進入盤整或反轉的風險。空手投資人不可有做多或做空的動作，要「等到」趨勢明朗之後再說。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_80_1.png)\n\
    \n9. 空頭盤整\n   - 定義：空頭上漲一段後出現「底底高」現象，波浪轉折低點不破前面波浪轉折低點而上漲，而上漲又沒有突破前面波浪轉折的高點又下跌，股價橫向發展成「高不過高、低不破低」的區間盤整。\n\
    \   - 動作：盤整時勿操作，「等到」盤整結束，股價大量突破盤整區時，做多買進；股價跌破盤整區，為續勢空頭，可以繼續做空。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_81_0.png)\n\
    \n10. 空頭反轉\n    - 定義：空頭下跌一段後，出現「底底高」現象，之後又出現突破前面高點，呈現「頭頭高」現象。\n    - 動作：符合多頭型態，思考做多，「等到」回測不破前面低點，再往上漲時，做多買進。\n\
    \n    ![](img/e6a266bab53ec29e9cf6f50724f4d142_81_1.png)\n\n11. 盤整\n    - 定義：股市走勢不符合多頭定義，也不符合空頭定義，往橫向發展。盤整位置又分為底部盤整、續勢盤整與頭部盤整。\n\
    \    - 動作：進入盤整區，建議退出觀察，因為盤整期間可以是一週，也可以長達數月之久，資金不宜留在盤整區。任何位置的盤整，都是另一次上漲或下跌的機會，最好的策略就是「等待」，「等到」盤整結束，向上帶量突破時，做多；向下跌破時，做空。\n\
    \n12. 停損\n    - 定義：停止讓損失擴大，賠錢賣出。停損是進入股市避開危險的煞車機制。\n    - 動作：任何時候進場做多或做空，都要設定停損；股價到達停損時，要果斷執行停損。\n\
    \n13. 停利\n    - 定義：結束操作，出脫股票，讓獲利入袋。停利是進入股市是否能夠賺錢的關鍵動作。\n    - 動作：股價到達預定目標價附近，股價出現不再繼續的現象，停利出場；股價獲利到達自訂交易規則出場條件時，停利出場。\n\
    \n14. 假突破\n    - 定義：股價上漲突破壓力後，3天內跌回到壓力下方。壓力包括股價前高、盤整區的上頸線、均線、下降趨勢線、缺口等。\n    -\
    \ 動作：按照交易紀律進場買進，如果出現假突破，要立刻出場，避開真下跌的風險；假突破後出現真下跌，要反手做空。\n\n    ![](img/e6a266bab53ec29e9cf6f50724f4d142_83_0.png)\n\
    \n15. 假跌破\n    - 定義：股價跌破支撐後，3天內上漲回到支撐上方。支撐包括股價前低、盤整區的下頸線、均線、上升趨勢線、缺口等。\n    -\
    \ 動作：按照交易紀律進場做空，如果出現假跌破，要立刻出場，避開真上漲的風險；假跌破後出現真上漲，要反手做多。\n\n    ![](img/e6a266bab53ec29e9cf6f50724f4d142_83_1.png)\n\
    \n聖嚴法師法語：「把自己的心轉過來，運也就好轉過來。」股市何尝不是如此，運隨心轉，觀念改變，動作改變，賠錢的命運也就改變。\n\n# 第 2 篇\n\n\
    ## 鐵進股市的前置備戰作業\n\n操作股票的搬檔是最後的結果。前道的學習、準備的過程才是執行成功的原因。\n\n如果不花時間整個學習、訂定策略與操作，就想像到搬檔的結果，可謂「緣木求魚」。\n\
    \n讓我們來強制腦右點餘觀無手，下了彎路「長痛」長做的錯誤。\n\n### 第 1 章 想用股票致富 進場前你必須做好的準備\n\n一般人總把股票交易看成是一件很簡單的事，認為只要在低價時買進、高價時賣出，不就成了。因此，總是很輕率的就投入資金，等到手上持有股票時，才發現股價上上下下，跌了要不要賣？漲了要不要跑？不知道如何是好。\n\
    \n我們拿錢投入股市，如同投資其他事業一樣，要認真面對它，如果漫不經心，沒有整體規畫及策略，那麼一定會損失大筆金錢。\n\n其實，幾千年前的《孫子兵法》第一章「始計篇」中強調的「廟算」觀念，即說明了同樣的道理。孫子說：「夫未戰而廟算勝者，得算多也；未戰而廟算不勝者，得算少也。多算勝，少算不勝，而況於無算乎？吾以此觀之，勝負見矣。」\n\
    \n孫子的意思是指，作戰之前，就預計可以打勝戰的一方，是因為在開戰前就已經分析過敵我的利弊條件，制定作戰攻防策略、籌劃周密的结果；作戰之前，就預計無法打勝戰的一方，則是因为在開戰前就欠缺戰勝條件、籌劃不夠周密的结果。作戰之前，條件具備、籌劃周密、策略完備的一方就能夠取勝；條件不全、籌劃不周、策略錯誤的一方，就無法取勝，更何況是不做準備、沒有籌劃、毫無條件、沒有策略的人呢？\n\
    \n股票市場就如同戰場，不瞭解敵人（市場），沒有經過準備訓練，又沒有做事先的評估，計算獲勝的機率，毫無章法就進場投入資金，無非是飛蛾撲火，屍骨無存，不可不慎！\n\
    \n### 從學習到操作股票的完整流程\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_88_0.png)\n\n\
    ### 進場前你該學習的專業知識\n\n做股票要學的專業知識很多，但是一定要先學會以下基本的重要知識：\n\n1. 股票投資基本入門常識\n   投資股票前一定要先了解什麼是開戶、買賣股票、交割集保、本益比、股票淨值、殖利率、股票分類、融資融券、上市上櫃、面值、市值、手續費、證交稅、違約交割、全額交割、市價限價、當日沖銷、除息除權等股市基本常識。\n\
    \n2. 完整的技術分析專業知識\n   技術分析是進入股市的基本專業知識，如同在學校所讀的教科書，任何人只要花時間用功學習，都能學會。技術分析是基本功，具有完整的技術分析能力，基本上，你已經可以判斷一支股票的好壞，但是這並不代表你真的能夠賺到錢，如同大學畢業後，不代表進入社會就會從此一帆風順。\n\
    \   \n   我在這裡特別強調「完整」兩個字，現代社會資訊發達，投資人都懂一些技術分析。問題是，大多數人只是知道一些片面的技術分析，就拿來分析研判，結果當然常常失敗。\n\
    \   \n   例如，上漲有量，追買力道強，可以買進股票，事實上一定是這樣嗎？如果沒有對股價位置、均線變化、K線型態、走勢方向、籌碼數量、指標現象等有完整的綜合考慮，就會經常判斷失誤，進場操作失敗。\n\
    \   \n   完整的技術分析包括：1.波浪型態、2.K線強弱、3.均線切線、4.價位關係、5.MACD、RSI、KD等指標，其中前4項，我稱為技術分析的「四大金剛」，在我的第一本書《抓住飆股輕鬆賺》中有詳細的介紹，讀者可以參考。\n\
    \n3. 研究基本面的專業知識\n   例如解讀公司的財務報表、財務結構、營運方向及未來發展等等。\n\n### 想要靠股票致富的聰明方法\n\n很多人都會問：「做股票真的有賺錢的方法嗎？」答案是「有的」。\n\
    \n早在1983年，美國芝加哥知名交易員理查·丹尼斯（Richard Dennis），當時他37歲，已經用幾百美元賺到數百萬美元。他認為，賺錢的操盤員不是天生的，只要經過適當的訓練，任何人都能學會如何交易。丹尼斯本身就是用技術分析操作的成功交易員。\n\
    \n當時他的合夥人威廉·艾克哈特（William Eckhardt）並不同意丹尼斯的看法，艾克哈特認為，投機操作的能力是一種天生的感覺、主觀、直覺的天賦。\n\
    \n為了證明各人的論點，他們倆在1983～1984年做了一個實驗，招募各行各業各個階層，不同年齡、學歷、生長背景的一群有意願學習交易的學員，花了兩個星期教導他們所需要知道的商品知識，以及一套簡單、易於遵守的交易規則，完成課堂學習指導之後，每個學生都分配到100萬美元資金以供交易。其中，許多學員每年獲利可達100%甚至更高。\n\
    \n這個出名的實驗訓練，就是後人眾所周知的「海龜特訓班」。丹尼斯的實驗證明，在一切條件相同下，任何人都能學會股市賺錢的方法！\n\n每個投資人都有一套自己操作的方法，有些人憑感覺買股票也能賺錢，有人做當天沖銷賺錢，有人用基本面財報賺錢，有人等大機會做波段賺錢，方法百百種，能夠賺錢的就是好方法，怕就怕沒有方法就到股市亂衝，頭破血流事小，粉身碎骨也不意外。\n\
    \n所以，一定要先學會幾種操作股票的方法，再到戰場練兵，本書第4篇介紹多種不同的操作方法，讀者可以選擇適合自己個性的方法，先用小錢（10萬元就夠了）開始練習，在實際操作中去感受，再用實際經驗去做修正，慢慢找到你可以信任的賺錢方法。\n\
    \n### 培養操作功課必備的7種能力\n\n在股票操作過程中要具備一些能力，這些能力的強弱，直接影響操作績效的好壞。所以，我們一邊操作，一邊要在操作實際經驗中提升以下7種能力：\n\
    \n1. 看圖選股的能力\n   選股的能力不是單純指技術分析，技術分析固然可以幫助我們研判圖形的走勢，但是一些實務上的經驗，更能提高判別的準確度。例如，圖形無法看出這檔股票是否為主流類股，圖形無法知道股票的基本面，所以公司基本面、產業未來發展情形、當下主流股、熱門題材等等這些都是選股的能力範圍。\n\
    \   \n   看圖的能力是可以經由不斷的練習來提升！俗話說：「熟能生巧」，如同跳舞一樣，基本的舞步不純熟如何能夠跟上音樂？如何顧到姿勢？如何變換花式？更不可能做到行雲流水的動作了。\n\
    \n2. 執行停損的能力\n   「停損」只有兩個字，能夠做到，可是一項不容易的能力，因為沒有經過一段時間的毅力、決心的訓練，一般凡人是很難每次都做到的，偏偏執行停損的能力是古今中外，任何成功投資者的必備條件。\n\
    \   \n   要在股市生存，一定不能大賠、慘賠到重傷不起，股市做到小賠的唯一方法只有「停損」這兩個字。股市中再大的風險，只要執行停損都能夠避開，這項「執行停損」的能力，就如同車子的煞車系統，不能沒有。\n\
    \n3. 果斷停利的能力\n   我們到股市投資，當然不是來停損消費或娛樂的，投入股市的目的是為了「賺錢」，操作的重點正在此處。無論要賺「大錢」或「小錢」，都要具有「停利」的能力。不會「停利」，如同入竄山，空手而回，難怪股市中說：「會停損是徒弟，會停利才是師傅。」\n\
    \   \n   許多人會選股、會停損，可是仍然覺得很難賺到錢，原因是欠缺「停利」的訓練。我追隨李大師學習的兩年期間，他曾經在技術分析教室告訴我們，停利要「狠」。該貪的時候要貪，不該貪的時候不能貪，到達獲利目標，在技術分析出現該賣的訊號，或者出現自己紀律交易的出場條件，就要狠狠的賣出股票，獲利入袋。\n\
    \   \n   「停利」有兩個重要的意義，第一當然是讓獲利入袋，第二是「避險」。該賣出卻不賣出，非但獲利被吐回（這就是賺不到錢的原因），如果行情是反轉，反而要賠錢。因此，沒有「停利」能力，在股市中是難以賺錢的。\n\
    \n4. 反敗為勝的能力\n   固然「勝敗乃兵家常事」，股市中只有贏家與輸家，要成為長期的贏家，就必須要具備「反敗為勝的能力」。\n   \n   股市變化理由錯綜複雜，再厲害的高手也難免馬失前蹄，對瞬息萬變的股市要具備應變的能力，如果掉到敗部，必須能夠反敗為勝。\n\
    \   \n   例如2011年11月下旬，台灣股市低迷不振，大多數股票處在下跌的空頭，手中持空單的人很多，在11月30日晚上，中國突然發布調降存款準備率2碼，國際股市應聲大漲，美國道瓊指數更是大漲490點，這樣的突發性經濟利多，當然會立刻反應到第2天台股的走勢，這時必須採取斷然措施立刻回補空單，千萬不能漠視不管。\n\
    \   \n   股票「反敗為勝」最重要的方法就是「汰弱換強」，汰弱只是止血，還要「換強」才能反勝，當手上股票弱勢或賠錢時，要立刻「汰弱換強」。\n\n5.\
    \ 操作短線或波段的能力\n   股市賺錢終究是靠操作，同一檔股票，會操作與不會操作的结果差很多，由於市場的環境不會一成不變，所以要有短線操作的能力，當波段獲利的機會來時，要有操作波段的能力。本書第4篇分別介紹多種操作方法，當然讀者要自己經過實際操作，才能靈活應用。\n\
    \n6. 守株待兔的能力\n   讀者可能會認為「守株待兔」就是等待機會而已，哪裡需要什麼能力？如果你也這樣想，那可就大錯特錯了！守株不一定就能等到兔子，看到兔子不一定就能抓到。\n\
    \   \n   守株待兔的能力就是鎖股追蹤的能力，鎖對股票，機會出現，要有勇氣立刻抓住進場的時機進場。\n\n7. 檢討改進的能力\n   每一次的交易都是寶貴的經驗，對初學的投資人來說，每次交易無論賺或賠都要把圖印出來，把當初進場的理由、採用的策略、操作的過程、賣出的理由一一寫下，並且檢討這次的心得，不要嫌麻煩，這是自我成長進步的重要功課。\n\
    \   \n   以上每項能力都很重要，每天能夠要求做到，日積月累，自然能夠提升股市賺錢的功力。\n\n8. 做好情緒管理\n   學習的最後一項，也是最難的一項，就是情緒管理。偏偏情緒又是決定操作成敗的關鍵，無法控制情緒，即使有很好的技術，也無法發揮，像曾雅妮打高爾夫球、王建民投球，臨場的抗壓、心情的起伏，絕對會影響比賽時的表現。\n\
    \   \n   人是情緒動物，任何人都会受到心理面的影響，我們要設法控制自己的情緒，使它的影響降到最低。\n   \n   有人說：「股市如人生」，人的一生起起落落到的終了，沒有幾個人沒有遺憾，大家都说要修行，可是能修成的也沒多少人。人生境遇太複雜，許多時候不是自己能夠掌控的。股市比起人生要單純得多，至少許多地方我們可以預測、可以掌控。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_94_0.png)\n\n### 每日一定要做的分析研究\n\n\
    現在資訊發達，網路盛行，每天可以看到許多的資料，當然，如果你是專業人員，分析的資料可能層次比較高，例如電子類股票，會分析國際上電子相關的產業公司的狀況。\n\
    \n你也會收集國際主要國家發表的各項經濟數據做分析，對世界各地的政經政策也會提出看法，可是對一般投資小民，恐怕無法做到這些境界。但是，有些貼近台灣股市，短期會影響股市的資料，即使是一般投資人，還是要每天紀錄觀察，可以幫助投資人瞭解股市動盪的原因及可能對股市造成的影響。\n\
    \n- 1. 國際股市要看美國、德國、法國、英國、中國、香港、韓國及日本的盤勢，這些國家的經濟都會影響台灣股市。\n- 2. 台灣股市每天要看走勢的變化，包括日線、週線，長期的方向則要看月線。\n\
    - 3. 價量的變化要分析，尤其是轉折的位置、成交量的變化，能夠透露主力的企圖，必須列為每天一定要分析的資料。\n- 4. 現在外資對台股的影響很大，因此每天要紀錄外資的進出，另外，對外資在期貨上的多空布單也要認真看待。\n\
    - 5. 要看國內前五大及前十大交易人及特定法人的期貨多空未平倉單變化。\n- 6. 每日三大法人的買賣超、市場融資融券的變化資料。\n- 7. 台股收盤後的各項數據，例如當天收盤價、開盤價、最高價、最低價、短中長期均線變化。\n\
    - 8. 各類股的走勢狀況、交易資金分配狀況，以及對大盤的可能影響。\n"
  mdcn: "\n# 第 1 篇\n\n## 股市賺錢的最高心法：等、確認、集中火力、學到做到\n\n### 學到、做到 才能勝過贏家\n\n很多投資人很努力，花錢買書來看，繳費上課學習，但是操作績效還是沒有改善，關鍵在於沒有「學以致用」。\n\
    \n說實在的，股票要學的知識真的不多，大概只要看不同的10本書就可囊括了，這些不多的知識，在操作時卻往往做不到，才是投資人一直不能成功賺錢的原因。由於股票市場不是個平靜穩定的市場，每天上下波動，深深牽動投資人那顆不安定的心，身在股海，心不由己。\n\
    \n大家都知道，軍隊訓練是為了要打戰，為了怕士兵真的上戰場時驚惶失措，所以在平時有所謂的「軍事演習」，操作股票的自我訓練，同樣要「股海操練」，把自己所學的實際應用，建立信心和習慣，才能改變賠錢的命運。\n\
    \n「一次完整賺錢的經驗」是非常重要的經歷，用少量的5～10萬元資金，根據所學的知識，挑選一檔當下有題材、符合技術圖形多頭起動的位置，買進一張股票，選擇一種固定的操作方法，然後要求自己絕對按照紀律進出，該停損時停損，該買進時買進，該停利時停利，一直做到趨勢改變為止，如此守紀律完整的操作一次，相信會有很大的收穫及體悟，下決定心試一次吧！\n\
    \n### 學到什麼就要做到什麼 才能致勝\n\n前面說明成為贏家，要把平常學到的知識在操作時做到。首先，各位要徹底瞭解技術分析上學到一些名詞的定義，然後要知道股票操作時做什麼動作，最後還要做到哪些動作。\n\
    \n1. 多頭走勢\n   - 定義：股價一直創新高，回檔時不破前面低點。\n   - 動作：做多買進，買進的位置請看第 3 篇「技術分析進階」。\n\n\
    \   ![](img/e6a266bab53ec29e9cf6f50724f4d142_77_0.png)\n\n2. 多頭回檔\n   - 定義：多頭上漲一段後的下跌修正，回檔時不能跌破前面低點。\n\
    \   - 動作：回檔下跌時，不可預測止跌的位置買進，要「等到」出現止跌訊號，第 2 天不再跌破前一天低點，同時收盤前確認上漲過前一天高點的紅 K 線後買進，也就是「回後買上漲」。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_77_1.png)\n\n3. 多頭休息\n   - 定義：多頭上漲一段後出現「頭頭低」現象，波浪轉折高點不過前面波浪轉折高點而下跌，注意！這與「多頭回檔」不同，多頭回檔是突破前面高點後才下跌。\n\
    \   - 動作：持有多單的要退出，避開股票進入盤整或反轉的風險。空手投資人不可有做多或做空的動作，要「等到」趨勢明朗時再說。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_78_0.png)\n\
    \n4. 多頭盤整\n   - 定義：多頭上漲一段後出現「頭頭低」現象，波浪轉折高點不過前面波浪轉折高點而下跌，下跌時沒有跌破前面波浪轉折低點就上漲，股價橫向發展成「高不過高、低不破低」的區間盤整。\n\
    \   - 動作：盤整時勿操作，「等到」盤整結束，股價大量突破盤整區時，做多買進；股價跌破盤整區，為做頭反轉，可以做空。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_78_1.png)\n\
    \n5. 多頭反轉\n   - 定義：多頭上漲一段後出現「頭頭低」之後，又出現跌破前面低點，呈現「底底低」格局。\n   - 動作：符合空頭型態，思考做空，「等到」反彈不過前面高點，再往下跌時，做空單賣出。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_79_0.png)\n\n6. 空頭走勢\n   - 定義：股價一直創新低，反彈時不過前面高點。\n\
    \   - 動作：做空賣出，賣出的位置請看第3篇「技術分析進階」。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_79_1.png)\n\
    \n7. 空頭反彈\n   - 定義：空頭下跌一段後的跌深短線反彈，反彈時不能突破前面高點。\n   - 動作：股價反彈上漲時，不可以預測會彈到哪個位置而去做空，要「等到」出現止漲訊號，不再突破前一天高點，同時第2天下跌，跌破前一天低點的黑K線確認後再做空，也就是「彈後空下跌」。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_80_0.png)\n\n8. 空頭休息\n   - 定義：空頭下跌一段後，出現「底底高」現象，波浪轉折低點不破前面波浪轉折低點而上漲。注意！這與「空頭反彈」不同，空頭反彈是跌破前面低點後才上漲。\n\
    \   - 動作：持有空單的要回補退出，避開股票進入盤整或反轉的風險。空手投資人不可有做多或做空的動作，要「等到」趨勢明朗之後再說。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_80_1.png)\n\
    \n9. 空頭盤整\n   - 定義：空頭上漲一段後出現「底底高」現象，波浪轉折低點不破前面波浪轉折低點而上漲，而上漲又沒有突破前面波浪轉折的高點又下跌，股價橫向發展成「高不過高、低不破低」的區間盤整。\n\
    \   - 動作：盤整時勿操作，「等到」盤整結束，股價大量突破盤整區時，做多買進；股價跌破盤整區，為續勢空頭，可以繼續做空。\n\n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_81_0.png)\n\
    \n10. 空頭反轉\n    - 定義：空頭下跌一段後，出現「底底高」現象，之後又出現突破前面高點，呈現「頭頭高」現象。\n    - 動作：符合多頭型態，思考做多，「等到」回測不破前面低點，再往上漲時，做多買進。\n\
    \n    ![](img/e6a266bab53ec29e9cf6f50724f4d142_81_1.png)\n\n11. 盤整\n    - 定義：股市走勢不符合多頭定義，也不符合空頭定義，往橫向發展。盤整位置又分為底部盤整、續勢盤整與頭部盤整。\n\
    \    - 動作：進入盤整區，建議退出觀察，因為盤整期間可以是一週，也可以長達數月之久，資金不宜留在盤整區。任何位置的盤整，都是另一次上漲或下跌的機會，最好的策略就是「等待」，「等到」盤整結束，向上帶量突破時，做多；向下跌破時，做空。\n\
    \n12. 停損\n    - 定義：停止讓損失擴大，賠錢賣出。停損是進入股市避開危險的煞車機制。\n    - 動作：任何時候進場做多或做空，都要設定停損；股價到達停損時，要果斷執行停損。\n\
    \n13. 停利\n    - 定義：結束操作，出脫股票，讓獲利入袋。停利是進入股市是否能夠賺錢的關鍵動作。\n    - 動作：股價到達預定目標價附近，股價出現不再繼續的現象，停利出場；股價獲利到達自訂交易規則出場條件時，停利出場。\n\
    \n14. 假突破\n    - 定義：股價上漲突破壓力後，3天內跌回到壓力下方。壓力包括股價前高、盤整區的上頸線、均線、下降趨勢線、缺口等。\n    -\
    \ 動作：按照交易紀律進場買進，如果出現假突破，要立刻出場，避開真下跌的風險；假突破後出現真下跌，要反手做空。\n\n    ![](img/e6a266bab53ec29e9cf6f50724f4d142_83_0.png)\n\
    \n15. 假跌破\n    - 定義：股價跌破支撐後，3天內上漲回到支撐上方。支撐包括股價前低、盤整區的下頸線、均線、上升趨勢線、缺口等。\n    -\
    \ 動作：按照交易紀律進場做空，如果出現假跌破，要立刻出場，避開真上漲的風險；假跌破後出現真上漲，要反手做多。\n\n    ![](img/e6a266bab53ec29e9cf6f50724f4d142_83_1.png)\n\
    \n聖嚴法師法語：「把自己的心轉過來，運也就好轉過來。」股市何尝不是如此，運隨心轉，觀念改變，動作改變，賠錢的命運也就改變。\n\n# 第 2 篇\n\n\
    ## 鐵進股市的前置備戰作業\n\n操作股票的搬檔是最後的結果。前道的學習、準備的過程才是執行成功的原因。\n\n如果不花時間整個學習、訂定策略與操作，就想像到搬檔的結果，可謂「緣木求魚」。\n\
    \n讓我們來強制腦右點餘觀無手，下了彎路「長痛」長做的錯誤。\n\n### 第 1 章 想用股票致富 進場前你必須做好的準備\n\n一般人總把股票交易看成是一件很簡單的事，認為只要在低價時買進、高價時賣出，不就成了。因此，總是很輕率的就投入資金，等到手上持有股票時，才發現股價上上下下，跌了要不要賣？漲了要不要跑？不知道如何是好。\n\
    \n我們拿錢投入股市，如同投資其他事業一樣，要認真面對它，如果漫不經心，沒有整體規畫及策略，那麼一定會損失大筆金錢。\n\n其實，幾千年前的《孫子兵法》第一章「始計篇」中強調的「廟算」觀念，即說明了同樣的道理。孫子說：「夫未戰而廟算勝者，得算多也；未戰而廟算不勝者，得算少也。多算勝，少算不勝，而況於無算乎？吾以此觀之，勝負見矣。」\n\
    \n孫子的意思是指，作戰之前，就預計可以打勝戰的一方，是因為在開戰前就已經分析過敵我的利弊條件，制定作戰攻防策略、籌劃周密的结果；作戰之前，就預計無法打勝戰的一方，則是因为在開戰前就欠缺戰勝條件、籌劃不夠周密的结果。作戰之前，條件具備、籌劃周密、策略完備的一方就能夠取勝；條件不全、籌劃不周、策略錯誤的一方，就無法取勝，更何況是不做準備、沒有籌劃、毫無條件、沒有策略的人呢？\n\
    \n股票市場就如同戰場，不瞭解敵人（市場），沒有經過準備訓練，又沒有做事先的評估，計算獲勝的機率，毫無章法就進場投入資金，無非是飛蛾撲火，屍骨無存，不可不慎！\n\
    \n### 從學習到操作股票的完整流程\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_88_0.png)\n\n\
    ### 進場前你該學習的專業知識\n\n做股票要學的專業知識很多，但是一定要先學會以下基本的重要知識：\n\n1. 股票投資基本入門常識\n   投資股票前一定要先了解什麼是開戶、買賣股票、交割集保、本益比、股票淨值、殖利率、股票分類、融資融券、上市上櫃、面值、市值、手續費、證交稅、違約交割、全額交割、市價限價、當日沖銷、除息除權等股市基本常識。\n\
    \n2. 完整的技術分析專業知識\n   技術分析是進入股市的基本專業知識，如同在學校所讀的教科書，任何人只要花時間用功學習，都能學會。技術分析是基本功，具有完整的技術分析能力，基本上，你已經可以判斷一支股票的好壞，但是這並不代表你真的能夠賺到錢，如同大學畢業後，不代表進入社會就會從此一帆風順。\n\
    \   \n   我在這裡特別強調「完整」兩個字，現代社會資訊發達，投資人都懂一些技術分析。問題是，大多數人只是知道一些片面的技術分析，就拿來分析研判，結果當然常常失敗。\n\
    \   \n   例如，上漲有量，追買力道強，可以買進股票，事實上一定是這樣嗎？如果沒有對股價位置、均線變化、K線型態、走勢方向、籌碼數量、指標現象等有完整的綜合考慮，就會經常判斷失誤，進場操作失敗。\n\
    \   \n   完整的技術分析包括：1.波浪型態、2.K線強弱、3.均線切線、4.價位關係、5.MACD、RSI、KD等指標，其中前4項，我稱為技術分析的「四大金剛」，在我的第一本書《抓住飆股輕鬆賺》中有詳細的介紹，讀者可以參考。\n\
    \n3. 研究基本面的專業知識\n   例如解讀公司的財務報表、財務結構、營運方向及未來發展等等。\n\n### 想要靠股票致富的聰明方法\n\n很多人都會問：「做股票真的有賺錢的方法嗎？」答案是「有的」。\n\
    \n早在1983年，美國芝加哥知名交易員理查·丹尼斯（Richard Dennis），當時他37歲，已經用幾百美元賺到數百萬美元。他認為，賺錢的操盤員不是天生的，只要經過適當的訓練，任何人都能學會如何交易。丹尼斯本身就是用技術分析操作的成功交易員。\n\
    \n當時他的合夥人威廉·艾克哈特（William Eckhardt）並不同意丹尼斯的看法，艾克哈特認為，投機操作的能力是一種天生的感覺、主觀、直覺的天賦。\n\
    \n為了證明各人的論點，他們倆在1983～1984年做了一個實驗，招募各行各業各個階層，不同年齡、學歷、生長背景的一群有意願學習交易的學員，花了兩個星期教導他們所需要知道的商品知識，以及一套簡單、易於遵守的交易規則，完成課堂學習指導之後，每個學生都分配到100萬美元資金以供交易。其中，許多學員每年獲利可達100%甚至更高。\n\
    \n這個出名的實驗訓練，就是後人眾所周知的「海龜特訓班」。丹尼斯的實驗證明，在一切條件相同下，任何人都能學會股市賺錢的方法！\n\n每個投資人都有一套自己操作的方法，有些人憑感覺買股票也能賺錢，有人做當天沖銷賺錢，有人用基本面財報賺錢，有人等大機會做波段賺錢，方法百百種，能夠賺錢的就是好方法，怕就怕沒有方法就到股市亂衝，頭破血流事小，粉身碎骨也不意外。\n\
    \n所以，一定要先學會幾種操作股票的方法，再到戰場練兵，本書第4篇介紹多種不同的操作方法，讀者可以選擇適合自己個性的方法，先用小錢（10萬元就夠了）開始練習，在實際操作中去感受，再用實際經驗去做修正，慢慢找到你可以信任的賺錢方法。\n\
    \n### 培養操作功課必備的7種能力\n\n在股票操作過程中要具備一些能力，這些能力的強弱，直接影響操作績效的好壞。所以，我們一邊操作，一邊要在操作實際經驗中提升以下7種能力：\n\
    \n1. 看圖選股的能力\n   選股的能力不是單純指技術分析，技術分析固然可以幫助我們研判圖形的走勢，但是一些實務上的經驗，更能提高判別的準確度。例如，圖形無法看出這檔股票是否為主流類股，圖形無法知道股票的基本面，所以公司基本面、產業未來發展情形、當下主流股、熱門題材等等這些都是選股的能力範圍。\n\
    \   \n   看圖的能力是可以經由不斷的練習來提升！俗話說：「熟能生巧」，如同跳舞一樣，基本的舞步不純熟如何能夠跟上音樂？如何顧到姿勢？如何變換花式？更不可能做到行雲流水的動作了。\n\
    \n2. 執行停損的能力\n   「停損」只有兩個字，能夠做到，可是一項不容易的能力，因為沒有經過一段時間的毅力、決心的訓練，一般凡人是很難每次都做到的，偏偏執行停損的能力是古今中外，任何成功投資者的必備條件。\n\
    \   \n   要在股市生存，一定不能大賠、慘賠到重傷不起，股市做到小賠的唯一方法只有「停損」這兩個字。股市中再大的風險，只要執行停損都能夠避開，這項「執行停損」的能力，就如同車子的煞車系統，不能沒有。\n\
    \n3. 果斷停利的能力\n   我們到股市投資，當然不是來停損消費或娛樂的，投入股市的目的是為了「賺錢」，操作的重點正在此處。無論要賺「大錢」或「小錢」，都要具有「停利」的能力。不會「停利」，如同入竄山，空手而回，難怪股市中說：「會停損是徒弟，會停利才是師傅。」\n\
    \   \n   許多人會選股、會停損，可是仍然覺得很難賺到錢，原因是欠缺「停利」的訓練。我追隨李大師學習的兩年期間，他曾經在技術分析教室告訴我們，停利要「狠」。該貪的時候要貪，不該貪的時候不能貪，到達獲利目標，在技術分析出現該賣的訊號，或者出現自己紀律交易的出場條件，就要狠狠的賣出股票，獲利入袋。\n\
    \   \n   「停利」有兩個重要的意義，第一當然是讓獲利入袋，第二是「避險」。該賣出卻不賣出，非但獲利被吐回（這就是賺不到錢的原因），如果行情是反轉，反而要賠錢。因此，沒有「停利」能力，在股市中是難以賺錢的。\n\
    \n4. 反敗為勝的能力\n   固然「勝敗乃兵家常事」，股市中只有贏家與輸家，要成為長期的贏家，就必須要具備「反敗為勝的能力」。\n   \n   股市變化理由錯綜複雜，再厲害的高手也難免馬失前蹄，對瞬息萬變的股市要具備應變的能力，如果掉到敗部，必須能夠反敗為勝。\n\
    \   \n   例如2011年11月下旬，台灣股市低迷不振，大多數股票處在下跌的空頭，手中持空單的人很多，在11月30日晚上，中國突然發布調降存款準備率2碼，國際股市應聲大漲，美國道瓊指數更是大漲490點，這樣的突發性經濟利多，當然會立刻反應到第2天台股的走勢，這時必須採取斷然措施立刻回補空單，千萬不能漠視不管。\n\
    \   \n   股票「反敗為勝」最重要的方法就是「汰弱換強」，汰弱只是止血，還要「換強」才能反勝，當手上股票弱勢或賠錢時，要立刻「汰弱換強」。\n\n5.\
    \ 操作短線或波段的能力\n   股市賺錢終究是靠操作，同一檔股票，會操作與不會操作的结果差很多，由於市場的環境不會一成不變，所以要有短線操作的能力，當波段獲利的機會來時，要有操作波段的能力。本書第4篇分別介紹多種操作方法，當然讀者要自己經過實際操作，才能靈活應用。\n\
    \n6. 守株待兔的能力\n   讀者可能會認為「守株待兔」就是等待機會而已，哪裡需要什麼能力？如果你也這樣想，那可就大錯特錯了！守株不一定就能等到兔子，看到兔子不一定就能抓到。\n\
    \   \n   守株待兔的能力就是鎖股追蹤的能力，鎖對股票，機會出現，要有勇氣立刻抓住進場的時機進場。\n\n7. 檢討改進的能力\n   每一次的交易都是寶貴的經驗，對初學的投資人來說，每次交易無論賺或賠都要把圖印出來，把當初進場的理由、採用的策略、操作的過程、賣出的理由一一寫下，並且檢討這次的心得，不要嫌麻煩，這是自我成長進步的重要功課。\n\
    \   \n   以上每項能力都很重要，每天能夠要求做到，日積月累，自然能夠提升股市賺錢的功力。\n\n8. 做好情緒管理\n   學習的最後一項，也是最難的一項，就是情緒管理。偏偏情緒又是決定操作成敗的關鍵，無法控制情緒，即使有很好的技術，也無法發揮，像曾雅妮打高爾夫球、王建民投球，臨場的抗壓、心情的起伏，絕對會影響比賽時的表現。\n\
    \   \n   人是情緒動物，任何人都会受到心理面的影響，我們要設法控制自己的情緒，使它的影響降到最低。\n   \n   有人說：「股市如人生」，人的一生起起落落到的終了，沒有幾個人沒有遺憾，大家都说要修行，可是能修成的也沒多少人。人生境遇太複雜，許多時候不是自己能夠掌控的。股市比起人生要單純得多，至少許多地方我們可以預測、可以掌控。\n\
    \n   ![](img/e6a266bab53ec29e9cf6f50724f4d142_94_0.png)\n\n### 每日一定要做的分析研究\n\n\
    現在資訊發達，網路盛行，每天可以看到許多的資料，當然，如果你是專業人員，分析的資料可能層次比較高，例如電子類股票，會分析國際上電子相關的產業公司的狀況。\n\
    \n你也會收集國際主要國家發表的各項經濟數據做分析，對世界各地的政經政策也會提出看法，可是對一般投資小民，恐怕無法做到這些境界。但是，有些貼近台灣股市，短期會影響股市的資料，即使是一般投資人，還是要每天紀錄觀察，可以幫助投資人瞭解股市動盪的原因及可能對股市造成的影響。\n\
    \n- 1. 國際股市要看美國、德國、法國、英國、中國、香港、韓國及日本的盤勢，這些國家的經濟都會影響台灣股市。\n- 2. 台灣股市每天要看走勢的變化，包括日線、週線，長期的方向則要看月線。\n\
    - 3. 價量的變化要分析，尤其是轉折的位置、成交量的變化，能夠透露主力的企圖，必須列為每天一定要分析的資料。\n- 4. 現在外資對台股的影響很大，因此每天要紀錄外資的進出，另外，對外資在期貨上的多空布單也要認真看待。\n\
    - 5. 要看國內前五大及前十大交易人及特定法人的期貨多空未平倉單變化。\n- 6. 每日三大法人的買賣超、市場融資融券的變化資料。\n- 7. 台股收盤後的各項數據，例如當天收盤價、開盤價、最高價、最低價、短中長期均線變化。\n\
    - 8. 各類股的走勢狀況、交易資金分配狀況，以及對大盤的可能影響。\n"
