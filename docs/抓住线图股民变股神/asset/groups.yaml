    賺錢利器，因此，聰明的投資人多要接觸股票市場的贏家。除了學習基本功之外，最重要的就是吸收他的操作經驗，這樣可以避免自己再走一趟失敗的經驗之旅，不但節省時間，更節省在市場大量買經驗的錢。


    人生有3件憾事，一是遇良師不學，二是遇良友不交，三是遇良機不握。想要成為股市贏家，你要以贏家為範，學習他贏的方法，以贏家為友，學習他贏的風範。


    ## 真正的敵人是自己


    股票市場真正的敵人不是千變萬化無法捉摸的大盤，不是奸詐黑心的主力大戶，而是你自己！


    要從輸家變成贏家，問題的關鍵是「你能否改變自己」，如果你不做任何的改變，你永遠還是原來的你，當你開始做改變，並且以超越自己為進步的動力，有恆心有毅力的堅持去做，才能成為贏家。


    想要成為股市長期贏家，在市場交易行為上大致要符合以下4項原則：


    - 長期贏家一定「順勢而為」：天大地大，趨勢最大，市場第一。要能維持長期賺錢，一定要順著市場的方向去做，與市場做對，絕對討不到便宜。順勢而為，就好比順水划船，輕輕鬆鬆就能獲利。古今中外的股市交易高手哪一個不是多頭時做多、空頭時做空、盤整時休息？如此才能持盈保泰、避開風險。當然，看出市場的方向是最基本的功夫，難在明知多頭而能忍住一時回檔不去放空，或是雖在高檔但行情並未反轉而想放空的心理。

    - 長期贏家一定「嚴守紀律」：守紀律是唯一對付市場千變萬化難以捉摸的方法，世間有很多賺錢的交易規則或是交易程式，重點不是這些方法有多完美，而是操作時能否百分之百的做到，這些規則當然包括避開風險的停損機制。

    - 長期贏家一定「不停的進步，不停的檢討改進」：吸收新知是長期贏家必備的條件，股市也像其他行業一樣，隨著時空的前進而有不同的面貌，要能長久立足，必須時時保持在最佳狀態。

    - 要長期賺到大錢：除了恪守上面3項原則，就是要抓住波段的機會順勢操作，完成數倍的獲利，有計畫的做好資金管理，低調，謙虛，獨自操作，禪修心境，自然就能成為股市的常青樹、不倒翁。


    ## 股票高手必備的絕學


    要成為頂尖高手，「技術分析基本功」、「定法交易獨鬥功」、「恪遵紀律無我功」，此三大股市絕學缺一不可。


    其中的「技術分析基本功」，我在《抓住飆股輕鬆賺》一書中有關技術分析中的「四大金剛」有詳細解說，讀者可以在此一基礎上，繼續增進其他技術指標的知識。


