    （3）部分強勢股出現，採用均線或飆股戰法操作。


    （4）在初升階段，操盤的持股部位可增加到投資金額的4～5成操作，在主升段或未升段可提高持股部位到8成。


    （5）在主升段、未升段，出現大量主流類股、飆股時，要把握操作強勢股的機會，採用「飆股戰法」，短期抓住高獲利。此時不宜做空。


    （6）在上攻階段出現回檔或盤整，應把握續勢向上一機，繼續做多。


    # 3. 高檔盤頭階段


    特徵 平均股價處於高檔位置，主流領導股出現盤頭，融資不斷增加到達高水位，利多不斷，股價浮滯，績優股或上漲強勢股出現跌停板現象，股價上下震盪激烈，市場極為樂觀看好，股市出現天量（台股出現2000億元以上的成交量），大盤進入盤整或出現「頭頸低」的波浪型態。


    兼膽 （1）大盤在高檔做頭，仍有部分主力做價的飆股，採用飆股戰法，短期抓住高獲利。


    （2）當大盤處於高檔階段，績優股大多在高價位，此時不宜採取「價值型投資」策略，不要做長期投資。'
