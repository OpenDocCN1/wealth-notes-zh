    ## 3. 破底穿頭


    股價跌到低檔，繼續破底後出現向上反彈過前面高點的走勢，這種假跌破真穿頭的底部型態，由空頭反轉成多頭後走勢會比較強，我們無法買到在破底的低點，但是可以鎖住穿頭後拉回的「底底高」買進位置。


