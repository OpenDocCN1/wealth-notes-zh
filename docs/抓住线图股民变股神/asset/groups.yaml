    # 22年股市菜鳥

    通曉定法交易獨門功 穩獲變股神


    股市菜鳥想要翻身在股市致富，只要用對方法，永遠不嫌晚，永遠都不遲！朱家泓就是最好的實例！2009年及2010年他每年從股市獲利逾1倍，2011年雖有歐債危機，他在股市獲利也有4成，同年從期指及選擇權交易則賺更多。


    其實，在這之前，他曾当了22年的股市菜鳥，在股市賺少賠多、賺多賠更多！57歲那年，他徹底覺悟，從「心」開始，花了1年精通技術分析，花了3年時間克服人性，同時，做到相信技術分析就像信「神」一樣，因而發展出自己的一套每年看圖選股賺1倍密技，自此開啟他在股市的致富之門！


    他的技術分析課，教室往往爆滿，連走道上都排滿座位，擠得水洩不通；有人甚至從美國特地請長假回來上課，有人則每周從台中、桃園坐高鐵來上課；即使是技術分析基礎課程，有人一上他的課就是2遍、3遍，甚至5遍以上，只為了能夠精通他的股市致富之道。


    他的第一本技術分析基本工具書《抓住個股 輕鬆賺》，一上市即成為財經暢銷書，迄今已經9刷了！


    在上課學員及《抓住個股 輕鬆賺》讀者的催促下，而今，他再次無保留地推出技術分析操作進階工具書《抓住緣圖 股民變股神》，希望讀者除了學到「技術分析基本功」之外，也能學到他的「定法交易獨門功」及「恪遵紀律無我功」，體悟出股票賺錢的道理，邁向股市高手之路。


    已年過60歲的他堅信，「天助自助」，學習股票沒有年齡限制，沒有性別限制，沒有學歷限制，沒有貧富限制，沒有職業限制，任何人都可以學。想要擺脫在股市一直賠錢的輪迴、邁向股市致富之路，他的故事及定法交易獨門功，你一定必學必看！'
  md: "\n（4）具備以上（1）至（3）項條件，以下兩個位置可以做空：\n\n- 1. 積極型投資人：在當天收盤前出現（3）項K線止漲訊號，可以立刻放空。\n\
    - 2. 穩健型投資人：次日開盤向下，跌破上升急切線或股價跌破昨日低點時，可以立刻放空。\n\n停損點設在進場K線的最高點，最多不超過7%。\n\n股價未突破下降急切線，續抱；或股價未突破前日K線高點，續抱。\n\
    \n（1）股價突破下降急切線，立刻出場。\n（2）出現紅K線，出場。\n（3）收盤突破前一日高點，出場。\n（4）收盤突破3日均線時，出場。\n\n## 15\
    \ 葛蘭畢八大法則\n\n葛蘭畢（Granvile Joseph）在1960年提出「移動平均線」的理論，根據他對股價走勢與均線關係的觀察發現，股價在一輪漲跌過程中有4個好買點時機及4個好賣點時機，統稱為「葛蘭畢8大法則」。\n\
    \n「葛蘭畢8大法則」中，在下跌趨勢時的逆勢買點及上漲趨勢時的逆勢賣點，基本上是指股價與月均線乖離率達到15%以上，很容易產生下跌時的反彈或上漲時的回檔，這時要搶短線的反彈或回檔的利潤，操作方法可以參考V形、倒V形反轉戰法。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_317_0.png)\n\n# 第 4 章\n\n## 搶反彈及放空密技\
    \ V形、倒V形反轉戰法\n\nV型反轉與乖離過大的反彈或回檔，這兩者的不同點為：\n\n- 1. V型反轉是指在底部或頭部的位置，乖離過大的反彈或回檔是指在趨勢行進當中出現的波浪型態走勢。\n\
    - 2. V型反轉的目標價是急跌或急漲的起點，乖離過大的反彈或回檔的目標價是靠近月線。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_318_0.png)\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_318_1.png)\n\n### 可成(2474) 日線圖 2011/11/01\
    \ 開 168.00 高 174.00 收 172.00 ↑元 量 8391 張 +2.00 (+1.18%)\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_319_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n**▲上圖說明：**\n\n- ⑪ 出現連續4支跌停板急殺。\n- ⑫ 暴大量開低走高，拉出長紅K線，突破下降切線。\n\
    - ⑬ 符合V型反轉的條件，在收盤前以152元買進，停損點守K線低點141.5元。\n- ⑭ 反彈目標價在急跌的起跌位置。\n- ⑮ 跌破上升急切線，跌破前日K線低點，在176元出場。\n\
    \n總結：操作8天，獲利24元，獲利率15.7%。\n\n# 第 4 篇\n\n## 第1章\n\n# 搶反彈及放空密技 V形、倒V形反轉戰法\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_320_0.png)\n\
    \n**▲上圖說明：**\n\n- ① 出現連續4支跌停板急殺。\n- ② 暴大量開低走高，拉出長紅K線，突破下降切線。\n- ③ 符合V型反轉的條件，在收盤前以31.8元買進，停損點守K線低點27.8元，但是如此一來，停損幅度超過12.5%太大，改守K線的1/2價位29.8元為停損價。\n\
    - ④ 反彈目標價在急跌的起跌位置。\n- ⑤ 跌破上升急切線，接近目標價，在收盤前以38.5元出場。\n\n結算：操作7天，獲利24元，獲利率21%。\n\
    \n資料來源：富邦e01電子交易系統\n\n### 利崴(3043) 日線圖 2011/11/01 開 23.50 高 24.40 收 24.30 ↑ 元\
    \ 益 802 股 +0.40 (+1.67%)\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_321_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n**△上圖說明：**\n\n- 11. 在多頭末升段出現急漲走勢。\n- 12. 創新高後下跌，跌破上升切線及昨日K線低點，出現吞噬的長黑K線，多單要立刻出場，空手可以搶倒V型反轉的獲利機會，短空。\n\
    - 13. 突破下降切線，回補。\n- 14. 波浪形態出現「頭頭低」的下跌走勢，繼續做空。\n- 15. 倒V型反轉下跌的目標價在急漲的起漲位置。\n\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_322_0.png)\n\n資料來源：富邦e01 電子交易系統\n\n**▲上圖說明：**\n\
    \n- ⑪ 出現連續4支跌停板急殺。\n- ⑫ 暴大量繼續下跌。\n- ⑬ ⑭ 連續出現變盤線的止跌訊號。\n- ⑮ 反彈目標價在急跌的起跌位置。\n- ⑯\
    \ 跌破上升急切線，跌破前日K線低點，出場。\n\n### 中美晶：長期上升趨勢，中期回檔洗滌\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_323_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n**▲上圖說明：**\n\n- ⑪ 連續上漲。\n- ② 暴大量，與月線（20日均線）的乖離率達15%。\n-\
    \ ③ 開高低，出現長黑K線，跌破上升切線，回檔向月線修正。\n- ④ 與月線的乖離率達23.4%，回檔向月線修正。\n- ⑤ 與月線的乖離率達21%，回檔向月線修正。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_324_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    **▲上圖說明：**\n\n- ③ 與月線的乖離率達19.6%，跌破上升急切線後向月線修正。\n- ② 與月線的乖離率達18.9%，跌破上升急切線後向月線修正。\n\
    - ③ 與月線的乖離率達13.8%，跌破上升急切線後向月線修正。\n- ④ 與月線的乖離率達12.5%，跌破上升急切線後向月線修正。\n\n說明：多頭走勢上漲乖離率超過12%，跌破上升急切線後，都容易回檔向月線（20日均線）修正。\n\
    \n## 結語\n\n股市的操作方法百百種，以上多種戰法概括短線及波段長線方法，能夠熟練，在不同情況下交互運用，可賺一生財富。\n\n以技術圖形操作，方法愈簡單愈好，簡單才易執行。放棄自我，守紀律機械式操作，該買就買、該賣就賣是獲利致勝的不二法門。\n\
    \n波段操作往往時間長達 3～6 個月，在這期間只要趨勢沒有改變，持股長抱賺得更多，當然也能長線短做，以長護短擴大利潤。\n\n要有正確操作觀念，勇於認錯，看錯做錯，立刻停損認賠。100\
    \ 萬如賠 10 萬，還有 90 萬，另外找好機會低點買進，只要一支漲停、次日開高賣出，10% 就賺回來了；如果死不認錯，100 萬賠掉 90 萬，只剩 10\
    \ 萬，那麼，要再賺回 90 萬，可就很難了。因此，做股票千萬不要硬拗，因為不認錯就會永遠無法翻身。\n\n技術分析加各種指標千百種，自己熟練 1、2 種會賺錢的就好，學太多太繁雜，反而無法果決判斷，猶豫不決是股市操作的大忌。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_325_0.png)\n\n- 股票操作祕訣：\n  1. K線看轉折，均線看方向。\n\
