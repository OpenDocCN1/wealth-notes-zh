    # 第一章

    ## 績效不能夠

    ### 是心理問題


    在我認識的朋友當中，有人手中的股票長期套牢而一直抱著不動，有200元買進的鴻海（2317）、70元買進的友達（2409）、80買進元的國泰金（2882）等，後來這些股票都變成他們口中所謂的「績優股」。可以說，他們在買進股票時，千挑萬選基本面實質價好的股票，當賠錢的時候，就用好的基本面安慰自己，相信公司賺錢，可以配股配息，長期投資也不會吃虧，結果一套就是好幾年，股價腰斬再腰斬，真是太重感情了。


    如果他們能夠採取「定法」操作，必定會設定「停損」的條件，只要依照定法的紀律執行停損，就不會有70元的友達一度跌到11.9元的慘劇發生了。


    ### 定法的意義


    然而，什麼是定法操作？「專注於一」謂之「定」，定法就是「固定的方法操作股票」，這種方法從選股、進場、停損、抱股到出場，都有一定的規則條件，當走勢符合條件時，就執行應該有的作為。


    定法人因股而異，有些方法適合做長線，例如低檔的布局、分批買進做長波段；有些方法適合短線的進出，例如強勢突破時才買進的短線操作。


    不同的定法，採取的規則不同，執行的速度不同，觀盤的環境不同，因此在學習各種戰法的同時，除了要充分瞭解該戰法的特性之外，也要充分瞭解自己操作的個性、操作的环境及能夠承受的風險，然後才能找到完全適合自己的方法。


    一個經由你親身在股票市場執行過，而且能夠讓你穩定賺錢的方法，對你來說，才是好的操作戰法，才是真正屬於你自己的定法。


    ### 定法的5種功能


    有股票投資經驗的人都知道，操作股票最困難的部分就是情緒管理。操作時無法定心，想法變來變去，總是無法定奪，好不容易下定決心敲下電腦，結果卻老是事與願違。


    如果能夠定法操作，過程與結果就會大大不同，固定一種方法操作，最重要的功能就是：「克服心理障礙」。


    定法才能定心，定心才能執法，以下說明定法克服心理障礙的功能：


    - 1. 定法能夠去除追高猜低的心魔


    當股票連續上漲或是連續下跌時，一般投資人的心魔就開始出現。當股票連漲 3 天，空手的人會開始覺得這是檔飃股，不買將會錯失賺錢的機會，於是勇敢的追買到高點。一旦股票連跌多日，則空手的人會心想跌了不少，股價便宜，此時不買可惜，要趕快買進。


    上面這兩種心態，基本上都是個人主觀的認定，甚至是個人的感覺而已，結果大多數人的下場都是賠錢套牢或出場。


    如果能夠遵守定法的規則，股票投資的結果就會大不相同。


    首先，不必去猜測現在股價高不高、是否可以追？或是股價夠低可不可以接？因為在所有的定法紀律中，絕不會有股票的價格，因為股價的高低是相對的比較，而非絕對的數字。


    依據定法的操作紀律決定是否進場，例如現在確認是在下跌走勢，想要進場做多，就必須等到完成打底型態，例如等到出現「底底高」的向上趨勢才行，也就是要等到進場訊號，才去低接，如此勝算才高。


    - 2. 定法能夠去除對基本面的迷失


    許多投資人經常因為太執著於基本面而錯失賺錢的機會，也會因為基本面而套牢大賠。其實，影響一檔股票的漲跌因素很多，單純以基本面去考量，往往會陷入一廂情願的想法。


    因為在股市中的飆股，一飆好幾倍，其中許多飆股的基本面根本不堪目睹。例如玉晶光（3406）在2010年9月2日股價由97.4 元開始飆漲，當時去看這檔股票的基本面，公司的EPS是負數，如此高的股價你敢買嗎？結果之後股價一路漲到2011年1月17日的411元，在4個半月內整整漲了3.2倍。


    - 3. 定法能夠去除對目標價的預期


    每個投資人把錢投入股市時，都抱著賺錢的預期，相信不會有人是因為想賠錢而去買股票。一般人買進股票後，對股價的預期大都由以下4種方式得來：


    - （1）內線消息，例如聽說大股東要把某檔30元的股票做到100元。

    - （2）投顧公司、報紙、雜誌及外資法人的預測。

    - （3）用基本面獲利的本益比、淨值比去估算應有的價位。

    - （4）以技術分析圖形推測出來的目標價。


    以上無論是用何種方式得到的預期股價，原則上都不是百分之百的準確，無法保證能夠達到，所以千萬不能堅信你的目標價一定會到達，否則死抱不放，又是一個慘賠的投資人。


    解決的方法很簡單，無論你的目標價是多少，當股價上漲，出現個人定法中要出場的条件時，就要斷然獲利出場，先獲利入袋再說。


    定法操作可以先避開真的下跌時的損失，如果只是回檔，屆時等到依據定法中合乎買進的條件出現時，再買進即可。如此一段一段往上操作，如果真能如預期到達目標價，你的定法操作絕對比一次抱著賺得更多，而且分段避開風險，是不是既安全又不會少賺？


    - 4. 定法能夠去除受消息面的影響


    股票操作最大的干擾就是消息面，尤其當今社會資訊發達，瞬間就會接到各種的消息，其中真假好壞都有，這些消息都會影響投資人的思考或情緒，如果沒有一套方法做為依歸，將無法下判斷，更無法有紀律的操作。


    - 5. 定法能夠去除盤面變化的影響


    影響投資人情緒最直接的就是盤面的變化，空手時，看到股價上漲手就癢；有股票時，心情更是隨股價波動上下起伏。如果一切都依自己所訂定的方法，那麼，一看到盤面的變動，只要對照自己的交易條件，看有沒有出現狀況，如果沒有，就不必去理會盤中的變動。


    例如，你昨天依據進場條件以50元買進一檔股票，停損設在48元，今天開盤後，股價一直維持在48元以上在變動，收盤前都沒有觸到停損價，你自然就依原來的計畫繼續持有這檔股票就好了，即使股價在盤中上上下下，你也不用自己再想東想西的亂猜了。


    ### 不同操盤環境需要不同的定法


    股票市場的變化快速，隨著不同的趨勢環境，必須要採取不同的策略應對。個股的操作也是一樣，在不同的环境中要用不同的方法。


    例如，當大盤來到歷史低檔區，指數在4000點以下，出現許多符合「價值型投資」的好股票，這時就可以採取分批承接，長期波段持有或操作；當大盤來到歷史高檔區，指數接近9000點以上，這時當然就不適合用長期策略去投資，而是要找到有攻擊力道的強勢股，短期操作，才能賺取最大獲利。


    市場上經常在爭議，股票長期操作比較好？還是短期比較好？其實，就如前文所述，在不同的大盤趨勢、不同的股票走勢、不同的資金部位、不同的個人操盤環境之下，都需要採取不同的定法。


    ### 認識定法的3個基本概念


    在擁有自己能執行的定法之前，建議你一定要對定法有以下的正確認知：


    - 1. 定法的好壞影響操作的績效


    一套好的操作方法最重要是自己能夠「執行」，別人的方法不一定適合自己，所以開始時透過學習他人的方法，來學習不同的方法，再選擇其中自己認為比較可以做到、的方法，然後實際到市場中去使用，接著依據自己操作的感覺及經驗的累積，修正成為自己的一套方法。


    - 2. 沒有十全十美的定法


    你不可能找到一套百分之百絕對賺錢的方法，任何的方法都有失敗的比率，如果你的方法能夠長期穩定的保持勝率在60%以上，你就是大贏家。


    讀者在市面上會看到一些軟體，它告訴你當出現紅棒時就買、出現綠棒時就賣，真是偉大的發明！但是，有了這樣的軟體就保證你一定能夠賺錢嗎？如果答案是一定，那麼，所有的基金操盤經理人就容易做了！每人買一套，每月付一點傳輸費，就不怕沒有績效，股票市場也沒有輸家，想一想！實際情況真的是這樣嗎？


    - 3. 定法後操作的成敗在「人」


    空有好方法，不能保證一定能成為贏家，同樣的一套方法，不同的人去操作，結果不會相同。一檔同樣的飆股，不同的人用不同的方法操作，績效會有天壤之別，原因在於是否「適時」、「適法」，以及「人性」、「人心」各不同。


    ### 「依市場不同趨勢階段做到「適時」、「適法」」


    「適時」就是要適合當時大盤的時勢，「適法」就是依照當時大盤的時勢，採取適當的方法。


    台灣股票市場循環的時勢，分為以下4種階段：


    - 1. 低檔打底階段：分為探底期、打底期、底部成形期。

    - 2. 多頭上攻階段：初漲期、盤整期、續漲期、末升期。

    - 3. 高檔盤頭階段：漲勢停滯期、盤頭期、頭部成形期。

    - 4. 空頭下跌階段：初跌期、盤整期、續跌期、末跌期。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_203_0.png)


    在前述股票市場不同的趨勢階段，大盤的現象是不同的，因此採取的操作方法也不同。瞭解市場在各階段的特性，將有助你採取不同的操作策略，以下針對市場的4個階段說明：


    - 1. 低檔打底階段


    > 【現象】 平均股價處於低檔，市場利空不斷，績優股物超所值，領先下跌很深的股票開始止跌或出現「底底高」的底部現象，部分高價但是並無資值的股票會繼續下跌。


    - **[經驗]**（1）對於跌深物超所值的績優股，可以采取「價值型投資」策略，選取本益比低、殖利率高的股票，做定存式買進。

    - （2）可采用波段操作方式，開始在盤中鎖定特定的好股票，等待波段進場機會，請參考長波段操作戰法（詳見第210～233頁）。

    - （3）對於部分跌深反彈、「底底高」向上股票，可以采用短期均線戰法或智慧K線操作法，請參考後面戰法篇（詳見第245頁）。

    - （4）對於部分高價補跌或續跌空頭的股票，做空。

    - （5）在打底階段要減碼，控制持股部位，以總投資金額的2～3成操作。

    - （6）在底部盤整期利空不斷，盤勢容易震盪，這時操作股票要把握高出低進、短期操作原則；或暫時退場休息，待趨勢明朗再介入；或是操作台指期貨、選擇權商品。


    - 2. 多頭上攻階段


    **[經驗]** 在初漲期，跌深績優股或權值股會先開始表態，且利空鈍化，這時大盤剛突破底部盤整，成交量明顯放大，但是仍有部分弱勢股仍處於未跌段續跌的格局。


    - **[經驗]**（1）在初升段，選擇物超所值的績優股，採取「價值型投資」策略，選取本益比低、殖利率高的股票，做定存式買進。

    - （2）選取領先大盤上漲的股票，開始做多。觀察月線突破下降切線、週線底部完成向上且站上20日均線的股票，可采用波段操作法，然後回到日線等待進场的機會買進。

    - （3）部分強勢股出現，採用均線或飆股戰法操作。

    - （4）在初升階段，操盤的持股部位可增加到投資金額的4～5成操作，在主升段或未升段可提高持股部位到8成。

    - （5）在主升段、未升段，出現大量主流類股、飆股時，要把握操作強勢股的機會，採用「飆股戰法」，短期抓住高獲利。此時不宜做空。

    - （6）在上攻階段出現回檔或盤整，應把握續勢向上一機，繼續做多。


    - 3. 高檔盤頭階段


    特徵 平均股價處於高檔位置，主流領導股出現盤頭，融資不斷增加到達高水位，利多不斷，股價浮滯，績優股或上漲強勢股出現跌停板現象，股價上下震盪激烈，市場極為樂觀看好，股市出現天量（台股出現2000億元以上的成交量），大盤進入盤整或出現「頭頸低」的波浪型態。


    兼膽 （1）大盤在高檔做頭，仍有部分主力做價的飆股，採用飆股戰法，短期抓住高獲利。


    （2）當大盤處於高檔階段，績優股大多在高價位，此時不宜採取「價值型投資」策略，不要做長期投資。


    （3）適合長期波段做多的股票很少，不宜用長期波段操作做多，而且當大盤做頭反轉時，即使是多頭的股票也會將受影響。


    （4）注意領先上漲的高價股是否形成頭部，如有月線跌破上升切線、週線盤頭的現象，可以鎖住該股，準備長波段做空。


    （5）在頭部盤整階段，股價位於高檔，這時股票只能高出低接，不可追高，當股價出天量不漲或是下跌時，都要迅速出場。


    （6）盤頭階段做多，要控制持股部位在5成以下。


    - 4. 空頭下跌階段


    定義 當整體市場的平均股價處於高檔，市場遇利多不漲，開始不斷出現利空消息，而且主流高價股開始下跌，股市的下跌家數大於上漲家數，並且出現遇利多股價短暫反彈、一有利空馬上下跌或大跌的現象。


    策略 （1）在初跌段仍有一些落後補漲股票可做多，但是只能做短線。


    （2）初跌段，在盤中鎖定高價反轉且符合長波段做空的股票，等待機會進場做波段空單。


    （3）把握跌破頭部、走勢空頭的股票，反彈不過前高續跌時，做空。


    （4）在主跌段、末跌段，大部分股票都在下跌，應該以做空為主。


    （5）做空適合採用短期均線戰法或智慧K線操作戰法（詳見第245頁）。


    （6）在空頭初跌段，應以總資金的6～8成操作；在末跌段，持股部位應控制在約3成操作。


    # 第三章

    ## 長線波段操作

    ### 是成為巨富的祕訣


    股市中有許多令人羨慕的巨富，動不動就是百萬資金賺到上億，我認識的朋友中不乏其人，例如許多股友敬佩的王醫師、30歲就賺上億的蔡老弟、期貨天王黃大師，觀察研究他們能夠在股市中獲利驚人，都具有一些相同的特質。


    首先，他們對要操作的商品特性、現今發展及未來趨勢，都會深入的進行研究；其次，他們在商品價格處於低檔時，都會用週線甚至月線進行技術面選股，然後再依日線在適當的位置切入，並以週線或月線為依據，進行大波段操作。


    他們操作的時間雖然比較長，但是獲利驚人。可以說，採取長線波段操作是他們成為巨富的祕訣。


    ### 對長線波段操作應有的基本認識


    雖然長線波段操作是成為巨富的祕訣，不過，並非每個人都適合，以下是對長線波段操作應有的認識：


    - 1. 操作機會


    長線操作是用長時間換取大的報酬，因此「時間」是重要的因素。採取這種方法，一年大概只有2~3次機會，有時為了鎖住一檔股票，等待長線投資機會可能會花半年以上時間。


    - 2. 適用對象


    想要成為巨富的投資人、沒有時間照顧盤面的人、有大額資金的人、有耐心的人。


    - 3. 選股對象


    長線操作的股票，必須是不必擔心基本面的股票，因此投資人可以在台灣50、台灣權值股的前100名、摩台權值股、台灣中型100、富櫃50等成分股中挑選，或是從各類股的龍頭股中挑選。


    - 4. 操作時機


    在底部進場，不賺也難。長波段的機會不是隨時都有。一般會出現在行情大跌之後的低檔區，個股超跌之後，經過一段時間盤整打底，此時比較容易出現物超所值的個股，當出現過線打底的股票時，要開始鎖股，等待長波段的好機會。


    - 5. 大環境的影響


    整體大環境對股票走勢的時程影響很大，例如，全球經濟的動盪會影響國內大盤的走向、大盤的漲跌會影響個股的漲跌，因此，即使是以波段操作，同樣要控制風險，不可一味的看好抱住不放。


    ### 用迴線圖找出可以長波段操作的股票


    在技術分析中，可以用過線走勢圖去找長波段的操作機會，讀者可以参考筆者在《抓住飆股輕鬆賺》一書中的第268頁至281頁波段買進及賣出的13種過線圖訊號，這些進場位置就是波段操作賺錢的好機會。


    當你從週線找出可以長波段操作股票時，記得要回到日線找出適當的進場點。例如，當週線打底後出現大量向上突破的長紅K棒時，對照日線來看，可能是已上漲多日的高點，此時應等到股價回檔修正後再上漲的買進機會進場，然後設好停損點，再依據波段的操作方法去操作，或是以一條長期均線（月線或季線）為進出場依據。


    股市即生涯，生活即股市。要面對市場變化，接受當下趨勢，用正確方法處理股票的進出，放下過去的賺賠，面對未來的行情發展。


