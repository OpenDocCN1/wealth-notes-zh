    # 不適合買進的5種暴大量長紅K線位置


    當暴大量拉出長紅K線，代表當日多頭氣勢強勁，一般投資人看到K線這樣表現，很容易衝動買進。其實，在走勢中，以下5種位置如出現暴大量拉出長紅K線的情況，則不適合買進。


    +   1. 在多頭高檔出現大量長紅K線


    這個位置出現的大量長紅K線，要小心主力藉機出貨。判別的方法要看次2日股價的表現，如果股價不漲或下跌，前面的那根大量長紅K線，就是主力出貨了。


    操作策略很容易，當天大量長紅K線持股續抱，次日以後要注意不能跌破長紅K線的1/2價位，如果跌破，就要賣出離場，空手投資人，不要買進。


