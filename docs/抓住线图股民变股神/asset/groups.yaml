    # 第 4 篇


    # 第 11 章 獲利目標達成利器 1：短線攻擊的二條均線戰法


    每月獲利 8.4%，全年獲利 1 倍。


    重點說明：


    +   1. 以波浪型態為最優先考量，波形為空頭，不考慮做多；波形為多頭，不考慮做空。符合特殊條件時，可搶空頭急跌的反彈，但是不做多頭的回檔放空。


    +   2. 採用 10 日均線及 24 日均線這兩條均線操作。


    +   3. 二條均線戰法是以短線獲利為目標，選股以強勢攻擊股票為主，進出點配合波浪型態、K線型態、均線方向、飆股特性及價量關係的綜合使用。


    # ■ 二條均線戰法在多頭趨勢下的操作定法


    當盤勢出現由空轉多的低檔反轉現象，想要短線致勝，採取二條均線戰法，就要進一步觀察是否有出現下列現象：


    +   1. 反轉型態至少要出現「底底高」。


    +   2. 10 日均線與 24 日均線同時向上，或是 10 日均線向上，即將與 24 日均線形成黃金交叉，股價站上均線，買進，成交量要配合放大。


    +   3. 同時看第 1 個壓力位置是否形成上升的嚴重阻礙，以及距離進場位置的可能獲利幅度。


    +   4. 進場後，停損守 10 日均線或 24 日均線中離股價最近的一條均線。


    +   5. 開始上漲，守 10 日均線，當獲利超過 10% 以上，依 K 線出場訊號出場，或急漲後跌破上升急切線出場。


    +   6. 出現飆升情形，改以飆股戰法操作。


