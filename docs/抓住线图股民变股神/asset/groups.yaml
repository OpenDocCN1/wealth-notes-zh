    \n# 第1章\n## 獲利目標達成利器2：短線賺高報酬的飆股戰法\n\n飆股人人愛，可是沒有一套方法是不容易操作的，不但技術分析功力要超強，還要具備過人的膽識，當機立斷的執行力更是操作飆股的必備條件。想要嘗試快速賺錢快感的讀者，除了仔細閱讀以下的飆股戰法外，個人情緒的掌控要更穩定。\n\
    \n### 構成飆股的要件\n\n飆股是指起漲時快速發動，經常在開盤後半小時內就漲停板，讓人措手不及上車，以後數日連續上漲，短時間獲利驚人，行進中有時停留一或兩天，又繼續飆漲。\n\
    \n構成飆股的要件如下：\n\n- 股性活潑，曾經飆漲過，股本不大，為中小型股。\n- 新產業、新技術、獨佔性、轉機題材股。\n- 法人持股不多，資券同步增加。\n\
    - 大盤處於多頭時出現飆股的機會較多，大盤在多頭處於盤整盤時也會出現飆股。\n\n同時，飆股也須具備以下8種圖形條件：\n\n- 經過長期盤整（2～3個月以上）。\n\
    - 底部漸漸高的型態。\n- 盤整期出現草叢吸貨量。\n- 突破頸線，帶量發動。\n- 發動前，短中長期均線糾結。\n- 發動時，力道夠強，量價均佳，短期上檔無壓。\n\
    - 每日瀏覽強勢股，歸納出主流股，搜尋符合潛在飆股要件的標的商品，置入個人鎖股的資料，鎖股，等待發動時機。\n- 盤中即時選股，出現符合飆股條件的標的，立刻行動。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_289_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    ### 短線飆股戰法總整理\n\n想要學到短期賺高報酬的飆股戰法精髓，你要先認識飆股戰法，說明如下：\n\n**戰法優點：**\n\n- 選股標的明確。\n\
    - 快速進出、低風險。\n- 短期達到高獲利。\n- 不考慮基本面、消息面，以技術面進出。\n- 適合100～200萬元資金操作。\n- 需要盯盤操作。\n\
    \n**基本功力：**\n\n- 快速精準的選股能力：精通熟練的技術分析功力，熟悉飆股的特性及技術型態，掌握主流類股。\n- 盤中變化的解讀力：包括近日大盤方向、當日大盤可能變化、盤中各項數據變化的判斷。\n\
    - 當機立斷的執行力：要具備買進時「敢不敢」，賣出時「狠不狠」的執行力，一切均以技術面操作。\n- 操作飆股不要想買在最低點、賣在最高點。\n- 要大膽違反人性，以技術面操作，遵循紀律規則。\n\
    \n**操作目標：**\n\n機會確認時，短時間獲利50%，甚至倍數以上。\n\n**交易條件：**\n\n- 以波浪型態最優先考量，順勢做多交易為主。不做逆勢單。\n\
    - 採用日線選股進場，看日線出場。\n- 飆股戰法以用在中小型股為原則，並不適合大型股。\n\n### 操作飆股的13項教導守則\n\n飆股操作的重要前題是大環境要處在大多頭趨勢，也就是說國際行情穩定，且台股大盤趨勢確認為多頭行情的情況下。以下提供操作飆股的13項教導守則：\n\
    \n- 以個人資料庫鎖股及當日盤中即時出現的強勢股為標的。\n- 以開盤後在9點～9點10分內強勢拉向漲停的個股為第一優先追進的強勢標的。當出現這種個股時，要立刻打開走勢圖，在10秒內做下列圖形研判：\n\
    \    - 看波浪型態，是否為多頭起漲點？是否有飆股型態？是否有上漲空間？\n    - 看價量結構，是否價漲量增？\n    - 看均線排列狀況，是否符合上攻的多頭排列？\n\
    \    - 如果這檔個股的圖形很好，或者原本就是自己已經鎖定的股票，當機立斷，勇敢的立刻買進。\n- 在9點30分前奔向漲停的股票，為第二強勢股。如果這檔個股的圖形符合飆股條件，可以買進。\n\
    - 在9點30分到13點間，盤中慢慢漲停的股票列為一般觀察名單，可能是走多頭的股票，但是不一定是會飆的股票。\n- 在10點至12點中間時段勿隨便就追高，強勢股票的主力早在10點前就已完成今天的策略動作，而10點至12點時段大多是散戶在交易，或者是主力為配合期貨多空而在現貨進出，這段時間除非手持股出現紀律出場的狀況，才要處理，否則不要隨便做動作。\n\
    - 在12點至13點30分期間，要觀察是否有尾盤強勢往上拉向漲停的股票，這是明日會續強上漲的股票，檢查線形後買進。\n- 當日個股出現大量長紅K棒突破盤整區、均線糾結區、下降切線、反轉的「底底高」的第2支或第3支腳成立時的強勢發動位置，當股價往上時，立刻追進。\n\
    - 當日追進的股票，走勢不如預期時，可採取當日券出。因此要開好融資帳戶，當日才能做券出。\n- 持股次日開盤，漲幅在3.5%以上續抱；如果漲幅在3.5%以下，在回跌接近平盤時出場。\n\
    - 持股次日漲停，當漲停打開，回跌到漲幅剩5%時，出袋停利。\n- 先前高點賣出的股票，當股價殺低出現買點時，可再買進。\n- 股價已上漲一段，在前一日收黑K線時賣出。如當日再發動往上，拉出長紅K線過前一日高點時，再進場繼續操作。\n\
    - 漲停鎖住的城市不可賣，要賣弱勢股，抽出資金，換買強勢股。\n\n### 操作瘋股的5大心法\n\n- 膽大心細，飆股發動前後經常會有洗盤的動作，仔細觀察前後價量的關係。參考第293頁振維（3520）圖例。\n\
    - 操作飆股也可以長線短做，用長線保護短線，同樣能夠賺到整個波段。\n- 飆股战法著眼股市「強者恆強」的慣性，以追強勢股為操作的主軸，進出快速，追求短期獲得高利潤，因此需要專注及高超的操盤技巧及心法。總之，進場不對，在小賠時就要立刻出場。抓對飆股獲利既快又大，是獲利效率最高的方法。\n\
    - 做飆股不看基本面，飆股為主力資金及籌碼的作戰，速戰速決，短時間漲幅驚人。要享受這種快速賺錢的滋味，除了技術分析要精通之外，更要具備當機立斷的執行力。\n\
    - 操作飆股要集中精神注意盤中變化，要具備百分之百的執行力，操作飆股，當股價轉弱（不一定是賠錢）時就立刻出場，所以風險反而較小。\n\n### 操作飆股四大守則\n\
    \n- 要具備紮實技術分析能力，熟練飆股型態，每日檢視強勢股。\n- 要具備「敢不敢」、「狠不狠」的執行力，當符合飆股條件時，勇敢介入，並以個人飆股操作守則執行出場紀律。\n\
    - 操作飆股基本面勿放心上，一切以技術圖形走勢及進出場守則為準。\n- 以飆股特性操作，看清洗盤、續勢等手法，賺到最高點。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_293_0.png)\n\
    \n### 3.7.5 持續裝櫃榜\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_294_0.png)\n\n資料來源：富邦e01電子交易系統\n\
    \n### ▲上圖說明：\n\n- 振維（3520）股價在底部盤整1個半月，發動前有洗盤的動作，先跌破盤整下頸線，再往上飆漲。\n- 2011年3月21日，拉出長紅K線突破盤整區，股價站上均線，在12.45元買進。\n\
    - 2011年3月25日，開盤漲停，隨後股價往下跌，回跌到漲幅剩5%時，以15.9元賣出。\n- 2011年4月11日，暴大量拉出長紅K線突破下降急切線，在15.4元買進。\n\
    - 2011年4月14日，開平盤下跌，立刻以17.5元賣出。\n\n總結：17個交易日，交易2次，獲利5.55元，獲利率44.5%\n"
  mdcn: "\n# 第15章\n## 獲利目標達成的利器：短線攻擊的二條均線戰法\n\n短線攻擊的二條均線戰法，是以進場3～5天，獲利達到5～10%為目標，是一年賺1倍的必要操作方法。\n\
    \n### 二條均線戰法的重點說明\n\n二條均線戰法是我個人達成每年獲利1倍的操作方法，在此分享給股友同好做參考，希望對大家的操作有幫助。\n\n**戰法優點：**\n\
    \n- 簡單清楚，容易執行。\n- 短線快速獲利，停利明確精準。\n- 需要看盤，修正部分出場規則，也可不看盤。\n- 適合300萬元以下資金操作。\n-\
    \ 固定操作模式。\n- 解決看對行情抱不住、賺不到、漲高不敢買的狀況。\n\n**基本功力：**\n\n熟練技術分析的「四大金剛」，執行能力要100%。\n\
    \n**操作目標：**\n\n每月獲利 8.4%，全年獲利 1 倍。\n\n**重點說明：**\n\n- 以波浪型態為最優先考量，波形為空頭，不考慮做多；波形為多頭，不考慮做空。符合特殊條件時，可搶空頭急跌的反彈，但是不做多頭的回檔放空。\n\
    - 採用 10 日均線及 24 日均線這兩條均線操作。\n- 二條均線戰法是以短線獲利為目標，選股以強勢攻擊股票為主，進出點配合波浪型態、K線型態、均線方向、飆股特性及價量關係的綜合使用。\n\
    \n### 二條均線戰法在多頭趨勢下的操作定法\n\n當盤勢出現由空轉多的低檔反轉現象，想要短線致勝，採取二條均線戰法，就要進一步觀察是否有出現下列現象：\n\
    \n- 反轉型態至少要出現「底底高」。\n- 10 日均線與 24 日均線同時向上，或是 10 日均線向上，即將與 24 日均線形成黃金交叉，股價站上均線，買進，成交量要配合放大。\n\
    - 同時看第 1 個壓力位置是否形成上升的嚴重阻礙，以及距離進場位置的可能獲利幅度。\n- 進場後，停損守 10 日均線或 24 日均線中離股價最近的一條均線。\n\
    - 開始上漲，守 10 日均線，當獲利超過 10% 以上，依 K 線出場訊號出場，或急漲後跌破上升急切線出場。\n- 出現飆升情形，改以飆股戰法操作。\n\n\
    ![](img/e6a266bab53ec29e9cf6f50724f4d142_279_0.png)\n\n### 二條均線戰法在多頭趨勢下的操作紀律\n\
    \n採取二條均線戰法時，在多頭行進間也要注意以下的操作紀律：\n\n- 當24日均線方向維持向上，持續做多。\n- 當10日均線、24日均線同時向上呈多頭排列，股價在上方，依波浪型態回檔後上漲再買進，或盤整突破後再買進，持續做多。\n\
    - 股價收盤跌破10日均線一定要出場。10日均線持續上揚，股價收盤站上10日均線，再進場買進。\n- 途中獲利超過10%以上，依K線出場訊號出場，遇到「頭不過前頭高」時，出場避險。\n\
    - 當股價回檔到24日均線有支撐，再上漲時買進。回檔跌破24日均線，如24日均線仍向上，要等到股價再站上24日均線時再買進。\n- 不追第3根長紅K線，持股上漲到第3根長紅K線，觀察出場訊號，準備獲利出場。\n\
    - 當均線開始走平或10日均線下彎，K線出現該攻不攻時，要立刻出場，避免短期回檔的風險。\n- 當波形進入盤整，退出，直到方向明確時再操作。\n\n###\
    \ 二條均線戰法在空頭趨勢下的操作定法\n\n當盤勢出現由多轉空的高檔反轉位置，想要採取二條均線戰法，短線致勝，就要進一步觀察是否有出現下列現象：\n\n\
    - 反轉型態至少出現「頭頭低」（蜂窩低）。\n- 當10日均線與24日均線同時向下，或是10日均線向下即將與24日均線形成死亡交叉，當股價跌破10日均線，做空，成交量不一定放大，如果成交量放大更好。\n\
    - 同時看第1個支撐位置是否形成下跌的重要支撐，以及距離放空位置的可能獲利幅度。\n- 進場後，停損守10日均線或24日均線中離股價最近的一條均線。\n-\
    \ 開始下跌，守10日均線，當獲利超過10%以上，依K線出場訊號出場，或急跌後突破下降急切線回補。\n- 出現急跌情形，改以K線智慧戰法操作。\n\n###\
    \ 二條均線戰法在空頭趨勢下的操作紀律\n\n採取二條均線戰法時，在空頭行進中也要注意以下的操作紀律：\n\n- 24日均線方向維持向下，持續做空。\n-\
    \ 10日均線、24日均線同時向下呈空頭排列，股價在下方，依波浪型態反彈後再下跌時做空，或盤整跌破下頸線位置，持續做空。\n- 股價收盤突破10日均線一定要回補。10日均線持續下彎，股價收盤跌破10日均線，再進場做空。\n\
    - 途中獲利超過10%以上，以K線出場訊號出場，遇到「底不破底」時，要出場避險。\n- 股價反彈到24日均線遇壓力不過，再下跌時做空。反彈突破24日均線，24日均線仍向下彎，股價再跌破24日均線時，做空。\n\
    - 不追第3根長黑K線，手中空單如出現下跌到第3根長黑K線情況，觀察出場訊號，準備獲利出場。\n- 當均線開始走平或10日均線開始上揚，K線出現「該跌不跌」時，要立刻出場，避免短期反彈的風險。\n\
    - 當波形進入盤整，退出觀望，直到方向明確時再操作。\n- 波形出現「底底高」時，要結束空頭做空的想法。\n\n### 操作二條均線戰法的重要提醒\n\n\
    操作二條均線戰法時，有以下4個選股時機：\n\n- 收盤看每日強勢股。\n- 盤中看強勢股訊息。\n- 收盤前找明日攻擊強勢股。\n- 開盤前以市價買進強勢股。\n\
    \n不過，如遇到盤整期，則要注意以下2點：\n\n- 一般盤整期不操作。\n- 出現大箱形盤整，獲利有10%以上空間，均線符合方向時，在箱形高低點的位置，配合急切線操作。\n\
    \n遇到跌深反彈走勢時，這時如要逆勢做多，必須符合以下3種條件：\n\n- 股價急跌，與24日均線乖離率達15%以上，K線出現止跌訊號，並且出量往上的單腳反彈過前日高點時，搶反彈做多。\n\
    - 嚴格執行停損，以當日進場K線的1/2價為停損點。\n- 上漲出現黑K線，立刻出場。獲利10%以上，一旦K線出現出場訊號，或跌破上升急切線時，立刻出場。\n\
    \n最後提醒讀者，在操作二條均線戰法時，也要嚴守以下3條紀律：\n\n- 凡是10日均線與24日均線同時往下，股價在均線下方時不做多，即使反彈到上方也不做。\n\
    - 當兩條均線上下穿梭或糾結時要小心應對，最好不做。\n- 股價位於高檔（走第3波）時，10日均線走平或下彎，要小心行情可能的結束。\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_282_0.png)\n\
    \n股市中強者恆強，弱者恆弱。\n股市要賺錢，永遠要買強勢股，汰換弱勢股。\n\n## 二、股價線上攻進許多常見出現\n\n![](img/e6a266bab53ec29e9cf6f50724f4d142_283_0.png)\n\
