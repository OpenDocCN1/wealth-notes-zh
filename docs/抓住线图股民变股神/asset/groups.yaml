    \n## 結語\n\n股市的操作方法百百種，以上多種戰法概括短線及波段長線方法，能夠熟練，在不同情況下交互運用，可賺一生財富。\n\n以技術圖形操作，方法愈簡單愈好，簡單才易執行。放棄自我，守紀律機械式操作，該買就買、該賣就賣是獲利致勝的不二法門。\n\
    \n波段操作往往時間長達 3～6 個月，在這期間只要趨勢沒有改變，持股長抱賺得更多，當然也能長線短做，以長護短擴大利潤。\n\n要有正確操作觀念，勇於認錯，看錯做錯，立刻停損認賠。100\
    \ 萬如賠 10 萬，還有 90 萬，另外找好機會低點買進，只要一支漲停、次日開高賣出，10% 就賺回來了；如果死不認錯，100 萬賠掉 90 萬，只剩 10\
    \ 萬，那麼，要再賺回 90 萬，可就很難了。因此，做股票千萬不要硬拗，因為不認錯就會永遠無法翻身。\n\n技術分析加各種指標千百種，自己熟練 1、2 種會賺錢的就好，學太多太繁雜，反而無法果決判斷，猶豫不決是股市操作的大忌。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_325_0.png)\n\n- 股票操作祕訣：\n  1. K線看轉折，均線看方向。\n\
    \  2. 進場做波段，操作做短線。\n\n---\n\n# 抓住線圖 股民變股神\n\n**作者**：朱家泓  \n**總顧問**：詹宏志  \n**發行人兼社長**：董再興\
