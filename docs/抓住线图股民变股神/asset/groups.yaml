    \n# 操作目標：\n條件明確時，快速賺取一段急漲或急跌的利潤。\n\n# 交易條件：\n- 1. 完全以技術面操作，屬於逆勢交易。\n- 2. 以日線操作，專門鎖住急跌急漲或乖離過大的股票。\n\
    \n# 二、做空頭出現急跌時的發現及買法\n\n由於V形及倒V形反轉的速度很快，許多投資人常常無法在第一時間發現及介入，因而錯失賺錢的機會。\n\n事實上，只要瞭解它的特性，知道如何操作，大膽進場，果斷出場，要賺這種小飆一段的利潤，實非難事。\n\
    \n以下提供當空頭出現急跌時的操作定法：\n\n**買進** 一定要同時符合下列條件才可以買進。\n- 1. 出現連續重挫急殺3天或3天以上的長黑K線或跳空跌停。\n\
