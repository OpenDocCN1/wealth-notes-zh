    # 15 葛蘭畢八大法則


    葛蘭畢（Granvile Joseph）在1960年提出「移動平均線」的理論，根據他對股價走勢與均線關係的觀察發現，股價在一輪漲跌過程中有4個好買點時機及4個好賣點時機，統稱為「葛蘭畢8大法則」。


    「葛蘭畢8大法則」中，在下跌趨勢時的逆勢買點及上漲趨勢時的逆勢賣點，基本上是指股價與月均線乖離率達到15%以上，很容易產生下跌時的反彈或上漲時的回檔，這時要搶短線的反彈或回檔的利潤，操作方法可以參考V形、倒V形反轉戰法。


