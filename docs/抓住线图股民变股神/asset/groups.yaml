    # ### 第  章


    在我這幾年教課的經驗中，發現同學的問題大多是看不出趨勢方向，因此經常在下跌的時候做多，做錯了方向。其次，是進場位置不對，自己認為股票好就趕快買進，結果往往買到高點；或是回檔修正，自己認為股價低就去承接，往往股價繼續下跌，這些問題再再說明波浪型態的重要，只要能透視波浪型態的特性，就可以清楚看出趨勢方向，同時也可以知道最佳的買賣位置，如此自然能夠輕鬆操作。


    技術分析的「四大金剛」是波浪型態、K線、均線及成交量，其中以「波浪型態」為首 （「四大金剛」請參考《抓住飆股輕鬆賺》一書），因為波浪型態可以判別多頭、空頭或盤整的走勢方向，同時發現方向的改變、確認方向的結束，並且能夠有明確的進出位置，所以是學技術分析很重要的基礎。


    本章進一步對波浪型態的角度、位置、回檔及反彈的幅度、突破及跌破關鍵支撐或壓力的型態、底部及頭部的型態判別……等等做說明，幫助讀者在實際操作中更能駕輕就熟。'
  - '[PAGE 104]


    多頭波浪的完整走勢及進場位置


    同學大多習慣做多，2011年大盤直直落，股票跌的多、漲的少，害得不少同學賠錢。如果對多頭走勢的特性充分瞭解，就不會在行情不好的時候一味做多了。


    1. 對多頭波浪應有的重要認知


    +   （1）轉折高點（稱頭或峰），後面頭比前面頭高，股價一直在創新高（簡稱為「頭頭高」或「峰峰高」）。


    +   （2）轉折低點（稱底或谷），也是後面底比前面底高，股價的低點一直在墊高（簡稱為「底底高」或「谷谷高」）。


    +   （3）當股價回檔時，要觀察不能跌破前面低點，然後再繼續上漲，如此波浪走勢仍然維持符合多頭「底底高」的條件。因此，回檔要觀察不能跌破前面低點是必要條件。


    +   （4）當股價經過回檔修正後，沒有跌破前面低點再上漲，當上漲突破前面高點，走勢繼續創新高，確認波浪走勢繼續是「頭頭高」、「底底高」的多頭。


    +   （5）多頭走勢總是上漲的多、回跌的少，股價一步步往上推升。緩漲急跌，出現長黑不繼續下跌的現象。


    +   （6）價漲量增，價跌量縮。


    +   （7）見壓不是壓，見撐多有撐。'
