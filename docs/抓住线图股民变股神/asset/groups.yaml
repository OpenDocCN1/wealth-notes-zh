    # 財神就在眼前

    聰明的續勢戰法


    依據波浪理論及主力操盤慣用手法，90%的飆股不會只飆漲初升段一波就結束，往往在拉回洗盤修正之後，還有很大的續飆機會。因此，在飆股拉回時，要密切注意再次出現續飆的時機，這就是飆股第2波、第3波進場時機，專心鎖定此類飆股，抓住機會，既輕鬆又好操作。


    # （1）續勢操作戰法不需要具備基本分析或太多技術分析條件


    這種續勢操作戰法，不需要具備基本分析或是太多的技術分析條件，實際操作時，更不需要自己千辛萬苦的去追逐消息，找會漲的飆股。整套方法就是跟隨初升段已經表態的強勢飆股，繼續做後面的主升段、末升段。


    當然，股票多頭能夠持續上攻，先決條件就是大盤要處於大多頭格局，這時當盤面上飆股輩出，這種飆股盤面上已經自己飆出來，所以不需自己去先知先覺。


    因為，依據艾略特（RalphNelson Elliott）的「波浪理論」，多頭市場走勢會走3段上升，也就是一般所謂的「初升段」、'
  - '[PAGE 303]


    「主升段」、「末升段」，在每兩段的中間，是下跌回檔的修正，此時正好是我們做好準備、守株待兔的時機。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_303_0.png)


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_303_1.png)'
  - '[PAGE 304]


    # 想要提高續漲股賺錢應該掌握的重點


    想要續漲操作飆股，介入的時間點分為以下兩種情況：


    +   1. 強勢續漲：盤中快速拉上漲停，或是跳空漲停。

    2. 弱勢續漲：股價回檔後，再突破前高後往上續漲。


    雖然續漲戰法是一種勝算機率相當高的操作，但是簡單不代表容易，越是簡單的東西往往越需要克服人性先天上的弱點。由於飆股初升段發動得又快又急，股價一下子就拉高不少，稍做拉回之後再度上漲時股價太高，大多數人都不敢買進。


    因此，一旦符合飆股連續強勢上漲的條件時，在第2段發動的第一時間，就要以市價搶進，不可猶豫，必須要有果斷的執行力。如果是一般強勢多頭續漲的股票，適合在接近收盤，確認為續漲的型態時，才以市價進場買進。


    這套操作戰法的風險控制，可以參考前面「飆股戰法」及「飆股戰法調整術」的停損及停利守則。


    續漲，有時不是一次就順利成功，在實際案例中，也會出現沒有如期飆漲，反而拉回的情況。因此，要依紀律執行停損，可是停損出場之後，一旦再度出現續勢飆漲的訊號機會時，要繼續嘗試，不可放棄，否則經常會漏失一次賺大錢的機會。


    遇到空頭趨勢時也是一樣，掌握主跌段及末跌段的起跌機會，續勢做空。'
  - '[PAGE 305]


    # ■ 綜營戰法的重點說明


    每次上課時一講到飆股，最能引起同學的興趣，因為飆股人人愛。記得有一次說明一檔剛開始起飆的股票，連續上漲3支漲停板，同學個個都說：「那麼高價了，怎麼追？」我叫他們每天都盯著它看，總有一天會休息回檔，當回檔休息1或2天，再次發動攻擊時後就要立刻上車。


    到了下星期上課時，追問他們有賺到第2段的3支漲停板嗎？結果整個教室中60位同學，只有3位有去搶到該檔飆股回檔後的再飆行情，其中2位學生只賺到一根漲停板就賣了，另一個學生賺到2根漲停板。


    想要賺到飆股的錢，你一定要了解續勢戰法的精髓，說明如下：


    戰法優點：


    +   1. 規則簡單清楚，容易執行。

    2. 操作成功機率率，獲利高。

    3. 看盤等待續勢機會，自在輕鬆。

    4. 操作簡單，成交量、基本面參考即可。

    5. 適合一般中、小額資金操作。


    基本功力：


    熟練技術分析的「四大金剛」，執行能力要100%。


    操作目標：


    走勢明確時，賺取繼續上漲或下跌的波段。


    交易條件：


    +   1. 以波浪型態為最優先考量，順勢交易。多頭做多，空頭做'
  - '[PAGE 306]


    空，不做逆勢交易。


    +   2. 採用技術指標看日線走勢圖，專門鎖住第1波上漲的強勢股或飆股。


    # 在多頭走勢中如何操作續抱戰法？


    想用續抱戰法在多頭走勢做多，必須注意以下交易規則：


    +   **買進** 在第1段上漲修正後，符合下列情況，買進。


    +   （1）當天開低走低，股價在低點出現大量，股價隨即向上突破前一日高點，並且再創新高價。


    +   （2）昨日下跌，今日卻上漲時拉出紅K線，股價突破昨日最高點。


    +   （3）回檔修正幾天（最多3～5天，不能回檔太久），拉出長紅K線突破下降急切線。


    +   （4）橫向整理幾天（最多3～5天，不能盤整太久），拉出長紅K線突破上顯線。


    +   **停損** 停損點設在進場長紅K線的最低點。


    +   **續抱** 飆股股價未跌破上升切線或前一日低點，續抱。一般上漲走勢股票，採取自行應用的戰法續抱。


    +   **止賺** 飆股用飆股戰法出場，或者用飆股調整戰法出場。一般上漲走勢股票，採取自行應用的戰法出場。'
