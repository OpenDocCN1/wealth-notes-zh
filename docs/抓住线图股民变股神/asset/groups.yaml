    # 智慧K線戰法的7項重點注意


    +   1. 如果想操作長波段，可採用個股的週線圖，以週線圖走勢按照紀律操作。


    +   2. 無論何時進場，必須遵守停損停利的紀律。


    +   3. 資金的分配投入要靈活，走勢明朗時可加大資金投入，走勢不明或有疑慮時，應小量資金投入或退出操作。


    +   4. 如果行情走單邊市場（一直多或一直空）這個方法就很好用，但是遇到上下震盪盤整時就會經常停損，因此在選擇商品標的時要特別注意，要挑選走勢清楚的個股。


    +   5. 走勢平緩時不易獲利，上升或下跌的角度低於45度的走勢，則不建議用此方法。


    +   6. 走勢強勁時，進行短線快速獲利的交易（上升或下跌的斜率在45度以上），往往能夠簡單輕鬆快速獲得最大利潤。


