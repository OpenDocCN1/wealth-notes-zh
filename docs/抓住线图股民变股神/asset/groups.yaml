    # 二條均線戰法在空頭趨勢下的操作定法


    當盤勢出現由多轉空的高檔反轉位置，想要採取二條均線戰法，短線致勝，就要進一步觀察是否有出現下列現象：


    +   1. 反轉型態至少出現「頭頭低」（蜂窩低）。

    2. 當10日均線與24日均線同時向下，或是10日均線向下即將與24日均線形成死亡交叉，當股價跌破10日均線，做空，成交量不一定放大，如果成交量放大更好。

    3. 同時看第1個支撐位置是否形成下跌的重要支撐，以及距離放空位置的可能獲利幅度。

    4. 進場後，停損守10日均線或24日均線中離股價最近的一條均線。

    5. 開始下跌，守10日均線，當獲利超過10%以上，依K線出場訊號出場，或急跌後突破下降急切線回補。

    6. 出現急跌情形，改以K線智慧戰法操作。


    # 二條均線戰法在空頭趨勢下的操作紀律


    採取二條均線戰法時，在空頭行進中也要注意以下的操作紀律：


    +   1. 24日均線方向維持向下，持續做空。

    2. 10日均線、24日均線同時向下呈空頭排列，股價在下方，依波浪型態反彈後再下跌時做空，或盤整跌破下頸線位置，持續做空。

    3. 股價收盤突破10日均線一定要回補。10日均線持續下彎，股價收盤跌破10日均線，再進場做空。'
