    ### 第1章 一切由心造 內在成功 外在才會成功


    事實上，股票市場並不是如此單純，這個開放的金融交易市場充滿了豺狼虎豹，不但有主力大戶、還有公司董監事、投信基金、自營商、政府基金、外資、中資……，試問，這些大咖拿著大筆金錢投入股市，真的都是要長期投資績優的公司嗎？他們進入股票市場的目的和一般散戶一樣，要在市場賺錢。因此，常看到外資上週大買台積電5萬張，這星期大賣台積電4萬張，就不足為奇了。


    ### 利用人性的高明騙術


    現今社會上有許多詐騙集團，專門騙取錢財，他們的招數千變萬化，讓人防不勝防，但是萬變不離其宗，騙人的方法不外乎以下3種：


    1. 利用人性的「貪婪」：利用人性想不勞而獲、一夜致富、愛貪小便宜的心態，因此有所謂的中獎騙局、投資公司的騙局、金光黨騙局等。

    2. 利用人性的「恐懼」：人們因為一時的害怕，往往失去理智的判斷，因此，歹徒製造假綁票勒索，假檢查官說你帳戶觸法要轉移保管帳戶，假傳票讓人恐懼而聽從他人擺布。

    3. 利用人性的「感情」：利用人的同情心，騙子先騙感情，再騙錢財，這種例子不勝枚舉，近來報紙報導剝皮酒店小姐利用客人的同情心詐財、單身且高學歷的富家小姐網路交友被騙千萬元等實例，都真實的存在我們的生活當中。


    ### 看穿股票漲跌 猜猜不知他人的心理遊戲


    在股票市場，那些大咖要炒作一檔股票，賺取散戶的錢，用的方法其實跟上面所說的一模一樣，不相信我們來看一看。


    1. 主力要布局吸貨的時候，在市場上放一堆的壞消息，讓散戶因「恐懼」而不敢輕舉妄動，即使有部分散戶不怕，而且進場買進股票，還是會被他們用「甩轎」方式下殺，嚇得一些散戶出場。外資也是一樣，研究報告說要調降某檔股票評等，嚇得投資人趕快賣出，他們卻是在買進。


    散戶要瞭解，股市的主力大戶，不論內資、外資，都是要賺你的錢，所以都是與你敵對的，怎麼可能跟你说實話。


    2. 當主力大戶要倒貨的時候，就利用人性「貪婪」的心態，高檔放利多，拉抬股價，誘惑散戶進場，當你發現被騙，他們早已荷包滿滿的下車了。

    3. 股市中最毒的一招就是用感情騙你，讓你對某檔股票產生感情，讓你願意終身對它不離不棄。至於如何能讓你對它死忠呢？就是把公司的基本面說得太好，而且言之有理，讓你堅信不疑。


    各位想一想，許多人股票套牢不肯賣，是不是認為公司很好，總會有回本的一天，結果當年股價1105元的彰銀（2801），抱了20年，現在的土地資產也沒有減少，截至2012年2月底，股價才18元左右，真是感情用事之後，情何以堪哪！


