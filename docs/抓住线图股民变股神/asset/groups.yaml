    # 第 **3** 篇 價量關係的進階應用：高檔暴大量的因應策略


    # 一、 假說：成交量有時會騙人


    一般人認為，成交量是每天實際交易的數量，是不會騙人的。實際上，純以數字來說，成交量是不會造假的，但是以實質交易的對象來說，就不一定是真實的。


    簡單說，主力在操控一支個別的股票時，大部分籌碼控制在主力手中，這時股價的漲跌就不一定呈現成交量的真實現應。例如在高檔要營造多頭強勢的氛圍，主力可以在甲帳戶掛出，而在乙帳戶買進，如此一來，成交量急劇增加，容易引誘散戶上當去追買。


    前迹說明主力可以營造大成交量，相反的，主力沒有辦法縮小成交量，當市場出現恐慌下跌的時候，主力的買賣只會讓成交量更大，所以在某方面來說，萎縮的成交量更加真貨。


    當投資人對股價看法趨於一致時，成交量會愈少。例如股價上漲到某一價位時，持有股票的投資人認為股價是高點，要獲利賣出，而空手投資人同樣認為股價是高點，不願買進，這時就會造成無量下跌；相反的，當投資人對股價看法愈分歧時震盪愈大，成交量就會愈大。


    # 二、 高檔暴大量，做價商的作崇


    多頭上漲一段基本波過後，出現一個特別突出的大量，可能是即將來臨的反轉訊號，或者是回撤修正的的訊號。


    凡是高檔暴出大量，大多不是什麼好事，在多頭結束的頭部發生前，共同的特徵就是「暴大量」，所以高檔暴大量不能輕忽。


