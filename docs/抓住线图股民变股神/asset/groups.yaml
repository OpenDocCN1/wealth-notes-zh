    # 股票獲利目標管理的4個致勝關鍵


    股票獲利目標管理的成功關鍵，在於選股能力要強及百分之百的執行力。以下並提供4個致勝關鍵：


    +   1. 要達成目標→停利比停損重要

    2. 獲利要有效率→短線比長線重要

    3. 注意時間成本→強勢比漲勢重要

    4. 紀律執行→執行與選股一樣重要


    要達成獲利目標，一定要執行停利，否則獲利回跌，浪費一次獲利機會及操作的時間。


    短線能夠快速獲利，目標才易於掌握，除非等到大波段的機會，否則要抓住每個能夠快速獲利的機會操作。當買進後是飆股走勢，利用飆股戰法操作；如果是強勢波段股，可以長線短做，無論如何都要以獲利為第一目標。


    由於股票獲利目標管理有時間上的限制，所以要選擇強勢股操作，一些緩慢牛步上漲的股票，一週半月上上下下漲不到5%的多頭股票，都要換成強勢股操作。


    選到好股票，要實現獲利必須執行操作的紀律，例如選股條件的紀律、進場位置的紀律、停損的紀律、持股續抱的紀律、停利的紀律，每一步都要執行紀律，如此才能順利完成每一次的賺錢交易。'
  - "[PAGE 272]\n\n# ## 第10章\n# 認清短線操作的優勢及必備條件\n\n短線交易為交易策略的一種，一般包括當沖、隔日沖、2日到5日的交易。只要屬於短時間內完成進場出場的交易，都算是短線交易。無論是做長線波段，或是短線快進快出，只要方法正確，執行力百分之百，都能在股市中累積財富。\n\
    \n# ### 短線操作的6大優點\n\n短線操作戰法尤其適合一般金額不大的投資人，利用短線交易是最佳快速累積資本的方法。在後面文章介紹短線操作戰法之前，本章先說明短線操作的特性及重要觀念。\n\
    \n+   以下為短線操作的6大優點：\n1. 任何趨勢、任何大小波段都有交易機會賺錢\n\n   （1）多頭時，賺上升波或乖離過大的回檔。\n   （2）空頭時，賺下跌波或反彈波。\n\
