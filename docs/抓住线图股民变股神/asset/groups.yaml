    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_41_1.png)\n\n資料來源：富邦e01電子交易系統\n\n##\
    \ 第2章 改變自己 才能改變股票賠錢的命運\n\n### 想要賺錢 就要改變正常合理的想法\n\n股票市場說穿了，其實是綜合了所有基本面、技術面、產業面等等要考慮的因素，最後決定進場，在持有股票一直到賣出股票的過程，都受到心理面的重大影響。換句話說，主力在作價一檔股票，從頭到尾都在跟散戶打心理戰。\n\
    \n試想，主力在跟你打戰，而散戶還以為是正常合理的投資交易，難怪散戶每次賠錢後還是一頭霧水，弄不清楚到底是怎麼回事。\n\n經濟學家凱恩斯曾經說過：「在非理性的世界中去進行理性的投資，將造成天大的災難。」例如，公司接獲了大訂單，股價理應會有好的表現，為什麼反而下跌？投資績優公司應該會抗跌，為什麼大盤不好時，那些營運績優的公司反而跌更多？從以上可以知道，如果你沒改變「正常人」的合理想法，恐怕你在股票市場上永遠也賺不到錢。\n\
    \n以下幾個觀念是散戶經常犯的錯誤，在正常理論上是有他的道理，可是在股票實際操作上卻是一定要避免，否則永遠跳脫不出賠錢的命運。\n\n#### 改變自己 絕對不能往下攤平\n\
    \n往下攤平，的確是一種操作的策略，但是實施這種策略是要有條件的，其中最重要的條件是你的口袋要夠深，所以攤平的策略只適合有資金實力的大戶主力、法人及外資等去應用，一般小資本散戶是絕對不能採取往下攤平的方法。\n\
    \n其次，往下攤平的重要條件是股價來到低檔盤底位置，換句話說，就是下跌空間有限，股價進入超跌區，合乎股神巴菲特所謂的「價值型投資」位置，才能用往下攤平的策略。\n\
    \n我們在實務操作時，要出現合乎物超所值「價值型投資」的機會，可能要1、2年才會出現一次，絕大多數時間並不適合用攤平的方法，尤其對一般小額短線的投資人，更是不能在賠錢時往下攤平。\n\
    \n以下的說明希望能改變你賠錢時想要往下攤平的念頭：\n\n- 1. 做多買股票是希望它上漲，如果股票不漲反而下跌，表示你選的股票走勢方向錯誤，它是往下走空頭，既然是往下跌的股票，當然不能去買。\n\
    - 2. 下跌的股票無法預測會跌到哪裏，如果一直在下跌時去攤平，會造成不可預測的風險及巨大的損失。\n- 3. 往下攤平會使得資金長期套牢無法運用，即使止跌回升，一心只想早日解套，根本無法獲利。\n\
    \n研究股票者都知道艾略特晚年發表的費波南希數列（Fibonacci Sequence）及黃金定律（Golden Ratio），提到0.382、0.618兩個數字，一般在股票上漲一個波段之後，依經驗統計，在波段下跌回檔到0.382、0.5、0.618的位置時容易產生支撐，因此許多人股票套牢後，股價下跌到上述位置就再買進攤平，結果卻是經常愈攤愈往下跌，最後造成無法挽回的巨大損失。我們看宇峻（3546）的實際圖例就清楚了。\n\
    \n宇峻股價由240元漲到507元後開始回檔，上漲了267元（507元－240元）。假如買在480元，下跌時沒有賣出，反而在回檔到0.382位置、股價405元，以及回檔到0.5位置、股價373元和回檔到0.618位置、股價344元時，分別買進攤平，後來股價繼續下跌到2011年8月22日的最低價65.2元，往下攤平的結果，不但資金被套牢1年多，而且平均成本為400.5元，等於未來宇峻要上漲6倍，投資人才能解套。\n\
    \n![](img/e6a266bab53ec29e9cf6f50724f4d142_44_0.png)\n\n#### 改變自己 絕對不能套牢死抱\n\n\
    股票被套牢，幾乎是每個散戶都會發生的事，這是散戶最常犯的一個錯誤，大多數的原因是賠錢不願意賣。\n\n有一次與軍中退伍的同事聚餐，一位長官在2007年8月8日用退伍金以80.8元買了30張國泰金（2882），聚餐當天國泰金收盤價已跌至42元，他問我該怎麼辦？\n\
    \n買股票被套牢大多是下列5種原因造成的：\n\n- 1. 在多頭時買到高檔，接近快要到頂反轉的位置被套牢，空頭時自認股價低而去搶反彈時被套牢。大多數的散戶不會技術分析，無法判別是否買在高點，更看不出股價要反轉，當股票下跌時不知道何時會止跌，分不清是反彈還是回升。\n\
    - 2. 在多頭市場中去買弱勢股。當多頭市場時強勢股漲得快又高，一般投資人不敢追高或是買不到，因而去買比較緩漲或是落後的弱勢股，期望能夠補漲。但是往往多頭時股票是強者恆強、弱者恆弱，一旦大盤反轉，這些弱勢股會加快下挫，結果漲時沒份、跌時有份，如果一時以為沒漲應該不會跌而小賠不賣，結果最後反被套牢。\n\
    - 3. 買進股票時沒有設停損，股價下跌時不願面對，只想等幾天，希望能夠漲上來，但是經常事與願違。有人設了停損，但是賠錢時不願意賣，結果和沒設停損一樣，慘遭套牢。\n\
    - 4. 短線賠錢改為長期投資。這是最多散戶賠錢時的想法，他們的論調就是「不賣就沒有賠錢」，因此許多人股票一抱3年、5年，甚至8年、10年，卻一直處於賠錢狀態。\n\
    - 5. 受公司基本面影響，始終認為好公司的股票不可能一直下跌，因此不願意賠錢賣而遭套牢。\n\n#### 股票套牢的2種處理方法\n\n股票住進套房，的確是件令人懊惱的事，不但心情受影響，每天看到股價上下震盪，賣也不是，不賣也不是，賣了要賠錢，又怕賣了就漲；不賣萬一繼續下跌怎麼辦？這就是投資人被套牢的心情。\n\
    \n股市中沒有專家，只有贏家和輸家，兩者區別在股票判斷錯誤或被套牢時要怎麼處理，才能夠化損失為最小，甚至反敗為勝。以下兩個方法可做參考：\n\n- 1. 立刻出清手上所有的股票\n\
    \    這樣做聽起來很殘忍，也下不了手，雖然賠錢，但是這個動作可以立刻讓你脫離苦海，清靜思緒，檢討後靜待盤勢明朗之後再出發，否則手上有被套牢的股票，操作情緒難以不受影響，即使行情好轉，你的資金也在套牢的股票上。\n\
    \n- 2. 反敗為勝的唯一方法就是「汰弱換強」\n    如果一直抱著原先賠錢的股票，每天巴望著能上漲、回本、解套，基本上是一廂情願，股票既然成為下跌走勢，正常狀況反彈是無法回到前面的高價，所以趁著反彈出脫，換買多頭走勢、正在上漲的股票，才能迅速解套，甚至反賠為賺（請參看第49頁圖例說明）。\n\
    \n另外特別提醒，千萬不要往下去攤平，一檔下跌空頭的弱勢股票，攤平只會套牢更多的資金和時間成本，萬一繼續下跌，後果就不是一個「慘」字可以形容了。\n\n###\
