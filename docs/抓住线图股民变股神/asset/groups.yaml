    # ## 第 1 章


    # 獲利目標達成利器2：

    短線賺高報酬的飆股戰法


    飆股人人愛，可是沒有一套方法是不容易操作的，不但技術分析功力要超強，還要具備過人的膽識，當機立斷的執行力更是操作飆股的必備條件。想要嘗試快速賺錢快感的讀者，除了仔細閱讀以下的飆股戰法外，個人情緒的掌控要更穩定。


    # ■ 構成飆股的要件


    飆股是指起漲時快速發動，經常在開盤後半小時內就漲停板，讓人措手不及上車，以後數日連續上漲，短時間獲利驚人，行進中有時停留一或兩天，又繼續飆漲。


    構成飆股的要件如下：


    +   1.  股性活潑，曾經飆漲過，股本不大，為中小型股。

    2.  新產業、新技術、獨佔性、轉機題材股。

    3.  法人持股不多，資券同步增加。

    4.  大盤處於多頭時出現飆股的機會較多，大盤在多頭處於盤整盤時也會出現飆股。'
  - '[PAGE 289]


    同時，飆股也須具備以下8種圖形條件：


    +   1. 經過長期盤整（2～3個月以上）。


    +   2. 底部漸漸高的型態。


    +   3. 盤整期出現草叢吸貨量。


    +   4. 突破頸線，帶量發動。


    +   5. 發動前，短中長期均線糾結。


    +   6. 發動時，力道夠強，量價均佳，短期上檔無壓。


    +   7. 每日瀏覽強勢股，歸納出主流股，搜尋符合潛在飆股要件的標的商品，置入個人鎖股的資料，鎖股，等待發動時機。


    +   8. 盤中即時選股，出現符合飆股條件的標的，立刻行動。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_289_0.png)


    資料來源：富邦e01電子交易系統'
  - '[PAGE 290]


    # 短線飆股戰法總整理


    想要學到短期賺高報酬的飆股戰法精髓，你要先認識飆股戰法，說明如下：


    戰法優點：


    +   1. 選股標的明確。

    2. 快速進出、低風險。

    3. 短期達到高獲利。

    4. 不考慮基本面、消息面，以技術面進出。

    5. 適合100～200萬元資金操作。

    6. 需要盯盤操作。


    基本功力：


    +   1. 快速精準的選股能力：精通熟練的技術分析功力，熟悉飆股的特性及技術型態，掌握主流類股。

    2. 盤中變化的解讀力：包括近日大盤方向、當日大盤可能變化、盤中各項數據變化的判斷。

    3. 當機立斷的執行力：要具備買進時「敢不敢」，賣出時「狠不狠」的執行力，一切均以技術面操作。

    4. 操作飆股不要想買在最低點、賣在最高點。

    5. 要大膽違反人性，以技術面操作，遵循紀律規則。


    操作目標：


    機會確認時，短時間獲利50%，甚至倍數以上。


    交易條件：


    +   1. 以波浪型態最優先考量，順勢做多交易為主。不做逆勢單。

    2. 採用日線選股進場，看日線出場。'
  - '[PAGE 291]


    3. 飆股戰法以用在中小型股為原則，並不適合大型股。


    # 操作飆股的13項教導守則


    飆股操作的重要前題是大環境要處在大多頭趨勢，也就是說國際行情穩定，且台股大盤趨勢確認為多頭行情的情況下。以下提供操作飆股的13項教導守則：


    +   1. 以個人資料庫鎖股及當日盤中即時出現的強勢股為標的。


    +   2. 以開盤後在9點～9點10分內強勢拉向漲停的個股為第一優先追進的強勢標的。當出現這種個股時，要立刻打開走勢圖，在10秒內做下列圖形研判：


    （1）看波浪型態，是否為多頭起漲點？是否有飆股型態？是否有上漲空間？


    （2）看價量結構，是否價漲量增？


    （3）看均線排列狀況，是否符合上攻的多頭排列？


    （4）如果這檔個股的圖形很好，或者原本就是自己已經鎖定的股票，當機立斷，勇敢的立刻買進。


    +   3. 在9點30分前奔向漲停的股票，為第二強勢股。如果這檔個股的圖形符合飆股條件，可以買進。


    +   4. 在9點30分到13點間，盤中慢慢漲停的股票列為一般觀察名單，可能是走多頭的股票，但是不一定是會飆的股票。


    +   5. 在10點至12點中間時段勿隨便就追高，強勢股票的主力早在10點前就已完成今天的策略動作，而10點至12點時段大多是散戶在交易，或者是主力為配合期貨多空而在現貨進出，這段時間除非手持股出現紀律出場的狀況，才要處'
  - '[PAGE 292]


    理，否則不要隨便做動作。


    +   6. 在12點至13點30分期間，要觀察是否有尾盤強勢往上拉向漲停的股票，這是明日會續強上漲的股票，檢查線形後買進。


    +   7. 當日個股出現大量長紅K棒突破盤整區、均線糾結區、下降切線、反轉的「底底高」的第2支或第3支腳成立時的強勢發動位置，當股價往上時，立刻追進。


    +   8. 當日追進的股票，走勢不如預期時，可採取當日券出。因此要開好融資帳戶，當日才能做券出。


    +   9. 持股次日開盤，漲幅在3.5%以上續抱；如果漲幅在3.5%以下，在回跌接近平盤時出場。


    +   10. 持股次日漲停，當漲停打開，回跌到漲幅剩5%時，出袋停利。


    +   11. 先前高點賣出的股票，當股價殺低出現買點時，可再買進。


    +   12. 股價已上漲一段，在前一日收黑K線時賣出。如當日再發動往上，拉出長紅K線過前一日高點時，再進場繼續操作。


    +   13. 漲停鎖住的城市不可賣，要賣弱勢股，抽出資金，換買強勢股。


    # 操作瘋股的5大心法


    +   1. 膽大心細，飆股發動前後經常會有洗盤的動作，仔細觀察前後價量的關係。參考第293頁振維（3520）圖例。


    +   2. 操作飆股也可以長線短做，用長線保護短線，同樣能夠賺到整個波段。


    +   3. 飆股战法著眼股市「強者恆強」的慣性，以追強勢股為操作'
  - '[PAGE 293]


    的主軸，進出快速，追求短期獲得高利潤，因此需要專注及高超的操盤技巧及心法。總之，進場不對，在小賠時就要立刻出場。抓對飆股獲利既快又大，是獲利效率最高的方法。


    +   4. 做飆股不看基本面，飆股為主力資金及籌碼的作戰，速戰速決，短時間漲幅驚人。要享受這種快速賺錢的滋味，除了技術分析要精通之外，更要具備當機立斷的執行力。


    +   5. 操作飆股要集中精神注意盤中變化，要具備百分之百的執行力，操作飆股，當股價轉弱（不一定是賠錢）時就立刻出場，所以風險反而較小。


    # 操作飆股四大守則


    +   1. 要具備紮實技術分析能力，熟練飆股型態，每日檢視強勢股。


    +   2. 要具備「敢不敢」、「狠不狠」的執行力，當符合飆股條件時，勇敢介入，並以個人飆股操作守則執行出場紀律。


    +   3. 操作飆股基本面勿放心上，一切以技術圖形走勢及進出場守則為準。


    +   4. 以飆股特性操作，看清洗盤、續勢等手法，賺到最高點。


    ![](img/e6a266bab53ec29e9cf6f50724f4d142_293_0.png)'
