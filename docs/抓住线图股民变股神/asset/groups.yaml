    - 3. ③（1）跌破上漲的急切線出場位置，出場。（2）K線前一日出現大量長紅K線，今日卻出現開低走低的黑K線出場訊號，出場。

    - 4. ④（1）黑K線跌破前一日低點，出場。（2）黑K線跌破3日均線，出場。

