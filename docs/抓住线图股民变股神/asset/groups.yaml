    次操中去做檢討修正，不斷的檢討、修正產生無數次的體悟，直到找到自己的固定操作模式，遵守自己訂定的交易規則，發揮簡單的力量，最終會覺醒悟透股市漲跌的循環，自有一定可以遵循的道路。


    在股市，我跟大家一樣被歸類為「一般投資人」，或者稱為「散戶」，是市場人數最多的最下層，上面有主力大戶、公司董事、法人、自營商、基金經理人、政府基金、外資、中資、金融巨鱷……
