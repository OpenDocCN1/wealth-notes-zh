    ◎ 定義：多頭上漲一段後出現「頭頭低」現象，波浪轉折高點不過前面波浪轉折高點而下跌，注意！這與「多頭回檔」不同，多頭回檔是突破前面高點後才下跌。


    ◎ 動作：持有多單的要退出，避開股票進入盤整或反轉的風險。空手投資人不


    可有做多或做空的動作，要「等到」趨勢明朗時再說。


