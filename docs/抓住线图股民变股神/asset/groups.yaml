    # 第 3 章 波浪型態進階研究 3 從圖形看出股票上漲難強度


    波浪型態可以分辨走勢的方向，但是同樣多頭的股票，有的強勢上漲，有的卻漲得很慢。我們當然希望能夠找到會飆的強勢股，這樣不但賺得多，而且賺得快。


    公司未來的發展當然會影響股價的上漲，例如去年賠錢，今年能夠轉虧為盈，股價自然會表現。問題又來了，一般散戶怎麼會知道公司半年後、一年後會賺錢呢？等到你知道的時候，股價已經漲上天了，如果這時才買進時，又是愛到最高點。


    其實，在走勢圖中會透露出強勢股的態勢，強勢會漲的股票從起步到進步前進，處處擁有強者的風範，現在讓我們由圖形來看走勢圖會透露出哪些態勢。


    # ☒突破盤整前 股價會這樣表勢


