    \n- ⑪ 長黑K線跌破20日均線，型態為「頭頭低」，而且均線下彎，做空。\n- ⑫ 收盤突破20日均線，回補。\n- ⑬ 收盤價跌破20日均線，做空。\n\
    - ⑭ 收盤突破20日均線，回補。\n- ⑮ 收盤價跌破20日均線，做空。\n- ⑯ 收盤突破20日均線，回補。\n\n# 第4篇\n\n# 第8章\n\n\
    # 穩健獲利密技 三條均線戰法\n\n# 第8章\n\n# 穩健獲利密技\n\n# 三條均線戰法\n\n如果利用均線交叉特性做為操作方法，其中比較穩健的做法，可以用二條均線的黄金交叉與死亡交叉的訊號，來代替前面股價與一條均線的交叉。\n\
    \n當出現黃金交叉時，買進；出現死亡交叉時，賣出，同時，再設定一條長期均線做為趨勢方向的基準，如此可以降低失誤率，不失為一種穩健的操盤法。\n\n## 三條均線戰法重點說明\n\
    \n以下說明三條均線戰法的主要操作方法：\n\n### 戰法優點：\n\n- 1. 規則簡單清楚，容易執行。\n- 2. 不需要看盤，收盤前5分鐘看盤即可。\n\
    - 3. 不會賠大錢，用長期均線可以做到波段獲利。\n- 4. 不用顧及技術分析指標、成交量、基本面。\n- 5. 適合任何資金操作。\n- 6. 解決盤中上下震盪的困擾。\n\
    \n基本功力：熟練技術分析的「四大金剛」，執行能力要100%。\n\n操作目標：走勢明確時，順勢交易，每次獲利能夠達到20%以上。\n\n交易條件：\n\n\
    - 1. 以波浪型態為最優先考量，順勢交易。不逆勢交易。\n- 2. 採用3日均線及10日均線為操作進出依據。24日均線做為趨勢方向及多空的依據。\n- 3.\
    \ 跌深要經過打底，出現「底底高」現象，多頭走勢要確認。\n- 4. 漲多高檔要做頭下跌，出現「頭頭低」（峰峰低），空頭走勢要確認。\n- 5. 無論進出，均以收盤價確認。\n\
    - 6. 可以減少進出操作的次數，容易控制操盤EQ。\n\n## 在多頭走勢做多的操作定法\n\n想用三條均線戰法在多頭走勢做多，必須注意以下的交易規則：\n\
    \n> **進場** 當3日均線與10日均線出現黃金交叉，股價在24日均線之上，且24日均線向上，當股價站上3日均線時，買進。\n>\n> **續抱** 在3日均線與10日均線沒有出現死亡交叉前，續抱。\n\
    >\n> **出場** 在收盤前確認3日均線與10日均線出現死亡交叉，股價跌破3日均線時，出場。\n>\n> **停損** 進場後，守10日均線。\n>\n\
    > **趨勢** 股價在24日均線之上，且均線保持上揚，趨勢為多頭，\n\n順勢做多。\n\n## 在空頭走勢做空的操做方法\n\n想用三條均線戰法在空頭走勢中做空，必須注意以下的交易規則：\n\
    \n- **進場** 當3日均線與10日均線出現死亡交叉，股價在24日均線之下，且24日均線向下，股價跌破3日均線時，做空。\n- **續抱** 在3日均線與10日均線沒有出現黃金交叉前，續抱。\n\
    - **出場** 收盤前確認3日均線與10日均線出現黃金交叉，股價站上3日均線時，出場。\n- **停損** 進場後，守10日均線。\n- **趨勢** 股價在24日均線之下，且均線保持下彎，趨勢為空頭，順勢做空。\n\
