    **陈昌文：**


    女人当“贱人、小人、懒人”，男人会很喜欢的，这是满足人性的弱点，就是同而不和。人是一个需要满足个人需求的动物。人为了满足个人需求而放弃正确的规律、原则。能尊重规律、原则的人非常少。您只要赞同他，您就可以谋杀他。亲贤臣，远小人，对大多数人来讲就是说说而已。市场上，还是小人的市场大，君子的市场小。我们做的是君子市场，赚钱自然就慢，我只图个心安而已。


    良知良能，不过就是求心安。心不安，就是心怀鬼胎。为人不做亏心事，半夜敲门心不惊。问心无愧，心自然就安了。一个人魂不守舍，大多都是因为小人心态。一个人被人骗，或者去骗别人，都是为了“同”，放弃了“和”的现象。


    您说我们男人娶老婆，要取个“同”的？还是取个“和”的？大多数男人，也只愿意取个“同”的。最后被骗的裤衩都不剩，也愿意。您说，一个女人嫁男人，是喜欢“和”的？还是喜欢“同”的？当然是喜欢嫁给“同”的，“和”的'
