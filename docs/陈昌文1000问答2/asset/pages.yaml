  md: '上海的专卖店大多是晚上装修，所以晚上也是不休息，把工人送到工地。工人施工，我就眯一会，要么再去仓库拉点货。那段时间我开得最多的车就是金杯和全顺。高速上金杯开到一百三十码，整个车都是飘动的。开车打瞌睡是再正常不过的了，好在几年前高速上车不多，尤其是晚上。现在想想也是挺后怕的。其实不只是轻易成功的人不知道珍惜，自己拼来的，在成功过后也不知道珍惜成果。


    一两万的衣服，几万块的包包买起来并不觉得有什么。最致命的是把公司直接交给别人管，尤其是交给亲戚。堂哥和嫂子总认为公司的业务是他们攥下来的，舅舅觉得工人都是他带出来的。结局显而易见，他们带走了公司的业务。


    接下来的就是持续亏损，熬了半年才开始辞退员工。这也是不知道如何管理公司的结果，并不是所有人都有杀跌止损的魄力。公司大了以后，也不是你一个人重新出去谈业务，就可以平掉公司开支的。之前工多，工人都是包年的。公司也正值从广告装修向建筑装饰转型。


    回首这几年，公司也就辉煌了一年左右，由于没有及时止损，也没有能力让公司起死回生，挣的钱也大多亏进去了。不是不知道公司的情况，而是你一手做出来的公司不想就这么没了，甚至拿房子抵押贷款用来资金周转。想起早年公司也没钱，还拿车子去抵押了十万块用来周转。好在那时候公司就过来了。我跟姐姐并没有矛盾，公司清算给姐姐了，现在的公司也换了个地方。我这几年的成绩也就是买了套房子。


