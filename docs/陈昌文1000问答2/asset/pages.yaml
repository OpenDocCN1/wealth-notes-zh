    # 840、盈利并没有什么了不起，大多数人都能盈利


    学员：

    老师，您讲的太对了！智慧是什么？从何能获得？书读得也不少，路走得也不算很短，人也遇到了一些。为什么还会有如此天灾人祸？难道成功一定要经过失败才可以吗？


    陈昌文：

    成功首先是智慧问题，之后才是努力问题，才是读书学习问题。智慧这东西，跟读书多少，拼命、努力、关系不大，也和失败关系不大。


    善于总结是第一步，也就是您不能在同一一个地方跌倒两次。有些人，会在同一个地方跌倒几十次，甚至一辈子。这个同一个地方，包括人与事、与物。而高手是什么？高手是从一开始，就能判断出来，哪些人不可交往，哪些事情不可以做。


