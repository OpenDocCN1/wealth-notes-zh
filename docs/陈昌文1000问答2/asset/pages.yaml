  md: '# 前言


    《陈昌文方法 1000 问：师门问答集》（1、2）是建立在陈昌文先生的《陈昌文解读《论语》》（1、2）和《陈昌文方法 72 大营销系统》（上、下）基础之上的。


    陈昌文先生创立“高端老板社群”意在搭建一个集百万、千万、亿万富翁等老板、企业家于一体的圈子和交流学习的平台，传播儒家思想和陈昌文方法 72 大营销系统。


    儒家思想，是中国传统文化最精髓的部分，是真正的成功之道。任何人，只要学习透彻儒家思想，践行儒家思想，这一辈子，都不 可能过得差。拿来做业务，业务也能做得风生水起。


    陈昌文方法 72 大营销系统，每一个系统，都是教老板们如何 做自动成交的。也就是教您安身立命、赚钱的本事、营销的本事，把事业做大做强的本事，让成功的人更加成功。'
