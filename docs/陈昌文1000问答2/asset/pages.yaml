- pgno: 309
  md: '+   2、 陈昌文方法。


    继续儒家思想呢，重要的核心是什么？


    比如，己所不欲勿施于人。


    比如，真诚、勤奋、诚恳、一切求真……


    比如，用之则行，舍之则藏，您能理解我，就买单，不能理解，算了。我 也不主动营销您，只是讲给您听，您了解了了解。


    陈昌文方法呢？


    首先，36 循环系统是用来搞流量的；广告尾巴系统是用来做转化的； 图片系统是用来增加信任度的；文案系统是用来让大家熟悉我们的营销 体系的； 售后合作系统是专门解决大家的后顾之忧的；同行数据库系统
    是专门解决大家有效率的改编内容的；尊重人系统是用来让大家和气生 财、不断地成交单子，不得罪人的；聚焦一个环节系统是让大家永远保 持一个环节的，让大家精益求精，最终出单的。


    线下分享会，主要是讲出来全貌，开篇精确的讲一个 36 循环系统。 结尾，精确的讲一个聚焦系统。中间只是提一句话。儒家思想，也只讲 几个核心。


    如此，一篇精美的线下分享会文案、演讲稿出来，则，大杀四方， 天下无敌，各位传统企业老板如获至宝，各位创业者，如看到了救命稻草。 这些人，按照这个模式听完过后，就加上您的微信。然后，您再更新一下，
    稍微讲一下，想学详细的，就奉上香火钱。


    此篇文章极其重要。领悟，执行。'
