  - '[PAGE 3]


    # 推薦語


    芳誼本身就是她所倡導的生命整合式價值觀的榜樣：如何活得美麗、健康、有靈性且又富裕！與她合作共事多年，我感到她的喜悅與智慧油然而生。她運用獨一無二的願景與思考，串連和療癒我們內在的矛盾與分裂。Rosie，為妳喝彩！


    詹姆斯·華納斯博士（James Wanless）

    國際企業顧問、開拓型導師

    「領航者塔羅：新時代導航地圖」系統創始人


    芳誼導師的財商課終於出書了，我一邊看一邊想，這不是我一直都在做的嗎？二十歲開始出來創業，我經歷過巨大的成功，也曾經慘淡失敗，但總是有一股力量推動著我繼續向前，獲得下一個良機。常常有人想跟我學商業，我也不知道怎麼把已經成為我直覺的東西分享給他們，通過本書系統化的梳理和清晰的案例，我一路創業的心法總算能成為方法論了。這本書為個人、創業者，和任何有志與金錢打好交道的人，指了一條明路。


    我從商業進入產業，開始深入到另一個層次，以生態系的角度運作團隊和項目，每天面臨系統結構中各方動能的變化、權衡與協商，漸漸進入到了純以頭腦之術無法駕馭的領域。本書中的「意識能量層級管理」，讓我能以道的視角、游刃有餘地繼續踐行我的人生圭臬：「高高山頂立，深深海底行」。


    于子淇

    浙江晨陽新材料有限公司執行總裁

    滑鐵盧大學大數據實驗室中國代表'
  - '[PAGE 4]


    # 推薦語


    我與芳誼老師結識於英國，那時我剛打完一場雙 11 的勝仗（我的本行是電商大數據分析），在她的國際工作坊中，我感受到她結合東西文化allenges的美好品質，形成一種特別滋養人的氣場，我內心暗想：「若有朝一日我要把十幾年的身心靈愛好轉為事業，我想找她做夥伴」。驀然回首，當時的「有朝」已成「今朝」，我們成為了閨蜜與戰友。芳誼老師的才華洋溢，讓我在設計教學上如虎添翼，同時又能持續得到全方位的支持，很感恩她出現在我的生命中，我的靈魂再也不孤獨了。


    COCO 院長（錢坤）

    數字心理學導師、成長美學家

    神秘學導師，精通塔羅、薩滿等身心靈成長工具


    後疫情時代，我們的財富、工作、生活、身心都面臨重大改變，世界財富也將重新分配，一切快速大洗牌。這本《喚醒財富腦》，來得正是時候。未來正在獎勵那些擁有不斷更新的學習腦、財富腦、身心靈腦的人。芳誼擁有圍繞在世界頂尖成功人士身邊的第一線體會，加上多年來在身心療癒、財富探索上獲得巨大的收穫，無私貢獻了如何喚醒財富腦，以及不被疫情洪流擊敗、不被自身認知邊界給限制住的秘訣。同是身為教育家、長年在知名企業擔任講師和顧問的我，看了這本書大受啟發。相信這本書絕對會幫助你，安然度過這個混亂不安的時代，且脫穎而出，成為真正的得勝者！


    許景泰

    網路連續創業家，500 大企業指定顧問

    大大學院創辦人，SmartM 世紀智庫創辦人'
  - '[PAGE 5]


    # 推薦語


    我曾問學生為何想念金融系，學生回答：因為想賺很多錢！我笑了笑說：「不只你想，我也很想！」本書從身、心、靈這三個視角，全方位地喚醒我們的財富腦，也有許多鮮明的實證案例。我相信作者對於財務金融的思想貢獻是具有承先啟後、繼往開來的啟發性的。


    2012 年左右我就和作者成為朋友，一路上見證了她的成長與蛻變，從專業翻譯到心靈成長導師，從羞澀女孩到性感女人。她多變的風貌與多元的才識，著實為她的著作做了最好的詮釋。對於她一路上成長，我除了敬佩、欣賞與驚艷，更希望從她身上學到成功蛻變的秘訣。我在大學教授財務金融的知識，講的大多是別人的事蹟，而作者講的卻是她親身經歷的致富故事。讀完芳誼的書後，下次我會跟學生說：想致富，你要跟芳誼學習如何「喚醒你的財富腦」！


    陳倩儀博士

    青島大學經濟學院金融系特聘教授


    當財富的定義變得僅侷限於金錢時，我們最終會將心靈抵押來換取銀行帳戶裡的數字增長。這本書可以幫助你釐清、喚醒和活出你生命中更深的價值觀。金錢可以成為工具，將你的光和愛傳播給這個世界。


    尼克·萊佛士博士（Nick LeForce）

    國際NLP資深導師

    美國臨床催眠治療師考試主考委員'
  - '[PAGE 6]


    # 推薦語


    那些年，我們聽著她的聲音學習成長！那是一段不甚美好的時光，我因為投資失利而踏上學習之路，海外課程所費不貲，還要加上食宿機票，但我硬著頭皮去上課，因為我知道那是我翻身的機會……感謝耳機裡專業傳達外籍講師教學的芳誼，讓我完成學習，並能學以致用。她把多年來的經驗毫無保留地在《喚醒財富腦》中分享給大家，精闢地點出「你的外在世界就是你內在世界的投射」，想改變外在就得從內在開始動工。《喚醒財富腦》無疑是一本值得收藏的好書，不同的時間點看，會有不同的收穫！它不只是一本讀物，更是一本工具書，讓我們在遇到困難的時候，透過書裡章節找出自己當下的盲點，相信它可以喚醒你的財富腦，陪你邁向成功！


    Max

    臉書千萬廣告操盤手

    Like 萊客共享空間創辦人


    認識芳誼是在一堂國際名師的成長課程上，當時我是學生，而她擔任中英口譯，對她的認真投入和聰慧慧捷留下了深刻的印象。後來幾次接觸，得知芳誼從事口譯工作經驗早已非常豐富，曾為許多鼎鼎有名世界級的課程翻譯，那時我就心生羨慕地想：哇！這個女生多年都待在這些超級大師身邊，不是都學到精髓中的精髓了嗎？果然，後來她開始自己授課，現在又匯集各派大師們的智慧出了她的第一本書，等於幫我們整理好重點了呀！邁向自由的人生，一起喚醒財富腦！


    徐曉晰（Stacy）

    知名藝人／女性成長講師'
  - '[PAGE 7]


    # 推薦語


    不知道從什麼時候開始，我從以前充滿好奇與熱情地學習財富的知識，到用厭倦的態度看待市面上的財富書籍，但我不知道是什麼信念卡住了我，而閱讀本書帶給我許多的啟發。書中非常直白地將那些隱晦不明、不容易覺察的限制性信念指了出來，還提供了許多的思考方向與案例。


    第一次遇見芳誼時聽到她說：「我的願景是成為能夠影響、幫助許多生命的演說者！」她述說時發出了充滿靈魂、生命力的能量，後來我才明白她的底蘊來自汲取各大師的生命菁華。想像一下，有一位武學奇才，長期跟隨全球各大門派的掌門人，融會貫通各家的菁華，並用簡單易懂、直指人心的方式寫出一本書，讓更多人學習到致富之道，那會是一本怎樣的書？答案，就在你手中。


    星澄


    星澄管理顧問有限公司創辦人


    心靈吧台網站主持、線上課程研發者及教練


    身為世界著名人士所指定的同步口譯，我於 2012 年首次與作者一起前往馬來西亞進行工作。當時這位臨危授命但並未流露出緊張的年輕小姐，讓我刮目相看。我看到了作者在工作態度、專業能力以及個人靈性的持續成長。也很佩服作者，在經過多年學習摸索，發掘出真正的自己之後的努力與割捨。當我看見她堅持不懈地找到並活出自己的「本心」時，真是替她感到高興！我清楚地知道：與當今市面上噱眾取寵、誇大炫富、「毁」人不倦的人比起來，Rosie
    真的是一位很溫柔，契合自己本心，令人放心的老師。


    王立天 Frederick Wang


    自由生活家、MTS 群岳國際總裁


    《富爸爸商學院》暢銷套書譯者'
  - '[PAGE 8]


    # 推薦語


    在我人生 32 歲時，我還是個負債百萬，碰到金融海嘯，人生不知何去何從的窮光蛋。但真的很神奇，透過學習提升自己的財商，並把財商跟房地產投資、房地產事業結合，不到
    3 年的時間，我就跳脫富爸爸說的老鼠賽跑的上班族生活，在外圈過著時間自由、財務自由的日子，至今已超過 10 年的時間。之所以能快速達到這樣的境界，我覺得房地產是個工具，但最關鍵的關鍵因子，還是一顆有錢人的腦袋，也就是芳誼在本書中所說的「財富腦」。芳誼是我們這％群頻繁出國學習的同學中，受到世界級財商大師功力加持最深的，相信只要你好好閱讀這本書，你也可以打開你的財富腦，加速改變你的人生！


    Jerry

    JR 購屋理財資訊網創始人

    《百萬部落客教你如何月入百萬》作者


    在看我來，芳誼這位小時候曾經被懷疑是水腦症、其實只是腦袋大了點的小女孩，果真是一位既有內涵又有能力的漂亮女生。書中諸多的金句中，我最喜歡的一句話是「你做一件事的態度，就是你做所有事的態度」，這也是我對芳誼的基本認知。誠如芳誼在書中所言，關於財富的三大選擇，時時刻刻都在影響著我們的財富命運，可謂是醍醐灌頂式的提醒（在此賣關子給各位看倌自行去挖寶）。芳誼的寫作由淺入深、邏輯清楚且舉證諸多案例，讓人在閱讀中覺得人生充滿了無限的愛與希望，能夠在積極的信念中產生力量。非常貼心的是，每個章節末還加上了「本章重點小結」，讓我對作者的細膩更加欣賞。


    陳延宏

    《財務策略個案分析》作者

    IIC 科技大學商業管理學院教授兼院長'
  - '[PAGE 9]


    # 推薦語


    跟芳誼身為戰友多年，長久與世界頂尖人士共事下，她不僅將所學實踐在自己的人生道路上獲得成功，更在這本書裡傾囊相授，毫無保留。從書中言語文字我看得出她對讀者一也就是「你」的在乎，迫不及待想把最好的給你，這是她對這個世界愛的展現。現在是有史以來人們最需要學習成長的時代，芳誼結合了個案的輔導經驗，協助你打造真正的「財富腦」。這與我個人帶領的「喚醒你的財務天才」與「有錢人想的和你不一樣」等世界頂尖訓練有異曲同工之妙。而芳誼透過文字帶領讀者踏上一場酣暢淋漓的內外在財富之旅，我很驕傲與榮幸可以跟你分享這本好書—《喚醒財富腦》。


    Jackie 周啟達

    傑期國際教育學院創辦人

    富爸爸財務課程華語培訓師


    認識芳誼，是在 2015 年澳洲的黃金海岸，安東尼羅賓的「與命運有約」課程現場。那時我因為投資失敗而破產負債上千萬，我不明白自己怎麼墜入了失敗的深淵，原來當時
    39 歲的我，財富腦卻只有幼兒園的年紀。感謝芳誼將多年為各領域國際大師貼身口譯的經驗及實作的成果分享出來，成就了這本《喚醒財富腦》。本書不單單只是告訴你所謂的「財商知識」，更一步步地帶領讀者們朝向深層意識探索。《喚醒財富腦》無疑將為人們帶來巨大的幫助，我期盼每一個人都能在本書的引導之下，讓沈睡中的財富腦能被真正地喚醒，不只是意識上，更是身心靈全方位的覺醒，一步步走向完全平衡的幸福。


    張為堯

    無限魅力培訓師，銷售領導、創業品牌導師

    《翻轉業務力》、《5000 公斤的希望》作者'
