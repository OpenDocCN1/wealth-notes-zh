    \ Accumulator of Wealth, UAW）。但在成長的路上，我們還是喜歡用正向一些的語言去描述，就說是有待進步理財族吧！\n\n也許大華是過去對家人朋友太付出了，變成了散財童子，大家都找他借錢，結果人情留住了，但是錢都花出去了。像是\
    \ 我有一位企業家好友，早年經商有成績累了一筆財富，個性又好，於是身旁朋友只要有資金短缺都找他「周轉」，他也有求必應，甚至得到了「及時雨」的美名。\n\n\
