    本章我們學習了掙錢（主動收入）與賺錢（被動收入）的區別，販售時間的三種方式，理解財富的六個層次，財富四象限的不同思維，了解了財富自由是如何達到的，同時運用表格實際檢視了目前的現金流狀況。


    相信你對於有錢人如何創造收入有了從宏觀思維到微觀操作的理解，邀請你做一個深呼吸，給自己一些消化吸收的空間。


