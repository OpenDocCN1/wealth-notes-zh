    福感是在 500 的能量層級。


    筆記本的另外一邊，寫下所有 200 以下的負能量狀態，亭件能夠越具體越好，因為這會幫助你下次更快速覺察自己。例如有次公司全員大會後，我沒有得到表揚讓我很憤怒，我回家馬上跟老婆抱怨「為什麼我沒有得到升職？我明明這麼有能力，為什麼總是遇不到伯樂？」把這個事件與情緒寫在負能量活動的下面。


