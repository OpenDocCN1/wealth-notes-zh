    這個故事體現了為何有錢人越來越有錢，而窮人越來越窮，這就是金錢的聚集效應。


    連中國古老智慧都描述了這種現象，《道德經》七十七章說：「天之道，損有餘而補不足；人之道，則不然，損不足以奉有餘。」老子已然看透天道與人道的 cierent，天道求平衡，減有餘以補不足，而人道求利益，損不足來補有餘，而經濟活動規律，本就是由人所形成的。


