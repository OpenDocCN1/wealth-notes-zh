    # 販售時間的方式


    # 我們如何度過我們的一生


    ![](img/c2747cd0c5bf820d125459594a169642_102_0.png)


    - 一生中時間的分配 -


    ⑤「番茄鐘工作法」是一九八〇年代後期，弗朗西斯科．西里洛（FrancescoCirillo）開發的時間管理法。操作方式是以二十五分鐘為單位切割工作時間，這二十五分鐘只專注在目前正在進行的事項，完成後用五分鐘時間專心休息，反覆循環。'
