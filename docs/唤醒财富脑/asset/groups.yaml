    \ |  |  |  |  |\n| 自己現有淨資產佔目標比率 | % | % |  |  |\n\n- 資產負債表 -\n\n這個表格比較詳細，會花費你一些時間，對自己當下的資產做一個較精細的統計，包含現金、有價證券、房產（去除貸款價值）等，你才知道自己的起點在哪裡。目的是幫助我們盤點現有資產狀況，並對自己的財商能力做一個初步評估，而不是要對自己做任何的否定或攻擊。舉個例子來說，大華是一位三十五歲的男性，他在一間大型網路公司擔任中層主管，目前年收入是120萬台幣（約為人民幣28萬）。根據上述公式來計算，大華的目標淨資產應該是多少呢？\n\
    \n大華應該擁有的淨資產＝\n120萬（大華的稅前年收入）x 35（大華的年紀）÷ 10\n= 420萬\n\n依照大華的年齡段與年收入水平來說，在三十五歲的年紀，他應該要擁有120萬\
    \ x 35歲 ÷10 = 420萬的淨資產，這樣代表他在相仿收入與年齡的人群中，具備比較好的理財能力。他不需要去跟年齡不同或是收入水平差距過大的人比較，那是沒有實際意義的。\n\
    \n如果大華統計後發現自己的資產有840萬，足足是目標淨資產數值（420萬）的兩倍，這類人叫作超優理財族（Prodigious Accumulator of\
    \ Wealth, PAW）。\n\n這表示他一直都有把賺到的錢做很好的規劃，才能夠持續把錢發揮出更大的價值，讓他三十五歲時積累到比平均值高兩倍的淨資產。在馬太福音的故事裡，第一位僕人就是屬於超優理財族，於是主人還要獎賞他更多。\n\
    \n相反的，如果大華統計過後，發現他的淨資產不到210萬，只有420萬的一半不到，這又表示什麼呢？\n\n這表示大華的財商屬於第三個僕人的層級了，沒有發揮金錢的放大效應，反而在歲月裡縮水了，《下個富翁就是你》一書中說這叫做超遜理財族（Under\
    \ Accumulator of Wealth, UAW）。但在成長的路上，我們還是喜歡用正向一些的語言去描述，就說是有待進步理財族吧！\n\n也許大華是過去對家人朋友太付出了，變成了散財童子，大家都找他借錢，結果人情留住了，但是錢都花出去了。像是\
    \ 我有一位企業家好友，早年經商有成績累了一筆財富，個性又好，於是身旁朋友只要有資金短缺都找他「周轉」，他也有求必應，甚至得到了「及時雨」的美名。\n\n\
    這裡我們先不展開討論究竟是金錢重要，還是人情重要，第四章我們會分析「及時雨」性格的來源與這種性格如何阻礙了財富積累，導致有些人很會賺錢卻留不住錢。\n\n\
    總之，這個淨資產計算公式能幫助我們打破一些迷思，不再僅僅是用收入或既有資產價值的角度評估一個人的理財能力。\n\n我們要考量個人的賺錢能力與「在時間中的財富管理能力」。有些年收入高的人，最後淨資產卻不如年收入較低的人，就是因為缺乏「財富管理與積累」的能力。\n\
    \n《下個富翁就是你》書中還有個故事，主角叫做佛蘭德，年紀48歲，年收入22萬美金，在美國屬於中高收入人群，開著豪車、出入米其林星級酒店、出手闊綽。\n\n\
    經過公式計算（22萬 x 48歲 ÷10=105萬），佛蘭德目前應該擁有105萬美元左右的淨資產。但他實際上只有25萬美元的淨資產，只有平均的四分之一，非但不是百萬美金富翁，還屬於超遜理財族的一員，財富累積能力明顯有問題。他看似過得高消費、高享受的生活，但是在他同等收入水平的人群中，卻屬於「窮人」。\n\
    \n如果是在馬太福音的故事裡，他是被主人沒收財產並趕出去的那一個僕人，只能在黑暗裡咬牙切齒地哭泣。\n\n有時候，佛蘭德還真有這種咬牙切齒的感覺，「明明我是收入很高的，怎麼還會有入不敷出的感覺」！上一節說到有些人明明收入很高，卻老覺得自己窮，是因為匱乏感所導致，佛蘭德就不一樣了，他收入很高，是因為虛榮感而導致不良的消費習慣跟高額貸款，像打腫臉充胖子一樣，「補了面子，賠了裡子」。針對這種情形，北方有句可愛的俗語叫做「裝大瓣兒蒜」。\n\
