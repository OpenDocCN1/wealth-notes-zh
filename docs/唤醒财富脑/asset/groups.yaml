    # 升級心智系統


    從賈伯斯的故事中我們會發現，沒有保證一帆風順的事業，鍛煉自己擁有一顆「財富腦」，才擁有失敗又能東山再起的底氣。


    「頭腦」是創造財富的關鍵，是人類可以無中生有的利器，而「心智」是頭腦給人類最棒的禮物，讓我們來大概認識一下頭腦和心智吧。


    頭腦是人體中一個十分特別的器官，因為它包含多層次的功能，許多是無法被直接觀察和人為定論的，光是頭腦的認知功能，就需要一整門科學⁴去研究，依然還面對著大片的未知領域。


    若是肝或胃增生腫瘤，你可以看得見病變部位，並且動手術切除它。但若一個人有了憂鬱症或卡在某種僵化思維裡出不來，你卻不能切開他的腦袋說「把你的憂鬱症切掉」。


    頭腦（brain）作為一個生理器官，跟所有器官一樣是個可見的物理性存在，但它同時又具備許多不可見的特性，我們只好用其他詞彙去代表腦袋中「看不見的部分」，其中的說法有心智（mind）、意識


    > ④ 認知科學（英語：Cognitive Science），是一門研究訊息如何在大腦中形成以及轉錄過程的跨領域學科。它研究何為認知，認知有何用途以及它如何工作，研究信息如何表現為感覺、語言、注意、推理和情感。其研究領域包括心理學、哲學、人工智慧、神經科學、學習、語言學、人類學、社會學和教育學。來源：維基百科，2021
    年 7 月 30 日，https://zh.wikipedia.org/wiki/認知科學。'
