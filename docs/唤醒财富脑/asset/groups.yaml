    # 尋找長期價值的所在


    +   1、唯有擺脫握錢的短期價值思維，我們才能持續創造財富。\n2、短期價值體需要立即回饋：所有生物的動物性都需要立即回饋。（所以很多人會無意識選擇「掙錢」而不是「賺錢」）\n3、建立長期價值的過程，無法提供立即的滿足，需要明確的目標和內在強大的動力去堅持「沒有回報」的耕耘。\n4、從短期價值走到長期價值必須承受得了一般人所不能忍之苦。唯有能夠克服和駕馭動物性的人能夠取得大成就。'
