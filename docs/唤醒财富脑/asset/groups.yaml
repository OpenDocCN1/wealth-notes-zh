    \n知名理財書籍《下個富翁就是你》（The Millionaire Next Door）作者採訪了美國一千位資產超過百萬美金的富翁，發現 80% 的百萬富翁都是第一代，也就是不靠繼承家業，而是靠自己經營事業賺來財富的。作者進而總結出許多有錢人與一般人不同的理財和生活方式。\n\
    \n與這些百萬美金富翁接觸的過程中，作者發現能夠長期守著他們創造的財富的人，具備一種叫做「財富積累」（Wealth Accumulation）的特殊能力，同時作者介紹了一種能衡量「財富積累能力」的算法：\n\
