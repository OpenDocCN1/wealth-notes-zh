    \n這一系列的交換過程中，更懂得自己，進而找到一條最自在和喜悅的財富之道。\n\n## 本章小結\n\n## 什麼是資產、什麼是負債？\n\n- 1、窮人與有錢人的第二個區別：花錢的方式不同，富人買資產，窮人買負債。\n\
