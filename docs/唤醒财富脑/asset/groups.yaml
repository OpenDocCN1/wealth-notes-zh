    # 推薦語


    芳誼本身就是她所倡導的生命整合式價值觀的榜樣：如何活得美麗、健康、有靈性且又富裕！與她合作共事多年，我感到她的喜悅與智慧油然而生。她運用獨一無二的願景與思考，串連和療癒我們內在的矛盾與分裂。Rosie，為妳喝彩！


    詹姆斯·華納斯博士（James Wanless）

    國際企業顧問、開拓型導師

    「領航者塔羅：新時代導航地圖」系統創始人


    芳誼導師的財商課終於出書了，我一邊看一邊想，這不是我一直都在做的嗎？二十歲開始出來創業，我經歷過巨大的成功，也曾經慘淡失敗，但總是有一股力量推動著我繼續向前，獲得下一個良機。常常有人想跟我學商業，我也不知道怎麼把已經成為我直覺的東西分享給他們，通過本書系統化的梳理和清晰的案例，我一路創業的心法總算能成為方法論了。這本書為個人、創業者，和任何有志與金錢打好交道的人，指了一條明路。


    我從商業進入產業，開始深入到另一個層次，以生態系的角度運作團隊和項目，每天面臨系統結構中各方動能的變化、權衡與協商，漸漸進入到了純以頭腦之術無法駕馭的領域。本書中的「意識能量層級管理」，讓我能以道的視角、游刃有餘地繼續踐行我的人生圭臬：「高高山頂立，深深海底行」。


    于子淇

    浙江晨陽新材料有限公司執行總裁

    滑鐵盧大學大數據實驗室中國代表


    我與芳誼老師結識於英國，那時我剛打完一場雙 11 的勝仗（我的本行是電商大數據分析），在她的國際工作坊中，我感受到她結合東西文化的美好品質，形成一種特別滋養人的氣場，我內心暗想：「若有朝一日我要把十幾年的身心靈愛好轉為事業，我想找她做夥伴」。驀然回首，當時的「有朝」已成「今朝」，我們成為了閨蜜與戰友。芳誼老師的才華洋溢，讓我在設計教學上如虎添翼，同時又能持續得到全方位的支持，很感恩她出現在我的生命中，我的靈魂再也不孤獨了。


    COCO 院長（錢坤）

    數字心理學導師、成長美學家

    神秘學導師，精通塔羅、薩滿等身心靈成長工具


    後疫情時代，我們的財富、工作、生活、身心都面臨重大改變，世界財富也將重新分配，一切快速大洗牌。這本《喚醒財富腦》，來得正是時候。未來正在獎勵那些擁有不斷更新的學習腦、財富腦、身心靈腦的人。芳誼擁有圍繞在世界頂尖成功人士身邊的第一線體會，加上多年來在身心療癒、財富探索上獲得巨大的收穫，無私貢獻了如何喚醒財富腦，以及不被疫情洪流擊敗、不被自身認知邊界給限制住的秘訣。同是身為教育家、長年在知名企業擔任講師和顧問的我，看了這本書大受啟發。相信這本書絕對會幫助你，安然度過這個混亂不安的時代，且脫穎而出，成為真正的得勝者！


    許景泰

    網路連續創業家，500 大企業指定顧問

    大大學院創辦人，SmartM 世紀智庫創辦人


    我曾問學生為何想念金融系，學生回答：因為想賺很多錢！我笑了笑說：「不只你想，我也很想！」本書從身、心、靈這三個視角，全方位地喚醒我們的財富腦，也有許多鮮明的實證案例。我相信作者對於財務金融的思想貢獻是具有承先啟後、繼往開來的啟發性的。


    2012 年左右我就和作者成為朋友，一路上見證了她的成長與蛻變，從專業翻譯到心靈成長導師，從羞澀女孩到性感女人。她多變的風貌與多元的才識，著實為她的著作做了最好的詮釋。對於她一路上成長，我除了敬佩、欣賞與驚艷，更希望從她身上學到成功蛻變的秘訣。我在大學教授財務金融的知識，講的大多是別人的事蹟，而作者講的卻是她親身經歷的致富故事。讀完芳誼的書後，下次我會跟學生說：想致富，你要跟芳誼學習如何「喚醒你的財富腦」！


