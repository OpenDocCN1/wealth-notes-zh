    我們剛才已經向潛意識發出信號了，歡迎你繼續閱讀，開始搜尋那句足以改變你的一生，為你帶來巨大財富的一句話吧。


    ## 章節小結


    ## 你的人生與財富曲線


    +   1、現實中很少有直線增長，爆發前都需要積累。

    +   2、一邊確保安全一邊冒險，是辭職創業前的穩健做法。

    +   3、耐心等待生命中的拐點和里程碑的出現。


    ## 是什麼決定了富有或貧窮


    +   1、決定一個人貧富的關鍵是思維和行為。

    +   2、舊有思維會讓人始終被限制在固定的財富維度中。

    +   3、建立財富的能力與我們的腦袋、行為模式有關。

    +   4、我們所想要獲得的一切，都可以通過與我們的大腦攜手合作來達成。

    +   5、讓「財富腦」變強大，從建立正確的學習習慣開始。

    +   6、需要升級心智系統的關鍵提示：當你覺得不舒服的時候。


    ## 如何創造高效的學習


    +   1、效果最差的學習方式是「聆聽」，只能讓我們學習到 5% 的內容。

    +   2、第二層是「閱讀」，可以吸收到內容的 20%。

    +   3、第三層是「討論」，可以把吸收效果提高到 50%。

    +   4、第四層是「體驗」，可以把學習效果拉升到 75%，這也是線下課中一定要設計各種互動的原因。

    +   5、最高層級的學習方式是「分享與教學」，能將效果提升至 90%。當能夠教學的時候，代表已經從「接收者」進化到「給予者」。

    +   6、決定學習效果最關鍵的因素：學習者是被動的，還是主動的。


    ## 為你的財富閱讀之旅設下意圖


    我將在這本書中閱讀到一句話，只要我用心感受和挑選出這句話，並在我的生活中加以實踐，它將能夠為我的生命帶來更多財富與喜悅。


