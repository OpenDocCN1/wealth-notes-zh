    在我人生 32 歲時，我還是個負債百萬，碰到金融海嘯，人生不知何去何從的窮光蛋。但真的很神奇，透過學習提升自己的財商，並把財商跟房地產投資、房地產事業結合，不到
    3 年的時間，我就跳脫富爸爸說的老鼠賽跑的上班族生活，在外圈過著時間自由、財務自由的日子，至今已超過 10 年的時間。之所以能快速達到這樣的境界，我覺得房地產是個工具，但最關鍵的關鍵因子，還是一顆有錢人的腦袋，也就是芳誼在本書中所說的「財富腦」。芳誼是我們這群頻繁出國學習的同學中，受到世界級財商大師功力加持最深的，相信只要你好好閱讀這本書，你也可以打開你的財富腦，加速改變你的人生！


