    \ |\n|  |  |\n\n## 財富自由金字塔\n\n財富能買來最可貴的東西是什麼？可能每個人的回答不同，但有一個東西肯定是大部分人都很渴望通過財富實現的：自由。\n\
    \n+ 心靈自由\n金錢自由\n時間自由\n人身自由\n\n- 財富自由金字塔圖 -\n\n透過以上財富自由金字塔的圖表，我們來探討一下流傳已久的名句「不自由毋寧死」的意義。\n\
    \n首先是財富能夠為我們實現的第一層自由，叫做人身自由。\n\n你今天去了哪些地方呢？早上起來後，你是出門上班、見朋友、運動、吃飯、還是遛狗？我大部分的讀者，應該都享受著自由移動的權利，雖然此刻全球新冠疫情局限了我們出國的自由，但大多數人還是可以決定自己的行蹤的。你能想像對於某些人來說，逛公園、散步都是莫大的奢侈嗎？\n\
    \n我有一個老朋友，他的生命經歷讓我覺得比較婉惜。我在十七歲上富蘭克林時間管理法的課堂上結識了這位好友。他的父母從事餐飲行業，早出晚歸非常辛苦，於是他非常渴望致富，讓家人過上更好的生活。他很早就接觸安東尼羅賓的課程，到處尋找成功的方法，自己創業開公司，也有了不錯的成績。但是成功的路上一山還有一山高，他越走越急之後，加上一些心理症狀的催化，觸犯了法律而被判入獄。\n\
    \n服刑期間，我們透過書信交流，他在信裡告訴我說：「芳誼，你無法想像，你打開水龍頭就有水可以用，想要洗澡就可以去沖個澡；想跟朋友聊天只要拿出手手機撥個號碼就能聯絡，不用等紙本的信件，寄出去不知道什麼時候才能收到回信；想要運動，就可以出門去動一動。這些看起來簡單而且再平凡不過的事，對於一個失去自由的人而言，卻是無比渴望又遙不可及的。你不會知道有一群人正渴望著你現在覺得『理所當然』的生活小事。那一切……都是平凡又珍貴的。」\n\
    \n最近他假釋了，在獄中度過了四年三個月又十六天，當他清清楚楚地告訴我這個數字的時候，我只能想像，每一個失去自由的日子，都是他生命中一個不可抹滅和追回的印記。還好，他畢竟經過多年成長課程的洗滌，在長時間的自省之後，他把這段經歷解讀為一個人生必經的關卡，也收穫了其中的禮物。\n\
    \n下一層是時間自由，有一句話說：「我想去桂林，有時間的時候沒錢，有錢的時候沒時間。」財富能為我們買到想做什麼、就做什麼的自由，更重要的是能買到想不做什麼、就不做什麼的自由。\n\
    \n下一層是金錢自由，也就是我們不用再擔心金錢的來源，同時即便你停止工作，也能夠維持生活水準，更加簡單的定義是：你不需要為了金錢出賣自己的時間。\n\n「出賣」這兩個字很關鍵，它表示一種並非心甘情願的負向狀態，與自己選擇要「投入」時間和精力不同。\n\
    \n我認識的世界大師們，不管是財商領域的羅伯特清崎、安東尼羅賓，或是心理學、身心靈領域的老師們，大部分都是六十歲以上的智慧長者，甚至七十、八十歲的也大有人在。其實以他們的財力、資產來看，他們早已經達到金錢自由了，但他們還在勤奮工作，與全世界分享智慧，持續教學創造收入。但是如果有一天他們不想幹了，他們也絕對擁有停工和退休的自由。\n\
    \n所以對他們來講，繼續教學已經不是為了賺取收入，那並不是「出賣」時間，而是他們選擇去「投入」時間。\n\n這與外賣小哥接訂單的狀態不同，如果外賣小哥沒有建立財商，這個月生活的開銷帳單就必須靠接到的訂單來支付，他還是不得不出賣自己的時間。既然是「出賣」，其中就沒有太多的選擇，他們必須大冬天、大半夜、大雨天地在街道上等待手機的派單通知響起。\n\
    \n而我提到的老師們，他們可以選擇合作的對象、機構、地區，他們也可以選擇開課的季節、頻率、長度。當然，他們的知名度、影響力越高，選擇就越多。\n\n當你不需要為了支付生活開銷而出賣時間的時候，你就得到了選擇的自由，你可以選擇內心真正喜歡做的事情，你會發現除了金錢之外更有意義的事情。\n\
    \n金錢自由真正的目的是，讓我們的內心獲得更大的空間。\n\n不再需要為了五鬥米折腰，去做我不認可的事情，同時我也有空間去實踐、去實驗各種奇思妙想。例如我想去非洲學非洲舞、打非洲鼓，或者我想去西班牙學習花精療癒，認識植物的秘密生命，各種夢想都有空間去探索。\n\
    \n當我們實現了金錢自由之後，就有了可以追求心靈自由的基礎，那是最頂級的自由。\n\n那是一種內在無比自由、寬廣、圓滿、喜悅的狀態，心靈自由並不一定要大富大貴才能達成，但是滿足了基本物質生活，才有追求心靈自由的本錢。\n\
    \n自我實現 - - - - - 發揮潛能,實現理想\n尊重需求 - - - - - 受到尊重與肯定\n社會需求 - - - - - 愛情,友誼,歸屬感\n\
    安全需求 - - - - - 保護,秩序,穩定\n生理需求 - - - 呼吸,水,食物,睡眠\n- 馬斯洛需求金字塔 -\n\n美國心理學家亞伯拉罕・馬斯洛（Abraham\
    \ Maslow）的需求層次理論為許多心理學學者所引用，他認為首先一個人要滿足人類本性的基層需求，慢慢才能一步步向上達成更高層次的自我實現。\n\n根據馬斯洛需求理論，金字塔由下往上依序是生理需求、安全需求、社會需求、尊重需求、跟自我實現需求。\n\
    \n過往對人性的基本假設是，人需要先滿足底層的生理需求，才能一層層往上走，但是在不同文化或性格的影響下也有例外，例如印度的人\n\n們普遍推崇靈性追求，即使在貧民窟中都可以看到人們跪拜祈禱。\n\
    \n事實上，內在境界的提升是可以與追求金錢同時進行的，有了心靈自由的人，往往更有吸引財富的能力。\n\n而什麼是心靈自由呢？\n許多人在心靈課堂中體驗到了心靈自由的滋味。\n\
    那是敞開自己的心，並連接內在的真實，活出與生俱來的生命力量。\n\n這也是如夢初醒學院一直以來的願景：喚醒人們最美的初心，重逢真實的自己。把你內在的宇宙喚醒，把你內在的天賦潛能喚醒，把你都不認識的自己喚醒。\n\
    \n為什麼說喚醒呢？因為真正的自我，並不只是我們表面所認識的自己。\n\n我們會是今天的樣子，其實與許多從小到大接受的催眠有關，就是那些說「你應該要怎樣怎樣」「男孩應該怎樣怎樣」「女孩應該怎樣怎樣」的聲音。這些來自外界的聲音像是催眠一樣，一遍一遍地洗刷我們的腦袋，形成我們的價值觀，讓我們認為什麼是對的、什麼是錯的，我們應該選怎樣的職業、應該找怎樣的人結婚，於是我們會為了活出「別人想要的樣子」而遺忘了真正的自己。\n\
    \n通過導師與課堂中的引導，你品味到自己更深的內在世界時，你會在新的自我中體會到那一份自由，那是連接回更完整的自己的奇妙感受。\n\n有意思的是，在人生當中，除了得道開悟的高人，幾乎少有人能夠百分之百地同時享受到自由金字塔上的所有自由。行動、時間、金錢、心靈，似乎總有一兩項受限，追求金錢的過程，正是我們不斷努力去追求更大自由的過程。\n\
    \n喚醒財富腦，喚醒我們在重重制約與教條底下的財富潛能，每個人都值得活出更自由、更豐盛的生活。\n\n## 學習向宇宙下訂單\n\n你小時候有沒有慶祝過耶誕節？你有沒有提前跟聖誕老公公許願，祈求屬於你的禮物呢？如果我們想像宇宙也像聖誕老公公，怎麼許願比較容易成真呢？\n\
    \n首先我們要敢於許願，宇宙中的豐盛資源無窮無盡，同時會把愛跟金錢給到開口跟他要的人，因為宇宙的法則就是流動，宇宙也想讓能量流給你。\n\n我即將要與你介紹的是財富金字塔財富顯化理論，這個理論來自於許多與我共同工作的身心靈導師以及我自己的切身觀察和體驗，可以幫助大家換一種角度，再一次理解這整本書的精髓。\n\
    \n財富金字塔共有五層，當你掌握了財富金字塔之後，你就掌握了宇宙當中顯化財富跟創造財富的奧秘。\n\n+ 財富\n行動\n思維\n能量\n靈魂(宇宙銀行)\n\
    \n# - 財富顯化金字塔 -\n\n底下最寬厚的一層是「靈魂層」，你也可以理解為宇宙銀行，那是我們與宇宙所有一切源頭相連的地方。\n\n往上走是「能量層」，就是我們的意識能量層級狀態，也關乎於你的脈輪系統¹，決定了你是否是一個敞開的財富容器。\n\
    \n①脈輪（Chakra），梵語字根源自「圓」、「輪子」，在印度瑜伽的觀念中是指分布於人體各部位的能量中樞，尤其是指身體中軸上從尾骨到頭頂的能量中心，掌管人的身心運作，對情感、精神、關係都有重要影響，是許多現代療癒法的基礎與工具。\n\
    \n再往上走是「思維層」，這也是我們的腦袋所在，包含認知、思想與信念。思想跟能量會相互影響與帶動，但並不等同。\n\n接著往上走是「行動層」，行動層就是知行合一，做你所愛，做你所長，做有意義的事情，去採取行動而不只是癡人說夢。\n\
    \n底下每一層的積澱與發揮，一路向上，頻率越來越接近物質，最後你就會創造出所要的財富與物質結果。\n\n## 有錢人掌握的顯化秘訣\n\n物質層\n\n行動層\
    \ - - - - - 收入以及支出方式的不同\n\n思維層 - - - - - 思維方式的不同\n\n能量層 - - - - - 能量意識層級的不同\n\n\
    靈魂層\n\n- 財富金字塔結合有錢人的區別 -\n\n我們將本書所談及的有錢人與窮人的區別做個復習。\n\n第三、四章談及有錢人與窮人的兩大區別：收入以及支出方式的不同，這兩者都是屬於「行動層」的差異。我們需要學習通過正確的行動來增加不同的收入管道，例如放大單位時間價值，設法增加「被動收入」。例如本業是講師或作家的人，可以多寫書賺版權費、錄製線上課程等。同時有錢人在支出時，懂得花錢建立資產，而書中列舉了五種不同類型的資產，都需要實踐與積累。所以有錢人與窮人建立收入跟支出方式的不同是在每一個行動裡發生，也跟專業經驗的積累有關，這屬於「行動層」。\n\
    \n有錢人與普通人的第三個區別是思維方式的不同，很明顯就是屬於\n\n「思維層」，也就是我們的腦袋是怎麼想的。這個想法讓我更靠近金錢還是更遠離金錢？通過「財富阻礙測驗」我們挖掘出自己潛意識中面對金錢的真實態度，清晰地看見清高感、虛榮感、逃避感、辛苦感、匱乏感、不配感是如何消耗我們本來可以拿去吸引金錢的能量。\n\
    \n有錢人與普通人的第四個區別是能量意識層級的不同，屬於「能量層」，它決定了我們是否能更輕鬆吸引到金錢，是否能在生命中有更多的貴人與運氣。以上五大區別，分別屬於財富金字塔中間的三個層級，而關於有錢人如何面對未來與拓展財富，則是在金字塔外推動整個金字塔持續流動的力量。\n\
    \n還有一個最後的秘密，藏在財富金字塔的最底層：「靈魂層」。\n\n這是顯化任何財富的基礎，它雖無形卻有著非常大的影響力，它代表宇宙銀行的隱形帳本，記錄著我們這一生的付出與獲得，若你相信輪回的話，還包含了累生累世的紀錄。這裡的討論無關乎任何宗教信仰，若是堅信科學唯物主義的讀者朋友可以跳過這一段，若是覺得無形當中的確有一些神奇力量的朋友可以繼續閱讀。\n\
    \n「靈魂層」中記錄著，在此生或生生世世中，我們是付出多還是索取多？如果你一直都是付出，例如我一直都在朋友圈分享好的資訊、好的機會、正能量的話語，同時我也在能力範圍內樂意助人，那麼當我需要幫助的時候，別人是不是也會願意給予我？當別人有需要幫助的時候，我一直都在幫助他們，當有一天我需要幫助的時候，他們也會來幫助我，這就是宇宙的能量回流。所以「靈魂層」也可以解讀為你的資糧，就是你在宇宙中所積累的善意，這個善意可能是透過分享好的產品、好的話語，一個微笑或是一聲充滿能量的早上好。\n\
    \n在你所在的每一個地方和當下去積累善意，你就在為自己的宇宙財富庫積累正向資糧，當有一天積累突破拐點的時候，你的生活與財富就會突然升級，那都是你一步步累積而來的。\n\
    \n某個公司總裁的司機非常專業盡責，雖然只是開車，卻隨時把車子整理的一絲不苟、每天穿得西裝筆挺，還會為老闆紀錄洽商路線和適合招待請客的飯店、提醒老闆該排時間去參加女兒運動會等等。他不但做到了司機應該做的事情，還做到了更多總裁祕書該做的事情，他只是說：「老闆發我薪水，我在能力範圍內為老闆多做一些也是應該的」。\n\
    \n這種「但行好事，莫問前程」的精神，在浮躁的現代社會實在太少見了，於是不出一年，這位司機就感動了老闆、受到拔擢，從外場進入到內場。老闆指派人事經理親自培養他；最後還進入了管理層，成為老闆特別信任的左右手。\n\
    \n聽起來很像「瑪麗蘇（幸運女主角）」的故事情節嗎？\n\n但一個人能夠突破自己的命運，就是從把自己當下的事情做到百分之百、尊重並看重自己所做的每一件事開始的。\n\
    \n如果這個司機一天到晚都用負能量開車，覺得自己懷才不遇、明明身懷絕技卻龍困淺灘，遇到紅燈就唉聲嘆氣、咒罵超車，穿著隨便、頂著鳥窩頭，讓老闆接送貴賓都臉上無光，老闆不可能會想拔擢他吧。\n\
    \n但如果他用很高頻的狀態（如喜悅、寬容）去開好車，並隨時動腦筋想如何在崗位職責之外，做到更多事情，老闆很可能會覺得這司機真是人才，如果我教導他一些知識、方法，他肯定會成為可造之材。\n\
    \n我們給出去的能量都會加倍回到我們身上，這是靈魂層的一個奧秘，也是「想怎麼收穫，先那麼栽」古諺中的智慧。\n\n## 我的保時捷怎麼還沒來？找出你的財富卡點\n\
    \n很多人想要創造外在財富，但不知道用什麼路徑去實現，其實只要釐清財富金字塔每一層的運作，顯化之路就會在眼前展開。\n\n有人說我想要一台名車、一棟豪宅，這些都需要經過「財富金字塔」\n\
    \n的五個層次才能夠顯化，真正成為物質界的實相。\n\n想像一下，具有無窮可能性的宇宙裡，有我們想要的一切。\n\n假設我們想要一台紅色的 Ferrari\
    \ 跑車，首先我們要檢視自己的「靈魂層」，過往是不是對身旁所有人都是付出夠多的，是積累了足夠資源的。靈魂層擁有足夠多的資糧與善緣的話，無形的能量世界支持你的渴望，顯化過程就進入到「能量層」。\n\
    \n能量層看的是：我是否在一個富足的高頻狀態，能夠成為財富的承接者？假設我的資糧夠多，但是能量層級不夠，我經常落入低頻的狀態（如憤怒、抑鬱、羞恥等），那麼我的顯化也是困難重重的。讓能量保持在高頻狀態，才能推進顯化流程進入思維層。\n\
    \n我們想像這台跑車的能量，從靈魂層通過能量層，進入了「思維層」，思維就是關於你的信念，你相不相信自己有能力且值得獲得這台跑車呢？如果你並不相信它可以發生，假設你的信念是只有明星、名流才可以擁有跑車，市井小民不可能有一輛跑車，那麼這台跑車就會卡在你的思維層。\n\
    \n如果說思維層也通過了，你的頭腦和想法沒有阻礙你，那麼這台跑車就會進入到行動層，就是我怎麼去賺到買這台跑車的錢？我會不會遇上好的購車機緣？若有這筆支出預算，我如何讓這台車是資產，而不是負債？你就會想方設法地搜集資訊、學習精進、採取行動，最後你就會顯化出你想要的。\n\
    \n所以當你發現自己想要的財富沒有立刻發生，你可以透過財富金字塔去反思，我是卡在財富顯化過程的哪一層？是思維出了問題？能量層級不夠高？還是行動不夠？或者是靈魂層的積累不夠？\n\
    \n財富金字塔的最終奧秘在於積累靈魂層的資糧，秘訣就是做一個財神。\n\n你有看過財神的畫像或海報嗎？財神的表情與動作是在索取還是付出呢？人人在跟財神索取：「財神～我想發財，我想擁有一個億～」，\n\
    \n而財神笑呵呵地捧著金元寶給所有人。\n\n當我們進入樂於給予的狀態時，我們就像快樂的財神爺，因為我擁有了很多，所以我願意分享給你，這樣我們就是在財神的狀態，也是與金錢財富同頻的狀態。\n\
    \n進入財神爺的狀態，也是滋養靈魂層的秘訣，我自己就有切身體會。我的外公生長於廣東省梅縣，在當年動盪的時候，他一個人拿著全家族贊的錢坐船來台灣找工作，後來進了銀行工作有了基本的生活保障。但他一直心心念念遠在故里的家人，因為他所有的兄弟姐妹都還在大陸內地，他是唯一踏上寶島的大哥。\n\
    \n早期台灣的經濟發展比較快速，所以他飄洋過海來掙錢，但是他沒有忘記家鄉的親人，後來開放探親之後，他一年回廣東三四趟，資助老家的兄弟姐妹買房、買車，同時也資助當地造橋鋪路，他回到家鄉後成為一個財神爺。\n\
    \n外公回饋鄉里的事蹟得到很多家鄉人的感謝，後來我們回老家的時候，都可以感受到各種善意和感激之情，我回去的時候也受到特別好的照顧，家族裡的人對我都特別關照。\n\
    \n有時候我會想，我早期遊歷世界各地教學、旅行，最後遇見志同道合的合夥人而選擇落腳在大陸深耕教育，發展一份我熱愛也擅長的事業，短時間內就得到特別多的夥伴支持與學員肯定，或許是外公早年在這片土地為我種下了無形的資糧吧。\n\
    \n我們還可以做什麼積累靈魂層的資糧呢？傳遞善意、捐款、做好事、分享正能量，這些善行都可以積累宇宙資源去推動和幫助你顯化。\n\n## 真正的財富自由從內心有愛開始\n\
    \n真正的財富自由就是你可以做自己相信、喜歡且擅長的事情。不管這件事情賺不賺錢，能賺多少錢，你都樂在其中的話，恭喜你，你已活出了物質層次的財富自由！\n\n\
    當你已經開始享受當下的自由與富足，你就擁有本錢去創造更多。\n\n而當你不僅僅為了自己、為了家人而賺錢，你開始邀請更多人的生命加入到你創造財富的過程中，你創造的價值使人們的世界更美好，恭喜你，你已活出了精神層次的財富自由！\n\
    \n外在富足與內在富足息息相關，沒有人希望自己窮得只剩下錢。同時擁有物質與精神層次的財富才是真正的圓滿。\n\n就像文學家巴爾札克的作品《歐也尼葛朗台》中，主角是一個吝嗇鬼，平時待人極度苛刻，就連對家人也捨不得多花一些錢，導致女兒最後錯失了真正愛的人，妻子也一病不起。即使他家裡有著堆積如山的金錢，也沒發揮真正的價值，這肯定不是我們想要的。\n\
    \n## 足以改變你一生財富命運的一句話\n\n本書的旅程來到了尾聲，當闔上書頁的那一刻，你將重新回到自己的人生軌道。如果和我一樣，感到有些依依不捨，代表著我們一同經歷的這趟旅程高潮迭起、不虛此行。\n\
    \n然而，當書本的旅程結束時，才正是你更新、升級版人生的旅程開始之時。喚醒財富腦之後，你將如何改變你的每一天？\n\n王溢嘉在《活用禪》裡說：「人生的多采多姿是無法『畢其功於一役』的，光靠一次『頓悟』就想『上天堂』未免太過奢望，在漫長的生命旅程中，一個人可能需要好幾次的『大悟』和『小悟』。而在『悟』和『悟』間，還需要日積月累、身體力行的『漸修』功夫。」\n\
    \n無論是教育理論或心理學都告訴我們，行為的改變、創造力的產生都需要日積月累，沒有哪一場演講或哪一本書可以瞬間改變一個人的命運，關於金錢的修煉與實踐，更是如此。\n\
    \n還記得我們在這段旅程啟程時，一起設立的意圖嗎？\n\n> 「你將閱讀到一句話，那句話將改變你的一生的財富命運」。 \n\n也許這句話你曾經聽過，但這一次特別不同，也許是這句話的呈現\n"
  mdcn: "\n## 致富的目的與意義\n\n我們想要提升財商、創造更多的財富，大部分的人肯定不只是為了積累銀行帳戶裡一個更漂亮的數字，而是為了財富能夠帶給我們的其他事物與體驗。當我們更清晰想要通過財富獲得什麼，就會得到更長遠的財務動力。\n\
    \n你希望財富能夠為你實現什麼樣的生活呢？\n\n當有一天完全不需要擔心金錢，源源不絕的金錢就出現在你的生命之中時，你會想要去做些什麼？財富能夠為你創造什麼？\n\
    \n也許有人想要環遊世界（在此祈願疫情快快緩解）；有人想要有更多的閒情逸致；有人想要學畫畫，去做一些無用的藝術創作；有人想要好好陪伴家人、孩子；有人想投入公益活動，去做一些當下沒有立即的經濟效益，但是能夠撫慰人心的事。\n\
    \n生命的意義、蓬勃和精彩雖然並不是金錢本身能帶來的，卻是通過金錢得以實現的，這也是NLP之母朱迪芙老師為我寫下的推薦序裡所說的，金錢的目的 是讓我們去實踐更多的生命價值。\n\
    \n當我們想要賺錢，背後卻沒有足夠多的動力（motivation），我們就會覺得有或沒有都沒有差，遇到挫折就會呈現比較消極的狀態。當一個人內在消極的時候，旁人再怎麼鞭策他也沒有用。\n\
    \n現在請跟著下面這個練習，列舉出十條以上的財富願景：當你財富自由的時候會想去做什麼？當你完全不需要為了金錢煩惱的時候，你會想如何體驗人生？除了自己此生想要獲得的體驗外，你還能為世界帶來什麼呢？\n\
    \n從這兩個角度去思考，你將能夠感受到財富帶給你微觀與宏觀的雙重意義。\n\n| 當你財富自由的時候⋯⋯ |\n|---|\n| 你想要為「自己」做些什麼？\
    \ | 你想要為這個「世界」做些什麼？ |\n| 例：我想造訪世界上所有的古文明遺跡，包含埃及、瑪雅、馬丘比丘等⋯⋯ | 例：我想在世界各地建立流浪動物之家，讓許多無家可歸的動物能有安棲之所⋯⋯\
    \ |\n|  |  |\n\n## 財富自由金字塔\n\n財富能買來最可貴的東西是什麼？可能每個人的回答不同，但有一個東西肯定是大部分人都很渴望通過財富實現的：自由。\n\
    \n+ 心靈自由\n金錢自由\n時間自由\n人身自由\n\n- 財富自由金字塔圖 -\n\n透過以上財富自由金字塔的圖表，我們來探討一下流傳已久的名句「不自由毋寧死」的意義。\n\
    \n首先是財富能夠為我們實現的第一層自由，叫做人身自由。\n\n你今天去了哪些地方呢？早上起來後，你是出門上班、見朋友、運動、吃飯、還是遛狗？我大部分的讀者，應該都享受著自由移動的權利，雖然此刻全球新冠疫情局限了我們出國的自由，但大多數人還是可以決定自己的行蹤的。你能想像對於某些人來說，逛公園、散步都是莫大的奢侈嗎？\n\
    \n我有一個老朋友，他的生命經歷讓我覺得比較婉惜。我在十七歲上富蘭克林時間管理法的課堂上結識了這位好友。他的父母從事餐飲行業，早出晚歸非常辛苦，於是他非常渴望致富，讓家人過上更好的生活。他很早就接觸安東尼羅賓的課程，到處尋找成功的方法，自己創業開公司，也有了不錯的成績。但是成功的路上一山還有一山高，他越走越急之後，加上一些心理症狀的催化，觸犯了法律而被判入獄。\n\
    \n服刑期間，我們透過書信交流，他在信裡告訴我說：「芳誼，你無法想像，你打開水龍頭就有水可以用，想要洗澡就可以去沖個澡；想跟朋友聊天只要拿出手手機撥個號碼就能聯絡，不用等紙本的信件，寄出去不知道什麼時候才能收到回信；想要運動，就可以出門去動一動。這些看起來簡單而且再平凡不過的事，對於一個失去自由的人而言，卻是無比渴望又遙不可及的。你不會知道有一群人正渴望著你現在覺得『理所當然』的生活小事。那一切……都是平凡又珍貴的。」\n\
    \n最近他假釋了，在獄中度過了四年三個月又十六天，當他清清楚楚地告訴我這個數字的時候，我只能想像，每一個失去自由的日子，都是他生命中一個不可抹滅和追回的印記。還好，他畢竟經過多年成長課程的洗滌，在長時間的自省之後，他把這段經歷解讀為一個人生必經的關卡，也收穫了其中的禮物。\n\
    \n下一層是時間自由，有一句話說：「我想去桂林，有時間的時候沒錢，有錢的時候沒時間。」財富能為我們買到想做什麼、就做什麼的自由，更重要的是能買到想不做什麼、就不做什麼的自由。\n\
    \n下一層是金錢自由，也就是我們不用再擔心金錢的來源，同時即便你停止工作，也能夠維持生活水準，更加簡單的定義是：你不需要為了金錢出賣自己的時間。\n\n「出賣」這兩個字很關鍵，它表示一種並非心甘情願的負向狀態，與自己選擇要「投入」時間和精力不同。\n\
    \n我認識的世界大師們，不管是財商領域的羅伯特清崎、安東尼羅賓，或是心理學、身心靈領域的老師們，大部分都是六十歲以上的智慧長者，甚至七十、八十歲的也大有人在。其實以他們的財力、資產來看，他們早已經達到金錢自由了，但他們還在勤奮工作，與全世界分享智慧，持續教學創造收入。但是如果有一天他們不想幹了，他們也絕對擁有停工和退休的自由。\n\
    \n所以對他們來講，繼續教學已經不是為了賺取收入，那並不是「出賣」時間，而是他們選擇去「投入」時間。\n\n這與外賣小哥接訂單的狀態不同，如果外賣小哥沒有建立財商，這個月生活的開銷帳單就必須靠接到的訂單來支付，他還是不得不出賣自己的時間。既然是「出賣」，其中就沒有太多的選擇，他們必須大冬天、大半夜、大雨天地在街道上等待手機的派單通知響起。\n\
    \n而我提到的老師們，他們可以選擇合作的對象、機構、地區，他們也可以選擇開課的季節、頻率、長度。當然，他們的知名度、影響力越高，選擇就越多。\n\n當你不需要為了支付生活開銷而出賣時間的時候，你就得到了選擇的自由，你可以選擇內心真正喜歡做的事情，你會發現除了金錢之外更有意義的事情。\n\
    \n金錢自由真正的目的是，讓我們的內心獲得更大的空間。\n\n不再需要為了五鬥米折腰，去做我不認可的事情，同時我也有空間去實踐、去實驗各種奇思妙想。例如我想去非洲學非洲舞、打非洲鼓，或者我想去西班牙學習花精療癒，認識植物的秘密生命，各種夢想都有空間去探索。\n\
    \n當我們實現了金錢自由之後，就有了可以追求心靈自由的基礎，那是最頂級的自由。\n\n那是一種內在無比自由、寬廣、圓滿、喜悅的狀態，心靈自由並不一定要大富大貴才能達成，但是滿足了基本物質生活，才有追求心靈自由的本錢。\n\
    \n自我實現 - - - - - 發揮潛能,實現理想\n尊重需求 - - - - - 受到尊重與肯定\n社會需求 - - - - - 愛情,友誼,歸屬感\n\
    安全需求 - - - - - 保護,秩序,穩定\n生理需求 - - - 呼吸,水,食物,睡眠\n- 馬斯洛需求金字塔 -\n\n美國心理學家亞伯拉罕・馬斯洛（Abraham\
    \ Maslow）的需求層次理論為許多心理學學者所引用，他認為首先一個人要滿足人類本性的基層需求，慢慢才能一步步向上達成更高層次的自我實現。\n\n根據馬斯洛需求理論，金字塔由下往上依序是生理需求、安全需求、社會需求、尊重需求、跟自我實現需求。\n\
    \n過往對人性的基本假設是，人需要先滿足底層的生理需求，才能一層層往上走，但是在不同文化或性格的影響下也有例外，例如印度的人\n\n們普遍推崇靈性追求，即使在貧民窟中都可以看到人們跪拜祈禱。\n\
    \n事實上，內在境界的提升是可以與追求金錢同時進行的，有了心靈自由的人，往往更有吸引財富的能力。\n\n而什麼是心靈自由呢？\n許多人在心靈課堂中體驗到了心靈自由的滋味。\n\
    那是敞開自己的心，並連接內在的真實，活出與生俱來的生命力量。\n\n這也是如夢初醒學院一直以來的願景：喚醒人們最美的初心，重逢真實的自己。把你內在的宇宙喚醒，把你內在的天賦潛能喚醒，把你都不認識的自己喚醒。\n\
    \n為什麼說喚醒呢？因為真正的自我，並不只是我們表面所認識的自己。\n\n我們會是今天的樣子，其實與許多從小到大接受的催眠有關，就是那些說「你應該要怎樣怎樣」「男孩應該怎樣怎樣」「女孩應該怎樣怎樣」的聲音。這些來自外界的聲音像是催眠一樣，一遍一遍地洗刷我們的腦袋，形成我們的價值觀，讓我們認為什麼是對的、什麼是錯的，我們應該選怎樣的職業、應該找怎樣的人結婚，於是我們會為了活出「別人想要的樣子」而遺忘了真正的自己。\n\
    \n通過導師與課堂中的引導，你品味到自己更深的內在世界時，你會在新的自我中體會到那一份自由，那是連接回更完整的自己的奇妙感受。\n\n有意思的是，在人生當中，除了得道開悟的高人，幾乎少有人能夠百分之百地同時享受到自由金字塔上的所有自由。行動、時間、金錢、心靈，似乎總有一兩項受限，追求金錢的過程，正是我們不斷努力去追求更大自由的過程。\n\
    \n喚醒財富腦，喚醒我們在重重制約與教條底下的財富潛能，每個人都值得活出更自由、更豐盛的生活。\n\n## 學習向宇宙下訂單\n\n你小時候有沒有慶祝過耶誕節？你有沒有提前跟聖誕老公公許願，祈求屬於你的禮物呢？如果我們想像宇宙也像聖誕老公公，怎麼許願比較容易成真呢？\n\
    \n首先我們要敢於許願，宇宙中的豐盛資源無窮無盡，同時會把愛跟金錢給到開口跟他要的人，因為宇宙的法則就是流動，宇宙也想讓能量流給你。\n\n我即將要與你介紹的是財富金字塔財富顯化理論，這個理論來自於許多與我共同工作的身心靈導師以及我自己的切身觀察和體驗，可以幫助大家換一種角度，再一次理解這整本書的精髓。\n\
    \n財富金字塔共有五層，當你掌握了財富金字塔之後，你就掌握了宇宙當中顯化財富跟創造財富的奧秘。\n\n+ 財富\n行動\n思維\n能量\n靈魂(宇宙銀行)\n\
    \n# - 財富顯化金字塔 -\n\n底下最寬厚的一層是「靈魂層」，你也可以理解為宇宙銀行，那是我們與宇宙所有一切源頭相連的地方。\n\n往上走是「能量層」，就是我們的意識能量層級狀態，也關乎於你的脈輪系統¹，決定了你是否是一個敞開的財富容器。\n\
    \n①脈輪（Chakra），梵語字根源自「圓」、「輪子」，在印度瑜伽的觀念中是指分布於人體各部位的能量中樞，尤其是指身體中軸上從尾骨到頭頂的能量中心，掌管人的身心運作，對情感、精神、關係都有重要影響，是許多現代療癒法的基礎與工具。\n\
    \n再往上走是「思維層」，這也是我們的腦袋所在，包含認知、思想與信念。思想跟能量會相互影響與帶動，但並不等同。\n\n接著往上走是「行動層」，行動層就是知行合一，做你所愛，做你所長，做有意義的事情，去採取行動而不只是癡人說夢。\n\
    \n底下每一層的積澱與發揮，一路向上，頻率越來越接近物質，最後你就會創造出所要的財富與物質結果。\n\n## 有錢人掌握的顯化秘訣\n\n物質層\n\n行動層\
    \ - - - - - 收入以及支出方式的不同\n\n思維層 - - - - - 思維方式的不同\n\n能量層 - - - - - 能量意識層級的不同\n\n\
    靈魂層\n\n- 財富金字塔結合有錢人的區別 -\n\n我們將本書所談及的有錢人與窮人的區別做個復習。\n\n第三、四章談及有錢人與窮人的兩大區別：收入以及支出方式的不同，這兩者都是屬於「行動層」的差異。我們需要學習通過正確的行動來增加不同的收入管道，例如放大單位時間價值，設法增加「被動收入」。例如本業是講師或作家的人，可以多寫書賺版權費、錄製線上課程等。同時有錢人在支出時，懂得花錢建立資產，而書中列舉了五種不同類型的資產，都需要實踐與積累。所以有錢人與窮人建立收入跟支出方式的不同是在每一個行動裡發生，也跟專業經驗的積累有關，這屬於「行動層」。\n\
    \n有錢人與普通人的第三個區別是思維方式的不同，很明顯就是屬於\n\n「思維層」，也就是我們的腦袋是怎麼想的。這個想法讓我更靠近金錢還是更遠離金錢？通過「財富阻礙測驗」我們挖掘出自己潛意識中面對金錢的真實態度，清晰地看見清高感、虛榮感、逃避感、辛苦感、匱乏感、不配感是如何消耗我們本來可以拿去吸引金錢的能量。\n\
    \n有錢人與普通人的第四個區別是能量意識層級的不同，屬於「能量層」，它決定了我們是否能更輕鬆吸引到金錢，是否能在生命中有更多的貴人與運氣。以上五大區別，分別屬於財富金字塔中間的三個層級，而關於有錢人如何面對未來與拓展財富，則是在金字塔外推動整個金字塔持續流動的力量。\n\
    \n還有一個最後的秘密，藏在財富金字塔的最底層：「靈魂層」。\n\n這是顯化任何財富的基礎，它雖無形卻有著非常大的影響力，它代表宇宙銀行的隱形帳本，記錄著我們這一生的付出與獲得，若你相信輪回的話，還包含了累生累世的紀錄。這裡的討論無關乎任何宗教信仰，若是堅信科學唯物主義的讀者朋友可以跳過這一段，若是覺得無形當中的確有一些神奇力量的朋友可以繼續閱讀。\n\
    \n「靈魂層」中記錄著，在此生或生生世世中，我們是付出多還是索取多？如果你一直都是付出，例如我一直都在朋友圈分享好的資訊、好的機會、正能量的話語，同時我也在能力範圍內樂意助人，那麼當我需要幫助的時候，別人是不是也會願意給予我？當別人有需要幫助的時候，我一直都在幫助他們，當有一天我需要幫助的時候，他們也會來幫助我，這就是宇宙的能量回流。所以「靈魂層」也可以解讀為你的資糧，就是你在宇宙中所積累的善意，這個善意可能是透過分享好的產品、好的話語，一個微笑或是一聲充滿能量的早上好。\n\
    \n在你所在的每一個地方和當下去積累善意，你就在為自己的宇宙財富庫積累正向資糧，當有一天積累突破拐點的時候，你的生活與財富就會突然升級，那都是你一步步累積而來的。\n\
    \n某個公司總裁的司機非常專業盡責，雖然只是開車，卻隨時把車子整理的一絲不苟、每天穿得西裝筆挺，還會為老闆紀錄洽商路線和適合招待請客的飯店、提醒老闆該排時間去參加女兒運動會等等。他不但做到了司機應該做的事情，還做到了更多總裁祕書該做的事情，他只是說：「老闆發我薪水，我在能力範圍內為老闆多做一些也是應該的」。\n\
    \n這種「但行好事，莫問前程」的精神，在浮躁的現代社會實在太少見了，於是不出一年，這位司機就感動了老闆、受到拔擢，從外場進入到內場。老闆指派人事經理親自培養他；最後還進入了管理層，成為老闆特別信任的左右手。\n\
    \n聽起來很像「瑪麗蘇（幸運女主角）」的故事情節嗎？\n\n但一個人能夠突破自己的命運，就是從把自己當下的事情做到百分之百、尊重並看重自己所做的每一件事開始的。\n\
    \n如果這個司機一天到晚都用負能量開車，覺得自己懷才不遇、明明身懷絕技卻龍困淺灘，遇到紅燈就唉聲嘆氣、咒罵超車，穿著隨便、頂著鳥窩頭，讓老闆接送貴賓都臉上無光，老闆不可能會想拔擢他吧。\n\
    \n但如果他用很高頻的狀態（如喜悅、寬容）去開好車，並隨時動腦筋想如何在崗位職責之外，做到更多事情，老闆很可能會覺得這司機真是人才，如果我教導他一些知識、方法，他肯定會成為可造之材。\n\
    \n我們給出去的能量都會加倍回到我們身上，這是靈魂層的一個奧秘，也是「想怎麼收穫，先那麼栽」古諺中的智慧。\n\n## 我的保時捷怎麼還沒來？找出你的財富卡點\n\
    \n很多人想要創造外在財富，但不知道用什麼路徑去實現，其實只要釐清財富金字塔每一層的運作，顯化之路就會在眼前展開。\n\n有人說我想要一台名車、一棟豪宅，這些都需要經過「財富金字塔」\n\
    \n的五個層次才能夠顯化，真正成為物質界的實相。\n\n想像一下，具有無窮可能性的宇宙裡，有我們想要的一切。\n\n假設我們想要一台紅色的 Ferrari\
    \ 跑車，首先我們要檢視自己的「靈魂層」，過往是不是對身旁所有人都是付出夠多的，是積累了足夠資源的。靈魂層擁有足夠多的資糧與善緣的話，無形的能量世界支持你的渴望，顯化過程就進入到「能量層」。\n\
    \n能量層看的是：我是否在一個富足的高頻狀態，能夠成為財富的承接者？假設我的資糧夠多，但是能量層級不夠，我經常落入低頻的狀態（如憤怒、抑鬱、羞恥等），那麼我的顯化也是困難重重的。讓能量保持在高頻狀態，才能推進顯化流程進入思維層。\n\
    \n我們想像這台跑車的能量，從靈魂層通過能量層，進入了「思維層」，思維就是關於你的信念，你相不相信自己有能力且值得獲得這台跑車呢？如果你並不相信它可以發生，假設你的信念是只有明星、名流才可以擁有跑車，市井小民不可能有一輛跑車，那麼這台跑車就會卡在你的思維層。\n\
    \n如果說思維層也通過了，你的頭腦和想法沒有阻礙你，那麼這台跑車就會進入到行動層，就是我怎麼去賺到買這台跑車的錢？我會不會遇上好的購車機緣？若有這筆支出預算，我如何讓這台車是資產，而不是負債？你就會想方設法地搜集資訊、學習精進、採取行動，最後你就會顯化出你想要的。\n\
    \n所以當你發現自己想要的財富沒有立刻發生，你可以透過財富金字塔去反思，我是卡在財富顯化過程的哪一層？是思維出了問題？能量層級不夠高？還是行動不夠？或者是靈魂層的積累不夠？\n\
    \n財富金字塔的最終奧秘在於積累靈魂層的資糧，秘訣就是做一個財神。\n\n你有看過財神的畫像或海報嗎？財神的表情與動作是在索取還是付出呢？人人在跟財神索取：「財神～我想發財，我想擁有一個億～」，\n\
    \n而財神笑呵呵地捧著金元寶給所有人。\n\n當我們進入樂於給予的狀態時，我們就像快樂的財神爺，因為我擁有了很多，所以我願意分享給你，這樣我們就是在財神的狀態，也是與金錢財富同頻的狀態。\n\
    \n進入財神爺的狀態，也是滋養靈魂層的秘訣，我自己就有切身體會。我的外公生長於廣東省梅縣，在當年動盪的時候，他一個人拿著全家族贊的錢坐船來台灣找工作，後來進了銀行工作有了基本的生活保障。但他一直心心念念遠在故里的家人，因為他所有的兄弟姐妹都還在大陸內地，他是唯一踏上寶島的大哥。\n\
    \n早期台灣的經濟發展比較快速，所以他飄洋過海來掙錢，但是他沒有忘記家鄉的親人，後來開放探親之後，他一年回廣東三四趟，資助老家的兄弟姐妹買房、買車，同時也資助當地造橋鋪路，他回到家鄉後成為一個財神爺。\n\
    \n外公回饋鄉里的事蹟得到很多家鄉人的感謝，後來我們回老家的時候，都可以感受到各種善意和感激之情，我回去的時候也受到特別好的照顧，家族裡的人對我都特別關照。\n\
    \n有時候我會想，我早期遊歷世界各地教學、旅行，最後遇見志同道合的合夥人而選擇落腳在大陸深耕教育，發展一份我熱愛也擅長的事業，短時間內就得到特別多的夥伴支持與學員肯定，或許是外公早年在這片土地為我種下了無形的資糧吧。\n\
    \n我們還可以做什麼積累靈魂層的資糧呢？傳遞善意、捐款、做好事、分享正能量，這些善行都可以積累宇宙資源去推動和幫助你顯化。\n\n## 真正的財富自由從內心有愛開始\n\
    \n真正的財富自由就是你可以做自己相信、喜歡且擅長的事情。不管這件事情賺不賺錢，能賺多少錢，你都樂在其中的話，恭喜你，你已活出了物質層次的財富自由！\n\n\
    當你已經開始享受當下的自由與富足，你就擁有本錢去創造更多。\n\n而當你不僅僅為了自己、為了家人而賺錢，你開始邀請更多人的生命加入到你創造財富的過程中，你創造的價值使人們的世界更美好，恭喜你，你已活出了精神層次的財富自由！\n\
    \n外在富足與內在富足息息相關，沒有人希望自己窮得只剩下錢。同時擁有物質與精神層次的財富才是真正的圓滿。\n\n就像文學家巴爾札克的作品《歐也尼葛朗台》中，主角是一個吝嗇鬼，平時待人極度苛刻，就連對家人也捨不得多花一些錢，導致女兒最後錯失了真正愛的人，妻子也一病不起。即使他家裡有著堆積如山的金錢，也沒發揮真正的價值，這肯定不是我們想要的。\n\
    \n## 足以改變你一生財富命運的一句話\n\n本書的旅程來到了尾聲，當闔上書頁的那一刻，你將重新回到自己的人生軌道。如果和我一樣，感到有些依依不捨，代表著我們一同經歷的這趟旅程高潮迭起、不虛此行。\n\
    \n然而，當書本的旅程結束時，才正是你更新、升級版人生的旅程開始之時。喚醒財富腦之後，你將如何改變你的每一天？\n\n王溢嘉在《活用禪》裡說：「人生的多采多姿是無法『畢其功於一役』的，光靠一次『頓悟』就想『上天堂』未免太過奢望，在漫長的生命旅程中，一個人可能需要好幾次的『大悟』和『小悟』。而在『悟』和『悟』間，還需要日積月累、身體力行的『漸修』功夫。」\n\
    \n無論是教育理論或心理學都告訴我們，行為的改變、創造力的產生都需要日積月累，沒有哪一場演講或哪一本書可以瞬間改變一個人的命運，關於金錢的修煉與實踐，更是如此。\n\
    \n還記得我們在這段旅程啟程時，一起設立的意圖嗎？\n\n> 「你將閱讀到一句話，那句話將改變你的一生的財富命運」。 \n\n也許這句話你曾經聽過，但這一次特別不同，也許是這句話的呈現\n"
