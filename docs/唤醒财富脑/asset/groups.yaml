    \ That is a poor man’s attitude. Ask HOW to afford it）」。 \n\n思維本身並沒有對錯，但是思維會決定命運，而我們閱讀、學習就是為了要改變命運。哈福艾克有句話說「你要堅持自己是對的，還是要變有錢？（You\
