    第四種資產是：智慧資產（智慧財產權，Intellectual Property Rights），主要包含專利、商標、著作權等，常見的應用有技術授權、品牌加盟、書籍出版等。


    智慧財產權，也是現代個人與企業被動收入的重要來源。例如很多人都有帶來的高收入。例如很多人都有蘋果（Apple Inc.）手機，它的連接線就是採用自家專利的
    Lightning（閃電）標準規格。光靠這項專利，蘋果公司每年都從周邊廠商獲得非常高的利潤，因此即便遭遇各方壓力⁶，他們都不願意捨棄 Lightning 這個專利金雞母。


    除了通過授權獲得的直接收入，品牌溢價也屬於廣義的智慧資產。例如很多人都喝過星巴克咖啡，甚至到一個新的國度都會以星巴克咖啡作為定位標誌，但他們的咖啡有比自烘焙的精品小店好喝嗎？口味偏好會因人而異，但相信大家都認同星巴克的咖啡普遍比較貴！這正是商標與品牌所能帶來的溢價效應。


    以上屬於企業的範例，個人是否也能建立智慧資產呢？世界級暢銷書《哈利波特》的故事就十分激勵人心，單親媽媽 JK 羅琳在一間咖啡館完成了這部風靡全球的作品，為她創造出上億資產。另外，你有沒有在網路上聽過課或買過課呢？網路課也是錄完之後，就可以無限次傳播，讓一個人聽、一百個人聽、一千個人聽的數位化智慧資產，這也可以為你創造更多元的財富渠道。


    我的父親曾是大學機械科系主任，三十多年前，台灣在該領域的教材還不齊全，他就利用一個寒暑假的時間，寫完一本機械科的系統教材，後來成為老師們愛不釋手的教科書，可以長期獲得被動收入。（他後來偷懶沒怎麼修訂了，要是定期更新的話，應該還可以更暢銷，這裡吐槽他一下，懶怠感肯定也是種財富阻礙。）


    ⑥ 2021 年歐盟立法機構以 582 票對 40 票通過決議，通過統一智能手機充電方案的法案，蘋果公司必須將手機充電接口改成 Type-C，否則需退出歐洲市場。資料來源：科技網站
    https://ezone.ulifestyle.com.hk/。'
