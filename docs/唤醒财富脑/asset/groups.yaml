    \ 1095 盒香菸，如果不抽菸，46 年下來將省下 33,190 美元，如果將抽菸的錢拿去投資菸草公司的股票並持有 46 年，將獲得價值高達 200 萬美元的股票，更別提還有無形的健康價值。\n\
    \n本章我們講述了正確評估財富的方式，先從宏觀的角度認知到自己的收入水平在全球經濟分布中的位置，接著進入微觀的角度看待自己個人的資產水平，如何呈現出自己過往的理財能力。\n\
    \n接下來的章節我們就正式進入到財富腦培養計畫，一步步建立有錢人的致富習慣，下一章我們要看的是「有錢人怎麼賺錢」。\n\n## 章節小結\n\n有錢等於擁有財富嗎？\n\
    \n+   1、 金錢並非是一個固定不動的東西，它的價值隨時隨地都在變化。\n   錢的本質就是貨幣，需要去流通，若錢沒有流動，價值就會越變越低。 \n2、\
    \ 現金不等於資產，貨幣只是資產的其中一種。\n\n你是窮人？還是有錢人？\n\n+   1、 世界觀下的貧富評判標準：大多數人都比自己想像中富有。 \n\
    2、 多數人要做到是一種平衡的心態，才有助於平穩的財富創造與輸出，這就要仰賴更正確的自我認知。\n\n如何打造吸金體質？\n\n+   1、 財商是剛需：衡量一個人財商高低的關鍵在於，他能夠在時間中把擁有的錢發揮出多高的效益。\
    \ \n2、 你應該擁有的淨資產＝你的稅前年收入 x 你的年紀 ÷ 10 \n3、 認清自己的理財水平，提升管理財富的能力，才能積累出匹配自己收入水平的淨資產。\n\
    \n## 第三章\n有錢人如何賺錢\n\nYour income can only grow to the extent that you do.\n\n\
    你個人的成長幅度決定你的收入成長幅度。\n\n《有錢人和你想的不一樣》作者哈福・艾克（T Harv Eker）\n\n## 調整收入方式，才是變富的開始\n\
    \n從本章開始到第八章，我們會一一探討有錢人與窮人的六大區別，再次強調，這種說法並不是以存款或資產來衡量任何人的高低優劣，而是以人們頭腦的運作方式加以區別，方便作主題的探討。所謂窮人指的是擁有「窮人思維」（貧窮腦）的人，有錢人指的是擁有「有錢人思維」（財富腦）的人，只要有心，人人都可以打造自己的財富腦。\n\
    \n接下來談及「有錢人」、「窮人」的相關論述，我們就不多作名詞解釋了，請朋友們毋須爭論「窮人這個詞太污辱人」這種概念性的問題囉！其實，為了與大局或重點無關的事情爭論不休，在唇槍舌戰中消耗精力，也是一種「導致人變窮的行為」。建立好默契，我們就可以把關注力都放在學習上。\n\
    \n當你認識到了貧窮腦與財富腦的核心區別，你就能學會怎麼思考、怎麼行動能讓你更有錢，也更清楚哪些行為會讓你沒錢，這樣你與財富就會越來越近。\n\n一個具備有錢人思維的人，即使手上現金不多，也能越來越有錢；而一個即便是繼承了龐大家產的人，如果腦袋裡裝的是窮人思維，家產也可能越來越少，甚至總有一日坐吃山空。\n\
    \n有錢人與窮人的第一條區別，在於他們賺錢的方式不同，也就是創造收入的方式不同：「窮人掙命掙錢，掙主動收入，有錢人懂得賺錢，賺被動收入。」\n\n貧窮腦成天忙著「掙錢」，而財富腦則成天規劃著怎麼「賺錢」，這兩者的區別究竟何在？在古人的造字中有答案。\n\
    \n古人的造字學很有趣，掙這個字有一個「手」的部首，代表用你的手去掙錢，掙到的就是所謂的血汗錢。窮人思維堅信用手掙錢是美德，揮汗如雨換來的米飯才特別香。有錢人思維則是喜歡研究怎麼賺錢，用各種方式放大錢的價值。\n\
    \n從古代人們就明白這兩者的差異，知武子曰：「君子勞心，小人勞力」。\n孟子曰：「勞心者治人，勞力者治於人。掙錢者勞力，賺錢者勞心。」\n貧窮腦為何喜歡掙錢，更勝過於賺錢呢？\n\
    簡而言之，因為掙錢的回報速度快，例如搬磚頭、送外賣、開計程車的金錢回報都特別即時。這裡並沒有貶低以上行業的意思，基礎行業著實讓我們的生活方便許多，重點在於每份工作的報酬性質不同。\n\
    \n而賺錢的回報就沒那麼快了，比較像是種植作物，農夫播種後不會馬上有收穫，需要耐得住寂寞，才能「守得雲開見月明」。\n掙錢帶來的是主動收入，相同的時間只能夠出售一次，而且價值低、缺乏成長性。掙錢意味著只能靠自己的雙手去換取收入，但一個人只有兩隻手，又不是八爪魚，掙錢的速度和效率都是有限的。\n\
    \n賺錢帶來的則是被動收入，「賺」字部首為「貝」，說的就是「用你擁有的寶貝去賺錢」，那寶貝的數量就是無上限的了。\n\n回到造字的智慧來看，「貝」這個部首的來源是海底的軟體動物，它們用貝殼保護自己身體，甲骨文的「貝」就是象形造字，取扇貝張開兩邊殼的樣子。\n\
    \n古代人看到貝殼覺得很美麗，於是製作成珍貴的飾品隨身攜帶，慢慢地發展成了用貝殼做為貨幣，也稱為「貝貨」¹。\n\n掙錢跟賺錢，一個是用手，一個是用寶貝。\n\
    \n產品是一種寶貝，可以反覆出售；錢也是一種寶貝，用錢去投資企業、貨品、金融工具賺錢；而人也可以是一種寶貝，搭建團隊，運用人才來賺錢又是另一種方式。\n\n\
    > ①古籍有記載貝殼轉為貨幣的起源，漢．桓寬《鹽鐵論．錯幣》：「夏後以玄貝，周人以紫石，後世或金錢刀布。」\n\n## 主動收入與被動收入\n\n當你了解掙錢與賺錢的不同，你就打開了被動收入的大門。\n\
    \n主動收入，就是親力親為所換來的收入，窮人花大部分的時間賺取主動收入，做一小時有一小時的收入，做兩小時有兩小時的收入，做五小時有五小時的收入。幹就有錢，沒幹就沒錢。\n\
    \n被動收入，則是不工作也能進帳的收入，例如房租就是很好理解的被動收入來源，有些包租婆一個月工作兩天，28 號抄水錶、30 號收房租，其他時間就是打麻將和上美容院。\n\
    \n主動收入帶來的是相對被動的人生。並不是說主動收入不好，能夠靠一己之體力、能力去換得金錢，是十分值得驕傲的事情，也能建立紮實的成就感。\n\n但是具備財富腦思維的人，會以主動收入作為基礎的生活保障，同時不斷思考賺取被動收入的方法，這就需要我們密切留意「時間貨幣」的運作。\n\
    \n## 時間即貨幣\n\n根據能量守恆定律²，固定系統中能量守恆，不能生成或摧毀，但可以改變形式。金錢是一種能量，是由其他能量轉換和交換來的，例如透過你的體力、智力、天賦形成產品或服務，進而交換成金錢。\n\
    \n獲取財富，其實就是將你擁有的資源（能量）轉換為金錢的過程。\n\n你的父母背景可能不如此爾蓋茲³，你的家族資產可能比不上馬雲\n\n> ②能量守恆定律（英語：Law\
    \ of Conservation of Energy）闡明，孤立系統的總能量保持不變。能量不能無故生成，也不能無故摧毀，但它能夠改變形式，例如，在炸彈爆炸的過程中，化學能可以轉化為動能。來源：維基百科，2021\
    \ 年 8 月 4 日。\n\n> ③比爾蓋茲的外祖父是顯赫的銀行家，媽媽也卓爾不群，在三十五歲就成為第一州際銀行董事。她一九九四年過世時，《紐約時報》刊登了瑪莉蓋茲夫人（Mary\
    \ Maxwell Gates）的簡短訃聞：「瑪莉蓋茲昨天因為乳癌過世，她是一位顯赫的西雅圖商場女將，協助了她的兒子比爾蓋茲得到 I B M 的合約，讓新創的微軟公司獲得利潤豐厚的關係。」蓋茲的商業帝國少不了家族資源的撐腰。\n\
    \n家族，你和他們唯一平等擁有的資源是：「時間」。你們一天都擁有二十四小時，無法預支，也無法挽回，每天均速地在你們的生命中流過。\n\n既然這個世界上最公平的資源就是時間，如何更好地運用時間，就成為所有成功人士繞不開的話題。\n\
    \n人類對於「時間」這個資源開始具備更高的掌控力，起源於 18 世紀 60 年代中期英國展開的第一次工業革命，開創了以機器代替人工的時代，大量時間從傳統農耕的生活\
    \ 中被釋放出來。\n\n接著 19 世紀 70 年代第二次工業革命開啟了「電氣時代」，發動機、電動機的相繼發明與電力、電燈的普及，讓人們的生產力延伸到太陽下山以後的時間。\n\
    \n進入 20 世紀 50 年代後，電子計算機的迅速發展與廣泛應用，締造了第三次工業革命的「科技時代」，信息控制技術推動了人類經濟、政治、文化等極大的社會變化。電腦進入工作場景，免除了人的許多重複性工作，再度為人釋放出大量的時間。\n\
    \n20 世紀後期，進入了第四次的科技革命，以系統生物技術、新能源發展為核心任務，而轉化醫學、遺傳學等系統生物工程的發展，讓某些研究人類老化與壽命的學者對未來人類可以越活越久充滿信心⁴。\n\
    \n總而言之，科技的發展讓我們比古人有了更多「可運用的時間」，就像理財裡有一個詞彙叫可支配收入（disposable income），雖然時間本身沒有增加，但可支配的時間增加了。\n\
    \n坊間關於時間管理的書籍已然汗牛充棟，在此我們就省去一些相關篇幅，有興趣研究如何提高時間產能的朋友，可以搜尋比爾蓋茲的「5 分鐘時間管理法」、伊隆馬斯克的「時間箱分配法（Time\
    \ Boxing）」或是許多精英人採用的「番茄鐘工作法（Pomodoro\n\n④哈佛盎學院遺傳學教授戴維·辛克萊爾（David Sinclair）寫了一本名為《壽命》（Lifespan）的書，他聲稱衰老是一種疾病，通過表觀遺傳學的重編程與調節，人們可以活得更長。\n\
    \nTechnique) ⁵。\n\n重點是根據你的工作型態與習慣（如創造型工作和固定型工作運用時間的方式就不同），親自驗證找到一款最適合你的方法，最大化你的時間產能。\n\
    \n現在我們用一種更宏觀的角度來看待時間，也就是把維度拉高來看，時間作為你的「生命資源」時，你會如何做出更有效、更具備長期思維的整體規劃呢？\n\n這就關聯到，你是否有意識到自己販售時間的方式，長此以往會帶來什麼影響？\n\
    \n## 販售時間的方式\n\n## 我們如何度過我們的一生\n\n![](img/c2747cd0c5bf820d125459594a169642_102_0.png)\n\
    \n- 一生中時間的分配 -\n\n研究顯示⁶，人~~在平均壽命下的一生，有 26 年花在睡覺，7 年花在嘗試睡著，光是睡眠就佔據了 33 年的時光，等於一個女嬰兒從誕生成長到適婚年齡⁷都在睡覺，簡直像是睡美人一樣，一覺起來就要結婚生娃了！\n\
    \n下一個最花時間的項目就是工作了，我們平均花費 13 年在工作上，以一般人工作時長 50 年來說，其實只有 24% 的時間是真正具備生產力的。接著在花時間排行榜上的還有看電視（8.3\
    \ 年）、吃飯（4.5 年）、假期（3.1 年）……\n\n從這張時間分配圖來說，若要提升「時間換金錢的轉化率」，除了睡好覺提升工作效率、減少無效娛樂外，最重要的還是你如何規劃自己工作的時間。\n\
    \n《晉書陶潛傳》：「吾不能為五斗米折腰，拳拳事鄉里小人邪。」能如陶淵明不為利祿所動者畢竟為少數，多數人在達到財富自由的狀態之前，都需要經歷販售時間的過程，但很少人會意識到不同的販售方式，所帶來的長期財富發展有何不同。\n\
    \n第一種販賣時間的方式是：同一時間段只能賣一次。\n\n最基礎的例子是，外賣小哥如果接了一個訂單，要把麥當勞送到杭州如夢初醒學院，同一個時間內就不能送小籠包到西湖茶樓對吧？因為他不會分身。\n\
    \n這段時間只能被賣一次，無法再作他用，同時價格相對較低，缺乏成長性，可替代性高。外賣小哥就算送十年外賣，訂單的酬勞也不會從幾塊錢變成幾百塊錢；他若做同樣的事情，收入還是一樣僅夠溫飽。\n\
    \n大部分人剛開始建立收入時，都會從第一種售賣時間的方式開始，\n\n⑥來源：英國睡眠研究網站，https://www.dreams.co.uk/sleep-matters-club/your-life-in-numbers-infographic/。\n\
    \n⑦內政部 2018 年最新數據指出，台灣女性平均初婚年齡為 30.2 歲，平均頭胎生育年齡 30.9 歲。\n"
  mdcn: "\n《聖經·馬太福音》二十五章有許多的詮釋，在財富領域給予我們的啟示是：\n\n上天賦予每個人的天賦與資質不同，但唯有積極運用自己手上的資源與資產，不斷充實自己，讓自己學會更多放大金錢價值的方法，才會有越來越多錢匯聚到我們身邊。\n\
    \n那麼，回過頭來看，我們現在是跟哪一個僕人更像呢？是已經展現了卓越的理財天賦，自動會吸引錢來找我們，還是一直在恐懼感中，只想找一個安全的地洞把錢藏起來呢？\n\
    \n以下有個簡單的公式，幫助我們衡量自己目前的財商數值。\n\n## 科學評估你的財商高低\n\n![](img/c2747cd0c5bf820d125459594a169642_90_0.png)\n\
    \n知名理財書籍《下個富翁就是你》（The Millionaire Next Door）作者採訪了美國一千位資產超過百萬美金的富翁，發現 80% 的百萬富翁都是第一代，也就是不靠繼承家業，而是靠自己經營事業賺來財富的。作者進而總結出許多有錢人與一般人不同的理財和生活方式。\n\
    \n與這些百萬美金富翁接觸的過程中，作者發現能夠長期守著他們創造的財富的人，具備一種叫做「財富積累」（Wealth Accumulation）的特殊能力，同時作者介紹了一種能衡量「財富積累能力」的算法：\n\
    \n「你應該擁有的淨資產＝你的稅前年收入 x 你的年紀 ÷ 10」\n\n你可以按照這個公式為自己、家人或未來的伴侶計算一下，看看依照這個年齡與收入，你們目前應該擁有的淨資產是多少，拿這個數字來跟目前擁有的資產相比較，就能判定你們財商的高低，也就是積累財富能力的高低。\n\
