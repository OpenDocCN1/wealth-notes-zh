    在追逐財富自由的路上，我們最害怕的是目標不清晰，當目標不清晰的時候，即便你達到了，你都不知道自己達到了，同時沒有目標的人，也很容易被人鼓吹和迷惑。


    ## 自由源於清楚自己想要什麼


    你每個月的多少被動收入，才能讓你實現不用工作，就能活出想要的生活？


    基礎生活支出、理想生活支出、優渥生活支出，反映的是生活消費方式。


    心理層面則區分為：需要、想要、別人想要這三種層級。


    ![](img/c2747cd0c5bf820d125459594a169642_116_0.png)


