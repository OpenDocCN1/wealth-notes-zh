    創造出斐然的成果，並陸續受邀為阿里巴巴集團等大型企業帶領組織發展活動。


    今年開始，我受邀到華語區最大的身心靈成長平台張德芬空間擔任特約導師，邁入了線上教育的領域。透過網路直播，我將所學分享給數十萬名觀眾，並在 12 個小時內創造了百萬收入。這才只是個開始，而我知道這樣迅速的財富顯化，是因為我確實執行了本書中所說的方法（特別是第六章談到的高頻能量管理法）。


