    \n有些人覺得很沒面子：「我混得太差了，居然要開口借錢，太丟臉了」。\n\n有些人覺得很難過、自責：「唉，我怎麼會淪落到這種境地？我太差勁了」。\n\n有些人覺得很害怕朋友的評判：「他們會怎麼想我呢？好害怕我們的友誼就此結束了，從此被拉黑名單」……\n\
    \n這些都是他們面對金錢的底層感受，幾乎每個人的潛意識裡都有關於於錢的負面情緒，特別是在負壓狀態下，更容易被勾動和放大。\n\n如果你在剛才的實驗中感受到能量沒有很流動，你被一些想法卡住了，你現在就更清晰地看見自己的卡點在哪了。自己為什麼需要借錢？跟誰開口比較不丟臉？用什麼理由才合理？對方會不會因此看扁自己？\n\
    \n事實上，不一定要面對借錢這種極端場景，這些底層感受就一直在影響著我們與金錢的關係，形成負向的財富阻礙，導致我們無法與金錢自在互動。\n\n這些阻礙歸根結底可以總結為關於金錢的上位感受與下位感受。\n\
    \n上位感受是：清高感、虛榮感、逃避感，這些感受讓我們覺得自己比金錢來得高，當發現自己也需要為五斗米而折腰時，可能因此激發出羞恥感：「我居然淪落至此，還要跟小學同學開口借錢」。\
    \ \n\n下位感受是：辛苦感、匱乏感、不配感，例如被經濟危機壓得喘不過氣，成天為錢發愁，或是擔心自己能力不足，害怕自己無法替別人提供價值藉以換取金錢等等。\n\
    \n當內在放下越來越多財富阻礙時，人面對金錢才會通透，減少不必要的能量消耗。該賺的錢就大方地賺，還沒大富大貴也不著急，願意腳踏實地耕耘，對自己與金錢的認知都沒有偏頗。所以你會看到有些人挺坦蕩的，他需要跟別人調頭寸（台語：借錢）的時候，也不會不好意思或感覺丟臉，反而認為運作企業，需要調用資金是很正常的。\n\
    \n這裡並不是鼓勵大家無故借貸，而是通過借錢這個比喻，把更深的關於金錢的感受挖出來。\n\n某位禪學老師曾說「金錢是一把殺豬刀」，意思類似於「照妖鏡」，表示金錢議題的鋒利，足以使許多人的真面目現形。當時有位弟子請教老師如何「過錢關」，他就建議學生去向身邊關係最親近的朋友借錢，而且一開口就借一百萬，看看對方如何反應。其實，拿金錢當殺豬刀、照妖鏡，不僅是照一照這些關係，更是照照自己，在開口之前，可能已經\n\
    \n被內在的自我批判給折磨死了。的自我批判給折磨死了。\n\n在本章中，我們要來更精細地探究財富腦與貧窮腦究竟有何不同，我們的思維是如何導致我們的富有和貧窮的？如何破除貧窮腦裡的重重金錢阻礙？\n\
    \n## 敢要錢才能賺錢\n\n貧窮腦中的很多思維是老舊的、傳統的、有定論的，而財富腦思維通常是反常理的、革新的、變化的。富爸爸系列書籍作者羅伯特清崎關於借錢就有比較強烈的立場，他認為聰明地借錢是好事。\n\
    \n清崎在 1973 年打完越戰後回到美國，成為全錄公司的業務員，薪水並不高，但他存了 2,000 美元頭期款後就馬上買下一間 18,000 美元的套房收租，扣除房貸支出後，每月淨收入只有\
    \ 35 美元。\n\n但是不要小覷 35 美元，這一筆小錢持續流入清崎的口袋，一年後，伴隨房產增值和現金收益，清崎又向銀行貸款買下第二間套房，就這樣以房養房，從套房買到公寓，從一間一間買到整批收購，建立了他的房產王國。\n\
    \n當然現在的房市、利率、市場環境都不同了，但在許多人都畏懼向銀行借款、害怕背債時，清崎就知道不用怕跟銀行借錢，只要他有一顆財富腦，他可以把借來的錢發揮更大效益，那筆借款就不是負債，而是資產。\n\
    \n敢要錢、敢借錢、敢投資，是因為確信自己的財富思維與判斷力，終能讓手上的錢生出更多的錢。\n\n## 如果你家旁邊住總統，你能發財嗎？\n\n財富腦思維將幫助你看見機會、把握機會，例如美國前總統奧巴馬鄰居的故事是個很好的例子。\n\
    \n奧巴馬上任總統前，住在芝加哥的一棟老房子裡，總統上任之後就帶妻子和兩個女兒住進了白宮。有記者訪問奧巴馬說，他的老房子怎麼處理？奧巴馬說：「我非常喜歡芝加哥的老房子，任期滿後，我還會帶\n\
    \n著家人回去住。\n\n奧巴馬的鄰居比爾聽到訪談後激動不已，他一直渴望一夜暴富，現在機會終於來了！他滿懷希望地把自己的房子標價 300 萬美元，放到市場上出售，他相信自己馬上要發財了。\n\
    \n奇怪的是，跟總統做鄰居的賣點並沒有讓房子高價售出，反而久久無人問津。比爾仔細看了售屋網站下的留言，原來大家擔心住在總統隔壁，出入都會受到嚴密監控，這樣的生活根本沒有隱私可言。\n\
    \n房子掛了很長的時間都賣不出去，比爾逐漸心灰意冷，後來一個叫丹尼爾的年輕人出價 140 萬美元，他就趕緊賣了脫手。比爾沒想到的是，他想要大撈一筆沒有成功，這棟房子到了丹尼爾手上卻成為比\
    \ 300 萬更值錢的「搖錢樹」。\n\n原來，丹尼爾花了一筆費用將房子改造成幼稚園，總統居住的街區受到美國特勤局的嚴密監控，這一點讓家長們都很放心，於是幼稚園一炮而紅，甚至被稱為「全美最安全的幼稚園」，吸引了眾多富豪把孩子送到這裡。同時丹尼爾把幼稚園的外牆空間也拍賣，吸引了無數廣告商進駐。\n\
    \n顯然，這個故事中的最大贏家是丹尼爾。\n\n同樣的房子與條件，以不同的思維方式對待，得到的效果天差地別。比爾抱持一夜暴富的短期價值思維，一受挫就灰心和想急著出手，丹尼爾卻能扭轉乾坤，把眼前的阻礙變成資源，這就是是否具備財富腦思維帶來的區別。\n\
    \n## 窮爸爸 VS. 富爸爸：你如何選擇？\n\n其實，每個人的內在都有窮爸爸和富爸爸的聲音，一個是恐懼和保守的聲音，一個是勇氣和創造的聲音。\n\n\
    羅伯特清崎說，《富爸爸窮爸爸》中的兩位爸爸靈感來自於他成長過程中的兩位長輩。他的親生父親是窮爸爸，是一位大學教授，總是告訴他在學校要好好學習，畢業後找一份好工作，娶妻生子，平穩地度過一生。\n\
    \n他的富爸爸卻告訴他，不要接受任何人替你安排的人生，好學歷也不保證有出息，你要積極突破自己既有的思維與舊有的認知，進而突破自己的財富維度和命運。\n\n\
    窮人跟有錢人還有一個很大的區別是：窮人消極，有錢人積極。\n\n面對時局變化，窮人滿眼看到的都是問題，而有錢人會說全世界的人都面臨這些問題，我能夠有什麼不同的做法，將危機化為轉機？\n\
    \n覺察你的思維模式，是富爸爸的財富腦思維，還是窮爸爸的貧窮腦思維？當你面對新的專物、機會、觀念，可能性，你第一個反應是「可以，有什麼方法做到」，還是「不行，因為有很多阻礙」？\n\
    \n「窮人找藉口，有錢人找方法。」\n\n窮爸爸的話都是以句號結尾的，沒有延伸的餘地，而富爸爸總是用問號結尾，充滿更多可能性。\n\n樊登讀書會創始人樊登在《讀書是一輩子的事》中說「好奇心不死，讀書不止」，我想說的是「好奇心不死，財富不止」，如今在全球擁有一下千多家讀書分會的樊登是個很好的例子。\n\
    \n窮爸爸是消極的，在面對想要的東西時，他首先關注的是價格，接著馬上反應「我買不起」，或者「我沒錢，所以不能夠學習」。他經常說：「no、不行、不可以、不可能、我不行、我不會」，消極態度已經關閉了他的大腦，於是他不用再做任何思考。\n\
    \n富爸爸是積極的，看到想要的東西時，他特別珍惜那種想要的欲望升起的感覺，因爲欲望是一種面對生命的激情。有錢人面對大過於當下能力的欲望時，不是消沈、拒絕或打退堂鼓，他說的是：「how？我\
    \ lighterbackground 什麼...」\n\n有些身心靈修行者，一不小心走入誤區，認為所有身外之物都是業\n\n是業障，應該同欲望一起被抵制，最後修成了枯木禪，把人間萬物、美人都視為枯木，對這個也沒興趣、對那個也沒興趣。\n\
    \n其實他們內心還未修煉通透，只是強行把欲望壓抑下來，搞得裡外不一、自我分裂。\n\n羅伯特清崎說：「永遠不要說你買不起一樣東西，那是窮人的態度，你要問的是『如何』購買得起（Never\
    \ say you cannot afford something. That is a poor man’s attitude. Ask HOW to afford\
    \ it）」。 \n\n思維本身並沒有對錯，但是思維會決定命運，而我們閱讀、學習就是為了要改變命運。哈福艾克有句話說「你要堅持自己是對的，還是要變有錢？（You\
    \ rather be rich or be right?）」，這是提醒我們從善如流，面對到新觀念時不要隨便陷入對錯之爭，忘記了自己想要致富的目的。\n\n\
    富爸爸不花時間做無謂的辯論，因為他的時間要保留給行動。\n\n窮爸爸則容易消耗時間在無法帶來結果的滔滔雄辯。\n\n現代社會科技網路無比發達，2020 年台灣網路中心提出的報告中指出，台灣整體上網率為\
    \ 89.3%，家戶上網比例則高達 90.1%。許多人在茶餘飯後成為了所謂的「鍵盤俠」¹，經常因為立場不同陷入口舌之爭，這是對於時間、精力資源的一大浪費。\n\
    \n經常無端製造或參與網上筆戰，容易成為法國社會心理學家古斯塔夫·勒龐筆下的《烏合之眾》，在網路上盲從地抨發不需負責任的評論，斷網之後依然要回到自己毫無改變的生活中。\n\
    \n> ①鍵盤俠，英文是 keyboard man，是一個網路詞語，指部分在現實生活中膽小怕事，而在網上佔據道德高點發表「個人正義感」和「個人評論」的人群。源於2014年6月4日，人民日報一篇題為《激勵見義勇為不能靠「鍵盤俠」》的時評。鍵盤俠亦可衍生為平時躲避社會群體，一旦脫離人群獨自面對電腦敲鍵盤或用手機進行網絡評論及聊天的時候，可以毫無顧忌談笑風生，對社會各個方面評頭論足。易盲目跟風，成為他人利用的對象。來源：百度百科。\n\
    \n以上就是窮爸爸和富爸爸的不同，這兩個爸爸不是你戶口名簿上的父親，而是你可以為自己選擇的人生態度。每個人內在都有這兩種不同的聲音，而你聆聽哪一種聲音，就會決定你一生的財富命運。\n\
    \n## 出身是否就決定命運？\n\n美國流傳著一個社會報導故事，說有一對雙胞胎，其中一個長大之後變成了殺人犯，記者訪問他說：「你怎麼會犯下這種事情呢？你為什麼成為一個殺人犯？你會因此被判刑、坐牢，付出一生的代價。」\n\
    \n他的回答是：「我爸爸是賭鬼，我媽媽是妓女，從小到大他們在家就一直吵架，吵完架就打我，你說我不成為殺人犯還能怎麼樣？」\n\n後來記者深度追蹤之後發現，原來這個殺人犯居然有一個哥哥，事業非常成功，甚至當時還在競選州長。\n\
    \n他們覺得太離奇了，雙胞胎有著同樣的基因，為什麼一個做了殺人犯，另一個卻成為了州長候選人？記者就去訪問這個哥哥，想知道他為什麼能夠成功？\n\n哥哥的回答是：「我為什麼不斷努力追求成功？因為我爸爸是一個賭鬼，我媽媽是一個妓女，他們從小就在家裡面打架、吵架，所以我不努力改變命運怎麼行呢？」\n\
    \n相同的家庭背景，甚至是相同的基因，卻形成截然不同的命運，這也是心理學長期研究的一個議題：對人的性格和命運來說，究竟是先天（nature）重要，還是後天（nurture）重要？一個人有没有發財、賺錢的體質，究竟是先天基因的影響大，還是後天培育的影響大？\n\
    \n在這對雙胞胎的故事中，一個人說因為我的家庭、我的成長環境、我的婚姻等等太糟糕，所以我只能夠沈淪。另一個人說因為我的家庭、我的成長環境、我的婚姻太糟糕，所以我要更努力才能掙脫毀滅性的家庭軌跡。這一切只關乎於一個人怎麼思考和定義自己的遭遇。\n\
    \n一個人順著命運往下墜，另一個卻能夠逆勢而起，這就是身而為人擁有自我意識的重要性。雖然環境的影響力巨大（古有孟母三遷），但\n\n我們並不是環境的產物，只要願意，人人都可以運用意識創造自己想要的命運。\n\
    \n## 腦神經迴路——改變命運的秘鑰\n\n貧窮腦製造貧窮思維，財富腦創造財富思維。\n\n思維是什麼？就是固定的腦神經迴路，也像是道路或是火車的軌道，一條經常走的路就會被踏得越來越深。\n\
    \n小時候爸媽帶我去爬山，我晃著小腦袋瓜一個勁地往上爬，我發現有些石頭中間的地方被踩得凹陷了，居然連石頭都會變形！本來是一片山林的地方，有了第一批人拔荊斬棘之後，就被無數後繼者的腳踏出一條道來了。\n\
    \n腦袋裡的想法也是一樣，經常想的想法就會在腦袋中形成一條固定迴路，下次要再啟動這個想法就很快速。\n\n每個想法，都是腦袋裡 500 萬兆神經元形成的連接網路，彼此發送信號，這些想法的神經網路就會不斷被加深。\n\
    \n假設把腦袋想成一張畫紙，第一次有這個想法的時候是用鉛筆畫了一道，第二次有相同的想法時就像用圓珠筆畫了一道，等想到第一萬遍的時候，就像是用一把鑽子在你的腦袋裡刻出了這個迴路。\n\
    \n所謂的刻骨銘心，其實就是重複操作的结果，滴水穿石也是這個道理，一段失去的感情經過一千個無眠之夜的打磨，就會成為一生遺憾。\n\n你越常產生同一個想法，這個想法所形成的腦神經迴路就會越加固定。\n\
    \n如果每天早上醒來想的是：「為什麼我這麼失敗？」你的潛意識就會開始作用，搜尋所有你失敗的例證，進行自我強化：「對，我確實太\n\n失敗了！」。「我很失敗」的想法，經過積年累月的鞏固，就在你的腦袋裡刻出了深深的迴路。\n\
    \n但如果每天早上醒來，你想的是：「我好幸運、我真好看、我擁有好多資源」，這些想法就會替你刻畫出正向的迴路。\n\n假設你認為自己沒有富爸爸，沒有良好的家庭背景，你也不用灰心喪志。父母和家庭背景是固定的，這些是既定的事實，但是你針對這些事實形成的「想法」卻是可變的。\n\
    \n所以好消息是，命運可以改變，只要我們先改變自己的思想腦迴路。\n\n人的腦神經有非常大的可塑性，美國腦神經科學研究的一塊新興領域是神經可塑性（neuroplasticity）域是神經可塑性（neuroplasticity）²，說的就是成年人如何通過強化特定腦細胞的連接來改變大腦結構。\n\
    \n我們無法決定自己出生的家庭環境，但是我們完全可以塑造自己的腦神經迴路，為自己打造一顆財富腦。\n\n既然腦袋就像是陶土一樣，可以隨我們捏塑，那就更要謹慎監督自己的想法，以免不小心把自己想成了一個窮人。\n\
    \n再次強調，金錢並不能決定一個人的價值，窮人或有錢人也不僅僅是靠口袋裡有多少錢來決定，而是傾向於擁有不同的思維模式，我們要留意的是哪些思維造成了貧窮。\n\
    \n現在我們來看看貧窮腦都在想些什麼呢？\n\n## 阻礙財富的負面想法\n\n我們的財富維度受到我們思維的影響，可能有人會說，「我愛錢都來不及了，怎麼可能對金錢有負面想法呢？」事實上這是對潛意識不夠了解的說法。\n\
    \n②神經可塑性是指重複性的經驗可以改變大腦的結構，由理查·大衛森（Richard J. Davidson）在1992年提出。過去的科學家認為在嬰兒發展關鍵期後，大腦結構就不發生變化了。但其實大腦由神經元細胞和神經膠質細胞構成，這些細胞互相連接，通過加強或削弱這些連接，成年後大腦的結構依然可以改變。來源：維基百科。\n"
