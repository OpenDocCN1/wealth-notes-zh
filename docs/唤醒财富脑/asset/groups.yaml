    # 大勢能的積累


    有個從事線上行業的學員說，不管是短視頻還是其他管道，初期在線上要建立流量的時候，通常進度十分緩慢，需要幾年的時間才能碰上「拐點」（打星號處）。比如觀看量從
    0 做到 10 萬要很久，但是一旦突破 10 萬，要衝上 100 萬甚至 1000 萬就變得非常快。因為一開始沒份量，激不起水花，要一直積累作品和能量，幸運的話，積累的成果可能突然產生爆款，然後吸引到資本加持，有資金投放廣告宣傳，又爆發得更大。當然，他也強調不同管道的拐點不同，並沒有保證成功的公式，但是熬到拐點之後會發生加乘作用是肯定的。


