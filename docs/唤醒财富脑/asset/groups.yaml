    ## 老闆思維就是組織思維


    組織或團隊的四層金字塔結構，每個層級的人負責的板塊不同：

    基層：負責銷售，出去衝鋒陷陣。

    中層：負責管理，建立公司的人事系統。

    高層：學習領導，時時傳遞公司的戰略方向，確保不會有所偏移。

    頂層：老闆，要學的是影響力，學習如何將願景一層層地落實到公司每一個人的心裡和行動之中。


    ## 影響財富的三大人生選擇


    人生三大選擇對財富影響至關重要：

    伴侶：願意不斷成長的伴侶，一起把握時機、創造財富。

    夥伴和圈子：尋找彼此支持不斷帶來正面影響的啦啦隊，遠離潑冷水的滅火隊。

    人生教練：不斷為自己提醒目標、加油打氣以及提供建議，他們是讓你對自己的承諾說到做到的人。


    ## 快速成長的良方：如何向上結交？


    1、環境：人是環境的產物，除了跟同儕交流外，也要經常尋求機會「向上結交」。

    2、發揮圈層效應的三種方法：

    - 混圈層：用混的方式去打進高於你的圈層，可能迅速有效但並不穩固。

    - 搭圈層：透過你的專業、技術、能力搭建橋樑，不會輕易被取代。

    - 建圈層：當擁有一定的資源時，透過無形的價值觀建立屬於自己的圈層。


    ## 三種越花越多的錢


    - 第一種：投資自己，也就是學習，這是確保一定會賺的投資。

    - 第二種：孝順，孝順父母是順應天時，會帶來無形的助緣。

    - 第三種：回饋社會，也可以說是行善的錢。


    ## 化財富阻礙為財富潛能


    親愛的朋友，眼看著本書即將進入尾聲，我希望你已經隨著每一章的分享與練習，慢慢地修正自己的思維與認知，在不知不覺中調整了自己與財富的關係。


    現在，讓我們再做一次開頭的測驗，看看這一趟財富的旅程，為你帶來了哪些改變。


    你不需要設想標準答案，也不需要刻意把答案修訂地更「漂亮」，真正的改變本來就需要長期實踐，僅僅是透過閱讀，就算程度只減少一、兩分，也是很大的進步了。


