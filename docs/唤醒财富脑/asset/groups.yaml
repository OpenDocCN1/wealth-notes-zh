    總之，這個淨資產計算公式能幫助我們打破一些迷思，不再僅僅是用收入或既有資產價值的角度評估一個人的理財能力。\n\n我們要考量個人的賺錢能力與「在時間中的財富管理能力」。有些年收入高的人，最後淨資產卻不如年收入較低的人，就是因為缺乏「財富管理與積累」的能力。\n\
    \n《下個富翁就是你》書中還有個故事，主角叫做佛蘭德，年紀48歲，年收入22萬美金，在美國屬於中高收入人群，開著豪車、出入米其林星級酒店、出手闊綽。\n\n\
    經過公式計算（22萬 x 48歲 ÷10=105萬），佛蘭德目前應該擁有105萬美元左右的淨資產。但他實際上只有25萬美元的淨資產，只有平均的四分之一，非但不是百萬美金富翁，還屬於超遜理財族的一員，財富累積能力明顯有問題。他看似過得高消費、高享受的生活，但是在他同等收入水平的人群中，卻屬於「窮人」。\n\
    \n如果是在馬太福音的故事裡，他是被主人沒收財產並趕出去的那一個僕人，只能在黑暗裡咬牙切齒地哭泣。\n\n有時候，佛蘭德還真有這種咬牙切齒的感覺，「明明我是收入很高的，怎麼還會有入不敷出的感覺」！上一節說到有些人明明收入很高，卻老覺得自己窮，是因為匱乏感所導致，佛蘭德就不一樣了，他收入很高，是因為虛榮感而導致不良的消費習慣跟高額貸款，像打腫臉充胖子一樣，「補了面子，賠了裡子」。針對這種情形，北方有句可愛的俗語叫做「裝大瓣兒蒜」。\n\
