    \ |  |  |  |  |\n| 自己現有淨資產佔目標比率 | % | % |  |  |\n\n- 資產負債表 -\n\n這個表格比較詳細，會花費你一些時間，對自己當下的資產做一個較精細的統計，包含現金、有價證券、房產（去除貸款價值）等，你才知道自己的起點在哪裡。目的是幫助我們盤點現有資產狀況，並對自己的財商能力做一個初步評估，而不是要對自己做任何的否定或攻擊。舉個例子來說，大華是一位三十五歲的男性，他在一間大型網路公司擔任中層主管，目前年收入是120萬台幣（約為人民幣28萬）。根據上述公式來計算，大華的目標淨資產應該是多少呢？\n\
