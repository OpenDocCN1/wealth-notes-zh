    ## 最新潮的賺錢關鍵詞


    當我們說，你所能想像的一切都已存在，只是還沒有顯化出來，這是什麼意思呢？為什麼許多國外的導師喜歡說我們要學習如何「顯化（manifest）」金錢？怎麼理解這個詞要表達的意思呢？


    我的大學專業是外國語文學，因為我從小就喜愛文字與語言，也經常參與文學比賽。我們試著從中英文的字源來理解一下，被眾多心靈成長導師所愛用的「顯化」一詞，為何與金錢建立了聯繫，甚至於取代了掙錢、賺錢這些傳統說法？


    英文詞彙「Manifest」的溯源可以追溯到14世紀時，代表「宣揚（個人名聲）」或「直接展現」，從拉丁詞「manifestare」衍伸出「發現、揭露」的意思，1560年後則表示「以行動揭示」。從英文中，看到它包含了由隱晦至顯明的行動意義。


    中文字「顯」，在金文中由（絲，聯、系）+（頁，頭部）兩個部分組成。造字的本義是：用絲線將珠玉、寶石等發光飾品掛在頭部，藉以展現自我。


    中文字「化」，始見於商代甲骨文，古字形由一個頭朝上的人和一個頭朝下的人組成，本義為變化，引申指自然界從無到有創造和化育的過程。


    從中文二字中，我們看到「顯化」一詞加在一起，代表從無到有，且彰顯了頭部的力量。


    從不嚴謹的語言運用角度，我們可以延伸理解為，「顯化」表示以頭部（思維、意識）從無到有地創造，「顯化金錢」則可延伸理解為「以思維及意識，從無到有地創造金錢」。


    ## 能量與物質本為一體


    本來存在於頭腦中的想法、信念與意識，能夠顯化為實際存在的金錢，原理在於：無形世界與有形世界並不是一分為二的，兩者本質上是相通的。


    科學家已經發現，在最微觀的層次裡面，萬物都可以細切為原子、質子、中子、電子，甚至到更小的量子、夸克與超弦。想像用顯微鏡一層層無限向下探的時候，其實一切都是由快速旋轉的粒子所組成的。如佛陀在菩提樹下打坐七七四十九天悟道時所說：萬物本一體。


    課堂中所使用的話筒、講台、螢幕，還有你舉目所見的樹木、花朵、馬路，乃至於家裡的桌子、椅子、電腦和身旁的人，看似毫不相干的萬物，底層其實都是相通相連的。


    借用狹義相對論的知名公式 E = mc²，意思是物體的質量乘以光速平方就等於它的能量，等式兩邊相通，所以能量與物質本質相通。


    例如水可以變化為冰塊、水蒸氣等不同的形態，但本質的化學組成都是 H₂O，只要找到變化的關鍵就可以自由轉換狀態。


    因此，一個人的思想、意識與他所體驗到的物質世界，本質上也是相通的，於是他的意識境界，將會以某種方式形成他的財富狀態，只是具體轉換的公式可能需要另一個愛因斯坦來發現了。


    本章便試圖整合目前心理、身心靈、神經語言程序學等領域對於「意識如何顯化為金錢」的一些理解，首先這需要我們從根本上正視自己思想的力量。


    「世上的 一切皆與其他萬物相連。我們的力量被喚醒之前，處於冬眠狀態。要喚醒如此非凡的力量，對自己在世界中角色的看法必須加以改變。」這是從科學探討心靈領域的卓越經典《無量之網》一書中的描述。


    ## 無形世界顯化有形世界：90% 以上的疾病與情緒有關


    宇宙分為兩個部分，一個是物質世界，一個是精神世界，這兩者本質上是彼此相連的，只是一體兩面，而多數人所關注的都是可見、可碰的物質世界。


    古語云：「存乎中，形於外」，這句話的白話意思是「存在於內部的，必顯現於外部」，而關於這句話的出处則有好幾種推測。


    一說是出自中醫名著《黃帝內經》：「有諸形於內，必形於外。」白話的意思是：人體內部若有疾病，一定會反映在身體外表上，可以藉觀察外表而察知內在的病情。


    另一說是出自儒學經典《禮記·大學》：「人之視己，如見其肝肺然，則何益矣。此謂誠於中，形於外。」白話的意思是：他人來認識自己，就好像認識自己的肺和肝，如果肺和肝有毛病，一眼就看到不正常了。所以遮掩有什麼用呢？這就是內心有什麼能量，外在舉止就會有什麼表現，根本瞞不了別人的道理。這裡是將中醫內外相依的原理，延伸到人們的處世之道，勸誡君子切記管束好自己的內心。


    又一說是出自歷史巨著《資治通鑑》：「為人君者，動靜舉措不可不慎，發於中必形於外，天下無不知之。」白話的意思是：作為君主，每一個行為都不能不慎重，因為內心所想的事，外表必然會顯露出來的，天下人會都知道。這裡談論的對象從君子轉為更有影響力的君王，並論述了君王之心不可藏匿，每個思緒都會人盡皆知。


    由此可見內在世界與外在世界的密切相關，欲在外在世界有所成就，必定不可忽略內在世界。


    除了古人早已看出這一法則，越來越多科學研究也指出了有形與無形世界的相連。世界衛生組織統計數據表示：「90%以上的疾病都與情緒有關」，中醫系統也特別強調五臟六腑與情緒的關係。


    情緒本是看不見的能量，當情緒沒有得到適當紓解，鬱積在身體中，就像一顆顆石頭卡在身體裡。沒有疏通的憤怒、悲傷等負向情緒越積越多，最後就會形成發炎、組織增生等具體的生理反應，甚至積壓成疾。


    身心健康就是能量與物質彼此聯通的最好範例，每個人必須為自己的能量狀態所帶來的結果負責，這不僅僅包含了一個人的健康，也包含他的財富、事業、情感、人際關係等狀況。


    每個人的外在處境都是一面鏡子，你所看見的一切就像鏡子一樣，幫你照見自己。


    有沒有聽過蘇東坡和佛印的故事？蘇東坡說你是一坨屎，佛印卻說你是一尊佛，事實上人只能看見自己內在所是的樣子。所以身心靈作家張德芬廣為人知的一句話說：「親愛的，外面沒有別人，只有你自己」，這也是國外奇蹟課程系統所倡導的核心理念。


    《華嚴經》云：「一切唯心造」，外在世界的一切都是內心世界的顯化，財富亦只是心性的副產品。就像日本經營之神稻盛和夫說：「心性得到提升，就會看清一切，知道自己該選擇怎樣的生活方式」，他所經營的京瓷、KDDI
    都是世界 500 強企業，而他特別強調「心」才是長期成功與富足的源頭。


    ## 能量狀態對物質的影響：水和植物，都會對你的情緒起反應


    日本的江本勝博士有 30 年的時間都在科學實驗室裡，後來將研究成果出了一本書叫做《生命的答案，水知道》，顯示出人的思想、情緒、語言對物質的影響。


    他在日本雪山中取得純淨的水，然後把山泉水採樣做成一個個切片放到顯微鏡底下觀察，實驗室人員對這些切片進行各種試驗，測試水結晶是否會對人們的語語產生反應。


    當他們對水的結晶說「謝謝你、我愛你、你真美、我喜歡你」等正面話語時，水的結晶非常漂亮，就像大自然中的雪花，每一朵都有獨一無二的形狀。


    但是當實驗室人員對水說「我恨你、混蛋、你真醜、你沒有價值」等負面話語時，水的結晶就變得混濁、破碎和扭曲。


    ![](img/c2747cd0c5bf820d125459594a169642_194_0.png)


    - 話語能量對水結晶的影響，來源：《生命的答案，水知道》-


    人體中有至少百分之七十的水，既然一片小小的水結晶對於人的意念跟話語都會起這麼大的反應，人怎麼會不受到意念跟話語的影響呢？


    如果我們每一天在腦袋裡的自我對話都是負面的，哪怕沒有說出口，但想法是「你不夠好、你做不到、你怎麼那麼笨、那麼醜、那麼胖」等等，我們就能想像身體裡面的水可得翻騰成什麼樣子了，是吧？


    除了水結晶，植物也會受到人的思想影響。


    阿聯酋的 IKEA（宜家），為宣傳反語言暴力，做了一個「反霸凌實驗」。他們從賣場選了兩盆植物放進一所學校，澆同樣的水，施同樣的肥，就連曬太陽也是同進同出，保持它們得到的照料是一模一樣的。


    唯一不同的是，兩盆植物接收到的語言不同。宜家讓一群孩子錄下兩段話語：一種是責罵、侮辱，像是「你好笨、好醜、沒人喜歡你～」，


    ![](img/c2747cd0c5bf820d125459594a169642_194_1.png)


    - 被罵的植物（左）嚴重枯萎，被讚美的植物（右）明顯茂盛。 （取自 IKEA YouTube 片段截圖） -


    另一種是讚美、肯定，像是「你好美、好棒、我們都喜歡看到你～」分別用設備反覆播放給兩株植物聽，經過的學生也會時不時進行現場版的讚美或辱罵。


    三十天後，這兩株植物呈現出來的樣子有如天壤之別。左邊那株被霸凌的植物看起來了無生氣，許多葉子都枯黃了，模樣十分可憐。右邊被讚美的植物則相反，不僅繼續成長茁壯，外觀看起來也非常健康。


    這就是思想、語言能量造成的強大影響力啊！


    我們自己也像是一棵植物，如果連續一個月，我們都在責怪自己、質疑自己、評判自己，我們的能量場就會向左邊的植物一樣，奄奄一息、毫無生氣，這是穿衣服或化妝沒辦法掩蓋的，氣場不會騙人。


    這樣我們還能吸引到好的事業機會、成交機會或是貴人夥伴嗎？很可能不會，這就是一種內在世界影響外在財富的方式。


    所以，甚至連「運氣」都是可以自己創造的，當你說自己很好運時，往往你真的會越來越好運，而觀察一下身邊經常抱怨運氣差的朋友，好像真的倒霉事都會發生在他身上。


    ## 運用能量層級：高頻吸引財富


    前面我們認識到能量與物質彼此相通，接著理解到每個人的能量狀態隨時都在創造他的物質生活，那實際上要如何運用呢？


    開門見山先說結論：「高能量層級吸引財富，低能量層級導致匱乏。」


    如何迅速分辨自己、家人以及身邊的人處於什麼樣的能量層級呢？


    下面這張圖是意識能量層級圖，出自美國意識能量學宗師大衛·霍金斯（David Hawkins）博士與一位諾貝爾物理學獎得主的研究結果。他們用二十多年的時間走遍歐美和亞洲大陸，在不同的文化、國家與地區進行許多的能量測試，這是他們總結的一張能量表。


    ![](img/c2747cd0c5bf820d125459594a169642_196_0.png)


    左邊數字代表一個人的能量層級，右邊描述他延伸出來的狀態。能量數字歸零代表死亡。底層 20 是最接近死亡的頻率，一路往上升到頂層是 1000，是目前所能測量出來最高程度的意識狀態，你可以稱之為神的意識或者神的精神。


    作者稱 700 至 1000 為開悟正覺的頻率，佛陀、耶穌、老子等傳說中的悟道者都屬於此層級。傳說中，耶穌一出現在一個村莊裡，周圍的人們心中就瞬間充滿與耶穌的連結，每一個人的心都變得無比清澈和純淨。


    大部分的人一生中都在 1 ~ 600 之間徘徊，600 是 peace 寧靜的頻率，也是接近開悟者才會有的頻率。


    書中將 200 以上的狀態稱之為正能量（心靈力），而 200 以下的狀態則是不真實或所謂的負能量。這裡說的正負並不代表絕對的好壞，我們會誕生在地球上，本身就是要修練人性中的光明面與陰暗面。事實上，許多巨大的成長都發生在負向狀態產生的時候，因為那時我們更需要努力穿越黑暗、從中獲得體悟。


    能量層級的分佈比例也符合「80/20 法則」（The 80/20 Rule）。


    世界上百分之二十的人擁有全世界百分之八十的總財富，而對能量層級來說，只有百分之二十的人長期處在 200 以上的正能量、富足的狀態中，另外百分之八十的人大部分時間都處在匱乏的能量中，也就是
    200 以下的負能量。


    研究顯示，1994 年的時候，世界上 85% 的人都還在 200 以下的能量層級，2006 年時則變成 78% 的人在 200 以下的層級，人類整體意識狀態是在提升的。


    除非是悟道者，普通人不太可能一直維持在正能量狀態，但陷入負能量後又能奮起拔升，反而更激勵人心，這也是成長的目的：提升能量狀態、顯化物質成果。


    ## 2012 末日預言與集體意識


    曾經有一個末日預言說，2012 年 12 月 21 日世界將遭遇 Palestine 的毀滅，許多人都戰戰兢兢、戒備以待，度過那天之後又慢慢失去關注。有


    態投射到未來，就預測出了一個毀滅的結果。


    事實上也不難想像，看看能量層級圖表上的內容，當我們意識等級在 200 以下時，代表處於驕傲、憤怒、慾望、恐懼、悲傷、冷漠、內疚和羞愧等狀態。如果大部分人類都長期處於負向狀態，自取滅亡難道不是很合理的下場嗎？


    我們可能任由城市發展、對環境的予取予求造成大自然反撲和人類的滅亡，這都是有可能發生的。有在關注環保護題的朋友也知道，光是全球暖化這個議題，二氧化碳排放過量造成的氣候變化、冰山融化和海平面上升等問題，不僅讓北極熊失去棲地和食物來源，也威脅了數百萬生活在低窪地帶的人們的性命安全。


    但是事態還沒有到不可挽回的地步。


    大衛博士發現，人類的集體意識層級停留在 190 長達數百年，一直在 190 附近不斷來回震盪。但是在 1994 年卻突然躍升至 207，全人類終於突破了正負能量的分水嶺。地球上每一個人的能量層級加總起來平均，終於突破了
    200，進入了正能量的層級。


    ## 能量層級測試方法


    你可能會很好奇，能量層級是怎麼測試出來的呢？


    大衛博士與諾貝爾物理獎得主合作，運用人體運動學的基本原理，輔助以精密的物理學儀器，近三十年的臨床實驗，累積了幾百萬筆資料，經過精密統計分析後，發現人類各種不同的意識層次都有相對應的能量振動頻率物理指數。


    身心靈領域中，運用類似肌肉測試的研究也不少，原理就是透過人體肌肉自然的「增強或削弱反應」來偵測一個東西的能量好壞。


    研究發現，任何虛假的話語、對生命無益的事物，都會得到肌肉無力的回應。而所有真實的話語、對生命有益的事物，則會得到肌肉強有力的反應。

    '
  mdcn: '

    你說的話就會形成你的存在，訴說正向話語不是要去討好任何人，而是話語本身就會影響到我們的身體。


    對身體說正向的話，身體就會越來越好，如果你批判、否定身體，身體就會越來越不好，這就是自我實現的預言（self-fulfilling prophecy），所以要隨時隨地覺察自己的語言。


    思想夠強大，就會形成物質，思想可以是養分，也可以是病毒，病毒過多就會造成系統紊亂與失序，但很多人無法停止消極的思考，想到金錢就焦慮、恐懼，這時候就要借助工具。


    我每天早上都會播放自己錄製的中英文正向能量肯定句，其中有144句中英文對照的高頻財富句，每天早上都在給我做自動化催眠。


    I am abundant. 我很富足。


    I attract many good resources to me. 我吸引大量資源來到生命中。


    這是一種偷懶的做法，就在刷牙、洗臉、穿衣、化妝的過程中，我已經在內在建立了正向的意念。


    思想是過去和未來的交界，我們的未來正透過此刻的想法和話語被塑造。


    所以我們要經常留意自己的話語，當問題出現的時候，你可以說「天哪怎麼會這樣，都是誰誰誰的錯」，停留在指責跟抱怨裡，你也可以說「既然有問題出現，就一定有方法」。


    > 「轉念即轉運。」-- 數字心理學導師 COCO 院長（Kun, Qian）


    成功人士不會抱怨為何工作或事業每天都有大大小小的問題，因為他們相信，一個問題一定會自動帶來三個以上的解決方案。


    對於144句中英文對照的正能量財富肯定句有興趣的朋友，請加入微信諮詢：rmcx006。


    這麼轉念一想，就不需要浪費更多情緒在「思考問題」上，而是可以把精力保留給「思考解決方案」。甚至他們會感謝問題的出現，因為問題如果不暴露，就永遠不會去想新的可能性。


    雖然我們知道思想的重要性，但除非是得道高僧，很少有人能夠隨時隨地覺知自己是在發揮財富腦思維，還是陷入了貧窮腦思維。


    學習完這一章後，記得一天中至少停下來十次，問自己「現在腦袋中的這個想法，是讓我更靠近財富，還是遠離財富？」


    ## 本章小結


    窮爸爸 VS. 富爸爸： 你如何選擇？


    - 1、 有錢人與窮人的第三個區別：思維的方式不同。

    - 2、 每個人的內在都有窮爸爸和富爸爸的聲音，一個是恐懼和保守的聲音，一個是勇氣和創造的聲音。

    - 3、 富爸爸：你要堅持自己是對的，還是變有錢？——不花時間做無謂的辯論，時間需要保留給行動。

    - 4、 窮爸爸：經常說的是 no 不行、 不可以、 不可能、 不會， 我不行， 我不能，他的消極態度已經關閉了他的大腦，於是他不用再做任何思考。


    ## 腦神經迴路——改變命運的秘鑰


    - 1、 思想決定命運。每個人都不是環境的產物，人人都可以運用意識創造自己要的命運。

    - 2、 腦神經其實有非常大的可塑性，我們可以有意識地塑造自己的腦神經迴路，為自己打造一個有錢人的腦袋。

    - 3、 人們下意識對有錢人的形象跟有錢的生活的排斥，就是潛意識裡對金錢的抗拒和排斥。


    ## 冰山理論：是什麼讓你被負面思想纏繞


    - 1、我們關注了一件事情，就很難再關注另外一件事情——所以若關注了負面的事物，就很難同時關注正面的事物。

    - 2、冰山理論：許多說得出來的思維只是表像，形成這個思想的底下還有更多的記憶、成長背景和家庭模式。

    - 3、人無法獲得巨大財富的最大阻礙往往是：潛意識沒有真正允許自己有錢。


    ## 相信自己值得更多金錢


    - 1、貧窮只是貧窩，放下清白感與不配得感才能迎接財富。

    - 2、面對金錢的恐懼感分為兩種：一種是擔心錢不夠的生存恐懼，另一種是對金錢的流入與流出都感到緊張，可能源自於祖輩的影響，心理學上也稱之為表觀遺傳學。

    - 3、金錢的流動就等於價值的流動，而當你不敢要的時候，其實你是害怕自己沒有辦法給到對方足夠多的價值，你對自己不夠有自信。


    ## 第六章

    有錢人如何管理狀態？


    You will attract everything you require –

    money, people, connections.

    你將吸引到自己所要求的一切 - 金錢、人、關係。

    《秘密》（The Secret）作者朗達·拜恩 (Rhonda Byrne)


    窮人與有錢人的第四項區別，在於有錢人善於管理自己的狀態，也就是他們特別關注自己的意識能量層級。


    上一章我們談到一個人的思維模式影響他的財富格局，但如果要一條條改造思想，其實是件特別不容易的事情，鮮少人能夠真正做到控制自己的所有想法，即使知道應該時時保持正向思維，可能也很難做到。


    我想起以前在禪修院裡練習行禪的體驗，每個人端一碗清水去走山（繞行寺院周邊的山路），整個過程中要避免碗中的水翻灑出來。


    想來簡單，就是端一碗水走路，但真正走起來才發現，每踏出一步，自己的重心都在失去平衡、重新平衡，同時每一刻腦袋裡都會閃過新的念頭。這些念頭影響到每一步是否平穩，一點點的走神、偏移，都會導致水潑出來。


    如果沒有在失衡的瞬間覺察並加以調整，接下來的步伐也會跟著失衡，繞山一圈回來會發現，水都灑得差不多了。


    建立財富的過程也像是走山，我們捧著或大或小的容器，想要承接更多的豐盛，但生活中卻充滿了使我們走神、誤判、犯錯的瞬間，讓我們無法守住獲得的財富與資源。


    使財富流失的，正是我們前一章所探討的限制性思考，可怕的是，每一個瞬間都會有新的想法產生，若是沒有加以覺察、管理，好不容易建立的財富腦思維也很容易被動搖，在你沒有意識到的時候，限制性信念又阻礙了你致富的機會。


    管理自己的每一個想法太曠時費力，又無法滴水不漏，有沒有一個更快速、更有效、更全面的方法呢？


    答案是有，那就是進行「能量管理」，讓自己保持在高能量、高意識層級的狀態，這樣就可以確保舊有模式無法侵擾你。處在高能量狀態的人會產生正向思維、採取正向行動，自然更容易創造財富。


    或許你不是特別熟悉意識、能量層級這些字眼，甚至懷疑這些玄乎的話題為什麼和財富相關，接下來這一章，我們會帶你認識能量是什麼、能量如何展現在生活中，以及我們如何運用能量來幫助自己吸引更多財富。


    ## 最新潮的賺錢關鍵詞


    當我們說，你所能想像的一切都已存在，只是還沒有顯化出來，這是什麼意思呢？為什麼許多國外的導師喜歡說我們要學習如何「顯化（manifest）」金錢？怎麼理解這個詞要表達的意思呢？


    我的大學專業是外國語文學，因為我從小就喜愛文字與語言，也經常參與文學比賽。我們試著從中英文的字源來理解一下，被眾多心靈成長導師所愛用的「顯化」一詞，為何與金錢建立了聯繫，甚至於取代了掙錢、賺錢這些傳統說法？


    英文詞彙「Manifest」的溯源可以追溯到14世紀時，代表「宣揚（個人名聲）」或「直接展現」，從拉丁詞「manifestare」衍伸出「發現、揭露」的意思，1560年後則表示「以行動揭示」。從英文中，看到它包含了由隱晦至顯明的行動意義。


    中文字「顯」，在金文中由（絲，聯、系）+（頁，頭部）兩個部分組成。造字的本義是：用絲線將珠玉、寶石等發光飾品掛在頭部，藉以展現自我。


    中文字「化」，始見於商代甲骨文，古字形由一個頭朝上的人和一個頭朝下的人組成，本義為變化，引申指自然界從無到有創造和化育的過程。


    從中文二字中，我們看到「顯化」一詞加在一起，代表從無到有，且彰顯了頭部的力量。


    從不嚴謹的語言運用角度，我們可以延伸理解為，「顯化」表示以頭部（思維、意識）從無到有地創造，「顯化金錢」則可延伸理解為「以思維及意識，從無到有地創造金錢」。


    ## 能量與物質本為一體


    本來存在於頭腦中的想法、信念與意識，能夠顯化為實際存在的金錢，原理在於：無形世界與有形世界並不是一分為二的，兩者本質上是相通的。


    科學家已經發現，在最微觀的層次裡面，萬物都可以細切為原子、質子、中子、電子，甚至到更小的量子、夸克與超弦。想像用顯微鏡一層層無限向下探的時候，其實一切都是由快速旋轉的粒子所組成的。如佛陀在菩提樹下打坐七七四十九天悟道時所說：萬物本一體。


    課堂中所使用的話筒、講台、螢幕，還有你舉目所見的樹木、花朵、馬路，乃至於家裡的桌子、椅子、電腦和身旁的人，看似毫不相干的萬物，底層其實都是相通相連的。


    借用狹義相對論的知名公式 E = mc²，意思是物體的質量乘以光速平方就等於它的能量，等式兩邊相通，所以能量與物質本質相通。


    例如水可以變化為冰塊、水蒸氣等不同的形態，但本質的化學組成都是 H₂O，只要找到變化的關鍵就可以自由轉換狀態。


    因此，一個人的思想、意識與他所體驗到的物質世界，本質上也是相通的，於是他的意識境界，將會以某種方式形成他的財富狀態，只是具體轉換的公式可能需要另一個愛因斯坦來發現了。


    本章便試圖整合目前心理、身心靈、神經語言程序學等領域對於「意識如何顯化為金錢」的一些理解，首先這需要我們從根本上正視自己思想的力量。


    「世上的 一切皆與其他萬物相連。我們的力量被喚醒之前，處於冬眠狀態。要喚醒如此非凡的力量，對自己在世界中角色的看法必須加以改變。」這是從科學探討心靈領域的卓越經典《無量之網》一書中的描述。


    ## 無形世界顯化有形世界：90% 以上的疾病與情緒有關


    宇宙分為兩個部分，一個是物質世界，一個是精神世界，這兩者本質上是彼此相連的，只是一體兩面，而多數人所關注的都是可見、可碰的物質世界。


    古語云：「存乎中，形於外」，這句話的白話意思是「存在於內部的，必顯現於外部」，而關於這句話的出处則有好幾種推測。


    一說是出自中醫名著《黃帝內經》：「有諸形於內，必形於外。」白話的意思是：人體內部若有疾病，一定會反映在身體外表上，可以藉觀察外表而察知內在的病情。


    另一說是出自儒學經典《禮記·大學》：「人之視己，如見其肝肺然，則何益矣。此謂誠於中，形於外。」白話的意思是：他人來認識自己，就好像認識自己的肺和肝，如果肺和肝有毛病，一眼就看到不正常了。所以遮掩有什麼用呢？這就是內心有什麼能量，外在舉止就會有什麼表現，根本瞞不了別人的道理。這裡是將中醫內外相依的原理，延伸到人們的處世之道，勸誡君子切記管束好自己的內心。


    又一說是出自歷史巨著《資治通鑑》：「為人君者，動靜舉措不可不慎，發於中必形於外，天下無不知之。」白話的意思是：作為君主，每一個行為都不能不慎重，因為內心所想的事，外表必然會顯露出來的，天下人會都知道。這裡談論的對象從君子轉為更有影響力的君王，並論述了君王之心不可藏匿，每個思緒都會人盡皆知。


    由此可見內在世界與外在世界的密切相關，欲在外在世界有所成就，必定不可忽略內在世界。


    除了古人早已看出這一法則，越來越多科學研究也指出了有形與無形世界的相連。世界衛生組織統計數據表示：「90%以上的疾病都與情緒有關」，中醫系統也特別強調五臟六腑與情緒的關係。


    情緒本是看不見的能量，當情緒沒有得到適當紓解，鬱積在身體中，就像一顆顆石頭卡在身體裡。沒有疏通的憤怒、悲傷等負向情緒越積越多，最後就會形成發炎、組織增生等具體的生理反應，甚至積壓成疾。


    身心健康就是能量與物質彼此聯通的最好範例，每個人必須為自己的能量狀態所帶來的結果負責，這不僅僅包含了一個人的健康，也包含他的財富、事業、情感、人際關係等狀況。


    每個人的外在處境都是一面鏡子，你所看見的一切就像鏡子一樣，幫你照見自己。


    有沒有聽過蘇東坡和佛印的故事？蘇東坡說你是一坨屎，佛印卻說你是一尊佛，事實上人只能看見自己內在所是的樣子。所以身心靈作家張德芬廣為人知的一句話說：「親愛的，外面沒有別人，只有你自己」，這也是國外奇蹟課程系統所倡導的核心理念。


    《華嚴經》云：「一切唯心造」，外在世界的一切都是內心世界的顯化，財富亦只是心性的副產品。就像日本經營之神稻盛和夫說：「心性得到提升，就會看清一切，知道自己該選擇怎樣的生活方式」，他所經營的京瓷、KDDI
    都是世界 500 強企業，而他特別強調「心」才是長期成功與富足的源頭。


    ## 能量狀態對物質的影響：水和植物，都會對你的情緒起反應


    日本的江本勝博士有 30 年的時間都在科學實驗室裡，後來將研究成果出了一本書叫做《生命的答案，水知道》，顯示出人的思想、情緒、語言對物質的影響。


    他在日本雪山中取得純淨的水，然後把山泉水採樣做成一個個切片放到顯微鏡底下觀察，實驗室人員對這些切片進行各種試驗，測試水結晶是否會對人們的語語產生反應。


    當他們對水的結晶說「謝謝你、我愛你、你真美、我喜歡你」等正面話語時，水的結晶非常漂亮，就像大自然中的雪花，每一朵都有獨一無二的形狀。


    但是當實驗室人員對水說「我恨你、混蛋、你真醜、你沒有價值」等負面話語時，水的結晶就變得混濁、破碎和扭曲。


    ![](img/c2747cd0c5bf820d125459594a169642_194_0.png)


    - 話語能量對水結晶的影響，來源：《生命的答案，水知道》-


    人體中有至少百分之七十的水，既然一片小小的水結晶對於人的意念跟話語都會起這麼大的反應，人怎麼會不受到意念跟話語的影響呢？


    如果我們每一天在腦袋裡的自我對話都是負面的，哪怕沒有說出口，但想法是「你不夠好、你做不到、你怎麼那麼笨、那麼醜、那麼胖」等等，我們就能想像身體裡面的水可得翻騰成什麼樣子了，是吧？


    除了水結晶，植物也會受到人的思想影響。


    阿聯酋的 IKEA（宜家），為宣傳反語言暴力，做了一個「反霸凌實驗」。他們從賣場選了兩盆植物放進一所學校，澆同樣的水，施同樣的肥，就連曬太陽也是同進同出，保持它們得到的照料是一模一樣的。


    唯一不同的是，兩盆植物接收到的語言不同。宜家讓一群孩子錄下兩段話語：一種是責罵、侮辱，像是「你好笨、好醜、沒人喜歡你～」，


    ![](img/c2747cd0c5bf820d125459594a169642_194_1.png)


    - 被罵的植物（左）嚴重枯萎，被讚美的植物（右）明顯茂盛。 （取自 IKEA YouTube 片段截圖） -


    另一種是讚美、肯定，像是「你好美、好棒、我們都喜歡看到你～」分別用設備反覆播放給兩株植物聽，經過的學生也會時不時進行現場版的讚美或辱罵。


    三十天後，這兩株植物呈現出來的樣子有如天壤之別。左邊那株被霸凌的植物看起來了無生氣，許多葉子都枯黃了，模樣十分可憐。右邊被讚美的植物則相反，不僅繼續成長茁壯，外觀看起來也非常健康。


    這就是思想、語言能量造成的強大影響力啊！


    我們自己也像是一棵植物，如果連續一個月，我們都在責怪自己、質疑自己、評判自己，我們的能量場就會向左邊的植物一樣，奄奄一息、毫無生氣，這是穿衣服或化妝沒辦法掩蓋的，氣場不會騙人。


    這樣我們還能吸引到好的事業機會、成交機會或是貴人夥伴嗎？很可能不會，這就是一種內在世界影響外在財富的方式。


    所以，甚至連「運氣」都是可以自己創造的，當你說自己很好運時，往往你真的會越來越好運，而觀察一下身邊經常抱怨運氣差的朋友，好像真的倒霉事都會發生在他身上。


    ## 運用能量層級：高頻吸引財富


    前面我們認識到能量與物質彼此相通，接著理解到每個人的能量狀態隨時都在創造他的物質生活，那實際上要如何運用呢？


    開門見山先說結論：「高能量層級吸引財富，低能量層級導致匱乏。」


    如何迅速分辨自己、家人以及身邊的人處於什麼樣的能量層級呢？


    下面這張圖是意識能量層級圖，出自美國意識能量學宗師大衛·霍金斯（David Hawkins）博士與一位諾貝爾物理學獎得主的研究結果。他們用二十多年的時間走遍歐美和亞洲大陸，在不同的文化、國家與地區進行許多的能量測試，這是他們總結的一張能量表。


    ![](img/c2747cd0c5bf820d125459594a169642_196_0.png)


    左邊數字代表一個人的能量層級，右邊描述他延伸出來的狀態。能量數字歸零代表死亡。底層 20 是最接近死亡的頻率，一路往上升到頂層是 1000，是目前所能測量出來最高程度的意識狀態，你可以稱之為神的意識或者神的精神。


    作者稱 700 至 1000 為開悟正覺的頻率，佛陀、耶穌、老子等傳說中的悟道者都屬於此層級。傳說中，耶穌一出現在一個村莊裡，周圍的人們心中就瞬間充滿與耶穌的連結，每一個人的心都變得無比清澈和純淨。


    大部分的人一生中都在 1 ~ 600 之間徘徊，600 是 peace 寧靜的頻率，也是接近開悟者才會有的頻率。


    書中將 200 以上的狀態稱之為正能量（心靈力），而 200 以下的狀態則是不真實或所謂的負能量。這裡說的正負並不代表絕對的好壞，我們會誕生在地球上，本身就是要修練人性中的光明面與陰暗面。事實上，許多巨大的成長都發生在負向狀態產生的時候，因為那時我們更需要努力穿越黑暗、從中獲得體悟。


    能量層級的分佈比例也符合「80/20 法則」（The 80/20 Rule）。


    世界上百分之二十的人擁有全世界百分之八十的總財富，而對能量層級來說，只有百分之二十的人長期處在 200 以上的正能量、富足的狀態中，另外百分之八十的人大部分時間都處在匱乏的能量中，也就是
    200 以下的負能量。


    研究顯示，1994 年的時候，世界上 85% 的人都還在 200 以下的能量層級，2006 年時則變成 78% 的人在 200 以下的層級，人類整體意識狀態是在提升的。


    除非是悟道者，普通人不太可能一直維持在正能量狀態，但陷入負能量後又能奮起拔升，反而更激勵人心，這也是成長的目的：提升能量狀態、顯化物質成果。


    ## 2012 末日預言與集體意識


    曾經有一個末日預言說，2012 年 12 月 21 日世界將遭遇 Palestine 的毀滅，許多人都戰戰兢兢、戒備以待，度過那天之後又慢慢失去關注。有


    態投射到未來，就預測出了一個毀滅的結果。


    事實上也不難想像，看看能量層級圖表上的內容，當我們意識等級在 200 以下時，代表處於驕傲、憤怒、慾望、恐懼、悲傷、冷漠、內疚和羞愧等狀態。如果大部分人類都長期處於負向狀態，自取滅亡難道不是很合理的下場嗎？


    我們可能任由城市發展、對環境的予取予求造成大自然反撲和人類的滅亡，這都是有可能發生的。有在關注環保護題的朋友也知道，光是全球暖化這個議題，二氧化碳排放過量造成的氣候變化、冰山融化和海平面上升等問題，不僅讓北極熊失去棲地和食物來源，也威脅了數百萬生活在低窪地帶的人們的性命安全。


    但是事態還沒有到不可挽回的地步。


    大衛博士發現，人類的集體意識層級停留在 190 長達數百年，一直在 190 附近不斷來回震盪。但是在 1994 年卻突然躍升至 207，全人類終於突破了正負能量的分水嶺。地球上每一個人的能量層級加總起來平均，終於突破了
    200，進入了正能量的層級。


    ## 能量層級測試方法


    你可能會很好奇，能量層級是怎麼測試出來的呢？


    大衛博士與諾貝爾物理獎得主合作，運用人體運動學的基本原理，輔助以精密的物理學儀器，近三十年的臨床實驗，累積了幾百萬筆資料，經過精密統計分析後，發現人類各種不同的意識層次都有相對應的能量振動頻率物理指數。


    身心靈領域中，運用類似肌肉測試的研究也不少，原理就是透過人體肌肉自然的「增強或削弱反應」來偵測一個東西的能量好壞。


    研究發現，任何虛假的話語、對生命無益的事物，都會得到肌肉無力的回應。而所有真實的話語、對生命有益的事物，則會得到肌肉強有力的反應。

    '
