    ## 29 | 美元霸权是怎么回事？


    徐弃郁·美国简史30讲


    有人说，美国称霸世界有两根主要支柱：美军和美元。这话是有道理的，美军我就不多说了，这一讲我们主要看一下美元霸权。为什么说美元霸权呢？因为美元虽然是美国的货币，但它是国际上最主要的结算货币和最主要的储备货币。就是说大多数国家买东西，得用美元，大多数国家存钱，得存美元，而印钞机是在美国手里。这样一来，美国对大多数国家的钱包里都有相当的探察能力，这真是实实在在的权力。


    ### 美元与黄金直接挂钩


    问题是，美元这种霸权地位怎么来的？这里我得稍微讲一点美元的历史。实际上，以前美元并不是一种非常可靠的货币，美国历史上有关几次滥发货币的记录。特别是在19世纪上半期，美国大量的小银行，当时被叫做“野猫银行”，都有印美元的权力，可以说一片乱象。


    直到第一次世界大战之前，国际中心货币不是美元，是英镑。这可不光是因为当时大英帝国的霸权，还因为英镑本身可以说是有史可查的最稳定的货币，它的币值300多年一直不变，信用非常高。这一点美元肯定比不上。


    美元后来地位和第二次世界大战有直接关系。当时美国经济实力独步天下，黄金储备占有世界一半，那美元当然强势了。但我告诉你，光这些还不够。美元的地位实际上是美国在设计战后世界的时候，人为确定起来的。这就是说到布雷顿森林体系了。


    我在第二十六讲已经讲到过布雷顿森林体系，这里要补充的是，它还有一个非常关键的安排，那就是美元和黄金直接挂钩，35美元等于一盎司黄金（大概8克），而且确保兑换。什么意思？就是你拿到美元就相当于拿到黄金，只要有35美元就可以从美国那里换一盎司黄金。要知道，黄金是人类历史上最可靠的货币，美国作这种设定，那么就使美元也成为了最可靠的货币。所以你就知道了，美元的地位是美国当时利用自己超强的实力，人为确定下来的。


    但是我要告诉你，这只是美元霸权的第一步。美元和黄金直接挂钩，实际上并没有给美国太多的权力。为什么呢？你想，35美元就一定可以从美国换一盎司黄金，那你印美元的时候就不得不考虑自己有多少黄金储备。要不然美元印得太多了，人家发现拿美元兑不了那么多黄金，那你的信用不就毁了吗？


    这种情况到上世纪70年代就变了。上世纪70年代初，国际金融史上发生了一件大事，那就是美元和黄金脱钩。布雷顿森林体系瓦解。为什么会这样呢？实际上原因也很容易，其他国家的经济开始恢复，卖给美国的东西都换成美元了，那这些国家手里的美元越来越多，从美国换的黄金也越来越多。


    我前面讲了，美元和黄金是直接挂钩的，35美元就可以从美国换一盎司黄金。这一来二去美国就受不了了，它的黄金储备迅速流出。我说一个数据，1951年美国黄金储备占有世界的47%，1959年，十年不到就只占34%了。所以美国肯定不干。那怎么办？改规则。35美元换一盎司黄金的规则取消，那美元和黄金之间价格怎么定？市场来决定。这就是美元和黄金脱钩。


    ### 美元与黄金脱钩


    听到这里，你会觉得，这不是美元衰落了吗，美国国力撑不住了吗？实际上很多教科书也是这么说的。但是我告诉你，恰恰相反，这是美元霸权特别重要的一步。


    就像我上面说的，只要你的货币和黄金挂钩，那你能印的钱数只能以你手里的黄金为基准，实际上没有太多的操作空间。但一旦和黄金脱钩，就完全不一样了。


    美国的货币发行量，或者说印多少美元不再是看它手里有多少黄金，而是看它有多少需求。这个差别可太大了。美元实际上通过这一步实现了彻底虚拟化。在此之前，美元这一张纸为什么能换东西？因为它代表了固定数量的黄金，人们拿着美元实际上相当于拿着黄金。


    那在此之后，美元可真就是一张纸了，只不过美国政府保证它能换东西，大家也相信它能换东西。这就是彻底虚拟化。实现了这一点，美国就可以按照自己的需要来加大或者缩小美元的发行量，影响世界各国的钱包里。美元霸权这个时候才真正实现。


    说到这里，如果你对美元虚拟化给美国带来的好处还觉得不好理解，我再插一个最近的例子，那就是2008年金融危机以后，美国为应对危机，成倍地加印美元，让全世界给它买单。你设想一下，如果此时美元没有和黄金脱钩，那它哪里来那么多黄金作保证，美国根本不可能通过大量增发美元来摆脱危机。


    ### 美元中心地位的保持


    但这个问题也来了，美元既然虚拟化了，那其他国家为什么都在用，都在存？美元的中心地位怎么保持呢？这就是说到美国那种超高的玩法了。这个过程非常复杂，时间关系我讲几点。


    首先是美国的信用等级很高。这里有两个因素——


    第一个因素，它经济实力还是世界第一，没有国家能超过它。这是它信用的基础，我们得承认。


    第二个因素，那就是国际上整个信用评级系统是美国公司组成的，美国公司会给自己国家的信用打低分吗？明白这一条就不用多说了。我们只说结果：美国信用等级高，美元当然受欢迎。


    除了信用以外，美国还有一些人为的做法来支撑美元的地位。比如说，美国的霸权地位，使它可以要求很多国际组织接受美元。像前面讲过的世界银行和国际货币基金组织，不是由各个国家拼凑建起来的吗？美国规定，你出的那部分钱里面，美元必须占到一定比例，你自己的货币只能占一小部分，否则不接受。


    实际上联合国也一样，联合国会费你知道，我们中国也缴纳相当一笔会费，这笔钱所得是美元。所以你看，这么多国际组织收的和用的主要是美元，这对美元的中心地位当然是个很重要的支撑。


    还有，用美军来支持美元。怎么支持呢？比如美国和沙特有同盟关系，美军负责保护沙特，作为交换条件，沙特答应它的石油交易全部用美元结算。什么意思？沙特是世界第一大产油国，你想想沙特的石油卖多少？必须用美元，其他货币一概不认。沙特这么做还有一种带动效应，多数产油国也这么做，所以世界石油的交易主要都是用美元来结算的。这样一来大家当然离不开美元了。你看，美国的军事霸权和美元霸权就是这样连结起来的。


    最后一点，不能有替代货币。世界各国用美元，存美元不光是因为上面我讲的这些原因，还有一个关键因素是没有可替代的，其他的货币没那么可靠。一旦有另外一种货币大家也愿意用，愿意存，那美元的这种地位可能会迅速下滑。这是美国极力要防止的。上世纪80年代美国阻击日元，欧元起来以后全力阻击欧元，都是这个原因。现在在中国的人民币起来以后美国会怎么做，这就不用我说了。


    总之，上世纪70年代美元实现虚拟化以后，美国通过自己在国际制度、军事等领域的优势地位，成功地保证了美元的霸权，使美元成为美国影响世界最重要的工具之一。实际上，美国的霸权就和美元一样，就是由军事霸权、制度霸权和货币霸权这些支柱交互为表里，精心构建起来的。我们今天看美国的霸权地位，一定看到这一点。


    好，这一讲就讲到这里。下一讲就是说美国如何迎来霸权的巅峰时刻——打赢冷战。


    ## 30 | 美国怎么赢得冷战？


    徐弃郁·美国简史30讲


    前几讲说的是冷战爆发和冷战时期的事情。这一讲我就说一下冷战的结束。


    美国和苏联的那场冷战持续了四十多年，结束是在上世纪80年代末90年代初，离今天真的不远。冷战的胜负就不用多说了，苏联这个一度可以挑战美国霸权的超级大国解体，美国完胜。


    那美国为什么能赢呢？对这个问题曾经争论得很厉害。有人说是苏联犯了错误，也有人说是美国的体制更有活力，最后是实力获胜。这些观点有道理吗？都有。但他们忘了一点，冷战是美苏两个超级大国高强度竞争的过程，只要是高强度竞争，那战略就一定是关键因素。我这里就集中讲一下成功的战略怎么让美国最后胜出。


    ### 成功运用资源优势


    战略这个词你肯定经常听说，现在到处在用。但原先它只和战争有关，后来泛化了，基本上所有的对抗和竞争都用到了战略。那战略最核心的东西是什么呢？就是怎么运用自己的资源。


    你看冷战这个过程里面，美国的资源优势一直比较明显，从经济总量来说，苏联的顶峰时期也只有美国的60%，再看同盟，苏联的盟国基本上都是比较穷的，都要苏联援助。美国的盟友可是包括了世界上最富的两个部分，西欧和日本。1991年美国打伊拉克的时候，德国、日本这些盟国都是给美国钱的。这反差就很大了。


    那那种资源优势美国怎么运用呢？在四十年冷战里，美国运用资源的时候基本上保持了均衡，实际上还是二战的那个思路，追求总分，不追求单科成绩。比方说在国防投入上，美国基本上是经济产出的10%多一点，苏联是多少呢？达到30%以上，基本上是靠紧裤腰带。所以美国的这种运用方式，确保了它资源的增长性和可持续性，四十年下来，它的优势最后越来越明显。这就是美国战略的成功之处。


    但和怎么有效运用资源相关联，战略还有另外一个侧面，一般很容易被忽视。什么侧面呢？那就是怎么让对手错误地运用资源。你想，你是在和对手竞争，如果对手错误运用资源，运用资源的效率下降了，那不就相当于你更有效地利用资源了吗？这一点美国在冷战后期运用得非常好，当时叫做竞争战略，核心内容就是“强加成本”。你苏联资源少，和我竞争的成本高，那好，我强加给你更高的成本，时间一长你肯定受不了。


    ### 马歇尔的竞争战略


    讲到这个竞争战略，我就介绍一个人，安德鲁·马歇尔。这可不是美国二战时的那个五星上将马歇尔，而是美国国防部的一名官员，一开始是在美国著名的智库兰德公司工作，后来长期担任国防部净评估办公室主任，官不大，也很低调，但美国很多政策背后的主脑就是他，被称为“五角大楼的尤达大师”。就是电影《星球大战》里训练绝地武士的那个小个子。他93岁时退休，今年刚去世，97岁。这个安德鲁·马歇尔就是“强加成本”竞争战略的发明者。


    那他具体是怎么做的呢？


    我举个例子。他发现，苏联特别重视国土防空，但苏联那么大一个国家，建一个国土防空体系，包括各种雷达，各种防空导弹，再加上部队和指挥系统，消耗的资源可是相当大的。他就建议，美国的战略轰炸机要加快升级，不用多，哪怕只生产几十架，那苏联就不得不把整个防空体系都来一次更新换代，这样苏联的成本就远远高于美国。


    那现实是怎样的呢？后来事情的发展和安德鲁·马歇尔想的完全一样，美国新一代的战略轰炸机B1问世以后，苏联只能投入巨资把整个国土防空体系翻新一遍，要不然它的防空体系就落伍了。这个成本确实极其高昂。


    你看，这就是美国的竞争战略的思路——强加成本，迫使对手付出比你更高的成本。你要是对竞争战略或者安德鲁·马歇尔这个人感兴趣，我介绍你读一下《最后的武士》这本书，副标题是《安德鲁·马歇尔与美国现代国防战略的形成》，非常值得一看。


    那么这种强加成本还是在正常竞争的时候。那如果对手犯错误了怎么办？当然更要抓住机会，进一步加大对手的成本。


    苏联在上世纪70年代末就犯了一个战略性的错误——入侵阿富汗。从后来的史料看，苏联出兵的决策比较草率，苏共领导人勃列日涅夫和其他四位领导在别墅里一商量就定了，当时苏共总参谋部有很多反对意见，但都没听。苏军入侵以后，只用了两天就控制了阿富汗要害地点，但接下来就陷入了游击战的泥潭，和今天的美国人一样。


    那当时的美国怎么利用苏联的这个错误呢？


    首先当然是训练阿富汗游击队，就是那些所谓的圣战者，包括后来策划恐怖活动的本·拉登。再到后来，美国发现，阿富汗主要是山地，所以苏军在阿富汗的行动特别依赖直升机。美国就重点向阿富汗提供一种叫“毒刺”的肩扛式防空导弹，体积很小，一个人就能扛着发射，准确率又很高。第一批“毒刺”200枚运到阿富汗以后就击落了100多架苏军的直升机和固定翼飞机。你想，一枚“毒刺”导弹也就是5万美元，一架苏军直升机可要500多万美元，这是完全不对称的。美国人把提供“毒刺”导弹这件事叫做“放血行动”，也是强迫苏联付出更加高昂的成本。


    ### 本讲总结


    所以你看，美国这种竞争战略的核心就是直接或间接地增加对手的成本。这种做法是后来苏联支撑不住，最后崩溃的一个重要因素。这里你也可以看出，赢得竞争实际上有两种思路，一种是比对手更好地运用自己的资源，效率更高；另一种是迫使你的对手增加成本，降低效率。美国赢得冷战用的就是这两种思路。


