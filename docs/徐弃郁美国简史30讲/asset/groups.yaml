    # 14 | 国家的断裂和重铸：美国南北战争


    徐源 · 美国简史30讲


    这一讲我要说一段我们都很熟悉的历史，1861年~1865年的美国南北战争。战争过程不说了，有关南北战争的书很多，我推荐最重要也是最权威的一本——《美国内战回忆录》，这是战争的亲历者格兰特将军写的，美国文学家马克·吐温帮他出版。关于南北战争我要讲的问题有两个：


    - 第一，南北战争为什么爆发？

    - 第二，南北战争对美国意味着什么？


    ## 南北战争为什么爆发


    发先看第一个问题：南北战争为什么爆发？你可能觉得这还用说吗？书上早就告诉了我们答案，战争是为了解放黑奴啊。美国南方要保留奴隶制，北方要取消奴隶制，最后打起来了，林肯还发表了著名的《解放黑奴宣言》。这里我要告诉你，事实不是这样的。美国内战打了整整四年，最新统计阵亡七十五万人，美国在第一次世界大战和第二次世界大战中加起来的阵亡人数都没有这么多。这么大的一场战争，一定是为了一些特别重大的利益而战，不可能是为了解放黑奴。要知道在美国的北方，虽然没有奴隶制，但对黑人的歧视很强。


    那我们有些书上也说了，北方也是从利益出发才要解放黑奴的。因为美国北方的资本主义发展很快，需要更多的自由劳动力，所以要解放黑奴。这逻辑一听很顺，但也不是事实。因为美国北方不缺自由劳动力，有的是白人移民，黑奴解放以后美国工厂里的黑人工雇并没有增加多少。


    所以说，解放黑奴也好、废除奴隶制也好，它们和美国南北战争有关，但绝对不是这场战争的主要原因。那这么大、这么残酷的一场战争到底为了何而打？我先告诉你答案，第一是关税，第二是州权。


    ### 第一个原因：关税


    关税是怎么回事呢？这就要说一下美国南北差异了。早在独立的时候，美国南北方的差别就比较明显了：


    - 南方的气候和土壤条件适合发展农业，形成了以奴隶劳动为基础的大种植园经济；

    - 北方的条件不利于大规模农业，所以资本主义工商业比较发达。


    再往后，美国北方的工业进一步发展，南北差异更大。这时一个严重问题就出来了，那就是关税。北方工业发展起来以后，迫切需要一种高关税来保护，为什么呢？因为美国工业当时比不上欧洲，如果不把关税提高，那美国工业根本竞争不过欧洲，北方那些工厂可能永远没办法真正发展起来，永远只能做些小脚料。


    但南方要求的是低关税。南方经济的命脉是大规模种植棉花，这些棉花差不多90%出口到欧洲国家，特别是英国。那这些欧洲国家为什么要买美国南方的棉花，而不是在自己的殖民地，像印度这些地方生产棉花呢？这里面当然是有交换的：你美国关税低，欧洲工业品可以廉价卖到美国，所以你美国的棉花也可以廉价卖到欧洲。如果关税提高，欧洲对美国的棉花关税肯定也提高，那南方的棉花就根本卖不动了，经济马上就垮。


    说到这里你就清楚了，南北方在关税问题上的立场针锋相对，根子是双方经济需求没办法调和。那为什么这种矛盾就发展到没法收拾的地步了呢？答案是：西进运动。


    我前面两讲说了，西进运动是美国大步向西扩张，国家资源和能量都迅速积累起来。我这里还要补充一句，美国北方的力量增长得更快，不光人口增长得快，发展工业的动力也更足。所以南方要求的那种低关税越来越没办法维持了。原来南方觉得安慰的是，美国总统这个位子大多数时间是南方人来坐的，所以很多提高关税的议案最后在总统这里都被拦下了。但林肯当选的时候情况就完全变了，林肯反映的完全是北方的利益，反对奴隶制不说，而且坚决支持调高关税。你再看，实际上林肯上台后在废奴问题上很谨慎，但在关税问题上很坚决，一当总统马上批准调高关税。在南方看来，这就是要砸我们的饭碗。一家南方报纸就说“再在独立，我们都完蛋了。”所以你看，南方最后脱离联邦，关税问题就是一个比奴隶制更直接、更重大的原因。实际上就是经济原因。


    ### 第二个原因：州权


    它的根子更深。实际上从美国建国开始，各个州的权力和中央权力就是一对矛盾。我在第六讲的时候点过这个问题。美国宪法的关键就是把州和联邦之间的关系基本理顺，但是美国各个州很看重自己的权力。对于中央政府强加它法律法则的事特别忌讳，有的时候干脆不服从。


    而这种不服从的例子，最著名的就是杰斐逊的肯塔基决议案。这是怎么回事呢？美国联邦政府1798年的时候批准了四项严重违反人权的法案，引起全国上下一片反对。这个时候美国开国元勋杰斐逊代表肯塔基州发表了决议案，宣布拒绝服从这四项联邦法律。他的逻辑就是，宪法是州和中央之间的契约，如果中央的法律或行政命令违反了宪法，那么州就有权力否决中央。这就是著名的否决原则。当时，由于那四项法案很不得人心，所以很多人为杰斐逊的这个行动喝彩。但实际上这个否决原则包括了一种潜在逻辑：那就是把中央和州之间看成一种契约关系，如果中央不遵守契约，那么州也就不用遵守。这个逻辑你如果再往下推，那就是如果州认为契约已经失效，那么最终可以退出契约，也就是退出联邦。


    实际上到了南北战争前夕，南方各州就是从州权的角度来看待关税、奴隶制这些事情的。他们认为，归根到底就是你联邦层面上也就是中央的决定我们是不是都要遵守，我们南方这些州到底有没有权利保护自己的利益，有没有权利坚持自己的生活方式，我们的州权还有没有了。他们的逻辑实际上就是杰斐逊的逻辑；我觉得联邦的决议违宪，那么我就
    ro 毁执行，甚至干脆退出。最后南方各州退出联邦，援引的就是当年的肯塔基决议案。所以，南北战争爆发的最终落脚点，就是州权。


    ### 南北战争对美国的最大意义是什么


    好了，说清楚了第一个问题，第二个问题就好回答了。南北战争对美国的最大意义是什么？绝不是解放了400万黑奴，而是中央权力决定性地把州权压了下去。我再告诉你，在内战以前，美利坚合众国这个名词都是作为复数使用的，英文说“United
    States are”什么意思？它被看成是各州的集合。到内战以后，美利坚合众国英文从而作为单数使用了，英文都说“United States is”。再说林肯的功绩，你如果到华盛顿林肯纪念堂去看墙上的铭文，会发现美国人写得很清楚，说林肯是拯救了联邦的人，没有说他解放黑奴。


    所以从大宏观的角度来说，南北战争对美国的最大意义，就是实现了国家的真正一体化，美国庞大的资源从此可以更加集中统一地使用。除此之外，还有一点也很重要。这是美国第一次深度动员它的资源进行大规模战争，这一点你千万不要小看。在欧洲列强眼里，这是美国第一次作为一个强国出现，它的战争能力让所有国家印象深刻。


    所以内战结束以后，美国对待法国于涉墨西哥，就不是像门罗宣言的时候搞搞外交声明了，而是让还没解散的部队南下，集结在墨西哥边境。结果法国马上回去了。对英国，美国也第一次有底气了。美国说，英国在南北战争期间帮助南方突破北方设置的海上封锁线，这个损失要赔偿。最后经过裁决，英国政府赔了美国1550万美元。这说明什么，说明美国已经和当时最强大的国家开始平起平坐。


    最后我还要补充一点，南北战争实现了美国的真正一体化，从经济上看，它为美国的工业化创造了良好条件。所以南北战争以后，美国工业化也进入了快车道。这也是下一讲要说的问题，美国的工业化。


    ## 划重点


    - 1. 南北战争爆发主要原因不是解放黑奴，而是关税和州权；

    - 2. 南北战争实现了美国的真正一体化，从经济上看，它为美国的工业化创造了良好条件。


    # 15 | 美国工业如何实现赶超？


    徐尧郁 · 美国简史30讲


    前面的三个模块，我们主要从政治角度来观察美国的生长演化——那就是它怎样变成现在这样一个版图，现在这样一种政治结构。从这一讲开始，我们要进入第四个模块——赶超，聚焦美国的经济和社会如何一步步崛起。首先要看的，当然是美国的工业化。


    ## “美国奇迹”的原因


    美国的工业化道路，有人说是百年，有人说是80年。但美国工业真正发力实现赶超，实际上是在内战结束以后到第一次世界大战。美国赶超的速度和幅度，我就举当时两个标志性的产品。哪两个产品？煤和钢铁。当时英国是霸主，工业水平独步天下，美国在南北战争结束的时候煤炭产量不到英国的10%，钢铁产量不到30%。但过了40年，美国的煤炭产量超过英国50%，钢产量更过分了，是英国的5倍，超过了欧洲列强的总和。用英国历史学家泰勒的话来说，这些数据本身就表明，传统意义上的欧洲政治已经终结，美国具备了当今世界霸主的实力。


    所以你也可以理解，为什么美国的工业化又被很多人称为“美国奇迹”。问题是，美国是怎么实现这种奇迹的呢？这个问题有这么几种现成的答案：


    - 第一，教育说。就是美国教育水平高，所以工业化快；

    - 第二，铁路说。美国当时修建了几条横贯大陆的铁路，这个你肯定知道，我们中国华工在里面发挥了很大作用。这个铁路建设太关键了，一方面拉动了工业需求，另一方面形成了一个统一的国内市场；

    - 第三，关税说。这个问题实际上我们上一讲说过。美国南北战争爆发最直接的原因实际上就是关税，结果阻拦高关税的南方被打败。这下美国的平均关税从战前不到20%，战后一下子提到48%以上。这种高关税保护了美国的工业，这样工业才迅速发展起来；

    - 第四，资源说。美国的自然资源太丰富了，工业化的条件很好；

    - 第五，制度说。美国走法治道路，契约环境非常好。


    那上面这些说法对不对呢？应该说都没错，每一条都是成立的。但是我也要告诉你，这些都不是美国工业奇迹最核心的原因。美国工业奇迹最核心的原因是第二次工业革命。美国的成功不光在于它抓住了这次机遇，而且在于它抓住机遇的方式和路径。


    ## 第二次工业革命中的美国路径


    为什么这么说呢？我们简单看一看第二次工业革命。第二次工业革命和第一次工业革命不一样，它不是靠几个工人搞发明创造启动起来的，而是系统的科学研究在前面引领，然后产生技术发明，然后工业发展，它的标志就是钢铁、化工、电气这些新兴产业。那么谁在第二次工业革命中表现最突出？两个国家，美国和德国。这两个国家都可以说抓住了第二次工业革命的机遇，以前所未有的速度实现了赶超。但你要注意，美国和德国抓住机遇的方式和路径很不一样。


    德国的路径是突出科研和技术，最后它的工业革命体现出一种纵深发展的特点，越是高端的，德国做得越好。美国就不一样。它工业革命的特点不是向纵深，而是向横宽发展。换句话说，美国工业整体上不追求质量最优，而是在保证次优的情况下，把大量精力花在规模效应上。为什么走这种路径呢？正好发挥美国的资源优势啊。美国大量的移民，洲际规模的土地，再加上丰富的自然资源，如果它走德国那种精深的路子，那相当于白白拿了一手好牌。


    以钢铁为例，美国钢铁生产有自己的独创，但平心而论，它的质量并不是世界上最好的，比不上德国克卢伯公司。但是美国钢铁工业在布局、生产流程这些方面特别注意，实际上把半个大陆当成一个棋盘在设计，经济学家里说的规模效应一下子就起来了。美国钢铁大王安德鲁·卡内基把这个问题说得最形象。这个人我后面一讲还要讲。他说：“从苏必利尔湖（就是美国和加拿大之间的五大湖之一）开采两磅铁矿石，运到900英里以外的匹兹堡；再开采一磅半煤，炼成焦炭；还要开采半磅石灰石；还要在弗吉尼亚开采少量锰矿，这些都运到匹兹堡。用这四磅原料才能炼成一磅钢。那这磅钢消费者要花多少钱呢？只要一分钱。”这是什么？这就是规模效应，美国工业革命把它推到了一个前所未有的高度。


    听到这里你可能会问，那美国具体是怎么实现这种规模效应的呢？我讲两个典型的美国例子。


    ### 第一个是标准件生产。


    美国发明家惠特尼接到政府订单要生产大批枪支，但时间根本来不及，怎么办？他直接把生产流程改了，不是一支一支地造，而是先造出大批统一标准的零件，然后再组装。这样一来，整体的生产时间缩短了一半还不止。这个事情你肯定听说过，但是它内在的东西到底是什么？实际上就是把生产过程作为一个大系统，把里面所有要素，包括人工、原料、时间进行重新组合配置，从而改变了系统的投入产出比。所以它内在的东西就是一种系统性思路。


    ### 第二个是汽车大王福特发明了装配线，就是通过精确量化，把汽车的组装变成一种非常完备的流水作业。


    这是什么？这实际上也是系统优化，福特把汽车生产过程当成一个完整系统，把里面要素的组织形式改变了，结果投入没有变，但产出完全不一样。说到这里你就明白了，美国工业之所以在规模化方面做得特别好，背后的秘密就是它这种系统性思维。几乎所有的美国工业产业，都是这样。我再告诉你，实际情况今天的美国也一样。


    比如说美国的全球定位系统GPS，由24颗卫星组成。这套系统对美国来说太重要了，要知道美国军打仗主要靠它。那这套系统美国是怎么建的呢？十几年前，我听北约军事委员会前秘书长讲过一堂课，是个德国上将。他说美国建GPS的时候和欧洲国家的思路不一样，欧洲国家的思路是我先建个局部系统，局部做好以后再把它扩展成一个大系统，实际上属于渐加扩展。美国可不是这样，它一上来就做全球系统，然后哪里不足再修补哪里。那结果怎么样呢？那个德国上将说，事实证明美国的这种方式看起来好像一下子投入很多，但你从全过程来看，它总投入反而要更少，而且更有效。这是什么呢？这是把全过程和全要素纳入到一个整体，从而降低成本，实际上也是系统思维的一种体现。


    ## 本讲总结


    讲到这里就可以作一个总结了。美国那种注重规模效应，体现系统思维的工业化路径，不仅抓住了第二次工业革命的机遇，而且把自己的资源优势充分发挥出来，使美国工业快速赶超英国并在世界上独占鳌头。所以，我们一般只讲抓住机遇，但实际上抓机遇的方式同样重要。因为这才是你能不能把手里的好牌打好的关键。


    好了，美国的工业赶超就讲到这里。下一讲我们要讲到美国工业赶超过程中一个非常有争议的事情，那就是垄断。


    ### 划重点


    1. 美国工业奇迹最核心的原因是第二次工业革命，美国的成功不光在于它抓住了这次机遇，而且在于它抓住机遇的方式和路径；

    2. 我们一般只讲抓住机遇，但实际上抓机遇的方式同样重要，因为这才是你能不能把手里的好牌打好的关键。

