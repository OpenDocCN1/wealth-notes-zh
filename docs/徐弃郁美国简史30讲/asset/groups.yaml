    # 27 | 美苏冷战是怎么爆发的？


    徐尧郁·美国简史30讲


    27 | 美苏冷战是怎么爆发...


    上一讲我说了美国二战以后取得世界霸权地位。但是霸权不意味着美国就可以号令天下。二战胜利两年以后，苏联和美国就从盟友关系进入一种全面的敌对。这种对抗不是战争，但和战争一样，双方是明显的敌我关系，你死我活，所以叫做冷战。从历史和现实的角度来看，冷战都是特别重要的，它持续了40年，直接影响到今天的世界。而冷战爆发的原因更是关键，大国竞争的逻辑，美国霸权的战略考虑，都在这里。我这一讲说的就是这个问题。


    # 冷战为什么产生？


    先说一下美国人自己是怎么看冷战爆发的。美国学界对这个问题特别重视，主要有三种看法。哪三种呢？


    +   - 第一，正统派，认为是苏联挑起冷战；

    - 第二，修正派，认为是美国挑起冷战；

    - 第三，后修正派，认为冷战不是哪一方挑起的，而是在美苏互动当中发生的。


    我们这里不搞学术探讨，关于冷战起源你了解有这么三派就可以了。我要告诉你的，和这三派都一样。


    # 冷战为什么产生？关键原因是：有需求。


    美苏两个国家在意识形态、价值观上完全相反，二战中的盟友关系其实让它们都不舒服，都需要后退一步，需要一种对立。为什么这么说？


    # 美苏都需要冷战


    我们先说苏联的情况。苏联主要发展重工业，老百姓的生活水平很低，但它是一个严格封闭的国家，老百姓不知道外面究竟是怎么样的，所以整体是平稳的。但战争时期就不一样了，几百万的苏联军人打出国门以后，发现外国的生活水平比自己国家的高多了，而且越往西打，老百姓过得越好。这就和苏联国内宣传的完全不一样，一些人在寄回家书信里面都写到了这种反差。


    苏军总政治局认为，这苗头太危险，这是动摇思想信念的。所以给中央专门写了报告，用的词很意思，警惕部队“十二月党人思潮”。什么是十二月党人？那就是俄国打败拿破仑以后，在巴黎的驻军。结果这些占领军反而受到法国民主思想的影响，回家要推翻沙皇统治，最后当然失败。这帮人就是十二月党人。苏军总政治局就拿这个来比喻当时苏军的这种苗头，严厉程度可想而知。我再告诉你，这个报告的时间是1945年2月，战争还在进行中，离苏军攻克柏林还有3个月。所以你就可以理解，苏联在战争结束以后，绝对是需要一场对立，来
    안전한内部。


    那美国的情况呢？实际上也一样。上一讲我说到美国重新设计世界，它是要尽可能地取得其他大国的支持。但它也发现苏联是一个完全异质的存在，要把它圈进来很困难。


    有人说罗斯福在拉拢苏联方面很成功，后来因为罗斯福去世了，美苏矛盾才尖锐化的。这可不是事实。罗斯福本人在去世前几周就说，斯大林对我作的承诺基本上每一项都违反了。等罗斯福去世，杜鲁门当总统以后，赶紧就说“我已经尽偕了拉拢苏联人”。这些话说明什么？说明美国发现，苏联不可能完全被圈到自己设计的那个体系里面。这时美国就有两种选择：


    +   - 一种是继续保持关系，但你设计的那套体系就要打折扣了，换句话说，霸权地位也要打折扣；

    - 另一种是干脆和苏联决裂，保持那套体系的完整性。


    这里就要说到一个关键人物，乔治·凯南。这个人物在美国外交史上的地位可太重要了，是必须记住的。凯南当时是美国驻苏联使馆的外交官，1946年2月，他给国内写了一封8000字的长电报。你想，一封电报写8000字，这本身就够特殊了。而长电报的内容更加特殊。写了什么呢？他第一次把意识形态差异放到了一个特别高的位置，说苏联的意识形态和美国的完全不一样，它是要不断扩张的。那美国应该怎么对付这种扩张？凯南说，美国不要和苏联打仗，而是要实行一种遏制战略，把苏联的影响限制在它自己的势力范围里面，同时把美国主导的国际体系建设得非常稳固，非常强大。这样的话苏联迟早会垮。


    对美国政府来说，这封电报可真是起到了统一思想的作用。很快，美国的选择就清晰化了，那就是干脆和苏联决裂，然后利用这种决裂带来的自由度，专心整固自己的阵营。到达封电报发出的第二年，冷战正式开始。


    这就是我说的，冷战爆发是因为双方都有对抗的需求。


    # 冷战对美国的好处


    我接下来还要说一点，这种对抗对美国的霸权来说是很有好处的。


    我们一般会觉得，对抗是一种消耗，对一个国家来说是不利的。但是对当时的美国来说，和苏联这种全方位的对抗正好提供了一种最佳的外部压力。为什么说最佳呢？因为如果压力太大，要一个国家勒紧裤腰带，钢铁卖铁地去干，那会损害它长远的发展。而对美国来说，苏联实力没那么强，这个敌人产生的压力正好把美国的潜能持续地激发出来。


    就好比自然界一样，有适度的外部压力和刺激，某个生物种群的发育质量会更好。我举个例子，科技。我们都知道美国尖端科技世界第一，但我告诉你，冷战在这里起了很大作用，促使美国在国家层面上用跨学科的模式组织它的科技力量，并且进行史无前例的大规模投入。像载人航天，包括互联网这些事情，都是美国在冷战的背景下搞出来的。


    另外，冷战对美国设计的战后国际体系也有好处。冷战期间，追随美国的国家要远多于追随苏联的国家。这么多的国家为什么追随美国，按照它的规则行事？


    +   - 一方面，就像我上一讲说的，美国设计的体系是一种“开放的私自自利”，为美国利益服务但大家都能好处；

    - 另一方面，冷战也很重要，像西欧国家和美国关系那么紧密，很重要的一个原因就是西欧国家害怕苏联，所以一定要拉住美国。


    那美国和盟国发生利益冲突怎么办？放心，冷战的压力使它们能够非常理智地处理问题，它们之间的矛盾再大也是次要矛盾，和苏联的矛盾再小也是主要矛盾。实际上，当年我们中华人民共和国能和美国走到一起，也是因为冷战的存在。所以你看，美国主导的国际体系就像一个大系统，冷战正好给这个系统源源不断的外在动力，让里面的各个部分紧密协作，共同把这个大系统维护下去。


    听到这里你就明白了，为什么说冷战对美国作为一个超级大国的演化至关重要。我再插一句，也就是从冷战开始，美国这个国家一直需要一个外部对手，这样它就有一个很清晰的目标和对手，很容易就把国内社会动员起来，把它的盟友体系动员起来。要知道，冷战结束以后，美国不少专家都认为，美国后来碰到那么多问题，根源就在失去明确的对手。


    当然这些是后话，冷战爆发这一讲到这里基本上讲完了。我想，在中美关系今天的这种状态下，作为中国人需要了解一下当年冷战是怎么爆发的，好做到心中有数。


    # 本讲推荐书目


    如果你想深入了解冷战的话，我推荐一本书，即鲁大学加迪斯教授写的《长和平安》。这是目前研究冷战写得最经典的书，没有之一。


    划重点


    +   1. 冷战爆发是因为苏联和美国都有对抗的需求；

    2. 冷战让美国持续把自己的潜能激发出来，而且对美国设计的战后国际体系也有好处；

    3. 美国主导的国际体系就像一个大系统，冷战正好给这个系统源源不断的外在动力，让里面的各个部分紧密合作，共同把这个大系统维护下去。'
