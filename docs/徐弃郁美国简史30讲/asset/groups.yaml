    # 13 | 为什么说西进运动塑造了美国精神？


    徐奔郁 · 美国简史30讲


    只要接触过美国的人，不管他喜不喜欢，都会承认美国有一种独特的精神气质。比如说，开拓性，爱冒险，不安分，等等，这些词不光让你联想到美国人，也联想到美国这个国家。历史上，美国从十三个殖民地升级成一个国家，再从国家升级成大国，再升级成超级大国，这条演进的路线可不光是一种有形的、物质的演进，它的内核是一种大国精神底层的锻造。那在这个演化过程当中，如果我们要找一个阶段，说就在这段时间美国作为一个大国的精神真正定型。那这个阶段一定就是西进运动。这一讲我们就要讲西进对美国精神的塑造。


    ## 美国精神：开拓精神和武力倾向


    我先说一下美国精神当中一些非常显性的部分：


    ### 1. 开拓精神


    美国从一开始就是个移民国家，移民都是背井离乡，克服重重困难，在大西洋上漂几个月才来到美洲，开拓性基本上已经相当他基因的组成部分了。到西进运动的时候，无数拓荒者带着家小和全部的家当，一般就是几辆大篷车，跑到西部荒野里去开垦。这条件是非常艰苦的，可以说只有最顽强、最强悍的人才能够生存下来。所以美国精神当中这种开拓性又得到了进一步的打磨。


    ### 2. 武力倾向


    美国有一个事情让全世界都有点不可理解，那就是个人合法拥枪，而且还写进了宪法。实际上，这和美利坚民族整体的武力倾向是有关系的。你想，移民在美洲开拓殖民地的时候，经常会和印第安人起冲突，所以基本上家家有枪。而在西进的过程中，很可能几百公里都没有人烟，那些拓荒者遇上危险唯一指望得上的也是自己身边的枪。所以枪文化和遇事以武力解决的倾向实际上是融合在一起的，这在西进运动当中又得到了决定性的强化。一直到今天，曾经有一位美军上校告诉我，美国典型的好公民是什么样的人？就是邻居家遭到歹徒抢劫，他二话不说把墙上的枪拿下来就去帮着打，这是好公民。如果看到有人干坏事就打911报警，那这种人算不上好公民。那么这种武力倾向，我强调一下，也是因为西进运动的强化。


    ## 西进运动的深层影响


    不过，上面我讲的这些还只是显性的、或者说表层的部分，西进运动对美国精神的影响实际上要深得多。1893年的时候，有一位32岁的历史学家弗里德里克·特纳发表了一篇论文，叫《边疆在美国历史上的意义》。这篇文章不仅当时就引起轰动，而且可以说是美国历史学界从建国到今天影响最大的一篇论文。所以弗里德里克·特纳这个名字你一定要记住。


    那这篇论文主要说的是什么呢？它说啊，美国存在着一条不断向西移动的边疆线。我插一句，这个边疆，英语叫Frontier。它可不是我们平时说的国家边界，而是美国人不断向西拓殖、定居、开垦形成的原始土地和已开垦土地之间的条条界线。特纳就说，随着拓荒者不断往西去，这条边疆线不断向西移动，这一点对美国来说太重要了，使美国有了一种和别国完全不同的历史经历。为什么呢？因为别的国家都是从简单到复杂，从原始到文明这样一种线性的发展路线，但美国不是这样。特纳说，由于这条边疆线不断向西部移动，所以美国会与原始的简单状态不断接触，周而复始。用他话来说，这就是美国生活的流动性。是一种不断重生的过程。美国的特性就是在这个过程中完成的。


    那特纳为什么要强调美国特性呢？原因很简单，美国的政治文化基因主要来自欧洲，特别是英国，所以在独立战争之后，很多美国人还是把自己看成是欧洲人。但是西进运动开始以后就越来越不一样了。特纳就说，美国人正是在不断向西拓殖的过程中，原来的欧洲渊源变得越来越远，越来越淡。西部的原始环境把比较矫饰的欧洲特性打磨掉了，变成了更加简单、实用、富有活力的美国特性。他论文里有很生动的几句话：“西部的荒野主宰着拓荒者。荒野发现拓荒者正在穿着，行业，工具，交通方式和思想上都是一个欧洲人。它把他从火车里拉出来，放在桦木做的独木船里，把他文明的衣服扯掉，换上猎装和莫卡辛软皮鞋。”所以他就指出，来自欧洲不同国家的移民正在西进过程中脱胎换骨，而且相互融合，变成了真正的美国人。应该说，特纳的这种论述非常到位，不用我多解释了。


    ## 西进运动修正美国式民主政治


    但是，美国作为一个大国的底层精神还包括一个特别重要的部分，那就是美国的民主政治。西进运动对美国精神最核心的影响，可能还是在这里。为什么这么说呢？美国独立建国以后就建立了一整套民主政治制度，但是当时的这种制度的精英主义色彩非常重。美国的开国元勋们，特别是像汉密尔顿这些人，对于草根阶层根本不信任。更重要的是，国家的政治权力实际上是被精英阶层垄断的。但是，随着西进运动的开展，情况就样了。为什么？首先是，越来越多普通人在西部获得自己的土地，这样一来人的平等意识当然就加强了。而且，西部地广人稀，什么东西基本上都靠自己，所以对个人自由特别在意，对所有的外来管制都很反感。在这种情况下，美国人越是往西拓殖，原来那种精英主义的民主就越让人生厌。这种力量大到一定程度，就开始修正美国式民主政治了。


    讲到这里，我要说一个很重要的概念——杰克逊民主。杰克逊我在第九讲第二次美英战争中提到过，就是当时美国人打的最漂亮的一仗——新奥尔良大捷的指挥官安德鲁·杰克逊。这个人来自边疆地区，平民出身，最后当选为美国第7任总统。要知道，之前美国的总统都是名门望族，从华盛顿到亚当斯，都是家里有大产业的社会名流。杰克逊是美国第一个出身低微的总统。所以他的当选本身就很有象征意义。


    杰克逊当了总统以后就号称自己是人民的总统，重点改革美国政治体制里面那些精英主义的东西。最出名的，就是他改革了美国政府的职务任免制度。以前美国的政府官职基本上都由精英阶层垄断，杰克逊就实行了官职轮换制，什么意思呢？就是政府职务必须及时轮换，而且要向草根阶层开放。另外以前美国人选举的时候，投票权是要以财产权为前提条件的，你的财产得达到最低标准才有资格投票。那么在杰克逊当总统期间，这种做法基本上被废除。这样一来，更多的民众可以投票，美国民主政治的代表性也扩大了。


    所以你看，杰克逊民主实际上是美国民主政治框架中，草根阶层对精英阶层的平衡。而且我告诉你，随着美国西部被不断开发，西部的政治家也越来越多地进入中央政府，像林肯这些人都是来自西部。所以这种草根阶层平衡精英阶层的趋势也延续了下去，美国的民主制度实际上完成了一次升级换代。


    我们不要忘了，这些都是西进运动带来的。


    ## 划重点


    - 1. 美国精神的真正定型是在西进运动，这个过程不光是一种有形的、物质的演进，更是一种大国精神底层的锻造；

    - 2. 西进运动让来自欧洲不同国家的移民在过程中脱胎换骨，而且相互融合，变成了真正的美国人。


