    # 01 | 五月花号公约：美国的政治基因


    徐亦郁·美国简史30讲


    01 | 五月花号公约：美国的。


    这一讲开始我们进入第一模块。


    我们都知道美国历史不长，1783年独立建国到现在也就*是*200多年。但问题是，在它独立之前，作为英国殖民地的历史有100多年。这100多年你可别小看，它相当于美国历史的前传，美国很多精神底层的东西就是从那个时候来的。第一模块就把这段前传部分发掘出来，分别说一下它的三个基因。这一讲就说它的民主政治基因。


    # “五月花号”和美式民主政治的起源


    今天我们看美国，很明确它*是*世界第一强国。但是从历史时段来看，美国最引人注目的地方，是它的民主政治。这可不光是对我们中国人，对*整*个西方世界来说，美国民主政治也是一种突然的出现。


    这种源头，或者说国家的政治基因，可以一直追溯到北美殖民地刚开始创立的时候，它浓缩在一份文件里面，叫《五月花号公约》。这份文件重要到什么程度？美国历史学家干脆把它称*为*美国的“出生证明”。


    但你要从时间上看，美洲第一块英国殖民地弗吉尼亚可是比它早了整整13年，那为什么把这个晚了这么多年的公约叫做出生证呢？


    # 第一个特别之处是船上的人不一样。


    # 第二个特别之处是行为不一样。


    # 第三个特别之处就是公约的政治性。


    # 一纸公约怎么就能起作用？


    # 推荐书目


    这里我介绍一本美国人写的书，书名就叫《五月花号》。这本书写的就是从“五月花号”船靠岸一直到美国立国这一段被很多历史书忽略的一百年，里面介绍了很多鲜为人知的历史，很有意思，值得一看。我这里要跟你说的，实际上只是这书的序言，它*的*标题非常有意思：美国立国是“一连串的小事件”。这个标题太精准了。就是这样一次又一次的加强，小事件变成小趋势，小趋势带来了大趋势，最后影响了历史，也创造了历史。


    # 本讲交流议题


    好，这一讲的最后，我还想给你留一个思考题：今天你看到的美国，有没有哪些地方体现《五月花号公约》的精神？欢迎你在留言区分享你的看法。


    划重点


    1.《五月花号公约》是美国的“出生证明”，也是美国政治的核心算法，后来美国的政治理念和政治建构都发端于它。


    ![](img/59f5ba9b398693888f2b18786788af0c_1_0.png)'
