    # 18 | 应对赶超带来的问题：美国式反腐


    徐奔郁 · 美囯简史30讲


    腐败和反腐在今天的中国还是一个重要话题。美国在19世纪下半期的赶超阶段，也经历了持续的反腐，整个社会都卷了进来。作为这个模块的最后一讲，我来说一下美国当年是怎么反腐的。


    # 美国的腐败问题


    我前面说过，内战以后到19世纪末是美国的大赶超时期。但物质为量为高歌猛进的同时，整个社会层面士上出现了严重问题。马克·吐温写过一本书，叫《镀金时代》。现在故美国史很多人就用这个名字来形容当时的美国，表面上看金光闪闪很耀眼，实际上只是镀了一层金，里面的东西又腐朽又浅薄。尤其是，美国当时的腐败非常严重。我不展开说了，这里就说一个典型案例——特威德腐败案。


    特威德是当时一个政客，当选美国国会议员和纽约州议员。这个人能量很大，基本上控制了整个纽约市，人称“特威德老板”。他不光贪腐的金额特别巨大，在手段上也是无法无天。比如他主导的纽约法院大楼建造工程，一开始的报价是25万美
    元，结果完工的时候一算造价居然达到1000多万美 元。


    你可能听到这数字没什么概念，我就告诉你，就在差不多同一时期，美国从俄罗斯手里买下整个阿拉斯加，只花了720万美 元，不到这座大楼造价的一半。你再看里面的各种名目的假账就更让人匪夷所思了：账上说花了多少钱买椅子，后来一算如果真花这么多钱买椅子的话，那把这些椅子连在一起可以排成17英里长，这就太离谱了。还有更离谱的，他的账本上说是工程雇了一个木匠，账本上居然写着付他一个月36万美
    元，相当于今天的500万美 元。所以这笔1000多万美 元的工程款其实大部 分都被特威德和他同伙转走了。


    # 从腐败到清廉


    一般历史学家要谈这个问题，首先会指出美国反腐的大背景。那就是进步主义运动，这个运动很重要，但也很复杂，你记住一点就行，在效率和公平之间，进步主义运动更强调公平，推动社会改革。对于反腐来说，这个大背景当然很重要。但它充其量只是提供了一种氛围和环境，美国式反腐的关键在别的地方。


    比如媒体作用就很重要。在美国媒体的独立性很强，很多腐败案的内幕都是由媒体曝光的。像刚才讲的特威德案件，就是著名的《纽约时报》报道出来的，并且拒绝了一大笔封口费。除了这种大报以外，还有很多廉价的小刊物也在发布各种腐败和社会丑闻。当时西奥多·罗斯福总统很重视它们，给予了一个专门的名字，叫“黑幕揭发者”。这些黑幕揭发者在美国反腐过程当中，可以说立了大功。


    但是，最关键的还不是这个。你想，腐败是什么？从根本上说腐败就是把公权力用于私利，我们今天讲的权力寻租，权钱交易，都是公权私用。所以美国的腐败和其他国家一样，根子都是公权力运用上出了问题。这就说到当时美国的一种政治制度，就是政治分肥，也叫政治分赃。这是怎么样回事呢？美国刚立国的时候，像华盛顿这些人都坚持从名门望族中选拔政府官员，但这样的话精英阶层就斧断了政治权力，美国人觉得不符合美国民主政治的价值观。


    > 在一个复杂的组织系统当中，单一目标的实现往往要和实现系统目标结合起来。'
