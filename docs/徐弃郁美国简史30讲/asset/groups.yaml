    # 28 | 斯皮克曼和美国地缘战略


    徐中约 • 美国简史30讲


    我们今天看美国的时候，总觉得它有些做法不大好理解。比如说它的军队主要不是驻扎在国内，而是一直把大部队摆到别人家门口。很多人就解释说，这是因为美国霸道。但实际上可不是这么简单。


    # 美国的地缘政治思想


    要知道，以前美国可不是这样的。我前面讲过，美国在很长时间里都奉行孤立主义，不与其他国家结盟。第一次世界大战，美国派兵到欧洲打仗，仗打完又撤回去了，没有任何国家结盟。那第二次世界大战美国刚刚参战的时候，罗斯福也告诉邱吉尔，说打完仗我们就要把美国的孩子们都带回家。


    但是二战真正结束以后，美国的做法变了，变成现在这个样子，到处结盟，而且把大部队一直摆到别人家门口。这种变化的背后，实际上是一种深层理念的改变。起作用最大的，就是美国的地缘政治思想。


    地缘政治这个词你肯定听说过。那它到底是什么意思呢？它的核心观念就是认为国家所有的政治行为都是在一特定地理空间中发生的，所以国家行为和它的地理环境之间有一种密切的相关性。那你考虑国家战略的时候，首先就要从地里角度来思考。这就是地缘政治思想。


    # 第一，美国在地理上的弱势。


    # 第二，边缘地带。


    # 第三，美国必须保持介入边缘地带的事情。


    # 美国如何介入边缘地带


    # 本讲总结


    说到这里你也就清楚了，今天美国这种军事态势是怎么来的，它背后的考虑到底是什么。当然了，如果我们抛开历史，抛开美国这种特定的霸权，斯皮克曼这种边缘地带的地理政治思想还有另外一种启示。那就是，在你觉得拥有得天独厚的优势的时候，如果换一个方向去考虑，可能会对自己的优势劣势作出完全不一样的评判。就好像美国的地理位置一样，在斯皮克曼的视角里面，就不完全是优势了，而是包含了重大的劣势，必须纠正。'
