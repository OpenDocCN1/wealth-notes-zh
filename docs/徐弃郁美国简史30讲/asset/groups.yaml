    # 24｜第一次设计世界：威尔逊的“十四点”


    徐弃郁·美团简史30讲


    24｜第一次设计世界：威…


    我们今天看美国电影，会发现超级英雄拯救世界这类题材经久不衰，主角可以是超人、蜘蛛侠、钢铁侠，或者是美国队长。

    全世界最喜欢拍这类电影的就是美国。你可不要小看，这实际上折射出美国一种精神层底的东西，那就是美国对这个世界负荷特殊使命，注重要负责领导地位。这种理念扎根在美国的基督教基因里面，这我在前面第二讲专门讲过。你可以想象，如果一个国家的精神层底里有这种理念，那么当自己有了足够的实力，外部又有机会的时候，那一定会向世界领导权发起一次爆发式的冲击。这一次讲要说的就是这样一次冲击——威尔逊的“十四点”方案。


    # 威尔逊和《世界和平纲领》


    你如果看一些历史著作，会发现历史学家一般对“十四点”方案都特别重视，认为它是有划时代意义的。那它到底是什么呢？就是第一次世界大战结束之前，美国总统威尔逊发出的一份和平方案，真正的题目叫《世界和平纲领》，因为包含了十四点内容，所以被称为“十四点”方案。


    那它为什么这么重要呢？我们说一般和平方案就是讲怎么结束战争，哪几个谈判条件。但威尔逊的“十四点”方案可不光是讲怎么结束战争，它实际上宣布了一套新的国际规则，意思是你们几百年来的那套东西都是错的，大家现在要按我说的这些来做。这是什么？这是重新设计世界。


    那么这个世界应该是什么样的呢？有这么三个关键点——


    +   第一，不能再搞秘密外交，所有协约必须公开，这样罪恶的东西就藏不住了；

    第二，民族自决，就是民族要按自己的意愿来治理自己，其他大国的统治不能强加于它们；

    第三，建立一个国际联盟，国家不分大小都要保证它们的独立和领土完整。


    所以你看，它是一种“对还是不对”的道德主义思路，而不是老欧洲那种“有效还是无效”的现实主义思路，美国精神层底的那种基督教伦理表达到非常明显。这就是为什么“十四点”方案在历史上的地位那么特殊。


    从另外一个角度说，美国抛出“十四点”方案本身也说明它有底气。关于这个底气我们以前是这么解释的，就是第一次世界大战爆发以后，原来作为世界中心的欧洲打得元气大伤，而美国一开始3年不参战，大发战争横财，从战前的债务国，变成了债权国，像英法这些原来的债主现在反而欠美国的钱。这些当然是事实，而且美国的战争财发得的确不小。比如美国军火出口增加了100多倍，其他的商品出口也都至少翻番，最后算下来美国总的贸易顺差在3年时间里增长了3倍多。


    但我也要告诉你，横财从来不可能是决定性的，个人是这样，国家也是这样。美国有底气的真正原因是它通过战争完成了实力的兑换。为什么这么说呢？你想，美国的经济实力20年前就已经是世界第一，但没人知道这些经济实力能不能转化成军事力量。所以只是潜力，而不是实力。


    德国当时一位高层人士就说根本不用怕美国，为什么呢？他的话很有戏剧性，说美国“军事上等于零，除了零还是零”。但是美国真的参战以后，动员能力完全超出大家的想象。它一开始只有20多万军队，但几十个月的时间内，光是运到欧洲的美军就已经超过了200万，海军规模也超过了英国，成为世界第一。


    更重要的是，在当时双方打得筋疲力尽的情况下，美国这样一个超级码头投入，战争结果一下子就决定了。这说明，美国已经成了大国之间当时不让的仲裁人，它的大国崛起进程到了一个爆发点。这个才是它真正的底气。


    # “十四点”方案为什么失败?


    好了，美国这么有底气，推出这么一个划时代的和平方案，结果怎么样呢？一开始全世界轰动，这么道德主义的和平方案大家也是第一次见，所以很多人把“十四点”方案看成福音一样，把威尔逊本人更是看成救世主。


    我告诉你，就在我们中国，北京各高校的学生跑到美国使馆前去游行，喊的口号是什么？是“威尔逊总统万岁！”陈独秀在杂志的发刊词里写：美国总统威尔逊可算是现在世界上第一个好人。其实在欧洲也一样，有些农村里，农民居然把威尔逊的画像挂起来，每天对画像膜拜。这种轰动效应用今天的话来说都有些魔幻了。


    当然，热闹过后，“十四点”方案后来的命运你肯定知道，失败。美国这次也没能当上世界领袖。为什么会是这样一个结果，后来的历史学家吵得很厉害。我这里只讲关键原因。


    # 最关键的是，世界格局的权力转移还没完成。欧洲原来是中心，后来虽然美国的实力变成熟界第一，但实力兑换成影响力是有滞后效应的，美国和欧洲在影响力方面的差距当时还没有拉开。这个时候美国就要设计世界，特别是触及到了欧洲国家核心利益的时候，那反对力量一定特别大。


    我举个例子，“十四点”方案里面第二条就是公海在战时和平时候都要保持绝对开放。这就直接触碰了大英帝国的底线，为什么？因为大英帝国的基酒就是制海权，如果公海完全自由那还要制海权干嘛？要知道，第一次世界大战之所以德国最后耗尽力量，是因为英国海军牢牢封锁着海洋，德国连粮食都运不进来，只能集体挨饿。所以英国强烈反对。大英帝国到这时虽然已经不如美国了，但差距还没那么大，所以美国只能后退。“十四点”方案里最先放弃的就是这一条。这就是世界权力转移还没有完成。


    # 第二个原因，美国还没有做好准备。美国参战的时候，威尔逊的道德主义大旗很管用，一下子激发了美国那种基督教普世情怀，但我告诉你，全民性的热情一般都是短暂的。
    乍一打完，老百姓过日子的想法就回来了。美国的环境太好了，自己家底雄厚，和其他大陆又隔着大洋，很安全，所以美国人很容易就觉得为什么要去管其 他地方的事情呢？而且当世界领袖是要受约束的，美国人普遍不愿意自己国家受约束。
    即使到了今天，你会发现美国很容易就会退出一些国际组织，像特朗普政府现在就退出了好几个，就是不想受约束。那在第一次世界大战刚结束的时候，美国人这种心理就更强了。所以美国自己也没有完全做好准备。


    最后还要讲一下威尔逊的个人因素。我前面说过，“十四点”方案带有很重的宗教伦理和道德主义色彩，这一点和威尔逊总统个人很有关系。基辛格在《大外交》里面专门有一章讲到威尔逊的外交，有兴趣可以看一下，我这里就不讲了。


    我要说的是，威尔逊有个很大的问题，就是不善于团结别人。他基本上没有做国内反 对派的工作。他是民主党，但组团去参加巴黎和会的时候，居然团里全部是民主党，没有共和党。你知道美国是两党制，他这么干就把共和党人全部推到对立面去了。


    最后的结果就是，威尔逊千辛万苦把“十四点”方案的大部分都塞到和约里，签好了和约，但回到国内，美国国会的反对派却把这个和约否决了。威尔逊前功尽弃。


    # 本讲总结


    说到这里，美国的“十四点”方案，或者说它争取世界领导地位的第一次努力就讲完了。美国的这次宏大设计和最后的失败很容易让我们想起罗胖跨年演讲里的诗：你有计划，但世界另有计划。


    不过，对美国来说，这次努力不白费，很多教训实际上后来它都吸取了，只需等待下一次设计世界的机会。到那时，欧洲这个中心区将被彻底削弱，美国的实力优势将达到历史的峰值，造成这种效果的就是我们下一讲要说的內容，第二次世界大战。


    划重点


    +   1.第一次世界大战让美国通过战争完成了实力的兑换，成了大国之间当仁不让的仲裁人，它的大国崛起进程到了一个爆发点；

    2.威尔逊的“十四点”方案实际上宣'
