    # 16 | 垄断的是与非：为什么垄断不是坏事？


    徐徐郁 · 美国简史30讲


    16 | 垄断的是与非：为什么。


    上一讲我们说到19世纪下半期美国工业赶超。在这个赶超的过程中，出现了一个特别重要但又特别有争议的现象，那就是垄断。我们历史书上也说，美国就是在这个阶段进入了垄断资本主义。


    # 垄断不全是坏事


    说起垄断，我们一般感觉都不会好。因为一个企业如果实现了垄断，那只能买它的产品，没有竞争，没有选择，即使它卖的东西质次价高我们也没办法。这是从我们常识来说的。从理论来说呢？马克思主义当然痛批垄断，列宁说过垄断就是代表着腐朽。那么在意识形态的另一端，自由主义也是反对垄断的，因为垄断是自由竞争的对立面，它破坏自由和平等。


    不过我这里要告诉你，垄断可不都是坏事。在19世纪下半期，美国和德国这两个工业发展最快的国家恰恰垄断发展得最快，实际上，当时西方各国工业发展的水平和垄断的发展基本上是成正比的。美国工业的垄断在发展速度和程度上也是世界最高。我这里先讲结论：垄断当时对美国工业跃居世界第一实际上发挥了很大作用。


    为什么这么说呢？我们来看一下当时美国规模最大的工业垄断，也就是石油工业垄断。洛克菲勒这个人你肯定知道，美国洛克菲勒家族的第一代约翰·洛克菲勒，也就是人们说的老洛克菲勒。这个人穷孩子出身，白手起家。1870年他31岁组建标准石油公司，之后就和对手进行了残酷的竞争和一连串的收购。这个过程肯定不是经济学上说的什么自由竞争，洛克菲勒的下手极狠，除了压价、切断对手供应渠道这些商业手段以外，还贿赂政界、威胁对手，结果在9年之内他的公司就成为美国石油工业唯一的大家垄断企业，垄断了多少？控制了美国90%的炼油业和输油管道线。但是，洛克菲勒并没有就此止手，他在垄断炼油的基础上继续往石油工业的上下游产业链扩张，包括终端产品的那些零售都控制了起来。最后垄断达到什么程度？我告诉你，到1890年，就是洛克菲勒51岁的时候，美国整个国家的石油工业（包括产油、炼油、运输、副产品加工、零售、出口所有这些环节），他已经控制了85%以上。这种垄断程度我们今天是很难想象的。


    # 垄断背后的约束


    但是你可能还会说，垄断可能对当时工业发展有利，那老百姓肯定吃亏啊，因为没有竞争了，价格它一家说了算。它要涨价谁也沒办法。那我再看一眼当时的油价。很奇怪的一件事情是，洛克菲勒实现了对石油工业的垄断以后，石油产品的价格不仅没有涨，反而不断下降，特别是老百姓的日常用油，在他统治石油工业的几十年里面一共下降了80%。那这是怎么回事呢？


    +   - 一方面，他在商业上心狠手辣，不择手段，属于典型的“强盗大亨”；

    - 另一方面，他出身贫寒，笃信宗教，做了很多慈善。


    > “我们要永远记得我们是在为穷人们提供用油，而且必须是又便宜又好的油。”


    # 本讲提要交流


    1.垄断当时对美国工业跃居世界第一实际上发挥了很大作用；

