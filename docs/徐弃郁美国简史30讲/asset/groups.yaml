    # 12 | 社会的西进：美国版的西部大开发


    徐闯郁 · 美国简史30讲


    12 | 社会的西进：美国版的。


    上一讲我讲的是美国领土扩张，你可以把它看成是美国在国家层面上的西进。如果我们把视野稍微变得微观一点，就可以发现随着美国国界大踏步向西移动，成千上万普通美国人坐着大篷车一拨接着一拨地进入辽阔的西部，把那里的土地开发出来。这是美国西进运动的另一个层面，就是社会层面。美国很多书都把这个层面的西进描述得和史诗一样。


    这里我必须要说的是，这种史诗般的西进是以大批印第安人被驱赶，被屠杀为代价的，这是美国历史上永远抹不掉的污点。但是时间关系，这方面我不多说了。抓住真正的问题，发掘现象背后的东西，才是我们的重点。


    美国社会层面的西进实际上是美国版的西部大开发。这种骇琐的规模和效率都是人类历史上前所未有的。举个例子，上一讲我说道的路易斯安那，这块地方原先差不多就是一片蛮荒之地，但不到五十年时间，美国人已经把这块地方叫做“小麦王国”，因为这里小麦产量占到美国全国总产量的50%以上。其他像矿藏开采，运输业，也都飞快地发展起来。到19世纪中期的时候，这种社会层面的西进已经使美国变成了世界上数一数二的农业大国，同时也是为它成为工业大国做好了准备。所以社会层面的西进不仅规模和速度惊人，更重要的是它把美国的资源禀赋从潜在力量变成了真正可以运用的实力。


    # 西进运动的动力来自哪里？


    那问题也来了，美国怎么做到的？有人说，这是因为美国是个移民国家，欧洲的移民不断到美国东海岸，东岸的人越来越多，地不够了，就往西边跑，所以社会层面的西进就是一种自发的大规模移民。这个说法很普遍，不少美国人自己就这么说。那它是不是事实？是，但绝不是全部事实。这种说法漏洞的恰恰是最关键的部分。那就是美国的制度设计，这里土地制度尤其重要。


    说起美国的土地，我们很多人都会觉得，美国这样一个重视私有财产的国家，它的土地肯定是私有制啊。但是我告诉你，错了。美国相当一部分的土地是国有的，而且这些国有土地的存在对西进可是至关重要。不了解这一点，就不可能真正理解西进的动力。


    那为什么这么说呢？我回到美国独立建国的时候。前面说过，美国建国实际上就是原先那十三块英国殖民地，这些殖民地开发的时间已经很长，而且按照原来英国人的法律，土地大多数都已经私有化，换句话说产权已经固化，你不能去剥夺人家的私有土地。但当时西部边境的土地还没有开发，基本不存在私有土地。


    所以美国抓住这个时机，独立以后很快就通过了三部土地法，规定所有的西部土地都是联邦的公共土地，实际上就是国有化。你注意，这说的是所有西部土地，包括那些当时根本没到美国手里的，它都预先一起设计了。那这些土地是不是国家就永远拿在手里了呢？不是的。这些国有土地可以卖给私人，美国政府说每个往西部去的移民都有权从国家购买土地，而且具体规则和价钱国家给你定好了，不会乱来。


    所以你看，美国把西部土地国有化实际上是一个中间步骤，它真正要实现的是 一种可控的、可监督的土地私有化进程。实话实说，这个法律设计太绝了：


    +   一方而联邦政府从此可以卖土地，凭空多了一大笔财政收入；

    更重要的是，土地国有有这样一种中间性的安排，实际上是把西部这么多土地的产权保持了开放，人人都有获得的可能。


    这你就可以理解了，为什么当时条件这么艰苦，还有这么多 人前赴后继地往西部跑。


    # 如何治理西部？


    但是这里还有一个很明显的问题，这么多人往西部跑，你怎么治理呢？对于任何一个国家来说，只要人和地这两个要素放在一起，就有了一个最基本的管理需求。这就是说到美国在政治制度上的预先设计了。


    # 本讲总结


    所以你看美国社会层面的西进，表面上好像是无序的，土地投机商、拓荒者、牛仔、海金 的，都一窝蜂地往西部跑，局部来看就是很混乱。但你要从宏观上看，它又是 有序的，对西部的开发在经济上、社会上、政治上协调并进。这里主要的原因就是，西进的大框架早就做好了。我上面讲到像土地制度，领地制度这些基础性的制度设计——


    +   一方而实现了社会动员，吸引大家往西部移民，搞美国版的西部大开发；

    另一方而它也实现了规制，保证开拓出来的西部一定是美国的一部分，而且一定是美国原有的政治制度和价值观的延伸。


    应该说，美国在这么短的时间，能对这么大规模的土地进行开发并且实现美国化，背后的秘密就在这里。


    划重点


    1.美国能够在短时间内实现大规模的土地开发，主要是因为提前设计好大框架——一方而实现了社会动员，另一方而实现了规制，即实现原有政治制度和价值观的延伸；

    2.美国的宏大创制和“大设计”能力的背后，本质上是国家精神底层的反映。


