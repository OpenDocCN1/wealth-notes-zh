    它往往干扰公众会议的进行，并削弱行政管理能力。它在民众中引起无根据的猜忌和莫须有的惊恐；挑拨派对立；有时还引起骚动和叛乱。它为外国影响和腐败打开方便之门。外国影响和腐败可以轻易地通过派系倾向的渠道深入到政府机构中来。这样，一个国家的政策和意志就会受到另一个国家政策和意志的影响。


    有一种意见，认为自由国家中的政党，是对政府施政的有效牵制，有助于发扬自由精神。在某种限度内，这大概是对的；在君主制的政府下，人民基于爱国心，对于政党精神即使不加以护守，也会颇为宽容。但在民主性质的纯粹选任的政府下，这种精神是不应予以鼓励的。从自然趋势看来，可以肯定，在每一种有益的目标上，总是不乏这种精神的。但这种精神常有趋于过度的危险，因此应当用舆论的力量使之减轻及缓和。它是一团火，我们不要熄灭它，但要一致警惕，以防它火焰大发，变成不是供人取暖，而是贻害于人。


    还有一项同样重要的事，就是一个自由国家的思想习惯，应当做到使那些负有行政的人保持警惕，把各自的权力局限于宪法规定的范围内，在行使一个部门的权力时，应避免侵犯另一个部门的权限。这种越权精神倾向于把所有各部门的权力集中于某一部门，因而造成一种真正的专制主义，姑不论其政府的形式如何。


    如果民意认为，宪法上的权限之分配或修改，在某方面是不对的，我们应当照宪法所规定的办法予以修改。但我们不可用藐视的方式予以更改；因为这种方法，可能在某一件事上是有有效手段，但自由政府也常会被这种手段毁灭。所以使用这种方法，有时虽然可以得到局部的或一时的好处，但此例一开，一定抵不过它所引起的永久性危害的。


    在导致昌明政治的各种精神意识和风俗习惯中，宗教和道德是不可缺少的支柱。一个竭力破坏人类幸福的伟大支柱——人类与公民职责的最坚强支柱——的人，却妄想别人赞他爱国，必然是自欺心机的。政治家应当同虔诚的人一样，尊重和爱护宗教与道德。宗教与道德同个人福利以及公共福利的关系，即便写一本书也说不完。我们只要简单地问，如果宗教责任感不存在于调查事件的宣誓中，那么，哪个能谈得上财产、名誉和生命的安全呢？而且我们也不可耻于幻想，以为道德可不靠宗教而维持下去。高尚的教育，对于特殊构造的心灵，尽管可能有所影响，但根据理智和经验，不容许我们期望，在排除宗教原则的情况下，道德观念仍能普遍存在。


    本身处于这样的境地：自己已为那微小的恩惠出同等的代价，但仍被谴责为忘恩负义，认为付得不够。期待或指望国与国之间有真正的恩惠，实乃最严重的错误。这是一种幻想，而经验必可将其治愈，正直的自尊心必然会将其摈弃。


    虽然在检讨本人任期内施政时，我未发觉有故意的错误，但是我很明白我的缺点，并不以为我没有犯过很多错误。不管这些错误是什么，我恳切地祈求上帝免除或减轻这些错误所可能产生的恶果。而且我也将怀着一种希望，愿我的国家永远宽恕这些错误；我秉持正直的热忱，献身为国家服务，已经四十五年，希望我因为能力薄弱而犯的过失，会随着我不久以后长眠地下而湮没无闻。


    我在这方面和在其它方面一样，均须仰赖祖国的仁慈，我热爱祖国，并受到爱国之情的激励，这种感情，对于一个视祖国为自己及历代祖先的故土的人来说，是很自然的。因此，我以欢欣的期待心情，指望在我切盼实现的退休之后，我将与我的同胞们愉快地分享自由政府治下完美的法律的温暖——这是我一直衷心向往的目标，并且我相信，这也是我们相互关怀，共同努力和赴汤蹈火的优厚报酬。


    ## 09｜火烧白宫：第二次美英战争


    徐弃郁 · 美国简史30讲


    上一个模块我们重点聚焦了美国的立国过程。但是，美国是怎样从东部沿海的十三州，一步步变成我们今天这样一个占据半个北美的大国？这就是我们这个模块的内容了，美国的扩张。


    扩张离不开战争。那说起美国和战争，那今天的我们都会觉得美国人好像特别爱打仗，什么科索沃战争、伊拉克战争、阿富汗战争，老是在打仗。但从历史上来看，美国打仗的时间在西方大国里不算多，比同时期的英国、法国少多了。真正意义上的战争一共就这么几场。


    那在这几场战争里面，美国人最不愿意提的一场战争是哪一场？那就是第二次美英战争。这场战争你可能不熟悉，但你很可能听说过美国白宫和国会大厦早年的时候都被人家烧掉过，所以才叫做今天的白色。我告诉你，那就是在这场战争当中，被英军烧的。这第二次美英战争可以说是美国历史上最乌龙、最不愿意提及的一场战争，但是从美国崛起的角度来看，它又特别重要。这一讲我们要说的就是这场战争。


    ### 起因乌龙：美国主动宣战


    为什么我说第二次美英战争是美国历史上最乌龙的战争？两个原因，首先是起因乌龙。这场战争和独立战争之间隔了不到30年，美国的历史书在相当一段时间里把它叫做“第二次独立战争”，说美国独立以后英国实际上还在压迫美国，美国通过战争终于赢得了彻底的独立。你听，逻辑上一点问题也没有，我们很多书也延续了这种说法。但是，我告诉你，这种说法不对。


    第二次美英战争是美国主动向英国宣战的。很多美国历史书上说那是因为英国欺压美国，在海上拦截美国船，更过分的是把船上的美国人强行征入英国海军，换句话说就是“海上抓壮丁”。这当然是事实。拿破仑战争期间，英国海军对所有要进入法国殖民地的船都要扣，而且确实在“海上抓壮丁”，美国人也说英语啊，扣过来就能干活。所以英国的霸道是肯定的，但这绝不是美英开战的真正原因。


    为什么这么说？因为当时主张对英作战的根本不是饱受英国霸权之苦的沿海地区，而是西部地区的几个州。他们想要进一步向西扩张，但是前面挡着一个强大的印第安部落，英国是这个部落的军事同盟。所以那批美国人觉得，要想武力解决这个部落，就必须先打败英国。所以这批西部政治家是当时最强硬的主战派，被称为“战鹰”，最后成功推动政府和国会向英国宣战。所以你看，这场战争的主要原因并不是因为英国欺侮美国，而是美国自己有野心，根本就不是什么第二次独立战争。


    那为什么说战争的起因乌龙呢？你看，美国宣战的公开原因是英国搞“海上抓壮丁”，但就在美国宣战的前两天英国已经宣布停止这些海上敌对行动，不过当时没有电报，这则消息是在美国宣战几周后才传到华盛顿的。那美国怎么办呢？只能将错就错，还是继续拥兵遣将。所以说起因有点乌龙。


    ### 过程乌龙：战争准备差


    再看这场战争的过程也比较乌龙。你别看美国是主动宣战，但战争准备做得很差；它的正规军当时不到1200人，宣战以后国会要求扩大到35000人，结果直到年底总人数才达到15000人。那英军当时多少人呢？要知道英国当时在和拿破仑作战，主力全在欧洲，北美的英军不到5000人。


    但是美军的表现相当一般。美军分三路进攻英国在北美的殖民地——加拿大，结果很快就失败，有部队就直接溃败或者投降。最让美国人感到丢人的就是底特律，守军2500人，一枪没放，就向700名英军投降。英国等到拿破仑战败后，开始调大部队到美国，转入进攻，火烧华盛顿就在这个时候发生的。当时英军一共4000人，美军至少7000人，但很快溃不成军，英军可以说轻松取华盛顿，把白宫、国会大厦这些政府建筑烧毁。


    但是美军也有亮点。特别是火烧华盛顿以后，美军的抵抗明显加强，英军虽然大量增兵，但接下来的进攻基本上没占到什么便宜。你一定听过美国国歌《星条旗永不落》。我告诉你，这首歌的诞生就是这场战争中发生的一个插曲。英军火烧华盛顿以后，接着进攻另一个沿海城市巴尔的摩，英军的舰炮不断地轰击沿海的堡垒。当时正好有个叫弗朗西斯·斯科特·凯的美国人被关在英军的军舰上，他看着堡垒上飘着星条旗，心里就在默默祈祷美军能够守住。结果到了第二天早晨，天亮的时候他看到这面旗还在堡垒上飘着，心里非常激动，写下了一首诗，就是星条旗永不落。这个插曲很有象征意义，就是英国不可能攻下美国。实际上在此之后，英军的攻势也慢慢减弱。最后两国和谈。


    ### 结果乌龙：“白打”的战争


    我们再看一下这场战争的结局，也有点乌龙。为什么这么说呢？我们前面讲到美国开战的公开理由是英国的海上敌对行动，特别是“海上抓壮丁”。美国在和谈过程中也很强硬，说这事必须解决。但是你看最后签订的和约，上面是说美国和英属加拿大之间恢复战前边界，其他的事情根本没有提。那给人什么感觉？就是这一场仗白打了，最后只是恢复战前状态，这不是让人感到有点乌龙吗？


    还有，这场战争中美国人打的最漂亮的一仗是新奥尔良大捷，指挥官安德鲁·杰克逊因为这一仗成为美国家喻户晓的英雄，再后来又当上了总统，我们后面有一章会说到他。但是我告诉你，这么重要的一仗是在和约签订、战争正式结束后打的。为什么会这样呢？还是通讯不发达，当时美英双方的指挥官都不知道战争已经结束了。所以说这战争的结局也有点乌龙。


    ### 意义重大的“乌龙”战争


    好，到这里第二次美英战争基本上说完了。你也知道为什么这场战争不能说是美国的第二次独立战争，为什么美国人不大愿意提它。但是我还要告诉你，这场战争虽然从头到尾都有点乌龙，它的历史意义是非常重大的。


    #### 首先它表明美国已经成为一个难以征服的大国。


    这场战争爆发的时间是1812年。很巧，这一年正好也是拿破仑进攻俄国的那一年。我们都知道，拿破仑入侵俄国最后失败，部队在回撤的过程中几乎全军覆灭。那从战略角度看，这表明俄国那种辽阔地给它特别巨大的战略纵深，不可能被外国征服。而同一年爆发的美英战争最后证明美国也成为了一种具有巨大战略纵深的国家，外国军队可以进攻去，打几个胜仗，但征服不了它。这一点太重要了，对欧洲列强来说，进攻美国本土从此不在考虑之列。


    除了这一点以外，第二次美英战争还有一个意义，就是在英美之间划清了行为边界。美国当时最大的增长点在哪里？就在北美大陆。但英国是当时的世界霸主，控制着北部的加拿大，只要英美之间的行为边界还是模糊的，那就一定会相互干扰。从美国角度说它就不能够在这片大陆上放手扩张。但这场有点乌龙的战争打完以后，它起到了一个客观效果，那就是英国和美国相互都知道了什么可以做，什么不可以做。这就是行为边界。有了这个，美国接下来就可以放心得在北美扩张，可以把它的增长点发挥到极致。从这里，你也能看到在发展过程中，竞争者之间形成行为边界的重要性。


    - 第二次美英战争表明：美国是有巨大战略纵深的国家，已经成为一个难以征服的大国，同时，也在英美之间划清了行为边界；

    - 在发展过程中，竞争者之间形成行为边界，非常重要。


    ## 10 | “门罗主义”：美式大国思维的开端


    徐弃郁 · 美国简史30讲


    几年前，美国人攻击我们，说中国要推行“亚洲的门罗主义”。这种说法不值一驳，但美国用“门罗主义”来攻击我们就很有意思啦。为什么呢？因为门罗主义是美国崛起过程中的一个标志性口号，说“美洲是美洲人的美洲”，实际上就是它想独霸美洲，不让别人插手。按我们很多历史书上的说法，门罗主义表明，羽翼未丰的美国已经显出独占美洲的野心。


    这个说法肯定没有冤枉它，但是太粗线条了。要知道，门罗主义不光是美国外交史上的一个重要概念，它还是了解美国大国思维的一个绝好案例，但不看细节基本上什么都看不到。这一讲就带你细看一下门罗主义。


    ### 什么是门罗主义？


    我先说一下门罗主义是什么。美国第5位总统叫做詹姆斯·门罗，这个总统并没有做什么大事，但是他在第二任的时候发了一个咨文。当时拉美国家正在进行独立战争，俄罗斯、法国这些老欧洲国家嗷嗷着要去干涉拉美的独立。门罗这位总统咨文就是针对这种干涉的核心意思就是美国从不干涉欧洲国家，所以欧洲国家也别干涉美洲的事情。注意，他说不是美国，而是美洲。而且口气非常强硬，说不管这种干涉是何种形式，我们都绝不能容忍。你从这里就可以看得很清楚，门罗主义实际上就是宣布整个美洲都是美国的势力范围，所以说它显得独占美洲的野心根本没冤枉它。


    但是这个门罗主义的出现，并不是因为美国想起来，我要独霸美洲，然后提出这么一个原则，或者说口号。从当时的情况来看，美国对于俄法这些老欧洲国家干涉拉美确实是非常敏感，而且它紧张的并不是拉美要被欧洲人抢走了，而是它觉得如果欧洲能干涉拉美，很早也就能干涉美国。美国政府内部确实谈到了这事可能对美国安全构成威胁。所以你看它这个思路很有意思，美国不是被眼前的危机推着走的，而是被一种危机意识推着走的。这个特点美国今天也是一样。


    我再告诉你，美国提出门罗主义还是一次被动的反应。对谁的被动反应？就是当时世界霸权国——英国。俄法这些欧洲大陆国家嗷嗷着要联合干涉拉美的独立，英国人的反应比美国人还要快。英国对欧洲大陆上的国家一直有戒心，只要大陆国家要联合起来做些什么事情，那英国第一反应就是自己要落单，所以一定要想办法让它们做不成。但是英国从来不喜欢单干，它就找到美国了，说这事情越闹越大，俄法这些欧洲大陆国家现在联合起来想要干涉拉美，要不我们两家也联合起来搞个声明，吓唬吓唬它们。所以你看，始作俑者是英国。


    那美国什么反应呢？美国内部有些人绝对是动心的。你想，这可是一次免费搭车的好机会，和世界上最强大的国家——英国联合发表个声明，这对美国来说就没有风险了，因为法俄这些国家即使联合起来，英国海军也能挡住它们。这种稳赚不赔的事情，为什么不做呢？所以当时美国政界的一些大佬，包括杰斐逊和麦迪逊这两位前总统都觉得可以接受英国的这个提议。


    ### 门罗主义有什么特点？


    但是这时有个关键人物提出了不同看法。他就是国务卿亚当斯。这个人我稍微说两句。他父亲叫做约翰·亚当斯，是华盛顿之后美国第二任总统，人称老亚当斯。那国务卿约翰·亚当斯基本上是子承父业，也从政，当完国务卿又当上美国第6任总统，人称小亚当斯。这个情况和老布什、小布什一样，一家父子两人都是总统。


    这个小亚当斯的想法就和当时很多人不一样。首先他对英国总是不放心，觉得英国这么做的动机很可疑。不要忘了，这时候第二次美英战争才过去几年，美国对英国还是很警惕的。亚当斯就怕英国的建议里有什么阴谋。但是美国如果不接英国这招也不行啊，因为反对欧洲国家干涉拉美这件事跟美国有直接利害关系。那怎么办呢？亚当斯就提出，干脆美国自己干。他说，美国是一个有抱负的大国，与其跟在英国后面当小兄弟，不如我们自己对那些欧洲国家提出警告。最后他的意见被门罗总统采纳，这才有了门罗做出的那份著名的年度咨文，才有了门罗主义的出台。


    听到这里你就明白了，这么重要的门罗主义当时实际上是美国的一种被动应对。而且你还可以看到美国的一个特点，那就是一旦这个事情涉及到它的重要利益，那它就是绝对不怕单干的，而且还喜欢单干。看美国的历史，它单干的时间，要比和其他国家合作做事情的时间长得多。我指一句，单干是美国的本色，后来当领导以后才不得不同其他国家合作。你了解了美国这个特点，那今天看特朗普政府的很多做法就一点都不会意外了。


    那门罗主义除了体现美国的单干倾向以外，还有什么特点？今天我们看门罗总统的这份咨文，很多人都会觉得，美国就是美洲，当年实力还不够的时候就那么霸道了，而且野心勃勃，要把整个拉美作为自己的后院。这种看法没有错，但如果只是这些，就只看到了它强势、高调的一面，忽略了它背后的精打细算。


    你想：美国实力还不强的时候，为什么敢对欧洲列强说这么猛的话？不怕得罪法国和俄罗斯吗？这当然是有原因的。那些国家和它隔着一个大西洋，而控制着大西洋的是英国皇家海军。而英国的态度我前面已经讲过了，它在反对法俄干涉拉美的问题上和美国一致，而且还主动提议让美国和它一起行动。那英国皇家海军实际上就是美国和欧洲大陆之间一堵牢不可摧的屏障，美国就可以放心大胆地说狠话，向别人宣布规则。那你可能还会问：那英国呢？美国这么单干会不会得罪英国？我告诉你，也不会。因为英国看中的不是面子，而是事情的根本，英美在这个问题上利益基本一致就行了。所以美国门罗主义出来以后，英国的反应比较平静，英国驻华盛顿的外交官给国内写信时还称赞了门罗的这份宣言，说它“语气明确果断”。


    所以我们回头细想一下，就会发现美国在这件事情上很滑头，很会借力。你看它宣布了自己的势力范围，挑战了欧洲列强，明确了自己的大国地位，全部代价就是一纸宣言。为什么代价这么低？最主要原因就是美国抓住时机借了英国的力，可以这么说，如果当时英国和美国的态度不一样，那谁也不会把门罗主义当回事。一个美国历史学家就说，要不是皇家海军握在大西洋，门罗总统的一纸咨文根本挡不住任何干涉。这里我们可以看到美国的另一个特点：它喜欢用豪言壮语，一下子抛出来一个很宏大的原则，看上去霸气横溢，但在这些的背后，它有非常精打细算的一面。我们今天看美国的时候，千万不要忽略了这点。


    ### 本讲总结


    到这里，门罗主义这一讲就讲完了，我总结一下从中可以看到的美国行为的三大特点。


    - 第一，美国的危机意识很强，很多行为不是危机推动而是危机意识推动；

    - 第二，一旦涉及到它的重要利益，美国绝对不怕单干，而且有很强的单干倾向；

    - 第三，美国霸气的背后往往有非常精细的考量，绝不是莽干。


    当然，美国提出门罗主义虽然是瞄准整个美洲的，但它原则太超前了。美国的力量根本不到，更重要的是美国在北美还有大片的西部土地要征服。征服西部，或者说西进才是当时美国崛起的真正重点。下一讲我就要说这个问题。


    ### 本讲交流议题


    这一讲的最后，我要给你留一道思考题：刚才我为你总结了美国行为的三大特点，你还观察到美国哪些行为体现了这些特点？欢迎在留言区分享你的看法。


    ## 11｜国家的西进：美国领土快速扩张的秘密


    徐弃郁 · 美国简史30讲


    在美国历史里面，如果要挑一个和它独立建国一样重要的篇章，那就是西进运动。


    什么叫西进运动呢？就是从美国建国到19世纪末这一百多年的时间里，美国人从东往西不断移民，美国的疆域也不断往西扩张，直到太平洋才停止。这个向西移民和扩张的过程就叫西进运动。


    而西进给人印象最深的，就是美国扩张的幅度和速度。


    你看美国的历史地图，它从北美洲东部沿岸的一个长条形，只用了大约50年时间，一路向西扩展到了太平洋沿岸，半个北美洲都成了它的领土。这一点对美国来说太重要了。从国际政治学的角度来看，美国是从一个一般意义上的大国，变成了一个拥有洲际规模的超大国家。有了这份家底，美国后来在国际舞台上所有的事情都更有底气。


    问题也来了，短短50年时间完成了这么大幅度的扩张，美国怎么做到的？以前学历史的时候，我们都会感觉美国扩张就是靠两种：一是武力，通过战争直接抢；二是钱，就是从欧洲老殖民国家买。这种武力加有钱的模式特别符合我们对现代美国的印象，而且从粗线条上看也没有错。


    ### 购买路易斯安那


    我们来看一个特别典型的例子：美国购买路易斯安那。这是美国版图向西扩张过程中最大的一笔交易。


    ### 购买佛罗里达


    再讲一个购买佛罗里达的例子，你对美国这种运用相对优势的路子就更清楚了。佛罗里达是美国最东南角的一块地方，西班牙占着。美国买下路易斯安那以后，想接着买下佛罗里达，遭到拒绝以后美国就威胁要打仗。结果西班牙很强硬，还是拒绝。那美国动武了没有？没有。它又回到了运用相对优势的道路。


    ### 美国地理优势的累积效应


    那路易斯安那和佛罗里达这两个地方拿下来以后怎么样呢？美国发现，东部沿海地区已经全部被它控制，西部地区和大西洋被完全隔开。从军事故角度看，这一点非常关键。要知道，欧洲列强的军队到美洲都得经过海上，所以这样一来西部无论发生什么事情，欧洲国家基本不可能再运兵到那里去增援，说明美国在西部可以放手扩张而不用担心欧洲国家的军事干涉。


    ### 本讲总结


    说到这里，你就明白了，美国之所以能够在短短半个多世纪里就成功扩张，秘密不光是它善于运用自己的相对优势，更重要的是，它选择了一个让自己的相对优势可能不断累积的大方向。抛开历史不说，这一点对我们今天也是有借鉴意义的。


    最后我要说的是，美国的扩张只是把地盘拿下来，并不是真正的占有。想真正占有地盘永远要靠人，而且是成千上万的普通人。美国的西进除了国家的扩张以外，还有一个并行的，社会层面的西进运动。我可以告诉你，这个层面的西进运动从某种程度上更重要，它不仅是在消化扩张来的土地，而且为进一步的扩张提供了更大的势能，它对美国后来的发展方向也产生了深远的影响。
    这就是下一讲的内容。


    - 美国之所以能够在短短半个多世纪里成功扩张，秘密不光是它善于运用自己的相对优势，更重要的是，它选择了一个让自己的相对优势可能不断累积的大方向。

