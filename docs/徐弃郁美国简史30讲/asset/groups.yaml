    ## 16 | 垄断的是与非：为什么垄断不是坏事？


    徐徐郁 · 美国简史30讲


    上一讲我们说到19世纪下半期美国工业赶超。在这个赶超的过程中，出现了一个特别重要但又特别有争议的现象，那就是垄断。我们历史书上也说，美国就是在这个阶段进入了垄断资本主义。


    ### 垄断不全是坏事


    说起垄断，我们一般感觉都不会好。因为一个企业如果实现了垄断，那只能买它的产品，没有竞争，没有选择，即使它卖的东西质次价高我们也没办法。这是从我们常识来说的。从理论来说呢？马克思主义当然痛批垄断，列宁说过垄断就是代表着腐朽。那么在意识形态的另一端，自由主义也是反对垄断的，因为垄断是自由竞争的对立面，它破坏自由和平等。


    不过我这里要告诉你，垄断可不都是坏事。在19世纪下半期，美国和德国这两个工业发展最快的国家恰恰垄断发展得最快，实际上，当时西方各国工业发展的水平和垄断的发展基本上是成正比的。美国工业的垄断在发展速度和程度上也是世界最高。我这里先讲结论：垄断当时对美国工业跃居世界第一实际上发挥了很大作用。


    为什么这么说呢？我们来看一下当时美国规模最大的工业垄断，也就是石油工业垄断。洛克菲勒这个人你肯定知道，美国洛克菲勒家族的第一代约翰·洛克菲勒，也就是人们说的老洛克菲勒。这个人穷孩子出身，白手起家。1870年他31岁组建标准石油公司，之后就和对手进行了残酷的竞争和一连串的收购。这个过程肯定不是经济学上说的什么自由竞争，洛克菲勒的下手极狠，除了压价、切断对手供应渠道这些商业手段以外，还贿赂政界、威胁对手，结果在9年之内他的公司就成为美国石油工业唯一的垄断企业，垄断了多少？控制了美国90%的炼油业和输油管道线。但是，洛克菲勒并没有就此止手，他在垄断炼油的基础上继续往石油工业的上下游产业链扩张，包括终端产品的那些零售都控制了起来。最后垄断达到什么程度？我告诉你，到1890年，就是洛克菲勒51岁的时候，美国整个国家的石油工业（包括产油、炼油、运输、副产品加工、零售、出口所有这些环节），他已经控制了85%以上。这种垄断程度我们今天是很难想象的。


    ### 垄断背后的约束


    但是你可能还会说，垄断可能对当时工业发展有利，那老百姓肯定吃亏啊，因为没有竞争了，价格它一家说了算。它要涨价谁也没办法。那我再看一眼当时的油价。很奇怪的一件事情是，洛克菲勒实现了对石油工业的垄断以后，石油产品的价格不仅没有涨，反而不断下降，特别是老百姓的日常用油，在他统治石油工业的几十年里面一共下降了80%。那这是怎么回事呢？


    - 一方面，他在商业上心狠手辣，不择手段，属于典型的“强盗大亨”；

    - 另一方面，他出身贫寒，笃信宗教，做了很多慈善。


    > “我们要永远记得我们是在为穷人们提供用油，而且必须是又便宜又好的油。”


    ### 本讲提要


    1. 垄断当时对美国工业跃居世界第一实际上发挥了很大作用；

    2. 美国整个国家的发展，一方面因为垄断而获得巨大的好处，另一方面制度的力量又可以使它部分抵消垄断的副作用。


    ## 17 | 应对赶超带来的问题：“财富福音”与慈善


    徐徐郁 · 美国简史30讲


    前几年，世界首富比尔·盖茨把自己在微软的股份套现，一下子抛出580亿美元。这件事马上成为当时一个焦点话题。而且我们发现，除了他以外，美国富豪捐款做慈善的还有很多，像投资大师巴菲特就和比尔·盖茨一起承诺，一生要把超过一半的财产捐给慈善机构。那年轻一代的呢？脸书的创始人扎克伯格也在这么做，有一年还当选了美国“最懒惰的人”。


    那么这些美国数得着的最有钱的人为什么这么热衷于慈善呢？确实让人不好理解。有人就站出来了，说大家当心，这是骗局，美国有一套基金会的运作机制，这些人捐款实际上只是把一只手里的钱换到另一只手，而且还能抵税。


    那这说法到底对不对？我不作评判。但我可以告诉你的是，这事在美国已经有历史传统了。这一讲要说的就是这种历史传统的开始。那么听完这一讲以后，我相信你对这个问题肯定有一个自己的答案。


    ### 美国慈善的历史传统


    那么这个传统从什么时候开始呢？就是我前面说的美国工业大赶超时期。这个时期美国工业大发展，垄断大发展，财富迅速地创造和集中，出现了像洛克菲勒这样的巨头，很多人管他们叫“强盗大亨”，因为这些人竞争手段残酷无情，像强盗一样。但这个时候出现了一个奇怪的现象，一些“强盗大亨”在聚敛了前所未有的财富以后，开始大量捐钱为社会做慈善。


    这里最著名的就是美国钢铁大王安德鲁·卡内基。


    这个人我稍稍多说两句。卡内基出生在苏格兰，家里很穷，10来岁的时候移民美国。刚到美国的时候他还做童工，慢慢白手起家。他做商业非常厉害，精明冷酷，后来和石油大王洛克菲勒、汽车大王福特一起成为美国三大商业巨头。他一家公司的钢铁产量就超过了英国全国。但是这样一个“强盗大亨”，做慈善的力度特别大，生前就把大部分的财产捐了出去。用今天的话来说，基本上就是“裸捐”了。这在美国历史上是第一个。


    但是，他的慈善和我们一般的概念可不一样，从来不直接给穷人钱，那捐那么多钱都干什么呢？我举几个例子，建图书馆，一共建了2500家，成立卡内基基金会，成立研究机构和学校，像今天全球大学排名第23的卡内基-梅隆大学就是他当年建立的。总体上说，他做的是教育啊这些社会公共事业。你再看当时其他的那些强盗大亨，虽然力度没有卡内基那么大，但不少也在做这样的慈善。美国斯坦福大学你肯定熟悉，一流名校，但你知不知道，它当时就是铁路巨头斯坦福捐赠建立的。洛克菲勒也建立了促进医学研究的研究所，成立基金会，他还买下了大片土地，干什么呢？建国家公园。所以你看，第一代的美国超级富豪就是这样做慈善的。


    ### 为什么要做慈善？


    首先要承认，做慈善有提高自己社会地位的目的。当时很多富豪是底层起来的，属于暴发户，那搞捐赠肯定有利于社会接纳他。我和你说一个事情，在美国丹佛市，有一个富豪给市里捐了一座剧院。他进去的时候看到楼梯拐角挂了莎士比亚的画像就很不高兴，说挂他的像干什么？他为丹佛做了什么贡献？所以他下令把莎士比亚的像撤了，换成了他自己的像。所以你看，提高社会地位和影响力当然是做慈善的一个动机。


    但是，更主要的是社会压力，当时美国贫富差距快速拉大，工人运动随之兴起。这样暴发起来的富裕阶层对这种压力很敏感，所以做慈善也是富豪用来缓和矛盾的一种做法。但我也要告诉你，这是原因之一。要知道，快速工业化和贫富差距拉大的现象在西欧也有，那为什么偏偏美国富豪就更愿意做慈善呢？这就是说到更深层的东西——宗教。我在前面第二讲讲美国宗教基因的时候，就说过宗教性是美国特性的一个部分，更确切地说，基督教新教特别清教主义就是美国国家底层精神的组成部分。宗教对美国富豪的慈善行为有着特别深的影响。听到这里你可能会说，这也太玄了吧。


    但实际上一点儿也不玄。我还是拿卡内基做例子。1889年，他写了一篇叫《论财富》的文章，实际上就把他的财富观完整地讲了一遍。如果我要找出美国社会影响最大的十篇文章，它绝对排在前5位。这篇文章有一个中心词，是卡内基自己发明的，叫财富福音。福音就是圣经新约里面，福音书的福音。所以你看，这个词本身就带有很强的宗教色彩。他在文章里反复强调基督教教义，全文的落脚点，实际上是要破解圣经新约里面耶稣说的“富人上天堂比骆驼穿过针眼还难”，破解之道就是富豪要在有生之年用财富来造福于贫穷的兄弟们。他的名言是：拥有巨大财富而死是可耻的。从这里你就可以看出，宗教是卡内基做慈善的一个强力动力。实际上不光是卡内基，当时其他富人做慈善多少也都有宗教动力。


    ### 为什么这样做慈善？


    我们再来看第二个问题，为什么用这种方式做慈善？不给穷人钱但做公共事业，我告诉你，这也是受宗教影响。卡内基在《论财富》里面写得很清楚，慈善不是做滥好人，不能不加区别地给别人钱。为什么呢？因为这样做实际上是鼓动那些懒汉，这种罪比一毛不拔更大。真正的慈善，是要给那些优秀和有上进心的穷人提供机会和帮助。


    你看这理论很奇怪吧？但如果你熟悉基督教新教的教义，就不会觉得奇怪。我这里插一句，想要了解新教教义建议你看一下马克斯·韦伯写的《新教伦理和资本主义精神》，这可以说是20世纪最伟大的书之一，我不展开了。那基督教新教在对待贫富问题上很独特，一般宗教都是站在穷人一边，这样才能发挥社会黏合剂的作用。但新教认为，人只要勤奋、节俭、讲信用，就可以摆脱贫困，财富是上帝给你的赏赐。那对穷人呢？新教说，要帮助穷人，但同时要指出他们身上的恶习，比如懒惰、酗酒，否则帮了也是白帮。所以你看，卡内基宣扬的那种慈善方式基本上就是按照新教教义来的。


    说到这里你就明白，美国富豪做慈善，宗教起了多大的作用。而且我还要再补充一句，卡内基和洛克菲勒这些人做慈善，实际上是把宗教教义用世俗形式激发了。


    你想，卡内基、洛克菲勒这几个人都是穷小子出身，后来变成巨富，本身就是所谓“美国梦”的典型。他们提出“财富福音”这种说法就很有社会影响，一位历史学家说当时美国人相信“财富福音”就和相信民主一样。这是什么？这是美国宗教基因的现实演化。在形式上越不像宗教，影响力反而越持久。到现在比尔·盖茨这些人做慈善就说不上帝了，只说回报社会。但根子呢？对不起，还是宗教基因。


    到这里，这一讲就结束了。你可能还有一个问题，那就是卡内基这些人的慈善到底能解决问题吗？答案是，有作用，但却有限。实际上上个时代既是贫富差距加剧的时代，也是一个腐败横行的时代。当时美国的腐败和反腐也是一个非常有意思的话题，下一讲我就来说一下。


    ### 划重点


    1. 基督教新教在对待贫富问题上很独特，一般宗教都是站在穷人一边，但新教认为，要帮助穷人，但同时要指出他们身上的恶习；

    2. 美国富豪做慈善，宗教起了很大的作用，实际上慈善是把宗教教义用世俗形式激发了。


    ## 18 | 应对赶超带来的问题：美国式反腐


    徐徐郁 · 美国简史30讲


    腐败和反腐在今天的中国还是一个重要话题。美国在19世纪下半期的赶超阶段，也经历了持续的反腐，整个社会都卷了进来。作为这个模块的最后一讲，我来说一下美国当年是怎么反腐的。


    ### 美国的腐败问题


    我前面说过，内战以后到19世纪末是美国的大赶超时期。但物质力量高歌猛进的同时，整个社会层面出现了严重问题。马克·吐温写过一本书，叫《镀金时代》。现在讲美国史很多人就用这个名字来形容当时的美国，表面上看金光闪闪很耀眼，实际上只是镀了一层金，里面的东西又腐朽又浅薄。尤其是，美国当时的腐败非常严重。我不展开说了，这里就说一个典型案例——特威德腐败案。


    特威德是当时一个政客，当选美国国会议员和纽约州议员。这个人能量很大，基本上控制了整个纽约市，人称“特威德老板”。他不光贪腐的金额特别巨大，在手段上也是无法无天。比如他主导的纽约法院大楼建造工程，一开始的报价是25万美元，结果完工的时候一算造价居然达到1000多万美元。


    你可能听到这数字没什么概念，我就告诉你，就在差不多同一时期，美国从俄罗斯手里买下整个阿拉斯加，只花了720万美元，不到这座大楼造价的一半。你再看里面的各种名目的假账就更让人匪夷所思了：账上说花了多少钱买椅子，后来一算如果真花这么多钱买椅子的话，那把这些椅子连在一起可以排成17英里长，这就太离谱了。还有更离谱的，他的账本上说是工程雇了一个木匠，账本上居然写着付他一个月36万美元，相当于今天的500万美元。所以这笔1000多万美元的工程款其实大部分都被特威德和他同伙转走了。


    ### 从腐败到清廉


    一般历史学家要谈这个问题，首先会指出美国反腐的大背景。那就是进步主义运动，这个运动很重要，但也很复杂，你记住一点就行，在效率和公平之间，进步主义运动更强调公平，推动社会改革。对于反腐来说，这个大背景当然很重要。但它充其量只是提供了一种氛围和环境，美国式反腐的关键在别的地方。


    比如媒体作用就很重要。在美国媒体的独立性很强，很多腐败案的内幕都是由媒体曝光的。像刚才讲的特威德案件，就是著名的《纽约时报》报道出来的，并且拒绝了一大笔封口费。除了这种大报以外，还有很多廉价的小刊物也在发布各种腐败和社会丑闻。当时西奥多·罗斯福总统很重视它们，给予了一个专门的名字，叫“黑幕揭发者”。这些黑幕揭发者在美国反腐过程当中，可以说立了大功。


    但是，最关键的还不是这个。你想，腐败是什么？从根本上说腐败就是把公权力用于私利，我们今天讲的权力寻租，权钱交易，都是公权私用。所以美国的腐败和其他国家一样，根子都是公权力运用上出了问题。这就说到当时美国的一种政治制度，就是政治分肥，也叫政治分赃。这是怎么回事呢？美国刚立国的时候，像华盛顿这些人都坚持从名门望族中选拔政府官员，但这样的话精英阶层就垄断了政治权力，美国人觉得不符合美国民主政治的价值观。


    > 在一个复杂的组织系统当中，单一目标的实现往往要和实现系统目标结合起来。


    ## 19 | 美国的“中年危机”与海外扩张


    徐徐郁 · 美国简史30讲


    从这个模块开始，我们要讲一下美国的海外扩张。美国在海外扩张方面的路子子和之前的英国、法国、西班牙、葡萄牙这些欧洲列强非常不一样。它基本上没抢多少殖民地，但它的势力和影响渗透到世界各地，形成了一个新型的、没有明确边界的美式帝国。那美国是怎么走上这样一条海外扩张之路呢？那就是这一讲的题目：中年危机和美国海外扩张。


    ### 一百多年前的“中年危机”


    你看到这个题目可能会觉得奇怪，美国是个很年轻的国家啊，立国到现在也才两百多年，怎么就中年危机了呢？我告诉你，实际上美国人说自己中年危机的时候，还是一百多年前，更年轻的时候。


    事情是这样的。1890年美国人口普查局发布了一则公告，说一个世纪以来美国自东向西不断拓殖的那条边界线已经不复存在，西进运动结束。这则公告背后的历史冲击力可太强了。我在前面说过美国的西进运动，对美国作为大国的崛起具有物质和精神上的双重意义。而且100多年的西进给美国人一个习惯性思维，人口多了，工作不够了，就往西去，反正西部有的是没有开垦的土地。但这时候突然发现，向西扩张已经到头了，那接下来怎么办呢？


    我告诉你，这种冲击可不只是心理上的。它有实实在在的表现。我前面那个模块讲过，美国内战以后工农业都经历了高速猛进式的扩张，但到1890年前后，美国人突然发现扩张到头了，工农业的产能出现了巨量过剩。


    我举个例子，美国一共修了5条横贯大陆的铁路，曾经是国内钢铁的主要消费，高峰时期铁路用钢占全国钢铁消费的一半以上。但大铁路建设这时几乎结束了，那这么大的钢铁产能怎么办？所以到1893年，美国进入了一个前所未有的经济危机，大量工人失业，农民破产，而且大规模的罢工还引起军队镇压。美国突然开始担心发生革命了，这是立国之后从没有过的事。所以有人说，美利坚合众国的青年时代已经过去，伴随着负担、困境和焦虑的中年来了。这个说法当年深入人心。


    ### 美国如何应对“中年危机”


    问题是，美国怎么来应对这种中年危机呢？美国国内为此掀起了一次大讨论，在知识界和商界、政界、军界的反复碰撞下，各种意见慢慢都指向了一个方向：继续扩张，但不再是大陆扩张，而是向海洋方向，搞海外扩张。这里我就要提到一个关键人物——阿尔弗雷德·马汉。


    在今天，我们说到海洋战略特别是海军战略思想，如果只能提一个人，那就是马汉。他当时是美国海军的一位上校，但我告诉你马汉实际上不是一名好的职业军人。他自己指挥的军舰几次出现碰撞事故，而且一再逃避出海。但是这个人的视野和战略思维远超常人。1890年的时候他出版了他的成名作《海权对历史的影响》，后来又发表了多种著作和文章，形成了一套海权海洋战略思维。


    那马汉这套理论的逻辑起点是什么呢？起点就是美国生产大量过剩，所以必须向海洋，向海外扩张。那怎么扩张呢？这就涉及一个核心问题，你怎么来看待海洋。要知道，当时的美国实际上是一个大陆国家，大陆国家看海洋很容易把海洋看成是保护国土的屏障，或者是国土向海洋方向的延伸。我们今天经常听到一个词“蓝色国土”，实际上也是典型的大陆思维。马汉说：这不对。海洋应该被看成是一个四通八达的通道，你到了海上就相当到了全世界。这种变化可是根本性的，实际上是你观察的角度变了。从原来的站在陆地看海洋，变成了站在海上看陆地。这就完全是海洋思维了。


    那接下来该怎么办呢？马汉说美国要做到两点：


    - 第一，是建一支强大的远洋海军。海洋不是通道吗？有了远洋海军才能保证我自由利用这个通道；

    - 第二，美国的海外扩张不要像欧洲列强那样去占很多的殖民地，那样做成本太高，因为你占下来以后还要投入人力财力进行管理，反而背了包袱。正确的做法应该是搞要点式扩张，就是只占几个点作为支撑或者是“跳板”，让美国的商品、资本和影响力能够自由进入各个地区。你注意，这里的核心词是自由进入，英语叫
    Free Access，就是我不来占你的地方，但你的地方我想进来就能进来。这个词美国人到今天还在用。


    那这是什么思路呢？其实就是我们俗话说的“不求所有，但求所用”，非常典型的海洋大国思路。在当时正好处于焦虑中的美国人指明了方向，美国要搞海外扩张就是要这么搞，不能像以前大陆扩张那样一块块地占领。所以美国精英阶层很迅速地接受了马汉的思想。


    当然这个过程和一些头面人物的宣扬分不开。这里最出名的是两个人，一个是后来当上总统的西奥多·罗斯福，我前面提到过他；另一个是参议员洛奇，这个人在美国参议院对外关系委员会工作二十多年，对美国外交影响颇大，第一次世界大战以后把威尔逊总统加入国联的事情否掉的就是这个参议员洛奇。这两个重量级人物当时既是大讨论的积极参与者，自己就发表了很多意见和文章，同时又是马汉思想的鼓吹者。


    从这里你也可以理解，马汉的思想，或者说美国这种大讨论最后形成的共识为什么很快就转化为行动。最关键的一点，这种大讨论从一开始就不是几个学者进行的孤立的讨论，而是牵涉了学界、商界、军界和政界，特别是政治精英阶层从一开始就参与在里面。所以一旦形成共识，那动员起来、行动起来特别快。实际上，美国历史上这种大讨论还有好多次，基本都是这个模式。就拿现在的中美关系来说，我告诉你，大约从2015年开始美国国内就进行了两三年的对华政策大讨论，现在美国之所以对我们这么做，就是最近这次大讨论的结果。


    ### 美国具体怎么做？


    不说远了，我们再回到当年那场大讨论。那形成共识后具体美国怎么做呢？主要是三个方面，我简单说一下：


    **一是关税。** 美国内战以后一直用高关税保护国内市场，现在提出来要降低关税。为什么？海外扩张的需求啊。降低关税进口原材料的价格就低，再加上美国世界第一的工业能力，这样的结果就是当时一位美国人说的：“让廉价的美国货征服整个世界”。


    **二是海军。** 19世纪下半期的时候，美国海军一度很差，排在智利、丹麦这些小国的后面，也排在我们清朝海军的后面，有点让人难以想象。但1890年以后美国开始重新拟定发展海军，那以它的工业能力，十多年以后美国海军已经上升到世界第三。


    **三是外交。** 美国通过各种手段，兼并了夏威夷群岛，占领了菲律宾，在太平洋上有了两块跳板。不过这里我要插一句，占领菲律宾对美国来说是有问题的，我后面有一讲会专门说菲律宾的事情。


    你看，这些动作基本上就是在落实前面讲的那些思想性结论。我总结一下，19世纪最后十年，美国在这种“中年危机”的倒逼下，走出了一条不注重占有领土，但注重占有要点，扩张贸易和资本影响的海外扩张道路。顺着这条道路，美国建立起来的帝国形态就和历史上其他帝国很不一样。你看，美国作为一个国家它是有边界，但你要看它实际控制的话，它是没有边界的，无所不在，是一种流动的，以全球为平台的新型帝国。


    我们今天在看美国的时候，不要忘了，这种新型帝国在历史上的原点，就是我们这一讲说的“中年危机和美国海外扩张”。


    ### 划重点


    美国作为一个国家它是有边界，但你要看它实际控制的话，它是没有边界的，无所不在，是一种流动的，以全球为平台的新型帝国。

