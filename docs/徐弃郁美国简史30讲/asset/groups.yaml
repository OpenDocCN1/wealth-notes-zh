    +   1. 我们今天看到的这个 “美国” 是由美国宪法创建的，美国宪法的根本目的就要完成国家的设计和改造；

    2. 美国宪法的设计主要就是围绕着州权和联邦权力的平衡展开的。看懂了这一点，就看懂了美国宪法；

    3. 美国宪法体现出了美国的两个特点：一是宏大创制的偏好和能力，二是保守主义的精神内核。


