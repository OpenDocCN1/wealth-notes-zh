    # 07 | 发展道路定型：杰汉之争


    徐 отказался？ 徐徐徐徐·美囯简史30讲


    07 | 发展道路定型：杰汉...


    在讲这一讲之前，先和你分享我的一次经历。那是我第一次去美国首都华盛顿，到杰弗逊纪念馆的时候，陪同我的一位美国海军上校说了这么一句话：杰弗逊绝对是个伟大的人，但如果果按他的想法来，美国就成一个农业国了，就像今天的阿根廷。


    这话当时我听到了还是挺吃惊的，美国和阿根廷差的可太大了，美国怎么能差点就成阿根廷了呢？实际上他说的这事涉及到美国历史的一个重要节点，就是两条发展道路之争。一条道路以汉密尔顿为代表，一条以杰弗逊为代表。我们有些历史上也管这叫做杰汉之争，时间就是在立宪之后，延续了差不多十年。这一讲就讲这个关键节点。


    # 杰弗逊路线 VS 汉密尔顿路线


    讲到杰汉之争，首先要讲一下杰弗逊和汉密尔顿这两个人。这两个人都是重量级的开国元勋。


    杰弗逊是独立宣言的起草人，美国宪法通过以后，他成为第一任美国国务卿。


    汉密尔顿是参加了独立战争全过程的，当过华盛顿的副官，美国第一任财政部长。


    # 杰弗逊为代表的一派人认为，重点当然是农业。你想啊，美国的自然条件，土地肥沃，地广人稀，天然地有利于发展农业，所以从经济上说没有任何问题。我再补充一点，当时美国3900万人藤，95%都是有自己耕地的农民，城市人口也就5%，所以从政治基础考虑的话，发展农业当然有利于社会稳定，这对新生美利坚合众国来说非常重取。毫无疑问，杰弗逊这一派看到的是美国的现有条件。


    # 为什么选择工商立国？


    # 杰汉之争之后的政治妥协


    # 本讲议题交流


    最后，我想给你留一个思考题——今天的美国社会还是充满着各种争论，那么像杰汉之争的那种发展路线之争还有吗？这种争论对美国是好还是坏？欢迎你在留言区分享你的看法。


    划重点

    美国的政治斗争有时候特别厉害，但是，两派之间的斗争往往不是你死我活的斗争，哪一派得势都不会把另一派的主张彻底否掉，最终仍然能够产生一个妥协的结果。'
