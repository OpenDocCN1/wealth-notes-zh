    ## 23 | 谨慎的“大棒”：美国如何跻身大国政治？


    徐弃郁 · 美国简史30讲


    23 | 谨慎的“大棒”：美国如何跻身大国政治？


    这一讲我要说一下美国怎么跻身于大国政治的。


    ### 美国如何跻身大国政治？


    我说，当然有这个问题。因为成为大国和加入大国政治是两回事。一般我们说大国指的是什么？指的是它的实力。但大国政治里面的大国指的是什么呢？指的是它的影响力。几百年来，大国政治从来就是少数几个能够影响全局的大国凑在一起，相互之间搞对抗、搞联合、搞平衡，就好像一个无形的俱乐部。它们互相最清楚，谁是我们中的一员，谁已经出局。世界格局怎么发展，很大程度上就是大国政治的结果。


    那美国是什么情况？我前面讲的，从华盛顿告别演说到门罗主义，到英美大换班，美国百年外交走的都是一条孤立主义道路，眼睛就盯着西半球，自己家门口这一亩三分地。所以即使它经济实力已经是世界第一了，但影响力不行，大国政治还没有它的份儿。


    美国后来进入大国政治这个圈，实际上走了一条很特殊的道路。我们说之前新成员是怎么进入的？基本上是靠把老成员干倒。就好像德国，统一战争期间接连打败奥地利和法国这两个大国，那么啥也不用说了，肯定是这个俱乐部中的一员。但美国不是，美国是通过调停其他大国的矛盾来确立自己的大国地位的。


    这里我就要说到一位美国总统：西奥多·罗斯福，就是老罗斯福。这个人不光历史地位重要，而且非常有特色。我在加餐里面会专门讲他。老罗斯福喜欢引用一句谚语：“说话要温和，但手里要有一根大棒。”后来我们老是用“大棒政策”来形容美国，因为它动不动就搞军事干涉，挥舞大棒。但我这里要给你提个醒，千万不要拿现在的美国来套当时的美国。当时美国的“大棒政策”可不是动不动就开战，而是把“大棒”拿在手里，让人看见，在这个基础上，它再开Las极细的外交，最大限度地实现自己的利益和国际地位。所以“大棒政策”实际上不是直接用“大棒”，而是间接地使用实力。


    ### 老罗斯福的两次关键调停


    光这么说你可能觉得有点抽象。我们就来看一下老罗斯福的两次关键的调停。


    #### 第一次调停：摩洛哥危机


    这个事件特别重要，可以说是通往第一次世界大战的第一步。详细过程我不多说了，你只要记住这次危机是为了争夺摩洛哥，英法为一方，德国为另一方。德国要求召开一次国际大会解决摩洛哥问题，英法坚决不同意，双方僵在那里，已经开始战争威胁了。


    这个时候老罗斯福出面调停。你可能会问，那英法德这些国家为什么会认他这个调停人资格呢？很简单：


    -   第一，美国在摩洛哥利益少，而且美国不是任何一个欧洲国家的盟友，地位比较超脱。他来调停双方都能接受；

    -   第二，更重要的是，美国此时的实力摆在那里，几年前刚刚轻松地打败西班牙，“大棒”在手，资格就有。


    我再说他具体怎么做。老罗斯福第一步先支持德国的立场，要求英法同意召开国际大会。这个时候，英法和德国差不多是势均力敌，所以这两个国家就担心，如果不答应的话，老罗斯福会一怒之下帮德国，那只好同意开大会。这样一来，第一回合德国胜利。所以当时很多国家包括德国在内，都觉得美国是向着德国的，但等到大会真开起来了，大家发现美国在具体问题上是支持英法的。


    你看，这就是老罗斯福的调停细致的一面，或者说白一点，狡猾的一面。德国不是要开大会吗？美国支持。但大会开起来以后，对不起，具体问题按英法的方案解决，德国最后吃了大亏。这种结局英法当然感谢美国，那德国呢？开大会这种解决方式是它自己要求的，美国帮它实现了，即使最后吃亏也无法怪美国。


    这次调停对美国来说可是太重要了。要知道，当时国际政治的中心是在欧洲，英法德又是这中心最主要的三大国，最后让美国来调解它们的矛盾。这无形当中美国就具备了仲裁者的地位。这是从来没有过的，美国由此进入大国政治。


    #### 第二次调停：日俄战争


    我们都知道，原因是争夺我们中国东北。美国从维护自己在中国“门户开放”出发，实际上是支持日本。因为呢？因为俄罗斯已经借着八国联军侵华的机会独占了我们东三省，而且实行关门政策，所以要日本来平衡俄国。


    但是美国的精明在于，它虽然暗中支持日本，但公开表现得像一个裁判员。怎么做的？美国在战争一开始就向各国发照会，核心意思是强烈中立，俄日战争局部化。说白了，你们两家要打就在东北打，别打到其他地方把我们几家在华利益打坏了。你看，这实际上体现了列强在华利益的最大公约数，像英法德这些国家当然都赞成。所以美国这次牵头就是立规则，是裁判。


    那仗打到后来，日本在海上和陆上都取得胜利，俄罗斯舰队几乎全军覆没，但日本的资源差不多了也打光了，双方都精疲力竭，都想早点结束战争。老罗斯福就在等这个时候，对日本说你不是想结束战争吗？我来调停，但有条件，你得同意在中国东北保持“门户开放”，而且得承认美国对菲律宾的统治。日本当然都答应。


    这时老罗斯福就正式出面，把日俄两国代表请到美国一个叫朴茨茅斯的城市进行调停。最后结束日俄战争的合约就叫《朴茨茅斯和约》。那之后日本在中国势力不是上升了吗？老罗斯福在这次调停之后不久，就派出一支有16艘装甲舰的舰队，外号“大白舰队”环球巡航一次。什么意思？这就是展示自己的大棒，不动声色地敲打日本。


    所以你看，老罗斯福的调停可不是简单地当和事佬，而是有关键、有敲打，外加立规则，调停只是手段，美国的利益和地位才是目的。可以说，通过这两次调停，美国分别在欧洲和亚洲确立了自己的国际地位，从此进入了大国政治这个俱乐部。不带美国玩已经不可能了。


    ### 本讲总结


    到这里，这一讲已经基本说完。最后总结两条：


    第一条，实力要变成影响力，或者说地位，需要有一个兑换的过程。在这个过程中，路径选择很重要，技巧也很重要。美国就是通过大国调停这个路径，加上前面说的老罗斯福那种精明的外交手腕，非常迅速地把实力兑换成了国际地位，而且其他国家的反弹极小。


    第二条，调停别人的矛盾往往是实现自己利益的捷径。但在错综复杂的利益关系当中，成功的调停可不是简单地走平衡，而是创造平衡。美国在两次调停当中，实际上都把自己的力量押了上去，创造了一种新的平衡，这才实现了成本最低、效益最大的结果。那这种创造平衡的思路不仅在国际政治里有价值，在现实生活当中同样有价值。


    好了，美国怎么跻身大国政治我已经讲完，下一讲要说美国第一次领导世界的尝试，那就是一战以后威尔逊总统的十四点计划。


    ### 本讲议题交流


    这一讲的最后，我要留一个思考题，今天还有没有哪个国家通过调停其他国家矛盾来突出自己地位的，你怎么看待这个问题？欢迎在留言区分享你的看法。


    #### 划重点


    1.  实力要变成影响力，或者说地位，需要有一个兑换的过程。在这个过程中，路径选择很重要，技巧也很重要；

    2.  调停别人的矛盾往往是实现自己利益的捷径。但在错综复杂的利益关系当中，成功的调停可不是简单地走平衡，而是要创造平衡。


    # 徐弃郁 · 美国简史30讲


    美国人为什么那样想？


    ## 24 | 第一次设计世界：威尔逊的“十四点”


    徐弃郁 · 美国简史30讲


    24 | 第一次设计世界：威尔逊的“十四点”


    我们今天看美国电影，会发现超级英雄拯救世界这类题材经久不衰，主角可以是超人、蜘蛛侠、钢铁侠，或者是美国队长。全世界最喜欢拍这类电影的就是美国。你可不要小看，这实际上折射出美国一种精神层面的东西，那就是美国对这个世界负有特殊使命，注重领导地位。这种理念扎根在美国的基督教基因里面，这我在前面第二讲专门讲过。你可以想象，如果一个国家的精神层面里有这种理念，那么当自己有了足够的实力，外部又有机会的时候，那一定会向世界领导权发起一次爆发式的冲击。这一次讲要说的就是这样一次冲击——威尔逊的“十四点”方案。


    ### 威尔逊和《世界和平纲领》


    你如果看一些历史著作，会发现历史学家一般对“十四点”方案都特别重视，认为它是有划时代意义的。那它到底是什么呢？就是第一次世界大战结束之前，美国总统威尔逊发出的一份和平方案，真正的题目叫《世界和平纲领》，因为包含了十四点内容，所以被称为“十四点”方案。


    那它为什么这么重要呢？我们说一般和平方案就是讲怎么结束战争，哪几个谈判条件。但威尔逊的“十四点”方案可不光是讲怎么结束战争，它实际上宣布了一套新的国际规则，意思是你们几百年来的那套东西都是错的，大家现在要按我说的这些来做。这是什么？这是重新设计世界。


    那么这个世界应该是什么样的呢？有这么三个关键点——


    -   第一，不能再搞秘密外交，所有协约必须公开，这样罪恶的东西就藏不住了；

    -   第二，民族自决，就是民族要按自己的意愿来治理自己，其他大国的统治不能强加于它们；

    -   第三，建立一个国际联盟，国家不分大小都要保证它们的独立和领土完整。


    所以你看，它是一种“对还是不对”的道德主义思路，而不是老欧洲那种“有效还是无效”的现实主义思路，美国精神层面的那种基督教伦理表达得非常明显。这就是为什么“十四点”方案在历史上的地位那么特殊。


    从另外一个角度说，美国抛出“十四点”方案本身也说明它有底气。关于这个底气我们以前是这么解释的，就是第一次世界大战爆发以后，原来作为世界中心的欧洲打得元气大伤，而美国一开始3年不参战，大发战争横财，从战前的债务国，变成了债权国，像英法这些原来的债主现在反而欠美国的钱。这些当然是事实，而且美国的战争财发得的确不小。比如美国军火出口增加了100多倍，其他的商品出口也都至少翻番，最后算下来美国总的贸易顺差在3年时间里增长了3倍多。


    但我也要告诉你，横财从来不可能是决定性的，个人是这样，国家也是这样。美国有底气的真正原因是它通过战争完成了实力的兑换。为什么这么说呢？你想，美国的经济实力20年前就已经是世界第一，但没人知道这些经济实力能不能转化成军事力量。所以只是潜力，而不是实力。


    德国当时一位高层人士就说根本不用怕美国，为什么呢？他的话很有戏剧性，说美国“军事上等于零，除了零还是零”。但是美国真的参战以后，动员能力完全超出大家的想象。它一开始只有20多万军队，但几十个月的时间内，光是运到欧洲的美军就已经超过了200万，海军规模也超过了英国，成为世界第一。


    更重要的是，在当时双方打得筋疲力尽的情况下，美国这样一个超级码头投入，战争结果一下子就决定了。这说明，美国已经成了大国之间当仁不让的仲裁人，它的大国崛起进程到了一个爆发点。这个才是它真正的底气。


    ### “十四点”方案为什么失败?


    好了，美国这么有底气，推出这么一个划时代的和平方案，结果怎么样呢？一开始全世界轰动，这么道德主义的和平方案大家也是第一次见，所以很多人把“十四点”方案看成福音一样，把威尔逊本人更是看成救世主。


    我告诉你，就在我们中国，北京各高校的学生跑到美国使馆前去游行，喊的口号是什么？是“威尔逊总统万岁！”陈独秀在杂志的发刊词里写：美国总统威尔逊可算是现在世界上第一个好人。其实在欧洲也一样，有些农村里，农民居然把威尔逊的画像挂起来，每天对画像膜拜。这种轰动效应用今天的话来说都有些魔幻了。


    当然，热闹过后，“十四点”方案后来的命运你肯定知道，失败。美国这次也没能当上世界领袖。为什么会是这样一个结果，后来的历史学家吵得很厉害。我这里只讲关键原因。


    #### 最关键的是，世界格局的权力转移还没完成


    欧洲原来是中心，后来虽然美国的实力变成世界第一，但实力兑换成影响力是有滞后效应的，美国和欧洲在影响力方面的差距当时还没有拉开。这个时候美国就要设计世界，特别是触及到了欧洲国家核心利益的时候，那反对力量一定特别大。


    我举个例子，“十四点”方案里面第二条就是公海在战时和平时候都要保持绝对开放。这就直接触碰了大英帝国的底线，为什么？因为大英帝国的基础就是制海权，如果公海完全自由那还要制海权干嘛？要知道，第一次世界大战之所以德国最后耗尽力量，是因为英国海军牢牢封锁着海洋，德国连粮食都运不进来，只能集体挨饿。所以英国强烈反对。大英帝国到这时虽然已经不如美国了，但差距还没那么大，所以美国只能后退。“十四点”方案里最先放弃的就是这一条。这就是世界权力转移还没有完成。


    #### 第二个原因，美国还没有做好准备


    美国参战的时候，威尔逊的道德主义大旗很管用，一下子激发了美国那种基督教普世情怀，但我告诉你，全民性的热情一般都是短暂的。仗一打完，老百姓过日子的想法就回来了。美国的环境太好了，自己家底雄厚，和其他大陆又隔着大洋，很安全，所以美国人很容易就觉得为什么要去管其他地方的事情呢？而且当世界领袖是要受约束的，美国人普遍不愿意自己国家受约束。即使到了今天，你会发现美国很容易就会退出一些国际组织，像特朗普政府现在就退出了好几个，就是不想受约束。那在第一次世界大战刚结束的时候，美国人这种心理就更强了。所以美国自己也没有完全做好准备。


    最后还要讲一下威尔逊的个人因素。我前面说过，“十四点”方案带有很重的宗教伦理和道德主义色彩，这一点和威尔逊总统个人很有关系。基辛格在《大外交》里面专门有一章讲到威尔逊的外交，有兴趣可以看一下，我这里就不讲了。


    我要说的是，威尔逊有个很大的问题，就是不善于团结别人。他基本上没有做国内反对派的工作。他是民主党，但组团去参加巴黎和会的时候，居然团里全部是民主党，没有共和党。你知道美国是两党制，他这么干就把共和党人全部推到对立面去了。


    最后的结果就是，威尔逊千辛万苦把“十四点”方案的大部分都塞到和约里，签好了和约，但回到国内，美国国会的反对派却把这个和约否决了。威尔逊前功尽弃。


    ### 本讲总结


    说到这里，美国的“十四点”方案，或者说它争取世界领导地位的第一次努力就讲完了。美国的这次宏大设计和最后的失败很容易让我们想起罗胖跨年演讲里的诗：你有计划，但世界另有计划。


    不过，对美国来说，这次努力不白费，很多教训实际上后来它都吸取了，只需等待下一次设计世界的机会。到那时，欧洲这个中心区将被彻底削弱，美国的实力优势将达到历史的峰值，造成这种效果的就是我们下一讲要说的内容，第二次世界大战。


    #### 划重点


    1.  第一次世界大战让美国通过战争完成了实力的兑换，成了大国之间当仁不让的仲裁人，它的大国崛起进程到了一个爆发点；

    2.  威尔逊的“十四点”方案实际上宣布了一套新的国际规则；

    3.  “十四点”方案提出后，因为世界格局的权力转移还没完成，外加美国还没做好准备，最终还是失败了。


    # 徐弃郁 · 美国简史30讲


    美国人为什么那样想？


    ## 25 | 第二次世界大战：美国压倒性优势的秘密


    徐弃郁 · 美国简史30讲


    25 | 第二次世界大战：美国压倒性优势的秘密


    美国通往世界霸权的路上，最重要的事情应该算是第二次世界大战。德意日三个法西斯国家投降，欧洲一片废墟，苏联崛起，美国夺得世界霸权，历史书基本上都是在这么说的。但问题是，为什么二战能够确立美国霸权？


    答案就是，美国在二战中体现出一种前所未有的压倒性优势：它同时援助各大盟国，同时在欧洲和太平洋两大主战场作战，而且要求对手无条件投降。这种结束战争的方式，也是美国提的。英国首相邱吉尔想不同意，但根本没办法。


    那么为什么美国此时有这样压倒性的优势？有人说是因为美国的家底最厚，生产能力最强。这个话有道理。你看太平洋战场，日本偷袭珍珠港把美国彻底拖进了战争。现在很多人说日本人疯狂，孤注一掷，低估美国。但实际上当时日美海军实力对比还是有利于日本的，日本有10艘航母，美国只有7艘。但在以后的4年时间里，日本砸锅卖铁总共造了20艘不到的航母，美国造了多少？147艘。完全是碾压式的，这仗都无法打。


    但是我告诉你，这只是表面现象。美国能形成这样压倒性的优势，最大的秘密在于它的宏观组织能力。换句话说，它把各种资源用一种系统工程的思路组织起来，实现了质量和量的积累最大化。


    ### 美国的军工生产


    实际上不光是日本这些国家，连美国自己都没有想到它的军工生产会有这么大的爆发式增长。有些学者专门比较了几个国家的战时生产效率。结论是日本不如德国，德国不如英国。但英国和美国比又差远了，1944年美国从事军工生产的工作人不到英国的两倍，但产量是英国的4倍。这种差距说到底，就是组织能力的差距。


    彼得·德鲁克写过一本书，叫《公司的观念》，详细地说了一种组织优势对美国军工的作用，我这里不详细说了。


    ### 美国的军队结构


    美国和欧洲、亚洲都隔着大洋，所以美国一开始不重视陆军，觉得应该把资源省下来，主要放在海军和空军上。当时罗斯福总统就特别希望建一支超大规模的战略空军，光靠轰炸就把德国炸投降。马歇尔坚决反对，他的意思是，军队是一个大系统，绝对不能用这种“单打一”的做法，各部分必须均衡才能完整效能发挥出来。


    ### 本讲总结


    到这里你也就明白了，第二次世界大战当中美国为什么能够爆发出这么巨大的优势。美国的成功并不是一般想象的那样光靠砸钱，光靠拼资源，而是通过非常先进的、系统化的组织管理，把自己在体量、规模、资源和技术方面的整体优势发挥到一个新的高度。


    ### 本讲议题交流


    这一讲的最后，我给你留一道思考题：你看到美国在哪些地方还表现出这种系统化的组织管理能力？欢迎在留言区分享你的看法。


    好了，美国为什么赢得第二次世界大战就讲完了，下来讲要说到美国怎么第二次设计世界，确立自己的霸权。


    #### 划重点


    美国的成功并不是一般想象的那样光靠砸钱，光靠拼资源，而是通过非常先进的、系统化的组织管理，把自己在体量、规模、资源和技术方面的整体优势发挥到一个新的高度。


    ## 26 | 第二次设计世界：美国的战后安排


    徐弃郁 · 美国简史30讲


    26 | 第二次设计世界：美国的战后安排


    美国获得世界霸权的节点很好找，就是二战结束。我前面讲过，美国在一战以后试图设计世界但没有成功。20多年以后，第二次世界大战又给了美国一次设计世界的机会，二战结束后，结果成功了。问题来了，为什么这次它能够成功？


    ### 美国战后的战略和策略


    关于这个问题，不少历史书都给出了答案，那就是第二次世界大战给美国带来了前所未有的优势地位。欧洲已经变成一片废墟，英法这些老牌帝国主义国家不光打仗要靠美国，战后的重建也得靠美国。而美国的实力比以前更强大，又有了原子弹，等等。核心意思就是，这次实力对比更有利，所以美国第二次设计世界成功，确立世界霸权。


    这种说法当然没有错。但如果光讲这些是有问题的。问题在哪里呢？就是它不理解国际政治。国际政治里面，实力是最重要的，但它绝对不是唯一重要的。实际上，美国在有了更强的实力地位以后，又在战略策略上下了相当大的功夫，才保证了它能够成功地设计并且推出了一个全新的国际体系。


    这里就要说到罗斯福总统了。富兰克林·罗斯福总统你肯定了解，用“罗斯福新政”成功应对大萧条的就是他，第二次世界大战中领导美国的也是他，唯一当了四届总统的也是他。罗斯福领导美国参加二战的时候，威尔逊当初失败的尝试一直在他胸中装着，而且他手下的官员也经常谈当年的威尔逊。所以你仔细看，罗斯福在战后重新设计世界的问题上，有些地方和威尔逊很像，也是以“对还是不对”那种道德主义来论事。但在具体操作方面明显吸取了威尔逊的教训。


    比如说罗斯福非常重视做国内的工作，让美国人做好当世界领导的心理准备。这一很关键。另外在国际政治方面，他们的战略策略也很大不一样。


    比如说时机。威尔逊是在参战半年多以后，抛出“十四点”方案，到战争结束以后再去和其他国家谈判。那时，人家最需要美国的时间已经过去了，所以谈得特别艰难。罗斯福呢？战后世界新秩序的构想他很早就开始推。就拿建立联合国来说。1941年8月，他在一艘军舰上和英国首相邱吉尔会晤，发表著名的《大西洋宪章》，正式提出建立联合国的构想。这个时候，美国离正式参战还有4个月呢。那建立联合国那些具体的事情什么时候敲定下来的？德国日本投降之前，战争没有结束，这些战后构想就落实了。什么意思？要想让其他国家接受美国设计世界，必须在其最需要美国的时候。


    第二点，不断扩大权力。我这里要插一句，国际政治里面实力和权力是两个概念，什么是权力？就是能让人按你说的做。所以实力要转化成权力。美国在第一次世界大战时就吃了这个亏，实力很强，但没转化成权力。罗斯福不一样。罗斯福总统为打败法西斯作出了巨大贡献，但他在这个过程中绝对没有忘记扩大美国的权力。比方说，法国沦陷以后，英国和德国死磕，有点撑不住了，罗斯福送了英国50艘旧的驱逐舰，以解燃眉之急。但他不是白送的，英国在西半球的军事基地换给了美国了。另外，你如果留心现在的中东局势，会发现世界上最大的石油国家沙特阿拉伯和美国的关系特别铁。这是当时，罗斯福瞒着英国，和沙特的酋长在一艘美国军舰上会晤，明确美国对沙特提供保护。从那个时候开始，美国掌握世界石油的命脉。你看，不断扩大权力，日后设计世界就有资本。


    最后我还要讲一点，那就是善于协调其他大国。我在第二十四讲里说过，威尔逊的一个大问题就是他不善于团结人，而罗斯福特别善于团结人，而且能够争取其他大国的支持。我前面说，美国的战后安排都是在战争时期敲定的，因为这时大家最需要美国。但我说回来，这些国家包括苏联在内，对美国的很多构想确实是赞同的。为什么？因为罗斯福善于在各种利益里面发现最大公约数，他提出来的东西大家都看得见好处。所以美国这次设计世界或多或少都得到了其他大国的支持。这一点，当年的威尔逊根本做不到。


    所以你看，美国能够重新设计世界并确立自己的霸权地位，可不光是因为实力超强，还有各种精细、长远的战略策略。我们完全可以说，美国二战后的霸权地位是罗斯福这些人一针一线织起来的。


    ### 如何设计战后世界？


    听到这里，你可能会问，那美国到底是怎么设计战后世界的呢？这个问题也非常重要。美国这个国家从独立开始，就形成了一种全局创制制度体系的偏好和能力，我管它叫宏大创制能力。这种能力到二战时期可以说达到了顶峰。它主要设计了哪些？


    首先是联合国。我们今天这个世界已经和联合国分不开了，你看新闻随时可能看到有关联合国的消息。而联合国的总体框架结构，安理会五大常任理事国这种设置，都是美国设计的。我就不多说了。


    另外一个是布雷顿森林体系。这套制度主要管国际经济，它没有联合国那么显眼，但对美国称霸世界真正关键的却是它。我多讲一些。


    在二战之前，美国和西方资本主义都经历了大萧条，德意日三个法西斯国家发动战争和这场大萧条很有关系。那二战打到一半的时候，美国就说了，类似大萧条一定要避免，教训太惨痛。怎么避免？就是在国际货币、金融和贸易领域建立起一套制度，每个国家都要按规则来。那怎么让其他国家加入这个制度呢？美国牵头建立两个组织，一个叫国际货币基金组织，一个叫世界银行。只要你加入进来，遵守规则，那么你就可以得到贷款或者援助。因为这一系列的协定是在布雷顿森林这个地方签订的，所以叫布雷顿森林体系。听到这里，你会觉得这很好啊，既稳定了世界，其他国家又可以得到好处。美国是不是在搞什么骗着呢？


    我告诉你，真不是骗着，美国这一套东西当时确实对很多国家有利。但还有后半句话，最有利的还是美国自己。怎么个有利法？第一点，美国生产过剩，让国际市场尽快恢复元气对美国的出口有利。第二点，布雷顿森林体系确立了美元的中心地位。这一点我在后面第二十八讲还要专门讲。第三点，国际货币基金组织和世界银行这两个机构不是美国一家独资，而是好多国家出资，讲穿了也属于众筹。但美国的份额最大。比方说国际货币基金组织，当时出钱的前三名，第一是美国，27.5亿美元；第二是英国，13.0亿美元；第三你可能想不到，那就是中国，5.5亿美元。你看，美国的优势非常明显。这样它在这两个机构里面就有一票否决权。所以实际上美国是通过出一些钱，获得了支配大得多的资金的权力，更重要的是规则权在手里了。美国霸权地位真正的起点就在这里。


    ### 本讲总结


    讲到这里，我们实际上可以看出美国这一整套制度设计最关键的东西了。贯穿于这次设计的是一个理念，那就是当时美国财政部长摩根索说的，叫“开明的自私自利”，这个词非常关键。什么意思呢？就是为了美国的利益，但同时大家都能得到好处。美国呢，通过集各国之力，也就是我上面讲的国际众筹，构建了一整套新的国际制度。它自己控制了这里面的最大权力。


    所以，我们今天在看世界的时候，不要忘记，左右这个世界的制度和规则就是从我这一讲说的那个时候开始的，这也是美国世界霸权的开始。


    好，这一讲就讲到这里，我们下一讲就要讲美国确立世界霸权的另一个重大事件，就是冷战的开始。


    #### 划重点


    美国能够重新设计世界并确立自己的霸权地位，可不光是因为实力超强，还有各种精细、长远的战略策略；美国在有了更强的实力地位以后，又在战略策略上下了相当大的功夫。

