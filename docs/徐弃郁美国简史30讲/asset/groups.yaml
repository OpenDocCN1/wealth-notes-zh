    ## 23 | 谨慎的“大棒”：美国如何跻身大国政治？


    徐弃郁 · 美国简史30讲


    23 | 谨慎的“大棒”：美国如何跻身大国政治？


    这一讲我要说一下美国怎么跻身于大国政治的。


    ### 美国如何跻身大国政治？


    我说，当然有这个问题。因为成为大国和加入大国政治是两回事。一般我们说大国指的是什么？指的是它的实力。但大国政治里面的大国指的是什么呢？指的是它的影响力。几百年来，大国政治从来就是少数几个能够影响全局的大国凑在一起，相互之间搞对抗、搞联合、搞平衡，就好像一个无形的俱乐部。它们互相最清楚，谁是我们中的一员，谁已经出局。世界格局怎么发展，很大程度上就是大国政治的结果。


    那美国是什么情况？我前面讲的，从华盛顿告别演说到门罗主义，到英美大换班，美国百年外交走的都是一条孤立主义道路，眼睛就盯着西半球，自己家门口这一亩三分地。所以即使它经济实力已经是世界第一了，但影响力不行，大国政治还没有它的份儿。


    美国后来进入大国政治这个圈，实际上走了一条很特殊的道路。我们说之前新成员是怎么进入的？基本上是靠把老成员干倒。就好像德国，统一战争期间接连打败奥地利和法国这两个大国，那么啥也不用说了，肯定是这个俱乐部中的一员。但美国不是，美国是通过调停其他大国的矛盾来确立自己的大国地位的。


    这里我就要说到一位美国总统：西奥多·罗斯福，就是老罗斯福。这个人不光历史地位重要，而且非常有特色。我在加餐里面会专门讲他。老罗斯福喜欢引用一句谚语：“说话要温和，但手里要有一根大棒。”后来我们老是用“大棒政策”来形容美国，因为它动不动就搞军事干涉，挥舞大棒。但我这里要给你提个醒，千万不要拿现在的美国来套当时的美国。当时美国的“大棒政策”可不是动不动就开战，而是把“大棒”拿在手里，让人看见，在这个基础上，它再开Las极细的外交，最大限度地实现自己的利益和国际地位。所以“大棒政策”实际上不是直接用“大棒”，而是间接地使用实力。


    ### 老罗斯福的两次关键调停


    光这么说你可能觉得有点抽象。我们就来看一下老罗斯福的两次关键的调停。


    #### 第一次调停：摩洛哥危机


    这个事件特别重要，可以说是通往第一次世界大战的第一步。详细过程我不多说了，你只要记住这次危机是为了争夺摩洛哥，英法为一方，德国为另一方。德国要求召开一次国际大会解决摩洛哥问题，英法坚决不同意，双方僵在那里，已经开始战争威胁了。


    这个时候老罗斯福出面调停。你可能会问，那英法德这些国家为什么会认他这个调停人资格呢？很简单：


    -   第一，美国在摩洛哥利益少，而且美国不是任何一个欧洲国家的盟友，地位比较超脱。他来调停双方都能接受；

    -   第二，更重要的是，美国此时的实力摆在那里，几年前刚刚轻松地打败西班牙，“大棒”在手，资格就有。


    我再说他具体怎么做。老罗斯福第一步先支持德国的立场，要求英法同意召开国际大会。这个时候，英法和德国差不多是势均力敌，所以这两个国家就担心，如果不答应的话，老罗斯福会一怒之下帮德国，那只好同意开大会。这样一来，第一回合德国胜利。所以当时很多国家包括德国在内，都觉得美国是向着德国的，但等到大会真开起来了，大家发现美国在具体问题上是支持英法的。


    你看，这就是老罗斯福的调停细致的一面，或者说白一点，狡猾的一面。德国不是要开大会吗？美国支持。但大会开起来以后，对不起，具体问题按英法的方案解决，德国最后吃了大亏。这种结局英法当然感谢美国，那德国呢？开大会这种解决方式是它自己要求的，美国帮它实现了，即使最后吃亏也无法怪美国。


    这次调停对美国来说可是太重要了。要知道，当时国际政治的中心是在欧洲，英法德又是这中心最主要的三大国，最后让美国来调解它们的矛盾。这无形当中美国就具备了仲裁者的地位。这是从来没有过的，美国由此进入大国政治。


    #### 第二次调停：日俄战争


    我们都知道，原因是争夺我们中国东北。美国从维护自己在中国“门户开放”出发，实际上是支持日本。因为呢？因为俄罗斯已经借着八国联军侵华的机会独占了我们东三省，而且实行关门政策，所以要日本来平衡俄国。


    但是美国的精明在于，它虽然暗中支持日本，但公开表现得像一个裁判员。怎么做的？美国在战争一开始就向各国发照会，核心意思是强烈中立，俄日战争局部化。说白了，你们两家要打就在东北打，别打到其他地方把我们几家在华利益打坏了。你看，这实际上体现了列强在华利益的最大公约数，像英法德这些国家当然都赞成。所以美国这次牵头就是立规则，是裁判。


    那仗打到后来，日本在海上和陆上都取得胜利，俄罗斯舰队几乎全军覆没，但日本的资源差不多了也打光了，双方都精疲力竭，都想早点结束战争。老罗斯福就在等这个时候，对日本说你不是想结束战争吗？我来调停，但有条件，你得同意在中国东北保持“门户开放”，而且得承认美国对菲律宾的统治。日本当然都答应。


    这时老罗斯福就正式出面，把日俄两国代表请到美国一个叫朴茨茅斯的城市进行调停。最后结束日俄战争的合约就叫《朴茨茅斯和约》。那之后日本在中国势力不是上升了吗？老罗斯福在这次调停之后不久，就派出一支有16艘装甲舰的舰队，外号“大白舰队”环球巡航一次。什么意思？这就是展示自己的大棒，不动声色地敲打日本。


    所以你看，老罗斯福的调停可不是简单地当和事佬，而是有关键、有敲打，外加立规则，调停只是手段，美国的利益和地位才是目的。可以说，通过这两次调停，美国分别在欧洲和亚洲确立了自己的国际地位，从此进入了大国政治这个俱乐部。不带美国玩已经不可能了。


    ### 本讲总结


    到这里，这一讲已经基本说完。最后总结两条：


    第一条，实力要变成影响力，或者说地位，需要有一个兑换的过程。在这个过程中，路径选择很重要，技巧也很重要。美国就是通过大国调停这个路径，加上前面说的老罗斯福那种精明的外交手腕，非常迅速地把实力兑换成了国际地位，而且其他国家的反弹极小。


    第二条，调停别人的矛盾往往是实现自己利益的捷径。但在错综复杂的利益关系当中，成功的调停可不是简单地走平衡，而是创造平衡。美国在两次调停当中，实际上都把自己的力量押了上去，创造了一种新的平衡，这才实现了成本最低、效益最大的结果。那这种创造平衡的思路不仅在国际政治里有价值，在现实生活当中同样有价值。


    好了，美国怎么跻身大国政治我已经讲完，下一讲要说美国第一次领导世界的尝试，那就是一战以后威尔逊总统的十四点计划。


    ### 本讲议题交流


    这一讲的最后，我要留一个思考题，今天还有没有哪个国家通过调停其他国家矛盾来突出自己地位的，你怎么看待这个问题？欢迎在留言区分享你的看法。


    #### 划重点


    1.  实力要变成影响力，或者说地位，需要有一个兑换的过程。在这个过程中，路径选择很重要，技巧也很重要；

    2.  调停别人的矛盾往往是实现自己利益的捷径。但在错综复杂的利益关系当中，成功的调停可不是简单地走平衡，而是要创造平衡。


