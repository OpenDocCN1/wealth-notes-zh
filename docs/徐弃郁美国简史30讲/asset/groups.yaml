    # 26 | 第二次设计世界：美国的战后安排


    徐弃郁·美国简史30讲


    26 | 第二次设计世界：美…


    美国获得世界霸权的节点很好找，就是二战结束。我前面讲过，美国在一战以后试图设计世界但没有成功。20多年以后，第二次世界大战又给了美国一次设计世界的机会，二战结束后，结果成功了。问题来了，为什么这次它能够成功？


    # 美国战后的战略和策略


    关于这个问题，不少历史书都给出了答案，那就是第二次世界大战给美国带来了前所未有的优势地位。欧洲已经变成一片废墟，英法这些老牌帝国主义国家不光打仗要靠美国，战后的重建也得靠美国。而美国的实力比以前更强大，又有了原子弹，等等。核心意思就是，这次实力对比更有利，所以美国第二次设计世界成功，确立世界霸权。


    这种说法当然没有错。但如果光讲这些是有问题的。问题在哪里呢？就是它不理解国际政治。国际政治里面，实力是最重要的，但它绝对不是唯一重要的。实际上，美国在有了更强的实力地位以后，又在战略策略上下了相当大的功夫，才保证了它能够成功地设计并且推出了一个全新的国际体系。


    这里就要说到罗斯福总统了。富兰克林·罗斯福总统你肯定了解，用“罗斯福新政”成功应对大萧条的就是他，第二次世界大战中领导美国的也是他，唯一当了四届总统的也是他。罗斯福领导美国参加二战的时候，威尔逊当初失败的尝试一直在他胸子里装着，而且他手下的官员也经常谈当年的威尔逊。所以你仔细看，罗斯福在战后重新设计世界的问题上，有些地方和威尔逊很像，也是以“对还是不对”那种道德主义来论事。但在具体操作方面明显吸取了威尔逊的教训。


    比如说罗斯福非常重视做国内的工作，让美国人做好当世界领导的心理准备。这一很关键。另外在国际政治方面，他们的战略策略也很大不一样。


    比如说时机。威尔逊是在参战半年多以后，抛出“十四点”方案，到战争结束以后再去和其他国家谈判。那时，人家最需要美国的时间已经过去了，所以谈得特别艰难。罗斯福呢？战后世界新秩序的构想他很早就开始推。就拿建立联合国来说。1941年8月，他在一艘军舰上和英国首相邱吉尔会晤，发表著名的《大西洋宪章》，正式提出建立联合国的构想。这个时候，美国离正式参战还有4个月呢。那建立联合国那些具体的事情什么时候敲定下来的？德国日本投降之前，战争没有结束，这些战后构想就落实了。什么意思？要想让其他国家接受美国设计世界，必须在其...国家最需要美国的时候。


    第二点，不断扩大权力。我这里要插一句，国际政治里面实力和权力是两个概念，什么是权力？就是能让人按你说的做。所以实力要转化成权力。美国在第一次世界大战时就吃了这个亏，实力很强，但没转化成权力。罗斯福不一样。罗斯福总统为打败法西斯作出了巨大贡献，但他在这个过程中绝对没有忘记扩大美国的权力。比方说，法国沦陷以后，英国和德国死磕，有点撑不住了，罗斯福送了英国50艘旧的驱逐舰，以解燃眉之急。但他不是白送的，英国在西半球的军事基地换给了美国了。另外，你如果留心现在的中东局势，会发现世界上最大的石油国家沙特阿拉伯和美国的关系特别铁。这是...时，罗斯福瞒着英国，和沙特的酋王在一艘美国军舰上会晤，明确美国对沙特提供保护。从那个时候开始，美国掌握世界石油的命脉。你看，不断扩大权力，日后设计世界就有资本。


    最后我还要讲一点，那就是善于协调其他大国。我在第二十四讲里说过，威尔逊的一个大问题就是他不善于团结人，而罗斯福特别善于团结人，而且能够争取其他大国的支持。我前面说，美国的战后安排都是在战争时期敲定的，因为这时大家最需要美国。但我说回来，这些国家包括苏联在内，对美国的很多构想确实是赞同的。为什么？因为罗斯福善于在各种利益里面发现最大公约数，他提出来的东西大家都看得见好处。所以美国这次设计世界或多或少都得到了其他大国的支持。这一点，当年的威尔逊根本做不到。


    所以你看，美国能够重新设计世界并确立自己的霸权地位，可不光是因为实力超强，还有各种精细、长远的战略策略。我们完全可以说，美国二战后的霸权地位是罗斯福这些人一针一线织起来的。


    # 如何设计战后世界？


    听到这里，你可能会问，那美国到底是怎么设计战后世界的呢？这个问题也非常重要。美国这个国家从独立开始，就形成了一种全局创建立度体系的偏好和能力，我管它叫宏大创制能力。这种能力到二战时期可以说达到了顶峰。它主要设计了哪些？


    首先是联合国。我们今天这个世界已经和联合国分不开了，你看新闻随时可能看到有关联合国的消息。而联合国的总体框架结构，安理会五大常任理事国这种设置，都是美国设计的。我就不多说了。


    另外一个是布雷顿森林体系。这套制度主要管国际经济，它没有联合国那么显眼，但对美国称霸世界真正关键的却是它。我多讲一些。


    在二战之前，美国和西方资本主义都经历了大萧条，德意日三个法西斯国家发动战争和这场大萧条很有关系。那二战打到一半的时候，美国就说了，类似大萧条一定要避免，教训太惨痛。怎么避免？就是在国际货币、金融和贸易领域建立起一套制度，每个国家都要按规则来。那怎么让其他国家加入这个制度呢？美国牵头建立两个组织，一个叫国际货币基金组织，一个叫世界银行。只要你加入进来，遵守规则，那么你就可以得到贷款或者援助。因为这一系列的协定是在布雷顿森林这个地方签订的，所以叫布雷顿森林体系。听到这里，你会觉得这很好啊，既稳定了世界，其他国家又可以得到好处。美国是不是在搞什么骗着呢？


    我告诉你，真不是骗着，美国这一套东西当时确实对很多国家有利。但还有后半句话，最有利的还是美国自己。怎么个有利法？第一点，美国生产过剩，让国际市场尽快恢复元气对美国的出口有利。第二点，布雷顿森林体系确立了美元的中心地位。这一点我在后面第二十八讲还要专门讲。第三点，国际货币基金组织和世界银行这两个机构不是美国一家独资，而是好多国家出资，讲穿了也属于众筹。但美国的份额最大。比方说国际货币基金组织，当时出钱的前三名，第一是美国，275亿美...第二是英国，130亿美...第三你可能想不到，那就是中国，55亿美...你看，美国的优势非常明显。这样它在这两个机构里面就有一票否决权。所以实际上美国是通过出一些钱，获得了支配大得多的资金的权力，更重要的是规则权在手里了。美...霸权地位真正的起点就在这里。


    # 本讲总结


    讲到这里，我们实际上可以看出美国这一整套制度设计最关键的东西了。贯穿于这次设计的是一个理念，那就是当时美国财政部长摩根索说的，叫“开明的自私自利”，这个词非常关键。什么意思呢？就是为了美国的利益，但同时大家都能得到好处。美国呢，通过集各国之力，也就是我上面讲的国际众筹，构建了一整套新的国际制度。它自己控制了这里面的最大权力。


    所以，我们今天在看世界的时候，不要忘记，左右这个世界的制度和规则就是从我这一讲说的那个时候开始的，这也是美国世界霸权的开始。


    好，这一讲就讲到这里，我们下一讲就要讲美国确立世界霸权的另一个重大事件，就是冷战的开始。


    划重点 美国能够重新设计世界并确立自己的霸权地位，可不光是因为实力超强，还有各种精细、长远的战略策略；美国在有了更强的实力地位以后，又在...'
