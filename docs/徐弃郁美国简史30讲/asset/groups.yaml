    # 21 | 美西战争与 “成功陷阱”


    徐弥郁 · 美国简史30讲


    21 | 美西战争与“成功陷阱”


    如果有人要问，美国打了这么多场战争，最顺手的是哪一场？答案应该是美国进入海外扩张阶段以后，在1898年和西班牙的那场战争，即史称美西战争。我还要告诉你，这场战争不光是美国打得最顺手的一场，也是代价最小、获益最多的一场，效费比最高。但是，这个大便宜也差点让美国陷入一个“成功陷阱”。这是怎么回事呢？


    # 美西战争怎么打起来？


    我们先来看一下美西战争是怎么打起来的。


    表面上看，这两个国家是为了古巴而打。古巴当时是西班牙的殖民地，1895年的时候爆发了何塞·马蒂领导起义，反抗西班牙殖民统治。


    我这里插一句，何塞·马蒂这个名字你可记一下，他虽然很快就牺牲了，但在古巴历史上的地位可以说是至高无上。后来古巴革命领导人卡斯特罗、切·格瓦拉这些人你肯定都熟悉，他们都把何塞·马蒂奉为精神领袖。


    古巴起义以后西班牙肯定去镇压啊，美国人就不干了。美洲是我的地盘，你怎么随随便便就派兵来了。你想，上一致说的美英鸽牌不就是因为英国介入美洲事务，美国借机发飙吗？对世界上大英帝国，美国还是有顾忌的，但对已经衰落了几个世纪的西班牙，美国不放在眼里，该打就会打。而且你从地图上看一下就会发现，古巴离美国的南大门太近了，西班牙军舰在这里让美国很有一种“卧榻之侧，岂容他人酣睡”的感觉。


    不过呢，这只是表面理由，深层原因其实更简单。那就是美国实力正在步入鼎盛，在美洲的主宰地位连英国都默认了，但西班牙这个老朽的殖民帝国居然还占着这么多的殖民地。美国怎么可能不眼红呢？所以机会打一仗，完全符合逻辑。


    好了，讲完战争爆发的原因以后，我还要再说一下这场战争的导火索，那就是扑朔迷离的“缅因”号事件。


    “缅因”号是一艘美国军舰。古巴形势紧张的时候美国把它派过去，说是“友好访问”，实际上就是向西班牙施加压力。到1898年2月15日晚上，停在古巴港口的“缅因”号突然爆炸，舰上354人只有88人生还。


    美国国内舆论一下子炸开了，几乎所有的报纸都把矛头指向西班牙。西班牙当然不承认，说这是古巴起义军炸的，为了把美国拖入和西班牙的战争。但西班牙这时说什么都没用了，美国群情激昂，政府趁机宣战。美西战争就这样打起来了。


    问题是，“缅因”号到底是谁炸的？其实当时没人知道。美国1911年的時候还把“缅因”号打捞起来调查过，也没有定论。你现在去查历史书，一般都说它的爆炸是个谜。但我告诉你，实际上谜底已经揭开了。对“缅因”号事件最新的调查是在1976年，一个现役美国海军少将率领调查小组进行了调查，结论是：这艘军舰根本不是有人从外面把它炸沉的，而是内部爆炸，最可能的原因是锅炉故障点燃了附近的炮弹。所以，“缅因”号爆炸和西班牙无关。


    不过，这在当时根本不重要。美国正好有借口和西班牙开战。这场战争的过程可以说再简单不过了。因为美国和西班牙的军事实力差得太大，特别是海军，美国的主力都是最新的军舰，在数量、吨位和火力上都占绝对优势。西班牙军舰和西班牙帝国一样，可以说真是老旧不堪，比如当时派往加勒比海的西班牙舰队里居然有几艘舰根本就没有自己开，只能让别的军舰拉着走。所以仗打了不到4个月就结束了，美国毫无悬念地完胜对手。


    为什么说完胜呢？因为美国这场胜仗的代价低得不能再低了：海军只伤亡几个人，陆军也只损失了大约500人，而且绝大多数是因为染上了热带病死的，根本不是战死。当时美国驻英国大使海约翰（这个海约翰很重要，我下一讲还要说到他）把这场战争叫做“一场绝妙的小冲突”，这个说法美国历史学家到今天还在用。


    那美国得到了什么呢？


    +   第一，西班牙是放弃古巴了，美国如愿以偿成为古巴的保护国，“卧榻之侧”扫清了；

    第二，吞并了夏威夷群岛；从那时候开始夏威夷成为了美国的一部分；

    第三，美国把西班牙的殖民地——菲律宾抢了过来。


    你要看地图的话会发现，美国通过这一仗实际上在太平洋里拿到了两块跳板，中间是夏威夷，西边是菲律宾。这样一来美国的势力好象三级跳远一样，从美洲大陆一下跳到了我们东亚这边。


    # 为什么说是成功陷阱？


    听到这里你会觉得，美国这场战争太赚了，没死几个人，但抢了那么多的地方。这绝对是成功案例啊，那你一开头为什么说“成功陷阱”呢？我们来看一下美国吞并的两个地方，夏威夷和菲律宾。夏威夷实际上它早就占了，这次是借战争走完了国内的法律程序。这里的关键是菲律宾。


    我前面说过，经过国内大讨论，美国实际上已经明确了海外扩张的方式，那就是不去抢占大片的殖民地，因为这样做完全是背包袱。美国只搞要点式扩张，就是在关键地区占几个点，然后辐射整个地区，让自己的商品、人员、资本可以自由进入。这样的一种海外扩张道路实际上是成本最低，收益最高，是一条不同于欧洲殖民帝国的新路子。


    那么在美西战争刚开始的时候，美国人还是坚持了原本设定的那种路子，对菲律宾只是想占领两个港口，作为海军基地，其他地方不去管。但美西战争进行到后来，美国人的想法完全变了，为什么？胜利来得太容易了，好像老天把整个菲律宾送给你，结果你只要两个港口，这不是傻吗？当时很多美国政客都是这个
    cong 子。原本想过的、占领殖民地以后的负担这时根本没有人提了。所以是在一片胜利狂喜之下，美国决定吞并整个菲律宾。


    你看有的时候国家和人很像，那种理性的成本-收益分析，在轻而易举的成功面前是很容易被抛到一边的。美国的海外扩张这时就完全走回了欧洲列强的老路。当时完全存在这种可能，就是美国继续沿着这条路走下去，到处占殖民地，这就陷入扩张悖论。什么意思呢？扩张悖论就是，一开始说扩张使你更强大，但一旦扩张超过某个限度，你扩张的成本会越来越高，收益越来越少，力量反而会被削弱。这种扩张悖论就是我在开头所说的“成功陷阱”。


    不过美国的运气还是很好。它一只脚实际上已经踏进“成功陷阱”了，但没有进一步走下去。为什么呢？因为美国马上就看到了占领殖民地的代价。就在美国国会决定吞并菲律宾的同时，美军和菲律宾起义军发生了冲突，然后全面开战。


    这场战争和美西战争可不一样。我前面讲了，美西战争被称为“一场绝妙的小战争”，一共就打了4个月，损失也就是大约500人，那么镇压菲律宾花了多长时间呢？花了整整3年，2000多人战死，菲律宾死亡大约20万人，非常血腥。


    这种代价让美国人马上就回过神来，原来大讨论形成的那种收益-成本判断重新占了上风。西奥多·罗斯福，这样一个狂热的扩张主义者，到1900年的時候也转变了，明确宣布美国要继续海外扩张，但只扩张贸易和影响，绝对不再去占领什么海外殖民地了。你看，美国又回到了原来的扩张道路，继续打造一个新型的帝国。


    最后说一句，这种“成功陷阱”你肯定不会陌生，不光崛起的大国会碰到，一个团体及至个人都会碰到。避开这种陷阱，需要的不只是运气，更需要对长期性成本-收益的清晰判断。


    # 本讲议题交流


    最后我给你留的思考题就是，除了美国这个例子以外，还有没有陷入“成功陷阱”的典型例子？欢迎你在留言区分享你的观察。'
