    # 10 | “门罗主义”：美式大国思维的开端


    徐弃郁 · 美國簡史30講


    10 | “门罗主义”: 美式大国. ↓


    几年前，美国人攻击我们，说中国要推行“亚洲的门罗主义”。这种说法不值一驳，但美国用“门罗主义”来攻击我们就很有意思啦。为什么呢？因为门罗主义是美国崛起过程中的一个标志性口号，说“美洲是美洲人的美洲”，实际上就是它想独霸美洲，不让别人掺手。按我们很多历史书上的说法，门罗主义表明，羽翼未丰的美国已经显出独占美洲的野心。


    这个说法肯定没有冤枉它，但是太粗线条了。要知道，门罗主义不光是美国外交史上的一个重要概念，它还是了解美国大国思维的一个绝好案例，但不看细节基本上什么都看不到。这一讲就带你细看一下门罗主义。


    # 什么是门罗主义？


    我先说一下门罗主义是什么。美国第5位总统叫做詹姆斯·门罗，这个总统并没有做什么大事，但是他在第二任的时候发了一个咨文。当时拉美国家正在进行独立战争，俄罗斯、法国这些老欧洲国家嗷嗷着要去涉拉美的独立。门罗这位总统咨文就是针对这种干涉的核心意思就是美国从不干涉欧洲国家，所以欧洲国家也别干涉美洲的事情。注意，他说不是美国，而是美洲。而且口气非常强硬，说不管这种干涉是何种形式，我们都绝不能容忍。你从这里就可以看得很清楚，门罗主义实际上就是宣布整个美洲都是美国的势力范围，所以说它显得独占美洲的野心根本没冤枉它。


    但是这个门罗主义的出现，并不是因为美国想起来，我要独霸美洲，然后提出这么一个原则，或者说口号。从当时的情况来看，美国对于俄法这些老欧洲国家干涉拉美确实是非常敏感，而且它紧张的并不是拉美要被欧洲人抢走了，而是它觉得如果欧洲能干涉拉美，很早也就能干涉美国。美国政府内部确实谈到了这事可能对美国安全构成威胁。所以你看它这个思路很有意思，美国不是被眼前的危机推着走的，而是被一种危机意识推着走的。这个特点美国今天也是一样。


    我再告诉你，美国提出门罗主义还是一次被动的反应。对谁的被动反应？就是当时世界霸权国——英国。俄法这些欧洲大陆国家嗷嗷着要联合干涉拉美的独立，英国人的反应比美国人还要快。英国对欧洲大陆上的国家一直有戒心，只要大陆国家要联合起来做些什么事情，那英国第一反应就是自己要落单，所以一定要想办法让它们做不成。但是英国从来不喜欢单干，它就找到美国了，说这事情越闹越大，俄法这些欧洲大陆国家现在联合起来想要干涉拉美，要不我们两家也联合起来搞个声明，吓唬吓唬它们。所以你看，始作俑者是英国。


    那美国什么反应呢？美国内部有些人绝对是动心的。你想，这可是一次免费搭车的 好机会，和世界上最强大的国家——英国联合发表个声明，这对美国来说就没有风险了，因为法俄这些国家即使联合起来，英国海军也能挡住它们。这种稳赚不赔的事情，为什么不做呢？所以当时美国政界的一些大佬，包括杰斐逊和麦迪逊这两位前总统都觉得可以接受英国的这个提议。


    # 门罗主义有什么特点？


    但是这时有个关键人物提出了不同看法。他就是国务卿亚当斯。这个人我稍微说两句。他父亲叫做约翰·亚当斯，是华盛顿之后美国第二任总统，人称老亚当斯。那国务卿约亚当斯基本上是子承父业，也从政，当完国务卿又当上美国第6任总统，人称小亚当斯。这个情况和老布什、小布什一样，一家父子两人都是总统。


    这个小亚当斯的想法就和当时很多人不一样。首先他对英国总是放不心，觉得英国这么做的动机很可疑。不要忘了，这时候第二次美英战争才过去几年，美国对英国还是很警惕的。亚当斯就怕英国的建议里有什么阴谋。但是美国如果不接英国这招也不行啊，因为反对欧洲国家干涉拉美这件事跟美国有直接利害关系。那怎么办呢？亚当斯就提出，干脆美国自己干。他说，美国是一个有抱负的大国，与其跟在英国后面当小兄弟，不如我们自己对那些欧洲国家提出警告。最后他的意见被门罗总统采纳，这才有了门罗做出的那份著名的年度咨文，才有了门罗主义的出台。


    听到这里你就明白了，这么重要的门罗主义当时实际上是美国的一种被动应对。而且你还可以看到美国的一个特点，那就是一旦这个事情涉及到它的重要利益，那它就是绝对不怕单干的，而且还喜欢单干。看美国的历史，它单干的时间，要比和其他国家合作做事情的时间长得多。我指一句，单干是美国的本色，后来当领导以后才不得不同其他国家合作。你了解了美国这个特点，那今天看特朗普政府的很多做法就一点都不会意外了。


    那门罗主义除了体现美国的单干倾向以外，还有什么特点？今天我们看门罗总统的这份咨文，很多人都会觉得，美国就是美洲，当年实力还不够的时候就那么霸道了，而且野心勃勃，要把整个拉美作为自己的后院。这种看法没有错，但如果只是这些，就只看到了它强势、高调的一面，忽略了它背后的精打细算。


    你想：美国实力还不强的时候，为什么敢对欧洲列强说这么猛的话？不怕得罪法国和俄罗斯吗？这当然是有原因的。那些国家和它隔着一个大西洋，而控制着大西洋的是英国皇家海军。而英国的态度我前面已经讲过了，它在反对法俄干涉拉美的问题上和美国一致，而且还主动提议让美国和它一起行动。那英国皇家海军实际上就是美国和欧洲大陆之间一堵牢不可摧的屏障，美国就可以放心大胆地说狠话，向别人宣布规则。那你可能还会问：那英国呢？美国这么单干会不会得罪英国？我告诉你，也不会。因为英国看中的不是面子，而是事情的根本，英美在这个问题上利益基本一致都就行了。所以美国门罗主义出来以后，英国的反应比较平静，英国驻华盛顿的外交官给国内写信时还称赞了门罗的这份宣言，说它“语气明确果断”。


    所以我们回头细想一下，就会发现美国在 这件事情上很滑滑，很会借力。你看它宣布了自己的势力范围，挑战了欧洲列强，明确了自己的大国地位，全部代价就是一纸宣言。为什么代价这么低？最主要原因就是美国抓住时机借了英国的力，可以这么说，如果当时英国和美国的态度不一样，那谁也不会把门罗主义当回事。一个美国历史学家就说，要不是皇家海军握在大西洋，门罗总统的一纸咨文根本挡不住任何干涉。这里我们可以看到美国的另一个特点：它喜欢用豪言壮语，一下子抛出来一个很宏大的原则，看上去霸气横溢，但在这些的背后，它有非常精打细算的一面。我们今天看美国的时候，千万不要忽略了这点。


    # 本讲总结


    到这里，门罗主义这一讲就讲完了，我总结一下从中可以看到的美国行为的三大特点。


    +   第一，美国的危机意识很强，很多行为不是危机推动而是危机意识推动；

    第二，一旦涉及到它的重要利益，美国绝对不怕单干，而且有很强的单干倾向；

    第三，美国霸气的背后往往有非常精细的考量，绝不是莽干。


    当然，美国提出门罗主义虽然是瞄准整个美洲的，但它原则太超前了。美国的力量根本不到，更重要的是美国在北美还有大片的西部土地要征服。征服西部，或者说西进才是当时美国崛起的真正重点。下一讲我就要说这个问题。


    # 本讲交流议题


    这一讲的最后，我要给你留一道思考题：刚才我为你总结了美国行为的三大特点，你还观察到美国哪些行为体现了这些特点？欢迎在留言区分享你的看法。


    +   1.美国的危机意识很强，很多行为不是危机推动而是危机意识推动；

