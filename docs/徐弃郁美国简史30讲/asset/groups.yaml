    ## 20 | 和霸主摊牌：美国是如何挑战英国的？


    徐奔郁 · 美国简史30讲


    上一讲我们说到美国开始往海外扩张。美国的人、商品和海军要往外走，有一个国家它无论如何逃避不开，那就是当时的世界老大——英国。现在国际政治研究认为，世界老大和老二的关系最难处理，最后基本上都要武力摊牌。那英国和美国作为当时的老大和老二，确实也发生了一次摊牌。但有意思的是，这次摊牌非但没让这两家打起来，反而为后来的美英和解铺平了道路。这在历史上可太罕见了。到底是怎么回事？我们这一讲就来看一下。


    ### 英美为什么摊牌？


    说到美英关系，前面有几讲都讲到过，从独立开始，美国作为一个大国的演化一直是和对英关系缠绕在一起的，可以说相当一段时间里美国是在英国巨大的阴影下发展。但这个时候，19世纪末，情况不一样了。如果从地位上看，英美可以说是老大和老二的关系，英国还是老大。但从实力或者说家底上看，英国这个老大已经不太行了，制造业从顶峰时期占世界50%，降到了占世界20%都不到。美国呢，此时已经成为世界第一工业大国，制造业占世界30%。老大和老二就在此时发生了摊牌。


    两国怎么会摊牌的呢？上一讲我说到了美国开始海外扩张，美国的商品涌向全世界首当其冲的就是在美国南边的拉美国家。英国很快就受不了了，英国报纸说，即使是在拉美的英国殖民地，也被潮水般的美国商品淹没，英国被挤出整个拉美市场已经成为定局。在这种情况下，英国当然要巩固在拉美的地盘。美国和英国迎面相撞。


    这个撞击点，就在委内瑞拉。当时委内瑞拉的东面是英国的殖民地圭亚那，英国人呢单方面划了一条边界，我这里插一句，英国人这种事儿干可不止一次，我们西藏和印度之间的麦克马洪线就是这样划的。委内瑞拉当然不承认这条边界，再到后来争议地区发现金矿了，两国就彻底撕破脸，断绝外交关系。委内瑞拉知道，自己一个小国，和世界老大英国对着干肯定没戏，所以想方设法把美国拉进来，在美国的政界和报界做了大量公关工作。美国国内的反英情绪很快被挑起来了。


    有些美国的历史学家就说，美国是同情委内瑞拉才和英国发生对抗的。这完全不对。在美国，公众情绪是一回事，政府决策可是另一回事。你如果看着美国政府的档案，会发现美国政府从一开始就没孤立地看委内瑞拉和英国的争端，而是把它看成是英国在拉美重新抢地盘的一步棋，这就涉及到一个根本性的问题：在美洲到底是谁说了算。


    听到这里你就明白了，不论委内瑞拉是不是向美国求助，美国都会来干预这件事。那怎么干预呢？美国总统克里夫兰任命了一个作风极其强硬的国务卿，叫奥尔尼，外号“24英寸大炮”。他当国务卿以后就向英国发了一篇长达20多页的照会，什么内容呢？主要是引用门罗主义。我在前面第十讲说过，门罗主义就是不许欧洲列强干涉美洲事务，美洲是美国的地盘。这个照会又用很大的篇幅，很强硬的语气把门罗主义强调了一遍，要求英国接受仲裁，解决和委内瑞拉的边界争端。否则的话就要提交有宣战权的美国国会进行讨论。你看，这就有威胁的意思了。


    ### 英国如何应对？


    那英国什么反应呢？先是故意拖着不回复，最后的回复实际上是把美国门罗主义否定了一下，说这是你单方面原则，我根本不接受。美国人等了几个月的时间却等来这么一个回答，可真气炸了。总统克里夫兰向国会做了一个语气特别强硬的咨文，接近于战争威胁。这就是向全世界宣布，美洲的事情就是我说了算，即使是英国也不行。这样一来，老大和老二完全顶起来了，这就是摊牌。


    你再看两国国内，都已经群情激昂。美国国内更是一片喊杀之声，英国驻美国大使给国内的报告说，国会和整个美国都被这一好战的咨文带入了一种歇斯底里的状态。


    那两国打起来没有？我告诉你，不仅没有打，而且连真打的意思都没有。一兵一卒都没有调动。为什么呢？根本原因就是，英美这两个国家风格上差得很大，但骨子里都是现实主义。现实主义对于实力对比最敏感。美国很清楚，自己的军事实力特别是海军实力和英国差太远，当时美国主力舰只有一艘，英国有多少？36艘。根本没法打。而且美国国内战争狂热起来以后，纽约金融市场发生恐慌，证券市场重挫不说，还有价值340万美元的黄金流出。这种情况首先让商人，其次让百姓也看到了，和英国打仗不是闹着玩的，还没有打就这样了。所以一开始那种全民性的好战情绪很快就过去了，重新归于冷静。


    那英国呢？英国首相索尔兹伯里绝对是重量级的外交家，知道在目前的实力对比之下，美国不会真动手。所以下属问他，要不要动员一下海军以防万一，他的回答是一艘军舰都不用动，静观待变就行。这就是老牌英国政治家的定力。


    另外英国也很清楚，美国工业实力已经超过英国，而且还在发展，和美国冲突对英国来说也不是闹着玩的。当时英国海军大臣在信里写这么一句：“美国的财力足够，只要他们愿意就可以造出和我们一样强大的舰队，甚至超过我们。所以只要有可能我就不会和美国吵。”你看，这就是现实主义。


    既然两个大国都是现实主义的，就可以坐下来谈了。那最后谈的结果是什么呢？非常出人意料，英国最后同意仲裁解决，但仲裁的结果是争议土地基本归英国了。


    你想，这件事的起因就是美国替委内瑞拉出头，那么结果是不是意味着美国认输了呢？根本不是。美国在这件事上是和英国进行了一次交换。英国是得到了土地了，但这个过程或者说程序是按美国的要求来的，美国要求仲裁解决，最后英国接受了。所以，你别看英国得到了具体利益，但它于是把规则的制定权让给了美国了。英美这次交换就是具体结果和规则权的交换。不用我多说，规则权比具体结果重要得多，因为它涉及到谁说了算的问题。


    ### 英美摊牌的结果


    最后我们看一下这次英美摊牌的结果，英国得到了利益，但第一次承认了美国在西半球的主宰地位。这样一来英美之间最大的一个障碍就扫除了。另外这事让英国也看到，美国在掌握规则权以后，英国的主要利益还是可以保住。这有什么含义？那就是万一将来你接我的老大位置，我不用担心会被清算。这点太重要了。有了这点，英美关系就越来越趋向合作方向走，才有了后来英美霸权的和平更替，或者说禅让。


    如果撇开具体的历史，这一讲至少告诉我们两点信息：


    - 第一，竞争既是具体利益之争，也是规则之争，其中规则的制定权是竞争的核心。这一点适用于国家之间，也适用于企业之间。

    - 第二，和对手达成交换可以是结果的交换，也可是过程的交换。就像我前面讲的，英国拿到的是结果，美国拿到的是过程。如果你处于实力的上升期，那么更应该关注过程，因为掌握了过程，你的潜力就能更好地兑换成实力，实力更好地兑换成地位。这也是美国当时的选择。


    ### 本讲议题交流


    这一讲到这里就结束了。最后我再留一个思考题：这次大摊牌体现出来的哪些因素，使后来英美的霸权能够和平交接？欢迎在留言区分享你的观点。


    **划重点**


    1. 竞争既是具体利益之争，也是规则之争，其中规则的制定权是竞争的核心。这一点适用于国家之间，也适用于企业之间。

    2. 和对手达成交换可以是结果的交换，也可是过程的交换。如果你处于实力的上升期，那么更应该关注过程，因为掌握了过程，你的潜力就能更好地兑换成实力，实力更好地兑换成地位。


    ## 21 | 美西战争与“成功陷阱”


    徐奔郁 · 美国简史30讲


    如果有人要问，美国打了这么多场战争，最顺手的是哪一场？答案应该是美国进入海外扩张阶段以后，在1898年和西班牙的那场战争，即史称美西战争。我还要告诉你，这场战争不光是美国打得最顺手的一场，也是代价最小、获益最多的一场，效费比最高。但是，这个大便宜也差点让美国陷入一个“成功陷阱”。这是怎么回事呢？


    ### 美西战争怎么打起来？


    我们先来看一下美西战争是怎么打起来的。


    表面上看，这两个国家是为了古巴而打。古巴当时是西班牙的殖民地，1895年的时候爆发了何塞·马蒂领导起义，反抗西班牙殖民统治。


    我这里插一句，何塞·马蒂这个名字你可记一下，他虽然很快就牺牲了，但在古巴历史上的地位可以说是至高无上。后来古巴革命领导人卡斯特罗、切·格瓦拉这些人你肯定都熟悉，他们都把何塞·马蒂奉为精神领袖。


    古巴起义以后西班牙肯定去镇压啊，美国人就不干了。美洲是我的地盘，你怎么随随便便就派兵来了。你想，上一讲说的美英摊牌不就是因为英国介入美洲事务，美国借机发飙吗？对世界上大英帝国，美国还是有顾忌的，但对已经衰落了几个世纪的西班牙，美国不放在眼里，该打就会打。而且你从地图上看一下就会发现，古巴离美国的南大门太近了，西班牙军舰在这里让美国很有一种“卧榻之侧，岂容他人酣睡”的感觉。


    不过呢，这只是表面理由，深层原因其实更简单。那就是美国实力正在步入鼎盛，在美洲的主宰地位连英国都默认了，但西班牙这个老朽的殖民帝国居然还占着这么多的殖民地。美国怎么可能不眼红呢？所以有机会打一仗，完全符合逻辑。


    好了，讲完战争爆发的原因以后，我还要再说一下这场战争的导火索，那就是扑朔迷离的“缅因”号事件。


    “缅因”号是一艘美国军舰。古巴形势紧张的时候美国把它派过去，说是“友好访问”，实际上就是向西班牙施加压力。到1898年2月15日晚上，停在古巴港口的“缅因”号突然爆炸，舰上354人只有88人生还。


    美国国内舆论一下子炸开了，几乎所有的报纸都把矛头指向西班牙。西班牙当然不承认，说这是古巴起义军炸的，为了把美国拖入和西班牙的战争。但西班牙这时说什么都没用了，美国群情激昂，政府趁机宣战。美西战争就这样打起来了。


    问题是，“缅因”号到底是谁炸的？其实当时没人知道。美国1911年的时候还把“缅因”号打捞起来调查过，也没有定论。你现在去查历史书，一般都说它的爆炸是个谜。但我告诉你，实际上谜底已经揭开了。对“缅因”号事件最新的调查是在1976年，一个现役美国海军少将率领调查小组进行了调查，结论是：这艘军舰根本不是有人从外面把它炸沉的，而是内部爆炸，最可能的原因是锅炉故障点燃了附近的炮弹。所以，“缅因”号爆炸和西班牙无关。


    不过，这在当时根本不重要。美国正好有借口和西班牙开战。这场战争的过程可以说再简单不过了。因为美国和西班牙的军事实力差得太大，特别是海军，美国的主力都是最新的军舰，在数量、吨位和火力上都占绝对优势。西班牙军舰和西班牙帝国一样，可以说真是老旧不堪，比如当时派往加勒比海的西班牙舰队里居然有几艘舰根本就没有自己开，只能让别的军舰拉着走。所以仗打了不到4个月就结束了，美国毫无悬念地完胜对手。


    为什么说完胜呢？因为美国这场胜仗的代价低得不能再低了：海军只伤亡几个人，陆军也只损失了大约500人，而且绝大多数是因为染上了热带病死的，根本不是战死。当时美国驻英国大使海约翰（这个海约翰很重要，我下一讲还要说到他）把这场战争叫做“一场绝妙的小冲突”，这个说法美国历史学家到今天还在用。


    那美国得到了什么呢？


    - 第一，西班牙是放弃古巴了，美国如愿以偿成为古巴的保护国，“卧榻之侧”扫清了；

    - 第二，吞并了夏威夷群岛；从那时候开始夏威夷成为了美国的一部分；

    - 第三，美国把西班牙的殖民地——菲律宾抢了过来。


    你要看地图的话会发现，美国通过这一仗实际上在太平洋里拿到了两块跳板，中间是夏威夷，西边是菲律宾。这样一来美国的势力好像三级跳远一样，从美洲大陆一下跳到了我们东亚这边。


    ### 为什么说是成功陷阱？


    听到这里你会觉得，美国这场战争太赚了，没死几个人，但抢了那么多的地方。这绝对是成功案例啊，那你一开头为什么说“成功陷阱”呢？我们来看一下美国吞并的两个地方，夏威夷和菲律宾。夏威夷实际上它早就占了，这次是借战争走完了国内的法律程序。这里的关键是菲律宾。


    我前面说过，经过国内大讨论，美国实际上已经明确了海外扩张的方式，那就是不去抢占大片的殖民地，因为这样做完全是背包袱。美国只搞要点式扩张，就是在关键地区占几个点，然后辐射整个地区，让自己的商品、人员、资本可以自由进入。这样的一种海外扩张道路实际上是成本最低，收益最高，是一条不同于欧洲殖民帝国的新路子。


    那么在美西战争刚开始的时候，美国人还是坚持了原本设定的那种路子，对菲律宾只是想占领两个港口，作为海军基地，其他地方不去管。但美西战争进行到后来，美国人的想法完全变了，为什么？胜利来得太容易了，好像老天把整个菲律宾送给你，结果你只要两个港口，这不是傻吗？当时很多美国政客都是这个样。原本想过的、占领殖民地以后的负担这时根本没有人提了。所以是在一片胜利狂喜之下，美国决定吞并整个菲律宾。


    你看有的时候国家和人很像，那种理性的成本-收益分析，在轻而易举的成功面前是很容易被抛到一边的。美国的海外扩张这时就完全走回了欧洲列强的老路。当时完全存在这种可能，就是美国继续沿着这条路走下去，到处占殖民地，这就陷入扩张悖论。什么意思呢？扩张悖论就是，一开始说扩张使你更强大，但一旦扩张超过某个限度，你扩张的成本会越来越高，收益越来越少，力量反而会被削弱。这种扩张悖论就是我在开头所说的“成功陷阱”。


    不过美国的运气还是很好。它一只脚实际上已经踏进“成功陷阱”了，但没有进一步走下去。为什么呢？因为美国马上就看到了占领殖民地的代价。就在美国国会决定吞并菲律宾的同时，美军和菲律宾起义军发生了冲突，然后全面开战。


    这场战争和美西战争可不一样。我前面讲了，美西战争被称为“一场绝妙的小战争”，一共就打了4个月，损失也就是大约500人，那么镇压菲律宾花了多长时间呢？花了整整3年，2000多人战死，菲律宾死亡大约20万人，非常血腥。


    这种代价让美国人马上就回过神来，原来大讨论形成的那种收益-成本判断重新占了上风。西奥多·罗斯福，这样一个狂热的扩张主义者，到1900年的时候也转变了，明确宣布美国要继续海外扩张，但只扩张贸易和影响，绝对不再去占领什么海外殖民地了。你看，美国又回到了原来的扩张道路，继续打造一个新型的帝国。


    最后说一句，这种“成功陷阱”你肯定不会陌生，不光崛起的大国会碰到，一个团体乃至个人都会碰到。避开这种陷阱，需要的不只是运气，更需要对长期性成本-收益的清晰判断。


    ### 本讲议题交流


    最后我给你留的思考题就是，除了美国这个例子以外，还有没有陷入“成功陷阱”的典型例子？欢迎你在留言区分享你的观察。


    **划重点**


    1. 一般来说扩张使你更强大，但一旦扩张超过某个限度，你扩张的成本会越来越高，收益越来越少，力量反而会被削弱；

    2. 避开“成功陷阱”，需要的不只是运气，更需要对长期性成本-收益的清晰判断。


    ## 22 | 美国对华政策的开端：“门户开放”


    徐奔郁 · 美国简史30讲


    在美国海外扩张的过程中，“门户开放”政策有着特别重要的地位。这个政策直接和中国有关。什么意思呢？就是鸦片战争以后，列强在中国的土地上划势力范围，这可以，没有问题，但你的势力范围必须对其他列强的商品和资本开放，不能独占，不能封锁，这就是“门户开放”。

    很多书上就把“门户开放”和美国连在了一起，说美国是个“迟到”的大国，等它来到中国的时候，中国基本上已经被列强瓜分完毕，所以美国提出了“门户开放”政策，要求列强在华势力范围保持开放，大家机会均等。我相信，这些话你肯定不会觉得陌生。


    ### “门户开放”政策的由来


    但是我告诉你，这个说法是错误的。为什么呢？因为“门户开放”根本不是美国提出来的，而是英国人的发明。英国从第一次鸦片战争侵略中国以后，就一直要求清政府对其他列强一视同仁，中国市场要向所有列强开放。这就是英国当时的自由贸易原则。


    那美国呢？美国一开始根本就没有中国政策，它在中国所有的事情基本上都是搭英国的便车：英国不是坚持“门户开放”吗？那美国货物正好进中国市场。我再给你补一件事：美国在中国事务上当英国“小弟”从第一次鸦片战争就开始了，当时美国的船就跟在英国舰队的后面进入长江口，英国从清政府那里得到什么条件，它就跟着要什么。


    问题是，为什么美国后来又要提“门户开放”呢？关键原因是，到19世纪末，美国在中国的利益发生了重大变化。我前面说过，美国从1890年开始推动海外扩张，它对华贸易的总量不大，但增量惊人。在1890年到1900年这十年间，美国对华出口增加了200%。


    今天美国人还在和我们打贸易战，说有些领域过于依赖中国，有损美国国家安全。但我告诉你，在100多年前，美国有一些行业就开始依赖中国市场了，很难想象吧？比如说棉花，当时的中国是美国棉花的最大买家，美国棉花出口的一半都是运往中国的。


    美国南部产棉区的那些商人是怎么看中国的？他们给国会的请愿书是这么写的：“你马上可以看到对华贸易的重要性：它对我们来说就是一切。”所以你看，利益上升到这个程度，美国的政策当然要重新考虑。


    第二个原因更关键，那就是，英国的“门户开放”支持不下去了。英国的“门户开放”核心是什么？说到底就是不能真的瓜分中国，即所谓“保持中国主权完整”，这样的话，列强在中国市场上可以自由竞争。但是，到19世纪末，英国的实力已经下降，这个场面有点罩不住了。这个时候，其他列强就拒绝再按照英国的规则玩下去了。1897年德国强占胶州湾，这是个开头，其他列强生怕自己落后，都开始在中国强占租界。英国呢，一开始想抵制一下，后来一看抵制不住，干脆自己也抢租界。“门户开放”不再提了。


    ### 美国如何推行“门户开放”？


    听到这里你就明白了，为什么美国一定会全力以赴地推“门户开放”。问题是它怎么推？

    这里就要说到一个关键人物，当时的美国国务卿海约翰。这个人曾经当过林肯总统的秘书，27岁就进入外交界，外交经验很丰富。他非常清楚，在中国不比在拉美，美国说了不算，所以想要实现门户开放，只能走一条很小心精细的路线。他先准备了一份照会，史称“第一次门户开放照会”，什么内容呢？就是各国都在中国占了势力范围，美国不反对，但这些势力范围必须对其他国家开放，而且要在货物收费方面一视同仁。这照会本身就很有意思，你看它只涉及一般性的货物贸易，当时列强争夺最激烈的对华贷款、开矿、铁路这些敏感领域一概不碰。准备好照会以后，海约翰又分头找了英、法、俄、日这些国家，先找在华力量最单薄的日本，再找立场最相近的英国，各个击破。最后让列强都表示同意美国的“门户开放”照会。


    ### “门户开放”背后的三个特点


    - 第一，美国的“门户开放”着眼中国，但在整个事情的运作过程中，中国根本没有被当成一个国家来对待，而是被当成一个市场。到了什么程度？美国的“门户开放”照会只发给列强，中国政府根本没有接到，美国只是在中国政府询问以后才给予回应。

    - 第二，美国非常谨慎。我这里要插一句，看美国史的时候，我们很容易把今天美国的形象套过去。好像美国从来都是一副牛哄哄的，很霸气的样子。实际上美国当时虽然在实力上已经是世界第一，但你可以看出来，它在“门户开放”的整个过程中都是小心翼翼，只利用矛盾，不卷入矛盾。

    - 第三，“门户开放”显示出了美国的大国格局。你可能会问，列强瓜分中国的时候，美国当时为什么不占一块地呢？原因是，美国当时已用一种全球眼光来看自己的利益，光占一块地方它看不上，它瞄准的是整个中国市场。“门户开放”的着眼点就是整个中国。


    ### 本讲议题交流


    这一讲的最后，我给你留一道思考题：还有什么地方能够充分体现英国和美国的这种“基因相似”？欢迎你在留言区分享你的看法。


    **划重点**


    1. 美国“不求所有，但求所用”的海外扩张道路在对华“门户开放”政策的时候基本定型；

    2. 美国和英国之间的制度和规则取向完全相同，你不行了我来坐庄，规则体系还是一样，所以请你放心。

