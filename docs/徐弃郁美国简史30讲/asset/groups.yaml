    ## 发刊词 | 美国人为什么那样想？


    徐奔郁 · 美国简史30讲


    首先我要说的是，《美国简史》这个课程，并不是给你简要地说一下美国历史，而是要带着你通过历史的大结构和小专题，来深度认识美国。关键词是“深度”。听到这里有些人可能会问，我为什么需要深度认识美国呢？简单了解一下、知道大概怎么回事不就可以了吗？


    ### 为什么需要深度认识美国？


    第一个原因是美国太重要。美国的重要性不光因为它仍然是世界第一强国，而且因为我们所处的这个世界，基本框架上还是美国在二战以后设计的。对美国的认识程度实际上决定了你对当今世界的认识程度。


    第二个原因是美国这个国家太容易脸谱化了。今天你无论和谁说起美国，他（她）都能说出一二，比方说强大、霸道、美式民主等等。这就像贴标签、画脸谱，有了这么几条就差不多。有这种印象也很正常，因为美国的自我宣传很脸谱化，典型的例子就是那个卡通人物山姆大叔，穿着美国星条旗做的衣服，这是美国人自己画出来的美国象征。所以对大多数人来说，美国的形象就是一个有钱有势、强壮的山姆大叔。你如果问美国为什么能发展到现在这样一个超级大国？那回答往往也是比较脸谱化的。很多人觉得，那是因为美国地理环境特别优越，而且一步一步走来都非常顺，基本上就是一个幸运儿。


    但是我要告诉你，事情根本就没有那么简单。对美国这种脸谱化的归纳不仅不正确，而且在现实当中很容易吃亏。


    第三个原因是中美关系已经发展到了现在这种状态。这就不用我多说了，看新闻就都明白。我只讲一点，在这种情况之下，我们比以往任何时候，都更需要对美国有一个深度认识。《孙子兵法》上讲，知彼知己，百战不殆。知彼的迫切性从来没有现在这么强。


    ### 怎么实现对美国的深度认识？


    那肯定要从源头上来把握，要知道美国是怎么走到今天这样的。为了这个目的，《美国简史》做了一个六大模块的结构：包括殖民地时代、独立建国、大陆扩张、赶超年代、海外扩张和走向霸权。你一听这个结构就知道，这是按照时间线理下来的，从17世纪清教移民坐五月花号登陆北美开始讲起，讲到美国独立，然后一直讲到20世纪90年代美国赢得冷战，300多年历史30讲说完。


    除了这条显性的历史时间线以外，《美国简史》还有一条隐性的现实投影线，那就是这里讲的历史事件都有长长的投影，一直投射到现在。实际上是让你在历史和现实之间不断穿梭，为现实找到历史的源头，为历史找到现实的落脚。


    比如，第一个模块讲的是殖民地时期的美国，或者说美国的前传。这一百多年的历史我们主要发掘的就是三个基因片段：民主政治基因、宗教基因和联邦基因。你可别小看这些基因片段，就是这些基因片段的长期演化最后形成了美国，而且直到今天还在影响美国的思维和行为。所以我们把它们专门抽出来讲，实际上就是在历史中寻找一种现实的映现。后面其他的模块也是同样处理的，这就是我说的隐性的现实投影线。


    讲到这里你就清楚了，《美国简史》的基本结构就是六大模块，加上两条线索：一条是显性的历史时间线，一条是隐性的现实投影线。


    ### 用两大视角搞懂美国人怎么想


    说完结构，还要说一下内容的选择。德国人莱辛说过，历史不应该是记忆的负担。我讲《美国简史》的一条重要原则也是不给你增加记忆负担。这里挑选的，都是美国作为一个大国演化过程中最关键的节点或者阶段，全部内容都指向一个根源性问题，那就是“美国何以成为美国”。这里很重要的一点就是美国精神底层的锻造。你看历史，大国的崛起或者说演化，根本上就是一个国家精神底层反复锻造的过程。


    2018年我讲完《英国简史》就有很多人问我，美国在精神层面上和英国是什么关系？是不是继承了英国的制度主义精神？实际上继承关系当然是有的，但差别也非常之大。美国的精神底层一方面来自于殖民地时代的那三大基因——民主政治基因、宗教基因和联邦基因，另一方面来自于立国过程中华盛顿、杰弗逊、汉密尔顿那些开国元勋的精心设计，更重要的是移民在美洲大陆拓殖过程中，不断融合，不断被环境塑造，最后形成的独特的民族性。我在西进运动那一讲里面，就专门讲到了长达一百年的西进运动对美国民族特性的塑造。


    听完了这些，你对美国精神底层的发展和定型就有了一个通盘的把握，对美国的认识也可以由表及里。


    除了大国精神这个视角以外，还有一个战略视角。什么是战略呢？战略最基本的含义就是整体运用你的资源来实现最终目标。那美国在这个方面非常擅长。它在历史上有一些特别关键的事情或者节点做得好像都很顺，给人感觉好像结果就应该是这样，比方说美国的工业化和工业赶超，比方说打赢第二次世界大战，比方说最后赢得了对苏联的冷战。很多书在写美国这些成功的时候都用资源优势来解释，好像美国就靠着大气粗砸定一切。


    但我告诉你，拿到一手好牌并不意味着能赢，关键还要把它打好。美国这个国家，特别善于组织和运用自己的优势资源，是一种系统化的战略思维，换句话说，它在几个关键时刻都把一手好牌打到了最好。美国的世界霸权就是这么来的。《美国简史》中的大部分都在发掘美国这方面的战略特质，其中像“华盛顿的告别演说”“国家的西进”“美国工业赶超”“第二次世界大战”和“美国如何赢得冷战”这几讲，都有很大的篇幅专门进行分析。听完这些以后，你就会明白，美国真正厉害的是在哪里，今天我们要特别留意哪些方面。


    好了，介绍完了六大模块、两条线索和两大视角，《美国简史》的整个设计差不多也和你交代清楚了。我还要补充一点，美国这个IP太太太重要，30讲的篇幅还不能完全盖住。所以课程结束以后，我还要为你准备专题讲座，目的就是在形成对美国的深度认识以后，进一步让这种认识更加完整，也更加丰满。


    最后我还想说一句，讲了这么多年课，我始终有个信念，越是有深度的东西，越是可以讲得轻松有趣。希望你听完《美国简史》以后，能够同意我这个想法。


    好，欢迎你加入《美国简史》的课堂。


