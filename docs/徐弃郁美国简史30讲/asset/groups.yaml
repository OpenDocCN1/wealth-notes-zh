    # 03 | 为什么是联邦制：美国的联邦基因


    徐奔郁 · 美囯简史30讲


    03 | 为什么是联邦制：美...


    我们看今天的美国，有一个特点非常突出。那就是联邦制。美国这么一个大国，分为50个州，但它的州和中国、法国和其他很多国家的省是不一样的，它和中央（美国叫联邦政府）可不是严格的上下级关系。美国的州独立性非常大，相互差异也大，它们有自己的法律体系、行政体系，很多事情中央不能干预。我打个比方，美国就像一盘沙拉，胡萝卜是胡萝卜，生菜是生菜，互相之间基本上是不相关的，共同点是它们都装在一个盘子里。这就是美国的联邦制。


    那有些人就会感觉，这样的话一个国家怎么集中统一领导呢？多不方便啊。但美国的联邦制好像运行得也很好，说明适合它的国情。那问题就来了，美国为什么没有选择大一统的模式？这就是这一讲的主题：美国的联邦基因，或者说联邦制的源头。


    # 多样性：殖民地之间的巨大差异


    这个源头是在殖民地时期。英国移民当时在北美一共建了13块殖民地，就是后来美国的13个州。这13块殖民地都是一批批的移民分头建起来的，相互之间的差异非常大，其中最明显的就是南北差异。


    # 独立性：根深蒂固的自治传统


    但是，我还要告诉你，多样性只是美国选择联邦制的理由之一，或者说只是一种表面理由。更深一层的原因为法理上的。


    # 统一性：殖民地的共同底色


    # 本讲总结


    说到这里，你就明白了，北美十三块殖民地那种多样性的统一，就是今天美国联邦制的源头，或者说联邦制的基因。我们回头来看，这对美国来说太重要了。因为美国是一个移民社会，这种多样性的统一给不同背景的移民提供了一个庞大的选择余地。你觉得在这里不习惯，可以到其他的州去。美国在几百年的时间内持续不断地吸收各个地方的移民，同时还能保持国家的完整和统一，最主要的秘密就在这里。


    +   1. 殖民地之间经济和文化上的差异性，法理上的独立性，加上英国移民的共同底色，让十三块殖民地实现了多样性的统一，成为了美国联邦制的源头；

    2. 联邦制为美国的移民社会提供了庞大的选择余地，不同背景的移民可以选择不同的州，这是美国既能吸收不同地方的移民，又能保持国家完整和统一的秘密。'
