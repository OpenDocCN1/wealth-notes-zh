    险的敌人。


    它往往于扰公众会议的进行，并削弱行政管理能力。它在民众中引起无根据的猜忌和莫须有的惊恐；挑拨派对立；有时还引起骚动和叛乱。它为外国影响和腐败打开方便之门。外国影响和腐败可以轻易地通过派系倾向的渠道深入到政府机构中来。这样，一个国家的政策和意志就会受到另一个国家政策和意志的影响。


    有一种意见，认为自由国家中的政党，是对政府施政的有效牵制，有助于发扬自由精神。在某种限度内，这大概是对的；在君主制的政府下，人民基于爱国心，对于政党精神即使不加以护守，也会颇为宽容。但在民主性质的纯粹选任的政府下，这种精神是不应予以鼓励的。从自然趋势看来，可以肯定，在每一种有益的目标上，总是不乏这种精神的。但这种精神常有趋于过度的危险，因此应当用舆论的力量使之减轻及缓和。它是一团火，我们不要熄灭它，但要一致警惕，以防它火焰大发，变成不是供人取暖，而是贻害于人。


    还有一项同样重要的事，就是一个自由国家的思想习惯，应当做到使那些负有行政的人保持警惕，把各自的权力局限于宪法规定的范围内，在行使一个部门的权力时，应避免侵犯另一个部门的权限。这种越权精神倾向于把所有各部门的权力集中于某一部门，因而造成一种真正的专制主义，姑不论其政府的形式如何。


    如果民意认为，宪法上的权限之分配或修改，在某方面是不对的，我们应当照宪法所规定的办法予以修改。但我们不可用藐视的方式予以更改；因为这种方法，可能在某一件事上是有有效手段，但自由政府也常会被这种手段毁灭。所以使用这种方法，有时虽然可以得到局部的或一时的好处，但此例一开，一定抵不过它所引起的永久性危害的。


    在导致昌明政治的各种精神意识和风俗习惯中，宗教和道德是不可缺少的支柱。一个竭力破坏人类幸福的伟大支柱 - - 人类与公民职责的最坚强支柱 - - 的人，却妄想别人赞他爱国，必然是自欺心机的。政治家应当同虔诚的人一样，尊重和爱护宗教与道德。宗教与道德同个人福利以及公共福利的关系，即便写一本书也说不完。我们只要简单地问，如果宗教责任感不存在于法院�<|start|>调查事件的宣誓中，那么，哪个能谈得上财产、名誉和生命的安全呢？而且我们也不可耻于幻想，以为道德可不靠宗教而维持下去。高尚的教育，对于特殊构造的心灵，尽管可能有所影响，但根据理智和经验，不容许我们期望，在排除宗教原则的情况下，道德观念仍能普遍存在。'
