    ## 02 | 以上帝之名：美国的宗教基因


    徐奔郁 · 美国简史30讲


    我们看美国的时候，有一个现象让很多人不好理解。美国这样一个科技和经济高度发达的国家，它支持


    ### 美国为什么宗教色彩那么重？


    上一讲我说了新教、清教和天主教之间的关系，这里我要补充一句，到美国来的英国殖民者绝大部分都属于新教这个大类中的小派别——清教徒，信仰最虔诚，对殖民地发展的影响也最大。


    ### 美国的宗教基因为何一直在生长？


    首先，北美殖民地比英国老家更艰苦，也更危险。


    ### 本讲总结


    ### 本讲议题交流


    - 你不理解宗教，就不能真正理解美国；

    - 北美移民携带的宗教信仰，和北美特殊的自然与社会政治环境，产生了美国独有的宗教基因，最终成为美国精神底层的一个重要部分；

    - 大国的成长和自然界的生物演化有点像，最初的基因很重要，但后来的环境更重要。


    ## 03 | 为什么是联邦制：美国的联邦基因


    徐奔郁 · 美国简史30讲


    我们看今天的美国，有一个特点非常突出。那就是联邦制。美国这么一个大国，分为50个州，但它的州和中国、法国和其他很多国家的省是不一样的，它和中央（美国叫联邦政府）可不是严格的上下级关系。美国的州独立性非常大，相互差异也大，它们有自己的法律体系、行政体系，很多事情中央不能干预。我打个比方，美国就像一盘沙拉，胡萝卜是胡萝卜，生菜是生菜，互相之间基本上是不相关的，共同点是它们都装在一个盘子里。这就是美国的联邦制。


    那有些人就会感觉，这样的话一个国家怎么集中统一领导呢？多不方便啊。但美国的联邦制好像运行得也很好，说明适合它的国情。那问题就来了，美国为什么没有选择大一统的模式？这就是这一讲的主题：美国的联邦基因，或者说联邦制的源头。


    ### 多样性：殖民地之间的巨大差异


    这个源头是在殖民地时期。英国移民当时在北美一共建了13块殖民地，就是后来美国的13个州。这13块殖民地都是一批批的移民分头建起来的，相互之间的差异非常大，其中最明显的就是南北差异。


    ### 独立性：根深蒂固的自治传统


    但是，我还要告诉你，多样性只是美国选择联邦制的理由之一，或者说只是一种表面理由。更深一层的原因为法理上的。


    ### 统一性：殖民地的共同底色


    ### 本讲总结


    说到这里，你就明白了，北美十三块殖民地那种多样性的统一，就是今天美国联邦制的源头，或者说联邦制的基因。我们回头来看，这对美国来说太重要了。因为美国是一个移民社会，这种多样性的统一给不同背景的移民提供了一个庞大的选择余地。你觉得在这里不习惯，可以到其他的州去。美国在几百年的时间内持续不断地吸收各个地方的移民，同时还能保持国家的完整和统一，最主要的秘密就在这里。


    **划重点**


    - 殖民地之间经济和文化上的差异性，法理上的独立性，加上英国移民的共同底色，让十三块殖民地实现了多样性的统一，成为了美国联邦制的源头；

    - 联邦制为美国的移民社会提供了庞大的选择余地，不同背景的移民可以选择不同的州，这是美国既能吸收不同地方的移民，又能保持国家完整和统一的秘密。


    ## 04 | 为什么会爆发美国独立战争？


    徐奔郁 · 美国简史30讲


    前面的模块我们讲的是美国三个最重要的基因，实际上说的是美国的前传，它还是殖民地的时候。我从这一讲开始，就要说美国作为一个国家出现在世界历史舞台上的事情了。首先要讲的那一定是美国的独立建国，特别是它的独立战争。这一讲要回答的问题就是：为什么独立战争会发生？


    ### 被误解的独立战争


    很多人觉得这个问题还不好回答吗？那就是英国当局对殖民地苛刻


    最后殖民地人民只能奋起反抗。


    但是，真实的历史并不这么简单。英国对北美殖民地的政治管理很宽松，比国内宽松多了，要不然北美殖民地的民主政治、自治怎么可能发展起来。所以谈不上压迫。再说征税，美国教科书以前都说英国对殖民地加税的事，好像多么过分，但实际上这部分税非常轻，主要是象征性的，所以也谈不上横征暴敛。这些我在《英国简史》的课里面详细讲过，你可能还有印象。


    这里我要补充的是，关于独立战争的原因还有一个广为流传的说法，那就是英国政府残暴对待殖民地人民，典型的例子就是1770年的波士顿屠杀。波士顿是马萨诸塞殖民地的一个重要城市。美国很多历史书都这么说，1770年3月波士顿的平民反对英国统治，英国军队镇压，指挥官下令对赤手空拳的群众开枪，死了好多人。当时还有一幅著名的画作，画面上英国军队在军官的号令下一起开枪，人群一排排地倒下，这非常能够激起人的义愤。我先告诉你，这和历史不符。那事实是什么呢？我讲三点——


    - 第一，英国人为什么开枪？当时一小群英国士兵在波士顿街头巡逻，但波士顿的反英情绪很高，很快有很多围上来骂英国兵，朝他们扔石块、扔垃圾，英国兵步步后撤，最后遇到海关大楼以后发现无路可退了，围住他们的人越来越多，惊恐之下几个士兵开枪，根本没有军官下命令。

    - 第二，死了多少人？最后统计是5个人被打死。

    - 第三，最后结果是什么样的？这次惨案发生后，英国人马上以谋杀罪逮捕了这些英国兵，由殖民地人组成的法庭进行审判。这一幕很有意思，为英国兵辩护的，就是后来成为美国开国元勋，当上第二任总统的约翰·亚当斯。他当然是反英的，但很实事求是。最后法庭的结论是，这些英国兵自卫开枪，无罪。所以你看，事实和流传的说法差距很大，所以说英国政府残暴对待殖民地也是谈不上的。


    ### 北美殖民地独立的真相


    那么殖民地到底为什么要独立呢？其实很简单，如果从英国的角度来看，最主要的问题就是，英国一方面给殖民地很大的政治自由，另一方面没有给足够的经济自由，要管制经济，所以形成了巨大反差，造成殖民地的普遍不满，最后矛盾爆发。但是我们如果从更宏观的视角来看，那原因更简单，概括起来四个字：瓜熟蒂落。


    你看，由于英国一直给予北美殖民地很大的政治自由，从我在第一讲讲到的《五月花号公约》开始的那种民主政治基因，经过100多年已经发育成生命体了，英国的十三个北美殖民地事实上就已经是十三个自我生长的个体，不再需要，也不能再容忍英国的任何管制。所以它们摆脱英国是迟早的事情。


    不过，这里你注意一下，我说的是摆脱英国。摆脱英国统治并不等于独立。实际上，刚一开始的时候北美殖民地从上到下都不要求独立，而是要求自治。为什么呢？很简单，他们都把自己看成是英国人。


    我给你举个例子。我们都学过，美国独立战争第一枪是1775年4月在莱克星顿打的。说的是当时殖民地已经组织民兵，反抗英国统治，英国军队去搜查民兵的军火库，结果在一个叫莱克星顿的地方和民兵交火，打响了第一枪。那美国的历史书长时期以来还讲一个细节，说当时著名的爱国者，银匠保罗·里维尔负责侦察英军动向，英军出动以后他就骑马回去报信，一边骑马一边喊“英国人来啦”，然后民兵们做好战斗准备。这个情节你可能也看到过。但我告诉你，这是假的。真实的情况是，保罗·里维尔快马加鞭赶回去的时候，喊的根本不是“英国人来啦”，而是“正规军来啦”。这个差别可太重要了，这充分说明当时殖民地的那些民兵啊，民众啊，完全把自己看成是英国人，心理上还根本没想独立呢。


    你再看精英阶层。当时北美殖民地为了把大家的力量集合起来，成立了大陆会议，就是十三个殖民地的联合议会。这个大陆会议非常重要，实际上它拥有最高决策权。我下一讲还要讲到它。莱克星顿枪声以后，战争实际上已经开始了，但大陆会议提出独立要求了没有？没有提。相反，还向英国政府递交了一份《橄榄枝请愿书》，你看这标题就知道他们是要寻求和平解决的。这份请愿书的核心意思是只要要求高度自治，没有要求独立。那么什么是高度自治呢？就是立法、行政和经济这些实际权力都归殖民地，但是承认英国国王是自己的国家元首。这像什么？这就像今天的加拿大、澳大利亚这些英联邦国家，这些国家都有政府总理，但国家元首是英国女王。


    历史这事情有时候想想会觉得很有意思，假设当时英国政府同意了这份请愿书，那么今天的美国就是一个英联邦国家，至少美国总统这个职位是没有了，它的国家元首应该是英国的女王。这个说远了。我这里强调的只有一点，那就是独立战争刚开始的时候，北美殖民地并没有真的想独立。


    那后来为什么想独立呢？两个原因。


    - 第一个原因是英国政府不接受。英国政府从骨子里看不起北美殖民地，英国国内都把殖民地那些人叫做乡下人，根本不同意他们那种高度自治，决定用武力镇压。所以某种意义上美国是被迫独立。

    - 第二个原因，也是更重要的，就是现实的需要。殖民地的人很清楚，当时英国是世界第一强国，完全凭自己的力量几乎不可能打败它。不过，英国在欧洲大陆有很多仇家，像法国、西班牙、荷兰，其中特别是法国，刚刚被英国抢走了大部分殖民地，它有机会就会报复的，所以几乎是天然盟友。


    我这里再告诉你一些战争幕后的事情：莱克星顿枪声一响，殖民地方面就派本杰明·富兰克林（这个人是美国的开国元勋之一，我在第三节提到过他），派他和法国政府秘密接触。法国很快就同意暗中支援，还专门成立了一个空壳公司，具体运作援助的事情。最后的结果是，在美国决定独立半年多之前，法国就已经运了大量的火药、炮弹，还有将近30000套军服。一些美国历史学家自己也承认，要是没有法国这些援助，美国部队想熬过独立战争的第一个冬天都很彷徨。


    所以你看，法国的支援很重要吧。但法国也有条件，就是你如果想得到更多的援助，甚至是法国直接派军队来帮你打，那就正式结盟，而要结盟，那你必须独立。所以，直到独立战争的第二年，也就是1776年，十三块殖民地才决定重新定位这场战争，不是一场争取平等地位的内战了，而是一场争取独立的战争，是一场国家对国家的战争。接下来的事情你就熟悉了，1776年7月4日，《独立宣言》签署，正式宣布独立，隔天成为美国的国庆节。


    ### 本讲总结


    所以你看，美国最终选择彻底的独立，可不光是像有些书上讲的那样因为爱国热情高涨，而是有很强的现实利益考量。这就是两种视角的结合，


    一个是价值主义，就像爱国热情，它符合崇高的理性价值，


    一个是现实主义，那就是现实当中能管用，能带来实在的好处。


    实际上，我们看美国的事情，不管是今天的还是过去的，都离不开这两个视角。


    ### 本讲交流议题


    最后我还要给你留一个思考题：有没有某个历史事件，当你引入现实主义视角去分析的时候，你会得出和原来不一样的结论？欢迎在留言区分享你的见解。


    **划重点**


    - 某种意义上美国是被迫独立。独立战争原本是一场争取平等地位的内战

