  md: "r_t = c_0 + a_t - θ_1 a_{t-1} - ⋯ - θ_q a_{t-q}\n\nc0 是一个常数项。这里的 a_t 是 AR 模型在\
    \ t 时刻的扰动或者信息，可以发现，该模型使用了过去 q 个时期的随机干扰或预测误差来线性表达当前的预测值。\n\n# 1. MA 模型的性质\n\nMA\
    \ 模型的性质如下。\n\n（1）平稳性。MA 模型总是弱平稳的，因为它们是白噪声序列（残差序列）的有限线性组合。因此，根据弱平稳的性质可以得出：\n\n\
    E(r_t) = c0 Var(r_t) = (1 + θ1² + θ2² + ⋯ + θq²) σa²\n\n（2）自相关函数。对 q 阶的 MA 模型，其自相关函数\
    \ ACF 总是 q 步截尾的，因此 MA(q) 序列只与其前 q 个延迟值线性相关，所以它是一个“有限记忆”的模型。\n\n这一点可以用于确定模型的阶次，后面会进行介绍。\n\
    \n（3）可逆性。在满足可逆条件时，可以将 MA(q) 模型改写为 AR(p) 模型。这里不进行推导，只给出 1 阶和 2 阶 MA 的可逆性条件。\n\n\
    1 阶为\n\n|θ1| < 1\n\n2 阶为\n\n|θ2| < 1, θ1 + θ2 < 1\n\n# 2. MA 的阶次判定\n\n我们通常利用上面介绍的第\
    \ 2 条性质：MA(q) 模型的 ACF 函数 q 步截尾来判断模型阶次，示例如下。\n\n使用上证指数的日涨跌数据（从 2013 年 1 月至 2014\
    \ 年 8 月）来进行分析，先取数据：\n\n```\nIn [17]: data = np.array(IndexData['CHGPct']) # 上证指数日涨跌\n\
    \        IndexData['CHGPct'].plot(figsize=(15,5))\n```"
