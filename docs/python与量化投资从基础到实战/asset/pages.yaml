  md: '__future__模块是包含 Python 未来特性的模块，如果使用的是 Python 2，就可以通过导入这个模块来使用 Python 3 的特性。


    # 2.3.2 比较运算符


    比较运算符可以用于比较两个值，所有的内建类型都支持比较运算。当用运算符比较两个值时，结果是一个逻辑值，不是 True，就是 False。虽然支持比较，但是有
    一点要注意：不同的类型的比较方式不一样，数字类型会根据数字的大小和正负进行比较，而字符串会根据字符串序列值进行比较，等等。如表 2-1 所示。


    表 2-1


    | 运算符 | 描述 | 示例 |

    |---|---|---|

    | == | 检查两个操作数的值是否相等，如果值相等，则条件变为真 | (a==b)不为 true |

    | != | 检查两个操作数的值是否相等，如果值不相等，则条件变为真 | (a!=b)为 true |

    | <> | 检查两个操作数的值是否相等，如果值不相等，则条件变为真 | (a<>b)结果为 true |

    | > | 检查左操作数的值是否大于右操作数的值，如果是，则条件成立 | (a>b)为 true |

    | < | 检查左操作数的值是否小于右操作数的值，如果是，则条件成立 | (a<b)为 true |

    | >= | 检查左操作数的值是否大于或等于右操作数的值，如果是，则条件成立 | (a>=b)为 true |

    | <= | 检查左操作数的值是否小于或等于右操作数的值，如果是，则条件成立 | (a<=b)为 true |


