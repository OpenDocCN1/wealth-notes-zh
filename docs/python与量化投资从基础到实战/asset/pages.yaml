    # 5. 涨跌停


    如果委托的订单在当天一直涨停或者跌停，无法买入或卖出，则订单会一直处于挂单状态，直到收盘。


    # 6. 期货连续合约跳空处理


    连续合约是由不同的合约拼合而成的，前后两个合约存在价差，所以连续合约有明显的价格跳空现象。在前后合约的价差比较大时，会引起策略出现假信号，造成信号失真。优矿提供了价差平移法和前复权法，对连续合约时间序列进行处理，减少假信号造成的影响，同时提供了合约指数，可以直接根据合约指数进行信号生成。


