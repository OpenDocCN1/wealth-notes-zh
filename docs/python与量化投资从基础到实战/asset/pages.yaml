  md: '# Python 与量化投资：从基础到实战


    因为 {a_t} 是白噪声序列，因此有


    E(a_t)=0, Var(a_t)=σ_a²


    所以


    E(r_t)=φ₀+φ₁E(r_{t-1})+φ₂E(r_{t-2})+⋯+φ_pE(r_{t-p})


    根据平稳性的性质，又有


    E(r_t)=E(r_{t-1})=...=u


    所以


    μ=φ₀+φ₁μ+φ₂μ+⋯+φ_pμ E(r_t)=μ= φ₀ / (1−φ₁−φ₂−⋯−φ_p)


    对上式而言，假定分母不为 0，则我们将下面的方程称为特征方程：


    1−φ₁x−φ₂x²−⋯−φ_p x^p =0


    该方程所有解的倒数被称为该模型的特征根，如果所有特征根的模都小于 1，则该 AR(p)序列是平稳的。之所以会有对特征根的限制，是为了保证 Var(r_t)
    的存在。


    下面我们就用该方法检验上证指数日收益率序列的平稳性：


    ```

    In [6]: temp = np.array(data2) # 载入收益率序列

