- pgno: 313
  md: '# 2. 计算公式


    计算 Chaikin Oscillator 指标的方法略显复杂，每个标的证券在每一天都可计算出 Chaikin Oscillator 指标，主要公式为


    α=Money Flow Multiplier=[(Close-Low)-(High-Close)]/(High-Low)

    V=Money Flow Volume=Money Flow Multiplier×Volume for the Period

    ADL=Previous ADL+Current Period''s Money Flow Volume

    Chaikin Oscillator=(3day EMA of ADL)-(10day EMA of ADL)


    该公式看起来略显复杂，我们可以逐行解读。其中，α为两倍收盘价与当日最高价和或者最低价和之差所占当日波动的比例，可以看作一个日内波动幅度系数。V为改进后的日动量值，计算方法为α与当日总成交量的乘积。ADL为前一日的ADL与当日V之和。最后便可求出Chaikin
    Oscillator指标，即3日ADL移动平均与10日移动平均之差。


    # 3. 指标使用说明


    在对 Chaikin Oscillator 指标进行分析时，由于其本身为短线与长线之差，因此我们可以通过其符号的变化对市场进行研判。


    +   (1) Chaikin Oscillator 指标由负变正时，标的资产进入上涨趋势；Chaikin Oscillator 指标由正变负时，标的资产进入下跌趋势。


    +   (2) Chaikin Oscillator 指标因个股的不同而不同，因此需要对历史指标值的变化情况进行观察，判断其规律性的超买超卖界限，从而判断趋势情况。


    # 4. 指标回测


    下面构建基于 Chaikin Oscillator 指标的简单策略，具体策略要求如下。


    +   (1) 如果 Chaikin Oscillator 指标由负变正，则买入；如果 Chaikin Oscillator 指标由正变负，则卖出。


    +   (2) 等权买入符合条件的股票，如果可选的股票少于 10 只，则每只买入 0.1，在出现重复的信号时不重复买入。


    +   (3) 如果股票数量高于可用资金，则随机买入其中一部分，保证资金用完。'
