    # 6.8 资产配置


    资产配置从投资学开设以来就是一个重要的课题，在学术上，海内外取得了重要的突破和进展。早在 19 世纪 90 年代，海外诸多研究及对冲基金的实践都表明资产配置对于投资组合的业绩贡献超过
    90%。在公募 FOF 指引正式出台之后，资产配置更是成为发行 FOF 产品、开发 FOF 策略不可或缺的一部分。


    在实际应用中，资产配置使用的方法相当有限，且每种方法都有其特定的局限性。大类资产配置策略大体可以分为主动策略和量化策略。


    +   主动策略主要是指依据宏观经济、政策等非量化指标来对各资产的预期收益率做出判断，主动调整各类资产的配置权重，例如耶鲁模式。


    +   量化策略则是指根据各资产的风险、收益等量化特征，为了达到特定的风险收益目标而进行模型构建、求解、测验等，最终得出各资产配置权重的方法，主要有经典的马科维茨均值方差模型、Black-Litterman
    模型、风险平价等。


    这里着重介绍资产配置的经典量化方法，包括马科维茨的有效边界、Black-Litterman 模型和风险平价。'
  merge: -1
  img_proc: true
- pgno: 335
  md: "# 6.8.1 有效边界\n\n# 1. 投资者偏好\n\n马科维茨均值方差模型最早提出将数理统计的方法应用到投资组合选择上，并将资产的期望收益率的波动率定义为风险。在该定义下，我们使用收益率的均值\
    \ $E(r)$ 和标准差 $\\sigma(r)$ 来刻画 “收益” 和 “风险”。\n\n通常，我们认为人们是 “风险厌恶” 的，并构造如下形式的效用函数来代表投资者的投资偏好：\n\
    \n$$U(r)=E(r)-\\frac{1}{2}A\\sigma^{2}(r)$$\n\n其中 $E(r)$ 表示投资组合的预期收益率， $\\sigma^{2}(r)$\
    \ 表示投资组合的方差；预期收益率越高，效用值越高，收益方差越大，效用值越小。这表明投资者喜欢更高的 $E(r)$，而不喜欢高的 $\\sigma^{2}(r)$。由于不同的投资者对于风险和收益有不同的偏好，因此在效用函数中加入风险厌恶系数参数\
    \ $A$ 来表示投资者的不同偏好，$A$ 越大，则表示投资者为了追求更高的收益愿意承担更小的风险，或者说该投资者需要更高的收益来补偿面临的风险。\n\n\
    下面的代码构造了不同的 $A$ 对于投资者效用的影响，从输出的图形中可以看出，$A$ 越大，投资者的相同效用值的无差异曲线越陡峭，投资者为承担风险需要的收益补偿越大：\n\
    \n```\nimport seaborn\nimport numpy as np\nimport matplotlib.pyplot as pl\n\n\
    U = 0.3\nsigmas = np.linspace(0., 1., 101)\nAs = [0., 1., 2., 3.]\nindifference_curves\
    \ = []\nfor A in As:\n    Es = [U + 0.5 * A * sig*sig for sig in sigmas]\n   \
    \ indifference_curves.append(Es)\n\nfig = pl.figure(figsize=(9, 6))\nplots = []\n\
    for i, Es in enumerate(indifference_curves):\n    plots.append(pl.plot(sigmas,\
    \ Es, label=\"A = {}\".format(As[i])))\npl.title(\"Indifference Curve with U =\
    \ {}\".format(U))\npl.xlabel(\"$\\sigma(r)$\")\n```"
  merge: -1
  img_proc: true
