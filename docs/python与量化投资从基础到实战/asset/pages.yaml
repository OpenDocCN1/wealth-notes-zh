  md: "对 Python 异常的处理如下：\n\n```\n```\n\"\"\":\n    try...except...else 的语法格式为:\n \
    \   try:\n        #运行识别的代码\n    except:\n        #如果 try 部分引发了异常，则执行此处的代码\n  \
    \  else:\n        #如果都没有发生异常\n\"\"\"\n```\n```\n\n下面通过实例来讲解 try...except...else\
    \ 的用法：\n\n```\nIn [112]: #i=1\n    try:\n        print i\n    except :      #这里一定要指明异常的类型\n\
    \        i=9\n        i+=10\n        print \"刚才 i 没定义，处理了异常之后，i 的值为: \"+str(i)\n\
    Out[112]: 刚才 i 没定义，处理了异常之后，i 的值为: 19\n```\n\n当 i=1 为备注状态时，会执行 except 中的代码：\n\n\
    ```\nIn [113]: #处理多种异常\n    i=10\n    #j=\"a\"\n    try:\n        print i+j\n\
    \    except NameError:\n        i=j=0\n        print \"刚刚 i 或 j 没有进行初始化数据，现在我们将assic​初始化为\
    \ 0，结果是: \"\n        print i+j\n    except TypeError:\n        print \"刚刚 i 与\
    \ j 类型对应不上，我们转换一下类型即可处理异常，处理后：结果是: \"+str(i)+str(j)\nOut[113]:\n    刚刚 i 或 j 没有进行初始化数据，现在我们将其都初始化为\
    \ 0，结果是:\n    0\n```\n\n常见的 Python 异常如表 2-4 所示。"
