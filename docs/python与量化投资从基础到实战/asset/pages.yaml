    # 2.2 Python 语法基础


    # 2.2.1 常量与变量


    在 Python 中程序运行时不会被更改的量叫作常量，比如数字 7 和字符串"abc"在运行时一直都是数字 7 与字符串"abc"，不会被更改成其他量，它们就是常量。除此之外，我们可以定义任意字符串为指定值的常量。常量有一个特点，即一旦被绑定，就不能更改。在
    Python 中是不能像 C 等编程语言一样通过 const 来定义常量的，在 Python 中可以直接创建而不需要定义。在 Python 中随着程序的运行而更改的量叫作变量，比如我们可以定义一个变量
    i，并将数字 5 赋给变量 i，再将数字 7 赋给变量 i，这时 i 的值就变成了 7。可.configuration，i 的值是可以更改的，像 i 这样的可以更改值的量叫作变量。变量有一个特点：既可被赋值，也可被更改。


    # 2.2.2 数与字符串


    在 Python 中数的类型主要有 5 种，分别为有符号整数型（int）、长整型（long）、浮点型（float）、布尔型（bool）和复数型（complex）。具体如下所示：


    +   ◎ 0、1、-1、1009、-290 等是 int 型；'
