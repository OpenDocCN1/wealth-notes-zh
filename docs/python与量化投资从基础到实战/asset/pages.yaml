  md: "# Python 与量化投资：从基础到实战\n\n# 3.2.11 DataFrame 切片与筛选\n\nDataFrame 有三种切片方法，分别为\
    \ loc、iloc 和 ix。\n\ndf.loc 的第 1 个参数是行标签，第 2 个参数为列标签（为可选参数，默认为所有列标签），这两个参数既可以是列表，也可以是单个字符。如果这两个参数都为列表，则返回\
    \ DataFrame，否则返回 Series：\n\n```\nIn [86]: a=pd.read_csv('closeprice.csv',encoding='gbk')\n\
    In [87]: a\nOut[87]:\n    Unnamed: 0   ticker  secShortName  tradeDate  closePrice\n\
    0    0          1       平安银行       2017-06-20  9.12\n1    1          2       万科A\
    \         2017-06-20  21.03\n2    2          4       国农科技       2017-06-20  27.03\n\
    3    3          5       世纪星源       2017-06-20  5.45\n4    4          6       深振业\
    \ A       2017-06-20  8.87\n5    5          7       全新好         2017-06-20  15.87\n\
    In [88]: a.loc[:,['ticker','closePrice']]\nOut[88]:\n    ticker  closePrice\n\
    0   1       9.12\n1   2       21.03\n2   4       27.03\n3   5       5.45\n4  \
    \ 6       8.87\n5   7       15.87\n```\n\n“a.loc[” 中的 “:” 表示所有的行。\n\ndf.loc 的第\
    \ 1 个参数是行的位置，第 2 个参数是列的位置（为可选参数，默认为所有列标签），这两个参数既可以是列表，也可以是单个字符。如果两个参数都是列表，则返回\
    \ DataFrame，否则返回 Series：\n\n```\nIn [89]: a.iloc[:4,[1,4]]\nOut[89]:\n    ticker\
    \  closePrice\n0   1       9.12\n```"
  merge: -1
  img_proc: true
- pgno: 94
  md: "其中，loc 为 location 的缩写，iloc 为 integer location 的缩写。\n\n更广义的切片方式是使用.ix，它会自动根据我们给出的索引类型判断是使用位置还是标签进行切片：\n\
    \n```\nIn [90]: a.ix[:4,['ticker','closePrice']]\nOut[90]:\n      ticker closePrice\n\
    0     1      9.12\n1     2     21.03\n2     4     27.03\n3     5      5.45\n4\
    \     6      8.87\n```\n\n主要根据设置的条件进行筛选，通过逻辑指针进行数据切片，在 DataFrame 中寻找满足条件的记录，方法如下：\n\
    \n```\nIn [91]: a[a.closePrice>10]\nOut[91]:\n      Unnamed: 0  ticker secShortName\
    \ tradeDate closePrice\n1            1      2  万科A       2017-06-20  21.03\n2\
    \            2      4  国农科技    2017-06-20  27.03\n5            5      7  全新好 \
    \     2017-06-20  15.87\n```\n\n也可以同时设置多个条件：\n\n```\nIn [92]: a[(a.closePrice>10)\
    \ & (a.ticker>3)]\nOut[92]:\n      Unnamed: 0  ticker secShortName tradeDate closePrice\n\
    2            2      4  国农科技    2017-06-20  27.03\n5            5      7  全新好 \
    \     2017-06-20  15.87\n```\n\n实际上，因为一个 bool 类型的数据乘以 1，可以变为 1,0，所以可以将上述条件写为：\n\
    \n```\nIn [93]: a[(a.closePrice>10)*1 + (a.ticker>3)*1==2]\nOut[93]:\n      Unnamed:\
    \ 0  ticker secShortName tradeDate closePrice\n2            2      4  国农科技   \
    \ 2017-06-20  27.03\n5            5      7  全新好      2017-06-20  15.87\n```\n\n\
    上述做法可以用于条件筛选，比如在至少或至多满足几个条件时进行筛选。"
