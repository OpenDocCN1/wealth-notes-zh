- pgno: 205
  md: '# 6.1.2 量化投资策略的类型


    量化投资策略有很多种分类方式，比如按照标的分类、按照技术分类、按照组合构建方式分类等。每种分类方式之间都不是互相独立的，每家投资机构内部的分类方式也各有特点。在此我们按照比较常见的按照标的分类的方式大概做一个梳理。


