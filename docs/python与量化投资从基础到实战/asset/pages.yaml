  md: '# 2. universe（证券池）


    universe 指策略回测的证券池，即策略逻辑作用的域，下单与历史数据获取都只限于 universe 中的证券。universe 支持全部 A 股及全部可在二级市场交易的
    ETF 与 LOF；还支持以三种方式获取证券池：DynamicUniverse、set_universe 和 StockScreener；也可以使用固定的股票列表，例如[''000001.XSHE'',
    ''600000.XSHG'']。对这个参数的设置，主要是为了让回测平台能够提前预加载相关数据，以加快回测速度。


    其类型为 list。


    示例如下：


    ```

    universe = [''000001.XSHE'', ''600000.XSHG'']                    # 静态证券池

    universe = set_universe(''HS300'', date=''2016-03-01'')        # 静态证券池

    universe = DynamicUniverse(''HS300'')                        # 动态证券池

    universe = StockScreener(Factor.PE.nlargest(10))          # 动态证券池

    ```


    # 3. set_universe（静态证券池）


    用于返回预设的证券代码列表，支持行业成分股、指数成分股。当资产池指定为一个特定的列表时，策略框架仅返回相应列表中的内容。示例代码如下：


    ```

    set_universe(symbol, date)

    ```


    set_universe(symbol, date)中的参数 symbol 指证券代码列表的名字，为 str 或预设的行业与指数实例类型，用法如下。


    （1）当参数为 str 类型时，支持 7 个预设值，其中，SH50 表示上证 50；SH180 表示上证 180；HS300 表示沪深 300；ZZ500
    表示中证 500；CYB 表示创业板；ZXB 表示中小板；A 表示全 A。对于该类型的参数，可以用 DataAPI.IdxGet()函数获取所有指数的 secID
    值。示例如下：


    ```

    set_universe(''HS300'')  # 表示沪深300 的字符串

    ```


    （2）预设的行业实例和指数实例指具体支持的行业和指数，在 Notebook 中也有自动代码提示功能，可帮助我们查找行业和指数的名称。


    行业实例如下：


    ```

    set_universe(IndSW.YinHangL2)  # 行业分类实例 IndSW, 申万行业; YinHangL2, 银行二级行业分类

    ```'
