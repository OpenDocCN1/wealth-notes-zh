  md: "# 2. 元组（Tuple）\n\n在 Python 中与数组类似的还有元组，元组中的元素也进行索引计算。列表和元组的差别在于：列表中的元素的值可以修改，而元组中的元素的值不可以修改，只可以读取；另外，列表的符号是[]，而元组的符号是()，示例如下：\n\
    \n```\nIn [13]: #元组\n    students=(\"小明\",\"小军\",\"小强\",\"小武\",\"小龙\")\n    print\
    \ students[1]\nOut[13]: 小军\nIn [14]: #元组\n    students=(\"小明\",\"小军\",\"小强\",\"\
    小武\",\"小龙\")\n    students[1]=\"小云\"\n    print students[1]\n--------------------------------------------------\n\
    TypeError                               Traceback (most recent call last)\n<ipython-input-9-e8b2ee4ae754>\
    \ in <module>()\n  2 students=(\"小明\",\"小军\",\"小强\",\"小武\",\"小龙\")\n  3 \n---->\
    \ 4 students[1]=\"小云\"\n  5 print (students[1])\nTypeError: 'tuple' object does\
    \ not support item assignment\n```\n\n元组比列表更加安全，因为不能修改，所以可以安全地保存一个引用，而不用担心里面的内容被其他程序修改，从而导致逻辑错误。\n\
    \n# 3. 集合（Set）\n\n在 Python 中集合主要有两个功能：一个功能是进行集合操作，另一个功能是消除重复的元素。集合的格式是 set（元素），示例如下：\n\
