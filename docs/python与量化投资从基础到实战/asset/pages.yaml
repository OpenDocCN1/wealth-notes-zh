  md: "# 2. confusion_matrix (混淆矩阵)\n\n我们在上面提到过，针对由 TP、FP、FN、TN 组成的预测值（真实值），矩阵可以帮助我们分辨被正确分类及错误分类的样本数。\n\
    \n使用方法如下：\n\n```\nmetrics.confusion_matrix(y_true, y_pred, labels=None, sample_weight=None)\n\
    ```\n\n其中，y_true 为测试集的真实类别，y_pred 为测试集的预测类别。Labels 表示混淆矩阵的索引，若未赋值，则按照 y_true、y_pred\
    \ 中出现过的Sus 值进行排序。示例如下：\n\n```\nIn [179]:from sklearn.metrics import confusion_matrix\n\
    \    y_true = [2, 0, 2, 2, 0, 1]\n    y_pred = [0, 0, 2, 2, 0, 2]\n    confusion_matrix(y_true,\
    \ y_pred)\nOut[179]:\n    array([[2, 0, 0],\n           [0, 0, 1],\n         \
    \  [1, 0, 2]])\n```\n\n对角线代表被正确分类的样本数，其余位置均代表被错误分类的样本数：\n\n```\nIn [180]:y_true\
    \ = [\"cat\", \"ant\", \"cat\", \"cat\", \"ant\", \"bird\"]\n    y_pred = [\"\
    ant\", \"ant\", \"cat\", \"cat\", \"ant\", \"cat\"]\n    confusion_matrix(y_true,\
    \ y_pred, labels=[\"ant\", \"bird\", \"cat\"])\nOut[180]:\n    array([[2, 0, 0],\n\
    \           [0, 0, 1],\n           [1, 0, 2]])\n```\n\n在本例中，0 代表 ant，1 代表 bird，2\
    \ 代表 cat。混淆矩阵结果表明：两只 ant 均被正确识别，在 3 只 cat 中有两只被正确识别，有一只被识别为 ant，而唯一的 bird 被识别为\
    \ cat。\n\n# 3. roc_curve (ROC 曲线)\n\nROC 曲线指接收者操作特征曲线（Receiver Operating Characteristic\
    \ Curve），根据一系列不同的二分类方式，以真阳性率（灵敏度）为纵坐标，以假阳性率（1-特异度）为横坐标绘制曲线，可体现敏感性与特异性的相互关系。其中，纵坐标（真阳性率\
    \ TPR 或灵敏"
  merge: -1
  img_proc: true
- pgno: 139
  md: "度）的计算公式如下：\n\nTPR=TP/(TP+FN)\n\n横坐标（假阳性率 FPR）或特异度的计算公式如下：\n\nFPR=FP/(FP+TN)\n\
    \n另外，ROC 曲线下的面积 AUC（Area Under Curve）是对模型准确率的度量。\n\nROC 曲线的使用方法如下：\n\n```\nmetrics.roc_curve(y_true,\
    \ y_score, pos_label=None, sample_weight=None, drop_intermediate=True)\n```\n\n\
    其中，y_true 为测试集的真实类别，y_score 为测试集属于正值样本的概率。该函数有三个返回变量：fpr、tpr 和阈值 thresholds。thresholds\
    \ 为一阈值，当 score 大于或等于它时，我们认为它为正样本，否则为负样本。每取一个不同的 thresholds，便可得到一对互相相对应的 FPR 和\
    \ TPR，即 ROC 曲线上的一个点，将这些点连起来便构成了 ROC 曲线，效果如图 3-25 所示：\n\n```\nIn [181]: import\
    \ numpy as np\n    from sklearn import metrics\n    y = np.array([1, 1, 2, 2])\n\
    \    scores = np.array([0.1, 0.4, 0.35, 0.8])\n    fpr, tpr, thresholds = metrics.roc_curve(y,\
    \ scores, pos_label=2)\n    print(fpr)\n    print(tpr)\n    print(thresholds)\n\
    Out[181]:\n    array([ 0. ,  0.5,  0.5, 1. ])\n    array([ 0.5,  0.5,  1.,  1.\
    \ ])\n    array([ 0.8 ,  0.4 ,  0.35,  0.1 ])\nIn [182]: %matplotlib inline\n\
    \    plt.plot(fpr,tpr)\nOut[182]:\n```"
