    是不是很方便？我们还可以通过查询优矿专业版的帮助文档，来获得更多的功能。


    # 6.6 Smart Beta


    Smart Beta（聪明贝塔，又称智慧型投资策略）是指在传统的指数投资基础上，通过系统性的方法对指数中选股和权重进行优化，以跑赢传统指数投资的策略。与传统的市值加权指数相比，在传统的指数中市值越高的个股将占有越大的权重，往往将指数投资者暴露于被高估的股票及投资集中的风险中。而
    Smart Beta 与传统的指数编制方法不同，它通过对传统指数选股及权重的优化，在指数化被动管理的同时，相对于传统指数也能够取得一定的超额收益。


    下面分别从基于权重优化和基于风险因子的角度进行详细介绍。


    # 6.6.1 基于权重优化的 Smart Beta


    本节详细介绍从权重优化角度来看各种配置方法的理论与实践，包括等权组合、最小方差组合、风险平价组合和最大多元化组合。


    # 1. Beta 简介


    众所周知，Beta 在 CAPM 模型中衡量了相对于持有整个市场所带来的风险溢价（Risk Premium）的大小。我们通常用市场投资组合或市场指数基金来表示整个市场，市场指数通常都是市值加权（Market
    Capitalization Weighted），如果把市场指数换成按非市值加权的指数或投资组合，则得到的 Beta 就是 Smart Beta。下面分别从等权组合、最小方差组合、风险平价组合、最大多元化组合这
    4 个角度进行权重优化。


    # 2. 原理与算法


    1）等权重


    每个成分股的权重都一样，权重的计算公式如下，其中，N 为成分股的个数：


    $w_i = \frac{1}{N}$'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# 2）最小方差


    用于保证组合整体风险最小，可以用如下优化问题表示：


    ```

    w* = min(1/2 ω''Ωω)

    s.t.  w''1 = 1

    ω_i ≥ 0

    ```


    在上式中，Ω 为各资产的协方差矩阵，ω 为各资产的权重列向量。


    # 3）风险平价


    用于保证每个资产对组合整体风险的贡献都一样，可以用如下优化问题表示：


    ```

    min f(ω) = Σ_{i=1}^N Σ_{j=1}^N [ω_i (Ωω)_i - ω_j (Ωω)_j]^2

    s.t.  w''1 = 1

    ω_i ≥ 0

    ```


    在上式中，Ω 为各资产的协方差矩阵，ω 为各资产的权重列向量。


    # 4）最大多元化


    首先假设组合投资没有风险的功能，那么组合波动率就可以像收益率一样加权求得，但在实际情况下组合投资可以降低组合风险，那么最大多元化（也就是最大分散度）可以被定义为加权波动率与真实波动率的比值，求解过程就可以转换为如下优化问题：


    ```

    max D(ω) = ω''σ / sqrt(ω''Ωω)

    s.t.  w''1 = 1

    ω_i ≥ 0

    ```


    在上式中，Ω 为各资产的协方差矩阵，ω 为各资产的权重列向量，σ 为各资产的标准差列向量。


