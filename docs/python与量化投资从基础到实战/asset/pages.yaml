    图 5-4


    图 5-3 和图 5-4 实现的是一个动量策略，其策略思想非常简单，为选取过去 60 个交易日累积收益率最高的 60 只股票买入，换仓频率为 60 天。可以看出，该策略最后的表现结果一般，比指数略好，不过本章的重点不在于评价策略，而是深入学习如何编写策略。


    首先，我们看到策略的第 1 句引入了 Pandas 模块 “import pandas as pd”，这是由于我们在编写策略时在后面用到了这个模块。我们应当引入所有可能需要的外部模块，通常将其写在策略代码的开头。


    对接下来的几个设置我们已经有所了解，回测区间是 2014 年 11 月 1 日至 2018 年 1 月 1 日，股票池是动态沪深 300 成分股，比较基准是沪深
    300 指数，调仓频率是每 60 个交易日调仓一次，此处没给出频率参数，默认是 “d”（天）。


    注意，这里出现了之前没有讲到过的 max_history_window ，之所以需要设置它，是因为我们在 handle_data 中调用了 context
    的 history 方法。max_history_window 默认对日线数据支持 30 个交易日，对分钟线支持 240 条 K 线数据，回溯长度在超出范围时需要手动指定。当在
    history 中调用的历史数据窗口大于 max_history_window 的默认值时，会报出类似如下所示的错误：


    ```

    ValueError: Exception in "Context.history":history overflow.Your current max daily
    history window is 30. Please use a shorter parameter, or change max_history_window
    in your initial

    ```


    所以，如果我们想用 context 自带的 history 方法，就需要确保此时的 max_history_window 大于调用历史数据窗口。'
