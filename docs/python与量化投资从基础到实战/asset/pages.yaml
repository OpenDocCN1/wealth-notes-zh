  md: '# Python 与量化投资：从基础到实战


    # 3.2.1 Pandas 的数据结构


    Pandas 的数据结构主要分为三种： Series（一维数组）、 DataFrame（二维的表格型数据结构）和 Panel（三维数组）。


    # 1. Series


    Series 指一维数组，与 NumPy 中的一维 Array 类似。 Series、Array 与 Python 基本的数据结构 List 也很相近，其区别是：在
    List 中的元素可以是不同的数据类型，而在 Array 和 Series 中则只允许存储相同的数据类型，这样可以更有效地使用内存，提高运算效率。


    Series 增加了对应的标签（label）以用于索引，可以包含 0 个或者多个任意数据类型的实体。其中，标签索引赋予了 Series 强大的存取元素功能。除通过位置外，
    Series 还允许通过索引标签进行元素存取：


    ```

    In [41]: obj = pd.Series([40, 12, -3, 25])

    In [42]: obj

    Out[42]:

    0    40

    1    12

    2    -3

    3    25

    ```


    Series 的字符串表现形式为：索引在左边，值在右边。因为在建立过程中没有指定索引，所以 Python 会自动为我们加入一个 0~n 的整数索引，我们可以通过数字获取具体位置上的元素：


    ```

    In [43]: obj[0]

    Out[43]: 40

    ```


    可以通过 index 与 values 获取 Series 的索引与数据：


    ```

    In [44]: obj.index

    Out[44]: RangeIndex(start=0, stop=4, step=1)

    In [45]: obj.values

    Out[45]: array([40, 12, -3, 25], dtype=int64)

    ```


    当然，也可以在 Series 建立时就指定索引：


    ```

    In [46]: obj = pd.Series([40, 12, -3, 25], index=[''a'',''b'',''c'',''d''])

    ```'
