    # 2. 滑点


    在真实的证券成交环境下，下单的点位和最终成交的点位往往有一定的偏差，在订单委托到市场后，会对市场的走向造成一定的影响，比如买单会提高市场价格，卖单会降低市场价格。这类冲击成本会造成滑点的出现。优矿为了更真实地模拟策略在真实市场的表现，在回测时提供了滑点模式，用于评估由于市场冲击和交易价格变化引起的交易成本变化。我们可以通过设置
    slippage 关键字来设置具体的滑点信息，默认的滑点为 0。


    # 3. 交易税费


    交易税费主要包含券商手续费和印花税。优矿回测默认采用买入千分之一、卖出千分之二的税费。如果需要进行更加细微的调整，则可以通过设置回测初始化参数 commission
    关键字来自定义税费信息。


