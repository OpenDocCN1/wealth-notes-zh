- pgno: 236
  md: '# 6.5 CTA 策略


    部分读者可能对 CTA 策略不太了解，本节会简单介绍 CTA 策略的概念。CTA 是 Commodity Trading Advisor Strategy
    的缩写，从字面意思来看，是指商品交易顾问，也是指投资于期货的资产管理产品。


    从海外来说，CTA 基金的管理规模已经超过 3000 亿美元，业绩稳定，与其余市场策略的相关性较低，受到很多成熟投资者的青睐。但是对于国内来说，CTA 的起步较晚，规模较小，其余产品也多以自有资金为主，不接受外来资金，所以
    CTA 并不为国内的投资者所熟知。


    CTA 基金也分为两大阵营：主观 CTA 和量化 CTA。前者依靠基金管理人基于基本面调研或以往的交易经验来判断后续走势，决定何时买进卖出，做空做多，但是这种做法受市场及基金管理人的主观影响很大，所以其份额逐渐被量化
    CTA 所蚕食，而后者正是本节的重点所在；量化 CTA 策略通过分析建立数量化的交易模型，并根据交易模型所产生的买卖信号进行投资决策。


    量化 CTA 策略也分为两种：趋势跟随策略和均值回复策略。


    +   ◎ 趋势跟随策略利用大量的模型寻找当前的市场趋势，判断多空，只要存在大幅度的上涨和下跌，则都能获利，但是在市场波动较小或震荡市期间，这种策略可能因为不停地止损而出现回撤。\n◎
    均值回复策略则主要应用在跨期、跨品种配对交易中，根据价差反转套利，和股票市场中的高抛低吸类似，核心思想是利用历史走势基本一致地对资产进行套利。


    # 6.5.1 趋势跟随策略


    在投资市场中，可将趋势形态简单地分为三种：上升趋势、下降趋势和震荡趋势。趋势跟随是一种基于价量分析的投资方式，其基本策略是在趋势开始形成时选择趋势方向买入，等待趋势结束后卖出。趋势跟随通常用作中长线策略或者周期较长的短线策略（三五天左右），很少应用在交易频率较高的日内交易中。鉴于趋势跟随赚取的是市场大涨或大跌状态下的钱，所以在长期盘整的震荡趋势中不适合配置趋势跟随策略。趋势跟随策略历'
  merge: -1
  img_proc: true
- pgno: 237
  md: '史久远，有很多著名的趋势跟随系统为聪明的投资者带来了巨大的财富，例如海龟交易法则、Dual Thrust 交易法则、各类突破交易法则等。


    期货市场是零和博弈，有盈有亏，投机商其实是在参与一场有技术含量的赌博。在赌场中，通常优势在庄家一边，因为庄家可以掌握更多的资源，所以可以更有力地影响市场。因此老练的玩家们在大多数时间都玩得很小，而是静待时机，等到确保大概率情况下的赢利势头后再加大赌注，从市场中获利。在期货市场中，集体的力量会构成趋势，在通常情况下的大笔赢利也都来源于这种趋势。趋势交易者从概率的角度去看待问题，从历史数据中判断在概率角度上有利的操作方式，遵从最大概率原则并顺势而为，避免预测未来，这样才能在长远的交易中取胜。当评判
    CTA 策略的收益表现时，可以粗略地将某策略的收益拆解为两部分，如下式所示：


    R = k × r_wl r_wr


    其中，R 代表策略收益；r_wl 代表盈亏比，为在一个交易段中赢利数额和亏损数额的比值；r_wr 代表胜率，为在交易中赢利次数的占比，k 代表正则系数。


    对于类型不同但表现相当的策略，其收益来源可能会有很大的差别。有的策略重在高盈亏比 r_wl，在其交易中可能有的交易是亏钱的，但是亏小赚大，总体期望是赚钱的，通常趋势策略属于这一类；有的策略重在高胜率
    r_wr，在交易次数较多的情况下，总体是能赚钱的，有不少反转策略属于这一类。


    趋势交易者的信仰如下。


    +   还不错的胜率：使用“还不错”来形容，旨在表明趋势策略通常追求盈亏比而非胜率。胜率在 40% 以上的趋势策略，只要盈亏比够高，则在长期期望下也是赚钱的。


    +   较高的盈亏比：趋势策略赚市场大涨大跌的钱，通常追求较高的盈亏比来达到赢利的目的。在趋势形成时通过持仓或加仓来扩大收益，在趋势结束时或方向判断错误时及时止损，可获得较高的盈亏比。


    本节展示较为简单的双均线策略。


    # 1. 双均线突破——无止盈止损


    利用短期均线 MA_S 和长期均线 MA_L 生成开平仓信号。'
