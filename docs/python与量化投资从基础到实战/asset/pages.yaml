  md: '# 6.4.1 麦克·欧希金斯绩优成分股投资法


    提起麦克·欧希金斯，你可能并没有什么印象，然而提起“狗股理论”，你可能就略知一二了。不错，麦克·欧希金斯正是畅销书《战胜道琼斯》(Beating the Dow)及《用债券战胜道琼斯》(Beating
    the Dow with Bonds)的作者，也是狗股理论的发明人。


    麦克·欧希金斯出生于委内瑞拉，由于他的父亲身处石油行业，所以他从小就辗转于南美、东南亚、北非和欧洲等多个国家生活及学习，其丰富的经历为他将来的投资生涯奠定了坚实的基础。


    在获得锡耶纳学院的经济学学士学位后，麦克·欧希金斯曾在宝洁工作过一段时间，随后于1971年进入投资行业，担任Spencer Trask & Company及White,
    Weld & Company的证券经纪人，并于1978年年初开办了自己的资产管理公司。


    麦克·欧希金斯一直是《时代周刊》《巴伦周刊》《福布斯》《商业周刊》《金融世界》《华尔街日报》《纽约时报》《今日美国》《金融时报》及CNBC、PBS的常客。他是典型的价值投资者，持股周期往往高于一年，是长期投资的典范。他的投资方法简单有效，即使对于没有精力深入基本面研究的投资者，也非常实用，他希望使用简单的策略来达到长期击败市场的目的。


    # 1. 策略说明


    麦克·欧希金斯所使用的选股方法极为简单，他将道琼斯指数的成分股作为股票池，挑选股息率最高的10家公司进行投资组合，每年进行一次调仓。以下是麦克·欧希金斯的基本投资逻辑。


    +   （1）选取道琼斯工业指数30支成分股。

    （2）选出股息率最高的10家公司，如果第10家及第11家股息率相同，则选择收盘价较低的个股。

    （3）等权构建投资组合。

    （4）每年调整一次投资组合。


