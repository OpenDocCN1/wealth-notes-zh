  md: '# 2.3.4 Python 中的优先级


    在 Python 中程序或运算符的执行是有先后顺序的，比如，A 与 B 同时出现，如果 A 可以优先于 B 执行，就说明 A 的优先级比 B 的优先级高；其中，A
    与 B 可以是运算符，也可以是程序。也就是说，Python 中的优先级分为两种，一种是程序之间的优先级，另一种是运算符之间的优先级。这里主要讨论运算符之间的优先级，在运算符优先级排行榜中，各运算符的排行名次如下。


    +   第 1 名：函数调用、寻址、下标。


    +   第 2 名：幂运算**。


    +   第 3 名：翻转运算~。


    +   第 4 名：正负号。


    +   第 5 名：*、/、%。


    +   第 6 名：+、-。


    +   第 7 名：<<、>>。


    +   第 8 名：按位&、^、|，其实这三个也是有优先级顺序的，但是它们处于同一级别，所里这里不再细分。


    +   第 9 名：比较运算符。


    +   第 10 名：逻辑的 not、and、or。


    +   第 11 名：Lambda 表达式。


    关于其具体讲解，读者可自行参考配套代码。


    # 2.4 Python 中的控制流


    在 Python 中程序代码总是按照一定顺序执行的，如果想改变代码的执行顺序，比如我们有时需要从上到下按顺序执行，有时需要跳转执行，有时需要选择不同的分支执行，有时甚至需要循环地执行，这时就要用到控制流。我们通常根据不同的需要来选择控制语句，以控制某些代码段的执行方式，这些不同功能的控制语句就叫作控制流。'
  merge: -1
  img_proc: true
