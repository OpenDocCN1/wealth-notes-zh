  md: "```\nOut[185]:\n    0.33...\nIn [186]:recall_score(y_true, y_pred, average=None)\n\
    Out[186]:\n    array([ 1.,  0.,  0.])\n```\n\n决策树算法易于理解，计算简单，能够处理有缺失属性的样本及不相关的特征，在短时间内可对较大的数据做出可行且效果良好的判断。但决策树也存在一些问题，比如忽略了数据之间的相关性、容易出现过拟合等。\n\
    \n# 3.6.4 深度学习\n\n提高模型复杂度容易导致训练效率降低、过拟合等。随着大数据、云计算时代的到来，越来越多的问题的数量级迅速增大，计算机处理能力也随之大幅提升。深度学习算法是对人工神经网络的进一步发展。建立庞大、复杂的神经网络的一个简单办法就是增加隐藏层的数量，从而增加了拥有激活函数的神经元数量和激活函数嵌套的层数。\n\
    \n深度学习可分为有监督学习和无监督学习。不同的模型适用于不同的学习框架。卷积神经网络（Convolutional neural networks，CNN）是在有监督学习下的常见模型，深度置信网络（Deep\
    \ Belief Nets，DBNs）则是在无监督学习下的常用模型。深度学习目前已在计算机视觉、语音识别、自然语言处理等领域得到较好的应用，在量化投资方面也有很大的开发潜力。\n\
    \n# 3.7 SQLAlchemy 与常用数据库的连接\n\n在生产环境中我们不可能总是通过 Excel 或者 CSV 文件读取或存储数据，因为对于大量的数据来说，这种方法十分低效，更好的方法是通过连接数据库来进行相关操作，本节将着重介绍这种方法。\n\
    \nSQLAlchemy 是 Python 下的一款开源库，提供了 SQL 工具包及对象关系映射（ORM）工具，采用了简单的 Python 语言，为高效和高性能的数据库访问设计实现了完整的企业级持久模型。我们可以使用\
    \ SQLAlchemy 进行传统的数据库操作“增删改查”，使得 Python 也具有了 Web 开发的能力。对于量化投资而言，我们的需求也是类似的，在很多时候我们需要通过连接\
    \ wind 底层数据库来获取股票数据。在做多因子策略时，我们也会对某一"
