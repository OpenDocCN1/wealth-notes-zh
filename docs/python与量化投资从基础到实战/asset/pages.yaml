- pgno: 55
  md: "# 3. continue 语句与 break 语句的区别\n\ncontinue 语句指的是结束执行本次循环中剩余的语句，然后继续下一轮的循环；而\
    \ break 语句指的是直接结束这个循环，包括结束执行该循环的剩余的所有次循环。\n\n请区分以下两个程序。\n\n程序 1 如下：\n\n```\nIn\
    \ [63]: for i in range(10,19):\n    if i==15:\n        continue\n    print i\n\
    \nOut[63]:\n10\n11\n12\n13\n14\n16\n17\n18\n```\n\n程序 2 如下：\n\n```\nIn [64]: for\
    \ i in range(10,19):\n    if i==15:\n        break\n    print i\n\nOut[64]:\n\
    10\n11\n12\n13\n14\n```\n\n在程序 2 中，i=15 及之后均没有输出，因为执行遇到 break，直接跳过了剩余的所有循环，而程序\
    \ 1 仅跳过了 i=15 这一此循环。"
