- pgno: 18
  md: '# 第1章


    # 准备工作


    # 1.1 Python 的安装与设置


    Python 虽然好用，但是想用好它却不容易，其中，让人比较头疼的就是包管理及 Python 的不同版本的问题，特别是在使用 Windows 的时候。为了解决这些问题，出现了不少发行版的
    Python，比如 WinPython、Anaconda 等，这些发行版将 Python 和许多常用的 Package 打包，以方便人们直接使用，还提供了
    virtualenv、pyenv 等工具管理虚拟环境。


    笔者尝试了很多类似的发行版，最终选择了 Anaconda。Anaconda 是一个用于科学计算的 Python 发行版，支持 Linux、Mac、Windows
    系统，提供了强大的包管理与环境管理的功能，可以很方便地解决多版本的 Python 并存、切换及各种第三方包安装的问题。Anaconda 通过工具或命令 conda
    进行包管理和环境管理，并且包含了与 Python 相关的配套工具。这里说一下 conda 的设计理念，conda 将几乎所有工具、第三方包都当作 Package，甚至包括
    Python 和 conda 自身。因此，conda 打破了包管理与环境管理的约束，能非常方便地安装各种版本的 Python 及各种 Package，并方便地切换。


    从 Anaconda 官网 https://www.continuum.io/downloads 下载 Anaconda，在下载后直接'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'Python 与量化投资：从基础到实战


    按照说明安装即可。在安装时会发现有两个不同版本的 Anaconda，分别对应 Python 2 和 Python 3。其实，安装哪个版本并不重要，因为通过环境管理，我们可以很方便地切换运行时的
    Python 版本。注意，尽量按照 Anaconda 默认的行为安装，即不使用 root 权限，仅为个人安装，将安装目录设置在个人主目录下（对于 Windows
    就无所谓了），这样做的好处是：在同一台机器上的不同用户完全可以安装、配置自己的 Anaconda，不会互相影响。


    本书附带的代码采用 Python 2 编写，但是读者可以使用 Python 3 运行，不会遇到代码方面的麻烦。


    # 1.2 常见的 Python 库


    本节为刚接触 Python 的读者简单介绍常见的 Python 库。


    # 1. NumPy


    NumPy 是 Python 的一种开源的数值计算扩展，可用来存储和处理大型矩阵，比 Python 自身的列表结构要高效得多。NumPy 底层使用 BLAS
    作为向量，各种运算的速度也得到大幅提升。它主要包括：


    +   - 强大的 N 维数组对象 Array；

    - 比较成熟的（广播）函数库；

    - 用于整合 C、C++和 Fortran 代码的工具包；

    - 实用的线性代数、傅里叶变换和随机数生成函数，使 NumPy 和稀疏矩阵运算包 SciPy 的配合使用更加方便。


    另外，NumPy 中的数据类型在 Pandas、Scikit-Learn、StatsModels 等库中被作为基本数据类型使用。


    # 2. Pandas


    Python 之所以能成为强力的数据分析工具，和 Pandas 库有很大的关系。Pandas 的主要应用环境如下：


    +   （1）数据的导入与导出；'
  merge: -1
  img_proc: true
- pgno: 20
  md: '+   (2) 数据清理；

    (3) 数据挖掘与探索；

    (4) 为分析做数据处理与准备；

    (5) 结合 Scikit-Learn、StatsModels 进行分析。


    在本书中用得最多的 Pandas 对象是 DataFrame，它是一个二维数据表结构，包含多行多列，如表 1-1 所示。


    # 表 1-1


    |  | secID | ticker | secShortName | tradeDate | closePrice |

    |---|-------|--------|--------------|-----------|------------|

    | 0 | 000001.XSHE | 000001 | 平安银行 | 2017-06-20 | 9.12 |

    | 1 | 000002.XSHE | 000002 | 万科A | 2017-06-20 | 21.03 |

    | 2 | 000004.XSHE | 000004 | 国农科技 | 2017-06-20 | 27.03 |

    | 3 | 000005.X5HE | 000005 | 世纪星源 | 2017-06-20 | 5.45 |

    | 4 | 000006.XSHE | 000006 | 深振业A | 2017-06-20 | 8.87 |

    | 5 | 000007.XSHE | 000007 | 全新好 | 2017-06-20 | 15.87 |


    相对于 R 等统计软件，Pandas 借鉴了 R 的数据结构，因此拥有了 R 的很多方便的数据操作特性；在语法设计上，Pandas 比 R 和 Stata
    更严谨且更简洁易用；基于 Python 自动管理内存的能力，以及在很多细节上的优化（比如在数据操作过程中的数据复制和引用），Pandas 拥有了更好的管理和计算大数据的能力。


    Pandas 的底层基于 NumPy 搭建，因此 Pandas 拥有了 NumPy 的全部优点，比如 Pandas 定义的数据结构可以支持 NumPy 已经定义的计算，相当于拥有了
    MATLAB 的矩阵计算能力；NumPy 原生的 C 接口也为扩展 Pandas 的计算性能带来了很大的方便。


    对于金融用户来讲，Pandas 提供了一系列适用于金融数据的高性能时间序列与工具，例如 Panel、时间 Series 等。


    # 3. Matplotlib


    Matplotlib 是 Python 最著名的绘图库，提供了一整套和 MATLAB 相似的命令 API，十分适合进行交互式制图。我们也可以很方便地将它作为绘图控件，嵌入
    GUI 应用程序中。


    Matplotlib 的文档相当完备，而且在 Gallery 页面（http://matplotlib.org/gallery.html）中有上百幅缩略图，打开后都有源程序。因此，如果需要绘制某种类型的图，则只需在这'
  merge: -1
  img_proc: true
- pgno: 21
  md: '个页面中浏览、复制、粘贴，就基本可以搞定。


    # 4. Seaborn


    Seaborn 其实是在 Matplotlib 的基础上进行了更高级的 API 封装，从而使作图更容易，如图 1-1 所示。在大多数情况下使用 Seaborn
    就能制作出非常有吸引力的图，而使用 Matplotlib 就能制作出具有更多特色的图。笔者认为：应该把 Seaborn 视为 Matplotlib 的补充，而不是替代物。


    ![](img/0b89c6ed12810914fc2fb80a08af1fae_21_0.png)


    图 1-1'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'Seaborn 默认的浅灰色背景与白色网络线的灵感来源于 Matplotlib，却比 Matplotlib 的颜色更加柔和。我们发现，图对于传播信息很有用，几乎在所有情况下，人们喜欢图更甚于表。


    # 5. SciPy


    SciPy 包含致力于解决科学计算中常见问题的各个工具箱。它的不同子模块相当于不同的应用，例如插值、积分、优化、图像处理、特殊函数等。


    SciPy 可以与其他标准科学计算程序库进行比较，比如 GSL（GNU C 或 C++科学计算库）或者 MATLAB 工具箱。SciPy 是 Python
    中科学计算程序的核心包，用于有效地计算 NumPy 矩阵，让 NumPy 和 SciPy 协同工作。


    # 6. Scikit-Learn


    Scikit-Learn 是基于 Python 的机器学习模块，基于 BSD 开源许可证。Scikit-Learn 的基本功能主要被分为 6 部分：分类、回归、聚类、数据降维、模型选择和数据预处理，具体可以参考官方网站上的文档（http://scikit-learn.org/stable/）。


    对具体的机器学习问题的解决，通常可以分为三步：数据准备与预处理；模型选择与训练；模型验证与参数调优。Scikit-Learn 封装了这些步骤，使建模的过程更方便、简单和快捷。


    # 7. StatsModels


    StatsModels 是 Python 的统计建模和计量经济学工具包，包括一些描述统计、统计模型估计和推断，例如线性回归模型、广义线性回归模型、方差分析模型、时间序列模型、非参检验、优化、绘图功能等。


    # 8. Quartz


    Quartz 是优矿的在线回测模块库，提供了跨资产多账户交易的量化策略框架，可以对策略进行专业的历史回测，得到详细的策略表现评估结果。它包括：多因子选股策略、事件驱动策略、CTA
    策略、大宗商品期现预测策略、相对价值策略、宏观择时/对冲策略、分级基金轮动/套利策略、FOF 策略、期权波动率策略与资产配置和轮动策略等。最新版为 Quartz
    3，其特点如下。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   - 支持标准级的策略编写规范，删减了大量冗余的策略 API，让我们只需记忆少量的函数名，即可快速实现策略想法。

    - 扩充了策略交易资产范围，从原来只支持股票、基金这两种资产类型，扩充到支持股票、场内外基金、指数、期货这 4 种资产的全资产平台。也就是说，在一个策略中既可以交易股票，又可以交易基金，还可以交易期货，实现真正意义上的多空对冲策略。在不久的将来，还会支持期权、债券、港股等资产类型。

    - 体现了策略信号生成和交易执行相分离的思想，可以灵活地进行各种资产的数据分析和交易撮合。

    - 支持更多的策略特型，例如多因子裸多策略、市场中性策略、FOF 策略和 CTA 期现策略等。

    - 会得到更充分的研究和支持，新的示例会逐步扩充在优矿知识库中，辅助我们更好地进行量化研究。

    - 在性能方面进行了诸多优化，让我们可以用更快的运行速度进行策略研究。


    # 9. CAL


    在现阶段，中国市场缺乏为本土市场定制化的金融分析工具。中国的广大中小投资者在面对这个纷繁复杂的市场时往往束手无策：“这个债券定价合理吗？什么是隐含波动率？我的资产包要做优化，这个怎么处理？”这也是萦绕在所有投资者脑海中的问题。在过去，对这些问题的解决要通过购买昂贵的专业终端才能进行，是广大个人投资者可望而不可即的。


    在如上所述的大环境下，CAL 应运而生。CAL 依托优矿量化实验室在线平台，基于 C++开发高性能引擎，以 Python 作为接口语言向用户提供功能，它的宗旨是为广大投资者提供丰富、灵活的金融分析模块，降低投资者的分析平台搭建成本，帮助用户在金融大浪中顺利前行。可通过
    https://uqer.io/help/faqCAL/查看 CAL 具体的帮助文档。


    本书还会在第 3 章中更详细地介绍上述重要的库。'
