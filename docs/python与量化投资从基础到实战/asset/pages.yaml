  md: "# 2.2.3 数据类\n\nPython 的基本数据类型有 4 种：列表、元组、集合和字典。Python 中的各种库如 Pandas 也有自己的数据类型，但都是由最基本的列表、元组、字典等组合而成的。\n\
    \n# 1. 列表（List）\n\n在 Python 中没有数组的概念，与数组最接近的概念就是列表和元组。列表是用来存储一连串元素的容器，用[]来表示。比如，在一个班里有\
    \ 30 个学生，我们需要将这 30 个学生安排到一间教室里上课，如果把这 30 个学生分别比作元素，那么这个教室就是数组；这 30 个学生是按座位坐好且有序排列的，在数组中的元素也是有序排列的，示例如下：\n\
    \n```\nIn [11]: #列表\n    students=[\"小明\",\"小华\",\"小李\",\"小娟\",\"小云\",3]\n   \
    \ print students[len(students)-1]\n    print students[-1]\n    print students[2]\n\
    Out[11]: 3\n    3\n    小李\n```\n\n列表可以存放不同类型的数据，是最常用的 Python 数据类型。与字符串不同，列表元素支持改写，示例如下：\n\
    \n```\nIn [12]: #列表元素支持修改\n    students=[\"小明\",\"小华\",\"小李\",\"小娟\",\"小云\",3]\n\
    \    print students[3]\n    students[3]=\"小月\"\n    print students[3]\n    students[5]=\"\
    小楠\"\n    print students[5]\n    students[5]=19978\n    print students[5]\nOut[12]:\
    \ 小娟\n    小月\n    小楠\n    19978\n```"
