    # 图 6-11


    # 2. 跨期套利


    与跨品种套利不同，跨期套利是在同一市场、同一品种、不同的到期月份的合约之间进行套利，其中涉及非主力合约的问题。非主力合约的成交量比较小，有的甚至低到几十元数百手，很容易被几手交易量将价格拉至异常。这种异常实际上较难捕捉，只会放大回测结果。我们以沪镍为例，其主力合约主要在
    1、5、9 月交割，其余月份的成交量很低。而 1 月交割合约的活跃期为 7 月至 12 月，5 月交割合约的活跃期为 11 月至来年 4 月，所以在构建 1
    月交割合约和 5 月交割合约的套利组合时，我们选择 11、12 月作为套利策略实施的时间进行测试，在 12 月底如果有持仓，则强行平仓。在这个时间段内，1
    月交割合约为主力合约，5 月交割合约为次主力合约。


