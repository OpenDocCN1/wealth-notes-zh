    # 3. sys 模块


    Python 自带一些模块，我们把这些模块叫作标准库模块。标准库模块是指一类模块，而不是特指某一种模块。在标准库模块中也有非常多的模块，有的与电子邮件相关，有的与操作系统相关，有的与系统功能相关，等等。我们把在标准库中与系统功能有关的这些模块叫作
    sys 模块。下面通过实例来讲解 sys 模块的基本使用方法：


    ```

    In [97]: import sys

    In [98]: print sys.argv[0]

    D:/anaconda3/Scripts/ipython-script.py

    In [99]: sys.getdefaultencoding()

    Out[99]: ''utf-8''

    ```


    sys 模块的常见函数列表如表 2-3 所示。


    # 表 2-3


    | 函数 | 功能 |

    |---|---|

    | sys.argv | 实现从程序外部向程序传递参数 |

    | sys.exit([arg]) | 实现在程序的中间退出，arg=0 为正常退出 |

    | sys.getdefaultencoding() | 用于获取系统当前的编码，一般默认为 ascii |

    | sys.setdefaultencoding() | 设置系统默认的编码，在执行 dir（sys）时不会看到这个方法。在解释器中执行不通过时，可以先执行
    reload(sys)，再执行 setdefaultencoding(''utf-8)，将系统的默认编码设置为 utf-8 |

    | sys.getfilesystemencoding() | 用于获取文件系统使用的编码方式，在 Windows 下返回''mbcs''，在 Mac 下返回''utf-8''
    |

    | sys.path | 用于获取指定的模块搜索路径的字符串集合，可以将写好的模块放在所得到的某个路径下，这样就可以在程序中 import 时正确找到 |

    | sys.platform | 用于获取当前的操作系统平台 |

    | sys.stdin、sys.stdout、sys.stderr | stdin、stdout 及 stderr 变量包含与标准 I/O 流对应的流对象。如果需要更好地控制输出，而
    print 不能满足我们的要求，就可以使用这些变量 |'
