    # 6. 白噪声序列


    如果随机变量 X(t)（t=1、2、3……）是由一个不相关的随机变量的序列构成的，即对于所有 S 不等于 T，随机变量 X_t 和 X_s 的协方差为零，则称其为纯随机过程。


    对于一个纯随机过程来说，如果其期望和方差均为常数，则称之为白噪声过程。白噪声过程的样本实称被称为白噪声序列，简称白噪声。之所以称之为白噪声，是因为它和白光的特性类似，白光的光谱在各个频率上都有相同的强度，白噪声的谱密度在各个频率上的值相同。特别地，如果
    X_t 还服从均值为 0、方差为 σ² 的正态分布，则称这个序列为高斯白噪声。


    # 7. 线性时间序列


    时间序列 {r_t} 如果能被写成


    ```

    r_t = μ + Σ_{i=0}^{∞} ψ_i a_{t-i} （ μ 为 r_t 的均值， ψ_0 = 1, {a_t} 为白噪声序列 ）

    ```'
