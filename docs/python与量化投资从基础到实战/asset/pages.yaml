- pgno: 131
  md: "似的互斥子集，每个子集都尽可能保持数据分布的一致性，然后每次用 k-1 个子集的并集作为训练集，将余下的那个子集作为测试集，这样就可以获得 k 组训练（测试）集，从而进行\
    \ k 次训练和测试，最终返回 k 个测试结果的均值。\n\n下面通过调用 sklearn.tree 对训练集进行训练：\n\n```\nIn [168]:import\
    \ matplotlib.pyplot as plt\n    import numpy as np\n    import pandas as pd\n\
    \    import sklearn\n    import re\n    from sklearn import cross_validation\n\
    \    import sklearn.tree as tree\n    data=pd.read_excel('loan.xlsx')\n    target=data['Type']\n\
    \    data.drop('Type',axis='columns',inplace=True)\n    train_data,test_data,train_target,test_target=cross_validation.train_test_split(data,target,test_size=0.4,train_size=0.6,random_state=12345)\n\
    \    clf_1=tree.DecisionTreeClassifier(criterion='entropy')\n    clf_1.fit(train_data,train_target)\n\
    \    train_est=clf_1.predict(train_data)\n    train_est_p=clf_1.predict_proba(train_data)[:,1]\n\
    ```\n\n将模型应用于测试集：\n\n```\nIn [169]:test_est=clf_1.predict(test_data)\n```\n\n\
    在模型对新的示例进行判断后，我们希望在对模型进行评估时分支节点所包含的样本尽可能属于同一个类，即节点的纯度越高越好，一般用信息熵、增益率和基尼指数来代表纯度。\n\
    \n我们进行机器学习的目标是使机器学得的模型很好地适用于“新样本”，而不是仅仅在训练样本上工作得好。我们将模型适用于新样本的能力称为“泛化能力”。我们通常希望一个模型的训练误差及泛化误差都很低，其中，泛化误差低是我们首先要考虑的因素：\n\
    \n```\nIn [170]:from sklearn import metrics\n    print metrics.accuracy_score(test_target,\
    \ test_est)\nOut[170]:0.5\n```"
