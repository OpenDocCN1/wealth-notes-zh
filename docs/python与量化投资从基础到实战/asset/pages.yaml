    \n```\nr = w₁ r₁ + (1 - w₁) r₂\n\nσ² = w₁² σ₁² + (1 - w₁)² σ₂² + 2 w₁ (1 - w₁)\
    \ ρ σ₁ σ₂\n```\n\n很容易证明，当且仅当 $\\rho=1$ 时资产组合标准差与预期收益呈线性关系。由于 $\\rho$ 的取值范围为 $-1\\\
    sim1$，因此在通常情况下 $\\sigma^2 = w_1^2 \\sigma_1^2 + (1-w_1)^2 \\sigma_1^2 + 2w_1(1-w_1)\\\
    rho\\sigma_1\\sigma_2 < (w_1\\sigma_1 + (1-w_1)\\sigma_2)^2$，即组合标准差小于两种资产标准差的加权平均，收益-标准差点在两种资产收益-标准差点连线的左侧。甚至在大多数情况下，当开始把波动率更大的资产\
