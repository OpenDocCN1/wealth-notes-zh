    \n示例如下：\n\n```\ncontext.transfer_cash(origin, target, amount)\n```\n\n如下代码用于获取账户间的资金划转：\n\
    \n```\nstart = '2017-01-01'                      # 回测起始时间\nend = '2017-01-10'\
