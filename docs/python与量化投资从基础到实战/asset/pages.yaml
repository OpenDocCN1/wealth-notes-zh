- pgno: 316
  md: '# 6.7.6  DMI 指标


    # 1. 指标介绍


    动向指标（DMI）是由美国技术分析大师威尔斯·威尔德（Wells Wilder）设计的，用于衡量股票价格在涨跌过程中买卖双方的力量均衡点，从而对中长期股市趋势进行判断。相对于其他类似的指标，DMI
    指标可将每日的具体振幅考虑在内，而非简单地考量日间的累计波动，这种统计方式更精确地度量了多空双方的力量变化。


    # 2. 计算公式


    在计算 DMI 指标时，通常涉及 4 个中间指标的计算：+DI、-DI（多空指标）、ADX 和 ADXR（趋向指标），各指标的具体计算方式如下。


    首先，计算上升和下降动向：


    上升动向 +DM_t = t 日最高价 - (t-1) 日最高价


    下降动向 -DM_t = (t-1) 日最低价 - t 日最低价


    然后，计算真实波幅 TR：


    TR_t = max(|t 日最高 - t 日最低|, |t 日最高 - (t-1) 日收盘|, |t 日最低 - (t-1) 日收盘|)


    其次，综合 +DM、-DM、TR 来计算 DI：


    ±DI_t = Σ_{k=0}^{N-1} ±DM_{t-k} / Σ_{k=0}^{N-1} TR_{t-k} × 100


    最后，计算 ADX 与 ADXR：


    ADX_t = MA( ((+DI_t) - (-DI_t)) / ((+DI_t) + (-DI_t)) × 100, N )


    ADXR = (ADX_t + ADX_{t-1}) / 2


    # 3. 对指标的使用说明


    在对 DMI 指标进行分析时，其本身包含多条指标线，因此我们可以从多空及趋势这两个方面对市场进行研判。'
  merge: -1
  img_proc: true
- pgno: 317
  md: '（1）当+DI 位于-DI 之上时，行情以上涨为主，且当+DI 上穿-DI 时，为买进信号；当+DI 位于-DI 之下时，行情以下跌为主，且当+DI
    下穿-DI 时，为卖出信号。


    （2）当+DI 从 20 之下升到 50 之上时，有一定的上涨行情；当-DI 从 20 之下升到 50 之上时，有一定下跌行情；当±DI 以 20 为基准线上下波动时，行情以整理为主。


    （3）当 ADX 上穿 ADXR 为金叉触发点时，预示着上涨行情的开始；当 ADX 下穿 ADXR 为死叉触发点时，预示着上涨行情的结束。


    （4）当 ADX 与 ADXR 在 20 左右波动时，行情以整理为主；当 ADX 在 50 之上反转时，行情有很大可能开始反转；当 ADX 与 ADXR 上行至
    80 以上时，市场可能出现大行情。


    # 4. 指标回测


    下面构建基于 DMI 指标的简单策略，具体的策略要求如下。


    +   （1）如果 ADX 指标高于 50 且+DI>-DI，则买入；如果 ADX 指标低于 20 或+DI<-DI，则卖出。

    （2）等权买入符合条件的股票，如果可选的股票少于 10 只，则每只买入 0.1，在出现重复的信号时不重复买入。

    （3）如果股票数量高于可用资金，则随机买入其中一部分，保证资金用完。

    （4）回测时间为 2012 年 1 月 1 日至 2017 年 12 月 31 日，基准为 HS300，股票池为动态 HS300 成分股，每日调仓。


    策略代码如下：


    ```

    import numpy as np

    import pandas as pd


    start = ''20120101''

    end = ''20171231''

    benchmark = ''HS300''

    univers e = set_universe(''HS300'', start)  # 取 start 日的成分股防止 survival bias

    capital_base = 1000000

    freq = ''d''

    refresh_rate = 1

    ```'
