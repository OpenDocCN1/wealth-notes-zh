  md: '# 图 6-22


    ![](img/0b89c6ed12810914fc2fb80a08af1fae_305_0.png)


    # 6.7.3 CCI 指标


    # 1. 指标介绍


    CCI（顺势指标）由唐纳德·蓝伯特先生提出，通过引用价格与固定区间的股价平均区间的偏离程度的概念，来判断是否处于超买或者超卖状态。CCI 指标区别于大多超买超卖型指标的
    0～100 界限，波动于正无穷大和负无穷大之间，无须以 0 为中轴线，有利于投资者对行情进行研判，对于短期内的暴涨暴跌的非常态行情也同样适用。


    # 2. 计算公式


    在计算 CCI 指标时通常需要设置计算周期 n 和系数 c，一般取 n=20，c=0.015，数值的具体计算方式为：


    ```

    CCI_n = (Typical Price - SMA_n(TP)) / (c · δ_n(TP))

    ```


    其中 Typical Price = (最高价+最低价+收盘价)/3


    # 3. 指标使用说明


    在对 CCI 指标进行分析时，我们主要对非常态市场进行研判。


    （1）当 CCI 曲线向上突破+100 线进入非常态区间时，则表明股价进入强势区间，投资者应及时买入。在进入非常态区间后，如果继续一直朝上运行，则表明股价持续强势。'
  merge: -1
  img_proc: true
- pgno: 306
  md: '如果在远离 100 线的地方开始掉头，则表明强势状态已难以持续；同时，如果前期涨幅过高，则投资者应考虑逢高卖出。如果出现持续下跌状态，则表明强势趋势已经结束。


    （2）当 CCI 曲线向下突破-100 线进入非常态区间时，则表明股价进入弱势区间，投资者应考虑空仓并等待更高利润。如果在超卖区间运行一段时间后开始掉头，则表明底部已初步探明，投资者可适量建仓。当由下向上突破-100
    线进入常态区间时，则表明市场探底基本结束，可能进入盘整阶段，投资者可考虑逢低建仓。


    通过上面的分析我们可以看出，CCI 指标主要适用于股票市场的超买与超卖区间，在相对准确性方面，对于急涨急跌的行情更适合采用 CCI 指标。


    # 6.8.3.4 指标回测


    下面构建基于 CCI 指标的简单策略，具体的策略要求如下。


    +   （1）如果 CCI 指标低于-100，则买入；如果 CCI 指标高于+100，则卖出。\n（2）对每只股票买入 20000 元左右，出现重复信号时不重复买入。\n（3）如果股票数量高于可用资金，则随机买入其中一部分，保证资金用完。\n（4）回测时间为
    2016 年 1 月 1 日至 2017 年 12 月 31 日，基准为 HS300，股票池为动态 HS300 成分股，每日调仓。


    上面已经介绍了如何基于通联数据平台编写技术指标策略，这里将介绍另一种基于 Talib 的技术指标策略编写，并将之与通联数据平台进行比较。


