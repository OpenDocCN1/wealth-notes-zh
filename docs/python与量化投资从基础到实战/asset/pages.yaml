    \n```\nIn [92]: def test2(i,j):\n    k=i*j\n    return i,j,k\n    a,b,c = test2(4,5)\n\
    \    print a,b,c\nOut[92]: 4 5 20\n```\n\n# 2.5.5 文档字符串\n\n在 Python 中可以定义很多函数，但是对于开发人员来说，如果遇到太多的函数而并不很了解各个函数的作用，就会感到很混乱。这时如果想了解各个函数的作用，就得从头分析，很浪费时间。针对这个问题，我们提供了两种解决方式：第\
    \ 1 种是在开发时为每个函数写一个文档进行说明；第 2 种是在每个函数开头的地方加上一行说明性文字，我们将其称为文档字符串，这样，我们在编程时就可以很快明白这个函数的作用及对参数的设定"
