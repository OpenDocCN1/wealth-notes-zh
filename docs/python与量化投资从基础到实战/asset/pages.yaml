  md: "我们惊讶地发现，人工神经网络算法的分类准确率达到 100%，但这只是针对个别例子。人工神经网络具有分类准确率高、可进行并行处理和分布式存储及学习能力强等众多优点，同时能充分逼近复杂的非线性网络。但神经网络也有一定的缺点，例如学习时间过长、参数较多、输出结果难以解释等。\n\
    \n# 3.6.3 模型评价方法——metric 模块\n\n我们在对模型效果做评价时已经用到了 metrics 模块的 accuracy_score 和\
    \ confusion_matrix 方法，下面将详细介绍 metrics 模块的使用。\n\n分类任务模型常用的评价指标包括分类准确率分数、混淆矩阵、召回率、ROC\
    \ 曲线、AUC 值等。每个指标都有其含义，针对不同的问题，我们所关注的评价指标也有所不同。\n\n+   1. accuracy_score（分类准确率）\n\
    \n分类准确率分数指所有分类正确数目的百分比。\n\n使用方法如下：\n\n```\nmetrics.accuracy_score(y_true, y_pred,\
    \ normalize=True, sample_weight=None)\n```\n\n其中，y_true 为测试集的真实类别，y_pred 为测试集的预测类别。normalize\
    \ 的默认值为 True，返回正确分类的比例；如果为 False，则返回正确分类的样本数。\n\n示例如下：\n\n```\nIn [178]:import\
    \ numpy as np\n    from sklearn.metrics import accuracy_score\n    y_pred = [0,\
    \ 2, 1, 3]\n    y_true = [0, 1, 2, 3]\n    print(accuracy_score(y_true, y_pred))\n\
    \    print(accuracy_score(y_true, y_pred, normalize=False))\nOut[178]:\n    0.5\n\
    \    2\n```\n\n但是 accuracy 并不会告诉我们错误的类型，因此我们需要借助其他指标进行分析。"
