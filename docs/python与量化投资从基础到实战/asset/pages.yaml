  md: '通过对它们的价格序列进行卡方检验发现，p 值几乎为 0，可以认为这三者之间高度正相关。实际上螺纹和铁矿石的相关系数为 0.978，螺纹和焦炭的相关系数为
    0.964，铁矿石和焦炭的相关系数为 0.949。这就为在三者之间进行跨品种套利奠定了基础。


    钢材生产流程大致可分为三个阶段：炼铁、炼钢和轧钢，生产成本主要包括原料成本、能源成本、人工成本、折旧和财务成本等。从原材料来看，生产 1 吨螺纹钢大致需要
    1.6 吨铁矿石和 0.5 吨焦炭。因此，我们可以通过期货市场来大致模拟钢厂的生产过程，通过结合相关品种在期货市场的利润及现货市场供需基本面数据，把握品种间的套利机会。通过成本估算，当前阶段的螺纹钢成本≈1.6×铁矿石+0.5×焦炭+加工成本；利润≈螺纹钢期货价格-螺纹钢成本；炼铁、炼钢和轧钢三个阶段的总加工费大概在
    1100 元左右。


    如下所示是 2013 年 10 月至 2016 年 7 月虚拟钢厂的利润走势，在-200～300 的范围内波动，利润中枢在 100 左右：


