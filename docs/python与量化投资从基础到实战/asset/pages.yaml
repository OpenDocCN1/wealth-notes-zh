- pgno: 261
  md: '从价格走势图来看，利润走势不可能维持在高位或低位。这是因为，当利润达到极高值时，一方面钢厂会加速生产，供给增加则价格降低；另一方面铁矿石、焦炭等原材料的价格会上涨，从而压缩利润空间。当利润达到极低值时，一方面钢厂会因持续亏损而减产，产量减少将支撑价格；另一方面上游企业的议价能力更弱，原材料的价格承压走低，从而使利润逐渐回升。当盘面利润超过
    300 元时，可以做空利润，即卖螺纹，买铁矿石和焦炭，当盘面利润低于 200 元时，又可以做多利润，即买螺纹，卖铁矿石和焦炭。


    首先，从产业结构计算产出比，比如螺纹：铁矿：焦炭=1 吨：1.6 吨：0.5 吨；其次，依照合约规定的实际数量的 1:1 来确定，当前螺纹：铁矿：焦炭=1:10:10（螺纹期货合约为
    10 吨/手，铁矿和焦炭期货合约均为 100 吨/手）；最后，确定套利比例也需要考虑各品种的波动率的不同。综合上述因素，可大致确定螺纹、铁矿、焦炭三者的手数配比为
    20:3:1。初始资金设为 15 万元。


    然后，选取螺纹、铁矿和焦炭主力合约。


    策略逻辑如下。


    +   - 当盘面利润高于 300 元时，做空螺纹，做多铁矿石与焦炭；当盘面利润低于 100 元时，如果螺纹有空仓，则平掉所有仓位。


    +   - 当盘面利润低于-200 元时，做多螺纹，做空铁矿石与焦炭；当盘面利润高于 100 元时，如果螺纹有多仓，则平掉所有仓位。


    +   - 当主力切换时，平掉所有仓位。


    +   - 初始资金：30 万元。


    +   - 回测时间：自铁矿石品种上市以来。


