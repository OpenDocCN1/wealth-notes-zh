- pgno: 393
  md: '# 6.9.4 自回归滑动平均（ARMA）模型


    在某些应用中，我们需要高阶的 AR 或 MA 模型才能充分地描述数据的动态结构，这样问题会变得很烦琐。为了解决这个问题，自回归滑动平均（ARMA）模型应运而生，其基本思想是把
    AR 和 MA 模型结合在一起，使所使用的参数数量保持很少。


    模型的形式为


    $r_t = \phi_0 + \sum_{i=1}^{p} \phi_i r_{t-i} + a_t + \sum_{i=1}^{q} \theta_i
    a_{t-i}$


    其中，{$a_t$}为白噪声序列，$p$ 和 $q$ 都是非负整数。AR 和 MA 模型都是 ARMA($p,q$)的特殊形式。


    利用向后推移算子 $B$（即上一时刻），上述模型可写为


    $(1 - \phi_1 B - \cdots - \phi_p B^p) r_t = \phi_0 + (1 - \theta_1 B - \cdots
    - \theta_q B^q) a_t$


    这时求 $r_t$ 的期望，得到：


    $E(r_t) = \frac{\phi_0}{1 - \phi_1 - \cdots - \phi_p}$


    和上期我们的 AR 模型一模一样。因此有着相同的特征方程：


    $1 - \phi_1 x - \phi_2 x^2 - \cdots - \phi_p x^p = 0$


    该方程所有解的倒数被称为该模型的特征根，如果所有特征根的模都小于 1，则该 ARMA 模型是平稳的。


    有一点很关键：ARMA 模型的应用对象应该为平稳序列，我们下面的步骤都是建立在假设原序列平稳的条件下的。


    # 1. PACF、ACF 判断模型阶次


    我们通过观察 PACF 和 ACF 截尾，分别判断 $p$、$q$ 的值（限定滞后阶数 50）：


    ```

    In [22]: data = np.array(IndexData[''CHGPct''])  # 上证指数日涨跌


    fig = plt.figure(figsize=(20,10))

    ax1=fig.add_subplot(211)

    fig = sm.graphics.tsa.plot_acf(data,lags=30,ax=ax1)

    ```'
