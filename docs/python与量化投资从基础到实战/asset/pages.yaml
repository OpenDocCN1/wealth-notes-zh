    \ Python 异常。在 Python 中一切皆对象，异常也是 Python 的对象，表示一个错误。当 Python 脚本发生异常时，我们需要捕获并处理它，否则程序会终止执行。我们通常会把异常的类型和位置打印出来，以便程序员处理：\n\
    \n```\nIn [110]: print 字符串需要被引用\nOut[110]: File \"<ipython-input-3-79d7652315a8>\"\
