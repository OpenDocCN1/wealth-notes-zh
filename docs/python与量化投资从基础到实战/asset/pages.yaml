  md: "# 3.2.12 连续型变量分组\n\n有时我们把数值聚集在一起更有意义，例如，如果要为交通状况（路上的汽车数量）根据时间（分钟数据）建模，则具体的分钟可能不重要，而时段如上午、下午、傍晚、夜间、深夜能更好地表现预测结果，这样建模会更直观，也能避免过度拟合：\n\
    \n```\nIn [94]: cat=pd.cut(a.closePrice,bins)\n        bins=[4,9,10,20,30]\nIn\
    \ [95]: cat\nOut[95]:\n0      (9, 10]\n1     (20, 30]\n2     (20, 30]\n3     \
    \ (4, 9]\n4      (4, 9]\n5     (10, 20]\nName: closePrice, dtype: category\nCategories\
    \ (4, object): [(4, 9] < (9, 10] < (10, 20] < (20, 30]]\n```\n\n也可以对分组后的结果进行统计：\n\
    \n```\nIn [96]: pd.value_counts(cat)\nOut[96]:\n(20, 30]    2\n(4, 9]      2\n\
    (10, 20]    1\n(9, 10]     1\nName: closePrice, dtype: int64\n```\n\n也可以给定各个分组的标签并进行切分：\n\
    \n```\nIn [97]: group_names = ['low', 'Middle_1', 'Middle_2', 'high']\nIn [98]:\
    \ pd.cut(a.closePrice, bins, labels=group_names)\nOut[98]:\n0    Middle_1\n1 \
    \       high\n2        high\n3         low\n4         low\n5    Middle_2\nName:\
    \ closePrice, dtype: category\nCategories (4, object): [low < Middle_1 < Middle_2\
    \ < high]\n```"
  merge: -1
  img_proc: true
- pgno: 96
  md: "# 3.2.13 Pandas 分组技术\n\n在数据分析过程中，我们往往需要先将数据拆分，然后在其对应的每个分组中进行运算，比如，计算各行业内的股票数量、平均市值，或者从中挑选市盈率最低的股票等。Pandas\
    \ 中的 groupby 函数恰好为我们提供了一个高效的数据分组运算功能，让我们能以一种轻松、自然的方式对数据集进行切分及再聚合等操作，可将其称为“核心功能”。接下来看看\
    \ groupby 函数的具体操作流程。\n\n我们可将 groupby 函数的具体操作流程分解为以下三部分。\n\n+   (1) 拆分数据。\n\n+\
    \   (2) 应用函数。\n\n+   (3) 汇总计算结果。\n\n如果还是一头雾水的话，则不妨看看图 3-4，毕竟一图胜千言。\n\n![](img/0b89c6ed12810914fc2fb80a08af1fae_96_0.png)\n\
    \n图 3-4\n\n为了加深理解，我们将结合实例来讲解 groupby 函数的应用。\n\n首先，载入数据集，该数据集由基金前 10 大重仓股所对应的市值及行业组成：\n\
    \n```\nIn [99]:import pandas as pd\n    df = pd.read_csv('20170930.csv', dtype={'ticker':\
    \ str,\n'holdingTicker': str,}, encoding='GBK')\n    df=df[['ticker','holdingTicker','marketValue','industryName1']]\n\
    \    df.head()\n```"
  merge: -1
  img_proc: true
