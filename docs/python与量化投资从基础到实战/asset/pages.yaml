- pgno: 110
  md: "通过观察图 3-10 可以发现，样本分位数并不在一条直线上，这表明各股的对数收益率并不符合正态分布。在两侧分别有许多值远低于或远高于直线，这就是“肥尾效应”。\n\
    \n# 3.3.4 凸优化\n\n“凸优化”是一种比较特殊的优化，指求取最小值的目标函数为凸函数的一类优化问题。在各行各业中都充斥着凸优化问题，其中以金融领域尤为明显，比如，利用市场数据校准齐全定价模型、效用函数优化、投资组合优化等。为了更加切合本书的主题，本节直接运用投资组合优化作为例子进行展示。\n\
    \n马柯维茨投资组合理论是美国经济学家 Markowitz（1952）在其发表的论文《资产组合的选择》中提出的，它标志着现代投资组合理论研究的开始。Markowitz\
    \ 利用均值-方差模型分析得出通过投资组合可以有效降低风险的结论。这一理论的基本原理已经被写进诸多教材中，在此不作重复阐述，感兴趣的读者可以查阅相关资料。\n\
    \n首先，使用蒙特卡罗模拟生成一定数量的随机投资组合权重向量，并计算其相应的预期投资组合收益及方差：\n\n```\nIn [131]:number = 10000\
    \  #随机数维度\n    stock_num = len(log_returns.columns)\n    weights = npr.rand(number,\
    \ stock_num)\n    weights/= np.sum(weights, axis=1).reshape(number, 1)\n    prets\
    \ = np.dot(weights, log_returns.mean()) * 252  #计算年化收益率\n    pvols = np.diag(np.sqrt(np.dot(weights,\n\
    \                    np.dot(log_returns.cov() * 252, weights.T))))  #计算年化风险\n\
    ```\n\n接下来，对结果进行可视化，并将无风险短期利率定义为 0，以便计算夏普率。\n\n```\nIn [132]:plt.figure(figsize=(10,\
    \ 6))\n    plt.scatter(pvols, prets, c=prets / pvols, marker='o')\n    plt.grid(True)\n\
    \    plt.xlabel('预期波动率')\n    plt.ylabel('预期收益率')\n    plt.colorbar(label='夏普率')\n\
    ```\n\n效果如图 3-11 所示。"
