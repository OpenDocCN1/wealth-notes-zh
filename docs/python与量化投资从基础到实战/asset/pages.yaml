  md: '# 推荐序一


    很荣幸收到王小川博士的邀请，为其新书《Python 与量化投资：从基础到实战》作序。王小川博士是华创证券研究所非常出色的分析师，在日常工作中非常乐于分享他的开发经验和心得。在本书出版之前，他已经出版了两本关于
    MATLAB 的畅销书，我相信这一本介绍使用 Python 进行量化投资的新书，会推动相关领域的发展。


    在过去的几年中，在很多领域内基于创新类算法的应用场景和相关产品不断涌现，IT 的推动作用已经从自动化延展到了智能化。在开源的大氛围下，算法的更新迭代速度不断加快，并在各个领域渗透和融合，专业化程度越来越高。


    在金融领域的量化投资、智能投顾、信用评级、新闻监控、舆情分析等多个方向上，目前已经大量使用了相关技术和算法，并且融合的程度在不断加深。与其他领域相比，金融领域的算法应用有其自身的特点：一是信息的来源多、部分数据非结构化；二是在不同的应用场景甚至策略之间，所适用算法的差异较大，例如投资交易的量化策略、智能投顾中的用户画像、新闻处理中的自然语言处理和大数据，都涉及了不同大类的算法；三是投资中各个影响因素之间的逻辑关系复杂化和模糊化；此外，很多金融问题不是单目标优化的，也不是封闭的信息集。


    展望未来，在金融科技的落地方向上，量化投资、大数据的 Quantamental、精准画像、自然语言处理等依然会是焦点，势必吸引越来越多的关注及资源。量化投资和
    Python 这两个词是当下的焦点，王小川博士平时的 工作正是其交汇点。正如书名《Python 与量化投资：从基础到实战》所表达的，本书包含了王小川博士在工作中的宝贵经验；在案例中描述的示例，正是本研究所金融工程的很多重要研究方向，例如常用的行业轮动、市场中性策略、多因子策略、CTA
    策略、期权策略、时间序列等。所以，本书对于了解量化开发的运用现状及掌握必备的开发能力而言，是非常有益的。


    考虑到众多读者可能没有 Python 基础，本书从零开始介绍 Python 语言，并且由浅入'
