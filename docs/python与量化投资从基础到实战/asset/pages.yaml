- pgno: 188
  md: '（3）time_range：指所需回溯的历史 K 线图条数，和 freq 属性相对应。


    （4）freq：指 K 线图周期，支持''1d''、''1m''、''5m''、''15m''、''30m''、''60m''等周期。''1d''表示日线，''1m''表示一分钟线。分钟
    K 线图仅可在分钟频率回测时使用。


    （5）style：指数据返回的类型，可以选择''ast''、''sat''或者''tas''这三种类型，其中''a''表示''attribute''，''s''表示
    symbol，''t''表示时间，三种选择分别对应这三个维度呈现的顺序，例如''ast''表示在返回的字典中的键是 attribute，其值为列为 symbol、行为
    time 的 DataFrame，依此类推。


    （6）rtype：指返回值的数据类型。可以选择''frame''、''array''这两种类型。


    由上述可知，通过 context.history(universe,''closePrice'', 60)，我们获取了各只股票在历史上 60 个交易日前复权收盘价，格式是一个字典，键为股票代码，值是一个索引为时间、列为前复权收盘价的
    DataFrame。


    接下来我们把一个字典初始化，然后对每只股票进行循环，用最近的前复权价格除以 60 个交易日之前的前复权价格，得到累积净值。然后对股票按累计净值进行排序，选取前
    60 只股票作为待买股票池。


    接下来，我们就要进行股票的下单买卖了。这里出现了 account 的方法 get_positions()，用于获取策略当前的所有持仓，具体返回的是一个字典，键为股票代码，值为持仓股票数量。我们对我们持仓的股票进行遍历，若它不在我们的待买股票池里，就做一个
    order_to(stk,0)操作，意思是将该股票清仓。


    除了 order_to 方法，还有其他下单方法，下面一一进行解释。


    +   1. order(symbol, amount, price=0., otype=''market'')


    指根据指定的参数，进行订单委托。订单类型支持市价单或限价单，在限价单中需将 otype 设置为"limit"，并设置下单价格。


    对其参数说明如下。


    +   ○ 为 symbol 时，指需要交易的证券代码，必须包含后缀，其中上证证券为.XSHG，深证证券为.XSHE。


    +   ○ 为 amount 时，指需要交易的证券代码为 symbol 的证券数量，为正则买入，为负则卖出；程序会自动对 amount 向下取整到最近的整百。'
  merge: -1
  img_proc: true
- pgno: 189
  md: '+   ◎ 为 price 时，指下限价单时的下单价格（仅日内策略可用）。

    ◎ 为 otype 时，指可选''market''（市价单）和''limit''（限价单）这两个值，表示交易指令类型（为 limit 时仅日内策略可用）。


    # 2. order_to (symbol, amount, price=0., otype=''market'')


    指通过下单，将某只股票的持仓调整到持有多少手。策略框架会自动计算当前持仓和目标持仓的差额，并进行下单。在每次 handle_data 时调用，最多只允许一次
    order_to 函数调用，否则可能造成下单量计算错误。


    对其参数说明如下。


    +   ◎ 为 symbol 时，指需要交易的证券代码，必须包含后缀，其中上证证券为.XSHG，深证证券为.XSHE。

    ◎ 为 amount 时，指需要交易的证券代码为 symbol 的证券数量，为正则买入，为负则卖出。程序会自动对 amount 向下取整到最近的整百。

    ◎ 为 price 时，指下限价单时的下单价格（仅日内策略可用）。

    ◎ 为 otype 时，指可选''market''（市价单）和''limit''（限价单）这两个值，表示交易指令类型（为 limit 时仅日内策略可用）。


    # 3. order_pct (symbol, pct)


    指根据当前的账户权益按一定比例下单。比如当前账户有 100 000 元，下单 20%，就会使用 20000 元计算最大可委托手数并下单。


    对其参数说明如下。


    +   ◎ 为 symbol 时，指需要交易的证券代码，必须包含后缀，其中上证证券为.XSHG，深证证券为.XSHE。

    ◎ 为 pct 时，指需要交易的证券代码为 symbol 的证券占虚拟账户当前总价值的百分比，范围为 0~1，为正则买入，为负则卖出。程序会自动对计算出的下单数量向下取整到最近的整百。'
