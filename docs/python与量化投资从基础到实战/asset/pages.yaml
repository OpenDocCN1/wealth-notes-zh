    \ Python 打印字符串时需要引用内容，所以会报错，解决方法为在输出内容前加 “”，代码如下：\n\n```\nIn [111]: print \"字符串需要被引用\"\
    \nOut[111]: 字符串需要被引用\n```\n\n假如我们在编程时知道某些语句可能会导致某种错误的发生，如果不想在异常发生时结束程序，则只需在 try\
