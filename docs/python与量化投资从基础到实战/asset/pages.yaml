    \ = Slippage(value=0, unit='perValue') #设置价格滑点百分比\n\naccounts = {\n    'fantasy_account':\
    \ AccountConfig(account_type='futures', capital_base=capital_base, commission=commission,\
    \ slippage=slippage)\n} #设置虚拟期货账户\n\ndef initialize(context):    # 初始化虚拟期货账户,\
    \ 一般用于设置参数, 回测前的事务等.\n    pass\n\ndef handle_data(context):   # 回测循环处理, 每个周期都会运行一次,\
    \ 可在此函数内实现信号产生, 生成回报指令.\n    futures_account = context.get_account('fantasy_account')\n\
    \    symbol = context.get_symbol(universe[0])\n    if context.current_minute ==\
    \ '09:30':\n        futures_account.order(symbol, 1, 'open')\n    # 平仓\n    elif\
    \ context.current_minute == '09:36':\n        long_position = futures_account.get_positions().get(symbol,\
