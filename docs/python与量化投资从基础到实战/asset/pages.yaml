  md: "我们根据真实类别和测试集预测类别的组合划分出真正例、假正例、真反例、假反例这四种情形，分别用 TP、FP、TN、FN 来表示。若已知 TP+FP+TN+FN=样例总数，则可画出学习结果的混淆矩阵，如表\
    \ 3-7 所示。\n\n# 表 3-7\n\n| 真实情况 | 预测结果 | \n| --- | 正 例 | 反 例 |\n| 正例 | TP（真正例）\
    \ | FN（假反例） |\n| 反例 | FP（假正例） | TN（真反例） |\n\n可以通过下面的代码查看混淆矩阵：\n\n```\nIn [171]:print\
    \ metrics.confusion_matrix(test_target, test_est)\nOut[5]:\n    [[2 3]\n     [0\
    \ 1]]\n```\n\n我们关心的两个指标为查全率与查准率，其中，查准率的计算方式如下：\n\nP=TP/(TP+FP)\n\n查全率的计算公式如下：\n\
    \nR=TP/(TP+FN)\n\n在本例中，查准率为 100%，查全率为 40%。\n\n# 2. 支持向量机\n\n支持向量机（Support Vector\
    \ Machine，SVM）是一个二类分类器，其中，Vector 作为点，是数据；Machine 是分类器。作为一种前馈神经网络类型，SVM 是近几十年来在机器学习中表现较好的算法。\n\
    \n给定一个训练样本，SVM 会建立一个超平面作为决策面，将正反例样本区分开，并使得隔离边界最大化。下面我们通过一个实例来了解 SVM 的原理。\n\n假设桌上有红、蓝两色球，我们寻找一条曲线将其分开，如图\
    \ 3-26 中的黑色曲线所示。"
