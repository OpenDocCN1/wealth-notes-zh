- pgno: 353
  md: '# Python 与量化投资：从基础到实战


    0×μ₁ + 1×μ₂ + 0×μ₃ + ⋯ + 0×μ_N = 5%


    用 P 来表示该观点线性方程组的系数矩阵时，观点方程组可表示为：P_μ = q。由于投资人的观点也存在不确定性，因此在 q 的基础上还可以加上一个随机误差项：P_μ
    = q + ε，其中 ε∼N(0, Ω)，因而 P_μ∼N(q, Ω)。这里，P 被称为 Pick Matrix，为 K×N 矩阵，表示对于 N 种资产的
    K 个观点；q 为 K×1 看法向量；Ω为看法向量误差项的 K×K 协方差矩阵，表示投资者的观点的不确定程度。我们通常对于 Ω采用 Ω=diag(τPΣP^T)的方式构造。


    前面我们讨论过市场的看法：μ∼N(Π, τΣ)，用 P 调整后的市场看法可表示为：P_μ∼N(PΠ, τPΣP^T)。


    投资人观点和市场看法的差距服从分布：N(q−PΠ, Ω+τPΣP^T)


    然后根据贝叶斯法则，结合先验信息和投资者观点，可以计算调整后的预期收益率和收益率方差分别为：


    Π̃ = Π + τΣP^T (Ω + τPΣP^T)^{-1} (q − PΠ)

    M = τΣ − τΣP^T (Ω + τPΣP^T)^{-1} PτΣ

    Σ_P = Σ + M


    其中，Π为先验的期望收益，通过历史平均年化收益得到；Π̃为个人观点调整后的期望收益；Σ为资产收益率之间的协方差矩阵；M为后验分布预期收益率的方差；Σ_P为调整后预期收益率方差；τ为均衡收益方差的刻度值，体现了对个人观点在总体估计中的权重，通常取值为
    0.025∼0.05；P、q、Ω为观点矩阵。


    在得到调整后的期望收益率和方差后，就可以根据马科维茨均值方差模型计算最优权重。

    ω̂ = (δΣ_P)^{-1} Π̃ （无卖空约束情况，其中δ为风险厌恶系数）


    # 3. Black-Litterman 模型应用


    在实践中应用该模型，简要来说主要有如下步骤。


    +   （1）计算得到先验的期望收益。


    +   （2）个人观点模型化，观点可以涉及单个资产，也可以有多个资产，最后按照一定的规则将所有观点构建成矩阵 P、Q 和 Ω。'
