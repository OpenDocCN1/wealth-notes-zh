- pgno: 46
  md: "```\nOut[43]: badminton\n```\n\n# 2.4.2 Python 的三种控制流\n\n与许多编程语言相同，在 Python\
    \ 中程序通常是由上向下执行的，而有时我们为了改变程序的执行顺序，会使用控制流语句控制程序的执行方式。\n\n在 Python 中有三种控制流类型：第 1\
    \ 种是顺序结构，指按顺序执行的结构；第 2 种是分支结构，指选择执行的结构，常用的语句为 if；第 3 种是循环结构，指循环多次执行的结构，常用的语句为\
    \ for、while。下面分别通过代码实例认识这三种结构。\n\n顺序结构的代码实例如下：\n\n```\nIn [44]: a=1\n    print\
    \ a\n    a=a-1\n    print a\n    a=a+2\n    print a\nOut[44]:\n    1\n    0\n\
    \    2\n```\n\n分支结构的代码实例如下：\n\n```\nIn [45]: a=0\n    if a==1:\n        print\
    \ \"She\"\n    else:\n        print \"He\"\nOut[45]: He\n```\n\n循环结构 for 的代码实例如下：\n\
    \n```\nIn [46]: for i in range(5):\n        print \"hello.world\"\n        print\
    \ i\nOut[46]:\n    hello world\n    0\n```"
