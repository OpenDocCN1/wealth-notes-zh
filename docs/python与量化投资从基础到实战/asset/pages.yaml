- pgno: 367
  md: "# Python 与量化投资：从基础到实战\n\n起到很好的分散效果。例如，传统资产配置往往采取 60/40 策略，即 60%投资于股票，40%投资于债券，假设股票风险为\
    \ 4.5%，债券风险为 1.62%，两者协方差为 0.021%，则组合风险为 2.95%，可计算得到股票对组合的风险贡献为 89.34%，股票风险贡献权重接近\
    \ 90%，在组合中股票风险占显著主导地位，组合风险并没有得到有效分散。\n\n基于此，PanAgora 基金的首席投资官 Edward Qian 博士提出了著名的风险评价（Risk\
    \ Parity）策略，被 Bridgewater（桥水联合基金）运用于实际投资中。该策略提倡配置风险，而不是配置资产。传统的资产配置方法控制的是绝对风险，也就是整个投资组合的波动性。而风险平价控制的是相对风险，让各资产类别的风险处于相对平衡的水平。由于组合的风险达到了平衡，所以理论上可以抵御各种风险事件，也就是所谓的“全天气”（All\
    \ Weather）策略。\n\n用 σ 表示投资组合的波动率，w_i 为资产 i 的权重，Ω 为投资组合收益率的协方差矩阵，(Ωw)_i 为向量 Ωw 的第\
    \ i 行元素，则资产 i 对组合的风险贡献可以用 w_i(Ωw)_i 来表示。要保证每个资产对组合的风险贡献一致，则可以用如下公式优化问题：\n\nmin\
    \ f(w) = Σ_{i=1}^{N} Σ_{j=1}^{N} [w_i(Ωw)_i - w_j(Ωw)_j]^2\ns.t.  w^T 1 = 1\n\
    w_i ≥ 0\n\n在下面的例子中，我们利用沪深 300、中小板、恒生指数、标普 500 及上证国债构造风险平价组合：\n\n```\nimport pandas\
    \ as pd\nimport numpy as np\nfrom datetime import datetime as dt\nimport matplotlib.pyplot\
    \ as plt\nfrom CAL.PyCAL import font\nfrom scipy.optimize import minimize\nimport\
    \ seaborn as sns\nsns.set_style('whitegrid')\n```\n\n```\ndef get_smart_weight(cov_mat,\
    \ method='min variance', wts_adjusted=False):\n    '''\n    功能: 输入协方差矩阵，得到不同优化方法下的权重配置\n\
    \    输入:\n        cov_mat  pd.DataFrame,协方差矩阵, index 和 column 均为资产名称\n```"
