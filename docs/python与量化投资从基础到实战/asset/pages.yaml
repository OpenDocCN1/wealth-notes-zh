    # 6.1 量化投资概述


    # 6.1.1 量化投资简介


    量化投资是借助量化金融分析方法进行资产管理的一种投资方法，而量化金融分析方法是一种结合了金融数据、个人经验、数学模型及计算机技术的复杂金融建模及分析方法，其中的每个方面都有自己的细分领域，如下所述。


    +   ○ 金融数据：行情数据、高频数据、因子数据、新闻数据、地理信息数据、社交数据。

