  md: "# 3.2.6 DataFrame 按多列排序\n\n可以使用 list 给出需要排序的列，同时给出是升序还是降序：\n\n```\nIn [73]:\
    \ import pandas as pd\n    data = pd.DataFrame({'group': ['a','a','a','b','b','b','c','c','c'],\
    \ 'ounces': [4, 3, 12, 6, 7.5, 8, 3, 5, 6]})\n    data.sort_values(by=['group','ounces'],\
    \ ascending=[False, True], inplace=True)\nIn [74]: data\nOut[74]:\n     group\
    \ ounces\n6    c      3.0\n7    c      5.0\n8    c      6.0\n3    b      6.0\n\
    4    b      7.5\n5    b      8.0\n1    a      3.0\n0    a      4.0\n2    a   \
    \   12.0\n```\n\n上述代码的作用就是先按照 group 降序排列，当 group 相同时再按照 ounces 升序排列。参数中的 inplace=True\
    \ 直接将排序后的结果存在 data，即直接用排序好的数据覆盖原始数据。\n\n# 3.2.7 DataFrame 去重\n\n在大多数时候，在数据中会有重复的数据，在做分析前需要进行去重：\n\
    \n```\nIn [75]: data = pd.DataFrame({'k1': ['one'] * 3 + ['two'] * 4, 'k2': [3,2,1,3,3,4,4]})\n\
    In [76]: data\nOut[76]:\n    k1  k2\n0  one  3\n1  one  2\n2  one  1\n3  two \
    \ 3\n4  two  3\n5  two  4\n6  two  4\n```"
