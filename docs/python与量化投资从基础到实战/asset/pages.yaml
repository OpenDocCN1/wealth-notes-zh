    # 5.6 策略交易细节


    # 1. 回测交易撮合机制和订单委托


    在回测时，订单撮合过程发生在运行 handle_data 函数结束之后，是以历史实时行情进行的虚拟撮合。由于是对真实场景的模拟，所以订单并不会立刻以某个价格成交，而是通过和实时行情的具体价格和具体成交量进行比对，来断定成交价格和成交时间。


    由于订单撮合是以一篮子订单形式处理的，所以在处理订单时会有细微的调整。具体的交易细节和订单撮合机制如下所述。


    1）日线级别策略回测


    撮合机制遵循“先卖后买，开盘价撮合”原则，即先处理卖出订单，后处理买入订单。卖出订单产生的现金会参与买入订单的交易。由于下单是在当天开盘前进行的，所以订单撮合会与当天的开盘价进行比较，如果满足条件，就会撮合成交；如果不满足条件，则继续挂单，等待下一次撮合尝试。


    2）分钟线级别策略回测


    撮合机制遵循“先下单先处理，开盘价撮合”原则，即对先下单的订单先进行撮合尝试。订单撮合会与下一分钟K线的开盘价进行比较，如果满足条件，就会撮合成交；否则继续挂单，等待下一次撮合尝试。


    对于不同的订单类型，成交条件如下。


    （1）市价单。会以下一根K线的开盘价（openPrice）撮合成交，成交量不超过下一根K线的总成交量，如果超过，则剩余订单申报量等待下一次撮合成交。


    （2）限价单。会以下一根K线的开盘价（openPrice）判断是否成交，如果买单申报价小于 openPrice 或卖单申报价大于 openPrice，则不成交，等待下一次撮合成交。成交量不超过下一根K线的总成交量，如果超过，则剩余订单申报量等待下一次撮合成交。'
