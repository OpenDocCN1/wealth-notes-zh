  md: '也就是说，(r₁, r₂,......rₖ)的联合分布在时间的平移变换下保持不变，是个很强的条件，难以用经验方法验证。因此我们经常假定的是平稳性的一个较弱的方式。


    （2）弱平稳：如果时间序列{rₜ}满足“E(rₜ)=μ, μ.是常数 Cov(rₜ, rₜ₋ₗ)=γₗ, γₗ 且只依赖于 l”的条件，则时间序列{rₜ}为弱平稳的。即该序列的均值
    rₜ 与 rₜ₋ₗ 的协方差不随时间而改变，l 为任意整数。


    在金融数据中，通常我们所说的平稳序列是指弱平稳的序列。


    # 1. 时序中的大数定理 LLN


    可能有读者会问为何要“强行”引入弱稳定性的概念，其实时间序列的弱平稳和协方差的绝对可加性，都是为了保证大数定理在时间序列上成立，这是所有统计分析的基础。


    # 2. 差分


    差分（这里为前向）就是求时间序列{rₜ}在 t 时刻的值，不妨将 rₜ 与 t-1 时刻的值 rₜ₋₁ 的差记作 d t，则会得到一个新序列{d t}，为一阶差分，对新序列{d
    t}再进行同样的操作，则为二阶差分。


    非平稳序列通常可以经过 d 次差分，处理成弱平稳或者近似弱平稳的时间序列，我们发现二阶差分得到的序列比一阶差分效果更好。


    # 3. 相关系数


    对于两个向量，我们希望定义它们是不是相关，一个很自然的想法是将向量与向量的夹角作为距离的定义，夹角小则距离小，夹角大则距离大。


    在学中学数学时，我们就经常使用余弦公式来计算角度：


    cos < a⃗, b⃗ > = (a⃗·b⃗) / (|a⃗|·|b⃗|)


    而将 a⃗·b⃗ 叫作内积，例如


    (x₁, y₁)·(x₂, y₂) = x₁x₂ + y₁y₂


    我们再来看看相关系数的定义公式。X 和 Y 的相关系数为：'
