    \n```\n$$\\rho_{xy}=\\frac{\\sum_{t=1}^{T}(x_t-\\bar{x})(y_t-\\bar{y})}{\\sqrt{\\\
    sum_{t=1}^{T}(x_t-\\bar{x})^2\\sum_{t=1}^{T}(y_t-\\bar{y})^2}}=\\frac{\\overline{(X-\\\
    bar{x})}\\cdot\\overline{(Y-\\bar{y})}}{|\\overline{(X-\\bar{x})}|\\cdot|\\overline{(Y-\\\
    bar{y})}|}$$\n```\n\n我们发现，相关系数实际上就是计算了向量空间中两个向量的夹角，协方差是去均值后两个向量的内积。\n\n如果两个向量平行，则相关系数等于\
    \ 1 或者 -1，同向的时候是 1，反向的时候就是 -1。如果两个向量垂直，则夹角的余弦等于 0，说明二者不相关。两个向量的夹角越小，相关系数的绝对值越接近\
    \ 1，相关性越高。只不过这里在计算时对向量做了去均值处理，即中心化操作，而不是直接用向量 X、Y 进行计算。\n\n减去均值的操作并不影响角度计算，是一种“平移”的效果，如下所示：\n\
