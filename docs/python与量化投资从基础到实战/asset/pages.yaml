  md: "少恢复到这一水平。\n\n+   历史滞后均值法：通过历史的价差选择时间窗口长度，得到均衡价差。优点为容易计算，价差是动态的；缺点为不能保证样本外价差恢复到这一水平。\n\
    \n我们以选定套利组合的开盘价差为对象，使用历史滞后均值法，取 N 日价差均值为中线，取中线加上 N 日价差的 M 倍均值为上轨，取中线减去 N 日价差的\
    \ M 倍均值为下轨来构造布林带通道，当价差突破上轨时，做空价差。我们选择 1、5、9 这三个月份交割合约，滚动地进行测试，其中 1 月至 5 月合约测试的时间为\
    \ 11 月和 12 月，5 月至 9 月合约测试的时间为 3 月和 4 月，9 月至来年 1 月合约测试的时间为 7 月和 8 月，所以全年有半年不进行操作。\n\
