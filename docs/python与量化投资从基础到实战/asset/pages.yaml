- pgno: 111
  md: "![](img/0b89c6ed12810914fc2fb80a08af1fae_111_0.png)\n\n# 图 3-11\n\n投资组合的优化关键在于对组合中各标的权重的优化，优化目标大致有以下三类。\n\
    \n+   （1）夏普最大化。\n（2）收益最大化。\n（3）风险最小化。\n\n最优化投资组合的推导是一个约束最优化问题。我们可以使用 scipy.optimize\
    \ 子库中的 minimize 函数求解这一问题。\n\n首先，导入该模块：\n\n```\nIn [133]:import scipy.optimize\
    \ as sco\n```\n\n然后，建立一个函数将收益率、波动率、夏普率封装起来：\n\n```\nIn [134]:def statistics(weights):\n\
    \    weights = np.array(weights)\n    pret = np.sum(log_returns.mean() * weights\
    \ * 252)\n    pvols = np.sqrt(np.dot(weights.T, np.dot(log_returns.cov() * 252,\
    \ weights)))\n    return np.array([pret, pvols, pret / pvols])\n```\n\n接着，建立一个目标函数："
  merge: -1
  img_proc: true
- pgno: 112
  md: "```\nIn [135]:def min_sharpe(weights):\n    return -statistics(weights)[2]\n\
    ```\n\n并将所有参数（权重）的总和约束为 1，将参数的权重限制在 0～1：\n\n```\nIn [136]:cons = ({'type': 'eq',\
    \ 'fun': lambda x: np.sum(x) - 1})\n    bnds = tuple((0, 1) for x in range(stock_num))\n\
    ```\n\n最后，调用 minimize 函数进行最优化求解：\n\n```\nIn [137]:opts = sco.minimize(min_sharpe,\
    \ stock_num * [1 / stock_num],\n    method='SLSQP', bounds=bnds, constraints=cons)\n\
    \    opts['x'].round(3)\nOut[137]:array([ 0. ,  0. ,  0.521,  0.227,  0. ,  0.251])\n\
    ```\n\n可以发现，在夏普率最大的投资组合中仅包括格力电器、华东医药及宇通客车。\n\n此时该组合的统计数字为：\n\n```\nIn [138]:statistics(opts['x'].round(3))\n\
    Out[138]:array([ 0.16181374,  0.23682582,  0.68326054])\n```\n\n即预期收益率为 16.2%，预期波动率为\
    \ 23.7%，最优夏普率为 0.68。以此类推，我们还可以得到风险（波动率）最小化投资组合：\n\n```\nIn [139]:def min_volatility(weights):\n\
    \    return statistics(weights)[1]\n```\n\n```\nIn [140]:opts1 = sco.minimize(min_volatility,\
    \ stock_num * [1 / stock_num],\n    method='SLSQP', bounds=bnds, constraints=cons)\n\
    \    opts1['x'].round(3)\nOut[140]:array([ 0.109,  0.199,  0.171,  0.255,  0.044,\
    \  0.221])\nIn [141]:statistics(opts1['x'].round(3))\nOut[141]:array([ 0.10758601,\
    \  0.21346307,  0.50400293])\n```\n\n还可以得到收益最大化组合：\n\n```\nIn [142]:def min_return(weights):\n\
    \    return -statistics(weights)[0]\n```\n\n```\nIn [143]:opts2 = sco.minimize(min_return,\
    \ stock_num * [1 / stock_num],\n    method='SLSQP', bounds=bnds, constraints=cons)\n\
    \    opts2['x'].round(3)\nOut[143]:array([ 0.,  0.,  1.,  0.,  0.,  0.])\nIn [144]:statistics(opts2['x'].round(3))\n\
    Out[144]:array([ 0.18677101,  0.31284775,  0.59700289])\n```"
