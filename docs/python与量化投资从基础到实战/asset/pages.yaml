- pgno: 310
  md: '# 6.7.4 CMO 指标


    # 1. 指标介绍


    钱德动量摆动指标（CMO）由图莎尔·钱德（Tushar S.Chande）提出，利用上涨日和下跌日数据寻找极度超买和极度超卖的条件。作为动量指标，CMO 指标用来衡量证券趋势强度，以±50
    为区间界限来衡量市场状态。


    # 2. 计算公式


    计算 CMO 指标通常需要设置计算周期 n，一般取 n=20，数值的具体计算方式为


    CMO_n = (∑_{i=1}^n up_i - ∑_{i=1}^n dn_i) / (∑_{i=1}^n up_i + ∑_{i=1}^n dn_i)
    × 100


    其中，计算周期内每一天的收盘价减去前收盘价的结果，如果结果为正，则将其赋给 up_i （dn_i 为 0）；如果结果为负，则将其绝对值赋给 dn_i （up_i
    为 0）。


    # 3. 指标使用说明


    在对 CMO 指标进行分析时，其波动范围是-100～+100，因此我们通常有具体的定量规则对市场进行研判。


    （1）CMO 指标的绝对值越高，趋势越强。趋近于 0 则表示标的证券趋向于在早水平方向波动。


    （2）一般认为在 CMO 指标的值低于-50 时处于超卖状态，在高于+50 时处于超买状态，且两者的动量值为 3 倍之差。


    # 6.8.4.4 指标回测


    下面构建基于 CMO 指标的简单策略，具体策略要求如下。


    （1）如果 CMO 指标低于-50，则买入；如果 CMO 指标高于+50，则卖出。


    （2）等权买入符合条件的股票，如果可选的股票少于 10 只，则每只买入 0.1，在出现重复的信号时不重复买入。'
  merge: -1
  img_proc: true
