- pgno: 56
  md: "# 2.5 Python 函数\n\n# 2.5.1 认识函数\n\n函数的英文是 function，所以通俗地来讲，函数就是功能的意思。函数是用来封装特定功能的，比如，在\
    \ Python 里，len()是一个函数，其实现的功能是返回一个字符串的长度，所以 len()函数的特定功能是返回长度；又如，我们可以自己定义一个函数，然后编写这个函数的功能，之后在要使用时再调用这个函数。所以，我们可以将函数分为两种类型，一种是系统自带的不用我们编写其功能的函数，比如\
    \ len()函数；另一种是我们自定义的需要我们编写其功能的函数，这种函数的自由度高，叫作自定义函数，需要在使用时直接调用该函数。\n\n# 1. Python\
    \ 中的函数的功能\n\n在 Python 中有很多内建函数，当然，随着学习的深入，我们也可以创建对自己有用的函数。为了更清楚地理解函数的功能，这里先给出几个示例。\n\
    \n示例一，实现取字符串长度的功能：\n\n```\nIn [65]: a=\"ace\"\n    print len(a)\nOut[65]: 3\n\
    ```\n\n示例二，实现字符串的切割：\n\n```\nIn [66]: a=\"student,my xxxx\"\n    b=a.split('t')\n\
    \    print b\nOut[66]: ['s', 'uden', ',my xxxx']\n```\n\n示例三，进行字符串的大写转化：\n\n```\n\
    In [67]: a.upper()\nOut[67]: 'STUDENT,MY XXXX'\n```"
  merge: -1
  img_proc: true
- pgno: 57
  md: "# 2. 在 Python 中定义函数\n\n要想在 Python 中使用自定义函数，就得先定义一个函数。对一个函数的定义包括两部分，一部分是声明这个指定的部分是函数，而不是其他对象；一部分是定义这个函数所包含的功能，也就是要编写这个函数的功能。\n\
    \n定义函数的格式如下：\n\n```\ndef 函数名():\n    函数内容；函数内容\n    函数内容；函数内容\n```\n\n示例如下：\n\n\
    ```\nIn [68]: def function1():\n    a=9\n    a+=8\n    print a\nIn [69]: function1()\n\
    Out[69]: 17\n```\n\n这样就定义了一个 function1 函数，它没有参数，也没有返回值，仅仅打印出经过运算的 a 的值。\n\n# 2.5.2\
    \ 形参与实参\n\n在 Python 中函数的功能是实现一项或多项功能，比如函数 len()的功能是取字符串的长度。但是，如果没有指明要取哪个字符串的长度，则仅有\
    \ len()是没有实际意义的。要让 len()有实际意义，就必须将某个字符串放进这个函数里。比如，我们要取字符串\"abcdm\"的长度，就要将\"abcdm\"\
    放进 len()里，变成 len(\"abcdm\")，这时 len()才有实际意义，括号里的\"abcdm\"就叫作函数的参数。\n\n```\nIn [70]:\
    \ a=\"abcdm\"\n    print len(a)\nOut[70]: 5\n```\n\n我们可以发现，参数是函数在执行功能时要用到的数据。"
  merge: -1
  img_proc: true
- pgno: 58
  md: "# 1. 什么是形参\n\n在 Python 中函数是有参数的，函数的参数有两种，一种是实参，另一种是形参。形参一般发生在函数定义的过程中，一般指参数的名称，而不代表函数的值，它只是形式上的函数，只表明在一个函数中的哪个位置有哪个名称的参数。下面通过示例来了解形参：\n\
    \n```\nIn [71]: def function(a,b):\n    if a>b:\n        print a\n    else:\n\
    \        print b\n```\n\n如上所示的函数的名称是 function，它有 a、b 两个形参。我们在调用这个函数时需要对其赋两个参数，分别赋值给\
    \ a 和 b，该函数的功能是打印出较大的值：\n\n```\nIn [72]: function(4,5)\nOut[72]: 5\n```\n\n# 2.\
    \ 什么是实参\n\n实参与形参刚好互补，一般在函数调用时出现，并且一般指参数的具体的値。下面通过示例了解什么是函数的实参，并总结函数的实参与形参的区别：\n\
    \n```\nIn [73]: def function1(a,b):\n    if a>b:\n        return 'a+b'\n    else:\n\
    \        return 'a-b'\n    a=function1(1,3)\n    print a\nOut[73]: a-b\n```\n\n\
    如上所示，函数的名称是 function1，在函数中有 a、b 两个形参，每次调用函数时都需要分别给 a、b 赋值，如果 a 大于 b，则返回字符串 a+b；如果\
    \ a 小于等于 b，则返回字符串 a-b。\n\n在 a=function1(1,3)中，1 和 3 是实参，分别被赋给了 a、b，因为 1<3，所以输出的结果是\
    \ a-b。"
  merge: -1
  img_proc: true
- pgno: 59
  md: "# 3. 参数的传递\n\n在 Python 中，函数在调用的过程中对参数的传递是有顺序的。下面讲解第 1 种参数的传递方式，也是最简单的传递方式，即按位置传递：\n\
    \n```\nIn [74]: def function(a=1,b=0):\n    if a>b:\n        return a\n    else:\n\
    \        return b\n    max=function(7,8)\n    print max\nOut[74]: 8\nIn [75]:\
    \ function()\nOut[75]: 1\n```\n\n在函数 function 中有两个形参，并且两个形参的默认值 כא=1 及 b=0，在调用\
    \ function 时，需要给其赋两个值，分别给第 1 个位置（a）和第 2 个位置（b）。该函数的功能是输出两个位置中较大的值。\n\n注意：因为 a、b\
    \ 有默认值，所以在不输入或者仅输入其中一个的参数时，函数的调用也不会报错。\n\n下面讲解第 2 种参数的传递方式，即赋值传递:关键字参数。在 Python\
    \ 的一个函数中出现多个参数时，我们可以通过参数的名字直接给我们的参数赋值，这些参数就叫作关键字参数。\n\n如下所示，函数 function 有 3 个形参，分别是：add、b、c，它们的默认值都是\
    \ 0。在调用 function 时需要给其赋 3 个值。function(a,c,b)表示将 a 的值赋给 add，将 b 的值赋给 c，将 c 的值赋给\
    \ b：\n\n```\nIn [76]: a=9\n    b=10\n    c=1\n    def function(add=0,b=0,c=0):\n\
    \        print add\n        print b\n        print c\n    function(a,c,b)\nOut[76]:\
    \ 9\n        1\n```"
  merge: -1
