    # 6.7 技术指标类策略


    本节将继续介绍我们常用的量化策略之一：技术指标类策略。区别于基本面对于市场经济情况及公司经营管理情况的研究，技术指标是指根据投资者对某些特定方面市场行为的考虑，例如股价、成交量及衍生涨跌指数数据，结合数学上的计算方法，通过图表和技术指标的分析来研究市场行为和预测价格变动。


    各项技术指标的具体数值及相互间的关系可反映股票市场的状态，对我们的市场操作具有一定的指导性。常见的技术指标有动量指标、随机指数、均线等，本节将结合通联数据平台介绍以下
    6 种技术指标策略，在每一部分都将对指标的含义、计算方法、使用方法做出详细说明，并对每个技术指标策略的收益情况进行回测分析。


    # 6.7.1 AROON 指标


    +   1. 指标介绍


    阿隆指标（AROON）由图莎尔·钱德（Tushar Chande）于 1995 年发明，通过计算价格从达到近期最高值和最低值以来所经过的周期数，帮助投资者预测证券价格从趋势到区域、区域或反转的变化。相较于关注相对于时间的价格的趋势指标，AROON
    指标更关注相对价格的时间。


    +   2. 计算公式


    在计算阿隆指标时通常需要事先设定一个周期 T，一般取 25，然后通过统计距离最近'
