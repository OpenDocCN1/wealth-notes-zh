- pgno: 52
  md: "+   要恰当地运用 break 和 continue 语句，以便适时结束循环；\n\n+   在 while 语句中还可以再写 while 语句，从而形成循环嵌套。\n\
    \n# 2.4.6 break 语句与 continue 语句\n\n在 Python 中用于终止循环的语句有 break 语句和 continue 语句，这两种语句跳出循环的层次不同，但各有用处。\n\
    \n# 1. break 语句\n\nbreak 语句是用来终止程序的执行的。当在循环结构中出现 break 语句时，即使在循环条件中没有 false 条件，或者序列还没被完全递归完，也会终止循环语句。如果\
    \ break 语句出现在嵌套循环中，则应当终止执行最深层的循环，并开始执行下一行代码。\n\nbreak 语句在 while 循环中的示例如下：\n\n\
    ```\nIn [57]: a=1\n    while a:\n        print a\n        print \"hello world\"\
    \n        a=a+1\n        if a==3:\n            break\n\nOut[57]:\n    1\n    hello\
    \ world\n    2\n    hello world\n```\n\nbreak 语句在 for 循环中的示例如下：\n\n```\nIn [58]:\
    \ for i in range(5,9):\n        print i\n        print \"hello world\"\n     \
    \   if i>6:\n            break\n\nOut[58]:\n    5\n    hello world\n```"
  merge: -1
  img_proc: true
