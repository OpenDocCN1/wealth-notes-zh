- pgno: 190
  md: '# 4. order_pct_to(symbol, pct)


    指根据当前的账户权益按一定比例下单。策略框架会自动计算当前持仓和目标持仓的差额，并进行下单。比如当前账户有 100 000 元，下单 20%，就会使用 20000
    元计算最大可委托手数，为 500 股，当前持有 300 股，则下单 200 股。


    对其参数说明如下。


    +   ○ 为 symbol 时，指需要交易的证券代码，必须包含后缀，其中上证证券为.XSHG，深证证券为.XSHE。


    +   ○ 为 pct 时，指需要交易的证券代码为 symbol 的证券占虚拟账户当前总价值的百分比，范围为 0～1，为正则买入，为负则卖出。程序会自动对计算出的下单数量向下取整到最近的整百。


    看了上面的解释，相信你已经了解各种下单方法的含义。我们首先把在持仓里但不在待买股票池里的股票卖出，接着也是通过 account 的方法 account.portfolio_value
    获取组合的市值，然后运用 order_pct_to 方法将所有待买股票买入或卖出到等权。需要注意的是，通常我们都会将卖出操作写在买入操作的前面，因为只有卖出股票腾出现金，我们才可以买入其他股票。


