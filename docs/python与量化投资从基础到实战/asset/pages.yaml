  md: "# Python 与量化投资：从基础到实战\n\n# 2.4.1 控制流的功能\n\n控制流的功能就是控制代码的执行方式，下面通过两种方式来实现同一功能。\n\
    \n方式一：\n\n```\nIn [41]: i=1\n    print i\n    i=i+1\n    print i\n\n    i=1\n\
    \    print i\n    i=i+1\n    print i\nOut[41]:\n    1\n    2\n    1\n    2\n```\n\
    \n方式二：\n\n```\nIn [42]: for k in range(0,2):\n        i=1\n        print i\n \
    \       i=i+1\n        print i\nOut[42]:\n    1\n    2\n    1\n    2\n```\n\n\
    例如，若要实现一个分支判断功能：如果天气晴朗（sunny），就输出 “basketball”，否则，输出 “badminton”。按照正常的顺序执行方式，是无法实现该功能的，此时就可以选择使用\
    \ if 语句，我们会在后面详细介绍具体的 specific 使用方法：\n\n```\nIn [43]: weather=\"rainy\"\n    if\
    \ weather==\"sunny\":\n        print \"basketball\"\n    else:\n        print\
    \ \"badminton\"\n```"
