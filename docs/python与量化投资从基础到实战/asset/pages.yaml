- pgno: 382
  md: '则我们称 {r_t} 为线性序列。其中 a_t 被称为在 t 时刻的新息（Innovation）或扰动（Shock）。


    很多时间序列是线性的，即为线性的时间序列，所以有很多相应的线性时间序列模型，例如接下来要介绍的 AR、MA、ARMA 都是线性模型，但并不是所有的金融时间序列都是线性的。


    对于弱平稳序列，我们利用白噪声的性质很容易得到 r_t 的均值和方差：


    E(r_t) = μ, Var(r_t) = σ_a^2 ∑_{i=0}^∞ ψ_i^2 （σ_a^2 为 a_t 的方差）


    因为 Var(r_t) 一定小于正无穷，因此 {ψ_i^2} 必须是收敛序列，因此满足


    i → ∞ 时， ψ_i^2 → 0


    即随着 i 的增大，远处的扰动 a_{t-i} 对 r_t 的影响会逐渐消失。


    本节介绍了一些基本知识和概念，例如平稳性、相关性、白噪声和线性序列，并没有深入介绍，对读者目前来说是 “够用” 的，在后面的章节中补充一些细节。下面开始介绍一些线性模型。


    # 6.9.2 自回归（AR）模型


    我们在 6.10.1 节计算了上证指数部分数据段的 ACF，可知间隔为 1 时自相关系数是显著的，这说明在 t-1 时刻的数据 r_{t-1} 在预测 t
    时刻的 r_t 时可能是有用的，我们根据这一点可以建立下面的模型：


    r_t = φ_0 + φ_1 r_{t-1} + a_t


    其中 {a_t} 是白噪声序列。这个模型与简单的线性回归模型有相同的形式，也叫作一阶自回归（AR）模型，简称 AR(1) 模型。


    从 AR(1) 很容易推广到 AR(p) 模型：


    r_t = φ_0 + φ_1 r_{t-1} + ⋯ + φ_p r_{t-p} + a_t


    1. AR(p) 模型的特征根及平稳性检验


    我们先假定序列是弱平稳的，则有 { E(r_t) = μ, Var(r_t) = γ_0, Cov(r_t, r_{t-j}) = γ_j }，其中 μ 及
    γ_0 是常数。'
