    # 6.3.3 实例展示


    通过上面的介绍，我们对市场中性 Alpha 策略有了较清晰的认识，这里利用多因子模型构建一个股票组合，同时选取基准指数对应的期货进行对冲，就可以构建一个完整的市场中性
    Alpha 策略。


    下面是一个具体的市场中性策略的实例。


    （1）策略配置如下。


    +   - 回测区间：2015 年 1 月 1 日至 2015 年 8 月 26 日。\n- 基准：沪深 300 指数。\n- 股票池：沪深 300 动态成分股，在每个交易日都进行调仓。


    （2）对因子的选取和处理如下。


    +   - 对因子的选取：净利润增长率、净资产收益率、相对强弱指数（RSI）。\n- 对因子的处理：用到了去极值（Winsorize）、标准化（Standardize）、中性化（Neutralize）处理。\n-
    组合构建：等权配置。


    （3）空头期货对冲为：空头使用期货 IF 当月合约做空来进行对冲。如果距离合约到期日有 3 天，则移仓换月。IFL0 表示当月合约，IFL1 表示次月合约。


