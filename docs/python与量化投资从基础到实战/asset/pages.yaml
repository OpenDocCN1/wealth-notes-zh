  md: "# Python 与量化投资：从基础到实战\n\n```\ncontext.transfer_cash(origin=futures_account,\
    \ target=stock_account, amount=2e5)\nassert stock_account.cash, futures_account.cash\
    \ == (1100000, 900000)\nassert stock_account.portfolio_value + futures_account.portfolio_value\
    \ == 2000000\n```\n\n# 5.2 股票模板实例\n\n上面介绍了编写策略回测的基本模板，下面以一个完整的股票策略为例进行讲解。策略截图如图\
    \ 5-3、图 5-4 所示。\n\n```\nimport pandas as pd\nstart = '2014-11-01'\nend = '2018-01-01'\n\
    benchmark = 'HS300'\n universe = DynamicUniverse('HS300')  # 股票池为沪深300\nrefresh_rate\
    \ = 60\nmax_history_window = 60\naccounts = {\n  'fantasy_account': AccountConfig(account_type='security',\
    \ capital_base=1000000,\n                                  commission=Commission(buycost=0.001,\
    \ sellcost=0.002,\nunit='perValue'),slippage = Slippage(value=0.0, unit='perValue'))\n\
    }\ndef initialize(context):\n    pass\ndef handle_data(context):\n    account\
    \ = context.get_account('fantasy_account')\n    universe = context.get_universe(exclude_halt=True)\n\
    \    history = context.history(universe,'closePrice', 60)\n    momentum = {'symbol':[],\
    \ 'c_ret':[]}\n    for stk in history.keys():\n        momentum['symbol'].append(stk)\n\
    \        momentum['c_ret'].append(history[stk]['closePrice'][-1]/history[stk]['closePrice'][0])\n\
    \    # 按照过去60日收盘收益率排序，并且选取前60只的股票作为买入候选\n    momentum = pd.DataFrame(momentum).sort(columns='c_ret',ascending=False).reset_index()\n\
    \    # print momentum\n    momentum = momentum[:60]  # 选择\n    buylist = momentum['symbol'].tolist()\n\
    \    for stk in account.get_positions():\n        if stk not in buylist:\n   \
    \         order_to(stk, 0)\n    # 等权重买入所选股票\n    portfolio_value = account.portfolio_value\n\
    \    for stk in buylist:\n        order_pct_to(stk, 1.0/len(buylist))\n```\n\n\
