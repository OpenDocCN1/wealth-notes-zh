    \                         # 执行 handle_data 的时间间隔\n\naccounts = {\n    'stock_account':\
    \ AccountConfig('security', capital_base=1e6),\n    'futures_account': AccountConfig('futures',\
    \ capital_base=1e6)\n}\n\ndef initialize(context):                 # 初始化策略运行环境\n\
    \    pass\n\ndef handle_data(context):\n    stock_account = context.get_account('stock_account')\n\
