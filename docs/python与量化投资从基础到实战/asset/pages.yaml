- pgno: 402
  md: "分位组的股票，然后进行简单的等权或者市值加权；筛选法会先对股票进行分层，在每一层里选出对应的第几分位组的股票。然而这两种方法在组合风险的控制上并不够精细，因此需要使用组合优化的算法来给出个股的权重。优矿的优化器正是为了实现这一功能而推出的。优化器的模型大概可以用下面的数学式子进行表示：\n\
    \n```\nmax : ω^T α\nst : min_weight <= ω_{i,t} <= max_weight\n    Σ_k ω_{i,t}\
    \ = 1\nΣ_k |ω_{i,t} - ω_{i,t-1}| <= turnover_target\nx_style,lower <= X_style\
    \ ω <= x_style,upper\nx_indu,lower <= X_indu ω <= x_indu,upper\nIE(ω - ω_benchmark)\
    \ = 0\nMCE(ω - ω_benchmark) = 0\nω^T_active Σ ω_active <= 0.5\n0 <= ω^T Σ ω <=\
    \ risk\n0 <= (ω - ω_b)^T Σ (ω - ω_b) <= trackingerror\n```\n\n上面的公式给出了 7 个约束，如下所述。\n\
    \n+   ○ 个股权重约束：这是一个很明显的约束，因为 A 股市场不允许做空，所以我们对个股的权重必须要控制在 0 到 1 之间。\n○ 权重之和约束：这个约束是强制的，它会使我们的组合的最终权重之和为\
    \ 1，即全额投资。\n○ 换手率约束：我们对换手率进行控制，换手率的计算公式为： Σ_k |ω_{i,t} - ω_{i,t-1}|，注意，这个约束带绝对值，求解起来要用特殊的方法。\n\
    ○ 风格因子约束：我们要控制组合在某些风格因子上的暴露。\n○ 行业因子约束：我们要控制组合在行业上的暴露。"
