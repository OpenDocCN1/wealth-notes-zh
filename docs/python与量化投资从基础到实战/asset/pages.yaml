  md: 'Python 与量化投资：从基础到实战


    Don''t Lie) 等畅销书籍，更被洛杉矶时报誉为“股息圣母”。


    # 1. 策略说明


    杰拉尔丁·维斯蓝筹股投资法不仅强调高股息，还看重公司的成长性及股票的流通性，这是策略在缺乏行业多样性的前提下依旧表现稳健的主要原因。以下是杰拉尔丁·维斯的主要基本投资逻辑。


    +   (1) 在过去 12 年内股息必须成长 5 倍。


    +   (2) 在标准普尔的评估体系中必须达到 A-或以上的评级。


    +   (3) 在外流通股数至少为 500 万股，以确保有充分的市场流通性。


    +   (4) 至少有 80 家机构持有该股。


    +   (5) 必须至少在 25 年内不间断地发放股息。


    +   (6) 在过去 12 年内公司的盈余必须至少有 7 年成长。


    # 2. 具体策略与量化实现


    由于国内市场与美国市场有若干差异，因此除借鉴杰拉尔丁·维斯的选股标准外，也可以整合以下客观、可量化的指标作为选股标准。


    选股标准如下。


    +   (1) 股本数量大于市场平均值。


    +   (2) 选择沪深 300 成分股作为股票池。


    +   (3) 至少有 10 家以上的股票型基金持有该股。


    +   (4) 在 5 年内至少有 3 年净利润成长率大于 0。


    +   (5) 在过去 3 年内不间断地发放股息。


    +   (6) 过去 3 年的股息必须成长 0.5 倍以上。


    +   (7) 股息率 ≥4%


    我们按照如下方法进行回测。'
