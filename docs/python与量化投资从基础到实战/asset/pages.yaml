  md: '# 推荐序一


    # 互联网时代的量化投资：科技让量化投资和智能投资更普及


    科技一直是推动投资行业变革的重要力量，它的发展和应用催生了量化投资的新模式。量化投资利用科学的方法认识市场波动，通过实证方法验证投资假设，通过组合优化生成
    Alpha 交易，可有效地控制风险暴露，高效覆盖大量的投资机会，并提高投资的效率。


    自量化投资的开山之作 Beat the market: A Scientific Stock Market System 出版以来，量化投资便在全球范围内快速发展，涌现出指数基金、对冲基金、SmartBeta
    和 Fund of Funds（FOF）等量化创新产品。量化投资改变了全球资产管理格局，成为主流的投资方法，其管理规模也在快速增长。目前，全球最大的资产管理公司和对冲基金都是基于量化和指数投资的机构。


    量化投资行业的蓬勃发展吸引了众多年轻人投入其中，但因其门槛高、专业性强，只有大型投资机构才有能力提供量化研究和投资平台，普通大众没有机会利用专业的量化平台进行研究和投资，也缺乏系统性的量化投资培训教材，这成为制约行业发展的主要问题。因此，在
    2015 年，通联数据推出开放的量化投资平台——优矿，让普通大众也能够拥有华尔街专业机构的量化装备，让量化投资变得更加容易。借助 Python 科学计算的能力和海量的金融大数据，在优矿平台上可以快速进行统计推断、因子分析、信号研究、资产定价、事件研究、机器学习、深度学习等量化研究工作。优矿已成长为大型的专业量化平台，为行业的发展培养了很多优秀人才。


    优矿的部分特色如下。


    +   ○ 海量的金融大数据：提供各类资产和财务数据、因子、主题、宏观行业特色大数据和量化场景 PIT 数据，保障在量化过程中不引入未来数据。'
