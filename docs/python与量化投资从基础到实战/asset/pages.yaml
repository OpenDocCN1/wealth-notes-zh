- pgno: 199
  md: '# 3. 阿尔法（Alpha）


    表示在投资中面临的非系统性风险。Alpha 是投资者获得的与市场波动无关的回报，一般用来度量投资者的投资技能。比如投资者获得了 12% 的回报，其基准获得了
    10% 的回报，那么 Alpha 或者价值增值的一部分就是 2%。其计算公式为


    α = p_r − r_f − β(B_r − r_f)


    其中，P_r 为策略年化收益率，r_f 为无风险收益率，B_r 为基准年化收益率。


    相应的 Alpha 值及释义如表 5-5 所示。


    # 表 5-5


    | Alpha 值 | 释 义 |

    |---|---|

    | a>0 | 策略相对于风险获得了超额收益 |

    | a=0 | 策略相对于风险获得了适当收益 |

    | a<0 | 策略相对于风险获得了较少收益 |


    # 4. 贝塔（Beta）


    表示在投资中面临的系统性风险，反映了策略对大盘变化的敏感性。例如，一个策略的 Beta 为 1.3，则在大盘涨 1% 时，策略就可能涨 1.3%，反之亦然；如果一个策略的
    Beta 为 -1.3，则说明在大盘涨 1% 时，策略可能跌 1.3%，反之亦然。其计算公式为


    β = Cov(p_n, B_n) / σ_m²


    其中，pn 指策略每日收益率，Bn 指基准每日收益率，σ_m² 指基准每日收益方差，Cov(pn,Bn) 指策略每日收益率和基准每日收益率的协方差。


    # 5. 夏普比率（Sharpe Ratio）


    表示每承受一单位总风险，会产生多少超额報酬，可以同时对策略的收益与风险进行综合考虑。其计算公式为


    SharpRatio = (p_r − r_f) / σ_p


    其中，p_r 指策略年化收益率，r_f 指无风险收益率，σ_p 指策略收益波动率。'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 6. 收益波动率（Volatility）


    用于测量资产的风险性，波动越大，代表策略风险越高。其计算公式为


    ```

    σ_p = sqrt( 250/(n-1) * sum_{i=1}^n (p_i - overline{p_t})^2 )

    ```


    其中，n 指回测交易日数量，p_i 指策略每日收益率，overline{p_t} 指策略每日平均收益率。overline{p_t} 的计算公式为


    ```

    overline{p_t} = 1/n sum_{i=1}^n p_n。

    ```


    # 7. 信息比率（Information Ratio）


    用于衡量单位超额风险带来的超额收益。信息比率越大，则说明该策略单位跟踪误差所获得的超额收益越高。因此，信息比率较大的策略的表现要优于信息比率较低的基金。合理的投资目标应该是在承担适度风险的情况下，尽可能地追求高信息比率。其计算公式为


    ```

    InformationRatio = (p_r - B_r) / σ_t

    ```


    其中，p_r 指策略年化收益率，B_r 指基准年化收益率，σ_t 指策略每日收益差值与基准每日收益差值的年化标准差。


    # 8. 最大回撤（Max Drawdown）


    用于描述策略可能出现的最糟糕的情况，计算公式为


    ```

    MaxDrawDown_t = max(1 - p_j / p_i)

    ```


    MaxDrawDown_t 为 t 日的最大回撤，p_i 和 p_j 分别为 i 日和 j 日的策略总资产，其中 t > j > i。


    # 9. 换手率（Turnover Rate）


    用于描述策略变化的频率及持有某只股票平均时间的长短，计算公式为'
