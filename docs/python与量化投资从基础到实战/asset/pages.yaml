- pgno: 299
  md: '一段时间的最高、最低价格的时间来计算 Aroon-Up 和 Aroon-Down，具体计算公式为


    Aroon-Up = ((T - Days Since T - day High)/T) × 100


    Aroon-Down = ((T - Days Since T - day Low)/T) × 100


    将上面的两个指标相减，可以进一步得出 Aroon-Osc 指标，即


    Aroon-Osc = Aroon-Up - Aroon-Down


    # 3. 指标使用说明


    在对 Aroon 指标进行分析时，主要观察以下 4 种状态。


    +   (1) Aroon 指标高于 70 时表示强势，低于 50 时表示弱势。以 Aroon-Up 线为例，当其达到 100 时，表示处于多头强势；维持在
    70～100 时，表示处于多头上升趋势；维持在 0～30 时，表示多头处于较弱势；达到 0 时，表示多头处于极度弱势。Aroon-Down 线同样。如果两条线同时处于底部，则表示处于盘整时期，无明显趋势。


    +   (2) 平行运动：当两条线平行运动时，则表示原有趋势仍在继续，直到达到极值水平或者发生交叉穿行时才会改变趋势。


    +   (3) 交叉穿行：当上行线下穿下行线时，则表示原有趋势正逐渐减弱，预计将发生反转。


    +   (4) Arron-Osc 线高于零表示处于上升趋势，低于零则表示处于下降趋势；与零线偏离越远，则表示走势越强。


    # 4. 指标回测


    下面构建基于 Aroon 指标的策略，具体的策略要求如下。


    +   (1) 如果 Aroon-Up 高于 70 且 Aroon-Down 低于 30，则买入；如果 Aroon-Down 高于 70 且 Aroon-Up
    低于 30，则卖出。


    +   (2) 等权买入符合条件股票，如果可选的股票少于 10 只，则每只买入 0.1，出现重复信号时不重复买入。


    +   (3) 如果股票数量高于可用资金，则随机买入其中一部分，保证资金用完。'
