    # 十、围棋出现了 AlphaGo，投资会不会出现 AlphaStock?


    答：不排除这个可能，但是从目前来看，价格也是由多方面因素共同决定的。市场的复杂度远高于围棋，有风险很难量化，也就是说虽然人工智能在某些方面远胜于人类，但是目前还未出现可以直接实盘的人工智能，其任重道远。另外，就算是最后出现了可以用于实盘的
