- pgno: 128
  md: '# 3. 将 Scikit-Learn 应用于机器学习


    传统的编程方式是人们自己进行数据收集，从而总结其中的经验，然后进行编译汇编，最后交由机器去执行。而机器学习是一种全新的编程方式，由人们提供大量的数据，计算机自己进行归纳总结，然后得到一个训练模型来代替人们进行判断。在
    Scikit-Learn 中提供了封装好的算法模型，但在 certainly 使用 Scikit-Learn 之前，我们需要通过一幅结构图来认识一下机器学习，如图
    3-23 所示。


    ![](img/0b89c6ed12810914fc2fb80a08af1fae_128_0.png)


    图 3-23


    # 3.6.2 常见的机器学习模型


    # 1. 决策树


    决策树（Decision Tree）是最为常见的机器学习方法，通过树状结构判断模型进行决策。以二分类任务为例，我们尝试根据训练数据得到一个模型，从而对新的实例进行分类。例如，在对“是否可以为一个申请人贷款”这样的问题进行决策时，我们通常要进行一系列判断：先看其年龄段，如果是“青年”，则再看申请人目前是否有工作，如果是“有”，则再看申请人是否有房产，如果是“有”，则再看申请人的历史信贷情况如何，如果是“非常好”，则可得出结论：可以给申请人进行贷款。决策实例如图
    3-24 所示。'
  merge: -1
  img_proc: true
- pgno: 129
  md: '![](img/0b89c6ed12810914fc2fb80a08af1fae_129_0.png)


    # 图 3-24


    在一般情况下，一棵决策树包含一个根节点、若干内部节点及若干叶节点。根节点包含样本全集，叶节点对应决策结果。每个路径代表一个判定测试序列，对其多次训练以生成一棵泛化能力强、可处理未见示例的决策树。在
