    # 6.4 大师策略


    本节将用金融工程手段与方法，对国内外投资大师的经典投资理论进行介绍、实现、验证与分析。所谓大师策略，其实和基本面量化有异曲同工之妙，更偏向于主动投资管理，通过使用者对公司财务指标、市场方向等的顶层逻辑去建立相应的量化模型，再通过数量化手段去验证自己的逻辑。本节的大师策略不仅适用于量化投资者，也可为主动投资者和技术面投资者提供参考，希望读者能通过本节学习到大师策略量化的相关流程及实现方法。


    在编写大师策略时，我们更关注于大师投资的逻辑与思路，尽量以量化指标还原大师的投资逻辑。但因为国内外市场的环境不同，所以我们偶尔会用更适合中国市场的指标对原有的大师策略进行替代与优化。使用大师策略时切忌“刻舟求剑”，也不推荐直接使用大师策略进行投资，因为从策略验证效果上看，许多大师策略在国内的复制效果并不理想。'
