- pgno: 352
  md: '# 6.8.2 Black-Litterman 模型


    # 1. Black-Litterman 模型概述


    基于马科维茨均值-方差模型的资产组合分析需要获取各资产的预期收益和方差。通常可以通过情景分析法和历史数据法估算预期收益和收益率方差。情景分析法主要根据当前行情和宏观经济环境等因素形成主观的预期，主观性和随意性显然过强；历史数据法则完全根据过去的历史收益率计算收益均值和方差，用来代替对未来的预期，这也是目前的主流做法。这种做法存在几个问题，一是历史数据往往由于历史的一些宏观环境或随机因素而存在比较大的波动性，这也意味着历史的收益率和方差在未来有可能会由于宏观环境和随机因素的改变而不会保持一致；二是由于采取的历史数据的时间段不同，估算出的预期收益率和方差也会有较大的差别，导致得出的最优资产配置比例也会有较大的差别。高盛的
    Black F.和 Litterman R 在 1991 年的一篇论文中提到：他们在对全球债券投资组合的研究中发现，在对德国债券预期報酬率做 0.1% 的小幅修正后，该类资产的投资比例竟由原来的
    10.0% 提高至 55.0%，这也意味着马科维茨的均值方差模型得到的投资组合对于输入的参数过于敏感。


    Black 和 Litteraman 在前述均值方差模型的基础上，通过历史数据估计基准预期和方差，导入投资者的主观预期，把历史数据法和情景分析法结合起来，形成新的市场收益预期，从而解决了在前述模型中预期收益和方差估计存在的问题。


    # 2. Black-Litterman 模型（简称 B-L 模型）简介


    B-L 模型在均衡收益的基础上通过投资者的观点修正了期望收益，使得均值方差组合优化中的期望收益更为合理，而且将投资者的观点融入到模型中，在一定程度上是对马科维茨均值方差组合理论的改进。


    B-L 模型假设各资产收益率 R 服从联合正态分布，R~N(μ,Σ)，其中 μ 和 Σ 是各资产预期收益率和协方差的估计值。现在假设估计向量 μ 本身也是随机的，且服从正态分布：μ~N(Π,τΣ)，其中
    Π 为先验期望收益率的期望值，通常由历史平均收益率表示。模型引入投资者个人观点的方式是用线性方程组表示；每个方程表示一个观点。例如，如果投资者认为在未来第
    3 种资产会比第 1 种资产的收益率高 2%，就可以表示为


    ```

    -1×μ₁ + 0×μ₂ + 1×μ₃ + ⋯ + 0×μ_N = 2%

    ```


