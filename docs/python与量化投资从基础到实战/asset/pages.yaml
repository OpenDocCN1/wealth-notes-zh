    \n用于设置交易账户类型，为 str 类型，支持 security 股票和场内基金、futures 期货、otc_fund 场外基金（不含货币基金）、index\
    \ 指数。\n\n```\naccount_type = 'security'\n```\n\n# 3. capital_base（初始资金设置）\n\n\
    用于设置交易账户初始资金，为 float 或 int 类型。示例如下：\n\n```\ncapital_base = 100000\n```"
