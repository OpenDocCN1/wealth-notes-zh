    \ HS300 指数，但在控制回撤方面不如指数，投资者可考虑修改离场条件，以期稳中求胜。\n\n# 6.7.5 Chaikin Oscillator 指标\n\
    \n# 1. 指标介绍\n\n佳庆指标（Chaikin Oscillator）由 Marc Chaikin 提出，是一种反映市场内在动能的动量指标。在前面提到的动量指标都是基于价格信息进行计算的，但成交量同样是一个不能忽略的重要信息来源，可以反映股价在本质上的强弱度。由于根据当日涨跌与否来将当日成交量全部看作多头或者空头的力量过于简单，所以\
    \ Chaikin Oscillator 指标针对这种方法进行了改进，计算出乘数因子和能量区间，进一步计算出 ADL 动量指标，再计算 Chaikin Oscillator\
    \ 指标，并根据其符号的变化对涨跌趋势进行判断。"
