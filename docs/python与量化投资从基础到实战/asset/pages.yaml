  md: 'Python 与量化投资：从基础到实战


    技术环境，对于国内量化投资发展来说是一个完美的孵化器。


    # 6.2 行业轮动理论及其投资策略


    # 6.2.1 行业轮动理论简介


    行业轮动理论自 2004 年美林证券提出投资时钟理论以来，逐渐成为一个重要的研究热点。行业轮动指在股市中行业指数收益率的有规律的此起彼伏的现象。这里所说的行业是指一组主营业务类似的公司的集合，这些公司的股票在市场上的表现通常比较接近。行业轮动说明了三点：首先，在近期刚刚热起来的行业将会继续在一段时间内表现较好；然后，这些表现较好的行业终将不会再表现得那么好，但是其他行业开始表现得更好；最后，这些行业此起彼伏的表现是可能被预测的，并且和商业周期非常相关。


    # 6.2.2 行业轮动的原因


    对行业轮动现象的解释有很多，但大体以实体经济和行为金融为主。从实体经济出发，不同的行业存在着不同的赢利周期，而且经济大环境也存在着周期性的变化。股票市场的行业轮动是实体经济变化的一个映射，但是这个映射并不仅仅反映现在的情况，更主要反映将来的情况；同时，这个将来的情况也只是投资者主观预期的情况，未必就是将来的实际情况。从行为金融学出发，投资者存在认知与情感的缺陷，其中认知的缺陷可以通过不断学习来克服，而情感上的缺陷却很难克服，所以行业轮动也在很大程度上受到投资的行为模式的影响。


    # 1. 从产业链的角度来看行业轮动


    在传统上，我们把产业链划分为上中下游：上游一般指资源品，例如煤、石油、铁矿石和有色金属；中游行业指制造业，例如化工、电机制造、钢铁等；下游行业主要指与消费直接相关的行业。


    收入复苏时间从早到晚排列为：下游、中游和上游。收入弹性由大到小排列为：上游、中游和下游。在经济复苏初期，在中上游还在下降的时候，下游就开始恢复了；其次是中游的复苏；上游的复苏较晚，但复苏的力度很大。在经济逐渐繁荣的过程中，中上游表现'
  merge: -1
  img_proc: true
- pgno: 210
  md: '出较大的弹性与力度，而下游的增长是平稳上升的。


    在成本方面，中下游的成本和收入同步波动，而上游的成本在复苏初期平稳上升。据此推测，上游的毛利率在复苏初期快速上升。在经济的中期调整阶段，上游的成本并不会与收入出现同等幅度的下降，下降幅度小于收入下降的幅度，因此这段时间的毛利率会出现暂时的下降。中下游的成本和收入的同步性较高，因此其毛利率不会大幅波动。


    毛利率弹性由大到小排列为：上游、下游、中游。在复苏初期，上游的毛利率即出现大幅的上升；此后，其毛利率会随收入出现一定的波动。在中期调整的后期，上游的毛利率下降明显，中下游的毛利率只呈现小幅下降。


    净利率的弹性由大到小排列为：上游、中游、下游；净利率水平由高到低排列为：上游、下游、中游。毛利率和净利率在弹性方面的不同充分反映了中游的“传导者”角色；在大小方面的不同则说明了中游的“规模化”特征，即管理费用率相对较低，且受产销影响较大。


    利润同比增速由大到小排列为：下游、中游、上游，复苏的时间顺序与收入类似；利润增长的弹性与收入有所差别，由大到小排列为：上游、中游、下游。中游对需求的波动反应较大，利润同比增速的高点往往在经济周期繁荣顶点之前到来，而下游则明显滞后，在繁荣顶点之后才会到达高点。下游与经济周期正相关，且波动相对于中上游较小。


    利润占比变化传递的信息与利润同比增速相似。在经济复苏初期，下游的利润占比明显偏高，这是因为中上游的利润弹性较大，经济衰退使中上游的利润大幅下降；在经济复苏至繁荣阶段时，中游利润占比膨胀，因为中游的利润复苏快于上游；在经济繁荣至衰退阶段时，由于上游的滞后性，其利润占比在这一时期快速扩大，在经济达到谷底时，下游的利润占比大幅下降，而下游又再次短期增加。


    可以看出，处于不同上游下游的行业有着明显不同的赢利周期，更重要的是赢利的弹性不同，导致每个行业的表现存在自己的特性，也就形成了行业轮动的条件。这也说明：处于中上游的行业由于利润弹性大，导致股市估值预期变化大，更能体现行业轮动的特征。


    # 2. 从行为金融学的角度来看行业轮动


    在国外也有一些关于行为金融学结合行业轮动的研究，Moskowitz 与 Grinblatt（1999）得到了这样的结论：行业指数的惯性（动量）效应解释了市场上的大部分惯性效应；如果控制其他市值、估值因素等，则行业指数仍呈现出明显的惯性效应；如果控制行业因素，'
  merge: -1
  img_proc: true
- pgno: 211
  md: '则全市场的惯性效应将不会再显著。


    国内也有许多研究者从投资者行为模式的角度来解释板块（行业）联动：何诚颖（2001）运用现代资本市场理论和行为金融学理论对板块现象的分析表明，板块现象是一种市场投机，其形成与中国股市投资者的行为特征密切相关。陈梦根与曹凤岐（2005）认为在转轨经济和新兴市场中，投资者容易受政策预期的影响，并且决策行为趋同，这就强化了股价冲击的传导机制，使股市呈现出齐涨同跌的现象。陈鹏与郑翼村（2006）研究了我国股市板块联动现象的表现形式，探讨了板块联动现象的成因，将板块联动现象划分为
    4 种基本类型：基本面变化引导型、概念驱动型、庄家操纵型和无风起浪型，认为噪声投资者的非理性行为是构成板块联动现象的最主要原因。刘博和皮天雷（2007）认为在我国股市中投资者普遍认同的一个概念就是“补涨”，没涨的股票要无条件补涨，没跌的股票应当无条件补跌，于是形成了股市的各大板块“齐涨共跌”的局面。


    # 6.2.3 行业轮动投资策略


    基于行业轮动的原因及表现出来的特性，研究者开发出多种行业轮动策略，不过主要还是从上文提到的两个角度进行构建的。


    在开发一个行业轮动策略时，首先要面临的问题就是对行业分类的选择。对行业分类的选择对后面的策略影响是很大的。


    国内常用的行业分类标准有申万、证监会、中证、中信等。


    国际上常用的行业分类标准有联合国制定的 ISIC（全称是 International Standard Industrial Classification
    of All Economic Activities）、欧盟制定的 NACE（全称是 Statistical Classification of Economic
    Activities in the European Community）、美国制定的 SIC（Standard Industrial Classification）和标准普尔与摩根士丹利共同制定的
    GICS（Global Industry Classification Standard）等。


    实际上，我们也可以根据自己的需求，利用聚类算法来构建一套符合自身需求的行业分类体系。


