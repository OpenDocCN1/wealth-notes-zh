  md: "# 6.11.2  Greeks 和隐含波动率计算\n\n这里计算如下 Greeks。\n\n+   - delta：期权价格关于标的价格的一阶导数。\n\
    - gamma：期权价格关于标的价格的二阶导数。\n- rho：期权价格关于无风险利率的一阶导数。\n- theta：期权价格关于到期时间的一阶导数。\n\
    - vega：期权价格关于波动率的一阶导数。\n\n有以下注意事项。\n\n+   - 在计算隐含波动率时采用 Black-Scholes-Merton 模型，此模型在平台\
    \ Python 包的 CAL 中已有实现。\n- 对无风险利率使用 SHIBOR。\n- 在期权的时间价值为负时（此种情况在 50ETF 期权里时有发生），无法通过\
    \ BSM 模型计算隐含波动率，所以此时将期权隐含波动率设为 0.0，实际上，此时的隐含波动率和各风险指标并无实际参考价值。\n\n代码如下：\n\n```\n\
    ## 使用 DataAPI.OptGet、DataAPI.MktOptdGet 拿到计算所需的数据\ndef getOptDayData(opt_var_sec,\
    \ date):\n    date_str = date.toISO().replace('-', '')\n\n#使用 DataAPI.OptGet 拿到已退市和上市的所有期权的基本信息\n\
    ```\n\n```\ntmp = periods[p]\nif periods[p] > max_period:\n    tmp = max_period\
    \ * 0.99999\nelif periods[p] < min_period:\n    tmp = min_period * 1.00001\nsh\
    \ = interpolate.spline(init_shibor.period.values, init_shibor.dataValue.values,\
    \ [tmp], order=3)\n    shibor[p] = sh[0]/100.0\nreturn shibor\n```"
