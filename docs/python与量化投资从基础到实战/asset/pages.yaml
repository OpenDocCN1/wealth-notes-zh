    \ Python 进行数据分析的指南，有大量的关于数据处理分析的应用，并将重点介绍如何高效地利用 Python 解决投资策略问题。本书分为 Python 基础和量化投资两大部分：Python\
    \ 基础部分主要讲解 Python 软件的基础、各个重要模块及如何解决常见的数据分析问题；量化投资部分在 Python 基础部分的基础上，讲解如何使用优矿（uqer.io）回测平台实现主流策略及高级定制策略等。\n\
