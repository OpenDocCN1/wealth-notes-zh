    # 3.4 Matplotlib 的使用


    Matplotlib 是 Python 绘图的始祖。现阶段的大部分高级绘图包如 Seaborn、holoviews、ggplot 及 Pandas 中的 plot()函数等都是基于
    Matplotlib 定制的。换而言之，那些高级绘图包能做到的事，Matplotlib 也能做到，只是可能需要长时间的调试及较多的代码才能达到同一目的，这有点类似于
    C 和 Python 的关系。


    Matplotlib 是一个 Python 2D 绘图库，起初是为了模仿 MATLAB 中的绘图命令而开发的，现在可以在各种 Web 应用及像 Jupyter
    Notebook 这样的交互式环境中绘画图像。Matplotlib 拥有丰富且完善的说明文档，我们可以仅使用几行代码就生成散点图、直方图、柱形图及饼图等，也可以使用命令来控制图中的字体、标题、轴等属性。只要我们能想到的，Matplotlib
    都能做到。


    虽然对于科学家而言，绘图的美观性可能并不重要，只要能清晰地表达出数据的含义就足够了，然而在金融或者互联网领域，绘图的美观性就显得尤为重要了，此时如果依旧使用
    Matplotlib，代码的数量就会变得愈发冗长。Seaborn 就是为了解决这一问题而出现的。


    # 3.5 Seaborn 的使用


    能画出引人注目的图表是非常重要的，例如在探索一个数据集时能绘制出美观的图表是件令人高兴的事；又如，我们在与观众交流观点时，也需要让图表吸引观众的注意力并让其印象深刻。Matplotlib
    的自动化程度非常高，掌握如何设置系统以获得一个具有吸引力的图表并不容易。为了优化 Matplotlib 图表的外观，Seaborn 模块自带许多定制主题和高级接口。'
  merge: -1
  img_proc: true
- pgno: 115
  md: "Seaborn 模块被用于在 Python 中制作有吸引力的统计图形，它构建在 Matplotlib 之上，支持 NumPy 和 Pandas 的数据结构，以及来自\
    \ SciPy 和 StatsModels 的统计结果。该模块旨在用尽可能少的参数生成尽可能漂亮的图形，不过 Seaborn 是对 Matplotlib 的补充，而不是替代品。\n\
    \nSeaborn 的主要功能如下。\n\n+   - 通过内置主题改善 Matplotlib 的外观。\\n- 有丰富的调色板工具，可更好地显示数据。\\\
    n- 对变量分布进行可视化。\\n- 数据矩阵可视化，并使用聚类算法发现这些矩阵中的结构。\\n- 对自变量和因变量之间的线性回归结果进行可视化。\\n-\
    \ 绘制统计时间序列，并将其不确定性可视化。\\n- 构建高级、抽象的网格图，可轻松地将复杂的问题可视化。\n\n# 3.5.1 主题管理\n\nSeaborn\
    \ 的一个重要优点是内置了经过美化的主题，这类似于我们经常使用的 PPT 模板，用户无须在外观调整上花费多余的精力。我们通过一个简单的例子进行理解。\n\n\
    首先，导入 NumPy 及 Matplotlib 模块：\n\n```\nIn [147]:import numpy as np\n    import matplotlib\
    \ as mpl\n    import matplotlib.pyplot as plt\n    %matplotlib inline\nIn [148]:plt.rcParams['font.sans-serif']=['SimHei']\
    \   #用来正常显示中文标签\n    plt.rcParams['axes.unicode_minus']=False   #用来正常显示负号\n```\n\
    \n然后，定义一个函数，用来绘画正弦函数，全部使用 Matplotlib 中的默认参数，不需要任何调整：\n\n```\nIn [149]:def sinplot(flip=1):\n\
    \        x = np.linspace(0, 14, 100)\n        for i in range(1, 7):\n        \
    \    plt.plot(x, np.sin(x + i * .5) * (7 - i) * flip)\nIn [150]:sinplot()\n```"
