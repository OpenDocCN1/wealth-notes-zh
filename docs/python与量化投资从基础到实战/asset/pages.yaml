    接下来划分训练集和测试集，一般采用“留出法”，即直接将数据集划分为两个互斥的集合，将其中一个集合作为训练集 S，将另一个集合作为测试集 T。在划分训练集和测试集时要尽可能保持数据分布的一致性，避免因此引入意外的误差，从而对最终结果产生影响。


    “交叉验证法”是划分训练集与测试集的另一种方法，即将数据集划分为 k 个大小相'
