  md: "# 2.4.4 认识循环结构 for...in\n\nPython 中的 for...in 语句是指在一系列的对象上进行迭代，即逐一使用序列中的每个项目。\n\
    \nfor...in 语句的格式用法如下：\n\n```\nfor i in 集合:\n    执行该部分\nelse:\n    执行该部分\n```\n\
    \n根据上面对 for...in 语句的格式规定，我们通过实例来讲解 for...in 语句的使用方法。\n\n最基本的 for 语句为搭配列表使用：\n\n\
    ```\nIn [51]: for i in [1,2,3,4,5]:\n    print i\n\nOut[51]:\n1\n2\n3\n4\n5\n\
    ```\n\n在 for 语句中使用 range 函数时，range 函数中的第 1 个元素代表起始数字，第 2 个元素代表终止数字，第 3 个元素代表步长，如果不指定第\
    \ 3 个元素，则默认步长为 1：\n\n```\nIn [52]: for i in range(1,10,3):\n    print \"hello\"\
    \n    print i\n\nOut[52]:\nhello\n1\nhello\n4\nhello\n7\n```\n\n在 Python 中，for...in\
    \ 语句经常与“迭代器”组合使用，“迭代器”指任何可以进行迭代操作的对象，比如在前面提到的列表、字符串、元组、字典、文件，等等。"
