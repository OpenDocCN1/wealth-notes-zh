  md: 'Python 与量化投资：从基础到实战


    是下跌势的环境下，均能获得稳定收益的一种投资策略。也就是说，市场中性 Alpha 策略是一类收益与市场涨跌无关，致力于获取绝对收益的低风险量化投资策略，其主要通过同时持有股票多头和期货空头，来获取多头组合超越期货所对应的基准指数的收益。


    # 6.3.2 市场中性 Alpha 策略的思想和方法


    Alpha 策略最初是由 William Sharpe 在 1964 年的著作《投资组合理论与资本市场》中首次提出的，并指出投资者在市场中交易面临系统性风险和非系统性风险，用公式表达如下：


    E(R_p) = R_f + β × (R_m - R_f)


    其中，β = Cov(R_i, R_m)/Var(R_m)，E(R_p)表示投资组合的期望收益率，R_f 表示无风险报酬率，R_m 表示市场组合收益率，β
    为某一组合的系统风险系数。CAPM 模型主要表示单个证券或投资组合同系统风险收益率之间的关系，也就是说，单个投资组合的收益率等于无风险收益率与风险溢价之和。


    Alpha 策略的思想是通过衍生品来对冲投资组合的系统风险 β，锁定超额收益 Alpha。因此首先需要寻找稳定的 Alpha，构建 Alpha 组合，进而计算组合的
    β 来对冲风险。Alpha 策略成功的关键就是寻找到一个超越基准（具有股指期货等做空工具的基准）的策略。比如，可以构造指数增强组合+沪深 300 指数期货空头策略。这种策略隐含的投资逻辑是择时比较困难，不想承受市场风险。


    该策略的方法如图 6-2 所示。


    ![](img/0b89c6ed12810914fc2fb80a08af1fae_217_0.png)


    图 6-2


    市场中性 Alpha 策略是一套科学且成熟的投资研究方法，在实际应用中，我们通常采用多因子模型驱动、期货对冲来获取长期稳定的 Alpha。同时，使用多因子模型可有效地'
