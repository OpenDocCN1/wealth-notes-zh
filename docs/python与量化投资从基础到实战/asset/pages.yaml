  md: '# 前 言


    # 为什么写作本书


    作为投资者，我们常听到的一句话是“不要把鸡蛋放入同一个篮子中”，可见分散投资可以降低风险，但如何选择不同的篮子、每个篮子放多少鸡蛋，便是见仁见智的事情了，量化投资就是解决这些问题的一种工具。


    而 Python 在 1991 年诞生，目前已成为非常受欢迎的动态编程语言，由于拥有海量的库，所以 Python 在各个领域都有广泛应用，在量化投资界采用
    Python 进行科学计算、量化投资的势头也越来越猛。目前各种在线策略编程平台都支持 Python 语言，例如优矿、米筐、聚宽等，这也是我们选择 Python
    进行量化投资的原因。


    目前市场上关于 Python 与量化投资的图书不少，但仔细研究后不难发现，很多图书都是顶着量化投资的噱头在讲 Python 的语言基础，其能提供的策略有限，并且大部分不提供回测平台，此类书籍中的策略往往为涨停股票可以买入、跌停股票可以卖出、停牌也可以交易，等等，这大大违背了
    A 股市场的交易规则，难以获得准确的回测结果。


    鉴于以上情形，为了更好地推动量化投资在中国的普及与发展，我们编写了《Python 与量化投资：从基础到实战》一书，本书兼顾了 Python 语言与量化策略的编写，既可以为不懂
    Python 语言的读者提供零基础入门，也可以为有 Python 基础的读者提供量化策略建模参考。细心的读者不难发现，本书量化投资策略部分的介绍篇幅远大于
    Python 语言的介绍篇幅，这也可看出我们出版本书的初心。


