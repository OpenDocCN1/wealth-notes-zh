- pgno: 61
  md: "# 2.5.3 全局变量与局部变量\n\n# 1. 什么是作用域\n\n在 Python 中，一个变量是在一定的范围内起作用的，这个范围就叫作用域。下面通过实例来讲解作用域：\n\
    \n```\nIn [83]: i=10\n    print i\nOut[83]: 10\nIn [84]: def func():\n    i=8\
    \  # 给局部变量 i 赋值\n    func()\n    print i\nOut[84]: 10\n# 这里定义一个全局变量 i\n```\n\n\
    可以看出输出的结果仍然是 10，这说明在 func 函数中对 i 的第 2 次赋值并没有改变全局中 i 的取值。\n\n# 2. 局部变量\n\n在 Python\
    \ 中，作用域在一定范围内（而非全局内）起作用的变量叫作局部变量。在一个函数中，若没有对变量进行全局变量声明，则默认为一个局部变量。下面通过实例来认识局部变量：\n\
    \n```\nIn [85]: i=2  # 给全局变量 i 赋值\n    def func2(a):\n        i=7  # 给局部变量 i 赋值\n\
    \        print i\n    func2(1)\n    print i\nOut[85]: 7\n        2\nIn [86]: func2(i)\n\
    Out[86]: 7\nIn [87]: print i\nOut[87]: 2\n```\n\n如上所示的代码很形象地说明了全局变量和局部变量，在运行 func2\
    \ 函数时会打印局部变量 i 的值 7，但是在打印全局变量 i 时输出的结果仍然是 2，这说明在函数内部对 i 的赋值并没有改变全局中 i 的值。"
  merge: -1
  img_proc: true
- pgno: 62
  md: "# 3. 全局变量\n\n在 Python 中，如果想让某些变量的作用域为全局，也就是作用于程序的所有区域，就要对这个变量进行全局声明，在声明后这个变量就成了全局变量。下面通过实例来讲解全局变量：\n\
    \n```\nIn [88]: def func3():\n    global i\n    i=7\na=func3()\nprint a\nprint\
    \ i\nOut[88]: None\n7\n```\n\n函数 func3 和 func2 的区别在于，在 func3 中多了 global i 这一行代码，这行代码的作用是在函数中给全局变量赋值。在以上代码中，在运行\
    \ func3 后再打印 i，输出的结果不再是 2，而是 7，这说明在运行 func3 后改变了全局变量 i 的值。\n\n注：若要在函数中给全局变量赋值，就需要用\
    \ global 关键字声明。\n\n# 2.5.4 对函数的调用与返回值\n\n# 1. 对函数的调用\n\n在程序运行时，若想执行某个函数，就需要调用这个函数。若想调用一个函数，则在定义函数之后，直接输入并运行一遍这个函数名即可；若想传递实参给这个函数，则直接在括号里输入实参即可。比如一个函数被定义为\
    \ def func3()，则在调用它时直接输入 func3(参数)即可，其中的参数可以省略：\n\n```\nIn [89]: i=7\ndef func3():\n\
    \    i=1\nfunc3()    #调用函数\nprint i\nOut[89]: 7\n```\n\n注：因为定义的全局变量 i 的值为 7，所以最后打印的结果为\
    \ 7。"
  merge: -1
  img_proc: true
- pgno: 63
  md: "# 2. 函数的返回值\n\n在 Python 中有的函数是有返回值的，有的函数是没有返回值的。有返回值的函数可以返回一个值，也可以返回多个值，函数的返回值是通过\
    \ return 语句来实现的。\n\n有一个返回值的情况如下：\n\n```\nIn [90]: def test():\n    i=7\n    return\
    \ i\n    print test()\nOut[90]: 7\n```\n\n有多个返回值的情况如下：\n\n```\nIn [91]: def test2(i,j):\n\
    \    k=i*j\n    return (i,j,k)\n    a=test2(4,5)\n    print a\nOut[91]: (4, 5,\
