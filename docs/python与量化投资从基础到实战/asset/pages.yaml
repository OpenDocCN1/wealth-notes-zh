  md: "# 2. AR(p)模型的定阶\n\n一般有两种方法来决定 p：\n\n+   - 利用偏相关函数（Partial Auto Correlation\
    \ Function，PACF）;\n- 利用信息准则函数。\n\n这里重点介绍偏相关函数的一个性质：AR(p)序列的样本偏相关函数是 p 步截尾的。截尾指快速收敛应该是快速降到几乎为\
    \ 0 或者在置信区间以内。\n\n具体看看下面的例子，还是基于之前的上证指数日收益率序列：\n\n```\nIn [9]: fig = plt.figure(figsize=(20,5))\n\
    \    ax1=fig.add_subplot(111)\n    fig = sm.graphics.tsa.plot_pacf(temp,ax=ax1)\n\
    ```\n\n![](img/0b89c6ed12810914fc2fb80a08af1fae_385_0.png)\n\n按照截尾来看，模型阶次 p 在\
    \ 110 以上，但是之前调用的自动生成的 AR 模型，阶数为 17。当然，我们很少会用到这么高的阶次。\n\n# 3. 信息准则：AIC、BIC 和 HQ\n\
    \n对于这么多可供选择的模型，我们通常采用 AIC 法则。我们知道，自由参数数量的增加提高了拟合的优良性，AIC 鼓励数据拟合的优良性，但是尽量避免出现过度拟合（Overfitting）的情況，所以我们优先考虑的模型应是\
    \ AIC 值最小的。赤池信息准则是寻找可以更好地解释数据但包含更少的自由参数的模型。目前选择模型除了会采用 AIC 法则，还常采用如下准则：\n\n+ \
    \  - AIC = -2 ln(L) + 2k，即赤池信息量（Akaike Information Criterion）。\n- BIC = -2 ln(L)\
    \ + ln(n) × k，即贝叶斯信息量（Bayesian Information Criterion）。"
  merge: -1
  img_proc: true
