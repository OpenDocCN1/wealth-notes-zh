  md: "接着，我们又看到了对 accounts 账户的设置，account_type 及 capital_base 和我们之前看到的并没有区别。因为我们采用的是股票策略，所以\
    \ account_type='security', capital_base （初始资金）还是 1000 万元。但是这里还需要设置另外两个参数：一个是 commission，另一个是\
    \ slippage。commission 参数用于设置手续费，而 slippage 参数用于设置滑点，它们接收的是特定的 Commission 和 Slippage\
    \ 实例。\n\n通过对上面讲解的手续费及滑点设置的内容，我们可以知道在买入时收取的是买入金额千分之一的手续费，卖出时收取的是卖出金额千分之二的手续费；而对于滑点，我们将其直接设置为\
    \ 0 。可以根据实际需要修改这些设置。\n\n然后，我们可以看到策略最重要的逻辑都是在 handle_data 函数里实现的。首先通过 account =\
    \ context.get_account('fantasy_account')获取我们在前面设定好的股票账户。context 自带了一些日期属性及价量信息、股票池处理等功能，此处我们看到了\
    \ context 的 get_universe 方法，并且它的参数 exclude_halt 被设置成了 True，意思是获取我们当前的股票池并且剔除停牌的股票。因为我们只能交易非停牌的股票，所以要把停牌的股票去掉。\n\
    \n我们还看到了 context 的另一个方法 history，在讲解 max_history_window 参数时也提到过它：\n\n```\ncontext.history(symbol,\
    \ attribute, time_range, freq='1d', style='sat', rtype='frame')\n```\n\nhistory\
    \ 方法用于获取 K 线图等时间序列数据。对其参数说明如下。\n\n+   （1）symbol：指需要获取的证券列表，支持单个证券或证券列表。\n（2）attribute：指需要获取的属性，支持单个值或属性列表。可选的范围如下。\n\
    \  ○ openPrice：前复权开盘价。\n  ○ highPrice：前复权最高价。\n  ○ lowPrice：前复权最低价。\n  ○ closePrice：前复权收盘价。\n\
    \  ○ preClosePrice：前复权前收盘价。\n  ○ turnoverVol：前复权成交量。\n  ○ turnoverValue：前复权成交额。"
