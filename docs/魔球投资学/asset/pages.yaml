  md: '事物可能不會立即用得上（其實，可能永遠都用不到）。好消息是，每個學科需要掌握的通常也只有少數幾個「大概念」（big ideas）。


    多年來蒙格的哲思讓我受益匪淺，而他對我的影響完全流露於書頁之中。更幸運的是，彼得·考夫曼（Peter Kaufman）將蒙格的經歷與演講結集成《窮查理的普通常識》（Poor
    Charlie’s Almanack）¹ 一書——這是一本非常棒的書，為心智模型取徑提供無數洞見。


