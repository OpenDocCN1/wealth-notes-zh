  md: '# 圖表 23.1 各種適應度地景


    ![](img/501b8eadc4f653d4e86fc862268abf1c_239_0.png)


    可以相當肯定的是，創新步調正在加速、管制陸續解除，以及全球化趨勢，因此全世界的適應度地景比過去更扭曲。${ }^{8}$ 一旦對某家公司所處的適應度地景有所領略，也了解該地景是否正在或多或少趨向穩定狀態，你便可以考慮適當的策略以最大化長期價值。


    # 跳躍前，先觀望


    企業顧問艾瑞克・班恩霍克（Eric Beinhover）提出兩大策略以改善適應度。他把第一種策略稱為「短程跳躍」，也就是小幅跨步以漸升達至頂峰。大多數程序改善的動力來自於短程跳'
  merge: -1
  img_proc: true
- pgno: 240
  md: '躍。另一種策略為「長程跳躍」，也就是一些不連續的移動，可能把公司擲向更高峰，也可能將之拋入谷底。長程跳躍包括非相關領域的收購行動或投資初生產品。我認為特定公司的適應度地景在極大程度上決定了短程與長程跳躍之間適當的平衡。9


    例如，平穩型產業裡的焦點通常是程序優化，也就是連續的小步跳躍。長程跳躍可能很昂貴，而且引來擾亂，所以產出價值有限。但這並不是意味著科技不會觸及這些產業。科技確實已發揮影響力，未來也必然如此。然而，這些領域裡的科技進步通常是漸進且可複製的。


    在混亂型適應度地景的那一端，競爭中的公司必須聚焦於長程跳躍，守著下一個大機會，趁勢而起；因為他們知道，即使當前處於峰頂，也可能因為地景的迅速變動而瞬間被弭平。產品生命週期短暫，因此調適比優化更重要。10


    在粗糙型適應度地景裡競爭的公司，應該適當混合短程和長程跳躍。實際上，模型顯示適度的混搭是因應這類地景的最佳策略。11


    # 選取適當工具


    不同的適應度地景，適合採取短程與長程跳躍兩者的不同混搭；適切的財務工具和組織結構也都不一樣。傳統的現金流貼現分析適應用在平穩型適應度地景之内的公司。集中式的管理方法相當有效，因為產業內的營運活動往往已清晰界定。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '粗造型適應度地景裡的公司需要混合傳統的現金流量分析工具和策略選擇方案。為尋求具有價值創造潛力的商業機會，策略選擇是有利的，但也並非必要。$^{12}$
    最後，處在混亂型地景的公司必定得更依賴策略選擇來評估當前與未來可能的適應度。而且，這類公司很適合應用「簡單規則策略」法。這種去中心化的方法涵蓋已商定的決策規則，但允許現場的決策者依據當前狀況制定決策。$^{13}$


    | 適應度地景 | 財務工具 | 組織結構 |

    | :--- | :--- | :--- |

    | 平穩型 | 現金流貼現分析 | 集中化 |

    | 粗糙型 | 現金流貼現分析加上策略選擇 | 寬鬆的集中化 |

    | 混亂型 | 策略選擇 | 去中心化 |


    老虎伍茲的故事告訴我們：改變有時候會帶來短期陣痛，但這對長期的適應度改善是必要的。適應度地景有助於評估某家企業是否採取能夠發揮潛能的正確策略，並且具備適當的組織形態。這樣的分析也指出評估各家企業所適用的財務工具。


