    們避開了那些上漲機率或許不大但期望值相當誘人的投資機會。


    # 投資與賭博的類比


    以上任何機率操作的長期成就取決於一些共同特徵，我概括

    成四大面向：


    +   ■ **專注：** 專業賭者不會玩多樣遊戲——他們不會在賭場裡溜達，玩一下廿一點、擲一下骰子，然後玩一下角子機。他們專注於特定的遊戲，然後精通當中眉角。同樣的，投資者必須畫出自己的「能力圈」（circle
    of competence）——也就是說，自己的專門知識在這個範圍裡相對充足。要在繁雜的產業與企業類別之中找到自己的競爭優勢，至少可被視為一項挑戰。大多數優秀的投資者堅守在他們的能力圈內。


    +   ■ **面臨無數情勢：** 機率遊戲的玩家必須檢視許許多多的情勢，因為市場價格通常都相當準確。投資者也一樣，必須評估無數的局勢，並且搜集大量資訊。蓋可公司（GEICO）成就非凡的資金營運總裁兼執行長盧·辛普森（Lou
    Simpson）就是一個例子，他每天花上五到八小時閱讀，且交易頻率極低。


    +   ■ **時機有限：** 如索普在著作《擊敗莊家》中所說的，即使你知道'
