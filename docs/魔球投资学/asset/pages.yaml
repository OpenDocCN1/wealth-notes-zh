  md: '此對立，而且常常如此。$ ^{9} $


    我們總是依賴專家，但是實際上他們的預測表現如何呢？心理學家菲利普·泰特洛克（Phil Tetlock）在大約二十年間向近三百位專家做出提問，要求他們進行成千上萬次預測。他們所做的預測都是跟政治與經濟相關的結果——這與投資者每天處理的問題很相似。


    結果相當一般。跟簡單統計模型的預測相比，專家即使能改善結果，也只有些微幅度。再者，當泰特洛克質疑專家預測的精確度時，他們就像一般人那樣開始合理化自己的觀點。專家意見若集合在一起會呈現什麼結果，這一點泰特洛克並沒有詳細說明；但是，他的研究確切指出，專業性所定義的能力並不能為艱難的問題提出理想預測。


    把資料進行分解，泰特洛克發現雖然整體而言專家預測都不理想，但其中也是有表現較好者。預測能力關乎的不是預測者的身分或他們的信念，而是在於他們如何思維。仿效哲學家以賽亞·伯林（Isaiah
    Berlin）使用古希臘抒情詩人阿爾基羅庫斯（Archilochus）的比喻，泰特洛克也把專家區分成刺蝟和狐狸兩大類型。刺蝟專精於一件事，然後便用那一件事來解釋他們遇到的所有其他事。狐狸則相反，他們知道很多事，只是每一件事都知道得不多；不過，面對複雜問題時，他們並不會把所有知識簡化成單一的解釋。


    泰特洛克有兩項特別重要的發現。第一，媒體曝光和拙劣預'
