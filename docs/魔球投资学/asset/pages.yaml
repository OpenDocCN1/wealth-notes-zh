  md: '中，成長率中位數維持穩定，但是成長率的變異數隨著規模增加而縮減（見圖表 36.2）。就某個層次而言，這樣的觀察是符合常理的——大型公司占有 GDP 相當高的比例，所以其成長率不太可能顯著超前
    GDP（財星 50 大企業代表了美國 GDP 的 35%）。然而，擠進財星 50 大的往往是那些過往曾取得亮眼的企業，因此後續成長可能跟投資者的預期有所落差。


    # 圖表 36.2 相對於銷售額基準，銷售額成長率變異數下降


    ![](img/501b8eadc4f653d4e86fc862268abf1c_350_0.png)


    來源：FactSet；作者分析。


    上述經驗觀察符合跟吉伯特定律類似的隨機模型。這個定律也被稱為比例效應定律，說明企業成長率與其規模無關。只要進行一些修改，把吉伯特定律套用在公司樣本將產生一個齊夫分布。古典微觀經濟學沒有任何令人滿意的模型可解釋這些現象。$^{7}$'
