  md: '# 21


    # 你的投資組合裡有沒有果蠔？

    ——產業變化加速對投資者的意義


    持續性的競爭優勢帶來的結果即是卓越的經濟績效；從結果看來，我們知道這種競爭優勢能夠維繫的時間已變得越來越短。橫跨各經濟領域，情況皆如此。


    ——提摩西·蕾菲利（Timothy W. Ruefli）和羅伯特·魏金斯（Robert R. Wiggins），〈超級競爭績效：好時光越來越短暫了嗎？〉（Hypercompetitive
    Performance: Are the Best of Times Getting Shorter?）


    我想科技股的企業估值係數應該稍微低於可口可樂（Coke）和吉列公司（Gillette）之類的股票，因為我們正在經歷遊戲規則的全然改變。我很清楚，往後的十年如果微軟（Microsoft）要維持領導地位，我們必須要撐得過至少三個難關。


    ——比爾·蓋茲（Bill Gates），《財星》（*Fortune*），1998


    # 果蠔與商業演化


    遺傳學家和生物學家喜歡以 *Drosophila melanogaster* 為研究對象，這是一種普通的果蠔，卻成了生物學研究的標準。實際上，有三位科學家因研究果蠔所得的發現而獲得
    1995 年諾貝爾醫學獎。無數的研究者持續研究果蠔，並且在其中更進一步釐清'
  merge: -1
  img_proc: true
- pgno: 221
  md: '了各種基因科學與生物發展的問題。


    科學家被果蠅吸引，因為他們了解果蠅的特質，而且這個研究對象易於操作。不過，果蠅還有另一項特徵是科學家們夢寐以求的，那就是果蠅的生命週期——從胚胎到死亡僅兩個星期。如此高的繁殖率讓科學家有機會在相對短的時間內研究數百代果蠅的基因發展與突變。果蠅的快速演化為科學家提供重要線索，以研究其他物種相對極其緩慢的演化過程。¹


    企業家為何會注意果蠅？大量跡象顯示商業世界裡的平均演化速度正日漸提升。科學家從果蠅的演化中得到許多研究發現，同樣的，投資者如果對商業世界加速演化的根源與意涵有所洞見，必將受益無窮。


    日漸加速的商業演化最直接的結果，在於一般企業可維繫競爭優勢的時間，也就是維持報酬高於資本成本的時問，將比過去變得更短。這樣的趨勢對投資者的估值、投資組合週轉，以及投資組合的多樣性，都可能有相當重要的意涵。


