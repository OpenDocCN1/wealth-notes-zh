- pgno: 286
  md: '構想的多样性讓你得到強森所謂的「弱信號」。弱信號可能預示趨勢正要偏離支配路徑（如新科技或新發展）；弱信號也可能是意想不到的管道及時傳來的有用資訊。實際上，最近有研究指出某些組織內的非正式學習滿足了70%的學習需求。⁸
    我們往往難以預知下一個有價值的構想將從哪裡來。研究也證明了，接觸各種不同的資訊來源，則更有機會得到有用的構想。


    # 創意與投資


    美林（Merrill Lynch）投資管理董事長阿瑟·傑科爾（Arthur Zeikel）在他的一篇經典文章中指出，公司要取得優越的投資績效，內部的關鍵人物必須要有創意。⁹
    他認為有創意的人具備以下特質：


    +   - 知識上的好奇心

    - 可變通、對新資訊持開放態度

    - 能夠發現問題，並且對問題做出精準界定

    - 能夠以各種不同的方式融合資訊，直到獲得解決方案

    - 反權威、不默守成規

    - 思緒活躍、熱切、富有幹勁

    - 聰明機智

    - 目標導向


    無論是自然界或我們的認知過程，多樣性都是刺激因素。投資者若緊抱過於狹隘的投資方法或資訊來源，可能就會錯失多樣'
  merge: -1
  img_proc: true
- pgno: 287
  md: '性的力量。當然，多樣性也有其壞處——考慮各種各樣的構想，意味著必須花上許多時間在可能無用的構想之上。但是，總而言之，思維縉密的投資者將因多樣性而得到更富足的投資續效，以及人生。


