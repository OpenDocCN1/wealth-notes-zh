  md: '# # 9  窺探高層內幕

    ——管理評估與投資過程


    在我們的年度股東大會中，有人常會這樣問：

    「如果你被卡車撞了，這裡怎麼辦？」他們還會這麼問，我很高興。不用太久，這問題就會變成：「如果你沒有被卡車撞，這裡怎麼辦？」

    ——華倫·巴菲特，1993 年致股東信函¹


    第五級領導把自我需求從個人轉移到創建卓越公司的遠大目標。這並不是說第五級領導沒有自我或個人利益。實際上，他們的野心抱負異乎尋常——但是在他們的抱負之中擺在前面的是組織，而非自己。

    ——吉姆·柯林斯（Jim Collins），

    《從 A 到 A+》（Good to Great）²


    # ## 管理評估舉足輕重


    「管理評估是投資過程中重要的一環嗎？」這是我的客戶和學生最常向我提出的問題之一。


    答案是肯定的；這重要性有其限制，但值得強調。我認為，有三方面必須仔細考慮：管理層的領導能力、獎勵制度，以及資本配置的技能。以下討論並不旨在涵蓋一切——實際上，專心致志於此領域的學者已寫了無數的文章與書籍，論及上述每個方'
  merge: -1
  img_proc: true
- pgno: 105
  md: '面。我的目標不大，只是為了在這個極其重要卻常被忽略的領域裡激發出一些想法。


    什麼時候可以不用評估企業管理？對短線投資者，或更準確地說，想要短期持有股份的投機客而言，了解管理層的動機並不是一件太重要的事。在短期內，股票價格對特定事件或變幻莫測的市場行情很敏感。長期而言，管理層的行動更有可能為企業績效留下深刻烙印，進而影響股價。


    毫無疑問，執行長（CEO）並不易當，尤其在當前的環境之下。根據最新的研究，相較於十年前，2006 年公司執行長被強制更換的案例暴增。而且這樣的趨勢不僅限於美國本土——研究者發現，同樣的趨勢在歐洲與亞洲有過之而無不及。${}^{3}$


    那麼，怎麼樣的管理團隊才是對投資者有利的？我在以下篇幅中提出一些看法。


    # 領導力


    要為領導力下定義就已經夠棘手了，更別說要評估。但是，我著眼於高階管理者的三大特質，綜合起來似乎可作為領導力評價的合理依據——這三大特質是：**學習**、**指導**，以及**自我覺察**的能力。


    時時渴求**學習**，是好領袖的特徵。就某個層面來說，學習的渴求關乎對知識的好奇心——無時無刻皆想要為自己建立各種有'
  merge: -1
  img_proc: true
- pgno: 106
  md: '助於提升決策能力的心智模型。理想的管理者能夠吸收且權衡各種對立的想法與資訊，也有能力運用機率來思考。我甚至想說，這樣的學習具備近似學術的特質。我喜歡會閱讀與思考的執行長。⁴


    查理·蒙格說得更直接：「在我一生當中，我還未遇過一個不閱讀的聰明人。」


    學習還有另一個關鍵面向，即想要了解組織運作的真正欲望，並且想要以實事求是的態度去面對現實。要了解真實發生的事，唯一方法就是親臨現場，拜訪員工與顧客，向他們提問問題，並且聆聽回應。在幾乎所有的組織裡，網絡的邊緣，即身處前線與日常作業奮戰的員工，能夠給予的資訊遠遠比執行長所在的網絡核心更多。如果執行長身邊圍繞著的盡是一群一味奉承而無建設性的經理人，這樣的執行長不太可能做出什麼好決策。


    學習的最後一個面向在於創造理想的環境，讓組織中每個人都可以在不被冷漠忽視及不被羞辱的情況下自由表達心聲。這並不意味著管理層有必要考慮所有不成熟的想法；這裡的重點是，管理層應該鼓勵並且獎勵組織成員的智能冒險行動。⁵


    羅伯特·魯賓為領導力的這個面向做了具體闡述：


    > 我們財政部的會議包含搜尋、質問，以及辯論，所有這些過程都是為了盡可能探索所有選項。在我們的會議裡階梯並不重要，這在華盛頓是相當少見的。一個 34 歲的副助'
  merge: -1
  img_proc: true
- pgno: 107
  md: '理國務卿和財政部長享有完全一樣的权利發表他們的意見。那種不拘禮節的氛圍正符合我在華爾街以及白宮這兩個地方所累積的經驗——我知道哪一種形式的討論更能帶來啟發性與生產力。所以，當組織裡的任何人，尤其是資淺者，雖然跟我們正在討論的議題有最直接的經驗卻踔踔發言，我便會試著引導他發表看法。對我而言，重要的是觀點的價值，而不是發表者的職稱。⁶


    接下來要談的是指導，也就是把簡單、清晰的願景傳達給組織的能力。指導的工作一方面必須一再地傳達同一個訊息（優秀的企業執行長不斷地向他們的擁護者傳達同一個核心訊息，重複百千次而不言倦），同時也需要依日新月異的商業環境而調適；兩者必須取得平衡。身懷這種技巧的經營者包括傑克・威爾許（Jack
    Welch）和比爾・蓋茲（Bill Gates）。


    指導工作對富有熱忱的經營者來說通常比較容易。對事業懷有熱情而熱愛工作的領導者，深受我的喜愛。成功往往因熱忱而至。


    評估領導力的最後一個面向是自我覺察——領導者必須在自信與謙卑之間尋得平衡。經營者的自信意味著他有能力在特定情境下利用自己的知識、經驗，或他人的貢獻來做出理想決策。謙卑則意指我們意識到没有任何人能擁有一切能力——所有人都有一些需要改進的弱點。具備自我覺察力的經營者了解自己的短處，並且以真正優異者的才能彌補自己的不足。'
  merge: -1
  img_proc: true
- pgno: 108
  md: '自我覺察同時也意味著某種程度的情緒商數，意即在情緒的層次上跟他人以及組織互動的能力。這樣的技巧不僅包含一對一交流時了解對方的想法，還包括了評價組織文化與氛圍的能力。


    # 獎酬制度


    儘管備受批評，經濟學確實做出了偉大貢獻，幫助我們理解獎勵與行為之間的連結。長線投資者必須超越各種公司經營的陳腔濫調，直視管理團隊的真正誘因。股東委託書可能是最少被閱讀的文件，但卻是最重要的公開資料。


    企業獎勵制度從員工認股選擇權轉向限制性股票（restricted stock）的發給，這是目前的趨勢，而許多投資者以及專家權威都予以認同。但我對此沒有多大興趣，因為這類報酬形式並未解答基本的問題：「這些獎勵制度是否能促進長線投資者所期待的經營行為？」


    以員工認股選擇權為例。我們可以提出有力的論點，說明一般的選擇權發放制度也不會為員工帶來激勵效果。具體而言，多頭市場時所有選擇權持有者都會獲利，空頭市場時則所有人都面臨虧損，企業表現是否良好並不會帶來多大差別。慮及選擇權重新定價（硬幣正面我贏、反面你輸）以及那些有關選擇權會計的含糊概念，我們不難發現為何選擇權始終無法為獎勵問題提出完善解答。


    限制性股票也無法明確解答獎勵制度的問題。發給股票的量'
  merge: -1
  img_proc: true
- pgno: 109
  md: '是以什麼為依據？如果股票的發給並非明確基於公司經濟表現，而且接受者也不是有能力影響股價的人（大部分員工皆如此），那麼，股票發給怎麼可能是適當的獎酬方式呢？


    我認為，公司獎勵如果要對員工日常工作中的行為表現帶來實質影響，就必須與員工控制範圍內的業務直接相關。因此，以適當的價值動因（value drivers）來調整企業內各個階層的獎勵方式，這才是讓公司營運滿足管理層和持股人期望的關鍵一步。⁷


    管理者總是大力吹噓「共同持有文化」，嘗試在組織內部廣泛分配股權。儘管員工很樂意成為股東，但我猜想他們當中大多數人都是透過「心理帳戶」（mental accounting）來看待他們的股份——那是與現金收入區隔開來的「帳戶」，被分配的股票與日常預算無關，也不影響他們執行平常的工作。


    另一個關鍵的判斷基準，在於受僱管理者的目標是公司的會計績效或經濟績效。當所有者即經營者的情況下，不太可能出現高昂代理人成本的問題。但是，如果經營者是以提升每股盈餘為目的的受僱者，或是視每股盈餘為終極目標的人（仍然有一大群人如此認為），就有極高的風險產生重大的代理人成本。說得更具體一些，當管理者面臨會計盈餘或公司經濟價值的選擇時，你會希望他傾向後者。


    以下這段文字摘自安隆公司（Enron）的內部風險管理手冊，我們可視之為上述理念的對立面：'
  merge: -1
