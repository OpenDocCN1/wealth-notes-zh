  md: '# ### 重組後起飛


    1903 年 12 月 17 日，奧維爾 · 萊特（Orville Wright）創造了歷史；他操作著他的引擎裝置飛機，成功飛行長達 12 秒，跨越 120
    尺的距離（見圖表 18.1）。從此，萊特兄弟開啟了往後的各種產業，永遠改變了人類的長途旅行方式。


    ![](img/501b8eadc4f653d4e86fc862268abf1c_191_0.png)


    來源：Corbis Corporation


    萊特兄弟如何達成這個改變世界的壯舉？他們的成就靠的不是神啟，更不是在空白中忽而冒現。最貼切的說法是：第一架飛機由已知的概念和技術重新組合而來。如管理學教授安德魯
    · 哈格頓（Andrew Hargadon）所說，所有創新再現（represent）'
  merge: -1
  img_proc: true
- pgno: 192
  md: '的是跟過去的某些斷裂，同時也以過去的斷片建築而成。萊特兄弟的非凡才能在於洞察到輕汽油引擎、電纜、螺旋槳，以及白努利定理（Bernoulli''s principle）的結合能創造出一架飛行機器。


    基於各種理由，投資者對創新過程必須要有所理解。首先，我們整體的物質生活水準極度依賴創新。第二，創造性破壞（creative destruction）的過程讓各種技術及企業汰舊換新，而這一切的根源在於創新。更快捷的創新步調意味著更多公司正在經歷成功與失敗。


    # 財富從何而來？


    經濟學家保羅·羅默（Paul Romer）總愛從一個簡單的問題切入：我們怎麼會比一百年或一千年前的人更富裕？世界所有的原料，或說得更極致一些，地球的總體質量，畢竟從來沒有改變，而今天的我們必須以遠遠更龐大的人口數來分配這些物質。然而，世界的人均
    GDP 卻是一千年前的大約 30 倍，而極大比例的提升發生在最近的 150 年間（見圖表 18.2）。²


    羅默的解釋相當直接——我們逐漸學會了如何重組原料，以產生越來越大的價值。一百年前，財富主要來自於對物質資源的控制（1896 年，道瓊工業指數的十二家公司之中，有十家公司經營的是商品）；到了今天，利用原料的構想與方案成了創造財富的引擎。正如邱吉爾在六十年前所說的：未來的帝國，是思想的帝國。⁴'
