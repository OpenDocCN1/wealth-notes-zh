  md: '# 乾草堆中尋找細針


    近期《麥肯錫季刊》(McKinsey Quarterly) 一篇文章的開端即敘述了一位生物科技公司經理如何尋找有關某種蛋白質的技術性知識。在公司內部搜尋了幾個星期之後，這位經理確定了專家根本不存在。三天之後，當他在電梯裡向共事者述說他所遇到的問題時，他身邊的一位女性插話：「我的博士論文研究的就是這種蛋白質。你想要知道什麼？」1


    以高成本效益解決具體問題的能力，在知識型經濟的年代日趨重要。以製藥業為例，研究與發展的投資占銷售額的比率在過去二十年來近乎倍增；而某種藥物從研發階段到取得美國食品藥品監督管理局（FDA）認證後推出市場，大約耗資8億元。


    研發密集型公司面臨的挑戰，部分在於尋找有能力在實驗室裡解決困難問題的專家。現在，停下來想一想：如果藥品公司可以把一些棘手的研究問題拋給全世界所有具備能力的科學家，而非僅限於他們公司薪資名單內的研究人員，這將帶來什麼局面？這家公司能夠在更短的時間內解決問題嗎？或者成本得以降低？風險更低？


    2001年年中，禮來公司（Eli Lilly）的經營者嘗試回答這個問題——他們因此成立了一家新公司Innocentive（見www.innocentive.com）。2006年，Innocentive擁有接近四十家「探求者」公司，以及一個由95,000個科學家組成的「解答者」群體。探求者公司僅需要繳付會員費，就可以把他們待解的研究問題公'
