  md: '資生意之間的矛盾癥結在於這兩者實際上以不同的韻律運作。較長的投資期、低費用以及逆向操作的投資策略，對投資專業而言都是好的。反之，投資生意追求的則是短線投資，期待收取較高費用，而且樂於銷售市場要求的金融產品。


