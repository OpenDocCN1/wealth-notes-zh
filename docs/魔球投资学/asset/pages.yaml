  md: '# 謝誌 acknowledgement


    書中這些文章的原初版本，是我任職於瑞士信貸（前瑞士信貸第一波士頓）期間寫成的。我在瑞信的十多年間，管理層持續為我提供專業發展的絕佳機會；允許我發行《融會貫通的觀察者》（*The
    Consilient Observer*），即再現展現公司的開明與支持態度——這是一本非典型的刊物，提供的養分成為了《魔球投資學》（全新增訂版）（*More
    Than You Know*）的基礎。這段期間我尤其受惠於 Brady Dougan、Al Jackson、Terry Cuskley、Steve Kraus，以及
    Jim Clark。瑞信也非常慷慨地把這些作品的著作權讓渡予我。


    《融會貫通的觀察者》的編輯欄有兩個名字。另一位作者是我的研究員 Kristen Bartholdson，她在研究、編輯、數據處理以及圖表製作方面作出極大貢獻，也協助處理這個版本的材料更新。Kristen
    既聰明又有才華，與她共事是非常歡喜的經驗。


    我在美盛（Legg Mason）資產管理時期的研究員 Dan Callahan 繼續承擔 Kristen 的工作，他孜孜不倦地忙於這本書所有層面的工作。Dan
    在這本書的出版過程中扮演重要角色——他負責的工作包括兩個版本中的資料更新、圖表與文字整理，以及所有涉及的溝通事務。Dan 很機智、工作效率高，且個性爽朗。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# ACKNOWLEDGEMENT


    他非常優秀，有他成為我團隊中的一員，我欣喜萬分。


    我在美盛的所有同事都很棒，他們給了我無價的支持與配合。美盛也允許我使用受版權保護的資料。謝謝你們。


    有兩個人，在我的專業道路上深深影響著我。第一位是 Al Rappaport，我與他一起寫了《預期投資》(Expectations Investing)。Al
    教會我許多事物，至今仍不斷給我啟發，也提出許多讓我受惠的回饋。


    另一位是 Bill Miller；非常榮幸的，我們現在成為了同事。這一系列文章裡的許多想法，都是直接或間接來自於 Bill。書寫心智模型取徑如何幫助投資者，以及利用這樣的方法賺取超額報酬，是兩件完全不同的事。Bill
    兩者都做得到，因此他所得到的讚賞，皆實至名歸。


    Al 和 Bill 都慷慨撥出他們的時間，耐心給予我指導。他們是我的理想典範，跟他們在一起，我與有榮焉。


    這些文章汲取了許多優秀科學家的研究成果，無法在此一一列舉。但是，我特別要感謝幾位極具創見的科學家——Clayton Christensen、Paul DePodesta、Norman
    Johnson、Scott Page、Jim Surovyecki，以及 Duncan Watts；他們的慷慨分享，我心存感念。Steve Waite 的建議也让我受益良多。'
