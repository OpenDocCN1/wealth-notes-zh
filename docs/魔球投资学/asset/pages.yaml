  md: '第二，他們有能力依據模式比對（pattern matching）來辨識問題。專家能夠把一個已知的模式連結到特定的情境。蓋瑞·克萊恩和他的同事研究西洋棋大師級棋手及
    B 級棋手在一般規定（每步限時 135 秒）和超快棋比賽（每步限時 6 秒）中的平均棋步品質。他們發現，B 級選手在一般規定的比賽中明顯表現得較好，但是大師級選手的棋步品質無論在哪一種環境條件下都沒有顯著差異（見圖表
    16.1）。大師級棋手對著棋盤瞥一眼，就能看出模式，然後瞬間決定了好的棋步。8


    自然決策的第三個行為特徵是類推的思維模式。專家能夠在表面相異的情境裡解讀出相似性。


