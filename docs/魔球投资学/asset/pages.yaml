  md: '# 14 小心行為財務學


    # ——誤用行為財務學可得出荒謬結論


    個體行動的優化往往是為了產生競爭均衡（competitive equilibria）；然而，真實的經濟體系要達致近乎均衡的狀態，個體優化是非必要的。人類無法在複雜任務中優化行為，我們不需要因此而推斷源自競爭模型的均衡概念不適用於此。我們證明了，在複雜經濟系統裡，即使對個體行為做出種種極其薄弱的假設，系統仍然可以達致這樣的均衡。


    ——安東尼．博希－多明尼克（Antoni Bosch-Domenech）

    和希亞．姆桑德（Shyam Sunder），

    〈追蹤隱形的手〉（Tracking the Invisible Hand）


    經濟學怎麼可能無關行為呢？如果不是行為學，那會是什麼鬼東西？


    ——查理．蒙格，《誤判心理學》

    （Psychology of Misjudgment）


    # 拙劣的三段論


    古典經濟學理論假設所有人的偏好一致，對所有選項都具備完整認知，並且了解決策的後果。一言以蔽之，人類行為是理性的。沒有人相信這種如田園詩般美好的狀態真實存在。實際上，'
  merge: -1
  img_proc: true
- pgno: 155
  md: '大量的實證研究與軼事證據顯示人類並非純然理性。理論與現實之間的落差衍生了一個相對新穎的領域：行為財務學。¹ 行為財務學的研究者試圖跨越古典經濟學與心理學之間的鴻溝，解釋人和市場的行為模式，以及行為背後的原因。


    行為財務學提出一些對投資者而言相當重要的議題。第一，每當非理性市場行為出現時，是否可能有意識地加以利用而獲利？另一個問題是：投資者該如何避免做出次優的決策？我們該如何決策，以及我們真實的決策方式，兩者總有差異，而我們的目標就是彌補當中落差。²


    毋庸置疑，行為財務學對精明投資者而言很重要。但是，行為財務學這把大傘底下有時候暗藏著一些拙劣的想法，甚至可能來自這個領域裡的專家。誤用行為財務學的概念所引發的問題，可能就像忽略心理學在投資世界裡的作用一樣嚴重。


    問題是什麼呢？以下的三段論說明了這些拙劣想法的本質：


    +   - 人非理性

    - 市場由人所構成

    - 市場非理性


    這一串邏輯推演看似得出行為財務學的其中一項重要結論。著名的行為財務學家赫什·舍夫林（Hersh Shefrin）寫道：「行為財務學假設經驗法則謬誤（heuristic-driven
    bias）與框架效應（framing effect）導致市場價格有別於基本面價值。」³ 這樣的說'
  merge: -1
  img_proc: true
- pgno: 156
  md: '法傳達了一個簡單（而且某程度而言相當直觀）的訊息：非理性個體的聚合必定導致非理性的市場。


    要看到這個立論的不足之處，我們必須在兩個不同的層次上看待投資者行為——個體層次與集體層次。集體行為解釋了群眾可能出現的非理性行動。個體行為則說明我們每個人都一貫地跌入各種心理陷阱，包括過度自信、定錨與調整（anchoring
    and adjustment）的思考路徑、不適當的框架（framing）、不理性的承諾續擴（commitment escalation），以及確認陷阱（confirmation
    trap）。


    我想說的是：即使投資者在個體層次上非理性，市場仍可能理性。$^{4}$充分的投資者多樣性是有效價格形成的必要元素。只要投資的決策規則各不相同，即使當中不乏次優的決策，錯誤都會傾向於相互抵消，讓市場處在適當價格。同樣的，這些決策規則的多樣性一旦消失，市場就會變得脆弱，易於失去效率。


    所以，問題不在於個體是否做出非理性行為（他們確實如此），而是在於他們的非理性是否形式一致且同時發生。因此，了解個體行為的陷阱或許可能改善你的個人決策，但是，掌握集體動態也是擊敗市場的關鍵所在。行為財務學的狂熱份子往往無法區分個體和集體的層次。


    # 吃力不討好的工作？


    行為財務學專家了解多樣性在價格形成中的作用，如安德'
  merge: -1
  img_proc: true
- pgno: 157
  md: '烈·施萊費爾（Andrei Shleifer）在他的優秀著作《無效率市場：行為財務學入門》(*Inefficient Markets: An Introduction
    to Behavioral Finance*)一書中所寫的：


    > 效率市場假說是否有效，仰賴的不是投資者的理性。在許多情況下，投資者並非全然理性，但市場仍然被預測有效率。例如，非理性投資者隨機交易，這是其中一種常被提及的狀況。如果市場裡出現大量這類投資者，而他們的投資策略又彼此不相關，那麼他們的交易很可能相互抵銷。在這樣的市場裡，價格接近於基本面價值。


    問題是，這種投資者的多樣性在行為財務學看來是特例，而非常態。施萊費爾接著說：「這個論點得以成立的關鍵條件，在於非理性投資者的策略缺乏相關；正因為如此，這個論點有其侷限。」
    $ ^{5} $


    施萊費爾最後還指出，套利作為另一種讓價格與價值一致的手段是相當高風險的，因此在真實世界中受到節制。總而言之：投資者非理性，而且他們的策略只有在極少數情況下是不相關的，因此市場無效率。再者，套利不足以讓市場恢復效率。所以，市場無效率是常態，效率才是特例。因此，在一個本質上無效率的市場，積極的投資組合管理根本就是吃力不討好的工作。


    我們猜想，大部分專業人士都覺得效率是常態，而無效率是例外。事實上，我們發現多樣性的個體在許多複雜系統中都產生了有效率的結果。在各類例子裡，集體的表現皆優於個體的平均'
  merge: -1
  img_proc: true
- pgno: 158
  md: '表現。一般來說，一個完整的投資者生態足以確保任何能夠擊敗市場的系統性手法都不可能存在。多樣性是默認的預設，而多樣性崩潰是值得關注（且具有獲利潛力）的例外。


    # 炸彈落下


    一場異乎尋常的搜尋行動成為了集體力量的有趣實例。1966年 1 月 17 日，一架 B-52 轟炸機飛過西班牙海岸線時與空中加油機碰撞。轟炸機載著四顆核彈，其中三顆掉下後立即被找到。然而，第四顆核彈消失在地中海，美國國家安全署必須迅速找回核彈。


    美國國防部助理部長傑克·霍華（Jack Howard）委派一位年輕的海軍軍官約翰·克拉文（John Craven）搜尋炸彈。克拉文聚集了一群背景各不相同的專家，然後開了一個拉斯維加斯式的賭局，邀請專家們就核彈可能的落地點下賭注。克拉文把賭注運算成機率，模擬這群專家的預測方法和他們設想的情景，於是不久後就找到了核彈。沒有任何一個專家有答案，但是，匯集了他們的想法，答案就出來了。


    社會性昆蟲如螞蟻和蜜蜂群體擁有解決問題的能力，包括獲取食物和找到新窩巢；多樣性也是這方面能力的根本特徵。許多例證說明人類組成的系統也是如此；傑克·特雷諾（Jack
    Treynor）著名的雷根糖實驗即是一例。特雷諾裝滿一罐子的糖果，然後請金融學課堂上的學生猜測裡面的糖果數量。他發現了一致的現'
  merge: -1
  img_proc: true
- pgno: 159
  md: '象——學生預測的平均值往往是真實數量的理想估值，而且也比絕大部分的個人估算更準確。⁷


    既然我們已經對人類的次優行為有所理解，所以關鍵問題在於：投資者是否具備充分的多樣性以產生效率。如果慮及不同面向，包括資訊來源、投資方法（技術分析或基本面分析）、投資風格（價值型或成長型）以及投資期（長線或短線），你就會了解為什麼就股票市場的正常運作而言，多樣性是相當充分的。


    # 💸 錢跟著羊群走


    多樣性促成效率市場，同樣的，多樣性崩潰導致市場面臨效率衰退的影響。更直接地說，從行為財務學的角度，集體層次才是尋找投資機會的正確方向。⁸


    從眾行為是好例子。當許多投資者放棄自己的知識判斷並且透過觀察他人而做出相同的選擇時，就出現了從眾現象。⁹ 市場總會進入這樣的時期——某種群情主導著市場走勢。這類多樣性崩潰導致市場暴漲（人人看多）與暴跌（人人看空）。


    就我的知識所及，沒有任何指標能準確且一致地測量投資者的多樣性。客觀評估公共意見（媒體）與個人意見，或許可以為我們提供一些線索。逆向投資策略的成功關鍵在於掌握多數人而非少數人的愚蠢荒唐。'
