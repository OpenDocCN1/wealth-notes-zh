- pgno: 71
  md: '但是，股票價格變化並非依循常態分布，而我們對於風險與不確定性、市場時機，以及資金管理的觀念必須因此而改變。更具體來說，股價變化的分布顯現高峰度（Kurtosis）——與常態分布比較，平均值更高、尾部更肥。（我們可以用說，市場變化仍然展現某種分布形態度，只不過那不是常態分布。）要了解市場長期報酬率的特性，這些離群值特別值得關注。


    為了說明這一點，我引用 1978 年 1 月 3 日至 2007 年 3 月 30 日的 S&P 500 指數每日價格變化的資料。該指數在這個期間的年報酬率（不計入股息）是
    9.5%。然而，我從這個樣本（超過 7000 天）剔除了表現最差的 50 天，以及表現最好的 50 天。如果你能夠避開那最糟的 50 天，你的年報酬率會從
    10% 左右變成 18.2%。如果錯失了那最好的 50 天，年報酬則只剩下 0.6%。


    這個分析或許引人注目，但欠缺參照點。為了給予更完整的脈絡，我從真實的數據計算出平均值與標準差，然後利用這兩個統計值來產生一個大小與特徵相等的隨機樣本。當我從這個新樣本中剔除最壞的
    50 天之後，報酬率為 15.2%（相對於真實數據中的 18.2%）。同樣的，當我剔除最好的 50 天之後，報酬率為 3.5%，明顯高於真實數據的報酬率。


    簡言之，這個分析讓我們看到，極端報酬率對於市場總體報酬的顯著作用，遠大於常態分布所預示的。這也強烈否定了「適時進出市場」（market timing）策略，除非投資者有方法可系統性地預測極端報酬的天數。'
