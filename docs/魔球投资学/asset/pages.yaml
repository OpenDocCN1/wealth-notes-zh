  md: '# 3 貝比·魯斯效應

    ——期望值的頻率與數值


    > 在真實世界裡，沒有任何「捷徑」可保證獲利。

    我們寧可明智行事而輸錢，也不要愚昧行事而贏錢；

    我們至少還能理性地認知這一點，實在值得欣慰。


    ——理查·愛普斯坦（Richard A. Epstein），《博弈理論與統計邏輯》（*The Theory of Gambling and Statistical
    Logic*）


    # ## 貝比的打擊率


    到證券行去閒逛，早會有人在你耳邊說出這樣一句聽起來頭頭是道的話：「嘿，只要我有51%的時間是對的，我就翻身了。」如果你也覺得這個說法貌似合理，請繼續讀下去——你即將了解其中一項最重要的投資觀念。


    以上說法認為投資者正確的次數必須大於錯誤的次數，這是極為普遍的觀點，而且符合我們的直覺。以下這位投資組合經理的故事，直指當中謬誤。


    這位投資者說，他是某家公司大約二十位投資組合經理中的其中一員。該公司的財務主管對這些經理的整體績效感到驚愕，於是決定評估個別經理的投資決策過程，以淘汰表現不理想的人。財務主管知道，即使是隨機的投資決策也有可能讓投資組合中的大約一半標的表现優於市場基準；因此他以每一個投資組合'
  merge: -1
  img_proc: true
- pgno: 51
  md: '當中有多少百分比的股票跑贏市場來評估該組合的績效。


    這位投資組合經理發現自己處在一個異於尋常的境況：他的總體投資績效是所有經理之中的佼佼者，但是他的投資組合之中表現優於市場的股票百分比則糟透了。財務主管立即開除了其他所有表現「差勁」的經理，並且與這位處境矛盾的投資者見面商談，試圖搞懂他的高績效與低打擊率之間的巨大落差。


    這位投資組合經理的答案，對任何涉及機率操作的領域而言都是貼切的重要提示：重要的不是正確性的頻率，而是正確性的數值。假設你持有四支股票，其中三支下跌少許，第四支則大幅上漲；即使當中大部分股票下跌，但這個投資組合的績效仍然理想。


    要建立一個績效優異的投資組合，就必須以期望值分析（expected value analysis）來評估每一項投資。更值得注意的是，各個不同的領域包括賭馬、賭場賭博、投資等等的善思者都強調這一點。¹
    我們稱之為貝比·魯斯效應（Babe Ruth effect）——雖然魯斯被三振的次數很高，但依然是美國職棒史上最強打者之一。


    這一堂關於期望值的課是普世皆準的，因為所有機率操作都具備相同的特徵。然而，這個觀點卻不容易被內化，因為這根本違反人類天性。要指出該位財務主官的邏輯有何錯漏並不難，但我們其實也很容易認同他的想法。'
