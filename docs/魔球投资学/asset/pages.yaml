  md: '.解釋之上。市場裡的許多大動作其實都不容易解釋。


    # 拉普拉斯妖魔


    兩百年前，決定論開始統治科學。受到牛頓的啟發，大多數科學家難抱機械宇宙（clockwork universe）的概念。法國數學家皮耶-西蒙·拉普拉斯（Pierre-Simon
    Laplace）的著作《機率哲學論》( A Philosophical Essay on Probabilities) 裡有以下的著名段落，充分體現了機械宇宙的思維：


    假若一位智者在任何一個當下都能知悉所有賦予自然界生命的力量，以及所有組成自然之物體相互存在的位置，而假若這位智者的力量足夠巨大，對他所擁有的資料進行分析，則宇宙裡最龐大物體到最微小原子的運動皆可包含在一道簡單的公式裡——對這位智者而言，沒有任何事物是不確定的，而且未來就像過去一樣展現在他的眼前。


    現在的哲學家和科學家稱這位「智者」為拉普拉斯妖魔（Laplace’s demon）。透過精確計算而掌握過去、現在與未來，這樣的想法無論在過去或現在都如此誘惑人心，因為這確實呼應我們的因果偏見。


    但是，複雜適應系統不適用這種簡單的計算。許多複雜系統處於自組織臨界性的狀態。「自組織」意味著沒有領袖。系統呈現自眾多個體之間的互動。「臨界性」則說明了非線性的特徵。更具體而言，系統內部擾亂（因）的幅度並非總是與其結果成比'
  merge: -1
  img_proc: true
- pgno: 330
  md: '例。微小擾亂可能導致巨大結果，反之亦然。


    沙堆的比喻充分表達了這個概念。想像沙子落在平面上形成沙堆。開始時，狀態無異，沙子的運動符合基本的物理法則。但是，一旦沙堆形成一定的高度與斜度之後，便進入一種自組織的臨界狀態。這時候，即使在沙堆上添加少量沙子，也可能造成或小或大的崩塌——崩塌的規模不一定跟沙子的量呈相等比例。


    把沙子替換為資訊，這個比喻就更貼近投資者了。有時候，某件資訊幾乎不會對市場造成影響；但是，在特定時刻類似的資訊卻驅動市場的大幅度效應。資訊階流的模型有助於我們洞悉為何會發生這種現象。$
    ^{5} $


    # 解釋市場


    人們亟欲把因果迴路跟無法輕易解釋的股市走勢拉攏在一起，這種傾向往往會引出一些愚蠢的事後諸葛。研究者取 S&P 500 指數自 1941 年至 1987 年五十次最大幅度的單日價格變化，檢視媒體如何報導這些市場變化的成因（見圖表
    34.1）。他們總結局，多達半數的股價變化事件都不是由公司基本面相關新聞引發的。他們寫道：


    > 在大多數收益不錯的交易日，媒體報導市場走勢成因所用的資訊，都不是特別重要的事。媒體的後續報導也無法揭示任何有力的論據來解釋未來利潤或貼現率的可能改變。$
    ^{6} $'
