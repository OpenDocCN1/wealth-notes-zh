  md: '# ### 28 心智多樣性

    ——迎向成功投資的組織思維


    你讀得越多，


    你就知道越多，


    你學習得越多，


    你就會到達越多的地方。


    > ——蘇斯博士（Dr. Seuss），《我閉著眼睛都能讀書》

    （*I Can Read With My Eyes Shut!*）


    # 螞蟻的腦袋


    2000 年秋天，我聚集了一小群領導業界的投資者，一起聆聽多位來自金融、策略以及商業領域的傑出人物發表他們的演說。所有演講者都極為精彩，但仍然稱不上是最令人振奮的演說——「最令人振奮的演說」這頂殊榮後來歸於洛斯阿拉莫斯國家實驗室（Los
    Alamos National Laboratory）的科學家諾曼·強森（Norman Johnson）。強森劈頭便以似乎預示著不祥的語氣說了這段話：「我被邀請在這裡談論專家到底出了什麼問題——而我可是這方面的專家；但今天的討論針對的是金融領域的專家，而這是幾乎我一無所知的領域。」$^{1}$


    強森到底說了什麼，以致在座的精明投資者都傾身聆聽？簡'
  merge: -1
  img_proc: true
- pgno: 281
  md: '單地說，強森證明了一群異質的「普通人」如何共同行動，最終表現出優于專家的解決問題能力。強森透過社會性昆蟲如螞蟻和蜜蜂的行爲來說明他的論點——讓聽者在他們的想像裡閃現火花的，即是這些昆蟲不可思議的行爲表現。


    強森的演說大部分觸及的是宏觀層次，也就是集體如何解決問題。這跟市場形成效率的原理顯然相關。 2 我在此著眼的是微觀的層次，即**作為個體**的投資者該如何組織以獲取成功。雖然分析單位不一樣，但傳達的概念卻是一致的：多樣化的資訊與觀點有助於改良投資績效。


    現在，仔細思考一下你的資訊來源。你是否日復一日閱讀同一份報紙、跟相同的人說話，並且評論同類型的研究報告？或者，你總會停下腳步以迎接新冒出的想法，即使這麼做有可能讓你陷入思考僵局而白白浪費時間？強力的證據顯示，不僅在投資的領域，許多其他方面的導先思考者都受益於多樣性的資訊輸入。


    # 讓人驚異的迷宮探險


    進行有關個體的詳盡討論之前，我想要先指出多樣性如何產生更理想的答案，而欠缺多樣性又如何導致效率匱乏。強森利用迷宮來證明集體如何優於平均個體：


    +   • 首先，他請一群能力相當的個體來解開迷宮。這些個體對問題並沒有全面的感知，他們就只能一味探索直到獲得解決方法。'
  merge: -1
  img_proc: true
- pgno: 282
  md: '+   • 之後，他請這些個體再次解開迷宮。他們利用之前習得的資訊，普遍上表現進步。


    +   • 最後，他將每個個體的經驗建構成一個線性組合，並且使用相同的規則來找出一個集體方案。


    # 圖表 28.1 集體擊敗個體


    圖表中的插圖是示範迷宮。主圖顯示貢獻的個體數增加對集體方案所造成的影響；圖表同時採用兩組隨機號碼。集體方案中的步數，經每個個體貢獻予集體方案的平均步數常態化。


    ![](img/501b8eadc4f653d4e86fc862268abf1c_282_0.png)


    來源：Norman L. Johnson，見 http://www.ishi.lanl.gov/symintcl.html


    因為每個個體的初始搜索都是隨機的，所有個體聚合起來便反映了多樣的經驗（迷宮區域）、偏好（偏愛路徑），以及績效（路徑長度）。³ 所以，集體其實就等於一個擁有超級資訊的個'
  merge: -1
  img_proc: true
- pgno: 283
  md: '體。由於擁有多樣的資訊，集體方案遠比平均個體的方案來得更穩健（見圖表 28.1）。


    這種強大的集體效益一直都存在於自然界；所以強森才會敘述螞蟻的故事。螞蟻怎麼做？搜尋食物的螞蟻離開蟻窩時只想著一件事：把找到的食物帶回蟻窩。牠們能夠沿路分泌化學物質，也能夠循著其他螞蟻留下的化學物質前進。開始時，牠們隨機散開。當某隻螞蟻找到食物後，牠會在走回蟻窩的路上留下化學物質讓夥伴跟隨牠的足跡。研究證明這個過程讓螞蟻始終如一地找到蟻窩和食物之間的最短距離。⁴


    研究者了解了這樣的集體能力之後，決定對螞蟻施以詭計。在一個受控制的環境裡，科學家把食物放置在兩個跟蟻窩距離相等的地點。結果，蟻群只使用其中一條路徑，儘管牠們是隨機選擇的。為什麼呢？因為牠們循著化學物質移動，越多螞蟻走上同一條路，便吸引更多螞蟻走上一樣的路，因而啟動了正向回饋。所以，螞蟻最終並沒有尋找最優化的方案，而是擠在同一條路徑而不理會另一條長度相等的路徑。


    神奇的是，大自然也早就料到這個問題。我們最終發現，蟻群會週期性地脫離主要路徑，然後再次啟動隨機的搜尋過程。蟻群利用已知的食物來源，同時也探索新的食物源頭；而螞蟻已「被設定」在這兩者之間取得平衡（見圖表
    28.2）。強森稱之為「始料不及」的選項。螞蟻的基因促使牠們尋找多樣性。'
