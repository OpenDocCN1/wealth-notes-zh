  md: '# 4 拋棄屬性為本的理論

    ——情境式分類法的重要性


    管理學的陳詞濫調與流行總是來去一時，原因之一在於這些說辭通常不是立基於嚴謹的歸類法。各式論調被視為一體適用的因果陳述。因此，經理人一顆狂熱地追隨那些看似理想的論點，然而，一旦依據該論點的行動無法產生預期的結果時，他們就會放棄。「那不管用。」他們總是得出這個結論——但事實往往是，這一套說辭僅適用於某些（未闡明的）情境，但不適用於其他情況。


    ——克雷頓·克里斯汀生（Clayton Christensen）保罗·卡莱尔（Paul Carlie）和大衛·桑德爾（David Sundahl），《理論建構的過程》（The
    Process of Theory-Building）


    # 情境與屬性


    走在蔭涼潮濕的森林裡會看到黏菌，你或許以為這些令人厭惡的小東西並不難分類。但你錯了。因為黏菌這種生物有一些怪異的行為——真的非常怪異，以至困擾了科學家數百年。


    當食物充足時，黏菌以獨立的單細胞生物生存。牠們四處移動、吞嚥細菌，並且分裂增殖。食物短缺時，黏菌細胞會黏在一起形成一整團由成千上萬個細胞組成的生物體。黏菌細胞也就真的停止單獨行動，轉而集體行動。這就是黏菌很難被分類的原因'
  merge: -1
  img_proc: true
- pgno: 60
  md: '因：「牠」或「他們」，取決於情境。¹


    單純考慮屬性而無視於情境的投資取徑，也是不合理的。有時候，看起來昂貴的股票其實很便宜，看似便宜的則很貴；這完全取決於情境脈絡。


    然而，投資顧問往往鼓勵，甚至強迫大部分專業投資人陳述一套以屬性為基礎的投資方法，然後貫徹始終。這場遊戲的玩法相當直接。成長型投資者試圖擊敗市場的方法，就是把那些正在迅速提升銷售與獲利的公司網羅進他們的投資組合裡，而且對企業估值沒有多加思考。價值型投資者則尋找獲利理想但股價便宜的企業，成長對他們而言是意外收穫。


    排除組織或外在的約束，大部分基金經理其實都相信他們那套基於屬性的投資模式，認為只要配合他們的技術，就能帶來擊敗市場的投資績效。² 這種種投資取徑都立基於某個理論——這個理論相信投資者的行動終將帶來令人滿意的結果。


    然而，「理論」（theory）一詞讓大多數投資者和企業管理者心有疑慮，因為他們總是由此聯想到理論上的假設（theoretical），也就是意味著不切實際。但是，如果你將理論定義成因果關係的相應解釋，那可是非常實際的。嚴謹的理論有助於我們在大量不同的情境之下預測行動或事件將如何引發特定結果。³


    這裡的重點是：大部分投資理論都是不嚴謹的，因為依據的是不理想的範疇。大部分管理學理論也相去不遠。⁴ 更具體地'
  merge: -1
  img_proc: true
- pgno: 61
  md: '說，投資者通常考慮的是以屬性為基礎的範疇（例如偏低的企業估值倍數），或是以情境為基礎的範疇。從屬性範疇到情境範疇的思維轉移，對投資者和基金經理皆大有助益。黏菌為我們上了一課。


    # # 理論建構的三大階段


    克雷頓·克里斯汀生（Clayton Christensen）、保羅·卡爾爾（Paul Carliie）和大衛·桑德爾（David Sundahl）在一篇引人深思的文章裡，把理論建構的過程分解成三個階段（見圖表4.1）。我將分別論述這幾個階段，並且提供一些視角，闡述一般的理論建構過程如何具體應用至投資工作之中：


    （一）以文字和數字來描述你想要理解的事物：這個階段的目標在於仔細觀察、敘述、估量某個現象，而這個現象必須是特定主題後來的研究者也會認同的現象。


    股市表現就是一個例子，這是一個需要好的理論來解釋的現象。現今對市場的描述方式對我們而言似乎理所當然；但是，一直到1961年，針對所有股票走勢的全面性研究才首次以論文發表。芝加哥大學教授勞倫斯·費雪（Lawrence
    Fisher）和詹姆斯·羅瑞（James Lorie）在該研究論文中揭示：1926年至1960年期間股票的報酬率大約9%。彼得·伯恩斯坦（Peter Bernstein）說這篇文章是「震驚」學界與業界的「炸彈」——對市場的描述本身即足以攪動金融與投資的世界。5'
  merge: -1
  img_proc: true
- pgno: 62
  md: '（二）依相似性為現象進行分類：分類簡化了我們的世界，讓一切變得有組織，並且釐清了各種現象之間的差異。例如，物理學將物質分類為固體、液體和氣體。在創新研究的領域裡，也就是克里斯汀丁生的專長，分類項目則是維持性創新（sustaining
    innovation）和破壞性創新（disruptive innovation）。


    投資領域有許多不同的分類方式，包括價值型和成長型股票、高風險和低風險、小型股和大型股。這些分類法在投資世界裡根深蒂固，許多投資公司和他們的金融產品都以此為基礎。


    （三）建構一個可以解釋現象行為的理論：立基於嚴謹分類的穩健理論可解釋因果關係，說明因與果為何作用，以及最關鍵的，因與果在何種情境下作用。重要的是，理論必須具備可否證性。


    投資圈充斥著各種關於投資報酬的理論。效率市場理論的擁護者認為沒有任何策略能夠產生優異的風險調整後報酬。主動型基金的經理採用各式各樣的策略，其中有许多依循著特定的投資風格箱（style
    boxes）；根據所採納的理論，他們所採取的行動將帶來豐厚回報。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '圖表 4.1 理論建構過程


    ![](img/501b8eadc4f653d4e86fc862268abf1c_63_0.png)


    式研究設計：現象中的現象


    來源：Christensen, Carlile, and Sundahl, “The Process of Theory-Building.”經許可引用。


    理論如何改進？一旦研究者發展出理論，他們便開始使用這套理論在不同情境下進行預測。過程中他們往往會遇到異例，或者得到背離理論的結果（見圖表 4.1 的右側）。異例迫使研究者重新檢視之前的描述與分類階段。目標是為了讓針對該現象的解釋比之前的理論更為精確與透徹。適當的理論建構要求研究者一再經歷各階段的循環，以便讓理論的預測能力逐漸提升。


    理論必須是可以被否證的，這一點對經濟學家而言是個挑戰，因為有不少經濟學構想在其定義中即假設了某個答案。其中一個例子是「效用最大化」理論，聲稱個體依據效用最大化的心'
  merge: -1
  img_proc: true
- pgno: 64
  md: '態行動。但是，我們可以任意定義「效用」以符合結果，因此無法否認這個構想。


    金融學的另一個例子是資本資產定價模型（Capital Asset Pricing Model，CAPM）。經濟學家利用 CAPM 來測試市場效率，而 CAPM
    本身卻已預設了市場效率。據著名金融經濟學家理查·羅爾（Richard Roll）所言，任何針對 CAPM 的測試：「其實都是一併測試 CAPM 和效率市場假說」。克里斯汀生等人認為，不少經濟學核心概念應該被標示為「構想」而非「理論」，因為這些概念無法被直接否認。


    當然，並不是所有研究者都會堅持改善理論。許多人發展出一套理論後，只要能證明該理論並非錯誤就滿意了。管理顧問所祭出的大部分建議都是基於這類理論。例如，某些顧問可能聲稱「外包是好的」，然後找來幾個事例來「證實」他們的理論。研究者沒有反覆經歷描述／分類／理論優化的過程來改良理論，因此這樣的理論並不完全具備穩健性——在紙上看來似乎不錯，卻無法付諸實行。


    # ### 重點不在屬性，而在任何適用


    克里斯汀生等人所帶給我們最重要的訊息或許就是：適當的分類是好理論的必備條件。更具體而言，理論在其優化過程中，會從屬性式分類演化到情境式分類。以情境分類為基礎的理論告訴執行者不同情況之下應該做的事。相反的，以屬性分類為基礎'
  merge: -1
  img_proc: true
- pgno: 65
  md: '的理論則依據現象的特徵來推斷適當的行動。


    這一點對投資者而言是非常重要的，因為投資者往往過於依賴屬性分類。其中一個例子是低成本益比投資，這往往是價值投資理論的核心支柱。過去 125 年來，利用本益比作為工具來決定進場（低本益比）和退場（高本益比）時機的投資者，得到的是糟糕的結果。⁸這並不是意味著低本益比是不好的，而是說，趁低本益比買進股票並不是產生長期豐厚回報的有效理論。


    事實上，觀察者往往將成功投資人的策略描述成折衷主義式的方法。或許比較精確的說法是，他們的方式是基於情境，而非基於屬性的。美盛價值信託基金（Legg Mason
    Value Trust）的管理人比爾·米勒（Bill Miller）就是很好的例子，他是過去四十年來唯一連續十五年擊敗 S&P 500 的基金經理。米勒確實以情境為基礎，但是他卻常常因為違背以屬性為依據的思維路徑而遭受批評。


    美盛價值信託基金的投資組合不太能符合你對於價值型基金的預期，也就是低淨值比與低本益比。根據基金評級機構晨星公司（Morningstar），該基金投資組合在
    1999 年年底的淨值比，比價值型基金的平均值高出 178%，本益比則高出 45%。⁹


    不管有意或無意，所有投資者都使用理論。理論建構過程讓我們得知，嚴謹的理論必須反映脈絡。太多投資者緊貼著以屬性為依據的取徑，當市場走勢跟他們認為應該出現的走勢不符時，'
