  md: '手——其實是思考流感如何蔓延。這裡有兩個關鍵點，都很直觀。第一點是傳染力——思想是否易於擴散。第二點則是交感程度——人與人之間接觸互動的頻率。如果流感病毒具有強大傳染力，但感染者不與人互動，則病毒不會傳染。如果人際互動頻繁但病毒沒有傳染力，流感也不會蔓延開來。但是，人際互動和傳染力兩大因素一旦結合，流感疫情就會爆發。2


    所以，思想和疾病傳播的曲線圖是一樣的，兩者都是 S 曲線（見圖表 37.1）。生物學與商業世界互相類似，這並不意外。我們可以把易感性或傳染力理解為思想開始被採納的臨界點。我們也可以利用「小世界」框架來建構互動程度的模型。


