  md: '# **投資是專業，還是一門生意？——如何擊敗大盤指數**


    我開始自忖著該如何說服那些經營大型投資管理機構的生意人，讓他們了解這專業最優先且必要的事在於保護其關鍵核心，也就是投資作為一種專業所涵蓋的傳統操守。


    ——查爾斯·艾利斯（Charles D. Ellis），〈事業成功會不會損害投資管理的專業？〉（Will Business Success Spoil the
    Investment Management Profession?）


    這似乎是人類的某種執迷，總愛把簡單的事情複雜化。而且以後似乎還是會這樣。船隻將圍繞地球航行，但「地平說學會」（Flat Earth Society）也將與旺健壯。


    ——華倫·巴菲特（Warren Buffett），〈超級投資人〉（The Superinvestors of Graham-and-Dodsville）


    # **偵察報告**


    為了贏得比賽，大部分球隊都會偵察對手，以期制定出能夠利用對手弱點且抵銷對手強項的比賽計畫。球隊通常認為智巧的偵察行動攸關長期成敗。


    那麼，基金經理的對手又是誰呢？帶著特定目標入場的投資'
  merge: -1
  img_proc: true
- pgno: 40
  md: '者，通常可以選擇投資主動型基金或指數型基金。例如，想要投資大型股票的投資者，可以將資金托於大型資本的主動型基金管理人，或者買入某個追蹤 S&P 500
    的指數型基金。


    我們可以把相關指數的投資報酬視為投資者的機會成本，同時也是資本成本；因此，擊敗此市場基準即成了主動型基金經理的績效衡量。


    那麼，主動型基金經理在這場競賽中的表現如何？並不理想。過去五年來，指數的表現優於 40% 以上的主動型基金；若把時間延長至十年，則超過一半的主動型基金的績效落後於基準指數。而且，長久以來皆維持著這樣的狀況。¹
    既然指數表現得這麼好，我們或許可以為指數進行偵察，看看這個對手如何競爭。


    股權基金最常使用的基準是 S&P 500 指數。S&P 指數委員會以五大準則選取指數的成分股。以下列出五大準則——這也就是 S&P 500 指數得以年復一年擊敗大部分主動型基金經理的策略核心所在。


    （一）流動性：委員會要創造的是一個「可投資」的指標，因此選擇的股票必須具備足夠的流動性（每月交易量相對於外流通量的比率必須高於 0.3），以及足夠的公開流通量。


    （二）基本面分析：企業獲利能力的準則是「四個季度的正值營運淨收益」。就只是這樣。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '（三）市值：公司市值必須超過 40 億美元。「美國領導產業中的領導企業，這是納入 S&P 500 指數的指導性原則。」


    （四）領域代表性：委員會試圖讓指數成分股中各領域的比重相當於整體（所有市值超過 40 億的合格企業）的領域比重。委員會通常會為比重不足的產業領域加入更多公司，而不是從比重過高的產業中剔除企業。


    （五）欠缺代表性：S&P 如此定義欠缺代表性的公司：「如果這是今天創制的指數，這家公司將因為無法符合以上其中一項或多項準則而不予納入。」過去七十五年來被剔除的一千多家公司當中，絕大部分是因為併購所致。


    我們針對 S&P 500 的偵察報告或許也揭露了以下事項：委員會不做宏觀經濟預測、以低基金週轉率做長線投資，並且不受領域或產業別、部位比重、投資風格參數或績效壓力所限制。還有關鍵的一點：指數型基金以非常低的成本密切追蹤
    S&P 500 指數。


    # 贏家評比


    部分主動管理型基金確實表現超越基準指數，甚至長時間領先。這些成功的基金經理是如何做到的？為了嘗試得出典型化的解答，我們篩選出截至 2006 年的十年期間表現超越
    S&P 500 指數的股權基金；這些基金背後都有一 位基金經理，而且管理資產超過 10 億美元（見圖表 2.1）。'
