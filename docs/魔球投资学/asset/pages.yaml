  md: '如果展望理論確實解釋了投資者的行為，則某一支股票（或投資組合）的上漲機率以及投資評估週期便成了首要因素。我要闡述的，就是跟這兩大變數有關的投資原則。


    # 股權風險溢酬的解釋


    金融世界裡最大的謎團之一是：在各別資產類別的相應風險之下，為什麼股權報酬長期而言遠遠高於固定收益證券的報酬？從 1900 年至 2006 年，美國股票相較於美國國庫券的年收益（幾何報酬率），達到
    5.7%的溢酬。世界上其他發達國家也出現相似的結果。${}^{4}$


    施羅莫·本納茨（Shlomo Benartzi）和理察·塞勒（Richard Thaler）在 1995 年一篇極具創見的論文中發表他們稱之為「短視損失規避」（myopic
    loss aversion）的概念，以此為股權風險溢酬之謎提出解釋。他們的論點以兩大概念為支點：${}^{5}$


    （一）損失規避：我們面對虧損的懊悔程度比面對同等規模收益的喜悅強大 2 至 2.5 倍。股市價格通常被當作參照架構，因此虧損或獲益的機率也就成了重點。在金融市場裡，持有期越長，獲得正向報酬的機率自然就越高。（金融市場必須具備正向的期望報酬率以吸引資金，因為投資者必須為此放棄當前消費。）


    （二）短視：我們對投資組合的評估頻率越高，就越有可能看到虧損，並且因「損失規避」的傾向而苦惱。相反的，投資者'
