    來源：Sente Corporation


    4. 尋求微小的優勢：你以表面上看來並不起眼的優勢參賽——也就是說，你收著一些你的對手沒發現或不予理會的優勢，甚至讓他想著：「儘管來啊，有什麼了不起的。」那可能是更好一點點的棋陣，或者讓國王的位置更安全一點點。就是那麼一點點。那些所有的「一點點」分開來看並沒什麼了不起，但把七、八個這種小優勢集合起來，你就掌控全局了。'
  merge: -1
