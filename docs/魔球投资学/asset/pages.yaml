    # 擦鞋啟示錄


    在我過去的辦公室大樓，有一家鞋店在櫥窗上打出免費擦鞋服務的廣告。我經過這家店數十次，都不以為意。有一天，我的皮鞋有點磨損，而且也剛好有空，於是便決定進去接受這樣的小禮。


    結束後，我掏出小費給擦鞋匠。他拒收，還跟我說：免費就是免費。我從椅子上下來，心懷感激。我心裡想著：「這個人幫'
