  md: '個國家，銷售額都在 5 億美元之上。


    祖克設下三道門檻：


    +   • 真實銷售成長率（經通貨膨脹率調整）為 5.5%。


    +   • 真實盈餘成長率為 5.5%。


    +   • 股東總體報酬高於資本成本。


    顯然，這些目標都不及大部分策略計畫所設定的。事實上，貝恩公司發現研究樣本中有三分之二的公司在其計畫中設定了二位數的名目成長率為目標。


