  md: '巴菲特強調，市場先生其實並不介意你忽視他，所以你不应該陷入他的影響之中。這裡要傳達的訊息是：價格和價值可能相互背離，但過度著眼於價格的投資者無法分辨兩者。


    # 人性原地踏步


    葛拉漢在 1940 年代中期的一場演講中指出，證券分析的技藝截至當時為止前進不少，但就某個「重要的面向」而言其實並沒有真正取得任何進步——這個重要面向指的是人性。今日市場裡令人沮喪的走勢、兩極擺盪的情緒，以及恐懼焦慮——這一切幾乎都不是新鮮事。小鎮理髮師的恐懼與貪婪代表著所有在他之前的投資者，以及所有在他之後的投資者。


    葛拉漢和陶德（Dodd）七十多年前的著作《證券分析》自第一版就已明確強調情緒的核心作用。以下文摘是他們在 1920 年代末對投資者普遍心理的描述：


    有一種「新時代」的信條，說「好」股票（或「籃籌股」）無論價格多高都是穩當的投資，這說法充其量只是一種掩飾——藉「投資」之名去合理化某種近乎屈服於賭博風氣的行徑。我們認為，這樣的心理現象跟近年來種被賦予重要地位的價值因素緊密關聯。無形的價值因素如商譽、管理素質、獲利前景等等，縱使具備無可質疑的真實性，卻無法以數學計算加以證實；因此這些因素的衡量標準在極大程度上是任意武斷的，並且因當前盛行的心理而受到'
