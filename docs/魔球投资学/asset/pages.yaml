  md: '工人負責執行製程，但那成了全景的一小部分。你可以使用這種說法來重新界定當前有關外包的辯論：倘若把那些執行指令的工作外包出去，確實能為創造指令的員工提升機會，那麼外包的做法是否就變得合理了？


    形塑世界的指令成了財富創造的核心（諷刺的是，古典經濟學的成長模型將之視為外生性元素）；這帶來了幾項重要意涵。


    第一點與經濟學家所謂的互斥性產品與非互斥性產品的差異有關。互斥性產品被個體消費後，他人可消費的量就減少了——例如汽車、筆、衣服等等。相對的，許多人可以同時使用某個非互斥性產品，例如共用一套指令。軟體是非互斥性產品的原型。軟體公司可以廣為散播他們的產品，而且多次利用這個知識並不會導致資源匱乏，因此流傳得越廣則帶來更大的成長。5


    第二層意涵是：既然創新關乎的是概念構件的重新組合，那麼，擁有越多構件，解決問題的機會就越多。這個原則可透過一道簡單的數學算式來表述。假設你有四個概念構件來組合成可能的解決方案。可能的組合總共是
    4x3x2x1，也就是 24 個。現在，把概念構件增加到六個，可能的組合數量成了 6x5x4x3x2x1，等於 720 個——你多了三十倍的可能性。羅默總愛這麼說：二十個步驟的組合方法有大約
    10^19 種，這個數目已經超越了宇宙大爆炸到現在所經歷的秒數。


    從這裡，我們連結到最後一層意涵：越多概念構件帶來越多創新，而最終導致更快速的累積成長。高度依賴物質資源的公'
