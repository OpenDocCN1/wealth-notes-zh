    +   2 「寵物石」是開始自1970年代的一股風潮。美國加州一家廣告公司主管蓋瑞．達爾（Gary Dohl）突發奇想，說他理想的寵物是不用餵食、不用洗澡、不會死，所以「賽石頭最好了」。於是他設計了「寵物盒子」，1975年聖誕節上市，盒子裡面裝著的是「血統純正」的寵物石，並且附上寵物石訓練手冊。寵物石一顆售價3.95
