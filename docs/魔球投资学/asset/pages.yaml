  md: '# 38

    深藏不露的訊息帶你上天堂

    ——投資報酬的自相似性


    > 大自然只用了最長的線編織出她的圖案，因此布料上每一個微小部分所顯露出的，都是完整織錦的條理。

    ——理察·費曼（Richard P. Feynman）


    # 我也可以


    《生活》(Life)雜誌曾經因為公開質疑傑克遜·波洛克（Jackson Pollock，1912-1956）為「美國在世最偉大的畫家」，在1940年代掀起一股騷動。波洛克不是那種拿著調色板做畫的典型畫家——他把顏料滴在大片畫布上，創作出獨特的抽象畫作。雖然他的一些作品叫價數百萬元，但某個質疑者說他的作品就像「那頭我忍不住要梳理的紊亂頭髮。」$^1$一些評論者則揶揄說他們只要隨便噴灑顏料，也能弄出跟波洛克作品一樣的畫作。$^2$


    然而，波洛克的作品還是很吸引人。為了理解其中的美學魅力，物理學家理查·泰勒（Richard Taylor）轉向數學的世界。他發現波洛克的畫作看似任意，但其實呈現出讓人愉悅的碎形樣態。碎形是「一種可以分解成部分的幾何形狀，分解出來的部分也是整體的縮小版本」。$^3$儘管其他質疑者一昧地冷嘲熱諷，泰勒證明這些碎形不可能是隨便滴下顏料就能產生的。'
  merge: -1
  img_proc: true
- pgno: 366
  md: '碎形在自然界裡無所不在，樹木、雲朵、海岸線只是其中的少數例子；因此，人類的視覺對碎形非常熟悉。⁴ 碎形的關鍵特徵在於其碎形維度（fractal dimension），或複雜度（線條的碎形維度為
    1.0，填充空間的碎形維度則為 2.0）。泰勒與他的同事發現人類偏好維度介於 1.3 至 1.5 的碎形，無論那是天然或人造的。波洛克大多數畫作的碎形維度就在這個範圍內，或落在附近區域。因此，科學家可以據此立即分辨真假波洛克作品。⁵


    碎形在自然界中如此常見，以至科學家往往將之連接到自組織系統。既然經濟學處理大量這類系統，或許我們會在經濟系統中發現碎形。實際上，我們確實發現了。


    我們必須針對波洛克的畫作或海岸線進行分析，才能領會隱藏其中的碎形樣態；同樣的，我們必須以全新的目光檢視經濟體系。秩序總是隱藏的。⁶


    # 深藏不露的訊息帶你上天堂


    自相似（Self-affinity），即部分跟整體的相似，是碎形的另一項重要特徵。想想花椰菜——一整顆花椰菜，或者一大塊花椰菜，或者一小塊花椰菜，全都是同一個樣子。股票價格也呈現碎形——進行一些調整之後，無論你看的是每個月、每一週，或每一天的價格變化，數據看起來都是一樣的。⁷


    分析證實了投資報酬和資本成本的差異在五個不同的層次，即國家、產業、公司、部門、產品線，都顯示自相似的分佈樣'
