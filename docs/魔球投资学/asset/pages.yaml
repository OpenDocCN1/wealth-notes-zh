    +   • 權威：社會心理學家史丹利·米爾格倫（Stanley Milgram，因「六度分隔理論」而聲名大噪）進行了史上最具啟發性，也最讓人不安的人類實驗之一；他在實驗中讓受試者擔當「教導者」和「學習者」的角色。受試者負責向學習者提問，如果答案錯誤，受試者將在一位身穿實驗袍的嚴厲監督者指示下發出電擊，而且電流逐次增強。學習者因疼痛而尖叫求饒。即使這些受試者未被強迫進行任何事，也不需要擔心被報復，然而他們當中有許多人最終發出了致命強度的電擊。


