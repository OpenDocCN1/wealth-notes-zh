    # 群的智慧


    投資者可以從這樣的論述中得到一些訊息。首先，分散式系統往往具備解決複雜問題的高效能力，即使組成部分的智力有限。當我們創造更低成本的方法來利用集體智慧時，分散式智力的重要性就更顯著了。$
    ^{10} $


    再者，我們或許急於把所有分散式的問題解決系統視為一體，但實際上各種系統之間存在重大差異——而且正是這些差異形塑了系統的續效。例如，投資者呈現異質性時，股票價格傾向於有效率。但是，當異質性消失而投資者的錯誤不再相互獨立時，市場將呈現過度行為。$
    ^{11} $ 相較於昆蟲聚落和預測市場，股市更傾向於反應過度。


    最後，分散式系統較為穩健。儘管有偶發的過度動態，市場適應變化的能力相當理想。這樣的觀點將理性的義務從個體投資者身上移開，並且認為分配效率來自於市場的結構本身。市場智'
