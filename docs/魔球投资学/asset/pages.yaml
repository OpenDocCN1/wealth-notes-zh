    # ### 令人迷惑的複利


    管理者和投資者通常認為成長絕對是好的。管理者時時論及

    成長目標，有時甚至以「宏偉、艱難、大膽」的目標激勵員工，

    並試圖藉此給股東留下好印象。成長型投資者一貫尋覓那些有望

    在銷售與利潤方面取得快速且可持續性成長的公司。


    但是，大多數投資者也無法直觀地了解複利的威力與作用。

    進行以下的小測驗，你就會知道利潤如何層疊：


    今日的 1 元經過二十年的複利累積之後，會變成多少錢？把

    金額寫在以下空格裡。'
