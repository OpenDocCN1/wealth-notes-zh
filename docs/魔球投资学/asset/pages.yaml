  md: '期望值的思維模式並不僅限於投資的領域。《下最好的賭注》 (Bet with the Best) 為同注分彩賭博的玩家提供了各種下注策略。美國賽馬雜誌《每日馬報》
    (Daily Racing Form) 的執行長、編輯與出版人史蒂芬·克雷斯特 (Steven Crist) 以一場虛擬的賽馬來講解投資報酬率，包括彩金。他如此概括：「這樣的作法是為了指出，即使勝率非常高的馬也不一定是好的下注標的，甚至可能是很糟的標的；下注標的的好壞只取決於一件事：賠率。」所以，50%勝率的馬可以因為賠率而成為或好或壞的下注標的；十一比一勝率的馬也一樣。簡而言之，他的意思是：重要的不是勝率，而是勝率乘以賠率。¹⁰


    克雷斯特也請他的讀者捫心自問：「現在，問問你自己：當你投注時，腦子裡真的是這麼想嗎？還是，你只是選一匹你『喜歡』的馬，然後期待牠給你好結果？大部分誠實的玩家承認他們遵循的是後者。」如果把「投注」替代成「投資」、「馬」替代成「股票」——克雷斯特所說的一樣適用於股票市場。


    另一個適合運用期望值思維的領域是廿一點紙牌遊戲，一如愛德·索普 (Ed Thorp) 的暢銷書《擊敗莊家》 (Beat the Dealer) 所揭示的。在廿一點牌局中，賠率是固定的，賭客的主要任務就是估算下一張抽到好牌的機率。索普教讀者如何算牌，以把握勝算傾向玩家的時刻。當玩家握有勝算時，最好的策略就是追加賭注
    (即提高賠金)。索普發現，即使在理想的情況之下，也只有 9.8%的時間會出現對玩家有利的條件，其餘 90.2% 的時間賭場占盡優勢。¹¹'
