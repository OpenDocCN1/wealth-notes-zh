    在一個深思熟慮的投資過程中，投資者凝視著機率和報酬，然後仔細思考由價格所顯現出來的市場共識，尋找共識可能出錯之處。投資還具備一些其他的重要特徵，因而有別於諸如賭場或馬場之類的例子，但是這些活動的基本概念是一致的——你必須要有正數的期望值。


    # 財政部長給投資者的忠告


    在最近幾次的大學畢業典禮演講中，美國前任財政部長羅伯特·魯賓（Robert Rubin）授予畢業生四大決策原則。這些原則對金融社群而言特別有益:$ ^{5}
    $


    （一）唯一確定的事，即是凡事無確定：這項原則尤其適用於時時處在不確定情境的投資領域。相對的，賭場的業務主要處理的是風險。在不確定性和風險兩大因素的作用之下，結果無從得知。因為不確定性，所以各種可能結果的分布仍不明確；但因為風險，所以我們知道結果的分布如何。企業的盛衰榮枯充滿不確定性，賭輪盤則充滿風險。$
    ^{6} $


    這時候即觸及一項行為學上的課題——過度自信。研究顯示，人們對自己的能力與預測往往過於自信。$ ^{7} $ 因此，他們傾向於把結果設想在一個過度狹隘的範圍裡。就在過去的八十年裡，'
