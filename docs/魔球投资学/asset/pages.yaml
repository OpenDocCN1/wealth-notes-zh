  md: '# 5 那些冒險的事

    ——投資的風險、不確定性與預測


    風險和不確定性在實作上有所區別——風險意味著一組事件中的結果分布是可知的；不確定性的結果分布則無從預知，因為面對的情境是極具特殊性的。


    > ——法蘭克·奈特（Frank H. Knight），《風險、不確定性與利潤》（Risk, Uncertainty, and Profit）


    有關事物如何運行的知識，無論是人為或自然的，皆從含糊的疑團而來。無邊災難讓人類開始對確定性投以信仰。


    > ——肯尼斯·阿羅（Kenneth Arrow），〈「我分辨得出什麼是鷺鷹什麼是白鷺」〉（‘I Know a Hawk from a Handsaw’）


    # 火箭科學


    德國認知心理學家捷爾德·蓋格瑞澤（Gerd Gigerenzer）有一次在亞利安火箭（Ariane rocket）製造者戴姆勒賓士宇航公司（Daimler-Benz
    Aerospace，簡稱 DASA）的導覽行程中，發現了一件不尋常的事。亞利安四號和五號火箭的 94 次發射工程中總共發生 8 次事故，包括第 63 次、第
    70 次和第 88 次發射。一時好奇，蓋格瑞澤問導覽員發射的事故風險有多高。導覽員回說安全係數大約是 99.6%。'
