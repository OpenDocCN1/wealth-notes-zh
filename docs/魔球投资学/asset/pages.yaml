  md: '傳達資訊，但是市場上的價格對投資者而言往往超越了傳遞資訊的功能，投資者會被影響而引發不健康的模仿行為。


    預測市場和股市還有另一項顯著差異——預測市場有確切的時限和明確的結果。這個特徵為結果製造了邊界，因而有效限制投機性的模仿行為。換言之，動能策略無法奏效。而且，在股票市場，股價的走勢會影響公司基本面前景。$
