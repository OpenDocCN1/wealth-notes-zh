- pgno: 303
  md: '——大衛·亨利（David Henry），《今日美國》（USA Today），1997年10月30日


    主宰真實世界中絕大部分事態的不僅是平均值，還有分布形態中的「尾巴」事件——發揮作用的是例外事件，不是平均事件；是災難性崩壞，而不是循序下滑；是極富者，而不是「中產階級」。我們必須從「平均」思維中解放。


    ——諾貝爾物理學獎得主菲利普·安德森（Phil Anderson），《有關經濟學分布的一些想法》（Some Thoughts About Distribution
    in Economics）


    # 經驗與曝險


    華倫·巴菲特在 2001 年的致股東信函中區分了經驗（experience）與曝險（exposure）。雖然巴菲特是在波克夏·哈薩威（Berkshire Hathaway）公司保險業務的脈絡下做出評論，但他的論點確實適用於任何跟主觀機率有關的操作。當然，經驗指的是望向過往，並且根據歷史事件的發生來思考未來結果的可能性。另一方面，曝險的概念則是在於思考某個事件的可能性，以及潛在風險；而這個可能性是歷史（尤其是近期歷史）所無法揭示的。巴菲特認為，保險業在
    2001 年預設了巨大的恐怖主義風險但卻未提出相應的保費增額，因為這個假定是基於經驗而非曝險。'
  merge: -1
  img_proc: true
- pgno: 304
  md: '投資者也一樣，必須辨別經驗與保險。備受關注的長期資本管理公司（LTCM）倒閉事件和維特·倪德厚夫（Victor Niederhoffer）的失敗，正好證實了這一點。然而，值得注意的是，標準金融學理論並不太能應對極端事件。金融經濟學家普遍假設股票價格的變化是隨機的，就像水中的花粉因分子撞擊而移動一樣。²


    相較於經驗結果，模型建構的方便性更受到重視，以致金融理論將價格變化視為獨立且相同分布的變項，而且普遍上假設報酬呈現常態或對數常態分布。這種假設的好處是，投資者可以利用機率理論理解分布的平均值與變異數，因而以一定的統計準確度預測各種價格變動比率。好消息是，這些假設在大部分時候都相當合理。壞消息是，如本章前文引用的物理學家菲利普·安德森（Phil
    Anderson）所說，控制世界的往往是分布的尾巴部分。


    # ## 尾巴才是重點


    常態分布是金融學理論包括隨機漫步假設、資本資產定價模型、風險價值（VaR）以及布萊克－休斯（Black-Scholes）模型的基本原則。例如，風險價值模型試圖量化在某個機率之下投資組合的虧損數額。縱使風險價值模型有許多不同的形式，但其基礎版本依賴標準差作為風險的衡量。在常態分布之下，計算標準差進而衡量風險也就變得相對直接。然而，如果價格變化並非常態分布，則標準差可能就成為風險值的錯誤代理變項。³'
