  md: "# 25 我跌倒了，我站不起來  \n——均值回歸與轉機\n\n這項研究的關鍵發現在於持久性的優異表現非常罕見，這意味著達成這樣的經濟績效是極度困難的。\n\
    \n另一個與此相關的發現是：即使達到優異績效，並且維持了一段時間，從高處滑落的機率還是相對很高的。\n\n> ——羅伯特．魏金斯（Robert Wiggins）和提摩西．雷菲利（Timothy\
    \ Ruefli），〈持久性競爭優勢〉\n\n# 報酬率與成長\n\n金融學教授約瑟夫．拉科尼薛（Josef Lakonishok）在 2004 年《紐約時報》的一篇文章中指出，股票市場裡有許多「發狂的錢袋」。¹\
    \ 拉科尼薛的證據來自於成長率與本益比之間的關係；他認為市場正在對一些本益比極高的公司期待不切實際的盈餘成長率。他跟同事共同進行的研究證實了，只有極少數的公司能夠維持高成長率。²\n\
    \n不過，真正決定本益比的因素是什麼呢？公司的價值取決於市場對其成長率和經濟報酬率的預期。這個基本概念說明了為何單純考慮成長率可能帶來誤導。成長率可能是好的（當企業賺取的報酬高於資本成本），可能是壞的（當報酬低於資本成本），"
