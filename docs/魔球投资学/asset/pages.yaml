  img_proc: true
- pgno: 268
  md: '| 初始金額 | 複利率 | 二十年後的金額 |

    |---|---|---|

    | $1 | 2 | ____ |

    | $1 | 7 | ____ |

    | $1 | 15 | ____ |

    | $1 | 20 | ____ |


    對我們大多數人來說，這些計算並不直觀。以 1 元為初始金額，為期二十年的 2%複合年均成長率（Compound annual growth rate，CAGR）將會讓金額增加到
    1.49 元。7%的成長率將得到 3.87 元。15%的成長率，也就是大型企業普遍的盈餘成長目標，則將把初始金額變成 16.37 元。如果複利率為 20%，二十年後的金額將會是
    38.34 元。


    你呢？你可能跟大部分人一樣，不太能夠估算成長率跟終值之間的關係。例如，成長率從 15%提升到 20%，意味著二十年後的終值增加超過一倍；而這是大多數投資者的直覺未能意識到的。因此，愛因斯坦才把複利稱為「第八個世界奇觀」。投資者的訣竅在於讓複利為己所用，而非反其道而行。。


