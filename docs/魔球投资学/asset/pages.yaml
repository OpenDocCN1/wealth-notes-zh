  md: '有力方法。在這裡，問題並不配以特定的單一解方，群體的決策方法優於任何一個個體，即使該個體是專家。


    維多利亞時代的博學之士法蘭西斯·高爾頓（Francis Galton）是最早為群眾聚合所展現的能力提出證明的人。在1907年一篇刊登在《自然》（Nature）的文章〈群眾之聲〉（Vox
    Populi）裡，高爾頓敘述在普利茅斯（Plymouth）的西英格蘭肉畜與家禽商展上一項測大公牛重量的比賽。參觀者繳付六便士就可參加，總共吸引了787個參與者。（收取小額費用是為了防止惡作劇。）根據高爾頓，參賽者當中不乏肉商和農場主，他們或許是猜測公牛體重的專家。他推測其他大多數人仰賴的是「他們剛好打聽到的情報」或「他們自己的幻想」。


    高爾頓計算所有估測的中位數，即「群眾之聲」，及其平均值。他發現估值的位中數跟真實重量僅少於0.8%的誤差，估值平均數更是在0.01%的準確度範圍內。為了了解答案如何冒現，高爾頓研究所有預測值的分布。簡單來說，誤差相互抵消，所得的結果即是精煉後的資訊。4


    從此之後，我們看到群眾之聲的結果一再重現，從解開複雜的迷宮、猜測罐子裡的雷根糖數量，到搜尋失蹤的炸彈等等。5在每一個案例中，資訊匯集過程得以發揮作用的必要條件包括：匯集資訊的程序、為正確答案提供的獎勵，以及群體的異質性。'
