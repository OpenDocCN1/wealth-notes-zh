  md: '# 16 直覺致勝


    ——採取自然決策的投資


    > 以做決策為職業的人總會意識到，在任何複雜或混亂的情境如戰場、交易所或今日殘酷競爭的商業世界裡，直覺往往勝過理性分析。而更進一步的科學探究告訴我們，直覺不是天賦，而是技藝。


    ——湯瑪斯·史都華（Thomas A. Stewart），《如何利用直覺思考》（How to Think with Your Gut）¹


    # 海軍陸戰隊與交易大軍的對決


    美國退役中將保羅·梵瑞柏（Paul Van Riper）過去在海軍陸戰隊的訓練裡學習了古典決策理論——框架問題、制訂各種方案、評估選項。所以，他後來在 1990
    年代主持海軍陸戰隊的領袖與戰鬥訓練計畫時，傳授的毫無意外也是古典模型的理性取徑。但是，梵瑞柏發現理性決策的方法無法在模擬戰鬥中發揮預期作用。


    梵瑞柏注意到了認知心理學家蓋瑞·克萊恩（Gary Klein）。克萊恩研究消防員處理複雜情境時的真實決策過程；他發現消防員完全不衡量選項——只要冒出的想法可行，他們馬上行動，然後再尋找下一個，如此循環。消防員的決策過程完全不依照古典理論所說的那一套。'
  merge: -1
  img_proc: true
- pgno: 169
  md: '梵瑞柏想到紐約商品交易所（New York Mercantile Exchange）場內跟模擬戰鬥室有許多共同點。因此，他在 1995 年把一群海軍陸戰隊軍人帶到紐約，跟交易廳內的專業人士進行了一場模擬交易競賽。交易員大勝軍人——當然，沒有人對這結果感到意外。不過，一個月後這些交易員來到維吉尼亞州匡提科（Quantico），跟海軍陸戰隊在一場生存遊戲中比賽。交易員再次大勝軍人——這次，所有人都驚呆了。²


    決策研究的歷史相當悠久。丹尼爾·白努利（Daniel Bernoulli）針對決策過程所提出的古典模型，早已存在超過兩百五十年，而大部分經濟學論述仍然視之為典範。³
    但是這個模型並不符合現實。1950 年代，經濟學家司馬賀（Herb Simon）對這套古典理論提出了重大反駁，認為該決策模型對資訊處理的要求遠遠超過了人類的認知能力。人類的理性是有侷限的。因此，人類並不是根據最理想的結果來做決策，他們只是挑出夠好、堪可的選項。司馬賀說，人們不追求最大值，人們尋求「最低限度的滿足」（satisfice）。


    「自然決策」（naturalistic decision making）是近年來興起的新理論，解釋了專家如何在真實世界的脈絡中做出對他們而言具有意義又熟悉的決策。⁴
    證據顯示，老練投資者做出的決策皆符合自然決策的關鍵屬性與原則。理解自然決策能幫助投資者更進一步意識到他們自己的投資方法，這在訓練過程中也大有助益。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 砍掉決策樹


    在近期的一篇文章裡，羅伯特．奧爾森（Robert Olsen）列出「自然任務」（naturalistic tasks）所顯示的五種特徵，並且指出這些狀態跟投資者的關係。6


    +   1. **結構含混且複雜的問題**：在這類狀況下，並不存在一個最佳的問題解決程序。例如，確定證券的公允價值就是一個結構含混且複雜的問題。


    +   2. **資訊不完備、不明確，且持續變動**：依賴未來財務績效的預期來選擇股票，意味著無法把所有的資訊納入考慮。


    +   3. **不明確、變幻且複雜的目標**：雖然投資的長期目標非常清晰，但是其短期目標卻可能經歷顯著改變。例如，投資組合經理可能以防衛的態度保持績效，也可能採取更積極的姿態彌補虧損。


    +   4. **因時間限制、高風險，或兩者同時作用下的壓力**：壓力顯然是投資的屬性之一。


    +   5. **決策可能涉及多方參與者**：這意味著決策者可能必須跟不同的合作者共事，而這些參與者可能會約束決策過程。


    採用自然決策的人實際上如何做決策？奧爾森確認了三種主要行為。首先，他們有能力依靠自己的心像（mental imagery）與情境思維，據以評估當下情境與可行的選項。7'
  merge: -1
  img_proc: true
