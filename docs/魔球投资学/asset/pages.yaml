  md: '# INTRODUCTION


    關於多樣性的思考，我特別從兩大方面獲得靈感啓發。第一個啟發的來源是波克夏·哈薩威（Berkshire Hathaway）公司的查理·蒙格（Charlie Munger）所堅持提倡的心智模型取徑。我的第二個靈感來源是聖塔菲研究所——這是美國新墨西哥州的一個研究群體，致力於各種自然科學與社會科學研究議題的跨學科協作。


    查理·蒙格長久以來的成功即是絕佳證明，展現了多學科取徑的價值。心智模型對蒙格而言是個工具——一種幫助你認清眼前問題的思考架構。他認為我們必須將心智模型建構成網絡結構，才能有效率地解決最多的問題。他傳達的理念是：讓模型切合問題，而不是如他所說的，「拷打現實」以吻合你的模型。


    某些性格特質有助於心智模型取徑的發展。幸運的是，這些都是你可以選擇擁有的特質：知識上的好奇心、誠實、耐心，以及自我批判。解決問題的成就不在於智商。正如蒙格所指出的，偉大的博物學家查爾斯·達爾文（Charles
    Darwin）翻轉世界的成就，在極大程度上來自於他的工作方法，而不是他的先天才智。另一方面，也有太多聰明人做出糟糕的決策，他們一再展現頑固習性，或無法領會心理方面的啟示。


    然而，使用心智模型取徑並非沒有代價。你必須耗費大量時間與精力學習各種學科的知識。而且，毋庸置疑的，你所學習的'
