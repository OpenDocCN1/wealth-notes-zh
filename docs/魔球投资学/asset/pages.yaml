- pgno: 34
  md: '美國經歷了經濟大蕭條、幾次戰爭、一次能源危機，以及一次重大恐怖襲擊。當中沒有任何一項是可被廣泛預知的結果。投資者必須訓練自己去考慮範圍更廣的可能結果。方法之一，就是多加留意那些預示著「必然性驚異」的領先指標。$^{8}$


    體認不確定性，對基金管理而言也十分重要。許多徹底失敗的避險基金，其毀滅過程的故事不外乎基金經理因過度自信而為某個投資項目配置太多資金。進行資金配置時，投資組合經理必須考慮到所有意料之外的事件都有可能發生。$^{9}$


    （二）決策關乎的是機率權衡：我們延伸魯賓的觀點，以求某個結果的機率（頻率）及該結果的報酬（數值）兩者之間的平衡。當報酬傾斜時，單純考慮機率是不足夠的。


    我們從另一個行為財務學的概念「損失規避」開始談起。演化所致，人類在各種具風險的選項之間做選擇時，總是傾向於規避損失。更具體地說，損失對人類所帶來的衝擊效果，是同等數額利潤的2.5倍。所以我們想要做對的選擇，以致往往偏向高機率選項。$^{10}$


    如果各種可能結果呈對稱分布，著眼於機率便相當合理可靠；但是，如果報酬呈傾斜分布，就不能完全只考慮機率。如果90%的選擇權部位都會虧損，是否意味著選擇權交易是個饅主意？答案取決於那10%確實獲利的部位讓你賺了多少錢。如果你買入十份各值1美元選擇權合約，其中九份到期時將一文不值，但第十份到期時漲至25美元——你的成功率高，但獲利'
  merge: -1
  img_proc: true
- pgno: 35
  md: '相當可觀。¹¹


    所以，期期望值的考量，有些高機率選項並不吸引人，有些低機率選項則非常誘人。假設某一家股價合理的企業有 75%機率獲利，因而讓股價提升 1%；但這家企業有 25%
    的機率不符預期而股價暴跌 10%。這支股票屬高機率投資選項，然而期望值卻是負面的。¹²


    （三）即使不確定，我們仍需行動：魯賓指出，我們絕大部分 的決策都只能以殘缺或不完整的資訊為依據。但我們仍然必須用智慧去評估所能取得的資訊，據此做出決策。


    魯梭和舒麥克說，我們總是相信只要得到更多資訊，就能更清晰描繪出未來景象，也能改善我們所做的決策。但是，實際上更多的資訊通常只會讓決策過程更為混亂。


    研究人員對賽馬評磅員的調查結果說明了這個論點。他們首先要求評磅員用手上的五份資料來預測賽事。之後，研究員把資料量提高到十份、二十份、四十份，然後要求評磅員再次做出預測。圖表
    1.2 顯示了調查結果：資訊量的增加雖然只會讓預測準確度微幅提升，但是他們對自己的預測能力卻因附加的資訊而提升不少信心。¹³'
