    投資過程所指向的目標毫含糊，即指認出企業的股價與其期望值之間的落差。期望值也就是各種可能結果的加權平均值。你可以把特定結果所帶來的報酬（即股票價格）跟該結果實現的機率相乘，得出期望值。²


    投資事業中最嚴重的失誤，大概就是混淆了企業的基本面價值跟市場價格對該企業所投射的期望價值。投資大師邁可・斯坦哈特（Michael Steinhardt）和賽馬評論家史蒂芬・克雷斯特（Steven
    Crist）都在各自不同的領域獲得優異成就，但他們兩人之間的一致見解值得我們注意：


    > 我所謂的變異洞見，指的是某些理據充分但又與市場共識之間存在深刻差異的觀點。市場期望往往不同於基本面條件，而洞悉市場期望的重要性至少與企業基本面的掌握同等重要。³


    重點不是在於哪一匹馬最可能會贏，而是在於確認哪一匹，或哪幾匹馬提供的賠率超越其實際勝率。這聽起來很簡單，許多賭馬的人也以為自己遵循著這個原則，但真正'
