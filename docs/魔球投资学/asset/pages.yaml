  md: '3. 知己彼：要有好棋藝，必須要有讀心的技巧。很少人會把西洋棋看成是親密且人性的遊戲。但確實如此。棋手詳盡研究他們的對手，傑出的棋手還會試圖解讀對手的一舉一動。


    # 圖表 22.1 避免單一比賽計畫


