  md: '讓我們把以下討論限縮在認知工作。我們先確認所處理的問題屬於何種性質，以此來衡量專家效能。問題的類型可以鋪成一條連續光譜。³ 其中一端是來自靜態、線性與離散系統的明確問題。對立的另一端則是動態、非線性與連續（continuous）的問題。圖表
    6.1 列出更多字詞形容光譜兩端的問題性質。


    # 圖表 6.1 問題光譜的兩端


