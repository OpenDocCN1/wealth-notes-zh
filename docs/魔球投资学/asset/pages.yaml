  md: '# 迎來創造性破壞的世界


    二十一世紀的萊特兄弟將擁有前所未有的途徑與能力去尋找組合式的方案。未來的財富將緊隨著那些有能力創造出有益概念的人，而不是那些執行概念的人。


    +   1 演化經濟學家理查·尼爾森（Richard Nelson）和西德尼·溫特（Sidney Wenter）也提出相同的看法。他們寫道：「在經濟體系裡的創新，實際上也包括藝術、科學及現實生活中任何新穎事物的創造，在相當大的程度上都是原有概念與實體材料的重組。每個新的突破都不單純只是特定問題的解答，同時也會成為大倉庫裡的新部件，供未來的「新組合」所用，以解決未來的另一些問題；而現代世界推動著科學、技術與經濟進步的巨大動力，即主要來自於此。」Richard
    R. Nelson and Sidney G. Winter, An Evolutionary Theory of Economic Change (Cambridge,
    Mass.: Harvard University Press/ Bellnap Press, 1982), 130。


    +   2 根據羅默 1998 年 7 月 17 日在美國加州圓石灘（Pebble Beach）一場圓桌會議的發言，會議主持人在其著作中複述：Donald
    Lessand, “The Soft Revolution: Achieving Growth By Managing Intangibles,” The
    Journal of Applied Corporate Finance 11, no. 2 (Summer 1998): 8–27.


