  md: '# 15 向凱因斯致敬——長期預期、艾法洛酒吧，以及後見之明的偏誤


    善巧投資的社會目的，應該是擊敗時間與無知這兩種矇蔽未來的黑暗力量。今日大部分有技巧的投資在現實中的私人目的，就美國人的巧妙說法，是「在嗚槍前偷跑」，以智巧瞞騙群眾，把劣質、貶值的半克朗銀幣轉到他人手上。


    ——約翰．梅納德．凱因斯（John Maynard Keynes），《就業、利息和貨幣通論》


    # 你期待什麼呢？


    馬克．吐溫（Mark Twain）如此定義經典：每個人都認為需要閱讀，但沒有人想要讀。約翰．梅納德．凱因斯（John Maynard Keynes）的《就業、利息和貨幣通論》(*General
    Theory of Employment, Interest and Money*)¹是值得一個投資者注意的經典著作之一，尤其是書中的第十二章「長期預期狀態」(The
    State of Long-Term Expectation)。預期鑲嵌在我們所做的決策當中，尤其是投資決策；但是我們鮮少退一步思考我們的預期如何形成、為何形成。凱因斯引導我們進行這樣的反思。


    讓我們深入檢視預期的兩大面向。第一個面向區別了演繹'
  merge: -1
  img_proc: true
- pgno: 162
  md: '（deductive）而得與歸納（inductive）而得的預期——根據普遍假定而演繹出特定的結論，或者以特定的論據歸納出一般原則。


    演繹理性是新古典經濟學的基本要素，卻在現實世界中癱瘓，因為人類的推論邏輯無法處理太複雜的情境（也就是說，我們擁有的是有限理性）；而且，人類互動中任何偏離理性的行動都會激發對他人行為的猜測。2換言之，如果沒人理性，你就不會因理性而得到好處。


    預期的第二個面向是：一旦事件發生後，人類傾向於高估他們在事發前對事件結果所掌握的知識。這種後見之明的偏誤侵害了回饋資訊的品質，而回饋正是我們提高分析技巧所需要的。


    # # 投機與經營


    凱因斯把未來報酬（他使用的是「收益」（yield）一詞）預期所仰賴的基礎分成兩大部分：確定程度或高或低的事實，以及你能夠以或高或低的信心程度進行預測的事件。後者這類不確定事件包括投資的規模與類別，以及需求量的波動。對這些事件的心理預期，凱因斯稱之為「長期預期狀態」。


    做出預測時，大部分人訴諸的是某種凱因斯所謂的「慣常」（convention）行為——他們會從當前的情境開始，而一旦有確切的理由相信某種變化即將發生時，就會調整想法。3他發現，調整的幅度反映的是「信心狀態」（the
    state of confidence），即實際市場觀察以及商業心理學的結合。但是，即將出現的信心狀'
  merge: -1
  img_proc: true
- pgno: 163
  md: '態是無從預期的，因為信心狀態的形成必須依賴回饋；市場影響心理，而心理影響市場。⁴


    凱恩斯指出，人們的慣常作法本質上是不可靠的；理由很多，但最重要的原因在於許多投資者的重心並不在「經營」（enterprise），即長期的投資報酬，而在「投機」（speculation），也就是進行市場心理的預測。針對這一點，凱恩斯引用了他最有名的比喻：市場是一場選美比賽。選美的目的並非找出你認為最漂亮的人，甚至也不是為了找出那個你覺得普通觀眾會認為漂亮的人。很快的，你會發現自己正在嘗試破解平均意見所認為的平均意見為何。凱恩斯透過選美比喻，說明了以演繹法解讀經濟與市場所面臨的侷限。


    然而，這並不是意味著凱恩斯認為市場單純由情緒所驅動。他寫道：


    > 長期預期狀態往往是堅定的，一旦動搖，就有其他因素發揮其補償作用。我們只要提醒自己：對未來無論個人、政治或經濟層面造成影響的人類決策，都不能依靠精確的數學運算去預測，因為根本就不存在任何基礎可進行這類計算。⁵


    在這一段歷久不衰的評論中，凱恩斯補充道：「在一股穩健的經營者洪流之中，投機客可能只是泡沫，無傷大雅。但是，如果經營化成了投機渦流裡的泡沫，情況就嚴重了。」⁶'
