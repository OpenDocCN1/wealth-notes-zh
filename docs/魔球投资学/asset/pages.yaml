  md: '今天機構投資者的重心在於經營或投機？這是難以解答的問題，況且，多樣的投資者生態確實也是市場維持穩健的必要條件。但是，有關股權週轉率的總體統計數據著實讓精明投資者躊躇不決。年度轉率從
    1970 年代初期的 30%至 40%，劇增至今天的大約 90%。這表示，某支股票的平均持有時間只有略高於一年。這等程度的週轉率不僅昂貴，也意味著公司治理的衰退，讓人不安。⁷


    # 到艾法洛酒吧聽音樂


    經濟學家布萊恩・亞瑟（Brian Arthur）做出了重大貢獻，幫助我們理解兩種解決問題（包括選股）的取徑，即歸納法與演繹法。亞瑟說，人們只能用演繹法來處理簡單的問題——井字遊戲還可以，象棋就不行了。其實，實驗證明了人類的演繹邏輯並不好。但是，我們辨識及配對模式的能力卻是相當優秀的。人類是歸納法的機器。


    亞瑟提出了一個歸納推理模型，實際上把凱因斯的學說再往前延展。模型的構思來自艾法洛（El Farol）酒吧，這是美國新墨西哥州聖塔菲（Santa Fe）一家固定在每週四晚上演奏愛爾蘭音樂的酒吧。⁸
    如果人潮不是太擁擠，在艾法洛酒吧喝啤酒、聽音樂是很享受的，不會受到干擾。但如果人太多了，酒吧就變了樣——擁擠的顧客打翻你的啤酒，吵雜聲甚至蓋過現場演奏的音樂。所以，你會如何決定該不該到艾法洛？'
  merge: -1
  img_proc: true
- pgno: 165
  md: '把問題說得更具體一些——這家酒吧可容納一百個人，而亞瑟認為少於六十人較理想，超過六十人就太擁擠了。所以，預期當晚人潮少於六十人的，就會到酒吧去；認為人數會超過六十的則選擇留在家裡。去與不去的決定跟過去的選擇沒有關係；顧客們不會彼此討論或協調，決策的唯一依據就是過往的來客數量。


    這問題有兩個值得注意的特徵。第一，若使用演繹法來解決，這問題過於複雜。決策者只能夠以過去的來客數量為依據，有許多不同的預測模型可使用。正在決定要不要去酒吧的，必須使用歸納法。第二，共同預期會導致相反結果。如果所有人都相信大部分人會去，結果就會沒有人去；當所有人都認為沒有人會去時，結果就是大家都去了。跟凱因斯的選美比賽一樣，重點不在於你的看法，而是你對他人看法的看法。


    研究者建構了艾法洛難題的模型，個體在其中採取持續演化的決策規則。充分多樣的規則，加上足夠多的迭代次數，酒吧的平均來客數就會趨近於六十人的臨界值。有一項研究預設了
    20,000 次的迭代，也就是相當於 385 年中的每個週四晚。9 這意味著歸納法也能推論出跟演繹法相似的結果，前提是策略必須具備充分的多樣性。


    凱因斯和亞瑟都刻畫出了市場的根本事實：許多投資選擇都無法、也不能立基於數學式的演繹推理。我再補充一點：整體而言，一個全面多元的策略生態足以產生效率市場。但是，當多樣性遭受破壞，市場就會明顯背離基本面，而這種狀況頻繁發生。'
  merge: -1
  img_proc: true
