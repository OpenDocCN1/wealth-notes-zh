- pgno: 19
  md: '# # 緒論  Introduction


    《魔球投資學》（全新增訂版）的核心命題是：如果你能夠以跨學科的視角來處理問題，你就會成為一個更好的投資者、經營者、父母、朋友，也就是成為一個更好的人。這句話聽起來非常簡單，要真正實踐卻讓人望而卻步。就像你搬進一間有待重修的舊屋時，手上帶著的是齊全的工具箱，還是僅僅帶著一支螺絲起子。如果你每執行一項任務，手上都備齊適當的工具，你必定會成為一個更成功、更高效的人。


    現實是，我們當中的大多數人終究只能取得狹窄的片面知識。大部分職業要求某種程度的專業化，某些領域如學術界更是完全仰賴於此。而且，我們的時間都不夠用——終日忙於講電話、回覆電子郵件、開會，我們不再有機會停下來閱讀、思考，或激盪出什麼想法。


    這本書第一版出版後，很多讀者跟我聯繫，說他們因接觸到這類非傳統的概念而感到愉快。大多數人不難領會到多向思維（diverse thinking）的價值。但許多讀者縱使認為思維的多樣性值得追求，卻很少會認為這是成功的必要條件。相反的，我相信認知的多樣性是解決複雜問題的决定性元素。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '關於認知多樣性的論據，是基於理論和實務而言。社會科學家史考特·佩吉（Scott Page）在他的著作《差異》（The Difference）裡論證了多樣性的邏輯。某些類型的問題必須仰賴多樣性才能解決，佩吉透過數學模型證實了其中的機制與原由。他熟練地將多樣性的討論帶離隱喻與軼事，將之推向基礎堅實且經得起時間考驗的定理。


    儘管佩吉在理論上有所貢獻，你或許還是會問：是否有任何實際證據顯示多樣性對複雜問題的結果預測具有重要價值。答案是肯定的，而這響亮的回應來自於心理學家菲利普·泰特洛克（Phil
    Tetlock）的著作《專家的政治判斷》（Expert Political Judgment）；這本書概括了他的出色研究。泰特洛克請數百位專家做出未來十五年内上千個有關經濟與政治事件的預測。然後，他做了一件相當「粗暴」的事——他追蹤這些專家的預測。


    平均來說，專家的預測非常普通。但泰特洛克還是發現當中有一些比較好的預測。好壞之分來自於他們的思維方式。所知廣而不精者，即採用多向思考的人，比所知精而不廣的人表現得更好。'
