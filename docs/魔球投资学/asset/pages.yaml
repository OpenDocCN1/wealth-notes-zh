  md: '自然決策有一點相當有趣——專家如何以極低程度的意識進行決策。神經科學家安東尼·狄馬吉奧在一項實驗中給受試者四副設計過的紙牌，其中兩副會讓他們贏錢（遊戲代幣），另兩副則會輸錢。他要求受試者連續從任何一副牌中翻出一張牌。狄馬吉奧給受試者戴上膚電感應的測量器，也像測謊裝置那樣，並且定時要求受試者想想遊戲進行當下的狀況。翻開大約十張紙牌之後，當他們要去翻那兩副輸錢的紙牌時，身體會出現反應。但是他們無法表達出這預感到底是怎麼回事，一直到翻開了四、五十張牌之後，才能夠說出其中兩副牌的風險較高。受試者還需要再翻出三十張牌，才有能力解釋他們的預感為什麼是正確的。即使從來沒有透過語言表達預感的受試者，也會顯現身體反應。


    雷·克里斯汀（Ray Christian）的研究提供了一些線索幫助我們理解無意識在決策中的作用。他發現，我們所觀察到的，也就是我們的意識「頻寬」，其實只是感官接受的資訊總量當中極微小的一部分。更具體而言，他估計我們的感官系統有每秒
    11 百萬位元的接收能力，但意識僅有每秒 16 位元的頻寬。


    # 自然狀態投資法


    奧爾森想要測試自然決策的概念是否真的可以解釋投資者的實際作爲。自然決策理論的對象是特定領域內的專家，因此他將研究對象設定為持有特許金融分析師（Chartered
    Financial Analyst, CFA）資格的投資者。他的研究樣本共有兩百五十多位投資者，其中超過 90%擁有六年或以上的投資經驗，而半數'
