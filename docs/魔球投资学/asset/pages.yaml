- pgno: 213
  md: '業的未來訂下一個現值（present value）——說得更精確，是企業未來現金流量的現值。股票價格反映投資者的集體期望。所以，投資者不能只考量創新，還要評估市場如何看待創新；而這就是機會所在。


    # 金髮女孩 $ ^{4} $ 的期待：這碗太燙、這碗太涼、這碗剛剛好


    大量證據顯示，經歷某種技術斷裂或變選之後，產業銷售與盈利會呈現 S 曲線。$ ^{5} $ 開始時成長緩慢，然後速度加劇，最後恢復緩和（見圖表 20.1）。這個圖像有助於我們思考期望的轉移。投資者（實際上包含普遍的人）往往以直線思維。處於
    A 點的投資者無法完全預測產業的成長以及未來的經濟報酬，因此他們推斷出相對低的成長率，於是對未來財務績效的期望太低了。之後進入持續成長的階段（B 點），投資者天真地把當下的成長狀態外推至無限的未來；期望因而過高。最後來到
    C 點，投資者開始抑制冷望，並且調整股價以符合較為實際的前景。


    因此，投資者的目標顯然是在 A 點買進股票，然後在 B 點賣出，以避開到了 S 曲線頂端市場預期轉變為向下走勢的不悅時刻。科技戰略家傑佛瑞·摩爾（Geoffrey
    Moore）的作品，包括他的暢銷著作《大金剛法則》（Gorilla Game） $ ^{6} $ ，提供了一個架構去預測此類期望上修的时刻。摩爾論述了如何超越
    A 點或 S 線彎頭的關鍵議題，並且提出辨識潛在贏家的策略。當然，困難在於許多公司都在嘗試，但只有少數能夠成為新產業的領導者。前方是個弱肉強食的叢林。'
