  md: '樣的市場崩盤在理論上仍然「不可能發生」 ⁵


    多數小事件與少數大事件，這樣的形態並非專屬於資產價格變化。實際上，這是系統處於「自組織臨界性」（self-organized criticality）狀態時的標誌。自組織是個體（在這裡指的是投資者）相互作用之下的結果，無需領導。系統處於臨界狀態時，微小的擾動也可能導致多種事件發生。自組織臨界性狀態出現時，系統出現各種樣態，包括地震、生物集群滅絕、交通阻塞等等
    ⁶


    是否有任何原理可解釋這種偶發的猛撲？我認為有的。就如我在其他篇章裡所述，當人數足夠且彼此差異的投資者交互作用時，市場就傾向於良好運作 ⁷ 相反的，當多樣性遭到破壞而投資者展現相似行為時，市場就變得脆弱（部分投資者退出市場也會導致這樣的結果）。大量有關羊群效應的文獻都觸及這個現象。所謂羊群效應，是指衆多投資者因觀察他人而做出相同的選擇，完全把自己的知識擱置一旁。資訊階流（Information
    cascades）是另一個自組織臨界性系統的最佳描繪；這個現象跟羊群效應也有密切關聯 ⁸


    # 肥尾對投資者的意義何在


    大幅價格變化的出現次數比預想中更頻繁。從實際的角度來說，這對投資者而言意味著什麼？我認為，這當中有幾點重大意涵：'
  merge: -1
