  md: '# 35 給你更強功力

    ——霪定律對投資者的意義


    自組織系統的概念，意指複雜系統的隨機性和渾沌看似自發地形成預期之外的秩序；過去幾年來這個概念的影響力劇增，並且把人工智慧到化學、生物演化到地質學等等領域的研究者聚合在一起。然而，無論基於什麼原因，這股思維運動一直以來幾乎未觸及經濟學理論。現在時候到了，我們應該看看這個新理念如何應用到這個極端複雜但無疑展現自組織樣態的系統——也就是我們稱之為經濟的系統。


    > ——保羅·克魯曼（Paul Krugman），《自組織經濟》

    （*The Self-Organizing Economy*）


    # 套用齊夫定律


    這裡有一個方法可以解除雨天午後的無聊——選個文本，例如詹姆斯·喬伊斯（James Joyce）的《尤利西斯》（*Ulysses*），然後為書中所有的文字排序（從使用次數最多到使用次數最少），並列出其使用次數。¹
    如果你以等比對數尺度來表述這些字的使用分佈，你將會畫出一條從左上角到右下角的直線。²


    哈佛大學語言學家喬治·齊夫（George K. Zipf）自 1930 年代在不同的系統中發現這種數字關係，並且在他的名著《人類行'
  merge: -1
  img_proc: true
- pgno: 338
  md: '為與最小努力原則》（*Human Behavior and the Principle of Least Effort*）裡總結他的觀察。他的發現被後來的科學家人稱為「齊夫定律」，而這其實只是眾多「冪定律」之一。以語言為例，冪定律意味著你會頻繁遇到少數的字，而有許多字是相對少見的。


    齊夫錯誤地聲稱他所發現的定律區分了社會科學與自然科學。他的研究發表之後，科學家持續在許多領域如物理學與生物學系統裡發現冪定律。例如，科學家利用冪定律解釋動物的質量與新陳代謝率的關係、地震的頻率與強度的關係（古登堡－芮奇特定律〔*Gutenberg-Richter
    law*〕），以及雪崩的頻率與規模的關係。冪定律在社會系統裡也很顯著，實例包括收入分佈（帕雷托法則〔*Pareto’s law*〕）、城市規模、網路流量、公司規模，以及股價變化。許多人因為俗稱的「80/20
    法則」而認識冪定律。³


    為什麼投資者需要知道冪定律？第一，冪律分佈的存在有助於重新調整我們對風險的理解。大多數金融理論，包括風險模型，背後都假設股價變化呈現常態或對數常態分佈。冪律分佈表明遠大於理論所預期的價格變化儘管出現頻率極低，但總會間歇性發生。這樣的肥尾現象對投資組合建構和槓桿操作非常重要。


    第二，冪定律提示了自組織系統的一些潛在秩序。即使科學未完全解釋冪定律作用於社會系統的背后機制，但我們有足夠的證據顯示冪定律確實存在，並且能藉此為某些系統的未來狀況進行結構性預測。


    最後，標準經濟學理論並不太能夠解釋這類冪定律。例如，'
  merge: -1
  img_proc: true
- pgno: 339
  md: '新古典經濟學聚焦於均衡結果，並且假設個體擁有充分資訊、思維理性，然後（透過市場）間接彼此互動。在真實世界，人們會調適、缺乏完整資訊，並且直接與他人互動。所以，我們應該利用某種真實反映人們行為模式的觀點，為經驗觀察尋找解釋。$
    ^{4} $


    # 萬變中的不變定律


    齊夫用一道非常簡單的公式來表達他的定律：


    秩 x 數 = 常數


    以上等式說明研究對象的數量跟其排序成反比。有了齊夫公式，我們可以將常數乘以 1、1/2、1/3、1/4 等等而得到一個序列。以西班牙城市規模的分佈為例——如果最大的城市馬德里有
    300 萬居民，第二大城巴塞隆納就有其一半的人數，而第三大城瓦倫西亞則有三分之一居民，以此類推。齊夫定律確實能夠完全描述某些系統，但若針對所有各式各樣展現幂定律的系統，則齊夫定律顯得過於狹隘。


    優秀的博學家本華·曼德博指出，對齊夫定律做出兩處修改，即可得到一個更為普遍的幂定律。$ ^{5} $ 第一個修改是為秩數加上一個常數。序列於是變成：1/（1+常數）、1/（2+常數）、1/（3+常數），以此類推。


    第二個修改是為分母原有的 1 次方加上一個常數，於是序列成了：1/（1+常數）$ ^{1+常數} $、1/（2+常數）$ ^{1+常數} $，等等。這個修改'
  merge: -1
  img_proc: true
- pgno: 340
  md: '的乘幂可以是整數或中間值，(如 $1/ (1 + \text{常數})^{3/4}$ )。齊夫定律於是成了兩個常數皆為零的特例。


    即使加入這兩個參數，將齊夫定律概括到更廣的幂定律仍然相當簡易。一個基礎的方程式即說明了如此多樣的現象，確實讓人嘆為觀止；而且對於幂定律我們甚至只知其然而不知其所以然，因此這一切就更奇妙了。


    幂定律在社會系統裡的一項有趣特徵，就是穩健性。例如，圖表 35.1 顯示 1790 年至 1990 年美國城市的規模排序及其人口數。儘管人口增加及巨大的地理變遷，然而城市規模排序及其人口數卻在
    200 年來維持驚人的一致性。


    另一個例子是公司規模，這與投資者有更切身關係。圖表 35.2 顯示 1997 年美國公司銷售額與次數之間的關係符合齊夫定律。經濟學家羅伯特·艾克斯蒂爾 (Robert
    Axtell) 根據美國人口調查局 (Census Bureau) 數據繪製這個圖表；美國人口調查局的資料直至 2001 年年初才公布，其中包含 550 萬家公司與超過
    1 億名員工。


    艾克斯蒂爾發現，公司規模的分布並不受政治與監管環境的改變、公司併購熱潮、新公司冒現或公司倒閉趨勢，甚至勞動力的大幅度人口學變遷（例如女性進入勞動市場）等等因素的影響。$^{6}$
    這意味著背後必定存在某種重要機制在形塑我們所見的秩序。'
