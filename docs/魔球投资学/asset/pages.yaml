- pgno: 87
  md: '下。）諾貝爾物理學獎得主愛德華·珀塞爾（Edvard Purcell）爬梳了棒球運動的連勝與連敗記錄之後，總結道：棒球賽中所發生的一切都符合機率——除了迪馬喬的連勝記錄。⁵


    迪馬喬無疑是個傑出的打擊手，他在棒球職業生涯中的打擊率排名為第 27；但是，即使是像他這麼優秀的球員，如此連續安打記錄的發生機率也只有百萬分之一。⁶ 基於這個原因，許多偏向相信數據的球迷都認為迪馬喬創下的記錄不太可能被打破。⁷


    # ### 拋開擲硬幣遊戲


    大多數金融界的專業工作者把基金經理的連勝表現（連續幾年跑贏市場基準）歸因於好運氣。例如，金融學課程的教師樂於使用擲硬幣遊戲來比喻市場效率。⁸ 背後的基本概念是：如果基金經理的樣本足夠大，那麼依據機率便可知當中有部分經理會連續幾年表現優於市場。如果以
    1000 檔基金來說，假設跑贏市場的機率為 50%，那麼，會有大約 30 檔基金將會連續五年跑贏市場：0.5⁵x1000。


    這樣的邏輯本身並沒有問題。問題在於不是所有基金經理都擁有相當的技藝——投資理財的領域裡也有屬於這個領域的空心球高手莎麗和空氣球投手艾倫。所以，把任何取得連勝表現的基金歸因於機率，將會忽略一點——技術好的參與者最有可能連續取勝。


    共同基金領域中最為引人注目的連勝表現，非美盛基金的比'
