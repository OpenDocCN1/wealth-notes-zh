  md: '開在平台上，並且註明給解答者的現金報酬金額。解答者來自四面八方，大約有一半是美國境外的科學家。


    Innocentive 的成果如何？現在還言之過早，不過一些早期成果確實相當令人鼓舞。以 P&G 公司為例，這家公司在 2002 年的研發預算為 17 億元，員工人數大約
    9500 名，其中 1200 人持有博士學位。研發部門主管拉里．休士頓（Larry Huston）說，公司會使用 Innocentive 的服務，因為「那都是一些我們公司內部無法解決的困難問題」。在
    Innocentive，P&G 第一次拋出的難題之中有 45%得到解方，超出原本設定為三分之一的目標。


    P&G 的成功突顯了多樣化「解答者」的重要性。休士頓說：「解決我們第一道難題的，是一位來自北卡羅來納州的專利代理人，他的日間專業是專利法律，晚上當他的妻子在家閱讀言情小說時，他則研究化學——至少他是這麼說的。我們的第二道問題被一位來自西班牙的研究生解答，第三個解答者來自印度邦加羅爾，第四個則是自由執業的化學顧問。」


    我們不難想像，如此的「問題—解方」配對在其他領域也可能有用。儘管面臨一些實際的障礙如智慧財產權議題以及內部資訊或競爭情報的不當散播，Innocentive
    模式仍算是往前跨出了一大步，像在各式各樣的乾草堆中尋找細針般地發掘珍貴想法。


