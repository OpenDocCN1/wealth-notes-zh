  md: '# 圖表 20.1 S形成長曲線往往導致認知差距


    ![](img/501b8eadc4f653d4e86fc862268abf1c_214_0.png)


    來源：作者分析。


    我的目標是證明A點到B點的轉移帶來超額報酬的機會，而B點到C點的移動則往往導致不理想的股價走勢。指認出這些轉折點，對投資者而言大有助益。第一個原因是，加速的創新步調使人確信產業與產品的生命週期正在縮短。
    $ ^{7} $  創新的浪潮來得越來越快，產業有更多的機會經歷A點至B點的轉向，而投資者必須更靈敏地捕捉這些期望修正的時刻。


    第二，一旦某個經驗「烙印」在身上，人們通常就會陷入自動化行為的模式。例如，某些股票近期的良好表現將會在許多投資者心中烙下印記。結果，經歷困難時期時，投資者會轉向過去那些讓他們的投資組合表現優越的股票。
    $ ^{8} $  那些企業往往已經來到B點，因此成了投資者本該避免的股票。在瞬息萬變的世界，把賭注押在新兵總比押在老兵好。你或許不知道哪一家新公司會給你帶來超額報酬，但你幾乎可以肯定老公司是無可期待的。'
