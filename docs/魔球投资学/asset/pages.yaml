  md: '# ## **36** 數字金字塔

    ——公司規模、成長率與評價


    成長很重要，因為企業透過可獲利的成長創造股東價值。然而，有力證據顯示一旦公司的核心業務進入成熟階段，繼續追求新的成長立基點往往伴隨著驚人的風險。大約一成的公司成功連續數年維持真正能夠以高於平均水準提升股東報酬的企業成長率。所以，大多數經營者處於雙輸局面——股票市場要求他們成長，但他們難以找到成長的方法。


    ——克雷頓·克里斯汀生（Clayton Christensen）和邁可·雷諾（Michael Raynor），《創新者的解答》（*The Innovator''s
    Solution*）


    分析師和投資者似乎相信許多公司的盈餘可以連續好幾年維持在高水準的成長率。證據顯示，這種情況得以實現的機會跟純然的偶發沒有多大差異。


    ——陳國器（Louis K. C. Chan）、傑遜·卡瑟其（Jason Karseski）和約瑟夫·拉科尼薛（Josef Lakonishok），〈成長率水平及持久性〉（*The
    Level and Persistence of Growth Rates*）


    # ### 為什麼大型凶猛動物如此稀少


    表面而言，物種、城市和企業的規模和機率分布似乎沒有太多共同點。然而，每一項都依循幂律分布，在對數尺度的圖表中'
  merge: -1
  img_proc: true
- pgno: 347
  md: '顯示為直線。冪律分布意味著許多小規模事件及極少數的大規模事件。¹在自然界，螞蟻的數量很多——螞蟻的體重總和大於人類體重總和；但是大象的數量卻相對稀少。同樣的，我們看到市場裡有許多小公司，但大型公司的數量卻不多。圖表
    36.1 並列了幾個這類分布的例子。


    # 圖表 36.1 物種、城市和企業規模的分布


    ![](img/501b8eadc4f653d4e86fc862268abf1c_347_0.png)


    來源：Marquet et al., “Lifespan, Reproduction, and Ecology”; van Marrewijk, “International
    Trade and the World Economy,” http://www.few.eur.nl/few/people/vanmarrewijk/international/zipf.htm;
    Axtell, “Zipf Distributions,” 1819.經許可引用。


    以物種分布為例。為什麼大型肉食動物如老虎相對稀少，而小型動物如白蟻則大量存在？生態學家認為原因在於所有動物都'
  merge: -1
  img_proc: true
- pgno: 348
  md: '有其生態棲位（niche）——不僅是物理位置，而是在萬事萬物中的真實位置。物種不僅僅在生存空間裡過活，還必須跟同在一個空間的其他動植物互動。


    不過，生態棲位的概念仍然無法解釋物種的分布樣態。這個洞見來自牛津大學生物學家查爾斯・艾爾頓（Charles Elton）——他發現大型動物需要較小型的動物以維持生存。（動物鮮少捕食大型物種。）所以，艾爾頓如此推論：每一次的體積增加，就會發生相應的數量減少。他稱這個生命現象為「數字金字塔」。大型的凶猛動物稀少，因為他們比小型動物擁有更少的能源資源。$
    ^{2} $ 物種的幂律分布是動物之間交互作用，再加上物理法則的限制而產生的自然結果。$ ^{3} $


    這一切跟股票市場有什麼關係？投資者應該注意這類分布形態，原因有三。第一，企業就跟物種一樣，適應於自己的生態棲位或利基市場之中。$ ^{4} $ 思考公司的利基市場及其變化，能夠讓投資者得到一些有關企業成長潛力的洞見。


    第二，大量可靠的證據顯示大型公司的成長率變異數低於小型公司（儘管成長率的中位數相當穩定）。而且，大公司的成長往往會進入停滯狀態，導致投資者重新調整期望而壓低股價。


    最後，投資者總是把過去的成長率推及未來，無法維持過往成長率的公司便只能給出令人失望的股票報酬。對公司成長的分布模式有所意識的投資者，或許就能避免這類不利的期望落差。'
  merge: -1
  img_proc: true
- pgno: 349
  md: '# 尋找你的利基


    公司尋找利基，這並不是新穎的概念。一般的競爭策略研究，或者更具體的博弈理論，都有許多面向觸及企業尋找利基市場的方法，也闡述了企業為何有此需求。這裡要傳達的主要訊息是：技術發展、法規變化、產業新進者與退場者的更替，這種種因素改變了環境，因而改變了利基市場。


    想想小型工廠和綜合性鋼鐵公司的對比，或者網路零售商跟實體門市對比。新的利基被開啟，然後新公司進場占據利基。企業對環境變遷的適應能力非常關鍵——只有少數公司具備這樣的能力。


    因此，特定產業的理想公司規模並非僵固不變；比較不同經濟模型之下的企業估值，也是沒有意義的。


    # 致CEO：我們已成功晉升財星50大！你被開除了


    針對公司規模分布與成長率的研究，揭示以下四點：


    +   1. 公司規模分布依循齊夫定律（冪定律的某種特定類別）：5 對投資者而言，重點在於這樣的分布在顯著的經濟變遷之下仍然展現其穩健性。這意味著超大型公司和極小型公司之間的比例在未來不太可能會改變。


    +   2. 公司成長率的變異數隨著公司規模增加而降低：6 我的分析指出，以美國上市公司（銷售額超過 1 億元）組成的龐大樣本'
