  img_proc: true
- pgno: 261
  md: '競爭在定價和生產增量這兩件事上尤其珍貴。我將引用賽局理論裡的一些概念來說明合作關係如何形成，也論及合作的形成為何極其困難。當只有兩大競爭對手支配合乎整個產業的時候，合作性競爭的手段特別有用。


    # ### 戀愛與婚姻為何天差地別


    賽局理論研究的是玩家之間為了最大化回報而採取的互動方式。這樣的分析十分棘手，因為回報是由玩家的行動（以及回應）所決定。所以，賽局理論迫使企業經營者的思考不再僅限於自己的選擇，還要慮及這些選擇將如何影響對手的選擇。並非所有經營者都自然而然地把自己放置到競爭對手的立場上去思考。看看以下引述自某家跨國造紙公司財務長的話：


    > 當你想著要建造一間新的造紙廠時，你的決策奠基於你對經濟成長的一些假設。然而，我們似乎不曾把競爭對手的反應納入考量。還有哪些人會在同一個時間點想要建造工廠或引入機器？


    賽局理論中有一個簡易但強大的模型——囚徒困境（Prisoner’s Dilemma）。思考以下情境：兩家競爭企業必須在週期頂峰時決定是否增加產能。圖表 26.1
    顯示各種行動帶來的回報。如果 B 公司增加產能而 A 公司沒有增加（右上角），B 公司會得到不成比例的高回報。相對的，如果 A 增加產能而 B 沒有增加（左下角），好處將歸於
    A。如果雙方都增產（右下角），'
  merge: -1
  img_proc: true
- pgno: 262
  md: '總回報下降，A 和 B 所得到的都少於他們單獨增產的時候。最後，如果兩家公司皆不增產（左上角），則產業的總體回報才是最高的，但個別公司的回報都不及他們單獨增產時所得的。


    # 圖表 26.1 產能與囚徒困境



    | 競爭企業 B | 不增產 | 增產 |

    |---|---|---|

    | **不增產** | B | B |

    | A | A |

    | 35 | 40 |

    | 35 | 25 |

    | **增產** | B | B |

    | A | A |

    | 25 | 30 |

    | 40 | 30 |



    來源：作者分析。


    進入這樣的賽局，公司該有什麼行動？假設你是 A 公司，而相信你 B 公司不會增產。你的最佳策略便是增加產能。但是，假設相信你 B 公司將增產，你的最佳選擇仍然是增產。所以，無論競爭者
    B 公司怎麼做，如果你只是玩這麼一局，則增產的話就肯定不會吃虧。然而，兩家公司都不增產才會提升總體價值。個別公司的理性選擇並非總是最有利於總體產業的選擇——這是賽局理論所揭示的其中一個要點。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '商場就像我們例子裡中的那場壕溝戰，對決不僅一次，而是持續不斷的互動。所以，玩家不只是應對一局囚徒困境，兩家公司必須一局又一局地玩下去。一再重複囚徒困境很可能會形成某種合作關係，因為兩家公司必須在其中「學習」如何共處。


    政治學家羅伯特·艾瑟羅德（Robert Axelrod）在 1980 年代透過一場比賽來確認應對重複囚徒困境最有效的策略（每一局比賽有兩百步）。勝出的是「以牙還牙」（tit-for-tat）策略——開始時選擇與對方合作，之後就視對方的行動來決定我方的下一步行動。以牙還牙策略在賽局開始時預設最好的狀況，對方背叛即馬上得到負向回饋，而對方停止背叛時即馬上原諒。¹


    多種原因造成商業世界裡的合作關係瓦解，或者合作關係根本無從開始。信號品質是其中一項重要因素。有時候，企業會嘗試向對手發出想要合作的暗示，但這些暗示過於含糊，或被誤讀。另一項因素則是企業記憶（corporate
    memory）。儘管兩週期型的企業處於長期競爭狀態，當經營者在週期頂峰考量是否增加產能時，他們往往還是會忽視長遠視角（無論是過去或未來），而把當前處境視為一次性的囚徒困境。


    # 價格與銷量


    澳洲雪梨的兩家晚報《太陽報》（*The Sun*）和《每日鏡報》（*Daily Mirror*）緊隨彼此腳步，在 1974 年之前的三十年間一致逐漸提高售價。帶領售價調整的向來都是《太陽報》。到了
    1975'
  merge: -1
  img_proc: true
- pgno: 264
  md: '年，情勢開始改變。《太陽報》當時把售價從 10 分調整到 12 分，但魯柏·梅鐸（Rupert Murdoch）所擁有的《每日鏡報》卻不再跟進。《鏡報》的發行量因低價而上漲，公司隨即提高廣告費，於是獲利更多。相反的，《太陽報》的盈利下滑，並且最終在
    1979 年將售價調降回 10 分。^{10}


    這只是其中一個可以使用賽局理論來分析的實例。以牙還牙策略促使《太陽報》迅速將售價調回 10 分，破壞了《每日鏡報》因選擇負向策略而獲得的回報。


    經營者和投資者可以利用以牙還牙策略來分析動態的價格拉鋸戰，^{11} 應用在美國電影產業、美國即食穀麥片製造業、哥斯黎加香菸市場等等都很有效。儘管這樣的分析架構最適用於兩大對手明確競爭的領域，但只要有足夠的產業集中度，也可套用。


    賽局理論對增產評估也相當有用。在許多週期型產業，如汽車、化學、紙、航空與能源等領域，企業往往會在週期高峰出現時評估增產。這項分析適用於高峰時期，因為這時候的市場需求最穩固，且公司常通有財務餘裕來增加產能。


    儘管如此，如前例所說的，所有公司同時增產將削減高峰期的回報，並且造成後續低潮期的生產過量。布蘭登伯格（Brandenburger）和奈勒波夫（Nalebuff）在他們有關賽局理論的著作《競合策略》（Co-opetition）一書中，指出抑制供應的策略利多於弊。^{12}'
