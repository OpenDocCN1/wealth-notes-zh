    # ## 投資者風險


    如本文所述，投資者為市場活動尋求解釋時必須時時謹慎，以免陷入兩大誤區。


    第一種錯誤是因果關係的混淆。某些事件可能跟市場動向有'
  merge: -1
  img_proc: true
- pgno: 333
  md: '所關聯，但不完全是事件原因。舉一個極端的例子：美國加州理工學院的大衛·林韋伯（David Leinweber）發現，S&P 500 指數表現的最佳預測指標，是孟加拉的奶油產量。8
    當然，沒有一個具備思考能力的投資者會使用奶油產量來預測或解釋市場走向；然而，跟美國有更密切經濟關係的各種因子，都有可能被套上錯誤的因果關係。


    第二個誤區是錨定效應。種種跡象顯示當人們要解釋或敘述事件時，往往會錨定他們所聽聞到的第一個數目或第一份證據。在某個例子裡，研究者要求受試者估算聯合國裡非洲國家的比例。不過，開始回答問題時，受試者觀看研究者轉動一個標示著
    1 至 100 的命運之輪。當輪盤指向 10 時，某一組的受試者回答 25%。當輪盤指向 65 時，另一組受試者回答 45%。9 這個例子可能看來瑣碎無意義，但投資者確實在相似的錨定效應之下做出重要的財務決策。


    我們亟欲了解因果關係，這是人類與生俱來的欲望；但股市不是一個滿足欲望的好地方。對於市場動態的潛在解釋，投資者必須保持保留態度。所以，早上翻開報紙閱讀有關前一天的市場動向時，就當作是種娛樂吧。'
