- pgno: 328
  md: '生物學家劉易斯·沃伯特（Lewiss Wolpert）認為，因果概念是人類演化的根本驅力。理解某個因可能造成的果，並且為眼前的果找出原因，這從演化的角度來說是有益的。沃伯特說，因果概念、語言，以及社會互動等等元素組合合成演化的驅動力，提升了人類大腦的大小和複雜度。³


    所以，尋求因果關係是人類的本能。而且，為結果捏造原因，其實也是我們能力所及的事。在人類存在歷史中的大部分時候困擾著我們的種種原因不明之事，如疾病、閃電、火山爆發等等，如今大多已被人類所理解。而我們的祖先當初會轉向超自然力量尋求解釋，這種行為實在不足為奇。


    今天，我們已有能力理解許多系統，但仍然對某種大型且相互連結的系統感到棘手——這類系統通常被稱為複雜適應系統。我們無從透過分析系統內部的異質個體而掌握複雜適應系統的總體屬性和特徵。這些系統並不是線性或疊加而成的；整體不等於部分的加總。因此，當中的因果關係無法以任何簡單的解釋來表述。股票市場就是這類型系統的絕佳實例。⁴


    在投資的操作中，我們想要連結因果的天生欲望，跟市場裡因果關係模糊的特性相抵牾。所以，我們會怎麼做？我們本能地為了解釋因果關係而杜撰故事。


    投資者為何在意市場裡的因果關係？我們對於解釋的渴望一方面是為了避免犯錯。堅持要為市場走向尋找原因的投資者，可能會因此著眼於有缺失的因果關係，或不當地附著於某種錯誤的'
  merge: -1
  img_proc: true
