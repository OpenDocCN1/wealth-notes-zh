  md: '個突觸連結，這是成年人的兩倍。相較於大人，小孩的頭腦更活躍、連接更豐富，而且更靈活。²


    但是，突觸增生之後將進入一個重要的修剪過程。在經驗中發揮用途的突觸連結將被強化，而無用的連結則被修剪掉（赫布理論說明了這個過程，由心理學家唐納德·赫布［Donald
    Hebb］提出）。³根據估算，小孩每天失去大約 200 億個突觸連結。⁴這個程序將對大腦進行微調，以適應特定環境。到了我們成年時，突觸的挑選過程早已塑造了我們的腦袋，讓我們準備好去追求成功。


    突觸的過度生長與修剪似無奇特之處，但若考量到神經元組與能量方面的成本，這樣的機制其實異常奢侈。為什麼人類的演化最終會保留一個如此浪費資源的機制？自然法則何其巧妙。類神經網路的模型顯示，過度生長後再修剪的取徑帶來靈活性，而且其保存資訊的能力比前饋神經網絡（feed-forward
    network）更可靠。從大量的選擇開始，再從中篩選出最有用的——這即使看來效率低落，卻是最穩健的過程。⁵


    投資者和企業家為什麼會關注神經系統的發展？神經元的過度生長以及後續的修剪機制，顯然跟新產業冒現時的狀況很相似。投資者若了解這個過程，將會得到三大益處。第一，這過程其實就是創新模型，不僅理論上成立，甚至已通過研究者的實際測試。第二，這個過程可以為投資者提供一個立足點去了解市場上的狂熱或泡沫現象。最後，這一切證實了創新過程往往帶來投'
