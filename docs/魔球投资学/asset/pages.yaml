  md: '我擦鞋卻不要求任何回報，這怎麼可能？」


    所以，我做了一件我猜想大部分人接受服務之後都會做的事——找找看有什麼東西可以買。我總要有所回報吧。因為我當時不需要鞋子，於是竟不知不覺地端詳起店裡的鞋撐、鞋帶和鞋油。最後，我雙手空空地溜走，心裡不太好過。雖然我成功逃離現場，不花一分錢，但我想大部分人並沒那麼幸運。


    人類為何如此行動？——這是在投資領域甚至在生活中極度令人著迷的問題。經歷了那一次讓人額頭冒汗的擦鞋服務，我在幾個月後讀了羅伯特·席爾迪尼（Robert Cialdini）的著作《影響力：讓人乖乖聽話的說服術》（Influence:
    The Psychology of Persuasion）。¹ 這本書為以上問題提供了許多解答。


    席爾迪尼過去三十年來的工作焦點，在於解答這個問題：什麼因素能誘導人們做出特定的行為改變，也就是順從某項要求。席爾迪尼指出，人類行為有六大傾向，會促使人們對某項要求做出正面回應。²
    了解這所有的行為傾向，對我們的日常生活而言是很重要的；而當中有幾項對投資者來說尤其重要。


    閱讀了席爾迪尼的書，我意識到那家鞋店正在利用的就是人類行為中的基本規律——互惠原則。如果某個人給你一些東西，你會覺得自己也必須有所回報。如果你想要利用這種先天的行為傾向來取得好處，那就先施予小惠，然後要求大回報。兩元的擦鞋服務換取兩百元的翼紋紳士鞋，這絕對是好交易。'
