  md: '好的，以下這樣的現金流，就看你如何估值：假設莊家投擲一枚勻稱硬幣。如果得到正面，你獲得兩元，然後遊戲結束。如果硬幣顯示反面，莊家就再投擲一次。如果第二次投擲得到正面，你獲得四元；如果反面，遊戲繼續。每投擲一輪，得到正面的賠金都會倍增（即
    2 元、4 元、8 元、16 元等等）；你將一再進入下一輪，直到你得到正面硬幣。你願意付出多少錢玩這個遊戲？


    出身著名數學家家族的丹尼爾·白努利（Daniel Bernoulli），1738 年在俄羅斯皇家科學院首次提出這個問題。¹ 白努利的遊戲，也被稱為聖彼得堡悖論（St.
    Petersburg Paradox），對古典理論提出挑戰——古典理論認為玩家願意付出遊戲的期望值以參與遊戲。這個遊戲的期望值是無限大的。每一輪期望值都有一元（機率為
    $1/2^n$，賠金為 $2^n$ 元；或者，1/2x2 元、1/4x4 元、1/8x8 元，以此類推。）所以，


    期望值$=1+1+1+1+...= \infty$


    然而，即使只要付出 20 元玩這個遊戲，也只有極少人願意。白努利試圖以錢幣的邊緣效用來解釋這個悖論。他指出，你願意付出的數額取決於你的資源——你的資源越多，你就願意付更多。可是，白努利的解釋並不完全令人滿意。聖彼得堡悖論讓哲學家、數學家與經濟學家陷入兩個半世紀的思索。²


    先把哲學論述擱置一旁，聖彼得堡悖論確實有助於投資者洞悉兩個具體的概念。第一，股市報酬並不依循標準金融學理論所'
