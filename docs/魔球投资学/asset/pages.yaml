  md: '一般的擲硬幣遊戲和聖彼得堡悖論的對比說明了這一點。假設硬幣翻開正面你就得到 2 元，反面則什麼都沒得到，則這個遊戲的期望值為 1 元，這也是你願意在公平的賭場玩這個遊戲而付出的數額。我模擬了一百萬遍遊戲，每一遍的模擬都有
