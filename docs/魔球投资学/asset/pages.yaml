- pgno: 130
  md: '我會大略說明每個行為傾向，並且闡述售賣者如何利用這些行為傾向；而且，我會著重於對投資者最為重要的三大傾向。


    # 你可以愚弄人性


    人類行為的六大傾向是互惠、承諾與一貫性、社會認同、喜好、權威，以及稀有性；以下是各個面向的簡略闡述。雖然席爾迪尼並沒有如此強調，但我相信這些行為傾向皆深植於人類的心理演化過程。每一種行為都對我們人類祖先的繁衍有所貢獻。


    +   * **互惠：**研究顯示每一個人類社會的成員都背負著互惠的義務感，無一例外。\({}^{3}\)企業組織充分利用這種人類行為傾向，從送出免費回郵標籤的慈善機構，到提供免費房屋估價服務的房地產公司，都是如此。


    +   * **承諾與一貫性：**一旦我們決定了某件事，就不太願意再改變想法，如果該項決策早已得到大眾認可，情況更是如此。席爾迪尼為此提出兩個深層的理由。首先，一貫性讓我們可以停止思考這個問題，也就是說，我們的精神可暫時休息。第二，一貫性讓我們可以避開理性推論所引至的結果，也就是改變。第一點讓我們躲避思考，第二點則讓我們躲避行動。


    +   * **社會認同：**我們做決定的主要方法之一，就是觀察別人的決定。\({}^{4}\)心理學家所羅門·阿希（Solomon Asch）的著名實驗說明了這一點。他讓八位一組的受試者共處一室，給每一組受試者觀看的圖片中含有不同長短的垂直線條。他要求受試者辨識'
