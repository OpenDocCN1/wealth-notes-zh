  md: '# ## 12

    ### 一切準備就緒

    #### ——決策中的情感與直覺


    人們對某項活動或某個科技的評論，依據的不僅是他們的想法，還有他們的**感覺**。如果他們喜歡某項活動，就會傾向於降低風險評估、提高利益評估；如果他們不喜歡該活動，評價則相反——高風險、低利益。在這樣的模型之下，情感優先，並且引導利弊評價的方向。


    > ——斯洛維克（Slovic）、菲紐肯（Finucane）、彼得斯（Peters）和麥奎格（MacGregor），〈分析的風險與感受的風險〉（Risk as
    Analysis and Risk as Feelings）


    我們有時候會自欺欺人，以為自己很理性，凡事權衡利弊得失。但是事實往往並非如此。通常，「我決定選擇 X」其實不過就是「我喜歡 X」。我們買下「喜歡」的車子，選擇「吸引」我們的工作和房子，然後再以各種理由來合理化我們的選擇。


    > ——羅伯特・札瓊克（Robert B. Zajonc），〈感受與思考：喜好不需要推論〉（Feeling and Thinking: Preferences
    Need No Inferences）


    如果沒有生物調節機制的引導力量，無論就物種演化或個體層次，人類的理性策略或許就不會發展成形；而生物調節機制的顯著表現即是情緒與感受。而'
  merge: -1
  img_proc: true
- pgno: 138
  md: '且，即使理性策略早在形成時期已經穩固成形，其有效運用仍然可能在某種程度上依賴於經驗感受的能力。


    > ——安東尼·狄馬吉奧（Antonio Damasio），《笛卡爾的過失：情緒、理性，以及人類大腦》（*Descartes’ Error: Emotion,
    Reason, and the Human Brain*）


    # 情緒與決策


    神經科學家安東尼·狄馬吉奧（Antonio Damasio）訴說著他如何在職業生涯的早期階段即意識到傳統觀念對理性的看法是錯誤的。他見過一位病人，理性行為能力都完好無損——專注力、記憶、邏輯思維等都正常運作。但是，腦部損傷讓這位病人失去了體驗感受的能力，因而在日常生活中的決策能力也被剝奪了。狄馬吉奧看到了當中的連結——受損的感受能力，以及決策能力的缺陷，這兩者之間是緊密關聯的。$^{1}$


    狄馬吉奧後來的研究工作證實了他的觀察。在某個實驗裡，他讓受試者戴上膚電反應（skin-conductance-response）感測器，然後要求他們在前面的四疊紙牌中每次摸出一張；這四疊牌堆中，有兩疊牌會讓他們贏錢（遊戲代幣），另兩疊則會讓輸錢。每當受試者翻出一張牌時，狄馬吉奧都會問他們的想法，請他們說說正在發生的事。大約翻出十張牌之後，受試者每翻開輸錢的牌堆時，都會顯示某些身體反應。實驗進行到大約第五十張牌時，受試者表達了他的直覺，說其中兩疊牌的風險較高。然'
  merge: -1
  img_proc: true
- pgno: 139
  md: '而，實驗要再繼續翻出三十張牌左右，受試者才能說出為什麼他們的直覺是對的。$ ^{2} $


    這個實驗告訴我們決策過程中兩個非比尋常的發現。第一，在我們的意識還未覺察之前，無意識早已知道正在發生的事。第二，即使受試者未曾說出他們所感受到的當下狀況，他們無意識的身體反應仍然會引導他們的決策。


    當狄馬吉奧把這個實驗對象換成腦傷病患時，受試者沒有呈現任何持殊反應。從膚電反應感測以及受試者的口頭說明看來，病患無論在意識或無意識的層次上都無法理解當下的狀況。$
