  md: '第一組平均擁有 15%的初始 CFROI，但僅僅五年後即減至 6%。表現最差的一組則在五年內從負 15%的報酬率攀升至接近零的水平（但仍然低於資本成本）。中間兩組相對穩定地處在資本成本的水平。表現最好與最差的兩組在第一個測量期間的落差高達
    3000 個基本點，十年後落差只剩下 300 個基本點。雖然十年的时间不足以經歷完全的均值回歸，但這段期間內的大部分進程都一再證實了均值回歸的作用。


    在第四組裡，對手的耗損是企業報酬改善的核心因素；這一點與理論相符。第四組裡只有 60%的企業在五年後繼續存活，許多表現不理想的公司都宣告破產或被收購。公司耗損的現象導致倖存者偏差（survivorship
    bias），十年間的報酬率因而得以回升。相對的，第一組的企業之中有 85%在五年後仍然活躍。所有四組的耗損率幾乎都在五年之後達到平衡。


    許多有關均值回歸的研究都一再得出相同的發現：有些公司（儘管並不多）有能力而且確實維持一貫的高報酬率。一項 1950 年至 2001 年涵蓋近 700 家零售商的研究顯示，14%的公司所獲得的報酬不曾低於其資本成本。$^{*}$1960
