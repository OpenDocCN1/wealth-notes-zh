    # 尋求多樣性


    迷宮和蟻群跟極具挑戰性的投資理財工作有何關聯？實際上，當中有許多連結。生理學家赫拉斯·巴洛（Horace Barlow）說，智力其實關乎的就是進行某個可能揭發新秩序的猜測。這包括解決問題、發現爭論的邏輯，或尋找適當的類比。5那麼，投資的智慧從何而來呢？


    這就是諾曼·強森的訊息對投資者的重要之處。在明確的系統裡，專家有其作用，因為他們提供了以規則為基礎的解決方案。但是，當系統變得複雜，集合起來的個體往往發揮比單獨個'
  merge: -1
  img_proc: true
- pgno: 285
  md: '體，甚至比專家更理想的解決問題能力。這意味著股票市場在大部分時候都極有可能比大多數人精明，而經驗資料確實證明了這個論點。


    強森接著說，要成為複雜系統如股票市場的專家，必須具備兩大特徵。第一，你有必須有能力在頭腦裡「模擬」情境以構思並選擇策略。 6 一段有關傳奇避險基金經理喬治·索羅斯（George
    Soros）的文字，正好說明了這一點：


    > 與索羅斯密切共事十五年的蓋瑞·格萊德斯坦（Gary Gladstein）以一種近乎神祕的方式形容他這位老間的工作狀態；他把索羅斯的專業連結到他在腦中具像化整個世界的金錢與貸款流向的能力。「他擁有整個世界的宏觀景象。他利用所有資訊，將之消化後產生出自己的想法，並且由此知道該如何篩選資訊。我會看所有的圖表，但他所處理的多數是言語的資訊，而不是統計數據。」
    7


    此外，你必須讓來自多元管道的資訊占據你的思維系統。模擬的能力或許主要來自先天（雖然你還是可以提升這方面的能力），但是對多元構想的追尋卻是你可以做得到的。


    心理學家唐納德·坎貝爾（Donald Campbell）以相似的方法描述這個狀況，稱創意思考的過程為「盲目的變異和選擇性的保留」（blind variation
    and selective retention）。換言之，創意思考者尋找各式各樣的構想，但只選擇對當前目標有利的想法。'
