    | | 低 | 高 |

    | 重量（預測的有效性） | 低 | 未顯示相關性 | 信心過高 |

    | 高 | 信心不足 | 明確結果 |


    來源：Dale Griffin and Amos Tversky, “The Weighing of Evidence and the Determinants
