  md: '爾·米勒莫屬——他所管理的價值信託基金在 2005 年之前連續 15 年表現優於 S&P 500 指數。過去 40 年來，再也沒有其他基金能夠維持如此長的時間跑在市場基準之前。當中的勝算從何而來呢？


    有些權威人士完全滿足於一味把米勒的記錄歸因於機率。例如，葛瑞格·拜爾（Gregory Baer）和蓋瑞·詹斯勒（Gary Gensler）寫道：「我們對美盛公司及其基金經理比爾·米勒的成果感到高興，但我們認為這樣的結果大致符合隨機機率，同時也是主動管理所帶來的結果。」廣受好評的債券經理比爾·格羅斯（Bill
    Gross）所做出的評論（前文引用）就更不可思議了。2003 年，連勝記錄進入第十二年，格羅斯咆哮說米勒的表現不過就是雙骰子連續十二次擲出七點。格羅斯擁有優異的業績記錄，也熟知賭博；我們只能希望以上的說辭只是某次的錯誤引用——連續十二次擲出七點的機率大約是
    22 億分之一。


    我們可以透過兩個方式來看米勒的連勝記錄。第一個方式，假設每年都有固定百分比的基金表現優於市場。接著，選取某個百分比，即可算出某一檔基金在某一年或連續每一年跑贏市場的機率（見圖表
    7.1）。例如，如果你假設共同基金的表現就像擲硬幣遊戲一樣，一半的基金跑贏市場，另一半則落後於市場，那麼，某一檔基金連續 15 年表現優於市場的可能性是 32768
    分之一。米勒連續超標的開端，當時只有 900 檔相似的基金，因此他的表現確實讓人嘆為觀止。'
