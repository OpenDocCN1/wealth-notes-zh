  md: '評估者不理會人們對骰子結果的信念為何，也不會在意骰子的設計如何。他們專注的僅僅是重複擲骰子所得的結果。


    至於股市的長期報酬率呢？大部分市場預言其實依據的是信念度，所估算的機率嚴重受到近期經驗的影響。信念度包含太多情感元素在其中。


    我們也可以從傾向性的角度評估股票市場。根據傑諾米·席格爾（Jeremy Siegel）的著作《長線獲利之道》（*Stocks for the Long Run*），過去
    200 年，包括其間多個較短的時期，美國股市實際上僅僅產生每年不到 7%的報酬率。⁴問題在於是否真的存在某種特徵導致經濟與利潤增長維持如此一貫的結果。


    我們也可以從頻率的觀點來看待市場。例如，我們可以觀察市場在 1926 年到 2006 年所產生的年報酬率。期間報酬分布的算術平均數為 12.0%，標準差 20.1%（假設常態分布適用於此）。如果我們假設未來的年報酬率與過去一樣（也就是說，過去的
    80 年是合理的參照組），就可以得出未來年報酬率的機率陳述。⁵


    以上三種估算機率的方法當中，金融學的學術社群主要使用的是第三個方法。大部分金融學模型假設價格變化依循常態分布。布萊克－休斯（Black-Sholes）選擇權定價模型就是一例，這個模型的關鍵輸入之一是波動率，也就是未來價格變化的標準差。'
