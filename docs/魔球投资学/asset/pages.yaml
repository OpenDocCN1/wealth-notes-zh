  md: '# 自以為的後見之明


    我們不得不提及一項人類的怪異特徵，否則就無法完整論述「預期」的所有面向——事件結束之後，我們傾向於相信事情發生之前我們就知道結果會是這樣，而實際上我們知道的比我們以為的還少。這現象稱為「後見之明偏誤」（hindsight
    bias），或所謂的「星期一早上的四分衛」（Monday-morning-quarterback）；$^{10}$研究顯示人們總是不太記得他們在還不知道結果之前是如何面對那些不確定狀況的。$^{11}$


    金融學教授赫什·舍夫林分析了前美國加州橘郡財務長羅伯特·希傳（Robert Citron）的幾個說辭，以此說明後見之明偏誤。$^{12}$ 希傳在 1993
    年 9 月的年度報告中寫道：「這十年，即使不降低利率，至少也要維持不變。肯定的是，至少在未來的三年裡，我們視野所及沒有任何事物顯示我們將會升息。」1994
    年 2 月，美國聯準會宣布升息。希傳回應道：「最近的升息對我們來說並不意外；這都在我們的預期之中，而且我們準備好了。」現在，希傳還有機會在利率調升之前改變他的看法。然而，這些聽起來言之成理的意見，正顯示他受困於後見之明的偏誤。


    理解自己做下某個決定的方式和原因，這才是有品質的回饋，但是被後見之明偏誤阻擋了。解除這種偏誤的方法之一，就是在決策的當下記下該決策的理由。留下的筆記將成為客觀回饋的珍貴資源，有助於我們提升未來的決策能力。'
