  md: '樣的想法是不合情理的——投資者自然想要他們的股票上漲，而非下跌。其實，展望理論最重要的實用性結論就是：投資者傾向於太早賣掉賺錢股（滿足想要正確的慾望），卻抱牢虧錢股太久（希望不用承擔虧損）。接下來，我們轉向三個不同的機率領域，即投資、同注分彩賭博及廿一點紙牌遊戲的優秀實踐者。


    # ### 從金融市場到賽馬場


    華倫．巴菲特無疑是二十世紀最優秀的投資人之一；他曾經說過，聰明才智就像是發動機的馬力，但是發動機的輸出功率則仰賴於理性。「很多人用 400 馬力的發動機，但卻只得到
    100 馬力的輸出，」他說。「那寧可使用 200 馬力的機器，然後物盡其用。」<sup>6</sup>而關鍵之一就是改以期望值的角度來考慮所有的投資機會。如巴菲特的合夥人查理．蒙格（Charlie
    Munger）所說的：「像巴菲特這樣的人，他的其中一項優勢就在於他總是自然地的決策樹（decision trees）的方式來思考。」<sup>7</sup>巴菲特說：「獲利機率乘以可能的利潤值，減去損虧機率乘以可能的損失值。這就是我們嘗試做的。不是完美的方法，但事情就是這樣。」<sup>8</sup>


    要確定可能會出現的結果及其相應的機率，當然並不是件容易的事。但是，過程中的紀律迫使投資者充分思考那些牽動公司價值的數字如銷售額、成本、投資額等等的預期出現各種變化時，持股價值將如何受到影響，同時考慮各種結果的可能性。這樣的作法也有助於克服「損失規避」的困境。<sup>9</sup>'
