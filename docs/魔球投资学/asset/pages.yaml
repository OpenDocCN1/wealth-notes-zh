  md: '# # 23 適者生存 ——適應度地景與競爭優勢


    > 存活下來的並不是最強大的物種，也不是最聰明的，而是對環境變化反應最靈敏的物種。


    ——查爾斯．達爾文（Charles Darwin），《物種起源》


    # ## 望向下一個高峰


    1997 年春天，老虎伍茲（Tiger Woods）不僅贏了威震天下的高爾夫名人賽——他甚至主導了這場賽事。賽場高手雲集，而老虎伍茲以 12 桿勝差脫穎而出。先釐清一下事件脈絡：當時伍茲參加巡迴賽還不到一年，而且只有二十一歲的稚齡。他已經參加過十五場
    PGA 巡迴賽，在四場勝出。高爾夫球迷將他與傑克．尼克勞斯（Jack Nicklaus）相提並論，而尼克勞斯被譽為有史以來最優秀的高爾夫球選手。


    伍茲如何看待自己的非凡成就呢？他並不認為自己的潛能已經發揮到極限。他從不鬆懈、放縱。相反的，他仔細研究他在名人賽中的錄影，最後得出驚人的結論：「我的揮桿動作有夠糟的。」¹


    伍茲請他的教練布奇．哈蒙（Butch Harmon）幫助他修正揮桿動作。哈蒙很肯定伍茲將會把他的球藝帶往更高層次，但也知道這個結果不會立即到來。伍茲會面臨短期表現下滑的風險，為'
  merge: -1
  img_proc: true
- pgno: 236
  md: '的是更好的長期表現。他豪不猶豫。跟哈蒙一起努力之下，伍茲改善了他的強度，也改變了握法，讓他維持力量的同時提升控制力。


    即使伍茲在 1997 年 7 月到 1999 年 2 月的巡迴賽中只贏得一場，他仍然堅信他成爲了比以前更好的高爾夫球手。他斷言：「獲勝並非總是實力提升的指標。」1999
    年春天，他的新揮桿法終於成形。接下來的十四場賽事中，伍茲贏得十場，其中包括八場 PGA 巡迴賽。2000 年，他再贏得九場 PGA 巡迴賽；直到 2001
    年在名人賽中勝出後，他成了第一個同時在高爾夫球界的四大錦標賽中奪冠的球員。


    # 適應度地景


    這個故事把我們引|導到「適應度地景」（Fitness Landscapes）這個概念。這是一個由演化生物學家發展出來的概念，用來幫助他們了解演化過程——具體而言，就是物種提升適應度的方式。
    $ ^{2} $ 然而，這個概念框架漸漸衍生出一些有益於商業策略家的構想。 $ ^{3} $


    適應度地景究竟是什麼樣子呢？想像一大片網格，每個網點代表的是可供物種（或公司）採用的策略。接著，想像每個網點的高度說明該策略的適應度。高峰代表高適應度，深谷代表低適應度。從公司的角度而言，適應度相當於價值創造的潛力。每家公司營運所處的地景都充滿高薪酬頂峰與損壞價值的深谷。
    $ ^{4} $ 地'
  merge: -1
  img_proc: true
- pgno: 237
  md: '景的布局有賴於特定產業的特徵。


    正如達爾文所說的，適應度的改善並非意味著變得更強大或更聰明，而是在於越來越適合你所在的環境。要達到更好的適應度，必須先產出選項，然後「挑選」當中「最好的」。在自然界，遺傳重組和突變產生物種多樣性，而天擇機制確保最適合的選項得以生存。$
    ^{5} $對公司而言，適應性關乎的是價值生產策略的制訂與執行，目標在於產生最高的長期報酬。


    因為適應度地景包含許多高峰和深谷，即使某個物種達到峰頂（局部的最佳化），並不一定表示該物種已經達到最高峰（普遍的最佳化）。為了達至更高處，物種可能需要降低短期的適應度以改善長期的適應度。公司的營運也一樣。關於老虎伍茲的經驗，這是個很好的比喻。


    適應度地景的概念豐富了我們對商業世界的想法。針對個別公司，你必須回答兩道問題。第一，從該公司的視角出發，適應度地景的樣貌如何？公司決策被所處的適應度地景所影響，但決策本身同時也在形塑地景。第二，就其所處的地景而言，公司是否採用正確的策略以逐漸改善其適應度（即經濟價值）？


    然而，必須要注意的是，你不應該聚焦於單一公司或產業，因為共同演化（coevolution）也正在發揮重要作用。作用引發反作用力；企業之間有時候彼此合作，有時候互相衝突。無風不起浪——各家企業永遠在運籌帷幄以提升地位。$
    ^{6} $而且，適應度地景的變動越大，其中的企業就需要更快速的適應步調。'
  merge: -1
  img_proc: true
- pgno: 238
  md: '回到第一道問題，我們可以用地景粗略區分成以下三大類型：平穩型、粗糙型、混亂型（見圖表 23.1）：


    +   □ **平穩型**：這些產業的適應度地景相當穩定。在許多情況下，地景相對平坦，唯有當週期性的市場力量對公司有 lợi時，才可能產生超額經濟報酬。擁有這類型地景的產業包括電氣與電信設施、商品生產（能源、紙、金屬）、資本財、非耐久消耗品，以及不動產投資信託。這些領域裡的公司可以打倒對手來改善自身的適應度。因為成長與拓展新業務的機會很有限，所以這類企業在結構上存在可預測性（也就是說，你會知道這些公司的未來會怎樣）。


    +   □ **粗糙型**：這些產業的適應度地景變幻不斷；改變速度相當高，但不可預測性更高。這裡的地景比較粗糙不光滑。有些公司的經濟表現明顯優於其他公司。例子包括金融服務、零售、保健，以及較成熟的科技產業。這些產業裡的公司面對一種顯明的風險——因顛覆性新科技的打擊而被淘汰（失去適應度）。


    +   □ **混亂型**：這種類型所涵蓋的公司處於極度動態之中、商業模式正在演化、充滿不確定性、產品供應持續變化。地景中的高峰與深谷持續變化，而且無從預測。大部分軟體業者、基因組學的相關產業、時尚相關領域，以及大部分新創公司，都處在這樣的地景之中。經濟報酬可能相當優渥（或前景備受看好），但通常轉瞬即逝。'
