  md: '測，兩者有所關聯。泰特洛克發現，「較有名氣，也就是較受到媒體擁戴的預測家，預測的準確度低於其他曝光率較低的同行。」$ ^{10} $ 這個研究讓我們又有了另一個理由對廣播和電視裡的評論人有所警戒。


    第二，泰特洛克發現狐狸的預測往往比刺蝟的預測來得更好。他寫道：


    > 表現優異者就像狐狸：他們懂得很多細小的事（他們的各種交易訣竅），對於宏大的格局抱持懷疑態度；在他們眼中，對事物的解釋和預測並不是基於演繹推論，而是一個彈性的「特設」過程，在其中把多元來源的資訊縫合在一起的；而且，他們以相當謙虛謹慎的態度看待自己的預測能力。$
