  md: '# # 你是專家嗎？

    ## ——市場裡的專家表現


    > 普遍來說，證據顯示專家意見只能帶來少許好處。令人驚訝的是，我找不到任何一項研究能夠證明專家的重要優勢。


    ——史考特・阿姆斯壯（J. Scott Armstrong），〈先知－無知者理論：論專家在預測中的價值〉（The Seer-Sucker Theory: The
    Value of Experts in Forecasting）¹


    # ## 人機對決


    如果你因為胸腔疼痛而入院，醫生會立即為你實施心電圖檢查。心電描記術（EKG）測量心臟的電脈衝，然後轉換到圖表紙上的曲線。醫生確定你是否心臟病發作時，心電圖的判讀成了其中一部分依據。有時候心電圖的解讀是清晰的，但大部分時候其實相當模棱兩可——也就是說，你仰賴的是醫生的專業來得到適當診斷。


    那麼，醫生判讀心電圖的表現如何呢？在 1996 年的一場對決中，瑞典隆德大學（Lund University）研究員拉爾斯・伊登布蘭特（Lars Edenbrandt）以他的電腦程式挑戰瑞典心臟專科權威漢斯・歐林（Hans
    Ohlin）醫師。伊登布蘭特是人工智能專家，他為機器輸入了數千張心電圖，並且標記了顯示心臟病發作的心電圖解讀，以此訓練機器。五十歲的歐林則每年判讀多達一萬份'
