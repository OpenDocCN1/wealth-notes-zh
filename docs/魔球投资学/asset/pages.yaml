    的公司表現落後於道瓊指數的幅度超過 25%。


    我提出相似的簡單問題：年底買進市值最大的五十間公司股票組成一個等比例投資組合，那麼在未來一年、三年和五年期間，這個組合相較於 S&P 500 表現如何？我模擬了
    1980 年至 2006 年的狀況後發現，無論是多長的持股期，S&P 500 指數皆表現優於這個大型股組合（見圖表 36.4）。再一次證明，大型公司極難以實質跑贏市場，因為這些公司本身即占据了市場相當大的比例。¹²


