  md: '# 8 時間就是我的籌碼

    ——短視損失規避與投資組合週轉率


    風險資產的吸引力取決於投資者的投資期。風險資產對於願意等待更長時間而不急著評估投資損益結果的投資者而言，較有吸引力，對那些買進後想要馬上評估結果的人則較無吸引力。


    > ——理察·塞勒（Richard H. Thaler）、阿摩司·特沃斯基（Amos Tversky）、丹尼爾·康納曼（Daniel Kahneman）和艾倫·施瓦茨（Alan
    Schwartz），〈短視與損失規避對風險承擔的影響：實驗測試〉（The Effect of Myopia and Loss Aversion on Risk
    Taking: An Experimental Test）


    損失規避是生命的實相。相對的，評估的頻率則是政策的選擇，應該可以改變；至少原則上可以。


    > ——施羅莫·本納茨（Shlomo Benartzi）和理察·塞勒（Richard H. Thaler），〈短視損失規避與股權溢酬之謎〉（Myopic Loss
    Aversion and the Equity Premium Puzzle）


    # 一次或一百次


    1960 年代初期，經濟學家保羅·薩繆森（Paul Samuelson）曾在餐桌上邀請他的同事們進行一場賭博——這是個公平的擲硬幣遊戲，對方猜對的話會得到
    200 元，猜錯的話則要賠上 100 元。但是他的同事們都不要。其中一個有名的學者回答說：「我'
  merge: -1
