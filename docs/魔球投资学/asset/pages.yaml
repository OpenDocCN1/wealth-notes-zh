- pgno: 124
  md: '「被動型」S&P 500 指數的週轉率上升，加上更低的佣金成本，表示現今的合理週轉率必然比三十或四十年前來得更高。但是，大部分基金經理讓他們的基金組合翻轉得太快了，產生出大量的交易成本和市场衝擊成本，以及不必要的稅賦重擔。短線主義正在吞噬投資組合的績效。


    在競爭激烈的財金產業裡，成本往往就是區分績優基金與劣劣基金的關鍵因素。因此，我們可預見基金的高週轉率與相對低的報酬這兩者之間的關聯。數據證實了這一點。1997
    年，晨星公司針對美國股權基金的週轉率和績效進行了全面性的研究。結果顯示，在不同的投資期，低週轉率基金的績效都優於高週轉率基金（見圖表 10.3）。$^{12}$
    該研究也表明基金的組合週轉確實提高了高風險基金的績效，這樣的發現也得到其他學術研究的證實。


    把資料更新至 2006 年年底，這些數據仍然顯示同樣的結果。資料分析證實了週轉率次低的組別（20%至 50%）在過去一年、三年及五年期間產生最理想的報酬。根據這項分析，我們相信主動型基金的適當週轉率介於
    20%至 100%的區間。區間的低端，也就是相等於十八個月至五年的持有期，適用於價值型基金；區間的高端，也就是相等於十二至十八個月的持有期，則適用於成長型基金。這個準則的應用應考慮到各種實際狀況。$^{14}$'
