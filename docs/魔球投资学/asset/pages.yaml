  md: '左右減少到當前的十年以下。相較於上一個世代，今日的公司必須在更短的時間內產生投資報酬。圖表 21.1 是范恩對各個產業的產品脈動速度與製程脈動速度的估算。


    平均脈動速度加快，並非意味著所有領域經歷一致的快速變化。總體變化背後的其中一個因素是上市公司組成的改變。尤金．法馬（Eugene Fama）和肯尼斯．佛蘭契（Kenneth
    French）指出，Compustat 資料庫裡的公司數量從 1970 年代中期至 1990 年代中期增加了 70%。大部分透過首次公開募股（IPO）上市的新公司，規模都比原有公司更小，並且成長得更快。4
