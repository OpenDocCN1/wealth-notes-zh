- pgno: 342
  md: '# 圖表 35.2 1997 年美國公司的銷售額與累積機率


    ![](img/501b8eadc4f653d4e86fc862268abf1c_342_0.png)


    來源：Axtell, "Zipf Distributions of U.S. Firm Sizes," 1819.經許可引用。


    形成沙堆。開始時沙堆還相當平坦，而沙子最終固著的地方離開落下的點很近。一旦沙堆漸漸變得傾斜，添加的沙子會間歇地引發小型崩坍。時間再久一些，崩坍的規模將會變成跟沙堆一樣大。系統現在處於「臨界」狀態——這是一種介於穩定和隨機之間的一種狀態。一旦沙堆進入臨界狀態，持續添加的沙子將啟動不同規模的崩坍現象，而且崩坍規模呈幂律分布。⁸


    沙堆隱喻當中有些面向有助於我們思考社會系統。例如，經濟系統顯然也是自組織性質的。也就是說，大多數企業、城市，以及國家都因個體之間的交互作用而形塑，並不是透過集中規劃而產生的。而且，當中也存在臨界狀態。在物理系統裡，臨界點'
  merge: -1
  img_proc: true
- pgno: 343
  md: '指的是小規模變化產生相位（phase）變化，例如，水在溫度降到攝氏零度以下就會凝固。經濟學家對經濟系統裡的臨界點則沒有提出如此清晰的定義，但我們知道個體並不會永遠留在同一家公司（穩定狀態），也不會隨意跳槽到各家公司（隨機狀態）。艾克斯蒂爾提出一個以行動主體為本的模型來掌握這項特質，並用來解釋公司和城市規模。他的模型呈現的結果符合經驗數據。$^{9}$


    # 掌握更強功力


    對幂定律的理解就幾個方面讓投資者受益。第一點跟艾克斯蒂爾所發現的公司規模分布有關。跡象顯示幂律分布長久以來十分穩健，因此我們可相當準確地判斷未來的分布狀態，縱使我們無從具體得知哪一家企業會落在分布範圍內。$^{10}$
    但是，基於經濟成長和通貨膨脹率的合理假設，我們可以預測公司達到特定規模的機率。


    例如，我們可以預知，將會有極小比例的公司達到非常大的規模（比如超過 2000 億元的銷售額）。我們可以檢視今日的大型企業所聲稱的預期成長率，據此了解當中有多少家公司的預期達成超大規模。如果超大型公司的數量超過預期分布中超大公司的比例，則我們知道成長預期很可能会下修。


    投資者的另一種受益方式，就是利用幂定律來理解網際網路的拓樸學（topology）。網際網路作為自組織系統的典型案例，'
  merge: -1
  img_proc: true
- pgno: 344
  md: '衍生出許多幂律關係，包括每個網站的鏈接數、每個網站的網頁數量，以及網站的受歡迎程度。這些幂律現象顯示，重度使用網路的公司將得到不均等的利益。$ ^{11}
    $ 網際網路的發展可能對組織的未來網絡有所得益。


    幂定律以驚人的精確度再現許多社會、生物學與物理學系統。而且，許多存在幂定律的領域都跟投資者利益有直接的交互關係。敏銳的投資者可以從幂定律得到各種有用的洞見以應用於投資過程。


