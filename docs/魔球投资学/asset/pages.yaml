- pgno: 31
  md: '塔（Paul DePodesta），在故事中有一段玩廿一點的情節——當時他在拉斯維加斯，坐在他右邊的男子持有十七點，要求加牌。牌桌上的所有人都停下來，連莊荷也再次問他是否確定加牌。玩家點頭，莊荷發牌——當然，那是一張四。莊荷說了什麼？「好牌。」是的，牌加得真好。你就是要這樣讓別人下注——如果你正在為賭場工作。


    這個小插曲讓我們注意到投資的其中一項最基本的概念：過程相對於結果。絕大多數情況下，投資者僅僅著眼於結果，對過程卻未投入適當的思慮。投資者把目光聚焦在結果，這傾向就某個程度而言是可以理解的。投資的損益結果，也就是會計根本的底線，才是最終的關鍵。而且結果通常可一眼認出，對投資過程的評估則沒那麼客觀易懂。¹


    但是投資者常犯下一項嚴重錯誤——他們誤以為好結果來自好過程，壞結果則來自壞過程。相對的，在任何跟機率操作有關的領域，如投資、球隊管理、投注彩池等等，優秀的長期操作者關注的都是過程而非結果。


    . 愛德華·魯梭（J. Edvard Russo）與保羅·舒麥克（Paul Schomaker）透過一個簡易的 2x2 矩陣來說明過程與結果的相對關係（見圖表
    1.1）。他們指出，好決策有時候會帶來壞結果，壞決策有時也會帶來好結果，而這一切都是因為機率，就像「十七點要求加牌」的故事一樣。然而，長遠而言過程確實決定結果。這就是賭場，也就是「莊家」總是能獲利的原因所在。'
