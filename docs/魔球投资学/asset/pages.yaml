  md: '許多投資者說他們不在意市場波動率，原因或許就在於此。這些投資者不受短期價格震盪影響，持有期的長度足以產生高獲利機率，因而得到正向效用。


    本納茨和塞勒使用幾種模擬方式，估算出與實際股權風險溢酬相對應的評估期間為大約一年。必須留意的是，評估期間並非相等於投資者的計畫投資期。投資者可能從現在開始規劃為期三十年的退休投資計劃，但她每年或每季評估她的投資組合一次（更準確地說，她每年或每季經歷一次損益效用），那麼，她的行動無異於短期間的投資規劃。$
