  md: '地球物理學迪迪爾・索耐特（Didier Sornette）寫了一本重要而精彩的書《股市為何崩盤》（*Why Stock Markets Crash*），指出股票市場的價格分布由兩個部分組成：身體（即你可以使用標準理論來建構模型的部分）和尾巴（仰賴另一種完全不同的原理）。索耐特對股市報酬率衰退的分析斬釘截鐵地反駁了股票報酬為獨立分布的假設，而獨立分布正是古典金融理論的支柱。他的研究成果為我們帶來了最新而且深入的論據，揭示金融理論的不足之處。⁷


    # 聖彼得堡悖論與成長股投資


    聖彼得堡悖論同時也為成長股的估值提供洞見。⁸ 如果一家公司有極小的機率能以巨大幅度永久增進其現金流量，你願意付出多少？⁹


    大衛・杜蘭（David Durand）在他 1957 年的經典文章〈成長股與聖彼得堡悖論〉裡處理了這個問題。¹⁰ 他一再警示，並且強調要謹慎看待均值回歸的思維和模型。然而，相較於近五十年前杜蘭應對這道難題時所處的環境，低機率但高回報投資的估值挑戰在今天顯得更為迫切。


    例如，看看 1980 年至 2006 年近 2000 家公開募股上市的科技公司，當中只有少於 5%囊括了所有總額超過兩萬億元的價值創造。¹¹ 即使在這些獲利公司當中，也只有少數股票真正產生巨大的投資報酬。基於成長型市場裡贏家幾乎全拿的特性，實在'
