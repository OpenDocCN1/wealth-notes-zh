  md: '# 非定態性與歷史本益比


    非定態性（nonstationarity）是時間序列分析的關鍵概念，在氣候學和金融學等領域尤其重要；也就是說，母體的統計特徵必須維持相同或靜止不變，不同時期的平均值才能相互比較。如果母體的特徵隨著時間而改變，數據就不再處於定態；這時候把歷史平均值套用到當前的母體，可能會得到誤導性的結論。


    本益比的理論性與經驗性分析都說明了這個數據並非定態。² 實際上，研究顯示在過去 125 年以來，每個年度開始時的本益比跟後續十二個月或二十四個月的報酬率都不存在顯著的統計相關。³
    說得更直接一些，若要衡量特定投資期的市場報酬率，本益比的歷史平均值對投資者而言幾乎沒有任何引導作用。


    本益比很可能不是靜止恆固的，認知到這一點非常重要；然而，了解本益比為何不是靜止不變，則可以帶來更實際的洞見。本益比的非定態性源於三大驅力：稅賦與通貨膨脹、經濟體系的組成變化，以及股權風險溢酬的改變。


    # 為什麼過去不一定是序章？⁴


    金融學的基本原則是：投資者為標的定價，以便扣除稅金、通貨膨脹與交易成本等因素之後取得（感知風險調整後的）適當報酬。因此，稅法的改變以及通貨膨脹率會影響市場的公允價值，進而對本益比產生實質作用。'
  merge: -1
  img_proc: true
- pgno: 246
  md: '稅賦的作用在概念上相當直截了當。股息和資本利得稅一旦調漲，投資者也就必須賺取更高的稅前利潤，才能維持相等的報酬。因此，如果其他因素維持不變，則越低的稅率將帶來越高的估值倍數，反之亦然。


    1960 年代以來的稅率從來就不是穩定不變的（見圖表 24.1）。1960 年代初期，政府徵收近 90%的股息稅；這個稅率多年來逐漸降至 2003 年的 15%，並維持到現在。資本利得稅則在
    20%至 35%之間顫動，直到進入二十一世紀時降至 15%。


    # 圖表 24.1 歷史稅率


    ![](img/501b8eadc4f653d4e86fc862268abf1c_246_0.png)


    來源：HOLT；American Council for Capital Formation'
  merge: -1
  img_proc: true
- pgno: 247
  md: '稅率和通貨膨脹的交互作用也是重要因素。尋求稅後實質報酬的投資者，一旦預期通貨膨脹率上漲，就會把稅前報酬的目標設定得更高。圖表 24.2 顯示 1960
    年至 2006 年的年度通貨膨脹率（包括預測值）以及五年移動平均值。1970 年代高通膨率以及高資本利得稅的雙重作用之下，導致貼現率極高而本益比極低的情況。通貨膨脹也扭曲了財務報表。因此，在不同稅率與通膨率的市場情境裡，本益比將呈現顯著差異。


    # **圖表 24.2 通貨膨脹率**


    ![](img/501b8eadc4f653d4e86fc862268abf1c_247_0.png)


    形塑本益比的第二項因素，是全球經濟逐漸從有形資本轉向對無形資本的依賴。企業將有形投資如新廠房登錄在資產負債表裡，然後在使用年限內進行資產價值的折舊計算。相對的，企業'
  merge: -1
  img_proc: true
- pgno: 248
  md: '的無形投資如研發或廣告，都屬立即性的支出。


    因此，影響公司財務報表的不僅是投資的數額，還必須考慮投資的形式。有形投資導向和無形投資導向的公司可能投注相同的數額，也得到相等的投資報酬，但兩者的盈餘卻顯著不同。無形投資導向的公司通常有比較高的現金流對淨利比。


    我以道瓊工業平均指數的兩組樣本為例來說明。第一組樣本我稱之為有形導向組，組成公司包括美國鋁業公司（Alcoa）、開拓重工（Caterpillar）、聯合技術（United
    Technologies）以及沃爾瑪（Wal-Mart）。無形導向的公司則有奧駴亞（Altria）、可口可樂（Coca-Cola）、微軟（Microsoft）以及寶僑（Procter
    and Gamble）。到 2006 年為止的五個財務年度，有形導向組的現金流對淨利比是 28%，無形導向組則 111%。


    全球經濟正在從有形資產轉向依賴無形資產；這樣的跡象隨處可見，包括市淨率、勞動力配置，以及重要性日漸提升的教育培訓。而且，以無形資產為主的企業在資產負債表上僅有少數資產，因此傾向於呈現高資本報酬率。在其他因素維持不變的情況下，較高的現金流對淨利比加上高資本報酬率，將把本益比推向更高點。⁵


    影響本益比的最後一項因素是股權風險溢酬，也就是股票投資者尋求的報酬當中高於無風險證券報酬的部分（股權風險溢酬也處於非定態）。⁶ 雖然股權風險溢酬受到好幾個因素的影響，包括未來成長預期，然而投資者的總體風險胃納顯然是重要因'
  merge: -1
  img_proc: true
- pgno: 249
  md: '素。在市場普遍樂觀的時期，股權風險溢酬萎縮；當投資者都謹慎行事時，溢酬膨脹。投資者風險胃納的消長很可能造成企業估值倍數的非定態性。


    # # 有界限的參數


    過去 130 年來，市場的本益比平均值略高於十四倍，而且這段時期的本益比多次在這個水平上下浮動。⁷ 這難道還不足以證明 14 即是市場一再回歸的倍數？


    我認為在某種程度上答案是否定的。非定態性的三大驅力之中的兩項，即稅率與通膨率以及股權風險溢酬，很可能有其界線。也就是說，這些因素在一個儘管寬大卻擁有相當明確界線的渠道內遊移。長期而言（即經歷十年或更長的時間）這兩股驅動力可能達至平衡；但是這些因素確實造成了企業估值倍數在過去幾十年來顯著的合理差異。


    若我們的會計制度沒有改變，在其他因素不變的情況下，導至非定態性的第三股力量，即演化中的經濟體系，將使得本益比提升。這個結論的基本依據在於，將投資視為支出的企業，比那些將投資資本化的企業更易於產生較高的現金流對淨利比率；而這是當前的趨勢。


    不過，服務業或知識產業內的企業可維繫競爭優勢的時間變得比過去實體資本的企業更為短暫，因而前述的本益比上升趨勢得以抵銷。所以，在這些抗衡力量的彼此作用之下，本益比跟歷'
  merge: -1
  img_proc: true
