  md: '# 10 早安，讓我們迎接壓力吧！

    ——壓力導致次優的投資組合管理


    證據一再顯示，當事件變得太複雜且過於急速變幻，就像我們今天所面臨的狀況，人類的應對能力就明顯變弱了。


    > ——亞倫·葛林斯潘（Alan Greenspan），〈國際金融體系的結構〉（*The Structure of the International Financial
    System*）


    # 為什麼斑馬不會得胃潰瘍


    斑馬的壓力清單裡的前幾項會是什麼呢？斑馬當然會擔心身體的危害。你剛剛才被一隻獅子攻擊，你逃脫了，但是獅子現在仍追著你，要把你當成牠的午餐。演化讓斑馬得以有效回應這一類危機；其他動物，包括人類也一樣。


    現在，列出你的壓力清單——大概跟斑馬的清單不太一樣。在大部分情況下，我們擔憂的不是身體的事，而是心理方面的事，比如工作期限、投資組合中某支股票上星期的走勢、你的人際關係。人類主要面對的是心理與社會方面的壓力。


    著名的大腦研究者與壓力專家羅伯·薩波斯基（Robert Sapolsky）在他的精彩著作《為什麼斑馬不會得胃潰瘍》（*Why Zebras Don’t Get
    Ulcers*）中強調了一個重點：人體的生理反應機制能夠理想應對短期的身體威脅。那是我們人類生存歷史中大'
  merge: -1
  img_proc: true
- pgno: 120
  md: '部分時候所面臨的危機。問題是，我們今天所面對的心理壓力也啟動了同一套生理反應機制。我們的壓力源早已不同，但反應卻還是一樣。心理壓力一旦長期累積，可能導致嚴重的健康和行為問題，因為壓力讓我們的身體遠離了平衡狀態。²


    面對壓力時，我們會做哪些事？薩波斯基發現我們的反應「通常都是短視、無效率的，而且總是顧小失大」。身體會動起來以對付當前威脅。出現危機時，這樣的壓力反應是有效的；但是，如果每天都處在緊急狀態，這種反應機制的代價就太高了。³


    # 為什麼基金經理會得胃潰瘍


    研究顯示壓力來自於喪失預測能力及控制能力，而其中共同元素即是新穎性（novelty）。我想，經濟環境和投資理財產業的長期走勢在極大程度上讓參與者感受到可預測性與控制能力的缺失。


    預測能力的喪失反映的是全球經濟日益加速的創新步調。例如，1950 年代企業被納入 S&P 500 指數成分股之後的平均存留時間大約是二十五至三十五年，而如今只剩下十至十五年（見圖表
    10.1）。⁴ 近年來許多公司戲劇性的盛衰起伏，確實更進一步讓人覺得當今商業世界比過去更難以預測了。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '![](img/501b8eadc4f653d4e86fc862268abf1c_121_0.png)


    來源：Foster and Kaplan, *Creative Destruction*, 13. 經許可引用。


    我們發現波動率也變得難以預測了。市場層次的波動率仍相當穩定，然而個別股票的風險從 1970 年代開始就已持續提升。儘管市場投資組合的波動率在過去幾代都維持不變，但今天的基金經理選錯股票的風險比以往任何時候都變得更高了。


    失去控制力，指的不僅是投資組合內的行動，還包括持有者對投資組合的評估。持股人和基金評級公司至少每九十天對基金經理進行一次評估；為了保全資產標的，許多基金經理都會盡可能降低標的報酬率相對於市場基準的追蹤誤差。管理追蹤誤差需要緊隨市場基準，而這往往意味著更多短線交易。就某種意義而言，基金經理降低追蹤誤差是情有可原的——如果你丟失了工作，那麼投資組合在未來三年的表現對你來說並沒有什麼意義。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '但是，秘櫃式指數基金（closet indexing）對投資者並沒有好處。


    充分證據顯示投資者群體越來越輕浮躁動。1950 年代，共同基金的平均持有期超過 15 年。到了 2006 年，基金的標的持有期只剩下四年左右。7 退休基金監管機構聘雇與解雇基金經理人的動作也越來越頻繁。例如，佛羅里達州政府
    2001 年開除了聯合基金管理公司（Alliance Capital），部分原因與安陸公司的損失有關——儘管聯合基金一直以來都表現良好。8


    我認為，許多基金經理因為意識到自己的預測能力與控制能力被削弱了，才會長期處於壓力之中。我們可以預見，如此壓力將導致基金經理做出次等的投資組合管理決策。


    # 日漸縮短的投資期


    壓力會導致怎麼樣的身體反應？實際上，我們會優先處理當下的事情。我們的血壓上升，身體會把能量輪導至最需要的細胞組織，短期記憶變好，而且會暫時把「長期計畫」如免疫系統與繁殖工作擱置一旁。當身體面臨威脅時，捨棄長期功能而專注於短期運作，關乎的可能是生死之參。壓力過去之後，我們就可以恢復到一個較為平衡的狀態。但是，長期壓力讓我們一直維持在高警覺狀態，自然的平衡狀態於是被壓制了。


    對基金經理來說尤其重要的一點是：壓力促進短期專注。9 最新的研究證實，人類（就跟其他動物一樣）往往會優先考慮立即兌現的小報償而捨棄未來的大報償。例如，人們會選擇今天得'
  merge: -1
  img_proc: true
- pgno: 123
  md: '到一個蘋果而不願意等到明天的兩個蘋果。但是，如果兌現的日期在足夠遙遠的未來，比如一年後的一個蘋果或一年零一天後的兩個蘋果，人們會更願意等待較大的報價。尋求短期利益而犧牲更具吸引力的長期利益，這對長線投資者而言是次等的作爲。$^{10}$


    我們如何知道基金經理越來越趨於短線取向？我們可以從投資組合的週轉率數據而得知。近幾十年來，投資組合的平均週轉率急劇上升——1950 年代的週轉率大約是 20%，今天則已經近乎
    100%（見圖表 10.2）。單是 2006 年，每十四個股權基金就有一個基金的投資組合年度週轉率超過 200%；每十個就有三個超過 100%；每四個當中只有一個基金的週轉率低於
    30%。$^{11}$


    # 圖表 10.2 1946 年至 2006 年的共同基金週轉率


    ![](img/501b8eadc4f653d4e86fc862268abf1c_123_0.png)


    來源：柏格金融市場研究中心（Bogle Financial Markets Research Center），經許可引用；晨星公司；作者分析。'
