  md: '法則的情況下，莎麗連續進球的次數將遠遠多於艾倫。³


    1967 年 2 月 24 日，威爾特·張伯倫（Wilt Chamberlin）單場連續 18 次投籃命中，創下 NBA 單場連續命中率的最高記錄；他的表現與上述的論點一致。張伯倫在他的籃球生涯中創下
    54% 的投籃命中率，讓他晉升投籃命中率最高的二十位球員之列。


    我們應該把多次連勝的表現連結到技藝（以及運氣）——棒球運動中的打擊率是測試這個說法的另一種方式。美國職棒大聯盟的歷史中，42 個球員曾創下三十場或以上球賽連續擊出安打的記錄。這些球員在他們的棒球生涯中平均達到
    0.311 的打擊率。換言之，0.311 的打擊率就能夠讓一位打擊手成為棒球史上百位最佳球員之一。


    此外，史上最多次數連續二十場擊出安打的五個球員，即彼得·羅斯（Pete Rose）、泰·柯布（Ty Cobb）、泰瑞斯·史畢克（Tris Speaker）、黑尼·馬努西（Heinie
    Manush），以及查克·克萊因（Chuck Klein），他們職業生涯中所達到的打擊率平均為 0.333。長久以來，棒球運動員的平均打擊率都維持在 0.260
    上下。⁴


    運動领域中唯一違反機率法則的連勝表現，就是喬·迪馬喬（Joe DiMaggio）在 1941 年連續 56 場擊出安打的記錄。（僅次於喬·迪馬喬的是 44
    場連續擊出安打的記錄，只有迪馬喬記錄的 80%，由彼得·羅斯和威力·基勒［Wee Willie Keeler］所創'
