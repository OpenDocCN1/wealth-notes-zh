  md: '閱讀至此，讀者可能會產生這樣的印象：所有預期成長率偏高的公司都是糟糕的投資標的。事實完全不是如此！問題在於——即使我們知道某些公司將在未來快速成長，促使市場預期往上修正，並且帶來極具魅力的投資回報，然而我們並不具備系統性的方式去辨識這些公司。良機藏在其中。


    成長是好事，只是我們太難以從中得到好處；為了說明這一點，我們引用傑諾米·席格爾（Jeremy Siegel）在他所著的經典投資書《長線獲利之道》（Stocks
    for the Long Run）裡對「Nifty 50」股票所做的優秀分析。6「Nifty 50」是1970年代初一組領先的成長股，期望成長率備受看好，而且本益比皆超過40倍。後來在1973年至1974年的空頭市場，這一組股票急劇下跌。


    席格爾提出一道根本問題：依據後續的總體股東報酬，「Nifty 50」股在1972年是否估值過高？席格爾分析後得到的答案是否定的。雖然當中有些股票的表現遠勝市場（菲利普莫里斯[Philip
    Morris]、吉列[Gillette]和可口可樂），另一些股票則遠落後於市場（寶來[Burroughs]、拍立得[Polaroid]和百得[Black &
    Decker]），但是平均而言這一組股票所產生的報酬其實與整體市場相符。席格爾的論點是：根據後續的表現，1972年有些公司的保證本益比（warranted
    P/E）遠遠偏高，有些則遠遠偏低，但平均本益比卻很合理。'
