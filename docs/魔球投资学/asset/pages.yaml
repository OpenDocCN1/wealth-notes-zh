  md: '3. 大型公司的成長往往陷入失速狀態：這是企業策略委員會深入研究後所得的結論。$^{8}$ 這項研究指出，一旦公司的銷售額達到足夠高的程度，成長率就會失速。過去數十年來，失速點逐漸升高，1990
    年代末大約處在 200 億至 300 億元之間。


    圖表 36.3 顯示財星 50 大企業（一個以銷售額為依據的排行榜）在擠入排名前後的平均年銷售額成長率。根據資料所示，這些公司進入 50 大之前享有高成長率，但是上榜之後往往就成長乏力了。上榜後第一年的高成長率暗示著許多公司可能是透過併購而晉升財星
