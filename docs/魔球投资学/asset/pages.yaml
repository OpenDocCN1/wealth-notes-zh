    沒有人能完全理解冪定律產生的原理，但可以透過一些模型或過程來產生。⁷ 或許最廣為人知的是「自組織臨界性」，這個模型因理論物理學家巴克（Per Bak）而進入大眾視野。巴克想到這樣一個場景——小孩在沙灘上抓著沙子，讓沙子緩慢地落下'
  merge: -1
