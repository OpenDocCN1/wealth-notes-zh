  md: '# 33 門房的美夢

    ——聽信個人意見，為何會危害你的生財之路


    在現有的科學領域裡，過去一個世紀以來的大部分重心都在分析系統，嘗試找到系統背後的組成元件，然後極盡所能地深入分析這些元件。但是，這些元件如何共同行動而形成我們所見的總體行為之中的種種明顯特徵，則始終是個迷團。


    > 史蒂芬·沃爾夫勒姆（Stephen Wolfram），《一種新科學》（*A New Kind of Science*）


    # 超越牛頓


    意識從何而來？幾個世紀以來，這道問題困擾著哲學家與科學家們。我們治療了疾病、把人送上了月球，也探究了物質世界的種種。然而，即使是今日最優秀的思想家，也難以定義意識，更遑論為此提出解釋。我們在某些科學領域裡成績斐然，在另一些科學領域如意識的神祕世界，為何我們卻所知甚少？


    並非所有系統都一致相同，而我們不可能在同一个層次上理解所有系統的運作。讓我們先從我們理解的系統開始。人類在過去幾個世紀的科學成就，大部分都立基於艾薩克·牛頓的原則。牛頓的世界是機械式的，在其中因與果被清楚界定，而系統遵循'
  merge: -1
  img_proc: true
- pgno: 320
  md: '著普遍法則運轉。只要對構成系統的組件具備相當的理解，我們就能夠預測系統的行為。


    在牛頓的世界裡，化約論是探索事物的基石，也是十七到十八世紀大部分激動人心的科學成就所仰賴的基礎。如科學家約翰·霍蘭德所言：「當中的理念在於，你研究構成世界的碎片，往越來越小的碎片去探究，然後你就能夠理解這個世界。一旦聚在一起，衆多小碎片能夠解釋整體。」¹
    在許多系統裡，化約論表現出色。


    但是，化約論有其侷限。若系統仰賴的是衆多元件之間複雜的交互作用，則整體所呈現的性質與特徵往往有別於所有組成元件的加總。既然系統的整體因個體的交互作用而冒現，我們便無法單純藉由研究個別部件而理解整體。化約論在這裡行不通。


    身處有關人類意識的學術對話之中，神經科學家威廉·卡爾文 (William Calvin) 曾說過：我們可以採取不同的方法來探究這個問題，但是理解人類意識的關鍵必定不是在「地下層」運作的神經化學，更不可能是在「地下第二層」運作的量子力學。頭腦裡的交互作用有太多層次；部分不能用來解釋整體。從地下第二層的量子力學直接躍升到頂樓的意識，卡爾文稱之為「門房的美夢」(janitor''s
    dream)。²


    為什麼投資者必須知道門房之夢？如果股市是一個因衆多不同的投資者交互作用之下而冒現的系統，那麼，化約論，即對個體的理解，並不足以勾勒出版場的運作機制。投資者和企業經營'
  merge: -1
  img_proc: true
- pgno: 321
  md: '者企圖理解市場，卻過度專注於個體，因而在錯誤的層次上建立觀點。以不恰當的觀點看待市場，可能導向拙劣的判斷或摧毀價值的決策。


    # ## 為系統分類


    如果系統的複雜程度低，而且我們可以用線性的方式界定元件之間的互動，則化約論非常有用。許多機械系統符合這樣的條件。熟練的工匠只要拆開你的手錶，研究各個部件，即可完整掌握整個系統的運作方式。這類系統也允許集中式的決策過程。工業革命時代的許多公司都是機械式系統的實例——產品進入生產線，過程中每個工人為最終的產品做出部分貢獻。管理者利用科學進步持續改良系統績效。


    相對的，如果系統有一定的複雜度，則集中式控制就會失效。科學家稱之為「複雜適應系統」，系統的組成元件則被稱為行動主體（agents）。複雜適應系統展現幾項本質性的特徵和機制：³


    +   * 聚合作用：聚合作用指的是大量較不複雜的行動進入主體交互作用之後，產生出複雜且大規模的行為。


    +   * 適應性決策規則：複雜適應系統裡的行動主體從所處的環境取得資訊，在交互作用之下與環境組合，並且衍生出決策規則。然後，各種不同的決策規則因其適應程度而相互競爭，最終生存下來的是適應能力最強的高效規則。'
  merge: -1
  img_proc: true
- pgno: 322
  md: '• 非線性：在線性模型裡，整體等於部分的總和。在非線性系統裡，總體的行為比個體加總後所預期的還要複雜許多。


    • 回饋迴路：回饋系統意指系統某個迭代（iteration）的輸出將成為下一個迭代的輸入。回饋迴路能夠放大或抑制某個效應。⁴


    # 圖表 33.1 複雜度與決策過程


    ![](img/501b8eadc4f653d4e86fc862268abf1c_322_0.png)


    來源：Sente Corporation


    複雜適應系統包括政府、大部分企業，以及資本市場。在這些系統裡，想要由上而下行使控制的企圖通常會導向失敗，前蘇聯即是一例。圖表 33.1 對比了兩種不同形式的系統。


    以複雜適應系統來看待市場，這種觀點全然與古典經濟學和'
  merge: -1
  img_proc: true
- pgno: 323
  md: '金融學理論對立，而傳統觀點以牛頓的視角刻畫世界。經濟學家將行動主體視為同質，並且據此建構線性模型——供給對應需求、風險對應報價、價格對應數量。當然，這一切都不能反映真實世界。⁵


    # # 股票市場作為複雜適應系統


    股票市場展現所有複雜適應系統的特徵。投資風格與投資期各異的投資者（適應性決策規則）在市場裡互相交易（聚合作用），而且我們發現了肥尾形態的價格分布（非線性）以及模仿效應（回饋迴路）。以行動主體為本的觀點開始得到廣泛認可；但是，這種較理想的敘述框架無法像當前的經濟學模型那樣針對市場提供一套整體劃一的解決方案。


    將市場視為複雜適應系統的投資者得以避開兩大認知陷阱。第一個陷阱是無止盡地為一切結果尋求原因。臨界點是複雜適應系統的特徵之一；系統到達臨界點時，小幅度干擾也會啟動大規模反應。所以，因與果並非總是能夠輕易連結。例如，1987
    年股災之後，政府成立委員會試圖釐清市場崩盤的「原因」。執行了徹底詳盡的研究之後，美國前財政部長布雷迪（Brady）為首的委員會仍然無法找到具體的事件成因。這並非意味著因果關係不存在，而是說，不是所有的事件結果都有一個相對應的原因。人類總愛為每一個事件賦予原因，所以這個概念非常難以內化。


    第二個陷阱是停留在個體的層次而忽視對整體市場的理解。'
