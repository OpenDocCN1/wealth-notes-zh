    # NOTES


    +   11. 使用子弹头，下划线，粗体字，但不宜过多。

    12. 详细阐述产品信息，对产品信息进行总结。

    13. 直列标题，总结经验。

    14. 呼吁行动。

    15. 注册购买意见/购买。

    16. 不要仅仅停留在“我”。

    17. 在小范围内测试，效果好，再扩大范围。

    18. 向顾客1033万号。

    19. 合有触击所有关键按钮。

    20. 看起来个性强，令人兴奋。

    21. 使用印刷品为媒介手段。


    必须避免的11个销售错误：


    +   1. 过于强调形象和你自己。

    2. 花时问教有顾客。

    3. 解释价格。

    4. 听取公众意见。

    5. 感觉混淆和猜测 (①询问顾客 ②使用不同的电码号码 ③优惠券 ④信息产品)。

    6. 屈服于计算美概念。

    7. 让顾客难以联系上你。

    8. 以为都是关于“我们”。

    9. 缺少大局观。

    10. 一开始就失败 (标题)。

    11. 模式过于复杂 (图形3、超过文案的一半)。'
