    \n记住，把答案写下来，是保留学习痕迹，强化记忆的好方法，一定要坚持。确保当你真的开始文案写作，当你开始做真正的市场营销后，你还可以回来查看。\n\n##\
    \ NOTES\n\n## NOTES\n\n## NOTES\n\n## 步骤#4: 制定USP\n\n几乎任何读过关于市场营销书籍的人，都会碰到有关 USP\
    \ 的理论。\n\n就像我在 CD 里说明的，我很快发现对 USP 的“传统”定义对一般企业家或小公司所有者并没有多大作用，因为他们只是想在自己的市场上找到有利位置，然后赚一大笔钱。\n\
    \n因此，我十几年来一直在研究 USP，并在真实的世界中进行测试。\n\n然而，我使用的 USP 和“传统的”USP 是截然不同的。当你试图弄明白你在市场中的位置时，用我的\
    \ USP 理论，它非常容易操作。\n\n不明白自己在市场中的位置就去做市场营销，相当于在黑夜中盲目前行。\n\n然而，一旦你完成了这个练习……“你在利基市场”中的位置之迷将被揭开……\n\
    \n你就可以确定自己所属的位置……\n\n……或者去重新定位，找到利润更高，更有趣的利基市场。\n\n它将你远离所谓的专业理论……把真实有效的营销方法运用到你的营销中。\n\
    \n### 步骤#4：你的 USP\n\n定位自己，让你在利基市场中脱颖而出，从而达到销售目的。\n\n- 你的品牌形象，名称，LOGO\n- 销售调查（人们购买的真正原因）……\n\
    - 枯燥 vs. 迷人\n- 并非全部都关于你……\n- 不是说你在卖“什么”……\n- 而是你卖的“东西”能给你的客户带来什么。\n- 要提供“令人高兴的东西”：更快、更简单、更轻松、价格便宜、物超所值、内部资讯、特权、豪华、吹嘘的权利。\n\
    - 记住：你需要立即向多疑的读者证明一切。\n- 考虑使用不是很深奥的词汇。\n- 不要弄得太空奥，用具体的事实来解决问题。不要担心要怎么样才能“讨好”人，只要把事情尽量说明白。\n\
    - 新手公式：“我们帮助（这类人）…获得了这些（好处）…变的更好。”\n- 定位关注：…比（竞争对手或普通人）更好。”\n\n## 销售信样板：\n\n各个水平的吉他手请注意：想要立刻像其他顶级音乐家一样，开办自己的独奏音乐会吗？\n\
    \n快速掌握弹奏吉他的惊人“内幕”捷径，终于被著名工作室“秘密”公开了，这吓到了其他专业人士。它甚至能几乎在一夜之间，让 12 岁的菜鸟变成吉他怪才、爵士乐大师！\n\
    \n如果你之前已经学过吉他，你甚至可以学的更好，更快。直到今天，这位炙手可热的吉他专家，也只和几位能够支付起咨询费的幸运儿分享过他的秘诀——“立即学习，一夜之间打败其他音乐家”，这是吉他独奏的杀手级秘诀。\n\
    \n如今，这个令人难以置信的信息突然公开了！不管你的吉他水平如何，你都可以很短的时间内，一跃成为受人尊敬的吉他巨星。\n\n最棒的是，如果你愿意，你还可以免费尝试。\n\
    \n（电头：好莱坞，加利福尼亚州）如果你曾梦想打破常规，迅速提高吉他弹奏水平，甚至打败知名的专业音乐家…… 那么，这将是您读过的最令人兴奋的一则信息。\n\n\
    因为，音乐界一个最炙手可热的专业吉他手最终同意分享“快速学好吉他”的捷径。这是以前其他吉他手花很多钱才能从他那里学到的。\n\n很多专业吉他手都因为他向外界公布了这些秘诀而生气。他们不想你们知道这些技巧，因为正是利用这些技巧，他们才演奏出了流畅，美妙，拨人心弦的乐曲。而且，只要你找到了捷径，这些技巧都是非常容易掌握的。（有些专业音乐人感到他们的演奏事业受到了威胁。）\n\
    \n这些技巧是任何水平的人都可以学会的……能够把你带到一个新的水平，让你**拥有惊人的演奏水平**，震惊其他吉他手。你想要即时弹奏其他人都不敢弹奏的乐曲，你的手指都可以闪电般地在琴弦上飞舞……却不会漏掉一个音符。\n\
    \n你想要弹奏出人们永远不会忘记的，充满活力和力量的乐曲吗？你想要通过演奏，马上赢得他人的尊重，**并且让音乐变得有趣吗**？你想 *今晚*就用自己全新的演奏技巧，弹出最美妙的音符吗？\n\
    \n好，你猜怎么着？你都能做到，比你想像的**更快，更简单**。因为这些捷径对任何人都有效——不管你是从未演出过的新手，还是已经有演奏经验，想大幅提高自己演奏水平的人。\n\
    \n就是这样。不管你现在*处于什么水平*……你都能够快速，轻易地掌握这些迷人的技巧，这些技巧是外界最好的吉他手使用过的。\n\n他们用这些技巧演奏了不同风格的乐曲，有摇滚、爵士、乡村、节奏布鲁斯、说唱等等。所有这些杀手级技巧以及能力都将归你所有。\n\
    \n全都关乎捷径。\n\n事情是这样的：托尼·伯内特是为数不多的几个“备受欢迎”的吉他手之一，他在所有顶级音乐会上都演出过。（他被称为所有著名的乐手背后的“秘密武器”。）他的要价也非常高。他一直穿梭于纽约和洛杉矶之间，帮助*当今最受欢迎*的格莱美奖艺术家……以及出过上百张唱片的摇滚巨星……甚至一个“年度最佳专辑”获得者也坚持使用托尼的惊人速度模式来演奏“快节奏”乐曲。这些超级巨星都会*推纪录影*，直到托尼有时间指导他们。\n\
    \n现在你*知道*他有品位，有能力，有一些能让他成为行业的领军人物的特殊“狡猾”技巧了吧。\n\n同时，他还是一位速弹专家。当他和90后速弹乐队”XYZ“一起演奏时，他就和莫格威·玛姆斯汀共同教授过门方法。他们也把这个方法教给了其他一些最受欢迎的巡回演出乐队，像Motley\
    \ Crue，Ratt，LA Gunns以及Dokken（美国著名乐队）等。在还是孩子的时候，托尼便完成了吉他技术学院的所有课程，极大地提高了他的弹奏速度-\
    \ 每天18个小时，连续18个月不要让吉他离开你的手。\n"
