    亲爱的约翰：


    那些女人再也不嘲笑他了。郁闷。现在，她们的眼里都是对那个矮小，但十分谦逊的男人的敬畏和尊敬。


    这里的关键词是“男人”——因为，在那场格斗中，他展示了自己的能力后，他已经证明自已是一个男人。一个能够教训任何惹恼他的人。徒手……或者拿着一把刀子……或一个棍子。


    ## 这和你有什么关系呢？


    如果你明白拥有这份尊重对你来说意味着什么，你就明白关系有多大了……并不是每个人都能得到尊重，不管他赢得过多少比赛。人们只会觉得是他们体形强壮或运气好的原因。


    但是请明白这点：菲利克斯•瓦伦西亚是一个矮小的人（只有 1 米 72）看起来，就是个懒家伙。他没有六块腹肌，或者坚实的肱二头肌，也没有能够拍碎砖头的手。


    但是……他坚信，他能够教你如何在几乎一夜之间，赢得许多人的尊重…不管你身高多少，或者你有多胖，或者你的比赛经验有多少。


    # 这都不重要


    因为，想要拥有勇猛卓越的格斗能力，只需几个简单且容易掌握的秘诀即可。尤其是徒手套斗，以及持刀或持棍格斗。


    当我说这些话的时候，大多数人都不相信。所以我会向他们证明。


    也会向你证明。只要一分钟后。


    情况是这样的：那些在菲利克斯背后嘲笑他的女孩儿是脱衣舞女……她们在洛杉矶最出名的黑帮飞车队脱衣舞俱乐部工作。好吧，不是最出名……而是最危险。洛杉矶最危险的俱乐部。


    你的俱乐部里同时聚集了无赖的黑帮飞车队的人和陪酒脱衣舞女，

    你有麻烦了！


    菲利克斯走了进去，他想找一份保镳的工作。大家都当着他的面笑了。那些脱衣舞女还在背后打赌，每人压20美元，赌他能坚持多久。以前这里的那个保镳体型是他的两倍，是一个训练有素的拳击手……那个可怜的人第一次工作一小时后，就躲在人行道上，哭的像个小孩。


    俱乐部里3个最健壮、最邪恶，疯子似的黑帮飞车队员决定好好整治一下菲利克斯，手段要比上个保镳更毒辣。他们希望他受伤，并立即离开这个俱乐部。因为这个矮小的人竟然觉得能够做这里的保镳，这让他们感到自己受到了羞辱。


    这里最瘦小的黑帮飞车队员也有200英镑，拥有结实的肌肉。那三个人都手持博伊刀（猎刀的一种），并且准备用它攻击菲利克斯。


    他们喜欢看到别人痛苦。


    接下来发生的一切，成了洛杉矶的神话。贝弗利希尔斯(美国加利福尼亚州西南部城市)的人都听到了这个故事。矮小的菲利克斯，看起来就像是一个小孩子盯着3个愤怒的公牛似的，只用47秒就结束了“格斗”。


    那三个人后来每次见到他，都尊称他为“先生”。这还不止，他们后来就再也不敢来俱乐部找麻烦了。菲利克斯彻底把他们震慑住了。


    第二年，菲利克斯就成了那个俱乐部的领头保镖。知道他的人再也不敢找他的麻烦了——那是脱衣舞女见过的最平静，最无聊的一年。


    你说大话无法赢得别人的尊敬。你挥舞着手枪或腰别亮闪闪的刀子，也不会赢得别人的尊敬。你腰系漂亮的柔道腰带也无法赢得别人的尊敬。


    不。只有一种方法让你赢得尊重……


    # 那就是你凭实力去赢得它


    有趣的是：菲利克斯拥有的资质，足以让世界级武术艺术家艳羡不已。


    比如：


    - 他跟随丹·兰斯安图训练了整整 5 年……从他刚满 8 岁，一直到 13 岁。这对任何人来说都是一次惊人的训练……但是，要想让截拳道的基本要素融入血液，在幼年就进行训练，是非常重要的。菲利克斯是一个斗士。

    - 在 20 岁时，他因为掌握了“埃德加的醉拳”而世界闻名。埃德加 G 苏利特，菲律宾武术艺术大师。武术界所有人都知道并尊重埃德加，因为 90 年代初，他把最好的菲律宾武术秘诀带到了美国。永远改变了格斗。

    - 每个挑战埃德加的人都必须先过菲利克斯这一关。这就意味着菲利克斯不得不几乎每天都战斗，对手是那些武术界知名人士，他们风格怪异，武力超强。（因为这些人都想前来挑战埃德加的武馆。）在这些挑战下，菲利克斯逐渐变得不可战胜。不可战胜。想想吧。

    - 菲利克斯现在经常参加著名的“道格兄弟”徒手格斗比赛。


    （“道格兄弟”格斗比赛，被认作是终极格斗比赛中非常非常粗野的比赛！）这些比赛中，格斗者常出现被打掉下巴，出血血肿，被打断腿，打掉牙，脑损伤等情况，还有更糟糕的……然而，这个矮小的菲利克斯在那里也是不可战胜的。从来没有受过伤，从来没有被打败过。即使是世界上最厉害的格斗者也没有打败过他。


    - 警察，联邦特工等都请求菲利克斯能够给他们一周时间的训练……包括美国洛杉矶 SWAT 特警队，中央情报局，以及 FBI 甚至包括美国冠军之家艺术学校……最好的武术机构等。


