  md: "\n## 你需要知道的部分内容\n\n- 与被公认的神话相反，热情不是一种美德；它毁掉的销售比创造的销售更多。\n- “积极思考”是一个不切实际的谬论。消极的销售员比所谓的“积极的人”成功机遇更大。\n\
    - 成功的销售，不是来源于说服人们买他们不想要的东西。\n- 那些总是对每个反对意见都给出答案的人，很可能遭遇低收入的困境。\n- 外向的人无法成为最好的销售员；他们的业绩无一例外地被内向的人超越了。\n\
    - 要成为好的销售员，你不一定要“伶牙俐齿”。否则你就会进入销售误区。\n- 另一个销售谬论是“当处境变得艰难时，意志顽强者会更努力地去迎接挑战”。当处境变得艰难的时候，作者通常会选择去度假。\n\
    - 想要激励他人的想法是不切实际的，也是愚蠢的。真正厉害的销售员永远不会试图去激励任何人。\n- 也许这一切听起来都和你这些年来听到的，或读到的关于销售的东西截然不同。你可能在怀疑，这怎么可能是真的呢？\n\
    - 站在顾客的角度看问题，那如何才能真正站在顾客的角度呢？很多书籍上说的都很片面，不符合逻辑。此手稿会告诉你详细的步骤。\n- 不管你是营销人，还是销售员，只要你遵循本手稿告诉你的\
    \ 5个步骤+3个原则，你的成交率迅速增加1倍。\n- 当然，还有很多不为大多数人所知的实效销售方法……\n\n本手稿将为你说明这些观点的正确性。然后，你就可以把它们运用到你的日常生活中——如果你愿意，你可以一次尝试一点。在你尝试它们的那一刻，你很有可能会看到它们的效果。\n\
    \n关于销售的陈词滥调其实是在试图“不劳而获”。他们承诺让销售额快速增长，却对销售没有更深入的了解。结果总是（像所有试图“不劳而获”的人一样），销售员工作更努力了，却没有获取更大的成功。\n\
    \n如果你花时间去想想人们为什么买东西，你就会进入一个正确的轨道。那时，你就有极大的可能增加你的销量，赚更多钱。\n\n你还将明白每次销售中发生的事——即使是在没有达成交易的情况下。这些法则还将改善你和同事、朋友以及家人的关系——因为你更了解他们了。\n\
    \n可能最重要的是，你将以比以前更加热爱你的工作。你将不必再忍受痛苦，强迫自己锻炼自身没有的能力。你不必重塑自己的个性或让自己成为一个性格外向的健谈者。\n\
    \n你即将学到轻松成为好的销售员，对他人更有影响力，更受欢迎的方法——你不必重塑自己的个性，不必变得更强势，更咄咄逼人，或更有说服力。你可以轻轻松松，做你自己，你可以诚实友好，客户会因为你们为他们做的事而感激你。\n\
