    \n# 就在你下次去打高尔夫球的时候！\n\n你猜怎样？因为我们在这里说的是一种特殊情形……我想要立即把这个信息告诉你。你不用承担任何风险。\n\n这个“特殊情形”是这样的：Jake多年来已然成为“秘密武器”老师，帮助那些需要增加击球距离和准确度的人。通过这个，他赚了很多钱。（他通过在美国西部受人尊敬的高尔夫球高级赛事上指导，在愉快的工作中，获得了这些收入。）\n\
    \n因此，他非常担心这个秘密泄露出去。因为，这是他的命根子……这已经成为他在老年高尔夫领域的王牌。他之所以愿意把这个秘密告诉你我，是因为他喜欢教育。就像很多伟大的教师一样，他最终做好了教书育人的准备。\n\
    \n还有一点。\n\n以下是Jake坚持的特殊条件：他允许我录制“大量增加你的击球距离”的神秘课程视频。（我要告诉你我多年前就听说过Jake，但只是私底下听人说过。直到我见到他本人，我都不确定是不是有这么个人。当他同意限量发行他的课程时，范围仅限于像你一样存在于我的顾客列表中的人时，我高兴地跳了起来。）\n\
    \n但是，他有个条件。这是一次测试。他只允许把这个秘密授权给有限的人。他知道这样做，他的秘密可能会被别的老师“窃取”……一旦出现这种情况，他将立刻把它从市场撤回。\n\
