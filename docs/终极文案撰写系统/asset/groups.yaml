    \n这个标题中的金额，是受注册会计师的审计过的，并且他允许把自己的名字写在广告中。这是极大的信誉。你必须明白，大多数医生想相信这个广告的说法……但它和他们现在的世界观不一样。大多数医生都已经工作累的筋疲力尽……他们认识的每个医生都是这样。真正既快乐，又获得巨大成功的医生，和他们接触的并不多，因为他们每天都忙着在沙滩上享受生活了。\n\
    \n人们对这个提议心存疑虑，是因为它太好了，让人不敢相信这是真的。如果你压力特别大，每天筋疲力尽，这时候，如果你有很大的理想，是非常危险的。因为，一旦理想破灭，你就可能被失望打垮。因此，医生对那些说他们可以改变这一切的人十分谨慎…尽管他们迫切想要相信这是真的。\n\
    \n这个广告已经在美国一些主流杂志的封底投放了很多年。很大一部分医生都觉得这个广告中说的东西太夸张了……但是，不管怎样，他们注意到了这个提议。很多医生都做出了回应。正如你在证言中看到的，这名医师真的兑现了自己的承诺。\n\
    \n你将会注意到这个文案以各种方式，不断地陈列了很多好处——一些最能打动人的好处。用丰富的好处“吸引”读者，和用太多的信息“烦扰”读者之间有微妙的界限……\n\
    \n吸引读者，他们就会订购。烦扰读者，他们就会离开。\n\n### 步骤#3：市场调研\n\n**练习：**\n\n坐下来，花五分钟时间，来做你自己的一连串问题发问头脑风暴。\n\
    \n那就是：\n\n- 你是谁？\n- 你销售的是什么？\n- 你为什么从事这个行业？\n- 你为顾客提供的是什么？\n\n我希望对你这些问题，你能写下自己的答案。可以把你的答案写到“笔记”页上。如果有难度，你听完下一节课程，可以再返回继续做这个练习。\n\
    \n记住，把答案写下来，是保留学习痕迹，强化记忆的好方法，一定要坚持。确保当你真的开始文案写作，当你开始做真正的市场营销后，你还可以回来查看。\n\n##\
    \ NOTES\n\n## NOTES\n\n## NOTES\n\n## 步骤#4: 制定USP\n\n几乎任何读过关于市场营销书籍的人，都会碰到有关 USP\
    \ 的理论。\n\n就像我在 CD 里说明的，我很快发现对 USP 的“传统”定义对一般企业家或小公司所有者并没有多大作用，因为他们只是想在自己的市场上找到有利位置，然后赚一大笔钱。\n\
    \n因此，我十几年来一直在研究 USP，并在真实的世界中进行测试。\n\n然而，我使用的 USP 和“传统的”USP 是截然不同的。当你试图弄明白你在市场中的位置时，用我的\
    \ USP 理论，它非常容易操作。\n\n不明白自己在市场中的位置就去做市场营销，相当于在黑夜中盲目前行。\n\n然而，一旦你完成了这个练习……“你在利基市场”中的位置之迷将被揭开……\n\
    \n你就可以确定自己所属的位置……\n\n……或者去重新定位，找到利润更高，更有趣的利基市场。\n\n它将你远离所谓的专业理论……把真实有效的营销方法运用到你的营销中。\n\
    \n### 步骤#4：你的 USP\n\n定位自己，让你在利基市场中脱颖而出，从而达到销售目的。\n\n- 你的品牌形象，名称，LOGO\n- 销售调查（人们购买的真正原因）……\n\
