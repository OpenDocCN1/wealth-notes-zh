    # 附一：


    # 标题视觉化钩子


    尽管有创意很好玩，但是不一定总有效。可能往往越是好玩的东西，越不容易成功。有创意的文案尤其如此，文案可能过于新潮，读者甚至看不到在卖什么。


    在涉及到图形以及视觉效果，更容易出现这样的问题。


    我真诚地建议，图形应该用来强调一些关键点以及关键看法，让它们变得要点清晰，格式漂亮，能吸引顾客眼球。图形设计的基础或垫脚石应由无填充颜色的空格，颜色，线条，纹理和形状的使用构成。


    # 文案撰稿人的引物设计


    几个简单的设计理念能够对你的标题，以及销售起到巨大的作用，有助于极大地提高潜在客户转化率。


    设计一个能在视觉上产生跳跃感的标题。


    +   把标题设计成大字号的黑体字，让所有人都能够一眼看到。设计一个不和谐的对比。让标题给人产生视觉冲击……就像减速带一样，让人不可能忽视。


    +   用照片或卡通画强化标题，为标题增加视觉趣味，从而增强标题对正文的支持。把你的标题和戏剧性的视觉效果相结合，从而让潜在客户更容易想象和理解你的产品好处。


    +   让你的标题成为文案中最直观，最显眼的元素。标题的外观或设计往往应该是文案中最醒目的。把你的标题看作是一个醒目，大胆的介绍，明确、简洁地吸引读者的注意力，并引导其继续阅读。


    +   有效的利用你的空间。对于小空间广告，一个醒目的标题应该占据大部分空间。让引人注目的标题在你的广告，或营销资料中占据比较大的空间。让其明显到无法被人忽视。


    +   把你的标题放在一个插图框、标题栏或气球等图形中。这些图形能抓住人的眼球，很有可能能够引发人们的极大兴趣。这种方法能给任何标题一个吸引顾客眼球的机会。'
  - '[PAGE 287]


    +   ● 寻找更多的机会使用标题。在视觉广告和宣传册等营销媒介中，常常会有多余的空间，可以用于更多的标题。标题框以及插图框本身能够吸引顾客的注意力，因此，也是插入更多标题的理想选择。其他标题以及小标题能够把长
    得文案分成几部分，缓解视觉疲劳。容易阅读的材料阅读率往往更高。


    +   ● 把标题放在潜在客户不能忽视的地方。放置任何标题的最佳位置就是潜在客 户打开广告或者邮件时，第一眼就能看到的的地方。保持标题在视线水平的位 置，能够极大地提高标题被看到的可能性。


    +   ● 让标题和其他人的标题在视觉上截然不同。你的信息以及使用的图片，应该 和你所有的直接或间接的竞争对手都不同。观察别人做的，然后自己创作一 个理念和展示形式，一定要原创。当你的标题和其他人的标题在同一个地方
    竞争时，这一点显得尤其重要。如果竞争对手的标题外观漂亮，专业，有时 你的一个没有润色，略显粗糙的外观可能也会受人欢迎。


    +   ● 避免使用花哨的字体，让阅读变得困难。最好的字体都是非常清晰且容易阅 读的。有些字体很花哨，会把人们的注意力从信息中转移到字体本身。选择 一个适合文案风格以及内容本质的字体。一定要确保它清晰易读。打印时，
    要选择淡颜色的纸张，或者白纸黑字或者其他深色系字体。


    +   ● 使用足够的白色空间有效地组织你的标题，让它在页面上各种元素汇总脱颖 而出，巧妙地传达它的重要性。考虑使用其他组织方式，比如引号，文本框， 来表明关键词包含的某些重要意义。但最重要的是，标题周围要有大量的空
    间，不要使其显得拥挤。


    +   ○ 合适的时候，使用下划线，粗体字以及大写字母来增强视觉效果。这样，能 够让读者给予某些特别的文字或词语特别，格外的注意，引起他们的重视。


    +   ○ 大小写混合使用。这两者混合使用通常能给标题带来最好的效果。避免全部 使用大写。因为阅读起来特别困难。不要在主要标题中使用不同字号的字体。


    +   ○ 利用超级长标题以及小标题来突出你的主要标题。这个方法对其他大多数文 案来说都不是很实用，所以，仅在较长的销售信中使用即可。


    +   ○ 充分利用大字号，粗体，文本框以及其他方法来调整销售信。然而，记住不 要过分使用。


    +   ○ 在标题旁边设置一个框架可以帮助吸引眼球，因为它似乎不同寻常。我的《信 手拈来，一夜之间改变你的广告》销售信，只把提议本身用框架框了起来， 其他部分都在框架外，占了标题很大一部分。强有力的提议非常适合这个方
    法，因为提议本身就值得关注。


    +   ○ 把“标题”放在双引号中间。测试表明，有双引号的标题标比没有用双引号'
  - '[PAGE 288]


    的标题吸引的注意力多。看来很多人更相信别人说的话，而不是营销人说的话。加上双引号的标题，意味着这些话来自一个满意的客户。


    注：吸引眼球和内容是否易读之间有一个分界线，有的标题能吸引人眼球，却让内容阅读起来变得困难。一个很常见的例子就是反白（其他颜色背景下的白色字体）。你的读者肯定会看到，并且对颜色做出反应。而不会阅读内容。我对反白做过直接测试，我知道它绝对会降低反应率。


    # 其他销售信强化方法


    文本框在直接营销领域被称为约翰逊框，是一个围绕标题或者其他文案的简单方框，能够有效地编排标题或文案。这个方法在直邮邮件销售中最常使用，但是它在网页，明信片或整版广告以及其他媒介中也有同样效果。


    约翰逊框早在电脑成为标准文字处理工具之前就已经存在了。回到打印机时代，这些方框都是使用键盘上的通配符或者其他标准符号制作出来的。


    对于营销标题，这些符号暗示着这些话来自一位满意的客户。因此，这个简单的方法对你是否有效，值得一试。'
