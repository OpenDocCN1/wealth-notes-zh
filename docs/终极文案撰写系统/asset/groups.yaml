    # “目标顾客”销售信样板样板#2:


    想要几乎在一夜之间实现转变，在自行车越野赛上，  即使面对更强大，更有经验，装备更好的对手，都能取胜吗？


    惊人的“内部”捷径秘诀终于被一位专家揭露了，这  是很多自行车赛专业选手想要隐藏的，能够立即增加  你的速度数倍&加强你对自行车的控制！


    直到现在，仅有一小部分专业选手，以及精心挑选的业余爱好者才被允许学习这些惊人的“巧妙地打赢对手/对手打的惨不忍睹”的秘诀，非常实用，保证你在每场比赛中（即使  是你的第一场比赛）都赢得夺冠的主动权。


    现在，这个“顶级秘诀”出人意料地被公布了出来，利用它，你能够几乎在一夜之间从菜  鸟成为受人尊敬的技术精湛的赢家。最好的是，如果你愿意，你可以免费尝试它……


    ——里欧


    亲爱的自行车爱好者:


    如果你也曾试图“破译”那些在自行车赛事上一年又一年地取得成功的专家的  技术秘诀…并快速实施，以便你能够在几乎一夜之间像一个专业选手一样在赛场上  驰骋…那么，这将是你读过的最令人兴奋消息。


    **事情是这样的：**每位优秀的车手都知道，自行车赛取胜的背后，只有三个基础  要素：（1）精湛的装备……（2）最佳的身体状态……（3）掌握骑行的卓越技巧。


    有些人觉得，自己可以通过购买顶级装备，获得成功。你看他们，拥有最好的，  价格极其昂贵的自行，以及其他装备。但是，他们输掉了每场比赛。丢人。


    其他人，想办法增加体重，吃着营养极其丰富的黏乎乎的像是苏打汽水的东西。  还有其他一些人守着电视，翻着杂志，查找他们能够发现的任意一丝骑行技巧。'
  - '[PAGE 22]


    你猜怎么着，顶级的车手身上有你们所有人都不知道的一个秘诀。当然，他们也接受别人赠送的自行车装备，为能量棒做代言，甚至时不时地“揭露”他们最喜爱的汽车技巧。


    但是，下面是所有有权有势的制造商以及广告商不想让你知道的：当你最终学会了把运动科学和先进的技巧相结合时……


    你可以不必花大钱，骑着六年前买的老掉牙的自行赢得比赛！


    最好的是……


    # 一旦你知道这个内部捷径秘诀 它将非常简单！


    下面是我们为你提供的：你可能以前从未听说过杰夫・麦克唐纳……但是，顶级专业车手肯定听过。他已经成为10年来自行车手最受追捧的“秘密武器”。来自世界各地的车手都乞求他能给予亲自指导。是的，甚至还包括一些欧洲前十的车手（还有一些来自澳大利亚，巴西，南非以及亚洲的自行车界新秀）。


    尽管杰夫从来没有对他的服务做过广告，他们依旧慕名而来。全都是口头转述的。一个人悄悄地告诉另一个人。


    为什么世界上最优秀的自行车手都找杰夫？原因很简单。他是唯一一个把真正的骑车经验和最新的运动科学相结合的人……制造了第一个超级有效的全面的骑车技巧，帮助车手赢得比赛。


    对，是口头转述的。下面，我详细说明一下：


    +   *   杰夫做过5年的专业车手，那是令人兴奋的自行车“变革时代”（从1983年到1987年）。如今，甚至是年轻的车手都仍在谈论那个时代——那是一个运动最终从完全的“铁人”似的耐力比赛时代（你骑着你的笨重的车子和自然地形对抗）……进化到大家今天习以为常的怪异的车道以及豪华的车子。


