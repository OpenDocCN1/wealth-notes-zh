    ## 步骤#1：写作思维


    当你撰写销售信或广告时，首先要寻求理解，然后寻求被理解。换句话说就是，首先要努力弄清读者心里在想什么，然后，尝试解决读者的恐惧和疑虑。


    当你这么做的时候，读者就会觉得你理解、关心他，他反过来就会关心、理解你，因此，达成交易的可能性就会大大提高。


    人们寻求被关心，被理解的心理胜于一切。一个企业如果明白了这条重要的心理因素，在对手面前就会占据主要优势。


    在你的销售信中，一定要告诉读者，你只要占据他们几分钟时间，就能向他们展示他们如何能从你的产品或服务中获得好处。


    这能够让他们内心舒缓下来，不再犹豫。


    - 你是否了解你的顾客

    - 顾客恐惧的是什么

    - 教育式营销思维

    - 教育到什么程度合适

    - 21条文案撰写要点

    - 你必须避免的 11 个销售信错误


    ### 练习：


    把CD上讲的三个重点内容写到笔记页，加深你的记忆。


    - 顾客恐惧的8种表现形式是什么？

    - 教育顾客的21条文案要点？

    - 你必须避免的11个销售信错误是什么？


    我希望你认真聆听CD中的内容。把你的答案写到“笔记”页上。


    把答案写下来，是保留学习痕迹，强化记忆的好方法，一定要坚持。确保当

    你真的开始文案写作，当你开始做真正的市场营销后，你还可以回来查看。


    ![](img/f4276e7f9d3f5414e4babc8c166139a6_10_0.png)


    ## NOTES


    ### 顾客恐惧的8种表现形式：


    1. 害怕买贵了

    2. 害怕让人笑话

    3. 害怕买到次品

    4. 害怕买到的不是最好的

    5. 害怕买了个用不着

    6. 害怕产品并不像他们说的那么好

    7. 害怕没有保证(售后)

    8. 害怕无法获得退款 (如果买错了怎么办)


    ### 顾客成交的21条文案要点：


    1. 强调激化自己

    2. 永远遵守AIDA法则(注意力、兴趣、欲望、行动)

    3. 测试标题

    4. 确定产品的UPS

    5. 描述产品对顾客的好处、价值

    6. 减字

    7. 文案内容要详尽,包含所有要点

    8. 引起共鸣、呐喊

    9. 陈述产品最大好处

    10. 小标题引起顾客要问的问题

    11. 使用子弹头，下划线，粗体字，但不宜过多。

    12. 详细阐述产品信息，对产品信息进行总结。

    13. 直列标题，总结经验。

    14. 呼吁行动。

    15. 注册购买意见/购买。

    16. 不要仅仅停留在“我”。

    17. 在小范围内测试，效果好，再扩大范围。

    18. 向顾客1033万号。

    19. 合有触击所有关键按钮。

    20. 看起来个性强，令人兴奋。

    21. 使用印刷品为媒介手段。


    ### 必须避免的11个销售错误：


    1. 过于强调形象和你自己。

    2. 花时问教有顾客。

    3. 解释价格。

    4. 听取公众意见。

    5. 感觉混淆和猜测 (①询问顾客 ②使用不同的电码号码 ③优惠券 ④信息产品)。

    6. 屈服于计算美概念。

    7. 让顾客难以联系上你。

    8. 以为都是关于“我们”。

    9. 缺少大局观。

    10. 一开始就失败 (标题)。

    11. 模式过于复杂 (图形3、超过文案的一半)。


    ## 步骤#2：营销心态


    这是我最喜欢的 “文案撰写” 准备步骤。


    如果你手里有你的潜在客户需要或应该拥有的产品，那么你应该想尽一切办法，让人们看到你的销售信并接受它，因为你能让他们的生活更好。


    有好的产品，但是要知道好的产品不会自己销售自己，营销墓地堆积着很多优秀的产品，因为没人知道怎么销售它们。


    每当我把杀手级销售术语的一些基础知识 “灌输” 给销售人员时 (无论是菜鸟，还是郁郁不得志的老手) ……他们的眼睛都会闪闪发光。


    和其他能力相比，要想赚钱……学习并成为你需要成为的人，来说服潜在客户购买的能力……能够为你做其他事情，铺平道路。


    很多营销人销售东西，都拖泥带水，效果也不好。


    在我整个事业生涯，已经让很多人都改变了态度，塑造了正确的心态。


    开始，可能会让你感到惊讶，但是它确实非常有威力。


    然而，一旦你明白了其中的奥妙……你将永远摆脱无力的销售说辞。


    它将发挥真正的作用。


    - 你的营销心态

    - 你是帮助别人解决问题

    - 如果你的产品很优质，如果你无法把你的销售信息推广出去，我都替你脸红。

    - 快速让企业灭亡的错误

    - 明确利基市场

    - 你要卖给谁？

    - 她的需求是什么？她的问题是什么？以及……

    - 说什么能够让她觉得购买你的产品是最佳选择？


    ### “目标顾客”销售信样板#1：


    下面这封销售信样板，展示了 SPA 水疗中心是如何吸引医生以及保健专业人士这些“目标顾客”的。


    亲爱的李华医生：


    （直接使用目标顾客个人化的名称，可以获得顾客的注意。）


    请允许我向你介绍一个关于医生的小秘密，你可能会大吃一惊！


    （使用开场白吸引目标客户的兴趣）


    你知道吗，超过 80%的医生都做水疗。你猜为什么？可能是因为医生是压力最大的所属行业之一。不幸的是，压力既会影响到你的工作，还会影响到你的生活。


    （围绕开场白的主题，继续深入，揭示秘密，陈述潜在客户的问题）


    这就解释了如此多的医生做水疗的原因之一。医生工作一天，面对形形色色的病人，林林总总的问题，下班后，做水疗可以减轻这一天来的压力。（陈述问题的解决办法以及好处）


    #### 下面是一个你可能已经知道的秘密


    60%的医生在从医后五年，都离婚了，这个数据令人悲伤，却是事实。是不是因为压力大，工作时间长？


    很可能。


    （通过利用数据陈述另一个问题，强化潜在客户的兴趣）


    有趣的是，所有离婚医生的配偶都反应，他们离婚的原因是：“我们从来没有时间放松，彼此也没有时间交流。


    （陈述问题的根源，击中潜在客户要害）


    李华医生，我希望你收到了我寄给你的名为《忙碌的医生解压终极秘籍》的CD。如果你还没听过它，请在你准备去工作的时候，花一点时间听一下。（提醒你的潜在客户你为他送去了解决问题的方法）


    #### 忙碌的医生解压终极秘籍


    这么多像你一样的医生都选择了水疗，是因为它是解决医生日常面临的诸多问题的完美方法。


    Spas 水疗给了你放松的机会，让你尽情享受和爱人在一起的时间，给予你培养感情的时间。


    想象一下，紧张的一天工作后，晚上回到家，和爱人去做个水疗，感受压力的释放。水疗将是为你繁忙的一天减轻压力的终极方法（可能正是你的爱人所祈祷的）。（再次陈述解决方案，帮顾客想象拥有产品好处的美好景象）


    #### 使用你的专用代码


    使用专用代码“X58”访问我们的网站，获取我们专门为你准备的特殊礼物。或者你可以打电话给我们，告诉你的专用代码，我们会立即为你邮寄让你惊喜的礼物。（销售提议）


    我们是XX地区的唯一水疗设备供应商，专注于为像你一样的医生提供最高品质，性价比最高的水疗服务。（建立更多信誉）


    #### 让我们听听其他医生怎么说


    我说了不算，让我们听听我们最近的客户怎么说。医生王XX，是一位骨科医师，对我们的水疗服务非常满意。（使用证词巩固你的信誉）


    *亲爱的ABZ:*


    我无法用语言描述接受水疗后，我有多么开心，多么满意。没有什么比辛苦一天后回家做个水疗。它赶走了我的疲惫。


    我的妻子很爱它。她说，这是第一次我们有这么长的时间交谈。她很开心，我也很开心（你一定能体会我的心情）。


