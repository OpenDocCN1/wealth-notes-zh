    \ 10 天内得到你的回答。\n\n241\n\n## 步骤#13: 撰写附言\n\n练习：\n\n在笔记页，写下你的顾客阅读率最高的附言。\n\n## 步骤#14：销售信流程\n\
    \n撰写销售信的17个步骤，带你从头到尾撰写一封对话式的销售信，强烈呼吁顾客采取行动。\n\n- 整体文案有一套流程，是销售文案的骨架。\n- 完成所有的步骤内容，剩下的只是组合而已。\n\
    \n## 撰写销售信的 17 个步骤\n\n- 1、**引题：** 对你文章的主要潜在客户进行定位，并抓住他们的注意力。\n- 2、**标题：** “广告中的广告”；其目的是吸引读者继续往下阅读。\n\
    - 3、**副标题：** 加强标题中所呈现的理念的作用，引起读者的好奇心。\n- 4、**问候语：** 称呼，开始与人建立第一印象的称谓。\n- 5、**导语（起始段）：**\
    \ 告诉大家，这篇销售信是为谁准备的，以及阅读它可以从中获得什么。\n- 6、**主体文案：** 文案的大部分内容；它是由下面的所有要素组成的。\n- 7、**小标题：**\
    \ 比标题更小的标题，其作用是：将销售的各个主要部分分隔开来；小标题就相当于你的文案的“救火分队”。\n- 8、**建立关系：** 证明你了解读者的痛苦，知道他们的难处，用你与读者所拥有的一些相同的经历来证明。\n\
    - 9、**可信度：** 回答读者对你的提议最抵触的一个问题，“我为什么要听这个人讲的呢？”\n- 10、**子弹头：** 用很简洁的一句话，定义你的产品或者服务所提供的一个好处（但是不要透露那个好处是如何产生的！）。\n\
    - 11、**客户见证：** 由读者所了解和信任的第三方来证明，你的解决方案确实像你声称的那样有效。\n- 12、**塑造价值：** 强调你提供的产品对于读者的价值，并将其高价值与低价格形成鲜明的对比。\n\
    - 13、**赠品：** 与你提供的产品相关、但却令人们意想不到的礼物，可以提高你产品的价值——“额外的一度”。\n- 14、**零风险保证：** 消除完成订单的最大障碍（潜在客户都害怕你欺骗他们）。\n\
    - 15、**号召行动：** “号召人们订购”，告诉读者接下来要做什么。\n- 16、**结束语：** 表达一种礼貌，告知顾客你的介绍已经结束了。\n- 17、**附言：**\
    \ 总结你的产品可以为读者带来的最重要的好处。\n\n### 注意：\n\n- 写文案的时候，心中一定要有一个目标。你想要你的潜在客户做什么？\n- 只有针对你的利基市场，写出的文案，才能激发受众产生共鸣，并采取实际行动。\n\
    \n## 销售信样板:\n\n著名的“局内人”高级职业高尔夫球运动员揭示了一条惊人消息，让“有多年经验的”高尔夫球人欢欣鼓舞……\n\n> “肩膀手术后，我基本没有什么力气了，我的挥杆摆度小了一半……因此，我不得不去寻找超级高尔夫球的真正秘诀。”\n\
    > 结果:\n> “我现在60岁，挥球远度比我在28岁参加锦标赛中打的最远的求还远！”\n\n有多远？他著名的一次赢球是以370码的远度击进了小鸟球，让他成功晋级美国松树俱及高级公开赛。这只是一个例子。最精彩的部分：他在仅仅20分钟的时间内……就能教会你准确击出长球的秘诀！但是，不要相信我……因为如果你选择……你能全部免费学习……\n\
    \n- 来自于：亚克·奥莱利博士\n  Golf Nut总裁，OHP教练\n\n首先……你想准确击出三个足球场的距离的发球，你不用等到60岁。你将要学的秘诀和年龄无关。\n\
    \n但是，你很快就会……\n\n击出你有生以来最远的发球……不管你年龄多大。或者你现在处于什么状态。关节炎、膝盖痛、腰部疼痛、腹部疼痛……这些都没有关系。\n\
    \n下面你将发现的秘诀，能够让你在打高尔夫球的时候，排除一切现有的（或以前有过）的身体障碍，从而在球道上打岀直、远、准的球。你在任何方面——力量、灵适度、天赋以及运动体质都可以是“零基础”，身高也不用很高……你仍可以获得雄鹿般的力量。\n\
    \n事实上……我敢肯定，你肯定不会比 Jake Harder 更惨：28 岁的时候，他还是一个非常优秀的高尔夫球手。那种在击球的时候几乎会跳起来。球会击的很远。\n\
    \n他也很倔。为了证明一点，他坚持在一场长球比赛中用一种木制的球杆！（他用比其他选手都古老的球杆打出了最好的成绩：338 码。）\n\n但是岁月不饶人。在他\
    \ 50 多岁的时候，他由于肩膀问题，做了一场大手术（肌腱膏——运动员身上发生的最糟糕的事情之一）。\n\n> 结果：那场手术夺走了他的一切。没有一点力量。没有可用的肌肉。他握球杆都很勉强，更不用说准确击球了。\n\
    \n医生说他的高尔夫生涯从此结束了。\n\n但是正如我说的……Jake 非常倔。因此，虽然他所有的力量都消失了。他再也没有办法用“肌肉”的力量把球从球座上击下来了。\n\
    \n从此，只有他……他的球杆……他的球……\n\n# 一个新的短杆挥杆诞生了，\n# 就像要把球直接从球座上切下来似的！\n\n他曾经是一个很好的高尔夫球手，这点对他帮助很大。因为，虽然他之前一直在用力量打球，但是他也怀疑过挥球背后的真正力量，或者他之前打出的长挥杆和他的肌肉无关。\n\
    \n现在，请仔细听我说：Jake 再也不会用高尔夫球老师教你的那一套了。\n\n如果他去找老师，他们会收取他的钱……最多也可能只教他打出 90 码的球。他们没有办法帮助一个处于他这种状态的人。\n\
    \n因此，Jake 知道他不能找“传统的”老师。事实上……他不能找任何人寻求帮助。因为没有任何人对教像他这样的上年纪却想自己的力量打球的人给予过关注。\n\n\
    大多数“专家”都不相信上年纪的人还有力量打球。尤其是那些“受了伤”的老人。因此，你能够想象到，当其他老师看到 Jake 在 60 岁的年纪又打出了比他年轻时作为职业高尔夫球手的时候还要远\
    \ 60 码的球，有多么震惊！\n\n这是一个他们*已经放弃*了的人。他完全依靠自己发现了高尔夫球真正的力量。**没有任何“专家”的帮助**。\n\n这位老人，肩膀有问题，用短挥球，肌肉完全没有力量……\n\
    \n# 现在，让比他年轻，强壮的高尔夫球手震惊了！\n\n现在……有史以来第一次……*你*拥有了这次能够自己学习这些秘密的机会，机会稍纵即逝。\n\n这是你想要的吗？拥有突然能击出三个球场远度的球的能力——不用煞费苦功或练习甚至不用太多地改变你现在的击球方式，好像你能“看穿整个赛道”……\n\
    \n你一定能感受到这种经历有多美好吧？你也可以，而且很快就能实现，你在下一次打高尔夫球的时候就可以大展身手。Jake的高尔夫球知识让他发现了简单地……\n\n\
    # 永远改变高尔夫！\n\n你以前肯定没有见过这样的事情。\n\n以后你也不会见……因为Jake的发现是“潜伏”在你身体里的。事实上……当他为我展示怎么做的时候……他实际上开始击球……\n\
    \n# 眼睛是闭着的\n\n但是每个发球都笔直地沿着赛道跑了很远很远。（在他挥完球以后，他会说：“嘿，博士，你看到球被打到哪儿了吗？”我会说：“是的，Jake，它叉在赛道中间。”这是不平常的一课，他发现的东西惊人地简单。你甚至在击球时再也不用看球了。）\n\
    \n但是，你在发球时“看起来”仍然是正常、传统的高尔夫球手。没有一个人能够看出来或者判断出你在做什么。\n\n事实上，你甚至根本不用对你现在的挥球方式做过多改变。你只要注意几点——不用做很多练习——就可以击出直球。\n\
    \n非常简单。\n\n然而……一旦Jake向你展示出你身体内隐藏的真正的力量……\n\n# 你就再也打不出短球了！\n\n你将要学会的是……\n\n- 非常简单，你只要花20分钟就可以“得到”……\n\
