    - 顾客恐惧的8种表现形式是什么？

    - 教育顾客的21条文案要点？

    - 你必须避免的11个销售信错误是什么？


    我希望你认真聆听CD中的内容。把你的答案写到“笔记”页上。


    把答案写下来，是保留学习痕迹，强化记忆的好方法，一定要坚持。确保当

    你真的开始文案写作，当你开始做真正的市场营销后，你还可以回来查看。


    ![](img/f4276e7f9d3f5414e4babc8c166139a6_10_0.png)


    ## NOTES


    ### 顾客恐惧的8种表现形式：


    1. 害怕买贵了

    2. 害怕让人笑话

    3. 害怕买到次品

    4. 害怕买到的不是最好的

    5. 害怕买了个用不着

    6. 害怕产品并不像他们说的那么好

    7. 害怕没有保证(售后)

    8. 害怕无法获得退款 (如果买错了怎么办)


    ### 顾客成交的21条文案要点：


    1. 强调激化自己

    2. 永远遵守AIDA法则(注意力、兴趣、欲望、行动)

    3. 测试标题

    4. 确定产品的UPS

    5. 描述产品对顾客的好处、价值

    6. 减字

    7. 文案内容要详尽,包含所有要点

    8. 引起共鸣、呐喊

    9. 陈述产品最大好处

    10. 小标题引起顾客要问的问题

    11. 使用子弹头，下划线，粗体字，但不宜过多。

    12. 详细阐述产品信息，对产品信息进行总结。

    13. 直列标题，总结经验。

    14. 呼吁行动。

    15. 注册购买意见/购买。

    16. 不要仅仅停留在“我”。

    17. 在小范围内测试，效果好，再扩大范围。

    18. 向顾客1033万号。

    19. 合有触击所有关键按钮。

    20. 看起来个性强，令人兴奋。

    21. 使用印刷品为媒介手段。


    ### 必须避免的11个销售错误：


    1. 过于强调形象和你自己。

    2. 花时问教有顾客。

    3. 解释价格。

    4. 听取公众意见。

    5. 感觉混淆和猜测 (①询问顾客 ②使用不同的电码号码 ③优惠券 ④信息产品)。

    6. 屈服于计算美概念。

    7. 让顾客难以联系上你。

    8. 以为都是关于“我们”。

    9. 缺少大局观。

    10. 一开始就失败 (标题)。

    11. 模式过于复杂 (图形3、超过文案的一半)。


    ## 步骤#2：营销心态


    这是我最喜欢的 “文案撰写” 准备步骤。


    如果你手里有你的潜在客户需要或应该拥有的产品，那么你应该想尽一切办法，让人们看到你的销售信并接受它，因为你能让他们的生活更好。


    有好的产品，但是要知道好的产品不会自己销售自己，营销墓地堆积着很多优秀的产品，因为没人知道怎么销售它们。


    每当我把杀手级销售术语的一些基础知识 “灌输” 给销售人员时 (无论是菜鸟，还是郁郁不得志的老手) ……他们的眼睛都会闪闪发光。


    和其他能力相比，要想赚钱……学习并成为你需要成为的人，来说服潜在客户购买的能力……能够为你做其他事情，铺平道路。


    很多营销人销售东西，都拖泥带水，效果也不好。


    在我整个事业生涯，已经让很多人都改变了态度，塑造了正确的心态。


    开始，可能会让你感到惊讶，但是它确实非常有威力。


    然而，一旦你明白了其中的奥妙……你将永远摆脱无力的销售说辞。


    它将发挥真正的作用。


    - 你的营销心态

    - 你是帮助别人解决问题

    - 如果你的产品很优质，如果你无法把你的销售信息推广出去，我都替你脸红。

    - 快速让企业灭亡的错误

    - 明确利基市场

    - 你要卖给谁？

    - 她的需求是什么？她的问题是什么？以及……

    - 说什么能够让她觉得购买你的产品是最佳选择？


    ### “目标顾客”销售信样板#1：


    下面这封销售信样板，展示了 SPA 水疗中心是如何吸引医生以及保健专业人士这些“目标顾客”的。


    亲爱的李华医生：


    （直接使用目标顾客个人化的名称，可以获得顾客的注意。）


    请允许我向你介绍一个关于医生的小秘密，你可能会大吃一惊！


    （使用开场白吸引目标客户的兴趣）


