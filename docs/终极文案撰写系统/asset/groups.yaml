    # 步骤#13：撰写附言


    不管你信不信，附言是是标题和开头外读者最有可能阅读的部分。事实上，泰德·尼古拉斯和其它一些直接营销专家都已经证明：一个有力的附言可以增加一倍甚至两倍的回复率。


    所以不要认为附言只是你销售信的尾巴而已。


    用附言来强调你销售信中的好处，再次提醒你的读者这个交易是免税的，加强你的保证，介绍一个特别的惊喜奖品，或者激励潜在客户在所提到的日期或有限的时间内马上行动等。


    不仅附言的被可读性大，而且附言的附言被读可能性也是大的。


    所以确保自己最少运用一个附言，你将会看到你的回应率飞涨！'
