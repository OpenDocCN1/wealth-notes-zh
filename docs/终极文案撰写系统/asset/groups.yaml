    # 一位平凡的人，正做不平凡的事……


    他出生于山西省晋城市。做过餐饮店，销售过水果，服装，录像带，摩托车，运动器械，保健品，课程，图书等等，对于一位从事销售的人员而言，他以此为荣。他说：“经历就是财富。”


    在他的成长过程中，尝试过许多种不同的生存方式。他非常幸运地赶上了改革开放八十年代的下海创业时期，…同时…更重要的是…随着互联网时代，网络电视，视频，以及每天充斥在我们生活中的垃圾邮件等等现象的不断问世，使市场营销领域发生了彻底的改变。


    这些时代巨变深深影响着他。


    他在报纸和杂志上做广告，发现了怎样做才能更有效。


    他通过广播电台的时段来销售产品，知道如何确定受众，用什么样的说辞能促使客户马上来电话咨询或购买。


    他也参与了许多电视购物的营销策划，被很多企业老板们一再聘请。


    他通过搜索引擎营销，百度推广，谷歌竞价推广……做了大量的运营和测试，知道什么效果好，什么效果不好！


    他经过 12 年的努力和实践，把这些通过证明有效的直接营销方法，以及一些大师们已经证明过的方法，都一一记录了下来。


