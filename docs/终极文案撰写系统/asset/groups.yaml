    然而……对于很多车手来说，他依旧是个谜。原因：专业赛车人员根本不愿意和你或其他任何人分享这些秘密。


    如果可以，他们都想把杰夫关到一个任何人都找不到的地方。不要惊讶……但是……你在杂志上看到的一些专业车手，都把自己的成功归功于杰夫的指导。他们不说，当然——别人就无法知道。


    所以，他们真的，真的，真的想保住这些秘密。


    杰夫说“都见鬼去吧”。他觉得现在是时间和渴望学习这些秘诀的所有车手分享他所知道的东西了。


    不要担心这些秘诀太专业，学习起来困难。最重要的一点是，你可以几乎立刻学会这些秘密的技术和方法……


    - 不管你有多胖……

    - 不管你现在的骑车水平如何（事实上，如果你是一个新手，可能更好，因为你没有一些坏习惯，不用去改）……

    - 不管你现在骑的是什么样的车，或你需要处理什么样的车况。


    它都出奇简单……这些秘诀简单易学，容易掌握……最棒的是……


