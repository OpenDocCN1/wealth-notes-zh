    事实上……我敢肯定，你肯定不会比 Jake Harder 更惨：28 岁的时候，他还是一个非常优秀的高尔夫球手。那种在击球的时候几乎会跳起来。球会击的很远。


    他也很倔。为了证明一点，他坚持在一场长球比赛中用一种木制的球杆！（他用比其他选手都古老的球杆打出了最好的成绩：338 码。）


    但是岁月不饶人。在他 50 多岁的时候，他由于肩膀问题，做了一场大手术（肌腱膏——运动员身上发生的最糟糕的事情之一）。


    > 结果：那场手术夺走了他的一切。没有一点力量。没有可用的肌肉。他握球杆都很勉强，更不用说准确击球了。


    医生说他的高尔夫生涯从此结束了。


    但是正如我说的……Jake 非常倔。因此，虽然他所有的力量都消失了。他再也没有办法用“肌肉”的力量把球从球座上击下来了。


    从此，只有他……他的球杆……他的球……


    # 一个新的短杆挥杆诞生了，


