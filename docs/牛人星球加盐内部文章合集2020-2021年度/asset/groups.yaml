    # 梦想与魄力


    我曾经在体制内待过 10 年。据我观察，没有哪一个公务员不曾想过：如果我跳出体制会怎样？


    或多或少，我们都会梦想有另一种可能。只不过由于种种原因，大部分人只能一声叹息，把这个梦想埋藏在心里，继续沿着原来的路走下去。只有很少的人，愿意跳出来试一试。


    最近因为调研，我接触了很多农业口的公务员。昨天认识的一位，很令我感慨。


    他是一个 80 后，已经在体制内做到局长（正处级），在地方上，这已经是很不错的位置了。我们和他聊项目，发现他对创业、对互联网、对农业都特别懂。这种懂不是作为学者或者主管官员的那种懂，而是像一个曾经在这领域创过业的人那样懂。例如，项目可以有哪些方向，每个方向的商业模式是什么，可能会存在哪些坑，关键要解决什么问题，线上和线下的推广有哪些方式等等。


    我们都觉得很奇怪，问，你为什么一会懂这么多、这么深呢？


    他说，这些都是我曾经考虑过的创业项目。


    原来，这位朋友虽然少年得志，但是也有一颗不安于现状的心，很想在创业上折腾一点什么。


    但是这么多年来，总是停留在想法，或者很小范围的尝试，而没有敢破釜沉舟地出来干。从二十多岁，一路走到现在快四十，体制内职位倒是越升越高，但是心中的梦想却越来越远。


    我觉得，其实这位朋友挺可惜的。因为他的学识、眼光、思考深度、学习能力都很强，如果出来干点事，成功的几率还是很高的。未必是自己一个人单打独斗地创业，哪怕是跟人合伙，或者是加入企业，凭他的能力水平，做得都不会差，至少不会比在体制内当一个处长差。


    他缺就缺在“魄力”两个字。总舍不得体制内的安逸和保障，每次把项目想得挺好，研究得很透，却总是下不决心跳进海。


    古往今来，一个人想要做一番事业，魄力两个字是必不可少的。一个人再聪明，能力再强，但是不能决断，没有魄力的话，依然会一事无成。'
  - '[PAGE 195]


    我们看《资治通鉴》，会发现一个历史人物如果“好谋而无断”、“多谋寡断”，就可以肯定这个人的结局不会太好。而另外一些人，也许能力差一些、智慧少一些，但是有冲劲，敢干事，反而能够成功。


    “决断”是非常重要的种能力。人生的很多关键时刻，就是需要决断。缺乏决断的人，也许可以安稳地过一生，但他一定会有很多遗憾。而决断的人，也许会错，也许会失败，但是不会给人生留下遗憾。'
