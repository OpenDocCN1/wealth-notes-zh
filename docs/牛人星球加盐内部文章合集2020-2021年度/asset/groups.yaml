    # 你感受不到的，也许才是最好的


    请问一下，此刻，你能感受到你内裤的存在吗？


    我相信在我问这个问题之前，绝大部分人，都根本不会把自己的任何一点意识，放在内裤上面。而如果你感知到了内裤的存在，那只能说明一个问题，它让你不舒服了。


    我们所有的衣服，如果非常合身，非常舒适，那我们是感受不到它们的存在。只有不合身了，让我们不舒服了，我们才会时时刻刻意识到它的存在。


    所以最好的内裤，最好的内衣，最好的卫生巾，最好的衣服，最好的袜子，最好的鞋子，都有一个必不可少的标准，那就是当你穿着（戴着）它的时候，你会完全忽略它的存在。


    同样道理，我们身体的任何一个器官，当它好的时候，你永远想不到它。只要有一点不舒服，那就时刻提醒着你，原来你还有一个胃、还有胳膊、还有手指、还有腿呢。


    月初，我的左手腕莫名了疼了一个星期。在那之前，我从来没有注意过这个位置，但是它的疼痛，让我每天都想着它。此时才意识到，原来它静静地待着、不惹麻烦的日子，是多么宝贵啊。


    扩而大之，我们的健康时刻陪伴着我们，但我们不会想着健康的存在。只有当生病了，受伤了，不舒服了，才会明白，以前的健康有多宝贵。


    我们子弟兵时刻陪伴着我们，但我们不会想着他们的存在。只有当遇到危险了，才会感受到解放军是最美丽的人。


    类似的还有空气、阳光、洁净的水、父母妻儿无声的爱、运行良好的政府等等。


    它们已经好到极致，所以你不会有意识地去意识到它，只会当成理所当然的存在。


    新冠病毒的肆虐，会让每个中国人感受到，原来平静安宁的生活，是如此幸福。


    最近美国的动荡，就会让美国人感受到，一个和平稳定的环境，会有多重要。这不是上帝的恩赐，而是要在好的政治、经济、社会环境下，尽力维持才能'
  - '[PAGE 233]


    得到的，而不是自然而然的存在。


    从这个角度来看，很多幸福，都是比较出来的。当没有难受时，你不会感受到舒适的存在；当没有病痛时，你不会感受到健康的存在；当没有危险时，你不会感受到安全的存在；当没有动荡时，你不会感受到稳定的存在。


    这并不意味着我们要主动去寻求难受、病痛、危险、动荡，以便感受到舒适、健康、安全、稳定。但是，当我们经历了前者，不妨把它当成一个馈赠和警醒，更加珍惜后者，用更大的力气去追求和维持后者。


    如果一个人、一个组织，能做到必不可少，无所不在，但是你却永远感受不到他，这也也许正是因为他做得太好。正如扁鹊“治未病”的大哥，“我无为而民自化”的先王。'
