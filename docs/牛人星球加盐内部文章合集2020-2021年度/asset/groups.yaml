    不要拓展那个领域。


    所以人与人的相处，“听话听音”是一个很必要的技能。如果老婆说“我这个包特别重，每天拎着都好累”，而老公却无动于衷，那么很有可能当天晚上老公哪怕不累也别想做作业。


