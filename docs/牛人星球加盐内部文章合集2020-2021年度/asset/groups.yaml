    # 手机控制了我


    我们小区里孩子很多，每晚都很多家长带着聚在一起玩儿。我平时如果晚上没事，也会是其中一员。


    我观察到，大部分孩子都是老人或保姆带着，父母带的不多，大概只有1/4左右。


    而父母带孩子的方式，又分为两种：一种是全程不看手机，都在跟着孩子跑，或者在旁边看着；另一种是让孩子自己去玩，自己在旁边看手机。


    我自己属于两种兼有，有时候也会跟着小孩一起玩，或者在旁边看着他玩儿；但有时候也会随他去，自己沉浸在手机里面，只有偶尔抬头看一眼他在什么位置。


    最近突然在思考这个问题：当我选择放下手机陪伴孩子的时候，和我在一旁只顾自己玩手机的时候，那个时候的我更幸福快乐呢？


    其实回想起来，陪孩子玩的时候，是更加幸福快乐的，或者站在一旁看着他和小伙伴们玩得很开心，也是一种乐事。而自己在旁玩手机，并没有更加幸福快乐，充其量也就是跟自己在旁边看着小孩玩差不多。


    从教育小孩的角度讲，我们应该选择“效果”更好的方式，也就是放下手机，加入他们；从自我享乐的角度讲，我们应该选择“效用”更高的方式，就是让自己更加快乐。


    但现实是，很多人，或者部分人的很多时候，都选择了相反的方式。


    是什么阻碍了我们做出更好的选择呢？


    我反思了一下自己，当我去看手机的时候，心里完全是无意识的，不知不觉就摸出来了，然后就看上了，一看就是十几分钟、半个小时。要说手机上有什么需要我紧急处理的事情吗？其实并没有，就是漫无目的地乱刷。一会儿点开看看牛人星球有没有人留言点赞，一会儿点开微信看看有没有人发信息，一会儿点开公众号后台看看有没有留言或赞赏，一会又刷一刷微博。有时候上面这一轮都做完了，实在没事儿做了，就点开之前没看完的小说继续看——《平凡的世界》和《白鹿原》又看了一遍，四大名著的三本也都已经温习一遍了，现在剩红楼梦看了一半。如果这些都看完，恐怕我又要去温习金庸全集或再刷一遍《三体》了。


    这实际上一种已经上瘾的恶习。我无法控制手机，是手机控制了我。我以为'
  - '[PAGE 320]


    它是我的工具，但实际上我是它的奴隶。也许从生理学上，我们可以通过核磁共振或别的什么方式观察到，我的脑子已经发生了某种病变。


    我又更深地去想，当我掏出手机去看的那一刻，到底是一种什么动机在驱使我呢？想来想去，有可能是“无法忍受的无聊”和“逃避更需要耗费大脑能量的事情”。


    我在两种时刻最容易被手机奴役，第一个就是无所事事的时候。例如带小孩的时候，陪着玩儿还好一点，如果只是在旁边看着他，只要过了几分钟就会觉得很无聊，然后手就不由自主地伸向手机了。平时等电梯、坐地铁、在家闲着，甚至哪怕是走路，都要找一个事情来把那些无聊的时间“杀”掉。


    我以前读王小波的一篇文章，里面说忍受无聊是一种很高级的能力，当时不能理解，现在觉得无比正确。而我就是缺乏这样的能力。这其实是一个弱点和一种毛病，是需要去花力气克服的。


    第二个是在做一件需要深度思考的事情的时候。例如写文章卡壳时，需要调动大量的大脑能量去构思，这时候就不由自主地想要逃避，于是手就伸向了手机，等回过神来，半小时已经过去了。


    忘了是张一鸣还是王兴说的，人为了逃避思考，会愿意做任何事情。这句话听着好像极端，但其实也是无比正确。我们有时候需要去学习一个艰难的东西，或者做一件超过自己现有思考能力的事情时，就会觉得无比痛苦。这时候，我们宁愿扫地、擦桌子、洗碗、做俯卧撑，都不愿意去继续深入思考。如果有个手机可以逃避，那更是无法忍受的诱惑了。


    以前我写过一篇文章，叫做“为什么你需要把手机放在5步之外”。这个建议其实是非常好的。但我以前把它的范围想得狭窄了，只是局限于学习或工作之时。其实现在看来，带小孩、陪老婆、看望父母，都可以应用这个方法。


    有时候带小孩玩，我会故意不带手机下楼，其实会发现更加充实。从今天起，我决定把这当成一个标准动作：带小孩下楼玩的时候，不要带手机。'
