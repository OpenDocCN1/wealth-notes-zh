    # 创业两年营收 5 个亿，本分人的魅力


    今天在一家企业讲课和调研，很感慨，特记之。


    这家企业是去年 3 月才成立的新企业，做某传统行业的消费产品，去年做了两个多亿，今年尽管受到了影响，但是比去年同期，还是增长了 30%多，而后半年的中秋、春节等假期，还是他们的爆发之时，所以今年营收超过
    3 亿，是肯定没有问题的。


    一家成立才一年多点的企业，能做到这样，也算是一个不小的奇迹。


    我仔细研究了一下这家企业，发现它的成功，完全可以说是“本分人的成功。”


    这家企业的创始人叫 Z，他之前是在媒体行业做的，以老实本分著称，在当地积累了很多人脉，当地人都知道，和这个人打交道，一定不会吃亏。


    一个偶然的机会下，Z 为了帮一个朋友 W 解决难题，帮他在自己的朋友里面推销了一下某个产品。由于这些朋友都特别信任 Z，所以 Z 的推销很快就奏效，这个产品一下子卖了上千万，占到当年
    W 公司销售额的 60%。


    W 一看，Z 的推销这么厉害，就一直请 Z 帮忙，当然后来给与了一定的回报。Z 把 W 给的回报，自己只拿 1/10，其他 9/10 都加在产品里，送给了客户，所以他的生意越做越好，一年卖了三千多万。


    不仅如此，Z 也在卖这个产品的过程中，对这个行业有了深入的了解，也在行业内积累了很好的人脉关系。


    后来，W 那边由于供应商出了问题，产品的质量下滑，Z 不愿意卖质量已经没有保障的产品，就终止了和 W 的合作。


    但是，他当年卖出产品的那些客户，又纷纷来找他，说你怎么不卖那种产品了？我们都等着你来发货呢。


    Z 于是就决定自己成立公司，直接和自己信得过的厂家联系，继续把这个生意做起来。去年三月，属于他自己的公司开张了，由于他自己基本上不图利，把利润大部分让利给消费者，而且对产品的要求很严，加上又从来原来工作的媒体离职，专门做这个生意，结果一下子生意就火起来，去年
    9 个多月的时间，销售额干到了两个多亿。


    我这次来讲课，也是抱着学习的目的，看看这家企业为什么能发展这么快。'
  - '[PAGE 26]


    考察之下，很是震撼。这也是我做咨询以来，第一次感受到什么叫企业家的人格魅力。


    在上课前，我特地做了调研问卷，问上课的高管和员工，你为什么要干这个事业。结果，一大半的人说，是为了追随Z。


    在另一个问题中，我问大家，你们公司比起其他公司来说，最关键的竞争优势是什么。高管和员工，绝大部分都选择了“创始人的远见”“靠谱的产品质量”、“强大的企业文化”等。而创始人自己，则默默地选择了“老老实分的经营”这个选项。


    由于是媒体人出身，这位创始人非常重视企业文化、价值观等的梳理，为此专门写了《认知手册》、《产品手册》、《员工手册》三本书，把自己的理念全都写到里面，并且在做公司过程中完全遵照实行。每个周六整天和周日上午，他都在公司给员工、经销商培训这些东西，连续做了一年多，没有中断过一次。


    我们还调研了Z公司员工们对使命、愿景、价值观等六大关于企业文化的问题，结果，100%的员工，都选择了“我完全明白，且可以清晰讲述”这个答案。这也是我们第一次在一家企业，看到员工对企业文化熟悉到了如此之程度。


    观察Z做事业之道，就可以发现，他完全是凭老实本分在做事。他卖给客户产品，总是找最好的产品，并给最低的价格；他找经销商，生怕对方吃一点亏，总是把自己按照行业惯例该得的利益让出去；他开公司，给合伙人和员工分钱极其大方，所以一呼之下，应者云集。


    在讲课之前，我对Z的企业做了一番考察，并且形成了几个极其尖锐的问题，一般的企业家听了，绝对会十分难堪。我也怕丢Z的脸，所以特意先问他，如果我在培训上讲这些问题，你是否介意。结果Z说，特别欢迎拍砖，越狠越好。于是我就狠狠地拍了砖，把他在全体高管与核心员工面前批得面红耳赤。


    但是培训结束后，Z一点都没有生气，反而特别感谢地对我说：何老师，您提的问题太好了，讲出了我们公司的症状，给我们指明了方向，我们特别感谢您，希望您以后经常来批评我们。


    说实话，这也是我第一次见到对员工的吸引力那么强大、企业文化做得这么扎实、对外界批评这么虚怀若谷的企业家。


    这样的企业，未来的发展不可限量。'
  - '[PAGE 27]


    # 王兴、黄光裕、段永平的读书方法


    很多人看书都喜欢从头到尾看。这也是古代一些读书人推崇的读书方法，例如曾国藩就认为，一本书没有读完，绝对不能读第二本。必须第一本全部读完，甚至完全消化，才能再读第二本。


    当然古代也有喜欢跳着读的。例如诸葛亮，就喜欢“观其大略”，而不是整本书地看。但是这种人毕竟少之又少。


    而到了现代，跳着读书的人，就越来越多了。


    王兴在和王小川的对话中，就透露过他是怎么读书的。他读书从来都不是从第一页翻到最后一页，如果是实用类的书，他就只对自己有用的那几页，如果是思想或者消闲类的书，他就随便翻，翻到哪页看哪页。王小川觉得他这种不可思议，因为小川自己是强迫症，一本书不读完就寝食难安，所以必须从头读到尾才行。


    黄光裕也在央视的采访节目中讲到过自己的读书方法。他说文凭可要可不要，但是读书一定要读的。我学习的方法和别人不一样，我看过的整本的书是比较少的，分段看的比较多，可能我整合的比较好。我们一天遇到的事情是非常多的，要学的东西也是非常多的，要学会怎么去善用，怎么去整合。


    段永平是工科出身，以前看书是不多的，到创业以后，看的比较多的是实用类的书，到美国后，看了很多投资的书。从阅读的数量上来说，他是比较多的，但是他也是并不从头到尾看一本书，而是紧抓文章的本质，看明白作者要表达什么意思。这其实就是“观其大略”的读书法了。


    现代社会，信息过于庞杂。我们看书的速度再快，也很难看完，所以一定要学会王兴、黄光裕、段永平的读书方法。


    一本书，并不用从头到尾全部看完。有很多书，就是看一下目录，找到自己用得上的地方就行了，别的地方可能未必必要看。这样可以节省大量的时间，也让读书的趣味更增加。因为有很多书读起来其实是很枯燥，很难的，还有些书写得很差，如果硬逼着自己读完，会非常痛苦。这时候不如跳出来，摘几章读一读。例如我们看《史记》，也就是调精彩章节看一看，如果那些“书”和“表”你都去看，那就累死了——除非你本来就是研究这个领域的，那才是非读不可。'
  - '[PAGE 28]


    当然，也并不是说所有书都要跳着读。有部分重点的书，是要精读的，要逐字逐句读的。例如喜欢儒家思想的人，就要把四书从头到尾看一遍；喜欢搞价值投资的，就要把穷查理宝典从头到尾看一遍等等。


    所以，如果你是个喜欢读书的人，可以挑出极少部分的书，从头认真读到尾。对于 99% 的其他书，就根据实用原则和兴趣原则，挑些段落读一下。这样可以减少大量的的无效阅读，并提高阅读体验。'
  - '[PAGE 29]


    # 牛人做事：先定意义、再找方法、再决定做什么


    有一个很火的 TED 演讲，叫《伟大的领导者如何激励行动》，讲了普通人和牛人做事方法的不同。这个视频很有启发，在 B 站就有，建议大家有时间的话搜来看一看。


    演讲者西蒙·斯涅克认为，普通人说话、做事，是按照“做什么”——“怎么做”——“为什么做”这个顺序进行的。


    例如推销一种新的酒，他会说：我们做了一款某某酒，这个酒是用什么原料、什么工艺做的，你要买一瓶吗？


    而牛人做事反过来，他们按照“为什么做”——“怎么做”——“做什么”这样的顺序进行。


    同样是推销酒，牛人会说：我们想让中国人人都能用便宜的价钱喝到茅台一样的好酒，所以我们找了最好的原料、用了最棒的工艺，做了这款酒，你要尝一尝吗？


    在牛人如何做事上，苹果是最好的一个例子。他们向世界宣告的方式，他们一切营销的逻辑，都是这样的：


    > “我们做的每一件事， 都是为了突破和创新， 我们坚信应该以不同的方式思考；我们挑战现状的方式，是不断把我们的产品设计得精美、简单、界面友好。在这个过程中，
    我们做出了最棒的产品。 想买一台吗？”


    后面的事情，大家都知道了。苹果成为当今最伟大的公司之一，它永久性 地、深刻地改变了整个世界，公司市值也冲到了万亿美元之巨。


    西蒙·斯涅克建议，做生意的人，不要想着和所有人做生意，而是要和认同你信念的人做生意。人们买一个东西，并不是买东西本身，而是买隐藏在其背后的信念。


    所以，推销的关键，是先告诉你他的信念，而不是你的产品。


    你看马丁·路德·金的演讲，他讲的是“我有一个梦想”，而不是“我有一个计划”、“我有一个解决方案”。他吸引来的就是拥有同样梦想的人。


    除了营销推广以外，公司招人，也要采用这样的方式。


    最牛逼的公司招人都是这样：'
  - '[PAGE 30]


    我们拥有一个伟大梦想，要改变世界的某一个方面；我们认为，要找一群最牛逼的人，用最酷的方式干活，给最高的工资，才能实现梦想；因此，我们成立了这家公司，做了这些超酷的产品。你要加入我们一起，为这个伟大梦想而奋斗吗？


    所以你看马云每次讲话，都不是说我们阿里巴巴是最好的，淘宝是最好的，总是说，我们想让天下没有难做的生意，我们想做一家活 102 年的企业，我们想帮助中小企业，我们想让中国消费者能方便地买到价廉物美的商品等等。


    在我们平常说话，写文章时，也可以采用这个方式。我也是看了这个演讲之后，才发现自己原来很多影响很广的文章，正是暗合了这个方式；而一些阅读量较低，影响效果一般的文章，却违反了这种方式。


    所以，如果你今天已经知道了，不妨在日常生活、工作中用起来，也许你会发现惊人的变化。'
  - '[PAGE 31]


    # 网红主播就是推销员?


    昨天去一家企业调研。他们现在准备做打造直播网红、培训带货主播的业务。负责人和我讲，主播本质上就是一个推销员，我们能做好销售的培训，就能做好主播的培训。


    我一听，就觉得他们走偏了。如果把主播定位为推销员，用做销售培训的套路去做主播培训，一定会失败。


    因为，主播的本质，是“明星+专家”，绝对不是推销员。培养主播，需要用明星养成和专家成长的思路和方法，而不是培训推销员的思路和方法。


    主播带货，必须满足两个条件：一是能够带来流量；二是能够把流量转化为成交。第一步是明星路数，第二步是专家路数。


    人们看直播，绝对不是为了看人推销货物，而是为了看“明星表演”和“专家讲解”。


    带来流量，就需要主播形成自己的个人风格、展现自己的独特魅力。这样才能吸引一群喜欢看自己直播的观众。


    转化成交，就需要主播能够用最简单、形象的语言，介绍产品的特质，并将其与观众在心理上形成关联。


    这两样，都不是普通的推销员能够做到的。


    另外，在公司的资源投入以及对潜在主培训的过程中，如果定位为推销员，那么投入的资源和设计的课程就会错配。


    而且受训人员会形成错误的认知和预期。他们觉得自己要成长为一个推销员，而不是一个明星加专家的角色。他们内心就不会有网红的梦想，也基本上不可能成长为网红。


    在事业上，领导者要能够给员工准确定位，心里明白每个员工要做什么事情，要给什么资源，要培养成什么样子，同时还需要给他足够的梦想。如果对员工的身份和作用定位不清，就会导致员工自己不知道自己要干什么。如果没有足够的梦想激励，员工就不会有足够的动力。'
  - '[PAGE 32]


    # 让自己开心起来


    我做过几次关于人生规划或者企业员工激励的培训，每次都会让他们填一份问卷，其中两个问题是：


    最近一个月让你特别不爽的事情是什么？


    最近一个月让你特别开心的事情是什么？


    我发现，有一部分人，没有特别不爽的事情；也有一部分人，没有特别开心的事情。比较奇特的是两个发现：


    +   “没有特别不爽的事情”的人，是“没有特别开心的事情”的人的真子集。


    +   两个问题都回答“没有”的人，基本上都是男性。


    其实，刚开始看到填“没有特别不爽的事情”的那些人，我是持羡慕态度的。如果一个月一月让自己特别不爽的事情都没有，那不是挺好的吗？


    但是，当我看到这些人也同时填了“没有特别开心的事情”时，就不再羡慕了。原来，如果你丧失了感受不爽的能力，就同时也丧失了感受开心的能力。


    这部分朋友已经进入了“无悲无喜”、“古井无波”的状态。


    从修佛的角度来看，这是一种令人追求的状态。但是对于绝大多数普通人而言，当生活陷入到这样的状态时，会不会太无聊，太平淡？


    我认为，人还是需要有体会生活悲喜的能力。因为我们过的每一天，共同组成了我们的生命，酸甜苦辣都有，才是一个丰富完整的人生。


    而且，一个人如果想要在社会上达成一定的成就，必须是有某一种强烈的意愿驱动。他会因为事情背离自己的那种意愿而感觉强烈的不爽，也会因为事情按照自己那种意愿前进而感觉强烈的开心。这是事业进步的动力源泉，某种程度上也是人类进步的动力源泉。


    其实，我们的“不爽”与“开心”里面，藏着最真实的自己，也藏着最有潜力的自己。'
  - '[PAGE 33]


    # 一个融资百万团队的生存状况


    我办公室同一层楼有另一家新媒体公司 A。由于是同行，我平时会稍微关注一点，每次经过他们门口，都会往里看一下，偶尔也会看看他们公众号的发展情况。


    他们是一个 20 万用户的中等号，居然拥有 5 人的全职团队。我一直都很好奇，这样的号是怎样维持下来的。


    这个月，我隔壁搬来了一家新的公司 B，来的第一天，该公司老板就来我这边拜访，说听说有个自媒体大 V 的，特地来认识一下。


    一聊之下才知道，原来 A 公司是它们投资的，投了一百多万。


    我这才明白，原来 A 公司能维持一个 5 人团队，后面是有融资支撑。


    B 公司先后投资了 40 多个公众号，花了好几千万。到目前为止，绝大部分号都没做起来。A 的 20 万用户公众号，已经是他们养起来的最大一个号了。


    我心里感叹，这个行业真是人傻钱多，几千万就这么没了。


    而 A 公司这个唯一成功的号，我看了一下，平均一天半发文一次，阅读量很不稳定，6 千到 3 万不等。广告不多，也没有其他变现方式。


    我想，100 多万的融资，养 5 个人，加上办公成本，也就是一年多的时间就花光了。现在 A 公众号的收入，最多勉强养活两个员工。5 个人是怎么做下来的？除了情怀或者混日子，我想不到其他答案。


    其实看 A 公司的办公状态，也可以看出他们发展前景的端倪。


    他们公司上午基本上是见不到人的。偶尔有一个人 10 点多会来到。其他人大概是 2 点半才上班，然后工作到晚上。我有时候赶稿子晚上加班，9 点以后看他们办公室，也是没人了。而且，我从来没没看到五个人都在办公室，比较多的情况就是两三个人。


    也就是说，他们的工作时间最多也就是六个小时，而且上下班或翘班相当自由。当然，有人在家办公也说不定。但即便如此，团队要选题，要讨论，都需要开会的啊，人都不来，还怎么开？


    看到这种工作状态，我也就知道为什么他们这么多人做了这么久，还是只有 20 万用户了。'
  - '[PAGE 34]


    我觉得，团队拿投资人的钱，固然能解决启动资金问题，但是也有可能会导


    致大家没有发展的紧迫感。


    有的公司融资之后，就大肆挥霍，租高档办公楼，买豪车，出差大手大脚等


    等；还有的公司虽然未必有上面的情况，但是大家也觉得反正花的是投资人的钱，


