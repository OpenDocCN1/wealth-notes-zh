    # 提问 4：


    何老师您好，我是一名大一学生，高考后家长为了让我好找工作，让我报了公费师范生，上了大学后，开始关注您的微信公众号，看了很多牛人的故事后，我很激动，我也想和他们一样做出一番事业，我想到大城市去，我不想一辈子就在县城当一个老师！，于是我想到了考研，并且想学高科技的专业，这样才有竞争力。父母也支持我的想法，但他们建议我先回来工作两年再去考研，这样比较稳。但是未来考研形式越来越严峻，非应届生的优势越来越小，我该如何选择呢？以及大学四年我该如何规划呢？


    答：


    我的建议是先考研再工作。原因有两个：


    第一，你本科出来找工作，和研究生出来找工作，可选择的机会是截然不同的。与其普通本科出来找个一般的工作混两年再考研，不如重点大学读个研究生出来再找更好的工作。


    根据我观察大学同学和朋友的经历，同一个班，考研出来的同学找工作篇普遍比本科出来要高一个等级；同一个人，研究生毕业找的工作比本科毕业找的工'
  - '[PAGE 353]


    作高 n 个等级。考研可以让你的学校提升一个或几个档次，这点在我工作的过程中是非常有用的。


    同时，有很多职位，人家只招硕士以上。我有一个朋友，高考是某市第二名，武汉大学本科毕业，金融行业工作，这已经算够好的了吧？但是工作几年中，她曾经三次有特别心仪的职位，却都因为没有研究生学历而被拒，留下了极大的遗憾。


    第二，工作以后再考研，难度会上升几个档次。 在学校考研，你有最多的学习时间、最好的学习条件、最佳的学习氛围、最小的经济负担，是最适合考研的时候。 而工作以后，你每天工作都已经耗尽了精神，没有食堂、图书馆和自习室，没有共同学习的人、反而领导同事室友朋友家人天天还需要你干这干那，你还要天天操心房租吃饭等一堆问题，甚至你你可能已经要面临找对象结婚生子等人生大事。


    如果说在学校条件那么好的时候你都考不上，难道你还指望工作后那么艰难的条件下能考上吗？


    你现在才大一，有的是充足的时间来准备。我的建议是，前两年不用想太多考研的事儿，把功课的绩点弄好一点，四六级考试，多参加校园各种活动，享受一下校园生活。同时多看书，多上网了解各行各业，有条件的找些实习，想想自己喜欢什么、擅长什么。


    到了大三，就要全力以赴地去学习了。尽量报好一点的学校，我的建议是不要低于全国综合排名前十，或者专业领域的前五。


    你才大一，现在好好享受大学生活吧。等你快大三的时候，如果还想考研，可以再来问问关于如何安排考研复习的问题。我当年考研的成绩是 409 分，有些经验也许对你有用。


