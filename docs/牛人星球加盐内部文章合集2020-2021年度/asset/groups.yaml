    以下是极飞考察之旅最后的总结发言。我的老同学马桶做了一个较长的讲话，谈了我的过往。我听完整深有感触，也做了一个总结性的回应。


    作为本次考察的组织者，我把这次考察定义为一次“梦想之旅”，希望它给大家带来的，不仅是创业、管理、融资等方面的启发，更有梦想的触动。


