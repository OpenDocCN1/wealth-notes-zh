    \n何加盐·牛人星球会员专享  \n作者：何加盐  \n时间：2020 年 6 月-2021 年 5 月\n\n## 前言\n\n每年到这个的时候，我都要感叹，时间过得太快了。不知不觉，又一个星球年度，圆满结束了。感谢你一年来的陪伴。\n\
    \n在过去的一年里，我更新了 200 多篇文章（含加盐心得和星友问答），远远超过原来承诺的每周 2-3 篇。\n\n这些文字加起来，有 20 多万字，等于一本厚厚的书。\n\
    \n去年的合集，得到了大家的喜爱，有人自己把它打印成册，每天翻看；还有星友自发印成精美的书，不仅自阅，兼且送人，共计预订出去一千多本。\n\n这些文字都是我从心而发，随手偶得，讲究的就是此时此刻，真心所想，所以没有华丽的辞藻，没有刻意的修饰。但也正是这样，我向大家呈现的，是天然去雕饰的最质朴的文辞。\n\
    \n单看每一篇文字，是一种感觉；看合集，又会有另一种感觉。从合集中，你们可以看到我的读书脉络、交往脉络、研究脉络、创业的节奏，甚至生活的变迁。就好比一帧一帧的照片合起来，以一定的速率播放，就变成了电影一样。\n\
