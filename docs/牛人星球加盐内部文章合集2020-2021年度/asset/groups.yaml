    # **人们的渴望与短视频的隐忧**


    那天在微信总部参加内部交流，张小龙花了大量篇幅讲短视频的发展蓝图。其中提到很多次，说希望让每个人都能轻松表达。


    说实话，我听了以后很受鼓舞，但是同时又隐约感到有点不对劲。


    很受鼓舞，原因是看到张小龙这个梦想很大。我们每个人都想要表达，但是以往只有极少部分文人才会表达，后来自媒体时代来了，很多有初中以上知识的人也都能够自如地在网上表达。但能够用文字表达的毕竟还是不多，而拍个照片、拍个视频，却是人人都能够表达的方式。


    但是那种不对劲的感觉一直都在折磨着我，所以我有好多天都在思考，到底哪里不对劲。


    后来发现，其实也许我们之前理解错了：人们的渴望，并不是表达出来，而是被倾听和被认可。表达只是一种方式，被倾听才是内在。


    如果要说自由的表达，那我们每天都可以，不管是自说自话，还是写日记，都是在表达。但问题是，这样的表达没有人听。


    后来我们有了BBS，有了博客，有了微博，有了朋友圈，每个人都有办法在公众场合做一些表达。但问题是，我们表达的热情，和被倾听的程度极其相关。每次发表了东西，我们都会去关注，有多少人阅读，多少人点赞，多少人转发，多少人回复。如果发一个朋友圈，过了很久都没有一个人点赞，我们就会很沮丧，渐渐地就不想发了。如果每个朋友圈都有很多人点赞，我们就会很开心，也就会有继续发的动力。


    对于以表达为生的自媒体人更是如此。如果发一篇公众号，没有多少人阅读，没有多少人转发，不能带来粉丝，那么用不了多久，这个人就会因失望而灰心，最终停止表达。


    所以，公众号虽然想要做到“再小的个体，也有自己的品牌”，但实际上，当这个个体没有人聆听时，他也就不可能拥有品牌。就算表达得再多，他的品牌也接近于零。这么多年来，通过公众号树立品牌的，毕竟是极少数。


    视频号也会遇到同样的困境。每一个短视频的平台，都要面临着一个取舍：是扶持大V，还是扶持草根。互联网流量的特点就是马太效应和二八法则，流量'
  - '[PAGE 267]


    会越来越少，少数内容中集中。


    如果是扶持大V的平台，创作者的IP属性就会比较强，变现能力也比较强，但是格局容易固化，在经过几年的演化后，新就很再出头了。绝大多数的人都沦为小透明，不管发什么，没有人看到，只有大V的东西不断掠过我们的眼球。微博、公众号、B站都偏向于这一类。


    如果是扶持草根的平台，对于新人比较友好，一个刚注册的号，也能够通过系统的设置和算法的推荐，被一些人关注到，甚至有可能形成爆款，而在全网红火几分钟。但问题是，这样的平台个人IP属性较弱，每个人都有可能红，但是每个人红的时间只有很短。这就是抖音和今日头条的困境：某人因为一条或几条爆款，粉丝剧增，但是不久又会发现，爆款带来的效应用光了，视频曝光量和点赞数又回归到惨不忍睹的境地。结果就是：新人不断地进来，但是老人不断地失望。


    在互联网上：“每个人都想表达”和“只有少数人能被告听到”是一个永远的矛盾。因为我们的注意力就那么一点，注意力只有聚焦，才有商业价值，如果是完全分散，那就和日常自言自语的表达没什么两样。问题是聚焦到哪上面。如果聚焦到人，那么人就有动力，可以通过聚拢大量的粉丝，形成自己的影响力，但是这仅局限于少数幸运儿能够持久地获利；如果聚焦到内容，那么新人就会有所全盼，新的内容也会不断出来，但是人没有IP属性，稳定性就不高，粘性就不强。


    所以张小龙要做短视频，也必然面临这个矛盾。我不怀疑他想让每个人表达的意愿和能力，但是却怀疑短视频能否做到让每个人都被听到。如果只有表达而没有被告到，那么表达的愿望最终一定会消失殆尽。


    当然，视频号有一个比较好的地方，就是可以借助微信里已经沉淀的社交关系，一个人做视频号，不需要有很多人关注，也可以通过发朋友圈或者微信群，而强迫性地让自己社交圈里的人看到，所以怎么都能保证有一定量的聆听。


    但是对于创作者而言，如果是想要通过这种方式聚集流量，形成商业利益的话，最终也只会是少数幸运儿的游戏。也就是说：让每个人都能顺利地表达，最终的结果仍然是，只有少数人能被很多人听到。'
  - '[PAGE 268]


    # 打造自己的飞轮


    我们生活中常有这样的经验：有一些事情，需要花费特别长的时间，付出特别多的代价，才能有所收获。但是一旦事情成功了，后面就不需要再花多少时间和代价，它自己就会运转得挺好。如果你再为它付出时间和代价，那么它就越运转得越来越快、越来越好，给你带来越来越多的利益。


    这种效应，被称为“飞轮效应”。


    现在全世界最大的电商公司亚马逊，在 2002 年前后曾经遭遇重大危机。当时股价回撤了 70%，内部管理一团混乱，人员离职率超高，投资人对其前途疑虑重重。


    当时，虽然杰夫·贝佐斯本人依然是信心满满，但是压不住市场、员工、投资人无法像他那么笃定啊，所以也很愁得慌。


    后来他看到了一本书，吉姆·柯林斯的《从优秀到卓越》。


    这本书是一 本管理学名著，畅销全世界。何加盐做咨询时，也曾特地买来学习过。说实在话，从现在的眼光看，书并没有之前夸耀得那么好。柯林斯精心挑选出来、作为“卓越”样本的
    11 家企业，也并非都发展得好。


    例如，房利美在次贷危机期间几乎破产，后来被政府接管，并从股市退出；吉列公司经营不善，股价大跌，后来卖给了宝洁；电器城公司则受到互联网的冲击，直接破产。


    但是这样的书籍却有一个好处，哪怕作者举的例子是错误的，其中的理论或者建议，却依然还是有用的。


    当时贝佐斯看到这本书，大为惊喜。特地请柯林斯作为公司的管理顾问，参加公司的管理会议和董事会，讲解一家公司如何才能从优秀到达卓越。


    柯林斯指导贝佐斯和亚马逊的团队重点探讨了飞轮效应，让贝佐斯大开眼界。虽然他此前心里可能已经这么想了，但是柯林斯第一次把这个想法用专业名词包装，用系统化的语言总结出来，从而具有了现实指导意义。


