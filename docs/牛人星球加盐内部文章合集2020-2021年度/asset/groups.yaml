    生活的无奈在于，我们做决定时，无法体验这种真实；而当我们体验到这种真实时，已经无法再做决定。


    《思考快与慢》和《哈佛幸福课》两本书里面都提到，由于我们对未来的想象很多时候都是错误的，凭借这种想象来做决定，可能并不是一个好的决策方式。


    有两个方法可以帮助我们改善决策的质量。


    第一是尽可能全面地了解未来的所有细节。


    当你想起浪漫的沙漠星空时，也应该去了解一下沙子的温度和粗细、帐篷的狭窄、洗浴的不便、穿着湿漉漉的拖鞋从淋浴房走到帐篷的感觉、在温度15°的半夜穿着单薄的睡衣穿过黑暗的沙漠到两百米之外去上厕所的恐怖……如果你能了解到这些，那么，你做决策时就会更加慎重，而一旦决策，真正碰到这些问题时，也不会太过在意。


    第二是多观察和多问有过这样经历的人是怎样的感受。


    如果别人正在经历或者曾经经历这样的事情，那他们对当时是怎样的感受，会比我们的想象要客观得多。参考“过来者”的真实感受，而不是根据我们臆测的感受来做决定，会更加科学。


    以上举的例子只是生活中很小的事情，就算是决策失误，也不会带来什么损失。但是，同样的道理也适用于我们人生的关键决策。


    例如，当你要选择一种职业时，如果你心中只有想象中的浪漫或者赚钱，而不去了解职业中的各种细节，不去看现在做这种职业的人的生活状态和精神状态，那么大概率上，这个决策会把你带到沟里去。


    ## 定数与概率优势


    这周在公众号发了一篇写 “抉择的五个层次” 的文章，写了人们做出人生与事业抉择的驱动因素的五个层次：命运驱动、能力驱动、机会驱动、战略驱动、信念驱动。


    由于我文章里面举了一些例子，留言里照常又出现了很多抬杠的人。例如，我说 1996 年选择加入东北国企的人，后面很可能会经历一些比较悲惨的事，而当时加入互联网公司的人，大概率会发展得比进入国企更好一些。


    一个抬杠者说：进入东北国企的，现在可能已经是厅官了；进入互联网公司的人，现在可能也就是开个小公司而已。


    这是一个非常常见的抬杠方式，乍一听起来，还挺有迷惑性。因为我们确实无法否认，现实中有可能出现这样的情况。


    但他的错误在于，用极少数的个例，来否定极普遍的规律性。


    一个大学毕业生在 1996 年加入东北国企，成为厅官的可能性有多大呢？我想一千个里面也未必有一个。但是他在 1996 年加入互联网公司的话，凭借这些年互联网发展的东风，在财富上大概率已经超越中国绝大多数民众了。


    在这个比较里面，为什么我们说选择互联网公司比选择东北国企更好呢？因为这样选择，在成功的概率上占有碾压性的优势。


    我们做出各种决策，结果都不是绝对的，而是不同的概率组合。一个厉害的人在做决定时，并不会追求百分之百的确定，而是会不断选择在概率上更占优势的做法。


    当然，这里所谓的“概率上更占优势”，不能简单理解为“成功的可能性更大”，还包括“一旦成功的话所获得的收益更多”。它是概率和收益的综合，专业术语叫“期望收益更高”。


    以 1996 年的选择而言，我们做一个简化版的期望收益计算：


    假设加入国企后有三种可能的发展方向（这里用最简单的估算，只是起一个演示作用，真实情况不是这样，但是原理是一样的）：成为高级官员、成为一般干部或普通员工、被迫下岗。其中成为高级官员价值一个亿，可能性是万分之一；成为一般干部或普通员工价值
    500 万，可能性是 70%；被迫下岗价值为 0，可能性是 29.9999%；那么进入东北国企的期望收益就是

    100000000*0.00001+5000000*0.7+0*0.299999=351 万。


    假设进入互联网企业有三种可能方向：成为高管、成为普通员工、混不下去被迫改行。其中成为高管价值 5000 万，可能性为 1%；成为普通员工价值 1000 万，可能性为
    70%；被迫改行价值为 0，可能性是 29%；那么进入互联网公司的期望收益就是 750 万（计算过程略）。


    显然，进入互联网企业的期望收益要高得多。一个理性的决策，就是应该选择互联网企业。


    在现实中，我们未必会如此精确地计算，但是大体上对于一个决策的概率和收益还是会有一些感觉的。如果能够把“概率占优”的理念放在心上，不断去搜集更多的信息来更准确地判断不同决策之下，成功的概率和收益，那我们的决策可能会科学很多。


    ## 歌舞的技能与生存的优势


    这一周休假，带孩子们在外地旅游，所以星球的更新也只能抽空，等孩子们都睡着了以后，深更半夜地写。


    我们今晚住的是一个藏族的宾馆，晚上有篝火晚会，藏族的姑娘和小伙子载歌载舞，气氛很热烈，也带动着我们都加入进去，老人小孩都很嗨。


    这样的情景我已经也经历过。很多年前去四川的古尔沟旅游，晚上正好旁边在举办一个藏族婚礼，我们被新郎新娘拉着一起唱歌跳舞，也是被深深感染。在广州，以前在华侨新村有一个藏吧，每天晚上会有藏族歌舞，跳舞的藏族女孩会拉着客人们一起加入。


    每当参与这些活动的时候，我总是会想，当你融入到这样的歌舞之中，就会觉得这样的民族文化真是太有感染力了，会让人不自觉地就觉得亲近、喜爱。


    但有时又不免想开了去：从歌舞的天分和文化来说，汉民族比很多少数民族要差得很远，德国人英国人又比西班牙人和黑人差得很远，但是从历史上占据政治上的主导地位和现代社会占据经济上的优势地位来说，后者又落后于前者。


    假设我们认为歌舞对人类非常重要的话，为什么更擅长歌舞的群体在社会经济地位上却并没有占据更大的优势呢？


    如果歌舞天分不能让一个群体在社会经济地位上占据更大的优势，那么是什么因素让某个群体占有了这些优势呢？


    我认为，这可能和不同群体的文化特质在不同历史阶段上发挥的作用有关系。


    部落文明、游牧文明之下形成的群体特质，未必会使得该群体在农耕时代的竞争中占据优势；同样农耕文明之下形成的群体特质，未必会使得该群体在工业时代的竞争中占据优势。


    例如，犹太民族曾经在两千多年的时间里颠沛流离，受尽苦难，但是他们的群体特性却比较适应于工商业社会，所以在工业革命之后的欧美，他们迅速适应时代发展，崛起为在社会经济方面占据优势的一个群体。


    但是，随着后工业社会的来临，谁知道未来是什么样的群体素质更适应社会的需要呢？


    我认为，文学艺术、体育歌舞，可能是后工业社会更适应社会需要的特质。而那些在工业社会如鱼得水的特质，则未必会继续吃香。所以以后几百年间，人类不同群体的社会经济地位的演变，有可能和现在的截然不同。


    毕竟，社会的发展也同样符合达尔文法则：不同群体之间竞争，大自然来选择，适应的生存壮大，不适应的就落后与灭亡。


    ## 另一种生活


    你有没有曾经想过，自己也许可以过另一种生活？


    这次我们在西北地区旅游了 9 天，既见识到了不同的生活，也体验了不同的生活。


    在青海湖边，我们经过一大片油菜花田，何太和女儿兴奋地跑过去拍摄，一个小男孩拿着两个草帽防护网过来，说田边蜜蜂很多，小心蜇伤，需要带上防护网。


    趁何太她们在拍摄的当口，我们和小男孩的父母聊了聊。


    原来，他们是陕西人，每年到油菜花开放的时候，都跑到青海湖边来养蜂酿蜜。他们也不租房子，就是自己在田边搭一个棚子住。由于青海湖的油菜花花期很长（6-10 月都有），所以他们几乎每年有三分之一的时间是生活在这里的。暑假期间，孩子也会跟着过来，在这里住两个月。


    由于这里的油菜花本身也需要蜜蜂来采花授粉，所以当地人也欢迎他们过来。年复一年，周边的村民也和他们都熟熟了，几乎把他们当成了村子里的一员。


    他们住的是类似蒙古包那样的棚子，里面摆了两张床，厨具和餐桌。有小型发电机可以供照明和日用。不过像电热水壶这样特别耗电的就不行了。


    他们每天在这里养蜂蜜，也闹得发慌，所以看到有人来拍照或买蜂蜜，都会很高兴地聊天。


    最后我们买了两罐蜂蜜，总共才 40 块钱，真是好便宜。


    晚上住宿的酒店，我们又见识到另一种生活。老板一家开了一家客栈，兼营餐饮，还养了一群牦牛。


    老板一家从老到小，都好客热情。进了客栈会献哈达，离店会送礼物，每晚都会举行篝火晚会，漂亮的老板娘穿着藏式服饰，带领大家唱歌跳舞，有时还会有藏族的歌手，弹着吉他和马头琴唱歌。


    晚上，我们在店里吃烧烤，老板拿出青稞酒请我们品尝。他家里的小孩在喝旺仔牛奶，我儿子看到了也想喝，我就问老板多少钱一罐，老板直接塞了一罐给我儿子，说喝吧喝吧不要钱。


    早上，老板跑到牛棚里去挤牛奶。我看到牛棚里处处有干得湿的牛粪，老板的两个孩子就在牛棚里跟着玩，小的那个还在牛粪堆里打滚，大人也不以为意。


    上午，老板会带着客人们到青海湖边骑马或者到山坡草地上去采蘑菇。老板娘就在酒店里洗晾床单被罩。


    从我们进入客栈到离开，看到老板和老板娘的脸上，总是挂着笑容。他们的日子，似乎过得充实又快乐。


    我们也跑到山坡上去采蘑菇。由于老的老的小的动作比较慢，没能跟上老板一起，就根据老板娘指的路线自己摸索着去的，估计走岔了路，走到一片不知道什么地方的山坡。


    有一个藏民小孩和她妈妈从山坡上下来，只听妈妈叽里咕噜说了几句藏语，小孩便向我们喊道：“你们，那里不能过去，我们家的狗放出来了”。


    原来，那一片牧场有一只大藏獒在那里看守，小孩怕我们出事，便喊着提醒。我们告诉他，我们是来采蘑菇的，问哪里有蘑菇。


    小孩说：“蘑菇这边没有，要去那边”，给我们指了一片山坡。然后又喊道，你们要蘑菇，等着我回家去拿，说着飞快地往家跑。


    我们赶紧说不用了不用了，就自己往山上采。


    此时的山坡草甸上，蓝天白云映衬，青草野花如画，远远的青海湖，就像蓝色的宝石一样镶嵌在天边，美丽异常。


    如果能够在这样的生活，每天对着这样的景色，应该也非常惬意吧。


    除了观察别人的生活以外，这次度假整整 9 天，经过了沙漠、雪山、草原、湖畔，见了不同的人，吃了不同的东西，观了不同的景物，对于我们而言，也是一种别样的体验。


    每到一处地方，我都会想，如果我们在这里生活，会怎么样？一路上其实有很多地方，都让人有想留下的冲动。


    其中，我最喜欢的是宁夏的小城中卫。那里虽然地近沙漠，但是又有西北地区少有的充沛降雨。整座城市就是一个公园，水草丰美，柳树成荫，人们悠闲地跳着广场舞，脸上的安逸令人无比地艳羡。


    有时我会想，我们每日里如此奔波，所求的是什么呢？我们所向往的生活方式，离我们现在有多远？世界上的生活方式如此多样，是否我们换一种生活，会感觉更幸福？


