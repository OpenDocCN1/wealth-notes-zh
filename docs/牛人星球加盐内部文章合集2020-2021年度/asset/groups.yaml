    其次是你有没有为这种品质缴纳别人无法缴纳的报名状。例如花费别人花不起的成本，或者时间，情怀等，做一些别人根本不会做的傻事，为此情愿放弃唾手可得的钱。


    三是主导人要善于讲故事，容易感染人，能够把自己对品质的认可和坚持，自己的情怀传达出去，使人信服。毕竟别人先是要听你说，然后才看你做，最后才是尝一尝。再好的产品，都是先要你先能把别人拉过来试用才行。


    四是要有较为高端、较为广泛的人脉网络。产品要卖出很高的价格，那就必须是高端的客群才消费得起。超过 500 块一瓶的酒和超过 500 块一斤的茶叶，普通消费者一般就不会考虑，但是高端客群是很需要的，他们愁的不是没钱，而是不知道哪里有品质能保证的产品。


    如果你能找到一个这样的产品，满足这样的条件，其实很容易把一个创业项目做成功。如果觉得满足条件的星友，不妨一起讨论一下，也许我可以提供更多关于他们如何运营的细节供你参考。'
