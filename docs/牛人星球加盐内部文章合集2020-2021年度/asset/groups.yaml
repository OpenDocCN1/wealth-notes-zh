    # 认知决定未来


    不同的人，对世界的认知是不一样的。


    对世界不一样的认知，决定了人们与世界交互不一样的方式。


    同样一件事情，有的人只能看到表象的一小部分，有的人能看到更多部分，有的人能看清本质。


    自然是看得越多，越深入的人，更容易做出正确的判断，并以更好的行动去应对。


    我们也可以说，认知高低不同的人，生活在不同的世界，或者生活在世界不同的维度。


    怎样从认知的低维状态升级到高维状态呢？


    首先，我们需要接触圈子以外的信息。这就要打破信息茧房，不要被推荐机制投我所好而封闭了自己。多关注和浏览一些与自己观点不同的博主。同时，还要扩充弱关系，从弱关系圈子里获得新鲜的信息。


    其次，我们需要掌握一些世界运行的基本规律，熟练掌握常用的认知框架。简单的如二八定律、复利法则、机会成本、峰终原理这些概念，复杂一些的包括第一性原理、先相信后看见、黄金思维圈等，再复杂一点就涉及到唯物史观、精神分析学、阶级斗争等了。如果能掌握一些基本认知框架，用来分析世界时，就会清晰很多。


    再次，我们需要借助牛人的视角来看世界。普通人由于知识积累、信息获取渠道、认知框架的局限，看问题未必全面或深入，但是牛人能看到更多、更深、更远，他们对世界的认知，非常值得我们参考。如果一个牛人眼中的世界和你眼中的世界不一样，较大的概率，是他看到了、想到了你没有看到和想到的东西。当然也有可能是牛人看错了或想错了，但是这种概率要小得多。


    我们的牛人星球，其实就是一个很好的帮助大家升级认知的平台。通过社群，我们认识了更多的弱关系，从而可以了解到更多的信息和观点：何加盐也会把自己学到的、想到的不同的观点和工具，分享给大家；同时，我们还可以在群里看到大家的讨论，听到牛人的分享，何加盐也会讲述牛人的故事。希望你能够用好星球，让自己的认知不断地上升到更高的维度。


    # 为什么听了很多道理，却依然过不好一生？


    如果一个人听了很多道理，却依然过得不好，其原因简而言之，就是想得太多，做得太少。


    道理不是用来听的，而是用来实行的。如果听而不行，那就等于没听，还不如不听。


    听了道理后自己实行，那叫“君子儒”。也有一些人听了道理不是给自己用的，而是到外面去吹嘘夸耀的，那叫“小人儒”。


    真正管用的道理，不需要很多，极少数几条，甚至只要一条，就够用一辈子了。


    《道德经》说：上士闻道，勤而行之；中士闻道，若存若亡；下士闻道，大笑之。不笑不足以为道。


    有智慧的人听到好的道理，就勤勉地实行；一般人听到，有时候能行有时候不能行；傻瓜听到好的道理，哈哈大笑说这什么玩意。


    《中庸》说：有生而知之，安而行之者；有学而知之，利而行之者；有困而知之，勉而行之者。


    最厉害的人天生就懂得那个道理，不用人说他就能安而行之；比较厉害的人可以通过学习而懂得道理，因为这个道理能带来好处而行之；一般的人要碰撞了才能明白道理，然后很吃力地勉强行之。


    其实还有一种人，就是怎么都不明白那个道理，那就更别说行之了。


    王阳明说要知行合一。这个知行合一并不是说先知而后行，而是说，知和行本来就是一体。如果知了而不行，那说明还是对道理懂得不深入，不真切，实质上是不知。


    所以，听了很多道理，却依然过不好一生的人，他们只是“听见”那个道理而已。并没有入心入脑，实际上仍然是不知道那个道理。


    # 吃点亏，不怕


    我经常被别人认为很傻，尤其是在涉及利益的时候，有时候旁人不明白，为什么我会那样决策。


    其实我心里一直有一种感觉，那就是别人占我一点便宜没关系，我不能占别人的便宜。如果我占了别人的便宜，就会心里老记挂着，特别难受。所以干脆自己吃点亏算了，求个心安。


    这也是为什么我做星球，虽然少找几个牛人来分享也可以，少写一些文章也可以，不做微信群也可以，不公布我的私微也可以，只要会员招募文案写得天花乱坠一点，进来的人并不会少，但是，这就不是我做
    事的方式。我情愿在开头说得实一点，后面给人惊喜，也不愿开头说得满一点，后面给人失望。


    占便宜难受，可能是大多数人都 会有的。因为人类从结成社会以来，在长期的进化博弈中，就形成了要互助的文化，也许已经深入到我们的基因。受了别人的好处，一定要在后面某个地方还掉，不然在社群里就会受到排挤。所以受恩要图报，欠债要还钱，是人类的一种普遍心理（当然也不是没有例外，但是少数的例子并不能推翻普遍存在的现象）。


    但是，吃点亏觉得没什么，可能不容易做到。


    我们往往是，吃了亏就会耿耿于怀，虽然说一定会去报复，但是心里总是有根刺，觉得自己受了别人的欺骗，或者被人欺负了。


    其实，这还是心理不够强大，可能还有因过往的匮乏而造成的不安全感在作祟。


    愿意吃亏，是心理上自信的表现，也是实力上强大的表现。吃一点亏，我不觉得是别人在欺骗我或者欺负我，也有可能对方也是出于对我的不理解而防范，并不是要以我为壑。在与人交易和交往中，我总是会觉得我付出不够，得到太多，所以别人想要多一点，我并不会觉得有什么，反而是出了一口气：太好啦，我终于能不那么亏欠你了。


    # 别人不懂，我不生气，不也是君子吗？


    以前读论语，看到“人不知而不愠，不亦君子乎”这句，没有留下任何印象。


    这几天研究段永平，看到他几年前在接受别人采访时，对主持人、嘉宾一些和他观点不同的看法，简直是不加掩饰的智商鄙视。在网易财经的一个采访，言语之中的不耐烦，已经可以透过屏幕喷薄而出了。


    我当时就觉得，这个段永平和我印象中的不一样。因为总是听段永平讲“本分”，讲“integrity”，讲“我从巴菲特那里学到最重要的就是谦卑”等等，就认为他对人肯定是如春风般的温暖，没想到是这样秋霜般的冷酷。


    于是，再看到“人不知而不愠”那句话时，就马上想到了段永平的例子，并推而广之，想到我们个人的日常修养。


    每个人由于经历不同、知识结构不同、性格不同，因而看问题的角度肯定不同。所以我也常说，被误解是表达者的宿命。


    但是，如何处理别人的不理解甚至误解，就考验表达者的心理了。


    我看到公众号后台出言不逊的留言，刚开始会很生气。有时，一个人的恶意伤害，会让我一整天都想着这个事情，情绪会变得很不好。后来经历得多了，才变得麻木起来。


    在工作和生活中也是，一个事情，向对方说过三遍，对方还听不懂，或者还不管，心里的火就蹭蹭上来。恨不得大骂对方笨蛋。


    想比往常，也经常会这样说：“你怎么连这都不知道？”“哎呀，那个甲方太弱智了，怎么都跟他说个明白！”“你一点都不爱我，连我在想什么都不知道。”……


    还有一种“人不知”：对待老板或心仪的公司，我满身光环你却不见；对待家人或朋友，我一片好心你却不知；对待爱人，我满怀愁苦你却不察。这个时候就会心里委屈或者怨恨。


    这些不都是“人不知而愠”吗？


    说来谈去，还是修养不够。


    段永平后期的演讲和采访，就慢慢平和多了。有一次接受采访，他太太看了全程视频，惊讶地说，你怎么这么温和，一点都不咄咄逼人了？


    段永平高兴地说：哈哈，那说明我掩饰得比较好。


    从这里，我看到段永平心境上的进化。


    其实，当我们认识到人与人的认知差异，就会知道“人不知”是常态，有什么好“愠”的呢？如果别人不知我就愠，那什么时候才能“不亦乐乎”？


    所以，我们不妨时时把“人不知而不愠”这句话放在心上体察。当下次别人不懂你，你想要发火时，也许能想起它。


    这才是修养功夫。


    # 生活有贫富，心中无高下


    之前说过孔子和子贡在对待贫富问题上的不同。今天看华杉写的“讲透论语”，觉得他的解释比我的高明多了。


    之前我是这样理解的：


    ——————以下为引用——————


    > 子贡曰：“贫而无谄，富而无骄，何如？”

    >

    > 子曰：“可也。未若贫而乐，富而好礼者也。”

    >

    > 这里，子贡就是典型的防御型。穷的时候不卑躬屈膝，富的时候不骄横无礼，通过损弃坏而达到好。

    >

    > 但孔子是典型的进攻型。贫穷时也要安乐，富贵时则要好礼，通过提升新的品德来让达到更好。


    ——————引用结束——————


    不能说我的理解不对，我这也是一个角度。不过华杉讲了另一个角度。他认为：


    子贡的贫而无谄，是心里还时时装着一个贫字。虽然是时刻提醒自己，不能因为低下就去谄媚别人，但本质上是觉得自己穷，所以身份地位比别人低下。


    富而无骄，也是这样。本质上是觉得自己富，身份地位比别人高，心理上已经在骄傲了，只不过是从行动上提醒自己不要以富贵而骄人而已。


    而孔子说的贫而乐，富而好礼，是心里根本就没有自己贫或富的概念，其快乐与好礼，已经和贫富无关，超出贫富之外，成为固化在自己心里与行动上的东西。


    我和华杉的区别在于，我看的还是外表，他说的已经点到本质。当然，他也是通过学习朱熹、张居正、刘宝楠、钱穆等人的注解，领悟到这一点的。


    子贡听到孔子那么说以后，回复道：


    > 诗经里面说，如切如磋，如琢如磨，就是这个意思吧？


    孔子高兴地说：以后可以和你谈论诗经了。


    以前看到这里觉得有点莫名其妙，为什么子贡突然说这句话，而孔子又为什么这么开心。


    现在知道了，原来是子贡领悟到个人的品德、学识、心境，距离老师还差得太远，还需要不停地学习、打磨，就像工匠雕刻象牙、打磨玉器一样。


    我自己的感觉也和子贡有点像，学问与品德之道，真的是要如切如磋如琢如磨，才能日日精进。


    我觉得今天因为领悟到这句话，比昨天又进步了一点点，很高兴。


    是为记。


    # 企业 KPI 和价值观冲突时，怎么办？


    企业是追求利润的，在企业管理中，一般也都会设置营收目标、利润目标，或者其他运营指标。相信牛人星球的星友们，也多少少都曾背过业绩指标。


    但很多企业，同时又会有价值观的要求，而有些时候，这个价值观，会和 KPI 相矛盾。


    例如，某公司的价值观要求以客户为中心，但是 KPI 要求销售额要达到 1 千万。你作为销售经理，发现采用一些忽悠客户的招数，能够提升销售额，但是却会损害客户的利益（例如，向客户推销他实际上并不需要的功能），你做不做呢？


    又如，某互联网企业的价值观要求真实、客观提供信息，但是 KPI 要求某产品用户数年底达到 1 个亿，你作为运营经理，发现弄一些耸人听闻的虚假信息，能极大地增加用户数，你做不做呢？


    再如，一家企业的价值观是向善、不作恶，你作为产品经理，发现某个产品可以极大地提升公司在某领域的市占率，但实际上该产品可能是对社会有害的，你做不做呢？


    KPI 和企业核心价值观冲突，是企业经常会碰到的问题，也是企业的老板、高管和员工，经常在内心天人交战的事情。


    马云曾经说过，如果业绩与价值观对立，这种事情是行不通的。


    如果 KPI 常常与价值观对立，那要么说明公司产品或者销售产品的方式本身就不符合价值观，要么说明公司价值观太虚伪了。


    通常来说，问题出在一下几个方面：


    - 产品问题


    有些公司，制造的产品本来就对社会价值不大，甚至没有，有些还有害。那么，它的 KPI 和价值观（假如有的话），必然是冲突的。


    - 销售方式问题


    有些公司，产品总体上是有帮助的，但是销售的方式不对，例如强买强卖、坑蒙拐骗、拉人头等等，这也会造成与价值观（如果有的话）的冲突，进而使得大家内心痛苦。


    - 价值观本身的问题


    一种可能是价值观太虚或者太偏了，和商业沾不上边，和企业产品及业务也扯不上任何联系，所以企业不管怎么制定 KPI，都是和价值观不协调的。


    第二种可能是价值观太实或太窄，商业想象力不够大，市场空间被局限了，这时候想要做大 KPI，就只能突破价值观的限制。


    - 产品和价值观不匹配


    有些公司，产品也不错，价值观也不错，但是两者是脱节的。


    一种可能是公司老板认为必须要有价值观，所以也不管自己生产的产品是不是和价值观相吻合，就指定了一个，结果只能贴在墙上，什么作用也起不了。


    另一种可能是老板先有了某种价值观，本来也想制造和价值观相吻合的产品，但是随着业务推进，被市场逼得或引导得做成了一个别的东西（例如，本来想做一个便利大家获取信息的网站，结果做成了一家游戏公司）。


    如果你想创立一家公司，最好先问问自己的初心是什么，根据价值观和理想去创造公司，会做得更好一些。


    如果只是想赚一点钱，那么理想和价值观，不提也没有问题，并不是一定要有。


    如果想做成伟大的事业，或者赚大钱，那就一定要好的价值观，并且业绩一定要和价值观做配套起来。这个价值观一定要是具有很大社会价值的，这样才能被社会需要，从而与其配套的产品才能拥有广阔的市场。


    红军对军事上胜利的追求，和理想信念是高度吻合的；阿里对让天下没有难做的生意的追求，是和阿里、淘宝、支付宝等产品高度吻合的。这样的组织，就更容易取得成功，并且做成伟大的事业。


    如果能够做到并确立这样的价值观，就应该长期坚持，不要为短期的 KPI 压力而做出破坏价值观的事情，否则，这个价值观就没有意义的，反而会成为企业发展到羁绊。如果一直冲突，要么就干脆重新思考公司的意义，调整价值观。当你的
    KPI 本身就是来自价值观，完成 KPI 就是体现价值观，你就不会纠结痛苦了，相反，你会感觉到无穷的力量。这样的人生才更有意义，这样的事业才更容易成功。


    # 公众号快速成长的逻辑


    牛人星球有不少朋友是做公众号或者想做公众号的，这篇文章或者能给你一点启发。


    有些朋友，投入了很多精力去写公众号，却发现粉丝量怎么都涨不起来，越来越心灰意冷，要放弃却又不甘心。


    粉丝量不涨的最大原因，是因为不懂公众号快速成长的逻辑。


    在 2013-2017 年的公众号黄金时期，公众号可以靠运营、搞活动、投放广告来涨粉。而现在随着读者越来越警惕、流量越来越贵，这些都行不通了。


    2018 年以来，公众号要快速做大，有且只有一个办法：写出爆款文章。


    近两年，所有从零开始，快速做起来的公众号，全部都是因为一篇或者几篇爆款文章；所有做不起来的公众号，全都是因为没没有爆款文章。


    例如，我 2019 年 3 月和卢克文刚认识的时候，他的粉丝是 8700，那时他做了 3 个月，文章也很好，打开率也很高，但是粉丝数就是没什么起色。


    也就是在那个月，他写出了《文在寅的复仇》，那篇文章的阅读量有几十万，让他的粉丝达到了 40 万，一个号一下子就做起来了。


    后来，他又通过一篇《存量残杀的世界》，做到了 70 万。最后通过千万级阅读的一篇文章，直接做到了 200 万。现在已经是全行业的头部号了。


    另一个朋友粥左罗，本身有 50 万粉丝，从去年开始做“粥左罗的好奇心”这个小号，做了半年也没有什么起色。今年初一篇文章达到千万级的阅读，一下子把粉丝拉到 30
    万，这个号也起来了。


    所以，如果你想让自己的号快速成长，就必须而且只需做一件事：创造爆款文章。


    为了防止误解，这里必须明确两点：


    第一，不是所有爆款文章都能涨粉。例如愚人节发“教育部通知开学”假消息的，阅读量巨大，但是不会涨粉。


    第二，不是所有爆款文章带来的粉丝，都是有效粉丝。例如，蹭明星热点带来的粉丝，很多都会很快取关，即使少数不取关的，也不会阅读和转发你的文章，实际上是僵尸粉。


    能够快速增长有效粉丝的爆款文章，必须满足两个条件：1. 高质量的原创； 2. 与公众号总体定位相符。


    所以，想要快速成长的公众号，唯一能够依靠的、也是唯一需要做的事情， 就是：创造高质量的、与定位相一致的爆款文章。


    你写一堆不痛不痒的文章，不光不会给你涨粉，有时甚至还会掉粉；只有高 质量的、与定位相符的爆款文章，才能带来实质性的涨粉。


    与其在 1 年的时间里，更新 365 篇不痛不痒的文章，不如用这一年的时间， 好好谋划几篇高质量的好文章。


    如果让我给成长期的公众号一个最大的建议，那就是：每一篇文章都要当做 爆款去写。如果你觉得不是爆款，就不要写；如果你写出来后觉得这篇文章不会 火爆，那就不要发。


    防杠声明：我这里说的是如何快速成长。如果你的公众号已经处于成熟期， 或者你不追求快速成长，那你可以忽略上面这一段，采用另外的逻辑。


    # 激励的困境


    做咨询时碰到过这样一个案例：


    A 公司有一个很厉害的高管，老板对他非常器重，给与了不少股权。


    在股权的激励下，高管拼命工作，给公司做出了很大贡献。


    老板也是一代枭雄，公司很快就做上市了，市值达到百亿规模。


    半年后，期权解禁，高管卖掉了自己的股份，然后立马辞职，自己创业去了。


    老板觉得很受伤，觉得我待你你不薄，让你成了亿万富翁，为何你要离我而去。


    尤其是后来公司发展遇到一些困境，所谓国乱思良将，老板每次都觉得那个高管很好用，能力很强，要是他还在就好了。


    而且从这个高管离职之后，老板对新招来的高管都很难信任，在给钱时总是犹犹豫豫，生怕对方拿到的钱一多，就像原来那个高管一样辞职走人。


    这个高管的情况，其实在公司里面很常见。很多能力强的人加入创业公司，都是冲着股权而去。而一旦公司上市，他们的股权能够兑现，就立马走入自己创业，或者跳槽到别的创业该公司，或者改行做投资人，甚至还可能直接退休。


    所以公司对高管的激励，其实也是一条很惊险的平衡线，给得少了，留不住人；给得多了，对方已经成为富人，就失去奋斗的激情，或者就想着自己创业了。


    怎样给得不多不少，很考验老板的智慧。


    所以很多公司都会对期权有很严格的锁定期或者苛刻的退出条件。例如有些公司规定上市后三年内离职就不得套现，或者套现额度要打折。但是这也是一个两难，如果条件太苛刻，入职时期权的吸引力就会下降。


    更好的激励是通过公司未来更好的发展态势，以及内部的文化和价值观来吸引人。


    有些创业公司，大家的梦想就是被收购或者上市，并不是想做成一家伟大的企业。这样的话，所有的心劲都用在上市上面，业务的安排、财务的处理等等，都是为了给上市做出好看的报表，而实际上透支了未来发展的潜力。这样的公司，就难免高管会赶快套现走人。


    还有的公司，是通过“内部集资”、“跟投”等方式，把高管的钱给管起来，让他名义上虽然有很多钱，但手头可以随时动用的却不多，一旦离职的话，集资或跟投的钱要打折，所以就会被吊在这里，想走又不甘心。这种会有一定效果，但是如果公司的发展不幸，跟投的项目没有前途，或者文化价值观扭曲，那会很容易造成高管心里的不满，甚至反目成仇。


    如果一家创业公司，梦想很伟大，那么上市只不过是水到渠成，也只是公司爆发式发展的第一步而已，高管拥有的股权，价值在未来可能还可以成倍增长，那他为什么要走呢？


    还有的公司的是文化非常好，高管在这里待得心情舒畅，或者能够自己的梦想，这种也不会走人。


    所以说到底，钱能解决一部分激励的问题，但在某些情况下也可能起反作用。最好的激励还是要靠公司未来的发展前景和公司内部文化来解决。


    顺便说一下，那位离职的高管，后来创业失败了，原来在 A 公司赚的钱全都赔光不说，还欠了一屁股债，逃到境外去了。好像说现在还在加拿大待着，不敢回国。

