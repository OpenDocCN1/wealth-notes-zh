    ## 哪怕就是觉得人生无常

    哪怕就是觉得人生无常，想要遁入空门的人，也要有佛家的勇猛精进精神，要能够勤修戒定慧，熄灭贪嗔痴，上报四重恩，下济三途苦，要有成佛的气概，要朝着“天上地下，唯我独尊”前进。


    其实我觉得以前的革命者，是青年气概特别足的人。你看哪怕是自已马上就要被抓了，也要说此去泉台招旧部，旌旗十万斩阎罗；或者即使被抓被杀了，还要说杀了我一个，还有后来人。


    实际上革命气概某种意义上就是我们所希望的青年气象，当然你革命的对象可以是自已选定的，未必是三座大山、阶级斗争等等，也可以是自已致力于想要改变的一切东西。


    我特别喜欢的一句话，这里和大家共勉：


    革命人，永远是年轻。


    ## 时光的流逝

    我们测量时光的流逝，一般有三种方式。


    第 1 种是直接看日历，2020 年比 2000 年过去了 20 年，这个是客观尺度。


    但在实际生活中，尽管我们知道这是最准确的方式，但我们日常的感受却并不是这样，因为我们有其他的衡量方式。


    第 2 种是根据人和事物的变化来衡量。例如你的老同学有一个孩子，你上一次见面的时候，她还抱在襁褓之中，这一次见面的时候你发现她都已上高中了。


    这时你就会惊叹，时间过得如此之快！因为你的印象里，这个孩子明明才刚出生不久，怎么突然就变成了一个 18 岁的小伙子了？时间都去哪儿了？


    我们看到其他人的时候，特别容易产生这种时间过得太快的感觉。例如看到自己的父母头发白了，一算年龄，他们竟然都已经六七十了。看到自己邻居的小孩，明明自己都是看到他出生的，结果他现在自己当爸爸了。


    每当看到这样的事情的时候，我们就会觉得时间过得太快了。


    这是因为在日常生活中，人是无法感知时间的流逝的，所以我们往往会倾向于认为过去的某个时间才没过多久。例如我经常觉得我高中时发生的一些事，就是不久前的事，但实际一算，居然已经是
    20 多年前的事了。这时就会感叹时间过得真快呀。


    但有时候，我们也会有种时间过得太慢的感觉。这种测量方式往往是依据你经历的事情而定的。


    如果在一段给定的时间里，你经历了非常非常多发生的事情，你的生活发生了天翻地覆的变化，这时你就会觉得这段应该很长很长。


    而如果在另一段给定的时间里，你没有经历任何值得铭记的事情，你的生活也没有发生任何值得记述的变化，你会觉得这段时间几乎一转眼间就过去了。


    这可能是因为我们用事情或者生活状态的变化，作为一个时间段的是否开始和结束的方式。所以如果在某个时间内经历的事情越多，发生的变动越多，在我们脑海里可能会认为时间的流逝更多。


    我总是觉得，我从政府机关出来已经是很久很久之前的事了，在我的印象里，起码是 10 年以前。但是有时候一算会发现，原来才刚刚过了三年时间。


    但为什么我会觉得时间过去了那么久呢？主要原因是这三年发生的事情很多，发生的变化很大。


    我的老同学老同事也会觉得我好像出来已经很多很多年了，当我说起才三年的时候，大家都觉得非常惊讶。因为在每个人的印象中，这三年在我身上发生了很多的事情，产生了很大的变化，所以他们自然就会认为已经过去了很多年。


    所以我想，如果我们每一个人时时刻刻都在飞速地成长，今年的你和去年的你都简直不是同一个人的时候，我们对生命的感知会不会更丰富多彩？我们实际上所经历的时光，比客观流逝的时长，会不会更长久？


    例如我的经历，过往的三年，从客观尺度上是我 和所有人共同经过了三年，但是在生命的尺度上，我是不是经历了比别人更多的时光，体验了比别人更丰富的生命呢？


    也许这也是一种错觉，但我很享受这种我好像比别人多活了一段生命的感觉。也希望大家在星球都能享受这样的时光。


    ## 问答合集


    ### 提问 1

    何老师你好，当今社会许多中年群体 50 岁上下在家无业或者务农，也想再就业对社会产生价值，比如做一些淘宝拼多多之类的电商，却由于对电脑手机的操作认知不够，就算有人教导也很难执行，反而会花费大量的教导时间，请问对于文化程度不高的中年群体再就业有什么看法？


    答：

    50 岁上下、文化程度不高的无业中年人，不管是在农村还是城市，如果作为单个的个体，想做淘宝或拼多多这种电商的话，还是非常难的。除非有强烈的兴趣、以及稳定而优质的货源。


    现在农村做这个的基本上都是有人去组织的，或者是某些很厉害的、有文化的年轻人，或者是当地的地方政府、或者是拼多多这样的公司主动派人去和优质养殖户接洽。


    如果他本人有强烈兴趣，也能找到稳定而优质的货源，那么报个电商班学习一下，或者年轻人用心教一教还是可以的。如果他本身兴趣也不是很强烈，也没有稳定而优质的货源，不建议走这条路。


    其他的就业方向可以从两个方面考虑。


    第一个是对于能踏实干活的人，现在城市大量需要体力活的人，如环卫、绿化、小区物业、家政等，一个月赚两三千块钱还是可以的，如果还能做重体力活，例如建筑小工等，赚五六千也不是问题。或者不给人工打，自己做小生意或者养猪、养鸡鸭鱼、种经济植物，都能赚钱。


    第二个是对于不愿意干体力活，但是心思又比较活泼的人。可以尝试一下拍快手、抖音这种视频，只要拍出特色的话，有可能能够积攒一些粉丝，赚到一些广告费。现在欣赏农村土味视频的群体人数也很多，但是做这种业务，成功的几率就比较小。所以要把期望调低。总体而言，现在是体力工人极度缺乏的时候，以后会越来越缺乏。只要能吃苦，愿意干体力活的人，一定有工作机会。不存在找不到工作的情况。


    ### 提问 2

    浙江金华人士，乐观向上，爱好超级广泛，本科，材料专业，90 后，毕业后工作经历如下：


    - 2016/5 工贸一体外贸业务员因情感纠纷离职

    - 2017/5 纯外贸公司外贸业务员 因工作产生感情跟女友一起离职

    - 2018/1 与女友一起注册及经营外贸公司

    - 2020 因家庭以及双方矛盾和平分手后，公司由我继续经营


    三次工作经历给我的经验，工作和感情最好分开。分手之后各种负面情绪消化的差不多了，却在工作上产生了迷茫，我能思想到的自己在工作方面的有三个选择。


    （1）个人独自经营。

    做好生活和工作规划，不断地学习提升自己，有长期单兵作战独立成长的打算。问题在于我要如何学会与自己独处，不断地消化负面情绪，如何在规律的生活中展开有效社交。


    （2）组织自己的团队。

    招募兼职或者刚毕业的同学，对于招人我完全没有管理培训经验，只能硬上，如果有一个合伙人在这方面比较突出最好，但是可遇不可求。


    （3）重新进入职场。

    外贸业务员/内销/采购/自媒体，这是我想到的三个能做的职业，门槛极低，我的自信都是在签两份工作的时候得到认可而产生的，重新进入职场会让我热血沸腾。现在的问题是如果只是为了避免现在的空虚焦虑时期去找一份工作未免过于草率，还没有想好到底要做什么。所以如果重新进入职场，我应该如何去规划寻找自己的下一份工作。


    何老师，我想请教的是你看完这简单的自述，对我有什么建议？


    答：

    你好。谢谢你分享过去那些经历，感谢对加盐和星友们的信任。

    我们在解决感情、生活、事业这样的重大问题吋，经常要思考一个点：能不能找到现在困扰我的根源：有没有可能把根本性的问题解决掉？如果找不到困扰的根源，不把根本性的问题解决掉，那它下次还会来找你。

    具体到你这里，其实是包括两个问题：


    一是感情与工作的纠缠问题；二是事业抉择问题。


    关于第一个问题，其实没有一个固定的答案。有的人把感情和事业掺杂在一起，结果感情和事业都被破坏了。李国庆不就是最好的例子吗？有的人小两口共同创业，感情和事业都得到了加强，幸福指数很高。所以这个要因人而异。


    从你的情况看，既然两次都是因感情问题而影响到事业，那么以后就在这块更加慎重为好。如果发现新的感情，最好就先不要把感情和工作混在一起。


    但是，如果从根本性问题来讲，你就要分析：为什么你总是容易把感情和工作混到一起？为什么每次都会因感情的纠纷而影响事业？背后有没有深层次的原因？会不会和你性格、习惯里的某些东西有关？


    如果能找到一个共同的根本原因，那么以后就更容易避免再犯同样的错误了。


    关于第二个问题，要根据你公司经营情况来看。


    如果现在经营情况还不错，那就继续做下去，发展好，自然要组织自己的团队，没有管理培训经验不要紧，管得多了就有经验了，另外也有很多这方面的书籍、课程可以学。如果发展不好，那么你想组织团队也没有实力。所以关键是业务发展得怎么样。


    至于继续开公司还是就业，同样是要根据公司发展情况来看。做得好自然就不需要去找工作；做不下去了，先找个工作干一下也行。


    找工作的话，不能只考虑门槛低。就像你说的，要考虑好自己到底想要什么。建议你看一看我写的《迷茫时的三个选择》那篇文章，按照其中的方法去思考自己的喜欢什么、擅长什么，这才是解决最根本问题的方式。


    总结起来，不管是感情还是事业，你需要分析自己面临的根本问题，并找到根本的解决办法。别人只能教给你思路，找到钥匙只能靠你自己。


    ### 提问 3

    何老师好，我看了你公号所有文章，太棒了！


    有一个问题请教：你的思考深度为什么这么深？谢谢


    答:

    谢谢 XX。


    首先还是要说明一下，其实我的思考深度并不是很深，比我深的人还多的是。只是可能很多事情大家没有从某个角度去看，然后我把它说出来，大家会觉得比较新颖很深刻吧。


    第二，如果说我的思考有一点特色的话，那应该是来源于四个方面：一是大量的阅读，二是大量的思考，三是把阅读和思考的心得表达出来，四是从和别人的交流中获得不同的视角和更丰富的信息。我相信如果一个人能做到这四点，他肯定也会被别人看成是思考很深刻的人。


    第三，其实人的成功不在于看问题有多深入，而在于做事情要符合常识和规律。例如巴菲特和段永平，他们看问题的角度和说出来的原则，其实都是无上的浅显，浅显到任何人都可以很轻易地看懂，任何人都可以很轻易地实行。但是为什么很多人不愿相信也不愿意去施行呢？可能就是觉得太简单了，而且大家并没有耐心等待一个好结果，在很久很久之后才出现。


    希望对你有启发。


    ### 提问 4

    何老师您好，我是一名大一学生，高考后家长为了让我好找工作，让我报了公费师范生，上了大学后，开始关注您的微信公众号，看了很多牛人的故事后，我很激动，我也想和他们一样做出一番事业，我想到大城市去，我不想一辈子就在县城当一个老师！，于是我想到了考研，并且想学高科技的专业，这样才有竞争力。父母也支持我的想法，但他们建议我先回来工作两年再去考研，这样比较稳。但是未来考研形式越来越严峻，非应届生的优势越来越小，我该如何选择呢？以及大学四年我该如何规划呢？


    答：

    我的建议是先考研再工作。原因有两个：


    第一，你本科出来找工作，和研究生出来找工作，可选择的机会是截然不同的。与其普通本科出来找个一般的工作混两年再考研，不如重点大学读个研究生出来再找更好的工作。


    根据我观察大学同学和朋友的经历，同一个班，考研出来的同学找工作篇普遍比本科出来要高一个等级；同一个人，研究生毕业找的工作比本科毕业找的工 作高 n 个等级。考研可以让你的学校提升一个或几个档次，这点在我工作的过程中是非常有用的。


    同时，有很多职位，人家只招硕士以上。我有一个朋友，高考是某市第二名，武汉大学本科毕业，金融行业工作，这已经算够好的了吧？但是工作几年中，她曾经三次有特别心仪的职位，却都因为没有研究生学历而被拒，留下了极大的遗憾。


    第二，工作以后再考研，难度会上升几个档次。 在学校考研，你有最多的学习时间、最好的学习条件、最佳的学习氛围、最小的经济负担，是最适合考研的时候。 而工作以后，你每天工作都已经耗尽了精神，没有食堂、图书馆和自习室，没有共同学习的人、反而领导同事室友朋友家人天天还需要你干这干那，你还要天天操心房租吃饭等一堆问题，甚至你你可能已经要面临找对象结婚生子等人生大事。


    如果说在学校条件那么好的时候你都考不上，难道你还指望工作后那么艰难的条件下能考上吗？


    你现在才大一，有的是充足的时间来准备。我的建议是，前两年不用想太多考研的事儿，把功课的绩点弄好一点，四六级考试，多参加校园各种活动，享受一下校园生活。同时多看书，多上网了解各行各业，有条件的找些实习，想想自己喜欢什么、擅长什么。


    到了大三，就要全力以赴地去学习了。尽量报好一点的学校，我的建议是不要低于全国综合排名前十，或者专业领域的前五。


    你才大一，现在好好享受大学生活吧。等你快大三的时候，如果还想考研，可以再来问问关于如何安排考研复习的问题。我当年考研的成绩是 409 分，有些经验也许对你有用。


    ### 提问 5

    何老师您好。我个人本身也是做咨询出身的（风控内控方向的咨询），已经做了有 5 年左右。因为已经厌倦长期出差的生活，最近半年我一直在转甲方企业、以及考研读研提升自己之间摇摆不定。


    如果是去考研的话，相对于在职读，我内心其实更倾向于读全日制，停下来充电提升自己。


    但是我今年年龄已经 29 岁，如果读全日制再加上备考时间，至少得 3 年左右，那读完出来已经 32、33 左右，这年龄出来的竞争优势，会比不去折腾继续在工作岗位上深耕会强么？有什么优势跟劣势呢？而且作为一个女性，可能在职场上面临的偏见会比男性会更多。有点迷惑，想听听何老师指点。


    答：

    这个问题其实要看你内心深处恐惧或者厌恶的根源是什么？


    如果仅仅是厌恶长期出差，那么找一个甲方的工作就可以解决，或者转岗到公司内部出差不多的岗位，例如研究岗（如果有的话），或者可以换到一家不用驻场的咨询公司。有
    5 年工咨询工作经验打底，不管是换到甲方，还是到另一家咨询公司去，都还是比较容易的。


    但是我怕的是：可能你恐惧或厌恶的根本问题并不是这个。如果不把它找出来，解决掉，那么你就算是转到甲方、或者到别的公司、或者考研，都没有用，这个问题也还是会跳出来继续烦你。


    我的咨询公司原来有一位同事，就是因为觉得不想做咨询，一心想想去甲方，但没想到去了甲方以后，工作更辛苦、关系更复杂、自主学习和提升的机会更少，让他很快就厌倦，觉得还是做咨询好。


    所以你还是要拷问一下你的内心：你最喜欢的是什么？最恐惧或厌恶的是什么？最擅长的是什么？


    如果是考研的话，你心里要知道，考研不能是因为逃避现在的生活而去考，而是为了追求人生的梦想去考。所以选择学校和专业，也都要结合上面的问题。如果暂时想不清楚，同时财力上又能支撑的话，那么尽量选择名校的、好就业的专业，不要选择那种就业困难或者去向太窄的专业（除非是你非常喜欢）。


    ### 提问 6

    何老师您好 身在三四线城市，有份旱涝保收的工作，清闲。


    年近 30，房车不缺，无生活压力。年少时贪玩，只上了个普本。毕业就回家工作了。


    身边充斥着蝇营狗苟，找不到能聊得来的同伴。时常怀疑自己是有问题的人。突然觉得生活失去了方向，空虚，觉得自己的人生可以一眼望得到头。现在的生活毫无激情，一潭死水，类似养老。


    开始觉醒，觉得过去错过了太多可以学习和改变的机会。


    未婚。


    想跟您请教下，对于自己目前的这种状态，该做些什么才能让生活发生些良性的改变呢？


    答：

    二十八九岁还年轻得很呢。


    据我所知，很多非常厉害的人，都是比这个年纪大很多，才开始从事一生中最重要的事情的。


    刘邦到 40 多岁，都还只是一个混子，人生最大成就是当过泗水亭长（大概相当于一个小村子的村长）。48 岁才响应陈吴，在沛县起兵，54 岁才当了皇帝。刘备混到
    40 多岁还没有自己的事业。46 岁那年还冒着大雪去拜访诸葛亮，53 岁才拿下四川，拥有了自己的立足之地。


    教员 34 岁才开始秋收起义、马云 35 岁才成立阿里巴巴、任正非 43 岁才成立华为…… 所以真正想做事业，什么时候开始都不晚。关键是先清楚，自己未来到底想成为什么样的人？想做什么样的事？


    如果已经开始觉醒，但是不知道干什么的话，可以看看我以前写的《迷茫时的三个选择》这篇文章，基本上你要问的问题，里面我都写过了。请注意，这篇文章文末的注解也很重要，不要漏过了。


    ### 提问 7

    何老师觉得对于一个男人来说。 最黄金最好的年龄段是什么范围？


    答：

    这个问题看哪个方面吧。从记忆力或身体机能来讲，肯定是年轻的时候更黄金。从干事创业来讲，我觉得只要你想干，任何时候都是黄金时期。 当你问出这个问题时，我的理解是你可能觉得自己已经不再年轻，错过了这个时候。但其实，做一件梦想的事情，最好的黄金时期就是现在。


    ### 提问 8

    您好，何老师：男 由于原生家庭关系，父母给自己造成了很多阴影，对婚姻态度十分消极，难以建立长期稳定的亲密关系。想问问选择不婚可行吗？


    男, 从小考不到第一、满分就被家长侮辱, 潜意识里的对人对己的完美主义, 总觉得自己不够好，那种挥之不去的自我否定，自卑感，该怎么消解呢？


    答：

    原生家庭确实对人的性格和命运有很大的影响，但是作为当事人，成年后，认识到这个问题，就应该想办法去克服这个问题。如果说早年 在原生家庭遭遇过阴影是属于命运的不幸，那么成年以后还被囚于这个阴影，把一切归咎于这个阴影而不思将其解决，那就是自己的懒惰和逃避。


    你可以多看一看关于心理学的书，看能不能自己找到问题所在，然后解决掉。看的书最好是积极型的，例如阿德勒系列及后人对他的理论的解读。推荐两本：《自卑与超越》、《被讨厌的勇气》。


    不婚当然也是一种可行的选择。但如果其原因是为了屈从原生家庭对自己造成的不良影响，那就太可悲了。我个人认为，你选择一种生活方式，原因应该是积极向上的，而不是消极逃避的。你可以先梳理清楚婚与不婚都有哪些好处和坏处，多观察结婚的人和不婚的人，和他们交流，听听他们的幸福与痛苦，再作决定。


    我一贯不认同那种认为“原生家庭会框死一个人的个性”的说法，那只是有些人为了逃避自己对于命运的责任的借口。同样在童年经历过痛苦的人，有些人背负着枷锁悲惨地过一生，另一些人却能奋起改变自己，成为乐观勇敢、积极向上的人。


    人是可以主动塑造自己的性格，主动改变自己的命运的。


    最后一段所说的“总觉得自己不够好”、“自我否定”，心理学上叫做“冒牌者综合征”。我专门写过一篇文章，你可以看一看。《女神学藕艾玛·沃特森：我好害怕被人发现，我其实是个冒牌者》


    ### 提问 9

    最近有一个事情，我被困扰好久了，想请教一下：我现在在基层公务员队伍里，借调到了市里，本来如果有机会留下来是最好的。但市里单位领导无心带团队，无心思考业务，导致单位有被边缘化倾向。且处里重要核心的工作也是依靠一两个人，我根本分不到重要工作，也不被重视。这种情况，我应该怎么办呢？回基层考选调？但基层官僚主义严重，待着也不开心，也怕考不上选调。还是继续待着，走一步看一步？


    答：

    如果市里的单位本来就有边缘化倾向，且你又不能进入核心，那这个机会就不是你的机会。即使去了，也是混日子，过个一两年你就会想逃离的。


    如果在基层待着也不开心，那就努力去考选调，准备工作做充分一点。


    不过，你也要有心理准备，如果觉得基层官僚主义严重，就想逃离，那你应该想一想，难道别的地方就不严重了吗？市里你也待过，有没有感觉好一点？有没有可能，你到别的地方，也还是会面临同样的问题？


    所以，我更建议你慎重考虑自己到底想要什么，害怕什么，然后想一想要怎样才能解决根本上的问题。如果不从根上解决的话，不管你现在怎么选择，过两年你依然会焦虑。


    也许，你的思路应该更开阔一点，不要老是放在体制内打转。有没有可能跳出体制换一个单位？有没有可能再去读个学位？有没有可能自己创业或者做生意？有没有可能学一门新的技能，以后改行做程序员、会计、金融分析师、律师等其他行业？人生的道路千万条，不要只局限在一小片天空。


    ### 提问 10

    何老师，公务员背景离开体制后，职业发展中的优势和瓶颈能分析一下吗？如何合理给自己定位和做计划呢。想请你结合自己的成长历程和学习进化中遇到的机遇和挫折给一些意见和建议。


    答：

    这个问题，最好是在离开之前就考虑清楚。如果等出来了再想，就有点晚了。我自己出来之前，是已经想好了要做咨询，并且已经有了合作伙伴，也有了业务来源，所以经济收入上有一个保底，转型还是比较顺利的。

    '
