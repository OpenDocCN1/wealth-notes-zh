    面一条是：你收多少钱在这里黑他？下面一条接着就是：他给了你多少钱让他捧他？


    作为自媒体作者，这样是不讨巧的。职业化的做法，是不要客观，只要立场。你选择好一个立场，不管是黑还是捧，都更能吸引你的目标读者，更容易搞 10 万加。更厉害的做法，是做两个号，左右互搏，同时收割两边的粉丝。像我这样同时得罪两边粉丝的，只能称之为傻。


    但没办法，我就是这样子。企业家做得好的地方，我会去夸；做得不好的地方，我会去批评。而且在夸和批评的时候，我不惮于用较为浓烈的情感去做。所以我批评一家公司会比较狠，但是表扬同一家公司也会比较狠。


    世界是这样复杂，世人也是这样复杂。那我们应该怎么应对这种复杂，以及因为这种现象的复杂而带来的情绪的复杂呢？


    首先，如果你要做事，就不要怕负面的声音。要知道，不管你做得多好，总会有人在旁边风言风语，不如就当他们都在放屁。


    第二，如果你是一个写作者，就按照自己的心去写，不要管别人怎么说。当你的文章开始有一点影响力的时候，你会发现，无论你写什么，无论你怎么写，总会有杠精在下面喷粪。对这种就直接无视就行了。


    第三，如果你是一个读者，我建议你放平心态，包容一点，最好是同时了解一下两方面的信息。如果你只是坚信自己这一面的立场，而去否认另一面的存在，那么你的人生成就一定不会高。


    总而言之，最好的应对办法，莫过于岳麓书院那副对联所启示的：是非审之于己，毁誉听之于人，得失安之于数。


    与诸君共勉。'
