    ## 感谢小病


    这两天左手手腕有点疼，所以我现在是处于神雕大侠的状态，只能单手打字。本想给自己再放放假休养一下，但是想星友们可能也等待何加盐的文章等了好几天了，还是忍痛咬牙写一篇吧。


    我想每个人都会承认健康是最重要的，但是当你的身体真正健康的时候，这句话往往只是停留在嘴上，只有当身体某一个地方出现了问题，你才会真真切切地感知到健康究竟有多么重要。


    去年整整一年，我真的是特别感激这一具身体，它没有出现任何问题，让我能够顺利地度过这一年。有时候想，哪一次要是发个烧，那进办公楼都进不了，出去旅游、出差更是不用想了。


    去年自从疫情缓解以来，我们还是按照以前的节奏经常出去旅游，包括到西北旅游了整整8天，然后出差也保持了较高的频率，看了一下航旅纵横的记录，我的飞行里程超过了全国98%的人。而这些没有一个好的身体，根本想都不敢想。还记得西北旅游的倒数第2天，孩子突然有点发烧，我们都非常紧张的，生怕是新冠肺炎，又怕上飞机上不上了，原来定好的行程全部要作废，而大人们即将开始的工作也都没有办法正常进行。好在第2天又不烧了，虚惊一场。


    这一次的手腕疼痛，虽然只是很小很小的毛病，但是也引起了生活的诸多不便。凡是需要两手配合的事情都变得无比艰难——而你根本想不到生活中居然那么多事情都是需要两手配合的，例如拉拉链、尿尿、倒水。基本上半个人都废了。


    更恐怖的是到医院看的时候，医生高度怀疑是痛风。我查了一下痛风的防治，基本上饮食上的乐趣绝大部分都完蛋了，例如所有的海鲜、螃蟹、肉汤、豆制品，都不能吃。更惨的是还要戒酒，尤其啤酒更是不能沾。我甚至悲观地想，那样人生还有什么乐趣呢？还好，下午化验结果出来，不是痛风。


    身体上出毛病，除了给身体带来的极度不适和生活的极度不便之外，更糟的是给精神带来的打击。其实我本身还算是很乐观坚强的人，但是当手痛得厉害，这也不能做、那也不能做的时候，还是会产生很烦躁沮丧的心情。这种心情也容易传导到家里，当我不停唉声叹气的时候，家人的情绪也都好不了。


    但是又想，万一哪一天，身体真的出现了某一些不可逆转的变化，个人和家庭也都只能接受那样的一种状况。这是人生无可逃避的一环，所以真到那个时候也只能无奈接受、乐观面对了。


    我想，也许每年得个一两次小病，也未尝不是一种好事，它至少会提醒你注意身体。如果长期处于健康状态，你很容易就忽视了身体还会出毛病这件事，可能就在饮食上不注意，在心态上无所谓，在锻炼上不在乎。一年生个一两次小毛病，可以你充分的体会到身体的重要性，在饮食上，心态上、锻炼上注意起来。


    人生不会永远一帆风顺，最重要的是享受当下，预防未来，真正碰到事情的时候，乐观坚强面对。


    所以，我很感谢这次开年就得的这一场小病。它也许会预示着这一年我可能要经历一些磨难，但是也提醒我做好准备。


    我已经准备好了。


    ### 人生幸福有时候取决于角度


    在微博上看到一个很热的帖子，说一个妈妈本来是天天逼着孩子学钢琴的，有天突然改变主意，不逼了，因为她看到一个外卖小哥在等餐的时候弹钢琴，突然觉得，孩子就算学好了钢琴，又有什么用呢？还不是一个会弹钢琴的韭菜吗？


    不知道你看完这个，会有什么样的感觉？你觉得一个外卖员弹钢琴，表示这个外卖员学了钢琴，对他的生活没有起到任何作用吗？


    微博大V@东东枪评论道：我的感受恰恰相反。不是“学琴也还是送外卖”，而是，学了琴，哪怕在送外卖，也是发着光的。


    我非常喜欢东东枪的这个评论，因为他提供了一种看问题的不同角度，而且是让人眼前一亮的角度。


    在孩子小的时候，很多家长都会逼着孩子学这个学那个，但是很多家长没有想明白，让孩子学的目的是什么？


    有些家长总会觉得孩子学了这个会对以后提高生活水平、多赚钱有帮助。但我觉得如果是这样想的话，就偏了。因为学这些东西很大概率并不能提高生活水平、多赚钱，只有极少数的人会走上这样的职业道路。绝大多数人只不过是成长为一个会一点琴棋书画的打工仔。


    那么学这些东西就没有任何意义了吗？


    我认为不是的。学任何艺术，它的作用是对于个人灵魂的熏陶，而不是对赚钱能力的提升。当你能从艺术中寻找乐趣，这个学的就非常有帮助了。


    就好比弹吉他，感觉到非常开心，虽然它不会帮我赚一分钱，但是我就是喜欢弹，乐此不疲地弹。这就是因为爱好。


    所以家长在决定让不让小孩学某一个东西的时候，可能首先心态就要放平：学这些不是为了增加一个职业技能，而是增加一个娱乐技能，或者说增加一种陶冶情操的方式。


    如果是从这个角度来看的话，就不存在要去逼小孩学一个东西，而是会选择孩子喜爱的一种东西。如果孩子对某一个东西产生强烈的兴趣，而这个东西又不会对性格、生活造成负面影响的话，那不妨让他大胆的去学。如果孩子对一个东西没有任何兴趣，而这个东西又只是娱乐和陶冶情操作用的话，那根本就没有必要逼着他去学。


    很多人分不清生活必需技能和生活加成技能。生活必需技能是需要逼着孩子去学的，不能说任由他兴趣。当然方式可以引导，例如数学可以激发孩子兴趣，而不是死读书死做题。但本质上这不是一个可选项，而是一个必修项，就必须得认真学好。


    而音乐、艺术等则是可选项，不会这些东西，对未来的生活质量没有任何影响，但是会了这些东西会让未来生活变得更加丰富多彩。说到底它们是锦上添花的事情。


    最后我想说一下，很多事情其实就是一个角度的问题。例如有一个教徒问牧师：请问我祈祷的时候可以抽烟吗？牧师厌恶地回答：当然不行，这是对上帝亵渎。另一个人问牧师，请问我抽烟的时候可以祈祷吗？牧师高兴地回答：当然可以，你随时不忘上帝，真是上帝的好子民。


    还有一个段子是这样说的：一位大学生去当三陪女，我们会觉得无比的惋惜；但是如果说一位三陪女去上大学，我们又会觉得很励志。


    所以回到文章最开头的例子，如果你看到的是一个人虽然钢琴弹得很好，不还是在送外卖吗？你会觉得学钢琴没有任何意义。但是如果你看到的是，一个人虽然在辛苦地送外卖，但是他的生活中还有钢琴，这是多么美好的一件事啊。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_222_0.png)


    ### 真相的尴尬与尴尬的真相


    在写作过程中，我有几次遇到这样的情况：所写的公司公关部门找上门来，说我写的地方有误，要求删文道歉；但是我往往让他们指出哪个地方有误的时候，他们却指不出来；或者他们提出哪个地方有误，我很快找出当时报道或者采访的记录给对方看，对方就哑口无言了。


    还有另外两种情况：第一种是我写完之后，对方公司内部的人看了，说写的很浅，没有什么新的东西。写腾讯和吴晓波都出现这个情况。第二种是说一些东西跟当时发生的情况不符，但我就他提出不符的地方指出报道或电视采访的原始记录，他们却会说，哦，那是当时采访的记者有自我的发挥。黄峥多年的创业合伙人就和我说，网上关于黄峥的很多报道都是错的。但实际上，他提出的几个，都是我从黄峥公众号上看来的。


    对于一个挖掘和记录历史的写作者来说，这其实挺尴尬的。因为对于很多事情往往是有不同的记述，后来者翻看以前的资料很难说清楚，哪一个真哪一个假。


    举个例子，希望集团的刘家四兄弟创业，有的地方说是创业启动金凑了1000块，但有的地方说是1500，有的地方说是一分钱贷款都没有借到，但是有的地方说是贷款了1500元。注意，这些不是记者说的，而是在采访中他们四兄弟自己说的，亲兄弟、亲历者的说法都不一样。那我们怎么才能知道这个真相呢？我只能查找当时的文字记录，看到最初刘永美的一份离职申请上说的是他们兄弟凑了1500块钱又贷款了1500块钱。但是如果这样写的话，刘永行和刘永好看，有可能会觉得我是胡编乱造的，因为他们记忆中，也许就是没有贷到款，就是凑了一千块钱。


    又如关于苏宁创业的早期，其实是张近东的哥哥张桂平先创造的苏宁，张近东是被哥哥带出来的，早期两兄弟一起把苏宁做大，但是后来所有关于苏宁的叙述中，基本上都是张近东的一面之词，把哥哥的所有东西全都抹掉了。所以今天的人们看当初的叙述，只有张近东创造了苏宁，没有了张桂平的影子。而我看到的早期的电视采访记录，张桂平说的很明确，苏宁是他先创造的。苏宁这个名字也有两种说法，张桂平说是取江苏和南京各一个名字，而张近东的说法是说江苏路和宁海路交界，所以叫苏宁。我们很难知道张桂平和张近东哪个人说的是真的，我只能根据最早的记录找出真相，但是苏宁的一些人听惯了张近东创业的故事，肯定认为这是胡编乱造。


    所以在写作中，甄别资料时就会产生很多这样的尴尬，而作为一个写作者，只能说尽量多方印证，寻找最初的、最权威的资料。但即便如此，仍然会出现很多的细节有可能存在偏差。例如吴晓波的书中有过很多地方，写到很多企业家就是采用了某一个媒体的记录，但很可能其他媒体的记录又不一样。我已经发现多处这样的情形。例如他在《激荡30年》里提到，马明哲是袁庚早年的司机，但马明哲本人在袁庚去世时写的一封公开信中却明确否认了这种传言，这其实非常尴尬。


    我认为，出现这样的情况，可能有几种原因。


    - 第一，是当事人自己在不同时期可能有不同的说法，甚至有可能忘记原先说过的话。人们会为了美化自己而创造历史，或者因为忘却而编造新的历史。

    - 第二，是不同人、不同视角和记忆产生的紊乱。这个在多人创业的故事里特别明显。苏宁二张、新东方三驾马车、刘氏四兄弟的很多讲述，是相互矛盾的。

    - 第三，是记录者，在记录的时候夹带了自己的一些发挥或者是不同的理解。

    - 第四，是以讹传讹。


    其实这种尴尬，不单我和吴晓波存在，甚至一些世界著名的超级大牛都会存在。


    例如布罗代尔的《文明史》和斯塔夫里阿诺斯的《全球通史》，这都已经是享誉世界多年的最权威的著作了。但是当你看到他们描写的中国历史的时候，会觉得这是啥呀，写得一团糟嘛。这是因为我们本来就身处中国，对中国历史太熟悉，我们接触的各种资料太多，而布罗代尔和斯塔夫里阿诺斯很多也都是二手资料，而且是经过重重筛选后的二手资料，所以他们的写作和我们的认知，就出现了很大的偏差。日本人对大名鼎鼎的《菊与刀》，也有类似的感觉。


    当然，真正的中国通或汉学家对中国的理解会更深人更准确，例如费正清和基辛格，描写的就相对贴合现实一点。


    俗话说，历史是任人打扮的小姑娘。这话在很多时候，真的没有错。


    ### 一种生活及其变迁


    一位定居新西兰已久的朋友最近回国，并决定这次是永久性回来了。


    朋友出生于山东一个小城，有着很好的教育背景。本科和硕士都是国内最顶尖的大学毕业，在投资行业工作，收入非常高；老公也是毕业于985学校，在国内Top公司当IT工程师。虽然帝都居大不易，但是对他们俩来说，买房、买车，孩子上学区房，都是相对轻松的事情。


    大概2014年前后，帝都的雾霾到了无法忍受的时候。朋友觉得这简直不是人待的地方，便和老公说，我们要离开这个鬼地方，到国外去生活，给孩子一个好的成长环境。


    老公其实是不大愿意折腾的人，觉得自己的工作和生活都挺好的，不想动。朋友说：我先出国去闯荡一条路，等都弄好了，你们再过来。


    于是，她自己一个人先联系好了大学，通过了考试，先过去再读了一个硕士，毕业后在当地找了一个工作，买了一栋别墅。


    新西兰的空气确实好。刚开始出去时，朋友觉得自己的决策真是太对了。虽然说要忍受家庭分离之苦，但是她每年回国一个月，老公和孩子每年去新西兰一个月，再加上每晚视频，也还可以过得去。毕业后买了房，更是把孩子接过去上幼儿园，并开始给老公铺路，眼看着马上就要苦尽甘来了。


    但是这时，她和家人渐渐开始发现，新西兰的生活，也许并不适合自己。


    先是事业。


    新西兰整个没什么大企业。据朋友说，5个人的公司就算作中型企业，10个人的公司就算大型企业了。她的背景虽然不错，但是作为一个中国留学生，在新西兰找工作不好找，最后找了一家很小的小公司。干的工作也不是自己多喜欢的。


    在新西兰，生活的节奏非常缓慢。每天到点就下班，没有谁会加班。当地的阶层非常固化，一般家庭的孩子也不想上大学，读到高中就不读了，然后做个修理工、收银员，也照样悠哉游戏地过一辈子。这种日子可以说是惬意，但是对于朋友来说，看着国内日新月异，生机勃勃，自己却似乎在养老，整个人都要废掉了，感觉很不是滋味。


    再是生活。


    每天回到自己的别墅里，也没有什么逛街的地方，没事就是待在家里，要不就是修剪草坪，风景虽然美，但是看惯了也就那么回事，而对国内的美食、便利、热闹的思念，却不可遏制。


    然后是孩子。


    原本朋友从书上和网上看过的文章，得到一个印象：孩子的语言学习能力是非常强的，到外国很快就能适应。但是等自己的孩子真正出国，会发现根本不是那么回事。三四岁的孩子，在幼儿园听不懂老师和小朋友说话，自己有事也不知道怎么和老师表达，所以心情很不好。


    而且新西兰的幼儿园，完全是放养。幼儿园几乎不教什么，老师就是看一下孩子而已。看到国内同龄孩子学这学那，朋友不禁担心，孩子在这样的地方，会不会被我养废了？


    到孩子5岁的时候，朋友必须做一个决断了。因为新西兰是5岁上小学，朋友必须决定是让娃上小学，还是回国再读幼儿园，在北京上学。


    根据孩子的意愿以及对娃未来的期望，综合考虑下来，她还是把女儿送回了国。并且自己每天晚上开着视频辅导孩子做作业。


    由于新西兰比北京早4个小时，所以孩子这边的9点就是她的半夜1点，陪完孩子后再收拾收拾，就两点多了。所以，从孩子回上幼儿园起，她就没有再两点之前睡过觉。


    而国内这边呢，自从帝都大力治霾，空气质量很快好转，雾霾天越来越少，并不是那么难以忍受了。再加上科技和生活日新月月的变化，朋友每次回国，都觉得自己被时代抛弃了。打滴滴、订美团、出门不带钱只要一个手机……这种种便利，让她不禁怀疑自己在国外所生活的地方，是不是还没有进入现代文明时代。


    于是2020年，朋友终于下定了决心，放弃新西兰，回国重新开始。由于疫情的耽误，她直到最近才得以回国。


    新西兰的房子租给了朋友，租金差不多刚刚够cover房贷和税金，也就放在那里不管了，房价升值很快，也算是一个投资。自己拿着新西兰的绿卡，日后回去也方便，而且新西兰不需要“坐移民监”，没有每年要待多长时间的要求。所以去了几年，也不是没有收获。


    只不过，她自己心里，自己对新西兰，只是一个匆匆过客，中国才是自己永久的家。


    她老公很高兴，说“以前每次从机场接你回家，过一个月还得再送你，现在终于不需要再送啦！”


    当然更高兴的是女儿，因为妈妈不再是每晚手机视频里那个遥不可及的影像，而是会每天抱她、亲她、陪她做作业和玩耍的，带着温暖的母亲。


    ### 流量与生意


    很多年以前，我在浙大读研时，曾经去考察义乌的夜市，那一望无际的小摊和拥挤的人流，直接把我惊呆了。


    我心想，这么火爆的生意，这些摊主得赚多少啊！


    但是一交谈之下发现，他们都给业主打工了。原来，这些摊位，都不是摊主自己的，而是向业主租来的。原来生意不好时，租金很便宜。后来生意渐渐好起来，摊主越赚越多，觉得这生意可真棒。但是没想到，第二年，业主的租金就跟着蹿高了一大截。


    第三年，生意更好，租金也就更高。几年下来摊主发现，辛辛苦苦摆摊，最后赚的钱增加得并不多。


    后来互联网起来了。


    早些年，在网上做生意真划算呀，开个淘宝店也没什么成本，那些干得早的，很快就赚到了钱。而且随着钻石越多，甚至皇冠越多，生意就更好做。


    但是也没有风光多久，淘宝店主就发现，网上做生意的人实在太多了，谁能看到你的店啊。


    于是，为了能争抢到好的位置、好的页面，就要向平台付钱买流量。直到后来，流量费用涨得让开店就如同给平台打工一般。


    后来拼多多崛起，同样的故事又上演了一遍。


    微博、公众号、B站和抖音，也是如此。最开始的时候涨粉容易，广告效果也好。商家投一些微博、公众号等广告，很快就赚到了远高于投放数额的钱。


    渐渐地，涨粉、涨阅读越来越难，广告越来越贵，商家发现，投广告的效果越来越小，到最后，赚的钱都不够付广告费的。


    从古至今，从中到外，所有生意都需要流量，流量总是会越来越贵，不论线上还是线下。


    当流量越来越贵时，生意人会这么做：


    - 第一，买不起流量，退场走人。很多好的产品就是这样死掉的。

    - 第二，通过独有的技术、强大的品牌或者深厚的关系，形成一定程度的垄断地位，从而更高效地获取流量，以及增加存量的粘性、复购和单次购买额。谷歌（通过技术）、苹果（通过品牌）、新加坡（通过地理位置形成的在贸易通道上的局部垄断地位）、滴滴（通过做大规模形成一定的垄断）……都是这么做的。

    - 第三，降低成本，确保在流量更贵时，还能有一定的利润。少数企业能够通过技术改进而降低成本，但是流量费用的上升早晚还是会把这部分省出来的成本吞噬掉；更多的企业是通过降低产品质量来降低成本，这就会在市场上形成劣币驱逐良币的效应。百度上搜任何病，某系医院永远排在最前面，因为只有足够黑心的医院才能负担得起越来越贵的流量。同样地，在公众号上，投广告的，除了少数财大气壮不差钱的巨头外，最多的就是保险、化妆品、保健品、白酒、付费课程、理财等。因为只有这些的成本足够低，利润空间足够高，才能支撑得起那么贵的流量。到最后，只有割韭菜最狠的能够留下。

    - 第四，寻找新的便宜流量。这就只能等待新的平台出来，才能赶上一波，享受个几年，甚至几个月。例如互联网刚出来时流量比线下便宜，拼多多刚出来时流量比淘宝便宜，公众号刚出来时流量比微博便宜，抖音刚出来时流量比公众号便宜等。但是，不管是哪个新的平台，一个无可逃避的规律，就是流量总会越来越贵。


    从长远来看，只有不断的品牌升级和技术进步，用内在的魅力吸引新的流量、巩固老的流量，并不断降低成本，才能不被更贵的流量淘汰。


    ### 一种很好的生意模式


    之前和大家介绍过陈厚酒的发展，我一直很欣赏他们的生意模式。这次回老家调研，见到一位神交已久的师兄强哥，也是用这种模式在发展，也做得很好。


    陈厚是用了9个月时间做到2.5亿；强哥是回到老家偏僻乡村隐居，并没有刻意要发展壮大，但是凑20万和朋友一起做点小事，做到现在也几十万了。


    他们采用的共同模式是：选择一种高频消费、价格差距较大的产品，严格控制品质做出高端，并且用人品、情怀和故事获得别人的高度信任，利用自己的熟人圈把产品消化掉。


    陈厚选择的是酱油，强哥先做了茶叶，后来又做了酒，现在新加了酱油。不同的是，陈厚的熟人圈除了自己喝酒，还充当陈厚的代理；强哥的熟人圈现在主要是消费者，还没有做渠道。


    他们的推销方式，就是和自己的朋友吃饭喝酒聊天，顺便讲讲自己的故事和产品，对自己的产品表现出一种迷之自信、神之崇拜。然后朋友就忍不住尝一下，尝完之后就会买，并且买了送人。


    不管是酒还是茶叶，高端消费都有极大市场，而市场痛点就是消费者不知道买到的是不是真的好东西。陈厚和强哥做的，就是用自己的人品，背后的故事，以及现场呈现出来的场景，来为产品背书。对方的疑虑消除以后，会形成对这种产品的忠诚度。自己朋友做的东西，自己用着放心，而且送给别人，也能讲出动听的故事，附加情感和人设价值。


    我研究了一下，这里面有几个关键：


    - 一是选品要合适。必须是高频消费，而市场上品质良莠不齐，人们对高端产品需求极大，但是又很难找到信得过的产品的行业。酒和茶是非常合适的两个。

    - 这类产品的定价，有很多没法解释的东西。一瓶酒既可以卖十块钱，也可以一百块、一千块、一万块钱。而它只要上了一定的档次，价格对于品质的区分度就不大了，主要是品牌在支撑价格。

    - 二是做出来的产品一定要有令人信得过的品质。首先口感、观感、手感等可感知的方面，要做到相对比较，起码要让人感知到确实是好东西。当然，是不是最好，那就见仁见智了，毕竟还有主观体验的影响。

