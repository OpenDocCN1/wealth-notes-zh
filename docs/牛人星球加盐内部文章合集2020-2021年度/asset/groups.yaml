  - '[PAGE 94]


    生活的无奈在于，我们做决定时，无法体验这种真实；而当我们体验到这种真实时，已经无法再做决定。


    《思考快与慢》和《哈佛幸福课》两本书里面都提到，由于我们对未来的想象很多时候都是错误的，凭借这种想象来做决定，可能并不是一个好的决策方式。


    有两个方法可以帮助我们改善决策的质量。


    第一是尽可能全面地了解未来的所有细节。


    当你想起浪漫的沙漠星空时，也应该去了解一下沙子的温度和粗细、帐篷的狭窄、洗浴的不便、穿着湿漉漉的拖鞋从淋浴房走到帐篷的感觉、在温度15°的半夜穿着单薄的睡衣穿过黑暗的沙漠到两百米之外去上厕所的恐怖……如果你能了解到这些，那么，你做决策时就会更加慎重，而一旦决策，真正碰到这些问题时，也不会太过在意。


    第二是多观察和多问有过这样经历的人是怎样的感受。


    如果别人正在经历或者曾经经历这样的事情，那他们对当时是怎样的感受，会比我们的想象要客观得多。参考“过来者”的真实感受，而不是根据我们臆测的感受来做决定，会更加科学。


    以上举的例子只是生活中很小的事情，就算是决策失误，也不会带来什么损失。但是，同样的道理也适用于我们人生的关键决策。


    例如，当你要选择一种职业时，如果你心中只有想象中的浪漫或者赚钱，而不去了解职业中的各种细节，不去看现在做这种职业的人的生活状态和精神状态，那么大概率上，这个决策会把你带到沟里去。'
