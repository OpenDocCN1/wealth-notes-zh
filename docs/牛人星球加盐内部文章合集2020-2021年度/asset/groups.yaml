    # 答：


    你好，谢谢信任。


    从你描述的情况看，做猎头或人力资源，显然不能让你快乐。我建议还是换一个行业更好。


    你认为自己“不够努力”。能认识到自己这一点是难能可贵的。但是有没有探究过不够努力的原因呢？我觉得你之所以不努力，根源还是在于自己没有从工'
