    ## 提问 27


    何老师，请问您是怎么做知识管理的呢？ 比如如何构建自己的体系性知识框架。 怎么分类能囊括呢？


    **答：**


    我的风格倒不是这样系统性的，都是根据自己的需要、兴趣和长远规划来研究和阅读，比较随意。


    一是根据当前的工作或写作的需要。例如，最开始做咨询，我就会把咨询需要的资料尽可能地多看一些，这些资料需要涵盖“方向”、“方法”“动力”三个方面。如在知乎上查看与管理咨询有关的帖子，看《麦肯锡传奇》、《金字塔原理》、《管理的实践》等书，在网上找各种咨询报告和行业研究的资料等。写作的时候，我就会根据写作的主题，重点做一个深入研究。例如写曹德旺，就会把他的传记以及所有相关的新闻报道全部找来（只要能找到的）看一遍。


    二是看自己当时的兴趣是什么。例如突然想学习概率论或微积分，或者量子力学的有关知识，就会去买相关的书，当成休闲书看。有时也会看一些小说，甚至网络小说。


    三是从人生长远来看需要学什么。我一般每年至少都会看一部（或一套）大部头的书。例如某年看完《资治通鉴》、某年看完《毛选》、某年看完《四书集注》、某年看完《易经》（以及相关的解读）等等。这些知识我在学习之初，并没有很系统地去构建体系，但是学得多了，它们之间会自然关联起来，形成一个大的体系。当然，这只是我个人的学习方法，未必适合每一个人。每个人还是要根据自己的性格、习惯和需求，去选择最适合自己的学习方法。


    ## 提问 28


    1、怎么改善优柔寡断的缺点？比如说做了某个决定，做了之后想了想又后悔了，好像做了一个错误的决定，有种后悔的感觉。做某个决定之前，考虑来考虑去，半天下不了决心，就越想越纠结。越纠结越不知道咋决定。就很犹豫的感觉。


    2、工作白天很多乱七八糟的事，各种突然事情电话，就感觉整个人处于浮躁焦虑的状态，没有比较完整的个人时间。这种状态正常么？


    **答：**


    关于 1。优柔寡断确实是一个挺不好的习惯。它不仅让我们错过了很多机会，而且总是处于悔恨和遗憾之中。


    但这个和底层性格有很深的关系，很难说轻易就改变。我只能说提供一些参考性的改善建议吧。


    首先，你要知道自己纠结的最深层原因是什么。是因为目标总是在漂移，还是无法算清楚利害，还是因为没有确定的原则？


    如果是目标总在漂移，一会想要这个，一会想要那个，那肯定就会时时犹豫，时时后悔。还是要先确定一个不可动摇的战略目标，根据战略来做取舍。有利于目标的事情就坚决执行，不利于目标的事情就坚决不做。


    如果是利弊算不清楚，那就拿一张纸，把不同选择的好处和坏处列出来，看你希望得到哪些，又不能接受哪些。可以请教其他人，尤其是你认可或尊敬的人，看他们认为每一种选择各有什么优劣。利弊是可以请教的，因为它和理性有关，有相对统一的标准。


    如果是没有确定的原则，那就无法求教于别人了，只能追问你自己的内心。你究竟最渴望的是什么？最害怕的是什么？如果行事能有一个确定的原则，那么很多事情根本不需要纠结，就根据自己的原则做就行了。例如，我的原则就是诚以待人，那么凡事就根据一个“诚”字来就行了。我的原则就是“利益最大化”，那就看怎样才能利益最大化就行了（只要不违法）。


    关于 2。从横向对比来看，很正常，因为大部分人都是这样过的。


    但是从你个人的感受来看，不正常，因为它让你焦虑，不快乐。


    这里的根源，还是你的目标不够明确，执行不够坚决。你只是在被动地应付各种突如其来的事情，而没有主动规划自己要做什么。


    建议你可以学一些时间管理的知识。其中最重要的就是学会划分重要、紧急、不重要、不紧急的四象限。具体你可以百度或知乎上找一找。


    ## 提问 29


    何老师，您好，请教一个关于人性以及如何看待人性的问题。最近在生活和工作上连续遭遇了几件非常糟糕事情，被朋友欺骗，被下属背叛，为了自己的私欲。真诚待人却被人欺骗和陷害，最近一时无法调解好心态，影响到工作和生活。我开始不敢相信任何人，甚至身边亲近的朋友，我也在想是否也要改变自己去适应这样的环境来保护自己不受伤害，但是同时我也很憎恨厌恶变成他们这类人。如果是您，您会怎么做呢，很想听听您的看法。


    **答：**


    XX 好。谢谢你的信任。虽然你最近遭遇了一些让你对人性产生怀疑的事情，但是你依然选择了相信我。谢谢你。


    我认为，世界的总体是善的，我们碰到的人和事，是善的居多。而且在一个不断向前发展的社会中，世界在越来越往善的方向变化的。所以我们总体还是要对人、对世界有信心。


    但是具体到每个人的每一天生活中，我们偶尔也会遇到一些不善的人和事。甚至在某些情况下，这种概率还不低。而这些恶事的每一次出现，都会让我们深受伤害，甚至开始怀疑整个世界。


    那我们怎么看到这个世界，怎么应对这些事情呢？


    这分为三个层面。


    第一个层面，是从总体上，我们要降低生活中遇到恶人恶事的概率。如果你身处的环境，就是在奖励互相争夺，互相伤害的理念或行为的，可以看看有没有办法改变一个环境，到一个奖励互相帮助，互相扶持的环境中去。另外，在交朋友、找合伙人、招下属的时候，更加谨慎一些，对人品的考察放在更重要的位置。再者，还需要在机制上筑起防火墙。例如朋友相处的原则是怎样的，公司管理的制度是怎样的，从源头上减少被伤害被欺骗的可能性。


    第二个层面，是从具体的人和事上，如果碰到了恶人恶事，就果断切割，不要犹豫不决。然后放下，往前看，不要纠结在这里面。如果目光放长远，你会发现此时这些事情发生，对你反而是好事。试想一想，如果是在你更紧急、更危难的时候发生这些事情，后果会多严重？你现在付出了一些代价，但是认清了一些人，这对你整个人生来说是好事。


    第三个层面，我们要避免自己变成最讨厌的这类人。也就是，不管他们怎样，我们自己还是要坚持与人为善。你善良一分，这个世界的善良就多一分。我们不要把世界让给那些不善的人，而是要用我们的善去占领世界，让世界变得更美好。


    关于善，我此前写过两篇文章，其实都是在说你面临的这些问题。不妨参考一下：


    https://t.zsxq.com/7yvFmEm 《诸恶勿近的能力》


    https://t.zsxq.com/7yvFmEm 《在一个“互害”的世界，培养互爱的能力》


    ## 提问 30


    何老师你好，现在面临选择关头，手上的一个项目是否要继续下去？我现在在和电视台合作一个项目，好处： 1. 有平台背书。 2. 投入很少，场地有电视台方解决，当然要上缴收入的几成。作为专业，我的业务应该还是挺过关的，但现在面临几个问题：
    1. 电视台方的负责人属于很油滑，话不能信，利益至上的性格，如果可以选择，我是绝不会选择她作为合作伙伴的那种。 2. 最头疼的肯定是招生问题。本地的市场竞争比较激烈，我们进入的时机太晚了。找不到痛点，而且本人的能力更偏向专业而非营销。
    3. 虽然另有他人，实际上的操作是我一人在实施，但因为自己日常的工作量挺大，不能全身心投入。感觉现在越走越窄，不知道是否要放弃？ 回答是不能坚持（遇难而折）？不适合？还是确实跑道不行，要舍弃？


    **答：**


    教培行业，任何时候最核心的问题，都是招生。如果不解决这个问题，不管你做出什么选择，最终还是会有同样的痛苦。


    所以从根本上，你需要：1. 增强自己的营销能力，或者 2. 找一个厉害的营销合伙人，或者 3. 找一些厉害的营销机构帮你分销。后面两个方式，都需要你让出较大的利益。跟电视台的合作，我建议是继续下去。因为电视台的背书，以及台里可能提供的一些孩子们的学习、实践、展示的机会，都能很好地帮助你做推广，你要想一想怎么能够把电视台这个资源用好。


    但是，与合作人之间，要有很明确的契约，去规范双方的权力、责任。对方利益至上是好事，那说明当你需要他帮忙的时候，只要有利可图，他是会更乐意的。油嘴和话不能信，这个就要通过约束条款来保护你自己了。主要利益有合同保证，平时让他占一点小便宜，就忍了吧。


    事业要不要坚持，要看招生情况能不能改善。通常而言，在教培行业，只要你专业度足够，课堂体验做好，然后在口碑方面做得不错，以旧带新做得好，招生都是会越来越好的。因为每一个积累的旧生，都是你潜在的营销资源。把旧生服务好，利用好，你的业务是一定会慢慢积累，慢慢增长，越来越不好做的。


    但是如果一直没有改善，以旧带新的效果也很差，试过各种方法、试了很长时间也还是没有成效，那可能说明确实是在某些方面有所欠缺。如果这个欠缺不能通过自己提高来弥补，或者找一个得力的合伙人/下属来补上，那就确实是需要考虑一下别的跑到了。


    ## 提问 31


    何老师你好，我是一名未来想独立执业的实习律师，对未来非常焦虑。现在经常性接触到当事人，问的最多的都是能不能赢诉讼，可是很多时候诉讼结果并不是律师能左右的，但是当事人就是很需要肯定答复。


    我总觉得法律产品太过于是奢侈了，打诉讼和需要法律顾问的公司好像并不多，接触到的概率就更小了，我现在一点方向都没有，害怕独立执业了更没有方向，可以请你帮我想了思路吗？


    **星友答：**


    实习律师经常会问的两个问题。


    - 第一个问题是如何与当事人接触，当事人询问案件结果是非常正常的，就如同我们买东西需要看到基本的产品信息一样，回复当事人坚持“以事实为依据，以法律为准”就好，不论行政刑事民事案件都是如此的，最重要最基础的一个是查清案件基本事实，一个是适用法律。至于你能回答到什么程度则根据你的经验学识而定，切记不要超过当事人告诉你的事实和法律规定的法律而分析回复。

    - 第二个问题是执业前景的问题，这个问题太大了，而且分析个人的执业方向需要与自身实际情况结合，例如你的学历学术背景、你的天赋，你的家庭人脉资源等，但你觉得法律产品是一个奢侈品，说明你目前阶段学习的太少了，你还需要多读书和多历练，然后认识到法律产品是一个必需品，同时你也成为你目标客户的必须品。以上是工作五年的小律师浅见。


    ## 提问 32


    向您问个问题：有朋友有兴趣邀请自己加入他的一家新创公司，大概从哪几个角度来思考要不要加入一家新创公司呢？！谢谢何老师～


    **答：**


    先分享一个案例，再来回答你的问题。


    美团当初发展到紧要时，地推能力不行已经成了明显的短板。放眼全国，地推最强的阿里，而阿里地推团队的头叫开嘉伟。所以王兴就想挖阿干到美团。从阿干的角度来看，他就面临着和题主同样的问题：我要不要加入这家创业公司？当时阿干主要考虑了三个问题：这家公司做的事大不大？这个人生不牛？他们缺不缺我？最后的答案是：这是一件很大的事，王兴是个很牛的人，他们很缺我。所以阿干就加入了美团，把美团的地推能力大大往上拔了一个层次。


    回到题主的问题：


    这个问题分两个情景：一是加入不认识的创业者的新创公司；二是加入朋友的新创公司。


    先看第一种。这种比较具有普遍意义。


    那就是主要看几个方面：第一，这家公司所在行业有前途吗？第二，这家公司在行业内具有竞争力，或者竞争潜力吗？第三，这份事业和公司提供的岗位是不是我喜欢，或至少不排斥的？第四，创始人能力和人品如何？第五，团队里有没有我的位置和发展空间？


    如果五个方面的打分都很不错，那就大胆去吧。


    但是熟人之间的话，问题就更复杂了。你还需要考虑一些问题：第一，他找我是因为关系好给我个机会，或者找不到别的人先拉我顶着，还是这份事业确实需要我？第二，在工作中，我们能不能把感情和工作分开？第三，我加入他的公司，就从朋友变成了下属，日后相处会有很多别扭之处，我能不能忍受？我能不能在公众场合展现出对上级的态度，而不是朋友的态度？第四，我敢不敢和他把利益算得很清楚？第五，如果日后相处不下去要分道扬镳，俩人还是不是朋友？如果不是了，能不能接受？这些问题，都需要你问自己的内心，需要你好好评估和朋友的关系了。


    ## 提问 33


    老师，请问现在微信视频号很火，可不可以利用短视频来做线上教育。我妈妈是 20 多年的初中数学老师，高级教师。请问可以来做线上卖课或者其他方面的事吗？ 请问您线上教育怎么看？
    还有您对调研目标用户细分需求怎么看？


    **答：**


    第一个问题，关于要不要通过短视频做线上教育。


    首先，利用短视频来做线上教育，肯定是一个新的渠道，是可以去尝试一下的。


    不过，所有此类业务，都会面临一个核心问题：怎样推广，怎样获客？因为做课、拍视频都是相对简单的，但是让别人看到、动心、付费报课，确是很难的。


    所以，问题不是做不做，而是，如果要做的话，你需要先想好这些问题：第一，做出来的视频准备通过哪些渠道去发？第二，准备通过什么方式来引流？第三，如何设计让别人帮助你传播的因素？第四，怎样吸引用户愿意下单？如果你已经有一个比较好的自媒体，或者有一万以上的微信好友，或者有一些允许做推广的群，那是可以做的。如果没有这些，全靠冷启动的话，有很好的创意能够让视频传播起来，或者有足够本金去购买流量，也可以做；如果没有好创意，也不愿意花很多本金，那就很难了。


    第二个问题，对线上教育的看法。


    线上教育是线下教育的有力补充和部分替代，肯定会有很好的前途。但是如果自己做的话，要解决关键问题，就是引流。流量从哪里来，如何转化，是每一个想要入局的人必须先思考的问题。


    第三个，关于用户调研。


    用户调研是需要花很大的心思和成本的。


    心思包括：你要解决什么问题？为了解决这些问题，你准备设计哪些题目？如何设计才能让别人愿意回答？问卷怎样让别人看懂，好填？你通过什么方式去做调研？成本包括：时间成本，让别人接受调研所消耗的人脉存折，以及调研过程所花费的钱。


    这是一门很深的学问，很难通过很简单的几段话去解答。


    当然，你现在有很好的条件，那就是你妈妈是老师。你可以让她帮忙（如果她愿意的话）。例如，直接跑到她班上去发问卷，或者在她的班级群里发问卷，或者请妈妈在朋友圈或微信群说一声：我家孩子在做一个关于某某问题的调研，大家方便的话请支持一下，或者在妈妈开家长会的时候直接去现场和家长聊天。


    要不然，就只能先利用自己的熟人圈，厚着脸皮去和你认为是潜在用户的人聊了。


