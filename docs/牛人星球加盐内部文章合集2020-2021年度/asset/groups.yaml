    第二种方式叫 What If（如果……会怎样），如果我这样做，会怎样……


    这个方式可以先不用理会逻辑，而是把各种奇思妙想都抛出来，然后与目标相对照，看看是否能够吻合。


    同样是让平凡人变成牛人，如果用 What If 的方式，可以这样想：


    - 也许我可以到大学去讲课；

    - 也许我可以在一线城市举办跨年演讲；

    - 也许我可以设计帮助人成长的线下课程；

    - 也许我可以请牛人来分享；

    - 也许我可以设计一个共学的社群；

    - ……


    这其实就是所谓的"Brain Storm"（“头脑风暴”或“脑暴”），一切点子都可以提。提出来以后，再看它是否有利于实现目标，需要投入多少资源，可行性有多高等等。


    脑暴的时候，也不能漫无目的地瞎想，可以通过不同的线索来帮助自己梳理。举个例子，让你列举世界上圆形的事物，你能列举多少个呢？


    如果我们漫无目的地瞎想的话，可能列出十几个就没有头绪了。这时，你可以设定一些辅助思考的线索。


    东东枪举了一个例子：你可以按照自己每天起床时的动作顺序来想：起床睁眼，眼珠是圆的；看一眼闹钟，钟面是圆的；打个呵欠，嘴张圆了；去刷牙，杯子口是圆的；接水，水龙头出水口是圆的；照镜子，很多镜子是圆的……


    如果按照这样一条线的话，能想起来的圆形就多多了。


    我们在咨询工作中，常用的是 MECE 原则，就是不重复、不遗漏。这也是特别强大的工具。


    例如，怎样把平凡人变成牛人？


    这涉及到三个方面：变成牛人的方法；不同平凡人的特质；我接触和帮助平凡人的方式。


    以上每一个方面，又都可以再分解。我们以分解第三点作为例子：


    接触和帮助平凡人的方式，包括线上和线下两种。


    线上方式包括：文章、视频、音频、课程、社群。文章的渠道包括：公众号、微博、今日头条、百家号、企鹅号、知识星球等等；视频的渠道包括：微信视频号、B站、抖音、快手、优酷、爱奇艺、YouTube
    等等；音频的渠道包括……


    线下方式包括：见面会、线下课、年度演讲、一对一辅导、电话沟通、视频沟通、聚餐……


    你看，只要给出一个好用的工具，你梳理起来就会快很多，有条理很多。


    ## 未来的超级风口？


    睡前看书，一边看一边胡思乱想，突然想到一个未来可能的超级风口，和大家分享一下。


    人类信息的传输方式，最早是无意义的喊叫，逐渐发展成语言，然后有了结绳记事，后来有了文字。


    有文字以后，人类就进入了一个新的时代。古人说，仓颉造字，百鬼夜哭，就是因为原本只属于上苍的能力，被人类掌握了。


    从信息传输的介质来看，原本是声音，后来是绳子，然后是泥版、石碑、龟甲、莎草纸、竹简、布帛，到后来终于有了纸，有了书。活字印刷术出来后，书籍的传输加速了，人类的文明进步也加速了。


    19 世纪以来，人类发明了电报、电话、无线电、电视机，然后是电脑、智能手机。


    现在，我们传输信息的主要方式有：手机、口头、电脑、书本和纸张等。


    不管是书本、电报、电话、无线电、电视、还是电脑、手机的出现，本质上都是信息传输方式和介质的改变，每一次都造成了世界的巨变。


    那么，智能手机之后，下一种传输方式是什么呢？下一个传输介质是什么呢？我们每个人，可能在生活中，都曾经幻想过，如果能和别人心灵相通会怎么样。文学和影视作品中，也有无数描写“意念传输”的情节。


    从本质上来讲，我们的思维、动作、语言，都不过是大脑结构中某些物质运动的结果，这些运动会释放某一种电流或者电波，或者某一种类似电流或电波、但还未被人类发现的其他东西，经过神经的传导，来控制我们最终的思维、以及我们表达思维的方式。


    不管是电流、电波，还是未知的某一种形态，它总能被测量、记录、复制、读取吧？


    如果未来，我们可以直接用某种仪器读取脑电流或脑电波，并解读、传播到机器、甚至另一个大脑中呢？


    假设，以后每个人都戴一个特别制作的帽子，或者直接植入一个特制的芯片，帽子或芯片可以监测大脑皮层的运动，然后通过天线把这些运动的数据传递给别的帽子、芯片或者一个中央处理系统，然后翻译成别人可以理解的影像或者文字，甚至不必翻译，直接以电流或电波的方式，传输到大脑的中，让对方一瞬间就知道对方的所有思维活动呢？


    如果今后的科学能在这方面有所进步，那人类社会将发生天翻地覆的改变。在科幻中，其实我们已经多次见识过这样的场景。


    《三体》里面的三体人，互相之间就是直接传输脑电波，所以三体社会是没有秘密的社会，也不知道什么叫谎言和欺骗，这才有了人类的面壁计划，也才有了后面的故事。


    而玄幻小说里，人们可以用“神念”或者“神识”来交流，记录信息的东西往往是“玉简”，把玉简贴在额头，就可以直接向里面写入信息或读取信息。这也可以理解为脑电波的存储与读取。


    当然，从目前来看，这个东西还太遥远，还存在于科幻甚至是玄幻之中。但我相信科学界应该已经有了不少的进展。关于脑机接口、意念控制，都已经在实验层面实现了。意念打字和意念取物，在研究所里面都已经不是难事，只不过离大规模商业化还有一点距离。


    人类的大脑虽然无比神秘，但是从物理和生物的底层逻辑来讲，仍然是物质与运动的结合，从理论上是可以认知的，而科学也确实是在不断加深对它的认知。大脑皮层运动的监测、生物电流的识别等，现在都已经在某些程度上可以做到。未来发明监测脑电波的仪器，也并非天方夜谭。


    所以，我个人是很看好这个领域的发展。只不过，还需要多少年，才能取得关键的突破性进展，那就不是我猜测的了。从电脑、互联网、移动互联网、人工智能等领域过往这几年的发展速度来看，我们离这一天应该不太久。


    ## 参观华为记


    受华为公共事务部邀请，昨天去华为参观交流，感触颇深，特记之。


    其实很多年前，我就去过华为，在他们某部人员的带领下，参观了华为大学、工作区域、任总办公处等地方。


    当时，华为正处于意气风发的时候，在通信领域已经把朗讯等一众国际巨头全部挑落马下，前面只剩下思科一家。


    接待我的那位朋友和我讲，思科已经不算什么了，我们已经成立了“打 C 办”（思科的英文名为 Cisco），很快就能把它干掉。


    我不知道那位朋友是吹牛还是确有其事。反正当时听了很感振奋。但现在回想起来，也许华为在那时就埋下了今天的苦果。


    思科也是美国高科技顶尖的企业，在行业龙头的位置待了很多年，是美国的创新、就业、纳税大户，也是美国的骄傲。而华为说干掉就干掉了，美国人心里能好受吗？


    当然这不是说华为不该把思科干掉，也不是说华为应该把思科干掉。在商业中，它俩处于直接竞争的位置，华为成为世界第一，在全球攻城拔寨，思科和美国必然感到很难受。这是商业竞争规律，不存在该不该的问题。


    但它在现实中造成的后果，就是美国接受不了这个结果，在其他地方应对，因而造成了今天的这个局面。


    昨天在华为，我们先是参观了 ICT 技术展厅，看了华为的部分技术布局，如芯片、全栈 AI、wifi-6 等，一个总体感觉是，未来几十年，世界不管往哪个方向发展，华为都是必不可少的底层基础设施，而且是全世界竞争力最强的玩家之一（或者“之一”都可以去掉）。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_83_0.png)


    华为现在研发工程师有9.6万人，一年投入研发的资金就高达1317亿，这两个数字都是世界之最。这种对研发的超级重视，一直以来都是华为保持竞争力的重要源泉。


    华为新的使命是：把数字世界带入每个人、每个家庭、每个组织，构建万物互联的智能世界。


    看到这三个“每个”的表述，我不由感叹华为的雄心之大。


    中间交流的时候，华为主管公共关系的副总璟静和AR/VR总裁李腾跃都做了演讲。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_84_0.png)


    听璟静的演讲，感受最深的就是任总提出“开门办华为”。这两年来，华为可能也感觉到了此前不和外界沟通，不和新闻界打交道的做法，未必适应新的形势，所以来了一个一百八十度的大转弯。多年不接受采访的任正非，一反常态密切接受记者采访，一年的时间竟然做了37场。而到华为采访的记者，多达几千人。


    任正非要求华华人在 接受采访和对外发言时，允许自黑，不许自夸。这个要求也令我大开眼界。真是很少见到这样的公司。


    李腾跃则主要介绍了AR/VR的发展趋势。


    他讲到，2014年前后，AR/VR有一波兴起的狂潮，但是技术还不足以支持，所以后来泡沫破裂，沉寂了几年。现在随着技术的不断进步，开始了全面的产业复兴。他认为AR/VR是下一个三十年的“Big
    Thing”。


    李腾跃演讲中提到的AR/VR发展趋势和使用场景，和《在“比‘5G有多快’更重要的，是5G将带来哪些改变”这篇文章中写到的差不多，大家可以看一看。


    其中有一个令人印象极其深刻的细节：有人问李腾跃，华为会不会参与AR/VR的内容创作。李腾跃说，我们只负责提供设备，也负责部分的软件应用，


    至于内容，就让腾讯，或者网易这种小公司去做吧。


    听到“网易这种小公司”，坐席皆笑了，李腾跃刚开始没反应过来，愣了几秒才知道大家笑什么，然后自己也笑了。


    交流期间，华为的人拿出了新款 VR 眼镜给我们试用。虽然我很早就理论上知道 VR 眼镜的牛逼之处，但是真身临其境地试用，感觉还是很受震撼。


    其中一个内容是韩国某个演唱会。戴上眼镜之后，歌手和舞者就出现在你的面前，连眼睫毛都看得清清楚楚，距离近到仿佛歌手气息你都能感受到。


    看完这些 VR 的节目，你会强烈地感觉，现在流行的抖音、快手，几乎还处于原始时代，VR 才是未来。


    娱乐只是 VR 一个极小极小的应用而已，却已经足以创造万亿级的产值。而 VR 还可以用于教育、设计、购物、体育、健身、餐饮等等所有你能想到的业务上。


    移动互联网时代有句话，叫做所有行业都值得重做一遍。VR 技术成熟后，这句话大体上也成立。


    所以我坚定地认为，VR 未来将会大爆发。当然这个时间是 3 年、5 年，还是 10 年，我不能马上判断。只是有一种感觉，应该已经很近了。


