    而不久后，有一件事情让他真正差点死掉。有一回，他和哥哥们开着一条渔船出海玩，开到珠江口虎门地界时，遇到大台风，小渔船差点倾覆在波涛之内，三兄弟都差点葬身鱼腹。从那以后，他们再也不敢自己开船出海了。


    后来，为了生计，邓颖忠帮一个水泥厂做回收水泥袋的生意，由于能力极其出色，渐渐地在当地有了“能人”的称号，甚至村里有了搞不定的事，都会找他去帮忙搞定。


    1979年3月，邓颖忠经人介绍，在顺德承包了一个即将倒闭的纸厂。厂里有5个工人，邓颖忠又找公社借了500元启动费，就这样把厂子开起来。


    他给工人们开出了当时较高的工资，月薪35元。而第一个月，他直接开了双薪，让工人们都惊呆了，以为他给错了。他说，没错，就是这么多。


    此后，这些工人都为他卖命。一直跟随他到老。其中一个最小的，当时才16岁，现在还在他公司当高管。


    而他的钱是怎么来的呢？500元启动资金办了开场仪式，买了材料和设备后就花光了。是他自己在外面继续跑业务挣了360元发的工资。


    就这样，邓颖忠的纸厂开始飞速发展。不两年，他就成为了当时闻名全国的“全国第一镇”6个最有钱的万元户之一。


    1986年元月，邓颖忠意气风发地召集全场员工开年会，热烈的气氛让人毫不怀疑，这家纸厂明年又将迎来飞速发展的一年。结果，当天晚上，一场火灾，把所有东西都烧了一个精光。


    后来，邓颖忠四处找人借钱。一个姓姚的老板借给他200万，说要占股50%。邓颖忠说，不，接下来三年，这个厂是你的，挣的钱全部归你，我帮你打工，只拿工资，不要一分钱利润。如果三年后，没能挣够200万，到时再按你说的办。


    就这样，邓颖忠很快就重新办起了工厂。


    三年后，他开始转型制造卫生纸，并给厂子重新起了一个名，叫做中顺洁柔，从此有了洁柔卫生纸。


    而邓颖忠早在多年前，就开始“死亡演练”，也就是假设自己死了，公司会怎么办。他会半年时间离开公司，完全不闻不问，看公司是否能生存。结果发现，没有他，公司也能发展得很好。于是后面他基本上就不管公司了。'
