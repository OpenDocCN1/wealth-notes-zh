    但 30 岁的马明哲，却不顾重重困难，决心把这件事做成。他研究了国内外保险业的历史，向袁庚提出了组建新保险公司的想法。


    当时，马明哲和袁庚之间，隔着好几层行政级别。袁庚是招商局常务副董事长，主要在香港办公，而马明哲只是招商局管理下的蛇口工业区一个下级公司的经理助理而已。外界一直传言马明哲是袁庚是司机，其实是谣言。


    马明哲先是托蛇口工业区副总经理给袁庚带去一封信，得到首肯后，又专门坐船到香港去当面汇报。


    马明哲的一些超前想法和情怀打动了袁庚。特别是他提到，一百年前，招商局就曾经成立过“仁济和保险公司”，“我们为什么不能百年之后，重操旧业呢？“


    袁庚完全同意了马明哲的设想，并亲笔写信给国务院、人民银行的有关领导，详述成立一家新的保险公司的必要性，请求上级批准。


    1986 年 7 月 16 日，马明哲正式向人民银行深圳分行递交了一份申请成立保险公司的报告，然后带着袁庚的亲笔信上京，开始“跑”执照。


    不出意料，他的报告先是深圳被否决，其后又北京被搁置。


    此后一年多的时间里，马明哲就是不断地“跑、跑、跑”，一次一次被拒绝，又一次一次坚持，甚至还想方设法直接进入中南海找到相关领导。


    有人开玩笑说，“谁叫他姓马，马就喜欢跑”。话虽这样说，可背后的艰辛，又有几人能知？


    经过不懈的努力，这件事情，竟然让马明哲给跑成了。经过中国人民银行、国务院特区办等各级主管部门的同意，1988 年 3 月 21 日，组建“平安保险公司”的申请终于正式获批。


    由于这个结果来得太过艰难，当欣喜若狂的马明哲打电话向当时的招商局总经理江波汇报时，江波沉默了好一会，才感叹道：那真不容易啊……


    1988 年 5 月 27 日，平安保险正式对外营业。马明哲清楚地记得，从递交申请到营业，中间相隔整整 690 天。


    由于他在成立平安保险过程中的首倡之功和突出贡献，在公司第一次董事会上，马明哲被全体董事一致推荐为公司的总经理。


    从社会保险公司的助理经理到平安保险公司的总经理，马明哲用了两年多的'
  - '[PAGE 166]


    时间。从此他拥有了大展身手的平台，日后平安的辉煌和马明哲个人的成就，皆源于此。


    如果你觉得这令人羡慕，不妨想一想，当时处于他那种位置，你敢不敢提出这个想法？能不能坚忍不拔地把整个过程跑下来？


    世界上不是缺少机会，而是缺少主动寻找机会、创造机会，并拼尽全力抓住机会的人。


    平安的起步，是蛇口招商路上一间很小的门面，办公面积约200平方米，早期员工13人，都是全国各地来深圳的干部。


    这些干部们，没有一个养尊处优，而是住在6-8人的集体宿舍，每天一大早就骑着自行车，出去走街串巷卖保险。


    深圳的太阳有多烈，夏季温度有多高，大家都知道。而这些曾经坐办公室的干部，却一个个热情高涨，渴了喝口白开水，饿了啃口面包。白天出去跑业务，晚上还要回到办公室把保单做出来。


    当时，马明哲给每个业务员定的目标，是试用期（3-6个月）就要做到保费50万元，如果做不到，就走人。这个数字放到今天都不是小数，何况是三十多年前。而公司当时能给他们的，就是两本讲保险的书，和五盒名片。他们面对的，是对保险一无所知的老百姓——当时不少人听完介绍，会问一个问题：你们的保险柜是多大尺寸的？


    如此重压之下能够跳出来的人才，可想而知，都具有超强的抗压能力和开拓能力。后来，那些经过大浪淘沙还能坚持下来的干部，都在平安或者其他保险公司，成为顶梁柱。平安也成为中国保险业的“黄埔军校”。


    马明哲在平安强力灌输“两创”（创业、创新）理念，并且形成了与当时的政府部门和国企截然不同的“人员能进能出、干部能上能下、薪水高能高低”管理模式，同时接轨欧美、日本和中国的港台地区，利用优质、热情的服务来吸引消费者。


    这些在保险业发达地区司空见惯的做法，在当时的内地却有石破天惊的感觉。不管是消费者和员工，都耳目一新。平安的业务突飞猛进，成立当年，仅仅半年时间，保费收入就达到500万元。


    此后两年，平安又再次突破“只能在当地开展业务”的限制，把业务开拓到'
  - '[PAGE 167]


    了海南，进而其他沿海地区，直到遍布全国，并开出多家海外机构。


    到 1996 年成立第 8 个年头时，平安已经成为一家保费超过 100 亿元的巨型保险公司。


    在从 500 万到 100 亿的 8 年中，马明哲带领下的平安，接连创造了中国市场的多个第一。其中最重要的四大改革：一是企业改制；二是引入外资；三是自我革命；四是进入寿险。


    # （1）企业改制


    90 年代前后，随着中国和世界形势的变化，原来的很多国企已经无法适应市场化的需求，出现了诸多问题。很多国企或主动，或被动，选择了改制。


    但在当时，改制是个非常敏感的话题，有很多风光无二的企业，由于改制而一蹶不振，最终倒闭或者廉价卖掉，甚至很多企业家因为改制而出事。国有企业改制能够顺利完成，让企业不出事、企业家也不出事的，少之又少。


    而平安就是其中特别成功的一个例子，这与马明哲的远见分不开。


    在成立之初，平安是百分百的国企，两个股东分别是招商局和中国工商银行。在马明哲的推动之下，其后三年，又引入了中国远洋和深圳市政府加入了股东会。


    而早平安成立后的第二年，公司内部成立了“员工风险基金”。这个基金后来被改为“平安员工合股基金”，成为了平安的员工持股平台。这个员工持股计划，是平安改制的关键之举，它既为总经理为代表的管理层在董事会争取了一定的话语权，又避免了
    90 年代很多国企 MBO 导致的国有资产流失或贪污腐败的风险。


    # （2）引入外资


    1993 年，马明哲又开始酝酿另一个重大改革。当时，平安一直面临资本金不足的问题，管理上相对于国际同行也处于落后的位置。马明哲决定引入国际资本。


    他要引入的，不是一般的国际资本，而是全球最著名的两大投行：摩根斯坦利和高盛。


    这又是一个极具挑战的大难题。


    当时的平安，在国际上横向对比，还只是一个很不起眼的小保险公司。而摩根斯坦利和高盛，都是国际金融的巨头，要拉动这两家入股，谈何容易；而另一方面，1993 年的中国金融业，还处于国家监管非常严格的阶段，对外资的开放限'
  - '[PAGE 168]


    制得非常紧，平安需要突破重重政策的限制，为中国金融业开辟一方新的天地，更是难上加难。


    但对于马明哲来说，世界上就没有困难二字。他一方面通过各种方式去说服监管方同意引入外资；另一方面指派高管和摩根斯坦利及高盛开展了艰难的谈判。


    最终，在1993年底，谈判达成。平安出让了5%的股份，拿到了5000万美元的资本金。


    外资进来后，平安有了翻天覆地的变化。为了满足这两大资方的要求，平安的董事会决策机制和财务管理体系等，都开始向国际化看齐。


    # （3）自我革命


    除了引入外资加入股东之外，马明哲还以高价聘请了咨询公司麦肯锡给平安做战略升级、组织变革和文化塑造。如同IBM的咨询让华为脱胎换骨，打下了从百亿迈向千亿的基础一样，麦肯锡对平安的改革有了巨大的推进。用马明哲的话来说，平安是“花钱请人革自己的命”。


    与很多公司不信任咨询公司或者请咨询公司做了方案就束之高阁不同，马明哲对麦肯锡的建议言听计从，使得这次咨询成为中国企业发展史上最成功的咨询案例之一。平安开始了大刀阔斧的改革，真正开始迈向一家国际一流的保险公司。


    由于这个咨询项目是如此成功，以至于马明哲后来干脆把当时麦肯锡中国区的总裁张子欣都挖到平安，并在此后连续20多年一直保持麦肯锡保持长期咨询合作。


    对此，马明哲认为：如果河上已经有了桥，为什么还要摸着石头过河？出过桥费走桥上过不久行了吗？我们通过麦肯锡直接学习世界最先进的东西，就等于走捷径。


    # （4）进入寿险


    平安进入寿险业务，并非一帆风顺，而是经历了一番波折。1989年马明哲曾到保险最发达的美国纽约去进修，纽约保险学院的老师讲，华人忌讳生死，不欢迎人寿保险。言下之意是，寿险在中国人中没有前途。


    但马明哲并没有听信这个说法。在与台湾同行的交流中，他意识到寿险可能是一个比当时平安主要业务产险更加巨大的一个市场。


    但寿险和产险是截然不同的两个险种，产品设计和销售模式都不一样。如果平安要“摸着石头过河”，那就太费时间，马明哲决定还是“从桥上通行”。'
  - '[PAGE 169]


    但这回却遇到了很大的麻烦。马明哲先后拜访了美国、日本、香港等地的寿险先驱，虚心求教，但对方都以商业机密为由，紧捂着自己公文包，一点都不肯传授。


    马明哲暗暗发誓：有朝一日，我一定要超过你们。


    后来，平安辗转找到台湾的国华人寿。国华没有藏私，而是专门派出高管，给平安做了多场培训，其后，马明哲在深圳款待国华人寿的董事长翁一铭，他专门准备了翁一铭最爱喝的上好黄酒，和对方谈理想、谈抱负、谈困难，这些诚意，完全打动了翁一铭，以至于后者专门派出一支十几人的精干队伍，专门帮助平安发展寿险业务。


    后来，马明哲多次对国华人寿表示感激，国华也从与平安的合作中收益颇丰，其董事长翁一铭更是被马明哲称为最好的朋友之一。


    而平安，因为有了寿险业务，开始如虎添翼，很快成为在全世界都赫赫有名的保险公司。


    平安的多元化之路开始得很早，1991 年就开始进入证券业务，其后又逐渐闯进了银行、信托等其他领域。


    早在 1992 年，平安成立才第 4 年的时候，平安董事会就提出了“做以保险为主的综合金融集团”，即“建成以保险业为主，兼营投资、融资、证券、租赁、实业、贸易、旅游等多功能综合性集团公司”。


    从那时起，平安就开始 了“综合金融”之路的探索。不过，当初提出这个概念的 马明哲也许想不到，这条路竟然走得如此艰难。


    首先是内部面临的阻力。有人认为平安的保险已经足够赚钱，没有必要搞综合金融；有人认为全世界做综合金融的公司鲜有成功的，连国际上最先进的美国金融机构，也大多时走专业化之路，平安作为一个城里才几年的后起之秀，凭什么能做综合金融？


    马明哲好不容易说服了内部，但是在外部又遇到了强力的监管。


    当时中国金融领域整体的政策趋向是“分业经营”，平安的综合金融刚好碰到了政策的铁板。但马明哲认为“综合金融是金融业的发展趋势，是时代发展的必然。”他铁了心要向这个方向推进。'
  - '[PAGE 170]


    和冷遇。有次监管部门开会时，一位领导当着几百人的面，严厉地批评了“有些人要搞什么综合金融”的做法。但马明哲不为所动，依然坚持自己的道路。


    另一方面，他也通过各种渠道，锲而不舍地找监管部门去做工作。有时为了能跟对口的领导说上几句话，一等等就是几个小时。一次内部会议上，一位同事问马明哲：你成天在外面磕头作揖，为了说上几句话，街头上等到半夜，值不值？马明哲回答：“为了公司长远的发展，我情愿给大家下跪！”


    最终，马明哲和平安的坚守迎来了春天，于 2002 年拿到了综合金融的“全牌照”。


    但并不是说拿到牌照就万事大吉，更难的一步在于公司内部业务之间的打通。


    所谓的“综合金融”，并非仅仅指一家公司内部存在多个金融板块，而更是指所有这些板块之间相互连通，形成“一个客户、一个账户、多个产品、多种服务”的业务模式。


    这是一步非常凶险的路。此前国际上亦有不少大型金融机构曾经尝试，但是大多数以失败告终。平安的前面，并没有多少经验可循，一切都要靠自己摸索。


    马明哲用了极大的毅力和耐心来推进这项世纪工程。进入 21 世纪以后，平安先后搞了四次业务大集中，并建立了标准化、流程化、工厂化的金融运营后台，形成了马明哲口中的“万佛朝‘综’”局面，使平安真正成为“资源共享、优势互补、互为依托、共同发展”的综合金融平台。


    马明哲有一句名言：昨天的马明哲绝对领导不了今天的平安。


    当听到他的讲话，读到他的文章，见到他的布局，你会很难想象，成立平安之时，他只有高中的学历（后来自学成才，在职拿到中南财经政法大学货币银行学博士学位）。


    过往的 65 年，他一直在不停地进化。他的时间几乎全部用来学习、思考、工作，很少有休息或个人生活的时候。


    马明哲认为，成功没有捷径，勤奋是最朴素最实用的办法。根据《无止之境》作者秦溯等人的采访了解，他现在每天晚上工作到凌晨 2 点，早上 7 点半起床，每天只要在公司就有
    6 到 8 个会议的安排，每周还会面试 10 到 20 个管理岗位的候选人。如果睡觉时突然想起一件事需要布置，他会马上爬起来给部下发邮件。


    平安集团总经理兼联席 CEO 谢永林讲述，马明哲有一个习惯，每晚睡觉前，'
  - '[PAGE 171]


    把当天的事在脑子里过一遍；每周都会在固定时间，把一周的重要事情过一遍；每年的最后一天，一定会做全年的个人总结。


    他对新鲜事物充满好奇，有强烈的钻研和学习精神。所以不管是对保险、金融、互联网、公司管理还是科技发展，都研究得很深很透，有自己的深刻见解。被很多人认为是“能够准确预测明天的人。”


    但要说马明哲和平安成功的最关键因素，还是要归结到“蛇口精神”，那就是“敢想、敢言、敢试、敢闯、敢为天下先”。


    不管是创立平安，还是历次重大转型，无一不是当下面临重重阻碍，未来只见迷雾重重的困境，但马明哲从来都不自我设限，只要是看好的道路，哪怕是刀山火海，也要闯一闯。别人畏之如虎的险途，在他看来却有无穷的乐趣。'
  - '[PAGE 172]


    # 做一个单纯的人


    昨天帮一位朋友在公众号上推广猕猴桃。


    这次推广没有收广告费，是我主动提出要帮朋友做的。其实想帮助他推广的心思，从第一次吃到他的猕猴桃时就有了。我的想法是：如果这个东西真的好，而且又不贵，完全可以推荐给读者，只要是真心对读者好的，哪怕我自己不赚钱都行。


    但是这个行为也被一些读者朋友提出了善意的批评。他们留言说，你太单纯了，被人家这么简单就套路了。（他们具体说的话不同，但意思都是一样）


    对此，我的感觉是两个：


    首先，他们其实并不知道我和屈老头交往的全过程。我所见到的屈老头的实在，文章中说到的只是其中很小的一部分而已，还有很多我没有写到。


    举个小小的例子，此前我在微信朋友圈帮他推过一次，他郑重地提出一个问题：微店的电话应该留何老师的，而不是屈老头的。


    我就留你的吧。他说，这样不好，不符合规矩。


    我马上明白了他的意思。对于做电商的人来说，每一个微信好友，都是要千辛万苦才能加上的，甚至很多都是要花钱才能购买到的流量。所以微信好友是一笔随时可以变现的财富，这个应该是何老师的，而不应该是他的。


    我当即回答：应该留你的电话。因为这样顾客如果需要了解产品和物流的信息，联系你最方便。他这才答应留他的电话。


    这只是很小的一个例子。类似的情况还有很多。所以，对于屈老头的人品，我是完全相信的。


    其次，他的猕猴桃价钱本身就已经很便宜。我自己知道水果店、超市的猕猴桃是多少钱一个，也查过京东同样规格和产地的猕猴桃是多少钱一箱，他开的这个价钱，无论如何，对购买者都是非常实惠的。


    所以，哪怕是套路，这也是非常诚恳的套路。消费者并没有受到任何损失，反而能够以相对便宜的价钱，买到很好吃的猕猴桃。从这一点来说，即便是套路，我也并不在乎。


    我回复其中一位读者说：我不在乎他是不是套路，我只在乎我的内心。'
  - '[PAGE 173]


    我内心坚持的原则是：这件事情如果对读者有利，我何必去管别人是不是在利用我呢？我只能够给别人带去价值，那就足够了。至于我是不是被套路，又何必在意？


    这位读者说：你这样单纯，是做不了商业的。你要做的那个农业项目，也没办法成功，你就适合做公益项目。


    我非常不服气这一句，当即回答：那么就试一试。看看做一个单纯的人，能不能成功！


    有很多人不认为，何加盐不懂得商业上的尔虞我诈，不懂得社会的艰险。我想，如果他们知道我先前是做什么的，绝对不会这样想了。


    我研究过的人物，见识过的事情，可以说比世界上绝大部分人都要多、要深。对于人性中贪婪、丑恶的一面，我并非不知道，对于商业上的很多套路，我并非不清楚。我是单纯，但并不是傻。


    但我认为，做人真正的格局与勇敢，是哪怕明知世界的险恶，却仍然愿意以诚待人。


    我有这一念之诚在心，做人就坦坦荡荡。别人也愿意信任我，帮助我。


    这么多年来，我走到哪里，都有贵人相助，都有朋友帮忙，都有信任、喜欢我的人相随。我不管碰到什么事情，总能逢凶化吉；我不管要做什么事情，只要真心想干，愿意付出努力，总能得到很好的成果。这都和一个诚字离不开关系。


    我就不信一个真诚的、实在的人，会干不过那些阴险的人。更不用说，我有充足的把握，我一定比他们内心要淡定从容，充实幸福。


    我就愿意做一个单纯的、愿意相信别人的、愿意对别人好的人。


    不管世道如何变化，不管别人如何待我，不管商场是否险诈，我依然是我。永不改变！'
  - '[PAGE 174]


    # 能干多一点，烦恼少一点


    在一个家庭里，很多烦恼其实都是由极小的事情引起：水管子坏了、柜子门掉了、灯泡不亮了、马桶堵了，都足以让人崩溃。


    这些事情说起来很小，但是对生活质量和心情的影响却很大。如果能有一人挺身而出，把水管修好、柜门装上、灯泡换掉、马桶疏通，家庭的幸福感就比较容易维持。如果没有人能够处理好，家里很容易互相抱怨，甚至争吵。


    男性在家庭的主要职责之一，就是处理这些突发状况。如果一个男人连这些问题都处理不好，就会容易被老婆数落：你一点用都没有。


    所以男性应该有主动承担的意识，有善于解决的能力，不能把这些问题留给老人、老婆、孩子去解决。


    其实只要心里存着一个“我要解决这个问题”的心，去研究问题是怎么发生的，该怎么解决，往往并不难。每个物件的运行都有它的原理，其组装都有结构，只要明白了原理、了解了结构，大部分问题其实都可以迎刃而解。


    我们家的房子比较旧，常常不是这出问题就是那出问题。大部分问题，我们都不需要去请水电工或水管工，我自己就能研究一番，然后解决掉。


    这些年来，我学会了拆卸洗脸盆底下的冷热水龙头，安装带有加热、通风、照明3个功能4个按钮的电路开关（其火线零线的配置很复杂），组装非常复杂的子母床。至于换灯泡、修马桶、装衣柜这些，都已经不算是技术活了。


    我会发现，当你可以做这些时，不仅解决了家里的烦恼，让氛围回归到幸福、开心的状态，还能收获家里人的喜爱和崇拜。想想当你修好了一个东西，老婆用崇拜的眼神望着你，说“老公你好厉害”的情景吧。论成就感和幸福感，此刻岂不比拿到年薪百万更开心？


    也许有人会说，还不是因为穷，才需要自己干。如果有钱，这些直接打电话叫工人来修就行了。


    这话得说得没有生活经验。当水龙头关不上在喷水的时候，当家里完全没电陷入一片黑暗所有电器也都停摆的时候，当马桶堵在那里臭气熏天的时候，你打电话叫工人，谁知道他什么时候能来？更别说叫工人到家里，还存在隐私和安全风险，还得派人家里守着。而且，请人修好一个东西，和自己家里人就能修好'
  - '[PAGE 175]


    一个东西，心里的踏实感，是完全不一样的。


    女士也一样，帮孩子做个手工，帮老公缝个扣子，事都是很小的事，但是在家里意义重大。如果一个老婆啥都不愿意干或不会干，家里的氛围一定好不了。


    所以不管男女，多学一点家庭小百科，多承担一点责任，多会一点东西，家庭里的烦恼后少很多，幸福会多很多。'
  - '[PAGE 176]


    # # 在阿拉尔感受胡杨精神


    这次极飞彭斌邀请我们去新疆喝酒看星星，在库尔勒参观完极飞新疆总部，醉了三天后，第四天晚上我们到了阿拉尔。


    阿拉尔是老蔡的地盘，他之前在这里做工程，曾经住过很长时间，对这里每个地方都无比熟悉，到哪去都不需要导航。


    第一天到得太晚，又喝了一顿大酒，12点多才回到酒店。第二天一早，先看了 359 旅屯垦博物馆。下午老蔡迫不及待地把我们拉到了睡胡杨谷。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_176_0.png)


    睡胡杨谷是一个特别令人震撼的地方。这里原是塔里木河流域，胡杨遍布。几百年前因塔河改道，大部分胡杨渐渐沉睡，留下这一片广达几万亩的的苍凉所在。85% 的胡杨已经死去，但当地人不忍称为
    “死” 胡杨谷，而是叫做 “睡” 胡杨谷。马桶说，应该叫 “醉” 胡杨谷，这是一场生命的征战，胡杨只是醉了。醉卧沙场君莫笑，古来征战几人回？'
  md: '

    但 30 岁的马明哲，却不顾重重困难，决心把这件事做成。他研究了国内外保险业的历史，向袁庚提出了组建新保险公司的想法。


    当时，马明哲和袁庚之间，隔着好几层行政级别。袁庚是招商局常务副董事长，主要在香港办公，而马明哲只是招商局管理下的蛇口工业区一个下级公司的经理助理而已。外界一直传言马明哲是袁庚是司机，其实是谣言。


    马明哲先是托蛇口工业区副总经理给袁庚带去一封信，得到首肯后，又专门坐船到香港去当面汇报。


    马明哲的一些超前想法和情怀打动了袁庚。特别是他提到，一百年前，招商局就曾经成立过“仁济和保险公司”，“我们为什么不能百年之后，重操旧业呢？”


    袁庚完全同意了马明哲的设想，并亲笔写信给国务院、人民银行的有关领导，详述成立一家新的保险公司的必要性，请求上级批准。


    1986 年 7 月 16 日，马明哲正式向人民银行深圳分行递交了一份申请成立保险公司的报告，然后带着袁庚的亲笔信上京，开始“跑”执照。


    不出意料，他的报告先是深圳被否决，其后又北京被搁置。


    此后一年多的时间里，马明哲就是不断地“跑、跑、跑”，一次一次被拒绝，又一次一次坚持，甚至还想方设法直接进入中南海找到相关领导。


    有人开玩笑说，“谁叫他姓马，马就喜欢跑”。话虽这样说，可背后的艰辛，又有几人能知？


    经过不懈的努力，这件事情，竟然让马明哲给跑成了。经过中国人民银行、国务院特区办等各级主管部门的同意，1988 年 3 月 21 日，组建“平安保险公司”的申请终于正式获批。


    由于这个结果来得太过艰难，当欣喜若狂的马明哲打电话向当时的招商局总经理江波汇报时，江波沉默了好一会，才感叹道：那真不容易啊……


    1988 年 5 月 27 日，平安保险正式对外营业。马明哲清楚地记得，从递交申请到营业，中间相隔整整 690 天。


    由于他在成立平安保险过程中的首倡之功和突出贡献，在公司第一次董事会上，马明哲被全体董事一致推荐为公司的总经理。


    从社会保险公司的助理经理到平安保险公司的总经理，马明哲用了两年多的时间。从此他拥有了大展身手的平台，日后平安的辉煌和马明哲个人的成就，皆源于此。


    如果你觉得这令人羡慕，不妨想一想，当时处于他那种位置，你敢不敢提出这个想法？能不能坚忍不拔地把整个过程跑下来？


    世界上不是缺少机会，而是缺少主动寻找机会、创造机会，并拼尽全力抓住机会的人。


    平安的起步，是蛇口招商路上一间很小的门面，办公面积约 200 平方米，早期员工 13 人，都是全国各地来深圳的干部。


    这些干部们，没有一个养尊处优，而是住在 6-8 人的集体宿舍，每天一大早就骑着自行车，出去走街串巷卖保险。


    深圳的太阳有多烈，夏季温度有多高，大家都知道。而这些曾经坐办公室的干部，却一个个热情高涨，渴了喝口白开水，饿了啃口面包。白天出去跑业务，晚上还要回到办公室把保单做出来。


    当时，马明哲给每个业务员定的目标，是试用期（3-6 个月）就要做到保费 50 万元，如果做不到，就走人。这个数字放到今天都不是小数，何况是三十多年前。而公司当时能给他们的，就是两本讲保险的书，和五盒名片。他们面对的，是对保险一无所知的老百姓——当时不少人听完介绍，会问一个问题：你们的保险柜是多大尺寸的？


    如此重压之下能够跳出来的人才，可想而知，都具有超强的抗压能力和开拓能力。后来，那些经过大浪淘沙还能坚持下来的干部，都在平安或者其他保险公司，成为顶梁柱。平安也成为中国保险业的“黄埔军校”。


    马明哲在平安强力灌输“两创”（创业、创新）理念，并且形成了与当时的政府部门和国企截然不同的“人员能进能出、干部能上能下、薪水高能高低”管理模式，同时接轨欧美、日本和中国的港台地区，利用优质、热情的服务来吸引消费者。


    这些在保险业发达地区司空见惯的做法，在当时的内地却有石破天惊的感觉。不管是消费者和员工，都耳目一新。平安的业务突飞猛进，成立当年，仅仅半年时间，保费收入就达到
    500 万元。


    此后两年，平安又再次突破“只能在当地开展业务”的限制，把业务开拓到了海南，进而其他沿海地区，直到遍布全国，并开出多家海外机构。


    到 1996 年成立第 8 个年头时，平安已经成为一家保费超过 100 亿元的巨型保险公司。


    在从 500 万到 100 亿的 8 年中，马明哲带领下的平安，接连创造了中国市场的多个第一。其中最重要的四大改革：一是企业改制；二是引入外资；三是自我革命；四是进入寿险。


    ## （1）企业改制


    90 年代前后，随着中国和世界形势的变化，原来的很多国企已经无法适应市场化的需求，出现了诸多问题。很多国企或主动，或被动，选择了改制。


    但在当时，改制是个非常敏感的话题，有很多风光无二的企业，由于改制而一蹶不振，最终倒闭或者廉价卖掉，甚至很多企业家因为改制而出事。国有企业改制能够顺利完成，让企业不出事、企业家也不出事的，少之又少。


    而平安就是其中特别成功的一个例子，这与马明哲的远见分不开。


    在成立之初，平安是百分百的国企，两个股东分别是招商局和中国工商银行。在马明哲的推动之下，其后三年，又引入了中国远洋和深圳市政府加入了股东会。


    而早平安成立后的第二年，公司内部成立了“员工风险基金”。这个基金后来被改为“平安员工合股基金”，成为了平安的员工持股平台。这个员工持股计划，是平安改制的关键之举，它既为总经理为代表的管理层在董事会争取了一定的话语权，又避免了
    90 年代很多国企 MBO 导致的国有资产流失或贪污腐败的风险。


    ## （2）引入外资


    1993 年，马明哲又开始酝酿另一个重大改革。当时，平安一直面临资本金不足的问题，管理上相对于国际同行也处于落后的位置。马明哲决定引入国际资本。


    他要引入的，不是一般的国际资本，而是全球最著名的两大投行：摩根斯坦利和高盛。


    这又是一个极具挑战的大难题。


    当时的平安，在国际上横向对比，还只是一个很不起眼的小保险公司。而摩根斯坦利和高盛，都是国际金融的巨头，要拉动这两家入股，谈何容易；而另一方面，1993 年的中国金融业，还处于国家监管非常严格的阶段，对外资的限制得非常紧，平安需要突破重重政策的限制，为中国金融业开辟一方新的天地，更是难上加难。


    但对于马明哲来说，世界上就没有困难二字。他一方面通过各种方式去说服监管方同意引入外资；另一方面指派高管和摩根斯坦利及高盛开展了艰难的谈判。


    最终，在 1993 年底，谈判达成。平安出让了 5% 的股份，拿到了 5000 万美元的资本金。


    外资进来后，平安有了翻天覆地的变化。为了满足这两大资方的要求，平安的董事会决策机制和财务管理体系等，都开始向国际化看齐。


    ## （3）自我革命


    除了引入外资加入股东之外，马明哲还以高价聘请了咨询公司麦肯锡给平安做战略升级、组织变革和文化塑造。如同 IBM 的咨询让华为脱胎换骨，打下了从百亿迈向千亿的基础一样，麦肯锡对平安的改革有了巨大的推进。用马明哲的话来说，平安是“花钱请人革自己的命”。


    与很多公司不信任咨询公司或者请咨询公司做了方案就束之高阁不同，马明哲对麦肯锡的建议言听计从，使得这次咨询成为中国企业发展史上最成功的咨询案例之一。平安开始了大刀阔斧的改革，真正开始迈向一家国际一流的保险公司。


    由于这个咨询项目是如此成功，以至于马明哲后来干脆把当时麦肯锡中国区的总裁张子欣都挖到平安，并在此后连续 20 多年一直保持麦肯锡保持长期咨询合作。


    对此，马明哲认为：如果河上已经有了桥，为什么还要摸着石头过河？出过桥费走桥上过不久行了吗？我们通过麦肯锡直接学习世界最先进的东西，就等于走捷径。


    ## （4）进入寿险


    平安进入寿险业务，并非一帆风顺，而是经历了一番波折。1989 年马明哲曾到保险最发达的美国纽约去进修，纽约保险学院的老师讲，华人忌讳生死，不欢迎人寿保险。言下之意是，寿险在中国人中没有前途。


    但马明哲并没有听信这个说法。在与台湾同行的交流中，他意识到寿险可能是一个比当时平安主要业务产险更加巨大的一个市场。


    但寿险和产险是截然不同的两个险种，产品设计和销售模式都不一样。如果平安要“摸着石头过河”，那就太费时间，马明哲决定还是“从桥上通行”。


    但这回却遇到了很大的麻烦。马明哲先后拜访了美国、日本、香港等地的寿险先驱，虚心求教，但对方都以商业机密为由，紧捂着自己公文包，一点都不肯传授。


    马明哲暗暗发誓：有朝一日，我一定要超过你们。


    后来，平安辗转找到台湾的国华人寿。国华没有藏私，而是专门派出高管，给平安做了多场培训，其后，马明哲在深圳款待国华人寿的董事长翁一铭，他专门准备了翁一铭最爱喝的上好黄酒，和对方谈理想、谈抱负、谈困难，这些诚意，完全打动了翁一铭，以至于后者专门派出一支十几人的精干队伍，专门帮助平安发展寿险业务。


    后来，马明哲多次对国华人寿表示感激，国华也从与平安的合作中收益颇丰，其董事长翁一铭更是被马明哲称为最好的朋友之一。


    而平安，因为有了寿险业务，开始如虎添翼，很快成为在全世界都赫赫有名的保险公司。


    平安的多元化之路开始得很早，1991 年就开始进入证券业务，其后又逐渐闯进了银行、信托等其他领域。


    早在 1992 年，平安成立才第 4 年的时候，平安董事会就提出了“做以保险为主的综合金融集团”，即“建成以保险业为主，兼营投资、融资、证券、租赁、实业、贸易、旅游等多功能综合性集团公司”。


    从那时起，平安就开始 了“综合金融”之路的探索。不过，当初提出这个概念的 马明哲也许想不到，这条路竟然走得如此艰难。


    首先是内部面临的阻力。有人认为平安的保险已经足够赚钱，没有必要搞综合金融；有人认为全世界做综合金融的公司鲜有成功的，连国际上最先进的美国金融机构，也大多时走专业化之路，平安作为一个城里才几年的后起之秀，凭什么能做综合金融？


    马明哲好不容易说服了内部，但是在外部又遇到了强力的监管。


    当时中国金融领域整体的政策趋向是“分业经营”，平安的综合金融刚好碰到了政策的铁板。但马明哲认为“综合金融是金融业的发展趋势，是时代发展的必然。”他铁了心要向这个方向推进。


    和冷遇。有次监管部门开会时，一位领导当着几百人的面，严厉地批评了“有些人要搞什么综合金融”的做法。但马明哲不为所动，依然坚持自己的道路。


    另一方面，他也通过各种渠道，锲而不舍地找监管部门去做工作。有时为了能跟对口的领导说上几句话，一等等就是几个小时。一次内部会议上，一位同事问马明哲：你成天在外面磕头作揖，为了说上几句话，街头上等到半夜，值不值？马明哲回答：“为了公司长远的发展，我情愿给大家下跪！”


    最终，马明哲和平安的坚守迎来了春天，于 2002 年拿到了综合金融的“全牌照”。


    但并不是说拿到牌照就万事大吉，更难的一步在于公司内部业务之间的打通。


    所谓的“综合金融”，并非仅仅指一家公司内部存在多个金融板块，而更是指所有这些板块之间相互连通，形成“一个客户、一个账户、多个产品、多种服务”的业务模式。


    这是一步非常凶险的路。此前国际上亦有不少大型金融机构曾经尝试，但是大多数以失败告终。平安的前面，并没有多少经验可循，一切都要靠自己摸索。


    马明哲用了极大的毅力和耐心来推进这项世纪工程。进入 21 世纪以后，平安先后搞了四次业务大集中，并建立了标准化、流程化、工厂化的金融运营后台，形成了马明哲口中的“万佛朝‘综’”局面，使平安真正成为“资源共享、优势互补、互为依托、共同发展”的综合金融平台。


    马明哲有一句名言：昨天的马明哲绝对领导不了今天的平安。


    当听到他的讲话，读到他的文章，见到他的布局，你会很难想象，成立平安之时，他只有高中的学历（后来自学成才，在职拿到中南财经政法大学货币银行学博士学位）。


    过往的 65 年，他一直在不停地进化。他的时间几乎全部用来学习、思考、工作，很少有休息或个人生活的时候。


    马明哲认为，成功没有捷径，勤奋是最朴素最实用的办法。根据《无止之境》作者秦溯等人的采访了解，他现在每天晚上工作到凌晨 2 点，早上 7 点半起床，每天只要在公司就有
    6 到 8 个会议的安排，每周还会面试 10 到 20 个管理岗位的候选人。如果睡觉时突然想起一件事需要布置，他会马上爬起来给部下发邮件。


    平安集团总经理兼联席 CEO 谢永林讲述，马明哲有一个习惯，每晚睡觉前，把当天的事在脑子里过一遍；每周都会在固定时间，把一周的重要事情过一遍；每年的最后一天，一定会做全年的个人总结。


    他对新鲜事物充满好奇，有强烈的钻研和学习精神。所以不管是对保险、金融、互联网、公司管理还是科技发展，都研究得很深很透，有自己的深刻见解。被很多人认为是“能够准确预测明天的人。”


    但要说马明哲和平安成功的最关键因素，还是要归结到“蛇口精神”，那就是“敢想、敢言、敢试、敢闯、敢为天下先”。


    不管是创立平安，还是历次重大转型，无一不是当下面临重重阻碍，未来只见迷雾重重的困境，但马明哲从来都不自我设限，只要是看好的道路，哪怕是刀山火海，也要闯一闯。别人畏之如虎的险途，在他看来却有无穷的乐趣。


    ## 做一个单纯的人


    昨天帮一位朋友在公众号上推广猕猴桃。


    这次推广没有收广告费，是我主动提出要帮朋友做的。其实想帮助他推广的心思，从第一次吃到他的猕猴桃时就有了。我的想法是：如果这个东西真的好，而且又不贵，完全可以推荐给读者，只要是真心对读者好的，哪怕我自己不赚钱都行。


    但是这个行为也被一些读者朋友提出了善意的批评。他们留言说，你太单纯了，被人家这么简单就套路了。（他们具体说的话不同，但意思都是一样）


    对此，我的感觉是两个：


    - 首先，他们其实并不知道我和屈老头交往的全过程。我所见到的屈老头的实在，文章中说到的只是其中很小的一部分而已，还有很多我没有写到。


    举个小小的例子，此前我在微信朋友圈帮他推过一次，他郑重地提出一个问题：微店的电话应该留何老师的，而不是屈老头的。


    我就留你的吧。他说，这样不好，不符合规矩。


    我马上明白了他的意思。对于做电商的人来说，每一个微信好友，都是要千辛万苦才能加上的，甚至很多都是要花钱才能购买到的流量。所以微信好友是一笔随时可以变现的财富，这个应该是何老师的，而不应该是他的。


    我当即回答：应该留你的电话。因为这样顾客如果需要了解产品和物流的信息，联系你最方便。他这才答应留他的电话。


    这只是很小的一个例子。类似的情况还有很多。所以，对于屈老头的人品，我是完全相信的。


    - 其次，他的猕猴桃价钱本身就已经很便宜。我自己知道水果店、超市的猕猴桃是多少钱一个，也查过京东同样规格和产地的猕猴桃是多少钱一箱，他开的这个价钱，无论如何，对购买者都是非常实惠的。


    所以，哪怕是套路，这也是非常诚恳的套路。消费者并没有受到任何损失，反而能够以相对便宜的价钱，买到很好吃的猕猴桃。从这一点来说，即便是套路，我也并不在乎。


    我回复其中一位读者说：我不在乎他是不是套路，我只在乎我的内心。


    我内心坚持的原则是：这件事情如果对读者有利，我何必去管别人是不是在利用我呢？我只能够给别人带去价值，那就足够了。至于我是不是被套路，又何必在意？


    这位读者说：你这样单纯，是做不了商业的。你要做的那个农业项目，也没办法成功，你就适合做公益项目。


    我非常不服气这一句，当即回答：那么就试一试。看看做一个单纯的人，能不能成功！


    有很多人不认为，何加盐不懂得商业上的尔虞我诈，不懂得社会的艰险。我想，如果他们知道我先前是做什么的，绝对不会这样想了。


    我研究过的人物，见识过的事情，可以说比世界上绝大部分人都要多、要深。对于人性中贪婪、丑恶的一面，我并非不知道，对于商业上的很多套路，我并非不清楚。我是单纯，但并不是傻。


    但我认为，做人真正的格局与勇敢，是哪怕明知世界的险恶，却仍然愿意以诚待人。


    我有这一念之诚在心，做人就坦坦荡荡。别人也愿意信任我，帮助我。


    这么多年来，我走到哪里，都有贵人相助，都有朋友帮忙，都有信任、喜欢我的人相随。我不管碰到什么事情，总能逢凶化吉；我不管要做什么事情，只要真心想干，愿意付出努力，总能得到很好的成果。这都和一个诚字离不开关系。


    我就不信一个真诚的、实在的人，会干不过那些阴险的人。更不用说，我有充足的把握，我一定比他们内心要淡定从容，充实幸福。


    我就愿意做一个单纯的、愿意相信别人的、愿意对别人好的人。


    不管世道如何变化，不管别人如何待我，不管商场是否险诈，我依然是我。永不改变！


    ## 能干多一点，烦恼少一点


    在一个家庭里，很多烦恼其实都是由极小的事情引起：水管子坏了、柜子门掉了、灯泡不亮了、马桶堵了，都足以让人崩溃。


    这些事情说起来很小，但是对生活质量和心情的影响却很大。如果能有一人挺身而出，把水管修好、柜门装上、灯泡换掉、马桶疏通，家庭的幸福感就比较容易维持。如果没有人能够处理好，家里很容易互相抱怨，甚至争吵。


    男性在家庭的主要职责之一，就是处理这些突发状况。如果一个男人连这些问题都处理不好，就会容易被老婆数落：你一点用都没有。


    所以男性应该有主动承担的意识，有善于解决的能力，不能把这些问题留给老人、老婆、孩子去解决。


    其实只要心里存着一个“我要解决这个问题”的心，去研究问题是怎么发生的，该怎么解决，往往并不难。每个物件的运行都有它的原理，其组装都有结构，只要明白了原理、了解了结构，大部分问题其实都可以迎刃而解。


    我们家的房子比较旧，常常不是这出问题就是那出问题。大部分问题，我们都不需要去请水电工或水管工，我自己就能研究一番，然后解决掉。


    这些年来，我学会了拆卸洗脸盆底下的冷热水龙头，安装带有加热、通风、照明 3 个功能 4 个按钮的电路开关（其火线零线的配置很复杂），组装非常复杂的子母床。至于换灯泡、修马桶、装衣柜这些，都已经不算是技术活了。


    我会发现，当你可以做这些时，不仅解决了家里的烦恼，让氛围回归到幸福、开心的状态，还能收获家里人的喜爱和崇拜。想想当你修好了一个东西，老婆用崇拜的眼神望着你，说“老公你好厉害”的情景吧。论成就感和幸福感，此刻岂不比拿到年薪百万更开心？


    也许有人会说，还不是因为穷，才需要自己干。如果有钱，这些直接打电话叫工人来修就行了。


    这话得说得没有生活经验。当水龙头关不上在喷水的时候，当家里完全没电陷入一片黑暗所有电器也都停摆的时候，当马桶堵在那里臭气熏天的时候，你打电话叫工人，谁知道他什么时候能来？更别说叫工人到家里，还存在隐私和安全风险，还得派人家里守着。而且，请人修好一个东西，和自己家里人就能修好一个东西，心里的踏实感，是完全不一样的。


    女士也一样，帮孩子做个手工，帮老公缝个扣子，事都是很小的事，但是在家里意义重大。如果一个老婆啥都不愿意干或不会干，家里的氛围一定好不了。


    所以不管男女，多学一点家庭小百科，多承担一点责任，多会一点东西，家庭里的烦恼后少很多，幸福会多很多。


    ## 在阿拉尔感受胡杨精神


    这次极飞彭斌邀请我们去新疆喝酒看星星，在库尔勒参观完极飞新疆总部，醉了三天后，第四天晚上我们到了阿拉尔。


    阿拉尔是老蔡的地盘，他之前在这里做工程，曾经住过很长时间，对这里每个地方都无比熟悉，到哪去都不需要导航。


    第一天到得太晚，又喝了一顿大酒，12 点多才回到酒店。第二天一早，先看了 359 旅屯垦博物馆。下午老蔡迫不及待地把我们拉到了睡胡杨谷。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_176_0.png)


    睡胡杨谷是一个特别令人震撼的地方。这里原是塔里木河流域，胡杨遍布。几百年前因塔河改道，大部分胡杨渐渐沉睡，留下这一片广达几万亩的的苍凉所在。85% 的胡杨已经死去，但当地人不忍称为
    “死” 胡杨谷，而是叫做 “睡” 胡杨谷。马桶说，应该叫 “醉” 胡杨谷，这是一场生命的征战，胡杨只是醉了。醉卧沙场君莫笑，古来征战几人回？

