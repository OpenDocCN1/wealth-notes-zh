    这些年，我旁观了很多次网络事件，早就看明白了，在绝大多数情况下，所谓的“事实”，其实并不是事实。事件的两方，都会片面地把有利于支持自己观点的事实摆出去，而把不利于自己观点的事实隐藏起来。尤其是重大社会舆论事件或者国际舆论事件上，更是如此。


    而令人忧心的是，网络上的信息茧房愈演愈烈，人们根本就不愿意去关注和自己价值观不相合的人或媒体。一个人所能接触到的信息，往往就是持续不断地只支持某一个观点的片面信息，而这个人还会以为自己看到的就是铁的事实，而
    对之深信不疑，对于反面的事实全都看不见，或者看见了也视而不见。


    所以人与人之间越来越决裂，社会被割裂为一个一个的不同群体，互相之间 斗得不可开交，都以为自己掌握着事实和真理。不管是女权、环保、动保，还是 更大一点的人权、政治、国际关系等，都是如此。


    作为看客，我们首先要明白，事物有两面，事实有多个角度，不能只看一面， 只听一方。要更好地了解这个世界，少上当受骗，少被坏心眼的人和无良的媒体 当成炮灰，就有必要多点怀疑，多点耐心，擦亮眼睛，把事情看得更全一点，再
