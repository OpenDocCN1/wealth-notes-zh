    # # 创造财富与分配财富


    赚钱有两种方式，一种是创造新的财富，一种是分配旧的财富。


    所谓创造新的财富，是你通过制造对人类有价值的新产品，或者通过技术改进、模式创新等方法提高生产效率、降低生产成本，使这个社会的总财富增加了。


    这个财富有可能是实物，也有可能是无实体的效用（例如带来快乐、增加健康等）。


    例如，北大荒的农民生产出粮食，富士康的工人装配出手机，作家写出了新的好文章等等。


    所谓分配旧的财富，是你并不生产对人类有价值的东西，只不过是通过你所占有的优势地位，或者利用人性的弱点，把别人的财富转移到你那里。


    例如，通过行贿手段拿到一个本属于全民的煤矿，然后挖煤赚钱；利用人的贪婪、恐惧等心理或人的愚昧，而精心设计的“割韭菜”、“收智商税”产品等。


    有些企业/产品是综合型的，其中有创造财富的成分，也有分配财富的成分。


    例如，微软创造了 windows，这是极大的创造财富。但是它通过 windows 垄断市场后，把本来没有多少生产成本的产品卖出高价，获取高额利润，后面一部分就属于分配财富了。


    又如，史玉柱生产的脑白金、杜国楹打造的小罐茶，他们本身也都是有产品，有效用，但是产品的真正效用在其价格面前占的比重很小，其利润主要是来自财富的重新分配——也就是把钱从消费者那里转移到商家这里。


    更离谱的是像某某某某滴眼液和某某某药酒这种，号称可以治什么病，但实际上根本没有任何效果，纯粹就是骗钱，这就不创造任何社会财富，而只是把钱从这家转移到那家。


    另外一种典型就是传销，其终端的产品或许有一点价值，但是消费者付出的成本远远超过产品价值，随着金字塔层层往上，财富从消费者转移到一级一级的代理，最终转移到传销头子那里。


    每一个创业者，都需要思考一下，自己的产品/公司，是为世界创造财富，还是只是来重新分配一下财富。


    现代社会，对商人比较宽容了，只要能赚到钱，就能得到人们的羡慕和欢呼。'
  - '[PAGE 193]


    但是从整体来看，这样的企业是没有价值的；从长远来看，这样的企业家是受人唾弃的。


    凡是伟大的企业家和伟大的企业，无不是为社会创造了新的价值。而不仅仅满足于把别人的钱放到自己口袋里。


    那天在极飞和彭斌谈到这个问题。他说，我要做的就是创造价值的事情，而不是重新分配价值。


    我说：俺也一样。'
