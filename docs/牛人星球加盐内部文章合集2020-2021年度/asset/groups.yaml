    # **听到就要去做吗？**


    孔子和弟子们有过一次对话：


    子路问：“闻斯行诸？”子曰：“有父兄在，如之何其闻斯行之？”


    冉有问：“闻斯行诸？”子曰：“闻斯行之。“


    公西华曰：……我很迷惑，敢问您的回答为什么会不同？”


    子曰：“求也退，故进之；由也兼人，故退之。”


    看到这里真是深有感触。


    孔子知道自己弟子的性格，子路是个非常莽撞的人，所以他来问的时候，孔子要告诉他不要听到了就去干，要回家请示过父亲和哥哥，再来行事；而冉有个谦退的人，所以他来问的时候，孔子说：干就对了！


    我们平时会在网上、书上看到很多道理。很多时候我们听了会觉得，哇，好有道理呢。


    其实很多时候，我们觉得有道理的话，都是与我们本来性格相符的。


    一个莽撞的人，听了雷军说“生死看淡，不服就干”，会拍着大腿说，雷军讲得真好啊！然后变得更莽撞了。


    而一个瞻前顾后的人，听了“小心使得万年船”，也会心有戚戚焉，而变得更加谨小慎微。


    我们很少能碰到触及心灵，让自己直面弱点的道理。


