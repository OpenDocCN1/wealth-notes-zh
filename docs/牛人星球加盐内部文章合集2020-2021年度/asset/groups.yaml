    # 答：


    在这种人生重大关口，如果要选择换一种活法，一定要先想得非常清楚才行。


    有一个必须注意的原则：我们如果要改变，不是因为想要逃避，而是因为有更大或更好的梦想要去追逐。


    如果只是想逃避的话，最终你会发现，兜兜转转又回到了原地。虽然你可能换了一个工作岗位或者工作单位，但是原来困扰你的那些问题并没有解决，它们早晚还是会回来找你。


    所以，如果你选择的新的路子，并不解决根本问题的话，换和不换，其实没有太大的区别。如果要换，就一定要能够彻底解决当前困扰你的最核心的问题。


    具体到你的情况，我建议还是先保住国企的位子。但是同时利用业余时间，做自己想做的事情。但前提是要真正投入热情和精力，让自己能够看到成果，然后再动。


    最关键的：要确立自己的初心，是为了理想，而不是为了逃避生活的磨难而选择走另一条路。


    # **提问 19：**


    何老师，双节快乐～ 假期期间有空，把之前星球没来得及看的文章都看了看，看到《人生战略，从规划到实施》，我觉得大受启发，很高兴自己正在路上，但有感觉还差点什么。


    其中关于自己部分，我很认可“我是谁”比“我要去哪”和“怎么去”重要一万倍，但我绞尽脑汁，感觉对自己的认识还是很系统清楚，感觉对自己的感觉还是太主观。


    请问老师，关于对自己的认识，有没有什么好的方法去系统的梳理与整理～


    # 答：


    “认识自己”，既是特别重要的问题，也是特别难的问题。从古至今，它困扰了多少人，甚至是最著名的哲学家，也未必能回答好。


    说老实话，我自己也不敢断言，说我有一个很好的系统方法，能帮助别人认识自己。虽然我也总结过一些方法，但是毕竟效果因人而异。而且真正影响过多少人，帮助过多少人找到答案呢？我自己也是不确定的。'
  - '[PAGE 370]


    我的感觉是，它应该和你内心深处最大的渴望和最深的恐惧有关。你可能需要想一想自己最渴望的是什么，最恐惧的是什么。这两个问题不能浮于表面，而要逐层深入。例如，你说我最渴望得到别人的认可，这个不是答案。你还需要追问，你渴望的是谁的认可，哪方面的认可？


    你可能会发现，原来你渴望得到的，是来自父母的认可，你最希望他们认为你是一个具有很强的自立能力的人。


    但这可能还不够，你还得追问自己，你为什么这么希望得到他们这方面的认可呢？就这样不断追问下去，也许你会找到一个更深层的答案。


    对于恐惧也是如此。


    所以这个问题的答案，一定是在于自身。每个人可能都有自己不同的梦想和恐惧。而他们实现这个梦想和避免这个恐惧的途径，又各有不同。


    现在市场上有一些“个人教练”（Coach），会帮助个人梳理这方面的问题。但是收费都很高，效果也因人而异，所以要根据自己的情况来决定是否要选择这样的服务。咱们星友群里也有从事coaching工作的，你可以在群里也问一下。


    另外就是，我此前的文章《迷茫时的3个选择，决定了你人生的高度》也提到过一些如果找到方向的办法，你可以看一看哪种办法比较适合你。这篇文章的重点其实在文末的注释部分，可以好好看看。


    # 提问 20:


    何老师您好！我正在读大一，课程不多，专业不怎么样，想问问应该把精力放在哪一方面，重点该学习什么呢？英语？计算机？


    # 答：


    首先要看你未来想做什么。如果你已经想好了要做的事情，那么与那个事情相关的东西就是你要学习的重点。


    如果你还没有想好未来要做什么，那就选择那些怎么都不会错的事情。例如：


    +   1. 学一些以后工作用得上的技能：


    +   演讲、写作、书法、PPT、外语、编程、心理学、经济学、财务管理、企业管理、时间管理、思维导图、广告设计、营销技巧、商务礼仪、着装规范、（女生）化妆……


    +   2. 学一些生活用得上的技能：'
  - '[PAGE 371]


    +   3. 也可以学一些纯娱乐调剂性质的技能：吉他、合唱、民乐、素描、插花、跳舞、陶艺、雕刻、剪纸……


    +   4. 还可以学一些有益身体的技能：羽毛球、网球、高尔夫、篮球、瑜伽、滑板、跑酷、游泳……不要贪多，先选择其中一两样开始学（1-4类别搭配，每一个类别只选一样）。


    而且，要学，就沉下心来，学精、学细，争取学一门，会一门。不要狗熊掰棒子，捡起这个丢掉那个。


    # 提问 21：


    何老师，你平时写作用哪种方式，近期打算开始写点东西，不是用来发表的，像写日记一样，去规划自己的工作，生活，类似于日志及反思，像查理芒格所说希望能在第二天能比前一天聪明一点就好


    # 答：


    我的写作分为很多种。


    第一种是关于牛人的研究文章，因为要发在公众号上，所以是比较慎重的，要花很多时间来研究资料和组织材料，往往要一周的时间才能写一篇，有时还会很紧，需要连续加班才能写完。


    第二种是研究牛人的感悟，也是发在公众号上。一般也是五千字以上的长文，一篇文章就讲透一个问题。这种也要花两三天时间。当然，在写作之前，可能对那个问题的思考已经有几年或者几个月，只不过是现在把它用文字组织出来。两三天是思考文章结构和语言表达的时间。


    第三种是发在星球的文章。这种就是有感而发，比较随性。往往是看书、做事、与人交往中突然有某个点，就把它写下来。偶尔点子太多，我也会先在微信上自己给自己发一条信息，把关键字记下。等有空的时候再一篇篇写。这种文章写起来就比较快，可能半小时就写好了，一般是
    1200 字左右。


    第四种就是不发在任何地方，就是自己给自己看的了。会记录在微信或者备忘录上面。就是简短的几句话，或者一两段文字。偶尔会发个朋友圈，但朋友圈的字数一般都不多。'
