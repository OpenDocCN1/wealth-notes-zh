    # 无限复购的生意


    所谓“无限复购”，就是同一个客户会持续不断地在你这里消费。理想情况下，每一个客户，只要第一次在你这里购买了，以后他每一次购买这种产品，都是在你这里。


    如果能做成一种无限复购的生意，那么你只要早初期积累了足够多的客户，后期就不再需要花费很多时间精力去做业务拓展，旧有的客户本身就是以让你维持一定的收入水平。


    由于业务拓展总是非常艰难的，甚至是绝大部分公司最艰难的地方。所以无限复购是一种很值得追求的状态。


    但是要做到无限复购，又是很难的。


    一是这种产品的消费本身就需要有一定的频次。一辈子只需要一次的不合适了。如果是每年、每月甚至每天都要购买的，那就很合适。


    烟、酒、茶、咖啡这种成瘾性物品，降压药、糖尿病药等需要长期不间断服用的药，保险、体检等需要年复一年购买的产品，微信、微博、短视频、淘宝拼多多等每天都会使用的服务，都可以做到无限复购。


    烟草公司只要有一批忠诚的客户，就能活得无比滋润，哪怕税收得这么高，哪怕烟盒上印的是那么恶心的图片，知名品牌的收入照样很多。酒类也是如此。爱酒之人一般都会用比较固定要喝的几种酒，便宜一点的喝二锅头，贵一点的喝茅台，只要自己觉得好，也消费得起，就会一直持续购买同一种。


    油、盐、酱、醋、矿泉水这种也是每天要用的。所以海天酱油和农夫山泉都是很好的公司。


    二是这种产品的品质和服务要有保障。如果品质和服务不好，那就不可能形成无限复购，一般就是一锤子买卖。


    很多产品的消费频次其实很高，但是并不是每家公司都能做到无限复购。例如咨询业，其实企业发展一直会遇到问题，一直会有咨询的需要，但是很多咨询公司只要做一次生意，其所服务的企业就不会再与之合作了。其中的关键，就是服务的不好，所以没有复购。因此，很多咨询公司只能通过收取'
  - '[PAGE 286]


    高价的方式做一锤子买卖，然后要不断地去拓展新客户，如果没有新客户进来，公司就死掉了。


    所有其他高频产品也同样如此。只要产品品质或者服务质量没有吹嘘的那么好，那么无限复购的过程就被中断了。一旦用户转向其他产品，你的无限复购就变成了再无复购。


    无限复购既可以做成大生意，也可以做成小生意。日本韩国西欧很多家族小店，就是靠当地忠诚用户的无限复购，可以一直维持好几代人的生活。K.K.所说的“一千个忠实用户”理论，也是说用一千个忠诚用户的无限复购来维持创作者的生活。而如果做大了，就是茅台、苹果、耐克、香奈尔……


    咱们群里面，陈厚是大生意，屈老师是小生意，都过得挺好。加盐星火会本身也是无限复购，星友们每年续费，对我而言就是无限复购，因此我都不需要花费巨大力气去四处招募，只不过规模较小，是小生意。


    无限复购在成熟以后，不需要大力拓展业务也能维持，但这并不意味着不可以去大力拓展。如果大力拓展加上无限复购，就很容易做成大生意。当然这样非常难，要业务拓展能力、品牌打造能力、品质把控能力都非常强才行。


    每一个生意人，在开始做生意之初，都需要考虑，我想要做的是无限复购生意还是一锤子生意。无限复购可持续性强，一锤子生意单笔利润高。两种模式没有高下之分，都有各自适用的场景。


    旅游景点物品价格很高，因为主要是一锤子生意，复购率几乎为零，所以要通过单次利润的提高来维持；但是小区里面的包子铺就需要无限复购，因为几乎没有外人来，只有尽量维持小区居民的复购率，才能有生意。


    但是从运营的难度讲，旅游景点比小区店铺难，因为旅游景点必须不断去吸引更多的客流，而小区店铺却不需要。所以我们可以看到旅游景点的小摊小贩或者饭店，总是要高声叫卖，四处拉人，小区的店主就坐在那里就行了。


    从我们的人性上来讲，让我们更舒服，确定性和安全感更强的，无疑是无限复购生意。如果我们能够做上这样一门生意，那么焦虑就会减少很多。


    如果你正在考虑未来要创业，或者业余余做点小生意的话，不妨研究一下，看能不能找到一种无限复购的生意。'
  - '[PAGE 287]


    # # 展示自己的脆弱


    以前一直都是我送小孩上幼儿园, 每次孩子都是（看起来）高高兴兴地入园。他虽然也和我讲过不想上幼儿园之类的话, 但是到该去的时候, 还是会乖乖地去, 不哭不闹。


    前几天出差, 都是糖豆送的。结果, 每天早上他都哭成一个泪人, 抱着妈妈不肯放手。


    这两天我回来了, 他又恢复到原来不哭不闹的样子。


    我和糖豆开玩笑说, 你看, 还是爸爸会带孩子吧。


    但话虽然如此说, 我内心里清楚得很, 孩子之所以在我面前选择坚强, 是因为他知道我不喜欢看到他的脆弱。而妈妈会全心全意地包容他, 所以他可以在妈妈面前展示自己最脆弱的一面。


    女儿在我们面前也是如此。我的要求一向比较严格一点, 她有什么错误我都会指出来, 结果就导致她会尽量避免在我面前犯错；而妈妈会比较开明, 所以她不介意向妈妈展示错误和缺点。


    如此一来, 当她参加各种语言类比赛, 在家里练习时, 总要把我轰出去, 说我看的时候她就演不了。


    其实从指导能力上来说, 我比糖豆经验更丰富, 毕竟我上学时是话剧社的台柱子, 我编导的作品曾经拿过全省校园话剧大赛一等奖和全国校园文化建设一等奖, 而且现在也是靠文学为生。但女儿偏偏就不让我看,
    连录像也不让。因为她害怕我会挑出表演中的毛病。


    这当然不是一个好的习惯, 但是这个不好的习惯形成的原因, 主要是在我。因为我太严格, 才导致孩子要在我面前表现出完美的一面。


    我以前一直觉得, 坚强, 应该是我们最需要拥有的品质之一, 并一度将其作为培养孩子性格的三个关键词之首（另外两个是乐观、勇敢）。之所以这样, 是因为我认为人生不如意事常八九,
    一个人需要有一颗坚强的心, 才能在这个世间活得好。


    但人到中年, 我越来越觉得, 我们未必要时时刻刻表现出坚强。面对挫折和失败, 痛苦悲伤都是正常的心理反应, 强行压抑未必就好, 表达出来未必就坏。'
  - '[PAGE 288]


    甚至在 一些亲密关系中，愿意展现出脆弱，本身 就是促进双方关系和疏导自身情绪的一个 重要方式。


    我看美国小布什、拜登这样被认为是没那 么聪明的总统，总是时不时就流个眼泪， 喃喃着让上帝赐给我力量吧。他们这样做， 不仅有让美国选民觉得他们太脆弱，反而 告诉了美国选民，我也是和你们一样，活生
    生的人，更容易贴近他们的心。所以他们的 能力未必有艾森豪威尔、克林顿，甚至特朗 普那么强，但是他们的共情能力，触动人心 的能力，却非常厉害。


    中国古代也有这样的人，就像刘备，他不 会掩饰自己的无助、彷徨和脆弱，反而他和 关、张、军师的关系最为亲密。现代也是， 我犹记得08年地震时，我看到某宝蹲在一个
    废墟前流眼泪，突然莫名地感到一股强大的 力量。此后，虽然有很多人说某宝这样那样， 但我心里一直铭记着那一个画面。


    作为男人，我们从生下来起，就被教导要 坚强，不能哭。结果我们很多人终生丧失了 脆弱的能力。哪怕是面对自己最亲的亲人， 都要说，我很好，不用担心；而从来不会
    说，我很不好，我好害怕，我好无助，我心 里好难过。我们哪怕遇到再难的事，都不会 趴在老婆怀里哭一场，最大不了就是和兄弟 一起喝个酒痛骂一下。


    这样对自己，对家庭，其实未必是好的。 一个真正好的亲密关系，应该是可以接纳 脆弱，鼓励表达脆弱，然后一起战胜脆弱的； 而不是只允许坚强，只表达坚强，然后独自
    一人强撑着去面对脆弱。


    在电影《头脑特工队》（ Inside Out）里 面，“忧愁”一开始是一个特别不受待见的 角色，她自己也总是藏着。因为人们不喜欢 看到一个人愁眉苦脸的样子。但最后我们
    会发现，人不能没有“忧愁”，因为她是我 们正常情绪中必不可少的一部分。


    所以，在教育孩子过程中，我觉得让他们 能有一个地方表现出自己的脆弱，也是挺 好的。我并不认为那些哭泣是令人生厌的， 必须制止的。有人包容自己的哭泣，才会 让自己在无助的时候找到感情慰藉的所在。


    我们每个人，都需要保留一个自己可以 哭泣的地方，以及一个可以对者她/她哭泣 的人。'
  - '[PAGE 289]


    # 我方的翻译水平究竟如何？


    这一次阿拉斯加会谈，我方的翻译引起了很多的关注。有一些人说她没有把我方的一些强硬表态准确地翻译出来，但是也有一些人说翻译太厉害了，被她圈粉。


    这让我想起了我从前一次同声传译的经历。十几年前我还在浙大读研，在上海一家公司实习，被领导派去给一位著名经济学家做同声传译。


    当时正值次贷危机的时候，所以教授讲的主题是次贷危机对全球经济以及中国经济的影响。咱们且不说我的英语水平怎么样，就说那些次贷危机的名词，就不是一个刚毕业的、没有深入研究过经济金融的学生能够了解的，甚至很多听都没听说过，例如
    CDS、CDO 等。


    但是公司领导非要派我上。他说，如果你想游泳，最好的办法就是跳进水里。


    所以我就硬着头皮上了。


    其实整个翻译的过程还好，都比较顺利，但是中间有一次卡壳了，因为教授说的词汇太专业，我确实是没有听说过，所以不管是怎么 pardon 都没办法明白。


    我只好抱歉地对观众说，不好意思，这句我确实没听明白，有没有谁听懂的可以帮我接着翻译。台下几百名听众全都哄堂大笑，教授都不知道他们在笑啥。而更惨的是那场会议是他们市的电视台在那里全程直播，搞得我非常尴尬。


    主持人上来解围说，咱们翻译可能是太累了，没关系，我们给他鼓鼓掌吧。后面我们就接着进行了。会后，一大堆的媒体记者都围着教授采访，每问完一个问题，长枪短炮刷了一下就转向我。估计那会儿我在他们当地媒体上也挺长脸的。


    这次经历锤炼了我，让我到今天都对当时的很多细节都记忆犹新。从那以后，我就觉得世界上没有什么事情是挺不过去的。作为一个极度爱面子的人，那种堪称“社会性死亡”的尴尬时刻都过来了，还有什么其他东西能够让我感到尴尬呢？而且也就是从那儿起，我就觉得任何艰难痛苦，其实就是一睁眼一闭眼的功夫就过去了，等过完以后你就可以云淡风轻的看待它了。


    说回到这一次的翻译，她的水平究竟如何呢？我认为，在这种涉及到国家重大利益，以及全世界瞩目的重大场合，翻译本身就无比的紧张，能够听清楚我方代表讲的话，把意思全部记录下来，都已经极其不容易，何况脑子里还要同时转'
  - '[PAGE 290]


    着把它翻译成英语。我方翻译都做得特别好，其水平是毋庸置疑的，极高之高。


    我注意到一个细节，中间连美方代表都笑着说，应该该给她升官（give her a raise）。这也算是整场会谈为数不多让人感到温馨的细节之一。


    当然不是说没有改进的余地。因为这是一个剑拔弩张的会议，而且是在全世界要播放的，我方的强硬表态应该让对方能够体会上。而翻译的语句和用词是比较温柔的。这也是学院派的风格，没有办法准确的表达出那种街头骂战的精髓。


    例如我方代表说：“我把你们想的太好了，我以为你们会遵守基本的外交礼仪。”“美国人没有资格居高临下同中国讲话”“我们中国人不吃这一套”这些话翻译成英语，虽然意思大概没错，但是都失去了原来的力度和韵味。


    有一些曾经在美国长期生活过的朋友提出了更有刀语的翻译，但这可能是必须得长期在那种语言中浸泡，而且跟人有过粗鲁的骂战才能领会到。如果长期待在精英温文尔雅的圈子，应该是难以用上那些词的。


    但总体而言，这一次翻译确实是非常出彩，估计回来会受到表彰。


    查了一下，翻译是张京，中学毕业于杭外，大学是外交学院。我认识很多的杭外学生，每一个都很强，杭外真是一所了不起的学校。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_290_0.png)'
  - '[PAGE 291]


    # 用录音来写文章


    正好下午带小孩上课，所以有一点时间，就回答了星球上的 3 个问题。


    3 个回答加起来有 3000 多字，其实就是大概三四十分钟的时间就写完了。这个效率让我自己也是惊讶。


    因为我平时要写三四千字，可能需要一下午。在写作界，这都已经是比较快的速度了。因为这意味着一天可以写七八千字，如果再加上晚上加班的话，都有 1 万多字了。而现在效率比之前写还要高很多。


    其中的诀窍是什么呢？就是我用语音来回答，通过讯飞转化成文字，所以讲完后，稍微改一改，直接贴上去就行了。


    我们讲话总是比打字要快很多，所以这是改进效率的一个很好的办法。


    同时，通过语音来说的话，其实是有利于我们锻炼自己的语言表达能力，会减少很多不必要的语气词，要不然整理起来会很麻烦，所以说的时候会刻意地避免这一点，尽量要说的连贯一些。还要注意自己的普通话，不能有口音，否则语音就识别不出来。


    以后我可能会多用语音的方式来写文章，预计写作的速度还会比现在要快一些。


    我感觉用语言说而不是文字写，还有助于帮助梳理清楚你的思路。有时候明明不知道该写什么，写怎样去写，但是如果用语言的话，就好比两个人在聊天对话，自然而然就会知道怎么去做。


    从这一点来讲，如果大家以后在写文章的时候卡壳，或者不知道如何开始，不妨试一试先用语音的方式开头，甚至可以用语音的方式来写全文，这样的话，就避免了拿着笔或者拿着键盘不知道怎样去开局的局面了。


    当然，要能够拿起手机就说什么，也需要不断地积累。如果脑子里是空空的，你很可能什么都说不出来，或者就算能够说出来，大概率是废话。那就没有任何意义了。


    所以我们平时还是要多读书、多思考、多跟厉害的人请教，多记录自己的所思所想。只有胸中有万语，下笔才能有千言。


    最后说一下，加上本文的话，今天中午用了 50 分钟的时间都写了快 4000 字。'
