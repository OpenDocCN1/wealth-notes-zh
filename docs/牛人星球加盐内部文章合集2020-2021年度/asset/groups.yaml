    你喜欢的几项内容，可能还要再度深追问一下自己：是不是真的喜欢？是偶尔做一下喜欢，还是乐此不疲地喜欢？如果把它做成了一门职业，每天8小时什么十几个小时做这个，你是否还能喜欢？


    举个例子，你喜欢插花，那么如果如果要你一天到晚地插花，你会愿意吗？如果回答是的，你可以先找一家插花的店去工作。你在大众点评上搜你所在的城市，找到那些店，然后一家一家去求职。等弄明白了这个行业是怎么回事，以及自己是不是真的喜欢之后，可以考虑自己开插花馆。健身和烹饪不是十分建议。喜欢健身和当健身教练是两回事，喜欢烹饪和当厨师是两回事。如果你真的特别喜欢，那么可以，如果只是一般的喜欢，还是算了。


    至于收纳的话，确实是一个非常小众的行业。业务开拓会很难。如果你有好的业务拓展渠道或者思路，可以试一试，如果只会收纳，不会推广生意，那么建议慎重。


