    ## 诸恶勿近的能力


    前面我说到善良不仅是一种选择，更是一种能力，总感觉有个重要的地方漏写了。今天突然想起，原来我漏掉的是“诸恶勿近”的能力。


    很多人之所以对世界充满戒心，不是他自己选择那样做的，而是因为他所处的世界就是一个“互害”的世界，他平时接触到的人并没有怀着善意对待他。久而久之，他会认为人与人相处就是应该你防着我我防着你。


    但也有一些人，他所处的世界是一个相对讲规则或者善意的世界，他接触到的人都对他怀有善意或至少是没有恶意。久而久之，他会认为人和人相处完全没有必要你防着我我防着你。


    这样两个世界的区别，有大环境的原因，例如物质丰富程度、礼仪教化的程度或对契约精神的尊重程度等，也有个体自身的原因。


    今天我们不讲大环境，只讲个体的选择如何让诸恶勿近。


    - 首先是有能力分辨哪些人可能会对你有坏心眼，并且远离他们。


    我们去信任一个人，也不是说毫无选择、毫无保留地碰到一个人就去信。信任别人的前提，是对世道人心有基本洞察，可以大概分辨出每个人接触自己是抱着什么目的，并且对相信他或者不相信他可能会造成的结果有所预判，以及有勇气和原则可以去处理有可能会对自己及别人造成伤害的事情。


    例如何加盐对星友的信任，也是因为首先知道大家是因为价值观或意气等相投，才会成为加盐星友会的会员。我也不是说对公众号所有读者都一视同仁地一下子就无条件相信。


    其实星友里也不是没有出现过错似骗子的人。但是我都是第一时间就把存在嫌疑的人请出去了。也有一些是星友私下告诉我，我给处理了（作为一个很不愿意得罪别人的人，要做到这点并不容易）。


    所以我们今天所在的星友会，相对于普通读者群而言，或者说相对社会大环境而言，是一个相互之间更纯净、更值得信任的社区——当然，我这里并不是说让星友们彼此之间就可以完全不需要设防了，谁更值得交往和信任，还是需要你自己的判断，我只是说，星友内部之间的交往，会比社会上普通的两个陌生人之间要更容易一些。


    除了分辨之外，挑选也是一个很重要的能力。其关键点是底气拒绝。


    例如加盐公众号，有很多广告商找过来。有些会有各种苛刻的条件，或者我知道他是个割韭菜的东西，那么我就直接拒绝。因为我不靠这个活着。如此一来，我挑选出来的，可以合作的，都是相对更善，而不是更恶的交往对象。


    这里也涉及到一个很重要的点，就是我们在与别人打交道的时候，自己要坚决摈弃占便宜的心理。很多人就是因为觉得有便宜可占，而被别人骗了。那些被骗去做传销的、掉进套路贷的坑的、或者
    p2p 理财被割韭菜的，其就是因为有了占便宜的心理。也有一些刻意去寻找最低的价格，或者非要把别人的费用压到最低价格的人，也更容易遇到假冒伪劣产品，或者恶劣的服务态度。


    所以如果一直怀着一个要占便宜的心，上当受骗的几率会高得多，当然自己也就必须要时时刻刻对别人充满戒心了。只要能做到对这种天上掉馅饼的事情不动心，你在生活中遇到坏人的可能性就减少了一大半。


    - 其次是要有能力让你接触的人更愿意与你为善，而不愿或不敢对你为恶。


    这需要有自己能够实施正面激励或负面惩罚的能力。同样一个人，对待甲的时候是一个态度，对待乙的时候又是另一个态度，也许就是因为甲乙这方面的能力不同。


    这个能力和身份、地位有一定关系。毕竟，当你更有钱或更有权的时候，别人更容易对你笑脸相迎而不是恶语相向。


    但也不全是如此，你的为人处世如何，也有很大的决定性作用。有时候你的友善也许决定了别人对你的友善，例如货拉拉女乘客的例子，如果女孩能对司机友善一点（如说声不好意思久等了），或司机能对女孩友善一点（如搭把手帮个忙），也许悲剧都不会发生。


    也有时候你的正气凛然也决定了别人不敢对你为恶，例如在单位里别人欺负的都是那种三棍子打不出一个闷屁的，而那些有自己原则，敢于斗争的人，却没有人敢欺负。


    采取怎样的态度，没有一定之规，要看具体的情境而定。厉害的人可以根据不同的情境选择不同的应对方式，增加别人对自己善的动力，而减少对自己恶的可能。


    除了上面所说的外，更厉害的能力还有两点：


    - 一是选择大环境的能力，如果你有进入更高的圈子，享受更丰富的资源，或者到文明程度更高的地方去生活，你遇到善人的概率就会比遇到恶人的概率要高很多。

    - 二是成为让别人不得不对你善良的人的能力。好像是黄渤说过的一句话，原话我记不清了，大概意思是：在我成名之前，遇到了很多对自己不好的人，成名之后，遇到的就都是好人了。


    这句话太有道理。苏秦的嫂子是怎么对苏秦的？范进的岳父是怎么对范进的？这都能说明问题。一般来说，只要你在这个社会有了足够的影响力，不管是钱、权还是名，别人对你为善的可能性都会远远大于对你为恶的可能性。


    上面我用了很多“大概率”、“可能”、“或许”的字眼，其原因是，这样做是增加我们遇到善、远离恶的概率，而不是绝对意义上的只有善没有恶。我们没有办法永远不遇到坏人，只能说尽量减少他们在我们身边出现的概率。


    当你有了上面说的能力，你会发现，你遇到的人基本上都是好人，坏人越来越少，久而久之，你也就更愿意相信别人，愿意对别人好了。


    还是那句话，当你被这个世界爱着的时候，你也会愿意爱这个世界。


    所以，请努力去经营让世界爱你的能力吧。


    ## 短视频三国争霸


    最近对中国市场上三个最大的短视频产品——快手、抖音、微信短视频做了一点研究，觉得三个产品各自的发心、定位、侧重点都不一样，未来的发展方向可能也不一样。


    快手起步最早，其前身 GIF 快手 2011 年就有了，程一笑开创的。做短视频是从 2013 年开始，宿华当时加入，把 GIF 完全去掉了，把视频作为主要方向。


    由于宿华和程一笑的共同理念，是让普通人可以上网和可以分享，所以快手早期发展的关注核心，是创作者。


    产品的设计是考虑到知识层次不高的人怎么用着方便，记录真实生活的口号，也让这些人愿意上传视频，而不会觉得要精雕细琢才敢发，社区里友好的交流氛围也让这些草根创作者很受鼓舞。


    流量的分发更是向普通用户倾斜，而不是集中到头部用户。


    互联网的流量分布有一个特点，就是扎堆。大 V 和爆款内容可以随便就触及到百千万人，而小透明用户发的东西没人看。快手在流量分发的时候，让那些新用户、没几个粉丝的用户上传的视频，也能展示在众多观看者面前。对普通人来说这是第一次。


    所以快手就是这么起来的。尤其是 2014 年开通了一键分享功能后，在快手做视频，然后分享到腾讯微博、qq 空间，以及后来分享到微信等。快手也很克制，不在上面加任何
    logo、水印等。所以越来越多人愿意在快手上创作，分享到别处。


    抖音是第二个起家的，产品上线于 2016 年 9 月。张一鸣是抖音之父。此时，张已经做成了今日头条，也有内涵段子等爆款产品。他是用工业化大生产的方式来做产品的，会一下子推出一堆产品，灰度测试，快速迭代，哪一个跑出来了，就大力扶持。抖音就是这么出来的。


    抖音的特点是重视内容。其设置了几级分发机制，先是把视频丢到某个流量池，看其自然增长数据怎么样。如果不错，就再丢到大一点的流量池，帮助视频快速获得阅读量和点赞等。如果表现还是很好，就大规模推送，一下子形成全平台的爆款。抖音上那些几百万几千万点赞的视频，都是这么推出来的。


    所以，在抖音上，如果一个视频一出来数据增长就很好，那么抖音就会主动倾斜流量，让它曝光在更多用户面前。如果一出来数据不好，那就不用想了，后面也不会成为爆款。这里的马太效应非常明显。


    抖音的起家也是围绕优质内容。它不是请一堆明星，让明星来吸引流量，而是花钱到艺术院校或大学，请帅哥美女来拍视频。早期的抖音视频，男男女女颜值都非常高，和快手上的歪瓜裂枣形成了鲜明的对比。


    抖音的口号是“记录美好生活”，美则美矣，但是矫揉造作的痕迹就非常重，给人感觉就是太假。


    微信短视频是这两年才有的，起步可以说是最晚。其实从腾讯总体来讲，布局短视频并不晚，旗下的微视比快手略晚，比抖音要早。但是没有做起来，一度关停。后来看短视频是非布局不可的领域，才重新又启动，但现在也是不温不火。


    微信短视频是张小龙搞的。他对短视频的认知和宿华差不多，也是认为视频会替代文本，成为更便捷的表达方式。他希望短视频能成为每一个人都可以用上的一个工具。因为文字太考验人的功底了，不是每个人都会用。


    由于微信已经沉淀了这么大的社交关系，所以微信短视频的一个侧重点就是“关系”。大家看到微信短视频没有做什么推广，最初就是在微信的“发现”栏增加了一行而已，在“朋友圈”的下面，“扫一扫”的上面。这样在我们看朋友圈或用扫一扫的时候，自然而然就看到“视频号”三个字，还能看到自己的微信好友里面有谁赞过哪个视频。


    随着微信视频号的迭代，后来又增加了一些新的展示功能，例如可以直接发朋友圈和微信群，和公众号关联，添加到微信个人名片等等。


    所以我们可以看到，微信的短视频是基于社交关系来发展的。


    一句话总结就是：快手的 core 是创作者，抖音的核心是优质内容，微信短视频的核心是社交关系。


    这也体现在他们的产品页面上。快手点进去看到的是“发现”，让你看到那些创作者；抖音点进去是推荐，让你看到热门内容；微信短视频点进去看到的是“朋友”，让你看到你的朋友们都在看什么。


    当然，他们的一个共同点，是都用了算法推荐。平台会基于你的过往浏览记录，分析你喜欢看哪些内容，然后就不断地给你推相似的内容。


    算法推荐是平台发展的利器，但是也会引发很多问题。这不是本文的主旨，就暂时先不讲了。


    总之，当我们知道了三个平台最大的不同以及相同，你再去看看他们的发展理念，运营模式，打法，变现方式等，就都会有更深入的理解。


    ## 内向与心理能量


    我和马桶在一起办公，今天听到他和许姑娘在打电话。


    大概意思是许姑娘需要做一些事情，和人际交往有关，她有点犹豫，马桶就在那里鼓励她。


    马桶认为这件事情太容易不过了，但许姑娘却觉得其实挺难的。


    我听了一会儿，明白了问题的所在：这件事情，其实对于外向的人看来非常容易，但是对内向的人看来是很难的。


    因为做这事需要主动去跟陌生人交往，并且拉近关系。


    马桶是一个很外向的人，觉得这件事情如吃饭呼吸一般容易。但是许姑娘却是一个相对内向的姑娘，就会觉得这件事情非常之难。


    其实我特别理解许姑娘的恐惧。因为我自己就是一个超级内向的人。


    不瞒大家说，一直到读研究生的时候，我给陌生人打电话，都会手发抖、声音发颤。作为一个社交恐惧症的严重患者，我恨不得手机不要打电话的功能，只要短信就行了。所以直到今天，我的手机电话基本上都不接的，最希望别人给我发微信，而且是文字。


    在人际交往中，如果是在一个需要陌生社交的场合，我会感到浑身不自在。我到现在还记得当初工作时去参加一些大使馆的酒会，金融机构的讨论会什么的，在那种西方式社交场合的不习惯——如果那时候有人和我参加同一个会，就会看到一个愣头愣脑的傻小子，手里拎着一杯红酒，目光闪烁，一边探头探脑地想跟别人交往，另一边又缩手缩脚地不敢前进。


    这种情况一直到我后来当导游、记者以及在政府工作后很久才得以克服。它其实给我的工作和生活带来了很大的困扰。我个人认为，它应该让我在面对很多非常好的机会的时候，没有勇气去奋力抓住。或者说在一些需要表现的场合，由于我没有好好的表现，而使得在别人的眼中，我被大大的低估——哪怕直到现在，我所能够表现出来的我的能力与才华，跟我实际上可能拥有的能力与才华，都有很大的差距。


    当然，由于我内心强烈的向上的渴望，所以我即使是再害怕，在万不得已的场合也还是会鼓起勇气去做我特别不愿意做的事情，所以倒也有一些成绩。只是我自己心里知道，做这些事情有多么痛苦、多么困难。


    所以我打心眼儿里特别羡慕外向的人。


    去年我们一起做农业项目调研的时候，有一次本来是去旅游的，马桶说光旅游太浪费了，我们应该找一些合作社和种植大户做一些调研。


    我心想，这可怎么做呀？


    结果马桶说很简单呀，直接在百度上或高德地图上搜合作社，找到合作社、种植户、农机社的电话或地址，然后打电话过去约或直接上门就行了。


    我听了之后简直惊讶得眼珠子都快瞪出来了，原来这都可以？


    ——看到这里我相信外向的朋友们可能会觉得不可思议，这不是很简单的事情吗？有什么难的呢？其实在内向的人看来，这就是根本想都不会想到的一个做法。


    后来马桶很快就通过网上联系了一些人，让我们完成了一次高质量的调研。我简直对他佩服得五体投地。


    我现在当然已经是比以前要好了很多很多，但是毕竟内向和外向的思维模式都是不一样的，也还会继续主导着我的行为模式。所以我也特别欣慰我和马桶、御风两个相对外向的人能够在一起合作，形成互补。


    这里也需要和外向型的朋友们说一下：有些事情对我们来说，真的不像你们想象的那么简单。对于内向尤其是社交恐惧的人来说，去做外向型的人认为理所当然的那些事情，是需要极大的心理能量的。我们不是懒或者逃避责任，只是需要一些心理建设的时间以及更多的宽容、鼓励和支持。


    同时，我也要跟我一样内向型的朋友们说一声：其实大胆一点走出去，没什么。世界比我们想象的要友善得多，我们想象中的对方的可能的负面反应，往往都是错的。退一万步讲，就算是被拒绝，又有什么大不了呢？


    与大家共勉。


    ## 农业是一个好的方向吗


    最近一直在研究农业项目，遇到很多人问我们说，你们为什么要搞农业呢？农业能赚钱吗？农业有前途吗？


    确实，在大家的印象中，农业是个很苦、很土、很穷的行业。大的趋势都是人们从农业里逃离出来，而不是进入到农业里。真正进到农业领域创业的，也确实是大概率都是亏本的。


    但我们还是认为，农业是未来很多年非常值得投入的一个方向。


    首先从意义上来讲：


    农村相对于城市来讲，是萧条的；农业现在相对于工业、互联网等，是落后的；农业从业者相对于其他行业的从业者来说，是贫穷的。但这个萧条、落后、贫穷，不应该是永远的常态，而是应该需要有所改变。如果我们做的事情能够帮助农村更繁荣一点、农业更先进一点，农民更富裕一点，那就是值得的。


    其次从发展机遇来讲：


    农业的相对落后，反过来讲就是有很大的发展空间。科技会改变一切行业，但中国农业以往并不在此之列，农业是科技还没有渗透的最后一个空间。但这并不是长久的，农业正在、未来将更快地被科技改造，如种子、农药、化肥、农技的升级，耕种管收各环节的机械化、智能化、自动化，配套环节的冷链、物流现代化、进销存的
    IT 化，售卖环节的互联网化、大数据化等等。这里面每一点，都存在一个巨大的市场。


    前面我写到过的新疆棉农，就是一个很好的例子。他通过精细化管理，降低成本、提高产量和质量，种棉花都能赚到每年 150 万-200 万。这样的农民，收入已经比绝大多数城市白领都要高得多。


    我们调研中，很多地方的人直白地说，搞农业项目就是为了拿国家补贴。因为国家现在对农业补贴很高，基本上只要在种粮食或必要的植物，都会有相应的补贴，例如种水稻、棉花、蔬菜、蘑菇等，都有；建造与农业相关的工厂或配套服务，也有补贴，例如建造水稻烘干塔；购买农机一般是补贴
    30%-50%，如无人机、收割机等。所以有人说，如果没有国家补贴，95%的农业项目都是亏钱的。


    这里我不否认很多农业项目有可能会亏钱。但是，国家政策本身就是一个重大利好。国家希望农业有前途，农民有钱途，所以愿意大规模补贴，现在也有能力补贴。当然，作为创业者，如果一开始就奔着补贴去，那是不对的。但是也可以在某些项目的创业中，多一份底气和多一点风险抵御能力。


    随着中国经济实力的上升，中国人的消费能力正在快速提升，农产品一定会往高端化、品牌化走，而且消费者将越来越不重视价格，而是越来越重视质量，如健康、美味、快捷、新鲜、高颜值、文化内涵等等。从这个角度讲，所有的农产品可能都值得重做一遍。我们调研了很多地方，只要能真正做出好东西来，又懂一点营销的，基本上都很能赚钱。


    所以，我们认为，农业是大有前途的领域。当然，如果要进入的话，一定要选好方向，并且有足够的定力。毕竟，农业是回报周期相对较长，市场风险相对较大的一个领域。如果没有好的眼光，没有足够的耐心，没有吃苦的精神，没有风险控制意识，就会很难生存。反过来，如果有了上面这些，那么农业就是一块值得驰骋的大好天地。


