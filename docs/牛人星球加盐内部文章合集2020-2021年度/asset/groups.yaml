    # 经典尚需多温习


    最近用日常零碎时间在重看《西游记》书，发现自己的关注点完全不一样了。


    小时候只知道看猴子多厉害，看到打妖怪就开心，看到描写景物、人文的就跳过，看到长老哭哭啼啼就不耐烦。


    高中时看西游，却总会去玩味那些描人状物的诗词。每看到“但见那山……”、“你爷爷我……”、“我这神兵……”就觉得很有意思。


    例如这一段描写八戒来历的：


    ```

    那怪道： “是也不知我的手段！上前来站稳着，我说与你听。我——

    自小生来心性拙，贪闲爱懒无休歇。不曾养性与修真，混沌迷心熬日月。

    忽然闲里遇真仙，就把寒温坐下说。劝我回心莫堕凡，伤生造下无边孽。

    有朝大限命终时，八难三途悔不喋。听言意转要修行，闻语心回求妙诀。

    有缘立地拜为师，指示天关并地阙。得传九转大还丹，工夫昼夜无时辍。

    上至 topo 泥丸宫，下至脚板涌泉穴。周流肾水入华池，丹田补得温温热。

    婴儿姹女配阴阳，铅汞相投分日月。离龙坎虎用调和，灵龟吸尽金鱼血。

    三花聚顶得归根，五气朝元通透彻。功圆行满却飞升，天仙对对来迎接。

    朗然足下彩云生，身轻体健朝金阙。玉皇设宴会群仙，各分品级排班列。

    敕封元帅管天河，总督水兵称宪节。只因王母会蟠桃，开宴瑶池邀众客。

    那时酒醉意昏沉，东倒西歪乱搬泼。逞撞撞入广寒宫，风流仙子来相接。

    见他容貌挟人魂，旧日凡心难得灭。全无上上下尊卑，扯住嫦娥要陪歇。

    再三再四不依从，东躲西藏心不说。色胆大时叫似雷，险些震倒天关阙。

    纠察灵官奏玉皇，那日吾当命受挫。广寒围困不通风，进退无门难得脱。

    却被诸神拿住我，洒在心头还不怯。押赴灵霄见玉皇，依律问成该处决。

    多亏太白李金星，出班俯囟亲言说。改刑重责二千锤，肉绽皮开骨将折。

    放生遭贬出天关，福陵山下农家业。我因有罪错投胎，俗名唤做猪刚鬣。 ”

    ```


    上面这段说辞，把八戒的经历说得特别清楚，尤其是那些如何修仙的名词，怎么调戏嫦娥的细节等等，都描写清楚了，这些光看正文是看不到的。正'
  - '[PAGE 118]


    文里只会写到“只因醉酒调戏了嫦娥”，而不会写他扯住嫦娥，要嫦娥陪睡，嫦娥再三再四地不依从等等。


    此外，大学时看西游，会发现原来八戒的幽默不仅是穷货的好玩，而且也有言语机锋的智慧。


    例如有一回唐僧被某个水怪抓了去。猪八戒哭哭啼啼地回到寄宿的庄子上，庄上的人问“怎么只见你们回来，三藏老爷呢？”八戒回复道：“不叫三藏了，改名叫陈到底也。”（唐僧俗名姓陈）记得我当时因为“陈到底”三个字，回味了很久。又如福禄寿三星到五庄观，八戒插科打诨，言语行动均妙不可言，那可不是一个呆子能说出来、干出来的。


    当然，高中大学时看，还有一个关注重点是关于“真真、爱爱、怜怜”、“女儿国王”、“蜘蛛精”这些片段。这估计是所有青春期性苦闷男孩的共同点。


    现在重看，就发现注意力都变了。


    我会发现，那些描写当时的礼仪、司法、风土人情这些的文字，特别有意思。


    例如妖精之间也讲礼法，互相见面如何行礼，是跪拜还是唱喏，口中是怎样的谦辞。如果是写信的话，更是好玩。例如黑水河的鼍精抓了唐僧，要请他舅舅一起来吃唐僧肉，信是这样写的——


    > “愚甥颚洁，顿首百拜，启上二舅爷敝老人台台下：向承佳惠，感感。今因获得二物，乃东土僧人，实为世间之罕物。甥不敢自用。因念舅爷圣诞在迩，特设菲筵，预祝千寿。万望车驾速临是荷！"


    又如悟空和八戒夜闯乌鸡国御花园，悟空大呼小叫，八戒吓得扯住悟空说：


    > “哥呀，害杀我也！那见做贼的乱嚷，似这般吆喝！惊醒了人，把我们拿住，发到官司，就不该死罪，也要解回原籍充军。”


    上面这样涉及司法的言论还有不少。有时候一个恶狠狠妖精对悟空说，“你怎么就敢打破我的洞门？你这样是犯法的，小心问你个充军之罪”，让人感觉非常违和。'
  - '[PAGE 119]


    另外就是，很多以前没有注意到，或者看不懂的细节，现在是第一次注意到。


    例如，黎山老母戏耍猪八戒，说有真真爱爱怜怜三个女儿要嫁给他们三徒弟。猪八戒说，都嫁给我一个人得了，其中有这么一句：“我幼年间，也曾学得个熬战之法，管情一个个伏待得他欢喜。”


    像这样的话，以前看到也不明白是什么意思。现在才知道，原来吴承恩也是个老司机。


    还有一处，乌鸡国国王死后，被悟空用仙丹救活，但是还没有反应，唐僧说，需要给他度一口气，于是悟空就给国王做人工呼吸。


    看到此处，我就会感叹，原来古人也知道人工呼吸，看吴承恩的描述，至少这种救人方法在明代应该是常识。


    还有很多类似上面的有趣的地方，这里就不一一记述了。总体感觉是，经典真是常读常新，接下来还要继续把以前读过的一些经典说重新读一遍，不能总是贪新。'
  - '[PAGE 120]


    # 头条和拼多多之后，还差一个新的社交方式


    第一代中国互联网巨头以百度、阿里和腾讯为代表。他们运作的模式是：先建立一个集中式的超级大脑，然后用户到里面去寻找自己想要的东西。百度建立的是集中所有信息的超级大脑，用户在里面找信息。阿里建立的是集中所有商品的超级大脑，用户在里面找商品。腾讯建立的是集中所有人员的超级大脑，用户在里面找人员。


    在移动互联、移动社交和大数据时代，以分布式网络下的大数据分析和人工智能推荐为主要特色的新模式出现了。


    字节跳动颠覆了百度。他不是先把信息储存在图书馆里，由用户去找，而是先用算法发现用户想要什么信息，再由人工智能把信息推给用户。


    所以在今日头条和抖音上，我们不是去搜索想看什么信息，而是直接打开APP 就开始阅览文章或者观赏视频。AI 已经研究了我，它会主动把我想要的东西拿过来。


    拼多多颠覆了淘宝。他不是先把商品陈列在货架上，由用户去找，而是由用户的朋友在微信里向用户推荐货品，或者在 APP 上由算法发现用户想要什么货品，然后推荐给用户什么货品。


    所以我们使用拼多多，起初并不是打开拼多多的 APP 开始搜索，而是因为 在微信里收到朋友发来的拼团链接；当使用 APP 以后，我们主要也不是搜索，而是像刷抖音一样往下滑，滑到自己想要的东西就买了。


    张一鸣和黄峥都是程序员出身，都是很早就从事信息分发 的研究。张一鸣创业初期就想明白了，未来是人工智能分发信息的时代，所以从今日头条上线，就采用了大数据+人工智能的路子。黄峥大学和研究生都是做数据挖掘和人工智能的，创立拼多多就是也用的这两个路子。


    今天的字节跳动早已超越了百度，拼多多离超过淘宝也已相差不远。即便它们可能无法完全取代他们的传统对手，但起码他们开辟了新的天地，并且在新天地他无比迅猛崛起。


    而且不像美团要经历千团大战、滴滴要经历打车大战才能成为行业霸主，字节跳动和拼多多，都是横空出世、唯我独尊的崛起。他们不是在一个人潮汹涌'
  - '[PAGE 121]


    涌的红海里鏖战，而是乘着大铁船穿越虫洞去到了 1628 年的临高，独自拥有了一片时空。


    信息、商品、人，是网络上最重要的三个东西，在传统互联网时代分别催生了百度、阿里、腾讯三大巨头，在移动互联网时代已经催生了字节跳动、拼多多两大巨头。


    现在关于人，还是空白的。微信算是和字节的以及拼多多的同类吗？我觉得还不是。应该有一个全新的，与字节和拼多多一样，基于分布式网络、大数据和人工智能推荐的新鲜事物出来。


    这个新鲜事物，才是未来可能颠覆腾讯的社交之王。'
