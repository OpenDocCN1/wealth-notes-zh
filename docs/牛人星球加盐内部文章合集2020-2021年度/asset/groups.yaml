    # 葡萄与初心


    家附近的水果店，有两种葡萄。一种售价 19.9 元/斤，味道非常甜；另一种售价 3.9 元/斤，味道一般般。


    我每次去，都会特意选 19.9 的那种。家里老人每次去，都会买 3.9 的那种。


    结果，19.9 的葡萄，总是很快被吃光，而 3.9 的那种，往往能放四五天都还没吃完。


    我相信，咱们很多人的父母，应该都是会习惯性地买 3.9 的那种吧。


    对他们那个年代成长起来的人来说，由于长时间的物资匮乏，所以享受不是第一位的，省钱才是第一位的。去买水果，第一个想到的是要便宜，而不是好吃；买其他东西，也是第一个想到省钱，而不是好用。


    但我认为，时代不一样了，我们的心态应该扭转过来。


    我们去买一个东西，实际买的不是那个东西本身，而是它能够带来的效用。


    我买一个电钻，不是要电钻，而是要墙上的那个孔。我买一个苹果，不是要苹果，而是要苹果的营养、美味或填饱肚子。我买一个咨询公司的服务，不是要咨询项目，而是要我的企业经营管理的改善。


    具体到葡萄，我们去买的时候，想要的究竟是什么呢？


    其实就是为了买“美味”。


    所以我们该不该买，该买哪种，不应该让价钱来定，而应该让美味和价钱的综合来决定。


    一种葡萄不好吃，那么哪怕只卖一分钱，都太贵了。而如果它非常好吃，卖贵一点也可以接受——如果真正经济条件一般，不应该是去为了省钱而买不好吃的葡萄，而应该把买普通葡萄的钱，拿去买少量更好吃的葡萄。


    因为，你要的是“美味”，而不是“葡萄”。


    “美味”就是你初心，“葡萄”是表象。当你能突破葡萄的表象，专注于美味的初心，这才叫“不忘初心”。'
  - '[PAGE 112]


    当你突破表象的禁锢，一眼看透本质，想明白自己真正想要什么时，你的人生抉择，就会理性得多。


    你谈恋爱，不是为了一個对象，而是为了爱与互相扶持。


    你上大學，不是为了一个学位，而是为了获得进入人生下一阶段的阅历和知识。


    你找工作，不是为了一份工作，而是为了工作带来的薪水和事业成就感。


    如果没有了后面那ー半，前面的就毫无意义。


    所以，当你决定要去做ー件什め事的时候，不妨在心里多问自己ー句：我做这件事，目的是为了什么？


    千万不要为了省点钱，买了酸葡萄，忘记了自己原来想要的，是美味。'
  - '[PAGE 113]


    # 媒体的立场


    很多中国人都经历过这样的心路历程：小时候，对官僚宣传的东西很相信；长大了一点，知道了媒体的宣传属性，又加上西方理念的影响，又会对官僚报道的东西持怀疑的态度，认为西方媒体才是客观公正的；再成熟一点，才知道，原来西方媒体也都是各有各的立场，哪怕是号称最客观公正的媒体，都会刻意去筛选信息，试图影响读者对某些事物的看法。


    下面的三张照片，分别出自香港媒体、大陆媒体和日本媒体，拍的都是同一个人，但是各自的立场一目了然：香港媒体拍得文艺唯美，目的是美化；大陆媒体拍得土味十足，目的是丑化；日本媒体则纯粹是一种吃瓜娱乐的心态，选取了最能抓人眼球的角度。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_113_0.png)


    都说眼见为实。这三张照片都是眼见，哪一张才是“实”呢？


    只能说，都是事实。但是不同的媒体，为了不同的目的，而刻意选择了突出某一个侧面。而读者，在不知不觉中就被媒体影响了。


    香港的大部分读者，只能看到第一类照片，自然认为那谁是一个悲情英雄。加上持同样立场的文字渲染，他们会无限同情该人及其代表的群体。而大陆的大部分读者，只能看到第二类照片，加上持同样立场的文字渲染，自然认为那谁是一个意图不轨的小丑，他们会无限厌恶该人及其代表的群体。


    于是，互相认为对方被洗脑，是傻×。


    有人可能认为，大陆有管制，只能看到第二张图片；香港或国外没有管制，都可以看见，所以他们的更客观。实际上，这是不了解媒体传播背后的操纵力量。媒体的传播不是自然状态，其背后都是资本和政治的角力。'
  - '[PAGE 114]


    在香港，绝大多数人是看不到第二类照片的。他们虽然拥有理论上的可能，但在实际的操作中，素材采集、文章出版、渠道宣发、网页展示，都是资本和政治在背后控制，第二类照片根本就推送不到大多数读者面前。


    在美国同样如此。支持中国的声音不是没有，但是绝大多数读者是看不到的。媒体发行的渠道，网络展示的出口，都被反对中国的声音占领了，支持中国的根本就走不到大多数读者的手机上。


    移动互联时代的“信息茧房”更是加剧了这种现象。一方面，我们选择关注谁，自动就屏蔽掉了反面的声音。另一方面，现在的智能推荐，只会推送你喜欢看到的信息，其他的信息会自动避开你。


    人类信息生产和传播的技术越来越强，但是接受信息和分辨信息的能力却越来越弱，不能不说是一种悲哀。


    我们无法改变规律，只能改变自己的行为。作为读者，我们应该主动去接收多方面的信息，对事物的判断才能更加全面一点，也就不会被某一方可以选择的信息洗脑了。


    如果选择多方面的信息，我在这篇文章里写了一些方法，在此就不赘述。大家可以点进去看一看。'
  - '[PAGE 115]


    # 自己挖的坑，流着泪也要填好


    这次出版《持续进化》，由于是自己的书第一次正式出版，心里还是很开心的，就在星友群发起了帮大家写祝福语和签名的预购登记活动。


    本来也有心理准备，知道这样会给自己带来巨大的工作量，因为要征集每个人不同的祝福语，要写下来，要收款与核对，要逐一快递寄送。可能对于做惯电商或者有相应的系统和平台的人来说，这些都很简单，但是对我而言这些都是陌生的。


    只是，心里怀着一份希望对星友们再好一点的心思，觉得愿意为大家做这些。


    可万万没想到，真正做起来，工作量大还是远超之前的想象。


    在处理星友们预定的书之前，我先在出版社签名了 500 本书（只有“何加盐”三个字的版本），这些是准备在网上卖的作者签名版。


    第一次看到 500 本书摞在一起的时候，我直接惊呆了。我从来没没想到，500本书能有这么多。没有实地看到之前，自己是没有概念的。


    出版社特别安排了两个人来帮忙。一个帮我翻到签名页好让我签名，另一个帮忙把签好的书整理好。


    就这样，我们三个人通力合作，而且我每本书只要写三个字，都用了整整一个小时，写得我手酸脚麻，头晕脑胀。


    我这才知道，原来为了给星友一份福利，我给自己挖了这么大一个坑。


    昨晚出差回来，没来得及陪孩子玩，就先去弄星友祝福版。本来想是大家登记的预购信息先打印出来，逐一核对。结果家里的打印机又坏了，老是卡纸。只好对着电脑上的电子版核对。


    搞了一晚上，最后才签了几十本。照这样下去，全部搞完，真得一个多月星期。


    不过，看着星友群大家的热情，我又觉得，付出这么一点时间和精力，是万分值得的。大家这么支持我，我为大家做这么一点小事，苦点累点又算得了什么呢？'
