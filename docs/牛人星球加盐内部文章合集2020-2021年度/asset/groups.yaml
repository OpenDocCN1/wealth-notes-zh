    ![](img/bb7f05e15297f9576e6f7ae0459eba13_101_1.png)'
  - '[PAGE 102]


    # 我错过的财务自由


    理想汽车前不久上市了，现在市值约为 140 亿美元。这是李想创业的第三家公司，也是他做到上市和成为百亿美元的第二家公司。


    作为一个曾经在文章里非常看好李想和理想的作者，理想能上市，我当然为自己的眼光被印证而高兴，同时又夹杂着些许的遗憾。


    去年我曾经有机会加入理想汽车。


    当时，写完关于李想的文章后，觉得这是一个不错的老板，理想汽车是一家不错的创业公司，未来可能有很大的发展空间，于是设想如果自己也加入会怎么样？


    由于我那篇文章在理想汽车内部也引起了不小的反响，所以他们的人也知道我。一位负责市场的 VP 和一位负责组织发展的高级总监都对我感兴趣，于是我就到北京去面谈。


    当时谈得非常好，但是我提出的薪资要求让他们犯了难。我要求的是**万年薪+期权，具体数字就不透露了，反正对方听了后，就说别的都没问题，但是这个薪资要求估计有些麻烦。


    但是由于种种原因，我没有在薪资上让步，也没有积极去争取这个机会，心里总觉得你们接受也好，不接受也罢，我都无所谓。最后求职的事情不了了之。


    今天看到理想汽车的上市以及这么高的市值，说心中没有任何触动，那是不可能的，毕竟，曾经的一个很好的机会放在手边，我并没有去珍惜。如果当时我想要加入理想汽车的决心非常坚决，态度非常诚恳，大概率我现在已经在理想汽车工作，并且拥有一些股票了。


    但是另一方面，这种触动，或者说遗憾，其实也非常轻微，只不过是在脑海里一闪而过，我便笑笑释然了。


    当时之所以没有很坚决、很诚恳，主要原因还是自己心里没有完全想好，毕竟“何加盐”公众号已经在蒸蒸日上，而且加入理想汽车就要抛妻弃子去北京工作，所以心里其实犹豫的情绪居多。这样三心二意，失败也就非常正常。'
  - '[PAGE 103]


    这一年来，我自己又成长了很多，心境也完全和去年不同。去年没想清楚的很多东西，今年已经想得比较清楚。如我自己未来的梦想是什么，我要做些什么事情等等，去年还是一团混沌，今年就渐渐清晰。


    如果换做今年，我就不会做出去理想汽车求职这样的事情。对一家公司和一个创业者的欣赏是一回事，但是加入他们是另一回事。我当时想要加入，只不过是看到一个机会，却没有想自己的人生战略和事业信念是什么，也就是说，当时还是机会驱动型。


    而现在，我更看重的是做什么事情能实现自己的梦想，怎样能够按照自己的价值观去生活。


    从这个角度讲，当时错过那个机会，对我反而是好事。毕竟，我更喜欢的是现在的状态。'
  - '[PAGE 104]


    # **我为什么不蹭张一鸣的热点？**


    对自媒体来说，热点事件是做大流量的好时机。尤其是碰到和你写作领域密切相关的热点，非常容易获得“出圈”的效果，快速吸引新的用户。所以这也是为什么自媒体那么热衷于追热点。


    对我个人而言，一般不会去追社会热点。不过，如果是我已经写过或者将要写的人里面，刚好出现了被社会高度关注的事情，我也不排斥利用这个热度重新推一下文章或者专门写一篇。


    也就是说，我对热点不会去为追而追，而是随缘利用。所以我的写作大体上都是自己去安排，不会跟着社会舆论的动向走。


    这一次美国搞 TikTok，引起了网上的高度关注，大家很关心张一鸣和字节的跳动会怎么做。公众号和今日头条也出现大量关于此事的文章，阅读量数据都很不错。


    关于此事的评论大体上有这么几种，一种是认为字节跳动跑得太快。大家挖出张一鸣几年前的言论，认为他是一个崇洋媚外的人，认为此次他们都不反抗就投降了。另一种是认为字节跳动这样做自有其道理，网民不知道内幕，在那里瞎起哄。还有一种是认为美国这么做自有其道理，你中国不是也没有让美国的一些公司进来嘛，现在你的公司被人家搞是活该。


    这里我们不评论上面这些观点的是非对错。只是说，如果从热点写作来看，这个时候写张一鸣和字节跳动，是能够天然吸引流量的。按照“职业化写作”的要求，应该写。


    况且，我和字节跳动还有一些过节。此前我写的文章里评论过今日头条和抖音对社会的负面影响，被他们投诉。现在也还处于和他们正式的司法诉讼过程之中。如果我结合自身经历写一写字节跳动和张一鸣的负面，是非常容易获得十万加的。


    但是，从 TikTok 的事件发生以来，我一直都没有任何一点要落井下石的冲动，反而觉得为一鸣和字节感到非常惋惜，也深刻同情他们的遭遇。


    “兄弟阋于墙，外御其侮”。我和字节之间的矛盾，是人民内部矛盾。但是字节被别人搞，这是敌我矛盾，是一个外部势力利用其霸权欺压中国人，掠夺'
  - '[PAGE 105]


    中国公司。在这样的情况下，我不会去参与对一鸣和字节的批判，做亲者痛仇者快的事情。


    此前我写过《张一鸣和他的流量帝国》一文，其中认为，张一鸣开创了“移动互联网时代的大工业生产模式”，假以时日，字节跳动将成长为可以比肩阿里和腾讯的大公司。今天我依然这么认为。


    字节跳动是中国互联网企业出海做得最好的。它在美国的存在，对中国来说意义非常重大。它的作用，其实远远超过我们的想象。它和美国的交锋，也远远超过我们的想象。这个事情的很多内幕，是永远不会被公开讨论的。


    字节今天被美国人搞，其内核是悲壮的。未来的历史会记录张一鸣和字节跳动的功绩。我希望一鸣能够挺住，字节能够挺住。'
  - '[PAGE 106]


    # 我也曾是留守儿童


    最近网上热传湖南留守女孩钟芳蓉考上北京大学，选择了考古系的新闻。我看了很是感慨。


    留守儿童，是指那些因父母在外地打工而被留在农村，由父母之外的其他亲属照顾的儿童。


    在我们的印象中，留守儿童往往和“可怜”、“悲惨”这些词联系在一起。


    一方面，留守儿童的父母无法长期陪伴他们，让他们会经历一定程度的父爱/母爱缺失，让人感觉很可怜。另一方面，他们多是和祖辈生活在一起，由于老人更倾向于宠孩子，也由于缺乏父母的陪伴和教育，他们又容易产生这种那种心理问题。有些孩子甚至成为问题儿童。


    我以前看到此类新闻，是一种旁观者的视角看的，没觉得和我有什么关系。有一天突然惊觉，原来我小时候也是留守儿童。


    在我很小的时候，爸爸就一直在外面打工，一年都难得回来一趟。印象中有好些年，过年他都无法回来。都是妈妈带着我和妹妹过日子。


    大概上到四五年级的时候，由于家里经济状况实在是紧张，妈妈也出去打工了。我和妹妹就跟奶奶过。


    所以，我和妹妹是正宗的留守儿童。


    不过，回想起当初成长的日子，我倒也没有特别多觉得自己多可怜的时候。农村的孩子，每天只知道疯玩，根本就不会去想爸爸妈妈没在身边，我有多悲惨。


    也可能是因为奶奶把我们照顾得很好，没有让我们感受到生活中缺少爱。


    从心理健康的角度，我也没觉得受到多大影响，更没有成为问题少年。在家里，我是快乐少年，在学校，我是乖孩子。妹妹的内心我不知道有没有受到过什么影响，不过看起来应该没有。


    也许正是因为自己的留守经历没有留下什么创伤，所以长大后看到类似的新闻，我竟然在很长时间里都没有意识到，原来自己身上也贴着留守儿童的标签。而是有一种旁观的疏离感。'
  - '[PAGE 107]


    从个人的成长经历，我认为，有时候人们可能会过度“共情”。很多留守儿童其实并没有想象中的那么悲惨。他们虽然没有和爸爸妈妈住在一起，但是爷爷奶奶或外公外婆，对他们也非常好，缺爱的情况不敢说没有，但应该是极少数。


    而且，孩童的天性就是爱玩。孩子们每天快乐玩耍还来不及，哪有那么多空去悲悲切切地思念爸爸，思念妈妈。


    更何况，现代社会通讯极度发达，留守儿童每天都可以通过微信和父母聊天，不像我们当年，唯一的通信方式就是一年写几封信。而且现在的高铁也方便，见面更容易了。


    至于会不会有心理影响，甚至成为问题少年。我认为，还是要看个人。


    同样的环境中成长起来的孩子，有的就可以成才，有的就出问题，那么就不能去责怪环境。这几十年来，在城市打工的农民工数以亿计，绝大多数农民工的孩子并没有成为问题少年。相反，有很多也考上大学，成为社会栋梁之才。其中甚至有像钟芳蓉一样争气的孩子。


    我认为，虽然环境不是自己选择，但是面对环境的态度可以选择。我庆幸当时虽然身为留守儿童，但是也快乐地成长起来，并且学有所成，没让奶奶，爸爸妈妈，更没让自己失望。'
  - '[PAGE 108]


    # 何加盐对谈洁柔纸巾董事长邓颖忠


    今天在中顺洁柔公司专访董事长邓颖忠，颇有感慨，特记之。由于绝大多数朋友可能没有听说过中顺洁柔这个词，但是应该都听说过洁柔纸巾，所以用“洁柔纸巾”以代之。以下简称洁柔。


    邓颖忠出生于 1951 年，由于祖上也是属于“曾经阔过”的，所以小时候颇受过一些苦头。7 岁时，爸爸去世了，妈妈带着他们三兄弟艰难过活。


    妈妈也曾经是阔小姐。她的爸爸早年在美国开农场，赚了很多钱，所以她得以上学，还成为了五四青年，会讲一口流利的英语。但是自从丈夫去世后，在当时的时局下，她的所学不仅无法给家里带来帮助，反而带来了麻烦。所以他们的生活可想而知。


    邓颖忠从 8 岁就开始一边上学一边放牛，回家还要帮忙做饭洗衣，生活很苦。当时他听了一个类似田螺姑娘的故事，只不过故事的女主角变成了一张仙女画。邓颖忠就特别憧憬，“如果我也有一个仙女从画上跳出来帮我，那该多好”。于是他特地攒了很久的零花钱，买了一张仙女画挂在墙上。结果盼了好多天都没有仙女跳出来帮他做饭洗衣。


    从那以后，邓颖忠悟出一个道理，靠仙女是没指望的，只能靠自己努力。再稍长一点，他家送不起三个小孩读书了，必须有一个辍学回家挣工分才能养家。由于哥哥们成绩都很好，邓颖忠主动提出他辍学。


    小小年纪，邓颖忠成为一名放鸭子的孩子。他独自一人住在流溪河的一个江心岛上，看守着几百只鸭子。


    当时正值大家都挨饿的时候。邓颖忠因祸得福，由于鸭场常有病死的鸭子和破裂的鸭蛋，按照规定这些可以由邓颖忠自由处理。所以他在长身体的时候，还能幸运地经常吃到鸭子。也幸运地没有被病死的鸭子感染上什么病毒。


    有时候，村里放电影，邓颖忠便会一个人游过几百米宽，水流湍急的江面去看电影。长大以后，他想起这段经历，就会心有余悸，心想自己命真大，经常干这么危险的事，居然都没有死掉。'
