    ## 创造财富与分配财富


    赚钱有两种方式，一种是创造新的财富，一种是分配旧的财富。


    所谓创造新的财富，是你通过制造对人类有价值的新产品，或者通过技术改进、模式创新等方法提高生产效率、降低生产成本，使这个社会的总财富增加了。


    这个财富有可能是实物，也有可能是无实体的效用（例如带来快乐、增加健康等）。


    例如，北大荒的农民生产出粮食，富士康的工人装配出手机，作家写出了新的好文章等等。


    所谓分配旧的财富，是你并不生产对人类有价值的东西，只不过是通过你所占有的优势地位，或者利用人性的弱点，把别人的财富转移到你那里。


    例如，通过行贿手段拿到一个本属于全民的煤矿，然后挖煤赚钱；利用人的贪婪、恐惧等心理或人的愚昧，而精心设计的“割韭菜”、“收智商税”产品等。


    有些企业/产品是综合型的，其中有创造财富的成分，也有分配财富的成分。


    例如，微软创造了 Windows，这是极大的创造财富。但是它通过 Windows 垄断市场后，把本来没有多少生产成本的产品卖出高价，获取高额利润，后面一部分就属于分配财富了。


    又如，史玉柱生产的脑白金、杜国楹打造的小罐茶，他们本身也都是有产品，有效用，但是产品的真正效用在其价格面前占的比重很小，其利润主要是来自财富的重新分配——也就是把钱从消费者那里转移到商家这里。


    更离谱的是像某某某某滴眼液和某某某药酒这种，号称可以治什么病，但实际上根本没有任何效果，纯粹就是骗钱，这就不创造任何社会财富，而只是把钱从这家转移到那家。


    另外一种典型就是传销，其终端的产品或许有一点价值，但是消费者付出的成本远远超过产品价值，随着金字塔层层往上，财富从消费者转移到一级一级的代理，最终转移到传销头子那里。


    每一个创业者，都需要思考一下，自己的产品/公司，是为世界创造财富，还是只是来重新分配一下财富。


    现代社会，对商人比较宽容了，只要能赚到钱，就能得到人们的羡慕和欢呼。


    但是从整体来看，这样的企业是没有价值的；从长远来看，这样的企业家是受人唾弃的。


    凡是伟大的企业家和伟大的企业，无不是为社会创造了新的价值，而不仅仅满足于把别人的钱放到自己口袋里。


    那天在极飞和彭斌谈到这个问题。他说，我要做的就是创造价值的事情，而不是重新分配价值。


    我说：俺也一样。


    ## 梦想与魄力


    我曾经在体制内待过 10 年。据我观察，没有哪一个公务员不曾想过：如果我跳出体制会怎样？


    或多或少，我们都会梦想有另一种可能。只不过由于种种原因，大部分人只能一声叹息，把这个梦想埋藏在心里，继续沿着原来的路走下去。只有很少的人，愿意跳出来试一试。


    最近因为调研，我接触了很多农业口的公务员。昨天认识的一位，很令我感慨。


    他是一个 80 后，已经在体制内做到局长（正处级），在地方上，这已经是很不错的位置了。我们和他聊项目，发现他对创业、对互联网、对农业都特别懂。这种懂不是作为学者或者主管官员的那种懂，而是像一个曾经在这领域创过业的人那样懂。例如，项目可以有哪些方向，每个方向的商业模式是什么，可能会存在哪些坑，关键要解决什么问题，线上和线下的推广有哪些方式等等。


    我们都觉得很奇怪，问，你为什么一会懂这么多、这么深呢？


    他说，这些都是我曾经考虑过的创业项目。


    原来，这位朋友虽然少年得志，但是也有一颗不安于现状的心，很想在创业上折腾一点什么。


    但是这么多年来，总是停留在想法，或者很小范围的尝试，而没有敢破釜沉舟地出来干。从二十多岁，一路走到现在快四十，体制内职位倒是越升越高，但是心中的梦想却越来越远。


    我觉得，其实这位朋友挺可惜的。因为他的学识、眼光、思考深度、学习能力都很强，如果出来干点事，成功的几率还是很高的。未必是自己一个人单打独斗地创业，哪怕是跟人合伙，或者是加入企业，凭他的能力水平，做得都不会差，至少不会比在体制内当一个处长差。


    他缺就缺在“魄力”两个字。总舍不得体制内的安逸和保障，每次把项目想得挺好，研究得很透，却总是下不决心跳进海。


    古往今来，一个人想要做一番事业，魄力两个字是必不可少的。一个人再聪明，能力再强，但是不能决断，没有魄力的话，依然会一事无成。


    我们看《资治通鉴》，会发现一个历史人物如果“好谋而无断”、“多谋寡断”，就可以肯定这个人的结局不会太好。而另外一些人，也许能力差一些、智慧少一些，但是有冲劲，敢干事，反而能够成功。


    “决断”是非常重要的种能力。人生的很多关键时刻，就是需要决断。缺乏决断的人，也许可以安稳地过一生，但他一定会有很多遗憾。而决断的人，也许会错，也许会失败，但是不会给人生留下遗憾。


    ## 也谈复利


    最近有一篇文章挺火的，叫做《复利的谎言》，作者“老喻”，首发于“孤独大脑”公众号。


    文章厘清了一些关于复利的错误理解，很有启发。


    但是我看到也有人因此对复利本身的意义也产生了怀疑，认为那些让人们在事业、投资、生活、成长中重视复利效应的文章是忽悠。


    我对投资不是很懂。但是对于人生成长有较多的研究，可以说一说我的观点。


    我认为：复利，是追求成长和成功的人特别应该注意的一个概念。如果能够真正理解复利，用好复利，人生会大有不同。


    复利对我们的启发，主要是以下几个：


    - 要有信心。知道人是可以进化的。

    - 要努力。争取每天进步一点点。

    - 要有耐心。知道效果都是很长时间才能出来的。


    如果能够做到这三点，其实就能充分享受到复利在人生成长过程中的效果了。


    老喻的文章，其实并没有否认这些，而只是更深入地阐述了一些细节，明确了一些前提。例如，进化的速度是不均匀的，有可能很长时间没有进步，但是另一个时间却突飞猛进；进化的方向要正确，否则做得越多错得越多；进化的结果不是确定的，而是或然，运气占有很大的成分。


    这些都是对如何应用复利原理非常好的说明，而不是否定复利原理。


    今天在思考这个问题时，正好看到了一则非常鼓舞人心的新闻：谷歌旗下的 AlphaFold（与 AlphaGo 是同一家公司开发的不同应用）在预测“蛋白质折叠结构”方面取得突破性进展。这可能会带来一场新的生物学革命。


    这里面的 AlphaFold 和之前下围棋的 AlphaGo 一样，都是深度学习的人工智能，就是每天不断地自主学习、进步，然后逐渐具有了超高的智能。


    这种深度学习之下取得的效果，实际上就是人在努力之下取得成功的一种很好的比拟。从广义上来讲，就是复利效应的体现。


    ## 史玉柱的选择


    之前写《看不透的曹德旺》时，我曾经写过，每个企业家都是复杂的，不能用简单的一面去定义。


    很多人和我谈过这篇文章，说是第一次看到这种写法：一篇文章不是在夸一个人，也不是在损一个人，而是真实地把一个人的若干面都展现出来。


    我写的时候倒没有太大感觉，听大家说得多了，才去注意了一下，可能对复杂的接受和阐述，正是何加盐文章和别人文章不同的一个特点吧。


    最近在研究史玉柱，更是深刻感受到人的这种复杂。


    史玉柱少年天才，以全县第一的成绩考进浙大数学系，当时的理想是当陈景润。后来见识到了真正的天才，也发现自己对数学并不那么喜爱，就去安徽省统计局当了公务员。当公务员最大的理想，是成为处长，但是因一个偶然机会，到深圳大学读了研究生，被深圳改革开放的氛围感染，开始创业。


    他凭借自己没日没夜开发出来的一款软件，只用了 4 个月时间，就从一无所有，成为百万富翁。要知道，那还是 80 年代。


    后来，他的巨人公司很快成长为年收入过亿的企业，开始了多元化之路，并开建巨人大厦。


    此时的史玉柱，觉得自己无所不能，干啥都能成功。业务从软件拓展到硬件，又做保健品、服装、药品。巨人大厦原定盖 18 层，后来脑子一热再热，一路增加到 88 层。最终，因为盖楼的资金不够，巨人集团轰然倒塌，账上从拥有两个亿现金，一下子变为欠债
    2.5 亿。


    经受这次打击，史玉柱差点走上自杀的绝路，很长时间才缓过劲来。


    后来，他不再贪大，而是开始走最保守的路，借了 50 万元，从一个县卖脑白金开始，重新开始创业，最终凭借脑白金的成功而东山再起。


    再后来，他又做了游戏公司，也开始介入投资行业。


    从重新崛起之后，他再也没有失败过，做的所有事情，全都成功了。


    说实话，我此前对史玉柱了解不多，看法持两面：对他的商业才华和抗挫折能力，是很佩服的，但是对他的人品和情怀，不大看得起。因为在我的认知中，脑白金就是个智商税的产品：游戏虽然赚钱，但是社会价值有多大也很难说。所以我一直认为他虽然赚了很多钱，但只是一个让人佩服的人，而不是让人尊敬的人。


    最近了解多了一些后，对他的看法起了一些变化。最主要的促发点是两个：一是他的担当；二是他的坦诚。


    从担当来说，当时他欠债 2.5 亿，是公司债务，法律上来讲，让公司破产就行了，不需要他个人承担。但是他在做脑白金有钱之后，第一时间就先把这些钱全部还清了。在公司内部，巨人集团出现危机后，当时愿意跟着他的人，还有一百多人，他做脑白金，首先也是为了存活下来，给这一百多人发工资。


    从坦诚上来讲，他在各种场合，都是做本真的自己，不做作，不掩藏。日后对当初出事的反思，都归过与自己，认为自己太狂妄，不懂事，不尊重员工的人格，对员工苛刻，对营销的理解不到位，管理上不在行等等，而没有那种“此天亡我也，非战之罪”的感觉。


    这两点对我还是很触动的。虽然说我依然认为，凭他的才能，不管做脑白金还是游戏，都有些可惜，他本来应该可以做出对社会更大的贡献（这里不是说他现在这样就对社会没贡献，他解决的就业，缴纳的税收，游戏给人带来的快感等等，都是他做出的贡献；我只是说，他本来可以做出的贡献也许是
    10，而他选择的路，让他只做出了 3）。但是每个人有自己的选择，他选择了这条路，对他本人也许是最好的，最合适的。


    ## 为什么酒窝就美，兔唇就不美？


    在地铁上看到一张广告，广告上的美女有一个深深的酒窝，很好看。


    我盯了一会儿，突然意识到，为什么我们会觉得酒窝很美呢？其实细究起来，它是在一张圆润的、线条优美的脸上，突然凹下去一个洞，实际上是破坏了脸的完美性，我们按理不会觉得美才对。


    我这里并不是说讨厌酒窝，或我自己觉得酒窝不漂亮。恰恰相反，我觉得酒窝漂亮极了。我的孩子就有酒窝，我觉得非常迷人。


    我只是对人类这种审美的形成机制感到困惑。


    同样是天生的一些面部或形体特征，有一些我们觉得美，有一些觉得不美，后面的原因是什么？


    例如，兔唇被认为是一种残疾，需要去做手术纠正的。一些地方的人认为双眼皮好看，单眼皮要割成双眼皮才行；而另一些地方却相反，觉得单眼皮才更好看。头发自来卷在以前的中国是被认为不好看的，但现在我们觉得是一种美……


    至于胖瘦和黑白，就更矛盾了。


    中国唐朝人和现代汤加人觉得胖是一种美，但现代中国人和西方人普遍认为苗条才是美。女孩子们天天嚷嚷着减肥，如果别人说自己胖，那不是夸奖，而是莫大的侮辱。


    中国女孩子最怕晒黑，有点太阳就要打伞，或躲着不出门。但欧美却恨不得太阳把自己晒黑，网上搜“get tanned”，马上出来一堆文章讲 how to get
    tanned fast，在中国人看来，真是不可思议。


    有很多美丑其实就是人为制造出来的。


    试想，我们为什么要认为有头皮屑是一种不好的现象呢？为什么不能认为头皮屑是一种美呢？如果一个人，头发里缀着星星点点，肩膀上洒下一圈雪花，难道不也很美吗？


    我们为什么要认为牙齿洁白是一种美呢？为什么不能像云南的布朗族那样认为牙齿黑才美呢？


    但是卖洗发水牙膏的商业机构不能容忍这一点。他们千方百计要让我们认为有头皮屑和有黑牙是极其丢脸的事情，一定要想方设法改变。


    我印象深刻的一条广告，是海飞丝的头皮屑测试比赛。一群女孩在那里轮盘转，指针指到谁，谁就要拿一个黑色的测试条放在头上，看看粘下来几点头皮屑。


    虽然当时我年纪很小，但就是觉得不对劲。那些人的头皮屑已经少到肉眼都看不出来了，还要拿工具去测，这不是有病吗？这和美不美有一毛钱关系吗？为什么那个测试的人，要感觉到那么丢脸呢？


    我是从这个广告开始思考商业机构对我们头脑的侵蚀的。他们会为了商业利益，而制造一些概念，让我们不必要地恐慌，然后去购买他们的产品或解决方案。有一些是夸大危害，有一些甚至是完全无中生有。


    令人悲哀的是，用这种方法能赚到钱的人，往往被认为是商业的英雄，而没有人觉得这样做不对。昨天我写的史玉柱的文章，有一个人在留言里说，能赚钱就是商业上最大的道德，不管这钱是怎么赚来的，只要不违法就行。


    如果按照这种说法，我应该多去接各种广告才对。不管是 p2p、传销、非法集资、割韭菜的理财、收智商税的课程、骗钱的保健品化妆品，我应该放开了去接啊，又不违法，赚到钱才是最大的道德嘛！但是，这样的做法，恰恰是我极端不认可，也绝对不愿意去做的。我总认为，法律只是一个最低最低的底线。在法律不允许做的那条线和我们应该做的那条线之间，还有很大很大的空间，一个正直的人，不应该以法律允许为借口，把自己放在很
    low 的位置，而应该在法律之上，设立更高的底线。


    ## 听到就要去做吗？


    孔子和弟子们有过一次对话：


    子路问：“闻斯行诸？”子曰：“有父兄在，如之何其闻斯行之？”


    冉有问：“闻斯行诸？”子曰：“闻斯行之。”


    公西华曰：“仲由举尔问，与我对也？”“赐敢问何辞？”子曰：“求也退，故进之；由也兼人，故退之。”


    看到这里真是深有感触。


    孔子知道自己弟子的性格，子路是个非常莽撞的人，所以他来问的时候，孔子要告诉他不要听到了就去干，要回家请示过父亲和哥哥，再来行事；而冉有个谦退的人，所以他来问的时候，孔子说：干就对了！


    我们平时会在网上、书上看到很多道理。很多时候我们听了会觉得，哇，好有道理呢。


    其实很多时候，我们觉得有道理的话，都是与我们本来性格相符的。


    一个莽撞的人，听了雷军说“生死看淡，不服就干”，会拍着大腿说，雷军讲得真好啊！然后变得更莽撞了。


    而一个瞻前顾后的人，听了“小心使得万年船”，也会心有戚戚焉，而变得更加谨小慎微。


    我们很少能碰到触及心灵，让自己直面弱点的道理。


    毕竟，不是谁都能碰到孔子这样的老师啊。


    换一个角度看，如果我们看到别人成功的路数，以为放诸四海而皆准，不加分辨地拿来就用，往往也是要吃亏的。


    不同的理论、经验，还是要结合不同的环境和使用者的不同特质而去调整。


    我是一贯主张，人是应该追求梦想，想到就去做。这其实是出自于对抗自己性格中的弱点。


    因为我本身是偏向于谨慎、懦弱、谦退这种性格的，进取方面有所欠缺。但我认识到这是性格中的缺点，应该从另一面去纠正、弥补。


    如果我还要每天去看那些劝人小心谨慎的鸡汤，那就反而会加重性格的弱点，更加一事无成。


    所以我所有的文章，都是在说，要由梦想驱动，要看到自己的牛逼之处、别被冒牌者综合症蒙蔽，要勇敢地跳出体制尝试新的东西等等，这主要是针对和我一样性格的人，给他们的鼓励。


    但如果一个本来就觉得自已无所不能，行事百无禁忌的人，可能就不适用了。相反，他们需要的是另一套理论，告诉他们，你其实并没有那么厉害，过往的成功有可能是运气，做事还是要小心一点为好。


    ## 三代人的不同选择


    前几天参加一个平江在粤学子联谊会。来了三四十个在广东读书的平江学子。主办方也邀请了我们这些早就毕业的人，来给师弟师妹们讲讲学习、生活、事业各方面的话题。


    我发现，我们这些分享的“哥哥姐姐们”，可以明显分成两种不同的类型。一类是 75 年以前出生的；一类是 80 后出生的。


    75 前的师兄师姐们，全部有一个特征：他们大学学的什么专业，后来就一直从事什么行业。哪怕是换过单位，也不会改换行业。


    而 80 后的年轻人，全都抛弃了原来所学的专业，做了其他的事情。


    00 后的学子们，由于还没有工作，所以不知道他们未来会怎么样。但是也有了明显的不同。例如，其中一位孩子自我介绍时说，我现在大一没啥事，大家如果要玩游戏开黑随时找我；另一个孩子说，我非常迷茫，我喜欢化学，但是学的是外语，不知道未来的路到底该怎么走。


    在大家讲的时候，我就注意到这个问题。所以轮到我分享的时候，我首先就问大家一个问题：大家觉得前面这些 50、60、70 后的师兄们，和我有什么不同？


    这时，大家纷纷看向了 我的发型，然后露出了迷茫的眼神，似乎在说：没什么不同啊。


    我说了我的看法：我们在座的，其实很明显地分为三代人。


    第一代是 50、60、70 后。他们是根据自己的能力和资源，来进行人生的抉择。所以他们发现自己的能力是在某一个行业，人脉资源是在某一个行业时，就会选择这个行业作为自己终身耕耘的方向。


    第二代是 80、90 后。虽然曾经根据自己的专业而选择了初始职业，但是后来都放弃了。以我和八程科技的卢总为例，我学经济学，然后进入政府部门做经济研究；他学建筑工程，然后进了土地规划部门。但后来我们都自己出来创业了。


    可以说，我们这一代，没有上一代这么沉得下心，扎根一个行业干到老；但是也可以说，我们拥有了比上一代更优越的条件，有底气重新作出选择；我们也比他们更自信，相信尽管现在没有相应的能力和资源，但是凭借自己的双手，一定能从无到有的创造一番天地。


    而第三代 00 后，又和我们更不一样了。他们敢于表达自我，知道自己喜欢什么。例如在这种场合直接说“我就喜欢打游戏，喜欢打游戏的随时找我”，在我们那个年代，起码不敢这样表达出来。


    我最后对师弟师妹们提的建议就是：做你喜欢的，想干就干吧！


    我觉得，现在社会已经发展到这个阶段。我们再也不用背负着沉重的包袱，让自己喘不过气来，为了种种责任而无法选择自己喜欢的事物。不管是社会还是家庭，对绝大多数 00
    后的孩子来说，已经足以支撑他去按照自己的喜好，追求自己的梦想。


    我建议师弟师妹们不要学上上代的能力和驱动，也不要学上一代的机会驱动，而要由自己的梦想驱动。也许你会发现，你的梦想很远，你的能力和资源完全不具备。但年轻的优势是什么呢？就是你有足够的时间去练习实现梦想所需要的能力，聚集所需要的资源。


    在这个时代，年轻人应该有更大的底气和更高的心气，去追求自己梦想的未来。

    '
