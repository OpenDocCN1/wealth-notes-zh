    # 预测的错误与正确


    1994 年，美国一份名叫《矩阵新闻》的刊物登出了一篇文章，里面统计了1993 年互联网传播速度的变化。


    一位 30 岁的年轻人，根据文章提供的数据，计算出当年的互联网增长了2300%。他为这一速度感到震惊，并决定全力以赴加入这个行业。


    于是，他在互联网上创立了一家书店，名叫亚马逊。


    这个年轻人就是杰夫・贝佐斯。


    后来，他知道，当年他算的数字其实是错误的。但是，正是在这个错误数字的基础上建立的亚马逊，最后却发展成功了。


    一个错误的数字，为什么能够引导一个成功的行为呢？


    其实，这样的例子不在少数。在一个大的潮流中，只要方向是正确的，具体精确到多少的数字根本就无关紧要。


    例如，2013 年我对比特币做了一个研究，发现这个东西未来可能会大幅增长。那时一个比特币大概是 20 多美元。我预测它未来会涨到几千美元。


    从现在来看，毫无疑问这个预测是错误的，因为现在的比特币已经涨到了几万万元。但是如果当时我按照自己的预测而做了一个投资，那我会大赚一笔。


    我当时没有做这个投资，不是因为没有预测对，而是因为其他原因，在这里就不展开讲了。我的研究文章还给两位朋友看了，也给几位朋友口头讲了。如果他们听了我的话买了一些比特币，现在也几乎要财富自由了。


    有很多研究成果和人生建议，其实从精确来看都是错误的。但是只要他们方向对，照着做就能产生巨大的效果。这时如果去纠结具体预测的对和错，那就会丧失绝佳的机会。


    很多事情，重要的不是细节上是否精准，而是宏观上能否判断大势。我们今天说中国一定会超过美国，就没有必要去纠结是 2025 年还是 2028 年，甚至 2030
    年，重要的是几年十几年之内一定会超过。


    如果这时候有人要根据未来哪国的经济发展前景更好，创业机会更多而决定定居哪国，那么看这个大势是最关键的因素。如果我们预测了 2025 年超过美国，结果没超过，这时候来说，你这个预测就是瞎扯，根本就不准啊。然后放弃了中'
