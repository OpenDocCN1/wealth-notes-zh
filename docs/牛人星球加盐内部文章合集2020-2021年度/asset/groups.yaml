    # 每一个深夜，我都看到无数人在骂任正非、马云……以及何加盐


    我一贯认为，那些做出了大事的人，无一不是誉满天下，亦谤满天下。自从开始写牛人后，对这种感觉更是明显。


    一个是在研究资料的时候，就会发现不同的人、不同的媒体对同一个牛人，往往会 有不同的评价，有时候甚至是分布于两个极端。


    另一个是文章发出来之后，评论总会有不同的声音出现。不管我写任何一个人，都是如此。无非有些相对统一一些，有些更为极端一些。但是没有哪一个不是同时存在相对立的两种的观点的。


    此外，同一个人，在不同时期，大众对他普遍性的评价也很不一样。例如柳传志早先是民族英雄、企业教父；后来却被很多人骂为汉奸走狗、买办等。


    王石早年在舆论中的评价极高，但是 08 年之后急剧下降，红烧肉事件之后更是降至极点。


    也有反过来的，马化腾早年间的舆论中常常是被批判的对象，现在相对非常正面了。任正非早期在大众中没有什么存在感，但现在却成为举国瞩目的大英雄。


    但是，即使如此，现在也有很多喜欢柳传志和王石，讨厌马化腾和任正非的。


    我写牛人，总是习惯于相对客观地去描述事件，不掩其功，不讳其过。所以大家在我的文章里总会看到一个牛人的两面。这对于很对习惯持“非黑即白”观点来看世界的人是接受不了的。


    他们无法忍受一个人怎么可能是又好人又是坏人，一个他认为的坏人怎么可能会存在值得夸奖的地方，一个他认为的好人怎么可能会做出危害社会的事情。


    这些人完全无法理解社会和 人性的复杂。


    所以对何加盐的评价也非常极端。我的文章经常很不讨好，每一篇都是得罪两边的人。喜欢那位牛人的读者认为我在黑主人公，讨厌那位牛人的读者又认为我在捧主人公。甚至很多次，文章下面的评论同时会出现两种风格——上'
