    # 青年节谈青年气象


    我是一个快 40 岁的人了，每每和人开玩笑说，我已经是中老年了。但这其实只是一种自嘲，我自己心里明白，我内心坚定地认为我是一个青年。


    大家应该都能够认可，青年不青年，不在于年龄，而在于精神状态。有的人已经七八十岁了，还拥有一往无前的决心和战无不胜的信心，充满着活力地在享受生活，创造事业。有些人明明才二十来岁，就经心心如死灰，什么都不想干了。很显然，从内心状态来说，前者才是青年，后者已经暮年。


    关于什么才是青年气象，这个论述的就很多了。尤其有名的是梁启超的《少年中国说》，其实里面的少年跟青年意思也差差不多，并不是指十几岁的少年的意思，而是指拥有少年精气神的人。


    我认为的青年气象，就是心里还存着一个梦想，并且愿意为这个梦想去努力，行动上也确实是在朝着梦想前进。你看芒格和巴菲特一个 97 岁，一个 91 岁，他们坐在台上虽然老态龙钟，但是你一听他们说话，那种乐观、那种激情，那真的是青年气象。


    当然每个人也可以有自己的解释，你认为的青年气象是什么，你就朝着那个气象去追求。未必一定要与梁启超或何加盐的一样。但是我想里面一定会有一些共同点，那就是积极向上，努力拼搏。


    据说生理学上说年轻人为什么冲劲足，是因为一种激素的促进。老年人某种激素分泌少，所以更倾向于平和。


    但我觉得这个激素应该一方面和年龄有关，另一方面也跟人自己的思想和行为有关。一个 20 多岁的食草系男生，和一个六七十岁的还奔波奋斗在一线的干事创业者，你去测他们的激素，我估计是六七十岁的这个人更高。


    所以年纪大的人，不应该以生理激素的变化，作为自己没有干事创业激情的借口，而是要用自己干事创业的激情，去促进这种激素的分泌。


    那实在找不到这种激情怎么办呢？我觉得人的格局还是要大、再大、更大，就像孟子说的，我善养吾浩然之气。


    要找到能够为之而奋斗的东西，如果实在找不到的话，那就热爱生活，珍惜现在所拥有的，而不是觉得一切均已幻灭。'
