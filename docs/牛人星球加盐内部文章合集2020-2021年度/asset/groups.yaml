    # 一种针对超级富豪的生意


    前几天有一位星友向我咨询一个生意的问题。我觉得他这个生意模式很特别，但是也对我们挺有借鉴意义的，所以在这里聊一聊。


    星友是做超高端亲子教育的，他面对的客户是那些超级富豪。他的收费有多少呢？是年费几百万元（具体数字属于商业秘密，我就不透露了）。主要交付的内容就是帮那些超级富豪们培养小孩。


    收费高，自然投入也大，他自己的所有时间精力都需要投入进去，所以一年能接的单子也就是一个，最多两个。


    这门生意咱们普通人听起来应该还觉得不错，毕竟一年能赚几百万呢。但是真到这个层次，我们也会发现还是存在一些问题，最大的两个问题，就是生意的可持续性和规模限制。


    先看可持续性：


    这样的高端生意，拓展客户很难。其关键倒不是说要付那么多钱，毕竟对于这些富豪们来说，一年付几百万根本就是小意思。最难的是，客户一旦下了决定的话，不仅小孩要在老师这里投入巨大的时间，家长也需要付出很多时间，而且对小孩未来一生的性格都会有巨大的影响。对于超级富豪来说，其风险在于小孩的一生，而不是钱的问题。客户必须得跟这位老师达成完全一致的理念，并且对老师的能力和人品绝对地信任，才敢把小孩交给他。


    这样一来，要拓展新客户就很难了。首先，这些超级富豪并不好接触到；其次，就算是接触了，要跟他达到那么深的关系，建立这么深的信任，也不是易事。虽然也可以靠旧客户口碑推荐，但即便推荐了，也要一个很长、很深的沟通和达成信任的过程。


    再看规模化：


    这样的生意天然就很难规模化，因为其交付的是这个老师本人的时间，而一个人的时间是有限的。


    另外，由于上面所讲的拓客困难，就算一年拓展一个新客户不容易，更别说一年拓展好多个了。所以从推广上，本身也是一个没有办法规模化的东西。'
  - '[PAGE 296]


    有人可能会说，我一年都能赚几百万了，为什么还要规模化呢？就服务好一个客户不也可以吗？


    其实，会这样说的人，关键是自已还没有达到那个层次。我相信一旦你达到那个层次的话，你的目标肯定也会随之调高。


    而且，如果你服务的都是超级富豪，每天看着超级富豪的家庭是怎样生活的，在社会上有怎样的影响力，自己也很难一点都不动心。


    我以前有一位朋友，就是在华尔街给那些超级富豪打理财富的，所接触的都是至少拥有 10 亿美元以上家产的那些人。本来刚开始他还觉得挺好，但后来其中一人跟他说，你这么厉害，为什么要给我们管钱呢？为什么不自己成为我们中的一员呢？


    自从听了这句话之后，朋友就不淡定了，后来便开始了创业。


    所以我想这可能也是人之常情吧。


    上面说到，星友目前现有的困惑，就是如何解决规模扩大化和业务可持续性的问题。


    他的思路是：把自己的教育理念和方法标准化、数据化、可复制化，利用信息系统、SOP（标准作业流程）和强有力的团队，打造规模化的交付能力。


    当然，这样的话，未来去实施交付的就是系统和团队，输出的是标准化的东西，其价值自然就比他本人去交付个性化定制化的东西要少一些，所以收费也就要低很多，只有原来的
    1/10 甚至更低。


    未来他希望能够把这个东西打造成一个普惠型的产品，服务更多的家庭。


    听完以后，我对他提了几个建议：


    从本质上，这个生意面临的核心问题是推广（从产品和服务上他自己已经验证过了）。推广面临的核心难点是如何触达更多的超级富豪和如何取得对方的超级认可。


