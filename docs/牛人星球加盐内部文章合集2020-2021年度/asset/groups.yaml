    # 苟且红利是一个很好的词


    几年前，罗振宇提出了“苟且红利”这个词。尽管有很多人认为罗振宇是个大忽悠，但是我认为，这个词实在是太总结得到位了。


    所谓苟且红利，意思是：“别人的苟且，就是你的红利”。


    这个世界有两种理念，一种是催人奋进，一种是劝人苟且。网络上谈到个人选择的文章，大体上也都是这么两类。


    奋进有时候是很痛苦的。你要深入地思考问题，你要克制自己的欲望，要努力地学习，要很早起床，要锻炼身体，要能够吃得下苦，耐得下寂寞。


    所以，催人奋进，是很难的。


    而苟且常常很舒服。你什么都不用做，只要在那里躺着就行了。有很多的自媒体会告诉你，生活已经很难了，我为什么要奋斗呢？就躺在这里好吃懒做不好吗？


    小时候要努力学习争当学霸？不要，就当个学渣也挺好的。工作中要努力表现提高自己？不要，我上班摸个鱼到点下班更爽。回家后要学习充电锻炼身体？不要，难道打游戏看电视剧不香吗？


    在现在的网络语境下，这样的论调非常受欢迎。


    其实我觉得这样挺好的，两种人各取所需。喜欢奋斗的，那就去奋斗；喜欢苟且的，那就苟且。每个人都过着自己想要的生活。


    我自己是一个喜欢呼吁大家奋斗的人，牛人星球的星友也大多是喜欢奋斗的朋友。因此咱们才能走到一起。


    那么，对于我们这些人来说，这样的时代真是再好不过。本来我们可能面临着无比激烈的竞争，但是现在有无数人，自动就退场了，把未来的机会留给了我们。


    这样不好吗？


    下一代的生存环境也是如此。


    现在国家大力提倡减负。学校三点多就放学，不让布置家庭作业，课后不让上辅导班，就鼓励孩子使劲玩，课程设置尽量往简单去，数学无用论盛行，英语要取消主课地位……'
  - '[PAGE 282]


    很多朋友，可能会对这种情况忧心忡忡，甚至可能在网上奋笔疾书，大肆抨击。


    这样做并没有什么问题。但是反过来，对于愿意孩子上进的家长，这就是福音啊。


    我们常说别让孩子输在起跑线，现在各种力量在尽量把起跑线往后拉。只要你不跟着后退，不久自然站在前面了吗？


    如果别的孩子三点半放学，什么作业都不做，什么都不学，就光顾着回家玩游戏，看动画片。而你的孩子在学习。如果别的孩子因为英语不是主科，就再也不学，而你的孩子英语顶呱呱。你难道不应该偷着乐吗？


    面对一种我们不喜欢但是又无力改变的社会发展趋势和政策力量，我们可以有两种不同的应对方式。一种是发牢骚，说怪话；一种是想一想怎么利用这种趋势和力量，让自己和家人未来变得更好。


    前一种会成为喷子，除了收获一堆坏情绪之外，什么都得不到；后一种会趁着别人都苟且时，积聚自己的力量，创造更好的人生。'
