  - '[PAGE 358]


    比较难的是能力上要重新适应新角色的要求。这一点，要做好三个准备。 第一，准备接受挫折。


    你做的事情有可能是以前从来没有经历过的，刚开始不会做，效率低，甚至完全无法下手，是很正常的。要能忍住内心的沮丧，别人的批评，甚至有可能是领导和客户的责骂。


    如果你的脸皮太薄，忍受不了这些，就会非常艰难。


    第二，准备艰苦奋斗。


    体制内的工作再苦再累，等你出来之后就会发现，和外面相比，都已经算是安逸的了。


    我刚开始做咨询时，经历过 3 个月的地狱时间，每天忙不完的活，一天能睡五六个小时就不错了，关键是你得去给年收入几十亿的老板就他公司的经营和管理指手画脚，心理压力是极大的。而经历过最初的时期后，我又迎来了多项目并行的时期，同时担任两个项目的项目经理，和另一个项目的项目总监，还要负责管理公司和团队的各种事项。大家想一想就知道工作量有多大。


    这个时候能怎么办呢？只能咬牙坚持罢了。


    第三，准备快速、大量学习。


    体制内出来，一切对于你是全新的，唯有用最快的速度学习，才能赶得上事业对你的需要。


    这个时候，就不要顾忌一点点小钱了，该买的书、资料、工具，该报的课，你就使劲买吧（前提是保证自己认真学，经常用，不然就是浪费钱）。什么东西能够让你最快速地进步，就是你需要的。
    除了向书本学，还要学会向网络学，向其他人学。


    我做咨询的时候，专程做这行的朋友请教该怎么办。有一个朋友是波士顿咨询大中华区的董事总经理，有次他来广州出差，时间很紧，我直接开车到机场去接他，就为了在车上能多聊一会。


    如果你能做好这三个准备，熬过最初的一年，后面的发展，想必就心里有底了。'
