    # 也谈复利


    最近有一篇文章挺火的，叫做《复利的谎言》，作者“老喻”，首发于“孤独大脑”公众号。


    文章厘清了一些关于复利的错误理解，很有启发。


    但是我看到也有人因此对复利本身的意义也产生了怀疑，认为那些让人们在事业、投资、生活、成长中重视复利效应的文章是忽悠。


    我对投资不是很懂。但是对于人生成长有较多的研究，可以说一说我的观点。


    我认为：复利，是追求成长和成功的人特别应该注意的一个概念。如果能够真正理解复利，用好复利，人生会大有不同。


    复利对我们的启发，主要是以下几个：


    +   1. 要有信心。知道人是可以进化的。


    +   2. 要努力。争取每天进步一点点。


    +   3. 要有耐心。知道效果都是很长时间才能出来的。


    如果能够做到这三点，其实就能充分享受到复利在人生成长过程中的效果了。


    老喻的文章，其实并没有否认这些，而只是更深入地阐述了一些细节，明确了一些前提。例如，进化的速度是不均匀的，有可能很长时间没有进步，但是另一个时间却突飞猛进；进化的方向要正确，否则做得越多错得越多；进化的结果不是确定的，而是或然，运气占有很大的成分。


    这些都是对如何应用复利原理非常好的说明，而不是否定复利原理。


    今天在思考这个问题时，正好看到了一则非常鼓舞人心的新闻：谷歌旗下的AlphaFold（与AlphaGo是同一家公司开发的不同应用）在预测“蛋白质折叠结构”方面取得突破性进展。这可能会带来一场新的生物学革命。


    这里面的AlphaFold和之前下围棋的AlphaGo一样，都是深度学习的人工智能，就是每天不断地自主学习、进步，然后逐渐具有了超高的智能。


    这种深度学习之下取得的效果，实际上就是人在努力之下取得成功的一种很好的比拟。从广义上来讲，就是复利效应的体现。'
