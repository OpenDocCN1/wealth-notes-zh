    所以我们有时候看一个人说话是否靠谱，可以多看他说的大势是否靠谱。有一些具体的细节预测是未必准确的，但是只要方向正确，就可以作为重要参考。


    从创业机会上，有哪些大势预测呢？


    我这里说几个吧：


    +   1. 视频表达的重要性会越来越超过文字表达。虽然文字永远不会消失，但是它毫无疑问会相对衰落。现在在文字平台上创业的人，如果没有超强的文字表达能力的话，应该坚决果断地朝视频平台转型。而有文字创作能力的人，也不妨把视频平台作为一个方向。


    +   2. 在视频平台上，微信短视频、抖音对内容创作者是一个很好的表达平台，但不是一个很好的创业平台。因为短视频的个人 IP 属性太弱，算法和平台的力量太强，其会把“每个人都有机会红，但是只能红
    5 分钟”这种现象发挥到极致。在这两个平台的人会发现，即使你积累了很多粉丝，实际上却没有太大的价值。这两个平台的价值附着在爆款文章身上，而不是创作者身上。创作者可能上一个视频播放量上千万，但是下一个又会降低到几万。所以它对创作者的激励没有持续性。对个人
    IP 比较友好的还是公众号、微博和 B 站。


    +   3. “正能量”的内容会越来越受市场欢迎。不管是生产和销售个人消费品的商家，还是做内容创作的创作者，都要顺应这个潮流，不然就会被市场抛弃。


    +   4. 电动车一定会取代油车，这个过程不会很长。5 年内会形成潮流，20 年内会基本完成。


    +   5. 电动车的关键技术突破是能源，具体而言是电池。但是其使用场景的关键突破是自动驾驶。未来的电动车就是一个无人驾驶的机器人，有良好的人机交互。


