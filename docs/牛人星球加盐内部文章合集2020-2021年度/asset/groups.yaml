    # 规则与超越规则


    最近，货拉拉女乘客的不幸事故引起了很多讨论。其中一个很流行的说法是：她的所有行为都遵守了规则，所以本不应该承担这样的后果。


    首先，这个事情肯定是一个悲剧，不管对女孩，对司机，对平台，还是对整个社会，都是一个本不该发生的悲剧。所以对女孩的遭遇，我们肯定会感到同情和悲恸。


    很多人的同情和悲恸会仅止于此，他们会觉得，女孩发生了不幸，那么司机就是大恶魔，或者平台是大恶魔，总之一定要有一个大恶魔。


    但是如果往深一点想，我们会看到，其实司机也很不幸。他靠拉货为生，在过年的时候，花俩小时时间，只收取了 59 元搬家费，扣除平台费用，油费，车辆损耗等，纯赚的钱连三十块钱都不到。他曾经试图通过帮女孩搬运，多赚一点钱，但是被女孩拒绝了。也许是由于这个拒绝，让他赚更多钱的希望落空，后面他一直对女孩没有好脸色，加上为了赶时间而偏航，引起女孩的戒心，最终导致悲剧的发生。


    也有人会说，好，就算司机不是恶魔，那平台肯定是恶魔吧？平台的规则导致司机只能赚那么少的钱，导致司机必须赶时间，所以是平台导致了这样的悲剧。


    但是我们反过来看一下，作为顾客，我们谁不想要搬家更省钱一点，想要司机来得更准时一点？平台的规则恰恰是保障了两点。如果平台想让司机赚更多，想让司机不赶时间，那么顾客一定不满意，这个平台就玩掉了。那些司机会失业，顾客也用不到又省钱又准时的搬家服务了。


    如果说平台有可以改进的地方，也许是全程录音。但是我们并不能说此前没有全程录音是平台多大的过错，因为平台此前也预见不到会发生这样的事情。要知道，货拉拉是 2013
    年就成立了，服务可能都已经几千万甚至上亿单了，也就是这次我们才知道有这样的事发生。这么小的概率让平台提前预判，或者提前就花费很大的成本来做预防，也是不现实的——如果要把所有的极小概率事件全部想到，并且做好预防，那么平台马上就会因成本太高而维持不下去。当然现在已经发生了这样的事，我们可以说平台应该把防止悲剧再次发生作为一个改进的方向，估计以后大概率也会推出录音系统。'
  - '[PAGE 273]


    回到女孩的话题。其实很多时候，规则只是一个最低的底线，我们只能说，如果不违反规则的话，在法律上并不需要承担过错，但这不代表在现实中，我们不可以做更多。


    规则是规定了司机等候不超过四十分钟，就不需要加钱。但是作为一个正常人，我们让司机等了三十分钟，完全可以，而且应该说一声不好意思，让你久等了。说一声抱歉不是规则要求的，但是体谅别人的痛苦，并且为自己造成的这种痛苦而道歉，是人之常情。


    同理，女孩没有要司机帮忙搬，是为了省钱，规则也没有说司机在这种情况下一定要自愿免费帮忙，但是看着一个小女孩一个人搬了十几趟，作为正常人，也应该有一点恻隐之心，主动帮一下忙。不说让你全部搬，起码搭把手也是可以的吧，不说有多高尚，起码司机自己的时间也节省了呵。


    所以你看，只要超越规则，做了一点点有人情味的事情，整个事件的走向，可能都不一样。


    日常生活中，我们常常会碰到这样的情况。


    例如，从机场打出租车，可能我们要去的地方离机场很近。司机有可能在机场排队排了俩小时，就等了拉一个大单把损失弥补回来呢，而这一下只能赚个 10 块钱，他心里肯定很不爽。规则规定，司机不能拒载，我们作为乘客，完全有理由要求司机必须载我们。但是，此时此刻，如果我们理直气壮，觉得这是司机本来就该做的，他承担的那些损失是活该，不关我们的事，那么这就是要规则而不要良心。一个正常人起码在这种情况下会有些不好意思，甚或有些愧疚，说一声，不好意思啊，路比较近，至少也能让人心里好受一点。如果做到更到位的一点的，多给司机个十块二十块，至少也能让人弥补一点损失。


    我记得曾经在微博上看过一个视频：在马路上，一个妈妈骑电动车带着女儿逆行，和一辆正常行驶的摩托车撞上了。小女孩重重地摔在地上，哇哇大哭。这时，摩托车司机在那里骂骂咧咧骂那位妈妈。那条微博的评论里，都在叫好，说引起舒适，认为摩托车手做对了。因为他遵守了规则，那位妈妈没有遵守规则，所以她们经受的一切，是活该。


    但是我总觉得，虽然摩托车手没有违反规则，从法律上讲他也许可以不用承担责任，但是当看到小女孩那样摔在地上，哭得那么凄惨，他起码可以关心一下'
  - '[PAGE 274]


    对方有没有摔伤，需不需要送医院。


    因为，我们是人，不是没有感情的机器。'
  - '[PAGE 275]


    # 有限游戏与无限游戏


    以前知道王兴和程维都很推崇一本书，叫《有限与无限的游戏》，昨天特地找出来看了一下。


    书的主要意思是：游戏分为两种，一种是有限游戏，一种是无限游戏。有限游戏有固定的规则和明确的结局，当竞争者达到某一个结果，且参与者都认可某一方赢了时，游戏就结束了。无限游戏的规则是变化的，而且没有一个明确的结局，竞争者永远都在游戏之中。


    大家可能会想，一本讲游戏的书，为什么会让两位年轻有为的企业家如此推崇呢？


    我的理解是：


    每个人在成长过程中，可能都幻想过，如果我某一件事做好了，那我的人生就美满了。例如高考考出了大学，这辈子就不用愁了；毕业找了个好工作，后半辈子就放心了；投资赚了一个小目标，往后就衣食无忧了。


    创业者也可能曾经会想过，如果我的公司能够把全国市场拿下来，后面的发展就不用愁了；或者我的公司上市了，那我就不用像现在这么累死累活了。


    追求一个确定性，想要一个可见的结局，这是深埋在我们基因里的东西，很少有人能够挣脱其束缚。


    但是真正到创业时就会发现，这是一场无止境的修行。你不可能仅凭达到某个节点，然后就说你赢了，游戏结束了。不管你做得多好，完成了多重要的任务，在你后面总有更难的关口要闯，有更大的
    boss 要打。


    本质上，认识到创业是一场无限游戏，就是在心理上完成了一次升级，跳出了确定性的束缚，进入到不确定性的宇宙，这才算是认识了世界的真相。


    每一个创业者都要完成这样一个升级，才能够从心理上、行动上适应创业、走向成功。否则的话，将会永远处于痛苦和焦虑之中。


    任正非、马化腾都有过这样的升级，所以都认识到了灰度的存在以及适应灰度、利用灰度的重要性；张一鸣和程维都经历过脱离确定性窠茔的痛苦过程，才完成了当一个合格创业者的蜕变；王兴接受不确定性的能力更强一点，同时也是对这种不确定性认识更深，所以他看这本书，应该是感到非常高兴的“於我心有'
  - '[PAGE 276]


    戚戚焉焉”，而不是像程维的仿佛打开了一片新天地。


    这本书其实是一本挺晦涩的哲学书，最关键内容就是第一章，核心就是全书开篇的两句话：世上至少有两种游戏。一种可称为有限游戏，另一种称为无限游戏。有限游戏以取胜为目的，而无限游戏以延续游戏为目的。


    如果理解了这两句话，后面其实都不需要读了。看懂了这句话，就像是《三体》里描述的进入四维空间的感觉是一样的。我完全能理解程维看到之后的豁然开朗，以及王兴看到以后的会心一笑。


    世界上有很多道理，你只要听到，就会改变自己的一生。'
  - '[PAGE 277]


    # 三个信封和十亿家产（上）


    假设某一天，突然有一个陌生人找到你。


    他告诉你，他是你失散多年的叔叔。因现在身患绝症，即将去世，而自己没有孩子，所以想把身后十亿人民币的家产都留给你。


    你父亲正在旁边，他确认那个就是多年前走散的弟弟。你也上网查了叔叔的信息，发现他确实是一个成功的企业家，有十亿人民币的家产。


    这时候你又震惊又高兴，开始憧憬起拥有 10 亿人民币的美好生活。


    但是别忙。


    叔叔是一个特别看重运气的人，他想要看一看你是不是一个运气好家伙，才决定要不要把家产都给你。他给你甲乙丙三个信封，告诉你，其中一个信封里装着遗嘱，另外两个信封装的是白纸。


    三个信封除了上面标了甲乙丙之外，看不出其他任何区别。叔叔让你任意选择其中一个信封。如果你选中的恰好是有遗嘱的那个，他就会非常欣慰，并且把所有遗产毫不犹豫地留给你。如果你选的是装白纸的那个，那就说明你运气不好，不适合继承他的遗产。


    你怀着激动的心，颤抖的手，选择了乙信封，正想要拆开。


    这时，叔叔阻止了你，并且把甲信封拿起来拆开，告诉你那里面是一张白纸。然后说：现在你还没有拆开乙信封，还有选择的机会。你是坚持选择乙信封，还是换成丙？


    请问，如果是你的话，你会坚持乙，还是换成丙呢？


    请先思考一下，答案我们会在明天揭晓。'
  - '[PAGE 278]


    # 《三个信封和十亿家产》（下）


    昨天的文章引起了大家热烈的讨论。有一些角度也是我之前没想到的，非常有启发。


    认为不该换的朋友，有些是认为应该坚持自己的选择，有些是认为反正是交给运气换不换都无所谓，有些是认为换和不换拿到遗嘱的概率都一样。


    认为该换的朋友，有些是认为换了以后拿到遗嘱的概率更大，有的是认为也是由运气决定；有些是知道题目是由什么问题变化而来所以提前知晓了答案。


    另外还有些朋友跳出了题目的设定，一种是先揣测叔叔的真实目的是什么，然后再根据这个来做决策。从定义上来讲，当你开始按照别人可能做出的选择而去考虑自己应该做出的选择时，这就是进入到了博弈论的领域了；另一种是考虑这件事情对于整个人生的意义，得出可能从一开始就什么都不选的決定。


    总之，题目激发出来的讨论非常精彩，也让我们看到了每个人看待问题的角度之不同。所以对世界的多样性，对于尊重人与人的不同观点，有了更多的敬畏。


    从我作为出题者的角度来讲，这些都是意外之喜。因为最初的想法很简单，就是想和大家讲一个很经典的概率论问题：三门问题。


    三门问题其实出现得很晚。其来自 70 年代美国一个电视节目。节目组设计了三个门，其中一扇门后面有一台兰博基尼跑车，另外两扇门后面各有一只山羊，参与嘉宾可以任意选择一扇门，如果选中了兰博基尼那个，那么跑车就是他的了。而每次当嘉宾选了一扇门之后，主持人就会在剩下的两扇门里，帮他去掉一扇有山羊的门，然后问嘉宾要不要更换选择。


    我的问题就是根据这个改编的。不过可能叔叔的遗嘱加入了更多可供遐想的场外因素，所以讨论就更加分散。


    如果我们纯粹从概率上来做选择的话，那么答案是应该换。因为不换的话，拿到遗嘱（或得到汽车）的概率是 1/3，换的话，概率是 2/3。'
  - '[PAGE 279]


    这个数字非常违反直觉。按理说，叔叔（或主持人）去掉一个错误选项后，另外两个选项要么是对的，要么是错的，各自的概率都是 50%，怎么会有 1/3 和 2/3
    的不同呢？


    别说我们普通人会感到困惑，问题刚出来的时候，就连数学系的教授都会被搞晕。


    那么真实的情况是怎样呢？


    我们可以用三种方法来解答题目。


    第一种是直接分析：每个门后面有车的概率都是 1/3，当你选择了一扇门之后，你的门后面有车的概率是 1/3，而另外两扇门后面有车的概率是 2/3，这个概率分布不会因主持人的行为而改变。当主持人去掉了一扇门之后，那两扇门的概率其实已经汇集到剩下的那一扇门那里了，因此是
    2/3。


    第二种是反推分析：为什么主持人要去掉这扇门而不是那扇门呢？主持人可能面临的是两种情况，A，嘉宾已经选中了有车的门，这种概率是 1/3，这时主持人随便选择一扇门就可以了。B，嘉宾已经选中了没车的门，这种概率是
    2/3，这时主持人一定要选择没车的那扇，留下的那扇必定是有车的。所以不换的话选对的概率是 A 情况中的 1/3，换的话选中的概率是 B 情况中的 2/3。


    如果这样不好理解，你可以用第三种方法，就是设置极端数字法（昨天的讨论已经有星友提到了）。从解题上来讲，3 扇门和 4 扇门乃至 100 扇门，解法都是一样的。我们可以设想有
    100 扇扇，其中只有一扇门有车，其他 99 扇是山羊。你选出一扇门后，主持人在剩下的 99 扇门中，帮你去掉了 98 扇错误的门，只剩下一扇。这个时候你要不要换呢？我想大多数人都会换的。因为数字大了以后，概率的差别变得悬殊起来，我们的直觉就能够起作用了。


    假如你还是没有明白，可以上网搜索一下“三门问题”，有各种各样的阐述，有很多比我讲得更好。


    接下来，我们要进入到更烧脑一点的环节：信息、熵与量子力学。


    三门问题或者三个信封的问题，里面有一个关键因素，那就是主持人或叔叔掌握着全部的信息。基于充分信息的选择，会对概率的分配产生影响。


    根据热力学第二定律，在一个封闭的系统里，在没有外部能量进入也没有能量溢出的情况下，世界总是从有序变得无序，也就是总是处于熵增的过程。'
  - '[PAGE 280]


    从本质上，我们获取信息，对于世界来说，是一个熵减的过程，也就是说，掌握信息，传递信息，会让世界变得更加有序。


    主持人和叔叔掌握了信息，使用了信息，让概率从随机分布变成了有目的性的分布，因而变得更加可预测。当那个错误的选项消失时，它不是随机发生的，而是在充分信息的情况下被有目的地剔除的，所以原本分布于它之上的概率，不是随机分布到剩下的两个选项中，而是有指向地坍缩到没被选中的最后那个选项。


    我们可以想象量子力学里的最经典概念：薛定谔的猫。由于衰变的量子特性，猫活着和死了的概率各占一半，这种概率之所以存在，是因为我们没有足够的信息，去了解衰变有没有发生，而只知道其概率是
    1/2，只有打开箱子的那一刻，世界才从或然坍缩成必然，呈现给我们一只活的猫，或者死的猫。


    假设我们能够知晓是否衰变的信息，那么不需要打开箱子，概率就已经坍缩了。所以信息会影响概率的分布。


    在自然界，在人类社会，我们不可能总是掌握充分的信息，所以世界总是存在偶然。这不是一个天命注定的世界，人们总能创造各种不同的奇迹。


    但是做选择时，我们可以通过多掌握信息，而让概率坍缩到一个更加确定数字，从而有利于我们做出更优的选择。在三个信封的选择中，如果我们明白了这个原理，就容易做出赢面更高的选择了。


    关于信息对真实世界可能产生的重大影响，此前我也曾经在星球发过一篇文章《陶哲轩的自杀村庄》，也是特别有意思的话题，感兴趣的朋友可以点击下面链接阅读：


    https://t.zsxq.com/qnYv7iy


    我是在 2002 年大学的概率论和数理统计的课堂上第一次听到老师讲三门问题的。这么多年，记忆依然非常深刻。概率论和数理统计的世界非常奇妙，如果我们能够多懂一点这些知识，那么看待人生，以及做出决策的方式，就会大不相同。'
