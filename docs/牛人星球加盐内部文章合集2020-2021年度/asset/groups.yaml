    ## 行业壁垒与技术壁垒


    行业是政治、经济、社会壁垒；技术是知识壁垒、物理壁垒。前者主要靠玩人脉、手段、营销套路等；后者主要靠智力和研发方法论。对于技术出身的公司来说，还是玩后者更适合一些。


    每个行业都有自己的边界和利益共同体，外行是很难突入的。用一个技术进入不同行业，更多是从行业已经存在玩家那里虎口夺食；而技术不一样，它的前面只有科学空白地带，每一次技术进步都是人类的进步，主要是创造新的价值而不是利益的重新分配。


    第三个原因：开拓新业务的难易程度不同。


    如果选择在一个行业内深耕，你的营销渠道、人脉关系都是现成的，有什么新的产品、新的技术，原有渠道都可以迅速帮你消化；他们也会向你反馈市场上有哪些新的需求，需要开发什么新的产品，形成一种良好的正反馈。


    如果同一个技术要用到不同的行业，你需要不断地开拓新的市场，这是非常艰难的。很多公司技术其实很牛，但是做得特别累，就是因为总要去开拓完全陌生的新市场。


    在企业发展初期，为了生存需要，把自己的技术优势应用到不同行业，这是可以的，说不定运气好接到一些大单，也能做到几亿几十亿，但是很难再往上走。


    要做成一家受人尊敬、规模巨大、持续发展的伟大企业，就需要选择一个有巨大纵深的行业深耕，不断为这个行业开发出符合人们需要的新技术、新产品。如果已经做到很大的规模，单个行业里的红利已经被你占据了大多数，则可以选择一个或几个新的、具有巨大纵深的行业，为其开发新的技术。


    除非是两种情况，可以考虑“为技术寻找行业的打法”：


    - 你的技术是人类社会颠覆性、可广泛应用的技术，它本身就创造了一个新的行业；

    - 你的营销能力非常强大，不管什么行业你都能快速突进，那么技术是什么本身已经不重要了。


    ## 理想信念的作用


    我一直自认为是一个喜欢理性的人，在欣赏影视和文学作品时，不喜欢那些煽情的片段，所以对那种苦情戏、选秀节目的淘汰感言或获奖感言、感动中国或艺术人生的催泪片段，我从来都是敬而远之。


    但近年来，渐渐觉得，人是需要体会、感受与别人同样的情感，需要被别人感动，有时候也需要去感动别人的，而且我也越来越容易被感动。


    不过，最容易感动我的，往往是那些与伟大、崇高、温情有关的东西。例如看到反恐战士的牺牲、医护人员的付出、人与人之间的友爱，我就容易产生胸中热潮奔涌的感觉。


    前不久带着公司小伙伴去看《八百》，看到战士们抱着炸药包一个个喊着自己的名字往下跳，我的眼泪哗就下来了。


    若按以往，我是非常羞于表露自己内心的这种情感的。任何时候看影视作品，如果有流泪，我总会偷偷擦掉，生怕别人看见。但是现在，我却觉得顺其自然最好，自己真实的情感就是这样，没必要遮掩。


    《八百》的这个片段感动我的地方在于，它让我想到了，任何时候，中华民族都不缺愿意为国为民做事，甚至为国牺牲的英雄。这也激起了我心中的一股情愫：我也要成为为国家、为社会、为他人作出大贡献的人。我甚至马上开始联系自身，想着凭我现在的能力和正在做的事情，能够为人们作出什么样的贡献。


    看完电影的那几天，我的心中始终还被那种豪情所激荡。每天心里都是浮想联翩，手头做事也干劲十足。


    从我个人体验来说，人是可以被感动、可以被激励的，这种激励会产生巨大的进步动力。如果一个组织，能够经常让成员被感动、被激励，这个组织的战斗精神一定无比坚定，战斗力一定无比强大。


    所以我觉得，对于一个组织，不管是机关单位、还是学校医院、还是私营企业，理想信念教育，都是很有必要的。而且，越是那种使命愿景比较崇高，价值观比较正的企业，理想信念教育就越重要，产生的效果也会越大。如果是纯以赚钱为目的的企业，做起来就比较难，因为怎么说都显得虚伪。


    看完《八百》以后，有一天我和同事讲，我们公司也要经常搞党建教育。


    同事被吓坏了，说我不是党员，我可不要参加这个教育。


    我说不是那种开会宣读文件、走形式的党建，而是要到红色旅游点、革命圣地，去感受革命的豪情和悲情，让我们自己永葆崇高、伟大的理想信念，牢记为社会做出大贡献的使命愿景。


    同事一下子来了精神，说这个好，那肯定参加。


    最近，我和几位志同道合的伙伴一起在筹划做一个新项目。这是一个需要理想信念的强大支撑才可能推进的项目。如果只是为了商业利益，是没有人会愿意去做这件事的。但我们几个都觉得可行，因为首先在价值观上，我们就完全一致。


    在大家刚开始第一次讨论项目时，我就提出：我们几个都是党员。假如我们未来真的要启动这个项目，一定要在公司成立党支部，经常开展理想信念教育。这个提议引起大家的强烈共鸣和一致赞同。


    可能会有很多朋友不能理解和认同，但它却是我们团队内部的共识。未来，我们肯定需要在全国范围招兵买马、开疆拓土。不理解、不认同我们的没有关系，我们总能找到理解和认同的人一起前行。


    在 1980 年的电影《庐山恋》里面，主角们在庐山之上，对着大山和天空高喊“我爱你，祖国”。


    很多人认为这是时代特色，不是真情实感的流露。因为那时改革开放不久，人们的思想还比较保守，所以他们认为两个恋人在高山之巅，不可能会喊出爱祖国这样的话，只有可能是编剧或导演故意这么弄。包括王小波都是这么认为。


    但我的感觉是，这也许正是真情实感的流露，至少是一部分人真情实感的流露。


    2001 年我到青岛去上大学，第一次到海边沙滩，就感受过这种情感。


    那时我还是一个超级愤青，对这也不满那也不满，对体制多有批评。但是当那个傍晚，我在渐渐黑下来的傍晚抵达空无一人的石老人海水浴场时，面对着一望无际的大海、听着连绵不绝的涛音，我难以抑制内心的豪情，想在平缓的沙滩上，写下一点什么。


    涌入我脑海的两句话是：中国万岁！中国共产党万岁！最终，我把这两句话写在了沙滩上。潮水很快把它们洗刷，但它们永远留在我的心里。


    ## 把别人喝咖啡的时间，用在工作上


    大家都知道，每次黄金周假期，都是大家回家探亲或者外出游玩的时间，玩手机的频率和时长都会大大减少。


    而且，就算是偶尔玩一下手机，也有很多时候用于拍照片、选照片、发朋友圈、看朋友圈，或者玩玩抖音、刷刷剧。


    有几个人还会看公众号文章呢？


    所以，对于写公众号的人来说，这种假期都会面临一个阅读率可能下降的问题。


    很多自媒体朋友，在黄金周假期，会选择停止更新，或者通过发旧文、转载其他人的文章等来度过这几天。这样做并非不负责任，而是在性价比考量之下的理性选择。


    有些专门研究自媒体的朋友也会建议，干脆这几天不要发文啦，好好休息一下，或者看看书，学习学习，比发文要强。


    我觉得他们说的和做的都有道理。但是我却做不到。


    刚开始写公众号时，我就承诺了当年要做到每周一更。第二年又承诺了一次。第三年虽然没有再公开承诺，但是自己内心里也给自己提了这个要求，每周必须更新一篇。


    所以，不管我去企业调研，还是参与咨询项目，还是陪家人外出旅游，无论如何，我都要保证每周更新一篇文章。虽然有时候上周是周一发的，这周改成周六发，中间间隔的时间长一点，但总是在每一个周一到周日的范围内，一定要发一次。


    最难的两次，一次是在上海参加一个为期一周的领导力培训，只有晚上能写，那篇文章我写到了凌晨五点；另一次是和家人们在境外旅游，总共八天，白天我要安排行程，开车赶路，晚上有点空再赶一篇文章，有天晚上在一个民宿的一楼咖啡馆赶稿，两点多他们都下班了，给我留了一盏灯，我自己一个人、一瓶啤酒，一直到写完才回去睡觉。


    除了公众号文章以外，我也承诺了牛人星球上平均每周一两篇文章。这个承诺是有一点讨巧的，因为我有时候可能一周发四五篇，如果平均的话，下周五我可以不发，也未违反承诺。但是我自已总觉得这样不对，还是要保持更新。所以哪怕上周已经发了五篇，这周即使再忙，我也会尽量保证至少更新两篇。


    于是，黄金周对于我来讲，往往只有一半的假期是有效的。一般来说，至少有三天，我要全天工作，其他四天，也要不是工作一下。就拿这个国庆假期来说，中秋当天和第二天，我都是全天加班。2
    号那天甚至一直写作到半夜十二点，等文章发出来我才回家。


    今天终于有空和家人出来旅游一下，也是趁着孩子们都睡觉，才有时间写一写星球的文章——就是大家看到的这一篇。


    对我来说，这样确实会很累，但是却大有好处。


    熟悉何加盐公众号发展历程的朋友们都知通，我早期业余时间写公众号，由于没有时间好好打磨文章，平时写的文章质量一般，反而是趁假期写的文章，相对出彩一点，2018
    年国庆假期写了《你有多土，就有多穷》，2019 年春节假期写了《浙大郑烨，一个寒门校元的重生》，都是那个时期比较受欢迎的文章。


    后来专职写公众号了，琢磨文章的时间比较充裕了，10 万+的文章分布才相对平均一些。不过假期的文章也还是很受欢迎，例如 2019 年国庆的《比玩手机上瘾更可怕的，是我们在不知不觉中变傻》，2020
    年春节期间的《17 年前阿里全员隔离，马云是怎么熬过非典的》，都有较大的影响力。


    后来我发现，黄金周的时候更文，有两个最大的好处：第一个是别人都不发，你发了，读者就只能看你的。虽然总体上大家看手机和看公众号文章的时间少了，但是内容的供给更少，只要还在保持高质量更新的，反而阅读数会比平时更高。第二个很多日更的大号都等着要找好文章转载，但黄金周期间别人都没有新的作品，我一发文，就比较容易成为那段时间里内容相对较好的文章，特别容易被大号转载，从而引来较多的新增关注。


    这次国庆加班加点发的许家那篇文章，也是发文十几个小时，就突破了 10 万+阅读，而且有很多大号转载，用户数也已经因这一篇文章而增加了 6000 多，并且还在继续快速上涨。预计明天后还会有一些面临“文荒”的公众号来转载。


    所以你看，虽然大环境的变化会使得某个领域的总体红利降低了，但是同时这个领域的高质量供给也减少了，只要你能保证高质量的输出，在这个时候反而更容易出头。


    我认为这个道理不光适用于黄金周是否更新公众号文章，还适用于我们人生和事业中更宽广的领域。


    鲁迅先生曾说：我只不过是把别人喝咖啡的时间用来工作而已。


    这一句话，大家都已经听得很熟了，但是真正去做的，却只有极少数。当你能做到别人都喝咖啡的时候你却在工作，早晚你会脱颖而出。


    ## 每一支成功的花朵，都来自血泪的浇灌


    最近在重温《三国演义》，看到曹操多次差一点就死掉的情景，很是感慨。世人只知魏武帝枭雄抑或奸雄，却不知成就这个“雄”字的背后，是多少次他自己差点捐躯沙场。


    刘邦也是如此。与项羽对战，几次都到了死地，危难的时候老婆孩子老爹全都顾不上，还被项羽一箭射中，鸿门宴的时候更是在鬼门关上打转。白登之围离死亡也就一根头发丝的距离，最后虽然当了皇帝，但还是因为征讨叛军，中箭后不治而亡。


    即说近代以来，教员在秋收时被抓，井冈山几次危机，长征途中处处险境，即便到了延安，也是敌机轰炸不断，胡宗南 47 年扫荡西北时，毛与敌军就在相隔十几、几十公里的地方周旋。更不用说多位亲人遇难了。


    每次看到这样的历史，我就会感叹，成大业者，每一个都是一脚已经踏入了地狱，最终能拔脚出来，才有最终的辉煌。而更多的人，拔不出脚来，就淹没于历史尘埃之中了。


    我们今天能在史册上看到的这些，早就已经是被历史筛选过，千万个当中留下的极少数幸存者。


    其实创业也是如此。


    今天我们看到的那些成功企业家，每一个都经历过企业的生死考验。哪怕是最成功的企业家如马云、任正非、马化腾等，也有过几乎山穷水尽的时候。


    马云三次创业才有了阿里巴巴，期间也多次遇到种种困难；任正非最难的时候整夜失眠，离自杀只有一步之遥；马化腾早年想把 QQ 卖掉，叫价 60 万都无人问津。


    我有时候常常会想，如果我碰到风云际会的时候，即便有刘邦、曹操、毛那样的机会，能有那样的命吗？能有那样坚忍不拔，屡败屡战的性格吗？


    曹操败赤壁、走华容之后，依然数次亲征，哪怕被马超逼得割须弃袍，后面还是亲冒矢石，下汉中，征西川。


    刘邦与项羽战，败了一次又一次，自己多少次死里逃生，回来后又重整军马，翻身再战。当了皇帝之后，还率军北征匈奴，南平叛军，白登虽然未死，蘅西的流矢却没有放过他。


    教员在井冈山，面临几次围剿，地促民穷，军心离散，甚至连好学生都问出“红旗能打多久”这样的问题，他却依然能笑谈“星星之火可以燎原”。


    换做是我们，能做到他们这样吗？


    读三国时看到写刘表胸无大志，刘璋暗弱等等，大家都瞧不起他们。实则是换成世界上绝大多数人，连刘表和刘璋那样都做不到。何况曹操和孙刘。


    今天的世界，并未改变其规律。要想成大功，亦必要经历多次生死。现在不会再有谁来争天下了，但是商业的世界依然如此。


    想要创业，先要有心理准备。你一定会遇到无数次巨大的困难，有些困难很可能是会导致企业濒临绝境的。能够熬过这些绝境，最后方能成功。要想一帆风顺，只能是痴人说梦。


    还是孟子说的那话：天将降大任于是人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。


    与诸君共勉。


    ## 25-45岁，谁不迷茫，谁不焦虑？


    最近收到了不少星友的提问，很多都是关于人生和事业如何选择的。也不时朋友专门过来请我吃饭，聊的都是我现在工作不满意，我想跳槽/创业，该怎么办？


    据我的观察，这个年龄段的人，很少有不迷茫，不焦虑的。我觉得，这既有国民文化的特征，也有时代的特征。


    从国民文化来讲，中国人从来都是上进的。像印度那种逆来顺受和西方那种一切听从上帝安排的传统，在中国虽然不是没有，但总体而言还是要淡很多。


    中国人信奉的都是出人头地，让祖宗显贵，王侯将相宁有种乎，我命由我不由天等等。


    尤其是中国的读书人，更是如此。每一个读书人，莫不想学而优则仕，莫不叹冯唐李广。偶有隐士，大多也是因为对世道已经失望，或者被现实伤害太深，不得已才隐世。


    而到了现代，中国经济急速发展，社会急速变化。一方面，经济发展太快，要过好日子，所必要的花销不断提高，而工资的上涨却总是有限，甚至原来的工作也随时可能被淘汰掉，不由得人们不焦虑。另一方面，每个人的身边，都有无数的机会，都有成功的案例，在吸引着自己，不由得人们不动心。


    从国家之间的竞争和社会的发展来讲，这样是有利于国家的崛起和人民整体的生活水平提高的。但是具体到每一个个体，这样的生活状态和心理状态，却未必能让人们的幸福感增强。


    所以现在中国社会陷入了一个怪圈，国家愈见强大，生活愈见富裕，但是我们的幸福指数却并未同样比例地提升。


    说上面这些，是想告诉大家，你不是一个人。迷茫和焦虑，本来就是大家的普遍感受。


    但这种情况怎么办呢？


    我发现，很多朋友总是希望能找到一条捷径，一劳永逸地解决这个问题。


    但这不现实的。焦虑和迷茫，也许会一直伴随着我们这一代人，怎么都逃避不了。


    你可能会在某一个时间点，短暂地感觉到很满足。但我相信，过不多久，你一定又会有新的焦虑，新的迷茫。


    我们唯一能做的，就是接受它们，并且把它们变成前进的动力。


    如果你觉得焦虑和迷茫，但是却不做任何改变，那么你只会感受到痛苦。


    如果你能够被焦虑和迷茫逼迫，而让自己做出一些改变，那么你的人生就会感觉到一些希望。如果你的改变有了一些进展，那么你的人生就会感受到满足感，你对未来的希望会更加强烈。这时候，正面的情绪，就会压倒负面的情绪，焦虑和迷茫就不再是有害的，反而类似苦口良药了。


    这里的关键，就是动起来。


    如果你有自己特别热爱的东西，不妨把更多时间精力放在这个东西上面。如果这个东西还能为你赚钱，那么不妨逐渐把自己的主业转到这上面来。


    如果你当前并没特别热爱的东西，那么就需要两条腿走路：一方面寻找、发展一个爱好；另一方面根据自己的能力和外界的机会，找到一个能帮助你脱离当前状态的契机。


    如果你已经要决定改变，一定要想清楚，当前让你最不爽的东西是什么？你最想要的东西是什么？你现在想要做的改变，能不能永久性地解决这个不爽的东西，或者让你得到最想要的东西？


    如果做不到的话，还是不要轻言改变。因为最关键的问题不解决，它还是时不时会回来找你。你还是会再次回复到原来的焦虑和迷茫状态。


    ## 极飞考察之旅感想


    昨天，何加盐极飞考察之旅圆满完成，共计 32 位朋友参加了考察，有来自黑龙江的、北京的、陕西的、山东的、江苏的、上海的、浙江的、湖北的、湖南的，还有广东省内的。


    这次考察，我是在极飞彭斌访谈的文章底部发布的报名信息，总共有三百多人报名。其中，加盐星友会报名的成员我们全部优先入团。其他朋友，有来自著名投资机构的副总裁，有数位年营收超过几亿元的企业老板，有大型集团的总经理，更多的是各个领域的创业者，也有少数几位是刚毕业不久的职场新人以及一位渴望改变自身命运的大学生。


    极飞对此次考察非常重视。原本我们只安排了与 CEO 彭斌交流一个小时，但彭斌整整拿出了近三个小时的时间，和大家做了充分的沟通。在交流前后，我们还参观了极飞的展厅、健身区、咖啡区。与极飞公共关系负责人佟巍博士及同事
    Kiki 女士也做了深入交流。


    彭斌用 50 分钟的时间，讲述了自己创业的历程。全程非常真诚，非常开放，充分展现了他激情和睿智。其后，考察团 5 位提问代表从不同角度对彭斌提出了各种问题，彭斌都予以了极好的回答。代表提问环节结束后的自由提问时间里，朋友们争先恐后提问。直到原定时间已经大大超过，依然意犹未尽。


    中午和晚上，考察团进行了两次集体聚餐。中午各自做了自我介绍。晚上则在酒酣的氛围之下，撤掉菜盘，倒上茶酒，摆上瓜子花生，大家进行了两个半小时的茶话酒话会。


    重点谈的是此次交流的感想，以及对何加盐的认识。


    大家的分享最终归结到一点上，那就是彭斌最打动人心的，其实是梦想。此前的采访文章标题就叫做“梦想是摁不住的”，交流中大家又深深体会到这一点。彭斌对梦想的追求，让所有人动容。


    有两位朋友经过交流，摆脱了原来的迷茫状态，找到了下一阶段的人生方向。更多的创业者们，则各有其他的收获。有的是对未来的方向更加明确或更加坚定；有的是努力的动力更足；有的是学到了公司经营、人才管理、合伙人选择以及创业和融资的各种知识、技巧。


    最后结束时，尽管从中午十二点到晚上9:45，所有人都经历了接近十个小时的脑力轰炸和激荡，但没有人觉得困和累，每个人都很激动，都意犹未尽。


    我们会把交流的情况整理为文，发在何加盐公众号上面。以后我也会组织更多类似的活动。


    感谢考察团每位朋友对何加盐的信任和对此次考察之旅的支持及配合。希望大家能够把考察中的所见所闻、所思所想、所获所得，真正用在自己日后的事业中。也希望大家此次考察中结下的友谊，能够给彼此的人生带来更多的温暖和机会。


    ## 何加盐的过往、友谊与梦想


    以下是极飞考察之旅最后的总结发言。我的老同学马桶做了一个较长的讲话，谈了我的过往。我听完整深有感触，也做了一个总结性的回应。


    作为本次考察的组织者，我把这次考察定义为一次“梦想之旅”，希望它给大家带来的，不仅是创业、管理、融资等方面的启发，更有梦想的触动。


    ——————


    马桶的总结发言：


    感谢何老师又给我一个说话的机会，也不敢说是总结发言，就是谈谈感想。


    今天大家去了极飞，大家都说了感想。我刚刚也说了我的感谢，现在我还是谈谈何老师。


    我们是大学同学，还有胖子，我们三个是大学同班同学，然后我们一起从 20 岁成长到现在，我们有半辈子的交情。


    所以今天我坐在这儿，你们在谈各自感想的时候，我就一直在看何加盐何老师，我一直在脑海里放映他不同时期的形象。


    我们刚认识、刚上大学的时候，他是少年；研究生毕业、工作是青年；然后现在坐在这里是一个中年。但是谈到梦想的时候又回到了少年。


    我想谈一下不同时期我们的一些点滴。


    大学时，有两件事情让我的印象特别深。


    大学的时候，我们班是 46 个人，大部分都是农村出来的，所以大家都会去很主动地去申请贫困生的助学金。


    当时我们俩聊天，他一句话，就让我觉得这个人与众不同，这个人比我的格局大。


    他说：大丈夫焉食嗟来之食！


    20 岁刚上大学，几十块钱可能不多，但是对我们来说，几十块钱已经算可以了，能让我吃的好一点，让我有点零花钱。


    但是是一个从湖南平江这样的贫困地区出来了一个孩子，他竟然跟我说大丈夫焉食嗟来之食！

