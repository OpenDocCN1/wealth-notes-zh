    ## 感谢小病


    这两天左手手腕有点疼，所以我现在是处于神雕大侠的状态，只能单手打字。本想给自己再放放假休养一下，但是想星友们可能也等待何加盐的文章等了好几天了，还是忍痛咬牙写一篇吧。


    我想每个人都会承认健康是最重要的，但是当你的身体真正健康的时候，这句话往往只是停留在嘴上，只有当身体某一个地方出现了问题，你才会真真切切地感知到健康究竟有多么重要。


    去年整整一年，我真的是特别感激这一具身体，它没有出现任何问题，让我能够顺利地度过这一年。有时候想，哪一次要是发个烧，那进办公楼都进不了，出去旅游、出差更是不用想了。


    去年自从疫情缓解以来，我们还是按照以前的节奏经常出去旅游，包括到西北旅游了整整8天，然后出差也保持了较高的频率，看了一下航旅纵横的记录，我的飞行里程超过了全国98%的人。而这些没有一个好的身体，根本想都不敢想。还记得西北旅游的倒数第2天，孩子突然有点发烧，我们都非常紧张的，生怕是新冠肺炎，又怕上飞机上不上了，原来定好的行程全部要作废，而大人们即将开始的工作也都没有办法正常进行。好在第2天又不烧了，虚惊一场。


    这一次的手腕疼痛，虽然只是很小很小的毛病，但是也引起了生活的诸多不便。凡是需要两手配合的事情都变得无比艰难——而你根本想不到生活中居然那么多事情都是需要两手配合的，例如拉拉链、尿尿、倒水。基本上半个人都废了。


    更恐怖的是到医院看的时候，医生高度怀疑是痛风。我查了一下痛风的防治，基本上饮食上的乐趣绝大部分都完蛋了，例如所有的海鲜、螃蟹、肉汤、豆制品，都不能吃。更惨的是还要戒酒，尤其啤酒更是不能沾。我甚至悲观地想，那样人生还有什么乐趣呢？还好，下午化验结果出来，不是痛风。


    身体上出毛病，除了给身体带来的极度不适和生活的极度不便之外，更糟的是给精神带来的打击。其实我本身还算是很乐观坚强的人，但是当手痛得厉害，这也不能做、那也不能做的时候，还是会产生很烦躁沮丧的心情。这种心情也容易传导到家里，当我不停唉声叹气的时候，家人的情绪也都好不了。


    但是又想，万一哪一天，身体真的出现了某一些不可逆转的变化，个人和家庭也都只能接受那样的一种状况。这是人生无可逃避的一环，所以真到那个时候也只能无奈接受、乐观面对了。


    我想，也许每年得个一两次小病，也未尝不是一种好事，它至少会提醒你注意身体。如果长期处于健康状态，你很容易就忽视了身体还会出毛病这件事，可能就在饮食上不注意，在心态上无所谓，在锻炼上不在乎。一年生个一两次小毛病，可以你充分的体会到身体的重要性，在饮食上，心态上、锻炼上注意起来。


    人生不会永远一帆风顺，最重要的是享受当下，预防未来，真正碰到事情的时候，乐观坚强面对。


    所以，我很感谢这次开年就得的这一场小病。它也许会预示着这一年我可能要经历一些磨难，但是也提醒我做好准备。


    我已经准备好了。


    ### 人生幸福有时候取决于角度


    在微博上看到一个很热的帖子，说一个妈妈本来是天天逼着孩子学钢琴的，有天突然改变主意，不逼了，因为她看到一个外卖小哥在等餐的时候弹钢琴，突然觉得，孩子就算学好了钢琴，又有什么用呢？还不是一个会弹钢琴的韭菜吗？


    不知道你看完这个，会有什么样的感觉？你觉得一个外卖员弹钢琴，表示这个外卖员学了钢琴，对他的生活没有起到任何作用吗？


    微博大V@东东枪评论道：我的感受恰恰相反。不是“学琴也还是送外卖”，而是，学了琴，哪怕在送外卖，也是发着光的。


    我非常喜欢东东枪的这个评论，因为他提供了一种看问题的不同角度，而且是让人眼前一亮的角度。


    在孩子小的时候，很多家长都会逼着孩子学这个学那个，但是很多家长没有想明白，让孩子学的目的是什么？


    有些家长总会觉得孩子学了这个会对以后提高生活水平、多赚钱有帮助。但我觉得如果是这样想的话，就偏了。因为学这些东西很大概率并不能提高生活水平、多赚钱，只有极少数的人会走上这样的职业道路。绝大多数人只不过是成长为一个会一点琴棋书画的打工仔。


    那么学这些东西就没有任何意义了吗？


    我认为不是的。学任何艺术，它的作用是对于个人灵魂的熏陶，而不是对赚钱能力的提升。当你能从艺术中寻找乐趣，这个学的就非常有帮助了。


    就好比弹吉他，感觉到非常开心，虽然它不会帮我赚一分钱，但是我就是喜欢弹，乐此不疲地弹。这就是因为爱好。


    所以家长在决定让不让小孩学某一个东西的时候，可能首先心态就要放平：学这些不是为了增加一个职业技能，而是增加一个娱乐技能，或者说增加一种陶冶情操的方式。


    如果是从这个角度来看的话，就不存在要去逼小孩学一个东西，而是会选择孩子喜爱的一种东西。如果孩子对某一个东西产生强烈的兴趣，而这个东西又不会对性格、生活造成负面影响的话，那不妨让他大胆的去学。如果孩子对一个东西没有任何兴趣，而这个东西又只是娱乐和陶冶情操作用的话，那根本就没有必要逼着他去学。


    很多人分不清生活必需技能和生活加成技能。生活必需技能是需要逼着孩子去学的，不能说任由他兴趣。当然方式可以引导，例如数学可以激发孩子兴趣，而不是死读书死做题。但本质上这不是一个可选项，而是一个必修项，就必须得认真学好。


    而音乐、艺术等则是可选项，不会这些东西，对未来的生活质量没有任何影响，但是会了这些东西会让未来生活变得更加丰富多彩。说到底它们是锦上添花的事情。


    最后我想说一下，很多事情其实就是一个角度的问题。例如有一个教徒问牧师：请问我祈祷的时候可以抽烟吗？牧师厌恶地回答：当然不行，这是对上帝亵渎。另一个人问牧师，请问我抽烟的时候可以祈祷吗？牧师高兴地回答：当然可以，你随时不忘上帝，真是上帝的好子民。


    还有一个段子是这样说的：一位大学生去当三陪女，我们会觉得无比的惋惜；但是如果说一位三陪女去上大学，我们又会觉得很励志。


    所以回到文章最开头的例子，如果你看到的是一个人虽然钢琴弹得很好，不还是在送外卖吗？你会觉得学钢琴没有任何意义。但是如果你看到的是，一个人虽然在辛苦地送外卖，但是他的生活中还有钢琴，这是多么美好的一件事啊。


