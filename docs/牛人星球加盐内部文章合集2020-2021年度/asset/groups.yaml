    # 史玉柱的选择


    之前写《看不透的曹德旺》时，我曾经写过，每个企业家都是复杂的，不能用简单的一面去定义。


    很多人和我谈过这篇文章，说是第一次看到这种写法：一篇文章不是在夸一个人，也不是在损一个人，而是真实地把一个人的若干面都展现出来。


    我写的时候倒没有太大感觉，听大家说得多了，才去注意了一下，可能对复杂的接受和阐述，正是何加盐文章和别人文章不同的一个特点吧。


    最近在研究史玉柱，更是深刻感受到人的这种复杂。


    史玉柱少年天才，以全县第一的成绩考进浙大数学系，当时的理想是当陈景润。后来见识到了真正的天才，也发现自己对数学并不那么喜爱，就去安徽省统计局当了公务员。当公务员最大的理想，是成为处长，但是因一个偶然机会，到深圳大学读了研究生，被深圳改革开放的氛围感染，开始创业。


    他凭借自己没日没夜开发出来的一款软件，只用了4个月时间，就从一无所有，成为百万富翁。要知道，那还是80年代。


    后来，他的巨人公司很快成长为年收入过亿的企业，开始了多元化之路，并开建巨人大厦。


    此时的史玉柱，觉得自己无所不能，干啥都能成功。业务从软件拓展到硬件，又做保健品、服装、药品。巨人大厦原定盖18层，后来脑子一热再热，一路增加到88层。最终，因为盖楼的资金不够，巨人集团轰然倒塌，账上从拥有两个亿现金，一下子变为欠债2.5亿。


    经受这次打击，史玉柱差点走上自杀的绝路，很长时间才缓过劲来。


    后来，他不再贪大，而是开始走最保守的路，借了50万元，从一个县卖脑白金开始，重新开始创业，最终凭借脑白金的成功而东山再起。


    再后来，他又做了游戏公司，也开始介入投资行业。


    从重新崛起之后，他再也没有失败过，做的所有事情，全都成功了。


    说实话，我此前对史玉柱了解不多，看法持两面：对他的商业才华和抗挫折能力，是很佩服的，但是对他的人品和情怀，不大看得起。因为在我的认知中，脑白金就是个智商税的产品：游戏虽然赚钱，但是社会价值有多大也很难说。所'
  - '[PAGE 198]


    以我一直认为他虽然赚了很多钱，但只是一个让人佩服的人，而不是让人尊敬的人。


    最近了解多了一些后，对他的看法起了一些变化。最主要的促发点是两个：一是他的担当；二是他的坦诚。


    从担当来说，当时他欠债 2.5 亿，是公司债务，法律上来讲，让公司破产就行了，不需要他个人承担。但是他在做脑白金有钱之后，第一时间就先把这些钱全部还清了。在公司内部，巨人集团出现危机后，当时愿意跟着他的人，还有一百多人，他做脑白金，首先也是为了存活下来，给这一百多人发工资。


    从坦诚上来讲，他在各种场合，都是做本真的自己，不做作，不掩藏。日后对当初出事的反思，都归过与自己，认为自己太狂妄，不懂事，不尊重员工的人格，对员工苛刻，对营销的理解不到位，管理上不在行等等，而没有那种“此天亡我也，非战之罪”的感觉。


    这两点对我还是很触动的。虽然说我依然认为，凭他的才能，不管做脑白金还是游戏，都有些可惜，他本来应该可以做出对社会更大的贡献（这里不是说他现在这样就对社会没贡献，他解决的就业，缴纳的税收，游戏给人带来的快感等等，都是他做出的贡献；我只是说，他本来可以做出的贡献也许是
    10，而他选择的路，让他只做出了 3）。但是每个人有自己的选择，他选择了这条路，对他本人也许是最好的，最合适的。


