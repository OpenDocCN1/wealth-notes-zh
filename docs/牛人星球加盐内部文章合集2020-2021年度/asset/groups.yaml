    ## 大势预测与创业机会


    国的机会而选择了美国，那么未来大概率是后悔。


    所以我们有时候看一个人说话是否靠谱，可以多看他说的大势是否靠谱。有一些具体的细节预测是未必准确的，但是只要方向正确，就可以作为重要参考。


    从创业机会上，有哪些大势预测呢？


    我这里说几个吧：


    - 视频表达的重要性会越来越超过文字表达。虽然文字永远不会消失，但是它毫无疑问会相对衰落。现在在文字平台上创业的人，如果没有超强的文字表达能力的话，应该坚决果断地朝视频平台转型。而有文字创作能力的人，也不妨把视频平台作为一个方向。


    - 在视频平台上，微信短视频、抖音对内容创作者是一个很好的表达平台，但不是一个很好的创业平台。因为短视频的个人 IP 属性太弱，算法和平台的力量太强，其会把“每个人都有机会红，但是只能红
    5 分钟”这种现象发挥到极致。在这两个平台的人会发现，即使你积累了很多粉丝，实际上却没有太大的价值。这两个平台的价值附着在爆款文章身上，而不是创作者身上。创作者可能上一个视频播放量上千万，但是下一个又会降低到几万。所以它对创作者的激励没有持续性。对个人
    IP 比较友好的还是公众号、微博和 B 站。


    - “正能量”的内容会越来越受市场欢迎。不管是生产和销售个人消费品的商家，还是做内容创作的创作者，都要顺应这个潮流，不然就会被市场抛弃。


    - 电动车一定会取代油车，这个过程不会很长。5 年内会形成潮流，20 年内会基本完成。


    - 电动车的关键技术突破是能源，具体而言是电池。但是其使用场景的关键突破是自动驾驶。未来的电动车就是一个无人驾驶的机器人，有良好的人机交互。


    暂时先说这几个吧。希望对大家有所帮助。


    ## 善良的勇气


    做一个善良的人需要勇气吗？


    很多人可能会觉得，善良是一种品质，是一种选择，是人性的自然流露，并不需要勇气啊。


    但真正遇到事情我们会发现，其实很多时候，善良是需要勇气的。


    一者，你要过自己的心理关。


    内向的人在要做好事时，会害怕别人异样的目光——哪怕是赞赏的。例如，在公交或地铁上，看到老人没有座位，想要让座，内心就会挣扎。这种挣扎并非该不该让，而是一开口就会把别人的目光集中在自己身上，内向者就会为此而感到恐惧。如果老人就在自己的座位旁边还好，如果是隔了好几个座位，要大声喊他过来的，那就更是艰难了。


    二者，你要过说服别人的关。


    不同的人对善良的感知不同，你的善良在别人看来可能是迂腐甚至荒谬的事情。这时候你要善良，就要被别人不理解。例如，有一次我和马桶、胖子在一个农户家调研，这家农户在院子里拉了个捕鸟网，有好几只麻雀被挂在上面挣扎。我们看了特别于心不忍，很想把麻雀放了，甚至把网子给撕了。但是人农户对我们热情招待，我们要去救麻雀或撕网，却说不出口来，只好在回去的路上自己懊悔和痛恨自己。


    三者，你要过别人的利益关。


    善良有时会损害别人的重大利益。例如在一家化妆品或保健品公司，你明知道产品对客户没有任何作用，一块钱成本的东西卖两百块钱。你觉得这不善良，想要公之于众，让消费者不要再上当。但是这会损害公司的利益。老板损失重大，员工可能失业。在官场上就更这样了，你一个人的善良，可能会让别人无法上位、或者无法得利，甚至通过对比显得别人很罪恶。别人有可能必须除掉你才安心。


    四者，你要过自己的利益关。


    善良意味着你要选择做某些事，不做某些事，或者一件事这样做，而不那样做。这就涉及到巨大的个人利益。很可能你用甲种做法，没有乙种做法那么善良，但是赚的钱要有很多倍。这是要你放弃甲种做法而选择乙种，就尤为艰难。如果甲是明显的恶，那可能还好选一点。但很多时候，甲也并非很严重的恶，只是没有乙那么善而已。


    五者，你要过善与善的比较关。


    有时候，善与善是互相冲突的，此种善良会妨碍彼种善良。这时就尤为考验一个人的智慧和价值观。例如，今天孩子过生日，你回家陪孩子是一种善；但是你负责管理的电网发生了故障，很多人家里都停电，等着你去抢修，你去抢修电路也是一种善，其他电工都已经各有各的工作安排，现在只有你一个人能去。这时你该如何抉择？如果说取消陪孩子过生日的安排还相对好处理的话，那么如果是老婆生孩子呢？如果是父母病危呢？


    更大的善与善的冲突，是短期善和长期善的比较，对此人善与对彼人善的比较，以及小善与大善的比较。


    一个小孩犯了错，你原谅他，说没关系没关系，让他不要有心理负担，维持现在开心的心情，这是短期善，但有可能会纵容和鼓励他未来一犯再犯，从长期又是不善的；你严厉批评甚至惩罚他，让他哇哇大哭，这看起来很恶，但是他有可能长了记性，以后再也不犯，这在长期又是善的。


    一个农业国要发展工业化，为了积累原始资本，只能压制农民的生活质量，对农民而言是不善的；但是工人的生活却相对有保障，其福利享受与农民完全是两个世界。


    一个社会要保持和平安宁，要对内镇压坏蛋，对外准备战争，人们要为此节衣缩食，刑法上会比较严峻，战场上会死很多人，这些看起来都不善，但是对整体人民而言，却又是必须要的大善。


    最典型的例子是《三体》里面的程心。她是善良的集大成者，是人类至善的代表。但正是她，两次造成了人类的毁灭；反而是她极力反对的恶，却拯救了人类。这时候，我们要说程心是善还是恶呢？


    所以，善良并不简单，它涉及到无数的平衡与计算。我们有时候会说从心而行，“从心”二字，又何其难啊！


    ## 牛人的臭脾气


    苹果的乔布斯、亚马逊的贝佐斯、特斯拉的马斯克、华为的任正非、格力的董明珠，都是脾气特别暴躁的人，动不动就对员工发火，把他们骂得狗血喷头，有时甚至会拍桌子，摔杯子，摔手机，砸门等。


    以下是贝佐斯对员工们咆哮时喊过的一些话，大家感受一下气氛：


    - 你到底是懒惰还是无能？

    - 如果你再让我听到这个主意，我马上自杀。

    - 连这么简单的问题你都搞不清楚，难道不感觉羞愧吗？

    - 怎么，我今天看起来像吃了傻瓜药吗？（你为什么要这么糊弄我）

    - 要不要我下楼去拿 CEO 的工作证给你看？

    - 你就是一个十足的大傻瓜，我不知道公司为什么要招你这样的大傻瓜！

    - 你们为什么要这样浪费我的生命！？


    乔布斯也特别喜欢对业绩不佳或者不能理解自己话语的高管咆哮，有一次在电梯里直接开除人；微软的 CEO 鲍尔默一发脾气就摔椅子；英特尔的 CEO 安迪·格鲁夫曾经在会议上大发雷霆，以致一名高管当场昏厥。


    可以想象，员工见到这样的领导，就跟老鼠见了猫一样瑟瑟发抖。每次和他们面对面的结果，都是觉得当天就要被辞退，或者恨不得当下就辞职走人。


    为什么这些牛人，脾气都这么臭呢？


    我觉得，除了他们本身性格的缺陷外，也有一些共性的原因。


    第一是他们真的着急。


    这些牛人们都是志向远大，任务紧迫的。市场竞争瞬息万变，互联网时代玩的就是速度，所以他们的压力无比巨大，自己恨不得每天把自己分成八瓣，也尤其受不了别人不能按照自己预期的效率去做事。如果一个关键节点，公司的动作比别人晚一天，可能就是几十亿美元的市场被别人占领。如果高管在这种情况下跟不上链子，可以想象其内心的焦躁程度。


    我们普通人着急起来也想骂人，何况是这些肩负着几万、几十万人身家性命，甚至胸怀人类未来的牛人。


    第二是很多牛人无法理解常人的智商和能力。


    很多事情，在牛人看来，是如此之简单。如果做不到，肯定是态度有问题。但是牛人们很难明白，同样的事情在普通人看来，如登天般难。做不到不是因为他们不努力，而是因为智商和能力确实不行——这个不行并非真的不行，比起社会平均智商和能力，这些员工可能已经远远超出了，只是比起牛人们的预期，还是相差一大截。


    很多牛人都有智商和能力上的优越感，对于智商或能力不如他们的人从内心里是鄙视的。只不过有的会稍微掩饰一下，有的却是好不掩饰的鄙视。例如乔布斯、贝佐斯、马斯克，就直接会鄙视下属的智商。他们也无法容忍一个笨蛋待在自己的身边。


    第三是他们觉得发火是管理的一种方式，并不想压制。


    很多时候牛人不想和下属争辩，只是想自己的意图贯彻下去。这时与其解释半天，不如直接发火让对方照自己说的做就完了。


    还有时候，发火就是表明对某件事情不满，让人赶紧重视起来。温言细语可能就起不到作用。


    第四是长期处于权威地位的腐蚀。


    这一点就是人性的弱点了。牛人们长期处于对别人予取予夺的位置，很多时候已经不屑于或者没有时间去考虑下属的感受，他就是享受这种感觉，想发火就发火，就因为他是老大，别人都得听他的。


    当然，前面三个因素会多一点。很少有人会享受让自己的下属瑟瑟发抖的状态，他们更多还是希望把事情做好。用乔布斯的话说：我喜欢和聪明人打交道，因为这样就不用顾及他们的脆弱的自尊。


    看的出来，乔布斯并不喜欢蹂躏别人的自尊，他想要避免这一点。而聪明人能够和他一样，把眼光专注在事情的推进，而不是自己的情绪上面，所以更对他的胃口。我相信这也是所有这些老板们共同的心声。


    当然，上面说的这些老板们，他们有发火的资本。他们自己足够聪明、足够能干，也给了自己的下属足够的金钱、名位、成长机会等。


    在现实生活中，有一些小老板，自己屁本事没有，给员工的也很少，却总爱对员工发火，这种就是既蠢又坏，难成大器。


    ## 人们的渴望与短视频的隐忧


    那天在微信总部参加内部交流，张小龙花了大量篇幅讲短视频的发展蓝图。其中提到很多次，说希望让每个人都能轻松表达。


    说实话，我听了以后很受鼓舞，但是同时又隐约感到有点不对劲。


    很受鼓舞，原因是看到张小龙这个梦想很大。我们每个人都想要表达，但是以往只有极少部分文人才会表达，后来自媒体时代来了，很多有初中以上知识的人也都能够自如地在网上表达。但能够用文字表达的毕竟还是不多，而拍个照片、拍个视频，却是人人都能够表达的方式。


    但是那种不对劲的感觉一直都在折磨着我，所以我有好多天都在思考，到底哪里不对劲。


    后来发现，其实也许我们之前理解错了：人们的渴望，并不是表达出来，而是被倾听和被认可。表达只是一种方式，被倾听才是内在。


    如果要说自由的表达，那我们每天都可以，不管是自说自话，还是写日记，都是在表达。但问题是，这样的表达没有人听。


    后来我们有了BBS，有了博客，有了微博，有了朋友圈，每个人都有办法在公众场合做一些表达。但问题是，我们表达的热情，和被倾听的程度极其相关。每次发表了东西，我们都会去关注，有多少人阅读，多少人点赞，多少人转发，多少人回复。如果发一个朋友圈，过了很久都没有一个人点赞，我们就会很沮丧，渐渐地就不想发了。如果每个朋友圈都有很多人点赞，我们就会很开心，也就会有继续发的动力。


    对于以表达为生的自媒体人更是如此。如果发一篇公众号，没有多少人阅读，没有多少人转发，不能带来粉丝，那么用不了多久，这个人就会因失望而灰心，最终停止表达。


    所以，公众号虽然想要做到“再小的个体，也有自己的品牌”，但实际上，当这个个体没有人聆听时，他也就不可能拥有品牌。就算表达得再多，他的品牌也接近于零。这么多年来，通过公众号树立品牌的，毕竟是极少数。


    视频号也会遇到同样的困境。每一个短视频的平台，都要面临着一个取舍：是扶持大V，还是扶持草根。互联网流量的特点就是马太效应和二八法则，流量会越来越少，少数内容中集中。


    如果是扶持大V的平台，创作者的IP属性就会比较强，变现能力也比较强，但是格局容易固化，在经过几年的演化后，新就很再出头了。绝大多数的人都沦为小透明，不管发什么，没有人看到，只有大V的东西不断掠过我们的眼球。微博、公众号、B站都偏向于这一类。


    如果是扶持草根的平台，对于新人比较友好，一个刚注册的号，也能够通过系统的设置和算法的推荐，被一些人关注到，甚至有可能形成爆款，而在全网红火几分钟。但问题是，这样的平台个人IP属性较弱，每个人都有可能红，但是每个人红的时间只有很短。这就是抖音和今日头条的困境：某人因为一条或几条爆款，粉丝剧增，但是不久又会发现，爆款带来的效应用光了，视频曝光量和点赞数又回归到惨不忍睹的境地。结果就是：新人不断地进来，但是老人不断地失望。


    在互联网上：“每个人都想表达”和“只有少数人能被告听到”是一个永远的矛盾。因为我们的注意力就那么一点，注意力只有聚焦，才有商业价值，如果是完全分散，那就和日常自言自语的表达没什么两样。问题是聚焦到哪上面。如果聚焦到人，那么人就有动力，可以通过聚拢大量的粉丝，形成自己的影响力，但是这仅局限于少数幸运儿能够持久地获利；如果聚焦到内容，那么新人就会有所全盼，新的内容也会不断出来，但是人没有IP属性，稳定性就不高，粘性就不强。


    所以张小龙要做短视频，也必然面临这个矛盾。我不怀疑他想让每个人表达的意愿和能力，但是却怀疑短视频能否做到让每个人都被听到。如果只有表达而没有被告到，那么表达的愿望最终一定会消失殆尽。


    当然，视频号有一个比较好的地方，就是可以借助微信里已经沉淀的社交关系，一个人做视频号，不需要有很多人关注，也可以通过发朋友圈或者微信群，而强迫性地让自己社交圈里的人看到，所以怎么都能保证有一定量的聆听。


    但是对于创作者而言，如果是想要通过这种方式聚集流量，形成商业利益的话，最终也只会是少数幸运儿的游戏。也就是说：让每个人都能顺利地表达，最终的结果仍然是，只有少数人能被很多人听到。


    ## 打造自己的飞轮


    我们生活中常有这样的经验：有一些事情，需要花费特别长的时间，付出特别多的代价，才能有所收获。但是一旦事情成功了，后面就不需要再花多少时间和代价，它自己就会运转得挺好。如果你再为它付出时间和代价，那么它就越运转得越来越快、越来越好，给你带来越来越多的利益。


    这种效应，被称为“飞轮效应”。


    现在全世界最大的电商公司亚马逊，在 2002 年前后曾经遭遇重大危机。当时股价回撤了 70%，内部管理一团混乱，人员离职率超高，投资人对其前途疑虑重重。


    当时，虽然杰夫·贝佐斯本人依然是信心满满，但是压不住市场、员工、投资人无法像他那么笃定啊，所以也很愁得慌。


    后来他看到了一本书，吉姆·柯林斯的《从优秀到卓越》。


    这本书是一 本管理学名著，畅销全世界。何加盐做咨询时，也曾特地买来学习过。说实在话，从现在的眼光看，书并没有之前夸耀得那么好。柯林斯精心挑选出来、作为“卓越”样本的
    11 家企业，也并非都发展得好。


    例如，房利美在次贷危机期间几乎破产，后来被政府接管，并从股市退出；吉列公司经营不善，股价大跌，后来卖给了宝洁；电器城公司则受到互联网的冲击，直接破产。


    但是这样的书籍却有一个好处，哪怕作者举的例子是错误的，其中的理论或者建议，却依然还是有用的。


    当时贝佐斯看到这本书，大为惊喜。特地请柯林斯作为公司的管理顾问，参加公司的管理会议和董事会，讲解一家公司如何才能从优秀到达卓越。


    柯林斯指导贝佐斯和亚马逊的团队重点探讨了飞轮效应，让贝佐斯大开眼界。虽然他此前心里可能已经这么想了，但是柯林斯第一次把这个想法用专业名词包装，用系统化的语言总结出来，从而具有了现实指导意义。


    贝佐斯带领团队重点研究了亚马逊公司的飞轮效应，最终确定了公司未来的发展路径：用低价吸引顾客，顾客越多意味着销量越高，销量越高也就越吸引中小商家到亚马逊开店，亚马逊的基础设施支出成本就更加分摊，效率也更高，而更高的效率和更低的成本又可以进一步降低价格。


    他们的最终结论是：任何一个飞轮只要运转好，就能加速整个循环过程。


    根据贝佐斯传记作者布拉德·斯通的描述：知道飞轮效应，并且用飞轮效应分析了公司后，亚马逊的高管兴奋不已。他们感觉，经过了多年的锤炼，公司终于领悟到了经营的法则。


    当时公司正在编写需要向外披露的财务报表，负责人问贝佐斯，我们要不要把飞轮效应写进报表？言下之意是，如果报表里披露了公司的运行法则，一定能有助于打消投资人的疑虑，对股价上涨大有好处。


    但贝佐斯制止了。他说，这是我们的秘密法宝，别让别人知道了。


    所以可见，贝佐斯对飞轮效应有多么看重。


    此后，亚马逊的发展，一直遵循这飞轮效应的原理。贝佐斯对公司的战略考虑，常常会从是否有利创造飞轮、推动飞轮更好运转来出发，而不是紧盯着短期的股价和利润。


    对我们普通人而言，飞轮效应也是一个非常重要的概念。


    日常生活和工作中，有一些非常重要的事情，是需要花大力气去启动的，但是一旦启动，会给我们持续不断地带来莫大的好处。这时候，就需要我们有耐心，坚决地花大力气去推动。例如学会一门好的技能、打造高质量的人脉圈、积攒有用的人脉。


    创业、管理公司以及我写公众号，都应该关注飞轮效应。例如我写公众号，平时需要关注的，就不是一条广告要不要接，而是一件事情是不是有利于打造一个飞轮，或者有利于推动原来的飞轮。多写好文章积累更多更高质量的用户，创立牛人星球给用户提供更高的价值，拉近和大家的距离，都是有助于发挥飞轮效应的。未来也许会再做视频类的尝试，也是一个新的飞轮。


    今天的文章只是对飞轮效应的一个简单介绍。大家可以通过百度、知乎、公众号等渠道，去了解飞轮。同时对照自己的工作与生活，寻找或打造自己的飞轮，让它转动起来，越转越好。只要飞轮转起来，你以后就会越来越轻松，越来越容易成功。


    ## 对网络消息多一个心眼


    前几天，很多媒体在热炒一个新闻，说陕西某景区宰客，4根面条就要卖15块钱。


    听了这个新闻，很多人想必义愤填膺，觉得这家店确实是太坑了，怎么能4根面条就卖十几块钱呢？说实话，我们每个人都曾经是游客，也都见识过景区的物价比较贵，甚至有可能本身就被宰过。所以，这样的新闻，很精准地戳中了我们每个人的痛点，自然就唤起了我们的情绪。


    现在网上的很多新闻，都是非常精准地瞄准大众或小众的这种痛点和痒点的。我们生活在世上，置身于这个社会，总会有很多不如意，总会遇到很多令我们不爽的事情。而部分无聊的人和媒体，就是每天拿着放大镜来寻找这样的例子，来挑动看客的情绪。


    而其中有很多，就是故意没事找出事来，甚至是完全捏造的。这些年来，我们在网上上过的类似的当，数不胜数。


    就如上面这个例子，如果去过陕西，吃过大碗宽面的，就不会上这个当。


    我在陕西吃过的一种面，里面的面条就寥寥几根，但是碗比脸盆还要大，面有我的胳膊那么宽，一根可能就有一两多重。这样的面条，如果4根卖15元，我简直要乐开了花。为什么呢？因为太便宜了。你要是不信，可以看看我在本文底部贴的照片。


    在十几年前我看过的一部电视剧《暗算》，里面有一个情节。王宝强饰演的阿炳被选中要去干革命，临别前，妈妈给他煮了“一根面”。我记得当时我们看到这里时，都哄堂大笑，因为妈妈的台词是：“这一根面啊，就是碗里面只有一根面”。我们觉得这不是废话嘛，要不然为啥叫一根面。所以记忆特别深刻。


    这样的一根面，其实是特制的，很长很长，一根就有一大碗。但如果被上面新闻爆料的那位坏心眼游客和无良媒体知道，说是某黑心店家一根面就要卖十几块钱，可能轰动会更大。


    所以我们就知道，有些人明明知道事实，但就是故意要利用大多数看客不明就里，故意去挑事儿。当你去戳穿他时，他还能振振有词地说：我是客观报道，说的全部都是事实啊！


    这些年，我旁观了很多次网络事件，早就看明白了，在绝大多数情况下，所谓的“事实”，其实并不是事实。事件的两方，都会片面地把有利于支持自己观点的事实摆出去，而把不利于自己观点的事实隐藏起来。尤其是重大社会舆论事件或者国际舆论事件上，更是如此。


    而令人忧心的是，网络上的信息茧房愈演愈烈，人们根本就不愿意去关注和自己价值观不相合的人或媒体。一个人所能接触到的信息，往往就是持续不断地只支持某一个观点的片面信息，而这个人还会以为自己看到的就是铁的事实，而对之深信不疑，对于反面的事实全都看不见，或者看见了也视而不见。


    所以人与人之间越来越决裂，社会被割裂为一个一个的不同群体，互相之间斗得不可开交，都以为自己掌握着事实和真理。不管是女权、环保、动保，还是更大一点的人权、政治、国际关系等，都是如此。


    作为看客，我们首先要明白，事物有两面，事实有多个角度，不能只看一面，只听一方。要更好地了解这个世界，少上当受骗，少被坏心眼的人和无良的媒体当成炮灰，就有必要多点怀疑，多点耐心，擦亮眼睛，把事情看得更全一点，再得出自己的结论。


    下面两张图。第一张图是何加盐和面的合影（注：后立者是何加盐）。第二张图是同一个场景在不同角度的拍摄效果，上面可以配文说，“这个地方疫情防控太差了，这些人真不知死活，这么密集地聚在一起”；下面可以配文说，“这个地方疫情防控太好了，这些人素质真高，排队都知道相隔这么远。”


    都是事实，就看你一张嘴怎么说。

    '
