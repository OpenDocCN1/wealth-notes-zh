    # 对快手和微信短视频的一点思考


    微信张小龙和快手宿华都表达过一个愿望：希望帮助每一个普通的个体更好地表达。宿华多次说过，快手希望让每个人有机会表达，有机会被看见，让沉默的大多数可以不沉默。张小龙今年的微信公开课讲的也差不多是这样个意思。


    这个愿望很好，但是却很难实现。原因在于，表达不是个体的需求，被看见才是。而互联网最关键的资源——注意力是有限的，不可能被分发到每一个个体。所以绝大部分的个体注定是透明人。


    根据宿华提供的数据，2020 年快手产生了约 130 亿条视频，有 9.6 万亿分钟的消费时长。简单计算可知，每个视频共被观看了 738 分钟。按照平均每个视频
    30 秒计算，也就是平均每个视频被观看了 1477 次。


    但是由于互联网流量会天然地向爆款内容集中，二八效应体现到极致，实际上绝大部分内容的浏览量是远远小于这个数字的。我们假设 5%的爆款内容集中了 95%的注意力（这个数字只会低估，肯定不会高估），那么简单计算可知，5%的爆款内容平均被浏览了
    7 万次左右，95%的非爆款内容平均被浏览了 78 次。


    只要在快手、抖音或短视频发表过内容的人就知道，78 个浏览量，完全就是个透明人。点赞数基本上是 0，或者最多两三个。对于内容创作者来说，这样只要发过几个视频后，就会觉得没意思了。原因很简单，没人看。


    所以张小龙和宿华的这个愿望是美好的，但在现实中是不可能实现的。用户的注意力资源有限和每个人希望被看到的愿望无穷，二者之间是一个不可调和的矛盾。


    快手的做法是通过社区化的运营来提高创作者和围观者之间的粘性，但是随着快手改版，越来越像抖音，这个社区化的功能已经大大的弱化了。快手早就已经不是你原来宣称的那个样子，未来普通人在上面要被人看见，感受到自己独特的幸福，会越来越难。


    张小龙的做法是利用微信天然的强关系，增加了朋友推荐的作用，并且可以通过发朋友圈发微信群“强制”自己的好友看见。这样会让普通人发视频的动力更强一点，但普通人也仅限于强关系之间的联系，而可能成为被更多人看见的大
    V，这些普通人想要把视频号商业化是很难的，实际上还是消耗自己的强关系。'
  - '[PAGE 311]


    # 格局与前途


    快手的创始人其实不是宿华，而是程一笑。


    2011 年，程一笑创立了 gif 快手，并从晨兴拿到 200 万人民币投资。这原本只是一个制作 gif 动图的小工具。当时正是微博红火的时候，微博没有视频功能，只能发图片和文字，所以这种动图很受欢迎。包括何炣等名人也都在用它来制作动图或者发别人用它制作的动图。所以
    gif 快手的日活一度做到挺高。


    但是这种工具型的软件，留存和变现是很难的，当时程一笑怎么都找不到出路。到 2013 年的时候，他的融资基本上快花完了，未来也不知道该怎么走。去找了很多投资人，但是因为程一笑太过内向，不善言辞，根本就画不出大饼，投资人都拒绝了他们。


    后来投资人张斐介绍了宿华跟程一笑认识。宿华当时已经是业内非常有名的程序员了，张斐跟程一笑说，我们想拉他进来，不多让一点利是不行的。程一笑说没问题，只要能把公司搞好，我情愿他来做
    CEO。


    原本快手的股权结构是程一笑创始团队（共 4 人）占 80%，投资人占 20%，他们各自拿出了一半给宿华的团队（共 7 或 8 人）。也就是说宿华等人可以分配其中
    50%，而程一笑等的股权则降到了 40% 以下。


    于是宿华成了快手的第一大股东，同时还成了快手的 CEO。程一笑则担任首席产品官。


    宿华进到团队后，迅速改变了产品的方向，往社区化、视频化走。经过一段时间磨合后，很快快手走上了正轨，并且去掉了前面的 gif 字样，直接改名为快手两字。


    由于宿华在业内的影响力以及他的表达能力，此后快手不管是融资还是招揽人才，都要变得容易很多，快手的发展终于走上了一个快车道。


    我们可以非常肯定地说，如果没有宿华加盟快手，快手不可能发展到今天这样的规模。所以今天我们看到快手的所有介绍，都是说其创始人是程一笑和宿华。而不会因为程一笑创立了公司，宿华是半路进来的，就不把宿华称为创始人。而且这里要注意，宿华的创始人头衔前面，没有“联合”两个字。


    类似的例子也曾经出现在李想身上，李想当初创立汽车之家，觉得自己的管'
  - '[PAGE 312]


    理太弱了，就想找一个人来帮他一起做，后来找到了秦致。他当时也是跟投资人说可以让出大股东和 CEO 的位置。当然最后没有让出，但是也给秦致很大的股权比例以及管理权力。秦致的加盟让汽车之家的管理上了一个台阶，后来顺利上市。


    但可惜的是当时李想让给投资人和其他高管的股权比例太多了，完全丧失了控制权，后来因与投资人理念不合，李想不得不辞任汽车之家的董事长，出来另谋出路。


    现在快手的第一大和第二大股东其实是腾讯和五源资本，但好在不管是腾讯还是五源都是非常克制的投资人，他们不会过多地干涉创始团队和管理层。所以虽然宿华和程一笑占的股份比例都不是最高，但他们却对快手的发展有相对较好的控制权。


    不过我相信投资人的压力还是非常的大，这体现在快手在前两年跟抖音的竞争中，不得不放弃了很多原来快手坚持的做法，而向抖音靠拢。我们今天打开快手，会发现它跟抖音越来越像。尤其是“精选”那个栏目，基本上就是抖音的复制。


    作为创始人，运营一家公司是容易有自己的短板的，例如管理、技术或纯粹的个人魅力，有时这些短板甚至是致命的。这个时候，如果创始人非要坚持说公司就是我自己的，而不愿意以较大的格局去让渡利益、让渡权力招揽人才，那么这个公司的发展可能就到他这里为止了。但是如果创始人有足够大的魄力去找一个真正的高手和他共事，是有机会创造更大的事业的。当然要找到一个能让你格局这么大的人不容易，但首先也得你先有这样的格局，才会有这样的心去找这样的人。'
  - '[PAGE 313]


    # 短视频的“彩票机制”


    前天写了关于短视频平台的一点思考，其中我用快手的数据算了一下，小透明用户的平均浏览量很低，想让每一个普通用户保持记录的动力，是很难的，因为他们大概会会因为无人欣赏而停更。


    不过继续深入研究下去，发现其实有一种动因是可以让他们保持分享动力的，那就是“彩票机制”。


    我可以持续发 100 条零点赞的内容，但是我会想着，万一其中产生一条爆款呢？那不就一下子火了吗？


    这非常类似于买彩票中大奖的心态，我可能买了 100 次都没有中奖，但是万一其中哪一张中了百万、千万呢？


    所以在这种赌博心态下，就会有很多普通用户虽然无人关注，但仍然不断地往上传统视频。这种机制在抖音上似乎更明显，因为有很多素人就是因为一条视频而爆火。


    但是快手上似乎更强调稳打稳扎，慢慢地积累粉丝。


    我不知道快手在设计流量分发机制时有没有考虑这一点。但是如果快手真的想做到激励每一个普通用户都去记录和分享，那么它可以采用这种方式保持小透明的动力。例如每天拿出一小部分的流量，随机分配给某个或者某几个“小透明”用户，让他们也体会一下突然爆款的感觉。


    其实这种都不需要做成超级爆款，例如平时浏览量 50 的，能够浏览量超过 10 万甚至只要 1 万，他们可能就很满足了，就是以保持足够的动力了。


    快手官方也可以设置一些门槛，例如只有连续发布视频 10 条或者 50 条以上的，才能享受这个幸运池。


    当然也许快手已经采用了这样的方式，只是我不知道而已。'
  - '[PAGE 314]


    # 所谓财富自由


    最近胡润研究院发布了一个所谓财富自由的标准, 大概意思是一线城市财富自由的入门级为资产 1900 万, 家庭税后收入 60 万; 二线城市入门级别财产 1200
    万, 收入 40 万; 三线城市入门财产 600 万, 收入 20 万。除了入门级以外, 后面还有中级和高级, 我就不说了。


    胡润确实很会抓当代社会的痒点。我们且不说他这个是不是准确, 但起码一出来就引起了热烈的讨论。你看就连何加盐都在这里关注这个话题。


    从他说的这些数字来看, 入门级的财富自由, 虽然财产要达到那个数比较难, 但是家庭税后收入达到这个数的还是有很多的。不过我们且不讨论这个数字吧, 就说一说财富自由到底是个什么概念,
    以及我们要如何去追求。


    所谓财富自由其实没有一个统一的定论, 主要还是看各人自己心里的感觉。如果你要说财富自由是可以随心所欲地购买自己想要买的任何东西的话, 那这个世界上谁都无法达到。就算富如马云,
    也有他买不起的东西, 例如他想买腾讯就买不了。当然关于政治或者技术达不到的, 咱们且不讨论, 只说用财富可以影响的事情。就算是这样还是有很多无能为力的地方。


    但如果说的是供自己日常所需, 必要的衣食住行能够被自己的财富覆盖, 其实这个是相对容易达到的。现在对一线城市的人来说, 除了住房贵一点, 其他的都没有问题,
    无非就是个档次问题。


    如果说是可以自由地选择日常消费的档次, 例如买车可以不费力地买兰博基尼、迈巴赫, 买水果可以买最好的车厘子、草莓, 喝酒可以喝最好的茅台、拉菲, 吃菜可以吃最贵的鱼子酱、黑松露,
    这个可能相对更符合大众心中对财富自由的一个比较公约数的标准。


    但我认为财富自由这个概念其实存在于人们的内心, 其最关键的指标就是你的财富和需求是否匹配。


    你觉得现在的财富和收入水平可以满足你的需要了, 那你这财富就自由了; 你觉得现在的财富和收入水平还达不到自己的要求, 那就是没有自由。


    从这个角度讲, 有可能一个人年收入 5 万, 应付他的消费欲望只需要 3 万, 然后他内心感到非常知足; 而另一个人年收入 500 万, 应付他的消费欲望需要'
  - '[PAGE 315]


    600 万，然后他内心无比的焦虑；那么我们可以说第 1 个人财富是自由的，第 2 个人财富是不自由的。


    另外一个关于财富自由的概念与我们对未来的不确定感有关。


    80 年代的国企员工和体制内人员，相对幸福感会更强一点。因为他们认为未来是确定了，尽管他们到手的工资可能不高。


    而那些因各种原因被迫在市场上自己打拼生活的人，则可能需要达到国企员工和公务员收入的好几倍，才能感到满足。


    其实现在也是。一个年薪百万的互联网工作，跟一个年薪 30 万的体制内工作，有很多人可能还是会选择体制内。因为体制内给他提供了安全感，而 100 万的收入，却不知道什么时候可能会被淘汰。


    所以我们去问一个互联网的员工和去问一个公务员对于财富自由的看法，他们的标准也都是一样的。


    这样看来，财富自由其实跟不同时间点人们的不同心情也有关系。当这一刻你感觉到自己自信心爆棚，对当下的生活比较知足，你可能就觉得财富已经自由了。而换一天，你可能正好在事业上或者工作上遇到了打击，然后自信心全都没有了，恰巧你个人或家庭又对物质有一个超出你个人能力的欲望，那你肯定觉得一点都不自由了。


    从本质上来讲，财富自由不是以积攒多少财富为决定，因为财富是会失去的，有可能会因为通货膨胀或者你运气不好，投资失败等原因而丧失殆尽。更关键的因素是你持续赚取收入的能力。


    如果你觉得凭借你的能力，随时都可以赚取到你的消费所需，那么从本质上你是财富自由的。


    这就意味着我们如果想要实现财富自由，最重要的是两点：第一，打造自己持续获得财富的能力；第二，修炼自己的平常心，降低对物质的欲望，做到知足常乐。'
  - '[PAGE 316]


    # 在一个“互害”的世界，培养互爱的能力


    在现实生活中，很多人可能会对这个世界充满了戒心，认为谁都是时刻想占自己的便宜，谁都是时刻处于自己敌对的位置。


    有些人上街买个东西，出门打个车，到旅游景区吃个饭，请人上门来通个水管或者挪个家，总会觉得别人就是要多从我们这里骗点钱，总是一开始就怀着对方审视戒备的一种态度。


    我不否认现实社会中，跟你产生交易关系的对方有可能会想多从你这里赚一点钱，但是这并不是一种对立的关系，只要你自己内心能放宽心一点，让对方多赚一点也都没有关系。


    如果老是觉得别人要占自己的便宜，就要时时刻刻防备别人，要对人表现出戒心甚至敌意的话，不仅自己会活得很累，而且跟整个世界的关系都会闹的很僵，甚至还很容易出现各种极端事件。


    我不知道为什么，反正就我个人的经验而言，我总是认为别人对我都是怀有善意的，而且我现实中接触的人也确实基本上都是对我抱有善意。


    用一句可能略显肉麻的话来说，就是我感觉我是被整个世界所爱着的，因此我也愿意爱着整个世界。


    很多人可能会认为我天真，或者太纯洁，把世界和别人想得太美好。但我确实是这么体验，这么认知，这么实践的。这样让我的生活更幸福，心态更平和。那么我这样的人是不是特别容易上当，特别容易被人占便宜呢？


    这个要看怎么理解这个问题，如果说让别人多赚一点钱自己吃一点亏，就是上当受骗的话，那可能会有。


    但其实很多时候本来就是我有意要让他多赚一点或者占一点便宜都没关系，愿意自己吃一点亏，那从本质上来说就不算是上当受骗，而是自己主动的一种选择。


    例如搬家，如果看到对方特别辛苦，我会主动的给他加一点钱；有人来家里修空调，我知道他们可能会借口说一点几什么铜管啊雪种啊之类的，要加一些钱，但我认为这是合理的费用；出去旅游，我知道导游会带我进一些什么店或者加一些什么景点好拿回扣，但是我也认为这是他该赚的钱；从机场或火车站打的，'
  - '[PAGE 317]


    如果我要去的地方太近，我会主动说不好意思，然后给他多打一点钱；在旅游的山上买一瓶水可能要 5 块钱或 8 块钱，但是我认为他们那么不容易挑上来，这个价钱是应该给的。


    凡此种种，会让我在日常跟人交往中有一种更加超然的心态。


    有人可能会说这样多傻呀，一年到头得让人赚多少便宜，多花多少冤枉钱呀。但实际上你算下来并没有多多少。它反而让我的日子过得更加开心如意，与世界和他人的关系更加的和谐。后者带来的满足感，远远超出了前者付出的一点点金钱。


    此外，当别人知道你是这样的人的时候，各种各样的机会也都会奔向你而来。你在世界上的朋友会更多，事业的成功概率也会更高，人生也会更幸福。这一方面的收获不是你付出的那一点点金钱可以比的。


    一般来说，和你交易的人也不会说做的特别离谱。因为太过离谱的话，他也会预料到我会有什么反应。说实话，我并没有碰到过很离谱的事。这可能跟别人看到我可能不是一个好糊弄的人有关。


    因为虽然我看起来很好说话，实际上也很和善，但是他们也能看出我是一个有自己原则的人，而且作为一个壮年男子，可能也有一点体力，从知识层次上看着也不像一个傻子，所以别人如果要真正来骗我，或者说要做的很离谱，他也需要预料到他大概率无法得逞，或者会付出很大的代价。


    所以我一直认为，善良虽然是一种选择，但更是一种能力。


    我之所以愿意与人为善，首先是因为我认为世界都与我善。而世界之所以愿意与我为善，是因为我值得他与我善，他与我为善所获得的收益比与我为恶所获得的收益要大得多，这样的话他为什么不和我刚好关系一点呢？


    另外，我之所以认为世界都与我善，还有一个原因，是因为我把评价善的标准放得很低，把评价别人为恶的线抽得很高。


    我并不把一些别人对钱、权、名等的重视和希望从我这里获取更多的表现，当成是恶。我觉得那就是正常的人性，而且愿意去接受这样的人性，所以我不会觉得别人在与我为恶。


    而要能够达到这样的一种心态，其实也需要自己有一定的实力。例如一个经济很紧张的人，他就没有办法做到云淡风轻地看待这样的事情。你要给搬家工'
  - '[PAGE 318]


    人多一点钱，要给出租车司机多打一个红包，要让导游和旅游景点的卖水人赚到钱，首先你付出的时候能够不感到肉痛。


    另一点，别人之所以愿意与你为善，也是考虑到跟你为敌可能无法得逞，或者需要付出巨大的代价。例如他如果骗我或者说我态度不好，我要能够有足够的力量去反制——我可以是一个很和善的人，但是同时别人也知道，我不是一个容易欺负的人。


    所以，要选择善良，从心理上来看就是一念之间，似乎很简单；但是要真正做到善良，那就需要培养自己善良的能力。


    你要有足够的智慧或者体力，或者对原则的坚持，让别人骗不了你，欺负不了你，知道你的底线在哪里，你还一定要有一定的心胸去正视别人适当的或者有可能稍微有点过分但过得不多的正常需求，以及一定的实力去给别人实际的利益来表达你的善意。


    在这个世界，有很多人认为人人都是对立的，对别人都是要有戒心的。但我希望世界上有更多愿意首先去信任别人的人，爱着这个世界的人，愿意认为别人都是善，自己愿意与人为善的人。


    我自己一直会这样做，也一直致力于去聚拢这样的朋友。'
