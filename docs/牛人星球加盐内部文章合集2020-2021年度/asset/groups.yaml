    ## 提问 11


    何老师，请问用什么方法减少原生家庭的影响？


    我，而立之年的女生。有个特别靠谱的姐姐，还有个弟。出生在农村，但爸没有重男轻女，虽只读过三年书，但对我们特别严格，尤其重视读书。即使租房也千方百计送我们读好学校。姐姐和我小时候家里条件艰苦。但我弟读初中时因我爸特别拼搏上进做起了自己的企业，家条件好转很多。我弟条件很优越却不懂珍惜，读书没有好好努力，高考一塌糊涂。毕业出来工作更是吊儿郎当，一直不务正业。更严重的是去年沾染赌球陋习，目前在改进，但感觉过程很漫长。烦！


    我是三姐弟中读书最好的。在读研究生在外工作一年后，我回到了家里工作。从一窍不通的小白协助家做起了两项目，目前都在正常运营中。加上有个不长进的弟弟，以至于近一年爸一致认为要把交接班交我。


    家里开的公司虽是比较传统的行业，但不是夕阳行业，收入相对稳定，疫情也没有产生太大影响。但我总感觉力不从心，公司管理一点不到位。我爸一直认为凡事必须亲力亲为，力不到不为财。而我认为没有好的管理，没团队企业做不起来。但我爸是特别专制，听不进任何建议。在爸爸锻炼下，回来
    5 年，什么都要会什么都要懂什么都要做，on call 36 小时，万金油般的存在，每天充当救火队，哪里着火扑哪里。


    在这种高强度高压力的节奏下生活 5 年后，特别厌倦目前状态，也一度怀疑，究竟每天累死累活为了什么。我弟赌球事件爆发，家庭氛围特别别扭，我妈护弟，我特讨厌。自从姐结婚后我焦虑剧增。让我爸赶紧退休，他一直不肯，说没有可交接的人，又说机会一旦错过不复再有，目前的人际关系方面正是他事业上的顶峰，过一两年再算。他一直想我接棒。


    而我真心不想接。爸天天说都是好项目，机不待人，但他有没有考虑女儿的人生，真的每天忙得焦头烂额，没有自由时间，上一段恋爱就因为我太忙而分。我跟爸坦白，我不想接棒，累死累活，全家人没一个开心，让有能者居之。我爸大发雷霆，说枉我读那么多书。


    我爸对我弟己心淡，恨铁不成钢。我对弟也有恨。我知道不对，毕竟我也不想接棒。但就成了这么矛盾的人。这些年的经历也影响我的婚姻观，恋爱观等，特别讨厌目前状态。


    不可否认，我比同龄人有更丰富阅历和见识。但传统项目（和政府打交道）真心累，想另辟蹊径做自己的事，我太任性了吗？


    **答：**


    你好，听了你的讲述以后，很是同情你的境遇。


    我个人的建议是：你应该遵从自己的内心。


    你首先应该对自己的生命和幸福负责。如果迫于家庭的压力勉强接了班，以后就要一辈子做这种你己经厌恶至极的工作，这恐怕不是你想要的，而且以后你将一直生活在焦头烂额和心累之中。


    此外，如果你对这个工作完全没有热爱，那么肯定也干不好它。因为你要熬的时间不是一天两天，也不是一年两年，而是十年二十年。没有热爱，是无法长时间地坚持不懈地做好这件事的。而担任企业负责人，却需要你十年如一日地不可懈怠。这两者的矛盾，会让你无法成为一个合格的接班者。如果强行忍着自己的不适去接班，最大的可能是企业越做越差。但是，如何能够摆脱目前的这种状态，是需要一些方法的。


    最重要的一点，是你有没有想清楚自己想要什么？如果你还不知道自己想要什么，只不过是想逃避当前的状态，那是不解决根本问题的。如果你不接班，但是做了个新的事情也不是自己喜欢的，那结果不是一样吗？说不定还不如接班更能掌控自己的命运。所以关键的关键，是弄明白自己想要什么。


    从父亲的角度，他们其实可以支持儿女追求自己的梦想。但是如果儿女没有梦想，只是想要逃避自己的责任，那确实父亲的心理上是不好接受的。所以你要把不接班的理由换过来：你不接班，原因是找到了自己真正可以从事一生，能够让自己幸福的事业，而不是因为想逃避。


    关于恋爱，这个是正当要求，也是父母很关心的，我相信如果你想要恋爱和结婚，并且已经明确和他们表达这一点，他们也不会用事业来反对你。说不定这是一个比较不错的入口。你真的需要多一些机会和时间，去和外界接触，和男生交往，相信如果这样告诉他们，他们会支持的。


    目前，我建议你可以做的事情，有以下几个（选择其中一件或几件都行）：


    - 给自己一段独处的时间。你可以用一周或更长的时间休假，安排一个独自旅游。可以安排去西藏、丽江、沙漠、宗教圣地等比较容易触发个人思绪的地方。这个旅行的最重要目的，甚至可以说唯一目的，就是考虑清楚自己到底想要什么。

    - 如果觉得自己想不清楚，或者不知道从何着手，可以找一个人生规划教练帮忙梳理。

    - 给自己一个在人群中相处的新环境。你可以报一个MBA、EMBA或DBA等的培训班，或者是湖畔大学、得到大学等都可以，甚至那种短期几天的私董会，禅修班，国学班也都可以。其关键不是学了什么，而是让自己置身于一个新的环境，会让自己有很多思考的时间，同时，也可以见识到不同人的不同人生，可以给自己不少启发。另外也许可以碰到聊得来的人。

    - 做完上面之后，和父母开诚布公地谈一次，把自己的想法真诚地告诉他们。如果觉得当面说的效果不好，可以写信。

    - 如果做到这一步，还是不能得到父母的支持和理解，那么你可以有两种做法：第一种是凭自己的勇气来做决定，承受短时间内和他们关系搞僵的结果。这要看你内心是否够坚强，够勇敢。

    - 第二种是先接班，但是自己慢慢去物色合适的职业经理人，让他/她来帮你打理公司的事情，你只作为董事长控制关键事项就行，其他时间你可以做自己喜欢的事情。


    大概先想到这些，希望对你有用。


    ## 提问 12


    何老师，你好！我出生在四线城市农村，大专，29岁。在宁波做猎头一年多，业绩不好，分析有三：


    - 底层能力不足（时间管理、工作习惯、逻辑思维等问题导致效率低）。时间管理上有尝试四象限法则写日程，但由于我特别容易因临时事情中途改变方向运用的并不好。

    - 对工作没有方向。由于成长经历认知的关系，之前对职业规划没有任何概念，毕业前四五年一直在三线城市做行政客服一些后勤类的工作，到宁波后在乙方做招聘培训工作（销售性质
    卖招聘网站套餐 培训课程），后来接触到猎头，觉得特别锻炼人、成长空间大、能认识很多优秀的人，可长期做，高收入。也意识到以后要明确一个职业方向稳定去深耕，根据以往经历想继续人力资源方向，不想去甲方，就做了猎头。但由于目标感内驱力不强，团队做单方式并不像思维导图那样很系统的实操性去分解，一直停留在理论认知层面，加上学习转化能力一般，相当于简历的搬运工，跟自己最初对专业猎头价值的设想差别较大，当然这跟自己和能选择的团队平台有关系。通过观察业绩好的同事，结合三维交叉法评估，只符合赚钱这一条（其实刚开始自认为是喜欢的，后来发现所谓的喜欢是想象中的职业状态，并不是对现实情况真正的喜欢，后面择业也会担心这种情况），当然赚钱很重要，但对赚钱我是小富即安的心态，会更在意精神上的富足和成长。

    - 不够努力。虽然同事或者领导曾说过我是愿意付出，做事踏实有韧性的，但慢慢发现用行动上的勤奋掩盖思维上的懒惰这句话太符合自己了，况且所谓的努力和要弥补的工作差距相比，太微不足道了。跟项目经理有交流过，以我的情况和韧性，只要足够付出长期坚持，稳定做一个一般猎头是可以的。如果这样，同样的投入还不如找个更适合自己的。不知道以上认知是否有不合理的的地方。


    困惑：人力资源方向是否有其他我不知道的适合我的发展方向？按照三维交叉选择法，我最喜欢的都是跟生活相关（健身、插花、烹饪、收纳），之前看到过关于收纳的一些信息，类似于家政公司但比家政公司提供更专业化的定制服务，不过好像只存在于一线城市。关于职业清单和学习渠道希望您帮我分析一下，或者其他您觉得可能会适合我的职业方向也可，以及适合的方向可能遇到的困难？需要哪些准备？


    性格特点：亲和力好、有耐心、韧性强、注重细节、喜欢分享，热爱生活，对于一件事情能否自律投入超强度的付出，非常非常取决于兴趣产生的内驱力，有针对不同事情做过分析观察。


    文字较多，辛苦您！非常感谢您的解答！


    **答：**


    你好，谢谢信任。


    从你描述的情况看，做猎头或人力资源，显然不能让你快乐。我建议还是换一个行业更好。


    你认为自己“不够努力”。能认识到自己这一点是难能可贵的。但是有没有探究过不够努力的原因呢？我觉得你之所以不努力，根源还是在于自己没有从工作中感到乐趣，从内心里就排斥和厌恶。每天都要和自己内心的负面情绪作斗争，意志力全都被消耗了，怎么可能努力得起来呢？你说“只要能付出长期坚持，稳定做个一般猎头是可以的”，但是如果你能付出长期坚持，做个什么不行呢？并不是非要做猎头不可。


    你喜欢的几项内容，可能还要再度深追问一下自己：是不是真的喜欢？是偶尔做一下喜欢，还是乐此不疲地喜欢？如果把它做成了一门职业，每天8小时甚至十几个小时做这个，你是否还能喜欢？


    举个例子，你喜欢插花，那么如果要你一天到晚地插花，你会愿意吗？如果回答是的，你可以先找一家插花的店去工作。你在大众点评上搜你所在的城市，找到那些店，然后一家一家去求职。等弄明白了这个行业是怎么回事，以及自己是不是真的喜欢之后，可以考虑自己开插花馆。健身和烹饪不是十分建议。喜欢健身和当健身教练是两回事，喜欢烹饪和当厨师是两回事。如果你真的特别喜欢，那么可以，如果只是一般的喜欢，还是算了。


    至于收纳的话，确实是一个非常小众的行业。业务开拓会很难。如果你有好的业务拓展渠道或者思路，可以试一试，如果只会收纳，不会推广生意，那么建议慎重。


    仅从你描述的内容来看，插花有可能是相对（你列举的其他几个）更适合你的一个方向。除了去插花店（插花体验店、插花培训店、生活美学馆、花艺工作室、花艺馆等）工作外，你也可以尝试拍插花视频，在抖音、快手、B站等播放，也许会有挺多人喜欢。


    当然，总体而言，你这里列举的只是少数几个，你还需要多看看其他的职业。考虑的方式也是类似我上面说的两个标准：

    1. 是不是真的喜欢，如果一天到晚的做还会不会喜欢；

    2. 你有没有好的业务拓展渠道和思路。


    ## 提问 13


    何老师！本人 29 周岁，2 年销售经验，5 年在部队医院工作。现在刚回老家，面临选择，要么自己创业，要么打工赚钱。我自己的意见是自己创业，但是创业前期没有稳定收入，经济压力就很大。家人也不理解，都想让我找个工作先干着。真心不喜欢再浑浑噩噩过日子了！何老师，鼓励鼓励我把♡


    **答：**


    你好。首先，我是一贯赞同创业，赞同大家按照自己想做的事情去做的。但是，我也曾说过，一定要最大风险可控。同时，要取得家里人的支持。


    在你这个情况里面：


    第一个要考虑的是家庭经济能否支撑。


    你先要算一下家里的存款多少，每月花销多少，如果你在创业期间暂时没有收入，家里在生活水平不下降的情况下可谓维持多久。如果创业半年、一年或两年（具体时长看各人风险偏好而定），哪怕是一事无成，家里的生活水平都可以不受影响，那么不妨试一试，大不了到时再回来找工作。做销售找工作还是相对容易的。


    第二个要考虑的是创业选择什么方向。


    你有没有已经选好的方向？有没有做过深入的调研？有没有网上查过，找人问过，自己亲自体验过？调研下来这个项目是不是真的有前途？需要你投入多少资本？你还缺哪些技术和人员，要补上这个缺口，你有没有相应的办法？如果这些都没有想过，只是有创业的想法，我建议还是缓一缓。一边工作，一边想明白这些问题再说。


    第三个要考虑的是家里是否支持。


    我们创业既是为自己，也是为了家里的幸福。如果因为你创业，反而搞得家人不开心，你和他们的关系闹掰，那就得不偿失了。如果你真心想要创业，就一定要取得他们的全力支持。这就要你去想一想怎样才能说服他们了，是以情动人，还是以理服人，还是以利诱人等等，这个要你来综合判断那种办法最合理，最能打动他们。


