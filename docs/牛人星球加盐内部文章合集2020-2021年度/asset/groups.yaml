    下午在溪流村的一家咖啡馆，拍下了这样一张明信片：


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_86_0.png)


    上面写着两句话：回头看，崎岖坎坷；向前看，永不言弃。中间是一架伤痕累累的飞机。下面的写着：没有伤痕累累，哪来皮糙肉厚，英雄自古多磨难。


    今天的总体感觉是：华为是数字时代不可或缺的底层设施，其未来不可限量。华为极端重视研发，重视人才，技术上也无可阻挡。目前的困难，完全是来自于政治层面，艰难险阻超乎想象，但是一旦迈过这个难关，华为也将迎来更大的辉煌。


    ## 每天卖给自己一小时


    查理·芒格二三十岁的时候，在洛杉矶当律师。当时他的时薪是 30 美元。


    有一天，他突然想到，我应该把最重要的时间留给最重要的客户。那么，我最重要的客户是谁呢？


    想来想去，他发现，最重要的客户，原来是自己！


    于是，他决定每天用额外的一个小时，不服务其他人，专门服务自己。而且是工作效率最高的一个小时：早上。


    从那以后，每天早上，芒格都用一个小时来为自己工作，他用自己的全部智慧和工作能力，思考自己的人生，并且从事着房地产的副业。


    过了不久，他的房地产业收入远远超过了律师。后来，他赚到 140 万美元，就把律师工作给停了，专职做投资。


    再后来的事情大家都知道了。芒格依靠做投资，成为了亿万富翁。


    芒格的智慧有很多都值得学习，而这个“最重要的客户是自己”、“每天卖给自己一小时”的理念，非常值得我们学习。


    我们普通人，平时忙忙碌碌，为客户（领导也是广义的客户）忙这忙那，却忘记了，每个人最重要的客户，应该是自己。最重要的时间，应该投给自己。


    我的理解，所谓每天卖给自己一个小时，就是用最重要的时间，来帮助自己成长。如果每天睡觉前没有比起床时更厉害一点，这一天就是虚度。


    这一小时，你可以用来思考自己的人生，整理自己过去的所学，梳理自己的人际关系等等，也可以用来学习新的知识，或者做其他有利于让自己进步的事情。


    如果单独看每一天，我们会觉得一个小时并不能改变什么。但如果时间拉长到一个月、一年、十年，进步就会非常明显了。我的个人体会是，如果每天用一小时来学习某个人或某个体系的知识，学了一个星期以后，我的语言和思维，就会带上所学的风格。


    例如，学习论语一周，思考问题就会从孔子的角度去看；学习《教员选集》一周，做事就会用上教员的方法。学的时间越长，掌握的思维框架和行动方法就越深入、越牢固。而且好处是可以博采各家之长，而不会只落入一家之所学。这样又会形成一种综合的“1+1>2”效应。久而久之，自己就会比以前知识更渊博一些，看问题更深入一些，做事情更坚决一些。


    所以，每天卖给自己一小时，千万不要把目光放在短期收益上，而应该把时间拉长，知道一定是功不唐捐。否则你很快就会失去动力了。


    另外，“我才是我最重要的客户”，这句话其实意味深长，值得好好琢磨和实践。我们往往习惯于给别人出各种各样的主意，却很少沉下心来，用自己的智慧去给自己思考一下未来的道路和当下的选择。


    如果你认识到，自己才是自己最重要的客户，用服务VVIP的态度来对待自己的成长需求，也许你每天就会有不一样的安排，一周、一年、十年后，就会有不一样的人生。


    ## 富豪们的出身


    我写了很多商界牛人，一般都会写到他们的家庭。


    一个很令人沮丧的结论是，从大概率上来讲，今天成为富豪的，祖父辈或者父辈往往都已经是当地出类拔萃的存在，甚至富甲一方或者有有权有势。完全寒微出身的，少之又少。


    - 任正非的父亲任摩逊是中学校长；

    - 柳传志的父亲柳谷书是中国人民银行的筹建者之一，后来是贸促会的高干；

    - 玉石的父亲是铁路局副局长，岳父是省委副书记；

    - 马云的父亲是浙江戏曲协会主席；

    - 马化腾的父亲是盐田港集团董事长；

    - 王兴的父亲是龙岩市的水泥大王，亿万富翁；

    - 黄光裕的爷爷是大地主，外公是泰国巨富；

    - 曹德旺的曾祖是福清首富，父亲是上海滩巨商，永安百货股东；

    - 方洪波的爷爷当过县长，解放后是人大代表和政协委员，父亲是村里第一个师范生；

    - 冯仑的祖父是地主，父亲是企业工会负责人；

    - 罗振宇的父亲是国营工厂厂长；

    - 就算是被认为出身寒微的刘强东，祖父也是大资本家；


    稍微低一个层次的：


    - 雷军的父亲是村子里第一个师范生，在县城当老师；

    - 张一鸣的父亲是龙岩市科委干部；

    - 程维的父亲是铅山县机关干部；


    这些虽然不是大官或者大富豪，但是在当地，都已经是人上之人，在村子里都算是祖坟上冒了青烟的。


    真正出身寒微的，在我写过的人里面，只有三个：


    - 俞敏洪，父亲是木匠，母亲是妇女队长；

    - 李彦宏，父亲是锅炉房工人，母亲是皮革厂女工；

    - 王传福，父亲是木匠，母亲是普通农民。


    以上这些牛人们的出身，显示了家庭背景对企业家的重要性。


    我认为，祖上是地主、资本家或者达官贵人的，孩子从小就耳濡目染父辈和别人的交往，听惯了别人是怎么做生意、怎么办事的，并且拥有更优越的学习条件，更高的眼界和更强的自信，这些都是普通家庭的孩子没法比的。所以在同等条件下，他们更容易成功。


    当然，出身论不是绝对的，俞敏洪、李彦宏和王传福的成功，也告诉我们，只要足够努力，加上一点好运气，贫穷家庭出身的人，也可以成为大企业家。


    这个统计结果给我们的启示是：


    1. 如果我们自己只是出生于普通家庭，如果想要成功的话，可能需要付出比那些优越家庭的人更多的努力；

    2. 与其抱怨祖辈没有给自己一个好出身，不如自己努力奋斗，给孩子一个好出身。你不一定要成为你巨富或者高官，只要在一个小范围内能成为出类拔萃者，你的孩子可能就具有了更好的竞争优势。


    ## 何加盐都读些什么书？


    前一阵，有星友问到我是怎么读书的，都读了什么书这些问题。在这里也和大家分享一下，或许会对你提高阅读效率有点启发。


    我的读书主要是分为四种情况：


    第一种是为短期目标服务的读书。例如，我写某个牛人的故事，就需要阅读该牛人的的传记、寻找一切和他有关的报道、采访、演讲等等，然后快速阅读。关于马云、刘强东、王石、巴菲特、芒格、曹德旺等人的书，都是在这种情况下读的。


    这种情况下的读书，只能囫囵吞枣，从中发现值得写作的素材，并且把关键事件或者对话做上标记，或者摘录在一个专门的文档里，方便写作时随时查阅和调用。


    我要读的资料主要分为三类：一类是曾经出版过，但是在网上找不到的纸质书。我会提前在京东、拼多多或孔夫子旧书网等网站买好，等写到相应文章的时候，集中阅览，把需要用到的地方划线，极端重要的地方会折纸。


    第二类是在“微信读书”APP上可以直接找到的书，我会在手机端或者电脑端阅览，重要的地方做上标记，需要调用的时候，直接找到标记栏，快速查阅。也会利用关键词来搜索，快速速读想要的内容。大部分的书其实都可以从这上面找到，我强烈建议喜欢阅读的朋友装一个微信读书，并且付费开通无限阅读权限。


    第三类是在网站上找到的书或者网页。我会迅速浏览一遍，然后拷贝复制到一个word文档。如果写作时记不住，需要调用，就用ctrl f搜索关键词来快速定位。通常写一个人，攒下来的word文档会积累十几万字。


    第二种读书是为中期目标服务的。例如，与公司业务相关的技能型书籍，如战略规划、人力资源、品牌营销、财务管理、文案写作等等。


    这些书籍我可能不会马上就用，但是对我公司的业务发展是有帮助的，说不定什么时候就可以用上。


    第三种读书是为长期目标服务的。它可能不会马上对写作或者公司业务有用，但是会开阔我的思路、拓宽我的眼界、提升我的认知、提升我的道德，潜移默化地对我施加影响。例如《毛泽东选集》（或者《圣经》、《论语》、《资治通鉴》）、《人类简史》、《阿德勒心理学》、《王阳明传习录》等等。


    这些书可能一年两年都用不上。但是读之前和读之后，我知道自己会产生很多变化。他们是使我进化的重要源泉。


    第四种读书就是纯粹的消遣，不抱任何目的。例如看一些小说、散文、杂文等等。我有时也会看一下网络小说，或者纸质小说，没有任何功利性，就是因为喜欢。


    例如我会复习《红楼梦》或《三国演义》，看《三体》、《一句顶一万句》等流行的小说，也会看《临高启明》、《修真四万年》等网络小说。


    近来，由于工作都比较忙，所以第一类和第二类书相对看得多一点，而且是工作时间看。休息时间主要看第三类。通常会从晚上 11 点看到 1 点再睡觉（因为白天实在没有时间）。


    第四类书现在看得很少了，主要是等车、排队、坐地铁、坐飞机、上厕所的时候才能看一点。所以感觉还挺遗憾的。


    以上就是何加盐平时读的书及读书的方式。希望对你有点启发或触动。


    ## 我们并不知道未来的感觉


    这几天趁孩子放暑假，带他们到久已向往的沙漠旅游。


    由于女儿已经念叨了无数遍，说是很盼望露营，于是我们就专门安排了一个住沙漠帐篷的环节。


    女儿对此无比期待。一望无垠的沙漠，辽阔浩渺的星空，都浮现在她的想象中，表现在她憧憬的描述中。


    结果，昨晚真往了以后，她才发现，沙漠和星空确实是自己想象的那样，但是还有更多东西和自己想象的不一样。


    例如，帐篷里没有电，没有空调，没有洗浴，没有厕所。


    要洗澡只能公共淋浴，上厕所要到两百米远的地方，半夜黑漆漆的沙漠无限恐怖，而且冷得要死，帐篷空间很窄而且全是沙子，气垫床垫一动就哗啦啦响……


    于是，一晚上女儿半骚满腹，也没有睡好觉。早上起来，在我们的教导下，她光荣地学会了一个“叶公好龙”的成语。


    另一方面的例子是，当我们耍出去玩时，儿子一直闹着不肯出门，他觉得在空调房里看奥特曼才是世界上最幸福的事。


    但我们硬拉着他出来。结果，玩得最开心的就是他。


    以上这样的例子，经常会在我们生活中出现。


    我们在做一个决定时，往往会去想未来的场景，然后根据自己臆测中的快乐与痛苦来作为当下决定的依据。


    但很多情况下，这样做出来的决定，到我们真正经历其结果的时候，我们真实的快乐与痛苦，和想象中的很不相同。


    只有当我们的脚踩在沙子里的时候，你才能真正感受到它的细腻或者粗糍，它的冰凉或者炙热；


    只有当我们置身于海边时，你才能真正感受到海的狂暴风浪和穿透一切的紫外线。


    而在前面的想象中，这些都是被忽略的细节。但恰恰是这些细节，决定了我们真实的感受。

