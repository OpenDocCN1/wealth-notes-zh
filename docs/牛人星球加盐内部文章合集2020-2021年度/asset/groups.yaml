    # 默契与效率


    看到一个新闻：杭州某公司年会抽奖，老板说，一等奖的奖励内容，是公司帮忙清空购物车。有一个叫小王的员工幸运地抽中了一等奖。不过老板看到购物车的时候傻眼了，原来里面有碧桂园的一套房子。


    老板说买房实在没有能力兑现，可以帮助小王出这套房子的定金。小王不服，认为老板不讲信誉，双方起了争执。后来闹到向媒体曝光和请律师的地步。


    不知道大家怎么看这个事例？


    我无意评价在这件事里面，员工和老板谁对谁错。也许谁都没错，也许谁都有错，就看你站在哪一个角度。


    但是很明显，大家都看得出，在这家公司，员工和老板之间，是缺乏共同理念和默契的。


    老板设置这个抽奖环节的时候，本来也是一番好意，他大概也没有想到，员工的购物车里竟然会有一套碧桂园的房子。而按照常理来说，即便出现了这种极端情况，员工大概也不会当真想要老板兑现那套房子。但是这位小王偏偏就非要老板兑现这套房子不可。


    有人说，这完全是老板的问题。他在设置抽奖规则的时候考虑不周，应该一开始就把这些问题都考虑到，把边界设定清楚。


    但是我的理解是，在现实中，人与人之间通常应该是有基本的共识和默契的，很多事情“应该”如何处理，人们的理解都相差不太远，并不需要事事都界定那么清楚。


    如果事事都要考虑到万全，把所有的漏洞全部堵上，那么可能把所有的时间都花在上面都不够用的，而且人与人之间的关系就变成了互相猜疑、互相防范，总以为别人时时刻刻都想着要钻空子，占自己的便宜。


    像这个案子中，谁会想到有人的购物车里放着一套房子呢？如果老板宣布抽奖内容的时候，要规定一个上限，例如说5万或10万，这固然更加严谨，但是细究起来，要规定的地方就多了去了。


    例如是清空单一的某个平台还是可以几个平台；宣布完之后员工新添加进去的算不算；是清空所有的商品还是某个时段内的商品；如果某一个（或某一类）商品在购物车里重复放置了，买了明显就是浪费，要不要给他清空？如果员工在抽奖之前把某一个商品的数量临时改为100份（老板帮忙买之后可以拿到闲鱼卖二手）行不行；如果购物车里有竞争对手的商品或者违法违禁物品怎么办；如果中奖员工的购物车里有非常隐私的东西怎么办（例如员工由于某种癖好或取向而在购物车里放置了不宜向别人公开的东西）……？


    如此下来，老板本来是兴冲冲地活跃气氛，给员工一个福利的行为，就变成了一个很繁琐的、很麻烦的事情。原本一句话的事，结果成了要法务部门过一遍，堵上一切可能的漏洞和法律风险的事情。


    在一个组织内部，固然需要有一些白纸黑字的规章制度，但是并不是越多越好、越严谨越好。更多时候，大家需要有相互的默契。


    这就需要共同的文化、理念、理想、价值观等。如果相互之间没有这些共同的东西，那么内部就会出现无数的内耗。尤其是小公司，老板根本就没有时间，也没有必要搞那么复杂的制度。很多时候甚至都没有制度，大家有一个基本的共识，做事更有效率得多。


    所以，公司招人的时候，应该先考察员工的理念、价值观、行事风格等。各方面与公司相一致，或至少不相冲突的才招进来。否则的话，就会招进来一个定时炸弹，不知道什么时候就成为公司内耗的根源和发展的累赘。


    最后再分享一个新闻：


    上海某咨询公司的软件工程师小张，年假+春节法定假+周末，共计休假27天。老板提出，在小张休假期间，由其负责维护的客户可能会有紧急需求，希望其能带电脑回家，以便需要的时候可以随时响应。


    小张认为，休假完全是个人时间，应该由个人自主安排，不仅拒绝带电脑回家，而且在休假期间拒绝接听老板电话，故意失联。


    后来，公司将小张开除。小张申请劳动仲裁，仲裁部门判决公司赔偿小张19.4万元。公司不服仲裁，提起诉讼，但法院支持了仲裁结果。


    这个事情，我就不再分析和评价了。我只想说的，小张这种人，我是绝对不可能会招进我的团队的。当然，也许也会有人说，我就是小张这样的人，你这样的团队，我是绝对不会进的。


    那样再好不过。不同文化理念的人，就是不应该强行糅合在一个团队里面。


    世界很广阔，大家各自安好，世界会美好得多。


    不知道你是怎么看待小张和他的公司的。我想告诉你的一个事实是：在新浪微博上关于该新闻最热的一个帖子里，评论排在前面的，清一色都是支持小张，认为他的公司是个垃圾公司，活该倒闭。


    这就是现在网络上的民意。


    # 自媒体的影响力与信誉


    几个月前在微博上，看到我喜欢几位博主江宁婆婆、开水旅馆的生物男、蘸盐在推荐一种苗绣，他们对做苗绣的店家人品和产品评价都很高，而且这也是一个支援西部山区的扶贫项目。


    大V的推荐很真诚，粉丝的反应很热烈，店家对粉丝也是做一个“亲”右一个“感谢”，很多粉丝都留言说这是一个良心店家，赠送了很多礼物，甚至怀疑说店家这么大方怎么能赚到钱啊。当时我虽然自己没有买，但是对这样的互动感觉很好。


    没想到，昨天看到了事情的进展，让我大跌眼镜。


    大V们反映，自己以极大的善意、投入了巨大的精力去帮助店家，但是后续发现里面有许多坑。


    例如，这家店生意火起来后，老板娘的前夫突然出现，找到大V说这家店我也有股份的，你们想吞并我们家的店，要分我500万；大V找了罗永浩帮忙支授了流程优化、管理优化和人员，甚至手把手培养了得力的电商助手，但是店家转眼就把这些专业的人一个不剩地辞退了；店家做的刺绣用了别人的版权图片，被原作者找上门索赔；网友不断爆出这家店并不是所宣扬的手工，产品质量也不好；这个项目用了很多当地婆婆做手工，这也是很多人之所以在她这里买的一个重要原因，但是后续有人爆料说店家对婆婆们非常苛刻，拖欠工资，无偿加班等等……


    本来的好心好意地去帮忙和扶贫，结果遇人不淑，一片劳心虚掷，让这些大V特别受伤，一致决定再也不和这事了。尤其感到受伤的是江宁婆婆，因为他在微博上历来都是教人怎么防范各种坑，没想到自己却掉进了这么大一个坑。


    这件事对我的震动还是挺大的。因为他们都是微博上信誉非常好的博主，他们真诚地、极力地推荐的东西，很多粉丝都是闭着眼睛买的。结果最后发现，原来他们也上当了，那些因为相信他们而买的粉丝，也跟着上当了。


    对我来说，最大的警醒在于，作为一个所谓的“自媒体”，拥有很多读者的信任和支持，这既是一种财富，也是一种沉甸甸的责任。一个粉丝众多的博主，每一句话、每一个观点，都有可能影响到很多人。影响力可以用来干好事，但是也很容易不小心干成坏事。


    有一些博主是有意利用这样的影响力给自己谋利，而不管影响力发挥出来是好是坏。例如有的博主什么广告都敢接，而不管读者是不是会因此而被P2P、传销、劣质商品所害。


    也有一些博主的操守要高一点，接广告会比较慎重。但是即便如此，也难免会有看走眼的时候。例如，有一个我很喜欢的公众号主，曾经接过一个医学类的广告，虽然他本意是想帮助有需要的人，但是经读者提醒才发现其中可能存在伦理问题，赶紧删除了。


    除了广告之外，影响读者更甚的是文章（或视频）本身。


    自媒体人的一个不当观点，有时候会在社会上造成巨大的损害。在国与国之间、不同政治和经济势力之间，有时会把舆论当做一种武器用于打没有硝烟的战争，就是因为它的威力巨大。


    有些自媒体为了获取流量或者出于政治、经济目的，而故意去制造矛盾、挑拨情绪；也有些是出于真诚的目的，但是无意识地产生了负面的作用。


    所以，作为一个所谓的自媒体人，还是需要对自己的影响力及这种影响力一旦误用可能造成的损失，要有一定的认识。一个人私下说几句话跟对几十万人说同样的话，造成的后果可能是截然不同的。


    江宁婆婆等大V在这里栽的跟头，我觉得应该足以值得所有做自媒体的人悚然不惧。


    谨以此文作为自省自警。


    # 个人的喜好


    今天去看了《唐人街探案3》，我们是两个家庭，5个人一起去看的，看完都觉得挺好的，远远超出了期待，观影的过程中也享受到了非常多的乐趣。


    后来，我特意到微博上去搜了一下这个电影的影评，发现绝大部分都是负面的，很多人说是大烂片。偶尔有一两个说不错的，评论就会讽刺为“恰饭”（收钱发帖）。我又在朋友圈发了一条关于这个电影票房的评论，结果留言区也有两个人说是烂片。


    这个片子在打分网站上也是两级分化非常严重。在购票网站上评分超过9分，而在豆瓣上评分只有6分多一点。


    如果说电影可能是有人在刷分故意打压，那么春晚就比较明显是民意的直接体现了。


    我们家在看的时候，虽然是一边看一边刷手机，看得有一搭没一搭，但是觉得总体还行。老人小孩也看得哈哈直乐，有些节目则不时发出惊叹。从我和家人的感受来看，虽然说不上有多么经验，但是已经很满足、很开心了。


    结果到网上一看，几乎全是在说不好的。偶尔有一两个说好的，一看，都是央视、人日等官媒在夸。


    这让我非常感慨，人和人的喜好，真是不同。我们觉得很好的东西，在别人看来可能是垃圾。


    这可能是因为我们的审美水平不高，看到个一般的电影就觉得不错了。但我觉得这样挺好的，一个人感受到快乐的阈值低，人生就更容易得到幸福和满足。如果我的审美太高了，就没有办法因为看到这些就开心了。


    很多年前，我曾经向一位长辈极力推荐《霸王别姬》这部电影，还专门买了一张DVD送给他看。长辈看完后，觉得电影很一般。


    我虽然可以理解，但是觉得挺可惜的。因为那部片子给我带来很多震撼，是一种精神上的享受（虽然作为一个悲剧，这种享受不能称之为开心，但肯定是让我很珍视的一种感受）。


    当然，长辈只是纯粹因为刚好不喜欢那个片子而已。而有些自认为审美高的人，会去鄙视审美低的人，甚至还出言或撰文嘲讽。我觉得这很无聊了。人家喜欢的东西，只要不违法，不违反社会伦理和公德，那就纯粹是主观体验的事情，没有谁比谁高多少。


    你喜欢看芭蕾就看芭蕾，他喜欢看秧歌就看秧歌；你喜欢美国脱口秀，他喜欢中国小品；你喜欢马季，他喜欢郭德纲；你喜欢李健，他喜欢凤凰传奇；你喜欢周杰伦，他喜欢华晨宇。如果能够井水不犯河水，各自安好，那该多好。但是有一些就喜欢去嘲讽别人，觉得自己高高在上的样子。


    我个人喜欢的东西很杂。以小说为例，海明威茨威格卡夫卡卡，曹雪芹罗贯中吴承恩，贾平凹陈忠实路遥，席娟林燕妮琼瑶，金庸王朔古龙，三毛张爱玲，韩寒郭敬明，我都喜欢，没有什么不能看的。何必要划定说看普鲁斯特杜拉斯马尔克斯就牛逼，看网络修仙爽文就不行？


    作为个体，喜欢什么，是我之所以作为我的一个重要特质。没有必要因为别人嘲讽而感到没面子。他听他的勃拉姆斯，你听你的筷子兄弟。挺好的。


    对于那些要去嘲笑讽刺别人的人，我想说一句：人民群众喜闻乐见，你算老几？


    # 人生的目标


    前几天看了一个电影，《心灵奇旅》，对我以前一直抱有的想法有一个颠覆。


    以前我总觉得，人活着，还是需要有一个目标，不然的话，人生就是虚撇，会把时间浪费在很多无意义的事情上。


    电影的开始也是这样演的，但是后来却出来了一个怎么都找不到目标的人。


    按照电影的设定，如果找不到人生目标，那就没法投胎，只能永远被困在灵魂世界——当然也不能说“困”，因为在电影里，这个灵魂世界也是一个很美好的所在。


    我原以为，电影的后半段，应该演的是主人公帮助这个灵魂找到人生的目标，让它顺利投胎。


    结果后面演的是，这个灵魂阴差阳错到人间走了一遭，虽然没有找到目标，但是却爱上了人生的点点滴滴。


    于是，最后电影揭示了主题：人生没有目标也不可怕，重要的是能发现生活之美，享受生活之美。


    这个主题其实很简单，也早已为人们所知。但为什么我会觉得“颠覆”呢？


    主要原因在于，我过往太注重生命的意义和人生的可规划性。


    或许由于是圣贤之教，或许是被一些文艺影视作品感染，或许是自天生 的责任感、使命感，我总觉得人必须要有一个目标，而且所谓“享受生活之美”，必须经由“找到人生目标”之路才能实现。如果没有人生目标，也就没有了生活之美。


    但在现实中，可能会存在这么几种情况：


    - 第一，找到人生目标是一件极难的事情，很多人终其一生也未必能找到目标。

    - 第二，找到目标并非人生的必需，很多人没有明确的目标也能享受生活。

    - 第三，已经有了目标的人未必会一直坚信下去，有时候也会迷茫或者动摇，甚至改变人生目标。


    对于第一种人來說，如果实在是没法发现自己生命中的Spark(火花)，那么更适合他的方式，也许是换一个思路，把“苦苦寻找人生目标”更改为“发现生活之美，享受当下”。


    对于第二种人來說，他已经没有必要再非要去找到一个人生目标，他已经找到了人生的乐趣，那就够了。


    对于第三种人來說，迷茫和动摇也并非可怕的事，关键是自己在这个过程中有没有享受到乐趣。如果另一件事情能让自己更有激情，那么换一个目标也未尝不可。


    就其本质而言，找到目标，并不是人生的必需，找到幸福才是。但是找到幸福的途径有很多种，拥有明确的目标只不过是其中比较好的一种方法而已。如果把方法当成目的，那就错了。


    当然，本文并不是否定目标的重要性。能够已经拥有一个明确的人生目标，本身就是极其幸运的事；如果现在没有、但是未来能够找到一个明确的人生目标，也是一件非常值得追求的事。


    我只是说：如果真的找不到，并不需要强求。在离你最近的地方，也许就有你想要的幸福。


    # 情绪价值与实用价值


    这两天微博上有一件事情吵得挺热的，就是关于七氟烷能不能“一捂就晕”。


    一方认为七氟烷没法做到一捂就晕，而且目前世界上并不存在如电影里演的那种一捂就晕的麻醉药，女孩子虽然要注意防范，但是没必要太过担心。


    另一方认为，这种讲理的人根本就不明白很多女性的恐惧心理。这种辟谣会导致很多女性对这种犯罪手段放松警惕，不利于女性自我保护。


    据我观察，前一种博主在苦口婆心地讲理，但是被骂得狗血淋头。后一种博主不需要讲理，只要把前一种博主臭骂一顿，就赢得了无数赞扬。


    这场争吵里面，不同的博主其实提供了不同的价值。第一种是实用价值，他的作用是让我们知道事实真相是什么；另一种是情绪价值，他的作用是让我们知道有人理解我们的感受。按道理说，两种价值都是有用的，但在网上，往往两方的博主以及网友都分成尖锐的两派，水火不容。前一类认为后一类愚蠢得无可救药；后一类认为前一类都是毫无感情的木头。


    一般而言，人们上网其实有两种需求，一种是实用需求，就是希望看的视频、文章对自己有作用，能学到东西；另一种是情绪需求，就是能够从看的视频、文章中感受到快乐忧伤激动感动等情绪，甚至可能就是对付一下当下的无聊感。


    当然，这种区分不是那么绝对。在看那种认知提升类的文章时，我们也能感知到愉悦；在看情绪类文章时，也能学到一点东西。但是大体而言，我们是可以区分哪些博主是知识型理性型，哪些博主是情绪型感性型。


    我个人的建议是，在网上还是应该看一些有实用价值的东西。因为人的时间很宝贵，上网了还是对自己有点作用为好。如果整天沉湎于情绪的发泄，那其实是对生命的浪费。当然，我这里不是说情绪性的内容毫无价值，毕竟人类还是需要寻找共鸣，处理情绪。我只是说不要花费太多的时间在这上面。而且看的时候要知道自己那一刻只是在处理情绪问题，而没有什么理性可言，要寻求理性还是需要看另一类的博主。


    但在现实生活中又是另一套逻辑。我们与朋友、家人的相处、交流，更多是出于情感的需求，而不是要从他那里学习什么。


    我一向不认可什么“刀子嘴、豆腐心”这种说法。在现实中，我们对于亲朋好友而言，一个重要的价值就是情绪价值，甚至在某些时候可能是最重要的价值。刀子嘴本身就伤害了这种价值，所谓的豆腐心如果被刀子嘴隐藏，那就失去了情绪的价值。言辞刻薄地对待自己最亲近的人，让他/她感觉情绪非常低落，然后说我这是为你好，这很扯淡。实际上对对方带来的是伤害。


    以上是从受众出发来说，如果从施众出发的话，那么就要注意，在提供实用价值的时候，要考虑对方的接受性。如果表现得过于理性，完全失去了与人共情的可能，那么再好的理由，都没有人能听得进去，最终也是白讲了。所以即使是实用价值的内容，也要包含情绪价值的部分。想要别人从理性上认可你，先需要让对方从感情上接纳你。否则，从一开始就失去了对话的可能。


    # 学习与挑刺


    上周发了一篇讨论一种商业模式的文章。有些朋友觉得很有启发，有些却觉得对普通人没有用，还有些说是没有创过业的人幻想出来的。


    其实，在文章底下的留言里，两个案例的主人公都现身说法了。陈厚的创始人认为总结得非常到位，基本上等于一个操作指南。


    作为一个简单的案例研究，我肯定没法把所有的细节全部都写出来，如果都写的话，那就是一本厚厚的书，而不是一篇几千字的小文了，所以，其中肯定有一些环节我是没有写到的。但是最关键的部分我已经揭示了，只要满足文章总结的条件，而且按照步骤去操作，成功的概率肯定比一般的创业要大得多。


    退一步讲，即使不满足那些条件，但是文中说到的人品致胜、品牌打造、圈子营销等方式，对一般的为人处世和做生意，都有值得借鉴之处。那些看完文章光顾着挑刺的人，其实纯粹是浪费了自己的时间。


    我们平时看文章、视频、电影等，可以有两种思维模式，一种是学习（或享受）模式，一种是挑刺模式。抱有学习模式的人，总能有所收获。别人发的文章哪里写得好，文中说的思想和案例有什么启发，表达方式有哪些可借鉴的地方等等。但是抱有挑刺模式时，看待世界的眼光就完全变了，什么都不如自己的心意，看完一篇文章，除了一肚子不满，什么都没有得到。


    看电影也是如此。别人看一个电影乐得哈哈大笑，他偏要去分析这里不合理那里有bug，最终看完一场电影无异于受了一场精神虐待，完全没有享受到什么。


    还有一种挑刺，是为了显示自己比别人高超，总有一种睥睨众生的感觉。这也是什么都学不到，只能流于自嗨。


    我们看那些成功的企业家，都是很善于学习和自省的。他们看到一种和自己想的不一样的说法，常常回去思考别人为什么这么说，对方是掌握的信息和我不同，还是看到了我没看到的角度？即便最终他们会坚持自己的观点，也不会有闲心在上去和别人争辩什么。那些有闲心在网上挑刺的，在现实生活中往往是事业不成功的人。


    回到上面所说的商业模式。有很多东西，别人做出来了，我们觉得做不到，有可能是我们没有那个条件，也有可能是我们没有那个眼光或魄力。


    悲观主义者在做一件事之前，往往会把事情想得非常艰难，从一开始就畏首畏尾，最终望而却步。乐观主义者往往会看向那个美妙的结局，忽略中间的难度，一个猛子就扎进去。


    乐观主义者也有可能会失败，甚至败得很惨。但是最终成功的也都是他们。


    # 预测的错误与正确


    1994年，美国一份名叫《矩阵新闻》的刊物登出了一篇文章，里面统计了1993年互联网传播速度的变化。


    一位30岁的年轻人，根据文章提供的数据，计算出当年的互联网增长了2300%。他为这一速度感到震惊，并决定全力以赴加入这个行业。


    于是，他在互联网上创立了一家书店，名叫亚马逊。


    这个年轻人就是杰夫·贝佐斯。


    后来，他知道，当年他算的数字其实是错误的。但是，正是在这个错误数字的基础上建立的亚马逊，最后却发展成功了。


    一个错误的数字，为什么能够引导一个成功的行为呢？


    其实，这样的例子不在少数。在一个大的潮流中，只要方向是正确的，具体精确到多少的数字根本就无关紧要。


    例如，2013年我对比特币做了一个研究，发现这个东西未来可能会大幅增长。那时一个比特币大概是20多美元。我预测它未来会涨到几千美元。


    从现在来看，毫无疑问这个预测是错误的，因为现在的比特币已经涨到了几万万元。但是如果当时我按照自己的预测而做了一个投资，那我会大赚一笔。


    我当时没有做这个投资，不是因为没有预测对，而是因为其他原因，在这里就不展开讲了。我的研究文章还给两位朋友看了，也给几位朋友口头讲了。如果他们听了我的话买了一些比特币，现在也几乎要财富自由了。


    有很多研究成果和人生建议，其实从精确来看都是错误的。但是只要他们方向对，照着做就能产生巨大的效果。这时如果去纠结具体预测的对和错，那就会丧失绝佳的机会。


    很多事情，重要的不是细节上是否精准，而是宏观上能否判断大势。我们今天说中国一定会超过美国，就没有必要去纠结是2025年还是2028年，甚至2030年，重要的是几年十几年之内一定会超过。


    如果这时候有人要根据未来哪国的经济发展前景更好，创业机会更多而决定定居哪国，那么看这个大势是最关键的因素。如果我们预测了2025年超过美国，结果没超过，这时候来说，你这个预测就是瞎扯，根本就不准啊。然后放弃了中'
