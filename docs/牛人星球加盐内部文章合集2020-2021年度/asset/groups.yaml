    # 简单的道理是最好的道理


    由于这次春季分享会的激发，这两天大家在星友群里讨论得非常热烈。其中，有很大部分是在讨论知与行的问题。总体上，以黄敏为代表的星友们认为，很多非常有用的道理，其实很简单，关键就是能不能很好地执行。


    这个观点，我也是很认同的。世界上缺的从来都不是道理，而是把道理落实到生活中的行动。


    我们说，夫子之道，忠恕而已。只有两个字，忠和恕，但是要做到这两个字，又何其之难。有些是不能理解这两个字的真实含义，有的是怀疑这两个字的实施效果，还有些是能够理解，也不怀疑，但就是因为懒惰、懈怠、没有恒心或者在实际运作中面临困难或者遭受挫折，所以就不能坚持执行下去。


    我们又说，夫子的为人，温良恭俭让。也是只有五个字，而且都非常容易学容易做到，但真正做到的人，却又少之又少。


    王阳明一直强调知行合一，实际上就是因为知和行之间的鸿沟太大了，所以才要用一辈子的时间去不断追求。


    我曾经研究过一段时间佛学，收获最大的，并不是那些非常精深的道理，虽然《心经》、《金刚经》、《坛经》等我都读过很多遍，但留下最深印象，让我一直琢磨不绝，并且心悦诚服，时时用来自省和指导自己行为意识的，就是最简单、最入门、每一个念过经的人都听过，但是只当做平常的四句话：


    “上报四重恩，下济三途苦”和“勤修戒定慧，熄灭贪嗔痴”。


    前面两句其实我们并不需要去拘泥于什么是四重恩，什么是三途苦，重要的是体会这种报恩济苦的理念。所以我自己和伙伴们做农业项目，在确定团队价值观的时候，我提出的第一个，是“怀慈悲心”。所谓“悲”，就是对别人的痛苦感同身受；所谓“慈”，就是把别人从痛苦中解救出来。我们也许达不到那么大的能力，但是必须达到这么高的境界。


    而后两句，你越琢磨，就会越感觉有道理。我们要戒掉很多东西，才能够定下心来思考和做事，而只有定下心来，才能产生足够的智慧。在此过程中，我们一定要时时警惕，不要让贪婪、埋怨、执愚三种毒来毒害我们。


    由于本文并不是谈佛学，所以这个就到此为止。先说别的。


    《易经》其实也是，我们都知道第一卦就是乾卦，讲的就是“君子以自强不息”。这个道理何其浅显，但是如何自强？如何不息？我们平时听到“自强不息”四个字，都是一滑而过，只有深入体会下去，才会觉得原来这四个字这么厉害，这么有用。


    《大学》的第一句是“大学之道在明明德”，这句话我是在读《红楼梦》时读到的，当时根本就不知道什么意思。何况在红楼里，是被贾宝玉用批判的口气说的，就更是不能理解了。后来读了朱子的“四书集注”，知道了明明德的原意，突然就觉得这句话太好了，太值得深入研究和身体力行了。


    外国的很多道理，其实也是一样的。富兰克林自传里提到的做法，每个人都能很轻易地做到，但又不是每个人都会去做，都会坚持。查理•芒格坚持下来了。《高效能人士的七个习惯》和《从优秀到卓越》，提出的都是很浅显易懂，而且马上能用的道理，问题就是很少有人用。贝佐斯用了“飞轮效应”，受用至今。巴菲特的价值投资理念，看上去没有任何高明之处，但是能真正做到的，除了巴菲特和芒格外，也就是段永平等极少数人。


    我最近一直在琢磨“适者生存”四个字。每个人都听过这四个字无数遍，但是未必深入地明白其道理。如果能把这四个字琢磨透了，用起来，人生也许会大不相同。


    ## 管理到底是什么？


    昨天加盐星友会虎啸群对这个问题讨论很热烈，我也说一下我个人的观点吧。


    这个问题其实并没有标准答案，只要能对自己有启发，在实践中有指导意义，就可以了。


    所以昨天黄庆辉星友说的，有他的道理，估计也是从实践中深刻感悟而来。我们如果不清楚他身处什么环境，经历过什么事情，就认为他对管理的理解是错误的，那其实是因为我们自己有先入为主的意识。


    但同时，其他认为“管理是什么”有其他解释的星友，如万敬言、陌小冬、熊猫栋等，说的也都非常有道理。因为每个人经验过的管理实践，所处的位置，面临的管理问题，其实都是不同的。


    不过，我们也要看到另一方面：每个人对管理的理解，也都局限于自己的实践和眼见，有其偏颇的地方。所以也要了解别人对这个问题是怎么看的，和自己的相比，有哪些优劣。


    例如庆辉星友说“管理就是让各方利益最大化”，这在很多情况下其实没有办法做到。因为有时候企业或组织的总收入并没有增长，相反还可能在萎缩，这种情况下管理就只能通过内部调配，通过损害一部分人来增益另一部分人。最简单的例子就是企业维持不下去要降薪甚至裁员，这也是一种管理，而且是必不可少的管理。万敬言星友对此作了很好的论述，我这里就不多讲了。


    说说我对管理的理解吧。我认为，管理就是如何分配资源，用最有效的方式去达到战略目标。


    这个“资源”包括人力、物力、士气、人脉关系、社会舆论等等一切可为我用的东西；“最有效”既可以是成本最低，也是摩擦最小，时间最短，当然最好是全部达到。


    最关键的就是“战略目标”四个字。我们不管做什么管理，都要先知道管不管、怎样管，想要达到什么样的效果。是为了现在赶紧捞一笔钱，还是为了让组织活得更长远？是为了让员工得到最好的成长，还是为了让他们创造最大的利润？是为了尽快占有更大的市场，还是为了让单个产品赚取利润最高？是为了让产品功能更好，还是制造成本更低？


    这样的目标还能列出更多，在 3~5 年内企业要致力于达到的目标，可以称之为战略目标。更长远的可以称为使命；更短期的可成为 KPI。这三者必须是统一的，而不是互相矛盾的。


    对于个人也是一样。例如你去相亲，就要先确定战略目标，然后再做相应的管理。如果没有目标，那么就会管理错误。你是想给对方留下最好的印象，还是想看看对方是否能接受平常的、真实的自己，或者是想考察对方是否适合你，或者是想少花点钱，或者就是期待约个免费的那哈……不同的战略目标，你如何分配时间、精力，如何打扮、谈吐，如何安排地点、活动内容，就完全不同。


    每个企业、每个个人面临的情况不一样，想要达到的战略目标不一样，管理的要求就不一样。对解决当前自己面临的问题最有效的，就是最好的答案。


    ## 为什么我这么聪明和努力，却还是一事无成？


    昨天中午和一位师弟聊天，非常感慨。


    师弟是极其聪明的学霸，什么事情一学就懂。高中物理竞赛获全国一等奖，直接保送渐大，可以自由选择任何专业。


    他本来是可以透过自主招生或高考上清华北大的（因为他在华附也是尖子生，这一点，广东人都知道是什么概念），但是不想去冒更多的风险，所以直接就接受了渐大录取。


    在渐大后，他选了录取分数最高的一个专业，但是后来发现自己不喜欢。便考了渐大的一个创业创新强化班，主要精力都放在学习怎么创业上。


    毕业后，他没有直接就业或创业，而是回家参与了自家族的生意。本来他的智慧和所学的创业创新知识完全可以帮家族生意提升一个档次，但是掌管生意的父兄，却并不认同他的那一套，觉得他纸上谈兵。于是便经常发生矛盾。很快，师弟就黯然退出，自己去找其他机会。


    后来，师弟又尝试了几个事情，有打工，有合伙创业，每个事情他都能很快就做得很好，但是却总觉得不是自己想要的。最后发现，毕业 5 年了，还是内心十分不快，前途一片迷茫。


    师弟想不明白，为什么自己这么聪明，这么努力，却依然无法掌控自己的命运，到现在一事无成？


    我和师弟一起分析了他过往的每一次选择，觉得一个关键点是：他每次做选择的时候，没有找准困扰自己的最根本的问题，所以每次选择完之后，同样的问题，过不久就会又缠上他。而困扰他最根本的问题，其实就是他不知道自己真正想要什么。


    于是我给他讲了我的“人生与事业道路选择的五个层次”理论：


    为未来做决策的时候，驱动我们做出某一种选择而不是另一种选择的动力是什么？


    - 第一层次是来自父母、社会、或自身无意识的驱动。这叫命运驱动型。

    - 第二层次是根据自己拥有的能力、资源来选择。这叫资源驱动型。这个资源既可以是自己的某一种特长、所学的专业，也可以指家里有矿，或长得很美。

    - 第三层次是根据自己碰到的机会来选择。这叫机会驱动型。例如你发现一个很好的投资或创业机会，就扑了进去；过两年又发现另一个更好的机会，便果断切换赛道，又去做新的事业。

    - 第四层次是根据社会发展和科技进步的趋势，去发现一个长期的大机会，然后全身心投入进入，这期间遇到各种其他的机会，都不动心，一心只做自己认定的事。这叫战略驱动型。

    - 第五层次是根据自己想要实现的一个梦想，或想要秉持的一种原则来做决策，例如我就想解决人类的癌症问题，或者就想让人类走出地球冲向宇宙；或者我就想做一个“温良恭俭让”的人，或者标新立异与众不同的人。这叫信念驱动型。


    师弟在此前做决策的时候，主要还是处于一二三层次，没有从更高的维度去想问题。这对普通人而言，也许是足够了。但是对特别聪明，对自己未来有巨大期许的人来说，是远远不够的。


    这一类人，一定要从战略和信念两个层次着手，来做人生的长远决策。要么你对社会发展和科技趋势研究得非常透彻，能干成一番大事；要么你清楚地知道自己渴望做什么事，或者成为怎样的人，按照这个去做，才能求得内心的满足。否则，将会永远处于迷茫和痛苦之中，而且越是聪明、越是努力，痛苦会越深。


    这世上，并不是聪明和努力就能成事。还需要坚定的信念，超强的眼光，以及做人的魅力。你说刘邦的聪明和努力程度比张良、萧何、韩信如何呢？刘备的聪明和努力程度比诸葛亮如何呢？但是二刘是成大事的人，后面的是辅佐者。


    一个人如果先天条件没那么厉害，没关系，可以修自己的眼光、人品、坚定自己的信念，也能聚集一帮人和自己一起去成事。


    而一个人要是先天条件非常好，却没有一个明确的目标引领，那就太可惜了。反过来，如果聪明又努力的人找到自己人生的目标，那他的潜力得有多大啊！


    ## 不一样的富二代


    最近接触了一位朋友（暂且称为 A 吧），是个富二代，但又不是一般的富二代，感觉很有意思，遂记之。


    A 的父亲做房地产起家，在某一城市有好几个标志性的楼盘，全国范围也有布局。家族财富很丰厚。


    A 从小学习很好，在南方某理工名校读工科专业，后来去外国留学。


    没想到，留学期间，家中突然发生变故，A 的父亲病逝，留下一大摊子的事业。


    A 只好中断学业，回来继承家业。那时候，他还是一个 25 岁的小年轻。


    作为一个工科学生，没有经历过商业历练的年轻人，一下子要掌管这么大的企业，难度可想而知。我都不知道他是怎么度过那段时光的。


    总而言之，他把事业接班下来，没有让它垮掉，并且在全球金融危机期间，又开发了某经典楼盘，可以说把父亲的事业又更发扬光大了。


    但他自己的梦想也末忘却。为了能喝到小时候味道的红茶，他用了 10 年时间，投资了上亿元，做了一个茶园。整个茶园从一开始，就采用了“全园有机”和“全程有机”的理念。所以茶树生长比别人的慢、产量比别人的低。


    10 年间，他们先后通过了中国、日本、美国、欧盟四个国家（区域）的最高级别认证。这在同类企业中是极其罕见的。而且四个认证的每年复核恰好分别在四个季节，所以春夏秋冬都有人到茶园监管。


    他们在这上面投入了无数的心血，做了无数的事情。可以，A 的为人太低调了，低调到这么好的情怀、这么好的理念、这么好的故事，却没有传播开来。产品的销路也没有打开。


    我和马桶、胖子与 A 一起在他的茶园里泡了半天。那真是仙境般的所在。听他和管理茶园的老板（这也是一位神人，曾经在地方上当了很多年级别还不低的官员，后来却辞职不干，最后跑来守护这片仙境）讲述他们做茶的理念和故事。


    深入了解了 A，就知道他的性格是重实事，不喜欢吹嘘的。是资治通鉴里司马光极力赞赏的“质朴”的那种性格。所以这也是为什么他们的茶能做得这么好，却没有太多人知道的缘故。


    我接触下来，发现 A 和我其实是有许多非常类似的地方。最明显的是我们的性格都是极度内敛，不擅长与陌生人打交道的那种。我们倡导的价值观都是实在，恨不得自己付出到极致，但是表达出来却只有一点点。我们都是长期主义，愿意花费很长很长的时间却成就一件事，而不管这件事短期的收入如何。


    还有一个细节，让我对 A 瞬间拉满了好感。他的微信头像，是和太太的合影。太太在前面，占据了大半个画面，他在后面一脸幸福。我接触过无数企业家，以及富二代。把和太太合影的照片作为微信头像的，是我看到的第一个。


    我忍不住问了一下 A，与太太是不是从学生时代开始的爱情？


    A 说：是的，小学就认识了。


    我说，我和太太也是大学同学，到现在 20 年了，两个小孩。


    A 说：说明我们都是很专一的。


    嗯，我喜欢这样的人。


    ## 农业要成大热门了


    最近因为写一篇稿子，对拼多多的农业布局做了一些研究，才发现，原来拼多多在农业领域的野心这么大。


    我们此前了解的拼多多，和农业、农村的关联主要是让农民能在网上卖农产品，以及让农民能上网买东西。去年拼多多上卖掉的农产品高达 2700 亿元，这个数字着实很惊人。


    但更令我惊讶的是拼多多将切入农业的种植环节。拼多多现在在研究农业的自动化种植和农产品的微观改良。


    自动化种植好理解，无非是利用 AI 去替代人工，这也是目前农业领域的一个大方向。


    “农产品的微观改良”是什么意思呢？


    根据黄峥的说法，他是希望能直接从种植环节就改变农产品所含的元素配比，例如增加某些微量元素，或者减少对人类有害的成分等。拼多多 CEO 陈磊的说法是，“让农产品直接变成保健品”。


    这个听着很有忽悠的成分，野心太大了，但是研究方向也许是正确的，只是不知道多少年能够实现。


    极飞其实也在做类似的事情，不过他们更关注的是种植环节的效率提升。例如我们在新疆看到的极飞 001 号实验田，利用专门的探针和营养输送管道，去管理作物的生产。


    探针会探测温度、湿度、盐碱度、土壤成分，随时监测其变化，然后根据作物生长需要，在营养液里加入相应的成分，然后定向输入到作物根部。


    另一项彭斌在考虑的是，用机器人来除草。因为现在农业里大量采用除草剂，其残留是对人体有害的。彭斌很想设计一个小型的拔草机器人。其功能就是每天不停地在田地里巡逻，看到杂草就拔掉，作物就留下，没电了自己跑到基地去充电。


    这些想法都很有心意，而且这些大公司也都在不断实践，让我们对未来的农业充满了憧憬。


    其实，不仅拼多多和极飞，很多大资本都在关注三农。随着国家乡村振兴战略的提出和持续推进，未来一定会有越来越多的人、钱、技术涌入农村领域。现在三农已经成为一个新的风口了。


    对我来说，这是值得高兴的事情。很多人会说，你也在搞农业项目，就不怕竞争越来越激烈吗？


    我觉得：


    第一点，众人拾柴火焰高，一个行业人多了才好呢，才能蓬勃发展起来，如果只有我们孤独地在搞，那肯定是声浪太小。现在一下子涌入那么多人和资本，对我们找人找资本都是好事。


    第二点，竞争是有利于企业发展的。如果我们的成功依赖于没有竞争，那肯定是不对的。只有面对竞争，才能更有利于我们自身的进化。


    第三点，我们的梦想是让农村更宜居，农业更发达，农民更富裕，但这个事情未必都要由我们来完成。我们能参与其中一部分，就善莫大焉了。更多的，还是要靠大家一起。只要前面三个目标能实现，成功何必在我呢？如果拼多多或极飞能实现，我也会为中国的农民感到很开心，从而让自己感觉到很幸福啊。


    ## 劝别人去做的事情，自己先要做到


    此前研究携程的梁建章时，看他的视频，经常发现他处于一种很尴尬的境地。那就是，由于梁建章本人极力推崇多生孩子，所以主持人总会问到他一个问题：你自己生了几个？


    这个时候他就会特别尴尬，因为自己只有一个孩子。然后主持人问为什么不多生几个呢，他就支支吾吾，最后只好以老婆不同意作为答案。


    好在后来他们还是生了二胎，所以后面才没有人再问这个问题，或者就算有人问，他也能够比较从容地回答了。


    我们有时候会有一些主张，让别人做这做那，这些主张最好是不要与自己的行为相违。


    如果自己极力劝说别人去做的事情，而自己却没有先做到的时候，第一说的时候内心就不顺畅，总感觉怎么说都没有底气。第二，说出来别人也不容易相信，因为你自己都没有做到呢。


    最近在微博上看到有一个女士，一直在劝说别人不要结婚，但是她自己却维持着挺好的婚姻，也一直不离。


    我觉得不管是劝别人结婚还是劝别人不婚，都是个人的自由。但是如果你想你说出来有底气的话，最好是自已先体验过。如果自己单身生活做得非常美好，那么劝说别人不婚还是有很好的理由的；如果自己结了婚，又劝别人不要结，也可以说自己尝够了婚姻的苦，那也可以说得过去，但问题是你倒是离呀。


    孔子说的，己所不欲勿施于人，其实也可以用在这上面，你自己都不想去做的事情，为什么要劝说别人去做呢？


    我自己是写作的过程中，经常会提出一些我的价值主张。这些价值主张，如果和我自己的行为和行动方向不符的话，那我自己就会觉得非常尴尬，而且内心是圆不过来的。


    例如，我一贯提倡实在，就自己先做到实在；提倡对别人好，就自己先做到对别人好；提倡要勇敢地跳出体制，勇敢跳槽，就自己先跳出来；我提倡要理想信念引导人生方向，就自己先树立理想信念，然后再来考虑创业的方向。


    又如，我写的牛人基本上都是商界的人物，我也常常会对他们的行为和企业的行为有一些评价。但是如果自己不创业，不按照这个做的话，这些评价只能说是一个虚幻的想象。


    也不是说不可以，研究和实践本来就是可以分开的两个领域。但是对于我自己来说，内心却是多多少少有些不自信的，不自在的。


    这也是我为什么说研究牛人，自己也要追求成为牛人。


    很多人都说，何老师做公众号这么好，为什么不用做一个自媒体写作的课程？


    我觉得如果是一个人物写作的课程的话，我倒是可以说一说自己的经历，总结一下经验和套路。但是如何做一个自媒体，我觉得我自己的起家都有一定的运气成分，很难去教别人再重新做一个很牛的自媒体出来。


    我自己也有尝试，例如原来做“何加糖”，后来在糖豆她们做“妈妈俩妈 fighting”的时候，也提供一些自己的帮助。但是在做的过程中我发现，现在要重新做一个自媒体，得到
    10 万以上的关注用户，那太难了。


    如果我自己也做不到这样，我肯定就没有办法出来讲如何做好自媒体写作。


    人家来听的，不是说想写好一篇文章，而是要做好一个自媒体，而能不能做自媒体，最关键的就是能不能涨粉。如果一个人教的自媒体写作是不能涨粉的，那就没有任何的意义。


    所以我肯定不会去做自媒体写作课，当然可能会讲一讲如何研究一个人，如何做人物传记撰写，这个是可能的，因为我一直在做，而且做的还不错，其经验、路径都是可以复制的。


    今天这个主题也是因为打疫苗而有感而发。因为我一直说大家要去打疫苗，所以我自己得先去打了，如果自己都不打，那这个话我就很难说出口。


    现在终于两针都打完了，我可以自豪的告诉大家，我已经打了，并且劝说我能够影响到的朋友，赶紧去打吧。


    ## 青年节谈青年气象


    我是一个快 40 岁的人了，每每和人开玩笑说，我已经是中老年了。但这其实只是一种自嘲，我自己心里明白，我内心坚定地认为我是一个青年。


    大家应该都能够认可，青年不青年，不在于年龄，而在于精神状态。有的人已经七八十岁了，还拥有一往无前的决心和战无不胜的信心，充满着活力地在享受生活，创造事业。有些人明明才二十来岁，就心如死灰，什么都不想干了。很显然，从内心状态来说，前者才是青年，后者已经暮年。


    关于什么才是青年气象，这个论述的就很多了。尤其有名的是梁启超的《少年中国说》，其实里面的少年跟青年意思也差不多，并不是指十几岁的少年的意思，而是指拥有少年精气神的人。


    我认为的青年气象，就是心里还存着一个梦想，并且愿意为这个梦想去努力，行动上也确实是在朝着梦想前进。你看芒格和巴菲特一个 97 岁，一个 91 岁，他们坐在台上虽然老态龙钟，但是你一听他们说话，那种乐观、那种激情，那真的是青年气象。


    当然每个人也可以有自己的解释，你认为的青年气象是什么，你就朝着那个气象去追求。未必一定要与梁启超或何加盐的一样。但是我想里面一定会有一些共同点，那就是积极向上，努力拼搏。


    据说生理学上说年轻人为什么冲劲足，是因为一种激素的促进。老年人某种激素分泌少，所以更倾向于平和。


    但我觉得这个激素应该一方面和年龄有关，另一方面也跟人自己的思想和行为有关。一个 20 多岁的食草系男生，和一个六七十岁的还奔波奋斗在一线的干事创业者，你去测他们的激素，我估计是六七十岁的这个人更高。


    所以年纪大的人，不应该以生理激素的变化，作为自己没有干事创业激情的借口，而是要用自己干事创业的激情，去促进这种激素的分泌。


    那实在找不到这种激情怎么办呢？我觉得人的格局还是要大、再大、更大，就像孟子说的，我善养吾浩然之气。


    要找到能够为之而奋斗的东西，如果实在找不到的话，那就热爱生活，珍惜现在所拥有的，而不是觉得一切均已幻灭。

