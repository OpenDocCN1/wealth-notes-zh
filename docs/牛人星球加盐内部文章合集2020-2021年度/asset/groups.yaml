    # 预测是一件很难的事，以后还要相信民调吗？


    这两天，全世界都在快乐地撒着板凳吃着瓜，围观一场大选。


    这场大选的跌宕起伏，超越了历史上任何一次，也超越了哪怕最疯狂的小说家或编剧的想象。


    事先的民调显示老拜登遥领先，大部分人都在等着看老川大败。


    开票后，老拜确实是领先了，但是随着开出来的票越来越多，老川很快就追上来。很多在民调中显示老拜必胜的州，都翻了红。


    到昨天下午后，大部分人都认定老拜要输了。因为还没出结果的各州，已开出的票基本上是老川领先，而且领先的幅度挺大。


    在微博上，昨日下午基本就是此前曾经做出过预测的博主自我抽脸的大型展示。从已经出来的数据看，老川当选基本上没悬念了。


    但没想到，一晚上过去，老拜居然在已经开出90%票仍然落后的情况下，还能翻盘两个关键摇摆州。


    目前就看内华达的6票。已经开出了75%，老拜49.3%，老川48.7%。如果这6票拿下，老拜就够票数当选了。但剩下的25%会是什么结果，仍然是一个待解之谜。


    即使老拜登，也会出现270:268的无限拉近距离，比此前大家预测的大幅胜出完全不同。没有人会想到在今年这样的情况下，老川还能得到这样的支持率。


    老川想必不会甘心接受这样的结果。假如真的是大败，他还没话说，离胜利这么近，他肯定要大闹一场。所以最终的结果怎么样，仍然具有无限的可观赏性。


    上次的希川大战，已经让美国的民调机构大丢脸，几乎所有民调都错得非常离谱。这一次，民调依然是错得离谱。哪怕老拜真的选上了，也不是按照民调预言的方式当选的。


    所以，做预测真的是一件非常困难的事情，尤其是一件事情牵涉的因素很多，而我们又无法掌握足够信息的情况下。


    那么以后还要相信那些民调吗？'
  - '[PAGE 182]


    我认为，民调还是有参考性的。但是它只是展示了部分的信息。民调要信，但又不能全信。


    我做企业咨询时，也会在企业内部做各种调研。在设计问卷时，我们就会知道，调研对象的选择、调研方式的设计、问卷的设置、统计的方法不同，结果会千差万别。


    所以光有问卷调查是不行的，还要深入企业去一对一访谈才行。最后两个结合起来，才能说离企业真实的状况要近一点。


    对岸两场大选的民调，之所以错得这么离谱，一是不管是通过电话还是网络，调研对象就天然被局限了。如果是电话，那么调研时耍干话不方便接电话的那一群人，就被排除出去了。白领、学生等容易被调研到，蓝领、农民就较难。如果是网络，那么年轻人更容易被调研到，中老年人就更难。二是很多人在调研中未必说真话。由于舆论的影响，很多人不敢跟别人说支持老川，所以数据上就会显示老川的支持率比实际的要低。


    关于意识形态和宗教的调研，是受访对象说假话的重灾区。所以很多关于这方面的民调，往往会很大的偏差。


    对于社会问题、经济问题等的民调，也或多或少有其自身的缺陷。我们可以去看调查的结果，去分析其中揭露出来的部分信息是什么。但是，这样还不够，还需要了解更多的信息，去和没有被调研过的各色人等聊。


    这就是没有调查就没有发言权的道理。'
  - '[PAGE 183]


    # 舍与得


    最近在研究腾讯云的发展，很是感慨。


    今天我们说起腾讯，会觉得这家公司的口碑还不错。但在10年前，舆论形态可完全不是这样。当时的腾讯，常常被骂得狗血喷头。


    除了因为产品和收费引起的争议外，腾讯被骂的另一个主要原因，是在竞争上的激进。


    当时，由于腾讯有钱有流量，除了百度把持的搜索领域和阿里把持的电商领域以外，基本上腾讯只要想进入哪个行业，都所向无敌。


    所以，10年前的互联网行业的创业者，都必须面对一个问题：如果腾讯进入你这一行，你怎么办？


    倒不是说腾讯要有意要打败他们。只是互联网行业竞争的特性就是，一个细分领域，往往竞争到最后，只能留下一个或两个幸存者。如果腾讯想要进入某个细分领域，那么原来的玩家，基本上只有死掉一途。所以当时有句话，叫做企鹅过处，寸草不生。


    2010年，由于和360的斗争，腾讯遭遇了成立以来最危险的时刻，差点被360从底层应用上连锅端掉。


    当事态平息后，马化腾发布了著名的《打开未来之门》内部信，腾讯开始了开放之路。


    开放前后的不同是：开放之前，腾讯只要觉得能赚钱的行业，就会进去做，等于走别人的路，让别人无路可走；开放之后，腾讯专注于主业，对于其他能赚钱的行业，他会扶持那个行业的创业者去做，自己只占少量的股份，最多是二股东，不追求控股。


    马化腾说：从今以后，我们只给自己留下半条命，另外半条命，交给合作伙伴。


    结果，腾讯开辟了 to C 业务之外的另外两条赚钱之路：投资和 to B。


    腾讯投出了一大批非常厉害的公司。今天叱咤风云的京东、滴滴、美团、拼多多，背后都是腾讯的身影。这些公司的估值或市值的上升，意味着腾讯的投资获得了丰厚的回报。'
  - '[PAGE 184]


    在 B 端，腾讯开放了自己的平台和技术，帮助其他公司成长，从腾讯云服务开始，到最后整合为巨大 CSIG 部门。到目前，虽然腾讯云的营业收入只有 170 亿，但是增速非常惊人，已经成为腾讯未来极具想象力的一个新的业务板块。


    我们今天所用的滴滴、美团、拼多多、小程序、防疫二维码、腾讯会议、腾讯课堂等等，背后都是腾讯云在支撑。可以说，腾讯云已经无处不在。


    甚至，连三一重工这样的企业，都在用腾讯云。三一在全球的 30 多万台设备，上面都装了传感器，数据就是上传到腾讯的云端来进行存储和分析。


    今天的每一个互联网创业者，再也不需要担心腾讯进来会怎么办。相反，他们梦寐以求的，就是腾讯能够进来，投资自己，扶持自己。


    马化腾曾经说过一句话：腾讯从来没有哪一天可以高枕无忧，每一个时刻都可能最危险的时刻。我们每天都如履薄冰，始终担心某个疏漏随时会给我们致命一击，始终担心用户会抛弃我们。


    如果说，腾讯只有 to C 的业务，只有 qq 和微信，也许有一天，当一个新的社交工具或新的社交方式出来时，腾讯确实会被用户抛弃。


    但是当腾讯成为像水和电一样的基础设施，已经深入到每一个行业，深入到我们今天所常用的企业产品，那么腾讯的稳定性和安全性就有了多一层的保障。


    这个例子很有意思：当腾讯想拼命得到更多时，它得到的是行业的敌意，最终反而失去更多；而当它把自己的半条命交出去时，它得到的是行业的支持和配合，最终反而获得了更多。


    如果说，未来腾讯能够存在更久，成就更辉煌，一定不是因为它什么都想要，而是因为它是舍得给与。'
  - '[PAGE 185]


    # ## 弱水三千与一瓢


    弱水三千，吾只取一瓢而饮。这句话往往用来形容爱情中的专一。其实它对我们生活、工作，也有很好的意义。


    我们可能会曾经在某个时刻，想取悦所有人，不敢得罪任何人。但这是不对的，也是不可能做到的。世界上每个人看问题的角度不同，每个人的利益不同，每个人的喜好不同，不存在一个受所有人喜欢的人或事物。


    所以我们总要在某个时候，变得成熟，知道世界上会有很多人不喜欢我们，讨厌我们，甚至憎恨我们。


    然后我们还要知道，他们不喜欢我们，讨厌我们，憎恨我们，不是因为我们的错。错的有可能是他们，也有可能谁都没错，只是我们和他们不相投。


    然后我们还要知道，我们不必做出任何改变，企图去迎合他们、取悦他们。这是徒劳的，也是没有必要的。


    最后，我们还要学会忽略这样的人和这样的声音。如果你看到别人的负面评价，不会在内心里引起任何波澜，那就真正成熟了。


    不要试图在这种负面评价中寻找可能有用的地方。有时候我们说闻过则喜，那是对真正关心你、真心想帮助你变得更好的人而言，对于不喜欢你的人，完全不必错付这种期望。


    我写公众号以来，对上面这些心路，每一个都经历过。见得多了，受得多了，自然就明白了。以前看到负面留言会心情不好，会去反驳，现在我可以做到无视。


    以前写文章会想到要去照顾方方面面。现在更多是我手写我心。我是这么认为的，就这么写出来。读者喜欢，就继续关注，不喜欢，可以取关。如果说阴阳怪气的怪话，不好意思，直接拉黑。


    最近在筹划二次创业的事情，我们一起在讨论公司的理念和价值观。我们共同认为，我们的企业文化要向共产党学习、向红军学习、向解放军学习。所以我们到了新疆阿拉尔会先去看
    359 旅电锯纪念馆；看到党旗和入党誓词，我们在党旗下重温了入党誓词；我们的公司会首先成立党支部；我们的新人入职会有入职宣誓；我们的团建会首先考虑革命圣地和理想信念教育……'
  - '[PAGE 186]


    我知道这样会有很多人不认同，不适应，会望而却步。但是没关系，我们只要找到认同的少数人就可以了。一个公司并不是要什么都招，一项事业并不是要什么都找，最关键是要找到理念和价值观合拍的人，大家一起前进。


    我曾经是个希望讨好天下人的人，曾经害怕任何一个人的讨厌，曾经会因为别人的一句话而难过很久。


    我很庆幸，在快到四十岁的年纪，终于能够在这方面变得成熟一点。'
  - '[PAGE 187]


    # 凡尔赛与圈子黑话


    这几天，“凡尔赛”这个词比较流行。相信不少朋友都看过。


    对于了解这个词意思的人来说，可能会发现网上到处都是相关的信息，几乎都躲不掉。我这两天就看到不下50条这方面的信息，包括视频里的凡尔赛教程、微信群里的凡尔赛考试、公众号的凡尔赛长文等。


    但是对于不了解、不关注的人来说，可能完全没有意识到有这么个东西出现，看到了也根本不知道是个什么玩意。


    这其实就是信息的茧化和人群的割裂。


    我们特别容易产生一种误解，就是觉得某个东西在网上这么流行，应该是人所皆知了吧？实际上，它可能就是在 一个很小的圈子里流行。


    例如，你回家在餐桌上问一下对象、父母，或者办公室问一下同事，什么是凡尔赛，保证大部分都会莫名其妙。


    写文章的人有时候会有一种恶趣味，就是爱用这些“梗”。懂的人会会心一笑，但是不懂的人会莫名其妙。


    例如我曾在“兽楼处”的一篇文章里见到“他们都有一个光明的未来”这个用法。我相信90%以上的读者都不知道这话是啥意思（这是化用早期《新华字典》的例句：“张华考进了北京大学，李萍进了中等技术学校，我在百货公司当售货员，我们都有着光明的未来。”）。


    我也曾经用过“我当时还处于真理状态”这样的表达，但是对没看过《围城》的人来说，这也是一个令人不知所云的句子。（《围城》里，钱钟书写道：鲍小姐穿着暴露，有人叫她“真理”，因为据说“真理是赤裸裸的”。鲍小姐并未一丝不挂，所以他们修正为“局部的真理”。）


    有时候，作者是带着一种小圈子的好玩心态用的，例如“铁拳爆菊”、“元老院万岁”、“三体必胜”、“高升师兄必须死”等，碰到同类，会心一笑，各自开心。不懂的人则随他去。


    这就如同中国人写诗、写文章，特别喜欢用一些典故，有时甚至故意用很生僻的典，以至于专门有人编了一本书，叫做《何典》，原因就是常常有人问别人“语出何典？”'
  - '[PAGE 188]


    但也有时候，作者是真的以为这个梗已经是全民的共识。例如很多人会用亮剑、甄嬛传、琅琊榜等曾经风行一时的电视剧里面的经典台词（如二营长和我大利炮），但是其实，这些电视剧看着似乎受众广，实际看过、能懂的人，远小于作者和该圈子的人以为的程度。例如，我看到什么晋王如何如何、嬛嬛怎样怎样的表述，就完全听不明白，因为没看过，没有那个底层的信息共识。


    在日常工作和交往中，我们也往往容易犯这种毛病。


    有些行业的专业名词，在行内的人会习以为常，章口就来，但是对行外人听来，就一头雾水。（前面“章”字是错的，但是输入法直接打出来了，可见用的人很多，输入法把它当成固定用法了。其实也是一个小众梗，讽刺六小龄童的，我猜读者大部分都没听过。


    例如风投圈的人说 LP、FA、A轮 B轮、尽调，咨询圈的人说 MECE、金字塔原理、BCG 矩阵、六个盒子，程序员说前端、后端、底层、UI、BUG，对外人来说都是黑话。


    甚至连大厂、鹅厂、养猪场、渣浪这些话，可能大部分人也不明白什么意思。现在的网络，已经完全茧化。不在一个圈层的人，可能永远不知道这个圈层流行的文化是什么，惯用的词语是什么意思。


    最后举几个小例子：


    +   1. 请问咩饭、独饭、毒唯都是什么？

    2. 为什么胡建人看到广东人要瑟瑟发抖？

    3. 为什么无线电法国别研究？


    第一个是饭圈文化（“饭圈”这个词估计也要弄蒙一堆人）；第二个是网上流行的“广东人吃胡建人”的梗，同时讽刺了广东人什么都吃和福建人普通话不标准；第三个是一本书的书名，在小圈子里流行一段时间了，浅层来看是一个如何断句的问题，深层还涉及到一个很小众的网络亚文化，叫“日常乳法”。


    我相信，就算我这样解释了，还是会有很多朋友云里雾里。这些具体的意思就不管了，反正都是很无聊的小圈子亚文化。


    总而言之就是，网络已经成为一个个小圈圈，我们每人都待在自己的茧里面，只能看见自己院子里高墙下的四角天空——你看，最后一句话还不忘用典，就是写作者的臭毛病。'
