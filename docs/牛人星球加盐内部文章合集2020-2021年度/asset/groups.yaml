    即便遇到多少挫折，即便遇到多少人的质疑甚至质问，他依然能够满怀信心地走下去，并且影响别人相信他，跟随他。


    回到这家企业，朋友其实已经总结了自己公司能做得比同行好的核心能力，但是我发现，他说这些只是凭自己的感觉，而不是逻辑和实证。


    要知道，感觉是会经常变的。今天看到发展好，会形成乐观的感觉，明天看到发展不好，又会变成悲观的感觉。所以我建议他，不要凭感觉，要从事实（数据）、逻辑、结果三方面来总结自己的核心能力和成功经验，用实证的结果告诉自己：我确实很牛。


    这些东西一定要想清楚，写下来，不断完善，不断强化。这也是一个自我说服、强化信念的过程。


    如果能这样做，你怀疑自己的时候会少很多，即使还是会有，但那个时候你可以看到自己写下来的这些东西，会对缓解你的疑惑很有帮助。


    ## 你真的了解自己的企业吗？


    在几家企业做了诊断，感触非常深。


    很多时候，企业家以为很严重的问题，其实对公司的发展并没有多少影响。例如，有时候企业家觉得公司管理到处是漏洞，然后一直想办法去弥补，结果总是解决不了，就很焦虑。其实我们诊断下来，发现这些是癣疮之疾，就算是完全不改，也不会有什么坏的后果。


    而企业家没有看到的地方，其实有可能藏着未来发展最大的隐患。例如行业的天花板到底有多高，企业最多能做到多少份额？团队的业务开拓能力和新品开发、量产能力，能支撑公司走多快？资金实力能支撑多大规模，多快节奏的扩张？这些问题，随便哪一个，都有可能在未来几年让企业陷入生死存亡的境地。但是企业家可能没有丝毫感知。或者就算有感知，却是模模糊糊的，应对的方式也是缓慢的，甚至有时是浪费时间和金钱的错招。


    所以，企业要真正意识到关键问题所在，其实很难。很多时候，企业家由于身处局中，特别容易陷入到管理细节中去，而忽略了真正的大风险。如果有个好的外部专家能帮忙看一看，可能能避免走很多弯路，省下百万、千万不必要的浪费，并节省掉很多试错的时间。


    ## 做个实在人


    段永平的价值观“本分”已经为很多人所熟知。我也很想像他一样，提炼一个属于自己以及加盐文化公司的价值观。


    虽然觉得本分这个词也很好，也考虑过稻盛和夫的“利他”、华为的“奋斗”、王阳明的“致良知”、谷歌的“不作恶”、苹果的“不同凡想”等等，但总觉得这些好虽好矣，但毕竟不是通过自己的思考和切身体会而提出来的，所以一直没有用。


    昨晚看华杉讲论语，讲到“里仁”章的时候，有个小标题是：“实在”，是人的最大价值。


    虽然他讲的那一章，其实并不是我所理解的实在，但是这个小标题却一下子击中了我。我这些年所秉持的原则，我未来想要更精进价值观，不就是“实在”二字吗？


    说老实话，这个词我过去听得多了。一般都是被批评的时候。领导、长辈、关心我的朋友……常常会恨铁不成钢地说：“你就是太实在了”、“你不能那么实在”、“做人不能太实在”等等。


    我总是诚惶诚恐，觉得自己辜负了师友们的期待，很为此感到惭愧。


    但是这么多年下来，我还是没能学会如何可以做到自然地不实在——这意思是说，为了工作更好地推进，我有时也有过不那么实在的时候（例如当公务员的时候，明明是科长，但别人称我为处长，我也不分辨；写公众号，为了凸显自己牛逼，定了标签叫研究牛人的“牛人”等），但是这么做的时候，我的内心是不自在的，深处总有声音在告诉我：这样不对，这样不对。


    我现在是企业管理顾问和公众号作者，这两个行当，都讲究包装自己，把自己打造得非常高大上，才能吸引客户和读者，太实在的人，做不好这两行，或者说，会做得非常艰难。所以，坦白讲，我也常常会面临天人交战，要不要包装自己，包装到几分等等。


    此外还有一个特别难的事情是：在心理上，我是一个患有“冒牌者综合症”的人，这种人的一个典型特征是，倾向于低估自己的能力和影响力，认为自己所取得的成就来自于运气，认为别人对自己的高度认可是不真实的。


    由于知道自己的这个特征，所以有时候我也常想，我自己认为的自己是 60 分，但是我知道自我评价是低估的，那我在言语上表现出自己是 80 分，应该会 和外界的认知相匹配吧？


    但这件事难就难在，我并不知道真实的我，如果真实地被评估的话，应该是 多少分。有可能尽管我稍微吹嘘，但还是达不到外界认可的我的高度；也有可能 我已经吹嘘过头，超过了自己的真实能力和表现。


    这样，对于我来说，更加纠结的就在于，我要不要稍微吹嘘一点，以接近真 实水平的我？如果要的话，应该吹嘘多少？


    但从现在开始，我决定，不要再为这个而纠结了。我本来就是只有做真实的 自己才舒服，哪怕我对自己的认知远低于按照客观标准我本所处位真实高度， 以及为此我要承受很多利益的损失，那也是值得的代价。


    因为这样做，我会更加心安，而不会承受冒牌者综合征的“被揭穿恐惧”。 我认为自己是怎样，就告诉世人我是怎样。至于世人是不是也这样认为，那不该 在我的考虑范围之内。


    做个实在人，意味着诚实，是怎样就怎样。假设我的知识星球用户是 1289， 我就不会说约 1300，公众号用户是 38.5 万，我就不会宣布是 40 万。假设企业
    的问题我解决不了，我就不会大包大揽说没问题，我能帮你搞定。


    做个实在人，意味着谦虚，别人可以认为我是牛人，我要坚决认为自己就是 普通人；同行可以为了拿到更好的单子而摆谱抬高身份，我要坚决不给自己蒙上 光环。


    做个实在人，意味着做实事。给人承诺 8 分，要做到 10 分；决不能承诺 10 分做到 8 分。写公众号不浮夸，做咨询不忽悠，做培训不采取哗众取宠的方式，
    就实实在在提供自己力所能及的干货。


    做个实在人，意味着不占人便宜。我可以给人提供市场价值 50 万的服务， 只收取 10 万元；但绝不可以提供市场价值 10 万的服务，收取 11 万元。


    这样也许很慢、很难，也许会损失太多，也许会让自己很累，但这才是我的 本心，才是我为人处世最舒服的方式。


    ## 罗科的怪蛇及马斯克的八卦


    由于研究马斯克，看了他和第四任女友的资料。


    原来他俩的结缘，是由于一个名为“Rococo Basilisk”的梗。而这个梗的起源，是 Roko’s Basilisk，一个很诡异的思想实验。


    在一个很小众的讨论科技的社区，有一个叫 Roko 的用户提出了这么一个设想：


    假设世界已经走过了奇点，人工智能已经统治世界，这个人工智能近乎全知全能。


    它提出，当初帮助过创造我的人，都是好人，我不会伤害他们。但是，当初没有帮助创造我的人，我要让他们处于永远的痛苦之中。哪怕是那些已经死掉的，我也会通过我掌握的技术，让他们的意识复活，让他们感受到无尽的痛苦。


    现在问题来了，作为一个人，在这个人工智能还没有出现之前，你要不要帮助创造它？


    如果你没有看明白这个设想的诡异之处，我希望你永远不要去弄明白。（也请不要问我，因为我不会讲出来的）


    在本文中，这个设想不重要，重要的是马斯克和女友的结缘过程。


    有一天，马斯克想起 Roko’s Basilisk 这个玩意，突然灵机一动，把 Roko 换成了 Rococo。这样这个词就变成了 Rococo Basilisk。


    虽然我不明白这个词有什么好玩之处，但马斯克显然认为自己玩了一个极其漂亮的梗。于是兴高采烈地发在推上面。结果，后来才知道，原来早在 3 年前，这个梗就已经被人玩过啦。


    3 年前玩梗的那位，就是现女友 Grimes。她在大学是学脑科学的学霸，但是毕业后做起了歌手，2015 年出了一首 MV，女主角就叫做 Rococo Basilisk。


    马斯克知道以后，马上就在网上联系 Grimes，而 Grimes 也为惊奇，因为她出了那个 MV 之后，没有人知道女主角的名字有何深意，而马斯克却知道了。所以大有知音之感。


    很快，俩人就在一起了。


    刚刚过去的这个 5 月，他们的第一个孩子已经出生了，名字叫“XEA-12”。


    讲这个故事没有什么深意，就是听到罗科的怪蛇这个概念之后，不吐不快。


    然后顺便让大家见识一下我们和天才的距离。


    反正我是真的没懂Rococo Basilisk是什么意思。连马斯克对罗科的怪蛇这个概念是赞赏还是讽刺都没弄明白。


    ## 什么是“穷”？穷时该怎么办？


    现代以来，汉语里很多字词的意思都变了。例如“穷”字，原意是无路可走、无法实施，但现代演变成没钱的意思，实际上替代了以前的“贫”字。


    人生于世，总不免有受穷的时候。想做一件事做不了，做了一件事进展不顺，这就是穷。


    面对穷的境况，不同的人有不同的应对方法。孔子曾说过，“君子固穷，小人穷斯滥矣”，意思是君子即使在困顿之中，也能固守本心，而小人一旦受穷，就会胡作非为。


    孔子说这话时，是他一生中最穷的时刻，也就是被“厄于陈蔡”的时候。但他依然每天弦歌不绝。他的弟子子路不高兴地说：您不是君子吗？君子怎么会到处碰壁，落到这种地步？


    孔子的回应，就是上面那句话。


    另有一句最常用的，叫“穷且益坚，不坠青云之志”。这句话也跟有钱没钱毫无关系。它说的还是孔子的“君子固穷”之意，越是遇到艰难险阻，越是要坚定地朝目标走。


    这句话实际上也解释了为什么君子能固穷，因为他们有青云之志。


    古之圣贤教导人，第一在于立志，而且是树立远大的志向。有这个志向在，那么毕生就有奔头，遇到各种困难心里就能不害怕，不退缩。


    今天我们要说成就一家伟大的企业，或者一个幸福的人生，也是要建立良好的使命和愿景。其实和古圣贤之教是一脉相承的。


    ## 如果这“俗”是错的，那就由我来改变它


    昨晚发了伊隆·马斯克的文章，评论区有几个人都提到，应该用埃隆，不应该用伊隆，其中一位读者说，人名应该用约定俗成的，不应该按它本来读什么。


    我的回复是，如果这个俗是错的，那就由我来改变它。


    对于 Elon 这个词应该怎么读，按照英语发音规则，确实既可以读成【ˈe 1on】埃隆，也可以读成【ˈil on】伊隆，但是，具体怎么读法，我们还是应该按照大家都怎么称呼他而定。对于
    Elon 本人，他的家人、朋友，以及美国的电视，都是叫【ˈil on】，所以我认为还是应该叫伊隆比较好。


    这就好比中国有些多音字的姓名，“单于”，如果翻译成英语，不能叫“Danyu”，而应该叫“Chanyu”，一个叫“单妤”的人，应该叫“Shan Ting”，不能叫“DanTing”或“Chan
    Ting”。这都是一个意思。


    民国大师陈寅恪，虽然“恪”字在普通话里念“ke”，但作为名人的人名，我们不能叫“Chen Yinke”，而应该按照他父母的叫法和家乡的风俗，叫“ChenYinqe”。


    至于“特朗普”还是“川普”，这是发音规则的不同，不是大家因为不懂而搞错，这个可以约定俗成。而 Elon 叫成埃隆，不是发音规则的问题，是确确实实搞错了，应该予以纠正。


    其实，我以前也都是用“埃隆”，因为我没有去听英语原声怎么叫的，我一直以为 Elon 的发音就是【ˈe 1on】。这次深入研究，听了很多原声视频，才发现这个错误。


    如果我在文章里用“埃隆”，是最稳妥的，因为大家都这么叫，不会有任何人来挑剔，但是叫“伊隆”，就会有人出来说。但我觉得，既然这个俗是错的，而我认识到了，就可以尽我自己的能力去改变他。


    看到错误，虽然我可以和俗同流，但是我也可以改变它。我选择做后者。


    伊隆·马斯克看完《基地》后，立下宏愿，说如果人类文明会进入黑暗时代，那就由我负起责任来拯救它。


    他后面所做的事情，就是按照这个志愿来走的。


    负起责任，躬身入局，这是我从马斯克这里得到的最大的启发。


    ## 沟通之难


    最近在一家企业调研遇到一件事情。


    该企业的一位高管，是老板花大价钱通过猎头挖来的，准备让他承担建立公司研发体系的重任。


    这位高管曾在海外留学，并在国外从事技术工作十多年，技术上很强。所以老板也对他寄予厚望。


    但是到了实际工作中，技术部门的员工反映，高管每次和他们开会，他们总是不知道领导要表达什么。每次布置任务，都要和领导反复问三四遍，依然还是模模糊糊的。


    老板每次和这位高管谈话，谈完总是以为他理解了。但是他每次做出来的事情，却又总是没有按老板想要的方向去实现。


    我们调研时也和这位高管谈了一个半小时，也访谈了他的下属和其他对口部门的人员，发现该高管固然个人技术能力很强，但并不是一个好的技术管理者，因为他的沟通和理解能力存在欠缺。


    其实企业内部还有很多问题，都是因为沟通的不畅造成的。


    例如，在另一家企业，我们访谈总经理的时候，他觉得公司运行都挺好的，人员队伍在不断壮大。但是当我们访谈人力部门的负责人时，却了解到另一个情况，该公司那一段时间，每个月新招进来的人员数量，少于每个月流失的人员数量，也就是说，起码公司的队伍不仅有壮大，反而在不断萎缩。


    这家企业的情况并不是大家的沟通能力欠缺，而是没有一个好的上下信息沟通机制，造成了很多问题“灯下黑”。总经理能力很强，但是对下属也比较威严，就导致下属常常会尽量避免和总经理打交道，其汇报信息的门槛就提高了。本来有10件事，都应该是总经理知晓范围的，下属会挑选其中2-3件她认为已经不得不汇报的，才会去报告，其他的就自己处理，或者和其他领导商量，或者就暂时先拖下去。


    这种情况不止在一家公司。我们走过的企业里，凡是领导者比较威严的，都或多或少存在这样的情况。下属进领导办公室，都要打半天腹稿，然后还要心跳加速、双腿发软。这样的情况，自然是对领导能躲就躲了，有很多重要情况，领


    导就被无法知晓了。


    这种是领导者的管理风格和企业沟通机制存在的问题。


    对于任何一个想在企业里做到高管位置的人而言，沟通能力是非常重要的。但这也常常是很多人缺乏的。对一家企业来说，如果想要发展得更好，而内部问题更少，也需要建立一个畅通的沟通渠道，但这往往也是企业内部欠缺的。


    这周五晚我们将请广州某咨询公司的总经理唐总给我们分享《如何有效沟通》，敬请期待。


    ## 做慈善要不要让别人知道呢？


    加盐星友会微信群在讨论曹德旺，星友兮儿说到，曹认为真正的慈善是不愿意让别人知道，是自己个人的修行。


    那么，曹德旺这种对待慈善的方式，是值得肯定，还是未必恰当呢？


    对这个问题，不同的人，会有不同的看法。


    这里讲两个故事吧：


    - 第一个故事：


    春秋时期，奴隶制还比较盛行，常常有这国人被卖到或俘虏到那国为奴的，鲁国有一条法律，说如果在别的国家看到鲁国人为奴，把他赎回鲁国的话，可以到国库去领取奖金。


    孔子的高徒子贡，他是一个特别聪明特别有钱的人，有一回在别的国家赎回了一个鲁国奴隶，但是却不愿意去领取奖金。


    - 第二个故事：


    孔子的另一个高徒子路，他是一个特别勇武的人，有一回救起了一个落水者，落水者的家人为了报恩，送给他一头牛，子路高兴地收下了。


    请问，孔子对于子贡和子路的这两种行为，会怎么评价呢？


    孔子的做法是，大骂子贡，表扬子路。


    他说，子贡你这样做，会让以后想赎人的人陷入为难的境地。因为一旦赎回来，去领奖金吧，别人会拿来和你做比较，显得很丢人；不领奖金吧，人家又没有你有钱，可以不在乎赎金。你这么搞，鲁国以后就没人赎奴隶了。


    对子路，他说：你这么做太好了，以后鲁国人一定会勇于拯救落水者的。


    所以，在孔子看来，做好事要不要让人知道，要不要收到回报，除了考虑个人的内心以外，也要考虑到社会的影响。


    说回慈善，对于个人而言，慈善确实是一种修养行为，没有必要嚷嚷得满世界都知道。如果是为了求名求利而做慈善，那就失去慈善的意义了，本质上是把慈善当生意。


    但是作为公众人物，如果你的行为对其他人可能产生示范作用的话，那么，做了慈善让世人知道，也是对社会有益的，因为这样会鼓励更多的人出来做慈善。


    我做公众号以来，有时去参加企业的活动，会收到600-1000不等的红包，对于媒体行业来说，这个是行业惯例。由于红包往往和入场名牌或门票是放在在一起的，所以不领也不行，如果当场拒绝，会搞得大家都很尴尬。所以我一般也会高兴地收下。但是回头，我会捐给腾讯公益。


    加上一些其他的捐助，这一年多来，我在腾讯捐了12600元。


    前不久写刘秀祥老师的事迹，也组织了一次针对贵州望谟贫困学生的捐助，由于何加盐公众号还是有一点影响力，加上加盐星友会的星友们热心帮助，贵州那边收到的物资堆满了房间，也达到了捐助总额达到十几万元的一对一结对帮扶。


    对于这些慈善行为，我觉得是我个人对社会的一些回馈，是纯粹个人的事情，因此也不愿意拿出来说。但是我认为，就算是拿出来说一下，也没有关系，因为有可能会触动更多的朋友，大家一起来帮助更多有需要的人，让我们的社会变得更好。


    所以我认为，做慈善，让外人知道也好，不让外人知道也好，关键是你的发心是什么？


    如果你的本意是为了个体的修行，而且你喜欢低调、谦逊的，那就不让人知亦可。但是最好也不要对社会造成不良的示范，让人认为为富而不仁是正当的。就算你慈善的内容可以不让人知道，起码你要表现出你支持慈善，自己也在做慈善。不可以认为唯独自己高尚，对别人和你不同的慈善方式冷嘲热讽，打击社会的慈善热情。


    如果你的本意是带动大家一起来做慈善，那么，可能适当的高调可能会更好。我们做了好事不怕别人知道，同时也要让社会看到，做了好事是快乐或者有利于自己的事情。如果社会的宣传导向是做慈善就是吃亏，做好事没有好报，那么做慈善或做好事的门槛就太高了，会极大地打击大众为善的热情。


    所以，只要是为善，那么别人知道也好不知道也好，只要有利于社会，有利于个人道德修养，就都无所谓，别人不知，我固安然；别人不知，我亦欣喜。


    ## 牛人不适用木桶理论，而是讲究一招鲜吃遍天


    木桶理论是管理学上一个重要理论。其原意是：一个木桶能装多少水，取决于最短的那块板子，应用在管理学上，就是说一个组织或者个体的发展，会受限于其最差的那一方面能力。


    这个理论，在一定条件下是成立的。所以很多人会去寻找自己的缺点，改正之；很多企业会寻找自己的短板，弥补之。


    但是对于牛人或者牛企而言，木桶理论就不适合了。更适合他们的是“一招鲜吃遍天”理论。


    随着社会信息流通的加速，整个社会的方方面面越来越往“赢者通吃”的方向发展。赢者通吃，就意味着你只要比对方在关键点上领先1%，就有可能最终获得80%以上甚至更多的市场份额。


    所以在竞争中，关键是长板要长，用长板来拖动个体和组织向前狂奔，在发展过程中把短板补到及格线就可以了。


    我们最近调研了几家企业，每一家都在管理的某些方面存在很大的问题，甚至用“一团糟”来形容，都不为过。但是他们都还在不停地向前发展。原因就在于，保证企业发展的关键因素还在持续发挥作用。


    例如，有一家企业是线上营销能力特别强，营销系统特别强大，进入的行业也正处于红火期，所以，哪怕这家企业员工的整体素质一般，内部管理也很不完善，但是并不会妨碍企业发展的速度。


    另有一家企业是搞房地产的，它的关键能力是老板搞关系特别厉害，总能以较低的价格，拿到比较好的地块，所以不管企业内部怎么折腾，一年还是可以有二三十个亿的营收。


    其实，根据我研究企业的经验，每一家企业，都是千疮百孔的。哪怕是成功如阿里巴巴、华为，内部管理都处处存在问题。内部员工会觉得，这家企业烂透了，都不知道怎么活到今天的。


    但实际上，由于有关键成功因素的支撑，这些企业活到了今天，并且还将继续活下去。


    对于个人也是如此。很多厉害的牛人，身上都有着种种毛病。在不喜欢那些

    '
