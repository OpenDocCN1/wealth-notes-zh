    只要你每天都在进步，时间自然会补偿一切。


    一个单细胞生物，经过几亿年的时光，可以进化成无比复杂的、具有高度智慧的人。就是因为 在漫长的时光之下，每个万年一点点 的进化，带来的最终成果。


    如果你以 1 年去看巴菲特，他比很多炒房、炒股、炒币的人都要弱得多。但是如果你以 50 年去看，会发现他比所有这些人都要 牛。因为他能够持续 50 年，每年盈利
    20%，而其他 人的暴富，都只是很短暂的。


    巴菲特和芒格都曾经说过，我们并没有什么秘密，我们做的事情，别人都能够做到，只是没有人愿意慢慢地变富。


    当你想很快变富的时候，你就不可能做到像巴菲特那样。


    做其他事情也一样。锻炼身体、学习知识、增长见识、获得友谊、取得成绩，都是长期的事情，急不来。如果你希望 一夜之间就都得到，那么这些东西必然 不长久。如果你用三十年、五十年来规划，你会
    发现你的时间安排，你每天做的事情，你的心情，都和以前完全不同了。


    多一点耐心，人生就躲一份从容， 未来就多一点回报。


    你要不要试一试呢？


