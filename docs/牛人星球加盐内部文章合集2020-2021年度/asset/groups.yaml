    # 善良的勇气


    做一个善良的人需要勇气吗？


    很多人可能会觉得，善良是一种品质，是一种选择，是人性的自然流露，并不 需要勇气啊。


    但真正遇到事情我们会发现，其实很多时候，善良是需要勇气的。


    一者，你要过自己的心理关。


    内向的人在要做好事时，会害怕别人异样的目光——哪怕是赞赏的。例如，在公交或地铁上，看到老人没有座位，想要让座，内心就会挣扎。这种挣扎并非 该不该让，而是一开口就会把别人的目光集中在自己身上，内向者就会为此而感
    到恐惧。如果老人就在自己的座位旁边还好，如果是隔了好几个座位，要大声喊 他过来的，那就更是艰难了。


    二者，你要过说服别人的关。


    不同的人对善良的感知不同，你的善良在别人看来可能是迂腐甚至荒谬的事 情。这时候你要善良，就要被别人不理解。例如，有一次我和马桶、胖子在一个 农户家调研，这家农户在院子里拉了个捕鸟网，有好几只麻雀被挂在上面挣扎。
    我们看了特别于心不忍，很想把麻雀放了，甚至把网子给撕了。但是人农户对我 们热情招待，我们要去救麻雀或撕网，却说不出口来，只好在回去的路上自己懊 悔和痛恨自己。


    三者，你要过别人的利益关。


    善良有时会损害别人的重大利益。例如在一家化妆品或保健品公司，你明知 道产品对客户没有任何作用，一块钱成本的东西卖两百块钱。你觉得这不善良， 想要公之于众，让消费者不要再上当。但是这会损害公司的利益。老板损失重大，
    员工可能失业。在官场上就更这样了，你一个人的善良，可能会让别人无法上 位、或者无法得利，甚至通过对比显得别人很罪恶。别人有可能必须除掉你才安 心。


    四者，你要过自己的利益关。


    善良意味着你要选择做某些事，不做某些事，或者一件事这样做，而不那样 做。这就涉及到巨大的个人利益。很可能你用甲种做法，没有乙种做法那么善良，'
  - '[PAGE 263]


    但是赚的钱要有很多倍。这是要你放弃甲种做法而选择乙种，就尤为艰难。如果甲是明显的恶，那可能还好选一点。但很多时候，甲也并非很严重的恶，只是没有乙那么善而已。


    五者，你要过善与善的比较关。


    有时候，善与善是互相冲突的，此种善良会妨碍彼种善良。这时就尤为考验一个人的智慧和价值观。例如，今天孩子过生日，你回家陪孩子是一种善；但是你负责管理的电网发生了故障，很多人家里都停电，等着你去抢修，你去抢修电路也是一种善，其他电工都已经各有各的工作安排，现在只有你一个人能去。这时你该如何抉择？如果说取消陪孩子过生日的安排还相对好处理的话，那么如果是老婆生孩子呢？如果是父母病危呢？


    更大的善与善的冲突，是短期善和长期善的比较，对此人善与对彼人善的比较，以及小善与大善的比较。


    一个小孩犯了错，你原谅他，说没关系没关系，让他不要有心理负担，维持现在开心的心情，这是短期善，但有可能会纵容和鼓励他未来一犯再犯，从长期又是不善的；你严厉批评甚至惩罚他，让他哇哇大哭，这看起来很恶，但是他有可能长了记性，以后再也不犯，这在长期又是善的。


    一个农业国要发展工业化，为了积累原始资本，只能压制农民的生活质量，对农民而言是不善的；但是工人的生活却相对有保障，其福利享受与农民完全是两个世界。


    一个社会要保持和平安宁，要对内镇压坏蛋，对外准备战争，人们要为此节衣缩食，刑法上会比较严峻，战场上会死很多人，这些看起来都不善，但是对整体人民而言，却又是必须要的大善。


    最典型的例子是《三体》里面的程心。她是善良的集大成者，是人类至善的代表。但正是她，两次造成了人类的毁灭；反而是她极力反对的恶，却拯救了人类。这时候，我们要说程心是善还是恶呢？


    所以，善良并不简单，它涉及到无数的平衡与计算。我们有时候会说从心而行，“从心”二字，又何其难啊！'
