    ## 邓颖忠与洁柔


    而不久后，有一件事情让他真正差点死掉。有一回，他和哥哥们开着一条渔船出海玩，开到珠江口虎门地界时，遇到大台风，小渔船差点倾覆在波涛之内，三兄弟都差点葬身鱼腹。从那以后，他们再也不敢自己开船出海了。


    后来，为了生计，邓颖忠帮一个水泥厂做回收水泥袋的生意，由于能力极其出色，渐渐地在当地有了“能人”的称号，甚至村里有了搞不定的事，都会找他去帮忙搞定。


    1979年3月，邓颖忠经人介绍，在顺德承包了一个即将倒闭的纸厂。厂里有5个工人，邓颖忠又找公社借了500元启动费，就这样把厂子开起来。


    他给工人们开出了当时较高的工资，月薪35元。而第一个月，他直接开了双薪，让工人们都惊呆了，以为他给错了。他说，没错，就是这么多。


    此后，这些工人都为他卖命。一直跟随他到老。其中一个最小的，当时才16岁，现在还在他公司当高管。


    而他的钱是怎么来的呢？500元启动资金办了开场仪式，买了材料和设备后就花光了。是他自己在外面继续跑业务挣了360元发的工资。


    就这样，邓颖忠的纸厂开始飞速发展。不两年，他就成为了当时闻名全国的“全国第一镇”6个最有钱的万元户之一。


    1986年元月，邓颖忠意气风发地召集全场员工开年会，热烈的气氛让人毫不怀疑，这家纸厂明年又将迎来飞速发展的一年。结果，当天晚上，一场火灾，把所有东西都烧了一个精光。


    后来，邓颖忠四处找人借钱。一个姓姚的老板借给他200万，说要占股50%。邓颖忠说，不，接下来三年，这个厂是你的，挣的钱全部归你，我帮你打工，只拿工资，不要一分钱利润。如果三年后，没能挣够200万，到时再按你说的办。


    就这样，邓颖忠很快就重新办起了工厂。


    三年后，他开始转型制造卫生纸，并给厂子重新起了一个名，叫做中顺洁柔，从此有了洁柔卫生纸。


    而邓颖忠早在多年前，就开始“死亡演练”，也就是假设自己死了，公司会怎么办。他会半年时间离开公司，完全不闻不问，看公司是否能生存。结果发现，没有他，公司也能发展得很好。于是后面他基本上就不管公司了。


    现在，洁柔已经是巾国第一家 A 股上市的生活用纸公司，市值高达 340 亿。他的家族也被认为是中山市首富。


    邓颖忠不认为自己是牛人。当我说，我是一个专门研究牛人的人时，他把头摇的跟拨浪鼓似的，连声说，我不是牛人，我不是牛人，我就是个小不点。


    他谈话特别有意思。限于篇幅，这里我就不讲了，具体的会在公众号文章里写到，敬请期待。


    ## 葡萄与初心


    家附近的水果店，有两种葡萄。一种售价 19.9 元/斤，味道非常甜；另一种售价 3.9 元/斤，味道一般般。


    我每次去，都会特意选 19.9 的那种。家里老人每次去，都会买 3.9 的那种。


    结果，19.9 的葡萄，总是很快被吃光，而 3.9 的那种，往往能放四五天都还没吃完。


    我相信，咱们很多人的父母，应该都是会习惯性地买 3.9 的那种吧。


    对他们那个年代成长起来的人来说，由于长时间的物资匮乏，所以享受不是第一位的，省钱才是第一位的。去买水果，第一个想到的是要便宜，而不是好吃；买其他东西，也是第一个想到省钱，而不是好用。


    但我认为，时代不一样了，我们的心态应该扭转过来。


    我们去买一个东西，实际买的不是那个东西本身，而是它能够带来的效用。


    我买一个电钻，不是要电钻，而是要墙上的那个孔。我买一个苹果，不是要苹果，而是要苹果的营养、美味或填饱肚子。我买一个咨询公司的服务，不是要咨询项目，而是要我的企业经营管理的改善。


    具体到葡萄，我们去买的时候，想要的究竟是什么呢？


    其实就是为了买“美味”。


    所以我们该不该买，该买哪种，不应该让价钱来定，而应该让美味和价钱的综合来决定。


    一种葡萄不好吃，那么哪怕只卖一分钱，都太贵了。而如果它非常好吃，卖贵一点也可以接受——如果真正经济条件一般，不应该是去为了省钱而买不好吃的葡萄，而应该把买普通葡萄的钱，拿去买少量更好吃的葡萄。


    因为，你要的是“美味”，而不是“葡萄”。


    “美味”就是你初心，“葡萄”是表象。当你能突破葡萄的表象，专注于美味的初心，这才叫“不忘初心”。


    当你突破表象的禁锢，一眼看透本质，想明白自己真正想要什么时，你的人生抉择，就会理性得多。


    你谈恋爱，不是为了一個对象，而是为了爱与互相扶持。


    你上大學，不是为了一个学位，而是为了获得进入人生下一阶段的阅历和知识。


    你找工作，不是为了一份工作，而是为了工作带来的薪水和事业成就感。


    如果没有了后面那ー半，前面的就毫无意义。


    所以，当你决定要去做ー件什め事的时候，不妨在心里多问自己ー句：我做这件事，目的是为了什么？


    千万不要为了省点钱，买了酸葡萄，忘记了自己原来想要的，是美味。


    ## 媒体的立场


    很多中国人都经历过这样的心路历程：小时候，对官僚宣传的东西很相信；长大了一点，知道了媒体的宣传属性，又加上西方理念的影响，又会对官僚报道的东西持怀疑的态度，认为西方媒体才是客观公正的；再成熟一点，才知道，原来西方媒体也都是各有各的立场，哪怕是号称最客观公正的媒体，都会刻意去筛选信息，试图影响读者对某些事物的看法。


    下面的三张照片，分别出自香港媒体、大陆媒体和日本媒体，拍的都是同一个人，但是各自的立场一目了然：香港媒体拍得文艺唯美，目的是美化；大陆媒体拍得土味十足，目的是丑化；日本媒体则纯粹是一种吃瓜娱乐的心态，选取了最能抓人眼球的角度。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_113_0.png)


    都说眼见为实。这三张照片都是眼见，哪一张才是“实”呢？


    只能说，都是事实。但是不同的媒体，为了不同的目的，而刻意选择了突出某一个侧面。而读者，在不知不觉中就被媒体影响了。


    香港的大部分读者，只能看到第一类照片，自然认为那谁是一个悲情英雄。加上持同样立场的文字渲染，他们会无限同情该人及其代表的群体。而大陆的大部分读者，只能看到第二类照片，加上持同样立场的文字渲染，自然认为那谁是一个意图不轨的小丑，他们会无限厌恶该人及其代表的群体。


    于是，互相认为对方被洗脑，是傻×。


    有人可能认为，大陆有管制，只能看到第二张图片；香港或国外没有管制，都可以看见，所以他们的更客观。实际上，这是不了解媒体传播背后的操纵力量。媒体的传播不是自然状态，其背后都是资本和政治的角力。


    在香港，绝大多数人是看不到第二类照片的。他们虽然拥有理论上的可能，但在实际的操作中，素材采集、文章出版、渠道宣发、网页展示，都是资本和政治在背后控制，第二类照片根本就推送不到大多数读者面前。


    在美国同样如此。支持中国的声音不是没有，但是绝大多数读者是看不到的。媒体发行的渠道，网络展示的出口，都被反对中国的声音占领了，支持中国的根本就走不到大多数读者的手机上。


    移动互联时代的“信息茧房”更是加剧了这种现象。一方面，我们选择关注谁，自动就屏蔽掉了反面的声音。另一方面，现在的智能推荐，只会推送你喜欢看到的信息，其他的信息会自动避开你。


    人类信息生产和传播的技术越来越强，但是接受信息和分辨信息的能力却越来越弱，不能不说是一种悲哀。


    我们无法改变规律，只能改变自己的行为。作为读者，我们应该主动去接收多方面的信息，对事物的判断才能更加全面一点，也就不会被某一方可以选择的信息洗脑了。


    如果选择多方面的信息，我在这篇文章里写了一些方法，在此就不赘述。大家可以点进去看一看。


    ## 自己挖的坑，流着泪也要填好


    这次出版《持续进化》，由于是自己的书第一次正式出版，心里还是很开心的，就在星友群发起了帮大家写祝福语和签名的预购登记活动。


    本来也有心理准备，知道这样会给自己带来巨大的工作量，因为要征集每个人不同的祝福语，要写下来，要收款与核对，要逐一快递寄送。可能对于做惯电商或者有相应的系统和平台的人来说，这些都很简单，但是对我而言这些都是陌生的。


    只是，心里怀着一份希望对星友们再好一点的心思，觉得愿意为大家做这些。


    可万万没想到，真正做起来，工作量大还是远超之前的想象。


    在处理星友们预定的书之前，我先在出版社签名了 500 本书（只有“何加盐”三个字的版本），这些是准备在网上卖的作者签名版。


    第一次看到 500 本书摞在一起的时候，我直接惊呆了。我从来没没想到，500本书能有这么多。没有实地看到之前，自己是没有概念的。


    出版社特别安排了两个人来帮忙。一个帮我翻到签名页好让我签名，另一个帮忙把签好的书整理好。


    就这样，我们三个人通力合作，而且我每本书只要写三个字，都用了整整一个小时，写得我手酸脚麻，头晕脑胀。


    我这才知道，原来为了给星友一份福利，我给自己挖了这么大一个坑。


    昨晚出差回来，没来得及陪孩子玩，就先去弄星友祝福版。本来想是大家登记的预购信息先打印出来，逐一核对。结果家里的打印机又坏了，老是卡纸。只好对着电脑上的电子版核对。


    搞了一晚上，最后才签了几十本。照这样下去，全部搞完，真得一个多月星期。


    不过，看着星友群大家的热情，我又觉得，付出这么一点时间和精力，是万分值得的。大家这么支持我，我为大家做这么一点小事，苦点累点又算得了什么呢？


    感谢每一位星友和每一位购买《持续进化》的人。我会加紧急快搞好写祝福话和配送的问题，争取让大家早一点拿到书。也特别希望能听到大家阅读这本书的读后感。


    ## 经典尚需多温习


    最近用日常零碎时间在重看《西游记》书，发现自己的关注点完全不一样了。


    小时候只知道看猴子多厉害，看到打妖怪就开心，看到描写景物、人文的就跳过，看到长老哭哭啼啼就不耐烦。


    高中时看西游，却总会去玩味那些描人状物的诗词。每看到“但见那山……”、“你爷爷我……”、“我这神兵……”就觉得很有意思。


    例如这一段描写八戒来历的：


    > 那怪道：“是也不知我的手段！上前来站稳着，我说与你听。我——

    > 自小生来心性拙，贪闲爱懒无休歇。不曾养性与修真，混沌迷心熬日月。

    > 忽然闲里遇真仙，就把寒温坐下说。劝我回心莫堕凡，伤生造下无边孽。

    > 有朝大限命终时，八难三途悔不喋。听言意转要修行，闻语心回求妙诀。

    > 有缘立地拜为师，指示天关并地阙。得传九转大还丹，工夫昼夜无时辍。

    > 上至泥丸宫，下至脚板涌泉穴。周流肾水入华池，丹田补得温温热。

    > 婴儿姹女配阴阳，铅汞相投分日月。离龙坎虎用调和，灵龟吸尽金鱼血。

    > 三花聚顶得归根，五气朝元通透彻。功圆行满却飞升，天仙对对来迎接。

    > 朗然足下彩云生，身轻体健朝金阙。玉皇设宴会群仙，各分品级排班列。

    > 敕封元帅管天河，总督水兵称宪节。只因王母会蟠桃，开宴瑶池邀众客。

    > 那时酒醉意昏沉，东倒西歪乱搬泼。逞撞撞入广寒宫，风流仙子来相接。

    > 见他容貌挟人魂，旧日凡心难得灭。全无上上下尊卑，扯住嫦娥要陪歇。

    > 再三再四不依从，东躲西藏心不说。色胆大时叫似雷，险些震倒天关阙。

    > 纠察灵官奏玉皇，那日吾当命受挫。广寒围困不通风，进退无门难得脱。

    > 却被诸神拿住我，洒在心头还不怯。押赴灵霄见玉皇，依律问成该处决。

    > 多亏太白李金星，出班俯囟亲言说。改刑重责二千锤，肉绽皮开骨将折。

    > 放生遭贬出天关，福陵山下农家业。我因有罪错投胎，俗名唤做猪刚鬣。”


    上面这段说辞，把八戒的经历说得特别清楚，尤其是那些如何修仙的名词，怎么调戏嫦娥的细节等等，都描写清楚了，这些光看正文是看不到的。正文里只会写到“只因醉酒调戏了嫦娥”，而不会写他扯住嫦娥，要嫦娥陪睡，嫦娥再三再四地不依从等等。


    此外，大学时看西游，会发现原来八戒的幽默不仅是穷货的好玩，而且也有言语机锋的智慧。


    例如有一回唐僧被某个水怪抓了去。猪八戒哭哭啼啼地回到寄宿的庄子上，庄上的人问“怎么只见你们回来，三藏老爷呢？”八戒回复道：“不叫三藏了，改名叫陈到底也。”（唐僧俗名姓陈）记得我当时因为“陈到底”三个字，回味了很久。又如福禄寿三星到五庄观，八戒插科打诨，言语行动均妙不可言，那可不是一个呆子能说出来、干出来的。


    当然，高中大学时看，还有一个关注重点是关于“真真、爱爱、怜怜”、“女儿国王”、“蜘蛛精”这些片段。这估计是所有青春期性苦闷男孩的共同点。


    现在重看，就发现注意力都变了。


    我会发现，那些描写当时的礼仪、司法、风土人情这些的文字，特别有意思。


    例如妖精之间也讲礼法，互相见面如何行礼，是跪拜还是唱喏，口中是怎样的谦辞。如果是写信的话，更是好玩。例如黑水河的鼍精抓了唐僧，要请他舅舅一起来吃唐僧肉，信是这样写的——


    > “愚甥颚洁，顿首百拜，启上二舅爷敝老人台台下：向承佳惠，感感。今因获得二物，乃东土僧人，实为世间之罕物。甥不敢自用。因念舅爷圣诞在迩，特设菲筵，预祝千寿。万望车驾速临是荷！”


    又如悟空和八戒夜闯乌鸡国御花园，悟空大呼小叫，八戒吓得扯住悟空说：


    > “哥呀，害杀我也！那见做贼的乱嚷，似这般吆喝！惊醒了人，把我们拿住，发到官司，就不该死罪，也要解回原籍充军。”


    上面这样涉及司法的言论还有不少。有时候一个恶狠狠妖精对悟空说，“你怎么就敢打破我的洞门？你这样是犯法的，小心问你个充军之罪”，让人感觉非常违和。


    另外就是，很多以前没有注意到，或者看不懂的细节，现在是第一次注意到。


    例如，黎山老母戏耍猪八戒，说有真真爱爱怜怜三个女儿要嫁给他们三徒弟。猪八戒说，都嫁给我一个人得了，其中有这么一句：“我幼年间，也曾学得个熬战之法，管情一个个伏待得他欢喜。”


    像这样的话，以前看到也不明白是什么意思。现在才知道，原来吴承恩也是个老司机。


    还有一处，乌鸡国国王死后，被悟空用仙丹救活，但是还没有反应，唐僧说，需要给他度一口气，于是悟空就给国王做人工呼吸。


    看到此处，我就会感叹，原来古人也知道人工呼吸，看吴承恩的描述，至少这种救人方法在明代应该是常识。


    还有很多类似上面的有趣的地方，这里就不一一记述了。总体感觉是，经典真是常读常新，接下来还要继续把以前读过的一些经典说重新读一遍，不能总是贪新。


    ## 头条和拼多多之后，还差一个新的社交方式


    第一代中国互联网巨头以百度、阿里和腾讯为代表。他们运作的模式是：先建立一个集中式的超级大脑，然后用户到里面去寻找自己想要的东西。百度建立的是集中所有信息的超级大脑，用户在里面找信息。阿里建立的是集中所有商品的超级大脑，用户在里面找商品。腾讯建立的是集中所有人员的超级大脑，用户在里面找人员。


    在移动互联、移动社交和大数据时代，以分布式网络下的大数据分析和人工智能推荐为主要特色的新模式出现了。


    字节跳动颠覆了百度。他不是先把信息储存在图书馆里，由用户去找，而是先用算法发现用户想要什么信息，再由人工智能把信息推给用户。


    所以在今日头条和抖音上，我们不是去搜索想看什么信息，而是直接打开APP 就开始阅览文章或者观赏视频。AI 已经研究了我，它会主动把我想要的东西拿过来。


    拼多多颠覆了淘宝。他不是先把商品陈列在货架上，由用户去找，而是由用户的朋友在微信里向用户推荐货品，或者在 APP 上由算法发现用户想要什么货品，然后推荐给用户什么货品。


    所以我们使用拼多多，起初并不是打开拼多多的 APP 开始搜索，而是因为 在微信里收到朋友发来的拼团链接；当使用 APP 以后，我们主要也不是搜索，而是像刷抖音一样往下滑，滑到自己想要的东西就买了。


    张一鸣和黄峥都是程序员出身，都是很早就从事信息分发 的研究。张一鸣创业初期就想明白了，未来是人工智能分发信息的时代，所以从今日头条上线，就采用了大数据+人工智能的路子。黄峥大学和研究生都是做数据挖掘和人工智能的，创立拼多多就是也用的这两个路子。


    今天的字节跳动早已超越了百度，拼多多离超过淘宝也已相差不远。即便它们可能无法完全取代他们的传统对手，但起码他们开辟了新的天地，并且在新天地他无比迅猛崛起。


    而且不像美团要经历千团大战、滴滴要经历打车大战才能成为行业霸主，字节跳动和拼多多，都是横空出世、唯我独尊的崛起。他们不是在一个人潮汹涌


    涌的红海里鏖战，而是乘着大铁船穿越虫洞去到了 1628 年的临高，独自拥有了一片时空。


    信息、商品、人，是网络上最重要的三个东西，在传统互联网时代分别催生了百度、阿里、腾讯三大巨头，在移动互联网时代已经催生了字节跳动、拼多多两大巨头。


    现在关于人，还是空白的。微信算是和字节的以及拼多多的同类吗？我觉得还不是。应该有一个全新的，与字节和拼多多一样，基于分布式网络、大数据和人工智能推荐的新鲜事物出来。


    这个新鲜事物，才是未来可能颠覆腾讯的社交之王。


    ## 每一个深夜，我都看到无数人在骂任正非、马云……以及何加盐


    我一贯认为，那些做出了大事的人，无一不是誉满天下，亦谤满天下。自从开始写牛人后，对这种感觉更是明显。


    一个是在研究资料的时候，就会发现不同的人、不同的媒体对同一个牛人，往往会 有不同的评价，有时候甚至是分布于两个极端。


    另一个是文章发出来之后，评论总会有不同的声音出现。不管我写任何一个人，都是如此。无非有些相对统一一些，有些更为极端一些。但是没有哪一个不是同时存在相对立的两种的观点的。


    此外，同一个人，在不同时期，大众对他普遍性的评价也很不一样。例如柳传志早先是民族英雄、企业教父；后来却被很多人骂为汉奸走狗、买办等。


    王石早年在舆论中的评价极高，但是 08 年之后急剧下降，红烧肉事件之后更是降至极点。


    也有反过来的，马化腾早年间的舆论中常常是被批判的对象，现在相对非常正面了。任正非早期在大众中没有什么存在感，但现在却成为举国瞩目的大英雄。


    但是，即使如此，现在也有很多喜欢柳传志和王石，讨厌马化腾和任正非的。


    我写牛人，总是习惯于相对客观地去描述事件，不掩其功，不讳其过。所以大家在我的文章里总会看到一个牛人的两面。这对于很对习惯持“非黑即白”观点来看世界的人是接受不了的。


    他们无法忍受一个人怎么可能是又好人又是坏人，一个他认为的坏人怎么可能会存在值得夸奖的地方，一个他认为的好人怎么可能会做出危害社会的事情。


    这些人完全无法理解社会和 人性的复杂。


    所以对何加盐的评价也非常极端。我的文章经常很不讨好，每一篇都是得罪两边的人。喜欢那位牛人的读者认为我在黑主人公，讨厌那位牛人的读者又认为我在捧主人公。甚至很多次，文章下面的评论同时会出现两种风格——上


    面一条是：你收多少钱在这里黑他？下面一条接着就是：他给了你多少钱让他捧他？


    作为自媒体作者，这样是不讨巧的。职业化的做法，是不要客观，只要立场。你选择好一个立场，不管是黑还是捧，都更能吸引你的目标读者，更容易搞 10 万加。更厉害的做法，是做两个号，左右互搏，同时收割两边的粉丝。像我这样同时得罪两边粉丝的，只能称之为傻。


    但没办法，我就是这样子。企业家做得好的地方，我会去夸；做得不好的地方，我会去批评。而且在夸和批评的时候，我不惮于用较为浓烈的情感去做。所以我批评一家公司会比较狠，但是表扬同一家公司也会比较狠。


    世界是这样复杂，世人也是这样复杂。那我们应该怎么应对这种复杂，以及因为这种现象的复杂而带来的情绪的复杂呢？


    - 首先，如果你要做事，就不要怕负面的声音。要知道，不管你做得多好，总会有人在旁边风言风语，不如就当他们都在放屁。

    - 第二，如果你是一个写作者，就按照自己的心去写，不要管别人怎么说。当你的文章开始有一点影响力的时候，你会发现，无论你写什么，无论你怎么写，总会有杠精在下面喷粪。对这种就直接无视就行了。

    - 第三，如果你是一个读者，我建议你放平心态，包容一点，最好是同时了解一下两方面的信息。如果你只是坚信自己这一面的立场，而去否认另一面的存在，那么你的人生成就一定不会高。


    总而言之，最好的应对办法，莫过于岳麓书院那副对联所启示的：是非审之于己，毁誉听之于人，得失安之于数。


    与诸君共勉。

    '
