    ## 提问 15


    何老师请教您：站在您的角度，牛人之所以牛，跟他小时候接受的教育和思维锻炼有关系吗？现在小孩子的各种线上线下的思维培训班层出不穷，到底该不该报一些呢？


    现在老婆整天吵着给孩子报各种线上课，有没有必要呢？我孩子3岁半了，您对于孩子的教育，是不是也特别注重这种线上线下 的各种培训课呢？期待您的回答。 有人说很多线上课是收家长的智商税，其实对孩子作用不大，你怎么看待呢？


    **答：**


    肯定是有关的，但这些教育和思维训练主要来自家庭，而不是学校和培训班。所以与其希望别人来改造自己的孩子，不如自己多陪陪，多想些好玩的亲子游戏来锻炼孩子。


    孩子要不要报线上课，要根据他自己的兴趣和需求来决定，而不是大人的愿望来决定。如果孩子觉得很有兴趣，那就报，能学到东西更好，学不到，他也享受到了乐趣，画画、钢琴、书法、下棋等都是如此。还有就是看孩子的需要，如果他的身体素质实在是很差，那么一定要报一个体育类的班，不管是武术、跆拳道、击剑、还是篮球、足球、羽毛球、网球、游泳等都行。上学了以后，如果数学、英语等拖后腿比较严重，可以报一个相应的班补一补。


    千万不能是父母觉得希望孩子成为小提琴家，就逼着孩子拉小提琴；或者是不顾他自己的兴趣爱好和需要，硬逼着学他完全享受不到乐趣也不是生存必须的东西。另外就是，我们也不要对孩子期望太高，牛人的教育方法可以采用，但是不能对孩子抱有成牛人的期待。牛人毕竟是少数；我们的孩子大概率都是普通人。


    ## 提问 16


    何老师相信八字紫微斗数等玄学吗？人的命运轨迹是否真的出生了就基本注定了？


    **答：**


    我相信人生和世界都有一些我们无法解释的现象，但是并不相信星座、生肖、占星术、八字紫微斗数、占卜等一切号称能算命和预测的东西。


    不相信这些东西，是不认同他们的原理，也不认可他们的准确性。但并不代表不相信他们的作用。人们需要确定性。一个不准确的确定性，可能比精确的混沌对人更有用。


    所以对我而言，也会去了解一下，有时也会用着玩，但不会全然当真。


    至于人的命运是不是注定，要看怎么说。大体上而言，有很多东西是被环境注定的。例如，一个女孩子，出生在明清之际的地主家庭，我们可以断定她的脚骨会被折断；一个男孩子，出生在犹太家庭，我们可以断定，他的包会在很小的时候就被割掉；一个青年人在今天的中国，他未来十年的收入增长幅度会比在日本和欧洲要大，等等。


    但对于单个个体而言，他与同一群体内的其他人相比，其个人命运又会呈现差异性。一个清朝的女孩子可能会成为林黛玉，另一个却可能会成为薛宝钗；一个犹太男孩可能会不幸死在集中营，另一个却发明了相对论受世人敬仰；一个中国青年可能成长为亿万富翁，另一个却可能失业找不到工作。
    所以说，一个人的命运，既要看个人奋斗，也要考虑历史的进程。


    ## 提问 17


    何老师，想问一个问题，如何在满满的工作之余逐渐发展出自己想要做的工作，并且在这个领域有自己的一些亮点呢。我是在一个事业单位工作，这边主要负责外资外贸和跨境电商。最开始的几年，不断接触新的事物，对工作也有很多热情。但是事业单位工作毕竟在职业发展和工资方面存在的很大的局限性，随着工作年限的增加和自己年龄的增长，焦虑感也不断增加。虽然很稳定，但经常会出现一些乏味感觉，更严重的是可以看到自己未来的几十年就陷在这里了，感觉人生的可能性和宽度都被局限了。因此，从去年底又拾起原来的爱好，开始学插画，也希望之后可以把这一块慢慢转化为工作，从头开始，自己跟其他有基础的人比起来是有一定差距的，平时工作很满练习的时间也不多，进步也比较慢，有的时候想想会有点无望。所以想请教一下这个问题，谢谢您。我还是希望自己的生活可以更加丰富，视野更宽一点，这样感觉在不在此生。


    **答：**


    这个问题是人到中年常见的老问题了，只要接近 30 或超过 30，大部分人都免不了会想这个问题，年纪越大，越是强烈。


    对于未来的思考和事业的选择，可以从三个维度出发：


    - 我能干什么？

    - 我喜欢什么？

    - 什么能赚钱？


    这三个维度，满足得越全面越好。如果只是满足其中一个，但另外两个都不满足的，建议不要选。


    插画这个事情，假如你是真的无比热爱，恨不得朝思暮想，不干这个就觉得难受。那没的说，这肯定是你可以选择的方向。热爱本身就是最好的理由。


    但如果只是一般的喜欢，可有可无的话，最好还是先作为一个爱好培养着，然后看看有没有什么方式能变现。 例如去投稿，或者加入其它需要插画业务的公司，或者通过公众号、视频号、抖音等方式，向大众展示你的才华与个性等等。如果受到很多人认同和喜欢，有了变现的渠道，可以考虑职业化作。


    但是做职业化运作也要有心理准备，爱好是一回事，职业是另一回事。有时候我们业余玩一玩觉得一个事情很有趣，很轻松；但是当成它为饭碗时，有可能会丧失了乐趣。


    如果现在自己插画的水平也不行，干了很久也赚不到钱，那最好还是不要专职做。就当个业余爱好，调剂一下自己的生活吧。


    从未来长远来看的话，还是要看你自身想要改变的意愿、你的行动能力、你的风险承受能力。如果你的意愿极其强烈、执行力也不错、以往积蓄也可以支撑未来两三年无收入的日子，那么不妨结合自己的兴趣爱好和能力，尝试一下别的事情。如果你只是有点焦虑，但是意愿并没有多强烈；或者你就是想一想，其实自己没有采取行动；或者由于家庭开销大，以往没有积蓄。那么我觉得还是谨慎一点比较好。


