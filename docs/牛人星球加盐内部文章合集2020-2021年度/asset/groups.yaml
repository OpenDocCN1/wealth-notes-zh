  - '[PAGE 49]


    毛病的人看来，这种人居然能够成功，真是苍天无暇。


    例如乔布斯，根本就不知道如何处理人际关系；马云，是个满嘴放炮的大忽悠……


    但是他们都有自己特别擅长的一点。乔布斯的创新能力与对产品的极致追求，马云对未来趋势的把握和对企业文化的打造，这是都非常人所能及。决定他们成功的，是这些因素，而不是那些缺点。


    所以如果你想成为牛人，或者你的企业想成为牛企，不要老去关注自己身上的缺点，要更多关注优点。要想一想，我的关键成功因素是什么？这方面能不能再突出一点？它和社会发展大趋势能怎么结合？


    对于那些缺点，如果是会影响到你个人或企业发展的，那就把他们弥补到及格线，让它不要太拖后腿就行了。对于那些不影响你个人或企业发展的，就随他去吧。'
