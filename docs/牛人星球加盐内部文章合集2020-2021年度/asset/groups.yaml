    # 何加盐都读些什么书？


    前一阵，有星友问到我是怎么读书的，都读了什么书这些问题。在这里也和大家分享一下，或许会对你提高阅读效率有点启发。


    我的读书主要是分为四种情况：


    第一种是为短期目标服务的读书。例如，我写某个牛人的故事，就需要阅读该牛人的的传记、寻找一切和他有关的报道、采访、演讲等等，然后快速阅读。关于马云、刘强东、王石、巴菲特、芒格、曹德旺等人的书，都是在这种情况下读的。


    这种情况下的读书，只能囫囵吞枣，从中发现值得写作的素材，并且把关键事件或者对话做上标记，或者摘录在一个专门的文档里，方便写作时随时查阅和调用。


    我要读的资料主要分为三类：一类是曾经出版过，但是在网上找不到的纸质书。我会提前在京东、拼多多或孔夫子旧书网等网站买好，等写到相应文章的时候，集中阅览，把需要用到的地方划线，极端重要的地方会折纸。


    第二类是在“微信读书”APP上可以直接找到的书，我会在手机端或者电脑端阅览，重要的地方做上标记，需要调用的时候，直接找到标记栏，快速查阅。也会利用关键词来搜索，快速速读想要的内容。大部分的书其实都可以从这上面找到，我强烈建议喜欢阅读的朋友装一个微信读书，并且付费开通无限阅读权限。


    第三类是在网站上找到的书或者网页。我会迅速浏览一遍，然后拷贝复制到一个word文档。如果写作时记不住，需要调用，就用ctrl f搜索关键词来快速定位。通常写一个人，攒下来的word文档会积累十几万字。


    第二种读书是为中期目标服务的。例如，与公司业务相关的技能型书籍，如战略规划、人力资源、品牌营销、财务管理、文案写作等等。


    这些书籍我可能不会马上就用，但是对我公司的业务发展是有帮助的，说不定什么时候就可以用上。


    第三种读书是为长期目标服务的。它可能不会马上对写作或者公司业务有用，但是会开阔我的思路、拓宽我的眼界、提升我的认知、提升我的道德，潜移默化地对我施加影响。例如《毛泽东选集》（或者《圣经》、《论语》、《资治通鉴》）、'
  - '[PAGE 92]


    《人类简史》、《阿德勒心理学》、《王阳明传习录》等等。


    这些书可能一年两年都用不上。但是读之前和读之后，我知道自己会产生很多变化。他们是使我进化的重要源泉。


    第四种读书就是纯粹的消遣，不抱任何目的。例如看一些小说、散文、杂文等等。我有时也会看一下网络小说，或者纸质小说，没有任何功利性，就是因为喜欢。


    例如我会复习《红楼梦》或《三国演义》，看《三体》、《一句顶一万句》等流行的小说，也会看《临高启明》、《修真四万年》等网络小说。


    近来，由于工作都比较忙，所以第一类和第二类书相对看得多一点，而且是工作时间看。休息时间主要看第三类。通常会从晚上 11 点看到 1 点再睡觉（因为白天实在没有时间）。


    第四类书现在看得很少了，主要是等车、排队、坐地铁、坐飞机、上厕所的时候才能看一点。所以感觉还挺遗憾的。


    以上就是何加盐平时读的书及读书的方式。希望对你有点启发或触动。'
  - '[PAGE 93]


    # **我们并不知道未来的感觉**


    这几天趁孩子放暑假，带他们到久已向往的沙漠旅游。


    由于女儿已经念叨了无数遍，说是很盼望露营，于是我们就专门安排了一个住沙漠帐篷的环节。


    女儿对此无比期待。一望无垠的沙漠，辽阔浩渺的星空，都浮现在她的想象中，表现在她憧憬的描述中。


    结果，昨晚真往了以后，她才发现，沙漠和星空确实是自己想象的那样，但是还有更多东西和自己想象的不一样。


    例如，帐篷里没有电，没有空调，没有洗浴，没有厕所。


    要洗澡只能公共淋浴，上厕所要到两百米远的地方，半夜黑漆漆的沙漠无限恐怖，而且冷得要死，帐篷空间很窄而且全是沙子，气垫床垫一动就哗啦啦响……


    于是，一晚上女儿半骚满腹，也没有睡好觉。早上起来，在我们的教导下，她光荣地学会了一个“叶公好龙”的成语。


    另一方面的例子是，当我们耍出去玩时，儿子一直闹着不肯出门，他觉得在空调房里看奥特曼才是世界上最幸福的事。


    但我们硬拉着他出来。结果，玩得最开心的就是他。


    以上这样的例子，经常会在我们生活中出现。


    我们在做一个决定时，往往会去想未来的场景，然后根据自己臆测中的快乐与痛苦来作为当下决定的依据。


    但很多情况下，这样做出来的决定，到我们真正经历其结果的时候，我们真实的快乐与痛苦，和想象中的很不相同。


    只有当我们的脚踩在沙子里的时候，你才能真正感受到它的细腻或者粗糍，它的冰凉或者炙热；


    只有当我们置身于海边时，你才能真正感受到海的狂暴风浪和穿透一切的紫外线。


    而在前面的想象中，这些都是被忽略的细节。但恰恰是这些细节，决定了我们真实的感受。'
  md: '

    第二种方式叫 What If（如果……会怎样），如果我这样做，会怎样……


    这个方式可以先不用理会逻辑，而是把各种奇思妙想都抛出来，然后与目标相对照，看看是否能够吻合。


    同样是让平凡人变成牛人，如果用 What If 的方式，可以这样想：


    - 也许我可以到大学去讲课；

    - 也许我可以在一线城市举办跨年演讲；

    - 也许我可以设计帮助人成长的线下课程；

    - 也许我可以请牛人来分享；

    - 也许我可以设计一个共学的社群；

    - ……


    这其实就是所谓的"Brain Storm"（“头脑风暴”或“脑暴”），一切点子都可以提。提出来以后，再看它是否有利于实现目标，需要投入多少资源，可行性有多高等等。


    脑暴的时候，也不能漫无目的地瞎想，可以通过不同的线索来帮助自己梳理。举个例子，让你列举世界上圆形的事物，你能列举多少个呢？


    如果我们漫无目的地瞎想的话，可能列出十几个就没有头绪了。这时，你可以设定一些辅助思考的线索。


    东东枪举了一个例子：你可以按照自己每天起床时的动作顺序来想：起床睁眼，眼珠是圆的；看一眼闹钟，钟面是圆的；打个呵欠，嘴张圆了；去刷牙，杯子口是圆的；接水，水龙头出水口是圆的；照镜子，很多镜子是圆的……


    如果按照这样一条线的话，能想起来的圆形就多多了。


    我们在咨询工作中，常用的是 MECE 原则，就是不重复、不遗漏。这也是特别强大的工具。


    例如，怎样把平凡人变成牛人？


    这涉及到三个方面：变成牛人的方法；不同平凡人的特质；我接触和帮助平凡人的方式。


    以上每一个方面，又都可以再分解。我们以分解第三点作为例子：


    接触和帮助平凡人的方式，包括线上和线下两种。


    线上方式包括：文章、视频、音频、课程、社群。文章的渠道包括：公众号、微博、今日头条、百家号、企鹅号、知识星球等等；视频的渠道包括：微信视频号、B站、抖音、快手、优酷、爱奇艺、YouTube
    等等；音频的渠道包括……


    线下方式包括：见面会、线下课、年度演讲、一对一辅导、电话沟通、视频沟通、聚餐……


    你看，只要给出一个好用的工具，你梳理起来就会快很多，有条理很多。


    ## 未来的超级风口？


    睡前看书，一边看一边胡思乱想，突然想到一个未来可能的超级风口，和大家分享一下。


    人类信息的传输方式，最早是无意义的喊叫，逐渐发展成语言，然后有了结绳记事，后来有了文字。


    有文字以后，人类就进入了一个新的时代。古人说，仓颉造字，百鬼夜哭，就是因为原本只属于上苍的能力，被人类掌握了。


    从信息传输的介质来看，原本是声音，后来是绳子，然后是泥版、石碑、龟甲、莎草纸、竹简、布帛，到后来终于有了纸，有了书。活字印刷术出来后，书籍的传输加速了，人类的文明进步也加速了。


    19 世纪以来，人类发明了电报、电话、无线电、电视机，然后是电脑、智能手机。


    现在，我们传输信息的主要方式有：手机、口头、电脑、书本和纸张等。


    不管是书本、电报、电话、无线电、电视、还是电脑、手机的出现，本质上都是信息传输方式和介质的改变，每一次都造成了世界的巨变。


    那么，智能手机之后，下一种传输方式是什么呢？下一个传输介质是什么呢？我们每个人，可能在生活中，都曾经幻想过，如果能和别人心灵相通会怎么样。文学和影视作品中，也有无数描写“意念传输”的情节。


    从本质上来讲，我们的思维、动作、语言，都不过是大脑结构中某些物质运动的结果，这些运动会释放某一种电流或者电波，或者某一种类似电流或电波、但还未被人类发现的其他东西，经过神经的传导，来控制我们最终的思维、以及我们表达思维的方式。


    不管是电流、电波，还是未知的某一种形态，它总能被测量、记录、复制、读取吧？


    如果未来，我们可以直接用某种仪器读取脑电流或脑电波，并解读、传播到机器、甚至另一个大脑中呢？


    假设，以后每个人都戴一个特别制作的帽子，或者直接植入一个特制的芯片，帽子或芯片可以监测大脑皮层的运动，然后通过天线把这些运动的数据传递给别的帽子、芯片或者一个中央处理系统，然后翻译成别人可以理解的影像或者文字，甚至不必翻译，直接以电流或电波的方式，传输到大脑的中，让对方一瞬间就知道对方的所有思维活动呢？


    如果今后的科学能在这方面有所进步，那人类社会将发生天翻地覆的改变。在科幻中，其实我们已经多次见识过这样的场景。


    《三体》里面的三体人，互相之间就是直接传输脑电波，所以三体社会是没有秘密的社会，也不知道什么叫谎言和欺骗，这才有了人类的面壁计划，也才有了后面的故事。


    而玄幻小说里，人们可以用“神念”或者“神识”来交流，记录信息的东西往往是“玉简”，把玉简贴在额头，就可以直接向里面写入信息或读取信息。这也可以理解为脑电波的存储与读取。


    当然，从目前来看，这个东西还太遥远，还存在于科幻甚至是玄幻之中。但我相信科学界应该已经有了不少的进展。关于脑机接口、意念控制，都已经在实验层面实现了。意念打字和意念取物，在研究所里面都已经不是难事，只不过离大规模商业化还有一点距离。


    人类的大脑虽然无比神秘，但是从物理和生物的底层逻辑来讲，仍然是物质与运动的结合，从理论上是可以认知的，而科学也确实是在不断加深对它的认知。大脑皮层运动的监测、生物电流的识别等，现在都已经在某些程度上可以做到。未来发明监测脑电波的仪器，也并非天方夜谭。


    所以，我个人是很看好这个领域的发展。只不过，还需要多少年，才能取得关键的突破性进展，那就不是我猜测的了。从电脑、互联网、移动互联网、人工智能等领域过往这几年的发展速度来看，我们离这一天应该不太久。


    ## 参观华为记


    受华为公共事务部邀请，昨天去华为参观交流，感触颇深，特记之。


    其实很多年前，我就去过华为，在他们某部人员的带领下，参观了华为大学、工作区域、任总办公处等地方。


    当时，华为正处于意气风发的时候，在通信领域已经把朗讯等一众国际巨头全部挑落马下，前面只剩下思科一家。


    接待我的那位朋友和我讲，思科已经不算什么了，我们已经成立了“打 C 办”（思科的英文名为 Cisco），很快就能把它干掉。


    我不知道那位朋友是吹牛还是确有其事。反正当时听了很感振奋。但现在回想起来，也许华为在那时就埋下了今天的苦果。


    思科也是美国高科技顶尖的企业，在行业龙头的位置待了很多年，是美国的创新、就业、纳税大户，也是美国的骄傲。而华为说干掉就干掉了，美国人心里能好受吗？


    当然这不是说华为不该把思科干掉，也不是说华为应该把思科干掉。在商业中，它俩处于直接竞争的位置，华为成为世界第一，在全球攻城拔寨，思科和美国必然感到很难受。这是商业竞争规律，不存在该不该的问题。


    但它在现实中造成的后果，就是美国接受不了这个结果，在其他地方应对，因而造成了今天的这个局面。


    昨天在华为，我们先是参观了 ICT 技术展厅，看了华为的部分技术布局，如芯片、全栈 AI、wifi-6 等，一个总体感觉是，未来几十年，世界不管往哪个方向发展，华为都是必不可少的底层基础设施，而且是全世界竞争力最强的玩家之一（或者“之一”都可以去掉）。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_83_0.png)


    华为现在研发工程师有9.6万人，一年投入研发的资金就高达1317亿，这两个数字都是世界之最。这种对研发的超级重视，一直以来都是华为保持竞争力的重要源泉。


    华为新的使命是：把数字世界带入每个人、每个家庭、每个组织，构建万物互联的智能世界。


    看到这三个“每个”的表述，我不由感叹华为的雄心之大。


    中间交流的时候，华为主管公共关系的副总璟静和AR/VR总裁李腾跃都做了演讲。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_84_0.png)


    听璟静的演讲，感受最深的就是任总提出“开门办华为”。这两年来，华为可能也感觉到了此前不和外界沟通，不和新闻界打交道的做法，未必适应新的形势，所以来了一个一百八十度的大转弯。多年不接受采访的任正非，一反常态密切接受记者采访，一年的时间竟然做了37场。而到华为采访的记者，多达几千人。


    任正非要求华华人在 接受采访和对外发言时，允许自黑，不许自夸。这个要求也令我大开眼界。真是很少见到这样的公司。


    李腾跃则主要介绍了AR/VR的发展趋势。


    他讲到，2014年前后，AR/VR有一波兴起的狂潮，但是技术还不足以支持，所以后来泡沫破裂，沉寂了几年。现在随着技术的不断进步，开始了全面的产业复兴。他认为AR/VR是下一个三十年的“Big
    Thing”。


    李腾跃演讲中提到的AR/VR发展趋势和使用场景，和《在“比‘5G有多快’更重要的，是5G将带来哪些改变”这篇文章中写到的差不多，大家可以看一看。


    其中有一个令人印象极其深刻的细节：有人问李腾跃，华为会不会参与AR/VR的内容创作。李腾跃说，我们只负责提供设备，也负责部分的软件应用，


    至于内容，就让腾讯，或者网易这种小公司去做吧。


    听到“网易这种小公司”，坐席皆笑了，李腾跃刚开始没反应过来，愣了几秒才知道大家笑什么，然后自己也笑了。


    交流期间，华为的人拿出了新款 VR 眼镜给我们试用。虽然我很早就理论上知道 VR 眼镜的牛逼之处，但是真身临其境地试用，感觉还是很受震撼。


    其中一个内容是韩国某个演唱会。戴上眼镜之后，歌手和舞者就出现在你的面前，连眼睫毛都看得清清楚楚，距离近到仿佛歌手气息你都能感受到。


    看完这些 VR 的节目，你会强烈地感觉，现在流行的抖音、快手，几乎还处于原始时代，VR 才是未来。


    娱乐只是 VR 一个极小极小的应用而已，却已经足以创造万亿级的产值。而 VR 还可以用于教育、设计、购物、体育、健身、餐饮等等所有你能想到的业务上。


    移动互联网时代有句话，叫做所有行业都值得重做一遍。VR 技术成熟后，这句话大体上也成立。


    所以我坚定地认为，VR 未来将会大爆发。当然这个时间是 3 年、5 年，还是 10 年，我不能马上判断。只是有一种感觉，应该已经很近了。


    下午主要是在华为松山湖基地——溪流背坡村游览参观。


    这个地方投资 100 亿建设，占地 1900 亩，由十几个欧洲风格的小镇组成，风景极美，看着根本不像公司，而像一所大学，而且和中国最美的大学相比，丝毫都不会逊色，在里面逛一圈，恨不得立马成为华为人，到这里来工作。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_85_0.png)


    下午在溪流村的一家咖啡馆，拍下了这样一张明信片：


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_86_0.png)


    上面写着两句话：回头看，崎岖坎坷；向前看，永不言弃。中间是一架伤痕累累的飞机。下面的写着：没有伤痕累累，哪来皮糙肉厚，英雄自古多磨难。


    今天的总体感觉是：华为是数字时代不可或缺的底层设施，其未来不可限量。华为极端重视研发，重视人才，技术上也无可阻挡。目前的困难，完全是来自于政治层面，艰难险阻超乎想象，但是一旦迈过这个难关，华为也将迎来更大的辉煌。


    ## 每天卖给自己一小时


    查理·芒格二三十岁的时候，在洛杉矶当律师。当时他的时薪是 30 美元。


    有一天，他突然想到，我应该把最重要的时间留给最重要的客户。那么，我最重要的客户是谁呢？


    想来想去，他发现，最重要的客户，原来是自己！


    于是，他决定每天用额外的一个小时，不服务其他人，专门服务自己。而且是工作效率最高的一个小时：早上。


    从那以后，每天早上，芒格都用一个小时来为自己工作，他用自己的全部智慧和工作能力，思考自己的人生，并且从事着房地产的副业。


    过了不久，他的房地产业收入远远超过了律师。后来，他赚到 140 万美元，就把律师工作给停了，专职做投资。


    再后来的事情大家都知道了。芒格依靠做投资，成为了亿万富翁。


    芒格的智慧有很多都值得学习，而这个“最重要的客户是自己”、“每天卖给自己一小时”的理念，非常值得我们学习。


    我们普通人，平时忙忙碌碌，为客户（领导也是广义的客户）忙这忙那，却忘记了，每个人最重要的客户，应该是自己。最重要的时间，应该投给自己。


    我的理解，所谓每天卖给自己一个小时，就是用最重要的时间，来帮助自己成长。如果每天睡觉前没有比起床时更厉害一点，这一天就是虚度。


    这一小时，你可以用来思考自己的人生，整理自己过去的所学，梳理自己的人际关系等等，也可以用来学习新的知识，或者做其他有利于让自己进步的事情。


    如果单独看每一天，我们会觉得一个小时并不能改变什么。但如果时间拉长到一个月、一年、十年，进步就会非常明显了。我的个人体会是，如果每天用一小时来学习某个人或某个体系的知识，学了一个星期以后，我的语言和思维，就会带上所学的风格。


    例如，学习论语一周，思考问题就会从孔子的角度去看；学习《教员选集》一周，做事就会用上教员的方法。学的时间越长，掌握的思维框架和行动方法就越深入、越牢固。而且好处是可以博采各家之长，而不会只落入一家之所学。这样又会形成一种综合的“1+1>2”效应。久而久之，自己就会比以前知识更渊博一些，看问题更深入一些，做事情更坚决一些。


    所以，每天卖给自己一小时，千万不要把目光放在短期收益上，而应该把时间拉长，知道一定是功不唐捐。否则你很快就会失去动力了。


    另外，“我才是我最重要的客户”，这句话其实意味深长，值得好好琢磨和实践。我们往往习惯于给别人出各种各样的主意，却很少沉下心来，用自己的智慧去给自己思考一下未来的道路和当下的选择。


    如果你认识到，自己才是自己最重要的客户，用服务VVIP的态度来对待自己的成长需求，也许你每天就会有不一样的安排，一周、一年、十年后，就会有不一样的人生。


    ## 富豪们的出身


    我写了很多商界牛人，一般都会写到他们的家庭。


    一个很令人沮丧的结论是，从大概率上来讲，今天成为富豪的，祖父辈或者父辈往往都已经是当地出类拔萃的存在，甚至富甲一方或者有有权有势。完全寒微出身的，少之又少。


    - 任正非的父亲任摩逊是中学校长；

    - 柳传志的父亲柳谷书是中国人民银行的筹建者之一，后来是贸促会的高干；

    - 玉石的父亲是铁路局副局长，岳父是省委副书记；

    - 马云的父亲是浙江戏曲协会主席；

    - 马化腾的父亲是盐田港集团董事长；

    - 王兴的父亲是龙岩市的水泥大王，亿万富翁；

    - 黄光裕的爷爷是大地主，外公是泰国巨富；

    - 曹德旺的曾祖是福清首富，父亲是上海滩巨商，永安百货股东；

    - 方洪波的爷爷当过县长，解放后是人大代表和政协委员，父亲是村里第一个师范生；

    - 冯仑的祖父是地主，父亲是企业工会负责人；

    - 罗振宇的父亲是国营工厂厂长；

    - 就算是被认为出身寒微的刘强东，祖父也是大资本家；


    稍微低一个层次的：


    - 雷军的父亲是村子里第一个师范生，在县城当老师；

    - 张一鸣的父亲是龙岩市科委干部；

    - 程维的父亲是铅山县机关干部；


    这些虽然不是大官或者大富豪，但是在当地，都已经是人上之人，在村子里都算是祖坟上冒了青烟的。


    真正出身寒微的，在我写过的人里面，只有三个：


    - 俞敏洪，父亲是木匠，母亲是妇女队长；

    - 李彦宏，父亲是锅炉房工人，母亲是皮革厂女工；

    - 王传福，父亲是木匠，母亲是普通农民。


    以上这些牛人们的出身，显示了家庭背景对企业家的重要性。


    我认为，祖上是地主、资本家或者达官贵人的，孩子从小就耳濡目染父辈和别人的交往，听惯了别人是怎么做生意、怎么办事的，并且拥有更优越的学习条件，更高的眼界和更强的自信，这些都是普通家庭的孩子没法比的。所以在同等条件下，他们更容易成功。


    当然，出身论不是绝对的，俞敏洪、李彦宏和王传福的成功，也告诉我们，只要足够努力，加上一点好运气，贫穷家庭出身的人，也可以成为大企业家。


    这个统计结果给我们的启示是：


    1. 如果我们自己只是出生于普通家庭，如果想要成功的话，可能需要付出比那些优越家庭的人更多的努力；

    2. 与其抱怨祖辈没有给自己一个好出身，不如自己努力奋斗，给孩子一个好出身。你不一定要成为你巨富或者高官，只要在一个小范围内能成为出类拔萃者，你的孩子可能就具有了更好的竞争优势。


    ## 何加盐都读些什么书？


    前一阵，有星友问到我是怎么读书的，都读了什么书这些问题。在这里也和大家分享一下，或许会对你提高阅读效率有点启发。


    我的读书主要是分为四种情况：


    第一种是为短期目标服务的读书。例如，我写某个牛人的故事，就需要阅读该牛人的的传记、寻找一切和他有关的报道、采访、演讲等等，然后快速阅读。关于马云、刘强东、王石、巴菲特、芒格、曹德旺等人的书，都是在这种情况下读的。


    这种情况下的读书，只能囫囵吞枣，从中发现值得写作的素材，并且把关键事件或者对话做上标记，或者摘录在一个专门的文档里，方便写作时随时查阅和调用。


    我要读的资料主要分为三类：一类是曾经出版过，但是在网上找不到的纸质书。我会提前在京东、拼多多或孔夫子旧书网等网站买好，等写到相应文章的时候，集中阅览，把需要用到的地方划线，极端重要的地方会折纸。


    第二类是在“微信读书”APP上可以直接找到的书，我会在手机端或者电脑端阅览，重要的地方做上标记，需要调用的时候，直接找到标记栏，快速查阅。也会利用关键词来搜索，快速速读想要的内容。大部分的书其实都可以从这上面找到，我强烈建议喜欢阅读的朋友装一个微信读书，并且付费开通无限阅读权限。


    第三类是在网站上找到的书或者网页。我会迅速浏览一遍，然后拷贝复制到一个word文档。如果写作时记不住，需要调用，就用ctrl f搜索关键词来快速定位。通常写一个人，攒下来的word文档会积累十几万字。


    第二种读书是为中期目标服务的。例如，与公司业务相关的技能型书籍，如战略规划、人力资源、品牌营销、财务管理、文案写作等等。


    这些书籍我可能不会马上就用，但是对我公司的业务发展是有帮助的，说不定什么时候就可以用上。


    第三种读书是为长期目标服务的。它可能不会马上对写作或者公司业务有用，但是会开阔我的思路、拓宽我的眼界、提升我的认知、提升我的道德，潜移默化地对我施加影响。例如《毛泽东选集》（或者《圣经》、《论语》、《资治通鉴》）、《人类简史》、《阿德勒心理学》、《王阳明传习录》等等。


    这些书可能一年两年都用不上。但是读之前和读之后，我知道自己会产生很多变化。他们是使我进化的重要源泉。


    第四种读书就是纯粹的消遣，不抱任何目的。例如看一些小说、散文、杂文等等。我有时也会看一下网络小说，或者纸质小说，没有任何功利性，就是因为喜欢。


    例如我会复习《红楼梦》或《三国演义》，看《三体》、《一句顶一万句》等流行的小说，也会看《临高启明》、《修真四万年》等网络小说。


    近来，由于工作都比较忙，所以第一类和第二类书相对看得多一点，而且是工作时间看。休息时间主要看第三类。通常会从晚上 11 点看到 1 点再睡觉（因为白天实在没有时间）。


    第四类书现在看得很少了，主要是等车、排队、坐地铁、坐飞机、上厕所的时候才能看一点。所以感觉还挺遗憾的。


    以上就是何加盐平时读的书及读书的方式。希望对你有点启发或触动。


    ## 我们并不知道未来的感觉


    这几天趁孩子放暑假，带他们到久已向往的沙漠旅游。


    由于女儿已经念叨了无数遍，说是很盼望露营，于是我们就专门安排了一个住沙漠帐篷的环节。


    女儿对此无比期待。一望无垠的沙漠，辽阔浩渺的星空，都浮现在她的想象中，表现在她憧憬的描述中。


    结果，昨晚真往了以后，她才发现，沙漠和星空确实是自己想象的那样，但是还有更多东西和自己想象的不一样。


    例如，帐篷里没有电，没有空调，没有洗浴，没有厕所。


    要洗澡只能公共淋浴，上厕所要到两百米远的地方，半夜黑漆漆的沙漠无限恐怖，而且冷得要死，帐篷空间很窄而且全是沙子，气垫床垫一动就哗啦啦响……


    于是，一晚上女儿半骚满腹，也没有睡好觉。早上起来，在我们的教导下，她光荣地学会了一个“叶公好龙”的成语。


    另一方面的例子是，当我们耍出去玩时，儿子一直闹着不肯出门，他觉得在空调房里看奥特曼才是世界上最幸福的事。


    但我们硬拉着他出来。结果，玩得最开心的就是他。


    以上这样的例子，经常会在我们生活中出现。


    我们在做一个决定时，往往会去想未来的场景，然后根据自己臆测中的快乐与痛苦来作为当下决定的依据。


    但很多情况下，这样做出来的决定，到我们真正经历其结果的时候，我们真实的快乐与痛苦，和想象中的很不相同。


    只有当我们的脚踩在沙子里的时候，你才能真正感受到它的细腻或者粗糍，它的冰凉或者炙热；


    只有当我们置身于海边时，你才能真正感受到海的狂暴风浪和穿透一切的紫外线。


    而在前面的想象中，这些都是被忽略的细节。但恰恰是这些细节，决定了我们真实的感受。

