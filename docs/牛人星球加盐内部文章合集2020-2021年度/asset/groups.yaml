    总体而言，这一通咨询下来，我自己也是觉得开了眼界。这世界上有很多生意是我们根本就听都没听过，想都想不到的，而他们也都是巨赚钱的生意。另一方面我的感受是，不管你赚到多少钱，你总还是会想赚更多。


    最后，要做一个好的生意，你自己的水平、品牌和推广，都非常重要，你有几斤几两，别人是不是知道你，别人是否也认可你有几斤几两，共同决定了他们是否愿意为你付费。'
