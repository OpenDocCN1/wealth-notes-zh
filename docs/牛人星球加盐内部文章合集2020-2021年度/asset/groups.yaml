    # 未来的超级风口？


    睡前看书，一边看一边胡思乱想，突然想到一个未来可能的超级风口，和大家分享一下。


    人类信息的传输方式，最早是无意义的喊叫，逐渐发展成语言，然后有了结绳记事，后来有了文字。


    有文字以后，人类就进入了一个新的时代。古人说，仓颉造字，百鬼夜哭，就是因为原本只属于上苍的能力，被人类掌握了。


    从信息传输的介质来看，原本是声音，后来是绳子，然后是泥版、石碑、龟甲、莎草纸、竹简、布帛，到后来终于有了纸，有了书。活字印刷术出来后，书籍的传输加速了，人类的文明进步也加速了。


    19 世纪以来，人类发明了电报、电话、无线电、电视机，然后是电脑、智能手机。


    现在，我们传输信息的主要方式有：手机、口头、电脑、书本和纸张等。


    不管是书本、电报、电话、无线电、电视、还是电脑、手机的出现，本质上都是信息传输方式和介质的改变，每一次都造成了世界的巨变。


    那么，智能手机之后，下一种传输方式是什么呢？下一个传输介质是什么呢？我们每个人，可能在生活中，都曾经幻想过，如果能和别人心灵相通会怎么样。文学和影视作品中，也有无数描写“意念传输”的情节。


    从本质上来讲，我们的思维、动作、语言，都不过是大脑结构中某些物质运动的结果，这些运动会释放某一种电流或者电波，或者某一种类似电流或电波、但还未被人类发现的其他东西，经过神经的传导，来控制我们最终的思维、以及我们表达思维的方式。


    不管是电流、电波，还是未知的某一种形态，它总能被测量、记录、复制、读取吧？


    如果未来，我们可以直接用某种仪器读取脑电流或脑电波，并解读、传播到机器、甚至另一个大脑中呢？


    假设，以后每个人都戴一个特别制作的帽子，或者直接植入一个特制的芯片，帽子或芯片可以监测大脑皮层的运动，然后通过天线把这些运动的数据传递给别'
  - '[PAGE 81]


    的帽子、芯片或者一个中央处理系统，然后翻译成别人可以理解的影像或者文字，甚至不必翻译，直接以电流或电波的方式，传输到大脑的中，让对方一瞬间就知道对方的所有思维活动呢？


    如果今后的科学能在这方面有所进步，那人类社会将发生天翻地覆的改变。在科幻中，其实我们已经多次见识过这样的场景。


    《三体》里面的三体人，互相之间就是直接传输脑电波，所以三体社会是没有秘密的社会，也不知道什么叫谎言和欺骗，这才有了人类的面壁计划，也才有了后面的故事。


    而玄幻小说里，人们可以用“神念”或者“神识”来交流，记录信息的东西往往是“玉简”，把玉简贴在额头，就可以直接向里面写入信息或读取信息。这也可以理解为脑电波的存储与读取。


    当然，从目前来看，这个东西还太遥远，还存在于科幻甚至是玄幻之中。但我相信科学界应该已经有了不少的进展。关于脑机接口、意念控制，都已经在实验层面实现了。意念打字和意念取物，在研究所里面都已经不是难事，只不过离大规模商业化还有一点距离。


    人类的大脑虽然无比神秘，但是从物理和生物的底层逻辑来讲，仍然是物质与运动的结合，从理论上是可以认知的，而科学也确实是在不断加深对它的认知。大脑皮层运动的监测、生物电流的识别等，现在都已经在某些程度上可以做到。未来发明监测脑电波的仪器，也并非天方夜谭。


    所以，我个人是很看好这个领域的发展。只不过，还需要多少年，才能取得关键的突破性进展，那就不是我猜测的了。从电脑、互联网、移动互联网、人工智能等领域过往这几年的发展速度来看，我们离这一天应该不太久。'
