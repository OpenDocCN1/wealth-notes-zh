    # 马明哲创建平安的故事


    世上本无平安，人们把它创造出来，就有了平安。


    创造平安的人有很多，其中最重要的一个，叫马明哲。


    马明哲的父亲是部队转业的。当年他随四野南下，一路从东北打到海南。后被分在广东湛江的一个公安局当局长（也许是湛江市，也许是阳春县，由于马明哲对过往信息保护得太好，这些都不为人知）。


    他的母亲祖籍汕头澄海，祖上远赴南洋经商，成为巨富。她在南洋上了大学，回国参加革命，后来与马明哲父亲结婚。


    母亲这边由于家世背景，在动荡年代受到冲击，直到 1981 年才平反。马明哲也因此而吃苦头。虽然人特别聪明、用功，但是上到高中，却没办法再去读大学和参军，只好去当货车司机。


    他先是在阳春县八甲电厂工作，后来以工代干，到了湛江市工交政治部当通讯员。1983 年，在一位地方领导的指导下，到深圳蛇口去支援特区建设，成为了蛇口工业区人事劳动处一组组长。


    1985 年，深圳蛇口工业区成立了专门的“招商局社会保险公司”。马明哲被派到这家新成立的公司，担任经理助理。


    社会保险公司有点类似现在社保局，从工厂把社保资金收上来，用于工人们的养老、医疗和雇主责任等保障问题。当公司想针对当时工伤频发的问题，开发一个工伤保险时，却碰到了政策之墙。


    按当时规定，工伤保险属于商业险，全国只有中国人民保险公司（人保）可以做。其他单位均不得开展商业保险业务。


    马明哲心想，既然社会保险公司不能做，为什么不在新成立一家保险公司来做呢？


    在 80 年代中期，整个中国，也只有人保这家官方机构能够从从事商业保险业务而已。一个小小的经理助理，就想做这种开疆拓土的大事，简直就是天方夜谭。


    对于很多人而言，也许会认为，既然国家政策不允许，那么不去干这件事就行了，反正作为公务员，不干这件事也不会少拿工资；如果干了却失败了，费时费力、被人笑话不说，还有可能影响仕途。总之是一件吃力不讨好的事。'
  md: '

    我直接就开始这样仰视他，然后在心里边就鄙视自己。


    我们大学毕业之后，他在我的留言册上写了一句话，也激励我到现在。他说：做男人要对自己狠一点。


    我想，少年、青年时期的他，是有意气的，是有朝气的。就像《少年中国说》里边，一个少年应该有的东西。


    我再讲一个事情。


    他对我们班的班花，就是现在的何太，在谈恋爱的时候，他当时就说了一句话：如果有一天我成了政治犯，你还跟我在一起吗？


    上大学的时候，人都会有各种各样的对社会、对现实的不满，这种不满其实也是一种责任心啊。


    何太说的是：我去给你送饭。


    现在他们还在一起。


    这就是少年时期的事。


    那青年时期呢？完全让我惊掉下巴。


    因为他们的工作可能也不太方便给大家来说。但是他在研究生毕业之后，把自己最好的青春的十年真正地献给了国家，做的是最伟大的事业，而且是真正的对这个国家产生影响的事业。


    所以在他 30 岁出头的时候，就能够成为五一劳动奖章的候选人，可能是所有候选人里面一个最年轻的人。


    这种成就，不是因为成绩是多么漂亮，而是因为他用自己的青春，为这个国家，为我们可能所有的老百姓，做了你们都不知道他所做的那些东西。是对那样的一个人群的褒奖，而他就是这样一个人群的代表。


    所以青年时期的他，我想用另外一个词去定义，就是“追求”。他追求的不是自己的财富，不是自己的一点名利，不是一套房，一个车子，这可能是很多人青年时期最先追求的。


    他追求的是为这个国家、为十几亿都不认识他们的老百姓，去牺牲自己，牺牲自己的青春。


    这就是追求的青年和青年的追求。


    那中年呢？


    回过头来，老婆头上都有白头发了，孩子慢慢长大，父母也都耄耋了。这个时候回归到家庭去，照顾一下家里，但是因为口袋囊中羞涩，然后从体制里面出来，开始创业。


    创业，我们在座很多人都经历过，肯定不是一帆风顺的。大家所经历的苦难他都经历过。


    最可怜的时候，一个人晚上搁那写，也不知道能写出一个什么结果来。


    但是何太在旁边默默地支持，因为她相信这个男人，从少年时候到青年时候，没有辜负过时光，没有辜负过身边的人。所以也一定不会辜负家人。


    所以何太默默地支撑一个家庭。她说：你做你想做的事情，我来养这个家，我相信有一天你会把我们养得更好。


    一年多的时间，他把“何加盐”三个字，变成了几十篇文章，变成了一本书，变成了 50 万的粉丝群，然后变成了可能一大盆的钞票，但是他只取一点点够他家生活的东西。


    所以中年时期，我想用另外一个词去形容：价值。对家庭的价值，对自我实现的价值，然后对社会改变的坚持。


    最近我们因为极飞，所以来探讨农业科技。我们又去回忆共产党的革命历史。我们三个人一起去了农民运动讲习所，我们一起把毛泽东的《湖南农民运动考察报告》又去重读了一遍。


    我们，就是把家庭价值实现了、把个人价值实现了之后，去改变这个社会的价值。


    可能我们有一个共识：中国 14 亿人口，还有 8 亿都是农民。


    如何让中国真正地整体社会的改造升级？可能就要靠农业，就要把农业、农村、农民改造升级了，中国整个社会才能改造升级，对吧？


    因为我们的北上广深已经是国际一线了，还有多大的改造升级的空间呢？只有在农村，在三农问题上，才能改造升级。


    所以何加盐不光是因为被极飞、被彭斌感动了。我想更重要的，还是这些年，内心里边激发的那种要改造社会、要给予社会更大价值的这样一个责任心，这样的一种价值体现。


    那么他又开始关注农业的科技，然后又引导我们这些人到极飞来考察，来激发大家，不管是梦想或者是价值，反正每个人可能都都会有很大的收获。


    回到少年时期。


    我们看到他现在头上都已经秃顶了，也不像以前那么青春帅气了，但是我仍然觉得他是少年，因为他又有了新的梦想。


    他的梦想不光是他个人的梦想。如果是他的梦想，没有必要花这么多时间来组织这些事情，我就投入到我的事儿里面不就行了？


    我想彭斌今天讲了一个事情，我挺觉得挺有意思。他说我有困惑的时候，坐在阳台上，能从 12 点多坐到两点，看天上的星星。


    何老师也是有星星的。我们的加盐星友会里边的每一个人，他们已经形成了一个个星星。


    我想他不光是要点亮自己，他想把我们加盐星友会里面的每一颗星星，点得更亮。


    也许哪一天，当我们老了，我们也坐在阳台仰望星空的时候，可能何加盐的星友会里面，有更多的星星在闪亮。


    我想，我们这么多人，我们跟加盐老师有近的、远的各种各样的关系，让我们一起，用自己的力量，用自己的梦想，我们不管是为国家、为社会还是为人类，点亮一片更美好的星空。


    谢谢。


    ## 何加盐总结发言


    感谢马桶。


    我们事先并没有安排、没有演练。我之所以点名他，是因为他是我们班第一才子，所以我想着就是这种情况下，由他来做⼀个总结性的发言，会很好地帮我们升华一下。但是我没有想到他会讲这些东西。我是
    5 分钟之前才发个信息给他，说你最后做个总结性发言，他说的这些也是很出乎我的意料的。


    既然说到这，我也想说⼀下我们三个人为什么会走到⼀起？


    其实我们大学就是很好的朋友。我们的大学是中国海洋大学，后来各自考研，我到了浙江大学，胖子到了人民大学，马桶考北京大学，所有的都过了，也到北京大学去了，但后来他导师那一年发生变故，就是不招学生了。当时北大的政策就是必须得导师愿意接收，这个人才进，所以他后来被调剂到陕西师范大学。


    我们考研出来之后，又都进了体制。胖子进了某系统，29 岁，就是整个系统最年轻的、也有可能是系统内有史以来最年轻的部门一把手。


    马桶在学校期间，就跟朋友创业，后来也考了陕西省的公务员。再后来他自己出来创建了一个学校，现在已经是陕西省办得最成功的公务员培训学校。


    后来他们两个又一起跟另一个朋友创建了一个投资公司，现在投资公司还在，很大，应该有**亿的募资规模，他们两个都是创始团队的成员。


    后来到今年，他们也有一些其他想法，想自己一起创业，所以现在都出来了。


    我也一直在跟他们探讨咱们创业创什么好。


    其实每个人都有无数的机会，因为他们在投资集团时，VC、PE 都做，看过无数的公司，看过无数的项目，自己也都是有非常广的朋友圈，做任何项目都可以。


    但是我就跟他们讲了一下，我说我上次去了极飞，感觉农业方面大有可为，你们要不要一起考虑一下这个方向？他们立马就放下其他的东西，跑过来和我一起研究。


    我们上一次也是在郑州考察陈厚中国的时候，谈了好几次，彻夜地长谈，说要不要搞？


    其实马桶这边现在已经有一个很好的机会。因为他太太是韩国人，太太的父亲是韩国比较高级别的官员，本人中文超级棒，给总统当翻译的，所以家世背景都很好。然后现在也有一个机会就是做中韩之间的贸易，每年可能有**亿韩元的贸易规模。


    我说，我们如果一起做农业这个事的话，你那边怎么办？马桶说，我们肯定还是要做自己想做的事情啊。


    后来他们这次来广州，我说我作为地主，要安排一下我们去哪里，就去农民运动讲习所、黄花岗烈士陵园。


    为什么我们会去这样的地方？因为我们这些人在一起其实是一个价值观、理念的趋同。


    当时我们讨论到，假设我们一起创业的话，我们是为了什么而创业？


    肯定不是为了赚一些钱，而就是为了能够给社会带来一些改变。当然我不知道最终我们能够做到怎样，但是如果你问我们的发心，我们就是为了这个。


    见到他们，我跟他们说，假设我们要创建一家公司，首先我们要有特别伟大的使命。


    在座的各位，我不知道大家政治立场怎么样，有一些可能是偏左的，有一些是偏右的，但是我很坦诚的告诉大家，我就跟他们说：如果我们搞一家公司，第一个，我们要成立一个党支部。


    （众笑）


    真的！我们要对所有人进行理想信念教育。这种理想信念教育，不是说明在通行的那种形式主义的开会，然后以文件落实文件，以会议落实会议这种。


    我是说，我们要了解当初共产党团队从井冈山那里起家，经过长征，然后经过抗日战争、解放战争，他为什么能够走到今天？然后我们要从中吸取一些精神的力量，那就是理想、信念、奉献。


    所以为什么我们要去看那些东西？就是为的这个。


    前不久，《八佰》电影上映，我第一时间就带着我们小伙伴一起去看。


    虽然说我个人是对国民党军是保留意见，但是看这个电影的时候，我看到那些人喊着名字说“我是河南某某某，娘，孩儿不孝”，然后就抱着炸药包跳了下去，我的眼泪就哗哗地往下流。


    当时我坐在那里就想，我何加盐做一个事情，如果不做也就罢了，我就是做我的公众号可能一年赚个几十、十万、上百万我也可以过下去。但如果要做一个事情，一定是要于国于民有利益的！


    为什么？我当时看到他们抱着炸药包跳下去的时候就想：为什么他们能感动我？我想要追求的是什么？


    他们为的是民族的前途，为的是中国人能够有一个更好的日子，能够把日本鬼子赶出去，我们这个民族能够自立自强。


    所以我是感觉我可以被这个东西感动，大家应该也能够被这个东西感动，我们应该去做这些于国于民大有裨益的事情。


    我后来跟马桶、胖子他们讲到这个情节，他们也都是深有感触。


    马桶在我没讲的时候，就已经去看过电影，当时他在上海，还特地跑到四行仓库去祭莫先烈。


    这个是我们没有沟通的情况下，就不约而同有这么一个东西。所以就感觉，大家有价值观理想信念的趋同，未来也许可以一起做一些事情。


    为什么这么多的企业里面，我对彭斌特别认可，特别欣赏呢？


    我最认可的就是他的发心、使命、愿景。他真的是想做一个对国家特别有利的事情。


    我们都知道农村空心化，老年人、我们爸爸妈妈种地种不动了，但是他们还在那里种地。如果不种的话地荒废了，他们心里也很难受，然后对国家来说也是重大损失。


    彭斌他们去帮助那些人打药，未来有可能播种、管理田间地头等所有的事情，有可能都能做了。他们为中国的农业提升效率，有可能未来为世界为农业提升效率。


    彭斌当时讲到那些东西的时候，我的心里一下子就被打动，觉得这是我应该去做的事情。


    我研究那么多的企业，每一次我都会说到，这个人，他的理想信念是什么，价值观是怎样的。


    我们从商业上来讲，你看像史玉柱，他们都是很厉害的商人、很牛逼的商人，我们如果去学习一个企业的运作，我们可以去研究他。我们也可以说我特别佩服他。


    但是你如果是说尊敬的话，我更愿意把我的尊敬，可能给马云、给彭斌这样的人、这样的企业家。


    我也非常的确信，Peter（晨兴副总裁陈哲）你们在选择企业的时候，肯定也要看他的梦想有多大，对吧？


    要看他有没有激情，他到底只是想利用人们的贪婪去赚一点钱，还是说为社会改变一点什么东西？


    你们肯定会偏向后面这一种对吧？


    所以，今天 在座的各位，我们从彭斌那里学到的东西，虽然可以去关注那些“术”的东西，如怎么样提升管理，怎么样去跑融资创业，怎么样跟投资人谈，这个是可以学。


    但是更重要的是我们要去学“道”的东西：你做一个事情，你的发心是什么？你理想信念是什么？


    刚刚黄总也说到，其实我们也认识两三年了，当初他就跟我讲，我原来做一个企业做得很成功，我 20 多岁的时候，我们企业流水也是好几个亿，然后我个人分到的利润都有过千万。但是后来为什么不做了？因为觉得那个事情没有成就感。后来他就要找一个更有成就感的事情，后来做了现在这个事。现在其实也是去年
    3 月份才起步，去年就做到两个多亿。今年可能又有大的发展。


    我是觉得，每一个人，尤其是我们创业者，你可能刚开始是因为有能力，靠能力去赚点钱，或者发现一个机会去赚点钱。但你只要做到一定的规模，你马上就会面临一个问题，就是你的价值感、成就感从哪里来？


    如果是赚一点钱的话，我相信在座大部分都已经达到目的了。我们现在赚的钱完全可以过一个很好的生活，为什么大家还要来彭斌这里学习？为什么大家还在孜孜以求的想做的更好？


    我相信是每个人心里可能有更高的一个价值的追求，可能有更大的梦想还想要实现。


    讲了这么多，我也就是希望我们每一个人做事业能够发心更善一点，格局更大一点。


    这样的话，我们第一个是可以给社会做出更大的贡献，第二个是我们个人内心的成就感可能会更多，我们未来成功的几率可能会更大一点。


    这一次“极飞梦想之旅”，不管是彭斌讲的东西，还是我讲的，还是大家互相分享的，我最希望能够让大家留下印象，最有收获的，就是使命、愿景、价值观、发心这些东西，它们才应该是我们更关注的。


    谢谢大家。


    # 互补的联合创始人


    那天在极飞考察，有人问了一个如何挑选联合创始人的问题。


    彭斌回答，最重要的是，要找一个和自己的互补的，背靠背的伙伴。所谓背靠背，是他既能成为你的坚强后盾，又能帮你补齐另一面，看到不同的角度和信息。


    彭斌曾经找过一个技术的超级大牛，俩人关系也非常好，理念非常相合，彭斌很想让那个人加入公司。


    但是对方问了一句话：你也是技术背景，我也是技术背景，我们两个一起创业，在公司里怎么分工，怎么相处？


    彭斌马上就意识到，这样组队是有问题的。


    后来，他吸纳了另一个人 Justin，成为公司的联合创始人。


    Justin 进入极飞的时候，其实已经是 2013 年，那时极飞已经创业 6 年，营收数据也已经很不错。


    那时 Justin 从澳洲博士毕业回国。作为一个资深的无人机爱好者，他特地找到彭斌，向彭斌吐槽极飞存在的一堆问题。


    Justin 整整吐槽了两三个小时，把彭斌说得灰头土脸。


    然后彭斌注视着 Justin 的眼睛，来了一句：你要不要加入极飞？


    于是两个人的缘分就这样注定了。


    彭斌觉得，Justin 能看到自己完全看不到的东西，这种能力是自己非常需要的。


    Justin 的风格是和彭斌完全不一样，但是彭斌充分尊重和放权。不仅让他成为联合创始人，还把公司内部事务的管理都交给他。


    现在，极飞内部的装修设计风格，完全是 Justin 的风格，非常现代、非常艺术，完全没有技术男的死板。


    彭斌说起 Justin 的时候，我们能完全听得出言语中的骄傲、信任和尊重。


    我最近也是充分体会到这种感觉。


    这次极飞考察，为了让远道而来的朋友们有最大的收获，我们希望尽量设计好环节和流程。我和两位之交好友胖子、马桶一说，他们半小时就设计出一个非常好的流程，我们按照执行后，第二天的效果非常好。


    在晚宴上，我让曾经在某大型国企担任多年办公室主任的胖子帮忙点菜、照看三桌客人，组织讨论，调节席间氛围，代表他那一桌致祝酒词；让马楠安排人员互相介绍，组织每桌桌长向其他桌介绍本桌情况，鉴于马楠是我们班的第一才子，在最后的分享环节，我特地点名让他做一个总结陈词。


    和他们说完任务后，我就百分之一百二放心地去忙别的去了，我丝毫不需要有任何一点担心，因为我非常有信心，他们一定会把这些事完成得非常好。最终结果也确实显示，他们干得比我预期的还要好得多。


    在农村考察的时候，我们决定临时增加一些考察内容：到当地的农业合作社去陌生拜访。


    当马楠提出了这个环节的时候，我的心里是很犹疑的。因为我一直都有社交恐惧症，性格非常内向。陌拜对我来说是一件非常困难的事。


    但马楠让我不用担心，他会搞定一切。后来他自己在网上找合作社的名单，打电话过去联系，约访谈等等。最后，通过这种方式，我们得到了此行最有价值的调研信息，对项目的推进具有极大的作用。


    我想，这些就是背靠背的伙伴，每个人都有其他伙伴所不具备的能力，而这种能力又是团队不可少的。


    最近我们三人准备一起做一件事情。这件事情是一件极其艰难的事，但我们认为它将是一将极其伟大的事。


    我很庆幸能找到两个可以让我放心交出后背的伙伴。


    # 香港兴衰启示：勤劳重要，但大势更重要


    因为要写平安创始人马明哲，就研究了一下深圳早期发展史，看到袁庚早期总是讲在香港办事的经历。


    当时，袁庚在香港招商局主持工作，他找银行贷款买楼，看中了港岛干诺道上一栋 24 层的大厦，以 6180 万港元成交。买卖谈成后，袁庚邀请对方一起吃午饭，对方不肯去酒楼，只简单吃了几碗河粉、面条，同时要袁庚下午
    2 点一定准时到律师楼办相关手续，交付 2000 万港元订金。当时香港已经实行了双休日制度，周五下午 3 点各大银行停止营业，如果不在此前把支票交到自家账上，会损失三天的活期利息，将近
    3 万港元。


    袁庚深受触动，后来多次提及这堂“香港第一课”。“古人说一寸光阴一寸金，香港人在激烈的竞争环境下真正把时间当成了金钱。”


    看到这里，我非常感慨。


    当时袁庚讲这些，无疑是说香港人是这样做的，成果也必然，所以我们应该学习他们。


    这些都没错。但是如果把历史拉长，我们可能会看到香港、乃至中国发展的 大背景。


    我们常常用“勤劳勇敢”来形容中华儿女，香港人民作为中华儿女的成员，也不例外，甚至可能由于环境、经济体制和历史传统的原因，在勤劳方面更为突出一点。


    但是香港自古以来，就是一个穷而又穷的小渔村。后来即使被英国租借，有百余年的贸易转口红利，也只是稍微发展了一点，普通人的生活比打鱼和务农要好一点，但并没有很富裕。


    直到五六十年代以来，由于国际国内大环境，导致中国整体上孤悬于国际社会，香港成为内外贸易沟通的唯一便利渠道，才迎来了超高速的发展，让普通人的整体生活水平都上来。


    从五十年代到九十年代的香港人，真的是像蚂蚁或者工蜂一样，勤劳程度堪称世界之最（人均劳动时间之长可为佐证），然后那几十年迅速发展，人均 GDP 和生活水平都达到世界最高的那一类别。


    固然，当时港人生活水平的增长和勤劳分不开，但是更重要的，还是大环境给与了机会。大势是1，勤劳是后面的零。


    抓住当时这个大势的不仅仅有香港，还有韩国、新加坡，这两个地方的人们都是以勤劳、能吃苦耐劳称的。没有这一条，有了大势也是枉然。


    而到了这些年，从经济发展数据以及在全国经济版图中的影响力来看，香港其实渐渐地在衰落，而港人的生活水平，也已经多年停滞不前。这并不是香港人变懒了，相反，我们去到香港，会看到他们还是那么勤勤恳恳。中环的金融人士晚上九十点钟还在加班，路边的手机店和房产中介都在努力地拉业务，餐馆和出租车上六七十岁的大爷大妈还在拼命干活。


    但问题是，随着中国全面开放，香港当年的优势地位已经丧失了。现在只能凭着先发优势和政策优惠，部分地维持着经济发展。但是已经没有高速增长的条件，未来的香港，可能仍然会是一个挺好的城市，但是不会再有远远超过其他内地城市的优势地位。


    这个道理不光适合城市和国家，也适合平常人。中国的农民比谁都勤奋，但是长期以来维持温饱都困难，就是没有逢上一个好的大势。改开以来，他们才真正算是利用自己的勤劳，大幅地提高了生活水平。


    对于我们普通人而言，一定要认识到这个道理。勤劳是重要的，但是大势更重要。你只有在一个好的大势里面，勤劳才有好的收获。


    # 马明哲创建平安的故事


    世上本无平安，人们把它创造出来，就有了平安。


    创造平安的人有很多，其中最重要的一个，叫马明哲。


    马明哲的父亲是部队转业的。当年他随四野南下，一路从东北打到海南。后被分在广东湛江的一个公安局当局长（也许是湛江市，也许是阳春县，由于马明哲对过往信息保护得太好，这些都不为人知）。


    他的母亲祖籍汕头澄海，祖上远赴南洋经商，成为巨富。她在南洋上了大学，回国参加革命，后来与马明哲父亲结婚。


    母亲这边由于家世背景，在动荡年代受到冲击，直到 1981 年才平反。马明哲也因此而吃苦头。虽然人特别聪明、用功，但是上到高中，却没办法再去读大学和参军，只好去当货车司机。


    他先是在阳春县八甲电厂工作，后来以工代干，到了湛江市工交政治部当通讯员。1983 年，在一位地方领导的指导下，到深圳蛇口去支援特区建设，成为了蛇口工业区人事劳动处一组组长。


    1985 年，深圳蛇口工业区成立了专门的“招商局社会保险公司”。马明哲被派到这家新成立的公司，担任经理助理。


    社会保险公司有点类似现在社保局，从工厂把社保资金收上来，用于工人们的养老、医疗和雇主责任等保障问题。当公司想针对当时工伤频发的问题，开发一个工伤保险时，却碰到了政策之墙。


    按当时规定，工伤保险属于商业险，全国只有中国人民保险公司（人保）可以做。其他单位均不得开展商业保险业务。


    马明哲心想，既然社会保险公司不能做，为什么不在新成立一家保险公司来做呢？


    在 80 年代中期，整个中国，也只有人保这家官方机构能够从从事商业保险业务而已。一个小小的经理助理，就想做这种开疆拓土的大事，简直就是天方夜谭。


    对于很多人而言，也许会认为，既然国家政策不允许，那么不去干这件事就行了，反正作为公务员，不干这件事也不会少拿工资；如果干了却失败了，费时费力、被人笑话不说，还有可能影响仕途。总之是一件吃力不讨好的事。

