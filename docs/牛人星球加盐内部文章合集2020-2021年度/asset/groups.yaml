    # 问答合集


    **提问 1：**


    何老师你好，当今社会许多中年群体 50 岁上下在家无业或者务农，也想再就业对社会产生价值，比如做一些淘宝拼多多之类的电商，却由于对电脑手机的操作认知不够，就算有人教导也很难执行，反而会花费大量的教导时间，请问对于文化程度不高的中年群体再就业有什么看法？


    **答：**


    50 岁上下、文化程度不高的无业中年人，不管是在农村还是城市，如果作为单个的个体，想做淘宝或拼多多这种电商的话，还是非常难的。除非有强烈的兴趣、以及稳定而优质的货源。


    现在农村做这个的基本上都是有人去组织的，或者是某些很厉害的、有文化的年轻人，或者是当地的地方政府、或者是拼多多这样的公司主动派人去和优质养殖户接洽。


    如果他本人有强烈兴趣，也能找到稳定而优质的货源，那么报个电商班学习一下，或者年轻人用心教一教还是可以的。如果他本身兴趣也不是很强烈，也没有稳定而优质的货源，不建议走这条路。


    其他的就业方向可以从两个方面考虑。


    第一个是对于能踏实干活的人，现在城市大量需要体力活的人，如环卫、绿化、小区物业、家政等，一个月赚两三千块钱还是可以的，如果还能做重体力活，例如建筑小工等，赚五六千也不是问题。或者不给人工打，自己做小生意或者养猪、养鸡鸭鱼、种经济植物，都能赚钱。


    第二个是对于不愿意干体力活，但是心思又比较活泼的人。可以尝试一下拍快手、抖音这种视频，只要拍出特色的话，有可能能够积攒一些粉丝，赚到一些广告费。现在欣赏农村土味视频的群体人数也很多，但是做这种业务，成功的几率就比较小。所以要把期望调低。总体而言，现在是体力工人极度缺乏的时候，以后会越来越缺乏。只要能吃苦，愿意干体力活的人，一定有工作机会。不存在找不到工作的情况。'
