    # 企业战略断层问题


    今天，一位星友在群里提了一个企业内部问题：非常具有代表性，几乎在每家企业都存在，所以我把它作为典型案例，专门分析一下。


    星友提出的问题是：我们是一家拟上市企业的子公司。集团很赚钱，但子公司还处于探索阶段。子公司的高层比较务虚，谈的东西听起来美好，但是却不考虑商业利益；中层拼尽全力想怎么给公司赚钱，但得不到高层的认可和支持；执行层（星友自己）也认为现阶段公司尽快赚钱很重要，对高管的想法和做法感到不理解。


    我认为，这是在企业里比较典型高层、中层、基层战略脱节现象。高层和中基层，没有在理念上、做法上达成一致，大家都觉得沟通不畅，做事很难，对方想法错误。


    其实，从企业高层来讲，他考虑的是企业的整体和长远，未必是当下如何赚钱。作为一家很盈利的集团的下属子公司，总部对其是有一定的战略定位的。有的子公司要负责赚钱，有的子公司只是卡位，有的子公司是撑门面，有的子公司是为赚钱的子公司服务，有的子公司只是为了安排人，甚至有的子公司只是为了走账……


    一家子公司，首先要明白自己的首要职责是什么，其次才考虑盈利的事情。例如，一家物业子公司，可能做好物业服务，让小区显得高大上，让业主各方面都满意，让集团在社会上具有口碑，是最重要的。它有可能连年亏损，需要总部的巨额补贴，但却是必要的。


    如果让这家子公司去考虑赚钱，它有可能会考虑把一些物业租出去，减少保安和保洁人员，降低他们的待遇，对物业的维护也是能省则省，对业主的收费却五花八门。如此下去，小区很快破败，业主怨声载道纠纷不断，集团名声臭名昭著，这是极度得不偿失的。


    所以，子公司必须明白自己在集团总体战略中的定位，并且根据这个定位来确定业务和管理重点。


    从星友的描述看，我认为，她所在的子公司在集团的定位，可能主要属于探路者。其职责，首要是探索新的业务模式，发掘、培育公司未来增长点；其次才'
  - '[PAGE 68]


    是赚钱。


    从子公司的高层来讲，他的做法取决于两点：一是总部的要求是什么；二是自己的野心有多大。


    先看总部要求：如果总部要求尽快赚钱，他就有很大动力以赚钱为先；如果总部要求是探索商业模式，他的主要动力就是尽可能尝试不同商业模式，或者耐心地布局他自己看好的商业模式，而不注重短期的利益。


    再看高管野心：如果他追求的是来捞一笔就走，赚点钱然后高升到别的部门，那么他的动力就是把短期业绩尽快做大；如果他把自己未来的事业，那么他的动力就是着眼长远，厘清使命，选好方向，坚定信心，打好基础，而不是追求短期的利益。


    从星友的描述看，这位子公司高管，要么是总部给了他充足的时间去打基础，其OKR里面，对利润的要求很低，或者干脆没有。要么是他自己目标远大，能顶住总部和下属的压力，坚定做自己认为长远有益的事情。


    这里我只是做了简单的分析。实际的情况，可能是非常复杂的。例如，高层可能在总部有盘根错节的人际关系，甚至有高层政治斗争的影响。或者，高管可能掌握着中层和基层不知道的资源，或者和总部达成了某些协议等等。


    而中层和基层，未必清楚这些弯弯绕绕。


    但在这家公司中，高管和中基层，无疑是有着巨大的分歧。高管已经明确表示，赚钱不是当前重点，但中层和基层，从想法上和做法上，却完全是以赚钱为重点。


    这种分歧可能有以下原因：


    第一，总部和高层此前没有向中基层明确指出子公司的使命和承担的角色，或者前后存在矛盾，导致中基层对战略并不了解。这个是战略定位和传导出现问题。


    第二，高层虽然讲过了战略，但是中基层对此并不认同。这个是战略共识出现了问题。


    第三，中基层并不在乎战略是什么，只要自己能尽快赚到钱就行。这个是激励机制出了问提。


    一般来说，出现这么严重的战略认知分歧，这三个问题多多少少都会存在。'
  - '[PAGE 69]


    根据星友的表述，高层其实已经认识到中基层并不了解、或者不认可他的战略思路，今天的会议，就是一个纠偏，希望能够传达更清楚，共识更强。但从结果来看，他失败了。


    这位高层可能在战略定位上很有自己的想法，他的问题出在战略传导与团队共识上面。另外，公司的激励机制，很大可能也存在问题。


    以上只是根据星友给出的信息做出的一些粗浅分析。实际的企业战略诊断比这复杂得多，要经过大量的调研、访谈和分析，才能找出端倪，提出针对性的优化措施。


    以上，希望对大家有启发。'
  - '[PAGE 70]


    # 学习别人的长处要和自己的实际情况相结合


    我们都对“马克思主义要和中国革命实践相结合”这句话耳熟能详了。这是中国人的血泪总结，付出了无数代价才明白过来的道理。


    在日常生活中，我们也要记得这样的道理。


    我是一个专门研究牛人的人。研究牛人，除了兴趣之外，也是希望能够从牛人的经历中，获得可供我们学习的东西，用于帮助我们更成功、更幸福。


    但是，牛人的东西，未必适用于每一个人。我们学习牛人，一定要和自己的实际情况相结合。不是说所有牛人都能学，更不是牛人的所有东西都能学。


    例如，孙正义年轻时和别人谈话，没几句就说：我是一个天才。然后把对方侃晕。


    那是因为他真的是天才。他的过往辉煌经历、他的超强思考能力、他的无比自信、他的伟大梦想，都支撑这个论断。


    所以别人尽管吃惊于他会这样说，但不会怀疑他这句话的真实性。


    如果我们也这样去和别人聊天，那无疑是个傻子。


    又如，牛人中，有的非常高调，恨不得全天下人都知道自己（如马云）；而有的却超级低调，恨不得全世界都不要知道自己（如黄峥）。那我们到底学谁？如果你的特点，本来适应于
    A 类，你却学了 B 类的牛人，那可能就学错了方向。


    办企业也是如此。


    很多中小企业会去学阿里、学华为。这样做没有错，但很多企业学的时候，不顾自己企业的实际情况，全盘照搬对方的做法，结果反而把自己的公司搞的一塌糊涂。


    这样的情况，我们在过往的咨询中，看到过很多案例。


    有一家年产值约 30 亿的公司，去学万科的组织架构，结果快把自己企业给搞死了。


    究其原因，就是老板根本就没有明白，万科的组织架构在什么情况下才适用，而他的公司，根本不满足那样的情况。


    新媒体写作也是如此。'
  - '[PAGE 71]


    写公众号有很多种不同写法，不同的人在不同的思维、套路和技巧。如果你不加分辨地模仿，对自己未必有好处。


    以取文章标题为例。很多新媒体写作课，会教你怎么取标题。这些经验，对有些号是适用的，对另一些却适得其反。


    以何加盐公众号为例，如果我现在去学标题党的套路式标题，那就是拉低自己的档次，得不偿失。


    反过来，别的公众号也未必能学我。例如，一个新起步的公众号，用了《闲人段永平》这样的标题，就不一定有人看。这种标题，只有在这个领域已经建立了一定的品牌信任，才能用。


    我还见过剽悍一只猫总发“今日碎碎念”这样的标题，招财大牛猫用过《—————》这样的标题。对于其他中小号来说，就不能模仿。除非你就是为了自嘲一下。


    “见贤思齐”，是好的，也是应当的。但是我们必须清楚，贤人的贤处，在什么条件下适用，我自己是不是符合这种条件。


    如此，你才能真正地把贤人的东西为己所用，而不是为其所害。'
  - '[PAGE 72]


    # 人可以宽容，但不可以软弱


    人和人的交往，大多数时候是你对我好，我亦对你好。但也有很多时候是你对我越好，我越欺负你。


    有些人是这样的，你对他和和气气，他觉得你好对付，不会怎么注重你的利益。而别人对他不假辞色，他就很惶恐，生怕得罪别人。对付这样的人，就不能太和气。该强硬时得强硬，该发火时得发火。


    不过，我们自己心里得清楚，发火是表明态度，不是自己无法控制自己的情绪。外表是愤怒的，但内心是平静的。


    这样做，自己要有敢于承担后果的勇气。如果一旦与对方起冲突，结果会如何？如果出现最严重的情况，你会面临怎样的局面？最大的损失会有多大？如果这个东西觉得无所谓，那就勇敢去做。


    一般来说，你有了勇气面对，那个最严重的情况就不会出现。通常是对方开始考虑，他一旦不顺你的意，他将承受什么代价，于是对方会先服软。'
  - '[PAGE 73]


    # 个人与组织道路选择的五个层次


    不管是个人还是组织，在选择未来道路时，无外乎五种模式，也可以说是五个层次。


    第一个层次，没有什么理由，被命运推着走。


    这一类型的个人或组织，每一个选择，都是被环境、被时代、被他人在推着走。你问他为什么选择这个专业，他说父母让选的。你问一家公司为什么要做这一行，他说我也不知道，反正就是干这也不行，干那也不行，干着干着就走上这一行了。


    显而易见，这样的个人或组织，不会有什么大成就。


    第二个层次，根据自己的资源来做选择。


    这一类型的个人或组织，会先看看自己有什么资源，适合干什么事情，恰好环境也允许，就选择了。例如看到自己数理化相对好，语文和英语一般，然后也不喜欢和别人打交道，就选了理工科，出来后干技术活。一个组织，正好能掌握某些稀缺资源（矿产、执照、人脉、技术等），就做了那种生意，也没有什么其他考虑。例如茅台镇的人做酒，沙特卖石油等等。


    这样的个人或组织，如果自己的资源（能力）比较独特，且是市场急需的，可能可以发展壮大。其风险是，如果资源用完了，或者市场改变了，这个人或组织也就陷入困局了。


    第三个层次，根据自己看到的机会来做选择。


    这一类型的个人或组织，有敏锐的市场嗅觉，能发现周边有什么好的机会，然后全力投入进去。例如，刘强东和杜国楹就是这样，看到什么生意好做，就进入什么生意。


    这样的个人或组织，如果能碰到一个非常好的机会，也是很有可能发展壮大的。问题在于，好的机会很难得。大多数机会都是短期的，用完就没了，就得去寻找新的机会。刘强东早先开饭店、然后卖光刻机、卖CD，然后终于找到电子商务这个好机会。而杜国楹，从青背娃到好记星，到e人e本，到8848，到小罐茶，现在依然谈不上成功，还在半路上，搞不好过几年还得换。


    第四个层次，根据自己的远见，选择长久的战略。'
  - '[PAGE 74]


    这一类型的个人或组织，不会看短期的机会，而是会分析社会长远发展的趋势，找到一个超级赛道，然后所有资源全都投入进去，过程中，遇到再多困难，也不退缩；遇到其他的機會，哪怕是再好的，也绝不动心。


    这样的个人或组织，如果选择的赛道是对的，而且能度过初期的艰难时刻，是能发展为平台级的大企业的。美国的戴尔、微软，中国的阿里巴巴，拼多多就是这样的起来的。


    第五个层次，根据自己的理念，选择相应的实现形式。


    这一类型的个人或组织，并不会拘泥于某一个特别的产品，而是会时不时地变换不同的产品或服务。但与第三个层次不同的是，他们在不同的产品之间换来换去，背后其实秉持着同一个不变的理念。


    这样的个人或组织，比较容易吸引与自己价值观相近的员工和顾客。有时会是一家很酷的小型公司，如果时机好，创造出了伟大的产品，就可以发展为伟大的公司。个人层面的马斯克，公司层面的苹果，就是这样。


    苹果先做电脑，再做 ipad，再做手机，背后都是那个 Think Different 和追求完美的理念，产品只不过是这个理念的现实呈现。


    个人和公司都是可以进化的，越往高层次走，公司发展壮大的可能性就越大。腾讯早期其实是第三层次，碰到什么赚钱就做什么，误打误撞发明了 QQ；后来才进化到第四层次，希望能从战略上占据一条赛道，于是做出了微信；现在在往第五层次走，以“科技向善”作为引领。但目前还在变革之中，不知道未来能不能成功。


    你是哪一层次呢？'
  - '[PAGE 75]


    # 还是要用户思维


    大家还记得那个让我去当总经理，承诺让我 3 年赚 100 个亿的公司吗？（如果没印象的可以看我以前的星球文章《https://t.tszxq.com/zJAuzFE》）


    昨天老板又来招揽我了。他请我们去他公司交流。我们到了后，他先是带我到公司最大的一间办公室，说这个办公室是给你留的。


    我一看，这地方确实不错，大大的落地窗，窗外就是深圳中心公园，一览无余，景色非常美。办公室也很大，仅这一间就比我现在加盐文化全体人共用的办公室还要大。


    老板说：董事总经理的位置随时都给你保留着，任何时候都欢迎你。


    我笑了笑，没说话。还是先谈事吧。


    公司业务和房地产相关，由于涉及到商业秘密，具体我就不展开讲了。反正其关键是两个：如何让买卖双方下载他们的 app，在上面做交易。


    他给我们展示了公司新做的海报，只见上面写着核心的广告语：卖得更高，买得最低。


    然后我扫了一下海报上的二维码，直接出来一个下载链接，写着“请下载某某 APP”。


    我问老板，这个海报是想给谁看？


    老板说，我要买家和卖家都看到。


    我们说，这样不行的，你一次广告最好只聚焦一方，至少不要对另一方产生误导。如果同时写明卖得最高、买的最低的话，受众心里就会存在极大的疑惑，只能认为你是在忽悠。


    老板和我们解释了半天，为什么他不是忽悠。我们说，你这都是专家视角，只有了解这一行的人，才会认为不是忽悠，但普通消费者不是这样想。你必须把普通消费者当成是对你这个行业一无所知的人，从这个基础去设计广告才行。


    然后我们又问老板主打的卖点是什么，他说了好半天，我们还是云里雾里的。我说，目前市场上的房产 app，链接的核心卖点是真房源，安居客的核心卖点是房源最全，你必须也想出一个核心卖点，不可能什么都包揽。


    老板想来想去，说是价格最低。'
  - '[PAGE 76]


    我说这个没问题，也很吸引消费者，问题是，你的APP怎么获客呢？


    老板说：我们除了在社区贴广告以外，还设计了裂变营销。帮我们发广告的人，如果通过他们的广告成交，可以从我们的佣金里面提成。我会找大学生勤工俭学，让他们帮我们发，还会让他们回去说服父母帮我们把广告发在朋友圈或群里。


    我问他：你怎么去接触和说服那些高中生，又怎么能间接说服他们的家长帮忙转发广告？


    他说：人都有贪小便宜的心理。我已经设计得很好了，到时候用户自然会源源不断来的，我就坐在这里等着收钱就行了。


    我听完整得非常无语。


    说实话，这位老板做出来的产品用起来还可以，理念也挺新的，说不定是一个可以成功的模式。但是他太缺乏用户思维了。


    现在，他们公司跑业务的人，只有他自己，其他的主要是技术团队和职能部门人员。


    我很想帮他梳理一下当初阿里、美团、滴漓这样既有卖家又有买家的公司，都是怎么做运营推广的，也可以帮他寻找、招聘懂运营、会地推的人来这个事情。但老板一律觉得没有必要，他觉得他现在做的已经很好了，设想得已经完美了。


    最后我只好放弃。基本理念都不一致，而且对自己过度自信，听不进专业意见的老板，是没有办法做咨询合作的。因为你出来的再好的方案，他都会万分质疑，而且不会实施，到最后只会搞得双方都不愉快。


    我想，很多技术出身的老板，都对自己的产品有迷之自信，他们很难从用户的角度去思考问题。当介绍自己产品时，他们满口专业术语，并且从未想过，对他们而言显而易见的常识，对用户来说，是从来没有听过的冷知识。


    在做产品和做营销时，用户思维是极其重要的。我们只有学会了从用户的角度来看问题，阐述问题，设计方案，才能降低用户的使用成本，增加他们使用的吸引力，事业才有可能成功。不然，一定会被用户抛弃。'
  - '[PAGE 77]


    # 怎样想出点子


    任何一个需要动脑的工作，都需要想出点子，而点子却很不好想，所以动脑的工作比体力劳动更难做。


    点子是怎么想出来的呢？


    大多数时候，我们都没有什么好办法，而是靠着灵光一现，脑子里突然蹦出这个想法、那个想法，然后顺着想下去，觉得不错，就提出了。


    但这样去想，效率太低了。


    我们做企业咨询时，常常会用到逻辑树、鱼骨图等，对分析问题、整理思路、提出方案，都是非常好的帮助。大家感兴趣的话，可以百度一下相关知识，学习如何应用。


    今天看东东枪的“文案的自我修养”，总结了两个思考框架，非常简单易懂，还挺实用的，和大家分享一下。


    第一种方式叫 how to，怎样才能……


    这个方式要求我们先确定一个目标，然后从目标一步步倒推如何实现。


    例如，我的目标是让平凡人变成牛人，那我需要做什么呢？


    为了让平凡人变牛，我需要知道平凡人怎样才能变牛；为了知道平凡人怎样才能变牛，我需要研究那些牛人是怎样变成的；为了研究牛人，我需要去了解牛人的成长经历；为了了解牛人的成长经历，我需要去搜集牛人的各种资料，看他们的传记，阅读关于他们的文章，听他们的采访和演讲……


    为了让平凡人变牛，除了知道变牛的秘诀以外，我还要能够把这个秘诀表达出来；为了表达出来，我需要写文章，在公众号发表；为了表达出来的文章让大家喜欢看，我需要把文章写得比较吸引人；为了让文章吸引人，我需要寻找全面而独特的素材，创造好的结构，提出耳目一新的观点，设计引人入胜的情节……


    为了让平凡人变牛，我还需要更好地了解不同的平凡人自己是什么情况；为了了解平凡人个人的情况，我需要有接触他们的渠道；为了接触到更多平凡人，我可能需要通过组建私密社群、开设成长课程、设计调研问卷……


    这种方法是逻辑推理，从上一步到下一步推导，是逻辑的使然，而不是天马行空的结果。这样思考的效率会高很多。'
  md: '

    他当即情不自禁地脱口而出：好，我来。


    ——以上只是孙正义招人的两个小例子。类似的例子还有很多。实际上，不光招人，他去谈推销自己的产品，并购别人的公司，给初创企业投资，也都是用这个。


    也许，这就是为什么马云 1999 年和他见面时，完全没想着找他要钱，只是讲自己的梦想，孙正义 6 分钟就打断他，决定投 4000 万美元的原因吧。


    因为两个人实在是很像——当然孙正义更疯狂一点。


    乔布斯和马斯克，也都是通过同样的方法来招揽天才的。


    乔布斯招斯卡利，就是用的那句：你是想卖一辈子汽水，还是想和我一起改变世界。


    马斯克不管招谁，都是先说自己殖民火星的梦想。那些天才们，很少能抵挡这一招。


    对于真正牛逼的人才来说，一般的金钱激励已经无法让他心动了，唯有伟大梦想，才能激发他们。


    像蔡崇信、刘炽平、陆奇这样的人，你和他说给多少工资，他们毫无兴趣，只有你未来想成就什么事业，为人类做出什么新的贡献，才会让他们怦然心动。


    ## 写一篇文章，能学到多少知识？


    输出，是最好的学习方法。不管是教别人，还是写出来或讲出来，都行。


    我这几天写孙正义，查阅资料的过程，就学到了很多东西。


    为了弄明白他的“孙”姓来源，我查到了韩国很多姓氏的原始来历，以及韩国人对家族源流的重视——很多姓氏都会被称为某地某氏，例如福州王氏等，写明始祖是公元多少年，从何国何地迁入韩国的，家族史上出过哪些名人。基本上每个氏，在维基百科上都有详细的记载。


    查到孙正义的祖先是荀凝，来自福建莆田后，我又产生了疑问，福建离朝鲜那么远，他怎么会跑到那里的呢？后来又查到宋朝时，由于陆路被辽、金阻隔，福建泉州通过海陆与朝鲜半岛有大量的商业往来。还看到了苏轼任杭州知州时写到此事的一封奏折。


    了解到荀凝因为与高丽国王显宗名字谐音而改姓，又查了显宗的有关信息，顺带了解了一些高丽王朝的知识。


    写到孙正义的精神偶像坂本龙马时，查阅了很多日本江户时期的资料，复习了黑船事件，了解了乡士、脱藩、勤王、归政等概念，加深了对日本明治维新背后知识的理解。顺便知道了坂本龙马的基本事迹，还看了司马辽太郎的小说（以前早就慕名，但是从来没看过）。


    因为 Zainichi Korean 这个词，查了很多在日朝鲜人的来源、到日本的原因，在日本生活状况等资料。因为“弹子房”这个词，查了什么是柏青哥，日本街头游戏厅赌博文化等。


    写到孙正义求见日本麦当劳之父藤田田时，又了解了麦当劳在日本的发展史。顺带查了不少关于他的著作《犹太人的商法》的资料。


    写到孙正义在美国学英语、读高中、上大学，我特地在谷歌地图上找出所有这些地方的具体位置，对旧金山、奥克兰的地图等，有了初步的印象。


    因为写到孙正义看到英特尔的芯片，又查了芯片的发展历史，看了很多期的《大众电子》封面。


    写到孙正义大学时期的创业搭档陆弘亮，顺便就了解陆弘亮的经历以及 UT斯达康的基本情况。


    后面关于雅虎的创业历程、杨致远的基本信息、马云融资的过程等，又复习了一遍。


    由于孙正义投资的公司太多，我必须搞清楚是最主要的几家，是哪一年投资的，占股多少，是收购还是入股，投资额多大，估值多高，为什么要入股等。所以，连带着 ARM、WeWork、Uber、Sprint、OYO
    等公司的情况，全都过了一遍。


    尤其是写到 ARM 的时候，为了搞清楚孙正义为了花那么大价钱收购它（320 亿美元），我查了 ARM 公司是干什么的，在业界处于什么地位，在未来的世界可能处于怎样的角色等等情况。


    ……


    这样的情况，太多太多，我都列举不过来了。


    总之就是想说明，如果你抱着认真的态度去写一篇文章，在搜集、阅读和写作 的过程中，你会收获无数的知识。而研究一个人的过程，对他的性格特点、行事方式等的了解，就更不用说了。这些都对我们有极大的好处。


    这些知识储备在人的脑海中，久而久之，我们就会对这个世界了解得更广、更深。当这些知识互相串起来，我们对世界的运行，万物的连接，就会体察得更透彻。


    所以，如果你想学习，不妨给自己找一个能持续输出的机会。


    ## 企业战略断层问题


    今天，一位星友在群里提了一个企业内部问题：非常具有代表性，几乎在每家企业都存在，所以我把它作为典型案例，专门分析一下。


    星友提出的问题是：我们是一家拟上市企业的子公司。集团很赚钱，但子公司还处于探索阶段。子公司的高层比较务虚，谈的东西听起来美好，但是却不考虑商业利益；中层拼尽全力想怎么给公司赚钱，但得不到高层的认可和支持；执行层（星友自己）也认为现阶段公司尽快赚钱很重要，对高管的想法和做法感到不理解。


    我认为，这是在企业里比较典型高层、中层、基层战略脱节现象。高层和中基层，没有在理念上、做法上达成一致，大家都觉得沟通不畅，做事很难，对方想法错误。


    其实，从企业高层来讲，他考虑的是企业的整体和长远，未必是当下如何赚钱。作为一家很盈利的集团的下属子公司，总部对其是有一定的战略定位的。有的子公司要负责赚钱，有的子公司只是卡位，有的子公司是撑门面，有的子公司是为赚钱的子公司服务，有的子公司只是为了安排人，甚至有的子公司只是为了走账……


    一家子公司，首先要明白自己的首要职责是什么，其次才考虑盈利的事情。例如，一家物业子公司，可能做好物业服务，让小区显得高大上，让业主各方面都满意，让集团在社会上具有口碑，是最重要的。它有可能连年亏损，需要总部的巨额补贴，但却是必要的。


    如果让这家子公司去考虑赚钱，它有可能会考虑把一些物业租出去，减少保安和保洁人员，降低他们的待遇，对物业的维护也是能省则省，对业主的收费却五花八门。如此下去，小区很快破败，业主怨声载道纠纷不断，集团名声臭名昭著，这是极度得不偿失的。


    所以，子公司必须明白自己在集团总体战略中的定位，并且根据这个定位来确定业务和管理重点。


    从星友的描述看，我认为，她所在的子公司在集团的定位，可能主要属于探路者。其职责，首要是探索新的业务模式，发掘、培育公司未来增长点；其次才是赚钱。


    从子公司的高层来讲，他的做法取决于两点：一是总部的要求是什么；二是自己的野心有多大。


    先看总部要求：如果总部要求尽快赚钱，他就有很大动力以赚钱为先；如果总部要求是探索商业模式，他的主要动力就是尽可能尝试不同商业模式，或者耐心地布局他自己看好的商业模式，而不注重短期的利益。


    再看高管野心：如果他追求的是来捞一笔就走，赚点钱然后高升到别的部门，那么他的动力就是把短期业绩尽快做大；如果他把自己未来的事业，那么他的动力就是着眼长远，厘清使命，选好方向，坚定信心，打好基础，而不是追求短期的利益。


    从星友的描述看，这位子公司高管，要么是总部给了他充足的时间去打基础，其OKR里面，对利润的要求很低，或者干脆没有。要么是他自己目标远大，能顶住总部和下属的压力，坚定做自己认为长远有益的事情。


    这里我只是做了简单的分析。实际的情况，可能是非常复杂的。例如，高层可能在总部有盘根错节的人际关系，甚至有高层政治斗争的影响。或者，高管可能掌握着中层和基层不知道的资源，或者和总部达成了某些协议等等。


    而中层和基层，未必清楚这些弯弯绕绕。


    但在这家公司中，高管和中基层，无疑是有着巨大的分歧。高管已经明确表示，赚钱不是当前重点，但中层和基层，从想法上和做法上，却完全是以赚钱为重点。


    这种分歧可能有以下原因：


    - 第一，总部和高层此前没有向中基层明确指出子公司的使命和承担的角色，或者前后存在矛盾，导致中基层对战略并不了解。这个是战略定位和传导出现问题。

    - 第二，高层虽然讲过了战略，但是中基层对此并不认同。这个是战略共识出现了问题。

    - 第三，中基层并不在乎战略是什么，只要自己能尽快赚到钱就行。这个是激励机制出了问提。


    一般来说，出现这么严重的战略认知分歧，这三个问题多多少少都会存在。


    根据星友的表述，高层其实已经认识到中基层并不了解、或者不认可他的战略思路，今天的会议，就是一个纠偏，希望能够传达更清楚，共识更强。但从结果来看，他失败了。


    这位高层可能在战略定位上很有自己的想法，他的问题出在战略传导与团队共识上面。另外，公司的激励机制，很大可能也存在问题。


    以上只是根据星友给出的信息做出的一些粗浅分析。实际的企业战略诊断比这复杂得多，要经过大量的调研、访谈和分析，才能找出端倪，提出针对性的优化措施。


    以上，希望对大家有启发。


    ## 学习别人的长处要和自己的实际情况相结合


    我们都对“马克思主义要和中国革命实践相结合”这句话耳熟能详了。这是中国人的血泪总结，付出了无数代价才明白过来的道理。


    在日常生活中，我们也要记得这样的道理。


    我是一个专门研究牛人的人。研究牛人，除了兴趣之外，也是希望能够从牛人的经历中，获得可供我们学习的东西，用于帮助我们更成功、更幸福。


    但是，牛人的东西，未必适用于每一个人。我们学习牛人，一定要和自己的实际情况相结合。不是说所有牛人都能学，更不是牛人的所有东西都能学。


    例如，孙正义年轻时和别人谈话，没几句就说：我是一个天才。然后把对方侃晕。


    那是因为他真的是天才。他的过往辉煌经历、他的超强思考能力、他的无比自信、他的伟大梦想，都支撑这个论断。


    所以别人尽管吃惊于他会这样说，但不会怀疑他这句话的真实性。


    如果我们也这样去和别人聊天，那无疑是个傻子。


    又如，牛人中，有的非常高调，恨不得全天下人都知道自己（如马云）；而有的却超级低调，恨不得全世界都不要知道自己（如黄峥）。那我们到底学谁？如果你的特点，本来适应于
    A 类，你却学了 B 类的牛人，那可能就学错了方向。


    办企业也是如此。


    很多中小企业会去学阿里、学华为。这样做没有错，但很多企业学的时候，不顾自己企业的实际情况，全盘照搬对方的做法，结果反而把自己的公司搞的一塌糊涂。


    这样的情况，我们在过往的咨询中，看到过很多案例。


    有一家年产值约 30 亿的公司，去学万科的组织架构，结果快把自己企业给搞死了。


    究其原因，就是老板根本就没有明白，万科的组织架构在什么情况下才适用，而他的公司，根本不满足那样的情况。


    新媒体写作也是如此。


    写公众号有很多种不同写法，不同的人有不同的思维、套路和技巧。如果你不加分辨地模仿，对自己未必有好处。


    以取文章标题为例。很多新媒体写作课，会教你怎么取标题。这些经验，对有些号是适用的，对另一些却适得其反。


    以何加盐公众号为例，如果我现在去学标题党的套路式标题，那就是拉低自己的档次，得不偿失。


    反过来，别的公众号也未必能学我。例如，一个新起步的公众号，用了《闲人段永平》这样的标题，就不一定有人看。这种标题，只有在这个领域已经建立了一定的品牌信任，才能用。


    我还见过剽悍一只猫总发“今日碎碎念”这样的标题，招财大牛猫用过《—————》这样的标题。对于其他中小号来说，就不能模仿。除非你就是为了自嘲一下。


    “见贤思齐”，是好的，也是应当的。但是我们必须清楚，贤人的贤处，在什么条件下适用，我自己是不是符合这种条件。


    如此，你才能真正地把贤人的东西为己所用，而不是为其所害。


    ## 人可以宽容，但不可以软弱


    人和人的交往，大多数时候是你对我好，我亦对你好。但也有很多时候是你对我越好，我越欺负你。


    有些人是这样的，你对他和和气气，他觉得你好对付，不会怎么注重你的利益。而别人对他不假辞色，他就很惶恐，生怕得罪别人。对付这样的人，就不能太和气。该强硬时得强硬，该发火时得发火。


    不过，我们自己心里得清楚，发火是表明态度，不是自己无法控制自己的情绪。外表是愤怒的，但内心是平静的。


    这样做，自己要有敢于承担后果的勇气。如果一旦与对方起冲突，结果会如何？如果出现最严重的情况，你会面临怎样的局面？最大的损失会有多大？如果这个东西觉得无所谓，那就勇敢去做。


    一般来说，你有了勇气面对，那个最严重的情况就不会出现。通常是对方开始考虑，他一旦不顺你的意，他将承受什么代价，于是对方会先服软。


    ## 个人与组织道路选择的五个层次


    不管是个人还是组织，在选择未来道路时，无外乎五种模式，也可以说是五个层次。


    ### 第一个层次，没有什么理由，被命运推着走。


    这一类型的个人或组织，每一个选择，都是被环境、被时代、被他人在推着走。你问他为什么选择这个专业，他说父母让选的。你问一家公司为什么要做这一行，他说我也不知道，反正就是干这也不行，干那也不行，干着干着就走上这一行了。


    显而易见，这样的个人或组织，不会有什么大成就。


    ### 第二个层次，根据自己的资源来做选择。


    这一类型的个人或组织，会先看看自己有什么资源，适合干什么事情，恰好环境也允许，就选择了。例如看到自己数理化相对好，语文和英语一般，然后也不喜欢和别人打交道，就选了理工科，出来后干技术活。一个组织，正好能掌握某些稀缺资源（矿产、执照、人脉、技术等），就做了那种生意，也没有什么其他考虑。例如茅台镇的人做酒，沙特卖石油等等。


    这样的个人或组织，如果自己的资源（能力）比较独特，且是市场急需的，可能可以发展壮大。其风险是，如果资源用完了，或者市场改变了，这个人或组织也就陷入困局了。


    ### 第三个层次，根据自己看到的机会来做选择。


    这一类型的个人或组织，有敏锐的市场嗅觉，能发现周边有什么好的机会，然后全力投入进去。例如，刘强东和杜国楹就是这样，看到什么生意好做，就进入什么生意。


    这样的个人或组织，如果能碰到一个非常好的机会，也是很有可能发展壮大的。问题在于，好的机会很难得。大多数机会都是短期的，用完就没了，就得去寻找新的机会。刘强东早先开饭店、然后卖光刻机、卖CD，然后终于找到电子商务这个好机会。而杜国楹，从青背娃到好记星，到e人e本，到8848，到小罐茶，现在依然谈不上成功，还在半路上，搞不好过几年还得换。


    ### 第四个层次，根据自己的远见，选择长久的战略。


    这一类型的个人或组织，不会看短期的机会，而是会分析社会长远发展的趋势，找到一个超级赛道，然后所有资源全都投入进去，过程中，遇到再多困难，也不退缩；遇到其他的機會，哪怕是再好的，也绝不动心。


    这样的个人或组织，如果选择的赛道是对的，而且能度过初期的艰难时刻，是能发展为平台级的大企业的。美国的戴尔、微软，中国的阿里巴巴，拼多多就是这样的起来的。


    ### 第五个层次，根据自己的理念，选择相应的实现形式。


    这一类型的个人或组织，并不会拘泥于某一个特别的产品，而是会时不时地变换不同的产品或服务。但与第三个层次不同的是，他们在不同的产品之间换来换去，背后其实秉持着同一个不变的理念。


    这样的个人或组织，比较容易吸引与自己价值观相近的员工和顾客。有时会是一家很酷的小型公司，如果时机好，创造出了伟大的产品，就可以发展为伟大的公司。个人层面的马斯克，公司层面的苹果，就是这样。


    苹果先做电脑，再做 ipad，再做手机，背后都是那个 Think Different 和追求完美的理念，产品只不过是这个理念的现实呈现。


    个人和公司都是可以进化的，越往高层次走，公司发展壮大的可能性就越大。腾讯早期其实是第三层次，碰到什么赚钱就做什么，误打误撞发明了 QQ；后来才进化到第四层次，希望能从战略上占据一条赛道，于是做出了微信；现在在往第五层次走，以“科技向善”作为引领。但目前还在变革之中，不知道未来能不能成功。


    你是哪一层次呢？


    ## 还是要用户思维


    大家还记得那个让我去当总经理，承诺让我 3 年赚 100 个亿的公司吗？（如果没印象的可以看我以前的星球文章《https://t.tszxq.com/zJAuzFE》）


    昨天老板又来招揽我了。他请我们去他公司交流。我们到了后，他先是带我到公司最大的一间办公室，说这个办公室是给你留的。


    我一看，这地方确实不错，大大的落地窗，窗外就是深圳中心公园，一览无余，景色非常美。办公室也很大，仅这一间就比我现在加盐文化全体人共用的办公室还要大。


    老板说：董事总经理的位置随时都给你保留着，任何时候都欢迎你。


    我笑了笑，没说话。还是先谈事吧。


    公司业务和房地产相关，由于涉及到商业秘密，具体我就不展开讲了。反正其关键是两个：如何让买卖双方下载他们的 app，在上面做交易。


    他给我们展示了公司新做的海报，只见上面写着核心的广告语：卖得更高，买得最低。


    然后我扫了一下海报上的二维码，直接出来一个下载链接，写着“请下载某某 APP”。


    我问老板，这个海报是想给谁看？


    老板说，我要买家和卖家都看到。


    我们说，这样不行的，你一次广告最好只聚焦一方，至少不要对另一方产生误导。如果同时写明卖得最高、买的最低的话，受众心里就会存在极大的疑惑，只能认为你是在忽悠。


    老板和我们解释了半天，为什么他不是忽悠。我们说，你这都是专家视角，只有了解这一行的人，才会认为不是忽悠，但普通消费者不是这样想。你必须把普通消费者当成是对你这个行业一无所知的人，从这个基础去设计广告才行。


    然后我们又问老板主打的卖点是什么，他说了好半天，我们还是云里雾里的。我说，目前市场上的房产 app，链接的核心卖点是真房源，安居客的核心卖点是房源最全，你必须也想出一个核心卖点，不可能什么都包揽。


    老板想来想去，说是价格最低。


    我说这个没问题，也很吸引消费者，问题是，你的APP怎么获客呢？


    老板说：我们除了在社区贴广告以外，还设计了裂变营销。帮我们发广告的人，如果通过他们的广告成交，可以从我们的佣金里面提成。我会找大学生勤工俭学，让他们帮我们发，还会让他们回去说服父母帮我们把广告发在朋友圈或群里。


    我问他：你怎么去接触和说服那些高中生，又怎么能间接说服他们的家长帮忙转发广告？


    他说：人都有贪小便宜的心理。我已经设计得很好了，到时候用户自然会源源不断来的，我就坐在这里等着收钱就行了。


    我听完整得非常无语。


    说实话，这位老板做出来的产品用起来还可以，理念也挺新的，说不定是一个可以成功的模式。但是他太缺乏用户思维了。


    现在，他们公司跑业务的人，只有他自己，其他的主要是技术团队和职能部门人员。


    我很想帮他梳理一下当初阿里、美团、滴滴这样既有卖家又有买家的公司，都是怎么做运营推广的，也可以帮他寻找、招聘懂运营、会地推的人来这个事情。但老板一律觉得没有必要，他觉得他现在做的已经很好了，设想得已经完美了。


    最后我只好放弃。基本理念都不一致，而且对自己过度自信，听不进专业意见的老板，是没有办法做咨询合作的。因为你出来的再好的方案，他都会万分质疑，而且不会实施，到最后只会搞得双方都不愉快。


    我想，很多技术出身的老板，都对自己的产品有迷之自信，他们很难从用户的角度去思考问题。当介绍自己产品时，他们满口专业术语，并且从未想过，对他们而言显而易见的常识，对用户来说，是从来没有听过的冷知识。


    在做产品和做营销时，用户思维是极其重要的。我们只有学会了从用户的角度来看问题，阐述问题，设计方案，才能降低用户的使用成本，增加他们使用的吸引力，事业才有可能成功。不然，一定会被用户抛弃。


    ## 怎样想出点子


    任何一个需要动脑的工作，都需要想出点子，而点子却很不好想，所以动脑的工作比体力劳动更难做。


    点子是怎么想出来的呢？


    大多数时候，我们都没有什么好办法，而是靠着灵光一现，脑子里突然蹦出这个想法、那个想法，然后顺着想下去，觉得不错，就提出了。


    但这样去想，效率太低了。


    我们做企业咨询时，常常会用到逻辑树、鱼骨图等，对分析问题、整理思路、提出方案，都是非常好的帮助。大家感兴趣的话，可以百度一下相关知识，学习如何应用。


    今天看东东枪的“文案的自我修养”，总结了两个思考框架，非常简单易懂，还挺实用的，和大家分享一下。


    ### 第一种方式叫 how to，怎样才能……


    这个方式要求我们先确定一个目标，然后从目标一步步倒推如何实现。


    例如，我的目标是让平凡人变成牛人，那我需要做什么呢？


    为了让平凡人变牛，我需要知道平凡人怎样才能变牛；为了知道平凡人怎样才能变牛，我需要研究那些牛人是怎样变成的；为了研究牛人，我需要去了解牛人的成长经历；为了了解牛人的成长经历，我需要去搜集牛人的各种资料，看他们的传记，阅读关于他们的文章，听他们的采访和演讲……


    为了让平凡人变牛，除了知道变牛的秘诀以外，我还要能够把这个秘诀表达出来；为了表达出来，我需要写文章，在公众号发表；为了表达出来的文章让大家喜欢看，我需要把文章写得比较吸引人；为了让文章吸引人，我需要寻找全面而独特的素材，创造好的结构，提出耳目一新的观点，设计引人入胜的情节……


    为了让平凡人变牛，我还需要更好地了解不同的平凡人自己是什么情况；为了了解平凡人个人的情况，我需要有接触他们的渠道；为了接触到更多平凡人，我可能需要通过组建私密社群、开设成长课程、设计调研问卷……


    这种方法是逻辑推理，从上一步到下一步推导，是逻辑的使然，而不是天马行空的结果。这样思考的效率会高很多。

