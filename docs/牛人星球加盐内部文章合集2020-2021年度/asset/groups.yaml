    ## 三个玩家的非均衡世界


    大家都知道，互联网由于它的规模效应运行到极致、边际成本几乎为0，所以二八效应也体现到极致，往往一个领域里面，最终竞争只能存在一个或者两个最大的玩家。其他玩家虽然能够存在，但是在市场上几乎没有影响力，我们极少见到有三个重要玩家的情况存在。


    在中国几千年的历史上，三个重要政权并存的时代，我们能够数得出来的就是三国时期，其他的时候，只要是三个政权并立，往往持续不了几年，就会走向大统一或者大分裂。


    在全世界的国际政治领域也是，几乎不会出现三强争霸的局面，往往是一超多强或者两强相争。如果出现了三强争霸，那可能是世界级的大战，或者其中一强必然被另外两强联合扼死。


    但现在中国的互联网市场上，其实有两个领域，都是三个重要玩家并存的情况。这种情况是很罕见的。


    - 第1个领域是电商，阿里京东和拼多多三国演义。原本是阿里和京东的格局已经定下来，没想到拼多多借助微信的流量池，以拼单的方式偷袭成功，现在已经形成了与阿里，京东可以并列的局面。

    - 第2个领域是短视频，原来是快手一家独大，后来抖音异军突起超过了快手，现在微信短视频又借着微信的流量开始起来。


    但我相信这种局面肯定不是长久的，三家的斗争最终有一家会走向崩溃、或者跟另外一家合并，最终形成两家对峙或大一统的局面。


    这是为什么呢？


    我们可能会很困惑。因为几何上不是讲，三角形是最稳定的吗？


    但几何学上，三个角是互相配合的，所以能够稳定。而在市场上和国际关系上，三个角是互相斗争的，所以又是最不稳定的结构。


    这就有点像物理上的三体问题。凡是看过刘慈欣的《三体》的都知道，三体是永远在动来动去的。单一恒星的系统如太阳系或者双星系统如半人马座阿尔法双星都是极其稳定的，只有三体星系处于永恒的变动之中，谁也无法预测下一步的走向是怎样。


    当然更准确的描述是经济学和博弈论。我至今清楚地记得 15 年前在浙大读研时，王则柯老师给我们讲范里安的《中级微观经济学》，讲到博弈论的时候，说起在一条街上卖同样商品的商店的博弈问题。王老师用数学解释了一个玩家是稳定的，两个玩家也能形成均衡解，只有三个玩家是找不到均衡解的，他们一定是打来打去、动来动去。王老师当时讲得是如此生动，所以我至今对他的语音语调和神气表情都记忆犹新。


    我们把博弈论应用到现实市场上，电商的三国争霸和短视频的三国争霸，最终谁会是幸存下来的玩家呢？


    如果从三体或者博弈论的角度来看，我们是没有办法准确预测到的。但从现实中来看，我觉得最终也许是比谁犯的错更少、更小。


    因为竞争到这样的格局，比的往往不是谁更强大，而是谁更少犯错，尤其是更少犯关键性的错误。


    如果是从这个角度来分析的话，电商领域我觉得拼多多是比较稳定的，不管是黄峥还是他背后的段永平，都是极其低调，小心翼翼避免犯错的。而马云和刘强东性格都很强势，这种在打天下的时候非常管用，但是在坐天下的时候，容易因为在某些关键问题上犯错而导致灭顶之灾。最近阿里的情况其实已经表现出了端倪。


    短视频领域现在还不好讲，目前抖音跟其他两家的距离拉的比较大一点，但是从长远来看，如果是犯错的话，反而是抖音更有可能犯下大错误，因为张一鸣在政治上是相对不大成熟的，而且字节跳动的公关和法务风格极度强势，四面树敌，这样是很容易在某些关键时刻遭遇灭顶之灾的，这也在去年
    tiktok 被美国打压的事情上，张一鸣在国内面临的孤立无援局面可见一斑。


    当然这里都是我自己的一些瞎想，未必准确，给大家提供一个看问题的角度和思考的框架吧。


    我们有幸见证这样的大争霸，不管谁输谁赢，市场竞争对用户来说都是好事。从吃瓜的角度来看，这也是最有意思的大瓜啊，比什么明星八卦荡气回肠多了。

