    毕竟，这一年来，我看过的书更多，研究的牛人更多，经历的事情更多，思考的内容更多，练笔的文字也更多。


    所以，今年的文章，比去年的要好，这也是应当的。明年我将会继续升级到每天更新一篇，大家也应该可以预期，明年的文章，又会比今年的更好。


    除了文字以外，星友们也见证了我其他方面的进化。


    《持续进化》的出版，何加盐公众号影响力的继续提升，奋乡科技团队的组建，农业领域的调研和创业启动……


    作为一个社群，牛人星球也在进化：会员规模即将突破两千人，龙吟、虎啸群的人数扩张和关系深化，盛大的春季分享会，高价值的加盐私宴，还有我们正在策划的加盐私塾·名企研习营……


    持续进化，就是何加盐以及牛人星球永恒不变的主题。我曾和大家说过，何加盐的风格，是劝导别人去做的事情，自己要先做到。我一直在鼓励大家持续进化，所以我自己应该先做到持续进化，在前面为大家开路。


    也许我的光芒很微弱，但是流萤提灯引路，后面千军万马。我也希望每一位牛人星球的星友，都能够和我一起，持续进化。


    一年太短，余生还长。让我们一起走下去，用无止境的进化，创造一个没有边界的人生！


