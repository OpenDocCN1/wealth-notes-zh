    ## 你感受不到的，也许才是最好的


    请问一下，此刻，你能感受到你内裤的存在吗？


    我相信在我问这个问题之前，绝大部分人，都根本不会把自己的任何一点意识，放在内裤上面。而如果你感知到了内裤的存在，那只能说明一个问题，它让你不舒服了。


    我们所有的衣服，如果非常合身，非常舒适，那我们是感受不到它们的存在。只有不合身了，让我们不舒服了，我们才会时时刻刻意识到它的存在。


    所以最好的内裤，最好的内衣，最好的卫生巾，最好的衣服，最好的袜子，最好的鞋子，都有一个必不可少的标准，那就是当你穿着（戴着）它的时候，你会完全忽略它的存在。


    同样道理，我们身体的任何一个器官，当它好的时候，你永远想不到它。只要有一点不舒服，那就时刻提醒着你，原来你还有一个胃、还有胳膊、还有手指、还有腿呢。


    月初，我的左手腕莫名了疼了一个星期。在那之前，我从来没有注意过这个位置，但是它的疼痛，让我每天都想着它。此时才意识到，原来它静静地待着、不惹麻烦的日子，是多么宝贵啊。


    扩而大之，我们的健康时刻陪伴着我们，但我们不会想着健康的存在。只有当生病了，受伤了，不舒服了，才会明白，以前的健康有多宝贵。


    我们子弟兵时刻陪伴着我们，但我们不会想着他们的存在。只有当遇到危险了，才会感受到解放军是最美丽的人。


    类似的还有空气、阳光、洁净的水、父母妻儿无声的爱、运行良好的政府等等。


    它们已经好到极致，所以你不会有意识地去意识到它，只会当成理所当然的存在。


    新冠病毒的肆虐，会让每个中国人感受到，原来平静安宁的生活，是如此幸福。


    最近美国的动荡，就会让美国人感受到，一个和平稳定的环境，会有多重要。这不是上帝的恩赐，而是要在好的政治、经济、社会环境下，尽力维持才能得到的，而不是自然而然的存在。


    从这个角度来看，很多幸福，都是比较出来的。当没有难受时，你不会感受到舒适的存在；当没有病痛时，你不会感受到健康的存在；当没有危险时，你不会感受到安全的存在；当没有动荡时，你不会感受到稳定的存在。


    这并不意味着我们要主动去寻求难受、病痛、危险、动荡，以便感受到舒适、健康、安全、稳定。但是，当我们经历了前者，不妨把它当成一个馈赠和警醒，更加珍惜后者，用更大的力气去追求和维持后者。


    如果一个人、一个组织，能做到必不可少，无所不在，但是你却永远感受不到他，这也也许正是因为他做得太好。正如扁鹊“治未病”的大哥，“我无为而民自化”的先王。


    ## 每个人都有看问题的角度


    昨晚现场参加了微信年度公开课。由于疫情原因，这次公开课现场的人不多，只有几十位。主要是通过微信直播向外界发布。


    张小龙演讲完以后，又关掉直播，小范围交流了四个多小时，一直到 12:20 才散场。


    这也是张小龙第一次通过这样的方式和外界交流。现场的提问气氛非常热烈，很多问题非常尖锐敏感，张小龙的回答也很坦诚直接。


    看张小龙对很多问题的思考，确实是有高度、有深度。可惜由于是内部交流，主持人再三要求在场人员不要对外传播。要不然呈现出来一定会是一场极其精彩的对话，估计能搞好多
    个十万加。


    说一下我感触比较深的一个点吧，那就是不同人看问题的角度，很可能完全不同，而且互相都不知道对方原来是这么看问题的。


    就举一个例子吧。我向张小龙提问说，微信是一个省时间的工具，几年前你也说过，希望你用户用完即走；而视频号是一个杀时间的工具，希望占有更多用户时长。这之间的转变，是因为你个人的理念改变，还是迫于竞争压力？


    张小龙回答说：其实我们的出发点不是这样的。做视频号的初衷和竞争压力无关，还是因为看到了视频化以后会成为信息交流更方便、更流行的趋势，也希望每一个个体，都能通过视频号向外界展示自己。所以视频化要做的还是便利用户的信息交流。


    我从这里看到的不同是：我是从商业的角度来理解的，认为视频号是从商业竞争出来，来抢占用户时长的一个手段；但是张小龙是从社会发展趋势和用户需要的角度来理解问题的，认为视频化是更符合未来信息交流的一个载体。


    所以可以说，在这个问题上，张小龙的考虑，比我是要高一个维度的。


    现场还有很多其他问题，也都是类似的交流碰撞。作为一个旁观者，我时刻会感觉：哦，原来这个问题还会有人这么看；咦，原来张小龙是这么看的。每个人的角度都不一样，但是又都有各自的道理。


    其实放到更广的现实社会也是如此。


    我们有时候会认为，我们看问题的某一个角度是理所当然的，也会不自觉地认为全世界可能都会和我们差不多吧。但实际上真正交流就会发现，原来对方是那样想的，和我有这么大的不同。


    看网络上热传的事情特别会有这种体会。有时我们看到当事人、当事机构的回应，简直会觉得不可思议，认为人怎么能荒谬到这种地步，她/他这样回应，难道就想不到舆论会有怎样的反弹吗？


    但其实真相也许是，回应者确实是想不到她/他的回应会引起舆论那样的反弹，因为她/他的信息接受环境就是那样，思考问题惯用的角度就是那样。


    一般人很少能认识到，自己所在的地方只是一口小小的井，而世人竟是如此不同。


    哪怕是做出了微信这样国民级产品的张小龙，也不例外。即便他的思考会更高一层、更深一层，但是了解别人的想法，也是非常必要的。


    在交流的末尾，他感慨地说，这是我们第一次以这种方式交流，让我看到了很多问题不同人的不同角度，非常有价值。


    ## 演讲的效果与目的


    我常常很羡慕那些能在演讲中把观众逗得哈哈直乐的人，觉得那些人就是演讲高手。


    所以，我会羡慕俞敏洪、马云、罗永浩等，甚至还研究过俞敏洪和马云的演讲稿，还学习过俞敏洪。


    有一次我在某大学演讲，就采用了俞敏洪式的演讲方法，观众笑成一团，掌声如雷，我当时感觉也飘飘然。


    演讲中，为了达到幽默的效果，我用了不少夸张、自嘲等手段。但是后来回想，这么做的意义何在？我演讲的目的是什么？难道就是逗笑观众吗？那岂不是成为一名单口相声演员或者脱口秀演员？（这里不是说讲相声或脱口秀有什么不好，问题是我在台上不是干这个的啊）


    为了达到幽默效果，演讲中非常容易口没遮拦地说一些话。有时被台下观众一起哄，就更是头脑发热，不知所以了。等回过头来检视，会发现很多不过脑子的话，其实并不合适。


    大家想一想马老师最近遇到的问题，以及此前俞敏洪被批判的不尊重女性言论，看看是不是有这个问题。


    为了写作，我看过很多人的演讲和访谈。有一些是非常沉闷枯燥的。例如马化腾、王传福、张近东、马明哲、刘永行等，但这些都是真正的牛人。他们的演讲根本就不在乎是否取悦观众，而是能不能把自己的观点表达出来。


    还有一些很厉害的演讲牛人，就是任正非、曹德旺、段永平这种。他们就是自然地说出自己的观点，但是说得却极具吸引力，要么是感情充沛、要么是言辞犀利、要么是观点新颖，但是没有哪一个故意去耍弄幽默。


    我们对于什么是好的演讲，评价标准是很有问题的。根据不同的场合、不同的目的，好的演讲各不相同。甚至有时候，沉闷晦涩本来就是最合适的。


    作为一个演讲者，完全不应该去追求幽默，追求语不惊人死不休。在不影响观点表达的前提下，幽默可以作为一种点缀，或者是吸引观众注意力的一种手段，但是绝不能本末倒置，把演讲的目的设定为取悦观众，把演讲的追求变成尽可能幽默，那就是把自己等同于相声演员或脱口秀演员了。


    前几天听张小龙演讲, 我就更加强烈地感受到这一点。张小龙就是把自己对产品的理解说出来而已，没有那一句话是好笑的（即使有时候观众笑了，可以肯定也不是张小龙的本意想搞笑），但是四个多小时的时间，全场听众没有一个提前退场。


    说到底，演讲的内容和幽默的形式，是珠宝与盒子的关系而已。重要的是珠宝，而不是盒子。很多人把注意力放在盒子上，本身就错了。


    以前我觉得马云和俞敏洪在演讲中的幽默，真是太有智慧了。现在觉得，有一些其实就是轻浮。


    ## 中国和美国的家庭观念


    最近在研究拜登，很为他家族的关系之密切而感慨。


    拜登是爱尔兰裔，在美国，爱尔兰裔、意大利裔加上摩门教最以家庭关系紧密而著称。爱尔兰裔的肯尼迪家族和拜登家族，意大利裔的教父，摩门教的洪博培（曾任驻华大使，也曾竞选美国总统），都是比较典型的例子。其中教父虽然是部电影，但是其家庭关系显然是依据现实中意大利裔的典型家庭关系去描写的。


    我清楚地记得，当年洪博培竞选美国总统失败，他的家人都站在他身边给他陪伴他。这个场景非常打动人，让我顿时有一种“输了大选又如何？拥有这些家人，你就拥有全世界”的感觉。（当然，洪博培的政治倾向是对华非常不友好的，这一点又让我非常讨厌他。）


    拜登小时候，爸妈就告诉他们兄弟姐妹要团结，甚至说兄弟姐妹之间的关系，比和父母的关系要更密切，因为只有他们之间是流着同样的血。他们说，兄弟姐妹之间要互相照顾，而且要主动、及时；如果你还需要去问哥哥或妹妹要不要你帮助，那就说明你已经太晚了。


    这种密切，甚至已经到了兄弟姐妹要无条件支持对方的程度——哪怕对方犯了罪。用拜登的话说，和兄弟姐妹做对，就像是冷战时向苏联告密一样（罪孽深重）。


    拜登的小家庭关系也非常密切。他自己在首都华盛顿当参议员，老婆孩子住另一个州，拜登每天通勤160公里回家陪他们，一跑就是36年。


    拜登竞选参议员和竞选总统的成功，和家人的支持就密不可分。第一次竞选参议员时，如果没有家人的全力以赴，他是不可能当选的。后来有几次大的人生挫折，也都是在家人的陪伴和鼓励下重新站起来。


    传统上，我们会认为中国人比美国人家庭关系更好。


    在通常的观念里，中国有更多三代甚至四代同堂，老一辈子女带小孩，父母供应孩子读书，给儿女凑首付买房，过年回家一家人其乐融融等等；而美国人相对独立，子女成年就离家，一般来说不会和老一辈住在一起，两辈之间相对的感情也更淡薄一些。


    但是也有反过的一些印象：中国人提倡为工作而牺牲家庭，赞美某个人的文章里面，总免不了写到该人母亲去世、妻子手术、孩子发烧，却因为忙于工作而不能回去照顾的情景；而美国人则更回归家庭，美国的高管会更倾向于拒绝为事业牺牲家庭，回家陪孩子比加班重要多了。


    这些其实都是刻板印象，如果要说总体的话，中国人和美国人家庭的关注点不一样；说个的话，哪个地方都有照顾家庭的人，也都有不照顾家庭的人。


    中国人的家庭责任，更看重的养育。父母有责任养活子女，尽可能给子女创造好的生活条件，所以中国很多年轻的父亲、母亲，会离家千里的地方去打工，孩子放在老家，每年只相聚一次。


    美国家庭责任，更看重的陪伴。很多文学、影视作品和纪实作品都会描写到，一家人很穷，但是父亲总是想方设法给孩子关爱，让孩子有个快乐的童年。


    在我研究过的美国牛里，芒格和拜登，都是家庭关系密切的典型；但是也有乔布斯和马斯克这样在感情上给家人无限伤害的人。而美国有些特定群体，更是形成了大面积的单亲家庭现象，只管生不管养甚至成为一种普遍文化。


    在我看来，好的家庭关系，是人生幸福的一个关键要素。但是要维护一个好的家庭关系和氛围，却并不是一件容易的事情。因为我们总会面临事业与家庭的平衡、赚钱与陪伴的取舍，还有婚姻中涉及到的两个家庭的关爱及利益平衡。


    有一点我很羡慕美国人，那就是他们在感情中相对直接、坦率，对于自己的感受会如实表达。例如，我爱你，或者对你哪个地方不满，我现在心里很难过等等。中国人相对含蓄，爱也不直接说出来，不满也埋在心里，等着吵架时再一次性爆发，难过的心情也是要隐藏，表现出我没事，我都挺好的。


    其实一个亲密的关系，是需要有直接表达的，除了表达出爱之外，更是需要表现出一个人的脆弱。只有当你愿意把最脆弱的地方展示给另一个人，才能说明真正的信任，也才能建立真正亲密的感情。


    ## 资源约束


    常常看到好多人讨论社会问题时，不考虑资源约束。


    例如，要求全民免费医疗，大学免费教育，对孩子摘素质教育，要求公司全面落实八小时工作制，等等等等。


    这些理想都很美好，但却是当前条件下不可能实现的。


    我们用医疗这个例子来细说吧：


    全民免费医疗，先要有那么多的医生、护士、医院、药品、医疗器械等等，没有这个，就只能降低医疗标准糊弄病人，或者排队等。只要这个资源约束在这里，真正的全民免费医疗，就不可能实现。


    别说全民免费医疗了，对一个国家来说，让自己的民众生病的时候有医生给看，都是一件非常艰难的事情。因为医生就那么多。毛时代解决这个问题的办法，就是大力发展赤脚医生以及鼓励和扶持中医中药，让更多的人能被医疗覆盖到。医疗是基本人权，很多时候不管大夫水平怎么样，治病效果好不好，就必须要得有，这是那个时代的背景。


    印度和加拿大就是覆盖了全民免费医疗（实际不是免费，印度是靠转移支付，加拿大是靠医疗保险），听起来很诱人，但实际运作中，印度就造成了大量无意义的糊弄，免费部分只是给看一点感冒之类看不得都无所谓的小病，真正需要医院治疗的，要么医生无能为力，要么去私立医院。而加拿大的问题，就是排队。非急诊的话，见医生、做检查什么的要先预约，等个把星期是常事。而慢性病的手术等待时间就更长了，等半年到八个月是正常的。


    所以很多时候，这就不是一个福利问题，而是医疗资源缺乏的问题。而医疗资源缺乏，是人类目前还没有办法解决的难题。哪怕你工业生产和病房建设再厉害，也永远无法培养足够多的合格医生和护士。可能只有未来机器人看病非常成熟了，才能大大缓解。


    有人可能会说，那国家为什么不多培养一些医生和护士呢？


    这又回到资源约束问题了。一个国家的人只有那么多，各行各业都需要有人。医疗行业说为什么不多培养医生护士，教育行业也会说为什么不多培养老师，工业领域会说为什么不多培养技术工人……况且，这也并不是国家可以决定的。国家只能说多设立一些医疗院校，但是也要民众愿意去读医学院和护校啊，很多孩子根本就不愿意去当医生护士。


    除医疗外，其他的问题也是一样。大学免费教育，就要有那么多学校、教授、实验室；孩子素质教育，家长就要大量投入用于陪伴孩子的时间和交给兴趣班的钱，以及社会要配套那么多的艺术老师、钢琴老师、体育老师；都搞八小时工作制，企业运行效率就会极大降低，国家经济的增速就会大幅下降，生产出来的产品和服务减少，价格上升，人们的生活水平也随之总体下降……


    所以看待社会问题，光有美好心愿是不行的，一定要看到约束条件。当然，这并不是说那些美好心愿就要置之不理。它们毕竟给我们指了一个未来前进的方向。人类的进步，就是不断地突破资源约束，朝美好理想更进一步。


    但是在现实中，资源约束无处不在。当你对别人提出一个美好愿望时，可能也要想一想，资源约束是什么？有没有什么办法可以突破？


    ## 时间的幻象


    关于时间的幻想、时间的非流动性、时间的无方向性，以前听过、看过、想过许多说法，但是都似懂非懂。今天听到一句话觉得特别好：过去从未消失，未来早已存在。


    我这样理解：我们存在每一个时刻，也许就像电影里的一帧一样。无数个一帧组成了我们人生的影片。这里没有时间的流动，每一帧都是独立的，但是又相联系的。你既可以正放，又可以倒放，还可以快进或快退，还可以跳着放。


    这可能是更接近于世界的真相。只是我们还不知道，此刻的上一帧和下一帧，是存放在什么地方？


    ## 对话的知识层次


    前几天，环球的老胡在微博上评论一些国家给民众发钱的方式应对疫情的方法，说了一句：都发钱等于没发钱。这在微博上引起了很多评论，大部分是嘲笑，还有很多网友仿照这个句式造句，说什么都爱国就等于不爱国，都贪腐就等于没贪腐，共同富裕就等于共同不富裕等等。


    其实，老胡的说法固然有问题，但是那些仿造句的人，根本连老胡在说什么的都不知道，只不过是无知的狂欢而已。


    从经济学的角度，老胡的说法是有一定道理的。原因就在于货币发行量与通货膨胀的关系。


    钱本身并不是财富，它只是可以用来兑换产品或服务的一个凭证。当每个人的钱都增加时，并不代表每个人的财富增加了，因为社会生产的产品和服务并没有变化。这些多出来的钱，主要作用是使得产品和服务的价格升高了，这个价格的升高，会部分抵消发钱的作用。这是老胡说那句话真正想表达的意思。


    如果要类比的话，好比电影院，大家都站起来看，实际上等于都没站起来一样。而不是像那些仿造句的人瞎扯的那样。


    但老胡这句话的问题在于，他太过于简化了，忽略了财富效应和消费弹性。同样的一千块钱，发给一个亿万富翁，对他的消费可能不会产生任何影响；但是如果发给一个月薪一千的人，就对他有很大影响。所以总体上虽然物价的上升会抵消一部分发钱的作用，但是由于富人和穷人对财富的感知不同，他们每增加一元钱中用于新增消费的比重不同，普遍发钱的真实意义其实在于增加了穷人的购买力，可以算作一种变相的扶贫。对于收入水平较低的人来说，这个发钱的作用还是挺大的。


    如果是从这个角度来批判老胡，那么可以说是站在同一个知识层次来讨论问题。否则的话，就是鸡同鸭讲。而那些以仿造句来嘲讽老胡的，其实正是暴露了他们的无知。


    其实，世界上有很多的对话，都有一个知识层次的问题。有很多牛人说的话，看起来好像特别愚蠢，其实可能只是我们不明白其背后掌握的知识 和信息。


    再举个例子，微博有个我很喜欢的大 V “河森堡”，他有一次在图书馆看一本欧洲史的书，书中提到一个年份公元 457 年，他就自言自语道：公元 457 年对应中国什么朝代来着？


    只听见旁边一个大叔张口就来：宋朝。


    河森堡不屑一顾地想，赵匡胤公元 960 年才陈桥兵变呢，还宋朝。


    然后大叔又说：嗯，应该是大明。


    河森堡又忍不住“切”了一声，翻了个白眼就走了。


    可想而知，河森堡对那位大叔有多么鄙视。


    直到他回到家中一查，公元 457 年，原来是南北朝时期的刘宋朝，年号正是大明。


    我们总是会在某些时候很无知，却还去嘲笑那些知识层次其实比我们高很多的人。其实有时候，我们能看到的問題，別人可能根本早就看见了，只不过他们的思考层次，不是我们所能理解的而已。


    ## 事实即观点


    记得年轻时刚知道“事实判断”和“价值判断”的区别时，我大为震撼，原来我们说的话，写的文字，里面会包括这样两种不同的指向。从那以后，我在听别人说话，看别人的文章，或自己表达时，常常都会有意识地去分辨，哪个是事实判断，哪个是价值判断。


    但现在人到中年，听得多了，见得多了，我越发觉得，在绝大部分时候，其实并没有这两者的区别，当一个人某一个事实的时候，实际上他就是在表达一种价值。


    例如，有一个制作科普视频的博主，做了一期视频，主题是中国人增加肉蛋奶消费，会导致亚马逊森林面积缩减。我们这里暂且不讨论这个问题在科学上是否成立，只讨论其中隐含的意图。粗看起来，这就是一个事实判断。但实际上，视频作者想表达的意思，就是中国人破坏了地球生态；他的价值判断，就是中国人应该少吃一点肉蛋奶。在这里，事实判断和价值判断是合二为一的。


    网上有很多类似这样的表达，都是以事实判断作为表面，来传达价值观点。而当有人指出其中的价值导向有问题时，作者会解释说，我这里完全没有价值导向，只不过是想表达一种事实。其实，每一个所涉及的事实，都是多方面，多角度的，当一个偏向性地选择了某一个角度的事实时，他的价值判断就已经做出来了。选择性的事实，从来都是为价值判断服务的。每每看到一些作者如此辩解，我就觉得很可笑。有一句话可以很好地揭穿他们的真面目：都是千年的狐狸，你在玩什么聊斋呢？


    在生活工作中，其实也是如此。


    我们会听到小孩说：妈妈，那里有冰淇淋。其实他不是描述“那里有冰淇淋”这个事实，而是在表达“我想要吃冰淇淋”的观点。与此类似，当一个丈夫说“我好累”的时候，他也不是在描述自己很累了这个事实，而是在表达“今晚我不想写作业”的观点。


    类似地，在一个工作讨论上，CEO说某个细分领域发展潜力很大，常务副总说那个领域的进入壁垒很高，看起来双方说的都是事实，但其实都是在表达观点：CEO实际想说的是，我们应该大力拓展那个领域；常务副总实际想说的是，我们

    '
