    # 为什么酒窝就美，兔唇就不美？


    在地铁上看到一张广告，广告上的美女有一个深深的酒窝，很好看。


    我盯了一会儿，突然意识到，为什么我们会觉得酒窝很美呢？其实细究起来，它是在一张圆润的、线条优美的脸上，突然凹下去一个洞，实际上是破坏了脸的完美性，我们熙理不会觉得美才对。


    我这里并不是说讨厌酒窝，或我自己觉得酒窝不漂亮。恰恰相反，我觉得酒窝漂亮极了。我的孩子就有酒窝，我觉得非常迷人。


    我只是对人类这种审美的形成机制感到困惑。


    同样是天生的一些面部或形体特征，有一些我们觉得美，有一些觉得不美，后面的原因是什么？


    例如，兔唇被认为是一种残疾，需要去做手术纠正的。一些地方的人认为双眼皮好看，单眼皮要割成双眼皮才行；而另一些地方却相反，觉得单眼皮才更好看。头发自来卷在以前的中国是被认为不好看的，但现在我们觉得是一种美……


    至于胖瘦和黑白，就更矛盾了。


    中国唐朝人和现代汤加人觉得胖是一种美，但现代中国人和西方人普遍认为苗条才是美。女孩子们天天嚷嚷着减肥，如果别人说自己胖，那不是夸奖，而是莫大的侮辱。


    中国女孩子最怕晒黑，有点太阳就要打伞，或躲着不出门。但欧美却恨不得太阳把自己晒黑，网上搜“get tanned”，马上出来一堆文章讲 how to get
    tanned fast，在中国人看来，真是不可思议。


    有很多美丑其实就是人为制造出来的。


    试想，我们为什么要认为有头皮屑是一种不好的现象呢？为什么不能认为头皮屑是一种美呢？如果一个人，头发里缀着星星点点，肩膀上洒下一圈雪花，难道不也很美吗？


    我们为什么要认为牙齿洁白是一种美呢？为什么不能像云南的布朗族那样认为牙齿黑才美呢？


    但是卖洗发水牙膏的商业机构不能容忍这一点。他们千方百计要让我们认为有头皮屑和有黑牙是极其丢脸的事情，一定要想方设法改变。'
  - '[PAGE 200]


    我印象深刻的一条广告，是海飞丝的头皮屑测试比赛。一群女孩在那里轮盘转，指针指到谁，谁就要拿一个黑色的测试条放在头上，看看粘下来几点头皮屑。


    虽然当时我年纪很小，但就是觉得不对劲。那些人的头皮屑已经少到肉眼都看不出来了，还要拿工具去测，这不是有病吗？这和美不美有一毛钱关系吗？为什么那个测试的人，要感觉到那么丢脸呢？


    我是从这个广告开始思考商业机构对我们头脑的侵蚀的。他们会为了商业利益，而制造一些概念，让我们不必要地恐慌，然后去购买他们的产品或解决方案。有一些是夸大危害，有一些甚至是完全无中生有。


    令人悲哀的是，用这种方法能赚到钱的人，往往被认为是商业的英雄，而没有人觉得这样做不对。昨天我写的史玉柱的文章，有一个人在留言里说，能赚钱就是商业上最大的道德，不管这钱是怎么赚来的，只要不违法就行。


    如果按照这种说法，我应该多去接各种广告才对。不管是 p2p、传销、非法集资、割韭菜的理财、收智商税的课程、骗钱的保健品化妆品，我应该放开了去接啊，又不违法，赚到钱才是最大的道德嘛！但是，这样的做法，恰恰是我极端不认可，也绝对不愿意去做的。我总认为，法律只是一个最低最低的底线。在法律不允许做的那条线和我们应该做的那条线之间，还有很大很大的空间，一个正直的人，不应该以法律允许为借口，把自己放在很
