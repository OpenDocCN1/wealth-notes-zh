    # 面对问题的四种心理反应类型


    假设晚上你老婆回到家，跟你抱怨说：我每天拎这个包好重。


    你的第一反应是会说什么？


    大家可以先在心里想一下自己可能会有的反应，然后再往下对照。


    一般来说可能会有这么几种反应：


    第一种：怎么会这么重呢？我看看你都装了什么。


    这一种叫做寻因型。他的习惯是先探究问题发生的原因是什么。


    例如你说小孩感冒了，他的第一反应一定是：是不是昨天晚上没盖好被子？又或者你说你感冒了，他的第一反应是你是不是穿太少吹风了？


    你说工作好烦，他的第一反应是，是不是老板又怎么样了？甲方又怎么样了？同事又怎么样了？


    第二种：谁让放这么多的东西呢？


    这一种叫做归过型。他的习惯是一定要为每一个问题找到一个责任者。


    例如小孩感冒了，他的第一反应是，你怎么带的小孩？又或者你感冒了，他的第一反应是，话该，让你穿衣服你不好好穿。


    你说工作好烦，他的第一反应是，谁让你找那个工作？早就让你换了，你不换，这会又能怪谁？


    第三种：这么重呀，你拎着一定非常辛苦吧？


    这一种叫做共情型。他的习惯是跟你的情绪发生共鸣。


    例如你说小孩感冒了，他的第一反应是，你肯定特别着急吧？又或者你说你感冒了，他的第一反应是，是不是很不舒服？


    你说工作好烦，他的第一反应是，那你每天在那样的环境中肯定很痛苦吧？


    第四种：你应该背一个双肩包，这样就不会拎着那么累了。


    这种叫开方型，也就是开出药方，他的习惯是给你面临的问题，提出一个建议的解决方案。


    例如你说孩子感冒了，他的第一反应是我们赶紧带他去医院。又或者你说感冒了，他的第一反应是，那你快吃药啊。


    你说工作好烦，他的第一反应是，那你要不换一个工作？


    但具体的反应可能会还有别的方式，但大体上都可以归结于上面 4 种的某一种。还有的是综合型，就是会反映其中的两种甚至多种。


    这 4 种都是真实存在的反应，在现实中也各有其存在的意义。寻因型可以促使你寻找问题发生的原因，归过型可以让你发现谁应该为这个问题负责，共情型可以感受到你的情绪，开方型可以让你得到一个解决方案。我们不能说哪一种就更高，哪一种就更低。


    但它引起对方的情绪变化是不一样的。第 1 种和第 4 种相对中立一点，第 2 种会引起别人的反感，第 3 种会引起别人的感动。


    一般来说，女性最喜欢别人对她用第 3 种，但男性最喜欢用的是第 4 种。所以这就是为什么经常女性觉得男性不关心她，而男性却觉得委屈，说我这么关心你你都不知道。


    实际上第 3 种除了舒缓情绪之外，对解决问题没有太大帮助，这是为什么男性觉得这个很虚。男性更愿意直奔解决方案去，他觉得只有把问题解决了，才是更高层次的关心。但对于女性来说解决情绪问题有可能本身是最大的问题，他可能说一个问题的时候，并不是想要解决这个问题，而只是想要发泄情绪，取得情感上的共鸣。还有一些问题是没有办法解决或者很难解决的，那这个时候提的建议更是没有实际作用，还不如给予情绪上的安慰最好。


    所以有时她说肚子疼，最好的应对方法未必是马上带她上医院，而是抱一抱她；她说他们老板很苛刻，最好的办法不是教她怎么应对老板，而是和她一起骂老板。当然这也涉及到问题的层级，如果是很严重的问题，当然还是需要第
    4 种，你仅停留在第 3 种，那就是油嘴滑舌而不负实际责任了。


    一个比较好的方法是综合使用上面的 4 种方式，但是在顺序上有所注重。例如你可以先用第 3 种，表示我感受到你的情绪了；然后用第 2 种，把过错归结于自己身上；再用第
    1 种，把问题的原因找出来；最后用第 4 种，把问题解决掉。


    当然这个要看实际情况，有一些用不到这么多步骤，有可能只用其中的一个或者两个就解决了。

    '
