    ## 用录音来写文章


    正好下午带小孩上课，所以有一点时间，就回答了星球上的 3 个问题。


    3 个回答加起来有 3000 多字，其实就是大概三四十分钟的时间就写完了。这个效率让我自己也是惊讶。


    因为我平时要写三四千字，可能需要一下午。在写作界，这都已经是比较快的速度了。因为这意味着一天可以写七八千字，如果再加上晚上加班的话，都有 1 万多字了。而现在效率比之前写还要高很多。


    其中的诀窍是什么呢？就是我用语音来回答，通过讯飞转化成文字，所以讲完后，稍微改一改，直接贴上去就行了。


    我们讲话总是比打字要快很多，所以这是改进效率的一个很好的办法。


    同时，通过语音来说的话，其实是有利于我们锻炼自己的语言表达能力，会减少很多不必要的语气词，要不然整理起来会很麻烦，所以说的时候会刻意地避免这一点，尽量要说的连贯一些。还要注意自己的普通话，不能有口音，否则语音就识别不出来。


    以后我可能会多用语音的方式来写文章，预计写作的速度还会比现在要快一些。


    我感觉用语言说而不是文字写，还有助于帮助梳理清楚你的思路。有时候明明不知道该写什么，写怎样去写，但是如果用语言的话，就好比两个人在聊天对话，自然而然就会知道怎么去做。


    从这一点来讲，如果大家以后在写文章的时候卡壳，或者不知道如何开始，不妨试一试先用语音的方式开头，甚至可以用语音的方式来写全文，这样的话，就避免了拿着笔或者拿着键盘不知道怎样去开局的局面了。


    当然，要能够拿起手机就说什么，也需要不断地积累。如果脑子里是空空的，你很可能什么都说不出来，或者就算能够说出来，大概率是废话。那就没有任何意义了。


    所以我们平时还是要多读书、多思考、多跟厉害的人请教，多记录自己的所思所想。只有胸中有万语，下笔才能有千言。


    最后说一下，加上本文的话，今天中午用了 50 分钟的时间都写了快 4000 字了。


    本来之前一直还挺愁，我承诺了未来每天要更新一篇文章，连续更新 365 篇千字以上文章，这是一个很大的负担。但是如果用上语音输入这个方法的话，至少可以节省一半的时间。


    大家如果有需要写文章的，不妨马上用起来。


    ## 实践易经或论语的一种方法


    很多人认为易经是用来占卜算卦的，其实不是。它更大的作用是告诉我们：第一，世界是不断变化的；第二，当面临不同的变化，且我们处于不同的人/事环境中时，应该怎样去分析所处的情况，以及如何应对。


    所以它更大的功效，是帮助我们面对不同的情境，解决不同的问题。


    最近我每晚睡前一直在读易经，突然想到一个挺好的实践易经的方法。


    易经共有 64 卦，每卦有 6 爻。每一卦的卦词和每一爻的爻辞都有其特定的含义，说的都是我们在面对特定的情境时，应该怎样看待问题、解决问题，或者应该保持怎样的态度、心境，可能会面对怎样的后果等。


    那么，我们可以每周随机选择一个卦，作为本周的指导卦。例如该学习哪方面的知识，需要面对什么问题，以什么样的态度去面对，用什么样的方式来解决，要修习怎样的德行等等。


    举一个例子：假设选择的是解卦，那么就可以实践“君子以赦过宥罪”。


    具体怎么实践呢？可以这样做：


    - 先一起学习整个卦到底是什么意思，确定本周要达到的目标。

    - 读一些关于宽恕的文章或书。例如体会“夫子之道，忠恕而已”，或者读房龙的《宽容》。

    - 反思日常待人接物，以及公司、家庭的管理，有没有一些过于严苛的地方，有没有可以宽恕别人的地方，予以改进。

    - 再想一想，如果别人犯了错，你当时是怎么对待他们的，以及你有没有得罪过人，这时候可以采取一些弥补的措施，比如说给一个你早先因为不对付已经绝交或者是疏远的人发一个信息或者给他打一个电话。给一个曾经得罪过的人送一份礼物或者发一个对不起。给一个曾经犯过错的人主动示好告诉他事情已经过去了你原谅他。

    - 与自己的老婆孩子父母同事约法三章，告诉他们自己会更宽容，更有耐心。

    - 其他（可发散思维）。


    其他的卦也类似。如抽到谦卦，那么这一周就是锻炼自己如何谦逊；抽到乾卦，就锻炼自己如何奋发；抽到损卦，就锻炼自己如何断舍离。


    由于一周共有 7 天，正好第 1 天是总卦，后续 6 天就分析 6 爻。可以一周按照总卦的指导原则，然后每一天按照每天对应的那一爻去行事。


    论语也可以按照这种方法。一共二十篇，可以每周或每个月用一篇作为指导。推而广之，道德经、阳明心学、富兰克林的处事原则，或者你自己特别认可的任一本书，都可以这样做。


    世界上很多道理，都非常简单，但是要坚持做到就很难。用这种方式可以作为一个约束及自省。如果一个人觉得坚持起来很难，也可以找一群人，以社团的方式一起做，互相鼓励和督促，甚至可以设置打卡的方式，用外在的力量帮助自己。


    我们每个人都知行合一的重要性，但是却做不到。以这样的方式，就可以帮助自己去知和行了。


    ## 一种针对超级富豪的生意


    前几天有一位星友向我咨询一个生意的问题。我觉得他这个生意模式很特别，但是也对我们挺有借鉴意义的，所以在这里聊一聊。


    星友是做超高端亲子教育的，他面对的客户是那些超级富豪。他的收费有多少呢？是年费几百万元（具体数字属于商业秘密，我就不透露了）。主要交付的内容就是帮那些超级富豪们培养小孩。


    收费高，自然投入也大，他自己的所有时间精力都需要投入进去，所以一年能接的单子也就是一个，最多两个。


    这门生意咱们普通人听起来应该还觉得不错，毕竟一年能赚几百万呢。但是真到这个层次，我们也会发现还是存在一些问题，最大的两个问题，就是生意的可持续性和规模限制。


    先看可持续性：


    这样的高端生意，拓展客户很难。其关键倒不是说要付那么多钱，毕竟对于这些富豪们来说，一年付几百万根本就是小意思。最难的是，客户一旦下了决定的话，不仅小孩要在老师这里投入巨大的时间，家长也需要付出很多时间，而且对小孩未来一生的性格都会有巨大的影响。对于超级富豪来说，其风险在于小孩的一生，而不是钱的问题。客户必须得跟这位老师达成完全一致的理念，并且对老师的能力和人品绝对地信任，才敢把小孩交给他。


    这样一来，要拓展新客户就很难了。首先，这些超级富豪并不好接触到；其次，就算是接触了，要跟他达到那么深的关系，建立这么深的信任，也不是易事。虽然也可以靠旧客户口碑推荐，但即便推荐了，也要一个很长、很深的沟通和达成信任的过程。


    再看规模化：


    这样的生意天然就很难规模化，因为其交付的是这个老师本人的时间，而一个人的时间是有限的。


    另外，由于上面所讲的拓客困难，就算一年拓展一个新客户不容易，更别说一年拓展好多个了。所以从推广上，本身也是一个没有办法规模化的东西。


    有人可能会说，我一年都能赚几百万了，为什么还要规模化呢？就服务好一个客户不也可以吗？


    其实，会这样说的人，关键是自已还没有达到那个层次。我相信一旦你达到那个层次的话，你的目标肯定也会随之调高。


    而且，如果你服务的都是超级富豪，每天看着超级富豪的家庭是怎样生活的，在社会上有怎样的影响力，自己也很难一点都不动心。


    我以前有一位朋友，就是在华尔街给那些超级富豪打理财富的，所接触的都是至少拥有 10 亿美元以上家产的那些人。本来刚开始他还觉得挺好，但后来其中一人跟他说，你这么厉害，为什么要给我们管钱呢？为什么不自己成为我们中的一员呢？


    自从听了这句话之后，朋友就不淡定了，后来便开始了创业。


    所以我想这可能也是人之常情吧。


    上面说到，星友目前现有的困惑，就是如何解决规模扩大化和业务可持续性的问题。


    他的思路是：把自己的教育理念和方法标准化、数据化、可复制化，利用信息系统、SOP（标准作业流程）和强有力的团队，打造规模化的交付能力。


    当然，这样的话，未来去实施交付的就是系统和团队，输出的是标准化的东西，其价值自然就比他本人去交付个性化定制化的东西要少一些，所以收费也就要低很多，只有原来的
    1/10 甚至更低。


    未来他希望能够把这个东西打造成一个普惠型的产品，服务更多的家庭。


    听完以后，我对他提了几个建议：


    从本质上，这个生意面临的核心问题是推广（从产品和服务上他自己已经验证过了）。推广面临的核心难点是如何触达更多的超级富豪和如何取得对方的超级认可。


    从触达上来说这个并不难，因为现在有很多打广告的办法，有一些是比较精准的，比如说在公众号上投放，像正和岛、虎嗅网、36 氪、中国企业家俱乐部，这样的公众号其实是有很多企业家在阅览的，包括何加盐公众号也是。或者还可以通过什么大学校友会、顶级商学院的
    EMBA 班、一些慈善晚宴或者某些俱乐部之类、和一些高端的家族财富管理公司或者团队合作等，也可以链接到

    '
