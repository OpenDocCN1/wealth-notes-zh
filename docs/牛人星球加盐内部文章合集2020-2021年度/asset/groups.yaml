    # 赚钱的三种方式


    从本质上，赚钱有且只有三种方式：1. 帮助世界增加财富；2. 帮助人们增加效用；3. 重新分配世界的财富。


    帮助世界增加财富，即是指你生产出了对人有用的产品，或者减少了生产产品所需要花费的资源。如果你每年可以为世界新增 1000 万元的财富，然后从中获得 100
    万元的收益，这绝对是应得的。或者你帮助别人改善工艺，或者改良材料，生产出同样的东西，少用了 1000 万元的成本，然后从中获得 100 万元的收益，这也绝对是应得的。


    需要指出的是，这里面的“产品”，既可以是实物（例如一辆汽车、一件衣服、一缸米等等），也可以是信息的组合（例如科学家研究出的理论，老师教给学生的知识、作家写的文章等等）。信息财富也是财富，甚至在我们这个时代，是越来越重要的财富。


    如果你能帮世界增加财富，而从中获得收入，那这样的钱赚得最心安理得。当然，根据分配比例的不同，可能会产生些争争议。例如，你创造（或节省）了 1000 万元的财富，个人应该从中分到多少呢？从理论上讲，只要你分走的财富少于创造的的财富，都是合理的。但是世界又讲究公平性，分得多了，会引起社会的不满，从而造成矛盾，引起内耗，而影响下一阶段的财富创造，所以会有一个合适的平衡。


    帮助人们增加效用，是指你生产出来的东西，可能本身并不是一种财富实体，但是它能增加人们在身体或精神上的享受，人们为了这种享受而心甘情愿地付费给你。例如，帮人按摩、理发、给观众表演一场话剧等等。在经济学上，这种身体会精神上的满足，叫做“效用”。


    产品或服务能够给人们带来效用，而你根据效用来获得收益，这种钱也赚得心安理得。理论上讲，只要你赚的钱，不超过你能提供的效用，你对世界就有贡献。但是由于效用的价值太难衡量，所以我们很难确定一个准确的数字。最终我们会通过市场的调节，加上一系列复杂的心理互动而确定一个价格。


    重新分配世界的财富，是指一个人既不创造物质财富，也不创造信息财富，也不减少别人的成本，也不给人们带来身体或精神上的效用，他只是通过垄断、'
  - '[PAGE 206]


    威胁、洗脑、利用人性弱点等方式，把钱从别人的口袋里转移到自己的口袋里。


    这种行为实际上对世界毫无益处，但是商人们往往不会在乎这一点，他们只在乎自己能不能赚到钱。当然他们也会用纳税、解决就业和捐款来为自己辩护，但是这掩盖不了他的商业行为本身并不创造任何社会价值这一点。


    在实际生活中，纯粹靠某一种方式赚钱的企业/个人不多，往往都是复合型的，只不过是不同方式占的比例高低不同。


    一家企业生产的产品和服务，既可能增加了社会的财富，也可能增加了人们的效用，还可能转移了人们的财富。哪怕是臭名昭著的传销，虽然主要是转移财富，但其中也有少量增加世界财富好带给人们效用的部分。


    只不过，一家企业、一个企业家在提供产品和服务时，对于自己的产品/服务，到底是给世界带来价值的成分居多，还是骗别人钱的成分居多，他自己心里是清楚的。'
  - '[PAGE 207]


    # 这样居然都能干成？


    这几天大家都在喜闻乐见地刷着嫦娥五号的新闻，感慨着中国航天技术的进步。


    此次嫦娥登月的飞行，真是太完美了，各个环节顺畅得像彩排过几万次的一样，绝对是教科书一般的演示。


    要知道，登月工程，可能是几万、甚至几十万人共同协作的一个项目，要都协调起来，难度真是太大了。最后任务的顺利，就好像是计算机程序把每个人的动作都控制得完美无缺，最后才能呈现出梦幻般的结果。


    但实际上呢，我听航天系统的朋友说，他们每天其实都很忐忑。当初觉得自己做的工作也不咋地啊，每天这里 bug 那里故障，总在怀疑就凭着这样一群人，能把那么伟大的事儿做成？


    到最后登月成功才发现，哇靠，原来自己做的东西，真的在里面发挥了重要作用，自己也是航天英雄群体的一员了。


    其实，朋友的这种感受，常常会在那些需要多人协调的项目中出现。当你着眼于一个非常微观的环节时，会发现到处都有问题，感觉按照这样下去，项目铁定做砸。但实际到最后，项目往往就在磕磕绊绊中成了。


    我在做管理咨询的过程中就发现，一访谈起来，每个人都说出一公司的一堆毛病，公司简直是千疮百孔，恨不得明天就会倒闭。


    但从整体上一看，却会发现，这家公司不错啊，在市场上有竞争力，营收每年都在增长，不仅不会倒闭，反而股价还蹭蹭往上涨。


    革命年代也是一样。从井冈山到延安的那群泥腿子，哪一天不是犯下无数的错误，经历无数的失败，有几个人真的打从内心里相信，自己这群人真能夺取最终胜利呢？


    像马化腾、任正非等人的创业也是，自己就是想要做点小生意，赚一点养家糊口的钱，怎么就会发展为后来的庞然帝国呢？


    我认为，成功其实并没有我们想的那么神秘，那么难，那么精细，它是由极少数关键因素而决定的，只要这些关键之处不出问题，其他各种小处粗一些，并不影响最终的结果。


    ![](img/bb7f05e15297f9576e6f7ae0459eba13_207_0.png)'
  - '[PAGE 208]


    认识到这一点，很利于我们对成功、尤其是巨大的成功祛魅，增强干事创业的信心。那些成功者，并不是三头六臂，其实也只不过是和我们一样的普通人。他们只是选对一个方向或一个模式，然后勇敢地、坚定地走下去。


    马云说“因为相信，所以看见”，雷军说“生死看淡，不服就干”，张一鸣爱说“大力出奇迹”，其实都或多或少包含了上面的道理。


    其次，认识到这一点还有利于缓解我们不必要的焦虑。如果你每天总觉得自己（或你所在的组织）这也不行那也不好，生怕明天事业就失败了，其实是自己给自己找不痛快。只要关键成功因素在那里没有变，你所担心的那些问题其实根本都不成其为问题。


    我这么多年来，不管是学习、感情、工作还是创业，时候看结果都很顺利，但是拉近看细节，也是惨不忍睹。但好在我这人比较乐观，敢于在事情看似困难重重的时候就不管不顾地冲进去，这才有了后面做的那些事情的成功。


    当一个人老了，最后悔的事情，往往都不是自己曾经做过什么，而是曾经有那么好的机会，自己却什么都没做。


    希望我们的生命，减少一点这样的遗憾。'
  - '[PAGE 209]


    # 剧变的世界


    大家应该都已经感受到，这个世界正在剧烈变化。从国际格局的调整，到普罗大众的心理，到我们每个人的生活，似乎都被加速了。尤其是今年以来，各种急速的冲击，让每个人都眼花缭乱。


    就我自己而言，自从三年前离职创业以来，这三年接连成立了三家公司，调整了三次主业。三年前的我，是绝对想象不到今天会是这样的。


    我打眼看了一下周边，每个人都处于这种或者那种不稳定之中。和我同龄的人，跳出体制的、换工作的、创业的，比比皆是；而那些暂时还没有换的，不管是工作的内容，还是公司的管理，抑或工作中的人际关系，也都每个月都在不同。


    这可能是中国人第一次面临这么快速的变化。


    在古代，农民的生活，几十年如一日。所面临的变化，无非就是春夏秋冬、生老病死；虽然每过个两三百年会有一次朝代更迭，但是对绝大多数人而言，一辈子都碰不到这样的事。


    解放后，中国从农业社会逐渐像工业社会过渡，也有过一些剧烈的变化，但这些变化大多是以年为单位。在我们的骨子里，我们都还是会认为，我这辈子会有个稳定的东西。那时候，我们买（在农村是建造）一栋房子，就会想着在里面住一辈子；我们找一个工作，就会觉得自己在这个厂/矿/农场/企业工作一辈子。


    而现在，变化都不能以年来计算了，一年里面，就能变好多次。你回想一下自己的生活和工作，是不是这样呢？


    我认为，这种变化加速的情况，一方面是从宏观上讲，人类本身已经进入了一个历史转换周期。这种周期既是技术进步带来的生产方式的革新，也是由此而导致的生产关系，乃至国际格局的革新。就像蒸汽革命和电力革命曾经带来的一样。不同的是，信息时代的产业革命比以前更加快速彻底。


    另一方面是从微观上讲，技术和生产关系的变化带来的社会变迁，又影响到我们每一个人都在随着发生变化——我们所做的工作，所处的单位，在社会价值链上的位置发生了变动，有些更重要了，有些没那么重要了，而更多新的工作、新的单位又在不断冒出来。


    这就导致我们每个人，都处于焦虑之中。我们不知道自己在明天的世界中，'
  - '[PAGE 210]


    还能不能找到一个好的位置；我们生怕自己被时代淘汰，失去了价值，失去了给自己创造美好生活的能力；我们害怕别人比我们干得都好，占尽了时代的红利，而自己沦为更底层。


    变化的世界里，过往的生存逻辑变了。以后已经没有了稳定的工作和稳定的人生。未来的世界里，谁更能适应变化，更能接受风险，就有更大的可能成功。而那些无法适应变化，无法接受不确定性的人，将会过得越来越艰难。'
  - '[PAGE 211]


    # 角度一换天地宽


    3 年前，我从体制内出来创业，先是做了咨询公司，后来做了公众号，现在正在启动农业项目。


    不管哪一次，都会有朋友和我说：这个事有这个困难、那个麻烦，很难做成的。


    我一方面感谢朋友的好意，但是另一方面又不信这个邪，偏偏还是想要去试一下。


    事实证明，朋友说的确实是对的，那些困难和麻烦的确存在，也给我的事业发展造成了巨大的障碍。但是，当克服了那些困难和麻烦后，我会发现，正是因为它们的存在才造就了我。


    第一，正是那些困难和麻烦，造成了一项事业的壁垒，把绝大多数人都挡在外面，只有少数人才会去做，只有更少的人才能克服。如此一来，只要不被困难和麻烦挡住的人，就获得了远高于社会平均水平的红利。


    第二，当我直面了困难和麻烦，解决了它们，我的能力就提升了，自信心就更足了。我会知道，再难的问题，都会有解决的办法；再困难的局面，我都能撑过去，获得最后的成功。所以，与其逃避问题，不如迎难而上。


    在和别人交流农业项目的过程中，我们不止一次听到“信任难题”这个最大的障碍。


    因为我们要做的是农活互助平台，就存在这么一个问题：请人干活的人，可能担心干活的人活干得不好，影响了庄稼的收成；而帮人干活的人，也担心我开着拖拉机去到地里，发现东家已经找别人把麦子割了，我白跑一趟（有些大型拖拉机，是要半挂车拉着跑，单程一趟光运费就上万）。


    除此之外，由于农业服务的非标准化，一旦庄稼、果树出了任何问题，就可能出现无数扯皮的事儿。


    这些问题，其实我们在调研中都发现了。有些朋友因为看到这个问题，就会觉得我们做不起来。


    对此，我们的看法是：问题所在，就是机会所在。


    一方面，正是因为有这些问题，才阻止了手握巨量资本的人/公司进入这个'
  - '[PAGE 212]


    领域，才给我们留下了这个发展的空间。如果是做好的事情，别人早就做了，哪能轮得到我们？


    另一方面，如果我们能够解决这些问题（哪怕是部分解决），那对于社会是多大的贡献？在商业上是多大的机会？对我们是多大的提升？


    从这个角度讲，遇到这些问题，不是我们的灾难，而是我们的福分。没有这些问题，就无法成就一份伟大的事业。


    任何你想做的事情，都会有这样那样的困难。很多人就是被那些困难吓住了，不敢往前迈出一步，所以一直让自己陷在当前的状态里。甚至有时候，当前的状态其实并非安逸，而是折磨，但是他没有胆量逃离当前痛苦不堪的局面，因为当前的折磨是他已经很熟悉的，而新的困难对他来说是陌生的。我觉得这样的生活是一种悲哀。


    世界上不缺想做容易事的人，不缺想赚快钱的人，但是缺直面问题、解决问题的人。


    当你脱离前者，进入后者，你的世界，会变得无比宽广。你的人生，也会有意思得多。'
  - '[PAGE 213]


    # # 你不想可不行啊


    最近读稻盛和夫的《干法》，看到他讲到一个故事：


    稻盛和夫年轻时，去参加松下幸之助的一个演讲。松下是举世公认的“经营之神”，稻盛以及在场的企业家，都很期望能听到松下如何经营企业的秘诀。


    松下讲了一个“水库式经营”的法则。意思是：经营企业应该像水库。水库是丰水期蓄水，枯水期放水灌溉农田。经营企业，也总是应该在资金、人员、技术、原材料等方面“蓄有余量”，以便应付艰难时期的需要。


    当时，听课的企业家提问：松下先生，您说的道理很好，可问题是我们根本就做不到啊。我们不就是因为做不到有余量才烦恼的吗？要怎么能做到“有余量”呢？你得告诉我们具体方法。


    据稻盛和夫回忆，听到这个问题的松下幸之助感到非常困惑和无奈。他沉默了一会，才说了一句：“不，你不想可不行啊。”


    听众哄堂大笑，以为松下就是回答不出来，所以敷衍了事。


    但稻盛和夫说：他听到这句回答，如受电击，极度震撼。


    这句简单的话，为什么会给稻盛和夫这么大的震动呢？原来，稻盛从这里感悟到的是：遇到问题，我们要自己思考解决方法，不能寄望于别人。


    可能很多朋友看到松下的话以及稻盛的解释，还是没有太大的感觉。但是你仔细想一想，其实可能会感受到像稻盛当时感受到的那种震撼。


    我们不管是日常生活，还是事业中，总是会遇到各种难题。这时候，往往会产 生两种想法：一是逃避艰难的思考，寻找简单的答案；二是逃避自己的责任，依靠外人的救赎。这是人的本性。


    但是那些成功者，往往就是能够克服这种本性，逆流而上的人。遇到问题，冥思苦想解决方案，不断完善；把解决问题当成自己的责任，而不是只想着求助 于别人。久而久之，一个人的人生和事业，就会大不相同。


    我常常遇到一些朋友，向我询问一些非常简单的问题。有些甚至是随便在百 度搜索一下就能找到答案的，但是他们就不愿意做一下简单的搜索，而是情愿问 别人。还有些问题是与个人的特殊情况密切相关的，除了自己之外，别人都帮不
    上忙，只有自己去想明白自己想要什么，自己擅长什么才能解决的。'
  - '[PAGE 214]


    我倒是说朋友不该问问题，或者我不愿意回答。而只是觉得，如果我们要去咨询别人，寻求别人的帮助，要先想一想，自己先思考过吗？找过解决方案吗？是不是凭自己的努力解决不了或者解决的成本过高？


    如果自己不先思考，不努力解决，就把问题丢给别人的，那么可以肯定，他的人生不会有什么大的成就。


    在讲完故事后，稻盛和夫写道：


    “能做到经营有余裕当然最好，但你不教我方法我怎么做这一点”，如果你仅仅停留在这种程度的思考，那么高目标是绝对不可能实现的。


    经营有有余裕，你真的是这样想的吗？如果你真的这么想，有这样强烈的愿望，你就会千方百计去寻找具体的方法，“水库”就一定能建成。这就是幸之助先生想说的话。


    不去想，不认真思考，就什么都实现不了。无论对工作，还是对人生而言，这都是铁则。


    希望日后你碰到问题时，能够记住这句话：我不想可不行啊。


    PS：稻盛和夫是京瓷公司和 KDDI 公司的创始人，两家公司都做到了世界五百强。七十多岁的时候，应日本政府之邀挺身而出挽救濒临倒闭的日航，让日航起死回生。'
  - '[PAGE 215]


    # 赚了两个亿，后来又亏完了


    上周有一位浙大师兄来广州出差，顺便找我聊天。于是了解了一段别样的人生。


    师兄是 90 年代浙大机械系毕业的，那时候，这个学校，这个专业，非常吃香，后来到一家全球知名外企去工作了。待遇有多好呢？这么说吧，当时在上海，公司支持年轻员工买房，全额贷款，不要利息。


    就这样，师兄的日子过得很不错。


    但是浙大人很多都有一点：不喜欢过安稳日子，喜欢折腾。师兄也不例外，外企日子过得厌烦了，很想出来创业。但是创什么呢？找来找去没找到合适的。


    后来比特币出来，师兄眼前一亮，觉得这是一个很好的创业渠道，就搞了一家区块链公司。


    2012 年左右搞区块链公司的，大多免不了和比特币有关，要么是炒币、要么做平台、要么挖矿、要么搞矿机、要么做区块链媒体、要么干脆自己发币。不管搞哪一行的，基本上都赚了一波。


    师兄也不例外，他主要是搞炒币、挖矿和卖矿机，很快就赚了两个亿。


    后来我问师兄，人生第一次赚到两个亿的时候，是什么感觉？


    师兄说，没有特别的感觉，就好像有点不真实。钱来得太容易，反而觉得不是自己的。


    嗯，也许是因为这些钱看到师兄一点都不珍惜她，于是便离他而去。到了比特币熊市的时候，两个亿一下子就亏光了。本来如果正常亏损，比特币还在，后面会东山再起。可是师兄当时用了杠杆，把比特币全都亏光了。


    到后来，公司的人走得很剩他一个，只留下一间 10 平米的办公室和一个空头公司给他。全部财富只有不到 10 个比特币。


    我又问师兄，那么多钱一下子全部亏光，又是什么感觉？


    师兄说，也没什么特别的感觉。因为原来来的容易，所以也不觉得那是自己的钱，亏了就亏了。只是后来搞投资，要到处找钱，才后悔当初钱多的时候，没有退出一部分作为保底。要不然后面也不用那么被动了。


    师兄目前是和朋友一起做一个区块链基金，找一些好的区块链项目做投资。'
  - '[PAGE 216]


    但是这年头，这一块的錢不好找了，所以师兄他们很愁募资的事情。毕竟一只基金如果只靠他们合伙人之间凑钱，规模就太小了，好的项目轮不到他们，赚钱的收益也太小。


    所以师兄后悔的是，如果当初两个亿拿出一小部份来，用于做基金，现在就不用找钱那么辛苦了。毕竟他们现在募资的目标也就是一千万美元而已。


    我很想从师兄的经历中得到一些什么启发。但是想来想去，好像也无法给与什么启发。因为他的经历太特殊，不具有可复制性。毕竟，比特币这种行情，整个人类历史，也不见得能出现几次。


    但我们也可以想一想，如果自己一下子拥有了两个亿，会怎么使用呢？'
  - '[PAGE 217]


    # 在变动的世界中寻找永恒


    大家都已经感受到，世界运转的时钟被拨快了，我们每天都会目不暇接地遇到各种变化。


    变化的世界让生意更难做了。诺基亚和柯达都曾经叱咤风云，但是后来都一败涂地。甚至就连詹姆斯·柯林斯在《从优秀到卓越》一书中慎重列出的 11 家“卓越”公司，都有
    4 家已经不再卓越。


    很显然，我们会认为，诺基亚和柯达的失败，都是因为没有会变。诺基亚没有应对好智能手机时代的到来，变成智能手机领头羊，柯达没有应对好数码相机时代的到来，变成数码相机巨头，所以他们失败了。


    但如果再仔细分析一层，会发现他们最根本的失败，不是因为没有及时变，而是没有能够服务好消费者更底层的不变的需求。


    我们用手机，其实需要的不是手机，而是信息最快速、便捷的流通。我们要相机，其实需要的不是相机，而是用最方便、最清晰的方式留下自己想保留的瞬间。


    如果一个企业追求的表面之下的这个永恒，也许它就不会紧守着一种落后于时代的产品不变，从而被时代淘汰了。


    就如同我们需要汽车，不是要的那个车，而是要快速、安全、舒适地从一个地方移动到另一个地方。


    福特说：在汽车发明之前，如果你问人们最需要的什么，他们会说一匹更快的马。


    但今天我们都知道，不管马车如何变化，它都会被汽车、轮船、飞机、高铁取代。


    变的是表现形式，不变的是内在追求。


    从这一点出发，我们应对变化更好的方法，不是跟着世界变，而是寻找变化中的永恒。


    如果你能找到永恒，服务于永恒，那么不管世界如何变化，你都有不败的底气。


    举个例子，如果你是开商店的，不管是网络商店还是实体商店，消费者的追'
  - '[PAGE 218]


    求，永远是多、快、好、省四个字。


