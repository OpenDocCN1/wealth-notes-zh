    ## 时间啊时间，你走得太快了


    昨天孩子开学，我才惊觉今年的时间已经过去了3/4了。


    在我的印象中，好像过年没多久啊，怎么一年就快过完了呢？


    同事们一起吃饭，大家聊起一个原来一起做咨询的同事，说他最近做得还不错，当项目经理，把项目打理得很好。


    我记忆里，这位前同事做咨询还没几个月，但是掐指一算，居然已经两年了。


    最大的感触是某天与何太回顾往事，发现我们自2001年上大学相识，到现在已经19年了。如果把我的日子分成两段，有何太的日子竟然已经超过了没有何太之前的日子。


    时间真是走得太快了。


    人到中年以后，这种感觉就特别明显。现在终于明白“白驹过隙”是什么意思。


    我不知道别人是什么感觉。反正对我来说，很有一种“惊悚感”：人这一辈子，转眼就过去了呀！


    随着这种“转眼就过去”的感觉越来越强烈，我越发觉得人应该有两个觉悟：


    - 时间过得这么快，什么艰难困苦算个啥呀，眼一闭再一睁，它就过去了。等你回头一看，什么都云淡风轻。所以碰到苦的时候、难的时候，我的心态更加平和，因为知道转眼它们就会随风而逝。

    - 我们想要干的事情，真得抓点儿紧。如果想干一件事，却老犹豫豫，回头一看，一年就过去。再回头，三年五年又没有了。时间太快，不仅仅抓住，它就没了呀。


    ## 引爆点


    最近一个多月来，何加盐公众号的文章阅读数据增长很快，几乎接近篇篇10万+了。


    早先开始写公众号时，认为阅读量达到1万就是一个很厉害的数字，达到1万就很高兴。至于篇篇10万+，那是想都不敢想。没有想到这么快的时间就已经接近做到了。我想，随着目前这种发展态势，到今年年底，应该是可以完全做到这一点的。


    我也在思考，最近的文章数据向好，是什么原因呢？


    难道是微信公众号有什么改动带来的利好？但是看了一下同类型的其他公众号，似乎并没有特别大的转变。


    难道是启动了盐社群之后，社群运营带来的正面效果？但是看了一下，文章还没有在社群分享之前，阅读量就已经增长很快了，社群只是锦上添花，不是决定性的作用。


    想来想去，我觉得可能是两个因素起的作用比较大。


    第一个是随着我个人经验的积累，可能慢慢也摸到了一些窍门，虽然我不刻意去追求传播数据，但是能力已经达到这个层次，传播数据自然跟上来。


    不过对这一点，我还是略有怀疑。因为从个人创作时的感觉来看，我还体会不到这些文章好在哪里。例如关于曹德旺那篇，发完之后，我的心情是很郁闷的。回到家还一脸沮丧。何太问我为什么，我说文章没写好，心里很难过。


    但这篇文章的效果却大大出乎我的预期。阅读量很高，而且评论非常正面，很多朋友和我说说得很好。


    这让我一度怀疑自己的审美标准出了问题。


    黄峥这篇也是。其实个人认为写得一般，但是也很快达到了10万+。


    我只能安慰自己说：也许我的写作能力已经提升了，但是审美标准以及自我要求提升得更快。


    第二个因素是，随着此前的积累，不管是用户数还是用户的认同度，都已经达到了一个质变的层次，然后在近期体现出来，把文章的数据冲到了高处。


    这一点很有点像格拉德威尔提出的“引爆点”理论。也就是说，事物的发展，存在一个引爆点，在未达到引爆条件之前，增长是比较平缓的，而一旦达到引爆点，就会迎来一个突飞猛进的暴增。


    何加盐公众号，有可能就是已经到达了这个引爆点了。


    不过，目前还只是猜测。一个月的数据，也不足以证明什么。考虑到下一篇文章是推广一个公益项目，阅读量也许会下降到四五万。


    总体而言，我认为目前的状态可能并非一个常态，有可能是短期运气爆棚了一下。我的正常阅读数据应该是五六万的。接下来一个月，且来印证吧。


    犹记4月16日，闲来无事偶卜，得到的是谦卦。这是对自己的一个警醒，不要对自己的能力过高地估计。


    慎之，慎之！


    ## 当你觉得很累的时候，有可能是因为在走上坡路


    最近一段时间感觉事情特别多，都忙不过来了。大部分时候是觉得充实，但有时候也难免会有累的感觉。


    除了正常的推文以外，近期与腾讯公益平台合作，洁柔纸巾的访谈与写稿，北京某机构的商务洽谈，北京地区星友会的组织，出版社的500本签名，星友会约900的祝福及签名，郑州地区的出差和考察，企业咨询项目的出差，盐习社的社群运营，公司使命愿景价值观的大讨论，公司新的商业模式研讨……


    每一件事情，都是要花费大量时间去忙活的。所有的事情都堆到一起，就感觉忙不过来。有时候文章发完，或者会开完，整个脑子都是木的。


    团队的成员也都很忙，而且干活比我还积极。周六我想休息一下，他们非要拉着讨论业务，一讨论就是整天；有时会开到晚上九点，我都着急回家，他们还非要拉着我谈：每天晚上六点我走的时候，劝大家说早点回家吧，他们也会说不急，搞完这些再走……


    我有时候会感慨，何加盐何德何能，有这么好的伙伴一起拼搏。但有时候也难免怀疑，莫非他们才是一群黑心的资本家，而是我是被压榨的无产阶级？只有看着公司的对公账户和员工的工资条，才能确定实际情况是反过来。


    累是累，但是累也有累的好处。那就是过得非常充实。而且对未来充满希望。


    这个月以来，公众号用户从35万直接跳到41.6万，产生了4篇10万加，盐习社覆盖了7千多成员，邀请了4期牛人分享，做了两个咨询项目，出版了第一本书并卖了一千多册，思考了全新的业务模式……


    有这些收获，意味着前面的累都是值得的。这种累不是毫无希望毫无意义的累，而是为了创造更美好的未来而主动承担更多，付出更多的累。累的只是身体，快乐的是心灵。


    如果你也在有些时候觉得很累，不妨想一想，自己这么累，是不是因为在走上坡路？


    如果不是在上坡，而是走错了路，那么累得就没有意义。要先纠正过来，做正确的事情。


    如果确实是在走上坡路，那么，你感受到的每一份累，都将使你更加成长，为未来积蓄更多的力量。


    希望你每一次感受到累，不是因为被剥削，不是因为走错路，而是因为你的人生在上坡。


    ## 企业家与社会认可


    我发现，很多企业家事业做到一定程度，对于赚多少钱其实并没有太在意，但是他会特别在意社会对他的认可。


    在采访威马汽车沈晖时，我曾经问过他，回顾这些年，最令他自豪的事情是什么。他毫不犹豫地说，是08年成为奥运火炬手的经历。那个火炬他一直都还珍藏着。


    无独有偶，上次去采访洁柔纸中的董事长邓颖忠，发现他办公室墙上最显眼的地方，就是他当奥运火炬手的照片。说明这也是他特别引以为傲的事情。


    拿火炬本身没什么，但能够当火炬手的，都是当地各行各业的代表人物。所以，这代表着社会对企业家的高度认可。也无怪乎他们会如此珍重这一段经历。


    当一个人事业还不够成功的时候，往往最看重的是工资待遇、发展机会等等；再稍微成功一点，可能看中的是人脉网络，社会关系的升级；再成功一点，就会升级到对社会的贡献和社会对他的认可了。


    ## 潜龙勿用的奥义原来在于“不可拔”


    以前也浏览过几遍《易经》。


    由于第一卦第一爻就是潜龙勿用，所以印象也最为深刻。


    不过，以前的关注点都放在“勿用”上面。总体上就是感觉，一个人的时机还没有到，所以没有办法做出什么事情来，只能隐忍，同时不断积蓄力量，等待时机。


    现在重读一遍，才发现以前根本就没有在意的东西。


    《文言》云：‘初九曰：潜龙勿用。’何谓也？子曰：‘龙德而隐者。也。不易乎世，不成乎名；遁世无闷，不见是而无闷；乐则行之，忧则违之，确乎其不可拔，潜龙也。’


    这里面的“不易乎世”、“乐则行之，忧则违之”、“确乎其不可拔”这些表述，以前都是一扫而过，没有留下任何印象，全都白读了。


    昨晚重读，才明白过来，原来此卦的真正奥义，并非“潜”，亦非“勿用”，而是要坚守自己的理念、原则、初心。


    不易乎世，就是不能因为时世的变化而放弃自己坚守的东西。


    乐行优违，是说符合自己志向的事情就去做，与志向不符的就不要去做。


    确乎其不可拔，是说坚守本心，怎样都不改变。


    反观我自己这些年来，“潜”也潜了，“勿用”也勿了，但是本该“确乎其不可拔”的时候，却太容易“拔”了。至于说乐行优违，更是没有做到。每每因为惧怕与在上位者、权威者对抗，而放弃了自己的想法和理念，郁郁不乐地做自己不喜欢的事情。


    如果说这辈子我最讨厌自己的一个缺点，就莫过于此了。这点也是现在及未来需要重点改正的方向。


    人生于世间，总有财运不济的时候。当此之时，最难的不是“勿用”，而是“不拔”。


    太多人容易因为环境的压迫，因为别人的逼使，因为自己的懦弱，而委曲求全，放弃了自我。


    最终，事业无所成，而自己迷失了方向，不知道我是谁，我究竟想要什么。


    坚持自我，不是莽夫一味蛮横，而是高度理智之下的坚守。需要大慈悲，大智慧，大勇气，并不是那么容易做到。


    做不到坚守的人，要么是不够慈悲、要么是不够智慧，要么是不够勇猛。


    何加盐最缺，就是勇猛。今自曝其短，以自警自醒，亦与诸君共勉。


    ## 亲人共同创业的利与弊


    最近在一家公司调研，碰到一个挺有意思的课题。


    这家公司是以哥哥为主开始创业的，但弟弟也在其中起了很大的作用。哥哥提出了创业的想法、开拓了客户、提供了技术和启动资金，可以说主导了整个创业过程。但是弟弟从一开始帮助租房子、招员工、包装产品、送货、上门安装、售后服务等，也立下了汗马功劳。


    但是，随着公司越来越壮大，弟弟在公司中的负面作用也慢慢显现出来。我们调研发现，诸多问题最终都能归结到弟弟身上。


    这里总结一下我看到的亲人创业利和弊吧。


    好的地方有两面：


    从公司来讲，弟弟是董事长最放心的人，任何时候有什么地方，别人都顶不住、或者无法令人放心的时候，哥哥第一个就会想到派弟弟过去。所以，弟弟成为了公司不可或缺的救火队长。


    例如，公司的重要骨干在客户那里受了委屈，撂桃子不干了，是弟弟硬顶上去把项目扛了下来。有什么事情别人不愿意干或者干不了的，哥哥就管弟弟愿不愿意、能不能干，都会把弟弟派过去。而弟弟无路可退，只能咬着牙上。这样的例子不胜枚举。


    从个人来讲，弟弟这样的成长速度也非常快。首先是因为哥哥会给他无数的机会锻炼，这是所有其他人都比不了的。其次是他总要面临最棘手的问题，别人可以逃走，只有他走不了，所以只能拼命学，拼命干。


    最难的时候，弟弟一个人出差在外，受尽了苦楚，哥哥电话一来，他就啪啪啪掉眼泪，但是也只能咬牙坚持。所以短短几年，他就从一个刚毕业的大学生，成长为能独当一面的大员。


    但是坏的一面也非常明显：


    弟弟由于在公司发展壮大过程中倾注了自己的全部心血，也把公司当成自己的。这种责任心在需要他救火的时候很管用，但是在公司内部管理中却成了一个大bug。


    每次看到自己不爽的人或事，弟弟就忍不住要去说，要去骂。而在对方看来，我又不是你的下属，凭什么被你管。对方的上司也很不满意，认为弟弟总是越级管理或跨部门管理，让他们没有了权威。


    而公司内部也总是流传着这样的话：某某某也就仗着自己是董事长的弟弟，才能当部门总，其实一点水平都没有。


    公道而言，这些留言是完全错误的。凭弟弟的能力和贡献，他在公司那个位子上，并没有高配。但是他的缺乏“边界感”，让自己成为全公司的众矢之的。


    而哥哥虽然知道这样的情况，但是一直也没有很好的办法来处理。弟弟也是出于对公司的热爱，哥哥又不好说公司是我的，你别到处伸手。就算是明里暗里说出来，弟弟也不以为然，他还是认为自己的做法是对的，是为公司好，哥哥再说他还能急眼、吵架。


    所以，随着公司的发展，亲情已经从原来的正面加分项变成了公司现代化、正规化的羁绊。


    这样的情况其实在很多公司都有。也不光是兄弟，凡是亲人一起创业的都会有。俞敏洪的妈妈最早给新东方做出了巨大贡献，但是后来却成了新东方内部诸多矛盾的核心，其根源和上面这种情况是一模一样的。


    所以，亲人一起创业，如何把握分寸，让互成为对方的助力而不是阻力，需要有胸怀、智慧和勇气。


    从弟弟的角色来说，该项上的时候，要毫不犹豫地顶上；但是该自我约束、甚至该退出的时候，也要能够毫不犹豫地自我约束、甚至退出。


    从哥哥的角度来说，初期无人可用，倚重弟弟是必须的，但是随着公司的发展，要建章立制，以制度管人；要引进相关的人才，激发他的动力，使专业的人尽心尽力地干专业的事。必要的时候，甚至可能需要大义灭亲，情愿自己私底下多给钱，也不要把亲人放在不该放的位置上，做不该做的事情。


    ## 加盐星友会陈厚考察记


    9月19日到20日，牛人星球18位星友参加了加盐星友会企业考察之旅，到陈厚中国学习交流。陈厚创始人朱总讲解了陈厚的来龙去脉，向星友介绍了为什么要做陈厚，陈厚是怎么做的。并与联合创始人蔡总一起回答了星友们的问题。


    18位星友来自广州、深圳、汕头、台州、上海、北京、石家庄、武汉等地，分布于外贸、金融、电商、教育、互联网等行业，有的是年收入数亿元的企业家，有的是管理10亿+资金的投资者，有的是3000+学生私立学校的校长，有的是用户过千万的互联网创业者……


    考察交流结束后，考察团大部分星友又参加了20日下午的郑州地区星友聚会，每人都分享了自己的经历，谈了对最喜欢的何加盐文章的感受，并透露了未来的人生梦想。


    这次考察和交流，每一位星友都满载而归。大家对陈厚的企业文化、运营模式、管理方式等有了深入的了解，也借此重新梳理了自己的初心，学到了打造企业文化和优化公司管理的良方，也结实了一批志同道合，互相帮助的朋友。


    对何加盐本人而言，此行启发最大的是两点：


    一是做事的发心很重要，做人的人品很重要。陈厚成立才一年半，就已经做到了销售总额近6亿的规模，发展非常迅猛。陈厚的人员队伍非常稳定，而且斗志昂扬，工作效率极高。这些都与两位创始人本分的风格分不开。


    在何加盐的调查中，80%的陈厚人表示，就是为了追求朱总，才会加入陈厚。而朱总之所以有那么大的吸引力，最主要原因就是人品好，其次是做事能不断从胜利走向胜利。而陈厚的经销商，也大多数是出于对蔡总的无条件信任，才来接触陈厚，并在接触中了解到朱总及陈厚的发心、人品、做法，才毫不犹豫地和陈厚合作。


    二是做事要全情投入。朱总每周末给经销商上课，授课时间长达8小时；每周一例会会給员工上课一个半小时。这两个动作连续一年半没有中断。蔡总去年到各地发展经销商，一年飞了20多万公里，工作完全是5+2，白+黑的状态。陈厚的高管和员工，也一个个都工作非常拼命。


    我想，一个人、一家公司，如果发心很好，做的事情对社会有足够的价值，同时又能够把自己的整个生命都投入其中，事业何愁不成功呢？


    最后，感谢陈厚的热情招待和全力配合，感谢朱总和蔡总毫无保留的分享，也感谢各位远道而往的星友。


    祝愿陈厚越办越好。希望星友们从此次考察中获得的启发，能够帮助自己在未来的生活和事业中做得更好。也希望大家在考察中结交到的朋友，友谊长存。


    ## 再牛的人也有难处，再小的事也能窥测未来


    《淮南子•齐俗训》记载了一段周公和姜子牙的对话，很有意思。


    当时是武王伐纣之后不久，周王朝成立，分封诸子以及有功之臣。周公被封在鲁，姜子牙被封在齐。


    姜子牙就问周公，你以后咋治理鲁国啊？


    周公回答说：“尊尊亲亲。”意思是，尊敬应该尊敬的人，亲厚应该亲厚的人。这和后世所说的君君臣臣父父子子，意思差不多，大概是“以礼治国”，让万民有秩，万物有序，各安其位，各有各的行为规则。


    这是后世孔孟一系流传的治国之道，对中国产生了巨大的影响。


    不过，姜子牙听了以后的反应是，叹了一口气，然后说：“鲁从此弱矣”。


    鲁国从此要衰落了啊。


    不幸的是，姜子牙的预测是非常对的。鲁国后来“日以削”，到春秋时成为常常被欺负的一个国家。我们今天看《左传》、《史记》、《资治通鉴》，提到鲁国一般是两个标签：礼仪之国、被欺凌的弱国。


    那么，姜子牙的齐国又怎么样呢？


    周公也问了姜子牙：你准备怎么治理齐国啊？


    姜子牙回答说：“举贤而上功。”意思是，我任用贤能的人，尊崇功绩。他重视的是人们能不能发挥自己的才能，为国家做出贡献。


    这也是后世治国非常重要的选贤任能、奖功罚过之术，是任何一个强盛的朝代和有为的君主都会做的事情。


    不过，周公听了以后的反应是，叹了一口气，然后说：“后世必有劫杀之君。”以后齐国的君主可能会被谋朝篡位啊。


    果不其然，齐国传了二十四世后，被田氏篡位，姜齐变成了田齐。反而是弱小的鲁国，倒传了三十二世。


    周公和姜子牙，都是道德和才能都无可挑剔的人，但他们在治理国家时，也没有办法兼顾，只能选择自己更重视的一面。


    周公更重视道德教化，子牙更重视人尽其才。但问题在于，道德教化做得好，国家未必强盛，身为礼仪之邦，却受了尽耻辱；人尽其才做得好，却未必稳定，大家的争竞之心被挑起，反而导致弱肉强食，纷争不断。


    世间没有双全法，这是每一个做事的人的无奈。你只能选择自己更在乎的一面，而不得不承受另一面。


    这一场对话给我们的启示是：


    1. 凡事不可求全责备，要抓主要矛盾。

    2. 要认识到任何选择都有代价，勇于为实现主要目标而承受必要的代价。

    3. 最底层的选择没有对错，遵从内心而已。

    4. 厉害的人，从一件事情的开端，就能推断出日后事态发展的走向。脚下踩到霜，就知道过不久江河要上冻。我们要多学、多思，提升自己分析问题、预测未来的能力。


    附周公与姜子牙对话的原文（见《淮南子•齐俗训》，作者：汉•刘向）：


    昔太公望、周公旦受封而相见。太公问周公曰：“何以治鲁？”周公曰：“尊尊亲亲。”太公曰：“鲁从此弱矣。”周公问太公曰：“何以治齐？”太公曰：“举贤而上功。”周公曰：“后世必有劫杀之君。”


    其后，齐日以大，至于霸，二十四世而田氏代之；鲁日以削，至三十二世而亡。故《易》曰：“履霜，坚冰至。”圣人之见终始微言。


    ## 为行业找技术，还是为技术找行业？


    这是采访极飞创始人彭斌时，他提出的一个观点。


    极飞一开始是做无人机的，后来用无人机做了空中打农药的业务，做得很成功。当时极飞内部出现了方向之争。


    一部分人认为，极飞的无人机很牛，除了用于农业以外，还可以用于其他行业，例如电力、物流等。


    另一部分人认为，农业是一个技术洼地，还有很多技术可以用，极飞应该专注于农业，为农业的需要而开发新的产品。


    我认为，这个问题可能是很多人曾经想过，很多公司也还在纠结的一个问题。


    我曾经在《人生与事业道路选择的五个层次》中提到，道路选择有几种方式，其中两种分别是：能力驱动和战略驱动。


    极飞当时的困惑，其实就是选择能力驱动还是战略驱动。


    从商业上讲，两种驱动方式都有成功的案例，在当时极飞的情况下，也都能带动公司快速发展。


    但是从长远来看，公司要做得更持久、更成功、更伟大，都要走上战略驱动的路子。哪怕是原来纯粹能力驱动的公司，也会走向战略驱动。


    为什么呢？


    第一个原因：战略驱动带来的内心理动力会更足。因为它针对的是社会、产业、人们的迫切需求。


    大家需要一个技术，你从无到有地把它创造出来，这种成就感是无可比拟的。


    而且，你不是把一种已经用得很溜的技术重复性地使用很多年，而是不断去琢磨新的技术、创造新的产品。


    这种模式对于人才，尤其是高级人才，是极具吸引力的。


    而为技术找行业的公司，技术人员的成就感普遍不高，因为公司的营收和利润增长往往是营销团队带来的贡献，而不是技术团队。


    第二个原因：不同行业之间的壁垒比不同技术之间的壁垒更难突破。

