    # 答:


    这个问题是人到中年常见的老问题了，只要接近 30 或超过 30，大部分人都免不了会想这个问题，年纪越大，越是强烈。


    对于未来的思考和事业的选择，可以从三个维度出发：


    +   1. 我能干什么？

    2. 我喜欢什么？

    3. 什么能赚钱？


    这三个维度，满足得越全面越好。如果只是满足其中一个，但另外两个都不满足的，建议不要选。


    插画这个事情，假如你是真的无比热爱，恨不得朝思暮想，不干这个就觉得难受。那没的说，这肯定是你可以选择的方向。热爱本身就是最好的理由。


    但如果只是一般的喜欢，可有可无的话，最好还是先作为一个爱好培养着，然后看看有没有什么方式能变现。 例如去投稿，或者加入其它需要插画业务的'
  - '[PAGE 368]


    公司，或者通过公众号、视频号、抖音等方式，向大众展示你的才华与个性等等。如果受到很多人认同和喜欢，有了变现的渠道，可以考虑职业化作。


    但是做职业化运作也要有心理准备，爱好是一回事，职业是另一回事。有时候我们业余玩一玩觉得一个事情很有趣，很轻松；但是当成它为饭碗时，有可能会丧失了乐趣。


    如果现在自己插画的水平也不行，干了很久也赚不到钱，那最好还是不要专职做。就当个业余爱好，调剂一下自己的生活吧。


    从未来长远来看的话，还是要看你自身想要改变的意愿、你的行动能力、你的风险承受能力。如果你的意愿极其强烈、执行力也不错、以往积蓄也可以支撑未来两三年无收入的日子，那么不妨结合自己的兴趣爱好和能力，尝试一下别的事情。如果你只是有点焦虑，但是意愿并没有多强烈；或者你就是想一想，其实自己没有采取行动；或者由于家庭开销大，以往没有积蓄。那么我觉得还是谨慎一点比较好。


