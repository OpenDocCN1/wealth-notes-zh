    # **企业中的四类人才，你是哪一类？**


    一个发展良好的企业中，一定要有四类人才：领导者、管理者、参谋者、执行者。


    领导者负责指方向，打造企业文化，组织资源和人才，带领大家 一起朝目标前进。在遇到困难时，领导者要坚定信念、百折不挠，同时要给大家打气。


    领导者最需要的能力是领导力，也就是带领大家坚定不移地朝着目标前进的能力。


    管理者负责落实领导者的各项奇思妙想，把天马行空的想法变为可操作性的步骤，防止走偏、走样。


    管理者最需要的是管理能力，也就是理解目标、分解目标、督促大家完成目标的能力。


    参谋者负责研究内外部各种情况，发现外部的机会和风险，内部的优势和劣势，向领导者讲明情况，提出建议。


    参谋者最需要的是研究能力和创造力，要善于发现问题，并提出方案。但问题到底有多严重，方案是否采纳，由领导者来定夺。


    执行者负责执行领导者和各项指示，是具体跑业务或者办事的人。执行者最需要的是理解力和执行力，要善于理解上级指示，并且能够不折不扣地执行。


    在较小的企业里，很多时候这些角色是重叠的。一个创始人，既要管方向、也要管目标分解、还要研究策划、有时候甚至要自己充当业务员或行政人员。


    但是企业稍微大一点的时候，就要有比较明确的分工了。最关键的是，企业的老板要善于当领导者，不要满足于当管理者。


    我们曾经做过一家企业的咨询，该公司的老板非常骄傲地和我们讲，我的管理能力，在这个城市应该是数一数二的吧。


    我们承认他的管理能力很强，但问题是，他的领导能力不行啊，公司走的方向都是错的，总是在一些毫无发展前途的地方浪费公司的现金流、人才和宝贵的发展时间。


    企业最关键是要做对的事，这个来自于领导能力；而很多企业家属满足于把事'
  - '[PAGE 51]


    情做对，这属于管理能力。如果你走的路都是错的，那么走路的姿势再正确，走得再快，也毫无意义。


    对于参谋者，这个角色不好找，中小企业一般没有，大企业才有战略研究者或策略部门。所以在中小企业，一般是领导者本人就是参谋者，其他人员也会提一些战略、经营、管理的建议，但不是专门做这些事的。


    一个好的办法是寻找外部支持，让做咨询、投资、战略规划或者管理咨询的专业团队来帮自己出谋划策。


    还有些企业老板，特别不善于分权和授权，什么事情都要自己插手，结果本来是领导者的角色，很多时候却变成了执行者。这就是不善于利用团队的力量，不善于寻找帮手。


    曾国藩说，成大事的第一要义，是多找帮手。当你需要操心的很多事情，都可以由别人帮你代劳了，你自已就能集中精力想更重要的战略方向问题了。而且，大部分情况下，让专业的人士来干专业的活，比老板亲自上场，要干得更高效，更漂亮。


    就算是退一步，老板做任何事情都比下属强，那也有考虑经济学上的“比较优势”。老板应该把精力花在自己最擅长，也是最需要自己发挥作用的地方。其他方面，应该放手让下属去做。


    每个人的性格和能力不同，都有自己适合的角色。有的人善于把控方向，有人格魅力，就适合当领导者，例如马云。有的人管理能力特别强，就是和当管理者，例如彭蕾。这两种角色是不同的，如果让马云来管理，或者让彭蕾来领导，那阿里巴巴就会一团糟。


    有些人特别擅长看问题和出主意，这种就适合当参谋者，但是未必适合当领导者。因为领导者需要“决断”，而参谋者一般是“多谋而寡断”。如果你是一个主意很多，但是做事比较瞻前顾后的人，可能更适合的角色是参谋者。但是一个好的参谋者，必须配合一个好的领导者，才能发挥好他的作用。


    个人能力很强，但是不擅长管理或团队作战的人，适合当执行者。例如有很多金牌销售员或技术员，单兵作战的能力特别强，但是带团队未必好。他们也不一定适合当领导者。有的人觉得自己销售能力强或者技术能力强，就一腔热血地开公司，结果亏得一塌糊涂。原因可能是，他只是一个好的执行者，但未必是好'
  - '[PAGE 52]


    的领导者和管理者。企业碰到这样的人，也要善于利用，不要把执行者贸然提拔为管理者，宁愿多给钱，不要给高位。例如一位技术特别牛逼但是沟通和管理能力一团糟的工程师，你让他当
    CTO，可能既害了公司也害了他。


    所以对于一个企业来说，老板要善于区分四种角色，一是自觉承担好领导者的角色，不要老把自己当做管理者、参谋者或者执行者来用；二是要善于识别不同人员的特质，放到合适的岗位上，不要让管理的人当执行者，会执行的人当管理者；三是要发挥好参谋者的作用，如果公司财力足以支撑，可以有专门的参谋者或者请外部咨询团队，如果公司财力暂时还比较薄，应该多群策群力，从群众中发现问题和吸取好的点子，这就要有好的沟通和决策机制。'
  - '[PAGE 53]


    # 黄峥的低调


    这两天一个热传的新闻，是黄峥的财富已经超过了马云，他成为中国第二大富翁。


    目前，拼多多已经站稳了中国第三大电商公司的地位，并且在一些指标上已经成为第二或者第一。


    随着越来越多的都市人群也开始用拼多多，并且感叹“真香”，加上拼多多的广告攻势很猛烈，其数据还在继续向好，带动股票也一路狂奔。


    由于黄峥个人拥有的股票比例非常高（40%多），所以他的财富也跟着水涨船高。现在离成为中国首富，也已经很近了。


    根据今天（6月24日）的数据，马化腾是553亿美元，黄峥是438亿美元，如果拼多多股票再这么涨个几次，黄峥就暂时超过马化腾了。


    不过，这些都是账面资产，不能算真实财富。何况黄峥那么高的持股比例，肯定有很多是帮别人代持（例如段水平），不可能都是他个人的。


    但无论如何，一个80后，事业做到这个份上，都是超级无敌牛逼的。


    值得一提的是，黄峥个人也是超级无敌低调。早些年他还有公众号，写一写自己的人生和感悟，后来就再也不公开发表言论了，连公司上市，他都没有去现场敲钟。


    最近一年，他更是只通过年度致股东信来和外界作唯一的沟通，平时外界几乎听不到他的声音。


    对于他的低调，我们写公众号的深有体会。当我写文章写到黄峥，找他们公关部的人求证一些信息时，他们总会百般哀求：何老师，能不能不要写他，求你了。


    其实，由于我对黄峥的欣赏，写他的基本上是正面的，向他们求证的信息，也不涉及负面，但他们还是不想要宣传黄峥。


    我们有一个浙大创业校友会的公众号，也是写到黄峥，都是正面的，但他们的公关部门都会去联系说，能不能不写Colin？


    别的企业都恨不得自己的公司和老板天天在网上曝光。黄峥倒好，恨不得自己在外面没有任何一点消息。'
  - '[PAGE 54]


    他的这种低调，部分源自段永平。作为被段深影响的人之一，他把段的低调也学到了，并且青出于蓝。段还经常出来演讲，还有自媒体账号，而黄则一概都不露面了。


    不过，作为如此牛逼的人物，哪怕是再低调，也像是锥子放在布口袋里，总会被人看到尖尖；也像是漆黑中的萤火虫，怎么隐藏，都会被人看到光芒。


    段永平是因为上富豪榜、巴菲特晚餐、大笔捐款而被舆论热议。黄峥虽然没有后面两个，但是他年纪轻轻就富豪榜，一上就远老师当年，而且现在都隐隐要成为中国首富了，这种位置，想低调都不可能。


    所以估计以后的情势就是，黄峥继续藏在公司里面不露头，但是他的名声将随着首富名头而越传越广，越传越响，江湖上处处流传着他的传说，却再也没有人见过他的身影。'
  - '[PAGE 55]


    # 我给你唱首歌吧？


    东东枪的《文案的基本修养》讲到一个观点，人们对一个产品或一个人的印象，包含了“看法”和“感受”两个方面。


    “这个产品很好”，是看法；


    “我喜欢这个产品”，是感受。


    通常来说，我们对一个东西的看法很好，会有利于形成较好的感受，但两者的关系并非绝对。很多时候，看法好的东西，我们未必喜欢；看法不好的东西，我们未必不喜欢。


    例如金庸小说里李文秀的名言：那些都是很好很好的，可我偏偏不喜欢。这就是最典型的看法与感受分离的状态。


    在婚恋中，上一辈更习惯用看法来帮下一辈挑选对象，而下一辈本人，则更多注重感受。所以父母会通过看对方的财富、学识、上进心等等，来认定其是不是一个好的对象；但是子女本人则往往看不上父母精挑细选的对象，原因很简单，就是“没感觉”。


    把这个区别用于广告领域，就形成了你是塑造看法，还是塑造感受的区别。


    塑造看法的广告，致力于告诉大众，我的产品有多好；


    塑造感受的广告，致力于让大众对产品某种别样的情愫。


    显然，后者是更高明的手段。


    像可口可乐、耐克、百事可乐这样做广告最厉害的公司，永远不会去宣扬我的产品参数是什么，而总是去塑造你对他们的感受，让你先爱上它们。


    如果感受塑造得好，还能反过来影响看法。这就是俗语说的“情人眼里出西施”，西施，表示一个人很美，这是看法；情人，表示很喜欢一个人，这是感受。


    我们往往并非因为一个人是世界上最美/帅的人，而爱上她/他；但是当你爱上她/他以后，她/他在你眼里，就成了世界上最美/帅的人。


    所以我们也可以看到，对那些追星族而言，哪怕别人都觉得他的偶像不咋地，但是他就是愿意“守护世界上最好的”某某。而当他们年纪渐长，不再迷恋这个偶像后，才会看到偶像身上的种种缺点，会对自己当初为什么会迷恋这样一个人而百思不得其解。'
  - '[PAGE 56]


    我们为自自己的公司、个人打造品牌形象，也要注意这一点。


    很多公司会用拟人化的手法去宣传，让你形成对该公司的感受。所以我们看到很多品牌广告，它们并不具体宣扬某一种产品，只是为了让你爱上这家公司而已。


    那些打造个人品牌厉害的人，也都会非常注重塑造某种人设，通常都会讲究某种情怀，用以吸引有共鸣的受众。他们可能有很多缺点，如果从“看法”的角度，我们能数出一堆这个人不值得喜欢的地方；但是，他们就是能够吸引到很多人喜欢，例如罗永浩。


    当然，这些公司和个人主要都是从事2C的业务，2B的公司与个人很少这么做，可能做了效果也不一定好。


    作为公司或者个人品牌的拥有者，你需要了解你的目标顾客，最在乎的是什么东西。如果是看法，那你就耍突出塑造各种看法，提升你的性能参数；如果是感受，那你就耍突出塑造各种感受，提升你的公司或个人魅力。


    最后，举一个小例子加深大家的印象：


    有两个男生，都在追求一个女孩。其中一个跑过去说，我有房、有车、年薪百万，一定能让你过上好日子的。另一个人跑过去说，我一看到你就心跳加速，心中喜悦，有一种想要唱歌的冲动，我能给你唱首歌吗？


    如果女孩在乎的是未来生活的保障，那么第一个自然就更有吸引力；如果女孩在乎的是当下的感觉，那么第二个可能竞争力更强。


    所以你是展示好房好车，还是为她唱一首歌，不能凭自己想象，而要看对方的需求。如果搞错了需求，你就会损失掉生意，或者爱情。'
  - '[PAGE 57]


    # 你是想报复，还是想幸福？


    我有一个很好的朋友L，在某报社工作，业绩非常突出。


    但是，她却受到报社领导的打压。最大原因是，该领导的妻子和她同一个部门，是各种福利和机会的直接竞争对手。


    例如出国交流学习，只有一个名额，按业绩说话的话，肯定是该L去，但是在领导的干涉下，领导妻子去了。


    后来，由于报社经济效益不好，要裁员，领导直接挑明：你走吧。


    L提出：你们辞退我可以，要按国家劳动法补偿。


    领导说：你自己提辞职，单位是不可能补偿的，但是以后你进入别的单位，对方来做尽调或者政审，我们可以帮你说好话。如果你非要等单位辞退，也可以，但我们会在人事档案上写明，你是因为犯错误被开除，而且会在圈子里广而告之。


    这个领导在媒体圈是有一定影响力的人，他要是这样做的话，绝对办得到。


    L的哥哥也是我朋友，他提了两个解决办法：一是找人修理该领导，卸个胳膊啥的；二是在网上撰文曝光该领导的恶劣事迹。


    L问我意见，我的建议是：第一，这种烂人不要和他纠缠，你直接辞职，尽快走人吧；第二，交辞职信前先找领导谈一次，尽量争取一些补偿，如果没有也无所谓，但是要把话都谈开，同时全程录音，以备往后不时之需。


    L的哥哥也被我劝阻了。我觉得没有必要，你卸人一只胳膊，到时把自己搞到牢里，何必呢。如果网上曝光，固然能让领导很狼狈，但是你自己也成了公认的刺头，以后哪个单位敢招你，你还在这行干得了？


    后来，L还是忍气吞声主动离职，然后到某名校读硕士去了。


    我认为，碰到这样的事情，任谁都会很生气，都会有想报复的欲望。


    但问题是，报复了，又能怎样呢？能让自己往后过得更好吗？


