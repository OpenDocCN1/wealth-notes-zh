    # 北京律师回农村种地


    在新疆调研，遇到一个种棉的农民，就叫 A 老板吧。极飞的朋友告诉我们，A 老板是中国政法大学毕业，原来在北京当律师的，后来被父母叫回家来种田。


    在新疆的阳光照射下，A 老板已经皮肤黝黑，完全是农民风范，看不出一点律师的样子。他见到我们就递烟，而不是名片，这也是典型的农民做派，而不是律师。


    他告诉我们，本来在北京待得好好的，因为老家的父亲生病住院，父母要他回来照顾。当时他还有点犹豫，但是家里说，你要是不回来，就见不到最后一面了。他便舍弃了北京的事业，回到家乡。


    本想好在家里种一年地，等父亲好了或者去了，再回到北京干老本行。没想到这一干上，就越来越脱不开身了，干脆就成了农民。


    我们在的是巴音郭楞州库尔勒市尉犁县，这是中国产棉大县，当地主要作物就是棉花。A 老板种植了一千亩棉花。


    由于有知识有文化，A 老板种棉和当地其他农户就不同。他会去研究怎么种得更好，让产量更高、品质更佳、成本更少。


    极飞的朋友说：我接触过那么多棉农，A 老板是唯一个可以把每亩田的成本精确计算到个位数的。


    A 老板对现代科技也持完全开放、拥抱的态度。极飞的无人机打药服务推出后，A 老板是首批用上的人。我们去他的棉田调研时，A 老板指着地内采棉机采得不仔细而掉落的棉球，痛心疾首地问极飞老板彭斌说：彭总，你们什么时候才能开发出
    AI+视觉识别的捡棉机呢？这个太浪费了，我就盼着你们的 AI 出来呢。


    我们算了一下 A 老板的收入，发现他这一千亩地，一年的利润可以达到 150-200 万之间。朋友告诉我们，A 老板家的院子，收拾得非常好，现代化设施一应俱全。他有两台车，一台是宝马
    X7，另一台也是差不多级别的。


    不过，也不是每年都能有这么好的收成。2018 年新疆风灾，棉花下地之后，就被 10 级大风刮走了。等风停了再补种，过两天又被刮走了，前后种了四次才种下地，结果因为误了期，收成大受影响。那一年，90%的棉农都没有赚到钱。'
  - '[PAGE 180]


    今年是个大丰收年，棉花产量和质量双高。A 老板判断丰收可能会导致棉价不高，就以较低的价钱卖掉了。结果今年因为和澳大利亚及印度的贸易摩擦，停止从这两个产棉大国进口棉花，新疆棉的价格高企，A
    老板至少损失了 20% 的收入。


    谈起这事，A 老板叹息说：谁能想到我一个农民，还需要去研究国际关系呢？


    从 A 老板这里，我们看到，有知识的人去种田，其实是很 有“钱”途的。而且农活有季节性，收获完了以后，有几个月的时间都是空闲的。当地农民就会四处旅游或者窝在家里过冬。


    当然，干农活也确实很苦，很累。而且有自然灾害或价格调节的影响，这也算是有得必有失吧。'
