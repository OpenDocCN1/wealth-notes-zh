    # **商业研究与商业实践**


    在昨天发的公众号文章中，我说了一句，欢迎大家加入星球，你也可以跟文中说到的那位星友一样和我讨论你的商业问题。


    有人很搞笑地评论说：和你讨论？你要是能做一年几百万的生意的话，怎么可能还在这儿做自媒体？


    这种无知，其实是很多人面对咨询行业很有可能会产生的一个误区。


    首先咱们且不说一年几百万的生意并不算什么，我下海创业第 1 年做咨询，我们的营业额就接近千万。但是这个问题的关键不在这儿，而是在于商业研究对商业实践到底有没有作用；或者说只做商业研究的人，有没有资格对商业实践的人提出一些有用的建议，或者给予一些启发。


    咱们星友群里，生意做到几亿甚至十几亿的人很多，从商业实践能力上来讲，我是很佩服他们的。但是一个人商业上的成功，原因有很多种。有可能是他眼光好、有可能是他胆量大、有可能是他运气好、有可能是他资源足、有可能是他运营能力强、有可能是他特别会忽悠、有可能是他人品超级好、有可能是他的技术非常先进……


    但不管怎么说，一个人再厉害，终究有他的不擅长之处，更是有可能在某些问题上存在一些盲点。这时候，商业研究对于企业家的作用就非常之大了。


    吴春波跟彭建峰他们帮助任正非一起创立了华为基本法，陈春花给腾讯梳理了“科技向善”的新的企业文化，科林斯向贝佐斯普及了飞轮效应的概念，李想带着汽车之家的员工一起共读《基业长青》，俞敏洪因为王明夫的点醒才开始明晰新东方的股权和谋求上市，中国有很多最顶级的大佬和投资人都会看何加盐的文章……


    上面这些例子都说明，在真正的牛人看来，他们知道自己有不知道的东西，知道要向那些在商业实践上不如自己的人去学习。


    当然，商业研究的人自己也要明白自己的局限。有很多人理论研究做得特别好，用于指导实践也非常厉害，但是他自己做却未必能做到。这有可能是因为他不够魄力，有可能是没有运气，有可能是没有相应的资源，也有可能是他的性格本身就更适合研究，而不是创业。这些缺陷用于商业实践可能是致命的，但是在'
  - '[PAGE 300]


    商业研究上有可能是一个促进的因素。


    所以我们看到像德鲁克、波特、柯林斯这样的人，他们一生并没有做出什么伟大的企业，但是都被称为管理大师，在西方享有崇高的盛誉，影响了无数的企业家。


    中国古代有很多隐世的高人或出谋划策的谋士。他们自己去冲锋打仗或者管理国家未必在行，但是他出的主意、他提的理念，对于那些将军们、皇帝们却有很大的作用。


    孔子说，三人行必有我师。也是每个人身上都有我们值得学习的长处。如果一个人觉得自己很牛逼，觉得别人都不如自己，自己什么都不需要向别人学，那他一定不可能持续地成功。


    咱们退一万步讲，哪怕是一个人觉得自己比别人厉害，没有什么可以从别人那里学的，但讨论本身就可以对他自己的思路有更好的梳理，并且能够了解到别人看待同样问题的角度。


    我之前参与跟微信的张小龙对话，我们这些对话者的层级比他要低很多，对于微信、对于商业、对于产品的了解，我们肯定没有他深，但是我们说的话对他非常有用，他自己都说觉得我们的对话很有益处，以后要多搞类似的对话。


    所以真正的牛人并不介意从别人那里学到更多。只有傻瓜才会觉得这样的讨论没有价值。'
  - '[PAGE 301]


    # 价值观与对外表达——研究快手宿华的一个感受


    这两天在研究快手的 CEO 宿华，感觉很有意思。由于暂时掌握的资料不够，别的我先不讲太多，讲一讲我现在感受很深的一个点吧。


    在快手以公司名义（作者名写的是“快手研究院”）出版的第一本书《被看见的力量》扉页，宿华写的这么一段话：注意力是互联网的核心资源，我们希望尽量让更多的人得到注意力，提升每个人独特的幸福感。


    这句话粗看没什么，细看就感受到其表述的高明之处：我们的目的是帮助更多的创作者得到注意力，而不是为自己的公司获得更多的用户。


    这两者的外在表现其实是一样的，都是会表现为产品的使用人数增加，或者每日活跃用户增加。但是内在的追求却非常不同。一个的着眼点是让每个创作者如何更好的触及并吸引观看者；另一个的着眼点是如何把更多的人搂到我的平台。这种细微的区别，在设计公司的
    OKR 或 KPI 时，会导致两个不同的方向，最终表现为行为上的巨大差异。


    宿华曾经说过这样一段话：生活没有高低，人人都值得被记录，人人都值得被记住。我希望我们做的事情是 100 年以后、1000 年以后还有价值的东西。我留下来的东西是给几百年以后的人看的，因此我没有那么在乎当下的得失。我更在乎长期的价值。


    他认为，平台最大的能量是注意力分发，这中间怎么体现你的价值观。也就是说，平台聚合了那么多用户，我让用户看到什么东西，这背后的决定，是价值观在起作用。


    不过，在快手的具体运作中，曾经出过巨大的价值观问题。很长时间以来，快手给人的印象就是低俗、土味。2018 年，快手上出现了很多未成年妈妈的视频，这引起了巨大的社会批评，连央视都做了专题。


    后来宿华发表了一封公开信道歉。其中说到：我一直在反思，我们做快手社区的初衷是希望让每一个人都有能力记录自己的生活，每一个人都有机会被世界看到，从而消解每一个人的孤独感，提升每一个人的幸福感。现在看起来，我们做得不好，社区发展在一定程度上偏离了原来的方向。如果社区发展不能遵循初心，一切会变得没有意义。社区运行用到的算法是有价值观的，因为算法的背后'
  - '[PAGE 302]


    是人，算法的价值观就是人的价值观，算法的缺陷是价值观上的缺陷。


    这段话和抖音创始人张一鸣曾经说过的话截然相反。张一鸣曾经在接受记者采访时表达过类似“算法是没有价值观的”观点。他说“媒体是要有价值观的，它要教育人、输出主张，这个我们不建议。”


    所以后来，实际上抖音面临的各种争议、批评曝光和处罚是比快手要多多的。


    这两点确实是观察两家公司的一个很好的点。


    当然，我们不能肯定一个人表达出来的价值观是不是内心真正尊崇的价值观。听其言之后，还要观其行。如果快手做的一切真的是与其宣扬的价值观符合，我们才能说他才是真诚的。


    但我觉得，对外表达一个好的价值观，起码会告诉所有人，我有这个价值观，并且愿意为之缴纳投名状。这比那些红口白牙否认价值观的人，要高级得多。'
  - '[PAGE 303]


    # # 收税的生意


    我们常听说政府是最好的生意，因为它可以通过收税来获得收入。


    但其实通过收税获得收入的可不止政府，有很多公司只要获得一定的市场垄断地位，都可以通过收税来获得收入。


    举一个最简单的例子，大家知道如果用苹果手机的话，只要是在手机上购买任何服务，苹果都要抽取 32% 的提成。


    例如知加盐的知识星球，老会员续费是 288 元，但是知识星球会抽成 20%，如果用苹果手机支付的话，苹果还要抽走 32%，所以到知加盐这里的只有 138 元。


    好在用苹果手机支付的人占比不是很高，要不然的话，做一个星球对于星主来说，从商业上实在是太不划算了。


    作为普通消费者，我们可能是不知道苹果收这么高的税的，所以对于苹果的贪婪没有什么感知。但是你只要是开发过 APP、小程序或者开通过网络收费的业务，你就会对苹果无比痛恨。这都不叫雁过拔毛了，这叫雁过砍腿啊。


    那么苹果为什么有底气这么蛮横呢？因为苹果手机的用户太多了，而且对于忠粉来说，苹果手机无可替代。你要是想针对这一部分用户去开发服务的话，就得忍受苹果的这个税率。所以所有
    app store 的开发者，不得不无条件地给苹果上供 32%。


    当然像苹果这么恐怖的税率倒是不多。我们交的比较常见的税率是微信支付的税。我们在网上购买任何东西，如果用微信支付的话，商家都要支付 0.6% 的支付手续费。做过拼多多商家的都知道，拼多多本身是没有平台费的，但是它会代替微信收取
    0.6% 的手续费。


    像拼多多这样零收税（至少表面上）的企业是极其少见的。淘宝好像是 2.5%，这一点在淘宝开店的朋友们可以确认一下是否准确。


    那么像拼多多这样不收税的平台是怎么维持收入的呢？其实它收的是隐性税。因为平台商户那么多，给你卖同样产品的竞争者无数，而谁能在首页就有销量，上了首页的销量是极其有限的，因为没有哪个消费者会一直往下翻再买一个东西。


    当然拼多多的千人千面推荐机制，会稍微缓解一点商家无法触及消费者的障'
  - '[PAGE 304]


    碍，但如果你想卖的更多，那就必须得向平台购买广告位了。所以他收的实际上是广告位置的税。


    在线下也有很多生意都是这样。我们都说香港是李家的城，因为李家控制了很多基础民生的东西，例如电信、水利、电力、商场、超市、便利店等等，你只要是在香港生活，就无法避免向李家交税。


    当然，我们写这篇文章不是说要批判这种现象，而是分析这种现象，看看有没有什么可以借鉴之处。


    能够做成收税生意的关键，是你的生意是用户必不可缺的，或者用户的转换成本极其高的。如果客户随时可以用一个别的东西来替代，那就没有办法收税了。


    内容创作者和忠诚用户之间，明星和粉丝之间，其实也可以看作是一种收税的关系。只不过这种是用户自愿缴纳的。


    凯文凯利的 1000 个忠实用户的说法，可能很多人都听过。他的意思是一个内容创造者，其实不需要很多的忠诚粉丝，只要有 1000 个，就能维持一种体面的生活。


    这 1000 个忠诚用户，只要每年拿出年收入的千分之一给创作者，就可以让他过上平均的生活，如果拿出千分之五，就可以让他过上 5 倍于常人收入的生活。


    1000 个忠实用户，这种说法影响了很多人，诱使很多人走上了内容创作的道路。但实际上也是很有误导性的，因为要做到 1000 个愿意持续付费的忠诚用户，实在是太难了。


    大家不妨用收税生意这个思路，来看一看你你自己的生意，有没有收税的特征，或者有没有做到至少部分收税的可能？如果能够创造吸血的条件，那么生意的可持续性和稳定性就会极大的提升。


    当然我希望任何时候咱们考虑商业模式的时候，不要像苹果那么敲骨吸髓般的贪婪。'
  - '[PAGE 305]


    # 要不要打疫苗？


    今天有朋友在询问要不要打疫苗的问题。我想可能挺多朋友会有这方面的疑问，尤其是现在一些体制内的朋友，上面在推行集体打疫苗，自己可能会犹豫到底要不要打。


    所以我专门写一篇文章说一说我个人的观点。文章仅供参考，最后打不打还是要求根据自己的情况来决定。


    首先我们从宏观上来看，未来肯定都是每个人都要打的，如果不打的话，估计你的码会有一些区别，会影响到你出差，进宾馆酒店、机场地铁、商场学校等地方。


    这个时间我不知道会有多久，但未来估计大概率会往这个方向走。


    其次我们从疫苗本身来讲。现在新冠疫苗已经打了几千万剂（这还是 2 月份的数字，现在估计已经上亿了）了，没有出现过什么恶性案例。从这个概率上来讲，我们基本上不需要去担心。


    其实在国外，尤其是中东和南美，有些政府要员或者大亨巨贾，都在争取一切机会，优先注射中国疫苗。甚至欧洲有很多富豪和政府官员、王室成员还专门跑到阿联酋去打中国疫苗。因为他们内心清楚，中国疫苗的安全性是可靠的。


    有一些朋友可能从以往的一些新闻中得到印象，就是觉得中国疫苗可能不安全。其实过往新闻我也都看过，以前还专门写文章分析过，所谓的不安全主要是两方面的问题。


    第一方面是打疫苗之后的偶发耦合成情况。


    这是什么意思呢？就是我们人正常也会生病，甚至有些人会病死，就算是不打任何疫苗也可能会发生那个事情。


    由于很多疫苗的接种范围是极其广的，尤其是小孩，每个小孩小时候都要打很多的疫苗。那么必然就会存在有一些生病是刚好在打完疫苗之后出现的，而且从这么大的数字上，这种案例一定是非常多的。这时候做为家长自然就会去怀疑，是不是因为打了疫苗才生了这个病？


    实际上经过很多次的调查，类似这样的案例出来之后，都无法证明跟打疫苗有什么关系，仅仅是一种时间上的耦合。'
  - '[PAGE 306]


    但我们也不能说一例都没有，毕竟每个人的身体情况不同，有可能某个人的身体就跟那种疫苗不吻合。只是从概率上以及实际统计出来的分布来看，这种可能性太小太小了，跟我们去打疫苗获得的收益相比的话，可以忽略不计。


    第二种情况是以前也出现过一些疫苗作假，或者是传输链上被污染出现的问题。我们不能说这种情况一定没有，但是这种事情从政策上是极度严厉打击的，被抓住的话，涉案人员一定会赔得倾家荡产，牢底坐穿，甚至有可能直接上死刑。国家也采取了各种各样的措施来防止这样的情况出现。


    所以这么多年来，我们看到其实中国造假疫苗的人是越来越少，也越来越难了。现在只要是在正规渠道去打疫苗的话，出现这种问题的概率也是很低很低的。


    从新冠疫苗来看，现在接种了几千万到上亿的规模，尚未出现这样的问题，我们可以认为，疫苗出现严重不良反应或者遇到假疫苗的可能性，是极低的。


    当然有些朋友可能会认为实际上出现了问题，但是被压住了。我不能完全否认这种可能性，但是我自己是 不信的。因为作为这样一个全国瞩目的问题，如果有人敢在这上面作假或者掩盖问题，成本太高，难度太大了，风险完全不可承受，得不偿失，没有必要。


    最后我们从个人的角度来看一下。打疫苗其实是对自己和家人的最大保护，尤其是需要经常跟外界接触的人，更是如此。


    虽然中国整体的防疫做得非常好了，但是毕竟我们不能完全隔绝跟国外的交流，所以我们也可以看到零星的各地还是有一些输入性的感染案例出现。


    从经济运行的需要来讲，未来一定是会放开国际交流的，每个人感染的风险都会比现在高很多，到那个时候，其实打上疫苗就是多了一层防护罩。


    如果安全性没有问题，那么打不打，其实就是一个个人认知和个人意愿的问题。从现在的情况来看，有机会免费打疫苗，实际上是一种莫大的福利。我们也看到有一些网上的攻击，说凭什么体制内可以先打？


    我听到我的前单位有些同事被安排去打疫苗了，我的感觉是非常羡慕，同时自己也在期盼着社区能够早点安排。如果我们这边通知，我肯定是第一时间跑去打。


    所以如果大家征求我的建议，我会说：越早打就越好，如果有这个机会，一定要打。'
