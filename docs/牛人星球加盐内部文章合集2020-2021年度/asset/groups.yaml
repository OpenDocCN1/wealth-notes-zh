    当然，总体而言，你这里列举的只是少数几个，你还需要多看看其他的职业。考虑的方式也是类似我上面说的两个标准：1. 是不是真的喜欢，如果一天到晚的做还会不会喜欢；2.
    你有没有好的业务拓展渠道和思路。


    # 提问 13：


    何老师！本人 29 周岁，2 年销售经验，5 年在部队医院工作。现在刚回老家，面临选择，要么自己创业，要么打工赚钱。我自己的意见是自己创业，但是创业前期没有稳定收入，经济压力就很大。家人也不理解，都想让我找个工作先干着。真心不喜欢再浑浑噩噩过日子了！何老师，鼓励鼓励我把♡'
  - '[PAGE 364]


    答：


    你好。首先，我是一贯赞同创业，赞同大家按照自己想做的事情去做的。但是，我也曾说过，一定要最大风险可控。同时，要取得家里人的支持。


    在你这个情况里面： 第一个要考虑的是家庭经济能否支撑。


    你先要算一下家里的存款多少，每月花销多少，如果你在创业期间暂时没有收入，家里在生活水平不下降的情况下可谓维持多久。如果创业半年、一年或两年（具体时长看各人风险偏好而定），哪怕是一事无成，家里的生活水平都可以不受影响，那么不妨试一试，大不了到时再回来找工作。做销售找工作还是相对容易的。


    第二个要考虑的是创业选择什么方向。


    你有没有已经选好的方向？有没有做过深入的调研？有没有网上查过，找人问过，自己亲自体验过？调研下来这个项目是不是真的有前途？需要你投入多少资本？你还缺哪些技术和人员，要补上这个缺口，你有没有相应的办法？如果这些都没有想过，只是有创业的想法，我建议还是缓一缓。一边工作，一边想明白这些问题再说。


    第三个要考虑的是家里是否支持。


    我们创业既是为自己，也是为了家里的幸福。如果因为你创业，反而搞得家人不开心，你和他们的关系闹掰，那就得不偿失了。如果你真心想要创业，就一定要取得他们的全力支持。这就要你去想一想怎样才能说服他们了，是以情动人，还是以理服人，还是以利诱人等等，这个要你来综合判断那种办法最合理，最能打动他们。


    # 提问 14:


