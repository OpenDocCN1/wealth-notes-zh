    # 提问 22:


    何老师，您好！想请您给指条明路。


    情况是这样的我目前做的是传统的林业规划设计行业，14 年大学毕业在行业体制单位做外聘一直工作到 18 年，体制改革不再用外聘。然后自己开了个公司，慢慢发展到十多个人，可是好景不长公司逐渐衰落，到如今又只剩我一个人了。公司两年的时间也签了不少的项目，可多数项目的来源是靠以前的老同事给介绍的，只有少数是靠自己找来的。我思考了之后发觉造成如今的局面主要是因为：1.
    自己以一个技术员的思想去开公司，全凭一腔热血，根本不懂怎么管理和经营。2. 对于和人打交道，人际关系，利益输送那一套自己就是一个小白，这些恰好也是拿到项目的关键。对于这一点不管以后还开不开公司我都想突破，说实话我真的很羡慕那些健谈、能娴熟应对各种交际的人和说话办事送礼都恰到好处没有一点违和感的人，就是不知道该从哪里开始学习。对于传统行业，像我这样一个技术员想要有项目，不会这些不知道还有没有什么新路子？我
    现在所困惑的是：继续守着公司寻求突破，可是又不知道该如何突破？去同行的公司上班，心里又有一些不甘？


    何老师，我现在应该怎么办？ 何老师，不好意思，写的有点乱。期待您的回复。


    答：


    对于初创公司来说，业务开拓，是公司生存最重要的事。没有业务，再好的技术、想法、团队都白搭。


    你的起点其实很好，因为一开始创业就有老同事介绍项目，这已经比绝大多数创业者要好得多。


    但是确实，从长远发展来看，业务开拓能力是一定要提起来的。


    可以从三个方面着手。


    第一是把现有项目做到完美，把客户维护好，争取尽可能高的续单率。你前两年有很好的业务流量，其实是很好的机会。如果这些客户都能维护好，有较高比例的续单量，那么维持一个小团队，其实都可以了。


    有很多小公司，就是靠着少数几家大客户的不断续单，生存得很好。


    当然，这个要看不同行业的情况。有的行业，项目的特征就是一锤子买卖，没有续单的，那就另说。'
  - '[PAGE 373]


    第二是重新开拓原来的老客户，争取老树发新芽。以前的客户都是你已经打过交道的，本身就是熟人，比陌生人更容易拉近关系和形成合作。你有很好的理由去加强接触，例如项目回访、售后服务。哪怕就是加强感情联络都行。


    这个有一个前提。就是你之前做项目的时候，没有给对方留下特别不好的坏印象。如果你前面的项目做得太差，让对方蒙受损失或脸上无光，那对方就很难再信任你。或者你之前不会做人，得罪了对方，现在要捡起来也比较困难。


    第三是加强新客户的拓展能力。这个是比较难的，但是也是公司未来如果想发展壮大，必须具备的。


    这个有三个方向可以考虑：


    第一是自己提升开拓能力。这需要突破自己原来的性格和能力局限，也需要较长时间培养。但却是最踏实的。创业者本身本来就应该是最大的业务员。只有如此，公司发展才稳定。


    第二是找一个很厉害的业务合伙人。你专攻技术，他专跑业务。这样你最省心。但是要让出较多的利益，例如给他较大比例的分成。有些情况下利润甚至要五五分，极端情况下甚至他多你少都有可能。另外一点，这个可能不大稳定。如果在你们这行，技术并没那么重要的话，他很可能随时踢掉你另外找人合作。


    第三是发展“代理”或“分销”模式。就是你和别人合作，别人介绍项目给你，你给他提成一定的比例。例如你的老同事，每成交一单，他都能提成百分之多少。如果你能发展很多这样的代理人或分销商，那么你的业务也不用愁。需要注意的是，这里可能存在灰色甚至黑色地带。例如，如果代理人是公职人员，可能就存在行贿受贿的风险。


    关于你个人何去何从，还需要你自己根据你的能力和愿望而定。如果你觉得业务开拓能力能够提升（不管是上面我写的三个方面的哪一方面），那么就可以继续把公司做下去，甚至做大。如果这方面看不到希望，那么就只能去同行公司先上班了。


    # 提问 23:'
  - '[PAGE 374]


    请问何老师，我是内心敏感的人，想发朋友圈和写文章，但又各种担心。关于发朋友圈恐惧心理怎么破呀？ 1. 担心老板、领导看到，发与工作无关事情，他们会认为你不务正业。领导有些小气。2.
    担心同事、朋友看到，也会嘲笑和议论。3. 别人不点赞，不理睬等。4. 害怕被批评和被议论，感觉这种心理已经影响了职场进一步发展。请怎么提升和克服这种心理呀？


    # 答：


    我觉得这个问题分为两个层次。


    浅的层次是从发朋友圈或文章本身来说：发还是不发？发了如果有上面担心的后果怎么办？


    这个问题其实很好解决。你发的时候，设置“仅自己可见”就可以了。或者设置分组，让自己不想看的人看不到。但是如果你又想尽可能多的人看到，那后面四种担心，确实可能会出现，而且是你必须要承受的。那就要看你是不是愿意为了发朋友圈或文章，而承受那些可能的风险。如果你评估了自己可以承受，那就发，如果评估自己不可以接受，那就不发。


    深的层次是：当我们面临内心的渴求和外界的评价之间的矛盾时，应该遵从内心，还是应该屈服于外界压力？


    这种矛盾会存在于每一个人。我们想要随心所欲地去做自己想做的事情，但是又总会担心外界的反应会如何。


    解决这个矛盾，需要让自己变得强大。一是内心的强大，二是实力的强大。


    我们先看内心。


    如果内心足够强大，外界的评论的影响就会变小，甚至对你可能完全没有影响。


    这种内心强大，一是要从认知上来解决。我们要知道，人和人是不同的，每个人看问题的角度是不同的。甚至别人有可能会因为价值观或利益的冲突，而说出让你不爽的话，做出让你不爽的事。我们要知道，世界并不必然地要时刻对我们微笑，坏的东西本来就会出现。当坏的东西出现的时候，你直接无视就好了。二是尽管认识到了，还是要经过现实的捶打磨炼。当你经历得多了，就会觉得无所谓了。'
  - '[PAGE 375]


    这就好比何加盐发文章。我事先就知道有些评论可能会很负面，刚开始也会因为这些而不爽。但是多了以后，就无所谓了。直接不管就是。


    再来看实力。


    当你在才华、名气、金钱、权势等方面有了足够强大的实力以后，一方面，外界对你的友好程度会大幅增加。你的老板、领导会更照顾你的情绪，尊重你的行为，外界也会更认同你的做法。另一方面，你自己也会具有足够的自信，来坦然面对外界的评论。
    所以归根到底，你还是要磨炼自己的内心，强大自己的实力。


    希望你能够有勇气遵从自己的内心，不要被无谓的恐惧和外界的评价所束缚。能够遵从内心，才是真正的，最大的自由。


    # **提问 24:**


    何老师您好，最近有个疑问想咨询下您。 我二本毕业，专业土木工程，背景十八线开外小山沟。2020.7 毕业入职中国建筑某工程局，在深圳某工地工作，做个小技术员。
    工地流动性太强，以后升职还是待在工地，这个点是比较反感的，不希望以后一直孤苦伶仃待在工地。 想换个赛道，但又不知道去哪，因目前自身没啥特别竞争力，何老师有啥建议么？对于换哪个赛道，或者未来规划之类的？


    答：


    我以前是做企业咨询的，也给一些房地产公司和建筑工程公司做过咨询。据我所知，土木工程专业出身的技术工还是很吃香的，工资上涨挺快，在公司也都挺受重用，跳槽也很好跳，随便到哪都有人要。主要原因是现在还处于技术工稀缺的状态。


    所以从职业发展和收入这一块来讲，我觉得你目前的工作还是挺不错的，关键是怎么样钻研好技术，拿到该拿的证书，把现有的工作做好，人脉关系处理好。 假如说你确实是对这个工作环境非常的厌恶，想要切换赛道的话，从现实情况来看还是比较难的。


    我的建议是两个选择：'
  - '[PAGE 376]


    第一个选择就是爱你所干。多想一想这个职业对你的好处，跟周边的人关系处好一点，工作做好一点。和年纪比较大的技术员们或者领导多聊一聊，也许你会发现这份工作有一些你平时忽视的好的地方或者值得你留恋的地方。


    第二个选择就是切换赛道。这种情况下的切换赛道，一定要确保的一点，就是自己换的工作必须是自己所爱。


    如果是选第二个的话，对你来说最关键的就是好好想一想你到底喜欢什么？如果不先弄清自己的兴趣、爱好、梦想，贸然就行动的话，第二份工作也会跟你现在的工作一样的，一定会有令你不满的地方。到时候你还是会想再换的。


    我们如果切换赛道，就一定要一劳永逸地解决之前的问题，不能说改完之后原来的问题还存在，那就没有任何意义了。


    所以你要先问一下你自己，这么多年有没有过令你怦然心动的工作或者行业？你自己有没有虽然不赚钱，但是一直坚持的爱好？或者有没有从小都梦想着，但是因种种现实条件没有办法去做的事情？


    如果有得话，你可以在工地工作之余，把自己的时间投入到这方面，锻炼自己，在你喜欢地方的打造一技之长，然后凭这一技之长去找一个工作，在那个工作里把自己锻炼成专家。


    这个新的赛道只能由你自己问自己的内心来寻找，别人是帮不到你的。


    可以参考两篇文章：


    《迷茫时的三个选择，决定了人生的高度》、《人生与事业道路选择的五个层次》


    # 星友补答：


    我从 2002 年开始从事土木工程类专业，施工、监理、业主都干过，我想我应该有资格来说几句。


    工程行业有个主要的三个单位有以下区分：


    其一：


    +   1. 施工单位，也是最底层的单位，缺点就是处处看监理、业主脸色，必须时刻低头做人。优点是可以学的东西很多，对于大学毕业不久的人员，测量、预算、安全管理知识、投标文件编制。这些都要用心去学。施工单位又分为大'
  - '[PAGE 377]


    工程局，比如中铁、中建、中水等。无论是那个工程局，做的标书都属于一流的，这个很值得学习。小施工单位就别呆了，很多小施工企业老板都是包工头出生，自身的利益高于一切，除非那个老板有做企业的愿景，也愿意相信你。


    +   2. 监理单位，在大监理小业主的时代（2000–2010 年左右），监理单位权力很大，有签字、签章权。现在业主基本上学精了，不会下很多权利给监理。监理单位现在处于高不成低不就的状态。当然其中也有特例，二滩国际监理和国家电投下属监理是我从业这么多年见过最专业、最靠谱的监理单位。从总监到监理员，基本上每个人对专业化程度较深。


    +   3. 业主单位，分为两种。编制内和编制外。只要能进入编制内，混吃混喝养老等死是最好的选择。如果你也没什么梦想，在业主单位混个正式编制，还是很不错的。


    # 其二：


    +   1. 搞工程职业资格证书很重要，现在大城市的一级建造师吃香的专业光挂个证出去，一年都奔小康（5–8 万元左右），更别提电气工程师、造价工程师、岩土工程师等证书了。


    +   2. 职称很重要，毕业 1 年可以搞个助理工程师，然后是中级职称、高工、教高。中级之后都需要独立写论文，当然你也可以请抢手。这个越早拿到越好。


    # 其三：


    +   1. 工程类人员离婚或者分手的概率要高于其他行业，因为一年四季你很难回到家。有些大企业，打着中字头的招牌到处骗人，招生的时候和你说：有双休、有假等等，那些都是骗你的。搞工程的人基本没有周末，没有节假日，没有加班工资。


    +   2. 搞工程的还要能出入各种场合，比如夜总会、洗脚城等。不是你喜不喜欢去，而是你必须去。家庭这一块要提前做好工作，免得媳妇、女朋友闹腾。


    # 最后的建议：


    +   1. 先在施工单位学到技术，到年限了就去把职业资格证书考了（一定要考），起码把中级职称搞到手。


    +   2. 把自己定位好，学施工也好，学做标书也可以，都要钻研透。'
  - '[PAGE 378]


    +   3. 以上两点尽量在 30 岁以前搞定。30 岁以后，如果你想多挣钱，就一定要当项目经理。如果你图安逸，跳槽个本省市的业主单位。


    # 提问 25:


    现在网络上好多付费课程，请问付费学习，真的值得么？怎么划分界限？


    答：


    首先付费课程是很值得学习的。因为它们能帮我们节省很多的时间。那些东西如果我们自己去摸索或者是通过免费的方法去学习的话，会耗费大量的时间精力，而且有可能走弯路。别人帮我们总结出来了，我们付点费就学习，这是很有帮助的。


    但是其次，现在的付费课程太良莠不齐了，所以要很精心地选择。有很多课程是骗子课程，割韭菜收智商税的。所以选择课程的时候，一定要选择那些已经经过了很多人验证，而且评价比较好的课程。总体来说，得到是一个相对比较靠谱一点的平台。例如上面梁宁的课，万维刚的课，都还是挺有用的。当然也有一些未必对每个人的适用，这个你可以去试听一下，每门课的前
    5 节都是免费的。


    另外除了付费内容以外，B 站上有很多免费的内容，还有一些慕课平台，包括学习强国，都有特别好的课程，可以去那上面找一找。


    # 提问 26:


    何老师您好，想请教一个关于如何正确阅读的问题。


    平时在阅读中总会遇到一些让自己有启发的信息。


    +   1. 你是怎么处理这些有启发的信息的？


    +   2. 怎么样才能让这些有启发的内容真正为我所用，从而改善自己的工作和生活呢？


    比如说我看完您的《持续进化》一书，有很多观点和内容都很冲击着我旧有的观念。


    对我有比较有启发的内容：


    +   1. 乡土思维“七宗罪”。我会提醒自己在生活中做决策要避免犯这样的错误'
  - '[PAGE 379]


    2. 二八法则。要把主要精力放在最重要的事情上，而不是在所有的的事情上平均用力等等


    困惑的点在于：


    有时到了实际的生活场景当中，有些点明明提醒过自己的，关键时刻却想不起来了，导致又犯同样的错误。


    答：


    这个问题涉及到两个点：第 1 个是研几，第 2 个是知行合一。所谓研几，就是平时自己各种机缘巧合下碰巧想到的感兴趣的，或者对自己有用的问题一定要继续研究下去。可以立马用手机记下来，把自己的所思所想，用录音或者文字的方式把它记录一下，如果有时间的话可以扩充成一篇小短文。


    很多好的文章，好的思想，好的发明创造理论创新，都是这种方式完成的。如果有灵感没有及时记录，很快它就跑掉了。


    实际上我的很多文章包括认识星球的文章，都是因为想到某一些点赶紧记录下来，才扩充成文的。


    而知行合一，这一点就比较难了，它也是困扰无数人，甚至很多超级牛人的一个东西。王阳明的心学，其实整个都是在解决这样一个问题。


    这里面可能有两个点。第 1 点是没有真正地知，所以没有办法行。也就是你对于自己有所感触的地方，还没有完全想明白，包括它是什么道理，对自己的生活有什么用，自己要怎样能去做？有可能你只是有所触动，然后就把它放过去了，并没有真正的想去把它应用在自己的生活当中。


    王阳明就一直认为世界上没有先知后行，或者说知而不行。所有的不行，其实就是因为不知。所以他说 的知行合一，不是说知道了之后再去行，还是说知本来就是行行，本来就是知。


    但我们不是圣人，没有办法做到他那么厉害的知行合一。所以有很多时候我们也可以认为我们确实知道了道理，但是却没有能够把它在现实世界中执行。


    这个有时候是因为自己没有形成良好的习惯，它需要较长的时间才能做到，所以慢慢来没关系。'
  md: '

    ## 答：


    在这种人生重大关口，如果要选择换一种活法，一定要先想得非常清楚才行。


    有一个必须注意的原则：我们如果要改变，不是因为想要逃避，而是因为有更大或更好的梦想要去追逐。


    如果只是想逃避的话，最终你会发现，兜兜转转又回到了原地。虽然你可能换了一个工作岗位或者工作单位，但是原来困扰你的那些问题并没有解决，它们早晚还是会回来找你。


    所以，如果你选择的新的路子，并不解决根本问题的话，换和不换，其实没有太大的区别。如果要换，就一定要能够彻底解决当前困扰你的最核心的问题。


    具体到你的情况，我建议还是先保住国企的位子。但是同时利用业余时间，做自己想做的事情。但前提是要真正投入热情和精力，让自己能够看到成果，然后再动。


    最关键的：要确立自己的初心，是为了理想，而不是为了逃避生活的磨难而选择走另一条路。


    ## 提问 19：


    何老师，双节快乐～ 假期期间有空，把之前星球没来得及看的文章都看了看，看到《人生战略，从规划到实施》，我觉得大受启发，很高兴自己正在路上，但有感觉还差点什么。


    其中关于自己部分，我很认可“我是谁”比“我要去哪”和“怎么去”重要一万倍，但我绞尽脑汁，感觉对自己的认识还是很系统清楚，感觉对自己的感觉还是太主观。


    请问老师，关于对自己的认识，有没有什么好的方法去系统的梳理与整理～


    ## 答：


    “认识自己”，既是特别重要的问题，也是特别难的问题。从古至今，它困扰了多少人，甚至是最著名的哲学家，也未必能回答好。


    说老实话，我自己也不敢断言，说我有一个很好的系统方法，能帮助别人认识自己。虽然我也总结过一些方法，但是毕竟效果因人而异。而且真正影响过多少人，帮助过多少人找到答案呢？我自己也是不确定的。


    我的感觉是，它应该和你内心深处最大的渴望和最深的恐惧有关。你可能需要想一想自己最渴望的是什么，最恐惧的是什么。这两个问题不能浮于表面，而要逐层深入。例如，你说我最渴望得到别人的认可，这个不是答案。你还需要追问，你渴望的是谁的认可，哪方面的认可？


    你可能会发现，原来你渴望得到的，是来自父母的认可，你最希望他们认为你是一个具有很强的自立能力的人。


    但这可能还不够，你还得追问自己，你为什么这么希望得到他们这方面的认可呢？就这样不断追问下去，也许你会找到一个更深层的答案。


    对于恐惧也是如此。


    所以这个问题的答案，一定是在于自身。每个人可能都有自己不同的梦想和恐惧。而他们实现这个梦想和避免这个恐惧的途径，又各有不同。


    现在市场上有一些“个人教练”（Coach），会帮助个人梳理这方面的问题。但是收费都很高，效果也因人而异，所以要根据自己的情况来决定是否要选择这样的服务。咱们星友群里也有从事
    coaching 工作的，你可以在群里也问一下。


    另外就是，我此前的文章《迷茫时的 3 个选择，决定了你人生的高度》也提到过一些如果找到方向的办法，你可以看一看哪种办法比较适合你。这篇文章的重点其实在文末的注释部分，可以好好看看。


    ## 提问 20：


    何老师您好！我正在读大一，课程不多，专业不怎么样，想问问应该把精力放在哪一方面，重点该学习什么呢？英语？计算机？


    ## 答：


    首先要看你未来想做什么。如果你已经想好了要做的事情，那么与那个事情相关的东西就是你要学习的重点。


    如果你还没有想好未来要做什么，那就选择那些怎么都不会错的事情。例如：


    - 1. 学一些以后工作用得上的技能：演讲、写作、书法、PPT、外语、编程、心理学、经济学、财务管理、企业管理、时间管理、思维导图、广告设计、营销技巧、商务礼仪、着装规范、（女生）化妆……

    - 2. 学一些生活用得上的技能：

    - 3. 也可以学一些纯娱乐调剂性质的技能：吉他、合唱、民乐、素描、插花、跳舞、陶艺、雕刻、剪纸……

    - 4. 还可以学一些有益身体的技能：羽毛球、网球、高尔夫、篮球、瑜伽、滑板、跑酷、游泳……


    不要贪多，先选择其中一两样开始学（1-4 类别搭配，每一个类别只选一样）。


    而且，要学，就沉下心来，学精、学细，争取学一门，会一门。不要狗熊掰棒子，捡起这个丢掉那个。


    ## 提问 21：


    何老师，你平时写作用哪种方式，近期打算开始写点东西，不是用来发表的，像写日记一样，去规划自己的工作，生活，类似于日志及反思，像查理芒格所说希望能在第二天能比前一天聪明一点就好


    ## 答：


    我的写作分为很多种。


    第一种是关于牛人的研究文章，因为要发在公众号上，所以是比较慎重的，要花很多时间来研究资料和组织材料，往往要一周的时间才能写一篇，有时还会很紧，需要连续加班才能写完。


    第二种是研究牛人的感悟，也是发在公众号上。一般也是五千字以上的长文，一篇文章就讲透一个问题。这种也要花两三天时间。当然，在写作之前，可能对那个问题的思考已经有几年或者几个月，只不过是现在把它用文字组织出来。两三天是思考文章结构和语言表达的时间。


    第三种是发在星球的文章。这种就是有感而发，比较随性。往往是看书、做事、与人交往中突然有某个点，就把它写下来。偶尔点子太多，我也会先在微信上自己给自己发一条信息，把关键字记下。等有空的时候再一篇篇写。这种文章写起来就比较快，可能半小时就写好了，一般是
    1200 字左右。


    第四种就是不发在任何地方，就是自己给自己看的了。会记录在微信或者备忘录上面。就是简短的几句话，或者一两段文字。偶尔会发个朋友圈，但朋友圈的字数一般都不多。


    ## 提问 22：


    何老师，您好！想请您给指条明路。


    情况是这样的我目前做的是传统的林业规划设计行业，14 年大学毕业在行业体制单位做外聘一直工作到 18 年，体制改革不再用外聘。然后自己开了个公司，慢慢发展到十多个人，可是好景不长公司逐渐衰落，到如今又只剩我一个人了。公司两年的时间也签了不少的项目，可多数项目的来源是靠以前的老同事给介绍的，只有少数是靠自己找来的。我思考了之后发觉造成如今的局面主要是因为：


    1. 自己以一个技术员的思想去开公司，全凭一腔热血，根本不懂怎么管理和经营。

    2. 对于和人打交道，人际关系，利益输送那一套自己就是一个小白，这些恰好也是拿到项目的关键。


    对于这一点不管以后还开不开公司我都想突破，说实话我真的很羡慕那些健谈、能娴熟应对各种交际的人和说话办事送礼都恰到好处没有一点违和感的人，就是不知道该从哪里开始学习。对于传统行业，像我这样一个技术员想要有项目，不会这些不知道还有没有什么新路子？我现在所困惑的是：继续守着公司寻求突破，可是又不知道该如何突破？去同行的公司上班，心里又有一些不甘？


    何老师，我现在应该怎么办？ 何老师，不好意思，写的有点乱。期待您的回复。


    ## 答：


    对于初创公司来说，业务开拓，是公司生存最重要的事。没有业务，再好的技术、想法、团队都白搭。


    你的起点其实很好，因为一开始创业就有老同事介绍项目，这已经比绝大多数创业者要好得多。


    但是确实，从长远发展来看，业务开拓能力是一定要提起来的。


    可以从三个方面着手。


    第一是把现有项目做到完美，把客户维护好，争取尽可能高的续单率。你前两年有很好的业务流量，其实是很好的机会。如果这些客户都能维护好，有较高比例的续单量，那么维持一个小团队，其实都可以了。


    有很多小公司，就是靠着少数几家大客户的不断续单，生存得很好。


    当然，这个要看不同行业的情况。有的行业，项目的特征就是一锤子买卖，没有续单的，那就另说。


    第二是重新开拓原来的老客户，争取老树发新芽。以前的客户都是你已经打过交道的，本身就是熟人，比陌生人更容易拉近关系和形成合作。你有很好的理由去加强接触，例如项目回访、售后服务。哪怕就是加强感情联络都行。


    这个有一个前提。就是你之前做项目的时候，没有给对方留下特别不好的坏印象。如果你前面的项目做得太差，让对方蒙受损失或脸上无光，那对方就很难再信任你。或者你之前不会做人，得罪了对方，现在要捡起来也比较困难。


    第三是加强新客户的拓展能力。这个是比较难的，但是也是公司未来如果想发展壮大，必须具备的。


    这个有三个方向可以考虑：


    第一是自己提升开拓能力。这需要突破自己原来的性格和能力局限，也需要较长时间培养。但却是最踏实的。创业者本身本来就应该是最大的业务员。只有如此，公司发展才稳定。


    第二是找一个很厉害的业务合伙人。你专攻技术，他专跑业务。这样你最省心。但是要让出较多的利益，例如给他较大比例的分成。有些情况下利润甚至要五五分，极端情况下甚至他多你少都有可能。另外一点，这个可能不大稳定。如果在你们这行，技术并没那么重要的话，他很可能随时踢掉你另外找人合作。


    第三是发展“代理”或“分销”模式。就是你和别人合作，别人介绍项目给你，你给他提成一定的比例。例如你的老同事，每成交一单，他都能提成百分之多少。如果你能发展很多这样的代理人或分销商，那么你的业务也不用愁。需要注意的是，这里可能存在灰色甚至黑色地带。例如，如果代理人是公职人员，可能就存在行贿受贿的风险。


    关于你个人何去何从，还需要你自己根据你的能力和愿望而定。如果你觉得业务开拓能力能够提升（不管是上面我写的三个方面的哪一方面），那么就可以继续把公司做下去，甚至做大。如果这方面看不到希望，那么就只能去同行公司先上班了。


    ## 提问 23：


    请问何老师，我是内心敏感的人，想发朋友圈和写文章，但又各种担心。关于发朋友圈恐惧心理怎么破呀？


    1. 担心老板、领导看到，发与工作无关事情，他们会认为你不务正业。领导有些小气。

    2. 担心同事、朋友看到，也会嘲笑和议论。

    3. 别人不点赞，不理睬等。

    4. 害怕被批评和被议论，感觉这种心理已经影响了职场进一步发展。


    请怎么提升和克服这种心理呀？


    ## 答：


    我觉得这个问题分为两个层次。


    浅的层次是从发朋友圈或文章本身来说：发还是不发？发了如果有上面担心的后果怎么办？


    这个问题其实很好解决。你发的时候，设置“仅自己可见”就可以了。或者设置分组，让自己不想看的人看不到。但是如果你又想尽可能多的人看到，那后面四种担心，确实可能会出现，而且是你必须要承受的。那就要看你是不是愿意为了发朋友圈或文章，而承受那些可能的风险。如果你评估了自己可以承受，那就发，如果评估自己不可以接受，那就不发。


    深的层次是：当我们面临内心的渴求和外界的评价之间的矛盾时，应该遵从内心，还是应该屈服于外界压力？


    这种矛盾会存在于每一个人。我们想要随心所欲地去做自己想做的事情，但是又总会担心外界的反应会如何。


    解决这个矛盾，需要让自己变得强大。一是内心的强大，二是实力的强大。


    我们先看内心。


    如果内心足够强大，外界的评论的影响就会变小，甚至对你可能完全没有影响。


    这种内心强大，一是要从认知上来解决。我们要知道，人和人是不同的，每个人看问题的角度是不同的。甚至别人有可能会因为价值观或利益的冲突，而说出让你不爽的话，做出让你不爽的事。我们要知道，世界并不必然地要时刻对我们微笑，坏的东西本来就会出现。当坏的东西出现的时候，你直接无视就好了。二是尽管认识到了，还是要经过现实的捶打磨炼。当你经历得多了，就会觉得无所谓了。


    这就好比何加盐发文章。我事先就知道有些评论可能会很负面，刚开始也会因为这些而不爽。但是多了以后，就无所谓了。直接不管就是。


    再来看实力。


    当你在才华、名气、金钱、权势等方面有了足够强大的实力以后，一方面，外界对你的友好程度会大幅增加。你的老板、领导会更照顾你的情绪，尊重你的行为，外界也会更认同你的做法。另一方面，你自己也会具有足够的自信，来坦然面对外界的评论。
    所以归根到底，你还是要磨炼自己的内心，强大自己的实力。


    希望你能够有勇气遵从自己的内心，不要被无谓的恐惧和外界的评价所束缚。能够遵从内心，才是真正的，最大的自由。


    ## 提问 24：


    何老师您好，最近有个疑问想咨询下您。 我二本毕业，专业土木工程，背景十八线开外小山沟。2020.7 毕业入职中国建筑某工程局，在深圳某工地工作，做个小技术员。
    工地流动性太强，以后升职还是待在工地，这个点是比较反感的，不希望以后一直孤苦伶仃待在工地。 想换个赛道，但又不知道去哪，因目前自身没啥特别竞争力，何老师有啥建议么？对于换哪个赛道，或者未来规划之类的？


    ## 答：


    我以前是做企业咨询的，也给一些房地产公司和建筑工程公司做过咨询。据我所知，土木工程专业出身的技术工还是很吃香的，工资上涨挺快，在公司也都挺受重用，跳槽也很好跳，随便到哪都有人要。主要原因是现在还处于技术工稀缺的状态。


    所以从职业发展和收入这一块来讲，我觉得你目前的工作还是挺不错的，关键是怎么样钻研好技术，拿到该拿的证书，把现有的工作做好，人脉关系处理好。 假如说你确实是对这个工作环境非常的厌恶，想要切换赛道的话，从现实情况来看还是比较难的。


    我的建议是两个选择：


    第一个选择就是爱你所干。多想一想这个职业对你的好处，跟周边的人关系处好一点，工作做好一点。和年纪比较大的技术员们或者领导多聊一聊，也许你会发现这份工作有一些你平时忽视的好的地方或者值得你留恋的地方。


    第二个选择就是切换赛道。这种情况下的切换赛道，一定要确保的一点，就是自己换的工作必须是自己所爱。


    如果是选第二个的话，对你来说最关键的就是好好想一想你到底喜欢什么？如果不先弄清自己的兴趣、爱好、梦想，贸然就行动的话，第二份工作也会跟你现在的工作一样的，一定会有令你不满的地方。到时候你还是会想再换的。


    我们如果切换赛道，就一定要一劳永逸地解决之前的问题，不能说改完之后原来的问题还存在，那就没有任何意义了。


    所以你要先问一下你自己，这么多年有没有过令你怦然心动的工作或者行业？你自己有没有虽然不赚钱，但是一直坚持的爱好？或者有没有从小都梦想着，但是因种种现实条件没有办法去做的事情？


    如果有得话，你可以在工地工作之余，把自己的时间投入到这方面，锻炼自己，在你喜欢地方的打造一技之长，然后凭这一技之长去找一个工作，在那个工作里把自己锻炼成专家。


    这个新的赛道只能由你自己问自己的内心来寻找，别人是帮不到你的。


    可以参考两篇文章：


    - 《迷茫时的三个选择，决定了人生的高度》

    - 《人生与事业道路选择的五个层次》


    ## 星友补答：


    我从 2002 年开始从事土木工程类专业，施工、监理、业主都干过，我想我应该有资格来说几句。


    工程行业有个主要的三个单位有以下区分：


    其一：


    - 1. 施工单位，也是最底层的单位，缺点就是处处看监理、业主脸色，必须时刻低头做人。优点是可以学的东西很多，对于大学毕业不久的人员，测量、预算、安全管理知识、投标文件编制。这些都要用心去学。施工单位又分为大工程局，比如中铁、中建、中水等。无论是那个工程局，做的标书都属于一流的，这个很值得学习。小施工单位就别呆了，很多小施工企业老板都是包工头出生，自身的利益高于一切，除非那个老板有做企业的愿景，也愿意相信你。

    - 2. 监理单位，在大监理小业主的时代（2000–2010 年左右），监理单位权力很大，有签字、签章权。现在业主基本上学精了，不会下很多权利给监理。监理单位现在处于高不成低不就的状态。当然其中也有特例，二滩国际监理和国家电投下属监理是我从业这么多年见过最专业、最靠谱的监理单位。从总监到监理员，基本上每个人对专业化程度较深。

    - 3. 业主单位，分为两种。编制内和编制外。只要能进入编制内，混吃混喝养老等死是最好的选择。如果你也没什么梦想，在业主单位混个正式编制，还是很不错的。


    其二：


    - 1. 搞工程职业资格证书很重要，现在大城市的一级建造师吃香的专业光挂个证出去，一年都奔小康（5–8 万元左右），更别提电气工程师、造价工程师、岩土工程师等证书了。

    - 2. 职称很重要，毕业 1 年可以搞个助理工程师，然后是中级职称、高工、教高。中级之后都需要独立写论文，当然你也可以请抢手。这个越早拿到越好。


    其三：


    - 1. 工程类人员离婚或者分手的概率要高于其他行业，因为一年四季你很难回到家。有些大企业，打着中字头的招牌到处骗人，招生的时候和你说：有双休、有假等等，那些都是骗你的。搞工程的人基本没有周末，没有节假日，没有加班工资。

    - 2. 搞工程的还要能出入各种场合，比如夜总会、洗脚城等。不是你喜不喜欢去，而是你必须去。家庭这一块要提前做好工作，免得媳妇、女朋友闹腾。


    最后的建议：


    - 1. 先在施工单位学到技术，到年限了就去把职业资格证书考了（一定要考），起码把中级职称搞到手。

    - 2. 把自己定位好，学施工也好，学做标书也可以，都要钻研透。

    - 3. 以上两点尽量在 30 岁以前搞定。30 岁以后，如果你想多挣钱，就一定要当项目经理。如果你图安逸，跳槽个本省市的业主单位。


    ## 提问 25:


    现在网络上好多付费课程，请问付费学习，真的值得么？怎么划分界限？


    ## 答：


    首先付费课程是很值得学习的。因为它们能帮我们节省很多的时间。那些东西如果我们自己去摸索或者是通过免费的方法去学习的话，会耗费大量的时间精力，而且有可能走弯路。别人帮我们总结出来了，我们付点费就学习，这是很有帮助的。


    但是其次，现在的付费课程太良莠不齐了，所以要很精心地选择。有很多课程是骗子课程，割韭菜收智商税的。所以选择课程的时候，一定要选择那些已经经过了很多人验证，而且评价比较好的课程。总体来说，得到是一个相对比较靠谱一点的平台。例如上面梁宁的课，万维刚的课，都还是挺有用的。当然也有一些未必对每个人的适用，这个你可以去试听一下，每门课的前
    5 节都是免费的。


    另外除了付费内容以外，B 站上有很多免费的内容，还有一些慕课平台，包括学习强国，都有特别好的课程，可以去那上面找一找。


    ## 提问 26:


    何老师您好，想请教一个关于如何正确阅读的问题。


    平时在阅读中总会遇到一些让自己有启发的信息。


    - 1. 你是怎么处理这些有启发的信息的？

    - 2. 怎么样才能让这些有启发的内容真正为我所用，从而改善自己的工作和生活呢？


    比如说我看完您的《持续进化》一书，有很多观点和内容都很冲击着我旧有的观念。


    对我有比较有启发的内容：


    - 1. 乡土思维“七宗罪”。我会提醒自己在生活中做决策要避免犯这样的错误

    - 2. 二八法则。要把主要精力放在最重要的事情上，而不是在所有的的事情上平均用力等等


    困惑的点在于：


    有时到了实际的生活场景当中，有些点明明提醒过自己的，关键时刻却想不起来了，导致又犯同样的错误。


    ## 答：


    这个问题涉及到两个点：第 1 个是研几，第 2 个是知行合一。所谓研几，就是平时自己各种机缘巧合下碰巧想到的感兴趣的，或者对自己有用的问题一定要继续研究下去。可以立马用手机记下来，把自己的所思所想，用录音或者文字的方式把它记录一下，如果有时间的话可以扩充成一篇小短文。


    很多好的文章，好的思想，好的发明创造理论创新，都是这种方式完成的。如果有灵感没有及时记录，很快它就跑掉了。


    实际上我的很多文章包括认识星球的文章，都是因为想到某一些点赶紧记录下来，才扩充成文的。


    而知行合一，这一点就比较难了，它也是困扰无数人，甚至很多超级牛人的一个东西。王阳明的心学，其实整个都是在解决这样一个问题。


    这里面可能有两个点。第 1 点是没有真正地知，所以没有办法行。也就是你对于自己有所感触的地方，还没有完全想明白，包括它是什么道理，对自己的生活有什么用，自己要怎样能去做？有可能你只是有所触动，然后就把它放过去了，并没有真正的想去把它应用在自己的生活当中。


    王阳明就一直认为世界上没有先知后行，或者说知而不行。所有的不行，其实就是因为不知。所以他说 的知行合一，不是说知道了之后再去行，还是说知本来就是行行，本来就是知。


    但我们不是圣人，没有办法做到他那么厉害的知行合一。所以有很多时候我们也可以认为我们确实知道了道理，但是却没有能够把它在现实世界中执行。


    这个有时候是因为自己没有形成良好的习惯，它需要较长的时间才能做到，所以慢慢来没关系。

    '
  mdcn: '

    ## 答：


    在这种人生重大关口，如果要选择换一种活法，一定要先想得非常清楚才行。


    有一个必须注意的原则：我们如果要改变，不是因为想要逃避，而是因为有更大或更好的梦想要去追逐。


    如果只是想逃避的话，最终你会发现，兜兜转转又回到了原地。虽然你可能换了一个工作岗位或者工作单位，但是原来困扰你的那些问题并没有解决，它们早晚还是会回来找你。


    所以，如果你选择的新的路子，并不解决根本问题的话，换和不换，其实没有太大的区别。如果要换，就一定要能够彻底解决当前困扰你的最核心的问题。


    具体到你的情况，我建议还是先保住国企的位子。但是同时利用业余时间，做自己想做的事情。但前提是要真正投入热情和精力，让自己能够看到成果，然后再动。


    最关键的：要确立自己的初心，是为了理想，而不是为了逃避生活的磨难而选择走另一条路。


    ## 提问 19：


    何老师，双节快乐～ 假期期间有空，把之前星球没来得及看的文章都看了看，看到《人生战略，从规划到实施》，我觉得大受启发，很高兴自己正在路上，但有感觉还差点什么。


    其中关于自己部分，我很认可“我是谁”比“我要去哪”和“怎么去”重要一万倍，但我绞尽脑汁，感觉对自己的认识还是很系统清楚，感觉对自己的感觉还是太主观。


    请问老师，关于对自己的认识，有没有什么好的方法去系统的梳理与整理～


    ## 答：


    “认识自己”，既是特别重要的问题，也是特别难的问题。从古至今，它困扰了多少人，甚至是最著名的哲学家，也未必能回答好。


    说老实话，我自己也不敢断言，说我有一个很好的系统方法，能帮助别人认识自己。虽然我也总结过一些方法，但是毕竟效果因人而异。而且真正影响过多少人，帮助过多少人找到答案呢？我自己也是不确定的。


    我的感觉是，它应该和你内心深处最大的渴望和最深的恐惧有关。你可能需要想一想自己最渴望的是什么，最恐惧的是什么。这两个问题不能浮于表面，而要逐层深入。例如，你说我最渴望得到别人的认可，这个不是答案。你还需要追问，你渴望的是谁的认可，哪方面的认可？


    你可能会发现，原来你渴望得到的，是来自父母的认可，你最希望他们认为你是一个具有很强的自立能力的人。


    但这可能还不够，你还得追问自己，你为什么这么希望得到他们这方面的认可呢？就这样不断追问下去，也许你会找到一个更深层的答案。


    对于恐惧也是如此。


    所以这个问题的答案，一定是在于自身。每个人可能都有自己不同的梦想和恐惧。而他们实现这个梦想和避免这个恐惧的途径，又各有不同。


    现在市场上有一些“个人教练”（Coach），会帮助个人梳理这方面的问题。但是收费都很高，效果也因人而异，所以要根据自己的情况来决定是否要选择这样的服务。咱们星友群里也有从事
    coaching 工作的，你可以在群里也问一下。


    另外就是，我此前的文章《迷茫时的 3 个选择，决定了你人生的高度》也提到过一些如果找到方向的办法，你可以看一看哪种办法比较适合你。这篇文章的重点其实在文末的注释部分，可以好好看看。


    ## 提问 20：


    何老师您好！我正在读大一，课程不多，专业不怎么样，想问问应该把精力放在哪一方面，重点该学习什么呢？英语？计算机？


    ## 答：


    首先要看你未来想做什么。如果你已经想好了要做的事情，那么与那个事情相关的东西就是你要学习的重点。


    如果你还没有想好未来要做什么，那就选择那些怎么都不会错的事情。例如：


    - 1. 学一些以后工作用得上的技能：演讲、写作、书法、PPT、外语、编程、心理学、经济学、财务管理、企业管理、时间管理、思维导图、广告设计、营销技巧、商务礼仪、着装规范、（女生）化妆……

    - 2. 学一些生活用得上的技能：

    - 3. 也可以学一些纯娱乐调剂性质的技能：吉他、合唱、民乐、素描、插花、跳舞、陶艺、雕刻、剪纸……

    - 4. 还可以学一些有益身体的技能：羽毛球、网球、高尔夫、篮球、瑜伽、滑板、跑酷、游泳……


    不要贪多，先选择其中一两样开始学（1-4 类别搭配，每一个类别只选一样）。


    而且，要学，就沉下心来，学精、学细，争取学一门，会一门。不要狗熊掰棒子，捡起这个丢掉那个。


    ## 提问 21：


    何老师，你平时写作用哪种方式，近期打算开始写点东西，不是用来发表的，像写日记一样，去规划自己的工作，生活，类似于日志及反思，像查理芒格所说希望能在第二天能比前一天聪明一点就好


    ## 答：


    我的写作分为很多种。


    第一种是关于牛人的研究文章，因为要发在公众号上，所以是比较慎重的，要花很多时间来研究资料和组织材料，往往要一周的时间才能写一篇，有时还会很紧，需要连续加班才能写完。


    第二种是研究牛人的感悟，也是发在公众号上。一般也是五千字以上的长文，一篇文章就讲透一个问题。这种也要花两三天时间。当然，在写作之前，可能对那个问题的思考已经有几年或者几个月，只不过是现在把它用文字组织出来。两三天是思考文章结构和语言表达的时间。


    第三种是发在星球的文章。这种就是有感而发，比较随性。往往是看书、做事、与人交往中突然有某个点，就把它写下来。偶尔点子太多，我也会先在微信上自己给自己发一条信息，把关键字记下。等有空的时候再一篇篇写。这种文章写起来就比较快，可能半小时就写好了，一般是
    1200 字左右。


    第四种就是不发在任何地方，就是自己给自己看的了。会记录在微信或者备忘录上面。就是简短的几句话，或者一两段文字。偶尔会发个朋友圈，但朋友圈的字数一般都不多。


    ## 提问 22：


    何老师，您好！想请您给指条明路。


    情况是这样的我目前做的是传统的林业规划设计行业，14 年大学毕业在行业体制单位做外聘一直工作到 18 年，体制改革不再用外聘。然后自己开了个公司，慢慢发展到十多个人，可是好景不长公司逐渐衰落，到如今又只剩我一个人了。公司两年的时间也签了不少的项目，可多数项目的来源是靠以前的老同事给介绍的，只有少数是靠自己找来的。我思考了之后发觉造成如今的局面主要是因为：


    1. 自己以一个技术员的思想去开公司，全凭一腔热血，根本不懂怎么管理和经营。

    2. 对于和人打交道，人际关系，利益输送那一套自己就是一个小白，这些恰好也是拿到项目的关键。


    对于这一点不管以后还开不开公司我都想突破，说实话我真的很羡慕那些健谈、能娴熟应对各种交际的人和说话办事送礼都恰到好处没有一点违和感的人，就是不知道该从哪里开始学习。对于传统行业，像我这样一个技术员想要有项目，不会这些不知道还有没有什么新路子？我现在所困惑的是：继续守着公司寻求突破，可是又不知道该如何突破？去同行的公司上班，心里又有一些不甘？


    何老师，我现在应该怎么办？ 何老师，不好意思，写的有点乱。期待您的回复。


    ## 答：


    对于初创公司来说，业务开拓，是公司生存最重要的事。没有业务，再好的技术、想法、团队都白搭。


    你的起点其实很好，因为一开始创业就有老同事介绍项目，这已经比绝大多数创业者要好得多。


    但是确实，从长远发展来看，业务开拓能力是一定要提起来的。


    可以从三个方面着手。


    第一是把现有项目做到完美，把客户维护好，争取尽可能高的续单率。你前两年有很好的业务流量，其实是很好的机会。如果这些客户都能维护好，有较高比例的续单量，那么维持一个小团队，其实都可以了。


    有很多小公司，就是靠着少数几家大客户的不断续单，生存得很好。


    当然，这个要看不同行业的情况。有的行业，项目的特征就是一锤子买卖，没有续单的，那就另说。


    第二是重新开拓原来的老客户，争取老树发新芽。以前的客户都是你已经打过交道的，本身就是熟人，比陌生人更容易拉近关系和形成合作。你有很好的理由去加强接触，例如项目回访、售后服务。哪怕就是加强感情联络都行。


    这个有一个前提。就是你之前做项目的时候，没有给对方留下特别不好的坏印象。如果你前面的项目做得太差，让对方蒙受损失或脸上无光，那对方就很难再信任你。或者你之前不会做人，得罪了对方，现在要捡起来也比较困难。


    第三是加强新客户的拓展能力。这个是比较难的，但是也是公司未来如果想发展壮大，必须具备的。


    这个有三个方向可以考虑：


    第一是自己提升开拓能力。这需要突破自己原来的性格和能力局限，也需要较长时间培养。但却是最踏实的。创业者本身本来就应该是最大的业务员。只有如此，公司发展才稳定。


    第二是找一个很厉害的业务合伙人。你专攻技术，他专跑业务。这样你最省心。但是要让出较多的利益，例如给他较大比例的分成。有些情况下利润甚至要五五分，极端情况下甚至他多你少都有可能。另外一点，这个可能不大稳定。如果在你们这行，技术并没那么重要的话，他很可能随时踢掉你另外找人合作。


    第三是发展“代理”或“分销”模式。就是你和别人合作，别人介绍项目给你，你给他提成一定的比例。例如你的老同事，每成交一单，他都能提成百分之多少。如果你能发展很多这样的代理人或分销商，那么你的业务也不用愁。需要注意的是，这里可能存在灰色甚至黑色地带。例如，如果代理人是公职人员，可能就存在行贿受贿的风险。


    关于你个人何去何从，还需要你自己根据你的能力和愿望而定。如果你觉得业务开拓能力能够提升（不管是上面我写的三个方面的哪一方面），那么就可以继续把公司做下去，甚至做大。如果这方面看不到希望，那么就只能去同行公司先上班了。


    ## 提问 23：


    请问何老师，我是内心敏感的人，想发朋友圈和写文章，但又各种担心。关于发朋友圈恐惧心理怎么破呀？


    1. 担心老板、领导看到，发与工作无关事情，他们会认为你不务正业。领导有些小气。

    2. 担心同事、朋友看到，也会嘲笑和议论。

    3. 别人不点赞，不理睬等。

    4. 害怕被批评和被议论，感觉这种心理已经影响了职场进一步发展。


    请怎么提升和克服这种心理呀？


    ## 答：


    我觉得这个问题分为两个层次。


    浅的层次是从发朋友圈或文章本身来说：发还是不发？发了如果有上面担心的后果怎么办？


    这个问题其实很好解决。你发的时候，设置“仅自己可见”就可以了。或者设置分组，让自己不想看的人看不到。但是如果你又想尽可能多的人看到，那后面四种担心，确实可能会出现，而且是你必须要承受的。那就要看你是不是愿意为了发朋友圈或文章，而承受那些可能的风险。如果你评估了自己可以承受，那就发，如果评估自己不可以接受，那就不发。


    深的层次是：当我们面临内心的渴求和外界的评价之间的矛盾时，应该遵从内心，还是应该屈服于外界压力？


    这种矛盾会存在于每一个人。我们想要随心所欲地去做自己想做的事情，但是又总会担心外界的反应会如何。


    解决这个矛盾，需要让自己变得强大。一是内心的强大，二是实力的强大。


    我们先看内心。


    如果内心足够强大，外界的评论的影响就会变小，甚至对你可能完全没有影响。


    这种内心强大，一是要从认知上来解决。我们要知道，人和人是不同的，每个人看问题的角度是不同的。甚至别人有可能会因为价值观或利益的冲突，而说出让你不爽的话，做出让你不爽的事。我们要知道，世界并不必然地要时刻对我们微笑，坏的东西本来就会出现。当坏的东西出现的时候，你直接无视就好了。二是尽管认识到了，还是要经过现实的捶打磨炼。当你经历得多了，就会觉得无所谓了。


    这就好比何加盐发文章。我事先就知道有些评论可能会很负面，刚开始也会因为这些而不爽。但是多了以后，就无所谓了。直接不管就是。


    再来看实力。


    当你在才华、名气、金钱、权势等方面有了足够强大的实力以后，一方面，外界对你的友好程度会大幅增加。你的老板、领导会更照顾你的情绪，尊重你的行为，外界也会更认同你的做法。另一方面，你自己也会具有足够的自信，来坦然面对外界的评论。
    所以归根到底，你还是要磨炼自己的内心，强大自己的实力。


    希望你能够有勇气遵从自己的内心，不要被无谓的恐惧和外界的评价所束缚。能够遵从内心，才是真正的，最大的自由。


    ## 提问 24：


    何老师您好，最近有个疑问想咨询下您。 我二本毕业，专业土木工程，背景十八线开外小山沟。2020.7 毕业入职中国建筑某工程局，在深圳某工地工作，做个小技术员。
    工地流动性太强，以后升职还是待在工地，这个点是比较反感的，不希望以后一直孤苦伶仃待在工地。 想换个赛道，但又不知道去哪，因目前自身没啥特别竞争力，何老师有啥建议么？对于换哪个赛道，或者未来规划之类的？


    ## 答：


    我以前是做企业咨询的，也给一些房地产公司和建筑工程公司做过咨询。据我所知，土木工程专业出身的技术工还是很吃香的，工资上涨挺快，在公司也都挺受重用，跳槽也很好跳，随便到哪都有人要。主要原因是现在还处于技术工稀缺的状态。


    所以从职业发展和收入这一块来讲，我觉得你目前的工作还是挺不错的，关键是怎么样钻研好技术，拿到该拿的证书，把现有的工作做好，人脉关系处理好。 假如说你确实是对这个工作环境非常的厌恶，想要切换赛道的话，从现实情况来看还是比较难的。


    我的建议是两个选择：


    第一个选择就是爱你所干。多想一想这个职业对你的好处，跟周边的人关系处好一点，工作做好一点。和年纪比较大的技术员们或者领导多聊一聊，也许你会发现这份工作有一些你平时忽视的好的地方或者值得你留恋的地方。


    第二个选择就是切换赛道。这种情况下的切换赛道，一定要确保的一点，就是自己换的工作必须是自己所爱。


    如果是选第二个的话，对你来说最关键的就是好好想一想你到底喜欢什么？如果不先弄清自己的兴趣、爱好、梦想，贸然就行动的话，第二份工作也会跟你现在的工作一样的，一定会有令你不满的地方。到时候你还是会想再换的。


    我们如果切换赛道，就一定要一劳永逸地解决之前的问题，不能说改完之后原来的问题还存在，那就没有任何意义了。


    所以你要先问一下你自己，这么多年有没有过令你怦然心动的工作或者行业？你自己有没有虽然不赚钱，但是一直坚持的爱好？或者有没有从小都梦想着，但是因种种现实条件没有办法去做的事情？


    如果有得话，你可以在工地工作之余，把自己的时间投入到这方面，锻炼自己，在你喜欢地方的打造一技之长，然后凭这一技之长去找一个工作，在那个工作里把自己锻炼成专家。


    这个新的赛道只能由你自己问自己的内心来寻找，别人是帮不到你的。


    可以参考两篇文章：


    - 《迷茫时的三个选择，决定了人生的高度》

    - 《人生与事业道路选择的五个层次》


    ## 星友补答：


    我从 2002 年开始从事土木工程类专业，施工、监理、业主都干过，我想我应该有资格来说几句。


    工程行业有个主要的三个单位有以下区分：


    其一：


    - 1. 施工单位，也是最底层的单位，缺点就是处处看监理、业主脸色，必须时刻低头做人。优点是可以学的东西很多，对于大学毕业不久的人员，测量、预算、安全管理知识、投标文件编制。这些都要用心去学。施工单位又分为大工程局，比如中铁、中建、中水等。无论是那个工程局，做的标书都属于一流的，这个很值得学习。小施工单位就别呆了，很多小施工企业老板都是包工头出生，自身的利益高于一切，除非那个老板有做企业的愿景，也愿意相信你。

    - 2. 监理单位，在大监理小业主的时代（2000–2010 年左右），监理单位权力很大，有签字、签章权。现在业主基本上学精了，不会下很多权利给监理。监理单位现在处于高不成低不就的状态。当然其中也有特例，二滩国际监理和国家电投下属监理是我从业这么多年见过最专业、最靠谱的监理单位。从总监到监理员，基本上每个人对专业化程度较深。

    - 3. 业主单位，分为两种。编制内和编制外。只要能进入编制内，混吃混喝养老等死是最好的选择。如果你也没什么梦想，在业主单位混个正式编制，还是很不错的。


    其二：


    - 1. 搞工程职业资格证书很重要，现在大城市的一级建造师吃香的专业光挂个证出去，一年都奔小康（5–8 万元左右），更别提电气工程师、造价工程师、岩土工程师等证书了。

    - 2. 职称很重要，毕业 1 年可以搞个助理工程师，然后是中级职称、高工、教高。中级之后都需要独立写论文，当然你也可以请抢手。这个越早拿到越好。


    其三：


    - 1. 工程类人员离婚或者分手的概率要高于其他行业，因为一年四季你很难回到家。有些大企业，打着中字头的招牌到处骗人，招生的时候和你说：有双休、有假等等，那些都是骗你的。搞工程的人基本没有周末，没有节假日，没有加班工资。

    - 2. 搞工程的还要能出入各种场合，比如夜总会、洗脚城等。不是你喜不喜欢去，而是你必须去。家庭这一块要提前做好工作，免得媳妇、女朋友闹腾。


    最后的建议：


    - 1. 先在施工单位学到技术，到年限了就去把职业资格证书考了（一定要考），起码把中级职称搞到手。

    - 2. 把自己定位好，学施工也好，学做标书也可以，都要钻研透。

    - 3. 以上两点尽量在 30 岁以前搞定。30 岁以后，如果你想多挣钱，就一定要当项目经理。如果你图安逸，跳槽个本省市的业主单位。


    ## 提问 25:


    现在网络上好多付费课程，请问付费学习，真的值得么？怎么划分界限？


    ## 答：


    首先付费课程是很值得学习的。因为它们能帮我们节省很多的时间。那些东西如果我们自己去摸索或者是通过免费的方法去学习的话，会耗费大量的时间精力，而且有可能走弯路。别人帮我们总结出来了，我们付点费就学习，这是很有帮助的。


    但是其次，现在的付费课程太良莠不齐了，所以要很精心地选择。有很多课程是骗子课程，割韭菜收智商税的。所以选择课程的时候，一定要选择那些已经经过了很多人验证，而且评价比较好的课程。总体来说，得到是一个相对比较靠谱一点的平台。例如上面梁宁的课，万维刚的课，都还是挺有用的。当然也有一些未必对每个人的适用，这个你可以去试听一下，每门课的前
    5 节都是免费的。


    另外除了付费内容以外，B 站上有很多免费的内容，还有一些慕课平台，包括学习强国，都有特别好的课程，可以去那上面找一找。


    ## 提问 26:


    何老师您好，想请教一个关于如何正确阅读的问题。


    平时在阅读中总会遇到一些让自己有启发的信息。


    - 1. 你是怎么处理这些有启发的信息的？

    - 2. 怎么样才能让这些有启发的内容真正为我所用，从而改善自己的工作和生活呢？


    比如说我看完您的《持续进化》一书，有很多观点和内容都很冲击着我旧有的观念。


    对我有比较有启发的内容：


    - 1. 乡土思维“七宗罪”。我会提醒自己在生活中做决策要避免犯这样的错误

    - 2. 二八法则。要把主要精力放在最重要的事情上，而不是在所有的的事情上平均用力等等


    困惑的点在于：


    有时到了实际的生活场景当中，有些点明明提醒过自己的，关键时刻却想不起来了，导致又犯同样的错误。


    ## 答：


    这个问题涉及到两个点：第 1 个是研几，第 2 个是知行合一。所谓研几，就是平时自己各种机缘巧合下碰巧想到的感兴趣的，或者对自己有用的问题一定要继续研究下去。可以立马用手机记下来，把自己的所思所想，用录音或者文字的方式把它记录一下，如果有时间的话可以扩充成一篇小短文。


    很多好的文章，好的思想，好的发明创造理论创新，都是这种方式完成的。如果有灵感没有及时记录，很快它就跑掉了。


    实际上我的很多文章包括认识星球的文章，都是因为想到某一些点赶紧记录下来，才扩充成文的。


    而知行合一，这一点就比较难了，它也是困扰无数人，甚至很多超级牛人的一个东西。王阳明的心学，其实整个都是在解决这样一个问题。


    这里面可能有两个点。第 1 点是没有真正地知，所以没有办法行。也就是你对于自己有所感触的地方，还没有完全想明白，包括它是什么道理，对自己的生活有什么用，自己要怎样能去做？有可能你只是有所触动，然后就把它放过去了，并没有真正的想去把它应用在自己的生活当中。


    王阳明就一直认为世界上没有先知后行，或者说知而不行。所有的不行，其实就是因为不知。所以他说 的知行合一，不是说知道了之后再去行，还是说知本来就是行行，本来就是知。


    但我们不是圣人，没有办法做到他那么厉害的知行合一。所以有很多时候我们也可以认为我们确实知道了道理，但是却没有能够把它在现实世界中执行。


    这个有时候是因为自己没有形成良好的习惯，它需要较长的时间才能做到，所以慢慢来没关系。

