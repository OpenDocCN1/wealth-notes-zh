    # 吃菜


    中国人一般都很讲究吃，同时也很讲究吃相。随着职场礼仪越来越被重视，商务饭桌上的吃和吃相也更加讲究。以下以中餐为例，教你如何在餐桌上有礼有仪，得心应手。中餐宴席进餐伊始，服务员送上的第一道湿毛巾是擦手的，不要用去擦脸。上龙虾、鸡、水果时，会送上一只小小水盂，其中飘着柠檬片或玫瑰花瓣，它不是饮料，而是洗手用的。洗手时，可两手轮流沾湿指头，轻轻涮洗，然后用小毛'
  merge: -1
  img_proc: true
- pgno: 127
  md: '巾擦干。用餐时要注意文明礼貌。对外宾不要反复劝菜，可向对方介绍中国菜的特点， 吃不吃由他。


    有人喜欢向他人劝菜，甚至为对方夹菜。外宾没这个习惯，你要是一再客气，没准人家会反感：“说过不吃了，你非逼我干什么？”依此类推，参加外宾举行的宴会，也不要指望主人会反复给你让菜。你要是等别人给自己布菜，那就只好饿肚子。客人入席后，不要立即动手取食。而应待主人打招呼，由
    主人举杯示意开始时，客人才能开始；客人不能抢在主人前面。夹菜要文明，应等菜肴转到自已面前时，再动筷子，不要抢在邻座前面，一次夹菜'
