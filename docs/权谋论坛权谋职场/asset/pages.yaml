  md: '行为”与“关系行为”两种。


    “职责行为”是指由一个领导者指定部属的职责，他的行为包括告诉人们——做什么事，如何做，何时做，何处做，由谁去做等。


    “关系行为”是指领导者对部属采取双向或多向沟通，其行为包括倾听、、辅助、澄清、以及社交情感上的支持。


    赫赛认为，由于情境（实际情况）随时都在变化，管理者必须适时运用这两种不同的行为模式，才能成为有效的领导。他依这两种行为模式表现的程度，归纳出四种不同的领导风格：


