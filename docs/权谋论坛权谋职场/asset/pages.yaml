- pgno: 22
  md: '对领导尊重是每一个下属应该有的职业素养，说一些领导爱听的话喜欢听的话也是为自己营造较好工作环境的一种手段，然而，如果你发现自己身边某位同事有见人说人话遇鬼说鬼话的爱好，你就应该特别留意了，起码你在他面前是绝对不能说领导的坏话或是发领导的牢骚了。


    喜欢搬弄是非者或是喜欢造谣生事的人，通常都会是另有目的另有阴谋的，这种人习惯于用这种贬低别人和污水位别人的手段来衬托出自己的优秀，或是设计好让比自己优秀的竞争对手陷入困境，失去领导或同事们的信任。如'
  merge: -1
  img_proc: true
- pgno: 23
  md: '果你发觉身边某些人总习惯用“听说”来造句时，你就要特别留意了。


    职场有许多人心里都是唯恐天下不乱的，为了显示出自己的能耐，有一种人总是会制造纷争的事端，采用挑拨和离间计来激发竞争对手之间的矛盾，有时，这种人还会表现出自己的“和事佬”的和善，让你感到他值得信赖。假如你发现身边的某个人在你面前总是告诉你某某同事在讲你什么，你千万要先证实一下。


    明明是自己工作中出现了差错和问题，或是在工作中出现了瑕疵需要厘清责任，当别人都在第一时间想方设法补救的时候，有一种人总是会抢在第一时间到领导那里去闪烁其词，甚至'
  merge: -1
  img_proc: true
- pgno: 24
  md: '是昧着良心胡说八道,让领导感到自己既忠心耿耿又可以成为领导了解属下工作状况的卧底,目的就是找一个替自己背黑锅的冤大头。


    如果发现自己的身边有一种人对于同事跌倒和面临挫折时总是幸灾乐祸,总在说意在罪有应得之类的风凉话,或是总是用一种事后诸葛亮的神秘口气告诉你得罪了某某领导的时候,你就要格外注意自己的立场了,这种人很可能就是善于踏着别人的鲜血前进的势利小人,有朝一日或许你也会成为他落井下石的对象。


    职场同事大多希望能够遇到欣赏并且可以提携自己的伯乐,同样,也担心遇到你种树他乘凉的“小人”,你全力帮助他事业有成,而他'
  merge: -1
  img_proc: true
- pgno: 25
  md: '却没有学会感恩戴德和感恩图报,甚至还会翻脸无情来抹黑你打压你,让你会后悔自己的善良真的是用错了对象。因此,害人之心不可有,防人之心不可无。


    职场“小人”最大的特点是做最艰苦的工作时不太容易见到他,或者是言行不一致,善于做表面功夫给领导看,善于投领导所好,奉承拍领导马屁,整天嘴甜的如同涂了蜂蜜,有亲近领导的特长,有邀功抢功的特长,有善打小报告的特长,有在夸奖你的时候套出你心中的秘密然后背过身去陷害你出卖你的特长。


    职场人际关系十分微妙复杂,稍有不慎,就会陷于被动,可以说每个在职场上摸爬滚打过的'
  merge: -1
  img_proc: true
- pgno: 26
  md: '人都Would对此深有感触。而及时检讨，反省自己的行为，进行积极有效的心理调整，让自己适应多变的人际关系，不失为一个增强生存能力的好办法。因此，职场中人有必要时常对以下几方面做一个自检。


    # 一、算计


    任何人都会对别人的背后算计非常痛恨，算计别人也是职场中最危险的行为之一，这种行为所带来的后果，轻则被同事所唾弃，重则失去饭碗，甚至身败名裂。


    如果你经常有把事业上的竞争对手当成"仇人"、“冤家"的想法，想尽一切办法去搞垮对方的话，那么你就很有必要检讨一下了，作为老'
  merge: -1
  img_proc: true
- pgno: 27
  md: '板，他绝对不希望自己的手下互相倾轧，老板希望每一个员工都能发挥自己的长处，为自己带来更多的效益，而互相排斥只会增加内耗，使自己的企业受损，周围的同事也同样讨厌那些喜欢搬弄是非、使阴招、发暗箭的人，因为每个人都希望有一个和谐宽松的工作环境，并与自己志趣相投的人共事。


    # 二、妥协


    当然，在与同事的相处中还会有互相竞争的成分，因此，恰当使用接受与拒绝的态度相当重要。一个只会拒绝别人的人会招致大家的排斥，而一个只会向别人妥协的人不但自己受了委屈，而且还会被认为是老好人、能力低、不'
  merge: -1
  img_proc: true
- pgno: 28
  md: '堪大任，且容易被人利用。因此在工作中要注意坚持一定原则，难免卷入诸如危害公司利益、拉帮结伙、损害他人等事件中去。遇到这样的情况要注意保持中立，避免被人利用。


    # 三、隐私


    在一个文明的环境里,每个人都应该尊重别人的隐私。如果你发现自己对别人的隐私产生浓厚的兴趣时，就要好好反省了。窥探别人的隐私向来被人是个人素质低下、没有修养的行为。也许有许多情况是在无意间发生的，比如，你偶尔发现了一个好朋友的怪僻行为，并无意间告知了他人，这样不仅会对朋友造成伤害，还会失去你们之间的友谊。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '偶尔的过失也许可以通过解释来弥补，但是，如果这样的事件发生过几次，那么你就要从心理上检讨自己的问题了。此外，除了学会尊重他人以外，在与同事的交往中还要保持恰当距离，注意不要随便侵入他人"领地"，以免被人视为无聊之辈。


