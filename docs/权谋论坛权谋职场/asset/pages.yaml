  md: '# 领导交往规律'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 1、穿戴要得当大方


    外表是给人的榜首影响，而榜首影响给人又是对比深入的，因而穿戴要得当是咱们有必要永久要留意的。穿得光鲜一点自个也会倍感自傲。作为兼职人员或实习生，公司或许对自个的着装不做强行请求，但，咱们决不能放松自个，要不时刻划把它作为规则来提示自个。让老板和搭档们不要老想着自个仍是一名兼职人员，一般专业化的穿戴会取得那些能提拔你的人的尊敬。


    # 2、上班要尽量早一点


    或许自个地点的单位，对迟到考勤方面没有什么格外的请求，但咱们决不能随意地放松自'
  merge: -1
  img_proc: true
- pgno: 209
  md: '个,天天不是迟到或许即是早退,并总以为没人留意到自个的出勤情况,或许以为单位对这方面没有严格请求等。其实不然,您在公司的一举一动,上级可全都是睁大眼睛在瞧着呢!假如您每次上班总能提早几分钟到公司,您的上级就会以为您十分重视这份作业。


    # 3、上班时不要老看时刻


    新进单位的人,由于一开始不适应作业时刻和作业节奏,因而常常会有刚刚上班就盼望下班的想法。天天下班铃一响,就冲出公司大门的职工,在老板眼里,必定不喜爱现在的作业,随时预备放弃这份作业。请留意你要将对作业'
  merge: -1
  img_proc: true
- pgno: 210
  md: '热忱的形象刻印在老板的脑海里，而不是锱铢必较是否在作业多花了原该用于自个休闲的时刻。


    # 4、干事要坚决决断


    有很多人在刚开始作业时，为了怕做错作业或许做欠好作业，而体现得猥猥缩缩，不感承当作业，不敢随意发表定见，遇到自个非要做的作业时，体现出优柔寡断或过度依靠他人定见，这是一辈子注定要被打入冷宫的。由于老板深深知道这个道理，公司需求立异才干开展，而立异需求那些干事坚决决断的人才。


    # 5、处理作业要镇定


    要想让上级对自个器重，就有必要想方设法地'
  merge: -1
  img_proc: true
- pgno: 211
  md: '使他信赖自个,而要想使他人信赖自个,就有必要做到面临任何情况都能处之泰然 ,这么的话就可能使老板加深对自个的形象。由于 ,老板、客户不只钦佩那些面临危机声色不变的人,更赏识能妥善解决问题的人。


    6、赶快了解公司的一切


    尽力了解公司的一切：公司政策、任务、安排构造、出售方法......体现出你情愿承受公司的公司文化。情愿融入这个集体,而不是作一个仓促过客。除此以外 ,你还要了解公司的经营政策以及作业作风
    ,你对公司的大局知道有助于你日后的开展。


    7、干事要积极主动'
  merge: -1
  img_proc: true
- pgno: 212
  md: '一旦老板给自个分配任务时,假如能做到接到作业马上动手,并能灵敏准确及时完结地完结的话,您的老板一定是高兴的,由于反应灵敏给人的形象是金钱买不到的。别的在干作业的过程中,不能消极等候,存在着太多的期望和梦想。千万别期盼一切的作业都会照自个的方
    案而行。相反,你不得不为可能产生的过错做预备。


    8、不在作业时谈天


    新作业需求高度集中的留意力,测验多花些时刻与搭档合作,把私家业务暂时放置吧。尤其忌讳作业中的闲谈,它不但会影响你自个的作 业进度,也会影响别的搭档的作业心情,招来'
