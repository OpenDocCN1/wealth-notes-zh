  md: '# 职场规律


    # 怨言规律'
  merge: -1
  img_proc: true
- pgno: 201
  md: '职场怨言最大的危害在于对作业空气的损坏。现代安排都注重互帮、合作的团队协作空气，团队成员间的凝聚力、沟通力决定了安排的战斗力。商场如战场，不是假定，而是现实。战斗力决定着安排的生死存亡。作业空气的损坏直接会导致安排战斗力的降低。


    职场怨言有这么大的危害性，道理很简单，由于不管你在诉苦啥，都不主要，主要的是你在传递一种负面心情。对安排来说，这是一种毒药，一种会感染的毒药。这是任何安排无法承受的现实。但职场江湖，不可能事事如意，总有一些人或事令人心存不满。'
  merge: -1
  img_proc: true
- pgno: 202
  md: '# 职场上发怨言要讲究窍门


    1、不要让怨言信口开河。心有不满，情急之下，说出来的话通常带有激烈的自己心情，并不能被大多数人承受。


    2、不要在作业室发怨言。作业室是作业的当地，并不合适宣泄自己心情，并且带有片面颜色的怨言也很容易被搭档误解。


    3、不要事事发怨言。假如经常发怨言，事事发怨言，会让人贴上“怨言婆”的标签，你的作业效率不只大打折扣，并且令人对你的作业能力发生置疑。


    4、沟通永远是处理疑问的最佳办法。找到疑问的关键人物，以平缓的情绪把疑问反映出'
  merge: -1
  img_proc: true
- pgno: 203
  md: '来，请对方处理或帮忙处理。


    5、假如某个疑问真的很扎手，也请笑着“诉苦”。这样的诉苦不只不会发生副作用，更令人觉得你有达观心态。


    6、根绝作业以外的怨言。作业上的怨言，再惹人嫌，也是为了作业；而触及领导、搭档自己的评估，会令你戴上“小人”的帽子。怨言到底应当如何发？


    7、假如已对某事发过一次怨言，也受到了对方的注重，就不要再提此事；


    8、把怨言说出来，不要只挂在脸上；


    9、用挖苦、诉苦的语气即是怨言，注意多用含蓄、商议的语气，把怨言成为主张。如“你'
  merge: -1
  img_proc: true
