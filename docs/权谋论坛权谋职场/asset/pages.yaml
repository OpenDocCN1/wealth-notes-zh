- pgno: 221
  md: '# 职场规律


    1、深信规律


    当你对某件作业抱着百分之一万的信任，它最终就会变成现实。


    2、期望规律


    期望规律告诉我们，当我们怀着对某件作业十分激烈期望的时分，我们所期望的事物就会出现。


    3、心境规律


    心境规律告诉我们，人百分之百是心境化的。即使有人说或人很理性，正本当这自己很有“理性”地思考问题的时分，也是遭到他当时心境情况的影响，“理性地思考”本身也是一种心境情况。所以人百分之百是心境化的动


    220'
  merge: -1
  img_proc: true
- pgno: 222
  md: '物，而且任何时分的抉择都是心境化的抉择。


    # 4、因果规律


    任何作业的发生，都有其一定的要素。有因才后果。换句话说，当你看到任何现象的时分，你不必觉得不可了解或许古怪，因为任何作业的发生都必有其要素。你今天的现状作用是你以前种下的因致使的作用。


    # 5、招引规律


    当你的思维专注在某一领域的时分，跟这个领域有关的人、事、物就会被你招引而来。


    # 6、重复规律


    任何的做法和思维，只需你不断的重复就会得到不断的加强。在你的潜意识傍边，只需'
  merge: -1
  img_proc: true
- pgno: 223
  md: '你能够不断地重复一些人、事、物，它们都会在潜意识里变成现实。


    # 7、累积规律


    很多年轻人都曾梦想做一番大作业，正本全国并没有啥大事可做，有的只是小事。一件一件小事累积起来就形成了大事。任何大作用或许大灾难都是累积的作用。


    # 8、辐射规律


    当你做一件作业的时分，影响的并不只是这件作业的身体，它还会辐射到有关的别的领域。任何作业都有辐射作用。


    # 9、有关规律


    有关规律告诉我们：这个世界上的每一件'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 职场规律


    作业之间都有一定的联络，没有一件作业是完全独立的。要解决某个难题最佳从别的有关的某个本地人手，而不只是专注在一个困难点上。


    # 10、专精规律


    专精规律告诉我们，只需专精在一个领域，这个领域才毕有所发展。所以不管你做任何的作业都要把做该作业的最顶尖为政策，只需当你能够专精的时分，你所做的领域才会出类拔萃地生长。


    # 11、替换规律


    替换规律就是说，当我们有一项不想要的回想或许是负面的习气，我们是无法完全去除'
  merge: -1
  img_proc: true
- pgno: 225
  md: '掉，只能用一种新的回想或新的习气去替换他。


    # 12、惯性规律


    任何作业只需你能够继续不断去加强它，它毕竟会变成一种习气。


    # 13、闪现规律


    闪现规律就是说，当我们继续寻觅、诘问答案的时分，它们毕竟都必将闪现。


    # 14、需求规律


    任何人做任何作业都是带有一种需求。敬重并满足对方的需求，别人才会敬重我们的需求。'
  merge: -1
  img_proc: true
