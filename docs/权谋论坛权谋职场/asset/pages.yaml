- pgno: 52
  md: '开始形象和负面加剐倾向国外有专家研讨后得出结论，至少有85%的考官在面试真实开始前，已依据应聘者的应聘材料对其产生了开始的形象。开始形象对面试的进程和成果有着十分重要的效果。依据心理学的原理。如你给人留下的开始形象欠好，那么要改动这种形象将是很艰难的，这就是负面加剐倾向的效果。了解了考官的这一心理特征，我们就应当仔细预备自个的应聘材料，尽也许让自个的缺陷和缺乏被优点和特长所掩盖。当然更不要因为自个的穿着打扮、面试开始时的一举一动而给考官留下差劲的形象。


