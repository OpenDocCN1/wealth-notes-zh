    5 遍，人们似乎永远都不会厌倦自己。假如你够聪明，你就该让他们一偿“夙愿”。假如你需要让别人知道你仍然醒着，只要不时简单地发出“嗯”或“对”就可以了。你将会被称赞是个不只会听人说话，而且还了解别人的人，就算你压根儿就不是。避开麻烦、困难而不必要的工作，以及窘境，别像个喜好挑战的参赛者一样来过活。


