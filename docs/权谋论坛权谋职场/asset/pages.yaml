  md: '上级的责备。留意了这些，你就能树立起一个专业人员的形象，你的全部职业生涯的开展将受益匪浅。


    # 9、不要和老板争持


    在作业中，与老板不免会有一些误解，但不要因这个误解导致你和自个的老板争持，由于同老板打交道有一条至关重要的原则——永久不要坚持一场不能取胜的战役。假如与老板确实发作一些冲突，这时你应当记住的是：考究方法，除了留意机遇、弄清问题、提出方法以外，更值得一用的是“站在上级的视点思考问题”：假如你自个此时站在上级法的位置上，你会怎样处理这件事，多设身处地为上级法想'
  merge: -1
