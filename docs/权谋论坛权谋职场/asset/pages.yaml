- pgno: 110
  md: '# 规律 1：沟通前先做好准备


    在你跟同事讨论事情之前,先把一些基本问题想清楚,不要毫无准备就去,否则很可能得不到你想要的东西。下面的几个问题应该事先想清楚：


    你希望对方帮你做什么事？


    你认为他会要求你做什么？


    如果对方不同意你提出来的做法,有没有其它选择方案？


    如果双方没共识,你会有什么后果？对方又会有什么后果？


    # 规律 2：了解其它部门的语言'
  merge: -1
  img_proc: true
- pgno: 111
  md: '跨部门沟通不良，很多时候都是“语言不通”所引起。举例来说，营销部人员平常讲的是“相同语言”，他们非常清楚自己部门的规则、目标与期望。同样地，财务、生产、人资等部门，也有自己的语言与观点。因此，想要沟通顺畅，前提就是“听懂对方的语言”。规律2的一个重要方法是换位思考，试着站在对方的立场思考：


    “这么做，对业务部的业绩有帮助吗？”


    “如果我是他，会接受这种做法吗？”


    “这个方法真的有用吗？”


    跨部门的换位思考法能将误解或沟通频率不搭的机率降到最低。此外，频繁的互动有助于'
  merge: -1
  img_proc: true
- pgno: 112
  md: '建立彼此的熟悉度，让你更容易设身处地想问题。因此，时不时的跟其它部门的同事吃吃饭、聊聊天，有好无坏。


    # 规律 3：开诚布公是最好的对策


    你面对的是必须长期共事的同事，因此，凡事以诚实为上策，最忌欺骗、隐瞒事实，破坏信任关系。部门间一旦缺乏信任感，会加重彼此的防御心，沟通时就会有所保留，甚至隐藏一些重要信息。相反的，互信会让双方在沟通时打开心防，他们会明白说出自己的需求与考虑，并且提高合作意愿，共同解决问题。诚信沟通有三个要素：'
