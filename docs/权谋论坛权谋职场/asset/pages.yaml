- pgno: 56
  md: '# 一、永远排在倒数第二的位置上


    知道在自己之后，还有一个排在末位置上的同事，而且要为所有在他面前出现的错误、疏忽负责任，实在是一件令人安慰的事；只要那个人不是你。不是现在时兴末位淘汰吗？你只要保住你倒数第二的位置就够了。假如你身处最末一位的层级，赶紧实施紧急救助，逃将出来。如果你已经在外面，请谨慎不要再踏进去。


    # 二、该闭嘴时就闭嘴


    有时候，你会突然发现自己身处颇为微妙的境界。当两个或更多的彼此看不顺眼的人几乎就要起言语冲突时，你刚好就在“现场”。对未经训练的耳朵来说，他们似乎是在争论有关工'
  merge: -1
  img_proc: true
- pgno: 57
  md: '作上的小事。但是，你知道这只是表面的现象，根本原因在于这两个人根本就彼此讨厌对方。你一定要克服你想插嘴的渴望，紧紧地闭上你的唇。基本上，无论你说什么都将是错的，不是因为缺乏解决方案或是社交技巧，而是因为没有会在这时候喜欢裁判员。事实上，当裁判员挡“路”时，还会被凌呢。在这个多变的人际关系“化学世界”中，请等到酸碱完全中和，而酸碱值也回到正常时，再有所“动作”。


    # ### 三、避免完成别人的句子


    我们了解这样的冲动，你想要向别人展示你是如何的与他们的思路契合。但是，假如你真的'
