  md: '《有效沟通》一书中点出，“如果管理团队在议题的讨论上都没有冲突，决策质量就会低落。”艾林哈特提醒，千万别把“没有冲突”跟“意见一致”混为一谈。


    有时候，太过和谐反而凸显不了你对议题的重视，而且问题也不会获得真正的解决。因此，艾林哈特建议经理人，态度要柔软，但立场要坚定，“别太快或太轻易就顺从认命。”记住，你是部门主管，虽然你要和其它部门保持良好关系，但是，捍卫部门及部属的权益，更是你责无旁贷的使命。


