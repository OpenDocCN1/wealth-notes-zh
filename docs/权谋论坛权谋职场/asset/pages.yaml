  md: '+   1.开球者：为了成功，不择手段。这类人通常是定见领袖，心境安稳定性较强，但性格不太和顺，同情心较差，喜欢单打独斗，不善于协作。  同处窍门与忌讳：与他们交流心境要温文，尊敬他们的定见，但不要太软弱。切忌在公共场所侮辱他们或损害其利益。


