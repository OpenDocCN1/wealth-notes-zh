- pgno: 86
  md: '# 第 1 条、动议中心规律


    “动议者，行动的提议也。”会议讨论的内容应当是一系列明确的动议，它们必须是具体、明确、可操作的行动建议。先动议后讨论，无动议不讨论。


    # 第 2 条、主持中立规律


    会议“主持人”的基本职责是遵照规则来裁判并执行程序，尽可能不发表自己的意见，也不能对别人的发言表示倾向。（主持人若要发言，必须先授权他人临时时代行主持之责，直到当前动议表决结束。）


    # 第 3 条、机会均等规律'
  merge: -1
  img_proc: true
- pgno: 87
  md: '任何人发言前须示意主持人 , 得到其允许后方可发言。先举手者优先 , 但尚未对当前动议发过言者 , 优先于已发过言者。同时 , 主持人应尽量让意见相反的双方轮流得到发言机会
    , 以保持平衡。


    # 第 4 条、立场明确规律


    发言人应首先表明对当前待决动议的立场是赞成还是反对 , 然后说明理由。


    # 第 5 条、发言完整规律


    不能打断别人的发言。


    # 第 6 条、面对主持规律


    发言要面对主持人 , 参会者之间不得直接辩论。'
  merge: -1
  img_proc: true
- pgno: 88
  md: '# 第 7 条、限时限次规律


    每人每次发言的时间有限制(比如约定不得超过 2 分钟);每人对同一动议的发言次数也有限制(比如约定不得超过 2 次)。


    # 第 8 条、一时一件规律


    发言不得偏离当前待决的问题。只有一个动议处理完毕后,才能引入或讨论另外一个动议。(主持人对跑题行为应予制止。)


    # 第 9 条、遵守裁判规律


    主持人应制止违反议事规则的行为,这类行为人者应立即接受主持人的裁判。


    # 第 10 条文明表达规律'
  merge: -1
  img_proc: true
- pgno: 89
  md: '不得进行人身攻击、不得质疑他人动机、习惯或偏好，辩论应就事论事，以当前待决问题为限。


    # 第 11 条充分辩论规律


    表决须在讨论充分展开之后方可进行。


    # 第 12 条多数裁决规律


    （在简单多数通过的情况下）动议的通过要求“赞成方”的票数严格多于“反对方”的票数（平局即没通过）。弃权者不计入有效票。


    既然是精简的规律，自然意味着每一条规律还需细细琢磨。如何将开好看似简单，实则是个很复杂的问题，其中涉及很多的管理理念与技巧，同时关乎情商和智商。'
  merge: -1
