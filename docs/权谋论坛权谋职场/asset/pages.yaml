- pgno: 122
  md: '# # 座次


    总的来讲，座次是“尚左尊东”、“面朝大门为尊”。若是圆桌，则正对大门的为主客，主客左右手边的位置，则以离主客的距离来看，越靠近主客位置越尊，相同距离则左侧尊于右侧。若为八仙桌，如果有正对大门的座位，则正对大门一侧的右位为主客。如果不正对大门，则面东的一侧右席为首席。


    如果为大宴，桌与桌间的排列讲究首席居前居中，左边依次 2、4、6 席，右边为 3、5、7 席，根据主客身份、地位，亲疏分坐。如果你是主人，你应该提前到达，然后在靠门位置等待，并为来宾引座。如果你是被邀请者，那'
  merge: -1
  img_proc: true
- pgno: 123
  md: '么就应该听从东道主安排入座。一般来说，如果你的老板出席的话，你应该将老板引至主座，请客户最高级别的坐在主 座左侧位置。除非这次招待对象的领导级别非常高。


    # 点菜


    如果时间允许，你应该等大多数客人到齐之后，将菜单供客人传阅，并请他们来点菜。当然，作为公务宴请，你会担心预算的问题，因此，要控制预算，你最重要的是 要多做饭前功课，选择合适档次的请客地点是比较重要的，这样客人也能大大领会你的预算。况且一般来说，如果是你来买单，客人也太不好意思点菜，都会让你来
    作主。如果你的老板也在'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# 职场规律


    酒席上，千万不要因为尊重他，或是认为他应酬经验丰富，酒席吃得多，而让他／她来点菜，除非是他／她主动要求。否则，他会觉得不够体面。如果你是赴宴者，你应该知道，你不该在点菜时太过主动，而是要让主人来点菜。


    如果对方盛情要求，你可以点一个不太贵、又不是大家忌口的菜。 记得征询一下桌上人的意见，特别是问一下“有没有哪些是不吃的？”或是“比较喜欢吃什么？” 让大家感觉被照顾到了。点菜后，可以请示“我点了菜，不知道是否合几位的口味”，“要不要再来点其它的什么”等等。点菜时，一定要心中有数。点菜时，可根据以下三个规则：'
  merge: -1
