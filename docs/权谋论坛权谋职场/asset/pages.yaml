- pgno: 51
  md: '面试在招聘中的效果已越来越重要,几乎每一个稍微好一点的作业都要通过面试才也许取得。


    实际上,面试也是供需双方心理上的较量。作为应聘者来说,了解对方的心理特征,做到“明明白白他的心”,就能变被动为主动。因此,恰当学习些心理学,掌握面试考官的根本心理特征,有预备、有针对性地参与面试,对进步应聘的成功率是大有优点的。依据笔者了解,面试考官有这么三个根本心理特征应聘者应当掌握,即:开始形象和负面加剧倾向、雇佣压力和暗示、心旷神怡。'
  merge: -1
