    # 新官规律'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 稳定军心


    人始终是社会生产力发展的第一要素。现代营销讲究的是系统整合，团队作战；仅仅凭借单打独斗就能夺取天下的时代已经一去不复返了。对于上任的“新官”来说，如何尽快稳定军心、保持团队整体性和团队作战能力是个非常重要的问题。


    很多新官喜欢上任伊始，就对原有的组织结构和团队成员进行大面积、大幅度调整，并安排自己的亲信担任新的团队中的要职，从表面来看，这是树立了新官的权威，同时搭建了新的领导班子；但是，从实际效用来说，这种策略造成的后遗症相当大，同时对短期营销工作会'
  merge: -1
  img_proc: true
- pgno: 159
  md: '造成极大的弊端。团队涣散、军心不稳、敷衍了事、麻烦不断是这种策略最常见的外在表现形式。


    聪明的领导在上任之初，往往会把稳定军心作为一项特别重要的工作来安排。他们会召集所有自己管辖范围内的员工（如果员工数量太多，就选择其中的管理者和骨干成员），集中起来开会；同时在会上公开宣称，绝不随意开除、辞退任何一名员工；欢迎所有员工都继续留下来，和他一起共同奋战，创造更加美好的未来；他们同时还会“吐露”心声，他们现在在这个岗位上，最大的愿望就是用自己新的、独特的、正确有效的经营思路和观念，来带领'
  merge: -1
  img_proc: true
- pgno: 160
  md: '原有的这个团队，创造出新的辉煌；他们所能做的，就是将他们的经营观念和思路、包括执力要求灌输给这个团队中的每个人，让全体人员“行同一人”，“手指一处”，成就辉煌……对于原有团队中的中坚力量、骨干成员，“新官”还会在短时间内单独与之进行沟通、交流，一方面了解市场情况，另一方面也阐述自己的经营思路和理念，并盛情挽留对方留下来，共同在这个市场打拼出新的业绩。


    这些聪明的领导都清楚：团队中的绝大部分人，都是在基层打工的；他们就是希望有一个好的领导，有一个好的工作氛围，能够多挣一点钱；如果能再获得一个好的平台，或者学到'
  merge: -1
  img_proc: true
- pgno: 161
  md: '很多新鲜知识，那么对于他们来说，就是最大的恩赐了。没有哪个人想随便离开这个单位，即使他和前任领导关系再好！聪明的领导都明白这一点，同时也能很好的落实这一切，所以他们在接手新的工作后，都能赢得原有团队中大多数人的支持和配合，从而将营销工作快速、良性的发展起来。


    从这点来说，它也很符合中国人的一个习性：中国人喜欢有“安全感”！如果“新官”不能做到稳定军心的话，那么这个“新官”迟早要吃亏！


    # 摸清家底


    如果一国元首不清楚自己国家的财政状况，那'
  merge: -1
  img_proc: true
- pgno: 162
  md: '么这个国家元首肯定是不称职的,他绝对无法将这个国家治理好；同理，一个“新官”如果不能在尽短时间内摸清楚自己的家底，他这个“新官”肯定也是不符合要求的。


    “新官”上任，必须尽快摸清自己的家底。在这方面，我们应该多学习那些财务人员，或是财务出身的营销将士，他们对“家底”、对“财政”的认识要远大于普通人；同时，也更加严谨、认真、细心。


    笔者的一个具有财务背景的朋友，调任某分公司当总经理。他上任之初，曾花费半个多月的时间，几乎是废寝忘食，来摸清楚自己的“家底”。从分公司的市场环境、渠道关系、网络'
  merge: -1
  img_proc: true
- pgno: 163
  md: 覆盖率、销售任务、毛利率、资金周转率、样机贡献率、商返机到返利、补差、经营盈亏状况、营业费用超支、税务、市场投入、投入产出比等各个环节，全面摸了一次底。这次摸底工作让他获益菲浅，从中他发现了隐藏很深的几个
    “黑洞”，结合公司审计报告和分公司财务报告，他及时向上反映了这些问题，并据此给公司打了专项借支报告，从而顺利的启动了自己的市场，最后在年底风光了一把。可以说，摸清家底是每个
    “新官” 上任之初必须要做的一件大事，刻不容缓；因为一旦你的时间拖延，那么你启动市场的时机就错过了；而如果你在没有摸清家底前就开始大量投入
  merge: -1
  img_proc: true
- pgno: 164
  md: '市场建设,那么前任和你之间的交接就会陷入一堆泥潭,有理也说不清。


    # ### 制订游戏规则


    现代营销是个系统工程,涉及到财务、业务、服务、物流、货源、价格、政策、物料、上样、广告宣传、品牌传播、培训、厂商关系、激励与考核等诸多环节。如果我们要将营销工作做好,惟有依靠团队作战。而要想让团队一心,就必须统一观念,统一思路,统一行动,这就涉及到团队文化,通俗的说,就是团队的“游戏规则”。


    “新官上任三把火”,制订团队内部的游戏规则,绝对是其中的“一把火”;这也是新官上'
  merge: -1
  img_proc: true
- pgno: 165
  md: '任必做的三件大事之一。


    "商场如战场"，令行禁止是其中很重要的一道准则。"无规矩不成方圆"，新官上任，必须尽快拟订出自己的 "游戏规则"，否则下面员工 "无令可行"，也就无所适从，无所事事了。


    从营销角度出发，新官制订的 "游戏规则" 原则上包括：财务管理制度、业务管理制度、组织机构设置和人员任免、绩效考核管理办法、团队文化、区域市场总体经营思路、人才梯度建设、内部管理制度（定额费用报销机制和考勤制度）等。应该说，这些文件类似于国家的
    "宪法"，是神圣不可侵犯的；同时，围绕这些 "宪法"，营销机构可以制订很多其他单独'
  merge: -1
  img_proc: true
- pgno: 166
  md: '的“法律”，从而诠释和丰富“宪法”的内容，并最终使得整个团队如同一人，“行动自如”，“收张有度”，真正将团队力量融为一体。


    如果新官上任不制订适合本区域的“游戏规则”，而是因循守旧，肯定没有多大的发展空间；当然，新官制订的“游戏规则”，一定得切合市场需求，同时对前期的文件，应该取其精华、弃其糟粕，而不能一棍子打死，那叫“刚愎自用”，是不合宜的。


    # 借势、造势出亮点


    营销讲究“借势”；如果没有“势”可以借，那么就要学会“造势”。同样的，对于新官来说，这个“新”字最多也只能适用两三个月；'
  merge: -1
  img_proc: true
- pgno: 167
  md: '两三个月后，"新官" 如果还打这个"新"字来推脱自己没有做好这个市场的责任，那么公司领导肯定是不爽的。


    所以，新官必须在上任后不久，就要有亮点；俗称"业绩"，也就是你这个"新官"能力和价值的体现。


    又因为"新官"刚上任不久，还不能娴熟运用单位的各种资源来做业绩，所以，新官在上任后，还必须学会——"借势、造势出亮点"。


    借势——市场或公司有这种"势"可以供自己"借助"。比如说，市场在热炒健康家电，而公司又恰好转出了某款健康家电，借这个"势"，"新官"可以调动单位资源，炒作一把，'
  merge: -1
  img_proc: true
- pgno: 168
  md: '既提高品牌知名度，提升销量，又能创造出“业绩”，给公司领导留下一个好的口碑。


    造势——市场或公司本来缺少可以借助的“势”，“新官”巧妙人为制造这种“势”，从而“闪出亮点”。比方说，“新官”在初步了解市场时，发现自己辖区内某个高端产品推广比较成功，于是加大力度进行更大强度的推广，并将经验和成绩一并汇报给公司，这时公司领导肯定会对“新官”有一个全新的、正面的评价！而这种评价和口碑，对“新官”后面的“施政”将有很大的裨益。


    需要提醒的是：新官上任伊始，不能为了追求更辉煌的“亮点”，而采取极端做法“催熟市'
  merge: -1
  img_proc: true
