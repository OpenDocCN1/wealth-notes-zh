- pgno: 83
  md: '到坑里去。比如，你在会议上提出的解决问题的方案，老板很是赞同，并且愿意在这个任务交给你去完成。同时，老板这边是希望你尽量在十天之内完成。而你为了让老板感受到了更优秀的才干，夸下海口，说你能够在五天或者更短的时间完成。如果你真能做到，证明你的实力很强。但是，你如果是在你没什么把握，高估自己能力的情形下做出的决定的话，其后果是很严重的。可能老板也看出来了，只是不想拆穿你而已。


