    处理好同事之间的经济关系相当重要。由于平时会在一起聚会游玩，发生经济往来的情况可能会比较多，最好的办法是 AA 制。当然，特殊情况下向同事借钱也没有什么不妥，但记得要尽快归还。如果经常向别人借钱，会被认为

    是个没有计划的人，别人会对你的为人处事产生不信任。记住不要轻易欠别人一块钱，并把这一点作为一个原则。当然也不要墨守成规，遇到同事因高兴的事请客时不要执意拒绝，同时记得要多说一些祝贺的话。'
