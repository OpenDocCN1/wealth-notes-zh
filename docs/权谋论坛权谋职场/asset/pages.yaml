- pgno: 82
  md: '# 一、不要空谈问题。


    在会议上，能够起来发言，是一个展现自己的好机会。并且老板让你发言，也可以看出老板对你的信任以及重用。因此，我们一定要珍惜这个机会。那么，这时候你一定要注意了，一定不要只空谈公司存在的问题。其实，老板在看到你的用心的同时，更希望你更够针对问题提出一些解决问题的方案与措施等。因此，只空谈问题反而会让老板觉得反感。


    # 二、不要高估自己的能力。


    当老板在会上让你发言时，你切记要符合实际，不要夸大其辞。否则，你很容易把自己带'
  merge: -1
