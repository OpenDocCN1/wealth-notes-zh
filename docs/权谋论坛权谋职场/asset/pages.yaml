- pgno: 90
  md: '# 领导规律'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# 一、领导方式的连续性


    罗俐特·坦纳鲍姆和沃伦·施米特认为领导方式存在着连续性。的领导者依据管理对象的不同而在一延长线的不同点上运作。从完全以领导为中心的低点趋向完全以职工为中心的高点。


    这种运动、运作存在着一种灵活性，领导者对一些员工可以采取独断的方式,而对另一些员工则采取民主的方式或参与的方式。


    # 二、几种领导方式


    由管理学家怀特和李皮特提出。他们认为存在三种基本领导方式。


