  md: '场”，那样造成的后果实在是太严重；新官在

    追求 “亮点” 时，一定要有条不紊的将自己的

    营销工作开展起来，同时在营销工作中，不断

    迸发出一些 “亮点”，这才是最佳的选择！'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 竞争规律'
  merge: -1
  img_proc: true
- pgno: 171
  md: '在自己力量还弱小的时候，千万不要选择过于强大的对手，以卵击石不会有好的结果。办公室是一个充满竞争的世界，这里没有田园生活，只有后工业时代的竞赛。每个人都无可避免地把自己置身于一场场竞赛之中，不是成功就是失败。


    同行如敌手，办公室如战场。在这个自然法则大行其道的世界里，每个人都艰难前行，努力把自己塑造成为一个强者。每个人都和身边的人竞争着，力争出人头地。


    研究竞争，就要弄明白以下问题：


    +   1.竞争的需要——虽然是竞争时代， 但能够'
  merge: -1
  img_proc: true
- pgno: 172
  md: '不竞争的最好不要引发竞争。多一个朋友多一份力量。我国古军事家就曾有言伤敌万，自损三千。打了再漂亮的仗，对自己来说，都是一种损失。竞争，除非是不得不进行的，否则少竞争为妙。如果“大黑熊”没有跑出来，两个人还是做好朋友来得爽快。


    +   2. 竞争的动力——让自己存活下来而不是为了打击对手。如非出于很强烈的需要，不要升级竞争。竞争在某种程度上会达成种平衡，升级竞争则把平衡破坏了，形成恶性竞争，这对双方都是不利的。


    +   3. 竞争的对象——选择好对手很重要。在自己力量还弱小的时候，千万不要选择过于强大'
  merge: -1
  img_proc: true
- pgno: 173
  md: '的对手，以卵击石不会有的结果。最好能选择弱小的对手，在打击对手中成长自己。资本主义法则中有一条就是 “大鱼吃小鱼” 。


    4.竞争的方向—— “快 、 “好” 、 “能干” 、 “聪明”都是相对的形容词，有的时候，知道自己竞争的对手是谁非常重要。有一些人盲目地定错了目标，结果在相反的方向上用错了劲，到头来，只能是功亏一篑。所以，很多时候，你的成功决定于你是否懂得寻找捷径。要成为顶尖人物，你不需要比所有的人强，只要强过自己的对手或者同行就行了，这样就足以使你显得出类拔萃。'
  merge: -1
  img_proc: true
- pgno: 174
  md: 5.竞争的方式——最好是和平的，彼此之间作君子之争。不要试图去展现小人伎俩，因为小人伎俩太简单，谁都会。你用小人伎俩去打击了别人，别人也能用同样的方法回敬你。办公室的人需要明白的一点是世界本来就是竞争的。在竞争中生活下来，保持一定的平衡，这个结果是最优的。相反，在竞争中大显神威，逼的人无路可走，实质是一种很愚蠢的行为。还是那句话：同行如敌手，办公室如战场。为了让自己在办公室中混得更好，为了让自己的人生能有更大意义，参考下军事理论著作，学一点战术本事，是很必要的。
  merge: -1
  img_proc: true
- pgno: 175
  md: 有一点需要注意的是，大千世界，无奇不有。面对竞争，不同的人选择了不同的方式。对于一些小人来说， 没有什么手段是不符合道德的，只要能达成胜利，就什么手段都使得出来。小人所占的比例，总该是比君子大得多的。身在办公室的你，可要小心身边的人了。说不准，他们哪个认为你和他形成了竞争，对他构成了威胁，欲除你而后快。落了什么把柄在他手里，你就吃不了兜着走了。
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 批评定律'
  merge: -1
  img_proc: true
- pgno: 177
  md: '领导批评下属常见的方式，除了暴脾气就没有什么新鲜花样了，当然还会有一些恶意的讽刺挖苦，但都没有暴脾气更让人难以接受。如果领导照这样的批评方式长此下去，就很容易影响员工的工作情绪，甚至导致优秀员工对自己做出众叛亲离的行为举动。那么，身为领导在工作中，应该掌握哪些批评的技巧呢？今天小编就给大家伙分享三个吧，详情如下：


    +   1、 肯定式的批评更容易让人虚心接受：就是在批评下属时，先对其某个方面上做出肯定，比如以往的工作成绩等，然后再引出员工不对的地方，这样可以让员工从内心更容易认清自己的错误，而不会因为逆反心理与领导针锋相'
  merge: -1
  img_proc: true
- pgno: 178
  md: '对，故意反驳死不承认。肯定式批评即可以提高领导的办事效率，还可以增进领导和下属之间的关系，让批评发挥出更大的价值，不比单纯地发脾气让员工知错认错更有意义和效率吗？这个小技巧，脾气暴躁的领导不妨试一试。


    2、综合式的批评更容易为人指明方向：下属在工作中犯了错，领导单纯地为错误而去批评，不是说不可以，但比较容易引下属的抵触情绪，即使是有错在先，但谁愿意别人在自己的伤口上撒盐呢？所以，领导不妨利用综合式的批评方法，即在为员工分析错误出现的原因，以及改正方法后，再明确指出员工的错误，'
  merge: -1
  img_proc: true
- pgno: 179
  md: '这样员工就不会再因为抵抗情绪而故意跟领导的批评过意不去了，那么领导的批评工作自然也就变得顺理成章，水到渠成了。


    +   3、诚恳式的批评更容易让人心存歉意：虽然是下属有错在先，但领导也不能先情绪化地批评下属。这样最容易导致，要么领导更情绪化，要么员工更情绪化，那结果肯定是不敢想象的了。如果领导先入为主地用诚恳式的批评方式去跟下属进行沟通，就会让下属在错误面前心存歉意，从而提高领导处理工作问题的效率和品质，下属也会的领导更加认可和拥护。所以批评不一定非得是暴脾气，换作更诚恳的一种语气，说不定就会换回来更大的转变。'
  merge: -1
  img_proc: true
- pgno: 180
  md: 可能有些领导批评员工采用暴脾气的方式，可能是性格使然，也有可能是为了显示自己的权力，不管是哪一种，都没有起到批评的真正意义。如果就是为了让员工对自己折服，而不是让员工对所犯的错有一个正确的认知，就完全没有进行批评的行为，因为除了激化矛盾外，还容易引起更大的情绪失控，不管对工作还是对员工管理，都将是难以估计的灾难。
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 提拔规律'
  merge: -1
  img_proc: true
- pgno: 182
  md: '在工作当中要想获得提拔，你必须明确的知道领导遵循的潜规则，通常情况下，领导是绝对不会告诉你，提拔干部的时候，他们都遵循下面这五个潜规则，如果你不能琢磨透这个背后的规律和道理，你是很难获得晋升机会的，我们来一起看一下是哪些潜规则制约了我们。


    【1】遵循放心至上的潜规则。


    这样的防失联V：357607890一个潜规则，贯穿在所有的干领导的人 心里面，不管表面上说的有多好，如果你不能 够让她放心，也就是给他制造一种安全感，你 是绝对得不到他重用的，所谓的放心其实也很
    简单，他能感觉到你的忠诚，也就是让他认为'
  merge: -1
  img_proc: true
- pgno: 183
  md: '你不可能背叛他，你做事，他能够把心放下，不会再提你操更多的心，也就是你总能把事情干好，所以你工作的第一个重点，就是让你的领导放心，这是获得重用和提拔的最重要的一个前提。


    # 【2】遵循以事为先的潜规则。


    大家往往被人性化管理所迷惑，事实上，不管哪一种管理方式，都要遵循以事情为优先衡量人的结果，也就是你人再好，关系再硬，如果你啥事也做不出来的话，没有哪一个领导会瞎了眼去提拔这样的人，所以做事是你获得领导认可的最基本条件。


    # 【3】遵循远近结合的潜规则。'
  merge: -1
  img_proc: true
- pgno: 184
  md: '我们一定要记住不管表面上领导演戏演得有多好，它一定是遵循这个原则的，也就是在他的心里面，绝对不会看当下你的情况是什么，而是看你有没有长远的潜质和潜力，如果你现在暂时还算可以，但是没有进一步提升的空间，他也不会提拔你的。


    【4】遵循亲疏排序的潜规则。


    这是人之常情，领导一定会按照和自己关系的亲疏来排序的，关系好的人，加上良好的表现，获得提拔和晋升的机会会更大一些，相反的情况下，你和领导总是保持着一一定距离，或者是私下也没有多少来往和沟通，基本上是没有太多被提拔机会的，除非你表现的过于优秀，关'
  merge: -1
  img_proc: true
- pgno: 185
  md: '键是你的能力再强，如果领导不给你表现的机会，你也不可能表现出太优秀了。


    【5】遵循宁空不滥的潜规则。


    这也是领导心比较狠的一方面，也就是说，领导在决定提拔一个人之前，一定是看符合不符合自己的要求，只要没有找到符合自己要求的人，宁肯让这些指挥控制，也就是他们遵循着一个宁缺毋滥的基本潜规则，所以在领导面前永远不要耍大牌，觉得非提拔自己不可，没有这一说，他就真的不提拔你，你一点招也没有。'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 表杨规律'
  merge: -1
  img_proc: true
- pgno: 187
  md: '1. 要表扬，就不要有批评。你想要表扬一位员工，就不要含有批评的味道，也不要说“但是”一类的话。又表扬又批评，对方只会记住“批评”不会记住“表扬”，不会达到“表扬”的目的。


    实际上，表扬就是一种“给予”，既然是给予，就要热情洋溢，理直气壮，不要吞吞吐吐，缩手缩脚，好像这样做有什么“舍不得”，或者对方“不应得”似的，让人心里不痛快，不敞亮。


    2. 公开表扬，宜对事不对人。是不是要公开表扬，这要分情况分场合，不能一概而论。有时你表扬了一个人，却打击了大片，这种情'
  merge: -1
  img_proc: true
- pgno: 188
  md: '况下,当事人也不会觉得受到表扬是一件多么光彩的事，表扬反而起到了消极的影响。


    公开表扬应多注重团体的价值和行为，以提升团体的能力和合作精神，团队而不是个人始终应该是我们关注的焦点和方向。所以，公开表扬要讲究技巧，以表扬事来表扬人，以表扬团队来表扬个人。


    3．如果公开表扬一个人，不妨先私下进行。


    并不是说公开表扬就一定要对事不对人，实际上，如果一个人的贡献和业绩非常突出，公开表扬也是必须的，旨在树立一个典型，倡导一种精神，宣扬一种价值。


    这种情况下，最好先私下单独与对方谈一次，'
  merge: -1
  img_proc: true
- pgno: 189
  md: '甚至可以提前做一些“铺垫”，在一定的范围内形成共识，再进行公开表扬。这会让对方感觉老板是真心信任自己，增加表扬的“隆重”与“惊喜”感，让表扬更加出彩。


    +   4．私下表扬，宜对人不做事。如果你觉得别人表现突出，让你很欣赏，但又不宜公开进行，那么可以私下进行，把对方叫到身边“说道说道”。特别是自己的亲信或身边人不易过多地公开表扬，这反而容易“孤立”你的亲信和身边人。


    私下表扬更多的是传递一种赞许和信任：你很优秀（因为你行，所以你做事也行）。因此，私下表扬着重于个人的成长，你也可以通过这'
  merge: -1
  img_proc: true
- pgno: 190
  md: '个机会向对方提出进一步的期望和目标。


    +   5．下属的人在哪，你的表扬就在哪。走出你的办公室，随时随地进行表扬。这与我们上面说的公开表扬不是一回事，这更像是“见面打招呼”。让表扬更加亲切、及时和具体，也更加有感染力。


    不要总是端着架子，扳着面孔，经常下去走一走，哪里有辛苦劳作的下属，就到哪里去，哪怕是一声问候也是莫大的激励。比如拍拍下属的肩，对下属的一些值得鼓励的行为和表现给予当面的赞许，也可以问候一下下属的家庭和生活情况等。


    +   6．下属的心在哪，你的表扬就飞向哪。表扬'
  merge: -1
  img_proc: true
- pgno: 191
  md: '的最高境界就是随心所欲，不是想怎样就怎样，而是要用你的心去追随下属的心，让表扬随着下属的“心”飞扬，让下属的心为你动起来。


    好的表扬一定能够说到对方心里去，知道对方心里想什么，需要什么。比如，当下属是一个积极向上的人时，可以把他带到老板面前“夸夸他”，这样会更加激励他的上进心；当你的下属远离家乡，或者很少回家的时候，就向他的父母或家人“说说他”，这样更容易打动对方，安心工作。


    7. 表扬作为手段，需要很好的谋划。实际上，表扬是无式可循的，你可以公开，也可以私下；'
  merge: -1
  img_proc: true
- pgno: 192
  md: 你可以表扬团队，也可以表扬个人。这需要你因人而异，依据不同的情况和不同的需要很好地设计一下，让你的表扬更加有效果。每个人的性格、需要，以及文化、背景都不一样，这就需要区别对待，不能一视同仁。比如，当你的某个下属是一个刺头时，可以先挫挫他的锐气，再找机会表扬他；当你的某个下属总是得不到表扬时，可以有意识地给他一些表现的机会，让他也“冒冒头”。
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 平衡规律'
  merge: -1
  img_proc: true
- pgno: 194
  md: '在单位搭档，一般人通常简单注意他人的缺陷而疏忽他人的利益及利益。因而，发现他人的利益并给予由衷的赞许，就成为单位可贵的美德。不管对象是你上级、搭档，仍是你的下级或客户，没有人会由于你的赞许而动气发怒，一定会心存感谢而对你发生好感。


    巧妙地运用阿谀手法，让你的上级赏识你，让你的搭档协助你，让你的作业得以顺利完成，为每个人营建一种和谐的单位空气，一起不失去自个做人的庄严和涵养，作业的成功也就离你不远了。


    犹太人有一名言语应当牢记在心：“唯有赞许他人的人，才是真实值得赞许的人。”'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 阿谀要适度


    但在单位里，有些人的“赞许”总让人感到恶心。他们总像套着一个面具，不分场合和时刻，凌趣遇到的每一个人，什么过头的话都说得出口。他们以为向上司大献殷勤就能垂手可得地得到提高，而不想通过努力作业而获得成功。聪明而有品格的人并不这么以为。阿谀他人并不是作业的悉数，仅仅树立杰出的人际关系，使自个的作业得以顺利完成、意图得以顺利实现的一种办法。让周围的人厌烦，对自个有什么好处呢？而光静心干活一声不吭，成果就会被那成天吱吱喳喳的“马屁精”占为己有去邀功了。因而，阿谀并不是要让你不分场合地乱'
  merge: -1
  img_proc: true
- pgno: 196
  md: '拍一气，成功的阿谀是一种待人接物的窍门。但千万不要把马屁精误以为朋友。他们仅仅使用你。一旦到达意图，就会把你一脚踹开。请认清下面种马屁精：


    附合上司或搭档提出的每一件事，常常说的一句话是“我彻底拥护”。从不宣布不附合见或建议。


    常常赞颂上司或搭档，并且用降低自个或其他上司搭档的办法来赞许，一起表情丰富，挂着夸张的笑脸。


    用赞许的言语来使你为他就事，不应表彰的时间也大都欣赏，而对自个的平凡想方设法地讳饰。'
  merge: -1
  img_proc: true
- pgno: 197
  md: '有意在上司面前出搭档的洋相而获取上司一笑，使自个出风头。


    假如上司说了笑话，哪怕是很难堪的言语，他们也会笑得像真的相同。


    作业时挑精拣瘦，但老是说自个干的作业最主要最吃力。


    阿谀应当是发自内心的真挚的赞许，是自然而然的好心的做法，不需要你费尽心机，挖空心思，常常是脱口而出，信手捻来的言语。


    把每一次赞许当作一次学习的过程，把他人的利益作为自个仿效的榜样，他人也就会很愿意地协助你。一起，在实践中学会更自然地表达自个的好意。'
  merge: -1
  img_proc: true
- pgno: 198
  md: '# 职场规律


    对他人的定见不要立即标明附和，给自个一段时刻，表现出你的谨慎和详尽，然后给他人进一步标明定见的时机，让他们说服你，这么你的附和就会显得更具价值。


    在任何场合，对任何人，都要用恰当的办法加以阿谀，你能够把它看作是对将来的一笔出资。哪怕是其他部分领导，或是你所讨厌的人，也应当对了解的利益加以欣赏，这么会给你带来回报。


    阿谀不光是说好话，并且是说好听的话，问好、商议、关怀、敬重的口吻同样是阿谀。


    假如你不信任对方，以为对方不值得赞许，就不必去赞许，虚伪的赞许会使自个陷入无法脱'
  merge: -1
  img_proc: true
- pgno: 199
  md: 节的困境，而对方也会觉得你在嘲讽而不是阿谀。
  merge: -1
