- pgno: 118
  md: '规律 8：尊重沟通对象的权力


    每个经理人都是各自管辖范围内最有权力的决策者，而他们也期待别人尊重他的这种权力。因此，当你在进行横向沟通时，一定要挑对象。


    举例来说，你们最新的网络营销计划下周就要上路了，但是信息部门的网站建置还未完成。这时，不要心急地马上跑去找负责的工程师，你应该去找他的主管，进行协调，找出解决之道。


    总之，跨部门沟通时一定要注意彼此位阶的对应关系，以免造成不必要的误会。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 规律 9：善用幽默


    幽默可以做沟通时的缓冲剂，也可视为一种防御机制。当你必须呈现可能会触犯到他人的事实，或是要沟通棘手讯息时，以轻松或幽默的方式来传达，比较能保留对方的面子，也有助于正面的沟通。幽默使用法则的四条禁忌：


    +   - 不谈论对方家庭；


    +   - 不以人身攻击；


    +   - 不涉及组织敏感话题；


    +   - 幽默有度，点到即止；


    # 规律 10、确保沟通信息无误'
  merge: -1
  img_proc: true
- pgno: 120
  md: '当你针对某件项目或议题，进行完跨部门沟通后，务必要回到自己部门，向部属清楚传达最新进度与讯息。很多时候，跨部门会议中所决定的事项，必须交由各部门的一线人员去执行，因此，一定要确保所有信息传达无误，才不会让好不容易达成的共识大打折扣。为了确保沟通信息无误，管理者可以利用以下几个方法：


