    三看宴请的重要程度。若是普通的商务宴请，平均一道菜在 50 元到 80 元左右可以接受。如果这次宴请的对象是比较关键人物，那么则要点上几个够份量的菜，例如龙虾、刀鱼、鲥鱼，再要上规格一点，则是鲍鱼、翅粉等。


