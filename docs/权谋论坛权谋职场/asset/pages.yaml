- pgno: 67
  md: '作为下属，与领导汇报工作是对下属的基本要求，也是每一位下属的任务。但你知道找领导汇报工作也是要讲技巧的吗？如果不讲技巧，一通瞎讲，如果有什么特别的贡献会因为它自己说不清而被领导忽略；而有一些问题不大的错误，也可能因为领导理解有误被领导方法。想要避免这种情况，和领导汇报好工作，就必须掌握汇报工作的技巧；下面小编就来为大家分享，工作中汇报工作的四个技巧，来帮助大家尽快得到领导的提拔，想要学习的朋友们，赶紧跟随小编一起来看看吧！


    # 一、汇报工作要突出亮点


    大家在职场中要明白一个道理，汇报工作'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 职场规律


    不是一件简单的向领导汇报结果的事情,它同时还是自己向领导展示自己的一次机会,而领导在听下属汇报工作时,也不可能只关心结果一点。所以大家再与领导汇报工作时,就应该尽量突出自己的工作上的亮点,像是自己为公司做出的贡献，又或者是自己在工作上的创新,相比于结果,领导往往更关心这些。如果能在汇报工作时做到这一点,将会是自己很大的一个加分项,久而久之,领导也会认可自己的能力,而渐渐受到领导的重用。


    # 二、汇报工作时把废话说明


    与领导汇报工作时,往往不会有太多时间供你把每件事讲清,但是汇报工作上有不可避'
  merge: -1
  img_proc: true
- pgno: 69
  md: '免的会有些废话要讲，如果整篇工作汇报都是废话，让领导找不到重点，领导是非常厌恶这种汇报的。所以想要在汇报工作时有好的表现，语言上应该尽量精简易懂，自己汇报中的那些废话要尽量说清楚，做到该着重讲的部分多费些口水，不值得讲的部分一笔带过就好。


    # 三、汇报工作时立场要坚定


    在和领导汇报工作时，领导也有可能会是不是插上几句话，问问一些你的理解看法，大家要明白这个时候领导其实是在试探你，此时最重要的就是坚定立场。这也是很多人在汇报工作时常犯的错误，在被领导打断时，被领导追问，就对自己的观点立场产生怀疑，于是想'
  merge: -1
  img_proc: true
- pgno: 70
  md: '要自圆其说 ,其实在领导看来 ,不管你怎么圆，

    你都是一个对自己不自信，摇摆不定的人了，

    对你的感官会大大降低。所以在和领导汇报工作时，切记立场要坚定。


    四、汇报工作前后要一致


    汇报工作，是长久要做的的一件事 ,没有人汇报过一次后就不用汇报了 ,所以长远的事就需要有远长的目光和打算。领导都不是傻子，如果你汇报工作一次两次前后说法不一致，还可以原谅，但如果你长久之来汇报的工作每次说法都不同，那么领导肯定会起疑，怀疑你每次汇报的工作都是在即兴发挥胡说八道。而如果能做到每次汇报工作都前后一致，'
  merge: -1
