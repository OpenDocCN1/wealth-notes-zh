- pgno: 39
  md: '# 从小白到魔力演讲家之路《全球疯狂演讲》麦克风一响,黄金万两!


    式开展了“打土豪，分田地”的革命斗争。


    请问这句话说给谁听？说给农民听。


    农民最需要的是什么？土地。


    当时的他们有土地吗？没有。


    没有怎么办？跟着一起打土豪，就可以分到土地了。


    说话的目的是什么？让更多的人拥护共产党、加入共产党，


    帮助更多的人过上好的生活。


    ![](img/3217947958f819d87eca9055b3404772_39_0.png)


    # (2) “凡是敌人反对的，我们就要拥护；凡是敌人拥护的，我们就要反对。”


    1939 年抗日战争进入相持阶段,汪精卫提出“反蒋、反共、亲日”,对此毛爷爷于 1939 年 9 月 16 日在《和中央社、扫荡报、新民报三记者的谈话》中说道：“汪精卫有三个口号：反蒋、反共、亲日。汪精卫是国共两党和全国人民的共同敌人。共产党不是国民党的敌人，国民党也不是共产党的敌人，不应该互相'
  merge: -1
  img_proc: true
- pgno: 40
  md: '反对，互相限制，而应该互相团结，互相协助。我们的口号一定要和汪精卫的口号有区别，一定要和汪精卫的口号对立起来，而决不能和他相混同。他要反蒋，我们就要拥蒋；他要反共，我们就要联共；他要亲日，我们就要抗日。凡是敌人反对的，我们就要拥护；凡是敌人拥护的，我们就要反对。”


    当时最大的敌人是日本侵略者和汪伪政府，对于共产党来说，要把大家的斗争注意力集中在最主要的敌人身上。对于和曾经的敌人蒋介石合作，当时有很多人是不理解的，但是毛爷爷英明地提出这句话来化解大家心中的疑虑与芥蒂。


    ![](img/3217947958f819d87eca9055b3404772_40_0.png)


    (3) “前途是光明的，道路是曲折的。”


    重庆谈判期间的毛爷爷，有一天专门会见了后来成为亲密诗友的郭沫若，正是在这天的谈话中，毛爷爷说了一句后来人'
  merge: -1
  img_proc: true
- pgno: 41
  md: '们十分熟悉的话：“前途是光明的，道路是曲折的。”


    这句话是对谁说的？是对当时在全国有政治影响力的人物，是对关注着国共谈判的全国人民，尤其是对支持共产党但又为共产党的处境担心的人说的，目的很简单，就是鼓舞人心。


    ![](img/3217947958f819d87eca9055b3404772_41_0.png)


    # (4) “一切反动派都是纸老虎。”


