  md: '以前有一位学员是小学的语文老师，来参加一诺老师《演讲的最高境界》课程之后感触很深，她说：“过去我在点评孩子们的作文的时候，经常告诉他们，请把你的感觉写出来，但我从来没有教过他们怎么写他们的感觉，我们的教材上也没有这门技巧。通过一诺老师的课程，我总算知道我要怎么教他们写感觉了，就用一诺老师的五觉魔法。”


