  md: '# 从小白到魔力演说家之路《全球疯狂演说》 麦克风一响,黄金万两!


    他希望在清晨的第一缕阳光出现的时候，小镇的居民会高兴地看见他的到来。可是小镇里的人一看到他，就撒腿跑回家，还把家里的垃圾抛向他。


    “事实”哭泣着逃离了这座小镇，跑进一片大森林。清理干净身上的垃圾之后，循着阵阵欢声笑语，他又走回森林旁。


