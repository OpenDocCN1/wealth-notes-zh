- pgno: 275
  md: '# 第 106 课：情感煽动


    # 真感情胜过好文章


    有一句话说得非常好：真感情就是好文章。


    演说家要用真情实感来讲话，讲的是发自内心的想法。演说不仅仅是语言文字、声音语气、身体语言的沟通。


    ![](img/3217947958f819d87eca9055b3404772_275_0.png)


    很多人演说技巧一般，但情感充足，他的演说同样受欢迎。


    一诺老师就见过很多这样的例子。撒贝宁主持过一档节目，叫《开讲啦》，请的都是些社会名人，包括企业家、明星、专家等。这个节目里的嘉宾讲述的自己的亲身经历，很多都很感人。


    一诺老师的一位亲传弟子叫阿明，参加了“冠军杯”演说比赛。决赛在北京某院校举行，最后公布名次时，阿明获得了一等奖。活动结束后，其中一位评委老师过来和阿明交流，他说：“这位肖同学，你知道吗，你的演说内容已经完全跑题了，'
  merge: -1
  img_proc: true
- pgno: 276
  md: '但为什么你还是能得第一名？那是因为你把我们每一位评委都感动哭了。”


    ![](img/3217947958f819d87eca9055b3404772_276_0.png)


    如何学会这个技能呢？方法如下。


    # (1)打开自己内心


    放开自己，允许自己在演说的过程中把情绪表现出来。


    有很多Sul因放不开，所以肢体语言生硬，声音语气没有变化，故事自然就讲述得不够生动。


    如果感觉这方面比较难突破，可以参加教综技术类或身心灵类的课程，通过体验的方式来提升自己的情绪表现能力。


    # (2)情感题材练习


    多寻找一些情感比较强烈的故事题材进行讲述的练习，让自己慢慢习惯在演说中调动自己的情绪。比如，创业者可以多讲讲自己的创业初心、企业的使命感、要给行业带来什么改变。


    当然，讲述这些都是要发自内心的，强编出来的内容只会'
  merge: -1
  img_proc: true
- pgno: 277
  md: '使别人反感。


    # (3)背景音乐渲染


    在演讲时播放一些抒情的背景音乐，这样可以让情绪更容易调动起来。我们看过很多的选秀节目，选手在落选的那一刻有那么悲伤吗？其实没有，都是被现场的悲凉的音乐渲染的。


    在《非诚勿扰》节目里，男嘉宾失败就失败，这也没啥，可是在他退场的时候响起一句“可惜不是你，陪我到最后”，你就感觉气氛很悲凉了。


    ![](img/3217947958f819d87eca9055b3404772_277_0.png)


    # (4)静心准备演讲


    在准备演讲内容的时候，让自己处在一个安静的环境里，完全静下心来思考：最想分享的是什么？最想告诉他们什么？当你用情感分享时，你跟听众就很容易形成情感的连接，我相信你会很享受这种美好的感觉。'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 第107课：实战演练


    # 从菜鸟到高手的唯一距离


    在一诺老师的演说课堂上，有一个对决环节，每个人都要用我们在课堂里教的方法上台去讲自己的产品，给每一个人的时间是3分钟。


    有部分同学时间把控能力很弱，或是2分钟不到就讲完了，或是3分钟到了才讲到一半，或是内容跟时间的比例很不匹配。


    每当见到这种情况，我就会问他们，上台之前自己练习了几次？他们的回答基本上都是练习不超过2次。


    因为只要练习过2次以上，如果存在时间把控问题的话，自己肯定可以发现，然后及时做出调整。当然，更让一诺老师痛心的是，很多演说家没有练习过就上台演说了，结果讲得很糟糕，浪费了获得融资的大好机会。


    ![](img/3217947958f819d87eca9055b3404772_278_0.png)'
  merge: -1
  img_proc: true
