- pgno: 94
  md: '# 第30课：催眠客户1


    # 如何用演说削弱客户原有的信念


    改变客户的信念不一定非要推翻客户之前的信念。通过演说的手段，削弱客户原有的信念也是改变客户信念的方式之一。


    对于销售人员来说，当遇到对品牌和产品不够满意的客户时，很多人在第一时间想到改变客户的信念。


    实际上，人的信念并没有那么容易改变。


    除非能够用现实中真实可靠的证据，来证明客户原有的信念是“错误”的，否则在一般情况下，很少有客户会在与销售人员短暂的谈论中彻底颠覆自己的观念。


    ![](img/3217947958f819d87eca9055b3404772_94_0.png)


    但是削弱客户原有的信念则简单得多，通过演说中简单的观点、简单的例子，只要能够击中客户信念中脆弱的部分，就能够在一定程度上动摇客户原有的信念。'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# 第31课：催眠客户2


    # 如何用演说转移客户信念的焦点


    转移客户信念的焦点同样也是改变客户信念的方式之一。


    演说转移客户信念的焦点的模式有三种：


    # 第一种转移客户信念的焦点模式


    彻底颠覆客户的信念，让客户的信念完全变成演说家的信念；


    # 第二种转移客户信念的焦点模式


    通过转移客户的关注点，进而间接转移客户的信念。


    # 第三种彻底颠覆客户的信念：


    这种模式是多数职业演说家惯用的模式。因为职业演说家积累了足够的资料和经验，并且在长期演说过程中使自己的信念系统强大到能够带来颠覆性的影响。


    ![](img/3217947958f819d87eca9055b3404772_95_0.png)'
  merge: -1
  img_proc: true
- pgno: 96
  md: '# 从小白到魔力演说家之路《全球疯狂演说》 麦克风一响,黄金万两!


