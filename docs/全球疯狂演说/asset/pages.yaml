  md: '# 第83课：五觉魔法


    如何调动听众的五种感官


    讲故事的过程，如果要让听众感同身受，是需要一些技巧的。如何让听众更好地体验到你所想要表达的感受呢？这就需要把我们的感受表达得具体一点。


    五觉魔法可以帮助我们完成这件事。


    首先我们来看看所谓五觉是哪五觉？


    ![](img/3217947958f819d87eca9055b3404772_235_0.png)


    分别代表着我们眼睛看到的、耳朵听到的、鼻子闻到的、舌头尝到的、皮肤触碰体验到的。


    五觉魔法就是让我们把这五种感官的感受具体地表达出来。


    一诺老师在课堂里喜欢这样举例子——


    一诺老师问大家：“谁去过海边？来给大家介绍一下来到海边是什么感觉？”'
