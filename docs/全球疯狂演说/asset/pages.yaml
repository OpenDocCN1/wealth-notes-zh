    让自己成为一个无愧于时代的高尚的人！


    在用高潮号召的时候，可以融入一个技巧，叫作“排比”。


    排比是一种修辞手法，把意义相关或相近，结构相同或相似和语气相同的段落并排(两段即可)，或者词组或句子并排(三句或'
