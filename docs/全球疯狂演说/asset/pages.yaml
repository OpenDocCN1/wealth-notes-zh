  md: '# 第35课：战胜恐惧


    # 演说恐惧的原因及自我诊断


    英国的科学家曾经做过一个实验，他们对 2000 位读者做了一个调查，题目是：你最害怕什么？


    30%的人回答最害怕的是死亡，排名第二。


    15%的人回答最害怕的是贫穷，排名第三。


    12%的人回答最害怕的是疾病，排名第四。


    而排名第一的，居然是演说，高达 35%的人选择了这一项！


    ![](img/3217947958f819d87eca9055b3404772_106_0.png)


