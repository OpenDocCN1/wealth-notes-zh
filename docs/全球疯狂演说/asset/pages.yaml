  md: '# 第46课：故事外衣


    # 演说家必须学会用 “故事” 包装 “事实”


    故事和事实有什么不同吗？为什么要用故事包装事实呢？


    让我们从一个故事开始学习—诺老师的课程吧！


    “事实” 赤裸着走进一个小村庄，村子里的居民一看见他就开始不停地咒骂。他们叫骂着把 “事实” 赶出村子，“事实” 沿路来到了一个小镇。但是那里的人仍然朝他吐口水，辱骂他，给他起难听的绰号，再一次把他赶了出来。


    “事实” 继续向前走，孤独而又悲伤，沿着空无一人的道路走向下一个城镇。


    ![](img/3217947958f819d87eca9055b3404772_156_0.png)


    他仍然希望能遇到一个人，看到他会觉得非常开心，会愿意张开双臂拥抱毫无遮掩的他。


    午夜时分，他来到了第三个小镇。'
