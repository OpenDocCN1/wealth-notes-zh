  md: '# 第04课：演讲内容


    # 先搞清楚说什么,再去研究怎么说


    说什么,也就是演讲要呈现什么,演讲的内容要怎么布局。


    有了演讲的目的和演讲的对象,才能编排演讲的内容。诺老师认为,演讲内容是为目的和对象服务的,是利他的!


    ![](img/3217947958f819d87eca9055b3404772_38_0.png)


    有一位伟人,他说话前非常了解自己的目的,也非常了解对象,所以才能设计出精彩的说话内容,他就是毛爷爷。


    我们来看看他老人家的几句话


    +   (1) “打土豪，分田地。”


    这个口号是中国共产党领导的中国工农红军在土地革命战争时期提出的主要宣传口号之一。它不仅表明了红军的政治主张,同时也深刻反映了毛爷爷对中国农民问题的深刻认识和独特见解。毛爷爷从1928年3月开始,在瓢(lǐng)县的中村,正'
