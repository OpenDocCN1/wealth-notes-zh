  md: '农村互联网和互联网金融比较容易产生大机会。农村互联网就是把中国互联网下沉到县城一级，把中国在一、二线城市的商业模式向县城一级进行复制。这为什么会成为一个机会？因为信息流需要连接的地方只会越来越多。


    ![](img/3217947958f819d87eca9055b3404772_199_0.png)


    点是什么？


    是用数字罗列讲话的条理，如上面提到的 (1)、(2)、(3)。


