- pgno: 282
  md: '好办！一诺老师有绝招！


    那就是把这些话读出来，当你读到非常熟练之后，把这些演讲录出来，然后讲课的时候，带着耳机，一边听自己讲的，一边跟着说……（捂脸）


    一诺老师曾经一位亲传弟子叫一道，他开课总是满头大汗，为什么？因为他总是紧张，一年下来也赚不到30万！


    后来一道跑过来请教我说：“一诺老师，我总是紧张，因为我总是忘词，请问一诺老师有没有高招？”


    一诺老师立刻教他这个方法，结果他如法炮制，居然在下一场演讲直接现场成交300万！


    ![](img/3217947958f819d87eca9055b3404772_282_0.png)


    一诺老师发现，就算是没有太多讲课基础的老师，也能够达到较高水平。


    当我讲到这里，很多亲传弟子就问我说：“请问一诺老师，什么样的练习才是最有效的？”'
