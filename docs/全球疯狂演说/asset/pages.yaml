  md: '# 第 47 课：故事之美


    故事能够接近事实却又不去揭露事实


    正如你马上要看到的或者偶然看到的那样，在讲故事的过程中，我们发现了故事的力量。这使我们意识到，那些曾经经历过的，以及正在经历着的故事，是最有力的交流武器。为什么？


    当然，原因有很多，但其中最重要的在于讲故事的目的。


    正如前面的故事所揭示的。


    ![](img/3217947958f819d87eca9055b3404772_159_0.png)


    故事能够激励人并引起共鸣，使听故事的人参与到价值观和信念的交流中，而不是直白地揭露或简单地告诉人们价值观和信念是什么。


    当然，所有的故事都在试图告诉我们一些事情。


    无论故事讲述的是爱情、勇气还是自由的重要性，它向我们传达的一直都是人类基本的价值观。'
  merge: -1
  img_proc: true
- pgno: 160
  md: '但故事之美在于它不会敲着我们的头指指点点，而是将事实娓娓道来。


    如果把每个人和每件东西比作品牌，那其实我们都有自己的目的。然而这个目的动机往往过于直白、露骨，而且常常受利益驱使。如果我们不急功近利，把眼光放长远，就能着眼于更有感染力的东西，而不是只在乎那些可以使产品变得更好、更强、更持久、更便宜的数据。


    我们开始着眼于信念、哲学思想或者可以彻底改变品牌形象的因素，不是去告诉人们思考什么，而是给他们提供一些值得思考的东西。正如我们希望尽可能与故事中的人物建立情感联系一样，我们也同样可以与品牌建立起这种关系。


    这样，品牌自身的重要性就会超过其功能性上的优势。


    ![](img/3217947958f819d87eca9055b3404772_160_0.png)


    当我们购买了一个品牌的产品，从某种意义上说，也就参与到这个品牌中来。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# 从小白到魔力演说家之路《全球疯狂演说》 麦克风一响,黄金万两!


    反过来説，我们也可以把品牌和它所代表的一切带入我们的生活里，并通过品牌向别人讲述我们的故事。


    ![](img/3217947958f819d87eca9055b3404772_161_0.png)


    但必须承认的是，这个概念会很难理解——如果我们已经形成思维定式，认为自我形象与产品形象的提升必须要创造性地表现产品的优势和好处。当然，这非常重要，但我们首先是产品，其次才是消费者。


    虽然我们希望产品可以为我们做得更多、更好、更快，或者更省钱，但最重要的是，我们一直在不断探寻品牌的内在意义。把品牌看作故事，我们便有机会更好地发掘品牌的意义，而不是单纯地将其看作待售的产品。


    然而，如果要真正地讲述一个品牌的故事，必须要先了解这个品牌。我们必须去观察、去聆听、去真正地感受它，因为它就在那里，而不是因为人们告诉我们他们希望它在那里。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 第 48 课：故事逻辑


    # 讲故事究竟有什么秘诀


    这是一个经过精心筹划的过程，借此可以了解品牌，而讲故事的方式又有助于了解自己。


    同时它也有助于了解品牌的前景，建立长久的、不受任何竞争宣传影响的客户关系。


    ![](img/3217947958f819d87eca9055b3404772_162_0.png)


    讲故事没有什么诀窍。你不需要学习 4 个音节的复杂词汇或是理解那些象牙塔里的理论。它非常直观而且容易理解。


    它以引起听众强烈共鸣的方式，解决实际运作中遇到的问题。顾名思义，讲故事的方式植根于故事的逻辑，就像心理学家揭示的那样，是我们思维的一部分。


    一旦意识到它的存在，我们就能更有效地运用它。'
  merge: -1
  img_proc: true
- pgno: 163
