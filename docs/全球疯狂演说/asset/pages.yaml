    这事情让一诺老师印象颇为深刻。吕总因为受过很大的打击，觉得自己不行，所以会产生一系列的恐惧。


    一诺老师要做的，就是让他重新觉得自己行，最好能把源头“高总觉得他不行”给清理掉。


    “问渠那得清如许？唯有源头活水来。”


    源头干净，流水自然清澈。


    ![](img/3217947958f819d87eca9055b3404772_135_0.png)


    自己肯定自己，需要我们一次又一次地完成自己认为有难'
