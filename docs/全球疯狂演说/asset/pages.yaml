- pgno: 82
  md: '# 第 25 课：转换能量 3


    # 换框法：将负能量转换为正能量


    换框法就是在原有框架的基础上，将负面能量转化为正面能量，从而使信念更加坚定的方法。目前主要的换框法有两种，分别为意义换框法和环境换框法。


    # ★意义换框法：


    所谓的意义换框法指的是“找出一个负面经验中的正面意义”。一诺老师在《改变命运》的课程中讲到：“世界上所有的事情本身是没有意义的，所有的意义都是人定义的，同一件事情里总有不止一个意义包含在其中。”


    ![](img/3217947958f819d87eca9055b3404772_82_0.png)


    根据这项概念基础，当演说家面对某些事和物让信念系统产生动摇的时候，可以试着去换个角度，找出最能帮助自己的意义。'
  merge: -1
  img_proc: true
- pgno: 83
  md: '这样就可以把外界环境带来的负面影响转变为正面能量，


    并使自己获得进一步的提升。


    # ☆环境换框法：


    所谓的环境换框法就是在同一件事或者物的情况下找到更有利于自己的环境，然后就能够改变这件事或者物的价值，进而改变自己的信念。


    > 一诺老师老师在《改变命运》课程中讲到：“中国传统思想中有很多表面上是绝对正确的说法（其实都是规条），把人们牢牢地束缚着，运用环境换框法，可以打破它们。”


    ![](img/3217947958f819d87eca9055b3404772_83_0.png)


    一诺老师发现，站在演说家的角度，很多规条确实对人的成长有所帮助，但是规条同时也让演说家失去了变通的能力，进而阻碍了更加宽广的发展道路。'
  merge: -1
