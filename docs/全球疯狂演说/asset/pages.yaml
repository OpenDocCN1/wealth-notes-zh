  md: '# 第51课：亲身经历


    讲自己亲身经历过并具有启发性的故事


    以下是一诺老师的某个学员分享的亲身经历：


    大概是十几二十年前，我在单位混得不错，还当上了项目负责人。


    有一天，我们单位新调来一位领导，单位为此举办了一个欢迎仪式，上级安排我去做主持人。


