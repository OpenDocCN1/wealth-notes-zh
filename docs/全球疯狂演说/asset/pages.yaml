    所谓的“托付心态”实际上就是过分依赖他人。所有人都是通过依赖他人成长起来的，小的时候依赖父母的喂养，在学校依赖老师的教导，工作后依赖同事的帮助然而过分的依赖会让个人的信念产生动摇，甚至会磨灭个人的信念。


    因此，每个人都应该尽力照顾自己的人生，只有不假他人才能让自己变得独立，并且让自己的信念变得更加强大。


