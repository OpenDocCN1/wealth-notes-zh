    # 希思兄弟决策指导思想


    希思兄弟把这决策过程的指导思想，总结成四句话：


    +   1. 扩充你的选项；

    2. 用现实检验你的观点；

    3. 从长远考虑；

    4. 为一旦决策错误做好准备


    用中国话来说，这四步就是第一奇计百出、第二实事求是、第三从长计议、第四未料胜先料败 —— 古代最厉害的谋士，也不过如此吧？


    复习： 到底什么是厉害的决策法


    # 保金斯基试水三原则


    也许科学决策的一个高级用法，就是“不科学”决策。


    对实干家来说，并没有什么“谋定而后动”的决策。实干家的决策都是一个动态的过程，你先动起来，看看情况再调整。


    保金斯基特别主张试水！保金斯基提出，用试水的方法创新，有三个原则：


    +   1. 尽可能地尝试新事物；

    2. 尝试要可控，要确保试验不给我们来灾难性的后果；

    3. 获得反馈，从结果中学习，随时调整做法。


    咱们想想这三条，这不就是中国人爱说的“摸着石头过河”吗？保金斯基，是实干者的先驱。


    复习： 实干家不需要精确调研


    # 然而……


    研究发现，决策理论水平和决策操作水平是两码事，所罗门悖论确实存在。


    而主动切换视角，是科学决策的最有效手段。


    说一千道一万，真正的决策水平还得在实践中提高。不过话说回来，读书也不是真没用。做事演绎可以决定你的成熟度，但读书可以决定你的格局。


    这不是想法问题，这是气质问题。不以物喜不以己悲，雍然临之而不惊，无故加之而不怒，这样的人才可以指望他做决策。'
