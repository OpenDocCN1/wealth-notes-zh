  md: '# 日课205 | 启蒙与此时5: 正常国家和资本主义国家（下）


    今天咱们继续说启蒙运动。根据戈德堡在《西方的自我》这本书中的观点，资本主义，是一种“不正常”的国家形态。


    正常国家讲强权，资本主义讲契约。正常国家有官方的意识形态，资本主义讲理性。正常国家沿袭传统，把所有意识统一起来，而资本主义实现了精神上的劳动分工，把不同的意识分开。


    那资本主义既然这么不正常，它到底是怎么产生的呢？按一般理解这不是什么神秘的问题，只要各方面条件满足、时机成熟，比如说生产力达到一定水平、人民的文化知识达到一定程度，启蒙运动和资本主义自然就会发生。但是戈德堡不这么看。


    重返历史现场，你会发现有些发生了的事情并不是必然要发生的。历史充满偶然性，结果往往不在参与者的意料之中。更进一步，一百年和更早之前的传统解释——比如马克思·韦伯的“新教伦理”论和卡尔·马克思的“剩余价值”论，也未必就是当代学者的共识。


    戈德堡考察当今学者的最新认识，认为资本主义能出现就是个奇迹，而且这个奇迹能不能长期存在下去还不一定。


    # 1.配方


    我们前面说了，与其说现代化反人性，不如说现代化改变了人性中各种成分的相对地位。资本主义非常反传统，但是构成资本主义的配方中的各种材料，也都能从传统社会中找到溯源。


    资本主义的配方中大概有以下这些东西


    +   * 私有财产权

    * 人的自由权利

    * 限制君主权力

    * 法治

    * 科技创新

    * 宗教宽容

    * 多元的政治机构


    所有这些东西，都曾经在启蒙运动之前的人类历史中的某个时期、某个地方出现过，只是它们从来没有同时在一个地方出现过。


    # 2.英国特殊论


    资本主义到底是怎么起源的，这个问题众说纷纭，但是有一点，学者们是达成了共识的，那就是现代化起源于英国。


    英国是一个特殊的国家。戈德堡甚至用“weird”，也就是“怪异”，来形容英国。英国学者丹尼尔·汉纳（Daniel Hannan）2013年出了本书叫《发明自由：讲英语的人如何制造现代世界》（Inventing
    Freedom: How the English-Speaking Peoples Made the Modern World），他总结了英国有利于产生资本主义的五个特殊之处。


    # 3.必然还是偶然


    我们专栏刚刚讲过朱迪亚·珀尔的《为什么》这本书，我们知道想要确定一个因果关系非常之难。事件 A 发生之后事件 B 发生了，你可不能就说 A 导致了 B 发生，你更不能说只要
    A 发生，B 就一定发生。英国满足五个有利于发生资本主义的条件，但是我们并没有一个科学理论说满足这五个条件就能发生资本主义。


    科学理论须可重复验证才行。历史上除英国之外，同样满足这五个条件的国家大概只有荷兰，而荷兰的确早早地就进入资本主义时代——可问题在于，荷兰距离英国实在太近了，这两个国家在历史上频繁地冲突，更频繁地交流，你完全可以说英国影响了荷兰。


    资本主义，毕竞只能被“发明”一次。'
  merge: -1
