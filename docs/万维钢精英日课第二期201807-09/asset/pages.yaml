    万维钢


    应该让孩子知道。学一点考试大纲以外的知识既不是吃亏也不是浪费时间，而是一件好事。它可以开拓思路、让孩子更聪明……这些寻常的好处我就说不了。


    我想说的是，如果孩子知道一些比老师讲的内容高级的知识，他会建立一个强大的自信心。要是这个知识连老师都不会，那就更好。


    他在这个问题上懂得比老师多，但是他不说。他静静地看着老师讲简单东西——而就这点东西还有很多同学面临学习困难。他会有一种优越感。这种体验，我看比什么“情商”、什么“性格养成”、什么“领导力训练”都有效。


