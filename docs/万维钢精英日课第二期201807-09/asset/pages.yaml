  md: '# 3.数学家的建议


    足球罚点球决胜和回合制的棋类比赛，现在都是按照 ABABAB……的顺序交替进行。可能早就有意识到这个顺序对B太不公平，所以网球比赛里的发球顺序是 ABBAABBA……第一轮你先发我后发，那第二轮就应该我先发你后发，对吧？


    但是数学家认为网球规则仍然不够公平。数学家发明了一种最公平的轮换制度，能最大限度地降低先发者优势。整个规则以三个数学家名字的首字母命名，叫“PTM规则”。思路是这样的——


    第一轮是 AB，第二轮就得反过来，变成 BA，所以前两轮是 ABBA。可t是如果 ABBA仍然有所偏向，那怎么办呢？所以接下来应该把 ABBA 再反过来，变成
    BAAB。这样前八场比赛就变成 ABBABAAB。


    那如果这还不够公平，那我们就再打八局，顺序跟前八局相反，所以16局比赛的顺序是 ABBABAAB、BAABABBA。


    所以数学家说为了公平，你应该要么就打8局，要么就16局，而不应该像足球那样打10局。


    当然国际足联未必能接受这个建议。不过《美丽的运动博弈论》这本书的作者居然专门组织了一项实验，找西甲的职业球员，模拟了三种规则下的点球决胜。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_3_0.png)


    结果是国际足联规则最不公平，网球规则次之，数学家的规则最公平。


    # | 由此得到


    心理压力真的能影响做事的结果，而且是负面的影响。因为心理因素，国际足联的点球决胜规则不公平，先发者有明显的优势。


    # | 我的评论


    我以前看过一些研究，说世界上的确有一些人，在压力之下反而发挥得更好，相当于于是比赛型的选手，而且这个是基因决定的。


    但是那些研究都是拿有压力和平时完全没压力的情况比。点球决胜已经有巨大压力，先罚后罚只是压力大小的不同而已。我想就算是 resíduos not afraid的人，也不会觉得压力越大越好。太大的压力肯定是不好的。


    本届世界杯小组赛西班牙对葡萄牙，C罗在赛前说了一句话。他说西班牙队本来就比我们强，这场比赛所有的压力都在西班牙队身上。他说的完全正确，比赛结果双方打平，C罗发挥无比出色——C罗，完全明白压力的学问。


    不知道在淘汰赛中输给呼声不如自己的乌拉圭队之前，C罗是否想起过这个压力理论。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_3_1.png)


