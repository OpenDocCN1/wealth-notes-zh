  md: '# 答读者问 | “有效市场假说”的三个级别


    答读者问 | “有效市场假说…


    # 来自日课：用足球验证有效市场假说


    请问万老师，股市是对一个公司的投资，公司是能产生财富的，而赌球不能，而买股票的人平均下来应该是挣钱的吧？


    万维钢


    这取决于你对“挣钱”的定义是什么。如果现在有一家公司，每年都能旱涝保收地产生固定的利润，比如每股10元，那么请问这家公司的股价应该是多少钱？理想答案是10元/银行利率。这是由于这家公司就相当于是个固定的现金流，买它的股票和把钱存银行一样，都能获得固定的收益。如果它的实际股价比理想答案高，人们就会卖了它的股票把钱存银行；如果它的股价比理想答案低，人们就会把钱从银行里取出来买它的股票。


    在这种情况下，尽管这个公司能生产财富，买它的股票也不能算“挣钱”——如果这也算挣钱，那把钱存银行也是挣钱。


