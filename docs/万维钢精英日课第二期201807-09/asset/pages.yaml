  md: '# 日课214 | 《赌博思维》3: 决策者的气质


    日课214 | 《赌博思维》3:决...


    今天咱們把安妮·杜克的《赌博思维》这本书讲完。这本书的篇幅不长，没有什么关于科学决策的细节技术分析，几乎整本书都在于讲主观的态度。


    我读这本书的时候经常想到一个跟决策没什么关系的东西：玻璃栈道。现在中国有很多风景区修了高空中的玻璃栈道，其实非常结实，但是人走在上面会有一种在空中踏步的感觉，可能会感到害怕。我看网上有很多人吓得别在栈道上不敢站起来、被人拖着走，有的大个人在栈道上咋哇乱叫。


    你可能觉得这是人之常情，但我们作为读书人，就得有点超乎常情的觉悟。那些人不可能 celeb. 他们明知道栈道是安全的，但是他们的理性控制不了感情。他们连一个栈道都无法战胜。


    # 1.当下的情绪


    我们经常说人不能被自己的感情挟持，要多讲理性。可是一个浪漫主义者会说，为什么非得压抑感情呢？人难道不是感情的动物吗？感情有啥不好呢？这些问题是合法的，人的确需要感情，你完全有权利把自己沉浸在某种感情之中——但是，感情会扭曲你对事物的判断。


    # 2.时间的朋友


