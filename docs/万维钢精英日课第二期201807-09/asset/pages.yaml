  md: '比精巧和复杂！蚂蚁能修筑庞大的城堡，有明确的分工，能采集能战斗，甚至还搞了畜牧业。蚁群不等于单个蚂蚁的简单相加，你甚至可以把蚁群想象成一个独立的智能生物。


    很多人猜测，人的意识，也是涌现现象。你不能简单用大脑神经元的运动解释意识，意识是高了一个层面的活动。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_70_0.png)


    操作通灵板是个涌现现象。每个人动作都是简单的，但是每一次都至少有一个人把指针推到了有意义的地方。也许推出关键方向的这个人 —— 显然他有可预测的眼球运动 ——
    并不是故意的，他只是看到指针距离那个有意义的字母已经很近了，觉得自己无非是最后帮一把。毕竟每个人对指针的控制都非常小，所以每个人都觉得指针不可能是自己推到那里去的。那到底是谁推动的？也许是鬼魂推动的！


    正确答案，是“涌现”推动的。如果某只蚂蚁有更高一点的智能，当它纵观整个蚁巢的时候，恐怕也会认为这个巢穴是什么神灵设计和制造的。


    微弱的控制感使个体无法理解群体的行为。


    这就是我想说的更高级的道理。其实这个诡异的、感觉有一只大手在操纵一切的幻觉并不仅限于通灵。


    比如说股市吧。我们看那些炒股的民间理论，特别喜欢谈论“庄家”。股价突然升上去了，一定是庄家在“拉盘”。股价突然下降，那就是庄家在“砸盘”。股价要是缓慢下降，那就是庄家在“慢慢出货”……


    人们幻想有个庄家躲在屏幕后面盯着股价冷笑。不管股价怎么变动都是他安排的，都对他有利。


    我就经常想，如果是一个小公司的股票，或许庄家还能操控一下 —— 可是像苹果公司的股票，请问哪个庄家能操控呢？


    你相信有人能随心所欲操纵苹果的股价，就等于相信鬼魂的能量可以移动通灵板的指针。你相信的是一种超自然的力量。


    事实上早就有做过计算机模拟。股市中的参与者寻常的操作 —— 没有庄家也没有大新闻 —— 就足以引起股价的波动，甚至有时候还是大波动。这种波动出来的曲线完全可以被人用庄家操纵
    —— 或者鬼魂控制 —— 来解释。


    除非你理解“涌现”。


