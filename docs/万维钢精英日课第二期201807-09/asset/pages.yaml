  md: '# 日课210｜启蒙与此时9:资本主义的掘墓人（完）


    今天咱们把启蒙运动这个小专题讲完。我们这个专题从启蒙运动开始讲，讲到了资本主义的起源和演变，以及它面临的困窘。平克告诉我们一个显然的事实——启蒙运动三百年来人类类正在不断进步，他是乐观的。戈德堡想得更多也更深，他是有点悲观的，认为西方正在自杀。最后这一讲我想先说一点自己的心得。


    以我之见，资本主义，是一个让好东西能够自动冒出来的机制。在经济上，它是自由市场。在政治和思想上，它是“你行你上”。


    而总结这几讲的逻辑，资本主义这个社会形态要被破坏，大约有三种可能性。咱们先说前两种。


    # 1.苏联经济为什么会失败


    第一种可能性，是好东西冒不出来。这就是“正常国家”和中世纪威尼斯共和国政变以后的逻辑。利益集团把持国家权力，直接垄断赚钱的业务，禁止颠覆式创新，让新人永远没机会。


    第二种可能性，是承认现在有更好的东西，承认应该创新，但是是拒绝“自动”——认为社会不能放任自流，好东西得由国家安排出来。


    关于这两种可能性，咱们举个例子，苏联。几年前有本影响很大的书叫《国家为什么会失败》，作者是德隆·阿西莫格鲁和詹姆斯·罗宾逊，这本书对苏联的经济命运有个很清晰的解释。


    苏联刚刚建国的时候，现代化水平远远不如西方。那么作为一个后发劣势，苏联领导人一看西方国家，就完全知道“好东西”是什么：那就是西方科技水平的工业化。那这个时候如果搞资本主义、等着好东西自动冒出来好像就太慢了——所以选择由国家大力推动，国家推动可能会犯各种错误，但是也许利大于弊。这就是我们刚才说的第二种可能性。


    于是苏联就把资源集中起来办大事，比如说牺牲农业去搞工业，牺牲轻工业搞重工业。事实上这个方法见效确实快，苏联经济高速增长，搞得美国经济学家泰山北斗级的人物萨缪尔森几次修改教科书，反复预测苏联经济将会超过美国。


    但是等到苏联经济有了一定家底之后，问题就出来了。国有企业踏踏实实就能生存，它自己没有创新的动力。


    这就又陷入了我们说的第一种可能性。等到八十年代，苏联的产品就全面落后了。老百姓买个儿童服装都觉得还是西方的 Merk好，而到最后居然连面包都出现了供应困难。


    所以从创新的角度说，苏联经济的教训是第一，落后国家因为能看到现代化的方向在哪，也许可以搞一些国家主导的进步项目；第二，但是这种搞法是有瓶颈的。


    对个人来说，谈创新一定要谈风险。对国家来说，谈创新一定要谈“破坏”。脱离风险和“破坏”去说我有多么热爱创新，那都是叶公好龙。


    # 2.资本主义与平等


    将来扼杀资本主义的第三种可能性，是人对“平等”的复杂情绪。


    资本主义讲好东西要自动冒出来，讲你行你上，那好东西要上去，行的人要上去，自然就有别的东西和别的人没有上去。启蒙运动的人人平等最多只能是人人面对同样的竞争规则，而永远都不可能是结果的平等。这也许是资本主义的一个本质缺陷，也许根本就谈不上是一个缺陷，也许人类社会的逻辑就只能是这样，也许将来物质极大丰富以后真的能人人结果平等，也许永远不可能。


    但不管怎么说，资本主义始终伴随着贫富差距。那么直观的推断，经济地位低的人会反对资本主义。


    以前的一个主流观点认为工人阶级将是资本主义的掘墓人。资本家生意越做越大，工厂越开越多，就需要雇佣更多工人，那么工人占社会总人口的比例就会越来越高，力量越来越强，终有一日就会夺取政权，建立一个工人国家。


    可是为什么美国的资本主义，没有按照这个剧本走呢？我们看到的好像不是无产者越来越多，而是中产阶级越来越多。这些人享受着很好的福利，很多多人持有公司的股票，他们和资本家的关系很和谐。很多中产阶级在一边工作的同时，还自己做点小生意。那你说他们到底是资本家，还是无产阶级呢？


    当然你可以说这是因为美国已经进入了帝国主义阶段，美国中产阶级的富裕生活是建立在第三世界国家无产者被剥削的基础上之上，但你也可能不必赞成这个观点。


    不论如何，工人阶级似乎没有成为资本主义的掘墓人。我倒是觉得“工人喜欢资本主义”也许是更符合事实的说法。


    在《西方的自杀》这本书中，戈德堡总结了几个现代学者的理论，认为资本主义的掘墓人，也许是……资本家的子女。


    # 3.白左的逻辑


    资本主义发展的过程中，随着经济条件越来越好，出现了一个新的社会群体，叫做“自由主义知识分子”。


    作为知识分子你不能赞美社会，赞美社会的言论没人爱听——你必须批评社会。自由主义知识分子贩卖的就是对社会的不满。那么既然身处资本主义社会，他们就要反对资本主义。


    这些人往往出身于比较富裕的家庭。一方面，他们把自己的优越生活当成是理所当然的。另一方面，他们认为西方国家在面对落后国家的贫苦人民时，有一种原罪——资本，是有罪的。


    这些人认为自己是全球公民，他们对本国的劳动者没什么感情，但是对别国的弱者充满同情。他们反对不受限制的经济增长，主张环境保护，通过浪漫主义的作品反思且恶的资本主义。


    60年代以前，这些人的主要情绪是负罪感。而在今天，负罪感已经变成了愧疚感——原罪属于资本主义，而这些人的自我认同根本不属于资本主义。这些人就是我们所说的“白左”。


    一旦面对一个外国的、落后的、传统的文化，白左就设降了。他们会极力赞美你，说你们经济落后是保护环境，是跟地球和谐相处，你们的传统习俗是美好的人类情感——而我们国家搞资本主义光顾着挣钱，实在是太坏了，真是对不起啊。


    比如说美国的种族问题。以前美国搞“种族大熔炉”，淡化种族意识，不管你是哪个民族，只要你是美国人，我们就当你\_是美国人。而今天的美国白左却在极力强化种族意识：别忘了你可是黑人啊！你们黑人祖上被我们白人奴役啊！我们对不起你啊，你现在理应被优待啊！


    大学到底应该按照什么标准招生才是公平的？普通人的思维肯定是“谁行谁上”，根据个人能力录取。而白左的思维是“按能力录取就等于搞种族歧视”——你必须按照种族比例，确保足够多的黑人被录取才行。


    这是一个基于“结果平等”理念的逻辑，但是这个逻辑恰恰是反资本主义的，因为它让好东西不能上来。


    白左，可能是资本主义社会的真正危险。我们前面说了，总是观念先变，世界才会变。自由主义知识分子做的事情就是改变人的观念。如果全社会都认为为了结果平等可以不让好东西上来，为了维持既得利益可以不要创新，资本主义就算完蛋了。


    那就将是“西方的自杀”。


    到底是世界改变人的想法，还是人的想法改变世界，这里面有一个本质的区别。如果你相信想法改变世界，那么未来就是不确定的，因为人的想法可以随时改变，可以变得非常快。而如果你认为世界改变想法的\的话，那么未来就可能有一个不可更改的大趋势。


    平克是首当其乐观者，有学者对未来很悲观，不过戈德堡其实并没有那么悲观。戈德堡认为人的观念怎么变还是不确定的，也不宜单一的黑左的思维就算大趋势。'
