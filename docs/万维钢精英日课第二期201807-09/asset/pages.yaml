    # 读者 孝炎志：


    万老师，对于史蒂芬·平克这个学者和他的书，您说过他是个匠才但不是大师。我想听听您为什么这么说？


    # 万维钢


    平克老师是一位了不起的认知心理学家和语言学家，他早年有过重要的研究成就，提出过自己独特的学说，出版过好几本向公众介绍自己领域的书，我对此非常钦佩。


    而近年以来，平克进入了更广泛的领域，成了一位公共知识分子。他写了《人性中的善良天使》和我们这几天正在解译的《启蒙此时》。这些书——而不是他关于语言学的研究——给平克带来的巨大的声望，他现在几乎是自由主义知识分子的旗帜人物。但是作为一个口味偏重的读者，我不太喜欢平克的这几本书。作为一个谦卑的科学作家，我不认为平克是值得效法的前辈。


