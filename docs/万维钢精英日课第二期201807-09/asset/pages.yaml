  md: '# 特别放送 | 通往品格之路（下）


    特别放送 | 通往品格之路（…）


    # 万维钢


    上次我们的特别放送《通往品格之路》更新之后，收到很多读者的欢迎，今天特意为你制作了下集，在总结了谦卑、自律、坚持、妥协、激情……等等这些品格之后，咱们再来看看，独立、勇气、反思、反叛、责任、承诺和自由。我还是希望你能通过看文章的方式重温。品格就是一种精英素质，只有想办大事的人、想跟别人不一样的人才用得上它，它值得你了解并且修炼。精英日课，祝你每天都有收获。


    # ◆ 独立


    +   ◆ 如果让我评价美国传统之中最有价值的是什么，我会说是“独立的精神”。所谓“独立”，就是“善待别人，但是不期望被别人善待。”与独立精神相反的就是Entitlement：“要求被善待，甚至是特殊对待。”


    独立的人会感恩。因为对别人没有过多的苛求，所以获得帮助的时候常常感恩。因为感恩，也对其他人公平，所以公平也成了一个自然的性格特点。独立的人做事情的时候知道自己不会得到太多别人的帮助，所以也很很少抱怨。没有达成目标的时候会继续地努力。独立的人很少会有情绪，所以也非常理性。这些特征都是领导魅力的组成部分。


    相反一个讲Entitlement的人，不会感恩，他们常常逃避或推卸责任，抱怨，对别人苛责，冷漠。做起事情来也很易沆气。这样的 人自然很少有人愿意追随。


    为什么现今中国文化中缺少独立精神，而Entitlement却很普遍呢？我想主要说价值观上的原因。中国现代价值观的核心是“爱与包容”。这种价值观非常适用于家庭，却不能使人独立。


    +   ◆ 参加一个比赛，你要关注的重点应该是发挥出自己最好的水平，打一场漂亮的比赛，而不是能不能赢得比赛。你喜欢某个人，想获得对方的爱，那么他/她怎么对待你是你无法控制的，但你能控制的是你对他/她的态度，呈现自己最好的
    一面。在一场政治选举中，你无法控制哪个政党会获胜，但你可以控制自己的一票，你可以帮你支持的政党做宣传。


    # ◆ 勇气


    +   ◆ 如果巴菲特刚刚投资了一个东西，你要不要跟着投？

    风险投资人马克·安德森（Marc Andreessen），就非要和巴菲特看齐投资，他不相信巴菲特的方向。安德森说，你一定得有一个强烈的观点，然后你还得有放弃这个观点的勇气。有强烈的观点，你才能下去做这件事。可是一旦现实告诉你这个强烈
    的观点是错误的，你还得能够马上调整，而不是固执己见。


    # ◆ 反思


    +   ◆ 一个好的道歉要有三步：


    +   1. 明确动机：不是为了赢回别人的信任，而是为了完善自己的人格。

    2. 学到东西：态度有问题就解决态度问题，能力有问题就解决能力问题。

    3. 提出道歉：说明你的错误，也说明你的改变，但是把是否原谅的决定权留给对方。


    # ◆ 责任


    +   ◆ 彼得森的最根本建议就是站直了别趴下！千万别在精神上垮掉。自由主义者总把你描写成受害者，但是你自己不能整天一副受害者心态，不要怨恨父母，不要报复社会。你应该——


    +   * 承担个人责任。人生在世有些事必须你去做，而且必须做好。

    * 照顾好自己。首先要看得起自己。

    * 只跟看得起你的人交朋友。

    * 好好教育你的子女。

    * 尊重传统。

    * 你需要纪律，你需要勇气，你需要自我牺牲的精神。

    * 先把自己的事儿管好了，再去想什么“资本主义”、“政府与社会”之类的大问题。

    * 谨卑，不懂得别胡乱发言。

    * 早餐多吃点脂肪和蛋白质，摆出一个积极向上的姿态，精神点……'
