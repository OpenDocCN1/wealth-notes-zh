  md: '# 日课221 | 怎样对抗进化


    日课221 | 怎样对抗进化


    今天咱們讲一个有关 “进化” 的道理。


    进化，或者更严格的说法应该叫“演化”，是最厉害的社会化创新机制。事实证明达尔文进化论并不仅仅适用于生物世界，凯文·凯利说的人类技术的进化就符合生物进化的规律，雷·达利奥讲的企业进化也符合生物进化规律，计算机科学家使用进化规律寻找高效率的算法。我们大约可以说，所谓市场经济，就是能让好东西自发产生、自己冒出来发展壮大、并且不断适应新环境变化的进化机制。


    进化这个机制是如此的厉害，它几乎就是不可阻挡的。


    而我们今天要说的这个道理，恰恰是怎么阻挡进化。这是因世界上有一些东西的进化速度太快，对人类是个危害。


    比如说一个养猪大户，他有几千头猪。有15天，他发现很多猪感染了一种病菌，所以他就给这些猪使用了一种抗生素。抗生素的效果很不错，大部分病菌都被杀死了。养猪户们一看这个抗生素这么好使，就纷纷大量购买，发现猪有毛病就打一针，有时候没毛病的猪也打上再说，表示预防。


    结果在病菌这个层面，事情开始起了变化。同一种病菌有很多很多的个体，个体之间大致都是相同的，但是偶尔也会因为基因突变缘故，有细微的、但是重大的差别。本来绝大多数病菌都怕这个抗生素，遇到就死了
    —— 但是其中有少量个体，因为其特殊的基因变异，不怕这个抗生素。它们幸存了下来。


    用进化的语言说，抗生素的存在，给这些病菌提供了一个“选择压力”。


    # 一种指导思想是多管齐下。


    # 另一种指导思想，则是做减法。这个思想是减少选择压力，让对方*没有必要*进化。


    全杀死实在太难了，你真要把手段用绝，敌人可能就会快速进化。所以你选择留下一占余地，允许一部分敌人活着，让他们有个出路。只要敌人的总体数量在你可控的范围之内，你仍然是成功的。


    在我看来，事先节制、少用抗生素也好，保留非转基因农作物也好，“复活”不带抗药性的细菌也好，这个战的本质，在于你追求的不是“杀死”，而是“控制”。'
