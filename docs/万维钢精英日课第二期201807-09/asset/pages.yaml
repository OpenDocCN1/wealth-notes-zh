  md: '# 日课215 | 《多样性红利》1:"多样性"到底好在哪？


    日课215 | 《多样性红利》…


    “多样性” —— 英文是 “diversity” —— 这个词现在已经不是新词了，你肯定曾经在各种场合听说到过。多样性的意思是说如果你要选一组合适东西的话，最好不要全选一样的或者类似的，最好要参差多态，什么样的都来点儿。


    据我观察，在中国，“多样性”主要出现在“生物多样性”、“文化多样性”这些领域，有一点保护濒危物种的意思。可能是出于审美，也可能是防备将来万一哪个物种会有用，反正是希望世界上的东西最好是五花八门什么都有。


    但是在美国，“多样性”现在越来越具有政治正确的含义，主要用来说人员构成的多样性。高科技公司的雇员，总统的内阁，法庭的陪审团，大学录取的新生，如果清一色都是白人男性，那就犯了大忌。哪怕你什么坏事都没做，单单这个人员构成都会受到舆论谴责，不管干什么事儿都别想理直气壮，人人自然就会认为你有偏见。一个团队里最好有黑人，有女性，有老人，有来自低收入家庭的人，你才能踏踏实实地立足。


    比如说，我们经常听到中国的女高中生，因为学业优异，被美国多所著名大学录取还给予巨额奖学金的消息 —— 那你是否有一个疑问：为什么总是“女”高中生呢？为什么非得是哈佛“女”孩子呢？难道美国大学害怕中国的男生去跟美国学生竞争吗？


    其实这就是“多样性”。我有个师弟今年被美国一个著名商学院录取了，他们班上的中国人也大多数都是女生，但他并不认为这是学校对中国男生有歧视。他告诉我，这里有一条潜规则。“中国女生”，具有“少数族裔”和“女性”两个多样性标签
    —— 所以每录取一名中国女生，学校就可以录取两名白人男生了。


    那你可能会说，多样性是一个虚伪的要求。既然人们都知道白男能力强，既然学校内心深处最想录取的就是白男，为什么不搞唯才是举，非得满足这个什么多样性名额比例呢？


    我想告诉你的是，包括男性自己在内，所有人都不希望看到一个由男性主导的世界。多样性不仅仅是故作姿态的政治正确，多样性真的有大好处。


    今天咱们开始讲一本有关“多样性”的最权威的著作，叫《多样性红利》（The Difference: How the power of diversity creates
    better groups, firms, schools, and societies），作者是密西根大学政治学教授斯科特·佩奇（Scott E. Page），这本书的中文版我已经提前拿到
    了，马上就要出来了。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_110_0.png)


    佩奇可不是那种只知道夸夸其谈的“政治学家”。他精通数学和经济学，曾在加州理工学院担任过经济学的助理教授，现在还在复杂性理论的研究圣地 —— 圣达菲研究所 ——
    兼职，他专门使用“理工科思维”研究社会问题。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_110_1.png)


    佩奇，算是把“多样性的好处”这个问题给彻底研究明白了。其实你可能听说过这个领域的一些内容，比如说“群体的智慧”。我们专栏还专门讲过一期，叫《做一只只有态度的蜜蜂》。但是佩奇说的，可不是从一些例子中悟出一个道理、一个寓言典故那种，更不是建立在什么价值观念上的意识形态的东西。


    佩奇给“多样性的好处”，找到了坚实的数学基础。


    佩奇提出，多样性有两个好处：一个是解决问题，一个是做预测。一个多样性的团队特别适合解决复杂的问题，和对复杂的事情做出准确预测。


    佩奇的理论可以用两个数学公式概括 ——


    （1）群体能力 = 平均个人能力 + 多样性


    （2）多样性 > 能力


    这可不是两个观念上的公式，它们背后有严格的数学推导。其实这些数学也不难，如果你知道怎么计算统计学上的“方差”的话，你完全可以看懂佩奇的严格理论，但是这本书里没有做详细的推导，我们这里也不会涉及到太多的数学。


    用最简单的语言说，多样性的好处就是，三个臭皮匠，好过一个诸葛亮。


    比如你可能听说过这么一个经典的实验。课堂上，老师带来一个透明的大罐子，里面装了很多糖豆，老师让学生们估计这里面糖豆的总量是多少。有的人说得多，有的人说的少，但是你把所有人估计的数字取个平均值，发现结果非常接近糖豆的真实数目。


    这本质上是一个预测问题，它的结果体现了“群体的智慧”。从数学上讲，这个实验是说，群体预测结果的“方差”，总是小于群体中每个人的预测的方差的平均值。佩奇曾经在
    TTC 讲过一个有关多样性思维的课程 [1]，我以前就听过他这个课。佩奇在这个课程里用一个数学公式说明了这一点，我非常想让你看一眼这个公式 ——


    ```

    (C - x)² = [1/n Σ_{i=1}^n (x_i - x)²] - [1/n Σ_{i=1}^n (x_i - C)²]

    ```


    这个公式也就是


    群体预测的方差 = 群体中个人预测的方差的平均值 - 群体多样性。


    再翻译成人话，鉴于方差越小能力就越大，这其实就是前面我们说的公式（1）：群体能力 = 平均个人能力 + 多样性。


    三个臭皮匠的个人能力都不高，但是因为他们有多样性，他们表现出的群体能力，超出了他们三个人的平均能力 —— 甚至可能比一个诸葛亮都高。多样性，是一个红利。


    生活中有很多这样的例子。我们专栏在《用足球验证有效市场假说》这篇文章里介绍过，群体的智慧，在赌球交易市场里，那是非常非常的有效。


    现在各个领域都在追求群体的智慧。很多公司搞开放的办公区域，就是希望不同部门的员工能够经常碰撞在一起，时不时来个头脑风暴。很多研究所和大学现在也在探索让不同学科的研究者在一个楼里办公，搞搞“想法’s连接”，发展“交叉学科”。


    关于第二个公式，多样性优于能力，佩奇在《多样性红利》这本书里举了很多例子。1999年，曾经有人组织了全球的五万名国际象棋手，通过互联网，跟卡斯帕罗夫下了lico一场比联赛。双方每走一步都可以考虑48小时。在群体这一方，五万人是在网上论坛讨论每步棋该怎么走，集思广益，然后投票表决。


    最后结果还是卡斯帕罗夫赢了 —— 但是请注意，这局棋一共走了62步。对国际象棋来说，能走这么多步，说明这是一场势均力敌的比赛。五万个普通棋手，在堂堂的卡斯帕罗夫面前，并没有变成不堪一击的乌合之众。'
