  md: '# 日课209 | 达芬奇诅咒


    日课209 | 达芬奇诅咒


    为什么很多聪明人都没有取得了不起的成就呢？你可能认识这样的人——他们非常聪明，精神生活无比丰富，特别喜欢学习，有很多爱好，对各种事情都了解，在各个学科都有涉猎。他们都是有意思的人，你喜欢和他们聊天，你总跟他们学到你不知道的东西。


    但是，这些人没有取得什么重大成就。他们年轻的时候充满自信，年纪大了却有一种失落感，觉得浪费了自己的才华。这些人，可能陷入了“达芬奇诅咒”。


    《达芬奇诅咒》（The da Vinci CURSE: Life design for people with too many interests and
    talents）是几年前出版的一本小书的书名，作者叫莱昂纳多·洛斯彭纳托（Leonardo Lospennato）。你也许知道，达芬奇的名字也叫“莱昂纳多”——可惜这本书的作者虽然有跟达芬奇一样的名字，甚至也是个聪明人，却没有达芬奇那样的成就。


    达芬奇是一位画家，还是一位建筑师，他擅长人体解剖，在科学上有很多成就，还搞了很多技术上的发明创造。达芬奇，是个全才。而“达芬奇诅咒”的意思则是一个人也像达芬奇一样对什么东西都感兴趣，也像是个全才，结果却是一事无成。


    今天咱们讲讲聪明人的才华或略。


    现在很多人认为真正的人才应该是“通才”，不仅仅擅长自己领域的东西，而且涉猎广泛，琴棋书画都会，十八般武艺都懂，上得了厅堂下得了厨房。我们以前讲斯科特·亚当斯的“系统”，也是建议一个人最好在两到三个领域都达到全世界前25%的水准。我们讲过“自由技艺”，每个人都应该学一点人文艺术、历史政治方面的知识，这样你才能借鉴各个领域的思想，解决复杂的问题。


    但是请注意，了解其他领域，可不是让你平均用力。


    要知道你不是达芬奇，现在也不是达芬奇的时代。


    # 1.专才的世界


    达芬奇是16世纪的人，那时候其实没有多少知识。大部分人都是文盲，一个真正的聪明人一两年学会一个学科也是可能的。今天别说一个学科，你想在某个学科的某个细分领域达到专家水平，都需要很多年的训练。


    比如你想严肃地从事医学这个职业，那你想的肯定不是什么都会的那种全科医生，你必须专攻一门，比如说外科手术——而且还不是所有的外科手术——仅仅脊椎手术这一个项目，就够你钻研一辈子了。


    我以前是个物理学家，我可不是什么物理学都研究，在好几年里我研究的是“受控核聚变等离子体的计算模拟”这一个小小的领域——里面的若干课题。那些课题是如此的细，以至于我都不知道怎么才能让你感兴趣的方式在《精英日课》讲我自己的工作。


    那你说作为一个物理学家，你肯定得对当前物理学的各项进展，什么引力波、暗物质这些东西有所了解啊，这是作为一个物理学家的自我修养，对吧？对是对。那么引力波方面的最新进展，对我自己的研究有什么帮助吗？


    正确的答案是很直接借鉴。诚实的答案是一点帮助都没有。


    这就是现代人面临的局面。如果你梦想是当科学家，可是你整天都读科学新闻，什么《自然》、《科学》这些杂志你一本都不落下，那你很可能在科研上一事无成。因为你根本没有时间去做专业的事情。


    想在现代社会成为专家，你必须花大量的时间在一个领域刻意练习。


    而具有“达芬奇人格”的人，感兴趣的领域实在太多了。他们看什么都有强烈的好奇心，总会被更新奇的事情所吸引，以至于根本没办法静下心来专注于一个领域。


    《达芬奇诅咒》这本书的作者洛斯彭纳托就是这样的人。他18岁的时候突然对小提琴特别感兴趣，结果学了几个月又对别的东西感兴趣，小提琴课也不上了。现在的洛斯彭纳托不是一个小提琴手。


    聪明人做事总是要讲兴趣的。但是“兴趣太多”，未必是达芬奇诅咒的真正原因。


    # 2.兴趣的深与浅


    安杰拉·达克沃思的《坚毅力》（Grit）这本书里有个观点我觉得非常对。达克沃思说兴趣分为两种。


    一种是初学者的兴趣。你看到一个新奇的东西觉得挺有意思，想要去了解一下。这个兴趣是肤浅的，不能支持你走很远。下次看到更有趣的东西，你就会忘了这个东西。


    还有一种是专家的兴趣。这个兴趣是只有你深入到一个领域之中，才能体会到的那些微妙的东西。这种微妙不是新奇的刺激，外行根本就理解不了，而你一旦理解了，它会强烈地吸引你继续钻研。你会越钻研越感兴趣，越感兴趣越钻研，你就能在这个领域里长期挖掘，你就能有所成就。


    所以要说兴趣，专家的兴趣才是高级兴趣。那为什么有达芬奇人格的人无法抓住一个领域深入呢？洛斯彭纳托自我反思，认为这是因为他害怕竞争。


    如果想要严肃地干好一个项目，你会面临竞争的问题，你得名列前茅才行。可是有达芬奇人格的人不愿意参加竞争。


    其实他们如果真的好好竞争也不见得竞争不过别人，但是他们更希望不竞争就能证明自己的能力。他们会只学一点基本知识和技能，然后就告诉自己我已经知道这个领域是怎么回事了，我愿意做肯定能做好……那我们必真么做呢？于是他们转向下一个兴趣。


    是这个不愿意竞争的情节使得他们永远都走不远。而你可以想想，如果你永远都浅尝辄止，那么你确实是不受指责的，你别别人多掌握了一个领域的知识，别人对你只有赞美！


    可是如果你深入进去，严肃地对待这个领域，想要靠它吃饭的话，你就会面临挫折、面临困惑、面临批评，你会感到自卑，会质疑自己的能力……但正是这些东西，才使得你成长。


    所以深入钻研是充满痛苦的过程，越深入进步速度越慢，你是在用80%的功夫磨砺最后那20%的技艺。可是达芬奇人格的人只想体验快乐，他们只想花20%的功夫，获得看起来像是80%的技艺。


    结果他们到了中年可能会有一种绝望感。人生已经几乎过半，自己却一事无成。年轻时的快乐经历和光辉时刻都只存在于回忆之中。这时候该怎么办呢？


    # 3.选择一个项目


    洛斯彭纳托虽然会的东西多而不精，但毕竟是个聪明人，在IBM公司找了个程序员的职位。但他还是想，难道自己这一辈子就只是一个普通的程序员吗？


    幸运的是洛斯彭纳托找到了一个自己人到中年还能深入发挥的领域：电吉他设计。


    设计电吉他这件事儿要用宅声学、物理学、电子工程学、设计和音乐，这些知识正好他都感兴趣而且都学过一点，正好能用上。


    我在亚马逊查洛斯彭纳托的书，他总共就写了两本书：一本是这本《达芬奇诅咒》，另外一本是讲的是电吉他设计。


    所以洛斯彭纳托的建议是，如果你有达芬奇人格，你最好寻找一个能综合利用你的各项技能的活动。这个活动一定要复杂，因为聪明人喜欢复杂的东西，也只有复杂的东西才能体现你的能力。


    洛斯彭纳托说选择领域要考虑三个标准——


    +   第一，你得确实喜欢做这个领域。

    第二，你得在这个领域中有天赋。

    第三，这个领域必须能让你挣到钱。


    最后洛斯彭纳托还给了两个性格方面的建议，简直是肺腑之言。一个是聪明人都不喜欢拖延，达芬奇本人就非常爱拖延，而你想做事得把拖延的毛病给治好。'
