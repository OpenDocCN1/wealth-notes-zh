  md: '# 特别放送 | 值得你记住的日课公式


    特别放送 | 值得你记住的日...


    万维钢


    你好！今天帮你总结了两季日课中，咱们提到过的公式，这些公式要么来自一线专家的切身体验，要么来自于社科人文领域的最新研究，你可以把它们当成思维的“快捷方式”，用来帮你做出更高或的工作和生活决策。仍然希望你看文章的方式是温习这些公式，如果时间充裕的话，能顺便复习一下原文就更好了。祝你每天都有收获。


    知识 = 体验 X 敏感度


    《未来简史》的作者赫拉利提出，对人文主义来说 ——


    知识 = 体验 × 敏感度


    “意识”就是我们的主观体验，也就是你所经历的各种感觉、感情和想法。


    所谓敏感度，有两层意思。第一，你不能光有经历而不重视体察你的体验。第二，你必须允许这些体验来影响你甚至改造你。


    赫拉利举了个自己的例子。他之前喝茶喜欢加糖，后来发现糖把茶叶本身的味道给覆盖了，所以就把糖减少，专门体会茶的味道。然后他对茶的感觉就越来越灵敏，体验越来越丰富，最后发现他最喜欢喝的一种茶是中国四川雅安产的熊猫粪茶
    —— 就是用熊猫粪做肥料种植的一种茶。


    赫拉利说，早年你就算给他一杯用朝的茶碗盛的熊猫粪茶，他也无法分辨出其中感觉，跟用纸杯装的普通茶叶有什么不同。但现在他能体会到其中有巨大的区别。


    换句话说，一个文明人，要善于体察各种细微的感觉，否则你就是个粗人。


    赫拉利说在这个没有宗教信仰的现代，想要寻找人生的意义，就得有体验和敏感度。你要从经历中获得体验，在用体验改造自己，通过不断的体验能对世界产生更深的理解，最终变成一个更好的人。


    敏感度，就是人文主义者的自我修养。


    《未来简史》解读4: 欧美自由主义的史诗 周末小议 | 二十二层床盛别致的敏感度


