- pgno: 16
  md: '这个运算器允许你输入A和B两个二进制的4位数，它能判断A和B是否相等，还能计算A+B和A-B。香农在他那篇硕士论文里就设计了一个类似的运算器。


    运算器是计算机 CPU 的一部分，CPU 中还有“数字同步逻辑”之类的组件，但是不管CPU有多复杂多高级，它也是用各种逻辑门组成的，而逻辑门是用开关做的。所以整个CPU！就是一个开关网络！


    开关的功能是如此的简单。它只能根据两种命令完成两个动作，它是纯机械化地事，没有任何智能。但是亿万个这样的开关组成在一起，就是CPU，就能运行软件，就能实现人工智能。


    我们总结一下，这整个过程包含了四层的模型——


    +   1. 最底层的是半导体物理学，

    2. 晶体管开关，是建立在半导体物理学上的模型，

    3. 逻辑门，是建立在开关上的模型，

    4. CPU，是建立在逻辑门上的模型。


    这个层级系统很像是人类的组织：中央管省，省管市，市管区，区管基层单位。人类组织是人类“想象的共同体”，CPU的层级结构也是工程师想象的共同体。


    # 3.平台与自由


    晶体管能做多小，这是物理学决定的。但是除此之外，CPU就跟物理学没啥关系了。剩下的事都是工程师的头脑里的设计，所以叫“模型”。从开关往上一层一层的构建，都是人为设计的，只受到想象力的限制。而且这种设计肯定不是唯一的——今天的计算机是历史的产物，保留了香农的个人风格，已经成了一个文化——如果计算机起源于中国，从晶体管到CPU也许会是非常不同的设计。


    但是请注意，这种分层的大结构，这种每一层模型是建立在前一层的基础之上的思想，很可能已经是最好的办法。


    这种结构的好处是，在每一层上搞设计，你都只需考虑它紧挨着的下一层。设计逻辑门不需要考虑半导体物理学，设计运算器不需要考虑晶体管。


    像这样的“层”，可以称为“平台”——给你搭一个平台，设计者可以在平台上随便唱戏。


    有人说平台的好处就是给了设计者“免于选择 的 自 由（ freedom from choice ）”。比如“得到”就是个平台——我写好文章就把文本交给主编，你想留言就直接输入文字——咱俩都没有办法选择发布位置、格式和字体等等细节，但这也意味着咱俩不用操心这些。每一层平台都在减少上一层的选项。选项变少了，集中精力创作才成为可能。最后程序员只需要对一块CPU、而不是十几亿个晶体管编程。


    以我之见，这种层级平台之间的合作，和亚当·斯密说的那种人与人横向的劳动分工不是一个故事。想要发明铅笔这种东西，你是先看看世界上都有些什么，把不同东西拼凑在一起综合成一个新东西。而CPU的平台结构则完全是工程师的顶层设计！


    除了最底层是物理学给的之外，其他每一层都首先是工程师想出来的模型。CPU是个硬件，而设计CPU却几乎全是理论——就好像艺术创作一样。


    这可不是自然界的逻辑。你可以把生物体分成好多层，比如分为器官、组织、细胞，但是这种分层跟设计CPU可不一样。自然界有很多所谓“涌现”现象，也就是整体会表现出个体运动解释不了的性质——哪怕你把这一层研究透彻了，你也无法解释下一层是怎么回事。


    只有CPU这种人为设计的分层，才有那么清楚的逻辑结构。这个逻辑结构不但给了设计师自由，而且保证了通用性。


    比如2001年，加州大学伯克利分校的华人教授胡正明和人合作发明了一种新的晶体管，叫“鳍式场效应晶体管（FinFET）”——就是最前面那张图上的那个晶体管——已经被用在了英特尔的
    Haswell 系列 CPU上。这种晶体管跟以前的非常不一样，但是英特尔并不需要必要专门为它重新设计CPU，用户除了发现速度更快能耗更低，完全感受不到晶体管的不同——因为往上每一层的办法都是完全一样的。


    最底层的硬件可以随时变，但是每一层的逻辑范式可以长期不变。这大概也是为什么想在芯片领域“破坏性创新”如此困难。香农以来的芯片结构已经被历史积累成了一个文化。


    下一讲咱们再说软件。'
