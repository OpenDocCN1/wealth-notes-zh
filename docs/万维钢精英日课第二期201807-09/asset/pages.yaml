  md: '# 日课186 | 《柏拉图和技术呆子》5:宇宙是计算机吗？（下）


    日课186 | 《柏拉图和技术呆子》。


    今天咱们继续讲宇宙到底是不是一台计算机。我们感兴趣的并不仅仅是有趣的假设，而是这个宇宙的本性。就像了解一些外国的事情会让我们更加理解中国一样，使用计算机的视角，会让我们更加理解真实世界。


    计算机本质上是个处理信息的机器。那真实世界的信息，都能用计算机处理吗？关键还是在于“实数”。


    # 3.再论信息论


    我们专栏前面有两期叫《一个基于信息论的人生观》，重点讲了香农的信息论。什么是信息呢？信息就是意外，信息就是你克服了多少不确定性。可供选择的范围越广，这个选择的信
    息量就越大。我们甚至讲过香农信息熵的公式，今天这里就 refrain 了数学的细节了，但是我想把这个思想再给你强调一遍。


    每个人都知道写在纸上的字是信息，但是这个信息的本质是做选择。比如你用英文给我写一封信，你无非就是在26个字母、10个阿拉伯数字再加上一些标点符号中做选择。你写的每个字都是从这么十个字符中选取了一个
    —— 你是在几十个选项之中选择了一项，你克服了这么大的不确定性。


    再比如说，我知道有五个候选人在竞争一个位置，但是我不知道是谁当选了。你告诉当选者的名字，这个名字的信息，就比几十个字符之中给我一个字符要少得多 —— 因为你克服的不确定性只有1/5。我胡乱猜，也MP有1/5的可能性猜对。


    所以信息量的大小、给信息量编码需要用到多少个“比特”，都取决于背后选项的多少。正所谓你“说了”什么不重要，重要的是你“能说”什么。


    现在假设有一条一公里长的铁路线，咱俩负责维护。有Lf一天，铁路线上出了线路故障。你去探测了，告诉我故障发生在第702米的地方。请问这个信息量有多大？一公里一共有I千米，你给我的是千里挑一的信息，这个信息量比五个人中选一个人要大得多。


    要给这样的信息编码，我就要把铁路线分为一千段，给每一段一个编码。下次不管哪里出事，我们都可以报一个编码。


    好，现在上级要求提高精度，说必须得精确到厘米，比如说你得报告故障发生在第702.32米的地方。要给这么高精度的信息编码，我们就必须把铁路线分成10万段，这个编码量就大大增加了。


    那我们知道，从0到1000米的这条线段上不但有整数有小数，还有更多的、不可思议地多的无理数 —— 那如果故障发生地点是一个无理数，请问你怎么编码呢？


    答案是无法编码。描写一个无理数，比如104.298730472840382048….（永不停止、永不循环）需要无限的精度！


    有些无理数，像根号2和圆周率，可以用文字说明，我们可以报告上级故障发生在“π米处”，上级一听也能明白。但绝大多数无理数根本无法用文字描写！对于一个无法用文字描写的、出现在0和1000之间的一个任意的无理数，你怎么给它编码呢？从理论上讲，在连续实数集上的精确信息是不可编码的，“信息熵”的概念也不再适用了。


    说到这里你可能要抗议了。你说我们根本就不需要用无理数标记位置，我们有限的精度就已经够用了啊！的确是这样。日常生活中任何测量都有误差。不管你是702米，还是精确到702.0567287米，只要你停止了，就留有一定的误差。精确到小数点后第七位，就表示有0.0000001米的误差。


    早在1948年那篇提出信息论的论文里，香农就已经注意到无限精度的测量信息不可编码，但是有噪音的、有误差的测量信息可以编码 —— 现在我们把它这个理论称为“信道容量定理（channel
    capacity theorem）”。


    所以我们的生活应该不受影响，毕竟凡是人为取用的信息都有误差，那就都可以数字化和信息化。


    但是从理论上来说，如果真实世界是一个连续的实数系统，它就不可能用一个数字化的信息系统完全描写。


    但是现在有很多人相信，真实世界根本就不是建立在实数上的！


    # 4.数字宇宙假说


    如果空间和时间都是连续的东西，无限可分，那真实世界就必须有无理数。但如果空间和时间本来就是不连续的呢？比如说，也许空间上存在一个最小的距离尺度，比这更小就没意义了。也许这个宇宙的空间就好像电脑屏幕一样，有一个分辨率
    —— 当然它的分辨率非常非常高，但是是有限的。


    这就是所谓“数字宇宙假说”。我们专栏一直说宇宙必定是“数学”的，但我们可以说宇宙必定是“数字”的。“数学宇宙”允许无理数，如果有无理数就不可编码 —— 而“数字宇宙”是建立在有理数上的，它在本质上就可以用计算机编码。


    在数字宇宙里，空间是一格一格的，时间是一步一步的，都是不连续的。而我们现在所有的物理定律都假定时空是连续的、里面有微分方程，假设时空无限可分 —— 所以这些物理定律都是柏拉图世界的想象，必须改写。


    学者们对数字宇宙有不同的信仰，Lee把这些信仰按照从弱到强的顺序，分为五级 ——


    +   - 第一级认为这个世界可以用有限多的数字信息来进行完整的编码。

    - 第二级认为这个世界里的一切都是信息。

    - 第三级认为这个世界里的一切物理过程都是计算。

    - 第四级认为这个世界就是一台计算机。

    - 第五级认为这个世界不但是一台计算机，而且就是某个高级智能的一个计算机模拟 —— 我们都生活在网络游戏里。


    这些级别的细微差异代表严格的数学和哲学思辨，咱们就不细追究了。那么这个听起来很玄乎的假说，到底有没有可能是真的呢？答案是，有可能证明，但不可能证伪。


    如果你能证明，空间的确有一个不能再分的、最小的尺度，那你就证明了数字宇宙假说。现在费米实验室有个装置叫“Holometer”，就打算做这件事。它使用和探测引力波的LIGO装置类似的原理，通过激光干涉来测量距离的变化，它的目标是发现空间的最小尺度。


    也许有一天早上起来，你就会听说费米实验室发现我们这个宇宙的空间有个极限尺度！那将是一个无比重大的新闻，说明空间不是连续变化的 —— 说明这个世界完全是由有理数组成的！……也说明我们很可能是生活在计算机模拟之中。


    考虑到微观世界的物理学，把基本粒子再做细分并没有多大实际的意义，基本粒子的尺度是有 限的。但是空间本身可不可以无限细分，这个问题还没有答案。如果人类的实验精度永远都发现不到空间的最小尺度，那你能说空间*没有*最小尺度吗？你不能。所以说数字宇宙是一个不可证伪的理论。如果你信仰数字宇宙，你可以永远坚持这个信仰。


    而你猜怎么着？在认真思考过数字宇宙假说的学者之中，相信的人是主流，不信的人是少数。


    为什么这些学者非要相信宇宙是数字的？也许因为数字化的世界更容易接受。计算机世界是数字化的，而计算机是人能造的东西，我们完全接受数字化的世界。但是Lee可不信。当然Lee也没有足够的证据，他只是觉得真实世界应该比一个由有理数组成世界更丰富一些。


    你相信数字宇宙吗？我没有特别强烈的信仰，但我的确更喜欢存在无理数的世界。


    不过我们再细想想，无理数这种东西，的确是很难以真实现实世界联系起来。我觉得也有可能无理数是来自柏拉图世界的一种想象的东西。'
