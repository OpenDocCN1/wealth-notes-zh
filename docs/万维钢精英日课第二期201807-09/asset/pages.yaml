- pgno: 56
  md: '和厨子，我们都是侦察兵。这不就是来自五湖四海、为了同一个目标吗？


    我就越觉得中国人和美国人没有本质区别。当然你可以说中国文化更注重集体、美国文化更注重个人，可是我没看到有什么“注重集体的管理学”和“注重个人的管理学”，我只听说过管用的和不管用的管理学。我看到的是美国学者到印度一两年就能适应印度文化，我看到的是中国人到美国没多久就能适应美国公司的做事方式。


