  md: '# 答读者问｜自然灾害是不是某个高级智能在搞鬼？


    答读者问｜自然灾害是不是…


    # 来自日课：宇宙是计算机吗？


    happy-first、Whitedwarf、幽里、余欣、胡旭光、三


    普朗克时间是否时时间的最小时单位，普朗克长度是否时空间的最小尺度？考虑到普朗克长度和时间，真实世界难道不是已经是数字化的吗？


    万维钢


    普朗克时间和普朗克长度是现有物理定律“好使”的极限。也就是说，对现有的物理定律来说，小于这个长度和时间的内 容，都是我们在理论上也无法推测的。


    比如宇宙起源于大爆炸的“奇点”，本来“奇点”应该是一个数学意义上的、没有大小的——也可以说是大小为0的纯粹的点，但是对那种点我们的物理定律研究不了了。我们的理论只能研究大爆炸开始之后10^(-43)秒的事情。


    但这可不是说时空就是按照普朗克时间和普朗克长度打好了格子，物体的运动只能在这些格子上跳跃。我们*无法探测*那么小的尺度，并不等*不存在*那么小的尺度。现有量子力学的“量子化”——也就是“不连续变化”——是原子跃迁能级这种不连续变化，可不是一切都不连续变化。


    对现有物理学来说，目前，似乎，还没有任何理论或者实验上的困难必须通过时空的数字化才能解决。时空是不是数字的，这只是一个好奇心问题，不是像暗物质和暗能量那样已经发生重大危机了必须解决的问题。


    事实上所有物理方程都假定时空是连续变化的。只要你使用微积分，你就认为时空无限可分。广义相对论所谓的弯曲时空，也都是连续的变化。当然，如果时空真的是数字的，这些定律要改写也是容易的。


    现在的确有些物理学家提出了时空量子化的方案[1]。而且他们使用的最小时间就是普朗克时间。这些理论非常神奇，有的甚至认为时间也应该是三维的。有的还声称可以从遥远星系的光谱的红移上找到时间是量子化的证据。但所有这些说法都没有得到证实。


    # 而我要补充一点！如果有一天早上起来你听说物理学家已经证实了，时空真的是数字的，你也不要太难过。


    读者 赵亮：


    假设不存在最小变动单位，那么宇宙膨胀假说中，是最小单位变大，还是数量增加？


    万维钢


    必须是数量增加。我们可以把空间当做一个舞台，一切日月星辰都是舞台上的演员。宇宙膨胀是舞台变大了，演员之间的距离增加——而不是演员跟着舞台一起变大。演员什么样，由本地物理定律决定，而本地物理定律不会发生改变。如果你假定时空的最小变动单位就是普朗克时间和普朗克长度，那要知道，这两个数值都是物理常数决定的，跟宇宙膨胀到了什么程度无关。


    读者 钟尼玛：


    万老师为什么说现在的计算机不是严格意义上的图灵机？莫非现在的计算机还能不停机吗？这不就违背了图灵的停机问题的解释了吗？


    万维钢


    图灵机是开机之前把运行的程序代码和程序的参数都设定好，它一旦运行起来你就不能再管它了，而且它要求停机。


    现代计算机的操作系统设计出来就是不停机的——除非你让它停机，否则它一直等着你新的命令。现有的计算机跟图灵机最大的区别就是开始运行之后你还可以跟它互动。你可以随时用键盘和鼠标输入新的参数，计算机一边运行着一边根据新参数调整运行的方式。计算机里常是好多程序“一起”——当然严格地说是交叉轮流——运行，而这些程序之间也可以互动。


    有人早就证明，只要允许两个程序实时互动，互相给新参数，就已经不是图灵机，就可能永远停不了机。


    所以我们用的计算机其实比图灵机高级。但是它在底层执行每个单独的程序的单独一段任务的时候，仍然是图灵机。


    读者 徐昌俊：


    小时候对着蚂蚁屎尿，经常会想，对蚂蚁来说一定认为发生了极大的天灾蚁祸，而对我来说只不过是一种童趣而已。那对我们人类来说，有些自然灾害又会不会是比我们更高级的一种生命形态随意的开了个玩笑而已？


    万维钢


    人类和蚂蚁都不能完全掌控自己的命运，但我认为我们跟蚂蚁还是有本质区别。


    人类面临各种自然灾害的威胁，这些自然灾害的确是不确定的——这里山爆发、那里地震，我们常常无法预测。但是，我们有充分的理由相信，这些自然灾害不是某个更高级的智能在搞鬼。


    首先这些灾害背后并没有什么“目的”。坏人会死，好人也会死。先进的文明会被灾害毁灭，落后的文明也会被灾害毁灭。我们对历史大事的总结完全符合“天行有常不为尧存不为桀亡”。


    那你说也许这个高级文明根本不在乎是谁好是谁坏人，它只是在跟人类开玩笑——或者说，它根本不在乎人类，它只是秉着自己一时的喜好胡昆明。这有没有可能呢？


    这也不太可能。我们遇到的自然灾害都是“自然”的。比如某地发生了火山爆发，科学家过去一看，马上知道那里确实有火山。某地发生地震，科学家一算，地震的能量不是从天上掉下来的，是ju一直都积蓄在那个地震带上。所以这些事情都符合物理定律。地球上总是先有个火山，才有火山爆发，你得满足物质条件。


    科学家不能准确预测自然灾害，但并非是“不能理解”哪个自然灾害。地震带上的地点发生地震是正常的。能量已经积蓄在那里，科学家已知知道那里危险，只不过无法预测什么时候发生而已。


    如果有一天哈尔滨这个地方居然发生了海啸，科学家想破头都不知道那么多海水是从哪里来的，那才有可能是某个超级智能在胡乱搞。


    当然还有一种可能是超级智能既不胡搞也不经常有目的地调控，只是在某些关键时刻对地球文明进行“微调”，比如在一个地震带稍微点手段里引发一场地震，影响历史的走向，以至于我们看到的“一仓都是最好的安排”——这个我们确实看不出来。正如读者“Cduoduo”提到卫斯理的一个小说《玩具》，这个小说说人类是某个高级智能的玩具——那个高级智能之所以一般不干涉我们，是因为他们觉得观察我们自主行动很好玩。


    像这种情形，就是不可证伪的理论。也许现在有25个来自各实星球的外星人正在盯着你看——也许没有。就算是有，根据前面的讨论，你也知道——


    +   第一，他们对你的生活不会有什么能看得见的影响，你完全可以使用寻常的认知安排生活；

    第二，他们即便要微调，也不会有什么你能理解的目的或者行动规律。


    那有和没有，又有什么区别呢？


