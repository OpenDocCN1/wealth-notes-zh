  md: '# 第二季结束语：谈谈写作和研究


    今天是精英日课第二季的最后 trä??? 今天是精英日课第二季的最后一讲，咱们读完让我分享一点经验，所以我想谈一点学习、研究和写作的心得。


    我们先说一个概念，叫“当前科学理解”。


    # 1."当前科学理解"


    "求知"是个古老的话题。你遇到一个难题，或者你看到一个社会现象不理解，或者单纯就是对什么问题好奇，那你怎么办。


    传统的建议，是你应该向老师请教，你应该读书，你还应该自己探索。求知的过程是漫长和永久的，你用一生的时间也探索不完。正所谓学无止境，求知，是一件上恐可以无穷大的事情。


    但是以我之见，我们现在已经有充分的条件，可以给求知设定一个有实用价值的标准。这个标准是可以达到的，而且通常达到这个标准就意味着你的求知到这一步就足够了。


    这个标准就是“当前科学理解”。这个词在中文世界很不常见，英文是"current scientific understanding"，在学术界说得比较多。


    # 2.学会做研究


    那么怎么才能得到当前科学理解呢？一般的方法当然都是问专家、上网搜索、读书、甚至查找学术论文。这些做法都对，但以我之见，你首先应该有一个正确的态度才行。'
