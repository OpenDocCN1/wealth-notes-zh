  md: '# 日课185 | 《柏拉图和技术秃子》4:宇宙是计算机吗？（上）


    日课185 | 《柏拉图和技术秃... ↓


    万维钢


    本周我们继续讲爱德华·Lee 的《柏拉图和技术秃子》这本书。


    首先请允许我说几句题外话。Lee 的这本书，和我们专栏前面讲过的布鲁萨德的《人工智能》，都是麻省理工学院出版社（The MIT Press）出的。我发现这个出版社出的书，都是你一看书名特别感兴趣，但是买回家发现非常非常难读。作者都是“来自生产线”的科学家和教授，这帮人非常有思想，但是根本不会写书。麻省理工学院出版社好像完全不在乎书的销量。


    我要说明的就是 Lee这本书的前半部分和后半部分几乎没什么关系。前半部分讲计算机工程师的智慧，后半部分则是从理论上探讨计算机这种东西的局限性。如果是咱俩得到的主编操盘，肯定要求他把这些内容变成两本书分开卖。Lee
    完全不讲写作的章法，我作为一个书呆子觉得也很痛苦。他竟然在前言说他也不知道会有谁会读他这本书 —— 得到主编要是去了MIT出版社肯定火冒三丈。所以我希望你买一本自己读一下
    —— 你会体会到“得到”和我的价值。


    但是这本书中说的内容非常重要，作者拥有一线的见识，而且下了很大的调研功夫。特别是这以后半部分，本周我们要重点讲一个特别大的大道理，足以影响你的世界观和人生观。这个道理来自深刻的数学，但是距离我们每个人又都很近。我这几天走在大街上都想抓住一个人告诉他这番道理。


    我将用由浅入深的方法彻底给你讲明白。你不需要多少数学知识，但是你需要思考。


    工程师做的都是模型，计算机也是一种模型。但是对一个模型琢磨的久了，你难免就会觉得它不仅仅是一个模型。


    比如你可能会问，人脑......也是一台计算机吗？


    这个问题跟工程师怎么报效祖国没啥关系。可作作为一种知识上的兴趣，每个人都会忍不住关注这些问题。这个问题涉及到“图灵机”、信息论和“哥德尔不完备性定理”，你肯定早就听说过这些概念了，我们这里想给你一个统一的解释。


    我们将通过计算机科学的眼光，理解这个世界。


    人脑和计算机的关系我们专栏说过好多次了，我保证这次给你一个更高级的答案。在回答人脑是不是计算机之前，我们要先问一个更大的问题。


    —— 这个宇宙是计算机吗？


    有一种猜想认为我们以为的这个“现实世界”，其实是某个更高智能的计算机模拟 —— 我们其实是生活在一个网络游戏里。如果觉得这个猜想太过离奇，我还可以换个说法：询问我们生活的这个现实世界，在理论上，可以用一台要多强大就有多强大的计算机来完全模拟吗？


    这个问题可不仅仅是个好玩的思想实验。我们需要理解计算机的本性，并且跟真实世界的本性做一个对比。使用计算机视角，你会重新认识这个世界。


    而你可能想不到，这一切要从“实数”开始说起。


    # 1."实数"的不可思议


    每个中学生都学过各种“数”——

    “自然数”是 0, 1, 2, 3, .....

    “整数”是自然数加上负的自然数：......-3, -2, -1, 0, 1, 2, 3.....

    “有理数”则包括了分数和小数，但要求必须是有限的、或者是无限但是必须循环的小数 —— 本质上，所有有理数都可以写成分数，也就两个整数相除：1/2, 1/3,
    4/3 ....


    在说实数之前，我先问你一个问题。你说到底是自然数多呢？还是自然数里的“偶数”多呢？


    人的直觉反应肯定是自然数比偶数多。偶数 — 0, 2, 4, 6, 8, ......—— 只是自然数的一部分，自然数里还有1, 3, 5, 7这些奇数，整体肯定比部分多啊。但是请注意，自然数和偶数都有*无限多*个。无限多的两种东西，怎么比较多少
    —— 无限大和无限大到底哪个大，这是一个问题。


    德国哲学家格奥尔格·康托（Georg Cantor）曾经为此思考了整整12年。大概是1874年，康托提出，自然数、自然数中的偶数、甚至一切有理数，都是同样多的。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_24_0.png)


    康托的洞见在于两个集合的元素如果能一一对应，那这两个集合的元素个数就一样多。每个偶数除以2就是一个自然数，偶数和自然数可以一一对应 —

    0 ↔ 0,

    2 ↔ 1,

    4 ↔ 2,

    6 ↔ 3,

    ......


    同样道理，全体整数的个数也和自然数的个数是一样多的，因为我们可以把整数按照一定的规律“数出来”，也就建立了跟自然数的一一对应 --

    0 ↔ 0,

    -1 ↔ 1,

    1 ↔ 2,

    -2 ↔ 3,

    2 ↔ 4,

    -3 ↔ 5,

    3 ↔ 6,

    ......


    数学上这叫“可数”。一个包含无限个元素的集合只要是“可数”的，它就能跟自然数一一对应，它的元素个数就跟自然数一样多。


    事实上，有理数的集合也是可数的。比如我们可以按照下面这张表格，把全体有理数列举出来 ——


    | 1 | 1/1 | 1/2 | 1/3 | 1/4 | 1/5 | 1/6 | 1/7 | 1/8 ... |

    | 2 | 2/1 | 2/2 | 2/3 | 2/4 | 2/5 | 2/6 | 2/7 | 2/8 ... | ...


    无非就是把每个有理数都写成分数的形式，然后根据分子、分母的数字决定它在表格上的位置。只要按照图中箭头的方式，我们就可以把全体有理数数一遍。你一边数着有理数，一边数着自然数，这就建立了一一对应的关系；所以有理数也和自然数一样多。


    现在轮到“实数”了。所有有理数都是实数，而实数还包括“无理数”，也就是小老师所说的“无限不循环小数”。无理数的特点是不能写成分数的形式，也就是不能用两个整数相除得到。比如根号2和圆周率就都是无理数。


    具体怎么证明我就不了说了，但是数学上有一个结论：无理数，是“不可数”的。


    也也就是说，实数不能跟自然数做一一对应。虽然自然数和实数都有无限多个，但是这两个无限不是一个级别 —— 实数比自然数要*多得多*。如果你说自然数是“无穷多”，那实数就是“不可思议的多”。


    好，今天的数学就这么多。你可能会说，这些都是一百多年前的人就知道的数学，现在对很多人来说都是常识，那说这些有什么意义呢？


    意义就在于，实数是不可数的，而计算机...'
