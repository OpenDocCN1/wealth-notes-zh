  md: '# 日课178 | 竞争越激烈越好吗？


    日课178 | 竞争越激烈越好吗。 ↓


    经济学有个关键词叫“激励”，英文是 incentive。你学经济学要记住一句话：人会对激励作出反应。


    苹果价格变高，商家就会想方设法增加苹果的供应；地铁票提价，乘坐地铁的人就会减少，这就是人对价格激励作出的反应。那既然激励这么好使，政策制定者，特别是政府机构和公司的管理人员，就也想搞一些激励让人反应。


    但是有些反应可能会违背你的初衷。


    比如说，为了提高员工的工作积极性，公司搞了个内部的竞争。按照业绩排名，排前面的员工能拿很多奖金，而排名低的则面临被开除的危险。这种激励就有可能出问题。我们设想，如果竞争过分激烈，员工不但自己工作会更加努力，也有可能为了提升名次而作弊、甚至对同事搞破坏。


    所以经济学家非常知道一个激励政策的正面作用和负面作用分别有多大。


    # 1.三分制


    不知道有多少读者还记得1990年的世界杯。那届世界杯的一大特点是进球数太少， ustedes 多0:0、1:1的比分，国际足联觉得有点对不起观众。


    # 2.争胜与保守


    咱们这么想，现在竞争加剧了，比赛的激烈程度肯定是增加的，球队会为了赢球而更加努力。但是激烈竞争之下，破坏性的行为会不会也增加呢？比如恶意犯规、还有中国球迷说的“卧草”，就是假装受伤倒在草坪上拖延比赛时间，这些上了不了台面的负面行为是不是也会增加。如果正面和负面行为都增加，那比赛到底是变得更好看了还是更不好看了，可就不一定。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_4_0.png)


    # 2.竞争和破坏


    +   1. 平局的确实减少了；

    2. 但是1:0领先之后球队会变保守；

    3. 比赛的攻防和破坏行为都增加了，结果总的进球数并没有增加；

    4. 而过于激烈的对抗并没有让比赛更好看。'
