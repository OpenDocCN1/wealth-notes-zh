  md: '# 日课216｜《多样性红利》2:难题的“视角”


    日课216｜《多样性红利》2:...


    今天咱们继续讲斯科特·佩奇的《多样性红利》这本书。


    要掌握这本书的精髓，可能对大部分读者是个挑战。前面我们说了，多样性的红利，只有用在难题上才有意义。佩奇在书中使用了很多数学题作为例子，这些题有点像是“奥数”——它们并不需要用到什么微积分之类高等数学的知识，但是需要你动脑。我们这一讲的最后也会有一个这样的难题。


    你可能会说，我想要得到的是思想，我对求解数学题不感兴趣——有道理，但是如果你从来都不敢面对任何难题，那你学习这些高级思想也没用。


    鉴于现在很多人对“奥数”有误解，请允许我借此机会做几句辩解。“数学奥林匹克”并不是一个专门跟孩子作对的、用偏题和怪题扭曲性格的项目，更不是脑筋急转弯。数学竞赛题里有精妙的技巧，更有深刻的思想，能让你体会到数学的正宗趣味。寻常的课堂知识都有死记硬背的成分，唯有奥数，是较量“解题”这个硬功夫。


    我小时候幸运地接受过一点奥数训练，长大以后就从来没觉得有哪本书、哪个技术、或者哪件事难到高不可攀。解题，是最值得你苦练的功夫。


    当然解题不一定是解奥数题，任何难题都可以。我们这几讲专门研究怎么解决难题。佩奇总结了一套“多样性认知工具箱”，其中包括“视角”、“启发式”、“解释”和“预测模型”四种工具，我们今天说“视角”。


    什么是视角呢？佩奇给的精确定义是，“视角是从现实到内部语言的映射”。这个说法非常晦涩，咱们还是换个更透彻的说法。


    以我之见，所谓视角，就是你*怎么看*这个东西，你把这个东西*看成什么*。


    我举个例子。比方说这里有一大堆鱼，其中各种各样什么样的鱼都有，请问你怎么看这些鱼。一个外行看这些鱼，可能会看到有的鱼大有的鱼小，或者看到有的是死的 有的是活的。渔民看这些鱼，可能考虑它们的巡游地点，思考这些鱼是怎么捕获来的。市场上卖鱼的人看，他想的是哪个鱼
    贵哪个鱼便宜。而在你看来，可能想的就是哪个好吃哪个不好吃。


    这些不同的看“法”，就是视角。


    我以前讲过佛学里的“色即是空”，我们知道每个人看世界都带着一副有色眼镜——有色眼镜就是视角。我们还讲过“五小鸭定理”，我们知道每个视角都是主观的。但是我们以前都是从“哲学的视角”说视角，今天我们要从“解题的视角”说视角。


    佩奇有三个洞见。


    佩奇的第一个洞见是，视角的选择，对解题的难易，关系重大。


    比如我们在高中数学课学过“直角坐标（也叫笛卡尔坐标）和“极坐标”，这两种坐标系就是两个视角。这两个坐标系完全可以一一对应地转化——但是，选对了坐标系，你解题就会简单得多。要描写一个正方形顶点，直角坐标非常方便；而要描写一段圆弧，那就最适合用极坐标。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_112_0.png)


    生活中也是这样。要描写一个复杂的地形，你最好画张图；而要叙述一个复杂的道理，画图有时候就不如文字方便。从哲学上说所有视角都是平等的，但是从解题上说，视角跟视角可太不一样了。


    佩奇的第二个洞见是，要想有利于解题，你这个视角最好自带某种结构。


    比如说“能按照数字排序”，就是一种结构。在门捷列夫发明元素周期表之前，很多人 都尝试过把各种元素分类。你可以考虑按照元素的某一种化学性质分类、按照颜色 分类、甚至按照产地分类，这些都有道理，但是是没有科学结构。门捷列夫考虑到“原子
    量”——确切地说是质子的个数——这个视角，它就自带一个结构：它允许你把元素按照质子数排序。


    有了结构，你看东西就不再是混乱无章的一堆，你就有章法。数学上的坐标系，就是一个结构化的视角。


    现在咱们先举个例子，用一下佩奇的这两个洞见。


    一个冰淇淋公司想要研发一种新口味，他们要在冰淇淋水里融入一种软糖。这个软糖有四种不同的尺寸，其实成分都一样，他们不知道该用哪种，也不知道该加多少。于是公司组织了一系列的实验，而且提出了一个结构化的视角。他们建立了一张表格，横坐标代表用软糖的数量，纵坐标代表用的是哪个尺寸的软糖——


    | 4,1 | 4,2 | 4,3 | 4,4 |

    | 3,1 | 3,2 | 3,3 | 3,4 |

    | 2,1 | 2,2 | 2,3 | 2,4 |

    | 1,1 | 1,2 | 1,3 | 1,4 |


    比如图中（2,3）这一点，就代表‘用两打直径是三厘米的软糖’这个配方。这样所有配方都排列在了这张表格上。公司选取了几个点进行测试，发现（2,3）这个配方似乎不错。


    这显然是个笨办法。我们刚才都说了，每种尺寸的软糖的成分其实都是一样的，最后都要融合在冰淇淋里面，那你直接算个总数不就行了？所以根据佩奇的描述，公司请来一位叫内莉的顾问，内莉提供了一个不同的视角。


    内莉建议把不同的配方按照每份冰淇淋的卡路里含量来排列。既然公司已经发现（2,3）是个不错的配方，内莉就测试了（2,3）附近的六种配方。


    用内莉的卡路里视角，这六个配方是：


    | 250 | 252 | 255 | 256 | 258 | 262 |


    图1-8 内莉的视角（单位：卡路里）


    其中的252卡路里就是（2,3）。内莉在附近探索，发现255卡路里的味道更好，并且最终确定这个是最佳配方。


    按照内莉的视角，我们看到她从252找到255的过程非常自然，就是在好东西的附近找找有没有更好的东西，对吧？可是你如果使用公司之前的坐标系视角，内莉这个发现就大大的出乎你的预料了。


    255对应的配方坐标是（4,1），它距离（2,3）很远！


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_112_1.png)


    公司肯定会问内莉说，“你怎么就能想到考察邻里呢？简直是跳跃式的思维！”——殊不知在内莉的视角看来，那是一个最邻近的考虑。


    这个公司听起来有点傻，但是这个道理非常清楚。第一，视角选对了，问题就容易解决。第二，视角的内在结构非常重要。


    现在咱们说一个高级的例子，看看视角的真正威力。 有个游戏是诺贝尔经济奖得主、计算机科学家赫伯特·西蒙（Herbert Simon）发明的，叫“抢15”。玩法是在桌上摆上从1到9九张牌，两人轮流取牌，谁先拿到相加等于15的三张牌就获胜。


    比如如果对方手里已经有2和9，而你有1和7，现在该你走，你一定要拿4，否则下一把对方拿4就赢了。你可以尝试玩一下这个游戏，既要顾着自己又要盯着对方，相 当复杂。


    可是如果你换个视角，游戏就会变得非常简单！你只要把这九个数字排成一个九宫图，如下图所示——'
