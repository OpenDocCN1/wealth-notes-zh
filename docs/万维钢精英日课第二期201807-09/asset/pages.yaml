  md: '你可以说爱迪生在发明电灯的过程中做出了一个科学发现：金属铂在真空中的发热性质 —— 工程师客串了科学家。但爱迪生想要的不是这个，他想要的是物美价廉的电灯泡。


    铂丝的问题是电流太大。我们在高中都学过“欧姆定律”，电流 = 电压/电阻。铂的电阻很小，所以铂丝的电流就会很强。电流很强，灯泡外边的铜导线就必须做得很粗，这样用电灯照明就会很贵，人们就用不起。


    那要想降低电流，爱迪生一看欧姆定律，就知道必须选择电阻大的东西来代替铂丝。根据这个思路，他做了无数次实验，找到了竹丝。后来又使用了钨丝。


    那你说这是不是欧姆定律的伟大胜利呢？爱迪生的成功是不是一个工程师正确使用了柏拉图世界里的科学知识呢？


    不是。欧姆定律根本就不是柏拉图世界里的真理 —— 它是一个错误的定律。


    真实世界里没有哪个材料的电压和电流是成正比的。电阻根本就不是个常数，它跟温度有关，而温度又跟电流有关 —— 所以电阻跟电流有关！严格地说，欧姆并不是“发现”了欧姆定律
    —— 你大概可以说他是“发明”了欧姆定律。


    欧姆定律不是真理，它只是科学家提出的一个代替真实世界的“模型”。现代的哲学家都会告诉你，所谓科学理论其实都是模型。牛顿力学不是真理、爱因斯坦场方程也不是真理
    —— 它们都是柏拉图世界投射到我们这里的影子。


    模型都是错的，但是有些模型很有用。


    对爱迪生来说，欧姆定律是个有用的模型。根据这个模型，爱迪生去找到了竹丝。爱迪生并不关心欧姆定律是不是柏拉图世界里的真理，他关心的是能不能基于这个模型制造灯泡。


    这才是工程师和科学家的不同定位。人类探索发现和发明创造，都不是像柏拉图说的那样一步到位找到客观真理。科学家和工程师都是研究模型的人。科学家关心的是这个模型能不能更好地反应真实世界。工程师关心的是能不能用这个模型创造出东西来。


    工程师思维的大道，就是先创造一个好模型，然后想办法实现这个模型。模型是为了后来的产品实现而创造的，这就非常具有主观特色了。创造或者选择什么样的模型、怎么实现这个模型，这些都充满了工程师的个性。


    这是一种创造。就好像艺术创作一样。而且这个创造过程是一代一代的工程师们集体去做的，它会被积累成文化。


    爱迪生发明电灯的过程中，有很多的动作属于“试错” —— 不断尝试、直到好使为止。而现代工程学面对的东西实在太复杂，一点一点试验是不行的。所以现代工程学越来越依赖于模型
    —— 如果你最初的模型好，就可以在模型之上再建造模型，这么一层层下去。


    可以说，模型，是工程师们“想象的共同体”。


    可能要等到下一讲你才能彻底明白这句话的意思。我们要说一个最厉害的工程学模型：开关网络。它是现代计算机技术的基石。'
