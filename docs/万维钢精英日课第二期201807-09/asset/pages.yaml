  md: '# 日课195 |《激进包容》

    5:指挥官和“自己人”


    日课195 |《激进包容》5:指挥官和“自己人”


    今天咱们继续讲邓普西和布莱夫曼的《激进包容》这本书。


    职场上一直有个不足为外人道的规则，就是用...


    当一个指挥不动的领导人，真是难受啊。


    那么怎么才能把下属变成如臂使指的“自己人”呢？我们前面讲的“归属感”就是第一步。今天咱们再进一步，讲一讲上级的互相信任。


    人不是砖，不能你想起来哪用就随意往哪搬。想要让心甘情愿听你指挥，你跟他之间必须建立深厚的信任。


    # 1.危机


    2004年，邓普西作为美军第一装甲师的指挥官在巴格达驻防。他的部队一共有32000人，而这32000人已经在巴格达待了一年了。四月，邓普西的部队要和第一骑兵师进行一次换防，全队前往德国。巴格达条件非常危险而且艰苦，部队在这里几乎天天死人，而德国有美军的海外基地，回德国就跟回家一样。


    士兵们几乎是掰着手指头倒计时等着离开巴格达。


    然而就在换防正式结束的三天前，伊拉克突然爆发了一次大规模的武装起义，伊拉克政府和美军受到猛烈攻击，费卢杰被义军夺取，巴格达周围的好几个省都被拿下，整个巴格达相当于被隔绝了。面对这个突发事件白宫一头雾水，总统束手无策……当然“束手无策”这个词是我的主观判断。


    而这个时候，邓普西部队的一部分人已经回到德国了，剩下的都正准备走，接防的部队也有一部分已 udziel 巴格达。上级迟迟没有命令，邓普西该怎么办呢？


    面对这种混乱的危急局面，邓普西有句话，叫“bias for action”——行动偏好。指挥官遇到危急时刻必须先采取行动再说，在行动中寻求办法。行动，可能犯错，但要是不动、假装什么都没发生，那一定是错误。


    # 2.正常的军队和互信的军队


    《孙子兵法》里有一句话叫“上下同欲者胜”，但是正常的军队可不是这样的。拉帮结派上下离心才是正常的军队。1970年代，邓普西曾经带领过一支45人的小部队。这个部队虽然小，却已经分成了好几帮。美国人倒是不讲“老乡”关系，但是讲种族，黑人是一帮，白人是一帮。还有吸毒的是一帮，不吸毒的是一帮，队伍里没有什么是互信。


    # 3.“我有三个要求”


    回到2004年伊拉克的危机。我不知道美军的指挥系统有什么具体的规定，但是我感觉美军将领的上下级之间有事儿是可以商量的，下级可以跟上级讲条件，可以讨价还价。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '邓普西部队的家属们比总统向新闻界宣布提前三天得知了延期的消息。结果家属也表示理解 —— 他们至少感受到了部队没拿他们当外人。部队的士气算是维持住了。邓普西还把已经回到德国的1000多名士兵又调回了巴格达。


    结果90天之内，邓普西真的完成了任务。


    # | 由此得到


    怎样才能让团队有士气？我觉得今天这一讲的一个经验是，有个共同的任务去做，最能提升士气。我们看现在很多公司搞这团建那团建，罗辑思维从来不搞 —— 脱不花说全公司一起打硬仗就是团建。


    咱们再想想邓普西向上级提出的三个条件。要求队伍不拆，就是宣布“我的”人”。要求不待着不动，要主动出击，一方面是积极主动，一方面是有任务才有士气。要求提前通知家属，就是给“自己人”谋福利。而主动要的九十天限期，也给了士兵们一个奔头。


    邓普西的工作作风并不算特别严厉。他没有摆“虎躯一震，令行禁止”那种谱，也没指望自己一个眼神手下就心领神会。他不断地跟下级交流，尊重下级的意愿，他知道每个人理解和支持都得靠自己去争取。


    所以谁不想跟着这样的领导干？不行的领导只敢用自己人，厉害的领导能把任何人变成自己人。


