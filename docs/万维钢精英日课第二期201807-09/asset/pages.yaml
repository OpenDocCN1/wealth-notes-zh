  md: '# 日课203 | 启蒙与此时4:正常国家和资本主义国家（上）


    今天咱们继续讲启蒙运动，我要说一个特别大的问题，为此请允许我先说一个我儿子问的问题。


    我儿子在美国上小学，对中国历史没有什么了解。去年他三年级的时候，读了一本美国人写的儿童版二战史，其中讲到日本侵略中国的事。他一边读一边说日本人是坏人。而书中在这段历史之后，附有一张日本和中国的地图。我儿子震惊了。


    他问我，日本这么小，中国这么大，日本怎么能侵略得了中国呢？


    你能想象到我当时是一种什么情绪。我儿子还反复问我，中国人口是不是比日本多，我说多很多。


    孩子你哪里知道，你这个问题放在当年会把很多人给问哭的。无数仁人志士追问过这个问题：为什么当初中国那么弱。


    而如果你站在全球历史的高度，回答这个问题的正确思路不是中国为什么弱，而是日本为什么强。日本强是因为那时候日本已经不是原来的日本了——而中国还是原来的中国。日本进步了，而中国没有。


    过去三百年来人类历史的大主题，就是启蒙来到哪里，哪里就进步。启蒙首先发生在西方，所以西方先进步。日本比中国先西化，所以日本比中国进步。所以我们真正应该问的大问题不是关于中国和日本，而是关于启蒙运动本身——


    为什么启蒙运动首先发生在西方？


    中国在历史上曾经有很长的时间是全世界最发达的国家，为什么启蒙运动不是在中国先发生的呢？难道中国在宋朝的时候不就已经有了“资本主义萌芽”吗？


    传统的答案，是只要经济增长到一定程度就会发生资本主义和启蒙运动。但是戈德堡在《西方的自杀》这本书中论证，启蒙运动不会自然发生——从人性的角度，启蒙运动根本就*不应该*发生：启蒙运动是个“奇迹”。


    我们专栏前有一期叫《科学家的核心价值观》，是我给《思维简史》这本书写的序言，我经问过一个类似的问题——为什么科学没有起源于中国。我们的答案是科学是如此反常识的一个东西，没有科学是正常的，有科学是不正常的。


    现在学界并没有一个公认的理论说启蒙运动和资本主义是怎么来的。但是关于“正常的国家”*应该*什么样，学者们有一定的共识。咱们先考察一下正常国家都是什么样的，再看看启蒙运动和资本主义的发源地——英国——有多么不正常。


    # 1.流动土匪和静止土匪


    鲁迅先生有一句话，说中国历史上只有“想做奴隶而不得”的时代和“暂时做稳了奴隶”的时代。这句话听起来有点偏激，但是话语理不粗：正常国家本质上就是这样的。


    所谓国家，就是每个人都放弃一部分个人自由，来换取全社会的安全的这么一个机制。那你说放弃一部分自由也不见得就是奴隶啊？你看卢梭的《社会契约论》、霍布斯的《利维坦》，都不都是说国家是一个“契约”吗？是全社会的人在一起签一个协议，把权力交给国王或者民主机关，这哪里是奴隶了？


    这个理论好是好，可是你考察人类历史，没有哪个国家是签协议签出来、起源于契约的——也许美国可以算个例外。国家的 最基本基因，不是契约，而是暴力。更直接地说，就是“官”起源于“匪”。


    经济学家曼瑟尔·奥尔森（Mancur Olson）的理论是这样的。在原始采集狩猎时代，部落没什么财产，匪徒——我们干脆就叫“土匪”吧——是个简单的营生，赶上哪个部落洗劫一番就走，不需要什么管理。部落被洗劫了也就认倒霉，大不了下次咱们也洗劫别的部落。


    但是进入农业时代以后，这个流动土匪的模式就不行了。农业需要长远的规划。春天种下去的粮食秋天才能收获，在此期间你必须一直好好照顾这片土地。如果春天村子里来了一群土匪把男人全杀了，把财产全部抢夺一空，那么这个村子就不存在了，根本等不到秋天。对村庄来说这是致命打击，对土匪来说，下一次也没东西可抢了。所以就出现了“静止的土匪”。


    土匪跟农民一起定居下来。土匪不但不再掠杀鸡取卵式的洗劫，反而给农民提供安全保护，让农民能好好地完成种植和收获，可以有长期的计划。


    这种事情一直到近代边在发生。戈德堡说猖獗广泛，居然知道中国1920年代曾经有个著名土匪叫“白狼”，白狼是打家劫舍的流动土匪，百姓深受其害。后来军阀冯玉祥赶走了白狼，老百姓非常欢迎。但是冯玉祥本身也是个土匪，收很重的税——他唯一比白狼强的就是他是个静止的土匪。


    静止的土匪也是土匪，他们给百姓提供安全保障都是为了自己。但是只要秩序建立起来了，你再去追究土匪的初衷是为了自己还是为了人民，就没有意义了。


    而要实现高级治理，也就是建立国家，土匪的统治技术还必须升级，才能让百姓坐稳了奴隶——甚至心甘情愿做奴隶。


    # 2.战争、分工和法律


    国家不是自发产生的，是一个一个被土匪统治的部落兼并和联合的结果，主要方式是战争。一方面，战争能让大部落吞并小部落。另一方面，为了自卫，部落和部落也必须联合起来，有统一的调度，这些都要更高级的治理。


    黄仁宇在《中国大历史》这本书里说古代中国之所以非得讲统一，一定程度上是为了共同治理黄河的需要。这个具体的理由不一定通用，但是在全世界范围来说，外来威胁的确容易把一个地区的人团结起来，而最主要的外来威胁就是战争。罗胖在一期《罗辑思维》节目里也说过，抗日战争之前，中国老百姓只知道有乡土，不知道有国家——中国人的国家意识可以说是抗日战争打出来的。


    国家提供了长期的安全和秩序，个人财产得到保护，人民就会安定下来。人民一安定下来，马上就会出现一个现象，那就是劳动分工。私有财产就是一种分工：这块地属于你，你就在这块地上好好耕种，这就是一种分工。如果你知道你生产出来的东西不会被人抢走，你就愿意多生产一点儿拿去跟人交换。


    分工会带来商业的繁荣，商业的繁荣会使得人口进一步增加，进而导致进一步分工，进入一个良性循环。


    为了国家的长治久安，统治者还必须提供法律。书记系统是一个重大发明，有了书写系统，法律就可以条文化。条文化之后，法律就成了一个可以快速安装的软件。广阔国土上不同地区的人被这个软件连接起来，商业交易得到保护，形成一个巨大的合作网络。


    当然法律条文不能胡乱定，最好能符合人们已有 的风俗习惯。今天我们考察《汉谟拉比法典》，其中像“你打坏了别人的眼睛，你的一只眼睛也要被弄瞎”——也就是“以眼还眼”——这样的条文，很可能就是当时原本就有那样的风俗习惯。


    到这一步，你看，统治已经非常文明了。统治者又要抵御外敌、又要提供司法服务、有时侯赈灾施舍，哪里像是土匪了？中国皇帝是发自内心地相信老百姓都是“朕之赤子”，官员都是父母官。


    但是你不要忘了，如果统治者不掌握暴力，这一却都是幻影。


    # 3.“正常”的国家


    有法律、有劳动分工、统治者不杀鸡取卵，老百姓也可以长远打算，这样的国家似乎已经很完美了，但是其中有个重大问题。


    那就是凭什么是我统治你，而不是我统治你呢？有劳动分工就会有阶层差异，就会有贵族和底层。那谁当贵族谁当底层，是由什么决定的呢？


    咱们中国汉文帝时期就有学者问过这个问题。说高祖刘邦是凭借暴力夺得天下，那将来别人是否也可以通过暴力夺走刘家的天下？文帝没法回答这个问题。他总不能说那是因为我刘家拳头硬——你要不服你'
